شبکه «فاکس‌نیوز» اظهار داشت که با بنیامین نتانیاهو در باره توقف کمک سالانه ۴ میلیارد دلاری به اسرائيل به توافق رسیده است.", "image_url": "https://images.euronews.com/articles/stories/09/97/84/80/1200x675_cmsv2_56e55f43-71d3-59cd-a1a5-2714e9ff7d5c-9978480.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۲ آبان • ۱۹:۵۴"}, {"source": "BBC Persian", "title": "ترامپ از توقف کمک‌ آمریکا به اسرائیل خبر داد", "link": "https://www.bbc.com/persian/articles/c6kgl902rl09o?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ می‌گوید آمریکا ارسال سالانه حدود چهار میلیارد دلار کمک به اسرائیل را متوقف می‌کند.", "date_str": "2026-11-03T17:09:48+00:00", "hash": "9cc17a3ea27ef91f", "title_fa": "ترامپ از توقف کمک‌ آمریکا به اسرائیل خبر داد", "summary_fa": "دونالد ترامپ می‌گوید آمریکا ارسال سالانه حدود چهار میلیارد دلار کمک به اسرائیل را متوقف می‌کند. رئیس‌جمهور آمریکا گفت «ماه‌ها پیش» با نخست‌وزیر اسرائیل برای پایان دادن به این کمک به توافق رسیده است. حمایت آمریکا از اسرائیل در دوره دوم ریاست‌جمهوری آقای ترامپ موضوعی جنجالی بوده است. او در سخنانی غافلگیرکننده در روز انتخابات گفت دموکرات‌ها از این موضوع به‌عنوان «دستاویزی» برای حمله به جمهوری‌خواهان استفاده می‌کردند. بنیامین نتانیاهو در ژوئن گفته بود زمان آن رسیده که اسرائیل «از دریافت‌کننده کمک، به شریک تبدیل شود.» واشنگتن پذیرفته بود تا سال ۲۰۲۸ سالانه ۳/۸ میلیارد دلار به اسرائیل بفرستد ولی در عمل، به‌ویژه پس از حملات حماس، مبلغی بسیار بیشتر ارسال شده است. آقای ترامپ همچنین محدودیت‌هایی را لغو کرده است که به دلیل نگرانی از ویرانی‌ها در غزه بر برخی فروش‌های تسلیحاتی آمریکا به اسرائیل اعمال شده بود. گادی آیزنکوت، نامزد مخالفان دولت در اسرائیل، روز سه‌شنبه گفت توقف تدریجی کمک‌های آمریکا که آقای ترامپ اعلام کرده، نشان می‌دهد بنیامین نتانیاهو، نخست‌وزیر اسرائیل، باید کنار برود. آقای آیزنکوت در بیانیه‌ای گفت: «اینکه نهادهای دفاعی اسرائیل از تغییر در رابطه راهبردی ما از طریق رسانه‌ها و همزمان با مردم اسرائیل باخبر می‌شوند، نشان می‌دهد رفتار بنیامین نتانیاهو تا چه حد خطرناک است. دیگر نمی‌شود به او اعتماد کرد و باید جایگزین شود.» به گزارش رسانه‌های اسرائیلی، مقام‌های وزارت دارایی این کشور نیز از سخنان رئیس‌جمهور آمریکا، مبنی بر اینکه کمک نظامی به اسرائیل تا پایان سال میلادی قطع می‌شود، غافلگیر شده‌اند. به گزارش وب‌سایت خبری «والا»، یکی از این مقام‌ها گفت: «هیچ سند رسمی‌ای درباره پایان این کمک از دفتر نخست‌وزیر ارائه نشده بود. وزارتخانه از قصد پایان دادن به آن را داشت اما از این که قرار است این کار خیلی زود انجام شود، غافلگیر شد.»", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/b7f2/live/d911f8e0-d7a7-11f1-84dd-e55f4bec0ecd.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۲ آبان • ۲۰:۳۹"}, {"source": "Iran International", "title": "تحصن اعتراضی دانشجویان دانشگاه تهران و احضار ده‌ها دانشجو در سیستان و بلوچستان", "link": "https://www.iranintl.com/202611035912", "summary": "جمعی از دانشجویان دانشگاه تهران در اعتراض به بازداشت‌ها، احکام انضباطی و فشارهای امنیتی تحصن کردند. هم‌زمان، گزارش‌ها از احضار ده‌ها دانشجوی دانشگاه سیستان و بلوچستان به اداره اطلاعات و تعلیق تحصیلی تعدادی از آنان خبر می‌دهند.", "date_str": "2026-11-03T17:52:25+00:00", "hash": "4592a1fa13fe5c7d", "title_fa": "تحصن اعتراضی دانشجویان دانشگاه تهران و احضار ده‌ها دانشجو در سیستان و بلوچستان", "summary_fa": "جمعی از دانشجویان دانشگاه تهران در اعتراض به بازداشت‌ها، احکام انضباطی و فشارهای امنیتی تحصن کردند. هم‌زمان، گزارش‌ها از احضار ده‌ها دانشجوی دانشگاه سیستان و بلوچستان به اداره اطلاعات و تعلیق تحصیلی تعدادی از آنان خبر می‌دهند.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/efc319f78181257a469197017c5778403eec1892-749x493.jpg?rect=0,51,749,393&w=1200&h=630&q=66&fit=max&auto=format", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۲ آبان • ۲۱:۲۲"}, {"source": "Iran International", "title": "استقلال ۱-۰ الشمال؛ داستان تکراری؛ یاسر آسانی، سهراب و آبی‌ها را نجات داد", "link": "https://www.iranintl.com/202611039981", "summary": "تیم فوتبال استقلال در هفته چهارم لیگ نخبگان آسیا، الشمال قطر را در استادی sh": "0df52afa67c45d58", "title_fa": "ترامپ حمله ارتش آمریکا به قشم را تایید کرد", "summary_fa": "دونالد ترامپ، رییس‌جمهور آمریکا، روز سه‌شنبه ۱۲ آبان تایید کرد که ارتش این کشور شامگاه دوشنبه حملاتی را علیه یک تاسیسات پدافند هوایی ایر ... دونالد ترامپ، رئیس‌جمهور آمریکا، روز سه‌شنبه ۱۲ آبان تایید کرد که ارتش این کشور شامگاه دوشنبه حملاتی را علیه یک تاسیسات پدافند هوایی ایران انجام داده است. ترامپ در گفت‌وگوی تلفنی با برنامه «فاکس اند فرندز» شبکه فاکس‌نیوز گفت آمریکا پس از تکمیل ساخت یک تاسیسات پدافند هوایی از سوی ایران، آن را هدف قرار داده است. او گفت: «آن‌ها یک تاسیسات ضد هوایی ساخته بودند... به‌محض اینکه ساخت آن به پایان رسید، دیشب به‌خوبی آن را هدف قرار دادیم.» رئیس‌جمهور آمریکا این حمله را «محدود» توصیف کرد. پیش‌تر وال‌استریت ژورنال و سی‌ان‌ان گزارش داده بودند که حملات شامگاه دوشنبه به جزیره قشم و سامانه‌های پدافند هوایی آن انجام شده و هدف از این عملیات، حفاظت از نیروها و تجهیزات نظامی آمریکا در منطقه بوده است. ترامپ در بخش دیگری از این گفت‌وگو بار دیگر احتمال اقدام نظامی علیه ایران را مطرح کرد و گفت: «من به دنبال کشتن شمار زیادی از افراد نیستم؛ اما اگر مجبور شویم، این کار را خواهیم کرد.» این اظهارات در شرایطی مطرح می‌شود که کشورهای منطقه خود را برای احتمال از سرگیری حملات آمریکا پس از انتخابات میان‌دوره‌ای این کشور آماده می‌کنند. با این حال، ترامپ روز دوشنبه درباره احتمال از سرگیری حملات پس از انتخابات ابراز تردید کرده و گفته بود معتقد است تهران خواهان دستیابی هرچه سریع‌تر به توافق است. او احتمال دستیابی به چنین توافقی را نیز منتفی ندانسته بود. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/2_lTtq__v1024x512__box_0%2C0%2C1400%2C736.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۲ آبان • ۱۹:۰۲"}, {"source": "Euronews Persian", "title": "آمریکایی‌ها برای انتخابات میان‌دوره‌ای کنگره آمریکا به پای صندوق‌ها می‌روند", "link": "https نی در تبعید، هنگام دریافت جایزه «آکیرا کوروساوا» از سی‌ونهمین جشنواره بین‌المللی فیلم توکیو، با اشاره به صد ... مراسم اختتامیه این جشنواره شامگاه دوشنبه ۱۱ آبان۱۴۰۵ برگزار شد و جایزه آکیرا کوروساوا به‌طور مشترک به محمد رسول‌اف و «او میپو» (O Mipo)، کارگردان ژاپنی، اهدا شد. رسول‌اف در نشست خبری جشنواره با اشاره به فشارهای امنیتی و قضایی بر سینماگران ایرانی گفت : «البته که سینمای ایران همچنان با سرکوب روبه‌روست و دوستان و همکاران من تحت فشارهای سنگینی قرار دارند.» او در ادامه به حکم جدید جعفر پناهی اشاره کرد و گفت: «همین چند روز پیش، حکم دیگری علیه جعفر پناهی که سال گذشته برنده نخل طلای کن شد صادر شده: پنج سال زندان دیگر و مصادره اموالش.» این کارگردان ایرانی تاکید کرد که با وجود فشارها، بسیاری از فیلم‌سازان ایرانی مصمم هستند به جای استفاده از استعاره برای عبور از محدودیت‌های حکومتی، روایت‌های خود را به‌صورت مستقیم بیان کنند و در برابر صاحبان قدرت بایستند. رسول‌اف همچنین از دشواری پذیرش این جایزه در شرایط کنونی ایران سخن گفت و افزود: «نمی‌توانم میان شادی‌ام و اندوه عمیقم نسبت به وضعیت ایران تعادلی بیابم، شرایط اصلاً آسان نیست.» او با اشاره به وضعیت مردم ایران ادامه داد: «مردمی که از یک سو با اعدام‌های روزانه و از سوی دیگر با حملات موشکی و بمباران روبه‌رو هستند؛ مردمی که زندگی‌ای سرشار از خشونت و بسیار بسیار دشوار را سپری می‌کنند.» رسول‌اف که خود به دلیل فشارهای قضایی و امنیتی جمهوری اسلامی ناچار به ترک ایران شده است، سخنانش را با آرزوی برقراری صلح در ایران و سراسر جهان به پایان رساند. «او میپو»، دیگر برنده جایزه آکیرا کوروساوا، نیز در این مراسم از بازگشت به کارگردانی پس از وقفه‌ای ۹ ساله برای بزرگ کردن دو پسرش سخن گفت. هر یک از این دو کارگردان در مراسم اختتامیه", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D9%85%D8%AD%D9%85%D8%AF-%D8%B1%D8%B3%D9%88%D9%84-%D8%A7%D9%81_wcKJ__v1024x512__box_0%2C0%2C1488%2C782.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["سینما"], "datetime_fa": "۱۲ آبان • ۱۷:۴۱"}, {"source": "IranWire", "title": "محسن رضایی: پاسخ آمریکا به مطالبات جمهوری اسلامی قانع‌کننده نبود", "link": "https://iranwire.com/fa/news-1/159749-%D9%85%D8%AD%D8%B3%D9%86-%D8%B1%D8%B6%D8%A7%DB%8C%DB%8C-%D9%BE%D8%A7%D8%B3%D8%AE-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D8%A8%D9%87-%D9%85%D8%B7%D8%A7%D9%84%D8%A8%D8%A7%D8%AA-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D9%82%D8%A7%D9%86%D8%B9%DA%A9%D9%86%D9%86%D8%AF%D9%87-%D9%86%D8%A8%D9%88%D8%AF/", "summary": "محسن رضایی، دبیر شورای عالی امنیت ملی جمهوری اسلامی، روز سه‌شنبه ۱۲ آبان اعلام کرد پاسخ آمریکا به مطالبات و حقوق جمهوری اسلامی قانع‌کنند ...", "date_str": "2026-11-03T14:54:33+00:00", "hash": "00d0758a912270bb", "title_fa": "محسن رضایی: پاسخ آمریکا به مطالبات جمهوری اسلامی قانع‌کننده نبود", "summary_fa": "محسن رضایی، دبیر شورای عالی امنیت ملی جمهوری اسلامی، روز سه‌شنبه ۱۲ آبان اعلام کرد پاسخ آمریکا به مطالبات و حقوق جمهوری اسلامی قانع‌کنند ... رضایی در پیامی در شبکه اجتماعی ایکس نوشت آمریکا باید به‌طور صریح و کامل به هفت شرط جمهوری اسلامی پاسخ دهد و آن‌ها را اجرا کند. او تاکید کرد تا زمانی که این شروط محقق نشوند، تنگه هرمز باز نخواهد شد. این اظهارات در حالی مطرح می‌شود که جی‌دی ونس، معاون دونالد ترامپ، هفته گذشته نامه‌ای به محسن رضایی ارسال کرده بود. هنوز گزارشی از پاسخ رضایی به این نامه منتشر نشده است. عباس عراقچی، وزیر امور خارجه جمهوری اسلامی، روز دوشنبه گفته بود چون نامه ونس خطاب به دبیر شورای عالی امنیت ملی نوشته شده، تصمیم‌گیری درباره پاسخ به آن بر عهده رضایی است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B1_YHWg__v1024x512__box_0%2C30%2C1200%2C661.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱۲ آبان • ۱۸:۲۴"}, {"source": "Euronews Persian", "title": "سیل ناگهانی جنوب غربی آمریکا را ویران کرد؛ خانه‌ها و خودروها را برد", "link": "https://parsi.euronews.com/video/2026/11/03/flash-floods-ravage-the-us-southwest-sweeping-away-homes-and-vehicles", "summary": "سیلهای ناگهانی در       tech: [{"source": "TechCrunch AI", "title": "Netflix’s new AI Discover tab helps you find something to watch based on your mood", "link": "https://techcrunch.com/2026/11/03/netflixs-new-ai-discover-tab-helps-you-find-something-to-watch-based-on-your-mood/", "summary": "The first experimental feature under the tab will allow users to get recommendations based on what they're currently in the mood for.", "date_str": "2026-11-03T18:42:16+00:00", "hash": "d2d016121febdb92", "title_fa": "تب جدید AI Discover Netflix به شما کمک می کند تا بر اساس روحیه خود چیزی برای تماشا پیدا کنید", "summary_fa": "اولین ویژگی آزمایشی در زیر برگه به ​​کاربران اجازه می‌دهد تا بر اساس آنچه در حال حاضر در حال و هوای آن هستند، توصیه‌هایی دریافت کنند. نتفلیکس روز سه شنبه اعلام کرد که در حال راه اندازی یک تب جدید AI Discover است که در آن کاربران می توانند راه های جدیدی را برای یافتن ساعت بعدی خود آزمایش کنند. اولین ویژگی آزمایشی که در زیر برگه راه‌اندازی می‌شود به کاربران این امکان را می‌دهد تا بر اساس آنچه در حال حاضر در حال و هوای آن هستند، توصیه‌هایی دریافت کنند. کاربران می توانند بر اساس حال و هوای خود، ترجیحات مشاهده، مدت زمانی که در اختیار دارند، یا موارد جدید و پرطرفدار، از میان تم های انتخاب شده، کلیپ هایی از نمایش ها و فیلم ها را انتخاب کنند. مضامین شامل چیزی سبک، ترساندن من، شب فیلم خانوادگی، ساعت‌های سریع و موارد دیگر است. اضافه شدن تب جدید نشان می دهد که نتفلیکس می خواهد کتابخانه رو به رشد خود را برای پیمایش آسان تر کند و در عین حال کشف را از تجربه ای که در آن کاربران بی پایان در عناوین به سمت تجربه شخصی تر و مجهز به هوش مصنوعی حرکت می کنند، دور می کند. نت‌فلیکس می‌گوید AI Discover از یک لایه هوشمند جدید ساخته شده است که به آنچه کاربران در زمان واقعی به پلتفرم می‌گویند پاسخ می‌دهد و به یادگیری ادامه می‌دهد. هنگامی که کاربران موضوعی را انتخاب کردند، توصیه های منطبق را مشاهده خواهند کرد. آنها همچنین این گزینه را دارند که تم های خاص تری را انتخاب کنند تا بتوانند به جستجو ادامه دهند تا زمانی که چیزی را که به آن علاقه دارند پیدا کنند، یا گزینه دیگری را برای شروع دوباره انتخاب کنند. ه  quality, size, and design. It s smaller than the prior-gen Nest Audio , making it easy to place anywhere in your home. However, despite its small size, it produces loud, clear audio with 360-degree sound. Our own David Pierce even found it sounded cleaner, louder, and sharper than Amazon s similarly priced Echo Dot Max , though Tuohy preferred the latter s fuller sound and stronger bass. The older Nest Audio still sounds better overall, but Google’s latest speaker takes up less space and costs slightly less. The Google Home Speaker also offers a few useful smart home upgrades. It supports Matter and includes a Thread border router, allowing you to connect and control a wide range of compatible smart home devices. It s also the first Google smart speaker that can double as an audio output for the Google TV Streamer 4K , letting you play TV audio through one or two speakers instead of your TV s built-in speakers. Tuohy found it worked well and delivered clear dialogue, though sound quality varied depending on what she was watching. One of its most notable features is support for Gemini, which is also available on older Google speakers and is much better at understanding natural language and complex requests than the old Google Assistant. In her testing, Tuohy found it could handle multiple smart home commands at once and respond to conversational requests, like turning down the air conditioner when she mentioned feeling too hot. It s also particularly impressive at answering general knowledge questions, though it can be slow and unreliable at times. Keep in mind, too, that some features require a $10-a-month Google Home Premium subscription , including Gemini Live, which lets you have extended conversations with the assistant without repeating the wake word. Read our Google Home Speaker review .", "date_str": "2026-11-03T18:11:49+00:00", "hash": "9b03e51acf9eaa75", "title_fa": "اسپیکر خانگی جمینی گوگل در حال حاضر با 20 درصد تخفیف به فروش می رسد", "summary_fa": "ما از seemingly endless rollout of new devices, including two new Apple Watches: the Series 12 and the Ultra 4. All things considered, these watches offer only minor upgrades over the previous models, shipping with new heart rate monitors and the latest S11 processor. But one of the biggest new watch features, \"Audio Intelligence,\" is also the most controversial and it's rolling out in beta today . What is Audio Intelligence? Audio Intelligence is Apple's branding for a new set of features exclusive to the Series 12 and Ultra 4. These features use the new Apple Watches' hardware, along with on-device and cloud-based AI, for tasks like sound and music identification as well as dictation. \"Sound Recognition\" can alert you to important sounds, like alarms and doorbells, while \"Music Recognition\" can automatically display songs playing around you but these aren't the features you'll hear talked about in discussions of Audio Intelligence. Rather, everyone is up in arms about \"Live Rewind\" and \"Siri Recap.\" These Audio Intelligence features passively \"listen\" to your conversations throughout the day, and, using AI, deliver summaries of what was said. When you double-click your Apple Watch's crown to use Live Rewind, you'll get a loose transcript of the last 15 seconds of conversation it overheard, while Siri Recap can show summaries of all your in-person chats throughout the day. You can even configure a schedule for when your watch is \"listening\" for recaps e.g., only run during work hours. Apple suggests each is intended to help jog your memory; maybe you use Siri Recap to remember important discussions you had that morning, while Live Rewind is meant for moments where you forget what someone just said. (As opposed to asking them to repeat themselves, I suppose.) These features sparked some controversy following their announcement , since the idea of Apple Watches quietly recording everything said throughout the day doesn't sit well with many people. Apple is adamant, however, that Audio Intelligence preserves your privacy. The company emphasizes that the Apple Watch never actually records anything; instead, it processes an audio stream through the Secure Enclave, a part of the S11 chip that even watchOS itself can't access, before sending it to your iPhone's Secure Enclave for further processing. This lets your Apple Watch produce both transcripts (Live R", "date_str": "2026-11-03T18:00:00+00:00", "hash": "526849b09aad9fdd", "title_fa": "چگونه «هوش صوتی» را در اپل واچ زودتر امتحان کنیم", "summary_fa": "سال بزرگی برای اپل بوده است. مدیر عامل جدیدی وجود دارد، قیمت‌ها در کل افزایش یافته است، و به ظاهر بی‌پایان دستگاه‌های جدید عرضه می‌شوند، از جمله دو اپل واچ جدید: سری 12 و اولترا 4. با در نظر گرفتن همه موارد، این ساعت‌ها فقط ارتقاهای جزئی را نسبت به مدل‌های قبلی ارائه می‌دهند و با نمایشگرهای ضربان قلب جدید و آخرین پردازنده S11 عرضه می‌شوند. اما یکی از بزرگ‌ترین ویژگی‌های ساعت جدید، «هوش صوتی» نیز بحث‌برانگیزترین ویژگی است و امروز در نسخه بتا عرضه می‌شود. هوش صوتی چیست؟ Audio Intelligence نام تجاری اپل برای مجموعه جدیدی از ویژگی‌های منحصر به فرد سری 12 و Ultra 4 است. این ویژگی‌ها از سخت‌افزار ساعت‌های جدید اپل، همراه با هوش مصنوعی روی دستگاه و مبتنی بر ابر، برای کارهایی مانند شناسایی صدا و موسیقی و همچنین دیکته استفاده می‌کنند. «تشخیص صدا» می‌تواند به شما در مورد صداهای مهم مانند زنگ هشدار و زنگ درها هشدار دهد، در حالی که «تشخیص موسیقی» می‌تواند آهنگ‌هایی را که در اطراف شما پخش می‌شوند به‌طور خودکار نمایش دهد، اما اینها ویژگی‌هایی نیستند که در بحث‌های هوش صوتی درباره آن صحبت می‌کنید. در عوض، همه در مورد \"Live Rewind\" و \"Siri Recap\" در آغوش هستند. این ویژگی‌های هوش صوتی در طول روز به طور غیر فعال به مکالمات شما گوش می‌دهند و با استفاده از هوش مصنوعی، خلاصه‌هایی از آنچه گفته شده را ارائه می‌دهند. وقتی برای استفاده از Live Rewind روی تاج اپل واچ خود دوبار کلیک می‌کنید، یک متن از ۱۵ ثانیه آخر مکالمه‌ای که شنیده‌اید را دریافت خواهید کرد، در حالی که Siri Recap می‌تواند خلاصه‌ای از تمام چت‌های حضوری شما در طول روز را نشان دهد. ح  کمک می‌کند تا تست‌های امنیتی هوش مصنوعی را خودکار کنند، خریداری خواهد کرد. غول امنیت سایبری CrowdStrike در حال خرید دو شرکت امنیتی هوش مصنوعی است که محصولات خود را برای نظارت، آزمایش و پوشش گسترده‌تر مدل‌ها و عوامل هوش مصنوعی توسعه می‌دهند، زیرا شرکت‌ها در سراسر صنایع شروع به عرضه عمده‌فروشی عوامل و مدل‌های هوش مصنوعی می‌کنند. طبق گزارش وال استریت ژورنال، این شرکت حدود 400 میلیون دلار برای Fiddler AI و حدود 95 میلیون دلار برای Dreadnode پرداخت کرده است. این معاملات در زمانی اتفاق می‌افتد که تحولات قابل توجهی در فضای امنیت سایبری رخ می‌دهد، به خصوص که سیاست‌ها و فرآیندهای شرکت‌ها از پذیرش هوش مصنوعی در دیوارهایشان عقب مانده است. تیم ها و کارمندان به طور یکسان در حال آزمایش با ابزارهای هوش مصنوعی، خودکارسازی گردش کار، برنامه های سفارشی کدگذاری vibe، و استقرار ارتشی از عوامل هوش مصنوعی برای انجام دستورات خود هستند، که به طور قابل درک باعث ایجاد سردرد برای تیم های امنیتی می شود. CrowdStrike، که محصولات آن به طور گسترده در بین شرکت‌ها و دولت‌ها استفاده می‌شود، به وضوح در تلاش است تا از قدرت و حضور قابل توجه خود استفاده کند تا سهمی از این بازار به سرعت در حال رشد را به خود اختصاص دهد. البته این تنها نیست، زیرا قبلاً شاهد بوده ایم که چندین استارت آپ و فروشنده امنیت سایبری ده ها میلیون بودجه برای حل مشکلات شرکت ها جمع آوری کرده اند، اگرچه اکثر این رویکردها اساساً مبتنی بر این اعتقاد هستند که نرم افزار امنیتی موجود برای نظارت و کنترل ابزارها، اتصالات یا استفاده هوش مصنوعی کافی نیست. این شرکت خودش در حال ساخت کنترل‌های تشخیص و پاسخ است که فالکون گاردین نامیده می‌شود تا به شرکت‌ها", "image_url": "https://techcrunch.com/wp-content/uploads/2026/11/GettyImages-2281430305.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "عامل‌های هوشمند", "سرمایه‌گذاری"], "datetime_fa": "۱۲ آبان • ۲۱:۲۶"}, {"source": "Ars Technica", "title": "Google dismantles botnet secretly running on 1.3 million Android TV boxes", "link": "https://arstechnica.com/google/2026/11/google-dismantles-botnet-secretly-running-on-1-3-million-android-tv-boxes/", "summary": "Google's Threat Intelligence Group says it has shut down a massive botnet called x.cpe. At its height, x.cpe ran on more than 1.3 million Android TV devices, and unusually, these were Google-certified boxes. Google says its screening process missed the malware due to \"obfuscation techniques\" employed by Shenzhen-based Videostrong Technology. In a detailed blog post , the Threat Intelligence Group explains how the x.cpe botnet evolved quickly from a single-stage dropper into a modular three-stage malware platform that sold access to third parties. Manufacturers must have their devices certified if they want access to Google apps and branding, a process that is supposed to catch threats like this. However, Videostrong's compromised boxes, mostly sold under the MECOOL brand, evaded detection by using a backdoor to remotely install the malware after the devices were set up and online. After devices appeared online, a stub application called x.cpe or com.oemservice would phone home. This package did not have any malicious capabilities of its own, but it had the system-level permissions necessary to install malware modules at the operator's behest. It also disabled Play Protect, which would have otherwise flagged the silently installed packages as malicious. Read full article Comments", "date_str": "2026-11-03T17:08:21+00:00", "hash": "18ea687f3722bae3", "title_fa": "گوگل بات نت را که به طور مخفیانه بر روی 1.3 میلیون باکس Android TV اجرا می شود، از بین می برد", "summary_fa": "گروه اطلاعاتی تهدید گوگل می گوید بات نت عظیمی به نام x.cpe را تعطیل کرده است. در اوج خود، x.cpe روی بیش از 1.3 میلیون دستگاه Android TV اجرا می‌شد و به‌طور غیرمعمول، این جعبه‌های دارای گواهی گوگل بودند. گوگل می گوید که فرآیند غربالگری آن بدافزار را به دلیل «تکنیک های مبهم سازی» به کار گرفته شده توسط فناوری Videostrong مستقر در شنژن از دست داده است. در یک پست وبلاگ مفصل، گروه هوش تهدید توضیح می دهد که چگونه بات نت x.cpe به سرعت از یک قطره چکان تک مرحله ای به یک پلت فرم بدافزار سه مرحله ای مدولار تبدیل شد که دسترسی را به اشخاص ثالث فروخت. اگر تولیدکنندگان می‌خواهند به برنامه‌ها و نام تجاری Google دسترسی داشته باشند، باید دستگاه‌هایشان را تأیید کنند، فرآیندی که قرار است تهدیدهایی مانند این را بگیرد. با این حال، جعبه‌های در معرض خطر Videostrong که عمدتاً با نام تجاری MECOOL فروخته می‌شوند، با استفاده از درب پشتی برای نصب از راه دور بدافزار پس از راه‌اندازی دستگاه‌ها و آنلاین شدن آن‌ها، از شناسایی فرار کردند. پس از اینکه دستگاه‌ها آنلاین شدند، یک برنامه خرد به نام x.cpe یا com.oemservice به خانه تلفن می‌زند. این بسته به خودی خود هیچ گونه قابلیت مخربی نداشت، اما مجوزهای سطح سیستم لازم برای نصب ماژول های بدافزار را به دستور اپراتور داشت. همچنین Play Protect را غیرفعال کرد، که در غیر این صورت بسته‌های نصب‌شده بی‌صدا را به‌عنوان مخرب پرچم‌گذاری می‌کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید گروه اطلاعات تهدید Google می گوید بات نت عظیمی به نام x.cpe را خاموش کرده است. در اوج خود، x.cpe روی بیش از 1.3 میلیون دستگاه Android TV اجرا می‌شد و به‌طور", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/mecool-malware.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۱۲ آبان • ۲۰:۳۸"}, {"source": "Ars Technica", "title": "This space company is betting its future on a propellant available everywhere", "link": "https://arstechnica.com/space/2026/11/this-space-company-is-betting-its-future-on-a-propellant-available-everywhere/", "summary": "Robert, Ryan, and Kirby Carlisle are three engineers who worked at SpaceX during the Falcon 9 era, seeing the revolution in the global launch industry from the inside. The brothers launched rockets, refurbished rockets, and sold rockets. But when it came time for them to leave SpaceX and start their own space company—a lifetime dream for the Carlisle brothers—they chose not to build rockets. Rather, they focused on spacecraft. In late 2022, the three ss Insider reporters who participated in 2026 take you inside the iconic race. On Sunday, November 1, nearly 60,000 runners took part in the 2026 NYC Marathon, starting in Staten Island and crossing the finish line 26.2 miles later in Central Park. It's not easy — or cheap — to get in. The odds of gaining entry through the general drawing are about 1%. New Yorkers can secure a spot through the \"9+1\" program, which requires completing nine NYRR races and volunteering at one. Charity bibs are another option, often requiring runners to raise thousands of dollars, and a select few can earn a spot with a qualifying time. If you're lucky enough to get your hands on a bib, registration will still cost upward of $300. In 2026, the fee was $333.11 . It is also a major feat of preparation and training in the months leading up to the event. My colleague Noah Sheidlower and I were among the runners who took on the five-borough race this year. Here's what it was like. The TCS New York City Marathon begins in Staten Island. Courtesy of Noah Sheidlower Transit to the start begins as early as 5 a.m. The race falls on the first Sunday of every November, coinciding with the end of daylight saving time. The extra hour of sleep makes a difference when your alarm is set to go off in the 3s or 4s. Noah and I take a bus from Midtown. The lines are long, but organized. Runners board the Midtown Manhattan bus before the sun comes up. Noah Sheidlower There's also a bus from MetLife Stadium, and many runners take the Staten Island Ferry. The ferry ride, while cold, offers an epic flyby of the Statue of Liberty. After arriving in Staten Island and going through security, we have a few hours to kill before the gun goes off. This year, temps are in the low 40s at the start. Runners bring blankets and wear layers they can shed at the start line. Runners bundle up to stay warm in the starting village. Volunteers may even lend you a pair of gloves if you ask. Kathleen Elkins There's coffee and ba ems are bound to arise. Kidd looks for leaders who can anticipate issues, take ownership, and find a solution. Those employees show they aren't waiting around for problems to land in their lap. They're actively taking initiative to improve the workplace. Try it today The next time an issue comes up at work, take a few minutes to brainstorm possible solutions. When you approach your manager, tell them what went wrong, a couple of possible solutions, and your recommendation for what to do next. That demonstrates leadership and initiative. The bottom line You aren't directly responsible for every problem that comes up at work. However, by showing your boss that you're actively working to avoid adding another task to their to-do list, you're helping make their job easier and showing them that you can handle more responsibility. Source This insight is based on Business Insider's reporting about how Chipotle's COO Jason Kidd promotes workers, and the qualities he looks for. Read the full story from Ana Altchek on Business Insider . Has this framework for dealing with problems worked for you? Tell us what you think of this advice in the comments below. Read the original article on Business Insider", "date_str": "2026-11-03T17:00:54+00:00", "hash": "b63d83b36b18649d", "title_fa": "مدیر ارشد اجرایی Chipotle می گوید که او به دنبال این مهارت حل مسئله در رهبران آینده است", "summary_fa": "مدیر ارشد اجرایی Chipotle به دنبال مهارت های حل مسئله در کارگرانی است که آنها را ارتقا می دهد. چیپوتل، آنا آلچک؛ Alyssa Powell/BI نکته امروز برای بهتر شدن در کار: در نشان دادن پتانسیل رهبری خود بهتر شوید. مدیر عملیات Chipotle، جیسون کید، گفت که او به دنبال ارتقای کارگرانی است که مشکلات را حل می کنند. به‌جای اینکه با رئیس‌تان مشکلی پیش بیاید، با راه‌حل وارد گفتگو شوید. بهتر شدن در: نشان دادن پتانسیل رهبری حرکت امروز اگر می‌خواهید ارتقا پیدا کنید، فقط مشکلات رئیس خود را مطرح نکنید - وقتی مشکلی پیش آمد با راه‌حل‌های احتمالی به سراغ آنها بروید. جیسون کید، مدیر عملیات Chipotle، هر هفته تقریباً از ده es have risen by 71% on average. Almost every US state recorded its highest-ever diesel prices this fall, with the exception of Rhode Island, Massachusetts, and New York, which saw higher prices in 2022, when Russia's invasion of Ukraine sent global fuel prices soaring. A White House spokesperson told Business Insider that once the conflict in the Middle East ends, gas prices will \"drop drastically,\" adding Iran also \"will not have a nuclear weapon.\" \"Thanks to the exceptional work of the US military, more oil is now flowing out of the Persian Gulf than before the Iran conflict began,\" the spokesperson said. To see how fuel prices have risen across the US, Business Insider used AAA data to compare today's gas prices with those a year ago. We ranked all US states by the percentage increase in regular prices, which most people see at the pump . We also listed the rise in diesel prices in each state to provide a fuller picture. See how prices have risen in every US state in the past year, ranked from lowest to sharpest rise. 50. Washington M. Scott Brauer/Bloomberg via Getty Images Regular gas price today : $5.19 a gallon Regular gas price increase: 21.2% ($0.91) from a year ago Diesel gas price today : $7.25 a gallon Diesel gas price increase: 45.6% ($2.27) from a y", "date_str": "2026-11-03T16:04:23+00:00", "hash": "6f49b8bf6309a2e0", "title_fa": "قیمت گاز می تواند میان مدت ها را شکل دهد. ایالت های آمریکا را ببینید که در آن قیمت ها بیشترین افزایش را داشته اند.", "summary_fa": "در 42 ایالت، قیمت بنزین امروز بیش از یک دلار بیشتر از یک سال قبل است. چارلز-مک کلینتوک ویلسون/نورعکس از طریق گتی ایماژ افزایش قیمت بنزین از آغاز جنگ ایران یک موضوع کلیدی در میان دوره ای 2026 است. از سال گذشته، قیمت گاز معمولی 40 درصد و قیمت گازوئیل 71 درصد در سراسر ایالت ها افزایش یافته است. میشیگان، ایالت میدان نبرد کلیدی، پس از ویسکانسین شاهد دومین افزایش شدید قیمت بنزین بود. برای بسیاری از رای دهندگان، انتخاب آنها در انتخابات میان دوره ای می تواند به یک چیز ختم شود: درد در پمپ. از زمان ار خودروهای برقی آفریقا با اجرای آزمایشی یک پلت‌فرم دو چرخ الکتریکی یکپارچه محلی در کنیا، با پتانسیل گسترش در سراسر آفریقای شرقی است. با توجه به بخش حذف شده، انتظار می‌رفت که همچنین روی طرح‌های باتری ماژولار کار کند، شارژ EV را توزیع کند و برای توسعه یک موتورسیکلت الکتریکی هدفمند برای سواران آفریقایی برنامه‌ریزی کند. به نظر می رسد فرصت موتورسیکلت های برقی در این قاره که بازار بزرگی برای دو چرخ دارد، رسیده است. شرکت حمل و نقل آفریقایی اسپیرو اخیراً اعلام کرده است که بیش از 130000 موتورسیکلت برقی در هفت کشور جهان به همراه 2500 ایستگاه تعویض باتری دارد. این رونق باعث جلب توجه شرکت‌های حمل‌ونقل چینی و سرمایه‌گذاران شده است که منابع را به فضا می‌ریزند. در یک ایمیل در سپتامبر، همچنین به TechCrunch گفت که این پروژه را با یک شریک ناشناس مورد بررسی قرار داده است، اما در نهایت تصمیم گرفت پس از تکمیل مراحل اولیه، بر روی نقشه راه اصلی خود تمرکز کند. همچنین گفت که کمک", "image_url": "https://techcrunch.com/wp-content/uploads/2025/10/Also-portal-screen.jpeg?resize=1200,900", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۱۲ آبان • ۲۰:۱۹"}, {"source": "TechCrunch Main", "title": "New York City’s Mamdani criticizes Madison Square Garden owner over surveillance tech", "link": "https://techcrunch.com/2026/11/03/new-york-citys-mamdani-criticizes-madison-square-garden-owner-over-surveillance-tech/", "summary": "The mayor's comments come after the entertainment giant's data breach last year, which exposed James Dolan's surveillance.", "date_str": "2026-11-03T16:04:55+00:00", "hash": "92110225404a19c0", "title_fa": "ممدانی شهر نیویورک از مالک مدیسون اسکوئر گاردن به خاطر فناوری نظارت انتقاد کرد", "summary_fa": "اظهارات شهردار پس از نقض داده های غول سرگرمی در سال گذشته است که نظارت جیمز دولان را افشا کرد. زهران ممدانی، شهردار نیویورک، از مالک مدیسون اسکوئر گاردن، یکی از بزرگ‌ترین مکان‌های تفریحی شهر انتقاد کرده و معتقد است که فناوری نظارتی این شرکت نباید مجاز باشد. ممدانی روز سه‌شنبه در مصاحبه با وایرد گفت که فناوری‌های نظارتی نشان‌دهنده بسیاری از اشتباهات امروز در کشور ما هستند. وی افزود که شاهانا حنیف، عضو شورای شهر، دو قانون محلی را با هدف ممنوعیت جمع آوری داده های بیومتریک، مانند استفاده از تشخیص چهره، در مکان های عمومی در سراسر شهر معرفی کرد. ممدانی گفت: پیش نویس قانون پاسخ مهمی به این گونه مسائل است. این اظهارات پس از جریانی از گزارش‌های Wired منتشر می‌شود که در آن جزئیات نحوه استفاده جیمز دولان، مالک مدیسون اسکوئر گاردن، به دوربین‌های نظارتی و فناوری اسکن چهره برای ردیابی افراد در داخل و خارج از مکان‌های برگزاری آن منتشر می‌شود. در یکی از گزارش‌ها، Wired فاش کرد که شرکت Dolan پایگاه داده‌ای را نگه می‌دارد که از جمله برخی از بازدیدکنندگان، از جمله هنرمندان مشهور، به دلایل نامشخص به عنوان LGBTQIA علامت‌گذاری می‌کند. دولان متعاقباً از Wired به دلیل گزارش آن شکایت کرد. در سال 2021، MSG پس از ممنوعیت حضور یک زن از رادیو سیتی، یکی دیگر از مکان‌های متعلق به دولان، پس از اینکه توسط سیستم‌های تشخیص چهره به‌عنوان وکیل یک شرکت حقوقی که از شرکت Dolan شکایت می‌کرد اما در این دعوی دخیل نبود، شناخته شد، خبرساز شد. هنگامی که TechCrunch به آن رسید، میکیل کوردووا، سخنگوی مدیسون اسکوئر گاردن، گفت: گزارش‌های Wired نادرست و نادرست است. MSG بدون ارائه مدرکی برای ادعای خود به دنبال راه حل های حقوقی است.", "image_url": "https://techcrunch.com/wp-content/uploads/2026/11/GettyImages-1160769930.jpg?resize=860,1200", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۲ آبان • ۱۹:۳۴"}, {"source": "Ars Technica", "title": "UEFI bootkit infected fully patched Windows machines. Is Microsoft to blame?", "link": "https://arstechnica.com/security/2026/11/uefi-bootkit-infected-fully-patched-windows-machines-is-microsoft-to-blame/", "summary": "In 2023, malware tracked as BlackLotus became the first publicly documented in-the-wild UEFI bootkit capable of bypassing Secure Boot on fully updated Windows 11 systems. With the industry-wide chain-of-trust mechanism subverted, the malware was able to run malicious code before Windows was fully loaded and many security defenses were operational. Microsoft had already patched the vulnerability that BlackLotus exploited in 2022. In 2023 and 2024, Microsoft issued additional updates. The first added a new certificate that no longer trusted the vulnerable boot managers. The second provided the means to revoke trust in the digital certificate used to sign older vulnerable Windows boot managers. The organizations infected by the new bootkit, which is tracked under the name BlackX, had installed all of these patches. So how did they fall victim? UEFI bootkit refresher Before discussing the incident further, a brief review of BlackLotus and UEFI malware is in order. Short for Unified Extensible Firmware Interface , UEFI is firmware that runs immediately after a computer is turned on. One of its main jobs is to load system configuration settings, identify and initialize hardware components, and prepare the computer to start its OS. Read full article Comments", "date_str": "2026-11-03T16:03:13+00:00", "hash": "84a51729d9a81e0c", "title_fa": "بوت کیت UEFI دستگاه های ویندوزی که کاملاً وصله شده بودند را آلوده کرد. آیا مایکروسافت مقصر است؟", "summary_fa": "در سال 2023، بدافزاری که به‌عنوان BlackLotus ردیابی می‌شود، اولین بوت‌کیت UEFI مستند شده عمومی شد که قادر به دور زدن Secure Boot در سیستم‌های ویندوز 11 به‌روزرسانی شده بود. با از بین رفتن مکانیزم زنجیره اعتماد در سراسر صنعت، بدافزار قادر به اجرای کدهای مخرب قبل از بارگیری کامل ویندوز و عملیاتی شدن بسیاری از دفاع های امنیتی بود. مایکروسافت قبلاً آسیب‌پذیری‌ای را که BlackLotus در سال 2022 از آن سوء استفاده کرده بود اصلاح کرده بود. در سال‌های 2023 و 2024، مایکروسافت به‌روزرسانی‌های اضافی را منتشر کرد. اولی گواهی جدیدی اضافه کرد که دیگر به مدیران بوت آسیب پذیر اعتماد نداشت. دومی ابزاری را برای لغو اعتماد به گواهی دیجیتالی که برای امضای مدیران بوت آسیب‌پذیر قدیمی‌تر ویندوز استفاده می‌شود، فراهم کرد. سازمان های آلوده به بوت کیت جدید، که تحت نام BlackX ردیابی می شود، همه این وصله ها را نصب کرده بودند. پس چگونه قربانی شدند؟ بازنگری بوت کیت UEFI قبل از بحث بیشتر در مورد این حادثه، بررسی مختصری از بدافزار BlackLotus و UEFI لازم است. UEFI که مخفف عبارت Unified Extensible Firmware Interface است، میان افزاری است که بلافاصله پس از روشن شدن رایانه اجرا می شود. یکی از کارهای اصلی آن بارگذاری تنظیمات پیکربندی سیستم، شناسایی و مقداردهی اولیه اجزای سخت افزاری و آماده سازی کامپیوتر برای راه اندازی سیستم عامل است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش در سال 2023، بدافزاری که به عنوان BlackLotus ردیابی می شود اولین بوت کیت UEFI وحشی است که قادر به دور زدن Secure Boot در سیستم های Windows 11 کاملاً به روز شده است. با از بین رفتن مکانیزم زنجیره اعتماد در سراسر صنعت، بدافزار قادر به اجرای کدهای مخرب قبل", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2020/10/malware-1000x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Microsoft", "امنیت سایبری"], "datetime_fa": "۱۲ آبان • ۱۹:۳۳"}, {"source": "Ars Technica", "title": "Trump wanted to give No Kings no air. Then, Meta suspended its Instagram.", "link": "https://arstechnica.com/tech-policy/2026/11/trump-wanted-to-give-no-kings-no-air-then-meta-suspended-its-instagram/", "summary": "Over the weekend, the No Kings Coalition said Meta declined to commit to taking steps to prevent automated systems from suspending one of Instagram's most prominent pro-democracy accounts if activity surged around the page during the midterm elections. A demand for action came after Meta apologized for temporarily suspending the No Kings Instagram account and disabling access for four hours at the peak of an early voting push from the group. In a post on X, Meta’s Andy Stone said the account had been using a Claude AI tool in a way that made it appear to be a bot. But even though automated review detected the error within an hour, Stone acknowledged that additional hurdles kept admins locked out. State and federal lawmakers—as well as a coalition of 14 attorneys general —have asked Meta to further explain its actions. In a letter to No Kings, Meta offered to arrange a meeting with a technical expert who could better explain the mistake. But No Kings rejected the response, saying it failed to address any of the group's ongoing concerns and requesting a meeting with Meta senior leadership instead. The group stressed that the issue goes beyond its Instagram account, saying that Americans who rely on Meta's platforms need assurance that voting content won’t be suppressed ahead of or on election day. Among eight questions, the coalition asked Meta to publicly disclose any communications with the Trump administration about the No Kings account or the historic early voting day event. Read full article Comments", "date_str": "2026-11-03T15:39:30+00:00", "hash": "2c02b40bf033d0eb", "title_fa": "ترامپ می‌خواست به No Kings هوا بدهد. سپس متا اینستاگرام خود را به حالت تعلیق درآورد.", "summary_fa": "در آخر هفته، ائتلاف بدون پادشاهان گفت متا از انجام اقداماتی برای جلوگیری از تعلیق سیستم‌های خودکار یکی از برجسته‌ترین حساب‌های دموکراسی‌خواه اینستاگرام در صورت افزایش فعالیت در سراسر صفحه در طول انتخابات میان‌دوره‌ای، خودداری کرد. درخواست برای اقدام پس از عذرخواهی متا به دلیل تعلیق موقت حساب اینستاگرام No Kings و غیرفعال کردن دسترسی به مدت چهار ساعت در اوج رای گیری زودهنگام از سوی گروه، مطرح شد. اندی استون از متا در پستی در X گفت که این حساب از ابزار هوش مصنوعی Claude استفاده می کرده است به گونه ای که به نظر می رسد یک ربات است. اما حتی اگر بررسی خودکار خطا را در عرض یک ساعت شناسایی کرد، استون اذعان کرد که موانع اضافی باعث قفل شدن ادمین‌ها می‌شود. قانونگذاران ایالتی و فدرال - و همچنین ائتلافی متشکل از 14 دادستان کل - از متا خواسته اند که اقدامات خود را بیشتر توضیح دهد. در نامه ای به No Kings، متا پیشنهاد داد تا با یک متخصص فنی که بهتر می تواند اشتباه را توضیح دهد، ملاقاتی ترتیب دهد. اما No Kings این پاسخ را رد کرد و گفت که نتوانسته است به هیچ یک از نگرانی‌های جاری گروه رسیدگی کند و به جای آن درخواست ملاقات با رهبری ارشد متا را داده است. این گروه تاکید کرد که این موضوع فراتر از حساب اینستا nced sleep apnea detection", "link": "https://www.engadget.com/2305182/samsung-galaxy-ring-gets-fda-approval-for-advanced-sleep-apnea-detection/", "summary": "Samsung s Galaxy Ring now offers more advanced sleep apnea detection following FDA approval of the new feature in July.3 replies", "date_str": "2026-11-03T14:21:14+00:00", "hash": "29aa12c52880b7f6", "title_fa": "حلقه گلکسی سامسونگ برای تشخیص پیشرفته آپنه خواب تاییدیه FDA را دریافت کرد", "summary_fa": "Galaxy Ring سامسونگ اکنون پس از تایید FDA از ویژگی جدید در ماه ژوئیه، تشخیص آپنه خواب پیشرفته تری را ارائه می دهد. پاسخ این ویژگی ارتقا یافته از هوش مصنوعی برای تشخیص تعداد اختلالات تنفسی برای هر ساعت خواب استفاده می کند. Samsung Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover، این شرکت اعلام کرد که حلقه گلکسی سامسونگ اکنون پس از تایید FDA از ویژگی جدید در ماه جولای، تشخیص آپنه خواب پیشرفته تری را ارائه می دهد. این ویژگی ممکن است به کاربران سرنخ‌های جدیدی در مورد اینکه چرا حتی پس از خواب شبانه احساس خستگی می‌کنند، بدهد. سامسونگ اولین بار در فوریه 2024 مجوز به اصطلاح De Novo FDA را برای تشخیص آپنه خواب در دستگاه های Galaxy Watch و Galaxy Ring دریافت کرد. (De Novo برای محصولات بهداشتی یا ویژگی هایی استفاده می شود که قبلاً هرگز در بازار وجود نداشته و هیچ خطری برای سلامتی کاربر ندارند.) تأیید اولیه فقط تشخیص علائم آپنه خواب متوسط ​​تا شدید را پوشش می دهد. نسخه جدید این کار را انجام می دهد، اما همچنین از هوش مصنوعی برای تشخیص فراوانی اختلالات تنفسی برای هر ساعت خواب استفاده می کند. به شرطی که حداقل پنج ساعت به مدت دو شب در یک دوره ده روزه بخوابید، برنامه Health Monitor سامسونگ می تواند به شما بگوید که آیا آپنه خواب خفیف، گاه به گاه یا مکرر دارید. سامسونگ اشاره می‌کند که فقط یک پزشک می‌تواند تشخیص درست آپنه خواب را انجام دهد، اما این دستگاه «می‌تواند به مکالمات سازنده با متخصصان مراقبت‌های بهداشتی منجر شود». هیچ یک از رقبای اصلی Galaxy Ring سامسونگ، Oura و Superhuman، تشخیص آپنه خواب مورد تایید FDA را ارائه نمی دهند. با این حال، هر دو می توانند اختلالات شبانه را که ممکن است نشانه هایی از این بیماری را نش regano, and a bay leaf. The recipe required very little prep. Paige Bennett I already had all of these things in my pantry, which meant I was off to a great start. Plus, this recipe didn't require much chopping, aside from about three cloves of garlic and one onion. Once those were chopped, I sautéed the onion and minced garlic in oil for about five minutes, then added the remaining ingredients. The sauce was done pretty quickly. Paige Bennett While the tomatoes and spices simmered together, I boiled some pasta. I made sure to occasionally stir my sauce so it wouldn't stick to the pan. In about 35 minutes, I had homemade marinara and pasta ready to go. The flavor was good, but I d prefer fresh herbs over dried ones. Paige Bennett This marinara was chunkier thanks to the tomato and onion. I liked the slightly sweet and herby flavors, but if I made this again, I'd follow Guarnaschelli's lead and stir in some fresh basil at the end. Though it would increase the cooking time, I would also sauté the onions a little bit longer than five minutes since they were chewier than I wanted. Still, this pantry-staple marinara is a great option for an impressive weeknight dinner — especially if you haven't had time to pick up", "date_str": "2026-11-03T14:22:44+00:00", "hash": "127167b5a1610f46", "title_fa": "من سس مارینارا را با استفاده از دستور پخت 4 سرآشپز مشهور درست کردم و بهترین آنها از Ina Garten تهیه شد.", "summary_fa": "من دستور العمل های سس را از چهار سرآشپز مشهور مختلف، از جمله تایلر فلورانس، گیادا دی لورنتیس، و اینا گارتن مقایسه کردم تا یک مارینارای جامد و قابل استفاده پیدا کنم که طعم خوشمزه ای نیز دارد. پیج بنت من سس های مارینارا را با استفاده از دستور العمل های سرآشپزهای مشهوری مانند الکس گوارناشلی و اینا گارتن درست کردم. سس Giada De Laurentis مزه ای از کرفس داشت که من دوست نداشتم و طولانی ترین زمان برای تهیه آن طول کشید. من عاشق طعم شیرین و غنی و گنجاندن شراب قرمز در دستور غذای مارینارای گارتن بودم. من عاشق یک کاسه پاستا ساده با یک مارینارای کلاسیک هستم، مخصوصاً وقتی سس آن خانگی باشد. مارینارای خانگی به اندازه کافی در یک شب شلوغ هفته درست می شود و از موادی مانند گوجه فرنگی (اغلب کنسرو شده)، پیاز، سیر، روغن زیتون و گیاهان استفاده می کند. در جستجوی دستور العمل سسی که می‌خواهم آن را درست کنم و تکرار کنم، دستور العمل‌هایی را از سرآشپزهای مشهور الکس گوارناشلی، تایلر فلورانس، گیادا د لاورنتیس و اینا گارتن امتحان کردم. در اینجا نحوه انجام آن است. مارینارای ساده فلورانس از لوازم اصلی انبارداری استفاده می کند. دستور تهیه سس مارینارا پیج بنت فلورانس، که در وب سایت شبکه غذا پیدا کردم، فقط حدود 30 دقیقه طول می کشد و برای طعم دادن به گیاهان خشک متکی است. دستور او شامل کنسرو گوجه فرنگی خرد شده، یک عدد پیاز، سیر خرد شده، شکر، نمک، فلفل، ریحان خشک، پونه کوهی خشک و یک برگ بو بود. دستور پخت نیاز به آماده سازی بسیار کمی داشت. پیج بنت من قبلاً همه این چیزها را در انبار داشتم، که به این معنی بود که شروع خوبی داشتم. علاوه بر این، این دستور غذا به خرد کردن زیادی نیاز نداشت، به غیر از حدود سه حبه", "image_url": "https://i.insider.com/6ae8f9ae426e175d4818d849?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۲ آبان • ۱۷:۵۲"}, {"source": "Business Insider", "title": "As a flight attendant, I wish passengers would leave the window shades open. I've got my reasons, but it's not up to me.", "link": "https://www.businessinsider.com/should-i-open-windows-in-air-flight-attendant-explains-why-2026-10", "summary": "Regardless of whether you feel the window shade should be open or shut during flight, I (not pictured) say the passenger in the window seat should get to control it. Dobrila Vignjevic/Getty Images As a flight attendant , I prefer open window shades — but the choice is up to those in window seats. I love watching the scenery and feel safer, as we all get more visibility into our surroundings. Unless we're stopped at a warm destination or the cabin is rowdy, I am team window shades up. When it comes to whether window shades should be open or shut during a flight, my answer is simple: Generally, it's up to the passenger in the window seat . The choice is theirs to make, unless there's an onboard issue or the crew has instructed otherwise. If I'm in the aisle, and the person in the window seat has the shade down during my flight, I'll be disappointed, but I'll respect their decision. When I'm on the job as a flight attendant, I typically prefer it when my passengers keep the window shades open, too. Generally, I feel safer leaving the shades open When the window shades are open, we can all have a better view of our surroundings. Leanna Coy; Ignatiev/Getty Images Since becoming a flight attendant four years ago, I appreciate having the window shades up even more, especially during takeoff and landing. It gives passengers and crew members more visibility and can improve their situational awareness, which is crucial in the unlikely event of an emergency or evacuation. A passenger might even be able to spot a potential issue before the crew does. If there were a fire on the aircraft's wing, for example, someone in the window seat might be the first person to notice. Many international airlines actually require window shades to remain open during takeoff and landing, and some US airlines encourage the practice, even though it is not mandated by the Federal Aviation Administration. It also gives all of us the chance to catch incredible views I ve seen national parks from above and caught glimpses of the northern lights outside of plane windows. Leanna Coy On a less serious note, it makes me kind of sad when passengers don't care about seeing the view out of the window. Even just a few decades ago, being able to look at the world from the sky was a much rarer experience. Many people never get the opportunity to do so, either. I've been on more than 800 flights, but taking in the scenery and sights never gets old. I've gotten aerial views of Canyonlands, Capitol Reef,", "date_str": "2026-11-03T12:54:01+00:00", "hash": "09c8d4e7bf656ab1", "title_fa": "به عنوان مهماندار هواپیما، ای کاش مسافران پنجره ها را باز می گذاشتند. من دلایلم را دارم، اما این به من بستگی ندارد.", "summary_fa": "صرف نظر از اینکه احساس می کنید سایه پنجره باید در طول پرواز باز باشد یا بسته، من (در تصویر نیست) می گویم مسافر روی صندلی پنجره باید آن را کنترل کند. Dobrila Vignjevic/Getty Images به‌عنوان مهماندار هواپیما، من سایه‌های پنجره باز را ترجیح می‌دهم – اما انتخاب با کسانی است که روی صندلی‌های پنجره نشسته‌اند. من عاشق تماشای مناظر هستم و احساس امنیت بیشتری می کنم، زیرا همه ما دید بیشتری نسبت به محیط اطراف خود داریم. مگر اینکه در یک مقصد گرم متوقف شده باشیم یا کابین شلوغ باشد، من پنجره های تیم را بالا می برم. وقتی صحبت از باز یا بسته بودن سایه‌بان‌های پنجره در طول پرواز به میان می‌آید، پاسخ من ساده است: به طور کلی، این به مسافر در صندلی پنجره بستگی دارد. انتخاب با آنهاست، مگر اینکه مشکلی در کشتی وجود داشته باشد یا خدمه دستور دیگری داده باشند. اگر من در راهرو باشم و شخصی که روی صندلی پنجره در طول پروازم سایه داشته باشد، ناامید خواهم شد، اما به تصمیم آنها احترام می گذارم. زمانی که من به عنوان مهماندار هواپیما مشغول به کار هستم، معمولاً زمانی که مسافرانم پنجره های پنجره را باز نگه دارند، ترجیح می دهم. به طور کلی، من احساس امنیت بیشتری می کنم که سایه ها را باز نگه دارم وقتی سایه های پنجره باز هستند، همه ما می توانیم دید بهتری از محیط اطراف خود داشته باشیم. لیانا کوی; ایگناتیف/ گتی ایماژ از زمانی که چهار سال پیش مهماندار هواپیما شدم، از اینکه سایه‌های پنجره‌ها حتی در هنگام برخاستن و فرود آمدن بیشتر باشد، قدردانی می‌کنم. این به مسافران و اعضای خدمه دید بیشتری می دهد و می تواند آگاهی موقعیتی آنها را بهبود بخشد، که در صورت غیر محتمل اضطراری یا تخلیه بسیار مهم است. یک مسافر حتی ممکن است بتواند یک مشکل بالقوه", "image_url": "https://i.insider.com/6ae49e728bd5d6547af34048?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱۲ آبان • ۱۶:۲۴"}, {"source": "Business Insider", "title": "What smart people are saying after the Nasdaq sank into correction territory, down 10% from recent highs", "link": "https://www.businessinsider.com/nasdaq-correction-decline-ai-spending-tech-stocks-market-outlook-midterms-2026-11", "summary": "The Nasdaq 100 slid by over 10% from its recent high, entering a technical correction. Osmancan Gurdogan/Anadolu via Getty Images The Nasdaq 100 slumped into a technical correction on Monday, down 10.4% from its October 6 peak. Economist David Rosenberg said tech stocks have slumped over concerns about returns on AI spending. Other market commentators said investors were pricing in a Democratic victory in the midterms. Is the AI-fueled market boom stalling out? That was the question on investors' minds after the Nasdaq 100 slumped into a technical correction on Monday, defined as a decline of 10% or more from a recent peak. The tech-heavy US stock index closed at just under 28,000 points, a hefty 10.4% below the all-time high of over 31,000 points it notched on October 6. It was the Nasdaq 100's third correction of 2026, and came as investors increasingly asked when the massive sums that Big Tech is pouring into AI might pay off . There were signs of recovery on Tuesday with Nasdaq 100 futures up about 0.7% as of 9 a.m. ET. Here's what smart people are saying about the correction. David Rosenberg, president of Rosenberg Research A correction was \" probably inevitable \" given the huge volume of capital pouring into \"any company claiming to have an AI angle,\" David Rosenberg, the president of Rosenberg Research, said in a morning note on Tuesday. The former chief North American economist at Merrill Lynch said that \"both sides of the AI trade are faltering at once.\" The likes of Microsoft and Alphabet have sold off because they're spending too much and eroding their cash flows, he continued, while their suppliers have sold off because \"spending isn't speeding up.\" \"The overriding theme is that investors stopped rewarding the AI buildout and started asking when it pays back,\" Rosenberg added. Jim Reid, head of macro research at Deutsche Bank There isn't an \"overt catalyst\" for the Nasdaq correction, but \"emerging expectations of a blue wave in the midterms\" appear to be weighing on tech stocks , Jim Reid, the global head of macro research at Deutsche Bank, and his team said in a morning note. Investors are pricing in the prospect of a Democratic victory resulting in \"greater hurdles for data center buildout and a push for more AI regulation,\" Reid and his team added. Neil Wilson, investor strategist at Saxo UK Fund managers are \"just reducing overall exposure\" to the AI trade as it's turned \"ugly,\" Neil Wilson, investor strategist at Saxo UK, told Business Ins", "date_str": "2026-11-03T12:43:38+00:00", "hash": "1e01e851119d3ca0", "title_fa": "آنچه افراد باهوش پس از سقوط نزدک در قلمرو اصلاحی، 10 درصد نسبت به رکوردهای اخیر کاهش یافته است، می گویند.", "summary_fa": "نزدک 100 بیش از 10 درصد نسبت به بالاترین قیمت اخیر خود کاهش یافت و وارد یک اصلاح فنی شد. Osmancan Gurdogan/Anadolu از طریق Getty Images نزدک 100 در روز دوشنبه دچار یک اصلاح فنی شد که نسبت به اوج خود در 6 اکتبر 10.4 درصد کاهش داشت. دیوید روزنبرگ اقتصاددان گفت که سهام فناوری به دلیل نگرانی در مورد بازده هزینه های هوش مصنوعی سقوط کرده است. دیگر مفسران بازار گفتند که سرمایه‌گذاران برای پیروزی دموکرات‌ها در میان‌دوره قیمت‌گذاری می‌کنند. آیا رونق بازار مبتنی بر هوش مصنوعی متوقف شده است؟ این سوالی بود که در ذهن سرمایه گذاران پس از سقوط نزدک 100 به یک اصلاح فنی در روز دوشنبه، که به عنوان کاهش 10 درصدی یا بیشتر از اوج اخیر تعریف شد، در ذهن سرمایه گذاران قرار گرفت. شاخص سهام آمریکا که از نظر فناوری سنگین بود، در کمتر از 28000 واحد بسته شد که 10.4 درصد پایین تر از بالاترین رکورد تاریخ 6 اکتبر یعنی بیش از 31000 واحد بود. این سومین اصلاح Nasdaq 100 در سال 2026 بود، و زمانی که سرمایه گذاران به طور فزاینده ای از سرمایه گذاران پرسیدند که چه زمانی فناوری هنگفت ممکن است مبالغ هنگفتی را پرداخت کند. نشانه‌هایی از بهبود در روز سه‌شنبه وجود داشت و معاملات آتی نزدک 100 تا ساعت 9 صبح به وقت شرقی حدود 0.7 درصد افزایش یافت. این چیزی است که افراد باهوش در مورد اصلاح می گویند. دیوید روزنبرگ، رئیس پژوهشگاه روزنبرگ، دیوید روزنبرگ، رئیس پژوهشگاه روزنبرگ، در یادداشتی صبح روز سه‌شنبه گفت، با توجه به حجم عظیم سرمایه‌ای که برای هر شرکتی که ادعا می‌کند زاویه هوش مصنوعی دارد، اصلاح احتمالاً اجتناب‌ناپذیر بود. اقتصاددان ارشد سابق آمریکای شمالی در مریل لینچ گفت که \"هر دو طرف تجارت هوش مصنوعی به یکباره در حال تزلزل هستند.\" او ادامه داد که شرکت‌هایی مانند مایکروسافت و", "image_url": "https://i.insider.com/6ae9c55b978e617b0a2a4f7a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Microsoft", "بورس و طلا"], "datetime_fa": "۱۲ آبان • ۱۶:۱۳"}, {"source": "Lifehacker", "title": "The Out of Touch Adults' Guide to Kid Culture: What Does 'Code Rot' Mean?", "link": "https://lifehacker.com/entertainment/the-out-of-touch-adults-guide-to-kid-culture-code-rot?utm_medium=RSS", "summary": "This week's Out-of-Touch guide takes a look at a phenomena that's probably going to define the lives of generations of young people: Code rot both actual computer-style code rot, and the more elusive cultural kind. I'm also taking a look at the fake controversy over the \"cancellation\" of Freddy Krueger, and finally, bringing things home with viral videos of boyfriends dancing. What does \"code rot\" mean? Expect to hear young people talking about code rot for awhile, maybe for the rest of their lives. It's a concept that's going to affect them more than any previous generation. Code rot, or software rot, describes what happens to a computer program when the hardware and operating system it runs on advance. If older programs aren't updated, they become less stable and glitchy until they eventually become unusable. The idea of code rot has really caught on in the young people's popular imagination, probably because they're going to spend a lot of their lives dealing with it. They've even taken the idea of code rot into life, and use the phrase to describe anything that is worn out or malfunctioning. If the ice cream machine isn't working at McDonald's, it's co       media: [{"source": "Billboard", "title": "Country Artists Who Have Been Voted Kennedy Center Honors (Full List)", "link": "https://www.billboard.com/lists/country-artists-kennedy-center-honors-full-list/", "summary": "When the Kennedy Center Honors are presented at Capital One Arena in downtown Washington, D.C. on Dec. 7, a country artist will be in the honors class for the second year in a row. Barbara Mandrell is being honored this year. George Strait was an honoree last year. This will mark the first time in the history of the Kennedy Center Honors that country artists have been recognized in back-to-back years. Over the years, Mandrell has worked with several of the country artists who have received Kennedy Center Honors previously. George Jones , who received the honor in 2008, sang a guest vocal on Mandrell’s 1981 anthem “I Was Country When Country Wasn’t Cool.” Related Paul Anka, David Foster Barbara Mandrell Are Among 2026 Kennedy Center Honorees: Complete List The Kennedy Center Honors program was slow to recognize country – as it was a lot of popular music forms. The first country artist to be honored was Roy Acuff in 1991, in its 14th class of honorees. The Kennedy Center Honors were first presented in 1978. The inaugural class consisted of contralto Marian Anderson, dancer-actor-singer Fred Astaire, choreographer George Balanchine, composer Richard Rodgers and pianist Arthur Rubinstein. While the focus in the early years was on fine arts — heavy on classical and opera — over the decades, it has broadened to also include more popular forms of music. In 1987, B.B. King became the first blues artist to be inducted. Other performers who were the first in their genres to be honored were Acuff for country in 1991, Aretha Franklin for R B in 1994, Pete Seeger for folk in 1994, Bob Dylan for rock in 1997, Gloria Estefan for Latin music in 2017 and LL Cool J for rap in 2017. Here’s a complete list of country artists who have received Kennedy Center Honors.
