ning 24/7, they have your context, and so they can pick up things where you left off,\" Pichai said. \"It's a continuum there. By the time it's doing that, you would be applying yourself to the next problem and so on.\" Read the original", "date_str": "2026-10-22T04:01:01+00:00", "hash": "22e0bf15c78772c2", "title_fa": "ساندار پیچای توضیح می دهد که چگونه تیمی از عوامل هوش مصنوعی به او کمک می کنند تا شرکت را اداره کند", "summary_fa": "مدیر عامل گوگل گفت که از عوامل هوش مصنوعی برای پیگیری توسعه مدل گوگل و بحث های داخلی استفاده می کند. بلومبرگ/گتی ایماژ ساندار پیچای گفت که از عوامل هوش مصنوعی برای پیگیری توسعه مدل گوگل و بحث های داخلی استفاده می کند. ربات‌ها به‌روزرسانی‌ها را خلاصه می‌کنند و نحوه استفاده از منابع محاسباتی Google را نظارت می‌کنند. پیچای گفت که انسان ها هنوز تصمیمات مهمی در مورد تخصیص منابع می گیرند. حتی مدیر عامل گوگل برای همگام شدن با گوگل به کمک نیاز دارد. در پادکست Sources که چهارشنبه منتشر شد، ساندار پیچای به میزبان الکس هیث توضیح داد که چگونه برخی از جمع‌آوری اطلاعات را که با اداره غول فناوری همراه است، واگذار می‌کند. \"به راحتی می توانم یک ساعت در روز طول بکشد تا به نوعی به من برسم، در 24 ساعت گذشته چه اتفاقی افتاده است، درست است؟\" پیچای گفت. \"اما اکنون نمایندگانی دارم که این اطلاعات را خلاصه می کنند و برای من می آورند. هنوز هم می‌توانم عمیق‌تر بروم، و اغلب این کار را انجام می‌دهم.\" پیچای گفت که عوامل هوش مصنوعی او راهی برای \"درک قوس توسعه مدل\" به او می‌دهند، بفهمد چگونه از منابع محاسباتی Google استفاده می‌شود، و رشته‌هایی را که در گروه‌های چت داخلی متعدد پخش می‌شود، بدون نیاز به خواندن هر مکالمه دنبال کند. پیچای افزود: بینش، شما می دانید. \"من فکر می کنم این باعث شده که همه ما در کاری که انجام می دهیم بهتر باشیم.\" این بدان معنا نیست که Pichai تماس های مهم را به هوش مصنوعی واگذار کرده است. او گفت که انسان‌ها - از جمله خودش - مستقیماً در تصمیم‌گیری‌های بعدی در مورد تخصیص منابع محاسباتی درگیر هستند. مدیریت عامل ها به خودی خود تبدیل به یک مهارت می شود و برای برخی از کارگران مجموعه جدیدی از سردرد ایجاد می کند، از"}, {"source": "Business Insider", "title": "Peter Thiel breaks with Trump over Iran war: 'We should not have done it'", "link": "https://www.businessinsider.com/peter-thiel-breaks-with-trump-over-iran-war-2026-10", "summary": "Peter Thiel, cofounder and chairman of Palantir Technologies Inc. Bloomberg/Getty Images Thiel criticized the US-Iran war, diverging from Trump's foreign policy stance, POLITICO reported. \"There were a lot of mistakes that were made,\" Thiel said at a lecture earlier this month. Despite his criticism of the war in Iran, Thiel highlighted his continued support for Trump. Billionaire technology investor Peter Thiel said he's skeptical of the US war with Iran and does not believe the United States should have launched it, putting the major Republican donor at odds with President Donald Trump over one of the administration's defining foreign policy decisions, POLITICO reported . Thiel's remarks, delivered on October 12 at a private event, are his most explicit statements to be revealed publicly about the war with Iran and come less than two weeks before the midterm elections in which Trump's party is grasping to maintain power in Congress. The audio of Thiel's comments was obtained by Decoded by POLITICO from a lecture earlier this month. \"I'm skeptical of [the war], I think we should not have done it,\" Thiel said. \"There were a lot of mistakes that were made.\" Thiel added, \"Maybe we don't have the hard power. Maybe we're going to lose the soft power war.\" In the full lecture, Thiel made clear his strong opposition to neoconservatives and Middle East wars. Despite his criticism of the Iran war, Thiel highlighted his continued support of Trump and suggested he wanted to protect the president. Still, Thiel's break over the war represents one of the most important examples to date of a fierce Trump ally sharing deep concerns about the conflict. The comments were part of Thiel's lecture series in Nashville, which Decoded has documented since their start this fall . In the lat " در سخنرانی کامل، تیل مخالفت شدید خود را با نومحافظه‌کاران و جنگ‌های خاورمیانه به وضوح بیان کرد. با وجود انتقاداتش از جنگ ایران، تیل بر ادامه حمایت خود از ترامپ تاکید کرد و پیشنهاد کرد که می‌خواهد از رئیس‌جمهور محافظت کند. با این حال، شکست تیل بر سر جنگ یکی از مهم‌ترین نمونه‌های تا به امروز از متحد سرسخت ترامپ است که نگرانی‌های عمیق خود را درباره این درگیری به اشتراک می‌گذارد. این نظرات بخشی از مجموعه سخنرانی های Thiel در"}, {"source": "Business Insider", "title": "Newly single and 42, I left Connecticut for Montreal on a whim. People told me I was brave.", "link": "https://www.businessinsider.com/single-40s-woman-moved-to-montreal-canada-affordable-rent-brave-2026-10", "summary": "Moving from Connecticut to Canada gave Erin Levi a panic attack. Provided by Erin Levi Last summer, Erin Levi left Connecticut and moved to Montreal on her own . She barely knew anyone in the city, and relocating at 42 gave her a panic attack. Moving to a new city while working for herself was hard, but it made her feel brave. Last summer, I left my life in Connecticut behind and moved to Montreal on a whim, without a plan. People told me I was brave. Really? I'm a travel journalist. I've followed a snow leopard expert across Nepal; I've lived with a family in Uzbekistan who didn't speak English; and I've had a private encounter with the King of Bhutan. Montreal is only a 6-hour drive from my hometown in Connecticut. It didn't seem brave to me. It seemed, frankly, safe. Yet moving here at 42 gave me a panic attack. I hadn't been to Canada in more than 12 years and barely knew anyone. After my parents dropped me off, we spent a few days exploring my new city together, where it's easy to get by without a car — it felt like the start of another semester abroad. Except this time, I was older and had no plans to leave. The last time I'd been in Montréal with my parents was in the summer of 2003, before I left for a semester abroad in Hanoi. I had my first pho in Montréal's Chinatown. So why Montreal? A Facebook post on a full moon in May changed my life. My lease in Ridgefield, Connecticut, was up. So was my relationship. My landlord wanted an extra $500 a month for the lofty, 1,100-square-foot, one-bedroom apartment in the woods that I had been sharing with my now-ex. That would bring the rent to $3,250 a month, not including utilities, which often reached $700 during the winter because of the high ceilings. I saw all of this as signs to leave. But I was about to write a check for $5,985 upfront for a $1,995-a-month, 900-square-foot, one-bedroom duplex nearby and buy a car. Then a Canadian friend shared that her 638-square-foot, one-bedroom apartment near Montréal's Little Italy was available for 6 months at a writer-friendly rent: 1,100 Canadian dollars, or about $775 a month, including utilities, WiFi, furniture, and a beautiful patio. My friend is a professor and works abroad for half the year. Ever since my first job at Tourisme Québec's New York office — the role that ultimately launched my travel-writing career — I'd wanted to live in Montreal. I also speak French. It seemed like a no-brainer, so I said \"oui.\" I found out that Americans can spend up to 6", "date_str": "2026-10-22T00:29:47+00:00", "hash": "55281c9b9ce375df", "title_fa": "به تازگی مجرد و 42 ساله هستم، من کانکتیکات را به قصد مونترال ترک کردم. مردم به من گفتند که شجاع هستم.", "summary_fa": "انتقال از کانکتیکات به کانادا باعث حمله وحشت ارین لوی شد. ارائه شده توسط ارین لوی تابستان گذشته، ارین لوی کانکتیکات را ترک کرد و به تنهایی به مونترال نقل مکان کرد. او به سختی کسی را در شهر می شناخت و نقل مکان در 42 سالگی او را دچار حمله وحشت کرد. نقل مکان به یک شهر جدید در حالی که برای خودش کار می کرد سخت بود، اما باعث شد او احساس شجاعت کند. تابستان گذشته، من زندگی خود را در کانکتیکات پشت سر گذاشتم و از روی هوس و بدون برنامه به مونترال نقل مکان کردم. مردم به من گفتند که شجاع هستم. واقعا؟ من یک روزنامه نگار مسافرتی هستم. من یک متخصص پلنگ برفی را در سراسر نپال دنبال کردم. من با خانواده ای در ازبکستان زندگی می کردم که انگلیسی صحبت نمی کردند. و من یک برخورد خصوصی با پادشاه بوتان داشته ام. مونترال تنها 6 ساعت با ماشین از زادگاه من در کانکتیکات فاصله دارد. به نظر من شجاع نبود. رک و پوست کنده به نظر می رسید امن است. با این حال حرکت به اینجا در 42 سالگی باعث حمله پانیک به من شد. بیش از 12 سال بود که به کانادا نرفته بودم و به سختی کسی را می شناختم. بعد از اینکه پدر و مادرم مرا ترک کردند، چند روزی را با هم به کاوش در شهر جدیدم گذراندیم، جایی که به راحتی می‌توان بدون ماشین از آنجا عبور کرد - مثل شروع یک ترم دیگر در خارج از کشور بود. به جز این بار، من بزرگتر بودم و هیچ برنامه ای برای رفتن نداشتم. آخرین باری که با پدر و مادرم در مونترال بودم تابستان 2003 بود، قبل از اینکه برای یک ترم به خارج از کشور در هانوی بروم. من اولین عکسم را در محله چینی مونترال داشتم. پس"}, {"source": "Business Insider", "title": "Mark Zuckerberg considered leaving California over the billionaire tax", "link": "https://www.businessinsider.com/meta-mark-zuckerberg-weighed-leaving-california-over-billionaire-tax-2026-10", "summary": "Meta CEO Mark Zuckerberg. Finn Gomez/Getty Images Meta CEO Mark Zuckerberg considered moving out of California because of a proposed billionaire tax. Zuckerberg would get $20 billion in \"immediate liquidity\" if the billionaire tax passes. Meta made the offer to Zuckerberg to help keep him in California after he considered leaving. Meta CEO Mark Zuckerberg considered moving out of California because of its proposed billionaire tax, Meta disclosed in a new SEC filing on Wednesday. Next month, Californians will vote on Proposition 40, a one-time tax on the assets of the state's billionaires. The filing said that Zuckerberg told a special committee formed by Meta that he was considering moving. In response, the committee concluded that it was \"critically important\" for Zuckerberg to keep running Meta close to its Silicon Valley headquarters — particularly to its AI division, Meta Superintelligence Labs. The filing said the committee got Zuckerberg to agree to remain in California or any other jurisdiction where Meta has its corporate headquarters for eight years, barring unforeseen circumstances. As part of its efforts to ensure he can remain in charge as it raises more cash for its AI initiatives, the company is granting the Meta CEO a new stock class. The shares would give Zuckerberg $20 billion in \"immediate liquidity\" to cover the tax by selling stock without losing control of Meta, if the tax passes. The new shares wouldn't add to Zuckerberg's net worth or increase his percentage ownership of Meta. \"The goal is to keep Mr. Zuckerberg continuing to lead the Company from California,\" the filing says. Meta declined to comment. A person familiar with the matter said that the new class of shares, which totals $150 billion, is also intended to raise capital, compensate employees, and keep Meta's stock price on the right track. Meta's filing showcases how tech billionaires are responding to the tax proposal. Some, including Google cofounder Sergey Brin and former CEO Eric Schmidt, poured hundreds of millions of dollars into attack ads against the proposal. While Zuckerberg has taken a lower-key approach, it's clear he's been taking the proposed tax seriously. The Meta CEO, who is worth about $240 billion according to Forbes, has multiple residences in California, including in Palo Alto and Lake Tahoe. He also has a sprawling property portfolio outside the state, including a doomsday bunker in Hawaii, a waterfront mansion in Miami, and a castle in Ireland. Have a", "date_str": "2026-10-21T23:13:22+00:00", "hash": "6c85198fd23b6fea", "title_fa": "مارک زاکربرگ در فکر خروج از کالیفرنیا به دلیل مالیات میلیاردرها بود", "summary_fa": "مارک زاکربرگ مدیر عامل متا. مارک زاکربرگ، مدیر عامل شرکت متا، فین گومز/ گتی ایماژز، به دلیل پیشنهاد مالیات میلیاردرها، قصد خروج از کالیفرنیا را داشت. در صورت تصویب مالیات میلیاردرها، زاکربرگ 20 میلیارد دلار \"نقدینگی فوری\" دریافت خواهد کرد. متا به زاکربرگ پیشنهاد داد تا او را در کالیفرنیا نگه دارد، پس از اینکه او تصمیم به ترک آن گرفت. متا در یک پرونده جدید SEC در روز چهارشنبه فاش کرد، مارک زاکربرگ، مدیر عامل متا، به دلیل پیشنهاد مالیات بر میلیاردرها، قصد خروج از کالیفرنیا را داشت. ماه آینده، مردم کالیفرنیا در مورد پیشنهاد 40 رای خواهند داد، مالیات یکباره بر دارایی های میلیاردرهای ایالتی. در این پرونده آمده است که زاکربرگ به کمیته ویژه ای که متا تشکیل داده بود گفته است که در حال بررسی انتقال است. در پاسخ، کمیته به این نتیجه رسید که برای زاکربرگ \"بسیار مهم\" است که متا را در نزدیکی مقر دره سیلیکون خود - به ویژه در بخش هوش مصنوعی خود، Meta Superintelligence Labs ادامه دهد. در این پرونده آمده است که کمیته از زاکربرگ خواسته است تا با ماندن در کالیفرنیا یا هر حوزه قضایی دیگری که متا در آن دفتر مرکزی شرکت خود را به مدت هشت سال در آن قرار دارد، موافقت کند، به استثنای شرایط پیش بینی نشده. این شرکت به عنوان بخشی از تلاش‌های خود برای اطمینان از اینکه او می‌تواند در مسئولیت باقی بماند، زیرا پول نقد بیشتری برای طرح‌های هوش مصنوعی خود جمع‌آوری می‌کند، این شرکت به مدیر عامل متا یک کلاس سهام جدید اعطا می‌کند. این سهام به زاکربرگ 20 میلیارد دلار \"نقدینگی فوری\" می دهد تا با فروش سهام بدون از دست دادن کنترل متا، مالیات را پوشش دهد. سهام جدید به ارزش خالص زاکربرگ یا افزایش درصد مالکیت او بر متا نمی‌افزاید. در این پرونده آمده است: \"هدف این است"}, {"source": "Business Insider", "title": "Tesla targets shipping Optimus to customers by the end of 2027", "link": "https://www.businessinsider.com/tesla-starts-producing-optimus-robots-at-its-fremont-factory-2026-10", "summary": "A prototype of Tesla s Optimus robot. CFOTO/Future Publishing via Getty Images Tesla has begun production of its humanoid robot, Optimus, in Fremont, California. Musk said he expects to begin delivering Optimus to customers at the end of 2027. Musk said it will take at least a year to produce 20,000 Optimus units a week. Tesla has begun producing its long-awaited humanoid robot, Optimus, at its Fremont factory, the company said in its quarterly earnings report. \"The bots coming off this line are the first production-quality bots that we have manufactured,\" Tesla said, saying the current manufacturing process is \"suitable for a commercial product.\" \"There's still some things we need to tweak about the design, because you need to deliver a robot that is safe and reliable and has long duration,\" CEO Elon Musk said on Tesla's Q3 earnings call. \"It can't, like, wear out after a month.\" Musk said the company will take at least a year to scale up Optimus production to 20,000 units a week in Fremont. He said he expects to begin delivering Optimus to customers at the end of next year. Musk tempered expectations about how quickly Tesla can scale up Optimus production because it is \"such a radically new product.\" He said the early stages of production will be \"somewhat bumpy\" because \"there's like 10,000 things that have to go right\" to build the robot. One of the big challenges Musk outlined is building robot hands. Musk said Tesla is building an \"Optimus Academy,\" where robots will practice tasks and generate data to improve the AI models that power them. The company also plans to install its next-generation AI5 chip in Optimus in April, which will give the robots more computing power and be a \"big step change in intelligence,\" Musk said. The latest version of Optimus has not been unveiled. Musk said he expects to release a video of Optimus within one or two months. He previously said Tesla was keeping the robot under wraps to prevent competitors from copying its design. Tesla stopped producing the Model S and Model X at its Fremont, California, plant earlier this year to make room for an Optimus line designed to eventually produce a million robots a year. A second line under construction in Austin is planned to have an annual capacity of 10 million robots. Tesla is competing in a crowded humanoid market. Agility Robotics, which plans to go public, has deployed its Digit robot across nine customer facilities, while Figure AI has announced deployments in logistics he Tesla's path. Avride is a robotaxi company that offers robotaxi rides through Uber in Dallas and is testing rides with a safety driver behind the wheel in Austin. A spokesperson for Avride did not immediately respond to a request for comment. Tesla posted the footage as it seeks to make its case publicly on robotaxi safety. The company began offering a limited number of autonomous rides without an in-car safety monitor in Austin in January. In the newly posted safety report, Tesla said its robotaxi service has driven 3.3 million miles autonomously — relatively small compared to Waymo's more than 271 million miles driven as of June. Tesla said during its Q3 earnings call that it will launch unsupervised Cybercabs in Dallas in November. Read the original article on Business Insider", "date_str": "2026-10-21T22:03:07+00:00", "hash": "1eb1033befd14484", "title_fa": "تسلا حلقه برجسته رباتاکسی خود را برای جلوگیری از برخورد با رقبای Waymo و Avride منتشر کرد.", "summary_fa": "تسلا یک حلقه برجسته منتشر کرده است که در آن رباتاکسی خود را نشان می دهد که شرایط جاده در دنیای واقعی را هدایت می کند، از جمله رباتاکسی که مانع راه می شود. Andrej Sokolow/تصویر اتحاد از طریق Getty Images تسلا فیلمی از رانندگی روباتاکسی خود بدون راننده ایمنی قبل از فراخوان درآمد سه ماهه سوم خود منتشر کرد. دو تا از این کلیپ ها شامل فیلمی از رباتاکسی Waymo و Avride بود که در مسیر تسلا تجاوز کردند. کلیپ‌ها نشان می‌داد که تسلا روباتاکسی در حال کاهش سرعت است. تسلا در آستانه فراخوان درآمد سه ماهه سوم خود در روز چهارشنبه، برخی از رقبای روباتاکسی خود را زیر سوال برد. در وب‌سایتی که تسلا برای گزارش ایمنی روباتاکسی خود ایجاد کرده است، این شرکت کلیپ‌هایی از ماشین‌های خودران خود که در شرایط واقعی بدون راننده پشت فرمان مانور می‌دهند، آپلود کرد. موانع و خطرات شامل آب و هوای طوفانی، گذرگاه عابر پیاده در چراغ سبز، حیوانات خانگی ولگرد، و روبوتاکسی های رقیب که سر راه قرار می گیرند. Ashok Elluswamy، معاون هوش مصنوعی تسلا نیز این ویدئو را در X منتشر کرد و آن را \"Robotaxi B-roll\" نامید. Robotaxi B-roll https://t.co/NWO7Ak2h1I — Ashok Elluswamy (@aelluswamy) 21 اکتبر 2026 در حدود ساعت 1:44 پست الوسوامی، این ویدئو نشان می‌دهد که روباتاکسی در مسیر خودش کاملاً متوقف می‌شود، در حالی که Waymo یک دور به راست می‌پیچد. Waymo را می توان دید که قبل از بازگشت به مسیر خود، به خط تسلا نفوذ می کند. یکی از سخنگویان Waymo بلافاصله درخواستی برای اظهار نظر نداد. در یک کلیپ کوتاه دیگر، روبوتاکسی تسلا در حال رانندگی در شب دیده می‌شود و برای خودروی Avride ترمز می‌کند که از سمت راست، کمی بیش از حد در مسیر تسلا بلند شده است. Avride یک شرکت ربات‌اکسی است که سواری ربات‌اکسی را از طریق"}, {"source": "Business Insider", "title": "Meta creates a new stock class to keep Zuckerberg in control — and in California", "link": "https://www.businessinsider.com/meta-stock-split-keep-mark-zuckerberg-2026-10", "summary": "Meta wants to continue its founder-led model — so it s creating a new stock class. Bloomberg/Getty Images Meta established a new class of stock to ensure Mark Zuckerberg stayed as CEO, and in California. The stock class will \"continue the founder-led model that has driven the company,\" Meta said in its third-quarter earnings. Zuckerberg has taken a leading position in Meta's AI era. Meta's board wants Mark Zuckerberg to stick around. The company announced a new category of non-voting Class C stock in its third-quarter earnings report. It listed several reasons for creating the new class — one of which is to keep the CEO in control. A Special Committee established by Meta's board determined that Zuckerberg was the best fit to lead the company into its future, and highlighted the CEO's creative vision and management abilities. \"The creation of the Class C common stock will continue the founder-led model that has driven the company's success since its inception,\" Meta said. The committee also concluded that it was \"critically important\" for Zuckerberg to keep running Meta close to its Silicon Valley headquarters, the company disclosed in a new SEC filing on Wednesday. Zuckerberg had told the committee he was considering moving in response to a proposed California billionaire tax . The new stock class would give Zuckerberg $20 billion in \"immediate liquidity\" to cover the tax by selling stock without losing control of Meta, the filing said. The stock class will also provide Meta the ability to finance its growth, the company said in its earnings report. Meta is spending big on AI and the data centers needed to power it. The company reported $34.91 billion in third-quarter capital expenditures . Meta's press release said the distribution would effectively amount to a two-for-one stock split for existing shareholders. Susan Li, Meta's chief financial officer, said that the stock will be distributed to existing shareholders. Other tech companies have issued stock to access new capital without diluting their CEO's voting power. Google performed a stock split in 2012 for a similar reason. Semafor was first to report the new stock class. Zuckerberg has long been the face of Meta. He's strengthened his leadership through the AI boom, going \" startup mode \" and getting hands-on with the tech. The company's AI team set up their desks around where Zuckerberg sits. The success of Muse, Meta's AI agent, has raised the profile of another Meta executive: Alexandr Wang . The", "date_str": "2026-10-21T21:58:36+00:00", "hash": "63f83b6ced95faf9", "title_fa": "متا یک طبقه سهام جدید ایجاد می کند تا زاکربرگ را در کنترل نگه دارد - و در کالیفرنیا", "summary_fa": "متا می خواهد مدل تحت رهبری بنیانگذار خود را ادامه دهد - بنابراین در حال ایجاد یک کلاس سهام جدید است. بلومبرگ/گتی ایماژ متا دسته جدیدی از سهام را برای اطمینان از ماندن مارک زاکربرگ به عنوان مدیرعامل و در کالیفرنیا تأسیس کرد. متا در سود سه ماهه سوم خود گفت: کلاس سهام \"مدل موسس را که شرکت را هدایت کرده است ادامه خواهد داد.\" زاکربرگ در عصر هوش مصنوعی متا جایگاه پیشرو را به خود اختصاص داده است. هیئت مدیره متا از مارک زاکربرگ می‌خواهد که در کنارش بماند. این شرکت در گزارش سود سه ماهه سوم خود، دسته جدیدی از سهام کلاس C بدون رای را اعلام کرد. چندین دلیل برای ایجاد کلاس جدید ذکر کرد - یکی از آنها کنترل مدیر عامل است. کمیته ویژه ای که توسط هیئت مدیره متا ایجاد شد، تشخیص داد که زاکربرگ بهترین گزینه برای هدایت شرکت به سمت آینده است و دیدگاه خلاقانه و توانایی های مدیریت مدیرعامل را برجسته کرد. متا گفت: «ایجاد سهام عادی کلاس C به مدلی که توسط مؤسس هدایت می‌شود ادامه می‌دهد که باعث موفقیت این شرکت از زمان شروع آن شده است. این کمیته همچنین به این نتیجه رسید که برای زاکربرگ \"بسیار مهم\" است که متا را در نزدیکی مقر دره سیلیکون خود ادامه دهد، این شرکت در پرونده جدید SEC در روز چهارشنبه فاش کرد. زاکربرگ به کمیته گفته بود که در نظر دارد در پاسخ به پیشنهاد مالیات بر میلیاردرهای کالیفرنیا حرکت کند. طبق این پرونده، طبقه جدید سهام به زاکربرگ 20 میلیارد دلار \"نقدینگی فوری\" می دهد تا با فروش سهام بدون از دست دادن کنترل متا، مالیات را پوشش دهد. این شرکت در گزارش سود خود گفت: کلاس سهام همچنین توانایی متا را برای تامین مالی رشد خود فراهم می کند. متا هزینه های زیادی برای هوش مصنوعی و مراکز"}, {"source": "Business Insider", "title": "Tesla's profits are under pressure", "link": "https://www.businessinsider.com/tesla-profits-under-pressure-ai-2026-10", "summary": "Tesla s earnings call was on Wednesday, a day after Elon Musk said on SpaceX s earnings call that he d back a merger. Bloomberg/Getty Images Tesla is facing some profitability headwinds. Its operating income fell 56% year over year as AI and research and development costs climbed. The company is still in the green, and it surprised earlier this month by delivering 486,532 vehicles in the third quarter. Tesla is still selling plenty of cars . Making the same amount of money on them is getting harder. On Wednesday, the Elon Musk-led automaker reported that its operating income fell 56% year over year to $718 million in the third quarter — below Wall Street's estimates of $746.3 million — while overall revenue of $28.05 billion came in a smidge below analysts' estimates. Tesla pointed to higher operating expenses tied to its AI efforts, or \"SI\"/\"Super Intelligence\" as Trump prefers , and other R D projects. Lower regulatory credit revenue and weaker energy storage gross profit also weighed on profitability, while lower vehicle prices hurt revenue. \"While we continue to execute on innovations to reduce the cost of manufacturing and operations, over time, we expect our hardware-related profits to be accompanied by an acceleration of SI, software and fleet-based profits,\" the company reported. It's not all bad news for Tesla's profits. The company is still solidly in the green, and it beat on the bottom line. Tesla reported 48 cents in adjusted earnings per share, above the 44-cent analyst consensus estimate. Free cash flow of $1.5 billion was also a surprise after Wall Street had expected negative free cash flow of $4.92 billion. The automaker also sees areas of profit growth in its future: autonomy subscriptions are trending up, and Tesla said it's offering the right, region-specific product mixes. During the earnings call, Tesla's chief financial officer, Vaibhav Taneja, said the company is experiencing its \"highest backlog\" of vehicles in four years. The company, he said, is trying to increase vehicle production. He also added that Tesla has secured $30 billion of borrowing to support expected capital expenditures, but the company doesn't expect to \"make any draws under any of the new facilities in this calendar year.\" \"The main takeaway is that Tesla's surprisingly positive cash flow quarter did not come from stronger profits,\" Thomas Monteiro, senior analyst at Investing.com, said after the report. \"Added to the equation is the fact that Tesla's AI spendin", "date_str": "2026-10-21T21:56:25+00:00", "hash": "26ecf75d1fec52c4", "title_fa": "سود تسلا تحت فشار است", "summary_fa": "فراخوان درآمد تسلا روز چهارشنبه بود، یک روز پس از آن که ایلان ماسک در تماس درآمد اسپیس ایکس گفت که از ادغام حمایت می کند. بلومبرگ/گتی ایماژز تسلا با معضلات سودآوری مواجه است. با افزایش هزینه‌های هوش مصنوعی و تحقیق و توسعه، درآمد عملیاتی آن نسبت به سال 56 درصد کاهش یافت. این شرکت هنوز در سبز است و اوایل این ماه با عرضه 486532 وسیله نقلیه در سه ماهه سوم غافلگیر کرد. تسلا هنوز هم خودروهای زیادی می فروشد. کسب همان مقدار پول از آنها سخت تر می شود. روز چهارشنبه، خودروساز تحت رهبری ایلان ماسک گزارش داد که درآمد عملیاتی آن نسبت به سال گذشته 56 درصد کاهش یافت و به 718 میلیون دلار در سه ماهه سوم رسید - کمتر از تخمین وال استریت از 746.3 میلیون دلار - در حالی که درآمد کلی 28.05 میلیارد دلاری کمی کمتر از برآوردهای تحلیلگران بود. تسلا به هزینه‌های عملیاتی بالاتر مرتبط با تلاش‌های هوش مصنوعی یا همانگونه که ترامپ ترجیح می‌دهد، «SI»/«Super Intelligence» و دیگر پروژه‌های RD اشاره کرد. کاهش درآمد اعتباری نظارتی و سود ناخالص ذخیره‌سازی انرژی ضعیف‌تر نیز بر سودآوری تأثیر گذاشته است، در حالی که قیمت‌های پایین‌تر خودرو به درآمد آسیب می‌زند. این شرکت گزارش داد: «در حالی که ما به اجرای نوآوری‌ها برای کاهش هزینه‌های تولید و عملیات ادامه می‌دهیم، با گذشت زمان، انتظار داریم که سودهای مربوط به سخت‌افزار ما با تسریع سودهای مبتنی بر SI، نرم‌افزار و ناوگان همراه باشد.» این همه خبر بد برای سود تسلا نیست. این شرکت هنوز هم کاملاً در سبز است و در خط پایانی شکست خورد. تسلا 48 سنت سود تعدیل شده به ازای هر سهم گزارش کرد که بالاتر از برآورد اجماع تحلیلگران 44 سنت بود. جریان نقدی آزاد 1.5 میلیارد دلاری نیز پس از اینکه وال استریت انتظار داشت جریان نقدی آزاد منفی 4.92"}, {"source": "Business Insider", "title": "Meta CEO Mark Zuckerberg says Muse and Reality Labs are highly unprofitable — for now", "link": "https://www.businessinsider.com/meta-q3-2026-earnings-muse-reality-labs-face-losses-profitable-2026-10", "summary": "Meta CEO Mark Zuckerberg. Finn Gomez/Getty Images Meta's AI agent, Muse, is unprofitable due to \"very high compute costs,\" CEO Mark Zuckerberg says. Meanwhile, Meta expects Reality Labs, its AI glasses division, to lose $15 billion next year. The social media giant has a plan to fix that. Meta says some of its biggest cash incinerators could finally start turning profits. The social media giant, which generated over 97% of its quarterly revenue from ads, has faced persistent questions from investors about the lack of profitability in its AI and hardware initiatives. Meta CEO Mark Zuckerberg addressed those concerns head-on during its third-quarter earnings call on Wednesday. Zuckerberg said that Muse, the AI assistant it launched last month, is unprofitable since it's \"very compute intensive to run.\" Meta expects to start turning that around next year by massively improving Muse's efficiency. \"If compute efficiency continues improving quickly for another few years, which we think is highly likely, then Muse will be highly profitable over multiple years,\" he said. Meta plans to make money from Muse by taking a small transaction fee off of purchases it drives, Zuckerberg said at Meta's Connect conference last month. Zuckerberg added that Muse, which launched only in the US and Canada, wasn't launched globally due in part to the amount of compute it requires. (Meta's North American users are generally its most lucrative.) Zuckerberg also struck a positive note about its cash-hemorrhaging Reality Labs division, which makes products like Meta Ray-Bans and virtual reality glasses. Meta expects Reality Labs to narrow its losses to about $15 billion in 2027, down from the $18 to $19 billion it expects to lose this year. The division should start trending toward profitability next year, as Meta's AI systems make it more useful, Zuckerberg said. \"I continue to believe that the path to delivering holographic experience, of bringing together the physical and digital worlds and everyday glasses, will come through VR first,\" Zuckerberg said. Have a tip? Contact this reporter securely on Signal at charlesrollet.12 or +1-628-282-2811 . Use a personal email address and a non-work device; here's our guide to sharing information securely. Read the original article on Business Insider", "date_str": "2026-10-21T21:40:10+00:00", "hash": "e8997d41e05ce921", "title_fa": "مارک زاکربرگ، مدیر عامل متا، می‌گوید که آزمایشگاه‌های Muse و Reality در حال حاضر بسیار زیان‌ده هستند", "summary_fa": "مارک زاکربرگ مدیر عامل متا. مارک زاکربرگ، مدیر عامل شرکت فین گومز/ گتی ایماژ، نماینده هوش مصنوعی متا، Muse، به دلیل \"هزینه های محاسباتی بسیار بالا\" سودآور نیست. در همین حال، متا انتظار دارد که Reality Labs، بخش عینک های هوش مصنوعی آن، 15 میلیارد دلار در سال آینده ضرر کند. غول رسانه های اجتماعی برنامه ای برای رفع این مشکل دارد. متا می‌گوید برخی از بزرگترین کارخانه‌های سوزاندن پول نقد می‌توانند در نهایت شروع به سوددهی کنند. این غول رسانه های اجتماعی که بیش از 97 درصد از درآمد فصلی خود را از تبلیغات به دست می آورد، با سؤالات مداوم سرمایه گذاران در مورد عدم سودآوری در ابتکارات هوش مصنوعی و سخت افزاری خود مواجه شده است. مارک زاکربرگ، مدیر عامل متا، روز چهارشنبه در جریان تماس با درآمد سه ماهه سوم خود، به این نگرانی ها پرداخت. زاکربرگ گفت که Muse، دستیار هوش مصنوعی که ماه گذشته راه‌اندازی کرد، سودآور نیست زیرا اجرای آن بسیار محاسباتی است. متا انتظار دارد سال آینده با بهبود گسترده کارایی Muse شروع به تغییر آن کند. او گفت: \"اگر راندمان محاسباتی برای چند سال دیگر به سرعت بهبود یابد، که به نظر ما بسیار محتمل است، در آن صورت Muse در طول چندین سال سودآوری بالایی خواهد داشت.\" زاکربرگ ماه گذشته در کنفرانس Meta's Connect گفت که متا قصد دارد از Muse با حذف یک کارمزد تراکنش کوچک از خریدهایی که انجام می دهد، درآمد کسب کند. زاکربرگ اضافه کرد که Muse که فقط در ایالات متحده و کانادا راه اندازی شد، تا حدی به دلیل حجم محاسباتی که نیاز دارد، در سطح جهانی راه اندازی نشد. (کاربران متا در آمریکای شمالی عموماً پردرآمدترین آنها هستند.) زاکربرگ همچنین نکته مثبتی را در مورد بخش آزمایشگاه های واقعیت که دارای خونریزی نقدینگی است، که محصولاتی مانند Meta Ray-Bans و عینک های واقعیت"}, {"source": "Business Insider", "title": "The 'Fourth Wing' TV show has cast its Violet and Xaden. Here's everything we know so far.", "link": "https://www.businessinsider.com/fourth-wing-tv-show-release-date-cast-streaming-details-2025-2", "summary": "Two actors have been cast in the Fourth Wing adaptation. TheStewartofNY/GC Images/Getty Images/Red Tower The \"Fourth Wing\" TV show has its Violet and Xaden. Amazon MGM Studios and Michael B. Jordan's Outlier Society are adapting Rebecca Yarros' series. Amazon announced in October that the show had found its two lead actors. At this point, it's hard not to be familiar with Rebecca Yarros' \"Empyrean\" series about dragon rider Violet Sorrengail. When \"Onyx Storm,\" the third book in the romantasy series , was released in January 2025, it became the fastest-selling adult novel in 20 years. Yarros is working on the fourth installment in the series, and she recently released a collection of short stories set in the \"Empyrean\" universe called \"Threshing Day.\" However, it will still be a while before book four is ready for readers. In the meantime, though, we're getting closer to a series adaptation of \"Fourth Wing,\" which officially found its lead actors. 'Fourth Wing' is becoming a TV show In October 2023, Deadline announced that Amazon MGM Studios and Michael B. Jordan's Outlier Society were developing \"Fourth Wing\" into a TV series. Yarros is an executive producer for the show. Outlier Society produced Jordan's \" Creed III \" and is developing a slate of other series and films in addition to \"Fourth Wing.\" Deadline also reported in October 2023 that Amazon MGM Studios had acquired the rights to the entire \"Empyrean\" series. In her January 2025 Variety interview, Yarros said she had shared the \"five-book arc\" for the \"Empyrean\" series with Amazon. Fourth Wing by Rebecca Yarros. Red Tower Publishing \"They have the five-book arc, which went a little awry in Book 3 just because the positioning, but they already know that,\" she told Variety. \"But they have the five-book arc and the general big points of what happens in between each book, but they don't have the specifics between Book 4 and Book 5, because I'm getting ready to go to my crazy plotting board and plot out every single event that happens in each book, so that I make sure that I'm within my two books there.\" A new showrunner In July 2024, Outlier Society announced it had hired Moira Walley-Beckett, who worked on shows like \"Breaking Bad\" and \"Anne with an E,\" as the showrunner for the series. In a January 2025 interview with Variety, Yarros said Walley-Beckett was \"great\" and \"phenomenal,\" but in July 2025, Walley-Beckett exited the project. Variety reported in September 2025 that Meredith Averill was taki", "date_str": "2026-10-21T21:30:24+00:00", "hash": "fcdbcba80a56ef80", "title_fa": "برنامه تلویزیونی \"بال چهارم\" ویولت و گزادن را بازی کرده است. در اینجا همه چیزهایی است که تاکنون می دانیم.", "summary_fa": "دو بازیگر برای اقتباس بال چهارم انتخاب شده اند. The StewartofNY/GC Images/Getty Images/Red Tower نمایش تلویزیونی \"Fourth Wing\" دارای بنفش و Xaden است. استودیوی آمازون ام جی ام و مایکل بی جردن در حال اقتباس از سریال ربکا یاروس هستند. آمازون در ماه اکتبر اعلام کرد که این سریال دو بازیگر اصلی خود را پیدا کرده است. در این مرحله، سخت است که با سریال «Empyrean» ربکا یاروس درباره اژدها سوار Violet Sorrengail آشنا نباشید. هنگامی که «طوفان عقیق»، سومین کتاب از مجموعه‌های عاشقانه، در ژانویه 2025 منتشر شد، به سریع‌ترین رمان بزرگسال در 20 سال اخیر تبدیل شد. یاروس در حال کار بر روی قسمت چهارم این مجموعه است و به تازگی مجموعه ای از داستان های کوتاه را که در دنیای «امپایرین» اتفاق می افتد به نام «روز خرمنکوبی» منتشر کرده است. با این حال، هنوز مدتی طول می کشد تا کتاب چهارم برای خوانندگان آماده شود. با این حال، در این میان، به اقتباسی سریالی از «بال چهارم» نزدیک می شویم که رسماً بازیگران اصلی خود را پیدا کرد. «بال چهارم» در حال تبدیل شدن به یک برنامه تلویزیونی است در اکتبر 2023، ددلاین اعلام کرد که استودیوی ام جی ام آمازون و انجمن Outlier مایکل بی جردن در حال توسعه «بال چهارم» به یک سریال تلویزیونی هستند. یاروس تهیه کننده اجرایی این نمایش است. Outlier Society «کرید III» جردن را تولید کرد و علاوه بر «بال چهارم» مجموعه‌ای از سریال‌ها و فیلم‌های دیگر را نیز در دست ساخت دارد. ددلاین همچنین در اکتبر 2023 گزارش داد که استودیوی ام جی ام آمازون حقوق کل مجموعه «امپایرین» را به دست آورده است. یاروس در مصاحبه ژانویه 2025 خود با ورایتی گفت که \"آرک پنج کتاب\" را برای مجموعه \"Empyrean\" با آمازون به اشتراک گذاشته است. بال چهارم اثر ربکا یاروس. او به ورایتی گفت: «آنها قوس پنج"}, {"source": "Business Insider", "title": "Walmart rolls out AI agent shopping features while Amazon tries to curb the tech", "link": "https://www.businessinsider.com/walmart-adding-ai-agent-shopping-features-while-amazon-blocks-bots-2026-10", "summary": "Walmart is adding tools it says will make AI agent shopping easier. Bloomberg/Getty Images Walmart is rolling out two new tools to help third-party AI agents shop on behalf of customers. The company says the tools give people more control of their bots, and help bots be more accurate. Walmart's move contrasts with Amazon's approach, after it blocked Meta's agent Muse from its site. Walmart wants your bot to shop. The retail giant said Wednesday that it has two new tools to help third-party AI agents shop on customers' behalf: agent profiles and an agent gateway. The agent profiles link all transactions to the bot that performed them, and allow Walmart customers to manage authorizations and spending limits as they would for an additional user on their credit card account, the company said. With agent gateways, bots no longer have to navigate a website that is designed for humans . Instead, Walmart is granting access through a model text protocol that it says will help agents work more quickly and accurately. Walmart's move contrasts with Amazon's approach, which recently blocked Meta's agent Muse from its site, saying agents violate Amazon's conditions of use. Amazon has also pushed back on other third-party agents, including a lawsuit against Perplexity and restrictions on agents from Google and OpenAI. \"As customers begin using agents to help them shop, we're building connections, permissions and options that complement those tools and support how customers want to use them,\" the company said in a statement. The company also said the gateway protects the information that Walmart has about its customers, and only provides what is necessary for completing a given transaction. In particular, the gateway can share a relevant pattern or preference — such as a customer's favorite laundry detergent brand — without sharing their entire purchase history with the agent. The company also laid out a set of terms and conditions regarding how AI agents are expected to operate when shopping. Under the terms, the company said it will honor its usual returns policy and that agents will always see the same pricing that a human would see on Walmart.com. Read the original article on Business Insider", "date_str": "2026-10-21T21:26:06+00:00", "hash": "7cca8547ea22b2ad", "title_fa": "والمارت ویژگی‌های خرید عامل هوش مصنوعی را ارائه می‌کند در حالی که آمازون تلاش می‌کند این فناوری را محدود کند", "summary_fa": "والمارت در حال اضافه کردن ابزارهایی است که می گوید خرید عامل هوش مصنوعی را آسان تر می کند. بلومبرگ/گتی ایمیجز والمارت در حال ارائه دو ابزار جدید است تا به عوامل هوش مصنوعی شخص ثالث کمک کند تا از طرف مشتریان خرید کنند. این شرکت می‌گوید این ابزارها به مردم کنترل بیشتری بر ربات‌هایشان می‌دهند و به ربات‌ها کمک می‌کنند دقیق‌تر باشند. این اقدام Walmart با رویکرد آمازون در تضاد است، پس از اینکه نماینده متا Muse را از سایت خود مسدود کرد. والمارت می خواهد ربات شما خرید کند. این غول خرده‌فروشی چهارشنبه گفت که دو ابزار جدید برای کمک به عوامل هوش مصنوعی شخص ثالث برای خرید از طرف مشتریان دارد: پروفایل‌های نماینده و یک دروازه نماینده. به گفته این شرکت، نمایه‌های نماینده همه تراکنش‌ها را به رباتی که آنها را انجام داده است مرتبط می‌کند و به مشتریان والمارت اجازه می‌دهد تا مجوزها و محدودیت‌های هزینه‌ها را همانطور که برای یک کاربر اضافی در حساب کارت اعتباری خود مدیریت می‌کنند، مدیریت کنند. با دروازه‌های عامل، ربات‌ها دیگر مجبور نیستند در وب‌سایتی که برای انسان طراحی شده است حرکت کنند. درعوض، Walmart از طریق یک پروتکل متنی مدلی دسترسی را اعطا می‌کند که می‌گوید به کارگزاران کمک می‌کند سریع‌تر و دقیق‌تر کار کنند. حرکت Walmart با رویکرد آمازون در تضاد است، که اخیراً نماینده متا Muse را از سایت خود مسدود کرد و گفت که نمایندگان شرایط استفاده آمازون را نقض می کنند. آمازون همچنین از دیگر عوامل شخص ثالث، از جمله شکایت علیه Perplexity و محدودیت‌هایی برای نمایندگان گوگل و OpenAI، عقب نشینی کرده است. این شرکت در بیانیه‌ای گفت: «در حالی که مشتریان شروع به استفاده از نمایندگان برای کمک به خرید می‌کنند، ما در حال ایجاد اتصالات، مجوزها و گزینه‌هایی هستیم که مکمل این ابزارها هستند و از نحوه استفاده مشتریان از آنها پشتیبانی"}, {"source": "Business Insider", "title": "Intel will be the next trillion-dollar semiconductor company, says Maverick Capital's cohead", "link": "https://www.businessinsider.com/maverick-david-tykocinski-intel-investment-pitch-stock-2026-10", "summary": "Lip-Bu Tan is the CEO of semiconductor manufacturer Intel. Bloomberg/Getty Images David Tykocinski spoke at the closed Robin Hood conference in New York on Wednesday. The co-chief investment officer at hedge fund Maverick Capital pitched Intel as an investment. He told the audience that the company will be the next trillion-dollar semiconductor company. David Tykocinski thinks the artificial intelligence cycle is entering a phase that will boost the fortunes of one of the oldest chipmakers. The co-chief investment officer of $16 billion hedge fund Maverick Capital pitched Intel as an investment at the Robin Hood investor conference, according to people present at the closed-door event. His prediction for the company: It's the next trillion-dollar semiconductor manufacturer. His rationale is that the explosion of AI agent usage in recent months will be a boon for companies like Intel and AMD, similar to how the initial model-testing phase of the AI cycle fueled Nvidia's rapid growth. Compared to text generation done by chatbots, agents break tasks down into more components and generally require more CPU usage than GPU. The two biggest CPU manufacturers are Intel and AMD. Tykocinski said the company's upside is more than 100% earnings growth in the next couple of years, a person in the audience told Business Insider. There are already several semiconductor companies that have surpassed the $1 trillion valuation mark, including the aforementioned Nvidia, TSMC, Broadcom, and Micron. But Intel, in which the federal government purchased a 10% stake last year for just under $9 billion, trails these mega-cap companies, despite its stock price more than doubling this year. The company's market cap is roughly $500 billion, meaning Intel would need to double in value to make Tykocinski's prediction come true. Maverick, founded by billionaire Tiger Cub Lee Ainslie, who is still the firm's managing partner, ended the second quarter with a stake in Intel worth more than $500 million, according to regulatory filings, making the company the firm's fourth-largest public holding at the time. Maverick declined to comment. The stock-picking fund is up more than 16% through the end of September, according to HSBC's Hedge Weekly report. Read the original article on Business Insider", "date_str": "2026-10-21T21:01:27+00:00", "hash": "f5061b5f5d36c582", "title_fa": "رئیس Maverick Capital می گوید اینتل شرکت نیمه هادی بعدی تریلیون دلاری خواهد بود.", "summary_fa": "لیپ بو تان مدیر عامل سازنده نیمه هادی اینتل است. بلومبرگ/گتی ایماژ دیوید تیکوچینسکی در کنفرانس بسته رابین هود روز چهارشنبه در نیویورک سخنرانی کرد. مدیر ارشد سرمایه گذاری در صندوق سرمایه گذاری Maverick Capital، اینتل را به عنوان سرمایه گذاری معرفی کرد. او به حضار گفت که این شرکت شرکت بعدی تریلیون دلاری نیمه هادی خواهد بود. دیوید تیکوچینسکی فکر می کند چرخه هوش مصنوعی وارد مرحله ای می شود که ثروت یکی از قدیمی ترین سازندگان تراشه را افزایش می دهد. به گفته افراد حاضر در این رویداد غیرعلنی، مدیر سرمایه گذاری 16 میلیارد دلاری Maverick Capital، اینتل را به عنوان سرمایه گذاری در کنفرانس سرمایه گذاران رابین هود معرفی کرد. پیش‌بینی او برای این شرکت: این شرکت سازنده نیمه‌رساناهای تریلیون دلاری بعدی است. منطق او این است که انفجار استفاده از عامل هوش مصنوعی در ماه‌های اخیر برای شرکت‌هایی مانند اینتل و AMD یک موهبت خواهد بود، مشابه اینکه مرحله آزمایش مدل اولیه چرخه هوش مصنوعی به رشد سریع انویدیا دامن زد. در مقایسه با تولید متن توسط ربات‌های گفتگو، Agentها وظایف را به اجزای بیشتری تقسیم می‌کنند و معمولاً به استفاده از CPU بیشتر از GPU نیاز دارند. دو شرکت بزرگ CPU اینتل و AMD هستند. یکی از مخاطبان به Business Insider گفت که رشد سود این شرکت بیش از 100 درصد در دو سال آینده است. در حال حاضر چندین شرکت نیمه هادی وجود دارند که از مرز یک تریلیون دلار فراتر رفته اند، از جمله Nvidia، TSMC، Broadcom و Micron. اما اینتل، که دولت فدرال سال گذشته 10 درصد از سهام آن را به قیمت کمتر از 9 میلیارد دلار خریداری کرد، علیرغم افزایش بیش از دو برابری قیمت سهام در سال جاری، از این شرکت‌های بزرگ عقب مانده است. ارزش بازار این شرکت تقریباً 500 میلیارد دلار است، به این معنی که اینتل"}, {"source": "Business Insider", "title": "Student-loan borrowers win as Trump drops legal battle to narrow a major forgiveness program for public servants", "link": "https://www.businessinsider.com/trump-drops-appeal-limit-public-service-loan-forgiveness-pslf-debt-2026-10", "summary": "The Trump administration agreed to drop its appeal of a ruling that blocked its plan to limit Public Service Loan Forgiveness. Anna Moneymaker/Getty Images The Trump administration agreed to drop its appeal of a Public Service Loan Forgiveness ruling. The ruling blocked Trump's plan to limit PSLF eligibility from taking effect. An advocacy group said it's a victory for borrowers pursuing PSLF. Student-loan borrowers pursuing a major forgiveness program got a rare legal win. On Wednesday, the Trump administration agreed to drop two of its appeals of a June ruling that had blocked its plan to narrow eligibility for the Public Service Loan Forgiveness program, which forgives student debt for government and nonprofit workers after 10 years. The Education Department intended to implement a plan on July 1 to exclude employers from PSLF who did not align with the administration's definition of \"public service,\" listing actions like assisting with gender-affirming care or 'acts of terrorism. A judge ruled at the end of June that the plan was unlawful and would not take effect. This followed a series of lawsuits filed by advocacy groups and nonprofits, including Student Defense, which said the education secretary did not have the authority to roll out those changes. The administration appealed the ruling at the end of August. With the appeal set to be dismissed, borrowers will not face any immediate changes to PSLF. Another appeal in a separate PSLF lawsuit is still pending. \"The Trump administration's attempt to weaponize public service loan forgiveness against organizations it disagrees with was anti-democratic and unlawful from the start,\" Dan Zibel, chief counsel at Student Defense, said in a statement. \"This is a significant victory for millions of Americans who have dedicated their careers to public service.\" The Education Department did not immediately respond to a request for comment from Business Insider. Undersecretary of Education Nicholas Kent previously said that the rule had been intended to \"ensure federal benefits go to our Nation's teachers, first responders, and civil servants who tirelessly serve their communities.\" Borrowers pursuing PSLF are still facing challenges . The Education Department recently removed some borrowers' payments toward forgiveness, citing Biden-era coding errors. Others have reported delays getting their payments counted toward relief, leaving them in limbo. A department spokesperson previously said that the agency \"remains", "date_str": "2026-10-21T21:01:15+00:00", "hash": "07ab92eedee058d8", "title_fa": "وام‌گیرندگان وام‌های دانشجویی در حالی که ترامپ از نبرد حقوقی برای محدود کردن برنامه بخشش عمده برای کارمندان دولتی صرف‌نظر می‌کند، پیروز می‌شوند.", "summary_fa": "دولت ترامپ موافقت کرد که درخواست تجدیدنظر خود را در مورد حکمی که برنامه آن برای محدود کردن بخشودگی وام خدمات عمومی را مسدود کرده بود، کنار بگذارد. آنا مانی میکر/ گتی ایماژ دولت ترامپ موافقت کرد که درخواست تجدیدنظر خود را درباره بخشودگی وام خدمات عمومی لغو کند. این حکم مانع از اجرای طرح ترامپ برای محدود کردن صلاحیت PSLF شد. یک گروه مدافع گفت که این یک پیروزی برای وام گیرندگانی است که به دنبال PSLF هستند. وام‌گیرندگان وام دانشجویی که برنامه بخشش عمده را دنبال می‌کردند، یک برد قانونی نادر به دست آوردند. روز چهارشنبه، دولت ترامپ موافقت کرد که دو مورد از درخواست تجدیدنظر خود را در مورد حکم ژوئن که برنامه آن را برای محدود کردن صلاحیت برای برنامه بخشودگی وام خدمات عمومی، که بدهی دانشجویان را برای کارکنان دولتی و غیرانتفاعی پس از 10 سال می بخشد، مسدود کرده بود، کنار بگذارد. وزارت آموزش قصد داشت در 1 ژوئیه طرحی را برای حذف کارفرمایان از PSLF که با تعریف دولت از \"خدمات عمومی\" مطابقت نداشتند، اجرا کند و اقداماتی مانند کمک به مراقبت های تایید کننده جنسیت یا \"اقدامات تروریستی\" را فهرست کرد. یک قاضی در پایان ژوئن حکم داد که این طرح غیرقانونی است و اجرایی نخواهد شد. این به دنبال مجموعه‌ای از شکایت‌هایی بود که توسط گروه‌های مدافع و غیرانتفاعی، از جمله دفاع از دانش‌آموز، تشکیل شد که می‌گفتند دبیر آموزش و پرورش صلاحیت اجرای این تغییرات را ندارد. دولت در پایان ماه اوت به این حکم اعتراض کرد. با رد درخواست تجدیدنظر، وام گیرندگان با هیچ تغییر فوری در PSLF مواجه نخواهند شد. درخواست تجدیدنظر دیگری در یک دادخواست جداگانه PSLF هنوز در حال بررسی است. دان زیبل، مشاور ارشد دفاع دانشجویی در بیانیه‌ای گفت: «تلاش دولت ترامپ برای تسلیح بخشیدن به بخشودگی وام خدمات عمومی علیه سازمان‌هایی که با آن‌ها"}, {"source": "Business Insider", "title": "Where to watch the WNBA Finals: Golden State Valkyries vs. Atlanta Dream live streams, channel, odds, venue", "link": "https://www.businessinsider.com/guides/streaming/where-to-watch-dream-vs-valkyries-wnba-finals-2026-v2", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The Atlanta Dream will host Games 3 and 4 of the 2026 WNBA Finals. David Gonzales/IMAGN IMAGES via Reuters Connect The lect markets on Sling. How to watch the Dream vs. Valkyries from anywhere WNBA fans traveling abroad can still access their usual streaming options with the help of a VPN, or virtual private network. VPNs are handy cybersecurity tools that let people temporarily alter the virtual locatio", "date_str": "2026-10-21T21:01:01+00:00", "hash": "742488cefa53aca9", "title_fa": "محل تماشای فینال WNBA: گلدن استیت والکیریز در مقابل آتلانتا دریم پخش زنده، کانال، شانس، محل برگزاری", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید The Atlanta Dream میزبان بازی های 3 و 4 از فینال های WNBA 2026 خواهد بود. دیوید گونزالس/تصاویر IMAGN از طریق رویترز کانکت فینال WNBA در حال انجام است و فصل 30 هیجان انگیز را به پایان می رساند. ما همه چیزهایی را که باید در مورد مکان تماشای فینال WNBA بدانید، گردآوری کرده‌ایم، از جمله گزینه‌های پخش زنده برای هر بازی گلدن استیت والکیریز مقابل آتلانتا رویا. اگر نمی خواهید بیشتر از این حرکت کنید، ما شما را تحت پوشش قرار داده ایم. می‌توانید کل مجموعه نهایی WNBA را در Peacock در ایالات متحده به صورت زنده پخش کنید. شما می‌توانید از هر کجا با VPN به گزینه‌های پخش معمول خود دسترسی داشته باشید، مانند NordVPN. کجا می توان بازی Dream vs را تماشا کرد. Valkyries: پیوندهای سریع ایالات متحده: NBC/USA Peacock (از 13 دلار در ماه) YouTube TV (آزمایشی رایگان) به اشتراک‌ها از هر کجا دسترسی داشته باشید: NordVPN (30 روز ضمانت بازگشت پول) زمان: 17 تا 31 اکتبر 2026 در آخرین بازی 3: گلدن استیت در آتلانتا در روز چهارشنبه، 21 اکتبر در ساعت 21 اکتبر. ET (شبکه ایالات متحده آمریکا) فینال WNBA در چه کانال هایی برگزار می شود؟ فینال WNBA در NBC و USA Network تقسیم خواهد شد. بازی 3 امشب از ایالات متحده آمریکا و بازی 4 (شنبه) از NBC پخش خواهد شد. بازی های 5-7 در صورت لزوم از ایالات متحده پخش می شود. مکان تماشای Dream vs. Valkyries در ایالات متحده طرفداران WNBA می‌توانند کل سریال را در Peacock در ایالات متحده به صورت زنده پخش کنند، زیرا فیدهایی از NBC و USA دارد. اشتراک های ورزشی پسند از 13 دلار در ماه برای Peacock Premium شروع می شود، اما بینندگان می توانند"}, {"source": "Business Insider", "title": "Meta CEO Mark Zuckerberg says 10 million people have set up a Muse AI agent", "link": "https://www.businessinsider.com/meta-q3-2026-earnings-mark-zuckerberg-muse-ai-app-users-2026-10", "summary": "Meta CEO Mark Zuckerberg. Bloomberg/Getty Images Meta reported third-quarter earnings on Wednesday. Meta CEO Mark Zuckerberg said over 10 million people have set up a Muse AI agent since its launch. Meta's stock surged after the release of Muse, which climbed to the top of the App Store. Muse is officially Meta's new main character. Meta's new personal AI agent app has drawn more than 10 million users in the US and Canada since its September launch, CEO Mark Zuckerberg said Wednesday. During Meta's third-quarter earnings call, Zuckerberg said that Muse's growth \"continues to be strong\" and that the most common use case for the agent is shopping. More than a quarter of Muse users are making purchases through the app, with an average purchase size of over $200, Zuckerberg said. Beyond shopping, CFO Susan Li said on the call that Muse users most often use it for \"personal productivity,\" connecting their email and calendars to the agent. Meta's stock had surged after it released Muse. Its stock was up 5% after-hours on Wednesday. The agent, which Meta says can help users handle tasks like sending an email or booking travel, quickly climbed to the top of Apple's App Store after its release, giving Zuckerberg an early win for his enormous AI spending. Earlier on Wednesday, a New Mexico judge ordered Meta to pay $25 billion for misleading users about how it handled their data and for failing to prevent misinformation on Facebook. Make room for Muse Move over, Facebook. Zuckerberg seems to have a new favorite product. In Zuckerberg's opening remarks, he mentioned Muse nearly 50 times. Facebook, Instagram, and WhatsApp were only mentioned once. \"Muse went from an idea on a whiteboard to a successful product in just about eight months, and we're about to ship Muse Charm, which will have gone from concept to a hardware device in people's pockets in less than a year,\" Zuckerberg said on the call. Meta is eager to turn Muse into a money-making machine, too. \"I think that we are going to work on monetization somewhat sooner on this than our normal playbook for a couple of reasons,\" Zuckerberg said. \"One is just the size of the numbers that we are talking about in terms of both the costs and the opportunity… make it important to make progress on that in order to be able to scale it.\" The other reason, he said, is \"such a large part of what people are doing is commerce.\" Li added that Meta sees multiple paths to monetization, beginning with paid subscriptions. \"We also se", "date_str": "2026-10-21T20:57:01+00:00", "hash": "d06427937573ed07", "title_fa": "مارک زاکربرگ مدیر عامل متا می گوید 10 میلیون نفر یک عامل هوش مصنوعی Muse راه اندازی کرده اند", "summary_fa": "مارک زاکربرگ مدیر عامل متا. بلومبرگ/ گتی ایماژ متا روز چهارشنبه درآمدهای سه ماهه سوم را گزارش کرد. مارک زاکربرگ، مدیر عامل متا، گفت که بیش از 10 میلیون نفر یک عامل هوش مصنوعی Muse را از زمان راه اندازی آن راه اندازی کرده اند. سهام متا پس از انتشار Muse که به بالای اپ استور صعود کرد، افزایش یافت. میوز رسما شخصیت اصلی جدید متا است. مارک زاکربرگ، مدیرعامل جدید شرکت متا روز چهارشنبه گفت که اپلیکیشن عامل هوش مصنوعی شخصی جدید متا از زمان عرضه در سپتامبر بیش از 10 میلیون کاربر را در ایالات متحده و کانادا جذب کرده است. زاکربرگ در جریان تماس درآمدهای سه ماهه سوم متا گفت که رشد Muse \"به قوت خود ادامه می دهد\" و رایج ترین مورد استفاده برای این نماینده خرید است. زاکربرگ گفت که بیش از یک چهارم کاربران Muse از طریق این برنامه خرید می‌کنند و میانگین حجم خرید آنها بیش از 200 دلار است. فراتر از خرید، سوزان لی مدیر امور مالی در این تماس گفت که کاربران Muse اغلب از آن برای «بهره‌وری شخصی» استفاده می‌کنند و ایمیل و تقویم‌های خود را به نماینده متصل می‌کنند. سهام متا پس از انتشار Muse افزایش یافته بود. سهام آن در یون فریم در حال حاضر از طریق آمازون و سامسونگ به فروش می رسد. اما برخی از معاملات بهتر از سایرین هستند، و واقعاً بستگی به سال و اندازه شما دارد. در حال حاضر، بهترین تخفیف ها برای تلویزیون های فریم 2026 جدید سامسونگ است. مدل 55 اینچی در آمازون به 898 دلار کاهش یافته است، در حالی که مدل 85 اینچی در سامسونگ به 2250 دلار کاهش یافته است - هر دو پایین ترین قیمت هستند. در همین حال، اولین تلویزیون فریم 98 اینچی سامسونگ در سامسونگ 1080 دلار تخفیف دارد که یکی دیگر از قیمت های کم سابقه است. تلویزیون های فریم 2025 نیز هنوز در انبار هستند و اندازه های خاص ارزان تر از مدل های 2026 هستند. به عنوان مثال، تلویزیون 65 اینچی فریم 2025 با قیمت 990 دلار از طریق سامسونگ به فروش می رسد، در حالی که نسخه 2026 آن 1200 دلار است. تفاوت اصلی این است که آنها چگونه با پورت های HDMI خود کار می کنند (یک جعبه جداگانه در مقابل تعبیه شده در پنل). اینکه کدام روش بهترین است به تنظیمات شما بستگی دارد، اما اگر ترجیحی ندارید، توصیه می کنم ارزان ترین گزینه را انتخاب کنید. 4 تخفیف برتر تلویزیون فریم در حال حاضر تلویزیون قاب 65"}, {"source": "Business Insider", "title": "Anthropic launches Claude Duet, its answer to Meta and OpenAI's personal agents", "link": "https://www.businessinsider.com/anthropic-answers-meta-openai-new-personal-agent-claude-duet-2026-10", "summary": "Ami Vora, Anthropic s chief product officer, and Daniela Amodei, its president. Don Feria/AP Content Services for Anthropic Anthropic has its answer to AI agents like Meta's Muse and OpenAI's Dots. Claude Duet, built on Anthropic's flagship model, has entered the personal agent frenzy. Karan Ahuja, a recent departee from Meta, led Claude Duet's development. Anthropic is joining the personal AI agent craze . The company announced the new app Claude Duet on Wednesday, billed as a \"proactive agent\" that can run in the background, surface tasks to a user, and handle a variety of work. The tool is in research preview for now with a waitlist, meaning it won't immediately compete for the larger market with other new agents like Meta's Muse and OpenAI's Dots . Still, the announcement ramps up the pressure on those companies — Anthropic says it built Duet around its flagship Opus 5.5 model, which was released in late September and has already become one of the industry's most popular. Recent model breakthroughs have made AI better at handling work on its own, spurring a rush to build these \"always-on\" personal agents. \"It can have the discernment and judgment around when to be proactive, when to act on your behalf,\" said Mike Krieger, a co-lead of Anthropic's Labs team, said in a Duet launch video. The tool, Anthropic says, will send users a brief each morning about what's happening on their connected apps, and message them when something needs attention. Like other companies' offerings, it runs outside a user's computer, sends notifications, and asks for approval on certain tasks. Anthropic announced Duet on the day of Meta's earnings report and used the opportunity to mention a new poach from Mark Zuckerberg's company. Karan Ahuja led product management for Meta Superintelligence Labs until July, according to his LinkedIn, before starting at Anthropic in August and leading Duet's development. He wrote on X that he's been using Duet to build Duet, and said the team \"built it for professionals and small business owners juggling a lot at work and at home.\" Ahuja also wrote that Anthropic is letting people into Duet from the waitlist \"as quickly as possible.\" The news didn't go unnoticed at Meta. Alexandr Wang, who heads Meta Superintelligence Labs, posted a meme about Duet's similarity to Muse. Anthropic is fast approaching a giant initial public offering, which could value the company at as much as $2 trillion. Like other AI players, the company navigates a high-wi", "date_str": "2026-10-21T20:29:03+00:00", "hash": "b88b6e4ccf9e59fa", "title_fa": "آنتروپیک Claude Duet را راه‌اندازی می‌کند که پاسخ آن به متا و عوامل شخصی OpenAI است", "summary_fa": "آمی وورا، مدیر ارشد محصول آنتروپیک، و دانیلا آمودی، رئیس آن. Don Feria/AP Content Services for Anthropic Anthropic پاسخ خود را به عوامل هوش مصنوعی مانند Meta's Muse و OpenAI's Dots دارد. Claude Duet که بر اساس مدل پرچمدار آنتروپیک ساخته شده است، وارد جنون نمایندگی شخصی شده است. کاران آهوجا، که اخیراً از متا جدا شده است، توسعه کلود دوئت را رهبری کرد. Anthropic در حال پیوستن به جنون عوامل هوش مصنوعی شخصی است. این شرکت روز چهارشنبه اپلیکیشن جدید Claude Duet را معرفی کرد که به عنوان یک «عامل فعال» نام‌گذاری شده است که می‌تواند در پس‌زمینه اجرا شود، وظایف را به کاربر نشان دهد و کارهای مختلفی را انجام دهد. این ابزار در حال حاضر با فهرست انتظار در پیش نمایش تحقیقاتی است، به این معنی که فوراً برای بازار بزرگتر با عوامل جدید دیگری مانند Meta's Muse و OpenAI's Dots رقابت نخواهد کرد. با این حال، این اعلامیه فشار را بر این شرکت‌ها افزایش می‌دهد - Anthropic می‌گوید که Duet را بر اساس مدل پرچمدار Opus 5.5 خود ساخته است که در اواخر سپتامبر عرضه شد و در حال حاضر به یکی از محبوب‌ترین‌های صنعت تبدیل شده است. پیشرفت‌های اخیر مدل‌ها، هوش مصنوعی را در مدیریت کار به تنهایی بهتر کرده است و عجله برای ساخت این عوامل شخصی «همیشه فعال» را برانگیخته است. مایک کریگر، یکی از رهبران تیم آزمایشگاه‌های آنتروپیک، در یک ویدئوی راه‌اندازی Duet گفت: «این می‌تواند تشخیص و قضاوت در مورد اینکه چه زمانی باید فعال باشد، چه زمانی از طرف شما عمل کند.» آنتروپیک می‌گوید این ابزار هر روز صبح اطلاعات مختصری در مورد اتفاقاتی که در برنامه‌های متصل آن‌ها می‌افتد را به کاربران ارسال می‌کند و زمانی که چیزی نیاز به توجه داشته باشد به آنها پیام می‌دهد. مانند پیشنهادات سایر شرکت‌ها، خارج از رایانه کاربر اجرا می‌شود، اعلان‌ها را"}, {"source": "Lifehacker", "title": "What to Wear When Exercising Outdoors, Based on How Cold It Is", "link": "https://lifehacker.com/health/what-to-wear-to-run-in-the-cold?utm_medium=RSS", "summary": "We may earn a commission from links on this page. I fell in love with cold weather running while I was training for a spring marathon. It wasn t a choice at first: Some weeks, the weather was bad for days on end, and if I stayed home, I would fall behind in my training. Everybody else in my training group was braving the elements, so I did too with no regrets. I got to run on quiet mornings while snow was softly falling. I signed up for a winter race that herded finishers into a heated barn for hot chocolate and soup. I set a personal record at a spring race, during which I pushed myself hard without breaking a sweat. I now find it sad when somebody tells me they re afraid of running in the cold, or that they would run in the winter but don t know what to wear. No, cold weather doesn t have to stop you from running, but getting dressed can be a puzzle: How do you keep from freezing your butt off at first and avoid overheating once you start to sweat? Fortunately, it isn t as tough as it looks. With the right gear, your fingers and ears can stay toasty while you jog through a winter wonderland. Below, I ll give you a temperature-by-temperature running cheat sheet, and then dive into the specifics on how to buy the best socks, shirts, and more. Use the\"feels like\" temperature and the 20-degree rule When I get dressed to run in winter, I take a look at the feels like temperature, not the actual high or low. I also make sure to check the weather for the time I ll go running, not for the whole day. It doesn t matter how warm it will be at 2 p.m. if my run will be happening at 6 a.m., before the sun is up. I use the Carrot Weather app, but any app that gives you hourly feels-like temps will work just fine. Next, use the 20-degree rule . Imagine that the temperature is 20 degrees (Fahrenheit) warmer than it really is. What would you wear then? Here's an example: if it s 50 degrees out, you should dress as if it were 70: in a T-shirt and shorts, most likely. If it s 30 degrees, you d dress as if it were 50: long pants and maybe a light jacket. Get the idea? Everybody has their own preferences. Some people wear shorts even when it s snowing, while others will pop a beanie on as soon as there s a detectable chill in the air. I m a pretty middle-of-the-road runner when it comes to keeping warm, so here s what I wear at each feels like temperature, starting with warmer weather and working our way colder. I'll give a guide to each type of garment or accessory at the en", "date_str": "2026-10-22T14:00:00+00:00", "hash": "d8fea7adf500534b", "title_fa": "بر اساس میزان سرما، هنگام ورزش در فضای باز چه بپوشیم", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. زمانی که برای یک ماراتن بهاری تمرین می کردم، عاشق دویدن در هوای سرد شدم. در ابتدا انتخابی نبود: چند هفته، هوا برای روزهای متوالی بد بود و اگر در خانه می ماندم، از تمریناتم عقب می افتادم. هر کس دیگری در گروه تمرینی من شجاعانه در مقابل عناصر مقاومت می کرد، بنابراین من هم بدون پشیمانی این کار را انجام دادم. باید صبح‌های آرام در حالی که برف به آرامی می‌بارید بدوم. من برای یک مسابقه زمستانی ثبت نام کردم که تمام کننده ها را به انباری گرم برای شکلات داغ و سوپ می برد. من یک رکورد شخصی در یک مسابقه بهاره ثبت کردم که در طی آن بدون اینکه عرق کنم به خودم فشار بیاورم. اکنون وقتی کسی به من می گوید که از دویدن در سرما می ترسد، یا اینکه در زمستان می دود اما نمی داند چه بپوشد، ناراحت می شوم. نه، آب و هوای سرد نباید مانع دویدن شما شود، اما پوشیدن لباس می‌تواند یک معما باشد: چگونه در ابتدا از یخ زدن باسن خود جلوگیری کنید و وقتی شروع به عرق کردن کردید از گرمای بیش از حد جلوگیری کنید؟ خوشبختانه، آنقدرها هم که به نظر می رسد سخت نیست. با ابزار مناسب، انگشتان و گوش‌های شما می‌توانند در حین دویدن در سرزمین عجایب زمستانی برشته بمانند. در زیر، من یک برگه تقلب دما به دما به شما می‌دهم و سپس به جزئیات نحوه خرید بهترین جوراب‌ها، پیراهن‌ها و موارد دیگر می‌پردازم. از دمای \"احساس\" و قانون 20 درجه استفاده کنید وقتی در زمستان برای دویدن لباس می پوشم، نگاهی به احساس دما می اندازم، نه بالا یا پایین واقعی. من همچنین مطمئن می شوم که آب و هوا را برای زمانی که می دوم بررسی می کنم، نه برای کل روز."}, {"source": "Lifehacker", "title": "You Should Enable This Chrome Feature That Flags Suspicious Websites", "link": "https://lifehacker.com/tech/you-should-enable-this-chrome-feature-that-flags-suspicious-websites?utm_medium=RSS", "summary": "If you use Google Chrome, you can turn on a new safety feature that will warn you if you navigate to a suspicious website that looks like others already known for malicious behavior. The alerts are part of Enhanced Protection mode in Chrome's Safe Browsing, which checks your activity against potentially harmful sites and warns you if you're at risk of encountering malware, phishing, intrusive ads, or social engineering attacks. How Chrome protects against malicious websites Most internet users are familiar with the full-page alerts that appear if you navigate to a site that's known to be malicious. These red \"dangerous site\" warnings indicate a high risk of harm to the user and can't really be ignored since they take up the entire screen and urge you to go back to safety. The new \"suspicious site\" alerts indicate possible risk of harm based on patterns consistent with other known malicious sites. This means that Google isn't as confident that the website is actually dangerous, but it looks a lot like others that are spreading malware or running phishing scams. These suspicious site warnings are smaller pop-ups with the text \"This site doesn't seem right\" and two button options: Mark as safe or Back to safety . The different colors, text, and formatting make it easy for users to distinguish between what Google deems dangerous versus suspicious. You can enable Enhanced Protection in your Chrome settings Safe Browsing in Chrome has three options: standard protection, enhanced protection, and no protection at all (which isn't recommended). Standard protection checks your browsing activity, extensions, and downloads against Google's list of unsafe sites, which is updated periodically. By contrast, enhanced protection works in real time and uses AI analysis. Note that enhanced protection does require you to share more information about your activity to Google, and the data are linked to your Google Account. While privacy-conscious users may be hesitant to send more info to Google, enhanced protection is likely worthwhile for those who aren't as savvy to advanced scam tactics (and therefore more likely to enter credentials or financial information on or download a file from a malicious website). To enable Enhanced Protection and receive suspicious website warnings, go to Settings Privacy and security in Chrome and toggle Enhanced protection on under the Safe Browsing section.", "date_str": "2026-10-22T13:30:00+00:00", "hash": "ccc280dcbc7d34b2", "title_fa": "شما باید این ویژگی کروم را فعال کنید که وب‌سایت‌های مشکوک را پرچم‌گذاری می‌کند", "summary_fa": "اگر از Google Chrome استفاده می‌کنید، می‌توانید ویژگی ایمنی جدیدی را روشن کنید که اگر به وب‌سایت مشکوکی بروید که شبیه به سایرین است که قبلاً به دلیل رفتارهای مخرب شناخته شده بودند، به شما هشدار می‌دهد. این هشدارها بخشی از حالت حفاظت پیشرفته در مرور ایمن Chrome است که فعالیت شما را در برابر سایت‌های بالقوه مضر بررسی می‌کند و در صورت مواجهه با بدافزار، فیشینگ، تبلیغات مزاحم یا حملات مهندسی اجتماعی به شما هشدار می‌دهد. چگونه Chrome در برابر وب سایت های مخرب محافظت می کند اکثر کاربران اینترنت با هشدارهای تمام صفحه که در صورت رفتن به سایتی که به عنوان مخرب شناخته می شود ظاهر می شوند آشنا هستند. این هشدارهای قرمز \"سایت خطرناک\" نشان‌دهنده خطر بالای آسیب برای کاربر است و نمی‌توان آنها را نادیده گرفت زیرا کل صفحه را اشغال می‌کنند و از شما می‌خواهند که به مکان امن بازگردید. هشدارهای جدید \"سایت مشکوک\" بر اساس الگوهای سازگار با سایر سایت های مخرب شناخته شده، خطر احتمالی آسیب را نشان می دهد. این بدان معناست که گوگل آنقدر مطمئن نیست که وب سایت واقعاً خطرناک است، اما بسیار شبیه به وب سایت هایی است که در حال انتشار بدافزار یا کلاهبرداری های فیشینگ هستند. این هشدارهای سایت مشکوک پنجره‌های بازشو کوچک‌تری با متن «این سایت درست به نظر نمی‌رسد» و دو گزینه دکمه هستند: علامت‌گذاری به‌عنوان امن یا بازگشت به امن. رنگ‌ها، متن و قالب‌بندی متفاوت، تشخیص آنچه گوگل خطرناک و مشکوک می‌داند را برای کاربران آسان می‌کند. rts for incorrect entries, low batteries, and a jammed lock. Privacy, away, and silent modes add further control. Getting all of that onto your door is fairly simple and takes just a screwdriver, provided your door meets the requirements: 1 to two inches thick, with a one-inch edge bore and a 2 - or 2&frac34;-inch backset. The biggest limitation is its lack of connectivity you can't unlock the door remotely, check its status from your phone, or integrate it with other smart home devices. Anyone who needs those features will have to look elsewhere, but for straightforward keyless access without connectivity, this Philips set covers the essentials. Our Best Editor-Vetted Tech Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $199.00 (List Price $249.00) Apple HomeView Smart Display (Silver, 2026 Release) $299.00 (List Price $299.00) Apple TV 4K 4th Gen 128GB Streaming Player (2026 Model) $289.99 (List Price $299.00) TCL Tab 10 Gen 4 128GB 10.1\" Tablet (Dark Blue/Gray) $149.98 (List Price $199.99) Google Fitbit Edge Activity Tracker (Obsidian) $179.99 (Li", "date_str": "2026-10-22T13:00:00+00:00", "hash": "9f801d17c166f5ea", "title_fa": "این مجموعه قفل درب اثرانگشت فیلیپس به شما امکان می دهد کلیدهای خود را با کمتر از 90 دلار جدا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. آمازون قیمت مجموعه قفل درب جلوی صفحه کلید فیلیپس را از 142.99 دلار به 89.98 دلار کاهش داده است، با کاهش 53 دلاری و رساندن آن به پایین‌ترین قیمت تا به حال. برای این کار، یک پیچ الکترونیکی به همراه دو دسته اهرمی منطبق با روکش مشکی مات دریافت می‌کنید، بنابراین می‌توانید سخت‌افزار درب جلوی موجود خود را بدون نیاز به یافتن قطعات هماهنگ به طور جداگانه جایگزین کنید. اگر به ورود بدون کلید فکر می‌کنید، اما لزوماً نمی‌خواهید دستگاه دیگری به شبکه خانگی‌تان وصل شود، این مجموعه برای خود یک حالت خوب است، زیرا این قفل کاملاً آفلاین عمل می‌کند. هر چند آفلاین بودن راه شما را محدود نمی
