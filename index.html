اقعاً می‌تواند سود زیادی را در پیشگیری از سرطان با گذشت زمان به ارمغان آورد. هر لحظه، ما این فرصت را داریم که از پله‌ها بالا برویم یا چیزی سالم را جایگزین کنیم.» او فیبر بیشتر و غذاهای فرآوری شده کمتری می خورد میوه ها و سبزیجات منابع عالی"}, {"source": "Business Insider", "title": "Morgan Stanley exec Lindsey Coleman shares her coffee-meeting request to tell who is serious about a Wall Street career", "link": "https://www.businessinsider.com/morgan-stanley-lindsey-coleman-networking-wall-street-advice-2026-9", "summary": "Lindsey Coleman is the head of fixed income client coverage for the Americas at Morgan Stanley. Morgan Stanley Lindsey Coleman has spent decades rising up at Morgan Stanley, partly because of her relationships. She said \"networking\" gets the calculus wrong and shared what she thinks works instead. Coleman, who was one of BI's inaugural rising stars, said AI raises the bar for interpersonal skills. When someone asks Lindsey Coleman to get coffee with their kid, a simple ask will tell her a lot about the young person's level of interest in her job: read three articles or studies that we can talk about. \"People want to take the free coffee. They want some advice. There are only some people who actually want to do the work to understand someone's role, background, and business,\" said Coleman, the head of fixed income client coverage for the Americas at Morgan Stanley. Coleman, who was one of Business Insider's inaugural Rising Stars of Wall Street in 2017, has risen over more than two decades at the firm partly because of her relationships, which she said weren't cultivated over one coffee. She now manages around 250 people from an office dotted with photos of her three kids and is responsible for bringing Morgan Stanley's fixed-income business to institutional clients. \"The word that gets thrown out here on Wall Street is networking . I hate that word,\" Coleman said. \"It sounds very transactional. Relationships aren't built through networking. They're built through repeated evidence that you care, that you understand someone, and that you can be trusted, and that takes time.\" That emphasis on relationships may matter even more as AI reshapes analysts' jobs. Junior employees in sales and trading can use AI to save hours that would have been spent aggregating data, freeing them up to do more challenging work, like covering clients, earlier in their careers. By democratizing information, AI also raises the bar , putting a greater premium on interpersonal skills. Those who grasp that distinction will rise up, Coleman said. \"If everyone has the information to do the job, and everyone has the tools, simply knowing the facts is not enough. The differentiation now is your human judgment and your relationships. Who really understands the client?\" she said. \"Who can get the client to come to dinner?\" Discipline helped her stand out An economics and history major, Coleman remembers being intimidated when she joined Morgan Stanley as a full-time analyst in 2005, sitting ", "date_str": "2026-09-18T09:59:01+00:00", "hash": "999300b3fe42d77a", "title_fa": "لیندسی کلمن، مدیر اجرایی مورگان استنلی، درخواست خود را برای یک جلسه قهوه به اشتراک می گذارد تا بگوید چه کسی در مورد شغل وال استریت جدی است.", "summary_fa": "لیندسی کلمن رئیس پوشش مشتریان با درآمد ثابت برای قاره آمریکا در مورگان استنلی است. مورگان استنلی لیندزی کلمن دهه‌ها را در مورگان استنلی گذرانده است، تا حدی به دلیل روابطش. او گفت که \"شبکه سازی\" محاسبات را اشتباه می کند و آنچه را که فکر می کند به جای آن کار می کند به اشتراک گذاشت. کلمن، که یکی از ستاره های در حال ظهور BI بود، گفت که هوش مصنوعی سطح مهارت های بین فردی را بالا می برد. وقتی کسی از لیندزی کلمن می‌خواهد تا با فرزندش قهوه بخورد، یک سوال ساده به او می‌گوید میزان علاقه او به شغلش چقدر است: خواندن سه مقاله یا مطالعه که می‌توانیم در مورد آنها صحبت کنیم. کلمن، رئیس پوشش مشتریان با درآمد ثابت برای قاره آمریکا در مورگان استنلی، گفت: \"مردم می خواهند قهوه رایگان بخورند. آنها مشاوره می خواهند. فقط برخی از افراد هستند که واقعاً می خواهند کار را انجام دهند تا نقش، پیشینه و تجارت یک نفر را درک کنند.\" کلمن که در سال 2017 یکی از ستارگان در حال ظهور بیزینس اینسایدر در وال استریت بود، بیش از دو دهه در این شرکت رشد کرد تا حدی به دلیل روابطش که به گفته او با یک قهوه کاشته نمی شد. او اکنون حدود 250 نفر را از یک دفتر پر از عکس‌های سه فرزندش مدیریت می‌کند و مسئول ارائه تجارت با درآمد ثابت مورگان استنلی به مشتریان سازمانی است. کلمه ای که اینجا در وال استریت مطرح می شود شبکه سازی است. کلمن گفت: من از این کلمه متنفرم. روابط از طریق شبکه ساخته نمی شوند. آن‌ها از طریق شواهد مکرر مبنی بر اینکه شما اهمیت می‌دهید، کسی را درک می‌کنید، و اینکه می‌توان به شما اعتماد کرد، ساخته شده‌اند، و این زمان می‌برد.» این تأکید بر روابط ممکن است اهمیت بیشتری داشته باشد زیرا"}, {"source": "Business Insider", "title": "A Darth Vader costume, a poem, and droning noise: Americans get creative to protest Flock cameras and data centers", "link": "https://www.businessinsider.com/americans-protest-flock-cameras-darth-vader-costumes-data-center-noise-2026-9", "summary": "A Flock Safety license-plate reader camera. Jen Golbeck/SOPA Images/LightRocket via Getty Images Americans are rallying against data centers and license-plate reader cameras at local city council meetings. Some are trying unconventional methods to make their point, such as wearing Darth Vader and Dr. Doom costumes. A protestor disrupted a public meeting in Kentucky this week by playing a noise they likened to a data center. Darth Vader traveled from a galaxy far, far away to California last month to discuss a topic dear to his heart: Flock's license-plate reader cameras . During a San Diego public-safety committee meeting, a resident approached the podium wearing the \"Star Wars\" villain's trademark costume and applauded local officials' decision to allow Flock's cameras across the city. \"The Emperor is a fan of Flock,\" the man said during his speech. \"We must continue utilizing Flock technologies so that we can follow and surveil the rebel scum.\" A man dressed as Darth Vader satirically endorsed Flock cameras at a San Diego public safety meeting in August. Public Safety Livable Neighborhoods Committee The satirical performance — a far cry from traditional picket lines and protest signs — is just one of several unconventional ways Americans are protesting surveillance technology in front of local leaders. Founded in 2017, Flock Safety has deployed around 120,000 license plate reader cameras in communities across the US. They've become a popular tool for law enforcement , who can use them to track down suspects or vehicles. Police say they're often valuable in solving cases. The technology has sparked a growing backlash , however. Dozens of communities have canceled, paused, or suspended contracts , citing privacy concerns, misuse of the cameras, and data sharing with federal immigration officials. A September poll conducted by Reuters and Ipsos found that 47% of respondents didn't want Flock cameras in their communities. In Seattle earlier this month, a man attended a city council meeting dressed up as Marvel's Dr. Doom and applauded officials for using the tech. In the speech, the man said Dr. Doom had acquired Axon Enterprise, which has its own line of automated license-plate readers. A man arrived at a Seattle City Council meeting dressed as the Marvel villain, Dr. Doom. Seattle City Council \"This is the first of Doom's gifts to the city of Seattle. The second gift is this: Doom will expand the real-time crime center to all neighborhoods with over 1,000 ", "date_str": "2026-09-18T09:58:01+00:00", "hash": "57fb374e7b3e69c3", "title_fa": "لباس دارث ویدر، شعر و سر و صدای پرنده: آمریکایی‌ها برای اعتراض به دوربین‌های گله و مراکز داده خلاقیت می‌کنند.", "summary_fa": "دوربین پلاک خوان Flock Safety. Jen Golbeck/SOPA Images/LightRocket از طریق Getty Images آمریکایی ها علیه مراکز داده و دوربین های پلاک خوان در جلسات شورای شهر محلی تجمع می کنند. برخی از روش‌های غیر متعارف مانند پوشیدن لباس‌های Darth Vader و Dr. Doom برای بیان نظر خود تلاش می‌کنند. یک معترض این هفته با پخش صدایی که آنها را به مرکز داده تشبیه کردند، جلسه عمومی در کنتاکی را مختل کرد. دارث ویدر ماه گذشته از یک کهکشان بسیار دور به کالیفرنیا سفر کرد تا در مورد موضوعی که مورد علاقه اوست صحبت کند: دوربین های پلاک خوان Flock. در طول جلسه کمیته ایمنی عمومی در سن دیگو، یکی از ساکنان با لباس علامت تجاری شخصیت شرور «جنگ ستارگان» به تریبون نزدیک شد و تصمیم مقامات محلی را برای اجازه دادن دوربین های فلاک در سراسر شهر تحسین کرد. این مرد در حین سخنرانی خود گفت: \"امپراطور از طرفداران گله است.\" ما باید به استفاده از فن‌آوری‌های Flock ادامه دهیم تا بتوانیم تفاله‌های شورشیان را دنبال کرده و زیر نظر بگیریم.» مردی که لباس دارث ویدر را پوشیده بود، دوربین های Flock را در یک جلسه ایمنی عمومی در سن دیگو در ماه اوت تایید کرد. کمیته محله‌های قابل سکونت ایمنی عمومی اجرای طنز - که به دور از خط‌های اعتصاب سنتی و علائم اعتراض است - تنها یکی از چندین روش غیرمتعارف آمریکایی‌ها برای اعتراض به فناوری نظارت در مقابل رهبران محلی است. Flock Safety که در سال 2017 تأسیس شد، حدود 120000 دوربین پلاک خوان را در جوامع سراسر ایالات متحده مستقر کرده است. آنها به ابزاری محبوب برای مجریان قانون تبدیل شده اند که می توانند از آنها برای ردیابی مظنونان یا وسایل نقلیه استفاده کنند. پلیس می گوید آنها اغلب در حل پرونده ها ارزشمند هستند. با این حال، این فناوری باعث واکنش شدید فزاینده ای"}, {"source": "Business Insider", "title": "I flew to Barcelona to freeze my eggs for under $4,500. Being alone for the hard parts was the price I didn't calculate.", "link": "https://www.businessinsider.com/freezing-eggs-abroad-spain-cost-emotional-toll-2026-9", "summary": "The author flew to Spain to freeze her eggs. Courtesy of the author I traveled to Barcelona a week after my 40th birthday to freeze my eggs. I saw the procedure as a way to give my future self more reproductive options. I ultimately froze eight eggs and plan to undergo another round. It was a week after my 40th birthday, September 2025. I was celebrating by freezing my eggs in Barcelona, where the price could be less than a year's worth of Botox in New York. I told myself it would be a vacation: tapas, sunbathing, a few glasses of Rioja, and the opportunity for future Jennys to chill in a Spanish freezer. Ticking off the beginning of my 40s, I was buying time. One round of egg freezing, including a year of storage, would cost me less than $4,500, roughly one-fifth the cost back home in New York , where some clinics charge upward of $20,000. The savings are what first attracted me to Spain, but the full picture is what sold me. No one blinked at my age. Spain has one of the highest percentages of mothers over 40, and from the first consultation, my doctor eased my concerns about my \"geriatric eggs.\" Because regulations are uniform throughout Spain, I chose the city and clinic based on ease and proximity to my favorite tourist attractions. The author flew to Barcelona, initially for a few weeks, to freeze her eggs. Courtesy of the author Some of the clinics I first consulted even had lists of recommended hotels, offered airport transit, helped book flights, and provided travel suggestions. My fertility shifted from a question mark to an all-inclusive getaway. Then reality set in. It wasn't easy being far away from home I thought I'd have an easier time than most. I'd lived and studied in Spain before, but my Friday-night language classes hadn't prepared me to translate medical jargon when my English-speaking doctor went on holiday. And nothing could have prepared me for hiding in the bathroom of my rental, injecting hormones into my belly fat, while the clinic left me on hold, waiting to schedule my past-due monitoring scans. Weeks into the process, I found myself scrunching the lines on my forehead, wondering if Botox wouldn't have been the better investment. In theory, I was part of a growing trend; between 2024 and 2025, American women choosing European fertility treatments increased by 37.2%, according to The European Fertility Society. \"Spain in particular saw an increase of 41.7%,\" the group's Chair, Jakub Dejewski, told Business Insider. My clinic in ", "date_str": "2026-09-18T09:52:01+00:00", "hash": "e0b7e274c84027d7", "title_fa": "من به بارسلونا پرواز کردم تا تخم مرغ هایم را به قیمت کمتر از 4500 دلار منجمد کنم. تنها بودن برای قطعات سخت قیمتی بود که من محاسبه نکردم.", "summary_fa": "نویسنده به اسپانیا پرواز کرد تا تخم هایش را منجمد کند. با حسن نیت نویسنده من یک هفته پس از تولد 40 سالگی خود به بارسلونا سفر کردم تا تخمک هایم را فریز کنم. من این روش را راهی برای دادن گزینه های باروری بیشتر به خود آینده می دیدم. من در نهایت هشت تخم مرغ را فریز کردم و قصد دارم یک دور دیگر را انجام دهم. یک هفته پس از تولد 40 سالگی من، سپتامبر 2025 بود. من با فریز کردن تخمک هایم در بارسلون جشن می گرفتم، جایی که قیمت آن می توانست کمتر از یک سال بوتاکس در نیویورک باشد. به خودم گفتم این یک تعطیلات خواهد بود: تاپاس، آفتاب گرفتن، چند لیوان ریوخا، و فرصتی برای جنی های آینده که در یک فریزر اسپانیایی خنک شوند. با شروع 40 سالگی ام، داشتم زمان می خریدم. یک دور انجماد تخمک، از جمله نگهداری یک سال، برای من کمتر از 4500 دلار هزینه دارد، تقریباً یک پنجم هزینه بازگشت به خانه در نیویورک، جایی که برخی از کلینیک ها بیش از 20،000 دلار دریافت می کنند. پس انداز همان چیزی است که مرا به اسپانیا جذب کرد، اما تصویر کامل چیزی است که مرا فروخت. در سن من هیچ کس پلک نمی زد. اسپانیا یکی از بالاترین درصد مادران بالای 40 سال را دارد و از اولین مشاوره، پزشکم نگرانی من را در مورد \"تخمک های سالمندی\" کاهش داد. از آنجا که مقررات در سراسر اسپانیا یکنواخت است، من شهر و کلینیک را بر اساس سهولت و نزدیکی به جاذبه های گردشگری مورد علاقه ام انتخاب کردم. نویسنده ابتدا برای چند هفته به بارسلونا پرواز کرد تا تخم‌هایش را منجمد کند. با حسن نیت نویسنده برخی از کلینیک‌هایی که ابتدا با آنها مشورت کردم، حتی فهرستی از هتل‌های پیشنهادی داشتند، حمل‌ونقل فرودگاهی را ارائه می‌دادند، به رزرو"}, {"source": "Business Insider", "title": "Wall Street is cramming for the midterms. Here’s a handy market cheat sheet.", "link": "https://www.businessinsider.com/midterm-elections-stock-market-investor-guide-democrats-house-senate-outcomes-2026-9", "summary": "Kevin Dietsch/Getty Images Wall Street is cramming for the midterms, and the market's pecking order is at stake. Whatever the election does to markets, AI's growing power bill is a bipartisan problem. Sign up for First Trade , Business Insider's daily markets newsletter. Earnings season. Jackson Hole . The August jobs and inflation reports. The Fed's rate decision . It's been a blistering multi-week period of developments for markets, with hardly time to breathe in between. Lost in the blur have been the upcoming midterm elections , which are now less than seven weeks away. Add it to the market's growing list of inputs. You didn't think you'd have time to relax, did you? The challenge for investors is getting ahead of the election results, rather than waiting for them to play out. That means making a call before a single ballot is cast. For now, Wall Street strategists and prediction-market traders point to two scenarios they see as most likely: (1) Democrats take the House while Republicans retain the Senate, or (2) a \"blue wave\" under which Democrats win both. Let's break down each outcome, looking at which areas of the market are best-positioned to benefit, and which could get hit: 1. Dem house, GOP Senate: The gridlock trade A Democratic House and Republican Senate would, above all else, make major legislation harder to pass. Here's the catch: That's a good thing for investors worried about excessive spending and constantly shifting rules. The less opportunity for intra-government volatility, the better. Potential beneficiaries: Defense contractors, AI- and chip-linked tech , industrials, and financial firms — all areas of the market supported by current policy. If gridlock blocks any major new legislation, it'll be business as usual. Potential pressure points: Healthcare, energy, private equity and crypto . A Democratic House would gain subpoena power and committee control, giving them the power to target these industries for investigations and oversight. 2. Blue wave: The accountability trade Under this scenario, President Trump would still have veto power, allowing him to block any sweeping reversals of his agenda. But control of Congressional committees and spending bills would change hands, meaning more restrictions on GOP interests. Potential beneficiaries: Companies tied to clean-energy programs, public-health spending, hospitals, and Medicaid managed care. Democrats could be more supportive in Congress, and also make it more difficult to cut or", "date_str": "2026-09-18T09:50:01+00:00", "hash": "9e94f7be3114d3e4", "title_fa": "وال استریت در آستانه انتخابات میان دوره ای است. در اینجا یک برگه تقلب بازار مفید است.", "summary_fa": "کوین دیچ/ گتی ایماژ وال استریت برای دوره های میان ترم انباشته شده است و نظم نوک تیز بازار در خطر است. هر آنچه که انتخابات با بازارها انجام می دهد، صورتحساب قدرت رو به رشد هوش مصنوعی یک مشکل دو حزبی است. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. فصل درآمد جکسون هول. گزارش مشاغل و تورم مرداد. تصمیم فدرال رزرو برای نرخ بهره این یک دوره چند هفته ای تاولناک از تحولات برای بازارها بوده است، و زمانی برای نفس کشیدن در این بین وجود ندارد. انتخابات میان دوره ای آتی که اکنون کمتر از هفت هفته باقی مانده است، در هاله ای از ابهام شکست خورده است. آن را به فهرست ورودی‌های در حال رشد بازار اضافه کنید. فکر نمی کردی زمانی برای استراحت داشته باشی، نه؟ چالش سرمایه‌گذاران، پیشی گرفتن از نتایج انتخابات است، نه انتظار برای اجرای آنها. این بدان معناست که قبل از یک رای گیری یک تماس بگیرید. در حال حاضر، استراتژیست‌های وال استریت و معامله‌گران پیش‌بینی بازار به دو سناریو اشاره می‌کنند که به احتمال زیاد آنها را می‌دانند: (1) دموکرات‌ها مجلس نمایندگان را تصاحب می‌کنند در حالی که جمهوری‌خواهان سنا را حفظ می‌کنند، یا (2) یک \"موج آبی\" که بر اساس آن دموکرات‌ها هر دو را برنده می‌شوند. بیایید هر یک از نتایج را تجزیه و تحلیل کنیم، به این نکته توجه کنیم که کدام مناطق از بازار بهترین موقعیت را برای منفعت دارند، و کدام می تواند ضربه بخورد: 1. مجلس دموکرات، مجلس سنای جمهوری خواه: تجارت در بن بست یک مجلس دموکرات و مجلس سنای جمهوری خواه، بیش از هر چیز دیگری، تصویب قانون اساسی را دشوارتر می کند. نکته اینجاست: این برای سرمایه گذارانی که نگران هزینه های بیش از حد و تغییر مداوم قوانین هستند، چیز خوبی است. هر چه فرصت برای نوسانات"}, {"source": "Business Insider", "title": "2 friends pooled $2,000 of their own savings and turned it into a $30 million company by focusing on 'green-light activities'", "link": "https://www.businessinsider.com/dow-janes-origin-how-friends-bootstrapped-30-million-dollar-company-2026-9", "summary": "Laurie-Anne King, left, and Britt Baker cofounded the financial-education company Dow Janes. Haley Busch Two friends turned $2,000 into a business that's on track to generate $30 million in revenue in 2026. Their advice: Build a product customers want, then create a clear path to sell it. Their 'green-light' framework helped them focus their time on revenue-generating work. Before Britt Baker and Laurie-Anne King even launched their financial-education business, they had $40,000 in sales. \"That whole idea of sell it before you build it really worked for us,\" Baker told Business Insider. After finishing Harvard Business School and moving back to the Bay Area, Baker joined a women's circle. At the meetings, she kept hearing the same question: \"What should I do with my money?\" It prompted her and King, who had met years earlier while working at the same consulting firm, to host informal money meetups in people's living rooms — \"kind of like book clubs for money,\" Baker said. The meetups gave women a space to talk openly about money. They also revealed demand. \"People were hungry for this information,\" Baker said. She and King agreed that if 20 women signed up for a program, they would build it. They doubled that goal: Forty women enrolled at a founder's price of $1,000 each. Sign up here to get Small Business Insider in your inbox every Friday. \"And so we had $40,000 in the bank from day one before we had any costs,\" said Baker, who named the company Dow Janes after the all-women investment club her mother attended in Idaho in the 1990s. The pair then each contributed $1,000 of their own savings to incorporate the business and cover initial website costs. Over the next nine months, they built their first product, The Million Dollar Year, a 12-step financial-literacy course developed in real time with their founding cohort. Baker and King with members of their nine-person Dow Janes team. Maegan Cox Nearly seven years later, Dow Janes is on track to generate $30 million in revenue in 2026, according to a profit-and-loss statement provided by the company's CFO. Baker and King have never taken outside money. They turned $2,000 into an eight-figure business by following a refreshingly simple playbook: Build a product customers actually want, then focus on the activities most likely to generate revenue. Build a product people actually want. Then, give people a reason to buy it. Before creating a sales page for their first product, Baker and King conducted about 20 ", "date_str": "2026-09-18T09:45:01+00:00", "hash": "af05817fd8b78db9", "title_fa": "2 دوست 2000 دلار از پس انداز خود را جمع آوری کردند و با تمرکز بر \"فعالیت های نور سبز\" آن را به یک شرکت 30 میلیون دلاری تبدیل کردند.", "summary_fa": "لوری آن کینگ، سمت چپ، و بریت بیکر شرکت آموزشی مالی Dow Janes را تأسیس کردند. هیلی بوش دو دوست 2000 دلار را به کسب و کاری تبدیل کردند که در مسیر درآمدزایی 30 میلیون دلاری در سال 2026 قرار دارد. توصیه آنها: محصولی بسازید که مشتریان می خواهند، سپس مسیری روشن برای فروش آن ایجاد کنید. چارچوب \"چراغ سبز\" آنها به آنها کمک کرد تا زمان خود را روی کار درآمدزا متمرکز کنند. قبل از اینکه بریت بیکر و لوری آن کینگ حتی تجارت مالی-آموزشی خود را راه اندازی کنند، 40000 دلار فروش داشتند. بیکر به Business Insider گفت: «کل ایده فروش آن قبل از ساختن آن واقعاً برای ما کارساز بود. پس از اتمام مدرسه بازرگانی هاروارد و بازگشت به منطقه خلیج، بیکر به حلقه زنان پیوست. در جلسات مدام همین سوال را می شنید: \"با پولم چه کنم؟\" بیکر گفت، این باعث شد که او و کینگ، که سال‌ها قبل در همان شرکت مشاوره کار می‌کردند، ملاقات‌های غیررسمی پولی را در اتاق‌های نشیمن مردم برگزار کنند. این ملاقات ها به زنان فضایی داد تا آشکارا در مورد پول صحبت کنند. آنها همچنین تقاضا را آشکار کردند. بیکر گفت: «مردم تشنه این اطلاعات بودند. او و کینگ توافق کردند که اگر 20 زن برای برنامه ای ثبت نام کنند، آن را بسازند. آنها این هدف را دو برابر کردند: چهل زن با قیمت بنیانگذار هر کدام 1000 دلار ثبت نام کردند. اینجا ثبت نام کنید تا Small Business Insider را هر جمعه در صندوق ورودی خود دریافت کنید. بیکر که نام شرکت داو جینز را به افتخار باشگاه سرمایه‌گذاری تمام زنان که مادرش در آیداهو در دهه 1990 در آن حضور داشت، می‌گوید: «بنابراین ما از روز اول 40000 دلار در بانک داشتیم. سپس هر یک از آنها 1000 دلار از پس انداز خود را برای مشارکت در"}, {"source": "Business Insider", "title": "AI is the butt of the joke", "link": "https://www.businessinsider.com/ai-butt-of-the-joke-2026-9", "summary": "Comedians said audiences have one rule about AI jokes: You have to make fun of the tech. Getty Images; Tyler Le/BI BI spoke to stand-up comedians who joke about AI. They all reported one core rule from their audiences: you must make fun of AI. It's funny because it's everywhere, they said. It's not a good joke writer, though. Comedian Sabrina Jalees tells Business Insider she's been peeing her whole life. Recently, she wondered if that could be an economic opportunity. \"I feel like within my soul is a long lineage of people that belong on 'Shark Tank,' whether they're securing the deal or not,\" she said. After hearing that data centers were draining some freshwater reserves , she found her pitch to the sharks: \"Why can't we use our piss?\" Her \"why-don't-we-pee-on-data-centers\" business proposal never reached Barbara Corcoran or Kevin O'Leary. Instead, after trying the joke in her stand-up sets, Jalees pitched it to an ad agency. Liquid Death and Garage Beer turned her gag into a viral ad campaign, featuring a chorus of people, including former NFLer Jason Kelce, proudly singing as they brought jars of urine, addressed to a data center, to a post office. The companies also sold an $18 pee jar . View this post on Instagram A post shared by Adam Conover (@adamconover) It's part of a larger trend in comedy: As AI and data centers create tension, audiences are looking for comic relief. Business Insider spoke with five stand-up comedians, including Jalees, about how audiences respond to jokes about the technology. They agreed on one rule: In a joke about AI, AI has to be the butt. \"I've seen it for myself,\" Ohio-based comedian and act-booker Barack from the Block told Business Insider. \"Any comments that are positive to AI get a boo. If you make fun of AI, it gets a great reaction.\" A bit that consistently works, he said, is to pick out a well-dressed person in the crowd and tell the audience: \"They look like they own a data center. Hey, you're the reason my electric bill is so high!\" It's funny because it's everywhere Comedy usually works best when it comments on a shared experience, the stand-ups said. And AI's weirdness — its chatbot hallucinations , online slop, weird machine movements , and a creeping sense that the technology is showing up everywhere — is a familiar absurdity of modern life. \"For topical, relatable humor, the setup is the shared experience that people already go into the room having,\" Austin Nasso, a New York-based standup and former Micro", "date_str": "2026-09-18T09:44:01+00:00", "hash": "b84400461b0ccb82", "title_fa": "هوش مصنوعی موضوع شوخی است", "summary_fa": "کمدین ها می گویند که مخاطبان در مورد جوک های هوش مصنوعی یک قانون دارند: شما باید فناوری را مسخره کنید. گتی ایماژ; Tyler Le/BI BI با کمدین های استندآپ که در مورد هوش مصنوعی شوخی می کنند صحبت کرد. همه آنها یک قانون اصلی را از مخاطبان خود گزارش کردند: شما باید هوش مصنوعی را مسخره کنید. گفتند خنده دار است چون همه جا هست. هر چند جوک نویس خوبی نیست. کمدین سابرینا جلیز به بیزینس اینسایدر می گوید که در تمام زندگی اش ادرار کرده است. اخیراً، او فکر کرد که آیا این می تواند یک فرصت اقتصادی باشد. او گفت: «احساس می‌کنم در روح من یک دودمان طولانی از مردم به «تانک کوسه» تعلق دارند، خواه این معامله را تضمین کنند یا نه. او پس از شنیدن اینکه مراکز داده مقداری از ذخایر آب شیرین را تخلیه می‌کنند، به کوسه‌ها پی برد: \"چرا نمی‌توانیم از پیس خود استفاده کنیم؟\" پیشنهاد تجاری او «چرا روی مراکز داده نمی‌زنیم» هرگز به باربارا کورکوران یا کوین اولری نرسید. در عوض، پس از امتحان کردن این شوخی در استندآپ‌هایش، جلیز آن را به یک آژانس تبلیغاتی ارائه کرد. Liquid Death و Garage Beer تهوع او را به یک کمپین تبلیغاتی ویروسی تبدیل کردند که در آن گروهی از مردم از جمله جیسون کلس، بازیکن سابق NFL، با افتخار می‌خواندند و شیشه‌های ادرار را خطاب به یک مرکز داده به اداره پست می‌آوردند. این شرکت ها همچنین یک شیشه 18 دلاری را فروختند. مشاهده این پست در اینستاگرام پستی که توسط Adam Conover به اشتراک گذاشته شده است (@adamconover) این بخشی از یک روند بزرگتر در کمدی است: همانطور که هوش مصنوعی و مراکز داده تنش ایجاد می کنند، مخاطبان به دنبال تسکین کمیک هستند. Business Insider با پنج استندآپ کمدین، از جمله Jalees، در مورد نحوه واکنش مخاطبان به جوک های"}, {"source": "Business Insider", "title": "Demand for cybersecurity pros with AI skills is reaching a 'fever pitch'", "link": "https://www.businessinsider.com/demand-cybersecurity-professionals-surges-ai-2026-9", "summary": "Aaron Levie said cybersecurity will be one of the hottest, if not the hottest, job categories. Justin Sullivan/Getty Images Tech leaders, including Box's Aaron Levie, have said that AI will lead to more cybersecurity jobs. A Cloudflare exec said the war for talent with deep AI and security expertise has hit a \"fever pitch.\" AI is creating more threat and defense capabilities, leading to changes to cybersecurity work. Cybersecurity may be AI's next big jobs boom. Box CEO Aaron Levie recently posted on X that AI for cybersecurity \"is about to go vertical\" as models become increasingly capable of finding and exploiting vulnerabilities. That, he told Business Insider, could make cybersecurity \"one of the hottest, if not the hottest, job categories.\" As threats multiply, companies need systems that can prioritize alerts, investigate risk, recommend fixes, and automate remediation. Humans, Levie said, will remain responsible for oversight and the highest-stakes decisions. The CEO said he expects \"massive\" investments in the space, both in the technology itself and in the \"expert operators\" needed to make it effective. \"You're going to have so much more talent that gets pumped into this industry because of the amount of risks that are starting to be uncovered,\" Levie said. Levie isn't the only one making this prediction. Cybersecurity stocks are booming, and the Bureau of Labor Statistics forecasts that roles like information security analysts, a central title in the field, will grow by 21% between 2025 and 2035. It also ranks the role among the top 20 fastest-growing occupations in the timeframe. Evolving threats Security leaders have warned for years that the threat landscape is worsening. Over the past year, though, those concerns have become more real. Anthropic has warned that its Mythos model could be used to identify and exploit software vulnerabilities. In July, OpenAI's models accessed internal datasets from the open-source AI platform Hugging Face . Since then, doomsday warnings have intensified. Most recently, Anthropic researcher Jacob Coxon sparked a viral debate when he resigned with claims that frontier labs are \"gambling with our lives.\" Grant Bourzikas, Cloudflare's chief security officer, told Business Insider via email that AI isn't creating incremental changes to cybersecurity — it's \"putting it on a rocket ship.\" Attack timelines that were once measured in days or hours, he said, can now unfold in seconds. That leaves security teams with almo", "date_str": "2026-09-18T09:39:01+00:00", "hash": "75b4b11292822d39", "title_fa": "تقاضا برای متخصصان امنیت سایبری با مهارت های هوش مصنوعی در حال رسیدن به \"تب بالا\" است", "summary_fa": "آرون لوی گفت امنیت سایبری یکی از داغ‌ترین، اگر نگوییم داغ‌ترین دسته‌های شغلی خواهد بود. جاستین سالیوان/ رهبران فناوری گتی ایماژ، از جمله آرون لوی از باکس، گفته اند که هوش مصنوعی به مشاغل امنیت سایبری بیشتری منجر خواهد شد. یکی از مدیران Cloudflare گفت که جنگ برای استعدادها با هوش مصنوعی عمیق و تخصص امنیتی به \"تب بالا\" رسیده است. هوش مصنوعی در حال ایجاد تهدید و قابلیت‌های دفاعی بیشتر است که منجر به تغییراتی در کار امنیت سایبری می‌شود. امنیت سایبری ممکن است رونق شغلی بزرگ بعدی هوش مصنوعی باشد. Aaron Levie، مدیر عامل Box اخیراً در X پست کرده است که هوش مصنوعی برای امنیت سایبری \"در شرف عمودی شدن است\" زیرا مدل ها به طور فزاینده ای قادر به یافتن و بهره برداری از آسیب پذیری ها می شوند. او به Business Insider گفت که این امر می‌تواند امنیت سایبری را به یکی از داغ‌ترین، اگر نگوییم داغ‌ترین دسته‌های شغلی تبدیل کند. با افزایش تهدیدها، شرکت‌ها به سیستم‌هایی نیاز دارند که بتوانند هشدارها را اولویت‌بندی کنند، ریسک را بررسی کنند، راه‌حل‌ها را توصیه کنند و اصلاح خودکار را انجام دهند. لوی گفت که انسان ها همچنان مسئول نظارت و تصمیمات مهم باقی خواهند ماند. مدیرعامل گفت که انتظار دارد سرمایه‌گذاری‌های «انبوه» در این فضا، هم در خود فناوری و هم در «اپراتورهای خبره» مورد نیاز برای اثربخشی آن انجام شود. Levie گفت: \"شما استعدادهای بسیار بیشتری خواهید داشت که به دلیل خطراتی که در حال کشف شدن هستند، به این صنعت پمپ می شوند.\" لوی تنها کسی نیست که این پیش بینی را انجام می دهد. سهام امنیت سایبری در حال رونق است و اداره آمار کار پیش‌بینی می‌کند که نقش‌هایی مانند تحلیلگران امنیت اطلاعات که عنوان اصلی در این زمینه است، بین سال‌های 2025 تا 2035 21 درصد رشد خواهد کرد. همچنین این نقش را"}, {"source": "Business Insider", "title": "America's job and housing markets are stuck. What if that's the new normal?", "link": "https://www.businessinsider.com/job-housing-market-hiring-home-affordability-new-normal-american-economy-2026-9", "summary": "Getty Images; Alyssa Powell/BI Waiting for a better job or housing market? You could be waiting a while. Hiring is near Great Recession lows, while home affordability is near its worst in decades. If this is the new normal, Americans may have to rethink their career and housing plans. If you've been waiting for a better time to find a job or buy a home, brace yourself: Things might not get much better anytime soon. Two years ago, I wrote about an economy divided between Americans who'd locked in jobs and homes when conditions were favorable versus those who didn't. The hiring boom had become a hiring slump, while mortgage rates and home prices had both risen considerably. Two years later, finding a job or buying a home hasn't gotten much easier, outside of a few pockets of opportunity. US businesses are hiring at roughly the same rate as they were two years ago — near the lowest level since the Great Recession. Home affordability remains about as bad as it's been in decades. For job seekers and prospective homebuyers, this raises an uncomfortable question: What if this isn't just a rough patch? What if it's the new normal? The low-hire, low-fire job market is looking less temporary Gautam Dev has been looking for a full-time job since his software engineering role ended in October 2024. Before then, gaps in his more than two-decade IT career had typically lasted only a few months. \"I never thought it'd be so severe because I have always been able to find a job,\" said Dev, who's in his 60s and lives in Dallas. Gautam Dev has relied on gig work to help pay his bills while searching for a full-time job. Gautam Dev For the last few years, economists have been wondering when America's low-hire, low-fire job market might finally change. Would employers regain the confidence to start hiring more aggressively, or would a weakening economy lead to a broader surge in layoffs? So far, neither has happened. \"The labor market remains low-hire and low-fire, and at this point, it's starting to look less like a phase and more like the new normal,\" Sneha Puri, an economist at Indeed Hiring Lab, wrote in a blog post earlier this month. A mix of forces could explain slower hiring, including economic uncertainty tied to tariffs and the Iran war, pandemic-era overhiring , and the early effects of AI adoption. Workers are quitting their jobs less often, leaving fewer openings for employers to backfill and perpetuating a cycle: Weak hiring gives workers fewer jobs worth quitting", "date_str": "2026-09-18T09:30:01+00:00", "hash": "5dff5a723df9c49b", "title_fa": "بازار کار و مسکن آمریکا گیر کرده است. اگر این نرمال جدید باشد چه؟", "summary_fa": "گتی ایماژ; آلیسا پاول/BI منتظر شغل یا بازار مسکن بهتر هستید؟ ممکن است مدتی منتظر بمانید. استخدام نزدیک به پایین ترین سطح رکود بزرگ است، در حالی که مقرون به صرفه بودن خانه نزدیک به بدترین وضعیت خود در دهه های اخیر است. اگر این حالت عادی جدید باشد، آمریکایی ها ممکن است مجبور شوند در برنامه های شغلی و مسکن خود تجدید نظر کنند. اگر برای یافتن شغل یا خرید خانه منتظر زمان بهتری بوده اید، خود را آماده کنید: ممکن است اوضاع به این زودی ها بهتر نشود. دو سال پیش، من در مورد اقتصادی نوشتم که بین آمریکایی‌هایی تقسیم شده بود که در شرایط مساعد در مشاغل و خانه‌هایشان در برابر آنهایی که شرایط مساعد داشتند، بسته بودند. رونق استخدام به یک رکود استخدام تبدیل شده بود، در حالی که نرخ وام مسکن و قیمت مسکن هر دو به طور قابل توجهی افزایش یافته بودند. دو سال بعد، یافتن شغل یا خرید خانه، به جز چند فرصت، چندان آسان نشده است. کسب‌وکارهای آمریکایی تقریباً با همان نرخی که دو سال پیش بودند استخدام می‌کنند - نزدیک به پایین‌ترین سطح از زمان رکود بزرگ. مقرون به صرفه بودن خانه تقریباً به همان اندازه که در دهه های گذشته بوده است بد است. برای جویندگان کار و خریداران احتمالی خانه، این یک سوال ناراحت کننده ایجاد می کند: اگر این فقط یک وصله خشن نباشد چه؟ اگر نرمال جدید باشد چه؟ بازار کار کم‌استخدام کمتر موقتی به نظر می‌رسد Gautam Dev از زمانی که نقش مهندسی نرم‌افزارش در اکتبر 2024 به پایان رسید، به دنبال یک شغل تمام وقت بوده است. دیو که 60 ساله است و در دالاس زندگی می کند، می گوید: \"هرگز فکر نمی کردم اینقدر شدید باشد، زیرا همیشه توانسته ام شغلی پیدا کنم.\" Gautam Dev برای کمک به پرداخت صورت‌حساب‌های خود در حین جستجوی"}, {"source": "Business Insider", "title": "I always wanted grandchildren. AI and an uncertain future have complicated that dream.", "link": "https://www.businessinsider.com/mother-adult-children-worried-ai-future-2026-9", "summary": "The author didn t think she d continue worrying about her kids after almost 40 years of parenting. Then came AI. Courtesy of the author I've spent nearly 40 years worrying about the safety of my two children. My kids are grown, but AI has given me a new reason to worry about them. I feel guilty about the uncertain world my generation is leaving behind. When I thought about all the things that I, as a mother, should warn my children against, protect them from, perhaps even apologize for, Artificial Intelligence was not among them. I am a Generation Jones mother with two millennial children in their 30s, and the end of the world is nigh. I am really, really, very sorry but I have become OK with my children remaining childless. Having another generation to worry about seems overwhelming. I'm a parent who worries Fifteen years ago, at dinner at my house, some friends and I began to talk about the singularity — a hypothetical scenario in which AI surpasses human capabilities . This was the first time I had thought about AI taking over the world and ridding us of, well, us. Other than science fiction, which I found scarily convincing but not really personally threatening, as I had always been more interested in the theoretical than its coming reality. But a friend who was a certified geek and programmer insisted that it was coming: fast and soon. I really haven't stopped thinking about it since. I'm a worrier. Throughout my nearly 40 years of parenting , I've anticipated illness, injury, all manner of car accidents, bad partners, and even the proverbial acting out. And I feel like I have risen to meet the challenges, even as those morphed from the benign to the serious. I learned quickly that getting the kids grown up just meant a different set of concerns. The author is sorry for the world she s leaving her kids. Courtesy of the author My kids and I talk about most everything; they're delightful adults, smart, funny, keen to learn, politically involved. But my first instinct has always been to protect them. To monitor my own increasing existential dread, but also acknowledge the failure of generations to manifest the Utopia we were striving for. I get it if my kids don't want to have kids For many years, I longed for grandchildren, until I didn't. How could I foist imminent doom on yet another generation when I still feel responsible for the children I had? I think having babies today is bravery I truly admire. It didn't feel particularly brave when I had my ow", "date_str": "2026-09-18T09:23:01+00:00", "hash": "16a587e9ce7b023c", "title_fa": "من همیشه نوه می خواستم. هوش مصنوعی و آینده نامشخص این رویا را پیچیده کرده است.", "summary_fa": "نویسنده فکر نمی کرد که پس از تقریباً 40 سال پدر و مادر شدن، همچنان نگران فرزندانش باشد. سپس هوش مصنوعی آمد. با حسن نیت از نویسنده من نزدیک به 40 سال را صرف نگرانی در مورد امنیت دو فرزندم کرده ام. بچه های من بزرگ شده اند، اما هوش مصنوعی دلیل جدیدی برای نگرانی در مورد آنها به من داده است. من نسبت به دنیای نامطمئنی که نسل من پشت سر می گذارد احساس گناه می کنم. وقتی به همه چیزهایی فکر می کردم که به عنوان یک مادر باید به فرزندانم هشدار دهم، از آنها محافظت کنم، شاید حتی از آنها عذرخواهی کنم، هوش مصنوعی در بین آنها نبود. من یک مادر نسل جونز هستم با دو فرزند هزار ساله در 30 سالگی، و پایان دنیا نزدیک است. من واقعاً، واقعاً، بسیار متاسفم، اما با بی فرزند ماندن فرزندانم مشکلی ندارم. داشتن نسل دیگری برای نگرانی به نظر طاقت فرسا است. من پدر و مادری هستم که نگران پانزده سال پیش، هنگام صرف شام در خانه ام، من و تعدادی از دوستان شروع به صحبت در مورد تکینگی کردیم - سناریویی فرضی که در آن هوش مصنوعی از توانایی های انسانی فراتر می رود. این اولین باری بود که به این فکر می‌کردم که هوش مصنوعی دنیا را تحت کنترل درآورد و ما را از شر ما خلاص کند. به غیر از داستان های علمی تخیلی، که به نظرم ترسناکی متقاعد کننده بود، اما نه واقعاً تهدیدکننده، زیرا همیشه بیشتر به جنبه نظری علاقه مند بودم تا واقعیت آینده. اما یکی از دوستان که یک متخصص و برنامه نویس تایید شده بود، اصرار داشت که این خبر در راه است: سریع و به زودی. واقعاً از آن زمان دیگر به آن فکر نمی کنم. من یک نگران هستم. در طول تقریباً 40 سال پدر و مادری ام، پیش"}, {"source": "Business Insider", "title": "I'm job searching in my 50s after a 17-year career break. I feel like I'm sending my résumé into a black hole.", "link": "https://www.businessinsider.com/17-year-career-break-stay-at-home-mom-job-hunt-2026-9", "summary": "Natalie Strawn is re-entering the job market after 16 years as a stay-at-home mom. Courtesy of Natalie Strawn Natalie Strawn quit her job at Adobe in 2009 and hasn't been in the job market since. Seventeen years since her last job, she's looking for work or self-employment opportunities. She said she needs to find a job by January, when changes to Medicaid requirements take effect. This as-told-to essay is based on a conversation with Natalie Strawn, a 52-year-old stay-at-home mom of two in Colorado who is going back to the workforce 17 years after quitting her job at Adobe. She's been finding the job market challenging and is leaning toward self-employment. Business Insider previously profiled her husband , who took a job as a school bus driver after being laid off from Adobe after 25 years. The following has been edited for length and clarity. After 16 years as a stay-at-home mom, I'm getting back into the workforce to help my husband supplement our family income, after he was laid off. I started job searching around mid-2026, and haven't gotten an interview. Trying to start a new career in your 50s is hard. I have a lot to offer in terms of experience and skills, but I feel like employers are maybe looking for someone who's younger or a bit more spry. Searching the internet for a job feels like a bunch of dead ends. What has your job search been like? Have you been looking for work for a while, made a career pivot, or had to dip into savings? Reach out to this reporter to share what it's been like at mhoff@businessinsider.com . I've been a stay-at-home mom since 2010 After graduating with a Bachelor of Fine Arts in illustration, I worked a fun job for a fine artist. I then moved into graphic design and worked for a small startup for a few years. I was unemployed for a period of time in the early 2000s, so I started doing my own fine art work, picking up jobs here and there, and selling my paintings and artwork at art festivals. Strawn with her artwork. Courtesy of Natalie Strawn In the mid-2000s, an opportunity came up at Adobe, where my husband, James, was already working. I got my portfolio together. I ended up not getting the job I interviewed for, but a few months later, I landed a contract graphic designer role at the company. Eventually, I became a permanent employee. James and I were living in California and really wanted to get a home, but the area was crazy expensive. We decided to move to Colorado , where we had family. It took about a year fo", "date_str": "2026-09-18T09:10:01+00:00", "hash": "f84ce3ebbbc3b9d4", "title_fa": "من در دهه 50 زندگی ام پس از 17 سال وقفه شغلی به دنبال کار هستم. احساس می کنم دارم رزومه ام را به یک سیاهچاله می فرستم.", "summary_fa": "ناتالی استراون پس از 16 سال به عنوان یک مادر در خانه دوباره وارد بازار کار می شود. با حسن نیت از Natalie Strawn ناتالی استراون در سال 2009 کار خود را در Adobe ترک کرد و از آن زمان در بازار کار حضور نداشته است. هفده سال از آخرین شغلش می گذرد، او به دنبال فرصت های شغلی یا خوداشتغالی است. او گفت که باید تا ژانویه، زمانی که تغییرات در الزامات Medicaid اعمال شود، شغلی پیدا کند. این مقاله گفته شده بر اساس گفتگو با ناتالی استراون، یک مادر 52 ساله در خانه دو فرزند در کلرادو است که 17 سال پس از ترک شغل خود در Adobe، به نیروی کار باز می گردد. او بازار کار را چالش برانگیز می داند و به سمت خوداشتغالی متمایل شده است. Business Insider قبلاً مشخصات شوهرش را معرفی کرده بود که پس از 25 سال اخراج از Adobe به عنوان راننده اتوبوس مدرسه مشغول به کار شد. موارد زیر برای طول و وضوح ویرایش شده است. پس از 16 سال به عنوان یک مادر خانه نشین، من دوباره وارد نیروی کار می شوم تا به شوهرم کمک کنم تا درآمد خانواده ما را افزایش دهد، بعد از اینکه او اخراج شد. من در اواسط سال 2026 جستجوی کار را شروع کردم و مصاحبه ای انجام ندادم. تلاش برای شروع یک حرفه جدید در دهه 50 زندگی سخت است. من از نظر تجربه و مهارت چیزهای زیادی برای ارائه دارم، اما احساس می‌کنم کارفرمایان ممکن است به دنبال فردی باشند که جوان‌تر یا کمی باحال‌تر باشد. جستجو در اینترنت برای یافتن شغل مانند یک دسته بن بست است. جستجوی شغلی شما چگونه بوده است؟ آیا مدتی است که به دنبال کار می‌گردید، مسیر شغلی خود را تغییر می‌دهید یا مجبور شده‌اید پس‌انداز کنید؟ برای به اشتراک گذاشتن وضعیت آن در mhoff@businessinsider.com"}, {"source": "Business Insider", "title": "I moved from Indiana to New Mexico for a sunnier life. My social life, mood, and physical activity level have gotten a major uplift.", "link": "https://www.businessinsider.com/public-health-professor-left-indiana-found-fulfillment-new-mexico-2026-9", "summary": "Jagdish Khubchandani. Josh Bachman, New Mexico State University Jagdish Khubchandani moved from Indiana to New Mexico in 2020 for a better climate and lifestyle. Khubchandani's move to New Mexico improved his social life and personal happiness. He does miss the connectivity of Indiana and says that most things were cheaper in the Midwest. This as-told-to essay is based on a conversation with Jagdish Khubchandani , a 47-year-old professor of public health in Las Cruces, New Mexico. It's been edited for length and clarity. After working in medicine in India, I moved to the US to study and started my career here as an assistant professor, then an associate professor, and finally a full professor in Indiana. Since 2020, I've been working at New Mexico State University as a professor of public health and program advisor. After moving from Indiana to New Mexico , I feel I made the right choice and am happier because I don't have to deal with brutal winters, snow-related hassles, or constantly staying indoors. It's also been a new phase of learning as I'm in public health, and a change of setting demands thinking and acting differently. I was born in western India and went to central India for medical school After graduating, I took local jobs in New Delhi as a resident physician in internal medicine and psychiatry. I started to feel that my impact was limited to individuals, and I hoped to gain more skills and training to have a broader impact on more people. I packed my bags and moved to Kentucky for a master's degree in public health, then to Ohio for my doctorate in health education. I was hired as a faculty member at BSU in Indiana. In total, I lived in the Midwest for 15 years, with the last 10 in Indiana. The small college town of Muncie averages more than a foot of snow each winter. Some winters in Muncie were really harsh, windy, and freezing for weeks at a time. Over time, I realized I was only working and not living My life was static with few social connections, infrequent pursuit of hobbies, little travel, and not meeting new people or exploring new cultures. Work-wise, too, I felt I was stagnating and limited by the same routine. My line of work emphasizes assessing and helping to solve societal challenges in health, education, and social welfare. My opportunities for personal and professional growth were limited at times. I started to consider moving to a slightly larger town Because a substantial part of the year was colder, I was constantly indoo", "date_str": "2026-09-18T09:05:02+00:00", "hash": "d5d0d0218b6c72f6", "title_fa": "من از ایندیانا به نیومکزیکو نقل مکان کردم تا یک زندگی آفتابی تر داشته باشم. زندگی اجتماعی، خلق و خوی و سطح فعالیت بدنی من ارتقاء زیادی یافته است.", "summary_fa": "جگدیش خوبچندانی. جاش باچمن، دانشگاه ایالتی نیومکزیکو جاگدیش خوبچاندانی در سال 2020 برای داشتن آب و هوا و سبک زندگی بهتر از ایندیانا به نیومکزیکو نقل مکان کرد. انتقال خوبچندانی به نیومکزیکو باعث بهبود زندگی اجتماعی و شادی شخصی او شد. او ارتباط ایندیانا را از دست می دهد و می گوید که بیشتر چیزها در غرب میانه ارزان تر بودند. این مقاله گفته شده بر اساس گفتگو با جاگدیش خوبچاندانی، پروفسور 47 ساله بهداشت عمومی در لاس کروسس، نیومکزیکو است. برای طول و وضوح ویرایش شده است. پس از کار در پزشکی در هند، برای تحصیل به آمریکا رفتم و کارم را در اینجا به عنوان استادیار، سپس دانشیار و در نهایت استاد تمام در ایندیانا آغاز کردم. از سال 2020، من در دانشگاه ایالتی نیومکزیکو به عنوان استاد بهداشت عمومی و مشاور برنامه مشغول به کار هستم. پس از نقل مکان از ایندیانا به نیومکزیکو، احساس می‌کنم انتخاب درستی انجام داده‌ام و خوشحال‌تر هستم، زیرا مجبور نیستم با زمستان‌های بی‌رحمانه، دردسرهای مربوط به برف، یا ماندن مداوم در داخل خانه کنار بیایم. همچنین با توجه به اینکه من در سلامت عمومی هستم، این مرحله جدیدی از یادگیری بوده است و تغییر در تنظیمات نیازمند تفکر و عمل متفاوت است. من در غرب هند متولد شدم و برای دانشکده پزشکی به هند مرکزی رفتم. من شروع به این احساس کردم که تأثیر من محدود به افراد است و امیدوار بودم که مهارت ها و آموزش های بیشتری کسب کنم تا تأثیر گسترده تری بر افراد بیشتری داشته باشم. چمدان‌هایم را بستم و برای مدرک کارشناسی ارشد در رشته بهداشت عمومی به کنتاکی و سپس برای دکترای آموزش بهداشت به اوهایو رفتم. من به عنوان عضو هیئت علمی در BSU در ایندیانا استخدام شدم. در مجموع، من 15 سال در غرب میانه زندگی کردم و 10 سال آخر در ایندیانا"}, {"source": "Business Insider", "title": "'The Diary of a CEO' star Steven Bartlett says he can't do his job without X — and is wary of Meta", "link": "https://www.businessinsider.com/diary-of-ceo-steven-bartlett-x-platform-of-choice-news-2026-9", "summary": "The Diary of a CEO host Steven Bartlett says creators need to control their audience relationships. Shane Anthony Sinclair/Getty Images for Cannes Lions Star podcaster Steven Bartlett favors X to keep up with a fast-paced news cycle. He also expressed concern that AI would accelerate the decline of creators' social reach. That's why he's focusing on building direct relationships with his audience through events and more. \"The Diary of a CEO\" host Steven Bartlett is close to catching Joe Rogan in subscribers on YouTube and has become the No. 1 business podcast on Spotify in the US. But when it comes to staying up on the news, it's X that he prizes. \"I just find it like a day ahead, especially on subjects I care about in a rapidly changing world, like AI, frankly,\" the star podcaster said, speaking at an event to announce a $400 million creator venture with Authentic Brands Group. Elon Musk-owned X has dipped slightly in recent years as a news source but remains a go-to for 12% of US adults, behind Facebook, YouTube, Instagram, and TikTok, according to 2025 Pew Research Center data. Among users of the platform, though, 57% regularly get news there, a higher percentage than among users of the other platforms. \"I need to be very quickly up to date as an interviewer,\" Bartlett said. \"And yesterday night, we did a big debate interview here in Manhattan with the three biggest experts in AI safety . You can imagine how quickly that moves. I actually have to have a screen in real time when I'm interviewing to see if the news is changing.\" Bartlett hit on another platform during the conversation — in a far less complimentary way. Bartlett spoke about the importance of creators controlling their own destinies. He recalled the early days of social media, when platforms gave publishers traffic in exchange for posting. \"Back then, it was Facebook. It was Twitter and Snapchat, and we thought we owned those audiences,\" he said. \"The big publishers at the time, the BuzzFeeds of the world — we thought because we had Facebook likes, that was a relationship. And over time, we saw that everybody eventually gets Zucked.\" (That was a reference to Meta chief Mark Zuckerberg.) Bartlett mentioned that, at one point years ago, organic reach for a meme account run by his former social agency, Social Chain, plunged by 50% on Facebook. \"Not just us, all of our competitors, almost exactly, eerily exactly 50%,\" he said. Bartlett said Meta's latest earnings call was another warning sign. ", "date_str": "2026-09-18T09:05:01+00:00", "hash": "060ce452264832a6", "title_fa": "استیون بارتلت، ستاره «خاطرات یک مدیر عامل» می‌گوید بدون X نمی‌تواند کارش را انجام دهد - و نسبت به متا محتاط است.", "summary_fa": "استیون بارتلت میزبان دفتر خاطرات یک مدیر عامل می گوید که سازندگان باید روابط مخاطبان خود را کنترل کنند. Shane Anthony Sinclair/Getty Images برای پادکستر Cannes Lions Star، استیون بارتلت، X را دوست دارد تا با چرخه اخبار سریع همراه شود. او همچنین ابراز نگرانی کرد که هوش مصنوعی کاهش دسترسی اجتماعی سازندگان را تسریع کند. به همین دلیل است که او بر ایجاد روابط مستقیم با مخاطبان خود از طریق رویدادها و موارد دیگر تمرکز می کند. استیون بارتلت مجری «دفترچه خاطرات یک مدیر عامل» نزدیک است جو روگان را در میان مشترکین یوتیوب جلب کند و به پادکست شماره 1 تجاری Spotify در ایالات متحده تبدیل شده است. اما وقتی نوبت به ماندن در اخبار می رسد، X است که او جایزه می دهد. این پادکست ستاره که در رویدادی برای اعلام یک سرمایه‌گذاری ۴۰۰ میلیون دلاری با شرکت Authentic Brands Group صحبت می‌کرد، گفت: «من آن را مانند یک روز آینده می‌بینم، به خصوص در مورد موضوعاتی که در دنیایی که به سرعت در حال تغییر هستند، مانند هوش مصنوعی، صادقانه بگویم. طبق داده‌های مرکز تحقیقات پیو در سال 2025، X متعلق به ایلان ماسک به عنوان یک منبع خبری اندکی در سال‌های اخیر کاهش یافته است، اما همچنان برای 12 درصد از بزرگسالان آمریکایی، پس از فیس‌بوک، یوتیوب، اینستاگرام و تیک‌توک، مورد استفاده قرار می‌گیرد. با این حال، در میان کاربران این پلتفرم، 57 درصد به طور مرتب اخبار را از آنجا دریافت می‌کنند که درصدی بالاتر از کاربران سایر پلتفرم‌ها است. بارتلت گفت: \"من باید به عنوان یک مصاحبه کننده خیلی سریع به روز باشم.\" \"و دیروز شب، ما یک مصاحبه مناظره بزرگ اینجا در منهتن با سه متخصص بزرگ در ایمنی هوش مصنوعی انجام دادیم. می توانید تصور کنید که چقدر سریع حرکت می کند. من در واقع باید یک صفحه نمایش در زمان"}, {"source": "Business Insider", "title": "OpenAI is offering engineers up to $500,000 in salary as it pushes into robotics", "link": "https://www.businessinsider.com/openai-is-offering-robotics-engineers-up-to-500-000-in-salary-2026-9", "summary": "OpenAI CEO Sam Altman Bloomberg/Getty Images OpenAI has 27 robotics jobs listed on its careers page, up from 11 in May. Base salaries for the roles reach as high as $500,000 a year. The postings point to plans to build robot hardware, data systems, and AI in-house. OpenAI is offering robotics engineers up to half a million dollars a year in base salaries as it builds out its robotics efforts. The company has 27 robotics jobs listed on its careers page, up from 11 in May, spanning hardware, software, data collection, and prototyping, according to Business Insider's review. Publicly advertised base salaries range from $177,000 to half a million dollars a year, before equity. The listings offer a closer look at the range of robotics work OpenAI is doing itself. The company is hiring people to design and build hardware, collect the data needed to train robots, and test them, not just develop software that controls them. OpenAI is hiring actuator design engineers, who build the motors and mechanisms that move a robot's joints, alongside software, firmware, and machine-learning engineers. It is looking for a lab technician to help \"develop, build, test, and iterate on robotic systems,\" as well as a lawyer dedicated to the robotics team. Another role would oversee OpenAI's \"data collection facilities,\" pointing to one of the industry's biggest bottlenecks. Unlike large language models, which could be trained on vast amounts of data already on the internet, robots need examples of how people and machines interact with the physical world. Robotics companies often have to generate that data themselves or buy it from outside vendors. The highest-paid opening is for a machine-learning engineer working on distributed data systems, infrastructure for processing and moving large amounts of robotics training data across computers. The role lists a base salary of up to $500,000. OpenAI declined to comment. Guy Hoffman, a Cornell mechanical and aerospace engineering professor who leads the university's Human-Robot Collaboration and Companionship Lab, reviewed all 27 postings for Business Insider. He said OpenAI appears to be assembling a \"custom robot design team.\" The postings nod at OpenAI's long-term robotics ambitions. One says the robotics team is focused on \"unlocking general-purpose robotics and pushing towards AGI-level intelligence\" and is exploring \"a broad range of robotics form factors.\" Another says its long-term vision is \"everyone having a personal robot doin", "date_str": "2026-09-18T09:00:03+00:00", "hash": "d1053f9db8c81604", "title_fa": "OpenAI به مهندسان تا 500,000 دلار حقوق ارائه می دهد زیرا به سمت روباتیک پیش می رود", "summary_fa": "مدیر عامل OpenAI سام آلتمن بلومبرگ/گتی ایماژ OpenAI دارای 27 شغل رباتیک در صفحه مشاغل خود است که از 11 در ماه می افزایش یافته است. دستمزد پایه برای این نقش ها به 500000 دلار در سال می رسد. این پست ها به برنامه هایی برای ساخت سخت افزار ربات، سیستم های داده و هوش مصنوعی در داخل اشاره دارد. OpenAI به مهندسان رباتیک تا نیم میلیون دلار در سال حقوق پایه ارائه می دهد که تلاش های رباتیک خود را افزایش می دهد. بر اساس بررسی Business Insider، این شرکت 27 شغل رباتیک در صفحه مشاغل خود دارد که از 11 شغل در ماه می افزایش یافته است که شامل سخت افزار، نرم افزار، جمع آوری داده ها و نمونه سازی است. دستمزدهای پایه آگهی عمومی بین 177000 دلار تا نیم میلیون دلار در سال قبل از حقوق صاحبان سهام متغیر است. فهرست‌ها نگاه دقیق‌تری به گستره کارهای روباتیکی که OpenAI خودش انجام می‌دهد را ارائه می‌دهد. این شرکت افرادی را برای طراحی و ساخت سخت افزار، جمع آوری داده های مورد نیاز برای آموزش ربات ها و آزمایش آنها استخدام می کند، نه فقط توسعه نرم افزاری که آنها را کنترل می کند. OpenAI مهندسان طراحی محرک را استخدام می کند که موتورها و مکانیسم هایی را که مفاصل یک ربات را حرکت می دهند، در کنار مهندسان نرم افزار، سیستم عامل و یادگیری ماشین می سازند. به دنبال یک تکنسین آزمایشگاهی برای کمک به «توسعه، ساخت، آزمایش و تکرار بر روی سیستم‌های روباتیک» و همچنین یک وکیل اختصاص داده شده به تیم روباتیک است. نقش دیگری بر «امکانات جمع‌آوری داده‌های OpenAI» نظارت می‌کند که به یکی از بزرگ‌ترین گلوگاه‌های صنعت اشاره می‌کند. برخلاف مدل‌های زبان بزرگ، که می‌توان آن‌ها را بر روی حجم وسیعی از داده‌های موجود در اینترنت آموزش داد، روبات‌ها به نمونه‌هایی از نحوه تعامل"}, {"source": "Business Insider", "title": "Oracle exec tells workers that its own AI rollout didn't go so smoothly", "link": "https://www.businessinsider.com/oracle-built-ai-rollout-came-much-later-2026-9", "summary": "Clay Magouyrk is the co-CEO of Oracle. Bloomberg/Getty Images Oracle has spent years building infrastructure for the AI boom. As recently as a year ago, it hadn't found broad internal uses for the tools, its co-CEO said. That changed this spring when Oracle rolled out OpenAI tools and reached 80% adoption. Oracle spent billions over the past two years helping other companies run AI. Its own companywide AI rollout came much later. During an internal town hall this week , co-CEO Clay Magouyrk said that last year, the company still hadn't found a way to make generative AI broadly useful to its own workforce. Now, after rolling out OpenAI's ChatGPT and Codex, employees are writing code dramatically faster, but creating new bottlenecks along the way. \"When I think about where we were a year ago,\" Magouyrk said, \"I don't think we figured out how do we make AI really that useful for ourselves.\" Oracle had made some progress in using AI for customer support last year, but it had not yet found broad use across business units, such as developers, finance employees, and sales teams. That started to change, Oracle Chief Information Officer Jae Evans told employees, in April and May, when the company rolled out ChatGPT Enterprise, and OpenAI's software development tool, Codex. Rather than simply making the tools available, the company established corporate standards, security controls, and internal policies and reached 80% adoption within three months, Evans said. \"We made it so easy to use and adopt that we might have gotten a little bit of sticker shock,\" Evans said, so now the company provides visibility into which models employees are using and how much they cost. OpenAI's GPT-6 Astra costs 2.5 times more than other models, like could be used for many purposes, Evans said, citing Terra as an example of a lower-cost model that could be used for routine tasks. The executives said AI has dramatically accelerated software development, but also created new bottlenecks elsewhere in the engineering process. \"We see developers able to generate code using this tool in like a week's time,\" Evans said. \"Normally, that would have taken a team of developers two to three quarters to go develop.\" For now, AI deployment at Oracle hasn't translated into getting those products to customers more quickly. \"When you make the actual act of writing the code quicker, it doesn't mean that suddenly everything is 1000 times faster,\" Magouyrk said, explaining that Oracle is still figuring out", "date_str": "2026-09-18T09:00:02+00:00", "hash": "bfa8c308caa7dafd", "title_fa": "اوراکل exec به کارگران می‌گوید که عرضه هوش مصنوعی خود به این راحتی پیش نرفت", "summary_fa": "Clay Magouyrk یکی از مدیران عامل اوراکل است. بلومبرگ/گتی ایماژ اوراکل سال‌ها صرف ساخت زیرساخت‌ها برای رونق هوش مصنوعی کرده است. یکی از مدیران عامل آن گفت که تا یک سال پیش، این ابزار کاربرد داخلی گسترده ای برای این ابزار پیدا نکرده بود. زمانی که اوراکل ابزارهای OpenAI را عرضه کرد و به 80 درصد پذیرش رسید، این وضعیت تغییر کرد. اوراکل در دو سال گذشته میلیاردها دلار برای کمک به سایر شرکت‌ها در اجرای هوش مصنوعی هزینه کرده است. عرضه هوش مصنوعی خود در سراسر شرکت بسیار دیرتر انجام شد. در طی یک تالار داخلی این هفته، Clay Magouyrk، یکی از مدیران اجرایی، گفت که سال گذشته، این شرکت هنوز راهی برای ایجاد هوش مصنوعی مولد به طور گسترده برای نیروی کار خود پیدا نکرده است. اکنون، پس از عرضه ChatGPT و Codex OpenAI، کارمندان به طرز چشمگیری سریعتر کد می نویسند، اما در این راه تنگناهای جدیدی ایجاد می کنند. Magouyrk گفت: «وقتی به جایی که یک سال پیش بودیم فکر می‌کنم، فکر نمی‌کنم بفهمیم چگونه می‌توانیم هوش مصنوعی را برای خودمان مفید کنیم.» اوراکل در سال گذشته پیشرفت هایی در استفاده از هوش مصنوعی برای پشتیبانی از مشتری داشته است، اما هنوز در واحدهای تجاری مانند توسعه دهندگان، کارمندان مالی و تیم های فروش کاربرد گسترده ای پیدا نکرده است. جائه ایوانز، مدیر ارشد اطلاعات اوراکل، در آوریل و می، زمانی که شرکت ChatGPT Enterprise و ابزار توسعه نرم‌افزار OpenAI، Codex را راه‌اندازی کرد، به کارمندان گفت که این شروع به تغییر کرد. ایوانز گفت که این شرکت به جای در دسترس قرار دادن ابزارها، استانداردهای شرکتی، کنترل‌های امنیتی و سیاست‌های داخلی را ایجاد کرد و طی سه ماه به ۸۰ درصد پذیرش رسید. ایوانز گفت: «ما آنقدر استفاده و استفاده از آن را آسان کردیم که ممکن است کمی شوک برچسب خورده باشیم. ایوانز گفت"}, {"source": "Business Insider", "title": "A dietitian with eczema shares the 3 simple ways she lowers inflammation for clearer skin — without restrictive eating", "link": "https://www.businessinsider.com/dietitian-eczema-anti-inflammatory-diet-gut-health-clear-skin-2026-9", "summary": "Rakhi Roy Chowdhury, a registered dietitian in Florida, switched career paths from acting to nutrition when changing her own diet vastly reduced her eczema flare-ups. Photohead Photography Rakhi Roy Chowdhury, a registered dietitian in Florida, has had eczema since childhood. Her skin didn't improve until she tried an anti-inflammatory diet and improved her gut health. She aims to eat 30 grams of fiber a day and follows the \"80/20\" rule for sugar and alcohol. Before she became a dietitian, Rakhi Roy Chowdhury wanted to be an actor. Her eczema flare-ups got in the way. \"It was pretty much a geographic patchy map of eczema that was all over my body,\" Chowdhury, 36, told Business Insider. She felt the red blotches she got on her face, hands, chest, back, elbows, and behind her knees made it difficult to go on auditions for TV and film roles. Chowdhury has dealt with eczema since she was about six months old. She said her breakouts were so bad that, when she was 10, her parents even relocated their family from New York City to Florida on a doctor's recommendation, who told them the latter location had fewer environmental pollutants and dry winter weather that could trigger symptoms. Chowdhury said her eczema flare-ups made it difficult to audition for on-screen roles. Scott Dentinger/Rakhi Roy Chowdhury Chowdhury felt better, but still dealt with flare-ups, trying topical skincare products such as steroid creams . She started experiencing side effects when she went off them. \"My skin was thinning,\" she said. \"I almost looked like a burn patient.\" In her early 20s, she saw a dietitian on her allergist's recommendation — a solution considered more \"outside the box\" back then, she said. Chowdhury was advised to eliminate potential inflammatory triggers, such as ultra-processed foods, and to diversify her diet overall with more fruits, vegetables, grains, and healthy fats. She said that within about six weeks, she noticed significant improvement. While she still experiences flare-ups from triggers like dust, pollen, and cat dander, she said cutting down her inflammation greatly cleared her skin. The experience motivated Chowdhury to switch career paths and become a registered dietitian, now focusing on gut health and anti-inflammatory foods. She shared the three dietary habits she follows to reduce inflammation — without feeling too restricted. Fiber-packed, diverse meals support her gut health Chowdhury aims to get 30 grams of fiber every day, made easier by stac", "date_str": "2026-09-18T09:00:01+00:00", "hash": "6a8d998f59be7622", "title_fa": "یک متخصص تغذیه مبتلا به اگزما 3 روش ساده را برای کاهش التهاب برای پوست شفاف‌تر به اشتراک می‌گذارد - بدون محدودیت غذایی", "summary_fa": "Rakhi Roy Chowdhury، یک متخصص تغذیه در فلوریدا، مسیر شغلی خود را از بازیگری به تغذیه تغییر داد، زمانی که تغییر رژیم غذایی خود باعث کاهش شدید تشدید اگزما شد. Photohead Photography Rakhi Roy Chowdhury، یک متخصص تغذیه در فلوریدا، از دوران کودکی مبتلا به اگزما بوده است. پوست او تا زمانی که رژیم ضد التهابی را امتحان نکرد و سلامت روده اش را بهبود بخشید، بهبود نیافت. او قصد دارد 30 گرم فیبر در روز بخورد و از قانون \"80/20\" برای قند و الکل پیروی می کند. راخی روی چاودری قبل از اینکه یک متخصص تغذیه شود، می خواست بازیگر شود. شعله ور شدن اگزما او مانع شد. چاودری، 36 ساله، به Business Insider گفت: «این تقریباً یک نقشه تکه تکه جغرافیایی از اگزما بود که در سراسر بدن من وجود داشت. لکه‌های قرمزی که روی صورت، دست‌ها، سینه، پشت، آرنج‌ها و پشت زانوهایش ایجاد می‌کرد، کار را برای شرکت در تست‌های بازیگری برای نقش‌های تلویزیونی و سینمایی دشوار می‌کرد. چاودری از حدود شش ماهگی با اگزما دست به گریبان بوده است. او گفت که جوش‌های او به حدی بد بود که وقتی 10 ساله بود، والدینش حتی خانواده‌شان را به توصیه پزشک از شهر نیویورک به فلوریدا نقل مکان کردند، که به آنها گفت مکان دوم دارای آلاینده‌های محیطی کمتر و هوای خشک زمستانی است که می‌تواند علائم را ایجاد کند. چاودری گفت که شعله ور شدن اگزما او، تست بازیگری برای نقش های روی پرده را دشوار کرده است. اسکات دنتینگر/راخی روی چاودری چاودری احساس بهتری داشت، اما همچنان با شعله ور شدن آن مقابله کرد و محصولات مراقبت از پوست موضعی مانند کرم های استروئیدی را امتحان کرد. هنگامی که آنها را ترک کرد، شروع به تجربه عوارض جانبی کرد. او گفت: «پوستم نازک شده بود. من تقریباً شبیه یک بیمار سوختگی به نظر می رسیدم."}, {"source": "Business Insider", "title": "A renowned computer scientist once skeptical of the AI singularity now says humanity is 'certainly at risk'", "link": "https://www.businessinsider.com/ai-singularity-arrived-computer-scientist-thoughts-scott-aaronson-openai-researcher-2026-9", "summary": "Scott Aaronson, a theoretical computer scientist and former OpenAI researcher, wrote in a blog that the AI singularity has arrived. Saul Loeb/AFP via Getty Images Scott Aaronson is a theoretical computer scientist who previously worked at OpenAI on AI safety. In a blog, Aaronson wrote that he believes the \"AI Singularity\" has arrived. Aaronson didn't say if AI will wipe out humanity, but wrote that the transformative phase has begun. A lot of X posts, prose, and proselytizing have been spilled on the internet recently about the impending AI apocalypse and whether we've passed the point of no return. Here's another one eloquently put by the acclaimed theoretical computer scientist Scott Aaronson, whose research has helped us understand the limits of quantum computing. Oh, and he had a stint at OpenAI working on the theoretical foundations of AI safety and alignment: \"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA,\" he wrote. That's 113 letters A. In a blog post published Tuesday, Aaronson made the case for why he, a self-proclaimed skeptic of the AI singularity , \"updated\" his position on its arrival. The singularity is a hypothetical concept in which AI's progress surpasses human intelligence and can improve on its own — a process known as recursive self-improvement. Aaronson wrote that, 20 years ago, he had a \"conservative, skeptical position\" on self-improving AI. He and other colleagues in computer science largely dismissed the idea as the stuff of science fiction. Recent developments have led him to change his tune, he wrote, namely, reports of AI agents breaking out of containment and an apparent AI-assisted mathematical breakthrough on the Navier-Stokes Millennium Prize problem, a long-standing question about the math of fluid dynamics. \"I thought that building AIs able to solve millennium problems, hack the servers they're running on, play leading roles in their own improvement, etc etc might for all I knew take hundreds of years,\" Aaronson said in an email to Business Insider. \"But here we are in 2026 and all those things have happened, so I said so.\" In his blog, Aaronson also briefly chimed in on the latest AI boom-or-doom debate that has split the tech industry. \"I feel like it would be healthy for everyone to stop grinding their ideological axes, their sentiments about Dario Amodei or Sam Altman, for long enough simply to acknowledge that the wonders and terrors are here,\" he wr", "date_str": "2026-09-18T08:11:01+00:00", "hash": "a6890c4845244935", "title_fa": "یک دانشمند مشهور کامپیوتر که زمانی نسبت به تکینگی هوش مصنوعی بدبین بود، اکنون می‌گوید که بشریت \"مطمئناً در خطر است\"", "summary_fa": "اسکات آرونسون، دانشمند نظری کامپیوتر و محقق سابق OpenAI، در وبلاگی نوشت که تکینگی هوش مصنوعی رسیده است. Saul Loeb/AFP via Getty Images اسکات آرونسون یک دانشمند نظری کامپیوتر است که قبلا در OpenAI در مورد ایمنی هوش مصنوعی کار می کرد. آرونسون در وبلاگی نوشت که معتقد است «تکینگی هوش مصنوعی» وارد شده است. آرونسون نگفت که آیا هوش مصنوعی بشریت را از بین خواهد برد یا خیر، اما نوشت که مرحله تحول آغاز شده است. اخیراً بسیاری از پست‌های X، نثر و تبلیغ در اینترنت در مورد آخرالزمان قریب الوقوع هوش مصنوعی و اینکه آیا ما از نقطه بی بازگشت عبور کرده‌ایم، منتشر شده است. در اینجا یکی دیگر از سخنان شیوا توسط دانشمند نظری تحسین شده کامپیوتر، اسکات آرونسون بیان شده است، که تحقیقاتش به ما در درک محدودیت های محاسبات کوانتومی کمک کرده است. اوه، و او سابقه ای در OpenAI داشت و روی مبانی نظری ایمنی و همسویی هوش مصنوعی کار می کرد: \"آآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآ. این 113 حرف A است. در یک پست وبلاگی که روز سه شنبه منتشر شد، آرونسون این موضوع را مطرح کرد که چرا او که خود را بدبین به تکینگی هوش مصنوعی معرفی می کند، موضع خود را در بدو ورود به آن \"به روز کرد\". تکینگی یک مفهوم فرضی است که در آن پیشرفت هوش مصنوعی از هوش انسانی پیشی می‌گیرد و می‌تواند به تنهایی بهبود یابد - فرآیندی که به عنوان خود-بهبودی بازگشتی شناخته می‌شود. آرونسون نوشت که 20 سال پیش، او یک \"موقعیت محافظه کارانه و شکاکانه\" در مورد بهبود هوش مصنوعی داشت. او و سایر همکارانش در علوم کامپیوتر تا حد زیادی این ایده را به عنوان ماده علمی تخیلی رد کردند. او نوشت: تحولات اخیر او را به تغییر لحن خود سوق داده است، یعنی گزارش هایی از خروج عوامل هوش مصنوعی و یک پیشرفت ریاضی"}, {"source": "Business Insider", "title": "The 'Godfather of AI' says the US government has one year to try to regulate AI before it gets 'out of control'", "link": "https://www.businessinsider.com/godfather-of-ai-geoffrey-hinton-warning-congress-ai-regulation-bill-2026-9", "summary": "The Godfather of AI Geoffrey Hinton warns that the window to regulate advanced AI may be closing rapidly. Ramsey Cardy/Sportsfile for Collision via Getty Images The \"Godfather of AI\" warns lawmakers may have only about a year to regulate advanced AI. Geoffrey Hinton says AI systems are starting to build smarter versions of itself. His warning comes as Silicon Valley's AI elite push to pace frontier AI. US lawmakers may have only about a year to put meaningful guardrails around artificial intelligence before AI advances to the point where it could become \"out of control,\" warned the \"Godfather of AI.\" Speaking after a briefing with members of Congress on Wednesday, Geoffrey Hinton said the window for regulating advanced AI has narrowed dramatically as the technology develops faster than many researchers expected. \"Maybe a year, but not much more than a year,\" Hinton said when asked how long policymakers have to act. He added that expectations for when superintelligent AI could emerge have accelerated dramatically, with estimates shrinking from decades to just a few years. \"AI has now reached the point where AI is designing better AI,\" Hinton said. \"It is going to get out of control unless we do something. We need to slow down,\" he said. On Wednesday, Hinton also pointed to the recent Hugging Face incident, in which a rogue AI agent attacked the open-source AI platform, and called it \"a little Chernobyl\" that underscored how quickly frontier AI systems are becoming harder to control. \"We shouldn't be developing stuff that might wipe us out,\" Hinton said, arguing researchers first need to know how to keep advanced AI under control. The Nobel Prize-winning computer scientist has become increasingly vocal about the risks posed by advanced AI. In an interview with the BBC last week , Hinton said it was \"not unreasonable\" to believe there is roughly a 10% chance AI could cause human extinction within the next decade. Hinton's latest warning came days after Anthropic CEO Dario Amodei published an essay urging the AI industry to \"pace the frontier,\" arguing AI capabilities are advancing faster than safety measures. OpenAI CEO Sam Altman, Google DeepMind CEO Demis Hassabis, and Elon Musk have backed key parts of the proposal, an unusual show of agreement among rival AI leaders. The calls have clashed with the Trump administration's approach. President Donald Trump rejected calls to slow AI development, arguing the US should maintain its lead over rivals such as Chin", "date_str": "2026-09-18T06:50:31+00:00", "hash": "38e9fda5ffa421bf", "title_fa": "«پدرخوانده هوش مصنوعی» می‌گوید دولت آمریکا یک سال فرصت دارد تا قبل از اینکه هوش مصنوعی «از کنترل خارج شود» قانون‌گذاری کند.", "summary_fa": "جفری هینتون، پدرخوانده هوش مصنوعی هشدار می دهد که پنجره تنظیم هوش مصنوعی پیشرفته ممکن است به سرعت بسته شود. رمزی کاردی/فایل ورزشی برای برخورد از طریق گتی ایماژ «پدرخوانده هوش مصنوعی» هشدار می دهد که قانونگذاران ممکن است تنها یک سال فرصت داشته باشند تا هوش مصنوعی پیشرفته را تنظیم کنند. جفری هینتون می گوید که سیستم های هوش مصنوعی شروع به ساخت نسخه های هوشمندتر از خود کرده اند. هشدار او در حالی است که نخبگان هوش مصنوعی سیلیکون ولی برای سرعت بخشیدن به هوش مصنوعی مرزی تلاش می کنند. \"پدرخوانده هوش مصنوعی\" هشدار داد که قانونگذاران ایالات متحده ممکن است تنها حدود یک سال فرصت داشته باشند تا پیش از پیشرفت هوش مصنوعی تا جایی که می تواند \"خارج از کنترل\" شود، حفاظ های معناداری را در اطراف هوش مصنوعی قرار دهند. جفری هینتون پس از یک جلسه توجیهی با اعضای کنگره در روز چهارشنبه گفت که پنجره تنظیم هوش مصنوعی پیشرفته به طور چشمگیری تنگ شده است زیرا این فناوری سریعتر از آنچه بسیاری از محققان انتظار داشتند توسعه می یابد. هینتون در پاسخ به این سوال که سیاست گذاران تا چه زمانی باید عمل کنند، گفت: «شاید یک سال، اما نه بیشتر از یک سال». او اضافه کرد که انتظارات برای زمان ظهور هوش مصنوعی فوق‌هوشمند به طرز چشمگیری افزایش یافته است و برآوردها از چند دهه به تنها چند سال کاهش یافته است. هینتون گفت: \"هوش مصنوعی اکنون به نقطه ای رسیده است که هوش مصنوعی بهتری طراحی می کند.\" او گفت: \"تا زمانی که کاری انجام ندهیم، از کنترل خارج خواهد شد. ما باید سرعت خود را کاهش دهیم.\" روز چهارشنبه، هینتون همچنین به حادثه اخیر Hugging Face اشاره کرد، که در آن یک عامل سرکش هوش مصنوعی به پلتفرم هوش مصنوعی منبع باز حمله کرد و آن را \"چرنوبیل کوچک\" نامید که"}, {"source": "Business Insider", "title": "Taboola is buying a rival adtech company to gain a bigger foothold with lucrative finance clients", "link": "https://www.businessinsider.com/taboola-acquire-uk-adtech-company-dianomi-2026-9", "summary": "Adam Singolda s Taboola is going shopping. John Lamparski/Getty Images Taboola is eyeing a bigger slice of the adtech market. It has made an offer to acquire fellow adtech firm Dianomi. The deal would help it clinch new premium publisher partnerships and blue-chip finance ad clients. Taboola is expanding its empire. The adtech company exclusively told CMO Insider it has made an offer to acquire Dianomi, a fellow adtech firm specializing in the finance space. Similar to Taboola, Dianomi offers an ad network that places sponsored-content widgets across publisher websites. The acquisition, announced Friday, would help Taboola gain relationships with major publishers such as CNN Business, The Wall Street Journal, and Reuters — partners it doesn't currently work with. Advertisers that work with Dianomi include big names like Bank of America, Charles Schwab, and Invesco. Taboola has agreed to acquire Dianomi for £19 million, or approximately $25.4 million, in cash, according to a financial filing. The deal is potentially worth up to £27 million, or $36.1 million, if certain performance conditions are met. The upfront acquisition valuation represents about a 68% premium to Dianomi's share price at the close of trading on Thursday. The timing of the acquisition appears shrewd on Taboola's part. Last year was challenging for Dianomi. The UK-based company's revenue fell 2% year-over-year to £27.4 million, about $36.6 million, predominantly reflecting lower publisher traffic volumes, while currency movements also weighed on its reported results. Dianomi has said publishers are facing traffic pressure as audiences increasingly consume content through AI-generated summaries and \"zero-click\" search results rather than visiting websites. Things picked up this year as Dianomi expanded its partnerships with CNN News and the Associated Press and introduced a new interactive ad format designed to boost engagement and click-through rates. Taboola CEO Adam Singolda told CMO Insider that while publishers are challenged by AI-related traffic declines, the technology is also opening new advertising opportunities , such as conversational ad units on publisher websites that function like OpenAI's ChatGPT or Google's Gemini. Conversational widgets can keep people on pages longer, asking detailed questions, potentially making those users \"five times\" more valuable than traditional web visitors, Singolda said. Taboola has been investing in AI-powered adtech, including its Realize ad p", "date_str": "2026-09-18T06:49:17+00:00", "hash": "a1f71926ed75570c", "title_fa": "Taboola در حال خرید یک شرکت adtech رقیب برای به دست آوردن جایگاه بزرگتر با مشتریان مالی سودآور است.", "summary_fa": "تابولا آدام سینگولدا در حال خرید است. جان لامپارسکی/ گتی ایماژ تابولا به بخش بزرگتری از بازار ادتک چشم دوخته است. این شرکت پیشنهادی برای به دست آوردن شرکت همکار Adtech Dianomi ارائه کرده است. این قرارداد به آن ک
