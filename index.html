  <style>

      --text: #f1f5f9;

      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);

      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }

      from { transform: scale(0.95); opacity: 0; }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;

    .btn-close {
      background: transparent;
      border: none;

      cursor: pointer;
      line-height: 1;

      color: var(--text);

      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;

      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;

      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }

      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

: "IranWire", "title": "گادی آیزنکوت: اهداف نظامی اسراییل هنوز محقق نشده است", "link": "https://iranwire.com/fa/news-1/159951-%DA%AF%D8%A7%D8%AF%DB%8C-%D8%A2%DB%8C%D8%B2%D9%86%DA%A9%D9%88%D8%AA-%D8%A7%D9%87%D8%AF%D8%A7%D9%81-%D9%86%D8%B8%D8%A7%D9%85%DB%8C-%D8%A7%D8%B3%D8%B1%D8%A7%DB%8C%DB%8C%D9%84-%D9%87%D9%86%D9%88%D8%B2-%D9%85%D8%AD%D9%82%D9%82-%D9%86%D8%B4%D8%AF%D9%87-%D8%A7%D8%B3%D8%AA/", "summary": "گادی آیزنکوت، رهبر حزب یاشار و مامور تشکیل دولت جدید اسراییل، با اشاره به ادامه جنگ‌ها و محقق‌نشدن اهداف نظامی این کشور، گفت اسراییل در ...", "date_str": "2026-11-08T16:00:57+00:00", "hash": "c0c4309811a2ab5a", "title_fa": "گادی آیزنکوت: اهداف نظامی اسراییل هنوز محقق نشده است", "summary_fa": "گادی آیزنکوت، رهبر حزب یاشار و مامور تشکیل دولت جدید اسراییل، با اشاره به ادامه جنگ‌ها و محقق‌نشدن اهداف نظامی این کشور، گفت اسراییل در ... اسحاق هرتزوگ، رییس‌جمهوری اسراییل، روز یکشنبه رسما ماموریت تشکیل دولت جدید را به آیزنکوت واگذار کرد. این تصمیم پس از آن گرفته شد که ۶۷ نماینده کنست از آیزنکوت و ۴۶ نماینده از بنیامین نتانیاهو برای تشکیل دولت حمایت کردند. هرتزوگ گفت آیزنکوت از حمایت روشن و بی‌قیدوشرط اکثریت اعضای کنست برای تشکیل دولت برخوردار است؛ هرچند حزب لیکود همچنان بزرگ‌ترین حزب پارلمان محسوب می‌شود. او از آیزنکوت خواست دولتی تشکیل دهد که نماینده همه شهروندان اسراییل، فارغ از گرایش سیاسی و انتخاباتی آن‌ها باشد. آیزنکوت در سخنرانی خود پس از دریافت حکم تشکیل دولت، وضعیت کنونی اسراییل را اضطراری و سرنوشت‌ساز توصیف کرد و گفت ادامه جنگ‌ها، محقق‌نشدن اهداف نظامی و بحران دیپلماتیک ویرانگر، این کشور را با چالش‌های جدی روبه‌رو کرده است. او همچنین هشدار داد که حتی برخی از نزدیک‌ترین متحدان اسراییل نیز در حال بازنگری در روابط خود با این کشور هستند. او در بخش دیگری از سخنانش، وضعیت داخلی اسراییل را یکی از آسیب‌پذیرترین مقاطع تاریخ دموکراسی این کشور خواند و نسبت به تلاش‌ها برای تضعیف مشروعیت دموکراسی و افزایش بی‌اعتمادی به نهادهای دولتی هشدار داد. رهبر حزب یاشار اعلام کرد با استفاده از ماموریتی که به او سپرده شده، برای تشکیل یک دولت اضطراری ملی اقدام خواهد کرد و این هدف به ابتکارهای سیاسی خلاقانه و خارج از چارچوب‌های معمول نیاز دارد. آیزنکوت همچنین از همه فراکسیون‌های پارلمانی، از جمله نمایندگان احزاب حامی نتانیاهو، دعوت کرد در صورت پذیرش اصول چهارگانه پیشنهادی او، از دولت آینده حمایت کنند. او تاکید کرد اتحاد ملی نباید به ابزاری برای چانه‌زنی سیاسی تبدیل شود و همه احزاب باید برای تشکیل دولت آماده مصالحه باشند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B8%DB%B8%DB%B8%DB%B8%DB%B8_nKCr__v1024x512__box_0%2C147%2C2048%2C1223.jpeg", "category": "موسیقی و هنر", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۷ آبان • ۱۹:۳۰"}, {"source": "Euronews Persian", "title": "تصادف قطار در مصر؛ ۴ کشته و حدود ۹۰ زخمی در جنوب قاهره", "link": "https://parsi.euronews.com/2026/11/08/train-accident-in-egypt-4-dead-and-about-90-injured-south-of-cairo", "summary": "مقام‌های مصر می‌گویند روز یکشنبه در پی برخورد دو قطار در جنوب قاهره، پایتخت این کشور دستکم چهار نفر کشته و دست‌کم ۸۸ نفر دیگر مجروح شدند.", "date_str": "2026-11-08T16:49:34+00:00", "hash": "b994ddee6af3070e", "title_fa": "تصادف قطار در مصر؛ ۴ کشته و حدود ۹۰ زخمی در جنوب قاهره", "summary_fa": "مقام‌های مصر می‌گویند روز یکشنبه در پی برخورد دو قطار در جنوب قاهره، پایتخت این کشور دستکم چهار نفر کشته و دست‌کم ۸۸ نفر دیگر مجروح شدند.", "image_url": "https://images.euronews.com/articles/stories/09/98/46/87/1200x675_cmsv2_52ff1a40-6443-565e-803b-c7f98a0a526b-9984687.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۷ آبان • ۲۰:۱۹"}, {"source": "Euronews Persian", "title": "وزیر خارجه فرانسه: اروپایی‌ها پای میز مذاکره ابوظبی درباره اوکراین حاضر خواهند بود؛ ملانشون سخنگوی کرملین است", "link": "https://parsi.euronews.com/2026/11/08/french-foreign-minister-says-europeans-will-be-present-at-abu-dhabi-ukraine-negotiating", "summary": "ژان‌نوئل بارو، وزیر خارجه فرانسه اعلام کرد که کشورهای اروپایی، از جمله فرانسه در گفتگوهای میان روسیه و اوکراین که قرار است روز سه‌شنبه در ابوظبی با میانجی‌گری آمریکا آغاز شود، مشارکت خواهند داشت.", "date_str": "2026-11-0 ory": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "سرمایه‌گذاری"], "datetime_fa": "۱۷ آبان • ۲۱:۴۰"}, {"source": "Engadget", "title": "Building a smart home across different brands? Here's what you should know", "link": "https://www.engadget.com/2308878/smart-home-across-brands-guide/", "summary": "When building a smart home, knowing which devices will work together can be tricky. Luckily, there are a few ways to get them all talking to each other.", "date_str": "2026-11-08T18:00:00+00:00", "hash": "4ac2dd58be3abc03", "title_fa": "ساخت خانه هوشمند در برندهای مختلف؟ در اینجا چیزی است که باید بدانید", "summary_fa": "هنگام ساخت یک خانه هوشمند، دانستن اینکه کدام دستگاه ها با هم کار می کنند می تواند مشکل باشد. خوشبختانه، چند راه وجود دارد که همه آنها با یکدیگر صحبت کنند. صحبت کردن همه دستگاه های شما با یکدیگر لازم نیست سخت باشد. Nanoleaf Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover روی کاغذ، ساده‌ترین راه برای ساخت خانه هوشمند این است که یک برند واحد با طیف وسیعی از لوازم جانبی را انتخاب کنید و از آن استفاده کنید. با توجه به تعداد زیاد لوازم جانبی موجود، این راه‌اندازی و کنترل را بسیار ساده‌تر می‌کند، و به فلج احتمالی انتخاب اشاره نکنیم. و در واقع، سادگی تمام نکته فناوری خانه هوشمند است. با این حال، در عمل، یک رویکرد همه‌برند معمولاً غیرممکن است. اکثر شرکت ها در یک دسته محصول واحد یا حداکثر تعداد انگشت شماری از آنها تخصص دارند. شرکتی که یک لامپ هوشمند تولید می کند احتمالاً قرار نیست جاروبرقی روباتی نیز تولید کند. در هر صورت، چسبیدن به یک برند واحد به این معنی است که اگر یک محصول رقیب ویژگی‌ها یا قیمت بهتری ارائه دهد، شانسی ندارید. صنعت خانه‌های هوشمند مدت‌هاست که از این نگرانی‌ها آگاه بوده است، به همین دلیل است که اکنون پلتفرم‌های سخت‌افزاری و نرم‌افزاری بسیار متنوعی برای کارکردن سیستم‌های چند برند، از Amazon Alexa گرفته تا Zigbee، وجود دارد. در اینجا چیزی است که شما باید در هنگام راه اندازی خود در نظر بگیرید. Philips Hue ساده ترین راه حل برای این کار، انتخاب یکی از سه پلتفرم اصلی خانه هوشمند است: Amazon Alexa، Google Home و Apple Home (و در نتیج k and vanity — and bedrooms, which are double the size and also include a full bathroom. My packing list has evolved over the years. Some items have been with me since the beginning. Others come from lessons learned along the way. I ve been packing a comfy outfit separately from the rest of my clothes since my first overnight train ride. Joey Hadden/Business Insider You won't catch me dressed to impress on an overnight train . I prefer to spend long days on the rails in my coziest garments. But I don't want to fish through my luggage to find them once on board. I make it easier on myself by putting a pair of sweatpants, a pair of basketball shorts, a soft T-shirt, and undergarments in a small packing cube at the top of my suitcase. I ve never boarded an overnight Amtrak train without video games. Joey Hadden/Business Insider Entertainment is everything when you're stuck in place for dozens of hours. One thing that makes my cabin feel more like home is packing activities I often enjoy in my own living room. So I always pack my Nintendo Switch. The portable console is thin enough to slide easily into a tight crevice in my bag. It's loaded with all types of games to satisfy every mood, from \"Animal Crossing\" and various Pokémon titles to the \"BioShock\" series and \"Red Dead Redemption,\" to name a few. I always have a journal on me. Joey Hadden/Business Insider I've only traveled solo on overnight trains, so I spend a lot of time thinking. I rarely make time for journaling in my daily life, but on trains I indulge in the opportunity to write out my thoughts uninterrupted. And the ever-changing view out the window is a constant source of inspiration. My camera has been my sidekick since the beginning. Joey Hadden/Business Insider On overnight trains, I spend more time with my camera in hand t", "date_str": "2026-11-08T18:14:01+00:00", "hash": "bc62018de6acc5b8", "title_fa": "من 128 ساعت را در قطارهای خواب آمتراک گذرانده ام. در اینجا 6 مورد ضروری که من همیشه بسته بند my older kids. When my youngest started surpassing his rec league teammates, I decided to look into club sports. He's learning so much more than the game, making the expense and serious time commitment worth it. Growing up, I dabbled in gymnastics and ice skating but never joined a team or had formal training. When I had children, I wasn't opposed to any of the four of them playing sports if they wanted to, but it wasn't a priority. My oldest three showed a fleeting interest in athletics, but nothing ever stuck. We tried soccer for tots, tennis in early elementary school, a rec basketball team that anyone could walk on to, and Girls on the Run , a non-competitive program for young girls. However, none of my younger kids showed much interest in playing at a higher level in a club. I briefly looked into club sports, but lost all interest once I discovered they cost thousands of dollars and require an extensive time commitment from the entire family on weeknights and weekends. That's particularly true for travel teams, which involve more serious coaching and play than rec teams. I never regretted not signing my kids up for tryouts until my youngest son developed a passion for soccer and dove headlong into the sport. Now I see what my older kids were missing, and I regret not encouraging them to try club sports, too. Do you have a parenting regret? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. I reluctantly signed my son up for a club team My son started playing soccer during recess at school. Before long, he was taking a skills class and playing soccer after school, too. Then came a rec team. He had fun, but I didn't feel like the parent leading the team had enough coaching experience to help him improve. My son trained hard in our backyard and at school, and his skills soon surpassed his teammates. In fourth grade, he asked to try out for a club with an advanced travel team. He already had a passion for the sport and showed talent, but I still hesitated before saying yes. The cost and grueling schedule gave me pause, and I wasn't sure I wanted him to focus heavily on one activity while he was s", "date_str": "2026-11-08T14:51:01+00:00", "hash": "226d357911e5b324", "title_fa": "از ورزش های باشگاهی به دلیل هزینه و زمان صرف اجتناب کردم. حالا کاش زودتر شروع میکردم", "summary_fa": "نویسنده ورزش های باشگاهی را برای سه فرزند اول خود در اولویت قرار نداده است. اکنون چهارمین تیم او در یک تیم فوتبال پیشرفت می کند، و او گفت که پشیمان است که در گذشته آنها را جدی تر در نظر نگرفته است. با حسن نیت از جیمی دیویس اسمیت. هزینه زیاد و تعهدات زمانی باعث شد که از ورزش های باشگاهی و تیم های مسافرتی با بچه های بزرگتر خودداری کنم. وقتی کوچکترین من شروع به پیشی گرفتن از هم تیمی هایش در لیگ قهرمانان کرد، تصمیم گرفتم به ورزش باشگاهی بپردازم. او خیلی بیشتر از بازی یاد می‌گیرد و هزینه و تعهد زمانی جدی را ارزشش را دارد. وقتی بزرگ شدم، به ژیمناستیک و اسکیت روی یخ علاقه داشتم، اما هرگز به تیمی نپیوستم یا تمرین رسمی نداشتم. وقتی بچه دار شدم مخالف نبودم که هر چهار نفری اگر می خواستند ورزش کنند اما در اولویت نبود. سه بزرگ‌ترین من به ورزش دو و میدانی علاقه‌ای زودگذر نشان دادند، اما هیچ‌وقت چیزی گیر نکرد. ما فوتبال برای بچه های کوچک، تنیس در اوایل دبستان، یک تیم بسکتبال rec که هرکسی می توانست در آن راه برود، و Girls on the Run، یک برنامه غیر رقابتی برای دختران جوان را امتحان کردیم. با این حال، هیچ یک از بچه های کوچکتر من علاقه زیادی به بازی در سطح بالاتر در یک باشگاه نشان ندادند. من به طور خلاصه به ورزش های باشگاهی نگاه کردم، اما زمانی که متوجه شدم آنها هزاران دلار هزینه دارند و در شب ها و آخر هفته ها به تعهد زمانی گسترده از طرف کل خانواده نیاز دارند، علاقه خود را از دست دادم. این امر به ویژه در مورد تیم های مسافرتی که شامل مربیگری و بازی جدی تری نسبت به تیم های rec هستند صادق است. هرگز پشیمان نشدم که بچه‌هایم را برای", "image_url": "https://i.insider.com/6aeb726d308912814ed70e0a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۷ آبان • ۱۸:۲۱"}, {"source": "Business Insider", "title": "I went from owning a home in a small town to renting in a big city. Life costs more, but it feels richer.", "link": "https://www.businessinsider.com/owned-home-small-town-now-renting-big-city-washington-dc-2026-11", "summary": "Years ago, I never would have imagined myself living in a city or happily raising a child here. Renate Flanagan I went from owning a house in a small town in Virginia to renting an apartment in Washington, DC . Living in an apartment and in a big city has been better than I expected, with some nice perks. I love having easy access to nature, a diverse mix of restaurants, and public transportation in DC. I grew up in a fairly small, somewhat rural community in central Virginia, about two hours from Washington, DC. And, in my early 20s, I got married and bought a house there. But when I got divorced at 30, I wanted to start over somewhere new. Stars seemed to align when I got a new position at my company that required me to relocate to Washington, DC . I was happy to do it and officially moved to DC in 2021. Although my hometown wasn't that far from the nation's capital, the two places felt like night and day — and a lot of my worries about living in a big city turned out to be unfounded. City living comes with perks I didn't expect My husband and I have enjoyed taking our son around DC. Renate Flanagan I love the outdoors, and was lucky to grow up living close to Shenandoah National Park . I worried that moving to a big city meant giving up access to green spaces, but I was wrong. This has not been the case in DC, which has miles of bike and pedestrian trails. Beyond that, the city is so walkable and well-connected by public transportation that some of the parks and monuments are just a few blocks' walk or a short bus ride from my home. There are lots of free museums in the area, too. I got rid of my car when I moved to the city, and I don't miss it at all. There are also lots of parks, monuments, and free museums within walking distance of my home. Renate Flanagan On top of that, I love DC's cosmopolitan energy. With all the different embassies and global organizations in the city, there's a large international community. The diversity of cultures brings a variety of restaurants with cuisines from around the world that I would never have been able to find in my small town. Living in such a major city also provides a lot of economic opportunities that can be harder to find in smaller towns. For example, many large employers have offices in the Washington, DC, area and offer higher-salary jobs that help offset the higher cost of living. Living in an apartment has been surprisingly enjoyable, too Downsizing hasn t bothered me as much as I expected. Renate Fla", "date_str": "2026-11-08T14:23:01+00:00", "hash": "6322e0fd98ca5a98", "title_fa": "من از داشتن خانه در یک شهر کوچک به اجاره در یک شهر بزرگ تبدیل شدم. زندگی هزینه بیشتری دارد، اما احساس ثروتمندتر می کند.", "summary_fa": "سال‌ها پیش، هرگز تصور نمی‌کردم که در یک شهر زندگی کنم یا با خوشحالی بچه‌ای را اینجا بزرگ کنم. Renate Flanagan من از داشتن یک خانه در یک شهر کوچک در ویرجینیا به اجاره یک آپارتمان در واشنگتن دی سی رفتم. زندگی در یک آپارتمان و در یک شهر بزرگ بهتر از آن چیزی است که من انتظار داشتم، با برخی امتیازات خوب. من عاشق دسترسی آسان به طبیعت، ترکیبی متنوع از رستوران ها و حمل و نقل عمومی در دی سی هستم. من در یک جامعه نسبتاً کوچک و تا حدودی روستایی در مرکز ویرجینیا، حدود دو ساعت از واشنگتن دی سی بزرگ شدم. و در اوایل 20 سالگی ازدواج کردم و خانه ای در آنجا خریدم. اما وقتی در 30 سالگی طلاق گرفتم، می خواستم از جایی جدید شروع کنم. به نظر می‌رسید که ستاره‌ها وقتی موقعیت جدیدی در شرکتم به دست آوردم که مجبور شدم به واشنگتن دی سی نقل مکان کنم. من از انجام آن خوشحال بودم و در سال 2021 رسما به دی سی نقل مکان کردم. اگرچه زادگاه من چندان دور از پایتخت کشور نبود، اما این دو مکان مانند شب و روز بود - و بسیاری از نگرانی های من در مورد زندگی در یک شهر بزرگ بی اساس بود. زندگی در شهر با مزایایی همراه است که انتظارش را نداشتم، من و شوهرم ا us of this program is using them to defend things, to find those counterexamples and find those improvements we can make to these designs.\" \"The program is taking these two technologies that have really advanced in the last few years and applying them to these electronic markets,\" Wilding said, \"so that they are more resilient and more dependable going forward.\" The concern is less that adversaries could hack these systems or steal data, both longstanding threats, than that they could exploit weaknesses in the design of the markets themselves. The agency pointed to two historical examples of disruption. In the early 2000s, traders exploited weaknesses in California's newly deregulated energy market, contributing to a crisis that DARPA said cost $40 billion to $45 billion. That chaotic incident forced the federal government to invoke the Defense Production Act to ensure the supply of natural gas to military facilities, which DARPA said highlighted how the manipulation of market mechanisms could have serious consequences for military readiness. Disruptions have previousl", "date_str": "2026-11-08T14:00:01+00:00", "hash": "3cb33b538debbbfc", "title_fa": "دارپا از هوش مصنوعی می‌خواهد که نقص‌های پنهان در بازارهای دیجیتال را پیدا کند که دشمنان می‌توانند از آنها برای ایجاد ویرانی اقتصادی سوء استفاده کنند.", "summary_fa": "آژانس های دفاعی و امنیتی ایالات متحده و همچنین تنظیم کننده های فدرال باید با هک ها و سرقت داده ها مبارزه کنند. چالش دیگر، بازیگران بدی هستند که از شکاف‌های موجود در قوانین حاکم بر سیستم‌های کلیدی مانند بازارهای الکترونیکی استفاده می‌کنند. دارپا امیدوار است که آنها را ببندد. ANGELA WEISS / AFP از طریق Getty Images دارپا به دنبال ابزارهای هوش مصنوعی است که بتواند نقاط ضعف پنهان در بازارهای دیجیتال را کشف کند. مقامات هشدار می دهند که دشمنان می توانند از نقص قوانین بازار برای ایجاد اختلال در اقتصاد استفاده کنند. هوش مصنوعی و سایر فناوری‌ها می‌توانند بهره‌برداری از بازارها را آسان‌تر کنند، اما همچنین به مدافعان کمک می‌کنند تا آسیب‌پذیری‌ها را پیدا کنند. بازوی تحقیقاتی پنتاگون به دنبال ابزارهای هوش مصنوعی جدیدی است که می تواند نقص های پنهان قوانین حاکم بر بازارهای مالی و سایر بازارهای دیجیتال ایالات متحده را کشف کند و قبل از اینکه دشمنان بتوانند از آنها برای ایجاد هرج و مرج اقتصادی سوء استفاده کنند، آنها را برطرف کنند. برنامه جدید انعطاف پذیری بازار ذاتی آژانس پروژه های تحقیقاتی پیشرفته دفاعی با هدف حفاظت از بازارهای الکترونیکی مرتبط با همه چیز از سهام و اوراق قرضه گرفته تا انرژی و منابع رایانش ابری است. دارپا می‌گوید، این سیستم‌های حیاتی سریع‌تر و کارآمدتر شده‌اند، اما ماهیت به‌هم پیوسته‌ی فزاینده‌ی آن‌ها نیز راه‌های جدیدی برای اختلال ایجاد کرده است. متیو وایلدینگ، مدیر برنامه IMR در دارپا به Business Insider گفت: «من فکر می‌کنم پیشرفت‌های باورنکردنی در استدلال خودکار و هوش مصنوعی راه‌های جدیدی را برای دفاع از چیزها باز می‌کند. می توان از آنها برای حمله به چیزها نیز استفاده کرد، اما تمرکز این برنامه استفاده از آنها برای دفاع از چیزها، یافتن نمونه های متقابل و یافتن پیشرفت هایی است که می توانیم در این طرح ها انجام دهیم.\" وایلدینگ گفت:", "image_url": "https://i.insider.com/6aee1d2feaa5e46dca227b58?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "بورس و طلا"], "datetime_fa": "۱۷ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I took my kids on vacation to practice their Spanish. Our no-English rule didn't last long.", "link": "https://www.businessinsider.com/family-vacation-tested-spanish-speaking-bilingual-skills-2026-11", "summary": "The author wanted her family to speak only Spanish while on vacation in Puerto Rico. Courtesy of Sandra Lee. My kids have been at a Spanish immersion school in the US since they were in preschool. On a trip to Puerto Rico, I only wanted us to speak Spanish, so they could practice their skills. The trip reminded me that language learning is ongoing and about adapting to new experiences. As my family of four began our descent to Puerto Rico , I made the announcement. There would be no more English for the duration of our trip. My kids, 9 and 11, who had been learning Spanish in immersion school since preschool, would get an opportunity to put it to good use. I thought this trip would be the perfect crash course for them before school started back up in the fall. When we landed in Puerto Rico and headed to our hotel, I realized I was going to have my work cut out. The driver spoke English, as did the workers at the front desk , restaurant waiters, and other staff. Turns out, they were just as bilingual as I was. Our no-English rule didn't last long At first, the kids were happy to skip the intense Spanish practice I had envisioned, but I still wanted us to try. Then, before I knew it, I was catching myself slipping into English, too. The author said her family didn t stick to her no-English rule for long while on their family trip to Puerto Rico. Courtesy of Sandra Lee. My husband doesn't speak Spanish, and with Duolingo as his only teacher , we often defaulted to English so he could follow the conversation. Before long, we were all speaking our own version of Spanglish, mixing languages to get our point across. My no-English rule was harder to enforce than I'd expected. Even I had a lot to learn I grew up speaking Spanish in the US, but it isn't my dominant language. Our kids being able to speak another language is important to my husband and me, so we decided to enroll them in Spanish immersion schools, starting in preschool. The Spanish language varies across countries and regions, but hearing Puerto Rican Spanish reminded me of how different the language can be. Some familiar words sounded unfamiliar, and I kept having to ask locals to describe the word they were using so I could connect it to the one I knew from Mexico, where my mother is from. The cadence and speed of conversations were different too, which made me listen more closely to what was being said. Instead of being the one helping my family navigate the language, I was the one asking questions", "date_str": "2026-11-08T13:53:01+0 il It Sleeps.” Dion is also no stranger to Las Vegas residencies. The Grammy-winning singer headlined two celebrated runs at the Colosseum at Caesars Palace from 2011 to 2019. The two residencies grossed a combined $681.3 million , according to Billboard Boxscore. Her recent Metallica appearances come during a milestone year for the singer. On Sept. 12, Dion returned to the stage for her first full-length concert in more than six years, opening a 26-show residency in Paris. The performances marked a significant step in her return to live music after she revealed in December 2022 that she had been diagnosed with stiff-person syndrome, a rare neurological disorder that causes muscle stiffness and spasms and forced her to step away from touring. Metallica lau", "date_str": "2026-11-08T18:58:39+00:00", "hash": "6284bd6239d43862", "title_fa": "سلین دیون عکس‌های بک استیج متالیکا را پس از بازی در Sphere به اشتراک گذاشت: «عاشق نمایش»", "summary_fa": "سلین دیون در نمایشگاه Metallica s Sphere در لاس وگاس، متالد درونی خود را در آغوش گرفت. این خواننده فوق ستاره پس از پخش شدن به خاطر نواختن ایرباس در حین اجرای گروه در 5 نوامبر در Sphere در لاس وگاس، برای نمایش اقامتی متالیکا زندگی می سوزد سریعتر در روز شنبه (7 نوامبر) بازگشت، جایی که او در حال لذت بردن از کنسرت در کنار جک بلک قبل از ملاقات با اسطوره های هوی متال در پشت صحنه دیده شد. در ویدئویی که توسط TMZ از برنامه شنبه به دست آمده است، دیون در حالی که متالیکا آهنگ نمادین خود را در سال 1991 \"Enter Sandman\" را اجرا می کند، در حالی که مهارت های گیتار هوایی خود را نیز به نمایش می گذارد، دیون دست های خود را به هوا پرتاب کرد و سرش را کوبید. بلک در کنار دیون ایستاده بود و در حین تکنوازی گیتار بالای سرش کف می زد و با اشتیاق در برنامه شرکت می کرد. پس از کنسرت، دیون به پشت صحنه رفت تا با جیمز هتفیلد، لارس اولریش، کرک همت و رابرت تروجیلو، اعضای متالیکا را ملاقات کند. او مجموعه‌ای از عکس‌های پشت صحنه این برخورد را در اینستاگرام به اشتراک گذاشت، از جمله لحظاتی با پسرانش ادی و نلسون آنجلیل، که آنها را با همسر فقیدش، رنه آنجلیل به اشتراک می ر منظم در نقش دختر مهمانی خنده دار Hailee، مهمانان فصل 2 شامل Tom Francis در نقش Declan و Aishopi An Biophnae در نقش Declan هستند. چلس. کانی بریتون، کایل مک‌لاکلان، لوکاس گیج، ریش شاه، آندریا مارتین، جولیا شیپلت، نل ورلاک، دانیل پرز، یاسمین ساهید، بومان مارتینز-رید، توماسو سانلی و آستین لیندزی نیز در فصل اول نقش‌های تکراری آن‌ها را بازی می‌کنند. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/TCDOVER_ZU013.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۷ آبان • ۲۱:۴۹"}, {"source": "Variety", "title": "Andy Serkis Says He Was ‘Evangelical’ About Performance Capture After Playing Gollum in ‘Lord of the Rings’ but Now Accepts It’s ‘Misunderstood’: ‘If You Get It? Great’", "link": "https://variety.com/2026/film/news/andy-serkis-motion-capture-gollum-1236942445/", "summary": "Andy Serkis, who played an instrumental role in bringing the on-screen version of Gollum (also known as Sméagol) to life in “The Lord of the Rings” franchise, is reflecting on the technology that helped him do so. Gollum, a central character in the films, is the result of both Serkis performance and computer-generated elements through [ ]", "date_str": "2026-11-08T18:58:21+00:00", "hash": "56a2975360c0624c", "title_fa": "اندی سرکیس می‌گوید پس از بازی در نقش گولوم در «ارباب حلقه‌ها» درباره پرفورمنس کپچر «انجیلی» بود، اما اکنون می‌پذیرد که «سوءتفاهم شده است»: «اگر آن را دریافت کنی؟ عالی", "summary_fa": "اندی سرکیس، که نقش مهمی در زنده کردن نسخه روی صفحه گولوم (همچنین با نام اسماگول) در فرنچایز «ارباب حلقه‌ها» ایفا کرد، در حال انعکاس فناوری است که به او کمک کرده است. گولوم، یکی از شخصیت‌های اصلی فیلم‌ها، نتیجه عملکرد سرکیس و عناصر تولید شده توسط کامپیوتر از طریق [] اندی سرکیس است که نقش مهمی در زنده کردن نسخه روی پرده گولوم (همچنین با نام اسماگل) در فرنچایز «ارباب حلقه‌ها» ایفا کرد، در حال انعکاس فناوری است که به او در انجام این کار کمک کرد. \"چون این فناوری خیلی اشتباه فهمیده شده است. من قبلا انجیلی بودم. من ساعت ها در مورد نحوه بازیگری فیلمبرداری از پرفورمنس صحبت کرده ام و تماشای چشمانی که خیره می شوند، اما زندگی خیلی کوتاه است. آرام شدم. حالا من فقط فکر می کنم، \"اگر آن را دریافت کنید؟ عالی،» او گفت. نمایش‌هایی مانند گولوم توسط بازیگری نوشته می‌شود، همان‌طور که یک تیم پروتز جان هرت را در «مرد فیل‌مرد» مهندسی کرد. اما بنا به دلایلی، اجرای زیر یک ماسک فیزیکی برای برخی قابل درک‌تر از این است که یک ماسک دیجیتال است.» در ماه مه، پیتر جکسون، فیلمساز «ارباب حلقه‌ها» به گفت‌وگوی موشن کپچر اشاره کرد و گفت که بحث‌های فزاینده درباره هوش مصنوعی در فیلم یکی از دلایلی است که سرکیس برای بازی در نقش گولوم جوایزی را کسب نکرده - و احتمالاً هرگز نخواهد گرفت. او در آن زمان گفت: «بسیاری از محیط کنونی، همه نگران هوش مصنوعی هستند... من فکر نمی‌کنم یک شخصیت از نوع گولوم یا یک شخصیت ساخته شده امیدی به برنده شدن جوایزی داشته باشد.» \"که کمی ناعادلانه است، به خصوص در مورد اندی سرکیس که در آن یک عملکرد تولید شده توسط هوش مصنوعی نیست. این یک عملکرد تولید شده توسط انسان 100٪ است.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/GettyImages-1247589803.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما"], "datetime_fa": "۱۷ آبان • ۲۲:۲۸"}, {"source": "Variety", "title": "Sanfic Prizes: ‘Monguen’ and ‘Narciso” Win at Pared-Back Ceremony Due to Sudden Demise of ‘A Fantastic Woman’ Director Sebastian Lelio", "link": "https://variety.com/2026/film/global/sanfic-prizes-monguen-narciso-sebastian-lelio-remembered-1236942162/", "summary": "The unexpected demise Nov. 6 of Chile’s Oscar-winning Sebastián Lelio (“A Fantastic Woman”) cast a pall over the closing ceremonies of both the festival and industry section of the Santiago Film Festival (Sanfic), which wraps Nov. 8. The red carpet portions of the industry and festival ceremonies held Nov. 6 and 7, respectively, were cancelled. [ ]", "date_str": "2026-11-08T18:27:06+00:00", "hash": "8db14588321999dd", "title_fa": "جوایز سانفیک: «Monguen» و «Narciso» به دلیل درگذشت ناگهانی کارگردان «یک زن شگفت‌انگیز»، سباستین للیو، در مراسم رقص برنده شدند.", "summary_fa": "درگذشت غیرمنتظره 6 نوامبر برنده اسکار شیلیایی سباستین للیو («یک زن شگفت‌انگیز») مراسم اختتامیه جشنواره و بخش صنعتی جشنواره فیلم سانتیاگو (سانفیک) را که در 8 نوامبر به پایان می‌رسد، تحت تأثیر قرار داد. [ ] خانواده للیو اعلام کردند که Cineteca Nacional (کتابخانه ملی فیلم) برای همه کسانی که مایل به ادای احترام در این آخر هفته هستند باز خواهد بود. زندگی واقعی برخی از تماشاگران جشنواره را به یاد آخرین فیلم للیو، موزیکال «موج» («لا اولا») انداخت، که به اعتراضات خشونت‌آمیز دانشجویان شیلی در سال 2018 می‌پردازد، زمانی که گاز اشک‌آور با برخی از شرکت‌کنندگان پانل در حالی که از دانشگاه خارج می‌شدند برخورد کرد. دانشجویان به اقدام اخیر دولت جناح راست پرزیدنت کاست، که کاهش بودجه در کل سیستم شامل آموزش و پرورش می شود، اعتراض داشتند. آنها همچنین خواستار استعفای فرناندو رباط وزیر دادگستری به دلیل کاهش مجازات وی برای مجرمان جنسی کودکان و ناقضان حقوق بشر شدند. در میان 9 عکس شیلیایی حاضر در رقابت، جایزه بهترین فیلم به مستند \"مونگوئن\" ساخته مرحوم آنتونیو کارو تعلق گرفت که او نیز در حین کار بر روی فیلمش به طور ناگهانی درگذشت که باعث شد تهیه کننده او مسئولیت را بر عهده بگیرد. للیو در حال فیلمبرداری اقتباسی از رمان «شاعر شیلیایی» الخاندرو زامبرا برای Fabula بود و همچنین در مرحله پیش تولید فیلم «Voyagers» با حضور اندرو گارفیلد و دیزی ادگار جونز بود. \"فکر می‌کنم این یک قدردانی شایسته برای \"Monguen\" است، فیلمی که داستان‌ها را از حاشیه بررسی می‌کند. این فیلم به موضوعی می‌پردازد که در سینمای شیلی به ندرت به آن پرداخته می‌شود: فرهنگ ماپوچه، فرهنگ جنوب و شخصیت‌هایی که اغلب در صفحه نمایش نمایش داده نمی‌شوند. در این فیلم، آنتونیو کارو آن دنیاها را زنده می‌کند و به ما اجازه می‌دهد تا به مردم جنوب، فرهنگ عمیق‌تری را به دست آوریم.\" تنوع.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Monguen_Still-3-Mariella-Chavez.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۷ آبان • ۲۱:۵۷"}, {"source": "Variety", "title": "Judi Dench Says Vin Diesel Sent Her Flowers ‘the Length of a Kayak’ to Persuade Her to Join ‘The Chronicles of Riddick’: I’m ‘Far Too Easily Wooed’", "link": "https://variety.com/2026/film/news/judi-dench-reveals-she-was-wooed-1236942417/", "summary": "Judi Dench can’t say no to a big bouquet of flowers, especially if they’re kayak-sized and come from Vin Diesel. “He came to see me at the Haymarket Theatre to ask if I’d be in ‘The Chronicles of Riddick,’” Dench wrote in her new memoir, “Is It Too Late to Make a Run for It?” [ ]", "date_str": "2026-11-08T18:08:07+00:00", "hash": "99525193377b01b6", "title_fa": "جودی دنچ می‌گوید وین دیزل گل‌هایش را «طول یک کایاک» فرستاد تا او را متقاعد کند که به «تواریخ‌های ریدیک» بپیوندد: من «خیلی راحت دلخورم»", "summary_fa": "جودی دنچ نمی تواند به یک دسته گل بزرگ نه بگوید، به خصوص اگر اندازه کایاک باشد و از وین دیزل آمده باشد. دنچ در کتاب خاطرات جدید خود با عنوان «آیا برای دویدن خیلی دیر است؟» می‌نویسد: «او به تماشای من در تئاتر های مارکت آمد تا از من بپرسد که آیا در «سرگذشت ریدیک» حضور دارم یا خیر. [ ] جودی دنچ نمی تواند به یک دسته گل بزرگ نه بگوید، به خصوص اگر اندازه کایاک باشد و از وین دیزل آمده باشد. دنچ در کتاب خاطرات جدید خود با عنوان «آیا برای دویدن خیلی دیر است؟» می‌نویسد: «او به تماشای من در تئاتر های مارکت آمد تا از من بپرسد که آیا در «سرگذشت ریدیک» حضور دارم یا خیر. \"قبل از رسیدن او، او چنین دسته گل عظیمی را برای من فرستاد. آنها نتوانستند آنها را از پله ها به اتاق رختکن من ببرند، بنابراین مجبور شدند آنها را در درب صحنه بگذارند. آنها به راحتی به اندازه یک کایاک بودند. و به اندازه عرض.» داستان های مرتبط مطالعه مخاطبان تایوان فرصت های IP بین پلتفرمی را برجسته می کند زیرا هوش مصنوعی خطرات جدیدی را برای صنعت محتوا ایجاد می کند. او به شوخی گفت: «من مثل چیپس ارزان هستم. خیلی راحت وسوسه می شود.» دنچ که از این ژست متقاعد شد، در فیلم سال 2004 نقش ایرئون را بازی کرد، سفیر اصلی که ریدیک (دیزل) را در سفرهای پر فراز و نشیب خود ر  The Strokes’ fourth time as musical guests on SNL . The band made its debut on the NBC sketch comedy show in January 2002, followed by performances in 2006 and 2011. The Strokes are currently promoting Reality Awaits , which debuted at No. 13 on the all-genre Billboard 200 and No. 5 on the Top Rock Alternative Albums chart. The nine-track set was recorded in Costa Rica with legendary producer Rick Rubin, who previously worked with the act on its 2020 album, The New Abnormal . SNL is back Nov. 14 with fan favorite John Mulaney returning to host and Phoebe Bridgers taking the stage as musical guest. Watch The Strokes perform “Lonely in the Future” and “Going Shopping” on SNL below.", "date_str": "2026-11-08T17:20:03+00:00", "hash": "ad00bbdc2655e5d9", "title_fa": "بازدید غافلگیر کننده والتون گوگینز در حین اجرای SNL: تماشا کنید.", "summary_fa": "گروه Strokes با دو آهنگ جدید و حضور غافلگیرکننده والتون گوگینز، شنبه شب زنده را تکان داد. گروه راک شهر نیویورک در اپیزودی که در 7 نوامبر به میزبانی دروسکی برگزار شد، با اجرای \"Lonely in the Future\" و \"Going Shopping\" ظاهر شد که هر دو در هفتمین آلبوم استودیویی خود، Reality Awaits که در ژوئیه منتشر شد، حضور داشتند. Strokes بهتر است مراقب باشید: Druski برای کنسرت مهمان موزیکال خود در تبلیغات جدید SNL می آید طرح ساده با نسل جدیدی از طرفداران ملاقات می کند، 25 سال حضور ایان گیلان از Deep Purple اخبار دلگرم کننده پس از انجام عمل جراحی را به اشتراک می گذارد. پس زمینه ای از تصاویر روانگردان و نورپردازی استادانه. پس از اجرا، گروه موزیک ویدیوی رسمی این آهنگ را منتشر کرد که شامل گروهی از عروسک های دست ساز است که با همکاری گروه سازنده سریال طنز بریتانیایی Spitting Image ساخته شده اند. این گروه حضور مهمان موزیکال SNL خود را با \"Going Shopping\" که با حضور غافلگیرکننده بازیگر گوگینز همراه بود، به پایان رساند. ستاره Fallout با پوشیدن کت و شلوار مشکی و عینک آفتابی، به گروه ملحق شد و در موزیک ویدیو این آهنگ را بازی کرد. حضور شنبه چهارمین بار استروکس به عنوان مهمان موسیقی در SNL بود. گروه اولین حضور خود را در برنامه کمدی طرح NBC در ژانویه     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
