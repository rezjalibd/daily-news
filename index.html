    .news-link {

      font-weight: 600;

    .modal-overlay {

      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;

    .modal-overlay.active {
      display: flex;

    .modal-card {
      background: var(--modal-bg);

    .modal-header {
      padding: 16px 20px;

      justify-content: space-between;

    @media (max-width: 640px) {

      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

ری انجام می‌دهد که به گفته او، تهدیدی جدی و واقعی برای اسراییل محسوب می‌شوند. وزیر دفاع اسراییل با تاکید بر این‌که کشورش نمی‌تواند چنین تهدیدهایی را بپذیرد، گفت: «وظیفه ما این است که برای هر سناریویی آماده باشیم و برای حفاظت از شهروندان اسراییل، در صورت لزوم اقدام کنیم.» او با اشاره به ماموریت‌های پیش‌روی اسراییل، خواستار اتحاد داخلی شد و افزود دشمنان این کشور باید بدانند که اختلاف‌نظرهای داخلی مانع ایستادگی متحد اسراییلی‌ها در برابر تهدیدهای خارجی نخواهد شد. کاتس گفت: «این زمان، زمان اتحاد، مسوولیت‌پذیری و همبستگی متقابل است.» این اظهارات در شرایطی مطرح می‌شود که بنیامین نتانیاهو، نخست‌وزیر اسراییل، شنبه‌شب از احزاب موسوم به «بلوک تغییر» به رهبری گادی آیزنکوت، رییس حزب یاشار، خواست برای تشکیل یک دولت وحدت ملی با او همکاری کنند. نتانیاهو در عین حال تاکید کرده است که چنین دولتی باید شامل متحدان راست افراطی و احزاب یهودی افراطی ارتدوکس او نیز باشد. اسحاق هرتزوگ، رییس‌جمهوری اسراییل، اعلام کرده است که قرار است روز یکشنبه در مراسمی رسمی، ماموریت تشکیل دولت جدید را به آیزنکوت واگذار کند. یسرائیل کاتس از اعضای حزب لیکود به رهبری نتانیاهو است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B2_iZEJ__v1024x512__box_0%2C0%2C1200%2C631.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۷ آبان • ۱۸:۳۸"}, {"source": "IranWire", "title": "هفت شهروند عرب توسط نیروهای امنیتی در ماهشهر بازداشت شدند", "link": "https://iranwire.com/fa/news-1/159950-%D9%87%D9%81%D8%AA-%D8%B4%D9%87%D8%B1%D9%88%D9%86%D8%AF-%D8%B9%D8%B1%D8%A8-%D8%AA%D9%88%D8%B3%D8%B7-%D9%86%DB%8C%D8%B1%D9%88%D9%87%D8%A7%DB%8C-%D8%A7%D9%85%D9%86%DB%8C%D8%AA%DB%8C-%D8%AF%D8%B1-%D9%85%D8%A7%D9%87%D8%B4%D9%87%D8%B1-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B4%D8%AA-%D8%B4%D8%AF%D9%86%D8%AF/", "summary": "هفت شهروند عرب ساکن بندر ماهشهر به نام‌های عادل عثمانی، سلطان عثمانی، عزیز گرغولی، علی حیدری، مح ا داشته باشد و هم پس از مصرف به‌آسانی تجزیه شود. اکنون پژوهشی جدید نشان می‌دهد که گونه‌ای زنبور با نام کولتِس اینِکوالیسی ( Colletes inaequalis ) ممکن است سرنخی برای حل این مشکل در اختیار دانشمندان قرار دهند. این زنبورهای بومی آمریکای شمالی، لانه‌های خود را زیر زمین می‌سازند و دیواره آن‌ها را با لایه‌ای نازک، شفاف و انعطاف‌پذیر می‌پوشانند. این پوشش که از ترشحات غده‌ای به نام «دوفور» ساخته می‌شود، نوعی پلی‌استر طبیعی است و از نوزادان زنبورها محافظت می‌کند. نکته جالب اینکه زنبورها هر سال به محل لانه‌سازی خود بازمی‌گردند و گاهی بیش از ۱۰هزار لانه در یک منطقه ایجاد می‌کنند. با وجود تولید مداوم این ماده پلاستیک‌مانند، اثری از انباشت قابل‌توجه آن در خاک دیده نمی‌شود. پژوهشگران برای بررسی این ویژگی، پوشش لانه‌های تازه را با نمونه‌هایی مقایسه کردند که چهار، هفت و یازده ماه در خاک باقی مانده بودند. نتایج نشان داد که پلی‌استر طبیعی در ابتدا حدود ۷۳ درصد وزن پوشش لانه را تشکیل می‌داد، اما این مقدار پس از چهار ماه به ۴۰ درصد کاهش یافت. پس از هفت ماه، ترک‌هایی روی پوشش ظاهر شد و در ماه یازدهم، ماده به‌اندازه‌ای شکننده شده بود که به‌آسانی خرد می‌شد. این در حالی است که پوشش تازه لانه انعطاف‌پذیری بالایی دارد و حتی پس از تاشدن یا مچاله‌شدن می‌تواند شکل خود را حفظ کند و همین ویژگی آن را به الگویی جالب", "image_url": "https://api2.zoomit.ir/media/biodegradable-plastic-bee-production-6aeff211354e588119e4843d?w=1920&q=75", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۷ آبان • ۱۹:۱۰"}, {"source": "Zoomit", "title": "چرا به دیوارهای بتنی وسط بزرگراه «نیوجرسی» می‌گوییم؟ راز طراحی عجیب آن‌ها", "link": "https://www.zoomit.ir/zoomplus/470631-jersey-barrier-highway-design-history/", "summary": "دیوارهای بتنی نیوجرسی با زاویه‌ای مهندسی‌شده ساخته می‌شوند؛ اما کاربرد واقعی آن‌ها چیست؟", "date_str": "2026-11-08T15:30:00+00:00", "hash": "fac08b8bcc310179", "title_fa": "چرا به دیوارهای بتنی وسط بزرگراه «نیوجرسی» می‌گوییم؟ راز طراحی عجیب آن‌ها", "summary_fa": "دیوارهای بتنی نیوجرسی با زاویه‌ای مهندسی‌شده ساخته می‌شوند؛ اما کاربرد واقعی آن‌ها چیست؟ تبلیغات دیوارهای بتنی میان بزرگراه‌ها که در ایران به «نیوجرسی» معروف‌اند، نام خود را از ایالت نیوجرسی آمریکا گرفته‌اند. شکل خاص این موانع اتفاقی نیست؛ مهندسان آن‌ها را طوری طراحی کرده‌اند که هنگام برخورد خودرو، احتمال ورود به مسیر مخالف را کاهش دهند و در بعضی تصادف‌ها، خودرو را به مسیر خودش برگردانند. احتمالاً هنگام رانندگی در بزرگراه، بارها از کنار دیوارهای بتنی کوتاه و بلندی عبور کرده‌اید که دو مسیر رفت‌وبرگشت را از هم جدا می‌کنند. برخلاف ظاهر ساده‌ی این موانع، شکل بدنه‌ی آن‌ها حاصل چندین دهه بررسی تصادف‌ها و اصلاح طراحی است. کپی لینک نیوجرسی از کجا آمد؟ داستان این مانع بتنی به دهه‌ی ۱۹۵۰ میلادی برمی‌گردد. اداره‌ی راه ایالت نیوجرسی آمریکا در سال ۱۹۵۵ نخستین نمونه‌های این دیوار را با ارتفاع حدود ۴۶ سانتی‌متر نصب کرد تا از عبور خودروهای منحرف‌شده به مسیر مخالف جلوگیری کند. مهندسان به‌تدریج دریافتند که ارتفاع و شکل اولیه‌ی مانع برای بعضی تصادف‌ها مناسب نیست. به همین دلیل، طراحی آن را با بررسی حوادث واقعی تغییر دادند و در سال ۱۹۵۹ ارتفاع دیوار را به حدود ۸۱ سانتی‌متر رساندند. وزارت حمل‌ونقل ایالت نیوجرسی در اسناد تاریخی خود تأیید می‌کند که این مانع در سال ۱۹۵۹ با طراحی مهندسی‌شده برای جداکردن مسیرهای مخالف و کاهش تصادف‌های روبه‌رو به کار گرفته شد. نام «Jersey Barrier» نیز از همین ایالت گرفته شده است. کپی لینک راز شکل خاص دیوار نیوجرسی چیست؟ اگر از روبه‌رو به مقطع یک نیوجرسی استاندارد نگاه کنید، متوجه می‌شوید که دیواره‌ی آن کاملاً صاف نیست. پایین دیوار ابتدا بخشی عمودی به ارتفاع حدود ۷٫۶ سانتی‌متر دارد، سپس شیبی با زاویه‌ی ۵۵ درجه ایجاد می‌شود و در قسمت بالاتر، زاویه‌ی بدنه به حدود ۸۴ درجه نسبت به سطح زمین می‌رسد.", "image_url": "https://api2.zoomit.ir/media/new-jersey-highway-barrier-6aeec6cfb001528ef859db32?w=1920&q=75", "category": "سیاست و دیپلماسی", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۷ آبان • ۱۹:۰۰"}, {"source": "Zoomit", "title": "شیائومی رقیب آیفون ۱۸ را با شارژ ۱۰۰ وات عرضه می‌کند", "link": "https://www.zoomit.ir/mobile/470640-xiaomi-18-3c-certification-100w/", "summary": "گوشی پرچمدار معرفی‌نشده‌ی شیائومی با شماره مدل M261DB و پشتیبانی از شارژ سریع ۱۰۰ واتی موفق به د ring them more seriously in the past. Courtesy of Jamie Davis Smith. The high cost and time commitments led me to avoid club sports and travel teams with my older kids. When my youngest started surpassing his rec league teammates, I decided to look into club sports. He's learning so much more than the game, making the expense and serious time commitment worth it. Growing up, I dabbled in gymnastics and ice skating but never joined a team or had formal training. When I had children, I wasn't opposed to any of the four of them playing sports if they wanted to, but it wasn't a priority. My oldest three showed a fleeting interest in athletics, but nothing ever stuck. We tried soccer for tots, tennis in early elementary school, a rec basketball team that anyone could walk on to, and Girls on the Run , a non-competitive program for young girls. However, none of my younger kids showed much interest in playing at a higher level in a club. I briefly looked into club sports, but lost all interest once I discovered they cost thousands of dollars and require an extensive time commitment from the entire family on weeknights and weekends. That's particularly true for travel teams, which involve more serious coaching and play than rec teams. I never regretted not signing my kids up for tryouts until my youngest son developed a passion for soccer and dove headlong into the sport. Now I see what my older kids were missing, and I regret not encouraging them to try club sports, too. Do you have a parenting regret? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. I reluctantly signed my son up for a club team My son started playing soccer during recess at school. Before long, he was taking a skills class and playing soccer after school, too. Then came a rec team. He had fun, but I didn't feel like the parent leading the team had enough coaching experience to help him improve. My son trained hard in our backyard and at school, and his skills soon surpassed his teammates. In fourth grade, he asked to try out for a club with an advanced travel team. He already had a passion for the sport and showed talent, but I still hesitated before saying yes. The cost and grueling schedule gave me pause, and I wasn't sure I wanted him to focus heavily on one activity while he was s", "date_str": "2026-11-08T14:51:01+00:00", "hash": "226d357911e5b324", "title_fa": "از ورزش های باشگاهی به دلیل هزینه و زمان صرف اجتناب کردم. حالا کاش زودتر شروع میکردم", "summary_fa": "نویسنده ورزش های باشگاهی را برای سه فرزند اول خود در اولویت قرار نداده است. اکنون چهارمین تیم او در یک تیم فوتبال پیشرفت می کند، و او گفت که پشیمان است که در گذشته آنها را جدی تر در نظر نگرفته است. با حسن نیت از جیمی دیویس اسمیت. هزینه زیاد و تعهدات زمانی باعث شد که از ورزش های باشگاهی و تیم های مسافرتی با بچه های بزرگتر خودداری کنم. وقتی کوچکترین من شروع به پیشی گرفتن از هم تیمی هایش در لیگ قهرمانان کرد، تصمیم گرفتم به ورزش باشگاهی بپردازم. او خیلی بیشتر از بازی یاد می‌گیرد و هزینه و تعهد زمانی جدی را ارزشش را دارد. وقتی بزرگ شدم، به ژیمناستیک و اسکیت روی یخ علاقه داشتم، اما هرگز به تیمی نپیوستم یا تمرین رسمی نداشتم. وقتی بچه دار شدم مخالف نبودم که هر چهار نفری اگر می خواستند ورزش کنند اما در اولویت نبود. سه بزرگ‌ترین من به ورزش دو و میدانی علاقه‌ای زودگذر نشان دادند، اما هیچ‌وقت چیزی گیر نکرد. ما فوتبال برای بچه های کوچک، تنیس در اوایل دبستان، یک تیم بسکتبال rec که هرکسی می توانست در آن راه برود، و Girls on the Run، یک برنامه غیر رقابتی برای دختران جوان را امتحان کردیم. با این حال، هیچ یک از بچه های کوچکتر من علاقه زیادی به بازی در سطح بالاتر در یک باشگاه نشان ندادند. من به طور خلاصه به ورزش های باشگاهی نگاه کردم، اما زمانی که متوجه شدم آنها هزاران دلار هزینه دارند و در شب ها و آخر هفته ها به تعهد زمانی گسترده از طرف کل خانواده نیاز دارند، علاقه خود را از دست دادم. این امر به ویژه در مورد تیم های مسافرتی که شامل مربیگری و بازی جدی تری نسبت به تیم های rec هستند صادق است. هرگز پشیمان نشدم که بچه‌هایم را برای", "image_url": "https://i.insider.com/6aeb726d308912814ed70e0a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۷ آبان • ۱۸:۲۱"}, {"source": "Business Insider", "title": "I went from owning a home in a small town to renting in a big city. Life costs more, but it feels richer.", "link": "https://www.businessinsider.com/owned-home-small-town-now-renting-big-city-washington-dc-2026-11", "summary": "Years ago, I never would have imagined myself living in a city or happily raising a child here. Renate Flanagan I went from owning a house in a small town in Virginia to renting an apartment in Washington, DC . Living in an apartment and in a big city has been better than I expected, with some nice perks. I love having easy access to nature, a diverse mix of restaurants, and public transportation in DC. I grew up in a fairly small, somewhat rural community in central Virginia, about two hours from Washington, DC. And, in my early 20s, I got married and bought a house there. But when I got divorced at 30, I wanted to start over somewhere new. Stars seemed to align when I got a new position at my company that required me to relocate to Washington, DC . I was happy to do it and officially moved to DC in 2021. Although my hometown wasn't that far from the nation's capital, the two places felt like night and day — and a lot of my worries about living in a big city turned out to be unfounded. City living comes with perks I didn't expect My husband and I have enjoyed taking our son around DC. Renate Flanagan I love the outdoors, and was lucky to grow up living close to Shenandoah National Park . I worried that moving to a big city meant giving up access to green spaces, but I was wrong. This has not been the case in DC, which has miles of bike and pedestrian trails. Beyond that, the city is so walkable and well-connected by public transportation that some of the parks and monuments are just a few blocks' walk or a short bus ride from my home. There are lots of free museums in the area, too. I got rid of my car when I moved to the city, and I don't miss it at all. There are also lots of parks, monuments, and free museums within walking distance of my home. Renate Flanagan On top of that, I love DC's cosmopolitan energy. With all the different embassies and global organizations in the city, there's a large international community. The diversity of cultures brings a variety of restaurants with cuisines from around the world that I would never have been able to find in my small town. Living in such a major city also provides a lot of economic opportunities that can be harder to find in smaller towns. For example, many large employers have offices in the Washington, DC, area and offer higher-salary jobs that help offset the higher cost of living. Living in an apartment has been surprisingly enjoyable, too Downsizing hasn t bothered me as much as I expected. Renate Fla", "date_str": "2026-11-08T14:23:01+00:00", "hash": "6322e0fd98ca5a98", "title_fa": "من از داشتن خانه در یک شهر کوچک به اجاره در یک شهر بزرگ تبدیل شدم. زندگی هزینه بیشتری دارد، اما احساس ثروتمندتر می کند.", "summary_fa": "سال‌ها پیش، هرگز تصور نمی‌کردم که در یک شهر زندگی کنم یا با خوشحالی بچه‌ای را اینجا بزرگ کنم. Renate Flanagan من از داشتن یک خانه در یک شهر کوچک در ویرجینیا به اجاره یک آپارتمان در واشنگتن دی سی رفتم. زندگی در یک آپارتمان و در یک شهر بزرگ بهتر از آن چیزی است که من انتظار داشتم، با برخی امتیازات خوب. من عاشق دسترسی آسان به طبیعت، ترکیبی متنوع از رستوران ها و حمل و نقل عمومی در دی سی هستم. من در یک جامعه نسبتاً کوچک و تا حدودی روستایی در مرکز ویرجینیا، حدود دو ساعت از واشنگتن دی سی بزرگ شدم. و در اوایل 20 سالگی ازدواج کردم و خانه ای در آنجا خریدم. اما وقتی در 30 سالگی طلاق گرفتم، می خواستم از جایی جدید شروع کنم. به نظر می‌رسید که ستاره‌ها وقتی موقعیت جدیدی در شرکتم به دست آوردم که مجبور شدم به واشنگتن دی سی نقل مکان کنم. من از انجام آن خوشحال بودم و در سال 2021 رسما به دی سی نقل مکان کردم. اگرچه زادگاه من چندان دور از پایتخت کشور نبود، اما این دو مکان مان ays to defend things,\" Matthew Wilding, the IMR program manager at DARPA, told Business Insider. \"They can be used to attack things as well, but the focus of this program is using them to defend things, to find those counterexamples and find those improvements we can make to these designs.\" \"The program is taking these two technologies that have really advanced in the last few years and applying them to these electronic markets,\" Wilding said, \"so that they are more resilient and more dependable going forward.\" The concern is less that adversaries could hack these systems or steal data, both longstanding threats, than that they could exploit weaknesses in the design of the markets themselves. The agency pointed to two historical examples of disruption. In the early 2000s, traders exploited weaknesses in California's newly deregulated energy market, contributing to a crisis that DARPA said cost $40 billion to $45 billion. That chaotic incident forced the federal government to invoke the Defense Production Act to ensure the supply of natural gas to military facilities, which DARPA said highlighted how the manipulation of market mechanisms could have serious consequences for military readiness. Disruptions have previousl", "date_str": "2026-11-08T14:00:01+00:00", "hash": "3cb33b538debbbfc", "title_fa": "دارپا از هوش مصنوعی می‌خواهد که نقص‌های پنهان در بازارهای دیجیتال را پیدا کند که دشمنان می‌توانند از آنها برای ایجاد ویرانی اقتصادی سوء استفاده کنند.", "summary_fa": "آژانس های دفاعی و امنیتی ایالات متحده و همچنین تنظیم کننده های فدرال باید با هک ها و سرقت داده ها مبارزه کنند. چالش دیگر، بازیگران بدی هستند که از شکاف‌های موجود در قوانین حاکم بر سیستم‌های کلیدی مانند بازارهای الکترونیکی استفاده می‌کنند. دارپا امیدوار است که آنها را ببندد. ANGELA WEISS / AFP از طریق Getty Images دارپا به دنبال ابزارهای هوش مصنوعی است که بتواند نقاط ضعف پنهان در بازارهای دیجیتال را کشف کند. مقامات هشدار می دهند که دشمنان می توانند از نقص قوانین بازار برای ایجاد اختلال در اقتصاد استفاده کنند. هوش مصنوعی و سایر فناوری‌ها می‌توانند بهره‌برداری از بازارها را آسان‌تر کنند، اما همچنین به مدافعان کمک می‌کنند تا آسیب‌پذیری‌ها را پیدا کنند. بازوی تحقیقاتی پنتاگون به دنبال ابزارهای هوش مصنوعی جدیدی است که می تواند نقص های پنهان قوانین حاکم بر بازارهای مالی و سایر بازارهای دیجیتال ایالات متحده را کشف کند و قبل از اینکه دشمنان بتوانند از آنها برای ایجاد هرج و مرج اقتصادی سوء استفاده کنند، آنها را برطرف کنند. برنامه جدید انعطاف پذیری بازار ذاتی آژانس پروژه های تحقیقاتی پیشرفته دفاعی با هدف حفاظت از بازارهای الکترونیکی مرتبط با همه چیز از سهام و اوراق قرضه گرفته تا انرژی و منابع رایانش ابری است. دارپا می‌گوید، این سیستم‌های حیاتی سریع‌تر و کارآمدتر شده‌اند، اما ماهیت به‌هم پیوسته‌ی فزاینده‌ی آن‌ها نیز راه‌های جدیدی برای اختلال ایجاد کرده است. متیو وایلدینگ، مدیر برنامه IMR در دارپا به Business Insider گفت: «من فکر می‌کنم پیشرفت‌های باورنکردنی در استدلال خودکار و هوش مصنوعی راه‌های جدیدی را برای دفاع از چیزها باز می‌کند. می توان از آنها برای حمله به چیزها نیز استفاده کرد، اما تمرکز این برنامه استفاده از آنها برای دفاع از چیزها، یافتن نمونه های متقابل و یافتن پیشرفت هایی است که می توانیم در این طرح ها انجام دهیم.\" وایلدینگ گفت:", "image_url": "https://i.insider.com/6aee1d2feaa5e46dca227b58?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "بورس و طلا"], "datetime_fa": "۱۷ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I took my kids on vacation to practice their Spanish. Our no-English rule didn't last long.", "link": "https://www.businessinsider.com/family-vacation-tested-spanish-speaking-bilingual-skills-2026-11", "summary": "The author wanted her family to speak only Spanish while on vacation in Puerto Rico. Courtesy of Sandra Lee. My kids have been at a Spanish immersion school in the US since they were in preschool. On a trip to Puerto Rico, I only wanted us to speak Spanish, so they could practice their skills. The trip reminded me that language learning is ongoing and about adapting to new experiences. As my family of four began our descent to Puerto Rico , I made the announcement. There would be no more English for the duration of our trip. My kids, 9 and 11, who had been learning Spanish in immersion school since preschool, would get an opportunity to put it to good use. I thought this trip would be the perfect crash course for them before school started back up in the fall. When we landed in Puerto Rico and headed to our hotel, I realized I was going to have my work cut out. The driver spoke English, as did the workers at the front desk , restaurant waiters, and other staff. Turns out, they were just as bilingual as I was. Our no-English rule didn't last long At first, the kids were happy to skip the intense Spanish practice I had envisioned, but I still wanted us to try. Then, before I knew it, I was catching myself slipping into English, too. The author said her family didn t stick to her no-English rule for long while on their family trip to Puerto Rico. Courtesy of Sandra Lee. My husband doesn't speak Spanish, and with Duolingo as his only teacher , we often defaulted to English so he could follow the conversation. Before long, we were all speaking our own version of Spanglish, mixing languages to get our point across. My no-English rule was harder to enforce than I'd expected. Even I had a lot to learn I grew up speaking Spanish in the US, but it isn't my dominant language. Our kids being able to speak another language is important to my husband and me, so we decided to enroll them in Spanish immersion schools, starting in preschool. The Spanish language varies across countries and regions, but hearing Puerto Rican Spanish reminded me of how different the language can be. Some familiar words sounded unfamiliar, and I kept having to ask locals to describe the word they were using so I could connect it to the one I knew from Mexico, where my mother is from. The cadence and speed of conversations were different too, which made me listen more closely to     function toggleRead(hash) {

                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
