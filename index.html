98795d1c679f0365", "title_fa": "بهترین برس های گربه که ما برای هر نوع پوششی آزمایش کردیم", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید بهترین برس‌های گربه که ما آزمایش کردیم برای استفاده آسان و برای راحتی گربه طراحی شده‌اند. جانل لیسون/ گربه‌های بیزینس اینسایدر طبیعتاً نظافتچی‌های دقیقی هستند و نیمی از روز خود را صرف تمیز کردن خود می‌کنند. با این حال، گربه های مو کوتاه و بلند می توانند از نظافت منظم با یکی از بهترین برس ها یا شانه های گربه بهره مند شوند. دکتر ایمی سیمپسون، دامپزشک و مدیر پزشکی بیمارستان گربه VCA در فیلادلفیا، می گوید: نظافت معمول با برس یا شانه موهای شل را از بین می برد و روغن های طبیعی پوست را در سراسر کت گربه پخش می کند. برای یافتن بهترین ابزار نظافت گربه، 35 برس و شانه مختلف را با چهار گربه آزمایش کردیم. مورد علاقه ما فریسکو Mini Combo Brush است، یک برس همه کاره که برای استفاده روزانه روی کت های مو کوتاه و بلند به اندازه کافی ملایم است. یک طرف دارای پین‌های فلزی برای رفع گره‌های کوچک و بلند کردن خزهای شل است، در حالی که طرف دیگر دارای موهای نرم برای صاف کردن کت است، از جمله موهای ظریف‌تر اطراف صورت. درباره نحوه تحقیق و آزمایش محصولات حیوانات خانگی توسط Business Insider Reviews در اینجا بیشتر بخوانید. انتخاب های برتر ما برای بهترین براش های گربه بهترین کلی: Frisco Mini Combo Brush - 6 دلار در Chewy بهترین ابزار شستشو: Andis Deshedding Tool - 28 $ در Chewy بهترین برس نرم کننده: Safari Self-Cleaning Slicker Brush - 19 دلار در Chewy بهترین ابزار جداسازی: Wellid Good Prostyle Dual در 4 $ شانه: Chris Christensen Cat/Carding Buttercomb #013 - 64 دلار در آمازون بهترین دستکش های نظافت: دستکش های همه کاره حمام و نظافت HandsOn - 25 دلار در Chewy چگونه"}, {"source": "Business Insider", "title": "My kids were ready for college. They weren't quite ready for adulthood.", "link": "https://www.businessinsider.com/parenting-mistakes-life-skills-kids-college-2026-10", "summary": "The author with her 3 freshman year drop-offs over the years Courtesy of the author I spent years preparing my kids for college, but I overlooked some essential life skills. I never properly taught them to clean toilets, repay debts, or recognize health problems. Now I'm trying to fill those gaps and accept that parenting doesn't end when kids leave home. Last week, a friend asked if I knew of any jobs for her recent graduate . Between his rigorous academic load, sports, and club activities that landed him in a prestigious university, he'd never held a job. \"My fail,\" she confessed. My kids have had jobs, but I have parenting fails of my own. I'm concerned that, in the grand scheme of middle-class privileges, we forgot to teach our children some basic life skills: scrubbing bathrooms, repaying debts, and self-attunement. I crammed as much as I could into the first 18 years of their lives, but juggling my small business while parenting didn't leave time for everything. I found myself tossing last-minute advice like grapes while driving each to their respective dorms: Carry your drinks with you at all times — even to the bathroom. Know where Student Health is located. Sit in the front rows; meet your professors. Skip the jugs of BORG. We didn't teach them everything they need to survive, let alone thrive, but I'm hoping it's not too late to offer some guidance. Cleaning their toilet The bathroom might be the most inhospitable location in either of my sons' living quarters. The filth lurking below the interior rim is as confronting as the overspray of urine where the lid hinges. To protect them from chemical toxins , I reflect that I never handed my kids a cleaning wand. They'd wiped down sinks, vacuumed, and washed clothes, but the toilet was off limits. Instead, I'd taken the plastic brush into my own hand or, worse, hired a housekeeper. It should have transitioned at some age, but between my own squeamishness about cleanliness and their protests at reaching inside the bowl, I failed. I'm consoled that it appears statistically unlikely that anyone would catch a disease from their lack of sanitization, but in the interest of raising functional adults within accepted cultural parameters, I'm impressing upon them the virtues of hygiene and housekeeping as attractive to a future partner , while clamoring to provide motivation. My kids had no fiscal responsibility To teach financial awareness , my husband and I set up checking accounts and outlined budgets with ", "date_str": "2026-10-17T21:13:01+00:00", "hash": "e22db0a9fac51628", "title_fa": "بچه های من برای دانشگاه آماده بودند. آنها کاملاً برای بزرگسالی آماده نبودند.", "summary_fa": "نویسنده با 3 سال ترک تحصیل در سال اول در طول سال ها با حسن نیت نویسنده من سال ها وقت گذاشتم بچه هایم را برای دانشگاه آماده کنم، اما برخی از مهارت های ضروری زندگی را نادیده گرفتم. من هرگز به آنها به درستی یاد ندادم که توالت ها را تمیز کنند، بدهی ها را بازپرداخت کنند یا مشکلات سلامتی را تشخیص دهند. اکنون سعی می کنم این شکاف ها را پر کنم و بپذیرم که فرزندپروری با خروج بچه ها از خانه به پایان نمی رسد. هفته گذشته، یکی از دوستان پرسید که آیا شغلی برای فارغ التحصیل اخیر او می شناسم یا خیر. بین بار تحصیلی سخت، ورزش و فعالیت های باشگاهی که او را به دانشگاهی معتبر رساند، او هرگز شغلی نداشت. او اعتراف کرد: \"شکست من.\" بچه‌های من شغل داشته‌اند، اما من به‌نحو خودم در تربیت ناموفق هستم. من نگران این هستم که در طرح بزرگ امتیازات طبقه متوسط، ما فراموش کرده‌ایم برخی از مهارت‌های اساسی زندگی را به فرزندانمان بیاموزیم: حمام کردن، بازپرداخت بدهی‌ها، و خودآگاهی. من تا آنجا که می توانستم در 18 سال اول زندگی آنها انباشته شدم، اما شعبده بازی در کسب و کار کوچکم در حین فرزندپروری وقت برای همه چیز باقی نگذاشت. من متوجه شدم که هنگام رانندگی هر کدام به سمت خوابگاه مربوطه، توصیه‌های لحظه آخری مانند انگور را پرت می‌کنم: همیشه نوشیدنی‌های خود را با خود حمل کنید - حتی به حمام. بدانید بهداشت دانش آموز در کجا قرار دارد. در ردیف های جلو بنشینید؛ با اساتید خود آشنا شوید از کوزه های BORG بگذرید. ما به آنها هر چیزی را که برای زنده ماندن نیاز دارند، یاد ندادیم، چه رسد به اینکه رشد کنند، اما امیدوارم برای ارائه برخی راهنمایی ها دیر نشده باشد. تمیز کردن توالت آنها ممکن است حمام نامناسب ترین مکان در محل"}, {"source": "Business Insider", "title": "My daughter and I drove 2,000 miles to college. It was the best goodbye I could've asked for.", "link": "https://www.businessinsider.com/mother-daughter-road-trip-college-drop-off-goodbye-2026-10", "summary": "The author and her daughter drove 2,000 miles to drop her off at college. Courtesy of the author My daughter and I took the scenic route from Oregon to her college in Missouri. We camped near Yellowstone, explored Wyoming, and visited South Dakota landmarks. The trip gave us precious time together before she started her independent life. After buying a car for my daughter to take to college, the problem was getting the little Mazda from Portland, Oregon, to Fulton, Missouri. Maria and I are fun in the car, but awful at driving long distances. We checked the miles, over 2,000, and groaned. \"Are we doing this?\" I asked. \"Remember Eugene?\" We laughed, thinking about the time after an exhausting day, we couldn't manage the usual three hours from Eugene, Oregon , to Portland without stopping every 10 to 15 minutes. We took turns saying, \"Your turn,\" as we blasted cold air and chomped Good 'n' Plenty licorice to stay awake. Eventually, we napped at a rest stop. I finished the drive and let Maria sleep. We took the scenic route to college \"Let's make it an adventure,\" Maria said when we were debating whether to take the scenic route. She knows I love sleeping in a tent and waking up outdoors. Being in nature would ease my aching heart, already missing her. I savored our time before we even started. We mapped our route, picking the long way. In Yellowstone, we tented next to a motorhome complete with a satellite and TV. We cracked up as we popped up our two-person tent in the RV's shadow. In the morning, it was a quick coffee and on to gawking our way through the park, pointing at bison, moose, elk, deer, wolves, and more. At a geyser view spot, a tourist tried to touch a bull moose with a huge rack of horns while onlookers poised their phones. We made so many memories together We drove across Wyoming with its wide-open spaces and the prettiest blue skies. Then camped at Custer State Park, our tent site flanking a river. In the morning, we plopped on a log and sipped cowboy (unfiltered) coffee. \"So much better than flying,\" I said, surprising myself. Our awe was mild at Mt. Rushmore , where we snapped bad tourist pictures, pretending to squish the presidents' heads between thumb and index finger as a curly-haired woman in white pointy Keds glared at us. The author and her daughter made of the trip an adventure. Courtesy of the author Then, onto Crazy Horse : a massive monument of Crazy Horse, the Lakota leader, still being carved out of the mountain. I cried at it", "date_str": "2026-10-17T20:17:01+00:00", "hash": "eba6587975e2b0ff", "title_fa": "من و دخترم 2000 مایل تا دانشگاه رانندگی کردیم. این بهترین خداحافظی بود که می توانستم بخواهم.", "summary_fa": "نویسنده و دخترش 2000 مایل رانندگی کردند تا او را در کالج رها کنند. با حسن نیت نویسنده من و دخترم از اورگان به کالجش در میسوری مسیر دیدنی را طی کردیم. ما در نزدیکی یلوستون کمپ زدیم، وایومینگ را کاوش کردیم و از نقاط دیدنی داکوتای جنوبی بازدید کردیم. این سفر قبل از اینکه او زندگی مستقل خود را آغاز کند، وقت گرانبهایی را برای ما در اختیار داشت. بعد از خریدن ماشینی برای دخترم که آن را به دانشگاه برد، مشکل این بود که مزدا کوچک را از پورتلند، اورگان، به فولتون، میسوری ببرم. من و ماریا در ماشین سرگرم کننده هستیم، اما در رانندگی در مسافت های طولانی افتضاح هستیم. مایل ها را بررسی کردیم، بیش از 2000، و ناله کردیم. \"آیا ما این کار را می کنیم؟\" من پرسیدم. \"یوجین را یادت هست؟\" ما خندیدیم، به زمان فکر کردن پس از یک روز طاقت فرسا، نمی‌توانستیم سه ساعت معمول از یوجین، اورگان، تا پورتلند را بدون توقف هر 10 تا 15 دقیقه مدیریت کنیم. ما به نوبت گفتیم: \"نوبت توست\" در حالی که هوای سرد را می زدیم و شیرین بیان Good 'n' Plenty را خرد می کردیم تا بیدار بمانیم. در نهایت در ایستگاه استراحت چرت زدیم. رانندگی را تمام کردم و به ماریا اجازه دادم بخوابد. ما از مسیر دیدنی به کالج رفتیم: «بیایید آن را به یک ماجراجویی تبدیل کنیم. او می داند که من عاشق خوابیدن در چادر و بیدار شدن در فضای باز هستم. بودن در طبیعت قلب دردمند من را که از قبل دلتنگ او شده بود، تسکین می داد. من حتی قبل از اینکه شروع کنیم از وقتمان لذت بردم. ما مسیر خود را ترسیم کردیم و مسیر طولانی را انتخاب کردیم. در یلوستون، کنار یک موتورخانه کامل با ماهواره و تلویزیون چادر زدیم. هنگامی که چادر دو نفره"}, {"source": "Business Insider", "title": "My 2 friends and I had babies within 3 weeks of each other after 25 years of friendship. Our group chat became a lifeline.", "link": "https://www.businessinsider.com/motherhood-brought-best-friends-closer-despite-long-distance-2026-10", "summary": "The author (center) has been friends with two women since their years together at boarding school. Motherhood, she said, has brought them closer. Courtesy of Shea Karssing. Our friendship formed over questionable decisions, break-ups, hangovers, and, eventually, the messy business of becoming adults. Then, three baby girls born in three cities over three weeks started a completely new chapter. Our connection became our parenting lifeline, proving that the best friendships grow with you. \"What a night!\" \"I barely slept.\" \"I don't even know what time I went to bed.\" The same statements can have very different meanings in different stages of life . My friends and I used to worry about where everyone was at 2 a.m. Now, we worry about whether everyone's baby has pooped that day. Laura-Kate (Lauks), Kirsten (Kirst), and I met 25 years ago at an all-girls boarding school in South Africa, then partied our way through university and early adulthood. For years, our biggest problems were nursing sore heads with painkillers and junk food, who was dating whom, where we were going that weekend, and whether anyone had taken a particularly unflattering photo. Then, the three of us had babies all within three weeks of one another, reaffirming our bond and allowing us to evolve together in new and exciting ways I never imagined. The author (center) said that life took her and her friends in different directions, but motherhood helped them bond in a new way. Courtesy of Shea Karssing. Real adulthood happened Lauks got pregnant unexpectedly, bravely navigating the challenges of being a semi-single mom with a husband who works abroad for up to three months at a time. In the same period, Kirst and her American husband settled in the US, and I was undergoing IVF treatment. We all had our own challenges. Fast forward a bit, and Lauks told us she was expecting another unplanned surprise . It was a contrast to my own fertility journey, which had been a roller coaster of disappointments, including a failed embryo transfer. I was about to undergo a second transfer when she gave us the news over group text. Lauks lives in a town about an hour from me. It happens to be on the way to my fertility doctor. On one drive home, soon after sharing her good news, I stopped to see Lauks to congratulate her. I was also six weeks pregnant at the time. I remember sitting there in the cafe trying to get the words out: \"I'm pregnant.\" Cue the ugly crying. Of course, my next phone call was to Kirst i", "date_str": "2026-10-17T18:17:01+00:00", "hash": "2dca49cf58ae53e4", "title_fa": "من و 2 دوستم بعد از 25 سال دوستی در فاصله 3 هفته از هم بچه دار شدیم. چت گروهی ما به یک راه نجات تبدیل شد.", "summary_fa": "نویسنده (مرکز) از سالهای زندگی مشترک در مدرسه شبانه روزی با دو زن دوست بوده است. او گفت که مادری آنها را به هم نزدیکتر کرده است. با حسن نیت از شی کارسینگ. دوستی ما بر سر تصمیمات مشکوک، جدایی، خماری، و در نهایت، تجارت کثیف بزرگسال شدن شکل گرفت. سپس، سه نوزاد دختر در سه شهر در طول سه هفته متولد شدند، فصل کاملاً جدیدی را آغاز کردند. ارتباط ما به ما تبدیل شد و ثابت کرد که بهترین دوستی ها با شما رشد می کند. \"چه شبی!\" \"من به سختی خوابیدم.\" حتی نمی دانم چه ساعتی به رختخواب رفتم. عبارات یکسان می توانند معانی بسیار متفاوتی در مراحل مختلف زندگی داشته باشند. من و دوستانم قبلاً نگران این بودیم که همه ساعت 2 صبح کجا هستند، حالا نگران این هستیم که آیا نوزاد آن روز مدفوع کرده است یا خیر. لورا-کیت (لوکس)، کرستن (کرست) و من 25 سال پیش در یک مدرسه شبانه روزی دخترانه در آفریقای جنوبی با هم آشنا شدیم، سپس در دانشگاه و اوایل بزرگسالی با هم آشنا شدیم. برای سال‌ها، بزرگ‌ترین مشکلات ما این بود که سر درد را با مسکن‌ها و غذای ناسالم پرستاری می‌کردیم، اینکه چه کسی با چه کسی قرار می‌گذاشت، آخر هفته کجا می‌رفتیم، و اینکه آیا کسی عکسی به‌خصوص نامطلوب گرفته بود یا خیر. سپس، ما هر سه در عرض سه هفته از یکدیگر صاحب فرزند شدیم، پیوندمان را دوباره تأیید کرد و به ما اجازه داد تا با هم به روش‌های جدید و هیجان‌انگیزی که هرگز تصور نمی‌کردم تکامل پیدا کنیم. نویسنده (مرکز) گفت که زندگی او و دوستانش را به جهات مختلفی برد، اما مادری به آنها کمک کرد تا به روشی جدید پیوند بخورند. با حسن نیت از شی کارسینگ. بزرگسالی واقعی اتفاق افتاد که لاوکز به طور غیرمنتظره باردار شد و شجاعانه از چالش‌های یک"}, {"source": "Business Insider", "title": "I lived in LA for 20 years. It took moving my 3 kids to a small Arizona town to find what I'd been missing.", "link": "https://www.businessinsider.com/left-los-angeles-arizona-kids-eighties-childhood-2026-10", "summary": "Jen Podany moved her family from California to Arizona. Courtesy of Jen Podany Jen Podany raised her three children in a busy Los Angeles neighborhood where traffic limited their independence. After moving to a small Arizona town, her kids can ride bikes and play with neighborhood friends. She says their new lifestyle reminds her of the freedom children had growing up in the 1980s. This as-told-to essay is based on a conversation with Jen Podany , founder of Bluestone Sunshields. It has been edited for length and clarity. Near the end of 2024, my family of five had once again escaped Los Angeles for the quiet we found 10 hours south in Snowflake, Arizona . We'd been doing it for years, renting an Airbnb in Snowflake, a town of 6,000 in the middle of nowhere, switching off amid the miles of empty land. It had started as a stopover on our way to visit my husband's family in New Mexico . We fell in love with the town, and from then on, we'd visit whenever we needed to get away from the busyness of LA. In Snowflake, we felt like we could catch our breath. Our souls calmed each time we arrived and ached to stay each time we left. We put an offer on a house Back in LA, specifically Burbank, the five of us — my husband and our three children , whom we homeschooled — lived in a duplex made up of two connected apartments. We lived in one of them, which had two bedrooms and one bathroom. From the other apartment, my husband and I ran our two separate businesses. Jen Podany put an offer on a house in a small town. Courtesy of Jen Podany The duplex was in a neighborhood near a busy street, and we had to be cautious about letting the kids go outside to play because of the cars. I was always holding someone's little hand when we were out, just in case. You could hear planes flying back and forth into Burbank Airport. As our kids and businesses grew, we felt increasingly confined. Then we saw a house on the market in Snowflake, and I felt in my bones that we should put in an offer. It was a four-bedroom house surrounded by land, chickens, cows, and a crazy turkey. We could buy it and have our own place to stay when visiting, rather than always renting an Airbnb. We bought the house for about $500,000, and on our first visit to stay in it in January 2025, none of us wanted to go back to Burbank . We knew then that we'd make Snowflake our home. And so we did. We moved from Los Angeles to a town of 6,000 people In so many ways, our life looks exactly like life in LA . Our r", "date_str": "2026-10-17T17:56:01+00:00", "hash": "d284a74c1b62e7ab", "title_fa": "من 20 سال در لس آنجلس زندگی کردم. انتقال 3 فرزندم به یک شهر کوچک آریزونا طول کشید تا آنچه را که گم کرده بودم پیدا کنم.", "summary_fa": "جن پودانی خانواده خود را از کالیفرنیا به آریزونا نقل مکان کرد. با حسن نیت جن پودانی جن پودانی سه فرزندش را در محله ای شلوغ لس آنجلس بزرگ کرد که ترافیک استقلال آنها را محدود می کرد. پس از نقل مکان به یک شهر کوچک آریزونا، فرزندانش می توانند دوچرخه سواری کنند و با دوستان محله بازی کنند. او می گوید سبک زندگی جدید آنها او را به یاد آزادی هایی می اندازد که بچه ها در دهه 1980 بزرگ می شدند. این مقاله همانطور که گفته شد بر اساس گفتگو با جن پودانی، بنیانگذار Bluestone Sunshields است. برای طول و وضوح ویرایش شده است. نزدیک به پایان سال 2024، خانواده پنج نفره من یک بار دیگر از لس آنجلس برای خلوتی که در 10 ساعت جنوب در Snowflake، آریزونا پیدا کردیم، فرار کردند. ما سال‌ها این کار را انجام می‌دادیم، یک Airbnb را در Snowflake کرایه می‌کردیم، شهری 6000 نفری در میانه ناکجاآباد، که در میان مایل‌ها زمین خالی خاموش می‌شد. به عنوان توقفگاهی در راه ما برای دیدار با خانواده شوهرم در نیومکزیکو شروع شده بود. ما عاشق شهر شدیم، و از آن به بعد، هر زمان که لازم بود از شلوغی لس آنجلس دور شویم، به آن سر می زدیم. در Snowflake احساس می‌کردیم که می‌توانیم نفس بکشیم. هر بار که می‌رسیدیم روحمان آرام می‌شد و هر بار که می‌رفتیم برای ماندن درد می‌کردیم. ما پیشنهادی برای خانه ای در لس آنجلس، به ویژه بربنک ارائه کردیم، ما پنج نفر - شوهرم و سه فرزندمان، که آنها را در خانه آموزش می دادیم - در یک دوبلکس متشکل از دو آپارتمان متصل زندگی می کردیم. ما در یکی از آنها زندگی می کردیم که دو اتاق خواب و یک حمام داشت. از آپارتمان دیگر، من و شوهرم دو تجارت جداگانه خود را اداره می کردیم. جن"}, {"source": "Business Insider", "title": "MapQuest now shows you Flock and other license plate reader cameras on your route", "link": "https://www.businessinsider.com/mapquest-flock-surveillance-cameras-license-plate-readers-2026-10", "summary": "A new MapQuest feature allows users to find license plate reader cameras in their area. St. Louis Post-Dispatch/Contributor/Getty Images; Business Insider MapQuest is pulling the curtain back on automatic license plate readers. Users can now locate Flock Safety and other surveillance cameras on MapQuest's app. Critics of the tech have raised privacy concerns and potential misuse. MapQuest, the OG software to find your way from point A to point B , is taking on the surveillance state. The free mapping service unveiled a new feature for its mobile app on Thursday that allows users to turn on a \"surveillance layer\" on a map to locate known automated license plate readers, or ALPRs, along their route. MapQuest says the app can identify cameras developed by Flock Safety , Axon Enterprise , Motorola Solutions, and PlateSmart, among others. \"The Roads Have Eyes!\" the company said in its BlueSky post announcing the new feature. The Roads Have Eyes! 👁️ Turn on the Surveillance Layer in Map Options to see known license plate readers from Flock Safety, Motorola Solutions (Vigilant), Genetec, Axis Communications, Axon, Leonardo (ELSAG), Neology, Rekor, PlateSmart, Ubicquia, Verkada, and other outdoor surveillance cameras. [image or embed] — MapQuest ( @mapquest.com ) October 15, 2026 at 6:49 PM MapQuest's General Manager Doug Berger said drivers using the service inspired the company to add the feature. \"We build around what drivers ask for, and showing surveillance camera locations is one of our users' top three requests,\" Berger told Business Insider in a statement.\" License plate readers capture images of vehicles and then use machine learning to turn details such as license plate numbers, car make, color, and model into searchable data. They're commonly found at intersections, parking lots , roadways, highways, and neighborhood entrances, businesses, and private properties. Law enforcement agencies initially embraced license plate readers to help them locate vehicles and identify suspects. Retail outlets have also used Flock cameras as part of their security efforts. A major backlash against the cameras, however, has led stores, police, and towns to dial back their use. Critics say the cameras raise privacy concerns and that the data they collect can be misused or shared with federal immigration officials. Some people who've opposed the cameras have staged protests, launched petitions, and even forcibly removed them. The city of Tempe in Arizona said in August it ", "date_str": "2026-10-17T17:49:49+00:00", "hash": "820b5cb3ad0baa18", "title_fa": "MapQuest اکنون دوربین های Flock و دیگر پلاک خوان ها را در مسیر شما به شما نشان می دهد", "summary_fa": "ویژگی جدید MapQuest به کاربران امکان می دهد دوربین های پلاک خوان را در منطقه خود پیدا کنند. سنت لوئیس پست ارسال / مشارکت کننده / گتی ایماژ; Business Insider MapQuest در حال بازکردن پرده پلاک خوان های خودکار است. کاربران اکنون می توانند Flock Safety و سایر دوربین های نظارتی را در برنامه MapQuest پیدا کنند. منتقدان این فناوری نگرانی های مربوط به حریم خصوصی و سوء استفاده احتمالی را مطرح کرده اند. MapQuest، نرم افزار OG برای یافتن مسیر شما از نقطه A به نقطه B، حالت نظارت را به خود می گیرد. سرویس رایگان نقشه برداری از ویژگی جدیدی برای اپلیکیشن موبایل خود در روز پنجشنبه رونمایی کرد که به کاربران اجازه می دهد یک \"لایه نظارتی\" را روی نقشه روشن کنند تا پلاک خوان های خودکار شناخته شده یا ALPR ها را در مسیر خود پیدا کنند. MapQuest می گوید این برنامه می تواند دوربین های توسعه یافته توسط Flock Safety، Axon Enterprise، Motorola Solutions و PlateSmart را شناسایی کند. \"جاده ها چشم دارند!\" این شرکت در پست BlueSky خود با اعلام این ویژگی جدید گفت. جاده ها چشم دارند! 👁️ لایه نظارت را در گزینه های نقشه روشن کنید تا پلاک خوان های شناخته شده ای از Flock Safety، Motorola Solutions (Vigilant)، Genetec، Axis Communications، Axon، Leonardo (ELSAG)، Neology، Rekor، PlateSmart، Ubicquia، Verkada و سایر دوربین های نظارتی در فضای باز را ببینید. [تصویر یا جاسازی] — MapQuest (@mapquest.com) 15 اکتبر 2026، ساعت 6:49 بعدازظهر، مدیر کل MapQuest، داگ برگر، گفت رانندگانی که از این سرویس استفاده می‌کنند، شرکت را برای افزودن این ویژگی تشویق کرده‌اند. برگر در بیانیه‌ای به Business Insider گفت: «ما بر اساس آنچه رانندگان درخواست می‌کنند، ایجاد می‌کنیم و نشان دادن مکان‌های دوربین‌های نظارتی یکی از سه درخواست اصلی کاربران ما است.» پلاک‌خوان‌ها تصاویری از وسایل نقلیه می‌گیرند و سپس از"}, {"source": "Business Insider", "title": "Elon Musk is pouring money into the midterms. Here's where he's giving the most.", "link": "https://www.businessinsider.com/elon-musk-spending-midterm-election-texas-paxton-2026-10", "summary": "Elon Musk, seen here with President Donald Trump last month, is bankrolling Republican campaigns. Bloomberg/Getty Images Elon Musk is giving reams of cash to Republicans. Most of that dough is ending up in Texas, according to financial disclosure forms. In Texas, Ken Paxton is running a tight race against James Talarico. Elon Musk is forking over generational wealth to Republicans facing tough midterm elections this cycle. Over two donations in September, Musk gave a combined $158 million to the Senate Leadership Fund, a super PAC aligned with Senate Republicans, which has, in turn, given reams of cash to funds supporting the Republican candidate in Texas. The money, shown in new federal disclosure forms, cements Musk as a major player in Republican politics over a year after he publicly split with President Donald Trump over the latter's handling of the Epstein files (though the two have since reconciled). Republicans are facing serious headwinds over the Iran war, rising inflation, and sky-high gas prices. Polls show that American voters are largely dissatisfied with Trump's leadership and handling of the economy . All told, Musk has given about $276 million since July. Much of Musk's political donations have ended up in Texas, according to federal disclosure forms, where embattled Attorney General Ken Paxton is engaged in a mudslinging battle for the Senate with state representative James Talarico. One day after Musk notched a $75 million donation to the Senate Leadership Fund, the Super PAC gave a $75 million donation to the Texas PAC, a group aligned with Paxton. Then, also in September, another $83 million donation by Musk was matched the next day by an identical donation to the Texas PAC, according to federal disclosure forms. Talarico's campaign, meanwhile, has raised about $129 million. Musk's companies are already investing billions in the Lone Star State, as the business magnate builds SpaceX's terafab semiconductor facility outside Houston. In 2024, Musk announced that he was moving SpaceX's headquarters from California to Texas in response to Gov. Gavin Newsom's policies on gender identity. Representatives for Paxton and Musk did not immediately respond to requests for comment on Saturday. Musk, the CEO of SpaceX and Tesla, said last year that he had probably \"done enough\" political spending, though he left the door open. \"Well, if I see a reason to do political spending in the future, I'll do it. I don't currently see a reason,\" he told Bloom", "date_str": "2026-10-17T16:31:38+00:00", "hash": "8ce92c3bd0515e9b", "title_fa": "ایلان ماسک در حال ریختن پول به میان دوره ای است. اینجا جایی است که او بیشترین کمک را می کند.", "summary_fa": "ایلان ماسک که ماه گذشته در اینجا با رئیس جمهور دونالد ترامپ دیده شد، از کمپین های جمهوری خواهان حمایت مالی می کند. بلومبرگ/گتی ایماژ ایلان ماسک به جمهوری خواهان پول نقد می دهد. بر اساس فرم‌های افشای مالی، بیشتر آن خمیر به تگزاس ختم می‌شود. در تگزاس، کن پکستون رقابت سختی را با جیمز تالاریکو انجام می دهد. ایلان ماسک ثروت نسلی را به جمهوری‌خواهانی که در این دوره با انتخابات میان‌دوره‌ای سخت روبرو هستند، تقسیم می‌کند. ماسک بیش از دو کمک مالی در ماه سپتامبر، مجموعاً 158 میلیون دلار به صندوق رهبری سنا، یک ابر PAC همسو با جمهوری‌خواهان سنا، که به نوبه خود، انبوهی از پول نقد به صندوق‌های حمایت از نامزد جمهوری‌خواه در تگزاس داده است. این پول که در فرم‌های افشای جدید فدرال نشان داده شده است، بیش از یک سال پس از جدایی علنی از دونالد ترامپ رئیس‌جمهور آمریکا بر سر رسیدگی به پرونده‌های اپشتین (اگرچه این دو از آن زمان تاکنون با هم آشتی کرده‌اند) ماسک را به عنوان یک بازیگر اصلی در سیاست جمهوری‌خواهان تثبیت می‌کند. جمهوری خواهان بر سر جنگ ایران، تورم فزاینده و قیمت گاز به شدت بالا با بادهای مخالف جدی روبرو هستند. نظرسنجی ها نشان می دهد که رای tors: mountains and hiking trails, a creek running through town, a historic downtown made for wandering on foot, and plenty of places to eat and drink. It's located just about 15 miles west of downtown Denver, or about a 25-minute drive, and typically less than an hour's drive from the Denver International Airport . Here's why I love bringing out-of-towners to Golden — and where I'd take them when they visited. I'd start the morning with coffee at a family-owned shop. Sogo Beans and Boards is one of my favorite morning stops. Courtesy of Lexi Marshall Golden has several coffee shops, but I'd start my perfect day here at Sogo Beans and Boards. The family-owned coffee and skate shop is just minutes from downtown. I love that Sogo air-roasts its fair-trade coffee and makes its own syrups and pastries. Its plant-filled room, free Wi-Fi, and garden patio make it easy to linger over a latte, and it's the kind of independent shop that makes a morning feel unhurried. We'd spend lots of time outside, which is easy to do in Golden Hiking North Table Mountain Park is one of my favorite ways to see the foothills around Golden Courtesy of Lexi Marshall The city makes it easy to go from a coffee shop to a trail without a long drive. For a leisurely morning, I'd rent an e-bike and follow the paved Clear Creek Trail, which winds alongside the water through parks and greenery. For more of a workout, I'd hike North Table Mountain, where the initial climb stings but rewards you with sweeping views of the city and surrounding mesas. Riding the Clear Creek Trail is a great way to see Golden by e-bike. Courtesy of Lexi Marshall In warmer months, tubing on Clear Creek is another way to take in the town's outdoor culture and scenic views. If I had more time, I'd take the sho", "date_str": "2026-10-17T15:30:01+00:00", "hash": "e59c595e30cd737a", "title_fa": "من اهل کلرادو هستم. اگر یک روز فرصت داشته باشم که ایالتم را به شما نشان دهم، از دنور می گذرم و شما را به شهری در غرب آن می برم.", "summary_fa": "من بیش از 10 سال است که در کلرادو زندگی می کنم. اگر واقعاً می خواهید طعم ایالت را بچشید، از شهر گلدن دیدن کنید. milehightraveler/Getty Images به عنوان یک محلی کلرادو، من عاشق آوردن بازدیدکنندگانی که برای اولین بار به این ایالت می‌روند، به جای دنور، به گلدن می‌روم. با مناظر زیبای کوهستانی و مرکز شهر قابل پیاده‌روی، با ماشین کوتاهی از مرکز شهر دنور فاصله دارد. در کنار چشم انداز کوه، مکان های عالی برای غذا خوردن، پیاده روی و لذت بردن از مناظر در گلدن وجود دارد. من بیش از یک دهه است که در کلرادو زندگی می کنم. اگر فقط یک روز فرصت داشتم تا به کسی نشان دهم که چه چیزی را در مورد ایالت دوست دارم، او را به پایتخت ما، دنور، نمی بردم. در عوض، آنها را به شهر بسیار کوچکتر گلدن می‌آورم. گلدن هدیه‌ها اندکی از همه چیز برای بازدیدکنندگان دارد: کوه‌ها و مسیرهای پیاده‌روی، نهری که در شهر می‌گذرد، مرکز شهر تاریخی که برای سرگردانی پیاده ساخته شده است، و مکان‌های فراوان برای خوردن و نوشیدن. این هتل فقط در 15 مایلی غرب مرکز شهر دنور، یا حدود 25 دقیقه رانندگی، و معمولا کمتر از یک ساعت با فرودگاه بین المللی دنور فاصله دارد. به همین دلیل است که من دوست دارم افراد خارج از شهر را به گلدن بیاورم - و زمانی که آنها را به آنجا می‌برند، آنها را به کجا ببرم. صبح را با قهوه در یک مغازه خانوادگی شروع می کردم. Sogo Beans and Boards یکی از ایستگاه های صبحگاهی مورد علاقه من است. با حسن نیت Lexi Marshall Golden چندین کافی شاپ دارد، اما من روز عالی خود را اینجا در Sogo Beans and Boards شروع می کنم. کافی شاپ و اسکیت فروشی خانوادگی فقط چند دقیقه با مرکز شهر فاصله دارد. من عاشق این هستم"}],

 my political world,” he said, adding that the two discuss politics “a little bit, not a ton.” He described the album as being “about forgiveness and second chances” and an attempt to “heal some of the division in our country.” Kid Rock also noted that Eminem was initially announced for a different track, “7 Sins,” before the two decided to keep their collaboration to a single song; that slot ultimately went to Lil Wayne. The two have a long history together. Eminem featured on Kid Rock’s 1998 song “F Off” from Devil Without a Cause , and Kid Rock appeared in the video for Eminem’s 2013 single “Berzerk.” Both rank among the best-selling artists in Billboard history — Eminem has notched 10 No. 1 albums on the Billboard 200 and five No. 1 hits on the Hot 100, while Kid Rock broke through with his diamond-certified 1998 breakthrough Devil Without a Cause and scored a Hot 100 top 10 with “All Summer Long.”", "date_str": "2026-10-18T08:14:18+00:00", "hash": "a14e451ed91a576f", "title_fa": "امینم از همکاری Kid Rock دفاع می کند: «نه درباره انتخاب طرف»", "summary_fa": "امینم از تصمیم خود برای همکاری با دوست قدیمی کید راک، پس از اینکه تیم جدید آنها با واکنش برخی از طرفداران به دلیل سیاست مخالف این دو هنرمند مواجه شد، دفاع کرد. این خواننده رپ در \"Heal My Faith\"، قطعه‌ای از آلبوم جدید کید راک، Halfway 2 Jesus که جمعه (17 اکتبر) منتشر شد، ظاهر می‌شود. ساعاتی پس از رسیدن آلبوم، امینم در شبکه های اجتماعی به این زوج پرداخت. او نوشت: «نه در مورد انتخاب طرف، فقط انتخاب ساختن موسیقی با دوست قدیمی‌ام. \"برای همه ما دعا کن.\" این همکاری برخی از طرفداران امینم را با توجه به اختلافات سیاسی مستند این دو هنرمند دیترویتی شگفت زده کرده بود: امینم از کامالا هریس در یک گردهمایی دیترویت در سال 2024 حمایت کرد و از دونالد ترامپ در آهنگ هایی از جمله \"Campaign Speech\" انتقاد کرد، در حالی که کید راک از برجسته ترین حامیان ترامپ در موسیقی است. امینم به طور مستقیم در شعر خود به این شکاف ها می پردازد. او قبل از فراخوانی برای اتحاد بین خطوط حزبی و مذهبی رپ می زند: «از رپ شوک تا رپ راک، من و هموطنم / ouldn’t make it, he decided to hit the road alone. “One night I was drinking at the Grisly, this bar in the West Village and I was like, ‘I’m leaving tomorrow’ … I wake up, get on my motorcycle and I stayed at all these national parks,” Bryan said. Although the trip included memorable experiences, such as dining with veterans and skydiving from vintage planes, Bryan said he spent much of his time drinking at local bars. “I was stopping at all these bars and drinking myself to sleep,” the musician said. “Waking up every morning, getting on my motorcycle thinking I was on some sort of soul journey.” The trip took a turn when Bryan arrived in Seattle. After weeks on the road, he found himself sitting outside a truck stop with a beer, questioning what the experience had actually given him. “After all this beautiful scenery, all these nights, all these bars I’ve been to, all this s—t that I’ve done, I was at this Pilot truck stop right outside of Seattle. I’ll never forget this for as long as I live,” he said. “I go into this Pilot and I grab a 40 Budweiser and I’m sitting on the curb with my motorcycle in front of me. I’m drinking [the beer] and I’m thinking ‘What the hell was all that worth? Why did I do any of that? I feel emptier than when I left.’” Bryan said he felt he had “wast", "date_str": "2026-10-17T19:28:02+00:00", "hash": "ebe0eeea655e4b97", "title_fa": "زک برایان در مصاحبه متیو مک‌کانهی درباره هوشیاری صادقانه می‌گوید: «چرا من مشروب می‌نوشم؟»", "summary_fa": "زک برایان در مصاحبه ای جدید با متیو مک کانهی در مورد سفر هوشیاری خود صحبت می کند. این ستاره 30 ساله کانتری با این بازیگر برنده اسکار برای گفتگوی دو ساعته به گفتگو نشست و در مورد رابطه خود با الکل و تجربه ای که در نهایت منجر به ترک الکل شد، صحبت کرد. مربوط به \"جوانمردی و سایر اعضای قابل اهدا\" زک برایان: هر آهنگی که زک برایان را رتبه بندی می کند، مجموعه احیای بلوط پیمانی مگان مورونی برای بازگشت جشنواره گلدن اسکای در سال 2027 جوانمردی زک برایان و دیگر اعضای قابل اهدا: استریم می کنم چون همیشه فکر می کردم 970 را تأسیس کرد و تقریباً با تمام چهره‌های اصلی صحنه ضدفرهنگ لس‌آنجلس، مجموعه مصاحبه‌های «آخرین مرد ایستاده» رولینگ استون، شامل مکالمات طولانی‌مدت بین نویسنده ارشد اندی گرین و نوازندگانی بود که آخرین اعضای باقی‌مانده گروه‌های نمادین هستند. در برخی موارد، آنها تنها عضو دوره کلاسیک در ترکیب تور فعلی هستند. در برخی دیگر، آنها تنها کسانی هستند که هنوز زنده هستند. در هر صورت، روشن نگه داشتن مشعل بر دوش آنها افتاده است، خواه این مسئولیت را بخواهند یا نخواهند. اگر بین سال‌های 1969 و 1974 تقریباً در هر نقطه‌ای رادیو را روشن می‌کردید، به ندرت اتفاق می‌افتد که چند دقیقه قبل از پخش آهنگ سه سگ شب گذشته باشد. مجموعه‌های موفق آن‌ها - از جمله Joy to the World، One، Mama Told Me Not to Come، Black and White و Never to Spain - به آنها کمک کرد تا میلیون‌ها آلبوم را بفروشند و آنها را به اولین گروه راک پس از بیتلز تبدیل کردند که مرتباً تیتر یک استادیوم‌های بیسبال در آمریکا هستند. اما برخلاف CSNY، هو، لد زپلین، رولینگ استونز، پینک فلوید و سایر فعالیت‌های استادیوم که پس از آن‌ها انجام شد، اعضای Three Dog Night حتی در اوج شهرت خود از نام‌های معروف دور بودند. این تا حدی به این دلیل است که آنها یک فرستمن منحصر به فرد نداشتند و در عوض وظایف آوازی را بین چاک نگرون، دنی هاتون و کوری ولز تقسیم کردند. اتکای آن‌ها به ترانه‌سراهای بیرونی نیز در کاهش ارزش انتقادی آن‌ها نقش داشت، حتی با وجود اینکه آنها گوش فوق‌العاده‌ای برای استعداد داشتند، آهنگ‌ها را به طور کامل در استودیو تنظیم کردند و به معرفی افراد رویایی مانند هری نیلسون، رندی نیومن، لورا نایرو، پل ویلیامز، هویت اکستون، و حتی مخاطبان تاریخ موسیقی، التون جانور کمک کردند."}, {"source": "Rolling Stone", "title": "Austin Abrams Has Had an Autumn From Hell. It’s Made Him a Star", "link": "https://www.rollingstone.com/tv-movies/tv-movie-features/austin-abrams-whalefall-resident-evil-interview-1235644295/", "summary": "Whether battling zombies in Resident Evil or fighting for his life in the belly of a beast in Whalefall , the actor has become everybody’s favorite guy to see put through the wringer", "date_str": "2026-10-18T13:00:00+00:00", "hash": " 8aea99", "title_fa": "جسی آیزنبرگ مشکلات کایران کالکین را در ساخت «درد واقعی» زنده می‌کند و می‌گوید پروژه بعدی او یک برنامه تلویزیونی است.", "summary_fa": "اما استون، تهیه کننده مجبور شد در هواپیما به لهستان سفر کند، زیرا آیزنبرگ نمی دانست که قرار است نمایش دهد یا نه: \"او ویدیویی از او برای من فرستاد که در حال عبور از گمرک است و گفت: \"ما اینجا هستیم.\" اختتامیه جشنواره فیلم BFI لندن. آیزنبرگ، ستاره Zombieland، Now You See Me و The Social Network، وقتی در مورد بزرگ شدن در تئاتر اجتماعی صحبت می کرد، از تماشای خود روی پرده امتناع می کرد - و به نظر او بازیگران تئاتر موزیکال به ورزشکاران NBA بیشتر از بازیگران معمولی سینما و تلویزیون نزدیک هستند، جمعیت را بخیه می زد. داستان‌های مرتبط فیلم‌های Imperium، Concrete Land و 9 Temples to Heaven برنده جایزه BFI جشنواره فیلم لندن شدند. کالکین سال گذشته اولین اسکار بهترین بازیگر نقش مکمل مرد را دریافت کرد. We didn t know if Kieran was ever gonna show up to Poland, began Eisenberg about the process ( A Real Pain stars him and Culkin as two Jewish-American cousins who reunite for a Holocaust heritage tour through Poland). کایران با هیچ کس تماس نمی گیرد - او یکی از آن افرادی است که گهگاه درباره او می شنوید. آنها فوق العاده هستند، اما شما نمی دانید که آیا آنها آنجا خواهند بود یا خیر."}, {"source": "Hollywood Reporter", "title": "The Best-Dressed Stars at the Academy Museum Gala, Including Inde Navarrette and Taylor Swift", "link": "https://www.hollywoodreporter.com/lifestyle/style/best-dressed-stars-academy-museum-gala-2026-1236734403/", "summary": "Taylor Swift in Dior, Sabrina Carpenter in Giorgio Armani Privé and Colman Domingo in custom Valentino were among the night's wow moments in style.", "date_str": "2026-10-18T14:27:52+00:00", "hash": "c3c76101013040cb", "title_fa": "ستارگان خوش لباس در مراسم گالا موزه آکادمی، از جمله ایند ناوارت و تیلور سویفت", "summary_fa": "تیلور سوئیفت در دیور، سابرینا کارپنتر در جورجیو آرمانی پریو و کولمن دومینگو در والنتینو سفارشی از جمله لحظات شگفت انگیز این شب بودند. سبک آینده نگر تازه از باند فرودگاه های بهار 2027 با قطعات آرشیوی و سفارشی در میان ستارگانی که روی فرش قرمز مراسم جشن موزه آکادمی شنبه راه رفتند، آمیخته شد - و اگر یک موضوع مشترک در بسیاری از ظاهرها وجود داشت، سهولت فوق العاده بود، ترکیبی بی دردسر از شیک آرامی که همیشه در یک نمایشگاه اتومبیل نمایش جایزه وجود ندارد. به هر حال، در گالا موزه آکادمی، چند جوایز اهدایی از قبل تعیین شده است و فشار بر بقیه کم است. این ممکن است یکی از دلایلی باشد که این جمع‌آوری کمک مالی ششمین سال، جمعیت قابل توجهی را جذب کرد که از حمایت از برنامه‌ها و نمایشگاه‌های ارائه‌شده توسط موزه آکادمی تصاویر متحرک بسیار خوشحال هستند. رابرت رودریگز، استیون اسپیلبرگ و کیت کپشاو به عنوان روسای مشترک جشن 2026 حضور داشتند، در حالی که کمیته میزبان امسال شامل دمی مور، رامی مالک، گرتا لی، تیانا تیلور و کیت هادسون است. با افتخارآفرینان شب - شارلیز ترون، جان کارپنتر و کولمن دومینگو - مشخص می‌شود که چرا این فهرست مهمانان پرتعداد این افکار را القا می‌کند که شب با گالا هنری+فیلم LACMA در نوامبر برای عنوان Met Gala در ساحل غربی رقابت می‌کند. Related Stories Movies Ava DuVernay Sounds the Alarm Over the Erosion of Democracy at 14th World Premiere: We Need to Fight Music Taylor Swift to Perform at This Year s Academy Museum Gala An influential guest list gathering to celebrate their industry, but instead their shared love of cinema may ultimately be the reason the evening s overall style blends the aforementioned relaxed-chic زیبایی شناسی با موجی از درام و در بسیاری از موارد حس غیرقابل انکار سرگرم کننده."}, {"source": "Hollywood Reporter", "title": "‘Imperium,’ ‘Concrete Land’ and ‘9 Temples to Heaven’ Win BFI London Film Festival Awards", "link": "https://www.hollywoodreporter.com/movies/movie-news/bfi-lff-2026-awards-winners-imperium-concrete-land-1236734344/", "summary": "'Aman' was honored in the short film competition, while LFF special mentions went to 'Queer Edward II,' 'MASC' and 'Daughters of the Late Colonel'", "date_str": "2026-10-18T13:00:00+00:00", "hash": "b8046d345a87d824", "title_fa": "«امپریوم»، «زمین بتنی» و «9 معبد بهشت» برنده جوایز جشنواره فیلم لندن BFI شدند.", "summary_fa": "«امان» در مسابقه فیلم کوتاه مورد تقدیر قرار گرفت، در حالی که افتخارات ویژه LFF به «دگرباش ادوارد دوم»، «MASC» و «دختران سرهنگ فقید» تعلق گرفت. برندگان جوایز سال افتخارات 2026 توسط Imperium سرگئی لوزنیتسا که برنده جایزه بهترین فیلم در مسابقه رسمی شد و Asmahan Bkerat Concrete Land که برنده جایزه Grierson در مسابقه مستند LFF شد، به دست آمد. ایمپریوم فیلم‌های ایتالیایی اوایل دهه 1970 را گرد هم می‌آورد که در سراسر شوروی آن زمان فیلمبرداری شده است. نتیجه نگاهی به تنوع کشور در تقابل با تصاویر و تولیدات رسمی شوروی از همان دوران است. داستان‌های مرتبط فیلم‌ها تغییرات ورودی اسکار آفریقای جنوبی بر روی یک موضوع با تلویزیون مایکروسافت اکسل نوشته شده بود. نخست‌وزیر دیپلمات بریتانیا به روشی که از داستان تکان‌دهنده‌اش مطلع شد Imperium یک فیلم خارق‌العاده است که اتحاد جماهیر شوروی در اوایل دهه 1970 را از منظری گسترده به زندگی اجتماعی و با نگاهی به آرشیو وسیع اجتماعی می‌پردازد. هیئت داوران LFF گفت و چشم انداز فرهنگی که به ندرت دیده شده است. The film is richly evocative and emotionally engaging on all levels, giving us a visually arresting perspective of life before the Soviet Union was broken apart. فیلم سرزمین بتنی بکرات کارگردان فلسطینی-اردنی داستان یک خانواده بادیه نشین فلسطینی را روایت می کند که در اردن آواره شده اند. این فیلمساز جوان در مصاحبه اخیر خود به THR گفت که خانواده ای که در این فیلم حضور داشتند به او کمک کردند تا عشقش به فیلمسازی مستند را کشف کند."}, {"source": "Hollywood Reporter", "title": "‘What Belongs to Others’ Wins Top Warsaw Film Festival Award", "link": "https://www.hollywoodreporter.com/movies/movie-news/warsaw-film-festival-2026-awards-winners-what-belongs-to-others-1236734712/", "summary": "Cai Chengjie was named best director for 'Suzhou Quartet,' while 'Agia' was honored with the Competition 1-2 award at the 42nd edition of the Polish festival.", "date_str": "2026-10-18T09:10:02+00:00", "hash": "e8752cb13bc3fe49", "title_fa": "«آنچه به دیگران تعلق دارد» برنده جایزه برتر جشنواره فیلم ورشو شد", "summary_fa": "Cai Chengjie بهترین کارگردان برای \"Suzhou Quartet\" و \"Agia\" با جایزه رقابت 1-2 در چهل و دومین دوره جشنواره لهستان مفتخر شد. چهل و دومین دوره جشنواره بین المللی فیلم ورشو روز یکشنبه پس از معرفی برندگان آن در مراسم اهدای جوایز شنبه شب به پایان می رسد. جایزه بزرگ ورشو در مسابقات بین‌المللی جشنواره لهستان به گرژگورز دبوفسکی برای آنچه متعلق به دیگران است، رسید. این فیلم درباره یک سارق لهستانی است که هویت دوست دختر غریبه مرده ای را فرض می کند و نتایج غیرمنتظره ای به همراه دارد. هیئت داوران اعلام کرد که به دلیل داستان‌گویی دقیق و ظریف، بازی‌های استثنایی، و پرتره پیچیده‌اش، عاری از قضاوت، از زنی ناقص و گریزان که با لغزش به هویت و زندگی یک غریبه دستخوش دگرگونی می‌شود و در آنجا امکان خود را پیدا می‌کند، جایزه برتر را به فیلم اعطا کرد. داستان‌های مرتبط فیلم‌ها تغییرات ورودی اسکار آفریقای جنوبی بر روی یک موضوع با تلویزیون مایکروسافت اکسل نوشته شده بود. نخست‌وزیر دیپلمات بریتانیا به شیوه اپراتوری او از داستان تکان‌دهنده فصل چهارم خود مطلع شد جایزه بهترین کارگردانی ورشو به فیلمساز چینی Cai Chengjie برای کوارتت سوژو تعلق گرفت، که هیئت داوران به عنوان یک فیلم سینمایی بدیع و مفهومی تحسین برانگیز به ارمغان آورد. آزمایش جسورانه با فرم روایی مدیتیشن بصری جذاب و لایه‌ای غنی در مورد زندگی و مرگ و میر، داستان چهار نفر را روایت می‌کند که به‌طور اتفاقی در یک نودل‌فروشی کوچک با هم آشنا می‌شوند و متوجه می‌شوند که آشنای دیرینه‌ای هستند. در همین حال، جشنواره ورشو همچنین جایزه ویژه هیئت داوران را به ماریا دبسکا برای بازی در فیلم Through the Wall به کارگردانی Maciej Sobieszczański، درباره دو زندانی سیاسی جوان در جریان ترور استالینیستی در لهستان که عاشق هم می شوند، اعطا کرد."}, {"source": "Hollywood Reporter", "title": "South Africa’s Oscar Entry ‘Variations on a Theme’ Was Written With Microsoft Excel", "link": "https://www.hollywoodreporter.com/movies/movie-news/oscars-2027-south-africa-film-variations-on-a-theme-excel-1236734314/", "summary": "Plus, an Estonian composer also has something to do with the film’s musical vibes, co-writer and co-director Devon Delmar shared with THR at the BFI London Film Festival.", "date_str": "2026-10-18T07:30:00+00:00", "hash": "f38ccdeb122228ab", "title_fa": "مدخل اسکار آفریقای جنوبی \"تغییرهای یک موضوع\" با مایکروسافت اکسل نوشته شده است", "summary_fa": "به علاوه، یک آهنگساز استونیایی نیز با حالات موسیقی فیلم ارتباط دارد، دوون دلمار، نویسنده و کارگردان مشترک آن، در جشنواره فیلم BFI لندن با THR به اشتراک گذاشته است. Ouma Hettie یک گله بز هشت ساله در کامیزبرگ آفریقای جنوبی است. وقتی او قربانی کلاهبرداری می شود که وعده غرامت خدمات بدون دستمزد پدرش در طول جنگ جهانی دوم را می دهد، خانواده اش بیش از آنچه که او بخواهد درگیر می شوند. به دنیای Variations on a Theme (Variasies op 'n Tem) از نویسندگان/کارگردانان Devon Delmar و Jason Jacobs (Carisa)، که برنده جایزه ببر در جشنواره بین المللی فیلم روتردام امسال شد و به تازگی در هفتادمین دوره جشنواره فیلم BFI لندن (LFF) به نمایش درآمد خوش آمدید. داستان های مرتبط TV The Diplomat U.K. نخست وزیر در مسیر اپراتیو از داستان تکان دهنده فصل 4 خود مطلع شد. آری امانوئل برادر رام را به عنوان رئیس جمهور دموکرات میانه رو مطرح می کند و می گوید که او خیلی نگران هوش مصنوعی نیست: طعم و مزه ندارد سبک بصری شاعرانه و متمایز باعث می شود که این سبک بصری بازیگوشی را به این وب سایت و جامعه نزدیک کند. در مورد فیلم دلمار، که تدوین فیلم را نیز برعهده داشت، برای LFF به لندن آمد و با THR در مورد موزیکال بودن Variations on a Theme و اینکه چگونه ممکن است تنها فیلمی باشد که در مایکروسافت اکسل نوشته شده است صحبت کرد. فیلم حالت رقص ریتمیک دارد، حسی از یک رقص زیربنایی که شما فقط در حین تجربه آن را احساس می کنید - بدون اینکه لزوماً بتوانید آن احساس را توضیح دهید. و این همه از روی طراحی است. دلمار به THR می‌گوید: «همه چیز با این شروع می‌شود که جیسون یک فرد بسیار فهیم و آگاه است. او از این روستایی است که در"}, {"source": "Hollywood Reporter", "title": "Academy Museum Gala: Taylor Swift, Sabrina Carpenter, Jennifer Hudson, Connor Storrie, More Stars Walk the Carpet", "link": "https://www.hollywoodreporter.com/gallery/taylor-swift-anna-kendrick-photos-academy-museum-gala-2026-1236734470/", "summary": "Inde Navarrette, Colman Domingo, Teyana Taylor, Anna Kendrick, Rami Malek, Jamie Lee Curtis, Jacob Elordi, Adrien Brody, Mikey Madison, Chase Infiniti, Mark Hamill, Kate Hudson, Sofia Vergara, Seth Rogen, Pamela Anderson, Naomi Ackie, Charlize Theron, Alexa Demie, Mia Goth, Cailee Spaeny, Mckenna Grace, Zoey Deutch and Kristen Wiig were also in attendance at the star-studded event.", "date_str": "2026-10-18T01:59:54+00:00", "hash": "548f871f87e6653c", "title_fa": "گالا موزه آکادمی: تیلور سویفت، سابرینا کارپنتر، جنیفر هادسون، کانر استوری، ستاره های بیشتری روی فرش راه می روند", "summary_fa": "ایند ناوارت، کولمن دومینگو، تیانا تیلور، آنا کندریک، رامی مالک، جیمی لی کرتیس، جیکوب الوردی، آدرین برودی، مایکی مدیسون، چیس اینفینیتی، مارک همیل، کیت هادسون، سوفیا ورگارا، ست روگن، پاملا اندرسون، نائومی دیرون، نائومی دِرون کیلی اسپانی، مک‌کنا گریس، زوئی دویچ و کریستن ویگ نیز در این رویداد پر ستاره حضور داشتند."}, {"source": "Hollywood Reporter", "title": "Gene Schwam, Hollywood Publicist to Elvis Presley, Judy Garland and Julie Andrews, Dies at 96", "link": "https://www.hollywoodreporter.com/movies/movie-news/gene-schwam-dead-publicist-elvis-judy-garland-julie-andrews-1236734445/", "summary": "Schwam died Friday in Los Angeles following a brief illness.", "date_str": "2026-10-17T23:35:28+00:00", "hash": "57f64ee1e0ff0d7d", "title_fa": "جین شوام، روزنامه‌نگار هالیوود برای الویس پریسلی، جودی گارلند و جولی اندروز در ۹۶ سالگی درگذشت.", "summary_fa": "جین شوام، روزنامه نگار کهنه کار هالیوود که با افرادی مانند الویس پریسلی، جودی گارلند، جولی اندروز، باربارا ادن و بلیک ادواردز کار می کرد، درگذشت. او 96 سال داشت. شوام روز جمعه در لس آنجلس پس از یک بیماری کوتاه درگذشت. در سال 1954، او با همکار تبلیغاتی استنلی کوان کار می کرد که 35 دلار در هفته درآمد داشت، زمانی که تصمیم گرفت شرکت را ترک کند و آژانس خود را پیدا کرد. در کنار آدلین هانسون، آنها روابط عمومی هانسون شوام را در سال 1955 افتتاح کردند. این شرکت با نمایندگی رستوران ها و نوازندگان شروع به کار کرد، اگرچه فهرست آنها به سرعت به صنعت سرگرمی گسترده تر گسترش یافت. نانسی ویلسون و لو رالز از جمله افرادی بودند که توسط آژانس نمایندگی می‌کردند، که علاوه بر این، تبلیغات کلوپ شبانه Cocoanut Grove را انجام می‌داد. داستان‌های مرتبط فیلم‌ها مایکل فارست، بازیگر فیلم‌های راجر کورمن و پیشتازان فضا، درگذشت در موسیقی ۹۷ مارک پوچی، تبلیغ‌کننده موسیقی و بلوز طولانی‌مدت، مرگ در ۷۹ سالگی شوام همچنین با لنی بروس، سید کاریس و جین بری کار کرده است. کار او با اندروز و ادن در حرفه او به عنوان یک روزنامه‌نگار محوری بود، و او دوستی نزدیکی با ادواردز برقرار کرد. شخصیت تبلیغاتی در فیلم سال 1981 خود S.O.B. از شوام الهام گرفته شده است. او همچنین خالق Humanity 101 است که ابتکار پروژه علوم انسانی دانشگاه ایالتی آریزونا است که شفقت، همدلی، بخشش، صداقت، مهربانی، احترام و خوداندیشی را ترویج می‌کند. این روزنامه نگار پیشکسوت در گفتگو با کریس گاردنر از هالیوود ریپورتر در آوریل 2021، درباره حرفه خود تأمل کرد و خاطرنشان کرد: «اشتباهی وجود دارد که مردم فکر می‌کنند مهم این است که در هالیوود چه کسی را می‌شناسید، اما مسئله این نیست - مهم این است که چه کسی شما را می‌شناسد.»"}, {"source": "Hollywood Reporter", "title": "Miley Cyrus Returns to the Stage With Emotional and Cathartic Hollywood Bowl Show", "link": "https://www.hollywoodreporter.com/music/music-news/miley-cyrus-live-hollywood-bowl-2026-night-1-highlights-1236734276/", "summary": "The 33-year-old played her first major concert in four years Friday night for the first of two shows at the iconic L.A. venue.", "date_str": "2026-10-17T23:17:39+00:00", "hash": "bec7b4c9b8369d93", "title_fa": "بازگشت مایلی سایرس به صحنه با نمایش کاسه ای هالیوودی احساسی و کاتارتیک", "summary_fa": "این زن 33 ساله اولین کنسرت مهم خود را پس از چهار سال جمعه شب برای اولین کنسرت از دو برنامه در محل نمادین لس آنجلس اجرا کرد. طرفداران در هر سنی در جمعه ی هالیوود بول جمع شدند تا شاهد تجربه ای نادر در فضای موسیقی امروز باشند: کنسرت انفرادی تمام عیار مایلی سایرس. این ستاره 33 ساله پاپ که این روزها فقط مایلی را پشت سر می گذارد، در مورد عوارضی که اجرای زنده بر سلامت و سلامت روان او می گذارد، صحبت کرده است. در نتیجه، نزدیک به یک دهه از آخری lomat از طریق Pagliacci است. ] روری کینیر نمی توانست بدون یک غافلگیری دیگر از The Diplomat خارج شود. این بازیگر که چهار فصل گذشته را در نقش نخست وزیر بریتانیا، نیکول تروبریج سپری کرده است، در نیمه راه آخرین فصل تریلر سیاسی نتفلیکس استعفا می دهد و این حرکت را در لحظه ای تکان دهنده در پایان قسمت چهارم اعلام می کند. تراوبریج پس از یک اپیزود غیرمعمول سورئال برای دیپلمات کنار می‌رود، که در آن تصور می‌کند مشاور سابق مارگارت رویلین (سلیا ایمری) که در اوایل فصل سوم می‌میرد، هنوز زنده است و در حال انجام آخرین اقدامات خود است. او همچنین در توهم است که مقامات آمریکایی که با آنها ملاقات می‌کند، به او می‌خندند و او را مسخره می‌کنند و در حالی که خود را هم پادشاه و هم دلقک می‌داند (و هر دو لباس را به تن دارد) یک آریا می‌خواند. داستان های مرتبط کسب و کار آری امانوئل برادر رام را به عنوان رئیس جمهور دموکرات میانه رو معرفی می کند و می گوید که او خیلی نگران هوش مصنوعی نیست: تلویزیون طعم و مزه ای ندارد پاتریک برامال آماده است به صفوف صادرات بزرگ استرالیا بپیوندد علیرغم صحنه های مهیج که منتهی به فیلم Kinnear می شود. دبورا کان، مجری برنامه دیپلمات، می گوید که دلایل واقعی و واقعی برای تغییر این فصل در دولت بریتانیا، آستین دنیسون (دیوید گیاسی) وزیر امور خارجه در سانحه سقوط هلیکوپتر درگذشت."}, {"source": "Hollywood Reporter", "title": "Harry Styles Debuts Unreleased Song at MSG to Honor Liam Payne on Second Death Anniversary", "link": "https://www.hollywoodreporter.com/music/music-news/harry-styles-unreleased-song-honor-liam-payne-anniversary-1236734395/", "summary": "The pair were former bandmates of One Direction from 2010 to 2016.", "date_str": "2026-10-17T21:07:57+00:00", "hash": "b2b4b23eedc5b83c", "title_fa": "هری استایلز برای قدردانی از لیام پین در دومین سالگرد مرگ، اولین آهنگ منتشر نشده خود را در MSG اجرا کرد.", "summary_fa": "هری استایلز از دوست فقید خود و هم گروه سابق وان دایرکشن، لیام پین، در دومین سالگرد مرگش یاد می کند. برنده گرمی در جریان نمایش جمعه شب خود در مدیسون اسکوئر گاردن در نیویورک به عنوان بخشی از محل اقامتش با هم، با هم، آهنگ آکوستیک منتشر نشده ای با عنوان \"What Is  "summary_fa": "درست قبل از نیمه بازی فوتبال دوشنبه شب لس آنجلس رامز با بوفالو بیلز است، و آتسوکو اوکاتسوکا کمدین در تونل ایستاده است و خودش را هیاهو می کند. در کمتر از یک دقیقه، کمدین، هنرپیشه و بومی آنجلنو به میدان ورزشگاه SoFi می‌رود تا با تشویق‌کنندگان رامز اجرا کند. Okatsuka [ ] It’s just before halftime of the Los Angeles Rams’ Monday Night Football matchup with the Buffalo Bills, and comedian Atsuko Okatsuka is standing in the tunnel, hyping herself up. خوشبختانه، زمانی که اوکاتسوکا به مرکز ساختار می‌چرخد، حافظه عضلانی فراگیر می‌شود. مهارت های شادی او در دبیرستان ونیز دوباره به سرعت باز می گردد. (به هر حال او به عنوان \"با روحیه ترین\" انتخاب شد!) جمعیت فروخته شده تشویق می کنند در حالی که جدیدترین تشویق کننده Rams به ضرب آهنگ بالا \"حیوان\" کاتسی می رود و سپس در یک لحظه، لحظه بزرگ او به پایان می رسد. وقتی موسیقی به پایان می رسد، اوکاتسوکا آخرین ژست خود را می گیرد - او آن را له کرد - و اکنون، با بقیه تیم جدیدش به سمت تونل می دود. محبوب در Variety Okatsuka متوقف می شود تا واکنش فوری خود را با Variety به اشتراک بگذارد: \"من خیلی پیر هستم\" او کرک می کند. چند دقیقه بعد، او در یک صندلی استراحت در اتاق سبز فرو می‌رود تا در مورد تبدیل شدن به اولین تشویق کننده مهمان مشهور NFL فکر کند. اوکاتسوکا که از غرور می درخشید، می گوید: «قسمت میانی را له کردم. \"خیلی سرگرم کننده بود. من را به اجرای روحیه خوب از طریق رقص برمی گرداند. من این کار را یک دقیقه انجام نداده ام.» ابتکار ابتکار مهمان مشهور NFL، آخرین گسترش مجموعه موفق لیگ «مهمان مشهور» است که سال گذشته با ورزشکاران حرفه‌ای، بازیگران و نوازندگان - از جمله جری رایس، سیمون بایلز،"}, {"source": "Variety", "title": "Sergei Loznitsa’s ‘Imperium’ Wins Best Film at BFI London Film Festival", "link": "https://variety.com/2026/film/festivals/sergei-loznitsa-imperium-best-film-london-film-festival-1236915621/", "summary": "Sergei Loznitsa’s “Imperium,” which revisits the Soviet Union of the early 1970s through footage shot by Italian cameramen, has won the best film award at the 70th BFI London Film Festival competition. The prizes     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
