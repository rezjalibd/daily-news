‌ای بر معیشت آن‌ها ندارد."}, {"source": "Zoomit", "title": "دوربین مکانیکی آیفون ۱۸ پرو مکس از نمای نزدیک", "link": "https://www.zoomit.ir/mobile/467607-iphone-18-pro-camera-teardown/", "summary": "کالبدشکافی جدید iFixit نشان می‌دهد سیستم دیافراگم متغیر آیفون ۱۸ پرو ساختاری بسیار پیچیده و تعمیرناپذیر دارد.", "date_str": "2026-09-21T11:29:20+00:00", "hash": "a5bf2fd093477c7b", "title_fa": "دوربین مکانیکی آیفون ۱۸ پرو مکس از نمای نزدیک", "summary_fa": "کالبدشکافی جدید iFixit نشان می‌دهد سیستم دیافراگم متغیر آیفون ۱۸ پرو ساختاری بسیار پیچیده و تعمیرناپذیر دارد. تبلیغات کالبدشکافی جدید کارشناسان iFixit از ساختار داخلی لنز مجهز به دیافراگم متغیر در گوشی‌های آیفون ۱۸ پرو و آیفون ۱۸ پرو مکس پرده برداشت. دیافراگم مکانیکی و قابل‌تنظیم پرچمداران جدید اپل به‌صورت مغناطیسی باز و بسته می‌شود تا میزان نور ورودی به حسگر را کنترل کند؛ سازوکاری که شامل ۶ تیغه‌ی هم‌پوشان با ضخامتی معادل تار موی انسان است. تصاویر ثبت‌شده با میکروسکوپ Evident DSX2000 ظرافت فوق‌العاده‌ی این قطعات را نشان می‌دهد. گنجاندن چنین مکانیزم دقیقی در ابعاد ماژول دوربین آیفون ۱۷ پرو تحسین کارشناسان را برانگیخته است. متخصصان iFixit، کارشناسان کالبدشکافی سخت‌افزار، گفتند: «لنز دیافراگم متغیر اپل شاهکاری در مهندسی دقیق به شمار می‌رود.» لایک پیچیدگی فنی بالا چالش‌های جدی برای تعمیرپذیری دستگاه ایجاد می‌کند. در صورت بروز هرگونه خرابی، باز کردن و تعمیر این مکانیزم نیازمند ابزارها و دانش بسیار تخصصی خواهد بود و عملا غیرممکن محسوب می‌شود؛ بنابراین کاربران مجبور به تعویض کامل ماژول دوربین خواهند بود. قطعات یدکی نسل جدید هنوز عرضه نشده است؛ اما ماژول دوربین آیفون ۱۷ پرو قیمت ۲۴۹ دلار دارد و انتظار می‌رود ماژول مکانیکی جدید با هزینه‌ی بالاتری تعویض شود. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "تویوتا با ۴۰۰ هزار ربات پیشرفته، خط تولید خودروهایش را مدرن‌تر می‌کند", "link": "https://www.zoomit.ir/robotics-smart-machines/467593-toyota-400000-factory-robots-automation-plan/", "summary": "تویوتا از برنامه‌ی احتمالی خود برای استقرار ۴۰۰ هزار ربات در کارخانه‌ها و زنجیره‌ی تأمین از سال ۲۰۲۸ خبر داد.", "date_str": "2026-09-21T11:20:00+00:00", "hash": "453bfd7712ba5026", "title_fa": "تویوتا با ۴۰۰ هزار ربات پیشرفته، خط تولید خودروهایش را مدرن‌تر می‌کند", "summary_fa": "تویوتا از برنامه‌ی احتمالی خود برای استقرار ۴۰۰ هزار ربات در کارخانه‌ها و زنجیره‌ی تأمین از سال ۲۰۲۸ خبر داد. تبلیغات تویوتا به سرمایه‌گذاران اعلام کرده که نوسازی و خودکارسازی کارخانه‌ها در مجموعه‌ی عملیاتی، شرکت‌های زیرمجموعه و تامین‌کنندگان بزرگ، به حدود ۴۰۰ هزار ربات و سالانه یک تریلیون ین (معادل ۶٫۴ میلیارد دلار) بودجه از سال ۲۰۲۸ نیاز خواهد داشت. این غول خودروسازی هنوز تعهد قطعی برای پرداخت چنین مبلغی نداده و آن را به عنوان یک برآورد داخلی مطرح کرده است. بر اساس گزارش Nikkei ، برآورد یادشده در جریان نشست فناوری ویژه‌ی سرمایه‌گذاران در مقر اروپایی تویوتا در بروکسل اعلام شد. بر اساس برنامه‌ریزی‌های اولیه، حدود ۱۵۰ هزار دستگاه از روبات‌ها در کارخانه‌های گروه تویوتا و نزدیک به ۲۵۰ هزار دستگاه در سایت‌های تامین‌کنندگان و شرکای تجاری مستقر خواهند شد. برآورد ۴۰۰ هزار رباتی شامل ماشین‌های انسان‌نما و تجهیزات صنعتی متداول می‌شود که جایگزین دستگاه‌های فرسوده خواهند شد یا به عنوان خطوط جدید فعالیت خود را آغاز می‌کنند. یکی از ارکان این پروژه، پلتفرم ربات انسان‌نمای چرخ‌دار موسوم به ELEY متعلق به مؤسسه‌ی تحقیقاتی تویوتا است که با بهره‌گیری از مدل‌های رفتاری بزرگ، مهارت‌های پیچیده‌ی استادکاران باسابقه ژاپنی ملقب به تاکومی را یاد می‌گیرد. رویکرد اصلی خودروساز ژاپنی، هم‌زیستی ربات‌ها و نیروی انسانی است؛ به‌گونه‌ای که ماشین‌ها امور تکراری و سنگین را بر عهده بگیرند و انسان‌ها بر قضاوت‌های دقیق کیفی تمرکز کنند. این تحول با هدف افزایش یکدستی کیفیت محصولات و مقابله با رقبای چینی انجام می‌شود و زمان‌بندی اجرای آن با برنامه‌ی بازسازی کارخانه‌های بین‌المللی تویوتا هماهنگ خواهد بود. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "گوشی هری پاتر ashioned Apple Pie and Ina Garten's Deep-Dish Apple Pie . My official review? Making apple pie is not for the faint of heart. But if you're feeling ambitious, read this, learn from my mistakes, and make sure you have all the kitchen gadgets required. Here's how Ina Garten's and Martha Stewart's apple pies compare. The first step of any good pie is the crust. These are the ingredients I needed for Stewart s recipe. The ingredients for Martha Stewart s pie crust. Gabbi Shaw/Business Insider Her recipe called for flour, butter, sugar, ice water, and salt. The next step was to combine the flour, butter, sugar, and salt in a food processor. The food processor. Gabbi Shaw/Business Insider This is where I hit my first roadblock. My food processor wasn't big enough to fit the entire mixture, so I had to split it up and run it in multiple batches. The recipe said to mix until it looked like a coarse meal — I think it looks pretty accurate. The dough. Gabbi Shaw/Business Insider I then slowly mixed in ice water. Using cold ingredients like ice water and chilled butter helps keep the dough flaky for baking. Since it would've been too difficult to portion out the water in the smaller food processor, I combined it all in my standing mixer. After mixing in the water, I split the dough into two halves and put it in the fridge to chill. The finished pie dough. Gabbi Shaw/Business Insider That's for the top and bottom crusts. The recipe instructed me to flatten both halves into discs. This crust was pretty firm even before I put it away to chill. It didn't stick to the cutting board at all. Next, I made Garten s crust. The ingredients for Garten s recipe. Gabbi Shaw/Business Insider Garten's recipe is similar, bar one ingredient: It calls for flour, ice water, sugar, salt, butter, and shortening. I used Crisco. The", "date_str": "2026-09-21T13:52:01+00:00", "hash": "3b892ecc43cafba1", "title_fa": "من دستور العمل های پای سیب مارتا استوارت و اینا گارتن را مقایسه کردم. فقط یکی از آنها طعم پای سیب را داشت.", "summary_fa": "پای سیب مارتا استوارت. Gabbi Shaw/Business Insider من دستور العمل های پای سیب مارتا استوارت و اینا گارتن را مقایسه کردم. پوسته گارتن نیاز به کوتاه کردن داشت و از مرکبات بیشتری استفاده می کرد، در حالی که دستور استوارت به طور کلی ساده تر بود. بعد از این تجربه، من تمام نکات پخت را رعایت خواهم کرد. پای سیب یک غذای اصلی پاییزی است، اما اگر شما هم مثل من هستید، باید آن را از یک فروشگاه مواد غذایی یا یک نانوایی بخرید. قبل از شروع پاییز، می خواستم برای اولین بار یک پای سیب را از ابتدا بپزم. به عنوان یک نانوای تازه کار، به تمام کمکی که می توانستم دریافت کنم نیاز داشتم و تصمیم گرفتم دو دستور غذا را از آیکون های آشپزی که می دانند درباره چه چیزی صحبت می کنند امتحان کنم: پای سیب قدیمی مارتا استوارت و پای سیب دیپ دیش اینا گارتن. بررسی رسمی من؟ درست کردن پای سیب برای افراد ضعیف نیست. اما اگر جاه طلب هستید، این را بخوانید، از اشتباهات من درس بگیرید و مطمئن شوید که تمام وسایل آشپزخانه مورد نیاز را دارید. در اینجا نحوه مقایسه پای سیب اینا گارتن و مارتا استوارت آمده است. اولین مرحله از هر پای خوب، کراست است. اینها موادی است که من برای دستور پخت استوارت نیاز داشتم. مواد تشکیل دهنده پوسته پای مارتا استوارت. Gabbi Shaw/Business Insider دستور پخت او شامل آرد، کره، شکر، آب یخ و نمک بود. مرحله بعدی ترکیب آرد، کره، شکر و نمک در غذاساز بود. غذاساز. Gabbi Shaw/Business Insider این همان جایی بود که من به اولین سد راه خود رسیدم. غذاساز من به اندازه کافی بزرگ نبود که کل مخلوط را جا دهد، بنابراین مجبور شدم آن را تقسیم کنم و در چند دسته اجرا کنم. دستور غذا گفته شد تا زمانی که به"}, {"source": "Business Insider", "title": "I thought I was hopeless at interior design. Picking a paint color for my daughter's room gave me the creative spark I needed.", "link": "https://www.businessinsider.com/picking-paint-color-kids-room-design-inspiration-2026-9", "summary": "The author has learned that anchoring a room s design around a color helps make things feel more put-together. Courtesy of Jillian Pretzel I've never had an eye for design. My own spaces have been a hodgepodge, but I wanted my daughter's room to feel special. Starting out by picking a color helped anchor my other choices. When I was expecting my first baby, I spent untold hours trying to decorate her nursery . Every time I sat down at the computer to pick out furniture and decor, I'd start strong: I'd find a crib I liked, then try to match it to a wallpaper that seemed to have the same \"vibe.\" It would always spiral from there. Maybe I couldn't find a bookshelf that exactly matched the crib, so I'd scroll through hundreds of shelves searching for one that popped out. Usually, none did. So I'd consider floating shelves instead. Not knowing which wood finish to pick, I'd switch gears and look at lamps. But what kind of lamp would be best? It went on and on. I always ended up frustrated and exhausted, with no progress. \"Come on,\" I'd pump myself up in the mirror. \"This should be fun and easy.\" But I knew the problem: I simply didn't have an eye for design . Other people could look at a room and see what it could be. I'd look at a room and see: a room. I had no idea what would be best where or with what, and no clue what \"texture\" was needed to \"pull it together.\" Even as a kid, I never cared to do anything special to my room. Later, my dorms and early-adult apartments were a hodgepodge of inexpensive or hand-me-down furniture and decor. I didn't care. But when I was pregnant, something changed. I had a maternal urge to \"nest\" and make my daughter's room feel special, warm, and welcoming. I remembered a friend showing me her daughter's bedroom. With soft lighting, furniture that made you want to stay a while, and adorable decor, the space clearly said: \"Welcome, little one. You are loved.\" Later, as I sat in front of my computer, beach-ball pregnant, clicking back and forth between open tabs, I was worried. So far, all my baby's bedroom said was: \"Come in! There's no rug, and your books are in a pile in the corner!\" The author has used trending colors twice now while decorating. Courtesy of Jillian Pretzel I got the inspiration I needed while working on an assignment Around that time, I was writing for a real estate news site, mostly covering market trends, reality TV shows, and home fixes. But every so often, I was tasked with a design story. I depended on ex", "date_str": "2026-09-21T13:50:39+00:00", "hash": "36793d0aaa2bef66", "title_fa": "فکر می کردم در طراحی داخلی ناامید هستم. انتخاب رنگ برای اتاق دخترم به من جرقه خلاقیتی داد که نیاز داشتم.", "summary_fa": "نویسنده آموخته است که تثبیت طرح اتاق در اطراف یک رنگ به ایجاد حسی بیشتر در کنار هم کمک می کند. با حسن نیت از جیلیان پرتزل من هرگز چشمی به طراحی نداشتم. فضاهای خود من یک جادویی بوده است، اما می‌خواستم اتاق دخترم احساس خاصی داشته باشد. شروع کار با انتخاب یک رنگ به انتخاب های دیگر من کمک کرد. وقتی منتظر اولین بچه ام بودم، ساعت های ناگفته ای را صرف تزئین مهد کودک او کردم. هر بار که پشت کامپیوتر می‌نشستم و مبلمان و دکور را انتخاب می‌کردم، با قدرت شروع می‌کردم: گهواره‌ای را پیدا می‌کردم که دوست داشتم، سپس سعی می‌کردم آن را با کاغذدیواری تطبیق دهم که به نظر می‌رسید همان «حالت» را دارد. همیشه از آنجا مارپیچ می شد. شاید نتوانستم قفسه‌ای پیدا کنم که دقیقاً با تخت کودک مطابقت داشته باشد، بنابراین در صدها قفسه جستجو می‌کردم تا قفسه‌ای را پیدا کنم که بیرون آمده بود. معمولا هیچ کدام این کار را نمی کردند. بنابراین به جای آن قفسه های شناور را در نظر بگیرم. من نمی دانستم کدام چوب را انتخاب کنم، دنده را عوض می کردم و به لامپ ها نگاه می کردم. اما چه نوع لامپی بهتر است؟ ادامه داشت و ادامه پیدا کرد. من همیشه ناامید و خسته و بدون هیچ پیشرفتی به پایان رسیدم. \"بیا\" من خودم را در آینه بالا می برم. \"این باید سرگرم کننده و آسان باشد.\" اما من مشکل را می دانستم: من به سادگی چشمی به طراحی نداشتم. افراد دیگر می‌توانند به یک اتاق نگاه کنند و ببینند که چه چیزی می‌تواند باشد. من به یک اتاق نگاه می کنم و می بینم: یک اتاق. نمی‌دانستم چه چیزی در کجا یا با چه چیزی بهتر است، و هیچ سرنخی نداشتم که چه بافتی برای جمع کردن آن لازم است. حتی وقتی بچه بودم،"}, {"source": "Business Insider", "title": "M.Gemi shoes review: Our honest take", "link": "https://www.businessinsider.com/guides/style/mgemi-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more From left to right, some of our favorite M.Gemi shoes are the Danza, the Una, and the Felize. Samantha Crozier/Business Insider Footwear startup M.Gemi crafts high-quality Italian leather shoes and bags without the high markup of big-name brands. From boots to work bags, each style is handmade in family-owned workshops in Italy. For our M.Gemi review, we detail our experiences with its bestselling styles from the moment we first became acquainted with the brand three years ago. Today, we consider M.Gemi one of the best brands to find ankle boots and loafers for women . Each of these picks has remarkable versatility and durability, and we've deemed them well worth the investment. You can find more about our experiences with each M.Gemi product below, along with pictures of how they've held up in real life. If you want to understand more about how we test products, see our testing methodology for clothing, shoes, and accessories . The Una Gabrielle Chase/Business Insider Key details: made from a buttery soft Italian leather, with a suede lining that prevents blisters Color options: 15, including leopard and silver Sizes: 5-12 Our fit tip: the glove-like fit will mold to your feet, so order your regular size We've tested tons of shoes for our guide to the best flats , but these are a true standout when it comes to craftsmanship. Made from smooth Italian nappa leather, it's got a comfy, glove-like fit and a no-slip sole. It's a favorite of senior associate style editor Gabrielle Chase, who wrote about them in our guide to the best ballet flats . Here's what she said: \" The Una is made with a thin, unstructured nappa leather that's extremely flexible and smooth. Inside around the heel is a layer of suede, so there's no chance of developing blisters. I don't recommend these for long walks, since they don't come with any padding or cushions. I wore mine on a stroll in the park and could feel the pavement underfoot. Nevertheless, the main appeal of the Una is how soft and delicate they feel. They're designed with a stretchy criss-cross strap to keep them in place and a soft square toe, similar to a real ballet slipper. I got mine in the shade 'Butter,' which is now discontinued.\" I got the Una in Ballerina Pink Nappa, a feminine shade that leans into ballet-inspired fashion. Samantha Crozier/Business Insider I knew I had to try the M.Gemi Una after hearing Gabrielle rave ", "date_str": "2026-09-21T13:45:29+00:00", "hash": "fb67f70d35e6bd5b", "title_fa": "بررسی کفش M.Gemi: برداشت صادقانه ما", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید از چپ به راست، برخی از کفش‌های M.Gemi مورد علاقه ما Danza، Una و Felize هستند. Samantha Crozier/Business Insider Footwear استارت‌آپ M.Gemi کفش‌ها و کیف‌های چرمی ایتالیایی باکیفیت و بدون علامت‌گذاری بالای برندهای معروف تولید می‌کند. از چکمه ها گرفته تا کیف های کار، هر سبک در کارگاه های خانوادگی در ایتالیا دست ساز است. برای بررسی M.Gemi، تجربیات خود را در مورد سبک های پرفروش آن از لحظه ای که برای اولین بار با این برند سه سال پیش آشنا شدیم، شرح می دهیم. امروزه ما M.Gemi را یکی از بهترین برندها برای یافتن نیم بوت و کفش های کتانی زنانه می دانیم. هر یک از این انتخاب ها تطبیق پذیری و دوام قابل توجهی دارند، و ما آنها را ارزش سرمایه گذاری را دارند. در زیر می‌توانید درباره تجربیات ما در مورد هر محصول M.Gemi به همراه تصاویری از نحوه عملکرد آنها در زندگی واقعی بیشتر بیابید. اگر می‌خواهید درباره نحوه آزمایش محصولات بیشتر بدانید، روش تست ما برای لباس، کفش و لوازم جانبی را ببینید. Una Gabrielle Chase/Business Insider جزئیات کلیدی: ساخته شده از چرم نرم ایتالیایی کره ای، با آستر جیر که از ایجاد تاول جلوگیری می کند گزینه های رنگ: 15، از جمله پلنگی و نقره ای اندازه: 5-12 نکته مناسب ما: تناسب دستکش مانند به پای شما قالب می گیرد، بنابراین برای تست کردن کفش های معمولی ما به بهترین سایزها سفارش دهید. وقتی صحبت از صنعتگری به میان می آید، واقعاً برجسته است. این محصول از چرم ناپا ایتالیایی صاف ساخته شده است و دارای تناسلی راحت و دستکش مانند و کفی بدون لغزش است. این مورد علاقه گابریل چیس ویراستار ارشد است که در راهنمای ما درباره بهترین آپارتمان‌های باله درباره آنها نوشته"}, {"source": "Business Insider", "title": "SocGen shares 10 cybersecurity stocks to capitalize on AI doomsday fears", "link": "https://www.businessinsider.com/cybersecurity-stock-picks-to-buy-ai-doomsday-fears-panw-crwd-2026-9", "summary": "Bloomberg/Getty Images Cybersecurity stocks have surged recently amid AI doomsday fears. Société Générale predicts continued growth in cybersecurity stocks amid strong EPS trends. The bank shared 10 stocks offering exposure to the trade. Cybersecurity stocks have rebounded sharply after AI doomsday scenarios sparked panic in markets earlier this month, and Société Générale thinks the rally can continue. The Global X Cybersecurity ETF ( BUG ) rose 10% last week, while big names in the industry like Palo Alto Networks ( PANW ) and CrowdStrike ( CRWD ) rose 10% and 15%, respectively, over the period. The gains add to strong year-to-date gains. Manish Kabra , the chief US equity strategist at Société Générale, said in a client note on Thursday that even with the recent appreciation, the trade has improving fundamentals that suggest further upside ahead. \"EPS growth has compounded at roughly 16% per annum since 2020, versus 10% in the previous decade,\" Kabra wrote, referencing earnings-per-share growth. \"Importantly, valuations remain broadly in line with historical averages despite the rally.\" He added: \"As governments and industry align on AI safety, spending is expanding beyond compute into the infrastructure needed to secure and govern AI systems.\" Société Générale has a basket of stocks that offer exposure to the cybersecurity theme. The basket has a 12-month forward PE ratio of around 25, well below its average of 30.2 going back to 2018. It also offers some diversification away from the traditional AI trade, as it has had a low, and sometimes negative, correlation with semiconductor stocks in 2026. While the bank did not make the full list of companies public, it shared with Business Insider the top 10 stocks in its cybersecurity basket. The stocks are listed below: Palo Alto Networks BI Ticker: PANW Year-to-date returns: 101.6% CrowdStrike BI Ticker: CRWD Year-to-date returns: 107.3% Cloudflare BI Ticker: NET Year-to-date returns: 67.2% Fortinet BI Ticker: FTNT Year-to-date returns: 116% Zscaler BI Ticker: ZS Year-to-date returns: -13.3% CyberArk Software BI Ticker: CYBR Year-to-date returns: -9.4% Check Point Software Technologies BI Ticker: CHKP Year-to-date returns: -27.6% Okta BI Ticker: OKTA Year-to-date returns: 120.2% Gen Digital BI Ticker: GEN Year-to-date returns: 11.4% Akamai Technologies BI Ticker: AKAM Year-to-date returns: 22.1% Read the original article on Business Insider", "date_str": "2026-09-21T13:37:18+00:00", "hash": "67ed91236f19d56b", "title_fa": "SocGen 10 سهام امنیت سایبری را به اشتراک می گذارد تا از ترس های روز رستاخیز هوش مصنوعی سرمایه گذاری کند.", "summary_fa": "Bloomberg/Getty Images سهام امنیت سایبری اخیرا در میان ترس از روز رستاخیز هوش مصنوعی افزایش یافته است. Société Générale ادامه رشد سهام امنیت سایبری را در میان روندهای EPS قوی پیش بینی می کند. این بانک 10 سهم را به اشتراک گذاشت که در معرض معامله قرار گرفتند. پس از اینکه سناریوهای روز رستاخیز هوش مصنوعی در اوایل ماه جاری باعث ایجاد وحشت در بازارها شد، سهام امنیت سایبری به شدت بازگشته است و Société Générale فکر می کند که این افزایش می تواند ادامه یابد. Global X Cybersecurity ETF (BUG) هفته گذشته 10 درصد افزایش یافت، در حالی که نام های بزرگ صنعت مانند Palo Alto Networks (PANW) و CrowdStrike (CRWD) به ترتیب 10 و 15 درصد در این دوره رشد کردند. سود به سودهای قوی از سال تا به امروز اضافه می شود. مانیش کابرا، استراتژیست ارشد سهام ایالات متحده در Société Générale، در یادداشت مشتری در روز پنجشنبه گفت که حتی با وجود افزایش اخیر، تجارت دارای عوامل بنیادی بهبود یافته است که نشان دهنده صعود بیشتر است. کابرا با اشاره به رشد سود هر سهم نوشت: «رشد EPS از سال 2020 تقریباً 16 درصد در سال در مقابل 10 درصد در دهه قبل ترکیب شده است. نکته مهم این است که ارزش‌گذاری‌ها به‌رغم افزایش، به طور کلی با میانگین‌های تاریخی مطابقت دارند. وی افزود: از آنجایی که دولت‌ها و صنعت بر روی ایمنی هوش مصنوعی همسو می‌شوند، هزینه‌ها فراتر از محاسبات به زیرساخت‌های مورد نیاز برای ایمن سازی و اداره سیستم‌های هوش مصنوعی گسترش می‌یابد. Société Générale سبدی از سهام دارد که در معرض موضوع امنیت سایبری قرار می گیرد. این سبد دارای نسبت PE 12 ماهه پیش رو در حدود 25 است که بسیار کمتر از میانگین 30.2 آن در سال 2018 است. همچنین مقداری تنوع را از تجارت سنتی هوش مصنوعی ارائه می دهد،"}, {"source": "Business Insider", "title": "I've been to several 'dupes' for Switzerland around the US, and none beat the Alpine feel of Washington's North Cascades", "link": "https://www.businessinsider.com/visiting-american-mountain-areas-feel-like-europe-best-washington-2026-9", "summary": "North Cascades National Park has some seriously incredible views that remind me of Switzerland. Amanda Adler Switzerland is the most scenic place I've been , but it's also one of the most expensive countries. As an American seeking a less pricey alternative, I've explored several Alpine spots in the US. Colorado and Montana charmed me endlessly, but my favorite Switzerland dupe is in Washington. I've been to Switzerland several times, and it always beckons me back. The iconic Alpine landscape is unmatched in beauty and, unfortunately, also in price. It's one of the most expensive countries in the world, and traveling there costs a pretty penny. High prices for flights, accommodations, meals, and entertainment mean I can't afford to visit Switzerland often from the US. So, in a quest to find an equally charming — but less bank-breaking — alternative, I have taken trips to several destinations that people say feel like America's version of Switzerland . Each offered breathtaking scenery and impressive mountain views, but one stood out as the best destination for an Alpine-style getaway. Ouray and Telluride are lovely, but neither felt like a perfect Switzerland dupe Ouray has some epic mountain views. Amanda Adler Ouray, Colorado, situated in the San Juan Mountains, is often referred to as the \" Switzerland of America .\" With an elevation of about 7,800 feet above sea level, this town in southwestern Colorado does offer some pretty epic mountain vistas. I especially enjoyed climbing to Box Canyon Falls Park, which delighted me with views of waterfalls and a downtown area surrounded by soaring peaks. It's obvious how this town got its Alpine moniker, but the surrounding landscape felt significantly drier than the lush greenery found throughout Switzerland. It makes sense considering Colorado's high elevation contributes to its dry climate. Located just an hour from Ouray is Telluride, Colorado, which some also describe as having a Swiss vibe. Telluride actually felt more European to me than Ouray. Telluride also offered a taste of Alpine life, but it wasn t my top pick. Amanda Adler I attribute that to the town's picturesque Victorian-era buildings, stunning wildflowers, and gondola system offering scenic rides that remind me of traveling into the Alps. The mountains lacked snow-covered peaks during my summertime visit, but I'd consider returning in the winter. The 'Switzerland of North America' in Montana was lovely, but I can't see myself visiting often Man", "date_str": "2026-09-21T13:26:46+00:00", "hash": "15117c98295f1960", "title_fa": "من در چندین «دوپ» برای سوئیس در سراسر ایالات متحده بوده‌ام، و هیچ‌کدام شبیه به حس آلپ آبشارهای شمالی واشنگتن نبود.", "summary_fa": "پارک ملی North Cascades دارای مناظر بسیار باورنکردنی است که مرا به یاد سوئیس می اندازد. آماندا آدلر سوئیس دیدنی‌ترین جایی است که من رفته‌ام، اما یکی از گران‌ترین کشورها نیز هست. به عنوان یک آمریکایی که به دنبال جایگزینی ارزان تر است، چندین نقطه آلپ را در ایالات متحده کاوش کرده ام. کلرادو و مونتانا بی نهایت مرا مجذوب خود کردند، اما فریبنده سوئیسی مورد علاقه من در واشنگتن است. من چندین بار به سوئیس رفته‌ام و همیشه به من اشاره می‌کند. مناظر نمادین آلپ از نظر زیبایی و متأسفانه از نظر قیمت نیز بی نظیر است. این یکی از گران ترین کشورهای جهان است و سفر به آنجا یک پنی بسیار هزینه دارد. قیمت‌های بالا برای پروازها، اقامتگاه‌ها، وعده‌های غذایی و سرگرمی به این معنی است که نمی‌توانم اغلب از ایالات متحده به سوئیس سفر کنم. بنابراین، در تلاش برای یافتن یک جایگزین به همان اندازه جذاب - اما کمتر بانک شکن - به چندین مقصد سفر کرده ام که مردم می گویند شبیه نسخه آمریکایی سوئیس است. هر کدام از آنها مناظر خیره کننده و مناظر کوهستانی چشمگیر را ارائه می کردند، اما یکی از آنها به عنوان بهترین مقصد برای یک گریز به سبک آلپاین برجسته بود. اوری و تلوراید دوست‌داشتنی هستند، اما هیچ‌کدام از آنها شبیه یک فریب سوئیس عالی نیستند. آماندا آدلر اوری، کلرادو، واقع در کوه های سان خوان، اغلب به عنوان \"سوئیس آمریکا\" شناخته می شود. این شهر در جنوب غربی کلرادو با ارتفاع حدود 7800 فوت از سطح دریا، مناظر کوهستانی حماسی زیبایی را ارائه می دهد. من به خصوص از صعود به پارک باکس کانیون فالز لذت بردم، که با چشم اندازی از آبشارها و منطقه ای در مرکز شهر که توسط قله های سر به فلک کشیده احاطه شده بود، خوشحالم کرد. واضح است که این شهر چگونه نام"}, {"source": "Business Insider", "title": "I'm a personal stylist for corporate clients. There are 5 mistakes I always tell them to avoid when dressing for work.", "link": "https://www.businessinsider.com/biggest-mistakes-dressing-for-work-personal-stylist-tips-corporate-job-2026-9", "summary": "As a personal stylist, I ve noticed several mistakes corporate professionals make when getting dressed for work. Jason Jean/WWD via Getty Images; Alyssa Powell/BI I'm a personal stylist who helps corporate clients build a polished, authentic office wardrobe . To spice up an all-black outfit, I recommend professionals add a textured heel or loafer. Instead of avoiding accessories, adding a statement belt or stud earrings can elevate a simple look. As a personal stylist for corporate clients, I believe that picking out an outfit shouldn't be the hardest part of someone's morning — it should be the easiest. After four years of helping professionals build wardrobes that suit their lifestyles and boost their confidence in the office, I've learned what works — and what doesn't — when dressing for the workplace. These are five of the most common mistakes I always tell clients to avoid. Relying on an all-black outfit eliminates any personality. Ranta Images/iStock One of the biggest mistakes I see people make is what I call the \"all-black blob.\" Because wearing black feels easy, professional, and safe, people tend to use this same formula every day: a black ballet flat , black straight-leg trousers, a black tee, and a black blazer. There's nothing necessarily wrong with that attire, but when everything is the same, I think it starts to eliminate any sense of personality or interest in the outfit. Instead, I recommend simply adding one thing to give the look some dimension, like mixing cotton with wool, cashmere, leather, or suede. That way, even though everything is black, the outfit doesn't feel flat. Another way to elevate an all-black outfit is to incorporate an interesting pair of shoes. I love snakeskin as a way to add a little pattern to an otherwise simple ensemble. I also recommend trying a loafer in a deep brown or navy, or grabbing a suede pair to add even more texture. The same goes for shirts and ties. I wouldn't necessarily wear a black button-down with a black blazer . Instead, I recommend breaking it up with a different color, texture, or accessory. Wearing a suit is not the only way to look professional. Astrakan Images/Getty Images Of course, if someone's job or corporate event requires a suit, then they should absolutely wear one. But in any other case, looking professional doesn't always mean reaching for a blazer. Instead, I recommend that women look for a lady jacket — a collarless outerwear that hits nicely at the waist — which gives a more r", "date_str": "2026-09-21T12:56:01+00:00", "hash": "1ec5f2f202ba062e", "title_fa": "من یک آرایشگر شخصی برای مشتریان شرکتی هستم. 5 اشتباه وجود دارد که همیشه به آنها می گویم هنگام لباس پوشیدن برای محل کار از آنها اجتناب کنند.", "summary_fa": "به عنوان یک آرایشگر شخصی، متوجه اشتباهات متعددی شده‌ام که متخصصان شرکت‌ها هنگام لباس پوشیدن برای محل کار مرتکب می‌شوند. جیسون ژان/WWD از طریق گتی ایماژ. Alyssa Powell/BI من یک آرایشگر شخصی هستم که به مشتریان شرکتی کمک می کند تا یک کمد اداری صیقلی و معتبر بسازند. برای ادویه‌تر کردن یک لباس کاملا مشکی، به حرفه‌ای‌ها توصیه می‌کنم پاشنه‌دار بافت دار یا کفش راحتی اضافه کنند. به جای پرهیز از لوازم جانبی، اضافه کردن یک کمربند یا گوشواره میخی می تواند ظاهری ساده را افزایش دهد. به عنوان یک آرایشگر شخصی برای مشتریان شرکتی، من معتقدم که انتخاب یک لباس نباید سخت ترین قسمت صبح یک فرد باشد - باید ساده ترین باشد. پس از چهار سال کمک به حرفه‌ای‌ها برای ساختن کمد لباس‌هایی که متناسب با سبک زندگی‌شان باشد و اعتماد به‌نفس آن‌ها را در دفتر افزایش دهد، یاد گرفتم چه چیزی هنگام لباس پوشیدن برای محل کار کار می‌کند - و چه چیزی خوب نیست. اینها پنج مورد از رایج ترین اشتباهاتی است که همیشه به مشتریان می گویم که از آنها اجتناب کنند. تکیه بر یک لباس تمام مشکی هر شخصیتی را از بین می برد. Ranta Images/iStock یکی از بزرگترین اشتباهاتی که من می بینم مردم مرتکب می شوند، چیزی است که من آن را \"لکه تمام سیاه\" می نامم. از آنجایی که پوشیدن مشکی احساس آسان، حرفه‌ای و ایمن می‌کند، مردم تمایل دارند هر روز از همین فرمول استفاده کنند: یک شلوار باله مشکی، یک شلوار صاف مشکی، یک سه راهی سیاه و یک کت مشکی. لزوماً هیچ ایرادی در آن لباس وجود ندارد، اما وقتی همه چیز یکسان است، فکر می کنم شروع به از بین بردن هرگونه احساس شخصیت یا علاقه به لباس می کند. به جای آن، توصیه می‌کنم به سادگی یک چیز اضافه کنید تا به ظاهر بُعدی ببخشد، مانند"}, {"source": "Business Insider", "title": "I attempted Olive Garden's Never-Ending Pasta Bowl. It was a reminder of why chains can't quit bottomless deals.", "link": "https://www.businessinsider.com/olive-gardens-never-ending-pasta-deal-review-photos-2026-9", "summary": "I tried Olive Garden s endless pasta deal. I could only get through two bowls before I wanted to tap out, but it was incredible value. Erin McDowell/Business Insider Olive Garden is back with its endless pasta promotion for those brave enough to try. I visited the chain and ate my way through three bowls of pasta, plus salad and breadsticks. It's clear to me why casual-dining chains across the industry love bottomless deals. Why stop at seconds when you can go back for thirds, fourths — even fifths? I recently visited Olive Garden's flagship Times Square restaurant for my first-ever meal at the chain . While I couldn't wait to try its iconic breadsticks, there was one specific deal I was gunning for: Olive Garden's Never-Ending Pasta Bowl, which starts at $14.99, depending on location. The limited-time deal, first launched in 1995, is running nationwide from August 31 through November 22, 2026. Stomach empty and heart full, I ate my way through the promo and came away thinking bottomless deals are great for both chains and customers, if they're done right. (Looking at you, Red Lobster. ) Here's what it was like to attempt Olive Garden's Never-Ending Pasta Bowl promotion, why it makes sense for the chain, and if you should try it, too. I arrived at Olive Garden s Times Square restaurant hungry and ready to gorge on pasta. Erin McDowell/Business Insider The restaurant itself was a little difficult to spot amid the traffic, the hot-dog cart outside, and the massive billboards. The restaurant has stood at 2 Times Square since 1994 — it predates much of the tourist-district version of Times Square that New Yorkers and visitors recognize today. The restaurant occupies three floors and roughly 20,000 square feet, making it the chain's largest location and more of a high-volume flagship than a typical suburban Olive Garden. It's a tricky time for massive kamikaze drones , known as \"Gerans,\" annually. The plans underscore Russia's commitment to weaponized drone technology to power its war machine, which it is increasingly turning against the rest of Europe . The Alabuga-Volokno factory and its parent company, Rosatom's advanced materials division UMATEX, are sanctioned by the U.K., U.S. and multiple other Western governments. The factory is a key node in Moscow's military-industrial supply chain and is the same one that received a disguised shipment of 46 tons of carbon-fiber chemicals from a Chinese-state corporation earlier this year, according to internal Rosatom shipping and customs documents reported earlier this month by POLITICO. Rosatom previously said the firm and its subsidiaries \"operate in full compliance\" with applicable laws and regulations. The Chinese embassy in Washington said in a statement that it was unaware of the Russian drone production expansion plans and \"strictly controls exports of dual use items in accordance with law.\" Business, design and structural plans gathered from Russian sources by the Ukrainian Security and Cooperation", "date_str": "2026-09-21T12:44:33+00:00", "hash": "c2d178785db544e6", "title_fa": "طرح مخفی روسیه برای سوپرشارژ کردن تولید پهپاد کامیکازه", "summary_fa": "تصاویر ماهواره ای گرفته شده در ماه مه (L) و جولای (R) نشان می دهد که زمین مجاور کارخانه فیبر کربن آلابوگا-ولوکنو Rosatom در منطقه ویژه اقتصادی آلابوگا تاتارستان در حال پاکسازی برای پروژه توسعه است. اسناد مرکز امنیت و همکاری اوکراین نشان می دهد که روسیه قصد دارد تولید فیبر کربن را برای پهپادهای نظامی گسترش دهد. یکی از کارشناسان تخمین می زند که افزایش تولید به 28000 پهپاد تسلیحاتی اضافی در سال تبدیل می شود. POLITICO گزارش می دهد که این توسعه با هدف کاهش اتکای روسیه به واردات چین انجام می شود. بر اساس طرح‌هایی که یک شرکت دولتی روسیه به دست پولتیکو رسیده است، مسکو در حال توسعه ظرفیت خود برای ساخت ده‌ها هزار پهپاد قاتل است که در حملات به شهرهای اوکراین مستقر می‌کند. توسعه کارخانه آلابوگا-ولوکنو شرکت دولتی Rosatom در منطقه تاتارستان روسیه به مسکو اجازه می‌دهد تا سال 2029 سالانه 500 تن فیبر کربن درجه‌بندی نظامی نظامی بسازد. مواد سبک وزن قوی، کلید ساخت بدنه هواپیمای بدون سرنشین است. بر اساس یک برآورد کارشناسان، افزایش تولید به معنای افزایش تولید 28000 پهپاد تسلیحاتی اضافی در سال خواهد بود - افزایش 78 درصدی در تولید سلاح هایی مانند آنچه که در این ماه به قطار مسافربری در مرز لهستان حمله کرد و سایرین که منجر به کشته شدن تعداد زیادی غیرنظامی اوکراینی شد. اوکراین تخمین می زند که روسیه در حال حاضر می تواند سالانه بیش از 36000 پهپاد کامیکازه معروف به \"گرانس\" تولید کند. این طرح ها بر تعهد روسیه به فناوری پهپادهای تسلیحاتی برای نیرو بخشیدن به ماشین جنگی خود تأکید می کند که به طور فزاینده ای علیه بقیه اروپا می چرخد. کارخانه آلابوگا-ولوکنو و شرکت مادر آن، بخش مواد پیشرفته Rosatom UMATEX، توسط بریتانیا، ایالات متحده و چندین دولت غربی دیگر تحریم شده‌اند. بر اساس اسناد حمل و نقل و"}, {"source": "Business Insider", "title": "Grand staircases, state-shaped pools, and bowling alleys in the basement: See what the governor's mansion looks like in every state", "link": "https://www.businessinsider.com/governors-mansions-in-the-us-photos-2019-8", "summary": "The Kentucky governor s mansion. traveler1116/Getty Images Forty-five of the 50 states have official mansions, which governors can live in rent-free. Some governors' mansions are open to the public for tours. Arizona, Idaho, Massachusetts, Rhode Island, and Vermont don't have designated mansions. After a long day serving constituents, governors return home to sprawling, historic buildings. They're welcomed by 20-foot entranceways; their heels ring out on marble floors. If it's been a particularly grim day, they can wash it away with a swim in their state-shaped pool. These official houses, found in 45 out of the 50 states, are meant to evoke the pride of their area. Arizona, Idaho, Massachusetts, Rhode Island , and Vermont are the only states without a designated mansion. Life in a governor's mansion is more public than a normal home. Often, visitors can take tours, and security can be heavy. Careful household budgeting is necessary to avoid criticism from the media or constituents. Some governors have chastised reporters for calling it a mansion, telling them to call it a \"residence\" instead. With the midterms coming up in November, governors' mansions across the US could welcome new residents if incumbents are unseated in the 2026 elections. Here's what the governors' mansions look like in every state that has one. The Alabama governor s mansion is in Montgomery. The governor s mansion in Montgomery, Alabama. Carol M. Highsmith/Buyenlarge/Getty Images. Alabama's 117-year-old state mansion, with a grand staircase and four Corinthian columns, has been the residence of the governor since 1951, according to the Office of the Alabama Governor . The mansion spans two floors and 8,500 square feet. In the 1970s, a state-shaped swimming pool, a guest house, and a water feature were added. The Alaska governor s mansion is in Juneau. The governor s mansion in Juneau, Alaska. John Elk/Getty Images The mansion was built for $40,000 in 1912. To deal with the cold, the 12,900-square-foot house has eight fireplaces for its 26 rooms. Above a winding staircase hangs a large painting of Russian emperor Peter the Great, who was responsible for Russia's exploration of Alaska. The painting has BB-gun bullets near Peter's eyes, and there has been a decadeslong controversy over who pulled the trigger, local news channel KTUU reported. Since 1913, the mansion has opened to the public once a year for a tour at Christmas, according to Alaska's Office of the Governor . Arizona used", "date_str": "2026-09-21T12:02:19+00:00", "hash": "9306f302f80a4796", "title_fa": "راه پله های بزرگ، استخرهای ایالتی، و بولینگ در زیرزمین: ببینید عمارت فرماندار در هر ایالت چگونه است", "summary_fa": "عمارت فرماندار کنتاکی traveler1116/Getty Images چهل و پنج ایالت از 50 ایالت دارای عمارت های رسمی هستند که فرمانداران می توانند بدون اجاره در آنها زندگی کنند. برخی از عمارت های فرمانداران برای بازدید عموم باز است. آریزونا، آیداهو، ماساچوست، رود آیلند و ورمونت عمارت مشخصی ندارند. پس از یک روز طولانی خدمت به مردم، فرمانداران به خانه‌های خود باز می‌گردند و ساختمان‌های تاریخی و وسیعی دارند. ورودی های 20 فوتی از آنها استقبال می کنند. پاشنه های آنها روی کف مرمر حلقه می زند. اگر روز بسیار بدی بوده است، می‌توانند آن را با شنا در استخری به شکل حالت خود بشویید. این خانه‌های رسمی که در 45 ایالت از 50 ایالت یافت شده‌اند، برای تداعی غرور منطقه خود هستند. آریزونا، آیداهو، ماساچوست، رود آیلند و ورمونت تنها ایالت‌هایی هستند که عمارت مشخصی ندارند. زندگی در عمارت فرماندار بیشتر از یک خانه معمولی عمومی است. اغلب، بازدیدکنندگان می‌توانند از تور استفاده کنند و امنیت می‌تواند سنگین باشد. بودجه بندی دقیق خانوار برای جلوگیری از انتقاد رسانه ها یا موسسان ضروری است. برخی از فرمانداران خبرنگاران را به خاطر عمارت نامیدن آن تنبیه کرده و به آنها گفته اند که در عوض آن را «مسکون» بنامید. با نزدیک شدن به انتخابات میان‌دوره‌ای در نوامبر، عمارت‌های فرمانداران در سراسر ایالات متحده می‌توانند پذیرای ساکنان جدید باشند، در صورتی که مدیران فعلی در انتخابات 2026 برکنار شوند. در اینجا عمارت فرمانداران در هر ایالتی که چنین است، به نظر می رسد. عمارت فرماندار آلاباما در مونتگومری است. عمارت فرماندار در مونتگومری، آلاباما. Carol M. Highsmith/Buyenlarge/Getty Images. به گفته دفتر فرماندار آلاباما، عمارت ایالتی 117 ساله آلاباما، با یک پلکان بزرگ و چهار ستون کورینتی، از سال 1951 محل سکونت فرماندار بوده است. این عمارت دو طبقه و 8500 فوت مربع وسعت دارد. در دهه 1970، یک استخر شنای دولتی، یک مهمانخانه و"}, {"source": "Business Insider", "title": "The best patio heaters of 2026", "link": "https://www.businessinsider.com/guides/home/best-patio-heater", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The best patio heaters let you enjoy the outdoors all year long. They re sturdy, durable, and effective. Camryn Rabideau/Business Insider Extend patio season into the fall and even winter with the best patio heate
