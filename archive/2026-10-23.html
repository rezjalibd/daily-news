eople a lot of freedom to be able to feel heard.\" A leader's presence is especially important during crises, said Bill George, former chairman and CEO of Medtronic, a medical-technology company. Being together lets executives quickly assess what has happened, gauge employees' reactions, and decide on a course of action. \"We've got to really feel what's going on emotionally, and we ", "date_str": "2026-10-22T21:30:32+00:00", "hash": "072e787236fcacc5", "title_fa": "قرارداد بزرگ متا برای زاکربرگ ثابت می کند که مدیران از کار IRL مستثنی نیستند", "summary_fa": "هیئت مدیره متا از مدیرعاملش، مارک زاکربرگ، می‌خواهد که خود را حفظ کند - و محلی بماند. کنت نیشیمورا/ خبرگزاری فرانسه از طریق گتی ایماژ متا به مدیرعامل مارک زاکربرگ قرارداد سهام 20 میلیارد دلاری پیشنهاد می کند تا او را نزدیک به دفتر مرکزی خود نگه دارد. این حرکت حاکی از یک باور مشترک است که بهترین کار زمانی اتفاق می افتد که همه شخصاً با هم باشند. تحقیقات نشان می‌دهد که شرکت‌هایی که مدیران اجرایی دوردست دارند بهای آن فاصله را می‌پردازند. متا بیش از کارمندان درجه یک در دفتر می خواهد. مارک زاکربرگ مدیر عامل شرکت را نیز در آنجا می خواهد - حتی اگر قیمت بالایی داشته باشد. هیئت مدیره غول فناوری روز چهارشنبه در بایگانی اوراق بهادار اعلام کرد که طبقه جدیدی از سهام بدون حق رای ایجاد خواهد کرد تا زاکربرگ را تحت کنترل خود نگه دارد و به او انگیزه مالی برای ادامه زندگی در نزدیکی دفتر مرکزی خود بدهد. حضور او در این دفتر را برای موفقیت آینده آن \"بسیار مهم\" توصیف کرد. متا از سال 2023 کارمندان خود را ملزم به حضور حداقل سه روز در هفته کرده است. زاکربرگ قبلاً به هیئت مدیره گفته بود که در پاسخ به پیشنهاد مالیات بر میلیاردرهای کالیفرنیا در نظر دارد حرکت کند. در این پرونده آمده است که این معامله سهام به مدیرعامل 20 میلیارد دلار \"نقدینگی فوری\" می دهد تا مالیات را با فروش سهام بدون از دست دادن کنترل متا پوشش دهد. این ترتیب در متا، جایی که زاکربرگ در زمینه هوش مصنوعی شرکت رهبری می‌کند، وزن خاصی دارد. این همچنین از یک باور مشترک صحبت می کند که باعث بازگشت به دفتر شده است: بهترین کار زمانی اتفاق می افتد که افراد - از جمله رهبران ارشد - از نظر فیزیکی با هم باشند. محل ماندن کول روبین، یکی از", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "بورس و طلا"], "datetime_fa": "۱ آبان • ۰۱:۰۰"}, {"source": "Business Insider", "title": "Here's how to protect your information from the PHP flaw, according to cybersecurity pros", "link": "https://www.businessinsider.com/how-to-protect-information-php-issue-hackers-cybersecurity-2026-10", "summary": "Cybersecurity researchers say that anyone s personal information is at risk after OpenAI disclosed a vulnerability in a popular software language. Richard Drury/Getty Images Cybersecurity researchers say the PHP vulnerability has repercussions for normal people, too. Even if you don't own a website, hackers could use the vulnerability to steal your information. One quick fix: diversify your passwords. If you're still using the same password for everything, it might finally be time to get on that. While the major cybersecurity vulnerabilities that OpenAI agents helped expose on Wednesday primarily impact the owners and operators of websites, it could also give hackers the opportunity to hijack your personal information, researchers said. \"Be extra careful visiting ANY web site in the next few days,\" Changpeng Zhao, the cofounder of cryptocurrency platform Binance, said on X. OpenAI said on Wednesday that researchers using its AI models uncovered two \"critical\" flaws in the infrastructure of PHP, a popular open-source programming language used on about 70% of the world's websites. Because digital commerce websites, for instance, can store personal shopper information in PHP systems, that information would be accessible to a bad actor exploiting the web provider's system if that provider hasn't updated it. The National Security Administration warned that hackers using one of the PHP exploits could \"steal sensitive data, disrupt services, or move deeper into a network.\" \"Even if you yourself are not building software and that's not where your core business is, a lot of your life does depend on companies that depend on those systems,\" Madeline Lawrence, cofounder of Aikido Security, an application security platform, told Business Insider on Thursday. \"And they could be deeply, deeply vulnerable,\" she added. She said that one day after the disclosure, cybersecurity platform Cloudflare reported millions of attempts to exploit the vulnerability. If you do own a website, PHP has released updates it says will help shield websites from hackers. Instructions for applying those updates are available on PHP's homepage. For everyone else, here are a few tips cybersecurity researchers say you can use to protect your info. Don't reuse passwords; use a password manager. Check for security advisories from your bank. Use two-factor authentication on your devices and accounts — especially for email, banking, and your password manager. If your data has been breached, expect mor", "date_str": "2026-10-22T21:13:14+00:00", "hash": "84fe7b3be5f76886", "title_fa": "به گفته متخصصان امنیت سایبری، در اینجا نحوه محافظت از اطلاعات خود در برابر نقص PHP آورده شده است", "summary_fa": "محققان امنیت سایبری می گویند که پس از افشای OpenAI یک آسیب پذیری در یک زبان نرم افزاری محبوب، اطلاعات شخصی هر کسی در خطر است. محققان امنیت سایبری ریچارد دروری/گتی ایمیجز می‌گویند آسیب‌پذیری PHP برای افراد عادی نیز عواقبی دارد. حتی اگر صاحب وب سایتی نباشید، هکرها می توانند از این آسیب پذیری برای سرقت اطلاعات شما استفاده کنند. یک راه حل سریع: رمزهای عبور خود را متنوع کنید. اگر هنوز از رمز عبور یکسانی برای همه چیز استفاده می کنید، ممکن است بالاخره زمان آن رسیده است که از آن استفاده کنید. به گفته محققان، در حالی که آسیب‌پذیری‌های اصلی امنیت سایبری که عوامل OpenAI در روز چهارشنبه به افشای آن‌ها کمک کردند، در درجه اول بر صاحبان و اپراتورهای وب‌سایت‌ها تأثیر می‌گذارد، اما می‌تواند به هکرها این فرصت را بدهد که اطلاعات شخصی شما را ربودند. چانگ پنگ ژائو، یکی از بنیانگذاران پلتفرم ارزهای دیجیتال بایننس، در X می گوید: «در چند روز آینده در بازدید از هر وب سایتی بسیار مراقب باشید. OpenAI روز چهارشنبه گفت که محققانی که از مدل‌های هوش مصنوعی آن استفاده می‌کنند، دو نقص «بسیار مهم» را در زیرساخت PHP، یک زبان برنامه‌نویسی منبع باز محبوب که در حدود ۷۰ درصد از وب‌سایت‌های جهان استفاده می‌شود، کشف کردند. از آنجایی که وب‌سایت‌های تجارت دیجیتال، به عنوان مثال، می‌توانند اطلاعات خریداران شخصی را در سیستم‌های PHP ذخیره کنند، این اطلاعات برای بازیگر بدی که از سیستم ارائه‌دهنده وب سوء استفاده می‌کند، در صورتی که آن ارائه‌دهنده آن را به‌روزرسانی نکرده باشد، قابل دسترسی خواهد بود. اداره امنیت ملی هشدار داد که هکرهایی که از یکی از اکسپلویت‌های PHP استفاده می‌کنند، می‌توانند «داده‌های حساس را بدزدند، سرویس‌ها را مختل کنند یا به عمق شبکه بروند». مادلین لارنس، یکی از بنیانگذاران Aikido Security، یک پلتفرم امنیتی اپلیکیشن، روز پنجشنبه به Business Insider گفت: «حتی اگر", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "امنیت سایبری", "عامل‌های هوشمند"], "datetime_fa": "۱ آبان • ۰۰:۴۳"}, {"source": "Business Insider", "title": "Sony Bravia 7 II deal: My favorite RGB LED TV is up to $800 off right now", "link": "https://www.businessinsider.com/guides/tech/sony-bravia-7-ii-true-rgb-tv-deal-2026-10-22", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The Bravia 7 II is one of the best showcases for RGB LED tech, and it s on sale right now. Steven Cohen/Business Insider RGB LED is the latest innovation in TV tech, allowing screens to produce a wider, purer range of colors than ever before. But not all RGB LED TVs are created equal. I've tested top models from brands like Samsung and Hisense, but the Sony Bravia 7 II is my favorite RGB LED TV so far. It shows off all the benefits that make RGB tech so cool while coming in at a surprisingly reasonable price. And right now, it's an even better deal at up to $800 off . What makes the Bravia 7 II so special is its use of Sony's new True RGB backlight. This system uses separate red, green, and blue diodes to produce a wider range of colors th at. You'll also need to remove the insulation before cleaning the house, which requires an included specialized tool", "date_str": "2026-10-22T21:07:01+00:00", "hash": "7c39b341187ebc73", "title_fa": "خانه گربه مورد علاقه ما در فضای باز برای چندین گربه 30٪ تخفیف دارد", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید خانه گربه در فضای باز Ecoflex New Age Pet دارای اندازه مناسبی است تا دو تا سه گربه را در خود جای دهد. Janelle Leeson/Business Insider یک خانه گربه در فضای باز می تواند گربه هایی را که در خارج از خانه زندگی می کنند در زمستان های طولانی و سرد همراه با باد، برف و یخ امن و راحت نگه دارد. ما خودمان 11 را آزمایش کردیم تا بهترین ها را پیدا کنیم، و انتخاب برتر ما برای چندین گربه اکنون در فروش است. می‌توانید 30 درصد در خانه گربه‌های فضای باز Ecoflex جدید عصر پت صرفه‌جویی کنید و قبل از اینکه دما به زیر صفر برسد، آن را راه‌اندازی کنید. این خانه با کمترین قیمت از ماه آگوست به بعد از 85 دلار به 60 دلار رسیده است. همچنین اگر کل خرید شما از اقلام واجد شرایط 100 دلار یا بیشتر باشد، ممکن است بتوانید یک کارت 25 دلاری eGift دریافت کنید. گزارش‌های عمیق ما در مورد خانه‌های گربه در فضای باز به ما کمک کرد تا فهرست پناهگاه‌هایمان را با استفاده از معیارهای سخت‌گیرانه محدود کنیم. ضروری است که خانه‌ها دارای چندین مشخصات باشند تا به گربه‌های محلی که اغلب به آنها گربه‌های وحشی گفته می‌شود پناهگاهی امن ارائه دهند. خانه عصر جدید همه جعبه ها را برای مدلی که از دو تا سه گربه بالغ یا یک گربه مادر و بچه گربه هایش پشتیبانی می کند، علامت زد. چرا ما خانه گربه در فضای باز Ecoflex New Age Pet را دوست داریم شما می توانید با برداشتن سقف عایق کاری اضافه کنید. Janelle Leeson/Business Insider این برای دو تا سه گربه به اندازه کافی بزرگ است. گربه های جامعه تمایل دارند نزدیک بمانند. با این حال، آنها", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۰۰:۳۷"}, {"source": "Business Insider", "title": "I made a rookie flight-booking mistake that cost me $3,000. These are the 4 things I'll do differently next time.", "link": "https://www.businessinsider.com/lessons-learned-from-flight-booking-mistake-costs-advice-2026-10", "summary": "One flight-booking mistake cost my family nearly $3,000 and a day of travel. Natalie Becerra I booked two separate flight itineraries on different airlines for a family trip to Ireland. I realized this was a mistake after the first airline diverted, and the second left without us. The fix cost my family nearly $3,000 in new tickets and a day's worth of touring. I'm a veteran traveler who has booked more long-haul flights than I can count. But earlier this year, I made a very expensive rookie mistake. While planning a trip, I came across a deal I couldn't pass up: a $317 one-way flight on Icelandair to Ireland with a multi-day layover in Reykjavik. It was essentially a way to take a trip within a trip without paying extra airfare. The catch? The flight departed from New York, not our home airport in Florida. I'd be in New York a few days early, but my family would need to fly up to meet me. Booking separate itineraries was far from ideal, but I figured a five-hour buffer would be enough. It wasn't. A storm in New York canceled my family's JetBlue flight from Florida, and their replacement flight then couldn't land and was diverted to Virginia. Their Icelandair flight to Europe was automatically canceled after they were marked as no-shows. On the night we were supposed to fly together to Iceland , my family was stuck states away, and I was scrambling to find a solution. With my family's original flight gone, we had to spend nearly $3,000 to get them back on track and navigate the complicated credit card trip insurance process. Here are 4 lessons I learned the hard way. Booking separate itineraries comes with a pricey risk I didn t account for enough time for flight disruptions. Joe Raedle/Getty Images Arriving in the city of your next flight at least 24 hours before may feel a bit extreme, but it's the minimum safety net you need. Being already in the right location for your flight can be a huge weight off your shoulders. It also allows sufficient time for rebooking should something go wrong with your flight. My last-minute whim to visit a few friends upstate turned out to be key. Those extra two nights in New York meant I was able to make the flight to Iceland. If I had booked my family of three on a flight the day before our long-haul flight, they would have made it too. My family made it to New York the next morning and ended up taking a replacement flight to Iceland that evening, getting in about 24 hours later than originally planned. I bought two basic", "date_str": "2026-10-22T21:01:09+00:00", "hash": "d57aaa9f69b02414", "title_fa": "من یک اشتباه در رزرو پرواز مبتدی انجام دادم که برایم 3000 دلار تمام شد. این 4 کاری است که دفعه بعد متفاوت انجام خواهم داد.", "summary_fa": "یک اشتباه رزرو پرواز برای خانواده ام نزدیک به 3000 دلار و یک روز سفر هزینه داشت. Natalie Becerra I برای یک سفر خانوادگی به ایرلند، دو برنامه پرواز جداگانه در خطوط هوایی مختلف رزرو کرد. من متوجه شدم که این یک اشتباه بود بعد از اینکه اولین خط هوایی تغییر مسیر داد و دومی بدون ما رفت. این تعمیر برای خانواده من تقریباً 3000 دلار بلیط جدید و یک روز تور هزینه داشت. من یک مسافر کهنه کار هستم که بیش از آن چیزی که بتوانم حساب کنم، پروازهای طولانی رزرو کرده ام. اما اوایل امسال، یک اشتباه بسیار گران قیمت مبتدی مرتکب شدم. در حین برنامه ریزی برای سفر، به معامله ای برخورد کردم که نمی توانستم از آن بگذرم: پرواز یک طرفه 317 دلاری ایسلندایر به ایرلند با توقف چند روزه در ریکیاویک. این در اصل راهی برای سفر در یک سفر بدون پرداخت هزینه اضافی بود. گرفتن؟ پرواز از نیویورک حرکت کرد، نه فرودگاه خانه ما در فلوریدا. من چند روز زودتر به نیویورک می‌رفتم، اما خانواده‌ام باید برای ملاقات با من پرواز کنند. رزرو برنامه های سفر جداگانه دور از ایده آل بود، اما من فکر کردم یک بافر پنج ساعته کافی است. این نبود. طوفان در نیویورک پرواز جت بلو خانواده من از فلوریدا را لغو کرد و پرواز جایگزین آنها نتوانست فرود بیاید و به ویرجینیا منحرف شد. پرواز Icelandair آن‌ها به اروپا پس از علامت‌گذاری به‌عنوان منع‌شده، به‌طور خودکار لغو شد. شبی که قرار بود با هم به ایسلند پرواز کنیم، خانواده‌ام در ایالت‌های دور مانده بودند و من در تلاش بودم تا راه حلی پیدا کنم. با از بین رفتن پرواز اصلی خانواده من، مجبور شدیم نزدیک به 3000 دلار خرج کنیم تا آنها را به مسیر اصلی برگردانیم و فرآیند پیچیده بیمه سفر کارت اعتباری را طی کنیم. در اینجا", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۰۰:۳۱"}, {"source": "Business Insider", "title": "I'm a boomer who's not leaving my kids an inheritance. How do I break the news to them?", "link": "https://www.businessinsider.com/personal-finance/boomer-not-leaving-inheritance-how-to-tell-kids-2026-10", "summary": "The offers and details on this page may have updated or changed since the time of publication. See our article on Business Insider for current information. A reader (not pictured) asks how to tell their children that they don t plan on leaving them an inheritance. Curly_photo/Getty Images For Love Money is a column from Business Insider answering your relationship and money questions. This week, a reader's kids incorrectly believe they're getting a large inheritance. Our columnist says to loop them into their plans, and to focus on the memories they'll leave behind. Dear For Love Money, My husband and I are in our 60s, the baby boomer generation . Due to hard work over the course of our adult lives, we've been able to comfortably retire. Because my husband and I set them up for success, our two kids, now all grown up, are doing quite well. We paid for a considerable portion of their college costs , their health insurance, and their car insurance until they moved out. We drove them to all the extracurriculars that helped get them where they are today, and paid for a couple of decades' worth of food, clothing, and shelter. They also got to have amazing life experiences, such as a two-week European vacation when they were teenagers. Recently, we had them and ان، مدیرعامل، گفت که دو پردیس این شرکت برق خود را تولید خواهند کرد. او معاملات زمین، مجوزها و بودجه اولیه را تشریح کرد و گفت که تحویل باید در مرحله ارزیابی شود. شرکت مرکز داده کوین اولری برای تحلیلگرانی که به جاه‌طلبی‌های عظیم هوش مصنوعی آن شک دارند پیامی دارد: شما کل تصویر را نمی‌بینید. پل پالانجیان، مدیر عامل O'Leary Digital، ارزیابی Bernstein Research را که این شرکت را نزدیک به انتهای رتبه بندی اعتبار صنعت مرکز داده قرار می دهد، عقب نشینی کرد. در پاسخ ایمیلی به Business Insider، او جزئیات قراردادهای زمین، برنامه‌های کاربردی آب و مجوز، کارهای مهندسی و بودجه‌ای را که به گفته او تحلیل‌ها نادیده گرفته‌اند، شرح داد. پالنجیان نوشت: بررسی دقیق در این چرخه منصفانه است. وی افزود: «نمره‌ای که از داده‌های ظرفیت اعلام‌شده به دست می‌آید، هر پروژه پیش از ساخت را بر اساس تعریف پایین‌تر در پیشرفت ساخت قرار می‌دهد و نمی‌تواند کارهای محرمانه را ببیند». پاسخ او به یک سوال اصلی در رونق ساختمان هوش مصنوعی می رسد: سرمایه گذاران چقدر باید به کاری که قبل از شروع ساخت مرکز داده اتفاق می افتد، اهمیت دهند؟ پل پالانجیان، مدیرعامل O Leary Digital. پل پالانجیان/O Leary Digital Bernstein هزاران پروژه مرکز داده را با استفاده از داده های شرکت ردیابی Aterio بررسی کرد و عواملی مانند پیشرفت ساخت و ساز، در دسترس بودن برق و تجربه صنعت را ارزیابی کرد. تجزیه و تحلیل آن به این نتیجه رسید که تنها حدود 35 درصد از ظرفیت مرکز داده اعلام شده در ایالات متحده ساخته خواهد شد. O'Leary Digital امتیاز اعتبار 0.35 از 5 را دریافت کرد. برنشتاین تخمین زد که 489 مگاوات از", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سرمایه‌گذاری"], "datetime_fa": "۳۰ مهر • ۲۳:۳۶"}, {"source": "Business Insider", "title": "Nasdaq caps worst day in 4 months as AI fears and surging oil prices rip through markets", "link": "https://www.businessinsider.com/stock-market-today-tech-sell-off-meta-tesla-oil-prices-2026-10", "summary": "US stocks dropped as investors took in higher oil prices and continued jitters over the tech trade. Michael Nagle/Bloomberg via Getty Images A tech-led sell-off ripped through the stock market on Thur id. In August, Goldman Sachs projected that global AI investment was on track to surpass $1 trillion this year. \"Following an extraordinary run in technology stocks, markets are becoming more demanding around evidence of the payoff from high investment in AI and concerned about the sustainability of thi", "date_str": "2026-10-22T20:04:26+00:00", "hash": "1af573b281514fda", "title_fa": "نزدک بدترین روز در 4 ماه گذشته را پشت سر گذاشت زیرا ترس هوش مصنوعی و افزایش قیمت نفت در بازارها شکوفا شد.", "summary_fa": "سهام ایالات متحده با افزایش قیمت‌های نفت توسط سرمایه‌گذاران و ادامه نگرانی‌ها بر سر تجارت فناوری کاهش یافت. مایکل ناگل/ بلومبرگ از طریق گتی ایماژ، در بحبوحه نگرانی‌های دوباره در مورد هوش مصنوعی، فروش به رهبری فناوری در بازار سهام در روز پنجشنبه رخ داد. متا و تسلا درآمد خوبی داشتند، اما نگرانی‌های بیشتر در مورد هزینه‌های هوش مصنوعی بازارها را تحت تأثیر قرار داد. سهام چیپ چکش خورد، قیمت نفت افزایش یافت و بازده اوراق قرضه به زیر 5 درصد رسید. بازار سهام در روز پنجشنبه غوغا کرد. ترس از هزینه‌های هوش مصنوعی بار دیگر بازار صعودی را تکان داد و نزدیک به 3 درصد از شاخص نزدک 100 را کاهش داد و سرمایه‌گذاران را به سمت اوراق قرضه خزانه داری عقب نشینی کرد، اوراقی که در این ماه شاهد بازدهی بالاترین سطح در چند دهه اخیر بوده‌اند. این بدترین روز برای شاخص فناوری سنگین از ژوئن بود. این مسیر مبتنی بر فناوری ناشی از نگرانی‌های تازه مبنی بر اینکه غول‌های هوش مصنوعی ممکن است هزینه‌های زیادی را برای هوش مصنوعی صرف کنند، ایجاد شد. درآمدهای اخیر متا و تسلا علیرغم برآوردهای بیش از حد، نتوانست سرمایه گذاران را شگفت زده کند. این جایی است که شاخص های ایالات متحده در ساعت 4 بعد از ظهر ایستادند. زنگ پایانی ET: S P 500: 7663.39، کاهش 1.21% میانگین صنعتی داوجونز: 52866.85، افزایش 0.02% (+10.76 امتیاز) Nasdaq 100: 28958.69 نسبت به بازار حساس شده است. تغییرات جزئی در احساسات در مورد capex و توسعه گسترده تر هوش مصنوعی. این لرزش ها، همراه با افزایش قیمت نفت که نفت برنت را به بالاترین سطح از ماه می رساند، کافی بود تا سرمایه گذاران را برای اطمینان خاطر به سمت اوراق قرضه بازگرداند. بازدهی 10 ساله خزانه د شی گرفته است و انتظار می رود در سال 2027 افزایش بیشتری داشته باشد. این امر برای خانواده ها سالانه 7500 دلار هزینه برای بیمه درمانی دارد - و افزایش های بیشتری در راه است. یک نظرسنجی در سال 2026 از مزایای سلامتی از KFF نشان داد که کارگرانی که در یک طرح خانواده هستند به طور متوسط ​​سالانه 7471 دلار حق بیمه پرداخت می‌کنند - افزایش 9 درصدی نسبت به سال 2025. و این فقط سهم کارگر است - هنگام محاسبه سهم کارفرما، حق بیمه طرح خانواده در مجموع به 28303 دلار در سال 2026 می‌رسد. این بهای سنگینی هم برای کارگران و هم برای کارفرمایان آنها و حتی برای کارگران در مشاغل کوچکتر حادتر است: نظرسنجی KFF نشان داد که در شرکت هایی با کمتر از 200 کارمند، آنها در سال 2026 نزدیک به 10000 دلار به عنوان حق بیمه خانواده پرداخت کردند. افزایش هزینه های بهداشتی ممکن است بخشی از دلیل احساس ناراحتی مصرف کنندگان باشد: با افزایش دستمزدها، حق بیمه حتی سریعتر افزایش یافته است. در حالی که دستمزدها نسبت به سال گذشته 3.7 درصد افزایش یافته است - که ممکن است روی کاغذ یک دستمزد خوب به نظر برسد - حق بیمه های پرداختی کارگران از رشد حقوق پیشی گرفت و 9 درصد افزایش یافت. و در چند سال گذشته، میزان پرداختی کارگران برای طرح های بهداشتی، سهم بیشتری از درآمد خانوار آنها را از", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳۰ مهر • ۲۳:۰۵"}, {"source": "Business Insider", "title": "Small businesses are getting clobbered by health insurance costs for their employees", "link": "https://www.businessinsider.com/small-businesses-health-insurance-costs-work-benefits-retirement-2026-10", "summary": "Employees of small businesses are facing steep healthcare costs. Getty Images Small-business workers are facing higher costs for family health coverage than those at larger firms. Affordability and healthcare costs are key concerns for American workers and voters in the midterms. Small firms struggle with health benefit options due to less bargaining power and higher costs. Health insurance costs are going up, and it's especially rough for workers at small businesses . A new annual survey of employers and their health benefits from KFF found that small-business workers pay more for family coverage than workers at firms of every other size. At the same time, many of these workers have fewer plan choices than at larger firms, meaning they're often stuck with whatever option their employer selected. From 2025 to 2026, annual worker contributions for family coverage at firms with 10 to 199 workers increased from $8,889 to $9,687, a 9% increase. While the largest firms saw a sharper increase, workers' contributions at employers with 5,000 or more employees were nearly $3,000 less. For all firms, contributions rose about 9% to $7,471. Of covered workers at small firms, nearly one in three has a plan requiring an employee contribution of over $12,000 annually, more than double the rate at large firms. Do you work for a smaller company and worry about rising health insurance costs? Do you own a small business and have thoughts about how you're navigating health insurance for your employees? Reach out to this reporter at nsheidlower@businessinsider.com According to the survey, 66% of small firms offer health benefits , compared with 98% of firms with 200 or more workers. That's up from 59% in 2025 but remains below the 72% level of five years ago. Workers at small firms pay an average 37% of the family premium, compared with 25% at larger firms. While premiums for health insurance plans that cover only a worker and not their family are similar for small and large businesses, the average deductible at small firms is nearly $1,000 higher than at large firms. More than half of small-firm workers face a deductible of at least $2,000, compared to just a third of large-firm workers. Though the report doesn't get into the discrepancy for family plans in depth, small businesses often have less bargaining power with insurers. Because small businesses operate on smaller margins, they often don't have the money to subsidize spouses and children at the same level as larger bus", "date_str": "2026-10-22T19:24:19+00:00", "hash": "273009a8cf76a139", "title_fa": "کسب و کارهای کوچک تحت تأثیر هزینه های بیمه درمانی برای کارکنان خود قرار می گیرند", "summary_fa": "کارمندان مشاغل کوچک با هزینه های سنگین مراقبت های بهداشتی روبرو هستند. Getty Images کارگران مشاغل کوچک با هزینه های بالاتری برای پوشش سلامت خانواده نسبت به شرکت های بزرگتر مواجه هستند. مقرون به صرفه بودن و هزینه های مراقبت های بهداشتی نگرانی های کلیدی برای کارگران و رای دهندگان آمریکایی در میان دوره ای است. شرکت های کوچک به دلیل قدرت چانه زنی کمتر و هزینه های بالاتر با گزینه های مزایای سلامتی دست و پنجه نرم می کنند. هزینه های بیمه درمانی در حال افزایش است و به ویژه برای کارگران در مشاغل کوچک سخت است. یک بررسی سالانه جدید از کارفرمایان و مزایای سلامتی آنها از KFF نشان داد که کارگران مشاغل کوچک بیشتر از کارگران شرکت‌هایی با هر اندازه دیگری برای پوشش خانواده پرداخت می‌کنند. در عین حال، بسیاری از این کارگران نسبت به شرکت‌های بزرگ‌تر، گزینه‌های طرح کمتری دارند، به این معنی که آنها اغلب با هر گزینه‌ای که کارفرمایشان انتخاب کرده، گیر می‌کنند. از سال 2025 تا 2026، سهم سالانه کارگران برای پوشش خانواده در شرکت هایی با 10 تا 199 کارگر از 8889 دلار به 9687 دلار افزایش یافت که 9 درصد افزایش داشت. در حالی که بزرگ ترین شرکت ها شاهد افزایش شدیدتر بودند، سهم کارگران در کارفرمایان با 5000 کارمند یا بیشتر تقریباً 3000 دلار کمتر بود. برای همه شرکت ها، مشارکت حدود 9 درصد افزایش یافت و به 7471 دلار رسید. از میان کارگران تحت پوشش در شرکت‌های کوچک، تقریباً از هر سه یک نفر برنامه‌ای دارند که مستلزم مشارکت بیش از 12000 دلار در سال است که بیش از دو برابر نرخ در شرکت‌های بزرگ است. آیا برای یک شرکت کوچکتر کار می کنید و نگران افزایش هزینه های بیمه درمانی هستید؟ آیا صاحب یک کسب و کار کوچک هستید و در مورد نحوه هدایت بیمه درمانی برای کارکنان", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳۰ مهر • ۲۲:۵۴"}, {"source": "Business Insider", "title": "The OtterBox glass screen protector helped my phone survive a face-down drop onto brick, and it's 20% off right now", "link": "https://www.businessinsider. وند. مسلماً دستورالعمل‌های کیت نصب قاب کمی مفید نیستند، اما قرار دادن آن بسیار شهودی و آسان است. محافظ صفحه من معمولاً 40 دلار قیمت دارد، اما قرارداد فعلی OtterBox آن را قبل از هرگونه مالیات و هزینه حمل و نقل به 32 دلار کاهش می دهد. این محافظ صفحه نمایش گران‌تر است (شما می‌توانید چند توصیه برتر دیگر را", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۳۰ مهر • ۲۲:۲۴"}, {"source": "Business Insider", "title": "Only 10 artists have topped the Billboard chart with 10 different albums — here they all are", "link": "https://www.businessinsider.com/artists-with-most-no-1-albums-billboard-200-chart", "summary": "Taylor Swift performs during the Eras Tour in Toronto. Emma McIntyre/TAS24/Getty Images for TAS Rights Management The Billboard 200 is the definitive all-genre chart for album sales in the US. Only 10 artists in Billboard history have topped the chart at least 10 different times. The Beatles have the most No. 1 albums with 19. Taylor Swift and Drake are tied for second place. The Billboard 200 has tracked the best-selling albums in the US for decades. It's a major accomplishment to top the chart, especially when an artist manages the feat with multiple different albums. Only a handful of artists have crossed into double-digit No. 1s, including modern superstars like Taylor Swift , Drake, Jay-Z, and Future. They're listed below in ascending order. Editor's note: Although Elvis Presley is often credited with 10 No. 1 albums, a Billboard representative told Business Insider that most of his biggest releases predate the modern Billboard 200 chart, which launched in 1963. Madonna — 10 Madonna performs in New York City s Times Square in 2026. James Devaney/GC Images Madonna's 2026 album \"Confessions II\" became her milestone 10th No. 1 on the Billboard 200. Madonna is also the first artist with a No. 1 album in the 2020s to have already topped the chart in three other decades: twice in the 2010s (\"Madame X\" and \"MDNA\"), four times in the 2000s (\"Hard Candy,\" \"Confessions on a Dance Floor,\" \"American Life,\" and \"Music\"), and thrice in the 1980s (\"Like a Prayer,\" \"True Blue,\" and \"Like a Virgin\"). Bruce Springsteen — 11 Bruce Springsteen performs with The E Street Band in 2023. Sergione Infuso/Corbis via Getty Images Bruce Springsteen's 11 chart-topping albums span over three decades, from 1980's \"The River\" to 2014's \"High Hopes\" — even though Springsteen has yet to score a No. 1 hit song on the Billboard Hot 100. Barbra Streisand — 11 Barbra Streisand performs at Madison Square Garden in 2019. Kevin Kane/Getty Images for BSB Barbra Streisand logged her first No. 1 entry on the Billboard 200 with \"People\" in 1964. Fifty-one years later, she set a record for the longest span between No. 1s when \"Encore: Movie Partners Sing Broadway,\" her 2016 studio album, topped the chart. Streisand previously held the record for the most No. 1 albums among female artists until Taylor Swift broke it in 2023. Kanye West — 11 Rich Fury/Getty Images for Coachella Ye, who still releases music under the name Kanye West , topped the Billboard 200 for the first time in 2005 with \"Late Re", "date_str": "2026-10-22T17:43:47+00:00", "hash": "7b460b76730eefde", "title_fa": "تنها 10 هنرمند با 10 آلبوم مختلف در صدر جدول بیلبورد قرار گرفته اند - همه آنها اینجا هستند", "summary_fa": "تیلور سوئیفت در طول تور Eras در تورنتو اجرا می کند. Emma McIntyre/TAS24/Getty Images برای مدیریت حقوق TAS Billboard 200 نمودار قطعی تمام ژانر برای فروش آلبوم در ایالات متحده است. تنها 10 هنرمند در تاریخ بیلبورد حداقل 10 بار در صدر جدول قرار گرفته اند. بیتلز با 19 آلبوم شماره 1 را دارد. تیلور سویفت و دریک در رتبه دوم قرار دارند. بیلبورد 200 چندین دهه است که پرفروش ترین آلبوم ها را در ایالات متحده دنبال کرده است. این موفقیت بزرگی است که در جدول بالا قرار بگیرد، به خصوص زمانی که یک هنرمند این شاهکار را با چندین آلبوم مختلف مدیریت می کند. تنها تعداد انگشت شماری از هنرمندان، از جمله سوپراستارهای مدرن مانند تیلور سویفت، دریک، جی زی، و فیوچر به ر vers their expenses, but it's tough to get ahead. \"Employment remains essential for retirement security, but for many Americans, it is no longer sufficient,\" a Goldman Sachs Asset Management retirement report said. Gen Zers were most likely to say they earn or have earned money outside their primary job; millennials followed closely behind. The report said that's despite most Gen Z and millennial workers reporting their jobs provide financial stability. \"Younger workers may feel stable in their main jobs while still seeing extra work as necessary,\" the report said. Throughout the generations, a majority said they're doing gig or side work out of necessity or for financial security. \"The traditional full-time job may no longer be carrying the full weight of financial security,\" the report said. \"For many, supplementing income appears to have become part of the baseline.\" Some Americans are living paycheck to paycheck or adjusting their budgets to cope with rising gas prices and other everyday expenses. It can be hard to get ahead when wage growth has been consistently falling short of inflation, and it's tough to find a new job to try to earn more money. Not feeling financially secure can lead to putting off savings goals. Eighty-three percent of Gen Z and 78% of millennials said they put major financial goals on hold. Forty-one percent of millennials have delayed emergency savings despite being employed, and 30% said they delayed housing or homebuying goals. For Gen Zers, the shares were 35% and 34%, respectively. Do you work more than one job? What's that like? Do you use the earnings to handle different expenses or financial goals? Reach out to this reporter to share at mhoff@businessinsider.com . While some people may be working a part-time side job, others are \"overempl", "date_str": "2026-10-22T17:27:17+00:00", "hash": "8469f683d4ba51cf", "title_fa": "کار کردن با یک شغل همیشه کافی نیست. ژنرال زرها و هزاره ها در حال انجام کارهای جانبی و کار آزاد هستند.", "summary_fa": "یک مطالعه جدید نشان می دهد که 80 درصد از ژنرال Zers خارج از شغل اصلی خود کار کرده اند. LeoPatrizi/Getty Images مدیریت دارایی گلدمن ساکس دریافته است که 80 درصد ژنرال Zers خارج از مشاغل اصلی خود کار کرده اند. مردم در طول نسل‌ها گفتند که این به این دلیل است که به پول یا امنیت مالی نیاز دارند. احساس امنیت نداشتن می تواند بر اهداف مالی مانند مالکیت خانه تأثیر بگذارد. داشتن شغل همیشه به این معنی نیست که شما به اندازه کافی برای پوشش دادن اهداف زندگی روزمره یا پس انداز دارید. یک نظرسنجی ماه ژوئیه از آمریکایی‌ها توسط Goldman Sachs Asset Management و شرکت اقتصاد رفتاری Escalent نشان داد که بیش از 60 درصد از پاسخ‌دهندگان خارج از نقش اصلی خود کار کرده‌اند، عمدتاً به این دلیل که به آن نیاز داشتند. بیست و هفت درصد از پاسخ دهندگان گفتند که کار هزینه های آنها را پوشش می دهد، اما پیشبرد کار دشوار است. گزارش بازنشستگی Goldman Sachs Asset Management می‌گوید: «اشتغال برای امنیت بازنشستگی ضروری است، اما برای بسیاری از آمریکایی‌ها دیگر کافی نیست. ژنرال زر به احتمال زیاد می‌گفتند که خارج از شغل اصلی خود درآمد کسب می‌کنند یا کسب درآمد کرده‌اند. هزاره ها از نزدیک پشت سر گذاشتند. این گزارش می‌گوید که علیرغم اینکه اکثر کارگران ژنرال Z و هزاره‌ها گزارش می‌دهند که شغلشان ثبات مالی را فراهم می‌کند. در این گزارش آمده است: «کارگران جوان ممکن است در مشاغل اصلی خود احساس ثبات کنند در حالی که هنوز کار اضافی را ضروری می بینند. در طول نسل‌ها، اکثریت گفتند که از سر ناچاری یا برای امنیت مالی، کنسرت یا کارهای جانبی انجام می‌دهند. در این گزارش آمده است: «شغل سنتی تمام وقت ممکن است دیگر سنگینی امنیت مالی را نداشته باشد. برای بسیاری، به نظر می رسد که افزایش درآمد به بخشی", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۳۰ مهر • ۲۰:۵۷"}, {"source": "Business Insider", "title": "Tesla just laid out its transportation mission: World domination", "link": "https://www.businessinsider.com/teslas-transportation-mission-world-domination-2026-10", "summary": "Elon Musk has said he thinks the world will switch over to autonomous driving tech. He ramped up that prediction on Wednesday. Andrew Harnik/Getty Images - Jay Janner/The Austin American-Statesman via Getty Images Elon Musk has repeatedly said cars will drive themselves around the world. Now, he's making a bolder claim: Tesla will dominate that autonomy, he predicts. The only thing that could get in the way, Musk says: these pesky governments! Tesla CEO Elon Musk famously thinks bots will drive us around. On Wednesday, he took that long-running vision of autonomy a step further. During the automaker's earnings call, Musk predicted that Tesla itself would dominate how passengers get around — so long as pesky regulators don't get in the way. \"I think Tesla will end up doing a majority of all passenger miles on Earth in any country where it is allowed to operate freely,\" he said. \"And you can come back and look at this prediction, but I feel confident about this prediction.\" He said Tesla's biggest hurdle to world domination is foreign governments blocking autonomous tech \"to protect a domestic industry.\" That is a bolder statement than Musk's prior autonomy predictions. During a January earnings call, he said the \"vast majority of miles traveled\" would eventually be autonomous and guessed that people would manually drive fewer than 5% of miles. That prediction left other autonomous competitors — Waymo, Zoox, Ford, GM, Rivian, etc. — in the fray. Vehicle autonomy is core to Tesla's valuation story. The company says its future lineup will include only one vehicle that drivers can operate manually: the high-priced Roadster . In September, the company started rolling out the steering-wheel-less Cybercab for ride-hailing in Texas. That rollout has had its fits and starts. While Tesla says it's ramping production and preparing to launch Cybercab rides in Florida, the NHTSA issued an audit inquiry hours after the car's public release to probe the automaker's self-certification. Musk, who has described his predictions as his \"best guesses,\" has missed several recent timelines for Tesla's autonomy rollout — including a prediction that unsupervised autonomy would ramp across the US in 2025 . Now, Tesla has a new target date for the consumer launch of its full self-driving software. On Wednesday, Ashok Elluswamy, the company's VP of AI, said unsupervised FSD is coming \"somewhere around Q2 next year.\" Tesla didn't immediately respond to a request for comment from Busine", "date_str": "2026-10-22T17:14:35+00:00", "hash": "af852577d781d6f7", "title_fa": "تسلا به تازگی ماموریت حمل و نقل خود را ارائه کرد: تسلط بر جهان", "summary_fa": "ایلان ماسک گفته است که فکر می‌کند دنیا به فناوری رانندگی خودکار روی خواهد آورد. او روز چهارشنبه این پیش بینی را افزایش داد. اندرو هارنیک/گتی ایماژ - جی جنر/ سیاستمدار آمریکایی آستین از طریق گتی ایماژ ایلان ماسک بارها گفته است که خودروها خودشان در سراسر جهان خواهند رفت. اکنون، او ادعای جسورانه‌تری دارد: او پیش‌بینی می‌کند که تسلا بر این خودمختاری مسلط خواهد شد. ماسک می گوید تنها چیزی که می تواند مانع شود: این دولت های مزاحم! ایلان ماسک، مدیرعامل تسلا، معتقد است که ربات‌ها ما را به اطراف سوق خواهند داد. روز چهارشنبه، او دیدگاه بلندمدت خودمختاری را یک قدم جلوتر برد. ماسک در طول تماس با درآمد این خودروساز پیش‌بینی کرد که تسلا بر نحوه رفت و آمد مسافران تسلط خواهد داشت - تا زمانی که تنظیم‌کننده‌های مزاحم مانع از این کار نشوند. او گفت: «من فکر می‌کنم تسلا در هر کشوری که اجازه فعالیت آزادانه داشته باشد، اکثر مایل‌های مسافری روی زمین را انجام خواهد داد. و شما می توانید برگردید و به این پیش بینی نگاه کنید، اما من نسبت به این پیش بینی اطمینان دارم.\" او گفت بزرگ‌ترین مانع تسلا برای تسلط بر جهان این است که دولت‌های خارجی از فناوری خودمختار برای محافظت از صنعت داخلی جلوگیری می‌کنند. این بیانیه جسورانه تر از پیش بینی های قبلی ماسک در مورد استقلال است. در طی تماسی که در ماه ژانویه انجام شد، او گفت که «اکثریت مایل‌های طی شده» در نهایت مستقل خواهند بود و حدس زد که مردم کمتر از 5 درصد مایل‌ها را به صورت دستی رانندگی می‌کنند. این پیش‌بینی دیگر رقبای خودمختار - Waymo، Zoox، Ford، GM، Rivian و غیره را در معارضه قرار داد. استقلال خودرو هسته اصلی داستان ارزش گذاری تسلا است. این شرکت می گوید خط تولید آتی آن تنها شامل یک وسیله نقلیه خواهد بود", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۳۰ مهر • ۲۰:۴۴"}, {"source": "Business Insider", "title": "Venture capitalists are questioning the neolab math", "link": "https://www.businessinsider.com/vcs-questioning-neolab-math-vc-insider", "summary": "Menlo Ventures Matt Murphy speaking to Ben Bergman at Tech Insider: Growth Mode. JY Studio A version of this story originally appeared in Business Insider's weekly VC Insider newsletter. Sign up for BI's VC Insider newsletter here. Ben here. Up until recently, it was a great time to be the founder of a neolab, the lavishly funded, research-first AI startups founded by top talent who defected from the likes of OpenAI or Google DeepMind. We reported last month that Jeff Dean, Google's former chief scientist, is seeking a valuation as high as $50 billion for his new AI science startup. OpenAI cofounder Ilya Sutskever's Safe Superintelligence is worth $32 billion. Another OpenAI alum, Mira Murati, is raising a round for Thinking Machines Lab at a valuation of around $40 billion. But lately, in conversations with multiple VCs around Silicon Valley, there is a growing divide about whether neolabs can make the economics work with their multibillion-dollar price tags and formidable competition from frontier labs. One VC at a top firm, who asked that I not use his name, told me neolabs are the most hotly debated type of investment right now. \"Some would say you shouldn't invest in any, and others would say this is basically all you should be investing in because software's dead, and you either have to own models or hardware, and even if you enter at a billion, the company could be worth a trillion,\" he said. Business Insider; Randy Yeip When I recently asked Menlo Ventures partner Matt Murphy at Business Insider's Growth Mode conference which sector he thought was most overhyped, he immediately cited neolabs, which was noteworthy, given that Menlo invested in some of them . Murphy pointed to an example from his time as an early board advisor at Google, which he said did so well because it \"was like a match thrown into a bonfire.\" \"The opposite thing you want to do is start a match with a bonfire,\" Murphy told me. \"That's the risk of what's going on now with companies raising such large rounds.\" Another Menlo partner, Deedy Das, posted last month about the \"difficult game\" of making neolab math work. Das seemed a bit taken aback by the reaction to his post and later texted me: \"Like all startups, many will fail, some will work.\" Picking which ones will work is why VCs get paid the big bucks. Neolabs are a power-law bet taken to an extreme, Radical Ventures' Aaron Rosenberg told me. Investors know most will likely burn enormous sums on compute and talent without ever", "date_str": "2026-10-22T17:05:26+00:00", "hash": "9965c5bdb09e167f", "title_fa": "سرمایه گذاران خطرپذیر ریاضیات آزمایشگاه های جدید را زیر سوال می برند", "summary_fa": "Menlo Ventures مت مورفی در حال صحبت با بن برگمن در Tech Insider: Growth Mode. JY Studio نسخه ای از این داستان در اصل در خبرنامه هفتگی Business Insider VC Insider ظاهر شد. برای خبرنامه VC Insider BI از اینجا ثبت نام کنید. بن اینجا تا همین اواخر، زمان بسیار خوبی بود تا بنیان‌گذار یک آزمایشگاه نئولبیک باشید، استارت‌آپ‌های هوش مصنوعی با سرمایه‌گذاری هنگفت و تحقیقاتی که توسط استعدادهای برتر که از افرادی مانند OpenAI یا Google DeepMind جدا شده بودند، تأسیس شدند. ماه گذشته گزارش دادیم که جف دین، دانشمند ارشد سابق گوگل، به دنبال ارزش گذاری 50 میلیارد دلاری برای استارتاپ علمی جدید خود در زمینه هوش مصنوعی است. ایلیا سوتسکور، بنیانگذار OpenAI، اطلاعات ایمن 32 میلیارد دلار ارزش دارد. یکی دیگر از دانش آموختگان OpenAI، میرا موراتی، در حال جمع آوری یک دور برای آزمایشگاه ماشین های فکری با ارزش حدود 40 میلیارد دلار است. اما اخیراً، در گفتگو با چندین VC در اطراف سیلیکون ولی، شکاف فزاینده‌ای در مورد اینکه آیا نئولاب‌ها می‌توانند اقتصاد را با برچسب‌های چند میلیارد دلاری خود و رقابت شدید آزمایشگاه‌های مرزی به کار ببرند، وجود دارد. یکی از VC در یکی از شرکت‌های برتر، که از من خواست از نام او استفاده نکنم، به من گفت که نئولاب‌ها داغ‌ترین نوع سرمایه‌گذاری در حال حاضر هستند. او گفت: \"بعضی می گویند نباید در هیچ یک سرمایه گذاری کنید، و برخی دیگر می گویند این اساساً تمام چیزی است که باید روی آن سرمایه گذاری کنید زیرا نرم افزار مرده است و شما یا باید مدل یا سخت افزار داشته باشید و حتی اگر با یک میلیارد وارد شوید، ارزش شرکت می تواند یک تریلیون باشد.\" Business Insider; رندی ییپ هنگامی که اخیراً در کنفرانس حالت رشد Business Insider از مت مورفی، شریک Menlo Ventures پرسیدم که به نظر او کدام بخش بیش", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Google", "سرمایه‌گذاری"], "datetime_fa": "۳۰ مهر • ۲۰:۳۵"}, {"source": "Business Insider", "title": "OpenAI CEO Sam Altman says mathematicians have already gone from 'we're cooked' to accepting AI", "link": "https://www.businessinsider.com/sam-altman-openai-mathematicians-math-disruption-navier-stokes-2026-10", "summary": "Sam Altman says mathematicians are coming around after OpenAI upended mathematics. Bloomberg/Getty Images OpenAI CEO Sam Altman and mathematicians have a complicated relationship. OpenAI has taken credit for solving hundreds of math problems, irking many mathematicians. At a recent talk at Stanford, Altman said mathematicians have already gone from anger to acceptance. Like someone in mourning, Sam Altman said mathematicians went through phases after OpenAI began its blitz into the field. First, there was disbelief. Then, there was pain. \"The day one reaction was like, 'We're cooked, and our field is over,'\" OpenAI's CEO said. \"'We're telling our grad students to switch majors.'\" After that, there was anger. \"The day three reaction was maybe like: 'It's horrible that OpenAI did this,'\" Altman said at a recent talk at Stanford, before hundreds of students jittery about the viability of their future careers. Come day five, though, in Altman's telling, mathematicians began to come around to what he described as AI's now-inalienable role in the study of numbers and proofs. \"We've now seen a lot of people say, actually, I'm going to have a different but hopefully better kind of career as a mathematician,\" Altman said. Altman's buoyant assessment contrasts sharply with what some in the math community have described as an existential transformation. After OpenAI abruptly broke into the field's prerogatives in September, announcing its models had solved the Navier-Stokes equations — a famously challenging math puzzle that stumped the industry's brightest since the 19th Century — preeminent mathematicians erupted in fury. A pair of academics, one at New York University and another at Anthropic, accused OpenAI of using data from their chat logs to help crack the problem. Mathematicians also complained that while an AI model might have solved the problem, it didn't show its work, leaving them with the less celebratory task of verifying it. And in the wake of all that controversy, there was more controversy. A group of undergrads at Caltech, wary of how rapidly AI was disrupting their field and wanting to stay relevant, advertised a \"mathathon\" where participants were encouraged to use AI to solve long-standing problems. OpenAI dropped out of sponsoring the event after more than 700 academics signed an open letter denouncing the competition for promoting AI \"slop.\" (Organizers have since made adjustments to the rules, and the competition is set for November.) More rec", "date_str": "2026-10-22T16:38:10+00:00", "hash": "4d1a314cf7c04ac2", "title_fa": "سام آلتمن، مدیر عامل OpenAI می گوید که ریاضیدانان قبلاً از \"ما آماده ایم\" به پذیرش هوش مصنوعی رسیده اند.", "summary_fa": "سام آلتمن می‌گوید که پس از تغییر ریاضیات OpenAI، ریاضی‌دانان در حال آمدن هستند. سام آلتمن، مدیر عامل بلومبرگ/گتی ایماژ OpenAI و ریاضیدانان رابطه پیچیده ای دارند. OpenAI اعتبار حل صدها مسئله ریاضی را به خود اختصاص داده است و بسی hacker", "title": "You Should Update Your Garmin Watch's Heart Rate Zones", "link": "https://lifehacker.com/health/update-garmin-watch-heart-rate-zones?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Zone 2 training is still having a moment even if no one can agree on what it actually means . Legend has it that your easy, conversational-pace cardio aka your Zone 2 heart rate is the secret to unlocking everything from a bigger aerobic engine , to faster race times , and even to a longer life . Whether Zone 2 deserves quite this much hype is debatable, but still, there are plenty of good reasons to master heart rate training more broadly. To train by heart rate, you aim to keep your heart rate in the \"zone\" that gives you your desired workout. Even if you believe every word of the Zone 2 gospel, it's completely pointless if your watch has the wrong idea of what your Zone 2 is. If you train with a Garmin watch, here s how and why you should reset your heart rate zones now (and periodically). Garmin HRM 600 Premium Heart Rate Monitor, Accurate Heart Rate and HRV Data, Running Dynamics, Stand-Alone Activity Recording, M-XL $157.70 at Amazon $169.99 Save $12.29 Shop Now Shop Now $157.70 at Amazon $169.99 Save $12.29 How Garmin determines your heart rate zones When you first set up your Garmin, it asked for your age, weight, and a few other details. From there it generated heart rate zones, often using a default formula based on a maximum heart rate estimated from your age (typically some version of 220 minus your age). But these formulas are often wrong , since they give a single number for everybody at the same age, while real maximum heart rates vary from person to person. Plus, there isn t one universally agreed-upon heart rate zone system. So if your watch assumed a max of 180 and yours is actually 195, every zone it gave you is shifted. Your \"Zone 2\" might really, for you, be Zone 1 (AKA a pace so easy it barely feels like a workout). Or your \"Zone 2\" might actually be a moderate-to-hard effort that's digging you into a hole, while you think you're taking it easy. At every step of the way, there s a different formula and definition that determines what heart rate zone shows up on your watchface. To complicate things further, Garmin gives multiple options to set up your zones: Percent of max heart rate. This is the simplest approach. You enter (or let the watch estimate) your max, and each zone is a slice of that number. It's only as good as your max heart rate figure, which, as noted above, is often a guess. Percent of heart rate reserve (HRR). This method factors in both your max and your resting heart ", "date_str": "2026-10-22T18:30:00+00:00", "hash": "52e9b9b72b6ac5aa", "title_fa": "شما باید مناطق ضربان قلب ساعت گارمین خود را به روز کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. آموزش منطقه 2 هنوز لحظه ای دارد حتی اگر هیچ کس نتواند در مورد معنای واقعی آن توافق کند. افسانه ها می گویند که کاردیوی آسان و با سرعت مکالمه شما با نام ضربان قلب منطقه 2 شما راز باز کردن قفل همه چیز از یک موتور هوازی بزرگتر تا زمان های مسابقه سریع تر و حتی عمر طولانی تر است. اینکه Zone 2 سزاوار این همه تبلیغات است یا نه قابل بحث است، اما با این وجود، دلایل خوبی برای تسلط بیشتر بر تمرین ضربان قلب وجود دارد. برای تمرین بر اساس ضربان قلب، هدف شما این است که ضربان قلب خود را در \"منطقه\" نگه دارید که تمرین مورد نظر شما را به شما می دهد. حتی اگر به تک تک کلمات انجیل Zone 2 اعتقاد داشته باشید، اگر ساعت شما تصور اشتباهی از اینکه Zone 2 شما چیست، کاملاً بیهوده است. اگر با ساعت گارمین تمرین می کنید، در اینجا نحوه و چرایی تنظیم مجدد مناطق ضربان قلب خود در حال حاضر (و به صورت دوره ای) آورده شده است. مانیتور ضربان قلب ممتاز Garmin HRM 600، داده‌های ضربان قلب دقیق و HRV، Running Dynamics، ضبط فعالیت‌های مستقل، M-XL 157.70 دلار در آمازون 169.99 دلار صرفه جویی 12.29 دلار اکنون خرید کنید اکنون چگونه نرخ 157.70 دلار را در Amazon Save تعیین کنید. مناطق زمانی که گارمین خود را برای اولین بار راه اند 0 دلار اگر هرگز از هدفون های رسانای استخوانی استفاده نکرده اید، ارزش امتحان کردن را دارند و Shokz OpenPro مقدمه ای عالی برای این فناوری است. پیش از این، هدست‌های هدایت استخوانی در مقایسه با مدل‌های داخل گوش، از باس ضعیف رنج می‌بردند. OpenRun Pros طراحی شده است تا برخی از آن‌ها را جبران کند که شما همان باس ضربتی را که از هدفون‌های معمولی دریافت می‌کنید، دریافت نمی‌کنید، اما این بهترین چیزی است که می‌توانید از هر هدفون رسانای استخوانی دریافت کنید. همانطور که از نام آن پیداست، اینها برای استفاده در دویدن در فضای باز طراحی شده اند.", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple"], "datetime_fa": "۳۰ مهر • ۲۱:۰۰"}, {"source": "Lifehacker", "title": "Google Quietly Linked Your Phone Number Across Your Accounts, but You Can Stop It", "link": "https://lifehacker.com/tech/google-opt-out-linking-phone-number-across-accounts?utm_medium=RSS", "summary": "In recent weeks, Google has been automatically connecting Android users' phone numbers to every Google account they are signed into on their devices without requesting consent to do so. This means that if you are logged into personal, work, and disposable accounts on your Android phone, Google may have silently verified and linked your number with all of them even if you've deliberately kept them separate. If you that's not something you want, there's a way to fix it. Google is automatically verifying Android users' phone numbers As Android Authority reports , some Android users have recently received confirmation emails from an official Google address stating that their phone number has been verified. Google has required occasional phone number re-verification but appears to have updated its support documentation about a year ago to make this feature opt-out by default. As part of this process, Google also adds your phone number to all Google Accounts that are signed in on the device, including current accounts and phone numbers and any that are added or updated in the future. You can change your phone number verification settings on Android Disable automatic phone number verification If you have an Android device, you can disable automatic phone number verification, which should prevent Google from linking sign-in accounts together. You can find this toggle in your Settings app under Google or Google services and preferences All Services Privacy Security Phone number verification . (Note that the exact path may differ by device.) You should periodically check to ensure this toggle remains off. Delete associated numbers from accounts already linked Updating this setting does not disconnect phone numbers and Google accounts that have already been linked. You can find out which are which via your Google Account Personal Info page . Select your profile picture in the upper-right corner to go through each signed-in account and open the Phone section to select and delete any numbers you don't want associated. Review your Security sign-in settings Finally, Malwarebytes advises scrolling down to the Usage section on the Phone page to view which services are listed as well as reviewing your Security sign-in settings. If you added your phone number for two-step verification or to a separate app like Google Pay, deleting it from the Phone page won't remove it entirely from your account, and you'll need to update those settings separately. Automatic phone verificati", "date_str": "2026-10-22T17:00:00+00:00", "hash": "6fdd38b8ba751d3a", "title_fa": "گوگل بی سر و صدا شماره تلفن شما را با حساب های شما مرتبط کرد، اما شما می توانید آن را متوقف کنید", "summary_fa": "در هفته‌های اخیر، گوگل به‌طور خودکار شماره تلفن کاربران اندروید را به هر حساب Google که در دستگاه‌های خود وارد شده‌اند، بدون درخواست رضایت برای انجام آن، متصل می‌کند. این بدان معناست که اگر به حساب‌های شخصی، کاری و یکبار مصرف در تلفن Android خود وارد شده باشید، ممکن است Google بی‌صدا شماره شما را تأیید کرده و با همه آنها پیوند داده باشد، حتی اگر عمداً آنها را جدا نگه داشته باشید. اگر این چیزی نیست که می خواهید، راهی برای رفع آن وجود دارد. Google به طور خودکار شماره تلفن کاربران Android را تأیید می کند همانطور که Android Authority گزارش می دهد، برخی از کاربران Android اخیراً ایمیل های تأییدی را از یک آدرس رسمی Google دریافت کرده اند که نشان می دهد شماره تلفن آنها تأیید شده است. Google نیاز به تأیید مجدد گاه به گاه شماره تلفن دارد، اما به نظر می رسد حدود یک سال پیش اسناد پشتیبانی خود را به روز کرده است تا این ویژگی به طور پیش فرض انصراف دهد. به عنوان بخشی از این فرآیند، Google همچنین شماره تلفن شما را به همه حساب‌های Google که در دستگاه وارد شده‌اند، از جمله حساب‌های فعلی و شماره تلفن‌ها و مواردی که در آینده اضافه یا به‌روزرسانی می‌شوند، اضافه می‌کند. می‌توانید تنظیمات تأیید شماره تلفن خود را در Android تغییر دهید غیرفعال کردن تأیید خودکار شماره تلفن اگر دستگاه Android دارید، می‌توانید تأیید خودکار شماره تلفن را غیرفعال کنید، که باعث می‌شود Google نتواند حساب‌های ورود به سیستم را به یکدیگر مرتبط کند. می‌توانید این کلید را در برنامه تنظیمات خود در زیر سرویس‌ها و تنظیمات ترجیحی Google یا Google پیدا کنید. همه سرویس‌ها امنیت حریم خصوصی تأیید شماره تلفن. (توجه داشته باشید که مسیر دقیق ممکن است بسته به دستگاه متفاوت باشد.) باید به طور دوره ای بررسی کنید تا مطمئن", "category": "هوش مصنوعی مولد", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۳۰ مهر • ۲۰:۳۰"}, {"source": "Lifehacker", "title": "10 Shows Like 'A Different World' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-a-different-world?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The original A Different World was a groundbreaking sitcom in its era, spending six seasons highlighting Black academic drive among a cast of characters so indelible that we're now checking in on them decades later. Spearheaded by Queen Sugar's Felicia Pride, the update has been a critical and ratings hit for Netflix, earning the rarest prize of all in streaming television: a quick second season renewal. While you're waiting for season two, here are some other smart coming-of-age shows that b
