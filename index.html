<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <title>مجله خبری روزانه — ۱ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۱ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۲ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۹:۵۰</span>

    <div class="search-box">

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">

      <button class="tab-btn" onclick="switchTab('tech', this)">

        <span class="badge" id="badge-tech">۲۹</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">

        <span class="badge" id="badge-media">۱۲</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">

        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

      tech: [{"source": "Engadget", "title": "Waymo recalls robotaxis after they drove into closed freeway lanes", "link": "https://www.engadget.com/2324099/waymo-recalls-robotaxis-after-they-drove-into-closed-freeway-lanes/", "summary": "The recalls come after the California DMV banned Waymo from operating on its state freeways.", "date_str": "2026-11-21T16:01:32+00:00", "hash": "faa0f2254418a879", "title_fa": "Waymo رباتاکسی را پس از اینکه در خطوط بسته آزادراه رانندگی کردند، به یاد می آورد", "summary_fa": "این فراخوان ها پس از آن صورت می گیرد که کالیفرنیا DMV فعالیت Waymo را در آزادراه های ایالتی خود ممنوع کرد. Waymo افزودن Engadget به Google: منبع ترجیحی Google Discover Waymo پس از حوادثی که خودروهایش به خطوط بسته آزادراه رفتند و از دستورات دستی امدادگران اضطراری پیروی نکردند، دو فراخوان برای ناوگان روباتاکسی خود ثبت کرد. همانطور که برای اولین بار توسط رویترز گزارش شد، شرکت متعلق به آلفابت گفت که این دو فراخوان \"برای تقویت نحوه عبور Waymo Driver در خطوط بسته آزادراه و تقاطع ها با کنترل دستی ترافیک\" انجام شده است. خودروهای Waymo به طور معمول در خیابان‌های شهر کار خواهند کرد، در حالی که درایوهای بزرگراه متوقف می‌شوند زیرا این شرکت روی بهبود نرم‌افزاری برای رفع مشکلات کار می‌کند. Waymo بلافاصله پس از اینکه دپارتمان وسایل نقلیه موتوری کالیفرنیا استفاده از رباتاکسی خود را از آزادراه ایالتی ممنوع کرد، این فراخوان را به اداره ملی ایمنی ترافیک بزرگراه ارائه کرد. DMV ایالتی، رباتاکسی را یک \"خطر قریب الوقوع برای امنیت عمومی\" نامید، پس از چند حادثه که وسایل نقلیه Waymo به مناطق ساخت و ساز که به روی ترافیک بسته بودند رفتند. طبق گزارش کالیفرنیا DMV، سه رباتاکسی Waymo در موارد جداگانه وارد مناطق ساخت و ساز ممنوعه در شهر برلینگیم شدند. یک رباتاکسی Waymo نیز دیده شد که سعی داشت در اطراف خودروی گشت بزرگراه کالیفرنیا که در حال انجام توقف ترافیک بود، حرکت کند. یکی از سخنگویان Waymo به Engadget گفت: «دیروز، ما دو فراخوان داوطلبانه در سیستم رانندگی خودکار خود ثبت کردیم تا نحوه حرکت Waymo Driver در خطوط بسته آزادراه و تقاطع ها با کنترل ترافیک دستی را تقویت کنیم. \"اینها مراحل استا nyone who loves displaying family photos. If you prefer the walnut trim over the birch or standard black models, it’s also on sale at Best Buy for $134.99 ($95 off) — which, like with the others, is the first discount we’ve seen. Amazon Alexa Photo Frame Where to Buy: $229.99 $114.99 at Amazon (birch) $199.99 $114.99 at Best Buy (black) $229.99 $134.99 at Best Buy (walnut) The Alexa Photo Frame features a 10-inch, semi-matte touchscreen that’s designed to make digital photos look more natural, with built-in light sensors that automatically adjust brightness throughout the day. It displays images from Amazon Photos, which supports uploads from both iOS and Android devices, including photos stored in iCloud. You can choose which people or albums to display, or let Alexa Plus do the work, which often results in photos based on your facial expression, the season, and even the lighting. You can also search for specific photos with voice commands, letting you easily pull up images of your first dog, your child as a baby, and other shots without having to scroll endlessly through years of photos yourself. If you want to add a more personal touch, Amazon also lets you attach voice notes to individual photos via the Amazon Photos app. For example, you can add a recording of your kid explaining their Halloween costume to a trick-or-treating photo. Plus, you can preload the frame with photos and recordings before gifting it, so your loved one won t have to spend time setting it up. We’re still testing Amazon’s answer to the Aura frame, but it looks like a particularly good option if you’re already an Amazon Prime member. A Prime subscription grants you unlimited full-resolution photo storage and access to Alexa Plus at no additional cost, and unlike Amazon’s smart displays, the frame doesn’t serve up annoying ads. That said, you don’t need a subscription to use it, and new users can always access a limited-time trial of Alexa Plus.", "date_str": "2026-11-21T16:00:00+00:00", "h he voice of Linda Belcher, is just happy to finish a thing", "link": "https://www.theverge.com/report/1038463/john-roberts-linda-belcher-bobs-burgers-interview", "summary": "You probably know John Roberts best as the voice of Linda Belcher on Bob's Burgers . The show just wrapped up its 16th season and shows no signs of slowing down anytime soon. The show remains a reliable source of laughs, top-notch puns, and frankly wholesome fun. Comedy is just part of Roberts' life, however. In addition to his appearances on Gravity Falls and Comedy Bang! Bang! , he's also a musician with deep roots in New York City's queer nightlife scene. He just released his latest record, I Am , on Friday, and it dabbles in '80s pop, '90s house, and even dashes of '00s rave. But while the record sounds made for the dance floor, it actuall … Read the full story at The Verge.", "date_str": "2026-11-21T16:00:00+00:00", "hash": "9bcb9371229103e0", "title_fa": "جان رابرتز، صداپیشه لیندا بلچر، از به پایان رساندن یک کار خوشحال است", "summary_fa": "احتمالا جان رابرتز را به عنوان صدای لیندا بلچر در باب برگرز بهتر می شناسید. سریال به تازگی فصل شانزدهم خود را به پایان رسانده است و هیچ نشانه ای از کند شدن آن به این زودی دیده نمی شود. این نمایش منبع قابل اعتمادی از خنده، جناس درجه یک، و رک و پوست کنده سرگرم کننده سالم باقی می ماند. با این حال، کمدی تنها بخشی از زندگی رابرتز است. علاوه بر حضور او در Gravity Falls و Comedy Bang! بنگ! ، او همچنین یک موسیقیدان است که ریشه های عمیقی در صحنه زندگی شبانه عجیب و غریب شهر نیویورک دارد. او به تازگی آخرین آلبوم خود را به نام I Am را در روز جمعه منتشر کرد و در موسیقی پاپ دهه 80، هاوس دهه 90 و حتی آهنگ های راوی دهه 00 به کار می رود. اما در حالی که صدای ضبط برای پیست رقص ساخته شده است، در واقع… داستان کامل را در The Verge بخوانید. گزارش سرگرمی مصاحبه جان رابرتز، صدای لیندا بلچر، از به پایان رساندن یک کار خوشحال است. Terrence O'Brien 21 نوامبر 2026، ساعت 4:00 بعد از ظهر UTC لینک اشتراک گذاری عکس هدیه: گزارش Cody Critcheloe مصاحبه سرگرمی جان رابرتز، صداپیشه لیندا بلچر، ً از گوگل یا آمازون خریداری کنید. خاموش کردن صفحه نمایش همیشه روشن به عمر باتری کمک می کند. با Charge 5 و 6، Inspire 3، Sense 2 و Versa 2 و 4، نمایشگر همیشه روشن به شدت عمر باتری را به تنها سه روز در هر بار شارژ کاهش می دهد. برای Edge، می‌تواند آن را تا دو روز کاهش دهد. همچنین باید روشنایی صفحه نمایش را در داخل خانه کم کنید، در صورت وجود دستگاه، مدت زمان کوتاه تری را انتخاب کنید و از استفاده از صفحه های ساعت متحرک که به باتری بیشتری نیاز دارند خودداری کنید. علاوه بر این، استفاده از GPS داخلی را در مدل هایی که از آن پشتیبانی می کنند محدود کنید، زیرا باتری را نیز به سرعت تخلیه می کند. شما فقط تا 10 ساعت با Fitbit Edge، پنج ساعت با Charge 4، 5، و 6، و 12 ساعت با Sense، Sense 2، Versa 3 و Versa 4 فرصت خواهید داشت. اگر Fitbit تنظیمات GPS قابل تنظیم", "image_url": "https://www.engadget.com/img/gallery/ways-you-can-help-your-fitbits-battery-last-longer/l-intro-1794855759.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۳۰ آبان • ۱۹:۱۵"}, {"source": "Engadget", "title": "The pros and cons of using a VPN over encrypted DNS", "link": "https://www.engadget.com/2317883/pros-cons-using-vpn-over-encrypted-dns/", "summary": "Explore the perks and drawbacks of choosing a VPN over encrypted DNS, from privacy and security to speed, costs, and control over your browsing habits.", "date_str": "2026-11-21T15:30:00+00:00", "hash": "88456b785c64a4f6", "title_fa": "مزایا و معایب استفاده از VPN روی DNS رمزگذاری شده", "summary_fa": "مزایا و معایب انتخاب VPN را بر روی DNS رمزگذاری شده، از حریم خصوصی و امنیت گرفته تا سرعت، هزینه ها و کنترل عادات مرور خود کاوش کنید. یک VPN بیشتر از پرس و جوهای DNS شما محافظت می کند، اما آیا ارزش هزینه اضافی را دارد؟ ما مبادلات را می سنجیم تا به شما در تصمیم گیری کمک کنیم. Nicoelnino/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover مهم نیست که چقدر به اینترنت سر و کار دارید، همیشه این امکان وجود دارد که امنیت یا حریم خصوصی شما به صورت آنلاین به خطر بیفتد. در حالی که ممکن است ایمن سازی 100 درصد مرور شما غیرممکن باشد، چند  War-era nuclear missile silo from the US government in 2021 for more than $10 million. For the past five years, Halik has been overseeing its transformation into a modern, renovated facility, where he plans to house an AI data center . After recent tech outages have prompted some people to stock up on generators and emergency kits , the underground facility in Colorado offers a closer look at Cold War-era infrastructure built to operate off the grid, as well as efforts to protect servers in ultra-secure facilities. The project is on brand for Halik, a self-described \"thrillionaire\" whose past endeavors have included skydiving over Mount Everest , training in Russia as a civilian cosmonaut, and diving 5 miles deep to the deck of the Titanic . He said his interest in these types of structures pairs with his vision for what they could become. \"I'm immersed in the world of castles and underground bunkers,\" Halik told Business Insider. \"I'm a value-facturer. I like things that I can add value to.\" Halik took Business Insider on a tour of the facility . See what it looks like inside the roughly 75-year-old nuclear silo. The facility was built in Colorado in 1959 for $47 million, or $350 million in today s dollars. Other Titan I silos like Halik s were built in Colorado. Carl Iwasaki/Getty Images At the beginning of the Cold War, the US began developing intercontinental ballistic missiles (ICBMs) at a rapid pace. Following the US' first operational ICBM , the SM-65 Atlas, the Titan I went under development in the mid-1950s. According to the National Park Service , the Titan I missiles were 98 feet tall and could deliver a nuclear warhead over 6,000 miles. Eighteen silos, like Halik's and the one pictured, were built across the US to house these missiles during the Cold War. Four large diesel engines powered the facility. Another Titan I silo near Denver. Thanks to diesel powe", "date_str": "2026-11-21T15:37:01+00:00", "hash": "ec46c4e0e8bbd02d", "title_fa": "یک کارآ s after he resigned, Huang said he's seen an \"outpouring of calls from NVIDIA's employees, investors, business partners, and customers for me to return as CEO.\" \"Many continue to reach out to me directly,\" he added. Nvidia's board, however, has said that it has no plans to reinstate the founder, who wrote in a note to staff that he had been \"unfaithful\" to his wife, Lori Huang. Here's what some influential people say they told Huang. President Donald Trump President Trump said he called Huang to ask how he s doing. Kent NISHIMURA / AFP via Getty Images Trump says he called Jensen Huang at least twice since news of his affairs broke. In a White House press conference three days before Huang resigned, Trump said he'd called Huang that day \"just to see if he's feeling all right.\" Trump said he asked Huang whether he knew that Alice Huang (no relation), the former CEO of Megaspeed and his alleged paramour, was a spy for China. Trump said Huang said he didn't know. Then, in an interview with Stephen A. Smith, Trump said Huang called him at a separate time, telling the president that he feels bad for what he's done to his family. The New York Times reported that in one of those calls, Trump urged Huang to fight to keep his job. Travis Kalanick", "date_str": "2026-11-21T15:31:41+00:00", "hash": "b02ba50d945dc87a", "title_fa": "آنچه که متحدان جنسن هوانگ می گویند از زمان استعفا به او گفته اند: \"بیا بجنگیم\"", "summary_fa": "جنسن هوانگ در حال بررسی تماس‌ها و ایمیل‌های مدیران عامل فناوری است تا احتمال بازگشت به انویدیا را مشخص کند. Jens Kalaene/تصویر اتحاد از طریق Getty Images جنسن هوانگ در حال کار بر روی تلفن‌های همراه با بازگشت به Nvidia به عنوان مدیرعامل است. تعدادی از مدیران عامل فناوری می گویند اخیراً با غول تراشه 63 ساله صحبت کرده اند. هیئت مدیره انویدیا اعلام کرد که هیچ برنامه ای برای بازگرداندن هوانگ به عنوان مدیرعامل ندارد. در حالی که جنسن هوانگ بازگشت احتمالی به انویدیا را به عنوان مدیر عامل بازی می کند، این غول تراشه 63 ساله به یک راه نجات جیبی روی می آورد: تلفن خود. در آن سوی خط، مجموعه‌ای از مدیران عامل فناوری، کارمندان انویدیا و رئیس‌جمهور دونالد ترامپ قرار دارند که سخنان محبت آمیزی ارائه می‌کنند و راه‌هایی را برای بازگشت او به سکان هدایت می‌گویند. گاوین بیکر، سرمایه‌گذار خطرپذیر اخیراً در مصاحبه‌ای با CNBC گفت: «من به جنسن گفته‌ام که او باید ورزش کند، طلوع خورشید را تماشا کند و هشت ساعت بخوابد. فکر می‌کنم او باید بیشتر به آمریکا، هوش مصنوعی و فناوری کمک کند.» هوانگ در 12 نوامبر در پی اتهاماتی مبنی بر داشتن حداقل دو رابطه استعفا داد، یکی با یک مدیر اجرایی چینی که اطلاعات ایالات متحده می گوید برای پکن جاسوسی می کند و دیگری با گزارش مستقیم در Nvidia. هوانگ از آن زمان علاقه خود را به بازگشت به عنوان مدیرعامل نشان داده است. در یک پست طولانی X پنج روز پس از استعفای خود، هوانگ گفت که او شاهد \"تماس‌هایی از سوی کارمندان، سرمایه‌گذاران، شرکای تجاری و مشتریان NVIDIA برای بازگشت من به عنوان مدیرعامل بوده است.\" او افزود: «بسیاری همچنان مستقیماً با من تماس می گیرند. هیئت مدیره انویدیا، با این حال، گفته است که هیچ برنامه ای برای بازگرداندن بنیانگذار، که در یادداشتی به کارکنان", "image_url": "https://i.insider.com/6b0070d50b69407d788a4f10?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه"], "datetime_fa": "۳۰ آبان • ۱۹:۰۱"}, {"source": "Business Insider", "title": "Redwood Materials found a very practical use for AI: Sorting old batteries", "link": "https://www.businessinsider.com/redwood-materials-ai-battery-sorting-recycling-2026-11", "summary": "A Redwood Materials battery-sorting system. Redwood Materials A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . Recycling batteries sounds like a great idea. Until you realize someone has to sort through mountains of them first. It's a tricky job. Batteries come in all shapes and sizes, with different chemical ingredients . Mixing up the wrong ones can make recycling less efficient and more expensive. Enter AI . Redwood Materials , the battery recycling startup founded by Tesla cofounder JB Straubel, has built an automated sorting system that can identify batteries with more than 98% accuracy, according to the company. Here's how it works. Old batteries arrive in a jumble of boxes and bins. Machines separate them into a single-file line. Each battery then passes through a tunnel equipped with cameras and sensors that examine its label, shape, and weight. AI figures out what kind of battery it is and sends it to the right place for recycling. Redwood developed an AI model for this, trained on the company's voluminous battery data, and it runs on a cluster of GPUs on site. The system was built in just a few months and can handle several tons of batteries an hour. Why does this matter? Redwood wants to recover valuable materials such as lithium, nickel, and cobalt, rather than relying so heavily on mining and imports. This is a neat example of AI tackling a messy, unglamorous industrial problem. And potentially making American manufacturing more competitive. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-11-21T15:28:01+00:00", "hash": "748cf29e5419c5b0", "title_fa": "Redwood Materials یک کاربرد بسیار کاربردی برای هوش مصنوعی پیدا کرد: مرتب سازی باتری های قدیمی", "summary_fa": "", "image_url": "https://i.insider.com/6aff99b20b69407d788a4c01?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۳۰ آبان • ۱۸:۵۸"}, {"source": "Business Insider", "title": "I've stayed at dozens of all-inclusives. My new favorite was surprisingly affordable and unlike any resort I've visited.", "link": "https://www.businessinsider.com/bahia-principe-escape-tequila-mexico-favorite-all-inclusive-resort-review-2026-11", "summary": "I loved staying at Bahia Principe Escape Tequila, an all-inclusive resort with Texas-style barbecue, drag shows, and tons of bars and restaurants. Simon tech could save you money, but some gadgets aren t worth the risk. Here s what you should avoid buying secondhand unless it s refurbished.", "date_str": "2026-11-21T14:45:00+00:00", "hash": "316f938b9f79e1e0", "title_fa": "5 گجت دست دوم که هرگز نباید خریداری کنید", "summary_fa": "خرید فناوری دست دوم می تواند در هزینه شما صرفه جویی کند، اما برخی از ابزارها ارزش ریسک کردن را ندارند. در اینجا چیزی است که شما باید از خرید دست دوم خودداری کنید مگر اینکه تعمیر شده باشد. برای برخی از دسته ها، پس انداز به سادگی ارزش مبادله را ندارد. DAMRONG RATTANAPONG/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover انتخاب فناوری استفاده شده راهی عالی برای کاهش هزینه‌ها است، و در بسیاری از موارد، کنار گذاشتن فاکتور \"wow\" باز کردن یک دستگاه کاملاً جدید می‌تواند ارزش صرفه‌جویی را داشته باشد. اگر مدلی بخرید که خیلی قدیمی نیست و به صاحب قبلی اعتماد کنید، ممکن است سال‌ها استفاده از تلفن، تبلت یا لپ‌تاپ دست دوم باقی بماند. در مورد کنسول های بازی، مانیتورها و سایر دستگاه هایی که می توانند عمر زیادی در آنها باقی بماند نیز همین گونه است. با این حال، حتی با وجود تخفیف‌های وسوسه‌انگیز، برخی از دسته‌بندی‌های محصولات فناوری وجود دارد که باید از آنها صرفنظر کنید و جدید (یا شاید بازسازی شده) خریداری کنید. به‌علاوه، برخی از این دستگاه‌ها نگرانی‌های بهداشتی را افزایش می‌دهند، مانند هدفون‌ها و سایر پوشیدنی‌ها، در حالی که برخی از دسته‌های دستگاه‌ها مانند هارد دیسک‌ها و بانک‌های باتری با افزایش سن یا استفاده، قابلیت اطمینان خود را از دست می‌دهند. بنابراین دفعه بعد که در یک فروشگاه ساده خرید می‌کنید یا در یک صفحه آگهی‌های محلی به صورت آنلاین مرور می‌کنید، سراغ هیچ یک از این محصولات نروید. همچنین ارزش این را دارد که قبل از اینکه خودتان هر فناوری مورد استفاده را برای فروش فهرست کنید، این نکات را در نظر داشته باشید. Gorodenkoff/Getty Images این احتمالاً اولین دسته ای است که وقتی به چیزی فکر می کنید که نمی خواهید بعد از شخص دیگری از آن استفاده کنید، به ذهنتان خطور می کند. هدفون ها تا حد", "image_url": "https://www.engadget.com/img/gallery/5-gadgets-you-should-never-buy-used/l-intro-1794851054.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۳۰ آبان • ۱۸:۱۵"}, {"source": "Business Insider", "title": "I'm a real estate developer selling a $30 million mansion, and here’s why I’d accept Anthropic shares instead of cash", "link": "https://www.businessinsider.com/thirty-million-la-mansion-accepts-anthropic-shares-as-payment-2026-11", "summary": "Phillip Braunstein, a developer in LA, is willing to trade his $29,995,000 mansion for shares of OpenAI or Anthropic. Courtesy of Carolwood Estates Phillip Braunstein is willing to trade his $29,995,000 mansion for shares of OpenAI or Anthropic. The LA developer says a sluggish LA luxury market and his AI optimism prompted the offer. Braunstein says he believes that AI shares could multiply in value over time. This as-told-to essay is based on a conversation with Phillip Braunstein, president of Colossal Properties and owner of the home at 1210 Chickory Lane in the Brentwood neighborhood of Los Angeles. The property is listed for $29,995,000 and accepts shares from OpenAI and Anthropic as payment. The conversation has been edited for length and clarity. I've been in construction and real estate development for almost 15 years, and I've also become increasingly involved in tech investing . I started building this house in Brentwood in 2021. It's an architectural modern residence with almost four stories, including a basement and a rooftop deck with views of the Pacific Ocean, downtown Los Angeles, and the Getty Museum. I've put a lot into the property. But when I put it on the market, I also started thinking about what else I might accept as payment. I'm a big believer in AI, and I thought: If somebody has a significant amount of equity in OpenAI or Anthropic, why not consider trading the house for that? Why I'm open to AI shares The Los Angeles luxury property market has been sluggish, as many who could afford such properties are deterred by the mansion tax. Courtesy of Carolwood Estates I started using AI heavily in 2023, initially for personal applications. Then I got deeper into it and started building an actual stock-trading algorithm with a friend and neighbor who was formerly the director of Applied AI at Google. At the same time, my friends and I were talking about getting investment stakes in AI companies . Meanwhile, the Los Angeles real estate market was very soft. The mansion tax had been introduced, and there was also uncertainty around a proposed billionaire tax in California. There were a lot of questions about whether people with the net worth to buy a property at this price point would want to remain in Los Angeles. So I thought, you know what? If someone has a lot of equity in OpenAI or Anthropic , I'd be happy to take it. As someone who uses AI heavily, I really believe in the technology. I wanted to let the marketplace know that if someo", "date_str": "2026-11-21T14:00:01+00:00", "hash": "64c02ecf6f4db362", "title_fa": "من یک توسعه دهنده املاک و مستغلات هستم که یک عمارت 30 میلیون دلاری می فروشم، و به همین دلیل است که به جای پول نقد، سهام آنتروپیک را می پذیرم.", "summary_fa": "فیلیپ براونشتاین، یک توسعه دهنده در لس آنجلس، مایل است عمارت 29,995,000 دلاری خود را با سهام OpenAI یا Anthropic معامله کند. فیلیپ براونشتاین با حسن نیت از Carolwood Estates مایل است عمارت 29,995,000 دلاری خود را با سهام OpenAI یا Anthropic معامله کند. توسعه‌دهنده لس‌آنجلس می‌گوید که بازار لوکس LA و خوش‌بینی هوش مصنوعی او باعث این پیشنهاد شده است. براونشتاین می گوید که او معتقد است که ارزش سهام هوش مصنوعی در طول زمان می تواند چند برابر شود. این مقاله گفته شده بر اساس گفتگو با فیلیپ براونشتاین، رئیس کلوسال پرپرتیز و صاحب خانه در 1210 Chickory Lane در محله برنت وود لس آنجلس است. این دارایی به قیمت 29,995,000 دلار فهرست شده است و سهام OpenAI و Anthropic را به عنوان پرداخت می پذیرد. گفتگو برای طولانی بودن و وضوح ویرایش شده است. من تقریباً 15 سال است که در ساخت و ساز و توسعه املاک و مستغلات بوده ام و همچنین به طور فزاینده ای درگیر سرمایه گذاری در فناوری شده ام. ساختن این خانه را در برنت‌وود در سال 2021 آغاز کردم. این یک اقامتگاه مدرن با معماری تقریباً چهار طبقه است، شامل یک زیرزمین و یک عرشه روی پشت بام با چشم‌اندازی از اقیانوس آرام، مرکز شهر لس‌آنجلس، و موزه گتی. من مقدار زیادی برای ملک گذاشته ام. اما وقتی آن را به بازار عرضه کردم، به این فکر کردم که چه چیز دیگری را می توانم به عنوان پرداخت بپذیرم. من به هوش مصنوعی اعتقاد زیادی دارم و فکر کردم: اگر کسی مقدار قابل توجهی از سهام در OpenAI یا Anthropic دارد، چرا خانه را برای آن معامله نکنیم؟ چرا من برای سهام هوش مصنوعی باز هستم بازار املاک لوکس لس آنجلس کساد بوده است، زیرا بسیاری از کسانی که می توانند چنین املاکی را بخرند با مالیات عمارت منصرف شده اند.", "image_url": "https://i.insider.com/6b00a1990b69407d788a51be?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Google"], "datetime_fa": "۳۰ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I've bought Amtrak's USA Rail Pass 4 times. There are huge perks to using the $499 pass, and a few frustrations.", "link": "https://www.businessinsider.com/amtrak-usa-rail-pass-pros-cons-according-to-frequent-traveler-2026-7", "summary": "I ve bought the Amtrak USA Rail Pass four times. Malia Yoshioka Over the past year and a half, I've purchased Amtrak's $499 USA Rail Pass four times. The pass, which allows me to book 10 train tickets in 30 days, is a great way to see the country. However, delays can throw off my entire itinerary, and I can't book a roomette using the pass. Over the past year and a half, I've traveled through most of the continental US by train. One way I've kept costs down is by taking advantage of Amtrak's $499 USA Rail Pass , which allows 10 train segments — or tickets — within a 30-day period. I've now purchased the pass four times, often combining trips to visit friends, attend conferences, and explore destinations I might otherwise overlook. Although there are definite frustrations with planning and managing a Rail Pass trip, the perks still outweigh the downsides, in my opinion. The pass makes it easy to explore the country. zrfphoto/Getty Images One of my favorite ways to use the pass is to add stops to existing trips. For example, I needed to travel from Chicago to Florida to see my mother for Mother's Day, which already would've cost more than $200 round-trip if I purchased individual train tickets. Flights were similarly priced as well, so I opted to use a Rail Pass and tack on a few extra stops along the way. During the trip, I traveled to Holland, Michigan, for the annual Tulip Time festival, rerouted through Washington, DC, just in time to make the peak blooms of cherry blossom season , and spent 24 hours in Savannah visiting with a friend. The stops really added to the experience and were things I wouldn't have experienced had I flown or bought a single Amtrak ticket. When my train has a Sightseer Lounge, I take full advantage of the views. Malia Yoshioka It's not available on every train, but when it is, I love spending time in the Sightseer Lounge , a spacious public car with panoramic windows to take in the views. There's nothing better than starting my mornings there with a cup of coffee and the sunrise. I've seen passengers writing postcards, knitting, drawing, reading, or (like me) just sitting and taking in the changing scenery out the window. It's the perfect place to slow down. However, when I m using the pass, delays can throw off my entire itinerary. Malia Yoshioka For me, the biggest downside of the USA Rail Pass is managing unexpected delays and cancellations. Although many of my trains have arrived promptly (occasionally even early), I've also ", "date_str": "2026-11-21T13:57:01+00:00", "hash": "3bd8a2b06a5609fd", "title_fa": "من 4 بار پاس قطار آمتراک آمریکا را خریده ام. استفاده از گذرنامه 499 دلاری مزایای بسیار زیادی دارد و چند ناامیدی نیز به همراه دارد.", "summary_fa": "من چهار بار گذرنامه راه آهن آمتراک ایالات متحده را خریده ام. Malia Yoshioka در طول یک سال و نیم گذشته، چهار بار گذرنامه راه آهن آمتراک 499 دلاری آمریکا را خریداری کرده ام. این پاس که به من اجازه می دهد 10 بلیط قطار را در 30 روز رزرو کنم، راهی عالی برای دیدن کشور است. با این حال، تأخیر می‌تواند کل برنامه سفر من را از بین ببرد و من نمی‌توانم با استفاده از گذرنامه اتاقی رزرو کنم. در طول یک سال و نیم گذشته، من بیشتر مناطق قاره آمریکا را با قطار سفر کرده ام. یکی از راه‌هایی که من هزینه‌ها را کاهش داده‌ام، استفاده از گذرنامه راه آهن ۴۹۹ دلاری آمتراک است که به ۱۰ بخش قطار – یا بلیط – در یک دوره ۳۰ روزه اجازه می‌دهد. اکنون چهار بار گذرنامه را خریداری کرده‌ام، اغلب سفرهایی را برای دیدار دوستان، شرکت در کنفرانس‌ها و کاوش در مقاصدی که ممکن است نادیده گرفته باشم ترکیب می‌کند. اگرچه ناامیدی های قطعی در برنامه ریزی و مدیریت یک سفر ریلی وجود دارد، به نظر من مزایای آن همچنان بیشتر از جنبه های منفی آن است. گذرگاه، گشت و گذار در کشور را آسان می کند. zrfphoto/Getty Images یکی از راه‌های مورد علاقه من برای استفاده از پاس، اضافه کردن توقف به سفرهای موجود است. به عنوان مثال، من باید از شیکاگو به فلوریدا سفر کنم تا مادرم را برای روز مادر ببینم، که در حال حاضر بیش از 200 دلار هزینه رفت و برگشت در صورت خرید بلیط قطار جداگانه خواهد داشت. پروازها نیز قیمت‌های مشابهی داشتند، بنابراین من ترجیح دادم از گذرگاه ریلی استفاده کنم و چند ایستگاه اضافی در طول مسیر داشته باشم. در طول این سفر، برای جشنواره سالانه لاله تایم به هلند، میشیگان سفر کردم، مسیر را در واشنگتن دی سی تغییر دادم، درست", "image_url": "https://i.insider.com/6aff2f110b69407d788a47d9?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳۰ آبان • ۱۷:۲۷"}, {"source": "Digiato", "title": "کدام دستگاه‌های سامسونگ احتمالاً آپدیت One UI 9.5 را دریافت می‌کنند؟", "link": "https://digiato.com/app/one-ui-9-5-update-eligible-devices-list", "summary": "این به‌روزرسانی احتمالاً با انیمیشن‌های جدید، ابزارهای تازه Galaxy AI و بهبودهای مختلف همراه خواهد بود. The post کدام دستگاه‌های سامسونگ احتمالاً آپدیت One UI 9.5 را دریافت می‌کنند؟ appeared first on دیجیاتو .", "date_str": "2026-11-21T14:21:00+00:00", "hash": "2c7b9a24035f0ba7", " ichzelf wat minder serieus nemen. Aanvankelijk omschreef Keith de film als Virgin River met explosies , maar daar kwam hij al snel op terug: Ze hebben Calvin in Virgin River op een boot opgeblazen. Cardillo: We hebben in Virgin River al vaak genoeg dingen opgeblazen. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Nieuwe kerstfilm op Netflix is Virgin River 2.0 appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-11-21T15:44:29+00:00", "hash": "02f8d2b3ebaaf7b5", "title_fa": "فیلم جدید کریسمس در نتفلیکس \"رودخانه ویرجین 2.0\" است.", "summary_fa": "البته همه ما ویرجین ریور را می شناسیم. اما فیلم جدید کریسمس نتفلیکس Guarding Stars چه ارتباطی با سریال درام محبوب دارد؟ خب، همانطور که معلوم است بسیار زیاد است. خیلی زیاد! Guarding Stars on Netflix is ​​Virgin River 2.0 Guarding Stars بر اساس کتاب The Bodyguard اثر کاترین سنتر است و بنابراین در دنیای ویرجین ریور جریان ندارد. با این حال، ارین کاردیلو و ریچارد کیث، فیلمنامه‌نویسان فیلم کریسمس، هر دو تهیه‌کننده اجرایی صحنه‌برداری سریال هستند. آنها قصد نداشتند کراس اوور بسازند، اما در طول مسیر شباهت های بیشتری را بین ستاره های نگهبان و رودخانه ویرجین کشف کردند، مانند: جک و جک. نام های جک استپلتون و جک شریدان به قدری شبیه به هم هستند که کیت در حین نوشتن اولین پیش نویس فیلمنامه، به طور تصادفی چندین بار شریدان را یادداشت کرد. دو کانی مادر جک استپلتون، با بازی اندی مک داول، هم نام یکی از مشهورترین ساکنان ویرجین ریور است. دو اسب ویرجین ریور اسب شوگر را بازی می‌کند و کیت اشاره کرد که یک اسب نیز در فیلم وجود دارد. دو روستا روی رودخانه خود نویسندگان به این شباهت اشاره نکردند، اما شهر خیالی در مونتانا که داستان فیلم در آن جریان دارد، High River نام دارد. درام و طنز با این حال Guarding Stars و Virgin River کاملاً یکسان نیستند. به گفته کیت، ویرجین ریور حدود 70 تا 80 درصد درام و 20 تا 30 درصد طنز است. به گفته او، کمدی بیش از حد از صداقتی که سریال را بسیار جذاب می کند، کم می کند. با فیلم Guarding Stars، نویسندگان فضای بیشتری برای خلق شخصیت‌هایی داشتند که خود ew music releases to major announcements and those little important moments, Billboard editors highlight uplifting moments in Latin music. Here’s what happened in the Latin music world this week. Feid, Anthony Ramos Join Macy’s Thanksgiving Day Parade’s 100th Edition Feid and Anthony Ramos are among the performers set to join the 100th Macy’s Thanksgiving Day Parade on Thursday (Nov. 26), bringing Latin music representation to the centennial celebration. The parade begins at 8:30 a.m. ET and will air on NBC and Telemundo, with streaming on Peacock. The lineup also includes Baha Men, Natasha Bedingfield, Blues Traveler, DEVO, Wyclef Jean, Queen Latifah, Keke Palmer, RIIZE and Smash Mouth, with a special Dolly Parton tribute led by Megan Hilty and a featured performance by EJAE. At Herald Square, Megan Moroney and Teddy Swims will perform, while Broadway shows will join in a special celebration. The parade will feature a record 100 inflatables, six new floats and more than 11,000 volunteers and participants for its milestone march. Erika Ender Celebrates 35-Year Career in Panama Panamanian singer-songwriter Erika Ender celebrated her 35-year musical career in Panama with the premiere of a musical based on her life and the presentation of her book, AprEnder El Éxito , which is currently available for pre-order. The musical Erika Ender — written and directed by Venezuelan playwright Benjamín Cohen and featuring a cast of approximately 80 performers — held its grand international premiere on Thursday (Nov. 19) at the National Theater in Panama City. In addition to Ender and her family, the event was attended by prominent figures from the music and entertainment industries, including Desmond Child, Elena Rose, Elvis Crespo, Aymée Nuviola and Diana Reyes, as well as Panamanian boxing legend Roberto Durán. Also in attendance was Randy Cuevas, of the band Rabanes, who was responsible for the musical arrangements for the production. Before the show began, Ender was presented     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
