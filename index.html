understand what’s coming next. Read more from the series here . 10 Climate Tech Companies to Watch: Fervo Energy and its plan to streamline geothermal power Fervo Energy is one of MIT Technology Review’s 10 Climate Tech Companies to Watch 2026 , available exclusively to subscribers . Fervo Energy wants to expand geothermal power beyond the handful of places where it has traditionally been practical. The company uses horizontal drilling and hydraulic fracturing to open pathways through underground rock, potentially making geothermal development possible in far more places. Now, Fervo is betting that AI’s power boom will help scale up enhanced geothermal energy. With a $2.2 billion public offering and an expanded agreement with Google, it plans to build larger plants and drive down costs. But can its approach work beyond Utah and Nevada? Read the full story to find out . —Eshan Raul Subscribers can now access the full 10 Climate Tech Companies to Watch , spanning everything from sustainable cement to shipping containers packed with old EV batteries. The must-reads I’ve combed the internet to find you today’s most fun/important/scary/fascinating stories about technology. 1 A cyberattack overheated fridges at hundreds of French supermarkets Temperatures rose to 120°F, spoiling food and sparking fires. ( BBC ) + The attack has sparked alarm about cyber threats to food security. ( FT $) + It joins a recent wave of cyberattacks and cybercrimes. ( CNBC ) + AI is exacerbating the threats. ( MIT Technology Review ) 2 Meta has laun", "date_str": "2026-10-13T12:00:00+00:00", "hash": "c127bf2e3c26140f", "title_fa": "دانلود: مبادلات مدل باز و وعده انرژی زمین گرمایی", "summary_fa": "آنتروپیک اخیرا گزارشی منتشر کرده است که در آن استدلال می‌کند که یک مدل جدید قدرتمند که توسط شرکت چینی Z.ai منتشر شده است، خطر حمله سایبری بزرگی را به همراه دارد. نگرانی اصلی آن این بود که به صورت رایگان برای دانلود و تغییر برای هر کسی در دسترس است. این هشدار آخرین نقطه اشتعال در بحث بر سر این بود که آیا مدل‌های هوش مصنوعی مرزی باید باز باشند یا پشت درهای آزمایشگاه‌های مرزی نگهداری شوند. حامیان ایمنی هشدار می‌دهند که مدل‌های باز می‌توانند توسط بازیگران بد مورد سوء استفاده قرار گیرند، در حالی که حامیان استدلال می‌کنند که می‌توانند مانع از کنترل این فناوری قدرتمند توسط تعداد انگشت شماری از شرکت‌ها شوند. اینجاست که چرا بحث در مورد هوش مصنوعی باز پیچیده تر از آن چیزی است که به نظر می رسد. این داستان بخشی از MIT Technology Review Explains است، مجموعه‌ای که دنیای پیچیده و آشفته فناوری را باز می‌کند تا به شما در درک آنچه در آینده می‌آید کمک کند. ادامه این سریال را اینجا بخوانید. Fervo Energy یکی از 10 شرکت فناوری اقلیمی MIT Technology Review برای تماشای 2026 است که به طور انحصاری برای مشترکین در دسترس است. Fervo Energy می خواهد نیروی زمین گرمایی را فراتر از تعداد انگشت شماری از مکان هایی که به طور سنتی در آنها عملی بوده است، گسترش دهد. این شرکت از حفاری افقی و شکستگی هیدرولیکی برای باز کردن مسیرها در میان سنگ های زیرزمینی استفاده می کند که به طور بالقوه توسعه زمین گرمایی را در مکان های بسیار بیشتری ممکن می کند. اکنون، Fervo شرط می‌بندد که رونق قدرت هوش مصنوعی به افزایش انرژی زمین گرمایی پیشرفته کمک می‌کند. با عرضه عمومی 2.2 میلیارد دلاری و قرارداد توسعه یافته با گوگل، قصد دارد کارخانه های بزرگتر بسازد و هزینه ها را کاهش دهد. اما"}, {"source": "MIT Tech Review", "title": "Open models have real benefits. Do they outweigh the risks?", "link": "https://www.technologyreview.com/2026/10/13/1146366/open-models-have-real-benefits-do-they-outweigh-the-risks/", "summary": "MIT Technology Review Explains: Let our writers untangle the complex, messy world of science and technology to help you understand what’s coming next. You can read more from the series here . Late last month, Anthropic released a report arguing that the model GLM-5.3 poses a major cyberattack risk. The report’s core concern is that the powerful new model, released in August by the Chinese company Z.ai, is freely available for anyone to download and modify. Anthropic’s assertion is only the latest move in a long-running debate about whether frontier AI models should be made open, like GLM-5.3, or should stay locked behind the doors of the frontier labs. These days, much of the debate about how to handle open models is playing out in public—and there’s a lot of money resting on its outcome. Nvidia CEO Jensen Huang, who has a lot to gain if people continue buying their own hardware to run open models, advocates enthusiastically for the United States to develop more of them, whereas Anthropic’s Dario Amodei, who runs a company that could be undermined by cheap, powerful models, advocates for a more cautious approach. But beneath all these commercial incentives, there is real substance to disagreements about open models. “I think a lot of the way you come down on the openness debate is influenced by how you come down on the AI debate,” says David Gray Widder, an assistant professor at the University of Texas at Austin School of Information. Those who are concerned about AI safety warn that open models can easily be misused by bad actors, whereas those who focus more on AI’s practical potential urge that this power should not sit behind the closed doors of just a few big companies, and that open models could help spread it more widely. There are a range of ways to handle open models between banning them entirely and releasing them willy-nilly. But any approach that a government or a society might take still involves trade-offs between safety and democratization. Deciding whether to support or limit the production of open models requires understanding those risks and benefits in depth. What are the benefits of open models? Let’s start with the basics. A closed model, like the models that power ChatGPT and Claude, can only be accessed through a website, app, or API. An open model, on the other hand, can be directly downloaded: The details about its internal structure, encoded in a long series of numbers known as the model weights, are publicly available. Such mode", "date_str": "2026-10-13T10:00:00+00:00", "hash": "83a2348d12d5c6b8", "title_fa": "مدل های باز مزایای واقعی دارند. آیا آنها بیشتر از خطرات هستند؟", "summary_fa": "بررسی فناوری MIT توضیح می‌دهد: به نویسندگان ما اجازه دهید دنیای پیچیده و آشفته علم و فناوری را بگشایند تا به شما در درک آنچه در آینده می‌آید کمک کنند. می توانید اطلاعات بیشتری از این سریال را در اینجا بخوانید. اواخر ماه گذشته، Anthropic گزارشی منتشر کرد که در آن استدلال می‌کرد که مدل GLM-5.3 خطر حمله سایبری بزرگی را به همراه دارد. نگرانی اصلی این گزارش این است که مدل قدرتمند جدید، که در ماه آگوست توسط شرکت چینی Z.ai منتشر شد، به‌طور رایگان برای دانلود و تغییر برای همه در دسترس است. ادعای آنتروپیک تنها آخرین اقدام در یک بحث طولانی مدت در مورد اینکه آیا مدل‌های هوش مصنوعی مرزی باید باز باشند، مانند GLM-5.3 یا باید پشت درهای آزمایشگاه‌های مرزی قفل شوند. این روزها، بسیاری از بحث‌ها در مورد نحوه برخورد با مدل‌های باز در انظار عمومی مطرح می‌شود - و پول زیادی به نتیجه آن بستگی دارد. جنسن هوانگ، مدیرعامل انویدیا، که اگر مردم به خرید سخت‌افزار خود برای اجرای مدل‌های باز ادامه دهند، چیزهای زیادی به دست می‌آورد، مشتاقانه از ایالات متحده برای توسعه بیشتر آن‌ها حمایت می‌کند، در حالی که Dario Amodei از Anthropic، که شرکتی را اداره می‌کند که ممکن است توسط مدل‌های ارزان و قدرتمند تضعیف شود، از رویکرد محتاطانه‌تری حمایت می‌کند. اما در زیر همه این مشوق‌های تجاری، اختلافات واقعی در مورد مدل‌های باز وجود دارد. دیوید گری وایدر، استادیار دانشگاه تگزاس در دانشکده اطلاعات آستین، می‌گوید: «من فکر می‌کنم بسیاری از روش‌هایی که شما در بحث باز بودن صحبت می‌کنید، تحت تأثیر نحوه برخورد شما با بحث هوش مصنوعی است. کسانی که نگران ایمنی هوش مصنوعی هستند هشدار می‌دهند که مدل‌های باز می‌توانند به راحتی توسط بازیگران بد مورد سوء استفاده قرار گیرند، در حالی که کسانی که بیشتر بر پتانسیل عملی هوش مصنوعی تمرکز می‌کنند اصرار دارند که"}, {"source": "MIT Tech Review", "title": "AI labs are buying data from dead startups to train their models", "link": "https://www.technologyreview.com/2026/10/13/1145755/ai-labs-buying-data-from-dead-startups-to-train-models/", "summary": "When Keelan Miskell began winding down his crypto startup this year, he didn’t think its data was worth much: the users were anonymous, the company just a few years old. But he’s since turned the firm’s digital archives into real money. He’s netted roughly $25,000 for his code base and a still-pending amount (likely around $15,000) for the workspace data in Google, Notion, Figma, and Slack. “At least all that stuff we were doing for two and a half years is worth something to someone somewhere,” he says. The sale was brokered by a company called SimpleClosure, part of a new growth sector in tech: businesses catering to dying startups. Estimates from Carta and AngelList show shutdowns rising between 26% and 56% annually in recent years, and an end-of-life ecosystem—including coaches, “death doulas,” and firms that help handle the legal, tax, and operational headaches of going ­belly-up—has emerged. Now tech undertakers are selling the data remains to AI labs. SimpleClosure added data sales to its services in April. Its Asset Hub platform helps founders sell their code and workspace data—emails, chats, documents. Buyers include foundation AI labs, vendors that construct simulated workspaces for AI training, and mature tech companies building their own models. Asset Hub has handled over 150 deals and expects to return over $10 million to startups by the end of 2026. CEO Dori Yona has seen these transactions, once rare and “somewhat taboo,” become increasingly routine, with 47% of SimpleClosure deals now including code or data sales. And it’s got company. Industry rival Sunset also has a rapidly growing data resale business. Founder and CEO Brendan Mahony says Sunset values a dying client’s assets by head count, years in operation, volume of data, and how the team used its tools. Particle board, he says, is a good analogy: “This operational exhaust data is like the wood shavings that everyone thought had no value, but it actually has a ton.” Demand for defunct companies’ data emerged suddenly last year, as AI training labs hit the limits of public and synthetic datasets. Surge AI, for example, buys data to build “reinforcement-learning gyms” where clients’ AI agents practice tasks—think debugging a complex IT architecture or drafting appellate briefs. Nick Heiner, who leads the company’s work on these environments, says he seeks data archives reflecting a range of situations, from disagreements to tricky judgment calls. Heiner explains that one company’s Slack ", "date_str": "2026-10-13T09:00:00+00:00", "hash": "4ac7e898baa3e4c4", "title_fa": "آزمایشگاه‌های هوش مصنوعی داده‌هایی را از استارت‌آپ‌های مرده می‌خرند تا مدل‌هایشان را آموزش دهند", "summary_fa": "زمانی که کیلان میسکل شروع به تعطیلی استارتاپ کریپتو خود کرد، فکر نمی‌کرد داده‌های آن ارزش زیادی داشته باشد: کاربران ناشناس بودند، شرکت فقط چند سال قدمت داشت. اما او از آن زمان بایگانی دیجیتال شرکت را به پول واقعی تبدیل کرده است. او تقریباً 25000 دلار برای پایه کد خود و مبلغ معلق (احتمالاً حدود 15000 دلار) برای داده های فضای کاری در Google، Notion، Figma و Slack به دست آورده است. او می‌گوید: «حداقل تمام کارهایی که ما برای دو سال و نیم انجام می‌دادیم برای کسی در جایی ارزش دارد. این فروش توسط شرکتی به نام SimpleClosure، بخشی از یک بخش رشد جدید در فناوری: کسب‌وکارهایی که به استارت‌آپ‌های در حال مرگ خدمات می‌دهند، انجام شد. تخمین‌های Carta و AngelList نشان می‌دهد که تعطیلی‌ها بین ۲۶ تا ۵۶ درصد سالانه در سال‌های اخیر افزایش می‌یابد، و یک اکوسیستم پایان عمر - از جمله مربیان، «دولاهای مرگ» و شرکت‌هایی که به مدیریت سردردهای قانونی، مالیاتی و عملیاتی ناشی از بالا رفتن شکم کمک می‌کنند- پدید آمده است. اکنون متصدیان امور فناوری بقایای داده ها را به آزمایشگاه های هوش مصنوعی می فروشند. SimpleClosure در ماه آوریل فروش داده را به خدمات خود اضافه کرد. پلت فرم Asset Hub آن به بنیانگذاران کمک می کند تا کد و داده های فضای کاری خود را بفروشند - ایمیل ها، چت ها، اسناد. خریداران شامل آزمایشگاه‌های بنیادی هوش مصنوعی، فروشندگانی هستند که فضاهای کاری شبیه‌سازی‌شده برای آموزش هوش مصنوعی می‌سازند، و شرکت‌های فناوری بالغ که مدل‌های خود را می‌سازند. Asset Hub بیش از 150 معامله انجام داده است و انتظار دارد تا پایان سال 2026 بیش از 10 میلیون دلار به استارت آپ ها بازگرداند. مدیر عامل Dori Yona شاهد بوده است که این تراکنش ها که زمانی نادر و \"تا حدی تابو\" بودند، به طور فزاینده ای عادی شده اند"}, {"source": "Business Insider", "title": "Apple's first smart home device, the HomeView, is here", "link": "https://www.businessinsider.com/apple-homeview-smart-home-device-price-features-2026-10", "summary": "Apple has unveiled HomeView. Apple. Apple's first smart home device is here. The Apple HomeView is a new device with a screen and speaker that acts as a control hub for your connected home devices. It's the latest attempt by Apple to make its ecosystem more \"sticky,\" or harder to leave. Apple has officially entered into a new product category: the smart home. The company on Tuesday announced the HomeView, a new AI-powered connected hub designed to reside in your home and control your connected home accessories. The device consists of a 7-inch screen that sits atop a speaker base and works with Siri. \"Apple HomeView is designed to be shared by everyone in the home yet feel completely personal to each user,\" said Greg Joswiak, Apple's senior vice president of Worldwide Marketing, said in a statement. The product, he said, \"recognizes your face to shift from a household screen to your own experience, fills the room with incredible sound, keeps you connected to the people who matter most with FaceTime, and makes it easy to control your smart home.\" Apple's new HomeView is priced at $299, with preorders opening Tuesday ahead of a November 13 launch. It's the second major new device announced under new Apple CEO John Ternus, who took over for Tim Cook in September ahead of the company's iPhone event. At that event, Ternus also unveiled the first folding smartphone, the iPhone Duo, which begins preorders later this week. While Apple has long supported the smart home ecosystem with its HomeKit standard that third-party device makers could choose to use to help their devices more seamlessly integrate with the iPhone, the HomeView underscores that Apple views the smart home market as one worth competing in with its own hardware. If the new device takes off, a consumer moving outside the Apple ecosystem — or \"breaking up with Apple\" for Amazon or Samsung or Google or another rival — becomes a harder decision. Apple is famous for deeply integrated software and hardware. This is a developing story… Read the original article on Business Insider", "date_str": "2026-10-13T13:11:26+00:00", "hash": "10fe2feb6fd45ae8", "title_fa": "اولین دستگاه خانگی هوشمند اپل، HomeView، اینجاست", "summary_fa": "اپل از HomeView رونمایی کرد. اپل. اولین دستگاه خانه هوشمند اپل اینجاست. Apple HomeView یک دستگاه جدید با صفحه نمایش و بلندگو است که به عنوان یک مرکز کنترل برای دستگاه های خانگی متصل شما عمل می کند. این آخرین تلاش اپل برای چسباندن اکوسیستم خود یا ترک آن سخت تر است. اپل رسما وارد دسته بندی محصولات جدید شده است: خانه هوشمند. این شرکت روز سه شنبه HomeView را معرفی کرد، یک هاب متصل جدید با هوش مصنوعی که برای اقامت در خانه شما و کنترل لوازم جانبی خانه متصل شما طراحی شده است. این دستگاه از یک صفحه نمایش 7 اینچی تشکیل شده است که در بالای پایه بلندگو قرار گرفته و با سیری کار می کند. Greg Joswiak، معاون ارشد بازاریابی جهانی اپل در بیانیه‌ای گفت: «Apple HomeView طوری طراحی شده است که توسط همه افراد در خانه به اشتراک گذاشته شود و در عین حال برای هر کاربر کاملا شخصی باشد. به گفته او، این محصول چهره شما را تشخیص می‌دهد تا از صفحه‌نمایش خانگی به تجربه شخصی شما تغییر کند، اتاق را با صدایی باورنکردنی پر می‌کند، شما را با افرادی که بیشترین اهمیت را برای FaceTime دارند در ارتباط نگه می‌دارد و کنترل خانه هوشمندتان را آسان می‌کند. هوم ویو جدید اپل ۲۹۹ دلار قیمت دارد و پیش‌سفارش‌ها از سه‌شنبه قبل از عرضه در ۱۳ نوامبر آغاز می‌شود. این دومین دستگاه جدید بزرگی است که تحت مدیریت جان ترنوس، مدیر عامل جدید اپل، که در سپتامبر قبل از رویداد آیفون این شرکت، تیم کوک را بر عهده گرفت، معرفی شد. در آن رویداد، ترنوس همچنین از اولین گوشی هوشمند تاشو، iPhone Duo، رونمایی کرد که پیش‌فروش آن اواخر این هفته آغاز می‌شود. در حالی که اپل مدت‌هاست از اکوسیستم خانه‌های هوشمند با استاندارد HomeKit خود پشتیبانی می‌کند که سازندگان دستگاه‌های شخص ثالث می‌توانند برای"}, {"source": "Business Insider", "title": "Delta delays first-ever direct US to Saudi Arabia flights after airport missile strikes", "link": "https://www.businessinsider.com/delta-air-lines-delays-us-saudi-arabia-route-houthi-attacks-2026-10", "summary": "Delta has pushed back the launch of the first-ever direct US-to-Saudi Arabia flight. Massimo Insabato/Archivio Massimo Insabato/Mondadori Portfolio via Getty Images Delta Air Lines planned to launch a route from Atlanta to Riyadh later this month. The Saudi capital's airport has suffered a number of Houthi missile attacks recently. Delta has postponed the new route until next March. Delta Air Lines is delaying the launch of its new route to Saudi Arabia's capital, Riyadh, following recent Houthi missile attacks on the city's airport. The route, which would have started in Atlanta, was scheduled to begin on October 23 with a week of daily service before moving to three times a week. It was set to be the first non-stop flight between the US and Saudi Arabia. \"Saudi Arabia remains an important market for Delta, and we are committed to serving the Kingdom for the long-term,\" the airline said. Delta said the flights will now start in March 2027, though it did not specify an exact start date. \"The safety and security of our customers and employees always come first and continue to guide our operational decisions,\" Delta said in its announcement. \"We remain in close contact with relevant government and aviation partners, including Saudia and Riyadh Air, as we monitor the situation.\" Riyadh's King Khalid International Airport has suffered a number of attacks in recent weeks. On Saturday, hundreds were wounded, and 13 people were killed by a missile strike. The following day, another strike killed one person and injured about a dozen. The Houthis, who are backed by Iran, have been attacking Saudi Arabia after gaining control of a key strait in the Red Sea. Delta's decision came after the Federal Aviation Administration issued a warning for US airlines on Sunday. \"Threats could pose a potential risk to aircraft at all altitudes, including overflight, the arrival, and departure phases of flight,\" the FAA said. As recently as last Thursday, Delta CEO Ed Bastian said that the airline was weighing whether to postpone the route. \"Safety is going to make the call,\" he told CNBC. Read the original article on Business Insider", "date_str": "2026-10-13T13:08:12+00:00", "hash": "90b202cf97a85f27", "title_fa": "دلتا اولین پرواز مستقیم آمریکا به عربستان سعودی را پس از حملات موشکی فرودگاه به تاخیر انداخت", "summary_fa": "دلتا راه اندازی اولین پرواز مستقیم آمریکا به عربستان را به تعویق انداخت. Massimo Insabato/Archivio Massimo Insabato/Mondadori Portfolio از طریق Getty Images خطوط هوایی دلتا قصد داشت تا اواخر این ماه مسیری را از آتلانتا به ریاض راه اندازی کند. فرودگاه پایتخت عربستان سعودی اخیرا مورد حملات موشکی حوثی ها قرار گرفته است. دلتا مسیر جدید را به ماه مارس آینده موکول کرده است. خطوط هوایی دلتا در پی حملات موشکی اخیر حوثی ها به فرودگاه این شهر، راه اندازی مسیر جدید خود به ریاض، پایتخت عربستان سعودی را به تعویق انداخت. این مسیر، که از آتلانتا آغاز می شد، قرار بود در 23 اکتبر با یک هفته خدمات روزانه آغاز شود و سپس به سه بار در هفته حرکت کند. قرار بود این اولین پرواز بدون توقف بین آمریکا و عربستان سعودی باشد. این شرکت هواپیمایی گفت: \"عربستان سعودی بازار مهمی برای دلتا باقی می ماند و ما متعهد هستیم که در درازمدت به این کشور خدمت کنیم.\" دلتا گفت این پروازها اکنون در مارس 2027 آغاز می شود، اگرچه تاریخ دقیق شروع آن را مشخص نکرده است. دلتا در اطلاعیه خود گفت: \"ایمنی و امنیت مشتریان و کارمندان ما همیشه در اولویت قرار دارد و همچنان تصمیمات عملیاتی ما را هدایت می کند.\" ما همچنان در ارتباط نزدیک با دولت و شرکای مربوط به هوانوردی، از جمله عربستان سعودی و ریاض ایر، همچنان که وضعیت را رصد می کنیم، ادامه می دهیم.» فرودگاه بین‌المللی ملک خالد ریاض در هفته‌های اخیر شاهد حملات متعددی بوده است. روز شنبه صدها نفر مجروح و 13 نفر بر اثر حمله موشکی کشته شدند. روز بعد، یک حمله دیگر یک نفر کشته و حدود ده ها زخمی شدند. حوثی‌ها که از سوی ایران حمایت می‌شوند، پس از به دست گرفتن کنترل یک تنگه کلیدی در دریای سرخ، به عربستان سعودی حمله کردند. تصمیم"}, {"source": "Business Insider", "title": "Mark Zuckerberg and Alexandr Wang don't seem to like Guinness very much", "link": "https://www.businessinsider.com/mark-zuckerberg-and-alexandr-wang-dont-seem-sold-on-guinness-2026-10", "summary": "Guinness is a dark Irish stout with a bitter, roasted taste that some drinkers compare to coffee or dark chocolate. Artur Widak/NurPhoto via Getty Images Mark Zuckerberg and Alexandr Wang's drank Guinness and talked tech with Stripe's John Collison. Neither of the Meta execs really seemed to enjoy drinking the malty Irish beer. A clip of Zuckerberg sipping his pint and looking somewhat uncomfortable went viral on X. Mark Zuckerberg and Alexandr Wang joined Stripe cofounder John Collison for a beer on the latest episode of \"Cheeky Pint\" — but viewers aren’t convinced the Meta executives were converted to Guinness. Zuckerberg and Wang spent 134 minutes on the podcast discussing Meta’s AI ambitions, including the company’s new Muse product and its massive spending plans. As is customary on Collison’s interview series, the discussion took place over pints of Guinness, an Irish dry stout , known for its rich, malty, and slightly bitter taste. The episode began with a series of cheers between Collison, Zuckerberg, and Wang. Later, Zuckerberg revealed that he brought his host a keg of Guinness from Dublin. The exchange has drawn attention after viewers shared clips of Zuckerberg and Wang drinking the stout. In the footage, Zuckerberg takes a slow sip and swills it around in his mouth, before appearing to wince — a moment that prompted comments about whether he was enjoying it. Social-media users were quick to focus on Zuckerberg’s expression after the sip. Commentator Ed Zitron joked that he should \"spit it out and say 'eww!!!!'\" very normal mark. very good. next time spit it out and say \"eww!!!!\" https://t.co/9mooYdxLl4 — Ed Zitron (@edzitron) October 12, 2026 Another user wrote that Zuckerberg appeared to be thinking: \"Wow, that’s nasty.\" you can see him go “wow that’s nasty” in his head https://t.co/CltmjtohCR — gaut (@0xgaut) October 12, 2026 The clip was also shared to the r/Sipstea subreddit with the caption \"Mark Zuckerberg pretending to enjoy Guinness.\" One user observed, \"Never seen someone try and chew a Guinness.\" Although for those who do not enjoy the trademark acquired taste that is Guinness, Zuckerberg's reaction seemed somewhat relatable, with one user noting, \"That was the most normal thing I've ever seen him do, actually.\" Meta did not immediately respond to a request for comment on Zuckerberg and Wang's thoughts on the taste of Guinness. Elon Musk outdrank Zuckerberg on 'Cheeky Pint' Tyler Cosgrove, who works on the TBPN podcast, watched the fu", "date_str": "2026-10-13T12:05:40+00:00", "hash": "dcb66d84824c12cd", "title_fa": "مارک زاکربرگ و الکساندر وانگ ظاهراً گینس را زیاد دوست ندارند", "summary_fa": "گینس یک گیاه تیره ایرلندی با طعم تلخ و برشته است که برخی از نوشیدنی‌ها آن را با قهوه یا شکلات تلخ مقایسه می‌کنند. Artur Widak/NurPhoto از طریق Getty Images مارک زاکربرگ و الکساندر وانگ گینس نوشیدند و با جان کولیسون از استرایپ در مورد فناوری صحبت کردند. هیچ یک از مدیران متا واقعاً از نوشیدن آبجو مالت دار ایرلندی لذت نمی بردند. کلیپی از زاکربرگ که در حال نوشیدن پینت خود و ظاهری ناخوشایند به نظر می رسد در X در فضای مجازی پخش شد. مارک زاکربرگ و الکساندر وانگ برای نوشیدن آبجو در آخرین قسمت سریال «Cheeky Pint» به جان کولیسون، بنیانگذار استرایپ پیوستند - اما بینندگان متقاعد نشده‌اند که مدیران متا به گینس تبدیل شده‌اند. زاکربرگ و وانگ 134 دقیقه را در پادکست صرف کردند و در مورد جاه‌طلبی‌های هوش مصنوعی متا، از جمله محصول جدید Muse این شرکت و برنامه‌های هزینه‌های عظیم آن بحث کردند. همانطور که در مجموعه مصاحبه‌های Collison مرسوم است، بحث در مورد گینس، یک گیاه خشک ایرلندی، که به خاطر طعم غنی، مالت‌آلود و کمی تلخش معروف است، انجام شد. این قسمت با یک سری تشویق های بین کولیسون، زاکربرگ و وانگ آغاز شد. بعداً زاکربرگ فاش کرد که برای میزبانش یک بشکه گینس از دوبلین آورده است. این تبادل نظر پس از اینکه بینندگان کلیپ هایی از زاکربرگ و وانگ در حال نوشیدن چاقوی تنومند را به اشتراک گذاشتند، جلب توجه کرد. در این فیلم، زاکربرگ جرعه‌ای آهسته می‌نوشد و آن را در دهانش می‌چرخاند، قبل از اینکه به نظر برسد در حال خمیدن است - لحظه‌ای که باعث شد نظراتی در مورد اینکه آیا از آن لذت می‌برد یا خیر. کاربران رسانه های اجتماعی پس از جرعه جرعه به سرعت روی بیان زاکربرگ تمرکز کردند. مفسر اد زیترون به شوخی گفت که او باید \"آن را تف کند و بگوید"}, {"source": "Business Insider", "title": "This Y Combinator startup raised $6.1 million to let product managers and designers ship code. See its pitch deck.", "link": "https://www.businessinsider.com/lightsprint-secures-funding-ai-coding-for-non-techies-2026-10", "summary": "Lightsprint raised a $6.1 million seed round to build its coding product and hire more talent. Lightsprint Lightsprint raised $6.1 million to empower non-engineers, such as designers, to edit codebases. Lightsprint's product turns plain English into code and prototypes. Check out the pitch deck that the Y Combinator startup used to secure the funding. The way engineers, product managers, and designers work together is still slow and janky, says one Y Combinator-backed startup . Now, it's raised $6.1 million to help non-engineers directly make changes to a company's existing codebase using AI agents. San Francisco-based Lightsprint said its software can turn a plain English request into a reviewable pull request, which is a proposed code change that engineers inspect before merging it into production. This allows non-technical staffers such as product managers (PMs), designers, and operations workers to get more directly involved in shipping software. \"We found that actually there were a lot of PMs like me as well as designers who actually really wanted to shift to production,\" Benjamin Ong, Lightsprint's cofounder and CEO, told Business Insider. AI has changed the work of designers and product managers. Designers increasingly use generative AI tools to make early concepts and prototypes faster, while product managers are using agents and vibe-coding tools. The US Bureau of Labor Statistics projects a 5% growth in web and digital interface designer employment from 2025 to 2035. Ong said software development has traditionally involved a long chain of handoffs: a product manager writes a requirements document, engineers assess technical feasibility, designers create mockups, and engineers ultimately rebuild the feature in code. That could take up to two to three months. The startup, which Ong, Benedict Chan, and Heng Hong Lee founded earlier this year, is positioning itself against the fragmented tools many companies use to build products — including prototyping software such as Lovable, design software like Figma, and coding assistants such as Anthropic's Claude. Lightsprint says it's a one-stop shop that connects to a company's existing code. Then its agents can write product requirements documents, generate code, and create live previews. After, human engineers can review the code and decide whether to add it to their software. The startup began working with early users in April and now works with over 100 companies. Lightsprint went through Y Combinator's", "date_str": "2026-10-13T12:00:01+00:00", "hash": "4b517ec72b93eac6", "title_fa": "این استارت آپ Y Combinator 6.1 میلیون دلار جمع آوری کرد تا به مدیران محصول و طراحان اجازه ارسال کد را بدهد. عرشه زمین آن را ببینید.", "summary_fa": "Lightsprint برای ساخت محصول کدنویسی خود و استخدام استعدادهای بیشتر، مبلغ 6.1 میلیون دلار سرمایه جمع آوری کرد. Lightsprint Lightsprint 6.1 میلیون دلار جمع آوری کرد تا به افراد غیرمهندس، مانند طراحان، برای ویرایش پایگاه های کد قدرت دهد. محصول Lightsprint انگلیسی ساده را به کد و نمونه اولیه تبدیل می کند. طرحی را که استارت‌آپ Y Combinator برای تأمین بودجه استفاده کرده است، بررسی کنید. یکی از استارت‌آپ‌های Y Combinator می‌گوید که روشی که مهندسان، مدیران محصول و طراحان با هم کار می‌کنند هنوز کند و بی‌نظیر است. اکنون، 6.1 میلیون دلار جمع آوری شده است تا به افراد غیرمهندس کمک کند تا با استفاده از عوامل هوش مصنوعی، مستقیماً در پایگاه کد موجود یک شرکت تغییراتی ایجاد کنند. Lightsprint مستقر در سانفرانسیسکو گفت که نرم افزار آن می تواند یک درخواست انگلیسی ساده را به یک درخواست کشش قابل بررسی تبدیل کند، که یک تغییر کد پیشنهادی است که مهندسان قبل از ادغام آن در تولید، آن را بررسی می کنند. این به کارکنان غیر فنی مانند مدیران محصول (PMs)، طراحان و کارکنان عملیات اجازه می دهد تا مستقیماً در نرم افزار حمل و نقل درگیر شوند. بنجامین اونگ، یکی از بنیانگذاران و مدیرعامل Lightsprint، به Business Insider گفت: «ما متوجه شدیم که در واقع تعداد زیادی از PM ها مانند من و همچنین طراحانی وجود داشتند که واقعاً می خواستند به سمت تولید حرکت کنند. هوش مصنوعی کار طراحان و مدیران محصول را تغییر داده است. طراحان به طور فزاینده‌ای از ابزارهای مولد هوش مصنوعی برای سریع‌تر ساختن مفاهیم اولیه و نمونه‌های اولیه استفاده می‌کنند، در حالی که مدیران محصول از عوامل و ابزارهای کدگذاری vibe استفاده می‌کنند. اداره آمار کار ایالات متحده رشد 5 درصدی را در استخدام طراحان رابط دیجیتالی و وب از سال 2025 تا 2035 پیش بینی کرده است. اونگ گفت که توسعه"}, {"source": "Business Insider", "title": "Ukraine's Operation Vivaldi shows why artillery still matters in a drone fight", "link": "https://www.businessinsider.com/ukraine-operation-vivaldi-artillery-key-drones-2026-10", "summary": "Ukraine is using artillery systems like the US-made HIMARS in key roles to take back territory from Russia in a major new operation. Serhii Mykhalchuk/Global Images Ukraine via Getty Images Artillery is playing a key role in a major operation to push back Russian forces. Drones dominate the battlefield, but artillery is still proving indispensable. A lead combat unit said it used heavy artillery to stop Russia from bringing up reserves, equipment, and ammo. Ukraine's Operation Vivaldi, a major counteroffensive push to retake territory in the east, is showing that even as drones transform the battlefield , artillery remains an important tool for holding gains and keeping the enemy off balance. Unfolding near the city of Lyman, Operation Vivaldi has relied on drones and robotic systems , as well as some new battlefield tactics, to achieve key wins, but artillery has also been important to the operation's success. Ukrainian forces had recaptured 176 square kilometers of territory by the end of September, according to the Third Army Corps, the lead unit. The Institute for the Study of War, a US think tank, wrote on Friday that reports indicate that Ukrainian forces \"heavily relied on artillery strikes in order to prevent Russian forces from regaining lost positions during Operation Vivaldi.\" It said those efforts demonstrated \"how artillery remains relevant even in modern, drone-dominated battlefield conditions. \" The ISW assessment cited an update from the Third Army Corps that said it had, for the purpose of executing this operation, \"assembled one of the largest artillery formations of any corps — deploying so many systems per kilometer of the front that fire could be maintained continuously, even if individual guns were knocked out.\" The unit said its \"artillery turned 'Vivaldi' into a kill zone for the enemy!\" Drones worked with artillery to find targets that the artillery then destroyed, the unit said. \"The artillery deprived the enemy of the ability to maneuver or return fire, allowing the Third Corps' assault troops to keep pushing forward.\" It said that the 52nd Separate Artillery Brigade and the rocket artillery units of multiple brigades were able to keep multiple settlements under fire. \"Russian forces could not bring up reserves, equipment, or ammunition to try to restore their lost positions.\" The Third Army Corps said strikes by Ukrainian HIMARS, the US-made High Mobility Artillery Rocket System , destroyed more than 20 artillery guns, two Buk a", "date_str": "2026-10-13T11:58:50+00:00", "hash": "6286450cc616e9b2", "title_fa": "عملیات ویوالدی اوکراین نشان می دهد که چرا توپخانه هنوز در نبرد هواپیماهای بدون سرنشین اهمیت دارد", "summary_fa": "اوکراین از سیستم های توپخانه ای مانند HIMARS ساخت ایالات متحده در نقش های کلیدی برای بازپس گیری سرزمینی از روسیه در یک عملیات بزرگ جدید استفاده می کند. سرهی میخالچوک/ تصاویر جهانی اوکراین از طریق گتی ایماژ توپخانه نقشی کلیدی در عملیات بزرگ برای عقب راندن نیروهای روسی ایفا می کند. هواپیماهای بدون سرنشین بر میدان جنگ تسلط دارند، اما توپخانه همچنان ضروری است. یک واحد رزمی پیشرو گفت که از توپخانه سنگین استفاده کرده تا روسیه را از آوردن ذخایر، تجهیزات و مهمات باز دارد. عملیات ویوالدی اوکراین، یک فشار ضد تهاجمی بزرگ برای بازپس گیری قلمرو در شرق، نشان می دهد که حتی زمانی که هواپیماهای بدون سرنشین میدان نبرد را تغییر می دهند، توپخانه همچنان ابزار مهمی برای حفظ دستاوردها و حفظ تعادل دشمن است. عملیات ویوالدی که در نزدیکی شهر لیمان آشکار می‌شود، برای دستیابی به پیروزی‌های کلیدی بر هواپیماهای بدون سرنشین و سیستم‌های روباتیک و همچنین برخی تاکتیک‌های جدید در میدان نبرد تکیه کرده است، اما توپخانه نیز برای موفقیت این عملیات مهم بوده است. به گفته سپاه سوم ارتش، یگان اصلی، نیروهای اوکراینی تا پایان سپتامبر 176 کیلومتر مربع از قلمرو را بازپس گرفتند. مؤسسه مطالعات جنگ، یک اندیشکده آمریکایی، روز جمعه نوشت که گزارش ها نشان می دهد که نیروهای اوکراینی \"به شدت به حملات توپخانه ای متکی بودند تا از بازپس گیری مواضع از دست رفته نیروهای روسی در عملیات ویوالدی جلوگیری کنند.\" این سازمان می‌گوید این تلاش‌ها نشان می‌دهد که «چگونه توپخانه حتی در شرایط مدرن و تحت سلطه پهپادهای میدان جنگ مرتبط باقی می‌ماند. ارزیابی ISW به یک به‌روزرسانی از سپاه سوم ارتش اشاره کرد که می‌گوید برای اجرای این عملیات، «یکی از بزرگترین تشکل‌های توپخانه‌ای را در بین هر سپاهی جمع‌آوری کرده است - سیستم‌های زیادی در هر کیلومتر از جبهه مستقر می‌کند که می‌توان آتش را به"}, {"source": "Business Insider", "title": "I've been working at Katz's Deli since I was 7. I hope my kids will join the family business.", "link": "https://www.businessinsider.com/katzs-delicatessen-owner-family-business-history-2026-10", "summary": "Jake Dell started working at Katz s Deli when he was 7. Astrid Stawiarz/Getty Images for NYCWFF Jake Dell grew up at Katz's Delicatessen, which his family took over in 1988. He planned to become a doctor before deciding to join the family business. Now he runs the iconic NYC deli and hopes one of his children will take over someday. This interview is based on a conversation with Jake Dell, 39, the owner of Katz's Delicatessen in New York City. It has been edited for length and clarity. I've been coming to Katz's Delicatessen since before I could crawl. My grandfather, father, and uncle took over the deli in 1988, 100 years after it was originally established. My dad would often be here six or seven days a week, so I would come down here all the time. I remember being around 7 and working at the soda station . I had my 6th birthday at Katz's. We invited my whole first-grade class and had a table at the back. My parents had organized a magician. We ate hot dogs and had a great time. They didn't have to close the restaurant for that, as we weren't as globally famous as we are now. That iconic \"When Harry Met Sally\" scene with Meg Ryan and Billy Crystal still draws people here nearly 40 years on. When you rewatch the original scene, nowhere does it say \"Katz's\" — but our regulars knew us right away. We get people reenacting it, and we've had people propose at the same table. They did close the deli for my bar mitzvah . We had about 100 guests, but it still wasn't a fancy affair. People went up to the counter and ordered whatever sandwiches they wanted. We had a dance floor at the back. The meat cutters are our most highly paid store staff I officially picked up a meat carving knife at the age of 21. To be a meat cutter, you have to work your way through the different stations, so by the time you get to that point, you'll usually have been working here for 10 or more years. Ultimately, it's not a skill that needs a Ph.D. to learn. But that role represents such an important part of our business. It's about values and whether that person has become family here. The cutters are our most highly paid store staff. I had actually planned to study medicine and become a doctor. I had taken all the pre-med classes in college, and I was getting ready to interview for med school while I was working here. I took a gap year between college and medical school, and continued working at Katz's. That's when I had to think about whether I wanted to take my own path or go into the", "date_str": "2026-10-13T11:44:01+00:00", "hash": "61cb70952d7206bb", "title_fa": "من از 7 سالگی در Katz's Deli کار کرده ام. امیدوارم بچه هایم به تجارت خانوادگی بپیوندند.", "summary_fa": "جیک دل زمانی که 7 ساله بود در Katz s Deli شروع به کار کرد. آسترید استاویارز/گتی ایماژ برای NYCWFF جیک دل در اغذیه فروشی کاتز بزرگ شد که خانواده اش در سال 1988 مدیریت آن را بر عهده گرفتند. او قصد داشت قبل از اینکه تصمیم بگیرد به تجارت خانوادگی بپیوندد، پزشک شود. اکنون او اغذیه فروشی نمادین نیویورک را اداره می کند و امیدوار است که روزی یکی از فرزندانش مسئولیت را بر عهده بگیرد. این مصاحبه بر اساس گفتگو با جیک دل، 39 ساله، صاحب اغذیه فروشی کاتز در شهر نیویورک است. برای طول و وضوح ویرایش شده است. من از قبل از اینکه بخزیم به اغذیه فروشی کاتز می آمدم. پدربزرگ، پدر و عمویم در سال 1988، 100 سال پس از تأسیس اغذیه فروشی، اداره اغذیه فروشی را به دست گرفتند. پدرم اغلب شش یا هفت روز در هفته اینجا بود، بنابراین من همیشه اینجا می آمدم. یادم می آید حدود 7 بودم و در ایستگاه نوشابه کار می کردم. من تولد 6 سالگی ام را در کاتز داشتم. کل کلاس کلاس اولم را دعوت کردیم و پشتش یک میز گذاشتیم. پدر و مادرم یک شعبده باز ترتیب داده بودند. هات داگ خوردیم و خیلی خوش گذشت. آنها مجبور نبودند رستوران را برای این کار ببندند، زیرا ما به اندازه اکنون در سطح جهانی مشهور نبودیم. آن صحنه نمادین «هنگامی که هری با سالی ملاقات کرد» با مگ رایان و بیلی کریستال هنوز هم پس از گذشت نزدیک به 40 سال، مردم را به اینجا می کشاند. وقتی صحنه اصلی را دوباره تماشا می‌کنید، هیچ جا روی آن نوشته نمی‌شود «کاتز» - اما افراد همیشگی ما بلافاصله ما را می‌شناختند. ما مردم را وادار می کنیم که دوباره آن را به نمایش بگذارند، و از مردم خواسته ایم که در یک میز پیشنهاد دهند. آنها اغذیه"}, {"source": "Business Insider", "title": "Apple's best defense in the AI race could be winning your home", "link": "https://www.businessinsider.com/apple-welcome-home-event-new-smart-home-devices-unveiled-2026-10", "summary": "Apple is rolling out a big update on Monday. Benjamin Fanjoy/Getty Images This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . Apple's defending its distribution moat by setting up one around your home. At 9 a.m. ET, the company will hold an event — \"Welcome Home\" — where it's expected to unveil some smart-home devices as part of its bigger strategy in the space. Details are scant. Apple's teaser only includes a catchy tune and someone doing a trendy hobby (cross-stitching). But according to Bloomberg's Mark Gurman , we'll learn more about HomeView, which will serve as a sort of hub to interact with and direct Apple's smart devices in your home. It's a big push for Apple into the smart-home market, where it hasn't succeeded as much as rivals Amazon and Google. But the decision feels more substantial than just taking on Amazon's Alexa and Google Home. It's been a remarkable few months for consumer hardware. In September, Meta surprised everyone with an AI device called Charm tied to its buzzy AI agent, Muse . It also showed off its new VR Glasses , which are lighter and cheaper than the Apple Vision Pro. Charm is scheduled to ship for the holidays, while the Meta VR goggles are coming next spring. The following week, OpenAI announced its own AI agent, Dots . While there was no major hardware announcement, the long-term goal is to release something with iPhone designer Jony Ive. OpenAI CFO Sarah Friar teased it a bit this June . All of this matters because these hardware products mean tech companies would no longer rely on Apple for distribution . The iPhone's massive reach is essentially a toll tech companies must pay to get their apps into people's hands. That's allowed Apple to avoid investing as heavily in AI because it controls the key path to consumers. It also hasn't forced it to rethink the iPhone too much. After all, why upset the golden goose? Investors have rewarded Apple for its avoidance of massive AI budgets. Its stock is up more than 25% this year, outperforming Alphabet, Amazon, Meta, and Microsoft. But the past few months show the potential for change. Look how quickly Apple's big hardware announcement last month, the iPhone Duo , has taken a back seat to chatter about AI agents and their accompanying devices. Meta's stock is up more than 11% over the past month, while Apple's is up just over 2%. That's why pushing into smart-home hardware makes sense. If Apple", "date_str": "2026-10-13T10:47:04+00:00", "hash": "6479af9abd3008b8", "title_fa": "بهترین دفاع اپل در مسابقه هوش مصنوعی می تواند برنده شدن در خانه شما باشد", "summary_fa": "اپل روز دوشنبه آپدیت بزرگی را منتشر می کند. Benjamin Fanjoy/Getty Images این پست در اصل در خبرنامه Business Insider Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. اپل با نصب یک خندق در اطراف خانه شما از خندق توزیع خود دفاع می کند. در ساعت 9 صبح به وقت شرقی، این شرکت رویدادی را برگزار می کند - \"Welcome Home\" - که در آن انتظار می رود برخی از دستگاه های خانه هوشمند را به عنوان بخشی از استراتژی بزرگتر خود در فضا رونمایی کند. جزئیات کم است. تیزر اپل فقط شامل یک آهنگ جذاب و شخصی است که یک سرگرمی مدرن انجام می دهد (دوخت متقاطع). اما طبق گفته مارک گورمن از بلومبرگ، ما درباره HomeView بیشتر خواهیم آموخت که به عنوان نوعی مرکز برای تعامل و هدایت دستگاه های هوشمند اپل در خانه شما عمل می کند. این یک فشار بزرگ برای اپل برای ورود به بازار خانه های هوشمند است، جایی که به اندازه رقبای آمازون و گوگل موفق نبوده است. اما به نظر می رسد این تصمیم مهم تر از الکسا و گوگل هوم آمازون باشد. این چند ماه قابل توجه برای سخت افزار مصرف کننده بوده است. در ماه سپتامبر، متا همه را با یک دستگاه هوش مصنوعی به نام Charm که به عامل هوش مصنوعی خود، Muse گره خورده بود، شگفت زده کرد. همچنین عینک‌های واقعیت مجازی جدید خود را به نمایش گذاشت که سبک‌تر و ارزان‌تر از Apple Vision Pro هستند. Charm قرار است برای تعطیلات ارسال شود، در حالی که عینک‌های متا VR بهار آینده عرضه می‌شوند. هفته بعد، OpenAI عامل هوش مصنوعی خود، Dots را معرفی کرد. در حالی که هیچ اعلامیه سخت افزاری مهمی وجود نداشت، هدف بلندمدت انتشار چیزی با طراح آیفون Jony Ive است. سارا فریار مدیر مالی OpenAI در"}, {"source": "Business Insider", "title": "We moved into a 3-bedroom duplex and furnished it almost entirely from Facebook Marketplace and thrift shops", "link": "https://www.businessinsider.com/home-decor-secondhand-facebook-marketplace-thrifting-2026-10", "summary": "The author says purchasing secondhand was cheaper and made her house feel like a home. Courtesy of Melissa Noble My family of five recently moved into a new three-bedroom duplex. We needed to decorate, and decided to buy almost entirely secondhand. It was cheaper, helped us avoid indecision, and made the house feel like home. In August, my family of five moved into a new home on the Gold Coast, Australia. We'd been living in my parents' house since January, following an interstate move from country Victoria. When we left Victoria, we put all our belongings in storage because we weren't sure how long we'd be staying on the Gold Coast. So, when it came time to move into our new digs, we literally only had a handful of items. We did a quick online search, asking how much we would likely have to spend to furnish a three-bedroom duplex in that area of the world. The AI-generated estimate was anywhere from $8,000 to $16,000 AUD (about $5,580 to $11,150 USD). We're a family of five on a tight budget, and that kind of outlay seemed pretty steep. And so, we decided to furnish it with secondhand items . We purchased almost everything on Facebook Marketplace or in op shops, aside from our bedding and some kitchen staples like a cutlery set. Buying secondhand proved to be a fun experience with all kinds of perks. It's saved us thousands Saving money was a biggie for us. All up, it cost roughly $5,200 AUD to furnish the property , which meant we could put the money we would have spent on buying new items to other use. As we found items online, I'd often check the recommended retail price for comparison. For example, we purchased a king-sized bed, mattress, and two side tables for $650 AUD. The same exact package would have cost $2828 AUD new (without the mattress). We scored a barely used cream couch for $800 AUD, which would have retailed for around $2800 AUD. In general, buying secondhand meant we were only paying a fraction of the price compared to buying new. This has saved us thousands of dollars overall. They got a great price on a secondhand bedroom set. Courtesy of Melissa Noble It removed indecision and time-wasting When my husband and I were furnishing our first home together in Melbourne, we shopped around and visited multiple furniture stores before purchasing our furniture. This was time-consuming and frankly, quite torturous with a 2-year-old trailing along. But buying everything secondhand this time made the process easier and more streamlined. There was", "date_str": "2026-10-13T10:11:01+00:00", "hash": "45aa0d009729d41f", "title_fa": "ما به یک دوبلکس 3 خوابه نقل مکان کردیم و تقریباً به طور کامل آن را از بازار فیس بوک و مغازه های صرفه جویی تجهیز کردیم.", "summary_fa": "نویسنده می‌گوید خرید دست دوم ارزان‌تر بوده و باعث می‌شود خانه او مانند یک خانه باشد. با حسن نیت از ملیسا نوبل خانواده پنج نفره من اخیراً به یک دوبلکس سه خوابه جدید نقل مکان کردند. ما نیاز به تزئین داشتیم و تصمیم گرفتیم تقریباً به طور کامل دست دوم بخریم. ارزان‌تر بود، به ما کمک کرد از بلاتکلیفی دوری کنیم، و خانه را مانند خانه احساس کنیم. در ماه اوت، خانواده پنج نفره من به خانه جدیدی در ساحل طلایی، استرالیا نقل مکان کردند. ما از ژانویه در خانه پدر و مادرم زندگی می کردیم، به دنبال یک نقل مکان بین ایالتی از کشور ویکتوریا. وقتی ویکتوریا را ترک کردیم، تمام وسایلمان را در انبار گذاشتیم زیرا مطمئن نبودیم چه مدت در ساحل طلایی می‌مانیم. بنابراین، زمانی که زمان حرکت به حفاری‌های جدید فرا رسید، به معنای واقعی کلمه فقط تعداد انگشت شماری آیتم داشتیم. ما یک جستجوی آنلاین سریع انجام دادیم و پرسیدیم که احتمالاً چقدر باید برای تجهیز یک دوبلکس سه خوابه در آن منطقه از جهان هزینه کنیم. برآورد تولید شده توسط هوش مصنوعی بین 8000 تا 16000 دلار استرالیا (حدود 5580 تا 11150 دلار آمریکا) بود. ما یک خانواده پنج نفره هستیم که بودجه کمی داریم و این نوع هزینه ها بسیار سنگین به نظر می رسید. و بنابراین، تصمیم گرفتیم آن را با وسایل دست دوم مبله کنیم. ما تقریباً همه چیز را در فیس بوک یا در مغازه های اپرا خریدیم، به غیر از ملافه هایمان و برخی لوازم اصلی آشپزخانه مانند ست کارد و چنگال. خرید دست دوم تجربه ای سرگرم کننده با انواع امتیازات بود. این برای ما هزاران صرفه جویی داشته است. پس انداز پول برای ما کار بزرگی بود. در مجموع، هزینه تجهیز ملک تقریباً 5200 دلار استرالیا بود که به این معنی بود که می‌توانستیم پولی را که"}, {"source": "Business Insider", "title": "Chatbot startup Character.AI files for bankruptcy, and Disney is first in line for key assets", "link": "https://www.businessinsider.com/character-ai-files-for-bankruptcy-legal-headwinds-disney-google-chatbots-2026-10", "summary": "Character.AI filed for bankruptcy and is putting its chatbot platform up for sale. Jakub Porzycki/NurPhoto via Getty Images Character.AI has filed for Chapter 11 bankruptcy as it pursues a court-supervised sale. Disney has offered $20 million for a license to certain assets, though other bids could prevail. The chatbot platform, which has faced lawsuits over child safety, could be wound down if a sale fails. Character.AI, the chatbot startup founded by former Google researchers, has filed for bankruptcy. The California-based company said it had initiated a voluntary Chapter 11 process in Delaware to pursue a court-supervised sale of all or substantially all of its assets. Character.AI, which lets users create personalized AI bots, said its platform would remain online during the sale process , which it expects to finish by late November or early December. The company has agreed to let Disney Worldwide Services, an affiliate of the Walt Disney Company, act as the opening bidder for a non-exclusive, perpetual license to certain Character.AI intellectual property and claims. Disney said it would pay $20 million and provide transition services using former Character.AI employees it has hired. Other potential buyers can still make higher bids under the bankruptcy process. Last month, Disney hired former Character.AI CEO Karandeep Anand as its CTO. Character.AI's CEO Colin Adams said in a Monday statement that it had taken steps to \"sustain and improve\" its business amid \"significant legal, regulatory, and operational headwinds.\" \"After a comprehensive review of our available alternatives, our board determined that this court-supervised sale process provides us with the best opportunity to maximize value for all of our stakeholders,\" the company said in a blog post on Monday. The startup said paid subscriptions remain active and billing is unchanged for now. But it warned that if the sale does not produce a bid sufficient to keep the platform running, it will wind down the service. Character.AI hit with lawsuits Character.AI did not spell out the legal, regulatory, and operational pressures that led to the filing. But the company has faced growing scrutiny over the potential effect of its AI companions on young users. It announced last year that it would ban under-18s from having open-ended conversations with its chatbots, following concerns about AI's impact on children and teenagers. Prior to that, Character.AI had faced lawsuits from families who alleged its ", "date_str": "2026-10-13T10:00:50+00:00", "hash": "fd6ab66994c34f44", "title_fa": "استارت‌آپ Chatbot Character.AI ورشکستگی می‌کند و دیزنی در صف اول دارایی‌های کلیدی است.", "summary_fa": "Character.AI اعلام ورشکستگی کرد و پلتفرم چت بات خود را برای فروش قرار داد. Jakub Porzycki/NurPhoto از طریق Getty Images Character.AI درخواست ورشکستگی فصل 11 را داده است زیرا فروش تحت نظارت دادگاه را دنبال می کند. دیزنی 20 میلیون دلار برای مجوز برای دارایی های خاص پیشنهاد داده است، اگرچه پیشنهادات دیگر ممکن است پیروز شوند. پلت فرم چت بات، که با شکایت هایی در مورد ایمنی کودکان مواجه شده است، در صورت شکست فروش ممکن است از بین برود. Character.AI، استارت آپ چت بات که توسط محققان سابق گوگل تأسیس شده بود، اعلام ورشکستگی کرده است. این شرکت مستقر در کالیفرنیا گفت که یک فرآیند داوطلبانه فصل 11 را در دلاور آغاز کرده است تا فروش تمام یا تقریباً همه دارایی های خود را تحت نظارت دادگاه دنبال کند. Character.AI که به کاربران اجازه می‌دهد ربات‌های هوش مصنوعی شخصی‌سازی کنند، گفت که پلتفرم آن در طول فرآیند فروش آنلاین باقی می‌ماند، که انتظار دارد تا اواخر نوامبر یا اوایل دسامبر به پایان برسد. این شرکت موافقت کرده است که به Disney Worldwide Services، وابسته به شرکت والت دیزنی، به عنوان مناقصه گشایی برای یک مجوز غیر انحصاری و دائمی برای مالکیت معنوی و ادعاهای خاص Character.AI عمل کند. دیزنی گفت که 20 میلیون دلار می پردازد و با استفاده از کارمندان سابق Character.AI که استخدام کرده است، خدمات انتقال ارائه می کند. سایر خریداران بالقوه همچنان می توانند در فرآیند ورشکستگی، پیشنهادهای بالاتری ارائه دهند. ماه گذشته، دیزنی، کاراندیپ آناند، مدیرعامل سابق Character.AI را به عنوان مدیر ارشد فناوری خود استخدام کرد. کالین آدامز، مدیرعامل Character.AI در بیانیه‌ای روز دوشنبه گفت که اقداماتی را برای \"پایداری و بهبود\" کسب‌وکار خود در میان \"مشکلات قانونی، نظارتی و عملیاتی قابل توجه\" انجام داده است. این شرکت روز دوشنبه در یک پست وبلاگی گفت: \"پس از بررسی جامع گزینه های موجود"}, {"source": "Business Insider", "title": "How to invest in the AI productivity boom as earnings season approaches", "link": "https://www.businessinsider.com/ai-trade-how-to-invest-stocks-productivity-boom-efficiency-gains-2026-10", "summary": "NYSE Q3 earnings will test which firms can turn AI adoption into measurable profit gains. Healthcare, finance, and retail could see the biggest AI-driven efficiency gains. Sign up for First Trade , Business Insider's daily markets newsletter. So far, talk of AI-driven profit booms has been cheap for companies. Much like hyperscalers were once able to excite investors with ever-increasing capex levels without concrete evidence of monetization, firms have been able to dine out on the promise of future profit growth thanks to AI, while providing few specifics. But just as investors eventually began to demand answers from firms like Microsoft and Meta (which have duly delivered), they'll start to do the same for the supposed beneficiaries of AI technology. \"AI's next wave will likely reward companies that use the technology to improve decisions, lower costs and strengthen margins — not just those building AI infrastructure,\" Ellen Zentner, Morgan Stanley Wealth Management's chief economist, wrote in September. That day may be here. Earnings season is once again upon us (it always seems to come quicker than you'd think, doesn't it?), and while AI hyperscalers and hardware stocks will remain a large part of the conversation, we're also likely to see the focus shift toward which non-AI firms are successfully adopting the technology and boosting their profit margins. Investors want to see which companies are using the technology to get ahead, and they'll want to see concrete numbers. According to Goldman Sachs, just 2% of S P 500 companies have so far \"quantified\" the earnings impact of AI efficiency gains, and 11% have cited a specific use case for the technology. That's despite 50% of companies talking in their Q2 earnings calls about AI eventually juicing their margins. Recent Morgan Stanley research showed that stocks with both upward earnings and free cash flow revisions in Q2 saw their share prices rise, on average, after reporting, while those missing at least one of those fell. It sounds obvious, but investors aren't always as discerning about the earnings outlook as they seem to be right now, as factors like rising interest rates increase scrutiny on cash flows. So, let's get into where investors might see some of these AI efficiency gains . Morgan Stanley's Zentner highlighted how these industries could benefit: Healthcare: Can help improve documentation and administrative tasks, as well as develop new treatments Financials: Can assist banks, asset manag", "date_str": "2026-10-13T09:51:01+00:00", "hash": "e784c6367ca09876", "title_fa": "چگونه با نزدیک شدن به فصل درآمد، در رونق بهره وری هوش مصنوعی سرمایه گذاری کنیم", "summary_fa": "درآمد سه ماهه سوم NYSE آزمایش خواهد کرد که کدام شرکت ها می توانند پذیرش هوش مصنوعی را به سود قابل اندازه گیری تبدیل کنند. مراقبت‌های بهداشتی، مالی و خرده‌فروشی می‌توانند بیشترین دستاوردهای بهره‌وری مبتنی بر هوش مصنوعی را داشته باشند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. تا کنون، صحبت از رونق سود مبتنی بر هوش مصنوعی برای شرکت ها ارزان بوده است. درست مانند ابر مقیاس‌کننده‌ها که زمانی می‌توانستند سرمایه‌گذاران را با سطوح سرمایه در حال افزایش بدون شواهد مشخص از درآمدزایی هیجان‌زده کنند، شرکت‌ها نیز به لطف هوش مصنوعی توانسته‌اند وعده رشد سود آینده را بخورند، در حالی که جزئیات کمی ارائه می‌دهند. اما درست همانطور که سرمایه گذاران در نهایت شروع به درخواست پاسخ از شرکت هایی مانند مایکروسافت و متا کردند (که به درستی تحویل داده اند)، آنها نیز شروع به انجام همین کار برای ذینفعان فرضی فناوری هوش مصنوعی خواهند کرد. الن زنتنر، اقتصاددان ارشد مدیریت ثروت مورگان استنلی در ماه سپتامبر نوشت: «موج بعدی هوش مصنوعی احتمالاً به شرکت‌هایی که از این فناوری برای بهبود تصمیم‌گیری‌ها، کاهش هزینه‌ها و تقویت حاشیه‌ها استفاده می‌کنند پاداش می‌دهد - نه فقط آنهایی که زیرساخت‌های هوش مصنوعی را ایجاد می‌کنند». آن روز ممکن است اینجا باشد. فصل سود یک بار دیگر در راه است (به نظر می رسد همیشه سریعتر از آنچه فکر می کنید می آید، اینطور نیست؟)، و در حالی که مقیاس کننده های AI و سهام سخت افزار بخش بزرگی از گفتگو باقی خواهند ماند، ما همچنین احتمالاً شاهد تغییر تمرکز به سمتی خواهیم بود که شرکت های غیر AI با موفقیت از این فناوری استفاده می کنند و حاشیه سود خود را افزایش می دهند. سرمایه‌گذاران می‌خواهند ببینند کدام شرکت‌ها از این فناوری برای پیشرفت استفاده می‌کنند و می‌خواهند اعداد مشخصی را ببینند. به گفته گلدمن ساکس، تنها 2"}, {"source": "Business Insider", "title": "The simple habit that can make you more magnetic at work", "link": "https://www.businessinsider.com/how-to-be-magnetic-make-impression-at-work-2026-10", "summary": "Business Insider s Ana Altchek shares how to become more magnetic at work. Cadie Thompson/ Business Insider Today's tip to get better at work: Get better at commanding a room by practicing being present. Showing a genuine interest in others without distraction makes people feel drawn to you. Pamela Meyer, author of \"How to Read the Room,\" recommends an exercise dubbed \"PAM\" to help be more present. Get better at: Being magnetic Today's move The people who command a room aren't just interesting, they're fully present. That allows them to notice how people are reacting and to make those around them feel they have their full attention. To be present during important interactions, you need to first get focused before you arrive. That means you can't be thinking about your to-do list, your last meeting, or what comes after. Why it works Pamela Meyer, author of \"How to Read the Room,\" said taking time to reduce \"cognitive load\" before a meeting can help you stay focused and engaged during the interaction. A study of more than 1,600 people involving five listening experiments, published in \"Personality and Social Psychology Bulletin,\" found that when people were genuinely listened to, they felt closer and more connected to the listener. That's what being magnetic is about: Making others feel seen by giving them your full attention. Try it today Meyer recommends a quick pre-arrival exercise to help you better prepare for an interaction where you need to be fully present called PAM: Purpose. Attention. Modulate. First, purpose: Decide on one thing you want to accomplish. Second, attention: Put away your phone and clear the mental and digital distractions competing for your attention. Finally, modulate: Take three breaths and think about the energy you want to bring into the room. The bottom line People will feel drawn to you when they feel like way you're paying attention to them. Source This insight is drawn from Business Insider's reporting on Pamela Meyer's book, \"How to Read the Room.\" Read more in Business Insider's Ana Altchek's story here. What do you consider to be the signs of a magnetic leader? Tell us what you think of this leadership advice in the comments below. Read the original article on Business Insider", "date_str": "2026-10-13T09:41:01+00:00", "hash": "747a9c5a7ce60fea", "title_fa": "عادت ساده ای که می تواند شما را در محل کار مغناطیسی تر کند", "summary_fa": "Ana Altchek از Business Insider به اشتراک می گذارد که چگونه در محل کار مغناطیسی تر شوید. Cadie Thompson/ Business Insider نکته امروز برای بهتر شدن در محل کار: با تمرین حضور در اتاق، فرماندهی اتاق را بهتر کنید. نشان دادن علاقه واقعی به دیگران بدون حواس پرتی باعث می شود مردم احساس کنند به سمت شما کشیده می شوند. پاملا مایر، نویسنده کتاب «چگونه اتاق را بخوانیم»، تمرینی با نام «PAM» را برای کمک به حضور بیشتر توصیه می‌کند. بهتر شدن در: مغناطیسی بودن حرکت امروز افرادی که فرماندهی یک اتاق را دارند نه تنها جالب هستند، بلکه کاملاً حضور دارند. این به آنها اجازه می دهد تا متوجه واکنش مردم شوند و به اطرافیان خود احساس کنند که توجه کامل آنها را جلب می کنند. برای حضور در طول تعاملات مهم، ابتدا باید قبل از رسیدن تمرکز کنید. این بدان معناست که شما نمی توانید به لیست کارهایتان، آخرین جلسه یا آنچه بعد از آن می آید فکر کنید. چرا کار می کند پاملا مایر، نویسنده کتاب «چگونه اتاق را بخوانیم»، گفت که وقت گذاشتن برای کاهش «بار شناختی» قبل از جلسه می تواند به شما کمک کند در طول تعامل متمرکز و درگیر بمانید. مطالعه ای که روی بیش از 1600 نفر شامل پنج آزمایش شنیداری، منتشر شده در \"Personality and Social Psychology Bulletin\" انجام شد، نشان داد که وقتی به مردم واقعاً گوش داده می شود، احساس نزدیکی و ارتباط بیشتری با شنونده می کنند. مغناطیسی بودن به این معناست: ایجاد حس دیده شدن دیگران با توجه کامل به آنها. امروز آن را امتحان کنید مایر یک تمرین سریع قبل از ورود را توصیه می کند تا به شما کمک کند برای تعاملی که باید به طور کامل در آن حضور داشته باشید به نام PAM: Purpose آماده شوید. توجه تعدیل کنید. اول، هدف: در مورد"}, {"source": "Business Insider", "title": "Nestlé's CEO shares the feedback he got that changed how he leads", "link": "https://www.businessinsider.com/nestle-ceo-shares-feedback-changed-how-he-leads-2026-10", "summary": "Philipp Navratil said he used to struggle with giving people feedback. Nespresso Philipp Navratil changed his leadership style after being told he needed to provide honest feedback. He said he now embraces giving direct feedback and feels like it's his responsibility to do so. He said when he has tough conversations, he focuses mostly on finding a solution. No one likes to be told they're doing something wrong — but it's not easy to be the messenger either. Philipp Navratil has spent more than two decades at Nestlé. Early in his leadership career, he received one piece of advice that reshaped how he manages people: Give honest feedback . The CEO of the company behind more than 30 billion-dollar brands, including Nespresso and DiGiorno, said he when he first stepped into leadership, he struggled to tell employees when their performance fell short. \"It's easy to tell someone 'Great job, well done,'\" Navratil told Business Insider. This is part of a series of stories from Business Insider's conversation with Nestlé CEO Philipp Navratil. To be alerted when the next piece publishes, follow reporter Ana Altchek here. Nestlé's CEO says these 3 qualities will get you promoted Nestlé's CEO says this is the most important skill for workers in the AI era The hard part is speaking up when things aren't going well, he said. The CEO said that he tries to be \"as direct as possible,\" because if you beat around the bush, people may miss the point. \"It's much more valuable for them to receive it that way because it's clear,\" Navratil said. Today, Navratil said, he sees feedback as one of a leader's most important responsibilities — not just because it helps the company overall, but because it helps employees grow, too. Direct doesn't mean harsh, though. Navratil said he gives the criticism, but then he spends more time talking about how to improve the situation. That may mean asking the person how he can help, or suggesting a solution that they can work through together. While those conversations may seem awkward or uncomfortable, it could end up bringing you closer to that individual. Navratil said that feedback discussions lead to stronger personal relationships because they include follow-up conversations. \"I feel that I owe it to the person,\" Navratil said. Read the original article on Business Insider", "date_str": "2026-10-13T09:39:01+00:00", "hash": "56b1a8f8d7abcc91", "title_fa": "مدیر عامل نستله بازخوردی را که دریافت کرده و نحوه رهبری او را تغییر داده به اشتراک می گذارد", "summary_fa": "فیلیپ ناوراتیل گفت که او با دادن بازخورد به مردم مشکل داشت. نسپرسو فیلیپ ناوراتیل پس از اینکه به او گفته شد باید بازخورد صادقانه ارائه دهد، سبک رهبری خود را تغییر داد. او گفت که اکنون از دادن بازخورد مستقیم استقبال می‌کند و احساس می‌کند که این وظیفه اوست. او گفت وقتی صحبت های سختی دارد، بیشتر بر روی یافتن راه حل تمرکز می کند. هیچ کس دوست ندارد به او گفته شود که کار اشتباهی انجام می دهد - اما پیام رسان بودن نیز آسان نیست. فیلیپ ناوراتیل بیش از دو دهه را در نستله سپری کرده است. او در اوایل دوران رهبری خود، یک نصیحت دریافت کرد که نحوه مدیریت او ب
