<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۳ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۳ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۵ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۰۹:۳۰</span>
      </div>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">

      <button class="tab-btn" onclick="switchTab('tech', this)">

        <span class="badge" id="badge-tech">۵۳</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۶۴</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

3bb97896f75fbdff", "title_fa": "بنیامین نتانیاهو؛ آیا «آقای امنیت» اسرائیل می‌تواند برای هفتمین بار نخست‌وزیر شود؟", "summary_fa": "بنیامین نتانیاهو، باسابقه‌ترین نخست‌وزیر تاریخ اسرائیل، امیدوار است در انتخابات پارلمانی ۲۷ اکتبر برای هفتمین بار به قدرت برسد. نتانیاهو، ۷۷ ساله، دهه‌ها خود را «آقای امنیت» اسرائیل معرفی کرده است. اما تلاش او برای یک دوره دیگر پس از رویدادی صورت می‌گیرد که بسیاری از اسرائیلی‌ها آن را بزرگ‌ترین شکست امنیتی در تاریخ کشور می‌دانند: حملات به رهبری حماس در ۷ اکتبر ۲۰۲۳. از آن زمان، او تمرکز خود را بر جنگ علیه حماس و همچنین متحدان آن، حزب‌الله و ایران، گذاشته است، در حالی که همچنان با محاکمه کیفری بر سر اتهام‌های فساد روبه‌روست. اتهام‌هایی که رد می‌کند. نظرسنجی‌ها از رقابتی نزدیک میان بلوک راست‌گرای نتانیاهو و بلوکی از احزاب مخالف حکایت دارند که برای کنار زدن او با یکدیگر همکاری می‌کنند. نفتالی بنت، نخست‌وزیر پیشین، و گادی آیزنکوت، رئیس پیشین ستاد ارتش، از جمله چهره‌های این بلوک هستند. انتظار می‌رود میراث ۷ اکتبر نقشی محوری در تصمیم بسیاری از رای‌دهندگان داشته باشد. با وجود جنجال‌ها و بحران‌های سیاسی‌ای که قدرت او را تهدید کرده‌اند، نتانیاهو به داشتن توان بالای بقا در سیاست شهرت پیدا کرده است. نتانیاهو که در نوامبر ۲۰۲۲ برای ششمین دوره نخست‌وزیری خود دوباره انتخاب شد، اکنون رهبری راست‌گراترین ائتلاف حاکم در تاریخ اسرائیل را بر عهده دارد. بازگشت او به قدرت پس از دوره‌ای نسبتا کوتاه در اپوزیسیون رخ داد؛ دوره‌ای که پس از ۱۲ سال متوالی نخست‌وزیری آغاز شده بود. این بازگشت، بیش از پیش این باور را در میان حامیانش تقویت کرد که «شاه بی‌بی» از نظر سیاسی شکست‌ناپذیر است. او همچنان در میان بسیاری از رای‌دهندگان راست‌گرا و مذهبی محبوب است، کسانی که او را رهبری قدرتمند در زمینه امنیت می‌دانند. دولت او همچنین تلاش کرده معافیت از خدمت سربازی برای یهودیان فوق‌ارتدوکس که به‌طور تمام‌ وقت در مراکز مذهبی تحصیل می‌کنند، تمدید شود.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/3df0/live/ab437ae0-c8b8-11f1-a64c-550be9e3c66b.png", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۳ آبان • ۰۴:۰۵"}, {"source": "Iran International", "title": "هیل: ارتش آمریکا گزینه‌هایی برای حمله دوباره به ایران آماده کرده است", "link": "https://www.iranintl.com/202610250307", "summary": "نشریه هیل به نقل از منابع آگاه گزارش داد ارتش آمریکا چند گزینه برای حمله دوباره به اهداف حکومت ایران پس از انتخابات میان‌دوره‌ای سوم نوامبر آماده کرده است. اجرای این طرح‌ها به تایید دونالد ترامپ بستگی دارد و هنوز تصمیم نهایی اعلام نشده است.", "date_str": "2026-10-25T00:48:42+00:00", "hash": "4e250528f82c30dd", "title_fa": "هیل: ارتش آمریکا گزینه‌هایی برای حمله دوباره به ایران آماده کرده است", "summary_fa": "نشریه هیل به نقل از منابع آگاه گزارش داد ارتش آمریکا چند گزینه برای حمله دوباره به اهداف حکومت ایران پس از انتخابات میان‌دوره‌ای سوم نوامبر آماده کرده است. اجرای این طرح‌ها به تایید دونالد ترامپ بستگی دارد و هنوز تصمیم نهایی اعلام نشده است.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/e4413efce88aa5d40cc26ddc31469445562dd916-2484x1518.png?rect=0,107,2484,1304&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۳ آبان • ۰۴:۱۸"}, {"source": "BBC Persian", "title": "گادی آیزنکوت رقیب اصلی نتانیاهو در انتخابات اسرائیل کیست؟", "link": "https://www.bbc.com/persian/articles/cqn06gp7g5leo?at_medium=RSS&at_campaign=rss", "summary": "نظرسنجی‌ها نشان می‌دهند ائتلاف احزاب بنیامین نتانیاهو، نخست‌وزیر اسرائیل، که حزب لیکود، احزاب راست افراطی و احزاب فوق‌ارتدکس را در بر می‌گیرد، ممکن است در انتخابات سراسری ۲۷ اکتبر برای کسب اکثریت پارلمانی با چالش روبه‌رو شود.", "date_str": "2026-10-24T23:12:02+00:00", "hash": "14f80c9d2f42e3cd", "title_fa": "گادی آیزنکوت رقیب اصلی نتانیاهو در انتخابات اسرائیل کیست؟", "summary_fa": "نظرسنجی‌ها نشان می‌دهند ائتلاف احزاب بنیامین نتانیاهو، نخست‌وزیر اسرائیل، که حزب لیکود، احزاب راست افراطی و احزاب فوق‌ارتدکس را در بر می‌گیرد، ممکن است در انتخابات سراسری ۲۷ اکتبر برای کسب اکثریت پارلمانی با چالش روبه‌رو شود. یکی از دلایل اصلی این وضعیت گادی آیزنکوت است؛ رئیس پیشین ستاد ارتش اسرائیل که به رقیبی غیرمنتظره برای مرد ه افزایش هزینه‌های زندگی و سیاست‌های دولت امانوئل مکرون، رئیس‌جمهور این کشور، به خیابان‌ها آمدند.", "date_str": "2026-10-24T15:36:57+00:00", "hash": "ce9773fac6fdc46b", "title_fa": "صدها هزار نفر بار دیگر فرانسه به خیابان‌ها رفتند؛ درگیری‌های پراکنده پلیس با معترضان", "summary_fa": "ده‌ها هزار نفر روز شنبه دوم آبان در شهرهای مختلف فرانسه در اعتراض به افزایش هزینه‌های زندگی و سیاست‌های دولت امانوئل مکرون، رئیس‌جمهور این کشور، به خیابان‌ها آمدند. صدها هزار نفر روز شنبه دوم آبان در شهرهای مختلف فرانسه در اعتراض به افزایش هزینه‌های زندگی و نابرابری به خیابان‌ها آمدند. همزمان، استقرار گسترده نیروهای امنیتی ظاهراً مانع تکرار ناآرامی‌های شدید هفته گذشته شد، هرچند درگیری‌های پراکنده‌ای در چند شهر گزارش شد. به گزارش پلیس، حدود ۱۱۰ هزار نفر در پاریس به‌صورت مسالمت‌آمیز راهپیمایی کردند. معترضان با در دست داشتن پرچم، افزایش هزینه‌های زندگی و تشدید نابرابری را محکوم کردند و شعارهایی علیه دولت، پلیس و جریان‌های فاشیستی سر دادند. در پایان راهپیمایی پاریس، پلیس برای متفرق کردن گروه‌های کوچکی از جوانان نقاب‌دار از گاز اشک‌آور و خودروهای آب‌پاش استفاده کرد. با این حال، میزان خشونت به‌مراتب کمتر از شنبه هفته پیش بود؛ زمانی که غارتگران و افراد خرابکار در پاریس به فروشگاه‌ها و اموال عمومی آسیب زدند. درگیری‌ها همچنین در شهرهای لیون، بوردو و گرونوبل شدت گرفت. پلیس در کلرمون‌فران، لیل و نیس نیز برای متفرق کردن معترضان از گاز اشک‌آور استفاده کرد. در مارسی، دومین شهر بزرگ فرانسه، گروهی از جوانان با کشیدن ورقه‌های بزرگ فلزی به خیابان، مسیر را مسدود کردند، سطل‌های زباله را به آتش کشیدند و به سوی نیروهای ضدشورش سنگ و بطری پرتاب کردند. این درگیری‌ها تا فرارسیدن شب ادامه یافت. وزارت کشور فرانسه اعلام کرد ۴۱۰ هزار نفر در تظاهرات سراسری شرکت کردند؛ رقمی که اتحادیه‌های کارگری آن را حدود دو برابر برآورد کردند. مقام‌های فرانسوی برای تأمین امنیت این تجمع‌ها، ۷۰ هزار نیروی پلیس و ژاندارم مستقر کردند؛ یعنی ۱۰ هزار نفر بیشتر از هفته گذشته. این افزایش نیرو پس از آن صورت گرفت که مقام‌ها پذیرفتند ابعاد ناآرامی‌های قبلی را دست‌کم گرفته بودند.", "image_url": "https://gdb.rferl.org/df7054ea-e26b-4413-aded-d9f9a ان اسرائیل کشته شدند. ارتش اسرائیل همچنین گفته است که این عملیات، منطقه‌ای از الخلیل را هدف قرار داده که دو مهاجم مسلح فلسطینی از آنجا آمده بودند و ممکن است چندین روز به طول انجامد. منابع محلی می‌گویند از روز گذشته دست‌کم ۲۵۰ خانواده به‌اجبار از خانه‌های خود در این شهر بیرون رانده شده‌اند. خبرگزاری فرانسه گزارش داد که در محله «عین دیر بها» که میان دو تپه واقع شده است، روی ساختمان‌های تخلیه شده علامت ضربدر دیده می‌شود. در این گزارش آمده که خیابان‌های این منطقه از مردم و خودروها تخلیه شده و تنها چند خودروی نظامی اسرائیلی در آنجا به چشم می‌خورد. به برخی ساکنان و فروشندگان محلی دو ساعت فرصت داده شد تا محل زندگی و کسب خود را ترک کنند. خالد دودین، فرماندار الخلیل، به خبرگزاری فرانسه گفت که حدود یک‌سوم این شهر هدف عملیات ارتش اسرائيل قرار گرفته است. او گفت: «آن‌ها کار را از محله‌ای آغاز کردند که عاملان حمله از آنجا آمده بودند، اما هیچ تضمینی وجود ندارد که دامنه این عملیات گسترش نیابد.» آقای دودین افزود: «این اقدام در حکم مجازات دسته‌جمعی غیرنظامیانی است که هیچ‌گونه ارتباطی با این ماجرا ندارند.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. بنیامین نتانیاهو اما می‌گوید که «اقدامات بزرگ‌تری» در راه است. او در مصاحبه‌ای با شبکه آی۲۴ نیوز که شامگاه جمعه انجام شد، درباره", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/9f2c/live/1e3e9090-cfab-11f1-93e1-3b657b665bcf.jpg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲ آبان • ۱۸:۴۷"}, {"source": "BBC Persian", "title": "دور تازه اعتراضات فرانسه؛ ۱۳۵ نفر بازداشت شدند", "link": "https://www.bbc.com/persian/articles/c50mep7kxr2zo?at_medium=RSS&at_campaign=rss", "summary": "در فرانسه بار دیگر ده‌ها هزار نفر برای تظاهرات اعتراض‌آمیز به خیابان‌ها آمدند. معترضان در برخی شهرها از جمله پاریس با پلیس درگیر شدند. در جریان این درگیری‌ها ۱۳۵ نفر بازداشت شده‌اند.", "date_str": "2026-10-24T15:45:47+00:00", "hash": "c9e60eb088c0c980", "title_fa": "دور تازه اعتراضات فرانسه؛ ۱۳۵ نفر بازداشت شدند", "summary_fa": "در فرانس r/time-tunnel/469760-windows-xp-iapetus-anniversary-october-25/", "summary": "ویندوز XP به ۲۵ ساله شد؛ یاپتوس با دو چهره‌ی متضادش درخشید و نموداری ساده سرگذشت ستاره‌ها را روایت می‌کند.", "date_str": "2026-10-25T05:30:00+00:00", "hash": "aac8e3e9a8fd0907", "title_fa": "تونل زمان - ۳ آبان؛ ۲۵ سال از عرضه ویندوز XP گذشت", "summary_fa": "ویندوز XP به ۲۵ ساله شد؛ یاپتوس با دو چهره‌ی متضادش درخشید و نموداری ساده سرگذشت ستاره‌ها را روایت می‌کند. تبلیغات بعضی فناوری‌ها پس از خروج از بازار هم فراموش نمی‌شوند. یک تصویر، صدای کوتاه آغاز به کار و چند دکمه‌ی رنگی کافی‌اند تا میلیون‌ها نفر دوباره پشت کامپیوترهای دهه‌ی ۲۰۰۰ بنشینند. روایت امروز از همان خاطره‌ی مشترک آغاز می‌شود و تا آزمایشگاهی پر از جیوه، تلسکوپی در پاریس و نموداری می‌رود که جای هر ستاره را در مسیر زندگی‌اش آشکار می‌کند. فهرست مطالب ۲۵ سال از ورود ویندوز XP به خانه‌ها گذشت توریچلی و لوله‌ای که وزن هوا را آشکار کرد یاپتوس؛ قمری که از یک سوی زحل ناپدید می‌شد هنری نوریس راسل و نقشه‌ی زندگی ستاره‌ها کپی لینک ۲۵ سال از ورود ویندوز XP به خانه‌ها گذشت صفحه‌ی آبی، دکمه‌ی سبز استارت و تپه‌ای که زیر آسمانی بی‌ابر کشیده شده بود، برای نسلی از کاربران معنای خود کامپیوتر را داشت. بیست‌وپنج سال پیش، Windows XP از راه رسید و کار با کامپیوتر شخصی را دوستانه‌تر جلوه داد؛ محیطی که پیچیدگی فنی را پشت رنگ‌ها، آیکون‌ها و مسیرهای ساده‌تر پنهان می‌کرد. محبوبیت ویندوز XP همان نیرویی بود که خداحافظی با آن را دشوار کرد عمر طولانی ویندوز XP تنها حاصل ظاهر خاطره‌انگیزش نبود. نرم‌افزارهای فراوان، سخت‌افزارهای سازگار و عادت کاربران شبکه‌ای ساختند که ترک آن هزینه داشت. بسیاری از اداره‌ها و سامانه‌های تخصصی سال‌ها به همان محیط وابسته ماندند و نشان دادند موفقیت یک پلتفرم می‌تواند مهاجرت از آن را دشوارتر کند. میراث ویندوز XP امروز در بحث سازگاری، پشتیبانی بلندمدت و خطر وابستگی به فناوری قدیمی ادامه دارد. نیویورک میزبان مراسمی بود که مایکروسافت در آن ویندوز XP را برای بازار جهانی رونمایی کرد. نسخه‌های Home و Professional بر پایه‌ی Windows NT 5.1، دو مسیر خانگی و حرفه‌ای ویندوز را به معماری مشترک و باثبات‌تری رساندند. رابط Luna،", "image_url": "https 18441a0b81f5d394", "title_fa": "جنگل‌زدایی گوگل، گرگ‌ها را راهی روستاها کرد", "summary_fa": "عملیات غیرمجاز گوگل برای ساخت دیتاسنترها هوش مصنوعی در فنلاند، به تخریب صدها هکتار جنگل و هجوم گرگ‌ها به مناطق مسکونی انجامید. تبلیغات مدیر دفتر گوگل در فنلاند به‌دلیل تخریب غیرمجاز جنگل‌ها در نزدیکی منطقه موهوس عذرخواهی کرد؛ رویدادی که ۳۳۰ هکتار از اراضی جنگلی را به پهنه‌ای از گل‌ولای بدل کرده است. مقامات نظارتی همچنین دستور توقف فعالیت در محوطه‌ای به مساحت ۲۰۲ هکتار در ۸۸ کیلومتری جنوب شرقی روستای اوتان‌مکی را صادر کرده‌اند؛ چراکه شتاب غول فناوری برای ساخت دیتاسنترها هوش مصنوعی موجب آوارگی حیات وحش شده است. به گزارش گادرین ، تخریب زیستگاه‌های طبیعی پای گرگ‌ها و سایر حیوانات وحشی را به روستاهای مجاور باز کرده و امنیت ساکنان را در معرض خطر جدی قرار داده است. قطع گسترده‌ی درختان برای ساخت مراکز پردازشی علاوه‌بر فعالان محیط‌زیست، خشم خانواده‌های بومی ساکن در این مناطق روستایی را به همراه دارد. آنی رانتا ، شهروند ۵۳ ساله‌ی ساکن اوتان‌مکی، گفت: «ما شاهد ورود گرگ‌ها به داخل روستا بودیم چون تمام حیوانات وحشی از جنگل آواره شدند.» او همچنین ابراز نگرانی می‌کند که وجود چنین تاسیساتی، فنلاند را به هدفی حساس در برابر تهدیدات خارجی بدل سازد. شکایت بومیان تنها به هجوم جانوران محدود نمی‌شود، بلکه سر و صدای ساخت‌وساز، گل‌آلود شدن آب رودخانه‌ها و فرار پرندگان کمیاب نیز به فهرست بحران‌ها افزوده شده است. نهاد صدور مجوز و نظارت فنلاند نقض قوانین زیست‌محیطی را بی‌سابقه دانست و دستور تعلیق کار را به شرکت ابلاغ کرد. سخنگوی گوگل، در گفت‌و‌گو با رسانه‌ها، گفت: «ما از تمام درخواست‌های LVV در این زمینه پیروی خواهیم کرد. مشتاقانه منتظر حفظ گفت‌وگوی فعال و شفاف با همه‌ی نهادها هستیم تا مشارکت خود با فنلاند و سازمان‌های محلی را تقویت کنیم.» اهالی منطقه امیدوارند قوانین زیست‌محیطی مانع از آسیب بیشتر پروژه‌های هوش مصنوعی به طبیعت بکر منطقه شود.", "image_url": "https://api2.zoomit.ir/media/gray-wolf-closeup3x2-680fa9c04a6edb8fc3b774a8?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "امنیت سایبری"], "datetime_fa": "۳ آبان • ۰۶:۰۰"}, {"source": "Zoomit", "title": "پهپاد هوشمندی  Courtesy of the author My 21-year-old son wanted to visit a lively beach club during our family vacation. I never expected my parents, both in their 70s, to get up and dance to ABBA. Seeing their joy reminded me that getting older doesn't mean giving up new experiences. My 75-year-old dad told me he'll feel like he's closer to dying if our annual family vacations stop. He's not ready for that. Neither am I. It stopped me in my tracks and frankly scared me a little . While I know my parents are aging, I haven't begun thinking about life without them, and I found myself spending the rest of the vacation looking through this new lens. For the last 12 years, my husband, my parents, my son, and I have traveled all over the world on an annual multigenerational trip . And while the sights have been spectacular, what struck me most on this last vacation is just how much each of us has grown to value these trips. I'm in the middle between my parents and my son The dynamic has certainly evolved. My son was 9 when we started, is now 21, and brings his girlfriend along. My parents are now in their mid-70s, with some health challenges that require more patience and care. And I'm in the middle, adjusting the trip so everyone can still participate. I used to plan for adventure. Now I'm thinking about walking distances, downtime, unpacking, and what my parents can comfortably do, while still making it fun for the 21-year-olds. The author says she now needs to take into consideration what her parents can do, and what will keep her son entertained. Courtesy of the author But what I learned on this trip was that sometimes, when choosing something for the youngest generation, a magical memory is created for the oldest, like when we went to Nikki Beach in St. Tropez at my son's request. We had been there for lunch a few years prior, and we wanted to return, this time when we could see the true Euro summer beach club vibe in action, complete with waving white napkins and ABBA blasting f 61971d5ca30acce", "title_fa": "مشکل افت سرعت کامپیوتر را با تنظیمات بایوس حل کنید", "summary_fa": "غیرفعال بودن ناخواسته‌ی یک ویژگی در بایوس می‌تواند فرکانس پردازنده را در مقدار پایه قفل کند و عملکرد سیستم را کاهش دهد. تبلیغات وقتی کامپیوتر در بازی یا رندر سنگین کند می‌شود، اولین مظنون‌ها معمولاً گردوغبار، خمیر سیلیکون و قدیمی‌شدن قطعات هستند. اما گاهی مقصر اصلی گزینه‌ی کوچک دیگری در بایوس است که ناخواسته غیرفعال شده و پردازنده را در فرکانس پایه (Base Clock) نگه داشته است. در این مقاله یاد می‌گیرید چطور تشخیص دهید پردازنده واقعاً بوست نمی‌شود، تنظیم Core Performance Boost چیست و چگونه مشکل را در سیستم‌های مجهز به پردازنده اینتل و AMD برطرف کنید. کپی لینک نشانه‌های اینکه پردازنده بوست نمی‌شود پردازنده‌های امروزی فرکانس خود را لحظه‌به‌لحظه تغییر می‌دهند، پس دیدن عددی کمتر از حداکثر کلاک تبلیغ‌شده روی جعبه به‌تنهایی نشانه‌ی مشکل نیست. زمانی باید نگران شوید که این الگوها را ببینید: همین ترکیب «دمای پایین و فرکانس پایین» مهم‌ترین سرنخ است. پردازنده‌ها معمولاً فقط وقتی بوست می‌شوند که به‌اندازه‌ی کافی حاشیه‌ی حرارتی و الکتریکی داشته باشند. اگر دما مشکلی ندارد و باز هم فرکانس افزایش نمی‌یابد، مشکل احتمالاً در تنظیمات است، نه سیستم خنک‌کننده. کپی لینک گام اول؛ فرکانس و دما را با HWiNFO بررسی کنید قبل از تغییر هر چیزی، فرکانس و دما را تشخیص بدهید. نرم‌افزار رایگان HWiNFO ابزار مناسبی برای این کار است: در پنجره‌ی اصلی HWiNFO در قسمت Summary یا بخش ویژگی‌های پردازنده، می‌توانید وضعیت قابلیت‌هایی مانند Core Performance Boost را هم ببینید. بر اساس گزارش کاربران، اگر این گزینه‌ی قرمز نمایش داده شود، یعنی بوست غیرفعال است. نکته‌ی مهم اینکه خاموش‌بودن ساده‌ترین دلیل نیست و فقط یکی از دلایل محسوب می‌شود. پیش از رفتن به بایوس، اگر مدت‌ها سیستم را تمیز نکرده‌اید، یک بار گردوغبار را بگیرید تا گرمای بیش‌ازحد از لیست کنار برود.", "image_url": "https://api2.zoomit.ir/media/bios-settings-cpu-performance-6adca78874528d1094ea08e2?w=1920&q=75", "category": "تراشه و سخت‌افزار", "tags": ["تراشه"], "datetime_fa": "۲ آبان • ۲۰:۳۰"}, {"source": "Business Insider", "title": "Gen Z loves Sol de Janeiro — so I tried 6 of the brand's most popular fragrances and ranked them worst to best", "link": "https://www.businessinsider.com/sol-de-janeiro-perfume-mists-ranked-2026-10", "summary": "The Cheirosa 62 perfume mist from Sol de Janeiro. Sol de Janeiro When a member of Gen Z smells good, you can probably thank Sol de Janeiro. I'm a millennial and new to the brand, so I tried six of its popular fragrances. The best scent, in my opinion, is also one of the brand's most underrated. Millennials had Victoria's Secret and Bath Body Works . Gen Z has Sol de Janeiro. The body, hair, and fragrance brand, founded in 2015, has become a major player in the industry. A 2025 fiscal year report from L'Occitane Group, Sol de Janeiro's parent company, said the brand accounted for 31.6% of the group's sales. The report also described Sol de Janeiro as Sephora North America's No. 1 beauty brand and the No. 1 fragrance brand on Amazon US at the time. Two Sol de Janeiro products have led that charge. First, millennials embraced the $48 Brazilian Bum Bum Cream after it launched in 2015, turning it into a skincare staple. Tweens and teens have now become obsessed with the $39 Cheirosa perfume mists, the first of which debuted in 2020. The sprays have become a staple of young people's shopping hauls, holiday wish lists, and what's-in-my-bag videos. The brand confirmed to Business Insider that its three most popular scents are Cheirosa 62 , 40 , and 68 . I'm a big fragrance fan myself, but I had yet to try the perfume mists. So I went to Ulta Beauty, purchased a $49 sample set of six Sol de Janeiro scents, and tested them on my skin. Considering each mist's scent, staying power, wearability, and personal preference, here's how I'd rank them from worst to best. I wish the Cheirosa 71 mist had more depth. The Cheirosa 71 perfume mist from Sol de Janeiro. Sol de Janeiro If there's one thing I love more than fragrances, it's sweet treats — so Cheirosa 71 should have worked for me. Sol de Janeiro says the scent is inspired by the iconic Confeitaria Colombo bakery in Brazil , with notes of caramelized vanilla, toasted macadamia nut, sea salt, white chocolate, and tonka bean. When I tried it, the mist smelled more like a gingerbread cookie to me. Then, as it settled, it transformed into something more reminiscent of a graham cracker drizzled with caramel. Some critics of this scent say it smells like buttered popcorn . I didn't notice that on my skin. Instead, it reminded me of a holiday hand sanitizer from Bath Body Works. I can appreciate the scent for a moment, but I don't want it to linger all day. It's too strong and sickly sweet for me. Cheirosa 62 is Sol de Janeiro", "date_str": "2026-10-24T16:36:01+00:00", "hash": "ddb6fb2c68552fd2", "title_fa": "Gen Z عاشق Sol de Janeiro است - بنابراین من 6 مورد از محبوب ترین عطرهای این برند را امتحان کردم و آنها را از بدترین تا بهترین رتبه بندی کردم.", "summary_fa": "عطر میست Cheirosa 62 از Sol de Janeiro. Sol de Janeiro وقتی یکی از اعضای Gen Z بوی خوبی می دهد، احتمالاً می توانید از Sol de Janeiro تشکر کنید. من یک هزاره هستم و تازه وارد این برند هستم، بنابراین شش تا از عطرهای محبوب آن را امتحان کردم. بهترین رایحه، به نظر من، یکی از کم ارزش ترین رایحه های این برند است. Millennials دارای ویکتوریا سیکرت و Bath Body Works بودند. ژنرال Z دارای سول دژانیرو است. این برند بدن، مو و عطر که در سال 2015 تأسیس شد، به یک بازیگر اصلی در صنعت تبدیل شده است. گزارش سال مالی 2025 از گروه L'Occitane، شرکت مادر سول دو ژانیرو، نشان می دهد که این برند 31.6 درصد از فروش گروه را به خود اختصاص داده است. این گزارش همچنین Sol de Janeiro را به عنوان برند زیبایی شماره 1 سفورا آمریکای شمالی و برند شماره 1 عطر در آمازون ایالات متحده در آن زمان معرفی کرد. دو محصول Sol de Janeiro منجر به این اتهام شده است. ابتدا، هزاره‌ها کرم برزیلی Bum Bum 48 دلاری را پس از عرضه در سال 2015 پذیرفتند و آن را به یک محصول اصلی مراقبت از پوست تبدیل کردند. جوانان و نوجوانان اکنون شیفته عطرهای 39 دلاری Cheirosa شده‌اند که اولین آن در سال 2020 عرضه شد. این اسپری‌ها به ww.zoomit.ir/car/469697-us-military-bans-byd-evs/", "summary": "ارتش آمریکا ورود خودروهای برقی بی‌وای‌دی را به‌دلیل خطرات امنیتی به پایگاه هوایی کادنا در ژاپن ممنوع اعلام کرد.", "date_str": "2026-10-24T14:00:00+00:00", "hash": "36179c548fa55a14", "title_fa": "ممنوعیت خودروهای BYD در پایگاه‌های استراتژیک آمریکا در ژاپن", "summary_fa": "ارتش آمریکا ورود خودروهای برقی بی‌وای‌دی را به‌دلیل خطرات امنیتی به پایگاه هوایی کادنا در ژاپن ممنوع اعلام کرد. تبلیغات ارتش ایالات متحده ورود خودروهای ساخت خودروساز چینی بی‌وای‌دی را به یک پایگاه هوایی در ژاپن ممنوع کرد . مقامات نظامی دلیل چنین تصمیمی را خطرات امنیتی ناشی از حضور این خودروها دانسته‌اند. محدودیت تردد از روز دوشنبه در پایگاه هوایی کادنا واقع در جزیره‌ی اوکیناوای ژاپن به مرحله‌ی اجرا درمی‌آید. این مرکز نظامی پایگاه کلیدی نیروی هوایی آمریکا در زنجیره‌جزایر جنوب غربی ژاپن در لبه‌ی دریای چین شرقی به‌شمار می‌رود. سرهنگ دوم الی استورمر ، سخنگوی پایگاه کادنا، گفت: «این وسایل نقلیه خطری غیرقابل قبول و غیرقابل مهار برای پرسنل و ماموریت ما ایجاد می‌کنند.» استورمر جزئیاتی درباره‌ی ماهیت دقیق نگرانی‌های امنیتی فرماندهی پایگاه مطرح نکرد. بی‌وای‌دی که در سال ۲۰۲۵ با پیشی گرفتن از تسلا به بزرگ‌ترین فروشنده‌ی خودروهای برقی در جهان تبدیل شد، واکنشی به این موضوع نشان نداده است. بی‌وای‌دی هم‌اکنون در حال گسترش حضور در بازارهای جهانی از جمله ژاپن است و پیش‌تر خودرو جمع‌وجور «راکو» را برای رقابت با برندهای بومی وارد بازار این کشور کرد. پنتاگون پیش‌تر، بی‌وای‌دی را در کنار شرکت‌هایی چون علی‌بابا، بایدو و نیو در فهرست مجموعه‌های حامی ارتش چین قرار داده بود؛ تصمیمی که با مخالفت بی‌وای‌دی و وعده‌ی پیگیری حقوقی مواجه شد. چین نیز پیش‌تر محدودیت‌های مشابهی را علیه خودروهای تسلا اعمال کرده بود. دولت پکن در سال ۲۰۲۱ ورود تسلا را به‌دلیل نگرانی از دوربین‌های نصب‌شده روی خودروها به برخی محوطه‌های دولتی ممنوع کرد؛ اما پس از اخذ تاییدیه‌های لازم از سوی انجمن خودروسازان چین، محدودیت‌ها را در سال ۲۰۲۴ لغو کرد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟", "image_url": "https://api2.zoomit.ir/media/6746ed5a073eb22d13b384fc?w=128&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I'm 38 and feel like my life is speeding up. My 61-year-old husband wants to slow down.", "link": "https://www.businessinsider.com/older-husband-young-kids-age-gap-marriage-2026-10", "summary": "The author and her husband have a 23-year age gap. Courtesy of Caroline Chirichella My husband is 23 years older than I am, but our age difference never bothered me before. Now that he's 61 and we're raising two young kids, I'm noticing our different energy levels. I love our life together, but I'm struggling with the realities of our age gap. When my husband and I first met back in 2014, we had what many would consider a whirlwind romance. We met, fell in love almost instantly, moved in together after a year, got engaged six months later, married a month after that, and a little over a year later, welcomed our first child. It was all very exciting, rushed, and filled with emotion and love. I'm also a very rational person who doesn't get easily swept up in the moment. So we talked about a lot of the \"hard\" decisions that couples so often neglect to discuss at the beginning of a relationship. We talked about children, our future, and what we wanted our lives to look like. That's why, now, more than 12 years later , it's surprising to find myself struggling with something I thought I had already made peace with: our age gap. He is 23 years older than me My husband and I have a 23-year age difference. Yes, I was always aware of it. And, to be honest, it never really made a difference to me. The author s husband is now in his 60s and the couple has two young kids. Courtesy of the author Especially when it came to the big life decisions , including having children, we had those conversations before we even got engaged. I knew exactly how old he was. I knew there would be things about growing older together that would be different for us. But I guess there's a big difference between being aware of something that could eventually happen and actually living it. Our age difference has been showing up in more ways than one lately, and there's a part of me that's angry with myself for being surprised by it. It's not like my husband was always going to be the 48-year-old I met when I was 25. I knew he would age. I knew things would change as he got older. I knew there would eventually be a point when the difference between us became more noticeable. I just don't think I ever wanted to admit to myself exactly how much. He's in his 60s now I knew he was going to be an older father. I knew all of this. But knowing something and seeing it firsthand are two very different things. Lately, I've seen just how much his 61 years are catching up to him, and it's been putting me ", "date_str": "2026-10-24T14:36:01+00:00", "hash": "e546110d96bcce94", "title_fa": "من 38 ساله هستم و احساس می کنم زندگی ام در حال افزایش است. شوهر 61 ساله من می خواهد سرعتش را کم کند.", "summary_fa": "نویسنده و همسرش 23 سال فاصله سنی دارند. با حسن نیت از کارولین چیریچلا شوهر من 23 سال از من بزرگتر است، اما تفاوت سنی ما قبلاً هرگز مرا آزار نمی داد. اکنون که او 61 ساله است و ما دو فرزند جوان را بزرگ می کنیم، متوجه سطوح مختلف انرژی خود هستم. من عاشق زندگی مشترکمان هستم، اما با واقعیت های فاصله سنی خود دست و پنجه نرم می کنم. وقتی من و شوهرم برای اولین بار در سال 2014 با هم آشنا شدیم، چیزی را داشتیم که خیلی ها آن را یک عاشقانه طوفانی می دانستند. ما با هم آشنا شدیم، تقریباً بلافاصله عاشق هم شدیم، پس از یک سال با هم نقل مکان کردیم، شش ماه بعد نامزد کردیم، یک ماه بعد ازدواج کردیم و کمی بیش از یک سال بعد، به اولین فرزندمان خوش آمد گفتیم. همه چیز بسیار هیجان انگیز، عجولانه و پر از احساسات و عشق بود. من همچنین یک فرد بسیار منطقی هستم که در لحظه به راحتی درگیر نمی شوم. بنابراین ما در مورد بسیاری از تصمیمات \"سخت\" صحبت کردیم که زوج ها اغلب از بحث در مورد آنها در ابتدای یک رابطه غفلت می کنند. ما در مورد بچه ها، آینده مان و اینکه می خواهیم زندگیمان چگونه باشد صحبت کردیم. به همین دلیل است که اکنون، بیش از 12 سال بعد، تعجب آور است که متوجه شوم با چیزی دست و پنجه نرم می کنم که فکر می کردم قبلاً با آن صلح کرده ام: فاصله سنی ما. او 23 سال از من بزرگتر است من و همسرم 23 سال اختلاف سنی داریم. بله، من همیشه از آن آگاه بودم. و صادقانه بگویم، هرگز برای من تفاوتی ایجاد نکرد. شوهر نویسنده اکنون 60 ساله است و این زوج دو فرزند خردسال دارند. با حسن نیت از نویسنده، به خصوص وقتی", "image_url": "https://i.insider.com/6ad0d778adb77227909a5e58?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲ آبان • ۱۸:۰۶"}, {"source": "Business Insider", "title": "My best friend and I have taken a trip together every year since college. Our getaways look very different now.", "link": "https://www.businessinsider.com/take-trip-with-friend-every-year-since-college-how-2026-10", "summary": "Although our trips have grown from fun and wild in our 20s to fun and chill in our early 30s, we re always excited to spend this special time together. Alexa Mellardo After college, my best friend and I committed to going on a trip together every year. It's been a great way to stay connected and make new memories , even as our lives change. Our trips are more relaxed in our 30s than they were in our 20s, but they've all been wonderful. I'm a firm believer that there are some people in this world you're simply destined to meet and have in your life forever. For me, one of those people is my sorority-Little-turned-soul-sister, Lisa. After bonding over many things during recruitment sophomore year — including our shared love for Blink-182 and punk rock — we both unknowingly wrote down on the get-to-know-you quizzes for the committee that we hoped to be paired as Big and Little sisters. We were, and the rest is history. Our college days were constantly filled with plans together, and by graduation, we couldn't imagine embarking on this next phase of adulthood with over 180 miles between us. She's from the Boston area, while I'm from Connecticut and moved to New York City right after college. So, we agreed to prioritize our friendship and made a pact to spend time together in person every year. Since graduating in 2015, we've planned a getaway together every summer. Our trips haven't always looked the same, but they have some constants Distance has never kept us apart because we didn t let it. Alexa Mellardo Right out of college, Lisa and I looked forward to a few sun-drenched days spent catching up on Long Beach Island, New Jersey. From the Victoria Guest House to the Engleside Inn, we'd book a charming yet affordable place steps away from the beach to spend long days working on our tans, cranking up the tunes, and sipping spiked seltzers. At night, we'd head out for bar hopping and dancing to live music until the wee hours of the morning. The next day, we would rinse and repeat. We initially chose the Jersey Shore because it's an easy ride to perfect summer weather and beautiful beaches. It became our go-to place, though we now switch up locations every now and then. No matter where we go, I know we ll have a good time. Alexa Mellardo Fast-forward to more than a decade after graduating from college, and our summer tradition is still going strong — but it looks quite different. For this year's getaway, we stayed in a charming room at Greydon House in downtown ", "date_str": "2026-10-24T14:28:01+00:00", "hash": "6c8367fe21e4a8ce", "title_fa": "من و بهترین دوستم از زمان دانشگاه هر سال با هم سفر می کنیم. محل های فرار ما اکنون بسیار متفاوت به نظر می رسد.", "summary_fa": "اگرچه سفرهای ما از سرگرمی و وحشیانه در دهه 20 سالگی به سرگرمی و آرامش در اوایل 30 سالگی تبدیل شده است، ما همیشه هیجان زده هستیم که این زمان خاص را با هم بگذرانیم. الکسا ملاردو پس از کالج، بهترین دوستم و من متعهد شدیم که هر سال با هم به یک سفر برویم. این یک راه عالی برای ارتباط ماندن و ایجاد خاطرات جدید بوده است، حتی با تغییر زندگی ما. سفرهای ما در دهه 30 زندگی ما آرام تر از 20 سالگی است، اما همه آنها فوق العاده بوده اند. من کاملاً معتقدم که در این دنیا افرادی هستند که قرار است آنها را ملاقات کنید و برای همیشه در زندگی خود داشته باشید. برای من، یکی از این افراد خواهرخوانده من، لیزا، خواهر کوچکم است. بعد از اینکه در طول سال دوم استخدام در مورد چیزهای زیادی با هم صحبت کردیم - از جمله عشق مشترک ما به Blink-182 و پانک راک - هر دو ناخودآگاه در آزمون های آشنایی با شما برای کمیته ای که امیدوار بودیم به عنوان خواهران بزرگ و کوچک جفت شویم، یادداشت کردیم. ما بودیم و بقیه اش تاریخ است. روزهای دانشگاهی ما دائماً پر از برنامه‌های مشترک بود، و با فارغ‌التحصیلی، نمی‌توانستیم تصور کنیم که مرحله بعدی بزرگسالی را با بیش از 180 مایل بین ما آغاز کنیم. او اهل منطقه بوستون است، در حالی که من از کانکتیکات هستم و بلافاصله بعد از کالج به شهر نیویورک نقل مکان کردم. بنابراین، ما توافق کردیم که دوستی خود را در اولویت قرار دهیم و پیمان بستیم که هر سال زمانی را به صورت حضوری با هم بگذرانیم. از زمانی که در سال 2015 فارغ التحصیل شدیم، هر تابستان یک دور با هم برنامه ریزی کرده ایم. سفرهای ما همیشه یکسان به نظر نمی‌رسیدند، اما ثابت‌هایی دارند که فاصله هرگز ما", "image_url": "https://i.insider.com/6ad7d5f9e50b02f612be568d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آبان • ۱۷:۵۸"}, {"source": "Business Insider", "title": "The AI data center boom has a ghost problem", "link": "https://www.businessinsider.com/ai-data-center-boom-ghost-projects-bragawatts", "summary": "Halloween ghosts on a Silicon Valley lawn. Alistair Barr/Business Insider A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . The AI data center boom looks like it's running into serious trouble. Projects are being delayed, canceled, or abandoned. Electricity shortages are holding everything up. But there's a twist: A lot of these data centers were probably never going to get built in the first place. Bernstein Research analyzed thousands of planned US data centers and concluded that only about 35% of the announced capacity is likely to become reality. The industry has a wonderful name for some of the more dubious projects: \" Bragawatts .\" These are enormous data centers announced by companies that often have little experience building them. Some haven't secured electricity, construction permits, or even customers. Then there are the \"ghost projects.\" Developers submit multiple requests for electricity connections, hoping at least one location works out. In Texas, these requests have reached more than five times the state's existing electricity supply. No wonder the grid looks overwhelmed. This doesn't mean the AI boom is fake. Far from it. My colleague Eugene Kim exclusively reported this week that even Amazon, one of the world's most experienced data center builders, is struggling to get enough electricity to power its expensive AI equipment . But there's a big difference between Amazon's very real problems and an inexperienced developer announcing a gigantic project that may never happen. The AI data center boom is real, and so are the challenges of building all these facilities. But the sheer number of speculative projects may be making those challenges look bigger than they truly are. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-10-24T14:00:01+00:00", "hash": "1fb655fa0faad7cc", "title_fa": "رونق مرکز داده هوش مصنوعی یک مشکل ارواح دارد", "summary_fa": "", "image_url": "https://i.insider.com/6adbb9828e95884e1ca82cab?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۲ آبان • ۱۷:۳۰"}],
      media: [{"source": "Billboard", "title": "Macklemore Speaks Out on Palestine and ICE at First Show Since Ed Sheeran Tour Exit", "link": "https://www.billboard.com/music/music-news/macklemore-free-palestine-red-rocks-ed-sheeran-tour-exit-1236367576/", "summary": "Macklemore returned to the stage Thursday night (Oct. 22) with a message that made clear he has no plans to retreat from the stance that preceded his removal from Ed Sheeran’s tour. During a 17-song set at Colorado’s Red Rocks Amphitheatre, the rapper paused the show to address the crowd, calling for a “free Palestine” while also speaking about Sudan, Congo, Lebanon, Haiti, and people affected by U.S. Immigration and Customs Enforcement. “Being a human being in this moment is not complicated,” Macklemore said, according to footage from the concert. “It is not political. It is human to have a heart, to watch others suffering and to say, ‘Not anymore!’ So I say, free Palestine. I say, free Palestine!” He continued: “I say, free Sudan. I say, free Congo, Lebanon, to Haiti, to all the people that are affected by ICE in America, who are afraid to leave their houses.” “The message will always be love,” he concluded. View this post on Instagram The Red Rocks appearance marked Macklemore’s first concert since a turbulent run opening for Sheeran’s Loop Tour in September. During two shows at MetLife Stadium in New Jersey , Macklemore called for Palestinian freedom from the stage and performed his 2024 protest song “Hind’s Hall” alongside imagery from Gaza. The performances prompted criticism from groups including the Israeli-American Council and ultimately led to his removal from the remaining dates. Tour promoter Messina Touring Group said at the time that venues on the upcoming U.S. run had informed organizers they would not host the concerts with Macklemore on the lineup. Robert Kraft, whose Kraft Group owns Gillette Stadium , later confirmed that he had barred Macklemore from appearing at the Massachusetts venue, citing rhetoric and imagery that Kraft said had been offensive and hurtful to members of the Jewish community. Sheeran subsequently stressed that the decision to remove Macklemore was not his, writing that it had been made by the promoter and venues. “I respect Macklemore’s strength of purpose to stand up and shout for what he believes,” Sheeran said at the time, while adding that his own approach was to “maintain diplomacy and keep conversations open, not closed.” Macklemore responded by pledging the $1 million he earned from his stint on the tour to organizations providing aid to Palestinians. Kraft later announced a $2 million contribution to humanitarian aid in the region. The fallout also reshaped the remainder of Sheeran’s tour, with opening acts ", "date_str": "2026-10-25T05:26:30+00:00", "hash": "5168fcf2ea677a61", "title_fa": "مککلمور در اولین نمایش از زمان خروج از تور اد شیران درباره فلسطین و ICE صحبت می کند", "summary_fa": "مککلمور پنجشنبه شب (22 اکتبر) با پیامی به صحنه بازگشت که به وضوح نشان می‌داد او قصد ندارد از موضعی که قبل از حذفش از تور اد شیران حذف شده بود، عقب‌نشینی کند. در طول یک مجموعه 17 آهنگی در آمفی تئاتر رد راکس کلرادو، خواننده رپ برنامه را متوقف کرد تا به جمعیت سخنرانی کند، و در عین حال درباره سودان، کنگو، لبنان، هائیتی و افرادی که تحت تأثیر قوانین مهاجرت و گمرک ایالات متحده قرار گرفته اند صحبت کرد. طبق تصاویری از کنسرت، مککلمور گفت: «انسان بودن در این لحظه پیچیده نیست. \"سیاسی نیست. انسانی است که دل داشته باشی، رنج دیگران را تماشا کنی و بگوییم: \"دیگر نه!\" پس من می گویم فلسطین را آزاد کنید. من می گویم فلسطین آزاد!\" وی ادامه داد: من می‌گویم سودان آزاد، کنگو، لبنان، هائیتی را آزاد می‌کنم، به همه افرادی که تحت تأثیر ICE در آمریکا هستند و می‌ترسند خانه‌های خود را ترک کنند. او در پایان گفت: پیام همیشه عشق خواهد بود. این پست را در اینستاگرام مشاهده کنید ظاهر Red Rocks اولین کنسرت مک‌کلمور پس از شروع پرتلاطم تور شیران در ماه سپتامبر بود. در طی دو نمایش در استادیوم MetLife در نیوجرسی، مکلمور خواستار آزادی فلسطین از روی صحنه شد و آهنگ اعترا د، که فیلم را به بازار TIFFCOM جشنواره بین‌المللی فیلم توکیو (28 تا 30 اکتبر) می‌برد. قبل از آن، اولین نمایش عمومی خود را در 25 اکتبر در هفته فیلم جاکارتا انجام می دهد. اولین فیلم بالسامو به عنوان کارگردان بر روی بیما متمرکز است، یک کودک 11 ساله اهل بالی که امیدوار است حرفه ای به عنوان یک فوتبالیست حرفه ای به خانواده اش زندگی بهتری بدهد. پیوند شانسی با بازیکن سابق آث میلان در آخرین دوره زندگی حرفه ای خود، چشم انداز هر دوی آنها را تغییر می دهد. داستان‌های مرتبط جان اندرسون، تالار مشاهیر کشور که آثارش شامل سمینول ویند و «سوینگین» بود، در ۷۱ سالگی درگذشت. تاد اندرسون، هنرمند استوری‌بورد The Nice Guys و همکار قدیمی برادران کوئن، در ۶۷ سالگی درگذشت. بالسامو همچنین در کنار تارا سیبل دمرن، نماد آث میلان، الساندرو کوستاکورتا و آتیقه هاسیهولان، اوکا آنتارا و تیو پاکوسادوو، هر سه برنده جشنواره فیلم اندونزی (FFI) روی پرده ظاهر می شود. محبوب در Variety Balsamo فیلمنامه را نوشت و با دمرن تهیه کرد. استودیوی ریوا مبدأ این پروژه است و از تهیه کنندگان آن می توان به آریو ساگانتورو از فرنچایز \"The Raid\" اشاره کرد. فیلم Adhya Pictures در سینماهای اندونزیایی اکران شده و برای سال 2027 برنامه ریزی شده است.", "image_url": "https://variety.com/wp-content/uploads/2026/10/Forza.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۳ آبان • ۰۷:۰۲"}, {"source": "Variety", "title": "‘KPop Demon Hunters,’ ‘Squid Game’ Stars Fete Netflix’s Korea Decade as Ted Sarandos Teases ‘Tantara,’ ‘All of Us Are Dead’ Season 2", "link": "https://variety.com/2026/tv/news/kpop-demon-hunters-squid-game-stars-netflix-korea-decade-1236930528/", "summary": "Stars of “Squid Game” and “KPop Demon Hunters” took the stage in Seoul on Oct. 24 as Netflix celebrated 10 years in Korea with a fan festival, where co-CEO Ted Sarandos previewed upcoming titles including “Tantara” and “All of Us Are Dead” Season 2. “Squid Game” was represented by Lee Jung-jae, Lee Byung-hun and Park [ ]", "date_str": "2026-10-25T03:21:03+00:00", "hash": "7d202ba27c69018d", "title_fa": "ستارگان « ter Has “More Story To Tell” With A Season 4, But Isn’t Getting “Too Attached”", "link": "https://deadline.com/2026/10/nobody-wants-this-erin-foster-more-story-to-tell-season-4-1237172691/", "summary": "If Netflix wants this, Erin Foster is ready to serve up a fourth season of her Jewish romantic-comedy. Following the release of Nobody Wants This Season 3, the series creator recently confirmed she has more story to tell if the streamer gives the show a renewal, but noted she tries not to get too attached [ ]", "date_str": "2026-10-25T02:34:00+00:00", "hash": "13d504603ff0eb0a", "title_fa": "خالق «هیچ کس این را نمی‌خواهد» ارین فاستر «داستان بیشتری برای گفتن» با فصل 4 دارد، اما «خیلی به هم وابسته نیست»", "summary_fa": "اگر نتفلیکس این را بخواهد، ارین فاستر آماده است تا فصل چهارم رمانتیک-کمدی یهودی خود را پخش کند. پس از انتشار هیچ‌کس این فصل 3 را نمی‌خواهد، خالق سریال اخیراً تأیید کرد که اگر پخش کننده سریال را تمدید کند، داستان بیشتری برای گفتن دارد، اما خاطرنشان کرد که سعی می‌کند زیاد به آن وابسته نشود [ ] مراحل بعدی وجود دارد که افرادی که در 20 سالگی خود نیستند، ازدواج می‌کنند و شما از قبل به نوعی پشت سر بقیه شروع می‌کنید. من تجربه کردم که وقتی ازدواج کردم، 37 ساله بودم و این یک تجربه متفاوت است. بنابراین، بله، من فکر می کنم که داستان بیشتری برای گفتن وجود دارد. فاستر ادامه داد، اما من هم کسی هستم که خیلی به نتیجه دلبسته نیستم و به نوعی به بازار اجازه می دهم که به ما بگوید از ما چه می خواهد. من هرگز نمی خواهم نمایشی داشته باشم که بیشتر از آن چیزی باشد که مردم بخواهند آن را ببینند. من ترجیح می دهم مردم بیشتر بخواهند تا کمتر بخواهند. در Deadline In Nobody Wants This، با الهام از رابطه فاستر با همسرش سیمون تیخمن، پادکست آگنوستیک، جوآن ویلیامز (کریستن بل) عاشقانه غیرمنتظره ای را با خاخام نوح روکلوف (آدام برودی) آغاز می کند که هر دو خانواده را متزلزل می کند زیرا جوآن خود را به فرهنگ و آئین نوح غوطه ور می کند. نظرات فاستر در فصل 4 پس از پاسخ او به حمایت برودی از فلسطین آزاد منتشر می شود که باعث ایجاد جنجال در میان طرفداران این سریال طرفدار اسرائیل شده است. در حالی که من آدم را دوست دارم، اما با او مخالفم. او گفت و این اشکالی ندارد. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین", "image_url": "https://deadline.com/wp-content/uploads/2026/10/Nobody_Wants_This_n_S3_E1_00_16_30_10R_5dc983.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "نتفلیکس"], "datetime_fa": "۳ آبان • ۰۶:۰۴"}, {"source": "Hollywood Reporter", "title": "Anthropic Sued for Using Elvis Presley Music to Train AI Models", "link": "https://www.hollywoodreporter.com/music/music-industry-news/anthropic-elvis-presley-lawsuit-ai-1236739617/", "summary": "The suit was filed Friday and claims the company infringed 274 songs of Presley's, including “Can’t Help Falling in Love,” “A Little Less Conversation” and “Don’t Be Cruel,\" per Billboard.", "date_str": "2026-10-25T02:22:41+00:00", "hash": "26b2fc8b6105c8bf", "title_fa": "آنتروپیک به دلیل استفاده از موسیقی الویس پریسلی برای آموزش مدل های هوش مصنوعی شکایت کرد", "summary_fa": "شکایت روز جمعه مطرح شد و ادعا می‌کند که شرکت 274 آهنگ پریسلی، از جمله «Can’t Help Falling in Love»، «A Little Less Conversation» و «Don’t Be Cruel» را در هر بیلبورد نقض کرده است. آنتروپیک توسط صاحبان موسیقی الویس پریسلی به دلیل استفاده از آهنگ های او برای آموزش مدل های هوش مصنوعی بدون اجازه شکایت شده است. همانطور که توسط بیلبورد گزارش شده است، شکایت روز جمعه تشکیل شد و ادعا می‌کند که این شرکت 274 آهنگ پریسلی را نقض کرده است، از جمله \"Can't Help Falling in Love\"، \"A Little Less Conversation\" و \"Don't Be Cruel.\" وکیل اصلی ریچارد بوش نوشت. \"شاکیان الویس عمیقاً از این آهنگ های نمادین محافظت می کنند.\" داستان‌های مرتبط Music Chappell Roan PinkPantheress را به خدمت می‌گیرد تا نمایش‌های جمع‌آوری سرمایه فوق‌العاده گرافیکی را ببندد. اخبار عمومی مطالعه نوجوانان: قوانین YouTube، AI Doom با افزایش سن افزایش می‌یابد و فیلم‌بازی Beats Sports در آخر هفته‌ها Authentic Brands Group، که مالک حقوق حقوقی راک به همراه سایر حقوق مالکیت راک است. خواننده به نقل از بیلبورد. به عی انجام می دهد، شریک است [ ] اولین پروژه ای که مورد بحث قرار می گیرد «پژواک نوسانتارا» است، عنوان کاری برای یک اسطوره-ماجراجویی اصلی. Historyverse توسعه خلاق، تولید و بسته بندی IP را اجرا خواهد کرد و با استعدادهای محلی همکاری خواهد کرد تا پروژه ها را برای تامین مالی، تولید و توزیع احتمالی در خارج از اندونزی آماده کند. ویجی سوبرامانیام، مؤسس و مدیر عامل گروه «شبکه هنرمندان جمعی» گفت: «فرانچایزهای بعدی سرگرمی جهانی همه از هالیوود نمی آیند. \"هر بازاری داستان هایی دارد که شایسته سفر بیشتر است، و اندونزی ثروت خارق العاده ای از آنها دارد. جاه طلبی ما با Collective Studios's Historyverse این است که با سازندگان اندونزیایی همکاری کنیم تا این داستان ها را به فیلم، سریال و مکان های سرگرمی بزرگتر برای جهان تبدیل کنیم. Galleri5 راه جدیدی را برای نزدیک شدن به مقیاس فیلمسازی به ما می دهد، در حالی که دیدگاه خلاقانه و خود داستان ها در مرکز باقی می مانند. محصول اصلی Galleri5، G5 AI Studio، بیش از 200 مدل هوش مصنوعی را همراه با ابزارهای هدفمند برای استوری‌برد، طراحی شخصیت‌ها و جهان‌ها، انیمیشن، VFX و ویدئو با کیفیت فیلم را به همراه دارد. بیش از 10000 آگهی و ویدیو در این پلتفرم ساخته شده است. JioStar و شبکه رسانه جمعی «Mahabharat: Ek Dharmayudh» را راه‌اندازی کردند و Galleri5 فناوری فیلم‌سازی با هوش مصنوعی را در پشت نمایش ساخت و اجرا کرد. این شرکت اکنون در حال توسعه جریان کاری برای نمایشنامه Historyverse است که شامل", "image_url": "https://variety.com/wp-content/uploads/2026/10/Collective-Galleri5.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما"], "datetime_fa": "۳ آبان • ۰۶:۰۰"}, {"source": "Variety", "title": "SAG-AFTRA Extends Duncan Crabtree-Ireland’s Contract and Adds CEO to Title", "link": "https://variety.com/2026/film/news/sag-aftra-duncan-crabtree-ireland-contract-extension-1236930503/", "summary": "The SAG-AFTRA board voted Saturday to extend the contract of Duncan Crabtree-Ireland, the union s national executive director, for four years and to add CEO to his title. Crabtree-Ireland s contract was set to expire in 2028, but will now run through June 20, 2032. The financial terms of the agreement were not disclosed. He was paid [ ]", "date_str": "2026-10-25T01:20:54+00:00", "hash": "f8a2881364b866cd", "title_fa": "SAG-AFTRA قرارداد دانکن کرابتری و ایرلند را تمدید کرد و مدیرعامل را به عنوان مدیر عامل اضافه کرد", "summary_fa": "هیئت مدیره SAG-AFTRA روز شنبه به تمدید قرارداد دانکن کرابتری-ایرلند، مدیر اجرایی ملی اتحادیه، به مدت چهار سال و اضافه کردن مدیرعامل به عنوان وی رای داد. قرارداد Crabtree-Ireland قرار بود در سال 2028 منقضی شود، اما اکنون تا 20 ژوئن 2032 ادامه خواهد داشت. شرایط مالی این توافق فاش نشده است. به او دستمزد داده شد [ ] تمدید قرارداد Crabtree-Ireland را از طریق دور بعدی مذاکرات با استودیوهای بزرگ انجام خواهد داد و قرارداد فعلی در ژوئن 2030 منقضی می شود. اتحادیه در بیانیه‌ای اعلام کرد که این تمدید ثبات و تداوم بیشتری را برای اتحادیه در زمان اختلالات بی‌سابقه در صنعت ایجاد می‌کند. داستان های مرتبط مارک مورتیمر، یکی دیگر از ستاره های اپرای صابون جهانی، در 59 سالگی درگذشت ریچارد ریهل، بازیگر شخصیت در فضای اداری، پیشتازان فضا، ساقدوش ها و بیشتر، درگذشت در 78 سالگی کرابتری-ایرلند تقریباً تمام دوران حرفه ای خود را در SAG-AFTRA گذرانده و به عنوان مشاور عمومی و مدیر اجرایی ملی خدمت کرده است. او هوش مصنوعی را محور اصلی مذاکرات اتحادیه قرار داده است و به مجموعه ای از توافقات دست یافته است که هدف آن این است که به مجریان اجازه دهد تا از جنبه های مثبت هوش مصنوعی و در عین حال محافظت از آنها در برابر استفاده های غیرمجاز از شباهت هایشان، استفاده کنند. او همچنین در اعتصاب بازیگران سال 2023 یک شخصیت اصلی بود. محبوب در Variety شان آستین، رئیس SAG-AFTRA، پس از رای گیری در بیانیه ای از Crabtree-Ireland تمجید کرد. آستین گفت که برای مبارزه با شرکت های بزرگ جهانی و فراملیتی، به رهبری متخصص با سابقه چانه زنی موفق و تخصص مدیریت عملیاتی قابل توجه نیاز داریم. یعنی دانکن او مدیر اجرایی قدرتمندی است که اتحادیه ما را بر سر میز مذاکره، در سالن های کنگره و در اتاق های هیئت مدیره و", "image_url": "https://variety.com/wp-content/uploads/2026/01/duncan-crabtree-ireland-sean-astin.jpeg?crop=0px%2C114px%2C1918px ز چانه زنی، در سالن های کنگره و در اتاق های هیئت مدیره و اتاق های کنفرانس در سراسر صنعت و جهان رهبری کرده است. ما خوشحالیم که خدمات مستمر دانکن را به اعضای SAG-AFTRA تضمین کرده ایم. قرارداد جدید Crabtree-Ireland در لحظه ای مهم برای انجمن بازیگران سینما به امضا می رسد زیرا هالیوود در بحبوحه خرید شرکت برادران وارنر توسط پارامونت اسکای دنس که رهبری اتحادیه با آن مخالفت کرده است، با شرایط نامشخصی روبرو می شود.", "image_url": "https://deadline.com/wp-content/uploads/2026/03/P104EU7T-e1792892712758.jpg?w=727", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۳ آبان • ۰۵:۲۸"}, {"source": "Variety", "title": "‘I Play Rocky’ Star Anthony Ippolito on Becoming Sylvester Stallone and Acting With a Dog: ‘He Wasn’t a Huge Fan of Me’", "link": "https://variety.com/2026/film/columns/i-play-rocky-anthony-ippolito-sylvester-stallone-dog-1236930482/", "summary": "Anthony Ippolito had to do more than nail Sylvester Stallone’s signature voice to play him in “I Play Rocky.” He also had to transform his skinny physique to one with bulging muscles. “It had its moments for sure. I was being tested,” Ippolito told me Saturday at the AFI Fest “I Play Rocky” screening in [ ]", "date_str": "2026-10-25T01:10:16+00:00", "hash": "566e034e17e88fdb", "title_fa": "آنتونی ایپولیتو، ستاره «راکی» در مورد تبدیل شدن به سیلوستر استالونه و بازی با یک سگ: «او طرفدار زیادی از من نبود»", "summary_fa": "آنتونی ایپولیتو مجبور شد برای بازی در «من راکی ​​بازی می‌کنم» بیشتر از صدای خاص سیلوستر استالونه کار کند. او همچنین مجبور شد هیکل لاغر خود را به بدنی با عضلات برجسته تبدیل کند. شنبه در جشنواره AFI Fest نمایش «من راکی ​​بازی می‌کنم» در [ ] به من گفت: «حتماً لحظات خود را داشت. من در حال آزمایش بودم. با این حال، این مانند یک چیز سازگاری است. من زمان زیادی داشتم، بنابراین فقط یک تغییر سبک زندگی کامل داشتم و این فقط یکی از اولویت های هر روز برای یک دوره بسیار طولانی بود. داستان‌های مرتبط کاپیتان هند کارتیک آریان در میان درگیری حوثی‌ها در یمن اتفاق می‌افتد (اختصاصی) جوایز جشنواره فیلم مورلیا: «شش ماه napshot, he s seen sitting on the hood of a car hugging his copy of the book My Teacher Fried My Brains . One-upping most 40th birthday parties, Drake entered his 40s by sharing the stage with the Backstreet Boys to feature on one of his all-time favorite pop hits, I Want It That Way. The I Want It That Way superfan basked in the joy of the stepping in as a bonus Backstreet Boy Friday night (Oct. 23), unabashedly joining on vocals throughout the 1999 single, one of BSB s top five hits; the track peaked at No. 6 on the Billboard Hot 100 chart that year, and was inescapable on Top 40 radio and MTV s TRL countdown. Drake was 13 years old in 1999. BSB s Howie Dorough worked in a line from Drake s own Hold On, We re Going Home at the bridge. Besides Howie, bandmates Nick Carter, Brian Littrell, AJ McClean and Kevin Richardson all showed up for the surprise birthday performance. The birthday party was reportedly hosted at New York City members-only club Casa Cipriani. Drake wrapped up the ballad, taking on the vocal outro. Watch him croon one of his favorite songs in a video shared on X . “Tonight isn’t about a tour, an album release, or a bunch of videos we shot,” Drake said to party guests Saturday night. “It’s about being alive, staying alive.” He once said that something about I Want It That Way made him feel like he was acknowledged for the first time, and felt like he had a shot at being cool for the first time. According to Drake, the Millennium track s one of the greatest songs of all time.", "date_str": "2026-10-24T23:00:22+00:00", "hash": "c2cf37c72ba4500e", "title_fa": "دریک 40 ساله شد، عکس های شخصی دوران کودکی خود را به اشتراک گذاشت: \"من تو را به خاطر تو می پذیرم\"", "summary_fa": "دریک 40 ساله است. او برای تولد 24 اکتبر خود در رسانه های اجتماعی با نگاهی شیرین و شخصی به شخصیت خود در کودکی ادای احترام کرد. برای خودت در اینستاگرام نوشت تو را به خاطر تو قبول دارم. در آنجا، او تصاویر دوران کودکی خود را در آستانه 40 سالگی منتشر کرد. در یک عکس، او در حالی که روی کا ew lawsuit, filed Friday (Oct. 23) and first reported by Billboard , claims that Anthropic, the tech behemoth behind Claude, infringed 274 of the rock legend s copyrighted songs, including famed hits like “Can’t Help Falling in Love, “A Little Less Conversation” and “Don’t Be Cruel.” Related Taylor Swift Files to Trademark Her Voice and Image as AI Deepfakes Grow Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit The Elvis Plaintiffs bring this action to enforce these exclusive rights against the defendant that has built its entire business model based on copyright infringement at a scale never seen before, writes Richard Busch , the lead attorney behind the lawsuit. The Elvis Plaintiffs are deeply protective of these iconic songs. Though music companies like Universal Music Group have already repeatedly sued AI companies for stealing their IP, the new lawsuits represents by far the most high-profile legal action filed on behalf of an individual musician — in this case, arguably the most famous recording artist of all time. The case was filed by a unit of Authentic Brands Group, the licensing giant that largely controls the intellectual property rights to Elvis, including much of his song catalog, his brand trademarks and the rights to his name, image and likeness. It was co-filed by various other entities that own Elvis rights. Like other AI firms, Anthropic is already facing numerous lawsuits over the process of “training” their models to create new ones, which involves ingesting millions of existing works without permission. AI companies say that process is protected by copyright s fair use defense, but that issue remains pending across dozens of lawsuits with billions of dollars in potential damages at stake. Litigation over AI music has centered more on Suno, the leading AI song generator, which was sued in 2024 by all three major music companies over such training accusations. It eventually settled with Warner Music Group last year and has vowed to partner with the music industry, but is still facing contentious litigation from UMG and Sony Music. Anthropic, a far larger AI firm, has faced similar cases across creative industries, i", "date_str": "2026-10-24T14:34:54+00:00", "hash": "780f0c6501d30dba", "title_fa": "شکایت از آنتروپیک برای دزدیدن موسیقی الویس پریسلی برای آموزش هوش مصنوعی: «از این آهنگ‌های نمادین محافظت عمیق»", "summary_fa": "صاحبان موسیقی الویس پریسلی یک جنگ حقوقی را بر سر هوش مصنوعی به راه انداخته‌اند و از غول هوش مصنوعی Anthropic شکایت کرده‌اند که مدل‌هایش را بدون اجازه صدها آهنگ این هنرمند افسانه‌ای را آموزش داده است. شکایت جدید، که روز جمعه (اکتبر. 23) و اولین بار توسط بیلبورد گزارش شد، ادعا می‌کند که آنتروپیک، غول تکنولوژی پشت کلود، 274 آهنگ دارای حق چاپ این افسانه راک، از جمله آهنگ‌های معروفی مانند «Can’t Help Falling in Love»، «A Little Less Conversation» و «Don’t Be Cruel» را نقض کرده است. فایل‌های مربوط به تیلور سویفت برای علامت تجاری صدا و تصویرش در حالی که AI Deepfakes رشد می‌کند دیدی از زندان نیوجرسی به مرکز مشابهی در پنسیلوانیا ویزر منتقل شد تا جایزه Legend of Live را در اجلاس موسیقی زنده بیلبورد 2026 دریافت کند. شاکیان الویس این حقوق انحصاری را بر اساس تمام کپی‌رایت خود ساخته است که این حقوق انحصاری را در برابر تمام کپی رایت خود ارائه کرده است. ریچارد بوش، وکیل اصلی این شکایت، می نویسد: نقض در مقیاسی که قبلاً دیده نشده بود. شاکیان الویس عمیقاً از این آهنگ های نمادین محافظت می کنند. اگرچه شرکت‌های موسیقی مانند گروه موسیقی یونیورسال قبلاً بارها از شرکت‌های هوش مصنوعی به دلیل سرقت IP آنها شکایت کرده‌اند، شکایت‌های جدید تا حد زیادی نمایانگر برجسته‌ترین اقدام حقوقی است که از طرف یک نوازنده - در این مورد، مسلماً مشهورترین هنرمند ضبط تمام دوران است. این پرونده توسط واحدی از Authentic Brands Group، غول صدور مجوز که تا حد زیادی حقوق مالکیت معنوی الویس، از جمله بسیاری از کاتالوگ آهنگ های او، علائم تجاری برند و حقوق نام، تصویر و شباهت او را کنترل می کند، تشکیل شده است. این توسط نهادهای مختلف دیگری که حقوق الوی     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
