plurges ارتقاء، و بیشتر. اگر شما یک هدیه دهنده هستید یا علاقه مند به دریافت آن هستید، نحوه استفاده از کارت هدیه آمازون را در زیر بیاموزید. من نحوه افزودن کارت هدیه خود را به حساب آمازون خود در زیر شرح داده ام. برای نکات و ترفندهای خرید بیشتر از آمازون، بقیه پوشش Prime Day ما را بررسی کنید. چگونه گیفت کارت آمازون را به حساب خود اضافه کنید اگر گیفت کارت آمازون دریافت می کنید، ساده ترین راه برای بازخرید آن استفاده از پیوند تعیین شده است. وارد حساب کاربری خود شوید، کد ادعای خود را وارد کنید و روی دکمه اعمال به موجودی خود کلیک کنید. می توانید از راه های دیگر نیز استفاده کنید، مانند اپلیکیشن آمازون یا بخش کارت هدیه سایت آمازون. نکته سریع: یک کارت هدیه Roblox دارید که می خواهید از آن استفاده کنید؟ شما باید به جای برنامه از مرورگر استفاده کنید. نحوه بازخرید گیفت کارت آمازون از طریق برنامه این مراحل برای هر دو برنامه آیفون و اندروید کار می کند. 1. برنامه خرید آمازون را باز کنید و روی نماد شخص در نوار ابزار پایین ضربه بزنید تا به اطلاعات حساب خود دسترسی پیدا کنید. برای دسترسی به اطلاعات حساب آمازون خود، روی نماد شخص در پانل پایین ضربه بزنید. جنیفر گونیک/Business Insider 2. در این صفحه، به جایی که روی آن عبارت Gift Card Balance اشاره شده است، بروید"}, {"source": "Business Insider", "title": "Some Dutch stores pull Meta glasses from shelves after creep reports. Is a ban next?", "link": "https://www.businessinsider.com/hans-anders-wehkamp-pause-meta-glasses-ray-ban-sales-netherlands-2026-10", "summary": "Mark Zuckerberg shows off the latest Meta glasses at the recent Meta Connect event. Bloomberg/Getty Images Advocacy groups in the Netherlands are pushing for a ban on Meta glasses. After local news reports of women being surreptitiously filmed, there's a backlash to the glasses. Dutch eyewear retailer Hans Anders has paused sales of the glasses at its stores. Backlash against Meta glasses is heating up in the Netherlands. At least two Dutch retailers are pausing the sale of the glasses following media reports about privacy concerns , and the government is also getting involved. Hans Anders, a large eyewear chain in the Netherlands, is pausing sales of Meta glasses. Wehkamp, a Dutch online retailer, is also pausing sales. \"This decision follows the ongoing public and political debate surrounding smart glasses and the questions being raised about the conditions under which this technology can be used,\" a spokesperson for Nexeye, the parent company of Han Anders, told Business Insider. \"Hans Anders believes it is important to await the outcome of this debate and any subsequent decisions before determining whether and how these products may be offered again.\" The sales halt comes after a Dutch newspaper, AD , published a story about people, especially women, being surreptitiously filmed in public. \"Our glasses continue to be very popular and we're continuing to expand styles and features,\" a Meta spokesperson told Business Insider. \"Every pair with a camera has a bright light on the front that blinks when you take a photo or video — it can't be turned off and the camera is disabled if someone covers or tampers with it.\" The Dutch Data Protection Authority (AP) recently issued a warning about camera glasses and how they are not always noticeable in public. (The glasses do have an indicator light when recording.) \"The AP is also investigating the possibilities for further measures against camera glasses and other wearables with a camera,\" their statement said. A nonprofit called Offlimits issued a statement urging Meta and EssilorLuxxotica to \"remove the controversial Meta glasses from the market as long as they can be used to film covertly.\" Meta defended its glasses from privacy concerns by pointing to the indicator light and anti-tampering features that are designed to permanently disable recording if the light is physically disabled. The company's executives have also said smartphones have long been capable of surreptitious filming and do not feature a recor", "date_str": "2026-10-02T22:17:12+00:00", "hash": "fd6670af7e3ff04a", "title_fa": "برخی از فروشگاه های هلندی پس از گزارش خزش، لیوان های متا را از قفسه ها بیرون می کشند. آیا تحریم بعدی است؟", "summary_fa": "مارک زاکربرگ جدیدترین عینک متا را در رویداد اخیر Meta Connect به نمایش گذاشت. بلومبرگ/گتی ایماژ گروه های مدافع در هلند بر ممنوعیت عینک متا تاکید دارند. پس از گزارش‌های خبری محلی از زنانی که به‌طور مخفیانه فیلم‌برداری می‌شوند، واکنش‌های شدیدی به عینک‌ها وارد می‌شود. هانس آندرس، فروشنده هلندی عینک، فروش این عینک را در فروشگاه های خود متوقف کرده است. واکنش شدید علیه عینک متا در هلند افزایش یافته است. دست‌کم دو خرده‌فروش هلندی در پی گزارش‌های رسانه‌ها در مورد نگرانی‌های مربوط به حفظ حریم خصوصی، فروش عینک‌ها را متوقف کرده‌اند و دولت نیز درگیر آن است. Hans Anders، یک زنجیره بزرگ عینک در هلند، فروش عینک متا را متوقف کرده است. Wehkamp، یک خرده فروش آنلاین هلندی نیز فروش خود را متوقف کرده است. سخنگوی Nexeye، شرکت مادر Han Anders، به Business Insider گفت: «این تصمیم به دنبال بحث‌های عمومی و سیاسی جاری پیرامون عینک‌های هوشمند و سؤالاتی است که در مورد شرایط استفاده از این فناوری مطرح می‌شود. هانس آندرس معتقد است که مهم است که منتظر نتیجه این بحث و هر گونه تصمیمات بعدی قبل از تعیین اینکه آیا این محصولات و چگونه ممکن است دوباره عرضه شوند یا خیر.\" توقف فروش پس از آن صورت گرفت که یک روزنامه هلندی، AD، داستانی را درباره فیلمبرداری مخفیانه مردم، به ویژه زنان در انظار عمومی منتشر کرد. یکی از سخنگویان متا به Business Insider گفت: \"عینک های ما همچنان بسیار محبوب هستند و ما همچنان به گسترش سبک ها و ویژگی های خود ادامه می دهیم.\" هر جفت دارای دوربین دارای یک چراغ روشن در جلو است که هنگام گرفتن عکس یا فیلم چشمک می زند - نمی توان آن را خاموش کرد و اگر کسی آن را بپوشاند یا دستکاری کند، دوربین غیرفعال می شود. سازمان حفاظت از اطلاعات هلند (AP) اخیراً هشداری در مورد عینک"}, {"source": "Business Insider", "title": "Anthropic funds $100M academy to train deployed AI engineers", "link": "https://www.businessinsider.com/anthropic-will-train-10-000-ai-engineers-boost-enterprise-adoption-2026-10", "summary": "Anthropic is investing $100 million in training engineers from Accenture, Bain, Capgemini, Deloitte, and McKinsey. Matteo Della Torre/NurPhoto via Getty Images Anthropic starts a new training program for FDEs. The first cohort will include engineers from consulting firms like Deloitte, Bain, and McKinsey. FDEs were initially popularized by Palantir and help deploy tools directly into client systems. Anthropic is investing $100 million to train 10,000 engineers to help companies move AI projects from idea to production. On Friday, Anthropic announced Claude Frontier Academy, a program designed to tackle one of the major barriers to enterprise AI adoption: finding people who can build and deploy AI inside a real business. The first cohorts include engineers from Accenture, Bain, Capgemini, Deloitte, McKinsey, Morgan Stanley, Novo Nordisk, and Commonwealth Bank of Australia. Anthropic aims to train 10,000 Frontier Deployed Engineers, or FDEs, by the end of 2027. Anthropic said the engineers will begin with a multi-day, in-person program led by Anthropic engineers and instructors. They work through a simulated company deployment, from selecting a use case to security review and handover. Those who pass then enter a 12-week residency, leading a real Claude project at their own organization. The first engineers certified from the program are expected in early 2027. The effort is another sign that forward-deployed engineers are becoming a prized role in the AI race. FDEs, a role initially popularized by Palantir, work directly with customers to adapt technology to their systems, data, and workflows. They help decide what to build, integrate it with existing technology, and ensure employees can use it. In December 2025, Accenture created the Anthropic Business Group and committed to train roughly 30,000 Accenture professionals on Claude, including Accenture's \"reinvention deployed engineers.\" Last month, Accenture partnered with Google Cloud to send 1,000 engineers to work with major clients on deploying AI agents. Consulting firms have long placed teams inside client organizations to solve problems, but AI is making that work more technical, requiring engineers who also understand how a client's business works, and that's where FDEs are beginning to play a bigger role. A Draup analysis found that FDE openings rose to 1,404 across five major consulting firms in the year ended May, even as overall job postings across seven firms fell about 24% year over year. Read ", "date_str": "2026-10-02T21:47:39+00:00", "hash": "fb4bae315d24d418", "title_fa": "Anthropic برای آموزش مهندسین هوش مصنوعی مستقر به آکادمی 100 میلیون دلاری سرمایه گذاری می کند", "summary_fa": "Anthropic در حال سرمایه گذاری 100 میلیون دلاری در آموزش مهندسین از Accenture، Bain، Capgemini، Deloitte و McKinsey است. Matteo Della Torre/NurPhoto via Getty Images Anthropic برنامه آموزشی جدیدی را برای FDE ها آغاز می کند. اولین گروه شامل مهندسانی از شرکت های مشاوره مانند Deloitte، Bain و McKinsey خواهد بود. FDE ها در ابتدا توسط Palantir رایج شدند و به استقرار ابزارها به طور مستقیم در سیستم های مشتری کمک می کردند. Anthropic در حال سرمایه گذاری 100 میلیون دلاری برای آموزش 10000 مهندس برای کمک به شرکت ها برای انتقال پروژه های هوش مصنوعی از ایده به تولید است. روز جمعه، Anthropic آکادمی Claude Frontier را معرفی کرد، برنامه ای که برای مقابله با یکی از موانع اصلی پذیرش هوش مصنوعی سازمانی طراحی شده است: یافتن افرادی که می توانند هوش مصنوعی را در یک تجارت واقعی بسازند و به کار گیرند. اولین گروه ها شامل مهندسانی از Accenture، Bain، Capgemini، Deloitte، McKinsey، Morgan Stanley، Novo Nordisk و Commonwealth Bank of Australia است. آنتروپیک قصد دارد 10000 مهندس مستقر مرزی یا FDE را تا پایان سال 2027 آموزش دهد. آنتروپیک گفت که مهندسان با یک برنامه چند روزه و حضوری به رهبری مهندسان و مربیان آنتروپیک آغاز خواهند کرد. آنها از طریق استقرار شرکتی شبیه سازی شده، از انتخاب یک مورد استفاده گرفته تا بررسی امنیتی و تحویل، کار می کنند. کسانی که قبول می شوند، وارد یک اقامت 12 هفته ای می شوند و پروژه کلود واقعی را در سازمان خود رهبری می کنند. انتظار می رود اولین مهندسانی که از این برنامه گواهی می گیرند در اوایل سال 2027 دریافت کنند. این تلاش نشانه دیگری است که نشان می دهد مهندسان مستقر در آینده در حال تبدیل شدن به یک نقش ارزشمند در مسابقه هوش مصنوعی هستند. FDE ها، نقشی که در ابتدا توسط Palantir رایج"}, {"source": "Business Insider", "title": "Apple is adding new privacy safeguards for Mac users as AI agents get more powerful", "link": "https://www.businessinsider.com/apple-planning-tougher-mac-privacy-controls-ai-agents-2026-10", "summary": "Apple plans new user controls for apps seeking Full Disk Access on Macs, citing increasingly capable AI agents. Kevin Carter/Getty Images Apple plans new controls for apps seeking Full Disk Access on Macs. Users would need to grant more explicit permission before sharing personal digital information. Apple said increasingly autonomous AI agents make sweeping access riskier. Apple wants to make sure you know exactly what you're signing up for before giving an AI agent access to your Mac. The company said in a developer blog post on Friday that it plans to introduce additional privacy controls for macOS's \"Full Disk Access\" setting, which gives apps permission to read sensitive information, including emails, private messages, browsing history, and other personal files. \"Some developers are using Full Disk Access in ways that could put users at risk, exposing everything on their systems — including files, mail, messages, and even browsing history — without users' full knowledge and understanding,\" Apple said. \"Going forward, we will introduce additional controls to ensure that users who genuinely wish to grant an app this extraordinary level of access can only do so with very explicit user action,\" Apple added. \"As AI agents become increasingly capable and autonomous, the risks associated with this level of access will grow substantially.\" For Mac users, that means granting apps a sweeping level of access will require 'very explicit user action,' without explaining how that will differ from the current process. Apple hasn't detailed exactly how the new safeguards will work or when they'll arrive. The company did not say the changes would apply only to AI agents; it said the risks of permission will grow as agents become more capable and autonomous. According to the blog post, the setting was originally intended to help backup software operate, but increasingly capable AI agents are creating new risks . Last month, Inc. columnist Jason Aten alleged that Meta's Muse AI agent had accessed private messages on his Mac mini without his permission. Meta disputed the claim. Andy Stone, Meta's vice president of communication, wrote in a post on X that \"the Messages integration in the Muse app for Mac is entirely opt-in.\" \"You have to enable both Full Disk Access and the Messages connector for Muse to be able to read your Messages content,\" Stone said. \"It can't read your Messages unless you do this. And it can be revoked at any time.\" Read the original article on Busi", "date_str": "2026-10-02T21:33:02+00:00", "hash": "a478e995d5fd3009", "title_fa": "با قدرتمندتر شدن عوامل هوش مصنوعی، اپل در حال افزودن محافظ‌های حریم خصوصی جدید برای کاربران مک است", "summary_fa": "اپل کنترل‌های کاربر جدیدی را برای برنامه‌هایی که به دنبال دسترسی کامل به دیسک در مک هستند، با استناد به عوامل هوش مصنوعی که به طور فزاینده‌ای توانمند هستند، برنامه‌ریزی می‌کند. Kevin Carter/Getty Images اپل کنترل‌های جدیدی را برای برنامه‌هایی که به دنبال دسترسی کامل به دیسک در Mac هستند، برنامه‌ریزی می‌کند. کاربران باید قبل از به اشتراک گذاری اطلاعات دیجیتال شخصی، مجوز صریح تری را اعطا کنند. اپل گفت که کارگزاران هوش مصنوعی به طور فزاینده ای، دسترسی فراگیر را خطرناک تر می کنند. اپل می‌خواهد قبل از اینکه یک عامل هوش مصنوعی به مک شما دسترسی داشته باشد، مطمئن شود که دقیقاً می‌دانید برای چه چیزی ثبت‌نام می‌کنید. این شرکت روز جمعه در یک پست وبلاگ توسعه‌دهنده اعلام کرد که قصد دارد کنترل‌های حریم خصوصی اضافی را برای تنظیمات \"دسترسی کامل به دیسک\" macOS معرفی کند، که به برنامه‌ها اجازه می‌دهد اطلاعات حساس از جمله ایمیل‌ها، پیام‌های خصوصی، تاریخچه مرور و سایر فایل‌های شخصی را بخوانند. اپل می‌گوید: «برخی از توسعه‌دهندگان از دسترسی کامل به دیسک به گونه‌ای استفاده می‌کنند که می‌تواند کاربران را در معرض خطر قرار دهد و همه چیز را در سیستم‌هایشان - از جمله فایل‌ها، نامه‌ها، پیام‌ها، و حتی تاریخچه مرور - بدون آگاهی و درک کامل کاربران در معرض دید قرار دهد.» اپل افزود: «در ادامه، کنترل‌های بیشتری را معرفی خواهیم کرد تا اطمینان حاصل کنیم که کاربرانی که واقعاً می‌خواهند به یک برنامه این سطح دسترسی فوق‌العاده را بدهند، تنها با اقدام بسیار صریح کاربر می‌توانند این کار را انجام دهند. همانطور که عوامل هوش مصنوعی به طور فزاینده ای قادر و مستقل می شوند، خطرات مرتبط با این سطح دسترسی به طور قابل توجهی افزایش می یابد. برای کاربران مک، این بدان معناست که اعطای سطح دسترسی گسترده به برنامه‌ها به «اقدام بسیار صریح کاربر» نیاز دارد، بدون اینکه توضیح داده"}, {"source": "Business Insider", "title": "This Dagne Dover diaper backpack is my go-to travel bag. Here's why it works even if you don't have kids.", "link": "https://www.businessinsider.com/guides/style/dagne-dover-indi-diaper-backpack-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more I traveled with the medium-size Dagne Dover Indi Diaper Backpack on my flight to NYC. Jacqueline Saguin/Business Insider I'm a 20-something-year-old woman without kids. It may not make sense for me to be traipsing round the airport with a diaper bag on my back, but I'm here to tell you why diaper backpacks actually make the best carry-on bags . I first read this advice from a flight attendant who swears by hers as a personal item bag . On my recent impromptu flight to NYC, I had the perfect opportunity to put this theory to the test. Spoiler alert: the Dagne Dover Indi proved her to be correct. My main takeaway: After flying once with the medium-sized Dagne Dover Indi Diaper Backpack, I'll never travel without it again. It's comfortable to carry, fits a ton, and more chic-looking than you'd expect from a diaper bag. Diaper bags are quite literally designed to make your life easier and the Dagne Dover Indi bag does just that. It holds every essential, which in my case included liquids, snacks, a laptop, and every other thing I'd toss into a bag only to forget about later. And the best part? You'd never know it was meant to carry baby bottles. I can fit all my travel essentials in the Dagne Dover Indi Diaper Backpack The diaper bag includes a wallet-sized pouch and portable changing station. Jacqueline Saguin/Business Insider One look at our Dagne Dover review should tell you everything you need to know about how our product experts feel about Dagne Dover: we love the brand's bags. It's clear that tons of thought goes into each design, and the Indi Backpack is a perfect example of this. Just when you think you've counted every pocket, there's another one to be found. The two front zipper pockets conveniently open to one big one that gave me easy access to wet wipes, chapstick, and more. A glimpse inside reveals roomy storage, like two mesh pockets framing the sides that are surprisingly large considering the compact outer appearance. I used the mini pouch to hold my Airpods and chargers, and the changing mat doubles as a traveling WFH setup. The diaper bag comes in small, medium, and large sizes — each offering roughly the same amount of convenient pouches. It has a wide dual-zipper opening that clips to the sides for a less bulky fit, but it can unclip when the bag fills up. I fit everything from my 13-inch laptop to a stack of books into my carry-on backpack. Jacq", "date_str": "2026-10-02T21:31:40+00:00", "hash": "621883f69b120c44", "title_fa": "این کوله پشتی پوشک Dagne Dover کیف مسافرتی من است. در اینجا این است که چرا حتی اگر بچه ندارید کار می کند.", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید من با کوله پشتی پوشک هندی سایز متوسط ​​Dagne Dover در پروازم به نیویورک سفر کردم. ژاکلین ساگوین/Business Insider من یک زن 20 ساله و بدون بچه هستم. شاید برای من منطقی نباشد که در فرودگاه با یک کیسه پوشک روی پشتم بگردم، اما اینجا هستم تا به شما بگویم چرا کوله پشتی های پوشک در واقع بهترین کیف های دستی را می سازند. من برای اولین بار این توصیه را از یک مهماندار خواندم که به او به عنوان کیف وسایل شخصی قسم می خورد. در پرواز بداهه اخیرم به نیویورک، فرصت عالی برای آزمایش این نظریه داشتم. هشدار اسپویلر: داگنه دوور ایندی ثابت کرد که درست گفته است. غذای اصلی من: بعد از یک بار پرواز با کوله پشتی پوشک متوسط ​​Dagne Dover Indi، دیگر هرگز بدون آن سفر نخواهم کرد. حمل آن راحت است، تناسب زیادی دارد و ظاهری شیک تر از آنچه از یک کیسه پوشک انتظار دارید است. کیسه های پوشک کاملاً به معنای واقعی کلمه برای آسان کردن زندگی شما طراحی شده اند و کیف Dagne Dover Indi این کار را انجام می دهد. همه چیزهای ضروری را که در مورد من شامل مایعات، تنقلات، لپ‌تاپ و هر چیز دیگری می‌شود که در کیسه می‌اندازم تا بعداً فراموش کنم را در خود جای می‌دهد. و بهترین بخش؟ شما هرگز نمی دانید که این وسیله برای حمل شیشه شیر بچه است. من می توانم تمام وسایل ضروری سفرم را در کوله پشتی پوشک هندی Dagne Dover قرار دهم. کیف پوشک شامل یک کیسه به اندازه کیف پول و جایگاه تعویض قابل حمل است. Jacqueline Saguin/Business Insider یک نگاه به بررسی Dagne Dover ما باید همه چیزهایی را که باید در مورد نظر کارشناسان محصول ما در"}, {"source": "Business Insider", "title": "How to find Amazon Lightning Deals on Prime Day", "link": "https://www.businessinsider.com/guides/deals/how-to-find-lightning-deals-amazon-prime-day-sale", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Amazon; Business Insider With its vast array of products, Amazon's sales are not to be ignored. After all, a storewide event like the upcoming fall Prime Day means everything, from budget air fryers to outdoor patio furniture, is down to a great low price. To help you prepare for the extravaganza, I'm going to help you learn how to find Amazon Lightning deals when the big day arrives. The aptly named Lightning Deal is a specific type of Amazon product listing with a limited amount of stock at a significant markdown, and a timer that ticks down until it becomes unavailable. Once the deadline arrives, or all of the stock is 100% claimed, it's official: you've missed your chance to score that deal. Alyssa Powell/Business Insider What is an Amazon Lightning Deal? Lightning deals are short-lived, limited-stock deals from Amazon. Not only are these deals set to a timer (usually 2 to 6 hours), but they also end once they've been 100% claimed. If you manage to add one to your cart, a timer starts, and you must check out within it or lose the deal. If the item runs out of stock before you can snag one, there's still hope. You can hop on a waitlist afterward to snag the discount in case any shoppers change their minds, though it's not guaranteed you'll get one. How to 'watch' a Lightning Deal To stay on top of deal availability, you can visit the Upcoming Deals section on your desktop or in the free Amazon app ( iOS , Android ) to view all deals 24 hours before they go live. Click \"Watch this Deal\" and you'll receive push notifications on your phone when a deal is starting. This will be the best way to ensure you secure a deal during the Amazon Prime Day frenzy . What happens if the deal I want is 100% claimed? The deals can get snatched up pretty quickly, but there's still hope even if a Lightning Deal has been 100% claimed. You can click \"Join the Waitlist\" in order to potentially get the deal anyway. Lightning Deal purchases must be made within 15 minutes of adding an item to your cart. If the purchase isn't completed within that time frame, then the deal will be made available to the next customer on the waitlist. Joining the waitlist won't guarantee you'll be able to purchase the deal, but it's certainly worth a shot. If you want to shop Amazon Prime Day Lightning Deals, remember that you have to be an Amazon Prime member first. You can sign up for e Big Deal Days just around the corner, signing up for a free trial now will cover you for the event. What is Amazon Prime? Amazon Prime is a membership subscription service for Amazon customers. While you don't have to be a member to buy on Amazon, Prime offers a wide range of benefits we'll unpack below, including same-day shipping and grocery delivery. Prime membership also unlocks a suite of free and heavily discounted services, including music streaming, food delivery, and even healthcare. Of course, you'll also need to be a member to take advantage of exclusive discounts and early lightning deals during sale events like Amazon Prime Day, which takes place this year from June 23-26. The best Amazon Prime shipping benefits Amazon Amazon Prime's most famous perks make shipping cheaper and easier. Free two-day shipping Tens of thousands of items on Amazon display the Prime logo next to their prices, indicating you don't pay for shipping and that they'll reach your doorstep in 2 days or less. This is the absolute best way to save money when shopping on Amazon — always look for that Prime logo. Free one-day and same-day shipping If you're ordering items from Amazon before noon, you might see an option for Prime Next-Day or Same-Day delivery. These options let you order and receive your items even faster than standard two-day shipping — either by 9 p.m. the next day or by 9 p.m. the same day. Not all items qualify for faster shipping, and it's not always free. If your order is under $25, you'll have to pay a small fee, dependent on the specific product, for faster shipping. In most cases, if it's above $25, there's no charge. Schedule multiple deliveries for Amazon Day Are you going to be away from your home for a few days, and don't want Amazon packages piling up on your doorstep? That's where Amazon ", "date_str": "2026-10-02T20:16:13+00:00", "hash": "45861dfdfd920574", "title_fa": "26 بهترین مزیت آمازون پرایم: آیا ارزش پول در سال 2026 را دارد؟", "summary_fa": "وقت rence-pugh-most-daring-looks-2026-10", "summary": "Florence Pugh attends the East of Eden premiere on September 30, 2026, in New York City. Emilio Madrid/Getty Images for Netflix Florence Pugh has never been afraid to make a statement on a red carpet. She often favors daring looks, from sheer fabric to daring slits. The actor has been promoting \"East of Eden\" in looks with plunging necklines and dramatic cutouts. Florence Pugh has become a fashion icon as she's risen to fame. She often wears bold looks on the red carpet, favoring outfits that turn heads with daring features, including sheer fabrics , plunging necklines, and thigh-high slits. Take a look at some of the most daring looks the \"East of Eden\" actor has worn to date. Florence Pugh wore a tea-length dress with a daring neckline in 2016. Florence Pugh attends the Evening Standard Film Awards in 2016. Jeff Spicer / Stringer / Getty Images At the Evening Standard Film Awards, Pugh wore an open-back dress from Millie. The tea-length dress was covered in a multicolored, geometric pattern. The halter neckline plunged low, dipping almost all the way to Pugh's navel. Pointed-toe heels completed the ensemble. While attending a BBC screening of King Lear in 2018, Pugh rocked a sheer top. Florence Pugh attends an event in 2018. David M. Benett / Contributor / Getty Images Pugh paired high-waisted white trousers with a semi-sheer white top embroidered with flowers. She wore her hair slicked back, letting the shirt shine. Pugh stunned in a Schiaparelli dress for the 2019 Cannes Film Festival. Florence Pugh attends the 2019 Cannes Film Festival. Mike Marsland / Contributor / Getty Images The light-blue dress had Grecian-style sleeves that gave way to a bodice with a low neckline and pops of red fabric on the side. A fitted waist flowed into an asymmetrical skirt patterned with flowers, and it featured a thigh-high slit. Strappy, red heels tied the outfit together. A daring cutout made Pugh s sophisticated dress for a 2019 Little Women event stand out. Florence Pugh at a Little Women photo call in 2019. Mike Marsland / Contributor / Getty Images Pugh's pink, gingham Emilia Wickstead dress had a collared neckline, full sleeves, and a pencil-style skirt. A cutout in the center of the bodice gave the elegant look a modern feel, as did the white, pointed-toe heels Pugh wore with the dress. Pugh sparkled in a gold Louis Vuitton dress at the 2020 Vanity Fair Oscars after-party. Florence Pugh attends the 2020 Vanity Fair Oscar party. George Pimentel / Contributor / Ge", "date_str": "2026-10-02T19:14:43+00:00", "hash": "859809144b76b4dc", "title_fa": "29 تا از جسورانه‌ترین تیپ‌هایی که فلورانس پوگ تا به حال پوشیده است، از لباس‌های مجلسی شفاف گرفته تا کت‌های برجسته", "summary_fa": "فلورانس پیو در اولین نمایش شرق عدن در 30 سپتامبر 2026 در شهر نیویورک شرکت می کند. امیلیو مادرید/ گتی ایماژ برای نتفلیکس فلورانس پیو هرگز از بیانیه ای روی فرش قرمز نترسیده است. او اغلب به ظاهر جسورانه علاقه دارد، از پارچه شفاف گرفته تا شکاف های جسورانه. این بازیگر با ظاهری با یقه‌های غوطه‌ور و برش‌های دراماتیک «شرق عدن» را تبلیغ می‌کرد. فلورانس پیو با رسیدن به شهرت به یک نماد مد تبدیل شده است. او اغلب روی فرش قرمز ظاهری جسورانه به تن می کند، و لباس هایی را ترجیح می دهد که سرها را با ویژگی های جسورانه، از جمله پارچه های شفاف، یقه های فرورفته، و شکاف هایی تا بالای ران ها، برمی گرداند. نگاهی بیندازید به جسورانه ترین چهره هایی که بازیگر «شرق عدن» تا به امروز داشته است. فلورانس پیو در سال 2016 لباسی به اندازه چای با یقه جسورانه پوشید. جف اسپایسر / استرینگر / گتی ایماژ در مراسم اهدای جوایز فیلم ایونینگ استاندارد، پوگ یک لباس پشت باز از میلی پوشیده بود. لباس قد چای با طرحی هندسی و چند رنگ پوشانده شده بود. یقه هالتر پایین افتاد و تقریباً تا ناف پوگ فرو رفت. پاشنه های نوک تیز این مجموعه را کامل کردند. وقتی در سال 2018 در یک نمایش بی‌بی‌سی از شاه لیر شرکت می‌کرد، پوگ یک تاپ ناب را تکان داد. Florence Pugh در یک رویداد در سال 2018 شرکت می کند. David M. بنت / مشارکت کننده / Getty Images شلوار سفید کمر بلند Pugh با بالاپوش سفید نیمه شفاف با گل دوزی شده است. موهایش را صاف کرده بود و اجازه داد پیراهن بدرخشد. پوگ با لباس شیاپارلی برای جشنواره فیلم کن 2019 حیرت زده شد. فلورانس پوگ در جشنواره فیلم کن 2019 شرکت می کند. مایک مارسلند / مشارکت کننده / گتی ایماژ این لباس"}, {"source": "Business Insider", "title": "Best headphones of 2026", "link": "https://www.businessinsider.com/guides/tech/best-headphones", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The best headphones include over-ear models like the Sony WH-1000MX5. Antonio Villas-Boas/Business Insider My team and I have spent more than a decade testing headphones, logging countless hours with just about every style you can think of. We've used all that hands-on experience to narrow things down to the five best headphones you can buy in 2026. No matter the price or design, every pair on this list has two things in common: they sound great and stay comfortable enough to wear for hours. If you're after wireless over-ear headphones, the Sony WH-1000XM5 are still the ones to beat. They strike the best balance of any Bluetooth headphones my audio experts have tested, with rich, detailed sound and strong active noise cancellation (ANC) that genuinely helps on flights or noisy commutes. But if you prefer earbuds, the Sony WF-1000XM5 deliver a similar experience in a smaller package, with impressive sound and ANC for their size. You'll also see excellent options from Bose, Apple, and Soundcore throughout this guide. Whether you're chasing high-end ANC or just need an affordable pair under $150, this roundup of the best headphones has something that fits your ears, lifestyle, and budget. Our top picks for the best headphones Best overall : Sony WH-1000XM5 - See at Amazon Best on a budget : Soundcore Space 2 - See at Amazon Best noise-canceling : Bose QuietComfort Ultra (2nd Gen) - See at Amazon Best earbuds : Sony WF-1000XM5 - See at Amazon Best AirPods : AirPods Pro 3 - See at Amazon Best overall The Sony WH-1000XM5 are the best over-ear headphones for most people, offering a standout blend of excellent sound quality, useful features, and effective noise cancellation. Some rivals outperform them in specific areas, but nothing else delivers such an impressive overall package for this price. Simply put, they're the most versatile and well-rounded Bluetooth headphones you can buy. First and foremost, the XM5 headphones sound great. Their spacious, balanced tuning brings out fine details across all genres. Bass can feel a bit heavy out of the box, but Sony's Headphones Connect app includes a multi-band EQ that lets you adjust the sound to your taste. Sony s WH-1000XM5 have all the features we look for in over-ear wireless headphones. Antonio Villas-Boas/Business Insider Comfort is another strong point. The XM5's understated design, padded earcups, and lightweight build", "date_str": "2026-10-02T19:06:50+00:00", "hash": "23968f90ee07035b", "title_fa": "بهترین هدفون 2026", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید بهترین هدفون‌ها شامل مدل‌های روی گوش مانند Sony WH-1000MX5 است. آنتونیو ویلاس بواس/Business Insider تیم من و من بیش از یک دهه را صرف آزمایش هدفون کرده‌ایم و ساعت‌های بی‌شماری را با تقریباً هر سبکی که فکرش را می‌کنید ثبت کرده‌ایم. ما از تمام این تجربه عملی استفاده کرده ایم تا موارد را به پنج بهترین هدفون که می توانید در سال 2026 بخرید محدود کنیم. بدون توجه به قیمت یا طراحی، هر جفت در این لیست دو چیز مشترک دارند: صدایی عالی دارند و به اندازه کافی راحت می مانند تا ساعت ها بپوشند. اگر به دنبال هدفون های روی گوش بی سیم هستید، Sony WH-1000XM5 هنوز هم آنهایی هستند که باید شکست بخورند. آنها بهترین تعادل را در میان هدفون‌های بلوتوثی که کارشناسان صوتی من آزمایش کرده‌اند، با صدای غنی و دقیق و حذف نویز فعال قوی (ANC) دارند که واقعاً در پروازها یا رفت‌وآمدهای پر سر و صدا به شما کمک می‌کند. اما اگر هدفون‌های هدفون را ترجیح می‌دهید، Sony WF-1000XM5 تجربه مشابهی را در بسته‌بندی کوچک‌تر، با صدای چشمگیر و ANC نسبت به اندازه آن، ارائه می‌دهد. همچنین گزینه های عالی Bose، Apple و Soundcore را در این راهنما خواهید دید. چه به دنبال ANC سطح بالا باشید و چه فقط به یک جفت مقرون به صرفه زیر 150 دلار نیاز دارید، این مجموعه از بهترین هدفون‌ها چیزی متناسب با گوش، سبک زندگی و بودجه شما دارد. بهترین انتخاب‌های ما برای بهترین هدفون به‌طور کلی بهترین: Sony WH-1000XM5 - مشاهده بهترین هدفون در آمازون با بودجه: Soundcore Space 2 - مشاهده در آمازون بهترین حذف نویز: Bose QuietComfort Ultra (نسل دوم) - در آمازون بهترین هدفون‌ها: Sony WF-1000XM5 بهترین هدفون‌ها: Sony WF-1000XM5 بهترین هدفون‌ها - مشاهده در"}, {"source": "Business Insider", "title": "Hedge fund scorecard: How Millennium, Citadel, and other funds navigated a volatile September", "link": "https://www.businessinsider.com/september-multistrategy-hedge-fund-performance-milllennium-2026-8", "summary": "Izzy Englander s Millennium was flat in September. SALT The biggest hedge funds had a muted September. Izzy Englander's juggernaut Millennium was flat on the month, while Citadel made 1.1% in its flagship. Fixed-income-heavy managers struggled as interest rates rose. A tough month for fixed-income investors resulted in a muted month for the hedge funds' biggest names that invest across asset classes. Izzy Englander's $97 billion Millennium Management was flat in September, a person close to the New York-based manager told Business Insider. The firm has gained 8.1% on the year. Michael Gelband's ExodusPoint Capital Management lost 0.7% in September, according to a person close to the firm. Gelband, who was once led Millennium's fixed-income unit, has now returned 4.1% in 2026. At Ken Griffin's Miami-based firm, Citadel was able to overcome the bond market turmoil and generate a return. The $76 billion firm was up 1.1% in its flagship fund, a person close to the firm told Business Insider. That puts the fund's year-to-date gains at 13.4%. Griffin's equities-focused funds — which soared after the manager bought Leopold Aschenbrenner's public portfolio at a discount at the end of July — continued their strong year in September. All four fundamental equities businesses at the firm were positive last month, the person close to the firm said, and year-to-date performance for its Tactical Trading fund that blends quant and traditional stockpickers is 28%. For players more focused on picking stocks, September was an easier ride. The S P 500 finished the month down roughly 0.5%, but managers including North Rock Capital and Dymon Asia made money. Schonfeld Strategic Advisors' flagship fund was flat in September, but is up 6.8% in 2026. The firms mentioned declined to comment. Numbers will be added to the table as they are confirmed. This story was originally published on October 1 at 12:29 pm. New figures have been added to the table below as they have been learned. Fund September performance 2026 performance Citadel Wellington 1.1% 13.4% Man Group 1783 1.9% 10.9% Millennium 0% 8.1% Dymon Asia 0.7% 7% Schonfeld Partners 0% 6.8% LMR -0.2% 6.6% Pinpoint Asset Management 1.5% 5.8% North Rock 0.4% 5.1% ExodusPoint -0.7% 4.1% Balyasny 0.1% 0.7% Walleye -0.2% -0.5% Read the original article on Business Insider", "date_str": "2026-10-02T19:04:27+00:00", "hash": "c9d94585a4de0da9", "title_fa": "کارت امتیازی صندوق تامینی: چگونه میلنیوم، سیتادل و سایر صندوق‌ها در سپتامبر پرنوسان حرکت کردند", "summary_fa": "هزاره Izzy Englander در سپتامبر صاف بود. SALT بزرگترین صندوق های تامینی سپتامبر خاموشی داشتند. میلنیوم جوگرنات Izzy Englander در ماه ثابت بود، در حالی که Citadel در پرچمدار خود 1.1% داشت. با افزایش نرخ بهره، مدیران با درآمد ثابت با مشکل مواجه شدند. یک ماه سخت برای سرمایه گذاران با درآمد ثابت منجر به یک ماه خاموش برای بزرگترین نام های صندوق های تامینی شد که در بین طبقات دارایی سرمایه گذاری می کنند. یکی از نزدیکان به مدیر مستقر در نیویورک به Business Insider گفت که مدیریت هزاره 97 میلیارد دلاری Izzy Englander در ماه سپتامبر ثابت بود. این شرکت در سال 8.1 درصد رشد داشته است. به گفته یکی از افراد نزدیک به شرکت، مدیریت سرمایه ExodusPoint مایکل گلبند در ماه سپتامبر 0.7 درصد از دست داد. گلبند که زمانی رهبری واحد با درآمد ثابت هزاره را بر عهده داشت، اکنون در سال 2026 بازدهی 4.1 درصدی داشته است. در شرکت مستقر در میامی کن گریفین، سیتادل توانست بر آشفتگی بازار اوراق قرضه غلبه کند و بازدهی ایجاد کند. یکی از افراد نزدیک به شرکت به Business Insider گفت که این شرکت 76 میلیارد دلاری 1.1 درصد در صندوق اصلی خود افزایش یافته است. این میزان سود سالانه صندوق را 13.4 درصد نشان می دهد. صندوق‌های سرمایه‌گذاری متمرکز گریفین - که پس از خرید سبد سهام عمومی لئوپولد اشنبرنر در پایان ژوئیه توسط مدیر، افزایش یافت - به سال قدرتمند خود در سپتامبر ادامه داد. یکی از افراد نزدیک به شرکت گفت، هر چهار کسب و کار سهام بنیادی در این شرکت در ماه گذشته مثبت بودند، و عملکرد سال تا به امروز برای صندوق معاملاتی تاکتیکی آن که سهام‌داران کمی و سنتی را ترکیب می‌کند، 28 درصد است. برای بازیکنانی که بیشتر روی انتخاب سهام متمرکز بودند، سپتامبر سواری راحت‌تری بود. S P 500 ماه را"}, {"source": "Business Insider", "title": "How 3 small business owners are — and aren’t — using AI to nail their marketing campaigns", "link": "https://www.businessinsider.com/small-business-marketing-benefits-downsides-ai-tools-2026-10", "summary": "From left to right: Small business owners Andrea Garcia Fry, Bonnie Gurry, and Catalina Parker. Courtesy of Natalia Ramos; Nick Starichenko; Maxson Media In August, Meta launched AI tools geared toward small businesses seeking marketing help. Three small business owners shared how they use AI tools for marketing — and their limitations. Testing and organic content remain crucial for small businesses amid the rise of AI marketing tools. Marketing is an integral part of running a small business , but building a successful strategy can be time-consuming for owners. Can AI tools geared toward marketing help? Meta thinks so. In August, it announced new AI features for small business owners, designed to help audit organic Facebook and Instagram posts and ads, measure businesses' performance against similar brands, and offer strategy suggestions to improve marketing efforts. Solo business owners have also tapped generative AI tools like ChatGPT, Claude, and Gemini to assist with time-intensive marketing tasks like customer outreach and content ideation . We asked three small business owners about how they think through and implement marketing strategies in the AI age . The following has been edited for length and clarity. How do AI-assisted tools fit into your overall marketing strategy? Meta announced AI tools for small businesses in August. Samuel Boivin/NurPhoto via Getty Images Andrea Garcia Fry, cofounder at baby and children's clothing brand Arquia: Effective paid media requires an understanding of your brand positioning, tone of voice, business goals, and customer journey. I prefer using ChatGPT or Claude because I can provide fuller context and use them as thought partners. Meta's tool will be valuable if it genuinely learns the business rather than simply recommending more automation or spending. Catalina Parker, founder of the coaching business Relatable Nonprofit: I've tried implementing recommendations directly from Meta Ads Manager, and many of them either didn't work or weren't right for my business. Meta benefits when advertisers spend more money on its platform. I'd rather have a tool that helps me independently analyze the data across my entire marketing ecosystem instead of relying solely on Meta's interpretation of what I should do next. Bonnie Gurry, CEO at climate-friendly investing platform GreenPortfolio: Tools like Meta AI can be great operational time-savers. It's like we now have a junior analyst to run quick diagnostics, spot creative t", "date_str": "2026-10-02T18:52:22+00:00", "hash": "9069de6267bf2176", "title_fa": "چگونه 3 صاحب کسب و کار کوچک از هوش مصنوعی استفاده می کنند - و نمی کنند - تا کمپین های بازاریابی خود را ثابت کنند", "summary_fa": "از چپ به راست: صاحبان مشاغل کوچک آندریا گارسیا فرای، بانی گوری و کاتالینا پارکر. با حسن نیت از ناتالیا راموس؛ نیک استاریچنکو؛ Maxson Media در ماه آگوست، متا ابزارهای هوش مصنوعی را برای مشاغل کوچکی که به دنبال کمک بازاریابی هستند، راه اندازی کرد. سه مالک کسب‌وکار کوچک نحوه استفاده از ابزارهای هوش مصنوعی برای بازاریابی و محدودیت‌هایشان را به اشتراک گذاشتند. در بحبوحه ظهور ابزارهای بازاریابی هوش مصنوعی، آزمایش و محتوای ارگانیک برای کسب و کارهای کوچک بسیار مهم است. بازاریابی بخشی جدایی ناپذیر از اداره یک کسب و کار کوچک است، اما ایجاد یک استراتژی موفق می تواند برای صاحبان وقت گیر باشد. آیا ابزارهای هوش مصنوعی برای بازاریابی می توانند کمک کنند؟ متا اینطور فکر می کند. در ماه آگوست، ویژگی‌های هوش مصنوعی جدیدی را برای صاحبان مشاغل کوچک اعلام کرد که برای کمک به حسابرسی پست‌ها و تبلیغات ارگانیک فیس‌بوک و اینستاگرام، اندازه‌گیری عملکرد کسب‌وکارها در برابر مارک‌های مشابه و ارائه پیشنهادهای استراتژی برای بهبود تلاش‌های بازاریابی طراحی شده‌اند. صاحبان مشاغل انفرادی همچنین از ابزارهای هوش مصنوعی مولد مانند ChatGPT، Claude و Gemini استفاده کرده اند تا به کارهای بازاریابی زمان بر مانند ارتباط با مشتری و ایده پردازی محتوا کمک کنند. ما از سه صاحب کسب و کار کوچک در مورد نحوه تفکر و اجرای استراتژی های بازاریابی در عصر هوش مصنوعی پرسیدیم. موارد زیر برای طول و وضوح ویرایش شده است. چگونه ابزارهای به کمک هوش مصنوعی در استراتژی بازاریابی کلی شما قرار می گیرند؟ متا ابزارهای هوش مصنوعی را برای مشاغل کوچک در ماه آگوست معرفی کرد. ساموئل بویوین/نورعکس از طریق گتی ایماژ آندریا گارسیا فرای، یکی از بنیانگذاران برند پوشاک کودک و کودک Arquia: رسانه پولی موثر نیاز به درک موقعیت برند، لحن صدا، اهداف تجاری و سفر مشتری دارد. من ترجیح می دهم از ChatGPT یا Claude استفاده کنم زیرا"}, {"source": "Business Insider", "title": "Google Pixel 11 review: An excellent upgrade… if you own an older Pixel", "link": "https://www.businessinsider.com/guides/tech/google-pixel-11-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The Pixel 11 design is familiar but with a few stylish flourishes. Business Insider / Michael Hicks While smartphone price increases have become the norm in the RAM-shortage era, the Google Pixel 11 has the unwelcome task of justifying a third $100 jump in four years. Annual trade-in buyers and Gemini power users will choose the 11 Pro without complaint, but for longtime fans accustomed to buying \"value flagships\" with point-and-click cameras and bloat-free software, the $899 Pixel 11 may trigger sticker shock. Besides the new 256GB base storage and the expected Tensor G6 boost, most Pixel 10-to-11 hardware changes are subtle, such as a new modem and a full-glass camera bar. For Pixel 9 owners like myself, though, the telephoto lens and Pixelsnap accessories from 2025 remain \"new\" and exciting, as does the 50% boost to RAM and display brightness for Pixel 8 owners. Online discourse aside, the Pixel 11 won't be a \"boring\" upgrade for everyone. On the software side, your perspective on Gemini Intelligence will depend on how much of your life's data already lives on messaging or social media apps, or how useful you'll find its contextual AI automation. Pixel 11 exclusives like Magic Capture and Camera Looks should have universal appeal, while Creator Suite and Screen Reactions target the social media–savvy, AI-dependent demographic that may not apply to you. As much as I wish the Pixel 11 had the 11 Pro's HiLight LEDs, full-resolution photos, and Instant Night Sight, the base model is easier to recommend. Matched up against even 2025's iPhone 17 or Galaxy S25 , the Pixel 11 falls short in raw speed and gaming performance but remains competitive thanks to its cameras, long-term support, and cool Gemini vibes. The Pixel 11 Pro has a much harder case to make against its flagship rivals. This is arguably the best Google Pixel phone for most people, though. Specification Details Starting price 256GB: $899 / £879 / €999; 512GB: $1,019 / £999 / €1,129 Colors Frost, Hibiscus, Pistachio, Obsidian Release date August 20, 2026 Durability IP68, Corning Gorilla Glass Victus 2 (cover and back glass) Display 6.3-inch Actua OLED at 422 pixels per inch Resolution 1080 × 2424 Refresh rate 60–120Hz Peak brightness 2,000 nits (HDR); 3,000 nits (peak brightness) Processor Google Tensor G6; Titan M3 security coprocessor RAM 12GB Storage 256GB / 512GB Rear cameras 48MP 1/1.56\" ƒ/1.70 85° M", "date_str": "2026-10-02T18:46:21+00:00", "hash": "ee44e20e75d4d55a", "title_fa": "بررسی Google Pixel 11: یک ارتقا عالی… اگر پیکسل قدیمی‌تری دارید", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید طراحی پیکسل 11 آشنا است اما با چند شکوفایی شیک. بیزینس اینسایدر/ مایکل هیکس در حالی که افزایش قیمت گوشی‌های هوشمند در عصر کمبود RAM به یک امر عادی تبدیل شده است، Google Pixel 11 وظیفه ناخوشایندی را دارد که سومین جهش 100 دلاری را در چهار سال گذشته توجیه کند. خریداران سالانه و کاربران قدرتمند Gemini، 11 Pro را بدون شکایت انتخاب می‌کنند، اما برای طرفداران قدیمی که به خرید «پرچم‌دارهای ارزشمند» با دوربین‌های نقطه و کلیک و نرم‌افزار بدون نفخ عادت کرده‌اند، پیکسل 11 899 دلاری ممکن است باعث شوک برچسب شود. علاوه بر فضای ذخیره سازی پایه جدید 256 گیگابایتی و افزایش مورد انتظار Tensor G6، اکثر تغییرات سخت افزاری پیکسل 10 به 11 مانند مودم جدید و نوار دوربین تمام شیشه ای ظریف هستند. با این حال، برای دارندگان پیکسل 9 مانند من، لنز تله فوتو و لوازم جانبی Pixelsnap از سال 2025 همچنان «جدید» و هیجان‌انگیز باقی می‌مانند، همچنین افزایش 50 درصدی RAM و روشنایی صفحه‌نمایش برای دارندگان پیکسل 8. جدای از گفتمان آنلاین، پیکسل 11 یک ارتقاء \"خسته کننده\" برای همه نخواهد بود. در بخش نرم‌افزار، دیدگاه شما در Gemini Intelligence به این بستگی دارد که چه مقدار از داده‌های زندگی شما از قبل در پیام‌رسانی یا برنامه‌های رسانه‌های اجتماعی زندگی می‌کنند، یا اینکه چقدر از اتوماسیون هوش مصنوعی متنی آن برای شما مفید است. موارد انحصاری Pixel 11 مانند Magic Capture و Camera Looks باید جذابیت جهانی داشته باشند، در حالی که Creator Suite و Screen Reactions جمعیت‌شناسی مبتنی بر رسانه‌های اجتماعی و وابسته به هوش مصنوعی را هدف قرار می‌دهند که ممکن است برای شما صدق نکند. همان‌قدر که آرزو می‌کنم پیکسل 11 دارای ال‌ای‌دی‌های HiLight، عکس‌های با وضوح کامل و Instant Night"}, {"source": "Business Insider", "title": "Elite Navy special warfare boat crews may be returning to duty with undiagnosed brain injuries, Pentagon watchdog warns", "link": "https://www.businessinsider.com/us-navy-swccs-returning-to-duty-brain-injuries-watchdog-2026-10", "summary": "There are gaps in reporting, screening, and follow-up evaluations, the report said, that may be allowing service members to return to duty with traumatic brain injuries. US Navy photo by Mass Communication Specialist 1st Class Bill Carlisle A Pentagon watchdog says screening breakdowns may be sending operators back to duty with brain injuries. Crew members don't always report symptoms and skip follow-up appointments. Traumatic brain injuries can cause degraded operational decision-making, among other problems. A Pentagon watchdog warns in a new report that some of the US Navy's elite special warfare boat crews may be returning to dangerous missions and activities with undiagnosed brain injuries due to breakdowns in reporting, screening, and follow-ups. Special Warfare Combatant-craft Crewmen , SWCCs, are an elite special operations force. Aboard fast boats, they support and execute combat missions, such as transporting other special operators, interdicting vessels, and conducting reconnaissance at sea. \"SWCCs repeatedly endure severe wave-slamming forces,\" the Department of Defense's Office of the Inspector General wrote in a report released this week. \"Without an objective, standardized testing mechanism to identify injuries early, symptoms may be masked as routine fatigue,\" the report said. \"Sending service members back to high-risk maritime and riverine environments with undiagnosed [mild traumatic brain injury] can result in degraded operational decision-making.\" It added that when \"operational and training tempos take precedence over medical follow-ups, SWCCs miss critical appointments,\" making it more difficult to effectively evaluate their conditions. Traumatic brain injuries are defined as significant health issues caused by external forces like explosions or wave-impact events that can, over time, cause confusion, disorientation, slowed thinking, memory loss, or loss or decreased levels of consciousness. Want Business Insider defense stories right in your inbox? Sign up here for our Defense Flash newsletter. The IG report said SWCCs haven't been regularly filling out TBI exposure forms; a medical officer told investigators that crews often don't fill them out because the paperwork takes hours, affecting rest, recovery, and preparation for future missions. The report said command didn't enforce compliance. Crew members who have suffered these kinds of injuries said they often don't report their symptoms — or attend follow-up appointments — because ", "date_str": "2026-10-02T18:19:05+00:00", "hash": "7e2b5b820353f565", "title_fa": "دیده بان پنتاگون هشدار می دهد که خدمه قایق جنگ ویژه نیروی دریایی نخبگان ممکن است با صدمات مغزی تشخیص داده نشده به خدمت بازگردند.", "summary_fa": "در این گزارش آمده است که شکاف‌هایی در گزارش‌دهی، غربالگری و ارزیابی‌های پیگیری وجود دارد که ممکن است به اعضای خدمات اجازه دهد تا با آسیب‌های مغزی تروماتیک به وظیفه خود بازگردند. عکس نیروی دریایی ایالات متحده توسط بیل کارلایل، متخصص ارتباطات جمعی، یک ناظر پنتاگون می گوید که خرابی های غربالگری ممکن است اپراتورها را با آسیب های مغزی به وظیفه بازگرداند. اعضای خدمه همیشه علائم را گزارش نمی کنند و از قرار ملاقات های بعدی صرف نظر می کنند. صدمات ضربه‌ای مغزی می‌تواند باعث کاهش تصمیم‌گیری عملیاتی، از جمله مشکلات دیگر شود. یک ناظر پنتاگون در گزارش جدیدی هشدار می دهد که برخی از خدمه نخبه قایق جنگی ویژه نیروی دریایی ایالات متحده ممکن است به دلیل اختلال در گزارش، غربالگری و پیگیری، به ماموریت ها و فعالیت های خطرناک با آسیب های مغزی تشخیص داده نشده بازگردند. خدمه جنگنده جنگی ویژه، SWCC، یک نیروی عملیات ویژه نخبه هستند. روی قایق‌های تندرو، آنها مأموریت‌های جنگی مانند حمل و نقل سایر اپراتورهای ویژه، توقف کشتی‌ها و انجام شناسایی در دریا را پشتیبانی و اجرا می‌کنند. دفتر بازرس کل وزارت دفاع در گزارشی که این هفته منتشر شد، نوشت: \"SWCC ها بارها و بارها نیروهای شدید موج را تحمل می کنند.\" در این گزارش آمده است: «بدون یک مکانیسم تست استاندارد و عینی برای شناسایی زودهنگام آسیب‌ها، علائم ممکن است به عنوان خستگی معمول پنهان شوند. فرستادن اعضای خدمات به محیط‌های دریایی و رودخانه‌ای پرخطر با [آسیب مغزی خفیف] می‌تواند منجر به تصمیم‌گیری عملیاتی ضعیف شود.» این سازمان اضافه کرد که زمانی که سرعت های عملیاتی و آموزشی بر پیگیری های پزشکی اولویت دارند، SWCC ها قرار ملاقات های مهم را از دست می دهند و ارزیابی موثر شرایط آنها را دشوارتر می کند. آسیب های تروماتیک مغزی به عنوان مسائل بهداشتی مهم ناشی از نیروهای خارجی مانند انفجارها یا"}, {"source": "Business Insider", "title": "Data centers and healthcare were bright spots in the rough September jobs report", "link": "https://www.businessinsider.com/data-centers-healthcare-job-growth-september-jobs-report-2026-10", "summary": "Nonresidential specialty trade contractors added 12,300 jobs in September. Genaro Molina/Los Angeles Times via Getty Images The US added just 29,000 jobs in September, fewer roles than economists expected. In that dreary report, healthcare and data centers emerged as bright spots for job seekers. Right now, both fields seem solid, but it's to be seen how long the data center boom lasts. In a dreary labor market, there are a couple of bright spots: Medical jobs and specialty roles at data centers . Over the past year, the healthcare sector has been one consistent stalwart. The latest jobs release from the Bureau of Labor Statistics confirmed that healthcare was still chugging along in September, albeit at a slower pace. Construction also put up a respectable showing of 11,000 roles on net, even after losing roles in residential specialty trade contractors. Instead, gains were heavily concentrated in nonresidential specialty trade contractors — the electricians and other construction employees who work on data center builds, among other projects. The healthcare sector added about 17,000 roles — a sizable chunk of the total 29,000 payrolls added in the country, but about half of the industry's average gain of 33,000 jobs over the past year. Despite healthcare's slower job growth, Cory Stahle, an economist at Indeed Hiring Lab, said the sector offers opportunities in the long run, given the demand to care for the aging population. ZipRecruiter economist Nicole Bachaud said cooler healthcare hiring could be due to funding challenges that could be making it harder to pay for more workers. \"So the demand is there, but the execution on that demand is limited by the federal funding environment right now,\" she said. While the healthcare sector grew by 16,700 jobs over the month, the government sector fell by 17,000. White-collar sectors were also among those that lost jobs. The information sector has plummeted from its 2022 peak of 3.1 million total employed to 2.7 million last month. Construction's growth of 11,000 jobs was partly driven by nonresidential specialty trade contractors, in which employment rose by 12,300. It's a testament to how the data center boom — which is shaping up to be the largest capital expenditure project in US history — is propping up construction employment and spending. Indeed's data showed that data center-related postings have surged by almost 130% since June 2024, while overall US postings have dropped. \"With the amount of money that'", "date_str": "2026-10-02T17:57:01+00:00", "hash": "e25024fcf5cd9297", "title_fa": "مراکز داده و مراقبت های بهداشتی نقاط روشنی در گزارش مشاغل ماه سپتامبر بودند", "summary_fa": "پیمانکاران تجارت تخصصی غیرمسکونی 12300 شغل در سپتامبر ایجاد کردند. Genaro Molina/Los Angeles Times از طریق Getty Images ایالات متحده در ماه سپتامبر فقط 29000 شغل ایجاد کرد که کمتر از انتظار اقتصاددانان بود. در آن گزارش دلخراش، مراکز درمانی و داده به عنوان نقاط روشنی برای جویندگان کار ظاهر شدند. در حال حاضر، هر دو زمینه قوی به نظر می رسند، اما باید دید که رونق مرکز داده چقدر طول می کشد. در یک بازار کار خسته کننده، چند نقطه روشن وجود دارد: مشاغل پزشکی و نقش های تخصصی در مراکز داده. در سال گذشته، بخش مراقبت های بهداشتی یکی از نیرو های ثابت قدم بوده است. آخرین انتشار مشاغل از سوی اداره آمار کار تأیید کرد که مراقبت‌های بهداشتی همچنان در ماه سپتامبر پیش می‌رفت، البته با سرعت کمتر. ساخت و ساز همچنین نمایش قابل احترامی از 11000 نقش را در شبکه به نمایش گذاشت، حتی پس از از دست دادن نقش در پیمانکاران تجاری تخصصی مسکونی. در عوض، سود به شدت در پیمانکاران تجاری تخصصی غیرمسکونی متمرکز شد - برق‌کارها و سایر کارمندان ساختمانی که در میان پروژه‌ها بر روی ساختمان‌های مرکز داده کار می‌کنند. بخش مراقبت های بهداشتی حدود 17000 شغل اضافه کرد - بخش قابل توجهی از مجموع 29000 حقوق و دستمزد اضافه شده در کشور، اما حدود نیمی از میانگین افزایش 33000 شغل در این صنعت در سال گذشته. کوری استال، اقتصاددان در Indeed Hiring Lab، علیرغم رشد آهسته‌تر شغل در بخش مراقبت‌های بهداشتی، گفت که این بخش با توجه به تقاضا برای مراقبت از جمعیت سالخورده فرصت‌هایی را در درازمدت ارائه می‌دهد. نیکول باچاد، اقتصاددان ZipRecruiter، می‌گوید استخدام مراقبت‌های بهداشتی خنک‌تر می‌تواند به دلیل چالش‌های تامین مالی باشد که می‌تواند پرداخت برای کارگران بیشتر را سخت‌تر کند. او گفت: \"بنابراین تقاضا وجود دارد، اما اجرای آن تقاضا در حال حاضر توسط محیط مالی"}, {"source": "Business Insider", "title": "Who is Shivon Zilis? Meet the Elon Musk exec who said their relationship suddenly ended", "link": "https://www.businessinsider.com/shivon-zilis-reported-mother-elon-musk-twins-2022-7", "summary": "Elon Musk and Shivon Zilis with their twins. Courtesy of Walter Isaacson AI investor and developer Shivon Zilis is a longtime executive at Elon Musk's companies. She said on X that her relationship with Musk went \"from in love to let go.\" A director at Neuralink, Zilis is a plaintiff in the trial and has four children with Musk. Shivon Zilis — a longtime executive at Elon Musk's companies and the mother of four of his children — said her relationship with the billionaire ended \"in a week with no warning.\" In a post on X, Zilis shared a rare glimpse into Musk's romantic life. \"I feel happy that I got to show Elon how it feels to be deeply understood, nurtured, and peacefully loved with stability and gentleness,\" she wrote on Friday. \"My heart is full knowing I got to do that, and I hope it leaves a lasting good effect.\" Zilis and her employer, the Musk-owned Neuralink , didn't respond to a request for comment from Business Insider. Musk also didn't respond. She joined Musk at OpenAI in 2016, a year after its founding, and helped helm the company during Musk's investment and his rancorous 2018 split with CEO Sam Altman. From there, Zilis followed Musk to Tesla and his rival project, xAI. She's now the director of operations and special projects at another of the billionaire's companies — Neuralink , a startup that makes computer chips designed to be implanted in the brain. Zilis is also the mother to four of Musk's children. Elon Musk's biographer, Walter Isaacson, shared a glimpse into Musk's relationship with Zilis in September 2023. In an excerpt from Isaacson's biography of the Tesla CEO and in a post on social media, he shared a photo of Musk and Zilis with their twins — who were 16 months old at the time — sitting on each of their laps. Walter Isaacson posted a photo of Elon Musk and Zilis on X. Walter Isaacson on X The biographer said the photo was taken when Musk ushered him to Zilis' house in Austin to talk about the threat AI posed to civilization. \"We were sitting on a suburban patio by a tranquil backyard swimming pool on a sunny spring day, with two bright-eyed twins learning to toddle, as Musk somberly speculated about the window of opportunity for building a sustainable human colony on Mars before an AI apocalypse destroyed earthly civilization,\" Isaacson said of the scene. Here is more you need to know about Zilis: Zilis grew up in Ontario, Canada, and is a lifelong athlete Zilis was born in Markham, Ontario, and grew up playing ice hockey. S", "date_str": "2026-10-02T17:47:57+00:00", "hash": "6dd1d4ffeef53ce6", "title_fa": "شیون زیلیس کیست؟ با مدیر اجرایی ایلان ماسک آشنا شوید که گفت رابطه آنها ناگهان به پایان رسیده است", "summary_fa": "ایلان ماسک و شیون زیلیس با دوقلوهایشان. با حسن نیت از سرمایه گذار و توسعه دهنده هوش مصنوعی Walter Isaacson Shivon Zilis یکی از مدیران قدیمی شرکت های Elon Musk است. او در X گفت که رابطه او با ماسک \"از عشق به رها شدن\" تبدیل شده است. زیلیس که مدیر شرکت Neuralink است، شاکی در دادگاه است و چهار فرزند از ماسک دارد. شیوون زیلیس - یکی از مدیران قدیمی شرکت ایلان ماسک و مادر چهار فرزندش - گفت که رابطه او با این میلیاردر \"در یک هفته بدون هیچ هشداری به پایان رسید.\" زیلیس در پستی در X، نگاهی نادر به زندگی عاشقانه ماسک را به اشتراک گذاشت. او روز جمعه نوشت: «خوشحالم که به ایلان نشان دادم که چه احساسی دارد که عمیقاً درک شود، پرورش یابد، و در صلح و آرامش با ثبات و ملایمت مورد محبت قرار بگیری. \"قلب من پر است از دانستن اینکه باید این کار را انجام دهم، و امیدوارم که اثر خوب ماندگاری داشته باشد.\" زیلیس و کارفرمایش، Neuralink متعلق به ماسک، به درخواست اظهار نظر Business Insider پاسخ ندادند. ماسک نیز پاسخی نداد. او در سال 2016، یک سال پس از تأسیس OpenAI، به ماسک پیوست و در طول سرمایه گذاری ماسک و جدایی کینه توزانه او در سال 2018 از مدیر عامل شرکت سام آلتمن، به هدایت شرکت کمک کرد. از آنجا، زیلیس ماسک را تا تسلا و پروژه رقیب او، xAI دنبال کرد. او اکنون مدیر عملیات و پروژه‌های ویژه در یکی دیگر از شرکت‌های میلیاردر است - Neuralink، استارت‌آپی که تراشه‌های کامپیوتری را برای کاشت در مغز می‌سازد. زیلیس همچنین مادر چهار فرزند ماسک است. زندگی نامه نویس ایلان ماسک، والتر ایزاکسون، در سپتامبر 2023، نگاهی اجمالی به رابطه ماسک با زیلیس به اشتراک گذاشت. در گزیده ای از بیوگرافی ایزاکسون از مدیرعامل تسلا و در پستی"}, {"source": "Business Insider", "title": "I went to Vienna for the first time. These 4 mistakes drained my energy and bank account.", "link": "https://www.businessinsider.com/vienna-austria-travel-mistakes-to-avoid", "summary": "Business Insider s reporter made some mistakes during her first trip to Vienna. Joey Hadden/Business Insider It all started when I picked the wrong train. Booking the wrong Airbnb didn't help either. My mistakes in Vienna had a ripple effect on my health and my wallet. When my train finally arrived in Vienna, I was ready for bed. It was 7 a.m., but I'd been awake for 24 hours. Part of me wanted to spend the day exploring the city I traveled so far to visit for just two nights, especially since I'd never been there before. But my body said no. This was in October 2022, when I spent 48 hours in Vienna during a two-week train trip through four European countries, six cities, and two suburbs. Vienna's blend of fairy-tale flair, stunning architecture, and artsy public spaces made it my favorite city in Europe . But a few poor decisions along the way cost me time, money, and energy. These are the regrets that kept me from making the most of my trip to Vienna . Booking the wrong room on a sleeper train left me scrambling to find a hotel room at 7 a.m. Joey Hadden/Business Insider Back to my arrival in Vienna — I hadn't slept because I booked a reclining seat on an overnight train from Berlin. I could have booked a bunk in a shared cabin for the 12-hour ride, but I thought I'd save money by booking the OBB Nightjet train's cheapest accommodation: a seat in a cabin with five other people for $40. And I thought I'd save time by traveling through the night. With minimal legroom, a backpack for a pillow, and a windbreaker for a blanket, I stayed up stirring in my head until morning. Once I left the train station, I went to three random hotels nearby before finding one with a room available. But to check in at 7 a.m. and leave later than the 11 a.m. check-out, I had to book the room for two nights. Ultimately, booking a seat for an overnight ride cost me about $200 more than the train ticket. And napping all day left me with less time to explore the city. \"The quality of travel depends not only on the carriages, but also on the route,\" OBB Nightjet wrote in a statement to Business Insider. \"We recommend the sleeper or couchette car for night travel. There is enough space to stretch out. Seated carriages are recommended for shorter journeys.\" Next time, I'll take the train line's advice and book a bunk for overnight rides. I wish I d considered taking a high-speed train during the day. NurPhoto/NurPhoto via Getty Images I slept until roughly 5 p.m. on my first day in Vi", "date_str": "2026-10-02T17:36:12+00:00", "hash": "f3bba301c8c94eb5", "title_fa": "من برای اولین بار به وین رفتم. این 4 اشتباه انرژی و حساب بانکی ام را تخلیه کرد.", "summary_fa": "خبرنگار بیزینس اینسایدر در اولین سفر خود به وین اشتباهاتی مرتکب شد. Joey Hadden/Business Insider همه چیز از زمانی شروع شد که قطار اشتباهی را انتخاب کردم. رزرو Airbnb اشتباه هم کمکی نکرد. اشتباهات من در وین بر سلامتی و کیف پولم تأثیر زیادی گذاشت. وقتی قطارم بالاخره به وین رسید، برای خواب آماده بودم. ساعت 7 صبح بود، اما من 24 ساعت بیدار بودم. بخشی از من می خواستم روز را صرف کاوش در شهری کنم که تا به حال برای بازدید از آن سفر کرده بودم، فقط برای دو شب، به خصوص که قبلاً هرگز آنجا نرفته بودم. اما بدنم گفت نه. این در اکتبر 2022 بود، زمانی که من 48 ساعت را در وین طی یک سفر دو هفته ای با قطار در چهار کشور اروپایی، شش شهر و دو حومه گذراندم. ترکیبی از استعداد افسانه‌ای، معماری خیره‌کننده و فضاهای عمومی هنری وین، آن را به شهر مورد علاقه من در اروپا تبدیل کرده است. اما چند تصمیم نادرست در این مسیر برای من وقت، پول و انرژی تمام کرد. این حسرت هایی است که باعث شد من از سفرم به وین نهایت استفاده را نکنم. رزرو اتاق اشتباه در قطار خواب باعث شد در ساعت 7 صبح برای یافتن اتاق هتل تلاش کنم. می‌توانستم یک تختخواب در یک کابین مشترک برای 12 ساعت سواری رزرو کنم، اما فکر کردم با رزرو ارزان‌ترین محل اقامت قطار OBB Nightjet: یک صندلی در کابین با پنج نفر دیگر به قیمت 40 دلار، در هزینه‌هایم صرفه‌جویی کنم. و فکر کردم با سفر در طول شب در زمان صرفه جویی کنم. با حداقل فضای پا، کوله پشتی برای بالش و بادگیر برای پتو، تا صبح بیدار ماندم و در سرم تکان می خوردم. هنگامی که ایستگاه قطار را ترک کردم، به سه هتل تصادفی در آن نزدیکی رفتم قبل از اینکه"}, {"source": "Lifehacker", "title": "The Top 10 TV Series Right Now, According to Streaming Data", "link": "https://lifehacker.com/entertainment/the-top-10-streaming-series-september-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Streaming in September was eclectic. The top 10 most popular TV shows of the month, according to data from JustWatch , include opposite takes on international espionage Lioness's \"everything is at stake\" blockbuster vibe versus Slow Horse s' darkly funny, morally ambiguous style. Other series burning up the charts: spy-adjacent action show Reacher , a couple of sports comedies named after their main characters ( Ted Lasso and Chad Powers ), a dystopian sci-fi drama ( Silo ), a superhero show ( Lanterns ), and stories of criminals and cops ( Furious and The Gentlemen ). There's even a horror comedy ( Widow's Bay ). You could say there's something for everyone. Lanterns Topping the streaming charts this month is DC's TV revamp of Green Lantern, in which experienced Lantern Hal Jordan (Kyle Chandler) trains the new guy, John Stewart (Aaron Pierre), on how to wield the mysterious and powerful Green Lantern Ring. It's a reserved, neo-noir style take on the comic mythos, as the heroes investigate a series of murders tied to an extraterrestrial threat. Lanterns is pulling in a 92% fresh ratings from Rotten Tomatoes, so it's definitely worth a stream. Stream Lanterns on HBO Max . Lanterns at HBO Max Learn More Learn More at HBO Max Ted Lasso Season four of Ted Lasso sees the title character, played by Jason Sudeikis, returning to the UK to take on a new challenge: coaching the Lady Greyhounds, AFC Richmond's second-division women's football team. This multiple Emmy Award-winning series still has all the heart, humor, and positivity of the original run. Stream Ted Lasso on Apple TV+. Ted La
