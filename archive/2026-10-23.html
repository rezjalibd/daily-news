<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۱ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۱ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۳ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۰۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">

      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۶۰</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۳۶</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

اعی وضع کرد. تلاشی مشابه نیز در فرانسه شکل گرفت، اما شورای قانون اساسی آن کشور مصوبه را در ماه اوت رد کرد. بر اساس اعلام مقامات آتن، شرکت‌های فناوری باید سازوکارهای فنی لازم را برای تطبیق با قانون جدید پیاده‌سازی کنند. نخست‌وزیر یونان می‌گوید: «شبکه‌های اجتماعی دو ماه و نیم فرصت دارند راهکاری برای احراز سن کاربران و حفظ حریم خصوصی آنان تدوین کنند.» لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۶:۴۵"}, {"source": "Zoomit", "title": "جداشدن اکسل فونیکس FX در وسط خیابان؛ چری رسما عذرخواهی کرد", "link": "https://www.zoomit.ir/car/469683-chery-apologises-omoda-5-failure/", "summary": "رئیس چری پس از جداشدن اکسل عقب فونیکس FX و تعلیق شماره‌گذاری در مالزی، به‌طور رسمی عذرخواهی کرد.", "date_str": "2026-10-23T12:40:00+00:00", "hash": "3efe7b970688c001", "title_fa": "جداشدن اکسل فونیکس FX در وسط خیابان؛ چری رسما عذرخواهی کرد", "summary_fa": "رئیس چری پس از جداشدن اکسل عقب فونیکس FX و تعلیق شماره‌گذاری در مالزی، به‌طور رسمی عذرخواهی کرد. تبلیغات یین تونگیو ، رئیس هیئت‌مدیره و مدیرعامل چری ، در پی بروز نگرانی‌های کیفی پیرامون جداشدن مجموعه‌ی اکسل عقب چری اومودا ۵ (فونیکس FX) در مالزی رسما عذرخواهی کرد. این رخداد به تحقیقات نهادهای نظارتی و صدور فراخوان برای ۸٬۸۷۸ دستگاه خودرو انجامید. تونگیو در جریان کنفرانس جهانی وسایل نقلیه هوشمند متصل (WICV)، به دغدغه‌های فنی پیش‌آمده اذعان داشت و اعلام کرد شخصا از وزیر سرمایه‌گذاری، تجارت و صنعت مالزی پوزش خواسته است. یین تونگیو، مدیرعامل چری، گفت : «ما برای کسب سودهای سریع و کوتاه‌مدت به بازارهای خارجی نمی‌رویم، بلکه هدفمان ریشه‌دواندن و توسعه‌ی پایدار این بازارها در درازمدت است.» ماجرا اوایل مهرماه در شهر جوهور بهرو رخ داد. مجموعه‌ی تعلیق عقب و چرخ‌ها به‌طور کامل از بدنه‌ی خودرو جدا شد. در پی این اتفاق، اداره‌ی حمل‌ونقل جاده‌ای مالزی مجوز تأیید نوع خودرو را برای فونیکس FX به‌شکل موقت تعلیق کرد تا فرایند شماره‌گذاری مدل‌های جدید متوقف شود. بازرسی فنی این نهاد نظارتی شامل خطوط تولید، سیستم‌های کنترل کیفیت، بررسی اتصالات جوش و ارزیابی تامین‌کنندگان قطعات اکسل می‌شود. چری مالزی در ۱۴ اکتبر اعلام کرد دامنه‌ی این فراخوان ۸٬۸۷۸ دستگاه از تیپ‌های C و H را در بر می‌گیرد تا در صورت نیاز، قطعات مربوطه به‌رایگان تعویض شوند. چری در تابستان ۲۰۲۵ خودروی O5 را با سیستم تعلیق عقب چنداتصالی (مولتی‌لینک) جایگزین مدل پیشین مجهز به محور پیچشی کرد. بررسی‌ها نشان می‌دهد مدل جدید مشمول نقص فنی یادشده نیست؛ هرچند این پرونده پس از ماجرای مشابه سال ۲۰۲۴ و بازبینی ۶۰۰ دستگاه خودرو به دلیل خطای کالیبراسیون تجهیزات تامین‌کننده، نظارت‌ها را بر زنجیره‌ی تامین خودروسازان چینی دوچندان کرده است. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۱ آبان • ۱۶:۱۰"}, {"source": "Business Insider", "title": "The CEO of Europe's most valuable company says he is tying his pay to employee satisfaction", "link": "https://www.businessinsider.com/asml-ceo-exec-pay-linked-employee-satisfaction-survey-2026-10", "summary": "ASML CEO Christophe Fouquet told employees it had been a disruptive and emotional year. Chesnot/Getty Images The CEO of ASML is tying his compensation to a personal mission to boost employee morale. Christophe Fouquet told employees in a memo seen by BI that ASML would link exec pay to employee satisfaction. It comes amid a major reorg at Europe's most valuable firm, which supplies chipmaking equipment to TSMC and Intel. The CEO of Europe's most valuable company is linking his pay to a personal mission to boost employee morale. Christophe Fouquet, the CEO of Dutch tech firm ASML, said last week that the company will incorporate employee satisfaction into its compensation strategy for top executives in an effort to quell discontent over a major reorganization, per a memo to employees obtained exclusively by Business Insider. Fouquet was responding to the results of an annual survey that polled more than 38,000 of ASML's roughly 44,000 employees. The survey results, seen by Business Insider, show that ASML's employee engagement index — a measure of worker satisfaction — fell from 78% last year to 73.5% this year. In the memo, Fouquet said that the declining employee engagement scores \"reflect a period of significant change\" and acknowledged that it had been a \"disruptive and emotional year\" for the company. He added that ASML's executive team had highlighted six questions in the survey and combined them into a new Workplace Experience Index, which would be incorporated into the company's Long-Term Incentive plan for executive compensation. \"In the coming years, it will directly influence the remuneration of senior leaders, including the Board of Management,\" Fouquet wrote, adding that strengthening the company's culture and reinforcing its values would be a personal priority in the coming year. ASML declined to comment. ASML s lithography machines are a critical part of the semiconductor supply chain. Bloomberg/Getty Images The six questions include whether employees feel they can share their opinions without fear of retaliation and if they have confidence in ASML's senior leadership team. Employees will also be polled on whether they have a clear understanding of their role, whether they think their teams are operating efficiently and are well organized, and whether they feel their direct manager shows they care about them as an individual. It comes as ASML, the only firm on the planet capable of building the advanced EUV lithography machines critical for c", "date_str": "2026-10-23T13:02:27+00:00", "hash": "7b7a792442a1582e", "title_fa": "مدیرعامل ارزشمندترین شرکت اروپایی می گوید که حقوق خود را با رضایت کارکنان گره می زند", "summary_fa": "کریستف فوکه، مدیرعامل ASML به کارکنان گفت که سالی پر از اختلال و احساسی بود. Chesnot/Getty Images مدیر عامل ASML غرامت خود را به یک ماموریت شخصی برای تقویت روحیه کارکنان گره می زند. کریستف فوکه در یادداشتی که توسط BI مشاهده شد به کارمندان گفت که ASML حقوق مدیران را به رضایت کارکنان مرتبط می کند. این در بحبوحه یک سازماندهی بزرگ در با ارزش ترین شرکت اروپایی که تجهیزات تولید تراشه را برای TSMC و اینتل تامین می کند، رخ می دهد. مدیر عامل ارزشمندترین شرکت اروپایی حقوق خود را به یک ماموریت شخصی برای تقویت روحیه کارکنان مرتبط می کند. کریستف فوکه، مدیر عامل شرکت فناوری هلندی ASML، هفته گذشته گفت که این شرکت رضایت کارکنان را در استراتژی جبران خسارات مدیران ارشد خود در تلاش برای فرونشاندن نارضایتی از یک سازماندهی مجدد بزرگ، در یادداشتی برای کارکنان که منحصراً توسط Business Insider دریافت می‌کند، وارد می‌کند. فوکه به نتایج یک نظرسنجی سالانه پاسخ داد که بیش از 38000 نفر از تقریباً 44000 کارمند ASML را مورد نظرسنجی قرار داد. نتایج نظرسنجی که توسط Business Insider مشاهده شد، نشان می‌دهد که شاخص مشارکت کارکنان ASML - معیاری برای رضایت کارگران - از 78٪ در سال گذشته به 73.5٪ در سال جاری کاهش یافته است. فوکه در این یادداشت گفت که کاهش نمرات مشارکت کارکنان \"منعکس کننده دوره ای از تغییرات قابل توجه\" است و اذعان کرد که این سال یک \"سال مختل کننده و احساسی\" برای شرکت بوده است. وی افزود که تیم اجرایی ASML شش سوال را در این نظرسنجی برجسته کرده و آنها را در یک شاخص جدید تجربه در محل کار ترکیب کرده است که در برنامه انگیزشی بلند مدت شرکت برای پاداش مدیران گنجانده می شود. فوکه نوشت: «در سال‌های آینده، این امر مستقیماً بر پاداش‌های رهبران ارشد از جمله هیئت مدیره تأثیر", "category": "هوش مصنوعی مولد", "tags": ["تراشه"], "datetime_fa": "۱ آبان • ۱۶:۳۲"}, {"source": "Business Insider", "title": "I stayed at a 5-star Four Seasons hotel in Jackson Hole, Wyoming. My $1,000-a-night room felt like a skier's sanctuary.", "link": "https://www.businessinsider.com/four-seasons-jackson-hole-ski-resort-guest-room-review-tour", "summary": "The author s guest room at the Four Seasons Jackson Hole resort starts at about $1,000 during the winter ski season. Joey Hadden/Business Insider I've never been skiing. But if I ever decide to learn, I'll do it at the Four Seasons in Jackson Hole, Wyoming. My 550-square-foot room felt like a luxury cabin on the slopes. When I arrived at the Four Seasons Jackson Hole on a muggy day in early September, I imagined it covered in snow. This was in 2024, when I visited Jackson Hole, Wyoming , for the first time. I spent one night at the five-star ski-in, ski-out resort . If I ever take a ski trip , I imagine that my room at this Four Seasons would be a peaceful place to rest after an active day of gliding through powder. Step inside the 550-square-foot room with a starting rate of nearly $1,000 a night during the winter ski season. Welcome to the Four Seasons Jackson Hole, a five-star, slopeside ski resort. Courtesy of Four Seasons Jackson Hole The 65-year-old hotel chain has a luxurious reputation and over 130 locations worldwide, each designed to reflect its destination. Kim Cole, the director of public relations for the Four Seasons, told Business Insider that the company describes the Jackson Hole location's aesthetic as \"modern mountain chic,\" catering to hikers, bicyclists, and skiers in the winter. After checking in, I explored the room with the typical peak-season guest in mind. Joey Hadden/Business Insider The hotel has 106 guest rooms and 18 suites. The starting rate is $525 in the offseason and $995 in the peak winter season. Business Insider received a media rate for a one-night stay. There are also 31 Resort Residences on-site, built to serve large groups. These residences have kitchens and up to five bedrooms. Starting prices range from $4,200 to $11,000, depending on the season. Cole told Business Insider that in the winter, guest rooms are typically booked with active guests who participate in winter sports, so I imagined how the room would feel as a skier. I thought my 550-square-foot room blended traditional cabin nostalgia with midcentury modern luxury. Joey Hadden/Business Insider My room had a king-sized bed, a full bathroom, and a private balcony. Renovated by Wimberly Interiors in 2022, the guest rooms were designed to bring the outside in, with metal accents, stone finishings, and a soft, earth-toned color palette. This nature-inspired trend, known as biophilic design, gained traction in 2024. The bed was plush with warm, fluffy bedding ", "date_str": "2026-10-23T12:53:01+00:00", "hash": "16f376aff707a38e", "title_fa": "من در یک هتل 5 ستاره Four Seasons در جکسون هول، وایومینگ اقامت کردم. اتاق شبی 1000 دلاری من شبیه پناهگاه اسکی بازان بود.", "summary_fa": "اتاق مهمان نویسنده در استراحتگاه Four Seasons Jackson Hole در فصل زمستان اسکی از حدود 1000 دلار شروع می شود. Joey Hadden/Business Insider من هرگز اسکی نکرده ام. اما اگر تصمیم بگیرم یاد بگیرم، این کار را در چهار فصل در جکسون هول، وایومینگ انجام خواهم داد. اتاق 550 فوت مربعی من شبیه یک کابین لوکس در سراشیبی بود. وقتی در اوایل سپتامبر در روزی پر از گل و لای به چهارفصل جکسون هول رسیدم، تصور کردم که پوشیده از برف است. این در سال 2024 بود، زمانی که من برای اولین بار از جکسون هول، وایومینگ بازدید کردم. یک شب را در پیست اسکی پنج ستاره گذراندم. اگر روزی به یک سفر اسکی بروم، تصور می‌کنم که اتاق من در این چهار فصل مکانی آرام برای استراحت پس از یک روز فعال با سر خوردن در میان پودر خواهد بود. در طول فصل اسکی زمستانی، وارد اتاقی به مساحت 550 فوت مربع با نرخ شروع تقریباً 1000 دلار در شبانه روز شوید. به چهار فصل جکسون هول، یک پیست اسکی پنج ستاره در کنار شیب خوش آمدید. با حسن نیت از Four Seasons Jackson Hole هتل های زنجیره ای 65 ساله دارای شهرت مجلل و بیش از 130 مکان در سراسر جهان است که هر کدام به گونه ای طراحی شده اند که مقصد خود را نشان دهند. کیم کول، مدیر روابط عمومی Four Seasons، به Business Insider گفت که این شرکت زیبایی‌شناسی مکان جکسون هول را به‌عنوان «شیک کوهستانی مدرن» توصیف می‌کند، که برای کوهنوردان، دوچرخه‌سواران و اسکی‌بازان در زمستان پذیرایی می‌کند. پس از ورود، اتاق را با در نظر گرفتن مهمان معمولی فصل اوج بررسی کردم. Joey Hadden/Business Insider این هتل دارای 106 اتاق مهمان و 18 سوئیت است. نرخ شروع 525 دلار در خارج از فصل و 995 دلار در فصل اوج زمستان است. Business Insider", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۶:۲۳"}, {"source": "Business Insider", "title": "I'm a professional declutterer and don't declutter my entire house at once. I get rid of 5 things a day instead.", "link": "https://www.businessinsider.com/decluttering-home-without-feeling-overwhelmed-2026-10", "summary": "The author suggests getting rid of 5 things a day. Natalia Lebedinskaia/Getty Images Getting rid of just five things a day can make decluttering feel much more manageable. Small daily efforts add up, helping clear crowded drawers and surfaces over time. The key is consistency, not trying to organize your entire home in one weekend. The holidays are around the corner, and soon the chaos of hosting and travel will start. If tidying the house and reducing your clutter are things you thought you'd get to this year, let's take the pressure off and do it as gently as possible, before it ends. I help my clients get rid of clutter year-round . Here are a few strategies to make a tough task easier. Be realistic One thing that can derail your decluttering project is false optimism. Have you ever said, \"We'll clear out the garage on Saturday and w'll do something fun Sunday!\"? Taking care of stuff that has resisted management for years won't be done in an afternoon. There are so many choices to make when you're trying to get rid of things, and that's where confusion and exhaustion make a seemingly simple process into one that's hard to face. But don't despair — you can make progress and get things tidied up before next year. Imagine not having this task on your list when spring's optimism returns. Slow and steady is key You remember the tortoise and the hare? Slow and steady wins the race, and it will also get your home feeling more spacious and tidy. Try the five-a-day (or three-a-day, or two-a-day) method. Put a cardboard box in your back hall, garage, or other staging area. Choose five (or three or two) things every day and toss them in the box — or the trash. These items can be anything; on a challenging day, you might get rid of an old dried-up glue stick, a charging cord that doesn't match your current phone, and a stack of expired coupons. When you wake up one day feeling motivated, you might look for five pairs of unworn shoes and also choose five books you don't want anymore. It might feel like these small movements won't make a dent in the problem, but they will. After a couple of months, you'll find that drawers are less crowded and you can start to see surfaces again. Just keep at it. Do not fear the garbage can. Recycling is important , but at a certain point, things do become trash. Holding on to them because you feel guilty about the landfill isn't helping the planet. If you want to make a difference, try buying less. Schedule the hard stuff Maybe you'", "date_str": "2026-10-23T12:49:01+00:00", "hash": "350718294b5f57a3", "title_fa": "من یک تمیز کننده حرفه ای هستم و کل خانه ام را یکباره خراب نکنید. به جای آن روزی 5 چیز را از بین می برم.", "summary_fa": "نویسنده پیشنهاد می کند روزانه از شر 5 چیز خلاص شوید. Natalia Lebedinskaia/Getty Images خلاص شدن از شر تنها پنج چیز در روز می‌تواند باعث شود که بی‌نظمی‌تر احساس شود. تلاش‌های کوچک روزانه اضافه می‌شوند و به پاک کردن کشوها و سطوح شلوغ در طول زمان کمک می‌کنند. نکته کلیدی ثبات است، نه تلاش برای سازماندهی کل خانه خود در یک آخر هفته. تعطیلات نزدیک است و به زودی هرج و مرج میزبانی و سفر آغاز خواهد شد. اگر فکر می‌کردید امسال به آن‌ها برسید، مرتب کردن خانه و کاهش شلوغی‌هایتان است، بیایید فشار را از بین ببریم و قبل از پایان آن، تا حد امکان به آرامی این کار را انجام دهیم. من به مشتریانم کمک می کنم تا در تمام طول سال از شر بهم ریختگی خلاص شوند. در اینجا چند استراتژی برای آسان کردن یک کار سخت وجود دارد. واقع بین باشید یکی از چیزهایی که می تواند پروژه بی نظم شما را از مسیر خارج کند، خوش بینی کاذب است. آیا تا به حال گفته اید، \"ما روز شنبه گاراژ را پاکسازی می کنیم و یکشنبه یک کار سرگرم کننده انجام خواهیم داد!\"؟ مراقبت از چیزهایی که سال ها در برابر مدیریت مقاومت کرده اند، یک بعد از ظهر انجام نمی شود. وقتی می‌خواهید از شر چیزها خلاص شوید، انتخاب‌های زیادی وجود دارد، و اینجاست که سردرگمی و فرسودگی فرآیندی به ظاهر ساده را به فرآیندی تبدیل می‌کند که مواجهه با آن سخت است. اما ناامید نشوید - می توانید پیشرفت کنید و تا قبل از سال آینده همه چیز را مرتب کنید. تصور کنید وقتی خوش بینی بهار برگشت، این وظیفه را در لیست خود ندارید. آهسته و پیوسته کلید است لاک پشت و خرگوش را به خاطر دارید؟ آهسته و پیوسته برنده مسابقه است و همچنین باعث می شود خانه شما جادارتر و مرتب", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۶:۱۹"}, {"source": "Business Insider", "title": "Here's what's behind the vibe shift that's rattling the AI trade", "link": "https://www.businessinsider.com/ai-stocks-down-coreweave-nvidia-meta-capex-spending-jensen-huang-2026-10", "summary": "Photographer: Michael Nagle/Bloomberg via Getty Images Bloomberg/Getty Images The AI trade has been pummeled in the last couple of weeks. Thursday's rout extended a turbulent stretch that kicked off with last week's panic about CoreWeave. The vibes in the AI trade are shifting day-by-day as traders digest rates, spending concerns, and macro turmoil. The AI trade feels like it's at an inflection point . Shares of neoclouds like CoreWeave and Nebius have taken a beating over the last couple of weeks, while hyperscalers and chip stocks have been pummeled even as some tech giant report solid earnings and top execs rush to publicly calm markets . Things had been going swimmingly for the trade as late as the back half of September, thanks in part to excitement about Meta's Muse AI agent . The market touched its latest all-time high just two weeks ago. So what's behind the sudden vibe shift? Several factors have piled up to fuel the latest sell-off: CoreWeave saw some of its bonds drop to distressed prices , sparking fears about its financing costs that spilled over and pummeled the stock. Shares are down 28% since October 12. Inflation and oil prices are fueling fears of higher long-end rates, and prompting the Fed to hike short-term rates. Demand for capital is extremely high, pushing up interest rates. Higher rates translate to less borrowing, which means less spending on the AI buildout. Less spending on AI infrastructure means lower earnings than investors had expected for capex beneficiaries — like chip producers and the web of ancillary firms that build and provide systems for data centers. A slower AI buildout means a potentially longer path to monetization. Earnings still aren't delivering the goods the market wants to see. Investors are more concerned than ever that the AI hyperscalers are spending enormous sums with too little to show for it. Meta stock dropped after earnings this week, despite upbeat results and guidance. In other words, it's a big mess that's come to a head in the last week. The jitters around CoreWeave and the neocloud companies even prompted Nvidia CEO Jensen Huang to try and reassure investors about the health of the sector. \"The demand for the neoclouds is off the charts,\" Huang told CNBC on Thursday. Nvidia own a stake in CoreWeave. Nvidia CEO Jensen Huang hyped up the demand for the neocloud companies as investors fled CoreWeave stock in the last week. Sean Gallup/Getty Images For CoreWeave and other neoclouds, a shorter runway", "date_str": "2026-10-23T12:06:39+00:00", "hash": "cb733b1e0b1f7bf9", "title_fa": "در اینجا چیزی است که در پس تغییر فضایی وجود دارد که تجارت هوش مصنوعی را متلاطم می کند", "summary_fa": "عکاس: Michael Nagle/Bloomberg از طریق Getty Images بلومبرگ/Getty Images تجارت هوش مصنوعی در چند هفته گذشته تحت تاثیر قرار گرفته است. شکست روز پنجشنبه یک کشش آشفته را گسترش داد که با وحشت هفته گذشته در مورد CoreWeave آغاز شد. با هضم معامله‌گران نرخ‌ها، نگرانی‌های مربوط به هزینه‌ها و آشفتگی‌های کلان، هیجانات در تجارت هوش مصنوعی روز به روز در حال تغییر است. تجارت هوش مصنوعی به نظر می رسد که در یک نقطه عطف است. سهام نئوکلادهایی مانند CoreWeave و Nebius طی چند هفته گذشته شکست خورده اند، در حالی که ارزش های ابر مقیاس و سهام تراشه ها تحت تاثیر قرار گرفته اند، حتی در حالی که برخی از غول های فناوری گزارش درآمدهای خوبی داشته اند و مدیران ارشد هجوم به بازارهای آرام عمومی دارند. تا نیمه پایانی ماه سپتامبر، تا حدودی به لطف هیجان در مورد عامل هوش مصنوعی متا، Muse، همه چیز به خوبی پیش می رفت. این بازار تنها دو هفته پیش به آخرین رکورد تاریخی خود رسید. پس چه چیزی در پس تغییر فضای ناگهانی وجود دارد؟ عوامل متعددی برای تقویت آخرین فروش انباشته شده اند: CoreWeave شاهد کاهش برخی از اوراق قرضه خود به قیمت های ناامید بود که باعث ایجاد ترس در مورد هزینه های تامین مالی آن شد که سرریز و سهام را به هم ریخت. سهام از 12 اکتبر 28 درصد کاهش یافته است. تورم و قیمت نفت به ترس از افزایش نرخ های بلندمدت دامن می زند و فدرال رزرو را وادار به افزایش نرخ های کوتاه مدت می کند. تقاضا برای سرمایه بسیار بالاست و نرخ بهره را بالا می برد. نرخ‌های بالاتر به معنای استقراض کمتر است، که به معنای هزینه کمتر برای ساخت هوش مصنوعی است. هزینه کمتر در زیرساخت های هوش مصنوعی به معنای درآمد کمتری نسبت به انتظار سرمایه گذاران برای ذینفعان سرمایه", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "Meta", "تراشه"], "datetime_fa": "۱ آبان • ۱۵:۳۶"}, {"source": "Business Insider", "title": "I’m a comedian whose joke was stolen by an AI creator. I blame Meta and feel powerless.", "link": "https://www.businessinsider.com/comedian-ai-creator-stole-my-joke-i-blame-meta-2026-10", "summary": "George Brett Olson (right) said his joke was taken by an AI account (left). George Brett Olson via Instagram George Brett Olson is one of a set of comedians who've called out AI accounts for ripping off their work. Olson said he was upset with Meta for allowing the situation to persist on its platforms. Instagram's top exec said the platform is invested in promoting original content and would look into the issue. This as-told-to essay is based on an interview with George Brett Olson, one of several comedians who have lately called out AI accounts for ripping off their jokes. It's been edited for length and clarity. Instagram head Adam Mosseri said he would look into what could be done about the issue and that the platform was invested in driving traffic to original content. I started doing stand-up in 2021 after getting burned out from being a winemaker. I'd been doing live shows, and this joke I made about, ironically, AI stealing jobs went viral. The whole joke was about AI stealing jobs and people still blaming immigrants, which is very silly when the most powerful people were saying, \"We're literally coming to take all your jobs.\" Then a friend sent me the video of this lady doing the joke. He's like, \"AI is for real, for real, stealing your jokes.\" It was basically me, in my clothes, but it's a 42-inch butt. It's just the pornification of women online. It was very strange. I'd been doing that joke for a year. I thought of it after working out with my buddy, and we were talking, walking. It takes a lot of work to get a joke stage-ready. It's a lot of repetition, tweaking, driving from place to place to perform. Comedy's not easy. So it's pretty sad to see it happen, especially when the AI comedians who are stealing jokes have more followers than the people they're stealing from. I asked the account behind the joke if she was real. She said yes. Then I asked, \"Did someone help you do this?\" And she just left me on read. She also left a comment saying, \"Sorry, won't happen again,\" and removed a bunch of videos. I've had a bunch of followers try to report it. Adam Mosseri, the head of Instagram , replied and basically said, \"Not all AI's bad. We don't know how we're going to stop it, but people shouldn't be able to steal. Seems like we should do something about that.\" [This was Mosseri's exact comment: \"I don't think it's practical for us to try and ban AI content from the platform. It's gonna be harder and harder to identify, and it's not all bad content", "date_str": "2026-10-23T12:00:01+00:00", "hash": "a30af7901d44d6aa", "title_fa": "من یک کمدین هستم که شوخی او توسط یک خالق هو  and Josh Smith, want to be the Barstool Sports of business. School of Hard Knocks James Dumoulin has turned street interviews with moguls into a business on track for $37 million in revenue this year. School of Hard Knocks uses staged drama to hook viewers and sells consulting services and memberships. Dumoulin and his partners aim to expand and become the \"Barstool Sports of business content.\" As James Dumoulin approaches a private equity investor in Lagos, Nigeria, there's an ominous moment when a bodyguard holding a rifle puts his hand up and demands the content creator stop. \"I have a channel with 24 million followers,\" the School of Hard Knocks cofounder responds, and then asks if he can interview the investor, Adesuwa Rhodes, for one minute about how she got rich. Rhodes steps forward, dressed in a vibrantly patterned suit, and begins answering Dumoulin's questions, explaining how she broke into the business, the importance of persistence, and her faith in God. The video's formula — mixing a high-drama street interview with advice from the wealthy and successful — has been distilled down to a science by 24-year-old Dumoulin, and helped him create a company that's on track to do $37 million in revenue this year, profitably, according to copies of financial documents he provided to Business Insider. The initial set-up is also, as Dumoulin readily explains, partly scripted. \"They're screaming at me, and it looks like a war is about to break out, and then I get her to calm them down,\" he said of how he blocked out the Rhodes scene. \"And she gave some incredible sound bites and advice.\" View this post on Instagram A post shared by The School Of Hard Knocks (@theschoolofhardknockz) Street interviews, which have their predecessors on radio and TV, have been reborn as one of social media's hottest formats. Standout stars of the genre include Kareem Rahma of \"Subway Takes,\" who gets opinions on hot topics from strangers, and TikToker Caleb Simpson, who asks گی", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "امنیت سایبری", "سینما"], "datetime_fa": "۱ آبان • ۱۶:۳۰"}],
      media: [{"source": "Billboard", "title": "Fashion Is the Future of Technology: How V of BTS, Navy Blue, Kelela and Nothing Are Bridging Tech and Culture — ‘Find Joy in the Little Things’", "link": "https://www.billboard.com/culture/lifestyle/fashion-music-technology-headphones-kelela-navy-blue-1236358853/", "summary": "Technology and fashion have always been intertwined, but as more of the devices we use become things we wear, the line between the two is getting harder to distinguish. Headphones are an obvious example. Once primarily functional accessories, they ve become part of how people present themselves in public. Whether worn over the ears, resting around the neck, or sitting on a purse or a hat, they can complement an outfit, communicate personal taste and signal an affinity for a particular brand or community. Like sneakers, jewelry, socks or a favorite bag, they re increasingly part of the visual language through which people express themselves and story tell. And it makes sense. When technology becomes something you physically wear, its design becomes part of your appearance. You re not just choosing a device for what it can do. You re choosing something that will exist on your body, in public, alongside everything else you use to communicate who you are and what you’re about. And now you’re thinking, “Will these headphones match most of my looks? Will these headphones bring my fits together or take away from them?” We’re at a point where so many headphones have amazing noise-canceling, transparency mode, great audio quality and mics. Some may be better than others in some categories but the differences — no matter if the brands like it or not — are becoming few and far between. That raises a bigger question about the future of technology: As products become increasingly capable, will their cultural significance matter as much as their technical capabilities? At Nothing s New Noise event in New York, that question extended beyond the products on display. The event brought together technology, fashion and music, with conversations featuring Kelela and Navy Blue — two artists whose approaches to music and fashion offer different perspectives on where culture is heading. The connection isn t simply that musicians are wearing headphones or that technology companies are borrowing from fashion. It s that technology, fashion and music are increasingly intertwined forms of self-expression. The products we carry, the clothes we wear and the music we listen to all contribute to how we construct our identities and how people construct identities for us. And as technology becomes more visible in our everyday lives, the way it looks, feels and fits into our personal worlds becomes harder to separate from its function. For Nothing s chief brand officer, Charlie Smith, that ", "date_str": "2026-10-23T14:06:33+00:00", "hash": "592b8794112d24ce", "title_fa": "مد آینده فناوری است: چگونه V of BTS، Navy Blue، Kelela و Nothing بر فناوری و فرهنگ پل می زنند - «لذت را در چیزهای کوچک بیابید»", "summary_fa": "فناوری و مد همیشه در هم تنیده بوده‌اند، اما هر چه بیشتر وسایلی که استفاده می‌کنیم به وسایلی تبدیل می‌شوند که می‌پوشیم، تشخیص مرز بین این دو سخت‌تر می‌شود. هدفون یک مثال واضح است. هنگامی که لوازم جانبی در درجه اول کاربردی بودند، به بخشی از نحوه نمایش مردم در عموم تبدیل شدند. خواه روی گوش پوشیده شوند، دور گردن قرار بگیرند، یا روی کیف یا کلاه بنشینند، می توانند مکمل یک لباس باشند، سلیقه شخصی را به اشتراک بگذارند و نشان دهنده تمایل به یک برند یا جامعه خاص باشند. مانند کفش‌های کتانی، جواهرات، جوراب‌ها یا کیف مورد علاقه، به طور فزاینده‌ای بخشی از زبان بصری هستند که مردم از طریق آن خود را بیان می‌کنند و داستان را روایت می‌کنند. و منطقی است. وقتی تکنولوژی به چیزی تبدیل می شود که شما از نظر فیزیکی می پوشید، طراحی آن بخشی از ظاهر شما می شود. شما فقط یک دستگاه را برای کاری که می تواند انجام دهد انتخاب نمی کنید. شما چیزی را انتخاب می کنید که روی بدن شما وجود داشته باشد، در ملاء عام، در کنار هر چیز دیگری که برای بیان اینکه چه کسی هستید و در مورد چه چیزی هستید استفاده می کنید. و اکنون به این فکر می کنید، \"آیا این هدفون با بیشتر ظاهر من مطابقت دارد؟ آیا این هدفون ها تناسب من را به هم می رسانند یا آنها را از بین می برند؟\" ما در نقطه ای هستیم که بسیاری از هدفون ها دارای قابلیت حذف نویز شگفت انگیز، حالت شفافیت، کیفیت صدای عالی و میکروفون هستند. برخی ممکن است در برخی دسته‌ها بهتر از دیگران باشند، اما تفاوت‌ها - مهم نیست که برندها آن را دوست دارند یا نه - در حال کم شدن هستند. این یک سوال بزرگتر در مورد آینده فناوری ایجاد می کند: با افزایش توانمندی", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۷:۳۶"}, {"source": "Hollywood Reporter", "title": "‘The Mosquito Bowl’ Review: Nicholas Galitzine and Bill Skarsgard in Peter Berg’s Technically Impressive, Emotionally Hollow Netflix War Drama", "link": "https://www.hollywoodreporter.com/movies/movie-reviews/the-mosquito-bowl-review-peter-berg-netflix-1236738732/", "summary": "Ray Nicholson and Tom Francis also star in the AFI Fest-premiering film, inspired by the true story of a football game played between Marines stationed in the Pacific theater of WWII.", "date_str": "2026-10-23T14:05:31+00:00", "hash": "1d7276efe0d190bc", "title_fa": "نقد و بررسی «کاسه پشه»: نیکلاس گالیتزین و بیل اسکارسگارد در درام جنگی نتفلیکس از نظر فنی تأثیرگذار و از نظر احساسی توخالی پیتر برگ", "summary_fa": "ری نیکلسون و تام فرانسیس همچنین در اولین فیلم جشنواره AFI بازی می‌کنند که الهام گرفته از داستان واقعی یک بازی فوتبال بین تفنگداران دریایی مستقر در تئاتر اقیانوس آرام در جنگ جهانی دوم است. کاسه پشه، درام جدید پیتر برگ در جنگ جهانی دوم برای نتفلیکس، بلافاصله با نقل قول معروف هربرت هوور، لحن را ایجاد می کند. پیرمردها اعلام جنگ می کنند، می رود، اما این جوانان هستند که باید بجنگند و بمیرند. و این جوان است که باید وارث مصیبت، اندوه و پیروزی‌هایی باشد که پیامدهای جنگ است.» این بیانیه ای است جاودانه در حقیقت و ویرانگر در ظلماتش، چیزی که ارزش آن را دارد که هر زمان که شبح نبرد مطرح می شود به خاطر بسپارید. همچنین، ممکن است متوجه شده باشید، موضوع کم و بیش هر فیلم جنگی p of producer Sean House as the funk legend himself provides some much needed narration. This all got put in motion because Croft was playing a Jay Worthy Larry June project while on the road with his grandfather. We were on tour a couple years ago, and I was playing 2 P z in the Pod , and I believe I was playing Maybe the Next Time,' Zavier says over Zoom. And George was like, Yo, yo, who is that? Let s see what they re up to. So then I reached out to Jay Worthy, and as soon as I DM d him and told him who I was, he asked for my phone number and FaceTimed me. After that it was just a snowball effect of working together and building this. Worthy and House were then presented with a batch of songs that were cleared for use and started crafting what would become Generation P. Once they had something to present, LNDN DRGS headed out to play what he had for George out in Tallahassee, Florida. I hit up management for songs that George and Parliament own so we can sample them without legal issues or getting in trouble, so that George and the band can benefit from, Croft tells me. There were a couple of albums I already knew that we could use, like Uncle Jam Wants You and One Nation Under a Groove . I sent it to Jay and we talked through it. That s how it all worked out. I linked up with Sean, and then we made that trip down to Tallahassee, and G was f—king with it, Worthy adds. He P d on it and I P d on it, and then we took it back to L.A. and I started getting them features on it, and then I went back to Tallahassee and played it for them after it was all done. It s been about like three years, man. For real. Once they were ready to go, they leaned into the nostalgia and released a 16-bit video game entitled P of the Week — a mix of Super Mario Bros. and Streets of Rage — during the rollout. Like Worthy s Once Upon A Time double disc from last year, Generation P bridges the gap of California s deep rap lineage with features from Snoop Dogg , Larry June , 03 Greedo , Kokan me_fa": "۱ آبان • ۱۷:۲۴"}, {"source": "Hollywood Reporter", "title": "Tony Dokoupil Has a Question: Will You Watch His New Podcast? (Exclusive)", "link": "https://www.hollywoodreporter.com/business/digital/tony-dokoupil-new-cbs-news-podcast-great-question-1236738601/", "summary": "The 'CBS Evening News' anchor is nearly a year into his tenure, and launching the show's first big digital expansion, 'Great Question with Tony Dokoupil.'", "date_str": "2026-10-23T14:00:00+00:00", "hash": "1ab567f5c1408c19", "title_fa": "تونی دوکوپیل یک سوال دارد: آیا پادکست جدید او را تماشا خواهید کرد؟ (انحصاری)", "summary_fa": "مجری \"CBS Evening News\" تقریباً یک سال از فعالیت خود می گذرد و اولین برنامه گسترش دیجیتالی بزرگ سریال را با نام \"سوال بزرگ با تونی دوکوپیل\" راه اندازی می کند. تونی دوکوپیل در حال راه‌اندازی یک پادکست است، و اگر نسخه ویدیویی آن را تماشا کنید و بسیار بسیار دقیق نگاه کنید، این شانس وجود دارد که شماره تلفن سالوادور دالی را ببینید. Dokoupil، مجری CBS Evening News، اکنون تقریباً 11 ماه از کارش می گذرد و برای شنیدن توضیح او، تازه شروع به یافتن ریتم و جایگاه خود در این نقش پرمخاطب کرده است. بنابراین این یک لحظه مناسب برای گسترش اخبار عصر به پلتفرم‌های دیجیتال با پسوند پادکست کاملاً اصلی است: سؤال بزرگ با تونی دوکوپیل. این به صورت ویدیویی (در یوتیوب و سایر پلتفرم‌های پادکست) در دسترس خواهد بود، که در دفتر او فیلمبرداری شده است، همراه با نسخه‌های صوتی. می‌توانی عکس پدرم را روی قفسه پشت سرم ببینی [او به‌خاطر قاچاق ماری‌جوانا در سال 1992 دستگیر شد] و مجله پیشگام حمایت از همجنس‌گرایان عموی بزرگم که با آن منتشر شد به نام «چیز مایکل در قفسه» پشت سرم، و تمام جلدهای قدیمی‌ام نیوزویک می‌گوید: «دوست دارم». لوازم، قبل از فرود بر روی مورد علاقه اش: من یک رولودکس را از زباله نجات دادم زمانی که نیوزویک در آستانه تا شدن بود. سوال بزرگ از پایه و اساس اخبار عصر ساخته خواهد شد، اما این موضوع خودش نیز خواهد بود. پیش فرض؟ دو بار در هفته، دوشنبه‌ها و چهارشنبه‌ها، Dokoupil روی یک سوال عالی تمرکز می‌کند و به خبرنگاران یا کارشناسان کمک می‌کند تا به آن پاسخ دهند. وقتی به ایونینگ نیوز فکر می‌ک ion the actor, who has starred in movies as diverse as The Hobbit trilogy and the live-action Beauty and the Beast opposite Emma Watson, also recently came off a five-month stint Broadway stint [ ]", "date_str": "2026-10-23T13:45:35+00:00", "hash": "895513befa95290e", "title_fa": "لوک ایوانز در درام جدید ITV خود \"The Party\"، با بازی در \"The Rocky Horror Picture Show\" در برادوی و اینکه آیا او در نقش بارد در \"شکار گلوم\" بازخواهد گشت.", "summary_fa": "لوک ایوانز از جمله کادر کمیاب بازیگران بریتانیایی است که به طور منظم بین فیلم‌های پرفروش هالیوود و درام‌های متوسط ​​بریتانیایی تعادل برقرار می‌کند. ناگفته نماند این بازیگر که در فیلم‌های متنوعی مانند سه‌گانه هابیت و لایو اکشن Beauty and the Beast در مقابل اما واتسون بازی کرده است، اخیراً یک دوره پنج ماهه در برادوی را پشت سر گذاشت [ ] آخرین پروژه او «پارتی» است که اقتباسی از یک تریلر روان‌شناختی توسط الیزابت دی است. (سریال پنج قسمتی که توسط استودیو ITV برای فروش جهانی تکرار شده است، در حال حاضر برای تماشای ITVX در دسترس است). این نمایش به طبقه، تمایلات جنسی پنهان و ماهیت عشق رمانتیک و افلاطونی می پردازد که همگی در یک درام پرتنش پیچیده شده اند. پرطرفدار در داستان‌های مرتبط با تنوع. شلی بلوند، صداپیشه افتتاحیه لارا کرافت، اولین باری که سارا شخصیت «مهاجم مقبره» را دید، به یاد می‌آورد: «فکر می‌کردم خیلی سکسی و بسیار بالسی بود» ایوانز، که برای اولین بار با رمان دی به‌عنوان قفلی که در طول همه‌گیری کووید خوانده می‌شد، برخورد کرد و این ابزار را به این مجموعه تبدیل کرد. (سلیمانی همچنین در این نمایش نقش همسرش لوسی را بازی می کند). ایوانز با ورایتی درباره تفاوت‌های رمان و سریال، تجربیات اخیرش در برادوی و اینکه آیا طرفداران تالکین می‌توانند از او انتظار داشته باشند که در فیلم آینده اندی سرکیس «شکار گلوم» دوباره نقش خود را در نقش بارد کمان‌کننده بازی کند، صحبت کرد. وقتی کسی را می‌آورید که توانایی‌های فردی مثل سارا را دارد، باید به او اجازه دهید تا با آن بدود، و این هیجان‌انگیز و همچنین دلهره‌آور بود که بدانیم او چه چیزی را تغییر خواهد داد، اما همچنین می‌دانستیم که همه چیز تغییر خواهد کرد.", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۱۷:۱۵"}, {"source": "Variety", "title": "The Gotham Group and Toonstar Team Up for New Animated Series", "link": "https://variety.com/2026/artisans/news/the-gotham-group-and-toonstar-new-animated-series-1236921611/", "summary": "The Gotham Group and Toonstar are partnering to produce up to 12 new original animated series for kids. The partnership aims to create quality animation and family entertainment that will be launched on direct-to-audience platforms. Toonstar is a tech-powered animation studio building entertainment franchises. Founded by Disney, Warner Bros. and DreamWorks veterans Attanasio and Luisa [ ]", "date_str": "2026-10-23T13:45:00+00:00", "hash": "ef215b8608afa991", "title_fa": "گروه گاتهام و تونستار برای سریال های انیمیشنی جدید تیم می شوند", "summary_fa": "گروه Gotham و Toonstar برای تولید حداکثر 12 سریال انیمیشن اصلی جدید برای کودکان همکاری می کنند. هدف این همکاری ایجاد انیمیشن با کیفیت و سرگرمی های خانوادگی است که بر روی پلتفرم های مستقیم به مخاطب راه اندازی می شود. Toonstar یک استودیوی انیمیشن مبتنی بر فناوری است که فرنچایز سرگرمی ایجاد می کند. توسط دیزنی، برادران وارنر تأسیس شد. و آتاناسیو و لوئیزا کهنه کار دریم ورکس [ ] الن گلد اسمیت وین موسس و مدیر عامل گروه گاتهام گفت: «وقتی برای اولین بار با جان و لویزا صحبت کردم، بلافاصله با هم ارتباط برقرار کردیم. آنها ابتدا خلاق هستند. آنها انیمیشن را دوست دارند، غرایز خلاقانه فوق العاده ای دارند و می دانند که چگونه برای مخاطبان دیجیتال اول تولید کنند. اینجاست که فرصت در حال حاضر وجود دارد و به همین دلیل است که سازندگان به روش‌های جدیدی برای دستیابی به مخاطبان نیاز دارند.» جان آتاناسیو، یکی از بنیانگذاران و مدیر عامل Toonstar، گفت: «الن و گاتهام سه دهه را صرف یافتن و حمایت از استعدادهای انیمیشن و IP باورنکردنی کرده‌اند». ما با هم می‌توانیم به این هنرمندان و داستان‌نویسان کمک کنیم تا نسل بعدی فرنچایزهای محبوب کودکان را مستقیماً با مخاطبان خلق کنند.» در بیانیه ای، مت شیچتمن، رئیس فناوری های نوظهور در گروه گاتهام، گفت: «سازندگان انیمیشن اکنون می توانند با سرعت و مقیاسی که ریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید.", "category": "سینما و سریال", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۱۷:۰۴"}, {"source": "Netflix NL", "title": "Netflix verrast met ‘Nederlandse’ truecrime", "link": "https://www.netflix-nederland.nl/netflix-verrast-met-nederlandse-truecrime/", "summary": "Als Nederlander ben jij hoogstwaarschijnlijk wel bekend met de zaak-Natalee Holloway, dat kan bijna niet anders door de betrokkenheid van Joran van der Sloot. Nu komt Netflix met een nieuwe truecrimedocumentaire over dit onderwerp! Taken: Natalee Holloway Dat is best verrassend, want is alles over de zaak-Natalee Holloway niet al lang bekend? Nee, vindt Netflix, dat het onder meer over een onverwachte wending in 2023 heeft. In de driedelige Netflix-truecrimedocumentaire Taken: Natalee Holloway blikt Beth Holloway, de moeder van Natalee, voor het eerst uitgebreid terug op de vermissingszaak die haar leven al twintig jaar beheerst. Ze vertelt over de gebeurtenissen vanaf het moment dat haar dochter spoorloos verdween tot aan de schokkende bekentenis die bijna twee decennia later volgde. De documentaire biedt een bijzondere kijk op de zaak aan de hand van exclusieve interviews met rechercheurs, niet eerder gepubliceerde beelden en voor het eerst openbaar gemaakte geluidsopnames van familieleden, vrienden en de FBI. Daarnaast laat de serie zien hoe de verdwijning van Natalee uitgroeide tot een zaak die heel Amerika (en, laten we eerlijk zijn, ook Nederland) in zijn greep hield. Tegelijkertijd staat de onvermoeibare strijd van een moeder centraal, die ondanks alle tegenslagen bleef zoeken naar antwoorden en gerechtigheid voor haar dochter. Bekentenis Joran van der Sloot Netflix heeft het dus over een onverwachte wending in 2023, waarmee de streamingdienst naar de bekentenis van Joran van der Sloot verwijst. Van der Sloot verklaarde dat -revives-spooky-rock-band-dead-mans-bones-1236367075/", "summary": "Ryan Gosling is reviving one of his long-dormant side gigs just in time for Halloween. The Project Hail Mary star announced on Thursday (Oct. 22) that after nearly 20 years of dormancy, new music is on the way from his rock duo side project, Dead Man s Bones. In an Instagram video , the duo featuring Gosling and screenwriter/producer Zach Shields ( Krampus , Godzilla Vs. Kong ), teased their first new music in 17 years, due out on Oct. 27. In keeping with the spooky vibe of their eponymous 2009 debut LP, the brief teaser video has a distinctly Halloween-appropriate air. It features a man s head floating in a sinister spiral as he warns, Where winds are black as midnight breath. Where hands can t find the light to loose, the chains that keep me far from you, he says ominously. So, dead man’s bones must wait to rise, from the house where shadows cry. All of this must change, he adds, with a young girl s voice interrupting to shout Oct. 27! When our ghosts must leave our world for this, to dance with us at twilight time, and bring your hand to lie in mine, he continues. The post is credited to the band as well as Gosling s wife, actress Eva Mendes, who has been quietly hyping the comeback on her own feed, including earlier this week when she posted old horror movie footage cued to Dead Man s Bones haunted rock tune In the Room Where You Sleep. Mendes followed that up with a video in which she walks slowly through a grove of trees, cued to Gosling s spectral voice singing down, under the ground/ There s a town there/ I ve been down there in a ghostly voice with the caption, Trying to summon new music from DEAD MAN S BONES. I can feel it in the air After the teaser trailer dropped, Mendes reposted it on her feed and gushed , He came through on this promise to me. 🖤. Former All New Mickey Mouse Club star Gosling has frequently leaned into his singing chops in his films, including Lars and the Real Girl , اوایل این هفته که او فیلم‌های ترسناک قدیمی را به همراه آهنگ راک تسخیرشده استخوان مرده در اتاقی که می‌خوابید، پست کرد. مندز آن را با ویدیویی دنبال کرد که در آن به آرامی در میان بیشه‌ای از درختان قدم می‌زند، با صدای طیفی گاسلینگ که در زیر زمین", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۱۶:۴۶"}, {"source": "Billboard", "title": "Most Played Track, Biggest Artist & More Key Takeaways From WARM’s 2026 Dance Insights Report", "link": "https://www.billboard.com/lists/most-played-song-biggest-artist-warm-2026-dance-insights-report/", "summary": "The World Airplay Radio Monitor has released its 2026 Dance Insights report, which compares the first half of 2026 to the first half of 2025 across artist performance, label share, collaborations, gender, genre and geography. For the report, WARM ranked the Global Top 100 dance tracks over the first six months of 2026 using airplay data from 218 dedicated dance radio stations in 39 countries. The panel of stations includes BBC Radio 1 and NTS Radio in the United Kingdom, SiriusXM’s BPM and Diplo’s Revolution and Ibiza Global Radio in Spain. ANOTR’s “Talk to You,” featuring 54 Ultra, was the most played track of the half of 2026 with 15,087 plays. The song, which spent 17 weeks at No. 1 on the weekly WARM Global Dance Airplay chart, edges out Sonny Fodera, D.O.D and Poppy Baskcomb’s “Think About Us” (No. 2; 12,908 plays) and HUGEL and SOLTO’s “Jamaican (Bam Bam)” (No. 3; 11,791). Artists from 26 countries across six continents are represented in the top 100, though the U.K. and U.S. are the anchors, as U.K. artists account for 25.6% of artist appearances and U.S. artists account for 20.7%. Still, the rest of the world makes up the majority, with 53.7% of appearances. France (9.4%), Germany and the Netherlands (6.9% each) head up that group, while acts from countries including South Korea, Brazil, Nigeria and Zimbabwe also earn spots. On the genre side, dance pop leads with 40 tracks, or 38.8% of the chart. House (17 songs) and tech house (12) follow, and together the top three genres make up two-thirds of the list. In all, the top 100 spans 17 genres, with Afro house (10 titles) close behind the leaders. Here are our five key takeaways from the report.", "date_str": "2026-10-23T13:00:00+00:00", "hash": "4f5c550d20f2bdf2", "title_fa": "بیشترین آهنگ پخش شده، بزرگترین هنرمند و نکات کلیدی دیگر از گزارش 2026 Dance Insights WARM", "summary_fa": "World Airplay Radio Monitor گزارش 2026 Dance Insights خود را منتشر کرده است که نیمه اول سال 2026 را با نیمه اول سال 2025 از نظر عملکرد هنرمندان، سهم برچسب ها، همکاری ها، جنسیت، ژانر و جغرافیا مقایسه می کند. برای این گزارش، WARM با استفاده از داده‌های پخش از 218 ایستگاه رادیویی اختصاصی رقص در 39 کشور، 100 آهنگ برتر جهانی رقص را در شش ماه اول سال 2026 رتبه‌بندی کرد. پانل ایستگاه‌ها شامل رادیو بی‌بی‌سی ۱ و رادیو NTS در بریتانیا، SiriusXM’s BPM و Diplo’s Revolution و Ibiza Global Radio در اسپانیا است. آهنگ \"Talk to You\" از ANOTR با 54 Ultra، با 15087 پخش، پربازی‌ترین آهنگ نیمه سال 2026 بود. این آهنگ که 17 هفته در رتبه اول جدول هفتگی WARM Global Dance Airplay قرار گرفت، بالاتر از سانی فودرا، D.O.D و Poppy Baskcomb \"Think About Us\" (شماره 2؛ 12908 نمایش) و HUGEL و SOLTO \"Bam3;1,1\" (No. هنرمندانی از 26 کشور در 6 قاره در میان 100 نفر برتر حضور دارند، اگرچه بریتانیا و ایالات متحده مجریان آن هستند، زیرا هنرمندان بریتانیایی 25.6 درصد از حضور هنرمندان و هنرمندان آمریکایی 20.7 درصد را تشکیل می دهند. با این حال، بقیه جهان با 53.7 درصد از حضور اکثریت را تشکیل می دهند. فرانسه (9.4 درصد)، آلمان و هلند (هر کدام 6.9 درصد) در صدر این گروه قرار دارند، در حالی که اقدامات کشورهایی مانند کره جنوبی، برزیل، نیجریه و زیمبابوه نیز امتیاز کسب می کنند. در سمت ژانر، رقص پاپ با 40 آهنگ یا 38.8 درصد از نمودار پیشتاز است. هاوس (17 آهنگ) و خانه فناوری (12 آهنگ) دنبال می شوند و سه ژانر برتر با هم دو سوم لیست را تشکیل می دهند. در مجموع، 100 برتر شامل 17 ژانر است که خانه Afro (10 عنوان) پشت سر رهبران قرار دارد. در اینجا پنج نکته کلیدی ما", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۶:۳۰"}, {"source": "Deadline", "title": "Jonathan Groff Returning To Broadway In Solo Play ‘The Amish Project’", "link": "https://deadline.com/2026/10/jonathan-groff-broadway-amish-project-1237171598/", "summary": "Tony Award winner Jonathan Groff will return to Broadway this winter in The Amish Project, a solo play written by Jessica Dickey and directed by Sarna Lapine. Performances begin Wednesday, February 10, 2027, at the Broadhurst Theatre. Producers Robert Ahrens and Tom Kirdahy announced the show and its star today. An official opening night is [ ]", "date_str": "2026-10-23T13:21:58+00:00", "hash": "cc02269c0b5e825c", "title_fa": "بازگشت جاناتان گروف به برادوی در نمایش انفرادی «پروژه آمیش»", "summary_fa": "جاناتان گروف، برنده جایزه تونی، زمستان امسال در پروژه آمیش، یک نمایشنامه انفرادی به نویسندگی جسیکا دیکی و کارگردانی سارنا لاپین، به برادوی بازخواهد گشت. اجراها از چهارشنبه 10 فوریه 2027 در تئاتر Broadhurst آغاز می شود. رابرت آرنز و تام کرداهی تهیه‌کنندگان این سریال و ستاره آن را امروز اعلام کردند. یک شب افتتاحیه رسمی است [ ] دو پروژه بسیار موفق برادوی با بازیگران بزرگ Merrily We Roll Along و Just In Time Groff اکنون به صورت انفرادی در The Amish Project به نمایش در می آیند، نمایشی که توسط سازنده به عنوان یک نمایش انفرادی عمیقاً تکان دهنده در مورد قدرت شگفت انگیز شفقت در مواجهه با از دست دادن غیرقابل تصور توصیف می شود. اخبار مرتبط اخبار The Imaginary Invalid Broadway Review: مولیر توسط یک بیل برنده دلقک می شود اخبار ایروین نیل دگراس تایسون، بیل نای مای جمیسون به موزیکال گالیله در برادوی بپیوندید به عنوان تهیه کننده همکار خلاصه داستان: وقتی تراژدی همه چیز را در هم می شکند، همه چیز را به هم می زند، ما می دانیم که در مورد یک اجتماع بزرگ آمیش ها چه چیزی را دنبال می کنیم. بخشش پروژه آمیش با الهام از وقایع واقعی که تنها چند دقیقه از محل بزرگ شدن گروف رخ داده است، پرتره ای صمیمی از یک مکان و جامعه است که از طریق یک مجری منفرد هدایت می شود. این داستان شگفت‌انگیز که توسط نمایشنامه‌نویس تحسین‌شده جسیکا دیکی (رامبراند، صومعه) و کارگردانی سارنا لاپین (من را ایزی صدا کن، یکشنبه در پارک با جورج) نوشته شده است، ما را دعوت می‌کند تا به این فکر کنیم که حتی در تاریک‌ترین ساعت‌ها، انسانیت مشترک ما چگونه دوام می‌آورد. در Deadline Said Groff تماشا کنید، «بیست سال پیش در این ماه، یک تراژدی غیرقابل تصور در مدرسه یک اتاقه آمیش ها در لنکستر، پنسیلوانیا", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۱۶:۵۱"}, {"source": "Deadline", "title": "‘The Gentlemen’ Season 3 Cast Additions Include Orlando Bloom, Robert Carlyle & Elijah Wood But No Meghan Markle; Here’s Who’s Not Coming Back", "link": "https://deadline.com/2026/10/the-gentlemen-season-3-cast-orlando-bloom-no-meghan-markle-1237171447/", "summary": "Guy Ritchie s The Gentlemen is adding a few more gentlemen (and ladies) for its third season, which has started production in UK and Morocco. Joining the Theo James-starring series are Orlando Bloom (The Cut), Robert Carlyle (Line of Duty), Elijah Wood (Yellowjackets), Dexter Fletcher (Ritchie s Lock, Stock and Two Smoking Barrels), and Bruna Marquezine (Blue [ ]", "date_str": "2026-10-23T13:00:00+00:00", "hash": "415b3d8ad9def2e7", "title_fa": "بازیگران فصل 3 «آقایان» شامل اورلاندو بلوم، رابرت کارلایل و الیجا وود اما بدون مگان مارکل است. در اینجا چه کسی برنمی گردد", "summary_fa": "آقایان گای ریچی چند آقای (و خانم) دیگر را برای فصل سوم خود اضافه می کند که تولید آن در بریتانیا و مراکش آغاز شده است. اورلاندو بلوم (The Cut)، رابرت کارلایل (Line of Duty)، الیجا وود (Jellowjackets)، دکستر فلچر (Ritchi s Lock، Stock and Two Smoking Barrels)، و Bruna Marquezine (Blue [ ] The Middle East-Segh در فصل جدیدی که مارک سوئیت در مورد من گفت و گو نمی کند، به این مجموعه می پیوندند. که دیگر در کارت ها نیست. اخبار مربوط به آخرین مهلت را تماشا کنید مگان مارکل به دلیل ادعای پدرش در مورد کودک آزاری به شدت مضطرب است تصاویر اخبار SNL بریتانیا ویژگی های سرد باز حضور پرنس ویلیام هری: اوه نگاه کن، این زن از لباس است جیمز رهبری آقایان را برعهده دارد، ریچارد وین استونلی، بازیگرانی که در حال بازگشت هستند. وینی جونز، جاسمین بلک بورو، هری گودوینز و بنجامین کلمنتاین که همگی از فصل 1 در این سریال حضور داشتند و همچنین مایا جاما، که اولین حضور خود را در فصل 2 با ایفای نقش فیکس کننده پر زرق و برق و با ارتباط خوب، آیشا انجام داد. دو بازیگر اصلی که از ابتدا با The Gentlemen همراه بودند، برای فصل 3 بازنمی‌گردند، دانیل اینگز، بازیگر نقش لرد فردریک فردی هورنیمن، برادر بزرگتر معتاد به کوکائین ادی (جیمز) و جیانکارلو اسپوزیتو در نقش استنلی جانستون، میلیاردر آمریکایی و سلطان مواد مخدر. فردی آخرین بار در قسمت پایانی فصل 2 خونین و آسیب دیده دیده شد، در حالی که سر بریده انجیل جان دیکسون را در دست داشت، پس از اینکه ادی مجبور شد سر او را به عنوان مجازات کمک به دیکسون در انجام انفجار هواپیما که منجر به کشته شدن همسر ادی، بلا شد، جدا کند. در همین حال، استنلی به دلیل معاملات غیرقانونی خود دستگیر شد.", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۱۶:۳۰"}, {"source": "Hollywood Reporter", "title": "Kim Kardashian Read Every Page of Her Authorized Biography. Here’s What She Pushed Back On.", "link": "https://www.hollywoodreporter.com/lifestyle/arts/kim-kardashian-authorized-biography-author-interview-1236736290/", "summary": "'Citizen Kim' author Jonathan Van Meter on his five surreal years inside the Kardashians’ world: the sex tape, sibling rivalries, falling for your subject, Paris Hilton’s 17 cancellations and why Kanye isn't in the book.", "date_str": "2026-10-23T13:00:00+00:00", "hash": "f206b3549c6c60b3", "title_fa": "کیم کارداشیان هر صفحه از بیوگرافی مجاز او را بخوانید. در اینجا چیزی است که او به آن فشار آورد.", "summary_fa": "نویسنده «همشهری کیم»، جاناتان ون متر، درباره پنج سال سوررئال خود در دنیای کارداشیان ها: نوار جنسی، رقابت خواهر و برادر، علاقه به موضوع، 17 کنسلی پاریس هیلتون و اینکه چرا کانیه در کتاب نیست. جاناتان ون متر، نویسنده و ویراستار افسانه ای مجله، بیشتر دوران حرفه ای خود را صرف نزدیکی غیرمعمول با زنان مشهور کرده است. نمایه های صمیمی او در نیروگاه های فرهنگی مانند اپرا وینفری، جنیفر آنیستون، جودی فاستر، لیزا مینلی و لیدی گاگا، برای نام بردن از چند مورد، در صفحات Esquire، Vanity Fair، نیویورک و Vogue، در میان تعداد زیادی از دیگر آثار براق ظاهر شده است. من جاناتان را بیش از 30 سال است که می شناسم، از زمانی که هر دو در نشر مجله نیویورک در آخرین عصر طلایی آن یعنی اوایل دهه 1990 به بلوغ رسیده بودیم. او یک گزارشگر با استعداد، یک راکچر فوق‌العاده و همانطور که هر کسی که او را می‌شناسد گواهی می‌دهد، مردی است که تقریباً درباره همه چیز احساسات بسیار قوی دارد. داستان‌های مرتبط فراتر از احترام به کتاب به جای احترام: درون ساختن حس و حساسیت بیشتر تلویزیون. نویسنده جناح چهارم تلویزیون سکوت را می‌شکند، استر مک گرگور و امیلیو ساکرایا در نقش ویولت و زادن بازی می‌کنند، بنابراین وقتی در طول همه‌گیری به من گفت که قصد دارد چندین سال آینده را به نوشتن یک زندگی‌نامه اختصاص دهد. مشکوک کارداشیان ممکن است گسترده ترین زن نسل خود باشد. بین تلویزیون واقعیت، رسانه‌های اجتماعی و اشتهای بی‌پایان تبلوید، چه چیزی می‌تواند کشف شود؟ و چگونه نویسنده‌ای که در پیچیدگی‌های عاطفی تخصص دارد، زیر سطح مدیریت شده فردی که هویت عمومی میلیارد دلاری را حول فاش کردن خود ساخته است، قرار می‌گیرد و در عین حال تقریباً هیچ چیز را از دست نمی‌دهد؟", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۱۶:۳۰"}, {"source": "Variety", "title": "Jamie Lee Curtis, Téa Leoni and Tim Daly Lead NBC’s Refreshing and Witty Sitcom ‘Newlyweds’: TV Review", "link": "https://variety.com/2026/tv/reviews/newlyweds-review-nbc-jamie-lee-curtis-1236916529/", "summary": "Sitcoms aren’t what they used to be. Though a select few on network television, like “Abbott Elementary” and “Ghosts,” pay homage to comedies of the past while tapping into present-day culture, sitcoms today rarely feel truly universal. NBC’s “Newlyweds,” co-created by Jamie Lee Curtis and (the since-fired) Gail Lerner, is fun and refreshing, speaking to [ ]", "date_str": "2026-10-23T13:15:00+00:00", "hash": "aaef66f5e28078b5", "title_fa": "جیمی لی کرتیس، تئا لئونی و تیم دالی سریال طراوت و شوخ طبع ان‌بی‌سی «Newlyweds»: نقد تلویزیونی را رهبری h &#x201C;Yaga.&#x201D; The supernatural thriller premieres exclusively in the U.S. on AMC+ on Friday, Oct. 23, with its first two episodes available to stream immediately. New episodes will arrive every Friday, concluding with a two-episode season finale on Nov. 27. The [ ]", "date_str": "2026-10-23T13:00:00+00:00", "hash": "afe7556a1aacedc0", "title_fa": "بازگشت هادسون ویلیامز در فیلم هیجان‌انگیز ماوراء طبیعی «یاگا»: چگونه سریال جدید را آنلاین تماشا کنیم", "summary_fa": "هادسون ویلیامز در اولین اجرای تلویزیونی مهم خود این هفته با «یاگا» بازمی گردد. این مهیج فراطبیعی به طور انحصاری در ایالات متحده در + AMC در روز جمعه، 23 اکتبر، با دو قسمت اول آن برای پخش فوری در دسترس است. قسمت‌های جدید هر جمعه از راه می‌رسند و با پایان فصل دو قسمتی در 27 نوامبر به پایان می‌رسد. [ ] اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. بهترین راه برای پخش جریانی \"Yaga\" با افزودن +AMC به یک حساب Prime Video موجود است. این استریمر علاوه بر گزینه‌های افزودنی در پلتفرم‌هایی مانند Apple TV، Sling TV و DirecTV، از طریق سرویس اشتراک مستقل خود نیز در دسترس است. داستان‌های مرتبط Tom Skerritt، Picket Fences و Alien Star، Dies in 93 یکی دیگر از گزینه‌های Philo’s Bundle+ است که شامل AMC+ در کنار بیش از ۷۰ کانال تلویزیونی زنده و دسترسی به HBO Max Basic با تبلیغات و Discovery+ است. پرطرفدار در Variety این مجموعه هشت قسمتی با بازیگرانی که شامل نوآ رید ستاره «Schitt’s Creek»، کری آن ماس بازیگر «ماتریکس» و کلارک بکو نیز می‌شود، داستانی معاصر از افسانه اسلاوی چند صد ساله بابا یاگا دارد. «یاگا» که در شهر ساحلی خیالی ویتوک اتفاق می‌افتد، بازپرس خصوصی راپ (رید) را دنبال می‌کند که برای تحقیق درباره ناپدید شدن هنری وارد می‌شود. جستجوی او او را در مدار یک کارآگاه محلی محتاط، کارسون (باکو) و کاترین (ماس)، یک استاد دانشگاه کاریزماتیک قرار می دهد که ارتباطش با مرد گمشده در تحقیقات در حال آشکار شدن نقش اصلی دارد.", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما"], "datetime_fa": "۱ آبان • ۱۶:۳۰"}, {"source": "Vari     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
