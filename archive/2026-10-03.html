ار و بزرگ کردن دخترم به مدرسه برگشتم و هفت سال بعد فارغ التحصیل شدم. دخترم اکنون 21 سال دارد و من متوجه شدم که با هم به بزرگسالی رسیدیم. وقتی به عنوان یک مهاجر نسل اول بزرگ شدم، زود فهمیدم که پدر و مادرم چقدر برای ساختن آینده ای بهتر برای خانواده ما فداکاری کردند. آن‌ها همه چیزهایی را که می‌دانستند پشت سر گذاشتند تا فرزندانشان فرصت‌هایی داشته باشند که هرگز نداشتند. برای من، این به معنای تبدیل شدن به اولین کسی در خانواده ام بود که از کالج فارغ التحصیل شد. من از دبیرستان با بورسیه کامل کالج فارغ التحصیل شدم و برای مدتی به نظر می رسید که زندگی من دقیقاً همانطور که والدینم تصور کرده بودیم در جریان است: کالج، مدرک، شغل، ازدواج و فرزندان - رویای آمریکایی همانطور که ما آن را درک می کردیم. سپس، یک ماه پس از تولد 20 سالگی من، همه چیز تغییر کرد. فهمیدم باردارم من بورس تحصیلی ام را از دست دادم سه ماهه دوم من سخت بود و در نهایت مجبور شدم در اواسط ترم دانشگاه را ترک کنم که به معنای از دست دادن کامل بورسیه ام بود. ندانستن اینکه آیا یا چه زمانی می توانم برگردم، دلخراش بود. اما آنچه بیش از همه آزار دهنده بود، دیدن ناامیدی والدینم بود. هرگز فراموش نمی کنم به پدرم بگویم که باردار هستم و باید ترک تحصیل کنم. ما ماه ها صحبت نکردیم. او به من یادآوری کرد که چقدر ناآماده بودم و به نظر می رسید که آینده ای که برای ساختن آن سخت تلاش"}, {"source": "Business Insider", "title": "The US Navy needs more ships. The workers building them are winning bigger paychecks.", "link": "https://www.businessinsider.com/us-shipbuilding-workers-win-better-paychecks-navy-needs-more-ships-2026-10", "summary": "I think overall, it ll bring the industry back to where it needs to be, one union official said of recent contract wins. US Navy photo by Mass Communication Specialist 2nd Class Kenneth Melseth Shipbuilding workers in California and Maine won big union contracts for more pay and better benefits. Union members said the gains would help attract and keep more skilled workers. Shipbuilders need experienced workers to meet the Navy's needs for more ships. The US Navy needs more from the American shipbuilding industry, which depends on skilled workers. Recent contract wins by shipbuilding unions in California and Maine are delivering better pay, better benefits, and more structured approaches to the introduction of new technologies into shipyards. Shipbuilders and union leaders told Business Insider the improvements would help attract and retain skilled workers as the Navy and industry race to rebuild and revive America's shipbuilding capacity. \"I think overall, it'll bring the industry back to where it needs to be,\" International Association of Machinists and Aerospace Workers Eastern Territory Coordinator George Edwards said, adding that the new contracts between the workers' unions and shipbuilding companies have \"set the trend for where you're going to see things going in the next couple years in shipbuilding.\" Last week, IAM union members at General Dynamics NASSCO in San Diego, which specializes in building auxiliary vessels for the Navy, ratified a three-year agreement that delivers wage increases , improvements to retirement benefits, floating time off, and worker protections. Over 800 workers will receive a 10% wage increase in the first year, followed by 5% in the second and 4% in the third. More money helps workers grappling with the rising cost of living in San Diego, which is nearly 50% higher than the national average. \"It's also helping the company minimize the turnover,\" IAM Western Territory General Vice President Robert Martinez explained, by reducing \"losses of skilled workers to other shipyards because they weren't paying as competitively.\" The successful negotiation came on the heels of a similar contract win in Bath, Maine, last month. Over 4,500 workers at Bath Iron Works ratified a contract giving them a 17% wage increase in the first year and a 4% bump in the following four years, as well as stronger retirement benefits. Hiring and keeping skilled workers Skilled trade workers have left shipbuilding for competing industries. Staff photo ", "date_str": "2026-10-03T11:17:01+00:00", "hash": "97d2b1d93869b0ac", "title_fa": "نیروی دریایی ایالات متحده به کشتی های بیشتری نیاز دارد. کارگرانی که آن‌ها را می‌سازند، حقوق بیشتری دریافت می‌کنند.", "summary_fa": "یکی از مقامات اتحادیه درباره برنده شدن قراردادهای اخیر گفت، من فکر می کنم در مجموع، این صنعت را به جایی که باید باشد بازگرداند. عکس نیروی دریایی ایالات متحده توسط متخصص ارتباطات جمعی کلاس 2 کنت ملسث کارگران کشتی سازی در کالیفرنیا و مین قراردادهای اتحادیه بزرگ را برای دستمزد بیشتر و مزایای بهتر برنده شدند. اعضای اتحادیه گفتند که این دستاوردها به جذب و حفظ کارگران ماهر بیشتر کمک می کند. کشتی سازان به کارگران با تجربه نیاز دارند تا نیازهای نیروی دریایی را برای کشتی های بیشتر برآورده کنند. نیروی دریایی ایالات متحده نیاز بیشتری به صنعت کشتی سازی آمریکا دارد که به کارگران ماهر بستگی دارد. برنده قراردادهای اخیر توسط اتحادیه های کشتی سازی در کالیفرنیا و مین، دستمزد بهتر، مزایای بهتر و رویکردهای ساختارمندتری را برای معرفی فن آوری های جدید در کارخانه های کشتی سازی ارائه می دهد. کشتی‌سازان و رهبران اتحادیه‌ها به Business Insider گفتند که این پیشرفت‌ها به جذب و حفظ کارگران ماهر کمک می‌کند، زیرا نیروی دریایی و صنعت در رقابت برای بازسازی و احیای ظرفیت کشتی‌سازی آمریکا هستند. جورج ادواردز، هماهنگ‌کننده منطقه شرقی انجمن بین‌المللی ماشین‌کارها و کارگران هوافضا، گفت: «به‌طور کلی، فکر می‌کنم، این صنعت را به جایی که باید باشد، برمی‌گرداند» و افزود که قراردادهای جدید بین اتحادیه‌های کارگری و شرکت‌های کشتی‌سازی «روند را برای جایی که قرار است در چند سال آینده شاهد پیشرفت‌ها در کشتی‌سازی باشید، تعیین کرده‌اند». هفته گذشته، اعضای اتحادیه IAM در جنرال داینامیکس ناسکو در سن دیگو، که در ساخت کشتی های کمکی برای نیروی دریایی تخصص دارد، توافقنامه ای سه ساله را تصویب کردند که افزایش دستمزد، بهبود مزایای بازنشستگی، مرخصی شناور و حمایت از کارگران را به همراه دارد. بیش از 800 کارگر در سال اول 10 درصد افزایش دستمزد دریافت خواهند کرد و پس از آن در سال دوم 5"}, {"source": "Business Insider", "title": "I used a fake Craigslist ad to test my business idea. The reaction gave me the proof I needed.", "link": "https://www.businessinsider.com/how-small-business-founder-tested-new-business-idea-2026-10", "summary": "Founder and CEO Alison Donnally says three family tragedies inspired her unique business idea. Photo courtesy of Alison Donnally Alison Donnally founded JoeyCo to connect aging adults and college students. She tested the idea by listing her parents' home on Craigslist. The results inspired a business blending student housing with elder care. This as-told-to essay is based on a conversation with Alison Donnally , the founder and CEO of JoeyCo . It has been edited for length and clarity. Prior to starting JoeyCo , I worked in strategy and business development within healthcare. That started me down a path of ideating better solutions for elderly patients. But personal tragedies within my own family are what really confirmed for me that a business like JoeyCo was needed. Many older people want to retain their independence. I've had a lot of family history with this pattern of aging independently, living alone, and everything working out fine, until suddenly it doesn't. I've seen firsthand the safety of that situation changing very quickly. So, I started JoeyCo in 2024 and created a new category of business, one that blends housing and healthcare . Three of my family members experienced mental and physical health declines while living alone My husband's grandmother was isolated in a nursing home during COVID. Before this, she was social and deeply engaged in her community and civic life. Her mental and physical health declined rapidly while living alone. She felt isolated and lonely . This all really changed her health trajectory. She experienced several falls and didn't seem to have enough help. Then there was my uncle, a lifelong trucker. His dream of owning a rural plot of land in Tennessee eventually turned dangerous when he was found disoriented, driving down the wrong side of the road. Living that rural dream made it harder for our family to understand how his progression with what turned out to be dementia was really evolving. After that, my cousins moved him closer to where they were living in upstate New York, where he received memory care until he passed. Finally, my aunt, who once happily lived alone in a retirement community, fell in her shower, and there was no one there to help her for several hours. With all these elderly family members living alone and independently, their safety became an issue, and not a good situation for them. JoeyCo emerged as an answer to a question We wondered how we could keep older people independent and in their own h", "date_str": "2026-10-03T11:12:01+00:00", "hash": "6f79d94e6134fced", "title_fa": "من از یک تبلیغ جعلی Craigslist برای آزمایش ایده تجاری خود استفاده کردم. واکنش به من مدرکی را داد که نیاز داشتم.", "summary_fa": "آلیسون دانالی، بنیانگذار و مدیر عامل، می گوید که سه تراژدی خانوادگی الهام بخش ایده تجاری منحصر به فرد او بوده است. عکس با اجازه آلیسون دانالی آلیسون دانالی جوی کو را برای ارتباط بین بزرگسالان سالخورده و دانشجویان دانشگاه تاسیس کرد. او این ایده را با فهرست کردن خانه والدینش در Craigslist آزمایش کرد. نتایج الهام بخش کسب و کار ترکیب مسکن دانشجویی با مراقبت از سالمندان بود. این مقاله همانطور که گفته شد بر اساس گفتگو با آلیسون دانالی، بنیانگذار و مدیر عامل JoeyCo است. برای طول و وضوح ویرایش شده است. قبل از راه اندازی JoeyCo، من در توسعه استراتژی و تجارت در بخش مراقبت های بهداشتی کار می کردم. این من را در مسیر ایده پردازی راه حل های بهتر برای بیماران مسن آغاز کرد. اما تراژدی‌های شخصی در خانواده‌ام همان چیزی است که واقعاً برای من تأیید کرد که به کسب‌وکاری مانند JoeyCo نیاز است. بسیاری از افراد مسن می خواهند استقلال خود را حفظ کنند. من سابقه خانوادگی زیادی با این الگوی پیری مستقل، تنها زندگی کردن، و همه چیز خوب پیش می‌رفتم، تا اینکه ناگهان اینطور نشد. من از نزدیک دیدم که امنیت آن وضعیت خیلی سریع تغییر می کند. بنابراین، من JoeyCo را در سال 2024 راه اندازی کردم و دسته جدیدی از کسب و کار را ایجاد کردم، دسته ای که مسکن و مراقبت های بهداشتی را در هم می آمیزد. سه نفر از اعضای خانواده من در حین زندگی تنها با کاهش سلامت روانی و جسمی مواجه شدند. قبل از این، او اجتماعی بود و عمیقاً درگیر جامعه و زندگی مدنی خود بود. سلامت روحی و جسمی او در حالی که تنها زندگی می کرد به سرعت کاهش یافت. او احساس انزوا و تنهایی می کرد. همه اینها واقعاً مسیر سلامتی او را تغییر داد. او چندین بار سقوط را"}, {"source": "Business Insider", "title": "I worked 7 days a week while my husband couldn't work. Now I'm learning to slow down.", "link": "https://www.businessinsider.com/worked-every-day-job-side-hustle-breadwinner-2026-10", "summary": "The author used to work seven days a week. Now, she has more free time. Courtesy of Maria Polansky For a while, I had a job and a side hustle, and was working seven days a week. My husband couldn't work during that time, and I felt pressure to stay on top of finances. Now, he has a corporate role, and I'm giving myself permission to work less. Eight years ago, I worked a visual merchandising job with a 6-2 schedule. I also lived in Vancouver , one of the most expensive cities in North America. With mostly free afternoons and a love of writing, I started looking into freelancing to boost my income. It was just a fun side hustle at first. The gigs weren't too time-consuming, and I took a little break after moving to the UK for love in 2019. But after getting settled and finding a new full-time merchandising job, I decided to give it another go. The pandemic gave me a lot of time to work on new projects and build my portfolio, as I was furloughed from my full-time job during the thick of lockdown between 2020 and 2021. Then restrictions started to lift, but my workload kept growing . I went back to my full-time job, which had a more conventional 8-5 schedule. By then, I had regular freelance clients, so I'd use evenings and weekends to work on projects until working six or seven days a week became normal for me. I eventually switched to a part-time role in 2022 to give myself more time for freelancing, but the long workweek stuck. An international move made working seven days a necessity, not an option My husband and I decided to move back to Canada in 2023, which is when the pressure for me to work more became real. We chose an immigration route that meant my husband wouldn't be able to work for at least a year while his visa was being processed, so I was the sole provider. I quickly found another part-time job after moving so we could maintain a certain level of income without dipping into our savings. By then, 7-day workweeks were standard for me. I'd work three or four days at my part-time job, and spend the rest of the week freelancing. Our plan helped us stay on top of our finances, but I was starting to feel depleted. A big reason we moved back to Canada was to spend more time in nature and enjoy a slower pace of life. We chose to move to the smaller city of Victoria rather than my hometown of Vancouver, where we have easy access to beaches, parks, and hiking trails. So when my husband finally got his visa in 2024 and secured a full-time role after a s", "date_str": "2026-10-03T11:11:01+00:00", "hash": "635bbe7ba2946344", "title_fa": "من 7 روز در هفته کار می کردم در حالی که شوهرم نمی توانست کار کند. الان دارم یاد میگیرم سرعتمو کم کنم", "summary_fa": "نویسنده هفت روز در هفته کار می کرد. حالا وقت آزاد بیشتری دارد. با حسن نیت ماریا پولانسکی برای مدتی، کار و شلوغی داشتم و هفت روز در هفته کار می کردم. شوهرم در آن مدت نمی‌توانست کار کند، و من برای ماندن در امور مالی تحت فشار بودم. حالا او یک نقش شرکتی دارد و من به خودم اجازه می دهم کمتر کار کنم. هشت سال پیش، من یک کار تجاری بصری با برنامه 6-2 کار کردم. من همچنین در ونکوور، یکی از گران ترین شهرهای آمریکای شمالی زندگی می کردم. با بعدازظهرهای بیشتر آزاد و عشق به نوشتن، شروع به جستجوی شغل آزاد برای افزایش درآمدم کردم. در ابتدا فقط یک سرگرمی جانبی سرگرم کننده بود. کنسرت ها خیلی وقت گیر نبودند، و من بعد از اینکه در سال 2019 برای عشق به انگلستان نقل مکان کردم، کمی استراحت کردم. اما پس از تسویه حساب و یافتن یک شغل تمام وقت در تجارت، تصمیم گرفتم دوباره آن را انجام دهم. همه‌گیری به من زمان زیادی داد تا روی پروژه‌های جدید کار کنم و سبد خود را بسازم، زیرا در طول قرنطینه بین سال‌های 2020 تا 2021 از کار تمام وقت خود اخراج شدم. سپس محدودیت‌ها شروع به برداشتن کردند، اما حجم کاری من همچنان در حال افزایش بود. به کار تمام وقتم برگشتم، که یک برنامه معمولی 8-5 داشت. در آن زمان، من مشتریان آزاد دائمی داشتم، بنابراین از عصرها و آخر هفته ها برای کار روی پروژه ها استفاده می کردم تا اینکه شش یا هفت روز در هفته کار برایم عادی شد. در نهایت در سال 2022 به یک نقش نیمه وقت تغییر دادم تا به خودم فرصت بیشتری برای مشاغل آزاد بدهم، اما هفته کاری طولانی ماند. یک جابه‌جایی بین‌المللی کار هفت روزه را به یک ضرورت تبدیل کرد، نه یک گزینه من و شوهرم"}, {"source": "Business Insider", "title": "Ramp's Broadway musical was the worst show I've ever seen. I'm still glad it exists.", "link": "https://www.businessinsider.com/ramp-broadway-musical-bill-pay-review-2026-10", "summary": "The Bill Pay playbill included jokes like Guys and Bills and The Phantom of the Bill. Henry Chandonnet/Business Insider I went to Ramp's Broadway musical, \"Bill Pay.\" The show was confusing, sloppy, and felt like an hour-long advertisement. But I'm happy Ramp is investing in theatre. They should make a better show! The giant, shimmering credit card was the first sign. The fintech company Ramp , in a somewhat baffling move, staged a musical. They called it \"Bill Pay\" and took over Broadway's Broadhurst Theatre. From the back of the mezzanine, I watched the hourlong, witless advertisement. Let me clarify: it's not that Ramp pretended this was high art. There were ample jokes about how stupid this show was. The audience of techies seemed to eat up the \"Hamilton\" parody — instead of \"I am not throwing away my shot,\" it was \"I did not throw away my receipt\" — and the tap-dancing hobbits. Ramp projected its logo on the curtain of the Broadhurst Theatre. Henry Chandonnet/Business Insider But I couldn't stop wondering: what the hell am I doing here? It felt like a great corporate bonding exercise for a company in IPO prep mode . And yet, they opened it to the public and invited a cabal of theatre influencers. Ramp's musical was good in theory. Spend big on employee perks! Better yet, pay theatre performers! The execution, though, was muddled and boring. Ramp's self-love fest of a musical For a simple, promotional musical, the plot of \"Bill Pay\" was somewhat confusing. Jessica Vosk played Lisa Blupey, a beleaguered Etsy seller who couldn't handle an influx of orders. She was then sucked into a YouTube advertisement and had to navigate several types of bills to escape. It's not the bills you're thinking of. There was an extended Bill-bo Baggins section, hence the tap-dancing hobbits. There was a candy-coated Billy Wonka section. (Were there not enough actual \"Bills\" to keep names unaltered?) And then there was Billy Zane , the sultry \"Titanic\" alum who came out for one steamy number. Ramp s musical referenced Billy Mays, Willy Wonka, and Schoolhouse Rock. Henry Chandonnet/Business Insider The musical's resolution was that Blupey could fix her life problems with — you guessed it — Ramp. Billy Porter was the marquee star and the subject of Ramp's advertisements. And yet, he was barely in the show. Porter opened the show, then later appeared in some one-off moments and had a brief chat with co-CEO Eric Glyman . One wondered whether he was being paid by the minute. Much", "date_str": "2026-10-03T10:00:01+00:00", "hash": "d49985a6dcc24c19", "title_fa": "موزیکال Ramp's Broadway بدترین نمایشی بود که تا به حال دیده بودم. من هنوز خوشحالم که وجود دارد.", "summary_fa": "بیل پرداخت شامل جوک هایی مانند Guys and Bills و The Phantom of the Bill بود. هنری Chandonet/Business Insider من به موزیکال Ramp's Broadway، \"Bill Pay\" رفتم. نمایش گیج کننده، شلخته و شبیه تبلیغات یک ساعته بود. اما خوشحالم که رامپ روی تئاتر سرمایه گذاری می کند. آنها باید نمایش بهتری بسازند! کارت اعتباری غول پیکر و درخشان اولین نشانه بود. شرکت فین‌تک Ramp، در اقدامی گیج‌کننده، یک موزیکال روی صحنه برد. آنها آن را \"بیل پرداخت\" نامیدند و تئاتر برادورست برادوی را تصاحب کردند. از پشت نیم طبقه، آگهی یک ساعته و بیهوده را تماشا کردم. اجازه دهید توضیح دهم: اینطور نیست که رامپ وانمود کند که این هنر عالی است. شوخی های زیادی در مورد احمقانه بودن این نمایش وجود داشت. به نظر می‌رسید که مخاطبان اهل فن، تقلید «همیلتون» را خوردند - به‌جای «شاتم را دور نمی‌اندازم»، «رسیدم را دور نینداختم» - و هابیت‌های رقصنده شیر. Ramp لوگوی خود را بر روی پرده تئاتر Broadhurst نشان داد. هنری Chandonet/Business Insider اما من نمی‌توانستم از این فکر نکنم: لعنتی من اینجا چه کار می‌کنم؟ این یک تمرین عالی برای پیوند شرکتی برای یک شرکت در حالت آماده سازی IPO به نظر می رسید. و با این حال، آنها آن را به روی عموم باز کردند و گروهی از تأثیرگذاران تئاتر را دعوت کردند. موزیکال رمپ از نظر تئوری خوب بود. خرج هنگفتی برای مزایای کارمندان کنید! بهتر از این، به بازیگران تئاتر پول بدهید! با این حال، اعدام درهم و کسل کننده بود. جشن عشق به خود رامپ از یک موزیکال برای یک موزیکال ساده و تبلیغاتی، طرح \"بیل پرداخت\" تا حدودی گیج کننده بود. جسیکا ووسک نقش لیزا بلوپی، فروشنده محصور شده Etsy را بازی کرد که نمی‌توانست از پس هجوم سفارش‌ها برآید. او سپس در تبلیغات یوتیوب جذب شد و مجبور شد چندین نوع صورتحساب را"}, {"source": "Business Insider", "title": "Consulting firms say that as AI gets cheaper, power demand could keep climbing", "link": "https://www.businessinsider.com/cheaper-ai-models-may-strain-power-grid-consulting-firms-say-2026-10", "summary": "AI costs are falling, and the pressure on demand is rising. BackyardProduction/Getty Images AI costs are falling as models and tokens get cheaper , according to reports from BCG and McKinsey. Lowering costs may increase pressure on the electric grid as companies use AI on more tasks. BCG found that companies that manage token spend efficiently see the greatest returns with AI. AI is getting cheaper to use, but as companies use it more, we're bound to see more pressure on the electric grid . In two new reports published this week, McKinsey and Boston Consulting Group said that as companies move beyond experimenting with chatbots and start using AI across more parts of their businesses, cheaper models and falling token prices could make it easier to justify more frequent, higher-volume AI use — and that could pose a problem for the grid. Companies often pay AI providers based on tokens, the small units of text that models read and generate. In the short term, McKinsey said that cheaper tokens could make AI more widely used and raise electricity demand, while companies push to make models, chips, and data centers more efficient. That matters because data centers are already using more power. McKinsey called data-center electricity demand “the fastest-growing load segment in OECD power markets.” In several markets, it said, data centers are already the biggest reason electricity demand is expected to grow through 2030. The firm expects global data-center electricity demand to grow by 24% a year through 2030, then slow to 5% a year between 2030 and 2040. Even as companies scale their use of AI, BCG found that the companies getting furthest with the technology are not simply letting token spending rise by default. Three-quarters of its \"future-built\" companies — the most AI-mature group in its survey of 1,300 C-Suite and senior executives across 20-plus sectors — had made an explicit call on token spending and managed it toward a specific return. Half of that group actively encouraged employees to use paid AI tools to maximize adoption, compared with 25% of those companies lagging with using the technology, while another 22% of future-built companies set limits or controls on usage to manage costs. There is a tradeoff. McKinsey said that as companies make each AI task cheaper and less power-intensive, AI will inevitably become useful in more places, and total power demand will rise. McKinsey said the broader picture for data-center growth after 2030 remains unce", "date_str": "2026-10-03T09:59:01+00:00", "hash": "9daf0a67f19e488e", "title_fa": "شرکت‌های مشاوره می‌گویند که با ارزان‌تر شدن هوش مصنوعی، تقاضای برق می‌تواند همچنان افزایش یابد", "summary_fa": "هزینه های هوش مصنوعی در حال کاهش است و فشار بر تقاضا در حال افزایش است. براساس گزارش‌های BCG و McKinsey، هزینه‌های هوش مصنوعی BackyardProduction/Getty Images با ارزان‌تر شدن مدل‌ها و توکن‌ها کاهش می‌یابد. کاهش هزینه ها ممکن است فشار بر شبکه برق را افزایش دهد زیرا شرکت ها از هوش مصنوعی برای کارهای بیشتری استفاده می کنند. BCG دریافت که شرکت‌هایی که توکن‌ها را به طور کارآمد هزینه می‌کنند بیشترین بازده را با هوش مصنوعی می‌بینند. استفاده از هوش مصنوعی ارزان‌تر می‌شود، اما همانطور که شرکت‌ها بیشتر از آن استفاده می‌کنند، فشار بیشتری بر شبکه برق خواهیم دید. در دو گزارش جدید منتشر شده در این هفته، گروه مشاوره مک‌کینزی و بوستون گفتند که با فراتر رفتن از آزمایش با ربات‌های چت و استفاده از هوش مصنوعی در بخش‌های بیشتری از کسب‌وکارشان، مدل‌های ارزان‌تر و کاهش قیمت توکن‌ها می‌تواند توجیه استفاده مکرر و با حجم بالاتر از هوش مصنوعی را آسان‌تر کند – و این می‌تواند مشکلی برای شبکه ایجاد کند. شرکت ها اغلب بر اساس توکن ها، واحدهای کوچک متنی که مدل ها خوانده و تولید می کنند، به ارائه دهندگان هوش مصنوعی پرداخت می کنند. در کوتاه مدت، مک‌کینزی گفت که توکن‌های ارزان‌تر می‌توانند هوش مصنوعی را به طور گسترده‌تر مورد استفاده قرار دهند و تقاضای برق را افزایش دهند، در حالی که شرکت‌ها برای کارآمدتر کردن مدل‌ها، تراشه‌ها و مراکز داده تلاش می‌کنند. این مهم است زیرا مراکز داده در حال حاضر از انرژی بیشتری استفاده می کنند. مک‌کینزی تقاضای برق مرکز داده را «سریع‌ترین رشد بخش بار در بازارهای برق OECD» نامید. در چندین بازار، مراکز داده بزرگترین دلیلی هستند که انتظار می رود تقاضای برق تا سال 2030 رشد کند. این شرکت انتظار دارد تقاضای جهانی برق مرکز داده تا سال 2030 سالانه 24 درصد رشد کند، سپس بین سال‌های 2030 تا 2040 به"}, {"source": "Business Insider", "title": "JPMorgan lays out the investing playbook for 3 midterm-election scenarios", "link": "https://www.businessinsider.com/midterm-elections-investing-playbook-blue-wave-ai-xom-spcx-jpmorgan-2026-10", "summary": "Cheng Xin/Getty Images Markets tend to hate the uncertainty that comes with a general election. Partisan gridlock would likely be the best case scenario for Wall Street, JPMorgan says. The impact to the stock market will be \"more nuanced\" than in previous elections. Elections tend to bring something that the market hates: uncertainty. In just over a month, Americans will vote in the midterms, deciding which party gets to control Congress for the rest of Donald Trump's term. Given the policy roller coaster that's already been a defining characteristic of Trump's second stint in office, Wall Street is laser focused on the outcome and its potential impacts. Historically, midterms often bring gridlock, with each party controlling one of the chambers of Congress. This tends to be an outcome Wall Street likes to see, leading to a continuity trade as investors pile into what's already been working. And while JPMorgan sees that as a possibility, its strategists are eyeing two other outcomes, both of which have major implications for markets. \"In the 2024 presidential election, it was easier to map the equity impact of potential policy priorities across sectors, industries, themes and factors,\" wrote strategist Dubravko Lakos-Bujas in a note to investors. \"However, the equity impact for the upcoming midterms across election outcomes scenarios will likely be more nuanced and favor stock picking.\" Here's the election playbook for three election results Lakos-Bujas and his team are eyeing. Scenario 1: Gridlock How to trade it A continuation of the status quo tends to be a benign outcome for investors. The possibility of a divided house or senate would make it extremely difficult for the White House to pass most legislation. That's good news for anyone worried about excessive government spending, stricter regulation, or sharp tax increases \"Congressional gridlock has been associated with positive S P 500 returns since 1950, whether on an election date basis (+21% gridlock vs. +18% Single Party Control over 2-year Congressional term) or start date of the new Congress (+25% Gridlock vs. +18% Single Party Control,\" Lakos-Bujas noted. His team sees the most benefit for defense contractors, healthcare companies, and some tech stocks that aren't heavily exposed to the AI data center buildout, which may be stalled if Democrats take either branch. Some of the notable names in the bank's gridlock basket include: Exxon Mobil Home Depot Ford Alphabet SpaceX Scenario 2: Blue Wave ", "date_str": "2026-10-03T09:50:02+00:00", "hash": "50d87682bf5c4451", "title_fa": "جی پی مورگان کتاب بازی سرمایه گذاری را برای 3 سناریو انتخابات میان دوره ای ارائه می کند", "summary_fa": "Cheng Xin/Getty Images بازارها تمایل دارند از عدم اطمینان ناشی از انتخابات عمومی متنفر باشند. جی پی مورگان می‌گوید که بن‌بست حزبی احتمالا بهترین سناریو برای وال استریت خواهد بود. تاثیر آن بر بازار سهام نسبت به انتخابات قبلی \"مشخص تر\" خواهد بود. انتخابات چیزی را به همراه دارد که بازار از آن متنفر است: عدم اطمینان. تنها یک ماه دیگر، آمریکایی‌ها در میان دوره‌ای رای خواهند داد و تصمیم می‌گیرند که کدام حزب برای بقیه دوره ریاست جمهوری دونالد ترامپ کنترل کنگره را در دست بگیرد. با توجه به سیاستی که قبلاً یکی از مشخصه های تعیین کننده دوره دوم ریاست جمهوری ترامپ بوده است، وال استریت بر روی نتیجه و تأثیرات احتمالی آن تمرکز لیزری دارد. از نظر تاریخی، انتخابات میان دوره ای اغلب با بن بست مواجه می شود و هر حزب یکی از اتاق های کنگره را کنترل می کند. این معمولاً نتیجه ای است که وال استریت دوست دارد ببیند و منجر به تداوم تجارت می شود زیرا سرمایه گذاران در آنچه قبلاً کار می کردند انباشته می شوند. و در حالی که جی پی مورگان این را به عنوان یک احتمال می بیند، استراتژیست هایش به دو نتیجه دیگر چشم دوخته اند که هر دو پیامدهای عمده ای برای بازارها دارند. دوبراوکو لاکوس-بوجاس، استراتژیست در یادداشتی خطاب به سرمایه گذاران نوشت: «در انتخابات ریاست جمهوری 2024، ترسیم تأثیر برابری اولویت های بالقوه سیاست در بخش ها، صنایع، موضوعات و عوامل آسان تر بود. \"با این حال، تاثیر برابری برای میان دوره های آینده در سناریوهای نتایج انتخابات احتمالاً ظریف تر خواهد بود و به نفع انتخاب سهام خواهد بود.\" در اینجا کتاب بازی انتخاباتی برای سه نتیجه انتخاباتی است که لاکوس-بوخاس و تیمش به آن توجه دارند. سناریو 1: بن بست چگونه آن را معامله کنیم ادامه وضعیت موجود برای سرمایه گذاران یک نتیجه"}, {"source": "Business Insider", "title": "2 AI habits that can weaken your critical thinking, according to a BCG exec", "link": "https://www.businessinsider.com/bcg-exec-shares-ai-habits-weaken-critical-thinking-2026-10", "summary": "David Martin cautioned about over-reliance on AI. Boston Consulting Group BCG exec David Martin said there's an \"existential risk\" of people losing skills because of AI use. Half of the executives surveyed in a June BCG study reported seeing deskilling. Martin said that being unable to answer follow-up questions about material is a common indicator of deskilling. With great power comes great responsibility — and the responsibility not to deskill may fall squarely on your shoulders. While your employer likely wants you using AI , they might not be preparing you for the atrophy of cognitive skills that can come with heavy use of the tech. \"There is existential risk of people deskilling themselves to the point of being unviable in the market,\" David Martin, Boston Consulting Group's global lead of people and organization, told Business Insider. Your boss may already be taking notice. A June BCG study of over 70 global C-suite leaders revealed that half see critical skills actively eroding within their organizations. Unfortunately, the skills fading fastest are the ones leaders say matter most to long-term performance, the report said. That includes problem framing, judgment, creative thinking , and solution evaluation. Despite concerns, the research suggests most organizations aren't stepping in to help. BCG found that only one in 10 companies has a concrete plan to address deskilling, while a third haven't discussed it at all. That leaves it up to employees to proactively protect their own skillsets. Martin, who also serves as managing director and senior partner at BCG, shared two habits that could weaken critical thinking — and what you should do to address this decay: 1. Relying on the AI summary If you're getting stumped by basic follow-up questions, you may be relying too much on AI. Martin said it's obvious when someone asked for an AI summary of a slide deck they were supposed to read, because they can't answer any follow-up questions or get to that next level of detail about the material. \"It's like they only know what the AI told them,\" Martin said. He said the strongest workers will still apply critical thinking to ask themselves follow-up questions, even if AI gives them an initial summary. 2. Using AI for core tasks In a world where judgement and taste are top of mind for leaders, you may not want to outsource tasks that require strategy and expertise. Martin said that he can spot erosion among employees who are using AI not just for menial tasks", "date_str": "2026-10-03T09:50:01+00:00", "hash": "6199d56ea71dbf66", "title_fa": "به گفته یکی از مدیران BCG، 2 عادت هوش مصنوعی که می تواند تفکر انتقادی شما را تضعیف کند", "summary_fa": "دیوید مارتین در مورد اتکای بیش از حد به هوش مصنوعی هشدار داد. دیوید مارتین، مدیر گروه مشاور BCG بوستون، گفت که این خطر وجود دارد که افراد مهارت های خود را به دلیل استفاده از هوش مصنوعی از دست بدهند. نیمی از مدیرانی که در مطالعه ژوئن BCG مورد بررسی قرار گرفتند، گزارش دادند که مهارت زدایی را دیده اند. مارتین گفت که ناتوانی در پاسخ به سؤالات بعدی در مورد مطالب، یک شاخص رایج مهارت زدایی است. با قدرت زیاد، مسئولیت بزرگی به وجود می آید - و مسئولیت عدم مهارت ممکن است کاملاً بر دوش شما بیفتد. در حالی که کارفرمای شما احتمالاً از شما می‌خواهد که از هوش مصنوعی استفاده کنید، اما ممکن است شما را برای آتروفی مهارت‌های شناختی که می‌تواند با استفاده زیاد از این فناوری همراه باشد، آماده نکند. دیوید مارتین، رهبر جهانی افراد و سازمان‌های گروه مشاوره بوستون، به Business Insider گفت: «خطر وجودی وجود دارد که افراد مهارت‌زدایی از خود را تا حدی که در بازار غیرقابل تحمل شوند، وجود دارد. ممکن است رئیس شما قبلاً متوجه شده باشد. مطالعه ژوئن BCG بر روی بیش از 70 رهبر جهانی C-suite نشان داد که نیمی از آنها می بینند که مهارت های حیاتی به طور فعال در سازمانشان فرسایش می یابد. در این گزارش آمده است که متأسفانه، مهارت‌هایی که سریع‌تر از بین می‌روند، مهارت‌هایی هستند که رهبران می‌گویند برای عملکرد بلندمدت بیشترین اهمیت را دارند. این شامل چارچوب بندی مسئله، قضاوت، تفکر خلاق و ارزیابی راه حل است. علیرغم نگرانی ها، این تحقیق نشان می دهد که بیشتر سازمان ها برای کمک وارد عمل نمی شوند. BCG دریافت که از هر 10 شرکت فقط یک شرکت برنامه مشخصی برای رسیدگی به مهارت زدایی دارد، در حالی که یک سوم آن را اصلاً مورد بحث قرار نداده اند. این امر به کارمندان"}, {"source": "Business Insider", "title": "AI slop is coming for Hollywood. Some of it is already better.", "link": "https://www.businessinsider.com/ai-video-tools-slopcannon-new-competition-hollywood-2026-10", "summary": "SNL s Michael Che and Jane Wickline as Dario Amodei during Weekend Update : Will Heath/NBC via Getty Images A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . NBC's Saturday Night Live aired a sketch mocking Anthropic CEO Dario Amodei last weekend. A day earlier, an AI-generated music video took a similar swipe, featuring a fake Amodei singing \" Hit the Breaks Except for Me .\" I laughed harder at the AI version. Created with an AI tool called Slopcannon, it needed little more than an audio file, a few images, and an idea. Compare that with the SNL sketch, which took a team of highly paid professional writers, actors, and a major TV studio. This is a glimpse of where entertainment may be headed. And as I've argued before , it's both an opportunity and a threat for Hollywood. AI can help studios make films and TV shows faster and cheaper. But it also lets individuals produce videos more easily, creating more competition for viewers' attention. (I've watched the Slopcannon video more than the SNL skit, for instance). Yes, plenty of AI-generated videos are still terrible. Then again, so is a surprising amount of human-made content on social media — and even on Netflix. The quality gap is closing. Something sensible US film producer Jeffrey Katzenberg ETIENNE LAURENT / AFP via Getty Images DreamWorks cofounder Jeffrey Katzenberg thinks Hollywood should embrace AI, the way it embraced other new technology in the past. \"As the barriers and the costs come down, more films will get made, not fewer. Studios will get to take more risks. There will be more seats at the table, and very soon entirely new forms of storytelling,\" he wrote on X . \"Every time storytelling has met a genuine technological shift, from synchronized sound to color to computer animation, it has redefined the boundaries of the medium and grown larger in the process.\" After all the extreme AI warnings of the past few weeks, it's a relief to read something sensible. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-10-03T09:30:02+00:00", "hash": "8540fa8e785b6b8b", "title_fa": "شیب هوش مصنوعی برای هالیوود در راه است. برخی از آن در حال حاضر بهتر است.", "summary_fa": "مایکل چه و جین ویکلین از SNL در نقش داریو آمودی در طول به‌روزرسانی آخر هفته: ویل هیث/ان‌بی‌سی از طریق گتی ایماژ نسخه‌ای از این داستان در اصل در خبرنامه AI Insider ظاهر شد. برای خبرنامه هفتگی AI Insider Business Insider در اینجا ثبت نام کنید. شنبه شب زنده ان بی سی طرحی را پخش کرد که در آن داریو آمودی، مدیر عامل آنتروپیک، آخر هفته گذشته به تمسخر گرفته شد. یک روز قبل، موزیک ویدیویی که توسط هوش مصنوعی تولید شده بود، تصویر مشابهی را منتشر کرد که در آن آمودی جعلی آهنگ «Hit the Breaks Except for Me» را می خواند. به نسخه هوش مصنوعی بیشتر خندیدم. این ابزار که با یک ابزار هوش مصنوعی به نام Slopcannon ساخته شده بود، به چیزی بیشتر از یک فایل صوتی، چند تصویر و یک ایده نیاز داشت. آن را با طرح SNL مقایسه کنید، که تیمی از نویسندگان حرفه ای، بازیگران و یک استودیوی بزرگ تلویزیونی را به خود اختصاص داد. این یک نگاه اجمالی به جایی است که سرگرمی ممکن است به سمت آن حرکت کند. و همانطور که قبلاً بحث کرده ام، این برای هالیوود هم یک فرصت و هم تهدید است. هوش مصنوعی می‌تواند به استودیوها کمک کند فیلم‌ها و برنامه‌های تلویزیونی را سریع‌تر و ارزان‌تر بسازند. اما همچنین به افراد امکان می‌دهد ویدیوها را آسان‌تر تولید کنند و رقابت بیشتری برای جلب توجه بینندگان ایجاد کند. (به عنوان مثال، من ویدیوی Slopcannon را بیشتر از SNL skit تماشا کرده ام). بله، بسیاری از ویدیوهای تولید شده با هوش مصنوعی هنوز هم وحشتناک هستند. پس از آن، مقدار شگفت انگیزی از محتوای ساخت بشر در رسانه های اجتماعی - و حتی در نتفلیکس - نیز وجود دارد. شکاف کیفیت در حال بسته شدن است. جفری کاتزنبرگ، تهیه کننده فیلم آمریکایی، اتین لوران / خبرگزاری فرانسه از طریق"}, {"source": "Business Insider", "title": "The NYSE's most famous floor trader says AI can't take his job", "link": "https://www.businessinsider.com/nyse-traders-ai-jobs-wall-street-brokers-peter-tuchman-markets-2026-9", "summary": "Peter Tuchman, one of the longest-serving traders at the New York Stock Exchange, says he and his son want to preserve the role of the human broker in the age of AI. Mateo Mantilla/Courtesy of Peter Tuchman The Einstein of Wall Street is on a new mission: using his market celebrity to advocate for human traders. Peter Tuchman says he and his son are pushing to keep human brokers around in the age of AI. Digital trading and AI have intensified job security concerns for many brokers who remain in the industry. It's difficult to separate Peter Tuchman from his alter ego. \"The Einstein of Wall Street, \" known for his distinctive shock of white hair and animated expressions, says he sleeps for four hours a day and works for 20. Tuchman memorabilia is a common sight at the exchange. Bobbleheads adorn his desk and cartoon stickers of Tuchman riding a bull, the spirit animal of the stock market, are displayed all around his computer. The most recent addition to the Tuchman collection, however, is much more impressive. MARKET SAVANT is a life-size bronze sculpture of Tuchman recently commissioned by the NYSE in celebration of the veteran stock broker, his team tells me. Tuchman has been a market celebrity for years, but lately, the TradeMas broker has been using his renown for a distinct purpose: advocating for the human trader in the era of AI. Wall Street was in the throes of a tech overhaul before the advent of artificial intelligence, with digital brokerages largely eliminating the need for traders to be present on the floor of the stock exchange. AI has intensified job displacement anxiety for those who remain in the industry, given that the tech is already doing much of the scutwork that has long defined junior and back-end roles on Wall Street. Most finance leaders say investing in AI will maintain or possibly increase headcount this year. Still, 28% predicted AI would lead to headcounts dropping this year, per EY's survey of financial CEOs. The number of brokers and clerks packed onto the floors of the NYSE once peaked at over 3,000 before dwindling to around 1,700 in 2007, the New York Times reported at the time. The NYSE did not provide an estimate of the number of people currently employed on the trading floor. Peter Tuchman speaking to Business Insider at the New York Stock Exchange Mateo Mantilla/Courtesy of Peter Tuchman Benny Tuchman, Peter Tuchman's son and a broker at the exchange, says the two have become the NYSE's loudest advocates for preservin", "date_str": "2026-10-03T09:30:01+00:00", "hash": "be3c798156600c16", "title_fa": "مشهورترین تاجر طبقه NYSE می گوید هوش مصنوعی نمی تواند کار او را بپذیرد", "summary_fa": "پیتر تاچمن، یکی از باسابقه‌ترین معامله‌گران در بورس نیویورک، می‌گوید او و پسرش می‌خواهند نقش کارگزار انسان را در عصر هوش مصنوعی حفظ کنند. ماتئو مانتیلا/ با احترام از پیتر تاچمن انیشتین وال استریت در یک ماموریت جدید است: استفاده از شهرت بازار خود برای حمایت از معامله گران انسان. پیتر تاچمن می گوید که او و پسرش در حال تلاش برای حفظ کارگزاران انسانی در عصر هوش مصنوعی هستند. تجارت دیجیتال و هوش مصنوعی نگرانی های امنیتی شغلی را برای بسیاری از کارگزارانی که در این صنعت باقی مانده اند تشدید کرده است. جدا کردن پیتر تاچمن از آلتر ایگوی او دشوار است. «انیشتین وال استریت» که به خاطر شوک متمایزش از موهای سفید و عبارات متحرک معروف است، می‌گوید که روزی چهار ساعت می‌خوابد و 20 ساعت کار می‌کند. یادگاری‌های تاچمن یک منظره رایج در صرافی است. کله‌های بداخلاق میز او را زینت می‌دهند و برچسب‌های کارتونی تاچمن سوار بر گاو نر، حیوان روح بازار سهام، در اطراف رایانه‌اش نمایش داده می‌شود. با این حال، جدیدترین اضافه شده به مجموعه تاچمن بسیار چشمگیرتر است. تیم او به من می‌گوید MARKET SAVANT یک مجسمه برنزی در اندازه واقعی از تاچمن است که اخیراً توسط NYSE برای بزرگداشت این کارگزار کهنه کار سهام سفارش داده شده است. تاچمن سال‌ها یک شهرت بازار بوده است، اما اخیراً کارگزار TradeMas از شهرت خود برای یک هدف مشخص استفاده می‌کند: حمایت از تاجر انسان در عصر هوش مصنوعی. وال استریت قبل از ظهور هوش مصنوعی در گیرودار تغییرات فنی بود و کارگزاری های دیجیتال تا حد زیادی نیاز معامله گران را برای حضور در کف بورس از بین بردند. هوش مصنوعی اضطراب جابجایی شغلی را برای افرادی که در این صنعت باقی می‌مانند تشدید کرده است، با توجه به اینکه این فناوری در حال حاضر بسیاری از کارهای زیربنایی را انجام می‌دهد که"}, {"source": "Business Insider", "title": "I toured Etihad's new first and business cabins coming to future Airbus jets in 2027. These 8 things surprised me most.", "link": "https://www.businessinsider.com/surprising-things-etihads-new-first-business-class-cabin-airbus-a330neo-2026-10", "summary": "As a frequent flyer who often flies in business class on Middle Eastern airlines, I was impressed by Etihad s new first- and business-class cabins. Angelo De Guzman Etihad Airways unveiled the new first and business-class cabins planned for its Airbus A330neos. First class is just four seats, and each comes with a giant television and a buddy seat. It remains to be seen whether first class is worth the pricey upgrade from business. Etihad Airways is bringing a new aircraft to its fleet in 2027, and I got an early look at what its premium seats will be like. At Dubai's annual Arabian Travel Market trade show in September, the UAE airline unveiled mock-ups of the new first- and business-class cabins planned for its future Airbus A330neos . Etihad said the first of 15 new A330neos will enter service in September 2027, serving regional and medium-haul routes from its Abu Dhabi hub. There are just four first-class suites, followed by 24 business class seats. Both cabins have privacy doors, lie-flat seats, 4K screens, Bluetooth connectivity, and wireless charging. It's notable that Etihad is continuing to expand First beyond its flagship Airbus A380s. The choice makes sense, as the post-COVID premium travel boom continues to drive global airline revenue. Sitting inside the future A330neo cabins revealed much about how Etihad maximized space, as well as a few trade-offs that weren't immediately apparent. Here are eight things that stood out most. First Class felt more like a hotel room than an airline seat. The ottoman seat in Etihad s future A330neo first class. Angelo De Guzman Once I sat down, the suite felt surprisingly spacious for everything Etihad packed around me. The leather felt premium, the finishes weren't tacky, and the different materials worked well together. It still felt roomy amid the screen, companion seat, console, and privacy walls. The seat didn't feel dramatically larger than some business-class cabins I've flown, though. Sitting in it reminded me of Gulf Air's Boeing 787 Apex Suite . An enormous 32-inch 4K screen connects to Bluetooth. Though my photos don t show it, the picture quality looked better in person. Angelo De Guzman The 32-inch 4K screen dominates the First suite, fully occupying the space in front of it. Its minimal borders make it appear larger, almost like having a miniature movie theater. One listed feature I appreciated in both new premium cabins was Bluetooth connectivity. It would allow me to pair my own noise-canceling ", "date_str": "2026-10-03T09:23:01+00:00", "hash": "d407eb2a1d94995c", "title_fa": "من از کابین‌های اولیه و تجاری جدید اتحاد که در سال 2027 به جت‌های ایرباس آینده می‌آیند، گشتم. این 8 چیز بیشتر مرا شگفت زده کرد.", "summary_fa": "من به عنوان یک مسافر مکرر که اغلب در کلاس تجاری در خطوط هوایی خاورمیانه پرواز می کند، تحت تاثیر کابین های کلاس اول و تجاری جدید اتحاد قرار گرفتم. آنجلو د گوزمن اتحاد ایرویز از کابین های جدید و کلاس تجاری که برای ایرباس A330neos خود در نظر گرفته شده است، رونمایی کرد. فرست کلاس فقط چهار صندلی دارد و هر کدام یک تلویزیون غول پیکر و یک صندلی رفیق دارند. باید دید که آیا درجه یک ارزش ارتقای گران قیمت کسب و کار را دارد یا خیر. اتحاد ایرویز در سال 2027 هواپیمای جدیدی را به ناوگان خود می آورد و من نگاهی اولیه به وضعیت صندلی های ممتاز آن داشتم. در نمایشگاه تجاری سالانه Arabian Travel Market دبی در ماه سپتامبر، شرکت هواپیمایی امارات از ماکت کابین‌های کلاس اول و تجاری جدید که برای ایرباس A330neos آینده خود برنامه‌ریزی شده است، رونمایی کرد. اتحاد گفت که اولین هواپیما از 15 A330neo جدید در سپتامبر 2027 وارد خدمت می شود و مسیرهای منطقه ای و میان برد را از هاب ابوظبی خود ارائه می دهد. تنها چهار سوئیت درجه یک وجود دارد و به دنبال آن 24 صندلی در کلاس تجاری وجود دارد. هر دو کابین دارای درهای حریم خصوصی، صندلی های صاف، صفحه نمایش 4K، اتصال بلوتوث و شارژ بی سیم هستند. نکته قابل توجه این است که اتحاد در حال ادامه گسترش در ابتدا فراتر از ایرباس A380 های پرچمدار خود است. این انتخاب منطقی است، زیرا رونق سفرهای ممتاز پس از کووید همچنان به افزایش درآمد خطوط هوایی جهانی ادامه می دهد. نشستن در کابین‌های آینده A330neo چیزهای زیادی در مورد چگونگی به حداکثر رساندن فضا توسط اتحاد و همچنین چند مبادله که فوراً آشکار نشد را نشان داد. در اینجا به هشت مورد اشاره می کنیم که بیشتر به چشم آمدند. فرست کلاس بیشتر"}, {"source": "Business Insider", "title": "LinkedIn cofounder says AI infrastructure is the 'only reason we're not in a recession'", "link": "https://www.businessinsider.com/linkedin-cofounder-ai-infrastructure-keeping-us-from-recession-2026-10", "summary": "Reid Hoffman says he s thankful for the data center buildout. JP Yim/Getty Images for Clinton Global Initiative Reid Hoffman says he's thankful for the data center buildout in the US. The LinkedIn cofounder said the capital behind it is keeping the US from a recession. Americans are souring on data centers overall. Many Americans are bristling over the data center buildout . Reid Hoffman says he's thankful for it. The LinkedIn cofounder said so during an appearance on the \"Newcomer\" podcast that was released Friday. Hoffman credited the huge amount of capital behind the AI infrastructure buildout for being \"the only reason we're not in a recession.\" He said \"most of that capital\" doesn't go to the areas where data centers are being built. \"Most of that's more distributed across the country,\" he said. \"That's great.\" Hoffman said that in addition to powering the AI boom , data center construction also provides work for construction workers, electricians, carpenters, real estate agents, and lawyers. \"All of this capital infusion, people think, 'Oh, that's just going to the tech companies,'\" he said, adding that a \"massive percentage of it is going towards data center construction.\" Data centers have recently emerged as a source of bipartisan fury as midterm elections approach. Both Republican and Democratic governors have recently moved to curtail or restrict construction. In a poll released last week by the Pew Research Center, which surveyed people in August, half of rural Americans said data centers \"are mostly bad for the environment\" — a figure substantially higher than in January, when it sat at 32%. At the same time, US investors have mind-boggling amounts of money riding on the hope that AI will soon become profitable. Data centers will play a key role in that. And for AI companies like OpenAI, Anthropic, Meta, Google, and others, the issue is existential. Without AI data centers, they can't power the products they sell. OpenAI CEO Sam Altman has recently suggested that new data centers could be built far from where people live, such as in the desert. For Hoffman, the issue is simple: Data center builders need to work fairly with local communities to ensure that both sides get a good deal, he said. As for his recession statements, the US economy is still on solid ground, even outside the blistering pace of tech capital expenditures. Despite a disappointing September jobs report , unemployment remained low, suggesting a middling rather than a recessio", "date_str": "2026-10-03T09:07:01+00:00", "hash": "105446e835492477", "title_fa": "بنیانگذار لینکدین می گوید زیرساخت هوش مصنوعی «تنها دلیلی است که ما در رکود نیستیم»", "summary_fa": "رید هافمن می گوید که از ایجاد مرکز داده سپاسگزار است. JP Yim/Getty Images برای ابتکار جهانی کلینتون رید هافمن می گوید که از ایجاد مرکز داده در ایالات متحده تشکر می کند. یکی از بنیانگذاران لینکدین گفت که سرمایه پشت آن، ایالات متحده را از رکود دور نگه می دارد. آمریکایی ها به طور کلی به مراکز داده سرگردان هستند. بسیاری از آمریکایی ها بر سر ساخت مرکز داده سر و صدا دارند. رید هافمن می گوید که از این بابت سپاسگزارم. بنیانگذار لینکدین در جریان حضور در پادکست \"Newcomer\" که روز جمعه منتشر شد، این را گفت. هافمن سرمایه عظیمی که در پشت ساخت زیرساخت هوش مصنوعی وجود دارد را به عنوان \"تنها دلیلی که ما در رکود نیستیم\" می داند. او گفت \"بیشتر این سرمایه\" به مناطقی که مراکز داده در آن ساخته می شوند، نمی رود. او گفت: «بیشتر آن در سراسر کشور توزیع شده است. \"این عالی است.\" هافمن گفت که ساخت مرکز داده علاوه بر تقویت رونق هوش مصنوعی، کار را برای کارگران ساختمانی، برق‌کارها، نجاران، مشاوران املاک و وکلا فراهم می‌کند. او گفت: \"همه این تزریق سرمایه، مردم فکر می کنند، \"اوه، این فقط به شرکت های فناوری می رود\"، و افزود که \"درصد زیادی از آن به سمت ساخت مرکز داده می رود.\" با نزدیک شدن به انتخابات میان دوره ای، مراکز داده اخیراً به عنوان منبع خشم دو حزبی ظاهر شده اند. فرمانداران جمهوری خواه و دموکرات اخیراً اقدام به محدود کردن یا محدود کردن ساخت و ساز کرده اند. در یک نظرسنجی که هفته گذشته توسط مرکز تحقیقاتی پیو منتشر شد و در ماه آگوست از مردم نظرسنجی کرد، نیمی از آمریکایی‌های روستایی گفتند که مراکز داده «بیشتر برای محیط‌زیست مضر هستند» - رقمی که به طور قابل‌توجهی بالاتر از ژانویه بود که در آن 32 درصد بود. در عین"}, {"source": "Business Insider", "title": "4 ways parents can teach young boys about consent and how to go against the group, according to Dr. Becky", "link": "https://www.businessinsider.com/teaching-young-boys-consent-dr-becky-parenting-2026-10", "summary": "Dr. Becky Kennedy, known to millions as Dr. Becky, is a clinical psychologist, mom of three, and the founder and CEO of Good Inside, a parenting app. Courtesy of Good Inside. This week, my DMs have been flooded with questions from parents. They're looking for advice on meaningful ways to teach their sons about consent and speaking up. My advice: Parents should start early. We need to raise our boys in ways that allow them to practice these skills. In the past week, I've gotten the same DMs from thousands of parents: \"I'm reading about the Cornell sexual assault allegations, and oh my goodness, I don't want that to be my son. What can I do?\" Well, let's start here: Assault prevention doesn't start with a c ollege orientation talk. It starts years earlier. It starts with learning to hear someone else's \"no.\" Noticing when something isn't right. Resisting the pull of the group. Speaking up when everyone else is going along. Knowing that silence means no, not yes. If this set of skills is one we know we want our teen sons to possess, we must ask ourselves if we're raising them in a way that gives them practice living these truths as young boys. Kids aren't magically gifted with these skills at 18 or when they arrive at college. The stakes may be higher then, which is exactly why the practice has to start much earlier. And that practice probably looks different from what you think. Here are four places to start. Make sure you help your son practice wanting something and not getting it Think about what consent eventually requires: You really, really want something. And another person — or even just the situation — is giving you information that says: \"Not OK.\" That requires being able to tolerate frustrated desire. Start by reflecting. When my son hears \"no,\" does he get practice being upset and tolerating not getting what he wants? Or does he learn that if he pushes long enough, someone else's \"no\" might eventually change? As parents, we often tell ourselves that giving in makes life easier . While it does make that moment easier, our kids need experiences where they want something, don't get it, feel disappointed, and learn that disappointment is something they can handle. To be clear, this doesn't mean their feelings don't matter. In fact, it's the opposite. I can take your feelings seriously without letting them dictate my decision. That's a skill our kids will need for the rest of their lives. Teach your son to notice other people Consent is not just waitin", "date_str": "2026-10-03T09:04:01+00:00", "hash": "d013f3660a471a31", "title_fa": "به گفته دکتر بکی، 4 روشی که والدین می توانند به پسران جوان در مورد رضایت و نحوه مخالفت با گروه آموزش دهند.", "summary_fa": "دکتر بکی کندی، که میلیون ها نفر او را به نام دکتر بکی می شناسند، یک روانشناس بالینی، مادر سه فرزند، و بنیانگذار و مدیر عامل Good Inside، یک اپلیکیشن فرزندپروری است. با حسن نیت از Good Inside. این هفته، DM های من پر از سوالات والدین شده است. آنها به دنبال مشاوره در مورد راه های معنی دار برای آموزش دادن رضایت و صحبت کردن به پسرانشان هستند. توصیه من: والدین باید زودتر شروع کنند. ما باید پسرانمان را طوری تربیت کنیم که به آنها اجازه دهد این مهارت ها را تمرین کنند. در هفته گذشته، من از هزاران والدین DM های مشابهی دریافت کردم: \"من در حال خواندن اتهامات آزار جنسی کرنل هستم، و خدای من، نمی خواهم آن پسر من باشد. چه کاری می توانم انجام دهم؟\" خوب، بیایید از اینجا شروع کنیم: پیشگیری از حمله با یک سخنرانی جهت گیری دانشگاهی شروع نمی شود. سال ها زودتر شروع می شود. با یادگیری شنیدن \"نه\" دیگران شروع می شود. متوجه شدن وقتی چیزی درست نیست مقاومت در برابر کشش گروه صحبت کردن در زمانی که دیگران با هم همراه هستند. دانستن اینکه سکوت یعنی نه، نه بله. اگر این مجموعه از مهارت‌هایی است که می‌دانیم می‌خواهیم پسران نوجوانمان آن‌ها را داشته باشند، باید از خود بپرسیم که آیا آنها را به گونه‌ای پرورش می‌دهیم که به آن‌ها به عنوان پسران جوان با این حقایق تمرین کنند. بچه ها در 18 سالگی یا زمانی که به دانشگاه می رسند به طور جادویی از این مهارت ها برخوردار نیستند. خطرات ممکن است در آن زمان بیشتر باشد، دقیقاً به همین دلیل است که تمرین باید خیلی زودتر شروع شود. و این تمرین احتمالاً متفاوت از آنچه شما فکر می کنید به نظر می رسد. در اینجا چهار مکان برای شروع وجود دارد. مطمئن شوید که به پسرتان کمک می‌کنید"}, {"source": "Business Insider", "title": "Older Americans are afraid to spend their riches in retirement", "link": "https://www.businessinsider.com/older-americans-afraid-spend-retirement-savings-survey-2026-10", "summary": "Older Americans are often unwilling to spend down their savings in retirement. Catherine Delahaye/Getty Images Many retirees fear spending savings, with most prefering leaving a surplus over depleting funds. A Prudential survey shows retirees struggle with balancing spending on enjoyment and future saving. Retirees feel guilty spending on luxuries and prefer guaranteed monthly income over a lump sum. Millions of Americans save for decades for the day when they turn in their laptops and never have to work again. When the day comes, though, many fear spending down their nest eggs . Prudential Financial's 2026 Retirement Pulse survey , conducted online between July and August, found that only 14% of respondents felt comfortable spending each month in retirement for enjoyment, such as hobbies, travel, and dining out. Anxiety about spending doesn't go away among higher-net-worth individuals, as 39% of those with over $500,000 in investable assets felt comfortable spending for enjoyment. As Prudential notes, it's a case of FORO, or Fear of Running Out . Over half said they would rather leave behind too much than risk exhausting what they have, or preserve what they have without decreasing their assets. That number rose to 70% for those with over $500,000. The survey drew from over 3,000 American adults age 50 and older. A common assumption about retirement planning is that \"savings looks like a mountain where you climb this mountain, then you save this wealth, then you spend it down,\" said David Blanchette, head of retirement research for Prudential Financial. \"In reality, it's not a mountain for most people. It's a plateau.\" Prudential found that 42% of survey respondents said they've been unable to find a balance between living in the moment and waiting for life to progress before enjoying it. Many older Americans whom Business Insider spoke with over the last two years agreed. A few said they made painful sacrifices earlier in life, such as skipping family vacations, in hopes of retiring at 65, then were diagnosed with cancer or chronic pain. \"I did well saving for retirement, but so much so I was too frugal along the way and did not enjoy as much while younger as I worked too much,\" Ruth Mills, now 64, told Business Insider in late 2024. Nearly half of the respondents said they hesitated on spending because of doubts about whether Social Security would still be available down the line. Over two in five said inflation and the rising cost of living have made t", "date_str": "2026-10-03T09:01:01+00:00", "hash": "dc0e0b3a203e18fb", "title_fa": "آمریکایی های مسن تر از خرج کردن ثروت خود در دوران بازنشستگی می ترسند", "summary_fa": "آمریکایی های مسن اغلب تمایلی به خرج کردن پس انداز خود در دوران بازنشستگی ندارند. کاترین دلاهیه/ گتی ایماژ بسیاری از بازنشستگان از پس انداز هراس دارند و بیشتر آنها مازاد بر بودجه را ترجیح می دهند. یک نظرسنجی احتیاطی نشان می‌دهد که بازنشستگان با ایجاد تعادل در هزینه‌های لذت و پس‌انداز آینده دست و پنجه نرم می‌کنند. بازنشستگان در هزینه های تجملاتی احساس گناه می کنند و درآمد تضمینی ماهانه را به یک مبلغ مقطوع ترجیح می دهند. میلیون‌ها آمریکایی برای روزی که لپ‌تاپ‌های خود را تحویل می‌گیرند و دیگر مجبور به کار نمی‌شوند، ده‌ها سال پس‌انداز می‌کنند. با این حال، وقتی روز فرا می رسد، بسیاری از خرج کردن تخم های لانه خود می ترسند. نظرسنجی Prudential Financial 2026 Retirement Pulse که به صورت آنلاین بین ژوئیه و آگوست انجام شد، نشان داد که تنها 14 درصد از پاسخ دهندگان احساس راحتی می کنند که هر ماه را در دوران بازنشستگی برای تفریح، مانند سرگرمی ها، مسافرت، و صرف غذا در خارج از خانه سپری کنند. نگرانی در مورد هزینه کردن در بین افراد با ارزش خالص بالاتر از بین نمی رود، زیرا 39٪ از افرادی که دارایی های قابل سرمایه گذاری بیش از 500,000 دلار دارند احساس راحتی می کنند که برای لذت بردن هزینه کنند. همانطور که Prudential اشاره می کند، این یک مورد FORO یا ترس از تمام شدن است. بیش از نیمی از آنها گفته‌اند که ترجیح می‌دهند چیزهای زیادی را پشت سر بگذارند تا اینکه ریسک کنند آنچه دارند را تمام کنند یا آنچه را که دارند حفظ کنند بدون اینکه دارایی‌هایشان کاهش یابد. این رقم برای افرادی که بیش از 500000 دلار داشتند به 70 درصد افزایش یافت. این نظرسنجی از بیش از 3000 بزرگسال آمریکایی 50 ساله و بالاتر انجام شد. دیوید بلانشت، رئیس تحقیقات بازنشستگی Prudential Financial گفت: یک فرض"}, {"source": "Business Insider", "title": "Nate Bargatze gave me career advice at a conference — and it matched what 4 CEOs said", "link": "https://www.businessinsider.com/ceo-advice-building-dream-career-ford-nate-bargatze-accelerate-2026-10", "summary": "Comedian Nate Bargatze dished on his early career at a conference. John Lamparski/Getty Images Business Insider attended the Ford Accelerate conference, an event full of CEOs — and Nate Bargatze. They talked about their early careers. Their advice was very similar. It comes as America struggles to fill skilled-trade roles that once powered US companies. Nate Bargatze's first jobs weren't fancy. Pizza deliveryman, valet driver, mover — titles that \"were always exactly what the job was,\" he said. \"I remember going to one house, and they wanted me to go buy them beer,\" he recalled of his time working for Pizza Hut. \"They'd give you a little extra cash, and you'd be like, 'Alright, that's nice.' A little extra $20 in the pocket, and you go.\" Bargatze's career is now much more flashy. He's hosted SNL twice, starred in his own Netflix specials, headlined national tours , and is the leading man in Ford ad campaigns. And that's how Business Insider met Bargatze on Wednesday — at Ford's Accelerate conference. He emceed the Detroit event that brought together business leaders to talk about America's skilled-trades shortage. We asked Baratze about building a dream career. His response was remarkably similar to what CEOs at the conference were saying — but perhaps with less corporate frou-frou. Their main piece of advice: Don't expect your first role to be the dream job, and once you find an opening, make the most of it. A retail beginning? Linda Hubbard, Carhartt s CEO, told Business Insider about a worker who wanted to be a data analyst, so he took a retail sales position instead. Bloomberg/Getty Images Linda Hubbard, the CEO of the workwear maker Carhartt, told Business Insider that she had heard from a retail worker who had applied for an analytics role, but Carhartt did not have an opening for him. Instead, he took a job at the company's Detroit retail store — and got his foot in the door. \"He has all of our internal posting access,\" she said on Wednesday. \"So he's now one step ahead, right? He'll meet other people, and, you know what? He may end up loving retail, becoming a store manager, a district manager, and like, all of a sudden, 'I thought I wanted the data position, but maybe I don't.'\" Several other executives used their own career trajectories as an example. \"I wanted to be an investment banker. That was my dream job,\" David Regnery, CEO of Trane Technologies, an HVAC manufacturing company, said onstage. He hated banking and pivoted to a job on Trane's ", "date_str": "2026-10-03T08:49:01+00:00", "hash": "b5acbabb5f9afd9e", "title_fa": "نیت بارگاتزه در یک کنفرانس به من توصیه های شغلی داد - و این با آنچه 4 مدیر اجرایی گفتند مطابقت داشت", "summary_fa": "نیت بارگاتزه، کمدین، در یک کنفرانس از اوایل دوران حرفه ای خود صحبت کرد. جان لامپارسکی/ گتی ایماژز بیزینس اینسایدر در کنفرانس فورد شتاب شرکت کرد، رویدادی پر از مدیران عامل - و نیت بارگاتزه. آنها در مورد مشاغل اولیه خود صحبت کردند. توصیه آنها بسیار شبیه بود. این در حالی است که آمریکا در تلاش برای ایفای نقش‌های تجاری ماهر است که زمانی شرکت‌های آمریکایی را نیرو می‌داد. اولین کارهای نیت بارگاتزه جذاب نبود. او گفت: تحویل‌دهنده پیتزا، راننده پیشخدمت، جابجایی - عناوینی که «همیشه دقیقاً همان کار بودند». او از زمانی که برای پیتزا هات کار می‌کرد به یاد می‌آورد: «به یاد دارم که به خانه‌ای رفتم و از من خواستند بروم برایشان آبجو بخرم. \"آنها به شما پول نقد اضافی می دادند و شما می گویید \"خوب، خوب است.\" کمی 20 دلار اضافی در جیب، و شما بروید.\" حرفه بارگاتزه اکنون بسیار پر زرق و برق تر است. او دو بار میزبان SNL بوده، در برنامه‌های ویژه نتفلیکس خود بازی کرده، تورهای ملی را تیتر کرده است و مرد پیشرو در کمپین‌های تبلیغاتی فورد است. و اینگونه بود که Business Insider در روز چهارشنبه - در کنفرانس شتاب فورد - بارگاتزه ملاقات کرد. او از رویداد دیترویت که رهبران تجاری را گرد هم آورد تا در مورد کمبود تجارت ماهر آمریکا صحبت کنند، پذیرفت. از باراتزه درباره ساختن یک حرفه رویایی پرسیدیم. پاسخ او به طرز قابل توجهی شبیه به آنچه مدیران عامل در کنفرانس می‌گفتند بود - اما شاید با فروغ کمتر شرکتی. توصیه اصلی آنها: انتظار نداشته باشید که نقش اول شما شغل رویایی باشد و به محض اینکه یک افتتاحیه پیدا کردید، از آن نهایت استفاده را ببرید. شروع خرده فروشی؟ لیندا هابارد، مدیرعامل کارهارت، به Business Insider در مورد کارگری گفت که می‌خواست تحلیلگر داده باشد، بنابراین او به جای آن یک موقعیت"}, {"source": "Business Insider", "title": "Creators are getting backlash for using AI. I went to a conference full of those who are proud of it.", "link": "https://www.businessinsider.com/content-creators-embrace-ai-despite-backlash-conference-influencers-hollywood-2026-10", "summary": "Creator Vincent Marcus and Shira Lazar, CEO of What s Trending, at AI Creator Day. Randy Shropshire for TheWrap Content creators at a conference in LA this week seemed largely unfazed by AI backlash. While some influencers are avoiding AI, creators at the event showed off their AI-generated work. Some attendees said they came to the event for a \"safe space\" to talk about creating with AI. How do influencers and content creators feel about getting roasted for using AI ? Mostly unbothered. At least, that was the vibe at a conference for AI creators that I attended in Los Angeles this week. I joined hundreds of creators, marketers, brands, and AI enthusiasts on Tuesday at \"AI Creator Day,\" hosted by industry trade publication TheWrap and media brand What's Trending. The one-day event took place at UCLA and featured talks like \"What It Actually Takes to Make an AI Series\" and \"Who Decides What's Human?\" \"We're taking it in the head right now,\" said DeStorm Power about people leaving \"slop\" comments on content made with AI . He spoke on a panel about how OG YouTubers are using the tech. Despite the comments, Power, who has over 3 million subscribers on YouTube, said he ignores them and focuses instead on the thousands of people who enjoy the AI-generated content he makes. Going in, I had expected plenty of conversation about how creators can navigate AI backlash — like the influencers who got skewered for attending a brand trip hosted by OpenAI or the dramatic apology issued by longtime YouTuber Hank Green for \"relying too heavily on AI.\" Instead, I found a lot of hype, practical AI filmmaking tips, and few apologies. Creators proudly presented their AI-generated projects — from a comedy sketch about having a Merman for a roommate to a black-and-white, old-Hollywood-style short — and dished about how many humans and AI credits they used to make them. Most of the creators were well past debating whether they should use AI to tell stories and were far more interested in how they should use it and what they could do with it. Filmmaker Chris Capel said AI helped him make a short about living with a merman that had first been conceived of two decades ago. Kelsey Vlamis A 'safe space' to talk about AI Several of the attendees I spoke with said they came to \"AI Creator Day\" in part because it represented a \"safe space.\" The overarching sentiment among creators was that they were excited to share how they used AI and what it enabled them to do. Makers of an AI-generate", "date_str": "2026-10-03T08:11:01+00:00", "hash": "b4df11d345ba8b92", "title_fa": "سازندگان برای استفاده از هوش مصنوعی با واکنش های منفی مواجه می شوند. من به یک کنفرانس پر از کسانی که به آن افتخار می کنند رفتم.", "summary_fa": "خالق وینسنت مارکوس و شیرا لازار، مدیر عامل Whats Trending، در AI Creator Day. رندی شراپشایر برای سازندگان محتوای TheWrap در کنفرانسی در لس آنجلس این هفته به نظر می‌رسید که واکنش‌های متقابل هوش مصنوعی تا حد زیادی ناراضی باشد. در حالی که برخی از اینفلوئنسرها از هوش مصنوعی اجتناب می کنند، سازندگان در این رویداد کارهای تولید شده توسط هوش مصنوعی خود را به نمایش گذاشتند. برخی از شرکت کنندگان گفتند که برای \"فضای امن\" به این رویداد آمده اند تا در مورد ایجاد با هوش مصنوعی صحبت کنند. اینفلوئنسرها و سازندگان محتوا در مورد استفاده از هوش مصنوعی چه احساسی دارند؟ اکثرا بدون مزاحمت حداقل، این حس در کنفرانسی برای سازندگان هوش مصنوعی بود که من در لس آنجلس این هفته شرکت کردم. من روز سه‌شنبه در «روز خالق هوش مصنوعی» که توسط نشریه تجاری صنعتی TheWrap و برند رسانه‌ای What's Trending برگزار شد، به صدها سازنده، بازاریاب، برندها و علاقه‌مندان به هوش مصنوعی پیوستم. این رویداد یک روزه در دانشگاه UCLA برگزار شد و سخنرانی هایی مانند \"در واقع برای ساخت یک سری هوش مصنوعی چه چیزی لازم است\" و \"چه کسی تصمیم می گیرد انسان چیست؟\" DeStorm Power در مورد افرادی که در مورد محتوایی که با هوش مصنوعی ساخته شده اند، نظرهای \"فریب\" می دهند، گفت: \"ما در حال حاضر به آن فکر می کنیم.\" او در یک پانل در مورد نحوه استفاده کاربران OG از این فناوری صحبت کرد. علیرغم این نظرات، پاور که بیش از 3 میلیون مشترک در یوتیوب دارد، گفت که آنها را نادیده می گیرد و در عوض روی هزاران نفری تمرکز می کند که از محتوای تولید شده توسط هوش مصنوعی او لذت می برند. با ورود، انتظار داشتم گفتگوهای زیادی در مورد اینکه چگونه سازندگان می‌توانند با واکنش‌های AI مقابله کنند - مانند تأثیرگذارانی که به دلیل شرکت"}, {"source": "Business Insider", "title": "American Airlines’ pilots union says Spirit’s data sale to Google could undermine aviation safety", "link": "https://www.businessinsider.com/american-airlines-pilots-union-opposes-spirits-data-sale-to-google-2026-10", "summary": "The union representing American Airlines pilots joined objections to Spirit Airlines sale of its data to Google. Andrew Harnik/Getty Images The union representing American Airlines pilots objected this week to Spirit's data sale to Google. The union cited privacy and safety concerns and joined prior objections to the sale. Google has said data included in the $10 million data sale would be scrubbed of identifying info. The union representing American Airlines pilots is joining opposition to Spirit Airlines' plan to sell its old data to Google . After the budget airline shut down earlier this year, Google succeeded in bidding $10 million for its data, which the company said could be used to improve its products and AI models. The Allied Pilots Association, which represents American Airlines pilots, filed an objection to the sale on Tuesday, saying more than 700 of its members formerly worked at Spirit and would be affected. The filing said that in addition to disclosing the pilots' \"confidential employment and training related information,\" the proposed data sale also \"threatens to have a chilling effect across all commercial airlines.\" It said crew members participate in voluntary safety and training programs with the expectation that the information they share will remain confidential. \"To permit that information to later be sold to a third-party without ensuring complete deidentification and satisfactory confidentiality protections will serve to threaten the voluntary safety and training programs that provide the backbone of the commercial aviation industry in the United States,\" the filing said. The union called for the court to reject the proposed sale until concerns over the crew members' data are \"satisfactorily addressed.\" Google has said the sale includes Spirit's internal data and custom software, but not customer or credit card information, and that the data would be scrubbed of any identifying information. The filing this week joins prior objections to the data sale filed by the Air Line Pilots Association, the union representing Spirit pilots, and the Association of Flight Attendants-CWA, which represents Spirit flight attendants. Spirit declined to comment. Google did not respond to a request for comment. Read the original article on Business Insider", "date_str": "2026-10-03T04:02:01+00:00", "hash": "5687100a20053438", "title_fa": "اتحادیه خلبانان امریکن ایرلاینز می گوید فروش داده های Spirit به گوگل می تواند ایمنی هوانوردی را تضعیف کند", "summary_fa": "اتحادیه ای که خلبانان امریکن ایرلاینز را نمایندگی می کند به اعتراضات به فروش داده های اسپیریت ایرلاین به گوگل پیوست. اندرو هارنیک/ گتی ایماژ اتحادیه نماینده خلبانان خطوط هوایی آمریکا این هفته به فروش داده های اسپیریت به گوگل اعتراض کرد. اتحادیه به نگرانی های مربوط به حریم خصوصی و ایمنی اشاره کرد و به اعتراضات قبلی نسبت به فروش پیوست. گوگل گفته است که داده های موجود در فروش داده های 10 میلیون دلاری از اطلاعات شناسایی پاک می شود. اتحادیه ای که نماینده خلبانان امریکن ایرلاینز است به مخالفت با طرح Spirit Airlines برای فروش داده های قدیمی خود به گوگل می پیوندد. پس از تعطیلی خطوط هوایی مقرون به صرفه در اوایل سال جاری، گوگل موفق شد 10 میلیون دلار برای داده های خود پیشنهاد دهد که به گفته این شرکت می تواند برای بهبود محصولات و مدل های هوش مصنوعی خود استفاده شود. انجمن خلبانان م رکرومبی که در راهنمای ما برای بهترین شلوار جین برای زنان قد بلند دیده می‌شود. بررسی کامل شلوار جین Abercrombie ما همچنین چندین تناسب پرطرفدار، از جمله نحوه مقایسه آنها در راحتی، اندازه و کیفیت کلی را بررسی می کند. Abercrombie تبلیغاتی را در طول سال اجرا می‌کند، بنابراین معمولاً شانس مناسبی برای یافتن فروش، کاهش زمان محدود یا کوپن اضافی قبل از بررسی وجود دارد. ما جدیدترین کدهای کوپن و معاملات Abercrombie را در زیر گردآوری کرده‌ایم، بنابراین می‌توانید زمان کمتری را برای شکار تخفیف‌ها و زمان بیشتری برای تصمیم‌گیری در مورد آنچه در سبد خرید خود نگه دارید صرف کنید. بهترین کدهای تبلیغاتی امروزی Abercrombie در حال حاضر هیچ کوپن Abercrombie تا زمان نوشتن این مقاله موجود نیست. ما این بخش را با کدهای تبلیغاتی به محض در دسترس قرار گرفتن، به روز می کنیم. بازگشت به سبد خرید کدهای تخفیف قبلی Abercrombie این"}, {"source": "Business Insider", "title": "How to redeem a gift card on Amazon", "link": "https://www.businessinsider.com/guides/tech/amazon-gift-card-redeem", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Amazon When it comes to choosing a gift card for someone special, you can't really go wrong with one from Amazon. The retailer offers just about everything, and with so many products to choose from, recipients can use their funds on home essentials. upgrade splurges, and more. If you're a giftee or interested in getting one yourself, learn how to redeem an Amazon gift card below. I've broken down how to add your gift card to your Amazon account below. For more Amazon shopping tips and tricks, check out the rest of our Prime Day coverage . How to add an Amazon gift card to your account If you receive an Amazon gift card, the easiest way to redeem it is to use the designated link . Log in to your account, enter your claim code, and click the Apply to your balance button. You can use other avenues as well, such as the Amazon app or the gift card section of Amazon's site. Quick tip: Have a Roblox gift card that you want
