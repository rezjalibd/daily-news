ات موبایلی را ارتقا داد.", "date_str": "2026-09-14T13:12:41+00:00", "hash": "e368b4e6e1a7cf7b", "title_fa": "بازگشت متریکس با سه تحول مهم؛ از شناسایی تقلب پیچیده تا حفظ مسیر کاربر پس از نصب", "summary_fa": "این مطلب صرفا جنبه تبلیغاتی داشته و زومیت هیچ مسئولیتی را در رابطه با آن نمی‌پذیرد پلتفرم متریکس با مسدودسازی ۳ میلیون کلیک نامعتبر روزانه، معرفی دیپ‌لینک با کافه‌بازار و انتشار SDK جدید، دقت تبلیغات موبایلی را ارتقا داد. تبلیغات متریکس پس از یک دوره کم‌خبری، با اعلام سه به‌روزرسانی مهم در حوزه تبلیغات موبایلی و اتریبیوشن بار دیگر در مرکز توجه قرار گرفته است. شناسایی و مسدودسازی روزانه حدود ۳ میلیون کلیک نامعتبر، نهایی‌شدن قابلیت Deferred Deep Link با کافه‌بازار و انتشار نسخه جدید SDK با تمرکز بر افزایش دقت Attribution و سازگاری فنی، سه خبری هستند که می‌توانند مسیر توسعه این پلتفرم را در بازار تبلیغات اپلیکیشن ایران تغییر دهند. متریکس اعلام کرده است در پایش‌های انجام‌شده روی ترافیک تبلیغاتی یکی از منابع مطرح تبلیغات اپلیکیشن، الگویی پیچیده از کلیک‌های نامعتبر را شناسایی کرده است. به گفته این پلتفرم، این الگو به شکلی طراحی شده بود که از سیستم‌های تشخیص تقلب عبور کند و بخشی از ترافیک غیرواقعی را مشابه کلیک معتبر نشان دهد. براساس اعلام متریکس، این پلتفرم در میان گزینه‌های اتریبیوشن مورد استفاده در ایران، نخستین پلتفرمی بوده که توانسته این الگوریتم پیچیده را شناسایی کند. متریکس می‌گوید پس از چند مرحله پایش، بررسی و اطلاع‌رسانی، با توجه به ادامه این روند، مسدودسازی کلیک‌های مشکوک را آغاز کرده است. این اقدام باعث می‌شود کلیک‌هایی که از نظر الگوی زمانی، رفتاری یا ارتباطشان با نصب و فعالیت واقعی کاربر مشکوک تشخیص داده می‌شوند، در فرایند Attribution به‌عنوان ترافیک معتبر ثبت نشوند. هدف از این کار، جلوگیری از مخدوش‌شدن گزارش کمپین‌ها، کاهش احتمال تخصیص اشتباه نصب‌ها و حفاظت از بودجه تبلیغ‌دهندگان عنوان شده است. کپی لینک چرا شناسایی کلیک فیک برای کمپین‌های اپلیکیشنی مهم است؟ در کمپین‌های نصب اپلیکیشن، تعداد کلیک به‌تنهایی معیار مناسبی برای ارزیابی عملکرد یک منبع تبلیغاتی نیست. آنچه برای تبلیغ‌دهنده اهمیت دارد، ارتباط میان"}, {"source": "Zoomit", "title": "تصاویر جدید از گوشی جنجالی تکنو، محصولی که حاشیه در اطراف نمایشگر ندارد", "link": "https://www.zoomit.ir/mobile/467166-tecno-bezel-less-concept-phone-feature-loook/", "summary": "تکنو از گوشی مفهومی و تمام‌صفحه‌اش حاشیه‌های فوق باریک و مشخصات فنی مدل کامن اسلیم رونمایی کرد.", "date_str": "2026-09-14T13:10:00+00:00", "hash": "f23f3e81156e2a62", "title_fa": "تصاویر جدید از گوشی جنجالی تکنو، محصولی که حاشیه در اطراف نمایشگر ندارد", "summary_fa": "تکنو از گوشی مفهومی و تمام‌صفحه‌اش حاشیه‌های فوق باریک و مشخصات فنی مدل کامن اسلیم رونمایی کرد. تبلیغات تکنو با ساخت یک گوشی مفهومی جدید ، ایده‌ی نمایشگرهای کاملا بدون حاشیه را بار دیگر زنده کرد. دستگاه مورد بحث که در جریان نمایشگاه IFA به نمایش درآمد، بر پایه‌ی گوشی تکنو کامن اسلیم توسعه یافته و در بخش مشخصات نرم‌افزاری نیز خود را با همین نام معرفی می‌کند. سخت‌افزار دستگاه شباهت زیادی به نسخه‌ی اصلی دارد و به تراشه‌ی دیمنسیتی 7300e همراه باتری ۶۰۰۰ میلی‌آمپرساعتی مجهز است. با وجود این شباهت‌ها، کانسپت جدید به دلیل استفاده از شیشه‌ی محافظ دولایه و ساختار منحنی داخلی، ضخامت بیشتری نسبت‌به مدل تجاری دارد. طول دستگاه نیز کمی کوتاه‌تر شده تا فضای کمتری اشغال کند. محصولات مفهومی معمولا برای ورود به بازار و فروش تجاری طراحی نمی‌شوند و صرفا آزمایشی هستند. طبق بررسی‌های اولیه، راه‌اندازی دستگاه با مشکلاتی همراه بوده و خاموش و روشن‌شدن‌های ناگهانی در نرم‌افزارش مشاهده می‌شود. خشاب سیم‌کارت روی بدنه نیز جنبه‌ی تزئینی دارد و درگاه واقعی برای آن تعبیه نشده است. تلاش برندها برای حذف کامل حاشیه‌ها، یادآور طراحی ساختارشکنانه‌ی شیائومی می میکس در سال‌های گذشته است. تکنو با ارائه‌ی چنین پروتوتایپی نشان داد که مهندسان صنعت موبایل همچنان در پی دستیابی به یک پنل یکپارچه و تمام‌صفحه هستند."}, {"source": "Zoomit", "title": "ویژگی بی‌سابقه گوشی جدید آنر: دوربین سلفی مربعی ۵۵ مگاپیکسلی!", "link": "https://www.zoomit.ir/mobile/467123-honor-magic-9-square-selfie-camera/", "summary": "آنر گوشی‌های پرچمداران سری مجیک ۹ را به نخستین دوربین سلفی مربعی ۵۵ مگاپیکسلی در دنیای اندروید مجهز می‌کند.", "date_str": "2026-09-14T12:40:00+00:00", "hash": "f88b46e884b38ea2", "title_fa": "ویژگی بی‌سابقه گوشی جدید آنر: دوربین سلفی مربعی ۵۵ مگاپیکسلی!", "summary_fa": "آنر گوشی‌های پرچمداران سری مجیک ۹ را به نخستین دوربین سلفی مربعی ۵۵ مگاپیکسلی در دنیای اندروید مجهز می‌کند. تبلیغات آنر از تجهیز پرچمداران سری مجیک ۹ به دوربین سلفی ۵۵ مگاپیکسلی با طراحی مربعی خبر داد که برای نخستین‌بار در میان گوشی‌های اندرویدی استفاده می‌شود. این حسگر به دلیل ساختار متفاوت خود، فضای بیشتری برای ثبت کادرهای عریض‌تر نسبت‌به برش‌های دایره‌ای و کپسولی متداول در اختیار کاربر قرار می‌دهد. دوربین جلوی جدید گوشی آنر موسوم به Agile Eye امکان جابه‌جایی میان حالت‌های افقی و عمودی را بدون از دست رفتن زاویه‌ی دید گسترده فراهم می‌کند. سنسور مربعی سلفی تنها در مدل استاندارد مجیک ۹ و مدل مجیک ۹ پرو مکس تعبیه خواهد شد و سایر اعضای این خانواده از ساختار متفاوتی بهره خواهند برد. مجموعه‌دوربین پشتی سری مجیک ۹ با همکاری ARRI توسعه یافته و شامل سیستم سه‌گانه‌ای با دو سنسور ۲۰۰ مگاپیکسلی می‌شود. آنر کیت لنز تله‌کانورتر ۵۰۰ میلی‌متری و قابلیت فیلم‌برداری سینمایی اختصاصی را به این گوشی‌ها اضافه کرده تا دستگاه‌ها را فراتر از یک محصول مجهز به حسگرهای با وضوح بالا به عنوان سیستم کامل عکاسی معرفی کند. ماژول دوربین پشتی در مجیک ۹ پرو مکس از زبان طراحی جدید Guide&#x27;s Eye بهره می‌برد که از دوربین سینمایی کلاسیک ARRIFLEX 35 الهام گرفته است. لبه‌ها، پنل پشتی و ساختار کلی بدنه در این نسخه دستخوش بازطراحی شده تا در کنار حفظ اصالت نسل‌های گذشته، ارگونومی بهتری را به کاربر ارائه دهد."}, {"source": "Zoomit", "title": "داروی محبوب اختلال نعوظ ممکن است خطر آب سیاه چشم را افزایش دهد", "link": "https://www.zoomit.ir/health-medical/467115-tadalafil-use-glaucoma-risk-study/", "summary": "پژوهشی تازه نشان می‌دهد مصرف طولانی‌مدت تادالافیل، دارویی رایج برای درمان اختلال نعوظ، ممکن است با افزایش اندک خطر ابتلا به آب سیاه چشم مرتبط باشد.", "date_str": "2026-09-14T12:20:00+00:00", "hash": "f0ca60b82ecfeeb4", "title_fa": "داروی محبوب اختلال نعوظ ممکن است خطر آب سیاه چشم را افزایش دهد", "summary_fa": "پژوهشی تازه نشان می‌دهد مصرف طولانی‌مدت تادالافیل، دارویی رایج برای درمان اختلال نعوظ، ممکن است با افزایش اندک خطر ابتلا به آب سیاه چشم مرتبط باشد. تبلیغات سال‌ها این باور قدیمی وجود داشت که رابطه جنسی می‌تواند باعث نابینایی شود؛ ادعایی که علم مدت‌ها پیش آن را رد کرده است. اما پژوهش جدیدی موضوع متفاوتی را بررسی می‌کند: آیا خودِ برخی داروهای مرتبط با عملکرد جنسی می‌توانند روی سلامت چشم اثر بگذارند؟ محققان در مطالعه بزرگی، ارتباط میان مصرف طولانی‌مدت تادالافیل (Tadalafil) و افزایش احتمال ابتلا به گلوکوم یا آب سیاه چشم را بررسی کردند. تادالافیل که بیشتر با نام تجاری سیالیس (Cialis) شناخته می‌شود، برای درمان اختلال نعوظ و همچنین برخی مشکلات ادراری ناشی از بزرگ‌شدن پروستات تجویز می‌شود. در پژوهش اخیر، وضعیت نزدیک به ۳۷هزار مرد بالای ۴۰ سال که حداقل سه ماه به‌طور منظم تادالافیل مصرف کرده بودند، با گروه مشابهی از مردانی که این دارو را مصرف نمی‌کردند مقایسه شد. بررسی‌ها تا پنج سال ادامه داشت. مطالعه رابطه علت و معلولی را ثابت نمی‌کند و افراد نباید بدون مشورت پزشک مصرف تادالافیل را متوقف کنند به گزارش ساینس‌آلرت ، نتایج نشان داد حدود ۳٫۹ درصد از مصرف‌کنندگان تادالافیل در این مدت به گلوکوم مبتلا شدند؛ درحالی‌که این رقم در گروه بدون مصرف دارو حدود ۳٫۱ درصد بود. به بیان ساده، مصرف‌کنندگان دارو با افزایش نسبی حدود ۲۲ درصدی خطر ابتلا مواجه بودند، اما تفاوت واقعی بین دو گروه کمتر از یک درصد بود."}, {"source": "Zoomit", "title": "بعد از افزایش شدید قیمت‌ها؛ وام شرافتی و لپ‌تاپ امانی برای دانشجویان نیازمند دانشگاه تهران", "link": "https://www.zoomit.ir/iran-news/467200-tehran-university-student-loan-laptop-support/", "summary": "بنیاد حامیان دانشگاه تهران در سال تحصیلی جدید به حدود هزار و ۵۰۰ دانشجوی نیازمند کمک‌هزینه ماهانه، وام قرض‌الحسنه و لپ‌تاپ امانی ارائه می‌کند.", "date_str": "2026-09-14T12:12:00+00:00", "hash": "2416443527ac18fc", "title_fa": "بعد از افزایش شدید قیمت‌ها؛ وام شرافتی و لپ‌تاپ امانی برای دانشجویان نیازمند دانشگاه تهران", "summary_fa": "بنیاد حامیان دانشگاه تهران در سال تحصیلی جدید به حدود هزار و ۵۰۰ دانشجوی نیازمند کمک‌هزینه ماهانه، وام قرض‌الحسنه و لپ‌تاپ امانی ارائه می‌کند. تبلیغات ناصر غلامی، مدیرعامل بنیاد حامیان دانشگاه تهران، از حمایت‌های مالی و تحصیلی از دانشجویان نیازمند در سال تحصیلی جدید خبر داد. بر اساس برنامه این بنیاد، دانشجویانی که به دلایل مختلف متقاضی دریافت حمایت هستند، حتی اگر معدل بالایی نداشته باشند، از سوی معاونت دانشجویی دانشگاه شناسایی می‌شوند. این دانشجویان پس از انجام مصاحبه به بنیاد حامیان معرفی خواهند شد تا با پشتیبانی خیرین و حامیان دانشگاه، کمک‌هزینه ماهانه دریافت کنند. غلامی گفت سال گذشته حدود هزار و ۵۰۰ دانشجو تحت پوشش کمک‌هزینه تحصیلی بنیاد قرار داشتند و پیش‌بینی می‌شود امسال نیز تقریبا همین تعداد از حمایت‌های بنیاد بهره‌مند شوند. کپی لینک ارائه دو نوع وام به دانشجویان نوع حمایت مالی از هر دانشجو با تشخیص معاونت دانشجویی دانشگاه تهران مشخص می‌شود. این حمایت‌ها شامل وام قرض‌الحسنه و وام شرافتی است. در طرح وام شرافتی، دانشجو می‌تواند مبلغ دریافت‌شده را هر زمان که توانایی مالی داشت و به میزانی که برایش امکان‌پذیر بود، بازپرداخت کند."}, {"source": "Zoomit", "title": "تقابل صنعت E-commerce و FMCG؛ آیا تجارت الکترونیک صنعت کالاهای تندمصرف را دچار چالش می‌کند؟", "link": "https://www.zoomit.ir/iran-news/467199-ecommerce-fmcg-data-supply-chain-okala/", "summary": "در پنل تخصصی صنعت پخش، فعالان بازار بر اهمیت داده‌های رفتار مصرف‌کننده و توسعه مدل‌های ترکیبی آنلاین و آفلاین در حوزه FMCG تاکید کردند.", "date_str": "2026-09-14T12:05:00+00:00", "hash": "49fd729910d1bf04", "title_fa": "تقابل صنعت E-commerce و FMCG؛ آیا تجارت الکترونیک صنعت کالاهای تندمصرف را دچار چالش می‌کند؟", "summary_fa": "در پنل تخصصی صنعت پخش، فعالان بازار بر اهمیت داده‌های رفتار مصرف‌کننده و توسعه مدل‌های ترکیبی آنلاین و آفلاین در حوزه FMCG تاکید کردند. تبلیغات رشد تجارت الکترونیک در سال‌های اخیر، بسیاری از صنایع را با پرسش‌های جدیدی مواجه کرده است؛ آیا مدل‌های دیجیتال قرار است جایگزین ساختارهای سنتی شوند یا این که آینده بازار در هم‌زیستی و ترکیب این دو شکل خواهد گرفت؟ صنعت کالاهای تندمصرف (FMCG) یکی از حوزه‌هایی است که بیش از سایر صنایع با این تغییر مواجه شده است؛ صنعتی که سال‌ها بر پایه شبکه گسترده فروشگاه‌ها، شرکت‌های پخش، ویزیتورهای فروش و ارتباط مستقیم با خرده‌فروشی‌ها شکل گرفته، امروز با بازیگران جدیدی مواجه است که تجربه خرید، داده‌های رفتا شتی پارچه‌ای روی شانه، نشانه‌ای از چابکی و راحتی به حساب"}, {"source": "Zoomit", "title": "بسیاری از مردان از ارتباط میان لبنیات و سرطان پروستات آگاهی ندارند", "link": "https://www.zoomit.ir/health-medical/466998-dairy-intake-prostate-cancer-risk/", "summary": "شیر، پنیر و ماست از منابع مهم پروتئین و کلسیم هستند، اما برخی پژوهش‌ها ارتباط احتمالی میان مصرف زیاد آن‌ها و سلامت پروستات را مطرح کرده‌اند.", "date_str": "2026-09-14T10:10:00+00:00", "hash": "3a86741b67b3ae02", "title_fa": "بسیاری از مردان از ارتباط میان لبنیات و سرطان پروستات آگاهی ندارند", "summary_fa": "شیر، پنیر و ماست از منابع مهم پروتئین و کلسیم هستند، اما برخی پژوهش‌ها ارتباط احتمالی میان مصرف زیاد آن‌ها و سلامت پروستات را مطرح کرده‌اند. تبلیغات سرطان پروستات یکی از شایع‌ترین سرطان‌ها در میان مردان است و عوامل مختلفی مانند سن، ژنتیک، سبک زندگی و تغذیه می‌توانند در خطر ابتلا به آن نقش داشته باشند. در سال‌های اخیر، پژوهشگران ارتباط میان مصرف برخی مواد غذایی، از جمله محصولات لبنی، و سلامت پروستات را بررسی کرده‌اند. برخی پژوهش‌ها نشان داده‌اند که مصرف بالای محصولات لبنی ممکن است با افزایش خطر ابتلا به سرطان پروستات ارتباط داشته باشد، اما این ارتباط هنوز به‌معنای اثبات رابطه علت و معلولی نیست. دانشمندان همچنان در حال بررسی این موضوع هستند که آیا خود لبنیات، مقدار مصرف، ترکیبات موجود در آن‌ها یا عوامل دیگری مانند الگوی کلی تغذیه می‌توانند در این ارتباط نقش داشته باشند یا خیر. مصرف زیاد محصولات لبنی، ممکن است با افزایش خطر سرطان پروستات ارتباط داشته باشد، اما این ارتباط هنوز قطعی نیست نظرسنجی جدیدی در آمریکا نشان می‌دهد بسیاری از مردان از این موضوع آگاهی ندارند. در این نظرسنجی از ۱۱۰۲ مرد آمریکایی درباره آگاهی آن‌ها از ارتباط احتمالی میان مصرف لبنیات و سرطان پروستات پرسیده شد. فقط ۲۰ درصد از شرکت‌کنندگان گفته بودند از این ارتباط گزارش‌شده اطلاع دارند. بخش زیادی از شواهد موجود درباره ارتباط لبنیات و سرطان پروستات از مطالعات مشاهده‌ای به دست آمده است. در این نوع پژوهش‌ها، محققان الگوهای تغذیه‌ای و وضعیت سلامت افراد را بررسی می‌کنند، اما نمی‌توانند به‌طور قطعی مشخص کنند که یک ماده غذایی باعث ایجاد بیماری شده است."}, {"source": "Zoomit", "title": "مجلس: دولت سازمان ملی هوش مصنوعی را هرچه سریع‌تر تشکیل دهد", "link": "https://www.zoomit.ir/iran-news/467188-national-ai-law-private-sector/", "summary": "دبیر اول کمیسیون صنایع مجلس خواستار تسریع در تشکیل سازمان ملی هوش مصنوعی شد و بر نقش تنظیم‌گر دولت و مشارکت شرکت‌های دانش‌بنیان تأکید کرد.", "date_str": "2026-09-14T10:09:43+00:00", "hash": "8a188c47fb818afd", "title_fa": "مجلس: دولت سازمان ملی هوش مصنوعی را هرچه سریع‌تر تشکیل دهد", "summary_fa": "دبیر اول کمیسیون صنایع مجلس خواستار تسریع در تشکیل سازمان ملی هوش مصنوعی شد و بر نقش تنظیم‌گر دولت و مشارکت شرکت‌های دانش‌بنیان تأکید کرد. تبلیغات علی حدادی، دبیر اول کمیسیون صنایع و معادن مجلس، قانون ملی هوش مصنوعی را یکی از دستاوردهای راهبردی مجلس دوازدهم دانست و گفت اجرای دقیق آن می‌تواند به توسعه اقتصاد دیجیتال و استفاده از فناوری‌های نوین در بخش‌های مختلف کشور کمک کند. حدادی در گفت‌وگو با خانه ملت، با اشاره به ابلاغ این قانون از سوی رئیس مجلس به مسعود پزشکیان، اعلام کرد اجرای آن می‌تواند ساختارهای اداری و آموزشی کشور را توانمند کند و در حوزه‌هایی مانند بهینه‌سازی مصرف انرژی و تأمین امنیت غذایی نیز اثرگذار باشد. او هم‌چنین تقویت شبکه اطلاعات کشور، سامان‌دهی فضای مجازی و کاهش آسیب‌پذیری در برابر حملات سایبری را از دیگر زمینه‌های اثرگذاری این قانون عنوان کرد. به گفته این نماینده مجلس، قانون ملی هوش مصنوعی شامل ۱۲ ماده و هشت تبصره است و در جریان تدوین آن، مسئولان وزارت ارتباطات، پژوهشگران، استادان دانشگاه و دیگر صاحب‌نظران در جلسات کمیسیون صنایع و معادن حضور داشته‌اند. حدادی حوزه آموزش، پژوهشکده‌ها و شرکت‌های دانش‌بنیان را از مهم‌ترین بخش‌هایی دانست که اجرای قانون می‌تواند فعالیت آن‌ها را تسهیل کند. دبیر اول کمیسیون صنایع و معادن تاکید کرد دولت باید ابتدا آیین‌نامه‌های اجرایی را مطابق اهداف قانون‌گذار تدوین کند و سپس براساس ماده ۲، «سازمان ملی هوش مصنوعی» را به‌عنوان سازمانی مستقل و دبیرخانه شورای ملی راهبری هوش مصنوعی، زیر نظر رئیس‌جمهور تشکیل دهد."}, {"source": "Zoomit", "title": "افرادی که می‌توانستند ثروتمند شوند اما ترجیح دادند دنیا را جای بهتری کنند", "link": "https://www.zoomit.ir/human-science/467149-public-good-inventors-featured/", "summary": "از واکسن فلج اطفال تا کد‌های وب؛ داستان واقعی نوابغی که به ثروت و پاداش‌های کلان مالی پشت کردند تا اختراعاتشان رایگان بماند.", "date_str": "2026-09-14T10:00:00+00:00", "hash": "99080dcc80fcc901", "title_fa": "افرادی که می‌توانستند ثروتمند شوند اما ترجیح دادند دنیا را جای بهتری کنند", "summary_fa": "از واکسن فلج اطفال تا کد‌های وب؛ داستان واقعی نوابغی که به ثروت و پاداش‌های کلان مالی پشت کردند تا اختراعاتشان رایگان بماند. تبلیغات دنیایی را تصور کنید که برای هر بار کلیک روی یک لینک در وب، باید چند سنت عوارض می‌پرداختید؛ یا انسولین آن‌قدر گران بود که دیابت، حکمی برابر با مرگ تدریجی داشت. در دنیای امروز که غول‌های فناوری سر رنگ یک دکمه یا لوگوی یک اپلیکیشن میلیاردی دعوای حقوقی به راه می‌اندازند، همه‌چیز حول انحصار و سندزدن نوآوری‌ها می‌چرخد. اما گاهی خالقان حیاتی‌ترین دستاوردهای بشر، کنترل انحصاری دستاوردهایشان را کنار گذاشته‌اند تا زندگی سایر مردم را بهتر کنند؛ افرادی که درست در لحظه‌ی رسیدن به قله، بزرگ‌ترین چک‌های سفید امپراتوری مالی خود را پاره کردند. از فیزیک‌دانی که تصویر استخوان‌های دست همسرش را دید اما حاضر نشد روی اشعه‌ی ایکس حسابی باز کند، تا پزشکی که پتنت واکسن فلج اطفال را مثل مالکیت بر خورشید غیرقابل‌فروش دانست؛ برخی نوابغ نه قدیس بودند و نه انسان‌هایی بی‌نیاز؛ فقط تصمیم گرفتند درها را برای همیشه به روی تمام بشریت باز بگذارند. کپی لینک خلاصه صوتی خلاصه صوتی، ساخته‌شده با هوش مصنوعی کپی لینک فردریک بنتینگ؛ کاشف انسولین، داروی حیاتی در ازای سه اسکناس یک‌دلاری اوایل دهه‌ی ۱۹۲۰، ابتلا به دیابت نوع یک به معنای آغاز مرگی آهسته بود. پزشکان برای طولانی‌ترکردن عمر بیماران، رژیم‌هایی تجویز می‌کردند که روزانه چند صد کالری به بدن می‌رساند. کودکان نحیف می‌شدند؛ اما گرسنگی فقط اندکی مرگ را عقب می‌انداخت."}, {"source": "Zoomit", "title": "پیگیری سازمان سنجش برای برگزاری تافل و آیلتس؛ هنوز نتیجه قطعی حاصل نشده است", "link": "https://www.zoomit.ir/iran-news/467187-sanjesh-toefl-ielts-iranian-candidates/", "summary": "رئیس سازمان سنجش از مکاتبه با برگزارکنندگان تافل و آیلتس برای رفع مشکلات داوطلبان ایرانی خبر داد؛ رایزنی‌ها هنوز به نتیجه قطعی نرسیده است.", "date_str": "2026-09-14T09:46:50+00:00", "hash": "0bdd1ccca4f23f8b", "title_fa": "پیگیری سازمان سنجش برای برگزاری تافل و آیلتس؛ هنوز نتیجه قطعی حاصل نشده است", "summary_fa": "رئیس سازمان سنجش از مکاتبه با برگزارکنندگان تافل و آیلتس برای رفع مشکلات داوطلبان ایرانی خبر داد؛ رایزنی‌ها هنوز به نتیجه قطعی نرسیده است. تبلیغات رضا محمدی، رئیس سازمان سنجش آموزش کشور، از نامه‌نگاری با مراکز اصلی برگزارکننده آزمون‌های بین‌المللی برای پیگیری حقوق داوطلبان ایرانی خبر داد و گفت این سازمان در تلاش است امکان شرکت متقاضیان در آزمون‌های تافل و آیلتس را در داخل کشور یا محلی دیگر فراهم کند. محمدی در گفت‌وگو با مهر، توقف برگزاری این آزمون‌ها برای داوطلبان ایرانی را ناشی از تحریم‌های یک‌طرفه دانست. او گفت مؤسسه ETS، برگزارکننده تافل، در پی سیاست‌های تحریمی آمریکا امکان شرکت ایرانیان در این آزمون را قطع کرده است. به گفته رئیس سازمان سنجش، دو ایمیل به ETS ارسال شده و این مؤسسه در پاسخ اعلام کرده که موضوع در دست بررسی است. محمدی افزود ETS از این تصمیم رضایت ندارد، اما ملزم به تبعیت از سیاست‌های دولت آمریکاست. او همچنین از رایزنی و مکاتبه با نمایندگی IDP درباره آزمون آیلتس خبر داد و تأکید کرد هدف این پیگیری‌ها، فراهم‌کردن شرایط شرکت داوطلبان در آزمون‌ها، کاهش خروج ارز و جلوگیری از ایجاد مشکلات بیشتر برای متقاضیان است. رئیس سازمان سنجش اضافه کرد این تلاش‌ها هنوز به نتیجه قطعی نرسیده و پیگیری از مراکز اصلی برگزارکننده آزمون‌ها ادامه دارد."}, {"source": "Zoomit", "title": "قیمت گلکسی S26 سامسونگ هم افزایش می‌یابد؛ ادعای منابع آگاه", "link": "https://www.zoomit.ir/mobile/467116-samsung-galaxy-s26-price-hike/", "summary": "سامسونگ در پی افزایش شدید بهای رم، ظاهرا به‌دنبال گران‌کردن دوباره‌ی سری گلکسی S26 است.", "date_str": "2026-09-14T09:40:00+00:00", "hash": "0e3a4a75baf7c050", "title_fa": "قیمت گلکسی S26 سامسونگ هم افزایش می‌یابد؛ ادعای منابع آگاه", "summary_fa": "سامسونگ در پی افزایش شدید بهای رم، ظاهرا به‌دنبال گران‌کردن دوباره‌ی سری گلکسی S26 است. تبلیغات سامسونگ احتمالا می‌خواهد بهای تمام مدل‌های گلکسی S26 را از تاریخ ۱ اکتبر ۲۰۲۶ (۹ مه str": "2026-09-14T07:00:00+00:00", "hash": "c2100669e4dc3420", "title_fa": "چگونه بدون آلارم از خواب بیدار شویم؟", "summary_fa": "بیدار شدن ناگهانی با زنگ ساعت یا آلارم گوشی، به سیستم عصبی ضربه می‌زند، اما با رعایت چند راهکار ساده، می‌توان بدن را برای بیداری طبیعی آماده کرد. تبلیغات آلارم بیدار شدن را سخت‌تر می‌کند؟ پاسخ در بسیاری از موارد مثبت است. بیدار شدن با آلارم، به‌ویژه وقتی از دل خواب خوب بیرون کشیده می‌شوید، می‌تواند ضربه‌ای ناگهانی به بدن وارد کند. تپش قلب، آشفتگی و حالتی که اغلب به نام اضطراب آلارم شناخته می‌شود، هم آزاردهنده است و هم می‌تواند از همان لحظه‌ی اول، کل سیستم عصبی را به‌هم بریزد. در مقابل، بدن انسان با ساعت طبیعی خود، طوری طراحی شده که در صورت دریافت نشانه‌های درست، بدون آلارم و صدا از خواب بیدار شود. با ایجاد چند تغییر ساده در روال روزانه ، می‌توان بدن را برای بیداری طبیعی آموزش داد. بیداری طبیعی به مغز کمک می‌کند تا زمان ترشح کورتیزول، یعنی هورمون طبیعی بیدارباش را بهتر تنظیم کند و گذار آرام‌تری از خواب به شروع روز بسازد. خواب انسان از چرخه‌هایی حدوداً ۹۰ دقیقه‌ای تشکیل می‌شود و در هر چرخه، بدن از مراحل گوناگونی از جمله خواب عمیق و خواب رِم (REM) عبور می‌کند. اگر آلارم درست در زمان خواب عمیق شما را بیدار کند، احتمال گیجی و منگی بالا می‌رود؛ حالتی که با نام اینرسی خواب شناخته می‌شود و نتیجه‌ی قطع فرایند ترمیمی بدن در میانه‌ی مسیر است. فشردن دکمه‌ی «اسنوز» هم کمکی نمی‌کند. چند دقیقه خواب اضافه شاید در ظاهر خوشایند باشد، همین وقفه‌های کوتاه می‌توانند چرخه‌ی تازه‌ای از خواب را آغاز کنند که دوباره با صدای بعدی قطع می‌شود و در نهایت، هنگام بیدار شدن، احساس کسالت بیشتری به‌جا می‌گذارد. استفاده‌ی مداوم از آلارم حتی می‌تواند به شکل‌گیری نوعی اضطراب خواب منجر شود؛ به‌طوری که بعضی افراد شب‌ها بارها بیدار می‌شوند تا ساعت را چک کنند و نگران خواب ماندن باشند. زنگ بلند و"}, {"source": "Zoomit", "title": "هشدار سم آلتمن درباره دو مسیر خطرناک در پیشرفت هوش مصنوعی", "link": "https://www.zoomit.ir/ai-articles/467171-sam-altman-ai-safety-framework/", "summary": "سم آلتمن، مدیرعامل اوپن‌ای‌آی، با انتشار بیانیه‌ای خواستار ایجاد چارچوب‌های ایمنی و کنترل سرعت توسعه مدل‌های پیشرفته هوش مصنوعی شد.", "date_str": "2026-09-14T06:59:51+00:00", "hash": "6ba4f4f48187ec80", "title_fa": "هشدار سم آلتمن درباره دو مسیر خطرناک در پیشرفت هوش مصنوعی", "summary_fa": "سم آلتمن، مدیرعامل اوپن‌ای‌آی، با انتشار بیانیه‌ای خواستار ایجاد چارچوب‌های ایمنی و کنترل سرعت توسعه مدل‌های پیشرفته هوش مصنوعی شد. تبلیغات مدیرعامل اوپن‌ای‌آی با انتشار بیانیه‌ای بر ضرورت رفتاری مسئولانه در مسیر توسعه فناوری‌های نوین تأکید کرد و از لزوم کاهش سرعت پیشرفت مدل‌های هوش مصنوعی پیشرفته برای تضمین ایمنی سخن گفت. آلتمن می‌گوید شرکت‌های پیشرو باید استانداردهای امنیتی سخت‌گیرانه‌تری را پیش از آغاز فرایندهای یادگیری تقویتی سنگین پیاده‌سازی کنند تا قابلیت‌های مدل‌ها از سازوکارهای نظارتی فراتر نرود. به گفته‌ی آلتمن: «جهان شایسته‌ی اطمینان از این موضوع است که شرکت‌های آمریکاییِ توسعه‌دهنده‌ی هوش مصنوعیِ با قابلیت‌های فزاینده، مسئولانه عمل خواهند کرد؛ به‌ویژه در شرایطی که روند پیشرفت پرشتاب‌تر شده است. هر شرکت پیشرویی باید این اطمینان را ایجاد کند و اگر نمی‌توانیم، دلیلی ندارد هیچ‌یک از ما سر کار بیاییم.» آلتمن دو خطر عمده را تهدیدکننده‌ی آینده بشر دانست که شامل از دست رفتن کنترل بر سرنوشت جهان به نفع هوش مصنوعی و تمرکز بیش از حد قدرت در دست یک دولت یا شرکت خاص می‌شود. مدیرعامل اوپن‌ای‌آی، گفت: «وقتی از تنظیم سرعت صحبت می‌کنیم، منظورمان توقف نیست. پیشرفت سریع بوده است و همچنان ادامه خواهد داشت، اما باید کندتر از آنچه می‌تواند باشد پیش برود؛ اقداماتی مانند پرونده‌های ایمنی و نظارت، هزینه‌های چشمگیری دارند.»"}, {"source": "Zoomit", "title": "شیائومی دو تبلت جدید با نمایشگر بزرگ و تراشه اسنپدراگون معرفی کرد", "link": "https://www.zoomit.ir/tablet/467158-xiaomi-pad-9-pro-announced/", "summary": "شیائومی تبلت‌های پد ۹ و پد ۹ پرو را با نمایشگر پروضوح و نرخ ۱۴۴ هرتز رونمایی کرد.", "date_str": "2026-09-14T06:50:00+00:00", "hash": "788f22ad5d0e2f96", "title_fa": "شیائومی دو تبلت جدید با نمایشگر بزرگ و تراشه اسنپدراگون معرفی کرد", "summary_fa": "شیائومی تبلت‌های پد ۹ و پد ۹ پرو را با نمایشگر پروضوح و نرخ ۱۴۴ هرتز رونمایی کرد. تبلیغات شیائومی پس از رونمایی تبلت پرچمدار پد ۹ پرو مکس، تبلت‌های پد ۹ و پد ۹ پرو را در بازار چین معرفی کرد . هر دو دستگاه به نمایشگر باکیفیت، باتری پرظرفیت و پردازنده‌های سری اسنپدراگون مجهز هستند؛ اما برخلاف نسخه‌ی مکس از تراشه‌ی اختصاصی XRING O3 بهره نمی‌برند. هر دو تبلت شیائومی از پنل LCD با وضوح 3.2K (۳۲۰۰ در ۲۱۳۶ پیکسل)، نسبت تصویر ۳:۲، نرخ نوسازی ۱۴۴ هرتز و عمق رنگ ۱۲ بیتی بهره می‌برند. پوشش کامل گستره‌ی رنگی DCI-P3، پشتیبانی از استانداردهای HDR10، HDR Vivid و دالبی ویژن در کنار گواهی‌های محافظت چشم و قابلیت لمس با دستان مرطوب در هر دو مدل حضور دارد. امکانات نرم‌افزاری نظیر ابزار اداری WPS و برنامه‌ی ویرایش ویدیو CapCut Pro به‌همراه پشتیبانی از قلم مغناطیسی و کیبورد نیز در دسترس کاربران قرار دارد. تبلت شیائومی پد ۹ پرو به نمایشگر ۱۲٫۵ اینچی با حداکثر روشنایی ۱۰۰۰ نیت و پردازنده‌ی ۳ نانومتری اسنپدراگون ۸ نسل ۵ با حداکثر فرکانس ۳٫۸ گیگاهرتز مجهز است. مدل استاندارد پد ۹ از صفحه‌نمایش ۱۱٫۲ اینچی با روشنایی ۸۰۰ نیت و تراشه‌ی اسنپدراگون 8s نسل ۴ استفاده می‌کند. ظرفیت باتری در مدل پرو به ۱۱٬۰۰۰ میلی‌آمپرساعت می‌رسد و از شارژ ۶۷ وات و شارژ معکوس ۲۲٫۵ وات پشتیبانی می‌کند، درحالی‌که نسخه‌ی پایه دارای باتری ۹٬۷۲۰ میلی‌آمپرساعتی با توان شارژ ۴۵ وات است."}, {"source": "Zoomit", "title": "قابلیت‌های جدید فراسیب؛ از چت هوش مصنوعی تا پرداخت ارزی", "link": "https://www.zoomit.ir/pr/467168-farasib-ai-chat-international-payment/", "summary": "فراسیب با افزودن ابزار چت هوش مصنوعی و سرویس پرداخت ارزی، امکان دسترسی ساده‌تر و تومانی کاربران ایرانی به خدمات بین‌المللی را فراهم کرد.", "date_str": "2026-09-14T06:42:22+00:00", "hash": "f36d46e585ea1fc7", "title_fa": "قابلیت‌های جدید فراسیب؛ از چت هوش مصنوعی تا پرداخت ارزی", "summary_fa": "این مطلب صرفا جنبه تبلیغاتی داشته و زومیت هیچ مسئولیتی را در رابطه با آن نمی‌پذیرد فراسیب با افزودن ابزار چت هوش مصنوعی و سرویس پرداخت ارزی، امکان دسترسی ساده‌تر و تومانی کاربران ایرانی به خدمات بین‌المللی را فراهم کرد. چت هوش مصنوعی فراسیب برای ایجاد تجربه‌ای ساده‌تر از کار با هوش مصنوعی طراحی شده است. کاربران می‌توانند با هزینه ای بسیار کم از طریق این پلتفرم برای کارهایی مانند پرسش‌وپاسخ، تولید و بازنویسی م y": "مدیرعامل بخش گیمینگ مایکروسافت از رویکرد جدید و برنامه‌های خود برای حل چالش‌های ایکس‌باکس و بازگشت به سودآوری خبر داد.", "date_str": "2026-09-14T05:30:00+00:00", "hash": "8e7f7e1ad973b2e4", "title_fa": "رئیس جدید ایکس‌باکس راه نجات برند را در «شفافیت با مردم» می‌بیند", "summary_fa": "مدیرعامل بخش گیمینگ مایکروسافت از رویکرد جدید و برنامه‌های خود برای حل چالش‌های ایکس‌باکس و بازگشت به سودآوری خبر داد. تبلیغات آشا شارما ، مدیرعامل ایکس‌باکس، با تأکید بر اصل «شفافیت یعنی مهربانی»، راهبرد جدید خود را برای مقابله با افت درآمدها و کندی رشد سرویس گیم‌پس آغاز کرد. وال‌استریت ژورنال در گزارشی به بررسی دیدگاه‌های مدیریتی شارما پس از تصدی هدایت بخش گیمینگ مایکروسافت پرداخت. تاد هاوارد درباره‌ی شیوه‌ی ارتباطی او نوشت: «شارما به‌شکلی منحصربه‌فرد در عبور از حواشی و برقراری ارتباط واضح مهارت دارد؛ این‌که مسائل دقیقا کجا هستند و فرصت‌ها در چه نقطه‌ای قرار دارند.» شارما درباره‌ی انگیزه‌ی پذیرش مسئولیت هدایت ایکس‌باکس گفت: «موضوع این نبود که آیا می‌خواهم این کار را انجام دهم؟، بلکه مسئله این بود که آیا باور دارم می‌توانم ارزش منحصربه‌فردی به مجموعه اضافه کنم؟» مدیرعامل ایکس باکس با صراحت اعلام کرد وضعیت فعلی رضایت‌بخش نیست و مدل پیشین گیم پس کارایی لازم را نداشت. مدیران ارشد مایکروسافت انتظار دارند اجرای این تغییرات ساختاری، ایکس‌باکس را در سال مالی آینده دوباره به مسیر سودآوری برگرداند."}, {"source": "Zoomit", "title": "نتیجه مطالعه‌ای بزرگ: همیشه لازم نیست آنتی‌بیوتیک‌ها را تا آخر مصرف کنیم", "link": "https://www.zoomit.ir/health-medical/465519-stopping-antibiotics-early-health-risks/", "summary": "توصیه قدیمی آنتی‌بیوتیک را تا آخر مصرف کنید، برای همه عفونت‌ها یک قاعده قطعی نیست؛ پژوهش‌های جدید از درمان‌های کوتاه‌تر در برخی موارد حمایت می‌کند.", "date_str": "2026-09-14T05:00:00+00:00", "hash": "51268c51d9a1b072", "title_fa": "نتیجه مطالعه‌ای بزرگ: همیشه لازم نیست آنتی‌بیوتیک‌ها را تا آخر مصرف کنیم", "summary_fa": "توصیه قدیمی آنتی‌بیوتیک را تا آخر مصرف کنید، برای همه عفونت‌ها یک قاعده قطعی نیست؛ پژوهش‌های جدید از درمان‌های کوتاه‌تر در برخی موارد حمایت می‌کند. تبلیغات برای چند دهه، یکی از ثابت‌ترین توصیه‌ها درباره مصرف آنتی‌بیوتیک این بوده است: «دوره درمان را تا آخر ادامه دهید، حتی اگر حالتان بهتر شد.» این توصیه تا حد زیادی با این تصور شکل گرفت که قطع زودهنگام دارو می‌تواند بخشی از باکتری‌ها را زنده نگه دارد و زمینه را برای مقاومت آنتی‌بیوتیکی فراهم کند. اکنون شواهد جدید نشان می‌دهد این قاعده برای همه عفونت‌ها و همه بیماران یکسان صدق نمی‌کند. مطالعه‌‌ای جدید نشان می‌دهد دوره‌های کوتاه‌تر درمان برای برخی عفونت‌های باکتریایی رایج می‌توانند به‌اندازه دوره‌های طولانی‌تر مؤثر باشند. بااین‌حال، باور قدیمی «هرچه طولانی‌تر، بهتر» همچنان در میان بسیاری از بیماران ریشه دارد. برای بسیاری از عفونت‌های باکتریایی رایج، دوره‌های کوتاه‌تر آنتی‌بیوتیک به اندازه‌ی دوره‌های طولانی‌تر مؤثر و ایمن هستند آلیستر تورپ، پژوهشگر سلامت جمعیت در دانشگاه یوتا، می‌گوید سازمان‌های بهداشتی و پزشکان در گذشته با تأکید زیادی از بیماران می‌خواستند همیشه دوره تجویزشده را کامل کنند. به‌گفته او، شواهد جدید نشان می‌دهند چنین توصیه‌ای همیشه درست نیست و در بسیاری از موارد، درمان کوتاه‌تر می‌تواند به همان اندازه ایمن و مؤثر باشد. در چند دهه گذشته، بیش از ۱۲۰ کارآزمایی تصادفی کنترل‌شده، مدت‌زمان مناسب مصرف آنتی‌بیوتیک را در عفونت‌های مختلف بررسی کرده‌اند. نتایج بسیاری از این پژوهش‌ها نشان می‌دهد که برای بعضی از عفونت‌های رایج، دوره‌های کوتاه‌تر نه‌تنها از نظر درمان بیماری تفاوت معناداری با دوره‌های طولانی ندارند، بلکه می‌توانند میزان مواجهه غیرضروری بدن با آنتی‌بیوتیک را نیز کاهش دهند."}, {"source": "Zoomit", "title": "رونمایی آیفون دوئو، طرفداران سامسونگ را برای گلکسی زد فولد ۹ هیجان‌زده کرد!", "link": "https://www.zoomit.ir/mobile/467110-galaxy-z-fold-9-apple-rivalry/", "summary": "عرضه نخستین گوشی تاشدنی اپل رقابت تازه‌ای در بازار ایجاد کرده و انتظارات از گلکسی زد فولد ۹ سامسونگ را افزایش داده است.", "date_str": "2026-09-14T04:45:00+00:00", "hash": "47e338f346bc352b", "title_fa": "رونمایی آیفون دوئو، طرفداران سامسونگ را برای گلکسی زد فولد ۹ هیجان‌زده کرد!", "summary_fa": "عرضه نخستین گوشی تاشدنی اپل رقابت تازه‌ای در بازار ایجاد کرده و انتظارات از گلکسی زد فولد ۹ سامسونگ را افزایش داده است. تبلیغات ورود اپل به بازار گوشی‌های تاشدنی با عرضه‌ی آیفون دوئو معادلات این بخش از بازار را دستخوش تغییر کرد. کاربران و علاقه‌مندان اکنون با حساسیت بیشتری برنامه‌های سامسونگ را برای نسل بعدی تاشدنی‌هایش دنبال می‌کنند . حضور اپل می‌تواند انگیزه‌ای قوی برای سامسونگ ایجاد کند تا ویژگی‌های برجسته‌تری به گلکسی زد فولد ۹ بیفزاید. پیش از معرفی محصول جدید کوپرتینویی‌ها، کاربران اپل برای تجربه‌ی گوشی تاشدنی چاره‌ای جز خرید گوشی اندرویدی نداشتند؛ اما اکنون شرایط رقابت کاملا تغییر کرده است. کارشناسان احتمال می‌دهند سامسونگ در گلکسی زد فولد ۹ روی بهبود دوربین، افزایش شارژدهی باتری، کاهش چین‌خوردگی نمایشگر و ارتقای رابط کاربری تمرکز کند. همچنین بازگشت قابلیت‌هایی مانند حالت Flex Mode در گلکسی زد فولد ۸ وجود ندارد، یکی از احتمالات مطرح‌شده به شمار می‌رود. چرخه‌ی طولانی‌مدت توسعه‌ی سخت‌افزار احتمالا بخشی از مشخصات فنی گلکسی زد فولد ۹ را پیش‌تر تثبیت کرده است. از سوی دیگر شاید سامسونگ تحولات بنیادین و بزرگ‌تر را برای جشن ۱۰ سالگی سری فولد و معرفی گلکسی زد فولد ۱۰ نگه دارد."}, {"source": "Zoomit", "title": "رویداد نادر در آسمان ایران؛ زهره امروز در روشنایی روز پشت ماه پنهان می‌شود", "link": "https://www.zoomit.ir/space/467150-venus-moon-occultation-shahrivar-1405/", "summary": "امروز بعدازظهر، هلال باریک ماه در روشنایی روز از مقابل زهره می‌گذرد و این سیاره را برای حدود یک ساعت از دید ناظران زمینی پنهان می‌کند.", "date_str": "2026-09-14T04:00:00+00:00", "hash": "f672c4818f7ec27f", "title_fa": "رویداد نادر در آسمان ایران؛ زهره امروز در روشنایی روز پشت ماه پنهان می‌شود", "summary_fa": "امروز بعدازظهر، هلال باریک ماه در روشنایی روز از مقابل زهره می‌گذرد و این سیاره را برای حدود یک ساعت از دید ناظران زمینی پنهان می‌کند. تبلیغات دوشنبه ۲۳ شهریور ۱۴۰۵، یکی از جذاب‌ترین رویدادهای نجومی سال در آسمان رخ می‌دهد: ماه از مقابل زهره می‌گذرد و این سیاره درخشان را برای حدود یک ساعت از دید ناظران زمینی پنهان می‌کند. این پدیده که «اختفای زهره توسط ماه» نام دارد، از بخش‌هایی از اروپا، آفریقا، خاورمیانه و آسیا مشاهده‌پذیر است و ایران در میان بهترین مناطق دنیا برای تماشای آن قرار دارد. ویژگی  مصنوعی در طول حیات نسل کنونی راه درمان سرطان را کشف خواهد کرد.", "date_str": "2026-09-13T20:10:00+00:00", "hash": "87ddc567771725ce", "title_fa": "مدیر آرم: هوش مصنوعی به درمان سرطان دست پیدا خواهد کرد", "summary_fa": "مدیرعامل شرکت آرم باور دارد که هوش مصنوعی در طول حیات نسل کنونی راه درمان سرطان را کشف خواهد کرد. تبلیغات مدیرعامل آرم، بزرگ‌ترین شرکت فناوری بریتانیا، اعلام کرد هوش مصنوعی قادر خواهد بود در طول حیات نسل فعلی، روش درمانی برای بیماری سرطان بیابد که انسان‌ها به‌تنهایی توان دستیابی به آن را ندارند. رنه هاس توضیح داد اگرچه مدل‌سازی تاثیر سرطان بر نشانگرهای ژنتیکی امروزه بسیار پیچیده است؛ اما کامپیوترها در آینده توان حل این معمای پزشکی را خواهند داشت. هاس تأکید کرد هوش مصنوعی طی پنج سال آینده زمینه‌ی گسترش گسترده‌ی ربات‌های انسان‌نما را فراهم می‌کند. او کمبود شدید تراشه برای دیتاسنترها را مانع اصلی سرعت رشد کنونی این حوزه دانست و راه‌اندازی کارخانه‌های بومی ساخت تراشه در خاک بریتانیا را نیز غیراقتصادی ارزیابی کرد. مدیرعامل آرم می‌گوید: «هوش مصنوعی درمانی برای سرطان پیدا خواهد کرد که امروز من و شما یا سایر انسان‌ها در طول عمر خود نمی‌توانستیم به آن برسیم. باور دارم در طول زندگی ما، هوش مصنوعی به درمان سرطان کمک می‌کند. مدل‌سازی یک سلول، انسان یا چگونگی تاثیر سرطان بر نشانگر DNA نه فقط برای انسان امروز، بلکه برای کامپیوترهای مجری هوش مصنوعی نیز بسیار پیچیده است. هرچه مدل‌های بیشتری وارد سیستم‌ها شوند و دستگاه‌ها برای پردازش پیچیده‌تر شوند، این معما حل خواهد شد.» پروفسور کریس باکال ، مدیر ارشد مؤسسه تحقیقات سرطان لندن، گفت: «پرسش اصلی دیگر استفاده از این فناوری نیست، بلکه نوع داده‌های ورودی مطرح خواهد بود. آینده‌ی هوش مصنوعی پزشکی به سازنده‌ی بزرگ‌ترین کامپیوترها تعلق ندارد، بلکه در اختیار مراکزی است که دقیق‌ترین اندازه‌گیری‌ها را در دست دارند. این پیش‌بینی‌ها سال‌ها از زمان توسعه‌ی درمان‌های جدید می‌کاهد.»"}, {"source": "Zoomit", "title": "پیوند دو پدیده پنهان جهان؛ آیا ماده تاریک و انرژی تاریک به یکدیگر متصل هستند؟", "link": "https://www.zoomit.ir/space/466980-dark-dimension-could-link-two-universes-great-unknowns/", "summary": "رصدهای اخیر نشان می‌دهند که .zoomit.ir/business/467073-enflame-ai-chip-stock-surge/", "summary": "سهام شرکت Enflame، سازنده‌ی چینی پردازنده‌های هوش مصنوعی، در نخستین روز عرضه‌ی عمومی در بورس شانگهای با رشد چشمگیر ۲۰۶ درصدی همراه شد.", "date_str": "2026-09-13T18:50:00+00:00", "hash": "3ccba062643731ad", "title_fa": "جنگ تراشه‌ها در اوج؛ جهش خیره‌کننده رقیب چینی انویدیا در بازار بورس", "summary_fa": "سهام شرکت Enflame، سازنده‌ی چینی پردازنده‌های هوش مصنوعی، در نخستین روز عرضه‌ی عمومی در بورس شانگهای با رشد چشمگیر ۲۰۶ درصدی همراه شد. تبلیغات سهام شرکت انفلیم، سازنده‌ی چینی تراشه‌های هوش مصنوعی و رقیب انویدیا، در نخستین روز عرضه‌ی عمومی در بورس شانگهای ۲۰۶ درصد رشد کرد. حجم تقاضای خرد برای خرید سهام پیش از تخصیص سهمیه‌های بیشتر، به بیش از ۶ هزار برابر تعداد سهام عرضه‌شده رسید. به گزارش CNBC ، غول فناوری تنسنت از حامیان اصلی انفلیم به شمار می‌رود. انفلیم آخرین عضو از گروه موسوم به «چهار اژدهای کوچک» تراشه‌سازی هوش مصنوعی چین است که وارد بازار سهام می‌شود. پیش‌تر، سهام متا ایکس (MetaX) در روز اول معاملات نزدیک به ۷۰۰ درصد، Moore Threads بیش از ۴۰۰ درصد و Biren نیز ۷۶ درصد جهش قیمت را ثبت کرده بودند. داده‌های مؤسسه‌ی آماری IDC نشان می‌دهد سازندگان بین‌المللی با هدایت انویدیا نزدیک به ۶۰ درصد از بازار شتاب‌دهنده‌های هوش مصنوعی چین را در سال ۲۰۲۵ در اختیار داشتند. محدودیت‌های صادراتی ایالات متحده و سیاست‌های خودکفایی پکن، مسیر رشد رقبای داخلی را هموارتر کرد. مؤسسه‌ی گلدمن ساکس پیش‌بینی می‌کند هزینه‌های سرمایه‌ای چین در بخش تراشه‌سازی تا سال ۲۰۳۰ به ۸۲ میلیارد دلار برسد. در همین راستا، استارتاپ‌هایی نظیر مون‌شات ای‌آی با مدل Kimi K3 فاصله‌ی خود را با مدل‌های پیشروی آمریکایی کاهش داده‌اند و مدل GLM-5.3-Flash متعلق به شرکت Z.ai به‌طور کامل از تراشه‌های ساخت چین بهره می‌برد. درآمد انفلیم در سال ۲۰۲۵ با افزایش نسبت‌به سال گذشته به ۹۹۰ میلیون یوان (معادل ۱۴۷ میلیون دلار) رسید؛ هرچند هنوز به سودآوری خالص نرسیده است."}, {"source": "Zoomit", "title": "خشکسالی در جنوب غرب آمریکا؛ بزرگ‌ترین مخزن آب نیومکزیکو تقریباً خشک شده است", "link": "https://www.zoomit.ir/energy-environment/467022-elephant-butte-dam-drought-  میان مالک زمین، برنامه‌ی توسعه شهری و مسیر یک بزرگراه بود. کپی لینک وقتی بزرگراه و ساختمان بر سر یک زمین به مشکل خوردند داستان Gate Tower Building به دهه‌ی ۱۹۸۰ بازمی‌گردد. زمینی که امروز این ساختمان روی آن قرار دارد، سال‌ها در اختیار یک شرکت فعال در حوزه‌ی چوب و زغال بود. با تغییر منابع انرژی و کاهش استفاده از زغال، ساختمان‌های قدیمی این مجموعه فرسوده شدند و مالکان تصمیم گرفتند زمین را دوباره توسعه دهند. در سال ۱۹۸۳ طرح بازسازی منطقه تأیید شد، اما یک مشکل وجود داشت: مسیر برنامه‌ریزی‌شده‌ی بزرگراه هانشین از همان زمین عبور می‌کرد. مجوز ساخت ساختمان جدید صادر نمی‌شد و مالک هم حاضر نبود از حقوق خود روی زمین صرف‌نظر کند. در نهایت، پس از حدود پنج سال مذاکره میان مالکان و شرکت بزرگراه هانشین، راه‌حلی پیدا شد که در آن هیچ‌کدام از طرفین مجبور به کنار گذاشتن کامل خواسته خود نشدند."}, {"source": "Zoomit", "title": "ایالت کالیفرنیا به محدودکردن چت‌بات‌ها و ممنوعیت شبکه‌های اجتماعی برای نوجوانان فکر می‌کند", "link": "https://www.zoomit.ir/social-network/467071-california-bans-addictive-social-media/", "summary": "فرماندار کالیفرنیا با امضای ۱۳ لایحه‌ی جدید، استفاده‌ی نوجوانان از قابلیت‌های اعتیادآور شبکه‌های اجتماعی و چت‌بات‌های هوش مصنوعی را به‌شدت محدود کرد.", "date_str": "2026-09-13T15:50:00+00:00", "hash": "6596398516053523", "title_fa": "ایالت کالیفرنیا به محدودکردن چت‌بات‌ها و ممنوعیت شبکه‌های اجتماعی برای نوجوانان فکر می‌کند", "summary_fa": "فرماندار کالیفرنیا با امضای ۱۳ لایحه‌ی جدید، استفاده‌ی نوجوانان از قابلیت‌های اعتیادآور شبکه‌های اجتماعی و چت‌بات‌های هوش مصنوعی را به‌شدت محدود کرد. تبلیغات نوجوانان ساکن کالیفرنیا به‌زودی از دسترسی به قابلیت‌های اعتیادآور شبکه‌های اجتماعی و تعامل نامحدود با چت‌بات‌های هوش مصنوعی منع خواهند شد. گوین نیوسام ، فرماندار ایالت کالیفرنیا، ۱۳ لایحه‌ی مختلف را با هدف محافظت از کودکان و نوجوانان در فضای مجازی امضا کرد تا شرکت‌های فناوری را به بازطراحی سازوکارهای خود ملزم کند. مقررات جدید پلتفرم‌های اینترنتی را وادار می‌کند تا ابزارهایی مانند اسکرول بی‌پایان و پخش خودکار ویدیوها را برای کاربران زیر ۱۶ سال متوقف یا از حضور این افراد در پلتفرم جلوگیری کنند. بنیاد مرزهای الکترونیکی ضمن ناقص دانستن این مصوبه هشدار داد که تعاریف گسترده می‌تواند دسترسی جوانان به اطلاعات ضروری را قطع کند. نیوسام می‌گوید: «والدین نمی‌توانند رقابت کنند. نمی‌توان با مهندسی و الگوریتم‌ها رقابت کرد. آدم حس می‌کند والد بسیار بدی است.» بخش دیگری از مصوبات قانونی به یاد آدام رین ، نوجوانی که پس از دریافت توصیه‌هایی از ChatGPT جان خود را از دست داد، نام‌گذاری شده است. لایحه‌ی یادشده محدودیت‌های زمانی برای خردسالان تعیین می‌کند، منابع سلامت روان داخلی را اجباری می‌سازد و توسعه‌دهندگان را موظف می‌کند در صورت شناسایی تهدید به خودآسیبی، والدین را مطلع کنند؛ عدم رعایت این موارد مسئولیت قانونی در پی دارد. ربکا باوئر-کاهان، نماینده مجلس ایالتی کالیفرنیا و یکی از نویسندگان طرح، گفت: «کسانی از ما که در این مقطع زمانی نوجوان تربیت می‌کنند، می‌دانند بحران سلامت روان جوانان یک واقعیت روزمره است. حتی یک نفر در میان ما نیست که این موضوع را از نزدیک ندیده باشد.»"}, {"source": "Zoomit", "title": "دکل مخابراتی پرنده؛ آزمایش موفقیت‌آمیز فناوری ارائه اینترنت از استراتوسفر", "link": "https://www.zoomit.ir/aviation-aerospace/467099-sceye-stratospheric-direct-mobile-internet/", "summary": "شرکتی آمریکایی با بالن بدون سرنشین در ارتفاع استراتوسفر، ارتباط اینترنتی، تماس صوتی و پیام‌رسانی مستقیم با گوشی‌های معمولی را آزمایش کرد.", "date_str": "2026-09-13T15:30:00+00:00", "hash": "0fc85331dea8bdef", "title_fa": "دکل مخابراتی پرنده؛ آزمایش موفقیت‌آمیز فناوری ارائه اینترنت از استراتوسفر", "summary_fa": "شرکتی آمریکایی با بالن بدون سرنشین در ارتفاع استراتوسفر، ارتباط اینترنتی، تماس صوتی و پیام‌رسانی مستقیم با گوشی‌های معمولی را آزمایش کرد. تبلیغات یک شرکت هوافضایی آمریکایی، آزمایش فناوری جدیدی را به پایان رسانده که می‌تواند در آینده به جایگزینی برای بخشی از دکل‌های مخابراتی زمینی و حتی برخی سامانه‌های ماهواره‌ای تبدیل شود. این فناوری یک بالن بزرگ مجهز به تجهیزات ارتباطی است که در ارتفاعات بالای جو قرار می‌گیرد و می‌تواند مستقیماً به گوشی‌های موبایل اینترنت و خدمات ارتباطی ارائه دهد. شرکت Sceye اعلام کرد پلتفرم آزمایشی ST1 پس از یک سفر رفت‌وبرگشت حدود ۳۰هزار کیلومتری میان آمریکا و ژاپن، توانسته قابلیت‌های ارتباطی خود را در شرایط واقعی بررسی کند. این سامانه ۹ اوت ۲۰۲۶ از نیومکزیکو در آمریکا پرتاب شد و پس از عبور از اقیانوس آرام، به محدوده هوایی ژاپن رسید. ST1 حدود یک هفته در نزدیکی ژاپن فعالیت کرد تا توانایی خود را برای ارائه اینترنت پهن‌باند مستقیم به گوشی‌های موبایل آزمایش کند. هدف اصلی مأموریت، بررسی کاربرد فناوری ارتباطی مبتنی بر بالن در مناطقی بود که به‌دلیل بلایای طبیعی مانند زلزله، سیل یا طوفان، دچار قطع زیرساخت‌های ارتباطی زمینی شده‌اند. در چنین شرایطی، یک پلتفرم ارتباطی شناور در ارتفاع بالا می‌تواند بدون نیاز به ساخت دکل جدید، پوشش ارتباطی را سریع‌تر بازگرداند. فناوری سکای در دسته پلتفرم‌های ارتفاع بالا یا HAPS قرار می‌گیرد. این سامانه‌ها در ارتفاعی حدود ۲۰ کیلومتری سطح زمین، یعنی در بخش بالایی استراتوسفر فعالیت می‌کنند. برخلاف هواپیماها، این وسیله برای ماندن در هوا به موتورهای قدرتمند و مصرف مداوم سوخت نیاز ندارد. بدنه آن با کمک هلیوم در آسمان معلق می‌ماند و پنل‌های خورشیدی نصب‌شده روی سطحش انرژی تجهیزات ارتباطی را تأمین می‌کنند."}, {"source": "Zoomit", "title": "اوراکل زیر فشار هوش مصنوعی؛ ۷۰۰ میلیون دلار هزینه تازه برای تعدیل نیرو", "link": "https://www.zoomit.ir/business/467070-oracle-700m-job-cuts-ai-crunch/", "summary": "اوراکل در پی فشارهای مالی ناشی از توسعه‌ی دیتاسنترها هوش مصنوعی، تعدیل نیروی خود را افزایش داد.", "date_str": "2026-09-13T15:20:00+00:00", "hash": "5df50083053f08d4", "title_fa": "اوراکل زیر فشار هوش مصنوعی؛ ۷۰۰ میلیون دلار هزینه تازه برای تعدیل نیرو", "summary_fa": "اوراکل در پی فشارهای مالی ناشی از توسعه‌ی دیتاسنترها هوش مصنوعی، تعدیل نیروی خود را افزایش داد. تبلیغات اوراکل به‌دلیل مواجهه با کمبود نقدینگی ناشی از توسعه‌ی پرهزینه‌ی دیتاسنترها برای هوش مصنوعی، ابعاد برنامه‌ی تعدیل نیروی خود را افزایش داد . بخش عمده‌ی هزینه‌های این طرح شامل پرداخت حق سنوات و مزایای پایان خدمت به نیروهای اخراج‌شده می‌شود. مجموع هزینه‌ی طرح تعدیل نیروی کار اوراکل با عنوان «برنامه‌ی بازسازی ۲۰۲۶» اکنون به حدود ۲٫۸ میلیارد دلار می‌رسد. اوراکل تاکنون حدود ۲٫۱ میلیارد دلار برای این فرایند هزینه ثبت کرده و افزایش ۷۰۰ میلیون دلاری جدید بازتاب‌دهنده‌ی اقدامات اجرایی تازه‌ای خواهد بود که در دستور کار قرار دارند. سرمایه‌گذاری سنگین روی زیرساخت‌های محاسباتی برای مشتریانی نظیر OpenAI فشار مالی قابل‌توجهی بر منابع نقدی شرکت وارد کرده است. اوراکل تا اواسط خرداد حدود ۴۹ هزار کارمند در آمریکا و ۹۲ هزار کارمند در سایر کشورها داشت که نشان‌دهنده‌ی کاهش ۲۱ هزار نفری نیروی کار نسبت‌به سال قبل به‌شمار می‌رود. اوراکل همچنین از برنامه‌ی جدید معاملاتی برای لری الیسون ، رئیس هیئت‌مدیره و مالک حدود ۴۰ درصد از سهام این مجموعه، خبر داد. الیسون مجاز است تا اوایل آبان حداکثر ۵۰ میلیون سهم خود را که در زمان تصویب طرح حدود ۸٫۷۵ میلیارد دلار ارزش داشت به فروش برساند."}, {"source": "Business Insider", "title": "I'm 55 with a college degree, working in retail to stay afloat. It's been hard to get past the shame and find purpose.", "link": "https://www.businessinsider.com/have-college-education-working-in-retail-in-50s-challenging-2026-9", "summary": "At first, I felt shame about working a retail job. Now, I m grateful to be doing it and recognize the value of helping others in different ways. Tammy Rabideau At 55, I took a part-time job at a department store. I didn't expect to be working retail at my age. I have a degree and decades of experience in social work, but I liked this job's flexibility. This job offers less stress and only slightly lower pay than another role in my field I applied for. I'd been up since 4 a.m., sitting at my computer with an email ready to rescind my acceptance of a customer-service job at a large department store. It was August 2025, and I was supposed to start that morning. Shame had me hovering over the \"send\" button. I wondered how it had come to this. I had a college education, decades of experience in social work, and had spent the last six years writing for major publications. Yet here I was, back in a department store, doing the kind of customer-service work I had first done as a teenager. Only now I was 55. I didn't think the work was beneath me, but at my age, I believed I should be \"further along\" in my career. I thought I should either be supporting myself as a writer or using my education and experience in social work and mental health, doing work that felt more meaningful. Returning to retail felt like going backward. Still, I deleted the draft and got ready for my shift. At first, I pretended I was volunteering to get past the shame I felt As much as I d love for writing to fully support me financially, I needed another job. aire images/Getty Images I got through my first days at the customer-service desk by telling myself I could leave whenever I wanted. I pretended I was a volunteer who also got paid. This mental trick helped, but the truth was I needed a job — and I needed money. I'd moved to Iowa City two years earlier with my partner, but a year later, we separated. Until then, my freelance work had been enough to cover my share of the bills. Now that I was on my own, I needed more income. I looked for both full-time and part-time jobs in social work and mental health, but couldn't find the right fit. The positions either paid too little or had hours and stress levels that would leave me too drained to keep writing, my true passion. The retail job paid a couple of dollars less than a social-work role I'd applied for, but offered flexible hours and what felt like a manageable amount of stress. In time, my coworkers made me feel like I belonged Connecting ", "date_str": "2026-09-14T12:44:01+00:00", "hash": "b9e040d0d374d1e9", "title_fa": "من 55 سال دارم و مدرک دانشگاهی دارم و در خرده فروشی کار می کنم تا سرپا بمانم. گذر از شرم و یافتن هدف سخت بوده است.", "summary_fa": "در ابتدا از کار کردن در یک شغل خرده فروشی احساس شرمندگی کردم. اکنون، من از این که این کار را انجام می دهم سپاسگزارم و ارزش کمک به دیگران را به روش های مختلف تشخیص می دهم. تامی رابیدو در 55 سالگی، در یک فروشگاه بزرگ مشغول به کار نیمه وقت شدم. من انتظار نداشتم در سنم خرده فروشی کار کنم. من مدرک و چندین دهه تجربه در زمینه مددکاری اجتماعی دارم، اما انعطاف پذیر ران بد از بوستون شناخته شوند. لیزا لیک/ گتی ایماژ شهرهایی مانند نیویورک، لس آنجلس، و دیترویت مدت‌هاست که به‌عنوان مراکز اصلی گروه‌های نمادین خدمت کرده‌اند. با این حال، هر ایالت حداقل به یک گروه می بالد که می تواند آن را گروه خود بنامد. OneRepublic معروف است که اهل کلرادو است و آلاباما از - حدس زدید - آلاباما است. موسیقی عالی فقط در چند شهر نمادین یافت نمی شود - در هر گوشه ای از ایالات متحده می چرخد. هر ایالت گروه‌های بسیاری را تولید کرده است که به تعریف صدای آن کمک کرده و اثری ماندگار در تاریخ موسیقی به جا گذاشته است. برای شناسایی مشهورترین گروه از هر ایالت، Business Insider شهرت، رکورد فروش و جوایز را سنجید. مهمتر از همه، هر عمل در چارچوب دوران خود مورد قضاوت قرار گرفت، زیرا برترین های امروز نمودار لزوماً افسانه های دهه های گذشته را تحت الشعاع قرار نمی دهند. در ایالت هایی با چندین رقیب نمادین، ما این عوامل را سنجیدیم تا مشخص کنیم کدام گروه بیشترین امتیاز کلی را به جا گذاشته است. ما به طور انحصاری بر روی گروه‌ها تمرکز کردیم - بدون اجرای انفرادی - اما رویکردی انعطاف‌پذیر نسبت به آنچه که به‌عنوان یک \"گروه\" محسوب می‌شود، اتخاذ کردیم، از جمله هر اثر موسیقی متشکل از بیش از یک نفر. در حالی که ما در درجه اول به محل تشکیل هر گروه نگاه می‌کردیم، همچنین در نظر گرفتیم که موسیقی آن‌ها کجا رونق گرفته است و زادگاهی که آنها را شکل داده است. بنابراین، کدام گروه ایالت شما را روی نقشه قرار می دهد؟ بیایید دریابیم. امی مارتین و کریستی دانر در نسخه قبلی این مقاله مشارکت داشتند. آلاباما: آلاباما فریزر هریسون/ گتی"}, {"source": "Business Insider", "title": "The hot new job in tech as AI apocalypse fears reach a tipping point", "link": "https://www.businessinsider.com/what-is-embedded-evaluator-ai-apocalypse-dario-amodei-hire-2026-9", "summary": "AI chiefs are committing to a new role in their companies: embedded evaluators WEF Get ready to hear a lot about \"embedded evaluators.\" Anthropic CEO Dario Amodei made the case for embedding independent AI auditors in frontier labs. They'll have employee-like access, access badges, and company laptops, he said. The next high-profile AI hire may not be another researcher, but an \"embedded evaluator\" tasked with scrutinizing frontier models before they're released. In a blog post on Saturday, Anthropic CEO Dario Amodei said frontier AI labs should commit to embedding independent safety evaluators within their organizations. The embedded evaluators' job is to check whether the company \"is actually following the training, deployment, operational, and safeguards practices they claim to be following,\" Amodei wrote. He said embedded evaluators will have \"employee-like access to verify safety practices and report incidents.\" They will have desks in the Anthropic offices, access badges, and company laptops, as well as the right to publish any findings without Anthropic's editorial control. \"We will have the narrow ability to redact security-sensitive, legally privileged, commercially sensitive, or third-party confidential information, but we can't redact findings just because they are unfavorable,\" Amodei wrote. Amodei's plan comes as fears of an AI apocalypse reach a fever pitch, and it received an outpouring of support, even from executives he's feuded with. OpenAI CEO Sam Altman , reposting Amodei's X post, wrote: \"Committing to having independent evaluators with employee-like access is a great idea, and we will do the same.\" SpaceXAI CEO Elon Musk also reposted Amodei's post, adding: \"Dario is right.\" The idea has also received some VC attention. Sriram Krishnan, a former Andreessen Horowitz partner and former AI advisor to President Donald Trump, spoke about the importance of a distributed network of evaluators. \"The more eyes and people with distributed skill sets the better,\" Krishnan said in a Saturday X post. \"It would be a good idea to fund several efforts on this.\" Top AI talent is migrating to this space Amodei already has candidates in mind for the new job. In his post, he mentioned Berkeley-based Metr , a prominent nonprofit AI watchdog that conducts independent evaluations of AI models. Metr, established in 2022 by ex-OpenAI staffer Beth Barnes, is attracting top talent from the biggest AI labs. Joe Benton, previously a member of Anthropic's safety a", "date_str": "2026-09-14T11:53:58+00:00", "hash": "067b32b9d8725c20", "title_fa": "شغل جدید داغ در فناوری با ترس از آخرالزمان هوش مصنوعی به نقطه اوج رسیده است", "summary_fa": "روسای هوش مصنوعی در حال متعهد شدن به نقش جدیدی در شرکت های خود هستند: ارزیاب های تعبیه شده WEF برای شنیدن چیزهای زیادی در مورد \"ارزیابی کنندگان جاسازی شده\" آماده شوید. داریو آمودی، مدیر عامل آنتروپیک، از تعبیه حسابرسان مستقل هوش مصنوعی در آزمایشگاه‌های مرزی خبر داد. او گفت که آنها دسترسی کارمند، نشان های دسترسی و لپ تاپ های شرکت خواهند داشت. ممکن است استخدام‌کننده‌ی برجسته‌ی هوش مصنوعی دیگر محقق دیگری نباشد، بلکه یک «ارزیابی‌کننده تعبیه‌شده» باشد که وظیفه دارد مدل‌های مرزی را قبل از انتشار بررسی کند. داریو آمودی، مدیر عامل آنتروپیک در یک پست وبلاگی در روز شنبه گفت که آزمایشگاه‌های هوش مصنوعی مرزی باید متعهد شوند که ارزیاب‌های ایمنی مستقل را در سازمان خود تعبیه کنند. آمودی نوشت: وظیفه ارزیاب‌های تعبیه‌شده این است که بررسی کنند آیا شرکت «واقعاً شیوه‌های آموزشی، استقرار، عملیاتی و حفاظتی را که ادعا می‌کنند دنبال می‌کنند، دنبال می‌کند یا خیر». او گفت که ارزیاب‌های تعبیه‌شده «دسترسی کارمندی برای تأیید اقدامات ایمنی و گزارش حوادث» خواهند داشت. آن‌ها میزهایی در دفاتر آنتروپیک، نشان‌های دسترسی و لپ‌تاپ‌های شرکت خواهند داشت و همچنین حق انتشار یافته‌ها را بدون کنترل تحریریه آنتروپیک خواهند داشت. آمودی نوشت: «ما توانایی محدودی برای حذف اطلاعات محرمانه حساس به امنیت، دارای امتیاز قانونی، تجاری حساس یا شخص ثالث خواهیم داشت، اما نمی‌توانیم یافته‌ها را فقط به دلیل نامطلوب بودن آنها اصلاح کنیم. طرح آمودی در حالی انجام می‌شود که ترس از یک آخرالزمان هوش مصنوعی به اوج خود رسیده است و حتی از سوی مدیرانی که او با آنها مخالفت می‌کند، حمایت زیادی را دریافت کرده است. سام آلتمن، مدیر عامل OpenAI، با بازنشر پست X Amodei، نوشت: \"تعهد به داشتن ارزیاب های مستقل با دسترسی کارمندان مانند ایده بسیار خوبی است و ما نیز همین کار را انجام خواهیم داد.\" ایلان ماسک، مدیرعامل SpaceXAI نیز پست آمودی"}, {"source": "Business Insider", "title": "Tech stocks are tumbling as AI apocalypse fears go mainstream", "link": "https://www.businessinsider.com/ai-warnings-spark-decline-in-tech-stocks-nvidia-slides-2026-9", "summary": "AI-linked stocks sold off in premarket trading on Monday after tech leaders called for a slower approach to developing powerful artificial intelligence. credit should read CFOTO/Future Publishing via Getty Images Tech stocks fell premarket as AI warnings from Dario Amodei and Elon Musk fueled investor concerns. Nvidia and SpaceX both slipped amid AI slowdown calls, with memory companies also set for big losses. Asian markets, particularly chipmakers, took a hit with SoftBank shares tumbling more than 10%. Tech stocks slipped in premarket trading Monday after a weekend of increasingly dire warnings about AI . Nvidia and SpaceX were both down 2% in premarket trading around 7:30 a.m. ET. Nasdaq 100 futures pointed to a 1.4% decline at the open, suggesting the selling could extend across large-cap tech. The weakness followed a weekend in which Anthropic CEO Dario Amodei urged AI companies to slow the \"reckless\" pace of development, warning that increasingly capable AI agents could eventually cause severe economic damage. The call gained backing from some of the industry's biggest names . OpenAI CEO Sam Altman, Google DeepMind CEO Demis Hassabis, and SpaceX boss Elon Musk all supported Amodei's proposal to pace frontier AI development. Altman said OpenAI would match Anthropic's commitment to embed outside evaluators in the company to assess its safety practices. Investor concerns were also sharpened by Jacob Coxon, a former researcher at OpenAI and Anthropic who resigned last week , saying the rival labs were \"gambling with our lives\" in their race to build self-improving AI. The market reaction was particularly severe in Asia, where chipmakers and AI-infrastructure suppliers have been major beneficiaries  داد که عوامل هوش مصنوعی با توانایی فزاینده در نهایت می توانند آسیب های اقتصادی شدیدی به بار آورند. این تماس از سوی برخی از بزرگ‌ترین نام‌های این صنعت حمایت شد. سام آلتمن، مدیر عامل OpenAI، دمیس حسابیس، مدیر عامل گوگل دیپ مایند و ایلان ماسک، رئیس اسپیس ایکس، همگی از پیشنهاد Amodei برای سرعت بخشیدن به توسعه هوش مصنوعی مرزی حمایت کردند. آلتمن گفت OpenAI با تعهد Anthropic برای تعبیه ارزیاب های خارجی در شرکت برای ارزیابی شیوه های ایمنی آن مطابقت دارد. نگرانی سرمایه‌گذاران توسط Jacob Coxon، محقق سابق OpenAI و Anthropic نیز تشدید شد که هفته گذشته استعفا داد"}, {"source": "Business Insider", "title": "Lovable CEO Anton Osika quoted a famous essay about death by nuclear war as AI apocalypse fears hit a boiling point", "link": "https://www.businessinsider.com/lovable-ceo-shares-advice-for-living-with-ai-fears-2026-9", "summary": "Lovable CEO Anton Osika. Sam Barnes/Sportsfile for Web Summit via Getty Images Lovable CEO Anton Osika shared a Cold War-era essay on nuclear war amid fears that AI is going to wipe out humanity. Osika invoked C.S. Lewis to say existential fears should not dominate daily life. Atomic bombs \"may break our bodies but they need not dominate our minds,\" Lewis wrote in 1948. Amid the escalating AI doomsday debate , Lovable CEO Anton Osika offered a glimmer of calm over the weekend. The Swedish startup founder shared a passage by C.S. Lewis, the British author and Christian thinker best known for \"The Chronicles of Narnia,\" about how to live under the threat of atomic war. \"Every unprecedented moment has a precedent somewhere,\" Osika wrote in an X post on Saturday. The passage, from Lewis' 1948 essay \"On Living in an Atomic Age,\" argues that people should not let the prospect of catastrophe swallow up ordinary life. \"If we are all going to be destroyed by an atomic bomb, let that bomb when it comes find us doing sensible and human things — praying, working, teaching, reading, listening to music, bathing the children, playing tennis, chatting with friends over a pint and a game of darts — not huddled together like frightened sheep and thinking about bombs,\" Lewis wrote. \"They may break our bodies,\" Lewis wrote of atomic bombs, \"but they need not dominate our minds.\" Osika's post came days after Jacob Coxon, a 27-year-old researcher who spent about three years at OpenAI and Anthropic, quit the latter with a stark warning about the AI race. Coxon said the two frontier labs were racing toward self-improving superintelligence while \"gambling with our lives.\" His resignation has reignited a fierce debate over whether advanced AI could pose an extinction-level threat. In a LinkedIn post last week, Osika said warnings such as Coxon's \"need to be taken seriously.\" He said the companies building the most powerful AI systems should have to prove they can keep them under control, and backed slowing dangerous development when safety cannot be demonstrated. Others have pushed back on the most apocalyptic forecasts. AI researcher Gary Marcus said there was \"no realistic scenario\" for near-term human extinction , while Santa Fe Institute professor Melanie Mitchell called such fears \"far-fetched.\" Over the weekend, Anthropic CEO Dario Amodei and OpenAI CEO Sam Altman publicly backed efforts to pace frontier AI development and bring in third-party safety evaluators. The Trump adm", "date_str": "2026-09-14T11:04:49+00:00", "hash": "99bef92adc56885f", "title_fa": "مدیر عامل دوست داشتنی آنتون اوسیکا مقاله معروفی را در مورد مرگ بر اثر جنگ هسته ای نقل کرد که ترس از آخرالزمان هوش مصنوعی به نقطه جوش رسیده است.", "summary_fa": "مدیر عامل دوست داشتنی آنتون اوسیکا. سام بارنز/فایل ورزشی برای وب سامیت از طریق گتی ایماژ، مدیر عامل دوست داشتنی آنتون اوسیکا، مقاله ای از دوران جنگ سرد در مورد جنگ هسته ای در میان ترس از اینکه هوش مصنوعی بشریت را از بین می برد، به اشتراک گذاشت. اوسیکا از سی. اس. لوئیس خواست تا بگوید ترس های وجودی نباید بر زندگی روزمره تسلط داشته باشند. لوئیس در سال 1948 نوشت: بمب‌های اتمی ممکن است بدن ما را بشکنند، اما نیازی به تسلط بر ذهن ما ندارند. بنیانگذار استارت‌آپ سوئدی متنی از سی‌اس. لوئیس، نویسنده بریتانیایی و متفکر مسیحی که بیشتر برای «تواریخ نارنیا» شهرت دارد، درباره چگونگی زندگی در زیر تهدید جنگ اتمی به اشتراک گذاشت. اوسیکا در پست ایکس روز شنبه نوشت: «هر لحظه بی سابقه در جایی سابقه دارد. این قطعه، از مقاله 1948 لوئیس «درباره زندگی در عصر اتمی»، استدلال می‌کند که مردم نباید اجازه دهند چشم‌انداز فاجعه زندگی عادی را ببلعد. \"اگر قرار است همه ما توسط یک بمب اتمی نابود شویم، اجازه دهید وقتی آن بمب زمانی که می آید، ما را در حال انجام کارهای معقول و انسانی بیابد - دعا، کار، آموزش، خواندن، گوش دادن به موسیقی، حمام کردن بچه ها، بازی تنیس، گپ زدن با دوستان بر روی یک پینت و یک بازی دارت - نه اینکه مثل گوسفندان ترسیده دور هم جمع شده باشیم و به بمب ها فکر کنیم.\" لوئیس درباره بمب‌های اتمی می‌نویسد: «آنها ممکن است بدن ما را بشکنند، اما لازم نیست بر ذهن ما تسلط داشته باشند». پست Osika چند روز پس از آن منتشر شد که Jacob Coxon، محقق 27 ساله ای که حدود سه سال را در OpenAI و Anthropic گذراند، با هشداری جدی در مورد مسابقه هوش مصنوعی از این دومی کنار رفت. کوکسون گفت که دو آزمایشگاه مرزی در حالی که"}, {"source": "Business Insider", "title": "3 ex-Apple researchers want to make AI less awkward. Lightspeed, Accel, and Nvidia are giving them $50 million to do it.", "link": "https://www.businessinsider.com/former-apple-researchers-raise-50-million-to-build-foundational-model-2026-9", "summary": "Nuance cofounders all worked at Apple before launching their startup. Nuance Nuance has raised $50M to build an audiovisual to audiovisual AI model. Nuance wants to build AI chatbots with real-time reactions and human-like nuances. Lightspeed led the round, with participation from Accel, Nvidia's NVentures, and South Park Commons. A startup that's trying to make AI models better conversationalists with more emotional intelligence has just raised $50 million. Seattle-based Nuance says it wants to build models that can hold face-to-face conversations without the lag and awkwardness of existing chatbots. Fangchang Ma, Nuance's cofounder and CEO, said that existing voicebots or AI avatars are built by duct-taping together voice-to-text generation, a large language model responding to those texts, and text-to-voice generation. This leads to a lot of latency and missing human nuances, such as reactions and microexpressions. \"If you use existing AI avatars, when they're listening, they're not reacting, or they're just doing random things,\" Ma said. Ma, and his two co-founders, all of whom are former researchers at Apple, wanted to build a long-term solution, even though it would be more technically challenging. \"We decided to build this on one system, on one model. There's audio video in and audio video out,\" Ma said. Ma said that the data needed to train its models cannot be scraped from the internet and that it collects data in-house or from data partners. \"The perfect data for us will be, imagine the two of us having this conversation, we're having to record it,\" he said. \"I want audiovisual from both sides. Both participants are visible, soundtracks cleanly separated, and then it's also natural, not performative.\" While the startup is pre-product, Ma said he sees it offering an experience where someone can hop on a video call with an AI to practice interviews , give presentations, or learn a new language. The company plans to sell to businesses, too, and said that use cases can include AI interviewers, sales reps, and customer support. The company plans to open a research preview of its model to the public later this year. Nuance, which was founded last year, has now raised a $50 million Series A round led by Lightspeed Venture Partners, with participation from Accel, Nvidia's NVentures, South Park Commons, and Define Ventures. It follows a $10 million seed round led by Accel in July last year. Ma said that the startup has been using the cash flow to grow its", "date_str": "2026-09-14T11:00:01+00:00", "hash": "498f22707a5f7ff3", "title_fa": "3 محقق سابق اپل می خواهند هوش مصنوعی را کمتر بی دست و پا کنند. Lightspeed، Accel و Nvidia 50 میلیون دلار برای انجام این کار به آنها می دهند.", "summary_fa": "بنیانگذاران Nuance همگی قبل از راه اندازی استارت آپ خود در اپل کار می کردند. Nuance Nuance 50 میلیون دلار برای ساخت یک مدل هوش مصنوعی سمعی و بصری به سمعی و بصری جمع آوری کرده است. Nuance می خواهد چت ربات های هوش مصنوعی با واکنش های لحظه ای و تفاوت های ظریف انسان مانند بسازد. Lightspeed با مشارکت Accel، NVentures انویدیا، و South Park Commons در این دور پیشتاز شد. استارتاپی که تلاش می کند مدل های هوش مصنوعی را با هوش هیجانی بیشتر به گفتگوی بهتر تبدیل کند، به تازگی 50 میلیون دلار جمع آوری کرده است. Nuance مستقر در سیاتل می‌گوید که می‌خواهد مدل‌هایی بسازد که بتوانند مکالمات رو در رو بدون تاخیر و ناهنجاری چت‌بات‌های موجود انجام دهند. Fangchang Ma، بنیانگذار و مدیر عامل Nuance، گفت که ربات‌های صوتی یا آواتارهای هوش مصنوعی موجود با چسباندن مجرای تولید صدا به متن، یک مدل زبان بزرگ که به آن متون پاسخ می‌دهد و تولید متن به صدا ساخته می‌شوند. این منجر به تأخیر زیادی می شود و تفاوت های ظریف انسانی را از دست می دهد، مانند واکنش ها و بیان های کوچک. Ma گفت: «اگر از آواتارهای هوش مصنوعی موجود استفاده می‌کنید، وقتی گوش می‌دهند، واکنشی نشان نمی‌دهند یا فقط کارهای تصادفی انجام می‌دهند. ما و دو هم بنیانگذارش که همگی از محققان سابق اپل هستند، می خواستند راه حلی بلندمدت بسازند، حتی اگر از نظر فنی چالش برانگیزتر باشد. Ma گفت: \"ما تصمیم گرفتیم این را بر روی یک سیستم، بر روی یک مدل بسازیم. ویدئوهای صوتی در داخل و ویدئوهای صوتی خروجی وجود دارد.\" Ma گفت که داده‌های مورد نیاز برای آموزش مدل‌هایش را نمی‌توان از اینترنت حذف کرد و داده‌ها را در داخل یا از شرکای داده جمع‌آوری می‌کند. او گفت: \"داده های عالی برای ما این خواهد بود، تصور کنید ما"}, {"source": "Business Insider", "title": "The loud public debate over an AI apocalypse may be humanity's best defense against it", "link": "https://www.businessinsider.com/why-ai-apocalypse-debate-market-parallels-may-help-prevent-disaster-2026-9", "summary": "Anthropic CEO Dario Amodei and OpenAI CEO Sam Altman. Chris Ratcliffe/Bloomberg via Getty Images; Eric Lee/Bloomberg via Getty Images The AI-apocalypse debate has a silver lining: Everyone is watching. If you know what outcome to guard against, you play better defense, consciously or not. Sign up for First Trade , Business Insider's daily markets newsletter. Backlash against AI has been building for a while. But apocalyptic warnings in recent days have kicked it into a new gear. Warnings of bigger electric bills and job displacement suddenly feel like peanuts compared to the existential questions being asked. Who cares if your utility bill is higher if the world is barreling towards oblivion? The initial headliner of this new wave of apocalyptic warnings was Jacob Coxon, the Anthropic researcher who just quit, claiming that Anthropic and OpenAI are \" gambling with our lives .\" The floodgates opened after Coxon's now-infamous X post . Paul Christiano, a new appointee to OpenAI's board and safety committee, poured fuel on the flames the next day , saying that \"most people could die\" if we \"build superintelligence without more robust alignment\" and \"permanently lose control of it.\" Pretty heavy stuff! But it became pretty par for the course as more high-profile warnings were issued through the end of the week . Then, in a weekend essay, Anthropic CEO Dario Amodei wrote that he'd \" become convinced \" the breakneck pace of advancement must change, proposing a three-step safety plan. Altman said OpenAI would match Anthropic's commitment to give independent evaluators deep access, while Musk declared that \"Dario is right.\" It's all quite jarring, but there's a silver lining: All this sudden attention may make the worst-case outcome less likely. The logic goes that if you know what outcome to guard against, you play better defense, consciously or not. Open discussion leads to broader awareness. AI risks are now being earnestly debated by researchers, executives, regulators, investors, and the public in real time. That should help avoid an extinction-level event where everyone is caught off-guard. Market parallels The aftermath of the 2008 Global Financial Crisis offers an apt comparison, and potentially an aspirational story. The behavior of investors, financial institutions, and regulators changed after the market was caught fully exposed to a mortgage meltdown. Guarding against a repeat became a major priority. Never again would they underappreciate hidden risks", "date_str": "2026-09-14T09:50:01+00:00", "hash": "92038cf44e963c4c", "title_fa": "بحث عمومی پر سر و صدا در مورد آخرالزمان هوش مصنوعی ممکن است بهترین دفاع بشر در برابر آن باشد", "summary_fa": "داریو آمودی، مدیر عامل آنتروپیک و سام آلتمن، مدیر عامل OpenAI. کریس رتکلیف/بلومبرگ از طریق گتی ایماژ. اریک لی/ بلومبرگ از طریق گتی ایماژ بحث هوش مصنوعی درباره آخرالزمان یک خط نقره ای دارد: همه در حال تماشا هستند. اگر می‌دانید باید از چه نتیجه‌ای محافظت کنید، آگاهانه یا نه، دفاع بهتری بازی می‌کنید. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. واکنش شدید علیه هوش مصنوعی مدتی است که در حال افزایش است. اما هشدارهای آخرالزمانی در روزهای اخیر آن را وارد چرخه جدیدی کرده است. هشدارهای مربوط به قبض های بزرگتر برق و جابجایی شغلی در مقایسه با سؤالات وجودی که پرسیده می شود، ناگهان شبیه به بادام زمینی می شود. چه کسی اهمیت می دهد که صورتحساب آب و برق شما بالاتر باشد اگر جهان به سمت فراموشی می رود؟ سرفصل اولیه این موج جدید هشدارهای آخرالزمانی Jacob Coxon، محقق Anthropic بود که به تازگی ترک کرد و ادعا کرد که Anthropic و OpenAI \"با زندگی ما قمار می کنند.\" دروازه‌ها پس از پست X که اکنون بدنام بود، باز شد. پل کریستیانو، منصوب جدید هیئت مدیره و کمیته ایمنی OpenAI، روز بعد سوخت را روی شعله های آتش ریخت و گفت که \"اگر ما \"هوش فوق العاده را بدون همسویی قوی تر بسازیم\" و \"کنترل آن را برای همیشه از دست بدهیم\" بیشتر مردم می توانند بمیرند. چیزهای خیلی سنگین! اما از آنجایی که تا پایان هفته اخطارهای پرمخاطب تری صادر شد، برای دوره تقریباً برابر شد. سپس، در یک مقاله آخر هفته، داریو آمودی، مدیر عامل آنتروپیک، نوشت که «متقاعد شده» که سرعت سرسام آور پیشرفت باید تغییر کند و یک طرح ایمنی سه مرحله ای را پیشنهاد کرد. آلتمن گفت OpenAI با تعهد آنتروپیک برای دادن دسترسی عمیق به ارزیاب های مستقل مطابقت دارد، در حالی که ماسک اعلام کرد که"}, {"source": "Business Insider", "title": "Schonfeld's macro team has been on a growth tear, despite the departure of most of the starting team", "link": "https://www.businessinsider.com/schonfeld-macro-unit-growth-turnover-multistrategy-firm-2026-9", "summary": "Schonfeld Strategic Advisors is run by Ryan Tolkin. Bloomberg/Getty Images The majority of PMs from the day-one team of Schonfeld's macro unit have departed. The unit has grown considerably despite the departures, with the group now close to 150 investment staffers. The growth is an example of how the industry's biggest funds are more institutional than ever. Schonfeld Strategic Advisors' macro unit won't stop growing, even though early-day hires have left the $23 billion firm. The group — which invests across asset classes based on where it thinks global interest rates, inflation, and other economic trends are headed — has more than doubled its investment head count since last year, to nearly 150 investment staffers, a person close to the fund told Business Insider. It is run by co-heads Colin Lancaster and Mitesh Parikh and macro COO Omar Faruqui. Schonfeld's macro unit now runs close to a fifth of what the firm is putting out into various markets day in and day out, the person close to the firm said, and has added 15 new PMs in 2026. Those hires include a pair of Dubai-based Point72 traders, Prejesh Patel and Pierre-Anthony Bodin, and 25-year JPMorgan veteran Wentao Mu. Kevin McDonald, Balyasny's former deputy COO for the fund's fixed income and macro division, is also joining as the unit's co-COO. This recent growth has coincided with more and more members of the firm's day-one macro team leaving. It's an example of how the edge of Schonfeld and other multistrategy funds — the investing behemoths that have come to define the hedge fund industry with their scale, ambitions, and growth — comes from their structure, not their personnel. While no fund wants to lose talented people, a strong multistrategy firm should be able to weather departures and market volatility with strong risk systems and operational excellence. Schonfeld's macro unit trading in early 2022 with billions in leveraged capital and less than a dozen money managers. Nearly all of those early PMs have filtered out of the $23 billion firm, with former Goldman Sachs managing director Francesco Cafagna the lone exception. Recent early-day hires that have left include: Marwan Moubachir, the unit's former head of risk, who is joining Dymon Asia Amu Latif, the onetime global head of macro trading Manas Baveja, a PM who is also joining Dymon Asia as the Singapore-based firm's head of macro Ryan McCort, the unit's top recruiter, who joined rival Brevan Howard last fall Inside Schonfeld's macro ex", "date_str": "2026-09-14T09:41:01+00:00", "hash": "f6a03fb6ccd69b1a", "title_fa": "تیم کلان شونفلد علیرغم جدایی بیشتر تیم اصلی، دچار افت رشد شده است.", "summary_fa": "مشاوران استراتژیک شونفلد توسط رایان تالکین اداره می شود. بلومبرگ/گتی ایماژ اکثر نخست وزیران تیم روز اول واحد کلان شونفلد ترک کرده اند. این واحد علیرغم خروج، رشد قابل توجهی داشته است و گروه اکنون نزدیک به 150 کارمند سرمایه گذاری دارد. رشد نمونه ای از این است که چگونه بزرگترین صندوق های این صنعت بیش از هر زمان دیگری نهادی هستند. واحد کلان مشاوران استراتژیک شونفلد رشد خود را متوقف نخواهد کرد، حتی اگر استخدام های اولیه این شرکت 23 میلیارد دلاری را ترک کنند. یکی از افراد نزدیک به صندوق به Business Insider گفت که این گروه - که در بین طبقات دارایی سرمایه گذاری می کند بر اساس اینکه فکر می کند نرخ های بهره جهانی، تورم و سایر روندهای اقتصادی به چه سمتی می رود - از سال گذشته تعداد سرمایه گذاری خود را بیش از دو برابر کرده است و به نزدیک به 150 کارمند سرمایه گذاری رسیده است. این توسط کالین لنکستر و میتش پریخ و مدیر ارشد اجرایی کلان عمر فاروکی اداره می شود.
