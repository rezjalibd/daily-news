ل افتادند روی زمین. یعنی حتی نتوانستند تصمیم بگیرند که فرار کنند. شروع کردند تیر جنگی و ساچمه زدن و گاز اشک‌آور پرت کردن.» عرفان با دو اتهام «فعالیت تبلیغی علیه نظام مقدس جمهوری اسلامی از طریق شرکت در اغتشاشات» و «نگهداری ۶گرم و ۴سانتی‌گرم مواد مخدر ماشروم» به یازده سال حبس محکوم شده است. او می‌گوید که اتهام مواد مخدر بعد از آزادی به پرونده او اضافه شده است. ایران‌وایر دو سند را بررسی کرده که در هر یک، میزان متفاوتی از موادی که قوه قضاییه می‌گوید از او کشف شده، عنوان شده است. عرفان نبیان از لحظه بازداشت تا دوران بازجویی در بند «الف‌طا» تحت نظر اطلاعات سپاه بارها شکنجه شده است. انگشتان دستش را شکسته‌اند، کتفش را از جا در آورده‌اند و با پشت چاقو آن‌قدر بر کت‌هایش کوبیده‌اند که خون‌مرده شده و نمی‌توانسته حرکت کند. او یک بار هم روز آخر انفرادی اعدام مصنوعی شده است. عرفان می‌گوید که یکی از شکنجه‌گرانش را بارها کف خیابان در اصفهان دیده است. پس از آزادی با"}, {"source": "IranWire", "title": "هنگامه هادیانی، زن ژیمناست در مسابقات آسیایی؛ گروگان‌گیر از «تاریخ‌سازی» گروگانش می‌گوید", "link": "https://iranwire.com/fa/features/158052-%D9%87%D9%86%DA%AF%D8%A7%D9%85%D9%87-%D9%87%D8%A7%D8%AF%DB%8C%D8%A7%D9%86%DB%8C-%D8%B2%D9%86-%DA%98%DB%8C%D9%85%D9%86%D8%A7%D8%B3%D8%AA-%D8%AF%D8%B1-%D9%85%D8%B3%D8%A7%D8%A8%D9%82%D8%A7%D8%AA-%D8%A2%D8%B3%DB%8C%D8%A7%DB%8C%DB%8C-%DA%AF%D8%B1%D9%88%DA%AF%D8%A7%D9%86%DA%AF%DB%8C%D8%B1-%D8%A7%D8%B2-%D8%AA%D8%A7%D8%B1%DB%8C%D8%AE%D8%B3%D8%A7%D8%B2%DB%8C-%DA%AF%D8%B1%D9%88%DA%AF%D8%A7%D9%86%D8%B4-%D9%85%DB%8C%DA%AF%D9%88%DB%8C%D8%AF/", "summary": "سه سال پیش‌تر از امروز، یکی از بالاترین مدیران ورزش زنان جمهوری اسلامی می‌گفت ژیمناستیک زنان به‌دلیل پوشش مجوز نمی‌گیرد و ژیمناستیک ریتم ...", "date_str": "2026-09-25T07:23:04+00:00", "hash": "7b408734a08cf215", "title_fa": "هنگامه هادیانی، زن ژیمناست در مسابقات آسیایی؛ گروگان‌گیر از «تاریخ‌سازی» گروگانش می‌گوید", "summary_fa": "سه سال پیش‌تر از امروز، یکی از بالاترین مدیران ورزش زنان جمهوری اسلامی می‌گفت ژیمناستیک زنان به‌دلیل پوشش مجوز نمی‌گیرد و ژیمناستیک ریتم ... امروز حضور هنگامه هادیانی «تاریخی» خوانده می‌شود. اما همین «تاریخی بودن» یک پرسش را باقی می‌گذارد: اگر حضور یک زن ژیمناست ایرانی امروز مایه افتخار است، چرا زنان ایران برای رسیدن به آن نزدیک به نیم قرن منتظر ماندند؟ ۱۵اسفند۱۴۰۱، «مهین فرهادی‌زاده»، نایب‌رییس وقت زنان کمیته ملی المپیک، گفت ژیمناستیک زنان به‌دلیل پوشش مجوز نمی‌گیرد. او درباره ژیمناستیک ریتمیک نیز گفت این رشته «هیچ ارزش قهرمانی و مدالی» ندارد. سه سال و نیم بعد، «هنگامه هادیانی» نخستین زن ژیمناست ایران پس از انقلاب شد که در بازی‌های آسیایی به میدان رفت. رسانه‌های حکومتی این حضور را «تاریخ‌سازی» و «افتخاری ارزشمند» نامیدند. (جمیله سروری) زنان ایران اما پیش از انقلاب در ژیمناستیک بین‌المللی حضور داشتند؛ «جمیله سروری» حتی در المپیک۱۹۶۴ توکیو مسابقه داده بود. پس از انقلاب، محدودیت‌های جمهوری اسلامی بر پوشش زنان، مسیر حضور بین‌المللی آن‌ها را بست. ژیمناستیک زنان را به سایه بردند و تلاش کردند که به صورت کامل حذفش کنند، اما زنان ایران توقف‌ناپذیر بودند. دختران تمرین کردند، مربی شدند و در مسابقات داخلی هنری، ریتمیک و ایروبیک شرکت کردند؛ هرچند در سایه و دور از تماشاگر و البته برای دهه‌ها محروم از حضور در رقابت‌های بین‌المللی. «زهرا اینچه‌درگاهی» برای گرفتن مجوز، پوشش زنان ژیمناست را به مجلس و ستاد امر به معروف برد و پای صداوسیما را نیز به ماجرا باز کرد. حتی موافقت فدراسیون جهانی هم برای حضور زنان ایران کافی نبود؛ مجوز داخلی همچنان مانع بود. سپاه و نهادهای امنیتی بارها برای او پرونده‌سازی کردند. سه سال پیش‌تر از امروز، یکی از بالاترین مدیران ورزش زنان جمهوری اسلامی می‌گفت ژیمناستیک زنان به‌دلیل پوشش مجوز نمی‌گیرد و ژیمناستیک ریتمیک زنان، «هیچ ارزشی» چه در بُعد قهرمانی و چه از نظر مدال،"}, {"source": "IranWire", "title": "ابلاغ شروط ایران یا مذاکره با آمریکا، دغدغه تهران چیست؟", "link": "https://iranwire.com/fa/features/158055-%D8%A7%D8%A8%D9%84%D8%A7%D8%BA-%D8%B4%D8%B1%D9%88%D8%B7-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%DB%8C%D8%A7-%D9%85%D8%B0%D8%A7%DA%A9%D8%B1%D9%87-%D8%A8%D8%A7-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D8%AF%D8%BA%D8%AF%D8%BA%D9%87-%D8%AA%D9%87%D8%B1%D8%A7%D9%86-%DA%86%DB%8C%D8%B3%D8%AA/", "summary": "سه‌شنبه ۳۱ شهریور، «دونالد ترامپ»، رییس‌جمهور آمریکا، در سخنرانی مجمع عمومی سازمان ملل خود، بخش عمده‌ای از سخنرانی‌اش را به ایران اختصاص ...", "date_str": "2026-09-25T07:46:28+00:00", "hash": "e52464f703d8fa74", "title_fa": "ابلاغ شروط ایران یا مذاکره با آمریکا، دغدغه تهران چیست؟", "summary_fa": "سه‌شنبه ۳۱ شهریور، «دونالد ترامپ»، رییس‌جمهور آمریکا، در سخنرانی مجمع عمومی سازمان ملل خود، بخش عمده‌ای از سخنرانی‌اش را به ایران اختصاص ... خبر مذاکره بین تهران و واشینگتن در هفته‌ای آمد که فضا بیشتر بوی جنگ می‌داد. قرارگاه خاتم‌الانبیا بیانیه‌ای تهدید آمیز داده بود و غیر از اتحادهای جهانی علیه ایران، وزیر خزانه‌داری آمریکا هم از تعطیلی جهانی خطوط هوایی ایران خبر داده بود. سه‌شنبه ۳۱ شهریور، «دونالد ترامپ»، رییس‌جمهور آمریکا، در سخنرانی مجمع عمومی سازمان ملل خود، بخش عمده‌ای از سخنرانی‌اش را به ایران اختصاص داد. او گفت: «من باید تصمیم بزرگی بگیرم.» یک سوی این تصمیم توافقی بود که به ایران اجازه دهد خود را بازسازی کند؛ سوی دیگر، نابودی سریع جمهوری اسلامی. ترامپ پرسید: آیا آن‌ها را به جهنم بفرستم، «بی هیچ شانسی برای بقا»؟ در تمام این دقایق، دوربین پخش زنده سازمان ملل بارها روی تنها نماینده ایران در صحن می‌رفت. چند ساعت بعد، او گفت نمایندگان آمریکایی در حاشیه مجمع سه ساعت با مقام‌های ایرانی دیدار «خوبی» داشتند و در کنار «ولودیمیر زلنسکی»، رییس‌جمهور اوکراین، افزود : «دیدار بسیار خوبی بود، دیداری بسیار سازنده.» این نخستین تماس اعلام‌شده میان مقام‌های ارشد دو کشور در سه ماه گذشته بود. از همان ساعات، مقام‌های ایرانی یکی پس از دیگری آمدند تا بگویند در آن سه ساعت چه گذشته است، آن‌ها این را نه مذاکره که «ابلاغ شروط» تهران نامیدند. به روایت مقام‌ها، در این مذاکره همه چیز با مجوز ساختارهای نظام انجام شده بود. مخالفان اما آن را «مذاکره بدون مجوز» خواندند و خواستار استیضاح وزیر امور خارجه شدند. نزاعی که در تهران درگرفت، بیش از آن‌که بر سر محتوای آن سه ساعت باشد، بر سر نام آن گفت‌و‌گوی بین طرفین بود. در چنین فضایی پر تخاصمی، رییس‌جمهور آمریکا به ناگاه در نشست با سران کشورهای عربی و اسلامی گفت : «استیو ویتکاف» و «جرد کوشنر»،"}, {"source": "IranWire", "title": "پزشکیان به فاکس‌نیوز: مجتبی خامنه‌ای سالم است و سیاست‌ها را تعیین می‌کند", د شد. سخنگوی وزارت بهداشت شمار شهرهای مرحله نخست را ۶۴ شهر اعلام کرد، اما نام آن‌ها، تعداد بیماران واجد شرایط و فهرست خدماتی را که قرار است بدون پرداخت مستقیم ارائه شوند، مشخص نکرد. او در توضیح برنامه به اهمیت تشخیص زودهنگام سرطان روده بزرگ نیز اشاره کرد، در حالی که طبق اعلام خود او، بیماران مبتلا به این نوع سرطان در گروه آغازین طرح قرار ندارند. این وعده در شرایطی مطرح شد که مبتلایان به سرطان هم‌اکنون نیز از برخی حمایت‌های صندوق بیماری‌های خاص و صعب‌العلاج برخوردارند، اما هزینه همه داروها و مراحل درمان آنان تامین نمی‌شود. مدیرعامل سازمان بیمه سلامت پیش‌تر سرطان و دیابت را در شمار پرهزینه‌ترین بیماری‌های تحت پوشش صندوق معرفی کرده بود. وزارت بهداشت هنوز توضیح نداده است طرح جدید دقیقا کدام هزینه‌های باقی‌مانده، از دارو و آزمایش تا جراحی و پرتودرمانی را به تعهدات بیمه اضافه می‌کند. خود تامین دارو نیز یکی از مشکلات جاری بیماران است. گزارش‌های منتشرشده در ماه‌های گذشته از کمبود شدید برخی داروهای موردنیاز مبتلایان به سرطان و افزایش هزینه تهیه آن‌ها حکایت دارند. در شهریورماه، یکی از خانواده‌ها در تهران به ایندیپندنت فارسی گفته بود قیمت داروهای خارجی موردنیاز بیمارشان چهار تا پنج برابر شده و تهیه دارو با همان قیمت‌ها نیز دشوار است. یکی از اعضای هیأت‌مدیره انجمن داروسازان ایران هم در گفتگو با روزنامه شرق، کمبود شماری از داروهای سرطان تولید برخی نشان‌های تجاری را تایید کرد. به روایت مقام‌های مسئول،‌ افزایش قیمت‌ها محدود به چند قلم دارو نیست. مهدی پیرصالحی، رئیس سازمان غذا و دارو، در شهریورماه اعلام کرد قیمت دارو از ابتدای سال به‌طور متوسط ۱۰۳ درصد افزایش یافته و پرداختی بیماران نیز ۳۵ درصد بیشتر شده است. او کاهش حدود ۹۰۰ میلیون دلاری ارز ترجیحی دارو و تجهیزات پزشکی نسبت به سال گذشته و افزایش نرخ ارز مورداستفاده برای تامین سایر اقلام را از عوامل گرانی عنوان کرد. انوشیروان محسنی بندپی ، معاون گردشگری وزارت میراث فرهنگی، گردشگری و صنایع", "date_str": "2026-09-25T06:04:30+00:00", "hash": "cbc015338f048af2", "title_fa": "وعده درمان رایگان سرطان در میانه بحران کمبود دارو و کسری بودجه", "summary_fa": "وزارت بهداشت و درمان جمهوری اسلامی ایران جزئیاتی تازه‌ از طرح «درمان رایگان سرطان» ت که در جامعه ما ایجاد کردند و آن کمبود امنیت است.» مسعود پزشکیان گفته است رهبر جمهوری اسلامی در سلامت «کامل» است و توان حکمرانی دارد. او همچنین گفت رهبر جمهوری اسلامی «سیاست‌گذار» است و «اجرا و حکومت دست دولت است.» از آقای پزشکیان درباره کشتار معترضان در دی سوال شد. او گفت «اعتراض حق مردم است» و «ما با بسیاری از این معترضان صحبت کردیم. ما با اعتراض کردن در خیابان با اسلحه مسئله داریم.» وقتی مجری گفت که «شما قطعاً نیروهای امنیتی داشتید که به شهروندان ایرانی حمله کردند و آنها را کشتند»، آقای پزشکیان پاسخ داد دونالد ترامپ خودش اعلام کرد که آمریکا این افراد را «تجهیز و مسلح» کرده است تا دولت ایران را سرنگون کنند و «افراد نتانیاهو اعلام کردند که نیروهایی از استان‌های کردستان و بلوچستان وارد مراکز اصلی شهرها خواهند شد تا دولت را سرنگون کنند. آنها فکر می‌کردند که این یک ماجرای سه روزه خواهد بود و دولت سقوط خواهد کرد. اما دولت استوار ماند، منسجم‌تر شد و متحدتر شد.» مسعود پزشکیان درباره آمار کشته‌شدگان اعتراضات دی با دفاع از آمار رسمی گفت در ایران همه شماره ملی دارند و «وقتی می‌گویند ۱۰ هزار نفر یا ۱۷ هزار نفر، چرا دست‌کم دو شماره ملی ارائه نمی‌کنند؟» رئیس‌جمهور ایران درباره اورانیوم با غنای ۶۰ درصد گفت ایران آماده است آن را با راستی‌آزمایی بین‌المللی رقیق"}, {"source": "BBC Persian", "title": "نتانیاهو اتهام نسل‌کشی در نوار غزه را رد و از عملیات نظامی اسرائیل در ایران و خاورمیانه دفاع کرد", "link": "https://www.bbc.com/persian/articles/cmd79lq8n155o?at_medium=RSS&at_campaign=rss", "summary": "بنیامین نتانیاهو، نخست‌وزیر اسرائیل، در سخنرانی خود در مجمع عمومی سازمان ملل متحد، به شدت از عملیات نظامی کشورش در ایران، غزه و دیگر نقاط خاورمیانه دفاع کرد. پس از آنکه ده‌ها تن از نمایندگان در اعتراض به حضور او روی صحنه، سالن را ترک کردند، نتانیاهو بر ادامه نبرد تأکید کرد و گفت: «ما پیروز خواهیم شد. چاره دیگری نداریم.» او در واکنش به این اقدام نمایندگان گفت: «اگر افراد بزدل بی‌اخلاق دیگری هم هستند که هنوز سالن را ترک نکرده‌اند، لطفاً همین حالا این کار را بکنند.» رهبر اسرائیل همچنین اتهامات مبنی بر ارتکاب نسل‌کشی توسط اسرائیل در غزه را رد کرد.", "date_str": "2026-09-25T10:13:51+00:00", "hash": "030f0ed20ad4227b", "title_fa": "نتانیاهو اتهام نسل‌کشی در نوار غزه را رد و از عملیات نظامی اسرائیل در ایران و خاورمیانه دفاع کرد", "summary_fa": "بنیامین نتانیاهو، نخست‌وزیر اسرائیل، در سخنرانی خود در مجمع عمومی سازمان ملل متحد، به شدت از عملیات نظامی کشورش در ایران، غزه و دیگر نقاط خاورمیانه دفاع کرد. پس از آنکه ده‌ها تن از نمایندگان در اعتراض به حضور او روی صحنه، سالن را ترک کردند، نتانیاهو بر ادامه نبرد تأکید کرد و گفت: «ما پیروز خواهیم شد. چاره دیگری نداریم.» او در واکنش به این اقدام نمایندگان گفت: «اگر افراد بزدل بی‌اخلاق دیگری هم هستند که هنوز سالن را ترک نکرده‌اند، لطفاً همین حالا این کار را بکنند.» رهبر اسرائیل همچنین اتهامات مبنی بر ارتکاب نسل‌کشی توسط اسرائیل در غزه را رد کرد. نخست‌وزیر اسرائیل همچنین اتهامات مبنی بر ارتکاب نسل‌کشی توسط اسرائیل در غزه را رد کرد. چند ساعت پیش از آن، محمود عباس، رئیس تشکیلات فلسطینی، در پیامی ضبط‌شده به سازمان ملل گفت که سیاست‌های اسرائیل، به‌ویژه گسترش غیرقانونی شهرک‌های یهودی‌نشین در کرانه باختری اشغالی، «حیات و موجودیت ملت فلسطین در سرزمین مادری‌شان» را تهدید می‌کند. او همچنین گفت که این اقدامات، راهکار «دو دولتی» را که فرمول مورد حمایت جامعه جهانی برای صلح میان اسرائیل و فلسطینیان است، به خطر می‌اندازد. محمود عباس گفت که فلسطینیان در غزه توسط ارتش اسرائیل در معرض «کشتار، ویرانی، گرسنگی، تلاش برای کوچ اجباری و همچنین جنگی با ماهیت نسل‌کشی» قرار گرفته‌اند. رئیس تشکیلات فلسطینی به دلیل عدم صدور روادید ورود به ایالات متحده، از طریق ارتباط ویدیویی در این گردهمایی سالانه سخنرانی می‌کرد. نتانیاهو که به اتهام ارتکاب جنایات جنگی احتمالی، حکم جلب او از سوی دیوان کیفری بین‌المللی صادر شده است، در سخنرانی در هشتاد و یکمین نشست سالانه مجمع عمومی سازمان ملل متحد حملات تندی را متوجه کشورها و رهبرانی کرد که از او انتقاد کرده‌اند. او گفت: «آن‌ها اسرائیل، اسرائیل کوچک را به استعمارگری متهم می‌کنند؛ عجب استعمارگری‌! و چه کسانی ما را متهم می‌کنند؟ در"}, {"source": "BBC Persian", "title": "آلخاندرو بتانکورت؛ میلیاردر مرموز ونزوئلایی که به شریک نفتی آمریکا تبدیل شد", "link": "https://www.bbc.com/persian/articles/cn0jw1lj0e9o?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ، رئیس‌جمهور آمریکا، توافقی را که بر اساس آن کنترل میدان‌های راهبردی نفتی ونزوئلا به آمریکا واگذار می‌شود، «بزرگ‌ترین توافق در تاریخ» توصیف کرده است اما جنجال بر سر این توافق نفتی با آشکار شدن جزئیات بیشتر این توافق همچنان رو به گسترش است.", "date_str": "2026-09-25T05:49:30+00:00", "hash": "318776a643b3bbda", "title_fa": "آلخاندرو بتانکورت؛ میلیاردر مرموز ونزوئلایی که به شریک نفتی آمریکا تبدیل شد", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا، توافقی را که بر اساس آن کنترل میدان‌های راهبردی نفتی ونزوئلا به آمریکا واگذار می‌شود، «بزرگ‌ترین توافق در تاریخ» توصیف کرده است اما جنجال بر سر این توافق نفتی با آشکار شدن جزئیات بیشتر این توافق همچنان رو به گسترش است. افزون بر پرسش‌هایی درباره قانونی بودن واگذاری کنترل اکثریتی ۱۷ میدان نفتی به آمریکا، میدان‌هایی که حدود ۲۱/۵ درصد ذخایر اثبات‌شده نفت ونزوئلا، معادل حدود ۶۵ میلیارد بشکه، را در خود جای داده‌اند، اکنون هویت شخصی که مسئول بهره‌برداری از آن‌ها خواهد بود نیز شگفتی آفریده است. برخلاف آنچه از عملیاتی با چنین ابعادی انتظار می‌رود، غول‌هایی مانند اکسون‌موبیل، کونوکو فیلیپس و بریتیش پترولیوم در فهرست مشارکت‌کنندگان حضور ندارند. در عوض، نام شرکت نورث امریکن بلو انرژی پارتنرز مطرح شده است؛ شرکتی ثبت‌شده در باربادوس که اطلاعات عمومی بسیار اندکی درباره آن وجود دارد و هیچ نشانه‌ای از حضورش در دیگر بازارهای نفتی در دست نیست. با این حال، آنچه بیش از همه جلب توجه کرده، فردی است که هدایت این شرکت را بر عهده دارد: الخاندرو بتانکورت لوپس، بازرگان ونزوئلایی که معاملات چند میلیون دلاری‌اش با دولت ونزوئلا از زمان هوگو چاوز، رئیس‌جمهور فقید این کشور، بارها خبرساز شده و در عین حال طی ۱۵ سال گذشته برای او دست‌کم در پنج کشور پرونده‌ها و تحقیقات قضایی به همراه داشته است. بتانکورت در بیانیه‌ای که مشارکت شرکتش در توافق را تائید می‌کرد، گفت: «ونزوئلا منابع طبیعی فراوان، مردمی سخت‌کوش و ظرفیت‌های بهره‌برداری‌نشده دارد.» او افزود: «این معامله آن ظرفیت را آزاد خواهد کرد و منافع زیادی برای مردم ونزوئلا و آمریکا به همراه خواهد داشت.» بتانکورت در همین بیانیه اعلام کرد دولت آمریکا ۳۵ درصد سهام شرکت را در اختیار خواهد گرفت. در مقابل، مقام‌های آمریکایی در واشنگتن از شریک انتخاب‌شده دفاع می‌کنند و می‌گویند او ثابت کرده است که شریکی قابل اعتماد است."}, {"source": "BBC Persian", "title": "موضع «حکومت ایران» در مورد مذاکره با آمریکا چیست؟", "link": "https://www.bbc.com/persian/articles/c6lye5gnw4vro?at_medium=RSS&at_campaign=rss", "summary": "انتشار روایت‌های متناقض از «موضع نظام» راجع به مذاکرات نیویورک، این پرسش را ایجاد می‌کند که آیا گفتگوهای اخیر هم، به تجربه‌ای از جنس تصویب و سپس بی‌اعتبار شدن تفاهم‌نامه اسلام‌آباد یک روز پس از امضای آن تبدیل شده است؟ آیا اساساً سیاست «راس نظام» در موضوع حضور نمایندگان دولت در آمریکا، روشن است؟", "date_str": "2026-09-25T04:20:13+00:00", "hash": "184ff9f9ad849c2d", "title_fa": "موضع «حکومت ایران» در مورد مذاکره با آمریکا چیست؟", "summary_fa": "انتشار روایت‌های متناقض از «موضع نظام» راجع به مذاکرات نیویورک، این پرسش را ایجاد می‌کند که آیا گفتگوهای اخیر هم، به تجربه‌ای از جنس تصویب و سپس بی‌اعتبار شدن تفاهم‌نامه اسلام‌آباد یک روز پس از امضای آن تبدیل شده است؟ آیا اساساً سیاست «راس نظام» در موضوع حضور نمایندگان دولت در آمریکا، روشن است؟ گفتگوهای ظاهرا غیرمستقیم هیات‌های ایرانی و آمریکایی در جریان سفر مسعود پزشکیان به نیویورک، در شرایطی صورت گرفت که اطلاعی از موضع رهبر جمهوری اسلامی راجع به مذاکرات وجود نداشت. به‌طور مشخص، در بیش از سه هفته منتهی به سفر رئیس‌جمهور ایران، اساسا غیر از یک متن تسلیت، هیچ پیام دیگری به نقل از مجتبی خامنه‌ای منتشر نشد. در روز سفر هم، پیامی کلی به مناسبت آغاز سال تحصیلی انتشار یافت که اشاره‌ای به بحران‌های اخیر یا اصولا مشکلات کشور نمی‌کرد. در واقع آخرین پیام رهبر در اشاره به این مشکلات، متن ۶ شهریور به مناسبت «هفته دولت» بود، که مسئولان را از «بیان صادقانه ضعف‌ها» بر حذر می‌داشت تا «دوستان و همراهان» نگران نشوند. در این خصوص که پیام‌های منتسب به مجتبی خامنه‌ای، در چه فرآیندی تولید می‌شوند یا سهم او در تولید متن‌ها چقدر است، البته اختلاف‌نظر وجود دارد. اما گذشته از آنکه مکانیسم انتشار پیام‌ها چیست، طبیعتا اهمیت دارد که این مکانیسم در چه زمان‌هایی فعال یا غیرفعال می‌شود و چه مواضعی را اعلام می‌کند یا نمی‌کند. در آستانه سفر مسعود پزشکیان، اطلاع از دیدگاه مقام اول حکومت، اهمیتی مضاعف پیدا کرده بود؛ به‌ویژه به خاطر تأثیرات ویرانگر محاصره دریایی آمریکا بر اقتصاد ایران و همزمان، برخی مواضع غیرمنتظره نظامیان ارشد در موضوع «احیای تفاهم‌نامه اسلام‌آباد» میان ایران و آمریکا. مثلا، مواضع افرادی چون یدالله جوانی معاون سیاسی، یا حسین محبی سخنگوی سپاه، که بر بازگشت آمریکا به تفاهم‌نامه -به‌عنوان شرط بازگشایی تنگه هرمز- تأکید کرده بودند. حتی محسن رضایی، دبیر شورای عالی"}, {"source": "BBC Persian", "title": "پشت پرده تحرکات دیپلماتیک؛ آیا راهی برای پایان جنگ ایران باز شده است؟", "link": "https://www.bbc.com/persian/articles/cmvgy8qe9vr0o?at_medium=RSS&at_campaign=rss", "summary": "جنگ ایران، ابتکار تازه تهران برای بازگشایی تنگه هرمز، نقش چین در معادلات منطقه و نگرانی‌های فزاینده جمهوری‌خواهان درباره پیامدهای سیاسی ادامه درگیری، از مهم‌ترین موضوعاتی بوده که در روزهای برگزاری مجمع عمومی سازمان ملل توجه رسانه‌های آمریکا را به خود جلب کرده است. بررسی این پوشش‌ها نشان می‌دهد که پرونده ایران اکنون نه فقط یک بحران امنیتی، بلکه مسئله‌ای درهم‌تنیده با دیپلماسی، رقابت واشنگتن و پکن و سیاست داخلی آمریکا شده است.", "date_str": "2026-09-25T07:37:43+00:00", "hash": "4c9f3a6d649f775d", "title_fa": "پشت پرده تحرکات دیپلماتیک؛ آیا راهی برای پایان جنگ ایران باز شده است؟", "summary_fa": "جنگ ایران، ابتکار تازه تهران برای بازگشایی تنگه هرمز، نقش چین در معادلات منطقه و نگرانی‌های فزاینده جمهوری‌خواهان درباره پیامدهای سیاسی ادامه درگیری، از مهم‌ترین موضوعاتی بوده که در روزهای برگزاری مجمع عمومی سازمان ملل توجه رسانه‌های آمریکا را به خود جلب کرده است. بررسی این پوشش‌ها نشان می‌دهد که پرونده ایران اکنون نه فقط یک بحران امنیتی، بلکه مسئله‌ای درهم‌تنیده با دیپلماسی، رقابت واشنگتن و پکن و سیاست داخلی آمریکا شده است. این هفته نیویورک میزبان رهبران جهان در مجمع عمومی سازمان ملل بوده و جنگ ایران یکی از مهم‌ترین محورهای گفت‌وگوها و پوشش رسانه‌های آمریکایی را به خود اختصاص داده است. پیشنهاد تازه تهران برای بازگشایی تنگه هرمز، نقش چین در معادلات جنگ و نگرانی جمهوری‌خواهان از هزینه‌های سیاسی ادامه درگیری از جمله موضوعاتی است که رسانه‌های آمریکا روز پنج‌شنبه به آن پرداخته‌اند. روزنامه واشنگتن‌پست می‌نویسد ایران پیشنهاد تازه‌ای در اختیار دولت دونالد ترامپ گذاشته که بر اساس آن، تنگه هرمز می‌تواند بازگشایی شود و مذاکرات برای پایان دادن به جنگ ظرف هفت روز از سر گرفته شود. عباس عراقچی، وزیر امور خارجه ایران، در حاشیه مجمع عمومی سازمان ملل گفته است این پیشنهاد در جریان تماس‌هایی که این هفته با میانجی‌گری کشورهای دیگر انجام شده، به مقام‌های آمریکایی منتقل شده است. رسانه‌های ژاپنی پیشتر درباره این پیشنهاد گزارش داده بودند. اهمیت گزارش واشنگتن‌پست در این است که تنها دو روز پس از سخنرانی تند دونالد ترامپ در مجمع عمومی سازمان ملل منتشر شده است؛ سخنرانی‌ که در آن رئیس‌جمهور آمریکا بار دیگر ایران را میان توافق و ادامه تشدید درگیری‌ها مخیر کرد. در مقابل، مسعود پزشکیان، رئیس‌جمهور ایران، نیز در سخنرانی خود تأکید کرد کشورش در برابر فشار آمریکا تسلیم نخواهد شد، اما همزمان راه مذاکره را کاملاً نبست."}, {"source": "BBC Persian", "title": "پشت پرده امپراتوری کانتی؛ افشای رازهای یکی از بدنام‌ترین گروه‌های هکری جهان", "link": "https://www.bbc.com/persian/articles/c9q9gqnxz13o?at_medium=RSS&at_campaign=rss", "summary": "گروه کانتی، یکی از بزرگ‌ترین گروه‌های باج‌افزاری جهان، سال‌ها به هک کردن افراد و سازمان‌ها مشغول بود. اما در سال ۲۰۲۲ ورق برگشت. زمانی که این باند تبهکار از هم پاشید و هزاران پیام داخلی آن به صورت آنلاین فاش شد. این پیام‌ها چه چیزی را آشکار می‌کنند؟", "date_str": "2026-09-25T00:20:40+00:00", "hash": "5e4d4789086fa8ae", "title_fa": "پشت پرده امپراتوری کانتی؛ افشای رازهای یکی از بدنام‌ترین گروه‌های هکری جهان", "summary_fa": "گروه کانتی، یکی از بزرگ‌ترین گروه‌های باج‌افزاری جهان، سال‌ها به هک کردن افراد و سازمان‌ها مشغول بود. اما در سال ۲۰۲۲ ورق برگشت. زمانی که این باند تبهکار از هم پاشید و هزاران پیام داخلی آن به صورت آنلاین فاش شد. این پیام‌ها چه چیزی را آشکار می‌کنند؟ «کانتی»، یکی از بزرگ‌ترین گروه‌های باج‌افزاری جهان، سال‌ها به هک کردن افراد و سازمان‌ها مشغول بود. اما در سال ۲۰۲۲ ورق برگشت؛ این باند تبهکار از هم پاشید و هزاران پیام داخلی اعضای آن در اینترنت منتشر شد. این پیام‌ها چه الی ادامه دارد که منتقدان از تبعیض نژادی، خطاهای قضایی و نبود شفافیت در روند انتخاب محکومان برای اعدام انتقاد می‌کنند. سه‌شنبه اول سپتامبر است و ساعت به شش عصر نزدیک می‌شود. در زندان ایالتی فلوریدا، واقع در شهر کوچک ریفورد، لحظه‌ای سرنوشت‌ساز در حال فرارسیدن است. هارولد جین لوکاس، محکوم ۷۴ ساله، استیک، سیب‌زمینی سرخ‌کرده، بیسکویت، کیک، بستنی و شیر خواسته است، آخرین غذایش پیش از مرگ. خواهرش تنها کسی است که در سلولی که آخرین ساعت‌هایش را در آن می‌گذراند، به دیدنش می‌آید. اندکی پیش از زمان تعیین‌شده، او را به اتاقی می‌برند که قرار است به دلیل جرمی که ۵۰ سال پیش مرتکب شده بود، در آن اعدام شود. هیچ زندانی دیگری در ایالات متحده به اندازه او در انتظار اجرای حکم اعدام نمانده بود. آن سوی شیشه، حدود ۴۰ نفر شاهد اجرای حکم‌اند. از جمله خانواده جیل پایپر، دختر ۱۶ ساله‌ای که لوکاس چند بار با او قرار گذاشته بود و در سال ۱۹۷۶، زمانی که خودش ۲۴ سال داشت، او را با شلیک گلوله کشت. النور پایپر که اکنون زنی سالمند روی صندلی چرخ‌دار است، نیز آنجاست تا مرگ قاتل دخترش را ببیند. برای لوکاس همان روال معمول اجرا می‌شود. از او می‌پرسند آیا حرف آخری دارد و پاسخ می‌دهد نه. بلافاصله تزریق مرگبار انجام می‌شود، سه ماده که ظرف چند دقیقه جانش را می‌گیرند. ساعت ۶:۱۸ عصر، مرگ او رسما اعلام می‌شود. زنی با روپوش آزمایشگاهی می‌گوید: «حکم ایالت فلوریدا اجرا شد.» بیرون زندان، لستر پایپر، یکی از برادران جیل، به خبرنگاران می‌گوید خانواده‌اش «احساس آسودگی عمیقی» دارند. پس از نیم‌ قرن زندان و درخواست‌های تجدیدنظر در"}, {"source": "BBC Persian", "title": "واکنش‌ها به سخنرانی پزشکیان در سازمان ملل؛ از تعبیر «سیلی به گوش ترامپ» تا «سنگ تمام برای اقلیت پنج درصد»", "link": "https://www.bbc.com/persian/articles/cqrl675l12z2o?at_medium=RSS&at_campaign=rss", "summary": "سخنرانی مسعود پزشکیان، رئیس‌جمهور ایران در هشتاد و یکمین نشست سالانه مجمع عمومی سازمان ملل، در ایران و جهان بازتاب گسترده‌ای داشته است. آقای پزشکیان گفته است متن از پیش تعیین شده‌اش را پس از سخنرانی دونالد ترامپ که در آن ایران را به نابودی تهدید کرده بود تغییر داده است.", "date_str": "2026-09-24T20:15:50+00:00", "hash": "79e338dbebeb3d93", "title_fa": "واکنش‌ها به سخنرانی پزشکیان در سازمان ملل؛ از تعبیر «سیلی به گوش ترامپ» تا «سنگ تمام برای اقلیت پنج درصد»", "summary_fa": "سخنرانی مسعود پزشکیان، رئیس‌جمهور ایران در هشتاد و یکمین نشست سالانه مجمع عمومی سازمان ملل، در ایران و جهان بازتاب گسترده‌ای داشته است. آقای پزشکیان گفته است متن از پیش تعیین شده‌اش را پس از سخنرانی دونالد ترامپ که در آن ایران را به نابودی تهدید کرده بود تغییر داده است. آقای پزشکیان در این سخنرانی، با اشاره به «ترور» علی خامنه‌ای، رهبر ایران در روز نخست جنگ و کشته شدن کودکان مدرسه میناب، ایران را «قربانی تروریسم» خواند و گفت ایران «در برابر زورگویی زانو خم نمی‌کند.» او درحالی که حملات ایران به کشورهای همسایه را دفاع این کشور از خود دانست، به تمایل ایران برای رسیدن به راه حل دیپلماتیک اشاره کرد. روز قبل از آن، دونالد ترامپ، رئیس جمهور آمریکا در سخنرانی خود گفته بود در صورت عدم حصول توافق بین دو کشور، «جمهوری اسلامی» را به «نابودی» تهدید کرد. آقای پزشکیان روز پنجشنبه به خبرنگاران ایرانی درباره تغییر متن سخنرانی خود گفت پس از سخنرانی ترامپ، «سعی کردیم واقعیت‌هایی را که آمریکا بر ملت ما و دنیا اعمال می‌کند، بیان کنیم؛ چرا که آنها بر خلاف تمام قوانین بین‌المللی و چارچوب‌های انسانی عمل می‌کنند و جز اعمال زور و کار‌های ضد بشری، اقدام دیگری انجام نمی‌دهند.» مارکو روبیو، وزیر خارجه آمریکا در واکنش به سخنرانی مسعود پزشکیان و در پاسخ به سوال خبرنگاران درباره اظهارات او، ایران را سردمدار نقض قوانین بین‌المللی در دنیا خواند و گفت «قصابی‌کردن ده‌هزار نفر از مردم در اعتراضات» هم خلاف قوانین بین المللی است. او گفت ایران در حالی که با حمایت از «گروه‌های تروریستی» به زیرساخت‌های انرژی کشورهای همسایه حمله می‌کند، در موقعیتی نیست که درباره ساز و کارهای بین‌المللی و حقوق بشر «نطق» کند. اما در ایران، چهره‌ها و جریان‌های سیاسی مختلف، از طرفداران حکومت تا طیف گسترده‌ای از منتقدان دولت از سخنرانی مسعود پزشکیان استقبال کردند و"}, {"source": "Radio Farda", "title": "فرماندهان نظامی «پیمان مکه» در واکنش به حملات حوثی‌ها نشست اضطراری برگزار می‌کنند", "link": "https://www.radiofarda.com/a/turkey-pakistan-saudi-arabia-to-hold-talks-after-houthi-attacks/33864337.html", "summary": "ترکیه، عربستان و پاکستان، به تازگی توافق دفاعی مشترکی امضا کردند که بر اساس آن، در صورت حمله به یکی از اعضا، سه کشور متعهد به دفاع متقابل از یکدیگر هستند.", "date_str": "2026-09-25T13:34:19+00:00", "hash": "959859ca44ae5e00", "title_fa": "فرماندهان نظامی «پیمان مکه» در واکنش به حملات حوثی‌ها نشست اضطراری برگزار می‌کنند", "summary_fa": "ترکیه، عربستان و پاکستان، به تازگی توافق دفاعی مشترکی امضا کردند که بر اساس آن، در صورت حمله به یکی از اعضا، سه کشور متعهد به دفاع متقابل از یکدیگر هستند. عربستان سعودی، ترکیه و پاکستان اعلام کردند به منظور حمایت از ریاض، نشست رؤسای ستاد نیروهای مسلح سه کشور را برگزار خواهند کرد. این خبر روز جمعه سوم مهر و به‌دنبال افزایش حملات حوثی‌های یمنی که تحت حمایت جمهوری اسلامی ایران قرار دارند، به عربستان سعودی به عنوان بزرگ‌ترین صادرکننده نفت خام جهان، منتشر می‌شود. این گروه مورد حمایت ایران از ماه ژوئیه حملات خود به عربستان را تشدید کرده و به آتش‌بسی چندساله پایان داده است. حوثی‌ها همچنین یک محاصره دریایی اعلام کرده‌اند، اهدافی در عربستان را مورد حمله قرار داده‌اند و کنترل تمام ساحل دریای سرخ یمن را به دست گرفته‌اند؛ اقداماتی که با هدف محدود کردن صادرات نفت عربستان انجام می‌شود. وزارت خارجه پاکستان روز جمعه اعلام کرد که این کشور همراه با عربستان سعودی و ترکیه درباره کمک به ریاض در چارچوب یک پیمان دفاعی مشترک گفت‌وگو خواهند کرد و برای برگزاری یک نشست فوری میان فرماندهان نیروهای مسلح سه کشور برنامه‌ریزی کرده‌اند. وزارت دفاع ترکیه نیز روز جمعه در بیانیه‌ای اعلام کرد رئیس ستاد کل نیروهای مسلح ترکیه امروز برای شرکت در این نشست به عربستان سعودی سفر خواهد کرد. این اعلامیه‌ها پس از آن منتشر شد که شاهزاده فیصل بن فرحان، وزیر خارجه عربستان، اسحاق دار، وزیر خارجه پاکستان، و هاکان فیدان، وزیر خارجه ترکیه، روز پنجشنبه در حاشیه مجمع عمومی سازمان ملل در نیویورک با یکدیگر دیدار کردند. بر اساس بیانیه‌ای که خبرگزاری رسمی عربستان منتشر کرد، این نشست به «ترتیبات جاری برای برگزاری یک نشست فوری میان رؤسای ستاد نیروهای مسلح سه کشور، با هدف بررسی راه‌های حمایت از پادشاهی عربستان مطابق با توافق دفاعی مشترک مکه» اختصاص داشت."}, {"source": "Radio Farda", "title": "شمار دیگری از کشورهای منطقه پروازهای ایرانی را در فرودگاه‌های خود متوقف کردند", "link": "https://www.radiofarda.com/a/more-countries-airports-suspend-iranian-flights/33864325.html", "summary": ".", "date_str": "2026-09-25T13:04:34+00:00", "hash": "7abac9d08474c6c5", "title_fa": "شمار دیگری از کشورهای منطقه پروازهای ایرانی را در فرودگاه‌های خود متوقف کردند", "summary_fa": "در پی توقف پرواز شرکت‌های هواپیمایی ایران به برخی کشورهای منطقه به دلیل اعمال تحریم‌های تازه آمریکا، خبرگزاری رویترز به نقل از دو منبع مطلع خبر داد که فرودگاه‌های اربیل و سلیمانیه در اقلیم کردستان عراق نیز از روز جمعه سوم مهرماه پرواز هواپیماهای ایرانی را معلق کرده‌اند. بررسی وب‌سایت فرودگاه «امام خمینی» تهران در صبح روز جمعه سوم مهر هم نشان می‌د‌اد که پرواز یک هواپیمای ایران به مقصد سلیمانیه در عراق در این روز لغو شده بود. به گفته منابع و رسانه‌های دولتی، با این تصمیم، پروازهای رفت‌وبرگشت ایران از هر چهار فرودگاه عراق که پیش از این مقصد یا مبدأ پروازهای ایرانی بودند، متوقف شده است: بغداد، نجف، اربیل و سلیمانیه. ساعاتی پیش از انتشار این خبر، خبرگزاری دولتی عراق اعلام کرد فرودگاه نجف نیز پرواز هواپیماهای ایرانی را از ابتدای روز جمعه متوقف کرده است. حسین مهنا، مدیر این فرودگاه، به خبرگزاری فرانسه گفت که «در پی ابلاغ دستورالعملی از سوی دفتر نخست‌وزیر عراق به استاندار نجف»، تمام پروازها میان ایران و فرودگاه نجف متوقف شده است. فرودگاه شهر نجف، واقع در جنوب بغداد، یکی از کانون‌های اصلی پروازهای ایران است. عراق پیشتر نیز پرواز هواپیماهای ایرانی به فرودگاه بغداد را هم متوقف کرده بود. این تصمیمات به دنبال اعمال تحریم‌های ثانویه آمریکا بر همه خطوط هوایی ایران از اول مهرماه گرفته می‌شود. وزارت خزانه‌داری آمریکا با قرار دادن همۀ شرکت‌های هواپیمایی ایران در فهرست تحریم‌ها، ارائه خدمات به هواپیماهای ایرانی در سراسر دنیا از روز اول مهر را مشمول تحریم‌های ثانویه کرده و گفته است هر شرکت خارجی که با شرکت‌های هواپیمایی ایران همکاری تجاری داشته باشد، هدف تحریم قرار خواهد گرفت. اسکات بسنت، وزیر خزانه‌داری آمریکا روز پنج‌شنبه گفته بود پرواز بیش از ۸۰ تا ۹۰ درصد هواپیماهای ایرانی در جهان متوقف شده است."}, {"source": "Radio Farda", "title": "مقامات آمریکایی: شرکت فروشنده نرم‌افزار به پنتاگون مالکیت روسی خود را پنهان کرده بود", "link": "https://www.radiofarda.com/a/us-russia-software-hacker-cyber-oxygen-forensics/33864104.html", "summary": "شرکت «اکسیژن فورنزیکس» متعلق به چند شهروند روس بوده که همزمان شرکتی در مسکو را اداره می‌کردند و به نهادهای امنیتی روسیه، از جمله سرویس امنیت فدرال، خدمات نرم‌افزاری ارائه می‌دادند.", "date_str": "2026-09-25T06:50:54+00:00", "hash": "c21b453469795fec", "title_fa": "مقامات آمریکایی: شرکت فروشنده نرم‌افزار به پنتاگون مالکیت روسی خود را پنهان کرده بود", "summary_fa": "شرکت «اکسیژن فورنزیکس» متعلق به چند شهروند روس بوده که همزمان شرکتی در مسکو را اداره می‌کردند و به نهادهای امنیتی روسیه، از جمله سرویس امنیت فدرال، خدمات نرم‌افزاری ارائه می‌دادند. مقام‌های آمریکایی می‌گویند شرکتی که نرم‌افزارهای استخراج اطلاعات از تلفن همراه و دیگر دستگاه‌های الکترونیکی را به پنتاگون، سرویس مخفی و دیگر نهادهای دولتی آمریکا فروخته بود، مالکیت روسی خود را پنهان کرده و به دولت آمریکا اطلاعات نادرست داده است. به‌گفتهٔ دادستان‌های آمریکا، شرکت «اکسیژن فورنزیکس» (Oxygen Forensics) در واقع متعلق به چند شهروند روس بوده که همزمان شرکتی در مسکو را اداره می‌کردند و به نهادهای امنیتی روسیه، از جمله سرویس امنیت فدرال، اف‌اس‌بی، خدمات نرم‌افزاری ارائه می‌دادند. لی رایبر، مدیرعامل ۵۵ ساله اکسیژن فورنزیکس و ساکن ایالت آیداهو، به اتهام کلاهبرداری اینترنتی بازداشت و ۲۲ سپتامبر (۳۱ شهریور) با قرار وثیقه آزاد شد. اولگ داویدوف، شهروند ۵۲ سالهٔ روسیه و ساکن مسکو، نیز دو روز پیش از آن در فرودگاه هیترو لندن بازداشت شد و مقام‌های آمریکایی گفته‌اند خواهان استرداد او به ایالات متحده خواهند شد. بر اساس شکایت کیفری که دادستان‌های آمریکا روز ۲۳ سپتامبر منتشر کردند، اکسیژن فورنزیکس و به‌ویژه مدیرعامل آن به دولت آمریکا اعلام کرده بودند که این شرکت ثبت‌شده در ایالت ویرجینیا هیچ مالک یا کنترل‌کنندهٔ خارجی ندارد و نرم‌افزارهایش در ایالات متحده تولید شده‌اند. اما دادستان‌ها می‌گویند این شرکت در واقع متعلق به اولگ داویدوف و چهار شهروند روس دیگر بوده است. این افراد همچنین شرکتی مستقر در مسکو را اداره می‌کردند که به اف‌اس‌بی، یکی از مهم‌ترین نهادهای امنیتی و اطلاعاتی روسیه، خدمات نرم‌افزاری ارائه می‌کرد. این مجموعه در سال ۲۰۱۳ یک شرکت وابسته در حومه واشینگتن راه‌اندازی کرد. پس از تهاجم گستردهٔ روسیه به اوکراین در اسفند ۱۴۰۰ و تشدید محدودیت‌های آمریکا و دیگر کشورهای غربی، داویدوف و شرکایش، به ادعای دادستان‌ها، اقداماتی برای پنهان کردن مالکیت روسی"}, {"source": "Radio Farda", "title": "پزشکیان با اعلام آمادگی برای رقیق‌سازی اورانیوم خواستار بازگشت به تفاهم اسلام‌آباد شد", "link": "https://www.radiofarda.com/a/pezeshkian-iran-uranium-dilution-islamabad-deal-us/33864074.html", "summary": "مسعود پزشکیان: ما نمی‌خواهیم کار به انتخابات میان‌دوره‌ای آمریکا برسد و مایلیم آمریکایی‌ها پیش از آن به تفاهم‌نامه اسلام‌آباد بازگردند.", "date_str": "2026-09-25T06:03:25+00:00", "hash": "0a71c21bbb5ab75f", "title_fa": "پزشکیان با اعلام آمادگی برای رقیق‌سازی اورانیوم خواستار بازگشت به تفاهم اسلام‌آباد شد", "summary_fa": "مسعود پزشکیان: ما نمی‌خواهیم کار به انتخابات میان‌دوره‌ای آمریکا برسد و مایلیم آمریکایی‌ها پیش از آن به تفاهم‌نامه اسلام‌آباد بازگردند. مسعود پزشکیان می‌گوید تهران آماده است اورانیوم غنی‌شده تا سطح ۶۰ درصد را رقیق کند و برنامهٔ هسته‌ای خود را در معرض راستی‌آزمایی قرار دهد و همچنان خواهان پیشبرد توافق با آمریکا بر مبنای تفاهم‌نامه اسلام‌آباد است. رئیس‌جمهور ایران همچنین از تمایل تهران به بازگشت تفاهم‌نامه تا پیش از انتخابات میان‌دوره‌ای آمریکا خبر داده است. آقای پزشکیان در مصاحبه با شبکه آمریکایی فاکس‌نیوز که شامگاه پنجشنبه دوم مهر به وقت آمریکا پخش شد، در پاسخ به پرسش برت بایر دربارهٔ اورانیوم غنی‌شده تا سطح ۶۰ درصد و احتمال دستیابی ایران به سلاح هسته‌ای گفت «به هیچ وجه، به هیچ وجه» و افزود بر اساس فتوای علی خامنه‌ای، «این کار حرام و غیرقانونی است». او در ادامه دربارهٔ ذخایر اورانیوم غنی‌شده ایران گفت: «ما گفته‌ایم آماده‌ایم آن‌ها را رقیق کنیم. مسئلهٔ بزرگی نیست. آماده‌ایم خود را در معرض راستی‌آزمایی قرار دهیم.» برنامهٔ هسته‌ای ایران و به‌ویژه ذخایر اورانیوم غنی‌شده تا سطح ۶۰ درصد یکی از محورهای اصلی اختلاف تهران و واشینگتن بوده است. جمهوری اسلامی تأکید می‌کند برنامه هسته‌ای آن اهداف صلح‌آمیز دارد، اما آمریکا و متحدانش بارها دربارهٔ سطح بالای غنی‌سازی و احتمال استفاده از آن برای تولید سلاح هسته‌ای ابراز نگرانی کرده‌اند. آقای پزشکیان در بخش دیگری از مصاحبه به تفاهم‌نامهٔ اسلام‌آباد اشاره کرد و گفت تهران همچنان آماده است بر اساس آن با دولت دونالد ترامپ پیش برود. او گفت: «ما مشکلی نداریم. ما با رئیس‌جمهور شما به توافق رسیدیم. آن توافق امضا شد و بر اساس آن، ما آماده بودیم و همچنان مایلیم که پیش برویم.» مسعود پزشکیان در گفت‌وگویی دیگر با شبکه ان‌بی‌سی هم گفت «ما نمی‌خواهیم کار به انتخابات میان‌دوره‌ای آمریکا برسد و مایلیم آمریکایی‌ها پیش از آن به تفاهم‌نامه بازگردند.»"}, {"source": "Radio Farda", "title": "نتانیاهو در سازمان ملل؛ نخست‌وزیر اسرائیل می‌گوید «به‌زودی، مردم ایران آزاد می‌شوند»", "link": "https://www.radiofarda.com/a/33863814.html", "summary": "نتانیاهو در سازمان ملل از طیف گسترده‌ای از کشورها، سازمان‌ها و شخصیت‌ها انتقاد کرد و گفت مردم ایران به زودی «آزاد» می‌شوند. او تأکید کرد که اسرائیل «چاره‌ای جز پیروزی ندارد».", "date_str": "2026-09-24T20:23:55+00:00", "hash": "30c3009516ed395f", "title_fa": "نتانیاهو در سازمان ملل؛ نخست‌وزیر اسرائیل می‌گوید «به‌زودی، مردم ایران آزاد می‌شوند»", "summary_fa": "نتانیاهو در سازمان ملل از طیف گسترده‌ای از کشورها، سازمان‌ها و شخصیت‌ها انتقاد کرد و گفت مردم ایران به زودی «آزاد» می‌شوند. او تأکید کرد که اسرائیل «چاره‌ای جز پیروزی ندارد». نخست‌وزیر اسرائیل عصر پنجشنبه دوم مهرماه، سخنرانی خود در مجمع عمومی سازمان ملل متحد را با حمله‌ای تند و آشکار به نمایندگان پرشمار کشورهایی آغاز کرد که در اعتراض به ورود او، سالن را ترک کردند. بنیامین نتانیاهو آنها را «بزدلان اخلاقی» خواند و گفت «اگر هنوز کسی از این جمع باقی مانده، لطفاً سالن را ترک کند». نخست‌وزیر اسرائیل سپس بلافاصله به سراغ موضوع ایران رفت و گفت کشورش، مانع از دستیابی ایران به سلاح هسته‌ای شده است. بنیامین نتانیاهو گفت این کار از نظر اجرایی کار «بسیار سختی» بود، «اما گرفتن تصمیمش برای من به‌عنوان نخست‌وزیر، بسیار آسان و موجه بود». او بدون نام‌بردن از کشوری ادعا کرد که خیلی از رهبران منطقه «به شکل خصوصی از ما تشکر کردند». نخست‌وزیر اسرائیل از دونالد ترامپ به‌دلیل درایت و رهبری‌اش تشکر کرد. از جمله به این دلیل که – به گفتۀ او- از مدت‌ها قبل فهمیده بود «وقتی آیت‌الله‌ها شعار مرگ بر آمریکا می‌دهند چه خطری در راه است». او با اشاره‌ای کلی به جنگ اسرائیل و آمریکا با ایران گفت در همه عملیات «از جمله بازگرداندن بازماندگان از پشت جبهه‌های دشمن» با هم همکاری داشتیم. او البته به بازگرداندن ۲۵۱ گروگانی که در جریان حملۀ هفتم اکتبر به‌دست حماس اسیر شده بودند هم اشاره داشت. نخست‌وزیر اسرائیل همزمان از «شجاعت و شهامت» مردم اسرائیل که -به گفتۀ او- در مقابل ۱۰۰۰ موشک بالیستیک ایران مقاومت کردند، هم تقدیر کرد و خطاب به حاضران گفت «تنها دو فروند از آن موشک‌ها برای نابودی کامل مجتمع سازمان ملل متحد کافی است». نخست‌وزیر اسرائیل در بخش دیگری از سخنانش، گفت:«خودکامه‌های تهران از مردم شجاع خودشان بیش از هر چیزی می‌ترسند»."}, {"source": "Radio Farda", "title": "اعتراض خانواده‌های قربانیان کشتار دی‌ماه به ادعای پزشکیان در سازمان ملل", "link": "https://www.radiofarda.com/a/iran-families-of-protesters-january-against-pezeshkian-claim-at-un/33863777.html", "summary": "خانواده‌های جمعی از قربانیان کشتار دی‌ماه ۱۴۰۴ در اقدامی هماهنگ در شبکه‌های اجتماعی به ادعای رئیس جمهور ایران در سخنرانی‌اش در مجمع عمومی سازمان ملل اعتراض کردند.", "date_str": "2026-09-24T17:53:16+00:00", "hash": "931f1a034b532a23", "title_fa": "اعتراض خانواده‌های قربانیان کشتار دی‌ماه به ادعای پزشکیان در سازمان ملل", "summary_fa": "خانواده‌های جمعی از قربانیان کشتار دی‌ماه ۱۴۰۴ در اقدامی هماهنگ در شبکه‌های اجتماعی به ادعای رئیس جمهور ایران در سخنرانی‌اش در مجمع عمومی سازمان ملل اعتراض کردند. آنها در پیام مشترک خود که تَگ کمیساریای حقوق بشر سازمان ملل را نیز دارد تأکید می‌کنند که عزیز کشته‌شده‌شان در زمان اعتراضات مسلح نبوده و از طرف هیچ کشور خارجی فعالیت نمی‌کرده است. مسعود پزشکیان که به آمریکا سفر کرده روز چهارشنبه، اول مهر، سخنرانی خود را در هشتاد و یکمین نشست سران مجمع عمومی سازمان ملل متحد در نیویورک ایراد کرد. او در بخشی از این سخنرانی که مربوط به تجمع‌های شبانه حامیان حکومت در پی اعتراضات دی‌ماه است اشاره می‌کند که معترضان توسط آمریکا و اسرائیل «تهییج شده و اسلحه به دست گرفته بودند». او می‌گوید: «ملت ایران در هفت ماه گذشته، مردم ما هر شب در خیابان بودند برای اینکه... اجازه ندن کسانی را که آمریکا و اسرائیل تهییج کرده بود، اسلحه دست‌شان داده بود، دست‌شان بیایند و ناامنی در داخل کشور ایجاد کنند.» خانواده‌های تعدادی از کشته‌شدگان اعتراضات دی‌ماه در پاسخ به اتهام رئیس جمهور ایران در پیام مشترک خود نوشته‌اند: «من شهادت می‌دهم که برادر [یا پدر] من مسلح نبود و برای هیچ دولت خارجی فعالیت نمی‌کرد. من خواهان حقیقت و عدالت و پاسخگویی هستم.» پسر مسعود پیرمرادیان، خواهر علی محمدی، خواهر سینا کاظمی، دختر حسین ناصری، خواهر بابک صادقی محسنی، خواهر احمد خسروانی، خواهر پرهام آقامحمدی و خواهر عماد مودتی‌پور از جمله این خانواده‌ها هستند. مقام‌های جمهوری اسلامی همچون گذشته از اعتراضات دی‌ماه ۱۴۰۴ نیز به عنوان اغتشاشات و حتی کودتا یاد می‌کنند و این ادعا را مطرح کرده‌اند که معترضان به‌ویژه در روزهای ۱۸ و ۱۹ دی‌ماه به تحریک اسرائیل و آمریکا به خیابان‌ها آمده بودند. اعتراضات دی‌ماه سال گذشته از تجمع و اعتراض بازاری‌های تهران در پی افزایش قیمت دلار آزاد آغاز شد، اما"}, {"source": "Radio Farda", "title": "حملات تازۀ روسیه به اوکراین همزمان با دعوت ترامپ از پوتین برای شرکت در اجلاس گروه ۲۰", "link": "https://www.radiofarda.com/a/33863688.html", "summary": "همزمان با برگزاری هشتاد و یکمین مجمع عمومی سازمان ملل متحد در نیویورک، جنگ روسیه و اوکراین با شدت ادامه دارد و مسکو بار دیگر اوکراین را هدف حملات موشکی و پهپادی قرار داد.", "date_str": "2026-09-24T14:33:11+00:00", "hash": "3f51112234c0fae1", "title_fa": "حملات تازۀ روسیه به اوکراین همزمان با دعوت ترامپ از پوتین برای شرکت در اجلاس گروه ۲۰", "summary_fa": "همزمان با برگزاری هشتاد و یکمین مجمع عمومی سازمان ملل متحد در نیویورک، جنگ روسیه و اوکراین با شدت ادامه دارد و مسکو بار دیگر اوکراین را هدف حملات موشکی و پهپادی قرار داد. روز پنجشنبه دوم مهرماه، ارتش روسیه نقاط مختلف اوکراین از جمله کی‌یف پایتخت را با موشک و پهپاد هدف قرار داد. به گفتۀ مقام‌های اوکرینی در حملات پنجشنبه، دست‌کم هشت تن در کی‌یف و منطقۀ خارکیف در شرق این کشور کشته شدند. این حملات تنها ساعاتی پس از آن انجام شد که ولودیمیر زلنسکی رئیس‌جمهور اوکراین در سخنرانی خود در مجمع عمومی سازمان ملل متحد، خواهان افزایش فشار جهانی بر روسیه شد. رئیس‌جمهور اوکراین در بخشی از سخنرانی خود هشدار داد: «جنگی که نه به موقع از وقوعش جلوگیری شد، نه به موقع متوقف شد، و نه به موقع روسیه به عنوان آغازکننده‌اش تنبیه شد، اکنون در حال گسترش است». ولودیمیر زلنسکی هشدار داد که جنگی که ولادیمیر پوتین بیش از ۴ سال و نیم پیش علیه کشورش آغاز کرد، « دیگر به اوکراین محدود نمی‌شود ». رئیس‌جمهور اوکراین گفت: «هرقدر که ولادیمیر پوتین آزادی عمل بیشتری داشته باشد،‌ به همان نسبت جهان به جایی خطرناک‌تر برای همه تبدیل می‌شود». ولودیمیر زلنسکی البته در بخشی دیگر از سخنرانی‌اش، با تأکید بر تلفات سنگین روسیه در جنگ علیه کشورش گفت، «میزان تلفات روسیه طی ماه‌های اخیر، از کل جمعیت ۲۱ کشور عضو سازمان ملل متحد بیشتر بوده است». در همین حال دونالد ترامپ رئیس‌جمهور ایالات متحده اعلام کرد که ولادیمیر پوتین، رئیس‌جمهور فدراسیون روسیه را برای حضور در نشست سران گروه ۲۰ که قرار است کمتر از سه ماه دیگر در میامی برگزار شود، دعوت کرده است. در یکی از نخستین واکنش‌ها، اولوف گیل، سخنگوی اتحادیۀ اروپا تأکید کرد که این بلوک سیاسی از فرصت نشست میامی برای پافشاری بر محکومیت جنگ روسیه علیه اوکراین استفاده خواهد"}],
      tech: [{"source": "MIT AI", "title": "Estimating suicide risk from text", "link": "https://news.mit.edu/2026/estimating-suicide-risk-from-text-0924", "summary": "When people reach out during a mental health crisis, a top priority for counselors is identifying those with a high risk of suicide. The distressed person’s language holds critical clues, and a new tool developed by scientists at MIT’s McGovern Institute for Brain Research is designed to pick up on and rapidly evaluate those signals. The language-processing tool was developed by Daniel Low, a former graduate student in Senior Research Scientist Satra Ghosh ’s Senseable Intelligence Group who is now a research scientist at the Child Mind Institute , where he leads its AI, Risk, and Contemplative Science Lab , as well as a visiting scholar at Harvard University. It uses a custom-built list of words and phrases linked to 49 suicide risk factors, searching text for these and using them to estimate an individual’s risk. Ghosh, Low, and colleagues report today in the Journal of Psychopathology and Clinical Scienc e that their tool accurately predicts suicide risk from text conversations with crisis counselors. It is already helping to clarify which suicide risk factors matter most in times of crisis. With more validation, it could help with risk assessment in clinical settings and crisis-support situations. Identifying key risk factors Suicide attempts are notoriously difficult to predict. Dozens of risk factors have been linked to suicide, and even trained clinicians struggle to identify who will make an attempt among those who have some form of suicidal ideation. Among the factors that can make suicidal thoughts and behaviors more likely are certain psychiatric symptoms and disorders, like depression, borderline personality disorder, and post-traumatic stress disorder, as well as environmental and social stressors, like poverty, incarceration, discrimination, and loneliness. “You see all these 50 risk factors, and they're all interacting in ways we don't really understand,” Low says. “Many different pathways could lead to someone feeling they want to escape their internal pain,” he says — and it’s challenging to know whose path will lead to a suicide attempt or death. Ghosh and Low wanted to understand which risk factors counselors and clinicians should most look out for during a mental health crisis. To do that, they collaborated with the Crisis Text Line, whose trained volunteers provide confidential text-based support to people in distress. Crisis Text Line, a global mental health nonprofit that provides free, 24/7, confidential mental health support for pe", "date_str": "2026-09-24T21:00:00+00:00", "hash": "5202b5c53109951d", "title_fa": "تخمین خطر خودکشی از روی متن", "summary_fa": "هنگامی که افراد در طول یک بحران سلامت روان به سراغشان می آیند، اولویت اصلی مشاوران شناسایی افرادی است که در معرض خطر بالای خودکشی هستند. زبان فرد مضطر دارای سرنخ های مهمی است و ابزار جدیدی که توسط دانشمندان موسسه تحقیقات مغز مک گاورن MIT توسعه داده شده است برای دریافت و ارزیابی سریع آن سیگنال ها طراحی شده است. ابزار پردازش زبان توسط دانیل لو، یک دانشجوی فارغ التحصیل سابق در گروه هوش معقول، دانشمند تحقیقاتی ارشد ساترا گوش، که اکنون یک دانشمند پژوهشی در مؤسسه Child Mind است، که در آن آزمایشگاه علوم هوش مصنوعی، ریسک، و متفکرانه آن را رهبری می کند، و همچنین یک محقق مدعو در دانشگاه هاروارد، توسعه داده شده است. از یک لیست سفارشی از کلمات و عبارات مرتبط با 49 عامل خطر خودکشی استفاده می کند و متنی را برای این عوامل جستجو می کند و از آنها برای تخمین خطر یک فرد استفاده می کند. Ghosh، Low و همکارانش امروز در مجله آسیب شناسی روانی و علوم بالینی گزارش دادند که ابزار آنها به طور دقیق خطر خودکشی را از مکالمات متنی با مشاوران بحران پیش بینی می کند. این در حال حاضر کمک می کند تا مشخص شود کدام عوامل خطر خودکشی در مواقع بحران بیشترین اهمیت را دارند. با اعتبار بیشتر، می‌تواند به ارزیابی ریسک در محیط‌های بالینی و موقعیت‌های پشتیبانی بحران کمک کند. شناسایی عوامل خطر کلیدی پیش بینی تلاش برای خودکشی بسیار د اس با فروشگاه برای پرسیدن اینکه آیا محصول موجود است، رزرو رستوران، انتقال یک قرار برنامه‌ریزی شده به تاریخ دیگری، یا قرار دادن اقلام در حالت تعلیق. هوش مصنوعی می‌تواند با یک کسب‌وکار تماس بگیرد و خود را معرفی کند، منوهای خودکار تلفن را پیمایش کند، منتظر بماند، و سپس مکالمه را از طرف دیگر مدیریت کند. در همین حال، کاربران می توانند از طریق یک متن زنده"}, {"source": "TechCrunch AI", "title": "Shield AI, Waabi, and General Motors on building AI when failure is not an option at TechCrunch Disrupt 2026", "link": "https://techcrunch.com/2026/09/24/shield-ai-waabi-and-general-motors-on-building-ai-when-failure-is-not-an-option-at-techcrunch-disrupt-2026/", "summary": "Leaders from Waabi, Shield AI, and General Motors join the Real World AI Stage at TechCrunch Disrupt 2026 to talk building AI. Save up to $200 by September 25 at 11:59 p.m. PT. Get a second pass at 50% off.", "date_str": "2026-09-24T15:00:00+00:00", "hash": "dcd2089b98e03c84", "title_fa": "در TechCrunch Disrupt 2026 از هوش مصنوعی، Waabi و جنرال موتورز برای ساختن هوش مصنوعی در زمانی که شکست گزینه ای نیست محافظت کنید.", "summary_fa": "یک چت ربات هوش مصنوعی می تواند پاسخ بدی به شما بدهد. یک سیستم هوش مصنوعی که یک هواپیما، وسیله نقلیه یا ربات را کنترل می کند می تواند نوع کاملاً متفاوتی از مشکل ایجاد کند. وقتی هوش مصنوعی وارد دنیای فیزیکی می شود، یک اشتباه می تواند هواپیما را زمین گیر کند، باعث تصادف وسیله نقلیه شود یا یک ماموریت را به خطر بیندازد. بنابراین چگونه می دانید که یک سیستم خودمختار واقعاً آماده خروج از آزمایشگاه است؟ مکالمه به کار مربوط به استقرار هوش مصنوعی در جایی که ریسک بالایی دارد وارد می‌شود: ایجاد فرهنگ ایمنی، آزمایش و اعتبارسنجی سیستم‌ها، عبور از موانع نظارتی و جلب اعتماد. در Shield AI، ناتان مایکل توسعه و استقرار Hivemind، نرم‌افزار خودمختاری ماموریت‌های پلتفرم-آگنوستیک این شرکت را رهبری می‌کند. پیشینه او شامل هوش مصنوعی، کنترل، ادراک و سیستم‌های چند رباتی است، از جمله سال‌ها در مؤسسه رباتیک دانشگاه کارنگی ملون، جایی که او آزمایشگاه سیستم‌های هوشمند انعطاف‌پذیر را هدایت می‌کرد. این تخصص روی فناوری طراحی‌شده برای برخی از محیط‌های با بیشترین ریسک هوش مصنوعی کار می‌کند. در ماه فوریه، Hivemind به عنوان یک ارائه دهنده خودمختاری برای برنامه نمونه اولیه هواپیمای بدون سرنشین هواپیمای رزمی مشترک نیروی هوایی ایالات متحده انتخاب شد. یک ماه بعد، Shield AI بودجه 1.5 میلیارد دلاری سری G را با ارزش گذاری 12.7 میلیارد دلاری پس از پول اعلام کرد. در Disrupt، مایکل دیدگاه یک رهبر هوش مصنوعی را ارائه می‌کند که سیستم‌های مستقلی را برای محیط‌هایی توسعه می‌دهد که عملکرد باید با اطمینان مطابقت داشته باشد. برای انجام یک ماموریت به هوش مصنوعی چه چیزی لازم است؟ مجوز Disrupt خود را قبل از 25 سپتامبر ساعت 11:59 بعد از ظهر ایمن کنید. PT، و دیدگاه ناتان مایکل را در مورد توسعه خودمختاری برای محیط‌های پر خطر بشنوید."}, {"source": "TechCrunch AI", "title": "Lovable’s annualized revenue crosses $600M as vibe coding takes off", "link": "https://techcrunch.com/2026/09/24/lovables-annualized-revenue-crosses-600m-as-vibe-coding-takes-off/", "summary": "Lovable co-founder Fabian Hedin said that apps created on the platform are getting nearly a billion monthly views each month.", "date_str": "2026-09-24T14:43:25+00:00", "hash": "b875ba17c322385a", "title_fa": "درآمد سالانه Lovable از 600 میلیون دلار عبور می کند، زیرا کدنویسی vibe بالا می رود", "summary_fa": "فابیان هدین، یکی از بنیانگذاران دوست داشتنی، گفت که برنامه های ایجاد شده بر روی این پلتفرم هر ماه نزدیک به یک میلیارد بازدید ماهانه دارند. فابین هدین، یکی از بنیانگذاران این شرکت، روز پنجشنبه در نشست HumanX در آمستردام گفت که Lovable از درآمد سالانه 600 میلیون دلاری عبور کرده است. پلتفرم کدگذاری vibe در ماه ژوئن اعلام کرد که این رقم حدود 500 میلیون دلار است. هدین گفت این استارتاپ بر رشد کسب و کار سازمانی خود تمرکز کرده است و ادعا کرد که افراد دو سوم از شرکت های Fortune 500 اکنون از محصول آن استفاده می کنند. مشتریان آن عبارتند از مایکروسافت، انویدیا و دویچه تلکام. او همچنین گفت که اپلیکیشن‌های ایجاد شده توسط کاربران روی پلتفرم با هم نزدیک به یک میلیارد بازدید در ماه به خود جذب می‌کنند. می توانید از این ابزارها [مانند کدکس یا کد کلود] برای خروجی کد استفاده کنید. تفاوت این است که Lovable کد خروجی نمی دهد. خروجی یک محصول است و به طور فزاینده ای یک تجارت است. ما کارهای زیادی در مورد میزبانی، استقرار و مقیاس‌بندی برنامه‌ها انجام می‌دهیم. او گفت که ما هر ماه نزدیک به یک میلیارد بازدید از برنامه هایی داریم که ایجاد کرده ایم، که نسبت به خود Lovable بیشتر است. این شرکت بیش از 700 میلیون دلار در دو دور با فاصله زمانی هشت ماهه جمع آوری کرده است. دسامبر گذشته، 300 میلیون دلار از Menlo Ventures و CapitalG به ارزش 6.6 میلیارد دلار جذب کرد. سپس، در ماه اوت امسال، این استارتاپ 400 میلیون دلار از Menlo Ventures و Scaleup Europe Fund با ارزش 13.3 میلیارد دلار جذب کرد. Lovable تصریح کرد که هادین قصد داشت بگوید که افراد دو سوم از شرکت‌های Fortune 500 از این پلتفرم استفاده می‌کنند. وقتی از طریق پیوندهای موجود در مقالات ما خرید می کنید،"}, {"source": "TechCrunch AI", "title": "Ando wants to take on Slack with a team messaging app that lets humans and agents work together", "link": "https://techcrunch.com/2026/09/24/ando-eyes-slack-as-it-builds-team-messaging-platform-for-humans-and-agents-to-work-together/", "summary": "The app gives agents their own identities and inboxes and lets them partake in conversations as naturally as people can.", "date_str": "2026-09-24T14:31:00+00:00", "hash": "f413572af8809285", "title_fa": "آندو می‌خواهد با یک برنامه پیام‌رسانی تیمی که به انسان‌ها و نمایندگان اجازه می‌دهد با یکدیگر همکاری کنند، Slack را بپذیرد.", "summary_fa": "این برنامه هویت و صندوق ورودی خود را به نمایندگان می دهد و به آنها اجازه می دهد تا جایی که می توانند به طور طبیعی در مکالمات شرکت کنند. زمانی که سارا دو در سال 2025 به شرکت‌ها در ساخت سرورهای MCP کمک می‌کرد، مردم مدام از او می‌پرسیدند که چگونه می‌توانند از عوامل هوش مصنوعی از درون خود اسلک استفاده کنند. اما یکسری موانع فنی در این راه وجود داشت: انتقال پیام‌ها به جلو و عقب و ایجاد زمینه مناسب برای ماموران، همه بدون هزینه کردن بودجه‌های رمزی. پس از بررسی مشکل، Du متوجه شد که مشکل عمیق تری وجود دارد که از نحوه طراحی پلت فرم های ارتباطی ناشی می شود. دو به TechCrunch گفت: «هرچه عمیق‌تر می‌رفتم، بیشتر احساس می‌کردم Slack و Teams برای جهانی ساخته شده‌اند که شروع به عبور از ما می‌کرد. «نمایندگان به عنوان برنامه‌هایی تلقی می‌شوند که شما نصب می‌کنید، حتی زمانی که در حال عضویت در تیم بودند.» دو فکر می‌کرد که راه‌حل می‌تواند سیستمی باشد که «پراکسی‌های گوشت» را حذف می‌کند، همانطور که Du می‌گوید پدیده افرادی که مجبورند عوامل هوش مصنوعی را به تیم‌های خود منتقل کنند. انسان به طور مؤثر پیام رسان بین نماینده و بقیه شرکت می شود.» دو گفت. \"آنها باید بتوانند بفهمند چرا تصمیمی گرفته شده است، از یک همکار سوال بپرسند، بر اساس کار یک عامل دیگر بنا کنند و در مواقعی که نیاز به قضاوت است، یک انسان را بیاورند.\" استارت‌آپ او، آندو، روز پنج‌شنبه با اپلیکیشنی که دقیقاً همین کار را انجام می‌دهد، از مخفی کاری بیرون آمد: این یک پلتفرم پیام‌رسان تیمی است که هم برای انسان‌ها و هم برای کارکنان هوش مصنوعی طراحی شده است. آندو خود را به عنوان جایگزینی کامل برای Slack یا هر پلتفرم پیام رسانی دیگری که شرکت هایی که از عوامل هوش مصنوعی برای ارتباطات"}, {"source": "NYT Tech", "title": "Complaints About Meta’s ‘Pervert Glasses’ Won’t Slow Tech’s Wearable Gadgets Drive", "link": "https://www.nytimes.com/2026/09/24/technology/personaltech/meta-glasses-wearables.html", "summary": "Meta’s smart glasses are the latest in a line of products to raise eyebrows over privacy. That’s not stopping other companies from creating similar devices.", "date_str": "2026-09-24T19:02:55+00:00", "hash": "0a4a328525f14b34", "title_fa": "شکایات در مورد \"عینک منحرف\" متا باعث کاهش پیشروی ابزارهای پوشیدنی فناوری نمی شود", "summary_fa": "عینک هوشمند متا جدیدترین محصول از سری محصولاتی است که ابروها را برای حفظ حریم خصوصی بالا می برد. این مانع از ایجاد دستگاه های مشابه توسط سایر شرکت ها نمی شود."}, {"source": "NYT Tech", "title": "The Ezra Klein Show: Jensen Huang Thinks A.I. Alarmism Has Gone Too Far", "link": "https://www.nytimes.com/2026/09/25/podcasts/hardfork-ezra-klein-jensen-huang.html", "summary": "Ezra Klein interviews the Nvidia chief executive Jensen Huang.", "date_str": "2026-09-25T11:00:03+0 ly alter our grasp on reality’", "link": "https://www.theguardian.com/technology/2026/sep/25/ai-anxiety-comedy", "summary": "Across videos, standup and cartoons, humorists are skewering big tech’s attempt to make AI ubiquitous and inevitable “Best case scenario, we never have to do any admin again,” says an AI CEO . “Worst case, we all die.” A young man struggles to the top of a beautiful mountain , words echoing in his ears: “AI will most likely lead to the end of the world, but in the meantime, there will be great companies created.” At the top of the mountain, he triumphantly holds up a sign: “Build a datacenter here.” Continue reading...", "date_str": "2026-09-25T12:00:50+00:00", "hash": "798ec349b0dc5ce3", "title_fa": "کمدین‌ها اضطراب هوش مصنوعی را به ضربات منگنه تبدیل می‌کنند: «خیلی خوب است، درک ما از واقعیت را کاملاً تغییر می‌دهد».", "summary_fa": "در میان ویدیوها، استندآپ ها و کارتون ها، طنزنویسان تلاش فناوری های بزرگ را برای فراگیر کردن و اجتناب ناپذیر کردن هوش مصنوعی به کار می گیرند. \"بدترین حالت، همه ما می میریم.\" مرد جوانی برای رسیدن به بالای کوهی زیبا تلاش می‌کند، کلماتی در گوش‌هایش طنین‌انداز می‌کنند: \"هوش مصنوعی به احتمال زیاد به پایان جهان خواهد انجامید، اما در این بین، شرکت‌های بزرگی ایجاد خواهند شد.\" در بالای کوه، او پیروزمندانه تابلویی را در دست دارد: «اینجا یک مرکز داده بسازید». به خواندن ادامه دهید... در متروی نیویورک، پوسترهایی خبر از استارت آپ هایی می دهند که به نظر می رسد هوش مصنوعی هستند. \"اگر چنگال قاشق بود چی؟\" درخواست آگهی برای Cutlery.ai می کند. دیگری به بینندگان توصیه می کند که Ziplink اکنون با نام Froggle شناخته می شود. پوسترها واقعی هستند، اما شرکت ها واقعی نیستند. سناریوهای مدیر عامل و مرکز داده طرح‌های رسانه‌های اجتماعی هستند (اگرچه نقل قول «شرکت‌های بزرگ» یک حکمت واقعی از سم آلتمن است). همه اینها بخشی از موج اخیر کمدی است که الهام گرفته از هوش مصنوعی – اما مطلقاً تولید نشده است. این کمدی در تمام انواع رسانه ها گسترش می یابد: ویدیوهای اجتماعی، استندآپ، آهنگ ها، ستون های طنز، کمیک استریپ و اینستالیشن های هنری. تلاش شرکت‌ها برای فراگیر کردن هوش مصنوعی، خطرات باور هر کلمه آن، تهدیدات آن برای جامعه و محیط زیست را هدف قرار می‌دهد. این به طور موثر روایت بی امان مدیران عامل فناوری را خنثی می کند: اینکه هوش مصنوعی نشان دهنده اوج گیری بشریت است. که اجتناب ناپذیر و توانا است; که ما نمی دانیم به کجا می رود و می تواند همه ما را بکشد، اما بنا به دلایلی کاملاً ضروری است که آن را دنبال کنیم. جای تعجب نیست که موضوعی به فراگیر بودن هوش مصنوعی در سال 2026 در میان کمدین"}, {"source": "The Guardian AI", "title": "Trump told Xi Jinping that China helping Iran is ‘unacceptable’, official says – live", "link": "https://www.theguardian.com/us-news/live/2026/sep/25/trump-xi-summit-national-archives-media-politics-live", "summary": "Xi is expected to depart DC after touring the nation’s vault of records, where the Declaration of Independence, the Constitution and the Bill of Rights are held Sign up for US Breaking News emails A new poll by The New York Times and Siena University of through crucial Senate races that could determine control of the chamber after the midterm elections In both Michigan and New Hampshire, the Democratic nominees (progressive firebrand Abdul El-Sayed in Michigan, and moderate congressman Chris Pappas) lead their Republican challengers by five points. That places the seats, already held by Democrats, further out of reach of Republicans who want to flip them in the midterms, shoring up the party’s Senate margins. Continue reading...", "date_str": "2026-09-25T14:20:05+00:00", "hash": "2140171b6a9adc26", "title_fa": "یک مقام رسمی می گوید ترامپ به شی جین پینگ گفت که کمک چین به ایران «غیرقابل قبول» است", "summary_fa": "انتظار می رود شی پس از بازدید از انبار سوابق کشور، جایی که اعلامیه استقلال، قانون اساسی و منشور حقوق در آن برگزار می شود، دی سی را ترک کند. رویدادهای کلیدی 17 متر پیش نظرسنجی جدید به دموکرات ها در میشیگان و نیوهمپشایر برتری می دهد، اما شانس سخت تری در مین یک ساعت پیش ترامپ به شی جین پینگ گفت: رئیس جمهور برزیل از ترامپ حمایت می کند. مداخله انتخاباتی در تبلیغات جدید کمپین 2 ساعت est moves were sparked in part by the AI researcher Jacob Coxon’s warnings on Twitter/X that AI companies are “gambling with our lives” and believe that the technology “could kill us all by the end of the decade”. Continue reading...", "date_str": "2026-09-25T12:00:50+00:00", "hash": "fdcb7f9ca8f76092", "title_fa": "این فرضی نیست: خطرات هوش مصنوعی در حال حاضر اینجاست | گرانیت کیم و محمد حسین", "summary_fa": "اسرائیل و ایالات متحده از هوش مصنوعی برای کشتار در غزه و ایران استفاده کرده‌اند، در حالی که مجریان قانون از آن برای نظارت و دستگیری استفاده می‌کنند. آینده اینجاست در هفته‌های اخیر، نگرانی‌ها در مورد هوش مصنوعی باعث ایجاد اتحادهای بعید در دنیای فناوری و سیاست شده است. غول‌های فناوری مانند سم آلتمن، ایلان ماسک و دمیس حسابیس به داریو آمودی، ساتیا نادلا و بیل گیتس در به صدا درآوردن زنگ خطر در مورد خطرات هوش مصنوعی پیوستند و خواستار کاهش سرعت توسعه فناوری با وجود سال‌ها رقابت برای تسلط شدند. سناتور برنی سندرز با استیو بنن متحد شد تا از کنگره بخواهد هوش مصنوعی را تنظیم کند، چیزی که به یکی از معدود موضوعاتی تبدیل شده است که آمریکایی ها را در سراسر طیف سیاسی متحد می کند. جرقه‌های اخیر تا حدی توسط ژاکوب کوکسون محقق هوش مصنوعی در توییتر/X انجام شد که شرکت‌های هوش مصنوعی «با زندگی ما قمار می‌کنند» و معتقدند که این فناوری «می‌تواند تا پایان دهه همه ما را بکشد». ادامه مطلب... در هفته‌های اخیر، نگرانی‌ها در مورد هوش مصنوعی باعث ایجاد اتحادهای بعید در دنیای فناوری و سیاست شده است. غول‌های فناوری مانند سم آلتمن، ایلان ماسک و دمیس حسابیس به داریو آمودی، ساتیا نادلا و بیل گیتس در به صدا درآوردن زنگ خطر در مورد خطرات هوش مصنوعی پیوستند و خواستار کاهش سرعت توسعه فناوری با وجود سال‌ها رقابت برای تسلط شدند. سناتور برنی سندرز با استیو بنن متحد شد تا از کنگره بخواهد هوش مصنوعی را تنظیم کند، چیزی که به یکی از معدود موضوعاتی تبدیل شده است که آمریکایی ها را در سراسر طیف سیاسی متحد می کند. واقعیت این است که ما نباید منتظر بمانیم تا ببینیم هوش مصنوعی چگونه مرگ و ویرانی بی‌سابقه‌ای را به بار خواهد آورد، زیرا قبلاً شاهد رها شدن آن بوده‌ایم. مقاله تقریباً 6000"}, {"source": "The Guardian AI", .theguardian.com/commentisfree/2026/sep/25/exercise-bad-bodies-ai-brains-students-tech-health", "summary": "I suspect nearly all of my students use AI, and I worry about its corrosive effects. We must not entrust tech companies with our long-term health Prof Devi Sridhar is chair of global public health at the University of Edinburgh When I was a postgraduate student at the University of Oxford in the early 2000s, I interviewed for a major consulting firm. All my friends were being recruited, and I thought why not give it a shot? Aside from the usual maths-proficiency test (how quickly can you crunch numbers in front of a client and look smart), I was asked about what the future of streaming could look like. I gave a long-winded answer about the unintended consequences of changing how humans interact with each other when a new technology is introduced, and why this may not be in the best interests of health and society. I even remember saying something like: “Can you imagine just being stuck at home, alone, watching show after show and never having to move or see any other people? Why would anyone choose that over going out to rent a DVD at a local shop, or to a movie theatre?” You won’t be surprised to learn that I wasn’t invited for a follow-up interview. Prof Devi Sridhar is chair of global public health at the University of Edinburgh Continue reading...", "date_str": "2026-09-25T09:00:45+00:00", "hash": "9001ed05d989e245", "title_fa": "همه ما می دانیم که ورزش نکردن برای بدن ما مضر است. پس تکیه بر هوش مصنوعی با مغز ما چه می کند؟ | دوی سریدار", "summary_fa": "من گمان می‌کنم تقریباً همه دانش‌آموزانم از هوش مصنوعی استفاده می‌کنند و نگران اثرات خورنده آن هستم. ما نباید سلامت بلندمدت خود را به شرکت‌های فناوری بسپاریم پروفسور دوی سریدار، رئیس بهداشت عمومی جهانی در دانشگاه ادینبورگ است. همه دوستان من در حال جذب بودند و من فکر کردم چرا به آن ضربه ندهم؟ جدای از آزمون معمول مهارت ریاضی (چقدر سریع می توانید اعداد را جلوی مشتری خرد کنید و باهوش به نظر برسید)، از من پرسیده شد آنچه اتفاق افتاد شروع کنیم. OpenAI یکی از قدرتمندترین شرکت های روی زمین است."}, {"source": "The Guardian AI", "title": "Launch of UK’s ‘largest AI supercomputer’ delayed by power supply problems", "link": "https://www.theguardian.com/technology/2026/sep/24/construction-largest-supercomputer-delayed", "summary": "Datacentre hailed by government was supposed to start operating next year but may be held back into mid-2030s A huge datacentre project hailed by the UK government will miss its launch date next year and could be delayed into the mid-2030s. The site in Loughton, Essex, was described as the country’s largest AI supercomputer when it was announced in 2025, but power supply problems mean it now faces a lengthy wait before coming online. Continue reading...", "date_str": "2026-09-24T17:26:26+00:00", "hash": "afd4de1d4f67012f", "title_fa": "راه اندازی \"بزرگترین ابررایانه هوش مصنوعی\" بریتانیا به دلیل مشکلات منبع تغذیه به تعویق افتاد", "summary_fa": "قرار بود مرکز داده‌ای که از سوی دولت مورد استقبال قرار گرفت، سال آینده شروع به کار کند، اما ممکن است تا اواسط دهه 2030 متوقف شود. این سایت در لافتون، اسکس، در زمان معرفی در سال 2025 به عنوان بزرگترین ابررایانه هوش مصنوعی کشور توصیف شد، اما مشکلات منبع تغذیه به این معنی است که اکنون قبل از آنلاین شدن با انتظار طولانی مواجه است. ادامه مطلب... پس از اینکه گاردین در ماه مارس فاش کرد که مکان برنامه ریزی شده هنوز یک محوطه داربست عملیاتی است، تردیدها در مورد این طرح ظاهر شده بود. اکنون نگرانی های بیشتری در مورد این پروژه به دلیل ناتوانی آن در به دست آوردن قدرت کافی قبل از شروع برنامه ریزی شده در سال 2027 وجود دارد. ابررایانه Loughton توسط Nscale، یک استارت‌آپ مستقر در بریتانیا، ساخته می‌شود که به‌دنبال فروش ۳۵ میلیارد دلاری (۲۶ میلیارد پوند) در سال جاری است. UK Power Networks (UKPN)، شرکتی که سایت را به شبکه برق محلی متصل خواهد کرد، به Nscale گفته است که شبکه تا اوایل تا اواسط دهه 2030 قادر به تامین برق کافی برای مرکز داده نخواهد بود. Nscale گفت که \"متعهد به پروژه است\" اما عدم یافتن راه حلی سریع برای مشکل منبع تغذیه نشان می دهد که چقدر انرژی به مانعی برای توسعه مرکز داده تبدیل شده است. با این حال، سایت حیاط داربست اکنون توسط Nscale پاکسازی شده است. این شرکت همچنین در حال بررسی است که آیا می تواند در محل برق تولید کند و آیا می تواند روند اتصال را سرعت بخشد. دولت کیر استارمر هنگام اعلام استراتژی هوش مصنوعی بریتانیا در سال 2025 از پروژه Loughton استناد کرد و این سایت را به عنوان \"بزرگترین مرکز داده مستقل هوش مصنوعی بریتانیا\" توصیف کرد. مراکز داده سیستم عصبی مرکزی فناوری هوش مصنوعی مانند چت بات ها هستند."}, {"source": "The Guardian AI", "title": "Ben Jennings on smart glasses and AI hacks – cartoon", "link": "https://www.theguardian.com/commentisfree/picture/2026/sep/24/ben-jennings-smart-glasses-ai-hacks-cartoon", "summary": "Continue reading...", "date_str": "2026-09-24T16:25:06+00:00", "hash": "cfdf956fb6fcae1d", "title_fa": "بن جنینگ در مورد عینک های هوشمند و هک های هوش مصنوعی - کارتون", "summary_fa": "ادامه مطلب..."}, {"source": "The Guardian AI", "title": "Parents and carers: how has your view on your children’s use of social media or AI changed?", "link": "https://www.theguardian.com/technology/2026/sep/24/parents-children-ai-social-media", "summary": "Is the scrutiny tech firms are facing making you rethink your children’s relationship with technology? Let us know AI and social media companies have drawn intense scrutiny in recent months for some of the ways the technology they’re building operates, especially when it comes to their younger users. Parents and regulators have accused companies like Meta of designing products that are addictive to younger users. AI developer OpenAI is facing dozens of lawsuits that allege its ChatGPT bot lacks safety guardrails. Now, in the last few weeks, employees of the biggest AI firms say the companies are more focused on competing with each other than building their AI models safely. Continue reading...", "date_str": "2026-09-24T15:59:08+00:00", "hash": "f5e35ca05b2981dc", "title_fa": "والدین و مراقبان: دیدگاه شما در مورد استفاده فرزندانتان از رسانه های اجتماعی یا هوش مصنوعی چگونه تغییر کرده است؟", "summary_fa": "آیا بررسی دقیق شرکت های فناوری باعث می شود که شما در مورد رابطه فرزندانتان با فناوری تجدید نظر کنید؟ به ما اطلاع دهید که شرکت‌های هوش مصنوعی و رسانه‌های اجتماعی در ماه‌های اخیر برای برخی از روش‌هایی که فناوری در حال ساخت آن‌ها عمل می‌کند، به‌ویژه وقتی صحبت از کاربران جوان‌ترشان می‌شود، به شدت مورد بررسی قرار گرفته‌اند. والدین و رگولاتورها شرکت هایی مانند متا را به طراحی محصولاتی که برای کاربران جوان اعتیادآور است متهم کرده اند. توسعه‌دهنده هوش مصنوعی OpenAI با ده‌ها پرونده قضایی مواجه است که ادعا می‌کند ربات ChatGPT آن فاقد حفاظ ایمنی است. اکنون، در چند هفته گذشته، کارمندان بزرگ‌ترین شرکت‌های هوش مصنوعی می‌گویند که شرکت‌ها بیشتر بر رقابت با یکدیگر تمرکز کرده‌اند تا اینکه مدل‌های هوش مصنوعی خود را ایمن بسازند. به خواندن ادامه دهید... شرکت ها به شدت این ادعاها را رد کرده اند و اقدامات ایمنی اضافی مانند حساب های نوجوان مرتبط با والدین را معرفی کرده اند. ما می‌خواهیم با والدین و مراقبان خود در مورد اینکه آیا شرکت‌های فناوری با آن‌ها مواجه هستند که باعث می‌شود در رابطه فرزندانتان با فناوری تجدید نظر کنید یا خیر صحبت کنیم. آیا دیدگاه شما در مورد آینده یا استفاده فعلی فرزندانتان از رسانه های اجتماعی یا هوش مصنوعی تغییر کرده است زیرا سؤالات بیشتر و بیشتری در مورد اینکه آیا شرکت های فناوری به نفع کاربران خود عمل می کنند یا خیر؟ آیا قصد داشتید یا قبلاً به فرزندان خود اجازه دهید از رسانه های اجتماعی یا چت ربات های هوش مصنوعی استفاده کنند؟ اگر چنین است، چگونه استفاده آنها از این پلتفرم ها را مدیریت کردید؟ آیا احساس می کنید جوانان در مورد نحوه استفاده از این ابزارها به اندازه کافی آموزش دیده اند؟ و برای هدایت آنها در این دنیای جدید چه می کنید؟"}, {"source": "The Guardian AI", "title": "AI hack of Medicare exposes Australia’s vulnerabilities and experts warn ‘there is more of this to come’", "link": "https://www.theguardian.com/australia-news/2026/sep/25/ai-hack-medicare-australia-vulnerabilities", "summary": "Council on AI Strategy chief says incident unlikely to be isolated and country should enhance ca
