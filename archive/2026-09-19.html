.zoomit.ir/car/467434-hyundai-ceo-warns-chinese-cars/", "summary": "مدیرعامل هیوندای هشدار داد در صورت نبود تعرفه‌ها و قوانین سخت‌گیرانه، خودروهای چینی سود خودروسازان در آمریکا را به‌شدت کاهش می‌دهند.", "date_str": "2026-09-18T14:45:00+00:00", "hash": "b6b01fdbe50b79fb", "title_fa": "مدیرعامل هیوندای: خودروهای چینی، بازار آمریکا را نابود می‌کنند", "summary_fa": "مدیرعامل هیوندای هشدار داد در صورت نبود تعرفه‌ها و قوانین سخت‌گیرانه، خودروهای چینی سود خودروسازان در آمریکا را به‌شدت کاهش می‌دهند. تبلیغات مدیرعامل هیوندای اعلام کرد ورود بدون مانع خودروسازان چینی به ایالات متحده می‌تواند حاشیه‌ی سود شرکت‌های حاضر در این بازار را همانند اروپا از بین ببرد. خوزه مونیوز بر لزوم حفظ تعرفه‌های گمرکی و تدوین شرایط ورود مشخص برای برندهای چینی تأکید دارد. مونیوز با تکیه بر تجربه‌ی یک دهه‌ای مدیریت خود در نیسان چین، وضعیت اروپا و به‌ویژه بریتانیا را نمونه‌ای از تاثیر حضور خودروهای چینی دانست. خودروهای ساخت چین در کشورهایی نظیر ایتالیا، اسپانیا و فرانسه با وجود اعمال تعرفه‌های اتحادیه‌ی اروپا، ۳۰ تا ۴۰ درصد ارزان‌تر از رقبای خود به فروش می‌رسند. مدیرعامل هیوندای، می‌گوید: «بریتانیا که در گذشته بازاری بسیار سودآور و قدرتمند بود، اکنون شبیه چین شده است. تمام پرفروش‌ترین‌ها چینی هستند، چرا که هیچ مانعی وجود ندارد.» آمارها نشان می‌دهند برندهای چینی بیش از ۹ درصد از فروش نیمه‌ی اول سال اتحادیه‌ی اروپا و ۱۵ درصد از ثبت‌نام‌های جدید بریتانیا را به خود اختصاص داده‌اند. مونیوز خواهان تعیین شروط ویژه برای ورود چین جهت به‌حداقل‌رساندن پیامدها است؛ هرچند پیش‌بینی می‌کند ورود رقبای چینی طی پنج تا ۱۰ سال آینده اجتناب‌ناپذیر خواهد بود. هیوندای توسعه‌ی فناوری خودران «سطح ۲ پلاس پلاس» خود را که رقیب سیستم خودران تسلا به شمار می‌رود، از اواخر سال ۲۰۲۷ به اواخر ۲۰۲۹ موکول کرد تا زمان بیشتری برای ارزیابی ایمنی داشته باشد. هم‌زمان، این گروه خودروسازی در تلاش است تا سال ۲۰۳۰ میلادی ۵۰۰ هزار دستگاه به ظرفیت تولید خود در آمریکای شمالی بیفزاید."}, {"source": "Business Insider", "title": "I used to associate thrift stores with poverty. My daughters-in-law taught me to see abundance instead.", "link": "https://www.businessinsider.com/mother-in-law-daughters-in-law-friendship-thrifting-2026-9", "summary": "The author started to thrift with her daughters in law. Courtesy of the author I first bonded with my daughters-in-law over Facebook Marketplace. They helped me feel comfortable wanting beautiful things without spending much money. Our secondhand shopping trips have become a treasured family tradition. I did not go to thrift stores when I was raising four sons on my own. I like to pretend I simply wasn't aware of the local thrift stores but this is a lie. The truth was, I was too ashamed of my poverty to shop at thrift stores. Too desperate to keep up pretenses , to show the rest of the world and especially my sons that we were doing fine. We went without a lot of the time. We were careful with hand-me-downs and Christmas gift cards from family members. We shopped in January in the discount bin . Every once in a while I'd splurge on new shoes or winter coats we couldn't afford and we suffered for it. The rent money gone, my tiny savings account depleted. Wasted on my need, my longing for stuff. Not just for my sons. For me. Good boots. Nice jeans. A statement coat. Costume jewelry . I would feel that low pull of craving and wish I had more of everything. For them, for me, for whatever rental home we could afford at the time. I wanted tablecloths. Candles. Big throw pillows that always seemed to cost a fortune. A sturdy cookie jar. Things that felt so silly and so far out of reach that I pushed the want for them down as far as I could. And then my sons grew up. And then they met my daughters-in-law. And then these four women opened my eyes to what thrifting could really look like. For me and for us as women learning our own love language together. They taught me about Facebook Marketplace It started with Facebook Marketplace during Covid lockdown, when we sheltered in place for weeks at a time my house and itched for something, anything to distract us. The author now thrifts with her daughters in law. Courtesy of the author I mentioned that I'd always wanted a cheval mirror for my room. My daughter-in-law scrolled through her phone for about one minute and said, \"Here's one for $40, they can deliver tomorrow. Want it? I'll get it for you!\" I couldn't believe something I'd considered for so many years, a mirror standing in my room, could be found so close and for so little. And found by someone who loved me so much that she wanted me to have things. Who understood me as a woman, not just as a mom. And so our adventures in thrifting began. These women brought", "date_str": "2026-09-19T13:58:01+00:00", "hash": "cc2a770eb3b5f04b", "title_fa": "من قبلاً مغازه های اجناس را با فقر مرتبط می دانستم. عروس هایم به من یاد دادند که در عوض فراوانی را ببینم.", "summary_fa": "نویسنده با عروس هایش شروع به صرفه جویی کرد. با حسن نیت نویسنده من ابتدا با عروس هایم از طریق فیس بوک مارکتز ارتباط برقرار کردم. آنها به من کمک کردند تا بدون صرف پول زیاد، چیزهای زیبا بخواهم. سفرهای خرید دست دوم ما به یک سنت ارزشمند خانوادگی تبدیل شده است. وقتی چهار پسر را به تنهایی بزرگ می‌کردم، به مغازه‌های دستفروشی نمی‌رفتم. من دوست دارم وانمود کنم که از فروشگاه های اقلام محلی بی خبرم، اما این یک دروغ است. حقیقت این بود که من از فقرم خجالت می‌کشیدم و نمی‌توانستم از مغازه‌های دستفروشی خرید کنم. خیلی ناامید هستم که نمی‌توانم به این ادعاها ادامه دهم، تا به بقیه دنیا و به خصوص پسرانم نشان دهم که کارمان خوب بود. بدون زمان زیادی رفتیم. ما مراقب کارت های هدیه کریسمس و دستمزد اعضای خانواده بودیم. ما در ژانویه از سطل تخفیف خرید کردیم. هر چند وقت یک بار کفش‌های جدید یا کت‌های زمستانی می‌خریدم که نمی‌توانستیم بخریم و از آن رنج می‌بردیم. پول اجاره از بین رفت، حساب پس انداز کوچک من تمام شد. هدر رفته در نیاز من، اشتیاق من برای چیزها. نه فقط برای پسرانم برای من چکمه های خوب شلوار جین زیبا یک کت بیانیه. جواهرات لباس. من آن ولع کم را احساس می‌کردم و ای کاش بیشتر از همه چیز داشتم. برای آنها، برای من، برای هر خانه اجاره ای که در آن زمان می توانستیم بپردازیم. من سفره میخواستم شمع. بالش های پرتابی بزرگ که به نظر می رسید همیشه هزینه زیادی دارند. یک ظرف کوکی محکم. چیزهایی که آنقدر احمقانه و دور از دسترس به نظر می‌رسیدند که تا آنجا که می‌توانستم نیاز به آنها را کاهش دادم. و سپس پسرانم بزرگ شدند. و بعد با عروسهایم آشنا شدند. و سپس این چهار زن چشمان من را به آنچه واقعاً می تواند"}, {"source": "Business Insider", "title": "I changed careers at 55 to become a flight attendant. I didn't expect my age to be such an advantage.", "link": "https://www.businessinsider.com/flight-attendant-midlife-career-change-2026-9", "summary": "Recently qualified flight attendant Craig Celek s favorite layover is Jackson Hole, Wyoming. Courtesy of Craig Celek Craig Celek left a retail position to become a flight attendant this year, in his mid-50s. He said he brought life experience and a strong work ethic to the role because of his age. The Gen-Xer described the job change as the \"third act\" in his career. This story is based on an interview with Craig Celek, 56, a flight attendant from Brooklyn. It has been edited for length and clarity. In February 2026, I embarked on what I call \"act three\" of my career. Right out of college, I worked for a publishing company in Hong Kong for 15 years before becoming a store manager at New Balance, and then taking a leadership role at Saks Off 5th. My 15 years in retail were amazing, but I started to get itchy feet. I started looking for my next opportunity, and a job on an airline was attractive to me. Friends my age are flight attendants I have a lot of friends my in their late 40s and 50s who have turned their second or third act into becoming flight attendants . They encouraged me to apply in November 2025. Have you got a story about launching a career in mid or later life? Please email Jane Ridley at jridley@businessinsider.com if you'd like to be interviewed by Business Insider. I knew that the main US airlines — American, United, and Delta — were open to hiring older people, especially those with a background in customer service. Celek works in all Delta classes. Courtesy of Craig Celek Each offered me a job, but I was most impressed with Delta's interview process. It felt reassuring that half of my tryout group was over 45. One was 62. So I took the training in early February. I'm sure my time in retail was the most important factor. Still, I think one of the reasons Delta hires Gen Xers is because we know how to work. Age often comes with patience and wisdom We have life experience, which translates into the ability to understand people's needs and respond in emergency situations. I came into the business seasoned, and I leaned into listening first rather than reacting. Age comes with patience and wisdom. The skills I developed during some of the most difficult days in retail have helped me every day in my new job. If the customer finds something not up to standard, your first thought is, \"How do I get them to where they are happy?\" Celek s father, Richard, 92, joined him on a trip to Paris free of charge. Courtesy of Craig Celek I was once on a flig", "date_str": "2026-09-19T12:55:01+00:00", "hash": "68212aa52762e99d", "title_fa": "من در 55 سالگی تغییر شغل دادم تا مهماندار هواپیما شوم. انتظار نداشتم سنم چنین امتیازی باشد.", "summary_fa": "مهماندار هواپیمای مورد علاقه کریگ سلک که اخیراً واجد شرایط شده است، جکسون هول، وایومینگ است. با حسن نیت از کریگ سلک کریگ سلک یک موقعیت خرده فروشی را ترک کرد تا در سال جاری، در اواسط 50 سالگی، مهماندار هواپیما شود. او گفت که به دلیل سنش تجربه زندگی و اخلاق کاری قوی را به این نقش آورده است. Gen-Xer تغییر شغل را \"سومین اقدام\" در حرفه خود توصیف کرد. این داستان بر اساس مصاحبه ای با کریگ سلک، 56 ساله، مهماندار هواپیما از بروکلین است. برای طول و وضوح ویرایش شده است. در فوریه 2026، کاری را که من «پرده سوم» کارم می‌نامم آغاز کردم. درست پس از پایان کالج، به مدت 15 سال برای یک شرکت انتشاراتی در هنگ کنگ کار کردم و سپس مدیر فروشگاه در New Balance شدم و سپس نقش رهبری را در Saks Off 5 به عهده گرفتم. 15 سال من در خرده فروشی شگفت انگیز بود، اما شروع به خارش پا کردم. من شروع به جستجوی فرصت بعدی کردم و کار در یک شرکت هواپیمایی برایم جذاب بود. دوستان هم سن و سال من مهماندار هواپیما هستند من دوستان زیادی دارم در اواخر 40 و 50 سالگی که دومین یا سومین کار خود را تبدیل به مهماندار هواپیما کرده اند. آنها مرا تشویق کردند که در نوامبر 2025 درخواست بدهم. آیا داستانی در مورد راه اندازی شغلی در اواسط یا اواخر زندگی دارید؟ اگر می‌خواهید با Business Insider مصاحبه کنید، لطفاً به جین ریدلی به آدرس jridley@businessinsider.com ایمیل بزنید. می‌دانستم که خطوط هوایی اصلی ایالات متحده - امریکن، یونایتد و دلتا - برای استخدام افراد مسن‌تر، به‌ویژه کسانی که سابقه خدمات مشتریان دارند، آماده هستند. Celek در تمام کلاس های دلتا کار می کند. با حسن نیت از کریگ سلک هر کدام به من پیشنهاد کاری دادند، اما من بیشتر تحت تاثیر"}, {"source": "Business Insider", "title": "My 3 kids are all enrolled at the same college. Knowing they're together helps, but I'm still struggling with my empty nest.", "link": "https://www.businessinsider.com/kids-enrolled-same-college-mom-struggling-empty-nest-2026-9", "summary": "The author (second from left) is still adjusting to her empty nest now that her three kids are in college. Courtesy of Cheryl Maguire My youngest kid just enrolled at the same college my older twins attend. The fact that three of them are together brings me joy, but I'm struggling with my empty nest. I've booked a trip and plan to hang out with other empty nesters to ease my transition. When I tell people that my youngest daughter is attending the same college as her older twin siblings, I always hear some variation of these questions: Did they always want to go to the same college? Are you happy you only need to do one drop-off? Are you getting a buy 2 get 1 free discount? The answer is no, yes, and I wish! The reaction people have had to them all attending the same school reminds me of when my twins were babies. People were fascinated and had lots of questions. Even though I am happy that they will have each other at Fordham University in New York, the transition has been hard for me. They have only been there a few weeks, and I have FOMO every time I talk to them. But this is all part of my transition into an empty nester . Preparation didn't help For the past year, I've been trying to mentally prepare for the time when all three kids will be in college. Anytime my youngest was at one of her many after-school activities , I would think, \"This is what it's going to be like.\" I even went on my first solo trip to start to get used to the idea of being without my kids. But as the name empty nest implies, there's an indescribable emptiness that is different from when she was living at home. Even though she was busy, she was always at home at night. She acts in musical theater, so she was always belting out songs at home. During the first week she was gone, my husband noticed the silence. He said, \"There's no singing anymore.\" I initially coped by cleaning After we moved them into their dorms, I returned home and began cleaning and decluttering . For the next week, I deep-cleaned all their bedding and every surface in their rooms, and donated extra items like sheets, blankets, and towels. When I told my youngest daughter how I spent my time, she replied, \"That sounds like a very empty nest thing to do.\" Cleaning didn't change the stillness, but having some control over an aspect of my life made me feel a little better. And their rooms never looked so clean, which was (as my daughter would say) very satisfying. Listening to music helped Besides singing, my dau", "date_str": "2026-09-19T12:07:01+00:00", "hash": "7892931258c627e9", "title_fa": "3 بچه من همه در یک کالج ثبت نام کرده اند. دانستن اینکه آنها با هم هستند کمک می کند، اما من هنوز با لانه خالی خود دست و پنجه نرم می کنم.", "summary_fa": "نویسنده (نفر دوم از چپ) اکنون که سه فرزندش در کالج هستند، هنوز در حال تطبیق با لانه خالی خود است. با حسن نیت از شریل مگوایر کوچکترین بچه من به تازگی در همان کالجی ثبت نام کرده است که دوقلوهای بزرگترم در آن شرکت می کنند. این که سه تای آنها با هم هستند برایم شادی می آورد، اما من با لانه خالی ام دست و پنجه نرم می کنم. من یک سفر رزرو کرده ام و قصد دارم با دیگر آشیانه های خالی معاشرت کنم تا انتقالم را تسهیل کنم. وقتی به مردم می گویم که دختر کوچکم در دانشگاهی با خواهر و برادرهای دوقلوی بزرگترش تحصیل می کند، همیشه انواعی از این سؤالات را می شنوم: آیا آنها همیشه می خواستند به همان کالج بروند؟ آیا خوشحال هستید که فقط یک بار باید انجام دهید؟ آیا خرید 2 دریافت 1 تخفیف رایگان دریافت می کنید؟ پاسخ منفی است، بله، و ای کاش! عکس العملی که مردم نسبت به حضور همه آنها در یک مدرسه داشته اند مرا به یاد دوران نوزادی دوقلوهایم می اندازد. مردم مجذوب شده بودند و سؤالات زیادی داشتند. با وجود اینکه خوشحالم که آنها در دانشگاه فوردهام نیویورک همدیگر را خواهند داشت، این انتقال برای من سخت بوده است. آنها فقط چند هفته است که آنجا بوده اند و هر بار که با آنها صحبت می کنم FOMO دارم. اما همه اینها بخشی از انتقال من به یک آشیانه خالی است. آماده سازی کمکی نکرد در سال گذشته، من سعی کرده ام از نظر ذهنی برای زمانی که هر سه بچه در دانشگاه خواهند بود آماده شوم. هر زمان که کوچکترین من در یکی از بسیاری از فعالیت‌های بعد از مدرسه او بود، فکر می‌کردم، \"این چیزی است که می‌شود.\" من حتی به اولین سفر انفرادی خود رفتم تا به ایده بدون بچه"}, {"source": "Business Insider", "title": "The US Army is getting enough drones, official says. Now, it needs to train enough operators.", "link": "https://www.businessinsider.com/us-army-has-drones-now-it-needs-trained-operators-2026-9", "summary": "Getting trained drone pilots down to the squadron level is the next step, an Army official said. Photo courtesy of the 11th Airborne Division The US Army is buying lots of drones to meet its goals of spreading the systems across the service. The next step is training enough pilots to operate them. Army courses and programs, as well as shared soldier feedback, help prepare troops for drone operations. US Army officials say the service has amassed enough small drones to spread them across its formations. Now the challenge is training soldiers to use them. \"We fielded 10,000 drones \" after the first phase of the Drone Dominance program, Col. Gregory Merkl, the director of drone dominance for the Army, said on Thursday during a media roundtable. \"We're in the process of receiving another 30,000 drones currently,\" he shared. \"That is enough absolutely to get them down to every squad level.\" \"Where we still have some work to do, candidly, is getting everybody trained at the appropriate level,\" he said. \"Right now, if you look across the force, you have that capability in every platoon. We still have a little bit of work to do in terms of getting qualified pilots down to the squad level.\" The Army plans to field thousands of low-cost, one-way attack drones by next fiscal year and has held a series of events to select drone companies for advancement in evaluations called Gauntlets. Last year, US Secretary of Defense Pete Hegseth issued a memo directing the overhaul of how the Pentagon buys and integrates small uncrewed aerial systems across the armed forces. That line of effort led to Drone Dominance , an iterative development program investing $1 billion to purchase at least 200,000 drones through 2027. As drones become more common in soldier arsenals, the Army is learning how best to train troops on using the systems. The Army has said it s integrating lessons on drone warfare and soldier feedback on systems across the service. US Army Photo by Cpl. Marie Paul The Army's efforts to train drone operators include specialized courses like the Unmanned Advanced Lethality Course and other programs focused on flying specific models of drones. The service is also exposing soldiers to drones starting in basic training. This approach gets troops familiar with the technology and then transitions them to tactics in different scenarios. One approach launched last year was a three-week crash course at Fort Rucker, Alabama. The pilot class was described as a \"catch-up\" to clo", "date_str": "2026-09-19T11:46:01+00:00", "hash": "2fbad86769c3a550", "title_fa": "این مقام می گوید که ارتش ایالات متحده به اندازه کافی هواپیماهای بدون سرنشین دریافت می کند. اکنون باید اپراتورهای کافی را آموزش دهد.", "summary_fa": "یک مقام ارتش گفت که رساندن خلبانان آموزش دیده پهپاد به سطح اسکادران گام بعدی است. عکس از لشکر 11 هوابرد ارتش ایالات متحده در حال خرید هواپیماهای بدون سرنشین زیادی برای رسیدن به اهداف خود در گسترش سیستم ها در سراسر سرویس است. مرحله بعدی آموزش خلبانان کافی برای کار با آنهاست. دوره ها و برنامه های ارتش و همچنین بازخورد مشترک سربازان به آماده سازی نیروها برای عملیات پهپادها کمک می کند. مقامات ارتش ایالات متحده می گویند که این سرویس به اندازه کافی پهپادهای کوچک را جمع آوری کرده است تا آنها را در ساختارهای خود پخش کند. اکنون چالش آموزش سربازان برای استفاده از آنها است. سرهنگ گرگوری مرکل، مدیر تسلط هواپیماهای بدون سرنشین ارتش، روز پنجشنبه در یک میزگرد رسانه ای گفت: \"ما 10000 پهپاد را پس از مرحله اول برنامه تسلط هواپیماهای بدون سرنشین به میدان فرستادیم\". او به اشتراک گذاشت: «در حال حاضر در حال دریافت 30000 پهپاد دیگر هستیم. این کاملاً کافی است تا آنها را به هر سطح تیمی برساند.» او گفت: «آنجا که ما هنوز کارهایی برای انجام دادن داریم، صراحتاً آموزش دادن همه در سطح مناسب است. «در حال حاضر، اگر به سراسر نیرو نگاه کنید، این قابلیت را در هر جوخه دارید. ما هنوز کمی کار داریم تا خلبانان واجد شرایط را به سطح جوخه برسانیم.\" ارتش در نظر دارد تا سال مالی آینده هزاران پهپاد تهاجمی یک طرفه و ارزان قیمت را روانه بازار کند و مجموعه ای از رویدادها را برای انتخاب شرکت های هواپیماهای بدون سرنشین برای پیشرفت در ارزیابی ها به نام Gauntlets برگزار کرده است. سیستم های هوایی کوچک بدون خدمه را در سراسر نیروهای مسلح یکپارچه می کند. این خط تلاش منجر به تسلط پهپادها شد، یک برنامه توسعه تکراری با سرمایه‌گذاری 1 میلیارد دلاری برای خرید حداقل 200000 پهپاد تا سال"}, {"source": "Business Insider", "title": "Ukraine's defense companies say soldiers want drones that do more on their own so one operator can control more at once", "link": "https://www.businessinsider.com/ukraines-pilots-want-less-need-control-drones-industry-autonomy-ai-2026-9", "summary": "Ukrainian drone pilots are asking for more autonomy in the systems so they can have more capacity to oversee multiple drones at once. Alfons Cabrera/NurPhoto via Getty Images Ukraine's soldiers want drones that require less hands-on control. More autonomy lets one operator supervise multiple drones from safer positions. AI is handling more flying while humans still decide when to strike. Ukraine's soldiers want drones and robots that can handle more of the flying and driving themselves, letting one operator oversee multiple systems instead of manually controlling each one. Ukraine's rapidly expanding arsenal of aerial drones and ground robots has become central to its fight against Russia's larger military. Defense technology companies say they're increasingly automating certain tasks while keeping humans responsible for decisions about using force. In practice, that means shifting more routine work from the operator to the drone. Newer systems can increasingly navigate, return to base, and help identify targets independently, allowing operators to focus on other tasks, from target confirmation to swarm control. Mykyta Rozhkov, the chief business development officer at Ukrainian defense technology company Frontline Robotics, told Business Insider that his company's innovation has come from soldier' requests. \"Our soldiers are coming to us with a request of: 'How can you provide us with the capability to have different robots controlled by one person?' or 'Can we make a shift of our UAV pilots easier?'\" The company responded to these requests by developing software that lets drones handle more of the flight themselves, including traveling to and from an area of interest with minimal input. \"In the new version of a drone that we produce right now and supply, there is an autonomy layer installed in the drone itself,\" Rozhkov explained. \"So it can go autonomously to the area of interest, then come back with basically one button.\" A \"pilot can bring the system home with a push of a button,\" and the drone can figure out the shortest way back, he said. Ukraine s Frontline Robotics says soldiers request technology that reduces their role in controlling drones. Frontline Robotics Autonomy is also being built into the company's product updates. The latest version of its Linza drone — the 3.0 released this year — has more onboard autonomy, so it can operate when GPS is unavailable because of Russian electronic warfare. It puts less \"mental demand on a soldier so they", "date_str": "2026-09-19T11:30:01+00:00", "hash": "7fb1f99cc9cadad5", "title_fa": "شرکت‌های دفاعی اوکراین می‌گویند سربازان هواپیماهای بدون سرنشینی را می‌خواهند که به تنهایی کار بیشتری انجام دهند تا یک اپراتور بتواند تعداد بیشتری را در یک لحظه کنترل کند", "summary_fa": "خلبانان هواپیماهای بدون سرنشین اوکراینی خواستار استقلال بیشتر در سیستم ها هستند تا بتوانند ظرفیت بیشتری برای نظارت بر چندین پهپاد به طور همزمان داشته باشند. Alfons Cabrera/NurPhoto via Getty Images سربازان اوکراین پهپادهایی می خواهند که به کنترل عملی کمتری نیاز دارند. استقلال بیشتر به یک اپراتور این امکان را می دهد که بر چندین پهپاد از موقعیت های امن تر نظارت کند. هوش مصنوعی پروازهای بیشتری را مدیریت می کند در حالی که انسان ها هنوز تصمیم می گیرند چه زمانی حمله کنند. سربازان اوکراینی هواپیماهای بدون سرنشین و روبات‌هایی می‌خواهند که بتوانند بیشتر پروازها و رانندگی را خودشان انجام دهند و به یک اپراتور اجازه می‌دهند به جای کنترل دستی هر یک از سیستم‌ها، بر چندین سیستم نظارت کند. زرادخانه پهپادهای هوایی و روبات‌های زمینی اوکراین که به سرعت در حال گسترش است، در مبارزه با ارتش بزرگ‌تر روسیه به مرکزیت تبدیل شده است. شرکت های فناوری دفاعی می گویند که به طور فزاینده ای وظایف خاصی را خودکار می کنند و در عین حال انسان ها را مسئول تصمیم گیری در مورد استفاده از زور می دانند. در عمل، این بدان معناست که کارهای معمول بیشتر از اپراتور به هواپیمای بدون سرنشین منتقل شود. سیستم های جدیدتر می توانند به طور فزاینده ای ناوبری کنند، به پایگاه برگردند، و به شناسایی اهداف به طور مستقل کمک کنند، و به اپراتورها اجازه دهند بر روی کارهای دیگر، از تأیید هدف گرفته تا کنترل ازدحام، تمرکز کنند. میکیتا روژکوف، افسر ارشد توسعه کسب و کار در شرکت فناوری دفاعی اوکراینی Frontline Robotics، به Business Insider گفت که نوآوری شرکت او ناشی از درخواست سربازان است. سربازان ما با این درخواست به ما می آیند: \"چگونه می توانید این قابلیت را برای ما فراهم کنید که ربات های مختلف را توسط یک نفر کنترل کنیم؟\" یا «آیا می‌توانیم جابجایی"}, {"source": "Business Insider", "title": "Get ready for higher holiday airfares as airlines cut flights over high fuel costs", "link": "https://www.businessinsider.com/airlines-cutting-flights-fuel-costs-higher-holiday-fares-2026-9", "summary": "Airlines executives said demand was strong for December but that they could cut more flights due to high fuel costs. Heather Khalifa/Bloomberg/Getty Images Airlines are cutting flights over the holidays due to high fuel costs. Executives said there could be further cuts and higher prices if fuel prices remain high. The price of oil surged past $100 a barrel this month. If you haven't booked your holiday flights yet, you may want to brace your wallet: Airlines are cutting options and potentially raising fares as oil prices reach new highs. After surging in the spring following the start of the war in Iran, oil prices surged yet again this summer and surpassed $100 a barrel this month; jet fuel is $4.53 a gallon as of Thursday. Data from the Bureau of Labor Statistics' latest consumer price index show airfares rose more than 23% year-over-year in August. Speaking at Morgan Stanley's Laguna Conference on Wednesday, major airline executives said they are cutting flights planned this holiday season and are likely to raise fares to offset oil spikes. Mike Leskinen, CFO of United Airlines , said the company is seeing strong demand and that its customers are \"incredibly, incredibly resilient,\" but United has already cut some routes that are on the low end of profitability and \"don't make sense in a higher fuel environment.\" \"As you look into the fourth quarter, there'll be some flights in December that we won't fly that we thought we were going to fly,\" Leskinen said. \"If fuel remains high, we'll make some adjustments into the first quarter and beyond into 2027.\" Southwest Airlines CFO Tom Doxey and American Airlines CFO Devon May similarly said demand is strong and that if high fuel prices persist, they would trim capacity and raise fares in response. However, the airline CFOs said it takes time for those increases to show up: \"Jet fuel price gets passed through with a lag,\" Leskinen said. \"Period.\" Doxey said that \"both from the booking curve and just kind of a natural lag, it takes a while for that to come,\" but Southwest has the \"ability to recover a good portion\" of those added costs. Sally French, a travel analyst at NerdWallet, said that, beyond high airfares, airlines have also increased checked-bag and seat-selection fees. \"The true cost of flying is higher than ever,\" she said. What flight cuts could mean for travelers It's unclear which specific flights and routes will be axed and how the airlines will rebook those affected. When trimming schedules, air", "date_str": "2026-09-19T11:11:01+00:00", "hash": "f355d7ab88bae54b", "title_fa": "برای قیمت‌های بیشتر در تعطیلات آماده شوید زیرا خطوط هوایی پروازها را به دلیل هزینه‌های سوخت بالا کاهش می‌دهند", "summary_fa": "مدیران خطوط هوایی گفتند که تقاضا برای ماه دسامبر زیاد است اما به دلیل هزینه بالای سوخت می توانند پروازهای بیشتری را کاهش دهند. هدر خلیفه/ بلومبرگ/ گتی ایماژ خطوط هوایی در تعطیلات به دلیل هزینه بالای سوخت، پروازهای خود را کاهش می دهند. مدیران گفتند اگر قیمت سوخت بالا بماند، ممکن است کاهش بیشتر و قیمت‌ها افزایش یابد. قیمت نفت در این ماه به بیش از 100 دلار در هر بشکه رسید. اگر هنوز پروازهای تعطیلات خود را رزرو نکرده‌اید، ممکن است بخواهید کیف پول خود را آماده کنید: خطوط هوایی گزینه‌های پیشنهادی خود را کاهش می‌دهند و به‌طور بالقوه نرخ‌ها را با رسیدن قیمت نفت به بالاترین حد خود افزایش می‌دهند. پس از افزایش در بهار پس از شروع جنگ در ایران، قیمت نفت بار دیگر در تابستان امسال افزایش یافت و در این ماه از 100 دلار در هر بشکه گذشت. سوخت جت از روز پنجشنبه 4.53 دلار در هر گالن است. داده‌های جدیدترین شاخص قیمت مصرف‌کننده اداره آمار کار نشان می‌دهد که نرخ بلیت هواپیما در ماه اوت بیش از 23 درصد نسبت به مدت مشابه سال گذشته افزایش یافته است. مدیران شرکت های هواپیمایی بزرگ روز چهارشنبه در سخنرانی در کنفرانس لاگونا مورگان استنلی گفتند که پروازهای برنامه ریزی شده در این فصل تعطیلات را کاهش می دهند و احتمالاً برای جبران افزایش قیمت نفت، قیمت ها را افزایش می دهند. مایک لسکینن، مدیر مالی یونایتد ایرلاینز، گفت که این شرکت شاهد تقاضای قوی است و مشتریانش «به‌طور باورنکردنی و فوق‌العاده انعطاف‌پذیر» هستند، اما یونایتد قبلاً برخی از مسیرهایی را که سودآوری پایینی دارند و «در محیط‌های با سوخت بالاتر منطقی نیستند» کاهش داده است. لسکینن گفت: «همانطور که به سه ماهه چهارم نگاه می‌کنید، در ماه دسامبر پروازهایی وجود خواهد داشت که ما آنطور که فکر می‌کردیم می‌خواهیم پرواز کنیم، پرواز نمی‌کنیم. \"اگر سوخت"}, {"source": "Business Insider", "title": "After my husband was diagnosed with colon cancer at 45, we changed our family diet. Here's what we eat — and don't eat — now.", "link": "https://www.businessinsider.com/husband-colon-cancer-changed-kids-family-diet-2026-9", "summary": "The author s husband was diagnosed with colon cancer at 45. Courtesy of Lindsay Karp My husband, 45, is a doctor and encourages his patients to get routine colonoscopies on time. When he went in for his own, he was surprised to be diagnosed with colon cancer. He had no symptoms. Now, we're changing our diets, and what our kids eat, as well. When my husband, a doctor, went in for his first routine colonoscopy at 45 years old, he said nonchalantly, \"I'll be done by noon. Then we can grab lunch.\" He recommends that his patients be screened on time, so he was simply following his own advice. He had no symptoms suggesting anything was wrong, so when they found a few polyps — the largest one measuring 55 millimeters — we were caught off guard. A second procedure was necessary to remove the larger polyp, and when the biopsy came back showing cancer, our lives crumbled in an instant. The right portion of his colon was removed, and three weeks later, our whirlwind nightmare began to settle. Luckily, having his screening on time saved his life. Now, we're focused on preventive care . We're changing our diets, and what our kids eat, too An average person has about a 4% to 5% lifetime chance of developing colorectal cancer — but having one affected parent raises that risk to roughly 5% to 15%. Someone with a first-degree relative who had colon cancer should have their first screening at 40 or 10 years younger than their family member was diagnosed, whichever comes sooner — for our kids, that means being screened at 35. With double to triple the risk, I want to be as proactive as I can for my children — now ages 15 and 11 — and that means altering their diet (and ours!) to limit foods that may increase risk. We've read through current research and determined which changes are worth making. We don't plan to restrict them completely from all foods associated with higher risk because we realize that's unrealistic (and we want them to enjoy eating), but we'll teach them to savor these foods in moderation. We're limiting how often we eat some foods First, processed meats will largely be eliminated from their diet. Our bacon-loving sons have only enjoyed this delicacy as a treat during vacations, and that plan will continue. They'll only indulge in other processed meats like hot dogs or ham when served at a barbecue or other social gathering. And cold cuts have been eliminated from our home, except for sliced turkey from our local market, which they prepare in-house without ", "date_str": "2026-09-19T11:07:01+00:00", "hash": "6dcbde7172378393", "title_fa": "بعد از اینکه همسرم در 45 سالگی به سرطان روده بزرگ مبتلا شد، رژیم غذایی خانواده خود را تغییر دادیم. این چیزی است که ما می خوریم - و نمی خوریم - اکنون.", "summary_fa": "همسر نویسنده در 45 سالگی به سرطان روده بزرگ مبتلا شد. با احترام لیندزی کارپ شوهر من، 45 ساله، یک پزشک است و بیماران خود را تشویق می کند تا کولونوسکوپی های معمول را به موقع انجام دهند. وقتی برای خودش رفت، از تشخیص سرطان روده بزرگ شگفت زده شد. هیچ علامتی نداشت. اکنون، ما در حال تغییر رژیم غذایی خود و همچنین آنچه که بچه هایمان می خورند، داریم. وقتی شوهرم که یک پزشک بود در 45 سالگی برای اولین بار کولونوسکوپی معمولی خود را رفت، با ناراحتی گفت: «تا ظهر تمام می‌کنم. سپس می‌توانیم ناهار بخوریم.\" او توصیه می‌کند که بیمارانش به موقع معاینه شوند، بنابراین فقط توصیه‌های خودش را دنبال می‌کرد. هیچ علامتی نداشت که نشان دهد چیزی اشتباه است، بنابراین وقتی چند پولیپ پیدا کردند - بزرگترین پولیپ به اندازه 55 میلی‌متر - ما غافلگیر شدیم. برای برداشتن پولیپ بزرگ‌تر یک عمل دوم ضروری بود، و وقتی بیوپسی برگشت، زندگی‌مان را نشان داد. قسمت سمت راست روده بزرگ او برداشته شد و سه هفته بعد، کابوس گردباد ما شروع به فروکش کرد. خوشبختانه، نمایش به موقع او زندگی او را نجات داد. اکنون، ما بر مراقبت های پیشگیرانه متمرکز شده ایم. ما در حال تغییر رژیم غذایی خود هستیم، و همچنین آنچه که بچه هایمان می خورند، یک فرد معمولی در طول زندگی 4 تا 5 درصد شانس ابتلا به سرطان کولورکتال را دارد - اما داشتن یکی از والدین مبتلا این خطر را به 5 تا 15 درصد افزایش می دهد. فردی که یکی از بستگان درجه یک خود سرطان روده بزرگ داشته است، باید اولین غربالگری خود را در سن 40 یا 10 سال کوچکتر از اعضای خانواده‌اش انجام دهد، هر کدام که زودتر انجام شود - برای بچه‌های ما این به معنای غربالگری در 35 سالگی است. خطر ما تحقیقات فعلی را خوانده‌ایم"}, {"source": "Business Insider", "title": "The leader of PwC's 2,200-person DC office says clients expect some consulting work twice as fast as a year ago", "link": "https://www.businessinsider.com/pwcs-dc-leader-jeanelle-johnson-ai-speeding-up-consulting-2026-9", "summary": "Jeanelle Johnson, managing partner of PwC in the Washington DC area PwC AI is raising clients' expectations for faster delivery times on consulting projects. Jeanelle Johnson, PwC's DC managing partner, said clients now expect some work to be delivered in half the time. Faster delivery should not be confused with less work, said Johnson. AI is resetting assumptions about how quickly professional services firms should move, and consulting clients are getting impatient. \"I am seeing clients ask for our help in delivering outcomes at a more rapid pace\" compared to this time last year, Jeanelle Johnson, PwC's managing partner for the Washington DC area, told Business Insider. \"Something that we might have said takes eight to 10 weeks; the expectation is probably half of that. The shelf life is half,\" Johnson said. Clients are not necessarily expecting an entire transformation to be completed in a fraction of the time; the expectation is more for pilots and proofs of concepts, she said. \"There's an expectation now that tools should accelerate the work,\" she added. Johnson leads more than 2,200 consulting and accounting employees in her role as PwC's DC managing partner. Asked whether those compressed timelines were putting pressure on her consulting teams, she said: \"We're working on it.\" The Big Four professional services firms — PwC, Deloitte, KPMG, and EY — alongside firms like McKinsey, BCG, and Accenture, are at the center of the AI shift sweeping through workplaces. They have raced to build internal chatbots, train staff, and test AI in client work. The technology can now assist with, and increasingly perform, early-stage consulting tasks such as market research, due diligence, and brainstorming. At McKinsey, AI has accelerated the early problem-solving cycle, turning what used to be a team's \"week one answer\" — the first hypothesis after a week of research and analysis — into an \"hour one answer,\" Kate Smaje, McKinsey's Global Leader for technology and AI, told Business Insider in June. That frees up consultants to spend more time testing deeper parts of the issue tree rather than waiting days to get oriented, Smaje said. Have a tip or story to share about working in consulting? Contact this reporter via email at pthompson@businessinsider.com or Signal at Polly_Thompson.89. Use a personal email address, a nonwork WiFi network, and a nonwork device; here's our guide to sharing information securely . Amid the rank and file, employees at top firms have told", "date_str": "2026-09-19T10:21:01+00:00", "hash": "2da536a8ec6975aa", "title_fa": "رهبر دفتر 2200 نفره DC PwC می گوید که مشتریان انتظار دارند کار مشاوره دو برابر سریعتر از یک سال قبل انجام شود.", "summary_fa": "Jeanelle Johnson، شریک مدیریت PwC در منطقه واشنگتن دی سی PwC AI انتظارات مشتریان را برای زمان تحویل سریع‌تر پروژه‌های مشاوره افزایش می‌دهد. Jeanelle Johnson، شریک مدیریت DC PwC، گفت که مشتریان اکنون انتظار دارند که برخی از کارها در نیمی از زمان تحویل داده شود. جانسون گفت: تحویل سریعتر نباید با کار کمتر اشتباه گرفته شود. هوش مصنوعی مفروضات مربوط به سرعت حرکت شرکت‌های خدمات حرفه‌ای را بازنشانی می‌کند و مشتریان مشاوره بی‌صبر می‌شوند. جینل جانسون، شریک مدیریت PwC در منطقه واشنگتن دی سی، به Business Insider گفت: «می بینم که مشتریان از ما برای ارائه نتایج با سرعت بیشتری در مقایسه با سال گذشته درخواست کمک می کنند». جانسون گفت: \"چیزی که ممکن است گفته باشیم 8 تا 10 هفته طول می کشد؛ انتظار احتمالاً نیمی از آن است. عمر مفید آن نصف است.\" مشتریان لزوماً انتظار ندارند که یک تحول کامل در کسری از زمان تکمیل شود. او گفت که انتظار بیشتر برای خلبانان و اثبات مفاهیم است. او افزود: \"اکنون این انتظار وجود دارد که ابزارها باید کار را تسریع کنند.\" جانسون بیش از 2200 کارمند مشاور و حسابداری را در نقش خود به عنوان شریک مدیریت DC PwC رهبری می کند. او در پاسخ به این سوال که آیا این جدول‌های زمانی فشرده بر تیم‌های مشاوره‌اش فشار می‌آورد، گفت: \"ما در حال کار روی آن هستیم.\" چهار شرکت بزرگ خدمات حرفه‌ای - PwC، Deloitte، KPMG و EY - در کنار شرکت‌هایی مانند McKinsey، BCG و Accenture، در مرکز تغییر هوش مصنوعی در محیط‌های کاری قرار دارند. آنها برای ساخت ربات‌های گفتگوی داخلی، آموزش کارکنان و آزمایش هوش مصنوعی در کار مشتری مسابقه داده‌اند. این فناوری اکنون می‌تواند به وظایف مشاوره در مراحل اولیه مانند تحقیقات بازار، بررسی دقیق و طوفان فکری کمک کند و به طور فزاینده‌ای انجام دهد. در ماه ژوئن، کیت اسماژ، رهبر"}, {"source": "Business Insider", "title": "Inside the squishy nightmare: Explosions, burns, and thousands of calls to poison control", "link": "https://www.businessinsider.com/squishy-toys-safety-exploding-burns-kids-2026-9", "summary": "Jim Franco/Albany Times Union via Getty Images; Rebecca Zisser/BI Warning: Some of the images you may see are graphic. For questions or if you suspect a poisoning, contact Poison Help at PoisonHelp.org or call 1-800-222-1222. Katie Zerbst was doing laundry on a Sunday morning in June when she heard a \"guttural\" moan. \"It was the sound that makes you just drop everything and run,\" the 45-year-old mother told Business Insider. Rushing into the kitchen, Zerbst found her 10-year-old daughter, Violet, covered in steaming hot, sparkly goo. Burns seared across her face, and skin from her top lip was flapping down into her mouth. Moments earlier, Violet had popped a squishy toy into the microwave for 30 seconds. She wanted to make the glittery cube more malleable so she could squish it more easily. When she pulled it out, it erupted like a volcano. Violet ended up in the emergency room, and she isn't the only child to visit the hospital after playing with a squishy. Violet Zerbst, 10, suffered burns on her face and body after a squishy toy exploded. Katie Zerbst Business Insider reviewed dozens of incident reports, spoke to parents, and consulted doctors and regulators about the risks behind this year's biggest toy craze. Despite a spike in reports of burns and concerns about toxic exposure, oversight of squishies — slime-filled toys shaped like dumplings, fruit, ice cubes, and other cute characters — falls into a regulatory gray area, and the market is teeming with counterfeits and knockoffs. Have a squishy story to share? Reach out to Business Insider correspondent Jane Ridley: jridley@businessinsider.com. What's in a squishy? Squishies, with their gooey, foamy, or gel-like textures, fall into the category of \"sensory toys,\" like fidget spinners, kinetic sand, and magnetic balls. In recent years, the toys have gone \"from zero to hero,\" Five Below CEO Winnie Park told investors in June. They're helping the retailer to become \"America's greatest little toy store\" by driving brick-and-mortar traffic, Park said on September's earnings call. Kohl's also credited the toy with a sales bump, and workers from several retailers have taken to social media with tales of over-eager customers demanding their favorite squishies. Instagram and TikTok are full of satisfying videos of hands squishing toys shaped like a strawberry or a tube of toothpaste. However, reports from homes and hospitals across the country describe exploding and leaking toys, along with chemical smells. A", "date_str": "2026-09-19T10:00:01+00:00", "hash": "3dd1ef9380313489", "title_fa": "درون کابوس مهیب: انفجار، سوختگی و هزاران تماس برای کنترل سموم", "summary_fa": "جیم فرانکو/ اتحادیه آلبانی تایمز از طریق گتی ایماژ. هشدار Rebecca Zisser/BI: برخی از تصاویری که ممکن است مشاهده کنید گرافیکی هستند. برای سؤال یا اگر مشکوک به مسمومیت هستید، با Poison Help در PoisonHelp.org تماس بگیرید یا با شماره 1-800-222-1222 تماس بگیرید. کتی زربست در صبح یکشنبه ژوئن مشغول شستن لباس‌ها بود که صدای ناله‌ای را شنید. این مادر 45 ساله به Business Insider گفت: \"این صدا بود که باعث می شد همه چیز را رها کنید و بدوید.\" زربست با عجله وارد آشپزخانه شد، دختر 10 ساله‌اش، ویولت، را دید که در بخار داغ و درخشان پوشیده شده بود. سوختگی روی صورتش جوشیده بود و پوست لب بالایش به سمت دهانش می ریخت. لحظاتی قبل، ویولت یک اسباب‌بازی شیک را به مدت 30 ثانیه در مایکروویو انداخته بود. او می خواست مکعب براق را انعطاف پذیرتر کند تا بتواند راحت تر آن را له کند. وقتی او آن را بیرون کشید، مانند یک آتشفشان فوران کرد. ویولت به اورژانس رفت و او تنها کودکی نیست که پس از بازی با یک اسکویشی به بیمارستان مراجعه می کند. ویولت زربست، 10 ساله، پس از انفجار یک اسباب‌بازی مرموز، در صورت و بدن خود دچار سوختگی شد. Katie Zerbst Business Insider ده‌ها گزارش حادثه را بررسی کرد، با والدین صحبت کرد، و با پزشکان و قانون‌گذاران در مورد خطرات بزرگ‌ترین شوق اسباب‌بازی امسال مشورت کرد. علیرغم افزایش گزارش‌های سوختگی و نگرانی‌ها در مورد قرار گرفتن در معرض سمی، نظارت بر ماهی‌ها - اسباب‌بازی‌های پر از لجن که به شکل کوفته‌ها، میوه‌ها، تکه‌های یخ و دیگر شخصیت‌های بامزه هستند - در یک منطقه خاکستری نظارتی قرار می‌گیرد و بازار مملو از تقلبی‌ها و غیره است. آیا یک داستان شیک برای به اشتراک گذاشتن دارید؟ با جین ریدلی خبرنگار Business Insider تماس بگیرید: jridley@businessinsider.com. چه چیزی در یک squishy؟ اسکوئیشی ها با"}, {"source": "Business Insider", "title": "Warren Buffett has stepped down as Berkshire chairman. Here are 5 leadership lessons he leaves behind.", "link": "https://www.businessinsider.com/leadership-lessons-warren-buffett-steps-down-chairman-2026-9", "summary": "Warren Buffett s decades leading Berkshire Hathaway yielded numerous lessons, including learning from mistakes. Nati Harnik/AP This week, the Oracle of Omaha gave up his job of chairman of Berkshire Hathaway. After decades at the top, Warren Buffett leaves a legacy of leadership advice. He has emphasized the importance of self-improvement, honesty, and choosing the right leaders. If you want to be a high-mileage leader like Warren Buffett, it pays to be humble. The Oracle of Omaha this week gave up the job as chairman of Berkshire Hathaway, after more than half a century spent building and then running the conglomerate. Buffett said his son Howard would succeed him as chairman. In that role, his son will guard Berkshire's culture and values, which the elder Buffett said are \"worth more than anything on our balance sheet.\" That belief in the importance of organizational culture is nothing new for Buffett who has, over the years, offered a steady stream of advice on investing and leadership. Last year, in his final Thanksgiving letter to shareholders as CEO, he shared insights on the virtues of stewardship, honesty, and what he described as \"good intentions\" gone awry in attempts to rein in CEO pay. One broad takeaway was his call to continue learning and growing. \"Choose your heroes very carefully and then emulate them. You will never be perfect, but you can always be better,\" Buffett wrote. Here are five other lessons Buffett shared: Stay humble The 96-year-old famously ran Berkshire with an unfussy, meat-and-potatoes sensibility. Buffett wrote about the role luck played in his life and work, and how that experience continually honed his sense of humility. \"Keep in mind that the cleaning lady is as much a human being as the Chairman,\" Buffett said. He also grounded some of his humble inclinations in the luck he had, being a man — compared with his sisters, whom he described as having \"equal intelligence and better personalities,\" though they faced a much different outlook. \"I was born in 1930 healthy, reasonably intelligent, white, male and in America. Wow! Thank you, Lady Luck,\" he said. Learn from your errors Buffett said that while he's made many mistakes, he's tried to use them as springboards for growth. \"Learn at least a little from them and move on,\" Buffett wrote. One misstep, he said, was not intervening more forcefully when he saw indications that a \"wonderful and loyal CEO\" of a parent or subsidiary company would \"succumb to dementia, Alzheimer'", "date_str": "2026-09-19T09:51:02+00:00", "hash": "89866e24c475e1b9", "title_fa": "وارن بافت از ریاست برکشایر کنار رفت. در اینجا 5 درس رهبری که او پشت سر گذاشته است آورده شده است.", "summary_fa": "دهه‌های رهبری وارن بافت برکشایر هاتاوی، درس‌های متعددی از جمله یادگیری از اشتباهات را به همراه داشت. Nati Harnik/AP این هفته، Oracle of Omaha از شغل خود به عنوان رئیس برکشایر هاتاوی صرف نظر کرد. وارن بافت پس از دهه‌ها حضور در اوج، میراثی از توصیه‌های رهبری به جا می‌گذارد. او بر اهمیت خودسازی، صداقت و انتخاب رهبران مناسب تاکید کرده است. اگر می‌خواهید مانند وارن بافت رهبر مسافت پیموده‌ای باشید، باید متواضع باشید. Oracle of Omaha این هفته از سمت ریاست برکشایر هاتاوی پس از بیش از نیم قرن صرف ساخت و سپس اداره این مجموعه، دست از کار کشید. بافت گفت که پسرش هاوارد جانشین او به عنوان رئیس خواهد شد. در این نقش، پسرش از فرهنگ و ارزش‌های برکشایر محافظت می‌کند، که بافت بزرگ گفت: «بیش از هر چیزی در ترازنامه ما ارزش دارد». این اعتقاد به اهمیت فرهنگ سازمانی برای بافت چیز جدیدی نیست که در طول سال‌ها، جریان ثابتی از مشاوره در زمینه سرمایه‌گذاری و رهبری ارائه کرده است. سال گذشته، او در آخرین نامه شکرگزاری خود به سهامداران به عنوان مدیرعامل، بینش هایی را در مورد فضایل سرپرستی، صداقت، و آنچه به عنوان \"نیت خیر\" توصیف کرد که در تلاش برای مهار دستمزد مدیر عامل به خطا رفته است، به اشتراک گذاشت. یکی از نکات مهم فراخوان او برای ادامه یادگیری و رشد بود. بافت نوشت: \"قهرمانان خود را بسیار با دقت انتخاب کنید و سپس از آنها تقلید کنید. شما هرگز کامل نخواهید بود، اما همیشه می توانید بهتر باشید.\" این هم پنج درس دیگر که بافت به اشتراک گذاشته است: متواضع باشید این پیرمرد 96 ساله مشهور برکشایر را با حساسیتی بی‌هیچ‌و‌چرخ و گوشت و سیب‌زمینی اداره می‌کرد. بافت در مورد نقشی که شانس در زندگی و کارش ایفا کرد و اینکه چگونه آن تجربه به طور مداوم احساس فروتنی او را"}, {"source": "Business Insider", "title": "Why BofA is going against the herd and calling for 2 more rate hikes in 2026", "link": "https://www.businessinsider.com/fed-rate-hikes-kevin-warsh-trump-stocks-oil-prices-inflation-2026-9", "summary": "FOMC Bank of America predicts two more Fed rate hikes in 2026. Hikes \"increasingly seem like an opportunity for Chair Warsh to burnish his legacy,\" BofA said. Market consensus is for one more rate hike in 2026. Bank of America thinks the Federal Reserve has just kicked off a hiking spree heading that will continue for the rest of its meetings through yearend. In a note on Friday, the bank said it expects the Fed to hike interest rates two more times in 2026, following September's 25 basis-point hike. Markets are pricing in one more rate hike in 2026 as the most likely outcome, eyeing an increase at the December meeting. BofA unpacked a couple of reasons the market may get more hikes than it's expecting. One is simply that the economy remains strong, supporting the view that inflation could be stubborn. Inflation has remained sticky, with CPI at 3.4% year-over-year the last two months. But the second is that hikes have actually appeared to become \"politically expedient\" for Fed chair Kevin Warsh, the bank said, despite President Donald Trump's insistence that the Fed slash rates. Hikes allow the Fed to cap long-term bond yields after rising oil prices and the Treasury's buyback program spooked investors about the prospect of further inflation. Surging yields on assets like 10-year and 30-year Treasurys had started to weigh on equity prices. So a hawkish Fed at the moment appears to be a boon for markets and lends credibility to Warsh, the bank said. \"Fed hikes looked politically challenging a few months ago, but they increasingly seem like an opportunity for Chair Warsh to burnish his legacy,\" Aditya Bhave, US economist at the bank, wrote in the note. On the September hike, Bhave added: \"For one, the rate hike alleviates concerns that Warsh is not politically independent. Additional increases would end that conversation for good. For another, by hiking at just his third meeting as Fed Chair, Warsh can absolve himself of the inflation problem, while also taking credit for any disinflation in coming months.\" After three consecutive rate hikes to end 2026, Bhave said that policy adjustments would see an extended pause. Neil Dutta, the head of economics at Renaissance Macro Research, also said Warsh may be even more serious than some investors are anticipating. Dutta said on Friday that, despite Warsh's disdain for forward guidance, he gave clues about his hawkish views on monetary policy at Wednesday's meeting. For example, Warsh warned that high commodity pri", "date_str": "2026-09-19T09:45:01+00:00", "hash": "763411b30104747e", "title_fa": "چرا BofA مخالف گله است و خواهان 2 افزایش نرخ بیشتر در سال 2026 است", "summary_fa": "بانک FOMC آمریکا دو افزایش نرخ بهره دیگر را در سال 2026 پیش‌بینی می‌کند. BofA گفت، افزایش‌ها \"به‌طور فزاینده‌ای فرصتی برای رئیس وارش به نظر می‌رسد تا میراث خود را بشناسد.\" اجماع بازار برای افزایش مجدد نرخ بهره در سال 2026 است. بانک آمریکا فکر می کند که فدرال رزرو به تازگی حرکتی را آغاز کرده است که تا پایان سال ادامه خواهد داشت. در یادداشتی در روز جمعه، این بانک اعلام کرد که انتظار دارد فدرال رزرو در سال 2026، پس از افزایش 25 واحدی در سپتامبر، دو بار دیگر نرخ بهره را افزایش دهد. بازارها در سال 2026 به عنوان محتمل ترین نتیجه، یک افزایش نرخ دیگر را قیمت گذاری می کنند و در نشست دسامبر چشم به افزایش قیمت دارند. BofA چند دلیل را بازگشایی کرد که ممکن است بازار بیش از حد انتظارش افزایش یابد. یکی این است که اقتصاد قوی باقی می ماند و از این دیدگاه حمایت می کند که تورم می تواند سرسخت باشد. تورم ثابت باقی مانده است و CPI در دو ماه گذشته 3.4 درصد نسبت به مدت مشابه سال قبل بوده است. اما دومین مورد این است که علیرغم اصرار رئیس جمهور دونالد ترامپ مبنی بر کاهش نرخ بهره توسط فدرال رزرو، به نظر می رسد که افزایش ها در واقع برای کوین وارش، رئیس فدرال رزرو، \"از نظر سیاسی مصلحت\" شده است. افزایش ها به فدرال رزرو اجازه می دهد تا پس از افزایش قیمت نفت و برنامه بازخرید خزانه داری که سرمایه گذاران را از دورنمای تورم بیشتر نگران کرد، بازده اوراق قرضه بلندمدت را محدود کند. افزایش بازدهی دارایی هایی مانند خزانه داری های 10 ساله و 30 ساله روی قیمت سهام تاثیر گذاشته است. این بانک گفت، بنابراین به نظر می رسد یک فدرال رزرو در حال حاضر یک امتیاز برای بازارها باشد و به وارش"}, {"source": "Business Insider", "title": "Microsoft’s AI CEO says ‘controlling’ AI ‘is going to be a really, really big challenge’", "link": "https://www.businessinsider.com/microsoft-ai-ceo-controlling-alignment-mustafa-suleyman-2026-9", "summary": "Microsoft AI CEO Mustafa Suleyman Bloomberg/Getty Images Microsoft AI CEO Mustafa Suleyman said AI labs need to ensure they can control what they're creating. \"We should not create something that we can't control,\" Suleyman said. Suleyman questioned why some in tech are so opposed to new regulations. Microsoft AI CEO Mustafa Suleyman says it's \"surreal\" that he has to say AI needs to align with humanity. \"We should not create something that we can't control,\" Suleyman said Friday on CNBC's \"Squawk Box.\" \"And if it looks like we're on a path to producing something that is not just more powerful than all of us combined, but is, as a result, something that we can't control, then it's going to fail in its fundamental purpose.\" Success will not come easily, Suleyman said. \"Controlling these things are going to be a really, really big challenge for us,\" he said. Suleyman said he was \"glad to see a lot more people\" supporting the idea that tech companies and frontier model makers need to maintain control over their AI systems. In the industry, ensuring AI acts in accordance with human intentions is called alignment. \"But there's a growing group of people that think that we are doing it for its own sake, and we just want to turn over the next card, see what's around the corner, and create something that is just going to slip our own leash,\" he said. Suleyman's comments come at a time of increased attention to AI safety, after former Anthropic researcher Jacob Coxon warned that AI workers are privately fearful that AI could wipe out humanity. In recent days, Anthropic CEO Dario Amodei , OpenAI CEO Sam Altman, and SpaceX CEO Elon Musk have all expressed broad agreement that frontier AI labs should better pace their advancements to ensure that safety measures can keep up. Before Coxon's viral post, many in the industry were already concerned about safety after OpenAI revealed that its agents had breached Hugging Face , illustrating the potential consequences of losing control over AI systems. Suleyman called the breadth of the Hugging Face breach and OpenAI's initial unawareness of what its AI agents were doing \"remarkable.\" \"It has moved everybody from Elon and Zuck to me, Sam, Dario, and everybody else in between to say it's time that we take a look at this,\" Suleyman said. \"I don't think it's overly alarmist. I don't think it's self-interested. I actually think it's responsible.\" Meta CEO Zuckerberg has taken a different stance than Amodei and other AI leaders. Ea", "date_str": "2026-09-19T09:37:01+00:00", "hash": "0d998235d35aca0b", "title_fa": "مدیر عامل هوش مصنوعی مایکروسافت می گوید \"کنترل\" هوش مصنوعی \"یک چالش واقعاً بسیار بزرگ خواهد بود\"", "summary_fa": "مصطفی سلیمان، مدیر عامل هوش مصنوعی مایکروسافت بلومبرگ/ گتی ایماژ، مصطفی سلیمان، مدیر عامل هوش مصنوعی مایکروسافت، گفت که آزمایشگاه های هوش مصنوعی باید اطمینان حاصل کنند که می توانند آنچه را که ایجاد می کنند کنترل کنند. سلیمان گفت: «ما نباید چیزی ایجاد کنیم که نتوانیم آن را کنترل کنیم. سلیمان این سوال را مطرح کرد که چرا برخی در حوزه فناوری تا این حد با مقررات جدید مخالف هستند. مصطفی سلیمان، مدیر عامل هوش مصنوعی مایکروسافت می‌گوید این «سوررئال» است که باید بگوید هوش مصنوعی باید با بشریت هماهنگ شود. سلیمان جمعه در برنامه \"Squawk Box\" شبکه CNBC گفت: \"ما نباید چیزی بسازیم که نتوانیم آن را کنترل کنیم.\" و اگر به نظر می رسد که ما در مسیری برای تولید چیزی هستیم که نه تنها از مجموع همه ما قدرتمندتر است، بلکه در نتیجه چیزی است که نمی توانیم آن را کنترل کنیم، در این صورت در هدف اساسی خود شکست خواهد خورد. سلیمان گفت: موفقیت به راحتی به دست نمی آید. او گفت: \"کنترل این چیزها واقعاً یک چالش بزرگ برای ما خواهد بود.\" سلیمان گفت که \"خوشحال است که افراد بسیار بیشتری را می بیند\" که از این ایده حمایت می کنند که شرکت های فناوری و سازندگان مدل های مرزی باید کنترل سیستم های هوش مصنوعی خود را حفظ کنند. در صنعت، اطمینان از عملکرد هوش مصنوعی مطابق با نیات انسان، همسویی نامیده می شود. او گفت: «اما گروه در حال رشدی از مردم هستند که فکر می‌کنند ما این کار را به خاطر خودش انجام می‌دهیم، و ما فقط می‌خواهیم کارت بعدی را برگردانیم، ببینیم چه چیزی در اطراف است و چیزی بسازیم که فقط افسار ما را از بین ببرد.» اظهارات سلیمان زمانی بیان می شود که توجه بیشتر به ایمنی هوش مصنوعی، پس از آن که Jacob Coxon، محقق سابق Anthropic،"}, {"source": "Business Insider", "title": "The AI capex boom won't sustain S&P 500 earnings much longer, Goldman says", "link": "https://www.businessinsider.com/ai-capex-goldman-sachs-wall-street-tech-stocks-sp500-earnings-2026-9", "summary": "NYSE Goldman Sachs warns AI spending won't sustain stock-market momentum into 2027. The bank's Ben Snider sees S P 500 earnings slowing as capex wanes. AI-driven inflation and weaker chipmaker margins could challenge market momentum beyond this year. Wall Street has cheered upbeat earnings this year, fueled by strong growth in tech, but the investors shouldn't count on the strong momentum lasting much longer, Goldman Sachs says. Ben Snider, the bank's chief US equity strategist, recently laid out his team's thesis on how AI growth is likely to impact the market in the coming year. Even if capex spending stays strong, he's not convinced it will be enough to sustain this year's positive momentum. \"The AI investment boom has accounted for nearly half of S P 500 earnings growth this year, and this tailwind should begin to fade next year even as capex spending continues to grow,\" Snider wrote in a note to investors on Thursday. Snider told Business Insider in July that investors should double down on popular AI infrastructure stocks, citing a bullish stance on the data center boom. Yet, as he looks beyond 2026, his latest view indicates that AI spending may be masking a more difficult reality for markets. Snider's focus is not on the notion that the AI bubble is likely to burst in the near future. Rather, his base case centers on the likelihood of S P 500 earnings growth slowing down significantly over the next two years, partially because of problems ahead for chipmakers, which have been major beneficiaries of the AI spending by Big Tech firms. \"The recent surge in semiconductor profit margins leaves S P 500 earnings vulnerable to a decline in chip prices,\" Snider stated. \"Our industry analysts expect supply to remain tight through 2027 but for the rate of margin expansion to slow next year.\" Chip stocks have been a significant growth driver for the S P 500 since the AI boom began in late 2022, surging on the combination of extremely high demand and limited supply. Others have said recently that surging chip costs could be problematic for the AI trade. Goldman previously predicted that the US would shoulder the brunt of a global AI-driven inflation surge, noting that AI chip prices were already troublingly high. Now, the possibility of cooling chip margins threatens to compromise the momentum that powered the AI trade in 2026. \" In a scenario where slowing AI infrastructure investment, increasing supply, and/or technological shift lowers semiconductor prices a", "date_str": "2026-09-19T09:30:02+00:00", "hash": "4ccce66f0890a89e", "title_fa": "گلدمن می‌گوید رونق سرمایه هوش مصنوعی سود S&P 500 را برای مدت طولانی‌تری حفظ نخواهد کرد", "summary_fa": "NYSE Goldman Sachs هشدار می دهد که هزینه های هوش مصنوعی در سال 2027 حرکت بازار سهام را حفظ نخواهد کرد. بن اسنایدر این بانک معتقد است که درآمد S P 500 با کاهش سرمایه کاهش می یابد. تورم مبتنی بر هوش مصنوعی و حاشیه های ضعیف تر تولیدکنندگان تراشه می تواند حرکت بازار را فراتر از امسال به چالش بکشد. گلدمن ساکس می‌گوید: وال استریت امسال درآمدهای خوش‌بینی‌ای را به‌دلیل رشد قوی فناوری تقویت کرده است، اما به گفته گلدمن ساکس، سرمایه‌گذاران نباید روی این حرکت قوی حساب کنند. بن اسنایدر، استراتژیست ارشد سهام ایالات متحده این بانک، اخیراً تز تیم خود را در مورد چگونگی تأثیر رشد هوش مصنوعی بر بازار در سال آینده ارائه کرد. حتی اگر مخارج سرمایه قوی باقی بماند، او متقاعد نشده است که برای حفظ حرکت مثبت امسال کافی باشد. اسنایدر روز پنجشنبه در یادداشتی خطاب به سرمایه گذاران نوشت: رونق سرمایه گذاری در هوش مصنوعی تقریباً نیمی از رشد درآمد S P 500 در سال جاری را به خود اختصاص داده است و این باد آخر باید سال آینده شروع به محو شدن کند، حتی با ادامه رشد مخارج کل. اسنایدر در ماه ژوئیه به Business Insider گفت که سرمایه گذاران باید سهام زیرساخت های محبوب هوش مصنوعی را دو برابر کنند و به این دلیل موضع صعودی خود را در مورد رونق مرکز داده ذکر کردند. با این حال، همانطور که او به فراتر از 2026 نگاه می کند، آخرین دیدگاه او نشان می دهد که هزینه های هوش مصنوعی ممکن است واقعیت دشوارتری را برای بازارها پنهان کند. تمرکز اسنایدر بر این تصور نیست که حباب هوش مصنوعی احتمالا در آینده نزدیک می ترکد. در عوض، پرونده اصلی او بر احتمال کاهش قابل توجه رشد درآمد S P 500 در دو سال آینده متمرکز است، تا حدی به دلیل مشکلات"}, {"source": "Business Insider", "title": "Older Americans are sliding into poverty", "link": "https://www.businessinsider.com/older-american-poverty-rises-healthcare-costs-social-security-2026-9", "summary": "The supplemental poverty rate for older Americans has increased. Willowpix/Getty Images After a surge of pandemic-era aid, older Americans have faced rising poverty. Healthcare costs drive older Americans into poverty, straining their savings and finances. Social Security often isn't enough to cover costs, leading older Americans to take on low-paying jobs. After a slew of pandemic-induced aid ran its course, older Americans are falling back into poverty — and even younger would-be retirees are struggling. After the Great Recession, the trendline for older Americans had been improving, and 2020 pandemic relief measures helped buttress the aging population from falling into poverty in the wake of Covid. New census data shows that now, the poverty rate has increased the most for Americans 65 and older, after adjusting for things like tax credits and government programs. The share of all Americans living below that adjusted poverty measure grew from 9.1% in 2020 to 13.1% in 2025. For Americans 65 and older, that rate grew from 9.4% to 15.4%. Millions of older Americans live solely off Social Security benefits , which often don't cover all daily costs , let alone Medicare premiums or caregiving expenses. Social Security kept 28.8 million Americans out of poverty in 2025, the new Census report found, including nearly 21 million Americans 65 and older. As the boomer generation ages into retirement, those benefits look shaky, a worrying sign as lifespans stretch longer. Historically, poverty among older Americans rises with age, although younger retirement-aged Americans started falling into harder times as of 2024. Last year, Business Insider spoke with dozens of Americans 80 and older who were below or slightly above the poverty line, most of whom worked at least part time to make ends meet. Many said the only jobs they could find were minimum wage, menial jobs, paying them enough to put food on the table and heat their homes. Some said they had much more saved earlier in life, but were hit hard by medical treatments. \"We should get tax breaks after a certain age because prices are so high for food,\" said Rebecca Reed, 88, who works two lower-paying jobs in New Orleans. \"And maybe some discounts at the grocery store.\" Rebecca Reed works two part-time jobs at 88. Annie Flanagan for BI While the oldest Americans are still the most impoverished group, their younger counterparts have been seeing poverty rates tick up. The official poverty rate for Americans ages 70", "date_str": "2026-09-19T09:30:01+00:00", "hash": "1c9f0792e75fea48", "title_fa": "آمریکایی‌های مسن‌تر به سمت فقر فرو می‌روند", "summary_fa": "نرخ فقر تکمیلی برای آمریکایی های مسن تر افزایش یافته است. Willowpix/Getty Images پس از افزایش کمک‌های دوران همه‌گیری، آمریکایی‌های مسن‌تر با فقر فزاینده مواجه شده‌اند. هزینه های مراقبت های بهداشتی، آمریکایی های مسن را به فقر می کشاند و پس انداز و مالی آنها را تحت فشار قرار می دهد. تامین اجتماعی اغلب برای پوشش هزینه‌ها کافی نیست و باعث می‌شود که آمریکایی‌های مسن‌تر مشاغل کم‌درآمدی را انتخاب کنند. پس از گذراندن یک سری کمک‌های ناشی از بیماری همه‌گیر، آمریکایی‌های مسن‌تر دوباره در فقر فرو می‌روند - و حتی بازنشستگان بالقوه جوان‌تر نیز با مشکل مواجه هستند. پس از رکود بزرگ، روند روند برای آمریکایی‌های مسن‌تر در حال بهبود بود و اقدامات کمک‌رسانی به بیماری همه‌گیر سال 2020 به جلوگیری از سقوط جمعیت سالخورده به فقر در پی کووید کمک کرد. داده‌های سرشماری جدید نشان می‌دهد که اکنون، پس از تعدیل مواردی مانند اعتبار مالیاتی و برنامه‌های دولتی، نرخ فقر برای آمریکایی‌های 65 سال و بالاتر بیشترین افزایش را داشته است. سهم همه آمریکایی‌هایی که زیر آن معیار فقر تعدیل شده زندگی می‌کنند از 9.1 درصد در سال 2020 به 13.1 درصد در سال 2025 افزایش یافته است. برای آمریکایی‌های 65 سال و بالاتر، این نرخ از 9.4 درصد به 15.4 درصد رسیده است. میلیون‌ها آمریکایی مسن‌تر فقط از مزایای تامین اجتماعی زندگی می‌کنند، که اغلب تمام هزینه‌های روزانه را پوشش نمی‌دهد، چه رسد به حق بیمه مدیکر یا هزینه‌های مراقبت. بر اساس گزارش سرشماری جدید، تامین اجتماعی 28.8 میلیون آمریکایی را در سال 2025 از فقر دور نگه داشت، از جمله نزدیک به 21 میلیون آمریکایی 65 سال و بالاتر. از آنجایی که نسل رونق به دوران بازنشستگی می رسد، این مزایا متزلزل به نظر می رسند، که نشانه ای نگران کننده برای طولانی شدن طول عمر است. از نظر تاریخی، فقر در میان آمریکایی‌های مسن‌تر با افزایش"}, {"source": "Business Insider", "title": "I've spoken to my daughter in a non-native language since she was a baby. Now she corrects my French.", "link": "https://www.businessinsider.com/linguist-raising-child-in-non-native-language-bilingual-parenting-2026-9", "summary": "The author has been speaking French to her daughter since she was a baby, even though it is not her native language. Courtesy of Tara McAllister. I hoped a bilingual upbringing would give my daughter an edge in life. I didn't realize that a non-native language to me would end up becoming our primary language. I've had my share of criticism over this decision, but it's working well for us so far. My daughter was born three months before the COVID-19 restrictions began where we live. Stuck at home with a new baby, I needed something to keep me busy, and I'm too mishap-prone for sourdough. For a linguist like me, a language-related project seemed like just the thing. I decided to dust off my French — which I spoke quite well in high school but hadn't used in decades — so I could speak it at home with my daughter. What parent hasn't heard about the benefits of bilingualism for little brains? Six years later, my project has outstripped all my expectations. We're lucky to have bilingual schools in our neighborhood. Because my daughter hears French from her peers as well as from me, she speaks it just as fluently as the English she uses with my husband and the rest of our family. My own ability to express myself in French grew little by little alongside hers. Today, we rarely speak English when it's just the two of us. Some people think I'm making a mistake My French is far from perfect: I'm never going to get rid of my American accent , and my speech is peppered with small mistakes — like le vidéo when it should be la vidéo . Sharing my family's language journey online, I've gotten criticism that my grammatical slips could harm my daughter's linguistic development. \"If I wasn't fluent enough to not make errors, I would not be speaking that language to my child 100% of the time,\" one poster told me. Others have raised concerns about my emotional connection with my child. \"The optimal language of interaction is the caregiver's heart language (most dominant language),\" a commenter on a bilingual-parenting blog warned. The author said her daughter, now 6, often corrects her pronunciation. Courtesy of Tara McAllister. What the research shows Since I'm a linguist by profession, I did a deep dive into the literature on bilingual development at the start of my project, and what I learned reinforced my decision to focus on French. Many people believe that children are little sponges for language, but that's only half true. Children automatically soak up the language they", "date_str": "2026-09-19T09:27:01+00:00", "hash": "b0f96ebcf7c41bd4", "title_fa": "من از کودکی با دخترم به زبان غیر مادری صحبت می کردم. حالا او فرانسه مرا تصحیح می کند.", "summary_fa": "این نویسنده از کودکی با دخترش به زبان فرانسه صحبت می‌کند، هرچند
