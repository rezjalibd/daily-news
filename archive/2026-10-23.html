      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;

      text-align: center;

      transition: all 0.3s ease;

      left: 18px;
      display: flex;

      align-items: center;

      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;

      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);

      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);

      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;

    .tabs::-webkit-scrollbar {
      display: none;
    }

      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      position: relative;

      border-color: var(--primary);
      transform: translateY(-2px);
    }

      border-color: var(--read-border);

    .news-card.is-read:hover {

      font-size: 0.85rem;

      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;

      color: var(--success);

      font-weight: 700;
      line-height: 1.6;
      flex: 1;

      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;

      justify-content: space-between;

      flex-wrap: wrap;

      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;

      color: #0f172a;

      media: [{"source": "Rolling Stone", "title": "Charli XCX to Cameo in Martin Scorsese’s New Horror Film With Leonardo DiCaprio, Jennifer Lawrence", "link": "https://www.rollingstone.com/music/music-news/charli-xcx-martin-scorsese-horror-film-1235646987/", "summary": "The artist will feature in the gothic film based on Peter Cameron's novel, What Happens at Night", "date_str": "2026-10-22T23:58:03+00:00", "hash": "497234ec356db5e0", "title_fa": "چارلی XCX به کامئو در فیلم ترسناک جدید مارتین اسکورسیزی با لئوناردو دی کاپریو و جنیفر لارنس", "summary_fa": "این هنرمند در فیلم گوتیک بر اساس رمان پیتر کامرون بازی خواهد کرد، آنچه در شب اتفاق می افتد چارلی XCX و جهان های مارتین اسکورسیزی بار دیگر با هم برخورد می کنند، این بار برای یک فیلم ترسناک توسط کارگردان برجسته. بر اساس رمان گوتیک پیتر کامرون، «آنچه در شب اتفاق می‌افتد» یک زوج آمریکایی متاهل را در یک شهر دورافتاده اروپایی قرار می‌دهد. این زوج که امیدوارند یک نوزاد را به فرزندخواندگی بپذیرند، در حالی که با فرزندخواندگی و طبیعتاً ناراحتی خودشان دست و پنجه نرم می کنند، با گروهی از مهمانان عجیب و غریب هتل مواجه می شوند. به گزارش ورایتی، منابع می گویند که چارلی در فیلمی با کلاه اسکورسیزی با بازیگران سنگین باکس آفیس لئوناردو دی کاپریو و جنیفر لارنس نقش آفرینی خواهد کرد. در حالی که اطلاعات زیادی در مورد این فیلم در دست نیست، رسانه اعلام کرد که بازیگران آن شامل مدز میکلسن، پاتریشیا کلارکسون و جرد هریس نیز هستند. نمایندگان چارلی، اسکورسیزی، اپل و StudioCanal بلافاصله به درخواست‌های رولینگ استون برای اظهار نظر پاسخ ندادند. چارلی قبلا با اسکورسیزی برای جلد آلبوم موسیقی، مد، فیلم او که در ماه جولای منتشر شد، کار کرده بود. تصویر سیاه و سفید دارای سه نماد از هر دسته است که در آشپزخانه کنار هم نشسته اند: جان کیل برای موسیقی، مارک جیکوبز برای مد و مارتین اسکورسیزی برای فیلم. کیل در مصاحبه ای اختصاصی به رولینگ استون گفت که او ایده ای برای اداره کردن من دارد. \"درباره یک ویدئو صحبت شد، قصیده ای از اثر زمان و مکان. مورد بعدی، من در یک پرواز بودم. به یک آشپزخانه تصادفی رسیدم.\" داستان‌های پرطرفدار جولیا استایلز با اجرای «رقصیدن با ستار     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
