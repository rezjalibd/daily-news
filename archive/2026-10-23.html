e moment. It's been a nightmarish week for cybersecurity. AI helped discover two \"critical\" flaws in the infrastructure of PHP , a programming language that up to 70% of websites use, prompting companies to race to roll out a fix or risk being hacked. The incident has illustrated how AI is creating a new level of risk for businesses and consumers online, in a week when multiple other cyber threats caused headaches for security workers. Here's what executives and analysts are saying about the biggest cyber threat of the moment — and how AI could make things even worse. Jason Clinton, Anthropic s deputy chief information security officer Anthropic's deputy security chief, Jason Clinton, warns that a \"vulnerability tsunami\" is coming — and says critical infrastructure hasn't caught up. Clinton posted on X on Wednesday about the need to \"patch critical infrastructure\" before core network vulnerabilities get exploited. On Thursday, he issued another warning to companies. \"As bad as things have gotten in the past 4 days, they are going to get a lot worse before they get better,\" he wrote. \"Security leaders, never let a crisis go to waste: please go to your boards and ask for help right now. not for ai, for the basics. (we need to hold on for ~18 months.),\" he added. Andrew Curran, AI analyst Andrew Curran, a prominent AI analyst, weighed in on several cybersecurity threats from Wednesday to Thursday. \"Regarding potential attacks on energy, food, and water infrastructure, the threat is quite real. Someone is currently probing infra and feeling it out, it is an active threat. Even a little preparation can be helpful, just in case,\" Curran wrote on Wednesday in response to an NSA cybersecurity advisory about threat actors. On Thursday, Curran also highlighted a hack of Quest Diagnostics, which he said serves \"roughly half\" of the US's hospitals and physicians. Matt Shumer, AI investor In February, Matt Shumer, the former CEO of Hyperwrite, published a viral essay on his website titled \"Something Big Is Happening,\" in which he warned of large-scale disru", "date_str": "2026-10-23T10:29:53+00:00", "hash": "d7190d141af9757d", "title_fa": "آنچه افراد باهوش در مورد ایجاد یک سونامی آسیب‌پذیری آنلاین توسط هوش مصنوعی می‌گویند", "summary_fa": "اخیراً نقص های امنیت سایبری در زبان برنامه نویسی محبوب PHP شناسایی شده است. آنت ریدل/تصویر اتحاد از طریق Getty Images مدیران و تحلیلگران پس از کشف نقصی که بیشتر اینترنت را تحت تاثیر قرار داده است، زنگ خطر را به صدا در می آورند. کارشناسان می گویند سیستم های حیاتی، از انرژی و آب گرفته تا مراقبت های بهداشتی، ممکن است به ویژه در معرض خطر قرار گیرند. در اینجا چیزی است که افراد باهوش در مورد بزرگترین تهدیدات اینترنت در حال حاضر می گویند. این یک هفته کابوس‌آمیز برای امنیت سایبری بود. هوش مصنوعی به کشف دو نقص \"بسیار مهم\" در زیرساخت PHP کمک کرد، زبان برنامه نویسی که تا 70 درصد وب سایت ها از آن استفاده می کنند، و شرکت ها را به رقابت برای راه اندازی یک اصلاح یا خطر هک شدن تشویق کرد. این حادثه نشان داده است که چگونه هوش مصنوعی در هفته ای که چندین تهدید سایبری باعث ایجاد دردسر برای کارکنان امنیتی شد، سطح جدیدی از خطر را برای مشاغل و مصرف کنندگان آنلاین ایجاد می کند. در اینجا آنچه مدیران و تحلیلگران درباره بزرگترین تهدید سایبری در حال حاضر می گویند - و اینکه چگونه هوش مصنوعی می تواند اوضاع را بدتر کند، آمده است. جیسون کلینتون، معاون رئیس امنیت اطلاعات آنتروپیک، جیسون کلینتون، معاون رئیس امنیت آنتروپیک، هشدار می دهد که یک \"سونامی آسیب پذیری\" در راه است - و می گوید که زیرساخت های حیاتی فراگیر نشده است. کلینتون روز چهارشنبه در X در مورد نیاز به \"وصله کردن زیرساخت های حیاتی\" قبل از سوء استفاده از آسیب پذیری های اصلی شبکه پستی منتشر کرد. او روز پنجشنبه هشدار دیگری به شرکت ها داد. او نوشت: «هرچقدر اوضاع در 4 روز گذشته بدتر شده باشد، قبل از اینکه بهتر شوند، خیلی بدتر خواهند شد. او افزود: \"رهبران امنیتی،", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "امنیت سایبری"], "datetime_fa": "۱ آبان • ۱۳:۵۹"}, {"source": "Business Insider", "title": "The latest sign we're eating out less: Restaurants are buying fewer disposable cups and paper towels", "link": "https://www.businessinsider.com/us-restaurants-purchase-fewer-disposable-cups-amid-decline-2026-10", "summary": "Restaurants are buying fewer disposable cups, paper towels, and packaging supplies, companies that make the goods have said. Lia Toby/Getty Images for illycaffè Restaurants are buying fewer paper cups and takeout containers. Companies making the goods say their North American sales declined in results released this year. It's the latest sign that diners are eating out less. Even the humble disposable coffee cup suggests that diners are eating out less at restaurants . Companies that sell paper cups, plates, delivery containers, and similar packaging to restaurants say that they're seeing less demand from US businesses. Essity, a Swedish company that sells paper towels and cleaning supplies to businesses, including restaurants, said on Thursday that the dining pullback in the US was affecting sales. The company's sales volumes and prices in the US fell during its third quarter, it said. \"Consumers are not going out to restaurants as much as they do in Europe,\" CEO Ulrika Kolsrud told Reuters on Thursday. Finland-based Huhtamaki Oyj, which makes disposable cups and takeout containers for fast-food restaurants, said that second-quarter sales in North America decreased. Analysts at Jefferies wrote that results in the region, which accounts for about one-third of Huhtamaki Oyj's sales, will likely be hurt by lower consumer spending at fast-food chains in the US. Higher prices at some chains, and many consumers still working from home, \"have impacted sales volumes, and ultimately packaging demand,\" the analysts wrote earlier this month. With wages stagnant and the lingering effects of inflation, many diners are eating out less . Those who are still spending tend to look for good deals — a trend that has tested value menus at fast-food chains like McDonald's and benefited others, such as Chili's, which offered deals that got consumers ordering. That doesn't necessarily mean Americans have stopped spending on restaurant food altogether. Many diners are still willing to pay for food delivery , a trend that has bolstered results at DoorDash and Uber. Do you have a story idea? Contact this reporter at abitter@businessinsider.com or via encrypted messaging app Signal at 808-854-4501. Use a personal email address, a nonwork WiFi network, and a nonwork device; here ' s our guide to sharing information securely. Read the original article on Business Insider", "date_str": "2026-10-23T10:00:03+00:00", "hash": "30e0cb744e457ca7", "title_fa": "آخرین نشانه ما کمتر غذا می خوریم: رستوران ها فنجان و حوله کاغذی یکبار مصرف کمتری می خرند.", "summary_fa": "شرکت‌هایی که این کالاها را تولید می‌کنند گفته‌اند که رستوران‌ها لیوان یکبار مصرف، حوله کاغذی و لوازم بسته‌بندی کمتری می‌خرند. Lia Toby/Getty Images برای illycaffè رستوران‌ها لیوان‌های کاغذی و ظروف غذاخوری کمتری می‌خرند. شرکت های سازنده این کالاها می گویند که فروش آنها در آمریکای شمالی در نتایج منتشر شده در سال جاری کاهش یافته است. این آخرین نشانه این است که افراد ناهارخوری کمتر بیرون غذا می خورند. حتی یک فنجان قهوه یکبار مصرف ساده نشان می دهد که افراد ناهار خوری کمتر در رستوران غذا می خورند. شرکت‌هایی که لیوان‌های کاغذی، بشقاب‌ها، ظروف تحویل، و بسته‌بندی‌های مشابه را به رستوران‌ها می‌فروشند، می‌گویند که تقاضای کمتری از سوی کسب‌وکارهای آمریکایی دارند. Essity، یک شرکت سوئدی که حوله‌های کاغذی و لوازم نظافتی را به مشاغل از جمله رستوران‌ها می‌فروشد، روز پنج‌شنبه گفت که عقب‌نشینی غذاخوری در ایالات متحده بر فروش تأثیر می‌گذارد. حجم فروش و قیمت این شرکت در ایالات متحده در سه ماهه سوم کاهش یافت. اولریکا کولسرود، مدیرعامل این شرکت روز پنجشنبه به رویترز گفت: «مصرف‌کنندگان به اندازه اروپا به رستوران‌ها نمی‌روند». Huhtamaki Oyj مستقر در فنلاند، که فنجان های یکبار مصرف و ظروف بیرون بری برای رستوران های فست فود تولید می کند، گفت که فروش سه ماهه دوم در آمریکای شمالی کاهش یافته است. تحلیلگران Jefferies نوشتند که نتایج در این منطقه که حدود یک سوم فروش Huhtamaki Oyj را به خود اختصاص می دهد، احتمالاً به دلیل کاهش هزینه مصرف کنندگان در زنجیره های فست فود در ایالات متحده آسیب خواهد دید. تحلیلگران در اوایل این ماه نوشتند که قیمت‌های بالاتر در برخی از زنجیره‌ها و بسیاری از مصرف‌کنندگان همچنان در خانه کار می‌کنند، \"بر حجم فروش و در نهایت تقاضای بسته‌بندی تاثیر گذاشته است.\" با رکود دستمزدها و اثرات ماندگار تورم، بسیاری از ناهار خوری ها کمتر بیرون غذا می خورند. کسانی که هنوز", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۳:۳۰"}, {"source": "Business Insider", "title": "Fox's Red Seat Ventures is taking aim at Substack with a new offering for creators", "link": "https://www.businessinsider.com/red-seat-ventures-chris-balfe-aims-substack-for-audio-creators-2026-10", "summary": "Chris Balfe of Red Seat Ventures (right) is looking for more top creators like Megyn Kelly (left). Marcus Ingram/Getty Images, Red Seat Ventures Fox-owned Red Seat Ventures is going after Substack's turf with a new newsletter option. CEO Chris Balfe said the company has had an early success with Tony Hinchcliffe's paid offering. The home of Tucker Carlson and Nancy Grace is also on the hunt for more big creators. Fox's Red Seat Ventures is coming for Substack. Led by Chris Balfe, Red Seat made its name running sales and production services for podcasters including Tucker Carlson, Megyn Kelly, and Nancy Grace. Now, as the lines between creators, podcasters, and writers continue to blur, it's adding newsletter functionality to its stack. The newsletter feature will live under Supercast, a company Red Seat bought this year that offers a menu of subscription options like livestreaming for creators. They can now build free and paid newsletters and track their performance on a dashboard. The newsletter feature is included in Supercast's base pricing of $0.59 per subscriber per month, with custom pricing available for big networks and media companies. \"We want to be a one-stop shop for creators,\" Balfe told Business Insider. \"Whereas Substack has done a really good job going after written-first creators, and then adding podcasting capability on top of that, we're going at it from the other direction and saying, for most of the creators that we work with, their audio and video is their main business. So, let's add other features like email and livestreaming.\" Balfe pointed to comedian Tony Hinchcliffe of \"Kill Tony\" as an early example of Red Seat's success in using a multifaceted approach. Since launching a subscription, Kill Tony+, Hinchcliffe has signed up thousands of people who get his uncensored, ad-free show and bonus content. Hinchcliffe plans to create another, super-expensive tier where people would pay to get roasted by him, Balfe said. \"It would be like $10,000 or something like that to roast you,\" Balfe said. \"We will sell out of these so bad.\" He also pointed to an early pilot of Supercast's livestreaming with \"This American Life,\" which drew more than 1,700 paying audience members. Under Red Seat, Tony Hinchcliffe is getting thousands of paying subscribers. Matt Winkelmeyer/Getty Images for Netflix Red Seat is aiming for 10 big deals Balfe wants to make Red Seat a creator-economy juggernaut, with some 200 shows. The company has around 30 shows now a", "date_str": "2026-10-23T10:00:02+00:00", "hash": "2a47bfbb73b7a1f7", "title_fa": "Fox's Red Seat Ventures با پیشنهاد جدیدی برای سازندگان، Substack را هدف قرار داده است", "summary_fa": "کریس بالف از Red Seat Ventures (راست) به دنبال سازندگان برتر بیشتری مانند Megyn Kelly (سمت چپ) است. Marcus Ingram/Getty Images، Red Seat Ventures که متعلق به فاکس است Red Seat Ventures با یک گزینه خبرنامه جدید به دنبال چمن Substack است. مدیرعامل کریس بالف گفت که این شرکت با پیشنهاد پولی تونی هینچکلیف موفقیت اولیه ای داشته است. خانه تاکر کارلسون و نانسی گریس نیز در جستجوی سازندگان بزرگ بیشتری است. Fox's Red Seat Ventures برای Substack می آید. به رهبری کریس بالف، Red Seat نام خود را با ارائه خدمات فروش و تولید برای پادکست‌هایی از جمله تاکر کارلسون، مگین کلی و نانسی گریس به دست آورد. اکنون، همانطور که خطوط بین سازندگان، پادکست‌ها و نویسندگان همچنان محو می‌شوند، این خبرنامه در حال اضافه کردن قابلیت‌های خبرنامه به پشته خود است. ویژگی خبرنامه تحت Supercast، شرکتی که Red Seat امسال خریداری کرد و منویی از گزینه‌های اشتراک مانند پخش زنده را برای سازندگان ارائه می‌دهد، فعال خواهد شد. آنها اکنون می توانند خبرنامه های رایگان و پولی بسازند و عملکرد خود را در داشبورد پیگیری کنند. ویژگی خبرنامه در قیمت پایه Supercast 0.59 دلار برای هر مشترک در ماه گنجانده شده است، با قیمت گذاری سفارشی برای شبکه های بزرگ و شرکت های رسانه ای. بالف به Business Insider گفت: «ما می‌خواهیم فروشگاهی یک‌جا برای سازندگان باشیم. \"در حالی که Substack کار بسیار خوبی را انجام داده است که ابتدا سازندگان نوشته شده را دنبال می کند، و سپس قابلیت پادکست را اضافه می کند، ما از جهت دیگری به آن می پردازیم و می گوییم، برای اکثر سازندگانی که با آنها کار می کنیم، صدا و تصویر آنها کار اصلی آنهاست. بنابراین، اجازه دهید ویژگی های دیگری مانند ایمیل و پخش زنده را اضافه کنیم.\" بالف به تونی هینچکلیف کمدین «تونی را بکش» به عنوان نمونه اولیه", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۱ آبان • ۱۳:۳۰"}, {"source": "Business Insider", "title": "Sebastian Stan says playing Trump made him realize Hollywood is 'hypocritical'", "link": "https://www.businessinsider.com/sebastian-stan-movie-roles-trump-bucky-barnes-marvel-fjord-2026-10", "summary": "Sebastian Stan s latest role is in Fjord. The Apprentice/Braircliff Entertainment; Dominique Charriau/Getty Images; Bucky Barnes/Marvel Studios; BI Sebastian Stan isn't afraid to make people uncomfortable. The 44-year-old actor, who earned an Oscar nomination for playing a young Donald Trump in \"The Apprentice,\" watched in 2024 as his movie encountered roadblock after roadblock — a cease-and-desist letter from Trump , struggles landing a distributor, and hesitance from other actors to discuss the film with him in press— in its journey to screen. But the headache hasn't deterred him from taking risks on projects that challenge the audience. \"It's not even about Trump anymore. We should be able to explore anything and everything that is uncomfortable,\" Stan told Business Insider. \"We can't become so sensitive to the point where we're actually depriving ourselves of elevated thought about anyone or any matter. Certainly not in the hands of fear.\" Stan's latest film, \"Fjord,\" delivers on that promise, telling a subversive, provocative story about a conservative Romanian-Norwegian couple whose parenting methods are called into question after they move to a progressive Norwegian town. Business Insider's \" Role Play \" series features interviews where acting legends revisit their most memorable roles. See more here . For Stan, the film wasn't just an opportunity to play nuanced, thought-provoking material. As a Romanian-American who fled the country as a boy in the late 1980s, working with Romanian filmmaker Cristian Mungiu (\"4 Months, 3 Weeks and 2 Days\") was also a long-awaited homecoming. Sebastian Stan plays a Romanian who moves to Norway in Fjord. Neon Stan immersed himself fully in the role, sporting a shaved head with a massive bald spot and speaking most of his lines in Romanian. He and Renate Reinsve, who plays his wife, were so locked in during production that they would go out to dinner together, still dressed in the clothes they shot their scenes in that day. Stan said the experience brought him closer to his homeland. \"A lot of people go, 'Great, you want to come back to Romania, and you want to do movies, but you didn't grow up here, you don't know what our experience is. You were lucky you got away,' so I was a little apprehensive,\" Stan told Business Insider about working with Mungiu's Romanian-heavy crew. \"But, honestly, on the last day of this movie, they wrapped the Romanian flag around me, and they were so proud to kind of take me back in a way", "date_str": "2026-10-23T10:00:01+00:00", "hash": "62df28e457eb2e23", "title_fa": "سباستین استن می گوید بازی در نقش ترامپ باعث شد متوجه شود که هالیوود \"ریاکارانه\" است", "summary_fa": "آخرین نقش سباستین استن در فیلم Fjord است. The Apprentice/Braircliff Entertainment; دومینیک شاریو/گتی ایماژ; باکی بارنز/مارول استودیو; BI Sebastian Stan از ایجاد ناراحتی در افراد نمی ترسد. این بازیگر 44 ساله که برای بازی در نقش دونالد ترامپ جوان در «کارآموز» نامزدی اسکار را به دست آورد، در سال 2024 تماشا کرد که فیلمش با موانعی روبرو می‌شود - نامه توقف و توقف از سوی ترامپ، تلاش برای دریافت توزیع‌کننده، و تردید بازیگران دیگر برای بحث درباره سفر فیلم با او برای نمایش در مطبوعات. اما سردرد او را از ریسک کردن در پروژه هایی که مخاطب را به چالش می کشد منصرف نکرده است. «این دیگر حتی درباره ترامپ هم نیست. استن به Business Insider گفت: ما باید بتوانیم هر چیزی و هر چیزی که ناراحت کننده است را کشف کنیم. مطمئناً در دست ترس نیست.\" آخرین فیلم استن، \"آبدره\" به این وعده عمل می کند و داستانی مخرب و تحریک آمیز درباره یک زوج محافظه کار رومانیایی-نروژی روایت می کند که روش های فرزندپروری آنها پس از نقل مکان به یک شهر مترقی نروژی زیر سوال می رود. مجموعه \"بازی نقش\" از Business Insider دارای مصاحبه هایی است. فقط فرصتی برای پخش مطالب ظریف و تامل برانگیز نبود. به عنوان یک رومانیایی-آمریکایی که در اواخر دهه 1980 در کودکی از کشور گریخت، همکاری با فیلمساز رومانیایی کریستین مونگیو (\"4 ماه، 3 هفته و 2 روز\") نیز مورد انتظار بازگشت به خانه بود. سباستین استن نقش یک رومانیایی را بازی می کند که در آبدره به نروژ نقل مکان می کند. نئون استن به طور کامل در نقش غوطه ور شد، سر تراشیده شده با یک نقطه طاس بزرگ را به همراه داشت و بیشتر خطوط خود را به زبان رومانیایی می گفت.", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۱۳:۳۰"}, {"source": "Business Insider", "title": "I'm a CTO who was awake for 48 hours because of the PHP crisis. October feels like the month of hell for tech.", "link": "https://www.businessinsider.com/php-vulnerability-cto-stress-cybersecurity-fix-2026-10", "summary": "Nick Woodhead had to scramble in response to a security flaw that threatened the majority of the world s websites. Courtesy of Nick Woodhead Nick Woodhead said he went 48 hours without sleep while helping patch a major website vulnerability. The CTO said that with security problems piling up, October feels like \"the month of hell\" for tech. Because AI makes it easier to find and exploit security gaps, Woodhead expects more disruption. This is an as-told-to essay based on a conversation with Nick Woodhead, founder of the AI company GPTree and chief technology officer at Rothco and Compubox. He spoke with Business Insider on Thursday to share how he's responded to vulnerabilities in the PHP programming language that could affect the majority of the world's websites. The following has been edited for brevity and clarity. It's always a nightmare when these things happen. Since Tuesday evening, I haven't slept. It's coming close to 48 hours working on this. I'm a CTO, but I also run an agency for multiple clients and have my own company with my own product. So, balancing my time to get everything updated — it's just been exhausting. About 70% of the internet runs on a programming language called PHP. I'm actively involved within the PHP community itself, so I did get a warning on Tuesday evening regarding the vulnerability and the fact that it was already being addressed by the PHP team. That gave me a head start. I have some teams offshore, so I was able to jump on that with them. It's not just applying the patches. It's making sure that nothing was already exposed. We already had infrastructure in place to easily deploy patches, but it still requires a good amount of manual involvement. I knew that as soon as I walked into the office on Wednesday, I'd have to have my teams jump on this. They were already waiting for the patches to be released. People are willing to help One of the biggest headaches, especially on the client side, is that we have a lot of legacy systems, which are running on older versions of PHP that are no longer supported, and official patches are not going to be produced. For those, we ultimately had to come up with other plans. For example, taking sites temporarily offline or moving them behind VPNs. Eventually, because it's an open-source community, those patches have already been backported, or implemented, by the community. So now we're shuffling back to some of those older systems to get them patched. That's one of the nice things abo", "date_str": "2026-10-23T09:55:01+00:00", "hash": "e4104cc9a42f38fc", "title_fa": "من یک CTO هستم که به دلیل بحران PHP 48 ساعت بیدار بودم. اکتبر برای فناوری مانند ماه جهنمی است.", "summary_fa": "نیک وودهد مجبور شد در پاسخ به یک نقص امنیتی که اکثر وب‌سایت‌های جهان را تهدید می‌کرد دست به تقلا بزند. نیک وودهد گفت که 48 ساعت بدون خواب بوده و در عین حال به رفع آسیب پذیری وب سایت کمک کرده است. CTO گفت که با انباشته شدن مشکلات امنیتی، اکتبر برای فناوری \"ماه جهنم\" به نظر می رسد. از آنجایی که هوش مصنوعی یافتن و بهره برداری از شکاف های امنیتی را آسان تر می کند، وودهد انتظار اختلال بیشتری را دارد. این یک مقاله گفته شده بر اساس گفتگو با نیک وودهد، بنیانگذار شرکت هوش مصنوعی GPTree و مدیر ارشد فناوری در Rothco و Compubox است. او روز پنجشنبه با Business Insider صحبت کرد تا نحوه واکنش خود را به آسیب‌پذیری‌های زبان برنامه‌نویسی PHP که می‌تواند بر اکثر وب‌سایت‌های جهان تأثیر بگذارد، به اشتراک بگذارد. موارد زیر برای اختصار و وضوح ویرایش شده است. وقتی این اتفاقات می افتد همیشه یک کابوس است. از غروب سه شنبه تا حالا نخوابیدم. نزدیک به 48 ساعت کار روی این کار است. من یک مدیر ارشد فناوری هستم، اما همچنین یک آژانس برای چندین مشتری راه اندازی می کنم و شرکت خود را با محصول خود دارم. بنابراین، متعادل کردن زمانم برای به روز رسانی همه چیز - خسته کننده است. حدود 70 درصد اینترنت با زبان برنامه نویسی به نام PHP اجرا می شود. من به طور فعال در خود جامعه PHP درگیر هستم، بنابراین در عصر سه شنبه اخطاری در مورد آسیب پذیری و این واقعیت که قبلاً توسط تیم PHP مورد بررسی قرار گرفته بود دریافت کردم. این به من یک شروع عالی داد. من چند تیم در خارج از کشور دارم، بنابراین توانستم با آنها به آن بپردازم. این فقط اعمال وصله ها نیست. این اطمینان حاصل می کند که هیچ چیز قبلاً افشا نشده است.", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۱ آبان • ۱۳:۲۵"}, {"source": "Business Insider", "title": "The market's favorite AI giants are stuck in a vicious catch-22", "link": "https://www.businessinsider.com/meta-tesla-ai-spending-capex-catch-22-investors-earnings-big-tech-2026-10", "summary": "Arda Kucukkaya/Anadolu via Getty Images Meta spent more on AI. Tesla spent less. Investors gave both the same chilly response. Now Alphabet, Amazon, and Microsoft are on deck to face AI spending's difficult balancing act. Sign up for First Trade , Business Insider's daily markets newsletter. When it comes to the AI trade, capex is king. Companies — whether component-makers , hyperscalers , or data-center providers — need money to pour into their ambitions. Lots of it. And they need easy access to more. That's made spending a major flash point for the entire market. But it's becoming increasingly unclear what the market expects from companies. No matter what they do, it seems to disappoint ever-pickier investors. Two titans that reported earlier this week — Meta and Tesla — found that out in real time, albeit by taking very different routes. Meta took the more-capex path , raising the low end of its 2026 spending forecast to $135 billion from $130 billion. Its future spending commitments also climbed to $825 billion, including leases, computing deals, and energy agreements needed to power its growing AI ambitions . Apparently, that was too aggressive. Investors worried the forecast could add to market-wide financing stress. Shares tumbled 7%. The cost to insure Meta's debt spiked. (More on that lower.) Tesla , meanwhile, took the less-capex route. The firm will spend \"only\" $20 billion this year, down from its previous $25 billion forecast. And guess what? Investors didn't like that either. The cut raised new questions about whether Tesla is building out its AI ambitions quickly enough. Shares fell 3%. It amounted to the ultimate damned-if-you-do, damned-if-you-don't situation. It's as if investors have an undefined sweet spot for spending — one that threads the needle between overzealousness and slowing growth. Except they haven't shared it with anyone, if they even know what it is. A grim setup for hyperscaler earnings The capex catch-22 playing out doesn't exactly inspire confidence in how investors will digest earnings next week from the dominant hyperscaler trio of Alphabet , Amazon , and Microsoft . Like Meta, they're among the heaviest-weighted stocks in major indexes, and any disappointment could have market-wide consequences. The reaction will likely boil down to a few key elements. If these companies disappoint in any area, beware a fresh wave of selling. Here's a handy four-part checklist: Is the company investing enough to win on AI? Can it show", "date_str": "2026-10-23T09:50:01+00:00", "hash": "8bc76669def284ea", "title_fa": "غول‌های هوش مصنوعی مورد علاقه بازار در یک گیر بد 22 گیر کرده‌اند", "summary_fa": "Arda Kucukkaya/Anadolu از طریق Getty Images متا بیشتر روی هوش مصنوعی خرج کرد. تسلا کمتر خرج کرد. سرمایه گذاران به هر دو یک پاسخ سرد دادند. اکنون آلفابت، آمازون و مایکروسافت برای مقابله با تعادل سخت هزینه‌های هوش مصنوعی آماده‌اند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. وقتی نوبت به تجارت هوش مصنوعی می رسد، capex پادشاه است. شرکت‌ها – اعم از سازنده‌های مولفه، مقیاس‌کننده‌های فوق‌العاده یا ارائه‌دهندگان مرکز داده – برای سرمایه‌گذاری در بلندپروازی‌های خود به پول نیاز دارند. مقدار زیادی از آن. و نیاز به دسترسی آسان به موارد بیشتری دارند. این باعث شده است که هزینه کردن به نقطه اشتعال بزرگی برای کل بازار تبدیل شود. اما به طور فزاینده ای مشخص نیست که بازار از شرکت ها چه انتظاری دارد. مهم نیست که آنها چه کاری انجام می دهند، به نظر می رسد که سرمایه گذاران همیشه انتخاب کننده را ناامید می کند. دو تایتان که در اوایل این هفته گزارش دادند - متا و تسلا - این را در زمان واقعی دریافتند، البته با انتخاب مسیرهای بسیار متفاوت. متا مسیر سرمایه‌گذاری بیشتر را در پیش گرفت و پیش‌بینی هزینه‌های سال 2026 خود را از 130 میلیارد دلار به 135 میلیارد دلار رساند. تعهدات مخارج آتی آن نیز به 825 میلیارد دلار، از جمله اجاره نامه، معاملات محاسباتی، و موافقت نامه های انرژی مورد نیاز برای تقویت جاه طلبی های رو به رشد هوش مصنوعی افزایش یافت. ظاهراً خیلی تهاجمی بود. سرمایه گذاران نگران هستند که این پیش بینی ممکن است بر استرس تامین مالی در بازار بیافزاید. سهام 7 درصد سقوط کرد. هزینه بیمه بدهی متا افزایش یافت. (بیشتر در مورد پایین تر.) تسلا، در همین حال، مسیری با حجم کمتر را در پیش گرفت. این شرکت امسال «فقط» 20 میلیارد دلار هزینه خواهد کرد که کمتر از پیش‌بینی 25 میلیارد", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "Microsoft", "سرمایه‌گذاری"], "datetime_fa": "۱ آبان • ۱۳:۲۰"}, {"source": "Business Insider", "title": "My teen is obsessed with Sephora. I've learned to love it, too, for a reason that has nothing to do with makeup.", "link": "https://www.businessinsider.com/mom-bonding-teen-daughter-embracing-skincare-makeup-sephora-ulta-2026-10", "summary": "The author (right) said that leaning into her daughter s love for Sephora visits has helped them remain close. Courtesy of Courtney Johnson. Makeup and beauty routines have never been very important to me. My daughter is obsessed with self-care and knows a lot more about products than I do. I'm always happy to indulge her interests in this area; it gives us a nice way to connect. \"Can we go to Sephora ?\" my daughter asks, with her rather flawless teen reflection in the mirror standing on a blush-stained rug. Excited that she asked me into her room, I think, \"Sephora again?\" With no room for more makeup around her cluttered sink, I question the need for any more beauty products. At the same time, my daughter is asking to spend time with me. \"Pick up the towel off the floor and pull up your Oliva {Rodrigo} playlist,\" I say, smiling as I walk out the door. \"We are leaving in five.\" I learned to embrace the suck As the true definition of a tomboy , now in my early 50s, my makeup knowledge ends with applying lipstick and mascara — without smudging. Walking through the aisles of makeup and skincare products, I read the labels, dumbfounded. What even is skin milk? Would I apply that before or after serum? The author admits she doesn t know much about makeup and self-care products, but says her daughter speaks about them with confidence and authority. Courtesy of Courtney Johnson. Just as I tell my daughter the coined elementary school phrase, \"The power of yet, you can't do it yet,\" when she struggles with things, I have learned to accept that I don't feel confident applying makeup or following my skincare routine yet. Not long ago, she flipped those words back on me, the ones I so often tell her, as I struggled to apply eyeshadow while we got ready for a concert together: \"Accept that struggle is part of the learning process.\" If embracing the suck means more quality time with my daughter, please sign me up over and over again. I let her lead Life lessons , especially in the tween and teen years, come fast and often. Relating to teen interests and experiences is also harder than it used to be in this modern, technology-driven world. My daughter's obsession with self-care has given her a chance to teach me a thing or two about what matters to her. She's created a space for us to share experiences on a platform she understands and values. On a recent trip, I fumbled through the 20 or so shades of skin tint with SPF. Putting up my I-give-up hands, I watched my daug", "date_str": "2026-10-23T09:37:01+00:00", "hash": "d58828a80e8d5130", "title_fa": "نوجوان من به Sephora وسواس دارد. من هم به دلیلی که ربطی به آرایش ندارد، یاد گرفته ام که دوستش داشته باشم.", "summary_fa": "نویسنده (راست) گفت که تکیه بر عشق دخترش به دیدارهای سفورا به آنها کمک کرده است تا نزدیک باشند. با حسن نیت از کورتنی جانسون. آرایش و روتین های زیبایی هرگز ب ۳:۰۳"}, {"source": "Business Insider", "title": "She used Facebook Marketplace to sell seafood in South Carolina. A viral review led to 300 orders overnight.", "link": "https://www.businessinsider.com/catering-company-used-facebook-marketplace-small-business-growth-2026-10", "summary": "Natendrea Jones has been cooking seafood for more than a decade. In 2026, a viral food review brought her more than 300 orders overnight. Natendrea Jones Natendrea Jones used Facebook Marketplace to market her seafood-catering business. A viral TikTok review in May brought her more than 300 orders overnight. Jones now runs Red's Garlic Seafood from her home kitchen and hopes to expand into a food truck. When TikTok food reviewer Gabriel Rivera DMed Natendrea Jones about her seafood this spring, she assumed it was a prank. \"I thought somebody was playing a joke,\" Jones, 36, told Business Insider. The South Carolina native had spent years trying to turn her cooking into a full-time business. She grew up surrounded by home cooking and began earning money young, first by preparing salads for neighbors and family cookouts, then by doing hair and nails. Cooking remained a side hustle for more than a decade. Jones made seafood platters for friends and occasionally sold pans, but hair and nails paid the bills. A viral food review brought 300 orders overnight Jones had been posting her food on Facebook Marketplace for years. The platform didn't strike her as unusual: As a hairstylist and nail technician, she'd previously used Craigslist to find clients. \"I would always post on Facebook Marketplace because that was like my Craigslist,\" she said. \"I was a Craigslist girl.\" Meanwhile, Rivera had built a following of more than 2 million on TikTok by ordering food through Facebook Marketplace and reviewing it from his car. When he found Jones' listing, he offered her $200 to make him anything she wanted. Jones prepared a pan overflowing with snow crab legs, lobster, shrimp, oysters, and fixings. It was not yet a menu item, she said, but it would soon become known as the \"Gabriel Special.\" When Rivera posted his glowing review in May — \"her seasoning is on another level,\" he said between bites — Jones woke up to a flood of orders. \"I checked my Square. I had literally over 300 orders,\" she said. \"I dropped my phone. I dropped to my knees.\" Jones said she generated $50,000 in sales over the following two weeks and later surpassed six figures in sales. She used some of the money to buy supplies, such as new pots and pans. Going viral created new problems The sudden growth was exciting, but it was also difficult to manage. Jones enlisted help from family members early on, refunded some orders, and said some customers waited as long as a month for their food. \"There's no way", "date_str": "2026-10-23T09:20:01+00:00", "hash": "bd99628a920395e8", "title_fa": "او از Facebook Marketplace برای فروش غذاهای دریایی در کارولینای جنوبی استفاده کرد. یک بررسی ویروسی منجر به 300 سفارش یک شبه شد.", "summary_fa": "Natendrea Jones بیش از یک دهه است که غذاهای دریایی می پزد. در سال 2026، یک بررسی ویروسی غذا برای او بیش از 300 سفارش یک شبه به ارمغان آورد. Natendrea Jones Natendrea Jones از Facebook Marketplace برای بازاریابی کسب و کار غذای دریایی خود استفاده کرد. بررسی ویروسی TikTok در ماه مه بیش از 300 سفارش را برای او به ارمغان آورد. جونز اکنون غذاهای دریایی Red's Garlic را از آشپزخانه خانه خود اداره می کند و امیدوار است که به یک کامیون مواد غذایی تبدیل شود. وقتی در بهار امسال، منتقد غذای TikTok، گابریل ریورا، ناتندریا جونز را در مورد غذاهای دریایی‌اش DM داد، تصور کرد که این یک شوخی است. جونز، 36 ساله، به Business Insider گفت: \"من فکر می کردم کسی شوخی می کند.\" این بومی کارولینای جنوبی سال ها تلاش کرده بود تا آشپزی خود را به یک تجارت تمام وقت تبدیل کند. او در محاصره آشپزی خانگی بزرگ شد و در جوانی شروع به کسب درآمد کرد، ابتدا با تهیه سالاد برای همسایه ها و آشپزی خانواده، سپس با آرایش مو و ناخن. آشپزی بیش از یک دهه به عنوان یک چالش جانبی باقی ماند. جونز برای دوستانش بشقاب های غذاهای دریایی درست می کرد و گهگاه تابه می فروخت، اما مو و ناخن هزینه آن را پرداخت می کرد. یک بررسی ویروسی غذا 300 سفارش را در طول شب به ارمغان آورد. پلتفرم او را غیرعادی نمی‌دانست: به‌عنوان یک آرایشگر و تکنسین ناخن، او قبلاً از Craigslist برای یافتن مشتریان استفاده می‌کرد. او می‌گوید: «من همیشه در فیسبوک مارکت‌پلی پست می‌گذارم، زیرا مانند کریگزلیست من بود. \"من یک دختر کریگزلیست بودم.\" در همین حال، ریورا با سفارش غذا از طریق Facebook Marketplace و بررسی آن از ماشین خود، بیش از 2 میلیون دنبال کننده در TikTok ایجاد کرده بود. وقتی فهرست جونز را", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۲:۵۰"}, {"source": "Business Insider", "title": "GoDaddy’s CEO on when small businesses should — and shouldn't — use AI", "link": "https://www.businessinsider.com/godaddy-ceo-when-small-businesses-use-ai-2026-10", "summary": "Aman Bhutani, CEO of domain registrar and web-hosting company GoDaddy WEF GoDaddy has over 20 million customers, the majority of which are small businesses. Its CEO, Aman Bhutani, said small businesses can save time by automating operational tasks with AI. Bhutani said entrepreneurs need to focus on what they're good at — not outsource their brand. GoDaddy's CEO said small businesses should use AI to automate work, but not lose sight of their brand. As head of the domain registrar and web-hosting company, Aman Bhutani has a bird's-eye view into what works for small businesses. The company said it has over 20 million customers, the majority of which are micro businesses, or those with fewer than 10 employees. The entrepreneurs behind these companies consistently have passion and expertise, he said. However, they tend to have less technological capability — and even less bandwidth to do time-consuming tasks like creating and maintaining a website, said Bhutani. \"There is not enough time in the day,\" Bhutani told Business Insider. Today, business owners can use AI agents to do that type of work with minimal friction, Bhutani said, and they can use the tools to help run parts of their business. A recent survey from GoDaddy's small business research lab found that US entrepreneurs find content creation, marketing, and business advice as the top three areas where they see the most significant time savings with AI. This is part of a series of stories from Business Insider's conversation with GoDaddy CEO Aman Bhutani. The life-changing leadership advice Uber's CEO gave GoDaddy's CEO GoDaddy offers access to Airo, an agentic tool that builds websites and helps with other operational features. For instance, Bhutani said that Airo can create user logins for a small business's customers to make website profiles, or send targeted customer outreach based on a user's location or involvement with the business. When to use AI — and when not to He said that businesses should stick to using agents for tasks that they're not as skilled at, or those that don't differentiate them competitively. Bhutani said humans should control how their product is unique and not delegate control over their customers' experience. While AI can help with research — the owner ultimately needs to leverage their own knowledge when making decisions about what would work for the brand. \"It doesn't mean that AI cannot suggest those things,\" Bhutani said. \"It can suggest, but the human should continue ", "date_str": "2026-10-23T09:19:01+00:00", "hash": "93b821d22ffbc4b3", "title_fa": "مدیر عامل GoDaddy در مورد اینکه چه زمانی کسب و کارهای کوچک باید – و نباید – از هوش مصنوعی استفاده کنند", "summary_fa": "امان بوتانی، مدیر عامل شرکت ثبت دامنه و میزبانی وب GoDaddy WEF GoDaddy بیش از 20 میلیون مشتری دارد که اکثر آنها مشاغل کوچک هستند. مدیر عامل آن، امان بوتانی، گفت که کسب و کارهای کوچک می توانند با خودکارسازی وظایف عملیاتی با هوش مصنوعی در زمان خود صرفه جویی کنند. بوتانی گفت که کارآفرینان باید روی آنچه در آن مهارت دارند تمرکز کنند – نه اینکه برند خود را برون سپاری کنند. مدیر عامل GoDaddy گفت: کسب و کارهای کوچک باید از هوش مصنوعی برای خودکار کردن کار استفاده کنند، اما برند خود را از دست ندهند. امان بوتانی به عنوان رئیس شرکت ثبت دامنه و میزبانی وب، دیدگاهی چشمگیر نسبت به آنچه برای مشاغل کوچک دارد دارد. این شرکت گفت که بیش از 20 میلیون مشتری دارد که اکثریت آنها کسب و کارهای خرد یا آنهایی هستند که کمتر از 10 کارمند دارند. او گفت که کارآفرینانی که در پشت این شرکت‌ها قرار دارند، همواره از علاقه و تخصص برخوردارند. به گفته بوتانی، با این حال، آنها تمایل دارند توانایی های تکنولوژیکی کمتری داشته باشند - و حتی پهنای باند کمتری برای انجام کارهای وقت گیر مانند ایجاد و نگهداری یک وب سایت دارند. بوتانی به بیزینس اینسایدر گفت: «زمان کافی در روز وجود ندارد. بوتانی گفت که امروزه صاحبان مشاغل می توانند از عوامل هوش مصنوعی برای انجام این نوع کارها با کمترین اصطکاک استفاده کنند و می توانند از ابزارها برای کمک به اجرای بخش هایی از تجارت خود استفاده کنند. یک نظرسنجی اخیر از آزمایشگاه تحقیقاتی کسب و کار کوچک GoDaddy نشان داد که کارآفرینان آمریکایی ایجاد محتوا، بازاریابی و مشاوره کسب و کار را به عنوان سه حوزه اصلی که بیشترین صرفه جویی در زمان را با هوش مصنوعی مشاهده می کنند، می دانند. این بخشی از یک سری داستان از گفتگوی Business Insider", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۱ آبان • ۱۲:۴۹"}, {"source": "Business Insider", "title": "The 25 biggest documentary film openings of all time", "link": "https://www.businessinsider.com/the-top-25-highest-grossing-documentary-film-openings-2026-10", "summary": "Nathan Fielder and Lance Oppenheim directed You Can See Everything, a documentary that centers on Theranos founder Elizabeth Holmes in the 34 days before reporting to federal prison. JC Olivera/Getty Images The Elizabeth Holmes documentary \"You Can See Everything\" earned $15.6 million in its debut weekend. That makes it the second-highest-grossing traditional docufilm opening weekend of all time. Business Insider compiled the 25 biggest documentary opening weekends using Box Office Mojo data. Something unusual is happening right now: a documentary is drawing crowds to theaters at a level rarely seen for the genre. The Elizabeth Holmes documentary \"You Can See Everything,\" directed by Nathan Fielder and Lance Oppenheim, grossed $15.6 million in the US and Canada during its opening weekend in October. That makes it the second-biggest theatrical docufilm debut ever, behind director Michael Moore's \"Fahrenheit 9/11 ,\" which saw a nearly $24 million opening in 2004. \"You Can See Everything\" was filmed in the month before Holmes reported to prison in May 2023 after she was convicted of defrauding investors in connection with her now-defunct blood-testing company, Theranos . Theatrical documentary premieres have become rarer since the streaming era began, as the genre has found a major audience on streaming services such as Netflix and Hulu. Besides the new Holmes docufilm, only two others on the list were from this decade: \"Melania\" debuted to $7.1 million in January 2026, and \"After Death,\" a documentary about near-death experiences, opened to $5 million in 2023. Still, theatrical docufilms were once a cultural force, especially in the 2000s and 2010s , when a wave of nature-, political-, and celebrity-focused ones premiered in theaters to much fanfare. Here are the 25 highest-grossing traditional documentary film openings at the box office, using data from Box Office Mojo . Several hit concert docufilms, like \"Taylor Swift: The Eras Tour\" and \"Justin Bieber: Never Say Never,\" earned more but were omitted from this list to focus on traditional nonfiction documentaries. 25. Whitney (2018) Director Kevin MacDonald and Executive Producer Pat Houston attend the Whitney premiere on June 27, 2018, in New York City. Theo Wargo/Getty Images Opening weekend domestic gross: $1,265,572 Directed by Kevin Macdonald, \"Whitney\" chronicles the life and career of singer Whitney Houston. The documentary uses archival footage and interviews with people close to Houston to explore", "date_str": "2026-10-23T09:06:01+00:00", "hash": "d36c2cd297f6f785", "title_fa": "25 بزرگترین افتتاحیه فیلم مستند تمام دوران", "summary_fa": "ناتان فیلدر و لنس اوپنهایم فیلم مستندی به نام You Can See Everything را کارگردانی کردند که در 34 روز قبل از گزارش به زندان فدرال، الیزابت هلمز، بنیانگذار ترانوس، تمرکز دارد. JC Olivera/Getty Images مستند الیزابت هلمز «شما می توانید همه چیز را ببینید» در اولین آخر هفته خود 15.6 میلیون دلار به دست آورد. این فیلم را به دومین فیلم مستند سنتی پردرآمد افتتاحیه آخر هفته تمام دوران تبدیل کرده است. Business Insider با استفاده از داده‌های Box Office Mojo، 25 مستند بزرگ افتتاحیه آخر هفته را گردآوری کرد. اتفاقی غیرعادی در حال حاضر در حال رخ دادن است: یک فیلم مستند جمعیتی را به سالن‌ها می‌کشاند که به ندرت برای این ژانر دیده می‌شود. مستند الیزابت هولمز \"شما می توانید همه چیز را ببینید\" به کارگردانی ناتان فیلدر و لنس اوپنهایم، در هفته افتتاحیه خود در اکتبر 15.6 میلیون دلار در ایالات متحده و کانادا فروخت. پس از فیلم «فارنهایت 9/11» به کارگردانی مایکل مور که در سال 2004 افتتاحیه ای نزدیک به 24 میلیون دلار داشت، آن را به دومین اولین فیلم مستند بزرگ تاریخ تبدیل کرد. «شما می‌توانید همه چیز را ببینید» یک ماه قبل از اینکه هولمز به اتهام کلاهبرداری از سرمایه‌گذاران در ارتباط با شرکت آزمایش خون منحله‌اش، ترانوس، به زندان معرفی شود، در ماه می 2023 فیلمبرداری شد. اولین نمایش مستندهای تئاتری از زمان شروع دوره استریم نادرتر شده است، زیرا این ژانر مخاطبان عمده ای را در سرویس های استریم مانند نتفلیکس و هولو پیدا کرده است. علاوه بر فیلم مستند جدید هولمز، تنها دو فیلم دیگر در این فهرست متعلق به این دهه بودند: «ملانیا» با فروش 7.1 میلیون دلار در ژانویه 2026 و «پس از مرگ»، مستندی درباره تجربیات نزدیک به مرگ، با قیمت 5 میلیون دلار در سال 2023 افتتاح شد. آنهایی که با محوریت طبیعت، سیاسی و", "category": "سینما و سریال", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۱ آبان • ۱۲:۳۶"}, {"source": "Business Insider", "title": "I booked a one-way ticket to Bali after a layoff in fintech. I stayed in Asia for over a year — here's where my money stretched the furthest.", "link": "https://www.businessinsider.com/booked-ticket-bali-after-laid-off-160000-job-2026-10", "summary": "Tiffany Tang. Courtesy of Tiffany Tang Tiffany Tang founded DrinkFolks after a transformative journey across Asia in 2023 and 2024. Tang's layoff in 2023 led her to Bali, where she decided to extend her 30-day trip to over a year. DrinkFolks, inspired by Tang's travels, supports women-led farms and brings jamu to the US market. This as-told-to essay is based on a conversation with Tiffany Tang, the 30-year-old founder of DrinkFolks. It has been edited for length and clarity. I'm the founder and CEO of DrinkFolks, which brings jamu, a 1,300-year-old Indonesian herbal remedy, to the US as a prebiotic root tonic. For the first two years of my career, I was an assistant director at a gallery owned by the first female fine arts dealer in America. From 2017 to 2021, I worked at Christie's International Real Estate in marketing and communications roles. For the next year, I was a senior communications manager at CSM Sport Entertainment before taking on a similar role at a fintech company that helped millions of Americans sustainably build their credit scores through rewards. I felt positively about that job, but I was laid off in May 2023 I was grateful to work there. We were doing big things, and I really learned what it was like to be at a mission-driven company. The most interesting thing about my layoff was how incredibly calm I felt upon hearing the news. Our CMO told me first, and she was a friend, my college professor, and an executive I admire and respect. When she told me, I said I didn't blame her, and this was a time for a reset. Turns out, the layoff was the best thing that could've ever happened to me. A few weeks after my layoff, I booked a one-way ticket to Bali For a long time, my self-worth was my net worth — my title, my salary, my career trajectory. When the layoff hit, I lost my sense of self. Reflecting afterward, all I could think was: who am I without the high-paying job? A few weeks earlier, I had watched the movie \"Eat, Pray, Love.\" When the layoff came, something in me said that this was my moment. I opened Kayak, found a one-way ticket to Bali for around $1,000, and booked it. Bali felt approachable and warm. What was supposed to be a 30-day reset changed the course of my life I originally planned to travel in Southeast Asia for a month but ended up staying from June 2023 through August 2024. My awakening happened on day three. One of the first things I did in Bali was a Panchakarma , a full-body Ayurvedic detox at a retreat in Ubud. Th", "date_str": "2026-10-23T09:05:01+00:00", "hash": "28e5d689b55bff4d", "title_fa": "من پس از تعدیل کار در فین تک، بلیط یک طرفه به بالی را رزرو کردم. من بیش از یک سال در آسیا ماندم - اینجا جایی است که پول من بیش از همه افزایش یافت.", "summary_fa": "تیفانی تانگ. با حسن نیت از تیفانی تانگ تیفانی تانگ پس از یک سفر متحول کننده در سراسر آسیا در سال های 2023 و 2024، DrinkFolks را تأسیس کرد. اخراج تانگ در سال 2023 او را به بالی کشاند، جایی که تصمیم گرفت سفر 30 روزه خود را به بیش از یک سال افزایش دهد. DrinkFolks، با الهام از سفرهای تانگ، از مزارع تحت رهبری زنان پشتیبانی می کند و جامو را به بازار ایالات متحده می آورد. این مقاله گفته شده بر اساس گفتگو با تیفانی تانگ، بنیانگذار 30 ساله DrinkFolks است. برای طول و وضوح ویرایش شده است. من بنیانگذار و مدیر عامل DrinkFolks هستم که جامو، یک داروی گیاهی اندونزیایی 1300 ساله را به عنوان تونیک ریشه پری بیوتیک به ایالات متحده می آورد. در دو سال اول کارم، دستیار کارگردان در گالری متعلق به اولین زن فروشنده هنرهای زیبا در آمریکا بودم. از سال 2017 تا 2021، من در املاک بین المللی کریستیز در نقش های بازاریابی و ارتباطات کار کردم. برای سال بعد، من مدیر ارشد ارتباطات در CSM Sport Entertainment بودم، قبل از اینکه نقش مشابهی را در یک شرکت فین‌تک بر عهده بگیرم که به میلیون‌ها آمریکایی کمک کرد تا امتیازات اعتباری خود را از طریق پاداش‌ها ایجاد کنند. من نسبت به آن شغل احساس مثبتی داشتم، اما در می 2023 از کار اخراج شدم و از اینکه در آنجا کار کردم سپاسگزارم. ما کارهای بزرگی انجام می دادیم و من واقعاً یاد گرفتم که بودن در یک شرکت ماموریت محور چگونه است. جالب ترین چیز در مورد اخراج من این بود که با شنیدن این خبر چقدر آرامش باورنکردنی داشتم. مدیر ارشد مدیریت ما ابتدا به من گفت و او یک دوست، استاد دانشگاه و مدیری بود که من آن را تحسین می کنم و به او احترام می گذارم. وقتی به", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۱۲:۳۵"}, {"source": "Business Insider", "title": "Buzzy insurtech Corgi is hiring experienced investment bankers. The catch? The pay is commission-only.", "link": "https://www.businessinsider.com/corgi-hiring-investment-banker-no-base-salary-2026-10", "summary": "Corgi s cofounders ring the Nasdaq bell to celebrate the listing of its ETF last year. PR Newswire Buzzy insurtech Corgi has a knack for launching new businesses, and investment banking may be next. The firm posted a job for a managing director of investment banking. Unlike typical investment banking jobs, the pay is commission only. Corgi launched as an insurance startup, but it's been rapidly expanding into new businesses like thematic ETFs and 24/7 cafe/coworking spaces. A job filing posted this month suggests it's now eyeing M A investment banking. The company, valued at $5 billion, is hiring for a \" Managing Director, Investment Banking \" role, according to the posting. It says the company is \"seeking experienced Managing Directors with established client relationships, deep sector expertise, and a proven track record of originating and closing transactions.\" The company says it's seeking someone with more than five years of experience. Unlike traditional investment banking jobs, which typically pair a hefty base salary with performance-based compensation, this job is \"commission only, with no base salary.\" \"Payouts are tied to collected transaction fees, with terms based on origination and execution responsibilities and agreed upon before joining,\" the listing says. Investment banking managing directors across the industry made a median of $1.1 million a year in 2025, according to Prospect Rock Partners , and in previous years, bonuses made up more than two-thirds of total compensation . A commission-only contract could be seen as a hard sell for your average banker, but Corgi's prolific fundraising — $266 million this year and $431 million in total since its 2014 launch — and its vision of \"building an AI financial infrastructure company\" may be attractive to an ambitious young banker. The company did not respond to a request for comment about its plans or the job posting. Corgi was founded by Emily Yuan and Nico Laqua in 2024, offering a range of insurance products for startups. Its recently opened cafés are positioned as a marketing tool for startup founders. While an investment banking platform may seem to be an odd choice for an insurer, it is a clue that this is part of the firm's vision to serve startups by helping them sell their businesses. The posting said candidates should have relationships with \"founders, sponsors, and referral partners\" — in other words, those who can connect startup founders with private equity investors that could buy", "date_str": "2026-10-23T09:00:04+00:00", "hash": "d19c4bba69a92f46", "title_fa": "Buzzy insurtech Corgi بانکداران سرمایه گذاری با تجربه را استخدام می کند. گرفتن؟ پرداخت فقط کمیسیون است.", "summary_fa": "بنیانگذاران Corgi زنگ نزدک را برای جشن گرفتن فهرست ETF خود در سال گذشته به صدا در می آورند. PR Newswire Buzzy insurtech Corgi در راه اندازی مشاغل جدید مهارت دارد و بانکداری سرمایه گذاری ممکن است بعدی باشد. این شرکت برای یک مدیر عامل بانک سرمایه گذاری استخدام کرد. برخلاف مشاغل معمولی بانکداری سرمایه گذاری، پرداخت فقط پورسانت است. Corgi به عنوان یک استارت آپ بیمه راه اندازی شد، اما به سرعت در حال گسترش به کسب و کارهای جدید مانند ETF های موضوعی و فضاهای کافه/کار مشترک 24/7 است. یک پرونده شغلی ارسال شده در این ماه نشان می دهد که اکنون به بانکداری سرمایه گذاری M A چشم دوخته است. بر اساس این پست، این شرکت به ارزش 5 میلیارد دلار برای نقش \"مدیرعامل، بانک سرمایه گذاری\" استخدام می کند. این شرکت می گوید که این شرکت \"به دنبال مدیران عامل با تجربه با روابط مستقر با مشتری، تخصص عمیق در بخش، و سابقه اثبات شده مبدا و پایان معاملات است.\" این شرکت می گوید به دنبال فردی با بیش از پنج سال تجربه است. برخلاف مشاغل بانکداری سرمایه‌گذاری سنتی، که معمولاً حقوق پایه سنگین را با پاداش مبتنی بر عملکرد همراه می‌کنند، این شغل «فقط کمیسیون، بدون حقوق پایه» است. این فهرست می‌گوید: «پرداخت‌ها به کارمزدهای جمع‌آوری‌شده تراکنش، با شرایطی که بر اساس مسئولیت‌های مبدأ و اجرا و قبل از پیوستن توافق شده‌اند، مرتبط است». بر اساس گزارش Prospect Rock Partners، مدیران عامل بانک‌های سرمایه‌گذاری در سراسر صنعت در سال 2025 به طور متوسط ​​1.1 میلیون دلار در سال درآمد داشتند و در سال‌های گذشته، پاداش‌ها بیش از دو سوم کل غرامت را تشکیل می‌دادند. یک قرارداد فقط با کمیسیون می تواند برای یک بانکدار معمولی شما به عنوان یک فروش سخت تلقی شود، اما جذب سرمایه پربار Corgi - 266 میلیون دلار در سال جاری", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سرمایه‌گذاری"], "datetime_fa": "۱ آبان • ۱۲:۳۰"}, {"source": "Business Insider", "title": "Should we panic and turn off the internet?", "link": "https://www.businessinsider.com/cloudflare-vercel-leaders-caution-against-ai-cyber-panic-2026-10", "summary": "Stephanie Cohen, Cloudflare s chief strategy officer. Zed Jameson/Bloomberg via Getty Images This week's cyber freakout explained: AI is making software weaknesses easier to find and exploit. The message from Cloudflare's Stephanie Cohen and Vercel's Tom Occhino: Don't panic!!! Do we need everything connected to the internet? Paper bank statements work well. A few weeks ago, I heard a strange story about a friend who works at one of the Big Tech companies in Silicon Valley. She'd recently ripped out the connected devices in her home, ordered paper bank statements, and stocked up on canned goods in her basement. Now, she's a very sane, experienced person, and quite senior at one of the largest internet companies on earth. Why was she disconnecting so much? Just to be sure, my family ordered paper bank statements, too. It was still a head-scratcher, though. Fast forward to this week, and her actions look a little less crazy. AI models have exposed serious security weaknesses in software used by roughly 70% of websites. Meanwhile, US banks are finding AI agents inside customer accounts, including some that appear to be acting without their owners' instructions, Axios reported . 'Black October' The digerati have now entered full freakout mode. Much of the internet meltdown is happening on, well, the internet, my colleague Alice Tecotzky noted. On X and Reddit, warnings of a looming “Black October” spiraled into visions of AI grinding civilization to a halt. One lengthy post on X warned of a potential “global cyberattack/AI swarm” and offered a survival checklist: Stockpile cash in small bills, print out your neighbors' phone numbers, download maps, buy a hand-crank radio, and stash a gallon of water per person per day. Oh, and don't forget the manual can opener. You don't want to survive the AI apocalypse only to be defeated by a tin of beans. Nikita Bier , a prominent app developer and former head of product at X, best captured the mood. \"It's time to turn off the internet,\" he posted Wednesday night . A Cloudflare exec says it's 'a little bit scary' If you're reading this, you haven't done that yet. But should we really be worried? I put that question to Stephanie Cohen , chief strategy officer at Cloudflare, which helps protect about 20% of the internet. \"The world is a little bit scary right now,\" she told me on the side of Cloudflare's annual conference in San Francisco this week. Here's the problem. The internet is built on decades of software, much of i", "date_str": "2026-10-23T09:00:03+00:00", "hash": "eaeaa688b449f11a", "title_fa": "آیا باید وحشت کنیم و اینترنت را خاموش کنیم؟", "summary_fa": "استفانی کوهن، مدیر ارشد استراتژی کلادفلر. زد جیمسون/ بلومبرگ از طریق گتی ایمیجز این هفته توهین سایبری توضیح داد: هوش مصنوعی نقاط ضعف نرم افزار را برای یافتن و بهره برداری آسان تر می کند. پیام استفانی کوهن از Cloudflare و Tom Occhino از Vercel: نترسید!!! آیا ما به همه چیز متصل به اینترنت نیاز داریم؟ صورت‌حساب‌های بانکی کاغذی به خوبی کار می‌کنند. چند هفته پیش، داستان عجیبی درباره دوستی شنیدم که در یکی از شرکت های بزرگ فناوری در سیلیکون ولی کار می کند. او اخیراً دستگاه‌های متصل را در خانه‌اش پاره کرده بود، صورت‌حساب‌های بانکی کاغذی سفارش داده بود، و اجناس کنسرو شده را در زیرزمین خود ذخیره کرده بود. اکنون، او فردی بسیار عاقل، با تجربه و کاملاً ارشد در یکی از بزرگترین شرکت های اینترنتی روی زمین است. چرا اینقدر ارتباطش را قطع می کرد؟ فقط برای اطمینان، خانواده من نیز صورتحساب های بانکی کاغذی را سفارش دادند. با این حال، هنوز هم یک سر خاراندن بود. به سرعت به این هفته بروید، و اقدامات او کمی کمتر دیوانه کننده به نظر می رسد. مدل‌های هوش مصنوعی ضعف‌های امنیتی جدی را در نرم‌افزارهای مورد استفاده تقریباً ۷۰ درصد از وب‌سایت‌ها آشکار کرده‌اند. اکسیوس گزارش داد، در همین حال، بانک‌های ایالات متحده در حال یافتن عوامل هوش مصنوعی در حساب‌های مشتریان هستند، از جمله برخی که به نظر می‌رسد بدون دستور صاحبان خود عمل می‌کنند. 'اکتبر سیاه' دایگراتی ها اکنون وارد حالت freakout کامل شده اند. همکار من آلیس تکوتزکی خاطرنشان کرد که بسیاری از خرابی اینترنت در اینترنت اتفاق می افتد. در ایکس و ردیت، هشدارهای مربوط به \"اکتبر سیاه\" در حال پیشروی به چشم‌اندازهایی مبنی بر توقف تمدنی که هوش مصنوعی در حال نابودی است، تبدیل شد. یکی از پست‌های طولانی در X درباره احتمال یک «انبوه حمله سایبری/هوش مصنوعی جهانی» هشدار داد و یک", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "عامل‌های هوشمند"], "datetime_fa": "۱ آبان • ۱۲:۳۰"}, {"source": "Business Insider", "title": "Wait, the average Muse agent purchase is over $200? Tell me what you're buying!", "link": "https://www.businessinsider.com/meta-muse-purchases-survey-2026-10", "summary": "Meta Muse, hard at work at spending your money. Smith Collection/Gado/Getty Images Meta says that over a quarter of Muse users made purchases with the AI agent. The average order was over $200 — that's a lot of clams! If this is you, please tell me what you're using it for. Something just blew my mind, and I'm asking for your help to figure it out. According to Meta's Q3 earnings call on Wednesday , more than a quarter of Muse users so far have used the AI agent make purchases — and the average order size is over $200. I'll say that again: average order size over $200. This is shocking to me, and I'm someone who has been actively and happily using Muse for a variety of things. I've been perfectly happy to give Muse access to my email, my calendar, my credit cards, and even my Apple health data. But I've been slightly reticent about using it to actually buy stuff. Not that I'm totally worried about it getting stuff wrong (although the one purchase I did try to make with it was to order a salad for lunch , and it attempted to place the order on my HSA card after I failed to recognize the last 4 digits of that card, oops). I think it's more I enjoy shopping online myself? I mean, for most things, I suppose. For \"fun\" stuff like clothes or personal items, I enjoy browsing and the hit of dopamine when you check out. (Others take this to the extreme, using \" dopamine sites \" that let you browse fake restaurants and \"order\" food that never arrives.) The other night I ordered — on a real site — cotton balls, razor blade refills, a plain white t-shirt, and a pair of scissors from the Target app while watching TV and even that boring purchase with a total under $30 gave me a small thrill. Why would I want to cede that joy to AI? I understand, however, that not all purchases are fun . My colleague, Peter Kafka, used Muse to help him place an order for a new washing machine — the kind of purchase that is difficult to decide on, not particularly fun or exciting to make, and fairly expensive. Things like plane tickets, washing machines, or car insurance are in that category of stuff you have to buy, cost a lot of money, are fairly complicated to decide which option to buy, but bring very little joy during checkout. I can understand why you might want to hand that off to an AI agent. If you are using Muse to place big $$$ orders, what the heck are you buying? My best guess here is that people are using Muse for airplane flights and hotels — the kind of big dollar items t", "date_str": "2026-10-23T09:00:02+00:00", "hash": "29dd3ef35b8b192b", "title_fa": "صبر کنید، میانگین خرید نماینده Muse بیش از 200 دلار است؟ بگو چی میخری", "summary_fa": "Meta Muse، سخت در حال خرج کردن پول خود هستید. مجموعه اسمیت/گادو/گتی ایماژ متا می گوید که بیش از یک چهارم کاربران Muse با عامل هوش مصنوعی خرید کرده اند. میانگین سفارش بیش از 200 دلار بود - این صدف های زیادی است! اگر این شما هستید، لطفاً به من بگویید برای چه چیزی از آن استفاده می کنید. چیزی ذهنم را درگیر کرده است و برای فهمیدن آن از شما کمک می خواهم. بر اساس فراخوان درآمد سه ماهه سوم متا در روز چهارشنبه، بیش از یک چهارم کاربران Muse تاکنون از عامل هوش مصنوعی برای خرید استفاده کرده اند – و میانگین اندازه سفارش بیش از 200 دلار است. باز هم می گویم: اندازه متوسط ​​سفارش بیش از 200 دلار. این برای من تکان دهنده است، و من کسی هستم که به طور فعال و با خوشحالی از Muse برای کارهای مختلف استفاده کرده ام. من کاملاً خوشحالم که به Muse اجازه دسترسی به ایمیل، تقویم، کارت‌های اعتباری و حتی داده‌های سلامتی اپل را دادم. اما من در مورد استفاده از آن برای خرید واقعی چیزها کمی تردید داشته ام. نه اینکه من کاملاً نگران اشتباه کردن آن باشم (اگرچه یک خریدی که سعی کردم با آن انجام دهم، سفارش سالاد برای ناهار بود، و بعد از اینکه نتوانستم 4 رقم آخر آن کارت را تشخیص دهم، سعی کردم سفارش را روی کارت HSA من بگذارم، اوه). فکر می کنم بیشتر از خرید آنلاین لذت می برم؟ منظورم این است که برای بیشتر چیزها، فکر می کنم. برای چیزهای \"سرگرم کننده\" مانند لباس یا وسایل شخصی، از مرور و ضربه دوپامین هنگام بررسی لذت می برم. (بقیه این کار را تا حد زیادی انجام می دهند و از \"سایت های دوپامین\" استفاده می کنند که به شما امکان می دهد رستوران های تقلبی را مرور کنید و غذایی", "category": "هوش مصنوعی مولد", "tags": [" Insider previously reported. This has included pushing for more focus on RSI. A report from the firm Gladstone AI, published earlier this month , said that most researchers interviewed from companies including Anthropic and DeepMind believed RSI will start within the next three to 12 months, and possibly sooner without government intervention. In another moment on the \"Big Technology Podcast,\" Pichai was asked about how much AI was being used to code internally. The company said in April that 75% of new code inside Google was generated by AI. \"That number in our world today is like meaningless in the sense that every part of code we now touch is influenced by AI deeply,\" Pichai said. With Gemini 4 Argon, he said, people were going to tackle harder problems. He also said Google was seeing a one-third decrease in code roll", "date_str": "2026-10-23T07:45:01+00:00", "hash": "3a9190504fafb555", "title_fa": "ساندار پیچای می‌گوید گوگل تا «وضعیت نهایی» هوش مصنوعی خود-بهبود فاصله دارد", "summary_fa": "ساندار پیچای می گوید که محققان گوگل از هوش مصنوعی برای کمک به ساخت مدل های بعدی هوش مصنوعی استفاده می کنند. هاردیک چابرا/ گروه India Today از طریق Getty Images، ساندار پیچای گفت که گوگل هنوز در مراحل اولیه هوش مصنوعی به صورت بازگشتی است. او گفت که محققان در حال کار با عوامل هوش مصنوعی برای ساخت مدل های بهتر هستند. سرگئی برین اخیراً گفت که گوگل \"شروع به ورود به تردمیل RSI کرده است.\" مدل‌های هوش مصنوعی گوگل ممکن است به ساخت جانشین‌های خود کمک کنند، اما ساندار پیچای، مدیرعامل این شرکت می‌گوید هنوز زمان زیادی برای بهبود کامل هوش مصنوعی باقی مانده است. پیچای در یکی از قسمت‌های «پادکست فناوری بزرگ» این هفته گفت که محققان گوگل از عوامل هوش مصنوعی برای کمک به آنها در ساخت مدل‌ها استفاده می‌کنند، اما هشدار دادند که هنوز روزهای اولیه است. پیچای با اشاره به خود-بهبودی بازگشتی گفت: «ما با وضعیت نهایی RSI فاصله داریم. \"روش درست برای توصیف آن این است که شما حلقه‌های RSI همراه با محققان هوش مصنوعی در جنبه‌های مختلف توسعه مدل دارید. من می‌توانم بگویم شما تقریباً نمایندگانی دارید که به روش‌های خودکار به محققان هوش مصنوعی کمک می‌کنند تا با هم برای ساخت این مدل‌ها کار کنند.\" پیچای اضافه کرد که انتظار دارد این تداوم پیشرفت را تا سال آینده ادامه دهد. در اوایل این ماه، سرگئی برین، یکی از بنیانگذاران گوگل، گفت که سری مدل‌های فلش این شرکت و همچنین جمینی 4، نشان می‌دهند که هوش مصنوعی چگونه به ساخت خود کمک می‌کند و گوگل شروع به ورود به آن تردمیل RSI کرده است. او گفت: «و اکنون محققان ما و مدل دست به دست هم می دهند تا نسخه بعدی این مدل را بسازند. به گزارش بیزینس اینسایدر، برین به طور فزاینده‌ای در تلاش‌های جمینی گوگل مشارکت داشته و از قدرت", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Google", "عامل‌های هوشمند"], "datetime_fa": "۱ آبان • ۱۱:۱۵"}, {"source": "Business Insider", "title": "The tech selloff is forcing companies to rethink IPO plans", "link": "https://www.businessinsider.com/ai-selloff-companies-rethink-ipo-sk-hynix-kospi-2026-10", "summary": "Investors are increasingly questioning whether the billions being poured into AI infrastructure will generate sufficient returns. Michael M. Santiago/Getty Images The global tech selloff is hitting IPO plans, with even some of the AI boom's biggest winners pulling back. SK Hynix has scrapped a potential US listing of its Solidigm unit as semiconductor stocks tumble. Other companies are retreating from IPOs as market volatility rattles investors and fundraising plans. The global tech selloff is spilling beyond stock markets, prompting some of the AI boom's biggest beneficiaries to rethink plans to raise money through public listings. On Friday, South Korean memory-chip giant SK Hynix said it was abandoning a review of a potential US initial public offering of its Solidigm subsidiary, citing market volatility and a broader correction in semiconductor stocks. \"In light of recent capital market conditions and share price trends, Solidigm determined that it was necessary to reassess whether an IPO would be the most beneficial option for SK hynix and its existing shareholders at this time,\" the company said in a statement. SK Hynix shares fell as much as 4% in South Korea on Friday before reversing losses to close 4% higher. Rival Samsung Electronics closed 0.5% higher after early losses. The benchmark Kospi index closed 0.3% higher. Meanwhile, Japan's Nikkei 225 ended 0.3% lower. The moves followed Thursday's Wall Street rout, when the Nasdaq Composite fell 3% amid growing questions about the returns on massive AI investments. The Philadelphia Semiconductor Index plunged 7% The selling had spread beyond the more speculative corners of the AI trade, wrote Chris Weston, head of research at Pepperstone. \"This is no longer simply a market punishing highly leveraged AI companies with questionable funding economics,\" Weston wrote in a note on Friday. Investors were cutting exposure across the AI sector, including companies with stronger balance sheets and established earnings, he added. That selling has caught up with even some of the AI boom's biggest winners. SK Hynix has been one of the AI boom's biggest winners, thanks to its leadership in high-bandwidth memory, a crucial component of Nvidia's AI processors. The company joined the trillion-dollar club earlier this year before a sharp selloff knocked it out. In July, it raised $26.5 billion through a Nasdaq listing of American depositary receipts, one of the largest share offerings in history. Its subsidiary Solid", "date_str": "2026-10-23T07:18:23+00:00", "hash": "c580abf77a44cad0", "title_fa": "فروش تکنولوژی شرکت ها را مجبور می کند تا در برنامه های عرضه اولیه سهام تجدید نظر کنند", "summary_fa": "سرمایه گذاران به طور فزاینده ای این سوال را مطرح می کنند که آیا میلیاردها دلاری که به زیرساخت های هوش مصنوعی سرازیر می شود، بازدهی کافی ایجاد می کند یا خیر. Michael M. Santiago/Getty Images فروش جهانی فناوری در حال رسیدن به برنامه‌های عرضه اولیه سهام است و حتی برخی از بزرگترین برندگان رونق هوش مصنوعی عقب نشینی می‌کنند. SK Hynix با کاهش سهام نیمه هادی ها، فهرست احتمالی واحد Solidigm خود را در ایالات متحده کنار گذاشت. شرکت‌های دیگر در حال عقب‌نشینی از عرضه‌های اولیه سهام هستند، زیرا نوسانات بازار سرمایه‌گذاران و برنامه‌های جمع‌آوری سرمایه را تحت تأثیر قرار می‌دهد. فروش جهانی فناوری از بازارهای سهام فراتر می رود و برخی از بزرگترین ذینفعان رونق هوش مصنوعی را وادار می کند تا در برنامه های خود برای جمع آوری پول از طریق فهرست های عمومی تجدید نظر کنند. روز جمعه، غول تراشه‌های حافظه کره جنوبی SK Hynix گفت که بررسی عرضه اولیه احتمالی شرکت تابعه Solidigm خود را به دلیل نوسانات بازار و اصلاح گسترده‌تر سهام نیمه‌رساناها کنار می‌گذارد. این شرکت در بیانیه ای اعلام کرد: «با توجه به شرایط اخیر بازار سرمایه و روند قیمت سهام، Solidigm تشخیص داد که لازم است مجدداً ارزیابی شود که آیا IPO سودمندترین گزینه برای SK hynix و سهامداران فعلی آن در حال حاضر است یا خیر. سهام SK Hynix در روز جمعه در کره جنوبی تا 4 درصد سقوط کرد و پس از معکوس کردن زیان، 4 درصد بیشتر شد. رقیب سامسونگ الکترونیک پس از ضررهای اولیه، 0.5 درصد بالاتر بسته شد. شاخص کوسپی 0.3 درصد بالاتر بسته شد. در همین حال، Nikkei 225 ژاپن با 0.3 درصد کاهش به پایان رسید. این حرکت ها به دنبال شکست روز پنجشنبه وال استریت، زمانی که نزدک کامپوزیت در بحبوحه سوالات فزاینده در مورد بازده سرمایه گذاری های عظیم هوش مصنوعی 3", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه", "سرمایه‌گذاری"], "datetime_fa": "۱ آبان • ۱۰:۴۸"}, {"source": "Business Insider", "title": "What is Warhound, Palmer Luckey's war dog startup that just emerged from stealth?", "link": "https://www.businessinsider.com/palmer-luckey-benn-lamm-warhound-war-dog-startup-seed-funding-2026-10", "summary": "Palmer Luckey and Ben Lamm have launched a startup to genetically engineer military dogs. JAVIER TORRES/AFP via Getty Images Palmer Luckey and Ben Lamm have partnered up for a new startup. Their startup, Warhound, aims to create a new league of highly capable military dogs. Warhound announced that it had $200 million in its seed round. \"Man's best friend deserves man's best tech.\" That's what Palmer Luckey said about his new startup, Warhound. The Anduril cofounder, along with Colossal Biosciences cofounder Ben Lamm , raised $200 million in seed funding for the startup that aims to genetically engineer high-performance military dogs. Warhound said in a Thursday press release that it wants to rebuild the US's supply of working dogs for military forces, law enforcement, and emergency first-response teams. It added that most of the military dogs currently working in the US are acquired from Europe, and many are eventually deemed unfit for service. Colossal Biosciences is a biotechnology company that uses gene-editing tools to protect endangered species and revive extinct ones. It will help produce healthier dogs suited to demanding missions, with Lamm telling TechCrunch that this involves enhancing the dogs' speed, agility, and ability to sniff out bombs. Anduril's contribution to Warhound is the external hardware to keep the dogs and their handlers safe, such as eye and ear protection. Warhound's $200 million seed round was backed by several VC firms, including In-Q-Tel, Sequoia Capital, ARK Invest, and Franklin Templeton. Shaun Maguire, a partner at Sequoia Capital, said in the release, \"Palmer, Ben and the Warhound team are exceptional. Sequoia is proud to back them.\" Warhound will be led by CEO David Spirk, a senior counselor at Palantir and a veteran of the US Marine Corps. He was also a former data officer for the Department of War. The startup, based in Texas, has made commitments to animal welfare, saying in the release that it's certified by the American Humane Society, the US's first national animal welfare organization. It said that improving the health and training success of the dogs will limit the number who enter unnecessary intensive training and enable safer missions. Read the original article on Business Insider", "date_str": "2026-10-23T05:30:54+00:00", "hash": "a24de415f0f3683d", "title_fa": "Warhound، استارت آپ سگ جنگی Palmer Luckey که به تازگی از مخفی کاری بیرون آمده چیست؟", "summary_fa": "پالم our, I would have already heard the question \"How much longer?\" One of them would also declare, \"It's boring. We're just walking.\" So what was different about this hike ? Why weren't they complaining? It's because I took a different approach to this hike than I have with past ones — and it worked. Here's what I did. A stranger motivated them more than I ever could For this hike, we had a local guide with us, and my kids hung on her every word. They were asking questions non-stop and following her down the trail without a single complaint. I almost laughed when I saw them literally stepping in her footprints and mimicking every move she made. This is not what my husband and I were accustomed to. When she leaned on a rock to hear \"the whispers of the forest,\" my kids did the same. When she found edible berries , my kids rushed there to try them first. I do my best to make hikes interesting for my kids, but I am also a first-time visitor to most of the places we explore. No matter how much I research beforehand, I usually can't predict what they will find interesting along the trail. By contrast, this local guide knew exactly how to keep them excited, which kept them moving along. Having a job kept them interested I also noticed that the guide occasionally gave them \"crucial\" jobs along the trail. Who could find the next patch of berries, who could spot mushrooms growing on a log, or who could hear a bird singing? When we are alone, I try to do these things too, but I cannot always answer the questions that ultimately follow: \"Are these berries edible?\" \"What kind of mushroom is that?\" or \"Which bird is singing?\" I know my kids are naturally curious, but I wondered why my kids seem uninterested when it's just us. I began to realize they stopped asking me questions because they knew I didn't always have answers. Since our guide did this time, they asked her. They were eager to learn. I tailored th", "date_str": "2026-10-22T21:38:01+00:00", "hash": "1075fc9
