"002ff93815802531", "title_fa": "Samsung Galaxy Tab S12+ که به تازگی منتشر شده است، در حال حاضر 200 دلار تخفیف دارد، همراه با گیفت کارت 200 دلاری", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. طبق گزارش ردیاب‌های قیمت، گلکسی تب اس 12 پلاس جدید سامسونگ با 512 گیگابایت فضای ذخیره‌سازی در آمازون از 1599.99 دلار به 1399.99 دلار کاهش یافته است. این بسته همچنین شامل یک کارت هدیه 200 دلاری آمازون تا 21 اکتبر به همراه 90 روز رایگان آمازون موزیک است. CNET آن را ارتقای قابل توجهی نسبت به Tab S10+ می‌نامد، با بدنه‌ای که از 5.6 میلی‌متر به 5.3 میلی‌متر باریک می‌شود و وزن آن 553 گرم است، در حالی که همچنان دارای حفاظت IP68 در برابر گرد و غبار و آب تا 30 دقیقه در عمق یک متری است. همچنین می‌تواند یک صفحه نمایش کمی بزرگ‌تر 12.6 اینچی (از 12.4 اینچ) را با کوتاه کردن قاب‌ها در قاب خود جای دهد. Galaxy Tab S12+ (512 گیگابایت) با گیفت کارت 200 دلاری 1,399.99 دلار در آمازون 1,599.99 دلار صرفه جویی در 200.00 دلار دریافت معامله دریافت معامله 1399.99 دلار در آمازون 1599.99 دلار صرفه جویی 200.00 دلار این صفحه نمایش دارای پنل Dynamic AMOLED 2X با روشنایی AMOLED 12X است. بعید است که در استفاده روزمره به این عدد 1600 نیت دست پیدا کنید، اما یکی از درخشان ترین پنل هایی است که در تبلت اندرویدی خواهید یافت و آن را برای تماشای فیلم، خواندن یا کار در چندین برنامه مناسب می کند. این پردازنده مدیاتک Dimensity 9500 ارتقا یافته با فضای سر کافی برای بازی های سخت و چندوظیفه ای است، به خصوص اگر قصد دارید از Samsung DeX استفاده کنید که به تبلت رابط کاربری دسکتاپ تری می دهد. با این حال، استفاده حداکثری از DeX معمولاً به معنای افزودن صفحه کلید است و گزینه های سامسونگ هزینه کلی را به میزان قابل توجهی افزایش"}, {"source": "Lifehacker", "title": "Lifehacker Is on TechPulse, and You Should Be Too", "link": "https://lifehacker.com/tech/lifehacker-is-on-techpulse-and-you-should-be-too?utm_medium=RSS", "summary": "Your homepage used to say something about you. When I got my first computer in high school, back when Google was just a weird name, my homepage was MSN. Later, in college, I changed it to ESPN it was espn.go.com back then and then to a new site called Facebook. By graduation, it was Google. Like a screensaver or background, the homepage represented a small part of our identity, but functionally, it crafted how we found information. If you're old enough, your experience of sorting through the internet was probably the same, evolving from homepages to RSS feeds, browser extensions, and apps. My latest guide to the internet is called TechPulse. TechPulse is a free app with tech news, reviews, and culture from sites like CNET, PCMag, Mashable, and my team at Lifehacker. It's a clean feed with no algorithms or noise, featuring articles and videos that run the gamut from tech news to digital culture trends. If you're looking for hands-on, lab-tested reviews and advice on what tech to buy, you can prioritize CNET and PCMag coverage. If you already own a new piece of tech and are looking for practical hacks and productivity tips, you can sort through Lifehacker. For internet trends, movie reviews, and entertainment, you can browse Mashable. There are both articles and videos integrated directly into the app, streamlining your tech news intake into one place while still reading varied, unique perspectives. It's obviously self-serving for me to talk about TechPulse and hope you give it a try, but I do think it's the best centralized hub for a broad range of news from sites with their own unique approaches to covering tech. TechPulse unifies those sites into a single platform that gives readers direct access to tech coverage in a chronological feed. My favorite part? No subscription is required. You don't even need to give your email address, sign up, or log in. TechPulse features tech news written, filmed, and curated by real people, and I hope it feels like a breath of fresh air compared to the algorithm-driven feeds that warp to our unconscious whims and fight for our attention. You're welcome to customize the daily dashboard and better control your news, but if you prefer, you can leave it to TechPulse to keep you informed in a simple, straightforward way. I hope that the next time you read my work or catch a video, you find it there. TechPulse is available on the Apple App Store and Google Play Store .", "date_str": "2026-10-20T11:00:17+00:00", "hash": "6edc4849d02b781e", "title_fa": "Lifehacker در TechPulse است و شما نیز باید باشید", "summary_fa": "صفحه اصلی شما قبلاً چیزی در مورد شما می گفت. وقتی اولین کامپیوترم را در دبیرستان گرفتم، زمانی که گوگل فقط یک نام عجیب بود، صفحه اصلی من MSN بود. بعداً، در کالج، آن را به ESPN تغییر دادم که در آن زمان espn.go.com بود و سپس به یک سایت جدید به نام فیس بوک. با فارغ التحصیلی، گوگل بود. مانند یک محافظ صفحه نمایش یا پس زمینه، صفحه اصلی بخش کوچکی از هویت ما را نشان می دهد، اما از نظر عملکردی، نحوه یافتن اطلاعات را ایجاد می کند. اگر به اندازه کافی بزرگ هستید، تجربه شما از مرتب‌سازی از طریق اینترنت احتمالاً یکسان بوده و از صفحات اصلی به فیدهای RSS، برنامه‌های افزودنی مرورگر و برنامه‌ها تبدیل شده است. آخرین راهنمای من برای اینترنت TechPulse نام دارد. TechPulse یک برنامه رایگان با اخبار فنی، بررسی ها و فرهنگ از سایت هایی مانند CNET، PCMag، Mashable و تیم من در Lifehacker است. این یک فید تمیز و بدون الگوریتم یا نویز است که شامل مقالات و ویدیوهایی است که از اخبار فناوری تا گرایش‌های فرهنگ دیجیتال را در بر می‌گیرد. اگر به دنبال بررسی عملی و آزمایش‌شده در آزمایشگاه و مشاوره در مورد فناوری خرید هستید، می‌توانید پوشش CNET و PCMag را در اولویت قرار دهید. اگر قبلاً صاحب یک تکه فناوری جدید هستید و به دنبال هک های عملی و نکات بهره وری هستید، می توانید از طریق Lifehacker مرتب کنید. برای ترندهای اینترنتی، بررسی فیلم ها و سرگرمی، می توانید Mashable را مرور کنید. هم مقاله‌ها و هم ویدیوهایی وجود دارد که مستقیماً در برنامه ادغام شده‌اند و دریافت اخبار فناوری شما را در یک مکان ساده می‌کنند در حالی که همچنان دیدگاه‌های متنوع و منحصربه‌فرد را می‌خوانید. بدیهی است که صحبت کردن در مورد TechPulse برای من سودمند است و امیدوارم آن را امتحان کنید، اما"}, {"source": "Lifehacker", "title": "I Tried Strava's New Strength Coach Feature, and I'm Optimistic", "link": "https://lifehacker.com/health/i-tried-stravas-new-strength-coach-feature-and-im-optimistic?utm_medium=RSS", "summary": "Strava has built its reputation on runs, rides, and swims. Strength training, however, has always felt like an afterthought in the app. Strava is trying to close that gap with its new guided strength workouts, and I spent some time with the beginner session to see whether it delivers. Strava s new strength coach feature The update brings guided workouts directly in the app. Instead of just logging that you lifted, you're walked through each exercise with animations, and you track sets and reps live as you go. Tap into any exercise, and you'll find form guidance, tips, and the specific muscles it targets. When you finish, everything (every exercise, set, and rep) is saved automatically to your activity through the Workout Log. Your muscle map then updates to show where the effort went, which is a neat way to see at a glance whether you've been neglecting certain areas. The feature is rolling out to subscribers over the next few weeks, and free users get access to a sample workout, so you can try it before deciding whether it's worth paying for. My experience with Strava's strength workouts I started with the beginner workout, and I want to be clear about who it's for: true beginners. There's no equipment required, so you don't need dumbbells, bands, or a gym membership. If you've been lifting for years, this isn't going to challenge you but that's clearly not the point. For this first workout, it's designed to lower the barrier to entry. Credit: Meredith Dietz The interface is clean and easy to use. I especially liked the graphics, which make it simple to follow along without having to pause and decipher what a movement is supposed to look like. Everything worked smoothly throughout, with no glitches, lag, or lost progress. I have only two real notes: Exercise instructions sometimes cut off. A few of the written descriptions were truncated with no way to see the full text, so I couldn't always read the full guidance on form. Switching sides isn't always clear. For movements that work one side at a time, it wasn't obvious when I was supposed to switch. A simple cue or prompt would go a long way, especially for beginners who are already juggling a lot of new information. Exercise instructions sometimes cut off. Credit: Meredith Dietz What's coming next to Strava's strength workout feature Strava says more workout series will arrive before the end of the year, which should give the feature more range beyond that first beginner session. The company is also plan", "date_str": "2026-10-19T20:30:47+00:00", "hash": "1fd067535739ce8f", "title_fa": "من ویژگی جدید مربی قدرت Strava را امتحان کردم و خوشبین هستم", "summary_fa": "استراوا شهرت خود را با دویدن، سواری و شنا ساخته است. با این حال، تمرینات قدرتی همیشه مانند یک فکر بعدی در برنامه احساس می شود. Strava در تلاش است تا این شکاف را با تمرینات قدرتی هدایت‌شده جدید خود ببندد، و من مدتی را با جلسه مبتدی گذراندم تا ببینم آیا نتیجه می‌دهد یا خیر. ویژگی جدید مربی قدرت Strava به روز رسانی تمرینات هدایت شده را مستقیماً در برنامه به ارمغان می آورد. به‌جای اینکه فقط از آن‌چه بلند کرده‌اید ثبت نام کنید، در هر تمرین با انیمیشن‌ها قدم می‌زنید، و در حین حرکت ست‌ها و تکرارها را به‌طور زنده دنبال می‌کنید. روی هر تمرینی ضربه بزنید و راهنمایی فرم، نکات و ماهیچه های خاصی را که مورد هدف قرار می دهد پیدا خواهید کرد. پس از اتمام، همه چیز (هر تمرین، ست، و تکرار) به طور خودکار در فعالیت شما از طریق گزارش تمرین ذخیره می شود. نقشه عضلانی شما سپس به‌روزرسانی می‌شود تا نشان دهد که تلاش‌ها کجا رفته است، که روشی منظم است برای اینکه در یک نگاه متوجه شوید که آیا مناطق خاصی را نادیده گرفته‌اید یا خیر. این ویژگی طی چند هفته آینده در اختیار مشترکین قرار می گیرد و کاربران رایگان به یک نمونه تمرین دسترسی پیدا می کنند، بنابراین می توانید قبل از تصمیم گیری در مورد اینکه آیا ارزش پرداخت آن را دارد یا خیر، آن را امتحان کنید. تجربه من با تمرینات قدرتی Strava را با تمرینات مبتدی شروع کردم و می‌خواهم مشخص کنم که این تمرین برای چه کسی است: مبتدیان واقعی. هیچ تجهیزات مورد نیازی وجود ندارد، بنابراین نیازی به دمبل، باند یا عضویت در باشگاه ندارید. اگر سال‌ها است که بلند می‌کنید، این شما را به چالش نمی‌کشد، اما واضح است که موضوع این نیست. برای این اولین تمرین، برای کاهش مانع ورود طراحی شده است."}, {"source": "Lifehacker", "title": "These Sennheiser Wireless Headphones Are 32% Off Right Now", "link": "https://lifehacker.com/tech/sennheiser-momentum-4-headphones-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. In a market where every year there is an expectation of releasing a new model, how long tech companies take to feel the need to upgrade a product is a testament to how good the product is. The Sennheiser Momentum 4 has been around since 2022, and they were only succeeded this summer with the Sennheiser Momentum 5 . However, they are still great headphones, and with their $204.60 price (originally $299.99) after a 32% discount, they're a great opportunity to get top-quality headphones at a more than reasonable price. Sennheiser Momentum 4 Wireless Headphones ANC, 60 Hr Battery, White | Sennheiser Signature Sound, Adaptive Noise Cancellation Plus Transparency Mode $204.60 at Amazon $299.99 Save $95.39 Get Deal Get Deal $204.60 at Amazon $299.99 Save $95.39 The Momentum 4 competes with other flagships from its time, including the Sony 1000XM5 and the Bose QuietComfort 45, in terms of comfort, design, audio quality, and other features. The Momentum 4 has a more bass-forward sound compared to its competition, but it's still balanced. The biggest con is that you don't have full EQ control, only being able to select certain presets from the Momentum app. The ANC is great, but not a match compared to the Sony and Bose competition. Where it does beat its competition is with the codecs it supports, including AAC, AptX, AptX Adaptive, and SBC codecs . This means better audio quality for Android devices than the Sony or Bose options. The battery is powerful, reaching about 60 hours of juice at mid-level. It also has a 3.5mm audio cable, so you can use it wired. The microphone is perfect for making calls, with four-MEMS-mics helping make your voice stand out even in noisy environments. You can see more features from the Momentum 4 in PCMag's \"excellent\" review . If you're looking for a bargain on an established flagship headphone model without having to pay the premium in 2026, the Sennheiser Momentum 4 are a great pair to consider. Our Best Editor-Vetted Tech Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $199.00 (List Price $249.00) Apple HomeView Smart Display (Silver, 2026 Release) $299.00 (List Price $299.00) Apple TV 4K 4th Gen 128GB Streaming Player (2026 Model) $289.99 (List Price $299.00) TCL Tab 10 Gen 4 128GB 10.1\" Tablet (Dark Blue/Gray) $149.98 (List Price $199.99) Google Fitbit Edge Activity Tracker", "date_str": "2026-10-19T19:30:00+00:00", "hash": "aa6f9cc3b2c5036e", "title_fa": "این هدفون های بی سیم سنهایزر در حال حاضر 32٪ تخفیف دارند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. در بازاری که هر سال انتظار عرضه یک مدل جدید وجود دارد، مدت زمانی که شرکت‌های فناوری نیاز به ارتقای یک محصول را احساس می‌کنند، گواهی بر خوب بودن محصول است. Sennheiser Momentum 4 از سال 2022 وجود داشته است و آنها تنها در تابستان امسال با Sennheiser Momentum 5 موفق شدند. با این حال، آنها همچنان هدفون های فوق العاده ای هستند و با قیمت 204.60 دلاری خود (در اصل 299.99 دلار) پس از 32 درصد تخفیف، فرصتی عالی برای دریافت هدفون های باکیفیت با قیمتی بیش از حد معقول هستند. هدفون سنهایزر مومنتوم 4 وایرلس ANC، باتری 60 ساعته، سفید | صدای امضای Sennheiser، حالت شفافیت حذف نویز تطبیقی 204.60 دلار در آمازون 299.99 دلار صرفه جویی 95.39 دلار دریافت معامله دریافت معامله 204.60 دلار در آمازون 299.99 دلار صرفه جویی 95.39 دلار Momentum 4 با دیگر پرچمداران زمان خود رقابت می کند، از جمله پرچمداران Sony0X از زمان خود، Sony00X و Sony00X. QuietComfort 45 از نظر راحتی، طراحی، کیفیت صدا و سایر ویژگی ها. Momentum 4 در مقایسه با رقبای خود صدای بیس بیشتری دارد، اما همچنان متعادل است. بزرگترین مشکل این است که شما کنترل کامل EQ را ندارید، فقط می توانید از پیش تنظیم های خاصی از برنامه Momentum انتخاب کنید. ANC عالی است، اما در مقایسه با رقابت سونی و بوز مناسب نیست. جایی که رقیب خود را شکست می دهد، کدک هایی است که پشتیبانی می کند، از جمله کدک های AAC، AptX، AptX Adaptive و SBC. این به معنای کیفیت صدای بهتر برای دستگاه های اندرویدی نسبت به گزینه های سونی یا بوز است. باتری قدرتمند است و در سطح متوسط ​​به حدود 60 ساعت آب می"}, {"source": "Lifehacker", "title": "How to Prepare Now so the End of Daylight Saving Time Is Less Jarring", "link": "https://lifehacker.com/how-to-prepare-now-for-time-change?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Sadly, we did not manage to abolish Daylight Saving time changes during that brief, hopeful moment a few years back, so in just a few weeks we will all be going ahead with our usual ritual: Wake up early, forgetting that the time changed during the night, then get confused when the time on our phone doesn t match the one on the microwave. Here s how to be a little more prepared. Know exactly when daylight saving time ends Daylight saving time is what we call the time in summer, and yes, it s daylight saving time, singular. This time actually gets its own time zone abbreviation : EDT (Eastern Daylight Time) instead of EST (Eastern Standard Time) on the east coast, with corresponding CDT, MDT, and PDT across the country. So in November we change from daylight time to standard time. Specifically, daylight saving time ends at 2 a.m. on Sunday, Nov. 1, 2026. That s when the clocks fall back. (In the spring, they \"spring forward\" get it?) If you re changing your clocks manually, 2 a.m. becomes 1 a.m. This means that if you re used to waking up at 7 a.m., you ll open your eyes after sleeping the usual amount of time to find that it is now 6 a.m. Decide how to spend your extra hour The fall time change is a great moment for me, a night owl. When I was younger I would be thrilled to stay up an extra hour and still not feel excessively tired in the morning. These days, I m more likely to use the time change as an assist to my morning routine . I ll be up at 6:30 (for example) instead of 7:30, and I can get in an early workout or do some journaling. If you re more of a morning person, this may be a bit less pleasant. You re going to fall asleep watching TV in the evening earlier than you usually do, anyway. Maybe you should try to stay up a bit, to get a head start on shifting your routine an hour later. Start adjusting pets' and kids' schedules now For the creatures in your house who are blissfully ignorant of the concept of standardized time, routines are about to get a little weird. Most importantly: They ll get hungry (and everything else) an hour earlier than usual. If you think ahead, you can start moving breakfast time later, before the time change arrives. Instead of feeding your dog at 7, start feeding him at 7:15 now , and you ll be less likely to get a cold nose in the face at 6 a.m. (Since we have about two weeks from this writing, you can shift the time to 7:30 after a few days, and then 7:45. You get the", "date_str": "2026-10-19T18:30:00+00:00", "hash": "4212520ca5da715d", "title_fa": "چگونه اکنون آماده شویم تا پایان ساعت تابستانی کمتر دچار مشکل شود", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. متأسفانه، ما نتوانستیم تغییرات ساعت تابستانی را در آن لحظه کوتاه و امیدوارکننده چند سال پیش لغو کنیم، بنابراین فقط در چند هفته دیگر همه ما به آیین همیشگی خود ادامه خواهیم داد: زود بیدار شوید، فراموش کنید که ساعت در طول شب تغییر کرده است، سپس وقتی ساعت تلفن ما با ساعت مایکروویو مطابقت ندارد، گیج می شویم. در اینجا نحوه آمادگی کمی بیشتر آمده است. دقیقاً بدانید که چه زمانی ساعت تابستانی به پایان می‌رسد. این زمان در واقع مخفف منطقه زمانی خود را دارد: EDT (ساعت روشنایی شرقی) به جای EST (ساعت استاندارد شرقی) در ساحل شرقی، با CDT، MDT و PDT متناظر در سراسر کشور. بنابراین در ماه نوامبر از زمان روشنایی روز به ساعت استاندارد تغییر می کنیم. به طور خاص، ساعت تابستانی در ساعت 2 بامداد یکشنبه، 1 نوامبر 2026 به پایان می رسد. آن وقت است که ساعت ها عقب می افتند. (در فصل بهار، آن‌ها آن را «بهار جلو» می‌گیرند؟) اگر دوباره ساعت‌های خود را به صورت دستی تغییر دهید، ساعت 2 بامداد تبدیل به 1 بامداد می‌شود. این بدان معناست که اگر عادت دارید ساعت 7 صبح از خواب بیدار شوید، پس از زمان معمول خواب چشمان خود را باز خواهید کرد تا متوجه شوید که اکنون ساعت 6 صبح است. وقتی جوانتر بودم از اینکه یک ساعت بیشتر بیدار بمانم هیجان زده می شدم و هنوز هم در صبح احساس خستگی مفرط نمی کردم. این روزها، بیشتر احتمال دارد از تغییر ساعت به عنوان کمکی برای برنامه صبحگاهی خود استفاده کنم. من به جای ساعت 7:30 ساعت 6:30 بیدار می شوم (مثلاً) و می توانم زودتر تمرین کنم یا کمی یادداشت کنم. اگر بیشتر یک فرد صبحگاهی هستید، این ممکن است کمی کمتر خوشایند باشد. به هر حال شب"}, {"source": "Lifehacker", "title": "How I'm Using the Time Change to Kickstart My Morning Exercise Routine", "link": "https://lifehacker.com/use-the-time-change-to-kickstart-a-morning-exercise-routine?utm_medium=RSS", "summary": "We may earn a commission from links on this page. I look forward to the fall time change every year, because I have plans for that extra morning hour. Turning back the clock is a perfect opportunity to kick-start a morning routine, since you can get up an hour early without it feeling like you're getting up an hour early. We are, unfortunately, still doing clock changes twice a year . But I will take advantage of that fact while I can, because the fall time change gifts us with an extra hour in the morning, even if it is cruelly ripped from our evening routines. I'm not a morning person by nature, but my day always goes better when I get my workout in early, so I'm going to take that extra morning hour and use it for a workout instead of recalibrating my body clock to wake up later. I recommend all my fellow night owls do the same. When to wake up if you're taking advantage of the time change I mean, you could use your extra hour to sleep in take it if you need it. But personally, I'm going to set my alarm an hour earlier than I get up, starting on Nov. 1, the first day of standard time for 2026. An hour is enough time for a simple strength workout or for a short run and a quick shower before officially starting your day. I reserve one day a week for sleeping in, which for me is Saturday. On days I'm resting from exercise, I'll still wake up on schedule but use my morning hour for something fun or relaxing, like reading a book. If you want to fit a full workout in and need more time than the hour gives you, this is still a good way to soften the blow. For example, you can wake up 90 minutes earlier (according to the clock) with it only feeling 30 minutes earlier than usual (according to your circadian rhythms). I've been using my extra hour a little differently each year, depending on how committed I am to those morning workouts. This year, I may split it between extra sleep and a mini workout. How to plan for morning workouts On the first day you wake up \"early,\" things will be much as they always are. But now that you're becoming a morning exerciser, you'll have to come to terms with the winter darkness. It will creep in, sunrise getting a few minutes later each day, until your morning jog is, most likely, fully in the dark. If you are running in the early mornings, definitely get yourself a light to help you see and be seen. I have a Petzl Tikkina , which I bought a few years back because Petzl has a reputation for reliability, and the Tikkina is one of", "date_str": "2026-10-19T18:00:00+00:00", "hash": "cef161a53bf6ebd3" title": "10 Hacks Every AllTrails User Should Know", "link": "https://lifehacker.com/tech/hacks-every-alltrails-user-should-know?utm_medium=RSS", "summary": "AllTrails is a popular tool for finding walking, hiking, running, and biking routes around the world. You can use it to locate trails and check user reviews, but the app has plenty of features for customizing activities, tracking conditions, and navigating (safely) in real time. Here are the tips and tricks to get the most out of AllTrails. Scrub the elevation chart to find hill grades and obstacles The elevation map is useful for visualizing total gain and loss on your route, but you can scrub the chart on mobile to see exactly where climbs or obstacles are on the map. For example, you can see where the grade increases (and what the percentage is) or how far you are from stream crossings or switchbacks. Open the map from the trail page or the Navigate function and drag your finger across the elevation profile to track the location marker on the map. Stack AllTrails search filters to find less traveled trails You may be most likely to search for trails based on length and difficulty as well as location, but AllTrails has a wealth of filters to find routes with specific features, or that are dog- or kid-friendly. You can also use filters to identify trails that are likely to be less crowded (though if a route is on AllTrails, it certainly isn't a secret). In the Search window, tap All to open available filters. Select Not very busy under Visitation and Loop under Route type (out-and-back trails can feel busier). Select a rating and add any other requirements, then hit Show trails . Reverse engineer custom routes from other hikers completed activities When you use AllTrails to log an activity or write a review, a map of your track is saved to the trail listing and visible to other users. You can disable this in Settings Privacy settings Content but even if you don't display your activity, you can use those that are public to find custom routes that string multiple trails together or add a ridgeline not included in the official AllTrails track. Scroll down to the reviews section and tap the activities link to pull up maps of completed activities. Note, though, that some variations in routes may not be actual detours, and you should still follow Leave No Trace principles and stay within your skill level when it comes to difficulty. Connect an REI membership to get a discounted AllTrails subscription A free AllTrails account will get you most of the service's basic features, but you have to pay for a Plus subscription $35.99 per year for things like offline map", "date_str": "2026-10-19T15:30:57+00:00", "hash": "19acc59a20057d6f", "title_fa": "10 هک که هر کاربر AllTrails باید بداند", "summary_fa": "AllTrails یک ابزار محبوب برای یافتن مسیرهای پیاده روی، پیاده روی، دویدن و دوچرخه سواری در سراسر جهان است. می‌توانید از آن برای تعیین مکان مسیرها و بررسی نظرات کاربران استفاده کنید، اما این برنامه دارای ویژگی‌های زیادی برای سفارشی کردن فعالیت‌ها، ردیابی شرایط و پیمایش (ایمن) در زمان واقعی است. در اینجا نکات و ترفندهایی برای استفاده حداکثری از AllTrails وجود دارد. نمودار ارتفاع را تمیز کنید تا درجات و موانع تپه را بیابید نقشه ارتفاع برای تجسم سود و زیان کل در مسیر شما مفید است، اما می‌توانید نمودار را روی موبایل تمیز کنید تا ببینید دقیقاً کجا صعود یا موانع روی نقشه قرار دارند. به عنوان مثال، می‌توانید ببینید که نمره کجا افزایش می‌یابد (و درصد آن چقدر است) یا چقدر از گذرگاه‌های جریان یا سوئیچ‌بک فاصله دارید. نقشه را از صفحه دنباله یا تابع پیمایش باز کنید و انگشت خود را روی نمایه ارتفاع بکشید تا نشانگر موقعیت را روی نقشه ردیابی کنید. فیلترهای جستجوی AllTrails را روی هم قرار دهید تا مسیرهای کمتری را پیدا کنید که ممکن است به احتمال زیاد مسیرهایی را بر اساس طول و دشواری و همچنین مکان جستجو کنید، اما AllTrails دارای فیلترهای زیادی برای یافتن مسیرهایی با ویژگی‌های خاص یا مناسب برای سگ یا بچه است. همچنین می‌توانید از فیلترها برای شناسایی مسیرهایی که احتمالاً شلوغ‌تر هستند استفاده کنید (اگرچه اگر مسیری در AllTrails باشد، مطمئناً یک راز نیست). در پنجره جستجو، روی همه ضربه بزنید تا فیلترهای موجود باز شوند. در قسمت بازدید، گزینه Not very busy و Loop را در نوع مسیر انتخاب کنید (مسیرهای بیرون و عقب شلوغ تر می شوند). رتبه‌بندی را انتخاب کنید و سایر موارد مورد نیاز را اضافه کنید، سپس روی Show trails کلیک کنید. مهندسی معکوس مسیرهای سفارشی از دیگر کوهنوردان فعالیت های تکمیل شده هنگامی که از AllTrails برای ثبت"}, {"source": "Lifehacker", "title": "I Tried the 'Normatec Go' Compression Boots, and My Calves Have Never Felt Better", "link": "https://lifehacker.com/health/i-tried-the-normatec-go-compression-boots-and-my-calves-feel-great?utm_medium=RSS", "summary": "We may earn a commission from links on this page. If you've ever been on your feet all day and your calves felt like two sandbags, you know how tough it can be to find relief. I'm a marathon runner, so I know it well. Training blocks mean high mileage, and calves take a beating on every mile. I've tried foam rollers, massage guns, stretching, and my favorite maneuver: lying with my legs up against the wall . This week's upgrade is the first recovery tool that seems to do all the work for me, and hey after a long run, I'm not complaining. It's my first foray into compression boots: the Hyperice Normatec Go . Hyperice Normatec Go Calf - Recovery System with Patented Dynamic Compression Massage Technology (Normatec Go) FSA-HSA Approved $379.00 at Amazon Shop Now Shop Now $379.00 at Amazon How the Normatec Go compression boots work The Normatec Go is a pair of wearable compression sleeves that wrap around your calves and give you a dynamic air compression massage. Hyperice describes it as a fully portable version of its Normatec line, which pro athletes and recovery rooms have used for years. The sleeves inflate and deflate in a pulsing pattern (as opposed to just squeezing constantly). Hyperice calls this compression \"gapless\": There are three overlapping zones of 360-degree compression working through the calf. In theory, the wave of pressure helps push fluid and blood through your lower legs, which is why Hyperice says the massage increases circulation and reduces tension and swelling. Hyperice also points out that the calf is often called the body's \"second heart\" because it helps push blood back up from your lower legs. That matches my experience: After a long run, calves are where the heaviness and tightness show up first. Why I recommend these compression boots The biggest upgrade over traditional compression boots is that you don't need to set up a whole system. You strap on the sleeves, open the app, pick an intensity, and relax. I've worn them at my desk, on the couch, and while answering emails after a long run. I show up to my next run feeling fresher, and for a marathon runner, that's the whole point of recovery. A few features make the experience better: Seven compression levels (40 to 200 mmHg), so you can go gentle after an easy run or firm after a long one The two sleeves always stay in sync for a symmetrical massage Bluetooth control through the Hyperice app, so you adjust everything from your phone 1.2 pounds total, and TSA friendly, so they", "date_str": "2026-10-19T15:00:55+00:00", "hash": "a90fbfa46b4b8f3e", "title_fa": "من چکمه‌های فشرده‌سازی «Normatec Go» را امتحان کردم و گوساله‌هایم هرگز بهتر نشدند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اگر تا به حال تمام روز روی پاهای خود بوده اید و گوساله های شما مانند دو کیسه شن احساس می کنند، می دانید که یافتن آرامش چقدر می تواند سخت باشد. من یک دونده ماراتن هستم، بنابراین آن را خوب می دانم. بلوک های تمرینی به معنای مسافت پیموده شده زیاد است و گوساله ها در هر مایل ضرب و شتم می کنند. من غلتک های فوم، تفنگ های ماساژ، کشش و مانور مورد علاقه ام را امتحان کرده ام: دراز کشیدن با پاهایم به دیوار. ارتقای این هفته اولین ابزار ریکاوری است که به نظر می رسد همه کارها را برای من انجام می دهد و هی بعد از مدت ها شکایتی ندارم. این اولین تلاش من برای چکمه های فشرده سازی است: Hyperice Normatec Go. Hyperice Normatec Go Calf - سیستم بازیابی با فناوری ماساژ فشرده سازی پویا ثبت شده (Normatec Go) FSA-HSA تایید شده 379.00 دلار در آمازون همین حالا خرید کنید 379.00 دلار در آمازون. ماساژ فشرده سازی Hyperice آن را به عنوان یک نسخه کاملاً قابل حمل از خط Normatec خود توصیف می کند که ورزشکاران حرفه ای و اتاق های ریکاوری سال ها از آن استفاده می کردند. آستین ها به صورت ضربانی باد و باد می شوند (بر خلاف فشار دادن مداوم). Hyperice این فشرده‌سازی را «بدون شکاف» می‌نامد: سه ناحیه با هم تداخل دارند با فشرده‌سازی 360 درجه که از طریق ساق پا کار می‌کنند. در تئوری، موج فشار کمک می کند تا مایع و خون را از طریق ساق پاهای شما عبور دهد، به همین دلیل است که هایپریس می گوید ماساژ گردش خون را افزایش می دهد و تنش و تورم را کاهش می دهد. Hyperice همچنین اشاره می کند که گوساله اغلب به عنوان \"قلب دوم\" بدن"}],
      media: [{"source": "Billboard", "title": "Bruno Mars Breaks Record for Most Weeks at No. 1 on Hot R&B/Hip-Hop Songs Chart", "link": "https://www.billboard.com/music/chart-beat/bruno-mars-i-just-might-break-record-number-1-rb-songs-chart-1236363456/", "summary": "Delayed, but not denied. Following a brief interruption from Drake and Don Toliver’s “Solar Eclipse” on the Oct. 17 chart, Bruno Mars ’ “I Just Might” returns to the No. 1 spot on Billboard ’s Hot R B/Hip-Hop Songs chart (dated Oct. 24) to clock a record-breaking 32nd week at the summit, officially the longest in the chart’s history, which started in October 1958. Related Bruno Mars Asks Karol G to Dance With Me in New Music Video Bruno Mars Soundtracks Lakers Star Ziaire Williams SoFi Stadium Proposal With Live Marry You Performance ROSÉ Gets Her Angel Baby Cam Wings at Bruno Mars Los Angeles Concert “I Just Might,” on Atlantic Records, takes the title from Kendrick Lamar and SZA’s “Luther,” which enjoyed a 31-week stay on top in 2025. For its record-breaking coronation on the multimetric Hot R B/Hip-Hop Songs chart, “I Just Might” registered 5.03 million official streams, 51.9 million in airplay audience and 1,000 song sales in the United States for the tracking week of Oct. 9-15, according to Luminate. As the leaderboard shuffles, here’s a review of the longest-leading No. 1s on Hot R B/Hip-Hop Songs, which was established as a standard, all-encompassing chart in October 1958: Weeks at No. 1, Song Title, Artist, Year(s) at No. 1 32, “I Just Might,” Bruno Mars, 2026 31, “Luther,” Kendrick Lamar SZA, 2024-25 22, “Not Like Us,” Kendrick Lamar, 2024-25 21, “Kill Bill,” SZA, 2022-23 20, “Old Town Road,” Lil Nas X feat. Billy Ray Cyrus, 2019 18, “One Dance,” Drake feat. Wizkid Kyla, 2016 18, “Industry Baby,” Lil Nas X Jack Harlow, 2021-22 16, Blurred Lines, Robin Thicke feat. T.I. + Pharrell, 2013 16, “Mutt,” Leon Thomas, 2025 Notably, the record has changed hands several times in the last few years, reflecting a landscape in which big hits become entrenched in consistent streaming performance and radio airplay cycles that led to extensive, chart-topping runs. In 2026, at least two other main Billboard charts — the all-genre Hot 100 and the Hot Latin Songs chart — have crowned new all-time record-holders in Ella Langley’s “ Choosin’ Texas ” and Bad Bunny’s “ DTMF ,” respectively. (Streaming data has been incorporated into the chart since October 2012.) “I Just Might” debuted at No. 1 on the ranking dated Jan. 24 and marked Mars’ fifth Hot R B/Hip-Hop Songs leader, following “That’s What I Like” (2017), a pair of Cardi B collaborations in “Finesse” (2018) and “Please Me” (2019) and “Leave the Door Open” (2021) by Silk Sonic, his venture with Anderson .Paak. Si", "date_str": "2026-10-20T14:25:39+00:00", "hash": "7b407b3fb8d8c39b", "title_fa": "برونو مارس رکورد بیشترین هفته‌ها را شکست و در رتبه اول جدول آهنگ‌های داغ R&B/Hip-Hop قرار گرفت.", "summary_fa": "با تأخیر، اما تکذیب نشد. پس از وقفه‌ای کوتاه از «خورشید گرفتگی» از دریک و دان تولیور در نمودار 17 اکتبر، «I Just Might» برونو مارس به رتبه اول جدول آهنگ‌های Hot R B/Hip-Hop بیلبورد (به تاریخ 24 اکتبر) بازمی‌گردد تا رکورد طولانی‌ترین رکورد را در هفته سوم ثبت کند. تاریخچه نمودار که در اکتبر 1958 آغاز شد. برونو مارس از کارول جی می‌خواهد تا با من در موزیک ویدیوی جدید برقصد. اقامت 31 هفته ای در اوج در سال 2025. بر اساس گزارش لومینیت، «I Just Might» برای رکوردشکنی خود در چارت چند متری Hot R B/Hip-Hop Songs، 5.03 میلیون استریم رسمی، 51.9 میلیون مخاطب پخش و 1000 آهنگ در ایالات متحده برای هفته پیگیری 9 تا 15 اکتبر به ثبت رساند. همانطور که تابلوی امتیازات به هم می‌ریزد، در اینجا مروری بر طولانی‌ترین رتبه‌های پیشرو در آهنگ‌های Hot R B/Hip-Hop است که به عنوان یک نمودار استاندارد و فراگیر در اکتبر 1958 ایجاد شد: هفته‌ها در رتبه اول. 1، عنوان آهنگ، هنرمند، سال(های) شماره 1 32، «I Just Might»، Bruno Mars، 2026 31، «Luther»، Kendrick Lamar SZA، 2024-25 22، «Not Like Us»، Kendrick Lamar، 2024، «23-25Kill» 20، «جاده شهر قدیمی»، شاهکار لیل ناس ایکس. بیلی ری سایرس، 2019 18، «یک رقص»، شاهکار دریک. Wizkid Kyla، 2016 18، \"Industry Baby\"، Lil Nas X Jack Harlow، 2021-22 16، Blurred Lines، Robin Thicke feat. T.I. + فارل، 2013 16، «مات»، لئون توماس، 2025 قابل توجه است که رکورد در چند سال گذشته چندین بار تغییر کرده است، که منعکس کننده منظره‌ای است که در آن موفقیت‌های بزرگ در اجرای مداوم جریان و چرخه پخش رادیویی تثبیت شده‌اند که منجر به پخش‌های گسترده و پرطرفدار در نمودار شد."}, {"source": "Billboard", "title": "‘KPop Demon Hunters’ Extends Record for Most Weeks at No. 1 on Billboard’s Soundtracks Chart: Full List", "link": "https://www.billboard.com/lists/billboard-top-soundtracks-chart-most-weeks-no-1-full-list/", "summary": "KPop Demon Hunters has slayed on Billboard ’s Soundtracks chart, having amassed 65 weeks at No. 1 – a new, all-time record. So, we thought it would be a good time to look at the 12 soundtracks that have led the chart for 25 weeks or more. This chart was introduced a little more than 25 years ago – on June 30, 2001 – which means our list of soundtracks with the most weeks at No. 1 doesn’t include blockbuster soundtracks of previous eras, such as West Side Story, The Sound of Music, Doctor Zhivago, Saturday Night Fever and Purple Rain . Actually, it does include one – The Vince Guaraldi Trio ’s 1965 TV soundtrack, A Charlie Brown Christmas – but only because of its chart success since 2001. KPop Demon Hunters has been No. 1 for all but four of its 69 weeks on Top Soundtracks, having yielded for one week each to Wicked: For Good , the holiday perennial A Charlie Brown Christmas , Charli xcx ’s Wuthering Heights and the soundtrack to this year’s most-talked about TV miniseries, Heated Rivalry . Related Golden From KPop Demon Hunters Wins Best Original Song at 2026 Oscars, But Speech Is Cut Short Here are the 12 soundtracks that have logged the most weeks at No. 1 on Billboard ’s Soundtracks chart since the chart was introduced on June 30, 2001. The list includes two TV soundtracks and 10 film soundtracks. Notably, the five soundtracks with the most weeks at No. 1 are all from animated films. The number in each header is the number of weeks the album has spent at No. 1. They are listed in ascending order.", "date_str": "2026-10-20T14:15:00+00:00", "hash": "484ce893175239ba", "title_fa": "«KPop Demon Hunters» رکورد بیشترین هفته‌ها را در رتبه اول جدول موسیقی متن بیلبورد افزایش داد: فهرست کامل", "summary_fa": "KPop Demon Hunters در جدول موسیقی متن بیلبورد شکست خورده است و 65 هفته در رتبه اول قرار گرفته است - یک رکورد جدید و تمام دوران. بنابراین، ما فکر کردیم که زمان خوبی است که به 12 موسیقی متنی که به مدت 25 هفته یا بیشتر در جدول پیشرو بوده اند نگاه کنیم. این نمودار کمی بیش از 25 سال پیش - در 30 ژوئن 2001 - معرفی شد که به این معنی است که فهرست موسیقی‌های متن ما با بیشترین هفته در رتبه اول. 1 شامل موسیقی متن‌های پرفروش دوره‌های قبلی، مانند داستان وست ساید، صدای موسیقی، دکتر ژیواگو، تب شنبه شب و باران بنفش نیست. در واقع، شامل یکی - موسیقی متن فیلم تلویزیونی 1965 Vince Guaraldi Trio، A Charlie Brown Christmas - است، اما فقط به دلیل موفقیت در نمودار از سال 2001. KPop Demon Hunters رتبه اول را کسب کرده است. 1 برای همه به جز چهار هفته از 69 هفته آن در Top Soundtracks، که هر یک به مدت یک هفته به Wicked: For Good، کریسمس چند ساله تعطیلات A Charlie Brown Christmas، Charli xcx's Wuthering Heights و موسیقی متن فیلم مینی سریال تلویزیونی پرمحبوب ترین سریال امسال، Heated Rivalry، ارائه شده است. طلایی مرتبط از KPop Demon Hunters برنده بهترین آهنگ اصلی در اسکار 2026 شد، اما Speech Is Cut Short در اینجا 12 موسیقی متن فیلم که بیشترین هفته ها را در رتبه اول ثبت کرده اند آورده شده است. از زمان معرفی نمودار در 30 ژوئن 2001، رتبه 1 در جدول موسیقی متن بیلبورد. این فهرست شامل دو موسیقی متن تلویزیون و 10 موسیقی متن فیلم است. قابل ذکر است، پنج موسیقی متن با بیشترین هفته در رتبه 1، همه از فیلم های انیمیشن هستند. تعداد در هر هدر تعداد هفته هایی است که آلبوم در شماره 1 سپری کرده است."}, {"source": "Billboard", "title": "Signed: Randy Rogers Band Inks With Miranda Lambert’s Big Loud Texas; Marc Scibilia Flies With Concord", "link": "https://www.billboard.com/lists/randy-rogers-band-signs-miranda-lambert-label-artist-deals/", "summary": "Randy Rogers Band partnered with Big Loud Texas for the release of their upcoming album Songbook . The label imprint was founded by Miranda Lambert and Jon Randall in 2023, in partnership with Big Loud Records. “Can’t begin to describe how excited and honored Big Loud Texas is to partner with Randy and the guys for the release of Songbook, Big Loud Texas partner Randall said in a statement. The collaborations on this album speak to Randy’s legacy and the impact he has had on Texas music and beyond. I can’t wait for everyone to hear this record. Related Publishing Briefs: Leader Entertainment and Sony Music Publishing Form Strategic Partnership Isabela Raygoza , Ariel King , Jessica Nicholson The first release off Songbook , out now, is a reimagined version of the track “Tommy Jackson” featuring Parker McCollum. The album is slated for release on Jan. 22. Randy Rogers Band will tour across Texas throughout the fall, with 2027 tour dates to be announced soon. — Jessica Nicholson Concord Records signed singer-songwriter Marc Scibilia . The first release under the deal, By Your Side with Abigail Rose, is out now. His next studio album is due next year. As a songwriter and producer, Scibilia has worked with Teddy Swims, Keith Urban, Lainey Wilson and more; he supported Swims on tour this summer. He s managed by Patrick Flanagan at Maverick. — Chris Eggertsen Star Moles Louise Sullivan Star Moles , the Philadelphia-based project of Emily Moales, signed to Dead Oceans . The label will release her new album, Highway to Hell , on vinyl for the first time on Dec. 4. Her new single, Born Again, was released earlier this month. She s set to embark on a North American headlining tour in January. — Chris Eggertsen Read further for additional artist signings.", "date_str": "2026-10-20T14:00:00+00:00", "hash": "cade8660121400a5", "title_fa": "امضا: رندی راجرز گروه جوهر با میراندا لمبرت با صدای بلند تگزاس. مارک سیبیلیا با کنکورد پرواز می کند", "summary_fa": "رندی راجرز باند با بیگ لود تگزاس برای انتشار آلبوم آتی Songbook شریک شدند. این برچسب توسط میراندا لمبرت و جان راندال در سال 2023 و با مشارکت Big Loud Records تأسیس شد. راندال، شریک بیگ لود تگزاس، در بیانیه ای گفت: «نمی توانم شروع کنم و توصیف کنم که بیگ لود تگزاس چقدر هیجان زده و افتخارآمیز است که با رندی و بچه ها برای انتشار کتاب آهنگ شریک شده است. همکاری در این آلبوم از میراث رندی و تأثیری که او بر موسیقی تگزاس و فراتر از آن داشته است صحبت می کند. من نمی توانم منتظر بمانم تا همه این رکورد را بشنوند. خلاصه‌های مربوط به انتشار: لیدر انترتینمنت و سونی موزیک انتشارات فرم مشارکت استراتژیک Isabela Raygoza، Ariel King، Jessica Nicholson اولین نسخه Songbook که اکنون منتشر شده است، نسخه بازسازی‌شده آهنگ «تامی جکسون» با حضور پارکر مک‌کولوم است. این آلبوم برای انتشار در 22 ژانویه برنامه ریزی شده است. گروه رندی راجرز در طول پاییز در سراسر تگزاس تور خواهند داشت و تاریخ تورهای 2027 به زودی اعلام خواهد شد. - جسیکا نیکلسون کنکورد رکوردز با مارک سیبیلیا خواننده و ترانه سرا قرارداد امضا کرد. اولین نسخه تحت قرارداد، در کنار شما با ابیگیل رز، اکنون منتشر شده است. آلبوم استودیویی بعدی او سال آینده منتشر می شود. به عنوان ترانه سرا و تهیه کننده، سیبیلیا با تدی سوئیمز، کیت اوربان، لینی ویلسون و غیره کار کرده است. او تابستان امسال در تور Swims حمایت کرد. او توسط پاتریک فلانگان در ماوریک مدیریت می شود. — Chris Eggertsen Star Moles Louise Sullivan Star Moles، پروژه فیلادلفیا Emily Moales، با Dead Oceans قرارداد امضا کرد. این لیبل آلبوم جدید خود را به نام بزرگراه به جهنم برای اولین بار در 4 دسامبر بر روی وینیل منتشر خواهد کرد. تک آهنگ جدید او، دوباره متولد شد، اوایل"}, {"source": "Billboard", "title": "‘Kpop Demon Hunters’ Singer EJAE Marries Music Producer Samuel Kim in Seoul", "link": "https://www.billboard.com/culture/lifestyle/ejae-kpop-demon-hunters-marries-producer-samuel-kim-seoul-1236363438/", "summary": "KPop Demon Hunters Golden vocalist EJAE married her longtime fiancé music producer Samuel Kim on Saturday (Oct. 17) in Seoul, South Korea. According to Vogue , the ceremony was infused with nods to the couple s heritage and kicked off with a Paebaek ceremony , a centuries-old Korean tradition that originally served as a welcome for the bride into the groom s family. Related Kim Petras Slams Gross Commentary on Hunter Schafer s Bottom Surgery, Says It Proves How Trans Women Get Fetishized EJAE Says An Unsmiling Leonardo DiCaprio Made Her Super Nervous During Golden Performance at 2026 BAFTAs EJAE, Teyana Taylor, Jacob Elordi More Invited to Join Motion Picture Academy The ceremony and welcome party took place at the Korean fusion restaurant Congdu50, which has sweeping views of the capital city. Not everyone does Paebaek, but we wanted to have that traditional element as part of our wedding,” EJAE told the magazine. The couple then exchanged vows on Saturday at Stage 28, a venue whose origin story had deep meaning for EJAE, as her grandparents lived in the house on the venue property when she was a girl. I spent much of my childhood exploring the garden and walking with my grandfather in the hills behind the house, she explained of the home and property that were later turned into an event venue, where EJAE s brother also got married. The singer reposted a gallery of photos from the event on Instagram on Monday (Oct. 19), opening with a snap of the happy couple raising their arms in joy as they walk down the aisle after the ceremony. The bride wore a custom Daniele Frankel white tulle gown with a strapless neckline, a bubbled hem and a nude chiffon layer that Vogue said was in keeping with the singer s desire for a dress that would be ethereal, modern, chic and timeless with a twist. She accented the gown with heirloom jewelry passed down from her grandmother to her mother. For the party, EJAE changed into a custom Zac Posen chiffon dress and, later in the night, a shimmery Milla Nova mini dress for dancing. The groom wore a bespoke double-breasted black tuxedo from Bhambi s Custom Tailors in New York, as well as a custom white tuxedo by Posen for the reception. The couple wore traditional Korean ceremonial garments for their Paebaek ceremony. Their love story began in 2017 when they were set up by a mutual friend for a songwriting session at Kim s home studio. “We worked on a couple of songs, but mostly, we just connected,” Ejae told the fashion magazine a", "date_str": "2026-10-20T13:37:27+00:00", "hash": "8d63051d0c275744", "title_fa": "خواننده \"Kpop Demon Hunters\" EJAE با ساموئل کیم تهیه کننده موسیقی در سئول ازدواج کرد.", "summary_fa": "خواننده طلایی KPop Demon Hunters EJAE با نامزد قدیمی خود ساموئل کیم تهیه کننده موسیقی در روز شنبه (17 اکتبر) در سئول، کره جنوبی ازدواج کرد. به گفته Vogue، این مراسم با اشاره به میراث زوجین همراه بود و با یک مراسم Paebaek آغاز شد، یک سنت قرن ها کره ای که در ابتدا به عنوان استقبال عروس از خانواده داماد بود. کیم پتراس درباره جراحی پایین شکارچی شفر اظهار نظر بزرگی را مورد انتقاد قرار می‌دهد و می‌گوید این نشان می‌دهد که زنان ترنس چگونه بت‌شناخته می‌شوند. و مهمانی خوش آمدگویی در رستوران فیوژن کره ای Congdu50 برگزار شد که مناظر وسیعی از پایتخت دارد. همه افراد Paebaek را انجام نمی دهند، اما ما می خواستیم آن عنصر سنتی را به عنوان بخشی از عروسی خود داشته باشیم.» این زوج در روز شنبه در Stage 28، محلی که داستان اصلی آن معنای عمیقی برای EJAE داشت، ادای نذر کردند، زیرا پدربزرگ و مادربزرگش در زمانی که او دختر بود در خانه ای در ملک محل برگزاری زندگی می کردند. من بیشتر دوران کودکی‌ام را به کاوش در باغ و قدم زدن با پدربزرگم در تپه‌های پشت خانه گذراندم، او درباره خانه و اموالی توضیح داد که بعداً به محل برگزاری رویداد تبدیل شد و برادر EJAE نیز در آنجا ازدواج کرد. این خواننده روز دوشنبه (19 اکتبر) یک گالری از عکس‌های این مراسم را در اینستاگرام بازنشر کرد که با عکسی از این زوج خوشبخت در حالی که بعد از مراسم در راهرو قدم می‌زنند، دست‌هایشان را با خوشحالی بالا می‌برند. عروس یک لباس پارچه توری سفید سفارشی دانیله فرانکل با یقه بدون بند، لبه های حباب دار و یک لایه ابریشمی برهنه پوشیده بود که به گفته ووگ با تمایل خواننده برای لباسی که اثیری، مدرن، شیک و جاودانه با پیچ و تاب باشد مطابقت داشت. او لباس"}, {"source": "Billboard", "title": "Recording Academy Chief Harvey Mason jr. Elected to Paley Los Angeles Board of Governors", "link": "https://www.billboard.com/pro/harvey-mason-jr-paley-los-angeles-board-of-governors/", "summary": "Harvey Mason jr. , CEO of the Recording Academy MusiCares, has been elected to The Paley Center for Media’s Los Angeles board of governors. “Music and media have the power to make us feel seen, open our minds, and connect us like nothing else can,” Mason said in a statement. “That power comes from people with a story to tell and the courage to create. I’m honored to join the Paley Center’s Los Angeles board of governors and help champion those voices, celebrate the work that has shaped our lives, and inspire the next generation to leave their own mark.” Related Harvey Mason jr. on 2,300 New Grammy Voting Members, the Asian Pop Category Uproar More: ‘We Want To Bring More People Into the Tent’ The Paley Center for Media also announced four additions to its board of trustees: David Ellison , chairman CEO, Skydance; Roger Lynch , chairman and CEO, Mattel, Inc.; Dina Powell McCormick , president and vice chairman, Meta; and Chris Winfrey , president CEO, Charter Communications. “We are privileged to welcome this renowned group of exceptional and distinguished leaders to Paley’s board of trustees and Los Angeles board of governors,” Maureen J. Reidy , president CEO of The Paley Center for Media, said in a statement. “Their visionary leadership, innovative insights, and extraordinary expertise will further strengthen Paley’s standing as the media industry’s preeminent nonprofit cultural institution.” The Paley Center’s board of trustees, chaired by Frank A. Bennack, Jr. , executive vice chairman and former CEO of Hearst, offers guidance in support of the organization s mission to lead the conversation around today s rapidly evolving media landscape. The Los Angeles board of governors advises the Paley Center on its strategic goals and Los Angeles programming calendar, which includes PaleyFest LA and the Paley Archive at the Beverly Hills Public Library. The L.A. board of governors includes two of the top producers of awards shows and other live variety programming: Jesse Collins of Jesse Collins Entertainment and Connie Orlando of BET Networks. Collins has been one of the executive producers of the Grammy Awards (along with Ben Winston and Raj Kapoor ) for many years. Collins has two Primetime Emmys for outstanding variety special (live) as an executive producer of two Super Bowl halftime shows: the 2022 all-star hip-hop show and this year’s show starring Bad Bunny . Other members of the L.A. board of governors are Bela Bajaria ; Kevin Beggs , Lionsgate Televisi", "date_str": "2026-10-20T13:00:00+00:00", "hash": "b1c57465bea3427d", "title_fa": "رئیس آکادمی ضبط، هاروی میسون جونیور. به عضویت شورای حکام پیلی لس آنجلس انتخاب شد", "summary_fa": "هاروی میسون جونیور ، مدیر عامل Recording Academy MusiCares، به عضویت هیئت مدیره The Paley Center for Media’s لس آنجلس انتخاب شد. میسون در بیانیه‌ای گفت: «موسیقی و رسانه‌ها این قدرت را دارند که به ما احساس دیده شدن، باز کردن ذهن‌هایمان و وصل کردنمان را بدهند که هیچ چیز دیگری نمی‌تواند. «این قدرت از افرادی می آید که داستانی برای گفتن و شجاعت خلق کردن دارند. من مفتخرم که به هیئت مدیره لس آنجلس مرکز پالی بپیوندم و به حمایت از این صداها کمک کنم، کاری را که زندگی ما را شکل داده است جشن بگیرم و نسل بعدی را الهام بخشم تا اثری از خود بر جای بگذارند.\" مرتبط هاروی میسون جونیور. در مورد 2300 عضو جدید رای‌دهنده گرمی، دسته پاپ آسیایی سر و صدای بیشتری به پا کرد: «ما می‌خواهیم افراد بیشتری را به چادر بیاوریم» مرکز رسانه‌های پیلی همچنین چهار عضو هیئت امنای خود را اعلام کرد: دیوید الیسون، مدیر عامل Skydance. راجر لینچ، رئیس هیئت مدیره و مدیر عامل شرکت Mattel. دینا پاول مک کورمیک، رئیس و نایب رئیس، متا؛ و کریس وینفری، مدیرعامل شرکت ارتباطات منشور. مورین جی. ریدی، مدیر عامل مرکز رسانه‌های پیلی، در بیانیه‌ای گفت: «ما مفتخریم که از این گروه مشهور از رهبران استثنایی و برجسته در هیئت امنای پیلی و هیئت حکام لس‌آنجلس استقبال کنیم.» رهبری رویایی، بینش‌های نوآورانه و تخصص فوق‌العاده آن‌ها، جایگاه پیلی را به‌عنوان موسسه فرهنگی غیرانتفاعی برجسته صنعت رسانه تقویت می‌کند.» هیئت امنای مرکز پیلی به ریاست فرانک آ. بناک جونیور. ، معاون اجرایی و مدیر عامل سابق هرست، راهنمایی هایی را برای حمایت از مأموریت سازمان برای هدایت گفتگو پیرامون چشم انداز رسانه ای به سرعت در حال تحول امروز ارائه می دهد. هیئت حکام لس آنجلس به مرکز پیلی در مورد اهداف استراتژیک و تقویم برنامه نویسی لس آنجلس، که شامل PaleyFest LA و"}, {"source": "Billboard", "title": "Molly Neuman on the Evolution of Independent Music From the ’90s to Now: ‘It Was a High-Risk Business’", "link": "https://www.billboard.com/pro/cd-baby-molly-neuman-evolution-indie-music-90s-now/", "summary": "Releasing music has never been easier. What is now completed with basically the click of a button via an online distribution service like DistroKid, CD Baby or TuneCore was once a laborious process of trying to convince local stores to stock your records on their shelves one by one. “It was a high-risk business,” Molly Neuman , president of CD Baby, explains. In the early 1990s, as a college student, Neuman formed the now-legendary Riot Grrrl outfit Bratmobile with her friends and navigated the difficulties of making music without major label resources. Simply making a record back then was challenging enough with all the studio and manufacturing costs — let alone getting stores on board to carry it nationwide. Related Questlove on the History of Sampling, From Public Enemy to Today: I See AI as a Parallel to Sampling Culture Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit “The idea that you had to order 2,000 copies and spend $20,000 just to have the records sit on a shelf was [also] real,” Neuman continues. “In many cases the records were returned.” On the latest episode of Billboard On the Record, Neuman joins the show to talk about the evolution of the independent music industry and how the challenges facing artists have shifted since her band got its start in Olympia, Wash., more than three decades ago. To watch the episode, check out the YouTube video below or click here for more viewing and listening options. An edited and condensed excerpt of the conversation can also be found below. I want to start at the beginning of your career, when you were starting Bratmobile. What did it mean to be an independent artist in practice in the early 1990s? What did you have to do to get those records out there? We were interested in playing music as friends, with our friends, and going to shows. The easiest way to go to a show was to play one. It was really more about community, being inspired by our peers and people we admired, and wanting to do what we saw them doing. Because we were women, we were also motivated by the fact that we didn t see as many women onstage or putting on shows, even though we knew they were there. We would literally go to record stores, comb through records, look in the back and see which bands had women in them if they weren t on the cover. That was our path to discovering new artists and being inspired by them, and then realizing that we c", "date_str": "2026-10-20T13:00:00+00:00", "hash": "75747bd702e2119f", "title_fa": "مولی نیومن در مورد تکامل موسیقی مستقل از دهه 90 تا کنون: \"این یک تجارت پرخطر بود\"", "summary_fa": "انتشار موسیقی هرگز آسان تر نبوده است. چیزی که اکنون اساساً با کلیک یک دکمه از طریق یک سرویس توزیع آنلاین مانند DistroKid، CD Baby یا TuneCore تکمیل می‌شود، زمانی یک فرآیند پر زحمت برای متقاعد کردن فروشگاه‌های محلی بود که سوابق شما را در قفسه‌های خود ذخیره کنند. مولی نیومن، رئیس CD Baby، توضیح می دهد: \"این یک تجارت پرخطر بود.\" در اوایل دهه 1990، به عنوان یک دانشجوی کالج، نیومن با دوستانش گروه افسانه‌ای Riot Grrrl Bratmobile را تشکیل داد و مشکلات ساخت موسیقی را بدون منابع اصلی لیبل پشت سر گذاشت. صرفاً ساختن یک آلبوم در آن زمان با تمام هزینه های استودیو و ساخت به اندازه کافی چالش برانگیز بود - چه رسد به اینکه فروشگاه هایی را برای حمل آن در سراسر کشور وارد کنید. Questlove مرتبط در تاریخچه نمونه برداری، از دشمن عمومی تا امروز: من هوش مصنوعی را موازی با فرهنگ نمونه برداری می بینم. 20000 دلار فقط برای گذاشتن رکوردها در قفسه [همچنین] واقعی بود.» نیومن ادامه می دهد. \"در بسیاری از موارد سوابق برگردانده شد.\" در آخرین قسمت Billboard On the Record، نیومن به برنامه می‌پیوندد تا در مورد تکامل صنعت موسیقی مستقل و چگونگی تغییر چالش‌های پیش روی هنرمندان از زمانی که گروهش در المپیا، واشینگتن، بیش از سه دهه پیش شروع به کار کرد، صحبت کند. برای تماشای این قسمت، ویدیوی یوتیوب زیر را بررسی کنید یا برای گزینه‌های بیشتر مشاهده و گوش دادن اینجا را کلیک کنید. گزیده ای از این گفتگو را نیز می توانید در زیر مشاهده کنید. من می خواهم از ابتدای کار شما، زمانی که Bratmobile را راه اندازی می کردید، شروع کنم. در اوایل دهه 1990 هنرمند مستقل بودن در عمل چه معنایی داشت؟ چه کاری باید انجام می دادید تا آن رکوردها را به بیرون برسانید؟ ما به عنوان دوست، با دوستانمان"}, {"source": "Billboard", "title": "‘Don’t Worry,’ Baby, Lady Gaga Hints at New Music on the Horizon", "link": "https://www.billboard.com/music/pop/lady-gaga-hints-new-music-dont-worry-1236363425/", "summary": "It s only been a year since Lady Gaga dropped her sixth studio album, Mayhem . And though Little Monsters had to wait nearly five years between last March s synth pop explosion and its predecessor, 2020 s Chromatica , in a recent TikTok video Mother Monster gave hope that something special could be on its way, and soon. In a clip promoting her Haus Labs cosmetic brand s new brush set on Monday (Oct. 19) — cued to Wham! s Last Christmas — Gaga got busy showing off the various brushes when a fan hopped in the comments and made a desperate plea for fresh tracks. Gaga please don t make us wait long for albums!!!, the fan wrote. We just want music!!! Every albums has been taking longer longer. Gaga was quick to respond with a two-word answer that set Monsters hair on fire: don t worry, she wrote along with two heart emoji. At press time a spokesperson for Gaga could not be reached for comment on when fans can expect new music from the singer. In a chat with The Rolling Stone Studio podcast this week, Mayhem co-executive producer and co-songwriter said that he s in touch with Gaga all the time whenever she sounds the bell, I ll be there, he said. While at press time it was unclear when Gaga, 40, might return to the studio and what project she was hinting it, it s likely she has her hands full with her newborn daughter, Rose Bean Polansky . Though Gaga has not spoken in public yet about the child she and fiancé Michael Polansky welcomed in June, Gaga was photographed with their newborn in Northern California last month. The singer wrapped her global Mayhem Ball tour in April after hitting five continents and grossing nearly $420 million on its way to becoming one of the top 10 highest-grossing tours by a woman in Billboard Boxscore history. After releasing the singles Disease, Abracadabra and The Dead Dance from Mayhem last year, Gaga teamed up with Doechii earlier this year for Runway from the soundtrack to The Devil Wears Prada 2 .", "date_str": "2026-10-20T12:48:42+00:00", "hash": "52e59f72ac5d4d3f", "title_fa": "«نگران نباش،» عزیزم، لیدی گاگا به New Music on the Horizon اشاره می کند", "summary_fa": "تنها یک سال از انتشار ششمین آلبوم استودیویی لیدی گاگا به نام Mayhem می گذرد. و اگرچه Little Monsters باید بین انفجار سینت پاپ مارس گذشته و نسخه قبلی آن Chromatica 2020 نزدیک به پنج سال صبر می کرد، در ویدیوی اخیر TikTok Mother Monster امیدوار بود که چیزی خاص در راه است و به زودی. در کلیپی که در روز دوشنبه (19 اکتبر) ست برس جدید برند آرایشی Haus Labs او را تبلیغ می‌کند — به نشانه Wham! کریسمس گذشته - گاگا مشغول نشان دادن براش‌های مختلف شد که یکی از طرفداران نظرات خود را به صدا درآورد و درخواست ناامیدانه‌ای برای آهنگ‌های تازه کرد. این طرفدار نوشت گاگا لطفا ما را برای مدت طولانی منتظر آلبوم نباشید. ما فقط موسیقی می خواهیم!!! هر آلبوم طولانی تر شده است. گاگا به سرعت با پاسخی دو کلمه ای که موهای هیولاها را آتش زد پاسخ داد: نگران نباشید، او به همراه دو ایموجی قلب نوشت. در زمان مطبوعات، سخنگوی گاگا برای اظهار نظر در مورد اینکه چه زمانی طرفداران می توانند انتظار موسیقی جدید از خواننده را داشته باشند، در دسترس نبود. او گفت که این هفته در گفتگو با پادکست استودیوی رولینگ استون، سازنده و ترانه سرای مشترک Mayhem گفت که همیشه با گاگا در تماس است، هر زمان که او زنگ را به صدا درآورد، من آنجا خواهم بود. در حالی که در زمان انتشار مشخص نبود که گاگا، 40 ساله، چه زمانی ممکن است به استودیو بازگردد و به چه پروژه ای اشاره می کند، به احتمال زیاد او با دختر تازه متولد شده اش، رز بین پولانسکی، دستش پر است. اگرچه گاگا هنوز در انظار عمومی در مورد کودکی که او و نامزدش مایکل پولانسکی در ماه ژوئن پذیرایی کردند صحبت نکرده است، گاگا ماه گذشته با نوزاد تازه متولد شده آنها در کالیفرنیای شمالی عکس"}, {"source": "Billboard", "title": "Andrew Watt Reveals He and Ozzy Osbourne Made Unheard Songs For a ‘Specific Reason’ Before Rocker’s Death", "link": "https://www.billboard.com/music/rock/andrew-watt-unheard-songs-ozzy-osbourne-specific-reason-1236363420/", "summary": "Ozzy Osbourne got to say goodbye exactly as he wanted to at last July s epic Back to the Beginning blowout in Birmingham, England. Now, producer Andrew Watt — who helmed the final two LP s the late metal legend recorded before his death, 2020 s Ordinary Man and 2022 s Patient Number 9 — has revealed that he and Osbourne recorded as-yet-unheard music that they listened to the night before Ozzy s swan song. There are some songs that we made for a specific reason, Watt told Rolling Stone in this week s episode of The Rolling Stone Studio . And yeah, that s all I can say. They re hard for me to listen to. I haven t listened to them. Watt said there is a plan for what to do with the tracks, but he isn t at liberty to discuss that yet. “The night before the concert, I actually went in Birmingham with [Osbourne s wife/manager] Sharon and a couple of people to go get a curry, and I was texting with Ozzy. He was in his hotel room, and he was, like, ‘Come to the hotel, come to the hotel. I was sitting with Sharon and we were both like, ‘He has a big day tomorrow. Maybe I shouldn’t go, ‘cause he’ll get excited and everything,' Watt recalled. But he was, like, ‘No, you’re coming to the hotel. You are coming.’ So I went. I brought a curry with me and sat with him, he said. And he was drawing like he usually does, and we sat and we listened to the stuff that we’d made, and made notes. That, and the next day, were the last times I got to see him. But we had a beautiful listening session and talked about a lot of stuff.” Watt said it s hard to dredge up those memories now. I miss him every day, he said of the hard rock legend, who died 17 days after the Back to the Beginning show at on July 22 at age 76. Watt also responded to Black Sabbath guitarist Tony Iommi recently saying that he didn t want to commit to a planned final Sabbath album because he felt Watt was a bit too excited about it. The producer said he thought the comments were taken out of context while copping to being an excited musician and person. After working on those two solo Ozzy albums, Watt said Osbourne suggested they make one last Sabbath album, this time with the band s original drummer, Bill Ward, who was not involved in the group s 2013 reunion album, 13 . I think looking back at all the stuff he wanted to do, making an album with Bill was really important to him, Watt said of Osbourne. And this was before Back To The Beginning was happening and everything. I think the idea of doing something with", "date_str": "2026-10-20T12:09:10+00:00", "hash": "1b1483bd35b24778", "title_fa": "اندرو وات فاش می‌کند که او و آزی آزبورن قبل از مرگ راکر به دلیل خاصی آهنگ‌های شنیده نشده را ساخته‌اند.", "summary_fa": "آزی آزبورن دقیقاً همانطور که می خواست در حماسه بازگشت به آغاز در ژوئیه گذشته در بیرمنگام انگلستان خداحافظی کرد. اکنون، اندرو وات تهیه‌کننده - که دو ال‌پی آخر اسطوره متال ضبط شده قبل از مرگش، یعنی مرد معمولی 2020 و بیمار شماره 9 در سال 2022 را بر عهده داشت، فاش کرده است که او و آزبورن موسیقی هنوز شنیده نشده‌ای را ضبط کرده‌اند که شب قبل از آهنگ قو اوزی به آن گوش داده‌اند. وات در قسمت این هفته استودیوی رولینگ استون به رولینگ استون گفت: چند آهنگ وجود دارد که ما آنها را به دلیل خاصی ساخته ایم. و بله، این تنها چیزی است که می توانم بگویم. گوش دادن به آنها برای من سخت است. من به آنها گوش نداده ام وات گفت که برنامه‌ای برای این وجود دارد که با آهنگ‌ها چه کاری انجام دهد، اما او هنوز در این مورد آزاد نیست. «شب قبل از کنسرت، من در واقع با شارون [همسر/مدیر آزبورن] و چند نفر به بیرمنگام رفتیم تا بریم کاری بگیریم، و با آزی پیامک می‌فرستم. او در اتاق هتلش بود و مثل این بود که \"بیا هتل، بیا هتل.\" من با شارون نشسته بودم و هر دو گفتیم: \"او فردا روز بزرگی دارد.\" وات به یاد می آورد که شاید نباید بروم، \"چون او هیجان زده خواهد شد و همه چیز\". اما او مثل این بود که \"نه، تو به هتل می آیی.\" تو می آیی.» پس رفتم. گفت با خودم کاری آوردم و با او نشستم. و او داشت مثل همیشه طراحی می‌کرد، و ما نشستیم و به چیزهایی که ساخته بودیم گوش دادیم و یادداشت‌برداری کردیم. آن روز و روز بعد، آخرین باری بود که توانستم او را ببینم. اما ما یک جلسه شنیداری زیبا داشتیم و در مورد چیزهای زیادی صحبت کردیم.\" وات گفت که در حال حاضر"}, {"source": "Billboard", "title": "MUNA’s Tour Bus Catches Fire After Stanford Show: ‘We’re All Safe’", "link": "https://www.billboard.com/lists/muna-tour-bus-catches-fire/", "summary": "MUNA are safe after a tour bus carrying members of the band caught fire on Interstate 5 in Burbank, Calif., Monday morning (Oct. 19), just hours after the trio performed at Stanford University. “Many personal items were lost but we’re all safe, thank goodness,” the group wrote in a social media post following the incident. According to the San Francisco Chronicle , the California Highway Patrol received a report of the fire shortly after 8:20 a.m. Monday on southbound I-5 near Buena Vista Street. Everyone aboard the bus was able to escape without injury. Aerial footage from KTLA showed extensive fire damage to the vehicle, particularly toward the rear of the bus. The station reported that the driver was initially unaware the bus had caught fire before pulling over. Several lanes of the freeway were closed while emergency crews responded, causing delays during the Monday morning commute. The cause of the fire was not immediately known. The incident came less than a day after MUNA performed Sunday night (Oct. 18) at Stanford’s Frost Amphitheater as part of their Gets So Hot Tour. The Los Angeles-based trio — Katie Gavin, Naomi McPherson and Josette Maskin — are currently touring behind their fourth studio album, Dancing on the Wall , which arrived in May. Despite the fire, there was no immediate indication that the band’s upcoming dates would be affected. MUNA’s next scheduled performance is Wednesday (Oct. 21) at Red Rocks Amphitheatre in Morrison, Colo., followed by another appearance in Los Angeles on Thursday (Oct. 22). The group have spent much of 2026 on the road behind Dancing on the Wall , continuing a run that has seen them grow from indie-pop favorites into a larger touring draw over the past several years. MUNA first formed in Los Angeles and released their debut album, About U , in 2017. Their 2022 self-titled album included “Silk Chiffon,” featuring Phoebe Bridgers, which became one of the group’s best-known songs and helped expand their audience ahead of subsequent headline tours. The cause of the bus fire remains under investigation. View this post on Instagram", "date_str": "2026-10-20T06:21:38+00:00", "hash": "a55d2ca2aaccd605", "title_fa": "اتوبوس تور MUNA پس از نمایش استنفورد آتش گرفت: \"ما همه در امنیت هستیم\"", "summary_fa": "MUNA پس از آتش گرفتن اتوبوس تور حامل اعضای گروه در بین ایالتی 5 در بربنک، کالیفرنیا، صبح روز دوشنبه (19 اکتبر)، تنها چند ساعت پس از اجرای این گروه در دانشگاه استنفورد، در امان هستند. این گروه در پستی در شبکه های اجتماعی پس از این حادثه نوشت: \"بسیاری از وسایل شخصی گم شده اند، اما خدا را شکر همه ما در امان هستیم.\" به گزارش سانفرانسیسکو کرونیکل، گشت بزرگراه کالیفرنیا گزارش آتش سوزی را اندکی پس از ساعت 8:20 صبح دریافت کرد. دوشنبه در I-5 جنوب در نزدیکی خیابان بوئنا ویستا. همه سرنشینان اتوبوس توانستند بدون جراحت فرار کنند. تصاویر هوایی KTLA خسارت آتش سوزی گسترده ای را به وسیله نقلیه، به ویژه در قسمت عقب اتوبوس نشان می دهد. ایستگاه گزارش داد که راننده در ابتدا از آتش گرفتن اتوبوس بی‌اطلاع بود و قبل از اینکه آن را ویراند. چندین باند آزادراه بسته شد و خدمه اورژانس پاسخ دادند و باعث تاخیر در رفت و آمد صبح دوشنبه شد. علت آتش سوزی بلافاصله مشخص نشد. این حادثه کمتر از یک روز پس از اجرای MUNA در یکشنبه شب (18 اکتبر) در آمفی تئاتر فراست استنفورد به عنوان بخشی از تور Gets So Hot آنها رخ داد. گروه سه گانه مستقر در لس آنجلس - کیتی گاوین، نائومی مک فرسون و ژوزت ماسکین - در حال حاضر در حال برگزاری تور در پشت چهارمین آلبوم استودیویی خود به نام Dancing on the Wall هستند که در ماه مه منتشر شد. با وجود آتش سوزی، هیچ نشانه فوری مبنی بر اینکه تاریخ های آینده گروه تحت تأثیر قرار خواهد گرفت وجود نداشت. اجرای برنامه ریزی شده بعدی MUNA چهارشنبه (اکتبر. 21) در آمفی تئاتر رد راکس در موریسون، کولو.، و به دنبال آن یک حضور دیگر در لس آنجلس در روز پنجشنبه (22 اکتبر). این گروه بخش زیادی از"}, {"source": "Billboard", "title": "82WORLD: LA Best Moments: ATEEZ Brings It Home, P1Harmony’s Big Tease and a BTS Throwback", "link": "https://www.billboard.com/lists/82world-la-festival-2026-best-moments/", "summary": "For its first-ever festival, hello82 went big without losing the personal touch that built the brand. The growing indie K-pop label’s inaugural 82WORLD: LA took over Los Angeles State Historic Park Oct. 17-18, drawing a reported 11,000 fans over two days. ATEEZ and P1Harmony headlined a lineup that also featured K-pop boy bands 8TURN, AMPERS ONE and xikers , girl groups GIRLSET and cosmosy, J-pop sensations BE:FIRST, and a surprise addition of FiveALIVE. Sunday be "hash": "af83a16a07d9150b", "title_fa": "تیلدا سوینتون برای اولین بار در «مرد به مرد» در زمستان امسال روی صحنه نیویورک روی صحنه می رود", "summary_fa": "انحصاری: تیلدا سوینتون، برنده اسکار، اولین حضور خود در نیویورک را در زمستان امسال با احیای مرد به مرد اثر مانفرد کارگه در تئاتر لوسیل لورتل در خارج از برادوی انجام خواهد داد. پیش‌نمایش نامزدی محدود 8 هفته‌ای از 21 فوریه 2027 آغاز می‌شود و یک شب افتتاحیه رسمی برای 28 فوریه 2027 تعیین شده است. سوئینتون نقش را در [ ] آغاز کرد. احیا، که اکنون در تئاتر رویال کورت لندن اجرا می شود، تیم خلاق برنده چند جایزه، از جمله کارگردان استفن آنوین و طراح بانی کریستی را با ترجمه آنتونی ویویس و بازبینی های آنوین، دوباره متحد می کند و نشان دهنده بازگشت سوئینتون به صحنه برای اولین بار در چهار دهه است. نامزدی لندن در عرض دو ساعت تمام شد و بیش از 30000 نفر لیست انتظار را نگه داشت. خبرهای مرتبط اخبار کارلا گوگینو، فرد هچینگر، تام پسینکا رایلی. آتو بلانکسون وود به خانم بلک برای ریاست می‌پیوندد اعلامیه Off Broadway امروز توسط تهیه‌کنندگان برایان و داینا لی، تئاتر سلطنتی، برلینر آنسامبل و مدیسون ولز لایو اعلام شد. Man to Man اجراهای محدودی در اسکاتلند در تئاتر تراورس و در آلمان با گروه برلینر قبل از رسیدن به نیویورک خواهد داشت. خلاصه داستان: در آلمان دهه 1930، زنی شلوار شوهر مرده‌اش را می‌پوشد و هرگز آن را در نمی‌آورد. همانطور که دنیای اطراف او تغییر می کند، او جنگ و دیکتاتوری، گرسنگی و تحقیر را تحمل می کند - همیشه برای زنده ماندن می جنگد. تیم خلاق Man to Man شامل بانی کریستی (طراحی)، بن اورمرود (طراحی نور)، النا پنیا (طراحی صدا) و مت پاول (طراحی پروجکشن) است."}, {"source": "Deadline", "title": "Lin-Manuel Miranda’s ‘Warriors’ Broadway Cast To Include Casey Likes, Amber Gray & Jasmine Cephas Jones; Opening Date, Venue Announced", "link": "https://deadline.com/2026/10/warriors-broadway-casey-likes-amber-gray-jasmine-cephas-jones-1237168241/", "summary": "Warriors, the upcoming Lin-Manuel Miranda Broadway musical based on the 1979 film and the Sol Yurick novel, will feature a cast including, among others, Casey Likes (Back to the Future, Almost F de hecht aan het stichten van een gezin. Noi, un po meglio Wanneer het stel besluit om samen een kind te adopteren, begint een nieuwe en ingewikkelde periode in hun leven. Ze moeten zich voorbereiden op het ouderschap en ontdekken dat hun ideeën over opvoeding en de toekomst lang niet altijd overeenkomen. Wat aanvankelijk een gezamenlijk avontuur lijkt, brengt steeds meer verborgen spanningen aan het licht. Vooral hun verschillende achtergronden en levensvisies zorgen voor moeilijke gesprekken. Simone probeert houvast te vinden in duidelijke afspraken, terwijl Lucia bang is dat ze door het moederschap een belangrijk deel van haar vrijheid zal verliezen. Beiden worden daardoor gedwongen om na te denken over wat ze werkelijk willen en welke offers ze bereid zijn voor elkaar te brengen. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Verborgen spanningen in Italiaans drama op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-20T09:13:46+00:00", "hash": "320731e5d2b62670", "title_fa": "تنش های پنهان در درام ایتالیایی در نتفلیکس", "summary_fa": "وقتی می گوییم Noi, un po meglio، چه می گویید؟ احتمالاً هیچ چیز، زیرا این ایتالیایی است! یعنی تو، من، ما، یه همچین چیزی. Of You, Me, Us و این نیز عنوان انگلیسی این درام-کمدی ایتالیایی است. درام جدید ایتالیایی در نتفلیکس Noi, un po meglio یک فیلم درام با عناصر کمدی است: داستان در هر صورت درباره سیمونه (الیو جرمانو) و لوسیا (ماریا کیارا جیانتا) است، دو عاشق که در نگاه اول به سختی به نظر می رسد با هم همخوانی دارند. سیمون مردی مسئولیت پذیر است که به قوانین و سنت ها اهمیت زیادی می دهد. لوسیا مستقل و خودجوش است. او دوست دارد خودش انتخاب کند و نیاز چندانی به زندگی خانوادگی سنتی ندارد. سیمون و لوسیا علیرغم اختلافاتشان، رابطه ای قوی برقرار کرده اند. آنها واقعاً یکدیگر را دوست دارند و معمولاً اختلافات خود را با طنز و صبر حل می کنند. با این حال، عشق آنها زمانی آزمایش می شود که موضوع کودکان اهمیت فزاینده ای پیدا کند. لوسیا برای مدت طولانی در برابر n. Situatie verandert drastisch De situatie verandert drastisch wanneer Lucas (Helder Onkelinx), de stiefzoon van Isabelle, na twee jaar afzondering plotseling terugkeert. Als minderjarige raakte Lucas betrokken bij een tragisch bootongeluk in Spanje. Om te voorkomen dat het schandaal de reputatie van de familie zou beschadigen, werd hij destijds gedwongen de verantwoordelijkheid voor het ongeluk op zich te nemen. Hierdoor verloor hij niet alleen zijn vrijheid, maar ook het vertrouwen in de mensen die hem hadden moeten beschermen. Wanneer Lucas opnieuw verschijnt blijkt hij de gebeurtenissen uit het verleden allesbehalve vergeten te zijn. Hij is vastbesloten om wraak te nemen op degenen die hem hebben opgeofferd en begint een gevaarlijk spelletje. Ook Wouter (Benja Bruijning), de echtgenoot van Sophie (Ruth Becquart), raakt betrokken bij de oplopende spanningen. Hij wil vooral zijn gezin beschermen en zijn plek binnen de welgestelde familie behouden. Samen hebben Sophie en Wouter een dochter, Emma (Aiko Beemsterboer), die eveneens deel uitmaakt van het ingewikkelde familienetwerk. Snap jij het nog? Het belooft in ieder geval spannend te worden! Vanaf 13 november kun je deze serie bekijken op Canal+ en hieronder kun je de trailer alvast checken. The post Nieuwe serie van makers Knokke Off die nóg beter is appeared first", "date_str": "2026-10-20T09:06:02+00:00", "hash": "5a8374de90dd8b1a", "title_fa": "سری جدید سازندگان Knokke Off \"که حتی بهتر است\"", "summary_fa": "Knokke Off دیگر نیست، سریالی که هست، چون هنوز فیلمی در حال ساخت است. در این بین سازندگان برنامه نتفلیکس ساکت نمی نشینند، زیرا سریال جدیدی را آماده کرده اند: Omerta که شاید بهتر از این هم باشد. چه کسی می داند! اولین تصاویر از سریال جنایی Omerta Omerta یک سریال درام هلندی-فلاندری از Canal+ است که توسط تیم خلاق پشت سریال محبوب Knokke Off (دقیقاً تام گوریس) ساخته شده است. داستان حول محور خانواده ثروتمند و با نفوذ ون لو می چرخد ​​که صاحب یک امپراتوری تجاری موفق هستند. با این حال، در پس سبک زندگی مجلل آنها راز  probeert haar verleden te verwerken. Ondertussen ontdekt Owen Casserly, een financieel onderzoeker, gevoelige informatie over een omvangrijke corruptiezaak. Wanneer hij beseft dat machtige mensen hem uit de weg willen ruimen, vlucht hij samen met zijn jonge zoon Connor (Finn Little) richting Montana. Onderweg worden ze echter onderschept door twee professionele huurmoordenaars. Connor weet te ontsnappen en vlucht alleen de wildernis in. Achtervolgd door criminelen Tijdens zijn vlucht komt Connor toevallig Hannah tegen. Wanneer ze ontdekt dat de jongen wordt achtervolgd door gevaarlijke criminelen, besluit ze hem te beschermen. Dat blijkt een levensgevaarlijke beslissing, want de huurmoordenaars zijn vastbesloten Connor te vinden. Hij beschikt namelijk over belangrijke informatie die hun opdrachtgevers in grote problemen kan brengen. De situatie wordt nog gevaarlijker wanneer de moordenaars opzettelijk een enorme bosbrand veroorzaken om de autoriteiten af te leiden. Hannah en Connor komen daardoor tussen twee dodelijke bedreigingen terecht: de gewapende achtervolgers en een snel oprukkende vuurzee. Terwijl de vlammen zich door het bos verspreiden, moeten ze alles op alles zetten om levend uit de wildernis te ontsnappen. We weten niet precies wanneer Those Who Wish Me Dead uitkomt op Netflix, maar de film heeft al een eigen pagina op de streamingdienst, dus zéér binnenkort kun je deze actiekraker kijken! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Netflix voegt kraker van maker Yellowstone toe appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-19T17:26:54+00:00", "hash": "9302b69b0bacb9ae", "title_fa": "نتفلیکس کرکری از سازنده Yellowstone اضافه می کند", "summary_fa": "تیلور شریدان به خاطر یلوستون و تمام اسپین آف های آن (مانند 1883، 1923، داتون ها، همه آنها را نام ببرید) شناخته می شود، اما او یک فیلم اکشن نیز کارگردانی کرده است که کسی جز آنجلینا جولی در آن نقش آفرینی نکرده است.
