 نوارهای تازه وجود دارد). اپل واچ سری 12 شامل یک سیستم تشخیص سلامت جدید و یک تراشه S11 است که آن را به معتبرترین و سالم ترین نسخه از سری اپل واچ تا به امروز تبدیل کرده است. این پیشرفت‌ها با ویژگی‌های هوش صوتی آتی و یک برنامه سلامت بازطراحی شده تقویت خواهند شد. سری 12 ارتقایی نسبت به سری 11 سال گذشته است که در بین بهترین ردیاب های تناسب اندام که آزمایش کرده ایم رتبه بندی می شود و به عنوان بهترین اپل واچ به طور کلی موفق به کسب افتخار برتری شده است. ما همه چیزهایی را که باید در مورد اپل واچ سری 12 جدید بدانید، از جمله قیمت، رنگ‌ها، ویژگی‌های جدید و ارزش مبادله‌ای برای دستگاه‌های دیگر برجسته کرده‌ایم. همچنین می‌توانید جزئیات مربوط به اطلاعات مربوط به پیش‌سفارش را بیابید، بنابراین می‌توانید مطمئن شوید که دستگاه جدیدتان در اواخر این هفته عرضه می‌شود. نحوه پیش خرید اپل واچ سری 12 اپل واچ سری 12 در اندازه های 42 میلی متری و 46 میلی متری موجود است که به ترتیب از 399 و 449 دلار قیمت دارند. پیش‌فروش‌های اپل واچ سری 12 ابتدا"}, {"source": "Business Insider", "title": "'60 Minutes' ratings tanked in the season debut under Bari Weiss", "link": "https://www.businessinsider.com/60-minutes-ratings-tanked-season-debut-cbs-news-bari-weiss-2026-9", "summary": "CBS News storied 60 Minutes telecast saw a major ratings decline under top editor Bari Weiss. Bloomberg/Getty Images; Kevin Dietsch/Getty Images The new-look \"60 Minutes\" suffered a major decline in viewership in its season debut. New lead producer Nick Bilton and top editor Bari Weiss spent the summer updating the telecast. About 7.9 million people watched the episode, down from about 10 million last year. CBS News' \"60 Minutes\" is off to a rocky start on the viewership front under its new leadership. Ratings for the \"60 Minutes\" season premiere on Sunday night plunged more than 20% from last year, according to data from Nielsen. About 7.9 million people watched the episode, orchestrated by new lead producer Nick Bilton, who was selected by top CBS News editor Bari Weiss in May. Last fall, just over 10 million people tuned in to the launch of \"60 Minutes.\" Key context: The NFL game lead-in to \"60 Minutes\" was much weaker than last year, when Lamar Jackson's Baltimore Ravens faced Patrick Mahomes and the Kansas City Chiefs. The premiere was \"a big moment for 60 Minutes and CBS,\" according to a memo that Bilton, Weiss, and network president Tom Cibrowski sent to CBS News staffers on Sunday. CBS News touted the online viewership of \"60 Minutes,\" saying the news program roughly tripled its social media reach. Highlights of the episode included an interview with the US Air Force pilot who survived after being shot down in Iran and a profile on Los Angeles Rams head coach Sean McVay as the NFL season kicked off. The episode also had interviews with so-called \"pardon brokers\" who sell wealthy clients on their supposed ability to influence presidential pardons. Bilton and Weiss spent the summer revamping \"60 Minutes\" after a choppy stretch in which correspondents Scott Pelley , Cecilia Vega, Sharyn Alfonsi, and Anderson Cooper left the storied news program. Pelley was fired by Bilton after publicly questioning his new boss' qualifications , pressing him on why Vega and Alfonsi were let go, and accusing Weiss of \"murdering\" the \"60 Minutes\" telecast. Longtime correspondents Lesley Stahl, Bill Whitaker, and Jon Wertheim decided to stay at \"60 Minutes\" after Bilton pledged to uphold high journalistic standards, telling their colleagues that they \"don't want to see 60 Minutes die.\" Bilton has put his touch on \"60 Minutes\" by modernizing its graphics and bringing on contributors like correspondent Ross Douthat, who came over from The New York Times in July. Weiss has ", "date_str": "2026-09-15T20:32:46+00:00", "hash": "5e3a65cb7378fcb8", "title_fa": "رتبه بندی «60 دقیقه» در اولین فصل زیر نظر باری ویس کاهش یافت", "summary_fa": "پخش تلویزیونی داستانی CBS News 60 Minutes تحت نظر سردبیر ارشد Bari Weiss شاهد کاهش رتبه بندی عمده بود. بلومبرگ/گتی ایماژ; کوین دیچ/ گتی ایماژ «60 دقیقه» با ظاهر جدید در اولین فصل خود با کاهش چشمگیری در بینندگان مواجه شد. نیک بیلتون، تهیه کننده اصلی جدید و باری وایس سردبیر ارشد، تابستان را صرف به روز رسانی پخش تلویزیونی کردند. حدود 7.9 میلیون نفر این قسمت را تماشا کردند که در مقایسه با 10 میلیون نفر در سال گذشته کاهش یافته است. «60 دقیقه» شبکه خبری سی‌بی‌اس با رهبری جدیدش شروعی دشوار در عرصه بینندگان دارد. بر اساس داده‌های نیلسن، رتبه‌بندی اولین نمایش فصل «60 دقیقه» یکشنبه شب نسبت به سال گذشته بیش از 20 درصد کاهش یافته است. حدود 7.9 میلیون نفر این اپیزود را که توسط تهیه کننده اصلی جدید، نیک بیلتون تنظیم شده بود، تماشا کردند که توسط سردبیر ارشد CBS News Bari Weiss در ماه می انتخاب شد. پاییز گذشته، بیش از 10 میلیون نفر برای راه اندازی \"60 دقیقه\" هماهنگ شدند. زمینه اصلی: بازی NFL منجر به \"60 Minutes\" بسیار ضعیف تر از سال گذشته بود، زمانی که لامار جکسون بالتیمور ریونز با پاتریک ماومز و چیفز کانزاس سیتی روبرو شد. بر اساس یادداشتی که بیلتون، وایس و رئیس شبکه تام سیبروسکی روز یکشنبه برای کارکنان CBS News ارسال کردند، اولین نمایش \"لحظه ای بزرگ برای 60 Minutes و CBS\" بود. CBS News از بینندگان آنلاین \"60 Minutes\" حمایت کرد و گفت که این برنامه خبری تقریباً سه برابر میزان دسترسی خود را در رسانه های اجتماعی افزایش داد. نکات مهم این قسمت شامل مصاحبه با خلبان نیروی هوایی ایالات متحده که پس از سرنگون شدن در ایران جان سالم به در برد و نمایه ای از شان مک وی سرمربی لس آنجلس رامز در آغاز فصل NFL بود. این اپیزود همچنین مصاحبه هایی"}, {"source": "Business Insider", "title": "The Kennedy Center's board voted to close until Trump's name is added. Here's a look at the history behind the landmark.", "link": "https://www.businessinsider.com/kennedy-center-board-votes-to-close-until-trumps-name-added-2026-9", "summary": "The John F. Kennedy Center for the Performing Arts in Washington, DC.The John F. Kennedy Center for the Performing Arts in Washington, DC. Kent Nishimura/AFP via Getty Images The Trump-appointed Kennedy Center board voted to close the performing arts center on Tuesday. Trump renamed the center to the Trump Kennedy Center, then a federal judge ordered his name removed. Originally called the National Cultural Center, the name changed after Kennedy's 1963 assassination. The Trump-appointed board of the Kennedy Center voted to close the embattled performing arts center on Tuesday — the latest twist in the Trump administration's quest for control over the space. Trump wrote on Truth Social that the board voted to close the Kennedy Center \"for Safety reasons, and so that it can begin the process of Reconstruction,\" adding that renovations would not begin until the DC Circuit rules on whether he can add his name to the institution. The board voted to rename the Kennedy Center to the Trump Kennedy Center in December 2025, reflecting President Donald Trump's broader effort to exert influence over Washington's cultural institutions. It happened despite lingering questions about its legality. The new signage read \"The Donald J. Trump and The John F. Kennedy Memorial Center for the Performing Arts.\" Trump's efforts to name the Kennedy Center after himself and close the performance space for renovations were subsequently blocked by a federal judge. Since the Kennedy Center was created by Congress, changing its name requires congressional approval, the judge ruled. The case is pending in the DC Circuit. \"The Board's decision today reflects sound judgment and a clear prioritization of safety above all else,\" Roma Daravi, the Kennedy Center's vice president of public relations, told Business Insider. \"As the main building closes for urgent renovations — long overdue and desperately needed to protect the safety of patrons, artists, and staff — the Center remains committed to pursuing a safe and efficient renovation through all legal means.\" Originally established by Congress in 1958 as an \"artistic mecca\" for the performing arts in the nation's capital, the National Cultural Center was officially renamed in memory of President John F. Kennedy after his assassination in 1963. Since its opening in 1971, the center has hosted the Kennedy Center Honors and a range of events and exhibits across genres. Here's a brief overview of how the Center came to be and its changes under T", "date_str": "2026-09-15T20:19:57+00:00", "hash": "cffd13bd07acbbed", "title_fa": "هیئت مدیره مرکز کندی رای به تعطیلی تا زمانی که نام ترامپ اضافه نشود، داد. در اینجا نگاهی به تاریخچه پشت این بنای تاریخی می اندازیم.", "summary_fa": "مرکز هنرهای نمایشی جان اف کندی در واشنگتن دی سی. مرکز هنرهای نمایشی جان اف کندی در واشنگتن دی سی. کنت نیشیمورا/ خبرگزاری فرانسه از طریق گتی ایماژ هیئت مدیره مرکز کندی منصوب شده توسط ترامپ روز سه شنبه به تعطیلی مرکز هنرهای نمایشی رای داد. ترامپ نام این مرکز را به مرکز ترامپ کندی تغییر داد، سپس یک قاضی فدرال دستور حذف نام او را داد. نام اصلی مرکز فرهنگی ملی، پس از ترور کندی در سال 1963 تغییر کرد. هیئت مدیره مرکز کندی منصوب شده توسط ترامپ روز سه‌شنبه به تعطیلی مرکز هنرهای نمایشی درگیر رای داد - آخرین تغییر در تلاش دولت ترامپ برای کنترل بر فضا. ترامپ در Truth Social نوشت که هیئت مدیره به تعطیلی مرکز کندی «به دلایل ایمنی و برای اینکه بتواند روند بازسازی را آغاز کند» رای داد و افزود که تا زمانی که مدار DC تصمیم نگیرد که آیا او می‌تواند نام خود را به این مؤسسه اضافه کند، بازسازی‌ها آغاز نخواهد شد. هیئت مدیره در دسامبر 2025 به تغییر نام مرکز کندی به مرکز کندی ترامپ رأی داد که نشان دهنده تلاش گسترده تر رئیس جمهور دونالد ترامپ برای اعمال نفوذ بر نهادهای فرهنگی واشنگتن است. این اتفاق علی‌رغم وجود سؤالات طولانی در مورد قانونی بودن آن رخ داد. روی تابلوی جدید نوشته شده بود «دونالد جی ترامپ و جان اف. مرکز یادبود کندی برای هنرهای نمایشی.\" تلاش های ترامپ برای نامگذاری مرکز کندی به نام خود و بستن فضای اجرا برای بازسازی متعاقباً توسط یک قاضی فدرال مسدود شد. از آنجایی که مرکز کندی توسط کنگره ایجاد شد، تغییر نام آن مستلزم تایید کنگره است، قاضی رای داد. این پرونده در مدار DC در حال بررسی است. روما داروی، معاون روابط عمومی مرکز کندی، به Business Insider گفت: «تصمیم امروز هیئت منعکس کننده قضاوت صحیح و اولویت بندی واضح"}, {"source": "Business Insider", "title": "Elizabeth Warren demands an investigation of Trump-linked crypto firm over 'illicit finance'", "link": "https://www.businessinsider.com/elizabeth-warren-trump-wlf-crypto-clarity-act-world-liberty-financial-2026-9", "summary": "Bloomberg/Getty Images Elizabeth Warren wants the DOJ and the Treasury to probe World Liberty Financial. Warren raised concerns about \"illicit finance\" risks associated with the Trump-linked crypto firm. \"I write to ask if the Trump Administration will finally investigate the national security risks posed by World Liberty Financial.\" Elizabeth Warren says a crypto venture tied to the president and his family represents a national security risk. The Democratic Senator from Massachusetts penned a letter to Secretary of Treasury Scott Bessent and Attorney General Todd Blance asking them to investigate World Liberty Financial, a crypto firm part-owned by the Trump family that issues its own crypto token. \"I write to ask if the Trump Administration will finally investigate the national security risks posed by World Liberty Financial and any of its affiliated entities (collectively 'WLF') given yet another round of troubling public reports about the company's connections to people or entities engaged in illicit finance,\" Warren wrote. The firm's $WLFI token was launched by Trump in September 2024, and has a market cap of about $1.8 billion. Filings revealed earlier this year that token sales and equity stakes netted Trump roughly $500 billion, part of a massive windfall the president reaped from crypto deals in 2025. Observers have raised concerns about Trump's crypto ventures, citing conflicts of interest and negative consequences for crypto market sentiment. Warren has made similar arguments, stating that White House and congressional officials should be barred from trading crypto. She's also previous raised concerns regarding crypto bills championed by Republican politicians. Her letter was delivered as the Senate failed to pass a key piece of crypto legislation on Tuesday. The Clarity Act failed to advance in a procedural vote, dealing a major blow to the industry, which has been pushing for the legislation meant to provide a regulatory framework for digital assets. Bitcoin fell 3% after the vote. Tn Tuesday's letter, Warren focused on a $100 million WLF purchase made by Guren \"Bobby\" Zhou, a businessman that the New York Times reports has been investigated for money laundering. The purchase was made through his company, Aqua 1, which Warren flagged as a suspicious entity, noting that its source of funds was unclear. \"Although Aqua 1 describes itself as being 'based in the UAE,' the entity does not appear to be formally registered there,\" she wrote. \"Aqua 1'", "date_str": "2026-09-15T19:50:48+00:00", "hash": "fe59511123f61af4", "title_fa": "الیزابت وارن خواستار تحقیق درباره شرکت ارزهای دیجیتال مرتبط با ترامپ به دلیل \"مالی غیرقانونی\" شد.", "summary_fa": "بلومبرگ/گتی ایماژ الیزابت وارن از وزارت دادگستری و وزارت خزانه داری می خواهد که در مورد World Liberty Financial تحقیق کنند. وارن نگرانی‌های خود را در مورد ریسک‌های «مالی غیرقانونی» مرتبط با شرکت ارز دیجیتال مرتبط با ترامپ مطرح کرد. من می‌نویسم تا بپرسم آیا دولت ترامپ در نهایت خطرات امنیت ملی ناشی از ورلد لیبرتی فایننشال را بررسی خواهد کرد یا خیر. الیزابت وارن می‌گوید که یک سرمایه‌گذاری رمزنگاری مرتبط با رئیس‌جمهور و خانواده‌اش یک خطر امنیت ملی است. سناتور دموکرات ایالت ماساچوست نامه ای به اسکات بسنت وزیر خزانه داری و دادستان کل تاد بلنس نوشت و از آنها خواست در مورد World Liberty Financial، یک شرکت ارز دیجیتال متعلق به خانواده ترامپ که توکن رمزنگاری خود را منتشر می کند، تحقیق کنند. وارن می‌نویسد: «من می‌نویسم تا بپرسم آیا دولت ترامپ در نهایت خطرات امنیت ملی ناشی از World Liberty Financial و هر یک از نهادهای وابسته به آن (مجموعاً \"WLF\") را با ارائه دور دیگری از گزارش‌های عمومی نگران‌کننده درباره ارتباطات این شرکت با افراد یا نهادهایی که در امور مالی غیرقانونی فعالیت می‌کنند، بررسی خواهد کرد. توکن WLFI $ این شرکت توسط ترامپ در سپتامبر 2024 راه اندازی شد و ارزش بازار آن حدود 1.8 میلیارد دلار است. بایگانی‌ها در اوایل سال جاری نشان دادند که فروش توکن و سهام سهام ترامپ را تقریباً 500 میلیارد دلار به‌دست آورده است که بخشی از سود بادآورده‌ای است که رئیس‌جمهور از معاملات کریپتو در سال 2025 به دست آورد. ناظران نگرانی‌هایی را در مورد سرمایه‌گذاری‌های ارزهای دیجیتال ترامپ مطرح کرده‌اند و به تضاد منافع و پیامدهای منفی برای احساسات بازار کریپتو اشاره کرده‌اند. وارن استدلال‌های مشابهی را مطرح کرده و بیان کرده است که مقامات کاخ سفید و کنگره باید از تجارت ارزهای دیجیتال منع شوند. او همچنین قبلاً نگرانی‌هایی را در مورد صورت‌حساب‌های رمزنگاری مورد حمایت"}, {"source": "Business Insider", "title": "The 18 best Serena & Lily dupes for coastal-inspired decor for less", "link": "https://www.businessinsider.com/guides/home/serena-and-lily-dupes", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more From iconic French bistro chairs to a breezy scalloped jute rug, it can be difficult to tell the Serena Lily dupes from the original designs. Serena Lily; Amazon; Home Depot; Wayfair/Business Insider If you're looking to bring a modern coastal feel to your home, you've probably found yourself scrolling through Serena Lily's website or flipping through its catalogs. The popular brand has become known as one of the best places to buy furniture for its distinct aesthetic and high-quality pieces that elevate any room. From light and airy designs to cozy textiles, Serena Lily is a one-stop shop for both indoor and outdoor furniture . The only downside? The brand comes with a high price tag. If you're trying to stick to a budget or just want to avoid young kids or pets ruining more expensive decor, these Serena Lily alternatives may be a better fit for you. From a coffee table with hidden storage to a wavy mirror, these 18 Serena Lily dupes bring the same coastal-chic vibe without breaking the bank. The iconic French bistro chairs Serena Lily; Wayfair/Business Insider Original: Riviera Rattan Dini ن یکی از بهترین مکان‌ها برای خرید مبلمان شناخته شده است. از طرح‌های سبک و مطبوع گرفته تا منسوجات دنج، سرنا لیلی یک فروشگاه یک‌جا برای مبلمان داخلی و خارجی است. تنها نقطه ضعف؟ این برند دارای قیمت بالایی است. اگر می‌خواهید به بودجه خود پایبند باشید یا فقط می‌خواهید از خراب کردن دکوراسیون گران‌تر بچه‌ها یا حیوانات خانگی جلوگیری کنید، این جایگزین‌های سرینا لیلی ممکن است برای شما مناسب‌تر باشند. از میز قهوه‌خوری با انبار مخفی گرفته تا آینه‌ای موج‌دار، این 18 مدل سرنا لیلی همان حال و هوای شیک ساحلی را به ارمغان آورده‌اند. صندلی‌های نمادین رستوران فرانسوی سرینا لیلی. Wayfair/Business Insider اصل: Riviera Rattan Dining Chair، هر عدد 328 دلار Dupe: Bayou Breeze Wicker Wicker Dining Seir side at Wayfair 250 دلار برای یک ست دو تایی این صندلی های آشپزی حصیری ممکن است شناخته شده ترین سبک سرنا لیلی باشد - شما را از نگاه کردن به کافه های محلی خود نگه دارید. خانه دوستان شیک این برند انواع مختلفی از صندلی های ناهار خوری و چهارپایه های پیشخوان را ارائه می دهد، اما یک مزیت عمده برای استفاده از مدل های Wayfair وجود دارد: آنها از چوب حصیری پلی اتیلن بادوام ساخته شده اند، بنابراین می توان از آنها در داخل و"}, {"source": "Business Insider", "title": "This startup tried to take on Carta. It just announced it's shutting down.", "link": "https://www.businessinsider.com/pulley-shuts-down-carta-helps-transition-customers-2026-9", "summary": "baona/Getty Images Pulley said it's shutting down after seven years. Founded in 2019, the startup sought to take on Carta in cap table management. It raised more than $50 million from investors like Founders Fund, Stripe, and General Catalyst. Pulley, a software that startups rely on to track their funding, is shutting down after seven years. The company said in a statement published on its website on Tuesday that it will cease operations after December 8. Pulley had raised more than $50 million from investors, including Founders Fund, General Catalyst, Stripe, and 8VC. It previously tried to challenge its much larger rival, Carta , in the cap table management business — software that helps companies track who owns shares and issue new equity as they raise money. As part of the wind-down, Carta has agreed to help move customers and is offering them a limited-time promotion, according to Pulley's statement. Yin Wu started Pulley after she sold an Android app called Echo to Microsoft in 2015. \"Though this is the closing of one chapter I, along with many of our strongest team members, have no intention of riding off quietly into the night,\" Wu wrote in a LinkedIn post on Tuesday. \"There has never been a better time to solve big problems. For the immediate future, we are focused on working with Carta's team to take care of our customers.\" On Tuesday, founders posted screenshots of the email they received from Pulley. \"We have worked diligently to develop a transition plan that ensures you won't experience any disruptions as we cease operations,\" the company wrote in the email. Customers who move to Carta will be able to keep their current Pulley pricing for the first year, and Carta will credit any unused portion of their Pulley subscription. Read the original article on Business Insider", "date_str": "2026-09-15T19:48:41+00:00", "hash": "b04074d2702ac4d9", "title_fa": "این استارت‌آپ تلاش کرد تا Carta را تصاحب کند. همین الان اعلام کرد که در حال خاموش شدن است.", "summary_fa": "baona/Getty Images Pulley گفت که بعد از هفت سال خاموش می شود. این استارت آپ که در سال 2019 تأسیس شد، به دنبال مقابله با Carta در مدیریت جدول است. بیش از 50 میلیون دلار از سرمایه گذارانی مانند Founders Fund، Stripe و General Catalyst جمع آوری کرد. Pulley، نرم‌افزاری که استارت‌آپ‌ها برای ردیابی منابع مالی خود به آن متکی هستند، پس از هفت سال تعطیل می‌شود. این شرکت در بیانیه‌ای که روز سه‌شنبه در وب‌سایت خود منتشر کرد، گفت که پس از ۸ دسامبر فعالیت خود را متوقف می‌کند. پولی بیش از 50 میلیون دلار از سرمایه گذاران از جمله Founders Fund، General Catalyst، Stripe و 8VC جمع آوری کرده بود. این شرکت قبلاً سعی کرده بود رقیب بسیار بزرگ‌تر خود Carta را در تجارت مدیریت جدول به چالش بکشد - نرم‌افزاری که به شرکت‌ها کمک می‌کند مالکان سهام را ردیابی کنند و در حین جمع‌آوری پول، سهام جدید منتشر کنند. طبق بیانیه پولی، به عنوان بخشی از این کاهش، Carta موافقت کرده است که به جابجایی مشتریان کمک کند و به آنها یک تبلیغ برای مدت محدود ارائه می دهد. یین وو Pulley را پس از اینکه در سال 2015 یک برنامه اندرویدی به نام اکو را به مایکروسافت فروخت، راه اندازی کرد. وو در پستی در لینکدین در روز سه شنبه نوشت: «اگرچه این پایان فصلی است که من، همراه با بسیاری از قوی ترین اعضای تیممان، قصد نداریم تا شب بی سر و صدا از آنجا خارج شویم. «هیچ زمان بهتری برای حل مشکلات بزرگ وجود نداشته است. برای آینده نزدیک، ما بر روی کار با تیم Carta تمرکز کرده‌ایم تا از مشتریان خود مراقبت کنیم.\" روز سه‌شنبه، بنیانگذاران تصاویری از ایمیلی که از پولی دریافت کردند منتشر کردند. شرکت در این ایمیل نوشت: \"ما سخت تلاش کرده‌ایم تا یک طرح انتقالی ایجاد کنیم که تضمین"}, {"source": "Business Insider", "title": "Boeing's new 777X is finally expected to fly passengers next year. Here are the 5 coolest cabin features.", "link": "https://www.businessinsider.com/boeing-777x-jet-cabin-what-passengers-can-expect-2026-9", "summary": "Airlines are expected to introduce brand-new premium and economy cabins once they receive their first Boeing 777X. John Keeble/Getty Images Boeing showed off its 777X cabin at the Farnborough Airshow in July. Project leaders explained new ways Boeing has innovated the cabin, from lighting to bin space. There is a large focus on optimizing the premium section as demand for high-dollar seats booms. It's seven years late and has racked up over $15 billion in charges, but Boeing's most important plane is expected to finally fly passengers in 2027. Over a dozen airlines are waiting on the yet-to-be-certified Boeing 777X, the world's largest twin-engine widebody in production, packed with more than 400 seats and capable of flying up to 9,000 miles nonstop. Boeing says the wider cabin, longer wings with folding wingtips, and giant General Electric engines create more seat room, open new routes, and provide a more efficient and comfortable flying environment compared with the planes it's replacing. After years of delays, Boeing executives reiterated in a July earnings call that the larger 777-9 variant is still on track to enter service next year. German flag carrier Lufthansa is the launch customer. The giant new jet has become increasingly important. Airlines have baked it into plans to capitalize on booming demand for premium travel, expand their long-haul networks, and replace aging widebodies that are more expensive to operate. And Boeing needs a win — and the money — after years of diminishing trust among customers and the public. But the 777X is far behind schedule. Boeing initially planned to deliver the jet in 2020, but a string of quality-control and safety problems at the planemaker have increased regulator scrutiny and slowed certification. Some buyers — notably Emirates — have voiced frustration over the cost of keeping older jets flying while they wait, and have declined to take delivery of some of the earliest-built 777Xs. Several 777X planes are nearing 8 years old as the project prolongs. Lufthansa and Emirates have said they won t take some of the older jets. Bloomberg/Getty Images Still, airlines have placed more than 560 orders collectively, worth billions of dollars, for the passenger 777X variants. At the UK's Farnborough International Airshow in July, Business Insider experienced a mock-up of the 777X cabin and spoke with Boeing to learn more about what flyers can expect onboard, assuming the jet launches as intended next year. \"Boeing wante", "date_str": "2026-09-15T19:12:28+00:00", "hash": "54ef5519bdbb9984", "title_fa": "انتظار می رود که 777X جدید بوئینگ در سال آینده مسافران را به پرواز درآورد. در اینجا 5 ویژگی جالب کابین آورده شده است.", "summary_fa": "انتظار می رود خطوط هوایی پس از دریافت اولین بوئینگ 777X خود، کابین های پریمیوم و اقتصادی جدید را معرفی کنند. جان کیبل/ گتی ایماژ بوئینگ کابین 777X خود را در نمایشگاه هوایی فارنبرو در ماه جولای به نمایش گذاشت. رهبران پروژه راه‌های جدیدی را توضیح دادند که بوئینگ در کابین ابداع کرده است، از روشنایی گرفته تا فضای سطل زباله. با افزایش تقاضا برای صندلی‌های با دلار بالا، تمرکز زیادی روی بهینه‌سازی بخش ممتاز وجود دارد. هفت سال تأخیر دارد و بیش از 15 میلیارد دلار هزینه دریافت کرده است، اما انتظار می‌رود مهم‌ترین هواپیمای بوئینگ سرانجام در سال 2027 مسافران را به پرواز درآورد. بیش از 12 شرکت هواپیمایی منتظر هواپیمای بوئینگ 777X هستند که هنوز گواهینامه دریافت نکرده است، بزرگ‌ترین هواپیمای دو موتوره پهن بدنه جهان که دارای بیش از 400 سرنشین است. 9000 مایل بدون توقف بوئینگ می‌گوید کابین عریض‌تر، بال‌های بلندتر با نوک بال‌های تاشو و موتورهای غول‌پیکر جنرال الکتریک فضای بیشتری برای صندلی‌ها ایجاد می‌کند، مسیرهای جدیدی را باز می‌کند و در مقایسه با هواپیماهایی که جایگزین می‌کند، محیط پروازی کارآمدتر و راحت‌تری را فراهم می‌کند. پس از سال‌ها تأخیر، مدیران بوئینگ در تماسی که در ماه جولای منتشر کردند، تکرار کردند که نوع بزرگ‌تر 777-9 هنوز در مسیر ورود به خدمت در سال آینده است. شرکت حامل پرچم آلمان لوفت هانزا مشتری راه اندازی است. جت غول پیکر جدید اهمیت فزاینده ای پیدا کرده است. خطوط هوایی در برنامه‌هایی برای سرمایه‌گذاری بر تقاضای رو به رشد برای سفرهای پریمیوم، گسترش شبکه‌های مسافت طولانی خود و جایگزینی بدنه‌های پهن قدیمی که برای کارکرد گران‌تر هستند، استفاده کرده‌اند. و بوئینگ پس از سال‌ها کاهش اعتماد در میان مشتریان و مردم، به برد - و پول - نیاز دارد. اما 777X از برنامه بسیار عقب است. بوئینگ در ابتدا قصد داشت این جت را در سال"}, {"source": "Business Insider", "title": "My daughter is obsessed with Snoopy. I woke up at 3:30 a.m. to hunt down Starbucks' new viral cup.", "link": "https://www.businessinsider.com/starbucks-snoopy-cups-peanuts-merch-daughter-birthday-2026-9", "summary": "Charlotte Mandrier bought the Snoopy cup for her daughter Courtesy of Charlotte Mandrier Charlotte Mandrier's 9-year-old daughter has a deep love of Peanuts and Snoopy. Mandrier's daughter watches \"The Great Pumpkin\" year-round and listens to its soundtrack. With her birthday days away, Mandrier secretly hunted down the new Starbucks collection. This as-told-to essay is based on a conversation with Charlotte Mandrier. It has been edited for length and clarity. On Monday, September 14, I was cleaning up my inbox and deleting emails when I saw that Starbucks was collaborating with the Peanuts brand to sell merchandise inspired by \" The Great Pumpkin .\" I remembered last year when Starbucks released a small number of bear cups . My daughter, who is 9, had wanted one but hadn't managed to get hold of one. She was so disappointed. She clearly hadn't known about the Snoopy cups that were going on sale, or I would have heard about it from her. She is obsessed with Peanuts, Snoopy, and \"The Great Pumpkin.\" She watches the movie all year long As an autistic person , she has a special interest in Peanuts, specifically \"The Great Pumpkin.\" She watches it all year long, even though it is a very fall movie. She listens to the music from the film's soundtrack. She was born in Santa Rosa, where the museum commemorating Charles Schulz — the cartoonist who created the Peanuts comic — is located. When she was little, she went to a camp at the museum and learned to ice skate at Snoopy's Home Ice next door. She even looks like Linus. She loves everything about this brand. Charlotte Mandrier s daughter loves everything related to Peanuts. Courtesy of Charlotte Mandrier As it happened, her birthday is in two days. So when I saw that these limited-edition Snoopy cups and other merchandise celebrating the movie would be on sale, I told my husband I was going to try to get one for her. I woke up in the middle of the night I set my alarm for Tuesday morning at 3:30 a.m., quietly sneaking out of the house to arrive at our closest Starbucks in downtown Chevy Chase at 4 a.m., when it opens. Charlotte Mandrier wants to surprise her daughter with her Snoopy Starbucks cup. Courtesy of Charlotte Mandrier Walking six blocks to get there,  United Nations and national statistical office databases. Business Insider did not include autonomous regions and territories listed in the data. The average life expectancy estimates for 2024 are based on data interpolated across five-year periods, so they may not reflect events that occurred in that year and affected mortality rates, such as a conflict or famine. See the 15 countries with the highest life expectancy, followed by the 15 with the lowest. 13. (tie) Norway s average life expectancy is 83.2 years. Oslo, Norway. xbrchx/Getty Images/iStockphoto Average female life expectancy: 84.8 Average male life expectancy: 81.6 13. (tie) Luxembourg s average life expectancy is 83.2. Luxembourg City, Luxembourg. olrat/Getty Images Average female life expectancy: 85.5 Average male life expectancy: 81.0 13. (tie) Israel s average life expectancy is 83.2. Tel Aviv, Israel. Boarding1Now/Getty Images/iStockphoto Average female life expectancy: 85.4 Average male life expectancy: 81.1 12. Singapore s average life expectancy is 83.3 years. Singapore is a city-state. tupungato/Getty Images Average female life expectancy: 85.6 Average male life expectancy", "date_str": "2026-09-15T18:08:10+00:00", "hash": "8ec54a431102e45b", "title_fa": "15 کشور با بالاترین امید به زندگی - و 15 کشور با کمترین امید به زندگی", "summary_fa": "موناکو بالاترین امید به زندگی را در جهان دارد. سیمونا سیریو/ گتی ایماژ گروه بانک جهانی امید به زندگی را در کشورهای مختلف جهان رتبه بندی کرد. مرگ و میر بالا در میان نوزادان و کودکان به طور قابل توجهی امید به زندگی در بدو تولد را کاهش می دهد. موناکو و سن مارینو بالاترین امید به زندگی را داشتند در حالی که نیجریه و چاد کمترین امید به زندگی را داشتند. جین کالمان مسن ترین فرد تایید شده ای بود که تا به حال زندگی کرده بود و در 122 سالگی درگذشت. علیرغم طول عمر فوق العاده کالمنت، کشور زادگاهش، فرانسه، از نظر میانگین امید به زندگی در رتبه نوزدهم جهان قرار دارد. گروه بانک جهانی داده‌هایی را در مورد امید به زندگی در بدو تولد به تفکیک کشور تا سال 2024 جمع‌آوری کرد. امید ب به دوره های اواخر چرخه هستیم و برای فشرده سازی چندگانه بحث می کنیم.\" بازدهی بالای اوراق قرضه در این هفته سهام را تحت تأثیر قرار داده است و دوام رکورد افزایشی امسال را زیر سؤال می برد. سهام ایالات متحده در روز سه‌شنبه با افزایش بازدهی خزانه‌داری سقوط کرد و بازدهی خزانه‌داری 10 ساله به بالاترین سطح خود از سال 2007 رسید. دور دیگری از فروش در وال استریت را شعله‌ور کرد و همزمان با چند هشدار تازه از سوی تحلیلگران در مورد عقب‌نشینی آینده در بازار بود. بازدهی 10 ساله خزانه داری که بر هزینه های استقراض برای مصرف کنندگان و مشاغل آمریکایی تأثیر می گذارد، تا 5.04 درصد افزایش یافت و به حدود 4.99 درصد در اواسط روز سه شنبه رسید. علامت 5 درصدی برای 10 سال یک آستانه روانی کلیدی است که نشان دهنده یک \"منطقه خطر\" برای سهام است و آخرین افزایش نشان می دهد که با افزایش نگرانی بازارها در مورد وضعیت اقتصاد چقدر انتظارات برای افزایش نرخ بهره فدرال رزرو به شدت افزایش یافته است. افزایش مجدد قیمت نفت در هفته گذشته به نگرانی ها در مورد تورم دامن می زند. برنت این هفته به نزدیک به 110 دلار در هر بشکه رسیده است، در حالی که نفت خام آمریکا بعد از ظهر سه شنبه بالای 106 دلار معامله می شد. تقاضا برای اوراق قرضه دولتی نیز در بحبوحه نگرانی ها در مورد سلامت مالی ایالات متحده ضعیف بوده است، عامل دیگری که باعث افزایش بازدهی می شود. سهام ایالات متحده با آخرین جهش بازدهی سقوط کرد و داو تا حدود ظهر بیش"}, {"source": "Business Insider", "title": "Apple's iOS 27 lets parents police more of what kids do on their iPhones", "link": "https://www.businessinsider.com/apple-parents-kids-controls-iphone-ios-27-2026-9", "summary": "Apple s latest software update gives parents some new controls over their children s phones. Matt Cardy/Getty Images Your iPhone's brain may be getting a big, AI-led upgrade. Apple says it's also making parenting in the digital age easier. An independent analyst said he welcomes the updates — but said kids may still find loopholes. There are new ways to set boundaries on your kids' iPhones. iOS 27, released Monday , is Apple's AI-ified update to the software brains inside the iPhone. Some changes are available for models as old as iPhone 11 . And, for parents, there are four core changes. Screen Time has a redesigned parental dashboard that lets parents adjust a child's access in the moment. Ask to Browse requires kids to get permission before visiting a new website in Safari. Time Allowances lets parents set limits for categories of apps, such as social media, games, and entertainment. Apple says Communication Safety can now shield children from graphic or violent material, as well as nudity, in shared images, videos, and live FaceTime calls. Chris McKenna, the founder and CEO of the digital-safety organization Protect Young Eyes, said the changes could help more parents use controls that have long been difficult to navigate. \"Anything that makes parents' jobs a little bit easier makes the experience of activating parental controls smoother, more intuitive,\" McKenna told Business Insider, \"I cheer for these kinds of changes.\" He said Screen Time has historically been an outlier in Apple's otherwise polished ecosystem, calling it \"clunky,\" especially for parents. \"It involves more steps than are necessary, and really needed a complete revamp,\" he added. McKenna said the more user-friendly design does not solve all of Apple's parental-control problems. Existing filters can still allow inappropriate content to slip through, he said, and a child deliberately looking for a workaround may still find one. \"What iOS 27 doesn't fix are all of the circumventions that a kid with intentionality is still going to be able to find,\" McKenna said. Apple didn't immediately respond to a request for comment from Business Insider. Read the original article on Business Insider", "date_str": "2026-09-15T17:43:26+00:00", "hash": "7222788c657aed1a", "title_fa": "iOS 27 اپل به والدین این امکان را می دهد که بیشتر کارهایی را که بچه ها در آیفون انجام می دهند کنترل کنند", "summary_fa": "آخرین به‌روزرسانی نرم‌افزار اپل به والدین کنترل‌های جدیدی بر روی تلفن‌های فرزندانشان می‌دهد. Matt Cardy/Getty Images مغز آیفون شما ممکن است در حال ارتقاء بزرگ و مبتنی بر هوش مصنوعی باشد. اپل می گوید که فرزندپروری در عصر دیجیتال را نیز آسان تر می کند. یک تحلیلگر مستقل گفت که از به‌روزرسانی‌ها استقبال می‌کند - اما گفت که بچه‌ها ممکن است هنوز نقاط ضعفی پیدا کنند. راه‌های جدیدی برای تعیین حد و مرز در آیفون‌های فرزندانتان وجود دارد. iOS 27 که دوشنبه منتشر شد، به‌روزرسانی هوش مصنوعی اپل برای مغز نرم‌افزار داخل آیفون است. برخی تغییرات برای مدل های قدیمی مانند آیفون 11 در دسترس است. و برای والدین، چهار تغییر اساسی وجود دارد. Screen Time دارای یک داشبورد والدین بازطراحی شده است که به والدین امکان می دهد دسترسی کودک را در لحظه تنظیم کنند. درخواست برای مرور از بچه‌ها می‌خواهد قبل از بازدید از یک وب‌سایت جدید در سافاری اجازه بگیرند. Time Allowances به والدین این امکان را می دهد که برای دسته بندی برنامه ها، مانند رسانه های اجتماعی، بازی ها و سرگرمی ها، محدودیت هایی تعیین کنند. اپل می گوید که Communication Safety اکنون می تواند از کودکان در برابر مواد گرافیکی یا خشونت آمیز و همچنین برهنگی در تصاویر به اشتراک گذاشته شده، ویدیوها و تماس های زنده FaceTime محافظت کند. کریس مک‌کنا، بنیانگذار و مدیر عامل سازمان ایمنی دیجیتال Protect Young Eyes، گفت: این تغییرات می‌تواند به والدین بیشتر کمک کند تا از کنترل‌هایی استفاده کنند که مدت‌هاست کار با آن‌ها دشوار بوده است. مک کنا به Business Insider گفت: «هر چیزی که کار والدین را کمی آسان‌تر کند، تجربه فعال‌سازی کنترل‌های والدین را روان‌تر و شهودی‌تر می‌کند.» من برای این نوع تغییرات تشویق می‌کنم. او گفت که Screen Time از لحاظ تاریخی در اکوسیستم صیقلی اپل یک چیز دور از ذهن بوده است"}, {"source": "Business Insider", "title": "Tech giants have a new headache: a looming strike by their security guards", "link": "https://www.businessinsider.com/security-officers-tech-firms-anthropic-openai-plan-to-strike-2026-9", "summary": "Tech security workers plan to march to Salesforce Tower in downtown San Francisco. Josh Edelson / AFP via Getty Images Security workers staffing California tech offices are planning to strike. As their contract negotiations continue, the strike is planned to begin Friday morning. The work stoppage could affect office operations for a slew of major tech companies. Security workers guarding the California offices of tech companies like Anthropic, Google, and OpenAI are planning to strike this week. The security officers submitted a 72-hour strike notice on Tuesday morning, planning to skip any shift that begins on or after 4:30 a.m. on Friday. The union, SEIU-USWW, said that the officers guard major companies, including Amazon, Microsoft, Salesforce, OpenAI, Anthropic, Google, Meta, and Nvidia. A strike could lead to office closures and spark work-from-home orders, though Bay Area tech companies have not announced any yet. Anthropic told San Francisco staff in late August to work remotely for two days after hearing from its security staffing firm, Allied Universal, that security teams might strike, Business Insider reported. The strike notice arrives at a tense moment for the AI industry, particularly Anthropic. Last week, researcher Jacob Coxon announced that he was leaving Anthropic, writing that the race for superintelligent AI amounts to \"gambling with our lives\" and that \"no other human activity poses this level of danger.\" His post on X sparked a torrent of debate on AI's safety. The security companies have struggled to reach a new contract with the SEIU-USWW union, which represents roughly 14,000 security officers in the state. As of Tuesday, a strike isn't guaranteed. An SEIU-USWW spokesperson told Business Insider that the union and the security companies are holding bargaining sessions on Wednesday and Thursday. The security staffing firms include Allied, Securitas, GardaWorld, and several others. Negotiations over a master contract have dragged on for months, with security officers seeking higher wages, better healthcare, and more comprehensive job training. On Tuesday, the union planned to march through downtown San Francisco to Salesforce Tower, per the press release. Security workers first announced that they'd authorized this strike at a San Francisco rally on September 3. \"We're asking Allied and the other security companies to stop playing games, come to the table, and settle a strong contract with real raises, better training, and respect f", "date_str": "2026-09-15T17:42:13+00:00", "hash": "c8ee524fbe47d70f", "title_fa": "غول های فناوری یک سردرد جدید دارند: یک اعتصاب نزدیک توسط محافظان امنیتی آنها", "summary_fa": "کارکنان امنیتی فناوری قصد دارند به سمت برج Salesforce در مرکز شهر سانفرانسیسکو راهپیمایی کنند. جاش ادلسون / خبرگزاری فرانسه از طریق گتی ایماژ، کارکنان امنیتی دفاتر فناوری کالیفرنیا در حال برنامه ریزی برای اعتصاب هستند. با ادامه مذاکرات قرارداد آنها، اعتصاب قرار است صبح روز جمعه آغاز شود. توقف کار می تواند بر عملیات اداری تعداد زیادی از شرکت های بزرگ فناوری تأثیر بگذارد. کارکنان امنیتی که از دفاتر شرکت‌های فناوری مانند Anthropic، Google و OpenAI در کالیفرنیا محافظت می‌کنند، قصد دارند این هفته اعتصاب کنند. افسران امنیتی صبح روز سه شنبه یک اخطار اعتصابی 72 ساعته ارسال کردند و قصد داشتند از هر شیفتی که در یا بعد از ساعت 4:30 صبح روز جمعه شروع می شود صرف نظر کنند. اتحادیه، SEIU-USWW، گفت که افسران از شرکت‌های بزرگ، از جمله آمازون، مایکروسافت، Salesforce، OpenAI، Anthropic، Google، Meta و Nvidia محافظت می‌کنند. اعتصاب می تواند منجر به تعطیلی دفاتر و جرقه سفارشات کار از خانه شود، اگرچه شرکت های فناوری Bay Area هنوز هیچ چیزی را اعلام نکرده اند. به گزارش بیزینس اینسایدر، آنتروپیک در اواخر ماه اوت به کارکنان سانفرانسیسکو گفت که پس از شنیدن از شرکت کارکنان امنیتی خود، Allied Universal، مبنی بر اینکه تیم های امنیتی ممکن است حمله کنند، به مدت دو روز از راه دور کار کنند. اخطار اعتصاب در لحظه ای پرتنش برای صنعت هوش مصنوعی، به ویژه آنتروپیک می رسد. هفته گذشته، محقق Jacob Coxon اعلام کرد که Anthropic را ترک می‌کند و نوشت که مسابقه برای هوش مصنوعی فوق‌هوشمند به منزله «قمار با زندگی ما» است و «هیچ فعالیت انسانی دیگری این سطح از خطر را ایجاد نمی‌کند». پست او در X موجی از بحث ها را در مورد ایمنی هوش مصنوعی برانگیخت. شرکت های امنیتی برای رسیدن به یک قرارداد جدید با اتحادیه SEIU-USWW که نماینده تقریباً 14000 افسر امنیتی"}, {"source": "Business Insider", "title": "What history says about how stocks will react to the Fed's long-awaited rate hike", "link": "https://www.businessinsider.com/rate-hikes-stock-market-reaction-fed-meeting-inflation-kevin-warsh-2026-9", "summary": "Win McNamee/Getty Images Markets are pricing in 92.7% odds of a rate hike on Wednesday. Goldman Sachs' analysis shows the S P 500 typically dips right after a hike, then rebounds. The index tends to bottom two to three months after an initial hike. Markets see the result of this week's Federal Reserve meeting as nearly a foregone conclusion, but the implications for markets are more up in the air. Markets are pricing about 93% odds of a rate hike at the end of the Fed's policy meeting on Wednesday. With inflation at 3.4%, long-term Treasury yields spiking, and a hawkish speech from Fed chair Kevin Warsh at Jackson Hole, investors feel confident that the next move for rates is up. But there are still questions around how Warsh and other Fed officials might signal next steps, given Warsh's disdain for \"forward guidance.\" Warsh has repeatedly talked tough about fighting inflation, but with the midterm elections just weeks away and President Donald Trump already putting pressure on Warsh to lower interest rates, it remains unclear just how hawkish he's willing to be. As for markets, investors tend to dislike rate hikes, but they may actually cheer one on this time as it would establish Warsh's credibility and his commitment to fighting inflation. If the Fed leaves rates unchanged, stocks could sell-off as investors might worry about inflation running too hot. Conversely, they might cheer the status quo, as rate hikes can weigh on earnings growth, the lifeblood of stocks. With such high odds of a rate hike priced in, Goldman Sachs, in a client note on Friday, looked at how stocks have historically behaved after the start of a Fed hiking cycle. On average going back to 1988, the S P 500 has sold off after the first rate hike. The index's median return almost three months after the hike has been roughly -4%, while the average return has bottomed around -4% about two months after the initial hike. That suggests the two-to-three-month mark after the first hike would be the optimal time to buy any dip in the market. By six months after the hike, both the median and average returns have been back in positive territory. Goldman Sachs By the 12-month mark, the median return for the S P 500 has been 9%. Goldman said stocks tend to bottom out and recover once investors see an end to the policy-tightening cycle ahead. Since the market is already pricing in a few hikes, stocks shouldn't suffer a major sell-off, the bank said. \"Equities typically struggle when the Fed start", "date_str": "2026-09-15T17:18:25+00:00", "hash": "a59218a10ca66caf", "title_fa": "تاریخچه در مورد واکنش سهام به افزایش نرخ بهره که مدت ها انتظارش را می کشید فدرال رزرو می گوید", "summary_fa": "Win McNamee/Getty Images بازارها با احتمال 92.7 درصد افزایش نرخ در روز چهارشنبه قیمت گذاری می کنند. تجزیه و تحلیل گلدمن ساکس نشان می‌دهد که S P 500 معمولاً بلافاصله پس از یک صعود پایین می‌آید و سپس دوباره به عقب می‌افتد. این شاخص دو تا سه ماه پس از افزایش اولیه به پایین‌تر می‌رود. بازارها نتیجه نشست این هفته فدرال رزرو را تقریباً یک نتیجه قطعی می‌دانند، اما پیامدهای آن برای بازارها بیشتر آشکار است. بازارها در پایان جلسه سیاست گذاری فدرال رزرو در روز چهارشنبه حدود 93 درصد احتمال افزایش نرخ بهره را قیمت گذاری می کنند. با توجه به تورم 3.4 درصدی، بازده بلندمدت خزانه داری در حال افزایش است، و یک سخنرانی تندروانه از سوی کوین وارش، رئیس فدرال رزرو در جکسون هول، سرمایه گذاران مطمئن هستند که حرکت بعدی نرخ ها در حال افزایش است. اما هنوز سوالاتی در مورد اینکه چگونه وارش و سایر مقامات فدرال رزرو ممکن است اقدامات بعدی را با توجه به بیزاری وارش از \"راهنمایی رو به جلو\" نشان دهند، وجود دارد. وارش بارها در مورد مبارزه با تورم سخت صحبت کرده است، اما با توجه به اینکه انتخابات میان دوره ای چند هفته دیگر باقی مانده است و رئیس جمهور دونالد ترامپ از قبل بر وارش برای کاهش نرخ بهره فشار آورده است، هنوز مشخص نیست که او چقدر می خواهد جنگ طلب باشد. در مورد بازارها، سرمایه گذاران تمایل دارند افزایش نرخ را دوست نداشته باشند، اما ممکن است در این زمان یکی را تشویق کنند زیرا اعتبار وارش و تعهد او به مبارزه با تورم را تثبیت می کند. اگر فدرال‌رزرو نرخ‌ها را بدون تغییر بگذارد، سهام می‌تواند فروخته شود زیرا سرمایه‌گذاران ممکن است نگران افزایش بیش از حد تورم باشند. برعکس، آنها ممکن است وضعیت موجود را تشویق کنند، زیرا افزایش نرخ ها می تواند بر"}, {"source": "Business Insider", "title": "Anthropic says it created an AI 'starter pack' for small businesses", "link": "https://www.businessinsider.com/anthropic-ai-starter-pack-for-small-businesses-2026-9", "summary": "Anthropic s developer conference in May. Don Feria/AP Content Services for Anthropic Anthropic is rolling out new features and workshops for its small-business product. It's a big opportunity; small and medium-sized businesses account for almost half of the US's GDP. Small businesses using AI say they've faced some backlash from customers for using the tool. Anthropic sold corporate giants on Claude. Now the AI company is in an all-out blitz for the mom-and-pops. In May, Anthropic launched an AI tool specifically for small businesses. Since then, it says it's garnered 900,000 installations for the Claude for Small Business plugin and is angling to expand the tool's reach. It's planning a new slate of workshops to boost its adoption, and training people to spread the Claude gospel. As Anthropic prepares for its initial public offering, small businesses present a major opportunity for mass adoption: In the US, they employ more than 45% of the private sector's workers and account for around 44% of the country's GDP, according to data from the US Small Business Administration. And the share of small businesses that use generative AI jumped from 23% in 2023 to 58% in 2025, according to a survey by the Chamber of Commerce. Unlike Anthropic's coding clientele , small businesses have small budgets — and different demands and anxieties. Small firms are caught between AI sales pitches on one side and backlash against the technology on the other. Business owners told Business Insider they've faced concerns from customers for using AI and also found helpful ways to use the technology behind the scenes. The Claude for Small Business tool handles a range of tasks for small businesses, such as reconciling finances through a company's QuickBooks account. On Tuesday, Anthropic added new plugins from companies like Shopify, Stripe, and Zoom. Lina Ochman, Anthropic's head of US small and medium businesses, called the tool \"an agentic starter pack.\" Now, Anthropic is creating a cascade of AI-focused workshops and quasi-influencers of the tool. It held its first sessions in San Francisco and New York last week to train people to become \"Approved Claude SMB Trainers,\" who have to commit to hosting five workshops for small- and medium-sized businesses by the end of the year. Anthropic's biggest rival, OpenAI, also introduced a program for small businesses this year, as these labs compete for their share of mom-and-pop shops. Small businesses say they've gotten some backlash for ", "date_str": "2026-09-15T17:01:01+00:00", "hash": "ecc9bb4b5880c7f1", "title_fa": "آنتروپیک می گوید که یک «بسته آغازین» هوش مصنوعی برای کسب و کارهای کوچک ایجاد کرده است", "summary_fa": "کنفرانس توسعه دهندگان Anthropic در ماه می. Don Feria/AP Content Services for Anthropic Anthropic در حال راه اندازی ویژگی ها و کارگاه های جدید برای محصول تجاری کوچک خود است. این یک فرصت بزرگ است؛ کسب و کارهای کوچک و متوسط ​​تقریباً نیمی از تولید ناخالص داخلی ایالات متحده را تشکیل می دهند. کسب‌وکارهای کوچکی که از هوش مصنوعی استفاده می‌کنند می‌گویند که با واکنش‌های منفی مشتریان برای استفاده از این ابزار مواجه شده‌اند. آنتروپیک غول های شرکتی را در کلود فروخت. در حال حاضر شرکت هوش مصنوعی در یک راهپیمایی همه جانبه برای مادران و پاپ ها قرار دارد. در ماه می، Anthropic یک ابزار هوش مصنوعی را به طور خاص برای مشاغل کوچک راه اندازی کرد. از آن زمان، می گوید که 900000 نصب برای پلاگین Claude for Small Business جمع آوری کرده است و در تلاش است تا دسترسی این ابزار را افزایش دهد. این سازمان در حال برنامه‌ریزی مجموعه‌ای از کارگاه‌های آموزشی برای تقویت پذیرش آن، و آموزش افراد برای گسترش انجیل کلود است. همانطور که آنتروپیک برای عرضه اولیه عمومی خود آماده می شود، کسب و کارهای کوچک فرصت بزرگی را برای پذیرش انبوه ارائه می دهند: طبق داده های اداره تجارت کوچک ایالات متحده، در ایالات متحده، بیش از 45٪ از کارگران بخش خصوصی را استخدام می کنند و حدود 44٪ از تولید ناخالص داخلی کشور را تشکیل می دهند. طبق نظرسنجی اتاق بازرگانی، سهم مشاغل کوچکی که از هوش مصنوعی مولد استفاده می کنند از 23 درصد در سال 2023 به 58 درصد در سال 2025 افزایش یافته است. برخلاف مشتریان کدنویسی آنتروپیک، کسب‌وکارهای کوچک بودجه‌های کمی دارند - و خواسته‌ها و اضطراب‌های متفاوتی دارند. شرکت‌های کوچک از یک طرف بین فروش هوش مصنوعی و از طرف دیگر در برابر این فناوری گیر کرده‌اند. صاحبان مشاغل به Business Insider گفته اند که با"}, {"source": "Business Insider", "title": "We've been to 35 countries and countless cities with our kids. There are 4 cities we'd bring them back to.", "link": "https://www.businessinsider.com/best-places-to-travel-with-kids-international-cities-countries-2026-9", "summary": "Da Nang, Vietnam, is one of my favorite places I ve visited with my kids. Maggie Sukhwani My husband and I love traveling, and we've brought our two sons to 35 countries. Our favorite places to visit with the kids have great food and tons of family-friendly activities. We'd definitely bring our sons back to Lyon, Turin, Busan, and Da Nang. My husband and I have been traveling internationally with our boys since they were each 10 months old. Now, they're 9 and 11 — and together, we've visited 35 countries and countless cities. Our favorites tend to have a few things in common: great food, fewer crowds, rich culture, and plenty of things to do as a family. If you are looking to travel with kids and venture beyond the usual tourist hot spots, there are four cities I'd wholeheartedly recommend. Lyon is considered France s food capital, and it didn t disappoint. captiontk lyon Maggie Sukhwani I believe that even the pickiest eaters will love Lyon's delicious pastries (especially brioche aux pralines roses, a buttery pastry studded with candied pink nuts) and shockingly affordable Michelin-level dining. We had one of the best meals of our lives at Brocoli: The five-course vegetarian tasting menu was only 40 euros per person. As much as we loved eating our way through Lyon, the city itself was just as much fun to explore. Old Lyon is beautiful and has a hidden network of covered passageways called traboules. These passageways cut through Old Lyon's buildings, shops, and courtyards. We spent an afternoon knocking on random doors and cheering every time one opened up into a secret shortcut, quickly turning a walk into a full-blown scavenger hunt. The Cinema and Miniature Museum was another highlight, with a massive collection of original movie props from blockbusters like \"Batman,\" \"Star Wars,\" and more. Standing inches away from the original Batmobile was definitely a core memory for my boys! Beyond Lyon, an easy day trip to the beautiful Lake Annecy gave us a welcome break from the July heat. We rented a boat, swam in the sparkling blue lake, and made it back to Lyon in time for yet another delicious dinner. Turin, Italy, brought us cars, mummies, and happy tummies. captiontk turin Maggie Sukhwani If your kids love pasta, pizza, and gelato, Italy is an obvious choice. Rome, Florence, and Venice are popular with families, but I'd suggest skipping those hot spots for their less famous, equally impressive cousin: Turin. Turin has excellent food, beautiful piazzas, a", "date_str": "2026-09-15T16:26:30+00:00", "hash": "368951c0955b3c1c", "title_fa": "ما با بچه هایمان به 35 کشور و شهرهای بی شماری رفته ایم. 4 شهر وجود دارد که ما آنها را به آنها برمی گردانیم.", "summary_fa": "دا نانگ، ویتنام، یکی از مکان های مورد علاقه من است که با بچه هایم از آن بازدید کرده ام. مگی سوخوانی من و شوهرم عاشق سفر هستیم و دو پسرمان را به 35 کشور آورده ایم. مکان های مورد علاقه ما برای بازدید با بچه ها دارای غذاهای عالی و تعداد زیادی فعالیت خانوادگی است. ما قطعاً پسرانمان را به لیون، تورین، بوسان و دا نانگ باز می‌گردانیم. من و شوهرم از 10 ماهگی با پسرانمان به سفرهای بین المللی رفته ایم. اکنون، آنها 9 و 11 هستند - و با هم، از 35 کشور و شهرهای بی‌شماری بازدید کرده‌ایم. غذاهای مورد علاقه ما معمولاً چند چیز مشترک دارند: غذای عالی، جمعیت کمتر، فرهنگ غنی و کارهای زیادی که باید به عنوان یک خانواده انجام دهیم. اگر به دنبال سفر با بچه‌ها و سرمایه‌گذاری فراتر از مناطق معمولی توریستی هستید، چهار شهر وجود دارد که از صمیم قلب توصیه می‌کنم. لیون به عنوان پایتخت غذایی فرانسه در نظر گرفته می شود و ناامید نشد. captiontk lyon Maggie Sukhwani من معتقدم که حتی پرمصرف‌ترین افراد هم شیرینی‌های خوشمزه لیون (مخصوصاً گل رز بریوش آکس پرالین، شیرینی کره‌ای پر شده با آجیل صورتی شیرین) و ناهارخوری‌های مقرون به صرفه در سطح میشلین را دوست خواهند داشت. ما یکی از بهترین وعده های غذایی زندگی خود را در بروکلی خوردیم: منوی طعم گیاهی پنج غذای برای هر نفر تنها 40 یورو بود. همانطور که ما عاشق غذا خوردن در مسیر لیون بودیم، خود شهر هم برای کاوش بسیار سرگرم کننده بود. لیون قدیم زیبا است و دارای یک شبکه مخفی از گذرگاه های سرپوشیده به نام ترابول است. این گذرگاه ها از میان ساختمان ها، مغازه ها و حیاط های لیون قدیمی عبور می کنند. ما یک بعدازظهر را با زدن درهای تصادفی گذراندیم و هر بار که یکی به میانبر مخفی"}, {"source": "Business Insider", "title": "I can't afford a Dior bag, so I tried their $325 massage instead. Here's what it was like.", "link": "https://www.businessinsider.com/dior-spa-massage-review-was-it-worth-it-2026-9", "summary": "Kimberly Wilson found a workaround to experience luxury. Kimberly Wilson Kimberly Wilson enjoyed the Dior Institut Spa in Hôtel Plaza Athénée in Paris. She felt like it was an affordable workaround to experience luxury after being laid off. Despite a locker room that felt out of place, she said the Dior spa experience was worth the cost. I'm a Christian Dior girl. I've had a love affair with the brand for years. Getting laid off this year hasn't changed that love, but it has changed what part of the brand I can afford. That is, of course, for the time being. Imagine my surprise when I found out that I could get a taste of luxury without the hefty price tag — with a massage at their spa. At Hôtel Plaza Athénée , the brand has reimagined its spa, located tucked two floors below the Parisian hotel. For roughly €260 (or roughly $325), I got a taste of the luxury brand without spending upward of $6,000 on a bag. Next to my actual bank account, it's still a splurge, but at least it's one I could actually pull off. And I did exactly that during my \"Eat, Pray, Love\" solo trip to Paris this past June. Dior s spa sits below Hôtel Plaza Athénée in Paris. Kimberly Wilson Luxury brands want customers to buy in beyond their products And it turns out Dior isn't the only one who's figured out that their fans want in on more than just bags, shoes, and the like. Louis Vuitton opened its first US restaurant in November 2024 on the fourth floor of its Fifth Avenue flagship, developed by a Michelin-starred chef. It serves what the brand calls \"luxury snacking.\" Gucci and Armani have done the same thing, opening their own restaurants instead of releasing just another bag or blazer. The math still works the same way it does at Dior: a meal or a coffee costs a fraction of what the clothes or accessories do, and it carries the same name. Prada also had its own café inside Harrods for three years. It closed that location this past June, then took the concept to Singapore. Inside Dior s spa. Kimberly Wilson What I loved about Dior's spa Hôtel Plaza Athénée sits on Avenue Montaigne, and it's incredibly hard to miss with the red awnings and rows of geraniums out front. Christian Dior staged his first show nearby in 1947, so the spa being tucked below the hotel isn't a random location; it's intentional. It fits the brand's actual history with one of the city's most iconic hotels. Once you go inside, the spa sits behind arched glass doors etched with a shell pattern, and the care put in", "date_str": "2026-09-15T16:24:42+00:00", "hash": "3f1ae625ccee3b61", "title_fa": "من توان خرید کیف دیور را ندارم، بنابراین ماساژ 325 دلاری آنها را امتحان کردم. اینطوری بود", "summary_fa": "کیمبرلی ویلسون راه حلی برای تجربه تجمل پیدا کرد. کیمبرلی ویلسون کیمبرلی ویلسون از اسپای موسسه Dior در هتل پلازا آتنه پاریس لذت برد. او احساس می کرد که این یک راه حل مقرون به صرفه برای تجربه تجمل پس از اخراج شدن است. علیرغم وجود اتاق رختکن که احساس می کرد در جای خود نیست، او گفت که تجربه اسپا دیور ارزش هزینه را دارد. من یک دختر کریستین دیور هستم. من سالها با این برند رابطه عاشقانه داشتم. اخراج شدن در این سال این عشق را تغییر نداده است، اما بخشی از برند را تغییر داده است که می توانم از پس آن بربیایم. که البته فعلاً همین است. تعجب من را تصور کنید وقتی متوجه شدم که می توانم طعم تجمل را بدون برچسب قیمت گزاف - با ماساژ در آبگرم آنها بچشم. در Hôtel Plaza Athénée، این برند آبگرم خود را که در دو طبقه زیر هتل پاریس قرار دارد، بازسازی کرده است. با تقریباً 260 یورو (یا تقریباً 325 دلار)، طعم این برند لوکس را بدون اینکه بیش از 6000 دلار برای یک کیف خرج کنم، چشیدم. در کنار حساب بانکی واقعی من، هنوز هم یک ولخرجی است، اما حداقل آن چیزی است که من واقعاً می توانم آن را انجام دهم. و من دقیقاً این کار را در طول سفر انفرادی \"بخور، دعا کن، عشق\" به پاریس در ژوئن گذشته انجام دادم. اسپای دیور در زیر هتل پلازا آتنه در پاریس قرار دارد. برندهای لوکس کیمبرلی ویلسون از مشتریان می خواهند که فراتر از محصولات آنها خرید کنند و معلوم شد که دیور تنها کسی نیست که متوجه شده است طرفداران آنها چیزی بیش از کیف، کفش و موارد مشابه را می خواهند. لویی ویتون اولین رستوران آمریکایی خود را در نوامبر 2024 در طبقه چهارم پرچمدار خیابان پنجم خود افتتاح کرد که توسط"}, {"source": "Business Insider", "title": "Stylists share 11 items you should get rid of from your wardrobe right now", "link": "https://www.businessinsider.com/fall-fashions-going-out-of-style-stylists-predictions-shoes-accessories-2026-9", "summary": "Certain styles will be especially trendy this fall, but others may be falling out of favor. Edward Berthelot/Getty Images We asked three stylists to share which wardrobe items people may want to reconsider this fall. Personality-driven pieces are replacing the quiet luxury trend, the experts said. Baggy and chunky styles could be getting a more refined update this fall. As the leaves begin to change, wardrobes tend to shift too. Although adding warmer tones and heavier layers may be typical updates, other parts of your cozy fall transformation may be worth reconsidering this season. Business Insider asked three professional stylists which wardrobe staples are starting to feel dated and what they recommend wearing instead. Here's what they had to say. Wearing baggy everything may not be in style this fall. Edward Berthelot/Getty Images According to Fred Kim , a New York-based stylist, wearing baggy clothing from head to toe is fading in popularity. There's no need to rid your closet of relaxed pieces entirely, though. Instead, the stylist recommends being more intentional about where you add volume. \"I think a modern approach would be just kind of getting rid of the oversized items and just keeping it a little more refined, or choose one area to create volume,\" Kim said. For instance, he recommends pairing a fitted T-shirt with a relaxed trouser or a straight-leg jean with a looser-fitting jacket. Consider replacing low ankle booties with taller boots. Some ankle boots could be challenging to style. Edward Berthelot/Getty Images Wardrobe stylist Rachel Varney said booties that dip down too low on the ankle are starting to feel outdated. \"I just think that maybe it's better to keep our ankles covered for the fall,\" Varney told BI. She also said booties with a side zipper can create an especially awkward gap between the shoe and the pants, which can create a less-flattering silhouette . Instead, the stylist recommends opting for boots that come up higher on the ankle. Sweaters with shoulder details could replace bulky cable-knits. You may want to save the chunkier knits for next season. Edward Berthelot/Getty Images Fashion is leaning away from dropped shoulders and oversized, bulky shapes in heavy-textured sweaters, said David Zyla , stylist and author of \"Color Your Style.\" Instead, the stylist recommends reaching for structured sweaters that bring the volume higher up on the body through more defined shoulder details. This might look like styles with \"buil", "date_str": "2026-09-15T16:19:52+00:00", "hash": "3908165f088f1750", "title_fa": "استایلیست ها 11 مورد را به اشتراک می گذارند که باید همین الان از کمد لباس خود خلاص شوید", "summary_fa": "برخی از سبک ها به خصوص در پاییز امسال مد روز خواهند بود، اما برخی دیگر ممکن است مورد توجه قرار نگیرند. ادوارد برتلو/گتی ایماژ از سه استایلیست خواستیم تا به اشتراک بگذارند که افراد ممکن است بخواهند در پاییز امسال در مورد کدام اقلام کمد لباس تجدید نظر کنند. به گفته کارشناسان، قطعات شخصیت محور جایگزین روند آرام لوکس شده اند. استایل‌های گشاد و درشت می‌توانند در پاییز امسال به‌روزرسانی دقیق‌تری دریافت کنند. همانطور که برگ ها شروع به تغییر می کنند، کمدها نیز تمایل دارند تغییر کنند. اگرچه افزودن رنگ‌های گرم‌تر و لایه‌های سنگین‌تر ممکن است به‌روزرسانی‌های معمولی باشد، سایر بخش‌های دگرگونی دنج پاییزی شما ممکن است ارزش بازنگری در این فصل را داشته باشند. Business Insider از سه استایلیست حرفه‌ای پرسید که کدام یک از کمد لباس‌ها شروع به قدیمی شدن کرده‌اند و به جای آن چه چیزی را توصیه می‌کنند. در اینجا چیزی است که آنها باید می گفتند. پوشیدن همه چیز گشاد ممکن است در پاییز امسال شیک نباشد. ادوارد برتلو/ گتی ایماژ به گفته فرد کیم، استایلیست نیویورکی، پوشیدن لباس های گشاد از سر تا پا در حال محو شدن است. با این حال، نیازی نیست که کمد خود را به طور کامل از شر قطعات آرام خلاص کنید. درعوض، آرایشگر توصیه می‌کند در مورد جایی که حجم اضافه می‌کنید بیشتر عمدی باشید. کیم گفت: «من فکر می‌کنم یک رویکرد مدرن فقط به نوعی خلاص شدن از شر اقلام بزرگ و کمی اصلاح‌تر نگه داشتن آن‌ها یا انتخاب یک ناحیه برای ایجاد حجم است. به عنوان مثال، او توصیه می کند که یک تی شرت مناسب را با یک شلوار راحت یا یک شلوار جین راسته با یک ژاکت گشاد ست کنید. چکمه های بلندتر را جایگزین چکمه های مچ پا پایین کنید. برخی از نیم بوت‌ها ممکن است برای استایل چالش برانگیز باشند."}, {"source": "Business Insider", "title": "Cable TV has shrunk from 100 million subscribers in 2016 to 62 million now. That decline may be over.", "link": "https://www.businessinsider.com/cable-tv-shrinking-subscriptions-sports-nfl-2026-09", "summary": "People keep their pay TV for things like sports, like watching Patrick Mahomes and the Kansas City Chiefs. Michael Owens/Getty Images Hard to believe, but not very long ago, more than 100 million people subscribed to pay TV in the US. That number has been shrinking for years and will probably be down to 50 million by 2030. The good news for the TV business: That 50 million number is probably going to be as low as it goes. The pay TV business has been shrinking year after year after year. But that continual collapse may be ending. Analysts at MoffettNathanson say they are finally seeing a \"floor\" at the bottom of the industry's long side. They think that by 2030, the industry will stay put at around 50 million US subscribers. That total includes traditional cable TV distributors like Comcast and Charter, as well as newish digital competitors like YouTube TV — which is on track to become the biggest pay TV company in America. And to be clear: Pay TV continues to shrink. MoffettNathanson says subscriber numbers fell by 4.6% in the second quarter of this year. But the trendline is looking up: That number was a 6.4% loss a year ago. MoffettNathanson The fact that the industry currently has about 62 million subscribers, or that it had 100 million subscribers in 2016, shows you what kind of battering Pay TV has endured. You have to be in real pain to consider a 50% drop over 14 years good news — if it finally stops there. Still, there are a couple lessons to learn from the end of the collapse, if it happens: Some people really like sports . Obvious but true: Even though NFL games — the most important programming on TV — as well as other live sports are partially migrating to streamers, you still need a pay TV subscription to watch the bulk of high-profile sports leagues in the US. Lots of people who don't care about that have already ditched pay TV, or never signed up for it. That leaves a meaningful audience that isn't going anywhere. The bundle is (kind of) back . After years spent atomizing the traditional cable TV bundle, distributors and programmers have been putting it back together, a bit: Distributors like Charter now frequently sell a package that includes traditional live TV networks and streamers like Paramount, Peacock, and Disney Plus, and people seem to like that. As MoffettNathanson notes, Charter was losing 10% of its subscriber base two years ago; now that decline is down to 1%. Read the original article on Business Insider", "date_str": "2026-09-15T16:05:40+00:00", "hash": "173178439283d605", "title_fa": "تلویزیون کابلی از 100 میلیون مشترک در سال 2016 به 62 میلیون در حال حاضر کاهش یافته است. این کاهش ممکن است تمام شده باشد.", "summary_fa": "مردم تلویزیون پولی خود را برای چیزهایی مانند ورزش، مانند تماشای پاتریک ماهومز و کانزاس سیتی چیفز نگه می دارند. باور مایکل اونز/ گتی ایماژ سخت است، اما نه چندان دور، بیش از 100 میلیون نفر مشترک تلویزیون پولی در ایالات متحده شدند. این عدد برای سال‌ها در حال کاهش بوده است و احتمالاً تا سال 2030 به 50 میلیون کاهش می‌یابد. خبر خوب برای تجارت تلویزیون: این عدد 50 میلیونی احتمالاً به همان اندازه کم خواهد بود. کسب و کار تلویزیون پولی سال به سال در حال کاهش است. اما این فروپاشی مداوم ممکن است پایان یابد. تحلیلگران MoffettNathanson می گویند که بالاخره یک \"طبقه\" را در انتهای بخش طولانی صنعت می بینند. آنها فکر می کنند که تا سال 2030، این صنعت در حدود 50 میلیون مشترک ایالات متحده باقی خواهد ماند. این مجموع شامل توزیع کنندگان تلویزیون کابلی سنتی مانند Comcast و Charter و همچنین رقبای دیجیتالی جدید مانند YouTube TV می شود - که در مسیر تبدیل شدن به بزرگترین شرکت تلویزیون پولی در آمریکا است. و برای روشن شدن: تلویزیون پرداختی همچنان رو به کاهش است. Moffett Nathanson می گوید تعداد مشترکان در سه ماهه دوم سال جاری 4.6 درصد کاهش یافته است. اما روند رو به افزایش است: این رقم یک سال پیش 6.4 درصد زیان داشت. MoffettNathanson این واقعیت که این صنعت در حال حاضر حدود 62 میلیون مشترک دارد، یا اینکه در سال 2016 دارای 100 میلیون مشترک بود، به شما نشان می دهد که چه نوع کتک کاری تلویزیون پرداخت را تحمل کرده است. برای در نظر گرفتن کاهش 50 درصدی در طول 14 سال یک خبر خوب - اگر بالاخره به همین جا متوقف شود، باید واقعاً درد داشته باشید. با این حال، اگر این فروپاشی اتفاق بیفتد، چند درس باید یاد گرفت: برخی از مردم واقعاً ورزش را دوست"}, {"source": "Business Insider", "title": "Why JPMorgan says the US economy can withstand surging oil prices", "link": "https://www.businessinsider.com/oil-prices-100-us-economy-impact-inflation-outlook-jpmorgan-2026-9", "summary": "Bloomberg/Getty Images Oil prices have jumped back above $100 a barrel, but the US economy can take it, JPMorgan Private Bank says. That's because gas prices as a percentage of disposable income remain near a historic low. The stock market is also showing resilience in the face of the oil shock, the bank said. Surging oil prices have long been anathema to markets and the economy, but the latest shock may not matter as much this time around, JPMorgan Private Bank says. Oil spiked back back above the $100-a-barrel mark last week, an important psychological threshold that has come to signal energy-market stress. Brent crude , the international benchmark, surpassed $100 for the first time since July last week, and has continued to rise in recent day, trading around $107 a on Tuesday. West Texas intermediate crude also rose, hovering around $103 a barrel. The $100 mark has been a clear line of demarcation during the Iran war, with oil fluttering above or below the level as peace hopes have waxed and waned during the six-month conflict. After years of historically low oil prices, it also signals brewing pressure for markets and the economy. Yet, the threshold may simply not be as meaningful as it once was, Kriti Gupta, a global investment strategist at JPMorgan, said. She pointed to the cost of gas as a percentage of total disposable income, which is near historic lows. Americans spend an average 2.5% of their income at the pump, down from over 6% during the oil price shock of the 1970s and 1980s. An inflationary shock like what Americans saw in the early 1980s would be the equivalent of gas prices rising above $10 a gallon today, the bank estimated, pointing to protective factors like consumers having extra cash buffers and lower debt levels today. \"After several rounds of fiscal stimulus, tariff refunds and tax cuts, households have largely deleveraged to multi-decade lows, creating a larger buffer against higher prices,\" Gupta wrote. \"The same gasoline price increase that would have meaningfully squeezed household budgets two decades ago, or even four years ago, now represents a materially smaller drag on spending power,\" she added, referring to the crude price shocks of the early 2000s and in the early days of the Russia-Ukraine war. US markets also look more resilient in the face of higher oil prices, the bank said. Though the S P 500 has looked \"increasingly sensitive\" to the price of crude, investors are looking into Middle East supply disruptions with mo", "date_str": "2026-09-15T15:45:38+00:00", "hash": "c403ce26fbe8f247", "title_fa": "چرا جی پی مورگان می گوید اقتصاد ایالات متحده می تواند در برابر افزایش قیمت نفت مقاومت کند؟", "summary_fa": "بانک خصوصی جی پی مورگان می گوید قیمت نفت به بالای 100 دلار در هر بشکه رسیده است، اما اقتصاد ایالات متحده می تواند آن را تحمل کند. به این دلیل که قیمت بنزین به عنوان درصدی از درآمد قابل تصرف نزدیک به پایین ترین حد تاریخی باقی می ماند. این بانک اعلام کرد: بازار سهام نیز در برابر شوک نفتی مقاومت نشان می دهد. بانک خصوصی جی‌پی مورگان می‌گوید افزایش قیمت نفت مدت‌هاست که برای بازارها و اقتصاد مضر است، اما شوک اخیر ممکن است این بار چندان مهم نباشد. نفت هفته گذشته دوباره به بالای 100 دلار در هر بشکه صعود کرد، یک آستانه روانی مهم که نشان دهنده استرس بازار انرژی است. نفت خام برنت، معیار بین المللی، برای اولین بار از ژوئیه هفته گذشته از 100 دلار گذشت و در روز اخیر به افزایش خود ادامه داد و در روز سه شنبه حدود 107 دلار در هر دلار معامله شد. قیمت نفت خام غرب تگزاس اینترمدیت نیز افزایش یافت و در حدود 103 دلار در هر بشکه بود. مارک 100 دلاری خط مشخصی برای مرزبندی در طول جنگ ایران بوده است، در حالی که امیدهای صلح در طول درگیری شش ماهه کاهش یافته و کاهش یافته است. پس از سال‌ها قیمت‌های پایین تاریخی نفت، این نشان‌دهنده فشار برای بازارها و اقتصاد است. کریتی گوپتا، یک استراتژیست سرمایه گذاری جهانی در JPMorgan، گفت: با این حال، ممکن است آستانه به سادگی به اندازه گذشته معنادار نباشد. او به هزینه گاز به عنوان درصدی از کل درآمد قابل تصرف اشاره کرد که نزدیک به پایین ترین سطح تاریخی است. آمریکایی ها به طور متوسط ​​2.5 درصد از درآمد خود را در پمپ خرج می کنند که از بیش از 6 درصد در طول شوک قیمت نفت در دهه های 1970 و 1980 کاهش یافته است. این بانک تخمین"}, {"source": "Business Insider", "title": "I work with AI every day. Then I go home and try to help my 14-year-old plan a future I can't picture.", "link": "https://www.businessinsider.com/ai-future-jobs-teen-career-college-parenting-2026-9", "summary": "The author is helping her 14-year-old stepdaughter plan for her future. Courtesy of the author I want my stepdaughter to explore subjects and careers that genuinely interest her. My work makes me acutely aware of how quickly AI is changing jobs and education. I'm trying not to evaluate every interest she has based on whether AI could replace it. My stepdaughter is 14, which means we are entering the phase of parenting where everyone suddenly expects her to have opinions about her future. What classes does she want to take? What is she good at? Does she want to go to college? What kind of job might she want someday? These are normal questions. We ask them because that is what you do with teenagers — you start helping them picture adulthood . The problem is that I am having an increasingly hard time picturing it for her. I research AI for work Much of my professional life is spent researching and writing about AI , which has gone from an unsettling side conversation about the death of blogging and copywriting careers to something that touches nearly every aspect of our lives. Then I go home and help raise a kid who will enter college and the workforce after all of these institutions have had several more years to rearrange themselves around AI. I am, in other words, probably more plugged into this stuff than is good for me. The author uses AI on a daily basis at work. Courtesy of the author I use AI every day at work. It's mandatory. I see what it can do well, what it still does terribly, and how quickly the gap between the two keeps changing. I read the research and follow the product releases. I watch businesses try to figure out what any of it means and watch my students figure out where the line is between using a tool and outsourcing their own brains. Despite all that exposure — or maybe because of it — I am anxious. Last week, an Anthropic safety researcher said he puts the chance of AI killing everyone within the next decade at greater than 10%. If someone told me there was a greater than 10% chance a plane I was about to board would crash, I would not get on the plane. If someone tells me there is a greater than 10% chance AI kills humanity , I am supposed to read the article, close my laptop, and then proceed to ask a teenager whether she has thought about where she wants to go to college while making sure she eats enough vegetables and doesn't drink too much caffeine (add energy drinks to my list of existential threats). I grew up watching movies a", "date_str": "2026-09-15T15:37:57+00:00", "hash": "004fae3de6924422", "title_fa": "من هر روز با هوش مصنوعی کار می کنم. سپس به خانه می روم و سعی می کنم به کودک 14 ساله ام کمک کنم تا آینده ای را طراحی کند که نمی توانم آن را تصور کنم.", "summary_fa": "نویسنده به دخترخوانده 14 ساله خود کمک می کند تا برای آینده خود برنامه ریزی کند. با حسن نیت از نویسنده، من می خواهم دختر ناتنی ام موضوعات و مشاغلی را که واقعاً به او علاقه مند است، کشف کند. کار من باعث می شود که هوش مصنوعی به سرعت شغل و تحصیلات را تغییر دهد. من سعی می‌کنم هر علاقه‌ای را که او دارد بر این اساس ارزیابی نکنم که آیا هوش مصنوعی می‌تواند جایگزین آن شود. دختر ناتنی من 14 ساله است، یعنی ما وارد مرحله فرزند پروری می شویم که ناگهان همه انتظار دارند او درباره آینده خود نظر داشته باشد. او در چه کلاس هایی می خواهد شرکت کند؟ او در چه کاری خوب است؟ آیا او می خواهد به دانشگاه برود؟ چه نوع شغلی ممکن است روزی بخواهد؟ اینها سوالات عادی هستند. ما از آنها می‌پرسیم، زیرا این همان کاری است که شما با نوجوانان انجام می‌دهید - شما شروع به کمک به آنها در تصویر بزرگسالی می‌کنید. مشکل این است که من به طور فزاینده ای برای او به سختی تصویر می کنم. من برای کار در مورد هوش مصنوعی تحقیق می کنم بیشتر زندگی حرفه ای من صرف تحقیق و نوشتن در مورد هوش مصنوعی می شود، که از یک گفتگوی جانبی ناراحت کننده در مورد مرگ مشاغل وبلاگ نویسی و کپی رایتینگ به چیزی تبدیل شده است که تقریباً همه جنبه های زندگی ما را تحت تأثیر قرار می دهد. سپس به خانه می‌روم و به بزرگ‌کردن بچه‌ای کمک می‌کنم که بعد از اینکه همه این مؤسسات چندین سال دیگر فرصت داشتند تا خود را پیرامون هوش مصنوعی تنظیم کنند، وارد کالج و نیروی کار شود. به عبارت دیگر، احتمالاً بیشتر از آنچه برای من خوب است به این چیزها متصل هستم. نویسنده از هوش مصنوعی به صورت روزانه در محل کار"}, {"source": "Business Insider", "title": "Former Google DeepMind researcher says he resigned because 'I earnestly believe that AI has the potential to kill us all'", "link": "https://www.businessinsider.com/google-deepmind-researcher-resigns-ai-kill-humans-2026-9", "summary": "A Google DeepMind researcher cited fears about AI in his decision to resign from the company. Matteo Della Torre/NurPhoto via Getty Images A former DeepMind researcher is also concerned about AI potentially killing us all. Bilal Chughtai said he's \"extremely concerned by the default trajectory of this technology.\" What do you think about the conversation around AI safety? A former Google DeepMind researcher said he left the AI lab over fears that AI \"has the potential to kill us all\" and humanity \"might be running out of time to avoid this outcome.\" \"At Google, I witnessed AI development first hand,\" Bilal Chughtai wrote in a statement that he posted on X and other platforms. \"I too am extremely concerned by the default trajectory of this technology.\" I recently resigned from Google DeepMind, where I worked on AGI safety and alignment research. At Google, I witnessed AI development first hand. I too am extremely concerned by the default trajectory of this technology. I earnestly believe that AI has the potential to kill us… — bilal 🔶 (@bilalchughtai_) September 14, 2026 Chughtai's comments come after former Anthropic researcher Jacob Coxon reignited focus on AI safety with his own viral post, which warned that employees at AI companies privately fear the technology could wipe out humanity. While some in the industry have criticized Coxon, others at Anthropic and OpenAI have echoed his concerns. Over the weekend, Anthropic CEO Dario Amodei said frontier AI labs need \"to pace\" development while using the time to advance alignment. SpaceX CEO Elon Musk and OpenAI CEO Sam Altman later expressed agreement with that broad view. Alignment, the work to ensure AI systems' goals and behavior comply with their instructions, has proven to be difficult, Chughtai wrote. \"Our present understanding of how to train AI systems that deeply want what we want is extremely rudimentary,\" he wrote. \"Worse, we are not on track to solve alignment in time: frontier AI capabilities are improving much faster than our understanding of AI alignment.\" Chughtai said that episodes like OpenAI's rogue agents hacking Hugging Face underline the risks of misaligned AI models, particularly if AI companies can build models that surpass human intelligence. He said that \"it's possible\" companies could build such systems that \"that far exceed human capabilities in every domain\" in \"the next few years.\" \"I am not confident that these AI systems will do what we want,\" he wrote. Chughtai's LinkedIn pr", "date_str": "2026-09-15T15:35:15+00:00", "hash": "2afdc58dec08b414", "title_fa": "محقق سابق گوگل دیپ‌مایند می‌گوید استعفا داده است زیرا \"من عمیقاً معتقدم که هوش مصنوعی توانایی کشتن همه ما را دارد.\"", "summary_fa": "یکی از محققان گوگل دیپ مایند در تصمیم خود برای استعفا از این شرکت به ترس از هوش مصنوعی اشاره کرد. Matteo Della Torre/NurPhoto via Getty Images یک محقق سابق DeepMind نیز نگران این است که هوش مصنوعی به طور بالقوه همه ما را بکشد. بلال چغتای گفت که او \"به شدت نگران مسیر پیش فرض این فناوری است.\" نظر شما در مورد گفتگو پیرامون ایمنی هوش مصنوعی چیست؟ یکی از محققین سابق گوگل دیپ مایند گفت که آزمایشگاه هوش مصنوعی را به دلیل ترس از این که هوش مصنوعی \"پتانسیل کشتن همه ما را دارد\" و بشریت \"ممکن است برای جلوگیری از این نتیجه کمبود زمان داشته باشد\" را ترک کرد. بلال چغتای در بیانیه‌ای که در X و دیگر پلتفرم‌ها منتشر کرد، نوشت: «در گوگل، من از نزدیک شاهد توسعه هوش مصنوعی بودم. \"من نیز به شدت نگران مسیر پیش فرض این فناوری هستم.\" من اخیراً از Google DeepMind استعفا دادم، جایی که در تحقیقات ایمنی و تراز AGI کار می کردم. در گوگل، من شاهد توسعه هوش مصنوعی دست اول بودم. من نیز به شدت نگران مسیر پیش فرض این فناوری هستم. من عمیقاً معتقدم که هوش مصنوعی این پتانسیل را دارد که ما را بکشد… — bilal 🔶 (@bilalchughtai_) ۱۴ سپتامبر ۲۰۲۶، اظهارات Chughtai پس از آن مطرح شد که محقق سابق Anthropic، Jacob Coxon، با پست ویروسی خود دوباره بر ایمنی هوش مصنوعی تمرکز کرد، که هشدار داد کارکنان شرکت‌های هوش مصنوعی می‌توانند به طور خصوصی از فناوری بشری ترس داشته باشند. در حالی ک
