 واقع تبدیل به Frightbox می شود. داستان‌های مرتبط بازنویسی‌های تیم Lanterns درباره نحوه بازی Theme Of Fear در فینال فصل بحث می‌کند، میکس سوگند و سرنوشت ارل Late Night TV در زمان واقعی: بیل ماهر به رئیس‌های جدید Skydance می‌گوید باور نکنید ترامپ درباره من توییت می‌کند. Ghost Story و Frightbox حتی می توانند به یک برچسب فرعی تمام عیار تبدیل شوند اگر حرکت به سمت وحشت نتیجه دهد. Watch on Deadline Clown Panic اولین پروژه Lightbox/Frightbox بود که معرفی شد. سند ویژگی Hulu به عنوان بخشی از Huluween پخش خواهد شد. این هیستری ناشی از موجی از مشاهده های دلقک را دوباره مرور می کند. این فیلم که به‌عنوان تاریک خنده‌دار و ناراحت‌کننده شناخته می‌شود، داستان جنون رسانه‌ای و وحشت اخلاقی ناشی از گسترش داستان را روایت می‌کند. جاناتان چین گفت، این داستانی بود که بسیار عجیب بود، اما در مورد روانشناسی و ژئوپلیتیک انسان نیز بسیار آشکار بود. اساساً، آناتومی یک وحشت اخلاقی است."}, {"source": "Netflix NL", "title": "Maker Yellowstone juicht: nieuwe westernserie op Netflix", "link": "https://www.netflix-nederland.nl/maker-yellowstone-juicht-nieuwe-westernserie-op-netflix/", "summary": "Taylor Sheridan, de maker van de Yellowstone-franchise, en schrijver Stephen King hebben hetzelfde favoriete westernboek. En precies dat westernboek wordt nu omgeturnd tot een serie op Netflix! Het favoriete westernverhaal van Taylor Sheridan komt naar Netflix Het gaat om Lonesome Dove van Larry McMurtry, dat in 1989 al leidde tot een miniserie met onder meer Robert Duvall en Tommy Lee Jones (deze show is het kijken waard, want hij krijgt een 8,6 op IMDb). Lonesome Dove speelt zich af in het Amerikaanse Westen aan het einde van de negentiende eeuw. Centraal staan Augustus Gus McCrae en Woodrow F. Call, twee voormalige Texas Rangers die hun avontuurlijke jaren grotendeels achter zich hebben liggen. Wanneer Call het plan opvat om een enorme kudde vee van Texas naar Montana te drijven, besluiten de twee nog één keer op pad te gaan. Ze hopen in het vrijwel onontgonnen Montana een ranch op te bouwen. De tocht van duizenden kilometers blijkt al snel veel zwaarder dan verwacht. De groep trekt door uitgestrekte en soms vijandige gebieden, waar achter iedere bocht nieuw gevaar kan wachten. Niet iedereen die vanuit Lonesome Dove vertrekt, zal uiteindelijk Montana bereiken. Vooral de relatie tussen Gus en Call vormt de rode draad van het verhaal. Jeb Stuart en Zoe Kazan moeten dit verhaal nu naar Netflix brengen, en Kazan zegt tegen ScreenRant: We vinden elkaar echt in onze wens om op een set te werken waar mensen met plezier rondlopen en om producties op het allerhoogste niveau te maken. We willen verhalen vertellen die mensen op een menselijk niveau weten te raken. Volgens mij zijn we allebei echte probleemoplossers. We zijn het type dat de mouwen opstroopt, aan de slag gaat en zich overal volledig in stort. Dat werkt gewoon heel goed. Ik vind het behoorlijk intimiderend om Lonesome Dove te bewerken, maar ik denk dat het juist goed is om vanuit dat gevoel aan dit project te beginnen. Het gaat nog wel eventjes duren voordat Lonesome Dove daadwerkelijk uitkomt op de streamingdienst, maar Taylor Sheridan en Stephen King kijken er al naar uit! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Maker Yellowstone juicht: nieuwe westernserie op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-05T13:58:01+00:00", "hash": "179a946594cf2b04", "title_fa": "Maker Yellowstone Cheers: سریال جدید وسترن در نتفلیکس", "summary_fa": "تیلور شریدان، خالق فرنچایز یلوستون، و نویسنده استیون کینگ، همان کتاب وسترن مورد علاقه را دارند. و دقیقاً آن کتاب وسترن در حال تبدیل شدن به سریال در نتفلیکس است! داستان وسترن مورد علاقه تیلور شریدان به نتفلیکس می آید. این سریال Lonesome Dove اثر لری مک مورتری است که در سال 1989 منجر به ساخت یک مینی سریال با رابرت دووال و تامی لی جونز شد (این سریال ارزش دیدن را دارد، زیرا در IMDb امتیاز 8.6 دریافت می کند). فیلم Lonesome Dove در غرب آمریکا در پایان قرن نوزدهم اتفاق می‌افتد. در مرکز، آگوستوس گاس مک‌کری و وودرو اف کال، دو رنجر سابق تگزاس هستند که تا حد زیادی سال‌های پرماجرا خود را پشت سر گذاشته‌اند. وقتی کال قصد دارد یک گله بزرگ گاو را از تگزاس به مونتانا براند، آن دو تصمیم می‌گیرند برای آخرین بار بیرون بروند. آنها امیدوارند که یک مزرعه در مونتانای تقریباً توسعه نیافته بسازند. سفر هزاران کیلومتری به زودی بسیار سخت تر از حد انتظار می شود. این گروه در مناطق وسیع و گاهی متخاصم سفر می کند، جایی که خطر جدیدی در اطراف هر پیچی در انتظار است. همه کسانی که از Lonesome Dove حرکت می کنند، در نهایت به مونتانا نمی رسند. رابطه بین گاس و کال به طور خاص موضوع مشترک داستان است. جب استوارت و زوئی کازان اکنون وظیفه دارند این داستان را به نتفلیکس بیاورند، و کازان به ScreenRant می‌گوید: ما واقعاً در آرزویمان برای کار روی مجموعه‌ای که مردم از بودن در کنار آن لذت می‌برند و خلق آثاری در بالاترین سطح، متحد می‌شویم. ما می‌خواهیم داستان‌هایی بگوییم که مردم را در سطح انسانی تحت تأثیر قرار دهد. من فکر می کنم که هر دوی ما حل کننده واقعی مشکلات هستیم. ما از آن دسته‌ای هستیم که آستین‌ها را بالا می‌زنیم، دست به کار می‌شویم و"}, {"source": "Netflix NL", "title": "Dit is het waargebeurde verhaal van Less of a Stranger (Mniej obcy)", "link": "https://www.netflix-nederland.nl/dit-is-het-waargebeurde-verhaal-van-less-of-a-stranger-mniej-obcy/", "summary": "Less of a Stranger is een waargebeurd verhaal. Vanaf oktober 2026 staat de film op Netflix en draait om het bijzondere leven van een muzikant, Jan Borysewicz van de rockband Lady Pank! Waargebeurd verhaal Less of a Stranger (Mniej obcy) Less of a Stranger (Mniej obcy) is overigens geen letterlijke biografie, maar een film die geïnspireerd is op het leven van Jan Borysewicz, gitarist, componist en oprichter van de beroemde Poolse rockband Lady Pank. Hier en daar wordt er dus een loopje genomen met het waargebeurde verhaal. Dit is het waargebeurde verhaal van Less of a Stranger (Mniej obcy) Borysewicz groeide op in Wrocław en raakte als jongen volledig in de ban van muziek. Een belangrijk moment was het ontdekken van Jimi Hendrix: Borysewicz vertelde later dat er iets in hem veranderde toen hij Hendrix voor het eerst hoorde. Vanaf dat moment wist hij dat hij muzikant wilde worden. Hij speelde vervolgens in verschillende bands en brak eind jaren zeventig door als gitarist van Budka Suflera, destijds al een belangrijke naam binnen de Poolse rockmuziek. Zijn grote ambitie was echter om een eigen band te beginnen. Samen met tekstschrijver Andrzej Mogielnicki richtte hij begin jaren tachtig Lady Pank op. Met zanger Janusz Panasewicz groeide de groep in razend tempo uit tot een fenomeen. Nummers als Mniej niż zero, Kryzysowa narzeczona, Wciąż bardziej obcy en Zamki na piasku werden grote hits. Alleen al in 1983 zou Lady Pank maar liefst 369 optredens hebben gegeven. Dat succes speelde zich af tegen de achtergrond van het communistische Polen. Voor Borysewicz stond rock- n-roll sterk voor vrijheid en de mogelijkheid om zijn leven op zijn eigen manier vorm te geven. Hij vertelde later dat veel Polen destijds droomden van een bestaan buiten het land. Zelf kreeg hij mogelijkheden om in het buitenland te blijven, waaronder in de Verenigde Staten, maar hij keerde uiteindelijk steeds terug naar Polen. Lady Pank kreeg zelfs voet aan de grond in Amerika. In de jaren tachtig nam de groep Engelstalig materiaal op en de videoclip van Minus Zero , de Engelstalige versie van Mniej niż zero, was op MTV te zien. Borysewicz heeft later gezegd dat een internationale doorbraak wellicht mogelijk was geweest als de groep het Engels beter beheerste en sterkere Engelse versies van de Poolse teksten had gehad. Incident in Wrocław Een berucht hoofdstuk uit zijn carrière vond plaats in 1986 tijdens een concert in Wrocław. Het concert werd georganiseerd ter gelegenheid van Kinderdag, waardo", "date_str": "2026-10-05T11:38:13+00:00", "hash": "e84788da09182a89", "title_fa": "این داستان واقعی کمتر غریبه (Mniej obcy) است.", "summary_fa": "کمتر غریبه یک داستان واقعی است. این فیلم از اکتبر 2026 در نتفلیکس در دسترس خواهد بود و حول م یکی به تنهایی اقتصاد را ویران کرد چند سال پیش، دموکرات‌ها در واشنگتن نموداری را منتشر می‌کردند که نشان می‌داد زمانی که آنها در راس امور هستند، اقتصاد همیشه بهتر عمل می‌کند و زمانی که جمهوری‌خواهان کاخ سفید را در دست دارند، بدتر از آن. این حداقل در چند دهه گذشته از نظر آماری درست است اما عمدتاً بی ربط است. و این به این دلیل است که چرخه‌های اقتصادی و ریاست‌جمهوری شبیه صفحات تکتونیکی متحرک هستند: آنها با هم همپوشانی دارند، اما تقریباً هرگز کاملاً همسو نمی‌شوند. رؤسای جمهور در واقع اقتصادهایی را ایجاد نمی کنند که به نام آنها متصل می شود. آنها فقط به آنها واکنش نشان می دهند، چه توانایی یا نه. چند دلیل برای این وجود دارد. اولین مورد این است که تحولات اقتصادی معمولاً خیلی قبل از اینکه مردم آن را احساس کنند در جریان است و سال ها طول می کشد تا داده ها به آنها برسد. در سال 1992، زمانی که جورج اچ. بوش برای انتخاب مجدد شرکت می کرد، تخمین زده می شد که اقتصاد، ربع به سه ماه، با نرخ هایی بین 1.4 تا 2.7 درصد رشد کرده است، شواهدی از رکود اقتصادی که به بیل کلینتون کمک کرد تا به پیروزی برسد. با این حال، سال‌ها بعد، اعداد اصلاح‌شده نشان دادند که نرخ‌های رشد، در حالی که ثابت بودند، در واقع به طور قابل‌توجهی بالای چهار درصد بوده‌اند و بهبود در حال انجام است. (در پایان سال اول کلینتون، رشد اقتصادی 5.6 درصد بود.) شما می توانید همین تمرین را برای سایر روسای جمهور اجرا کنید، و درس اساسی یکسان خواهد بود: ریاست جمهوری همیشه بر اساس روندهای اساسی که به ارث می برند، شکل می گیرند، حتی اگر در آن زمان قابل مشاهده نباشند. دلیل دوم این"}, {"source": "Rolling Stone", "title": "John Oliver Reacquires Russell Crowe’s Infamous Jock Strap: ‘We F-ucking Bought It Back’", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/john-oliver-russell-crowe-jock-strap-last-week-tonight-1235636701/", "summary": "The wardrobe item from Cinderella Man was initially donated to the last remaining Blockbuster Video in Alaska", "date_str": "2026-10-05T07:26:15+00:00", "hash": "d905f0adcb9bd2fc", "title_fa": "جان اولیور فیلم بدنام جوک بند راسل کرو را دوباره به دست می‌آورد: «ما به شدت آن را پس گرفتیم»", "summary_fa": "کمد لباس از مرد سیندرلا در ابتدا به آخرین ویدیوی پرفروش باقیمانده در آلاسکا اهدا شد. خبر عالی، طرفداران اواخر شب: جان الیور باز هم یک بند بند در اختیار دارد که راسل کرو برای مرد سیندرلا بسته بود. بند جوک چندین بار توسط مجری برنامه Last Week Tonight خریداری شده است و سابقه طولانی به عنوان یک جوک و یک نوع کالای خیریه دارد. الیور ابتدا این لباس زیر را در سال 2018 طی حراجی کرو به نام «هنر طلاق» خریداری کرد که شامل فروش بیش از 200 کالای بازیگر پس از طلاقش از دنیل اسپنسر بود. Last Week Tonight آن را به قیمت 7000 دلار خریداری کرد و در نهایت آن را به آخرین فروشگاه ویدیوی Blockbuster باقی مانده در Anchorage، آلاسکا اهدا کرد تا بتواند تجارت خود را تقویت کند. کرو گفت که سود حاصله را به باغ وحش استرالیا اهدا کرده است و گفته است که از این پول برای تامین مالی بخش کلامیدیا جان اولیور کوالا استفاده خواهد کرد. پس از بسته شدن فروشگاه ویدیوهای پرفروش در همان سال، جوک استرپ راه خود را به الیور باز کرد. او دوباره آن را با کرو در قسمتی در هفته گذشته امشب متحد کرد. در سال 2025، Last Week Tonight دوباره آن را برای کمک به جمع آوری بودجه برای ایستگاه های تلویزیونی و رادیویی عمومی به حراج گذاشت. این بار به قیمت 21000 دلار از یک خریدار ناشناس خریداری شد. بار دیگر در ماه آگوست به حراج رفت، جایی که شخصی 10000 دلار برای خرید بند جوک پرداخت کرد. آن شخص ظاهراً الیور بود. داستان‌های پرطرفدار ببینید جک بلک با اجرای گروه جلد سیاه سابث با جیزر باتلر در فستیوال Power to the People اد شیران خواننده سابق فری را به آتلانتا دعوت می‌کند تا نشان دهد زندگی متالیکا سریع‌تر می‌سوزد. پیت هگزث به زور او"}, {"source": "Rolling Stone", "title": "Aviator Nation’s NFL Collection Is the First Must-Have Collab of the New Football Season", "link": "https://www.rollingstone.com/product-recommendations/style/aviator-nation-nfl-collection-2026-shop-hoodies-sweatpants-1235636683/", "summary": "The collection features vintage-inspired T-shirts, hoodies, sweatpants and sweatshirts from 25 NFL teams", "date_str": "2026-10-05T02:46:56+00:00", "hash": "a66234541b0962f7", "title_fa": "مجموعه NFL Aviator Nation اولین همکاری ضروری در فصل جدید فوتبال است", "summary_fa": "این مجموعه دارای تی شرت های قدیمی، هودی، شلوار گرمکن و گرمکن ورزشی از 25 تیم NFL است. یکی از اولین قطعاتی که وقتی به کالیفرنیا نقل مکان کردم، خریدم، یک جفت شلوار ورزشی از Aviator Nation، برند پوشاک ساحلی ونیز بود که به‌خاطر عرق‌های الهام‌گرفته از سبک قدیمی و لباس‌های دنج و رنگارنگش معروف است. هر زمان که در خانه‌ام در زیر شیروانی خود در پایین خیابان از فروشگاه پرچمدار Aviator Nation در بلوار مدرن Abbot Kinney به خانه می‌رفتم، با آن شلوار ورزشی زندگی می‌کردم، و به زودی شلوارهای مورد علاقه‌ام برای برداشتن یک قهوه یا انجام امور در محله نیز تبدیل شدند. Aviator Nation که در سال 2006 تأسیس شد، یکی از برندهایی است که به تعریف آرامش کالیفرنیا در Aughts کمک کرد، با استفاده از کدهای موج سواری و اسکیت، همراه با موسیقی و سبک دوران دهه هفتاد. این برند روی همه دیده شده است، از کیتی پری و پاریس هیلتون گرفته تا زک افرون و جیک جیلنهال. آدام سندلر حتی یک هودی Aviator Nation را در اسکار در سال 2025 پوشید. Aviator Nation هنوز هم فروشگاه خود را در ساحل ونیز، همراه با ساحل منهتن و مالیبو دارد، اما این برند به فراتر از اقیانوس نگاه می کند و با همکاری پوشاک جدید با NFL، به زمین فوتبال دست می زند. این مجموعه که اکنون در وب سایت Aviator Nation و در Fanatics.com (جایی که قطعات تقریباً فروخته شده است) موجود است، دارای تی شرت های دارای مجوز رسمی، هودی، شلوار گرمکن و گرمکن 25 تیم NFL است. همه قطعات در لس آنجلس با دست دوخته شده اند و تحت یک فرآیند طراحی شده خاص قرار می گیرند که ظاهر و احساسی شکسته به آنها می دهد. از آنجایی که هر قطعه با دست دوخته می‌شود، هیچ دو موردی کاملاً یکسان نخواهد بود و چیزی"}, {"source": "Rolling Stone", "title": "Elvis Costello on His Early Days: The Birth of ‘My Aim Is True’", "link": "https://www.rollingstone.com/music/music-news/elvis-costello-early-days-my-aim-is-true-box-set-1235636676/", "summary": "In our in-depth new interview, Costello digs deep into his origin story, the making of his debut, and the great music he hid away", "date_str": "2026-10-04T20:29:38+00:00", "hash": "ae7d2e4b3d7e01e7", "title_fa": "الویس کاستلو در روزهای اولیه اش: تولد \"هدف من درست است\"", "summary_fa": "در مصاحبه عمیق جدید ما، کاستلو عمیقاً به داستان اصلی خود، ساخت اولین کار خود و موسیقی عالی که پنهان کرده بود، می پردازد. اما همانطور که کاستلو در قسمت جدید Rolling Stone Music Now صحبت می‌کند، موسیقی آلبوم تنها به کارهایی که او در اولین سال‌های خود به عنوان یک هنرمند انجام می‌داد اشاره می‌کند که در نهایت در مجموعه جعبه‌ای که به‌تازگی منتشر شده است، یعنی پنج دیسک My Aim Is True (نسخه چهل و نهمین سالگرد) آشکار می‌شود. در کنار ریمستر آلبوم، مجموعه شامل The Blue Print، ضبط‌های آکوستیک از سال‌های 1975 و 1976 است. دموها و آلبوم‌ها، از جمله آهنگ‌های کانتری که در آن زمان مخفی نگه داشته بود. ضبط زنده که تولد جاذبه ها را ردیابی می کند. و یک کنسرت سودمند در سانفرانسیسکو در سال 2007 که در آن توسط نوازندگان جلسات اصلی حمایت می شود. در مصاحبه رولینگ استون Music Now، کاستلو ضبط‌های اولیه جعبه را که مدت‌ها مدفون شده بود، تجزیه می‌کند و به ساخت My Amim Is True می‌پردازد، از جمله داستان واقعی پشت آلیسون، و خیلی چیزهای دیگر. برای شنیدن کل قسمت، به پادکست های اپل یا Spotify گوش دهید یا فقط پخش را در بالا فشار دهید. در اینجا چند نکته برجسته از بحث آمده است: انتخاب سردبیر 250 آلبوم برتر قرن 21 تا کنون 100 بهترین قسمت تلویزیونی تمام دوران 500 آلبوم برتر تمام دوران 100 بهترین فیلم قرن بیست و یکم کاستلو شروع به نوشتن (The Angels My Train to Red Wannaar) کرد. طبقه بالا برای پیدا کردن یک گیتار قبل از اینکه بتواند آن را فراموش کند. او می گوید: من در راه بودم تا مادرم را ملاقات کنم و آهنگ به ذهنم رسید."}, {"source": "Rolling Stone", "title": "Jason Isbell and Drive-By Truckers Reunite in Alabama", "link": "https://www.rollingstone.com/music/music-live-reviews/jason-isbell-drive-by-truckers-reunite-decoration-day-1235636661/", "summary": "Nearly 20 years after their last full performance together, Patterson Hood, Mike Cooley, and Isbell join up to play the fan-favorite album Decoration Day in full at ShoalsFest", "date_str": "2026-10-04T19:25:34+00:00", "hash": "3e50fc5923a2aac7", "title_fa": "Jason Isbell و Drive-By Truckers در آلاباما دوباره متحد می شوند", "summary_fa": "پترسون هود، مایک کولی و ایزبل تقریباً 20 سال پس از آخرین اجرای کاملشان با هم می‌پیوندند تا آلبوم مورد علاقه طرفداران Decoration Day را به طور کامل در ShoalsFest بنوازند. ریف او قرار است بازی کند. آکوردهای پایانی بازکننده The Deeper In قبل از اینکه کامیونداران درایو بای به چاله سینک فوران کنند، به سختی فروکش کرده است، مردی که برای نجات مزرعه خانوادگی خود از دست یک بانکدار بی پروا، به شدت تحت فشار قرار می گیرد. این آهنگ با الهام از آهنگ 2001 ری مک کینون به نام The Accountant و از دست دادن مزرعه ای که در آن در شمال غربی آلاباما بزرگ شد، لحن آلبوم Decoration Day گروه در سال 2003 را تنظیم کرد. با این حال، قبل از راه اندازی به سینک هول، هود به مردی که درست روی صحنه ایستاده بود و مسئول سومین گیتار روی صحنه امشب بود خطاب کرد: جیسون ایزبل. هود می‌گوید که این یک گردهمایی خانوادگی است و به سلاح مخفی دوران کلاسیک اولیه گروه اشاره می‌کند، که در سال 2007 از گروه اخراج شد و راه خود را به هوش آمد و سپس با چهارمین آلبوم انفرادی خود، Southeastern، در سال 2013 به موفقیت دست یافت. اجرای یکباره شنبه شب در جشنواره Shoals Fest تحت سرپرستی Isbell در فلورانس، آلاباما، نه تنها اولین باری است که ایزبل از زمان اخراجش برای یک مجموعه کامل با کامیونداران روی صحنه می رود، بلکه اولین باری است که آنها Decoration Day را به طور کامل اجرا می کنند (ست آکوستیک سال 2002 که در مجموعه The Definitive Decoration Day به جز هر آهنگ The Definitive Decoration Day در جعبه دکوراسیون نمایش داده می شود)."}, {"source": "Rolling Stone", "title": "Metallica’s Life Burns Faster Sphere Residency May Be Bigger Than Metallica", "link": "https://www.rollingstone.com/music/music-live-reviews/metallica-life-burns-faster-sphere-review-1235630290/", "summary": "With stunning, sometimes overwhelming, visuals and a soundtrack of classics, the band delivered on the expansive promise of its sold-out Las Vegas residency", "date_str": "2026-10-04T18:48:34+00:00", "hash": "d30f79f3fb4418ad", "title_fa": "زندگی متالیکا سریعتر می سوزد. اقامت در کره ممکن است بزرگتر از متالیکا باشد", "summary_fa": "با انتا دعوت می‌کند تا نشان دهد زندگی متالیکا سریع‌تر می‌سوزد. پیت هگزث او را مجبور به خروج کرد که کنسرت Vote for Change با رهبری اسپرینگستین به پایان رسید که اجرای تمام ستاره ای از پتی اسمیت People Have the Power را بر عهده داشت. جشنواره Power to the People با برداشتی مشابه از جان لنون Power to the People، آهنگ همنام جشنواره، و همچنین گروه کامل اجرای طولانی این سرزمین توست، اثر وودی گاتری به پایان رسید:"}, {"source": "Hollywood Reporter", "title": "‘The Flight’: After Iran Shot Down Ukraine Plane, Doc Follows Victims’ Families Fight for Justice", "link": "https://www.hollywoodreporter.com/movies/movie-news/the-flight-doc-iran-shot-down-ukraine-plane-1236717197/", "summary": "Soran Mardookhi's feature documentary debuting in Vancouver goes beyond casualty numbers to humanize lost loved ones, as grieving relatives campaign to hold Iranian authorities accountable.", "date_str": "2026-10-05T14:30:21+00:00", "hash": "f0ea1fcde221f0c7", "title_fa": "«پرواز»: پس از سرنگونی هواپیمای اوکراینی توسط ایران، پزشک خانواده قربانیان را دنبال می‌کند که برای عدالت می‌جنگند", "summary_fa": "اولین مستند بلند سوران مردوخی که در ونکوور به نمایش درآمد، فراتر از تعداد تلفات است تا عزیزان از دست رفته را انسانی جلوه دهد، زیرا بستگان داغدار برای پاسخگویی مقامات ایرانی تلاش می کنند. سوران مردوخی، کارگردان کرد کانادایی، با آخرین مستند خود به نام «پرواز»، پرواز محکوم به فنا PS752 خطوط هوایی اوکراین را به یاد می آورد که در ژانویه 2020 بلافاصله پس از بلند شدن از فرودگاهی در نزدیکی تهران سقوط کرد. همه 176 مسافر و خدمه هواپیما بر اثر موشک های زمین به هوای ایران که باعث سقوط هواپیمای بوئینگ 737 شد، کشته شدند و مقامات ایرانی ابتدا این فاجعه را پنهان کردند. اما مردوخی به هالیوود ریپورتر می گوید که مستند بلند او درباره خاورمیانه یا سیاست نیست. داستان‌های مرتبط فیلم‌ها کارگردان کتاب با رازهای پدر را در مورد جنگ ویتنام فاش می‌کند. جشنواره فیلم ونکوور او بر دسیسه‌های سیاسی و حقوقی احتمالی که سپاه پاسداران انقلاب اسلامی را در نهایت اعتراف به شلیک موشک به هواپیمای بدبخت اوکراینی سوق داد، تمرکز نمی‌کند. فیلم هی  را خریداری کرد. این شرکت سال گذشته یک استودیوی اختصاصی راه اندازی کرد و فیلم Happy Gilmore 2 نتفلیکس را به عنوان اولین محصول مشترک خود قرار داد. این استودیو همچنین فیلم Full Swing Netflix را تولید می کند. مام و پورزیکی می‌گویند که اولویت اصلی، در کنار گسترش فهرست محتوایشان، پیشبرد بیشتر رویدادهای زنده است. این شامل برنامه‌نویسی زنده گلف می‌شود، جایی که آن‌ها The Skins"}, {"source": "Hollywood Reporter", "title": "Former White House Press Secretary Karoline Leavitt Joins Fox News", "link": "https://www.hollywoodreporter.com/tv/tv-news/white-house-press-secretary-karoline-leavitt-joins-fox-news-1236722251/", "summary": "Leavitt will act as a contributor, a few months after she left the White House.", "date_str": "2026-10-05T13:51:03+00:00", "hash": "4b823306b8fe943e", "title_fa": "کارولین لیویت، سخنگوی سابق کاخ سفید به فاکس نیوز پیوست", "summary_fa": "لیویت چند ماه پس از ترک کاخ سفید به عنوان یک مشارکت کننده عمل خواهد کرد. کارولین لیویت، سخنگوی سابق کاخ سفید به عنوان یکی از همکاران به فاکس نیوز پیوست. لیویت نقش جدید خود را با ارائه تفسیر و تحلیل از اول نوامبر آغاز خواهد کرد. این حرکت پس از کناره گیری لیویت از سمت معاونت مطبوعاتی در ماه اوت انجام شد، و ترامپ گفت که او برای گذراندن زمان بیشتری با خانواده خود را ترک می کند، اما به عنوان مشاور خارجی باقی می ماند. او در ژانویه 2025، در آغاز دور دوم ریاست جمهوری ترامپ، کار خود را در کاخ سفید آغاز کرد. تجربه دست اول کارولین در کاخ سفید و در مسیر مبارزات انتخاباتی ریاست جمهوری به او درک متمایزی از چشم انداز سیاسی امروز می دهد. سوزان اسکات، مدیر عامل شرکت، گفت: ما مشتاقانه منتظریم که او بینش واقعی و دقیق را در تمام پلتفرم های رسانه ای FOX News به مخاطبان ما ارائه دهد. من از فرصتی که برای ادامه حضور در کانال FOX News به عنوان عضوی رسمی از تیم فوق‌العاده در FOX News Media فراهم شد سپاسگزارم. لیویت گفت، من مشتاقانه منتظر هستم تا دیدگاه منحصربه‌فرد خود را از تجربه‌ام به عنوان دبیر مطبوعاتی کاخ سفید، همراه با همان انرژی و صراحتی که دوران تصدی من را به چالش می‌کشد، برای میلیون‌ها بیننده فاکس در پلتفرم‌های متعددشان بیاورم. لیویت جوان ترین فردی در تاریخ آمریکا بود که به عنوان وزیر کاخ سفید مشغول به کار شد. قبل از کاخ سفید، لیویت به عنوان سخنگوی مطبوعاتی ملی برای مبارزات انتخاباتی ترامپ در سال 2024 خدمت می کرد. او قبلاً در سال 2022 به‌عنوان نامزد جمهوری‌خواهان برای کنگره در ناحیه اول کنگره نیوهمپشایر نامزد شد و به عنوان مدیر ارتباطات برای الیز استفانیک (R-NY) رئیس کنفرانس جمهوری‌خواه مجلس نمایندگان آمریکا خدمت کرد. در دولت"}, {"source": "Hollywood Reporter", "title": "David Ellison Unveils Skydance Team Who Will Run Paramount-Warner Bros. Empire", "link": "https://www.hollywoodreporter.com/business/business-news/skydance-executive-team-set-david-ellison-deal-close-1236722100/", "summary": "The C-suite will be a mix of Warners insiders like Mark Thompson, Casey Bloys and JB Perrette along with Paramount film chiefs Dana Goldberg and Josh Greenstein and TV exec George Cheeks.", "date_str": "2026-10-05T13:08:14+00:00", "hash": "326c49f9e89eb0ec", "title_fa": "دیوید الیسون از تیم Skydance رونمایی کرد که پارامونت-Warner Bros. Empire را اداره خواهد کرد.", "summary_fa": "C-suite ترکیبی از افراد داخلی Warners مانند مارک تامپسون، کیسی بلویز و جی بی پرت به همراه مدیران فیلم پارامونت، دانا گلدبرگ و جاش گرینشتاین و جورج چیکس، مدیر اجرایی تلویزیون خواهد بود. دیوید الیسون مدیران ارشدی را معرفی کرد که به او کمک خواهند کرد تا در زمان بسته شدن قرارداد در روز سه شنبه، دیسکاوری ترکیبی پارامونت-وارنر برادرز را اداره کند. پارامونت و برادران وارنر با هم. الیسون گفت که اولین خانه خلاقانه را با مقیاس، تخیل و فناوری برای تعریف سرگرمی برای یک نسل تشکیل خواهد داد. رهبرانی که به من ملحق شده‌اند برخی از محبوب‌ترین فرنچایزها و کسب‌وکارها را در این صنعت ساخته‌اند، و احترام عمیقی برای فرآیند خلاقانه دارند و این باور را دارند که داستان‌های بزرگ قدرت سرگرم کردن، متحد کردن و الهام بخشیدن به مخاطبان در سراسر جهان را دارند. همانطور که قبلاً اعلام شده بود، الیسون رئیس هیئت مدیره و مدیرعامل خواهد بود و ینون کیز، رئیس سابق Mattel به عنوان مدیرعامل مشترک به او ملحق خواهد شد. کیسی بلویز تجارت استریم Skydance را اداره خواهد کرد و نظارت بر Paramount+ و Pluto را به خانواده HBO Max خود اضافه خواهد کرد. بلویز وظیفه نظارت بر یک امپراتوری پخش گسترده را بر عهده خواهد داشت، امپراتوری که یکی از بزرگترین امپراتوری های جهان خواهد بود. جاش گرینشتاین و دانا گلدبرگ استودیوهای فیلمسازی شرکت ترکیبی را اداره خواهند کرد، نقشی عظیم در شرکتی که از نظر قانونی متعهد به اکران 32 فیلم در سال تنها در مدت دو سال است. جورج چیکس بر تلویزیون حکومت خواهد کرد و بر کانال های خطی و استودیوهای تلویزیونی نظارت خواهد کرد که هنوز هم نفوذ و نفوذ زیادی دارد. مارک تامپسون سی‌ان‌ان را اداره می‌کند و سطحی از ثبات را در کانال خبری کابلی حفظ می‌کند و به یکی از مهم‌ترین پرسش‌های معامله پاسخ می‌دهد: آیا"}, {"source": "Hollywood Reporter", "title": "Oscars: Syria Picks ‘The Other Side of the Sun’ as Best Int’l Feature Submission, Icarus Takes Doc for U.S.", "link": "https://www.hollywoodreporter.com/movies/movie-news/oscars-syria-picks-the-other-side-of-the-sun-icarus-us-deal-1236721931/", "summary": "“The film explores the experience of imprisonment in Saydnaya Prison, one of the most prominent detention sites associated with Syria’s recent history and collective memory.”", "date_str": "2026-10-05T13:00:00+00:00", "hash": "a18d3ac89147f84b", "title_fa": "اسکار: سوریه «آنسوی خورشید» را به عنوان بهترین فیلم بین‌المللی انتخاب می‌کند، ایکاروس برای آمریکا مستند می‌گیرد.", "summary_fa": "این فیلم تجربه حبس در زندان سیدنایا، یکی از برجسته ترین بازداشتگاه های مرتبط با تاریخ اخیر و حافظه جمعی سوریه را بررسی می کند. فیلم مستند زندان سوری آن سوی خورشید به کارگردانی توفیق صابونی به عنوان اسکار بهترین فیلم بین‌المللی اسکار در نود و نهمین دوره جوایز اسکار انتخاب شد. این تصمیم اولین ورود این کشور از زمان سقوط رژیم اسد در دسامبر 2024 است. آندانا فیلم، که فروش جهانی این فیلم را انجام می دهد، همچنین از اینکه ایکاروس فیلمز حقوق ایالات متحده برای این فیلم را به دست آورده است، رونمایی کرد. ارسال بین‌المللی اسکار توسط کمیته تازه‌تشکیل شده سوریه تایید شده توسط آکادمی علوم و هنرهای تصاویر متحرک (AMPAS) تصمیم‌گیری شد، که نشان‌دهنده فصل جدیدی در مشارکت این کشور در چشم‌انداز جوایز بین‌المللی است. داستان‌های مرتبط فیلم‌ها فیلم‌هایی با پیام‌های واقعی سیاسی در زیر سطح، انیمیشن و موارد دیگر: چه چیزی را نباید در جشنواره فیلم لندن از دست داد، موسیقی آخرین تور کانیه وست، غبار را گاز می‌گیرد در حالی که کنسرت‌های آتی در سن پترزبورگ لغو می‌شوند، سازمان سینمایی و بشردوستانه کشور گفت که انتخاب «آنسوی خورشید» در یک زمینه متمایز سینمایی و بشردوستانه قرار دارد. این فیلم به بررسی تجربه حبس در زندان سیدنایا می‌پردازد، یکی از برجسته‌ترین بازداشتگاه‌های مرتبط با تاریخ اخیر و حافظه جمعی سوریه در دهه‌های گذشته حکومت. این کار را از طریق تجربه کارگردان توفیق صابونی انجام می دهد که پیش از این در کنار چهار بازمانده دیگر از بازداشت در آنجا زندانی بود. برای آنسوی خورشید که در برلین نمایش داده شد، کارگردان صابونی به همراه چهار بازمانده دیگر به زندان سیدنایا بازگشت تا مکان‌ها و تجربیاتی را که سال‌های حبس آن‌ها را شکل داده است، مرور کند. یادداشت‌های مطبوعاتی برجسته‌تر می‌کنند که با ترکیب شهادت با اجرای مجدد، فیلم شکل ملموسی به خاطراتی می‌دهد که مدت‌ها"}, {"source": "Hollywood Reporter", "title": "‘Artificial’ Took on a Big Tech Giant. Hollywood Wasn’t Ready", "link": "https://www.hollywoodreporter.com/movies/movie-features/artificial-exclusive-luca-guadagnino-andrew-garfield-1236721477/", "summary": "Luca Guadagnino and star Andrew Garfield speak frankly about what went into their daring film about Sam Altman and OpenAI, and what led to Neon rescuing it after Amazon decided not to release it: “The fight is on to make sure that we are allowed to make things freely.”", "date_str": "2026-10-05T12:00:00+00:00", "hash": "e63d8e6b72fc5250", "title_fa": "«مصنوعی» یک غول بزرگ فناوری را پذیرفت. هالیوود آماده نبود", "summary_fa": "لوکا گوادانینو و ستاره اندرو گارفیلد به صراحت در مورد آنچه در فیلم جسورانه‌شان درباره سم آلتمن و OpenAI رخ داد و آنچه که منجر به نجات نئون پس از تصمیم آمازون برای عدم انتشار آن شد، صحبت می‌کنند. در ساعت شش صبح چهارشنبه ژوئن در شهر قرن، گروهی از مدیران نئون در مقر CAA برای یک نمایش مخفیانه جمع شدند. آنها نمی دانستند که قرار است چه چیزی را تماشا کنند. روشن شده بود که غافلگیری ارزشمند خواهد بود. نورها کم شد، و قبل از آنها، مصنوعی، فیلم جدید تحریک آمیز لوکا گوادانینو در مورد تولد OpenAI و دو تن از بنیانگذاران آن، سام آلتمن و ایلیا سوتسکور بود. استودیوی آمازون ام جی ام به تازگی تصمیم گرفته بود، با وجود توسعه پروژه، آن را منتشر نکند. یکی از جنجالی ترین و جنجالی ترین عناوین سال به طور ناگهانی برای فروش عرضه شد. داستان های مرتبط تلویزیون بزرگترین سریال دنباله مزرعه کوچکی که ماه آینده در ادامه مستند (انحصاری) 2019 پخش می شود، نقد تلویزیونی کری: مایک فلانگان به خوبی کلاسیک ترسناک استیون کینگ را برای آمازون گسترش می دهد، اما آیا واقعاً نیاز به گسترش داشت؟ نئون بلافاصله علاقه مند شد. استودیوی مستقل تحت رهبری تام کوین اولین کسی بود که آن را نمایش داد، قبل از اینکه رقبایی مانند نتفلیکس، سرچ لایت و A24 ظاهر خود را داشته باشند. واکنش آنها متفاوت بود، اما بسیار مثبت بود. همه، به استثنای نئون و موبی، در نهایت گذشت. گمانه زنی ها در مورد اینکه چرا: فیلم خوب نبود؟ خیلی گران است، با بودجه 40 میلیون دلاری؟ یا شرکت های خاصی به دلیل ارتباط مستقیمشان با Big Tech تمایلی به پذیرش فیلم آتش زا نداشتند؟ (آمازون به نوبه خود، ماه ها قبل از تصمیم به فروش Artificial، سرمایه گذاری برنامه ریزی شده 50 میلیارد دلاری در OpenAI را اعلام کرده"}, {"source": "Hollywood Reporter", "title": "‘The Social Reckoning’ Is an Even Bigger Burn on Mark Zuckerberg Than You Think", "link": "https://www.hollywoodreporter.com/business/digital/social-reckoning-mark-zuckerberg-villain-jeremy-theaters-1236722195/", "summary": "Aaron Sorkin's film takes on a sitting mogul in a way Hollywood rarely attempts.", "date_str": "2026-10-05T08:31:41+00:00", "hash": "237fb96bda3c109e", "title_fa": "«تحقیق اجتماعی» حتی بزرگ‌تر از آنچه فکر می‌کنید بر مارک زاکربرگ آسیب می‌زند", "summary_fa": "فیلم آرون سورکین به گونه ای که هالیوود به ندرت انجام می دهد، با یک غول نشسته روبرو می شود. هفته گذشته، قبل از دیدن The Social Reckoning اثر آرون سورکین، می‌خواستم مطلبی را روی یک آگهی تبلیغاتی بنویسم که به مارک زاکربرگ طعم داروی خودش را می‌دهد. نقطه تولید سونی پیکچرز، که می‌توانید آن را در اینجا مشاهده کنید، مستقیم‌ترین رست یک مدیر فنی است که واقعاً به یاد دارم که در یک بخش بازاریابی هالیوود در مدت طولانی دیده بودم. همانطور که اکتبر را اذیت می کند. نسخه 9 منتشر شده درباره فرانسیس هاگن و فایل‌های فیس‌بوک مربوط به حدود نیم‌دوجین سال پیش، خطی که مارک زاکربرگ عاشق حسابرسی اجتماعی خواهد بود را کنار می‌زند. و همانطور که در حال بررسی آن هستید و متعجب هستید، آیا این واقعاً درست است؟ این آگهی با اینستاگرام باز می گردد، اکثر تبلیغات را بررسی نمی کند. چرا باید؟ این یک سوزش بیهوده نیست، زیرا خود فیلم به بی میلی دیرینه زاکربرگ برای بررسی واقعی تبلیغات سیاسی در پلتفرم های متا می پردازد. اوه، و آگهی؟ در اینستاگرام اجرا می شود. (یک نسخه فیس بوک نیز در فیس بوک در حال اجراست.) اما در حالی که در حال آماده کردن مطلبی در مورد موضوع بودم، فیلم را دیدم و در اولین نمایش جهانی یکشنبه شب در نیویورک شرکت کردم. و هر چقدر که تبلیغ مستقیم باشد (در یک لحظه بیشتر در مورد آن)، فیلم حتی سخت تر می شود. فیلمنامه سورکین مایکی مدیسون هاوگن را از شهادت کمیته سنا خود هاوگن می‌گوید مبنی بر اینکه این شرکت سود خود را با امنیت ما می‌خرد (در واقع فیلم آن را به عنوان سلامت و ایمنی دارد) و در یک صحنه بسیار سینمایی، مدیران فیس‌بوک را در حال تماشای آنچه که فقط می‌توان به‌عنوان فیلم ناراحت‌کننده و خشم‌انگیز ژانویه توصیف کرد نشان می‌دهد."}, {"source": "Hollywood Reporter", "title": "Movies With “Real Political Messages” Underneath the Surface, Animation and More: What Not to Miss at London Film Fest", "link": "https://www.hollywoodreporter.com/movies/movie-news/lff-2026-bfi-london-film-festival-preview-political-movies-1236720797/", "summary": "Kristy Matheson previews key highlights and stars featured in the 70th edition and why she doesn't agree with people having \"a grumble about how it doesn't seem like a big or a good year for cinema.\"", "date_str": "2026-10-05T08:00:00+00:00", "hash": "04712c8e1f4abae2", "title_fa": "فیلم‌هایی با «پیام‌های سیاسی واقعی» در زیر سطح، انیمیشن و موارد دیگر: چه چیزی را نباید در جشنواره فیلم لندن از دست داد", "summary_fa": "کریستی متسون پیش‌نمایش فیلم‌های برجسته و ستاره‌های برجسته‌شده در نسخه 70 را ارائه می‌کند و اینکه چرا با مردمی که «ناراحتی درباره اینکه سال بزرگ یا خوبی برای سینما به نظر نمی‌رسد» موافق نیست. بیش از 250 فیلم از برگزیدگان قدیمی جشنواره و صداهای جدید و نوظهور در هفتادمین دوره جشنواره فیلم لندن (LFF) که از روز چهارشنبه آغاز می شود، به نمایش در خواهند آمد. در میان آنها می توان به اولین نمایش جهانی فیلم های انیمیشن Ray Gunn ساخته برد برد و Wildwood ساخته تراویس نایت اشاره کرد. افتتاحیه 70مین سالگرد LFF در 7 اکتبر در السینور با بازی اندرو اسکات و اولیویا کولمن برگزار می‌شود، در حالی که فیلم The Debut ساخته جسی آیزنبرگ جشنواره را در 18 اکتبر به پایان می‌رساند. کریستی متسون، استرالیایی مسئول برنامه‌نویسی در نقش خود به عنوان کارگردان هنری جشنواره‌های BFI، ترکیب چهارمین LFF خود را به همراه یک تیم گردآوری کرد و از انتخاب فیلم‌هایی از سراسر جهان و در ژانرها و سبک‌های مختلف اطمینان حاصل کرد. داستان های مرتبط موسیقی آخرین تور کانیه وست Stop Bites the Dust as Coming St. کنسرت‌های سن پترزبورگ کنسل شده‌اند، فیلم‌هایی که بتن به غواصی شنی در مزرعه‌های صدف تبدیل شده‌اند، با تصاویری دیگر از بک‌روم‌ها. DP (کلیپ اختصاصی) متسون درباره انتخاب این نسخه، ستاره‌ها و شگفتی‌های احتمالی و چیزهایی که امسال نباید از دست داد با THR صحبت کرد. با توجه به اینکه نسخه 70 یک عدد بزرگ و گرد است، آیا شما و تیمتان نیاز به انجام کار خاصی برای نسخه امسال احساس کردید؟ ما در مورد آنچه که قرار است برای این مناسبت انجام دهیم، گپ های زیادی داشتیم. و هر چه بیشتر در مورد آن فکر می کردم، بیشتر شروع به فکر کردن در مورد پیدایش جشنواره کردم. واقعاً همیشه طوری تنظیم شده بود که یک ویترین باشد، بهترین مدل"}, {"source": "Hollywood Reporter", "title": "John Oliver Has Re-Acquired Russell Crowe’s Iconic Jock Strap", "link": "https://www.hollywoodreporter.com/tv/tv-news/john-oliver-russell-crowe-jock-strap-1236722165/", "summary": "This marks the third time the undergarment, which Crowe wore in 2005's 'Cinderella Man,' has been in the possession of the 'Last Week Tonight' host.", "date_str": "2026-10-05T05:31:46+00:00", "hash": "cef3aa4554a676ef", "title_fa": "جان اولیور دوباره فیلم نمادین جوک بند راسل کرو را خریداری کرد", "summary_fa": "این سومین باری است که لباس زیری که کرو در «مرد سیندرلا» در سال 2005 به تن داشت، در اختیار مجری «امشب هفته گذشته» است. بند جوک راسل کرو بار دیگر در اختیار جان اولیور قرار گرفت. داستان این است: در سال 1028، الیور این کالا را در حراجی کرو به نام هنر طلاق خرید. او پس از طلاقش از دانیل اسپنسر، بیش از 200 کالا را برای فروش گذاشت. پس از حراج، کرو به صبح بخیر بریتانیا گفت که بند جوک یکی از محبوب ترین اقلام پیش از این رویداد بود. داستان‌های مرتبط تلویزیون جان اولیور در هفته گذشته بابا دیوید الیسون امشب تد کروز را مسخره می‌کند پس از اینکه سناتور در طول مصاحبه ESPN هو شد. من آن را در مجموعه به عنوان یک هوس و کمی گاف قرار دادم. به اندازه کافی خنده دار است، توجه زیادی را به خود جلب کرده است. البته این مورد توجه Last Week Tonight را نیز به خود جلب کرد که آن را به قیمت 7000 دلار (علاوه بر برخی موارد دیگر) خریداری کرد. سپس الیور و کارکنانش آن را به آخرین فروشگاه ویدیوی Blockbuster باقی مانده در آنکوریج، آلاسکا اهدا کردند تا به رونق کسب و کار خود کمک کنند. فروشگاه آن را به نمایش گذاشت اما سپس در تابستان 2018 بسته شد. در همین حال، کرو گفت که سود حاصل از آن را به باغ وحش استرالیا اهدا کرده است که گفته است از این پول برای تأمین مالی بخش کلامیدیا جان اولیور کوالا استفاده خواهد کرد. پس از بسته شدن بلاک باستر انکوریج، جوک استرپ در اواخر سال 2018 راه خود را به الیور باز کرد. کرو حتی در طرحی با این آیتم ظاهر شد."}, {"source": "Hollywood Reporter", "title": "‘Lanterns’ Team Breaks Down Finale’s Emotional Gamble, Hal Jordan’s Ultimate Fate and John Stewart’s Future", "link": "https://www.hollywoodreporter.com/tv/tv-features/lanterns-finale-john-stewart-hal-jordan-1236721962/", "summary": "Some viewers might take issue with one major swing, but the team sees it as \"remixing\" rather than \"rewriting\" Green Lantern canon.", "date_str": "2026-10-05T02:00:00+00:00", "hash": "9a70999ee98bbd33", "title_fa": "تیم \"Lanterns\" قمار عاطفی فینال، سرنوشت نهایی هال جردن و آینده جان استوارت را شکست می دهد.", "summary_fa": "برخی از بی ink": "https://variety.com/2026/music/news/bowie80-david-bowie-80th-birthday-events-1236898767/", "summary": "The late, legendary musician David Bowie will have his 80th birthday celebrated with a series of events, exhibits, releases, collaborations and experiences beginning in November and spanning 2027, his estate announced on Monday. Details will be announced on the new website bowie80.davidbowie.com; initial projects are listed below. One of the most influential musicians of the [ ]", "date_str": "2026-10-05T13:22:01+00:00", "hash": "b4235435405c6d69", "title_fa": "«Bowie80» برای جشن گرفتن هشتادمین سالگرد تولد دیوید بووی با رویدادها، نمایشگاه‌ها، انتشارات و موارد دیگر در طول سال 2027", "summary_fa": "دیوید بووی، نوازنده افسانه‌ای فقید، هشتادمین سالگرد تولدش را با مجموعه‌ای از رویدادها، نمایشگاه‌ها، انتشارات، همکاری‌ها و تجربیات جشن می‌گیرد که از نوامبر آغاز می‌شود و از سال 2027 ادامه می‌یابد. جزئیات در وب سایت جدید bowie80.davidbowie.com اعلام خواهد شد. پروژه های اولیه در زیر لیست شده است. یکی از تأثیرگذارترین نوازندگان [ ] *تالار مشاهیر راک رول در کلیولند در حال برنامه‌ریزی برای جشن Bowie80 است که توسط یک پاپ آپ اختصاصی خرده‌فروشی در اواسط نوامبر برگزار می‌شود. راک هال همچنین در تمام آخر هفته تولد دیوید میزبان فعال‌سازی‌های طرفداران خواهد بود، از جمله ارائه‌های آموزشی با تم بووی، مطالب بی‌اهمیت، موسیقی، و عکس‌ها، در کنار نمایشگاهی با آثار عکاسان، که برخی از آنها هرگز نمایش یا منتشر نشده‌اند. جزئیات نمایشگاه و برنامه ریزی در ماه های آینده اعلام خواهد شد. پرطرفدار در Variety *این املاک با Nordstrom همکاری انحصاری برقرار کرده است و تأثیر پایدار بووی بر مد را از طریق سه فروشگاه همه جانبه در پرچمداران سیاتل، نیویورک و شیکاگو، با مجموعه‌های منحصر به فرد و نسخه محدود که به طور خاص برای راه‌اندازی کمپین بووی ایجاد شده‌اند، جشن می‌گیرد. این فروشگاه ها شامل پوشاک و لوازم جانبی از طراحان و برندهایی مانند Undercover، Marc Jacobs، Paul Smith، AllSaints و غیره خواهد بود. *گالری هتل موریسون هشتادمین سالگرد دیوید بووی را با Strange Fascination، یک نمایشگاه بزرگ عکاسی، جشن خواهد گرفت. این نمایشگاه در اوایل فوریه ۲۰۲۷ در شهر نیویورک و هالیوود غربی افتتاح می‌شود و عکس‌های تعیین‌کننده حرفه و قبلاً منتشر نشده از آرشیو مشهور گالری هتل موریسون و املاک دیوید بووی را گرد هم می‌آورد. این نمایشگاه در شش دوره، هویت و اختراع مجدد ارائه خواهد شد که به تعریف تأثیر او بر موسیقی، مد، هنر و فرهنگ کمک کرد. جزئیات تکمیلی در ژانویه اعلام خواهد شد."}, {"source": "Variety", "title": "David Ellison Names Skydance Corp.’s New Leadership Team for Movies, TV, Streaming and More", "link": "https://variety.com/2026/film/news/david-ellison-skydance-new-leadership-team-1236898983/", "summary": "David Ellison, on the eve of officially closing the Paramount-Warner Bros. Discovery merger to form Skydance Corp., has announced his picks for the senior execs to run his new company. The new leadership team will be led by Ellison, chairman and CEO, and co-CEO Ynon Kreiz, the former Mattel chief who joins Skydance starting Monday. [ ]", "date_str": "2026-10-05T13:05:28+00:00", "hash": "afa30862a1b8d1f0", "title_fa": "دیوید الیسون تیم رهبری جدید Skydance Corp را برای فیلم، تلویزیون، استریم و موارد دیگر معرفی کرد.", "summary_fa": "دیوید الیسون، در آستانه تعطیلی رسمی ادغام دیسکاوری برادران پارامونت و وارنر برای تشکیل Skydance Corp، انتخاب خود را برای مدیران ارشد برای اداره شرکت جدید خود اعلام کرد. تیم رهبری جدید توسط الیسون، رئیس هیئت مدیره و مدیرعامل، و یکی از مدیران اجرایی، ینون کریز، رئیس سابق Mattel که از دوشنبه به Skydance می‌پیوندد، رهبری می‌شود. [ ] دیوید الیسون، در آستانه تعطیلی رسمی پارامونت-وارنر برادران. ادغام Discovery برای تشکیل Skydance Corp، انتخاب خود را برای مدیران ارشد برای اداره شرکت جدید خود اعلام کرد. همانطور که انتظار می رفت، دانا گلدبرگ و جاش گرینشتاین، که پیش از این از روسای مشترک پارامونت پیکچرز بودند، اداره فیلم را بر عهده خواهند داشت. پاملا عبدی و مایکل د لوکا، روسای گروه موشن پیکچر برادران وارنر، به شرکت جدید ملحق نمی شوند. جیمز گان و پیتر سافران به عنوان روسای مشترک استودیو دی سی ادامه خواهند داد. محبوب در Variety George Cheeks، که قبلاً رئیس رسانه تلویزیونی در Paramount Skydance بود، رئیس مشترک و مدیر محتوای Skydance TV است. مارک تامپسون به عنوان مدیر عامل CNN به مدیریت خود ادامه خواهد داد. کیسی بلویز، که سرپرستی HBO و HBO Max را بر عهده داشته است، رئیس مشترک و مدیر محتوای Skydance DTC استریم خواهد شد. JB Perrette (که قبلاً مدیر عامل شرکت برادران وارنر دیسکاوری و رئیس پخش جهانی و بازی‌ها بود) رئیس مشترک و مدیر تجاری Skydance TV و Skydance DTC است. در اینجا لیستی از انتصاب‌های اجرایی Skydance اعلام شده در دوشنبه است: الیسون و تیم پارامونت او در فوریه 2026 قرارداد 111 میلیارد دلاری برای خرید Warner Bros. ادغام"}, {"source": "Variety", "title": "Sam Altman Says ‘Artificial’ Filmed Outside His House and He Waved at Andrew Garfield: ‘He Did Walk Like Me … I Felt I Was in Some Weird Glitch of the Simulation’", "link": "https://variety.com/2026/film/news/sam-altman-artificial-filmed-outside-house-waved-andrew-garfield-1236899020/", "summary": "OpenAI CEO Sam Altman has never met Andrew Garfield — who is portraying him in Luca Guadagnino s upcoming film Artificial — but he did wave at him once. In a new cover story with Vanity Fair, the controversial tech exec addressed the movie for the first time, which depicts the five-day period in 2023 when [ ]", "date_str": "2026-10-05T12:27:55+00:00", "hash": "037439d8a5f9448f", "title_fa": "سام آلتمن می‌گوید «مصنوعی» بیرون از خانه‌اش فیلم‌برداری شده است و او برای اندرو گارفیلد دست تکان می‌دهد: «او مثل من راه می‌رفت… احساس می‌کردم در یک نقص عجیب شبیه‌سازی هستم».", "summary_fa": "سام آلتمن، مدیر عامل OpenAI، هرگز اندرو گارفیلد - که او را در فیلم آینده لوکا گوادانینو به تصویر می کشد - ملاقات نکرده است، اما یک بار برای او دست تکان داد. در یک داستان روی جلد جدید با Vanity Fair، مدیر فنی بحث‌برانگیز برای اولین بار به این فیلم پرداخت، که دوره پنج روزه در سال 2023 را نشان می‌دهد که [ ] این اطلاعیه‌ها در خیابان ما وجود داشت مبنی بر اینکه قرار است فیلمبرداری یا هر چیز دیگری انجام شود. من متوجه نشدم چه خبر است آلتمن گفت من توجهی نکردم. و سپس یک روز صبح، من در خیابان راه می رفتم تا قهوه بخورم و همه این دوربین ها وجود داشت و یک مرد دقیقاً شبیه من لباس پوشیده بود و همان کوله پشتی من آنقدر راه می رفت که احساس کردم در یک اشکال عجیب شبیه سازی یا چیزی شبیه سازی شده ام. خیلی عجیب بود. و بعد بلافاصله فهمیدم چه اتفاقی دارد می افتد. محبوب در Variety او افزود، ما دست تکان دادیم و ادامه دادیم، اما واقعا عجیب بود. منظورم این است که دیدن کسی که رفتارهای عجیب و غریب شما یا هر چیز دیگری را میخکوب کرده است، چیز عجیبی است. آلتمن تایید کرد که او و گارفیلد هرگز با هم صحبت نکرده‌اند و گفت: یک بار برای او دست تکان دادم و تمام شد. گارفیلد قبلاً در مورد عدم ملاقات با آلتمن برای آماده شدن برای نقش صحبت کرده بود و در ماه اوت به Esquire U.K گفت: من هرگز او را ندیده‌ام. داشتم از فیلمنامه و متن دادگاه و مصاحبه و تحقیق کنار می رفتم و داشتیم داستان می گفتیم. اما من فکر می‌کنم هرکسی که آن سطح از مسئولیت را برای یک شرکت یا فناوری که شما می‌دانید به روح بشریت آسیب زیادی وارد می‌کند [باید] توانایی خاصی"}, {"source": "Variety", "title": "Mark Ruffalo Tells Trump ‘Hands Off Our F—ing Vote’ or ‘I’m Gonna Hulk Out’: ‘You Won’t Like Me When I’m Angry’", "link": "https://variety.com/2026/film/news/mark-ruffalo-slams-trump-voting-rights-hulk-out-1236898975/", "summary": "Mark Ruffalo made a passionate speech at a Hands Off Our Vote event in New York City on Sunday night, slamming U.S. President Donald Trump and saying he s going to Hulk out if he attempts to restrict voting in the upcoming midterm elections. The midterms are set to take place on Nov. 3 and could [ ]", "date_str": "2026-10-05T11:44:07+00:00", "hash": "64a59abc4aebe135", "title_fa": "مارک روفالو به ترامپ می‌گوید: «رأی ما را رها کن» یا «من می‌خواهم بیرون بروم»: «وقتی عصبانی هستم، مرا دوست نخواهی داشت».", "summary_fa": "مارک روفالو یکشنبه شب در یک رویداد Hands Off Our Vote در شهر نیویورک یک سخنرانی پرشور را ایراد کرد و از دونالد ترامپ، رئیس جمهور ایالات متحده انتقاد کرد و گفت که در صورت تلاش برای محدود کردن رای دادن در انتخابات میان دوره ای آتی، او از هالک خارج می شود. قرار است دوره میانی در 3 نوامبر برگزار شود و می تواند [ ] با     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
