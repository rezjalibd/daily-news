نج تا ۱۰ ساله را پشت سر بگذاریم. با این توانمندی داخلی، می‌توانیم به مشتریان تجاری و دولتی خود در بازاری گسترده‌تر، فراتر از ارتباط مستقیم با دستگاه‌ها، خدمات بهتری ارائه دهیم.» طبق توافق صورت‌گرفته، ۲۷ موتور از نوع میراندا که برای پرتابگر جدید اکلیپس فایرفلای توسعه می‌یابند، به همراه ۹ موتور خلاء Vira به این پروژه اختصاص پیدا می‌کنند. ای‌اس‌تی اسپیس‌موبایل که پیش‌تر محموله‌های خود را با موشک‌های هندی، اسپیس‌ایکس و راکت نیو گلن متعلق به بلو اوریجین پرتاب می‌کرد، پس از بروز خطای مداری در پرتاب نیو گلن و همچنین توقف پذیرش سفارش‌های تجاری فالکون ۹ پس از سال ۲۰۲۸، تصمیم گرفت زنجیره‌ی تامین و پرتاب ماهواره‌هایش را به‌طور مستقل مدیریت کند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/blacklift-rocket-launch-spacecraft-6af020ce354e588119e484c2?w=1920&q=75", "category": "موسیقی و هنر", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۸:۴۵"}, {"source": "Business Insider", "title": "I've been to all 64 US national parks and ranked them from my least favorite to my top pick for travelers", "link": "https://www.businessinsider.com/every-major-us-national-park-ranked-traveler-who-visited-all-2026-11", "summary": "I visited and ranked all 64 US national parks. Emily Hart I've been to all 64 US national parks and ranked them from my least favorite to my top pick. I think parks like Congaree, Petrified Forest, and Channel Islands are best suited for a day trip. Visiting Badlands, White Sands, and Olympic national parks feels like stepping onto another planet. Ranking all 64 major US national parks feels like an impossible task because each one offers something uniquely beautiful. However, as a solo traveler who's visited them all, I've learned that not all parks leave the same impression. Some are grand and awe-inspiring, embodying the vision of what a national park likely looks like in your mind. Others, although still worth visiting, don't quite reach that same iconic standard. That said, all of the major national parks are undoubtedly some of the most scenic and unique places in the US , so even a bottom spot on my ranking is not a dig. Here's how I'd rank all the US national parks based on personal preference and things like scenic beauty, accessibility, and crowd sizes. 64. Hot Springs National Park in Arkansas schristinephoto/Shutterstock In the grand scheme of things, coming in last on a list of what I consider to be the most beautiful places in the US is not too shabby — and I had to pick one. That said, I don't dislike Hot Springs National Park at all — in fact, I'd love to visit again. However, it's last on this list because it doesn't have the same natural scenic beauty and outdoor opportunities as the other parks. Hot Springs is in the middle of a town, where the main attraction is Bathhouse Row — eight historic bathhouses built between 1892 and 1923. Although it's a fun and interesting place, I think it would be better suited as a national historic park. 63. Gateway Arch National Park in Missouri Jonathan_Densford/Shutterstock Gateway Arch National Park in St. Louis is another place I love visiting. I just don't think it makes sense as a \"national park.\" Once known as the Jefferson National Expansion Memorial, this spot was designated a national park and renamed in 2018. It's also the smallest of the 64 national parks. Like Hot Springs, I ranked it lower because the main attraction, the 630-foot-tall Gateway Arch, is man-made. In my opinion, the park would be better designated as a National Monument. 62. Mammoth Cave National Park in Kentucky Emily Hart I'm not a fan of caves, so national parks primarily focused on cave tours are not for me. However, if y", "date_str": "2026-11-09T15:21:12+00:00", "hash": "55c800e0834387bf", "title_fa": "من به تمام 64 پارک ملی ایالات متحده رفته ام و آنها را از کمترین علاقه تا بهترین انتخاب برای مسافران رتبه بندی کرده ام.", "summary_fa": "من از تمام 64 پارک ملی ایالات متحده بازدید و رتبه بندی کردم. امیلی هارت من در تمام 64 پارک ملی ایالات متحده بوده ام و آنها را از کمترین علاقه تا انتخاب برتر خود رتبه بندی کرده ام. فکر می‌کنم پارک‌هایی مانند Congaree، جنگل سنگ‌شده، و جزایر کانال برای یک سفر یک روزه مناسب‌تر هستند. بازدید از Badlands، White Sands و پارک های ملی المپیک مانند قدم گذاشتن به سیاره ای دیگر است. رتبه بندی تمام 64 پارک ملی بزرگ ایالات متحده امری غیرممکن به نظر می رسد زیرا هر یک چیز منحصر به فرد زیبایی ارائه می دهد. با این حال، به عنوان یک مسافر انفرادی که همه آنها را بازدید کرده ام، آموخته ام که همه پارک ها یک تصور را به جا نمی گذارند. برخی از آنها بزرگ و الهام‌بخش هستند و این تصور را که احتمالاً یک پارک ملی در ذهن شما به نظر می‌رسد، تجسم می‌دهند. برخی دیگر، اگرچه هنوز ارزش بازدید دارند، اما به همان استاندارد نمادین نمی رسند. با این اوصاف، همه پارک‌های ملی بزرگ بدون شک برخی از دیدنی‌ترین و منحصربه‌فردترین مکان‌های ایالات متحده هستند، بنابراین حتی یک رتبه پایین در رتبه‌بندی من حفاری نیست. در اینجا نحوه رتبه‌بندی همه پارک‌های ملی ایالات متحده بر اساس ترجیحات شخصی و مواردی مانند زیبایی منظره، دسترسی، و تعداد جمعیت آمده است. 64. پارک ملی هات اسپرینگز در آرکانزاس schristinephoto/Shutterstock در طرح بزرگ همه چیز، جایگاه آخر در فهرست مکان‌هایی که به نظر من زیباترین مکان‌های ایالات متحده هستند، خیلی کثیف نیست - و مجبور شدم یکی را انتخاب کنم. با این حال، من اصلاً از پارک ملی هات اسپرینگز متنفر نیستم - در واقع، دوست دارم دوباره از آن دیدن کنم. با این حال، آخرین رتبه در این لیست است زیرا مانند سایر پارک ها زیبایی منظره طبیعی و فرصت های فضای باز", "image_url": "https://i.insider.com/6af1e48e80d4b24f183478ba?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۸:۵۱"}, {"source": "Business Insider", "title": "I'm an interior designer who works with wealthy clients. Here are 10 things I rarely see in their living rooms.", "link": "https://www.businessinsider.com/what-rich-people-never-have-living-rooms-interior-designer-luxury-2026-11", "summary": "I ve found that wealthy, high-profile clients tend to avoid a few mistakes when designing and decorating their living rooms. Getty Images; BI In my years as an interior designer, I've worked with many wealthy, high-profile clients. Their living rooms typically don't have too-small rugs, visible TVs, or a single overhead light. It's also rare to find mass-produced artwork, matching furniture sets, and cluttered surfaces. As an interior designer who's worked with high-profile clients for over a decade, I've learned that a luxurious living room is rarely defined by how much money has been spent putting it together. Rather, some of the nicest high-end spaces I've worked on are thoughtfully designed and curated for the people living in them. Although everyone's personal style is different, I've noticed a few common design choices that my wealthier clients tend to avoid. Here are 10 things that I rarely see in their living rooms. Matching furniture sets are rarely a part of the design. sheilasay/Getty Images When designing a high-end living room , I never purchase an entire matching furniture collection from one place. Instead, I mix different silhouettes, materials, and eras so the room feels more special, as if the furniture has been carefully collected and put together over time. After all, a sofa, an accent chair, and a loveseat in the same fabric and style can create a generic feel, as if they were all pulled directly from a furniture showroom. A rug that s too small can cheapen the entire living room. Sometimes, no rug is better than one that s too small for a space. RapidEye/Getty Images When in doubt, it's better to go bigger for rugs. Rugs that are too small can make even the most expensive furniture look cheap and create a space that feels disconnected or incomplete. In my clients' homes, I typically select oversized rugs that anchor the seating arrangement. At the very least, I want the front legs of all major seating pieces to rest on the rug. A correctly sized rug makes a room feel more substantial, cohesive, and well-designed. Generic, mass-produced artwork is usually nowhere to be found. When decorating, prioritize finding unique artwork that s meaningful to you. Curly_photo/Getty Images Artwork is one of the biggest opportunities to give a space personality . So, I rarely see wealthy clients displaying generic, mass-produced canvas prints that could be found in thousands of other homes. Instead, many invest in original paintings, limited-edition ", "date_str": "2026-11-09T15:03:01+00:00", "hash": "1498e37fd7bc5566", "title_fa": "من یک طراح داخلی هستم که با مشتریان ثروتمند کار می کنم. در اینجا 10 چیزی است که من به ندرت در اتاق نشیمن آنها می بینم.", "summary_fa": "من متوجه شده ام که مشتریان ثروتمند و پرمخاطب هنگام طراحی و تزئین اتاق نشیمن خود از چند اشتباه اجتناب می کنند. گتی ایماژ; BI در سال‌هایی که به عنوان طراح داخلی کار می‌کردم، با بسیاری از مشتریان ثروتمند و با مشخصات بالا کار کرده‌ام. اتاق‌های نشیمن آنها معمولاً فرش‌های خیلی کوچک، تلویزیون‌های قابل مشاهده یا یک چراغ سقفی ندارند. همچنین به ندرت می‌توان آثار هنری تولید انبوه، مجموعه‌های مبلمان همسان و سطوح به هم ریخته را پیدا کرد. به عنوان یک طراح داخلی که بیش از یک دهه با مشتریان برجسته کار کرده است، آموخته ام که یک اتاق نشیمن مجلل به ندرت با مقدار پولی که برای جمع آوری آن هزینه شده است تعریف می شود. در عوض، برخی از زیباترین فضاهای سطح بالا که من روی آنها کار کرده‌ام، برای افرادی که در آنها زندگی می‌کنند، طراحی و مدیریت شده‌اند. اگرچه سبک شخصی هر کس متفاوت است، من متوجه چند انتخاب رایج طراحی شده ام که مشتریان ثروتمندتر من تمایل دارند از آنها اجتناب کنند. در اینجا 10 چیز وجود دارد که من به ندرت در اتاق نشیمن آنها می بینم. ست مبلمان همسان به ندرت بخشی از طراحی است. sheilasay/Getty Images هنگام طراحی یک اتاق نشیمن سطح بالا، من هرگز کل مجموعه مبلمان را از یک مکان خریداری نمی کنم. در عوض، من شبح‌ها، مواد و دوره‌های مختلف را با هم ترکیب می‌کنم تا اتاق خاص‌تر به نظر برسد، گویی که مبلمان با دقت جمع‌آوری شده و در طول زمان کنار هم قرار گرفته‌اند. به هر حال، یک مبل، یک صندلی تاکیدی، و یک صندلی عاشقانه در همان پارچه و سبک می‌توانند حسی کلی ایجاد کنند، گویی که همه آنها مستقیماً از یک نمایشگاه مبلمان بیرون کشیده شده‌اند. یک فرش خیلی کوچک می تواند کل اتاق نشیمن را ارزان کند. گاهی اوقات، هیچ فرشی بهتر از", "image_url": "https://i.insider.com/6ad0da49adb77227909a5e7d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۳"}, {"source": "Business Insider", "title": "Meet the legal startup generating $150 million in revenue without chasing Big Law", "link": "https://www.businessinsider.com/evenup-hits-150-million-recurring-revenue-legal-ai-2026-11", "summary": "EvenUp cofounder and CEO Rami Karabibar. EvenUp EvenUp, a quiet giant of the legal tech space, has reached $150 million in contracted revenue. The company sells AI software to personal injury law firms. It's expanding into new products and reaching new customers as it also faces increased competition. While Harvey and Legora battle for Big Law, another legal tech startup is carving out a sizable business in Small Law. EvenUp, a seven-year-old company that sells AI software to plaintiff-side law firms, has grown to $150 million in recurring revenue under contract, Rami Karabibar, EvenUp's cofounder and chief executive, told Business Insider. The milestone is a reminder that some of the biggest opportunities in legal AI lie beyond the white-shoe firms now adopting it. For traditional law firms that bill by the hour, AI presents a dilemma. Software that makes lawyers more efficient could also eat into their revenue. But personal injury firms typically work on contingency, taking a cut of what their clients win. The faster they can move cases along, the sooner they get paid. For much of its existence, EvenUp was something of a one-trick pony. The company got its start automating demand letters, the detailed documents personal injury lawyers send to insurers making the case for a financial settlement. It's a valuable business, but one that competitors can imitate. Over the past 18 months, EvenUp has expanded into AI software that helps lawyers manage cases from start to finish. Its newest offering goes a step further, combining AI agents with human case managers to handle much of the work that happens before a lawsuit is filed. The expansion has transformed EvenUp's business. In early 2025, demand letters accounted for more than 90% of revenue, Karabibar said. Today, revenue is spread more evenly across its products, and demand letters represent less than a quarter of the business. EvenUp now serves more than 2,000 personal injury firms and supports 20,000 cases each week. Law firms pay a fixed price per case and sign annual contracts committing to a certain volume of cases. EvenUp may have barely scratched the surface. Most law firms still use only one of its products, Karabibar said. The company sees an opportunity to land customers with one offering, then expand into other parts of their business. To make that happen, EvenUp has hired Stevie Case, the former chief revenue officer of Vanta , as president of field operations. She will oversee sales, marketing,", "date_str": "2026-11-09T14:50:01+00:00", "hash": "8166788a41125798", "title_fa": "با استارتاپ قانونی آشنا شوید که 150 میلیون دلار درآمد ایجاد می کند بدون اینکه قانون بزرگ را دنبال کنید", "summary_fa": "رامی کارابیبار، بنیانگذار و مدیرعامل EvenUp. EvenUp EvenUp، غول آرام در فضای فناوری قانونی، به درآمد قراردادی ۱۵۰ میلیون دلاری رسیده است. این شرکت نرم افزار هوش مصنوعی را به شرکت های حقوقی آسیب های شخصی می فروشد. در حال گسترش به محصولات جدید و دستیابی به مشتریان جدید است زیرا با افزایش رقابت نیز مواجه است. در حالی که هاروی و لگورا برای قانون بزرگ مبارزه می کنند، یک استارتاپ حقوقی دیگر در زمینه فناوری در حال ایجاد یک تجارت قابل توجه در Small Law است. رامی کارابیبار، بنیانگذار و مدیر اجرایی EvenUp، به Business Insider گفت که EvenUp، یک شرکت هفت ساله که نرم‌افزار هوش مصنوعی را به شرکت‌های حقوقی طرف شاکی می‌فروشد، درآمد مداو ing him the 10th richest person on earth, according to the Bloomberg Billionaires Index. Huang's Nvidia stake fell in value by as much as $13 billion to around $138 billion on Monday morning, Business Insider calculated based on his most recent ownership disclosure. Revelations about Huang's personal life In late October, The New York Times reported that American intelligence agencies discovered that Huang had a close relationship with Alice Huang , a Chinese citizen and former executive at Megaspeed, a Singapore-based data center company. US officials suspected her company was steering Nvidia'", "date_str": "2026-11-09T14:35:21+00:00", "hash": "25b7f65ba4fa72bc", "title_fa": "ارزش خالص سهام و مدیرعامل انویدیا جنسن هوانگ پس از افشای ماجرای بمب‌گذاری سقوط کرد.", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا در پیامی به کارکنان گفت که به همسرش خیانت کرده است. دیوید پل موریس/ بلومبرگ از طریق Getty Images سهام انویدیا در روز دوشنبه پس از افشای زندگی شخصی جنسن هوانگ، مدیر عامل شرکت، به شدت کاهش یافت. سازنده تراشه در حال بررسی رابطه‌ای که هوانگ با یک مدیر فنی و یک جاسوس مظنون چینی داشته است. سهام انویدیا در بازار آزاد 8 درصد سقوط کرد و برای مدت کوتاهی حدود 360 میلیارد دلار از ارزش گذاری آن حذف شد. سهام انویدیا صبح روز دوشنبه به شدت کاهش یافت، زیرا این شرکت تحقیقاتی را در مورد رابطه خارج از ازدواج جنسن هوانگ، مدیر عامل شرکت جنسن هوانگ با یک جاسوس مظنون چینی آغاز کرد. ارزش سهام در روز دوشنبه 8 درصد کاهش یافت و به حدود 171 دلار به ازای هر سهم رسید و از ارزش بازار پایانی 4.5 تریلیون دلاری روز جمعه، 360 میلیارد دلار کاهش یافت. 30 دقیقه پس از باز شدن، ضرر به 5 درصد رسیده بود. سهام در ماه گذشته 20 درصد کاهش یافته است. سهام‌های فناوری در میان نگرانی‌های سرمایه‌گذاران مبنی بر اینکه زیرساخت‌های هوش مصنوعی به سرعتی که انتظار می‌رفت ساخته نمی‌شود، با فروش گسترده‌تری مواجه شده‌اند، که ناشی از سطوح بالای بدهی شرکت‌های نئوکلاد و دستاوردهای بزرگ دموکرات‌ها در انتخابات میان‌دوره‌ای است که می‌تواند ساخت مرکز داده را کند کند. هوانگ در سال 1993 انویدیا را تأسیس کرد و از زمانی که رونق هوش مصنوع : "https://www.businessinsider.com/us-army-soldiers-take-page-ukraine-playbook-fly-drones-farther-2026-10", "summary": "An American soldier simulating an enemy picks up a drone during a recent exercise. Jake Epstein/Business Insider US Army soldiers training in Germany are using relay drones to extend the range of their operations. The relays extend the signal between a pilot and their mission drone, allowing them to fly farther. It's a tactic that has become increasingly important in Ukraine. HOHENFELS, Germany — A drone can fly only as far as its pilot can keep the connection. At the US Army's main overseas combat training center, that critical link can disappear on the far side of the rolling hills and thick forests that make the terrain particularly useful for war games. The Army is looking to the sky for answers to the problem. The service wants to use drones as airborne communications relays that can help pilots maintain control of uncrewed aircraft operating beyond the reach of a direct line-of-sight signal. Locked in a drone war with Russia, Ukraine has already turned to this approach on the battlefield, using relay drones to extend the connection between a pilot and a mission drone. Similar to how WiFi extenders work, these airborne signal repeaters are typically small quadcopters that can fly higher than ground-based antennas, allowing the mission drone to fly farther. Roughly 50 Ukrainian soldiers participated in Combined Resolve, a recurring large-scale US Army exercise held last month at the Joint Multinational Readiness Center in Bavaria, north of Munich. Business Insider spent two days observing the training exercise, a kind of stress test for the Army as the service integrates drones, electronic warfare, and other emerging technologies into its armor operations to make tanks and infantry fighting vehicles more survivable on modern battlefields. Army officers said that the US is learning many lessons from Ukraine and from its visiting soldiers, who participated in the exercise alongside the 1st Armored Division's 1st Armored Brigade Combat Team (1/1 ABCT) as it fought an opposition force simulating an enemy. One of these lessons is how to use relay drones for extended range, said Capt. Kevin Rincon, the troop commander of the multifunctional reconnaissance company, 1/1 ABCT's action arm. Ukraine uses relay drones to extend the range of other drones on strike and surveillance missions. Jake Epstein/Business Insider Speaking in the dense forest surrounded by armored vehicles, Rincon said fine-tuning the ability to operate relay drones and extend the range of mi", "date_str": "2026-11-09T14:14:26+00:00", "hash": "625ef55bfb36cd00", "title_fa": "سربازان ارتش ایالات متحده در حال گرفتن صفحه ای از کتاب بازی اوکراین برای پرواز پهپادهای دورتر هستند", "summary_fa": "یک سرباز آمریکایی در حال شبیه سازی یک دشمن یک پهپاد را در جریان تمرین اخیر برمی دارد. جیک اپستاین/Business Insider سربازان ارتش ایالات متحده که در آلمان آموزش می بینند از پهپادهای رله برای گسترش دامنه عملیات خود استفاده می کنند. رله‌ها سیگنال بین خلبان و هواپیمای بدون سرنشین مأموریت خود را گسترش می‌دهند و به آنها اجازه می‌دهند دورتر پرواز کنند. این تاکتیکی است که در اوکراین اهمیت فزاینده ای پیدا کرده است. هوهنفلز، آلمان - یک پهپاد فقط تا جایی می تواند پرواز کند که خلبانش بتواند ارتباط را حفظ کند. در مرکز اصلی آموزش رزمی خارج از کشور ارتش ایالات متحده، این پیوند حیاتی می تواند در سمت دور تپه های غلتان و جنگل های انبوه ناپدید شود که زمین را به ویژه برای بازی های جنگی مفید می کند. ارتش به دنبال پاسخ به این مشکل به آسمان است. این سرویس می‌خواهد از هواپیماهای بدون سرنشین به عنوان رله‌های ارتباطی هوابرد استفاده کند که می‌تواند به خلبانان کمک کند تا کنترل هواپیمای بدون خدمه را که خارج از دسترس سیگنال مستقیم خط دید هستند، حفظ کنند. اوکراین که در جنگ هواپیماهای بدون سرنشین با روسیه قفل شده است، قبلاً در میدان نبرد به این رویکرد روی آورده است و از پهپادهای رله برای گسترش ارتباط بین خلبان و پهپاد مأموریتی استفاده می کند. مشابه نحوه کار اکستندرهای وای‌فای، این تکرارکننده‌های سیگنال هوابرد معمولاً کوادکوپترهای کوچکی هستند که می‌توانند بالاتر از آنتن‌های زمینی پرواز کنند و به پهپاد مأموریت اجازه پرواز دورتر را می‌دهند. تقریباً 50 سرباز اوکراینی در Combined Resolve، یک رزمایش مکرر در مقیاس بزرگ ارتش ایالات متحده که ماه گذشته در مرکز مشترک آمادگی چندملیتی در باواریا، در شمال مونیخ برگزار شد، شرکت کردند. Business Insider دو روز را صرف مشاهده تمرینات آموزشی کرد، نوعی تست استرس برای ارتش زیرا این سرویس پهپادها،", "image_url": "https://i.insider.com/6aec6f17308912814ed71263?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۷:۴۴"}, {"source": "Business Insider", "title": "They quit Cohere to go into law. They say their new firm can avoid Weil's fate.", "link": "https://www.businessinsider.com/startup-law-firm-blackletter-raises-6-million-from-lerer-hippeau-2026-11", "summary": "Blackletter founders Avi Brudner, David Stewart, and Jonathan Rosenbluth. Blackletter Blackletter is the latest startup law firm trying to take clients away from Big Law. The Canadian neofirm has raised a $6 million seed round led by Lerer Hippeau. The founders think it can avoid Weil's fate by building a system that learns from past work. Artificial intelligence has forced Big Law to rethink how legal work gets done and how clients pay for it. The collapse of law firm Weil Gotshal shows how quickly the traditional model can come apart. The founders of Blackletter, a new Canadian neofirm, say artificial intelligence offers a way to build something sturdier. Blackletter has raised a $6 million seed round led by Lerer Hippeau, its cofounder and chief executive, Jonathan Rosenbluth, told Business Insider. The firm combines technology and lawyers to offer businesses legal services for flat fees. The investment marks Lerer Hippeau's first check in legal, a firm spokesperson said. Other Blackletter backers include Seven Stars, Maple VC, Garage Ventures, and Ripple Ventures, as well as Cohere's founders, Aidan Gomez, Nick Frosst, and Ivan Zhang. Rosenbluth saw Weil as a reminder of the existential risk facing legacy firms. Rainmakers can walk at any time. Clients can follow. And a partnership can collapse with the speed of a bank run. Blackletter is betting its clients will come back not because of the relationship with one partner, but because Blackletter understands their business and does the work well. Its lawyers use software built on large language models to draft and negotiate routine corporate contracts and guide transactions from term sheet through diligence and signing. The firm says it has more than 75 clients, including Fanatics, TwelveLabs, and Ada, which has just agreed to merge with fellow customer service agent company Dialpad in a $600 million deal. The lessons from each matter Blackletter works on are meant to inform the next, Rosenbluth said. Lawyers refine how they use the tools, while engineers adapt the technology to help them get better results. Rosenbluth spent a summer during law school at Skadden , where he watched associates a decade his senior grind through menial work. He felt drawn to the legal industry, he said, but the experience convinced him that traditional practice was not the career for him. Before starting Blackletter, he rose through the ranks at Cohere , the fast-growing artificial intelligence model maker, where he led par", "date_str": "2026-11-09T14:00:01+00:00", "hash": "ded9a384c0211f91", "title_fa": "آنها از Cohere خارج شدند تا وارد قانون شوند. آنها می گویند که شرکت جدیدشان می تواند از سرنوشت ویل جلوگیری کند.", "summary_fa": "بنیانگذاران Blackletter، آوی برودنر، دیوید استوارت و جاناتان روزنبلوت. Blackletter Blackletter جدیدترین شرکت حقوقی استارتاپی است که سعی دارد مشتریان را از قانون بزرگ دور کند. شرکت نئوفیرمای کانادایی مبلغ 6 میلیون دلاری را به رهبری لرر هیپو جمع آوری کرده است. بنیانگذاران فکر می کنند که می تواند با ساختن سیستمی که از کارهای گذشته درس می گیرد، از سرنوشت ویل جلوگیری کند. هوش مصنوعی بیگ لاو را وادار کرده است تا درباره نحوه انجام کارهای قانونی و نحوه پرداخت هزینه های مشتریان تجدیدنظر کند. فروپاشی شرکت حقوقی ویل گوتشال نشان می دهد که مدل سنتی چقدر سریع می تواند از هم پاشیده شود. بنیان‌گذاران Blackletter، یک شرکت جدید کانادایی، می‌گویند هوش مصنوعی راهی برای ساختن چیزی قوی‌تر ارائه می‌کند. جاناتان روزن‌بلوت، بنیانگذار و مدیر اجرایی بلک‌لتتر، سرمایه‌گذاری 6 میلیون دلاری به رهبری لرر هیپو، به بیزینس اینسایدر گفت. این شرکت فناوری و وکلا را برای ارائه خدمات حقوقی به مشاغل با هزینه های ثابت ترکیب می کند. سخنگوی این شرکت گفت که این سرمایه گذاری اولین بررسی قانونی لرر هیپو است. سایر حامیان Blackletter عبارتند از Seven Stars، Maple VC، Garage Ventures و Ripple Ventures و همچنین بنیانگذاران Cohere، آیدان گومز، نیک فراست و ایوان ژانگ. روزن بلوث ویل را یادآور خطر وجودی پیش روی شرکت های قدیمی می دانست. باران‌سازان می‌توانند در هر زمانی راه بروند. مشتریان می توانند دنبال کنند. و یک مشارکت می تواند با سرعت یک بانک از بین برود. بلک‌لتتر شرط می‌بندد که مشتریانش نه به خاطر رابطه با یک شریک، بلکه به این دلیل که بلک‌لت کسب‌وکار آنها را درک می‌کند و کار را به خوبی انجام می‌دهد. وکلای آن از نرم‌افزار ساخته شده بر روی مدل‌های زبان بزرگ برای پیش‌نویس و مذاکره قراردادهای معمول شرکتی و هدایت معاملات از برگه‌های مدت از طریق دقت و امضا استفاده می‌کنند. این شرکت می‌گوید", "image_url": "https://i.insider.com/6aecdba5c54bfafa65abf6d1?width=1024&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I spent 6 months visiting friends all over the country. It was a good reminder not to let distance get in the way.", "link": "https://www.businessinsider.com/traveled-country-visit-friends-distance-friendship-2026-11", "summary": "The author, right, visited friends in NYC. Courtesy of Asha Dore I spent months traveling the country to see friends just as I was turning 40. I enjoyed my time alone while traveling, as well as time with friends. Even a short visit made me feel closer to friends. For the last 10 years, I've celebrated my birthday with small family meals, but as I was turning 40, I changed it up. After getting a taste of solo travel last year during the holidays, I wanted more. My closest friends were spread out across the country, so I decided to visit as many as I could, and spent about six months traveling. What I had imagined as a fun, sweet time became so much more. I deepened friendships I'd made through writing I started my travels a few months before my birthday when two fellow journalists invited me to a girls' weekend at one of their homes in Chicago in the middle of winter. There, I fell in love with deep-dish pizza and glazed duck wings, and felt a somewhat professional relationship deepen into true friendship. It only took minutes of hanging out in real life for me to realize how much I trusted these two women — and how easy it would be for me to help them with whatever they needed, whenever they asked. A few weeks later, we teamed up again with three more friends in New York City to attend a book launch party at our teacher's house. This group is intergenerational — from mid-20s to 60s. We all met in an online writing class two years ago, and we've been meeting weekly on Zoom to talk about our work ever since. Our NYC trip marked the first chance we'd had to meet in person, and it felt like we'd known each other far longer than we had. We are all from different regions of the country, working day jobs in totally different fields, but we share a profound creative optimism. Online, those vibes helped us become friends. In real life, the energy was electric. The author visited a friend in Florida. Courtesy of Asha Dore I saw my high school BFF twice On my actual birthday in March, I met my high school BFF in Sonoma for a long weekend. She came from Florida, and I flew in from my home in Seattle. Since 2021, we have been meeting in different cities once a year to explore the town, chill, and talk about our lives. Complete with a wine tour , a lot of walks through the quiet streets, and evenings at the hotel hot tub, our trip was a vacation in the truest sense — and a necessary annual recharge of our 25-year friendship. I saw her again a few weeks later in Central", "date_str": "2026-11-09T13:15:01+00:00", "hash": "820cea1dfe8335bc", "title_fa": "من 6 ماه را صرف دیدار دوستان در سراسر کشور کردم. یادآوری خوبی بود که نگذارید فاصله مانع شود.", "summary_fa": "درست است که نویسنده از دوستانش در نیویورک دیدن کرده است. با حسن نیت از Asha Dore من ماه ها را صرف سفر به کشور کردم تا دوستانم را ببینم درست زمانی که 40 ساله شدم. از زمان تنهایی خود در سفر و همچنین از زمان با دوستان لذت بردم. حتی یک دیدار کوتاه باعث شد احساس نزدیکی به دوستان کنم. در 10 سال گذشته، من تولدم را با وعده های غذایی کوچک خانوادگی جشن می گرفتم، اما وقتی 40 ساله شدم، آن را تغییر دادم. بعد از چشیدن طعم سفر انفرادی سال گذشته در تعطیلات، بیشتر می خواستم. نزدیکترین دوستان من در سراسر کشور پراکنده بودند، بنابراین تصمیم گرفتم تا جایی که می توانم به دیدن آنها بروم و حدود شش ماه را صرف سفر کردم. آنچه من به عنوان یک زمان سرگرم کننده و شیرین تصور می کردم بسیار بیشتر شد. دوستی‌هایی را که از طریق نوشتن ایجاد کرده بودم عمیق‌تر کردم. سفرهایم را چند ماه قبل از تولدم آغاز کردم، زمانی که دو روزنامه‌نگار همکار من را به آخر هفته دخترانه در یکی از خانه‌هایشان در شیکاگو در وسط زمستان دعوت کردند. در آنجا، عاشق پیتزای عمیق و بال‌های اردک لعاب‌دار شدم و احساس کردم یک رابطه حرفه‌ای به دوستی واقعی عمیق‌تر شده است. فقط چند دقیقه وقت گذاشتن در زندگی واقعی طول کشید تا بفهمم چقدر به این دو زن اعتماد دارم - و چقدر راحت می‌توانم به آنها کمک کنم تا هر زمان که بخواهند، در هر کاری که نیاز دارند، کمک کنم. چند هفته بعد، دوباره با سه دوست دیگر در شهر نیویورک متحد شدیم تا در یک جشن معرفی کتاب در خانه معلممان شرکت کنیم. این گروه بین نسلی است - از اواسط دهه 20 تا 60 سالگی. همه ما دو سال پیش در یک کلاس نویسندگی آنلاین با هم آشنا شدیم و", "image_url": "https://i.insider.com/6ad91bd62a1b5bc156b1abab?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآو       media: [{"source": "Billboard", "title": "Billy Idol On His ‘Incredibly Wild’ Rock & Roll Hall Of Fame Induction & Who He Hopes To See There", "link": "https://www.billboard.com/music/rock/billy-idol-rock-roll-hall-of-fame-induction-interview-1236376285/", "summary": "On Nov. 14, Billy Idol will be inducted into the Rock Roll Hall of Fame’s class of 2026 in Los Angeles, along with his longtime co-writer, guitarist and friend Steven Stevens. The timing is especially meaningful for Idol: 2026 marks 50 years since the British rocker started making music in punk band Generation X in 1976. He later went solo and became a global superstar with blistering, sneering Hot 100 hits such as “White Wedding,” “Rebel Yell” and “Cradle of Love.” Ahead of the induction ceremony, the City of Los Angeles has declared Nov. 13 Billy Idol Day; to mark the occasion, Idol and Stevens will play a free acoustic show at the very un-rocker time of 10 a.m. Performing, no matter the time, continues to be a thrill. “We’re going to do it while we can,” says Idol. “Rocking till we drop.” Idol, 70, talked to Billboard about what the Rock Hall honor means to him and what’s next. Related John Sykes on 2026 Rock Hall Inductions, Why Voters Embraced So Many Acts From the 1980s Their Curious Snub of Mariah Carey Touring Power Players: Billboard’s 2026 List Revealed Meet the ‘Unflappable’ Exec Bringing Superstars To Madison Square Garden and Sphere What did you think when you heard you got in? It’s incredibly wild. I fell in love with rock’n’roll when I was 7 years old, so I started to dream about being in a group and writing songs and making music from [then on]. Why do you think this year was your year after not getting elected last year? I’m not sure. Maybe it’s because there’s a number of other English people going in this year: Phil Collins, New Order, Joy Division, Oasis. I know sometimes it does take a couple of years. Who are you most excited to hang out with? It’d be great to see Noel [Gallagher from Oasis]. He came and saw us in South America when we played. I did a charity [version of The Who’s] Tommy with Phil Collins in 1989. He was [Uncle Ernie], I was Cousin Kevin. What does it mean to you that Steve is going in with you? That s the icing on the cake, really, because he s so great. He s always been there for me. It just made it for me when they said we d go in together. Are there artists already in the Hall that you can’t believe you’re joining? Yeah, The Velvet Underground, Lou Reed, David Bowie, The Rolling Stones. So many. The New York Dolls should be in. That s the only problem. Come on, you know they should be in. You re still very popular. It s all a gift and an incredible one. Most people don t get to live their dreams. There’s ups and d", "date_str": "2026-11-09T18:52:34+00:00", "hash": "e9640e02dff87b10", "title_fa": "بیلی آیدل در تالار مشاهیر راک اند رول فوق‌العاده وحشی و کسانی که امیدوار است در آنجا ببیند", "summary_fa": "در 14 نوامبر، بیلی آیدل به همراه نویسنده قدیمی، گیتاریست و دوستش استیون استیونز، وارد کلاس تالار مشاهیر راک رول 2026 در لس آنجلس خواهند شد. این زمان به ویژه برای آیدل بسیار مهم است: سال 2026 50 سال از زمانی که راکر بریتانیایی شروع به ساخت موسیقی در گروه پانک Generation X در سال 1976 کرد، می گذرد. او بعداً به صورت انفرادی رفت و با آهنگ‌های پرطرفدار و تمسخر آمیز ۱۰۰ آهنگ داغ مانند «White Wedding»، «Rebel Yell» و «Cradle of Love» به یک سوپراستار جهانی تبدیل شد. قبل از مراسم معارفه، شهر لس آنجلس 13 نوامبر را روز بیلی آیدل اعلام کرده است. به مناسبت این مناسبت، آیدل و استیونز یک نمایش آکوستیک رایگان را در ساعت 10 صبح اجرا خواهند کرد که بدون توجه به زمان، اجرا همچنان هیجان‌انگیز است. آیدل می گوید: «تا زمانی که بتوانیم این کار را انجام خواهیم داد. \"تکان دادن تا زمانی که رها کنیم.\" آیدل، 70 ساله، با بیلبورد در مورد اینکه افتخار تالار راک برای او چه معنایی دارد و چه چیزی در آینده است، صحبت کرد. مرتبط با جان سایکس در سال 2026 معرفی راک هال، چرا رای دهندگان از کارهای دهه 1980 استقبال کردند. فوق العاده وحشی است من از 7 سالگی عاشق راک اندرول شدم، بنابراین شروع کردم به رویای حضور در یک گروه و نوشتن آهنگ و ساختن موسیقی از [از آن به بعد]. چرا فکر می کنید امسال سالی بود که سال گذشته انتخاب نشدید؟ من مطمئن نیستم. شاید به این دلیل است که تعدادی انگلیسی دیگر در این سال حضور دارند: فیل کالینز، New Order، Joy Division، Oasis. می دانم که گاهی چند سال طول می کشد. برای معاشرت با چه کسی بیشتر هیجان زده هستید؟ دیدن نوئل [گالاگر از Oasis] بسیار عالی است. او آمد و ما را در آمریکای جنوبی که", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/billy-idol-billboard-2026-bb12-cr-nick-spanos-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۲۲:۲۲"}, {"source": "Billboard", "title": "The Longest-Leading Billboard Hot 100 No. 1s: ‘Choosin’ Texas’ & More", "link": "https://www.billboard.com/lists/hot-100-number-1-songs-on-top-longest/", "summary": "Beginning with Debby Boone’s “You Light Up My Life” in 1977, a relatively select few smashes have led the Billboard Hot 100 for at least 10 weeks. How few? Just a mere 4% of all Hot 100 No. 1s dating to the chart’s launch on Aug. 4, 1958, have earned the achievement. Olivia Newton-John’s “Physical” flexed 10 weeks at No. 1 in 1981-82, and that smash and Boone’s shared the mark for the longest Hot 100 reign for more than a decade, until Boyz II Men’s “End of the Road” dominated for 13 weeks in 1992. That best lasted briefly, as Whitney Houston’s “I Will Always Love You” led for 14 weeks in late 1992/early 1993. In 1995-96, Mariah Carey and Boyz II Men’s “One Sweet Day” ran up 16 weeks at No. 1, a milestone that held for more than 23 years. (Songs began logging longer No. 1 stays after the Hot 100 adopted electronically tracked data, according to Luminate, in late 1991.) In 2017, Luis Fonsi and Daddy Yankee’s “Despacito,” featuring Justin Bieber, tied the No. 1 run of “One Sweet Day.” By 2019, Lil Nas X’s “Old Town Road,” featuring Billy Ray Cyrus, collected 19 weeks atop the Hot 100, a mark matched by Shaboozey’s “A Bar Song (Tipsy)” beginning in July 2024. Related Ella Langley’s ‘Choosin’ Texas’ Holds Off Michael Jackson’s ‘Thriller’ for 27th Week Atop Hot 100 On the Sept. 5, 2026-dated Hot 100, Ella Langley’s “Choosin’ Texas” became the sole longest-leading non-holiday hit, with its 20th week at No. 1. As of the Nov. 14 survey, it’s the overall record holder with 27 weeks, having surpassed Mariah Carey’s “All I Want for Christmas Is You,” which has jingled to No. 1 for 22 weeks over each holiday season since December 2019. In honor of the singles that have claimed the Hot 100’s top spot the longest, here’s a look at the elite leaders to rule for double-digit weeks.", "date_str": "2026-11-09T18:52:30+00:00", "hash": "761430718940e98f", "title_fa": "طولانی ترین پیشروترین بیلبورد داغ 100 شماره 1: \"Choosin\" Texas\" و بیشتر", "summary_fa": "با شروع با «You Light Up My Life» اثر دبی بون در سال 1977، تعداد نسبتاً معدودی شکسته شده حداقل 10 هفته در بیلبورد Hot 100 پیشتاز بوده است. چند کم تنها 4 درصد از تمام 100 هات شماره 1 مربوط به زمان راه اندازی نمودار در 4 اوت 1958، این دستاورد را کسب کرده اند. \"فیزیکال\" اولیویا نیوتن جان به مدت 10 هفته در رتبه اول قرار گرفت. 1 در سال‌های 1981-1982، و آن شکست و بون برای بیش از یک دهه، طولانی‌ترین دوره سلطنت را در 100 داغ به دست آوردند، تا اینکه «پایان جاده» مردان Boyz II به مدت 13 هفته در سال 1992 تسلط یافت. 1992/اوایل 1993. در 1995-1996، ماریا کری و بویز II مردان «یک روز شیرین» به مدت 16 هفته در رتبه اول قرار گرفتند، نقطه عطفی که بیش از 23 سال ادامه داشت. (آهنگ ها دیگر شروع به ثبت نام کردند. 1 پس از اینکه Hot 100 داده‌های ردیابی الکترونیکی را در اواخر سال 1991 پذیرفت، باقی می‌ماند.) در سال 2017، «Despacito» لوئیس فونسی و بابا یانکی، با حضور جاستین بیبر، در رتبه اول «One Sweet Day» قرار گرفتند. تا سال 2019، «جاده شهر قدیمی» از لیل ناس ایکس، با حضور بیلی ری سایرس، 19 هفته در صدر 100 قرار گرفت که با آهنگ «آهنگ بار (تیپسی)» شابوزی که در ژوئیه 2024 شروع شد، مطابقت داشت. مرتبط با «Choosin» تگزاس از الا لنگلی، «Thriller» مایکل جکسون را برای هفته بیست و هفتم در بالای 100 داغ متوقف کرد در تاریخ 5 سپتامبر 2026، «Choosin» تگزاس، الا لنگلی، با رتبه 20 روزه، تنها طولانی ترین موفق ترین هفته از هفته اول 100 شد. نظرسنجی 14 نوامبر، رکورددار کلی با 27 هفته است و از ماریا کری \"All I Want for Christmas Is You\" که از دسامبر 2019 در هر فصل تعطیلات به مدت 22", "image_url": "https://www.billboard.com/wp-content/uploads/2025/04/12Artboard-4-hot-100-ten-weeks-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۲۲:۲۲"}, {"source": "Billboard", "title": "Paul McCartney Is a Billionaire — and the World’s Third-Richest Musician — According to Forbes", "link": "https://www.billboard.com/music/music-news/paul-mccartney-billionaire-third-richest-musician-1236378066/", "summary": "Paul McCartney sang in 1964, I don t care too much for money — money can t buy me love. More than six decades later, the former Beatle is officially a billionaire, according to Forbes . Related Here Are Paul McCartney’s Likely Grammy Competitors for Best Traditional Pop Vocal Album A Brief History of the Ownership of the Beatles Catalog Paul McCartney s Career Boxscore Total Soars Past $1 Billion The financial publication declared Monday (Nov. 9) that McCartney s fortune has surpassed $1.4 billion, making him the third-richest musician in the world. Only Jay-Z and Taylor Swift, whose net worths are $2.8 billion and $2 billion, respectively, are above him, Forbes estimates. McCartney is famously savvy with his investments, having learned the hard way how to navigate finances after he and ex-bandmates Ringo Starr, John Legend and George Harrison famously earned very little within the restrictive confines of their initial record contract. The Wings frontman was eventually able to reclaim some ownership of the catalog through lawsuits and renegotiations circa 2017, but before that, he built much of his fortune by starting his publishing company, MPL Communications, and buying the rights to enduring hits that still see returns to this day. These include Christmas standards such as Baby, It’s Cold Outside and Blue Christmas, as well as other classics including Blue Suede Shoes and the scores to musicals such as Grease . Of course, the Liverpool legend is also a touring powerhouse. In 2022, Billboard reported that McCartney s career touring grosses had surpassed $1 billion, per Billboard Boxscore figures; at the time, he was one of just 11 artists to ever hit that figure. Both as one-fourth of The Beatles and as a solo artist, McCartney has forged one of the most commercially successful careers in music of all time. His band still holds the record for most Billboard Hot 100 No. 1 hits of all time with a total of 20, and McCartney has also topped the chart nine other times through his independent work and with Wings, which he formed in 1971 after The Beatles broke up. He s been similarly successful on the Billboard 20 0 , scoring 19 No. 1s with The Beatles and eight individually or with Wings.", "date_str": "2026-11-09T18:50:50+00:00", "hash": "1f17c92844709c55", "title_fa": "پل مک کارتنی یک میلیاردر - و سومین موزیسین ثروتمند جهان - به گفته فوربس است.", "summary_fa": "پل مک کارتنی در سال 1964 آواز خواند، من زیاد برای پول اهمیتی نمی دهم - پول نمی تواند عشق را برای من بخرد. بر اساس گزارش فوربس، بیش از شش دهه بعد، بیتل سابق رسماً یک میلیاردر شد. موارد مرتبط در اینجا رقبای احتمالی پل مک کارتنی برای جایزه گرمی برای بهترین آلبوم آواز سنتی پاپ تاریخچه مختصری از مالکیت کاتالوگ بیتلز هستند. 9) اینکه دارایی مک کارتنی از 1.4 میلیارد دلار فراتر رفته است و او را به سومین نوازنده ثروتمند جهان تبدیل کرده است. فوربس تخمین می زند که فقط جی زی و تیلور سویفت که دارایی خالص آنها به ترتیب 2.8 و 2 میلیارد دلار است بالاتر از او هستند. مک‌کارتنی در سرمایه‌گذاری‌های خود باهوش است، زیرا پس از اینکه او و هم گروه‌های سابق رینگو استار، جان لجند و جورج هریسون درآمد بسیار کمی در چارچوب‌های محدود قرارداد رکورد اولیه‌شان کسب کردند، راه سختی را آموخته است که چگونه امور مالی را مدیریت کند. رهبر گروه Wings در نهایت توانست تا حدودی در سال 2017 از طریق شکایت و مذاکره مجدد تا حدودی مالکیت کاتالوگ را پس بگیرد، اما قبل از آن، او بسیاری از ثروت خود را با راه اندازی شرکت انتشاراتی خود، MPL Communications، و خرید حقوق آثار ماندگاری که هنوز هم تا به امروز شاهد بازگشت هستند، به دست آورد. اینها شامل استانداردهای کریسمس مانند Baby، It’s Cold Outside و Blue Christmas، و همچنین دیگر آثار کلاسیک از جمله کفش های جیر آبی و موسیقی موسیقی هایی مانند Grease است. البته اسطوره لیورپول نیز یک نیروگاه توریستی است. در سال 2022، بیلبورد گزارش داد که درآمد شغلی مک کارتنی در تورهای حرفه ای به ازای هر رقم بیلبورد باکس اسکور از 1 میلیارد دلار فراتر رفته است. در آن زمان، او یکی از تنها 11 هنرمندی بود که تا به حال به", "image_url": "https://www.billboard.com/wp-content/uploads/2026/07/P115PYS4-e1783388498343.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۲۲:۲۰"}, {"source": "Billboard", "title": "No ‘Maybe’ About It: Carly Rae Jepsen to Host & Perform at 2027 Juno Awards", "link": "https://www.billboard.com/music/awards/carly-rae-jepsen-host-perform-2027-juno-awards-1236378058/", "summary": "Carly Rae Jepsen is set to host the 2027 Juno Awards, which will be held at Canada Life Centre in Winnipeg, Manitoba, Canada, on Sunday, April 4. Related Carly Rae Jepsen Talks New Album, 10 Years of Emotion Call Me Maybe Success | Billboard News Interview Carly Rae Jepsen Breaks Records With Call Me Maybe Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City Jepsen’s global smash “Call Me Maybe” which was No. 1 on the Billboard Hot 100 for nine weeks in 2012 won single of the year at the 2013 Juno Awards. Kiss , the album which featured the earworm, won album of the year and pop album of the year. “Call Me Maybe” also got some love at the 2013 Grammy Awards, receiving nominations for song of the year and best pop solo performance. This will be Jepsen’s first time hosting the Juno Awards. The show has been hosted by many of the biggest Canadian music stars, including Shania Twain (2003), Alanis Morissette (2004), Nelly Furtado (2007 and 2024), Drake (2011), Michael Bublé (2013, 2018 and 2025), Bryan Adams (2017) and Sarah McLachlan (2019). Angine de Poitrine is also set to perform on the show. The Quebec duo, consisting of brothers Klek and Khn de Poitrine, has had a breakout year, taking home the 2026 Polaris Music Prize, SOCAN Polaris Song Prize, Billboard Canada Power Players 2026 Global Breakthrough Award and 11 Felix award nominations. Canadian rock band Our Lady Peace , who has received four Juno Awards, will be inducted into the Canadian Music Hall of Fame and take the stage for a live performance. The Juno Awards have been on the move among major Canadian cities since 1989. This will be the show’s third time in Winnipeg, following the shows in 2005 and 2014. “We’re thrilled to bring The Juno Awards back to Winnipeg, a city with such a rich musical history and a deep appreciation for Canadian talent,” Allan Reid, president and CEO, Canadian Academy of Recording Arts Sciences/The Juno Awards, said in a statement. The 56th Annual Juno Awards, produced by Insight Productions (A Blue Ant Studios Company), will air live across Canada at 8 p.m. ET/5 p.m. PT on CBC TV, CBC Gem, CBC Radio One, CBC Music, CBC listen, and stream globally on the CBC s website and on CBC Music s YouTube channel. Exclusive pre-sale opportunities begin Monday (Nov. 9), ahead of the general public on-sale on Friday, Nov. 13, at 10 a.m. ET/CT. Tickets will be available via Ticketmaster .", "date_str": "2026-11-09T18:43:39+00:00", "hash": "008153f4f1c45834", "title_fa": "خبری از «شاید» نیست: کارلی رائه جپسن مجری و اجرای جونو در جوایز 2027", "summary_fa": "Carly Rae Jepsen قرار است میزبان جوایز جونو 2027 باشد، که در مرکز زندگی کانادا در وینیپگ، منیتوبا، کانادا، یکشنبه، 4 آوریل برگزار خواهد شد. مصاحبه بیلبورد نیوز کارلی رائه جپسن با تماس با من رکورد می شکند شاید تیلور سوئیفت و کارلی کلس در بازی سران تراویس کلس در بازی جهانی کانزاس سیتی جپسن با نام «مرا صدا بزن شاید» که شماره اول بود شرکت کنند. 1 در Billboard Hot 100 به مدت نه هفته در سال 2012 برنده بهترین آهنگ سال در جوایز جونو در سال 2013 شد. بوسه، آلبومی که دارای کرم گوش بود، برنده آلبوم سال و آلبوم پاپ سال شد. آهنگ Call Me Maybe همچنین در جوایز گرمی 2013 مورد علاقه قرار گرفت و نامزد دریافت آهنگ سال و بهترین اجرای انفرادی پاپ شد. این اولین باری است که جپسن میزبان جونو است. این برنامه میزبان بسیاری از بزرگترین ستارگان موسیقی کانادایی، از جمله شانیا تواین (2003)، آلانیس موریست (2004)، نلی فورتادو (2007 و 2024)، دریک (2011)، مایکل بوبله (2013، 2018 و 2025)، برایان آدامز (2019) و برایان آدامز (201019) و سارا 2019 (2010) و سارا آدامز بوده است. آنژین دو پوترین نیز قرار است در این نمایش اجرا کند. دوتایی کبک، متشکل از برادران Klek و Khn de Poitrine، یک سال شکست را پشت سر گذاشتند و جایزه موسیقی Polaris 2026، جایزه SOCAN Polaris Song Prize، Billboard Canada Power Players 2026 Global Breakthrough Award و 11 نامزدی جایزه Felix را به خانه بردند. گروه راک کانادایی Our Lady Peace که چهار جایزه جونو را دریافت کرده است به تالار مشاهیر موسیقی کانادا معرفی می شود و برای اجرای زنده روی صحنه می رود. جوایز جونو از سال 1989 در میان شهرهای بزرگ کانادا در حال حرکت بوده است. آلن رید، رئیس و مدیر عامل آکادمی علوم جوایز/The Artno در بیانیه ای از جوایز علمی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/1588933482-e1794246711571.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۲۲:۱۳"}, {"source": "Billboard", "title": "Ella Langley’s ‘Choosin’ Texas’ Holds Off Michael Jackson’s ‘Thriller’ for 27th Week Atop Hot 100", "link": "https://www.billboard.com/lists/ella-langley-choosin-texas-hot-100-number-one-27-weeks/", "summary": "Ella Langley ’s “Choosin’ Texas” continues at No. 1 on the Billboard Hot 100 for a record-extending 27th week atop the chart. The smash fends off a Halloween-sparked surge for Michael Jackson ’s 1980s classic “Thriller,” which pounces to a new No. 2 Hot 100 peak. As “Choosin’ Texas” furthers its reign, here’s an updated look at the longest-leading hits, ranked by most weeks spent at No. 1, since the Hot 100 began in August 1958: 27 weeks (to date), “Choosin’ Texas,” Ella Langley, 2026 22, “All I Want for Christmas Is You,” Mariah Carey, 2019-26 19, “A Bar Song (Tipsy),” Shaboozey, 2024 19, “Old Town Road,” Lil Nas X feat. Billy Ray Cyrus, 2019 16, “Last Night,” Morgan Wallen, 2023 16, “Despacito,” Luis Fonsi Daddy Yankee feat. Justin Bieber, 2017 16, “One Sweet Day,” Mariah Carey Boyz II Men, 1995-96 “Choosin’ Texas” first led the Hot 100 in February, on its way to setting multiple chart records . Read on for details of the entire top 10 on this week’s Hot 100, including more about Jackson’s climb and a new No. 3 high for Tame Impala and JENNIE ’s fellow Halloween-friendly hit, “Dracula.” Notably, the three metrics that power the Hot 100 are paced by spook-tacular titles: “Thriller” tops the Streaming Songs and Digital Song Sales charts, each for the first time, and “Dracula” holds at No. 1 on Radio Songs . Related Billboard to Update Chart Methodology in 2027 Following Annual Industry Revenue Review The Hot 100 blends all-genre U.S. streaming (official audio and official video), radio airplay and sales data, the lattermost metric reflecting purchases of physical singles and digital tracks from full-service digital music retailers; digital singles sales from direct-to-consumer (D2C) sites are excluded from chart calculations. All charts dated Nov. 14, 2026, will update on Billboard.com tomorrow, Nov. 10. For all chart news, you can follow @billboard and @billboardcharts on both X, formerly known as Twitter, and Instagram. Plus, for all chart rules and explanations, click here . Related YouTube Streaming Data to Return to Billboard Charts Luminate, the independent data provider to the Billboard charts, completes a thorough review of all data submissions used in compiling the weekly chart rankings. Luminate reviews and authenticates  "link": "https://www.billboard.com/music/rb-hip-hop/chris-brown-sings-fan-usher-kicked-off-stage-tour-1236377906/", "summary": "The viral fan who Usher kicked off stage after an uncomfortable exchange in July returned on Sunday (Nov. 8) in Atlanta as Gabrielle Cheyenne got her wish to have her moment with Chris Brown. Related Fan Kicked Off Stage by Usher Responds to Critics: I Wasn t Going Up There for Usher Usher Claps Back After Fan He Kicked Off Stage Reacted to Criticism of Viral Moment Usher Chris Brown s R B Tour: All of the Surprise Guests So Far Footage from the Mercedes-Benz Stadium show found Cheyenne in a trance as she was happily handcuffed to a dance pole while C. Breezy serenaded her with his 2007 hit Take You Down. Cheyenne was all smiles on her IG Story and she even made the cut in Brown s recap of Sunday s show, which he posted to his Instagram Monday. This turn of events ties back to the July 25 stop in Nashville of the R B Tour, during which Usher brought Cheyenne on stage for Can U Handle It?, which ended in an awkward encounter. “I don’t think she want to be on the stage,” the Yeah! hitmaker said at the time as Cheyenne squirmed and seemed disinterested. The exchange quickly became a viral moment from the trek, and Cheyenne spoke out on social media to defend herself, as the fan said she was hoping to be meeting Brown and not Usher. “Yes I [went] on stage and no they don’t tell you who, what, when, where. Baby, I wasn’t going up there for Usher, I wanted CHRIS and CHRIS only,” she shared at the time. “Anywayss, anybody who wasn’t sitting VIP or has a face card that doesn’t qualify should hush. Usher playfully responded to the chatter days later at the July 28 show in Birmingham, Ala. “Now before we get started, don’t bring your a up here if you don’t want to be here,” Usher said to the Protective Stadium audience. “God don’t like ugly, but he most certainly don’t feel too good about pretty privilege either.” Usher and Chris Brown are currently www.billboard.com/wp-content/uploads/2026/11/chris-brown-rb-tour-nov2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۲۱:۱۳"}, {"source": "Billboard", "title": "The More Digital Our Lives, the More We Value Live (Guest Column)", "link": "https://www.billboard.com/pro/kirk-sommer-guest-post-live-music-value/", "summary": "As digital becomes infinite, real-world human experiences become premium. The last revolution in entertainment brought digital content to the world. The next will bring the world together in person. The opportunity in live entertainment has never been bigger. Related Touring Power Players: Billboard’s 2026 List Revealed Michael Sanft, Attorney Who Represented Keffe D in 2Pac Murder Trial, Dies at 54 Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 More fans are attending live events than ever before, and they are spending more when they get there. New markets are emerging, investment in venues and infrastructure is accelerating and technology is connecting artists with audiences in ways that would have been unimaginable a decade ago. Humans have a biological drive to maintain authentic social contact. When those interactions or experiences become insufficient, the more one typically craves them in real life. The more time we spend in our digital environments, the more we value experiences that bring us together in the real world. Whether it s music, sports, theater, dining, padel or immersive entertainment, consumers are demonstrating an extraordinary appetite for shared, in-person experiences. That appetite or “social rewilding” is continuing to create the most compelling growth opportunities in the live economy we have ever seen. Technology has made content available everywhere, instantly. But the more pervasive social media is and the easier it becomes to access content, the more valuable it becomes to experience something live. You can stream a song a of mine in one of her new songs. And do you know what? I couldn t care less,” Williams said. “I m not going after her. Because I think at some point, some f king sanity has to prevail.” The British singer went even further, broadly criticizing the rush to accuse pop artists of copying earlier songs. Williams wrote that there are “only so many notes” and that all artists “all stand on the shoulders of people who came before us.” “Artists deserve to be protected. But there s a difference between protecting your work and treating every vaguely familiar sequence of notes as a winning lottery ticket,” Williams said. “Some of this stuff has become ambulance chasing. And I think it s disgusting.” Williams is hardly the first pop star to express that sentiment. Ed Sheeran, who faced several high profile lawsuits, once noted there are “ very few chords used in pop music.” Charlie Puth defended Taylor Swift when she faced scrutiny over tracks on her The Life of a Showgirl album, saying in a TikTok that there are “bound to be similarities” to something that came before. “Coincidental similarity between short bits of melody is way more common than people think it is,” Joe Bennett, a veteran forensic musicologist, told Billboard in September . “And songwriters simply being out of ideas and plagiarizing each other is way less common than people think it is.” The frenzy over Rodrigo is likely driven by her own previous encounters with allegations of copying on her breakout 2021 album Sour . In July 2021, she retroactively added the trio of Taylor Swift, Jack Antonoff and St. Vincent as songwriters on “Deja Vu” over simil", "date_str": "2026-11-09T17:04:30+00:00", "hash": "109564ffa852423f", "title_fa": "رابی ویلیامز از اولیویا رودریگو دفاع می‌کند در میان ادعاهایی که «مرا به خانه ببر» مانند آهنگ او به نظر می‌رسد: «من نمی‌توانستم کمتر اهمیت بدهم»", "summary_fa": "رابی ویلیامز می گوید که از اولیویا رودریگو شکایت نمی کند، زیرا برخی از طرفداران ادعا کردند که آهنگ تعطیلات او \"Take Me Home (4 کریسمس) شبیه آهنگ او \"Candy\" است، و او فکر می کند که چنین شکایت هایی \"منزجر کننده\" و \"بسیار غم انگیز\" هستند. مطالب مرتبط رابی ویلیامز احساس را برای 2026 به ارمغان می آورد اجرای سرفصل جام ملبورن اولیویا رودریگو تک آهنگ تعطیلات را باز می کند (4 کریسمس) : اکنون آن را پخش کن \"شما برای دختری خیلی عاشق\" از اولیویا رودریگو غمگین به نظر می رسید. هفته چهارم. آهنگ کریسمس، منتشر شده در نوامبر 5، به نوعی موفقیت رابی در سال 2012 را از بین برد. اما در یک پست طولانی در اینستاگرام دوشنبه (9 نوامبر)، ویلیامز از خواننده \"Good 4 U\" دفاع کرد، او را \"f king درخشان\" خواند و از این ایده که ممکن است از او شکایت کند انتقاد کرد. ویلیامز گفت: \"به نظر من به نظر می رسد که او به طور تصادفی با پژواک موسیقایی من در یکی از آهنگ های جدیدش برخورد کرده است. \"من دنبال او نمی روم. چون فکر می‌کنم در مقطعی، برخی از عقل سلیم پادشاه باید غالب شود.» این خواننده بریتانیایی فراتر رفت و به طور گسترده از عجله متهم کردن هنرمندان پاپ به کپی کردن آهنگ های قبلی انتقاد کرد. ویلیامز نوشت که \"تنها یادداشت های زیادی وجود دارد\" و همه هنرمندان \"همه بر روی شانه های افرادی می ایستند که قبل از ما آمده اند.\" «هنرمندان شایسته حمایت هستند. ویلیامز گفت: اما بین محافظت از کار خود و تلقی با هر دنباله یادداشت‌های آشنای مبهم به عنوان یک بلیط برنده بخت آزمایی تفاوت وجود دارد. \"برخی از این چیزها به تعقیب آمبولانس تبدیل شده است. و من فکر می کنم منزجر کننده است.\" ویلیامز به سختی اولین ستاره پاپ است که", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/robbie-williams-olivia-rodrigo-split-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۲۰:۳۴"}, {"source": "Billboard", "title": "What’s the Deal With Support Acts on Tours Today?", "link": "https://www.billboard.com/music/concerts/tour-opening-acts-shift-budget-analysis-1236376297/", "summary": "In the past 12 months, Ariana Grande, Rosalía and Lady Gaga all completed blockbuster arena tours in support of chart-topping albums, complete with large-scale production, choreography and outfit changes. But they also had something else in common: no opening acts. While plenty of pop’s biggest artists are still booking buzzy support, tighter budgets, shorter pipelines to stardom and dwindling attention spans are changing the market for pop tour openers and the agents who book them. “There’s all these different cost balance analyses going on,” says Nathaniel Marro, executive director of the National Independent Talent Organization (NITO), which advocates for a sustainable music ecosystem and supports independent music professionals. And while pop tours — especially at the arena level, where bigger budgets, capacity and higher ticket costs rule — are more immune to the industrywide financial squeeze, “everything is more expensive,” Marro maintains. “When you’re looking at these big pop acts, you have very specific stage setups. Adding anything to or detracting from that is a big deal. And then if you are adding anyone to these arena shows, you have to think, ‘Are they actually going to add any value?’ If I’m going to go see Lady Gaga, do I really care about what’s happening before Lady Gaga? Related Touring Power Players: Billboard’s 2026 List Revealed More Than ‘Luck’: How Hilary Duff Became An Arena Pop Star — and Bigger Than Ever How Is Weezer Killing It in Arenas, 30 Years In? (Hint: Gen Z Loves Them, Too) “Sometimes, I just want an hour-and-a-half and I want to go home,” he continues. “We’re battling people so much for attention these days, and we’re battling people so much to get off the couch and do things, that when you’re talking about adding another act and the headliner not going on till 9, 9:30, all these things start to add up. It’s [about] how to make the concertgoing experience repeatable for fans.” Performing sans opener worked just fine for Gaga, who topped Billboard ’s midyear touring report. And without an opening act, there was no required percentage split after that tour’s ­expenses were paid for; as Marro explains, while the promoter typically pays the opener, the headliner still stands to make less money in the end since that opener’s costs cut into overall profit. That’s significant at a time when “everyone wants more money,” says Nina Swint, an agent at the global independent agency ROAM. While Swint’s focus is on ascendant punk and", "date_str": "2026-11-09T17:04:18+00:00", "hash": "5d12f40a111e8f6b", "title_fa": "معامله با قوانین پشتیبانی در تورهای امروزی چیست؟", "summary_fa": "در 12 ماه گذشته، آریانا گرانده، روزالیا و لیدی گاگا همگی تورهای صحنه پرفروشی را در حمایت از آلبوم‌های پرطرفدار، با تولید، طراحی رقص و تغییرات لباس در مقیاس بزرگ، تکمیل کردند. اما آنها وجه مشترک دیگری هم داشتند: بدون افتتاحیه. در حالی که بسیاری از بزرگ‌ترین هنرمندان پاپ هنوز در حال رزرو پشتیبانی پرهیاهو هستند، بودجه‌های محدودتر، خطوط لوله کوتاه‌تر به سمت ستاره شدن و کاهش دامنه توجه، بازار افتتاح‌کنندگان تورهای پاپ و عواملی که آنها را رزرو می‌کنند، تغییر می‌دهد. ناتانیل مارو، مدیر اجرایی سازمان استعدادهای ملی مستقل (NITO)، که از یک اکوسیستم موسیقی پایدار حمایت می کند و از حرفه ای های موسیقی مستقل حمایت می کند، می گوید: «همه این تجزیه و تحلیل های مختلف تعادل هزینه در حال انجام است. و در حالی که تورهای پاپ - به ویژه در سطح عرصه، که در آن بودجه‌های بزرگ‌تر، ظرفیت و هزینه‌های بیشتر بلیت حکمرانی می‌کند - در برابر فشار مالی در سراسر صنعت مصونیت بیشتری دارند، مارو می‌گوید: «همه چیز گران‌تر است». وقتی به این کنسرت‌های پاپ بزرگ نگاه می‌کنید، چیدمان‌های صحنه بسیار خاصی دارید. اضافه کردن یا کاهش دادن چیزی به آن کار بزرگی است. و سپس اگر کسی را به این نمایش‌های صحنه اضافه می‌کنید، باید فکر کنید، «آیا آنها واقعاً ارزشی خواهند داشت؟» اگر قرار است به دیدن لیدی گاگا بروم، آیا واقعاً برایم مهم است که قبل از لیدی گاگا چه اتفاقی می‌افتد؟ بازیکنان قدرتمند تور مرتبط: فهرست بیلبورد در سال 2026 بیش از \"شانس\" فاش شد: چگونه هیلاری داف به یک ستاره پاپ آرنا تبدیل شد - و بزرگتر از همیشه. (نکته: ژنرال Z هم آنها را دوست دارد) او ادامه می دهد: \"گاهی اوقات، من فقط یک ساعت و نیم می خواهم و می خواهم به خانه برگردم.\" ما این روزها آنقدر برای جلب توجه با مر رمی و جایگاهی در صدر 100 جایزه داغ بیلبورد به ارمغان آورد. داستان های مرتبط: خانه پدری از شما می خواهد که دوباره فکر کنید. TV The Other Elliot Sister Greenlit در BritBox با راه اندازی فرانچایز Austen Anthology (انحصاری) که پس از آن که Jepsen در سال 2007 در Canadian Idol سوم شد. دومین آلبوم استودیویی او، بوسه، برنده آلبوم سال و آلبوم پاپ سال در جوایز جونو در سال 2013 شد، در حالی که جایزه تک‌آهنگ سال را نیز از آن خود کرد. جپسن به تازگی آخرین پروژه خود را به نام روز و شب منتشر کرده است که یک آلبوم دوگانه 24 قطعه ای است. جوایز جونو در سال 2026، نسخه کانادایی جایزه گرمی، توسط می مارتین میزبانی شد و جونی میچل، خواننده و ترانه سرای افسانه ای فولک، در یک حضور عمومی نادر در کانادا برای دریافت جایزه یک عمر دستاورد حضور داشت. مایکل بوبله میزبان جونو 2025", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/09/CRJ-by-Mikayla-LoBasso-461043556-R1-65-e1789745437817.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۲۱:۲۸"}, {"source": "Hollywood Reporter", "title": "Pink Announces Sphere Residency, Becomes First Female Solo Headliner at Venue", "link": "https://www.hollywoodreporter.com/music/music-news/pink-announces-residency-sphere-1236750926/", "summary": "The shows will take place next fall and mark the pop star's first-ever residency and her most notable shows since wrapping her Summer Carnival tour in 2024.", "date_str": "2026-11-09T17:41:35+00:00", "hash": "12917abf8e0a37ac", "title_fa": "پینک رزیدنسی Sphere را اعلام کرد و اولین زن انفرادی سرتیتر در محل برگزاری شد", "summary_fa": "این برنامه‌ها پاییز آینده برگزار می‌شود و اولین اقامت ستاره پاپ و برجسته‌ترین نمایش‌های او از زمان پایان دادن به تور تابستانی کارناوالش در سال 2024 است. ستاره پاپ روز دوشنبه اعلام کرد که پینک قرار است در سال آینده یک اقامتگاه 9 روزه در Sphere در لاس وگاس داشته باشد. پینک روز دوشنبه در شبکه‌های اجتماعی خود نوشت: سال‌ها، و بالاخره می‌توانم آن را با همه شما به اشتراک بگذارم. جشن بگیریم اوج، پست، جدید، ترسناک، کاری که
