اغلب در این فکر بودم: خدای من، ای کاش می‌توانستم این روند را سریع‌تر انجام دهم. من هرگز فقط به این نگاه نمی کنم که آیا کسی می تواند این کار را انجام دهد یا خیر. بیشتر به این موضوع می پردازد که آیا آنها می توانند به وضوح ارتباط برقرار کنند، قضاوت درستی داشته باشند و ادامه دهند. به عنوان یک مربی شغلی برای کارگران جوان، من می‌دانم که چیزهایی وجود دارد که شما، به عنوان یک کارمند، بر اساس آن‌ها قضاوت می‌شوید که هیچ‌کس در اصل آن را درج نمی‌کند. ما انتظار داریم که مردم به مرور زمان آنها را کشف کنند، اما در واقعیت، کسی باید به آنها آموزش دهد. ژنرال Z"}, {"source": "Business Insider", "title": "I downsized from a 3-bedroom to a 2-bedroom when I got married. There's one thing I miss.", "link": "https://www.businessinsider.com/downsized-house-no-guestroom-pros-cons-2026-10", "summary": "The author and her son moved into her husband s 2-bedroom townhome. Courtesy of Ashley Archambault When my husband and I got married, we had to decide where to live. My son and I ended up moving into his 2-bedroom home. There are a few pros, but we didn't consider how much we'd miss having a guest room. When my husband and I got married, we each had our own homes. I had a one-story, 3-bedroom home, while my husband had a 2-story, two-bedroom townhome . At first, we compared the pros and cons of each house. For instance, my house had a large yard, which can be a perk size-wise, but lawn maintenance was a chore. While my husband was willing to move, we ultimately chose his house, mainly because it was so close to his job. I knew from experience what a blessing an easy commute is, and I didn't want him to have to give it up, so we decided to consolidate. My son and I moved from our 3-bedroom home to my husband's 2-bedroom townhouse. I was giddy when we got married, and thinking more about moving in together and planning our wedding than the long-term realities of living in a smaller home. The lack of an extra bedroom was an issue we didn't foresee My son and I still occasionally miss our old home, but I don't regret selling my home and moving in with my husband. The worst part of downsizing has been no longer having a guest room. I mainly used the third room in my house as an office, but the bedrooms at my husband's house were large enough that there would be room for an office in ours. And my son would still have his own bedroom, so we didn't realize how much we'd miss the extra bedroom until it was too late. It's nearly impossible for us to have anyone spend the night or a weekend with us I'd mostly thought of the extra room as my office, and didn't consider that we also used it as a guest room. Now, without it, it's difficult to have anyone over for the night. We have a few options, but none of them are appealing to anyone, including our potential guests. When I had my own home, it was so easy to have friends visit for the weekend, because I could offer them a room. Having space for guests is a privilege I didn't realize I'd miss. I can still offer the chance to stay, but when someone takes us up on it, my husband and I feel kind of awful the whole time. We've had guests overnight and offered them the couch pullout or the air mattress. But despite our best efforts, everyone feels a little awkward because our guests have no privacy without an actual room of", "date_str": "2026-10-17T11:52:01+00:00", "hash": "1f91831e7f4ae9ad", "title_fa": "وقتی ازدواج کردم از 3 خوابه به 2 خوابه کوچکتر شدم. یه چیز هست که دلم تنگ شده", "summary_fa": "نویسنده و پسرش به خانه 2 خوابه شوهرش نقل مکان کردند. با حسن نیت از اشلی آرچامبل وقتی من و شوهرم ازدواج کردیم، باید تصمیم می گرفتیم که کجا زندگی کنیم. من و پسرم در نهایت به خانه 2 خوابه او نقل مکان کردیم. چند حرفه ای وجود دارد، اما ما در نظر نگرفتیم که چقدر دلمان برای داشتن یک اتاق مهمان تنگ شده است. زمانی که من و شوهرم ازدواج کردیم، هر کدام خانه های خود را داشتیم. من یک خانه یک طبقه و 3 خوابه داشتم، در حالی که شوهرم یک خانه شهری 2 طبقه و دو خوابه داشت. در ابتدا، مزایا و معایب هر خانه را با هم مقایسه کردیم. به عنوان مثال، خانه من یک حیاط بزرگ داشت که می تواند از نظر اندازه یک امتیاز باشد، اما نگهداری از چمن کاری سخت بود. در حالی که شوهرم مایل به نقل مکان بود، ما در نهایت خانه او را انتخاب کردیم، عمدتاً به این دلیل که به شغل او نزدیک بود. من به تجربه می دانستم که رفت و آمد آسان چه نعمتی است، و نمی خواستم او مجبور شود آن را رها کند، بنابراین تصمیم گرفتیم که یکپارچه شویم. من و پسرم از خانه 3 خوابه خود به خانه شهری 2 خوابه شوهرم نقل مکان کردیم. وقتی با هم ازدواج کردیم گیج بودم و بیشتر به زندگی مشترک و برنامه ریزی عروسی مان فکر می کردم تا واقعیت های طولانی مدت زندگی در یک خانه کوچکتر. نداشتن اتاق خواب اضافی مسئله ای بود که ما پیش بینی نمی کردیم پسرم و من هنوز هم گاهی اوقات دلتنگ خانه قدیمی مان می شویم، اما از فروش خانه و نقل مکان با شوهرم پشیمان نیستم. بدترین بخش کوچک سازی دیگر نداشتن اتاق مهمان بوده است. من عمدتاً از اتاق سوم خانه به عنوان دفتر استفاده می کردم،"}, {"source": "Business Insider", "title": "I was diagnosed with breast cancer a year ago. Please stop calling me a fighter.", "link": "https://www.businessinsider.com/breast-cancer-survivor-dislikes-fighter-warrior-labels-pinkwashing-2026-10", "summary": "The author, shown with her family, was diagnosed with breast cancer in October of 2025. Courtesy of the author A year after my breast cancer diagnosis, I'm rejecting the \"fighter\" and \"warrior\" labels others put on me. I'm tired of the pinkwashing that feels like it's turning a terrifying disease into a cheerful marketing campaign. I'm grateful for my care and the people who supported me, but I don't need to find a silver lining or turn my experience into an inspirational story. I was diagnosed with breast cancer a year ago, and with Breast Cancer Awareness Month underway, I have a confession that feels almost sacrilegious: I hate breast cancer culture . I hate the \"fighter\" and \"warrior\" labels I didn't ask for, and I especially hate the over-the-top pink branding that I see so much. I didn't ask to join this club. I didn't want to lose my hair to chemo or have my breasts amputated . I didn't choose to worry about whether my kids and relatives might also develop this horrible disease. And I hate pink; I always have. I'm grateful for my treatment and that I've weathered it all relatively well. I just feel pissed that this was my lot in life. As I reach the anniversary of the day my \"before\" split into the \"after,\" I don't know what I'm supposed to call myself now. \"Fighter\" doesn't feel right. \"Warrior\" definitely doesn't, and \"survivor\" is complicated. The author said she doesn t like the warrior or fighter labels often given to those being treated for breast cancer. Courtesy of Kate Loweth. I didn't choose to fight cancer I understand that people mean well when they call someone a fighter. They want to acknowledge what she's enduring and remind her she's strong. Pink ribbons and awareness campaigns can raise money and encourage screenings, and those are all wonderful things. But in the rush to turn cancer into a story about courage and hope, there's little room for the less inspirational feelings: anger, resentment, exhaustion, and fear. I didn't fight cancer in the way people seem to imagine. I showed up for appointments, followed my doctors' recommendations, and endured treatment because I wanted to live. I didn't have some extraordinary reserve of bravery. I didn't get to opt out. What was the alternative? The author, shown with her daughter while getting treatment, said she would happily trade every bit of perspective she has gained for the life she had before her diagnosis. Courtesy of Kate Loweth. I didn't earn a special title by going through chem", "date_str": "2026-10-17T11:47:01+00:00", "hash": "93c1159b4994aa33", "title_fa": "من یک سال پیش به سرطان سینه مبتلا شدم. لطفا من را مبارز خطاب نکنید.", "summary_fa": "این نویسنده که به همراه خانواده‌اش نشان داده شده است، در اکتبر سال 2025 به سرطان سینه مبتلا شد. با احترام نویسنده یک سال پس از تشخیص سرطان سینه‌ام، برچسب‌های \"مبارز\" و \"جنگجو\" را که دیگران روی من گذاشته‌اند را رد می‌کنم. من از شستشوی صورتی خسته شده ام که احساس می کند یک بیماری وحشتناک را به یک کمپین بازاریابی شاد تبدیل می کند. من از مراقبت خود و افرادی که از من حمایت کردند سپاسگزارم، اما نیازی ندارم که یک خط نقره ای پیدا کنم یا تجربه خود را به یک داستان الهام بخش تبدیل کنم. من یک سال پیش تشخیص داده شد که به سرطان سینه مبتلا هستم، و با برگزاری ماه آگاهی از سرطان سینه، اعترافی دارم که تقریباً توهین آمیز به نظر می رسد: من از فرهنگ سرطان سینه متنفرم. من از برچسب‌های \"جنگجو\" و \"جنگجو\" که نخواستم متنفرم، و به خصوص از مارک صورتی بیش از حد که آنقدر می بینم متنفرم. من نخواستم به این باشگاه بپیوندم. من نمی خواستم موهایم را در اثر شیمی درمانی از دست بدهم یا سینه هایم را قطع کنند. من انتخاب نکردم که نگران این باشم که آیا فرزندان و بستگانم نیز ممکن است به این بیماری وحشتناک مبتلا شوند. و من از صورتی متنفرم. من همیشه دارم. من از درمانم سپاسگزارم و از اینکه همه آن را نسبتاً خوب تحمل کردم. من فقط از اینکه این سهم من در زندگی بود عصبانی هستم. وقتی به سالگرد روزی می رسم که «قبل» من به «پس از» تقسیم شد، نمی دانم حالا قرار است خودم را چه بنامم. \"مبارز\" احساس خوبی ندارد. \"جنگجو\" قطعا اینطور نیست و \"بازمانده\" پیچیده است. نویسنده گفت که از برچسب‌های جنگجو یا جنگجو که اغلب به افرادی که برای سرطان سینه درمان می‌شوند داده می‌شود، خوشش نمی‌آید. با حسن نیت از کیت لوث."}, {"source": "Business Insider", "title": "The US Army is growing its space forces. They're already in combat.", "link": "https://www.businessinsider.com/us-army-growing-its-own-force-of-space-warfare-soldiers-2026-10", "summary": "Soldiers with the Army s 1st Space Brigade unload equipment from a helicopter during training on Fort Carson, Colo. on Jan. 31, 2025. Brooke Nevins/US Army The US Army is expanding its ranks of soldiers specialized in space warfare. Army space personnel are already deployed to the Middle East, where the US has been fighting Iran. More than 600 enlisted soldiers joined the new specialty this year, with more growth planned. The US Army is expanding its ranks of soldiers trained for space warfare, a growing military specialty that is already supporting American combat operations in the Middle East. The service established a new enlisted space operations branch in June, creating a dedicated career field for soldiers whose work involves satellites, communications, and the ability to disrupt an adversary's use of space. While the Space Force and its Guardians oversee a broad range of military space operations in support of the entire US military, the Army has its own dedicated specialists focused on supporting its ground forces with satellite communications, navigation, and other capabilities. Some space soldiers are already deployed in the Middle East , where American forces have been fighting Iran. Lt. Gen. John Rafferty, the commander of US Army Space and Missile Defense Command, said at the Association of the United States Army conference in Washington, DC, this week that roughly 2,500 soldiers from his command are deployed to US Central Command's area of operations. That figure includes both air-defense formations and space specialists. \"Space is really embedded in every single echelon there,\" Rafferty said, speaking of the job's growing prevalence throughout all levels of military decision-making. Those space soldiers' responsibilities can range from helping ground forces access satellite communications and navigation systems to disrupting adversary space capabilities, known as \"space interdiction.\" Officials did not provide specific examples or further details on the work being done. For soldiers on the battlefield, such help is essential for communicating with nearby units and gathering intelligence on enemy movements. The growing importance of space as a domain of warfare, alongside land, sea, air, and cyberspace , prompted the Army to expand its specialized workforce. Command Sgt. Maj. Rickey Jackson said at AUSA that the service reviewed several thousand personnel files for its new enlisted space operations branch. The 600 soldiers ultimately selected", "date_str": "2026-10-17T11:07:01+00:00", "hash": "f3c7b92921bfc695", "title_fa": "ارتش آمریکا در حال افزایش نیروهای فضایی خود است. آنها در حال حاضر در مبارزه هستند.", "summary_fa": "سربازان با تیپ 1 فضایی ارتش در حین آموزش در فورت کارسون، کولو در 31 ژانویه 2025، تجهیزات را از هلیکوپتر تخلیه می کنند. بروک نوینز/ارتش ایالات متحده ارتش ایالات متحده در حال گسترش صفوف سربازان متخصص در جنگ فضایی است. پرسنل فضایی ارتش در حال حاضر در خاورمیانه، جایی که ایالات متحده در حال جنگ با ایران بوده است، مستقر شده اند. بیش از 600 سرباز ثبت نام شده امسال به این تخصص جدید پیوستند و رشد بیشتری برنامه ریزی شده است. ارتش ایالات متحده در حال گسترش صفوف سربازانی است که برای جنگ فضایی آموزش دیده اند، یک تخصص نظامی رو به رشد که در حال حاضر از عملیات رزمی آمریکا در خاورمیانه پشتیبانی می کند. این سرویس در ماه ژوئن یک شعبه جدید عملیات فضایی ایجاد کرد و یک زمینه شغلی اختصاصی برای سربازانی ایجاد کرد که کارشان شامل ماهواره‌ها، ارتباطات و توانایی مختل کردن استفاده دشمن از فضا است. در حالی که نیروی فضایی و نگهبانان آن بر طیف گسترده ای از عملیات فضایی نظامی در حمایت از کل ارتش ایالات متحده نظارت می کنند، ارتش متخصصان اختصاصی خود را دارد که بر پشتیبانی از نیروهای زمینی خود با ارتباطات ماهواره ای، ناوبری و سایر قابلیت ها متمرکز هستند. برخی از سربازان فضایی در حال حاضر در خاورمیانه، جایی که نیروهای آمریکایی در حال جنگ با ایران هستند، مستقر شده اند. سپهبد جان رافرتی، فرمانده فرماندهی فضایی و دفاع موشکی ارتش ایالات متحده، در کنفرانس انجمن ارتش ایالات متحده در واشنگتن دی سی، این هفته گفت که تقریباً 2500 سرباز از فرماندهی وی در منطقه عملیاتی فرماندهی مرکزی ایالات متحده مستقر شده اند. این رقم شامل تشکیلات پدافند هوایی و متخصصان فضایی می شود. رافرتی، با صحبت از رواج فزاینده این شغل در تمام سطوح تصمیم‌گیری نظامی، گفت: «فضا واقعاً در هر طبقه‌ای در آنجا جاسازی"}, {"source": "Business Insider", "title": "I'm a real estate agent building a $480,000 backyard home for my mom. I still made these costly mistakes.", "link": "https://www.businessinsider.com/real-estate-agent-building-backyard-adu-lessons-mistakes-2026-10", "summary": "Shalini Karnani Bonjour in her California backyard. Courtesy of Shalini Karnani Bonjour Shalini Bonjour is building a 1,100-square-foot ADU in her backyard so her mother can age in place. The project is taking longer than she expected and is going over budget. Bonjour shared the five biggest lessons she's learned during the process with Business Insider. After her father died in 2024, real estate agent Shalini Karnani Bonjour moved her mother from Michigan to California to be closer to her and her family. \"My husband and I didn't feel comfortable having her so far away, especially when it came to her day-to-day needs,\" Bonjour, 50, told Business Insider. Later that year, the family bought a home with a backyard large enough to build an accessory dwelling unit for her mother. In 2025, they broke ground on a 1,100-square-foot ADU. But what was expected to be a six-week project has dragged on for months and cost the family thousands more than expected. \"The whole process has been difficult because there are so many things to manage,\" Bonjour said. \"You're trying to keep the project affordable, keep your neighbors happy, and stay on track. I can only imagine how overwhelming this would feel for someone without any insight into the process, because it is a huge undertaking.\" Here are five hard lessons Bonjour has learned from the project, from choosing the right contractor to budgeting enough money for unexpected challenges. A bad contractor can make or break a project The ADU during the early stages of its construction. Courtesy of Shalini Karnani Bonjour At first, Bonjour thought she had found the right architect for the project. They designed the ADU and even promised to guide her through the permitting and construction process. But they didn't follow through. Bonjour said hiring the wrong person was one of the \"biggest mistakes\" she's made during the project. Although she found someone to take over the project after interviewing about 10 builders, mistakes made by the original architect have made construction more difficult. \"Watching my builder try to translate that original designer's plans is like trying to fit a square peg into a round hole,\" she said. \"It's basically like he was working off somebody else's recipe.\" Understanding local permitting and construction rules is essential Solar panels being installed on a rooftop. Hispanolistic/Getty Images Every city has its own rules for building ADUs , and some are more complicated than others. In her part ", "date_str": "2026-10-17T11:03:01+00:00", "hash": "58a73416d1c8157a", "title_fa": "من یک مشاور املاک هستم که یک خانه 480000 دلاری در حیاط خلوت برای مادرم می سازم. من هنوز این اشتباهات پرهزینه را مرتکب شدم.", "summary_fa": "Shalini Karnani Bonjour در حیاط خلوت خود در کالیفرنیا. با حسن نیت از Shalini Karnani Bonjour Shalini Bonjour در حال ساخت یک ADU به مساحت 1100 فوت مربع در حیاط خلوت خود است تا مادرش بتواند در جای خود پیر شود. این پروژه بیش از حد انتظار او طول می کشد و بیش از بودجه پیش می رود. Bonjour پنج درس بزرگی که در طول این فرآیند آموخته را با Business Insider به اشتراک گذاشت. پس از مرگ پدرش در سال 2024، یک مشاور املاک شالینی کارنانی بونجور، مادرش را از میشیگان به کالیفرنیا نقل مکان کرد تا به او و خانواده‌اش نزدیک‌تر باشد. بونجور 50 ساله به بیزینس اینسایدر گفت: «من و شوهرم از اینکه او را تا این حد دور می‌کردیم، احساس راحتی نمی‌کردیم، مخصوصاً وقتی نوبت به نیازهای روزمره او می‌رسید. بعداً در همان سال، خانواده خانه‌ای با حیاط خلوت به اندازه کافی بزرگ خریدند تا برای مادرش یک واحد مسکونی بسازند. در سال 2025، آنها در یک ADU 1100 فوت مربعی شکستند. اما آنچه انتظار می رفت یک پروژه شش هفته ای باشد، ماه ها به طول انجامید و هزاران هزینه بیشتر از حد انتظار برای خانواده تمام شد. Bonjour گفت: \"کل این فرآیند دشوار بوده است زیرا موارد زیادی برای مدیریت وجود دارد.\" \"شما سعی می کنید پروژه را مقرون به صرفه نگه دارید، همسایگان خود را راضی نگه دارید و در مسیر خود بمانید. من فقط می توانم تصور کنم که این کار برای کسی که هیچ بینشی نسبت به این فرآیند ندارد چقدر طاقت فرسا است، زیرا این یک تعهد بزرگ است.\" در اینجا پنج درس سخت است که Bonjour از این پروژه آموخته است، از انتخاب پیمانکار مناسب تا بودجه کافی برای چالش های غیرمنتظره. یک پیمانکار بد می تواند پروژه ADU را در مراحل اولیه ساخت آن بسازد یا شکست دهد."}, {"source": "Business Insider", "title": "The US Army needs to get rid of old explosives near its new artillery ammo plant. They're too dangerous to move, so it's blowing them up.", "link": "https://www.businessinsider.com/us-army-will-detonate-unstable-explosives-near-ammo-plant-2026-10", "summary": "The service broke ground on a 155mm artillery production line at the plant earlier this year. US Marine Corps photo by Lance Cpl. Emilio Murphy The US Army will detonate 68 barrels of unstable explosive material at an ammunition production plant. Officials determined the lead azide couldn't be relocated and are in contact with residents on environmental concerns. The facility is also home to the Army's new 155mm artillery production line, which began construction earlier this year. The US Army will detonate dozens of barrels of unstable explosives at its ammunition plant in Iowa after determining the material couldn't be safely moved, according to a public affairs official. The lead azide the service needs to get rid of has been stored at the site for almost 20 years and is no longer needed for ammunition production . The detonation will occur near the service's new 155mm artillery production line, construction of which began in July. The Army informed residents of nearby Middletown, Iowa, this week that it would detonate 68 barrels of lead azide sometime in November. Army Explosive Ordnance Disposal teams will execute the detonation. \"There are 68 barrels of lead azide in two earth-covered magazines, and that material was on site for potential production,\" Justine Barati, deputy director of public affairs for the US Sustainment Command, told Business Insider. \"When we realized that we would no longer need that material or use that material, then it becomes hazardous waste.\" A team of experts recommended a controlled explosion to destroy the lead azide, and that decision was elevated to former Army Secretary Dan Driscoll for approval. Barati said the 155mm facility is on the other side of the Iowa Army Ammunition Plant. The Army anticipates a four-hour delay to construction at the facility on the day of the detonation. The Army asked Middletown residents near the plant to temporarily leave their homes and is offering the Army Reserve Center as a place to stay during the detonation. About 55 homes are expected to be affected by the detonation decision, Barati said. Local residents can assess any property damage afterward and file claims with the Army. The Iowa newspaper The Hawk Eye first reported on the detonation and town hall with residents. Lead azide is a highly sensitive and toxic material used as a primary explosive component in some weapons that can pose environmental and health risks. Barati said that prior to and after the detonation, the Army wil", "date_str": "2026-10-17T11:00:01+00:00", "hash": "5da863e8d0e2e492", "title_fa": "ارتش ایالات متحده باید از شر مواد منفجره قدیمی در نزدیکی کارخانه مهمات توپخانه جدید خود خلاص شود. آنها برای حرکت بسیار خطرناک هستند، بنابراین آنها را منفجر می کند.", "summary_fa": "این سرویس در اوایل سال جاری در خط تولید توپخانه 155 میلی‌متری در این کارخانه آغاز شد. عکس سپاه تفنگداران دریایی ایالات متحده توسط Lance Cpl. امیلیو مورفی ارتش ایالات متحده 68 بشکه مواد منفجره ناپایدار را در یک کارخانه تولید مهمات منفجر خواهد کرد. مقامات تشخیص دادند که آزید سرب نمی تواند جابجا شود و به دلیل نگرانی های زیست محیطی با ساکنان در تماس هستند. این تأسیسات همچنین خانه خط تولید جدید توپخانه 155 میلی متری ارتش است که ساخت آن در اوایل سال جاری آغاز شد. به گفته یک مقام روابط عمومی، ارتش ایالات متحده ده ها بشکه مواد منفجره ناپایدار را در کارخانه مهمات خود در آیووا منفجر خواهد کرد، پس از اینکه مشخص شد مواد نمی توانند به طور ایمن جابجا شوند. آزید سرب که سرویس باید از شر آن خلاص شود، تقریباً 20 سال است که در سایت ذخیره شده است و دیگر برای تولید مهمات مورد نیاز نیست. این انفجار در نزدیکی خط تولید توپخانه جدید 155 میلی متری این سرویس که ساخت آن در ماه ژوئیه آغاز شد، رخ خواهد داد. ارتش این هفته به ساکنان نزدیک شهر میدلتاون، آیووا اطلاع داد که 68 بشکه از آزید سرب را در ماه نوامبر منفجر خواهد کرد. تیم های خنثی سازی مهمات انفجاری ارتش این انفجار را اجرا خواهند کرد. جاستین براتی، معاون مدیر امور عمومی فرماندهی پایداری ایالات متحده، به Business Insider گفت: «68 بشکه آزید سرب در دو مجله پوشیده از زمین وجود دارد و این مواد برای تولید احتمالی در محل موجود بود. وقتی متوجه شدیم که دیگر به آن مواد نیازی نداریم یا از آن مواد استفاده نمی کنیم، آن وقت تبدیل به زباله های خطرناک می شود.» تیمی از کارشناسان یک انفجار کنترل شده را برای از بین بردن آزید سرب توصیه کردند و این تصمیم برای تایید به"}, {"source": "Business Insider", "title": "My husband retired just as we became empty nesters. Now we're together nearly 24/7, and it's been a strange adjustment.", "link": "https://www.businessinsider.com/husband-retired-became-empty-nesters-strange-2026-10", "summary": "The author and her husband are spending a lot of time together after retiring and becoming empty nesters. Courtesy of Susan Teresa When my husband and I became empty nesters, he retired, too. We used to have busy, individual lives, but now we are always together. It took a lot of adjustment and honest conversations, but we're learning to navigate our new normal. My husband and I have been married for 26 years, together for 32. That's more than half my life. I thought we'd experienced just about every version of our life together. Then we became empty nesters . And then my husband retired. We're now together 24/7 with nowhere else we need to be, and I realized that all these years, I'd never spent this much time with him. Since the day he brought home his office belongings , I've caught myself thinking more than once, \" Oh, you're still here? Our home feels different now Without school schedules or workdays organizing our lives, we have more unstructured time than we know what to do with. We navigate quiet hallways lined with unoccupied bedrooms. We now split the responsibility for coddling our cat, who suffers from separation anxiety. We announce, \"We're back,\" to the furniture and the cat, forgetting we left the house otherwise empty. Our aching hearts inspired us to collaborate on a shared list of silver linings. We drafted wish lists, imagining what we could do now that we no longer had to accommodate five personalities with varying interests. While we shared many ideas and dream list to-dos — things like traveling to Tuscany for cooking and painting retreats — we hadn't anticipated that our day-to-day would also require attention and planning. The trouble with together-time all the time Throughout our marriage, my husband and I had always noted how similar his parents and mine were. Connected at the hip, one parent was seldom without the other. We, on the other hand, prided ourselves on allowing each other space. We'd spent decades insisting we weren't like them — valuing independence, traveling separately , and encouraging each other to pursue our interests. Then, when my husband retired, we instantly became our parents. With freedom to do whatever we wanted, we fell into the rhythm our parents had modeled: together all day, every day. Sometimes you really can have too much of a good thing. I'm an introverted writer who loves spending time in my rich inner world. He's an extroverted adventurer always on the go — kayaking, swimming, walking on the beac", "date_str": "2026-10-17T10:47:01+00:00", "hash": "79822c26ddb0910a", "title_fa": "درست زمانی که ما آشیانه های خالی شدیم، شوهرم بازنشسته شد. اکنون ما تقریباً 24 ساعته با هم هستیم و این یک تنظیم عجیب بود.", "summary_fa": "نویسنده و همسرش پس از بازنشستگی و تبدیل شدن به آشیانه های خالی، زمان زیادی را با هم می گذرانند. با حسن نیت سوزان ترزا وقتی من و شوهرم آشیانه های خالی شدیم، او هم بازنشسته شد. ما قبلاً زندگی پرمشغله و فردی داشتیم، اما اکنون همیشه با هم هستیم. تنظیم و گفتگوهای صادقانه زیادی لازم بود، اما ما در حال یادگیری هستیم که به حالت عادی جدید خود پیمایش کنیم. من و شوهرم 26 سال است که با هم ازدواج کرده ایم، 32 سال است. این بیش از نیمی از زندگی من است. فکر می‌کردم تقریباً تمام نسخه‌های زندگی مشترکمان را تجربه کرده‌ایم. بعد ما شدیم آشیانه های خالی . و بعد شوهرم بازنشسته شد. ما الان 24 ساعته با هم هستیم و هیچ جای دیگری که لازم نیست باشیم، و فهمیدم که در تمام این سال ها، هرگز اینقدر وقت را با او نگذرانده بودم. از روزی که او وسایل دفترش را به خانه آورد، بیش از یک بار به این فکر افتادم که \"اوه، تو هنوز اینجایی؟ اکنون خانه ما متفاوت است بدون برنامه های مدرسه یا روزهای کاری که زندگی ما را سازماندهی کند، ما بیشتر از آن چیزی که می دانیم باید با آن چه کار کنیم، زمان بدون ساختار داریم. ما در راهروهای ساکتی که در ردیف اتاق‌های خواب خالی قرار گرفته‌اند حرکت می‌کنیم. ما اکنون مسئولیت نوازش کردن گربه خود را که از اضطراب جدایی رنج می برد تقسیم کرده ایم. ما به اثاثیه و گربه اعلام می کنیم \"ما برگشتیم\" و فراموش می کنیم که خانه را خالی گذاشته ایم. قلب های دردمند ما الهام بخش ما شد تا در فهرست مشترکی از آسترهای نقره ای همکاری کنیم. ما فهرست آرزوها را تهیه کردیم و تصور می‌کردیم که اکنون که دیگر مجبور نیستیم پنج شخصیت با علایق متفاوت را در خود جای"}, {"source": "Business Insider", "title": "I'm a Walmart store manager at 23. I worked hard to get this life and started as a cashier — here's my career journey.", "link": "https://www.businessinsider.com/how-walmart-cashier-got-promoted-store-manager-career-journey-2026-10", "summary": "Kiley Pulley transitioned from cashier to store manager within seven years. Kiley Pulley Kiley Pulley became Walmart's youngest US store manager at 21, starting as a cashier at 16. Her former store manager helped her through her succession plan and interviews. Pulley emphasizes learning daily and adapting for career growth. This as-told-to essay is based on a conversation with Kiley Pulley, a 23-year-old Walmart store manager in Buckeye, Arizona. It has been edited for length and clarity. In 2019, when I was 16 years old, I started working at Walmart as a part-time cashier. I wanted my own money, and figured, why not just get a job? My sister and my mom were already working there, and it was also right down the street from my high school. It was easy for me to get out of school and walk to work. Over the next few years, I moved through different roles, from cashier to stocker to online fulfillment. Then, when I turned 18, I became an academy trainer, and six months later, a digital team lead. When I became a team lead in mid 2021, it hit me that I wanted to stay at Walmart full time and make it my actual career . At 19, I became an operations manager, and right before I turned 22, I became the youngest store manager at Walmart in the US. People ask me, \"How did you do it?\" My answer is to show up and learn something new every day. Here are six things I've learned along the way. I realized I could help people by hiring them Originally, I wanted to start either my own nonprofit or my own business and help out the homeless population; then I realized that I could do all that through Walmart. I could make a difference through the people that I hire and the impact that I have on my associates at the store. When I became a team lead, I was making good money, and I also really liked it. I started actively working toward becoming a store manager. I got on succession plans and was on monthly calls with our market manager. When I became an operations manager, I led multiple projects in our market to get myself ready to become a store manager. I'd also ask to cover for store managers when they'd take off work; that way I could gain additional experience that was needed to be promoted. I remember thinking, I'm going to be a store manager at 21. I'll be the youngest in the company. I had to learn that my words carried more weight As an associate, I was friends with everybody. I could joke around with everyone. When I became salaried, everything changed. One of the bigg", "date_str": "2026-10-17T10:19:01+00:00", "hash": "995b21dfed3bfdd6", "title_fa": "من یک مدیر فروشگاه Walmart در 23 سالگی هستم. برای به دست آوردن این زندگی سخت کار کردم و به عنوان یک صندوقدار شروع به کار کردم - این سفر شغلی من است.", "summary_fa": "کیلی پولی ظرف هفت سال از صندوقدار به مدیر فروشگاه تبدیل شد. کیلی پولی کیلی پولی در سن 21 سالگی جوان‌ترین مدیر فروشگاه والمارت در ایالات متحده شد و از 16 سالگی به عنوان صندوقدار شروع کرد. مدیر فروشگاه سابق او در طرح جانشینی و مصاحبه‌هایش به او کمک کرد. پولی بر یادگیری روزانه و سازگاری با رشد شغلی تاکید دارد. این مقاله گفته شده بر اساس گفتگو با کیلی پولی، مدیر فروشگاه والمارت 23 ساله در باکی، آریزونا است. برای طول و وضوح ویرایش شده است. در سال 2019، زمانی که 16 ساله بودم، به عنوان یک صندوقدار پاره وقت در والمارت شروع به کار کردم. من پول خودم را می خواستم، و فهمیدم که چرا فقط شغل پیدا نکنم؟ خواهرم و مامانم قبلاً در آنجا کار می‌کردند و همینطور درست پایین خیابان دبیرستانم بود. برای من آسان بود که از مدرسه خارج شوم و پیاده به سمت محل کارم بروم. در طول چند سال بعد، نقش‌های مختلفی را از صندوق‌دار گرفته تا سهامدار تا انجام آنلاین انجام دادم. سپس، وقتی 18 ساله شدم، مربی آکادمی شدم و شش ماه بعد، رهبری تیم دیجیتال را بر عهده گرفتم. وقتی در اواسط سال 2021 رهبر تیم شدم، متوجه شدم که می‌خواهم تمام وقت در والمارت بمانم و آن را به شغل واقعی خود تبدیل کنم. در 19 سالگی، مدیر عملیات شدم و درست قبل از 22 سالگی، جوانترین مدیر فروشگاه والمارت در ایالات متحده شدم. مردم از من می پرسند \"چطور این کار را کردی؟\" پاسخ من این است که هر روز حاضر شوم و چیز جدیدی یاد بگیرم. در اینجا شش چیزی است که در این راه یاد گرفتم. متوجه شدم که می‌توانم با استخدام آنها به مردم کمک کنم. در اصل، می‌خواستم یا غیرانتفاعی یا کسب‌وکار خودم را راه‌اندازی کنم و به جمعیت بی‌خانمان کمک کنم. سپس متوجه"}, {"source": "Business Insider", "title": "The Saudi Arabia airport attacks have made Middle East travel more unpredictable. Here's what to know.", "link": "https://www.businessinsider.com/saudi-arabia-travel-riyadh-airport-attacks-what-to-know-2026-10", "summary": "Riyadh s airport is closed until at least Saturday. Bernd von Jutrczenka/picture alliance via Getty Images Riyadh airport, one of the busiest in the Middle East, has been closed for a week after missile attacks. The US State Department has told Americans to reconsider travel to Saudi Arabia. Delta has also suspended the launch of a new route to Saudi. Here's what to do if you're affected. Travel to Saudi Arabia and the broader Middle East is looking increasingly unpredictable this fall after a series of Houthi attacks on airports, including in the capital, Riyadh. The latest attacks killed 13 people and wounded hundreds last Saturday. Another strike the following day killed one person and injured about a dozen more. Flights to and from Riyadh have been suspended all week, and while the airport is set to reopen on Sunday, this has yet to be confirmed. The Houthis , an Iran-backed Yemeni militant group, control territory around the Bab el-Mandeb Strait, a key shipping route linking the Red Sea and the Gulf of Aden. They have been attacking Saudi infrastructure amid an escalating regional conflict. Saudi Arabia has supported Yemen's internationally recognized government in the country's civil war, which began in 2014. Many airplanes continue to fly over eastern Saudi Arabia, including on routes to hubs in Qatar and Dubai and onward to East Asia. The US State Department told Americans to reconsider travel to Saudi Arabia because of the risk of missile and drone attacks, armed conflict, and terrorism. It also warned of \"potential flight cancellations, airspace closures, and travel disruptions.\" The UK's Foreign Office similarly says there is a heightened threat to airports and other infrastructure across Saudi Arabia, including Riyadh, Jeddah, and Abha. On Monday, Delta Air Lines postponed the launch of its new Atlanta-to-Riyadh route, which had been due to begin on October 23, until March 2027. \"Saudi Arabia remains an important market for Delta, and we are committed to serving the Kingdom for the long term,\" the airline said. It came after the Federal Aviation Administration warned US airlines on Sunday that the threats could pose risks during overflights, takeoffs, and landings in Saudi Arabia. Osprey Flight Solutions, an aviation-risk company, said that unannounced missile launches through civilian airspace can pose a \"latent hazard to flight operations at all altitudes,\" including from a malfunctioning missile, debris, and sudden route diversions. It also ", "date_str": "2026-10-17T09:59:01+00:00", "hash": "b19846776df87fd5", "title_fa": "حملات فرودگاهی عربستان سعودی سفرهای خاورمیانه را غیرقابل پیش بینی تر کرده است. در اینجا چیزی است که باید بدانید.", "summary_fa": "فرودگاه ریاض حداقل تا شنبه بسته است. Bernd von Jutrczenka/تصویر اتحاد از طریق Getty Images فرودگاه ریاض، یکی از شلوغ ترین فرودگاه های خاورمیانه، به مدت یک هفته پس از حملات موشکی بسته شده است. وزارت خارجه آمریکا به آمریکایی ها گفته است که در سفر به عربستان سعودی تجدید نظر کنند. دلتا همچنین راه اندازی یک مسیر جدید به عربستان را به حالت تعلیق درآورده است. در اینجا این است که اگر تحت تأثیر قرار گرفتید چه کاری انجام دهید. سفر به عربستان سعودی و خاورمیانه گسترده‌تر در پاییز امسال پس از یک سری حملات حوثی‌ها به فرودگاه‌ها، از جمله در ریاض، پایتخت، غیرقابل پیش‌بینی به نظر می‌رسد. آخرین حملات شنبه گذشته 13 کشته و صدها زخمی بر جای گذاشت. حمله دیگری در روز بعد یک نفر را کشت و حدود ده ها نفر دیگر را مجروح کرد. پروازها به ریاض و از ریاض در تمام هفته متوقف شده است و در حالی که فرودگاه قرار است روز یکشنبه بازگشایی شود، هنوز این موضوع تایید نشده است. حوثی‌ها، یک گروه شبه‌نظامی یمنی مورد حمایت ایران، کنترل قلمروی اطراف تنگه باب المندب را در دست دارند، مسیری کلیدی کشتیرانی که دریای سرخ و خلیج عدن را به هم متصل می‌کند. آنها در بحبوحه تشدید درگیری های منطقه ای به زیرساخت های عربستان سعودی حمله کرده اند. عربستان سعودی از دولت به رسمیت شناخته شده بین المللی یمن در جنگ داخلی این کشور که از سال 2014 آغاز شد، حمایت کرده است. بسیاری از هواپیماها همچنان بر فراز شرق عربستان سعودی پرواز می کنند، از جمله در مسیرهایی که به قطب ها در قطر و دبی و به سمت شرق آسیا می روند. وزارت امور خارجه آمریکا به آمریکایی ها گفت که به دلیل خطر حملات موشکی و پهپادی، درگیری مسلحانه و تروریسم، در سفر به عربستان سعودی تجدید نظر کنند."}, {"source": "Business Insider", "title": "Walmart sees current diesel prices wiping out $2.9 billion tariff refund by end of 2027, Deutsche Bank says.", "link": "https://www.businessinsider.com/walmart-says-higher-fuel-costs-will-offset-tariff-refund-benefit-2026-10", "summary": "Walmart is expecting up to an additional percentage point of inflation due to fuel costs in 2027, according to Deutsche Bank. David Paul Morris/Bloomberg via Getty Images Walmart is bracing for billions of dollars in additional fuel costs due to higher diesel prices. The company previously said it would put much of its $2.9 billion tariff refund toward lower prices. Now, higher fuel costs are likely to erase that benefit, and other retailers are likely to follow. Just when US shoppers might have thought they dodged the tariff jab, energy costs are coming in with the right hook. Deutsche Bank says Walmart executives are now expecting the added cost of higher diesel prices to wipe out their total expected benefit from tariff refunds and push prices back up, according to a Thursday analyst note following a meeting with Walmart CFO John David Rainey. \"Elevated diesel is pressuring WMT directly through transportation costs and indirectly as suppliers pass through higher costs, including on petroleum-linked products,\" the analysts wrote. \"Elevated diesel costs are beginning to flow through to consumer prices\" The company is now expecting an additional half to one percentage point of inflation in 2027, the note said. At that rate, additional fuel costs this year and next year will completely erase Walmart's $2.9 billion tariff refund. Walmart said in August that it had been putting the bulk of that tariff refund money toward lower prices for shoppers . \"Like other retailers, we are not immune to sustained increases in fuel and transportation costs, but we work to minimize their impact,\" a spokesperson told Business Insider. The spokesperson also said that many of Walmart's current discounts and holiday deals are time-bound, after which some prices may return to regular levels. \"That should not be characterized as a broad-based price increase,\" the spokesperson said. Beyond Walmart, which runs one of the most efficient supply chains in all of retail, the energy impact could be even more pronounced. The Deutsche Bank analysts noted that competing retailers are also hiking prices in similar categories, leaving Walmart with the relative low-price advantage. The bank also upgraded its rating of Walmart's stock. Read the original article on Business Insider", "date_str": "2026-10-17T09:53:01+00:00", "hash": "f65c35903bc400c1", "title_fa": "دویچه بانک می‌گوید والمارت پیش‌بینی می‌کند که قیمت‌های فعلی دیزل تا پایان سال 2027 2.9 میلیارد دلار بازپرداخت تعرفه را از بین می‌برد.", "summary_fa": "به گفته دویچه بانک والمارت به دلیل هزینه های سوخت در سال 2027 یک درصد تورم اضافی را انتظار دارد. دیوید پل موریس/ بلومبرگ از طریق Getty Images والمارت آماده است تا میلیاردها دلار هزینه سوخت اضافی به دلیل قیمت های بالاتر دیزل دریافت کند. این شرکت قبلاً گفته بود که بخش عمده ای از بازپرداخت تعرفه 2.9 میلیارد دلاری خود را صرف قیمت های پایین تر خواهد کرد. اکنون، هزینه‌های سوخت بالاتر احتمالاً این مزیت را از بین می‌برد و سایر خرده‌فروشان نیز احتمالاً از آن پیروی می‌کنند. درست زمانی که خریداران ایالات متحده ممکن است فکر کنند که از تعرفه های گمرکی طفره رفته اند، هزینه های انرژی با قلاب مناسب وارد می شود. دویچه بانک می‌گوید مدیران والمارت اکنون انتظار دارند هزینه‌های اضافی قیمت‌های گازوئیل افزایش یابد تا کل سود مورد انتظار آنها از بازپرداخت تعرفه‌ها را از بین ببرد و قیمت‌ها را دوباره بالا ببرد. تحلیلگران نوشتند: «دیزل بالا به طور مستقیم از طریق هزینه های حمل و نقل و به طور غیرمستقیم به دلیل عبور تامین کنندگان از هزینه های بالاتر، از جمله محصولات مرتبط با نفت، WMT را تحت فشار قرار می دهد. در یادداشت آمده است: «هزینه‌های افزایش یافته دیزل شروع به سرازیر شدن به قیمت‌های مصرف‌کننده می‌کند.» این شرکت در حال حاضر انتظار دارد نیم تا یک درصد تورم در سال 2027 افزایش یابد. با این نرخ، هزینه های سوخت اضافی در سال جاری و سال آینده به طور کامل بازپرداخت تعرفه 2.9 میلیارد دلاری والمارت را پاک می کند. والمارت در ماه اوت گفت که بخش عمده ای از پول بازپرداخت تعرفه را صرف قیمت های پایین تر برای خریداران کرده است. یک سخنگوی به Business Insider گفت: «مانند سایر خرده‌فروش‌ها، ما از افزایش مداوم هزینه‌های سوخت و حمل‌ونقل مصون نیستیم، اما تلاش می‌کنیم تأثیر آن‌ها را به حداقل برسانیم». این"}, {"source": "Business Insider", "title": "The stock market's record-high margin debt is keeping Wall Street pros up at night", "link": "https://www.businessinsider.com/stock-market-correction-margin-debt-record-high-2026-10", "summary": "Margin debt is at record-highs. Some strategists are worried it increases the risk of a sudden drop in stocks. Orjan F. Ellingvag/Corbis via Getty Images Record-high margin debt is fuelling fears of forced selling in stocks. Margin calls could hit more investors if tech stocks take a hit. The scenario could trigger a risk-off move that tanks the broader market. It may not be long before the whole US stock market has a Situational Awareness moment. At least, that's the worst-case scenario being mulled by some analysts on Wall Street, who have increasingly turned their attention to one eye-popping statistic in the market: Margin debt held by investors has swelled to records and grown at a pace recently that's only been seen leading up to major corrections. The fear is that a steep tech sell-off could be the spark that causes the record amount of borrowed cash to combust, triggering margin calls and resulting in a wave of forced selling that derails the bull market. It may sound like an unlikely scenario, but it's a growing risk investors need to contend with, especially considering how concentrated the market is in tech and how exposed US households are to a sudden drop in equity prices, investing pros told Business Insider. Investors who trade on margin can buy stocks or purchase investment products by borrowing funds from a broker. But if the value of their positions falls below a certain threshold, investors get hit with a margin call , demanding they deposit more money into their margin accounts . If they can't, brokers can sell their positions, sometimes at a loss to the investor. It's what caused South Korea's stock market to tank this summer. Retail investors in the nation were highly levered and hit with a wave of margin calls when chip and memory stocks began to drop this summer, triggering a spiral of forced selling. The same dynamic also led to the implosion of Situational Awareness , the highly levered hedge fund run by AI wizkid Leopold Aschenbrenner that bet heavily on chip stocks before being hit with margin calls this summer. Debit balances in customers' securities margin accounts hit a record $1.5 trillion in June, according to FINRA data. Levels have fallen slightly since the summer, but remain elevated. Margin debt clocked in at $1.4 trillion in August, up around 27% over the last year. Margin debt falling from elevated levels has historically been a warning sign for markets, Peter Berezin, the chief economist at BCA Research, told Busines", "date_str": "2026-10-17T09:30:01+00:00", "hash": "4ef0f6a3e64195b7", "title_fa": "بدهی حاشیه سود رکورددار بازار سهام، طرفداران وال استریت را در شب بیدار نگه می دارد", "summary_fa": "مارجین بدهی به رکورد بالایی رسیده است. برخی از استراتژیست ها نگران هستند که خطر افت ناگهانی سهام را افزایش دهد. Orjan F. Ellingvag/Corbis از طریق Getty Images بدهی حاشیه سود رکورددار ترس از فروش اجباری سهام را تشدید می کند. اگر سهام فناوری ضربه بخورد، تماس‌های مارجین می‌تواند به سرمایه‌گذاران بیشتری ضربه بزند. این سناریو می‌تواند یک حرکت ریسک‌آمیز را آغاز کند که بازار گسترده‌تر را تحت تأثیر قرار دهد. ممکن است مدت زیادی طول نکشید که کل بازار سهام ایالات متحده یک لحظه آگاهی از موقعیت را داشته باشد. حداقل، این بدترین سناریویی است که توسط برخی از تحلیلگران در وال استریت در نظر گرفته شده است، و آنها به طور فزاینده ای توجه خود را به یک آمار چشمگیر در بازار معطوف کرده اند: حاشیه بدهی سرمایه گذاران به رکوردها افزایش یافته و اخیراً با سرعتی رشد کرده است که فقط به اصلاحات عمده منجر شده است. ترس این است که فروش شدید فناوری می‌تواند جرقه‌ای باشد که باعث می‌شود مقدار بی‌سابقه نقدینگی قرض‌گرفته شده سوزانده شود، و منجر به فراخوان‌های حاشیه و در نتیجه موجی از فروش اجباری شود که بازار صعودی را از مسیر خارج کند. کارشناسان سرمایه‌گذاری به Business Insider گفتند که ممکن است سناریویی بعید به نظر برسد، اما ریسک فزاینده‌ای است که سرمایه‌گذاران باید با آن مقابله کنند، به‌ویژه با توجه به اینکه بازار چقدر در فناوری متمرکز است و خانواده‌های آمریکایی چقدر در معرض کاهش ناگهانی قیمت سهام هستند. سرمایه گذارانی که با حاشیه معامله می کنند می توانند سهام بخرند یا محصولات سرمایه گذاری را با استقراض وجوه از یک کارگزار خریداری کنند. اما اگر ارزش پوزیشن‌های آن‌ها کمتر از یک آستانه مشخص شود، سرمایه‌گذاران با یک مارجین تماس مواجه می‌شوند و از آنها می‌خواهند که پول بیشتری به حساب‌های مارجین خود واریز کنند. اگر نتوانند، کارگزاران می‌توانند موقعیت‌های خود"}, {"source": "Business Insider", "title": "Google Labs’ ‘secret society’ way of thanking its most valuable employees", "link": "https://www.businessinsider.com/google-labs-secret-society-way-of-thanking-valuable-employees-2026-10", "summary": "Josh Woodward is the vice president of Google Labs, the Gemini app, and AI Studio. Benjamin Fanjoy/Getty Images Google Labs leaders use ominous meeting invites to surprise and thank top staff. It's a \"secret society\" ritual for the most valuable employees, Google Labs chief Josh Woodward said. Woodward called the meetings \"pretty fun\" during an appearance on \"Lenny's Podcast.\" An unexpected meeting invite with the boss is often the kind of thing that sends employees spiraling. For Google Labs staffers, though, it could mean top brass are about to tell you how great you are. Speaking on a recent episode of \"Lenny's Podcast,\" Josh Woodward , the vice president of Google Labs, the Gemini app, and AI Studio, described the surprise appreciation meetings as a kind of \"secret society\" ritual for the team's most valuable employees. \"We'll basically like put an invite on someone's calendar, and we'll just, you know, it looks kind of scary because there's like four or five leaders on the team,\" Woodward told podcast host Lenny Rachitsky, adding that there's no agenda given. \"And then they show up, and we take turns. We go around the circle, and we just tell them why we appreciate them so much for being on the team,\" Woodward said. Woodward called the sessions \"pretty fun\" and said employees are regularly surprised to learn what the meetings are about. \"I always start the meeting with like, 'This is not a bad meeting. This is a good meeting,'\" he said. \"Your mind may assume the worst, but we're actually doing the opposite. These are some of the most valuable people.\" The surprise recognition meetings are one of the ways Google Labs celebrates the often unflashy work behind its AI products , according to Woodward. He said the team also has a tradition of handing out quirky awards to employees. There's the \"TPU harvester\" award, which consists of a \"little miniature rake\" from Etsy as well as a cash reward, for staffers who optimize Google's AI chips, known as Tensor Processing Units , Woodward said. \"A few of us wanted to figure out a way to reward people who do the grungy work of efficiency and reclaiming TPUs, harvesting TPUs, so we can build the next features and fuel our growth,\" he said, adding, \"we kind of turned it into this big celebration.\" Employees who fix small product flaws or \"paper cuts\" receive a golden Band-Aid, Woodward said. And those who find surprising ways to push AI models toward new capabilities can become an \"LLM whisperer,\" earning them a gia", "date_str": "2026-10-17T09:21:01+00:00", "hash": "abd871548641a82c", "title_fa": "روش «جامعه مخفی» Google Labs برای تشکر از ارزشمندترین کارمندانش", "summary_fa": "جاش وودوارد معاون آزمایشگاه گوگل، اپلیکیشن جمینی و استودیو هوش مصنوعی است. بنجامین فانجوی/گتی ایماژ رهبران آزمایشگاه های گوگل از دعوت نامه های شوم برای غافلگیری و تشکر از کارکنان برتر استفاده می کنند. جاش وودوارد، رئیس آزمایشگاه‌های گوگل، گفت که این یک مراسم \"جامعه مخفی\" برای با ارزش ترین کارمندان است. وودوارد در طول حضور در \"پادکست لنی\" این جلسات را \"بسیار سرگرم کننده\" نامید. دعوت به جلسه غیرمنتظره با رئیس اغلب از آن دسته مواردی است که کارمندان را مارپیچ می کند. با این حال، برای کارکنان Google Labs، این می تواند به این معنی باشد که برنج برتر به شما می گوید چقدر عالی هستید. جاش وودوارد، معاون آزمایشگاه های گوگل، اپلیکیشن جمینی و استودیوی هوش مصنوعی در یکی از قسمت های اخیر «پادکست لنی» صحبت می کرد، جلسات قدردانی غافلگیرکننده را نوعی تشریفات «جامعه مخفی» برای ارزشمندترین کارمندان تیم توصیف کرد. وودوارد به مجری پادکست لنی راچیتسکی گفت: «ما اساساً دوست داریم یک دعوتنامه را در تقویم کسی بگذاریم، و می‌دانید، به نظر ترسناک است زیرا چهار یا پنج رهبر در تیم وجود دارد. وودوارد گفت: \"و سپس آنها ظاهر می شوند، و ما به نوبت. ما دور دایره می چرخیم و فقط به آنها می گوییم که چرا از آنها برای حضور در تیم قدردانی می کنیم.\" وودوارد این جلسات را \"بسیار سرگرم کننده\" خواند و گفت که کارمندان مرتباً از دانستن این جلسات شگفت زده می شوند. او گفت: \"من همیشه جلسه را با این جمله شروع می کنم، \"این جلسه بدی نیست. این جلسه خوبی است.\" \"ممکن است ذهن شما بدترین را تصور کند، اما ما در واقع برعکس عمل می کنیم. اینها برخی از ارزشمندترین افراد هستند.\" به گفته وودوارد، جلسات تشخیص غافلگیرکننده یکی از راه‌هایی است که آزمایشگاه‌های Google از کار اغلب بی‌نظیر پشت محصولات هوش مصنوعی خود تجلیل می‌کنند. او"}, {"source": "Business Insider", "title": "This CEO is on his 4th chief of staff in 5 years — by choice", "link": "https://www.businessinsider.com/covista-ceo-rotates-chief-of-staff-2026-10", "summary": "Covista CEO Steve Beard recently hired his fourth chief of staff. Eric Ogden Covista CEO Steve Beard treats the chief of staff role as a rotating post, not a permanent job. He said the first one he hired told him he talked too much in meetings — feedback he welcomed. The downside, Beard said, is having to replace someone performing at the peak of their abilities. Most chiefs of staff don't stick around for very long. Covista CEO Steve Beard sees that as a feature, not a bug. Since taking the helm at the healthcare education giant five years ago, Beard has appointed four chiefs of staff, with a few months of overlap between hires to preserve continuity. He treats the role as a leadership rotation rather than a permanent job, bringing in people with backgrounds that match his evolving needs. His first chief of staff specialized in finance, the second in strategy, the third in technology, and the fourth, who started recently, in management consulting. \"Each of my chiefs of staff has looked different because I've been in a different place in my own journey at the time that they've come on board,\" Beard told Business Insider. \"It really is defined by the leader and the moment.\" The median tenure for chiefs of staff is 2.3 years, a length that reflects both the job's intensity and its potential as a springboard to more senior positions, according to a 2024 report from McKinsey. That is also roughly the amount of time Beard said he considers appropriate for the job — and long enough for those in it to advance their careers afterward. His first chief of staff moved into a CFO role at one of Covista's universities , and the second became a vice president overseeing the company's business-to-business operations and clinical partnerships. The third is preparing to become a vice president of enterprise pricing. \"It takes about one year to really get in a groove,\" said Beard. \"By the time you're approaching three years, that's a pretty grueling pace.\" The demands of the job help explain why. Beard oversees five educational institutions that train students for careers in healthcare. Most weekdays, he said he's at his desk around 7 a.m. and leaves after 6 p.m. His chief of staff works closely with him throughout, starting with a 15-minute meeting to review priorities and prepare for what's ahead. They stay in close contact when apart and occasionally travel together. Beard said a key part of the job for his chiefs of staff is to give him honest feedback about how he inte", "date_str": "2026-10-17T09:16:01+00:00", "hash": "f75ee224d1c625a9", "title_fa": "این مدیر عامل در 5 سال گذشته چهارمین رئیس دفتر خود - با انتخاب است", "summary_fa": "استیو برد، مدیرعامل کوویستا، اخیراً چهارمین رئیس ستاد خود را استخدام کرده است. استیو برد، مدیر عامل اریک اوگدن کوویستا، نقش رئیس ستاد را به عنوان یک پست چرخشی، نه یک شغل دائمی، می داند. او گفت که اولین نفری که استخدام کرد به او گفت که در جلسات بیش از حد صحبت کرده است - از بازخوردهایی که او استقبال کرد. به گفته بیرد، نکته منفی این است که باید فردی را جایگزین کرد که در اوج توانایی های خود عمل می کند. بیشتر روسای ستاد برای مدت طولانی در کنار هم نمی مانند. مدیر عامل Covista، Steve Beard، آن را به عنوان یک ویژگی، نه یک اشکال، می داند. بیرد از زمانی که پنج سال پیش هدایت غول آموزش مراقبت های بهداشتی را بر عهده گرفت، چهار رئیس ستاد را با چند ماه همپوشانی بین استخدام ها برای حفظ تداوم منصوب کرد. او با این نقش به‌عنوان یک چرخش رهبری رفتار می‌کند تا یک شغل دائمی، و افرادی را با پیشینه‌هایی که با نیازهای در حال تکامل او مطابقت دارند، وارد می‌کند. اولین رئیس ستاد او در امور مالی، دومی در استراتژی، سومی در فناوری و چهارمی که اخیراً شروع به کار در مشاوره مدیریت کرده است. بیرد به بیزینس اینسایدر گفت: \"هر یک از روسای ستاد من متفاوت به نظر می رسیدند، زیرا من در زمان سفر خود در مکان متفاوتی بوده ام.\" \"این واقعاً توسط رهبر و لحظه تعریف می شود.\" بر اساس گزارشی از مک کینزی در سال 2024، میانگین دوره تصدی روسای ستاد 2.3 سال است، مدتی که هم شدت شغل و هم پتانسیل آن را به عنوان سکوی پرشی برای سمت‌های بالاتر نشان می‌دهد. این نیز تقریباً مقدار زمانی است که بیرد گفته است برای این شغل مناسب می‌داند - و به اندازه‌ای طولانی است که کسانی که در آن هستند تا بعد"}, {"source": "Business Insider", "title": "I went to see why Silicon Valley can't stop laughing at Elizabeth Holmes", "link": "https://www.businessinsider.com/elizabeth-holmes-doc-screenings-startups-irony-2026-10", "summary": "Extend booked out a theater at AMC Lincoln Square. Henry Chandonnet/Business Insider Tech companies and venture capital firms are hosting private screenings of the Elizabeth Holmes doc. I went to one hosted by the AI startup Extend. Attendees I talked to said they looked at Holmes more as a joke than a product of their industry. Elizabeth Holmes is a black mark on Silicon Valley's reputation. And yet its residents are lining up for the documentary about her. Tech companies across the US are hosting screenings of \" You Can See Everything ,\" the documentary from Nathan Fielder and Lance Oppenheim about Holmes and her fiancé, Billy Evans. Venture capital funds are bringing their founders to the movie. There are Luma events upon Luma events . The irony, of course, is that Holmes makes tech look bad. She sold big dreams with her medical testing company, Theranos, which eventually came crashing down. Holmes was convicted of defrauding investors of hundreds of millions of dollars. (She has long said that she is innocent.) Holmes is the exemplar of Silicon Valley's hucksterism. She's who much of America points to when they call founders liars or scammers. So, what's with all the tech love? I went to a Thursday screening of the documentary hosted by Extend, an AI documentation startup, to find out. Inside the Extend screening A swarm of techies crowded outside theater nine at New York's AMC Lincoln Square . The screening was set to start at 7. By 6:40, a crowd had formed to talk shop and admire Extend's custom stickers. Outside the theater door, I met Bo Lau, the event's organizer who works in developer relations for Extend. Lau recently moved to New York and said she didn't want to watch the documentary alone. So, she posted about it on X — and it helped that she already had a following on so-called \"Tech Twitter.\" \"I was like, 'What if I just turn this into a work event so I can expense it?'\" Lau said. The event got 1,400 RSVPs for about 120 seats, she said, and she's flying to San Francisco soon to host another screening. The tickets were given out free, so Extend got no benefit other than brand awareness, she said. Extend gave out free stickers before we entered the theater. Henry Chandonnet/Business Insider Why was it so popular? Lau said that Holmes was a source of fascination within Silicon Valley, and that Fielder's \"awkward humor\" matched the awkwardness of tech . Filing into the theater, I heard my seatmates chat about AI and which tech companies let you ", "date_str": "2026-10-17T09:13:01+00:00", "hash": "695ae87e3a2ca01c", "title_fa": "رفتم ببینم چرا سیلیکون ولی نمی تواند جلوی خنده الیزابت هلمز را بگیرد", "summary_fa": "تمدید یک تئاتر در میدان AMC لینکلن رزرو کرد. هنری چاندونت/ شرکت‌های فناوری کسب و کار و شرکت‌های سرمایه‌گذاری خطرپذیر میزبان نمایش‌های خصوصی سند الیزابت هلمز هستند. من به یکی از استارتاپ های هوش مصنوعی Extend رفتم. شرکت کنندگانی که با آنها صحبت کردم گفتند که به هولمز بیشتر به عنوان یک شوخی نگاه می کردند تا محصول صنعت خود. الیزابت هلمز نقطه سیاهی بر شهرت سیلیکون ولی است. و با این حال ساکنان آن برای فیلم مستند درباره او صف می کشند. شرکت‌های فناوری در سراسر ایالات متحده میزبان نمایش‌های مستند «شما می‌توانید همه چیز را ببینید» از ناتان فیلدر و لنس اوپنهایم درباره هولمز و نامزدش، بیلی ایوانز هستند. صندوق‌های سرمایه‌گذاری خطرپذیر، بنیان‌گذاران خود را به فیلم می‌آورند. رویدادهای Luma روی رویدادهای Luma وجود دارد. البته طنز ماجرا این است که هولمز باعث بد جلوه دادن تکنولوژی می شود. او رویاهای بزرگی را با شرکت آزمایش پزشکی خود، Theranos فروخت که در نهایت از بین رفت. هولمز به دلیل کلاهبرداری از سرمایه گذاران صدها میلیون دلاری محکوم شد. (او مدتهاست گفته است که بی گناه است.) هولمز نمونه هکستریسم سیلیکون ولی است. او همان کسی است که اکثر مردم آمریکا وقتی بنیانگذاران را دروغگو یا کلاهبردار می‌خوانند به آن اشاره می‌کنند. بنابراین، این همه عشق به فناوری چیست؟ پنج شنبه به نمایش مستندی که توسط Extend، یک استارت آپ مستندسازی هوش مصنوعی برگزار شد، رفتم تا متوجه شوم. در داخل اکران Extend گروهی از فن‌آوران در خارج از سالن 9 در میدان AMC لینکلن نیویورک ازدحام کردند. نمایش قرار بود ساعت 7 شروع شود. در ساعت 6:40، جمعیتی برای خرید و تحسین استیکرهای سفارشی Extend تشکیل شده بود. بیرون درب تئاتر، با بو لاو، برگزارکننده رویداد که در روابط توسعه دهندگان برای Extend کار می کند، ملاقات کردم. لاو اخیرا به نیویورک نقل مکان کرد و گفت که"}, {"source": "Business Insider", "title": "I lost my job right before having my first child. My wife and I took the opportunity to level up our side hustle.", "link": "https://www.businessinsider.com/side-hustle-rental-wedding-camcorder-business-sudden-job-loss-2026-10", "summary": "Rachel Calaj and Felipe Rochi run a camcorder rental business for weddings. Felipe Rochi Felipe Rochi lost one of his jobs while his wife was pregnant with their first child. They decided to take the leap and grow their side hustle — a rental camcorder business — together. As new parents, the two of them split the tasks involved in running the business. This as-told-to essay is based on a conversation with Rachel Calaj and Felipe Rochi, a married couple in their 30s. Together, they run a wedding camcorder rental business that they started as a side hustle. The following has been edited for length and clarity. Rochi: I'm an SEO supervisor. I also had a second job in the SEO space, but I was terminated this summer, in early June. Calaj: I've been a school psychologist, typically hired through an agency to work for a district on a contract basis. We found out we were pregnant last December, and my contract ended in May. We were trying to think throughout that time what we would do next year. Felipe lost his job before our baby shower Calaj: As a first-time mom , I wanted to stay home with my child. We were trying to see if Felipe's two jobs would be enough for me to do so. Then, he got terminated the day before our baby shower. It was a very sad moment for us, but we still had a great time at the baby shower, even if it wasn't the best timing. Rochi: Unexpectedly losing my job and her contract ending around that time impacted our income significantly. Calaj: It changed everything for us; it was a turning point. We were in the middle of buying baby clothes and all the things that you need. Rochi: I applied for a decent number of jobs . You never hear back from jobs fast enough. You're just waiting to see if you got it. My dad owns a cleaning business, so we considered asking him for work in the meantime. With a kid on the way, we were thinking about anything I could do. Calaj: I reached out to the district that I worked for the previous year to see if I could do some flexible, part-time contract work. We were trying anything we could to have extra income at that point. We turned an idea into a new income stream Rochi: In April, I saw videos of somebody renting camcorders to people to record their weddings, and then editing the footage for them. I immediately thought it was a really cool idea. My brain started to spin. Before even telling Rachel, I created a website and a TikTok account for our business, Pass the Cam, and posted a few videos just to see if it c", "date_str": "2026-10-17T09:10:01+00:00", "hash": "b6f06122acf46c84", "title_fa": "درست قبل از به دنیا آوردن اولین فرزندم شغلم را از دست دادم. من و همسرم از این فرصت استفاده کردیم تا در کنار هم سطح خود را بالا ببریم.", "summary_fa": "راشل کالاج و فیلیپه روچی یک کسب و کار اجاره دوربین فیلمبرداری برای عروسی دارند. فیلیپه روچی فیلیپه روچی در حالی که همسرش اولین فرزندشان را باردار بود یکی از مشاغل خود را از دست داد. آن‌ها تصمیم گرفتند جهش کنند و با هم به فعالیت‌های جانبی خود - یک تجارت فیلم‌برداری اجاره‌ای - بپردازند. به عنوان والدین جدید، دو نفر وظایف مربوط به اداره تجارت را تقسیم کردند. این مقاله گفته شده بر اساس گفتگو با راشل کالاژ و فیلیپه روچی، زوجی در 30 سالگی است. آنها با هم یک کسب و کار اجاره دوربین فیلمبرداری عروسی را اداره می کنند که به عنوان یک کار جانبی شروع کردند. موارد زیر برای طول و وضوح ویرایش شده است. روچی: من یک سرپرست SEO هستم. من شغل دومی هم در زمینه سئو داشتم، اما تابستان امسال، اوایل خرداد ماه، کارم را خاتمه دادند. کلاج: من یک روانشناس مدرسه بوده ام، معمولاً از طریق یک آژانس استخدام می شوم تا در یک منطقه به صورت قراردادی کار کنم. ما دسامبر گذشته متوجه شدیم که باردار هستیم و قرارداد من در اردیبهشت ماه به پایان رسید. در تمام این مدت سعی می‌کردیم فکر کنیم که سال آینده چه خواهیم کرد. فیلیپه قبل از حمام نوزادمان کار خود را از دست داد Calaj: به عنوان یک مادر برای اولین بار، می خواستم با فرزندم در خانه بمانم. ما در تلاش بودیم ببینیم آیا دو شغل فیلیپه برای من کافی است یا نه. سپس، او یک روز قبل از حمام نوزاد ما خاتمه یافت. لحظه بسیار غم انگیزی برای ما بود، اما ما هنوز در حمام نوزاد لحظات خوبی را سپری کردیم، حتی اگر بهترین زمان نبود. روچی: از دست دادن غیرمنتظره شغلم و پایان یافتن قرارداد او در همان زمان، تأثیر قابل توجهی بر درآمد ما داشت. کلاج: همه چیز را برای ما"}, {"source": "Business Insider", "title": "Here's how Tesla's new Roadster is a completely different car from the 2017 version", "link": "https://www.businessinsider.com/tesla-roadster-changed-elon-musk-2026-10", "summary": "Tesla s second-generation Roadster got its second launch event on Thursday. Here s how the latest update is different from the last. Tesla Tesla has unveiled the next-gen Roadster twice: in 2017 and again on Thursday. We list the differences between the two versions. Range: down. Price: unknown. Flying: way up! Tesla just unveiled the revived Roadster . Sound familiar? It certainly should. On Thursday, CEO Elon Musk took the covers off the latest version of Tesla's halo sports car and said the EV maker is eyeing production in 2028. It's the second time the company has unveiled a prototype vehicle that it says will carry on the Roadster nameplate. In 2017, Musk unveiled a smoother-looking and very different type of Roadster. The 2017 Tesla Roadster prototype. Tesla The 2017 version simply drove onto a stage next to Elon, then spun its tires and raced away. The 2028 version — on a track placed a safe distance away from spectators — drove up a vertical wall, hung upside down, hovered in the air, and did a \"kick flip\" over a line of other Teslas. Turns out, a lot can change in nine extra years of product development. A lot of the nuts and bolts powering the Roadster changed — and so did the car's metrics. So, we put together a chart comparing Tesla's old Roadster promises with the new ones. Here's what we found: Metric or feature 2017 Roadster 2028 Roadster Range 620 miles 310 to 320 miles 0-to-60 speed 1.9 seconds 0.8 seconds Top speed Above 250 MPH 214 MPH \"for now\" Drivetrain Three motors, all-wheel drive Two motors, rear-wheel drive only Battery size 200 kWh Not specified Charging Not specified 15% to 85% in 10 minutes, nearly 500 kW Seating Two front seats, two rear seats Two front seats; Rocket trim only has one Variants Founder Series, SpaceX trim option Performance, Thrust, and Rocket Flying/Hopping Not demonstrated Demonstrated autonomously Price $250,000 for the Founder Series Not specified Read the original article on Business Insider", "date_str": "2026-10-17T09:09:01+00:00", "hash": "368ea65046a23861", "title_fa": "در اینجا توضیح می دهیم که چگونه رودستر جدید تسلا یک ماشین کاملاً متفاوت از نسخه 2017 است", "summary_fa": "نسل دوم رودستر تسلا دومین رویداد پرتاب خود را در روز پنجشنبه برگزار کرد. در اینجا نشان می دهد که چگونه آخرین به روز رسانی متفاوت از گذشته است. تسلا تسلا دو بار از نسل بعدی رودستر رونمایی کرده است: در سال 2017 و بار دیگر در روز پنجشنبه. ما تفاوت های بین این دو نسخه را لیست می کنیم. محدوده: پایین. قیمت: نامعلوم پرواز: خیلی بالا! تسلا به تازگی از رودستر احیا شده رونمایی کرد. آشنا به نظر می رسد؟ قطعا باید. روز پنجشنبه، ایلان ماسک، مدیر عامل شرکت، آخرین نسخه خودروی اسپورت هالو تسلا را برداشت و گفت که سازنده خودروهای الکتریکی به تولید در سال 2028 چشم دوخته است. این دومین باری است که شرکت نمونه اولیه خودرویی را رونمایی می‌کند که می‌گوید بر روی پلاک رودستر خواهد بود. در سال 2017، ماسک از یک رودستر با ظاهر نرم‌تر و بسیار متفاوت رونمایی کرد. نمونه اولیه تسلا رودستر 2017. تسلا نسخه 2017 به سادگی وارد مرحله ای در کنار ایلان شد، سپس لاستیک های خود را چرخاند و دور شد. نسخه 2028 - در مسیری که در فاصله ایمن از تماشاگران قرار داشت - یک دیوار عمودی رانده شد، وارونه آویزان شد، در هوا معلق بود، و یک \"تلنگر با ضربه\" روی خطی از تسلاهای دیگر انجام داد. به نظر می رسد، خیلی چیزها می توانند در 9 سال اضافی توسعه محصول تغییر کنند. بسیاری از مهره‌ها و پیچ‌ها که به رودستر نیرو می‌دادند تغییر کردند - و همچنین معیارهای ماشین نیز تغییر کردند. بنابراین، ما نموداری را جمع آوری کرده ایم که وعده های رودستر قدیمی تسلا را با وعده های جدید مقایسه می کند. این چیزی است که ما پیدا کردیم: متریک یا ویژگی 2017 رودستر 2028 رودستر برد 620 مایل 310 تا 320 مایل سرعت 0 تا 60 1.9 ثانیه 0.8 ثانیه حداکثر سرعت"}, {"source": "Business Insider", "title": "Millennial women are tired of being girlbosses", "link": "https://www.businessinsider.com/millennial-women-are-leaning-out-corporate-world-rto-working-moms-2026-10", "summary": "Getty Images; Alyssa Powell/BI After 20 years of balancing her corporate leadership roles with motherhood, Trisha Daab was ready for a break. \"Life had felt like sprinting a marathon for as long as I could remember,\" Daab, 47, told Business Insider . \"I had no idea how tired I was until I stopped working.\" In her year off, she tap danced, volunteered at a food bank, traveled to Disneyland and Alaska, and spent more time with her kids. By the end, she had decided she couldn't go back to her old life. \"My job often demanded that it came first — never-ending to-do lists, urgent emails, travel, and always chasing the next promotion,\" Daab, who's now a travel writer and substitute teacher, said. \"Stepping away helped me realize my priorities had shifted.\" Trisha Daab took a year off from her corporate role, then pivoted to jobs that allow for more work-life balance. Courtesy of Trisha Daab Now in their 30s and 40s, many millennial women are skeptical of corporate and instead becoming business owners, content creators, and mothers, prioritizing more flexible work schedules. Instead of striving to get to the top, they're inverting Sheryl Sandberg's mantra of the 2010s — and leaning out. Sandberg, Meta's former COO, told Business Insider that the corporate exodus is due to women feeling undervalued at work. \"This is not the women who are saying, 'I don't want to do it,'\" Sandberg, 57, said. \"It's the women saying, 'I don't want to do it because I'm not wanted, I'm not getting the same opportunities and the same support, and I face an unfair burden at home.'\" Even Lean In, the organization founded by Sandberg and named after her 2013 bestselling book, is noticing a recent shift in women's ambitions in the workforce. Sheryl Sandberg coined the phrase lean in in 2013, encouraging women to pursue more leadership roles. Bloomberg/Getty Images According to the organization's 2025 Women in the Workplace report , published in December 2025, which surveyed 9,500 US employees across 124 organizations, women were less likely to say they wanted a promotion compared to men. This was true when filtered to include only millennials, who made up roughly one-third of participants. When asked why, over 28% of millennial women said \"personal obligations\" made it hard for them to take on more — compared to 17% of millennial men. Annie Wright, a licensed psychotherapist who works with Silicon Valley leaders , has also observed more of her millennial female patients shifting their ideas", "date_str": "2026-10-17T09:04:01+00:00", "hash": "fe8a42b2a7015fde", "title_fa": "زنان هزاره از دختربچه بودن خسته شده اند", "summary_fa": "گتی ایماژ; آلیسا پاول/بی‌آی پس از 20 سال تعادل بین نقش‌های رهبری شرکتی و مادری، تریشا داب برای استراحت آماده بود. داب، 47 ساله، به Business Insider گفت: «زندگی از زمانی که یادم می‌آید مانند دوی ماراتن بود. تا زمانی که کار را متوقف نکردم نمی دانستم چقدر خسته هستم. او در سالی که تعطیل بود، رقصید، در یک بانک مواد غذایی داوطلب شد، به دیزنی لند و آلاسکا سفر کرد و زمان بیشتری را با فرزندانش سپری کرد. در پایان، او تصمیم گرفته بود که نمی تواند به زندگی قبلی خود بازگردد. داب که اکنون یک سفرنامه نویس و معلم جایگزین است، گفت: \"شغل من اغلب ایجاب می کرد که اول باشد - لیست کارهای بی پایان، ایمیل های فوری، سفر، و همیشه دنبال ارتقاء بعدی.\" \"کناره گیری به من کمک کرد تا متوجه شوم اولویت هایم تغییر کرده است.\" تریشا داب یک سال از نقش شرکتی خود مرخصی گرفت، سپس به سمت مشاغلی رفت که تعادل بین کار و زندگی را بیشتر کند. با حسن نیت از Trisha Daab اکنون در دهه 30 و 40 زندگی خود، بسیاری از زنان هزاره نسبت به شرکت های بزرگ بدبین هستند و در عوض صاحب مشاغل، تولیدکنندگان محتوا و مادر می شوند و برنامه های کاری انعطاف پذیرتر را در اولویت قرار می دهند. آنها به جای تلاش برای رسیدن به اوج، شعار دهه 2010 شریل سندبرگ را وارونه می کنند - و به بیرون متمایل می شوند. سندبرگ، مدیر ارشد اجرایی سابق متا، به بیزینس اینسایدر گفت که خروج شرکت ها به این دلیل است که زنان در محل کار احساس ارزش کمتری می کنند. سندبرگ 57 ساله گفت: \"این زنان نیستند که می گویند \"من نمی خواهم این کار را انجام دهم.\" این زنان هستند که می‌گویند، «نمی‌خواهم این کار را انجام دهم، زیرا نمی‌خواهم، فرصت‌ها و حمایت‌های یکسانی"}, {"source": "Business Insider", "title": "Men are lining up for a new on-the-go blood test that measures testosterone", "link": "https://www.businessinsider.com/men-testosterone-blood-testing-tasso-device-2026-10", "summary": "The Tasso+ blood draw takes about 5 minutes and is designed to be near-painless and foolproof. Tasso Hormone testing — especially to monitor testosterone levels — is trendy. A startup backed by the US military has pioneered a DIY device that requires no needle. It costs less than $100 and is quickly becoming a go-to for biohackers and telehealth brands. Dr. Jonathan Andrews had never checked his testosterone levels until about six weeks ago. Now, he's a convert. He's already repeated the procedure twice. He didn't go to a lab for his bloodwork , and he didn't use a standard needle or a finger prick. Instead, he attached a big red button to his bicep, then waited about five minutes while it quietly, almost imperceptibly, drew blood out of his skin while he made breakfast. Andrews said he loves the \"foolproof\" process. This quarter-sized pushbutton, called Tasso+, is being hailed as a game changer. Telemedicine companies, including Hims Hers , Balance My Hormones, and Maximus Health, all offer the same click button as a way for patients to check their \"T\" levels from the comfort of home. Testosterone therapy use has risen steadily in recent years alongside the growth of telehealth and direct-to-consumer men’s health services. Among adults, ages 18 to 34, prescriptions have more than doubled since 2018, according to health data company Truveta, even though the treatment can suppress sperm production and affect fertility. View this post on Instagram A post shared by Dr. Johnny Andrews (@drjohnnyandrews) \"Hormones are one of the things that you need to continually track, especially if someone does go on treatment,\" Andrews, a healthcare investor and urgent care doctor who is not affiliated with Tasso, said. \"It is one of the markers that you actually want multiple data points.\" One of the best times to check testosterone levels is first thing in the morning, when it can be tricky to get to a lab. Some men around the globe are starting to rely on the red plastic Tasso+ button to track hormone levels more regularly at home, without a trained phlebotomist or needle prick. \"This is the future,\" DJ and record producer Diplo tells the camera in a YouTube video for Rhythm, a blood testing company using the Tasso+ device, where he's a brand ambassador. \"Everybody needs to know what's going on in their body.\" It isn't a perfect test, but it's the next generation of DIY consumer health , geared toward diagnosing problems without a doctor or medical technician. Biohackers", "date_str": "2026-10-17T09:00:02+00:00", "hash": "bfd46415fd78c9e7", "title_fa": "مردان برای آزمایش خون جدید در حال حرکت که تستوسترون را اندازه گیری می کند صف می کشند", "summary_fa": "خونگیری Tasso+ حدود 5 دقیقه طول می کشد و تقریباً بدون درد و بدون خطا طراحی شده است. تست هورمون تاسو - به ویژه برای نظارت بر سطح تستوسترون - مرسوم است. یک استارت‌آپ با پشتیبانی ارتش ایالات متحده پیشگام دستگاهی DIY است که نیازی به سوزن ندارد. قیمت آن کمتر از 100 دلار است و به سرعت در حال تبدیل شدن به ابزاری برای بیوهکرها و برندهای بهداشت از راه دور است. دکتر جاناتان اندروز تا حدود شش هفته پیش هرگز سطح تستوسترون خود را بررسی نکرده بود. حالا، او تبدیل شده است. او قبلاً این روش را دو بار تکرار کرده است. او برای آزمایش خون خود به آزمایشگاه نرفت و از سوزن استاندارد یا نیش انگشت استفاده نکرد. درعوض، یک دکمه قرمز بزرگ را به عضله دوسر خود وصل کرد، سپس حدود پنج دقیقه منتظر ماند در حالی که به آرامی، تقریباً به‌طور نامحسوس، خون را از پوستش بیرون می‌کشید و صبحانه را درست می‌کرد. اندروز گفت که عاشق پروسه \"بی احمقانه\" است. این دکمه فشاری با اندازه یک چهارم، که Tasso+ نام دارد، به عنوان یک تغییر دهنده بازی مورد استقبال قرار می گیرد. شرکت‌های پزشکی از راه دور، از جمله Hims Hers، Balance My Hormones، و Maximus Health، همگی یک دکمه کلیک را به‌عنوان راهی برای بیماران ارائه می‌دهند تا سطح «T» خود را از آسایش خانه بررسی کنند. استفاده از تستوسترون درمانی در سال های اخیر همراه با رشد خدمات بهداشتی از راه دور و خدمات بهداشتی مستقیم به مصرف کننده مردان به طور پیوسته افزایش یافته است. به گفته شرکت داده های بهداشتی Truveta، در میان بزرگسالان 18 تا 34 ساله، نسخه ها از سال 2018 بیش از دو برابر شده است، حتی اگر این درمان می تواند تولید اسپرم را سرکوب کند و بر باروری تأثیر بگذارد. مشاهده این پست در اینستاگرام"}, {"source": "Business Insider", "title": "Los Tacos No. 1 serves 1,200 NYC customers a day. Its CEO is betting private equity can help it scale.", "link": "https://www.businessinsider.com/los-tacos-restaurant-new-york-ceo-private-equity-investment-why-2026-10", "summary": "Christian Pineda, CEO and cofounder of Los Tacos No. 1, serves a taco at the chain s Chelsea Market location. Dolly Faibyshev for BI Los Tacos No. 1 came under fire on social media after receiving a private equity investment. Some fans feared the beloved New York City Tijuana-style taco chain would lose its iconic flavor. The chain's CEO told Business Insider they will scale cautiously, preserving quality and low prices. Christian Pineda, CEO and cofounder of Los Tacos No. 1 , couldn't fall asleep. He was caught in a scroll of enraged social media posts. The storm of customer indignation followed news last month that the beloved New York City taco chain had received an investment from the private equity firm TSG Consumer. The internet seemed convinced their favorite carne asada and adobada tacos would lose their quality, and Pineda had not expected the reaction. To remedy the situation, he said he felt it was his duty to address his customers directly. He woke up at 4:30 the next morning to clear the air. \"No, we're not going to start charging extra for guac. We're not switching to horse meat. And no, we're definitely not messing with the tacos,\" read the Instagram post published September 4. \"I wanted to keep it simple, honest, and comical too at the same time,\" Pineda told Business Insider. \"I saw it as inspiring, honestly, to really prove our customers wrong — that private equity is not always bad.\" Christian Pineda, CEO and cofounder, and Jacobo Ackerman, chief operating partner, run the taco chain s day-to-day operations. Dolly Faibyshev for BI Colin Welch, managing director and head of New York at TSG Consumer, said the backlash among some underscored what TSG saw in the taco business to begin with: a \"cultlike following\" customer base protective of the food, and an experience that made Los Tacos a \"New York institution.\" \"It's our responsibility to show those skeptics that it's going to be exactly the same Los Tacos experience, and that nothing's going to change for the worse,\" Welch said. \"We got to show them, not tell them, and that'll happen over time.\" The PE firm, founded in 1986 and with $14 billion in assets under management, also has investments in food names Pura Vida Miami, Crumbl, and Dutch Bros Coffee . TSG declined to disclose the terms of the deal or the amount it paid for its investment in or stake in Los Tacos No. 1, which opened in 2013. Welch said the firm plans to let Pineda and his team run the show, while TSG will provide guidan", "date_str": "2026-10-17T09:00:01+00:00", "hash": "72246ab04d935052", "title_fa": "Los Tacos No. 1 به 1200 مشتری نیویورک خدمات ارائه می دهد. مدیرعامل آن شرط می‌بندد که سهام خصوصی می‌تواند به مقیاس آن کمک کند.", "summary_fa": "کریستین پیندا، مدیر عامل و یکی از بنیانگذاران Los Tacos No. 1، یک تاکو در محل بازار زنجیره ای چلسی سرو می کند. دالی فایبیشف برای شماره 1 BI Los Tacos پس از دریافت یک سرمایه گذاری خصوصی در رسانه های اجتماعی مورد انتقاد قرار گرفت. برخی از طرفداران می ترسیدند که زنجیره محبوب تاکو به سبک تیجوانا شهر نیویورک طعم نمادین خود را از دست بدهد. مدیر عامل این زنجیره به Business Insider گفت که آنها با احتیاط مقیاس خواهند کرد و کیفیت و قیمت پایین را حفظ خواهند کرد. کریستین پیندا، مدیرعامل و موسس Los Tacos No. 1 نتونستم بخوابم او در طومار پست های خشمگین رسانه های اجتماعی گرفتار شد. طوفان خشم مشتریان در پی اخباری بود که ماه گذشته منتشر شد مبنی بر اینکه زنجیره محبوب تاکو سیتی نیویورک سرمایه‌گذاری را از شرکت سهام خصوصی TSG Consumer دریافت کرده است. به نظر می‌رسید اینترنت متقاعد شده بود که تاکوهای مورد علاقه‌ی کارنه‌آسادا و ادوبادا کیفیت خود را از دست می‌دهند، و پینه‌دا انتظار این واکنش را نداشت. برای اصلاح این وضعیت، او گفت که وظیفه خود می‌داند که مستقیماً به مشتریانش خطاب کند. صبح روز بعد ساعت 4:30 از خواب بیدار شد تا هوا را پاک کند. پیندا به Business Insider گفت: \"نه، ما شروع به دریافت هزینه اضافی برای guac نمی کنیم. ما به گوشت اسب تغییر نمی دهیم. و نه، ما قطعاً با تاکوها کار نمی کن
