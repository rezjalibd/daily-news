      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {

      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);

      font-weight: 600;

      align-items: center;

      border-color: var(--read-border);

    .news-card.is-read:hover {

      font-size: 0.85rem;

      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;

      color: var(--success);

    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;

    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {

      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;

    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;

    .news-source {

      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {

      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);

    .news-category-badge {

      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;

    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);

    .footer-tags-row {

      align-items: center;
      flex-wrap: wrap;
      gap: 6px;

      color: var(--text-muted);

      transition: all 0.2s ease;

    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);

    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;

    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;

    .btn-mark-read {

      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;

    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);

    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;

      from { transform: scale(0.95); opacity: 0; }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);

      justify-content: space-between;
      align-items: center;

    .btn-close {

      padding: 4px;

    .btn-close:hover {

    .modal-body {

      border: 1px solid var(--card-border);

      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;

      border-color: var(--primary);
      transform: translateX(-4px);

    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;

    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);

    .archive-arrow {
      color: var(--primary);

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }

      .btn-action { font-size: 0.78rem; padding: 6px 9px; }

      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

nue to travel through time. You always breathe life into my music. “Over the past 25 years, Juanes, through his guitar and songwriting, has broken down borders, bringing the essence of Colombia to the world while redefining rock and Latin roots, added Angel Kaminsky, president, A R and artist relations at Universal Latin America Iberian Peninsula. This album is more than just a greatest hits collection it is a journey through the evolution of our cultural identity.” A winner of accolades including 25 Latin Grammys, four Grammys and more than 10 Billboard Latin Music Awards, Juanes born and raised in Medellín, Colombia is one of the most established and revered Latin artists of his generation, with Billboard chart-topping tracks also including Volverte a Ver Fotografía with Nelly Furtado and Gotas de Agua Dulce. In 2007, “Me Enamora” led Hot Latin Songs for 20 weeks and spent 38 weeks on the ranking. This year, Juanes also appeared on the June cover of Billboard Español along with fellow Colombian artists Camilo, Carlos Vives and Fonseca to talk about the FIFA World Cup, fatherhood and their country s spirit. 25 Aniversario , appropriately, begins with the title track to his 2000 landmark debut album, Fíjate Bien , which spoke to Colombia’s social hardships and went on to garner seven Latin Grammy nominations, with Juanes earning best new artist of the year. Also on the album are Yerbatero, Fuego and La Luz, songs fro", "date_str": "2026-11-04T15:00:00+00:00", "hash": "4d8c6e2561c46f2e", "title_fa": "خوان 25 سال موسیقی را با اولین آلبوم برتر «25 Aniversario» جشن گرفت: لیست آهنگ و تاریخ انتشار در اینجا آمده است", "summary_fa": "خوانس، ستاره راک کلمبیایی، با جشن گرفتن اولین سالگرد پایانی ربع قرن فعالیت انفرادی خود، اولین مجموعه موفق خود را با عنوان 25 Aniversario منتشر خواهد کرد که بیلبورد می تواند به طور انحصاری در چهارشنبه (4 نوامبر) گزارش دهد. 25 سوال مرتبط با خوانس در بیست و پنجمین سالگرد حرفه انفرادی او: وضوحی پیدا کردم که مدت ها پیش از دست داده بودم فونسکا، کامیل     function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;

        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">

              <h2 class="news-title">${title}</h2>

            <div class="news-footer">

                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `

                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
