      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {

      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;

      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;

      from { transform: scale(0.95); opacity: 0; }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;

    .btn-close:hover {
      color: var(--text);

    .modal-body {

      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;

      border: 1px solid var(--card-border);

      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

      header { padding: 18px 14px; padding-top: 56px; }

      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>

041d1f45e28ad8a52a7035caf9f4ea323a-700x642.jpg?rect=0,137,700,368&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۳ آبان • ۲۳:۴۸"}, {"source": "Radio Farda", "title": "نخست‌وزیر عراق ۹ مقام دولتی را در پی «قاچاق نفت» توسط گروه مورد حمایت ایران برکنارکرد", "link": "https://www.radiofarda.com/a/iraq-pm-sacks-officials-over-oil-smuggling-in-pro-iran-group-bastion/33898702.html", "summary": ".", "date_str": "2026-11-14T20:06:50+00:00", "hash": "f4b8de4f9ae90ea4", "title_fa": "نخست‌وزیر عراق ۹ مقام دولتی را در پی «قاچاق نفت» توسط گروه مورد حمایت ایران برکنارکرد", "summary_fa": "نخست‌وزیر عراق، روز شنبه ۲۳ آبان، در پی تحقیقات دربارهٔ قاچاق احتمالی نفت در منطقه‌ای تحت تسلط گروه کتائب حزب‌الله، که تحت حمایت حکومت ایران قرار دارد، دستور برکناری ۹ مقام دولتی را صادر کرد. علی الزیدی، اواخر هفته گذشته دستور آغاز تحقیقاتی درباره قاچاق نفت در منطقه جرف‌ الصخر در استان بابل در جنوب بغداد را صادر کرده بود. این منطقه یکی از پایگاه‌های اصلی کتائب حزب‌الله است؛ گروهی شبه‌نظامی که دولت آمریکا آن را در فهرست سازمان‌های تروریستی قرار داده است. صباح النعمان، سخنگوی نظامی نخست‌وزیر عراق، روز شنبه گفت الزیدی «با توجه به نتایج تحقیقات، دستور داده است همه افرادی که به دست داشتن در عملیات قاچاق نفت متهم هستند، به دستگاه قضایی معرفی شوند». به گفته النعمان، نخست‌وزیر عراق همچنین دستور برکناری ۹ مقام را صادر کرده است که در میان آن‌ها افسران امنیتی و اطلاعاتی استان بابل، یک فرمانده وزارت کشور و مدیر شرکت خطوط لوله نفت وابسته به وزارت نفت حضور دارند. سخنگوی نظامی نخست‌وزیر درباره نقش این مقام‌ها در عملیات قاچاق ادعایی توضیح بیشتری نداد. کمیته تحقیق درباره این پرونده روز جمعه با همراهی اعضای کتائب حزب‌الله وارد منطقه جرف‌الصخر شد. هیبت الحلبوسی، رئیس پارلمان عراق، اواخر هفته گذشته خواستار تشکیل کمیته‌ای پارلمانی برای بررسی این موضوع شده بود. این کمیته مأمور بررسی موضوع و ارائهٔ نتایج به ریاست مجلس شده است. خبرگزاری دولتی عراق چهارشنبه هفته پیش گزارش داده بود که «اسناد اطلاعاتی» حاوی تصاویر ماهواره‌ای، عملیات قاچاق نفت خام و فرآورد گان ایالات متحده، پس از یک دور گفت‌وگو با ولادیمیر پوتین، رئیس‌جمهور روسیه در مسکو، روز پنجشنبه برای دیدار با آقای زلنسکی به پایتخت جمهوری ایرلند سفر کردند. اظهارات ولادیمیر پوتین و مقامات روسیه نشان می‌دهد که موضع روسیه در قبال جنگ تغییری نکرده است و خواسته‌های مسکو درباره تصاحب اراضی و بی‌طرفی، همچنان بسیار فراتر از آن چیزی است که اوکراین حاضر است آن را مدنظر قرار دهد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/3fe4/live/9d4d2ea0-e02c-11f1-9ca9-b3b288fceb81.jpg", "category": "امنیت سایبری و شبکه", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲۳ آبان • ۱۸:۰۸"}, {"source": "Iran International", "title": "استقلال خوزستان از پرسپولیس و بیفوما به فیفا شکایت می‌کند", "link": "https://www.iranintl.com/202611146545", "summary": "شهرام هزاریان، رییس هیات مدیره استقلال خوزستان، از ثبت شکایت این باشگاه از پرسپولیس و تیوی بیفوما در اتاق حل اختلاف فیفا خبر داد.", "date_str": "2026-11-14T14:34:25+00:00", "hash": "af12534475251564", "title_fa": "استقلال خوزستان از پرسپولیس و بیفوما به فیفا شکایت می‌کند", "summary_fa": "شهرام هزاریان، رییس هیات مدیره استقلال خوزستان، از ثبت شکایت این باشگاه از پرسپولیس و تیوی بیفوما در اتاق حل اختلاف فیفا خبر داد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/4a7f57ad48a50d265fadd830edfcba0cc0c8fcd0-800x534.jpg?rect=0,35,800,420&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۳ آبان • ۱۸:۰۴"}, {"source": "Iran International", "title": "رویترز: اگر تهران دست به اقدام تحریک‌آمیز نزند، ترامپ ممکن است حمله را به تعویق بیندازد", "link": "https://www.iranintl.com/202611146752", "summary": "خبرگزاری رویترز به‌نقل از منابع آگاه گزارش داد دونالد ترامپ، رییس‌جمهوری آمریکا، به مشاوران ارشد خود گفته است اگر تهران یا حوثی‌های یمن اقدام تحریک‌آمیز تازه‌ای علیه واشینگتن انجام ندهند، ممکن است حمله به جمهوری اسلامی را به تعویق بیندازد.", "date_str": "2026-11-14T14:05:27+00:00", "hash": "65d91eb81654bcd0", "title_fa": "رویترز: اگر تهران دست به اقدام تحریک‌آمیز نزند، ترامپ ممکن است حمله را به تعویق بیندازد", "summary_fa": "خبرگزاری رویترز به‌نقل از منابع آگاه گزارش داد دونالد ترامپ، رییس‌جمهوری آمریکا، به مشاوران ارشد خود گفته است اگر تهران یا حوثی‌های یمن اقدام تحریک‌آمیز تازه‌ای علیه واشینگتن انجام ندهند، ممکن است حمله به جمهوری اسلامی را به تعویق بیندازد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/bd994f3a4823c78a937b9b1b0bd3e750b9622beb-5460x3640.jpg?rect=0,387,5460,2867&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۳ آبان • ۱۷:۳۵"}, {"source": "Radio Farda", "title": "سفر رئیس موساد به آمریکا؛ مقام‌های امنیتی اسرائیل بر سر حمله دوباره به ایران «اختلاف دارند»", "link": "https://www.radiofarda.com/a/israel-mossad-chief-iran-strikes-security-dispute/33898641.html", "summary": "در پی سفر رئیس موساد به آمریکا برای رایزنی درباره ایران، رسانه‌های اسرائیل از ادامه تلاش نتانیاهو برای ازسرگیری حملات و اختلاف‌نظر مقام‌های ارشد امنیتی بر سر ضرورت حمله خبرمی‌دهند.", "date_str": "2026-11-14T14:44:23+00:00", "hash": "952aca4e34104c22", "title_fa": "سفر رئیس موساد به آمریکا؛ مقام‌های امنیتی اسرائیل بر سر حمله دوباره به ایران «اختلاف دارند»", "summary_fa": "در پی سفر رئیس موساد به آمریکا برای رایزنی درباره ایران، رسانه‌های اسرائیل از ادامه تلاش نتانیاهو برای ازسرگیری حملات و اختلاف‌نظر مقام‌های ارشد امنیتی بر سر ضرورت حمله خبرمی‌دهند. باراک راوید، خبرنگار اسرائیلی وب‌سایت آمریکایی اکسیوس، روز جمعه ۲۲ آبان به نقل از سه منبع آگاه گزارش داد که رومن گوفمن، رئیس موساد، برای دیدار با مقام‌های ارشد دولت دونالد ترامپ به واشینگتن رفته است. این سفر در شرایطی انجام شده که به نوشتهٔ اکسیوس، نتانیاهو در تلاش است رئیس‌جمهور آمریکا را به ازسرگیری عملیات نظامی گسترده علیه ایران متقاعد کند؛ درخواستی که ترامپ تاکنون در برابر آن مقاومت کرده است. بر اساس این گزارش، گوفمن با جان رتکلیف، رئیس سی‌آی‌ای، دیدار می‌کند و انتظار می‌رود "hash": "dfa9bb2cbd66f733", "title_fa": "شاهکار تاریخی اسپیس‌ایکس؛ مرحله فوقانی استارشیپ برای نخستین‌بار در هوا مهار شد", "summary_fa": "با بازگشت خیره‌کننده استارشیپ به محل پرتاب و مهار آن به‌وسیله بازوهای مکازیلا، نخستین بازیابی مرحله فوقانی یک موشک کلاس مداری در تاریخ رقم خورد تبلیغات اسپیس‌ایکس بامداد یکشنبه ۲۴ آبان به وقت ایران، برای نخستین‌بار موفق شد مرحله فوقانی موشک غول‌پیکر استارشیپ را در هوا مهار کند؛ دستاوردی تاریخی که می‌تواند راه را برای شکوفایی ظرفیت‌های عظیم این سامانه پرتاب فضایی هموار کند. استارشیپ بامداد یکشنبه ۲۳ آبان به وقت ایران، پانزدهمین پرتاب آزمایشی خود را از پایگاه استاربیس اسپیس‌ایکس در جنوب تگزاس آغاز و در پروازی تماشایی به آسمان صعود کرد. طبق برنامه مأموریت، قرار بود هر دو مرحله موشک به استاربیس بازگردند و بازوهای موسوم به «چاپستیک» برج پرتاب آن‌ها را در هوا بگیرند؛ اتفاقی بی‌سابقه که به معنای بازیابی کامل یک موشک مداری بود. اما این اتفاق به‌طور کامل رخ نداد. بوستر سوپر هِوی استارشیپ پس از دریافت هشدار کاهش سوخت، مسیر خود را تغییر داد و در خلیج مکزیک فرود آمد. بااین‌حال، شیپ یا مرحله فوقانی استارشیپ نه‌تنها با موفقیت به مدار نزدیک زمین تزریق شد، بلکه به سلامت به زمین نیز بازگشت و نقطه‌ی عطفی تاریخی برای اسپیس‌ایکس رقم زد. این شرکت اکنون گامی بسیار بزرگ در جهت تحقق رؤیای استفاده مجدد کامل از موشک‌ها برداشته است. ۰:۰۰ / ۰:۰۰ لایک دن هوت، مدیر ارتباطات اسپیس‌ایکس، در پخش زنده فرود امروز استارشیپ، درحالی‌که صدایش از شدت هیجان می‌لرزید، گفت: این همان حلقه گمشده بود. این جام مقدس پروازهای فضایی بود؛ سقوط از میان آتش تا درنهایت بازوهایی فولادی آن را از آسمان بقاپند. ما استارشیپ را گرفتیم و حالا همه‌چیز تغییر می‌کند. عملیات مهار شیپ شنبه ساعت ۱۶:۲۰ به وقت ساحل شرقی آمریکا (بامداد یکشنبه ساعت ۰۰:۵۰ به وقت ایران) انجام شد. در آن زمان، موشک عظیم اسپیس‌ایکس ۱۴ بار به دور زمین چرخیده بود و تقریباً ۲۲٫۵ ساعت از پروازش در مدار زمین", "image_url": "https://api2.zoomit.ir/media/ship-42-catch-6af8e8402314debea39c044b?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۴ آبان • ۰۲:۴۵"}, {"source": "Zoomit", "title": "گوگل امکان اتصال حساب بانکی به جمنای را فراهم کرد؛ تحلیل مخارج و شناسایی هزینه‌های اضافی", "link": "https://www.zoomit.ir/ai-articles/471092-google-wallet-integrates-with-gemini/", "summary": "گوگل با ادغام کیف پول دیجیتال در چت‌بات جمنای، امکان تحلیل هوشمند هزینه‌ها و بودجه‌بندی شخصی را فراهم کرد.", "date_str": "2026-11-14T23:15:00+00:00", "hash": "3f71da3b89337c5d", "title_fa": "گوگل امکان اتصال حساب بانکی به جمنای را فراهم کرد؛ تحلیل مخارج و شناسایی هزینه‌های اضافی", "summary_fa": "گوگل با ادغام کیف پول دیجیتال در چت‌بات جمنای، امکان تحلیل هوشمند هزینه‌ها و بودجه‌بندی شخصی را فراهم کرد. تبلیغات گوگل قابلیت اتصال Google Wallet به هوش شخصی جمنای را فراهم کرد تا کاربران بتوانند بر اساس الگوهای خرج‌کردن خود، مشاوره‌های مالی دقیق دریافت کنند. کیف پول دیجیتال گوگل به جمع سرویس‌های دیگری نظیر جیمیل، یوتیوب، تصاویر و موتور جست‌وجو پیوسته است که پیش‌تر امکان اتصال به جمنای را داشتند. کاربران می‌توانند کارت‌های اعتباری و حساب‌های بانکی خود را از طریق پلتفرم Plaid به کیف پول گوگل متصل کنند تا هوش مصنوعی دید کامل‌تری نسبت‌به وضعیت مالی پیدا کند. برقراری این ارتباط با منشن کردن Google Wallet@ در محیط چت و پرسیدن سؤال‌های مالی یا بودجه‌بندی انجام می‌شود. ۰:۰۰ / ۰:۰۰ لایک دستیار هوش مصنوعی توانایی بررسی هزینه‌های فصل گذشته و ترسیم نمودارهای گردش وجوه، تخصیص دارایی و بودجه‌بندی را مستقیما در پنجره‌ی گفت‌و‌گو دارد؛ مهارتی که به‌طور ویژه برای اهدافی مانند پس‌انداز ۱۰۰۰ دلار در طول سه ماه کاربرد خواهد داشت. جمنای همچنین پرداخت‌های دوره‌ای و اشتراک‌هایی را که با افزایش قیمت مواجه شده‌اند شناسایی می‌کند و با تحلیل هزینه‌های سفر و هدایای سال قبل، بودجه‌ی مناسب برای تعطیلات پیش رو پیشنهاد می‌دهد. دسترسی جمنای به حساب‌ها صرفا به‌صورت خواندن اطلاعات تعریف شده است و توانایی جابه‌جایی، مدیریت مستقیم یا سرمایه‌گذاری پول کاربران را ندارد. فعال‌سازی این قابلیت کاملا اختیاری است و از بخش Connected Apps در تنظیمات شخصی‌سازی هوش مصنوعی مدیریت می‌شود. انتشار ویژگی یادشده برای تمام کاربران ساکن ایالات متحده در نسخه‌های وب، اندروید و iOS آغاز شده است. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گ م بزرگ‌ترین نقشه سه‌بعدی کیهان است و آژانس فضایی اروپا به‌تازگی نخستین بخش گسترده از این نقشه را منتشر کرده است. تبلیغات اخترشناسان به لطف تلسکوپ فضایی اقلیدس، متعلق به آژانس فضایی اروپا (ESA) که به‌تازگی نخستین مجموعه بزرگ از داده‌های رصدی خود را منتشر کرده است، گام بزرگی به سوی نقشه‌برداری هرچه دقیق‌تر از کیهان برداشتند. اقلیدس از زمان پرتاب در ژوئیه ۲۰۲۳، با استفاده از دوربین نور مرئی خود که وضوحی در حدود ۶۰۰ مگاپیکسل دارد، از اجرام کیهانی در فواصل نزدیک و دور تصویربرداری کرده است. اقلیدس تاکنون درمجموع موفق شده نزدیک به یک میلیارد جرم آسمانی را ثبت کند که بیش از ۹۰۰ میلیون مورد از آن‌ها کهکشان و ۶۰ میلیون مورد نیز اختروش احتمالی هستند. اختروش‌ها هسته‌های بسیار درخشان کهکشان‌ها محسوب می‌شوند که در آن‌ها گاز فوق‌داغ به درون سیاه‌چاله‌ای کلان‌جرم کشیده می‌شود. کارول ماندل، مدیر واحد علمی آژانس فضایی اروپا، در بیانیه‌ای گفت مجموعه تصاویر قبلی اقلیدس، بخش بسیار محدودتری از آسمان را پوشش می‌دادند؛ اما حجم عظیم داده‌های گردآوری‌شده در رصدهای جدید (بیش از ۱٫۷ میلیون گیگابایت)، باعث شده که مجموعه‌ی تازه منتشرشده به «بزرگ‌ترین پیمایش فضایی از نوع خود تبدیل شود و بنیانی برای اکتشافات آینده در عرصه‌ای نو از اخترشناسی فراهم آورد.» توضیح تصویر مقاله: ناحیه مرکزی و خیره‌کننده گروه کهکشانی مسیه ۸۱ از نگاه تلسکوپ فضایی اقلیدس. اقلیدس در رصدهای خود از پدیده‌ای کیهانی به نام همگرایی گرانشی نیز بهره می‌برد. هنگامی که نور گسیل‌شده از کهکشان‌ها و دیگر اجرام آسمانی در فضا حرکت می‌کند، با میدان گرانشی اجرام بزرگ دیگر برهم‌کنش دارد. گرانش این اجرام، مسیر نور را خم و آن را بزرگ‌نمایی می‌کند؛ درنتیجه، نور درخشان‌تر می‌شود و تلسکوپ‌هایی مانند اقلیدس راحت‌تر می‌توانند آن را شناسایی کنند.", "image_url": "https://api2.zoomit.ir/media/core-of-the-messier-81-galaxy-group-6af8c4c52314debea39c0418?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۳ آبان • ۲۳:۵۹"}, {"source": "Zoomit", "title": "فروش نسل سوم «بی‌وای‌دی تانگ» شروع شد؛ شاسی‌بلند پنج‌نفره با امکانات لوکس و قیمت رقابتی", "link": "https://www.zoomit.ir/car/471055-byd-third-gen-tang-presales آبان • ۲۲:۰۰"}, {"source": "Zoomit", "title": "معمای ذهن‌های خلاق؛ چرا دانشمندان به‌اندازه هنرمندان دچار مشکلات روانی نمی‌شوند؟", "link": "https://www.zoomit.ir/health-medical/470985-artistic-creativity-mental-health-study/", "summary": "پژوهشی روی نزدیک به ۱۵هزار دوقلوی سوئدی نشان می‌دهد که خلاقیت هنری با برخی مشکلات سلامت روان ارتباط دارد، اما این الگو در خلاقیت علمی دیده نمی‌شود.", "date_str": "2026-11-14T18:20:00+00:00", "hash": "33615c825c0870bd", "title_fa": "معمای ذهن‌های خلاق؛ چرا دانشمندان به‌اندازه هنرمندان دچار مشکلات روانی نمی‌شوند؟", "summary_fa": "پژوهشی روی نزدیک به ۱۵هزار دوقلوی سوئدی نشان می‌دهد که خلاقیت هنری با برخی مشکلات سلامت روان ارتباط دارد، اما این الگو در خلاقیت علمی دیده نمی‌شود. تبلیغات تصور هنرمندانی که با مشکلات روانی دست‌وپنجه نرم می‌کنند، از مدت‌ها پیش در فرهنگ عمومی وجود داشته است؛ از ونسان ون‌گوگ گرفته تا سیلویا پلات. اما چرا چنین تصویری درباره دانشمندان کمتر دیده می‌شود؟ درحالی‌که خلق اثر هنری و دستیابی به کشفی علمی هر دو به خلاقیت نیاز دارند، پژوهشی جدید نشان می‌دهد که ارتباط خلاقیت با سلامت روان به نوع فعالیت خلاقانه بستگی دارد. پژوهشگران مؤسسه زیبایی‌شناسی تجربی ماکس پلانک و مؤسسه کارولینسکا در سوئد، در مطالعه‌ی جدید اطلاعات ۱۴هزار و ۶۵۸ دوقلو را بررسی کردند . شرکت‌کنندگان در دو مرحله نظرسنجی با فاصله حدود ۱۰ سال، درباره دستاوردهای خود در زمینه هنر، موسیقی، نویسندگی، علم و اختراع اطلاعات ارائه دادند. پژوهشگران علاوه‌بر بررسی سوابق پزشکی و تشخیص‌های روان‌پزشکی، ویژگی‌های شخصیتی و توانایی تفکر خلاق شرکت‌کنندگان را نیز ارزیابی کردند. نتایج نشان داد افرادی که دستاوردهای بیشتری در موسیقی، نویسندگی، رقص، تئاتر و هنرهای تجسمی داشتند، علائم افسردگی و تجربه‌های شبه‌روان‌پریشی بیشتری گزارش می‌کردند. موفقیت هنری بیشتر همچنین با احتمال بالاتر تشخیص اسکیزوفرنی ، اضطراب و اختلالات مرتبط با استرس در سال‌های بعد همراه بود. افرادی که در موسیقی، نویسندگی و هنرهای تجسمی موفقیت بیشتری داشتند، علائم افسردگی و تجربه‌های شبه‌روان‌پریشی بیشتری گزارش کردند اما در مورد خلاقیت علمی، الگوی متفاوتی مشاهده شد. افرادی که در علم و اختراع دستاوردهای بیشتری داشتند، به‌طور کلی با افزایش معنادار مشکلات روان‌پزشکی مواجه نبودند. حتی برخی شاخص‌های خلاقیت در مشاغل علمی و فنی با مشکلات روانی کمتر ارتباط داشتند. یکی از پرسش‌های اصلی پژوهشگران این بود که آیا فعالیت هنری خطر بروز مشکلات روانی را افزایش می‌دهد یا افرادی که از نظر ژنتیکی مستعد برخی اختلالات هستند، بیشتر به فعالیت‌های هنری گرایش پیدا می‌کنند.", "image_url": "https://api2.zoomit.ir/media/man-anxious-expression-painting-6af533f11e22a6ae5bd3ee96?w=1920&q=75", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۲۳ آبان • ۲۱:۵۰"}, {"source": "Zoomit", "title": "شمارش معکوس برای عرضه جی تی ای ۶؛ جزئیات جدید از بازی اعلام شد", "link": "https://www.zoomit.ir/gaming/471127-gta-6-protagonists-progression-details/", "summary": "شخصیت‌های اصلی بازی GTA 6 کار خود را به عنوان مجرمان خرده‌پا با مهارت‌های اولیه آغاز می‌کنند.", "date_str": "2026-11-14T18:10:00+00:00", "hash": "b972ecdc9d4af050", "title_fa": "شمارش معکوس برای عرضه جی تی ای ۶؛ جزئیات جدید از بازی اعلام شد", "summary_fa": "شخصیت‌های اصلی بازی GTA 6 کار خود را به عنوان مجرمان خرده‌پا با مهارت‌های اولیه آغاز می‌کنند. تبلیغات شخصیت‌های اصلی جی تی ای ۶ ماجراجویی خود را در دنیای جرم و جنایت در جایگاه مجرمانی خرده‌پا با توانایی‌های ابتدایی کلید می‌زنند. گیمرها بر خلاف تصورات اولیه، از همان ابتدا توانایی دستبرد زدن به بانک‌ها یا جواهرفروشی‌های مجلل را نخواهند داشت و باید مسیر پیشرفت را پله‌پله طی کنند. راک‌استار گیمز سازوکار داستانی و روند گیم‌پلی دو قهرمان اثر یعنی جیسون دووال و لوسیا کامینوس را تشریح کرده است. گیمرها فعالیت‌های غیرقانونی را با سیم‌کشی دستی خودروهای ارزان‌قیمت، باز کردن قفل‌های معمولی و سرقت از فروشگاه‌های کوچک و پمپ‌بنزین‌ها آغاز خواهند کرد تا به مرور به اهداف بزرگ‌تر دست یابند. راب نلسون ، مدیر راک‌استار گیمز، می‌گوید : «این افراد زوج جوانی هستند که دستشان به جایی بند نیست و به بن‌بست رسیده‌اند. از نظر داستانی، اصلا منطقی نیست که آن‌ها بیرون بروند و تا جای ممکن کشتار راه بیندازند و هیاهو به پا کنند.» سرقت وسایل نقلیه در GTA 6 با سیستم‌های ضدسرقت هوشمند، آلارم‌ها، ردیاب‌ها و ایموبلایزرها محافظت می‌شود و دیگر مثل نسخه‌های قبلی ساده نخواهد بود. فروشندگان در برابر سرقت مقاومت می‌کنند، عابران هویت خلافکاران را به پلیس گزارش می‌دهند و افراد با گوشی‌های هوشمند خود از حوادث فیلم‌برداری کرده و ردپای دیجیتالی به جا می‌گذارند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/gta-6-gameplay-action-scene-6af84b6a2314debea39c02d6?w=1920&q=75", "category": "موبایل و گجت‌ها", "tags": ["سینما"], "datetime_fa": "۲۳ آبان • ۲۱:۴۰"}, {"source": "Business Insider", "title": "The FAA ground stop stranded me at the airport with 3 kids until 4 a.m. We're delayed 3 days and facing thousands in costs.", "link": "https://www.businessinsider.com/faa-ground-stop-stranded-airport-twin-toddlers-family-2026-11", "summary": "Morgane Richardson and her family were stranded in Orlando due to the FAA ground stop. Courtesy of Morgane Richardson Morgane Richardson was stranded in Orlando with her wife and three kids after the FAA ground stop. The family waited at the airport until 3 a.m. before finding a hotel and recovering their luggage. Getting home could take three extra days and cost thousands in hotels and lost wages This as-told-to essay is based on a conversation with Morgane Richardson. It has been edited for length and clarity My family was already in the air flying from Puerto Rico to Orlando, en route back to our home in Albany, New York, when we found out about the ground stop . I had a work conference there, so I decided to bring my wife and three kids, twin 3-year-olds and an 8-year-old, with me. Luckily, we were able to land, but the pilot told us all connections had been canceled . Now it's going to take us three additional days to get home, and it's going to cost us thousands of dollars. We were at the Orlando airport until 3 a.m. When we landed in Orlando at 7 p.m., everything was chaotic, with long lines of people trying to get help . My wife and I got our kids settled at one of the gates, and then I waited in line for about an hour. The customer service agent told me our connecting flight would depart at 1 a.m., so we decided to stay at the airport. Morgane Richardson and her family waited in the Orlando airport for their flight to take off. Courtesy of Morgane Richardson Our kids were definitely troopers, but were exhausted. We were able to get one of the little ones to fall asleep in their stroller, but the other two didn't fall asleep until about 10 p.m., way past their bedtime . The whole time we were there, the airline didn't offer us anything, not even a snack or a blanket. The kids were definitely uncomfortable on the floor and cold. One of our kids goes to bed every night with a warm cup of milk, but all of the vendors were closed, so she couldn't have it, which led to some big tears. We were able to get everyone dinner before things closed, though. The first available flight isn't until Sunday night After waiting nearly six hours at the airport, we found out at close to 1 a.m. that our flight had been canceled. By that point, we were having trouble finding a hotel with availability, and we didn't have our bags with us. Morgane Richardson s flight ended up getting canceled. Courtesy of Morgane Richardson With only one change of clothes in our carry-on, ", "date_str": "2026-11-14T18:19:33+00:00", "hash": "56ff28ca7f662e6f", "title_fa": "ایستگاه زمینی FAA من را با 3 بچه تا ساعت 4 صبح در فرودگاه سرگردان کرد. ما 3 روز تاخیر داریم و با هزاران هزینه روبرو هستیم.", "summary_fa": "مورگان ریچاردسون و خانواده اش به دلیل توقف زمینی FAA در اورلاندو سرگردان شدند. به لطف مورگان ریچاردسون مورگان ریچاردسون به همراه همسر و سه فرزندش پس از توقف زمینی FAA در اورلاندو سرگردان شدند. خانواده تا ساعت 3 صبح در فرودگاه منتظر ماندند تا هتلی پیدا کنند و چمدان های خود را تحویل بگیرند. بازگشت به خانه ممکن است سه روز بیشتر طول بکشد و هزاران نفر در هتل ها و دستمزدهای از دست رفته هزینه داشته باشد. برا s expected across the US this weekend as aviation recovers after all flights in the country were grounded on Friday afternoon. The FAA halted flights nationwide for about four-and-a-half hours after an issue with air traffic control systems, stranding travelers in airports and canceling about 12,500 flights on Friday and Saturday. Still, Friday's closure will snarl air travel into the weekend as airlines scramble to get airplanes and crew back in place — and thousands of delayed or canceled passengers back on their way. Department of Transportation Secretary Sean Duffy and Homeland Security Secretary Markwayne Mullin, during press conferences on Friday and Saturday, blamed the outage on outdated ATC infrastructure . Duffy also floated the possibility of an error by longtime FAA contractor L3Harris Technologies, or a faulty router. They also called for Congress to cough up $50 billion for ATC modernization — up from the $30 billion previously pitched in September. The FAA tapped AT T in August 2026 to lead the infrastructure overhaul of L3Harris' decades-old network. Here's what we know so far about the cause of the FAA outage. L3Harris did not immediately respond to a request for comment from Business Insider. Duffy floated a contractor mistake or a faulty router Duffy said on Saturday that the issue began when L3Harris, an FAA contractor for over 20 years, was upgrading copper wiring to fiber at \"at least one\" remote FAA site on Friday; the fiber work has been ongoing for months across the US. One of the routers in the project \"started flooding other routers\" in the network with data, so the FAA shut it down. That affected radar and communication with pilots at Air Route Traffic Control Centers, which manage and guide traffic at higher altitudes between airports. \"What we did yesterday was routine; this has happened thousands and thousands of times over the course of decades in America,\" Duffy said. \"These issues don't happen, which begs the ", "date_str": " nth seeing if Malta could be a potential forever home. Unfortunately, it wasn't a match for me, but it had so much going for it that I decided to try its charming sister island, Gozo. Gozo lies a few miles northwest of Malta and belongs to the same archipelago. It's just 26 square miles (roughly the size of Manhattan) and home to around 40,000 people. I first visited Gozo in 2012 and have returned a handful of times since then. On my most recent trip this September, I stayed in a gorgeous little villa in Xagħra, a small, historic town with a population of about 5,400. As much as I adore the Maltese island , my most recent trip there made me realize it might not be the perfect spot for me to retire. Gozo has great Mediterranean vibes and feels ideal for slow exploring Gozo has some incredible options for outdoor dining. Louise Slyth Gozo seemed to have many of the same draws as Malta, but with slightly fewer crowds and a slower pace of life. For one, English is widely spoken in both Malta and Gozo, which I appreciate. Gozo has lovely weather with about 300 days of sunshine a year and mostly mild temperatures. The island really does feel Mediterranean, with limestone buildings, beautiful churches, and endless sea views. It had a nice balance of rural beauty and bustling shops and eateries. People were friendly, the villages I've explored so far have all felt safe, and life seemed to move at an unhurried pace. The Visit Gozo website describes the island as \"developed just enough but not too much,\" which I think defines its charm. There are many things to see and do in Gozo, but the island didn't feel super aimed at tourists with a massive list of must-see attractions. Gozo has world-class diving, swimming at Ramla Bay, and leisurely boat rides along the coastline. T", "date_str": "2026-11-14T14:28:01+00:00", "hash": "c0e4dc467bf03e8a", "title_fa": "پس از رد کردن مالتا به عنوان مکانی برای بازنشستگی، زندگی در جزیره خواهر کوچکتر آن، گوزو را آزمایش کردم.", "summary_fa":  of five siblings Liderina/Getty Images I grew up as the youngest of five kids, and our parents relied on strict routines to manage us all. We each had assigned days for chores, cooking, walking the dog, and even sitting in the front seat. I used to resent all the rules, but now I appreciate the teamwork and patience they taught me. The ringing bell had the same effect as a break horn blowing in an industrial factory . Doors would slowly open along the corridor, and disheveled bodies stumbled out. At our house, 6:30 p.m. was dinner time. I can't remember when the bell was introduced, but it proved the most effective way to call five young teenagers down to the kitchen to eat. Despite regularly being called the Brady Bunch when out in public (particularly when in a line on moving escalators), five kids is actually quite a convenient number. Five weekdays were perfect for each person to have an allocated day for duties: to cook, to walk the dog, even to sit in the front seat of the car (an honor every teenager in the early 00s fought for). I'm the youngest, and so my day was Friday, which was a clear injustice because I was convinced I had to wait longer than everyone else. We all had a job to do Five children and two adults meant eating dinner was \"feeding time at the zoo,\" according to my dad. Yes, there was a one-serving-only policy in place, and messy plates were inevitable, but once we finished eating, we became a well-oiled machine. Someone collected the dirty dishes, someone washed up, someone dried, someone put items away, and someone cleaned the table. I remember an adult family friend joining us for dinner one evening, their eyes widening as we all stood in sync to start our jobs, rolled up our sleeves, and discussed the unfair compensation. The author was the youngest of five kids. Courtesy of the author We'd mumble that one day we'd form a union . Birthdays had a similar efficiency. In the morning, the person celebrating would have breakfast , then wait  کردیم، تبدیل به ماشینی شدیم که به خوبی روغن کاری شده بود. یکی ظرف های کثیف را جمع کرد، یکی شست، یکی خشک کرد، یکی وسایل را کنار گذاشت و دیگری میز را تمیز کرد. به یاد", "image_url": "https://i.insider.com/6ae8a386f3bee449b3d2a2bf?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۳ آبان • ۱۷:۵۵"}, {"source": "Business Insider", "title": "A woman on the cruise ship struck by a tanker said the riverboat started filling with water like the 'Titanic'", "link": "https://www.businessinsider.com/new-orleans-cruise-ship-riverboat-tanker-collision-passengers-2026-11", "summary": "Tamara Carrasco, a retired elementary school teacher from Atlanta, was on the ship when it was struck. Blake Paterson A riverboat was struck by a tanker in New Orleans on Friday, causing the ship to tip over and sink. Tamara Carrasco said the collision knocked her to the floor and water gushed into the ship. \"What was going through my mind was: we're going to die,\" she said. Tamara Carrasco was in the dining room of the American Heritage cruise ship , docked in the Port of New Orleans, when she spotted a tanker heading straight toward them. Carrasco, a retired elementary school teacher from Atlanta, was seated at a table by the windows so she could look out at the Mississippi River . She saw the tanker crossing under the bridge nearby and noticed it was lowering its anchor. \"I thought, 'Why would they be anchoring here?'\" she said. Her friend turned to her: \"It's not stopping. It's going to hit us.\" Carrasco was skeptical, until she saw the crew running across the tanker's deck \"like ants.\" \"What was going through my mind was: We're going to die,\" she said. The tanker, Atlantic Asphalt, crashed directly into the American Cruise Lines riverboat on Friday, causing the ship to topple over and sink as passengers rushed to evacuate. Several people ended up in the river and had to be pulled out by first responders. Of the nearly 200 people on board, 32 were transported to hospitals. None were critically injured, officials said. \"We have zero people unaccounted for, which truly is a miracle on the Mississippi,\" New Orleans Mayor Helena Moreno said at a press conference. Carrasco, 65, said when the tanker approached the riverboat , she ran to the opposite end to get as far away from the glass windows as possible. She found a nook on the other end of the ship where she braced herself. \"It hit so hard I flew to the ground,\" she said. The American Heritage riverboat toppled over after being struck by the Atlantic Asphalt tanker in New Orleans. Gerald Herbert/AP After the collision, she ran to the stairwell in the middle of the boat and could see into the dining room. The tanker, she said, had broken through the glass windows and water was pouring in. \"Seen the movie 'Titanic'? There was a big gash and water is flying in, and I said, 'Oh, this is going down,'\" she said. She ran up to the next floor and exited the cruise ship usinga gangplank. The crowd gathering on dry land was in shock. Carrasco said it was like after 9/11. \"We're all just kind of wandering in a daze", "date_str": "2026-11-14T14:18:21+00:00", "hash": "b8c225d85cc562ae", "title_fa": "یک زن در کشتی تفریحی که توسط یک تانکر مورد اصابت قرار گرفته است، گفت: قایق رودخانه مانند تایتانیک شروع به پر شدن از آب کرد.", "summary_fa": "تامارا کاراسکو، معلم بازنشسته مدرسه ابتدایی از آتلانتا، در کشتی بود که تصادف کرد. بلیک پترسون روز جمعه یک قایق رودخانه ای در نیواورلئان مورد اصابت یک تانکر قرار گرفت که باعث واژگونی و غرق شدن کشتی شد. تامارا کاراسکو گفت که برخورد او را به زمین زد و آب به داخل کشتی ریخت. او گفت: \"آنچه در ذهن من می گذشت این بود: ما خواهیم مرد.\" تامارا کاراسکو در اتاق ناهار خوری کشتی کروز هریتیج آمریکایی که در بندر نیواورلئان لنگر انداخته بود، یک نفتکش را دید که مستقیماً به سمت آنها می رفت. کاراسکو، معلم بازنشسته مدرسه ابتدایی از آتلانتا، پشت میزی کنار پنجره ها نشسته بود تا بتواند به رودخانه می سی سی پی نگاه کند. او تانکری را دید که از زیر پل در همان نزدیکی عبور می کرد و متوجه شد که لنگر خود را پایین می آورد. او گفت: \"من فکر کردم، \"چرا آنها باید اینجا لنگر بیاندازند؟\" دوستش رو به او کرد: \"قطع نمی شود. به ما ضربه می زند.\" کاراسکو مشکوک بود، تا اینکه دید خدمه از روی عرشه نفتکش «مثل مورچه» می دویدند. او گفت: \"آنچه در ذهن من می گذشت این بود: ما خواهیم مرد.\" نفتکش آتلانتیک آسفالت روز جمعه مستقیماً با قایق رودخانه آمریکن کروز لاین سقوط کرد و باعث شد کشتی واژگون شود و در حالی که مسافران برای تخلیه عجله داشتند کشتی غرق شود. چند نفر به رودخانه ختم شدند و نیروهای امدادی مجبور شدند آنها را بیرون بکشند. از حدود 200 سرنشین هواپیما، 32 نفر به بیمارستان منتقل شدند. به گفته مقامات، هیچ یک به شدت آسیب ندیده است. هلنا مورنو، شهردار نیواورلئان در یک کنفرانس مطبوعاتی گفت: \"ما هیچ نفری داریم که از آنها خبری نیست، که واقعاً یک معجزه در می سی سی پی است.\" کاراسکو 65 ساله گفت وقتی تانکر به قایق رودخانه", "image_url": "https://i.insider.com/6af7cf770cc3ffba8779d27f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۳ آبان • ۱۷:۴۸"}, {"source": "Business Insider", "title": "I watched Jensen Huang speak 9 days before his resignation. Two things stand out now.", "link": "https://www.businessinsider.com/jensen-huang-nvidia-management-succession-conference-talk-2026-11", "summary": "Jensen Huang in San Francisco on Nov. 3 without his famous leather jacket. Alistair Barr/Business Insider A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . Nine days before Jensen Huang resigned as Nvidia CEO, I sat near the front row at a San Francisco conference and watched him discuss the future of AI. Two things struck me that day. Both seem more significant now. First, Huang wasn't wearing his famous black leather jacket . Instead, as you can see in the photo I took, he wore a dark fabric zip-up. At the time, I thought it was funny. His jacket had become such a recognizable part of his image that seeing him without it was a bit jarring. Now, with revelations about his extramarital affairs and allegations involving a possible Chinese spy , I wonder whether the wardrobe change meant something. The initial allegations were already public by November 3. Of course, that's hindsight talking. Maybe a jacket is just a jacket. The second thing was more consequential. Fireworks AI CEO Lin Qiao (left) interviewing Jensen Huang at the startup s conference in San Francisco on Nov. 3, 2026. Alistair Barr/Business Insider Near the end of the conversation, Fireworks AI CEO Lin Qiao asked Huang about his unusual management style. He had 60 executives reporting directly to him . Huang explained that he'd designed this structure more than 30 years ago, when personal computers and email were transforming business. Rather than a traditional hierarchy, he wanted information flowing freely among executives empowered to make decisions. Then came the obvious question: What should a company's leadership structure look like in the AI age? \"I don't know the answer to that,\" Huang replied. At the time, I thought that was a bit odd. Nvidia is leading the AI revolution and Jensen leads Nvidia. Wouldn't he be thinking of how best to run this company in the future? Today, that exchange seems especially relevant. With Huang gone, Nvidia faces an extraordinary succession challenge . Sixty direct reports may have worked brilliantly under its founder. But it also means there isn't an obvious deputy to take the reins. If he'd had two or three direct reports, those people would have had more experience with more responsibility. But 60 direct reports, by definition, means that each one of those execs only had a small piece of Nvidia to oversee. Does this mean Nvidia is doomed? I'm not sure. The way Je", "date_str": "2026-11-14T14:00:01+00:00", "hash": "26b42fd391ba603e", "title_fa": "من سخنرانی جنسن هوانگ را 9 روز قبل از استعفا تماشا کردم. دو چیز در حال حاضر برجسته است.", "summary_fa": "", "image_url": "https://i.insider.com/6af67723cbe2120470735066?width=1200&format=jpeg", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۳ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "We sold our house and nearly everything we owned to move our kids to Malta. Parenting is different here.", "link": "https://www.businessinsider.com/moved-family-delaware-malta-parenting-differences-2026-11", "summary": "The author moved his family from the US to Malta. Courtesy of the author My wife and I had dreamed of raising our two kids abroad after learning about worldschooling. When our daughter's school introduced active shooter drills in kindergarten, we decided to leave. We moved to Malta, where our kids feel safe and experience new cultures and history every day. In the fall of 2024, our local school district in Delaware moved the mandatory ALICE drills to start in kindergarten, my daughter's year at the time. These are intense quarterly drills where the school simulates a shooting, training children to hide in case of an active shooting. My wife and I had talked about world schooling before this, and had a lot of discussions about what would work for our family. We decided it was time for our family to leave. We moved to Malta In April, 2025, following four months of intense paperwork, my son and I arrived in Malta as part of the digital nomad approval process. We had never set foot on the islands and honestly knew very little about the country we'd chosen based on internet research. We were there to secure a rental and finalize the paperwork. And two months later, my full family of four had sold nearly every possession, including our house and car. We boarded a plane, with just suitcases in hand. The author says parenting in Malta is different to parenting in the US. Courtesy of the author Life in Malta is very different. And by extension, parenting here is different too. Malta is a tiny archipelago between Sicily and Tunisia. The bulk of the population, including us, lives on the island of Malta, which is a densely populated stretch that feels like a city-state. The country's population is only a bit over 500,000, but 5 million tourists pass through annually, mostly in the summer. To some, Malta is a cruise stop. To others, a party destination. It is a country that is remarkably young: having just celebrated its 50 th anniversary of independence from Britain. And it is a land that is deeply, deeply old. The second-oldest human freestanding structures are Neolithic temples here on the island. History and modernity combine in every direction. Parenting in Malta feels different As a parent, the most obvious difference comes in a feeling of safety. I never worry when my kids are at school. Everywhere we've been on the island, whether at a local festa, a beach, or a historic site, we've found many other children, and my kids have made many friends. And for a small", "date_str": "2026-11-14T13:54:01+00:00", "hash": "7433d40566e711e7", "title_fa": "خانه و تقریباً هر چیزی که داشتیم را فروختیم تا بچه هایمان را به مالت منتقل کنیم. فرزندپروری در اینجا متفاوت است.", "summary_fa": "نویسنده خانواده خود را از ایالات متحده به مالت نقل مکان کرد. با حسن نیت از نویسنده من و همسرم رویای بزرگ کردن دو فرزندمان را در خارج از کشور پس از یادگیری در مورد مدرسه جهانی در سر داشتیم. وقتی مدرسه دخترمان تمرینات تیراندازی فعال را در مهدکودک معرفی کرد، تصمیم گرفتیم آن را ترک کنیم. ما به مالتا نقل مکان کردیم، جایی که بچه‌های ما احساس امنیت می‌کنند و هر روز فرهنگ‌ها و تاریخ جدیدی را تجربه می‌کنند. در پاییز 2024، منطقه مدرسه محلی ما در دلاور، تمرینات اجباری ALICE را برای شروع در مهدکودک، سال دخترم در آن زمان، منتقل کرد. این‌ها تمرین‌های سه ماهه شدیدی هستند که در آن مدرسه تیراندازی را شبیه‌سازی می‌کند و به کودکان آموزش می‌دهد که در صورت تیراندازی فعال پنهان شوند. من و همسرم قبل از این در مورد تحصیل در جهان صحبت کرده بودیم و بحث های زیادی در مورد اینکه چه چیزی برای خانواده ما مفید است، داشتیم. تصمیم گرفتیم که وقت آن است که خانواده مان بروند. ما به قه در کشورهای شرکت کننده و همچنین در کانال رسمی یوتیوب یوروویژن پخش شد. اعضای EBU TVP (لهستان)، رادیو Sveriges (سوئد)، Kan (اسرائیل) و SBS (استرالیا) نیز این مسابقه را پخش کردند که توسط ستاره های تلویزیون تایلندی وودی میلینتاچیندا و سیندی بیشاپ میزبانی شد. علاوه بر کشورهای رقیب، سوپراستار تایلندی جف ساتور در کنار برنده یوروویژن امسال، دارا، که با آهنگ \"Bangaranga\" مقام اول بلغارستان را در مسابقه ماه مه کسب کرد، اجرا کرد. این نمایش که شامل اجرای ویژه افتتاحیه به مناسبت شهر میزبان بود، توسط Voxovation و S20 Productions مستقر در بانکوک تهیه شد. توسط Zoop حمایت مالی شد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/eurovision-winner.jpg?w=594&#038;h=396&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۴ آبان • ۰۱:۳۷"}, {"source": "Billboard", "title": "The Latin Recording Academy Celebrates Leading Ladies of Entertainment & More Uplifting Moments", "link": "https://www.billboard.com/music/latin/latin-grammy-leading-ladies-entertainment-uplifting-moments-1236382250/", "summary": "From career milestones and new music releases to major announcements and those little, important moments, Billboard editors highlight uplifting moments in Latin music. Here’s what happened in the Latin music world this week. The Latin Recording Academy Celebrates Its Leading Ladies of Entertainment The Latin Recording Academy celebrated its 2026 Leading Ladies of Entertainment this week during Latin Grammy Week in Las Vegas. This year’s honorees were María Fernández, chief operating officer of Sony Music Entertainment Latin Iberia; Sandra Jiménez, regional director and head of music for Latin America and U.S. Latin at YouTube; Salomé Limón, a five-time Latin Grammy-winning producer, songwriter and sound engineer; and six-time Latin Grammy winner María Rosa García, the Spanish singer-songwriter better known as Niña Pastori. Related Karol G Surprises Mexico City Fans With Thalía as Special Guest: The First Person I Wanted to Be 5 Things You Didn’t See on TV at the 2026 Latin Grammys Who Is Sara Schell, The Newcomer Who Won Songwriter of the Year at the 2026 Latin Grammys? “Life has given me so much more than I ever dreamed or imagined — so many recognitions and so much love from the public and my colleagues, that I truly feel very loved by them,” Pastori said upon receiving her recognition. “Thank you to the Academy, to [its CEO] Manuel [Abud], to my fellow awardees Salomé, María, Sandra. It is a privilege to share this day with you.” Held on Tuesday (Nov. 10), the event included appearances by artists such as Erika Ender and Leslie Grace, as well as other distinguished female executives in the industry. Jesús López Named Honorary Academician by the Spanish Music Academy Jesús López, chairman and CEO of Universal Music Latin America Iberian Peninsula, has been named the 2026 Honorary Academician by the Spanish Music Academy, a distinction that recognizes his contributions to the development of artists, the transformation of the recording industry, and the international projection of Spanish-language music, according to a press release. López, whose work contributed to the rise of Spanish music legends such as Mecano, Radio Futura, Raphael, Joaquín Sabina and Joan Manuel Serrat, received the honor during the first edition of the Honorary Academicians ceremony. The award was presented by Antonio Guisasola, Treasurer of the board of directors of the Spanish Music Academy and president of AGEDI and PROMUSICAE. The event took place on Nov. 6 at the Teatro Real in", "date_str": "2026-11-14T21:25:03+00:00", "hash": "4ae682960b8e83cc", "title_fa": "آکادمی ضبط لاتین از بانوان برجسته سرگرمی و لحظات نشاط آور بیشتر تجلیل می کند", "summary_fa": "از نقاط عطف شغلی و انتشار موسیقی جدید گرفته تا اطلاعیه های مهم و آن لحظات مهم و کوچک، ویراستاران بیلبورد لحظات نشاط آور در موسیقی لاتین را برجسته می کنند. این چیزی است که این هفته در دنیای موسیقی لاتین اتفاق افتاد. آکادمی ضبط لاتین بانوان برجسته سرگرمی خود را جشن می گیرد آکادمی ضبط لاتین این هفته در هفته گرمی لاتین در لاس وگاس، بانوان پیشرو 2026 خود را جشن گرفت. برگزیدگان امسال ماریا فرناندز، مدیر عامل Sony Music Entertainment Latin Iberia بودند. ساندرا جیمنز، کارگردان منطقه ای و سرپرست موسیقی آمریکای لاتین و لاتین ایالات متحده در یوتیوب؛ سالومه لیمون، تهیه کننده، ترانه سرا و صدابردار پنج بار برنده جایزه گرمی لاتین. و ماریا روزا گارسیا برنده شش بار گرمی لاتین، خواننده و ترانه سرای اسپانیایی که بیشتر با نام نینا پاستوری شناخته می شود. کارول جی با تالیا به عنوان مهمان ویژه طرفداران مکزیکوسیتی را غافلگیر کرد: اولین شخصی که می‌خواستم باشم 5 چیز که در گرمی لاتین 2026 در تلویزیون ندیدید سارا شل کیست، تازه واردی که برنده بهترین ترانه سرای سال در گرمی لاتین 2026 شد؟ پاستوری پس از دریافت تقدیرنامه گفت: «زندگی خیلی بیشتر از چیزی که تا به حال در رویا یا تصورش بودم به من داده است - آنقدر به رسمیت شناخته شده و عشق زیادی از طرف مردم و همکارانم که واقعاً احساس می‌کنم مورد علاقه آنها هستم.» از آکادمی، [مدیرعامل آن] مانوئل [آبود]، از دیگر برندگان جوایز سالومه، ماریا، ساندرا سپاسگزارم. شریک شدن در این روز با شما یک افتخار است.» این رویداد که در روز سه‌شنبه (10 نوامبر) برگزار شد، شامل حضور هنرمندانی مانند اریکا اندر و لزلی گریس و همچنین سایر مدیران برجسته زن در این صنعت بود. ژسوس لوپز توسط آکادمی موسیقی اسپانیا به عنوان آکادمی افتخاری انتخاب شد خسوس لوپز، رئیس و مدیر عامل یونیورسال", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Latin-Grammys-2026-Leading-Ladies-of-Entertainment-gettyimages.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۴ آبان • ۰۰:۵۵"}, {"source": "Billboard", "title": "‘Grand Theft Auto VI’ Soundtrack: See the Full 34-Song Tracklist", "link": "https://www.billboard.com/music/music-news/gta-6-album-tracklist-grand-theft-auto-vi-soundtrack-1236382244/", "summary": "With Grand Theft Auto VI just days away from its release, fans are getting their first look at the long-awaited video game s all-star soundtrack. Photos and videos of the vinyl edition of Grand Theft Auto VI: The Album have su ه من افتخار می کنم، دست کم گرفتن قرن است. بهترین آخر هفته در بزرگ &#x1F34E; با این مادران داغ که لیاقت کمی R R را داشتند. این گردهمایی در میان گپ و گفت های آنلاین زیادی در مورد احتمال مشارکت باند اصلی در راه اندازی مجدد Ryan Murphy's Glee که ماه گذشته توسط Disney+ و Hulu سفارش داده شده بود، رسید. مورفی گفته است که حدود 10 نفر از بازیگران اصلی برای شرکت در این فیلم تماس گرفته اند. کریس کولفر، بازیگر نقش کرت هومل در سریال اصلی فاکس، اخیراً گفت‌وگوی خوبی درباره بازگشت احتمالی خود داشته است. داستان های مرتبط اخبار کریس کولفر در مکالمه درباره Glee Reboot، جوک ها او برمی گردد اگر آقای Schue Sue اخبار WAP را اجرا کند هری شوم جونیور. ددلاین اخیرا تایید کرده است که میشل در حال مذاکره برای تکرار نقش‌ها در سریال Glee Revival Crazy Rich Asians: می‌خواهد راهی پیدا کند تا کار کند. ددلاین تأیید کرده است که هیدر موریس، بازیگران Glee، بازیگر نقش بریتانی، و آکورد اورستریت، بازیگر نقش سام ایوانز، نیز در حال مذاکره برای ریبوت هستند. در ددلاین تماشا کنید", "image_url": "https://deadline.com/wp-content/uploads/2026/11/glee_50536b-e1794688270566.jpg?w=808", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۴ آبان • ۰۰:۴۴"}, {"source": "Deadline", "title": "‘Being Heumann’ Star Ruth Madeley And Casting Team On Championing Diversity Onscreen – Contenders L.A.", "link": "https://deadline.com/2026/11/being-heumann-ruth-madeley-casting-team-interview-1237224010/", "summary": "Ruth Madeley recognized some of her own experiences in Judy Heumann’s story, including the indignity of being called a fire hazard. “The amount of times I’ve been called a fire hazard, it’s going to be the name of my autobiography. I’m telling you, it’s the perfect title,” Madeley said at Deadline’s Contenders Film Los Angeles. [ ]", "date_str": "2026-11-14T21:05:55+00:00", "hash": "6103604e533d8309", "title_fa": "روث مادلی ستاره «Being Heumann» و تیم بازیگری در قهرمانی تنوع روی صفحه - Contenders L.A.", "summary_fa": "روث مادلی برخی از تجربیات خود را در داستان جودی هیومن تشخیص داد، از جمله اهانت به نام خط e": "۱۱ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
