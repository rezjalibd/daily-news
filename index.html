نیومی در جلو و پنج‌اتصالی تقویت‌شده در عقب به همراه فنرهای تطبیقی FSD است."}, {"source": "Zoomit", "title": "آیا ممکن است سیاره زهره قمر خودش را بلعیده باشد؟", "link": "https://www.zoomit.ir/space/466978-did-venus-eat-its-own-moon/", "summary": "پژوهشگران با انجام مجموعه‌ای از شبیه‌سازی‌ها به این نتیجه رسیده‌اند که زهره درصورت داشتن قمر، نمی‌توانست آن را به‌صورت پایدار در مدار خود حفظ کند.", "date_str": "2026-09-11T20:50:00+00:00", "hash": "15ec0a513903c4df", "title_fa": "آیا ممکن است سیاره زهره قمر خودش را بلعیده باشد؟", "summary_fa": "پژوهشگران با انجام مجموعه‌ای از شبیه‌سازی‌ها به این نتیجه رسیده‌اند که زهره درصورت داشتن قمر، نمی‌توانست آن را به‌صورت پایدار در مدار خود حفظ کند. تبلیغات دانشمندان شاید سرانجام دلیل بی‌قمر بودن زهره ، سیاره همزاد زمین را پیدا کرده باشند. براساس یافته‌های جدید، داغ‌ترین سیاره منظومه شمسی ممکن است خودش قمر طبیعی‌اش را از بین برده یا عبارت دقیق‌تر، «بلعیده» باشد. زهره به‌دلیل اندازه، جرم، ترکیب سنگی و فاصله‌اش از خورشید ، اغلب همزاد زمین نامیده می‌شود؛ اما این دو سیاره تفاوت‌های چشمگیری هم دارند. دمای سوزان زهره با توانایی ذوب سرب، فشار سطحی فوق‌العاده زیاد، بادهای شدید و پرسرعت و ابرهای اسید سولفوریک، از جمله مهم‌ترین تفاوت‌های زمین و زهره هستند. بااین‌حال، شاید کلیدی‌ترین تفاوت که از فاصله دور نیز به چشم می‌خورد این است که زمین همراهی دائمی به نام ماه دارد، درحالی‌که زهره فاقد قمر است. در واقع، تنها سیاره‌های منظومه شمسی که قمر ندارند، زهره، دومین سیاره از خورشید، و عطارد ، نزدیک‌ترین سیاره به خورشید هستند. کپی لینک سیاره فاقد قمر دانشمندان از سال‌ها پیش درباره این پرسش بحث می‌کنند که آیا زهره از ابتدا بدون قمر بوده یا اینکه زمانی قمر داشته و به‌نحوی آن را از دست داده است. اکنون گروهی از پژوهشگران شاید به پاسخ این پرسش رسیده و سرنوشت احتمالی قمری فرضی را که زمانی به دور زهره می‌چرخیده، مشخص کرده باشند. استیون کین، پژوهشگر دانشگاه کالیفرنیا ریورساید و سرپرست گروه پژوهشی به اسپیس‌دات‌کام گفت : «من همیشه مجذوب شکل‌گیری و تکامل قمرها در منظومه شمسی، به‌ویژه زهره بوده‌ام؛ زیرا پژوهش من بر تکامل این سیاره و احتمال سکونت‌پذیری آن در گذشته متمرکز است. زهره همزاد زمین است و هر دو تقریباً از نظر اندازه، جرم و ترکیب یکسان هستند. بااین‌حال، زمین یک ماه بزرگ دارد، درحالی‌که زهره اصلاً قمر ندارد؛ حتی یک قمر کوچک به‌دام‌افتاده هم ندارد."}, {"source": "Zoomit", "title": "تویوتا از یک مشکل مهم در ۱۰ هزار دستگاه از خودروهای C-HR خبر داد", "link": "https://www.zoomit.ir/car/466965-toyota-chr-ev-recall-software/", "summary": "تویوتا حدود ۱۰ هزار دستگاه کراس‌اوور برقی C-HR مدل ۲۰۲۶ را به‌دلیل احتمال یک نقص مهم فراخواند.", "date_str": "2026-09-11T19:40:00+00:00", "hash": "62be484fe6a6fa60", "title_fa": "تویوتا از یک مشکل مهم در ۱۰ هزار دستگاه از خودروهای C-HR خبر داد", "summary_fa": "تویوتا حدود ۱۰ هزار دستگاه کراس‌اوور برقی C-HR مدل ۲۰۲۶ را به‌دلیل احتمال یک نقص مهم فراخواند. تبلیغات تویوتا حدود ۱۰ هزار دستگاه خودرو تمام‌برقی تویوتا C-HR مدل ۲۰۲۶ را در سطح جهان فراخواند . کارشناسان فنی متوجه شده‌اند که نقصی در سیستم نرم‌افزاری ترمز احیاکننده می‌تواند انتقال قدرت به چرخ‌ها را در حین رانندگی ناگهان قطع کند. نزدیک‌به ۱٬۳۱۰ دستگاه از خودروهای تحت‌تاثیر در کشور کانادا تردد می‌کنند. این اختلال زمانی رخ می‌دهد که باتری کششی شارژ بالایی دارد و راننده از ترمز احیاکننده برای کاهش سرعت یا بازیابی انرژی دارد. نرم‌افزار کنترل خودرو در این وضعیت ممکن است اجازه ورود شارژی بیش از ظرفیت مجاز را صادر کند. سامانه محافظت از مدار الکتریکی در واکنش به اضافه‌شارژ وارد عمل می‌شود و برای ایمنی، کل پیشرانه را غیرفعال می‌سازد تا از آسیب به سلول‌ها جلوگیری کند. نقص مذکور ناشی از سلول‌های باتری یا موتورها نیست، بلکه به خطای محاسباتی واحد کنترل الکترونیکی خودرو مربوط می‌شود. خودرو خاموش نمی‌شود اما کاهش ناگهانی شتاب و از دست رفتن نیروی پیشران در اتوبان‌ها یا هنگام سبقت، ریسک وقوع تصادف‌های سنگین را بالا می‌برد. مدل برقی C-HR بر پایه‌ی پلتفرم e-TNGA مشترک با مدل‌های سری bZ، لکسوس RZ و سوبارو سولتررا توسعه یافته است. نمایندگی‌های رسمی فرایند به‌روزرسانی نرم‌افزاری بخش کنترل باتری را به‌صورت رایگان برای مالکان انجام می‌دهند."}, {"source": "Zoomit", "title": "تعمیر یکی از مدل‌های اپل واچ سری ۱۲ حتی از اولترا ۴ هم پرهزینه‌تر است", "link": "https://www.zoomit.ir/wearables/466992-apple-watch-series-12-ceramic-repair-costs/", "summary": "تعمیر مدل سرامیکی اپل واچ سری ۱۲ بدون اشتراک خدمات پس از فروش، هزینه‌ای بالا برای کاربران دارد.", "date_str": "2026-09-11T19:10:00+00:00", "hash": "c612a8084a1d41e9", "title_fa": "تعمیر یکی از مدل‌های اپل واچ سری ۱۲ حتی از اولترا ۴ هم پرهزینه‌تر است", "summary_fa": "قیمت ساعت هوشمند جدید اپل در مدل‌های سرامیکی سری ۱۲ به ۸۹۹ دلار می‌رسد. مدل اولترا ۴ برچسب قیمتی پایه‌ی ۷۹۹ دلاری را یدک می‌کشد."}, {"source": "Zoomit", "title": "بدون کدام اندام‌ها همچنان می‌توان به زندگی ادامه داد؟", "link": "https://www.zoomit.ir/health-medical/466266-living-without-organs-human-body/", "summary": "خارج کردن آپاندیس شاید رایج‌ترین نوع بیرون آوردن عضو از بدن باشد، اما بدن انسان توانایی شگفت‌آوری در کنار آمدن با حذف اعضای دیگر نیز دارد.", "date_str": "2026-09-11T19:00:00+00:00", "hash": "02d7603d103c99ff", "title_fa": "بدون کدام اندام‌ها همچنان می‌توان به زندگی ادامه داد؟", "summary_fa": "خارج کردن آپاندیس شاید رایج‌ترین نوع بیرون آوردن عضو از بدن باشد، اما بدن انسان توانایی شگفت‌آوری در کنار آمدن با حذف اعضای دیگر نیز دارد. تبلیغات بدن انسان برای ادامه‌ی زندگی به همه‌ی اجزای خود به یک اندازه وابسته نیست. بعضی اندام‌ها را می‌توان به‌طور کامل برداشت، بخشی از برخی دیگر را می‌توان از دست داد و در مواردی نیز تجهیزات پزشکی می‌توانند موقتاً جای عملکرد یک عضو حیاتی را بگیرند. بااین‌حال، «زنده ماندن بدون یک اندام» لزوماً به معنای زندگی بدون پیامد یا درمان دائمی نیست. نمونه‌ای مشهور از توانایی بدن برای سازگاری، ماجرای آرون رالستون، کوهنورد آمریکایی است. در سال ۲۰۰۳، بازوی او هنگام کوهنوردی بین تخته‌سنگ‌ها گیر افتاد و پس از پنج روز مجبور شد برای نجات جانش بخشی از دست خود را قطع کند ؛ داستانی که بعدها فیلم «۱۲۷ ساعت» براساس آن ساخته شد. قطع عضو بدون مراقبت پزشکی می‌تواند به‌دلیل خون‌ریزی شدید و عفونت کشنده باشد. اما اگر فرد به‌موقع درمان شود، بدن در بسیاری از موارد می‌تواند خود را با شرایط جدید تطبیق دهد. درد فانتوم، یعنی احساس درد یا ناراحتی در عضوی که دیگر وجود ندارد ، یکی از عوارض نسبتاً شایع پس از قطع عضو است. اما توانایی بدن برای سازگاری فقط به دست و پا محدود نمی‌شود. بعضی از اندام‌های داخلی نیز در شرایط خاص می‌توانند از بدن خارج شوند. کپی لینک آپاندیس؛ عضوی که نبودنش معمولاً دردسرساز نیست محل قرارگیری آپاندیس در سیستم گوارش. برخی از اندام‌های بدن را می‌توان بدون به خطر افتادن مستقیم زندگی، به‌طور کامل یا جزئی برداشت"}, {"source": "Zoomit", "title": "فینیاس فیشر؛ هکری که شرکت‌های جاسوس‌افزار را هک کرد و هرگز دستگیر نشد", "link": "https://www.zoomit.ir/human-science/466964-phineas-fisher-spyware-hacker-featured/", "summary": "فینیاس فیشر چطور بدون ردپا، بزرگ‌ترین شرکت‌های جاسوس‌افزار جهان را زمین‌زد؟ روایتی جذاب از نفوذ، افشاگری و ناپدید شدن یک شبح واقعی.", "date_str": "2026-09-11T18:30:00+00:00", "hash": "f75ff912dd0a1c23", "title_fa": "فینیاس فیشر؛ هکری که شرکت‌های جاسوس‌افزار را هک کرد و هرگز دستگیر نشد", "summary_fa": "فینیاس فیشر چطور بدون ردپا، بزرگ‌ترین شرکت‌های جاسوس‌افزار جهان را زمین‌زد؟ روایتی جذاب از نفوذ، افشاگری و ناپدید شدن یک شبح واقعی. تبلیغات شامگاه پنجم جولای ۲۰۱۵، نام حساب توییتری شرکتی ایتالیایی Hacking Team به Hacked Team تغییر کرد و کمی بعد از همان حساب لینکی منتشر شد که آرشیو ۴۰۰ گیگابایتی اطلاعات داخلی شرکت را برای دانلود در دسترس مخاطبان می‌گذاشت. شرکت هکینگ تیم از میلان به دولت‌ها و سازمان‌های امنیتی ابزار نفوذ می‌فروخت. مشتریان پول می‌دادند تا به تلفن یا کامپیوتر فرد دیگری راه پیدا کنند و ارتباطاتش را زیر نظر بگیرند. حالا ایمیل‌ها، پرونده‌ی مشتریان و اسناد مالی خودِ شرکت روی اینترنت در اختیار همگان بود. کپی لینک خلاصه صوتی خلاصه صوتی، ساخته‌شده با هوش مصنوعی مهاجم آگاهانه حساب توییتری رسمی شرکت را برای اعلام هک انتخاب کرد، زیرا هرکسی که برای بررسی خبر به صفحه‌ی هکینگ تیم سر می‌زد، به همان فایل‌هایی می‌رسید که شرکت می‌خواست از دسترس خارجشان کند. چهره‌ی پشت این حمله‌ی غافلگیرکننده، به گروه یا سازمان خاصی وابسته نبود و خودش را با نام مستعار Phineas Fisher معرفی می‌کرد. کسانی که اخبار جاسوس‌افزارها را دنبال می‌کردند، این اسم را از ماجرای سال قبل می‌شناختند؛ از حمله‌ای به یکی دیگر از شرکت‌های بزرگ بازار نظارت که فیشر حتی نامش را هم از محصول همان شرکت قرض گرفته بود."}, {"source": "Zoomit", "title": "چنین روزی در فضا؛ ۲۵ سال پیش تنها فضانورد ناسا از حادثه ۱۱ سپتامبر عکاسی کرد", "link": "https://www.zoomit.ir/space/466976-25-years-ago-nasa-astronaut-captured-9-11-attacks/", "summary": "درجریان حملات ۱۱ سپتامبر، فرانک کالبرتسن، تنها فضانورد آمریکایی حاضر در مدار زمین، تصویری تکان‌دهنده از ستون دود برخاسته از شهر نیویورک ثبت کرد.", "date_str": "2026-09-11T18:10:00+00:00", "hash": "ef27bd02d0c3ca77", "title_fa": "چنین روزی در فضا؛ ۲۵ سال پیش تنها فضانورد ناسا از حادثه ۱۱ سپتامبر عکاسی کرد", "summary_fa": "درجریان حملات ۱۱ سپتامبر، فرانک کالبرتسن، تنها فضانورد آمریکایی حاضر در مدار زمین، تصویری تکان‌دهنده از ستون دود برخاسته از شهر نیویورک ثبت کرد. تبلیغات عکس نمادین مقاله که به دست یک فضانورد آمریکایی از داخل ایستگاه فضایی بین‌المللی (ISS) ثبت شده است، ردی طولانی از دود غلیظ را نشان می‌دهد که در پی حملات ۱۱ سپتامبر، در سرتاسر شهر نیویورک گسترده شد. یک‌ربع قرن بعد، این تصویر همچنان به همان اندازه تکان‌دهنده و هولناک است. صبح ۱۱ سپتامبر ۲۰۰۱، اعضای گروه تروریستی القاعده چهار هواپیمای مسافربری را ربودند و دو فروند از آن‌ها را به برج‌های دوقلو کوبیدند؛ دو آسمان‌خراش ۱۱۰ طبقه‌ای که در قلب مجموعه مرکز تجارت جهانی در بخش جنوبی منهتن قرار داشتند. این برخوردها که با فاصله‌ی زمانی تقریباً ۱۷ دقیقه از یکدیگر رخ دادند، در نهایت باعث فروریختن هر دو ساختمان شدند. کمی پس از برخورد هواپیمای دوم به برج‌ها، سومین هواپیمای ربوده‌شده به ساختمان پنتاگون، مقر وزارت دفاع ایالات متحده در آرلینگتون ویرجینیا برخورد کرد. حمله دیگری که احتمالاً هدفش واشینگتن دی‌سی بود، زمانی ناکام ماند که مسافران هواپیمای چهارم با هواپیماربایان درگیر شدند و در نتیجه هواپیما در نزدیکی شنکسویل پنسیلوانیا سقوط کرد. براساس آمار موزه و یادبود ۱۱ سپتامبر، در مجموع ۲٬۹۷۷ نفر در این مجموعه حملات جان باختند. فرانک کالبرستن، فضانورد ناسا و فرمانده وقت ایستگاه فضایی بین‌المللی، تنها آمریکایی بود که هنگام وقوع حملات ۱۱ سپتامبر در خارج از زمین حضور داشت. اندکی پس از آنکه کالبرستن از اتفاقات رخ‌داده در کشورش مطلع شد، ایستگاه فضایی از فراز نیویورک عبور کرد. او سپس از ارت : "سامسونگ از فروش هر دستگاه آیفون دوئو ۲۵۰ دلار درآمد به جیب می‌زند!", "link": "https://www.zoomit.ir/mobile/467031-samsung-apple-foldable-display-deal-iphone-duo/", "summary": "اپل برای تأمین پنل تاشو آیفون دوئو به سامسونگ تکیه کرده است و ظاهرا هر پنل حدود ۲۵۰ دلار قیمت دارد.", "date_str": "2026-09-11T16:28:06+00:00", "hash": "a7bb2b879eebe0df", "title_fa": "سامسونگ از فروش هر دستگاه آیفون دوئو ۲۵۰ دلار درآمد به جیب می‌زند!", "summary_fa": "اپل برای تأمین پنل تاشو آیفون دوئو به سامسونگ تکیه کرده است و ظاهرا هر پنل حدود ۲۵۰ دلار قیمت دارد. تبلیغات گزارشی غیر رسمی از یک قرارداد انحصاری میان سامسونگ دیسپلی و اپل خبر می‌دهد؛ توافقی که مسیر تأمین نمایشگرهای تاشو برای آیفون دوئو و نسل‌های بعدی گوشی‌های تاشو اپل را مشخص می‌کند. حساب کاربری Instant Digital در شبکه‌ی اجتماعی ویبو مدعی شده که این قرارداد به مدت سه سال بسته شده و سامسونگ دیسپلی در همین چارچوب، پنل‌های تاشوی مورد نیاز اپل را به‌صورت انحصاری تأمین خواهد کرد. هر پنل ۲۵۰ دلار برای اپل هزینه دارد و این یعنی با تولید هر دستگاه آیفون دوئو، ۲۵۰ دلار به خزانه‌ی سامسونگ واریز می‌شود؛ آن هم بدون در نظر گرفتن سایر قطعاتی که سامسونگ ممکن است در تأمین آن‌ها نقش داشته باشد. آیفون دوئو نخستین دستگاهی است که از پنل‌های سری M16 OLED سامسونگ استفاده می‌کند. این پنل تازه قرار است روشنایی بالاتر، عملکرد رنگ بهتر، عمر بیشتر و بهره‌وری انرژی بالاتری نسبت به نسل‌های قبلی OLED به همراه داشته باشد. قرارداد سه‌ ساله با سامسونگ دیسپلی، در عمل می‌تواند زنجیره‌ی تأمین اپل را برای چند نسل آینده تثبیت کند. در بازار تاشوها، همین نوع توافق‌ها گاهی به‌اندازه‌ی خود محصول اهمیت دارند، چون ظرفیت تولید، کیفیت یکنواخت و زمان‌بندی عرضه را تحت تأثیر قرار می‌دهند."}, {"source": "Zoomit", "title": "مدیر ارتباطات مایکروسافت پس از تقریبا ۲۰ سال این شرکت را ترک می‌کند", "link": "https://www.zoomit.ir/business/467030-frank-shaw-leaves-microsoft-communications/", "summary": "فرانک شا، چهره‌ی باسابقه‌ی مایکروسافت، از این شرکت جدا می‌شود. او به‌مدت تقریبا ۲۰ سال مدیر ارشد ارتباطات بود.", "date_str": "2026-09-11T16:22:00+00:00", "hash": "bf66c5be68543ae9", "title_fa": "مدیر ارتباطات مایکروسافت پس از تقریبا ۲۰ سال این شرکت را ترک می‌کند", "summary_fa": "فرانک شا، چهره‌ی باسابقه‌ی مایکروسافت، از این شرکت جدا می‌شود. او به‌مدت تقریبا ۲۰ سال مدیر ارشد ارتباطات بود. تبلیغات فرانک شا ، مدیر ارشد ارتباطات مایکروسافت، این شرکت را ترک می‌کند ؛ تغییری که یکی از چهره‌های قدیمی و شناخته‌شده‌ی بخش رسانه‌ای مایکروسافت را از صحنه‌ی داخلی کنار می‌زند و نشان می‌دهد که بازآرایی در لایه‌های ارتباطی شرکت ادامه دارد. فرانک شا سال‌ها یکی از نام‌های محوری در مدیریت پیام‌رسانی عمومی، پاسخ‌گویی رسانه‌ای و شکل‌دهی به روایت رسمی مایکروسافت بود و خروجش در مقطعی رخ می‌دهد که شرکت‌های بزرگ فناوری بیش از گذشته زیر ذره‌بین افکار عمومی و نهادهای نظارتی قرار دارند. نقش شا فقط به نوشتن بیانیه یا هماهنگی با خبرنگاران محدود نمی‌شد. او در سال‌های پرتنشِ صنعت فناوری، در خط مقدم ارتباطات بحران، معرفی محصولات، واکنش به انتقادها و تنظیم لحن رسمی مایکروسافت حضور داشت. رفتن او، فارغ از جزئیات جانشینی، برای تیمی که به ثبات پیام و کنترل روایت وابسته است، یک جابه‌جایی مهم به‌شمار می‌آید. بخش ارتباطات در شرکت‌های فناوری فقط یک واحد پشتیبانی نیست؛ بلکه جایی است که تصمیم‌های محصولی، تجاری و حقوقی به زبان عمومی ترجمه می‌شوند. در چنین ساختاری، تغییر مدیر ارشد ارتباطات می‌تواند بر سرعت پاسخ‌گویی، لحن رسمی و حتی هماهنگی داخلی اثر بگذارد. مایکروسافت حالا باید بدون یکی از چهره‌های قدیمی خود، توازن تازه‌ای در این حوزه پیدا کند. خروج شا در ادامه‌ی روندی دیده می‌شود که بسیاری از شرکت‌های بزرگ فناوری طی آن، تیم‌های ارتباطی و مدیریتی خود را بازچینش کرده‌اند. فشارهای رسانه‌ای، تغییر انتظارات عمومی و حساسیت‌های نظارتی باعث شده‌اند نقش مدیران ارتباطات از همیشه پررنگ‌تر باشد."}, {"source": "Zoomit", "title": "چرخ فالکرک چگونه کشتی‌ها را با انرژی ۸ کتری جابه‌جا می‌کند؟", "link": "https://www.zoomit.ir/engineering/466690-how-falkirk-wheel-lift-works/", "summary": "چرخ فالکرک در اسکاتلند با بهره‌گیری از قانون ارشمیدس و حفظ تعادل، شناورها را در ارتفاع ۳۵ متری با مصرف تنها ۱٫۵ کیلووات‌ساعت برق جابه‌جا می‌کند.", "date_str": "2026-09-11T16:20:00+00:00", "hash": "a1cfd3497129d23d", "title_fa": "چرخ فالکرک چگونه کشتی‌ها را با انرژی ۸ کتری جابه‌جا می‌کند؟", "summary_fa": "چرخ فالکرک در اسکاتلند با بهره‌گیری از قانون ارشمیدس و حفظ تعادل، شناورها را در ارتفاع ۳۵ متری با مصرف تنها ۱٫۵ کیلووات‌ساعت برق جابه‌جا می‌کند. تبلیغات در اسکاتلند سازه‌ای وجود دارد که در نگاه اول بیشتر شبیه یک مجسمه‌ی عظیم فلزی به‌نظر می‌رسد تا وسیله‌ای برای جابه‌جایی کشتی‌ها. «چرخ فالکرک» یک بالابر چرخشی کشتی در نزدیکی شهر فالکرک است که دو کانال آبی Forth Clyde و Union را به هم متصل می‌کند. این سازه در سال ۲۰۰۲ به بهره‌برداری رسید و اختلاف ارتفاع حدود ۳۵ متری میان دو کانال را در چند دقیقه جبران می‌کند. پیش از ساخت چرخ فالکرک، برای جابه‌جایی شناورها میان دو کانال از مجموعه‌ای شامل ۱۱ قفل آبی استفاده می‌شد. عبور از این مسیر زمان‌بر بود و نیاز به باز و بسته‌کردن تعداد زیادی دروازه داشت. راهکار جدید این بود که تمام این مسیر عمودی در قالب یک سازه‌ی چرخان جمع شود؛ سازه‌ای که حدود ۱۰۰۰ تن فولاد در ساختش به‌کار رفت و وزن کل چرخ و تجهیزاتش به حدود ۱۸۰۰ تن می‌رسد. زومیت لایک اما بخش شگفت‌انگیز ماجرا فقط ابعاد چرخ نیست؛ مسئله این است که چگونه چنین سازه‌ی سنگینی می‌تواند با انرژی بسیار کمی حرکت کند. راز اصلی در تعادل آن نهفته است. چرخ فالکرک دو محفظه‌ی بزرگ یا «گوندولا» دارد که در دو سوی محور قرار گرفته‌اند. هر محفظه در حالت عادی مقدار مشخصی آب را در خود نگه می‌دارد و زمانی که یک قایق وارد آن می‌شود، طبق اصل ارشمیدس، به اندازه‌ی وزن قایق آب از محفظه خارج می‌شود. در نتیجه وزن کل محفظه تقریباً ثابت می‌ماند؛ چه قایق داخل آن باشد و چه نباشد. به همین دلیل دو طرف چرخ تقریباً همیشه در تعادل قرار دارند. برای به‌حرکت‌درآوردن سازه، موتورهای هیدرولیکی لازم نیستند با وزن ۱۸۰۰ تن مقابله کنند؛ آن‌ها عمدتاً باید بر اصطکاک و نیروهای ناشی از حرکت غلبه"}, {"source": "Zoomit", "title": "مشخصات و تصاویر لنوو گوگل‌بوک ۱۵ لو رفت؛ از نمایشگر اولد تا فناوری تشخیص چهره", "link": "https://www.zoomit.ir/laptop/467029-lenovo-googlebook-15-full-specs-leak/", "summary": "مشخصات فاش‌شده‌ی لنوو گوگل‌بوک ۱۵، از عرضه‌ی محصولی خبر می‌دهند که به نمایشگر اولد و فناوری تشخیص چهره مجهز است.", "date_str": "2026-09-11T16:16:39+00:00",  انتخاب مردم بالا گرفته است. تبلیغات آدام موسری ، رئیس اینستاگرام، در میانه‌ی بحثی تازه درباره‌ی حق انتخاب کاربران، صریح‌تر از همیشه از فید سنتی فاصله گرفت و گفت تجربه‌ی آن «خیلی بدتر» از فید الگوریتمی است. منظور از فید سنتی، نمایش پست‌ها به ترتیب زمان انتشار است. موسری با اشاره به بازگشت به فید زمانی گفت «میانگین تجربه‌ی کاربر بسیار بدتر می‌شود» و توضیح داد که در چنین حالتی، حجم محتوای منتشرشده از سوی شرکت‌ها، برندها و ناشران فضا را پر می‌کند . او افزود سازندگان محتوا زیر فشار پست‌های بیشتر گم می‌شوند، دوستان هم حتی بیشتر به حاشیه می‌روند و کاربر بخش قابل‌توجهی از محتوا را از دست می‌دهد. جمله‌ی کلیدی او فقط درباره‌ی تجربه‌ی کاربر نبود. لایه‌ی پنهان‌تر ماجرا به اقتصاد توجه برمی‌گردد؛ جایی که نظم زمانیِ ساده، لزوما به نفع شبکه‌های اجتماعی نیست. در فید زمانی، هر حساب فعال‌تر می‌تواند سهم بیشتری از دیده‌شدن بگیرد و همین موضوع برای اینفلوئنسرها، کسب‌وکارها و ناشران مزیت می‌سازد. موسری گفته است که هنگام بازگشت به فید زمانی، نرخ تعامل تا ۵۰ درصد افت می‌کند. چنین عددی، اگر در مقیاس پلتفرمی دیده شود، توضیح می‌دهد چرا اینستاگرام سال‌ها است فید الگوریتمی را گزینه‌ی پیش‌فرض نگه داشته است. کاربران می‌توانند امروز هم به فید زمانی بروند، اما برنامه هر بار که باز می‌شود دوباره به‌طور پیش‌فرض به فید الگوریتمی برمی‌گردد. هم‌زمان، استرالیا در حال بررسی قانونی است که به کاربران اجازه می‌دهد از ماهیت الگوریتمی شبکه‌های اجتماعی انصراف بدهند. اینستاگرام پیش‌تر هم با مقرراتی مشابه کنار آمده؛ از جمله در هلند، جایی که قانون، حق انتخاب را برای کاربر الزامی کرده بود. نتیجه فعلا روشن است. مسیر قانونی در یک سو، منطق محصول در سوی دیگر."}, {"source": "Zoomit", "title": "فرضیه پسر پرهزینه؛ تولد نوزادان نر احتمالاً برای مادران خطرناک‌تر است", "link": "https://www.zoomit.ir/health-medical/466883-difficult-male-births-mammalian-evolution/", "summary": "داده‌های زایمان ۱۴۰ گونه پستاندار، از جمله انسان، نشان می‌دهد مادران هنگام به دنیا آوردن نوزادان پسر با خطر بیشتری در معرض زایمان دشوار قرار دارند.", "date_str": "2026-09-11T15:40:00+00:00", "hash": "071f911142680adc", "title_fa": "فرضیه پسر پرهزینه؛ تولد نوزادان نر احتمالاً برای مادران خطرناک‌تر است", "summary_fa": "داده‌های زایمان ۱۴۰ گونه پستاندار، از جمله انسان، نشان می‌دهد مادران هنگام به دنیا آوردن نوزادان پسر با خطر بیشتری در معرض زایمان دشوار قرار دارند. تبلیغات یکی از مهم‌ترین پیامدهای تکاملی راه‌رفتن روی دو پا در انسان، پدیده‌ای موسوم به معضل زایمان است. نوزاد انسان با مغز بزرگ و در نتیجه سر نسبتاً بزرگ باید از لگنی عبور کند که به‌دلیل سازگاری با راه‌رفتن دوپایی، نسبتاً باریک است. سال‌ها تصور می‌شد همین تضاد میان نیاز به مغز بزرگ و لگن مناسب برای راه‌رفتن عمودی، زایمان انسان را در مقایسه با سایر پستانداران به فرایندی دشوار و طاقت‌فرسا تبدیل کرده است. بااین‌حال، پژوهش‌های جدید سادگی این توضیح را زیر سؤال برده‌اند و حتی نشان داده‌اند که چنین پدیده‌ای شاید منحصر به انسان نباشد. به‌گزارش ساینس ، پژوهشگران در مطالعه‌ای تازه، عامل دیگری را نیز به معضل زایمان اضافه کرده‌اند: جنسیت جنین. آن‌ها با بررسی داده‌های زایمان در ۱۴۰ گونه استدلال می‌کنند که در بسیاری از پستانداران، از جمله انسان و نیاکان باستانی‌اش، تولد نوزادان نر برای مادر دشوارتر از تولد نوزادان ماده است. البته خطر ممکن است از نظر تکاملی با مزیتی جبران شود: نوزادان نر بزرگ‌تر، می‌توانند در بزرگسالی نیز جثه بزرگ‌تری داشته باشند و نرهای بزرگ‌تر معمولاً فرصت بیشتری برای جفت‌گیری پیدا می‌کنند و در نتیجه، فرزندان بیشتری خواهند داشت. بنابراین، ژن‌های بیشتری از مادر می‌تواند به نسل‌های بعد منتقل شود. هر روز حدود ۷۰۰ نفر در سراسر جهان هنگام زایمان جان خود را از دست می‌دهند. یکی از عوامل اصلی مرگ‌ومیر، زایمان انسدادی است؛ این وضعیت اغلب زمانی رخ می‌دهد که سر نوزاد از اندازه‌ی مجرای زایمان بزرگ‌تر باشد. حتی زایمان‌های موفق نیز به حرکات پیچیده‌ای از سوی جنین نیاز دارند تا بتواند از مسیر باریک رحم به دنیای بیرون عبور کند. نوزادان معمولاً در حالی وارد لگن می‌شوند که بدنشان به پهلو قرار گرفته است و"}, {"source": "Zoomit", "title": "بازی GTA 6 به تنهایی بازار کنسول‌ها را تکان می‌دهد", "link": "https://www.zoomit.ir/gaming/466960-gta-6-console-sales-revenue-newzoo-report/", "summary": "یک مؤسسه‌ی ناظر بر بازار می‌گوید GTA 6 صرفا یک بازی ساده نیست و می‌تواند مسیر فروش کنسول‌ها را هم عوض کند.", "date_str": "2026-09-11T15:15:00+00:00", "hash": "e69890499a15248a", "title_fa": "بازی GTA 6 به تنهایی بازار کنسول‌ها را تکان می‌دهد", "summary_fa": "یک مؤسسه‌ی ناظر بر بازار می‌گوید GTA 6 صرفا یک بازی ساده نیست و می‌تواند مسیر فروش کنسول‌ها را هم عوض کند."}, {"source": "Business Insider", "title": "I secretly emailed my son for 15 years. On his 18th birthday, I finally gave him the password.", "link": "https://www.businessinsider.com/gmail-account-son-childhood-memories-digital-time-capsule-2026-9", "summary": "The author started emailing her son when he was 3. Courtesy of the author I created a Gmail account for my oldest son when he was 3. For 15 years, I emailed big milestones and tiny moments I didn't want to forget. When he turned 18, I gave him the password to his digital childhood archive. When my eldest son was a little boy, I did something that felt quietly monumental in the moment and slightly ridiculous — I created a Gmail account in his name. He was 3 years old. Far too young to know what email was, let alone care about it. My BlackBerry (yes, I had a BlackBerry , it was 2010) probably looked more like something he could play games on. At that stage of life, his interests were vast but often limited to dinosaurs, Duplo, bouncy balls, and snacks. Lots of snacks. There was also him asking \"why?\" approximately 275 times an hour. But I had the vague sense that childhood moved too quickly and that memories — especially the small ones — had a way of dissolving if you didn't trap them somehow. I was also pregnant with his twin brothers , so preserving what I could of his \"only child\" status was important ahead of such a big change. So I opened the account and wrote him his first email. I wrote down things I didn 't want to forget The plan was simple. Over the years, whenever something happened that I didn't want to forget, I would write to him. When he turned 18, I would hand over the password and let him open the whole archive at once. A digital time capsule , except instead of artifacts, it would contain the messy, funny, sentimental observations of a mother trying to keep up with a growing boy. I assumed I would write occasionally. It would be fun. Instead, I wrote a lot. The big moments were easy. The first time he caught a ball. It was at a kid's birthday party at a sports gym. That earned a lengthy email complete with my highly technical analysis of the play (\"you ran very fast and didn't drop the ball and everyone started yelling!\"). Birthdays, school milestones, and the various phases of childhood enthusiasm — dinosaurs, sharks, Bigfoot, Sesame Street — each found their way into the inbox. The author wanted to remember the little everyday things when her oldest son was a toddler. Courtesy of the author But over time, I discovered that the emails I liked writing the most were about the smaller things. Sometimes they contained only a sentence or two. One afternoon, I wrote about how the sun hit his hair as I looked back at him in his car seat. It caugh", "date_str": "2026-09-12T13:47:01+00:00", "hash": "ad26fa68096ea751", "title_fa": "15 سال مخفیانه به پسرم ایمیل زدم. در تولد 18 سالگی اش بالاخره رمز را به او دادم.", "summary_fa": "نویسنده از زمانی که پسرش 3 ساله بود شروع به ایمیل زدن کرد. با حسن نیت نویسنده من برای بزرگترین پسرم در 3 سالگی یک حساب جیمیل ایجاد کردم. به مدت 15 سال، نقاط عطف بزرگ و لحظات کوچکی را که نمی خواستم فراموش کنم ایمیل می کردم. وقتی 18 ساله شد، رمز آرشیو دیجیتال دوران کودکی اش را به او دادم. وقتی پسر بزرگم پسر کوچکی بود، کاری انجام دادم که در آن لحظه بی سر و صدا به نظر می رسید و کمی مضحک بود - یک حساب جیمیل به نام او ایجاد کردم. او 3 ساله بود. خیلی جوان تر از آن است که بداند ایمیل چیست، چه رسد به اینکه به آن اهمیت بدهد. بلک بری من (بله، من یک بلک بری داشتم، سال 2010 بود) احتمالاً بیشتر شبیه چیزی بود که می توانست با آن بازی کند. در آن مرحله از زندگی، علایق او بسیار گسترده بود، اما اغلب به دایناسورها، دوپلو، توپ های پرنده و تنقلات محدود می شد. تنقلات زیاد. او نیز وجود داشت که می پرسید \"چرا؟\" تقریباً 275 بار در ساعت اما من این حس مبهم را داشتم که دوران کودکی خیلی سریع گذشت و خاطرات - به خصوص خاطرات کوچک - اگر به نحوی آنها را به دام نیندازید راهی برای حل شدن دارند. من همچنین از برادران دوقلوی او باردار بودم، بنابراین حفظ آنچه می توانستم از وضعیت \"تک فرزند\" او قبل از چنین تغییر بزرگی مهم بود. بنابراین حساب را باز کردم و اولین ایمیلش را برایش نوشتم. چیزهایی را یادداشت کردم که نمی خواستم فراموش کنم طرح ساده بود. در طول این سال ها، هر وقت اتفاقی می افتاد که نمی خواستم فراموشش کنم، برایش نامه می نوشتم. وقتی 18 ساله شد، رمز را تحویل می دادم و اجازه می دادم یکباره کل آرشیو را باز کند."}, {"source": "Business Insider", "title": "I went from earning $173,000 a year to making $6 one month. I don't regret quitting.", "link": "https://www.businessinsider.com/quit-six-figure-tech-job-self-employment-career-break-2026-9", "summary": "Heigi Jeong quit her corporate job to create content. Courtesy of Heigi Jeong Heigi Jeong earned about $173,000 as a product designer and generally worked 40 hours a week. She wasn't burned out, but a book deal and content career made her question staying in her stable job. She gave herself one year to pursue self-employment before deciding whether to return to corporate work. This as-told-to essay is based on a conversation with Heigi Jeong . It has been edited for length and clarity. People often assume that I quit my six-figure job in product design because of severe burnout or an existential crisis, but that wasn't the case. I moved from Korea to Toronto in 2020 as an in-house product designer for a tech company , often creating mobile apps and websites. The paycheck was great — I was making about $173,000 to do a job that allowed me to have a fairly healthy work-life balance . I wasn't working 80 hours per week. Most weeks, I clocked about 40 hours, working mostly 9 to 5. Since my income was more than enough to live on, I was also able to travel when I had time off, never needing to worry about money or budgets. I decided to quit my job While I wouldn't say I loved the work, I liked it. The job was about making logical decisions, and then convincing stakeholders of my decisions through storytelling. It was my dream job as an immigrant, and it was sustainable. I could have carried on working it, but I had also been doing content creation on the side and had just signed a book deal. There weren't enough hours in the day to do all three. It would have been like having three full-time jobs. Heigi Jeong was anxious about leaving her full time job and paycheck. Courtesy of Heigi Jeong Debating which one to let go of, I decided to quit the most stable of the three — product design . Writing a book was very important to me, and I knew content creation would support the promotion of the book. But I was hesitant to abandon my only employed source of work. The thought was really scary. I remember having so much anxiety in the weeks leading up to my resignation in June 2026. Was it a mistake to leave a consistent paycheck in the middle of economic uncertainty? Would I be able to re-enter the market should I change my mind? I'm working for myself for a year I made a deal with myself to try and quell the anxiety that this was a permanent decision. For one year, I'd work for myself — pursuing content creation and book writing — and then I'd decide if I wanted to go ", "date_str": "2026-09-12T12:32:01+00:00", "hash": "c84bd5573d5a689f", "title_fa": "من از درآمد 173000 دلار در سال به 6 دلار در ماه رسیدم. من از ترک پشیمان نیستم", "summary_fa": "Heigi Jeong شغل شرکتی خود را برای تولید محتوا ترک کرد. با حسن نیت از Heigi Jeong Heigi Jeong حدود 173000 دلار به عنوان طراح محصول درآمد داشت و به طور کلی 40 ساعت در هفته کار می کرد. او فرسوده نشده بود، اما یک معامله کتاب و حرفه محتوا باعث شد که او در شغل ثابتش بماند. او قبل از تصمیم گیری برای بازگشت به کار شرکتی، یک سال به خود فرصت داد تا به دنبال شغل آزاد برود. این مقاله گفته شده بر اساس گفتگو با هیگی جونگ است. برای طول و وضوح ویرایش شده است. مردم اغلب تصور می کنند که من شغل شش رقمی خود را در طراحی محصول به دلیل فرسودگی شدید یا بحران وجودی رها کردم، اما اینطور نبود. من در سال 2020 از کره به تورنتو نقل مکان کردم و به عنوان یک طراح محصول داخلی برای یک شرکت فناوری، اغلب برنامه‌ها و وب‌سایت‌های موبایل ایجاد می‌کردم. دستمزد عالی بود - من حدود 173000 دلار درآمد داشتم تا کاری را انجام دهم که به من اجازه داد تعادل نسبتاً سالمی بین کار و زندگی داشته باشم. 80 ساعت در هفته کار نمی کردم. بیشتر هفته‌ها، حدود 40 ساعت کار می‌کردم و بیشتر 9 تا 5 کار می‌کردم. از آنجایی که درآمد من برای زندگی کافی بود، می‌توانستم زمانی که مرخصی داشتم به مسافرت بروم و هرگز نیازی به نگرانی در مورد پول یا بودجه نداشتم. تصمیم گرفتم کارم را رها کنم در حالی که نمی گویم کار را دوست دارم، اما آن را دوست داشتم. کار تصمیم گیری منطقی و سپس متقاعد کردن سهامداران به تصمیماتم از طریق داستان سرایی بود. این شغل رویایی من به عنوان یک مهاجر بود و پایدار بود. می‌توانستم به کارش ادامه بدهم، اما در کنار هم تولید محتوا را انجام می‌دادم و به تازگی یک قرارداد کتاب"}, {"source": "Business Insider", "title": "My family of 4 visits the same vacation spot multiple times a year. I hope my kids look back on it fondly.", "link": "https://www.businessinsider.com/family-visits-same-vacation-spot-multiple-times-year-2026-9", "summary": "The author and her family vacation in the Catskills multiple times a year. Courtesy of Lindsay Karp When I was young, my family used to go to the Jersey Shore. I look back on those trips fondly. After becoming parents, my husband and I started our own family tradition. We found a vacation spot that's perfect for our family. When I was a child, the Jersey Shore was my magical place. My great-grandmother, her siblings, and a few other relatives lived there in a high-rise apartment building, so every summer we'd visit for a week. Looking out from the balcony, I believed the ocean went on forever. On the bottom floor, the community pool brought children together in carefree, summer bliss. At the beach, my brother and I used our boogie boards like 16-year-olds with fresh permits, owning the waves until sunset. I built sandcastles while he dug a never-ending hole to China, and we devoured peanut butter and jelly sandwiches that somehow tasted superior in the salty air. At night, the boardwalk signs lit up the sky, and Kohr Bros soft serve always hit the spot. As a kid, there was nowhere else I'd rather be. When we became parents, we started taking our own summer trips After our kids were born, my husband and I started a Jersey Shore tradition of our own. We filled our SUV with duffel bags, sand buckets, and shovels, and every gadget needed to take toddlers away. Our boys enjoyed the beach — and it triggered a sweet nostalgia for me — but hauling the kids and all the gear across the sand was tiring, only for the sun to wear them out quickly, and the heat weakened my body with multiple sclerosis (MS). After eight years of annual beach getaways — when my boys were 9 and 6 — we switched gears completely. My husband is an avid hiker, and living with chronic illness , I yearned to get away from the hustle and bustle. A higher elevation provides a drier, cooler atmosphere, which helps keep my symptoms at bay. So, our summer family vacation shifted to the Catskill Mountains. Only a three-hour drive from our home, it was equally as accessible as the beach. We found a place to go that works for our family From the moment we arrived for our first trip in the summer of 2020, I felt like we were at our second home. It was a great place to spend some of those early pandemic months, offering a beautiful change of scenery while also allowing us to keep our distance from others. We thought it was the perfect COVID-era getaway, but the instant we returned home, we couldn't wait t", "date_str": "2026-09-12T12:19:01+00:00", "hash": "8a62ee9f4ca5bf25", "title_fa": "خانواده من 4 نفره چندین بار در سال از یک مکان تعطیلات دیدن می کنند. امیدوارم بچه هایم با محبت به آن نگاه کنند.", "summary_fa": "نویسنده و خانواده اش چندین بار در سال تعطیلات خود را در Catskills می گذرانند. با حسن نیت لیندسی کارپ وقتی جوان بودم، خانواده‌ام به ساحل جرسی می‌رفتند. من با علاقه به آن سفرها نگاه می کنم. پس از پدر و مادر شدن، من و شوهرم سنت خانوادگی خود را شروع کردیم. ما مکانی برای تعطیلات پیدا کردیم که برای خانواده ما مناسب است. وقتی بچه بودم، ساحل جرسی مکان جادویی من بود. مادربزرگ من، خواهر و برادرهایش و چند تن دیگر از اقوام آنجا در یک ساختمان بلندمرتبه زندگی می‌کردند، بنابراین هر تابستان برای یک هفته به آنجا می‌رفتیم. وقتی از بالکن به بیرون نگاه کردم، باور کردم که اقیانوس برای همیشه ادامه دارد. در طبقه پایین، استخر اجتماع بچه ها را در شادی تابستانی و بی دغدغه گرد هم می آورد. در ساحل، من و برادرم مانند افراد 16 ساله با مجوزهای تازه از تابلوهای بوگی خود استفاده می کردیم و تا غروب آفتاب مالک امواج بودیم. من قلعه های شنی ساختم در حالی که او چاله ای بی پایان به چین حفر می کرد و ما ساندویچ های کره بادام زمینی و ژله ای را می خوردیم که به نوعی طعم آن در هوای شور برتر بود. در شب، تابلوهای پیاده‌روی روی تخته، آسمان را روشن می‌کردند و سرویس‌های نرم برادران کوهر همیشه در محل قرار می‌گرفت. در کودکی، جایی نبود که ترجیح دهم باشم. وقتی پدر و مادر شدیم، سفرهای تابستانی خود را شروع کردیم پس از به دنیا آمدن فرزندانمان، من و شوهرم سنت خودمان را در ساحل جرسی شروع کردیم. ما SUV خود را با کیسه‌های قایق، سطل‌های شن و بیل‌ها و هر وسیله‌ای که برای بردن کودکان نوپا لازم بود پر کردیم. پسران ما از ساحل لذت می بردند - و این باعث ایجاد یک نوستالژی شیرین برای من شد - اما بردن"}, {"source": "Business Insider", "title": "I let my 15-year-old fly home alone from Europe. It didn't go smoothly, but I'm still glad she earned the independence.", "link": "https://www.businessinsider.com/mom-let-teenage-daughter-fly-home-alone-europe-2026-9", "summary": "The author (right) allowed her teenage daughter to fly home from Spain by herself. Courtesy of Jamie Davis Smith When I booked an extended-family trip to Europe, my teenage daughter complained it was too long. I agreed to let her fly home early by herself, even though I was nervous and reluctant. She forgot her passport and faced delays, but she got home safely. Most summers, I try to pack in as much travel as possible with my kids. My children have dual citizenship , and it's important to me that they spend time in Europe and connect with their roots. I enjoy showing them the rest of the world, too. In past years, my kids have had fun traveling from Rome to Warsaw or Seoul to Tokyo. This summer, I planned on staying in Europe for nearly a month, making the most of our time by staying until the day before school started. I booked hotels and flights and excitedly told my kids the plan. But this year went a bit differently than expected. I allowed my teenage daughter to travel home alone. My daughter wasn't happy when she heard about my extended travel plans When my 11-year-old son learned we would be spending nearly a month in Europe, he was overjoyed. My 15-year-old daughter, however, was despondent. She wanted to spend time with her friends. Plus, she worried about meeting her school obligations , which include a leadership position in a school club and cross-country and track training. She begged me to cut the trip short. However, I wasn't willing to end my trip early. I had hard-to-get tickets to a Real Madrid soccer match for the last day of the trip. My son and I are both huge soccer fans , and I didn't want to miss the game. Desperate, my daughter started listing the meetings and practices she would miss if we stayed in Europe until just before school began. My daughter asked if she could fly home alone Unwilling to accept no for an answer, my daughter sprang into action. She didn't whine and complain. Instead, she researched whether she could fly home alone and presented me with the facts. She showed me that I could change her flight, booked with points, at no extra cost. She presented airline policies indicating that she was old enough to fly alone without paying an unaccompanied minor fee, and that there were no restrictions on American minors flying alone from Spain to the US. She also found a direct flight from Madrid to Washington, DC , which greatly reduced the chances of something going wrong. My daughter made a convincing case, and I relucta", "date_str": "2026-09-12T11:47:01+00:00", "hash": "567f728d6ff6f8a4", "title_fa": "من اجازه دادم پسر 15 ساله ام به تنهایی از اروپا به خانه برود. به آرامی پیش نرفت، اما من همچنان خوشحالم که او استقلال را به دست آورد.", "summary_fa": "نویسنده (راست) به دختر نوجوانش اجازه داد تا خودش از اسپانیا به خانه برود. با حسن نیت از جیمی دیویس اسمیت وقتی من یک سفر خانوادگی طولانی مدت به اروپا رزرو کردم، دختر نوجوانم شکایت کرد که خیلی طولانی است. با اینکه عصبی و بی میلی بودم، قبول کردم که خودش زودتر به خانه برود. پاسپورتش را فراموش کرد و با تاخیر مواجه شد، اما به سلامت به خانه رسید. بیشتر تابستان‌ها، سعی می‌کنم تا جایی که ممکن است با بچه‌هایم سفر کنم. فرزندان من تابعیت دوگانه دارند و برای من مهم است که در اروپا وقت بگذرانند و با ریشه های خود ارتباط برقرار کنند. من از نشان دادن بقیه جهان به آنها نیز لذت می برم. در سال های گذشته، بچه های من از سفر از رم به ورشو یا سئول به توکیو لذت برده اند. تابستان امسال، من قصد داشتم نزدیک به یک ماه در اروپا بمانم و با ماندن تا روز قبل از شروع مدرسه، بهترین استفاده را از وقتمان ببرم. هتل و پرواز رزرو کردم و با هیجان برنامه را به بچه هایم گفتم. اما امسال کمی متفاوت از آنچه انتظار می رفت گذشت. به دختر نوجوانم اجازه دادم تنها به خانه برود. وقتی پسرم 11 ساله فهمید که ما نزدیک به یک ماه را در اروپا خواهیم گذراند، خوشحال نشد. دختر 15 ساله ام اما ناامید بود. او می خواست با دوستانش وقت بگذراند. بعلاوه، او نگران انجام تعهدات مدرسه اش بود، که شامل موقعیت رهبری در یک باشگاه مدرسه و آموزش بین شهری و پیست می شود. او به من التماس کرد که سفر را کوتاه کنم. با این حال، حاضر نبودم سفرم را زودتر تمام کنم. من برای آخرین روز سفر بلیط بازی فوتبال رئال مادرید را به سختی تهیه کردم. من و پسرم هر دو طرفدار بزرگ فوتبال هستیم و نمی‌خواستم"}, {"source": "Business Insider", "title": "Moving from New York to Kentucky gave me an affordable life I love — and retiring at 55 is now on the table", "link": "https://www.businessinsider.com/a-longtime-east-coaster-enjoys-the-affordability-in-kentucky-2026-9", "summary": "Nick Lyktey went to Kentucky to fulfill a one-year working requirement, and stayed years later. Courtesy of Nick Lyktey New Yorker Nick Lyktey moved to Kentucky for work, thinking he'd only be there for one year. He ended up falling in love with Fort Wright, Kentucky, a suburb five miles outside Cincinnati. He says the state's relative affordability has helped him build a better financial future for his family. This as-told-to essay is based on a conversation with Nick Lyktey, 34, a New Yorker who grew up in Wantagh, on Long Island, but moved to Fort Wright, Kentucky, five miles outside Cincinnati. He now works as the chief of lab operations at Gravity Diagnostics and has lived in Kentucky for seven years. The following has been edited for length and clarity. I had a very set trajectory ever since the eighth grade; I knew what I wanted to do with my life. Every move I made was based on working for the FBI . I went to Penn State specifically because they have a really elite forensic science program where they have buildings on campus dedicated for crime scene analysis. Even going to graduate school at Indiana University, that eliminated needing a larger amount of job experience required to get into the FBI . After graduate school, I talked to a contact at the FBI and they said, \"With your master's, you just need one year of work experience before you can be accepted into the special agent program.\" I'd always envisioned myself living on the East Coast . I liked growing up on Long Island. I didn't necessarily think I'd return to Long Island , but I wanted to be on the coast, and I think my familiarity with the East Coast would allow me to pick that over the West Coast. I was applying to a bunch of jobs eastward of Indiana, and I didn't hate the idea of being out this way. I felt like I had friends in different areas of the country, and the cost of living was great. I had a lot of good opportunities, and I narrowed down my job search to two companies, both in Kentucky. Lyktey at the Newport Aquarium with his wife and parents. Courtesy of Nick Lyktey When I went to visit the locations, I felt like this is somewhere I could live. My mindset was, \"I'm just going to be here for a year,\" so even if I'm not in love with the area right now, it's only a year, because ultimately I'm going to go to Quantico and go to bootcamp and then get placed somewhere else.\" My area of Kentucky is more suburban and less rural than I expected I didn't think Kentucky was going to be ", "date_str": "2026-09-12T11:40:01+00:00", "hash": "a55ba2c83a8a1ffe", "title_fa": "نقل مکان از نیویورک به کنتاکی به من زندگی مقرون به صرفه ای داد که دوست دارم - و بازنشستگی در 55 سالگی اکنون روی میز است.", "summary_fa": "نیک لیکتی به کنتاکی رفت تا شرایط کاری یک ساله را برآورده کند و سال ها بعد در آنجا ماند. نیک لیکتی نیویورکی نیک لیکتی برای کار به کنتاکی نقل مکان کرد، با این تصور که فقط یک سال آنجا خواهد بود. او در نهایت عاشق فورت رایت، کنتاکی، حومه ای در پنج مایلی سینسیناتی شد. او می گوید که مقرون به صرفه بودن نسبی ایالت به او کمک کرده تا آینده مالی بهتری برای خانواده اش بسازد. این مقاله گفته شده بر اساس گفتگو با نیک لیکتی، ۳۴ ساله، نیویورکی است که در وانتاگ، در لانگ آیلند بزرگ شد، اما به فورت رایت، کنتاکی، پنج مایلی خارج از سینسیناتی نقل مکان کرد. او اکنون به عنوان رئیس عملیات آزمایشگاه در Gravity Diagnostics کار می کند و به مدت هفت سال در کنتاکی زندگی کرده است. موارد زیر برای طول و وضوح ویرایش شده است. من از کلاس هشتم مسیر بسیار مشخصی داشتم. می دانستم که می خواهم با زندگیم چه کنم. هر حرکتی که انجام دادم بر اساس کار برای FBI بود. من به طور خاص به ایالت پن رفتم زیرا آنها یک برنامه علوم پزشکی قانونی واقعاً نخبه دارند که در آن ساختمان هایی در محوطه دانشگاه برای تجزیه و تحلیل صحنه جرم اختصاص داده شده است. حتی رفتن به مقطع تحصیلات تکمیلی در دانشگاه ایندیانا، نیاز به مقدار بیشتری از تجربه شغلی مورد نیاز برای ورود به FBI را از بین برد. بعد از فارغ التحصیلی، با یکی از مخاطبین FBI صحبت کردم و آنها گفتند: \"با مدرک کارشناسی ارشد، فقط به یک سال سابقه کار نیاز دارید تا بتوانید در برنامه مامور ویژه پذیرفته شوید.\" من همیشه خودم را در ساحل شرقی تصور می کردم. من دوست داشتم در لانگ آیلند بزرگ شوم. من لزوماً فکر نمی‌کردم به لانگ آیلند بازگردم، اما می‌خواستم در ساحل باشم"}, {"source": "Business Insider", "title": "Where to watch FIBA Women's Basketball World Cup: Live stream Spain vs. USA and more", "link": "https://www.businessinsider.com/guides/streaming/where-to-watch-fiba-womens-basketball-world-cup-2026-v2", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Team USA is looking to defend its title at the FIBA Women s Basketball World Cup. Marcin Golba/NurPhoto via Reuters Connect The short version: You can live stream games through HBO Max in the US, on select other broadcasters internationally, and via DAZN Courtside 1891 in many regions around the world. The Spain vs. USA semifinal game will live stream for free on RTVE Play . You can access your favorite streaming options from anywhere with a VPN . The FIBA Women's Basketball World Cup wraps up this weekend, and France, Germany, Spain, and the United States have all advanced to the semifinals. We've rounded up everything you need to know about where to watch the FIBA Women's World Cup, including global streaming options. The US women's team is looking to defend its title and win its fifth consecutive World Cup (a 12th World Cup title overall). France, Spain, and host Germany are all proving to be worthy adversaries, but only one team can come out on top on Sunday. Keep reading to learn how to tune into the four remaining games from anywhere. Where to watch the FIBA Women's Basketball World Cup US: TNT, truTV, TBS HBO Max (from $18.49/month) YouTube TV (free trial) International: DAZN Courtside 1891 (various, broadcast blackout restrictions apply) Spain: RTVE Play (FREE, Spain games) Access accounts sold, you won't have to wait much longer. Preorders open September 12 at 5 a.m. PT, ahead of the September 18 release date. Below you'll find the details on how to preorder the iPhone 18 Pro and Pro Max. Be sure to check out our guide to the latest on the new Apple Watch Series 12 preorders and Apple Watch Ultra 4 preorders for details on the smartwatches, or our breakdown on preordering the AirPods 5 preorders for the latest earbuds. How to preorder the iPhone 18 Pro and 18 Pro Max After going live on the Apple website on September 12, the newest iPhones will be up for preorder on carrier websites. To get your preorder locked in, simply head to the carrier of your choice (like Verizon or T-Mobile ), specify your preferred color and storage size, and check out. By opting for trade-in or a new carrier line, you can also score some discounts on your preorder. The best iPhone 18 Pro and Pro Max preorder deals Verizon: Get the iPhone 18 Pro for $80 a month by switching to a Simplicity Plan Verizon: Save up to $1,200 on the iPhone 18 Pro with an eligible trade-in by switching to Verizon myPlan or opening a new line Verizon: Get a free Apple Watch and iPad via 36 months of bill credit when you buy the iPhone 18 Pro and join a Simplicity or myPlan account. Verizon: Switch to a Verizon My Biz Plan and trade in an eligible device to get the iPhone 18 for free T-Mobile: Switch to an Experience Beyond plan, bring your own number, and trade in an eligible device to get a free iPhone 18 Pro Amazon What's new in the iPhone 18 Pro and 18 Pro Max? As someone who has been covering new smartphone releases for years, I can ", "date_str": "2026-09-12T11:30:01+00:00", "hash": "86caaad635d0b8e7", "title_fa": "بهترین پیشنهادات پیش خرید آیفون 18 پرو و ​​پرو مکس و مبادله", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید جدیدترین آیفون‌های پرو اپل اپل به‌طور رسمی وارد بازار شدند، و آیفون 18 پرو و ​​آیفون 18 پرو مکس با ning into big fights. After having a baby last summer, my husband and I realized something: by the time the house was quiet and our baby was asleep, neither of us had much energy left to talk about anything. We weren't fighting often, but little frustrations had a way of lingering because there never seemed to be a \"right\" time to bring them up. So, we decided to try a new weekly check-in ritual . We treat it like a physical for our relationship: It's a chance to celebrate what's working, catch small issues before they snowball, and make sure neither of us is quietly carrying resentment. So far, it's been the single most helpful habit we've adopted as a couple. We use the same questions every week Having a structured format works well for us. Instead of wasting time — \"What do you want to talk about?\" \"I don't know, what do you want to talk about?\" — we just run down our list, each taking turns to talk or listen. While it took some trial-and-error to find the questions that are most beneficial, here's the set we landed on: What made you feel loved this week? What's your biggest stressor looking ahead to next week? And what's one thing I can do to support you? What's one thing you're really looking forward to this week? What would make you feel connected to me this week? Is there anything we should talk about now before it becomes a bigger issue? Each question serves a different purpose. Asking the same questions each week helps keep them on track. Courtesy of Rebecca Strong The first question encourages us to acknowledge each other's efforts During a busy, stressful week, it can be easy to overlook the little things we both do to care for each other. But my husband and I made a vow never to take each other for granted. The first question — \"What made you feel loved this week?\" — offers a natural opportunity for us to express some gratitude . I might let my husband know how much it meant to me that he got up with the baby in the middle of the night. He might  a \"curse\" because people have to live their lives: \"What's the point of compounding if you're not around to see it?\" Stay in the game The veteran trader, who ran a hedge fund with \"The Black Swan\" author Nassim Taleb before starting Universa in 2007, recommended people focus on \"mitigating the big losses , not the little ones.\" \"It's not just that it kills you, but it goes down so much, it takes forever to crawl out,\" he said. He gave the example of an investor taking a 50% loss on a position, then having to make a 100% gain just to break even. Spitznagel championed the \" Kelly criterion ,\" a mathematical formula that can help investors correctly size their bets so they avoid catastrophic losses. He said it's more applicable for people to \"think about their life from a Kelly standpoint, rather than just a tail-hedging standpoint.\" \"You can't let your losses take you out of the game,\" he said. Humans and goats Writing has been one of the most common uses for AI tools like ChatGPT, but Spitznagel said he still expects the \" ability to express yourself", "date_str": "2026-09-12T10:32:01+00:00", "hash": "e0fd81b74be04b40", "title_fa": "مارک اسپیتزنگل، سرمایه‌گذار «قوی سیاه» می‌گوید باید در برابر فاجعه محافظت کنید - اما ریسک کنید", "summary_fa": "مارک اسپیتزناگل رئیس یونیورسا سرمایه گذاری است. بلومبرگ/گتی ایماژ یک سرمایه گذار «قوی سیاه» می گوید از خود در برابر فجایع محافظت کنید و در عین حال ریسک کنید. مارک اسپیتزناژل از یونیورسا گفت که شرط بندی با اعتقادات خود در عین اجتناب از ضررهای بزرگ ضروری است. او به BI گفت که هوش مصنوعی جایگزین برخی از مهارت های انسانی نخواهد شد و با علاقه در مورد بهترین سرمایه گذاری خود صحبت کرد. یک سرمایه‌گذار «قوی سیاه» می‌گوید در برابر بلایا محافظت کنید - اما ریسک کنید. مارک اسپیتزناگل حرفه خود را بر اساس محافظت از سبد مشتریان خود در برابر رویدادهای شدید، نادر و غیرقابل پیش بینی معروف به \"قوهای سیاه\" یا \"خطرات دم\" بنا کرده است. با این حال، مؤسس و رئیس یونیورسا اینوستمنت در این ماه با قهوه در لندن به Business Insider گفت که
