nd CEO, Maureen Kelly, calling on college students to apply to their summer internship program, and it sparked my interest. I've been posting videos on social media in both the beauty and comedy niches for years, but I thought I'd left that behind when I started college at Chapman University to pursue a more 'serious' career. I was double majoring in economics and public relations and figured Tarte would be a fun way to spend the summer after my sophomore year before turning to a more traditional business or finance path. I had one problem — I had no connections to Tarte, no family in the beauty industry, and no obvious way to stand out among thousands of applicants. In today's job market, especially for a sought-after position in beauty, it felt more likely I'd get struck by lightning than land an offer. When I submitted my application in January 2024, I knew I barely had a shot. This is where most applicants stop They repeat the process with hundreds of applications, hoping to win the lottery of landing an interview and, ultimately, an offer. I'm from Nebraska and attended school in Southern California. To be frank, going home for the summer was not an option. I didn't want to trade my glamorous coastal lifestyle for corn and county fairs. I couldn't rely on pure luck to be selected for an interview. I knew that if I could get in front of them, they would see how perfect I was for the role. I decided to make a video Since posting videos felt natural to me, I figured, what better way to show that I'm qualified for a marketing job at Tarte than by successfully marketing myself to Tarte. I decided to make something fun and entertaining. Inspired by the iconic Harvard admissions video from Legally Blonde, I created an \"Elle Woods-style\" application video . I showed Tarte that I was passionate about working for them, willing to put myself out there, and could actually do the job that I was applying for. I admit, it felt a little ridiculous. I knew that all my friends would see it, and that there was ", "date_str": "2026-10-19T09:05:01+00:00", "hash": "ba6561817fefc300", "title_fa": "من یک TikTok با الهام از «بلوند قانونی» پست کردم تا توجه یک مدیر عامل را جلب کنم. یک دوره کارآموزی برای من به ارمغان آورد که تبدیل به یک شغل تمام وقت شد.", "summary_fa": "ایزاک پرسکی. با حسن نیت از ایزاک پرسکی اسحاق پرسکی از یک ویدیوی خلاقانه برای کارآموزی در آرایشی و بهداشتی تارته در سال 2024 استفاده کرد. مورین کلی، مدیر عامل تارته، تحت تأثیر ویدیوی ایزاک قرار گرفت و به پیشنهاد کارآموزی او منجر شد. او برای دومین دوره کارآموزی تابستانی بازگشت و در ژوئن امسال یک موقعیت تمام وقت را آغاز کرد. زمانی که در کالج بودم، می‌خواستم یک دوره کارآموزی تابستانی در شهر نیویورک داشته باشم، به‌ویژه در یک شرکت: تارته لوازم آرایشی. مادرم ویدیویی از بنیانگذار و مدیر عامل تارته، مورین کلی، برایم فرستاد و از دانشجویان خواست تا برای برنامه کارآموزی تابستانی خود درخواست دهند و این باعث علاقه من شد. من سال‌ها در رسانه‌های اجتماعی ویدیوهایی در زمینه زیبایی و کمدی پست می‌کنم، اما فکر می‌کردم وقتی کالج را در دانشگاه چپمن شروع کردم تا حرفه‌ای «جدی‌تر» را دنبال کنم، آن را پشت سر گذاشته‌ام. من در رشته اقتصاد و روابط عمومی دو رشته بودم و فکر کردم تارته راهی سرگرم کننده برای گذراندن تابستان بعد از سال دوم قبل از روی آوردن به یک مسیر تجاری سنتی یا مالی است. من یک مشکل داشتم - هیچ ارتباطی با تارته، هیچ خانواده ای در صنعت زیبایی نداشتم، و هیچ راه آشکاری برای برجسته شدن در میان هزاران متقاضی نداشتم. در بازار کار امروزی، به خصوص برای موقعیتی که در زیبایی مورد توجه است، احتمال بیشتری وجود دارد که رعد و برق به من ضربه بزند تا پیشنهادی. وقتی درخواستم را در ژانویه 2024 ارسال کردم، می‌دانستم که به سختی یک شات داشتم. اینجاست که اکثر متقاضیان متوقف می‌شوند. آنها این روند را با صدها درخواست تکرار می‌کنند، به امید اینکه در قرعه‌کشی یک مصاحبه و در نهایت یک پیشنهاد برنده شوند. من اهل نبراسکا هستم و در کالیفرنیای جنوبی به مدرسه رفتم. صادقانه بگویم، رفتن به"}, {"source": "Business Insider", "title": "Amazon knows how to build big. The AI boom is testing just how big it can go.", "link": "https://www.businessinsider.com/amazon-220-billion-ai-bet-data-centers-spending-challenges-2026-10", "summary": "Prasad Kalyanaraman, vice president of infrastructure services at Amazon Web Services BASTIEN INZAURRALDE/AFP via Getty Images Amazon is on an unprecedented spending spree to build more AI data center capacity than anyone else. The company has extensive experience, yet even it's struggling to bring capacity online fast enough. Internal documents show Amazon getting bilions of dollars of Nvidia GPUs before they can be deployed. At an internal staff meeting in September, AWS CFO John Felton had a joke for Prasad Kalyanaraman , the executive overseeing much of Amazon's AI infrastructure expansion. \"You've taken us free cash flow negative as a company, so congratulations,\" Felton said, according to a recording of the meeting obtained by Business Insider. The remark was lighthearted. But it captured a stunning reversal. Just two years ago, Wall Street was debating what Amazon would do with its growing cash hoard . Now, cash flow has evaporated as Amazon embarks on its biggest bet ever, spending $220 billion this year alone to build the physical backbone for AI . At the meeting, Kalyanaraman did not dispute Felton's premise. Amazon's machine-learning and AI business is \"hugely free cash flow negative,\" he said, adding that he expects the company's free cash flow to remain negative for \"the next couple of years or so.\" Amazon has made big bets before. It spent heavily on cloud computing, fulfillment centers , and its delivery network long before they became some of the company's most valuable assets. Investors questioned those investments at the time, but Amazon ultimately built enormous, profitable businesses from them. AI is testing this playbook at a far larger scale. Amazon is committing hundreds of billions of dollars to data centers, servers, and power before investors know how quickly those investments will generate revenue. The company is the best, or among the best, at building data centers, with decades of experience. But the size and complexity of these projects, and the bottlenecks holding progress back, are challenging — even for such a respected cloud pioneer. Internal documents reviewed by Business Insider and people familiar with the matter show the company trying to coordinate a sprawling industrial system whose parts move on different schedules. A delay in power, equipment, or construction can leave billions of dollars in hardware waiting — and Amazon's cash tied up — while forecasts and costs keep shifting. Why Amazon thinks it will work Amazon", "date_str": "2026-10-19T09:00:01+00:00", "hash": "7a00d46677ce1684", "title_fa": "آمازون می داند چگونه بزرگ بسازد. رونق هوش مصنوعی در حال آزمایش است که چقدر می تواند بزرگ شود.", "summary_fa": "پراساد کالیانارامان، معاون خدمات زیرساختی در خدمات وب آمازون BASTIEN INZAURRALDE/AFP از طریق Getty Images آمازون در هزینه‌های بی‌سابقه‌ای برای ایجاد ظرفیت مرکز داده هوش مصنوعی بیش از هر کس دیگری مشغول است. این شرکت تجربه گسترده ای دارد، اما حتی در تلاش است تا ظرفیت را به اندازه کافی سریع آنلاین کند. اسناد داخلی نشان می‌دهد که آمازون میلیاردها دلار از پردازنده‌های گرافیکی انویدیا را قبل از راه‌اندازی دریافت می‌کند. در جلسه کارکنان داخلی در ماه سپتامبر، جان فلتون، مدیر مالی AWS با پراساد کالیانارامان، مدیر اجرایی که بر توسعه زیرساخت‌های هوش مصنوعی آمازون نظارت دارد، شوخی کرد. فلتون با توجه به ضبطی از جلسه که توسط Business Insider به دست آمده است، گفت: «شما جریان نقدی رایگان را به عنوان یک شرکت برای ما منفی کرده اید، بنابراین تبریک می گویم. تذکر ساده بود. اما یک واژگونی خیره کننده را ثبت کرد. همین دو سال پیش، وال استریت در حال بحث بود که آمازون با ذخیره پول نقد رو به رشد خود چه خواهد کرد. اکنون، جریان نقدینگی کاهش یافته است، زیرا آمازون بزرگترین شرط بندی خود را آغاز کرده است و تنها در سال جاری 220 میلیارد دلار برای ایجاد ستون فقرات فیزیکی برای هوش مصنوعی هزینه کرده است. در جلسه، کالیان آرامان با فرض فلتون مخالفت نکرد. او گفت که کسب و کار یادگیری ماشینی و هوش مصنوعی آمازون \"جریان نقدی رایگان بسیار منفی است\" و اضافه کرد که انتظار دارد جریان نقدی رایگان شرکت تا \"حدود دو سال آینده\" منفی باقی بماند. آمازون قبلاً شرط بندی های بزرگی انجام داده است. مدتها قبل از اینکه به یکی از با ارزش ترین دارایی های شرکت تبدیل شوند، هزینه های زیادی را برای محاسبات ابری، مراکز تکمیل، و شبکه تحویل خود صرف کرد. سرمایه‌گذاران در آن زمان این سرمایه‌گذاری‌ها را زیر سوال بردند، اما آمازون در نهایت"}, {"source": "Business Insider", "title": "Smoke Signals: The dangerous fatalism of AGI in Silicon Valley", "link": "https://www.businessinsider.com/smoke-signals-dangerous-fatalism-of-agi-silicon-valley-2026-10", "summary": "Getty Images; Tyler Le/BI Last week, Palantir CTO Shyam Sankar mentioned something bizarre in an interview on CBS News. \"So many AI researchers have started smoking as a way of signaling to other researchers how much they believe in AI,\" he said. Their thinking, he said, goes like this: \"I believe so much in AI that it's going to cure cancer. So I'm showing you my chips are all in.\" pI laughed as I read the quote. It read like a headline in The Onion, mocking the blind optimism of the AI-pilled. But then I felt sad and worried for them. Are they smoking because they believe AI is saving the world, I wondered, or because they believe AI is ending it? It's been an especially alarming few months here in San Francisco. OpenAI's bots went rogue and hacked another company, and then an Anthropic researcher quit , warning that AI could wipe out the human race. It seemed more believable to me that these researchers were smoking because they didn't think they'd be around for much longer — or at least freaked out about that possibility. I thought of the HBO show \"The Leftovers,\" which features a doomsday cult that chain-smokes. Because they believe the world has ended, they don't mind obliterating their lungs. They're living as though they're already dead. I asked a handful of people who work in AI and none of them knew anyone who had suddenly taken up cigarettes because of AI. So I don't think what Sankar observed is widespread. But in a story last month about tech founders who smoke , my colleague Henry Chandonnet quoted a guy who wasn't worried about his habit because he believed AI will soon cure lung cancer. Among the people I spoke to, a few recognized that underlying sentiment: AI's going to fix (or destroy) everything, so YOLO . Last year, my former colleague Rob Price reported on these attitudes. Some were spending down their savings. Others were taking dangerous drugs and having orgies . While AI boomers and doomers expect completely opposite outcomes, I've found it interesting that their very different beliefs often end up manifesting as the same behaviors. Smoke or don't smoke, it doesn't matter: The future is inevitable. In either case, they're relinquishing their fate to a humanity-ending or humanity-saving AI — and ignoring one of the most evidence-backed things they can do to live a healthy future. It's a kind of fatalism, believing that what you do won't change what happens next. I see traces of that in so many corners of society. What's the point of", "date_str": "2026-10-19T08:11:01+00:00", "hash": "e74756c92b1b7245", "title_fa": "سیگنال های دود: سرنوشت گرایی خطرناک AGI در سیلیکون ولی", "summary_fa": "گتی ایماژ; Tyler Le/BI هفته گذشته، شیام سانکار، CTO Palantir در مصاحبه ای در CBS News به چیز عجیبی اشاره کرد. او گفت: \"بسیاری از محققان هوش مصنوعی سیگار کشیدن را به عنوان راهی برای نشان دادن میزان اعتقاد آنها به هوش مصنوعی به سایر محققان آغاز کرده اند.\" او گفت که تفکر آنها به این صورت است: \"من آنقدر به هوش مصنوعی اعتقاد دارم که سرطان را درمان می کند. بنابراین من به شما نشان می دهم که تراشه هایم تمام شده است.\" وقتی نقل قول را خواندم خندیدم. این مانند یک تیتر در پیاز خوانده می شد که خوش بینی کور افراد دارای هوش مصنوعی را به سخره می گیرد. اما بعد برای آنها غمگین و نگران شدم. من تعجب کردم که آیا آنها سیگار می کشند زیرا معتقدند هوش مصنوعی جهان را نجات می دهد یا به این دلیل که معتقدند هوش مصنوعی به آن پایان می دهد؟ این چند ماه به خصوص در اینجا در سانفرانسیسکو بسیار نگران کننده است. ربات‌های OpenAI سرکش شدند و یک شرکت دیگر را هک کردند، و سپس یک محقق Anthropic از کار کنار رفت و هشدار داد که هوش مصنوعی می‌تواند نسل بشر را از بین ببرد. برای من باورپذیرتر به نظر می‌رسید که این محققان سیگار می‌کشیدند، زیرا فکر نمی‌کردند مدت طولانی‌تری در اطراف باشند - یا حداقل از این احتمال وحشت داشتند. من به برنامه HBO \"The Leftovers\" فکر کردم که یک فرقه روز قیامت را به نمایش می گذارد که زنجیره ای دود می کند. چون معتقدند دنیا به پایان رسیده است، بدشان نمی آید که ریه هایشان را از بین ببرند. آنها طوری زندگی می کنند که انگار قبلاً مرده اند. من از تعداد انگشت شماری از افرادی که در زمینه هوش مصنوعی کار می کنند پرسیدم و هیچ یک از آنها کسی را نمی شناختند"}, {"source": "Business Insider", "title": "French business leaders call for order after riots and looting: 'The Republic must protect its shopkeepers!'", "link": "https://www.businessinsider.com/france-paris-looting-riots-business-leaders-respond-2026-10", "summary": "After many French storefronts were ransacked by rioters on Saturday, Business owners are expressing their fury and disappointment on social media. JEFF PACHOUD / AFP via Getty Images It's a dangerous time to own a brick-and-mortar storefront in France. Violence erupted across the country on Saturday, as black-clad rioters ransacked stores. Around 1,500 storefronts were targeted, one corporate heavyweight said. Business owners in France are speaking out after cost-of-living protests turned into widespread rioting and looting across the country over the weekend. Alexandre Bompard, the CEO of Carrefour, one of France's largest supermarket chains , said that about 1,500 businesses were targeted in the unrest. Bompard and several other corporate heavyweights condemned the rioting and called on French authorities to restore order. Photos and video from Paris and other French cities showed black-clad rioters smashing storefronts and leaving laden with armfuls of pilfered goods. \"We cannot allow violence to destroy what generations have put so much energy into building,\" Thierry Guibert, the CEO of Lacoste, said on X. Here's what business owners are saying. Thierry Guibert, CEO of Lacoste and Aigle. Thierry Guibert tktk Jean Catuffe/Getty Images Guibert, who heads the luxury French clothing brand Lacoste and the outdoor clothing brand Aigle, issued a forceful statement on social media. He said the looting is antithetical to the entrepreneurial spirit. \"When our Lacoste and Aigle stores are looted, like so many other businesses across France, it is not only shop windows that are being smashed,\" he said in French. \"It is jobs, years of work, know-how, and the commitment of thousands of women and men that are being put at risk.\" Guibert said his concerns were shared by other entrepreneurs and smaller shop owners across France. He portrayed the riots as a degradation of French industry. Lacoste operates about 150 storefronts across France. Fabien Devide, CEO of Team Vitality Fabien Devide tktk credit should read JOEL SAGET/AFP via Getty Images The head of one of France's biggest professional esports organizations said that a part of him \"went up in smoke\" after his gaming café and club was looted on Saturday. \"The right to demonstrate is a fundamental freedom that I will defend all my life,\" Devide said on social media. \"But looting and destruction should never have a place in these fights.\" The esports organization operates a 4,300-square-foot gaming center, merchand", "date_str": "2026-10-19T07:38:16+00:00", "hash": "4a9579ca05d60aca", "title_fa": "رهبران تجاری فرانسوی خواستار نظم پس از شورش ها و غارت شدند: \"جمهوری باید از مغازه داران خود محافظت کند!\"", "summary_fa": "پس از غارت بسیاری از ویترین های فرانسه توسط شورشیان در روز شنبه، صاحبان مشاغل خشم و ناامیدی خود را در رسانه های اجتماعی ابراز می کنند. JEFF PACHOUD / خبرگزاری فرانسه از طریق Getty Images زمان خطرناکی برای داشتن ویترین فروشگاهی با آجر و ملات در فرانسه است. خشونت ها در سراسر کشور روز شنبه آغاز شد، زیرا آشوبگران سیاه پوش فروشگاه ها را غارت کردند. یک شرکت سنگین وزن گفت که حدود 1500 ویترین فروشگاه هدف قرار گرفتند. صاحبان مشاغل در فرانسه پس از اینکه اعتراضات مربوط به هزینه های زندگی در آخر هفته به شورش و غارت گسترده در سراسر کشور تبدیل شد، صحبت می کنند. الکساندر بومپارد، مدیر عامل کارفور، یکی از بزرگترین سوپرمارکت های زنجیره ای فرانسه، گفت که حدود 1500 کسب و کار در این ناآرامی ها هدف قرار گرفتند. بومپارد و چند تن دیگر از شرکت‌های بزرگ این شورش را محکوم کردند و از مقامات فرانسوی خواستند نظم را برقرار کنند. عکس‌ها و ویدئوهایی از پاریس و دیگر شهرهای فرانسه، آشوب‌گران سیاه‌پوش را نشان می‌دهد که ویترین فروشگاه‌ها را شکستند و مملو از کالاهای دزدی شده را ترک کردند. تیری گیبرت، مدیر عامل Lacoste، در X گفت: «ما نمی‌توانیم اجازه دهیم خشونت آنچه را که نسل‌ها برای ساختن انرژی صرف کرده‌اند، از بین ببرد. تیری گیبر، مدیر عامل شرکت Lacoste and Aigle. تیری گیبر tktk ژان کاتوف/ گتی ایماژ گیبر، که ریاست برند لباس لوکس فرانسوی Lacoste و برند لباس بیرونی Aigle را بر عهده دارد، بیانیه ای قوی در رسانه های اجتماعی منتشر کرد. او گفت این غارت مغایر با روحیه کارآفرینی است. او به زبان فرانسوی گفت: «وقتی فروشگاه‌های Lacoste و Aigle ما مانند بسیاری از مشاغل دیگر در سراسر فرانسه غارت می‌شوند، تنها ویترین مغازه‌ها نیست که شکسته می‌شوند. این مشاغل، سال ها کار، دانش فنی و تعهد هزاران زن"}, {"source": "Business Insider", "title": "France's riots highlight a growing risk for its battered bond market", "link": "https://www.businessinsider.com/france-protests-riots-paris-bond-market-debt-oats-yields-selloff-2026-10", "summary": "France s escalating unrest is adding to political uncertainty as the government struggles to rein in its deficit and restore investor confidence in its battered bond market. Thibaud Moritz/ AFP/Getty Images France's worsening unrest is adding to pressure on its battered bond market. Political gridlock threatens to keep French borrowing costs high, analysts warn. French bonds could miss out on a recovery even as the rest of Europe's bond markets rebound. France's worsening unrest is exposing how difficult it could be for the government to rein in spending and restore confidence in its battered bond market. Mass protests over rising living costs and poor school conditions swept across France over the weekend, with violence and looting breaking out in several cities. Shops were ransacked in Paris and other cities, while a fire devastated the historic town hall in Limoges, west-central France. The unrest adds to the challenges facing a government already struggling to pass a budget and bring its debt under control ahead of next year's presidential election. French government bonds, known as OATs, have been among the hardest hit in a global bond selloff fueled by inflation fears, higher interest-rate expectations, and concerns about government debt. \"French OATs continue to be the punching bag in the ongoing selloff in sovereign bond markets,\" Elias Hilmer, a markets economist at Capital Economics, wrote in a note on Friday. French bond yields have risen much faster this year than those on German government debt — considered among Europe's safest — widening the gap between the two as investors demand a bigger premium to hold French bonds. Early on Monday, France's 10-year OAT yield was 8 basis points higher at 4.86%, while Germany's 10-year bond yield was flat at 3.41%. Why France's debt problem is so hard to fix Investment manager Ninety One warned Monday that if France fails to pass its 2027 budget, its deficit could exceed 6% of GDP next year — more than double the European Union's 3% limit. Even passing the budget would offer only a temporary fix, said Sahil Mahtani, director at Ninety One's Investment Institute. France's presidential election next year could be followed by another parliamentary election, potentially leaving the country without a clear governing majority and extending budget uncertainty into 2028. The fiscal dilemma is particularly acute over pensions, where reforms could help stabilize France's debt trajectory but face strong political opp", "date_str": "2026-10-19T07:26:42+00:00", "hash": "b6b079ea008f3365", "title_fa": "شورش‌های فرانسه خطر فزاینده‌ای را برای بازار اوراق قرضه این کشور نشان می‌دهد", "summary_fa": "تشدید ناآرامی‌های فرانسه به عدم اطمینان سیاسی می‌افزاید، زیرا دولت در تلاش برای مهار کسری بودجه و بازگرداندن اعتماد سرمایه‌گذاران به بازار اوراق قرضه خود است. تیبو موریتز/ خبرگزاری فرانسه/ گتی ایماژ تشدید ناآرامی های فرانسه بر بازار اوراق قرضه آسیب دیده آن فشار می آورد. تحلیلگران هشدار می دهند که بن بست سیاسی هزینه های استقراض فرانسه را بالا نگه می دارد. اوراق قرضه فرانسه حتی با احیای سایر بازارهای اوراق قرضه اروپا ممکن است از بهبودی بازماند. تشدید ناآرامی‌های فرانسه نشان می‌دهد که مهار هزینه‌ها و بازگرداندن اعتماد به بازار اوراق قرضه خود برای دولت چقدر دشوار است. اعتراضات توده‌ای به دلیل افزایش هزینه‌های زندگی و شرایط بد مدارس در آخر هفته سراسر فرانسه را فرا گرفت و خشونت و غارت در چندین شهر رخ داد. مغازه‌ها در پاریس و دیگر شهرها غارت شدند، در حالی که آتش‌سوزی ساختمان تاریخی شهر لیموژ، مرکز غرب فرانسه را ویران کرد. این ناآرامی‌ها به چالش‌های پیش روی دولتی می‌افزاید که پیش از انتخابات ریاست‌جمهوری سال آینده در تلاش برای تصویب بودجه و کنترل بدهی‌های خود است. اوراق قرضه دولتی فرانسه، که به عنوان OAT شناخته می شوند، در میان فروش جهانی اوراق قرضه که ناشی از ترس از تورم، انتظارات بالاتر از نرخ بهره و نگرانی در مورد بدهی دولت است، بیشترین ضربه را خورده است. الیاس هیلمر، اقتصاددان بازار در کپیتال اکونومیکس، روز جمعه در یادداشتی نوشت: OATهای فرانسوی همچنان به عنوان کیسه بوکس در فروش مداوم در بازارهای اوراق قرضه دولتی هستند. بازده اوراق قرضه فرانسه امسال بسیار سریع‌تر از بدهی‌های دولت آلمان - که جزو امن‌ترین اوراق قرضه اروپا محسوب می‌شود - افزایش یافته است و این شکاف بین این دو را افزایش داده است زیرا سرمایه‌گذاران برای نگهداری اوراق قرضه فرانسه حق بیمه بیشتری را طلب می‌کنند. اوایل روز دوشنبه، بازدهی 10 ساله OAT فرانسه 8 واحد"}, {"source": "Business Insider", "title": "Ukraine is making anti-Shahed missiles that have to cost less than $20,000 per shot", "link": "https://www.businessinsider.com/ukraine-anti-shahed-missiles-cost-less-20000-each-2026-10", "summary": "Soldiers from the 148th Separate Artillery Zhytomyr Brigade of the Ukrainian Airborne Forces fire strike missiles from a BM-21 Grad MLRS. Dmytro Smolienko/Ukrinform/NurPhoto via Getty Images Ukraine is funding air defense missiles with a hard cap of $20,000 per shot, Brave1's chief said. That's about a sixth the cost of a Stinger missile, and still cheaper than an APWKS 70mm rocket. It's one of Kyiv's responses to Russia's thousands-strong, inexpensive Shahed fleets. Ukraine has been running a yearslong weapons program to develop cheap surface-to-air missiles that cost no more than $20,000 each, said Andrii Hrytseniuk, the head of its Brave1 startup incubator . Several firms have been testing prototypes under this framework, and Kyiv is \"preparing to put two of these companies into combat,\" Hrytseniuk said in a video interview published with Ukrainska Pravda on Thursday. He expressed hope that a third would soon reach a similar stage. Hrytseniuk said some of these manufacturers have managed to get costs down to $10,000 per missile, though the program has set a hard price cap of $20,000 per shot. \"This is significantly cheaper than the cost of a Shahed. Even if you need two or three missiles, it is still several times cheaper than the cost of a Shahed,\" said Hrytseniuk of the limit. Hrytseniuk said the program was launched by Brave1 as a competition between Ukrainian firms to \"create the cheapest anti-aircraft missile systems possible.\" \"Funding for missiles began in 2024, but making a missile takes even more time than making an interceptor drone,\" he added. A price limit of $20,000 would make these Ukrainian missiles even cheaper than the AGR-Falco Advanced Precision Kill Weapon System , an American-made unguided 70mm rocket fitted with a laser guidance kit. Costing about $30,000 to $35,000 each, these were traditionally air-to-ground rockets that have now been converted for air defense in Ukraine. The cheapest US standard surface-to-air missile is the shoulder-mounted Stinger, which costs about $120,000 per missile. The Ukrainian effort to lower air defense costs comes as a response to Russia's extensive Shahed attack drone fleets, which are numerous and cheaper to produce than typical missiles. Ukrainian officials have estimated that the Russian Geran-2, for example, costs $70,000 each, while jet-powered drones like the Geran-3 cost at least $100,000. Kyiv uses a layered network of defense systems, including machine gun crews, interceptor quadcopters, an", "date_str": "2026-10-19T06:08:41+00:00", "hash": "e1001dcdc5b67be8", "title_fa": "اوکراین در حال ساخت موشک های ضد شاهد است که هزینه هر شلیک آنها کمتر از 20000 دلار است", "summary_fa": "سربازان تیپ 148 توپخانه جداگانه ژیتومیر نیروهای هوابرد اوکراین موشک های تهاجمی را از یک BM-21 Grad MLRS شلیک می کنند. رئیس Brave1 گفت که Dmytro Smolienko/Ukrinform/NurPhoto از طریق Getty Images اوکراین برای موشک‌های دفاع هوایی با سقف 20,000 دلار در هر شلیک بودجه مالی می‌کند. این تقریباً یک ششم هزینه موشک استینگر است و همچنان ارزانتر از یک موشک 70 میلی متری APWKS است. این یکی از پاسخ های کیف به ناوگان شاهد هزاران نیرو و ارزان قیمت روسیه است. آندری هریتسنیک، رئیس انکوباتور استارت‌آپ Brave1 گفت: اوکراین یک برنامه تسلیحاتی سال‌ها برای توسعه موشک‌های زمین به هوای ارزان قیمتی که هر کدام بیش از 20000 دلار قیمت دارند، اجرا کرده است. هریتسنیک در یک مصاحبه ویدئویی که روز پنجشنبه با Ukrainska Pravda منتشر شد، گفت: چندین شرکت نمونه های اولیه را تحت این چارچوب آزمایش کرده اند و کیف \"آماده می شود تا دو شرکت از این شرکت ها را وارد نبرد کند.\" وی ابراز امیدواری کرد که یک سوم نیز به زودی به مرحله مشابهی برسد. هریتسنیک گفت که برخی از این تولیدکنندگان توانسته‌اند هزینه‌های هر موشک را به 10000 دلار کاهش دهند، اگرچه این برنامه سقف قیمتی سختی را 20000 دلار برای هر شلیک تعیین کرده است. هریتسنیوک در مورد محدودیت گفت: \"این به طور قابل توجهی ارزان تر از هزینه یک شاهد است. حتی اگر به دو یا سه موشک نیاز داشته باشید، باز هم چندین برابر ارزان تر از هزینه یک شاهد است.\" هریتسنیک گفت که این برنامه توسط Brave1 به عنوان رقابتی بین شرکت های اوکراینی برای \"ایجاد ارزان ترین سیستم های موشکی ضد هوایی ممکن\" راه اندازی شد. وی افزود: «تامین مالی موشک ها در سال 2024 آغاز شد، اما ساخت موشک حتی بیشتر از ساخت یک پهپاد رهگیر زمان می برد». محدودیت قیمت 20000 دلاری این موشک‌های اوکراینی را حتی ارزان‌تر"}, {"source": "Business Insider", "title": "Chaos and looting roiled major cities as Europeans poured into the streets to protest rising living costs", "link": "https://www.businessinsider.com/cost-of-living-protests-erupt-across-europe-2026-10", "summary": "Protesters took to the streets in capitals across Europe over the weekend. In Brussels, demonstrators clashed with police. Dursun Aydemir/Anadolu via Getty Images France wasn't alone this weekend. Civil unrest occurred in several European cities this weekend. Protests over the high cost of living devolved into riots. Demonstrators took to the streets across multiple European cities and capitals this weekend to protest the high cost of living in their countries. Though the violence in Paris and other French cities claimed the headlines, thousands also showed up in Portugal, Italy, and Belgium. Demonstrators were arrested in large numbers — many people were seen in photos and videos clashing violently with police and looting local businesses. Energy price hikes, caused at least in part by the US-Israeli war with Iran and the conflict between Russia and Ukraine, have contributed to the rising prices. Other demonstrations in Belgium and France were begun by students and have since snowballed into larger-scale demonstrations, involving union workers and other organizations. Here's a look at the chaos that unfolded across the Atlantic this weekend, where peaceful protests eventually devolved into riots and looting. Lisbon Protestors in Lisbon demanded a general increase in wages. Horacio Villalobos#Corbis/Getty Images In Lisbon, Portugal's capital , people took to the streets on October 17 to protest the cost-of-living crisis, low wages, and unaffordable housing. The demonstration, which was organized by the CGTP, Portugal's largest trade union federation, was also held in Porto and Coimbra. In all, the union said \"thousands of workers\" took part. About 12.7% of the population in Portugal lives in overcrowded households. Housing prices in Portugal recorded the largest annual increase of any EU member state in the second quarter of 2026, rising 16.5%. In Lisbon, the average rent is equivalent to 116% of the average salary, meaning it exceeds a typical monthly income by 16%. Earlier this week, police removed a tent camp that activists had set up in Praça D. João I, a central public square in Porto, to draw attention to rising housing costs. Brussels Riot police used a water cannon to spray youth demonstrators in Brussels, Belgium on Saturday NICOLAS MAETERLINCK / Belga / AFP via Getty Images In Belgium, students have held demonstrations in recent weeks over rising education costs, some of which turned violent over the weekend. Video footage showed police using wat", "date_str": "2026-10-19T04:43:47+00:00", "hash": "4f7a51267a25fb92", "title_fa": "هرج و مرج و غارت شهرهای بزرگ را به لرزه درآورد زیرا اروپایی ها در اعتراض به افزایش هزینه های زندگی به خیابان ها ریختند", "summary_fa": "معترضان آخر هفته در پایتخت های سراسر اروپا به خیابان ها آمدند. در بروکسل تظاهرکنندگان با پلیس درگیر شدند. دورسون آیدمیر/آنادولو از طریق گتی ایماژ فرانسه این آخر هفته تنها نبود. ناآرامی های مدنی در چند شهر اروپایی آخر هفته رخ داد. اعتراضات به هزینه های بالای زندگی به شورش تبدیل شد. تظاهرکنندگان آخر هفته در چندین شهر و پایتخت اروپایی در اعتراض به هزینه های بالای زندگی در کشورهایشان به خیابان ها آمدند. اگرچه خشونت در پاریس و سایر شهرهای فرانسه سرفصل اخبار را به خود اختصاص داد، هزاران نفر در پرتغال، ایتالیا و بلژیک نیز حضور یافتند. تظاهرکنندگان به تعداد زیادی دستگیر شدند - بسیاری از مردم در عکس ها و فیلم ها در حال درگیری شدید با پلیس و غارت مشاغل محلی دیده می شدند. افزایش قیمت انرژی که حداقل بخشی از آن ناشی از جنگ آمریکا و اسرائیل با ایران و درگیری بین روسیه و اوکراین است، به افزایش قیمت ها کمک کرده است. تظاهرات دیگر در بلژیک و فرانسه توسط دانشجویان آغاز شد و از آن زمان به تظاهرات گسترده‌تر تبدیل شد که کارگران اتحادیه و سایر سازمان‌ها در آن شرکت داشتند. در اینجا نگاهی به هرج و مرجی است که این آخر هفته در سراسر اقیانوس اطلس رخ داد، جایی که اعتراضات مسالمت آمیز در نهایت به شورش و غارت تبدیل شد. معترضان لیسبون در لیسبون خواستار افزایش عمومی دستمزدها شدند. Horacio Villalobos#Corbis/Getty Images در لیسبون، پایتخت پرتغال، مردم در 17 اکتبر در اعتراض به بحران هزینه های زندگی، دستمزدهای پایین و مسکن غیرقابل استفاده به خیابان ها آمدند. این تظاهرات که توسط CGTP، بزرگترین فدراسیون اتحادیه های کارگری پرتغال سازماندهی شده بود، در پورتو و کویمبرا نیز برگزار شد. در مجموع، اتحادیه گفت: «هزاران کارگر» در آن شرکت کردند. حدود 12.7 درصد از جمعیت پرتغال در خانواده های پرجمعیت زندگی می کنند. قیمت"}, {"source": "Business Insider", "title": "Meta says it shut down No Kings Instagram account because it thought bots had been unleashed", "link": "https://www.businessinsider.com/meta-says-suspending-no-kings-account-was-done-in-error-2026-10", "summary": "Demonstrators hold signs during a No Kings protest at the South Carolina Statehouse. Sean Rayford/Getty Images Meta says its system detected intense bursts of activity by a Claude tool. That triggered an automatic shutdown and locked admins out of the account. It happened during a day of rallies promoting early voting in the midterms. Meta said Sunday that its systems suspended the No Kings movement's Instagram account during its day of action because it detected \"intense\" activity by a Claude tool. The account was locked and administrators were denied access for \"several hours\" during nationwide rallies on Saturday to mobilize early voting in the midterms , the group said. Meta initially said that an automatic trigger was responsible for shutting down the account \"in error,\" but offered a fuller explanation a day later. \"Our engineering team discovered that the spike that triggered the incorrect enforcement was primarily in the account's 'reading' behavior,\" spokesperson Andy Stone said in an X post. \"Specifically, our network security systems detected the use of a Claude tool reading profiles, posts, and hashtags, the rate of which sharply increased (~4x volume) in intense bursts on October 17. \" Stone said the activity resembled bot traffic, prompting the system to take the account offline. \"An automated re-review of the removal action an hour later recognized that shouldn't have happened and restored the account. It unfortunately took additional time for us to straighten out the situation with admin access to the IG account. \"We want to reiterate our sincere apology for the error,\" he wrote. The No Kings network, which bills itself as nonpartisan but arose last year in response to President Donald Trump 's actions, said it held nearly 3,000 rallies across the country to encourage voters to cast their ballots early as a hedge against any effort to undermine turnout. \"Restricting communications about voting in the middle of an election is unacceptable,\" it said. \"Meta must answer for this suspension and take immediate steps to ensure it never happens again — to any account, but especially those working to inform voters and encourage participation in our democracy.\" Democratic Sen. Chris Murphy of Connecticut called for an investigation into the shutdown, saying on Sunday evening that even if it was made in error, the incident was a \"total indictment of Meta's outsized influence on our culture and politics.\" \"If it wasn't malevolence, it was likely a natu", "date_str": "2026-10-19T04:21:11+00:00", "hash": "71bcb34d0e0b701a", "title_fa": "متا می‌گوید حساب اینستاگرام No Kings را بسته است زیرا فکر می‌کرد ربات‌ها راه‌اندازی شده‌اند", "summary_fa": "تظاهرکنندگان در تظاهرات نه پادشاهان در ساختمان ایالتی کارولینای جنوبی، تابلوهایی را در دست گرفتند. Sean Rayford/Getty Images Meta می گوید که سیستم آن انفجارهای شدید فعالیت را توسط ابزار کلود شناسایی کرده است. این باعث خاموش شدن خودکار و قفل شدن ادمین ها از حساب کاربری شد. این اتفاق در یک روز تجمعات برای ترویج رأی گیری زودهنگام در میان دوره ای رخ داد. متا روز یکشنبه گفت که سیستم‌هایش حساب اینستاگرام جنبش No Kings را در طول روز فعالیت خود به حالت تعلیق درآورده‌اند زیرا این جنبش فعالیت «شدید» را توسط ابزار Claude شناسایی کرده است. این گروه گفت که حساب کاربری قفل شد و مدیران برای \"چند ساعت\" در طول راهپیمایی های سراسری روز شنبه برای بسیج رای گیری زودهنگام در میان دوره ای از دسترسی به آن محروم شدند. متا در ابتدا گفت که یک تریگر خودکار مسئول خاموش کردن حساب \"به اشتباه\" است، اما یک روز بعد توضیح کامل تری ارائه کرد. سخنگوی اندی استون در پست ایکس گفت: «تیم مهندسی ما متوجه شد که افزایشی که باعث اجرای نادرست شده است، عمدتاً در رفتار «خواندن» حساب بوده است. استون گفت: «به طور خاص، سیستم‌های امنیتی شبکه ما استفاده از ابزار Claude را برای خواندن پروفایل‌ها، پست‌ها و هشتگ‌ها شناسایی کردند که میزان آن در 17 اکتبر به‌شدت افزایش یافت (حدود 4 برابر). \"یک بررسی مجدد خودکار اقدام حذف یک ساعت بعد تشخیص داد که نباید اتفاق می‌افتاد و حساب را بازیابی کرد. متأسفانه زمان بیشتری را برای ما صرف کرد تا وضعیت را با دسترسی سرپرست به حساب IG درست کنیم. او نوشت: \"ما می‌خواهیم صمیمانه عذرخواهی خود را برای این خطا تکرار کنیم.\" شبکه No Kings که خود را غیرحزبی می‌داند اما سال گذشته در واکنش به اقدامات دونالد ترامپ، رئیس‌جمهور آمریکا به وجود آمد، گفت که نزدیک به 3000 گردهمایی در سراسر"}, {"source": "Business Insider", "title": "Anthropic commits billions to a 'public benefit fund'", "link": "https://www.businessinsider.com/anthropic-public-benefit-fund-2026-10", "summary": "Anthropic said on Sunday that it wants to create a new LLC to fund public-interest initiatives. Kent NISHIMURA / AFP via Getty Images Anthropic said it wants to create a new LLC with the company's stock as its sole asset. The new LLC, a charitable organization, would receive larger stakes as the company grows. An initial 5% stock funding is \"subject to stockholder approval,\" Anthropic said. Anthropic said on Sunday that it would set aside large portions of its wealth to support initiatives it believes are in the public interest. In a blog post, the AI colossus said it aims to establish a separate LLC that would use Anthropic shares to make donations to nonprofits or \"direct distributions to specific populations.\" The new LLC, called the \"Anthropic Public Benefit Fund,\" would receive larger stakes as the company grows. The company said an initial funding round of 5% of Anthropic's shares is still subject to stockholder approval. \"The Anthropic Public Benefit Fund will have increased flexibility and scale, enabling us to pursue our mission in new ways,\" the company said. A 5% stake in Anthropic is worth about $48 billion, according to the company's most recent valuation in May. In 2025, rival frontier AI company OpenAI established a similar nonprofit foundation with a multibillion-dollar stake in the company to fund public-benefit initiatives. Read the original article on Business Insider", "date_str": "2026-10-18T18:46:01+00:00", "hash": "33623f3c851131a4", "title_fa": "آنتروپیک میلیاردها دلار به یک \"صندوق عام المنفعه\" متعهد می شود", "summary_fa": "آنتروپیک روز یکشنبه گفت که می‌خواهد یک LLC جدید برای تامین مالی طرح‌های با منافع عمومی ایجاد کند. کنت نیشیمورا / خبرگزاری فرانسه از طریق گتی ایماژ آنتروپیک گفت که می خواهد یک LLC جدید با سهام این شرکت به عنوان تنها دارایی آن ایجاد کند. LLC جدید، یک سازمان خیریه، با رشد شرکت، سهام بیشتری دریافت خواهد کرد. آنتروپیک گفت، سرمایه اولیه 5 درصدی سهام \"مشروط به تایید سهامداران است.\" آنتروپیک روز یکشنبه گفت که بخش بزرگی از ثروت خود را برای حمایت از طرح هایی که معتقد است به نفع عمومی است کنار می گذارد. در یک پست وبلاگی، غول هوش مصنوعی گفت که قصد دارد یک LLC جداگانه ایجاد کند که از سهام آنتروپیک برای اهدای کمک به سازمان های غیرانتفاعی یا \"توزیع مستقیم به جمعیت های خاص\" استفاده کند. LLC جدید که \"صندوق منافع عمومی Anthropic\" نامیده می شود، با رشد شرکت سهام بیشتری دریافت خواهد کرد. این شرکت گفت که دور اولیه تامین مالی 5 درصدی از سهام آنتروپیک همچنان منوط به تایید سهامداران است. این شرکت گفت: \"صندوق عام المنفعه Anthropic انعطاف پذیری و مقیاس بیشتری خواهد داشت و ما را قادر می سازد تا ماموریت خود را به روش های جدید دنبال کنیم.\" بر اساس آخرین ارزیابی این شرکت در ماه می، 5 درصد از سهام آنتروپیک حدود 48 میلیارد دلار ارزش دارد. در سال 2025، شرکت مرزی رقیب هوش مصنوعی OpenAI، یک بنیاد غیرانتفاعی مشابه با سهام چند میلیارد دلاری در این شرکت برای تأمین مالی طرح‌های عام المنفعه تأسیس کرد. مقاله اصلی را در Business Insider بخوانید"}, {"source": "Business Insider", "title": "Trump's decision to import Russian diesel is an 'incentive to end the war,' energy secretary says", "link": "https://www.businessinsider.com/trump-russia-sanctions-diesel-imports-ukraine-war-2026-10", "summary": "President Donald Trump signed an executive order waiving new sanctions on Russia. Aaron Schwartz/Getty Images US Energy Secretary Chris Wright defended Trump's decision to buy Russian diesel. Wright said the relief is actually an \"incentive\" for Russia to end its war with Ukraine. Ukraine's President Zelenskyy and several US lawmakers have criticized the move. President Donald Trump is still playing hardball with Russia, according to US Department of Energy Secretary Chris Wright . Wright defended Trump's decision to waive sanctions on Russia during a Sunday interview on CNN's \"State of the Union with Jake Tapper and Dana Bash.\" In September, Trump signed into law a sanctions package targeting Russian officials and parts of its economy in an effort to pressure Russia amid its war on Ukraine. Last week, Trump issued an executive order waiving those new sanctions, other restrictions, and some duties on Russia. In early October, Trump also announced an agreement with President Vladimir Putin under which Russia would supply over 300,000 tons of diesel fuel to America and the global market. \"President Trump waived sanctions just on diesel exports, and what's the one thing Russia has not been able to export over the last month or so? Diesel, because they're short of diesel,\" Wright said. The Energy Secretary said waiving the sanctions solves two problems: the diesel oil shortage and Russia's ongoing war with Ukraine. \"This is pressuring Russia. Russia does not have diesel to export,\" Wright said. \"The only way they can get additional diesel to export is if they turn down the conflict with Ukraine.\" Wright said Russia would have to enter into an energy ceasefire or reduce its war efforts to have enough additional diesel to export. \"This is not going soft on Russia. This is an incentive to end the war,\" Wright added. Trump elaborated on his reasoning further on Sunday in a Truth Social post. \"I am in the process of negotiating Peace in the war between Russia and Ukraine, and don't want to do anything that will drive, foolishly, Russia away from the bargaining table,\" he wrote. Ukrainian President Volodymyr Zelenskyy said waiving sanctions on Russia \"seems wrong\" to him. US lawmakers on both sides of the political aisle also criticized the move, including Republican Sen. Thom Tillis. \"Beyond irresponsible. What part of enforcing a law passed 86-11 by the Senate does the President and his advisors not understand? It's unconscionable that this administration is capit", "date_str": "2026-10-18T18:37:58+00:00", "hash": "0f616e6bca822fba", "title_fa": "وزیر انرژی آمریکا گفت تصمیم ترامپ برای واردات گازوئیل از روسیه \"انگیزه ای برای پایان دادن به جنگ\" است", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا با امضای فرمان اجرایی تحریم‌های جدید علیه روسیه را لغو کرد. آرون شوارتز/ گتی ایماژ، کریس رایت، وزیر انرژی آمریکا از تصمیم ترامپ برای خرید گازوئیل روسیه دفاع کرد. رایت گفت که این کمک‌ها در واقع یک \"انگیزه\" برای روسیه برای پایان دادن به جنگ خود با اوکراین است. زلنسکی، رئیس جمهور اوکراین و چندین قانونگذار آمریکایی از این اقدام انتقاد کرده اند. به گفته کریس رایت، وزیر انرژی ایالات متحده، دونالد ترامپ، رئیس جمهور آمریکا همچنان با روسیه سخت بازی می کند. رایت روز یکشنبه در مصاحبه ای با شبکه سی ان ان \"وضعیت اتحادیه با جیک تاپر و دانا باش\" از تصمیم ترامپ برای لغو تحریم های روسیه دفاع کرد. در سپتامبر، ترامپ یک بسته تحریمی را امضا کرد که مقامات روسیه و بخش‌هایی از اقتصاد این کشور را هدف قرار می‌دهد تا روسیه را در بحبوحه جنگ اوکراین تحت فشار قرار دهد. هفته گذشته، ترامپ با صدور فرمانی اجرایی از تحریم‌های جدید، سایر محدودیت‌ها و برخی وظایف بر روسیه چشم پوشی کرد. در اوایل اکتبر، ترامپ همچنین از توافقی با رئیس جمهور ولادیمیر پوتین خبر داد که بر اساس آن روسیه بیش از 300 هزار تن سوخت دیزل را به آمریکا و بازار جهانی عرضه خواهد کرد. رایت گفت: «رئیس‌جمهور ترامپ تحریم‌ها را فقط در مورد صادرات گازوئیل لغو کرد، و تنها چیزی که روسیه در یک ماه گذشته نتوانسته است صادر کند چیست؟ دیزل، زیرا آنها کمبود گازوئیل دارند. وزیر انرژی گفت: معافیت از تحریم ها دو مشکل را حل می کند: کمبود نفت دیزل و جنگ مداوم روسیه با اوکراین. رایت گفت: \"این روسیه را تحت فشار قرار می دهد. روسیه گازوئیل برای صادرات ندارد.\" تنها راهی که آنها می توانند گازوئیل اضافی برای صادرات دریافت کنند این است که درگیری با اوکراین را رد کنند. رایت گفت روسیه باید به"}, {"source": "Business Insider", "title": "The Elizabeth Holmes documentary is crushing it at the box office. See how much it's made so far.", "link": "https://www.businessinsider.com/you-can-see-everything-box-office-numbers-reviews-reception-2026-10", "summary": "Lance Oppenheim and Nathan Fielder have a hit with their new film, You Can See Everything. Cindy Ord/Getty Images for FLC Nathan Fielder's documentary about Theranos founder Elizabeth Holmes is a bona fide hit. The film, \"You Can See Everything,\" grossed $15 million in its opening weekend in the US and Canada. It offers a revealing portrait of Holmes, who was convicted of defrauding investors. Nathan Fielder's nearly three-hour documentary about disgraced entrepreneur Elizabeth Holmes is running up numbers at the box office. The film, \"You Can See Everything,\" grossed $15 million in the US and Canada during its opening weekend, according to A24, the film's distributor. That's the best opening weekend for a documentary this year. \"Melania\" had the second-biggest opening weekend for a documentary after its release in January. It grossed $7.1 million. The film's financial success is matched by viewer reception, too. It scored a whopping 99% among critics on Rotten Tomatoes, the movie-rating site, and a 98% among regular audiences. Directed by Fielder and Lance Oppenheim, the picture offers a remarkably revealing portrait of Holmes, who was convicted of defrauding investors with her blood-testing company, Theranos. Theranos was at one point valued at $9 billion. It said its product could run hundreds of medical tests using just a pinprick of blood from a finger, but investigations revealed the company was using expensive lab equipment to surreptitiously run the tests. Holmes, as the company's CEO, was sentenced to 11 years in federal prison after journalist John Carreyrou published a withering investigative report in The Wall Street Journal, sparking what eventually became criminal charges. Business Insider's Henry Chandonnet has seen the film twice so far. He called it \"one of the most shocking, revelatory, and oddly funny films\" he'd ever witnessed. \"It was twisty and worthy of seeing with fresh eyes,\" Henry reported. Read the original article on Business Insider", "date_str": "2026-10-18T17:56:46+00:00", "hash": "b9604827f1488bce", "title_fa": "مستند الیزابت هلمز آن را در گیشه شکست می دهد. ببینید تا الان چقدر ساخته شده", "summary_fa": "لنس اوپنهایم و ناتان فیلدر با فیلم جدید خود به نام You Can See Everything موفق شدند. مستند Cindy Ord/Getty Images برای FLC ناتان فیلدر درباره الیزابت هولمز، بنیانگذار ترانوس، موفقیت آمیز بود. فیلم \"شما می توانید همه چیز را ببینید\" در اولین آخر هفته اکران خود در ایالات متحده و کانادا 15 میلیون دلار فروخت. این پرتره آشکار از هولمز را ارائه می دهد که به دلیل کلاهبرداری از سرمایه گذاران محکوم شد. مستند نزدیک به سه ساعته ناتان فیلدر درباره کارآفرین رسوایی الیزابت هولمز در گیشه پرفروش است. به گزارش A24، پخش کننده فیلم، فیلم «شما می توانید همه چیز را ببینید» در آخر هفته افتتاحیه خود در ایالات متحده و کانادا 15 میلیون دلار فروخت. این بهترین آخر هفته افتتاحیه برای یک مستند امسال است. «ملانیا» پس از اکران در ژانویه، دومین آخر هفته افتتاحیه بزرگ یک مستند را داشت. 7.1 میلیون دلار فروش داشت. موفقیت مالی فیلم با استقبال تماشاگران نیز مطابقت دارد. امتیاز فوق‌العاده 99 درصدی در میان منتقدان راتن تومیتوز، سایت رتبه‌بندی فیلم، و 98 درصد در میان مخاطبان معمولی به دست آورد. این تصویر به کارگردانی فیلدر و لنس اوپنهایم، پرتره‌ای آشکار از هولمز است که به دلیل کلاهبرداری از سرمایه‌گذاران با شرکت آزمایش خون خود، ترانوس، محکوم شد. ترانوس در مقطعی 9 میلیارد دلار ارزش داشت. این شرکت می‌گوید که محصولش می‌تواند صدها آزمایش پزشکی را تنها با استفاده از یک نیش خون از انگشت انجام دهد، اما بررسی‌ها نشان داد که این شرکت از تجهیزات آزمایشگاهی گران‌قیمت برای اجرای مخفیانه آزمایش‌ها استفاده می‌کند. هولمز، به عنوان مدیر عامل شرکت، پس از انتشار یک گزارش تحقیقاتی رو به زوال در روزنامه وال استریت ژورنال، روزنامه نگار جان کریرو، به 11 سال زندان فدرال محکوم شد که در نهایت به اتهامات جنایی تبدیل شد. هنری شاندونت از Business Insider تاکنون دو بار این"}, {"source": "Business Insider", "title": "I was annoyed by my neighbor's noise. Months later, I'd helped raise $80,000 for her care.", "link": "https://www.businessinsider.com/noisy-neighbor-parkinsons-unexpected-friendship-2026-10", "summary": "Heidi Widmer now helps her neighbor, who has Parkinson s. Courtesy of Heidi Widmer Heidi Widmer is a 35-year-old who moved into an apartment building in Los Angeles in July. For the first two weeks, she heard a loud sound from the apartment above and was annoyed. She found out the noise was being made by her neighbor, who has Parkinson's. This as-told-to essay is based on a conversation with Heidi Widmer. It has been edited for length and clarity. In July, I moved into an apartment in Los Angeles , exhausted from a six-day drive across the country from New York. All I wanted to do was get into the apartment and sleep, and luckily, my bed had been delivered on the same day I arrived. Trying to fall asleep at 2 a.m., all I could hear was a loud noise coming from the apartment upstairs . It sounded as if someone was bowling. Although I was tempted to shout for them to be quiet, I held my tongue — I was the new neighbor and didn't want to be difficult. But the noise just didn't seem to stop. Whoever lived up there also never came downstairs. Who lives up there? I thought to myself. I realized my neighbor had Parkinson's Two weeks after moving in, I heard someone coming down the stairs and had to get a glimpse of who lived above me. Peeking out of my door, I saw Carole for the first time, slowly making her way down the stairs, shaking badly from what was clearly Parkinson's , and trying to carry a bunch of bags full of recycling. Just as I was about to open the door to see if she needed help, she dropped all the bags with only a couple of steps left. I burst out of my apartment to help her. \"Oh my gosh, thank you,\" she said in her sweet British accent. \"Did you just move in? Am I too loud for you?\" In that moment, I felt totally and completely humbled. Having grown up in the Catholic church , I was taught never to judge a book by its cover, and with Carole, I hadn't even seen the cover. I judged her simply by the noise she produced upstairs. How could I be so judgmental? It turns out that sound had been Carole rolling a three-wheeled, broken chair across her floor to get to her mini fridge — the mini fridge social services had given her when her refrigerator broke. She had to hoist herself out of her broken chair to get down and access the mini fridge. That was the noise. I was determined to figure out what I could do to help Two days after we met, I knocked on her door. She peeked through and nervously let me in. The conditions inside weren't great. Although s", "date_str": "2026-10-18T17:14:01+00:00", "hash": "950bc537e4b3ebdc", "title_fa": "از سر و صدای همسایه ناراحت شدم. ماه‌ها بعد، 80000 دلار برای مراقبت از او جمع‌آوری کردم.", "summary_fa": "هایدی ویدمر اکنون به همسایه‌اش که مبتلا به پارکینسون است کمک می‌کند. با حسن نیت از هایدی ویدمر هایدی ویدمر یک جوان 35 ساله است که در ماه ژوئیه به یک آپارتمان در لس آنجلس نقل مکان کرد. در دو هفته اول صدای بلندی از آپارتمان بالا می شنید و اذیت می شد. او متوجه شد که صدا توسط همسایه اش که پارکینسون دارد ایجاد می شود. این مقاله گفته شده بر اساس گفتگو با هایدی ویدمر است. برای طول و وضوح ویرایش شده است. در ژوئیه، من خسته از یک رانندگی شش روزه در سراسر کشور از نیویورک، به آپارتمانی در لس آنجلس نقل مکان کردم. تنها کاری که می‌خواستم انجام دهم این بود که وارد آپارتمان شوم و بخوابم و خوشبختانه تختم در همان روزی که رسیدم تحویل داده شد. سعی کردم ساعت 2 صبح بخوابم، تنها چیزی که می شنیدم صدای بلندی بود که از آپارتمان طبقه بالا می آمد. انگار کسی در حال بولینگ بود. اگرچه وسوسه شدم که فریاد بزنم که ساکت باشند، زبانم را نگه داشتم - من همسایه جدید بودم و نمی خواستم سخت باشم. اما به نظر نمی رسید که صدا متوقف شود. هر کس در آنجا زندگی می کرد هرگز پایین نیامد. چه کسی آنجا زندگی می کند؟ با خودم فکر کردم متوجه شدم همسایه‌ام پارکینسون دارد دو هفته پس از نقل مکان، شنیدم که شخصی از پله‌ها پایین می‌آید و باید نگاهی اجمالی به افرادی که بالای سرم زندگی می‌کنند را ببینم. وقتی از در بیرون نگاه کردم، برای اولین بار کارول را دیدم که به آرامی از پله‌ها پایین می‌آید، به شدت از چیزی که به وضوح پارکینسون بود می‌لرزید و سعی می‌کرد دسته‌ای از کیسه‌های پر از بازیافت را حمل کند. درست در حالی که می خواستم در را باز کنم تا ببینم آیا او به کمک نیاز"}, {"source": "Business Insider", "title": "Paris business owners take stock as riots sweep the city: 'They'd taken everything'", "link": "https://www.businessinsider.com/paris-france-riots-looting-small-business-2026-10", "summary": "A wine store in Paris was emptied of all its products during riots on Saturday. Nathan Rennolds/Business Insider Paris erupted as protests turned to riots and masked looters ransacked stores on Saturday. Small business owners took stock of what they'd lost on Sunday. \"When I got back, they'd taken everything,\" one store owner told Business Insider. \"When I got back, they'd taken everything.\" That's what one shopkeeper in Paris told me as she cleared debris from her store after major cost-of-living protests turned violent across parts of France. Chaotic scenes unfolded on Saturday as rioters clashed with police and set vehicles and trash bins alight before masked marchers began to ransack businesses, including in the trendy Marais shopping district. After hundreds of arrests and a tense, momentary calm on Sunday morning, more violence broke out Sunday evening as black-clad rioters dragged debris into streets and set it aflame. Employees at a boutique fashion brand working in the area as the riots unfolded told me the situation felt \"dystopian,\" and that at one point tear gas began seeping into the store. That apparently was not enough to put some shoppers off, however, as some continued to browse, they said. They added that there was a heavy police presence on the street throughout Saturday, and that although they had hired extra security, they eventually decided to close early as the violence intensified. Cycling through the city on Sunday, I followed what felt like a path of destruction that steadily ramped up as I neared the Place de République, where the city's 3rd, 10th, and 11th arrondissements meet — the scene of some of Saturday's most serious violence. I stopped at several stores along the way to photograph the damage and speak with shop workers about their experiences. A looted storefront in Paris. Courtesy of Lucie Bardinet A store owner at a gold-buying shop whose front window had been smashed told me she was forced to close up early on Saturday. \"I got a call. It was my neighbor, who was working next door at the restaurant. He'd made a video showing a group of young people,\" she said, adding that they forced the door open and \"smashed everything up.\" \"They stole things,\" she said. \"When I got back, they'd taken everything.\" Later, I stopped outside a ransacked Nicolas wine store, one of the country's most prominent wine retail brands. The storefront was agape, the entrance and both display windows smashed, revealing shelves picked clean. Empty ", "date_str": "2026-10-18T16:58:31+00:00", "hash": "d6d139fa6e9b955a", "title_fa": "صاحبان مشاغل پاریس در حالی که شورش‌ها شهر را فرا گرفته، حساب می‌کنند: \"آنها همه چیز را گرفته بودند\"", "summary_fa": "یک فروشگاه شراب در پاریس در جریان ناآرامی های روز شنبه از تمام محصولات خود خالی شد. ناتان رنولدز/Business Insider پاریس در حالی شروع شد که اعتراضات به شورش تبدیل شد و غارتگران نقابدار فروشگاه ها را در روز شنبه غارت کردند. صاحبان مشاغل کوچک آنچه را که در روز یکشنبه از دست داده بودند، محاسبه کردند. یکی از صاحبان فروشگاه به Business Insider گفت: «وقتی برگشتم، همه چیز را گرفته بودند. \"وقتی برگشتم، همه چیز را گرفته بودند.\" این همان چیزی است که یکی از مغازه‌دارها در پاریس هنگام پاکسازی آوار از مغازه‌اش پس از خشونت‌آمیز شدن تظاهرات عمده هزینه‌های زندگی در بخش‌هایی از فرانسه به من گفت. صحنه های هرج و مرج روز شنبه با درگیری شورشیان با پلیس و آتش زدن وسایل نقلیه و سطل های زباله پیش از شروع راهپیمایی های نقابدار شروع به غارت مشاغل، از جمله در منطقه خرید شیک Marais شد. پس از صدها دستگیری و یک آرامش لحظه‌ای و متشنج صبح یکشنبه، خشونت‌های بیشتری در غروب یکشنبه رخ داد، زیرا آشوبگران سیاه‌پوش زباله‌ها را به خیابان‌ها کشیده و آن را به آتش کشیدند. کارمندان یک برند مد بوتیکی که در آن منطقه کار می‌کردند، با وقوع شورش‌ها به من گفتند که وضعیت \"دیستوپیایی\" به نظر می‌رسد و در یک لحظه گاز اشک‌آور به داخل فروشگاه نفوذ کرد. به نظر می رسد که این برای معطل کردن برخی از خریداران کافی نبود، با این حال، آنها گفتند که برخی از آنها به مرور ادامه دادند. آنها افزودند که حضور شدید پلیس در سراسر روز شنبه در خیابان وجود داشت و با وجود اینکه نیروهای امنیتی بیشتری را استخدام کرده بودند، اما در نهایت تصمیم گرفتند که زودتر تعطیل شوند. با دوچرخه سواری در شهر در روز یکشنبه، مسیری را دنبال کردم که شبیه مسیری از تخریب بود که با نزدیک شدن به میدان"}, {"source": "Business Insider", "title": "I tried Gordon Ramsay's favorite 10-minute pasta. Now I know why he makes it for his family every week.", "link": "https://www.businessinsider.com/gordon-ramsay-easy-pasta-turkey-leek-recipe-2026-10", "summary": "Gordon Ramsay has an easy 10-minute pasta. Anneta Konstantinides/Business Insider I tried Gordon Ramsay's 10-minute pasta, which he often makes for his family. The dish features a turkey and leek sauce and is topped with crispy sage breadcrumbs. Ramsay's delicious pasta was light and bright. It's perfect for a busy week. Gordon Ramsay has never let me down when I need a quick recipe, whether it's a 15-minute Bolognese or a 10-minute bacon cheeseburger . So I was ecstatic when I discovered that the Michelin-starred chef has an entire cookbook dedicated to dishes that can be made in 10 minutes. The very first recipe I tried from \" Ramsay in 10 \" was a turkey and leek pasta with crispy sage breadcrumbs. \"For a change, skip the Bolognese and make this creamy turkey and leek sauce in a fraction of the time instead,\" Ramsay writes in the description. \"It might just become a regular midweek family meal, as it has at my house.\" Ramsay s 10-minute pasta includes turkey, breadcrumbs, and leeks. Anneta Konstantinides/Business Insider To make Ramsay's 10-minute pasta for four, you'll need: 17 ounces of fresh penne or fusilli pasta 14 ounces of ground turkey ¾ cup of heavy cream 4 sage leaves 4 regular shallots (or 2 banana shallots) 3 garlic cloves 2 leeks 1 lemon A handful of flat-leaf parsley leaves Freshly grated Parmesan cheese (for serving) To make the breadcrumbs, you'll need: 6 tablespoons of fresh breadcrumbs 2 sage leaves 2 tablespoons of olive oil Ramsay notes in his cookbook that the breadcrumbs are optional, but I recommend taking the extra step. It was my first time making fresh breadcrumbs, and it couldn't have been easier. But feel free to play around with the ingredients depending on your preferences. Ramsay said this dish also works well with ground chicken or sausage; the sage can easily be swapped for thyme, parsley, or tarragon; and any shape of fresh or dried pasta will do. Before I started cooking, I needed to prep my ingredients. Anneta Konstantinides/Business Insider First, I brought a saucepan of salted water to a boil so it'd be ready for the pasta in a few minutes. Then, per Ramsay's recipe, I peeled and grated my shallots and garlic. If the handheld grater proves tricky — and risky for your fingers — feel free to use a knife to finish mincing the veggies. After grating my shallots and garlic, I finely sliced the leeks. Anneta Konstantinides/Business Insider Ramsay recommends prepping your shallots and garlic while the olive oil is heating u", "date_str": "2026-10-18T16:26:02+00:00", "hash": "b07439fd641bf1d2", "title_fa": "من پاستا 10 دقیقه ای مورد علاقه گوردون رمزی را امتحان کردم. حالا می دانم چرا هر هفته برای خانواده اش درست می کند.", "summary_fa": "گوردون رمزی یک پاستا 10 دقیقه ای آسان دارد. Anneta Konstantinides/Business Insider من ماکارونی 10 دقیقه ای گوردون رمزی را امتحان کردم که اغلب برای خانواده اش درست می کند. این غذا دارای سس بوقلمون و تره فرنگی است و روی آن آرد سوخاری مریم گلی ترد ریخته می شود. ماکارونی خوشمزه رمزی سبک و درخشان بود. برای یک هفته شلوغ عالی است. گوردون رمزی هرگز وقتی به یک دستور غذای سریع نیاز دارم، چه یک چیزبرگر 15 دقیقه ای بولونی یا یک چیزبرگر بیکن 10 دقیقه ای، من را ناامید نکرده است. بنابراین وقتی فهمیدم سرآشپز ستاره‌دار میشلن یک کتاب آشپزی کامل به غذاهایی دارد که می‌توانند در 10 دقیقه درست شوند، به وجد آمدم. اولین دستوری که از \"رمسی در 10\" امتحان کردم، ماکارونی بوقلمون و تره فرنگی با پودر سوخاری مریم گلی ترد بود. رمزی در توضیحات می نویسد: \"برای تغییر، از بولونیز صرف نظر کنید و به جای آن این سس خامه ای بوقلمون و تره فرنگی را در کسری از زمان درست کنید.\" \"ممکن است به یک وعده غذایی خانوادگی معمولی وسط هفته تبدیل شود، همانطور که در خانه من شده است.\" پاستا 10 دقیقه ای Ramsay شامل بوقلمون، آرد سوخاری و تره فرنگی است. Anneta Konstantinides/Business Insider برای تهیه ماکارونی 10 دقیقه ای Ramsay برای چهار نفر، به: 17 اونس پاستا پنه یا فوسیلی تازه 14 اونس بوقلمون آسیاب شده ¾ فنجان خامه غلیظ 4 برگ مریم گلی 4 موسیر معمولی (یا 2 موسیر موزی) 3 عدد موسیر 3 عدد 3 عدد سیر برگ های جعفری برگ تخت پنیر پارمزان تازه رنده شده (برای سرو) برای تهیه آرد سوخاری به این موارد نیاز دارید: 6 قاشق غذاخوری آرد سوخاری تازه 2 برگ مریم گلی 2 قاشق غذاخوری روغن زیتون رمزی در کتاب آشپزی خود خاطرنشان می کند که آرد سوخاری اختیاری است، اما توصیه"}, {"source": "Business Insider", "title": "I ordered turkey sandwiches at Jersey Mike's, Subway, and Jimmy John's. One totally stole the show.", "link": "https://www.businessinsider.com/which-chain-best-turkey-sandwich-subway-jimmy-johns-jersey-mikes-2026-10", "summary": "I ordered default turkey sandwiches from the sandwich chains Jersey Mike s, Subway, and Jimmy John s to find the best one. Savannah Born I compared turkey sandwiches from Jersey Mike's, Subway, and Jimmy John's to find the best one. I wasn't impressed by the bread from Subway or Jimmy John's, but the sandwiches were OK. Ultimately, Jersey Mike's was my clear winner with a generously loaded, flavorful turkey sandwich. When noon rolls around, nothing is more classic than a turkey sandwich, a basic yet delicious staple of many American lunches — and a personal favorite of mine. To me, a traditional turkey sandwich consists of sliced turkey, lettuce, and tomato stuffed between two mayo-slathered pieces of bread. If there's cheese, it's usually a mild white like Swiss or provolone. Jersey Mike's , Subway, and Jimmy John's all offer some version of my go-to sandwich, so I set out to find the best one. To keep things fair, I ordered each chain's regular-size sandwich without any customizations — and to be extra fastidious, I brought out my measuring tape to make sure the advertised inches were accurate, because you truly never know. Here's how the sandwiches compared. I started at Jersey Mike s, where I was surprised by an ultra-thick sub. I did measure each sandwich for this taste test. Savannah Born Jersey Mike's is recognized for its freshly sliced meats, \"Mike's Way\" preparation , and \"juice,\" otherwise known as oil and vinegar. The Turkey and provolone sandwich came with all of the above. The menu noted that all cold subs, including the turkey and provolone, are prepared \"Mike's Way,\" which meant with lettuce, tomato, onion, seasonings, and the aforementioned \"juice.\" Sliced turkey and provolone cheese completed the sandwich. The regular (almost) 7-inch sub cost me $9.80 before tax, or roughly $1.40 per inch. I enjoyed almost everything about Jersey Mike s turkey sandwich. Savannah Born This put my homemade turkey sandwiches , which I considered solid, to shame. Oil, vinegar, oregano, and salt gave an otherwise simple sandwich an incredibly flavorful twist, and it paired beautifully with the soft, crusty-at-the-edges bread. It felt like a hybrid turkey-and-Italian sandwich. The turkey was surprisingly moist, as was the cheese — which made sense in hindsight, given that I watched the staff slice these ingredients in real time. I expected only a couple of slices of each, but I found at least five of turkey and three of cheese. I can't say the lettuce, tomato, ", "date_str": "2026-10-18T15:12:01+00:00", "hash": "4af84f0d2d6eb647", "title_fa": "من ساندویچ بوقلمون را در جرسی مایک، مترو و جیمی جان سفارش دادم. یکی کاملاً نمایش را دزدید.", "summary_fa": "من ساندویچ های پیش فرض بوقلمون را از زنجیره های ساندویچ Jersey Mike s، Subway و Jimmy John s سفارش دادم تا بهترین آنها را پیدا کنم. Savannah Born من ساندویچ های بوقلمون را از Jersey Mike's، Subway و Jimmy John's مقایسه کردم تا بهترین آنها را پیدا کنم. من تحت تاثیر نان مترو یا جیمی جان قرار نگرفتم، اما ساندویچ ها خوب بودند. در نهایت، Jersey Mike's برنده واضح من با یک ساندویچ بوقلمون با سخاوتمندانه و طعم بود. وقتی ظهر فرا می رسد، هیچ چیز کلاسیک تر از یک ساندویچ بوقلمون نیست، یک غذای اصلی و در عین حال خوشمزه از بسیاری از ناهارهای آمریکایی – و مورد علاقه شخصی من. به نظر من، یک ساندویچ بوقلمون سنتی شامل بوقلمون، کاهو و گوجه‌فرنگی تکه‌شده است که بین دو تکه نان سس مایو پر شده است. اگر پنیر وجود داشته باشد، معمولاً سفید ملایمی مانند سوئیسی یا پروولون است. Jersey Mike's، Subway، و Jimmy John's همه نسخه‌ای از ساندویچ مورد علاقه من را ارائه می‌دهند، بنابراین من تصمیم گرفتم بهترین آن را پیدا کنم. برای اینکه همه چیز منصفانه باشد، ساندویچ با اندازه معمولی هر زنجیره را بدون هیچ گونه سفارشی‌سازی سفارش دادم - و برای اینکه سخت‌تر باشم، نوار اندازه‌گیری خود را بیرون آوردم تا مطمئن شوم اینچ‌های تبلیغ شده دقیق هستند، زیرا واقعاً هرگز نمی‌دانید. در اینجا نحوه مقایسه ساندویچ ها آمده است. من در Jersey Mike s شروع کردم، جایی که با یک زیر بسیار ضخیم شگفت زده شدم. من هر ساندویچ را برای این تست طعم اندازه گرفتم. جرسی مایکز متولد ساوانا به خاطر گوشت های تازه برش خورده، تهیه «راه مایک» و «آبمیوه» که به روغن و سرکه معروف است، شناخته می شود. ساندویچ ترکیه و پروولون با تمام موارد بالا آمد. منو اشاره کرد که همه زیره های سرد، از جمله بوقلمون و"}, {"source": "Business Insider", "title": "A travel expert who flies 150,000 miles a year shares the one item he always packs, even though he's rarely used it", "link": "https://www.businessinsider.com/carry-on-essentials-flight-expert-packs-extra-phone-2026-10", "summary": "Flight expert Zach Griff shares why he always brings an extra phone in his carry-on backpack. Courtesy of Zach Griff, Jaromir/Getty Images What would you do if you lost your phone on a trip abroad? It might never happen. It's never happened to Zach Griff. But if it ever does, he'll be prepared. It's probably tucked away in a drawer, stashed in your desk or nightstand, beneath chargers, stray cords, and pieces of paper you don't think you're supposed to throw out but probably will never need again. You probably haven't thought about it since you put it there. But Zach Griff's old phone is in his carry-on backpack . Griff, a travel expert and author of the travel newsletter From the Tray Table, estimates that he flies an average of 150,000 miles a year. And for the past 11 years, he said, he's carried his retired cellphone with him around the world. Why you should always travel with 2 phones When you upgrade your phone, put the old one in your backpack, Griff says. Joey Hadden/Business Insider Your old phone won't take up much space in your carry-on, and if something happens to your current one, it may be the most important item you pack. \"Your phone is the one thing you need to stay connected,\" Griff told Business Insider. \"And the last thing I need when I'm traveling is to try to find a new phone.\" Griff said he came to this realization in 2015 while on a safari in the Serengeti with his wife, Jill. They were staying at a remote lodge when Jill cracked her phone and damaged the camera. In the presence of elephants, giraffes, and lions, Jill couldn't snap a single picture. Right about now, you may be thinking, \"Why not just bring a camera?\" I say go for it, but it won't fit as easily in your carry-on. And it won't help you if your phone gets lost or breaks. \"That was the time when I was like, 'From now on, I'm bringing a spare phone every single time,'\" Griff said about the safari trip . In over a decade of travel, Griff has only used his backup phone as a replacement once. \"We were in Paris, and I was walking near the Eiffel Tower, taking pictures at one of the overlooks,\" Griff said. \"It was so crowded, I was worried about pickpockets, so I was fumbling things around, and then it happened.\" While attempting to slide it back in his pocket, Griff dropped his phone on the ground. A crack ran across the top of the screen, disabling Face ID, but the phone was otherwise functioning just fine, he said. He decided to switch to the backup phone anyway to make the ", "date_str": "2026-10-18T15:02:01+00:00", "hash": "f935e771416882d8", "title_fa": "یک متخصص سفر که 150000 مایل در سال پرواز می کند، کالایی را که همیشه بسته بندی می کند به اشتراک می گذارد، حتی اگر به ندرت از آن استفاده می کند.", "summary_fa": "زک گریف، متخصص پرواز، دلیل همراه داشتن تلفن اضافی را در کوله پشتی خود بیان می کند. با حسن نیت از زک گریف، جارومیر/گتی ایماژ اگر گوشی خود را در سفری خارج از کشور گم کنید چه می کنید؟ ممکن است هرگز اتفاق نیفتد. هرگز برای زک گریف اتفاق نیفتاده است. اما اگر چنین شود، او آماده خواهد شد. احتمالاً در یک کشو گذاشته شده، در میز یا پاتختی‌تان، زیر شارژرها، سیم‌های سرگردان و تکه‌های کاغذی که فکر نمی‌کنید قرار است بیرون بیندازید اما احتمالاً دیگر به آن نیاز نخواهید داشت، گذاشته شده است. احتمالاً از زمانی که آن را آنجا گذاشته اید به آن فکر نکرده اید. اما تلفن قدیمی زک گریف در کوله پشتی او است. گریف، کارشناس سفر و نویسنده خبرنامه مسافرتی From the Tray Table، تخمین می زند که به طور متوسط ​​150000 مایل در سال پرواز می کند. و در 11 سال گذشته، او گفت، تلفن همراه بازنشسته خود را در سراسر جهان با خود حمل کرده است. گریف می گوید: چرا باید همیشه با 2 گوشی سفر کنید وقتی تلفن خود را ارتقا می دهید، گوشی قدیمی را در کوله پشتی خود قرار دهید. Joey Hadden/Business Insider تلفن قدیمی شما فضای زیادی را در چمدان شما اشغال نمی کند، و اگر برای گوشی فعلی شما اتفاقی بیفتد، ممکن است مهم ترین وسیله ای باشد که بسته بندی می کنید. گریف به Business Insider گفت: «تلفن شما تنها چیزی است که برای متصل ماندن به آن نیاز دارید. \"و آخرین چیزی که در سفر به آن نیاز دارم این است که سعی کنم یک تلفن جدید پیدا کنم.\" گریف گفت که در سال 2015 زمانی که با همسرش جیل در یک سافاری در سرنگتی بود به این موضوع پی برد. آنها در یک اقامتگاه از راه دور اقامت داشتند که جیل گوشی خود را شکست"}, {"source": "Business Insider", "title": "Carrefour CEO says 50 of its stores and almost 20 supermarkets were ransacked during riots in France", "link": "https://www.businessinsider.com/carrefour-ceo-france-riots-2026-10", "summary": "Alexandre Bompard, the CEO of supermarket chain Carrefour, condemned rioters in France on Sunday. Bloomberg/Getty Images Alexandre Bompard condemned the riots in France on Sunday. The Carrefour CEO said that rioters targeted about 50 of his stores. Bompard said that the cost of repairs will exceed $11 million. The CEO of one of France's largest supermarket chains, and one of the world's largest retailers, said that 50 of its stores were targeted by rioters on Saturday. Alexandre Bompard, who leads Carrefour, France's version of Walmart, took to X on Sunday to condemn the riots and commend his employees as France reels from widespread civil unrest and looting. \"Nothing can justify such violence,\" Bompard said on X in French. \"Those who attack the work tools of courageous entrepreneurs and their teams in this way must face an uncompromising response.\" \"The Republic must protect its shopkeepers!\" he added. Riots swept across France on Saturday after initially peaceful demonstrations against the high cost of living and deteriorating school conditions turned violent. Interior Minister Laurent Nuñez said on X that 600 police officers were injured in the fracas and more than 2,000 people were arrested. Photos and videos from Paris and other French cities show massive demonstrations , burning cars, and wrecked storefronts. Rioters set cars on fire at the Canal Saint Martin during severe unrest in Paris on October 17. Remon Haazen/Getty Images In his X post, Bompard called the violence \"unacceptable.\" He said that, in addition to Carrefour's stores, about 1,500 other shops were damaged in the riots. \"The cost of the repairs will amount to more than 10 million euros, and our shopkeepers need an acceleration of compensation procedures, as in the case of natural disasters,\" he said. Read the original article on Business Insider", "date_str": "2026-10-18T14:55:22+00:00", "hash": "624313ba1267edb7", "title_fa": "مدیر عامل کارفور می گوید 50 فروشگاه و تقریبا 20 سوپرمارکت در جریان ناآرامی ها در فرانسه غارت شدند.", "summary_fa": "الکساندر بومپارد، مدیر عامل سوپرمارکت زنجیره ای کارفور، روز یکشنبه شورشیان در فرانسه را محکوم کرد. بلومبرگ/گتی ایم rs, fantastic processing for clear, detailed images, and striking contrast that brings out the best in your favorite videos. While other TVs fought for ever-brighter, showier images, the S90F succeeded by focusing on accuracy over bombast. This year's S90H doesn't do much to change that winning formula. Its OLED panel delivers the same pixel-level contrast and wide viewing angles, and it offers similar brightness. However, a couple of tweaks could make this new model even more appealing, depending on your priorities. The biggest upgrade for 2026 is the S90H's new matte-like screen, which uses the same glare-free technology previously reserved for Samsung's pricier S95 Series. This screen virtually eliminates all but the brightest reflections, which is a huge perk for sunny rooms. However, the S90H's color performance is actually slightly worse than the S90F's. But since recent discounts have brought both models down to similar prices, the S90H wins out as the more versatile of the two. Though not without its faults, the S90H's unique combination of features and excellent overall value helps cement its status as the best TV for a wide range of uses. If you want a midrange OLED that looks good in both dark home theaters and sunlit rooms, the S90H is hard to beat. The design is slick, and it's quick to assemble The TV s stand isn t as sturdy as the metal bases used on some rival models, but it s easy to assemble without screws. Ryan Waniata/Business Insider Compared to many TV assemblies, Samsung's S90 series feels like a cheat code. Though you've got to be extremely careful with its precariously slim panel, putting the stand together requires no screws and takes just seconds to secure its slide-and-click feet. There's also a snap-on cover that makes the feet look like a single pedestal. As someone who assembles several TVs a year (sometimes a month), I find it hard to complain about the S90H's plug-and-play design. However, the stand does feel a bit jankier than other options in this class. For instance, the more affordable Hisense U7SG employs a robust metallic base plate for a sturdier, true pedestal stand. I actually had to jam the S90H's ri", "date_str": "2026-10-18T14:31:01+00:00", "hash": "7a73469c4cefc4ce", "title_fa": "بررسی تلویزیون OLED 4K سامسونگ S90H: همه کاره ترین تلویزیون سال", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید بازبینی کننده ما سامسونگ S90H را با الگوهای آزمایشی و محتوای دنیای واقعی به سرعت پیش می برد. Ryan Waniata/Business Insider تلویزیون OLED سامسونگ S90F سال گذشته با به کار بردن تمام موارد ضروری مرا تحت تأثیر قرار داد: رنگ‌های پر جنب و جوش و در عین حال طبیعی، پردازش فوق‌العاده برای تصاویر واضح و دقیق، و کنتراست خیره‌کننده که بهترین ویدیوهای مورد علاقه شما را به نمایش می‌گذارد. در حالی که سایر تلویزیون‌ها برای تصاویر درخشان‌تر و درخشان‌تر مبارزه می‌کردند، S90F با تمرکز بر دقت بیش از بمب‌گذاری موفق شد. S90H امسال کار زیادی برای تغییر فرمول برنده انجام نمی دهد. پنل OLED آن کنتراست در سطح پیکسل و زاویه دید وسیع را ارائه می دهد و روشنایی مشابهی را ارائه می دهد. با این حال، چند ترفند می تواند این مدل جدید را بسته به اولویت های شما جذاب تر کند. بزرگ‌ترین ارتقا برای سال 2026، صفحه‌نمایش مات‌مانند جدید S90H است که از همان فناوری بدون تابش نور استفاده می‌کند که قبلاً برای سری گران‌تر S95 سامسونگ در نظر گرفته شده بود. این صفحه‌نمایش عملاً همه انعکاس‌ها به جز روشن‌ترین انعکاس‌ها را از بین می‌برد، که امتیاز بزرگی برای اتاق‌های آفتاب‌گیر است. با این حال، عملکرد رنگ S90H در واقع کمی بدتر از S90F است. اما از آنجایی که تخفیف های اخیر هر دو مدل را به قیمت های مشابه کاهش داده است، S90H به عنوان همه کاره تر از این دو برنده می شود. اگرچه بدون ایراد نیست، ترکیب منحصر به فرد ویژگی ها و ارزش کلی عالی S90H به تثبیت وضعیت آن به عنوان بهترین تلویزیون برای طیف گسترده ای از کاربردها کمک می کند. اگر یک OLED میان رده می‌خواهید که هم در سینماهای خانگی تاریک"}, {"source": "Lifehacker", "title": "Out-of-Touch Adults' Guide to Kid Culture: What Is 'Loser Core'?", "link": "https://lifehacker.com/entertainment/out-of-touch-adults-guide-to-kid-culture-what-is-loser-core?utm_medium=RSS", "summary": "This week's Out of Touch Guide delves into the musical genre/sub-culture of \"Loser Core,\" a pointed response to overly polished music and Instagram-polished fashion. We also define some slang, so if a young person says you have EBK or nods and says \"GiGis\" to you, you'll know whether you're being insulted or complimented. And then there's Biddy Blas, Star Wars fandom's newest Glub Shitto. What is Loser Core and the Loser Core Playlist? Loser Core is a growing subculture and musical style among young people. The music is influenced by indie, alternative, and lo-fi, with lyrics that tend toward depressing. They're usually about alienation, teen angst, and how hard it is to talk girls. Loser Core is like emo, but more homemade and more hopeless, or like grunge with less anger. Prominent Loser Core artists include Memo Boy and Wifiskeleton . Notable influences include Radiohead and Weezer. The Loser Core look is anti-fashion: over-size, slouchy hoodies, anime T-shirts, digital watches, and beat-up sneakers. The personality type is alienated nerd with niche hobbies and few friends. So basically, depressed young people who gravitate to depressing music and a slobby look. No matter your age, I'm sure you knew (or were) this type of person when you were 17. Here's a video that explains it a bit more: So that's Loser Core, the genre and lifestyle. Explaining the prominence of the Loser Core Playlist is a little more complicated. Created on Spotify by depay178 , LOSERCORE is a playlist of 155 songs in the Loser Core genre. Back in June, a TikTok user called @user406398991 started posted AI-generated cartoons to promote the LOSERCORE playlist. The videos feature a recurring cast of characters, are usually about music, and end with a recommendation to visit the LOSERCORE playlist. Here's an example: The videos started appearing on a lot of people's feeds in October, raising the profile the musical genre and generating reenactment videos like this: ...as well as videos from artists who are confused at their own inclusion on the list , people selling rip-off merch , and people gate-keeping what Loser Core is and questioning the inclusion of some songs on what is becoming the canonical list. Also: a ton of videos asking, \"why does this keep showing up on my feed?\" Online chatter about the playlist revolves around the perceived lack of quality of the videos, and why, exactly, someone would spend so much time promoting a playlist on Spotify when you can't monetize the foll", "date_str": "2026-10-19T13:30:00+00:00", "hash": "2b70001fe4e729e0", "title_fa": "راهنمای بزرگسالان خارج از تماس برای فرهنگ کودک: «هسته بازنده» چیست؟", "summary_fa": "راهنمای خارج از تماس این هفته به ژانر/فرهنگ موزیکال «Loser Core» می پردازد، پاسخی تیز به موسیقی بیش از حد صیقلی و مد شیک اینستاگرام. ما یک عامیانه هم تعریف می کنیم، بنابراین اگر جوانی بگوید شما EBK دارید یا سری تکان دهد و به شما بگوید GiGis، متوجه می شوید که آیا به شما توهین می شود یا تعریف می شود. و سپس Biddy Blas، جدیدترین Glub Shitto از طرفداران جنگ ستارگان. Loser Core و لیست پخش Loser Core چیست؟ Loser Core یک خرده فرهنگ و سبک موسیقی در حال رشد در بین جوانان است. موسیقی متاثر از موسیقی مستقل، آلترناتیو و لو-فای با اشعاری است که تمایل به افسردگی دارند. آنها معمولاً درباره بیگانگی، عصبانیت نوجوانان و اینکه صحبت کردن با دختران چقدر سخت است. Loser Core مانند ایمو emo است، اما بیشتر خانگی و ناامیدتر، یا مانند گرانج با خشم کمتر است. هنرمندان برجسته Loser Core عبارتند از Memo Boy و Wifiskeleton. تاثیرات قابل توجه شامل Radiohead و Weezer است. ظاهر Loser Core ضد مد است: هودی‌های شلوغ و شلخته، تی‌شرت‌های انیمه، ساعت‌های دیجیتال و کفش‌های کتانی سبک. تیپ شخصیتی، آدم‌های بیگانه با سرگرمی‌های خاص و دوستان کمی هستند. بنابراین اساساً، جوانان افسرده ای که به سمت موسیقی افسرده و نگاه شلخته گرایش پیدا می کنند. مهم نیست سن شما، من مطمئن هستم که شما در 17 سالگی این نوع افراد را می
