ا و نرمش از او نشان نمی‌دهد.", "date_str": "2026-10-26T14:43:34+00:00", "hash": "b78f3d8f4f5b2011", "title_fa": "آیا تغییر نخست‌وزیر می‌تواند سیاست اسرائیل در قبال ایران را عوض کند؟", "summary_fa": "اگر کسی فکر کند که شکست بنیامین نتانیاهو، نخست‌وزیر جنجالی اسرائیل، در انتخابات پارلمانی این کشور پیروزی جمهوری اسلامی است، سخت در اشتباه است. کارنامه عملی گادی آیزنکوت، رئیس ستاد پیشین ارتش اسرائیل، چهره‌ای اهل مدارا و نرمش از او نشان نمی‌دهد. این حرف بسیاری از طرفداران گادی آیزنکوت، رقیب اصلی بنیامین نتانیاهو، است. آنها که با شور و حرارت در اجتماع انتخاباتی حزب یاشار در تل‌آویو شعار می‌دادند، می‌گویند که اگر به سابقه این رئیس ستاد پیشین ارتش اسرائیل نگاه کنید، موضوع روشن‌تر خواهد شد. من خودم در میدان گروگان‌های اسرائیل در تل‌آویو از گادی آیزنکوت در مورد نگاهش به ایران پرسیدم. ترجیح داد که فعلا جواب ندهد. بنیامین نتانیاهو در سه سال گذشته وارد سه جنگ بزرگ شده است. حمله مرگبار حماس در ۷ اکتبر ۲۰۲۳، جامعه اسرائیل را تکان داد و خاورمیانه و جهان را در بهت فرو برد. بسیاری ناکامی نهادهای اطلاعاتی اسرائیل را در جلوگیری از این حمله بزرگترین ضربه چند دهه اخیر به امنیت اسرائیل تلقی کردند و مسئولیت داخلی آن را بر عهده شخص بنیامین نتانیاهو دانستند. آقای نتانیاهو در شرایط سختی قرار گرفت. واکنش او مبارزه‌جویانه بود. وارد جنگ غزه شد که به کشتار وسیع و ویرانی گسترده منجر شد. او به موشک پرانی‌های حزب الله لبنان با مشت آهنین پاسخ داد. او دستور حذف سران حزب‌الله را صادر کرد و عملیاتی خونین و ویرانگر را در جنوب لبنان به راه انداخت. مهم‌تر از همه اینها، در ژوئیه ۲۰۲۵ در عملیاتی حساب‌شده و گسترده، او به تاسیسات اتمی حمله کرد و شمار زیادی از فرماندهان ارشد نظامی ایران را کشت؛ حمله‌ای که به جنگ ۱۲ روزه شهرت یافت و آمریکا هم به آن پیوست. تقریبا هشت ماه بعد، آقای نتانیاهو وارد یک قمار بزرگ دیگر شد. او با کمک دونالد ترامپ، رئیس‌جمهور آمریکا، جنگ ۴۰ روزه را شروع کرد. در ساعات اولین", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/0d26/live/6ea629f0-d148-11f1-9eb5-811878e0f07d.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۴ آبان • ۱۸:۱۳"}, {"source": "BBC Persian", "title": "سه عامل اصلی در پیروزی تاریخی لولا برای چهارمین دوره ریاست‌جمهوری برزیل", "link": "https://www.bbc.com/persian/articles/ckd6dzq0lw34o?at_medium=RSS&at_campaign=rss", "summary": "پیروزی رئیس‌جمهور برزیل شاید برخلاف محاسبات به نظر برسد، اما کارشناسان می‌گویند راز این موفقیت در تحولاتی است که میان دور اول و دور دوم انتخابات رخ داد و به کارزار او جان تازه‌ای بخشید.", "date_str": "2026-10-26T13:54:50+00:00", "hash": "d5a6c7cc6d3a3b22", "title_fa": "سه عامل اصلی در پیروزی تاریخی لولا برای چهارمین دوره ریاست‌جمهوری برزیل", "summary_fa": "پیروزی رئیس‌جمهور برزیل شاید برخلاف محاسبات به نظر برسد، اما کارشناسان می‌گویند راز این موفقیت در تحولاتی است که میان دور اول و دور دوم انتخابات رخ داد و به کارزار او جان تازه‌ای بخشید. «برزیل برای تازه‌کارها نیست.» این جمله را توم ژوبیم، یکی از بنیان‌گذاران سبک موسیقی بوسا نوا، گفته بود. بازگشت تاریخی لوئیز ایناسیو لولا دا سیلوا در انتخابات نیز به نظر می‌رسد بار دیگر درستی آن را ثابت کرده باشد. لولا با کسب ۵۱٫۸ درصد آرای معتبر در دور دوم انتخابات در برابر فلاویو بولسونارو، سناتور راست‌گرا، که ۴۸٫۲ درصد آرا را به دست آورد، چهارمین دوره ریاست‌جمهوری خود را به دست آورد. این نتیجه برای بسیاری پس از دور نخست انتخابات در چهارم اکتبر بعید به نظر می‌رسید. نتیجه‌ای که هم پیچیدگی این کشور را نشان می‌دهد و هم گویی قوانین ریاضی را به چالش می‌کشد. بولسونارو در دور نخست با ۴۷ درصد آرا، تقریبا دو واحد درصد بیشتر از لولا، پیروز شده بود و با برخورداری از حمایت نامزدهایی که در مجموع بیش از ۵ درصد آرا را کسب کرده بودند، به عنوان بخت اصلی وارد دور دوم شد. این نتیجه همچنین یک رکورد محسوب می‌شود، چون از زمان استقرار نظام انتخاباتی کنونی برزیل در سال ۱۹۸۸، برای نخستین بار نامزدی که در دور اول آرای بیشتری از رقیب خود به دست آورده بود، در دور دوم شکست می‌خورد. فلاویو بولسونارو ۴۵ ساله، پسر ژائیر بولسونارو، رئیس‌جمهور پیشین برزیل، است که پس از شکست در انتخابات ۲۰۲۲ برابر لولا، به دلیل تلاش برای کودتا دوران محکومیت خود را در زندان می‌گذراند. پس از پایان شمارش آرا، بولسونارو اعلام کرد که خواستار ابطال انتخابات خواهد شد، چون به گفته او h": "05b03e3cafe05934", "title_fa": "بایگانی انسان برای فهرست شدن در بازار سهام ایالات متحده، سودهای سریع درآمد و زیان های بزرگتر را نشان می دهد", "summary_fa": "اولین حضور در بازار شرکت هوش مصنوعی پشت ربات چت کلود یکی از بزرگترین در تاریخ ایالات متحده خواهد بود، آزمایشی برای رونق مالی هوش مصنوعی Anthropic به طور عمومی برای یک لیست در بازار سهام ثبت کرده است، که یکی از بزرگترین اولین عرضه ها در تاریخ است. شناور بودن این شرکت در بازار ایالات متحده احتمالاً یک علامت پر آب در رونق چند تریلیون دلاری هوش مصنوعی و آزمایشی برای دوام مالی آن خواهد بود. تحلیلگران و سرمایه گذاران شرکت مستقر در سانفرانسیسکو را که در سال 2021 تأسیس شده است، بیش از 1.5 تریلیون دلار ارزیابی کرده اند. این شرکت که تحت نماد ANT فهرست خواهد شد، به طور محرمانه برای عرضه اولیه عمومی در ماه ژوئن به تنظیم کننده های مالی ایالات متحده ارسال کرد. به خواندن ادامه دهید... در دفترچه سرمایه‌گذار این شرکت آمده است: «ما معتقدیم هوش مصنوعی یکی از مهم‌ترین فناوری‌ها در تاریخ بشر است. محققان و مدیران آنتروپیک بارها در مورد پتانسیل هوش مصنوعی برای انقراض انسان هشدار داده اند. آنتروپیک پیشرو در رقابت برای ایجاد مدل‌های هوش مصنوعی قدرتمند و پیشرو در رونق هوش مصنوعی آمریکا، ربات چت کلود را به عنوان محصول شاخص خود ارائه می‌کند که دارای ویژگی‌های تولید متن و همچنین قابلیت‌های کدنویسی و امنیت سایبری پیشرفته است. داریو آمودی، مدیر عامل شرکت، پس از ترک OpenAI، سازنده ChatGPT، این شرکت را تاسیس کرد. پرونده‌های حسابرسی شده Anthropic اولین نگاه عمومی به سلامت مالی آن را ارائه می‌کند، که در ماه‌های اخیر موضوع گمانه‌زنی‌های شدید به عنوان پرسش‌هایی درباره چرخش احتمالی حباب هوش مصنوعی بوده است. این شرکت درآمد سریع رو به رشد را در دفترچه توضیح داد: 41 میلیون دلار در سال 2023، 386 میلیون دلار در سال 2024، 4.585 میلیارد دلار در سال 2025 (افزایش بیش از 1000 درصد)، سپس 16.286 میلیارد دلار تنها در شش", "image_url": "https://i.guim.co.uk/img/media/445e90b032229c54129ea99217bf19c2cdd0d1a3/315_0_4582_3666/master/4582.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&over me cinnamon, rosemary, thyme, ginger, or cardamom to warm caramel sauce and serve it with the pie,\" Herbert said. \"Even traditionally savory herbs can complement sweet desserts.\" If you're not sure whether a particular herb would pair well with your pie, Herbert recommended closing your eyes and smelling the herb or spice — if you can detect something sweet in the scent, it's probably OK to use. Use salt to balance the sweetness of certain pie varieties. SEAGULL_L/Shuttershock Carlo Lamagna, chef and owner of Magna PDX , said that a dose of salt can help tone down the sweetness in syrupy pies. \"Salt helps accentuate flavors and balances out often overly sweet items,\" Lamagna said. If you don't want to sprinkle pure salt on your dessert, you can opt for crushed salted nuts, like peanuts or cashews, which will still do the trick and add extra texture. Remove your store-bought pie from its packaging to make it look homemade. A coat of chocolate can help keep a pie s filing in place. Animas Photography/Shutterstock Alexandra Lourdes, co-owner of Saint Honoré Doughnuts and Beignets, told BI that the easiest way to elevate a store-bought pie is to simply remove it from its original packaging. \"Make sure you take it out of the box it came in,\" Lourdes said. \"If you place it in a new box, add a ribbon, or arrange it on a beau", "date_str": "2026-10-26T14:21:39+00:00", "hash": "33696153a0ef0bb4", "title_fa": "به گفته نانواها و سرآشپزها، 12 راه آسان برای اینکه پایی که در فروشگاه خریداری می شود طعمی داشته باشد و خانگی به نظر برسد.", "summary_fa": "چند راه وجود دارد که می توانید مردم را فریب دهید تا فکر کنند پای خریده شده در فروشگاه شما خانگی است. راشل آسکیناسی سرآشپزها و نانوایان نکاتی را در مورد نحوه ساختن کیک های خریداری شده از فروشگاه به صورت خانگی و طعم بهتر به اشتراک گذاشتند. ذوب کردن کمی کره یا پاشیدن نمک روی پای می تواند به تعادل شیرینی آن کمک کند. پای خود را با پودر قند، حروف مات شده یا کمی کارامل تزئین کنید. همه وقت ندارند یک پای خوشمزه از ابتدا درست کنند. خوش ome-internet-ethernet-cable-zoom", "summary": "Terminating a Cat 6 ethernet cable Alistair Barr/Business Insider A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . A few weekends ago, my wife left on a business trip with one instruction: fix the Wi-Fi before I get back. Her Zoom calls kept dropping during important meetings, so I tracked an old Cat 6 ethernet cable from our data closet so I could hardwire her laptop to the interwebs. The only problem? It ended as a raw, cut end, and I had no idea how to terminate it with an ethernet plug. So I did what I do these days whenever I'm out of my depth: I asked ChatGPT . I sent it photos at every stage. It told me which tools to buy, showed me how to strip the cable, arrange the eight tiny wires in the right order, and even drew little diagrams when words weren't enough. When I got frustrated, it gave me a pep talk. My first attempt only delivered about 100 Mbps instead of our 1 Gbps internet connection. ChatGPT guessed two wires were faulty, suggested an inexpensive cable tester, interpreted the flashing lights from a photo, and confirmed the diagnosis. I cut the connector off and started again with a simpler plug it recommended. The result? Around 850 Mbps. My only complaint: ChatGPT would occasionally disappear down a rabbit hole with advice that was far more complicated than I needed, so I'd remind it I wasn't rewiring Silicon Valley. I just wanted my wife's Zoom calls to stop dropping. So far, her video calls have been perfect. Without ChatGPT, there's no chance I'd have pulled this off. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-10-26T14:00:01+00:00", "hash": "2c0296685445f0f5", "title_fa": "وای فای قوی همسر خوشبخت زندگی شاد. چگونه ChatGPT به من کمک کرد اینترنت خانگی خود را تعمیر کنم.", "summary_fa": "", "i       media: [{"source": "Billboard", "title": "Layoffs Are Reshaping the Music Industry. jump.global Wants to Train Executives for What’s Next", "link": "https://www.billboard.com/pro/jumpglobal-on-layoffs/", "summary": "The fourth annual jump.global summit in Los Angeles is just weeks away, on Nov. 8-10 and its founder, Nick Maiale , is convinced its timing couldn’t be more necessary. Just a few weeks ago, Universal Music Group made significant cuts to its staff at record labels like MCA, Def Jam Records, Republic Records, Capitol Records and more — a continuation of its layoffs, which kicked off back in 2024. Still, Universal is far from the only music company culling employees this year. “We need to dive into the fact that layoffs have become common in this industry,” Maiale tells Billboard. At the jump.global summit, which focuses on executive development, mental health and leadership skills for music professionals, Maiale preaches the gospel that every modern careerist should be in the “business of your first and last name.” At the conference, his name tags are just that — name tags. No company names and no titles are listed to create a level playing field. Related Universal Music Shakeup: Def Jam, Polydor, Interscope Execs to Exit as Company Completes 2024 Restructure Plan Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Instead, he wants attendees to be focused on getting to know each other on a human level. Even his panelists, some of whom bear impressively high ranking titles at major companies, don’t tout their credentials either. Every speaker is vaguely listed on the jump.global website as simply a “music business human.” Those who attend the three-day affair, which is part conference and part leadership retreat, are treated to a mix of small group break outs and panel, featuring names like Janelle Lopez Genzink, Stephen Brower, Jason Feinberg, Lexi Todd and Moody Jones. And while the summit has always been known to hand out free badges for people who have newly been laid off as a courtesy, Maiale says that, due to increased demand for these comped badges, he’s now upping the supply. This year, he estimates that 30% of attendees are laid-off employees looking for their next move. The other 70% are a mix of folks sent by their companies, folks who buy badges themselves and executive coaches. While Maiale is going to address layoffs and how work in the music industry is changing, he clarifies: “The conference is definitely not a place where people come simply to complain about how the music industry is doing. What we want to do is be solutions-focused and opp", "date_str": "2026-10-26T16:00:00+00:00", "hash": "2a751eddc5e9a76b", "title_fa": "اخراج ها در حال تغییر شکل صنعت موسیقی هستند. jump.global می‌خواهد مدیران اجرایی را برای آینده آموزش دهد", "summary_fa": "چهارمین اجلاس سالانه jump.global در لس آنجلس تنها چند هفته باقی مانده است، در تاریخ 8 تا 10 نوامبر و بنیانگذار آن، نیک مایال، متقاعد شده است که زمان بندی آن نمی تواند ضروری تر باشد. همین چند هفته پیش، گروه موسیقی یونیورسال کاهش قابل توجهی در کارکنان خود در شرکت‌های ضبط موسیقی مانند MCA، Def Jam Records، Republic Records، Capitol Records و موارد دیگر ایجاد کرد - ادامه اخراج‌هایش که در سال 2024 آغاز شد. Maiale به Billboard می گوید: «ما باید به این واقعیت بپردازیم که اخراج کارکنان در این صنعت رایج شده است. در اجلاس jump.global، که بر توسعه اجرایی، سلامت روان و مهارت‌های رهبری برای متخصصان موسیقی تمرکز دارد، Maiale این انجیل را موعظه می‌کند که هر حرفه‌ای مدرن باید در \"کسب و کار نام و نام خانوادگی شما\" باشد. در کنفرانس، برچسب‌های نام او دقیقاً همین است - برچسب‌های نام. هیچ نام شرکت و هیچ عنوانی برای ایجاد یک زمین بازی درج نشده است. تکان دادن موسیقی جهانی مرتبط: مدیران دف جم، پلی‌دور، اینترسکوپ با تکمیل طرح بازسازی سال 2024 از شرکت خارج می‌شوند. دیگر در سطح انسانی حتی اعضای میزگرد او، که برخی از آنها عناوین فوق‌العاده بالایی در شرکت‌های بزرگ دارند، اعتبار خود . Try to stay away. Be careful. Rubberband appears on McRae s Too Young to Be Sad EP. Midnight driving, running through Highland/ Does it make me the criminal?/ That I let you go/ That I broke us and left, she sings on the track. Del Rey s interaction with the stranger in need comes as the alt-pop singer-songwriter is earning praise for Lies, her new collaboration with Zach Bryan that dropped Oct. 15 on his eight-track Young Manhood and Other Donatable Organs project. Del Rey also recently released First Light, the theme song for the James Bond video game of the same name. She hasn t been doing many live performances as she continues perfecting her highly anticipated country album Stove , but Del Rey did recently perform at the F1 Grand Prix in Singapore. I can’t even tell you how happy we were to be there, thank you so much for showing up and getting us so excited, she wrote Friday (Oct. 23) on Instagram after the show. And to my amazing crew, band, singers dancers, etc. we really did it. I loved our rehearsals loved the show and everything that we did afterwards. Hope everybody is doing well, sending love.", "date_str": "2026-10-26T15:32:09+00:00", "hash": "8baa5381e56d648c", "title_fa": "لانا دل ری هنگام گوش دادن به تیت مک‌ری به غریبه کمک می‌کند «تلاش می‌کند از یک رابطه توهین‌آمیز دور بماند»", "summary_fa": "لانا دل ری در یک لحظه اخیر با موسیقی متن فیلم تیت مک ری به یک غریبه در لس آنجلس کمک کرد. مطالب مرتبط لانا دل ری با تم سورپرایز 007 برای اولین بازی ویدیویی لایت پس از کنسرت F1 سنگاپور به دنیای جیمز باند می پیوندد، لانا دل ری به بازدیدی دیگر از آسیا اشاره می کند لانا دل ری آهنگ جدیدی را که با همسر جرمی دوفرن نوشته شده درباره وودو در ازدواجشان منتشر شده است. 25) در استوری اینستاگرام خود نشان می دهد که در هنگام رانندگی شبانه در ماشین در حال گوش دادن به موسیقی است. دل ری در حالی که آهنگ 2021 رابربند مک‌ری را به صدا در می‌آورد، متوجه شخصی بیرون از پنجره می‌شود. وقتی در حال گوش دادن به آهنگ تیت در مورد هایلند هستید، وقتی پشت چراغ هایلند نشسته اید و زنی تابلویی را رو us Rucker, Lady A and Zac Brown, delivered 4.74 million total viewers on ABC and Disney+. According to a press release, the presentation ranked No. 1 in total viewers from 9 to 11 p.m. with 4.74 million. The music special also earned ABC its best Wednesday 9-11 p.m. performance in 2026, based on entertainment programming. The event was held at Belmont University s Fisher Center for the Performing Arts in Nashville. Following the special s airing, the CMA, in collaboration with Belmont University, The Walt Disney Company and the Nashville Convention Visitors Corp revealed that a previously announced commitment to Dolly Parton s Imagination Library resulted in a combined donation of $1 million. As artists celebrated the life and career of Parton, the event featured performances such as McEntire s rendition of He s Alive and Carrie Underwood s rendition of I Will Always Love You. Meanwhile, videos and photos from Parton s life filled the screens as stories from her life and career unfolded during the evening, and the stage was filled with flowers and decorations with Parton s signature butterfly imagery. CMA Presents I Will Always Love You: A Celebration of Dolly Parton is currently streaming on Disney+ and Hulu.", "date_str": "2026-10-26T15:01:17+00:00", "hash": "169ec00b648af4d9", "title_fa": "«CMA Presents I Will Always Love You: A Celebration of Dolly Parton» نزدیک به 5 میلیون بیننده به دست آورد", "summary_fa": "چندین هنرمند برای ادای احترام به تالار مشاهیر موسیقی کانتری (و در رؤیای اصلی دالیوود) دالی پارتون که در ماه آگوست درگذشت، برای CMA Presents I Will Always Love You: A Celebration of Dolly Parton در 21 اکتبر به نیروها پیوستند. این رویداد پر ستاره با اجرای هنرمندانی از جمله Reba McEntire، Brad Paisley، Ella Langley، Darius Rucker، Lady A و Zac Brown، 4.74 میلیون بیننده را در ABC و Disney+ داشت. طبق یک بیانیه مطبوعاتی، این ارائه در بین بینندگان از ساعت 9 تا 11 شب در رتبه اول قرار گرفت. با 4.74 میلیون این ویژه موسیقی همچنین بهترین روز چهارشنبه 9 تا 11 شب را برای . [ ]", "date_str": "2026-10-26T15:29:09+00:00", "hash": "9fae93f20f2f4042", "title_fa": "کتاب «ماندالوریان و گروگو» با طرح‌های اصلی، هنر مفهومی و مصاحبه‌های بازیگران در پشت صحنه قرار می‌گیرد.", "summary_fa": "طرفداران جنگ ستارگان در حال بررسی دقیق‌تر نحوه پرش دین جارین و گروگو از دیزنی پلاس به صفحه نمایش بزرگ هستند. The Art of Star Wars: The Mandalorian and Grogu، جلد گالینگور جدید 256 صفحه ای از Abrams Books، در 3 نوامبر وارد بازار می شود و نگاهی درونی به فرآیند خلاقانه پشت آخرین اکران سینمایی Lucasfilm ارائه می دهد. [ ] اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. به طور خاص، این کتاب به بررسی توسعه بصری شخصیت‌ها، مکان‌ها و وسایل نقلیه فیلم می‌پردازد. طراحی تولید بخش عمده‌ای از این سری از سال ۲۰۱۹ بوده است و زیبایی‌شناسی فیلم‌های اصلی «جنگ ستارگان» الهام گرفته از غرب را با محیط‌های جدیدی که با استفاده از فناوری Industrial Light Magic StageCraft ایجاد شده‌اند، ترکیب می‌کند، که از صفحه‌نمایش‌های LED برای تولید پس‌زمینه دیجیتال استفاده می‌کند. این کتاب همچنین شامل پیش‌گفتاری از داگ چیانگ، معاون ارشد و مدیر طراحی اجرایی لوکاس‌فیلم است که از سه‌گانه پیش درآمد روی این فرانچایز کار کرده و به ایجاد سبک بصری نمایش کمک کرده است. دو نسخه از کتاب را که منحصراً با Variety به اشتراک گذاشته شده است، در زیر ببینید. «Mandalorian and Grogu» که در ماه می اکران شد، اولین نمایش سینمایی این فرنچایز پس از «جنگ ستارگان: ظهور اسکای واکر» در سال ۲۰۱۹ بود و یکی از بزرگترین املاک اصلی دیزنی پلاس را پس از سه فصل پخش به سینماها آورد. «ماندالوریان» که توسط جان فاورو خلق شده است، ماجراهای شکارچی فضل کلاه دار پدرو پاسکال، دین جارین و همراه جوان حساس به نیرو او را در سال های پس از سقوط امپراتوری کهکشانی دنبال می کند. موفقیت آن مجموعه‌ای رو به رشد از پروژه‌های تلویزیونی «جنگ ستارگان» از جمله «کتاب بابا", "image_url": "https://variety.com/wp-content/uploads/2026/10/mandalorian-and-grogu-art-book.png?w=1000&#038;h=563&#038;crop=1", "category": "امنیت سایبری و شبکه", "tags": ["سینما"], "datetime_fa": "۴ آبان • ۱۸:۵۹"}, {"source": "Variety", "title": "NewFilmmakers L.A. Announces New Board Members as Non-Profit Partners With Sharjah Film Festival (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/newfilmmakers-board-members-sharjah-film-festival-1236931141/", "summary": "NewFilmmakers Los Angeles has announced four new board members and forged a strategic partnership in the United Arab Emirates with the Sharjah Intl. Film Festival for Children and Youth. Joining the board of directors of the non-profit arts and culture organization that is focused on championing independent filmmakers and content creators are: Beverly Hills-based entertainment [ ]", "date_str": "2026-10-26T15:22:50+00:00", "hash": "d6e275d9b59d2751", "title_fa": "NewFilmmakers L.A. اعضای جدید هیئت مدیره را به عنوان شرکای غیرانتفاعی جشنواره فیلم شارجه معرفی کرد (انحصاری)", "summary_fa": "NewFilmmakers لس آنجلس چهار عضو هیئت مدیره جدید را معرفی کرده و یک شراکت استراتژیک در امارات متحده عربی با شارجه بین المللی ایجاد کرده است. جشنواره فیلم کودک و نوجوان. پیوستن به هیئت مدیره سازمان غیرانتفاعی هنری و فرهنگی که بر حمایت از فیلمسازان مستقل و تولیدکنندگان محتوا متمرکز است عبارتند از: سرگرمی مبتنی بر بورلی هیلز [ ] NFMLA در حال گسترش دامنه بین المللی خود به امارات متحده عربی است. لری لابو، یکی از بنیانگذاران و مدیر اجرایی NFMLA در بیانیه ای. محبوب در تنوع، هر یک از این افراد در حالی که درک عمیقی از فرصت‌ها و چالش‌هایی که صنعت ما را شکل می‌دهند، شغلی چشمگیر ایجاد کرده‌اند. همزمان با این انتصابات هیئت مدیره، NFMLA همکاری جدیدی با شارجه بین المللی ایجاد کرده است. جشنواره فیلم کودکان و نوجوانان، در اقدامی که برنامه‌های بین‌المللی و مبادلات فرهنگی خود را در امارات متحده عربی گسترش می‌دهد. این مشارکت در طول دوره جاری جشنواره در سال 2026، که از 25 اکتبر تا 1 نوامبر در شارجه، که به عنوان پایتخت فرهنگی امارات متحده عربی شناخته می شود، برگزار می شود. این جشنواره که اکنون در سیزدهمین دوره خود قرار دارد، فیلم هایی را از تایلند، برزیل، هند، ایتالیا و سراسر جهان عرب با فهرستی از عناوین جشنواره های بین المللی، فیلمسازان نوظهور و استعدادهای اماراتی به امارات آورده است. Laboe اظهار داشت: یکی از جذاب‌ترین جنبه‌های کار ما در NFMLA این است که ببینیم فیلمسازان از پیشینه‌ها و بخش‌های مختلف جهان چگونه از طریق داستان‌هایشان با هم ارتباط برقرار می‌کنند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/NFMLA-New-Board-Graphic-2026-1000x677-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آبان • ۱۸:۵۲"}, {"source": "Variety", "title": "How ‘You Can See Everything’ Became a Surprise Box Office Hit (and Likely One of the Biggest Docs of All Time)", "link": "https://variety.com/2026/film/box-office/you-can-see-everything-box-office-how-a24-made-hit-movie-1236930697/", "summary": "You Can See Everything has remained a must-see at the box office, collecting a remarkable $19.5 million from 2,655 theaters in its second weekend a notable increase in ticket sales from its sizable opening. A24 s buzzy documentary about Theranos fraudster Elizabeth Holmes has grossed $45.1 million domestically to date and will be wildly profitable [ ]", "date_str": "2026-10-26T15:19:42+00:00", "hash": "4282a43e4e0c72e0", "title_fa": "چگونه «شما می‌توانید همه چیز را ببینید» به یک موفقیت شگفت‌انگیز باکس آفیس تبدیل شد (و احتمالاً یکی از بزرگ‌ترین اسناد تمام دوران‌ها)", "summary_fa": "«شما می‌توانید همه‌چیز را ببینید» همچنان در باکس آفیس باید تماشا کنید، و در دومین آخر هفته اکران خود از 2655 سالن سینما 19.5 میلیون دلار به دست آورد که افزایش قابل‌توجهی در فروش بلیت از افتتاحیه قابل توجه آن بود. مستند پر جنب و جوش A24 درباره الیزابت هولمز کلاهبردار Theranos تا به امروز 45.1 میلیون دلار فروش داخلی داشته است و بسیار سودآور خواهد بود. A24 شروع به پخش شما می توانید همه چیز را در 855 سالن سینما کنید، ردپایی عظیم برای یک مستند. (در مقایسه، خیابان بلیکر ماسک، نگاهی چهار ساعته به ثروتمندترین مرد جهان را در چهار لوکیشن به نمایش گذاشت.) این فیلم به لطف فروش بیش از 2000 نمایش فروخته شده، به 15.6 میلیون دلار اکران شد. داستان عجیب‌تر از داستان هولمز درست قبل از شروع ی کند، انجام داد و اذعان داشت که نمی تواند کاملاً اطمینان حاصل کند که اقدامات ایمنی خود در برابر خطر \"وجودی\" هوش مصنوعی می تواند موفقیت آمیز باشد. این افشاگری‌ها به عنوان بخشی از بیش از [ ] «نگرانی‌هایی در سازمان ما و سایر محققان، تنظیم‌کننده‌ها، سیاست‌گذاران و شرکت‌کنندگان در صنعت مطرح شده است که سیستم‌های هوش مصنوعی به اندازه کافی پیشرفته می‌توانند، در صورت عدم توسعه، استقرار و کارکرد با تدابیر حفاظتی، نظارت و امنیتی مناسب، خطرات فاجعه‌بار یا وجودی را به دنبال داشته باشند، اگر چنین سیستم‌هایی به طور نادرست برای بشریت مورد استفاده قرار گیرند، خطرات وجودی ایجاد کنند. به دنبال هشدار گروهی از محققان فعلی و سابق Anthropic در تابستان امسال مبنی بر اینکه این فناوری چنین خطراتی را به همراه دارد، این شرکت نوشت. محبوب در Variety برای مقابله با آن، آنتروپیک سیاست‌های ایمنی گسترده خود را در دفترچه SEC خود، که یک اولویت برای مدیر عامل داریو آمودی است، ارائه کرد. آمودی، که در سال 2021 با گروهی از همکاران سابق OpenAI، Anthropic را به دنبال فرار از رقیب سام آلتمن تأسیس کرد، از شرکت‌های هوش مصنوعی حمایت کرده است تا با هم متحد شوند و توسعه مدل‌های هوش مصنوعی را برای اطمینان از پروتکل‌های ایمنی کافی کاهش دهند. اما این شرکت اعتراف کرد که کار خودش به چنین پتانسیل مخربی کمک کرده است: «توسعه مدل‌ها، پلتفرم‌ها و برنامه‌های بسیار پیشرفته ما و گسترش موارد استفاده می‌تواند خطر آسیب رساندن به مدل‌های ما را بیشتر افزایش دهد.»", "image_url": "https://variety.com/wp-content/uploads/2026/09/2235057484.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "امنیت سایبری"], "datetime_fa": "۴ آبان • ۱۸:۴۹"}, {"source": "Variety", "title": "‘Good Girls’ Director on Life in Girls’ Correctional Center in Poland: ‘It Damages You Even More’ (EXCLUSIVE)", "link": "https://variety.com/2026/film/festivals/good-girls-ania-winiarskas-doc-correctional-center-clip-1236929596/", "summary": "Director Ania Winiarska almost gave up on “Good Girls.” “After six months, I felt like I’d hit a wall. I’ve never had this problem before,” she told Variety. “It wa , "tags": ["سینما"], "datetime_fa": "۴ آبان • ۱۸:۴۵"}, {"source": "Billboard", "title": "From CMA New Artist Award Nominees to the Country Music Hall of Fame: 14 Artists Who Made the Journey", "link": "https://www.billboard.com/lists/cma-new-artist-award-nominees-country-music-hall-of-fame/", "summary": "As Avery Anna , Carter Faith , Emily Ann Roberts , Tucker Wetmore and Stephen Wilson Jr. settle into their seats at Nashville’s Bridgestone Arena on Nov. 18 for this year’s CMA Awards, anxiously awaiting to hear which of them will take home the award for new artist of the year, they should keep in mind that this is just the start of their journey. If they’re lucky, their careers will continue for decades, and if they’re really lucky, they’ll one day be enshrined in the Country Music Hall of Fame. The CMA introduced the Horizon Award – the award’s original name — in 1981; it was renamed new artist of the year in 2008. Since then, 14 artists who were nominated in that category have gone on to be inducted into the Country Music Hall of Fame. The most recent case is Tim McGraw , who was nominated for the Horizon Award in 1994 and was elected to the Country Music Hall of Fame this year. Related Tim McGraw, Paul Overstreet Stanley Brothers Inducted Into Country Music Hall of Fame You may have noticed that I said McGraw was nominated for the Horizon Award. He didn’t win. He’s not alone in that. Nine of the 14 artists who were nominated for the Horizon Award and went on to be inducted into the Hall of Fame didn’t win the newcomer award. Patty Loveless was nominated twice and lost both times – to Ricky Van Shelton in 1988 and to Clint Black in 1989. (Neither of those men has yet been inducted into the Country Music HOF, though they may be in the future.) Moral of the story: If you’re nominated for a new artist award and don’t win, keep going. There are many chapters ahead of you. Garth Brooks was inducted into the Country Music Hall of Fame just 22 years after he was nominated for (and won) the Horizon Award – the fastest climb of any artist. Other artists who made this climb quickly are George Strait (23 years), Kenny Chesney (26 years) and Alan Jackson and Brooks Dunn (27 years each). Here’s a complete list of the 14 artists who were nominated for the CMA’s Horizon Award and went on to be inducted into the Country Music Hall of Fame. We show the year they were nominated for (and in some cases, won) the award; the year they were inducted into the Country Music Hall of Fame, their number of CMA Awards to date; their number of No. 1 hits on Billboard ’s Hot Country Songs chart to date; and their number of No. 1 albums on Billboard ’s Top Country Albums chart to date. We’ll update this list in years to come as more Horizon Award, and eventually new artist of the year", "date_str": "2026-10-26T14:58:04+00:00", "hash": "8bc776e70d54994c", "title_fa": "از نامزدهای جایزه هنرمند جدید CMA تا تالار مشاهیر موسیقی کشور: 14 هنرمندی که سفر را انجام دادند", "summary_fa": "در حالی که اوری آنا، کارتر فیث، امیلی آن رابرتز، تاکر وتمور و استفن ویلسون جونیور در 18 نوامبر در سالن بریجستون نشویل آرنا برای جوایز CMA امسال نشسته‌اند و مشتاقانه منتظر شنیدن این هستند که کدام یک از آنها جایزه هنرمند جدید سال را به خانه می‌برند. اگر آنها خوش شانس باشند، کارشان برای دهه ها ادامه خواهد داشت، و اگر واقعا خوش شانس باشند، روزی در تالار مشاهیر موسیقی کانتری ثبت خواهند شد. CMA جایزه Horizon - نام اصلی جایزه - را در سال 1981 معرفی کرد. در سال 2008 به عنوان هنرمند جدید سال تغییر نام داد. از آن زمان، 14 هنرمندی که در آن بخش نامزد شده بودند، به تالار مشاهیر موسیقی کشور راه یافتند. جدیدترین مورد تیم مک‌گرو است که در سال 1994 نامزد جایزه Horizon شد و امسال به عنوان تالار مشاهیر موسیقی کشور انتخاب شد. مرتبط تیم مک‌گرو، پل اورستریت برادران استنلی به تالار مشاهیر موسیقی کانتری راه یافتند شاید متوجه شده باشید که گفتم مک‌گرو نامزد جایزه Horizon شده است. او برنده نشد او در آن تنها نیست. 9 هنرمند از 14 هنرمندی که برای جایزه Horizon نامزد شده بودند و به تالار مشاهیر راه یافتند، جایزه lijft Netflix-kijkers verbazen", "link": "https://www.netflix-nederland.nl/onheilspellend-mysterie-blijft-netflix-kijkers-verbazen/", "summary": "Kijk s avonds eens naar buiten: wat zie je? Onheilspellende wolken, regendruppels, donkerte. En dan moet je eigenlijk wel een onheilspellende en mysterieuze film opzetten op Netflix, toch? Tip: waag je eens aan The Woman in Cabin 10. Onheilspellende film The Woman in Cabin 10 blijft Netflix-kijkers verbazen The Woman in Cabin 10 kwam in 2025 uit en is dus al een jaartje oud, maar de film is nog niet versleten! Het verhaal draait in ieder geval om Laura Lo Blacklock (Keira Knightley), een succesvolle journaliste die wordt uitgenodigd voor een exclusieve reis aan boord van een luxe jacht. Tijdens de tocht over de Noordzee bevindt ze zich tussen een select gezelschap van rijke en invloedrijke gasten. De reis lijkt een ideale gelegenheid om een bijzonder artikel te schrijven en even afstand te nemen van haar dagelijkse problemen. Op een nacht hoort Lo vanuit haar hut vreemde geluiden uit de aangrenzende cabine. Wanneer ze gaat kijken, denkt ze te zien hoe een vrouw overboord wordt gegooid. Geschrokken slaat ze onmiddellijk alarm, maar de bemanning beweert dat er niets ongewoons is gebeurd. Bovendien blijken alle passagiers en bemanningsleden aanwezig te zijn. Lo is ervan overtuigd dat ze daadwerkelijk een vrouw overboord heeft zien verdwijnen. Wanneer ze ontdekt dat de aangrenzende hut volgens de bemanning helemaal leeg had moeten zijn, wordt het mysterie alleen maar groter. Ze probeert andere passagiers te ondervragen en aanwijzingen te verzamelen, maar haar vasthoudendheid wordt door de mensen om haar heen steeds meer als verdacht gedrag beschouwd. Sommigen denken dat ze zich de gebeurtenis heeft ingebeeld. De situatie wordt nog ingewikkelder doordat Lo kort voor de reis een traumatische ervaring heeft meegemaakt. Daardoor begint ze soms zelfs aan haar eigen waarnemingsvermogen te twijfelen. Toch weigert ze haar onderzoek op     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
