داد و ابزارهای جدید هوش مصنوعی و یک آیفون تاشو جدید را تبلیغ کرد. مدل تاشو، iPhone Duo، دارای اندازه صفحه نمایش در هنگام باز شدن است که 80٪ بزرگتر از مدل فعلی Pro و 50٪ بزرگتر از [ ]"}, {"source": "Netflix NL", "title": "‘Legendarische’ misdaadklassieker op Netflix", "link": "https://www.netflix-nederland.nl/legendarische-misdaadklassieker-op-netflix/", "summary": "Al Pacino is anno 2026 86 jaar oud en hij acteert nog steeds, maar vroeger was de acteur natuurlijk een échte legende. Eén van zijn beste films (hij werd genomineerd voor een Oscar), een onvervalste misdaadklassieker, komt nu naar Netflix! Misdaadklassieker Serpico komt naar Netflix Het gaat om Serpico, een Amerikaanse misdaadfilm uit 1973 met Pacino in de hoofdrol. De film is gebaseerd op het waargebeurde verhaal van Frank Serpico, een politieagent in New York die zich verzet(te) tegen corruptie binnen zijn eigen korps. Frank Serpico begint als een idealistische agent die zijn werk serieus neemt en weigert steekpenningen aan te nemen. Al snel ontdekt hij dat corruptie onder zijn collega’s veel voorkomt: agenten accepteren geld van criminelen en beschermen elkaar wanneer er iets misgaat. Serpico wil daar niet aan meedoen, maar merkt dat zijn eerlijkheid hem juist tot een buitenstaander maakt. Wanneer hij probeert de misstanden aan te kaarten, krijgt hij weinig steun van zijn leidinggevenden. Zijn collega’s beginnen hem te wantrouwen en de druk op hem neemt steeds verder toe. Daardoor wordt zijn strijd niet alleen een kwestie van goed en fout, maar ook van persoonlijke veiligheid en de vraag hoe ver hij bereid is te gaan om de waarheid naar buiten te brengen. Al Pacino is een van de beste acteurs die er zijn Op IMDb krijgt Serpico een 7,7, en één reviewer schrijft: Al Pacino is een van de beste acteurs die er zijn en heeft veel iconische rollen op zijn naam staan. Zijn rol als Frank Serpico is daar zonder twijfel een van. In sommige scènes acteert hij met zoveel charme en souplesse, terwijl hij in andere juist explosief en intens is. De film draait voor een groot deel om corruptie binnen de politie en Serpico die de misstanden binnen het korps aan de kaak stelt. Dat is interessant en vormt de kern van het verhaal, maar de reden dat dit zo’n goede film is, ligt vooral bij het personage en niet zozeer bij de plot. De sterkste scènes gaan over Serpico’s persoonlijke leven en de worstelingen waarmee hij te maken krijgt. Er is bijvoorbeeld een prachtige scène waarin hij aan zijn vriendin uitlegt waarom hij altijd al politieagent heeft willen worden. Het zijn juist dat soort momenten waardoor je met hem gaat meeleven , sluit de recensent af. Vanaf 17 september kun je Serpico bekijken op Netflix! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep The post Legendarische misdaadklassieker op Netflix appeared first on Netflix Neder", "date_str": "2026-09-09T16:47:39+00:00", "hash": "b725d1ac44cd9a8a", "title_fa": "کلاسیک جنایی \"افسانه ای\" در نتفلیکس", "summary_fa": "در سال 2026، آل پاچینو 86 ساله است و هنوز هم بازیگر است، اما البته این بازیگر قبلا یک اسطوره واقعی بود. یکی از بهترین فیلم های او (او نامزد جایزه اسکار شد)، یک فیلم کلاسیک جنایی واقعی، اکنون به نتفلیکس می آید! سرپیکو کلاسیک جنایی به نتفلیکس می آید It is Serpico، یک فیلم جنایی آمریکایی محصول 1973 با بازی پاچینو است. این فیلم بر اساس داستان واقعی فرانک سرپیکو، یک افسر پلیس در نیویورک است که در داخل نیروهای خود با فساد مبارزه می کند. فرانک سرپیکو به عنوان یک پلیس ایده آل گرا شروع می کند که کار خود را جدی می گیرد و از گرفتن رشوه امتناع می ورزد. او به زودی متوجه می‌شود که فساد در میان همکارانش رایج است: افسران پول را از مجرمان می‌پذیرند و وقتی مشکلی پیش می‌آید از یکدیگر محافظت می‌کنند. سرپیکو نمی‌خواهد در این کار شرکت کند، اما متوجه می‌شود که صداقت او از او یک فرد خارجی می‌سازد. زمانی که او سعی می کند به سوء استفاده ها رسیدگی کند، حمایت کمی از مدیرانش دریافت می کند. همکارانش شروع به بی اعتمادی به او کرده و فشار روی او بیشتر می شود. در نتیجه، مبارزه او نه تنها به موضوع حق و باطل تبدیل می شود، بلکه به امنیت شخصی و اینکه تا چه حد حاضر است برای آشکار شدن حقیقت پیش برود، تبدیل می شود. آل پاچینو یکی از بهترین بازیگران دنیاست. در IMDb، Serpico امتیاز 7.7 را دریافت می‌کند و یکی از منتقدان می‌نویسد: آل پاچینو یکی از بهترین بازیگران موجود است و نقش‌های نمادین زیادی به نام خود دارد. نقش او در نقش فرانک سرپیکو بدون شک یکی از آنهاست. در برخی صحنه ها او با جذابیت و انعطاف زیادی عمل می کند، در حالی که در برخی صحنه ها انفجاری و شدید است. این فیلم"}, {"source": "Netflix NL", "title": "Geliefde thrillerserie neemt Netflix helemaal over", "link": "https://www.netflix-nederland.nl/geliefde-thrillerserie-neemt-netflix-helemaal-over/", "summary": "Seizoen 5 van Fauda staat pas net op Netflix, maar neemt de streamingdienst nu al over! De nieuwe afleveringen van deze Israëlische thrillerserie hebben zich al naar de vierde plek in de top 10 met meest bekeken series weten te schieten. Nu al in top 10 op Netflix Het vierde seizoen van Fauda kwam in juli 2022 uit, dus je kunt wel stellen dat de serie terug is van weggeweest. En dat wordt overduidelijk gewaardeerd door de Netflix-kijker . Iedereen lijkt in te schakelen op de nieuwe afleveringen. In seizoen 5 van Fauda staan Doron Kavillio (Lior Raz) en zijn Israëlische undercoverteam opnieuw centraal, maar het verhaal wordt ditmaal groter van opzet en speelt zich zowel in Israël als in Europa af. De nieuwe missie draait om een ernstige dreiging tegen de veiligheid van Israël. Doron en zijn collega s proberen een geplande aanval te voorkomen. Het vijfde seizoen van Fauda speelt zich ongeveer twee jaar na de aanslagen van 7 oktober 2023 af, en de gevolgen daarvan spelen een belangrijke rol in de nieuwe afleveringen. Seizoen 5 laat zien hoe de gebeurtenissen de leden van het team persoonlijk hebben veranderd en hoe hun behoefte aan vergelding botst met hun werk als antiterreureenheid. Fauda Daarbij wordt het team opnieuw gedwongen om undercover te opereren en doelwitten op te sporen, maar een belangrijk verschil met eerdere e groot is. De zussen proberen een plek in het nationale team te veroveren, waardoor de druk om te presteren flink toeneemt. Ook op liefdesgebied blijft het allemaal heel ingewikkeld. Adriana heeft inmiddels een relatie met Freddie, maar haar gevoelens voor haar voormalige schaatspartner Brayden zijn nog niet verdwenen. Terwijl ze zich op haar sportieve toekomst richt, moet ze opnieuw uitzoeken wat ze wil in de liefde. Wanneer komt Finding Her Edge seizoen 2 op Netflix? Onder anderen Nikita Olechko, Niamh Blackshaw en Matthew Finlan zijn toegevoegd aan de cast van Finding Her Edge, en de opnames van deze schaatsserie zijn as we speak volop aan de gang in Zuid-Ontario (in Canada). In december moet alles op beeld staan en dat betekent dat 2027 best eens gehaald zou kunnen worden voor de release! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Nieuwe afleveringen van Finding Her Edge op Netflix appeared first on Netflix Nederland - Films en Ser", "date_str": "2026-09-09T10:21:11+00:00", "hash": "be7792fdeafca388", "title_fa": "قسمت های جدید Finding Her Edge در نتفلیکس", "summary_fa": "فصل اول Finding Her Edge در 22 ژانویه از نتفلیکس پخش شد و می‌توانیم گزارش دهیم که روند تولید فصل 2 که اوایل امسال اعلام شد، در حال انجام است! اپیزودهای جدید Finding Her Edge در راه است خب، فقط یک خلاصه کوتاه: Finding Her Edge یک سریال درام عاشقانه در نتفلیکس است که درباره آدریانا روسو هفده ساله است که پس از مرگ مادرش اسکیت بازی را متوقف کرد. وقتی پیست یخ خانواده اش دچار مشکل مالی می شود، او تصمیم می گیرد برای نجات کسب و کار خانوادگی به ورزش برتر بازگردد. آدریانا با برایدن الیوت با اعتماد به نفس یک دوتایی جدید در حال رقص روی یخ تشکیل می دهد. برای به دست آوردن یک قرارداد مهم حمایت مالی، این دو وانمود می کنند که در یک رابطه هستند. با این حال، رابطه جعلی آنها با بروز احساسات واقعی به طور فزاینده ای پیچیده می شود. در همین حال، فردی شریک سابق اسکیت آدریانا و دوست پسر سابق او نیز به زندگی او بازگشته است. این سریال حول محور مثلث عشقی بین آدریانا، ب           <div>

            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
