  <style>

      --card-bg: #ffffff;
      --card-border: #e2e8f0;

      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {

      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      flex-shrink: 0;

    .tab-btn.active {

      flex-direction: column;
      gap: 16px;

      padding: 20px;

      position: relative;

      transform: translateY(-2px);
    }

      border-color: var(--read-border);

    }
    .news-card.is-read:hover {

    .news-header {

      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;

      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;

      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;

    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;

    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;

    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {

      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);

    .news-category-badge {

      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;

    .news-category-badge:hover {

      color: #0f172a;
      transform: translateY(-1px);

    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;

      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);

      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;

    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);

    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;

    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;

    .btn-mark-read {

      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;

    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;

    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);

      padding: 12px 16px;

      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);

    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }

      .btn-action { font-size: 0.78rem; padding: 6px 9px; }

      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }

      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

  <script>

5&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۱ آبان • ۱۸:۳۹"}, {"source": "Radio Farda", "title": "چالش تأمین گاز در اروپا در پی جنگ ایران و آمریکا؛ «زمستان امسال کمبودی نخواهد بود»", "link": "https://www.radiofarda.com/a/no-winter-gas-shortage-expected-in-europe-despite-lower-reserves/33889055.html", "summary": ".", "date_str": "2026-11-02T16:47:06+00:00", "hash": "9f08cdec1b450d47", "title_fa": "چالش تأمین گاز در اروپا در پی جنگ ایران و آمریکا؛ «زمستان امسال کمبودی نخواهد بود»", "summary_fa": "همزمان با انتشار گزارش‌هایی درباره پایین آمدن حجم مخازن ذخیره گاز در کشورهای اروپایی، مدیرعامل شرکت فرانسوی توتال‌انرژیز می‌گوید اروپا در زمستان امسال با کمبود گاز روبه‌رو نخواهد شد، اما برای تأمین گاز کافی ناچار است هزینه بیشتری بپردازد. پویانه روز دوشنبه ۱۱ آبان در نشست خبری درباره چشم‌انداز تقاضای انرژی توتال‌انرژیز گفت: «اشتباه اروپا در سال جاری، به‌ویژه در زمینه گاز، این بود که متأسفانه الزامات ذخیره‌سازی را یک سال زودتر از موعد تسهیل کرد. این تصمیم باعث شد زمستان را با ذخایر کمتری آغاز کنیم و در نتیجه فشار بر بازار افزایش یابد.» به گزارش رویترز، اروپا در شرایطی برای پر کردن دوباره مخازن خالی‌شده خود پیش از زمستان با آسیا بر سر محموله‌های گاز طبیعی مایع (ال‌ان‌جی) رقابت می‌کند که ابهام‌ها درباره سرنوشت جنگ آمریکا و اسرائیل با ایران و تأثیر آن بر صادرات قطر، یکی از بزرگ‌ترین تأمین‌کنندگان ال‌ان‌جی جهان، همچنان ادامه دارد. این وضعیت در فصل تابستان، که معمولاً معامله‌گران برای تأمین تقاضای زمستانی گاز را به مخازن تزریق می‌کنند، موجب افزایش قیمت‌ها شده است. آژانس همکاری نهادهای تنظیم مقررات انرژی اتحادیه اروپا در ماه آوریل اعلام کرده بود که با توجه به محدودیت عرضه جهانی، پر کردن مخازن تا سطح ۹۰ درصد دشوار خواهد بود و کشورها می‌توانند در عوض هدف ۸۰ درصدی را دنبال کنند؛ انعطافی که مقررات اتحادیه اروپا در شرایط دشوار بازار اجازه می‌دهد. بر اساس داده‌های انجمن زیرساخت گاز اروپا، مخازن گاز آلمان که بزرگ‌ترین تأسیسات ذخیره‌سازی گاز در اروپا هستند، زمستان را با پایین‌ترین سطح ذخایر ثبت‌شده آغاز می‌کنند. میزان پرشدگی این مخازن روز یکشنبه دهم آبان ۶۱.۰۳ درصد بود؛ رقمی که به‌مراتب پایین‌تر از میانگین ۷۴.۶۲ درصدی اتحادیه اروپاست. پویانه گفت نگاه کوتاه‌مدت و اولویت دادن به بهره‌وری اقتصادی، بازار گاز اروپا را با «واقعیتی تکان‌دهنده» روبه‌رو کرده است.", "image_url": "https://gdb.rferl.org/04fa39e1-a292-4b2c-a769-d04a8f4eab3d_w1200_h630.jpg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۱ آبان • ۲۰:۱۷"}, {"source": "IranWire", "title": "یک پژوهشگر فضای مجازی: پایداری‌چی‌ها مدیریت فضای مجازی را تسخیر کرده اند", "link": "https://iranwire.com/fa/features/159700-%DB%8C%DA%A9-%EF%AD%98%DA%98%D9%88%DA%BE%EF%BA%B7%EF%AE%95%D8%B1-%EF%BB%93%EF%BA%BF%EF%BA%8E%DB%8C-%EF%BB%A3%EF%BA%9F%D8%A7%D8%B2%DB%8C-%D9%BE%D8%A7%DB%8C%D8%AF%D8%A7%D8%B1%DB%8C%DA%86%DB%8C%D9%87%D8%A7-%EF%BB%A3%D8%AF%EF%AF%BE%D8%B1%EF%AF%BE%D8%AA-%EF%BB%93%EF%BA%BF%EF%BA%8E%DB%8C-%EF%BB%A3%EF%BA%9F%EF%BA%8E%D8%B2%DB%8C-%D8%B1%D8%A7-%EF%BA%97%EF%BA%B3%EF%BA%A7%EF%AF%BE%D8%B1-%EF%AE%90%D8%B1%D8%AF%D9%87%D8%A7%EF%BB%A7%D8%AF/", "summary": "«محمدرضا اصنافی» مدرس و پژوهشگر حوزه رسانه و فضای مجازی،در گفت و گو با «محمد فاضلی» جامعه‌شناس در کانال یوتیوبی «ایران‌تاک» به تحلیل ذین ...", "date_str": "2026-11-02T14:52:20+00:00", "hash": "f54434be20dce3a8", "title_fa": "یک پژوهشگر فضای مجازی: پایداری‌چی‌ها مدیریت فضای مجازی را تسخیر کرده اند", "summary_fa": "«محمدرضا اصنافی» مدرس و پژوهشگر حوزه رسانه و فضای مجازی،در گفت و گو با «محمد فاضلی» جامعه‌شناس در کانال یوتیوبی «ایران‌تاک» به تحلیل ذین ... پیشتر انصاف‌نیوز در شهریور ۱۴۰۵ و طی مصاحبه‌ای او را صریحا به عنوان «فعال رسانه‌ای اصولگرا» معرفی کرده‌بود اما در موضوع حکمرانی اینترنت، منتقد بخشی از سیاست‌های محدودکننده جمهوری اسلامی نیز بوده است. او که تحصیلکرده رشته تبلیغ و ارتباطات فرهنگی در دانشگاه سوره‌ است در این مصاحبه با تاکید بر این که در شیوه حکمرانی جمهوری اسلامی همه موبایل‌های مردم تا بن دندان به فیلترشکن‌ها و ابزارهای دسترسی مجهز شده‌اند گفته‌‌است : « فیلترینگ منافع پایدار هیچ بازیگری را تأمین نکرده و دسترسی عمومی به محتوا را از بین نبرده، بلکه صرفاً به یک اقدام برای رفع تکلیف تبدیل شده و تلفن‌های مردم را به انواع فیلترشکن‌ها مجهز کرده است». ایران‌وایر خلاصه‌ای از این گفت و گو که علاوه بر حکمرانی فضای مجازی و تاثیرات فیلترینگ به مسئله هوش مصنوعی در ایران پرداخته را خلاصه کرده‌ که در ادامه می‌خوانید. محمدرضا اصنافی در مصاحبه با محمد فاضلی ضمن اشاره به چرایی و فلسفه شکست پلتفرم‌های راه‌اندازی شده بومی در ایران به نقش سیاستگذاری غلط شورای عالی فضای مجازی و نهادهای امنیتی در ایران درباره فیلترینگ و محدودکردن سرمایه‌گذاران عرصه فضای مجازی پرداخته‌است. اصنافی درباره چگونگی شکل‌گیری پلتفرم‌های داخلی تصریح کرده‌است : «شبکه اجتماعی برای زنده ماندن و کسب سود نیازمند تولید و مالکیت داده‌های باارزش است. داده محصول اصطکاک آرا و گفت‌وگوست و گفت‌وگو تنها زمانی رخ می‌دهد که میان کاربران شکاف معنایی و تفاوت دیدگاه وجود داشته باشد. اگر همگان هم‌نظر باشند، ارتباط زنده شکل نمی‌گیرد. پلتفرم خارجی به دلیل نوع‌دوستی آزادی بیان نمی‌دهد، بلکه تجارت او بر مدار \"بیزینس آزادی بیان\" می‌چرخد؛ یعنی می‌داند با میزبانی از حداکثر تنوع و فراهم‌کردن بستر حضور طیف‌های مختلف—از مؤمن تا بی‌دین و از حامی تا", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Screenshot_2026-11-02_at_17.50.32_xbyV__v1024x512__box_0%2C12%2C2422%2C1287.jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۱ آبان • ۱۸:۲۲"}, {"source": "IranWire", "title": "حمله افراد مسلح به محل استقرار نیروهای فاطمیون و زینبیون در کنارک", "link": "https://iranwire.com/fa/news-1/159702-%D8%AD%D9%85%D9%84%D9%87-%D8%A7%D9%81%D8%B1%D8%A7%D8%AF-%D9%85%D8%B3%D9%84%D8%AD-%D8%A8%D9%87-%D9%85%D8%AD%D9%84-%D8%A7%D8%B3%D8%AA%D9%82%D8%B1%D8%A7%D8%B1-%D9%86%DB%8C%D8%B1%D9%88%D9%87%D8%A7%DB%8C-%D9%81%D8%A7%D8%B7%D9%85%DB%8C%D9%88%D9%86-%D9%88-%D8%B2%DB%8C%D9%86%D8%A8%DB%8C%D9%88%D9%86-%D8%AF%D8%B1-%DA%A9%D9%86%D8%A7%D8%B1%DA%A9/", "summary": "در پی حمله افراد مسلح به محل استقرار نیروهای وابسته به گروه‌های فاطمیون و زینبیون در یک مدرسه در روستای بیر سفلی از توابع شهرستان کنارک، ...", "date_str": "2026-11-02T15:27:09+00:00", "hash": "1eb680687380fa43", "title_fa": "حمله افراد مسلح به محل استقرار نیروهای فاطمیون و زینبیون در کنارک", "summary_fa": "در پی حمله افراد مسلح به محل استقرار نیروهای وابسته به گروه‌های فاطمیون و زینبیون در یک مدرسه در روستای بیر سفلی از توابع شهرستان کنارک، ... به گزارش حال‌وش، این حمله حوالی ساعت ۱۶ روز دوشنبه ۱۱ آبان ۱۴۰۵، در مدرسه بیر سفلی در روستای بیر، واقع در بخش کهیر شهرستان کنارک، رخ داد. بر اساس اطلاعات دریافتی حال‌وش، دو موتورسیکلت حامل افراد مسلح وارد روستا شدند و سرنشینان آن‌ها با شلیک رگبار، نیروهای مستقر در این مدرسه را هدف قرار دادند. در جریان این تیراندازی دست‌کم چند نفر کشته و زخمی شدند. به گفته منابع آگاه، پس از آغاز تیراندازی، یک خودروی سواری نیز در پشت سر موتورسیکلت‌ها وارد محل شد و درگیری میان مهاجمان و نیروهای مستقر در مدرسه ادامه یافت. هم‌زمان، شماری از نیروهای بسیج و مخبران محلی نیز برای مقابله با مهاجمان از محل‌های خود خارج شدند و در اطراف محل درگیری حضور یافتند. بر اساس اطلاعات اولیه، مدرسه بیر سفلی محل استقرار نیروهای وابسته به گروه‌های فاطمیون و زینبیون بوده است. با این حال، تاکنون اطلاعات مستقلی درباره هویت کشته‌شدگان و مجروحان و شمار دقیق تلفات این حمله منتشر نشده است. حال‌وش اعلام کرده که در حال پیگیری جزئیات بیشتر این حادثه است و اطلاعات تکمیلی را پس از بررسی و احراز صحت منتشر خواهد کرد. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B4%DB%B4%DB%B4%DB%B4_VjVw__v1024x512__box_0%2C1%2C752%2C397.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۱ آبان • ۱۸:۵۷"}, {"source": "IranWire", "title": "پزشکیان: مجتبی خامنه‌ای به دولت برای مذاکره با آمریکا «اختیارات» داده است", "link": "https://iranwire.com/fa/news-1/159701-%D9%BE%D8%B2%D8%B4%DA%A9%DB%8C%D8%A7%D9%86-%D9%85%D8%AC%D8%AA%D8%A8%DB%8C-%D8%AE%D8%A7%D9%85%D9%86%D9%87%D8%A7%DB%8C-%D8%A8%D9%87-%D8%AF%D9%88%D9%84%D8%AA-%D8%A8%D8%B1%D8%A7%DB%8C-%D9%85%D8%B0%D8%A7%DA%A9% ه خرید Cursor نبود، سود آن بیشتر می شد. ماسک اخیراً به Grok Bot اشاره کرده است که سریعترین رشد محصولی را دارد که من تا به حال در زندگی خود دیده ام. ماسک هنوز نحوه تأثیر محدودیت‌های استفاده مشترکین در حرکت رو به جلو را به اشتراک نگذاشته است. یک پاس بخرید، دومین جلد رایگان را در بوت کمپ موسس نهایی سال TechCrunch با آوردن هم بنیانگذار یا شریک خود به صورت رایگان کتاب قبل از انقضای قرارداد BOGO دریافت کنید", "image_url": "https://techcrunch.com/wp-content/uploads/2026/03/grok-getty.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۱ آبان • ۱۹:۵۳"}, {"source": "The Verge", "title": "Squarespace is laying off 19 percent of employees", "link": "https://www.theverge.com/tech/1024447/squarespace-layoffs-19-percent", "summary": "The website-building platform Squarespace is laying off 19 percent of its employees as it works to \"simplify\" its operations, Squarespace spokesperson Jeff Seedman says in a statement to The Verge . The job cuts will affect around 300 of Squarespace's 1,800 employees . \"The changes are intended to simplify how we operate, sharpen our priorities and enable the company to move faster as we position Squarespace for its next phase of growth,\" Seedman says. \"We are grateful for the contributions of our departing colleagues and are providing comprehensive support to help them through the transition.\" Seedman adds that impacted employees will receiv … Read the full story at The Verge.", "date_str": "2026-11-02T16:50:47+00:00", "hash": "81952e68bf1c6ba8", "title_fa": "Squarespace 19 درصد از کارمندان را اخراج می کند", "summary_fa": "جف سیدمن، سخنگوی Squarespace در بیانیه‌ای به The Verge می‌گوید پلتفرم وب‌سایت‌سازی Squarespace ۱۹ درصد از کارمندان خود را اخراج می‌کند زیرا برای «ساده‌سازی» عملیات خود تلاش می‌کند. این تعدیل مشاغل حدود 300 نفر از 1800 کارمند Squarespace را تحت تاثیر قرار خواهد داد. Seedman می‌گوید: «تغییرات به منظور ساده‌سازی نحوه عملکرد، تیز کردن اولویت‌های ما و امکان حرکت سریع‌تر شرکت با موقعیت Squarespace برای مرحله بعدی رشد است.» ما از کمک های همکاران در حال خروج خود سپاسگزاریم و حمایت همه جانبه ای برای کمک به آنها در دوران گذار ارائه می کنیم.\" Seedman اضافه می کند که کارمندان تحت تاثیر ... داستان کامل را در The Verge بخوانید. Tech News Labor Squarespace 19 درصد کارمندان را اخراج می کند اخراج حدود 300 کارگر را تحت تأثیر قرار می دهد. اما راث 2 نوامبر 2026، ساعت 4:50 بعد از ظهر UTC پیوند اشتراک گذاری عکس هدیه توسط بینگ گوان/بلومبرگ از طریق گتی ایماژ اما راث یک نویسنده خبری است که جنگ های جریان، فناوری مصرف کننده، رمزنگاری، رسانه های اجتماعی و موارد دیگر را پوشش می دهد. او پیش از این نویسنده و ویراستار MUO بود. جف سیدمن، سخنگوی Squarespace در بیانیه‌ای به The Verge می‌گوید پلتفرم وب‌سایت‌سازی Squarespace ۱۹ درصد از کارمندان خود را به دلیل تلاش برای «ساده‌سازی» عملیات خود اخراج می‌کند. این تعدیل مشاغل حدود 300 نفر از 1800 کارمند Squarespace را تحت تاثیر قرار خواهد داد. سیدمن می‌گوید: «تغییرات به منظور ساده‌سازی نحوه عملکرد، تیزتر کردن اولویت‌های ما و امکان حرکت سریع‌تر شرکت با موقعیت Squarespace برای مرحله بعدی رشد است.» ما از کمک های همکاران در حال خروج خود سپاسگزاریم و حمایت همه جانبه ای برای کمک به آنها در دوران گذار ارائه می کنیم. سیدمن می افزاید که کارمندان آسیب دیده 16 هفته حقوق پایه و مزایای مراقبت های بهداشتی تا می 2027", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-1247870734.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "ارز دیجیتال و بلاکچین", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۲۰:۲۰"}, {"source": "TechCrunch Main", "title": "SpaceX reportedly wants to buy Boost Mobile to compete with AT&T, T-Mobile, and Verizon", "link": "https://techcrunch.com/2026/11/02/spacex-reportedly-wants-to-buy-boost-mobile-to-compete-with-att-t-mobile-and-verizon/", "summary": "SpaceX has been looking for new ways to use its Starlink network, and a tie-up with cellular operator Boost Mobile could give it the terrestrial access it needs.", "date_str": "2026-11-02T16:44:48+00:00", "hash": "1bf7af18cc3bd074", "title_fa": "اسپیس ایکس برای رقابت با AT&T، T-Mobile و Verizon می خواهد Boost Mobile را خریداری کند.", "summary_fa": "SpaceX به دنبال راه‌های جدیدی برای استفاده از شبکه Starlink خود بوده است و ارتباط با اپراتور تلفن همراه Boost Mobile می‌تواند دسترسی زمینی مورد نیاز آن را به آن بدهد. طبق گزارش واشنگتن پست، اسپیس ایکس به دنبال خرید Boost Mobile از EchoStar است. اگر این معامله انجام شود، به شرکت تحت مالکیت ایلان ماسک کمک می‌کند تا یک شبکه سلولی-ماهواره‌ای ترکیبی بسازد که می‌تواند به منجنیق کردن آن در جایگاه چهارم در میان برترین ارائه‌دهندگان بی‌سیم ایالات متحده کمک کند. این شرکت پرتاب کننده فضایی در زمینه اتصال سلولی فعالیت می کند و دسترسی ماهواره ای به مشترکان T-Mobile را در سال 2024 ایجاد می کند. سال گذشته، اسپیس ایکس 17 میلیارد دلار طیف بی سیم از EchoStar برای خدمات سلولی خریداری کرد که می تواند به سرویس Starlink این شرکت کمک کند تا به داخل ساختمان ها دسترسی پیدا کند، چیزی که در حال حاضر با آن مشکل دارد. ماسک در زمان دستیابی به طیف در ایکس گفت: «این آخرین قطعه حیاتی از پازل طیفی است که SpaceX برای ارائه پوشش کامل تلفن در آمریکا مورد نیاز است. با این حال، اگر ماسک همچنان به دنبال خرید دسترسی به شبکه‌های زمینی است، ظاهراً این آخرین قطعه نبوده است. طبق گزارش ها، ایلان ماسک، مدیرعامل اسپیس ایکس، در ماه اکتبر به طور مستقیم با چارلی ارگن، رئیس EchoStar، درباره خرید Boost Mobile، اپراتور شبکه مجازی موبایل صحبت کرد. EchoStar حدود 7.5 میلیون مشتری بین Boost Mobile و GenMobile، دیگر ارائه خدمات تلفن همراه خود دارد. ماسک همچنین با AT T، T-Mobile، و Verizon در مورد خرید ظرفیت در شبکه های خود تماس گرفته است. هر سه ماسک را رد کردند و ممکن است همچنان در خرید Boost Mobile اسپیس ایکس حرفی برای گفتن داشته باشند. Boost برج‌های خود را راه‌اندازی نمی‌کند، در عوض ظرفیت را از AT T", "image_url": "https://techcrunch.com/wp-content/uploads/2025/09/starlink-direct-to-cell.jpg?resize=1200,601", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۲۰:۱۴"}, {"source": "Engadget", "title": "One annoying problem with the iPhone Messages app has an easy fix", "link": "https://www.engadget.com/2300351/one-problem-iphone-messages-additional-options-easy-fix/", "summary": "Apple s iMessage app offers a lot of useful features and several default apps included in its latest update. However, they may be in an order you dislike.", "date_str": "2026-11-02T16:45:00+00:00", "hash": "dfa6db653f4d9118", "title_fa": "یکی از مشکلات آزاردهنده برنامه پیام های آیفون راه حل آسانی دارد", "summary_fa": "برنامه iMessage اپل بسیاری از ویژگی های مفید و چندین برنامه پیش فرض را ارائه می دهد که در آخرین به روز رسانی آن گنجانده شده است. با این حال، آنها ممکن است به ترتیبی باشند که شما دوست ندارید. iMessage اپل را می‌توان برای مطابقت با نیازهای شما سفارشی کرد، هر چند که Hocus-focus/Getty Images را دوست دارید، Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover iMessage اپل در طول سال‌ها پیشرفت زیادی کرده است. در به‌روزرسانی‌های اخیر، شرکت کوپرتینویی همه چیز را اضافه کرده است، از پیام‌رسانی ماهواره‌ای که می‌تواند به مخاطب اضطراری شما در حالی که در یک مکان از راه دور هستید دسترسی پیدا کند تا تغییرات زیبایی‌شناختی مانند پس‌زمینه‌های قابل تنظیم. در جریان بودن این تغییرات ممکن است دشوار باشد، به خصوص زمانی که اپل هر سال یک به روز رسانی جدید iOS را منتشر می کند. علی‌رغم این به‌روزرسانی‌ها، کاربران اغلب از ناراحتی ترتیب‌بندی برنامه iMessage خود ابراز تاسف می‌کنند. به عنوان مثال، چرا برنامه‌هایی که هرگز استفاده نکرده‌اید در بالای منوی کشویی قرار دارند، در حالی که برنامه‌های پراستفاده شما در پایین باقی می‌مانند؟ پاسخ این است که احتمالاً برای سفارشی کردن چیدمان منو وقت نگرفته اید. برخی از تأثیرگذارترین تغییرات از طریق معرفی برنامه های iMessage رخ داده است. از زمان معرفی iOS 18، چندین اپلیکیشن به صورت پیش فرض در اپلیکیشن پیام رسان نصب شده است. از آخرین به روز رسانی، iOS 27، 14 برنامه به طور پیش فرض گنجانده شده است. این برنامه های محبوب ویژگی هایی مانند ارسال موقعیت مکانی شما، ضبط های صوتی، استیکرها، فایل های GIF، موسیقی، عکس ها و نظرسنجی ها را به همراه دارند. سایر برنامه ها، مانند ESPN و Venmo، عملکردهای ing discipline. Such a development could spark a chain reaction along the supply chain that supports the AI buildout, hindering the bull market. Hyperscaler finances are starting to deteriorate. Investors are worried about hyperscaler finances, with cash flow turning negative at some firms even amid promises of heftier capex spend in 2027. Amazon, Alphabet, Meta, Oracle, and Intel are several of the giants in the space that are cash flow negative, stoking investor jitters. To market bears, the contradicting fears are pointing to two conclusions: 1), the AI bubble may be entering its final stages, and 2), it's time for investors to prepare their portfolios for a major upheaval. \"The market message from last week's action boils down to this: both sides of the AI trade are faltering at once,\" top economist David Rosenberg wrote in a note to clients on Monday, pointing to painful losses in hyperscalers and AI suppliers, like neoclouds , last week. \"When stocks on both sides of the same trade fall on opposite news, the problem is the trade itself. In short, the market is pricing in a lower return on AI spending,\" he added. Bearish investing pros on Wall Street are outlining the w", "date_str": "2026-11-02T16:24:27+00:00", "hash": "5a3cde744f6fabdb", "title_fa": "اگر فکر می کنید حباب هوش مصنوعی در شرف ترکیدن است، چگونه سرمایه گذاری کنید", "summary_fa": "ترس از این که حباب هوش مصنوعی در شرف ترکیدن است، با متلاطم شدن تجارت هوش مصنوعی به خط مقدم باز می گردد. مایکل ناگل/ بلومبرگ از طریق گتی ایماژ پس از شکست روز جمعه، نگرانی ها در مورد سلامت تجارت هوش مصنوعی افزایش یافته است. طرفداران بازار در مورد چگونگی آماده شدن برای یک اصلاح بزرگتر در بحبوحه جدیدترین کج خلقی این بخش می اندیشند. سرمایه‌گذاران نادان باید استراتژی‌هایی مانند سرمایه‌گذاری با هالتر و افزودن به موارد دفاعی را در نظر بگیرند. خرس ها هشداری برای سرمایه گذاران دارند: حباب هوش مصنوعی ممکن است در آستانه ترکیدن باشد. این ترس در هفته گذشته به دلیل سقوط تجارت هوش مصنوعی و سپس سقوط در روز جمعه، با توجه به خوش بینی های livery fee and come with \"reduced service fees,\" the company said. The boxes aren't just cheap eats. Like many value-priced options, they're meant to draw customers to restaurants, hoping to get them to order other items or come back later. \"Meal Boxes are designed to drive a steady stream of everyday orders and introduce restaurants to new customers,\" DoorDash said in its statement. The deal is the latest value option for diners. Restaurant chains from McDonald's to Chili's have revamped their meal-deal offerings in recent years as food inflation has squeezed many consumers. Many customers have continued to order food for delivery while cutting their spending in other areas, despite added costs such as delivery fees and tips. DoorDash's $12 boxes might be an acknowledgment that some diners are seeking budget-friendly options and convenience simultaneously. Do you have a story idea about DoorDash? Contact this reporter at abitter@businessinsider.com or via encrypted messaging app Signal at 808-854-4501. Use a personal email address, a nonwork WiFi network, and a nonwork device; here's our guide to sharing information securely . Read the original article on Business Insider", "date_str": "2026-11-02T16:24:19+00:00", "hash": "48e7522f5e86da04", "title_fa": "DoorDash با یک وعده غذایی 12 دلاری وارد جنگ ارزش رستوران می شود", "summary_fa": "DoorDash جعبه های غذای 12 دلاری را در برخی شهرها ارائه می دهد. تام ویلیامز/CQ-Roll Call، Inc از طریق Getty Images DoorDash در برخی شهرها پیشنهادات وعده غذایی 12 دلاری ارائه می دهد. جعبه‌های ارزش شامل وعده‌های غذایی کامل از رستوران‌های محلی - و بدون هزینه تحویل است. این جدیدترین شرکت کننده در جنگ ارزش-معامله رستوران است. DoorDash در حال ورود به بازی وعده غذایی است. روز دوشنبه اعلام شد که سرویس تحویل، جعبه های غذای 12 دلاری را در \"مناطق منتخب در بیش از 20 شهر\" از جمله آتلانتا، شیکاگو و فیلادلفیا ارائه می دهد. وعده های غذایی توسط رستوران های محلی پر می شود و حاوی پروتئین، سبزیجات و کربوهیدرات است. این شرکت گفت، آنها همچنین هزینه تحو closes its financials ahead of its much-anticipated initial public offering. The company filed the original paperwork last week. Monday's amendments include the third-quarter numbers that didn't make it into the initial filing: Anthropic generated nearly $17 billion in revenue during the period, a more than $5 billion increase from the prior quarter and roughly 12X year over year. But the compute required to power that growth weighed on the business. Anthropic swung back to a $567 million operating loss in the third quarter, after reporting $974 million in operating income in the second. Anthropic wrote in the filing that its Q3 operating loss was \"primarily driven by $5.0 billion of compute under short-term commitments,\" which it said costs significantly more than comparable multiyear arrangements. The company also disclosed about $895 billion in committed spending on compute and infrastructure — nearly half of it expected by the end of 2030. Anthropic's fresh disclosure illustrates the often shifting economics of the AI race. While their increasingly capable AI products are spurring adoption, the frontier labs are also committing to enormous amounts of computing capacity — which can take years to build and come online — in an effort to meet anticipated demand. Anthropic's compute and infrastructure charges rose to $9.9 billion in the third quarter. That's a 4X increase in one year. Anthropic also reported $2 billion in non-cash charges related to its donation-matching program , where employees can pledge equity awards to charitable causes, and the company matches the pledge with nonvoting Class N shares. The company has not yet disclosed an IPO price range, number of shares, or the size of the offering. Read the original article on Business Insider", "date_str": "2026-11-02T16:21:52+00:00", "hash": "b1e053b4c1d77127", "title_fa": "اسناد IPO اصلاح شده Anthropic نشان می دهد که درآمد سه ماهه سوم و یک صورت حساب محاسباتی خیره کننده وجود دارد.", "summary_fa": "به روز r-no-retirement-2026-11", "summary": "Richard Woulfe retrained as a flight attendant at 61. Courtesy of Richard Woulfe Richard Woulfe became restless soon after his 60th birthday and wanted a new challenge. He launched into the third chapter of his life as a flight attendant for a major US airline. Woulfe said that Gen X qualities , such as flexibility and a willingness to listen, have helped him. This story is based on an interview with Richard Woulfe , 63, a flight attendant from Fort Worth, Texas. It has been edited for length and clarity. I have always been in the travel business. Starting out in 1986, I worked at an event management company that often organized employee reward trips for large corporations. We offered VIP transportation, including meet-and-greets at airports, as well as luxury food and beverages. Have you got a story about launching a career in mid or later life? Please email Jane Ridley at jridley@businessinsider.com if you'd like to be interviewed by Business Insider. I enjoyed it very much, but I wanted to monetize my passion for scuba diving, which led me to become certified as an instructor at 19. Around 2008, I moved into my second career selling scuba diving trips. They were mostly done through high-end dive shops and targeted at affluent customers. I visited the Maldives more than 15 times They wanted to explore countries like Papua New Guinea, Indonesia, and the Philippines . It was fun to accompany them to places like the Maldives, which I must have visited more than 15 times. Woulfe traveled across the world in his previous jobs. Courtesy of Richard Woulfe Then the pandemic struck. My main markets shut down as destinations such as Thailand imposed travel restrictions. I returned to the city of Chicago , where I grew up, and took a little time off, spending time with my mom and dad. Dad, in his early 90s, was quite sick, and I wanted to be with him as much as possible. After I turned 60 in March 2023, Mom looked at me one day and asked if there was something wrong. I told her I wasn't depressed, but I was feeling restless. I texted my friend, who had been a flight attendant since 2018, for advice She encouraged me to get back to work. Life expectancies are long these days — I could live for another 35 years — and I didn't want to retire. I read that some of the major US airlines were hiring thousands of flight attendants. I texted my friend, who had been a one since 2018, for advice. His reply was two words long: \"Do it!\" he said. I'd been a passenger on countles", "date_str": "2026-11-02T15:52:45+00:00", "hash": "f82ea33cb61adb98", "title_fa": "60 ساله شدم و متوجه شدم که آماده بازنشستگی نیستم. مهماندار هواپیما شدم و سومین شغلم را شروع کردم.", "summary_fa": "ریچارد وولف در 61 سالگی به عنوان مهماندار هواپیما آموزش دید. با حسن نیت از ریچارد وولف ریچارد وولف بلافاصله پس از تولد 60 سالگی خود بی قرار شد و خواهان یک چالش جدید بود. او به عنوان مهماندار هواپیما در یک شرکت هواپیمایی بزرگ ایالات متحده وارد فصل سوم زندگی خود شد. وولف گفت که ویژگی های Gen X، مانند انعطاف پذیری و تمایل به گوش دادن، به او کمک کرده است. این داستان بر اساس مصاحبه ای با ریچارد وولف، 63 ساله، مهماندار هواپیما از فورت ورث، تگزاس است. برای طول و وضوح ویرایش شده است. من همیشه در تجارت سفر بودم. از سال 1986 شروع به کار کردم، در یک شرکت مدیریت رویداد که اغلب سفرهای پاداش کارکنان را برای شرکت های بزرگ ترتیب می داد، کار می کردم. ما حمل و نقل VIP، از جمله استقبال و استقبال در فرودگاه ها، و همچنین غذاها و نوشیدنی های لوکس را ارائه کردیم. آیا داستانی در مورد راه اندازی شغلی در اواسط یا اواخر زندگی دارید؟ اگر می خواهید با Business Insider مصاحبه کنید، لطفاً به جین ریدلی به آدرس jridley@businessinsider.com ایمیل بزنید. من از آن بسیار لذت بردم، اما می‌خواستم از علاقه‌ام به غواصی درآمدزایی کنم، که باعث شد در 19 سالگی به عنوان مربی گواهینامه دریافت کنم. در حدود سال 2008، به دومین حرفه‌ام در زمینه فروش سفرهای غواصی رفتم. آنها بیشتر از طریق مغازه های غواصی سطح بالا انجام می شدند و مشتریان مرفه را هدف قرار می دادند. من بیش از 15 بار از مالدیو باز  the country's most storied law firms, had announced plans to wind down after an exodus of high-profile partners. The 95-year-old institution, which made its name handling some of the biggest bankruptcies in American history, couldn't find a way to save itself. The table seemed to agree: AI didn't kill Weil. But the firm's implosion exposed vulnerabilities that large law firms have always faced. And it raised a question: Could AI make those weaknesses worse? Or could it actually help law firms become less fragile? A spokesperson for Weil did not respond to a request for comment. AI-as-a-tourniquet Eric Greenberg is the general counsel of Cox Media Group. Carl Timpone/BFA Big Law is made up of enormously profitable institutions. Many have survived wars, recessions, and tectonic shifts in the technology that helps their lawyers work. Yet a handful of departures can set off a chain reaction that threatens to bring the whole thing down in months or weeks. Eric Greenberg, the general counsel of Cox Media Group, argued that law firms have always been vulnerable. But the white-hot lateral market is making them especially so. \"This is really a case where you had a run on the ban", "date_str": "2026-11-02T15:30:35+00:00", "hash": "11765d5af7edcea1", "title_fa": "هوش مصنوعی ویل را غرق نکرد. می تواند از شکست بعدی قانون بزرگ جلوگیری کند.", "summary_fa": "", "image_url": "https://i.insider.com/6ae8a3e6d8cc18cf79510150?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۱ آبان • ۱۹:۰۰"}, {"source": "Business Insider", "title": "2 years ago today, TGI Fridays declared bankruptcy. Now, its CEO says the company never thinks about it.", "link": "https://www.businessinsider.com/tgi-fridays-performance-after-declaring-bankruptcy-2026-10", "summary": "TGI Fridays CEO said the company is focusing on its franchisees rather than its bankruptcy filing. Chris Ison/PA Images via Getty Images TGI Fridays filed for bankruptcy two years ago today on November 2, 2024. Since then, the chain has brought in new leadership, closed locations, and updated the menu. CEO Ray Blanchette said the company is moving forward following its bankruptcy filing. Two years after TGI Fridays' former corporate entity filed for Chapter 11 protection, the casual-dining brand is pitching itself as a comeback story. Ray Blanchette , the CEO of TGI Fridays and the founder of Sugarloaf Hospitality, which owns and franchises the brand, told Business Insider that the company is seeing \"a resurgence of the brand.\" \"The consumer is now beginning to re-recognize that casual dining has inherent value,\" he said. Blanchette, who returned as CEO in January 2025 after working as a full-time franchisee, also said the chain is focused on supporting franchisees and helping them to grow their businesses. \"The turnaround only works if our franchisees are healthy, period,\" he said. \"We don't spend any time at all thinking about the bankruptcy from two years ago. It's never discussed.\" The rise, fall, and reinvention of TGI Fridays TGI Fridays hopes to operate 1,000 restaurants globally by 2030. Johnny Green/PA Images/PA Images/Getty Images TGI Fridays began as a New York City singles bar in the 1960s before growing into a global casual-dining chain known for burgers, cocktails, and shareable appetizers. However, TGI Fridays' US presence shrank throughout the 2010s as the chain closed more than 200 restaurants . TGI Fridays also shelved plans to go public in 2020 as the COVID-19 pandemic upended the restaurant industry. TGI Fridays filed for Chapter 11 bankruptcy on November 2, 2024, with Reuters reporting that the chain was facing $37 million in debt and planned to restructure by selling off its assets by January 2025. In early 2025, TGI Fridays sold or closed its company-owned restaurants, and Ray Blanchette took over as CEO. Sugarloaf Hospitality, which is owned and operated by Blanchette, took over the brand's remaining assets. The business is merican-moved-to-greece-lifestyle-habits-changes-shopping-culture-2026-11", "summary": "Living in Greece has changed the way I shop, eat, and dress. Kathleen O Donnell I've lived in Greece for over four years now, and my lifestyle and routine have changed a lot. I used to wear athleisure to run errands, but now I dress up every time I leave the house. I also eat meals later and have a different grocery-shopping routine. After more than four years of living in Athens, Greece , I've still retained a few very American habits. For instance, I love sleeping with my AC on at 70 degrees Fahrenheit in the summer, and waking up to make a big breakfast of waffles with maple syrup. I still don't take a two-week vacation in August, although I dream of doing it someday. I grew up in Boston and lived in the US for the first 33 years of my life, so it makes sense that I've stuck with a few American tendencies despite my years abroad. But whenever I visit back home, I realize how much I've adjusted to many Greek-inspired habits. These are the ones that have become an integral part of my lifestyle now. The way I dress has changed I no longer wear athleisure to run errands. Kathleen O Donnell In the US, I'd think nothing of leaving my house in athleisure clothes to run errands — stretchy leggings, a zip-up sweatshirt, hair scraped into a messy bun. Here in Greece, however, I don't even go to the grocery store dressed like that anymore. I pull on a proper pair of jeans and a top, tie up my leopard-print Converse sneakers or step into my pink Birkenstock sandals, and arrange my hair into a French twist if it's too messy to wear it down. I also take at least a minute or two to pull my face together before I go — brushing my eyebrows into place and slicking on a little lip color to look a bit more presentable. In my experience, it's very uncommon here to see people outside their homes looking unpolished or untidy. This doesn't mean everyone runs errands in formal attire (hence my Converse and jeans), but it's seen as bad manners to leave the house looking like you just rolled out of bed. Now, the only time I wear gym clothes is when I'm actually on my way to the gym. My grocery shopping routine looks very different Farmers markets in Athens look very different from what I m used to. Kathleen O Donnell When I lived in downtown Boston, I had a routine: I'd walk a mile to the nearest Whole Foods and buy everything I needed for the week ahead, lugging my overstuffed backpack home. Now, in Athens, I shop quite differently. On Friday mornings I go to the laiki agora, or", "date_str": "2026-11-02T14:52:01+00:00", "hash": "822e3437230e975c", "title_fa": "من 4 سال پیش به یونان نقل مکان کردم. سبک زندگی و عادات من بیش از آنچه انتظار داشتم تغییر کرده است.", "summary_fa": "زندگی در یونان نحوه خرید، غذا خوردن و لباس پوشیدن من را تغییر داده است. Kathleen O Donnell من بیش از چهار سال است که در یونان زندگی می کنم و سبک زندگی و روال زندگی من بسیار تغییر کرده است. من قبلاً برای انجام کارها لباس ورزشی می پوشیدم، اما اکنون هر بار که از خانه بیرون می روم لباس می پوشم. من همچنین بعداً غذا می‌خورم و روال خرید مواد غذایی متفاوتی دارم. پس از بیش از چهار سال زندگی در آتن، یونان، من هنوز چند عادت آمریکایی را حفظ کرده ام. برای مثال، من عاشق این هستم که در تابستان با AC روشن با دمای 70 درجه فارنهایت بخوابم و از خواب بیدار شوم تا یک صبحانه بزرگ از وافل با شربت افرا درست کنم. من هنوز یک تعطیلات دو هفته ای در ماه اوت نمی گیرم، اگرچه آرزو دارم روزی آن را انجام دهم. من در بوستون بزرگ شدم و 33 سال اول زندگی ام را در ایالات متحده زندگی کردم، بنابراین منطقی است که علیرغم سال‌هایی که در خارج از کشور بودم، به چند گرایش آمریکایی پایبند بوده‌ام. اما هر زمان که به خانه باز می گردم، متوجه می شوم که چقدر با بسیاری از عادات یونانی الهام گرفته شده ام. اینها همان هایی هستند که اکنون به بخشی جدایی ناپذیر از سبک زندگی من تبدیل شده اند. نحوه لباس پوشیدن من تغییر کرده است، دیگر برای انجام کارهای ورزشی لباس ورزشی نمی پوشم. Kathleen O Donnell در ایالات متحده، فکر نمی‌کنم از خانه‌ام با لباس‌های ورزشی برای انجام امور خارج شوم - شلوارهای شلوار چسبان، یک سویشرت زیپ‌دار، موهایی که به صورت یک موی درهم کشیده شده است. با این حال، اینجا در یونان، من دیگر حتی با آن لباس به خواربار فروشی نمی روم. یک شلوار جین مناسب و یک تاپ می‌پوشم، کفش‌های", "image_url": "https://i.insider.com/6ae4b2078bd5d6547af340f9?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۸:۲۲"}, {"source": "Business Insider", "title": "The suburbs were an escape from city life. Now, millennials want them to become more like cities.", "link": "https://www.businessinsider.com/millennials-want-walkable-suburbs-third-spaces-2026-11", "summary": "A NAR report found that homebuyers are willing to pay more to live in walkable neighborhoods. Tony Anderson/Getty Images Cities were once the main option for living within walking distance of parks, cafés, and shops. Now, the suburbs are getting the same treatment as developers build walkable, amenity-rich communities. A NAR survey found that buyers will even pay more to live in these types of neighborhoods. Joseph Hajjar and his wife had spent years living in big cities , where they enjoyed the fast-paced lifestyle and endless options for things to do. So when they decided to settle in the suburbs and raise their two young daughters, they had a few non-negotiables. \"We had a spreadsheet going, and the towns that checked a lot of boxes were the ones with walkability and a good restaurant scene,\" Hajjar, 40, told Business Insider. \"We were also looking for a strong sense of community.\" They ultimately chose Summit, New Jersey , a small commuter suburb about 22 miles from New York City. They paid $1.4 million for a roughly 3,500-square-foot home — far larger than their two-bedroom condo in Jersey City. It even came with an upstairs attic they use to host guests, a yard, and a garden, features they could only have dreamed of having in the city. Sure, they're paying more than when they were living in the city. But one of the home's biggest perks is its proximity to Summit's historic downtown, where the family can walk to shops, cafés, and restaurants. It is also close to the train station, where Hajjar's wife catches the New Jersey Transit to work in New York City. \"We only wanted to do this once, versus buying a starter home ,\" Hajjar said. \"Summit has a lot of great stuff. There's a really good YMCA right downtown, so I can walk to the gym. My wife and I can have a date night and walk into town.\" For decades, people looking for a home have faced a choice between two distinct lifestyles: either large, walkable cities rich in \"third places,\" gathering places outside the home and workplace, like cafés and parks; or the more self-contained, car-dependent suburbs. As Americans place greater value on connection and convenience, home buyers like the Hajjars are asking more of their neighborhoods — and, in turn, homebuilders are reimagining suburbia. People want to live in walkable neighborhoods with things to do NAR's 2026 Community and Transportation Preference Survey polled 2,000 adults in the nation's 50 largest metro areas and found that 63% of respondents woul", "date_str": "2026-11-02T14:42:01+00:00", "hash": "eb8cc5cece28916f", "title_fa": "حومه شهر فرار از زندگی شهری بود. اکنون، هزاره ها می خواهند که آنها بیشتر شبیه شهرها شوند.", "summary_fa": "گزارش NAR نشان داد که خریداران خانه حاضرند برای زندگی در محله‌های قابل پیاده‌روی هزینه بیشتری بپردازند. تونی اندرسون/ گتی ایماژ شهرها زمانی گزینه اصلی برای زندگی در فاصله کمی از پارک ها، کافه ها و مغازه ها بودند. اکنون، حومه‌ها همان رفتاری را دارند که توسعه‌دهندگان جوامعی قابل پیاده‌روی و غنی از امکانات می‌سازند. یک نظرسنجی NAR نشان داد که خریداران حتی برای زندگی در این نوع محله‌ها هزینه بیشتری می‌پردازند. جوزف حجار و همسرش سال‌ها در شهرهای بزرگ زندگی می‌کردند، جایی که از سبک زندگی سریع و گزینه‌های بی‌پایان برای انجام دادن لذت می‌بردند. بنابراین وقتی تصمیم گرفتند در حومه شهر مستقر شوند و دو دختر کوچک خود را بزرگ کنند، چند چیز غیرقابل مذاکره داشتند. حجار، 40 ساله، به Business Insider گفت: «ما یک صفحه گسترده داشتیم، و شهرهایی که تعداد زیادی جعبه را بررسی می‌کردند، شهرهایی بودند که قابلیت پیاده‌روی و رستوران خوبی داشتند. ما همچنین به دنبال یک حس قوی از جامعه بودیم. آنها در نهایت سامیت، نیوجرسی را انتخاب کردند، یک حومه کوچک برای رفت و آمد در حدود 22 مایلی شهر نیویورک. آنها 1.4 میلیون دلار برای خانه ای به مساحت 3500 فوت مربع پرداخت کردند - بسیار بزرگتر از آپارتمان دو خوابه آنها در جرسی سیتی. حتی با یک اتاق زیر شیروانی طبقه بالا که برای میزبانی از مهمانان از آن استفاده می کنند، یک حیاط و یک باغ، ویژگی هایی که فقط می توانستند در شهر آرزوی داشتن آن را داشته باشند، ارائه شد. مطمئناً، آنها بیشتر از زمانی که در شهر زندگی می کردند، پرداخت می کنند. اما یکی از بزرگ‌ترین مزیت‌های خانه، نزدیکی آن به مرکز شهر تاریخی سامیت است، جایی که خانواده می‌توانند پیاده به مغازه‌ها، کافه‌ها و رستوران‌ها بروند. همچنین به ایستگاه قطار نزدیک است، جایی که همسر حجار با ترانزیت نیوجرسی می‌رود تا در شهر نیویورک", "image_url": "https://i.insider.com/6ae4d2d4d8cc18cf7950f996?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۸:۱۲"}, {"source": "Business Insider", "title": "Ukraine has put thousands of new war robots into the fight. Fall and winter will test how they handle mud and snow.", "link": "https://www.businessinsider.com/ukraine-war-ground-robot-army-swelled-autumn-winter-test-2026-11", "summary": "Ukraine s ground robot fleet has grown since last winter. Chris McGrath/Getty Images Ukraine's war robot fleet has grown rapidly, with new models and capabilities entering the fight. But Ukraine's fall and winter will test how well the robots handle mud, snow, and freezing temperatures. \"We will be able to assess how much they have evolved compared to last autumn,\" a Ukrainian officer told BI. Ukraine's ground robot fleet has swelled , but new tests lie ahead, specifically the thick autumn mud and the winter cold and snow that can make battlefield movement more difficult and stress certain systems. Over the last year, the country's military and industry have prioritized fielding an army of robots to attack, gather intelligence, carry gear, and evacuate the wounded. The purpose is to replace as many human soldiers as possible in the war's most dangerous sectors. The fleet has expanded significantly and advanced technologically since last winter. Now it faces seasonal tests. \"These ground robotic systems are constantly being improved,\" Oleksandr Yabchanka, head of robotic systems for Ukraine's Da Vinci Wolves Battalion, told Business Insider. \"Their operational range and off-road mobility are increasing.\" \"Now that autumn has arrived, we will be able to assess how much they have evolved compared to last autumn,\" he said. \"After all, operating in the summer on dry ground is one thing, but in the autumn — when the ground turns to mud and movement becomes significantly more difficult — it is quite another.\" Mud and other autumn and winter conditions make it harder for robots to travel. John Moore/Getty Images In March, Ukraine's defense ministry said that since the beginning of the year, more than 20,000 ground robotic systems had been contracted, which it said was almost twice as many as in all of 2025. It said their use was \"rapidly expanding.\" \"There are more of them now,\" Yabchanka, also a cofounder of the nonprofit Defence Robotics UA, said. \"Throughout 2026, many units have begun employing UGVs.\" \"This usage has already become widespread,\" he said, sharing that \"ground-based robotic systems are becoming an integral part of combat operations for most units deployed along the line of contact.\" Autumn and winter have long been a difficult test for Ukraine's military equipment. First, the ground turns into thick mud. Next, the temperatures drop below freezing, snow covers whole sections of the battlefield, and trees go bare, stripping away valuable cover. Win", "date_str": "2026-11-02T14:29:37+00:00", "hash": "34e5b3babc8e0369", "title_fa": "اوکراین هزاران ربات جنگی جدید را وارد مبارزه کرده است. پاییز و زمستان نحوه برخورد آنها با گل و برف را آزمایش خواهند کرد.", "summary_fa": "ناوگان روبات های زمینی اوکراین از زمستان گذشته رشد کرده است. کریس مک گراث/ گتی ایماژ ناوگان ربات های جنگی اوکراین به سرعت رشد کرده است و مدل ها و قابلیت های جدیدی وارد جنگ شده اند. اما پاییز و زمستان اوکراین آزمایش خواهد کرد که ربات ها تا چه اندازه گل، برف و دمای یخ زدگی را تحمل می کنند. یک افسر اوکراینی به BI گفت: «ما می‌توانیم ارزیابی کنیم که آنها در مقایسه با پاییز گذشته چقدر تکامل یافته‌اند. ناوگان روبات‌های زمینی اوکراین متورم شده است، اما آزمایش‌های جدیدی در راه است، به‌ویژه گل غلیظ پاییزی و سرمای زمستان و برف که می‌تواند حرکت میدان نبرد را دشوارتر کند و سیستم‌های خاصی را تحت فشار قرار دهد. در طول سال گذشته، ارتش و صنعت این کشور، ایجاد ارتشی از روبات‌ها را برای حمله، جمع‌آوری اطلاعات، حمل تجهیزات و تخلیه مجروحان در اولویت قرار داده‌اند. هدف این است که تا آنجا که ممکن است سربازان انسانی در خطرناک ترین بخش های جنگ جایگزین شوند. این ناوگان از زمستان گذشته به طور قابل توجهی گسترش یافته و از نظر فناوری پیشرفت کرده است. اکنون با آزمایشات فصلی روبرو است. اولکساندر یابچانکا، رئیس سیستم‌های روباتیک گردان گرگ‌های داوینچی اوکراین، به Business Insider گفت: «این سیستم‌های روباتیک زمینی دائماً در حال بهبود هستند. برد عملیاتی و تحرک خارج از جاده آنها در حال افزایش است.\" او گفت: \"اکنون که پاییز فرا رسیده است، ما می توانیم ارزیابی کنیم که آنها در مقایسه با پاییز گذشته چقدر تکامل یافته اند.\" به هر حال، کار در تابستان در زمین خشک یک چیز است، اما در پاییز - وقتی زمین به گل تبدیل می شود و حرکت به طور قابل توجهی دشوارتر می شود - کاملاً چیز دیگری است. گل و لای و سایر شرایط پاییز و زمستان سفر را برای ربات ها سخت تر", "image_url": "https://i.insider.com/6ae8984ed8cc18cf795100ec?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۷:۵۹"}, {"source": "Business Insider", "title": "Corporate America's AI bill is ballooning. This startup raised $30 million to make sense of where the money is going.", "link": "https://www.businessinsider.com/larridin-ai-spending-measurement-series-a-30-million-2026-11", "summary": "Ameya Kanitkar, Russell Fradin, and Jim Larrison s startup just raised a $30 million Series A. Larridin AI has gone from being a small business expense to one of the priciest items on companies' ledgers. San Francisco startup Larridin raised $30 million to determine whether firms are getting their money's worth. Larridin's Series A comes in the wake of the tokenmaxxing era, as companies grow concerned about AI ROI. Companies went all in on AI this year, and are now reckoning with heavy bills. One startup wants to get under the hood and figure out which ones are worth it. Larridin, a San Francisco-based startup, just raised $30 million in Series A funding to give companies a clear picture of how the money they spent on AI is — or isn't — working for them. Jeff Kearl, a general partner at Pelion Ventures, which led the funding round, told Business Insider that AI has gone from being a small, even \"nonexistent,\" expense for businesses to one of the top five to 10 most expensive items on their ledger. \"All of a sudden they're like, 'Wow, that's a lot of money going to AI. We run a lot of apps. We have a lot of models. Where does it all go, who uses it, and how do I make sense of that?\" Kearl said. Larridin's main product is a measurement platform that tracks the extent to which AI improves employee productivity and identifies opportunities for better adoption. The software integrates with companies' internal systems to analyze employees' AI usage, including their prompts to different AI tools, and determine who is using AI effectively, who needs more training, and how much time they're saving. Cofounder and CTO Ameya Kanitkar said the platform protects employee privacy by analyzing their AI interactions without storing their contents, instead generating scores and high-level insights. Always a need for a third-party measurement platform Russell Fradin, CEO and cofounder of Larridin, previously worked at Comscore, a media and advertising measurement platform. He said that, in his experience, whenever a lot of money moves into a category, someone builds a third-party measurement platform for that category, evidenced by Comscore, Nielsen, or Datadog. \"We said, look, there's going to be a ton of AI spend ,\" Fradin said. \"There's going to be a third-party audit measurement company, and let's try and be that company.\" The company has a third cofounder, Jim Larrison, who worked with Fradin at Comscore. Larridin's $30 million Series A was led by Pelion Ventures, Andre", "date_str": "2026-11-02T14:00:01+00:00", "hash": "493203c312a84eaf", "title_fa": "لایحه هوش مصنوعی شرکت های آمریکایی در حال افزایش است. این استارت‌آپ 30 میلیون دلار جمع‌آوری کرد تا بفهمد این پول به کجا می‌رود.", "summary_fa": "آمیا کانیتکار، راسل فرادین و استارت‌آپ جیم لاریسون به تازگی 30 میلیون دلار سری A جمع‌آوری کرده‌اند. هوش مصنوعی Larridin از یک هزینه کوچک تجاری به یکی از گران‌ترین اقلام در دفتر کل شرکت‌ها تبدیل شده است. استارت‌آپ سانفرانسیسکو Larridin 30 میلیون دلار جمع‌آوری کرد تا مشخص کند آیا شرکت‌ها ارزش پول خود را دارند یا خیر. Larridin's Series A در پی عصر tokenmaxxing عرضه می شود، زیرا شرکت ها نگران AI ROI هستند. شرکت‌ها امسال همه چیز را روی هوش مصنوعی وارد کردند و اکنون با صورت‌حساب‌های سنگین حساب می‌کنند. یک استارت‌آپ می‌خواهد زیر کاپوت قرار بگیرد و بفهمد که کدام یک ارزشش را دارند. Larridin، یک استارت‌آپ مستقر در سانفرانسیسکو، به تازگی 30 میلیون دلار سرمایه در سری A جمع‌آوری کرده است تا به شرکت‌ها تصویر واضحی از این که پولی که برای هوش مصنوعی خرج می‌کنند چگونه برای آنها کار می‌کند - یا نیست - بدهد. جف کرل، یک شریک عمومی در Pelion Ventures، که دور سرمایه‌گذاری را رهبری می‌کرد، به Business Insider گفت که هوش مصنوعی از هزینه‌ای کوچک و حتی «غیرموجود» برای کسب‌وکارها به یکی از 5 تا 10 اقلام گران‌قیمت در دفترشان تبدیل شده است. ناگهان می‌گویند: \"وای، این پول زیادی صرف هوش مصنوعی می‌شود. ما برنامه‌های زیادی را اجرا می‌کنیم. ما مدل‌های زیادی داریم. همه اینها به کجا می‌رود، چه کسی از آن استفاده می‌کند، و چگونه می‌توانم آن را درک کنم؟\" کرل گفت. محصول اصلی Larridin یک پلت فرم اندازه گیری است که میزان بهبود بهره وری کارمندان توسط هوش مصنوعی را ردیابی می کند و فرصت هایی را برای پذیرش بهتر شناسایی می کند. این نرم‌افزار با سیستم‌های داخلی شرکت‌ها ادغام می‌شود تا استفاده از هوش مصنوعی کارکنان را تجزیه و تحلیل کند، از جمله درخواست‌های آنها برای ابزارهای مختلف هوش مصنوعی، و تعیین اینکه چه کسی به طور موثر از", "image_url": "https://i.insider.com/6ae7eea18bd5d6547af34833?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سرمایه‌گذاری"], "datetime_fa": "۱۱ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "A stroller blanket changed my mom's life. Now I'm helping her run 7AM Enfant, the business it inspired.", "link": "https://www.businessinsider.com/immigrant-family-american-dream-baby-gear-business-2026-11", "summary": "Chana Campora runs 7AM Enfant with her mom. Courtesy of Chana Campora Chana Campora's mother, Rebecca, created a stroller blanket when Chana was a preschooler. Chana grew up helping with the company, but wasn't sure she'd work there. Watching her immigrant parents chase their dreams shaped her career, she says. This as-told-to essay is based on a conversation with Chana Campora, vice president of 7AM Enfant . It has been edited for length and clarity . My mom is a very fashionable, very functional person. When she moved from Paris to New York City for my dad's job, with two young kids, she needed a way to keep us warm in the stroller so she could go about her day. She still tells stories about wrapping me in layers and layers of blankets. As soon as we'd get into a shop, I'd strip them off, and she'd have to do it all again. My mom is utilitarian, so she created a stroller blanket with a zipper that was quick and easy to get me in and out of. Chana Campora s mom invented a blanket for her stroller. Courtesy of Chana Campora She was just trying to lighten her load. Little did we know at the time that she was creating a genius product that would serve so many parents for years to come. More than 20 years later, her business has expanded, but we still use the original five blanket silhouettes she created. It's amazing to see that they're as relevant as ever, and still what parents want and need . I grew up helping with the company, but I wasn't sure I'd join The company was my mom's fourth child, and as the oldest daughter , I helped her care for it. At first, she would sew her designs at home; later, we attended trade shows together. I learned the value of hard work from watching my mom. It was meaningful to know that my siblings and I were her source of inspiration. Her premise with 7AM Enfant was simple: to keep us safe and warm, and keep her day going. That's something she's never stopped fighting for. Chana Campora helps run 7AM Enfant with her mother. Courtesy of Chana Campora Although I loved the company, I wasn't sure I'd join the business. I spent five years in LA, studying Spanish and French literature, and getting a master's in anthropology. Being the daughter of immigrants — and speaking four languages — is central to who I am. My mom and I have fun designing together When I returned to New York , it was clear to me that my mom needed a partner. She'd been a one-woman show for too long. I'd dabbled in other jobs, but realized I needed to join my m", "date_str": "2026-11-02T13:57:01+00:00", "hash": "27f7dd193276dbd5", "title_fa": "یک پتوی کالسکه زندگی مادرم را تغییر داد. اکنون به او کمک می کنم تا 7AM Enfant را اداره کند، کسب و کاری که الهام گرفته از آن است.", "summary_fa": "چانا کامپورا 7 صبح نوزاد را با مادرش اجرا می کند. به لطف چانا کامپورا، مادر چانا کامپورا، ربکا، زمانی که چانا پیش دبستانی بود، یک پتوی کالسکه درست کرد. چانا با کمک به شرکت بزرگ شد، اما مطمئن نبود که در آنجا کار کند. او می‌گوید تماشای والدین مهاجرش که به دنبال رویاهایشان هستند، شغل او را شکل داده است. این مقاله گفته شده بر اساس گفتگو با چانا کامپورا، نایب رئیس 7AM Enfant است. برای طول و وضوح ویرایش شده است. مادر من فردی شیک پوش و بسیار کاربردی است. هنگامی که او از پاریس به نیویورک سیتی برای کار پدرم نقل مکان کرد، با دو بچه خردسال، به راهی نیاز داشت که ما را در کالسکه گرم نگه دارد تا بتواند روز خود را بگذراند. او هنوز داستان هایی درباره پیچیدن من در لایه ها و لایه های پتو می گوید. به محض اینکه وارد یک مغازه می‌شدیم، آنها را بیرون می‌کشیدم، و او باید همه کارها را دوباره انجام می‌داد. مادر من سودمند است، بنابراین او یک پتوی کالسکه با زیپ ایجاد کرد که به سرعت و به آسانی من را داخل و خارج کرد. مادر چانا کامپورا یک پتو برای کالسکه خود اختراع کرد. با حسن نیت از Chana Campora او فقط سعی می کرد بار خود را سبک کند. در آن زمان نمی‌دانستیم که او در حال ایجاد یک محصول نابغه است که برای سال‌های آینده به بسیاری از والدین خدمت می‌کند. بیش از 20 سال بعد، کسب و کار او گسترش یافته است، اما ما هنوز از 5 سیلوئت اصلی که او خلق کرده است استفاده می کنیم. شگفت‌انگیز است که می‌بینیم آن‌ها مثل همیشه مرتبط هستند، و همچنان آنچه والدین می‌خواهند و نیاز دارند. من با کمک به شرکت بزرگ شدم، اما مطمئن نبودم که به شرکت بپیوندم. شرکت چهارمین فرزند مادرم", "image_url": "https://i.insider.com/6ada44d02a1b5bc156b1b0d2?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۱۷:۲۷"}, {"source": "Business Insider", "title": "My tennis buddy has an AI agent. It's changing his life.", "link": "https://www.businessinsider.com/openai-dot-ai-agent-tennis-buddy-everyday-tasks-2026-10", "summary": "Tennis balls Yomiuri Shimbun/Reuters A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . My Thursday evening tennis league started again recently, and something unusual happened. The emails organizing our weekly games began arriving with a new sign-off. \"See you on the court! Nathan's agent.\" My tennis buddy Nathan Czubaj has organized this league for years. It's a lot of work involving spreadsheets, scheduling, endless reminders, and chasing players who forget to confirm whether they're coming. Now he's outsourced much of that work to an AI agent . Naturally, when we gathered on court, everyone wanted to know what Nathan was using. This is Silicon Valley , after all. We can't even play tennis without talking about AI . Nathan explained that he'd started using OpenAI's Dots , a personal AI assistant that can handle tasks over time and work with other apps. Every Monday, Dot checks a spreadsheet containing our availability and emails players who might be able to play that Thursday. It asks us to confirm. On Thursday morning, another email reminds the confirmed players to show up at 7 pm. It's been working remarkably well for several weeks, saving Nathan considerable time. But here's what makes his experience particularly interesting: Nathan isn't a technology expert. \"I'm one of the least technical people I know,\" he told me. Nathan runs Mindset Unlimited , a business that helps professionals become better communicators and leaders through coaching and training. From Claude Code to Dots He's enthusiastic about AI, but his journey hasn't been entirely smooth. A few months ago, he experimented with Anthropic's Claude Code , a tool that can write software and carry out complicated computer tasks. He found it frustrating and stopped using it. \"It was not easy to manage and it took much longer than it would take to do it yourself,\" he said. Dots has been different. Nathan can describe what he wants in ordinary language, and his Dot can work with services he already uses. He started with tennis scheduling. Now he's handing his Dot tasks throughout his personal and professional life. On one recent day, he asked it to help with guitar practice, a workout routine, shopping lists, selling things on eBay, finding a birthday present, and creating a family book of memories. He also uses it to remember to call friends, recommend books, find workshops, and develop longer-term goals. A", "date_str": "2026-11-02T13:53:02+00:00", "hash": "c7b67ec56a127ab4", "title_fa": "دوست تنیس من یک عامل هوش مصنوعی دارد. زندگی او را تغییر می دهد.", "summary_fa": "", "image_url": "https://i.insider.com/6ae516068bd5d6547af3450a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۱۱ آبان • ۱۷:۲۳"}, {"source": "Business Insider", "title": "I tried Chipotle's $52 family meal. It was plenty of food for 6 … and really great meal prep for 2.", "link": "https://www.businessinsider.com/tried-chipotle-family-meal-what-i-got-worth-it-review-2026-11", "summary": "I ordered Chipotle s family meal to see what I d get and whether it would be a great value. Savannah Born I tried Chipotle's chicken family meal , which cost $52 and is meant to serve four to six. Although I wish we'd gotten more salad and that my chips hadn't been missing, I was impressed. Ultimately, we were able to make six well-portioned, tasty meals at home for less than $10 each. Even though I usually cook at home and avoid fast (and fast-casual) food whenever possible, I have a hard time turning down Chipotle. I build the same salad bowl every time I go, so I don't pay much attention to the rest of the menu. It wasn't until I saw Chipotle's strange fever-dream of an advertising campaign that I learned about its family meals. Simply put, it involved a 3-foot reusable version of its takeout bag. Bizarre, yes, but it worked. Curious about the details (and the \"big ass\" bag mentioned in the advertisement), I did some Googling. Turns out, Chipotle launched its family meals in August 2025. The build-your-own experience is a major appeal. Per Chipotle , \"People can create any bowl, salad, or soft taco to their liking and dietary preferences.\" Nachos were also suggested. Since I love salads and my partner prefers bowls, it seemed like the perfect setup. Plus, family meals are designed to serve four to six people — which, in my two-person household , could mean dinners for days. So, I ordered a chicken family meal online, complete with all the default items. Here's how it shook out. My local Chipotle had a few options for family meals. Savannah Born Even though I set my sights on its $52 chicken meal, Chipotle also offered steak and sofritas meals featuring the same standard fixings: rice (white or brown) beans (black or pinto) cheese romaine lettuce large chips 10 soft-flour tortillas three dips (choices included sour cream and four different salsas) one premium side (either guacamole or queso). The meals ranged from $52 to $63, depending on the protein. It's worth noting that these family meals are all digital-only, so they have to be ordered through the app or website. Ordering online felt seamless. Savannah Born Since I stuck with the baseline, customization-free spread, ordering took only a few clicks. My lineup included white rice, black beans , cheese, romaine lettuce, large chips, and 10 flour tortillas, plus sour cream, pico de gallo, and hot salsa as toppings. Then, I scrolled to the \"extras\" section. I could add another protein and up to seven ext", "date_str": "2026-11-02T13:44:01+00:00", "hash": "85f0155aa0a58db7", "title_fa": "من غذای خانوادگی 52 دلاری Chipotle را امتحان کردم. برای 6 نفر غذای زیادی بود... و برای 2 نفر غذای بسیار عالی تهیه کرد.", "summary_fa": "من غذای خانوادگی چیپوتل را سفارش دادم تا ببینم چه چیزی می‌گیرم و آیا ارزش زیادی دارد یا خیر. Savannah Born من غذای خانوادگی مرغ چیپوتل را امتحان کردم که 52 دلار قیمت داشت و قرار است چهار تا شش سرو شود. اگرچه ای کاش سالاد بیشتری می‌خوردیم و چیپس‌هایم از دست نمی‌رفت، اما تحت تأثیر قرار گرفتم. در نهایت، ما توانستیم شش غذای خوش طعم و خوش طعم را در خانه برای هر کدام کمتر از 10 دلار درست کنیم. اگرچه من معمولاً در خانه آشپزی می‌کنم و تا حد امکان از غذاهای سریع (و سریع) اجتناب می‌کنم، برای رد کردن Chipotle مشکل دارم. من هر بار که می روم همان کاسه سالاد را درست می کنم، بنابراین به بقیه منو توجه زیادی نمی کنم.       media: [{"source": "Billboard", "title": "Harry Styles & HeadCount Drive Major Voter Action During His MSG Residency: See the Numbers", "link": "https://www.billboard.com/music/music-news/harry-styles-msg-residency-voter-registrations-headcount-1236371947/", "summary": "It s a Sign of the Times that Harry Styles and HeadCount helped get fans to the polls ahead of the Nov. 3 midterm elections. HeadCount, a nonpartisan organization that works to get people to vote, reports that its partnership with Styles during his historic 30-date Madison Square Garden residency resulted in 108,061 voter actions and 33,284 new voter registrations. HeadCount defines actions as things such as checking voter registration status, signing up for election alerts, or signing up to volunteer with the organization. Related Sabrina Carpenter s New Partnership With HeadCount Generates 30,000 Civic Actions in 12 Hours Suki Waterhouse, Australian Crawl Join Sydney Opera House s On The Steps Series Wu-Tang Clan to Headline Detroit Lions Thanksgiving Game Halftime Show “Harry s fans arrive ready to make their voices heard, HeadCount s executive director Lucille Wenegieme said in a statement. On Night 5, one fan sought out our booth on her 18th birthday to register the moment she was eligible. With Election Day [Nov. 3], our focus is making sure every fan we met at the Garden has what they need to cast their ballot securely and on time. HeadCount was present at New York s Madison Square Garden at co-branded tables in high-traffic concourses and via voter messaging on the video boards. The activations were staffed by volunteers who traveled from locations including Florida, Tennessee and Ecuador, helping get fans involved in the democratic process and giving away special-edition Together, Together voting postcards in exchange. This partnership extends a previously existing collaboration between Styles and HeadCount that has, in total, generated 90,992 new voter registrations and 319,901 actions. In 2022, Styles Good to Vote campaign registered more than 54,000 fans to vote, breaking HeadCount’s record for an artist-driven campaign. HeadCount at MSG During Together, Together Residency Courtesy of HeadCount The most recent push ran through the entirety of Styles Together, Together residency at Madison Square Garden, from Aug. 26 through the closing Harryween on Oct. 31. The campaign also existed via HeadCount s nationwide Good to Vote Harryween sweepstakes, which let fans across the country get involved. All in, the final date of Style s record-breaking MSG residency was an eventful one, with Styles dressed as New York s Pizza Rat, and New York Knicks captain and 2026 NBA Finals MVP Jalen Brunson presenting a commemorative banner to Styles during the show.", "date_str": "2026-11-02T17:00:00+00:00", "hash": "20b32ad702d523bf", "title_fa": "هری استایلز و تعداد هدشمار اقدام عمده رای دهندگان را در طول اقامت او در MSG هدایت می کنند: اعداد را ببینید", "summary_fa": "این نشانه ای از روزگار است که هری استایلز و هد کانت به طرفداران کمک کردند تا پیش از انتخابات میان دوره ای 3 نوامبر به پای صندوق های رای بروند. HeadCount، یک سازمان غیرحزبی که برای جلب رأی مردم کار می‌کند، گزارش می‌دهد که مشارکت آن با استایلز در طول اقامت تاریخی 30 ساله‌اش در مدیسون اسکوئر گاردن منجر به 108061 اقدام رأی‌دهنده و 33284 ثبت نام رأی‌دهندگان جدید شد. HeadCount اقداماتی مانند بررسی وضعیت ثبت نام رأی دهندگان، ثبت نام برای هشدارهای انتخاباتی یا ثبت نام برای داوطلب شدن در سازمان را تعریف می کند. مشارکت جدید سابرینا کارپنتر با HeadCount 30000 اقدام مدنی در 12 ساعت ایجاد می‌کند سوکی واترهاوس، کرال استرالیایی به سریال خانه اپرای سیدنی بپیوندید. Lucille Wenegieme در بیانیه ای گفت: در شب 5، یکی از طرفداران در جشن تولد 18 خود به دنبال غرفه ما شد تا لحظه ای که واجد شرایط بود، ثبت نام کند. با روز انتخابات [نوامبر. 3]، تمرکز ما این است که مطمئن شویم هر هواداری که در باغ ملاقات کردیم، آنچه را که برای انداختن رای امن و به موقع به آن نیاز دارد، داشته باشد. HeadCount در مدیسون اسکوئر گاردن نیویورک در میزهایی با نام تجاری مشترک در سالن‌های پرترافیک و از طریق پیام‌های رای‌دهندگان بر روی تابلوهای ویدئویی حضور داشت. این فعال‌سازی‌ها توسط داوطلبانی انجام می‌شد که از مکان‌هایی مانند فلوریدا، تنسی و اکوادور سفر می‌کردند و به طرفداران کمک می‌کردند در روند دموکراتیک مشارکت کنند و در ازای آن کارت‌پستال‌های رای‌گیری با نسخه ویژه با هم، با هم اهدا کردند. این مشارکت یک همکاری قبلی بین Styles و HeadCount را گسترش می‌دهد که در مجموع 90992 ثبت نام رای‌دهی جدید و 319901 اقدام ایجاد کرده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/BB_Harry_Headcount.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۱ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "JYT & Gap Are Bringing Boy-Band Mania Back to the Mall With a New Fashion Collection", "link": "https://www.billboard.com/culture/product-recommendations/gap-jyt-boy-band-collection-hoodies-mall-tour-shop-online-1236371939/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. The boy-band mall tour is officially making a comeback, and Gap is bringing a new generation of pop stars along for the ride. The retailer has teamed up with rising American boy band Just Your Type ( JYT ) for a nationwide mall tour and limited-edition fashion collection, giving fans a chance to catch live performances, shop exclusive merchandise and get a little closer to their favorite members. Better yet, the Gap x JYT collection dropped Oct. 30, meaning fans can already shop the pieces online. Shop Gap x JYT Capsule Collection For those unfamiliar with JYT, the five-member group consists of Recker Eans, Toby Green, Caden Adamonis, Bryan Chan and Tyler George. Developed by Grammy-nominated songwriter and producer Freddy Wexler and signed to Wexler Records/Republic Records, the dance-focused group has been
