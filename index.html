ست و پا به این نتیجه رسید که قطعاً این احتمال وجود دارد که هوش مصنوعی همه ما را بکشد. او افزود، چرا ما نمی‌توانیم به جای اینکه به مردم اجازه دهیم چیزی را تنظیم کنند که تضاد منافع آشکاری در تنظیم آن دارند، نمی‌توانیم این را کاهش دهیم؟ او توضیح داد که بسیاری از رهبران هوش مصنوعی ادعا کرده اند که این فناوری روزی به نفع جامعه از جمله کمک به درمان بیماری ها خواهد بود. با این حال، امروزه کاربردهای فعلی شامل"}, {"source": "Rolling Stone", "title": "Addison Rae Called This Collagen Powder ‘Part of My Everyday Routine’ and It’s Up to 50% Off for Prime Big Deal Days", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/vital-proteins-collagen-powder-prime-big-deal-days-2026-sale-1235635659/", "summary": "Vital Proteins promises to help improve the look of your hair and skin, while supporting bone and joint health", "date_str": "2026-10-06T07:12:31+00:00", "hash": "38f3b2cc89a62b32", "title_fa": "ادیسون رائه این پودر کلاژن را «بخشی از روال روزمره من» نامید و برای روزهای پرمخاطب تا 50 درصد تخفیف دارد.", "summary_fa": "Vital Proteins وعده کمک به بهبود ظاهر مو و پوست شما و در عین حال حمایت از سلامت استخوان و مفاصل را می دهد. رویداد اکتبر پرایم روز آمازون با میلیون ها تخفیف در سراسر سایت، از فناوری و اسباب بازی گرفته تا مد و زیبایی، رسما در حال برگزاری است. روزهای 2026 با عنوان رسمی Prime Big Deal از اکتبر اجرا می شود. 6 تا 7، و اعضای آمازون پرایم اولین تخفیف‌ها و همچنین شدیدترین تخفیف‌ها را دریافت می‌کنند (عضو Prime نیستید؟ برای خرید از اینجا یک دوره آزمایشی رایگان 30 روزه دریافت کنید). در میان بزرگترین معاملات این هفته؟ پپتیدهای کلاژن Vital Proteins که مورد علاقه افراد مشهور هستند، ستاره هایی مانند ادیسون ری، جنیفر آنیستون و کورتنی کارداشیان را به عنوان طرفداران خود به حساب آورده اند. پودر کلاژن Vital Proteins تا 50٪ تخفیف برای روزهای پرایم بیگ دیل دارد، که به خریداران این فرصت را می دهد تا طعم های مورد علاقه خود را مجدداً ذخیره کنند یا آنچه را که رائه آن را بخشی سودمند از برنامه روزمره من می نامد برای تخفیف انتخاب کنند. Rae در سال 2022 به عنوان سفیر پروتئین های حیاتی معرفی شد، با این برند اشاره کرد که این خواننده مدت هاست که پپتیدهای کلاژن خود را در برنامه روزانه خود قرار داده است. بر اساس یک بیانیه مطبوعاتی، ستاره سابق جلد رولینگ استون همچنین با Vital Proteins کار کرد تا به طرفداران و پیروان خود درباره مزایای کلاژن در هر سنی آموزش دهد. Vital Proteins بر این باور است که کلاژن فراوان ترین پروتئین بدن است، با توانایی کمک به بهبود ظاهر و احساس مو، ناخن و پوست شما و در عین حال حمایت از سلامت استخوان و مفاصل. قرارداد با مدت زمان محدود Vital Proteins کلاژن پپتید پودر پیشرفته [بدون طعم] 20 اونس. 36.37 دلار 42.99 دلار 15"}, {"source": "Rolling Stone", "title": "Watch Mumford & Sons, Chris Thile Showcase ‘Here’ on ‘Kimmel’", "link": "https://www.rollingstone.com/music/music-news/mumford-and-sons-chris-thile-here-performance-kimmel-1235637398/", "summary": "The song comes off the group's most recent album, Prizefighter", "date_str": "2026-10-06T06:35:23+00:00", "hash": "3ae2181235b22b91", "title_fa": "نمایش Mumford & Sons, Chris Thile «Here» در «Kimmel» را تماشا کنید", "summary_fa": "این آهنگ از جدیدترین آلبوم گروه، Prizefighter Mumford Sons در جیمی کیمل Live ظاهر شد تا آهنگ اخیر خود را در اینجا اجرا کند. کریس تیل به گروه راک بریتانیایی پیوست که بخش آواز کریس استپلتون را از نسخه ضبط شده این آهنگ بر عهده گرفت. در اینجا ششمین آلبوم پسران مامفورد به نام Prizefighter منتشر شد که در فوریه منتشر شد. LP با همکاری آرون دسنر از ملیت تهیه و نوشته شده است و شامل همکاری با Stapleton، Hozier، Gracie Abrams، Brandi Carlile و Gigi Perez است. از زمان انتشار، گروه در شنبه شب اجرا داشته و تورهای گسترده ای برگزار کرده است. مارکوس مامفورد فرانتمن با مجری جیمی کیمل به بحث در مورد آلبوم و همکاری‌های آن نشست و همچنین به عنوان یک بزرگسال دیزنی و رفتن به دیزنی لند به صورت انفرادی. مامفورد توضیح داد که این گروه عمدتاً مبتنی بر رابطه بود. گرچه کریس استپلتون من فقط سرد زنگ زدم چون دوستش دارم. فکر می کنم او یک استعداد نسلی است و من فقط یک دختر طرفدار هستم. بنابراین من او را صدا کردم و او بسیار شیرین بود. حدود یک ساعت در مورد خانواده و کار صحبت کردیم و در نهایت من این سوال را مطرح کردم که او گفت بله. داستان‌های پرطرفدار برایان می می‌گوید که ملکه دیگر تور نخواهد رفت: «50 سال کافی است» دالی گرو پارتون مدعی است که برادرزاده از نوار احتیاط و سیم خاردار استفاده کرده است تا از خدمات دعوی طفره برود. اجرای گروه کاور Black Sabbath از جک بلک با جیزر باتلر در Power به جشنواره مردمی که نیر شما اسپرینگستن را در جشنواره مردمی اضافه کرد. کارلیل اشعاری را که در خواب به ذهنش خطور کرده بود، برای او پیامک فرستاد. این اشعار تبدیل به Rubber Band Man شد که Hozier در آن حضور دارد. مامفورد خاطرنشان"}, {"source": "Hollywood Reporter", "title": "Jason Sudeikis Goes One-on-One With WNBA Great Breanna Stewart", "link": "https://www.hollywoodreporter.com/tv/tv-features/jason-sudeikis-wnba-breanna-stewart-interview-1236722754/", "summary": "The 'Ted Lasso' star — and diehard NY Liberty fan — talks with one of the most dominant players about the pressures of ‘SNL' and UConn, dealing with internet trolls and their surprisingly similar paths to the top: “I just want to keep winning.\"", "date_str": "2026-10-06T14:00:00+00:00", "hash": "9dc6369fec65e1eb", "title_fa": "جیسون سودیکیس با برانا استوارت بزرگ WNBA یک به یک می رود", "summary_fa": "ستاره «تد لاسو» - و طرفدار سرسخت نیویورک لیبرتی - با یکی از مسلط‌ترین بازیکنان درباره فشارهای «SNL» و UConn، برخورد با ترول‌های اینترنتی و مسیرهای شگفت‌آور مشابه آنها به سمت اوج صحبت می‌کند: «من فقط می‌خواهم به برنده شدن ادامه دهم». استوی! وقتی برینا استوارت، ستاره لیبرتی نیویورک، در مجموعه THR ظاهر می‌شود، جیسون سودیکیس او را در آغوش می‌گیرد. این نوع آغوشی است که او پس از پیروزی‌های بزرگ تیم، از جمله در طول دویدن آن‌ها به قهرمانی WNBA در سال 2024، در کنار او انجام می‌دهد. برنده چهار بار امی، که قبل از رفتن به کمدی و تبدیل شدن به جوک ساکن شنبه نایت لایو در زادگاهش، کانزاس بسکتبال کالج بازی می‌کرد، در نیمه راه طرفدارانی نمی‌کند. به همین دلیل است که او امروز از برداشتن کلاه آرسنال خودداری می کند. او در حالی که در لندن به تد لاسو تیراندازی می‌کرد، به یکی از حامیان سرسخت تیم لیگ برتر تبدیل شد، که در چهارمین فصل خود، مربی فوق‌العاده شاداب را رهبری یک تیم فوتبال زنان می‌بیند. به همین دلیل است که او نایک را در رنگ‌های UConn به افتخار دانشگاه استوارت می‌پوشد. و به همین دلیل است که او به یکی از اعضای گروه CeLIBrity تبدیل شده است، گروهی از طرفداران سوپر لیبرتی که شامل اسپایک لی، آلیشیا کیز و بازیگران Severance هستند. داستان‌های مرتبط تلویزیون تد لاسو در اپیزود ماقبل آخر تلویزیون در فصل 4 بازی‌های پلی‌آف WNBA 2026: بازی‌های بسکتبال زنان پس از فصل را به صورت زنده آنلاین تماشا کنیم، دستاوردهای کمی در بسکتبال وجود دارد که استوارت به آن دست نیافته است. او چهار عنوان NCAA، یک عنوان WNBA، چهار قهرمانی جام جهانی و سه مدال طلای المپیک دارد. این بازیکن 32 ساله هنوز به پایان رسیده است. او به سودیکیس می گوید من می خواهم همه رکوردها را شکست دهم. ما"}, {"source": "Hollywood Reporter", "title": "‘Dirty Dancing: The Musical’ Is Coming to Broadway", "link": "https://www.hollywoodreporter.com/lifestyle/arts/dirty-dancing-the-musical-coming-broadway-1236722969/", "summary": "The musical adaptation of the 1987 film will play at the Lena Horne Theatre starting this winter.", "date_str": "2026-10-06T14:00:00+00:00", "hash": "b14ee7155a3398e3", "title_fa": "«رقص کثیف: موزیکال» به برادوی می‌آید", "summary_fa": "اقتباس موزیکال فیلم 1987 از زمستان امسال در تئاتر لنا هورنای پخش خواهد شد. این موزیکال شامل کتاب جدیدی از النور برگشتاین، فیلمنامه نویس اصلی فیلم، کارگردانی لونی پرایس (بازیگر نقش نیل کلرمن در فیلم) و طراحی رقص دارل گرند مولتری (Fat Ham) است. این تور در ماه اوت در سنت پل، مینه سوتا راه اندازی شد و پاییز امسال در دیترویت، غرب پالم بیچ، بوستون، تورنتو و شهرهای دیگر قبل از نامزدی برادوی ادامه خواهد یافت. این موزیکال پس از برادوی اجرای ملی خود را از سر خواهد گرفت. داستان‌های مرتبط سبک زندگی من را تحقیر کردند، قاشق کردند و لب‌هایم را بوسیدند در عجیب‌ترین نمایش سبک زندگی در لس‌آنجلس، نیل پاتریک هریس، جولیان هاف، آستین اسکات برای بازگشت به برادوی در فیلم یانکی‌های لعنتی آنالس استارزک، که نقش فرانسیس بیبی هاوسنی کار، جانی بلیک را بازی می‌کند. برادوی در نقش ها، همراه با شرکتی که 19 نمایش دیگر را در برادوی خواهد دید، به نمایش درمی آید. این آخرین اقتباس صحنه‌ای از Lionsgate است که همچنین نمایش توهم‌گرای Now You See Me Live را در پاییز امسال به برادوی می‌آورد و The Hunger Games: On Stage را در لندن به نمایش می‌گذارد. لاینزگیت همچنین در حال ساخت یک تولید موزیکال از فیلم برنده شش جایزه اسکار استودیو La La Land از تهیه کننده مارک پلات است و یک اقتباس صحنه ای از فیلم موفق 400 میلیون دلاری The House Maid در دست ساخت دارد. این استودیو همچنین در حال ساخت دنباله فیلم Dirty Dancing است که از تهیه کنندگان The Hunger Games، Nina Jacobson و Brad Simpson، با بازی Baby Jennifer Grey اصلی فیلم بازی می کند. Dirty Dancing: The Musical توسط The Path Entertainment Group، Lionsgate و LD Entertainment تولید شده و توسط Magic Hour Productions، Nederlander Presentations و John Gore Organization تهیه شده است."}, {"source": "Hollywood Reporter", "title": "Emmy Awards Enter Streaming Era: Prime Video, TV Academy Ink Six-Year Deal", "link": "https://www.hollywoodreporter.com/tv/tv-news/emmy-awards-move-amazon-prime-video-1236722884/", "summary": "The ceremony will be the first of the EGOT awards to move to a streaming platform.", "date_str": "2026-10-06T13:00:00+00:00", "hash": "7ce56363245fdb44", "title_fa": "جوایز امی وارد دوران پخش جریانی می‌شوند: فیلم اصلی، قرارداد شش ساله جوهر آکادمی تلویزیون", "summary_fa": "این مراسم اولین جایزه از جوایز EGOT خواهد بود که به یک پلت فرم استریم منتقل می شود. متن لوگو جوایز امی اکنون یک نمایش استریم است. آکادمی تلویزیون و پرایم ویدیو قراردادی شش ساله امضا کرده اند که استریمر متعلق به آمازون را به خانه انحصاری Primetime Emmys از سال 2027-2032 تبدیل می کند. مراسم سال آینده اولین بار در تاریخ 79 ساله جوایز است که آنها از یک شبکه پخش پخش نمی شوند. طبق قرارداد جدید، Prime Video ممکن است برنامه‌های دیگر آکادمی تلویزیون مانند مراسم تالار مشاهیر و مراسم افتخارات آکادمی تلویزیون را نیز اجرا کند. آینده تلویزیونی امی هنرهای خلاق، که در دهه گذشته به علاوه از FXX پخش شده است، هنوز مورد بحث است. جوایز امی همچنین اولین جایزه از جوایز EGOT امی، گرمی، اسکار و تونی خواهد بود که انحصاری برای یک پلتفرم استریمینگ خواهد بود. اواخر سال گذشته، اسکار انتقال به یوتیوب را اعلام کرد، اما این اتفاق تا مراسم سال 2029 رخ نخواهد داد. ABC همچنان حقوق نمایش های 2027 و 2028 را دارد. کریس آبروگو، رئیس آکادمی تلویزیون در مصاحبه ای با هالیوود ریپورتر گفت: توافق با Prime Video واقعاً فرصتی برای بازنگری در مدل است و نه صرفاً تمدید قرارداد. برای من، تداوم بخش بزرگی از آن بود. چرخش [بین چهار شبکه بزرگ پخش] هر سال از بسیاری جهات به این معنی بود که ما دوباره با یک شریک جدید شروع می کردیم. این شامل همه چیز از خلاقیت، آوردن تولیدکننده جدید تا ایجاد مشارکت با برندها بود. این همیشه یکی از چالش های توافق چرخ بود. آبروگو گفت که آکادمی در مورد تمدید با شبکه های پخش گفتگو کرده و قبل از انعقاد قرارداد Prime Video با سایر رسانه ها صحبت کرده است. آبروگو گفت در گفتگو با مایک هاپکینز، رئیس پرایم ویدئو و استودیو ام جی ام آمازون،"}, {"source": "Hollywood Reporter", "title": "Sherlock Holmes, But Make It Rom-Com: Lucy Hale to Lead Roku Series", "link": "https://www.hollywoodreporter.com/tv/tv-news/lucy-hale-sherlock-holmes-rom-com-roku-1236722896/", "summary": "She'll play the title character in 'Scarlett Holmes,' who solves mysteries related to love and dating.", "date_str": "2026-10-06T13:00:00+00:00", "hash": "87268871e29782c4", "title_fa": "Sherlock Holmes, But Make It Rom-Com: Lucy Hale برای رهبری سریال Roku", "summary_fa": "او نقش شخصیت اصلی «اسکارلت هولمز» را بازی خواهد کرد که اسرار مربوط به عشق و دوستیابی را حل می کند. متن لوگو کتاب‌ها، فیلم‌ها و برنامه‌های تلویزیونی بی‌شماری وجود دارد که از داستان‌های شرلوک هلمز آرتور کانن دویل اقتباس یا الهام گرفته شده‌اند. با این حال، جدیدترین آنها توانسته است پیچ و تاب بدی به کارآگاه بزرگ وارد کند. کانال Roku دارای چراغ سبز اسکارلت هلمز است، سریالی محدود که در آن لوسی هیل (دروغگوهای کوچک زیبا، F*** Marry Kill 2024) به عنوان یکی از نوادگان شرلوک هلمز که قدرت مشاهده خانواده را به ارث برده است، بازی خواهد کرد. با این حال، اسکارلت و جین واتسون به جای حل جنایات، اسرار عشق، دوستیابی و روابط را درگیر می‌کنند. داستان‌های مرتبط فیلم‌ها لوسی هیل برای بازی در یک بیوه جوان راهنمای زندگی از کارگردان مکنزی مونرو کسب‌وکار CW با ESPN، Roku معاملات جریانی دارد. سوفی تیلسون و استیو جگی از هیل و جگی اینترتینمنت تهیه کننده اجرایی خواهند بود. مورگان پیچینسون و سابرینا لیال بر سریال کانال Roku نظارت دارند. هیل گفت: من یک طرفدار واقعی کمدی های رمانتیک هستم و اسکارلت هولمز چیز خاصی دارد که باعث شد من در وهله اول عاشق این ژانر شوم. من عاشق این هستم که رمز و راز را در دنیای رام کام به گونه ای وارد کند که واقعاً تازه و سرگرم کننده باشد. این جذاب، سکسی، خنده دار و دارای قلب زیادی است. اسکارلت باهوش، کنجکاو، کمی پیچیده است و مانند بسیاری از ما به دنبال عشق است. از اینکه پا به کفش او گذاشتم کاملاً هیجان زده هستم. در توضیحات کامل اسکارلت هلمز آمده است، اسکارلت و جین به مشتریان کمک می‌کنند سیگنال‌های مختلط، شکست‌های مخفی، معضلات عاشقانه و همه چیز را در بین آن‌ها هدایت کنند. اما در حالی که اسکارلت ممکن است در حل مشکلات عاشقانه دیگران"}, {"source": "Hollywood Reporter", "title": "Done Deal: Paramount Completes Warner Bros. Takeover, Creating Hollywood Giant", "link": "https://www.hollywoodreporter.com/business/business-news/paramount-closes-warner-bros-deal-skydance-official-1236723233/", "summary": "The combined company, Skydance, will begin trading on the New York Stock Exchange this week.", "date_str": "2026-10-06T12:54:31+00:00", "hash": "3ee149f66b1edda8", "title_fa": "معامله انجام شد: پارامونت تصاحب برادران وارنر را تکمیل کرد و غول هالیوود را ایجاد کرد", "summary_fa": "این شرکت ترکیبی، Skydance، معاملات خود را در بورس نیویورک آغاز خواهد کرد. رسماً یک غول جدید هالیوود در شهر وجود دارد. پارامونت دیوید الیسون روز سه شنبه تصاحب برادران وارنر را تکمیل کرد. دیسکاوری، رسماً دو استودیو فیلم افسانه‌ای، مجموعه عظیمی از شبکه‌های تلویزیونی، دو سرویس پخش بزرگ و چندین سازمان خبری را در یک بازیکن ترکیب می‌کند که غول امیدوار است به او اجازه دهد تا با امثال دیزنی و نتفلیکس رقابت کند، تا چیزی از آمازون، اپل و گوگل نگوید. شرکت جدید Skydance نام دارد (همان نام استودیویی که الیسون 20 سال پیش تأسیس کرد) و تیم اجرایی به رهبری الیسون و یکی از مدیران اجرایی Ynon Kreiz، یک کار چالش برانگیز پیش روی خود خواهند داشت: ادغام دو غول بزرگ، پرداخت بیش از 80 میلیارد دلار بدهی و تبدیل شرکت به یک شرکت سرگرمی و فناوری ترکیبی. امروز یک روز تاریخی است، نه فقط برای Skydance بلکه برای کل صنعت ما. الیسون در بیانیه‌ای گفت: از همان ابتدا، جاه‌طلبی ما این بود که این دو استودیو طبقه‌ای را گرد هم بیاوریم و رقیبی قوی‌تر، با استعداد، منابع و دستیابی به گفتن داستان‌های بزرگ در هر سبک، در هر پلتفرم، برای مخاطبان در همه جا ایجاد کنیم. اکنون این جاه طلبی یک واقعیت است. ما از همه کسانی که این امکان را فراهم کردند، کارمندان، استعدادهای خلاق و تیم های تولید هر دو شرکت که خستگی ناپذیر برای رسیدن ما به اینجا و الهام بخشیدن به مخاطبان در سراسر جهان هر روز تلاش کردند، و همچنین مشاوران و شرکای که این معامله را به اتمام رساندند، سپاسگزاریم. تمرکز ما اکنون معطوف به آینده است: ساخت شرکتی که خلاقان را توانمند می کند، مخاطبان را سرگرم می کند و به سهامداران پاداش می دهد. ما نمی توانیم بیشتر از این هیجان زده باشیم که سر کار برویم."}, {"source": "Hollywood Reporter", "title": "The Team Buys U.K. Creators Agency In Expansion Move", "link": "https://www.hollywoodreporter.com/business/business-news/the-team-uk-creators-agency-outreach-group-1236723239/", "summary": "The management firm formerly known as Wasserman has snapped up Outreach Talent Group, co-founded by Emilio Arciniega, which has its main base in London.", "date_str": "2026-10-06T12:39:26+00:00", "hash": "28f30ba68ea59fb0", "title_fa": "تیم در حرکت توسعه، آژانس سازندگان بریتانیا را می‌خرد", "summary_fa": "شرکت مدیریتی که قبلاً با نام Wasserman شناخته می شد، گروه استعدادهای فراگیر را که توسط امیلیو آرسینیگا تأسیس شده بود، که پایگاه اصلی آن در لندن است، ایجاد کرد. همانطور که تیم در حال عبور از فرآیند فروش است که منجر به خروج بنیانگذار آن کیسی واسرمن شد، شرکت تحت رهبری مایک واتس در حالت توسعه قرار دارد. مایکل کالوین جونز، معاون سازندگان این شرکت، سه‌شنبه اعلام کرد که شرکت مدیریت و تولید مستقر در وست‌وود، بوتیکی را خریداری کرده است. جونز اظهار داشت که رشد چشمگیر OTG در پنج سال گذشته گواهی بر سطح خدمات و تعهدی است که آنها هر روز استعداد خود را ارائه می دهند. ارزش‌ها و رویکرد آن‌ها به نمایندگی کاملاً با ما همخوانی دارد و OTG را به یک مکمل طبیعی برای تیم تبدیل می‌کند زیرا ما به گسترش توانایی خود برای نمایندگی استعدادهای برجسته در سراسر اروپا ادامه می‌دهیم. Outreach که توسط امیلیو و امی آرسینیگا تأسیس شد، پایگاه اصلی خود را در لندن دارد اما در نیویورک نیز حضور دارد. این شرکت که در سال 2021 شروع به کار کرد، فهرست مشتریانی دارد که در دسته‌های سازندگان، از جمله لیلا پل، کلین‌ویث بی، مونتل مکنزی، کالوم هریس، دنی ری، سوفی ریچاردز، پالپ کیچن، دکتر فی، خانه با رو، جنی مانیون، جس بریچ و جس ایزات و دیگران قرار دارد. این حرکت به فهرست سازندگان The Team شامل Livvy Dunne، Taylen Biggs، Grant Horvat، The Bryan Bros، MatPat، Abby Baffoe و غیره می‌شود. امیلیو آرسینیگا به عنوان svp در واحد سازندگان به تیم ملحق خواهد شد. تیم، متعلق به Providence Equity Partners، در اوایل سال جاری تغییر نام داد زیرا غول واسرمن سهام خود را فروخت و پس از یک رسوایی مرتبط با اپشتاین که منجر به خروج چندین مشتری شد، از شرکت خارج شد."}, {"source": "Hollywood Reporter", "title": "Hollywood Kids PR Veteran Lilah Kojoori Launches Initiative to Help Young Talent Navigate Life in the Public Eye", "link": "https://www.hollywoodreporter.com/news/general-news/next-generation-collective-young-talent-mental-health-1236722780/", "summary": "Next Generation Collective will support the mental health of youth in entertainemtn in collaboration with The Kids Mental Health Foundation and Hollywood Mind. Founding advisory board members include Isabela Merced, Kel Mitchell and Soleil Moon Frye.", "date_str": "2026-10-06T12:00:00+00:00", "hash": "6bccb95c2ab11823", "title_fa": "لیلا کجوری، پیشکسوت روابط عمومی هالیوود کیدز، طرحی را برای کمک به استعدادهای جوان راه اندازی می کند تا زندگی را در معرض دید عموم قرار دهند.", "summary_fa": "مجموعه نسل بعدی از سلامت روان جوانان در سرگرمی با همکاری بنیاد سلامت روان کودکان و ذهن هالیوود حمایت خواهد کرد. اعضای هیئت مشاور موسس شامل ایزابلا مرسدس، کل میچل و سول مون فرای هستند. یک ابتکار جدید با هدف کمک به جوانان در زمینه سرگرمی، موسیقی و اقتصاد خلاق در جهت رشد در چشم عموم راه اندازی شد. این مجموعه توسط لیلا کجوری، یک مدیر قدیمی ارتباطات سرگرمی کودکان که بیش از 20 سال تجربه کار با مجریان جوان و خانواده های آنها برای ارائه راهنمایی های بیشتر، منابع قابل اعتماد و جامعه حمایتی قوی تری دارد، تأسیس شد. کجوری 20 سال را در Nickelodeon و Paramount+ بچه ها و خانواده گذراند و از نزدیک با چندین ستاره که در Nickelodeon شروع به کار کردند، از جمله Ariana Grande، Miranda Cosgrove، Jentette McCurdy، Victoria Justice، Keke Palmer، Jace Norman، Breanna Yde، Jack Griffo، Is Kira Siwawa Mercedin، و Is Kira Siwa Mercedin، همکاری کرد. دکتر گفت: ما هیجان زده هستیم که این گروه کار خود را با یادگیری از جامعه ای که می خواهند حمایت کنند آغاز می کنند. آریانا هوت، مدیر اجرایی بالینی بنیاد سلامت روان کودکان و روانشناس کودکان در بیمارستان کودکان سراسر کشور. مسیرهای زیادی وجود دارد که این کار مهم می تواند شکل بگیرد، و این فوق العاده است که به این شیوه متفکرانه راه اندازی شده است. هالیوود مایند که توسط کتی اپلفلد اولسون، روزنامه‌نگار سرگرمی کهنه کار تأسیس شده است، گروه را با استعدادها، مدیران اجرایی، مدافعان و متخصصان سلامتی مرتبط می‌کند، در برنامه‌نویسی شریک می‌شود و کار گروه را در رویدادهایش ارتقا می‌دهد."}, {"source": "Hollywood Reporter", "title": "Now It’s Clear Why Amazon Didn’t Want to Release ‘Artificial’: It’s Withering AF", "link": "https://www.hollywoodreporter.com/movies/movie-news/what-artifical-is-about-altman-garfield-1236723194/", "summary": "Luca Guadagnino’s new film skewers OpenAI's Sam Altman and almost anyone who ever aligned with him. It’s also largely accurate.", "date_str": "2026-10-06T12:00:00+00:00", "hash": "b05eb6476ba17554", "title_fa": "اکنون مشخص شده است که چرا آمازون نمی‌خواست «مصنوعی» را منتشر کند: فوکوس خودکار در حال خشک شدن است", "summary_fa": "فیلم جدید لوکا گوادانینو سم آلتمن از OpenAI و تقریباً هر کسی که با او همسو شده است را به سیخ می کشد. همچنین تا حد زیادی دقیق است. تکنوکاپیتالیسم تهاجمی پیروز می شود، ایمنی می میرد یک نام طولانی برای یک فیلم و یک لاگ لاین کوتاه برای یک فیلم است، با این حال این عبارت ممکن است به طور دقیق برای هر دو در مورد مصنوعی استفاده شود. لوکا گوادانینو آخرین و موضوعی ترین فیلم خود را عصر دوشنبه در شصت و چهارمین جشنواره فیلم نیویورک به نمایش درآورد، اولین ایستگاه از چیزی که قبلاً یک سفر طولانی غیرمعمول به نظر می رسید. این فیلم که توسط استودیو ام جی ام آمازون پس از سرمایه گذاری 50 میلیارد دلاری شرکت مادرش در OpenAI کنار گذاشته شد، همانطور که مشخص شد، برای یک شرکت فناوری بزرگ غیرممکن خواهد بود، حتی اگر هرگز برای آن 5 درصد سهام شرکت سام آلتمن قرارداد نبندد. به طور مداوم زیر پرتوهای خورشید کالیفرنیا، مصنوعی (در حال حاضر تحت حمایت استودیوی Anora Neon) فیلم لحظه ای است که داستان منشأ باتلاق هوش مصنوعی فعلی ما در سطح واقعی، روانی و تقریباً در هر سطح دیگری است. یا همانطور که دنیس لیم، رئیس برنامه نویسی NYFF قبل از نمایش فیلم گفت: ما در حال حاضر در یک دوره آستانه هستیم. ما باید بفهمیم که چگونه به اینجا رسیدیم، و فیلمی که می‌خواهید ببینید این راه را به ما نشان می‌دهد. این فیلم به طور قابل توجهی وفادار است، گاهی اوقات وفادار و گاهی اوقات فیلمی ترسناک به موضوع ظهور هوش مصنوعی سرمایه داری می پردازد، زیرا ایلیا سوتسکور، یک مهاجر روسی ایده آلیست و از نظر اجتماعی بی ظرافت، در دفتر جفری هینتون، پدرخوانده هوش مصنوعی، در دانشگاه تورنتو ظاهر می شود. برنده، به زودی او را به گوگل و هاله خلیج آن دنبال کرد."}, {"source": "Hollywood Reporter", "title": "Skilla Baby Won’t Be Stopped", "link": "https://www.hollywoodreporter.com/music/music-features/skilla-baby-the-price-of-fame-interview-1236701020/", "summary": "The Detroit rapper released his latest album 'The Price of Fame' over the summer.", "date_str": "2026-10-06T11:45:00+00:00", "hash": "654cadf01f72090b", "title_fa": "Skilla Baby متوقف نخواهد شد", "summary_fa": "این خواننده رپ دیترویتی آخرین آلبوم خود به نام The Price of Fame را در تابستان منتشر کرد. این خواننده رپ دیترویتی پس از تیراندازی متحول کننده در سال 2025 وارد فصل جدیدی شده است. اکنون با آلبوم اخیرش به نام قیمت عشق و رزومه بازیگری رو به رشد، این جوان 28 ساله مصمم است به مخاطبان نشان دهد که چیزی فراتر از یک زمان خوب است. اسکیلا، که نام اصلی او تروون گاردنر است، سال‌ها است که جایگاه خود را در هیپ‌هاپ باز کرده و با آهنگ‌هایی از جمله Bae و Mama طرفداران خود را پیدا کرده است. اما با Show Me Love، تک آهنگ پیش از انتشار آخرین آلبوم خود، رپر می خواست چیزی بسازد که فراتر از هر جمعیتی باشد. داستان های مرتبط TV Starz از اولین نگاه ها به Young Ghost و Young Tommy در قدرت پرده برداری کرد: Origins TV Michael Rainey Jr. و جوزف سیکورا برای تکرار نقش‌های طارق و تامی در سری جدید Power: Legacy این آهنگ بهترین آهنگی بود که من احساس می‌کردم همه می‌توانند به آن گوش دهند، با هر فرهنگ، هر قومی، و این رویکرد من با بقیه آلبوم بود، اسکیلا به هالیوود ریپورتر در زوم می‌گوید. پس از مبارزه با افسردگی و زنده ماندن از یک تیراندازی، این خواننده رپ می گوید رابطه اش با موسیقی و با خودش تغییر کرده است. او به دنبال خلق آهنگ‌هایی نیست که لحظه‌ای با مردم بماند، در عوض او می‌خواهد آثارش مدت‌ها پس از پایان آهنگ نزد شنوندگانش بماند. او می گوید من می خواهم بر احساسات مردم در زندگی روزمره آنها تأثیر بگذارم. من هیجان زده هستم که دامنه خود را به عنوان یک شخص بیش از موسیقی نشان دهم. اسکیلا اضافه می کند که من می خواهم ترانه سرای مورد علاقه مردم باشم و واقعاً طرز فکر آنها را نسبت"}, {"source": "Hollywood Reporter", "title": "London Film Fest Gets Concrete – Literally, and More Than Once!", "link": "https://www.hollywoodreporter.com/movies/movie-news/london-film-festival-2026-lff-concrete-movie-titles-1236720815/", "summary": "The 2026 lineup, including several movies with \"concrete\" in their title, made for \"hilarious and quite confusing program meetings,\" shares fest director Kristy Matheson.", "date_str": "2026-10-06T10:00:00+00:00", "hash": "593f5b12b7821264", "title_fa": "جشنواره فیلم لندن بتن می شود - به معنای واقعی کلمه و بیش از یک بار!", "summary_fa": "کریستی متسون، مدیر جشنواره، می‌گوید مجموعه‌های سال ۲۰۲۶، شامل چندین فیلم با عنوان «بتن»، برای «جلسات برنامه‌های خنده‌دار و کاملاً گیج‌کننده» ساخته شده‌اند. سال گذشته، انواع پرندگان در حال پرواز در میان فیلم ها در صفوف جشنواره فیلم لندن BFI (LFF) دیده شدند. امسال، جشنواره به معنای واقعی کلمه و بیش از یک بار در حال مشخص شدن است. در واقع، سه فیلم بلند در مجموعه LFF 2026 عبارت بتن را در عنوان دارند. کریستی متسون، که LFF را به عنوان مدیر هنری جشنواره‌های BFI برنامه‌ریزی می‌کند، به تمسخر می‌گوید: ما از حیوانات به اجسام بی‌جان یا جهان معدنی رسیده‌ایم. همه این فیلم‌ها در لحن و موضوعشان به طرز باورنکردنی متفاوت هستند، اما همه آنها در عنوان مشخص هستند. بنابراین، بسیاری از جلسات برنامه کاملاً سرگرم کننده و خنده دار و کاملاً گیج کننده را تشکیل داد. داستان‌های مرتبط فیلم‌های امیلی بلانت، بنیسیو دل تورو، جاش برولین برد سیکاریو ۳ جوایز پادکست گپ پنه‌لوپه کروز در مورد آواز خواندن و رقصیدن در La Bola Negra، هم‌پیمانی مجدد با باردم در پناهگاه و خنده‌کردن آن‌ها در دعوت می‌تواند به ما بگوید که یک مصالح ساختمانی در حال حاضر در مورد فیلم‌ها و فیلم‌سازان مطرح است. اولویت ها؟ ایده بازگشت به چیزی اساسی، چیزی است که واقعاً در برنامه ظاهر شد، متسون را پیشنهاد می کند. بنابراین، بدون بحث بیشتر، در اینجا نگاهی دقیق تر به سه عنوان واقعی در برنامه LFF 2026 داریم. فیلم جسیکا جانسون و رایان ارماکورا ما را به مزارع صدف در کانادا می برد. این مستند سینمایی غنی که با ریتم‌های جزر و مد مزارع صدف در بریتیش کلمبیا شکل گرفته است، که در 35 میلی‌متر فیلم‌برداری شده است، جایی وجود دارد که کار، تحقیقات علمی و دنیای زنده به هم می‌رسند، وب‌سایت LFF را برجسته می‌کند."}, {"source": "Variety", "title": "France Boosts Oscar Campaign Support as Industry Sounds Alarm Over Declining Exports", "link": "https://variety.com/2026/film/global/france-oscar-campaign-support-declining-exports-1236899241/", "summary": "France s National Film Board (CNC) has unveiled a new strategy to boost the profile of French movies and talent navigating the Oscar race. Unveiled during a conference on film and TV exports held at the CNC on Monday, the new strategy will see the government-back organization double the financial aid granted to campaigns. The CNC [ ]", "date_str": "2026-10-06T14:17:18+00:00", "hash": "a59b2446103ea69e", "title_fa": "فرانسه حمایت از کمپین اسکار را افزایش داد زیرا صنعت هشدار کاهش صادرات را به صدا درآورد", "summary_fa": "هیئت ملی فیلم فرانسه (CNC) از یک استراتژی جدید برای تقویت نمایه فیلم های فرانسوی و استعدادهایی که در مسابقه اسکار حضور دارند، رونمایی کرده است. این استراتژی جدید که در جریان کنفرانس صادرات فیلم و تلویزیون در CNC در روز دوشنبه برگزار شد، نشان می‌دهد که سازمان تحت حمایت دولت کمک‌های مالی اعطایی به کمپین‌ها را دو برابر خواهد کرد. CNC [ ] این کشور از زمانی که Rgis Wargnier's Indochine در سال 1993 این افتخار را به دست آورد، علیرغم نامزدی های مکرر در آن بخش، این جایزه بین المللی را دریافت نکرده است. پرطرفدار در Variety مدیر اجرایی که اخیراً موسسه مشاوره Cinema Collectors مستقر در پاریس را تأسیس کرده است، تازه در کمپین برنده اسکار برای ناتالی موستیاتا و الکساندر سینگ دو نفر در حال تبادل بزاق به این نقش می پردازد. از دیگر کارهای جوایز او می توان به خدمت به عنوان مشاور و تبلیغ بین المللی در کمپین موبی برای فیلم The Substance به کارگردانی کورالی فارگیت و همچنین همکاری طولانی مدت با فلوریان زلر که شامل The Father بود که برنده دو جایزه اسکار شد، اشاره کرد. کوشون در کنفرانس دوشنبه گفت که فرانسه در پذیرش نوع استراتژی جوایز تخصصی نسبتا کند بوده است. کوچون گفت، استراتژیست جوایز حرفه ای است که در فرانسه یا حتی در اروپا بسیار رایج نیست و این شغل را ترکیبی از تبلیغات، بازاریابی و تأثیرگذاری توصیف می کند تا مطمئن شود فیلم ها و استعدادها توسط اعضای آکادمی دیده می شوند و در طول مسابقه در رادار رأی دهندگان باقی می مانند. برای CNC، هدف گسترده‌تر نیز فراتر رفتن از تمرکز سنتی فرانسه بر دسته‌بندی فیلم‌های بین‌المللی و هماهنگی بهتر کمپین‌ها در بخش‌های کارگردانی، بازیگری، فیلمنامه و صنایع دستی است. کوچون گفت: در فرانسه، ما گاهی اوقات روی بهترین دسته فیلم بین المللی تمرکز می کنیم. اما"}, {"source": "Variety", "title": "How David Ellison Won the Battle: Timeline of Paramount’s Rocky Road to Acquiring Warner Bros. Discovery", "link": "https://variety.com/2026/film/news/timeline-paramount-warner-bros-merger-skydance-1236895020/", "summary": "It’s been a hell of a ride. David Ellison’s quest to control two iconic Hollywood studios has finally been completed added a rollicking new chapter to the storied recent history of Hollywood megamergers. On the morning of Tuesday, Oct. 6, the Paramount-Warner Bros. Discovery merger officially closed. The new company, Skydance Corp., brings together [ ]", "date_str": "2026-10-06T14:10:27+00:00", "hash": "c9889e166455724e", "title_fa": "چگونه دیوید الیسون در نبرد پیروز شد: جدول زمانی مسیر راکی ​​پارامونت برای به دست آوردن کاوشگر برادران وارنر", "summary_fa": "این یک سواری جهنمی بوده است. تلاش دیوید الیسون برای کنترل دو استودیوی نمادین هالیوود سرانجام به پایان رسید، فصل جدیدی را به تاریخچه اخیر ادغام های بزرگ هالیوود اضافه کرد. صبح روز سه شنبه، 6 اکتبر، ادغام پارامونت و برادران وارنر دیسکاوری رسماً بسته شد. شرکت جدید، Skydance Corp.، [ ] را گرد هم آورده است. تلاش دیوید الیسون برای کنترل دو استودیوی نمادین هالیوود سرانجام به پایان رسید، فصل جدیدی را به تاریخچه اخیر ادغام های بزرگ هالیوود اضافه کرد. 7 آگوست 2025: Skydance Media خرید 8 میلیارد دلاری پارامونت گلوبال را پس از یک فرآیند پرفراز و نشیب یک ساله تکمیل کرد. پرطرفدار در ورایتی سپتامبر 2025: اولین صدای اورتور دیوید الیسون به دیوید زاسلاو و برادران وارنر هیئت مدیره اکتشاف 21 اکتبر 2025: برادران وارنر. Discovery به طور رسمی فرآیند فروش را با توجه به علاقه ناخواسته ای که شرکت از چندین طرف دریافت کرده است، آغاز می کند. نوامبر 2025: Netflix، Comcast و Skydance Media پیشنهادهایی را برای تمام یا بخشی از Warner Bros. Discovery ارائه کردند. 5 دسامبر 2025: نتفلیکس برنده روند حراج شد زیرا برادران وارنر دیسکاوری اعلام کرد که قراردادی 82.7 میلیارد دلاری برای خرید سهام و نقدینگی برای فروش برادران وارنر و HBO (اما نه CNN، TNT و سایر کانال‌های کابلی) به غول استریم تنظیم کرده است. دسامبر 8، 2025: پارامونت اسکای‌دنس، پیشنهاد مناقصه‌ای را برای سهام دیسکاوری برادران وارنر و کمپینی برای متقاعد کردن سهامداران WBD برای حمایت از پیشنهاد آن آغاز کرد. دیوید الیسون در یک کنفرانس تلفنی به تحلیلگران وال استریت می گوید، پیشنهاد ما از هر بعد برتر از نتفلیکس است."}, {"source": "Variety", "title": "London Film Festival Director on Why the Event Has Become Awards Season’s Unofficial Starter Gun: ‘The Whole World Is Here’", "link": "https://variety.com/2026/film/festivals/london-film-festival-director-awards-seasons-starter-gun-1236899990/", "summary": "With its positioning in October after the likes of Berlin, Cannes, Venice, Toronto and Telluride have helped anoint most of the year s buzziest and most talked about films, the BFI London Film Festival has long been an event where many of these films come together in one place for the first time. This year s LFF [ ]", "date_str": "2026-10-06T14:00:00+00:00", "hash": "626765fa0cf8eff0", "title_fa": "مدیر جشنواره فیلم لندن درباره چرا رویداد تبدیل به تفنگ غیررسمی فصل جوایز شده است: «کل دنیا اینجاست»", "summary_fa": "جشنواره فیلم لندن BFI مدت‌هاست که رویدادی است که در آن بسیاری از این فیلم‌ها برای اولین بار در یک مکان گرد هم می‌آیند، پس از اینکه فیلم‌هایی مانند برلین، کن، ونیز، تورنتو و تلوراید در ماه اکتبر برگزار شد. LFF امسال [ ] اما در چند سال گذشته، LFF نیز به یکی از مهمترین ایستگاه های فصل جوایز تبدیل شده است. برای بسیاری، این در حال حاضر به طور موثر اسلحه غیر رسمی شروع برای مسابقه، حداقل از دیدگاه بین المللی است. زیرا در کنار 12 روز نمایش عمومی، اکنون برای رای دهندگان نمایش های دیوار به دیوار FYC، رویدادهای سلیقه ساز، Q As و کوکتل نیز وجود دارد. فیلمسازان و ستارگانی که قبلاً فقط برای اولین نمایش خود حاضر می‌شدند، اکنون برنامه‌های فشرده و چند روزه‌ای در اختیارشان قرار می‌گیرد که در آن بین رویدادها حرکت می‌کنند تا درباره کارشان صحبت کنند و ژست سلفی بگیرند. محبوب در Variety این چیزی است که کریستی متسون، مدیر جشنواره به خوبی از آن آگاه است، و می‌گوید که جایگاه جوایز فزاینده مهم جشنواره درست با شروع فصل، چیزی است که مدت‌ها در کار بوده است. او می‌گوید که احساس می‌کنم جایگاه جشنواره در حال حاضر واقعاً گواهی بر مدیران سابق جشنواره است و اینکه آنها واقعاً برای قرار دادن این ایستگاه در تقویم روی نقشه برای مردم بسیار سخت تلاش کردند. بدیهی است که تعداد زیادی از رای دهندگان جوایز که اینجا در بریتانیا هستند، وجود دارد، اما بریتانیا نیز بازار بسیار مهمی برای اکران فیلم       const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
