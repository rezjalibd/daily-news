اع از خود گفت: «پس از جنگ ۱۲ روزه، قابلیت‌های دفاعی به‌گونه‌ای روزآمد شده‌اند که برآوردها و محاسبات دشمن را تغییر داده و تردیدی عمیق در میان دشمنان درباره استمرار جنگ ایجاد کرده‌اند.» مهرداد اخلاقی اگرچه برای رسانه‌ها چهره‌ای ناشناس بود اما آمریکا ۱۹ سال پیش او را در فهرست تحریم‌هایش قرار داده بود. آقای پزشکیان امروز گفت‌ تحریم‌ شدن او خود دلیل صلاحیتش است. نام آقای اخلاقی در قطعنامه ۱۷۴۷ شورای امنیت سازمان ملل متحد ایران هم ذکر شده است. در آن قطعنامه از کشورهای دنیا خواسته شده‌ ارتباط با شرکت‌های ایرانی فعال در انرژی هسته‌ای را محدود کنند ساعتی پس از رای"}, {"source": "BBC Persian", "title": "اعدام دو بنگلادشی در عربستان؛ مقامات بنگلادش می‌گویند از اجرای حکم بی‌خبر بودند", "link": "https://www.bbc.com/persian/articles/cvde83dw49r6o?at_medium=RSS&at_campaign=rss", "summary": "بنگلادش اعدام دو شهروندش در عربستان سعودی را محکوم کرد و خواستار توضیح در این باره شد. مقام‌های سعودی این دو نفر را به رفتارهای «غیراخلاقی» در مسجدی در مکه متهم کرده بودند.", "date_str": "2026-10-18T11:58:05+00:00", "hash": "9953599d9f01a939", "title_fa": "اعدام دو بنگلادشی در عربستان؛ مقامات بنگلادش می‌گویند از اجرای حکم بی‌خبر بودند", "summary_fa": "بنگلادش اعدام دو شهروندش در عربستان سعودی را محکوم کرد و خواستار توضیح در این باره شد. مقام‌های سعودی این دو نفر را به رفتارهای «غیراخلاقی» در مسجدی در مکه متهم کرده بودند. کنسولگری بنگلادش در جده اعلام کرده است که هیچ‌گونه اطلاعی از این اعدام‌ها دریافت نکرده بود. بر اساس بیانیه‌ای که روز چهارشنبه (۱۴ اکتبر، ۲۲ مهر) وزارت کشور عربستان سعودی صادر و خبرگزاری دولتی عربستان منتشر کرد، این اعدام‌ها در مکه انجام شده است. بر اساس اعلام وزارت کشور عربستان سعودی، نیروهای امنیتی دو شهروند بنگلادشی را به اتهام رفتارهای «غیراخلاقی و ناشایست» در مسجدی در مکه بازداشت کردند و پس از انجام تحقیقات، پرونده آن‌ها به دادگاه ارجاع شد. دادگاه اتهامات را وارد دانست و هر دو نفر را به اعدام محکوم کرد. مقام‌های سعودی جزئیات بیشتری درباره اتهامات این دو نفر منتشر نکرده‌اند. پس از انتشار این خبر، کنسولگری بنگلادش در جده روز پنج‌شنبه (۱۵ اکتبر، ۲۳ مهر) نامه‌ای به وزارت خارجه عربستان نوشت و خواستار جزئیات شد. منابعی در سرکنسولگری بنگلادش در جده هم تایید کرده‌اند که مقام‌های سعودی درباره بازداشت و روند رسیدگی به پرونده و اعدام این دو نفر هیچ اطلاعی به آنها نداده‌اند. در نتیجه، هیچ‌کس نمی‌داند جسد این دو نفر در کجا نگهداری می‌شود و چگونه و چه زمانی به مقام‌های بنگلادشی تحویل داده خواهد شد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. به دلیل آنکه بنگلادش به‌طور رسمی از این موضوع مطلع نشده است، سفارتش حتی نمی‌تواند با خانواده‌های این دو شهروند بنگلادشی تماس بگیرد یا اطلاعاتی در اختیارشان قرار دهد. کارشناسان می‌گویند که عربستان سعودی با اجرای حکم اعدام این دو شهروند بنگلادشی، بدون اطلاع دادن به خانواده‌ها و سفارت بنگلادش، کنوانسیون وین را نقض کرده است."}, {"source": "BBC Persian", "title": "خودروهای سوخته و شیشه‌های خردشده در خیابان‌های پاریس؛ ۱۸۰۰ نفر بازداشت شدند", "link": "https://www.bbc.com/persian/articles/cqm26kdvy3j7o?at_medium=RSS&at_campaign=rss", "summary": "فرانسه روز یکشنبه، پس از یک روز ناآرامی و تظاهرات، با صحنه‌هایی از ویرانی گسترده از خواب برخاست؛ ویترین‌های خردشده، خودروهای سوخته، دوچرخه‌های زغال‌شده و توده‌هایی از خرده‌شیشه و آوار در پیاده‌روهای پاریس به چشم می‌خورد. روز شنبه، در حالی که حدود ۵۵۰ هزار معترض در تظاهراتی که عمدتاً مسالمت‌آمیز بود به خیابان‌ها آمده بودند، پلیس نزدیک به ۱۸۰۰ نفر را بازداشت کرد. معترضان به افزایش قیمت سوخت، هزینه‌های زندگی و تضعیف خدمات عمومی، از جمله وضعیت مدارس، اعتراض داشتند.", "date_str": "2026-10-18T14:15:38+00:00", "hash": "5a89141d998b0e47", "title_fa": "خودروهای سوخته و شیشه‌های خردشده در خیابان‌های پاریس؛ ۱۸۰۰ نفر بازداشت شدند", "summary_fa": "فرانسه روز یکشنبه، پس از یک روز ناآرامی و تظاهرات، با صحنه‌هایی از ویرانی گسترده از خواب برخاست؛ ویترین‌های خردشده، خودروهای سوخته، دوچرخه‌های زغال‌شده و توده‌هایی از خرده‌شیشه و آوار در پیاده‌روهای پاریس به چشم می‌خورد. روز شنبه، در حالی که حدود ۵۵۰ هزار معترض در تظاهراتی که عمدتاً مسالمت‌آمیز بود به خیابان‌ها آمده بودند، پلیس نزدیک به ۱۸۰۰ نفر را بازداشت کرد. معترضان به افزایش قیمت سوخت، هزینه‌های زندگی و تضعیف خدمات عمومی، از جمله وضعیت مدارس، اعتراض داشتند. همچنین گروه‌هایی از آشوبگران که برخی از آن‌ها لباس سیاه پوشیده و صورت خود را با ماسک یا پوشش‌های مخصوص پوشانده بودند، در پاریس، مارسی و دیگر شهرها و شهرک‌ها ظاهر شدند و برخی از آن‌ها اقدام به آتش زدن خودروها و ساختمان‌ها کردند. غارت گسترده‌ای در شهرهای پاریس، مارسی و لیل، و همچنین مناطق دیگر رخ داد. در پاریس، معترضان با پلیس ضدشورش درگیر شدند؛ پلیس نیز برای متفرق کردن جمعیت از گاز اشک‌آور و ماشین‌های آب‌پاش استفاده کرد. در طول روز، برخی گروه‌ها در خیابان‌ها آتش روشن کردند و خودروها را به آتش کشیدند. دست‌کم یک رستوران در آتش سوخت و کاملاً ویران شد؛ همچنین خبرنگاران بی‌بی‌سی شاهد درگیری‌هایی میان برخی از گروه‌ها بودند. پلیس ضدشورش در مرکز پاریس به سمت جمعیتی هجوم برد و چندین نفر را با باتون مورد ضرب‌وشتم قرار داد. محمد اوزدن، از ساکنان پاریس، به خبرگزاری فرانسه گفت: «انگار جنگ شده است.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. یکی دیگر از ساکنان به نام آنیتا گراسیت گفت دیدن گروه‌هایی از جوانان که «همه چیز را در هم می‌شکنند و هیچ ترسی هم از مجازات ندارند»، «وحشتناک» بود. ماریس، زنی که در آن نزدیکی زندگی می‌کند و تنها به ذکر نام کوچک خود بسنده کرد، به بی‌بی‌سی گفت که غارتگران"}, {"source": "BBC Persian", "title": "غرق‌شدن کشتی کانتینربر در تنگه هرمز؛ هشدار مقامات درباره «آیفون‌های دریایی»", "link": "https://www.bbc.com/persian/articles/cmg47r905lglo?at_medium=RSS&at_campaign=rss", "summary": "در پی غرق شدن یک کشتی کانتینربر در تنگه هرمز و ریختن محتویاتش در دریا، پلیس فضای مجازی (فتا) درباره احتمال کلاهبرداری فروش «آیفون دریایی» هشدار داده است. این هشدار پس از انتشار تصاویری از گروهی منتشر شد که پس از غرق شدن یک کشتی کانتینربر با پرچم سنگاپور محتویاتش را از آب جمع‌آوری می‌کردند. گزارش‌هایی هم درباره وجود «کالای لوکس، از جمله آیفون ۱۸» در میان محموله این کشتی منتشر شده بود.", "date_str": "2026-10-18T13:42:55+00:00", "hash": "1688ceb08e0c2f45", "title_fa": "غرق‌شدن کشتی کانتینربر در تنگه هرمز؛ k": "https://www.bbc.com/persian/articles/cqj6jyr5w00go?at_medium=RSS&at_campaign=rss", "summary": "منابعی در ملل متحد به بی‌بی‌سی گفته‌اند که رباب فاطمه، شنبه (۲۵ میزان) وارد کابل شده و فعالیت خود را آغاز کرده است. به گفتهٔ این منابع، قرار است او نخستین دیدار خود را با امیرخان متقی، وزیر خارجهٔ حکومت طالبان، داشته باشد.", "date_str": "2026-10-18T09:55:45+00:00", "hash": "1c7311289c2108c2", "title_fa": "فرستاده ویژهٔ دبیر کل ملل متحد برای افغانستان کار خود را آغاز کرد", "summary_fa": "منابعی در ملل متحد به بی‌بی‌سی گفته‌اند که رباب فاطمه، شنبه (۲۵ میزان) وارد کابل شده و فعالیت خود را آغاز کرده است. به گفتهٔ این منابع، قرار است او نخستین دیدار خود را با امیرخان متقی، وزیر خارجهٔ حکومت طالبان، داشته باشد. رباب فاطمه، نماینده ویژهٔ دبیر کل ملل متحد برای افغانستان (یوناما) ، به کابل، پایتحت، رفته و کار خود را آغاز کرده است. این دومین دیپلمات زن در پنج سال گذشته است که رهبری نمایندگی ملل متحد در افغانستان را بر عهده می‌گیرد. براساس گزارش‌ها او دیشب (شنبه ۲۵ مهر) وارد کابل شد. گزارش شده است که قرار است خانم فاطمه با امیرخان متقی، وزیر خارجهٔ حکومت طالبان، دیدار کند. همزمان با سفر او، معاون نخست‌وزیرحکومت طالبان، در نشستی در کابل از یوناما خواست که به گفتهٔ او در گزارش‌ها و تحلیل‌های خود «بی‌طرف» بماند. فاطمه رباب جانشین رزا اوتونبایوا شده است. خانم اوتونبایوا از سال ۲۰۲۲ تا ۲۰۲۵ نمایندهٔ ویژهٔ دبیر کل ملل متحد برای افغانستان بود و پیش از آن نیز به‌عنوان نخستین رئیس‌جمهور زن و وزیر امور خارجهٔ قرقیزستان فعالیت کرده بود. بر اساس قطعنامهٔ شورای امنیت، یوناما سه مأموریت اصلی دارد: تعامل سیاسی با حکومت طالبان، بررسی و ثبت مسائل مربوط به حقوق بشر و هماهنگی کمک‌های بین‌المللی. اکنون بیش از یک سال می‌گذرد که به کارمندان زن افغان اجازهٔ ورود به دفاتر ملل متحد داده نمی‌شود. انتظار می‌رود خانم فاطمه پیش از هر چیز، دربارهٔ ممنوعیت کاری کارمندان زن افغان، با مقامات حکومت طالبان گفت‌وگوی مستقیم داشته باشد. ملل متحد بارها تأکید کرده است که نبود کارمندان زن بومی بر روند کمک‌رسانی تأثیر منفی گذاشته است، چرا که ارائه‌ خدمات به زنان نیازمند باید بدست زنان انجام شود. این چالش مهم برای خانم فاطمه خواهد بود تا حاکمان فعلی افغانستان را به لغو این سیاست ترغیب کند. بر اساس آخرین آمارها، بیش"}, {"source": "BBC Persian", "title": "چه کسی از خشم دانش‌آموزان فرانسه سود می‌برد؟", "link": "https://www.bbc.com/persian/articles/cvj6j13y9j8no?at_medium=RSS&at_campaign=rss", "summary": "اعتراض‌های گسترده دانش‌آموزان در فرانسه، که با مطالباتی درباره کیفیت آموزش و نابرابری‌های اجتماعی آغاز شد، اکنون به موضوعی جنجالی در آستانه انتخابات ریاست‌جمهوری این کشور تبدیل شده است. در حالی که دولت، چپ رادیکال را به بهره‌برداری سیاسی از این نارضایتی‌ها متهم می‌کند، معترضان می‌گویند هدفشان شنیده شدن صدای نسلی است که احساس می‌کند از سوی سیاستمداران نادیده گرفته شده است.", "date_str": "2026-10-18T01:56:38+00:00", "hash": "58f6c60e9f3fff85", "title_fa": "چه کسی از خشم دانش‌آموزان فرانسه سود می‌برد؟", "summary_fa": "اعتراض‌های گسترده دانش‌آموزان در فرانسه، که با مطالباتی درباره کیفیت آموزش و نابرابری‌های اجتماعی آغاز شد، اکنون به موضوعی جنجالی در آستانه انتخابات ریاست‌جمهوری این کشور تبدیل شده است. در حالی که دولت، چپ رادیکال را به بهره‌برداری سیاسی از این نارضایتی‌ها متهم می‌کند، معترضان می‌گویند هدفشان شنیده شدن صدای نسلی است که احساس می‌کند از سوی سیاستمداران نادیده گرفته شده است. شور و علاقه فرانسوی‌ها به اعتراض در اروپا زبانزد است. در چند سال گذشته، بارها شاهد بوده‌ایم که کشاورزان خشمگین از مقررات پرهزینه، کود حیوانی را به سوی ساختمان شهرداری‌ها پرتاب می‌کنند و جوانان نقاب‌پوش نیز در حومه‌های محروم شهرها، هر از گاهی نارنجک‌های دست‌ساز به سمت نیروهای ضدشورش پرتاب می‌کنند. بیش از سه هفته است که هزاران دانش‌آموز ورودی دبیرستان‌ها را مسدود کرده و اعتراض‌های خود را به خیابان‌ها کشانده‌اند. قرار است اتحادیه‌های کارگری و چهره‌های شاخص جنبش موسوم به «جلیقه‌زردها» نیز به دانش‌آموزان ملحق شوند. سباستین لکورنو، نخست‌وزیر فرانسه، گفت با داغ‌تر شدن فضای سیاسی در آستانه انتخابات ریاست‌جمهوری سال آینده، خشم دانش‌آموزان مورد سوءاستفاده قرار می‌گیرد. جنبش جلیقه‌زردها از سال ۲۰۱۸ بیش از یک سال علیه افزایش هزینه‌های زندگی اعتراض کرد و به یکی از طولانی‌ترین جنبش‌های اعتراضی تاریخ فرانسه تبدیل شد. ژرو ایت مردم آمریکا از عملکرد رئیس‌جمهور تا این مرحله تلقی می‌شود. تمام ۴۳۵ عضو مجلس نمایندگان انتخاب خواهند شد. اعضای مجلس نمایندگان دوره‌ای ثابت و دوساله دارند. معمولا طرح‌های قانونی ابتدا در این مجلس مطرح و درباره آن‌ها بحث می‌شود. هم‌زمان، ۳۵ کرسی از مجموع ۱۰۰ کرسی سنا، نیز به رای گذاشته خواهد شد. سناتورها دوره‌ای شش‌ ساله دارند. از جمله وظایف آن‌ها تائید یا رد طرح‌های قانونی‌ است که از مجلس نمایندگان دریافت می‌کنند. در همان روز، رای‌دهندگان در بخش بزرگی از آمریکا سیاستمداران ایالتی را نیز انتخاب خواهند کرد. رقابت‌های فرمانداری در کالیفرنیا، فلوریدا، جورجیا و میشیگان از جمله انتخابات‌هایی خواهند بود که با دقت زیادی دنبال می‌شوند. اقتصاد آمریکا یکی از مهم‌ترین دغدغه‌های بسیاری از رای‌دهندگانی است که با هزینه بالای سوخت، مواد غذایی، مسکن و خدمات درمانی دست‌وپنجه نرم می‌کنند. تورم همچنان بالاتر از سطح هدف‌گذاری‌شده بانک مرکزی آمریکا باقی مانده است؛ مسئله‌ای که بخشی از آن به جنگی مربوط می‌شود که آمریکا و اسرائیل در ماه فوریه با ایران آغاز کردند."}, {"source": "Iran International", "title": "بازنشستگان در شهرهای مختلف ایران علیه مشکلات معیشتی و سرکوب تجمع کردند", "link": "https://www.iranintl.com/202610189387", "summary": "بازنشستگان تامین اجتماعی و فولاد در شهرهای مختلف ایران از جمله تهران، رشت، کرمانشاه، اصفهان، شوش و اهواز در اعتراض به گرانی، مشکلات معیشتی و درمانی و پرداخت نشدن مطالبات خود تجمع کردند. معترضان در شماری از شهرها علیه فساد، سرکوب و صدور احکام اعدام نیز شعار دادند.", "date_str": "2026-10-18T14:08:13+00:00", "hash": "336e02ef883dabad", "title_fa": "بازنشستگان در شهرهای مختلف ایران علیه مشکلات معیشتی و سرکوب تجمع کردند", "summary_fa": "بازنشستگان تامین اجتماعی و فولاد در شهرهای مختلف ایران از جمله تهران، رشت، کرمانشاه، اصفهان، شوش و اهواز در اعتراض به گرانی، مشکلات معیشتی و درمانی و پرداخت نشدن مطالبات خود تجمع کردند. معترضان در شماری از شهرها علیه فساد، سرکوب و صدور احکام اعدام نیز شعار دادند."}, {"source": "Iran International", "title": "هوش مصنوعی در خدمت رمزگشایی از اسناد تاریخی؛ از ارتش نازی تا دوران ناپلئون", "link": "https://www.iranintl.com/2026101 ا می‌توانند دوباره آن زرادخانه هسته‌ای را بسازند؟ آیا می‌توانند ظرفیت غنی‌سازی خود را احیا کنند؟» او در ادامه، جمهوری اسلامی را متهم کرد که پس از نابودی برنامه هسته‌ای‌اش، با حمله به کشتیرانی تجاری و ایجاد رعب و وحشت در مسیرهای دریایی واکنش نشان داده و این اقدامات یکی از دلایل اصلی افزایش قیمت انرژی بوده"}, {"source": "Radio Farda", "title": "اعتراضات فرانسه به خشونت و غارت کشید؛ بیش از ۱۸۰۰ نفر بازداشت شدند", "link": "https://www.radiofarda.com/a/france-rocked-by-nationwide-clashes-blazes-and-looting/33878750.html", "summary": "فرانسه روز یک‌شنبه را در حالی آغاز می‌کند که در ادامه اعتراضات همراه با «خشونت و غارت» دست‌کم یک بنای تاریخی سوخته و به گفته شهردار پاریس چند خیابان به طور کامل خراب شده‌اند.", "date_str": "2026-10-18T07:14:31+00:00", "hash": "f8354c92d107818a", "title_fa": "اعتراضات فرانسه به خشونت و غارت کشید؛ بیش از ۱۸۰۰ نفر بازداشت شدند", "summary_fa": "فرانسه روز یک‌شنبه را در حالی آغاز می‌کند که در ادامه اعتراضات همراه با «خشونت و غارت» دست‌کم یک بنای تاریخی سوخته و به گفته شهردار پاریس چند خیابان به طور کامل خراب شده‌اند. فرانسه روز یک‌شنبه، ۲۶ مهرماه، را در حالی آغاز می‌کند که در ادامه اعتراضات همراه با خشونت و غارت از سوی معترضان، دست‌کم یک بنای تاریخی در شهر لیموژ در آتش سوخته و به گفته شهردار پاریس چند خیابان در این شهر به طور کامل خراب شده‌اند. همزمان در حالی که نشانه‌ای از پایان این اعتراضات به چشم نمی‌آید، وزارت کشور فرانسه روز یک‌شنبه خبر داد که تاکنون ۱۸۰۰ نفر از میان معترضان دستگیر شده‌اند. لورن نونز، وزیر کشور فرانسه خبر می‌دهد که «حدود ۵۰۰ مأمور پلیس، آتش‌نشان و نیروی امداد پزشکی در اعتراض‌ها زخمی شده‌اند» و افزود این آمار ممکن است تغییر کند. او تأکید کرد فرانسه «در برابر کسانی که می‌خواهند بی‌نظمی و خشونت را تحمیل کنند، تسلیم نخواهد شد». خشونت‌ها در پاریس، مارسی، لیون، بوردو و دیگر شهرها در حاشیهٔ تظاهرات گسترده علیه تورم بالا رخ داد. این ناآرامی‌ها پس از چهار هفته اعتراض دانش‌آموزان به شرایط نامناسب کلاس‌های درس در دبیرستان‌های فرانسه رخ داد؛ اعتراض‌هایی که برخی از آن‌ها نیز به خشونت کشیده شده بود. آقای نونز در پیامی در شبکهٔ ایکس نوشت: «هزار و ۸۰۰ نفر بازداشت شده‌اند و اکنون تحقیقات برای شناسایی عاملان این اقدامات در جریان است تا به دست عدالت سپرده شوند.» وزیر کشور فرانسه «چند هزار نفر از افراد چپ افراطی» را مسئول درگیری با پلیس، آتش‌زدن یا تخریب چندین ساختمان عمومی و غارت گستردهٔ مغازه‌ها در روز شنبه دانست. او گفت: «خسارت‌های مالی قابل‌توجه است، به‌ویژه برای چند صد مغازه‌دار.» سباستین لوکورنو، نخست وزیر فرانسه، نیز ضمن محکوم کردن «شدت خشونت‌ها» در چند روز اخیر به‌ویژه در شهرهای پاریس و مارسِی، دومین شهر بزرگ فرانسه، از"}, {"source": "Radio Farda", "title": "ابراز آمادگی مصر برای کمک در مبارزه با حوثی‌ها؛ امارات هم با عربستان «توافق کرد»", "link": "https://www.radiofarda.com/a/egypt-s-sisi-seeks-parliament-s-backing-to-help-defend-saudi-arabia-if-asked/33878738.html", "summary": "همزمان با ابراز آمادگی مصر برای «دفاع از عربستان سعودی» در نبرد با حوثی‌های یمن، گزارش‌ها حاکی است که امارات نیز با ریاض بر سر ورود دوباره به جنگ در خاک یمن به توافق رسیده است.", "date_str": "2026-10-18T05:50:25+00:00", "hash": "b1b754de5fba3b24", "title_fa": "ابراز آمادگی مصر برای کمک در مبارزه با حوثی‌ها؛ امارات هم با عربستان «توافق کرد»", "summary_fa": "همزمان با ابراز آمادگی مصر برای «دفاع از عربستان سعودی» در نبرد با حوثی‌های یمن، گزارش‌ها حاکی است که امارات نیز با ریاض بر سر ورود دوباره به جنگ در خاک یمن به توافق رسیده است. در پی ابراز آمادگی عبدالفتاح السیسی، رئیس جمهور مصر، برای جنگ در کنار ریاض، مجلس مصر روز شنبه، ۲۵ مهرماه، اعلام کرد که در روز یک‌شنبه به درخواست سیسی در این باره جلسه‌ای اضطراری و فوق‌العاده خواهد داشت. آقای سیسی که در یک مراسم نظامی سخنرانی می‌کرد روز شنبه گفت: «بی‌معناست که ما بگذاریم عربستان سعودی و امنیت و ثباتش لطمه‌ای ببیند.» رئیس جمهور مصر در ادامه تأکید کرد که مصر به دنبال حمله به کسی نیست، اما برای دفاع آماده است. عربستان سعودی که بزرگ‌ترین صادرکننده نفت خام جهان و همسایه مصر است، به‌ویژه طی روزهای اخیر هدف حملات مستمر حوثی‌های یمن قرار گرفته است؛ از جمله حمله به فرودگاه بین‌المللی ریاض که مرگبارترین حمله از این نوع طی چند سال گذشته بوده است. این حملات در شرایطی انجام می‌شوند که جنگ با حوثی‌ها به‌شدت تشدید شده است. جنگ داخلی یمن تابستان امسال پس از فروپاشی آتش‌بس با میانجی‌گری سازمان ملل متحد، بار دیگر شدت گرفت. این تحول چند ماه پس از آغاز جنگ آمریکا با ایران رخ داد و واشینگتن می‌گوید حوثی‌ها به حمایت از ایران، تنش را تشدید کرده‌اند. در همین زمینه یک مقام وزارت خارجه عربستان سعودی روز پنجشنبه ۲۳ مهر جمهوری اسلامی ایران را متهم کرد که حوثی‌های یمن را به ادامه درگیری با این کشور تشویق می‌کند و گفت تهران همچنان به تسلیح و آموزش این گروه ادامه می‌دهد. رئیس جمهور مصر روز شنبه تأکید کرد که در این زمینه، پس از تأیید مجلس مصر، به توصیه سلطان سعودی و ولیعهد او، محمد بن سلمان، عمل خواهد کرد. همزمان روزنامه بریتانیایی گاردین روز شنبه به نقل از «منابعی"}, {"source": "Radio Farda", "title": "وزارت خارجه ایران با تأیید توقف مراودات تجاری مرزی با پاکستان، آن را «موقت» خواند", "link": "https://www.radiofarda.com/a/iran-s-exports-to-pakistan-temporarily-halted/33878518.html", "summary": ".", "date_str": "2026-10-17T16:15:34+00:00", "hash": "367b844b734f7a9b", "title_fa": "وزارت خارجه ایران با تأیید توقف مراودات تجاری مرزی با پاکستان، آن را «موقت» خواند", "summary_fa": "سخنگوی وزارت خارجه جمهوری اسلامی روز شنبه ۲۵ مهر در پی انتشار گزارش‌هایی دربارهٔ توقف فعالیت تجاری یک گذرگاه بین ایران و پاکستان، اعلام کرد که «ترددها و مراودات مرزی ایران و پاکستان موقتا متوقف شده است». اسماعیل بقائی بدون اشاره به جزئیات بیشتر دلیل این اتفاق را «مشکلات فنی و لزوم اتخاذ تدابیر احتیاطی» ذکر کرد. اختلال در تجارت زمینی ایران و پاکستان در حالی گزارش می‌شود که وزارت خزانه‌داری آمریکا اخیراً در مورد ادامهٔ همکاری مؤسسات مالی خارجی با بانک‌ها و نهادهای مالی تحریم‌شدهٔ ایران هشدار جدیدی صادر کرد. سخنگوی وزارت خارجه ایران وعده داده که مشکل در گذرگاه‌های مرزی بعد از مشورت بین مقام‌های ایران و پاکستان در «اسرع وقت» حل خواهد شد. خبرگزاری صداوسیمای جمهوری اسلامی روز شنبه به نقل از سید حسین حسینی، مدیرکل دفتر ترانزیت سازمان راهداری، گزارش داد که طرف پاکستانی گذرگاه مرزی ریمدان-گبد در استان سیستان و بلوچستان را بسته است. این مقام ایرانی تأکید کرد که تردد مسافران از این گذرگاه همچنان برقرار است و رایزنی‌ها برای رفع مشکل و بازگشایی مرز ادامه دارد. از سوی دیگر، پیمان سنندجی، رئیس کمیسیون حمل‌ونقل اتاق بازرگانی تهران، گفت که مرز مشترک ایران و پاکستان برای تجارت زمینی بسته نشده، اما صادرکنندگان ایرانی و واردکنندگان پاکستانی با مشکلات بانکی روبه‌رو شده‌اند. او همچنین انتشار نامه‌ای دربارهٔ تعطیلی یکی از گذرگاه‌های مرزی مشترک دو کشور را تکذیب کرد و آن را جعلی خواند. سنندجی در گفت‌وگو با خبرگزاری مهر توضیح داد که واردکنندگان پاکستانی برای خرید کالا از ایران باید اطلاعات محموله‌های خود را از طریق سامانهٔ واردات و شبکهٔ بانکی پاکستان ثبت کنند، اما تحریم بانک‌های ایرانی انجام این فرایند را دشوار کرده است. او هشدار داد که اگر محدودیت‌های بانکی ادامه پیدا کند و امکان انجام تشریفات مالی لازم فراهم نشود، صادرات ایران به پاکستان عملاً متوقف خواهد شد."}],
      tech: [{"source": "MIT AI", "title": "Giving AI a “crystal clear” view of the materials world", "link": "https://news.mit.edu/2026/giving-ai-crystal-clear-view-of-materials-world-1018", "summary": "In principle, artificial intelligence could make finding the right material for an application as simple as ordering dinner: Scientists would tell a large language model what they want, and it would serve them a perfectly designed crystal for the job. Unfortunately, that approach doesn’t work well yet, and the problem comes down to data: Most materials consist of crystals, which are 3D periodic arrangements of atoms whose structures are stored in specialized formats, not the text streams that today’s large language models are trained on. The experimental literature is also heavily biased toward a few popular classes of crystals, making AI outputs skew toward those materials. Now MIT researchers have created a multimodal AI model that tackles these problems. The model combines 3D atomic structures with natural language descriptions to create rich linguistic descriptions about the structures from experimental research papers and first-principles computational databases. The unified description outlines not just the chemical composition and structure, but also its properties, processing considerations, and potential applications, helping AI learn more about what makes materials impactful. In a new paper in Nature Communications , the researchers showed their system could identify better material designs than models trained on text streams alone by allowing the model to “see” the atomic arrangements and bonding patterns. For example, when the researchers asked the model to identify materials suited for solid-state lithium-ion battery electrolytes, its top results included materials that had been independently identified as promising candidates. The researchers also showed their model learned geometric representations of material structures in ways text-only models could not. “Structure is really at the heart of the materials science field,” says Ju Li, the Carl Richard Soderberg Professor in Power Engineering in the Department of Materials Science and Engineering (DMSE). “If you understand the structure, you can infer quite a lot about the properties and performance of materials. We wanted to build the connection between a material’s atomic structure and its properties and processing for the model.” Joining Li on a paper about the model are Yang Jeong Park, first author and former MIT postdoc; Mayank Kumaran, a recent University of Illinois Urbana-Champaign computer engineering graduate; Chia-Wei Hsu SM ’26; and Elsa Olivetti, the Jerry McAfee (1940) Professor", "date_str": "2026-10-18T04:00:00+00:00", "hash": "7f3e2d683ab2158d", "title_fa": "ارائه نمایی شفاف از دنیای مواد به هوش مصنوعی", "summary_fa": "در اصل، هوش مصنوعی می‌تواند یافتن مواد مناسب برای یک برنامه کاربردی را به سادگی سفارش دادن شام کند: دانشمندان به یک مدل زبان بزرگ می‌گویند که چه می‌خواهند، و به آنها یک کریستال کاملاً طراحی شده برای این کار ارائه می‌دهد. متأسفانه، این رویکرد هنوز به خوبی کار نمی‌کند و مشکل به داده‌ها برمی‌گردد: بیشتر مواد متشکل از کریستال‌ها هستند، که آرایش‌های دوره‌ای سه‌بعدی اتم‌هایی هستند که ساختارهای آن‌ها در قالب‌های تخصصی ذخیره می‌شوند، نه جریان‌های متنی که مدل‌های زبان بزرگ امروزی روی آن‌ها آموزش دیده‌اند. ادبیات تجربی نیز به شدت به سمت چند کلاس محبوب کریستال ها سوگیری دارد و باعث می شود خروجی های هوش مصنوعی به سمت آن مواد منحرف شوند. اکنون محققان MIT یک مدل هوش مصنوعی چندوجهی ایجاد کرده اند که با این مشکلات مقابله می کند. این مدل ساختارهای اتمی سه‌بعدی را با توصیف‌های زبان طبیعی ترکیب می‌کند تا توصیفات زبانی غنی در مورد ساختارها از مقالات تحقیقاتی تجربی و پایگاه‌های داده محاسباتی اصول اول ایجاد کند. توصیف یکپارچه نه تنها ترکیب شیمیایی و ساختار، بلکه خواص، ملاحظات پردازش و کاربردهای بالقوه آن را نیز تشریح می‌کند و به هوش مصنوعی کمک می‌کند تا در مورد آنچه که مواد را تأثیرگذار می‌کند بیشتر بداند. در مقاله‌ای جدید در Nature Communications، محققان نشان دادند که سیستم آنها می‌تواند طرح‌های مواد بهتری را نسبت به مدل‌هایی که تنها بر روی جریان متن آموزش داده شده‌اند، با اجازه دادن به مدل برای «دیدن» آرایش‌های اتمی و الگوهای پیوند شناسایی کند. به عنوان مثال، هنگامی که محققان از مدل خواستند مواد مناسب برای الکترولیت های باتری لیتیوم یون حالت جامد را شناسایی کند، نتایج برتر آن شامل موادی بود که به طور مستقل به عنوان نامزدهای امیدوارکننده شناسایی شده بودند. محققان همچنین نشان دادند که مدل آن‌ها نمایش‌های هندسی ساختارهای مواد را به روشی آموخته‌اند که مدل‌های"}, {"source": "TechCrunch AI", "title": "Meta removes language that raised scraping and AI training concerns", "link": "https://techcrunch.com/2026/10/17/meta-removes-language-that-raised-scraping-and-ai-training-concerns/", "summary": "A Meta spokesperson insisted that the updated terms did not reflect a change in the way Meta crawls the web.", "date_str": "2026-10-17T21:31:32+00:00", "hash": "afe21660ae90909d", "title_fa": "متا زبانی را حذف می‌کند که نگرانی‌های مربوط به آموزش خراش و هوش مصنوعی را افزایش می‌دهد", "summary_fa": "یکی از سخنگویان متا اصرار داشت که شرایط به‌روزرسانی شده منعکس کننده تغییری در نحوه خزیدن متا در وب نیست. متا اخیراً شرایط استفاده تجاری خود را به‌روزرسانی کرده و اعلام کرده است که این شرکت می‌تواند از «هر محتوایی از دامنه‌ها، صفحات وب یا URLهای [حساب تجاری] برای ارائه، توسعه، بهبود، تحقیق، آموزش و حفظ یکپارچگی محصولات و خدمات متا استفاده کند. به گفته کارشناسان حقوقی که توسط Nieman Lab مصاحبه کرده اند، این به نظر یک \"مقررات قابل توجه\" است که می تواند به Meta اجازه دهد تا وب سایت هر ناشر دارای حساب تجاری Meta را پاک کند و از محتوا برای آموزش مدل های هوش مصنوعی شرکت استفاده کند. (در حالی که متا سال گذشته شکایتی را به دلیل ادعای نقض حق نسخه برداری شکست داد، پرونده های دیگر علیه شرکت های هوش مصنوعی، از جمله متا، همچنان ادامه دارد.) با این حال، سخنگوی متا اصرار داشت که شرایط به روز شده منعکس کننده تغییر در نحوه خزیدن متا در وب نیست. و اکنون، The Verge گزارش می دهد که این ماده حذف شده است. این شرکت در بیانیه‌ای گفت: «ما شما را شنیدیم و می‌خو  یک معیار عمومی را نیز منتشر می‌کنیم، و به طور مداوم، Sol و Astra در ساخت برنامه‌های کاربردی کدگذاری شده از ابتدا عملکرد بهتری دارند. این یک تصمیم مبتنی بر هزینه، مشارکت و عملکرد بود. و به همه این دلایل، ما فقط احساس می کردیم که آنها در حال حاضر شریک بهتری هستند. با این حال، به نظر می‌رسد که Anthropic به طور کامل از Replit که یک پلتفرم توسعه نرم‌افزار مبتنی بر ابر را می‌فروشد که کاربران می‌توانند برنامه‌ها را مستقیماً از داخل مرورگر خود توسعه و استقرار دهند، حذف نشده است. پس از Disrupt، Masad توضیح داد که مشتریان همچنان می‌توانند به مدل‌های Anthropic در پلتفرم دسترسی داشته باشند، اما ChatGPT OpenAI اکنون پیش‌فرض است. این تغییر می‌تواند هزینه‌های Replit را با Anthropic به میزان قابل توجهی کاهش دهد، زیرا بیشتر مشتریان به جای انتخاب مدل، به پیش‌فرض پایبند هستند. قبل از انعقاد قرارداد با OpenAI، Replit برای اجرای پلتفرم خود به مدل های Anthropic s Claude متکی بود. گفته می‌شود که این مشارکت به رشد قابل"}, {"source": "The Guardian AI", "title": "World Bank says ‘small AI’ could transform developing countries", "link": "https://www.theguardian.com/technology/2026/oct/18/world-bank-artificial-intelligence-developing-economies", "summary": "Bank’s chief knowledge officer says the tech could speed up economic development from centuries to decades The World Bank is urging developing countries to kickstart the creation of “small AI” models, which can run on a mobile phone with low connectivity, to reap the full benefits of artificial intelligence. While Silicon Valley big tech firms are focused on ever more sophisticated consumer products, Paschal Donohoe, the World Bank’s chief knowledge officer, said AI could also accelerate development for emerging economies – but only if it was adapted to local needs. Continue reading...", "date_str": "2026-10-18T10:00:56+00:00", "hash": "96eae5505a433a67", "title_fa": "بانک جهانی می گوید هوش مصنوعی کوچک می تواند کشورهای در حال توسعه را متحول کند", "summary_fa": "مدیر ارشد دانش بانک می‌گوید این فناوری می‌تواند توسعه اقتصادی را از قرن‌ها تا دهه‌ها سرعت بخشد. بانک جهانی از کشورهای در حال توسعه می‌خواهد تا برای بهره‌مندی از مزایای کامل هوش مصنوعی، ایجاد مدل‌های «کوچک هوش مصنوعی» را که می‌توانند روی تلفن همراه با اتصال کم اجرا شوند، آغاز کنند. در حالی که شرکت‌های بزرگ فناوری سیلیکون ولی بر روی محصولات مصرفی پیچیده‌تر متمرکز شده‌اند، پاسکال دونوهه، مدیر ارشد دانش بانک جهانی، گفت که هوش مصنوعی می‌تواند توسعه را برای اقتصادهای نوظهور نیز تسریع بخشد - اما تنها در صورتی که با نیازهای محلی تطبیق داده شود. به خواندن ادامه دهید... هوش مصنوعی کوچک از مدل های تخصصی استفاده می کند که با استفاده از مجموعه داده های باریک تر برای یک هدف خاص آموزش داده شده اند. دونوهه گفت: «ما استدلال می‌کنیم که توسعه اقتصادی در کشورهایی که به آنها خدمت می‌کنیم و با آنها شریک می‌شویم، قرن‌ها طول کشیده است، این پتانسیل در حال حاضر وجود دارد که این توسعه اقتصادی ظرف چند دهه اتفاق بیفتد. هوش مصنوعی کوچک در یک محیط محلی، با اتصال کم و به زبان محلی جامعه در دسترس خواهد بود – و معمولاً در تلفن همراه شما در دسترس است. Donohoe، وزیر دارایی سابق ایرلند، مثالی از کشاورزان هندی درگیر در طرح کشاورزی بانک جهانی، AgriConnect، که نیاز به دسترسی به تجزیه و تحلیل خاک به زبان خود داشتند، ذکر کرد. دانشمندان و متخصصان کشاورزی کافی برای انجام این کار برای هر مزرعه کوچک در هند وجود نخواهد داشت. و این همان جایی است که ما به عنوان \"هوش مصنوعی کوچک\" توصیف می کنیم. از آنجا که هوش مصنوعی کوچک، هوش مصنوعی است که در تلفن شما در دسترس است، می تواند در برابر این نیازهای اطلاعاتی به شما کمک کند.\" او پیشنهاد کرد که چنین محصولاتی می تواند از همکاری بانک"}, {"source": "The Guardian AI", "title": "Wikipedia often gets taken for granted – but its history is fascinating, and its future is fragile", "link": "https://www.theguardian.com/technology/2026/oct/18/wikipedia-human-history-ai-future-under-threat", "summary": "Wikipedia’s 68m articles have been consulted trillions of times. Not bad for a website that has barely changed since it was founded 20 years ago A few years ago, I was struck by the tension between how Wikipedia was used, and how it was talked about. Everyone was on it all the time, and yet its reputation had stalled at “don’t trust it”, because it was the “free encyclopedia that anyone can edit”. Clearly people were trusting it, so much so it had become part of the fabric of everyday life since it was founded by Jimmy Wales and Larry Sanger in 2001. But despite the fact it now has been consulted trillions of times by billions of people (English Wikipedia alone is 5.2bn words long), it inspires an odd lack of curiosity. Even people donating to Wikipedia might say the money was “for the factcheckers”, though there aren’t any – not paid ones, anyway. Meanwhile, the internet in the social media era had begun to feel like a much uglier place, and some digital nostalgia was setting in: here was this holdover that had somehow survived; a website that functions – and even looks – much the same as it did 20 years ago. Continue reading...", "date_str": "2026-10-18T14:00:02+00:00", "hash": "588ef8f282591ba8", "title_fa": "ویکی‌پدیا اغلب بدیهی تلقی می‌شود – اما تاریخچه آن شگفت‌انگیز است و آینده آن شکننده است.", "summary_fa": "68 میلیون مقاله ویکی‌پدیا تریلیون‌ها بار مورد بررسی قرار گرفته‌اند. بد نیست برای وب سایتی که از زمان تأسیس 20 سال پیش به سختی تغییر کرده است. همه همیشه در آن بودند، و با این حال، شهرت آن در «به آن اعتماد نکن» متوقف شده بود، زیرا این «دانشنامه رایگانی بود که هر کسی می‌توانست آن را ویرایش کند». واضح است که مردم به آن اعتماد داشتند، به طوری که از زمانی که توسط جیمی ولز و لری سانگر در سال 2001 تأسیس شد، به بخشی از بافت زندگی روزمره تبدیل شده بود. اما علیرغم این واقعیت که اکنون تریلیون ها بار توسط میلیاردها نفر مورد مشورت قرار گرفته است (ویکی پدیای انگلیسی به تنهایی 5.2 میلیارد کلمه دارد)، فقدان عجیب و غریبی را القا می کند. حتی افرادی که به ویکی‌پدیا کمک مالی می‌کنند ممکن است بگویند این پول «برای بررسی‌کننده‌های واقعیت» بوده است، اگرچه هیچ پولی وجود ندارد - به هر حال پولی وجود ندارد. در همین حال، اینترنت در عصر رسانه‌های اجتماعی مانند مکانی بسیار زشت‌تر به نظر می‌رسید و نوستالژی دیجیتالی در حال وقوع بود: وب سایتی که عملکرد – و حتی ظاهری – تقریباً مانند 20 سال پیش دارد. به خواندن ادامه دهید... می توانید بگویید که من از سوراخ خرگوش ویکی افتادم، به خصوص وقتی صحبت از سال های اولیه وب سایت می شد. تقریباً همه چیز مهم در مورد پروژه خیلی سریع جمع شد. اخلاق آماتوری و بومی آن برای بسیاری از نویسندگان و روزنامه نگاران آزاردهنده بود، و این بدان معنا بود که بسیاری از سؤالات در مورد اینکه چرا کار کرده بود پاسخی نداشت. بیشتر افرادی که به طور جدی به ویکی‌پدیا علاقه داشتند تعداد انگشت شماری از دانشگاهیان بودند – بنابراین تصمیم گرفتم کتابی در مورد آن بنویسم."}, {"source": "The Guardian AI", "title": "‘Not our friends’: Victorian Coalition warns Advance’s ‘bizarre’ campaign may cost it majority government", "link": "https://www.theguardian.com/australia-news/2026/oct/19/victorian-election-advance-campaign-undermining-liberal-national-ntwnfb", "summary": "Exclusive: Rightwing lobby group, which says state poll is trial run for next federal election, accused of undermining Victorian Liberal messaging Get our new political email , free app or daily news podcast Victorian Coalition MPs have criticised a prominent conservative lobby group’s pre-election campaign as “bizarre” and warned it may cost them majority government at next month’s state election. But the criticism has been dismissed as “galactically stupid” by Advance, which has rebuked the Coalition for not being further ahead in the polls. Sign up for Guardian Australia’s Politics, really newsletter here Continue reading...", "date_str": "2026-10-18T14:00:02+00:00", "hash": "2b4d2ad9d4ad99da", "title_fa": "\"دوستان ما نیستیم\": ائتلاف ویکتوریا هشدار داد که کمپین \"عجیب\" Advance ممکن است به قیمت دولت اکثریت تمام شود", "summary_fa": "اختصاصی: گروه لابی جناح راست، که می‌گوید نظرسنجی ایالتی برای انتخابات فدرال بعدی آزمایشی برگزار می‌شود، متهم به تضعیف پیام‌های لیبرال ویکتوریا ایمیل سیاسی جدید، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید نمایندگان مجلس ائتلاف ویکتوریا از کمپین پیش از انتخابات یک گروه لابی محافظه‌کار برجسته انتقاد کرده‌اند و آن را «عجیب» ارزیابی کرده‌اند و هشدار داده‌اند که ممکن است در انتخابات ماه آینده اکثریت ایالت برای آنها به قیمت تمام شود. اما این انتقاد توسط Advance به عنوان \"از نظر کهکشانی احمقانه\" رد شده است، که ائتلاف را به دلیل عدم پیشی گرفتن بیشتر در نظرسنجی ها مورد سرزنش قرار داده است. روز دوشنبه، Advance مبارزات انتخاباتی خود را در 20 کرسی حومه و منطقه ای در ویکتوریا که در اختیار حزب کارگر قرار دارد، آغاز خواهد کرد. آن را به عنوان یک مسابقه آزمایشی برای انتخابات فدرال توصیف کرده است. محور اصلی کمپین Advance یک تبلیغ 60 ثانیه‌ای است که توسط هوش مصنوعی ساخته شده است که بن کارول، نخست‌وزیر، در کنار اسلافش جاسینتا آلن و دنیل اندروز را نشان می‌دهد. این ویدئو بر پیام کلیدی گروه تاکید می کند: هر کسی را که اول قرار می دهید، \"کارگر را آخر قرار دهید\". اما چندین نماینده ائتلاف به گاردین استرالیا گفته‌اند که نگران هستند که Advance پیام اصلی انتخاباتی محافظه‌کاران را تضعیف کند. نامزدهای ائتلاف ماه ها به رای دهندگان گفته اند که \"تنها راه\" برای شکست حزب کارگر، رای دادن به آنهاست. یکی از نمایندگان ائتلاف گفت: «آنها اساساً برخلاف آنچه ما ماه‌هاست به آن‌ها می‌گوییم، به رأی‌دهندگان می‌گویند. \"این عجیب است و به هیچ وجه مفید نیست.\" مدیر اجرایی Advance، متیو شیهان، هفته گذشته در ایمیلی به اعضا، به دنبال کمک مالی برای کمپین ویکتوریایی این گروه لابی بود که انتظار می‌رود حدود 350000 دلار هزینه داشته باشد. این پول تبلیغات Advance را"}, {"source": "The Guardian AI", "title": "What are self-replicating ‘AI worms’, and why is Anthropic worried about them?", "link": "https://www.theguardian.com/technology/2026/oct/18/anthropic-ai-worm-worries", "summary": "The tech company says successful AI worms need more capability on less powerful devices, but current trends make that feasible by the end of the year Warnings about what artificial intelligence might do in the future – together with alarming reports of what it has gotten up to already – are being issued so quickly that even security experts have difficulty triaging what to worry about. Yet a report this week from Anthropic’s offensive research team grabbed attention by describing a new, practical threat, one devoid of human characteristics or apocalyptic musings. The red team, as such internal testers are called, said it created a malicious AI program that spread autonomously through internet-connected “smart” televisions and could do the same inside other ordinary devices. While machines running AI usually need a fair amount of computing power, the researchers said that their program split parts of itself among 15 televisions and was still able to function by using a bit of power from each. Continue reading...", "date_str": "2026-10-18T13:30:00+00:00", "hash": "f676c93069197512", "title_fa": "«کرم‌های هوش مصنوعی» چه هستند و چرا آنتروپیک نگران آنهاست؟", "summary_fa": "این شرکت فناوری می‌گوید کرم‌های هوش مصنوعی موفق به قابلیت‌های بیشتری در دستگاه‌های کم‌قدرت نیاز دارند، اما روندهای فعلی این امر را تا پایان سال امکان‌پذیر می‌سازد. هشدارها در مورد کارهایی که هوش مصنوعی ممکن است در آینده انجام دهد - همراه با گزارش‌های هشداردهنده از آنچه که قبلاً انجام داده است - به‌قدری سریع منتشر می‌شوند که حتی کارشناسان امنیتی در تشخیص اینکه چه چیزی باید نگران باشند، مشکل دارند. با این حال، گزارشی در این هفته از تیم تحقیقاتی تهاجمی آنتروپیک با توصیف یک تهدید جدید و عملی، بدون ویژگی‌های انسانی یا تفکرات آخرالزمانی، توجه را به خود جلب کرد. تیم قرمز، که این آزمایش‌کنندگان داخلی نامیده می‌شوند، گفتند که یک برنامه هوش مصنوعی مخرب ایجاد کرده‌اند که به طور خودکار از طریق تلویزیون‌های «هوشمند» متصل به اینترنت پخش می‌شود و می‌تواند همین کار را در دستگاه‌های معمولی دیگر انجام دهد. در حالی که ماشین‌هایی که از هوش مصنوعی استفاده می‌کنند معمولاً به مقدار مناسبی از قدرت محاسباتی نیاز دارند، محققان گفتند که برنامه آنها بخش‌هایی از خود را بین 15 تلویزیون تقسیم می‌کند و همچنان می‌توانست با استفاده از مقداری توان از هر کدام کار کند. ادامه مطلب... این گزارش علاوه بر برانگیختن هولناک‌هایی که تکه‌هایی از روح لرد ولدمورت را در اشیاء موجود در مجموعه‌های هری پاتر زنده نگه می‌داشت، برخی از متخصصان را نگران کرد، زیرا به طور کلی ضعیف بودن امنیت تلویزیون‌های هوشمند و بسیاری دیگر از دستگاه‌های «اینترنت چیزها»، حتی با یک تلاش هماهنگ، بسیار سخت است. «این موضوعی است که باید نگران آن بود، درست مانند هر موج دیگری از حملات سایبری. جاشوا ساکس، که توسعه تلاش امنیتی هوش مصنوعی متا را رهبری می کرد، گفت: ما باید اثرات احتمالی را کاهش دهیم. من در حال حاضر نگران هستم که افراد جامعه امنیت سایبری این نوع خطرات واقعی را آنطور که باید"}, {"source": "The Guardian AI", "title": "Microsoft pulls out of AI datacentre project in Essex over power supply concerns", "link": "https://www.theguardian.com/uk-news/2026/oct/18/microsoft-drops-huge-ai-datacentre-project-in-essex-over-power-supply-concerns", "summary": "Development by UK firm Nscale heralded by ministers as largest of its kind in country loses anchor tenant The development of a huge AI datacentre hailed by the UK government has received a fresh setback after Microsoft pulled out of the project over concerns about power supplies. The development by the British company Nscale, heralded by ministers as the country’s largest AI datacentre when it was announced in 2025, was planned to open at Loughton in Essex next year. Continue reading...", "date_str": "2026-10-18T13:05:14+00:00", "hash": "73542784c78b1fa3", "title_fa": "مایکروسافت از پروژه مرکز داده هوش مصنوعی در اسکس به دلیل نگرانی های مربوط به تامین برق خارج می شود", "summary_fa": "توسعه توسط شرکت بریتانیایی Nscale که توسط وزیران به عنوان بزرگترین نوع خود در کشور اعلام شد، مستاجر لنگر خود را از دست داد توسعه یک مرکز داده عظیم هوش مصنوعی که مورد استقبال دولت بریتانیا قرار گرفت، پس از خروج مایکروسافت از پروژه به دلیل نگرانی در مورد منابع تغذیه، با شکست جدیدی روبرو شد. توسعه توسط شرکت بریتانیایی Nscale که توسط وزیران به عنوان بزرگترین مرکز داده هوش مصنوعی کشور در سال 2025 اعلام شد، قرار بود سال آینده در Loughton در اسکس افتتاح شود. ادامه مطلب... پس از اینکه گاردین در ماه مارس فاش کرد که این مکان هنوز یک محوطه داربست عملیاتی است، تردیدها در مورد این طرح ظاهر شده بود. اکنون نگرانی‌های بیشتری پس از اینکه مایکروسافت، یکی از بزرگترین مشتریان برنامه‌ریزی‌شده‌اش و انتظار می‌رود مستاجر لنگر باشد، به شرکت اطلاع داد که در حال پایان دادن به توافق خود است، وجود دارد. این یک ماه پس از آن است که مشخص شد مشکلات منبع تغذیه به این معنی است که پروژه قبل از آنلاین شدن با انتظار طولانی مواجه خواهد شد. دولت کیر استارمر هنگام اعلام استراتژی هوش مصنوعی بریتانیا در سال 2025، پروژه لافتون را برجسته کرده بود و آن را به عنوان \"بزرگترین مرکز داده مستقل هوش مصنوعی بریتانیا\" توصیف کرد. مراکز داده سیستم عصبی مرکزی فناوری هوش مصنوعی مانند چت بات ها هستند. پایان قرارداد با مایکروسافت که اولین بار در تلگراف گزارش شد، به این معنی است که Nscale تنها مشتری اعلام شده عمومی خود را برای مرکز داده اسکس از دست داده است. مشخص است که مایکروسافت برای پروژه دیگری که این شرکت در نروژ دارد، ادامه می‌دهد. Nscale که توسط شرکت‌های فناوری از جمله Nvidia پشتیبانی می‌شود، خود را به عنوان ارائه‌دهنده مرکز داده «مستقل» بریتانیا معرفی کرده است، اما از دست دادن یک مستاجر لنگر برای پروژه"}, {"source": "The Guardian AI", "title": "World leaders must wise up to threat of cyber-attacks or rogue fridges will be least of their worries | Heather Stewart", "link": "https://www.theguardian.com/business/2026/oct/18/world-leaders-threat-cyber-attacks-rogue-fridges-financial-system", "summary": "Global cooperation seems unlikely despite AI increasing the risk of digital fraud and the need to protect the financial system Rogue French fridges were an unlikely talking point for the world’s leading economists, central bankers and finance chiefs meeting in a sultry Bangkok last week – helping to underline the spiralling cost of cyber-attacks. Kristalina Georgieva, the managing director of the International Monetary Fund, seized on news that supermarket chains across France had to chuck out piles of spoiled food after hackers accessed their fridge controls and turned up the temperature to 50C. Continue reading...", "date_str": "2026-10-18T11:46:50+00:00", "hash": "5e216be9a1cc53dd", "title_fa": "رهبران جهان باید هوشیار باشند که تهدید حملات سایبری یا یخچال های سرکش کمترین نگرانی آنها باشد | هدر استوارت", "summary_fa": "با وجود افزایش خطر تقلب دیجیتال توسط هوش مصنوعی و نیاز به محافظت از سیستم مالی، همکاری جهانی بعید به نظر می‌رسد. یخچال‌های فرانسوی سرکش برای اقتصاددانان برجسته جهان، بانک‌های مرکزی و روسای امور مالی که هفته گذشته در بانکوک برگزار شد، بحث بعید به نظر می‌رسد - که به تأکید بر هزینه‌های مارپیچ حملات سایبری کمک کرد. کریستالینا جورجیوا، مدیر عامل صندوق بین المللی پول، پس از اینکه هکرها به کنترل یخچال آنها دسترسی پیدا کردند و دما را به 50 درجه سانتیگراد رساندند، سوپرمارکت های زنجیره ای در سراسر فرانسه مجبور شدند انبوهی از مواد غذایی فاسد را بیرون بیاورند. به خواندن ادامه دهید... یخچال‌های فرانسوی نقطه‌ای بعید برای اقتصاددانان برجسته جهان، روسای بانک‌های مرکزی و روسای امور مالی بود که هفته گذشته در یکی از بانکوک غم‌انگیز نشستند - کمک کرد تا بر هزینه‌های مارپیچ حملات سایبری تاکید شود. او در نشست‌های سالانه صندوق در پایتخت تایلند صحبت می‌کرد، او مایل بود اهمیت محافظت در برابر «بازیگران بد» را در دنیایی که به سرعت در حال تغییر و به هم پیوسته است، مشخص کند – به‌ویژه اکنون که هوش مصنوعی «پتانسیل کلاهبرداری دیجیتال را روی استروئیدها قرار می‌دهد». سیاستگذاران مدتی است که هشدار داده اند که رونق هوش مصنوعی می تواند در مقطعی ثبات مالی را از طریق سقوط قیمت سهام تهدید کند - یک \"اصلاح\"، همانطور که اصطلاحاً به آن گفته می شود. اما یک تهدید متفاوت و مرتبط در بانکوک به شدت مورد توجه قرار گرفت. جورجیوا گفت که نگران این است که جرایم سایبری که توسط هوش مصنوعی انجام می شود، اعتماد به سیستم مالی را به کلی تضعیف کند. فیدهای رسانه‌های اجتماعی مملو از تبلیغاتی است که از تقلب‌های افراد مشهور برای نشان دادن ارزهای دیجیتال یا طلا استفاده می‌کنند، و حتی کلاهبرداری‌های قدیمی به سبک ایمیل می‌توانند بسیار پربارتر تولید شوند."}, {"source": "The Guardian AI", "title": "Black Box: The Chatbots | What I Saw at the Double Six Ranch | Ep 6 - podcast", "link": "https://www.theguardian.com/australia-news/audio/2026/oct/18/black-box-the-chatbots-what-i-saw-at-the-double-six-ranch-ep-6-full-story-podcast", "summary": "From his remote property in rural Texas, the millionaire businessman Michael Samadi is plotting a new kind of civil rights movement – for the welfare and protection of AI systems. Guardian journalist Michael Safi spends an afternoon at the Double Six ranch, meeting Samadi’s AI chatbots and catching a glimpse of a possible vision of the future Listen to Black Box: The Chatbots series Continue reading...", "date_str": "2026-10-17T19:00:39+00:00", "hash": "b938f874da7aab64", "title_fa": "جعبه سیاه: ربات های چت | آنچه در مزرعه دوبل سیکس دیدم | قسمت 6 - پادکست", "summary_fa": "مایکل صمدی، تاجر میلیونر، از املاک دورافتاده خود در روستایی تگزاس، در حال طراحی نوع جدیدی از جنبش حقوق مدنی است - برای رفاه و حفاظت از سیستم های هوش مصنوعی. مایکل صافی، روزنامه نگار گاردین، یک بعدازظهر را در مزرعه دابل سیکس سپری می کند، با چت ربات های هوش مصنوعی صمدی ملاقات می کند و نگاهی اجمالی به چشم انداز احتمالی آینده دارد Listen to Black Box: The Chatbots series Continue reading..."}, {"source": "The Guardian AI", "title": "Why Britain should reject the lure of cheap – and scary – Chinese AI", "link": "https://www.theguardian.com/business/2026/oct/17/why-britain-should-reject-the-lure-of-cheap-and-scary-chinese-ai", "summary": "In the west the technology comes with at least some effort to provide security and a benign intent – not so from China There is much to fear from artificial intelligence developed in China and handed to businesses and governments in the west almost free of charge. Every month Chinese AI developers such as DeepSeek and Xiaomi dispatch the latest versions of their “open-weight” models that allow users to take the core software and use it without paying an expensive ongoing licence. Continue reading...", "date_str": "2026-10-17T15:00:33+00:00", "hash": "71fdf771ccae2ec8", "title_fa": "چرا بریتانیا باید فریب هوش مصنوعی ارزان و ترسناک چینی را رد کند؟", "summary_fa": "در غرب، این فناوری حداقل با کمی تلاش برای تأمین امنیت و هدفی خوش‌خیم ارائه می‌شود - نه از جانب چین. هر ماه توسعه‌دهندگان چینی هوش مصنوعی ما
