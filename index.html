0", "hash": "a3ac876860fded58", "title_fa": "غول تست آزمایشگاهی Quest Diagnostics تأیید می کند که داده های شخصی و سلامتی بیماران در هنگام نقض به خطر افتاده است.", "summary_fa": "Quest جدیدترین شرکت از سری شرکت های فناوری مراقبت های بهداشتی است که در ماه های اخیر هک شده اند. غول تست آزمایشگاه پزشکی Quest Diagnostics یک حمله سایبری و نقض داده‌ها را تایید کرده است که بر مقدار هنوز نامشخصی از اطلاعات حساس بیمار که در سیستم‌هایش ذخیره شده است، بر اساس افشای قانونی مورد نیاز با تنظیم‌کننده‌های ایالات متحده، تأثیر می‌گذارد. Quest در بایگانی 8-K در ایالات متحده گفت. کمیسیون بورس و اوراق بهادار از حمله سایبری روز چهارشنبه مطلع شد که یکی از سیستم‌های آزمایش آزمایشگاهی خود به نام Quanum را هدف قرار داده است، که به دفاتر پزشک، بیمارستان‌ها و مراکز مراقبت‌های بهداشتی اجازه می‌دهد تا آزمایش‌های آزمایشگاهی را برای بیماران درخواست کنند و در عین حال صورت‌حساب‌ها را نیز مدیریت می‌کنند. این پلتفرم حجم زیادی از سوابق سلامت و پزشکی بیمار و همچنین داده های تشخیصی و صورتحساب مرتبط را ذخیره می کند. این شرکت گفت که دسترسی غیرمجاز شامل دسترسی به سوابق خاص بیمار است. کوئست گفت به مجریان قانون اطلاع داده و در حال بررسی است. حمله سایبری به کوئست آخرین حادثه سایبری بزرگی است که صنعت مراقبت های بهداشتی را در سال جاری تحت تاثیر قرار داده است. مجموعه‌ای از حملات سایبری و نقض داده‌ها باعث ایجاد اختلال در هفته‌ها شده و امکان سرقت میلیون‌ها پرونده الکترونیکی سلامت بیمار و سایر اطلاعات پزشکی را فراهم کرده است. شرکت‌های Healthtech به هدف اصلی مجرمان سایبری با انگیزه مالی تبدیل شده‌اند که قصد دارند تا حد امکان داده‌های حساس را به سرقت ببرند و تهدید به انتشار آن‌ها در صورت عدم پرداخت باج کنند. در ماه‌های اخیر، یک حمله سایبری منجر به پاک کردن انبوه دستگاه‌های کارمندان در Stryker سازنده فناوری پزشکی در ماه مارس شد و هک سازنده ایمپلنت‌های پزشکی بوستون ساینتیفیک در ماه آگوست، شبکه این شرکت را برای هفته‌ها آفلاین کرد", "image_url": "https://techcrunch.com/wp-content/uploads/2026/10/quest-862530304.jpg?resize=1200,743", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "بورس و طلا"], "datetime_fa": "۱ آبان • ۱۸:۳۰"}],
      media: [{"source": "Billboard", "title": "No. 1 ‘Again’! Ella Langley Makes More History on Country Airplay Chart", "link": "https://www.billboard.com/music/chart-beat/ella-langley-loving-life-again-number-1-country-airplay-chart-1236367306/", "summary": "Ella Langley earns her sixth No. 1 on Billboard ’s Country Airplay chart as “Loving Life Again” rises a spot on the Oct. 31-dated list, delivering 32.4 million audience impressions Oct. 16-22 (up 7%), according to Luminate. Related What Are Our Predictions for the Rest of the Year on the Billboard Hot 100? Ella Langley s Choosin Texas Is No. 1 on Billboard s Songs of the Summer Chart for 2026 — a Historic One for Country Music 10 Billboard Chart Records Ella Langley Has Broken or Set Among women, or acts with a woman vocalist, Langley has gone from one No. 1 to six the fastest in the chart’s 36-year history. She logged 99 weeks from her first trip to the top, with “You Look Like You Love Me” with Riley Green in December 2024, to her latest. The previous fastest was Lady A (125 weeks); the quickest solo woman, Carrie Underwood, did so more than 127. Among all acts, only Jelly Roll (96) and Alan Jackson (94) have raced to six more quickly than Langley. The march up Country Airplay for “Loving Life Again” adds another chapter. Upon reaching No. 1, Langley’s Dandelion generates a fourth leader, joining “Choosin’ Texas,” “Be Her” and the Morgan Wallen duet “I Can’t Love You Anymore,” making it just the second album by a woman, or an act with a woman vocalist, to send four titles to the summit. The only other, Shania Twain’s The Woman in Me , was alone in that elite club for three decades. Langley moves ahead of the three-apiece hauls from Underwood’s Some Hearts , Carnival Ride and Play On , Twain’s Come On Over and sets by Lady A, Sugarland, The Chicks, Jo Dee Messina, Deana Carter, Kelsea Ballerini and Wynonna. Langley cowrote “Loving Life Again” with ERNEST and Devin Dawson after taking two weeks away from touring in 2025 to reconnect with family and regain her footing amid a whirlwind of career success. Its title grew out of her response when ERNEST asked how she was feeling. Dandelion has spent 21 weeks atop Top Country Albums since its April debut, the most among women since the chart adopted a multimetric methodology nearly a decade ago on the Feb. 11, 2017, survey. It ranks sixth overall in that span, with Wallen’s Dangerous: The Double Album boasting an all-time record 97 weeks at No. 1.", "date_str": "2026-10-23T18:52:18+00:00", "hash": "b90b781cd9432988", "title_fa": "شماره 1 \"دوباره\"! الا لنگلی در چارت پخش کانتری تاریخ بیشتری می سازد", "summary_fa": "طبق گزارش Luminate، الا لنگلی ششمین شماره 1 خود را در جدول پخش کانتری بیلبورد به دست آورد، زیرا «دوباره عاشق زندگی» در لیست تاریخ 31 اکتبر قرار گرفت و 32.4 میلیون مخاطب را در 16 تا 22 اکتبر (7 درصد افزایش) نشان داد. مرتبط پیش‌بینی‌های ما برای بقیه سال در Billboard Hot 100 چیست؟ الا لنگلی چوسین تگزاس شماره است. 1 در جدول آهنگ های تابستانی بیلبورد برای سال 2026 — یکی تاریخی برای موسیقی کانتری 10 رکورد بیلبورد در جدول بیلبوردها شکسته شده یا تنظیم شده است در میان زنان، یا با یک خواننده زن همکاری می کند، لنگلی از رتبه یک به شش سریع ترین در تاریخ 36 ساله جدول رسیده است. او 99 هفته از اولین سفرش به قله، با «تو به نظر می‌رسی که دوستم داری» با رایلی گرین در دسامبر 2024 تا آخرین سفرش ثبت نام کرد. سریعترین قبلی بانوی A (125 هفته) بود. سریعترین زن انفرادی، کری آندروود، این کار را بیش از 127 انجام داد. در میان تمام بازیگران، تنها جلی رول (96) و آلن جکسون (94) سریعتر از لنگلی به شش نفر رسیده اند. راهپیمایی کانتری پخش برای «دوباره عشق به زندگی» فصل دیگری را اضافه می کند. با رسیدن به شماره 1، Langley’s Dandelion رهبر چهارمی را ایجاد می کند و به «Choosin’ Texas»، «Be Her» و «I Can’t Love You Anymore» به دوئت مورگان والن می پیوندد، و آن را به دومین آلبوم یک زن یا اجرای یک خواننده زن برای ارسال چهار عنوان به اجلاس تبدیل می کند. تنها دیگری، «زن در من» اثر شانیا تواین، به مدت سه دهه در آن باشگاه نخبه تنها بود. لنگلی جلوتر از بازی های سه نفره از Underwood’s Some Hearts، Carnival Ride و Play On، Twain’s Come On Over و مجموعه های Lady A، Sugarland، The Chicks، Jo Dee Messina، Deana", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/ella-langley-october21-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۲:۲۲"}, {"source": "Billboard", "title": "Stevie Wonder Sues to Evict Rent-Free Tenant from Hollywood House After Nearly 40 Years", "link": "https://www.billboard.com/pro/stevie-wonder-lawsuit-evict-woman-hollywood-house/", "summary": "Stevie Wonder is taking legal action to evict a woman who’s lived rent-free in his Los Angeles house since 1988. The legendary singer (real name Stevland Morris) sued Carmen Efferson on Thursday (Oct. 22) to demand she move out of a three-bedroom house he owns in the ritzy Hollywood Hills neighborhood. The court papers, obtained by Billboard , say Efferson has lived for free in the home for 38 years under an oral agreement. Related As Stevie Wonder s Songs In the Key of Life Turns 50, Musicians Reflect on Its Impact: An Actual Gift to Humanity Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Weezer to Receive Legend of Live Award at 2026 Billboard Live Music Summit Not much is known about Efferson, though it appears she was linked to Wonder around the time she moved into the house: Archival Billboard coverage credited her as a producer of the music video for his Michael Jackson collaboration “Get It” in 1988, and a tabloid report from the same year claimed they were engaged. The two never married. According to Thursday’s lawsuit, Wonder’s representatives tried to enter the Hollywood house three times in July to inspect it for a property insurance renewal. But Efferson refused to let them in and told Wonder’s attorney to “f k the f k off” in an email.” “Please refrain from your racist coldblooded ‘white male privilege’ tone,” wrote Efferson in the July email to lawyer David Huff . “I am feeling harassed. Regarding your ORDERS of entering into the place where I am living, I do not consent. Do not make any attempt to make any kind of contact with me.” In response, Wonder’s lawyers served Efferson with multiple legal notices warning that they would seek her eviction if she did not let in the insurance inspectors. “The choice is yours,” wrote Huff. She did not comply, leading the attorney to file Thursday’s eviction lawsuit. In technical terms, Wonder is suing Efferson for unlawful detainer. The singer wants a judge to order her removed from the Hollywood house, and he says Efferson should pay damages of $600 because her behavior led the home’s property insurance to lapse. Efferson did not immediately return a request for comment on Friday (Oct. 23).", "date_str": "2026-10-23T18:49:39+00:00", "hash": "a81bb2f60b469541", "title_fa": "شکایت استیوی واندر برای اخراج مستاجر بدون اجاره از خانه هالیوود پس از نزدیک به 40 سال", "summary_fa": "استیوی واندر برای اخراج زنی که از سال 1988 بدون اجاره در خانه اش در لس آنجلس زندگی می کند، اقدام قانونی می کند. خواننده افسانه ای (با نام واقعی استولند موریس) روز پنجشنبه (22 اکتبر) از کارمن افرسون شکایت کرد تا از او بخواهد از خانه سه خوابه ای که او در محله شیک هالیوود هیلز دارد، نقل مکان کند. اسناد دادگاه که توسط بیلبورد به دست آمده است، می گوید که افرسون به مدت 38 سال تحت یک توافق شفاهی به صورت رایگان در خانه زندگی کرده است. مرتبط با 50 سالگی آهنگ‌های استیوی واندر در کلید زندگی، نوازندگان درباره تأثیر آن فکر می‌کنند: هدیه واقعی به بشریت دیدی از زندان نیوجرسی به مرکز مشابهی در پنسیلوانیا ویزر برای دریافت جایزه Legend of Live در سال 2026 نقل مکان کرد، هر چند به نظر می‌رسید که بیلبورد Live S چندان شناخته شده نیست. در مورد زمانی که او به خانه نقل مکان کرد شگفت زده شد: پوشش آرشیو بیلبورد او را به عنوان تهیه کننده موزیک ویدیوی همکاری مایکل جکسون \"Get It\" در سال 1988 معرفی کرد، و یک گزارش روزنامه از همان سال ادعا کرد که آنها نامزد کرده اند. این دو هرگز ازدواج نکردند. طبق دادخواست روز پنجشنبه، نمایندگان Wonder در ماه جولای سه بار سعی کردند وارد خانه هالیوود شوند تا آن را برای تمدید بیمه اموال بررسی کنند. اما اففرسون از اجازه ورود آنها امتناع کرد و به وکیل واندر گفت که در یک ایمیل \"f k the f k off\" را انجام دهد. افرسون در ایمیل ژوئیه به وکیل دیوید هاف نوشت: «لطفا از لحن نژادپرستانه «امتیاز مردان سفید» خودداری کنید. \"من احساس آزار و اذیت می کنم. با توجه به دستورات شما مبنی بر ورود به محلی که من در آن زندگی می کنم، رضایت ندارم. هیچ تلاشی برای برقراری ارتباط با", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P105OVQR-e1792780436888.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "موسیقی"], "datetime_fa": "۱ آبان • ۲۲:۱۹"}, {"source": "Billboard", "title": "Slayyyter Reveals She Has Laryngitis & Vocal Cord Tears, Cancels U.K. & Europe Tour: ‘I Will Make This Up to You’", "link": "https://www.billboard.com/music/pop/slayyyter-cancels-2026-tour-dates-laryngitis-vocal-cord-tears-1236367295/", "summary": "After canceling a pair of shows due to health issues earlier in the week, Slayyyter has pulled the plug on the rest of her U.K. and European tour dates. Related More WOR$T Is on the Way: Slayyyter s WOR$T MAN IN AMERICA Album Is Coming Slayyyter Slaughters Final North American Show of Scintillating Wor$t Girl in the World Tour in NYC: 5 Best Moments Slayyyter Reacts to Lady Gaga Using Her Song in a New TikTok She s Feeling the Love The Missouri native announced the cancellations on Friday (Oct. 23), citing laryngitis and vocal cord tears. Hey guys. i am heartbroken to share after multiple doctor visits i have laryngitis and vocal cord tears and have been ordered to go on medication and full vocal rest for at least two weeks, she wrote on her Instagram Story. Because of this, i am forced to cancel the remaining UK/EU dates to avoid permanent damage to my voice. full refunds will be available at point of sale. Slayyyter continued: My team and i are already working on rebooking shows for next year and i hope to have news to share very soon to make it up to you. I know how much time and effort is spent to come out to a show. some of you have traveled, some of you have made costumes, and i am completely devastated to not be able to give you the shows you were planning for. The pop star is promising to make it up to the European fans with shows at a later date. We are working hard to figure out a time to return so i can deliver an even bigger and better show for you all, she added. I hope you know i will make this up to you. lots of love to you all. thank you for making this tour so special. As reported by People , Slayyyter previously revealed that she completely lost her voice and doctors ordered her to cancel shows in Copenhagen (Oct. 22) and Hamburg, Germany (Oct. 23). The tour was slated to resume on Saturday (Oct. 24) in Warsaw, Poland, and run through Nov. 5. Slayyyter s last performance came on Oct. 18 in Paris. The Beat Up Chanel$ singer has no remaining performances after wiping the rest of her 2026 slate clean, and will return to the stage in February with a handful of Australia and New Zealand shows before heading to South America in March. Slayyyter will also headline her first arena show in the Big Apple on June 21 at Madison Square Garden. While she won t be performing, Slayyyter has new music on the way. The pop provocateur s Wor$t Man in America is slated to arrive on Dec. 4, and serves as a nine-track brother album to Wor$t Girl in America , wh", "date_str": "2026-10-23T18:39:21+00:00", "hash": "de4775abdf66450b", "title_fa": "اسلایتر فاش می‌کند که مبتلا به التهاب حنجره و پارگی‌های تار صوتی است، تور بریتانیا و اروپا را لغو می‌کند: «این را به شما خواهم داد»", "summary_fa": "پس از لغو یک جفت برنامه به دلیل مشکلات سلامتی در اوایل هفته، اسلایتر از بقیه تاریخ های تور بریتانیا و اروپا خودداری کرد. موارد مرتبط WOR$T در راه است: آلبوم WOR$T Slayyyter s WOR$T MAN IN AMERICA در راه است Slayyyter Slaughters آخرین نمایش در آمریکای شمالی از Scintillating Wor$t Girl in the World Tour در نیویورک: 5 بهترین لحظه واکنش اسلایتر به لیدی گاگا با استفاده از آهنگ جدید میسوری با استفاده از آهنگ TikeTok Love. در روز جمعه (اکتبر 23)، با اشاره به التهاب حنجره و پارگی تارهای صوتی. هی بچه ها او در استوری اینستاگرام خود نوشت: من قلبم شکسته است که بعد از چندین بار مراجعه به پزشک، من دچار التهاب حنجره و پارگی تارهای صوتی هستم و به من دستور داده شده که حداقل دو هفته دارو و استراحت کامل صوتی داشته باشم. به همین دلیل، من مجبور هستم تاریخ های باقیمانده بریتانیا / اتحادیه اروپا را لغو کنم تا از آسیب دائمی به صدای خود جلوگیری کنم. بازپرداخت کامل در محل فروش در دسترس خواهد بود. اسلایتر ادامه داد: من و تیمم در حال حاضر روی رزرو مجدد نمایش ها برای سال آینده کار می کنیم و امیدوارم به زودی اخباری برای به اشتراک گذاشتن داشته باشم تا آن را جبران کنم. من می دانم که چقدر زمان و تلاش صرف می شود تا در یک نمایش ظاهر شوم. برخی از شما سفر کرده‌اید، برخی از شما لباس‌هایی ساخته‌اید، و من از اینکه نمی‌توانم نمایش‌هایی را که برایشان برنامه‌ریزی می‌کردید به شما ارائه دهم کاملاً متاثر شدم. این ستاره پاپ قول داده است که بعداً با نمایش هایی به طرفداران اروپایی آن را جبران کند. او افزود: ما سخت کار می کنیم تا زمانی را برای بازگشت تعیین کنیم تا بتوانم نمایش بزرگتر و بهتری را برای همه شما ارائه دهم. امیدوارم بدونی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2287486326-e1792775479164.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "موسیقی"], "datetime_fa": "۱ آبان • ۲۲:۰۹"}, {"source": "Billboard", "title": "Billy Corgan Explains Why Olivia Rodrigo Is Your Favorite Rock Star’s Favorite Pop Star: ‘She’s Not Afraid’", "link": "https://www.billboard.com/music/music-news/billy-corgan-fan-olivia-rodrigo-what-he-likes-her-music-1236367252/", "summary": "Olivia Rodrigo is a favorite of many rock stars, and in a new interview, Billy Corgan broke down why he — much like Sheryl Crow, Robert Smith, Jack White, Mick Jagger, Alanis Morissette, Stevie Nicks and more icons — is in her corner. Related Olivia Rodrigo Chappell Roan Exceed Expectations on New Remix: Watch the David Byrne-Starring Video Billy Corgan on Why He s Stood By Marilyn Manson: I Don t Want the World to Tell Me Who My Friends Are Olivia Rodrigo Says Shame on Cornell Amid Fraternity Rape Lawsuit: I Stand With Jane Doe The topic of the Gen Z star first came up on the Thursday (Oct. 22) episode of The New York Times Popcast when hosts Jon Caramanica and Joe Coscarelli asked Corgan why he s recently been championing younger artists such as YUNGBLUD and sombr. Rodrigo is an especially interesting case, they argued, because her songs — namely The Cure and Pretty Isn t Pretty, which share a resemblance to Disarm and 1979, respectively — have drawn comparisons to The Smashing Pumpkins catalog. But the Chicago band s frontman implied that he finds the similarities flattering rather than objectionable. She s so smart, Corgan raved of Rodrigo, whom he joined on stage for a duet of 33 at Lollapalooza this summer. She s super savvy. I don t know her much, but she s figured out that the way to break free is to be free, he continued. She s like, Bring me all these influences. She s not afraid. She s not afraid to make an imperfect song. She s not afraid to have one vocal slightly out of tune Pop stars should be as authentic in their game as rock stars are authentic in their game. Corgan also agreed that it s been freeing connecting with younger artists, because they weren t around when The Smashing Pumpkins received poor reviews on albums that are now heralded as classics, meaning their opinions of him are shaped purely by music. He s hardly the first rock star to sing Rodrigo s praises. Crow has lauded her multiple times, calling her the real deal on The Tonight Show in 2023, and Jagger told Billboard in the Rolling Stones cover story earlier this year, She’s really good at [rock music] the ability to change styles from what you think [her] original girly pop stuff is — it’s kind of interesting. Morrissette and Nicks joined Rodrigo at her inaugural Daisy Chain Fields festival, and White has kept in contact with the former Disney star since they met — and he called her very cool, very real — in 2022. Smith partnered up with Rodrigo for a rare collaboration on", "date_str": "2026-10-23T18:22:34+00:00", "hash": "e12e25d0b65d2433", "title_fa": "بیلی کورگان توضیح می‌دهد که چرا اولیویا رودریگو، ستاره موسیقی مورد علاقه‌تان راک استار پاپ است: «او نمی‌ترسه»", "summary_fa": "اولیویا رودریگو مورد علاقه بسیاری از ستارگان راک است، و بیلی کورگان در یک مصاحبه جدید توضیح داد که چرا او - بسیار شبیه شریل کرو، رابرت اسمیت، جک وایت، میک جگر، آلانیس موریست، استیوی نیکس و نمادهای دیگر - در گوشه اوست. مرتبط Olivia Rodrigo Chappell Roan در ریمیکس جدید از انتظارات فراتر رفت: ویدیوی با بازی دیوید برن را تماشا کنید بیلی کورگان در مورد چرا او در کنار مرلین منسون ایستاده است: من نمی خواهم دنیا به من بگوید دوستانم چه کسانی هستند اولیویا رودریگو می گوید شرم به کرنل است. پنجشنبه (اکتبر 22) قسمت پاپکست نیویورک تایمز که مجریان برنامه جان کارامانیکا و جو کوسکارلی از کورگان پرسیدند که چرا اخیراً از هنرمندان جوان‌تری مانند YUNGBLUD و sombr حمایت می‌کند. آنها استدلال کردند رودریگو مورد بسیار جالبی است، زیرا آهنگ های او - یعنی The Cure و Pretty Isn t Pretty که به ترتیب شباهت هایی با Disarm و 1979 دارند - با کاتالوگ The Smashing Pumpkins مقایسه شده است. اما رهبر گروه شیکاگو به طور ضمنی گفت که شباهت ها را به جای اینکه قابل اعتراض است، تملق آمیز می داند. او بسیار باهوش است، کورگان از رودریگو، که در تابستان امسال برای یک دوئت 33 نفره در لولاپالوزا به روی صحنه رفت، به شدت تشویق شد. او فوق العاده باهوش است او ادامه داد: من او را زیاد نمی شناسم، اما او فهمیده است که راه رهایی آزاد بودن است. او می گوید، همه این تأثیرات را برای من بیاور. او نمی ترسد. او از ساختن یک آهنگ ناقص نمی ترسد. او از داشتن یک آواز کمی ناهنجار ترسی ندارد. کورگان همچنین موافقت کرد که ارتباط با هنرمندان جوان‌تر را آزاد می‌کند، زیرا زمانی که The Smashing Pumpkins نقدهای ضعیفی در مورد آلبوم‌هایی دریافت کرد که اکنون به عنوان کلاسیک معرفی می‌شوند، آن‌ها نبودند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/P107F1H0.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۱:۵۲"}, {"source": "Billboard", "title": "AARP Celebrated the Power of Music, Reinvention and Legacy at Billboard Latin Music Week 2026", "link": "https://www.billboard.com/music/latin/aarp-celebrated-power-of-music-legacy-billboard-latin-week-1236367323/", "summary": "AARP took center stage at Billboard Latin Music Week 2026 as an official partner of one of Latin music’s most influential industry gatherings, celebrating the artists, executives and cultural voices shaping the genre across generations. Latin music is a powerful example of how artists continue to evolve, inspire new audiences and build lasting connections across generations. Richard Bull, George Prajin, Mac Clark and Rudy López Negrete and team at 2026 Billboard Latin Power Players held at Faena Theater on October 19, 2026 in Miami Beach, Florida. Jose Chepe Devillegas Through its partnership with Billboard Latin Music Week, AARP celebrated the pioneers who helped shape Latin music alongside the emerging voices carrying those traditions into the future. One of the highlights of AARP’s programming was “Salsa Revival: Bridging Generations presented by AARP,” a panel featuring legendary salsa artist Tito Nieves and contemporary salsa star Luis Figueroa. The conversation brought together two artists whose careers represent different eras of salsa, united by a shared commitment to keeping the genre alive and moving forward. AARP also presented Tito Nieves with the Latin Music Legacy Award at Billboard Latin Power Players, recognizing his lasting impact on the genre and his contributions to Latin music. Luis Figueroa and Tito Nieves speak onstage at the Salsa Revival: Bridging Generations panel during Billboard Latin Music Week 2026 held at Faena Forum on October 19, 2026 in Miami Beach, Florida. Jose Chepe Devillegas “It s a fantastic year for music, more than ever,” Billboard’s co-chief content officer Leila Cobo said during the ceremony. Citing Luminate data, she noted that one in every 10 streams is now in Spanish… double the share recorded six years ago. “We are so proud to honor [the Latin Power Players] tonight.” AARP’s presence at Billboard Latin Music Week 2026 reflected a vision of aging centered on possibility, participation and continued growth. As a nonprofit dedicated to empowering people to choose how they live as they age, AARP highlighted the importance of lifelong creativity, cultural engagement and connections between generations. Latin music brought that message to life. From honoring industry pioneers with the Latin Music Legacy Award to bringing Tito Nieves and Luis Figueroa together to discuss the evolution of salsa, AARP was part of the conversations where culture, community and generations connect. Tito Nieves at 2026 Billboard Latin Pow", "date_str": "2026-10-23T18:16:09+00:00", "hash": "f6e438e36054ccf2", "title_fa": "AARP قدرت موسیقی، اختراع مجدد و میراث را در هفته موسیقی لاتین بیلبورد 2026 جشن گرفت", "summary_fa": "AARP در هفته موسیقی لاتین بیلبورد 2026 به عنوان شریک رسمی یکی از تأثیرگذارترین گردهمایی‌های صنعت موسیقی لاتین در مرکز صحنه قرار گرفت و از هنرمندان، مدیران و صداهای فرهنگی که این ژانر را در طول نسل‌ها شکل می‌دهند تجلیل کرد. موسیقی لاتین نمونه قدرتمندی از چگونگی ادامه تکامل هنرمندان، الهام بخشیدن به مخاطبان جدید و ایجاد ارتباطات پایدار در بین نسل‌ها است. ریچارد بول، جورج پراجین، مک کلارک و رودی لوپز نگرته و تیم در 2026 Billboard Latin Power Players که در تئاتر Faena در 19 اکتبر 2026 در میامی بیچ، فلوریدا برگزار شد. Jose Chepe Devillegas از طریق مشارکت خود با هفته موسیقی لاتین بیلبورد، AARP از پیشگامانی که به شکل گیری موسیقی لاتین در کنار صداهای نوظهور که این سنت ها را به آینده منتقل می کردند، تجلیل کرد. یکی از نکات برجسته برنامه‌نویسی AARP، «Revival Salsa: Bridging Generations ارائه‌شده توسط AARP» بود، پانلی با حضور هنرمند افسانه‌ای سالسا، تیتو نیوز و ستاره معاصر سالسا، لوئیس فیگوئروآ. این گفتگو دو هنرمند را گرد هم آورد که حرفه‌شان دوره‌های مختلف سالسا را ​​نشان می‌دهد، که با تعهد مشترک برای زنده نگه داشتن این ژانر و حرکت رو به جلو متحد شده‌اند. AARP همچنین جایزه میراث موسیقی لاتین را در Billboard Latin Power Players به ​​تیتو نیوز اهدا کرد و تأثیر ماندگار او را بر این ژانر و مشارکت او در موسیقی لاتین به رسمیت شناخت. لوئیس فیگوروآ و تیتو نیوز روی صحنه در پنل سالسا Revival: Bridging Generations در هفته موسیقی لاتین بیلبورد 2026 که در انجمن Faena در 19 اکتبر 2026 در ساحل میامی، فلوریدا برگزار شد، صحبت می‌کنند. Jose Chepe Devillegas، لیلا کوبو، مدیر ارشد محتوای بیلبورد در این مراسم گفت: «این یک سال فوق‌العاده برای موسیقی است، بیش از هر زمان دیگری». او با استناد به داده‌های Luminate اشاره کرد که از هر 10 استریم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/OSE6566-1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۱:۴۶"}, {"source": "Billboard", "title": "From LISA to Miley Cyrus, John Mayer & More, Which New Music Release Is Your Favorite This Week? Vote!", "link": "https://www.billboard.com/music/music-news/blackpink-lisa-miley-cyrus-john-mayer-best-new-music-poll-1236367274/", "summary": "This New Music Friday is a battle royale between artists across genres for the final spots on your Halloween party playlists. Related LISA, Miley, Kacey Musgraves John Mayer: New Music Friday Guide LISA’s Press Play : All 6 Tracks Ranked How New Music From Miley, Megan Moroney, Bella Kay More Landed on the ‘Nobody Wants This’ Season Three Soundtrack: It Was a Win-Win for All LISA of BLACKPINK leads this week s roundup with her sizzling Press Play EP, which features her Billboard Hot 100 hit SaWaDiKa (No. 69) and the newly released Tarantino. Landing right on time for the Thai singer s upcoming Las Vegas residency taking place Nov. 12-29, the bilingual, six-track set also features an interpolation of Missy Elliott and Timbaland’s 2003 song “Bomb Intro/Pass That Dutch on standout track Cobra. Two major albums lead this week s new R B and hip-hop releases: John Legend s Muse and Yung Miami s Watch Dis , respectively. The former marks the EGOT winner s first album-length collaboration with Pharrell Williams, who was inspired to lock in with Legend for an LP after linking with him for The Birds Don t Sing off Clipse s Grammy-winning Let God Sort Em Out in 2025. The latter is the long-awaited debut solo studio album from Yung Miami, who scored the biggest hit of her career this year with Spend Dat, nearly a decade after she first burst onto the scene as one-half of City Girls. Kacey Musgraves also previewed her forthcoming Middle of Nowhere Vol. 2: Tex Mex Tapes , a 16-track expansion of this year s acclaimed Middle of Nowhere , with the breezy, brassy Weekend In Texas. British DJ Sammy Virji surprise-dropped his sophomore studio album, Open Late , which he conceived almost entirely on the road between shows. This New Music Friday also features new albums from Claud ( Me and the Music ), Anderson .Paak and Cordae ( Heavy Is the Crown ), Halle ( Love? Or Something Like It Deluxe ), Brakence ( Marrow ), Toosii ( Platinum Heart 2 ), Yeat ( Luh Leakyz Vol. 1 ), Samara Joy ( Live at the Blue Note L.A. ), Che Noir ( It Takes A Village ), Laila! ( We’ll Never Be This Young Again ), My Chemical Romance ( The Black Parade 20th Anniversary Deluxe Edition ), girl in red ( Blue EP), Josiah Queen ( Damascus Road ), Lennon Stella ( Sleeping Lion ), Michael Kiwanuka ( Fudge ), Laundry Day ( 4 4 ), Hilary Duff ( Holiday Things EP), Brothers Osborne ( Watertown ) and MC Eiht ( The Story of My Life ). Over on the singles side, Miley Cyrus leads the way with Cold Blood, a mid-2010", "date_str": "2026-10-23T18:14:30+00:00", "hash": "5e6c17df7102b3b9", "title_fa": "از LISA تا مایلی سایرس، جان مایر و بیشتر، کدام نسخه جدید موسیقی مورد علاقه شما در این هفته است؟ رای بده", "summary_fa": "این جمعه موسیقی جدید یک نبرد رویال بین هنرمندان در ژانرهای مختلف برای آخرین نقاط در لیست پخش مهمانی هالووین شما است. مرتبط LISA، مایلی، کیسی ماسگریوز John Mayer: New Music Guide پخش مطبوعاتی LISA: همه 6 آهنگ رتبه بندی شده است که چگونه موسیقی جدید از مایلی، مگان مورونی، بلا کی بیشتر وارد موسیقی متن فصل سوم «Nobody Wants This» شد: این یک برد-برد برای همه پخش های LINKPI از هر هفته بود. که شامل بیلبورد Hot 100 SaWaDiKa (شماره 69) و تارانتینو تازه منتشر شده است. این مجموعه دو زبانه و شش آهنگی که درست به موقع برای اقامت آتی خواننده تایلندی در لاس وگاس که از 12 تا 29 نوامبر برگزار می‌شود، شامل ترانه 2003 میسی الیوت و تیمبالند با نام «Bomb Intro/Pass That Dutch در آهنگ برجسته Cobra» است. دو آلبوم اصلی منتشر شده است: آلبوم‌های جدید و هیپ‌های جدید John Yu. Miami s Watch Dis، به ترتیب. اولین همکاری در طول آلبوم برنده EGOT با فارل ویلیامز است، که پس از ارتباط با او برای آلبوم The Birds Don t Sing off Clipse در سال 2025، اجازه دهید خدا آنها را مرتب کند، الهام گرفته شد تا با Legend برای آلبوم LP همکاری کند. یک سال با Spend Dat، تقریباً یک دهه پس از آن که او برای اولین بار به عنوان نیمی از City Girls وارد صحنه شد. کیسی ماسگریوز همچنین پیش نمایشی از فیلم آینده خود یعنی Middle of Nowhere Vol. 2: Tex Mex Tapes، یک بسط 16 آهنگی از تحسین شده امسال Middle of Nowhere، با آخر هفته بادی و برنجی در تگزاس. دی جی بریتانیایی سامی ویرجی آلبوم دوم استودیویی خود را با نام \"Open Late\" که تقریباً به طور کامل در مسیر بین برنامه ها طراحی شده بود، منتشر کرد. این جمعه موزیک جدید همچنین دارای آلبوم‌های جدیدی از کلود", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/lisa-press-play-cover-cr-Yeyoung-choi-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۲۱:۴۴"}, {"source": "Billboard", "title": "Will We Get Our First Seasonal Halloween No. 1 of the Century This Year? ‘Thriller,’ ‘Dracula’ & The Spookiest Hot 100 Race Ever", "link": "https://www.billboard.com/music/chart-beat/halloween-number-one-thriller-dracula-michael-jackson-1236367320/", "summary": "November is only a little over a week away, which means Mariah Carey is probably getting antsy for her annual emergence from her warm-weather cocoon to declare the start of the pop music holiday season. But this year, she may have to wait a little longer than normal to make it official: We’ve got another seasonal chart race to get through first in 2026. Halloween has proven regularly impactful on the Billboard Hot 100 for nearly a decade now, ever since Michael Jackson’s horror-pop perennial “Thriller” first reentered the chart dated Nov. 10, 2018, at No. 31. It has since been joined by such other spooky season classics as Bobby “Boris” Pickett and the Crypt-Kickers’ “Monster Mash” and Ray Parker, Jr.’s “Ghostbusters” as annual haunters of the listing, with The Citizens of Halloween’s “This Is Halloween” and Rockwell’s “Somebody Watching Me” also crashing the chart the past two years. However, none of those songs have ever seriously threatened the chart’s top spot upon their yearly revisits. Two of them topped the chart upon their original runs — ”Monster Mash” in 1962 and “Ghostbusters” in 1984, the former even doing so for two weeks at the end of October — and in 2025, “Thriller” became the first of the seasonal staples to return to the top 10, reaching No. 10 last November (after originally peaking at No. 4 in ‘84). This year, that might change. Not only could “Thriller” be in the mix for the post-Halloween No. 1, but so might a much newer song — one already not that far from the Hot 100’s top spot. “Thriller” has, of course, been getting progressively closer to No. 1 since 2018 — although some variability in the timing of the chart week and the release schedule has kept it from being a straight line of progress. After reaching No. 31 in 2018, it spent the next two years returning to the 40s, before jumping to No. 19 in 2021, then returning to the 20s in 2022-24, before hitting the top 10 last year. But this year, there’s reason to expect that more than just general upwards momentum will propel “Thriller” closer to the top spot. As covered extensively by writer Mikhail Grant on his Polytmus Substack earlier in the year — in an entry boldly titled “I Predict The Song ‘Thriller’ Will Go To #1 Soon on the Hot 100” — there are larger 2026 trends both within the Hot 100 and within Jackson’s own catalog to lend additional credence to the notion that the song will have a chance to truly contend for No. 1 this year. First, in 2018, when “Thriller” began re-char", "date_str": "2026-10-23T18:05:16+00:00", "hash": "677388ad62378b26", "title_fa": "آیا امسال اولین هالووین فصلی خود را شماره 1 قرن خواهیم داشت؟ «هیجان‌انگیز»، «دراکولا» و وحشتناک‌ترین مسابقه ۱۰۰ داغ تا کنون", "summary_fa": "فقط یک هفته تا نوامبر باقی مانده است، یعنی ماریا کری احتمالاً برای خروج سالانه خود از پیله هوای گرم خود برای اعلام شروع فصل تعطیلات موسیقی پاپ عصبانی می شود. اما امسال، او ممکن است کمی بیشتر از حد معمول صبر کند تا آن را رسمی کند: ما یک مسابقه فصلی دیگر برای اولین بار در سال 2026 داریم. تقریباً یک دهه است که هالووین به طور منظم بر روی بیلبورد Hot 100 تأثیرگذار بوده است، از زمانی که فیلم همیشگی ترسناک پاپ «Thriller» مایکل جکسون برای اولین بار در جدول تاریخ 10 نوامبر 2018 در رتبه 31 قرار گرفت. از آن زمان با دیگر کلاسیک های فصل شبح آور مانند بابی «بوریس» پیکت و «هیولا مش» از Crypt-Kickers و «شکارچیان ارواح» ری پارکر جونیور به عنوان شکارچیان سالیانه این فهرست همراه شده است، با ترانه های The Citizens of Halloween از «This Is Rock Watching the Halloween» و «This Is Rock Watching the Halloween» و همچنین «Thes Iswell Me WatchScra» از The Citizens of Halloween دو سال با این حال، هیچ یک از آن آهنگ‌ها به‌طور جدی رتبه اول جدول را پس از بازدیدهای سالانه خود تهدید نکرده‌اند. دو نفر از آنها در اکران اولیه خود در صدر جدول قرار گرفتند - «Monster Mash» در سال 1962 و «Ghostbusters» در سال 1984، اولی حتی به مدت دو هفته در پایان اکتبر این کار را انجام داد - و در سال 2025، «Thriller» اولین فیلم اصلی فصلی شد که به 10 فیلم برتر بازگشت و به رتبه 8 اصلی رسید (در نوامبر گذشته در رتبه 10 قرار گرفت). امسال، ممکن است تغییر کند. نه تنها \"Thriller\" می تواند در ترکیب شماره پس از هالووین باشد. 1، اما ممکن است یک آهنگ بسیار جدیدتر باشد - آهنگی که در حال حاضر با رتبه برتر Hot 100 فاصله زیادی ندارد. «Thriller»", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/michael-jackson-thriller-1983-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۲۱:۳۵"}, {"source": "Billboard", "title": "From Wynonna to Ella Langley: Albums With 3 or More Country Airplay No. 1s by Women", "link": "https://www.billboard.com/lists/albums-with-country-airplay-number-1s-by-women/", "summary": "Women have spent much of 2026 rewriting Billboard ’s country record books. Ella Langley has been at the center of many of those milestones, while Taylor Swift, Stella Lefty and others have contributed to a broader run of new benchmarks on Hot Country Songs. Related Women s Country Chart Sweep Is Unlike Any Before, Thanks to Ella Langley, Taylor Swift Stella Lefty Now, Langley’s Dandelion , which has spent 21 weeks at No. 1 on Top Country Albums since it debuted in April, has delivered yet another milestone. With “Choosin’ Texas,” “Be Her, the Morgan Wallen duet “I Can’t Love You Anymore,” and on the Oct. 31-dated chart, Loving Life Again, each reaching No. 1, Dandelion is just the second album by a woman or an act with a woman vocalist to generate at least four leaders since the chart launched in 1990. It’s the first to reach the threshold since Shania Twain s The Woman In Me in 1996. Wallen brings some impressive album history of his own to the occasion. His “Don’t We,” which immediately preceded “I Can’t Love You Anymore” atop Country Airplay, became the seventh No. 1 from I’m the Problem , making it the first album to generate seven leaders from an original version. Luke Combs’ What You See Is What You Get also produced seven when counting its original and deluxe editions. For albums by women, however, even three has become rare. Ten of the 13 qualifying sets arrived between 1992 and 2009. Carrie Underwood leads with three y. She most recently served as vp of worldwide creative at the publishing company, and agreed to continue serving in an advisory capacity working directly with CEO Mike O’Neill . Cane began at BMI in 1970, where she worked part time while still in high school. She spent the entirety of her professional career at the company, starting in BMI’s Song Research department. She held roles including general manager of the Los Angeles office and as vp of create in New York, Los Angeles and London. “After more than five decades, BMI is not simply where I have built my career — it is part of who I am,” Cane said in a statement. “It gave me the opportunity to grow, to discover, and, most importantly, to uncover the soul within the songwriter. Through every chapter of my journey, I have come to understand that creativity is not simply a profession it is the heart of who songwriters are and the force that moves our industry forward. What has made this journey so meaningful is that my own values remain deeply aligned with those of BMI — to believe in creators, to nurture their gifts, and to create an environment in which their careers can flourish. After 50 years, that purpose still lives in my heart — and it is why this work has never felt simply like a career, but like a calling.” O’Neill added, “Barbara is one of the first people I met when I joined BMI almost 32 years ago, and her kindness, caring nature and warm welcome showed me exactly why she is so loved by so many in our industry. She has demonstrated that same care and attention time and again to the many songwriters she worked with, nurtured and supported, and it’s why her relationships in this industry have endured. While Barbara and I started out as colleagues, we’ve ended up as family, and I don’t know many who can say that about the people they work with. The beautiful thing for me is that Barbara has agreed to continue working with me as an advisor, allowing BMI and our writers to still have her insight and counsel, while also allowing her to enjoy some time away from us for the first time in fifty years.” In 2019, Cane received the NMPA Lifetime Service Award, and she is a member of NARAS, CMA, ACM and the Songwriters Hall of Fame. She was named one of Billboard ’s Top Women in Music in 2011 and 2024. When it comes to inspiring and elevating songwriters, Barbara is in a league of her own,” Mike Steinberg, executive vp and chi", "date_str": "2026-10-23T17:28:53+00:00", "hash": "9b8e394dae3ef862", "title_fa": "میز گردان اجرایی: باربارا کین پس از 50 سال از BMI بازنشسته شد. ران برویتمن به عنوان رئیس Global Synch در WMG انتخاب شد", "summary_fa": "باربارا کین پس از 50 سال فعالیت در این شرکت، بازنشستگی خود را از BMI اعلام کرد. او اخیراً به عنوان معاون خلاق جهانی در شرکت انتشارات خدمت کرد و موافقت کرد که به عنوان مشاور به طور مستقیم با مدیر عامل مایک اونیل به خدمت ادامه دهد. کین در سال 1970 با BMI شروع به کار کرد، جایی که او در دوران دبیرستان به طور نیمه وقت کار می کرد. او تمام دوران حرفه ای خود را در این شرکت گذراند و از بخش تحقیقات آهنگ BMI شروع کرد. او نقش هایی از جمله مدیر کل دفتر لس آنجلس و معاون ایجاد در نیویورک، لس آنجلس و لندن را بر عهده داشت. کین در بیانیه‌ای گفت: «پس از بیش از پنج دهه، BMI فقط جایی نیست که من حرفه‌ام را ساخته‌ام، بلکه بخشی از شخصیت من است. این به من این فرصت را داد که رشد کنم، کشف کنم و مهمتر از همه، روح درون ترانه سرا را کشف کنم. در هر فصل از سفرم، متوجه شدم که خلاقیت صرفاً یک حرفه نیست، بلکه قلب ترانه سراها و نیرویی است که صنعت ما را به جلو می برد. چیزی که این سفر را بسیار معنی‌دار کرده است این است که ارزش‌های من عمیقاً با ارزش‌های BMI همسو می‌ماند - اعتقاد به سازندگان، پرورش هدایای آن‌ها و ایجاد محیطی که در آن حرفه‌شان شکوفا شود. پس از 50 سال، این هدف هنوز در قلب من زنده است - و به همین دلیل است که این کار هرگز به سادگی مانند یک حرفه نیست، بلکه مانند یک فراخوان است. اونیل اضافه کرد: «باربارا یکی از اولین افرادی است که تقریباً 32 سال پیش زمانی که به BMI پیوستم با او آشنا شدم و مهربانی، طبیعت دلسوز و استقبال گرم او دقیقاً به من نشان داد که چرا بسیاری از  the time was Drake calling for the Laugh Now Cry Later music video . Everything shifted after that because brands started to take me seriously,” he explained. “Now it’s transactional with everything.” Druski continued: “Once I was seen with Drake, Lil Durk, we had Marshawn Lynch, Kevin Durant, Odell Beckham Jr. all in this video alongside me. Me being the comedic relief in this video, which was called ‘Laugh Now, Cry Later,’ this meant a lot more than another music video.” Season 52 of SNL is slated to resume on Halloween with Obsession actress Inde Navarrette hosting and Gracie Abrams performing. Following Druski s episode, John Mulaney will play host on Nov. 14 with Phoebe Bridgers serving as the musical guest. Find Druski s SNL announcement post below. View this post on Instagram", "date_str": "2026-10-23T17:24:28+00:00", "hash": "eb5e1b5beb095dad", "title_fa": "دریک، تراویس اسکات و کواوو عشق خود را به دروسکی برای کنسرت میزبانی «SNL» نشان می‌دهند: «So F–king Proud»", "summary_fa": "دروسکی به عنوان مجری فصل 52 شنبه شب زنده در روز پنجشنبه (22 اکتبر) معرفی شد و بسیاری از دوستان هیپ هاپ او به او عشق خود را به این شاهکار پیش رو نشان دادند. دروسکی با شروع کار کمدی خود: همه چیز بعد از آن تغییر کرد تا فیبی بریجرز به عنوان مهمان موزیکال در اپیزود میزبان جان مولانی با پشتیبانی جک هارلو دریک، SNL خود را تغییر دهد، دروسکی می خواهد آثار کمدی خود را به سطح بعدی برساند. Quavo، Wheezy و Reese LaFlare. دریزی در کامنت های IG دروسکی در پستی که از کنسرت میزبانی آتی خود خبر می دهد، نوشت. Quavo افزود: آن پسر خوب است! طرفداران می توانند انتظار داشته باشند که تراویس اسکات در 7 نوامبر حضور داشته باشد، زمانی که دروسکی استودیو 8H مرکز راکفلر در میدتاون منهتن را بر عهده گرفت. La Flame هیپ نوشت: N—A WE MADE IT. من آنجا خواهم بود. !!!؟ نمی توان این را از دست داد. اسکات همچنین کنسرت میزبانی دروسکی را در IG Story خود بازنشر داد. او نوشت. دروسکی - که یکی از جلدهای بیلبورد 2025 را بر عهده داشت - در ادامه رشد بی نظیر و بی نظیر خود در سرگرمی، اولین خالق محتوای دیجیتالی خواهد بود که میزبان SNL در تاریخ نمایش است. گروه Strokes به عنوان مهمان موسیقی در 7 نوامبر اجرا خواهند کرد. دروسکی در یک مصاحبه صریح نادر با The Diary of a CEO در سپتامبر در مورد دوران کودکی و سفر خود به عنوان یک کمدین اینترنتی صحبت کرد، که باعث شد دریک پس از انتخاب او در یکی از ویدیوهای رپر در سال 2020، مسیر خود را تغییر دهد. او توضیح داد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/drake-druski-2021-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۵۴"}, {"source": "Billboard", "title": "Billy Corgan on Why He’s Stood By Marilyn Manson: ‘I Don’t Want the World to Tell Me Who My Friends Are’", "link": "https://www.billboard.com/music/music-news/billy-corgan-defends-marilyn-manson-friendship-explains-why-1236367239/", "summary": "Billy Corgan is standing by Marilyn Manson . In his Thursday (Oct. 22) appearance on The New York Times Popcast , The Smashing Pumpkins frontman explained why he s maintained his friendship with the controversial shock rocker. Related A Timeline of Abuse Allegations Against Marilyn Manson Marilyn Manson s Ex-Assistant Successfully Revives Sex Abuse Lawsuit Against Rocker (Again) Smashing Pumpkins Billy Corgan Talks Green Day s Political Music, Criticizes Rock Roll Hall of Fame As a Christian person, you have to stand by your friends, but that doesn t mean you don t have an opinion, and it doesn t mean you re not critical, Corgan began, pausing to choose his words carefully. In his case and I m not here to adjudicate it but the [district attorney] looked at the case for five years. In some cases, I knew personal things behind the scenes that are not in the public sphere, the Chicago musician continued. I personally didn t feel that he was guilty of the things that he was being charged with, and ultimately the fact that the DA didn t pursue [it] was commensurate with the person I knew. Corgan and Manson whose real name is Brian Warner have known each other for decades. A couple of years after they became friends in the 90s, they went through a rift that lasted up until 2015, when they reunited to embark on their joint End Times Tour. It was about six years after the two men buried the hatchet that Evan Rachel Wood named Manson as her alleged abuser after years of advocating against domestic violence, which was followed by multiple other women coming forward with accusations of sexual assault and misconduct against the rocker; Manson has continuously denied all of the claims. In January 2025, Los Angeles DA Nathan J. Hochman announced that after investigating for four years, Manson would not face criminal charges due to the statute of limitations on the charges and a lack of ways to prove them. “While we are unable to bring charges in this matter, we recognize that the strong advocacy of the women involved has helped bring greater awareness to the challenges faced by survivors of domestic abuse and sexual assault,” Hochman stated at the time. Manson’s attorney Howard King told Billboard shortly after the decision, “We are very pleased that, after a thorough and incredibly lengthy review of all of the actual evidence, the district attorney has concluded what we knew and expressed from the start Brian Warner is innocent. On Popcast , Corgan shared a bit of his ", "date_str": "2026-10-23T17:16:34+00:00", "hash": "60ca64ee4e59fde9", "title_fa": "بیلی کورگان در مورد اینکه چرا او در کنار مرلین منسون ایستاده است: \"من نمی خواهم دنیا به من بگوید دوستان من چه کسانی هستند\"", "summary_fa": "بیلی کورگان در کنار مرلین منسون ایستاده است. رهبر گروه The Smashing Pumpkins در روز پنجشنبه (22 اکتبر) خود در پاپکست The New York Times توضیح داد که چرا دوستی خود را با شوک راکر جنجالی حفظ کرده است. مرتبط جدول زمانی اتهامات سوء استفاده علیه مرلین منسون دستیار سابق مرلین منسون با موفقیت احیای دادخواست سوء استفاده جنسی علیه راکر (دوباره) Smashing Pumpkins بیلی کورگان در موسیقی سیاسی گرین دی صحبت می کند، از شما انتقاد می کند که راک رول شما را به عنوان یک شخص مسیحی از طرف من می شناسد. کورگان شروع کرد و مکث کرد تا کلماتش را با دقت انتخاب کند. در مورد او و من اینجا نیستم تا در مورد آن قضاوت کنم، اما [دادستان منطقه] به مدت پنج سال به پرونده نگاه کرد. این نوازنده شیکاگو ادامه داد: در برخی موارد، در پشت صحنه چیزهای شخصی می دانستم که در حوزه عمومی نیست. من شخصاً احساس نمی‌کردم که او در مورد چیزهایی که به آنها متهم می‌شد مقصر است، و در نهایت این واقعیت که DA [آن را] دنبال نکرد، متناسب با شخصی بود که من می‌شناختم. کورگان و منسون با نام اصلی برایان وارنر چندین دهه است که یکدیگر را می شناسند. چند سال پس از اینکه آنها در دهه 90 با هم دوست شدند، آنها شکافی را پشت سر گذاشتند که تا سال 2015 ادامه یافت، زمانی که آنها دوباره متحد شدند تا تور مشترک پایان تایمز خود را آغاز کنند. حدود شش سال پس از دفن هچ دو مرد بود که ایوان ریچل وود منسون را پس از سال‌ها حمایت از خشونت خانگی، منسون را به‌عنوان آزاردهنده‌ی ادعایی خود معرفی کرد، که پس از آن چندین زن دیگر با اتهامات تجاوز جنسی و بدرفتاری علیه راک مطرح شدند. منسون به طور مداوم تمام این ادعاها را رد کرده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/483208216-e1792774543960.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۴۶"}, {"source": "Billboard", "title": "John Mayer Wants To Run Away With You on First Single in Five Years, ‘Tom and Jerry’: Stream It Now", "link": "https://www.billboard.com/music/rock/john-mayer-tom-and-jerry-single-stream-it-now-1236367270/", "summary": "John Mayer really wants you, even if you don t necessarily want him back. The Your Body Is a Wonderland star and Dead Company member released his first new solo single in more than five years on Friday (Oct. 23), the contemplative Tom and Jerry . The midtempo bubbler opens with a shuffling, brushed drum pattern and hypnotic guitar riff as Mayer admits from the jump that things are not going great. I m never gonna catch you/ This is never gonna end/ Might as well be my lover/ If you don t wanna be my friend, he sings in a resigned voice. You re my badge/ Baby, I m your scar/ Throwin daggers at the camera/ Trying to him me from afar, he adds. Then comes the real talk, as Mayer concedes, Now if you ever come through/ Which I doubt you ll do/ I ll run away with you to a lover who only wants him when they ve already got someone else or when it s all wrong. Tom and Jerry was the name I used when saving my first voice memo with this song idea, Mayer wrote in an Instagram post promoting the song, featuring cover art in which he is handcuffed to an unseen woman. And if you ever come through, which I doubt you’ll do, I’ll run away with you. From that moment on, the adventure began in bringing that feeling to life, he continued. I’ve said it before, but it bears repeating every time I get to work with a group of incredibly talented and deeply dedicated artists who will stop at nothing until the sound comes into focus and becomes a picture. I can’t wait to tell you more about it, but first, it’s important that you know who contributed to this track. The post included the full roster of contributors, which includes co-writer and co-producer Blake Slatkin (Justin Bieber, Sam Smith), beloved Welsh session bassist Pino Palladino (The Who, Adele), drummer Aaron Sterling (Taylor Swift, Harry Styles), percussionist Lenny Castro (Maroon 5, The Rolling Stones) and pianist Larry Goldings (Sia, James Taylor). In addition to co-writing and co-producing the song, Mayer is credited with acoustic and electric guitar, keyboards/synths and programming. The song — the singer/guitarist s first solo release since his 2021 Sob Rock album — is the first effort under Mayer s new deal with Mercury Records for his Sob Rock Records imprint. Sob Rock , which peaked at No. 2 on the Billboard 200, was Mayer s final album for Columbia Records. The Gravity star is gearing up to launch his 21-show residency run at Las Vegas Sphere, which is slated to kick-off on April 8 and run through a June 12, 20", "date_str": "2026-10-23T17:15:49+00:00", "hash": "6c7c07a5634d326c", "titl ngs, Authentic Unlimited, East Nash Grass and Trey Hensley were among the top winners at the International Bluegrass Music Association Awards held Thursday (Oct. 22) at Soldiers and Sailors Memorial Auditorium in downtown Chattanooga, Tenn. This year s awards show was hosted by Sam Bush and Sierra Hull. Strings was named entertainer of the year for a fifth time, having previously earned the accolade in 2021, 2022, 2023 and 2025. The music video for The Devil Went Down to Deep Gap by Billy Strings and Bryan Sutton was honored with the music video of the year award. Two years ago, group East Nash Grass had been named new artist of the year; this year, the band earned two trophies, including album of the year (for All God s Children ), as well as instrumental group of the year. Meanwhile, Trey Hensley earned song of the year for Can t Outrun the Blues and Hull earned her eighth mandolin player of the year accolade. The ceremony also saw four distinguished honorees inducted into the Bluegrass Hall of Fame: Byron Berline, The Nashville Bluegrass Band, The Lost Found and Sugar Hill Records cofounder Barry Poss. During the evening, several artists performed, including Patty Loveless with Sister Sadie, Stuart Duncan and Justin Moses, as well as performances from Hull, a Sam Bush All-Star Band, The Del McCoury Band, Authentic Unlimited, Michael Cleveland and Flamekeeper, and The Grascals. The awards show took place during the 2026 IBMA World of Bluegrass, which runs from Oct. 20 to 24 in downtown Chattanooga, Tenn., and includes four key events: the IBMA Business Conference at the Chattanooga Convention Center, IBMA Bluegrass Ramble and IBMA Bluegrass Live!®, Bluegrass Music Awards show at Soldiers and Sailors Memorial Auditorium, and IBMA Pickin’ in the Park, a free all-day festival featuring live performances and more at Miller Park and Miller Plaza. During the IBMA Business Conference, honorees for the IBMA Momentum Awards, Industry Awards and Distinguished Achievement Awards were also given out. See the full list of 2026 IBMA Bluegrass Music Awards winners below: Entertainer of the year: Billy Strings Vocal group of the year: Authentic Unlimited Instrumental group of the year: East Nash Grass Song of the year: Can t Outrun the Blues, Trey Hensley (Songwriters: Trey Hensley, Bobby Starnes; Producer: Brent Maher; Label: Pinecastle Records) Album of the year: All God s Children , East Nash Grass (Producers: Jake Stargel, East Nash Grass; Label: Mountain ", "date_str": "2026-10-23T17:03:19+00:00", "hash": "d0392fc1292b8a7e", "title_fa": "برندگان جوایز IBMA بیلی استرینگ و ایست نش گراس 2026", "summary_fa": "Billy Strings، Authentic Unlimited، East Nash Grass و Trey Hensley از جمله برندگان برتر جوایز انجمن بین‌المللی موسیقی بلوگراس بودند که پنجشنبه (22 اکتبر) در سالن یادبود سربازان و ملوانان در مرکز شهر چاتانوگا، تن برگزار شد. نمایش جوایز امسال توسط سیرا هال و سام بوش برگزار شد. استرینگ برای پنجمین بار به عنوان سرگرم کننده سال انتخاب شد و پیش از این در سال های 2021، 2022، 2023 و 2025 این جایزه را کسب کرده بود. موزیک ویدیو The Devil Went Down to Deep Gap اثر بیلی استرینگ و برایان ساتون با دریافت جایزه بهترین موزیک ویدیو سال تجلیل شد. دو سال پیش، گروه East Nash Grass به عنوان هنرمند جدید سال انتخاب شد. در این سال، گروه دو جایزه، از جمله آلبوم سال (برای فرزندان همه خدا) و همچنین گروه ساز سال را به دست آورد. در همین حال، تری هنسلی آهنگ سال را برای Can t Outrun the Blues و هال هشتمین نوازنده ماندولین سال را به دست آورد. این مراسم همچنین شاهد حضور چهار افتخاری برجسته در تالار مشاهیر بلوگراس بود: بایرون برلین، گروه نشویل بلوگرس، گمشده یافت شده و بری پوز، بنیانگذار Sugar Hill Records. در طول شب، چندین هنرمند اجرا کردند، از جمله پتی لاولس با خواهر سادی، استوارت دانکن و جاستین موزس، و همچنین اجراهایی از هال، یک گروه ستارگان سام بوش، گروه دل مک کوری، نامحدود معتبر، مایکل کلیولند و شعله‌کیپر، و گراسکالز. نمایش جوایز در طول IBMA World of Bluegrass 2026 برگزار شد که از 20 تا 24 اکتبر در مرکز شهر Chattanooga، Tenn برگزار می‌شود و شامل چهار رویداد کلیدی وحیه در نمایش پرانرژی افتتاحیه 22 اکتبر در FilmQuest بود. جشنواره 10 روزه در پروو، دهمین قسمت خود را با نمایش ویژگی اکشن موتورسیکلت ساخت یوتا، \"Whisky Throttle\" آغاز کرد. پس از ورود به خانه نمایش جشنواره در گالری موسیقی زنده Velor، از تماشاگران با [ ] استقبال شد: \"مادر لعنتی یوتا، بیا برویم!\" جاناتان مارتین، بنیانگذار و کارگردان FilmQuest، یک تیم تشویق کننده تک نفره برای فیلمسازی و ژانر در یوتا، به تقویت تماشاگران کمک کرد. او شب بازی را به جمعیت معرفی کرد — به ساندنس برای جمع کردن وسایل و خروج از ایالت و همسایه‌های شمال آیداهو چند ضربات دوستانه پرتاب کرد. پرطرفدار در Variety طنز محلی به خوبی در اتاق بازی می‌کرد، همانطور که در اعلامیه افتتاحیه FilmQuest اعلام شد که هیچ یک از فیلم‌های جشنواره از هوش مصنوعی استفاده نمی‌کردند. این موضوع باعث شد تا در اتاقی مملو از خلاقان مستقل که معتقدند هوش مصنوعی شغل آنها را تهدید می کند و کیفیت هنر را پایین می آورد، صدای تشویق را به همراه داشت. «Whiskey Throttle» جمعیت شهر زادگاه را با تشویق مکرر برای انفجارهای فیلم، دوربین‌های خیره‌کننده موتورسیکلت بیابانی و بدلکاری‌های عملی، مردم شهر را روی لبه صندلی‌هایشان نگه داشت. جیکوب شوارتز داستان یک باند دوچرخه سواری را کارگردانی کرد که یک سوار مرموز را تعقیب می کند که یک رهبر کارتل را کشته و کیف پول رمزنگاری او را دزدیده است. در Q A بعد از اولین نمایش، دیو هانتر، که فیلم را تحت پرچم جدید خود در یوتا تولید کرد، با احساس تولید در شهر زادگاهش صحبت کرد و گفت: \"تمام خانواده من درگیر هستند. همه بچه های من بدلکار بودند ... ما همه کسانی را داشتیم که می شناختیم در این فیلم نقش داشتند.\"", "image_url": "https://variety.com/wp-content/uploads/2026/10/Whiskey-1.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۴۶"}, {"source": "Variety", "title": "‘Killing a Bear,’ From Movistar Plus and Arte France: a Real-Event Inspired Murder-Mystery Whose Victim Is a Pyrenean Brown Bear", "link": "https://variety.com/2026/tv/global/killing-a-bear-movistar-plus-arte-france-sanchez-cabezudo-1236929739/", "summary": "Crime rep ‌تواند تا ۱۰ میلیارد دلار در شرکت رسانه‌ای «ماسک» سرمایه‌گذاری کند، حساب تبلیغاتی TikTok به طور موقت پیش از انتشار گسترده مستند به حالت تعلیق درآمده است. لیز گارسیا، سخنگوی، گفت: ما به برخی از شخصیت‌های بزرگ شهردار باس عادت کرده‌ایم، اما این ممکن است یکی از بزرگترین او باشد. او به چشم رای دهندگان نگاه می کند و از افزایش اعتبار مالیاتی فیلم که در سطح ایالت وضع شده است، اعتبار می گیرد. در همین حال، لس آنجلس 40000 شغل سرگرمی را در ساعت خود از دست داده است. شهردار باید زمان کمتری را صرف اعتبار برای کار ساکرامنتو کند و زمان بیشتری را برای پاسخگویی به شکست او در محافظت از مشاغل و تولیداتی که لس‌آنجلس را", "image_url": "https://variety.com/wp-content/uploads/2026/05/Karen-Bass-Nithya-Raman.jpg?crop=0px%2C0px%2C1000px%2C562px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما", "سرمایه‌گذاری"], "datetime_fa": "۱ آبان • ۲۰:۳۱"}, {"source": "Billboard", "title": "Jamie Miller Becomes First Male Solo Welsh Artist to Top U.K. Singles Chart in 41 Years With ‘Babydoll’", "link": "https://www.billboard.com/music/chart-beat/jamie-miller-babydoll-number-1-uk-singles-chart-1236367178/", "summary": "Jamie Miller ’s “Babydoll” has ascended to No. 1 on the U.K. s Official Singles Chart (dated Oct. 23), making him the first Welsh artist in 15 years to land a chart-topping single. The Cardiff-born singer’s achievement marks the first time a Welsh artist has topped the U.K. singles chart since Sian Evans featured on DJ Fresh’s “Louder,” which reached No. 1 in 2011. He also becomes the first Welsh solo male artist to lead the chart in 41 years, since Shakin’ Stevens topped the chart with his holiday hit “Merry Christmas Everyone” in 1985. “Babydoll,” which has become a viral smash in recent weeks due to Miller’s two-step choreography trend, narrowly edged out Tate McRae’ s “Housewife” (No. 2) to hit the summit. Miller told the Official Charts Company in a statement: “I don t even know what to say other than thank you so much for getting me No. 1. This is the biggest thing that s ever happened to me in my life I love you guys.” Elsewhere on the chart, Olivia Rodrigo ’s “Expectations” remix with Chappell Roan lands at No. 3. Ashe’s “Stop the Wedding” follows at No. 4, while Sienna Spiro’s previous chart-topper “Great Expectation” falls to No. 5. Country superstar Zach Bryan scores a new U.K. chart best as “Lies,” featuring Lana Del Rey, climbs to No. 7. Bryan also lands another track in the top 40, with “Lodi When” reaching No. 33 following the release of his new EP, Young Manhood and Other Donatable Organs . Fontaines D.C., who reins triumphant on this week’s Official Albums Chart with chart-topping fifth LP Dopamine Chamber , lands three songs in the top 40. Marianne” finishes at No. 12, marking a new personal best for the Irish five-piece, while “Japan” debuts at No. 14 and “Demolition” enters at No. 18. Justice also returns to the U.K. top 40 for the first time in 20 years. The French electronic duo’s new Grand Theft Auto VI song, “Flower In a Hurricane” featuring Tame Impala and SZA, finishes at No. 31. Rounding out the week’s chart highlights, Michael Jackson’s classic “Thriller” creeps back into the top 40 at No. 39 as Halloween approaches.", "date_str": "2026-10-23T17:00:00+00:00", "hash": "11788f47ee64a05d", "title_fa": "جیمی میلر با «Babydoll» به اولین هنرمند ولزی سولو مرد تبدیل شد که در 41 سال گذشته در جدول تک آهنگ های بریتانیا قرار گرفت.", "summary_fa": "«Babydoll» جیمی میلر در جدول تک‌آهنگ‌های رسمی بریتانیا (مورخ 23 اکتبر) به رتبه 1 صعود کرد و او را به اولین هنرمند ولزی در 15 سال اخیر تبدیل کرد که موفق به کسب یک تک آهنگ برتر شد. موفقیت این خواننده متولد کاردیف اولین بار است که یک هنرمند ولزی پس از حضور سیان ایوانز در آهنگ \"Louder\" از دی جی فرش که در سال 2011 به رتبه اول رسید، در صدر جدول تک آهنگ های بریتانیا قرار گرفت. او همچنین به اولین هنرمند مرد ولزی تبدیل شد که در 41 سال گذشته چارت را رهبری می‌کند، از زمانی که Shakin' Stevens با آهنگ تعطیلاتش «Merry Christmas Everyone» در سال 1985 در صدر جدول قرار گرفت. برای زدن قله میلر در بیانیه‌ای به شرکت نمودارهای رسمی گفت: «من حتی نمی‌دانم چه بگویم جز اینکه از شما بسیار سپاسگزارم که من را شماره 1 کردید. این بزرگترین اتفاقی است که در زندگی من برای من افتاده است. در جای دیگری از چارت، ریمیکس «انتظارات» اولیویا رودریگو با چاپل روان در رتبه 3 قرار می گیرد. «عروسی را متوقف کنید» از اش در رتبه 4 قرار می گیرد، در حالی که «انتظار بزرگ» از سینا اسپیرو در رتبه 5 قرار دارد. با حضور لانا دل ری به شماره 7 صعود می کند. برایان همچنین آهنگ دیگری در 40 آهنگ برتر قرار می گیرد که آهنگ Lodi When به شماره 7 رسید. 33 پس از انتشار EP جدید او، جوانمردی و سایر اعضای قابل اهدا. Fontaines D.C. که در چارت آلبوم های رسمی این هفته با رتبه پنجم آلبوم دوپامین Chamber پیروز شد، سه آهنگ را در بین 40 آهنگ برتر به دست آورد. ماریان در رتبه 12 قرار گرفت و بهترین آلبوم شخصی جدید برای پنج قطعه ایرلندی را به خود اختصاص داد، در حالی که \"Japan\" در رتبه 8.14 اولین بار", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Jamie-Miller-Matthew-Langlois-Billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Fontaines D.C. Earns 2026’s Biggest Opening Week By a Group as ‘Dopamine Chamber’ Hits No. 1 on U.K. Albums Chart", "link": "https://www.billboard.com/music/chart-beat/fontaines-dc-dopamine-chamber-number-1-uk-albums-chart-1236364318/", "summary": "Fontaines D.C. has secured its second No. 1 on the U.K. s Official Albums Chart with Dopamine Chamber , delivering one of the biggest album debuts of 2026 so far. Related Fontaines D.C. s Dopamine Chamber : Every Song Ranked Fontaines D.C. Enlist Rosalía for Stunning Duet Where Is Gone? : Listen Tate McRae Debuts at No. 1 In Australia With ‘Housewife’ According to the Official Charts Company, the Irish five-piece shifted more than 70,000 chart units during the album’s opening week for the chart dated Oct. 23, giving Dopamine Chamber the third-biggest opening week for an album in 2026, following Harry Styles’ Kiss All the Time. Disco, Occasionally (183,000 chart units) and Olivia Rodrigo’s you seem pretty sad for a girl so in love (103,000 chart units). It marks the band’s second U.K. chart-topper, following 2022’s Skinty Fia . Reviewing Dopamine Chamber for Billboard U.K. , editor Thomas Smith wrote that the album treads a fine line between introspection and darkness, with stadium-headlining ambition and does so superbly, adding that the set could be the start of the band s Imperial Phrase, to borrow a phrase from Pet Shop Boys’ Neil Tenant. Rodrigo’s you seem pretty sad follows at No. 2, while Michael Jackson’s The Essential Compilation lands at No. 3. Olivia Dean’s The Art of Loving holds firm at No. 4, while Sienna Spiro’s July debut LP, Visitor , rounds out the top five. British-Zimbabwean singer Rachel Chinouriri earns her first top 10 album as sophomore LP I Think I Spoke Too Soon finishes at No. 9, with Zach Bryan’s Young Manhood and Other Donatable Organs coming in at No. 11. Tate McRae’s 2025 album So Close To What also rebounds into the top 40, landing at No. 29 following renewed interest sparked by her latest single, “Housewife.” Midlands singer-songwriter Nieve Ella scores a milestone as her debut album, How Long Will It Take? , enters the chart at No. 31.", "date_str": "2026-10-23T17:00:00+00:00", "hash": "e8dfa571a6ae5af5", "title_fa": "Fontaines D.C بزرگترین هفته افتتاحیه سال 2026 توسط گروهی را به دست آورد که «اتاق دوپامین» رتبه اول جدول آلبوم های بریتانیا را به دست آورد.", "summary_fa": "Fontaines D.C با دوپامین چمبر دومین شماره 1 جدول آلبوم های رسمی بریتانیا را به دست آورده است و یکی از بزرگترین آلبوم های سال 2026 را ارائه کرده است. اتاق دوپامین مربوط به فونتینز دی سی: هر آهنگ رتبه بندی شده فونتینز دی سی. روزالیا را برای دوئت خیره کننده کجا رفته؟ : گوش دادن به اولین حضور تیت مک‌ری در شماره. 1 در استرالیا با «Housewife» طبق اعلام شرکت نمودارهای رسمی، این پنج قطعه ایرلندی بیش از 70000 واحد چارت را در هفته افتتاحیه آلبوم برای چارت مورخ 23 اکتبر جابجا کرد و به Dopamine Chamber سومین هفته افتتاحیه بزرگ آلبوم را در سال 2026، پس از هری استایلز «Kiss All the Time» داد. دیسکو، Occasionally (183000 واحد نمودار) و Olivia Rodrigo برای دختری بسیار عاشق به نظر می رسد بسیار غمگین هستند (103000 واحد نمودار). این دومین گروه در بریتانیا است. پس از Skinty Fia در سال 2022، برترین نمودار. سردبیر توماس اسمیت، با بررسی Dopamine Chamber برای Billboard U.K، نوشت که این آلبوم خط باریکی را بین درون نگری و تاریکی، با جاه‌طلبی سرفصل استادیوم طی می‌کند و این کار را فوق‌العاده انجام می‌دهد، و اضافه کرد که این مجموعه می‌تواند آغازی بر عبارت Imperial گروه باشد، تا عبارتی از پت شاپ پسران نیل تنانت را قرض بگیرم. به نظر می‌رسد شما بسیار غمگین از رودریگو در رتبه دوم قرار می‌گیرد، در حالی که فیلم The Essential Compilation از مایکل جکسون در رتبه 3 قرار می‌گیرد. The Art of Loving اثر اولیویا دین در رتبه 4 قرار دارد، در حالی که اولین آلبوم LP سینا اسپیرو با عنوان Visitor در ژوئیه، پنج نفر برتر را تکمیل می کند. راشل چینوریری، خواننده بریتانیایی زیمبابوه‌ای، اولین آلبوم 10 آلبوم برتر خود را به عنوان آلبوم دوم LP I Think I Speke Too Soon در رتبه 9 به پایان", "image_url": "https://www.billboard.com/wp-content/uploads/2026/08/Fontaines-DC-Elizaveta-Porodina-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Cardi B Treats Herself to Extremely Rare $3M Pink ‘Barbie’ Rolex Daytona for Her Birthday: ‘Gift From Me to Me’", "link": "https://www.billboard.com/music/rb-hip-hop/cardi-b-rare-pink-rolex-3-million-dollar-birthday-video-1236367173/", "summary": "Cardi B is treating herself after turning 34 earlier in October. The Bronx native flexed an extremely rare pink Barbie Rolex Daytona in an Instagram post on Thursday (Oct. 22), which appears to have a price tag pushing $3 million. Related Cardi B Reveals Her Pick for the Greatest Album of All Time That Every Woman Should Listen To No Beef: Cardi B Buys a Coach Bag After Controversy Over Like What (Freestyle) Lyric Cardi B Ex less-Lili-Taylor-Gideon-Adlon-Jaeden-Martell-James-Wilkie-Broderick-Jaya-Harper-Jahi-Winston-and-Alex-Cosani-1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۲۰:۰۰"}, {"source": "Rolling Stone", "title": "The Birth of ‘Confessions II’: Producer Stuart Price Breaks Down Madonna’s Instant Classic", "link": "https://www.rollingstone.com/music/music-features/confessions-ii-producer-stuart-price-interview-1235646148/", "summary": "Read our full interview with Madonna collaborator Stuart Price on the studio magic that yielded her return to the dance floor", "date_str": "2026-10-23T16:19:23+00:00", "hash": "078dfac0a67379ee", "title_fa": "The Birth of Confessions II: تهیه کننده استوارت پرایس کلاسیک فوری مدونا را شکست می دهد", "summary_fa": "مصاحبه کامل ما با استوارت پرایس، همکار مدونا را در مورد جادوی استودیو بخوانید که منجر به بازگشت او به پیست رقص 2005 Confessions on a Dance Floo r در جاده ها شد، پس از آن که تهیه کننده استوارت پرایس به عنوان کارگردان موسیقی مدونا در دو تور خدمت کرد: 2001 Drown World Tour و Tour 20. به اندازه کافی، پرایس و مدونا قبل از ساختن آلبوم دنباله‌دار امسال، Confessions II، همکاری خود را با یک سفر دیگر، تور جشن 2023–24 تمدید کردند. پس از اینکه پرایس به مدونا کمک کرد موسیقی آن تور را شکل دهد، مدونا در نهایت با او تماس گرفت تا به استودیو برگردد، همانطور که او در مصاحبه خود در پادکست Rolling Stone Music Now توضیح می دهد. در این مصاحبه، پرایس عمیقاً به ساخت یکی از بهترین آلبوم‌های سال می‌پردازد، از میکس‌تیپ‌ها و تأثیرات خانه‌ای که صدای آن را شکل داده تا مدونا در ترکیب بی‌باکانه رویدادهای زندگی شخصی‌اش در آهنگ‌نویسی، و همچنین به همکاری‌های زنده این زوج می‌پردازد. می‌توانید یک نسخه فشرده از مصاحبه زیر را بخوانید، یا به پادکست‌های اپل یا Spotify گوش دهید (یا فقط پخش را در بالا فشار دهید). آیا در طول تور جشن شروع به صحبت در مورد ساخت موسیقی جدید کردید؟ خیر تور جشن اولین باری بود که برای مدتی با هم کار کردیم، اما کار بر روی نمایش ها، کار کردن به صورت زنده در واقع منشأ شروع همکاری خلاقانه ما [در وهله اول] بود. در ابتد es Misquoted Her. The Reporter Speaks Out After ‘You Can See Everything’ Release: ‘I Wish I’d Kept That Notebook’", "link": "https://variety.com/2026/film/news/elizabeth-holmes-new-york-times-quote-reporter-1236929661/", "summary": "In the documentary You Can See Everything, Elizabeth Holmes tries to convince Nathan Fielder that she was misquoted by The New York Times. “They’re not playing me. They’re playing a character I created,” the disgraced Theranos founder is quoted as saying in a 2023 profile. She was talking about actors portraying her in movies and [ ]", "date_str": "2026-10-23T16:12:59+00:00", "hash": "e2fe4bcc0d07936b", "title_fa": "الیزابت هلمز مدعی است که نیویورک تایمز به اشتباه از او نقل قول کرده است. گزارشگر پس از انتشار \"شما می توانید همه چیز را ببینید\" صحبت می کند: \"کاش آن دفترچه را نگه می داشتم\"", "summary_fa": "در مستند شما می توانید همه چیز را ببینید، الیزابت هلمز سعی می کند نیتن فیلدر را متقاعد کند که نیویورک تایمز به اشتباه از او نقل قول کرده است. بنیانگذار شرمنده Theranos در پروفایلی در سال 2023 گفته است: \"آنها من را بازی نمی کنند. آنها نقش شخصیتی را بازی می کنند که من خلق کردم.\" او در مورد بازیگرانی صحبت می کرد که او را در فیلم ها به تصویر می کشند و [ ] \"آنها نقش من را بازی نمی کنند. آنها نقش شخصیتی را بازی می کنند که من خلق کردم.\" او درباره بازیگرانی صحبت می‌کرد که او را در فیلم‌ها و برنامه‌های تلویزیونی به تصویر می‌کشند، مانند آماندا سیفرید در Hulus The Dropout. هولمز هنگام انتشار این قطعه با این نقل قول مخالفت کرد و استدلال کرد که آنچه او در واقع گفت این بود: \"آنها در حال بازی شخصیتی هستند که خودشان ساخته اند.\" داستان‌های مرتبط، کارگردان «ماسک»، الکس گیبنی تأیید می‌کند که یونیورسال در برنامه‌ریزی انتشار خارج از کشور متزلزل شده است، می‌گوید سعی کرده با ایلان ماسک مصاحبه کند: «پاسخ او نوشتن «گیبنی یک دوش است» بود. زیرا او معتقد است که این بحث به بحث بزرگتری می پردازد: آیا رسانه ها برنامه ای برای تحریف تصویر هولمز دارند یا اینکه هولمز در مورد اینکه او چگونه خود را به تصویر می کشد توهماتی دارد؟ محبوب در Variety مستند هیچ پاسخی به این سوال ارائه نمی دهد. بیلی ایوانز، شریک زندگی هولمز، در فیلم می گوید که مصاحبه او را با تایمز ضبط کرده است، اما نمی تواند شواهدی مبنی بر نقل قول اشتباه او نشان دهد. و یک کارت بین عنوانی در پایان فیلم می گوید که فیلدر و کارگردان همکارش لنس اوپنهایم توانستند به خبرنگار نیویورک تایمز برسند، که در کنار گزارش او ایستاده بود، اما مدرکی نیز در مورد", "image_url": "https://variety.com/wp-content/uploads/2026/10/MCDYOCA_EC127.jpg?crop=0px%2C457px%2C3000px%2C1688px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۱۹:۴۲"}, {"source": "Variety", "title": "Cinépolis Distribution Lands ‘5 More Minutes,’ a Time-Warping Thriller Starring ‘Talk to Her’ Lead Javier Cámara (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/cinepolis-mexico-distribution-latam-rights-5-more-minutes-1236921706/", "summary": "In a rare move, Mexico’s exhibition-distribution giant Cinépolis has landed Latin American rights to Spanish buzz title “5 More Minutes” (“5 Minutos Más”) starring Javier Cámara, who took home the Best Supporting Actor prize at the San Sebastian Film Festival. “We normally pick up only Mexican rights to films about 90% of the time but [ ]", "date_str": "2026-10-23T16:05:07+00:00", "hash": "a5b4f57eca69bff4", "title_fa": "Cinépolis Distribution Lands «5 Minutes More»، یک تریلر هولناک زمان با نقش اصلی «Talk To Her» خاویر کامارا (اختصاصی)", "summary_fa": "در اقدامی نادر، غول توزیع-نمایشگاهی مکزیک، سینه‌پولیس، حق امتیاز تبلیغاتی اسپانیایی «5 دقیقه بیشتر» («5 دقیقه دیگر») با بازی خاویر کامارا را در آمریکای لاتین دریافت کرد که جایزه بهترین بازیگر نقش مکمل مرد را در جشنواره فیلم سن سباستین به خانه برد. ما معمولاً در 90 درصد مواقع فقط حق فیلم‌ها را از مکزیک دریافت می‌کنیم، اما [ ] سومین غرفه‌دار بزرگ جهان، پس از AMC و واندا چین، تعهد خود را برای تقویت سینمای مکزیک از طریق بازوی توزیع 11 ساله‌اش تقویت می‌کند. آلخاندرو رامیرز، مدیر عامل Cinépolis می‌گوید از نظر تعداد پذیرش، از همه همتایان خود در سطح جهانی پیشی می‌گیرد، در اقدامی نادر،
