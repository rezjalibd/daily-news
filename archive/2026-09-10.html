ان تصویب کرد. این قطعنامه که پیش‌نویس آن توسط آمریکا و سه کشور اروپایی (بریتانیا، فرانسه و آلمان) ارائه شد، بر ادعای «عدم پایبندی» ایران به تعهدات پادمانی و حل‌نشدن مسائل مربوط به رد"}, {"source": "IranWire", "title": "ایران از سازمان ملل خواست اجرای تحریم‌های هوانوردی آمریکا را متوقف کند", "link": "https://iranwire.com/fa/news-1/157407-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%A7%D8%B2-%D8%B3%D8%A7%D8%B2%D9%85%D8%A7%D9%86-%D9%85%D9%84%D9%84-%D8%AE%D9%88%D8%A7%D8%B3%D8%AA-%D8%A7%D8%AC%D8%B1%D8%A7%DB%8C-%D8%AA%D8%AD%D8%B1%DB%8C%D9%85%D9%87%D8%A7%DB%8C-%D9%87%D9%88%D8%A7%D9%86%D9%88%D8%B1%D8%AF%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D8%B1%D8%A7-%D9%85%D8%AA%D9%88%D9%82%D9%81-%DA%A9%D9%86%D8%AF/", "summary": "جمهوری اسلامی ایران از سازمان ملل متحد خواسته است برای جلوگیری از اجرای تحریم‌های جدید آمریکا علیه بخش هوانوردی ایران مداخله کند.این در ...", "date_str": "2026-09-10T07:36:42+00:00", "hash": "15f98dad7df558d2", "title_fa": "ایران از سازمان ملل خواست اجرای تحریم‌های هوانوردی آمریکا را متوقف کند", "summary_fa": "جمهوری اسلامی ایران از سازمان ملل متحد خواسته است برای جلوگیری از اجرای تحریم‌های جدید آمریکا علیه بخش هوانوردی ایران مداخله کند. این درخواست در نامه معاون نمایندگی دائم جمهوری اسلامی در نیویورک به «آنتونیو گوترش»، دبیرکل سازمان ملل، و رییس دوره‌ای شورای امنیت مطرح شده است. نمایندگی جمهوری اسلامی تحریم ۲۷ شرکت هواپیمایی ایران را مصداق «تروریسم اقتصادی»، «مجازات جمعی» و «جنایت علیه بشریت» خوانده و مدعی شده است این اقدامات با منشور ملل متحد و اصول بنیادین حقوق بین‌الملل مغایرت دارند. در این نامه از دبیرکل سازمان ملل و رییس شورای امنیت خواسته شده است از دولت‌های عضو بخواهند تحریم‌های جدید آمریکا را به رسمیت نشناسند و از اجرای آن‌ها خودداری کنند. جمهوری اسلامی همچنین هشدار داده است که تحریم صنعت هوانوردی می‌تواند پیامدهای بشردوستانه گسترده‌ای برای شهروندان ایرانی داشته باشد. مقام‌های آمریکایی تاکنون به این نامه واکنش نشان نداده‌اند. وزارت خزانه‌داری آمریکا روز سه‌شنبه ۱۷ شهریور ۱۴۰۵ نام ۳۶ فرد و شرکت مرتبط با صنعت هوانوردی ایران، از جمله ۲۷ شرکت هواپیمایی، را به فهرست تحریم‌های خود اضافه کرد."}, {"source": "IranWire", "title": "ترامپ: شاید لازم شود به کوه کلنگ حمله کنیم؛ ایران بامزه‌بازی نکند", "link": "https://iranwire.com/fa/news-1/157408-%D8%AA%D8%B1%D8%A7%D9%85%D9%BE-%D8%B4%D8%A7%DB%8C%D8%AF-%D9%84%D8%A7%D8%B2%D9%85-%D8%B4%D9%88%D8%AF-%D8%A8%D9%87-%DA%A9%D9%88%D9%87-%DA%A9%D9%84%D9%86%DA%AF-%D8%AD%D9%85%D9%84%D9%87-%DA%A9%D9%86%DB%8C%D9%85-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%A8%D8%A7%D9%85%D8%B2%D9%87%D8%A8%D8%A7%D8%B2%DB%8C-%D9%86%DA%A9%D9%86%D8%AF/", "summary": "دونالد ترامپ، رییس‌جمهوری آمریکا، جمهوری اسلامی را به حمله احتمالی دیگری علیه تاسیسات هسته‌ای تهدید کرد و گفت ممکن است لازم باشد آمریکا ...", "date_str": "2026-09-10T07:41:35+00:00", "hash": "d2782332fff714cb", "title_fa": "ترامپ: شاید لازم شود به کوه کلنگ حمله کنیم؛ ایران بامزه‌بازی نکند", "summary_fa": "دونالد ترامپ، رییس‌جمهوری آمریکا، جمهوری اسلامی را به حمله احتمالی دیگری علیه تاسیسات هسته‌ای تهدید کرد و گفت ممکن است لازم باشد آمریکا سایت زیرزمینی موسوم به «کوه کلنگ» در استان اصفهان را هدف قرار دهد. ترامپ روز چهارشنبه ۱۸ شهریور ۱۴۰۵ در کنوانسیون میان‌دوره‌ای کمیته ملی جمهوری‌خواهان در دالاس گفت گزارش‌هایی درباره مشاهده فعالیت در این سایت دریافت کرده است. او گفت: «ممکن است لازم باشد ضربه‌ای هم به کوه کلنگ بزنیم، چون کسی گفته است کمی فعالیت در آنجا دیده شده است.» رییس‌جمهوری آمریکا سپس خطاب به جمهوری اسلامی هشدار داد: «توصیه می‌کنم آنجا بامزه‌بازی درنیاو‌رند، چون مجبور خواهیم شد به‌شدت به آن‌ها ضربه بزنیم. چاره دیگری نداریم.» ترامپ مدرکی درباره ماهیت فعالیت‌های ادعایی در کوه کلنگ ارائه نکرد. مقام‌های جمهوری اسلامی نیز تاکنون به اظهارات تازه او واکنش نشان نداده‌اند. کوه کلنگ نام مجموعه‌ای زیرزمینی در نزدیکی تاسیسات هسته‌ای نطنز است. تصاویر ماهواره‌ای طی سال‌های گذشته از ساخت تونل‌ها و تاسیسات زیرزمینی در این منطقه حکایت داشته‌اند، اما جزئیات فعالیت‌های انجام‌شده در آن به‌طور عمومی مشخص نیست."}, {"source": "IranWire", "title": "گرانی خدمات پزشکی دسترسی زنان به مراقبت‌های پیشگیرانه را محدودتر کرد", "link": "https://iranwire.com/fa/news-1/157414-%DA%AF%D8%B1%D8%A ع شد؛ هزاران ماهی مردند", "summary_fa": "در پی کاهش خروجی سد زاینده‌رود و قطع ناگهانی جریان آب در بخش‌های پایین‌دست این رودخانه، هزاران قطعه ماهی و آبزی در حوضچه‌ها و مانداب‌های باقی‌مانده تلف شدند. جریان آب زاینده‌رود پس از ۹۴ روز، از بامداد ۱۵ شهریور ۱۴۰۵ و هم‌زمان با کاهش خروجی سد، در بخش‌های پایین‌دست متوقف شد. قطع ناگهانی آب باعث شد شمار زیادی از ماهیان و بچه‌ماهیان در مانداب‌های کم‌عمق و زیر تابش شدید آفتاب گرفتار شوند. حسین اکبری، معاون محیط‌زیست طبیعی و تنوع زیستی اداره‌کل حفاظت محیط‌زیست استان اصفهان، باز و بسته‌کردن پیاپی جریان آب را از عوامل اصلی تخریب تنوع زیستی زاینده‌رود دانست. او گفت ماهیان همراه جریان آب از بالادست وارد بستر رودخانه می‌شوند، اما با قطع ناگهانی آب در هوای گرم، در حوضچه‌های باقی‌مانده گرفتار می‌شوند و بخش قابل‌توجهی از آن‌ها از بین می‌روند. این مقام محیط‌زیست، شرکت آب منطقه‌ای اصفهان را مسئول پیامدهای این شیوه مدیریت دانست و خواستار برقراری جریانی حداقلی و دائمی در زاینده‌رود شد. به گفته اکبری، جریان ۹۴روزه آب به تغذیه منابع زیرزمینی، کاهش گردوغبار، جلوگیری از تشدید فرونشست و حفظ فضای سبز حاشیه رودخانه کمک کرده بود."}, {"source": "IranWire", "title": "مجتبی باباخانی، معترض دی‌ماه، در یورش نیروهای سپاه به مخفیگاهش جان باخت", "link": "https://iranwire.com/fa/news-1/157426-%D9%85%D8%AC%D8%AA%D8%A8%DB%8C-%D8%A8%D8%A7%D8%A8%D8%A7%D8%AE%D8%A7%D9%86%DB%8C-%D9%85%D8%B9%D8%AA%D8%B1%D8%B6-%D8%AF%DB%8C%D9%85%D8%A7%D9%87-%D8%AF%D8%B1-%DB%8C%D9%88%D8%B1%D8%B4-%D9%86%DB%8C%D8%B1%D9%88%D9%87%D8%A7%DB%8C-%D8%B3%D9%BE%D8%A7%D9%87-%D8%A8%D9%87-%D9%85%D8%AE%D9%81%DB%8C%DA%AF%D8%A7%D9%87%D8%B4-%D8%AC%D8%A7%D9%86-%D8%A8%D8%A7%D8%AE%D8%AA/", "summary": "«مجتبی باباخانی»، جوان کُرد اهل مهران و از معترضان دی‌ماه ۱۴۰۴، بامداد چهارشنبه ۱۸ شهریور ۱۴۰۵، در جریان یورش نیروهای سپاه پاسداران به م ...", "date_str": "2026-09-10T12:14:48+00:00", "hash": "8be7db88c1f32816", "title_fa": "مجتبی باباخانی، معترض دی‌ماه، در یورش نیروهای سپاه به مخفیگاهش جان باخت", "summary_fa": "«مجتبی باباخانی»، جوان کُرد اهل مهران و از معترضان دی‌ماه ۱۴۰۴، بامداد چهارشنبه ۱۸ شهریور ۱۴۰۵، د نی تغذیه انسان پوتسدام‌‌ــ‌ رهبروکه (DIfE) و بیمارستان دانشگاهی شاریته برلین دریافتند که طولانی‌تر کردن بازدم تغییرپذیری ضربان قلب را افزایش می‌دهد و مغز را به پاداش‌ها حساس‌تر می‌کند؛ تغییراتی که با انتخاب‌های جسورانه‌تر ارتباط داشت. نتایج این پژوهش در نشریه علمی «نورون» (Neuron) منتشر شد. تنفس سریع و افزایش ضربان قلب اغلب با تصمیم‌گیری شتاب‌زده ارتباط دارند. افراد ممکن است هنگام قرار گرفتن تحت فشار، برای اجتناب از زیان، محتاط‌تر شوند؛ خواه در حال سرمایه‌گذاری باشند، با موقعیتی پرتنش در محیط کار روبه‌رو شوند یا ناچار باشند غذایی را با عجله انتخاب کنند. در مقابل، تنفس آهسته‌تر و آرام‌تر بودن وضعیت قلبی‌‌ــ‌عروقی ممکن است به ارزیابی مثبت‌تر پیامدهای احتمالی بینجامد و افراد را به خطرپذیری بیشتر ترغیب کند. تنفس چگونه بدن و مغز را به یکدیگر پیوند می‌دهد؟ تصمیم‌گیری عمدتا فرایندی مغزمحور تلقی می‌شود، اما پژوهش جدید احتمال گسترده‌تری را بررسی کرد: اینکه آیا پیام‌های ارسالی از دیگر بخش‌های بدن هم می‌توانند فعالیت مغز را تغییر دهند و بر انتخاب‌های انسان اثر بگذارند؟ این مطالعه به سرپرستی پروفسور سویونگ کیو پارک و با همکاری پژوهشگرانی از چند موسسه علمی انجام شد. پارک در توضیح پرسش اصلی پژوهش می‌گوید: «ما به‌ندرت فقط بر اساس اطلاعات بیرونی تصمیم می‌گیریم و قضاوت ما در واقع حاصل تعامل میان فرایندهای شناختی و وضعیت کنونی بدنمان است. پیش‌تر مشخص نبود که کنترل آگاهانه بدن، برای مثال از طریق تنفس هدفمند، چگونه می‌تواند فرایند تصمیم‌گیری ما را فعالانه کنترل کند.» بررسی تاثیر بازدم طولانی‌تر بر تصمیم‌گیری پژوهشگران ۴۱ فرد سالم را در حالی بررسی کردند که تحت شرایط تنفسی کاملا کنترل‌شده، تصمیم‌هایی همراه با خطر می‌گرفتند. شرکت‌کنندگان از دستورالعمل‌های تصویری تنفس پیروی می‌کردند، به این صورت که یا با ضرباهنگ معمول خود نفس می‌کشیدند یا سرعت تنفسشان را کاهش می‌دادند و مرحله بازدم را طولانی‌تر می‌کردند. نسبت زمانی دم به بازدم در حالت دوم، ۲ به ۸ بود. هنگامی که شرکت‌کنندگان مجموعه‌ای از تصمیم‌های مرتبط با خطر را می‌گرفتند، گروه پژوهشی چند جنبه از واکنش‌های جسمی و عصبی آنان را اندازه‌گیری کرد. به این صورت که با استفاده از تصویربرداری تشدید مغناطیسی کارکردی یا اف‌ام‌آر‌آی، فعالیت مغز را ثبت ا روشن است که او در حال حاضر در کانون تحولات قرار ندارد.»"}, {"source": "Euronews Persian", "title": "۳ هزار پهپاد در یادبود ۱۱ سپتامبر آسمان نیویورک را روشن کردند", "link": "https://parsi.euronews.com/video/2026/09/10/3000-drones-light-up-new-york-skyline-in-911-tribute", "summary": "در آزمایش یک مراسم بزرگداشت ۱۱ سپتامبر که قرار است در سال ۲۰۲۶ و در بیست‌وپنجمین سالگرد حملات برگزار شود، نزدیک به ۳۰۰۰ پهپاد آسمان شب نیویورک را روشن کردند.", "date_str": "2026-09-10T13:33:05+00:00", "hash": "ea68331473f966db", "title_fa": "۳ هزار پهپاد در یادبود ۱۱ سپتامبر آسمان نیویورک را روشن کردند", "summary_fa": "نزدیک به ۳ هزار پهپاد در جریان آزمایش نمایش نورپردازی «ادای احترام در نور» پیش از بیست و پنجمین سالگرد حملات ۱۱ سپتامبر، خط افق نیویورک را روشن کردند. این پهپادها با آرایش‌های متغیر آسمان شب شهر را پر کردند. در مجموع ۲۹۷۷ منبع نور استفاده خواهد شد؛ عددی برابر با شمار افرادی که در حملات ۱۱ سپتامبر ۲۰۰۱ کشته شدند. پهپادها به عنوان بخشی از مراسم سالانه یادبود الگوهایی را بر فراز نیویورک شکل می‌دهند. این آزمایش پیش‌نمایی از ادای احترامی است که برای بیست و پنجمین سالگرد برنامه‌ریزی شده است. این سالگرد در ۱۱ سپتامبر ۲۰۲۶ گرامی داشته خواهد شد. این نورپردازی یاد کسانی را که در این حملات جان باختند گرامی می‌دارد و خاطره آنها را در سراسر خط افق نیویورک زنده نگه می‌دارد."}, {"source": "Euronews Persian", "title": "آیا «سپر دموکراسی» اتحادیه اروپا ابزاری برای مهندسی انتخابات ریاست‌جمهوری فرانسه است؟", "link": "https://parsi.euronews.com/my-europe/2026/09/10/no-the-eu-democracy-shield-isnt-a-trojan-horse-to-rig-the-french-presidential-election", "summary": "هم‌زمان با آماده شدن پارلمان اروپا برای بررسی «سپر دموکراسی اتحادیه اروپا» ادعاهای گمراه‌کننده‌ای درباره این طرح در فضای مجازی منتشر شده است. سپر دموکراسی مجموعه‌ای از اقدامات اتحادیه اروپاست که با هدف حفاظت از روندهای دموکراتیک و نهادهای سیاسی در کشورهای عضو طراحی شده است.", "date_str": "2026-09-10T13:30:31+00:00", "hash": "6d64db1b07764a2a", "title_fa": "آیا «سپر دموکراسی» اتحادیه اروپا ابزاری برای مهندسی انتخابات ریاست‌جمهوری فرانسه است؟", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! هم‌زمان با آماده شدن پارلمان اروپا برای بررسی «سپر دموکراسی اتحادیه اروپا» ادعاهای گمراه‌کننده‌ای درباره این طرح در فضای مجازی منتشر شده است. سپر دموکراسی مجموعه‌ای از اقدامات اتحادیه اروپاست که با هدف حفاظت از روندهای دموکراتیک و نهادهای سیاسی در کشورهای عضو طراحی شده است. چرا برخی جریان‌های منتقد اتحادیه اروپا به این طرح حمله می‌کنند؟ بخشی از پاسخ ممکن است به تقویت شبکه اروپایی راستی‌آزمایی و مقابله با اطلاعات نادرست مربوط باشد. برخی کاربران و چهره‌های سیاسی مدعی شده‌اند که این سازوکار ممکن است برای «باطل کردن» نتایج انتخاباتی‌ به کار رود که مورد پسند بروکسل نیست؛ حتی در برخی ادعاها گفته شده که اتحادیه اروپا می‌تواند در انتخابات ریاست‌جمهوری سال ۲۰۲۷ فرانسه مداخله کند. این ادعاها مبنای حقوقی ندارد زیرا اتحادیه اروپا اساسا اختیار تغییر یا لغو نتایج انتخابات ملی در کشورهای عضو را ندارد. حالا این ادعا‌ها که اولین‌بار در سال ۲۰۲۵ در فضای مجازی مطرح شد، اخیرا بار دیگر از سوی فلوریان فیلیپو، رهبر حزب ملی‌گرای «میهن‌پرستان» فرانسه بازنشر شده است. آقای فیلیپو در ویدیویی در یوتیوب و در واکنش به برخی بخش‌های طرح سپر دموکراسی گفت این بسته مقابله با اطلاعات نادرست «می‌تواند به ابطال روند انتخابات در همه کشورهای اتحادیه اروپا از جمله انتخابات ریاست‌جمهوری ۲۰۲۷ فرانسه منجر شود؛ مشابه اتفاقی که در رومانی افتاد.» حزب میهن‌پرستان فرانسه در حال حاضر هیچ کرسی‌ در پارلمان این کشور ندارد اما رهبر آن در شبکه‌های اجتماعی مخاطبان قابل‌توجهی دارد و تنها در یوتیوب نزدیک به ۷۰۰ هزار نفر کانال او را دنبال می‌کنند."}, {"source": "Euronews Persian", "title": "نمایشگاه «شب» ماوریتزیو کاتلان در برلین گشایش یافت", "link": "https://parsi.euronews.com/video/2026/09/10/maurizio-cattelans-night-exhibition-opens-in-berlin", "summary": "نمایشگاه «شب» ماوریسیو کاتلان در برلین افتتاح شده‌است که در آن مجسمه هیتلر، اسب فرسوده و آثاری درباره قدرت و تردید به‌نمایش درآمده‌است.", "date_str": "2026-09-10T1 جام‌خواهی چه پیامدی می‌تواند برای خلیفه و سایر متهمان داشته باشد. یورونیوز این موضوع را بررسی کرده است. قانون مواد مخدر مصر برای برخی از جدی‌ترین جرایم مرتبط با مواد مخدر مجازات اعدام در نظر گرفته است در حالی که نگهداری ساده برای مصرف شخصی چنین مجازاتی ندارد. بر اساس ماده ۳۳، مجازات اعدام می‌تواند برای جرایمی از جمله واردات مواد مخدر بدون مجوز، تولید آنها برای قاچاق و تشکیل، اداره یا عضویت در یک باند قاچاق مواد مخدر اعمال شود."}, {"source": "Euronews Persian", "title": "حوثی‌ها شهر بندری دریای سرخ را در پیشروی به سوی باب‌المندب گرفتند", "link": "https://parsi.euronews.com/2026/09/10/houthis-seize-red-sea-port-city-in-a-push-to-capture-bab-el-mandeb", "summary": "تازه‌ترین عملیات هجومی حوثی‌ها با هدف بازآفرینی محاصره تنگه هرمز و به اجرا گذاشتن آن در تنگه باب‌المندب انجام می‌شود و شهرها و جزایر ساحلی دریای سرخ از اهداف بعدی آن‌ها است.", "date_str": "2026-09-10T12:10:41+00:00", "hash": "d7ad6d95f807b3ec", "title_fa": "حوثی‌ها شهر بندری دریای سرخ را در پیشروی به سوی باب‌المندب گرفتند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! تازه‌ترین عملیات هجومی حوثی‌ها با هدف بازآفرینی محاصره تنگه هرمز و به اجرا گذاشتن آن در تنگه باب‌المندب انجام می‌شود و شهرها و جزایر ساحلی دریای سرخ از اهداف بعدی آن‌ها است. چهار منبع نظامی دولت یمن به خبرگزاری رویترز اعلام کردند که نیروهای انصارالله که به شورشیان حوثی‌ معروف هستند، روز پنجشنبه کنترل شهر بندری تاریخی «مخا» را در دست گرفتند. شاهدان عینی دیده‌اند نیروهای حوثی هنگام ورود به شهر شعار «مرگ بر آمریکا، مرگ بر اسرائیل» سر می‌دهند. این شهر که در کنترل دولت به‌رسمیت‌شناخته‌شده یمن بود، از اوایل ماه اوت زیر حملات مداوم قرار داشت و در عرض چند روز بیش از ۲۵ موشک به آن شلیک شد و فعالیت بندر را متوقف کرد. این اقدام نفوذ حوثی‌ها بر تنگه راهبردی باب‌المندب، یکی از مهم‌ترین مسیرهای کشتیرانی جهان، را بیش از پیش افزایش می‌دهد. منابع دولت به‌رسمیت‌شناخته‌شده یمن به رویترز گفتند حوثی‌ها حملات خود را به جزایر راهبردی «حنیش» در دریای سرخ نیز آغاز کرده‌اند. نیروهای دولتی یمن و متحدان آن‌ها در حال جابه‌جایی به سمت جنوب و شهرستان «ذباب» هستند که درست در مجاورت تنگه باب‌المندب و در مقابل جزیره «پریم» قرار دارد. دولت یمن هنوز سقوط مخا را به طور رسمی تایید نکرده است. حوثی‌ها که حدود یک‌سوم از خاک یمن را در اختیار دارند، یعنی پرجمعیت‌ترین بخش‌های کشور، در تلاش‌اند این آبراهه باریک را تصرف کنند و احتمالا آن را مختل کنند. به همراه هرمز، تردد محموله‌ها از تنگه باب‌المندب حدود یک‌چهارم جابه‌جایی روزانه نفت و نفت خام و نزدیک به یک‌سوم تجارت دریایی جهان را شامل می‌شود."}, {"source": "Euronews Persian", "title": "ایلان ماسک: اینترنت می‌تواند مردم را از فقر نجات دهد", "link": "https://parsi.euronews.com/2026/09/10/elon-musk-to-save-people-from-poverty-connect-them-to-the-internet", "summary": "ایلان ماسک، کارآفرین و میلیاردر آمریکایی روز چهارشنبه با بازنشر ویدیویی از سخنرانی خود که در مجمع اقتصادی قطر در ۲۰ مه ۲۰۲۵ میلادی ایراد کرده بود، بار دیگر «اتصال به اینترنت» را کلیدی‌ترین راه مبارزه با فقر در سراسر جهان اعلام کرد.", "date_str": "2026-09-10T12:04:58+00:00", "hash": "e07ae1e1c9e68bd4", "title_fa": "ایلان ماسک: اینترنت می‌تواند مردم را از فقر نجات دهد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp ایلان ماسک، کارآفرین و میلیاردر آمریکایی روز چهارشنبه با بازنشر ویدیویی از سخنرانی خود که در مجمع اقتصادی قطر در ۲۰ مه ۲۰۲۵ میلادی ایراد کرده بود، بار دیگر «اتصال به اینترنت» را کلیدی‌ترین راه مبارزه با فقر در سراسر جهان اعلام کرد. تو همچنین در پیامی نوشت: «با اتصال به اینترنت، می‌توانید هر چیزی یاد بگیرید و محصولات خود را به یک بازار جهانی بفروشید که باعث رونق می‌شود.» ماسک در این ویدئو می‌گوید: «ما می‌توانیم اینترنت ارزان و پرسرعت را برای آن بخشی از جهان فراهم کنیم که اینترنت ندارند یا برایشان بسیار گران است. من فکر می‌کنم که تنها کار بزرگی که می‌توانید برای نجات مردم از فقر انجام دهید و به آنها کمک کنید، این است که آنها را به اینترنت وصل کنید.» او می‌افزاید: «زیرا وقتی به اینترنت وصل شدید، می‌توانید هرچیزی را که بخواهید بصورت رایگان بیاموزید، می‌توانید تولیدات و خدماتتان را به بازارهای جهانی بفروشید.» ماسک سپس به توانمندی‌های اینترنتی شرکت اسپیس ایکس در استقرار ماهواره‌های جهانی می‌پردازد و می‌گوید که این شرکت سهم قابل توجهی از پرتاب‌های فضایی و ماهواره‌های فعال در مدار را به خود اختصاص داده است. به گفته ماسک، تقریبا ۹۰ درصد از پرتاب‌های انبوه به مدار توسط اسپیس ایکس انجام شده است و حدود ۸۰ درصد از کل ماهواره‌های فعال در فضا نیز متعلق به اسپیس ایکس هستند. او می‌افزاید که گستردگی فعالیت ماهواره‌های اسپیس ایکس اجازه می‌دهد تا اتصال با پهنای باند بالا در بیشتر نقاط جهان ممکن شود."}, {"source": "Euronews Persian", "title": "فیلم هفته فرهنگ یورونیوز: «Oasis: Don't Look Back in Anger»؛ حماسی یا فرصت سوخته؟", "link": "https://parsi.euronews.com/culture/2026/09/10/euronews-cultures-film-of-the-week-oasis-dont-look-back-in-anger-biblical-or-a-missed-oppo", "summary": "این مستند به عنوان روایت شاد از تور لایو ۲۵ خوب عمل می‌کند، اما آشتی برادران گلگر و دلیل پدیده شدن دورهمی ۲۰۲۵ را جدی بررسی نمی‌کند.", "date_str": "2026-09-10T11:58:01+00:00", "hash": "758d7aa1b1316bb8", "title_fa": "فیلم هفته فرهنگ یورونیوز: «Oasis: Don't Look Back in Anger»؛ حماسی یا فرصت سوخته؟", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp این مستند به عنوان روایت شاد از تور لایو ۲۵ خوب عمل می‌کند، اما آشتی برادران گلگر و دلیل پدیده شدن دورهمی ۲۰۲۵ را جدی بررسی نمی‌کند. اعتراف می‌کنم که وقتی برای دیدن Oasis: Don’t Look Back In Anger راهی سالن شدم، خیلی هم madferit نبودم. از وقتی بازگشت دوباره و تیترساز اوئیسیس و بعد ۴۱ اجرای استادیومی این گروه در ۱۴ کشور طی سال گذشته رقم خورد، دیگر سهمیه‌ام از گالاگرها پر شده است. جدا از بت‌سازی هواداران که باعث می‌شود فکر کنم مردم در مورد اوئیسیس کاملا حس تناسب و دید انتقادی را از دست داده‌اند، انتشار مستندی که قرار است همه این ماجرا را ثبت کند، بیشتر بوی یک کمپین تبلیغاتی طولانی می‌دهد؛ مرحله بعدی در کودتای پول‌سازی مداومی درباره دو برادر پرحرف و تازه آشتی‌کرده‌ای که ۱۸ سال است هیچ اثر تازه‌ای منتشر نکرده‌اند. با این حال، باید همراه جریان رفت و من هم وقت گذاشتم و به نمایش ویژه آی‌مکس مستند ویل لاولیس و دیلن ساوتِرن رفتم و تقریبا قانع‌شده از سالن بیرون آمدم. به‌عنوان یک فیلم کنسرتی پرانرژی و نامه عاشقانه‌ای خطاب به هواداران اوئیسیس، Don’t Look Back In Anger در بسیاری چیزها موفق است و سرخوشی‌ای را که این گروه با بازگشت غیرمنتظره‌اش ایجاد کرده، به‌خوبی ثبت می‌کند. این موفقیت پیش از هر چیز مدیون طراحی صدای The Zone of Interest ، تارن ویلرز و جیمز مثر، فیلم‌برداری چشمگیر هاریس زامبارلوکوس و تدوین خوش‌ریتم جورج کراگ و مارتینا زامولو است. استعدادهای آن‌ها به شکلی درخشان هم‌دست می‌شوند تا این بازگشت واقعا تاثیرگذار و گاه حتی هیجان‌انگیز به نظر برسد. اما به‌عنوان روایت معناداری از این که این بازگشت چطور شکل گرفت و چه معنا و نمادی دارد، چندان هم در حد کتاب مقدس نیست."}, {"source": "Euronews Persian", "title": "تعطیلی‌های بی‌سابقه فرودگاه‌های روسیه؛ «دوران امنیت به پایان رسیده است»", "link": "https://parsi.euronews.com/2026/09/10/russian-airports-closures", "summary": "حملات پهپادی اوکراین باعث شد در ۳۲ فرودگاه روسیه، از جمله فرودگاه‌های مسکو و سن‌پترزبورگ، روزانه به‌طور متوسط ۳۲ بار فعالیت این فرودگاه‌ها متوقف شود. به این ترتیب مجموع تعطیلی‌های فرودگاه‌های روسیه از تابستان تاکنون از کل رقم ثبت‌شده در سال ۲۰۲۵ فراتر رفته است.", "date_str": "2026-09-10T11:44:30+00:00", "hash": "859756ff38c3471d", "title_fa": "تعطیلی‌های بی‌سابقه فرودگاه‌های روسیه؛ «دوران امنیت به پایان رسیده است»", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp حملات پهپادی اوکراین باعث شد در ۳۲ فرودگاه روسیه، از جمله فرودگاه‌های مسکو و سن‌پترزبورگ، روزانه به‌طور متوسط ۳۲ بار فعالیت این فرودگاه‌ها متوقف شود. به این ترتیب مجموع تعطیلی‌های فرودگاه‌های روسیه از تابستان تاکنون از کل رقم ثبت‌شده در سال ۲۰۲۵ فراتر رفته است. فرودگاه‌های روسیه در ماه اوت گذشته ۹۹۳ بار یعنی به‌طور میانگین ۳۲ بار در روز به‌طور موقت تعطیل شدند. عملیات پهپادی ا رامپ، رئیس جمهوری آمریکا روز چهارشنبه وعده داد در صورتی که جمهوری‌خواهان در انتخابات میان‌دوره‌ای بتوانند کنترل مجلس نمایندگان و مجلس سنا را حفظ کنند، به هر بزرگسال آمریکایی ۵ هزار دلار پرداخت خواهد کرد. به گزارش آسوشیتدپرس، به نظر می‌رسد که این پیشنهاد غیرمعمول تلاشی برای نجات وضعیت رو به افول محبوبیت حزب جمهوری‌خواه در آستانه انتخابات باشد. اجرای این وعده بحث‌برانگیز احتمالا بیش از یک تریلیون دلار هزینه خواهد داشت و به تایید کنگره نیاز دارد. این طرح همچنین موجب خواهد شد تا کسری سالانه بودجه نزدیک به ۱.۸ تریلیون دلاری آمریکا بیش از پیش افزایش یابد و نگرانی‌ها درباره تورم تشدید شود. آقای ترامپ روز چهارشنبه در جریان گردهمایی جمهوری‌خواهان برای انتخابات میان‌دوره‌ای در دالاس تگزاس گفت: «اگر جمهوری‌خواهان پیروز شوند، شما هم همراه ما پیروز می‌شوید و ۵ هزار دلار دریافت می‌کنید.» او افزود: «نام آن را سود سهام ترامپ خواهیم گذاشت.» او این پرداخت‌ها را به سودی تشبیه کرد که یک شرکت میان سهامداران خود توزیع می‌کند و دلیل آن را «قدرت و موفقیت اقتصادی عظیم ما» دانست. هنوز یک ساعت از این صحبت نگذشته بود که جی‌دی ونس، معاون رئیس جمهوری آمریکا، ظاهرا تلاش کرد دست‌کم بخشی از پیشنهاد آقای ترامپ را تعدیل کند و گفت افراد ثروتمند مشمول این پرداخت‌ها نخواهند بود. آقای ونس همچنین این ایده را هم مطرح کرد که هزینه این پرداخت‌ها می‌تواند از محل درآمدهای تعرفه‌ای آمریکا تامین شود، حال آنکه مبلغ پیشنهادی آقای ترامپ بسیار بیشتر از درآمدی است که آمریکا از این اقدامات حمایت‌گرایانه به دست آورده"}, {"source": "Euronews Persian", "title": "سود ترامپ: هزینه و پوشش چک ۵ هزار دلاری", "link": "https://parsi.euronews.com/business/2026/09/10/the-trump-dividend-what-5000-would-cost-and-what-it-could-cover", "summary": "سود سهام ۵ هزار دلاریِ پیشنهادی ترامپ چه چیزی می‌تواند بخرد و آیا آمریکا توان تامین هزینه برآورد شده ۱.۲ تریلیون دلاری آن را دارد؟", "date_str": "2026-09-10T10:54:32+00:00", "hash": "821a2204fcb9c10c", "title_fa": "سود ترامپ: هزینه و پوشش چک ۵ هزار دلاری", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram mary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp هواپیمای «هکلا اورورا» شرکت ایسلندایر، یک بوئینگ ۷۵۷-۲۰۰ که از ۲۰۱۴ با طرح بدنه خیره‌کننده‌اش دیدبانان هواپیما را خوشحال کرده بود، در اکتبر پارسال از خدمت خارج شد. از هواپیمای Hello Kitty شرکت EVA Air تا جت با طرح Super Mario شرکت JetBlue، علاقه‌مندان هوانوردی ـ و اگر بخواهیم صادق باشیم، تقریبا همه ـ طرح‌های ویژه بدنه‌ هواپیما را دوست دارند. در طول سال ها یکی از شناخته‌شده‌ترین این طرح‌ها هواپیمای Hekla Aurora (منبع به زبان انگلیسی) شرکت ایسلندایر بود؛ بوئینگ ۷۵۷-۲۰۰ که در سال ۲۰۱۴ با طرحی الهام‌گرفته از Northern Lights رنگ آمیزی شد. هنرمندان با استفاده از تکنیک‌های پیچیده ایربراش شفق شمالی را روی بدنه بازآفرینی کردند و این هواپیما تا ۱۲ اکتبر سال گذشته در سرویس بود. اکنون ایسلندایر با Aviationtag (منبع به زبان انگلیسی) همکاری کرده تا پوسته بدنه این هواپیما را بردارد و آن را به مجموعه‌ای محدود از جاکلیدی تبدیل کند. ایسلندایر در توضیح این اقدام در شبکه‌های اجتماعی نوشت: «سال گذشته یکی از محبوب‌ترین اعضای ناوگانمان را بدرقه کردیم؛ Hekla Aurora، بوئینگ ۷۵۷ که به رنگ‌های شفق قطبی نقاشی شده بود.» ایسلندایر افزود: «خداحافظی با چنین زیبایی کار آسانی نبود، به همین دلیل با Aviationtag همکاری کردیم تا طرح بدنه هواپیما را حفظ کنیم.»"}, {"source": "Euronews Persian", "title": "برخورد پهپاد تهاجمی روسیه با هواپیمای زلنسکی؛ نگاهی به خط زمانی حادثه و تدابیر اوکراین برای مقابله", "link": "https://parsi.euronews.com/my-europe/2026/09/10/timeline-russian-drone-collides-zelensky-plane-in-moldova", "summary": "آخرین نفوذ پهپاد روسیه به حریم هوایی مولداوی و ناتو در شرایطی رخ داده است که مسکو به‌طور فزاینده‌ای از پهپادهای تهاجمی جت‌موتور استفاده می‌کند، پهپادهایی که مرز میان پهپادهای متعارف و موشک‌های کروز ارزان را کمرنگ و رهگیری آنها را بسیار دشوار کرده است.", "date_str": "2026-09-10T10:28:35+00:00", "hash": "9360d8b3b2cf7108", "title_fa": "برخورد پهپاد تهاجمی روسیه با هواپیمای زلنسکی؛ نگاهی به خط زمانی حادثه و تدابیر اوکراین برای مقابله", . این هیئت باستان‌شناسی به سرپرستی یک مصرشناس اسپانیایی به نام «خوسپ سرویو» موفق شدند در گورستان سقاره در جنوب‌غرب قاهره، مقبره‌ای «چشمگیر و زیبا» متعلق به اواخر «دودمان پنجم مصر در دوره پادشاهی کهن»، مربوط به سال‌های ۲۴۹۴ تا ۲۳۴۵ پیش از میلاد را کشف کنند. این کشف در جریان کاوش‌های تابستان امسال و به سرپرستی دانشگاه خودگردان بارسلونا (UAB) و شورای عالی آثار باستانی مصر انجام شد. این بنا شامل یک مصطبه (سکو) با دو عبادتگاه تدفینی است که یونمن (Yunmen)، یکی از مقام‌های ارشد در دوران فرعون «جِدکارع ایسیسی» دستور ساخت آن را داده بود. او همچنین دستور داده بود پدرش «ایتی» که مقام پایین‌تری داشت در همین مکان دفن شود. بنا بر اعلام وزارت گردشگری و آثار باستانی مصر،‌ این مقبره دارای «دو عبادگاه تدفینی متعلق به دو مقام بلندپایه، یعنی یونمن و پدرش ایتی» است. به گفته دانشگاه خودگردان بارسلونا، این مقبره به باستان‌شناسان امکان داده است شخصیت‌هایی را شناسایی کنند که از نظر تاریخی، اجتماعی و فرهنگی اهمیت بسیاری دارند. برای تیم باستان‌شناسی نیز این کشف به دلیل غنا و زیبایی این بنا، شگفت‌انگیز بوده است. وزارت آثار باستانی مصر همچنین از وضعیت استثنایی حفظ صحنه‌ها و نقش‌برجسته‌های این مقبره خبر داد؛ تصاویری که «فعالیت‌های کشاورزی و دسته‌های حامل پیشکش» را نشان می‌دهند و بسیاری از آنها «رنگ‌های اصلی خود را حفظ کرده‌ بودند»."}, {"source": "Euronews Persian", "title": "مقام سازمان ملل: انرژی پاک مطمئن ترین راه؛ اروپا باید پیشگام گذار انرژی باشد", "link": "https://parsi.euronews.com/2026/09/10/clean-energy-is-the-surest-path-europe-should-be-leading-the-energy-transition-says-un-exe", "summary": "سیمون استیل، دبیر اجرایی تغییرات اقلیمی سازمان ملل گفت: اگر بشریت آلودگی سوخت‌های فسیلی را کاهش ندهد گرما، آتش‌سوزی‌ها و خشکسالی‌های امسال در برابر کابوس دائمی اقلیمی پیش رو خفیف به نظر خواهد رسید.", "date_str": "2026-09-10T09:31:04+00:00", "hash": "76d4b1eae55c25e5", "title_fa": "مقام سازمان ملل: انرژی پاک مطمئن ترین راه؛ اروپا باید پیشگام گذار انرژی باشد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threa اح شد: «موزاییک بزرگ» و «شهر نقاشی‌شده» مرمت شد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp حمامهای ترایانوس در کول اوپیو میزبان موزه ای تازه می‌شود. بازدیدکنندگان می‌توانند دو شاهکار بزرگ دوران روم، موزاییک بزرگ و شهر نقاشی‌شده را ببینند. برای حفظ اثر ورودها محدود است. از آخر هفته ۱۲ و ۱۳ سپتامبر در رم، امکان تماشای بزرگترین دیوارنگاره و بزرگترین موزاییکِ دوران روم باستان که به شکل نسبتا سالم باقی‌مانده‌اند، در قلب حمام‌های تراژان که موزه تازه‌ای در آن افتتاح می‌شود، فراهم خواهد شد؛ آثاری که تاکنون مشابهی با این اندازه و این میزان حفظ‌شدگی کشف نشده‌است. شهردار رم، روبرتو گوالتیری، این خبر را در کوله اوپیو و پس از پایان کار مرمت تالار بزرگ نیم‌دایره و گذرگاه زیرزمینی‌ای که دو اثر تاکنون ناشناخته را در خود جای داده‌است، اعلام کرد. این طرح در چارچوب برنامه «PNRR – Caput Mundi» اجرا شده‌است. این مجموعه شامل موزاییک بزرگ «موزا و فیلسوف» و دیوارنگاره «شهر نقاشی‌شده» است؛ گوالتیری این دو را یک کل یگانه، لایه‌لایه‌ای توصیف کرد که بیش از یک قرن تاریخ باستان‌شناسی را از دوران نرونی-فلاوی تا روزگار تراژان روایت می‌کند. حمام‌های تراژان به درخواست امپراتور تراژان و به طراحی آپولودوروس دمشقی ساخته شد. این مجموعه که در ۲۲ ژوئن سال ۱۰۹ میلادی افتتاح شد، حدود ۶۰ هزار متر مربع را در بر می‌گرفت و شامل فضاهای گرمابه، رواق‌ها و بخش‌هایی برای فعالیت‌های ورزشی و فرهنگی و گذران اوقات فراغت بود. این بنا همچنین سازه‌های قدیمی‌تری را در خود جای داد، از جمله بخش‌هایی از «دوموس اورئا»، که امکان ردیابی لایه‌لایه بودن پیچیده محوطه باستانی را فراهم می‌کند. «شهر نقاشی‌شده» دیوارنگاره‌ای ده متر مربعی متعلق به ساختمانی پیش از حمام‌های تراژان، از قرن اول میلادی است که نمای یک شهر را از بالا نشان می‌دهد. این اثر در سال ۱۹۹۸ شناسایی شد. شهردار رم توضیح داد:"}, {"source": "Euronews Persian", "title": "صندوق بین‌المللی پول اقتصاددان پرتغالی ریکاردو ریش را پس از انتقاد از تعرفه‌های ترامپ کنار گذاشت", "link": "https://parsi.euronews.com/business/2026/09/10/portuguese-economist-ricardo-reis-dismissed-by-the-imf-after-criticising-trumps-tariffs", "summary": "ریکاردو ریس هشدار داده بود که تعرفه‌ها می‌تواند قیمت‌ها را در آمریکا بالا ببرد و موج تازه‌ای از تورم در اقتصاد این کشور ایجاد کند.", "date_str": "2026-09-10T09:08:10+00:00", "hash": "9e9f4e51fa81df16", "title_fa": "صندوق بین‌المللی پول اقتصاددان پرتغالی ریکاردو ریش را پس از انتقاد از تعرفه‌های ترامپ کنار گذاشت", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp ریکاردو ریس هشدار داده بود که تعرفه‌ها می‌تواند قیمت‌ها را در آمریکا بالا ببرد و موج تازه‌ای از تورم در اقتصاد این کشور ایجاد کند. گفته می‌شود اقتصاددان پرتغالی ریکاردو ریش پس از انتقاد از تعرفه‌های دونالد ترامپ از رقابت برای سمت اقتصاددان ارشد در صندوق بین‌المللی پول (IMF) کنار گذاشته شده‌است. به‌گزارش روزنامه فایننشال تایمز (منبع به زبان پرتغالی) که سه منبع ناشناس را نقل کرده‌است، ریکاردو ریش برای این سمت در نظر گرفته شده بود، اما صندوق بین‌المللی پول پس از آگاهی از مواضع این اقتصاددان درباره سیاست تجاری آمریکا ظاهرا عقب‌نشینی کرده‌است. ریکاردو ریش، استاد مدرسه اقتصاد لندن (London School of Economics)، هشدار داده بود که تعرفه‌ها می‌تواند قیمت‌ها را در ایالات متحده افزایش دهد و موج تازه‌ای از تورم به‌راه بیندازد. در همین حال، در ماه ژوئیه، صندوق بین‌المللی پول در نهایت سیلوانا تنریرو را برای این سمت منصوب کرد ؛ او از مسئولان پیشین بانک انگلستان و استاد مدرسه اقتصاد لندن است. به‌گفته منابعی که این روزنامه بریتانیایی به‌نقل از آنها گزارش کرده‌است، سیلوانا تنریرو نیز معتقد است که تعرفه‌ها به رشد اقتصادی آسیب می‌زند، اما گفته می‌شود انتقادهای او از دولت ترامپ کمتر از انتقادهای این اقتصاددان پرتغالی بوده‌است. ریکاردو ریش از اظهار نظر درباره این خبر یا ارائه هرگونه توضیح به فایننشال تایمز خودداری کرده‌است."}, {"source": "Euronews Persian", "title": "قرص ضدبارداری حاوی دزوژسترل: هشدار به ۱٫۶ میلیون زن فرانسوی درباره خطر تومور", "link": "https://parsi.euronews.com/health/2026/09/10/desogestrel-contraceptives-16-million-women-warned-of-tumour-risk", "summary": "آژانس دارو ANSM از بیماران زن درگیر می‌خواهد در صورت بروز علائم هشداردهنده مانند سردردهای مداوم، اختلالات بینایی یا کاهش حافظه به پزشک مراجعه کنند.", "date_str": "2026-09-10T08:50:24+00:00", "hash": "febb8959574959ac", "title_fa": "قرص ضدبارداری حاوی دزوژسترل: هشدار به ۱٫۶ میلیون زن فرانسوی درباره خطر تومور", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp آژانس دارو ANSM از بیماران زن درگیر می‌خواهد در صورت بروز علائم هشداردهنده مانند سردردهای مداوم، اختلالات بینایی یا کاهش حافظه به پزشک مراجعه کنند. خطر اندک است اما میلیون‌ها زن را دربر می‌گیرد. در فرانسه، یک میلیون و ششصد هزار زنی که از روش‌های پیشگیری از بارداری حاوی دسوژسترل (Antigone، Cerazette، Elfasette و Optimizette...) استفاده کرده‌اند نامه‌ای دریافت خواهند کرد که در آن درباره افزایش خطر ابتلا به مننژیوم به آنها اطلاع داده می‌شود. سازمان ملی ایمنی داروها (ANSM) روز پنجشنبه این موضوع را اعلام کرد. این نهاد بهداشتی تاکید می‌کند که این خطر همچنان «اندک» است. همزمان، حدود ۹۰ هزار پزشکی که این داروها را تجویز کرده‌اند نیز مطلع خواهند شد. انسم به زنانی که مشمول این هشدار می‌شوند توصیه می‌کند در صورت سردردهای مداوم، اختلالات بینایی، ضعف عضلانی، مشکلات تعادل یا گفتار، از دست دادن حافظه یا بروز یا تشدید حمله‌های صرع به پزشک مراجعه کنند. در این صورت ممکن است تصویربرداری ام‌آر‌آی مغز برای آنها تجویز شود. مننژیوم توموری است که از مننژها، یعنی پرده‌هایی که مغز را احاطه کرده‌اند، رشد می‌کند. این تومور در اغلب موارد خوش‌خیم است اما بسته به اندازه و محل خود می‌تواند موجب اختلالات جدی عصبی شود. بر اساس پژوهشی که گروه منافع علمی Epi-Phare در سال ۲۰۲۴ منتشر کرده است، یک زن از هر ۶۷ هزار زنی که دسوژسترل مصرف کرده‌اند دچار مننژیومی مرتبط با این روش پیشگیری از بارداری می‌شود. پس از پنج سال درمان، این نسبت به یک زن از هر ۱۷ هزار می‌رسد. خطر پس از هفت سال استفاده در مقایسه با زنانی که این نوع داروی ضدبارداری را مصرف نکرده‌اند دو برابر می‌شود اما یک سال پس از قطع مصرف از بین می‌رود. زنانی بالای ۴۵ سال"}, {"source": "Euronews Persian", "title": "طرفداران استار ترک در موزه لندن رکورد جهانی گینس را شکستند", "link": "https://parsi.euronews.com/culture/2026/09/10/star-trek-fans-have-successfully-set-a-new-guinness-world-record-at-a-museum-in-london", "summary": "این تلاش برای ثبت رکورد در شب ویژه «استار ترک لیتس» موزه لندن انجام شد؛ بخشی از مجموعه برنامه‌ها برای گرامیداشت شصتمین سال این سریال علمی‌تخیلی محبوب. در این چارچوب مسیر «استار ترک وارپ تریل» نیز تا پایان این آخر هفته بسته می‌شود.", "date_str": "2026-09-10T08:23:53+00:00", "hash": "dd424849f5e00c03", "title_fa": "طرفداران استار ترک در موزه لندن رکورد جهانی گینس را شکستند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp این تلاش برای ثبت رکورد در شب ویژه «استار ترک لیتس» موزه لندن انجام شد؛ بخشی از مجموعه برنامه‌ها برای گرامیداشت شصتمین سال این سریال علمی‌تخیلی محبوب. در این چارچوب مسیر «استار ترک وارپ تریل» نیز تا پایان این آخر هفته بسته می‌شود. آن‌ها این کار را عملی کردند. در مجموع ۹۳۴ هوادار در روز پیشتازان فضا در موزه علوم لندن گرد هم آمدند تا شصتمین سالگرد این مجموعه تلویزیونی تاثیرگذار را گرامی بدارند. آن‌ها فقط برای جشن گرفتن سالگرد آنجا نبودند بلکه می‌خواستند یک رکورد جهانی گینس تازه برای بزرگ‌ترین سلام ولکانی هم‌زمان ثبت کنند. برای کسانی که احتمالا با این موضوع آشنا نیستند، سلام ولکانی اشاره‌ای است که شخصیت اسپاک با بازی لئونارد نیموی آن را معروف کرد. در این حرکت، دست را رو به جلو بالا می‌آورید و انگشتان میانی و حلقه را از هم جدا می‌کنید تا شکل «وی» تشکیل شود. این سلام نخستین بار در قسمت سال ۱۹۶۷ سریال تلویزیونی با عنوان «Amok Time» ظاهر شد و معمولا با جمله «عمر طولانی و کامیابی» همراه است. شرکت‌کنندگان در رویداد سه‌شنبه باید این حرکت نمادین دست را به مدت یک دقیقه حفظ می‌کردند تا بتوانند عنوان رکورد را به دست آورند. پاولینا ساپینسکا، داور رکوردهای جهانی گینس، این تلاش را تایید کرد و گواهی رسمی را به بن لورو، مدیر عملیات تجاری موزه علوم، اهدا کرد. دکتر گلین مورگان، مسئول مجموعه‌ها و متصدی ارشد موزه علوم، گفت: «از همان ابتدا برای شکستن یک رکورد جهانی واقعا هیجان‌زده بودیم»."}, {"source": "Euronews Persian", "title": "افزایش بازده اوراق خزانه آمریکا؛ بازخرید ۶ میلیارد دلاری بازارها را ناامید کرد", "link": "https://parsi.euronews.com/business/2026/09/10/us-treasury-yields-rise-sharply-after-a-6-billion-bond-buyback-fails-to-meet-market-expect", "summary": "ریزش شدید بازارها به طور جدی خطر افزایش هزینه‌های وام‌گیری برای خانوارها و بنگاه‌های اقتصادی آمریکایی را در پی دارد.", "date_str": "2026-09-10T08:14:40+00:00", "hash": "979438d1ec34167a", "title_fa": "افزایش بازده اوراق خزانه آمریکا؛ بازخرید ۶ میلیارد دلاری بازارها را ناامید کرد", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp ریزش شدید بازارها به طور جدی خطر افزایش هزینه‌های وام‌گیری برای خانوارها و بنگاه‌های اقتصادی آمریکایی را در پی دارد. بازده اوراق قرضه بلندمدت خزانه‌داری آمریکا روز چهارشنبه پس از آن که دولت از برنامه بازخرید ۶ میلیارد دلار (۵.۲ میلیارد یورو) اوراق خبر داد، جهش کرد؛ تصمیمی که سرمایه‌گذارانی را که انتظار مداخله بزرگ‌تری داشتند ناامید کرد. بازده اوراق ۱۰ ساله مرجع خزانه‌داری از سطح ۴.۸۵ درصد عبور کرد؛ بالاترین سطح در نزدیک به سه سال، و سپس کمی عقب نشست. بازده اوراق ۳۰ ساله نیز به ۵.۲۹ درصد رسید که از ۵.۲۶ درصد یک روز قبل بالاتر بود. این نرخ در ماه اوت به ۵.۳۳ درصد رسیده بود که بالاترین سطح از سال ۲۰۰۷ محسوب می‌شود. بازده اوراق خزانه بر نرخ‌های بهره در سراسر اقتصاد آمریکا تاثیر می‌گذارد؛ به این معنا که افزایش‌های پایدار می‌تواند وام‌های مسکن، تسهیلات کسب‌وکار و سایر انواع وام‌گیری را گران‌تر کند. هزینه بالاتر وام‌گیری همچنین می‌تواند رشد اقتصادی را کند و بر قیمت سهام فشار وارد کند. این افزایش پس از آن رخ داد که وزارت خزانه‌داری اعلام کرد روز پنجشنبه تا ۶ میلیارد دلار از اوراق با سررسید ۱۰ تا ۲۰ سال را بازخرید می‌کند. این رقم سه برابر اندازه عملیات پیشین بازخرید اوراق بلندمدت است. این اقدام بخشی از برنامه‌ای است که ماه گذشته توسط اسکات بسنت، وزیر خزانه‌داری، برای تقویت نقدشوندگی در بازار اوراق قرضه اعلام شد."}, {"source": "Euronews Persian", "title": "بهترین فرودگاه‌های جهان بر اساس رتبه‌بندی جدید معرفی شدند", "link": "https://parsi.euronews.com/travel/2026/09/10/these-are-the-best-airports-in-the-world-according-to-a-new-ranking", "summary": "فرودگاه بارسلونا-ال پرات خوسپ تارادیاس در اسپانیا و فرودگاه دوسلدورف در آلمان به عنوان بهترین فرودگاه‌های جهان شناخته شدند.", "date_str": "2026-09-10T08:09:50+00:00", "hash": "62331115dfd7b966", "title_fa": "بهترین فرودگاه‌های جهان بر اساس رتبه‌بندی جدید معرفی شدند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp فرودگاه بارسلونا-ال پرات خوسپ تارادیاس در اسپانیا و فرودگاه دوسلدورف در آلمان به عنوان بهترین فرودگاه‌های جهان شناخته شدند. تصور شما از بهترین فرودگاه جهان شاید کاملا با تصور من فرق داشته باشد. شاید از نظر شما جذاب‌ترین بخش سفرهای خارجی خرید در فروشگاه‌های دیوتی‌فری باشد، شاید فاصله فرودگاه تا مرکز شهر برایتان مهم‌تر باشد یا شاید فرودگاه‌ها را بر اساس تعداد مقاصدی که به آنها پرواز مستقیم دارند ارزیابی می‌کنید. خوشبختانه برای ما، مرکز انتخاب مصرف‌کننده نسخه جدیدی از شاخص جهانی فرودگاه‌های مصرف‌کنندگان (منبع به زبان انگلیسی) را تهیه کرده است که همه موارد بالا و عوامل بیشتری را در نظر می‌گیرد تا بهترین فرودگاه‌های جهان را مشخص کند. این شاخص در دو فهرست جداگانه تنظیم شده است؛ یکی برای فرودگاه‌هایی که سالانه بیش از ۴۷.۲ میلیون مسافر را جابه‌جا می‌کنند و دیگری برای فرودگاه‌های کوچک‌تر. در کنار این، شاخص بررسی می‌کند که آیا فرودگاه به شبکه مترو یا راه‌آهن ملی دسترسی مستقیم دارد یا نه، ارتباط میان گیت‌ها و ترمینال‌ها تا چه حد ساده است، تنوع شرکت‌های هواپیمایی فعال در آن چقدر است، میانگین تاخیرها چقدر است و اینکه آیا در محوطه فرودگاه هتل وجود دارد یا نه. فرودگاه‌ها در صورتی که زمان انتظار در صف‌های کنترل امنیتی کمتر از سه دقیقه باشد و همچنین محدودیت پرواز در شب نداشته باشند، امتیاز اضافه می‌گیرند. هم بهترین فرودگاه بزرگ جهان و هم بهترین فرودگاه کوچک جهان در اروپا قرار دارند؛ فرودگاه Barcelona-El Prat Josep Tarradellas در اسپانیا در صدر فهرست فرودگاه‌های بزرگ و فرودگاه Düsseldorf در آلمان در رده نخست فرودگاه‌های کوچک ایستاده است."}, {"source": "Euronews Persian", "title": "روز جهانی پیشگیری از خودکشی: داده‌های تازه اتحادیه اروپا و اسپانیا چه می‌گویند؟", "link": "https://parsi.euronews.com/health/2026/09/10/world-suicide-prevention-day-what-do-the-latest-data-from-the-eu-and-spain-reveal", "summary": "نرخ مرگ ناشی از خودکشی در اتحادیه اروپا در سال ۲۰۲۳ کمی کاهش یافته و از ده سال پیش کمتر است؛ سه چهارم قربانیان مردند. در اسپانیا نیز داده‌های تازه کاهش را نشان می‌دهد و سازمان جهانی بهداشت خواستار شکستن انگ اجتماعی است.", "date_str": "2026-09-10T08:04:09+00:00", "hash": "14cece4341c5af3f", "title_fa": "روز جهانی پیشگیری از خودکشی: داده‌های تازه اتحادیه اروپا و اسپانیا چه می‌گویند؟", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp نرخ مرگ ناشی از خودکشی در اتحادیه اروپا در سال ۲۰۲۳ کمی کاهش یافته و از ده سال پیش کمتر است؛ سه چهارم قربانیان مردند. در اسپانیا نیز داده‌های تازه کاهش را نشان می‌دهد و سازمان جهانی بهداشت خواستار شکستن انگ اجتماعی است. در سال ۲۰۲۳ در اتحادیه اروپا ۴۸ هزار و ۳۷۰ نفر بر اثر خودکشی جان خود را از دست دادند اما نرخ مرگ‌ومیر همچنان رو به کاهش است و اکنون پایین‌تر از سطح ثبت‌شده یک دهه پیش قرار دارد. این تصویری است که آخرین داده‌های یورواستات (منبع به زبان اسپانیایی) ترسیم می‌کنند؛ آماری که همزمان با روز جهانی پیشگیری از خودکشی منتشر شده است؛ روزی که هر ۱۰ سپتامبر برای آگاه‌سازی درباره این معضل سلامت عمومی، مقابله با انگ‌زدن و ترویج اقدامات پیشگیرانه برگزار می‌شود. خودکشی در آن سال یک درصد از همه مرگ‌ها ثبت‌شده در اتحادیه اروپا را به خود اختصاص داد. نرخ استاندارد‌شده ۱۰.۴ مورد مرگ به ازای هر ۱۰۰ هزار نفر بود؛ در حالی که این رقم در سال ۲۰۲۲ برابر با ۱۰.۶ و در سال ۲۰۱۳ معادل ۱۲.۲ بود. تفاوت‌ها میان کشورهای عضو همچنان قابل‌توجه است. لیتوانی بالاترین نرخ خودکشی در اتحادیه اروپا را ثبت کرده است ؛ ۱۸.۸ مرگ به ازای هر ۱۰۰ هزار نفر و پس از آن اسلوونی با ۱۶.۴ و مجارستان با ۱۶.۱ مورد قرار دارند. پایین‌ترین نرخ‌ها متعلق به قبرس با ۳.۵، یونان با ۴.۳ و مالت با ۵.۵ مورد بود. مردان ۷۶.۴ درصد از کل قربانیان خودکشی در اتحادیه اروپا را تشکیل دادند . نرخ خام خودکشی در میان مردان ۱۶.۹ مورد به ازای هر ۱۰۰ هزار مرد بود در حالی که این رقم در میان زنان ۵ مورد بود. مرگ‌ومیر همچنین با افزایش سن بالا می‌رود و"}, {"source": "Euronews Persian", "title": "سنتکام ادعای سپاه درباره هدف قرار دادن ۲ ناو آمریکایی را رد کرد: «تمام حملات سپاه شکست خورده است»", "link": "https://parsi.euronews.com/2026/09/10/centcom-denies-irgc-claim-of-targeting-2-us-ships-all-irgc-attacks-have-failed", "summary": "فرماندهی مرکزی ارتش آمریکا، سنتکام، ادعای مطرح‌شده درباره هدف قرار گرفتن دو ناو جنگی آمریکا توسط نیروهای سپاه پاسداران در منطقه خاورمیانه را رد کرد.", "date_str": "2026-09-10T07:47:04+00:00", "hash": "6d1dcf155a348c4d", "title_fa": "سنتکام ادعای سپاه درباره هدف قرار دادن ۲ ناو آمریکایی را رد کرد: «تمام حملات سپاه شکست خورده است»", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! فرماندهی مرکزی ارتش آمریکا، سنتکام، ادعای مطرح‌شده درباره هدف قرار گرفتن دو ناو جنگی آمریکا توسط نیروهای سپاه پاسداران در منطقه خاورمیانه را رد کرد. فرماندهی مرکزی ارتش آمریکا، سنتکام، در پستی در شبکه اجتماعی ایکس ادعای سپاه درباره هدف قرار دادن دو ناو جنگی آمریکا در منطقه خاورمیانه را نادرست خواند. سنتکام در پیامی اعلام کرد: «این ادعا کاملا نادرست است» و هیچ‌یک از ناوهای جنگی نیروی دریایی آمریکا هدف قرار نگرفته‌اند. این فرماندهی مدعی شد تمامی تلاش‌های نیروهای سپاه برای حمله به ناوهای آمریکایی «ناکام مانده است». سنتکام همچنین اعلام کرد نیروهای آمریکایی طی هفته گذشته ۱۰ نفتکش ایرانی را منهدم کرده‌اند. به ادعای این فرماندهی، این نفتکش‌ها بخشی از یک «شبکه چندمیلیارد دلاری انتقال مخفیانه نفت» بوده‌اند که برای تامین مالی سپاه پاسداران فعالیت می‌کرده است. سنتکام در این پیام افزود: «ایران قادر به دفاع از این نفتکش‌ها نیست». سپاه پاسداران بامداد چهارشنبه ۹ سپتامبر طی بیانیه‌ای اعلام کرده بود که در واکنش به حمله آمریکا به پنج نفتکش ایرانی در خلیج فارس، دو شناور آمریکایی، هشت نفتکش و ۱۰ کشتی را هدف قرار داده است. سپاه مدعی شد که این شناورهای رزمی DDG-119 و DDG-53 حامل موشک‌های کروز و ایجیس را مورد حمله قرار داده است. سپاه مدعی شده بود که این ناوشکن‌ها در اثر این حمله متحمل «خسارات قابل‌توجهی» شده‌اند."}, {"source": "Euronews Persian", "title": "ادعای هشدار امارات به اسرائیل پیش از حمله ۷ اکتبر حماس؛ نتانیاهو از روزنامه هاآرتص شکایت می‌کند", "link": "https://parsi.euronews.com/2026/09/10/netanyahu-sues-haaretz-over-allegations-uae-warning-before-october-7-hamas-attack", "summary": "بنیامین نتانیاهو، نخست‌وزیر اسرائیل روز چهارشنبه اعلام کرد به وکلای خود دستور داده از روزنامه «هاآرتص» همچنین شلومی الدار، روزنامه‌نگار این نشریه و چند نفر دیگر به اتهام افترا شکایت کنند.", "date_str": "2026-09-10T07:32:59+00:00", "hash": "cf1d616928943053", "title_fa": "ادعای هشدار امارات به اسرائیل پیش از حمله ۷ اکتبر حماس؛ نتانیاهو از روزنامه هاآرتص شکایت می‌کند", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp لینک کپی پیست کد امبد ویدیو: لینک کپی شد! بنیامین نتانیاهو، نخست‌وزیر اسرائیل روز چهارشنبه اعلام کرد به وکلای خود دستور داده از روزنامه «هاآرتص» همچنین شلومی الدار، روزنامه‌نگار این نشریه و چند نفر دیگر به اتهام افترا شکایت کنند. هاآرتص در گزارش خود نتانیاهو را متهم کرده بود که پیش از حمله ۷ اکتبر ۲۰۲۳ میلادی هشدار امارات عربی متحده درباره آماده شدن حماس برای انجام «حمله‌ای بزرگ» را نادیده گرفته و به فرماندهان نهادهای امنیتی اطلاع نداده است. نتانیاهو گفت بررسی‌های انجام‌شده توسط دفتر نخست‌وزیری، شورای امنیت ملی و دبیرخانه نظامی نشان داده است که از اوایل سپتامبر تا ۷ اکتبر ۲۰۲۳ هیچ مدرکی درباره گفت‌وگوی میان او و شیخ محمد بن زاید آل نهیان، رئیس‌ امارات عربی متحده وجود ندارد. او همچنین گفت سوابق ورود به اسرائیل و خروج از آن نشان می‌دهد که هیچ نماینده‌ای از طرف امارات عربی متحده که به گفته نتانیاهو برای برقراری چنین تماسی لازم بوده نیز به اسرائیل سفر نکرده است. نتانیاهو در ادامه گزارش هاآرتص را «ساختگی و بدخواهانه» خواند و گفت هدف آن، منحرف کردن توجه‌ها از آن چیزی است که او شکست‌های رونن بار، رئیس وقت «شاباک» و هرتزی هالوی، رئیس وقت ستاد کل ارتش اسرائیل توصیف کرد. نتانیاهو آنها را متهم کرد که پیش از حمله، به نشانه‌های هشداردهنده در ساعات پیش از حمله توجه نکرده بودند. روزنامه چپگرای «هاآرتص» روز سه‌شنبه به نقل از منابع ارشد خارجی که نامشان فاش نشده، گزارش داد که محمد بن زاید اندکی پیش از ۷ اکتبر به نتانیاهو هشدار داده بود که حماس در حال برنامه‌ریزی برای یک حمله گسترده است."}, {"source": "Euronews Persian", "title": "نروژ با هارالد پنجم خداحافظی می‌کند؛ تجمع مردم در اسلو", "link": "https://parsi.euronews.com/video/2026/09/10/norway-bids-farewell-to-king-harald-v-as-crowds-gather-in-oslo", "summary": "هزاران نفر در اسلو گردهم آمدند؛ همزمان نروژ مراسم خاکسپاری پادشاه هارالد پنجم را برگزار کرد و رهبران جهان و خاندان‌های سلطنتی اروپا در وداع نهایی با این پادشاه کهنه‌کار حضور داشتند.", "date_str": "2026-09-10T06:59:39+00:00", "hash": "58b37e2cdb97c747", "title_fa": "نروژ با هارالد پنجم خداحافظی می‌کند؛ تجمع مردم در اسلو", "summary_fa": "تابوت شاه هارالد پنجم روز چهارشنبه ۹ سپتامبر از کاخ سلطنتی در اسلو خارج می‌شود، در حالی که مراسم تشییع جنازه به سوی کلیسای جامع اسلو حرکت می‌کند. شاه هاکون هشتم پشت تابوت قدم برمی‌دارد و به نیروها ادای احترام می‌کند و پس از او اعضای ارشد خانواده سلطنتی حرکت می‌کنند. هارالد ۲۸ اوت در سن ۸۹ سالگی، پس از ۳۵ سال سلطنت، درگذشت. پسرش هاکون به عنوان شاه جانشین او شد و در مراسم خاکسپاری رهبری خانواده سلطنتی را بر عهده دارد؛ در کنار او اعضای خاندان‌های سلطنتی خارجی، رهبران سیاسی و دیگر شخصیت‌های بلندپایه حضور دارند. این مراسم آخرین وداع با پادشاهی است که خاندان سلطنتی نروژ را نوسازی کرد اما ترجیح داد به جای کناره‌گیری بر تخت بماند. پس از آیین، تابوت هارالد به نمازخانه قلعه آکرشوس منتقل خواهد شد و در سرداب خاندان سلطنتی قرار می‌گیرد."}, {"source": "Euronews Persian", "title": "طراحی جدید باتری روی‌هوا ساخت اسپانیا با افزایش ۸۰ درصدی توان", "link": "https://parsi.euronews.com/next/2026/09/10/the-csic-has-created-a-new-battery-design-capable-of-increasing-its-power-by-80", "summary": "یک فناوری جدید در موسسه علم مواد بارسلونا اتلاف انرژی را در باتری‌های روی‌هوا کاهش می‌دهد و کارایی آنها را بالا می‌برد و راهی تازه برای کاربرد در انواع فناوری‌های ذخیره‌سازی انرژی می‌گشاید.", "date_str": "2026-09-10T06:54:10+00:00", "hash": "30d410cb066b858a", "title_fa": "طراحی جدید باتری روی‌هوا ساخت اسپانیا با افزایش ۸۰ درصدی توان", "summary_fa": "همرسانی نظرها یورونیوز را در گوگل دنبال کنید همرسانی Facebook Twitter Flipboard Send Balatarin Messenger Bluesky Telegram Threads Whatsapp یک فناوری جدید در موسسه علم مواد بارسلونا اتلاف انرژی را در باتری‌های روی‌هوا کاهش می‌دهد و کارایی آنها را بالا می‌برد و راهی تازه برای کاربرد در انواع فناوری‌های ذخیره‌سازی انرژی می‌گشاید. در اسپانیا، پژوهشگران مؤسسه علوم مواد بارسلونا (ICMAB-CSIC) معماری تازه‌ای برای باتری‌های روی‌-هوا طراحی کرده‌اند که بدون دست زدن به شیمی اصلی باتری، امکان افزایش توان آن تا ۸۰ درصد را فراهم می‌کند. در این سامانه، عناصر رسانا در داخل باتری قرار می‌گیرند که مانند الکترودهای دوقطبی بی‌سیم عمل می‌کنند و به تسهیل انتقال بار و کاهش مقاومت داخلی کمک می‌کنند. این پیشرفت راه تازه‌ای برای طراحی باتری‌های کارآمدتر و پربازده‌تر می‌گشاید. این پژوهش که در نشریه «Energy Storage Materials» منتشر شده، با همکاری مؤسسه کاتالونی نانوعلم و نانوفناوری (ICN2) و دانشگاه ملی لا پلاتا در آرژانتین انجام شده است. به گفته پژوهشگران، این کار و تحقیقات پیشین همین گروه، طراحی متعارف باتری‌ها را زیر سوال می‌برند و راه تازه‌ای برای تصور سامانه‌های ذخیره‌سازی انرژی پیشنهاد می‌کنند. باتری‌ها به لطف اختلاف انرژی میان مواد دو الکترود خود برق تولید می‌کنند. بارهای الکتریکی از طریق الکترولیت، یعنی ماده‌ای که امکان حرکت یون‌ها را فراهم می‌کند ، از یک الکترود به دیگری جابه‌جا می‌شوند. تا امروز فرض بر این بود که این بخش باید مانع عبور الکترون‌ها شود تا از خطر اتصال کوتاه جلوگیری شود. مطالعه جدید این اصل را زیر سوال می‌برد. تیمی به سرپرستی نیبس کاسان-پاستور ، پژوهشگر ICMAB-CSIC، نشان داده است که در شرایطی معین می‌توان قطعات کوچک فلز
