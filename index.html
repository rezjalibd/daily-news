ound the set and pay for most artwork separately, while Hisense includes all of that in the base price. Like The Frame, the CanvasTV also comes with a flush TV mount that will allow you to hang it so it looks like a piece of art. I like that CanvasTVs come with the Google OS, which is my favorite smart TV operating system, as it lets you cast seamlessly from your phone (Android or iPhone). The CanvasTV is a QLED TV with Quantum Dot technology and 4K resolution with a 144Hz refresh rate in Game Mode Pro, according to CNET's review . What gives it the art look is the low-reflection Hi-Matte display, which combats glare. You can swap out the teak frame with different colors, including white and walnut frames. Considering Hisense's take on The Frame is cheaper and includes fewer upfront costs, it's a great option for anyone looking to save money on a TV that won't dominate their decor especially at the current discount. Our Best Editor-Vetted Tech Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $1", "date_str": "2026-10-12T19:30:00+00:00", "hash": "4801f3b0bba056a1", "title_fa": "من عاشق My Hisense CanvasTV هستم و در حال حاضر تا 50٪ تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اگر شما هم مانند اکثر مردم هستید، تلویزیون شما نقطه مرکزی دکوراسیون اتاق نشیمن شما است. این بدان معناست که وقتی خاموش است، تمام مبلمان شما به سمت یک مستطیل مشکی است. اگر این موضوع شما را آزار می‌دهد، روند «تلویزیون هنری» که با The Frame سامسونگ آغاز شد می‌تواند پاسخگو باشد. این مجموعه‌ها به‌گونه‌ای ساخته شده‌اند که شبیه یک اثر هنری به نظر می‌رسند و در صورت عدم استفاده، تصویری را که شما انتخاب می‌کنید به نمایش می‌گذارند. Frame یک گزینه گران است، اما مارک های دیگر پیشنهادات خاص خود را دارند، از جمله Hisense و CanvasTV آن، که من در شش ماه گذشته از آن استفاده کرده و دوستش داشته ام. در حال حاضر یک جایگزین مقرون به صرفه تر برای The Frame، می توانید تلویزیون 50 اینچی Hisense CanvasTV را با قیمت 649.99 دلار (از 1299.99 دلار کاهش) دریافت کنید. با توجه به ابزارهای ردیابی قیمت، این کمترین قیمت است. سایزهای دیگر هم در حال حاضر تخفیف دارند. تلویزیون هنری هوشمند گوگل Hisense 50 QLED S7 CanvasTV Series 4K UHD (50S7SG، 2026 جدید) - حالت هنری، پنل ضد تابش نور، Dolby Vision HDR، صفحه نمایش مات، قاب قاب دیواری فوق باریک، تلویزیون سبک زندگی 649.99 دلار دریافت کنید. 649.99 دلار در Amazonal Sa. 649.99 دلار در آمازون معامله کنید 1299.99 دلار پس انداز 650.00 دلار مشاهده -2 بیشتر جذابیت اصلی CanvasTV نسبت به The Frame سامسونگ قیمت آن است: شما 200 تا 1700 دلار کمتر برای تلویزیون هم اندازه پرداخت خواهید کرد (بسته به اندازه ای که انتخاب می کنید). ناگفته نماند، The Frame از شما می‌خواهد فریم‌های واقعی را بخرید که در اطراف مجموعه قرار می‌گیرند و هزینه بیشتر آثار هنری"}, {"source": "Lifehacker", "title": "Use This Hack to Get the Pixel's AI Dictation on Any Android Phone", "link": "https://lifehacker.com/tech/bring-pixel-ai-detection-to-any-android-phone?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Rambler, Google's AI-powered dictation feature , seems genuinely useful. At its core, Rambler is like your phone's existing dictation tool, only much smarter. It can automatically edit your speech into a more polished end product. It'll eliminate your filler words like \"um\" and ah,\" shape up your grammar, and understand your intended meaning (e.g., if you say \"we need to pick whole milk...I mean, oat milk,\" Rambler will type \"we need to pick up oat milk.\") Google Pixel 11 $899.00 at Amazon Shop Now Shop Now $899.00 at Amazon This is the type of feature most of us would like to have on our phones, there's only one problem: Despite developing the Android operating system, Google decided to make Rambler a Pixel 11-exclusive feature. As such, if you have a non-Pixel phone, like a Samsung or a Motorola, you're out of luck, unless you want to upgrade to one of Google's smartphones or, as it turns out, download this third-party tool instead. \"PixelBoard\" adds Rambler to any Android As reported by Android Authority , developer Akshay Kadam modded Google's Gboard app and uploaded it to GitHub under the name PixelBoard. Kadam advertises PixelBoard as a \"supercharged Gboard mod\" sporting features from the Pixel 11 series including AI writing tools, and, notably, Rambler. According to Kadam's GitHub page, PixelBoard runs side-by-side with the Gboard app on your phone. You don't need to replace the existing app or uninstall it, nor do you need to root your Android. Still, this is an unofficial port that requires sideloading onto your Android device. While the tool comes from a public GitHub page, exercise caution if you want to give it a shot. If you do, Kadam's GitHub page has detailed instructions for downloading the app on your phone. It seems you have three options: You can download PixelBoard directly from GitHub, then install it from the notification drawer or File Manager on your phone; if you're a developer, you can sideload the app by connecting your phone via USB with USB Debugging enabled; and, finally, you can patch the stock Gboard APK using Morphe Manager. (Kadam recommends the first method.) Once you do have PixelBoard on your phone, head to Settings System Languages input On-screen keyboard (or Manage Keyboards ), then enable PixelBoard. Tap the keyboard switch button or spacebar selector, then choose PixelBoard as the input method. To use Rambler, choose \"Rambler Dictation\" from this settings page, choo", "date_str": "2026-10-12T19:00:00+00:00", "hash": "998d66a12560eae0", "title_fa": "از این هک برای دریافت دیکته هوش مصنوعی پیکسل در هر گوشی اندرویدی استفاده کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. Rambler، ویژگی دیکته مبتنی بر هوش مصنوعی گوگل، واقعاً مفید به نظر می رسد. در هسته خود، Rambler مانند ابزار دیکته موجود تلفن شما است، فقط بسیار هوشمندتر است. می تواند به طور خودکار گفتار شما را به یک محصول نهایی صیقلی تر ویرایش کند. کلمات پرکننده شما مانند \"ام\" و آه را حذف می کند، دستور زبان شما را شکل می دهد و معنای مورد نظر شما را درک می کند (به عنوان مثال، اگر بگویید \"ما باید شیر کامل را انتخاب کنیم... منظورم شیر جو دوسر است\" رامبلر تایپ می کند \"ما باید شیر جو دوسر را برداریم.\") Google Pixel 11 899.00 دلار در Amazon Shop Now دارد، این ویژگی مانند تلفن ما از 899 دلار است. تنها یک مشکل وجود دارد: علیرغم توسعه سیستم عامل اندروید، گوگل تصمیم گرفت Rambler را به یک ویژگی انحصاری پیکسل 11 تبدیل کند. به این ترتیب، اگر یک تلفن غیر پیکسل مانند سامسونگ یا موتورولا دارید، شانسی ندارید، مگر اینکه بخواهید به یکی از تلفن های هوشمند گوگل ارتقا دهید یا، همانطور که مشخص است، به جای آن، این ابزار شخص ثالث را دانلود کنید. \"PixelBoard\" Rambler را به هر اندرویدی اضافه می کند همانطور که توسط Android Authority گزارش شده است، توسعه دهنده Akshay Kadam برنامه Gboard گوگل را اصلاح کرده و آن را با نام PixelBoard در GitHub آپلود کرده است. Kadam PixelBoard را به‌عنوان یک «مد Gboard سوپرشارژ» از ویژگی‌های ورزشی سری Pixel 11 از جمله ابزارهای نوشتن هوش مصنوعی و به‌ویژه Rambler تبلیغ می‌کند. طبق صفحه Kadam's GitHub، PixelBoard در کنار برنامه Gboard در تلفن شما اجرا می شود. نیازی نیست برنامه موجود را جایگزین یا حذف نصب کنید و همچنین نیازی به روت کردن اندروید خود ندارید. با این حال، این یک پورت غیر رسمی"}, {"source": "Lifehacker", "title": "Five Garmin Data Screens That Helped Me Improve My 'Running Economy'", "link": "https://lifehacker.com/health/best-garmin-data-screens-for-running-economy?utm_medium=RSS", "summary": "We may earn a commission from links on this page. On most runs, I prefer to pay attention to pace and heart rate data from my Garmin, and ignore the rest (even though I love playing with the data later on). But I also believe in trying a fun experiment now and then. So, for my most recent training block, I ve retooled my watch's data screens around several of the more nitty-gritty metrics available to me cadence, stride length, vertical oscillation, ground contact time, and more to see what useful insights I could gain. First, a quick definition, because \" running economy \" gets thrown around a lot: Running economy is the energy (oxygen) cost of running at a given speed. Two runners can hold the same 8:00 pace, but the one who uses less oxygen to do so is more economical. That runner can run the same pace at a lower heart rate, hold it longer, or go faster for the same effort. It's one of the big levers for performance, alongside VO2 max and lactate threshold, and it's one you can improve with training, strength work, and technique. Technically, your watch can't measure running economy directly and give you one neat number. What it can do is show you how you're producing your speed, so you can spot inefficiencies and then test whether fixing them lowers your heart rate at the same pace. That's the experiment I m running (pun intended). After my next marathon, I'll break down how my running economy actually improved, and in what ways. All the running dynamics on Garmin watches Garmin groups these metrics under \"running dynamics.\" Depending on your watch and accessories, they include cadence, stride length, ground contact time, ground contact time balance, vertical oscillation, vertical ratio, running power, and step speed loss. In all the examples below, I'm using a Garmin Forerunner 970 ; note that not every Garmin can show all of these data fields. Garmin Forerunner 970 Premium GPS Smartwatch (Black) $749.99 at Amazon Shop Now Shop Now $749.99 at Amazon Cadence works on nearly every Garmin running watch. Stride length is available on many mid-range and higher watches, sometimes from the wrist and sometimes only with an accessory. Ground contact time, ground contact balance, vertical oscillation, and vertical ratio have historically required a compatible chest strap, but many newer watches now measure these from the wrist. Running power has its own requirements, depending on your watch and whether you use an accessory. Check Garmin's running power device r", "date_str": "2026-10-12T18:00:00+00:00", "hash": "67d64366b0169427", "title_fa": "پنج صفحه نمایش داده گارمین که به من کمک کرد \"اقتصاد در حال اجرا\" خود را بهبود بخشم", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. در بیشتر دویدن‌ها، ترجیح می‌دهم به داده‌های سرعت و ضربان قلب گارمین خود توجه کنم و بقیه را نادیده بگیرم (حتی اگر بعداً دوست دارم با داده‌ها بازی کنم). اما من همچنین معتقدم که گاهی اوقات یک آزمایش سرگرم کننده را امتحان می کنم. بنابراین، برای آخرین بلوک آموزشی خود، صفحه‌های داده‌های ساعتم را حول چندین معیار دقیق‌تر در دسترس، آهنگ، طول گام، نوسان عمودی، زمان تماس با زمین، و موارد دیگر دوباره ابزار کردم تا ببینم چه بینش مفیدی می‌توانم به دست بیاورم. اول، یک تعریف سریع، زیرا \"اقتصاد در حال اجرا\" بسیار مورد استفاده قرار می گیرد: اقتصاد دویدن هزینه انرژی (اکسیژن) دویدن با سرعت معین است. دو دونده می توانند سرعت یکسانی را در 8:00 نگه دارند، اما کسی که اکسیژن کمتری برای این کار مصرف می کند مقرون به صرفه تر است. آن دونده می تواند همان سرعت را با ضربان قلب کمتر بدود، آن را طولانی تر نگه دارد یا برای همان تلاش سریع تر حرکت کند. این یکی از اهرم‌های بزرگ برای عملکرد، در کنار حداکثر VO2 و آستانه لاکتات است، و اهرمی است که می‌توانید با تمرین، کار قدرتی و تکنیک آن را بهبود بخشید. از نظر فنی، ساعت شما نمی‌تواند به طور مستقیم اقتصاد را اندازه‌گیری کند و یک عدد دقیق به شما بدهد. کاری که می‌تواند انجام دهد این است که به شما نشان دهد چگونه سرعت خود را تولید می‌کنید، بنابراین می‌توانید ناکارآمدی‌ها را تشخیص دهید و سپس آزمایش کنید که آیا رفع آنها ضربان قلب شما را با همان سرعت کاهش می‌دهد یا خیر. این آزمایشی است که من اجرا می کنم (جناسی در نظر گرفته شده). پس از ماراتن بعدی، نحوه بهبود اقتصاد دویدن من و از چه راه هایی را توضیح خواهم داد. تمام پویایی‌های در"}, {"source": "Lifehacker", "title": "How to Try WhatsApp's New Scheduled Messages Feature Early", "link": "https://lifehacker.com/tech/how-to-try-whatsapps-new-scheduled-messages-feature-early?utm_medium=RSS", "summary": "All messaging apps should let you schedule texts by default . Sometimes, you need to send a message to a friend or family member, but you don't want them to get it just yet. Maybe they're in a different time zone, and it's too early or late to politely text them; maybe they're in an important meeting, and you don't want their phone sounding or buzzing as a distraction. Either way, a scheduled message can save you: You won't forget to text them later, and they'll get the message whenever you think they should. Win-win. Of course, this is not a standard feature in all apps yet. Some apps have it, like Telegram or iMessage , and it's a great addition when you need it. Others, like Messenger or WhatsApp, are sorely missing it. While Meta doesn't appear to have any plans to bring scheduled texts to Messenger, it does seem like WhatsApp users are getting the upgrade on the horizon. In fact, you might be able to try it out today. Scheduling messaging in WhatsApp As reported by WABetaInfo , WhatsApp is currently testing a new feature for users to schedule texts, photos, and videos to send at a later time. At this time, the feature works even when you're offline, so your scheduled messages will still send even if you don't have a wifi or cellular connection. In addition, the feature is not limited to single chats, as so many new messaging features are. You can schedule texts in both one-on-one and group chats, and all scheduled messages are still end-to-end encrypted. At this time, it looks like Meta is only testing scheduling messages on WhatsApp for Android. The bright side for iPhone users is that this test is quite limited: Only select users are getting the feature at this time and, while it's no guarantee, you should enroll in the WhatsApp beta if you want a chance at trying it out early. To start, head to WhatsApp's official beta tester page on the Google Play Store . Here, make sure you're logged into your Google Account, then enroll in the beta. Head back to the official WhatsApp Play Store page , and you should have a new update. This is the beta. Once you're on the WhatsApp beta, you can check if you have the feature like so: Craft a new message in any chat, then tap and hold on the send button. If you have it, WhatsApp will present a pop-up, letting you cycle through a date and time to schedule your message. (You can choose to send the message in as little as 10 minutes, or as long as two weeks.) When you're ready to schedule, you can tap the green sched", "date_str": "2026-10-12T17:30:00+00:00", "hash": "b48c5b167d2de63e", "title_fa": "چگونه می توان ویژگی پیام های برنامه ریزی شده جدید WhatsApp را زودتر امتحان کرد", "summary_fa": "همه برنامه‌های پیام‌رسان باید به‌طور پیش‌فرض به شما امکان زمان‌بندی متن‌ها را بدهند. گاهی اوقات لازم است برای یکی از دوستان یا اعضای خانواده پیامی بفرستید، اما نمی‌خواهید که آنها هنوز آن را دریافت کنند. شاید آنها در منطقه زمانی متفاوتی هستند، و خیلی زود یا دیر است که مودبانه به آنها پیامک بدهیم. شاید آنها در یک جلسه مهم هستند و شما نمی خواهید تلفن آنها به صدا درآید یا وزوز کند که باعث حواس پرتی شود. در هر صورت، یک پیام زمان‌بندی‌شده می‌تواند شما را نجات دهد: بعداً فراموش نمی‌کنید که به آنها پیامک ارسال کنید، و آنها هر زمان که فکر کنید باید پیام را دریافت کنند. برد-برد. البته هنوز این یک ویژگی استاندارد در همه برنامه ها نیست. برخی از برنامه‌ها، مانند تلگرام یا iMessage، آن را دارند، و در مواقعی که به آن نیاز دارید، افزودنی عالی است. دیگران، مانند مسنجر یا واتس اپ، به شدت آن را از دست داده اند. در حالی که به نظر نمی‌رسد متا برنامه‌ای برای آوردن متن‌های برنامه‌ریزی‌شده به مسنجر ندارد، به نظر می‌رسد که کاربران واتس‌اپ در حال دریافت این ارتقا در افق هستند. در واقع، ممکن است امروز بتوانید آن را امتحان کنید. برنامه‌ریزی پیام‌رسانی در واتس‌اپ همانطور که توسط WABetaInfo گزارش شده است، واتس‌اپ در حال آزمایش یک ویژگی جدید برای کاربران است تا متن‌ها، عکس‌ها و ویدیوها را برای ارسال در زمان بعدی برنامه‌ریزی کنند. در این زمان، این ویژگی حتی زمانی که آفلاین هستید کار می‌کند، بنابراین پیام‌های برنامه‌ریزی‌شده شما همچنان ارسال می‌شوند، حتی اگر اتصال Wi-Fi یا تلفن همراه نداشته باشید. علاوه بر این، این ویژگی به چت های تکی محدود نمی شود، زیرا بسیاری از ویژگی های پیام رسانی جدید هستند. می‌توانید متن‌ها را هم در چت‌های یک به یک و هم در چت گروهی زمان‌بندی کنید، و همه پیام‌های برنامه‌ریزی‌شده همچنان"}],
      media: [{"source": "Billboard", "title": "The War and Treaty to Receive Origins Vanguard Award at Origins Impact Awards: Full List of 2026 Nominees", "link": "https://www.billboard.com/music/awards/origins-impact-awards-2026-nominees-full-list-1236358590/", "summary": "The War and Treaty are set to receive the inaugural Origins Vanguard Award at the third annual Origins Impact Awards on Thursday, Nov. 19 at Nashville s Woolworth Theatre. The husband-and-wife duo of Michael Trotter Jr. and Tanya Trotter have built a celebrated career spanning country, Americana, soul and roots music. The duo has received two Grammy nominations, including best new artist, and three CMA Awards nominations for vocal duo of the year. Related The War and Treaty Are Proud to Be a Part of Country Music s Changing Narrative The War and Treaty Sign With Atlantic Outpost; New Album Features Whoopi Goldberg, Wynonna The War and Treaty Announces New Album 2025 Tour Dates The Origins Vanguard Award recognizes artists whose artistry, influence and impact have helped shape country music s evolving landscape while opening doors and creating greater possibilities for others. The Vanguard Award gives us an opportunity to recognize artists whose impact reaches beyond a single year, Corey Jones, CEO and co-founder of Origins Music Group, said in a statement. The War and Treaty represent exactly what this honor was created to celebrate. Their artistry speaks for itself, but their journey has also opened doors, challenged expectations and created space for artists who may not have always seen themselves reflected in Country Music. Origins Music Group (OMG), a Nashville-based music and entertainment organization, also announced this year’s finalists across 18 categories, including Breland , Blanco Brown , K. Michelle , Nappy Roots, Pynk Beard, The Boykinz, Gustavo Mioto, RVSHVD, Shy Carter, Kashus Culpepper, Camille Parker, The Kentucky Gentlemen, MŌRIAH, Angie K and Dalton Dover. What makes the Origins Impact Awards special is that we aren t asking artists to fit into one narrow definition of what country music is supposed to look or sound like, Jones said. These finalists represent the depth of talent that exists across country music today. They are building audiences, creating communities and showing just how expansive this music and its culture can be. The 2026 ceremony will feature live performances, special presentations and appearances from artists and industry leaders. Rissi Palmer , Coffey Anderson, Angie K, Miko Marks, Reyna Roberts and Pynk Beard were among the winners at the second Origins Impact Awards , which were held on Nov. 20, 2025, at Nashville’s The Cowan. Hosted by Justin Lee, performers included Pynk Beard, Wendy Moten, Grayson Russell, Sa", "date_str": "2026-10-13T14:10:00+00:00", "hash": "f843b0a65a3b0f25", "title_fa": "The War and Treaty to Receive Origins Vanguard Award در جوایز Origins Impact: فهرست کامل نامزدهای 2026", "summary_fa": "The War and Treaty قرار است اولین جایزه Origins Vanguard را در سومین جوایز سالانه Origins Impact در روز پنجشنبه، 19 نوامبر در تئاتر Woolworth در نشویل دریافت کند. زوج زن و شوهر مایکل تروتر جونیور و تانیا تروتر یک کشور حرفه ای مشهور، آمریکایی، موسیقی روح و ریشه ساخته اند. این دو تا به حال دو نامزدی گرمی، از جمله بهترین هنرمند جدید، و سه نامزدی جوایز CMA برای دو آواز سال دریافت کرده‌اند. جنگ و پیمان مفتخریم که بخشی از روایت در حال تغییر موسیقی کانتری هستند. امضای جنگ و پیمان با پاسگاه آتلانتیک ویژگی های آلبوم جدید Whoopi Goldberg، Wynonna The War and Treaty آلبوم جدید را اعلام می کند تاریخ تور 2025 جایزه Origins Vanguard به هنرمندانی اعطا می کند که هنر، تأثیر و تأثیر آنها به شکل دادن به منظره در حال تکامل موسیقی کانتری کمک کرده و درها را باز کرده و امکانات بیشتری را برای دیگران ایجاد کرده است. کوری جونز، مدیر عامل و یکی از بنیانگذاران گروه موسیقی Origins، در بیانیه ای گفت: جایزه پیشتاز به ما فرصتی می دهد تا هنرمندانی را که تاثیرشان بیش از یک سال می رسد، بشناسیم. جنگ و معاهده دقیقاً نشان دهنده چیزی است که این افتخار برای جشن گرفتن ایجاد شد. هنر آنها برای خود صحبت می کند، اما سفر آنها همچنین درها را باز کرده است، انتظارات را به چالش کشیده و فضایی را برای هنرمندانی ایجاد کرده است که ممکن است همیشه خود را در موسیقی کانتری ندیده باشند. Origins Music Group (OMG)، یک سازمان موسیقی و سرگرمی مستقر در نشویل، همچنین فینالیست های امسال را در 18 دسته از جمله Breland، Blanco Brown، K. Michelle، Nappy Roots، Pynk Beard، The Boykinz، Gustavo Mioto، RVSHVD، Shy Carter، Kashus Parkecke, The Camtueckecke اعلام کرد. MŌRIAH، Angie K و Dalton Dover. جونز گفت، چیزی که"}, {"source": "Billboard", "title": "Sammy Hagar Celebrates Turning 79 With Star-Studded Bash, Shares Hopes for a Van Halen ‘Unification’", "link": "https://www.billboard.com/music/rock/sammy-hagar-birthday-bash-1236359459/", "summary": "For a 36th year, Sammy Hagar is gearing up for this week s Birthday Bash at the Cabo Wabo Cantina in Cabo San Lucas, Mexico. But while Hagar is celebrating 79 in style over three nights Oct. 9, 11 and 13 of guest-filled rock n roll festivities, he already has his eye on turning 80 with a different kind of party next year. My dream would be to play somewhere where I can accommodate every ticket request, and everybody who never got to be at the Bash could come to this final bash, Hagar tells Billboard via Zoom from Southern California ahead of his birthday on Tuesday (Oct. 13). Hagar says that this year he received 100,000 requests for about 1,600 tickets over the three nights, a number that continues to grow every year. I would love to be able to say to everyone, Guess what? You re all gonna be able to get a show. If I have to play four or five nights somewhere, maybe I play a big stadium, maybe we block off the whole town of Cabo and do it for free. I don t know what we re gonna do yet, but I do know for my 80th birthday, that would be the dream. For Those About to Bash… As he ponders that, Hagar has plans in motion for the upcoming birthday bash as much as one can plan for an event that routinely brings surprise performances from some of music s biggest names including, in the past, Kenny Chesney, the late Toby Keith, Alice Cooper, members of the Grateful Dead, Metallica, the Red Hot Chili Peppers and Alice in Chains. Their appearances are often spontaneous; Belinda Carlisle comes last year, Hagar remembers, and, ‘Well, shoot, I ve got to get her on stage, so what are we gonna do?’ So, boom, we just learned We Got the Beat and Heaven Is a Place On Earth backstage, finishing our cocktails, and then just ran out there and did it. “That s part of the charm of the Birthday Bash. It s not rehearsed, and we never know really what we re gonna do. I don t invite people; I just invite kind of a house band, you might say. I ve got a repertoire of about 400 songs, and if somebody says they know one of them we throw it together real quick and go out and do it. For this year’s Birthday Bash, Hagar has assembled a house band reuniting him with members of his Waboritas guitarist Vic Johnson and bassist Mona Gnader joined by drummer Kenny Aronoff from Chickenfoot and Hagar s recent Van Halen-oriented Best of All Worlds band, and guitarist Stevie Salas. (Van Halen and Best of All Worlds bassist Michael Anthony, Hagar s regular sidekick, is on a family cruise to celebrate ", "date_str": "2026-10-13T14:00:00+00:00", "hash": "43afc574b8f43902", "title_fa": "سمی هاگار 79 سالگی را با Star-Studded Bash جشن می گیرد، امیدهای خود را برای \"اتحاد\" ون هالن به اشتراک می گذارد.", "summary_fa": "سامی هاگار برای سی و ششمین سال خود را برای جشن تولد این هفته در Cabo Wabo Cantina در کابو سان لوکاس، مکزیک آماده می کند. اما در حالی که هاجر در سه شب 9، 11 و 13 اکتبر جشن های پر از مهمان راک اند رول به سبک 79 سالگی خود را جشن می گیرد، او در حال حاضر چشمش به 80 سالگی با جشنی متفاوت در سال آینده است. هاگار به بیلبورد از طریق زوم از جنوب کالیفرنیا پیش از تولدش در روز سه شنبه (13 اکتبر) به بیلبورد می گوید: رویای من این است که در جایی بازی کنم که بتوانم تمام درخواست های بلیط را برآورده کنم، و هرکسی که هرگز در Bash حضور نداشته باشد بتواند به این دیدار نهایی بیاید. هاجر می گوید که امسال 100000 درخواست برای حدود 1600 بلیت در سه شب دریافت کرده است، این تعداد هر سال همچنان در حال افزایش است. من دوست دارم بتوانم به همه بگویم، حدس بزنید چیست؟ همه شما می توانید نمایشی داشته باشید. اگر قرار باشد چهار یا پنج شب در جایی بازی کنم، شاید در یک استادیوم بزرگ بازی کنم، شاید کل شهر کابو را مسدود کنیم و این کار را رایگان انجام دهیم. من هنوز نمی دانم که قرار است چه کار کنیم، اما می دانم که برای تولد 80 سالگی من، این رویا خواهد بود. برای کسانی که در شرف بشار هستند… همانطور که او فکر می‌کند، هاگار برای جشن تولد آینده برنامه‌هایی دارد، به همان اندازه که می‌توان برای رویدادی برنامه‌ریزی کرد که به طور معمول اجراهای غافلگیرکننده‌ای از برخی از بزرگ‌ترین نام‌های موسیقی از جمله کنی چسنی، توبی کیت فقید، آلیس کوپر، اعضای گروه Grateful Dead، ردینس و متالیک را به همراه دارد. ظاهر آنها اغلب خود به خود است. هاگار به یاد می‌آورد که بلیندا کارلایل سال گذشته"}, {"source": "Billboard", "title": "Elderbrook Signs With Counter Records, Announces New Album: ‘Well Positioned for Even Greater Success’", "link": "https://www.billboard.com/pro/elderbrook-new-album-counter-records-label-signing/", "summary": "Elderbrook has signed with Counter Records, a Ninja Tune label. The English producer will release his fourth studio album, Heart on a Wire , on the label Jan. 22. The album will find Elderbrook focused on an intimate, rock-inspired approach to electronic music, with the project s themes including, a press release notes, the fragility of youth, the feeling of losing touch with who you once were, and the long, imperfect process of rediscovering the curiosity, openness, and childlike wonder we once possessed. The 10-song album s lead single, Lost in the View, is out Tuesday (Oct. 13.) The album s artwork was designed by creative director Charlie Drinkwater , who has previously worked with artists including Porter Robinson, Fontaines D.C., James Arthur,and Dermot Kennedy. Related Galantis Signs With Ninja Tune s Counter Records Imprint: A Freedom and Inspiration I Haven t Felt In a Long Time Hilary Duff to Receive Outstanding Pop Tour of the Year Award at 2026 Billboard Live Music Summit Judge Rules Woman Accused of Shooting at Rihanna A$AP Rocky s Home Mentally Fit to Stand Trial Elderbrook currently has more than 9.9 million monthly listeners on Spotify and a catalog that includes hits like the 2017 Camelphat collab Cola and Inner Light with Bob Moses. The latter song reached No. 13 on Billboard s Hot Dance/Electronic Songs chart last fall. His most recent album, Another Touch , was released by Mine Recordings in 2024. “I’m really excited to release an album that feels this true to who I am as a musician with Ninja Tune, Elderbrook said in a statement. In a lot of ways, Heart on a Wire feels like the music I was always meant to make. I found myself going back to how I approached music when I first started my career, following ideas instinctively, without thinking too much about where they were supposed to fit or what they were supposed to become. There was a freedom in that, and I think reconnecting with it allowed me to make something more honest, more personal, and ultimately more me.” Elderbrook is an immensely talented artist, added Ninja Tune s managing director of North America Marie Clausen . He s not only an exceptional performer, singer, and producer, but he also has a rare ability to connect with audiences on a deeply emotional level. That connection is at the heart of his success and what makes him such a special artist. Together with Red Light Management, The Team and Counter Records, a Ninja Tune label, he has built an exceptional team around hi", "date_str": "2026-10-13T14:00:00+00:00", "hash": "d587ed86ee9f3b68", "title_fa": "الدربروک با Counter Records امضا می‌کند، آلبوم جدیدی را اعلام می‌کند: \"برای موفقیت حتی بیشتر موقعیت خوبی دارد\"", "summary_fa": "الدربروک با Counter Records، یک لیبل Ninja Tune قرارداد امضا کرده است. این تهیه کننده انگلیسی چهارمین آلبوم استودیویی خود را با نام Heart on a Wire در 22 ژانویه با لیبل منتشر خواهد کرد. الدربروک بر روی یک رویکرد صمیمی و الهام گرفته از راک به موسیقی الکترونیک متمرکز شده است، با مضامین پروژه شامل یادداشت‌های مربوط به مطبوعات، شکنندگی دوران جوانی، احساس از دست دادن ارتباط با کسی که زمانی بوده‌اید، و روند طولانی و ناقص کشف مجدد کنجکاوی، صراحت، و شگفتی کودکانه‌ای که زمانی داشتیم. تک آهنگ اصلی آلبوم 10 آهنگی، Lost in the View، سه شنبه (اکتبر. 13.) آثار هنری آلبوم توسط مدیر خلاق چارلی درینکواتر طراحی شده است که قبلا با هنرمندانی از جمله پورتر رابینسون، فونتینز دی سی، جیمز آرتور و درموت کندی کار کرده است. علامت‌های مرتبط گالانتیس با ضبط‌های شمارنده نینجا تیون اثر: آزادی و الهامی که در مدت‌زمان احساس نکرده‌ام هیلاری داف برای دریافت جایزه بهترین تور پاپ سال ۲۰۲۶ در اجلاس موسیقی زنده بیلبورد، قاضی حکم می‌دهد زن متهم به تیراندازی در Rihanna Elider است. در حال حاضر بیش از 9.9 میلیون شنونده ماهانه در Spotify دارد و کاتالوگی شامل آثاری مانند Cola 2017 Camelphat و Inner Light با باب موزس است. آهنگ آخر پاییز گذشته به رتبه 13 جدول آهنگ های رقص داغ/الکترونیک بیلبورد رسید. الدربروک در بیانیه‌ای گفت: جدیدترین آلبوم او، Another Touch، توسط Mine Recordings در سال 2024 منتشر شد. الدربروک در بیانیه‌ای گفت: «من واقعاً هیجان‌زده هستم که آلبومی را منتشر کنم که به عنوان یک نوازنده با Ninja Tune این احساس را دارد."}, {"source": "Billboard", "title": "Cristian Castro to Receive Lifetime Achievement Award at the 2026 Billboard Latin Music Awards", "link": "https://www.billboard.com/music/latin/cristian-castro-billboard-lifetime-achievement-award-2026-1236359488/", "summary": "Cristian Castro will be honored with the Billboard Lifetime Achievement Award at the 2026 Billboard Latin Music Awards, Billboard and Telemundo can announce Tuesday (Oct. 13). The Mexican pop icon will receive the accolade in recognition of an exceptional career spanning over three decades and his enduring influence on Latin music. Castro will also take the stage for a special performance during the ceremony, which will air live on Thursday, Oct. 22, at 8 p.m. ET on Telemundo and Peacock from the James L. Knight Center in Miami. Related Billboard Latin Music Awards 2026: All the Performers Presenters, How to Watch More Peso Pluma Leads 2026 Billboard Latin Music Awards Finalists: Complete List Jonas Brothers Barely Audible Over Screaming Fans During Spirited Banana Bowl 9th Inning Performance “Receiving the Billboard Lifetime Achievement Award is a tremendous honor and a very special moment in my career, Castro said in a statement. Music has given me the privilege of connecting with audiences for more than three decades and knowing that these songs have become part of people’s lives means more to me than I can express. I’m deeply grateful to Billboard for this recognition and to the fans who have accompanied me throughout this journey. I look forward to celebrating with them on the Billboard Latin Music Awards stage.” The Billboard Lifetime Achievement Award is presented to an artist with an enduring and exceptional career whose work has expanded the reach of Latin music worldwide. The honor recognizes artists who remain relevant through their artistic and personal contributions, and whose influence has made a significant impact on Latin music around the world. Past recipients include Andrea Bocelli, Armando Manzanero, Carlos Santana, José José, Maná, Marco Antonio Solís, Ricardo Arjona and Roberto Carlos, among others. Castro has established himself as one of the defining voices of Latin pop and romantic music. His history on the Billboard charts began in 1992, when “No Podrás” became his first entry on Hot Latin Songs, reaching No. 3. His debut album, Agua Nueva , reached No. 2 on Top Latin Pop Albums in January 1993. Since then, Castro has earned six No. 1s on Hot Latin Songs, including “Nunca Voy a Olvidarte,” “Amor” and “Azul,” which spent four, 11 and nine weeks at the top, respectively. Years later, Viva El Príncipe , his tribute to legendary Mexican singer José José, spent seven weeks at No. 1 on Top Latin Albums in 2011. With more than 12 million ", "date_str": "2026-10-13T13:45:00+00:00", "hash": "49659234194c27e8", "title_fa": "کریستین کاسترو جایزه یک عمر دستاورد را در جوایز موسیقی لاتین بیلبورد 2026 دریافت می کند", "summary_fa": "کریستین کاسترو با جایزه یک عمر دستاورد بیلبورد در جوایز موسیقی لاتین بیلبورد در سال 2026 تجلیل خواهد شد، بیلبورد و تلموندو می توانند سه شنبه (13 اکتبر) اعلام کنند. نماد موسیقی پاپ مکزیکی به پاس قدردانی از حرفه ای استثنایی که بیش از سه دهه را در بر می گیرد و تأثیر ماندگار او بر موسیقی لاتین تحسین می شود. کاسترو همچنین برای اجرای ویژه در این مراسم روی صحنه می رود که پنجشنبه 22 اکتبر ساعت 20 به صورت زنده پخش می شود. ET در Telemundo و Peacock از مرکز James L. Knight در میامی. جوایز موسیقی لاتین بیلبورد مرتبط 2026: همه مجریان مجری، نحوه تماشای بیشتر پزو پلوما پیشروهای 2026 جوایز موسیقی لاتین بیلبورد فینالیست‌های جوایز موسیقی لاتین بیلبورد: فهرست کامل برادران جوناس به سختی شنیده می‌شوند از طرفداران فریاد می‌زنند در طول اجرای نهمین اینینگ کاسه موز روحیه‌دار «دریافت بیلبورد یک لحظه خاص و افتخاری برای من است. کاسترو در بیانیه ای گفت که حرفه ای. موسیقی بیش از سه دهه به من این امتیاز را داده است که با مخاطبان ارتباط برقرار کنم و دانستن اینکه این آهنگ‌ها بخشی از زندگی مردم شده‌اند برای من بیش از آن چیزی است که بتوانم بیان کنم. من عمیقاً از بیلبورد برای این شناخت و از طرفدارانی که در طول این سفر من را همراهی کردند سپاسگزارم. من مشتاقانه منتظر جشن گرفتن با آنها در صحنه جوایز موسیقی لاتین بیلبورد هستم.\" جایزه یک عمر دستاورد بیلبورد به هنرمندی با حرفه ای ماندگار و استثنایی اهدا می شود که آثارش دامنه موسیقی لاتین را در سراسر جهان گسترش داده است. این افتخار از هنرمندانی قدردانی می‌کند که از طریق مشارکت‌های هنری و شخصی‌شان مرتبط باقی می‌مانند و تأثیرشان تأثیر قابل‌توجهی بر موسیقی لاتین در سراسر جهان گذاشته است. دریافت کنندگان گذشته عبارتند از: آندره آ بوچلی، آرماندو مانزانرو، کارلوس"}, {"source": "Billboard", "title": "When Donny Met Donnie — New Kids on the Block Welcome ‘Legendary’ Pop Singer at Las Vegas Residency", "link": "https://www.billboard.com/music/pop/new-kids-on-the-block-las-vegas-residency-donny-osmond-1236359692/", "summary": "New Kids on the Block have already established themselves as part of a new generation of Las Vegas legends with their yearlong New Kids on the Block: The Right Stuff residency at Dolby Live at Park MGM. But on Saturday (Oct. 10), they unlocked a new level of Sin City status when they invited a fellow Vegas icon to join them on stage. Related Amyl and the Sniffers to Headline Golden Hour at Bondi Beach in 2027 Donnie Wahlberg Predicts That Final NKOTB Las Vegas Shows Will Be Super Emotional For Group, Hints at a Merry, Merry Surprise For Fans New Kids on the Block Las Vegas Residency Getting Remixed for Final 16 Shows With All-New Setlist, Wardrobe More According to a video posted by the group , member Donnie Wahlberg, 57, was singing as fans began to freak out at the sight of Osmonds legend Donny Osmond slowly walking up to the stage and putting his arm around Wahlberg. The Boston Blue star literally leaned into the moment, laying his head on Osmond s shoulder as the two men smiled and soaked up the rapturous screams from the audience. Consummate showman Osmond, 68, of course, had the perfect quip for the moment, saying, two Donnies for the price of one before the pair exchanged I love you man greetings. They then teamed up to sing a duet on the 1988 NKOTB ballad I Need You from their Hangin Tough album. In true Vegas fashion, we welcomed the legendary @donnyosmond to the NKOTB stage last night! What a moment 🤍, the band wrote of the surprise superstar summit. In the comments, Wahlberg said, Before there was Donnie, there was Donny! The duet ended with the rest of the Kids joining the Dons for a jubilant spinning group hug. NKOTB weren t the only ones loving the moment, as singer India.Arie weighed in in the comments, writing, Donny Osmond is an A+ technical vocalist. i LOVE watching him execute, with TLC s Chilli adding, Amazing 👏🏽. Wahlberg s wife, Jenny McCarthy Wahlberg was also loving it, commenting, EPIC, with the group calling it a night we won t forget!! NKOTB member Joey McIntyre gave some context for the team-up in the comments, explaining, “I got to see Donny’s show in Vegas last Tuesday amazing by the way! We hung out after backstage and we decided there that he had to surprise everyone at our residency. And we all came together to make it happen. I was nervous that Donny wouldn’t make it in time- BECAUSE HE JUST FINISHED HIS SHOW and ran right over to ours. McIntyre said the men hit it out of the park, thanking Osmond for being the most ground", "date_str": "2026-10-13T13:07:27+00:00", "hash": "21a8c81d5754efdf", "title_fa": "وقتی دانی با دانی ملاقات کرد - بچه های جدید در بلوک از خواننده پاپ «افسانه ای» در اقامتگاه لاس وگاس استقبال کردند", "summary_fa": "New Kids on the Block قبلاً با اقامت سالانه New Kids on the Block: The Right Stuff در Dolby Live در Park MGM خود را به عنوان بخشی از نسل جدیدی از افسانه های لاس وگاس معرفی کرده اند. اما روز شنبه (10 اکتبر)، زمانی که از یک نماد دیگر وگاس دعوت کردند تا به آنها روی صحنه بپیوندد، سطح جدیدی از وضعیت شهر گناه را باز کردند. Amyl and the Sniffers to Headline Golden Hour at Bondi Beach 2027 دانی والبرگ پیش‌بینی می‌کند که نمایش‌های نهایی NKOTB لاس وگاس برای گروه فوق‌العاده احساسی خواهد بود، اشاره‌هایی به یک سورپرایز شاد و شاد برای طرفداران بچه‌های جدید در Block Residency لاس‌وگاس با توجه به لیست War6 Remixed بیشتر برای Finallist. ویدئویی ارسال شده توسط گروه، عضو دانی والبرگ، 57 ساله، در حال آواز خواندن بود، در حالی که طرفداران با دیدن اسطوره Osmonds، Donny Osmond که به آرامی به سمت صحنه می رفت و بازوی خود را دور والبرگ قرار می داد، وحشت کردند. ستاره آبی بوستون به معنای واقعی کلمه به آن لحظه خم شد و سر خود را روی شانه آزموند گذاشت در حالی که دو مرد لبخند می زدند و فریادهای هیجان انگیز تماشاگران را خیس می کردند. البته اوسموند 68 ساله شومن عالی در حال حاضر شوخی خوبی داشت و گفت: دو تا دانی به قیمت یکی قبل از اینکه این جفت با هم درودهای دوستت دارم را رد و بدل کنند. سپس آنها با هم متحد شدند تا در تصنیف NKOTB 1988 I Need You از آلبوم Hangin Tough خود یک دوئت بخوانند. به سبک واقعی وگاس، دیشب از @donnyosmond افسانه ای در مرحله NKOTB استقبال کردیم! چه لحظه ای 🤍، گروه از اجلاس سوپراستار غافلگیرکننده نوشت. والبرگ در نظرات گفت: قبل از اینکه دانی وجود داشته باشد، دانی وجود داشته است! این دوئت با"}, {"source": "Billboard", "title": "Evanescence, The Offspring & Billy Corgan Lead 2027 iHeartRadio ALTer EGO Lineup", "link": "https://www.billboard.com/music/rock/2027-iheartradio-alter-ego-lineup-evanescence-offspring-1236359528/", "summary": "Evanescence , The Offspring and Billy Corgan are teaming up for a night of alternative rock when iHeartRadio ALTer EGO returns to Los Angeles in January. The 2027 edition of the annual concert event will take place Saturday, Jan. 16, at the Kia Forum in Inglewood, California, and Billboard is exclusively announcing the lineup, which also includes Death Cab for Cutie , Slightly Stoopid , Modest Mouse , Young the Giant , The Warning and Temper City will also perform, with Corgan set to make a special solo appearance. Related ‘This Is Definitely An Up’: Evanescence s Amy Lee Reflects on Latest Album ‘Sanctuary’ And World Tour The Offspring s Dexter Holland Joins Electric Callboy on New Single Let the Good Times Roll How Death Cab for Cutie Recaptured Its Roots for I Built You a Tower Hosted by Woody of ALT 98.7 s nationally syndicated The Woody Show , the concert will bring together established alternative-rock acts and newer artists for a night spanning multiple generations of the genre. Fans who can t make it to the Kia Forum will be able to tune in through iHeartRadio s alternative and rock stations nationwide, as well as the iHeartRadio app. Corgan s appearance among the star-studded lineup is one of the night s most notable draws. Best known as the frontman of the Smashing Pumpkins , the singer/songwriter will perform solo instead of with his legendary band. Meanwhile, Evanescence will bring its signature blend of hard rock and gothic atmosphere to the stage, while The Offspring will bring forth its punk-rock discography to the mix. The lineup also brings other familiar names in alternative music. Death Cab, known for Billboard Hot 100 hits including Soul Meets Body will join Modest Mouse, who also hold a Hot 100 spot with Float On, one of the most defining indie rock songs of the 2000s. Young the Giant will bring their anthemic alternative sound to the event, alongside Southern California favorites Slightly Stoopid. Rounding out the bill are The Warning, the Mexican rock trio made up of sisters Daniela, Paulina and Alejandra Villarreal, and Temper City, who earned their first Billboard No. 1 over the summer when Self Aware topped Alternative Airplay. It s truly going to be a night for the books, Lisa Worden, program director for ALT 98.7 and senior vice president of rock and alternative for iHeartMedia, said in a statement provided to Billboard . The concert is part of iHeartMedia s annual slate of live music events, which also includes the iHeartRadio ", "date_str": "2026-10-13T12:30:00+00:00", "hash": "907bfc758a7378ed", "title_fa": "ایوانسنس، فرزندان و بیلی کورگان سرب 2027 iHeartRadio ALTer EGO Lineup", "summary_fa": "Evanescence، The Offspring و Billy Corgan برای یک شب موسیقی آلترناتیو با هم متحد می شوند، زمانی که iHeartRadio ALTer EGO در ژانویه به لس آنجلس بازمی گردد. رویداد سالانه کنسرت سال 2027 شنبه، ژانویه برگزار خواهد شد. 16، در انجمن کیا در اینگلوود، کالیفرنیا، و بیلبورد به طور انحصاری این ترکیب را اعلام می کند که شامل Death Cab for Cutie، Slightly Stoopid، Modest Mouse، Young the Giant، The Warning و Temper City نیز می شود و کورگان قرار است یک ظاهر انفرادی ویژه داشته باشد. مرتبط با «این قطعا یک پیشرفت است»: امی لی از Evanescence در مورد آخرین آلبوم «Sanctuary» و تور جهانی منعکس می کند. این کنسرت که در سال 98.7 سندیکای ملی وودی شو برگزار می‌شود، بازیگران راک آلترناتیو راک و هنرمندان جدیدتر را برای شبی که چندین نسل از این ژانر را در بر می‌گیرد گرد هم می‌آورد. طرفدارانی که نمی توانند به انجمن کیا راه یابند، می توانند از طریق ایستگاه های جایگزین و راک iHeartRadio در سراسر کشور و همچنین برنامه iHeartRadio، وارد شوند. ظاهر کورگان در میان تیم پر ستاره یکی از برجسته ترین قرعه کشی های شب است. این خواننده/ترانه سرا که بیشتر به عنوان رهبر گروه Smashing Pumpkins شناخته می شود، به جای گروه افسانه ای خود به صورت انفرادی اجرا خواهد کرد. در همین حال، Evanescence ترکیبی از هارد راک و فضای گوتیک را به صحنه خواهد آورد، در حالی که The Offspring دیسکوگرافی پانک-راک خود را به این میکس ارائه خواهد کرد. این ترکیب همچنین نام های آشنا دیگری را در موسیقی آلترناتیو به ارمغان می آورد. Death Cab که با آهنگ های Billboard Hot 100 از جمله Soul Meets Body شناخته می شود، به Modest Mouse ملحق خواهد شد که همچنین با Float On، یکی از تعیین کننده ترین آهنگ های راک مستقل دهه 2000، در"}, {"source": "Billboard", "title": "New Documentary to Tell the Story of Founding Jackson 5 Members Brothers Jackie, Jermaine, Marlon and Tito Jackson", "link": "https://www.billboard.com/music/pop/documentary-story-jackson-5-jackie-jermaine-marlon-tito-1236359685/", "summary": "And upcoming documentary feature will tell the story of the Jackson brothers not named Michael. According to Variety , the as-yet-untitled feature will trace the path of the four founding members of the Jackson 5 — siblings Jackie, Jermaine, Marlon and Tito Jackson — in a 90-minute feature film that will also be available as a three-part series. According to a description, the three-years-in-the-making film tells the story of four brothers and their journey as part of one of the world’s earliest and most successful and influential boy bands of all time and the various roads each of their lives took.” Directed by Benjamin Hirsch ( JANET. , Bruno v Tyson ) the movie will trace the “extraordinary rise, triumph, fractures and reunion,” of the siblings from Gary, Ind. who rose to global superstardom in 1964 from humble beginnings. The family band — including youngest brother, Michael — signed to Motown Records in 1968 and became the first group to debut with four consecutive No. 1 hits on the Billboard Hot 100: I Want You Back, ABC, The Love You Save and I ll Be There. Variety reported that the project features the final interview with Tito Jackson before his death in 2024 at 70 and employs observational filming, rare archive footage, previously unseen material and recollections from the four siblings about how they were shaped by their domineering father/manager, Joe Jackson. A description alludes to father Joe s uncompromising determination, which turned family rehearsals into a relentless training ground, adding that, the four remember those early rehearsals differently — the pressure, the competition, the laughter between takes and the sense that, even as children, something extraordinary might be happening. They also remember their mother Katherine at the heart of the family operation, as they began to venture out beyond Gary.” The group left Motown in 1976 to sign with Epic Records, with Jermaine being replaced by younger brother Randy in the act rechristened The Jacksons. They continued to score hits, including 1978 s disco-fied Shake Your Body (Down to the Ground) and 1981 s Can You Feel It, with Michael famously exploding into international superstardom in 1979 with his breakout solo LP Off the Wall . Director Hirsch said that following his work on the four-part 2022 documentary series JANET. , having the opportunity to work with the Jackson brothers is a huge privilege. From listening to their untold and amazing stories, delving into their rare and of", "date_str": "2026-10-13T12:25:02+00:00", "hash": "e754cd2f78cf39de", "title_fa": "مستند جدیدی برای روایت داستان بنیانگذار جکسون 5 عضو برادران جکی، جرمین، مارلون و تیتو جکسون", "summary_fa": "و مستند آینده داستان برادران جکسون به نام مایکل را روایت خواهد کرد. به گزارش ورایتی، این فیلم که هنوز عنوانی ندارد، مسیر چهار عضو بنیانگذار جکسون 5 - خواهر و برادر جکی، جرمین، مارلون و تیتو جکسون - را در یک فیلم بلند 90 دقیقه ای که به صورت مجموعه ای سه قسمتی نیز در دسترس خواهد بود، ردیابی می کند. طبق توضیحات، این فیلم سه ساله در حال ساخت است، داستان چهار برادر و سفر آنها به عنوان بخشی از اولین و موفق ترین و تاثیرگذارترین گروه های پسر در تمام دوران ها و مسیرهای مختلفی که زندگی هر یک از آنها طی کرده است را روایت می کند. این فیلم به کارگردانی بنجامین هیرش (JANET. , Bruno v Tyson) \"خیزش خارق العاده، پیروزی، شکستگی ها و اتحاد مجدد\" خواهر و برادری از گری، هند را که در سال 1964 از ابتدا فروتنانه به سوپراستار جهانی رسیدند را دنبال می کند. گروه خانوادگی - از جمله برادر کوچکترش، مایکل - در سال 1968 با Motown Records قرارداد امضا کردند و اولین گروهی شدند که با چهار آهنگ شماره 1 پیاپی در Billboard Hot 100 شروع به کار کردند: I Want You Back، ABC، The Love You Save و I ll Be There. ورایتی گزارش داد که این پروژه شامل مصاحبه نهایی با تیتو جکسون قبل از مرگ او در سال 2024 در 70 سالگی است و از فیلمبرداری مشاهده‌ای، فیلم‌های آرشیو کمیاب، مطالبی که قبلا دیده نشده بود و خاطراتی از چهار خواهر و برادر درباره نحوه شکل‌گیری آنها توسط پدر/مدیر سلطه‌جو، جو جکسون، استفاده می‌شود. شرحی به عزم سازش ناپذیر پدر جو اشاره می کند که تمرینات خانوادگی را به یک زمین تمرین بی امان تبدیل می کند و اضافه می کند که این چهار نفر آن تمرینات اولیه را به شکل متفاوتی به یاد می آورند"}, {"source": "Billboard", "title": "Sean Ono Lennon Clarifies Fan Speculation About How John Lennon Divided Inheritance Between Him and Half Brother Julian", "link": "https://www.billboard.com/music/pop/sean-lennon-clarifies-john-lennon-inheritance-brother-julian-1236359647/", "summary": "Sean Ono Lennon took to X over the weekend to clarify how his late father, John Lennon, provided for him and his half brother Julian Lennon before the former Beatles tragic murder in 1980. Replying to a post on Sunday (Oct. 11) in which someone presumed , One guy inherited most of the estate, the other largely cut out and forced to engaged in decades-long litigation in pursuit of a comparatively small share of it. Unbearably painful and enraging for the one, surely pretty darn awkward for the other. That they remain friends (and largely always were) is testimony to the redemptive power of being a chill dude with broad implications for the wider world. The comment was tied to a post from Sean a day earlier of the Lennon brothers enjoying a nice day out in nature to celebrate his 51st birthday and, according to Sean, the commenter got it all wrong. Julian and I inherited the same amount from our dad, he wrote . Our trusts were equal. Although his was slightly more, but negligibly so. Sean is the adult son of John and wife Yoko Ono and Julian, 63, is Lennon s eldest, from his six-year marriage to his first wife, Cynthia Lennon. The men appear to have developed a close relationship and often share pictures together on their socials, including posing together at the 2021 Los Angeles premiere of the Peter Jackson s Beatles miniseries Get Back (see above). Both men are musicians, with Julian scoring a pair of top 10 Billboard Hot 100 hits from his 1984 debut album, Valotte , Too Late For Goodbyes (No. 5) and the title track (No. 9) and releasing six more albums in the years since, including 2022 s Jude , whose title is a reference to the Beatles Hey Jude, famously written by Paul McCartney in 1968 to comfort a young Julian during his parents divorce. Sean Ono Lennon has had a long, eclectic music career as a member of a number of bands, including the Ghost of a Saber Tooth Tiger, Cibo Matto, the Claypool Lennon Delirium and the Plastic Ono Band. He s released three solo albums to date, 1998 s Into the Sun , 2006 s Friendly Fire and 2024 s Asterisms .", "date_str": "2026-10-13T11:46:02+00:00", "hash": "0e1dcbc7b07e522d", "title_fa": "شان اونو لنون گمانه زنی طرفداران را در مورد چگونگی تقسیم ارث بین خود و برادر ناتنی جولیان توسط جان لنون روشن می کند.", "summary_fa": "شان اونو لنون در آخر هفته به ایکس رفت تا روشن کند که چگونه پدر فقیدش، جان لنون، او و برادر ناتنی‌اش جولیان لنون را قبل از قتل غم انگیز سابق بیتلز در سال 1980 تأمین می‌کرد. در پاسخ به پستی در روز یکشنبه (11 اکتبر) که در آن شخصی تصور می‌کرد که یکی از افراد بیشتر از دیگران را به ارث برده است. دعوای قضایی چند دهه ای در تعقیب سهم نسبتاً کمی از آن. برای یکی فوق‌العاده دردناک و خشم‌انگیز، مطمئناً برای دیگری بسیار ناخوشایند. اینکه آنها دوستان باقی می‌مانند (و عمدتاً همیشه بوده‌اند) گواه قدرت رستگاری یک آدم سرد بودن با پیامدهای گسترده‌ای برای جهان گسترده‌تر است. این نظر با پستی از شان یک روز قبل مرتبط بود که در آن برادران لنون از یک روز خوب در طبیعت برای جشن تولد 51 سالگی خود لذت می بردند و به گفته شان، نظر دهنده همه چیز را اشتباه گرفته بود. من و جولیان همین مقدار را از پدرمان به ارث بردیم، او نوشت. اعتمادهای ما برابر بود. اگرچه او کمی بیشتر بود، اما بسیار ناچیز بود. شان پسر بالغ جان و همسرش یوکو اونو است و جولیان 63 ساله بزرگترین لنون از ازدواج شش ساله او با همسر اولش سینتیا لنون است. به نظر می‌رسد این مردان رابطه نزدیکی برقرار کرده‌اند و اغلب عکس‌هایی را با هم در شبکه‌های اجتماعی خود به اشتراک می‌گذارند، از جمله ژست گرفتن با هم در اولین اکران مینی‌سریال بیتلز پیتر جکسون در سال 2021 در لس‌آنجلس Get Back (به بالا مراجعه کنید). هر دو موزیسین هستند، جولیان یک جفت از 10 آهنگ برتر بیلبورد 100 را از اولین آلبوم خود در سال 1984، Valotte، Too Late For Goodbyes (شماره 5) و آهنگ عنوان (شماره. 9) و انتشار شش آلبوم دیگر در سال های پس از آن، از جمله جود 2022، که"}, {"source": "Billboard", "title": "RAYE Blames ‘AI Bots’ After Presale For Intimate London Show Clocks 1.8 Million Sign-Ups: ‘This Experience Has Really Opened My Eyes’", "link": "https://www.billboard.com/music/pop/raye-royal-albert-hall-ai-bots-scalpers-ticket-sales-1236359638/", "summary": "RAYE has blamed “AI bots” and “scalpers” for disrupting a ticket onsale after 1.8 million presale sign-ups were registered for her upcoming show at London’s Royal Albert Hall. Related ‘Terrified,’ ‘Grateful,’ ‘Happy’: How RAYE Went Indie Exploded RAYE, Olivia Dean More to Perform Live at 2026 Mercury Prize Ceremony RAYE Shares the Best Clapback After Hater Calls Her a One Hit Wonder : Just Saying Writing on Instagram on Tuesday (Oct. 13), the British singer revealed that “hundreds of thousands of fake registrations” were recorded for the one-night-only show slated to take place on Oct. 23 at the iconic 5,000-capacity venue. At the show, RAYE is due to reimagine her hit LP This Music May Contain Hope alongside the Heritage Orchestra. She wrote: We received 1.8 million sign-ups for 5000 seats for This Symphony May Contain Hope. Sadly our sign-up process was overwhelmed by scalpers, using AI bots to create hundreds of thousands of fake registrations.” RAYE added, It is a new world we are living in now, I have never witnessed bots on this scale. It is so important to me that fans can buy tickets at the face value price. As a result, RAYE said her team had been forced to take extra measures to “manually review” the list to ensure that real fans were part of the resale process. Therefore rather than risk opening a presale that scalpers could exploit, we felt the best and safest solution for this specific show was to manually review the sign-up list to identify a shortlist of people we believe are real fans, she said. Selected fans should have received a presale link and code by email by 11:45 a.m. BST today, with the first sale commencing at midday. Remaining tickets will then go on general sale later this week. She concluded: I m not sure what the future holds for ticketing, I do know this experience has really opened my eyes. Me and my team are going to think really hard about what we can do in the future.” This Music May Contain Hope is nominated for the Mercury Prize, which will be presented at a ceremony in Newcastle the day before the show (Oct. 22). RAYE is due to perform at the event alongside several other nominated acts including Olivia Dean and Florence + the Machine. The LP charted at No. 1 on the U.K.’s Official Albums Chart and No. 11 on the Billboard 200. See RAYE s post below. View this post on Instagram", "date_str": "2026-10-13T11:42:25+00:00", "hash": "91cb63e9c3d2e474", "title_fa": "RAYE «ربات‌های هوش مصنوعی» را پس از پیش فروش برای نمایش 1.8 میلیون ثبت‌نامی در لندن مقصر می‌داند: «این تجربه واقعاً چشمانم را باز کرد»", "summary_fa": "RAYE «ربات‌های هوش مصنوعی» و «اسکالپر» را به دلیل اختلال در فروش بلیت پس از ثبت‌نام ۱.۸ میلیون ثبت‌نام پیش‌فروش برای نمایش آینده‌اش در رویال آلبرت هال لندن، مقصر دانست. مربوط به «ترس»، «شکر»، «خوشحال»: چگونه رای مستقل شد رای، اولیویا دین بیشتر برای اجرای زنده در مراسم جایزه مرکوری 2026 RAYE بهترین کلاپ پس از آن را به اشتراک می‌گذارد که Hater او را با یک ضربه شگفت‌انگیز می‌خواند: فقط در سه‌شنبه نوشتن در اینستاگرام (Oct Saying on Instagram. 13)، خواننده بریتانیایی فاش کرد که \"صدها هزار ثبت نام جعلی\" برای نمایش تنها یک شبه که قرار بود در 23 اکتبر در محل نمادین 5000 نفری برگزار شود، ضبط شده است. در این نمایش، RAYE قرار است در کنار ارکستر هریتیج، آلبوم موفق خود را به نام این موسیقی ممکن است حاوی امید باشد، بازسازی کند. او نوشت: ما 1.8 میلیون ثبت نام برای 5000 صندلی برای این سمفونی ممکن است حاوی امید دریافت کنیم. متأسفانه فرآیند ثبت نام ما توسط اسکالپرها غرق شد و از ربات های هوش مصنوعی برای ایجاد صدها هزار ثبت جعلی استفاده کردند. RAYE افزود، این دنیای جدیدی است که ما اکنون در آن زندگی می کنیم، من هرگز شاهد ربات هایی در این مقیاس نبودم. برای من خیلی مهم است که هواداران بتوانند بلیط را به قیمت اسمی بخرند. در نتیجه، RAYE گفت تیم او مجبور شده بود اقدامات بیشتری را برای \"بازبینی دستی\" لیست انجام دهد تا اطمینان حاصل شود که طرفداران واقعی بخشی از فرآیند فروش مجدد هستند. او گفت، بنابراین به‌جای خطر افتتاح پیش‌فروشی که اسکالپرها می‌توانند از آن بهره‌برداری کنند، ما احساس کردیم بهترین و مطمئن‌ترین راه‌حل برای این نمایش خاص، بررسی دستی فهرست ثبت‌نام برای شناسایی فهرست کوتاهی از افرادی است که معتقدیم طرفداران واقعی هستند. طرفداران منتخب باید تا ساعت 11:45 صبح امروز، با شروع اولین فروش"}, {"source": "Billboard", "title": "Rebecca Allen Departs Universal Music U.K. After 27 Years: ‘It’s Been Quite a Ride’", "link": "https://www.billboard.com/pro/rebecca-allen-departs-universal-music-uk/", "summary": "Rebecca Allen is leaving Universal Music Group U.K. after 27 years, she revealed in an internal memo obtained by Billboard U.K. The executive announced her departure in a memo to staff and said she will continue in an advisory role. She most recently served as chief artist and strategy officer, a newly created role which was first announced in 2025. Related Universal Music Group Promotes Frank Briegmann to Chairman CEO Europe, Australia, New Zealand, Canada Deutsche Grammophon Hilary Duff to Receive Outstanding Pop Tour of the Year Award at 2026 Billboard Live Music Summit Judge Rules Woman Accused of Shooting at Rihanna A$AP Rocky s Home Mentally Fit to Stand Trial Prior to that, Allen led the audience and media division and held the title of co-president at the rebooted EMI (2020-2024) alongside Jo Charrington (current president of Capitol U.K.); Allen acted as president of Decca Records from June 2017 to June 2020. “To my friends, colleagues and Universal family, after 27 years at Universal Music, this chapter is coming to an end,” Allen said in the memo to colleagues. “I’ll be stepping away from my current role and, while I’ll remain connected to UMG in an advisory capacity, the time feels right for me to turn the page and make space for a new chapter. “There are, of course, a lot of emotions that come with saying goodbye after so long. Mostly, I feel incredibly fortunate.” Allen added in her memo, “Music and artists have always been at the centre of my world, and the driving force behind every decision I’ve made. To have spent 27 years working alongside such extraordinary artists, and the brilliant people who surround them, has been an enormous privilege.” “I’ve always believed that how you do something matters just as much as what you do. Be kind. Be respectful. Be brave. Continue to push creative boundaries. Make space for brilliant people to be brilliant. Fight for the ideas you believe in. And always put the music and the artist at the heart of everything.” “I leave enormously proud of what we’ve created together, grateful for the friendships, the adventures, the lessons and the laughter, and for 27 years that have shaped me in more ways than I probably even realise yet. It’s been quite a ride. I can’t thank you all enough for being on this journey with me. Love to you all.” Universal Music Group U.K. did not immediately return Billboard U.K. s request for comment.", "date_str": "2026-10-13T11:13:17+00:00", "hash": "346f1f214d763488", "title_fa": "ربکا آلن پس از 27 سال یونیورسال موزیک را ترک می‌کند: «سابقه‌ای بود»", "summary_fa": "ربکا آلن پس از ۲۷ سال گروه موسیقی یونیورسال بریتانیا را ترک می‌کند، او در یک یادداشت داخلی که توسط بیلبورد انگلستان به دست آمده است، فاش کرد که مدیر اجرایی در یادداشتی به کارکنان اعلام کرد که او به عنوان مشاور ادامه خواهد داد. او اخیراً به عنوان هنرمند اصلی و افسر استراتژی خدمت کرده است، نقشی که به تازگی ایجاد شده است که اولین بار در سال 2025 اعلام شد. گروه موسیقی مرتبط یونیورسال فرانک بریگمان را به عنوان مدیرعامل اروپا، استرالیا، نیوزلند، کانادا برای دریافت جایزه بهترین تور پاپ سال 2026 در اجلاس موسیقی زنده بیلبورد، هیلاری داف، استرالیا، نیوزلند، کانادا به عنوان مدیر عامل، معرفی می کند. رهبری بخش مخاطبان و رسانه ها را برعهده داشت و عنوان رئیس مشترک EMI راه اندازی مجدد شده (2020-2024) را در کنار جو چارینگتون (رئیس فعلی کاپیتول بریتانیا) داشت. آلن از ژوئن 2017 تا ژوئن 2020 به عنوان رئیس Decca Records فعالیت می کرد. آلن در یادداشتی به همکارانش گفت: «به دوستان، همکاران و خانواده یونیورسال، پس از 27 سال در یونیورسال موزیک، این فصل رو به پایان است. \"من از نقش فعلی خود دور خواهم شد و در حالی که به عنوان مشاور به UMG متصل خواهم بود، زمان مناسبی برای من است که ورق را برگردانم و فضا را برای فصل جدیدی باز کنم.\" \"البته، پس از مدت ها خداحافظی احساسات زیادی وجود دارد. بیشتر، احساس می کنم فوق العاده خوش شانس هستم.\" آلن در یادداشت خود افزود: «موسیقی و هنرمندان همیشه در مرکز دنیای من بوده اند و نیروی محرکه پشت هر تصمیمی که گرفته ام. گذراندن 27 سال کار در کنار چنین هنرمندان خارق‌العاده‌ای و افراد درخشانی که آنها را احاطه کرده‌اند، یک امتیاز بزرگ بوده است.» \"من همیشه بر این باور بوده ام که نحوه انجام کاری به اندازه کاری که انجام می دهید"}, {"source": "Deadline", "title": "Ridley Scott & Doug Liman Collaborator Alexander Witt To Direct High-Speed Youth Sailboat Racing Feature ‘Feathering The Wind’", "link": "https://deadline.com/2026/10/alexander-witt-speed-youth-sailboat-feathering-wind-1237155596/", "summary": "EXCLUSIVE: Director and cinematographer Alexander Witt is set to direct Feathering the Wind, a coming-of-age feature set against the high-speed world of competitive youth sailboat racing as its producers gear up to take the production to the market at the AFM. Witt has built an extensive career directing and shooting second-unit action for some of [ ]", "date_str": "2026-10-13T14:12:32+00:00", "hash": "2e1ce92a7acabde6", "title_fa": "ریدلی اسکات و داگ لیمان، الکساندر ویت، همکار مسابقه قایق بادبانی جوانان با سرعت بالا، «Feathering The Wind» را کارگردانی می‌کند.", "summary_fa": "اختصاصی: الکساندر ویت، کارگردان و فیلمبردار، فیلم Feathering the Wind را کارگردانی می‌کند، فیلمی که در دوران بلوغ در برابر دنیای پر سرعت مسابقات قایق‌های بادبانی جوانان رقابت می‌کند، زیرا تولیدکنندگان آن آماده می‌شوند تا تولید را به بازار در AFM برسانند. ویت برای برخی از [ ] کارگردانی حرفه‌ای گسترده‌ای در زمینه کارگردانی و فیلم‌برداری اکشن واحد دوم ایجاد کرده است. از آثار کارگردانی او می توان به Resident Evil: Apocalypse و سه گانه فیلم Sayen اشاره کرد. کارهای تجاری او شامل کمپین هایی برای ریباک، هوندا و هلی هانسن و غیره است. در آخرین مهلت تماشا کنید داستان‌های مرتبط اخبار شخصیت‌های ترسناک بی‌بازیکن با انگیزه گیمر به سمت اخبار AFM می‌روند. Gnome Alone دنباله بازی Gnomes From The Nut. اتکینز، که برای اولین بار در فیلم The Blue Lagoon مقابل بروک شیلدز وارد پرده بزرگ شد، بیش از 80 عنوان بازیگری به نام خود دارد. الکساندریا تهیه کننده اجرایی Maserati: The Brothers با تولیدات دیگری از جمله شانس Kaitlyn و Ethan Almighty است. Feathering the Wind به عنوان یک داستان بی انتها در دوران بلوغ است که در برابر سرعت، خطر و شدت مسابقه قایق بادبانی جوانان رقابتی است. اتکینز گفت: من واقعا از حضور الکساندر در کشتی هیجان زده هستم. این یک بلوغ بی انتها است که در سکانس های قایقرانی جوانی با سرعت بالا و باورنکردنی یک F1 روی آب پیچیده شده است. الکساندر حساسیت داستان و تجربه اکشن را به نمایش می گذارد. این یک مسابقه کامل است."}, {"source": "Deadline", "title": "Disney Offers $20M For Character.AI Assets As Startup Files For Chapter 11 Bankruptcy Protection", "link": "https://deadline.com/2026/10/disney-character-ai-chapter-11-bankruptcy-1237155582/", "summary": "After hiring Character.AI s former CEO as its chief technology officer, Disney is looking to acquire assets from the 5-year-old startup as it files for Chapter 11 bankruptcy protection. The company, which allows users to create and interact with AI-generated avatars, said it made the filing in U.S. Bankruptcy Court for the District of Delaware. It [ ]", "date_str": "2026-10-13T14:04:34+00:00", "hash": "05cd310a6e0889de", "title_fa": "دیزنی 20 میلیون دلار برای دارایی های Character.AI به عنوان فایل های راه اندازی برای محافظت از ورشکستگی فصل 11 ارائه می دهد", "summary_fa": "پس از استخدام مدیر عامل سابق Character.AI به عنوان مدیر ارشد فناوری، دیزنی به دنبال به دست آوردن دارایی از این استارت آپ 5 ساله است که برای حفاظت از ورشکستگی فصل 11 تشکیل می دهد. این شرکت که به کاربران امکان ایجاد و تعامل با آواتارهای تولید شده توسط هوش مصنوعی را می دهد، گفت که این پرونده را در دادگاه ورشکستگی ایالات متحده در ناحیه دلاور ثبت کرده است. آن [ ] پس از استخدام شخصیت. مدیرعامل سابق هوش مصنوعی به عنوان مدیر ارشد فناوری خود، دیزنی به دنبال به دست آوردن دارایی از این استارتاپ 5 ساله است، زیرا این شرکت برای حفاظت از ورشکستگی فصل 11 تشکیل می دهد. توافق دیزنی که قبل از تشکیل پرونده به دست آمد، به غول رسانه ای مجوز دائمی غیر انحصاری برای مالکیت فکری و ادعاهای شرکت از Character.AI می دهد. دیزنی 20 میلیون دلار پرداخت می کند و منابع را در طول دوره انتقالی که شرکت در حال بررسی فروش است، فراهم می کند. CharacterAI در بیانیه ای اشاره کرد که دیزنی بر اساس قانون ورشکستگی به عنوان پیشنهاد دهنده برای IP طبقه بندی شده است، اما پیشنهاد آن مشروط به پیشنهادات بالاتر یا بهتر است. اخبار مرتبط، کیت فیلیپس، مدیر محتوای بی‌بی‌سی، می‌گوید: کیت فیلیپس، مدیر محتوای بی‌بی‌سی، هر آنچه درباره پرسی جکسون و المپیک‌های فصل سوم می‌دانیم، می‌گوید: «ما هرگز درباره هوش مصنوعی به مخاطبان دروغ نخواهیم گفت تا کنون دیزنی ماه گذشته کاراندیپ آناند، رئیس سابق Character.AI را به‌عنوان اولین مدیر ارشد فناوری خود منصوب کرد. او مستقیماً به مدیر عامل، جاش دی آمارو، که در اوایل سال جاری جانشین باب ایگر در شغل اصلی شد، با هدف اعلام شده بهبود فناوری و تلاش‌های هوش مصنوعی شرکت گزارش می‌دهد. دی آمارو قبل از اینکه مدیرعامل شود، در دوران تصدی خود به عنوان رئیس بخش تجربیات دیزنی،"}, {"source": "Deadline", "title": "Controversial ‘Downstate’ Delays First Broadway Preview Due To Illness", "link": "https://deadline.com/2026/10/downstate-broadway-opening-date-1237155592/", "summary": "Bruce Norris play Downstate will delay its first Broadway preview by two days due to illness within the company, the show announced today. The new first preview date is Monday, October 19, at Broadway Booth Theatre. Opening night of Sunday, November 15 remains unchanged. Show reps did not specify who was ill or the nature [ ]", "date_str": "2026-10-13T14:01:35+00:00", "hash": "31ad5392776dae11", "title_fa": "بحث برانگیز «Downstate» اولین پیش نمایش برادوی را به دلیل بیماری به تاخیر انداخت", "summary_fa": "این نمایش امروز اعلام کرد که بازی بروس نوریس Downstate اولین پیش نمایش برادوی خود را به دلیل بیماری در شرکت دو روز به تاخیر می اندازد. اولین تاریخ پیش نمایش جدید دوشنبه، 19 اکتبر، در تئاتر غرفه برادوی است. شب افتتاحیه یکشنبه 15 نوامبر بدون تغییر باقی مانده است. نمایندگان نمایش مشخص نکردند که چه کسی بیمار است یا ماهیت [ ] نمایش بحث برانگیز نوریس درباره یک خانه گروهی که مجرمان جنسی محکومان را در خود جای داده است به کارگردانی جو مانتلو و تهیه کنندگی اسکات رودین و بری دیلر است. Downstate به طور گسترده توسط منتقدان در صحنه‌های پیش از برادوی مورد تحسین قرار گرفته است راسر جهان ارتقا داد و کن اوتاک را به عنوان رئیس هیئت مدیره منصوب کرد.", "summary_fa": "سونی موزیک انترتینمنت ژاپن تیم اریکسون را مدیر عامل شرکت Peanuts Worldwide و کن اوتاکه را به عنوان رئیس هیئت مدیره منصوب کرد. اریکسون که در نقش EVP با Peanuts بود، اکنون عملیات تجاری جهانی، جهت استراتژیک و عملکرد مالی شرکت را رهبری خواهد کرد. او بر تمامی کارکردهای تجاری، عملیاتی و سازمانی نظارت خواهد داشت، در حالی که ابتکارات را برای هدایت پایدار [ ] رهبری می کند. به گفته این شرکت، در نقش رئیس در Peanuts Worldwide، او به شکل‌دهی چشم‌انداز بلندمدت شرکت، تقویت همسویی با استراتژی سرگرمی گسترده‌تر سونی و حمایت از گسترش مداوم فرصت‌های تجاری Peanuts در سراسر جهان کمک خواهد کرد. داستان های مرتبط مدیران دادگاه تلویزیون والدین قانون جرم و جنایت راشل استاکمن به مدیرعامل. بنیانگذار دن آبرامز به عنوان رئیس باقی می ماند اخبار فراتر از فیلم Spider-Verse باب پرسیچتی در مورد انتظارات بی حد و حصر طرفداران و هرگز نگفتن نه سونی با پرداخت 457 میلیون دلار برای به دست آوردن 41 درصد از سهام WildBrain، کنترل Peanuts Worldwide را در دسامبر گذشته به دست آورد. این معامله به سونی مالکیت غیرمستقیم 80 درصد از سهام هلدینگ بادام زمینی داد و خانواده چارلز ام. شولز 20 درصد باقی مانده را حفظ کردند. پس از این قرارداد، Peanuts Worldwide به یکی از زیرمجموعه‌های گروه سونی تبدیل شد و Sony Music Entertainment ژاپن رهبری شرکت Peanuts Holdings را با مشارکت Sony Pictures Entertainment بر عهده گرفت. سونی در بیانیه‌ای اعلام کرد که اریکسون و اوتاکه با خانواده شولز برای ایجاد استراتژی‌های پایداری که با میراث برند Peanuts هماهنگ هستند، همکاری خواهند کرد."}, {"source": "Deadline", "title": "The “Algorithm Breaking” ‘Hunkkaar’ Has Challenged Indian Audiences On The Limits Of Procedural TV – And Their Own Beliefs", "link": "https://deadline.com/2026/10/hunkkaar-india-jiohotstar-series-global-breakout-1237150945/", "summary": "Welcome to Global Breakouts, Deadline’s strand in which, each fortnight, we shine a spotlight on the TV shows and films killing it in their local territories. The industry is as globalized as it’s ever been, but breakout hits are appearing in pockets of the world all the time and it can be hard to keep [ ]", "date_str": "2026-10-13T13:00:00+00:00", "hash": "ef843b78189bb829", "title_fa": "«Hunkkaar» «شکستن الگوریتم» مخاطبان هندی را در محدودیت‌های تلویزیون رویه‌ای - و باورهای خودشان به چالش کشیده است.", "summary_fa": "به Global Breakouts خوش آمدید، رشته Deadline که در آن، هر دو هفته، به نمایش‌های تلویزیونی و فیلم‌هایی که آن را در قلمروهای محلی خود می‌کشند، در کانون توجه قرار می‌دهیم. این صنعت مانند همیشه جهانی شده است، اما آثار پرطرفدار همیشه در جیب های جهان ظاهر می شود و نگه داشتن آن دشوار است [ ] این هفته، ما به هند بازگشتیم، جایی که مخاطبان جریان در حال هضم معنای Hunkkaar (معروف محلی به Hunkkaar: The Roar) هستند، یک مینی سریال درباره یک دختر نوجوان روحی قدرتمند، یک رهبر جنسی قدرتمند که به عنوان واکنش‌های تهاجمی متهم است. تبدیل به یک داستان ملی می شود اجرایی که توسط پریانکا چوپرا تهیه شده است، تعادل بین قدرت، ایمان، حقیقت و عدالت را در هند امروزی بررسی می کند. اخبار مرتبط اخبار چگونه خائنان , Lock Up The Alliance Driving An Formats Indian Boom Casting Zee 5 Global Drops Sumo Didi تریلر قبل از پخش جریانی نام راه اندازی: Hunkkaar کشور: هند پخش کننده: JioHotstar تهیه کنندگان: Applause Entertainment , Pictures Films, Birla Studios توزیع کننده: Applause Entertainment (دارنده حقوق) برای طرفداران: Mindhunter، Spotlight، فیلم های دیوید فینچر Watch on Deadline Hunkkaar یک مینی سریال هندی بسیار مدرن است. در حالی که ماشین بالیوود کشور به سرعت ادامه می‌دهد و داستان‌های ملودراماتیک را دنبال می‌کند، این برنامه JioHotstar مخاطبان و جامعه گسترده‌تر خود را به چالش کشیده است تا واقعاً در مورد ماهیت زندگی در کشور فکر کنند. کاران دی. کاپادیا، یکی از خالقان این فیلم، می‌گوید: ما در مورد اتخاذ رویکردی غیر ملودراماتیک برای تروما بسیار عمدی بودیم. من عاشق ژانر ملودرام بالیوود هستم، اما می‌خواستیم به تروما به شکلی اساسی نگاه کنیم."}, {"source": "Deadline", "title": "‘Three Days Of Rain’ Broadway Revival With François Arnaud, David Corenswet & Yvonne Strahovski Sets Opening Date, Venue", "link": "https://deadline.com/2026/10/three-days-of-rain-broadway-opening-date-1237153700/", "summary": "Three Days of Rain, the upcoming Broadway revival of Richard Greenberg s Pulitizer-finalist play starring François Arnaud, David Corenswet and Yvonne Strahovski, will begin performances Saturday, January 30, 2027, at the Longacre Theatre. Official opening night for the 16-week engagement is set for Monday, March 1, 2027. Producer David Binder announced the dates and venue today. [ ]", "date_str": "2026-10-13T13:00:00+00:00", "hash": "981f7f022a24b40c", "title_fa": "«سه روز باران» احیای برادوی با فرانسوا آرنو، دیوید کورنزوت و ایوان استراهوفسکی تاریخ افتتاحیه، محل برگزاری را تعیین می‌کند", "summary_fa": "سه روز باران، احیای نمایشنامه فینالیست پولیتایزر ریچارد گرینبرگ با بازی فرانسوا آرنو، دیوید کورنسوت و ایوون استراهوفسکی در برادوی، از شنبه، 30 ژانویه 2027، اجراهای خود را از شنبه، 30 ژانویه 2027، در تئاتر Longacre آغاز خواهد کرد. شب افتتاحیه رسمی نامزدی 16 هفته ای برای دوشنبه، 1 مارس 2027 تعیین شده است. تهیه کننده دیوید بایندر امروز تاریخ و مکان برگزاری را اعلام کرد. [ ] Three Days of Rain، احیای نمایشنامه فینالیست پولیتایزر ریچارد گرینبرگ در برادوی با بازی فران اویس آرنو، دیوید کورنزوت و ایوون استراهوفسکی، از شنبه، 30 ژانویه 2027 در تئاتر Longacre اجرا خواهد شد. این تولید قول می‌دهد که یکی از پر ستاره‌ترین فیلم‌های برادوی بهاری باشد، آرنو از رقابت داغ تلویزیون، کورنسوت از مجموعه سوپرمن و استراهوفسکی دو بار نامزد امی برای فیلم Hulu The Handmaids Tale شده است. اخبار مرتبط اخبار فعالیت های ماوراء الطبیعه برای هشت هفته دیگر برادوی تسخیر شده است. در برادوی در سال 2006 با بازیگری از بردلی کوپر، جولیا رابرتز و پل راد روی صحنه رفت. در ددلاین تماشا کنید این نمایشنامه، طبق خلاصه داستان، یک درام به شدت خنده دار است که به صورت رمز و رازی در مورد وراثت آشکار می شود: آنچه والدین پشت سر می گذارند و بچه ها سال ها بعد کشف می کنند. خواهر و برادر واکر (کورنسوت) و نان (استراوفسکی) با دوست دوران کودکی پیپ (آرنود) در انباری در مرکز شهر، جایی که پدران معمارشان خانه‌ای را طراحی کردند که آنها را به شهرت رساند، دوباره متحد می‌شوند. یک مجله مرموز و شگفت‌انگیز باعث می‌شود که آنها بپرسند: والدین آنها قبل از اینکه پدر و مادر شوند چه کسانی بودند؟"}, {"source": "Deadline", "title": "IDFA Announces Competition Lineups, Adds ‘Musk’ And Elizabeth Holmes Documentary ‘You Can See Everything’", "link": "https://deadline.com/2026/10/idfa-2026-competition-lineups-you-can-see-everything-musk-1237155402/", "summary": "The 39th edition of International Documentary Festival Amsterdam (IDFA) will open with White Tiger Column, a film set in one of the deadliest corners of the world. The feature directed by Robert Mentov, Dwight Jantzi, and Bryan Dickie closely follows “a group of recruits through 45 days of training with Myanmar’s resistance movement,” according to [ ]", "date_str": "2026-10-13T13:00:00+00:00", "hash": "d1e902670ffc9f91", "title_fa": "IDFA ترکیب مسابقه را اعلام کرد، مستند «ماسک» و الیزابت هلمز «شما می توانید همه چیز را ببینید» را اضافه کرد", "summary_fa": "سی و نهمین دوره جشنواره بین المللی مستند آمستردام (IDFA) با فیلم ستون ببر سفید، فیلمی که در یکی از مرگبارترین نقاط جهان اتفاق می افتد، افتتاح می شود. طبق گفته [ ] سی و نهمین دوره جشنواره بین المللی مستند آمستردام (IDFA) با ستون ببر سفید، مرده ترین گوشه فیلم جهان، فیلمی به کارگردانی رابرت منتوف، دوایت جانتزی و برایان دیکی از نزدیک «گروهی از سربازان را در طی 45 روز آموزش با جنبش مقاومت میانمار» دنبال می کند. IDFA، بزرگترین جشنواره فیلم مستند در جهان، از 12 تا 22 نوامبر در پایتخت هلند برگزار می شود. این جشنواره سه شنبه ترکیب های مسابقه خود را اعلام کرد، از جمله ستون ببر سفید، که قرار است در مسابقات بین المللی نمایش داده شود. این مستند همچنین نامزد جایزه IDFA برای بهترین فیلم اول شده است. برای لیست کامل اسکرول کنید. در آخرین مهلت تماشا کنید سیزده فیلم در رقابت بین‌المللی نمایش داده می‌شوند که ده‌ها نفر از آنها اولین نمایش جهانی یا بین‌المللی هستند. این مستندها از سرتاسر جهان بورکینافاسو، مراکش، سنگال، برزیل، اوکراین و سایر کشورهای اروپایی، کانادا و جالب‌تر از همه، هیچ فیلمی از ایالات متحده در آن دسته وجود ندارد. IDFA خاطرنشان می‌کند که مسابقه بین‌المللی آثاری را گرد هم می‌آورد که کنجکاوی و تفکر انتقادی را در مورد دنیای امروز ما دعوت می‌کنند. در طیف وسیعی از موضوعات و رویکردهای فیلمسازی، این فیلم‌ها دیدگاه‌های پیچیده و لایه‌ای از زمان حال را ارائه می‌دهند. در همین حال، مسابقه Envision 13 فیلم بی‌نظیر را ارائه می‌کند که هر یک از آنها به لحاظ سبکی جذاب هستند، زیرا فیلمسازان رویایی زبان‌های سینمایی جدیدی را ایجاد می‌کنند. این انتخاب عناوینی را گرد هم می‌آورد که در آن شکل، روایت را هدایت می‌کند. عناوین Envision عبارتند از Bah a Honda به کارگردانی Alejandro Alonso Estrella. رها کن پوشش! صبر کن"}, {"source": "Deadline", "title": "Stephen Bourne Changed British Cinema With His Book ‘Black In The British Frame’. Now It’s Out Of Print", "link": "https://deadline.com/2026/10/stephen-bourne-black-in-the-british-frame-book-bloomsbury-1237147726/", "summary": "Nigerian entrepreneur Mo Abudu made headlines this week after officially opening EbonyLife Place London — a new cultural hub dedicated to Black arts and culture in Nine Elms, South West London. The multi-story venue features a 160-seat cinema that organizers said will exclusively programme Black films from across the African diaspora. Abudu has described the [ ]", "date_str": "2026-10-13T12:56:36+00:00", "hash": "a2f49abcb848241c", "title_fa": "استفن بورن با کتابش «سیاه در قاب بریتانیا» سینمای بریتانیا را تغییر داد. اکنون از چاپ خارج شده است", "summary_fa": "مو ابودو، کارآفرین نیجریه‌ای، این هفته پس از افتتاح رسمی EbonyLife Place لندن - یک مرکز فرهنگی جدید اختصاص داده شده به هنر و فرهنگ سیاه‌پوستان در Nine Elms، در جنوب غربی لندن، خبرساز شد. این سالن چندطبقه دارای یک سینمای 160 نفره است که به گفته سازمان‌دهندگان، فیلم‌های سیاه‌پوست را از سراسر دیاسپورای آفریقا به طور انحصاری برنامه‌ریزی می‌کند. ابودو [ ] را توصیف کرده است، با این وجود، EbonyLife Place London افزودنی خوش‌آمد به فضای سینمای بریتانیا است، که تصور آن بدون دهه‌ها کار مهم در زمینه فیلم‌سازی سیاه‌پوستان در بریتانیا غیرممکن است، مانند کتاب ضروری استیون بورن، سیاه در قاب بریتانیا. Watch on Deadline اولین بار در سال 1998 منتشر شد و در سال 2001 به روز شد، Black in the British Frame یکی از اولین کتاب های جریان اصلی بود که تجربیات تاریخی، بازنمایی ها و مشارکت مردم آفریقایی و کارائیب تبار در سینما و تلویزیون بریتانیا را مستند کرد. این کتاب بخش عظیمی از تاریخ سینمای بریتانیا (1896 تا 2001) را پوشش می‌دهد که هر فصل از پیشگامان اولیه صفحه سیاه پرده برمی‌دارد و روشن می‌کند. چهره هایی که در کتاب بورن معرفی شده اند عبارتند از ارنست تریمینگهام، پیشگام سیاه پوست که قبلاً از دست رفته دوران فیلم صامت بریتانیا. پل رابسون، هنرپیشه آمریکایی آفریقایی تبار، که بیشتر دهه 1930 را در بریتانیا مشغول به کار بود، جایی که از قیمت بالایی برخوردار بود. و کارمن مونرو، اسطوره صحنه و سینما متولد گویان. بورن در مصاحبه ای طولانی از خانه خود در جنوب لندن به ددلاین می گوید که کتاب چاپ نشده است. انتشارات بلومزبری، که پس از ادغام با ناشر قبلی بورن، کنترل کتاب را به عهده گرفت، حقوق را به نویسنده بازگرداند. بورن گفت، من مقاومت کردم زیرا می خواستم کتاب را دوباره منتشر کنند، اما آنها نپذیرفتند. تجربه وحشتناکی بود. کتاب"}, {"source": "Deadline", "title": "The YouTube Age: Meet The Content Creators Making Waves In Europe", "link": "https://deadline.com/2026/10/youtube-content-creators-max-fosh-freshtorge-yes-theory-1237154088/", "summary": "Content creators are crossing over into the traditional film and TV space in a major way, and YouTube is a key driver. Deadline spotlights the established and emerging European creators to keep your eye on. This past summer the global independent box office was set alight thanks to two twentysomething YouTubers: Curry Barker’s microbudget horror [ ]", "date_str": "2026-10-13T12:28:57+00:00", "hash": "3bc9297f040e28f9", "title_fa": "عصر YouTube: با سازندگان محتوا که در اروپا موج می‌زنند آشنا شوید", "summary_fa": "سازندگان محتوا به طور عمده وارد فضای سنتی فیلم و تلویزیون می شوند و یوتیوب یک محرک اصلی است. Deadline به سازندگان اروپایی تثبیت شده و نوظهور توجه شما را جلب می کند. تابستان گذشته، باکس آفیس مستقل جهانی به لطف دو یوتیوبر بیست و چند س
