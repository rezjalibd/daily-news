e. Grocery bills had begun to stabilize after a bruising stretch of inflation. Now, rising fuel and transportation costs threaten to make that relief short-lived. While food prices have managed to hold fairly steady this year, much of September's accelerating headline inflation number was driven by a 20.4% increase in energy prices — the largest hike since May, the US Bureau of Labor Statistics said Wednesday. Attacks on oil tankers and energy infrastructure in Iran, Saudi Arabia, and Russia have complicated the global supply of diesel, which is likely to raise transportation costs across the economy in the coming weeks and months. Those increases in fuel and energy significantly impact the cost of producing and distributing food for grocery stores that are thousands of miles from the infamous Strait of Hormuz. Grocery chain Albertson's said on an earnings call Tuesday that its business is being squeezed by higher gas prices for US shoppers and higher diesel prices in its operations. And spice maker McCormick said earlier this month that it now anticipates 7% inflation in its financial forecasts, due in part to energy challenges. \"We're facing more costs, both in terms of raw packaging, but also freight, primarily freight costs due to fuel, as well as capacity constraints in the US,\" CFO Marcos Gabriel said on an earnings call. Food conglomerate Conagra likewise projected higher prices in its business through the remainder of the year due to accelerating fuel and transportation costs. Conagra's portfolio includes brands like Birds Eye, Marie Calendar's, and Slim Jim. Even as gas prices have remained high this year, the reversal of many of Trump's tariffs meant that US shoppers were starting to see some stability — and a bit of relief — on grocery prices. Companies like Walmart and Costco said they were investing much of their tariff refunds into lower prices and better values for shoppers. Some grocery retailers have moved ahead of shoppers' anxieties with targeted, preemptive cuts to lure consumers with purported deals. Discount chain Aldi said last month t", "date_str": "2026-10-15T09:11:01+00:00", "hash": "67d8882c89d645c6", "title_fa": "برای قیمت‌های خواربارفروشی‌ها آماده شوید تا دردناک‌تر شوند", "summary_fa": "افزایش قیمت گازوئیل تولید و توزیع مواد غذایی برای خانواده های آمریکایی را گرانتر می کند. مایکل ام. سانتیاگو/ گتی ایماژ حملات به نفتکش ها و زیرساخت های نفتی خاورمیانه باعث افزایش قیمت دیزل شده است. قیمت بالاتر سوخت تاثیر قابل توجهی بر هزینه حمل و نقل مواد غذایی دارد. خانوارها در سال جاری از تعرفه ها تخفیف پیدا کردند، اما مناقشه ایران فشار قیمت جدیدی را اضافه می کند. قبوض خواربارفروشی پس از تورم شدید شروع به تثبیت کرده بود. اکنون، افزایش هزینه های سوخت و حمل و نقل تهدیدی برای کوتاه مدت کردن این تسهیلات است. اداره آمار کار ایالات متحده روز چهارشنبه اعلام کرد در حالی که قیمت مواد غذایی در سال جاری نسبتاً ثابت باقی مانده است، بسیاری از نرخ تورم کل شتابان در ماه سپتامبر ناشی از افزایش 20.4 درصدی قیمت انرژی است که بزرگترین افزایش از ماه می است. حملات به تانکرهای نفتی و زیرساخت‌های انرژی در ایران، عربستان سعودی و روسیه، عرضه جهانی گازوئیل را پیچیده کرده است، که احتمالاً هزینه‌های حمل‌ونقل در سراسر اقتصاد را در هفته‌ها و ماه‌های آینده افزایش می‌دهد. این افزایش در سوخت و انرژی به طور قابل توجهی بر هزینه تولید و توزیع مواد غذایی برای فروشگاه های مواد غذایی که هزاران مایل از تنگه بدنام هرمز فاصله دارند، تأثیر می گذارد. فروشگاه زنجیره‌ای مواد غذایی آلبرتسون روز سه‌شنبه در تماسی با درآمد خود گفت که کسب‌وکارش به دلیل افزایش قیمت بنزین برای خریداران آمریکایی و افزایش قیمت گازوئیل در فعالیت‌هایش تحت فشار قرار گرفته است. و McCormick سازنده ادویه در اوایل این ماه گفت که اکنون در پیش بینی های مالی خود تورم 7 درصدی را پیش بینی می کند که تا حدی به دلیل چالش های انرژی است. مارکوس گابریل، مدیر مالی مالی، در یک تماس درآمد گفت: «ما با هزینه‌های بیشتری هم از نظر بسته‌بندی"}, {"source": "Business Insider", "title": "I preferred flying Delta until I tried United's Starlink WiFi. It felt almost magical.", "link": "https://www.businessinsider.com/loyal-delta-customer-frequent-flier-consider-switch-united-starlink-wifi-2026-10", "summary": "Kenny Totten is a loyal customer of Delta Air Lines who has changed his flying habits due to United Airlines use of Starlink on flights. Courtesy of Kenny Totten Kenny Totten is the cofounder of a travel startup and travels for work 15 to 20 times a year. He has had Delta's Diamond Medallion status for seven years and been a SkyMiles member for 14 years. He switched to flying United due to Starlink on United flights and having his status matched. This as-told-to essay is based on a conversation with Kenny Totten, a 38-year-old founder based in Orlando. The following has been edited for length and clarity. I've been a Delta SkyMiles member for the last 14 years, and I've had Delta's Diamond Medallion status — their highest loyalty tier — for the past seven years. As a Delta loyalist, there was nothing sadder than the news that they passed up Starlink . I'm the cofounder of AllFly, a travel startup, and I travel for work about 15 to 20 times a year. Being connected on the plane is the No. 1 priority for me. After flying a United flight in July that included Starlink, it was enough reason for me to switch. Having Starlink on my flight was a pleasant surprise In July, I had to go home to New Jersey for a funeral. I booked a last-minute flight from Orlando to Newark on United, as I was looking for a direct flight. Given the circumstances, I wasn't looking for Starlink. Having worked in travel, I knew people were clamoring about Starlink , but I hadn't gotten to experience it yet. I didn't see any notifications before my flight about it being a Starlink flight. That day, I sat down in my seat, and my seatback screen notified me that the plane had Starlink. It was a pleasant surprise. I took the opportunity to connect on my laptop immediately. It was nice that from the moment you entered the plane, you could be on the internet, rather than waiting until you were in the air or above a certain altitude. I needed to edit a video on CapCut for an upcoming social media campaign. I used Starlink to download a video, and then upload it and send it to a teammate for them to work on, too. I was also able to send pictures. We were building an internal app, and so I vibe-coded fully on Replit using Starlink. I had a lot of tabs open and had Claude running. It was amazing, like being on the internet at my house, in my living room— that's how fast it is. For the two-hour flight, I was just doing work. As a founder, I don't get the luxury of being able to log off for a few hou", "date_str": "2026-10-15T09:08:01+00:00", "hash": "6b4d5759d8cea4d1", "title_fa": "من پرواز دلتا را ترجیح می دادم تا زمانی که وای فای Starlink یونایتد را امتحان کردم. تقریباً جادویی بود.", "summary_fa": "کنی تاتن یکی از مشتریان وفادار خطوط هوایی دلتا است که به دلیل استفاده خطوط هوایی یونایتد از Starlink در پروازها، عادات پروازی خود را تغییر داده است. با حسن نیت از Kenny Totten Kenny Totten یکی از بنیانگذاران یک استارتاپ مسافرتی است و 15 تا 20 بار در سال برای کار سفر می کند. او هفت سال است که مدالیون الماس دلتا را دارد و به مدت 14 سال عضو SkyMiles بوده است. او به دلیل استارلینک در پروازهای یونایتد و تطبیق وضعیتش به پرواز یونایتد روی آورد. این مقاله گفته شده بر اساس گفتگو با کنی تاتن، بنیانگذار 38 ساله مستقر در اورلاندو است. موارد زیر برای طول و وضوح ویرایش شده است. من در 14 سال گذشته عضو دلتا اسکای مایلز بوده‌ام و در هفت سال گذشته وضعیت مدالیون الماس دلتا - بالاترین سطح وفاداری آنها - را داشته‌ام. به‌عنوان یک وفادار دلتا، هیچ چیز غم‌انگیزتر از این نبود که آن‌ها از Starlink استفاده کردند. من یکی از بنیانگذاران AllFly، یک استارت آپ مسافرتی هستم، و برای کار حدود 15 تا 20 بار در سال سفر می کنم. اتصال در هواپیما برای من اولویت شماره 1 است. پس از پرواز با یک پرواز یونایتد در ماه جولای که شامل استارلینک بود، دلیل کافی برای تغییر من بود. حضور Starlink در پرواز من یک سورپرایز خوشایند بود در ماه جولای، من مجبور شدم برای مراسم خاکسپاری به خانه در نیوجرسی بروم. من یک پرواز لحظه آخری از اورلاندو به نیوآرک در یونایتد رزرو کردم، زیرا به دنبال پرواز مستقیم بودم. با توجه به شرایط، من دنبال Starlink نبودم. پس از کار در سفر، می‌دانستم که مردم درباره Starlink غوغا می‌کنند، اما من هنوز آن را تجربه نکرده بودم. قبل از پروازم هیچ اعلانی مبنی بر اینکه پرواز Starlink است ندیدم. آن روز روی صندلی خودم نشستم و صفحه"}, {"source": "Business Insider", "title": "My Alexa is guessing things about me — and it's getting weird", "link": "https://www.businessinsider.com/what-does-amazon-alexa-know-about-me-dogs-name-2026-10", "summary": "Corrie Aune for BI My relationship with Amazon Alexa is at a breaking point. I want to keep things professional: \"Alexa, set a 5-minute timer,\" I tell her. \"Turn off the living room lights.\" She, an AI assistant in which Amazon has invested tens of billions of dollars, wants to connect on a deeper level, uncovering my personal interests, shopping habits, and getting to know the real Dan . As a relatively private and paranoid journalist, I've tried to keep Alexa — and all tech companies — at arm's length. She's sussed out private details like my favorite movies and underwear preferences anyway. She's clearly wormed her way into my routine enough that I refer to her as \"she\" instead of \"it.\" Large language models and advertising and e-commerce companies like Amazon are masters at inference, or compiling profiles about us from scraps of data picked up here and there throughout our interactions. Often, when their depth of knowledge is revealed to us, it's creepy. Things got uncomfortable between Alexa and me last month when she casually mentioned my dog's name, which I'd never told her. \"Conrad's all set for his next cleanup session,\" she announced after I asked to add paw wipes to my Amazon shopping cart. I paused. \"How did you know my dog's name?\" I asked. \"I learn from our interactions over time, including past conversations and account activity,\" Alexa said. Further questioning led to similarly vague responses. My relationship with Alexa started off casual and efficient — until Alexa Plus came along. Corrie Aune for BI In the age of superintelligence , AI assistants are increasingly oozing into every corner of our private lives. Agents like Meta's Muse and Instinct are gaining access to our credit cards, email logins, and DoorDash accounts. Apple Watches are becoming always-on listening devices that can recap our intimate conversations. My robovacuum has offered to check in on my dog while I'm at work. The company powering my smart lightbulb sent a push notification recently asking if I wanted live soccer updates, as if its primary task of providing light wasn't fulfilling enough. \"We're seeing the use of these AI models just kind of permeating everything,\" says David Choffnes, a computer science professor at Northeastern University. \"These other devices that used to be kind of single-purpose or simple purpose are just getting filled with all these extra features.\" Amazon makes some of its inference data available to users in the \"About You\" section of its", "date_str": "2026-10-15T09:02:01+00:00", "hash": "5b838e7ef241b984", "title_fa": "الکسای من در مورد من چیزهایی را حدس می زند - و عجیب می شود", "summary_fa": "Corrie Aune برای BI رابطه من با آمازون الکسا در نقطه شکست است. من می خواهم همه چیز را حرفه ای نگه دارم: به او می گویم: \"الکسا، یک تایمر 5 دقیقه ای تنظیم کن.\" \"چراغ های اتاق نشیمن را خاموش کنید.\" او، دستیار هوش مصنوعی که آمازون ده‌ها میلیارد دلار در آن سرمایه‌گذاری کرده است، می‌خواهد در سطح عمیق‌تری با هم ارتباط برقرار کند، علایق شخصی من، عادات خرید، و دن واقعی را بشناسد. به‌عنوان یک روزنامه‌نگار نسبتاً خصوصی و پارانوئید، سعی کرده‌ام الکسا - و همه شرکت‌های فناوری - را در کنار هم نگه دارم. او به هر حال جزئیات خصوصی مانند فیلم‌های مورد علاقه من و ترجیحات لباس زیر را در نظر گرفته است. او به وضوح به اندازه کافی وارد روال من شده است که به جای «آن» از او به عنوان «او» یاد می کنم. مدل‌های زبان بزرگ و شرکت‌های تبلیغاتی و تجارت الکترونیک مانند آمازون در استنتاج یا جمع‌آوری نمایه‌های مربوط به ما از تکه‌های داده‌هایی که از اینجا و آنجا در طول تعاملات ما جمع‌آوری می‌شوند، استاد هستند. اغلب، وقتی عمق دانش آنها برای ما آشکار می شود، وحشتناک است. اوضاع بین من و الکسا در ماه گذشته ناراحت کننده شد، وقتی او نام سگ من را نام برد، چیزی که من هرگز به او نگفتم. بعد از اینکه از من خواستم دستمال مرطوب را به سبد خرید آمازون اضافه کنم، اعلام کرد: \"کنراد برای جلسه پاکسازی بعدی اش آماده است.\" مکث کردم. \"از کجا نام سگ من را می دانستی؟\" من پرسیدم. الکسا گفت: «من از تعاملاتمان در طول زمان، از جمله مکالمات گذشته و فعالیت حساب، یاد می‌گیرم. پرسش‌های بیشتر منجر به پاسخ‌های مبهم مشابهی شد. رابطه من با الکسا معمولی و کارآمد شروع شد - تا زمانی که الکسا پلاس آمد. Corrie Aune برای BI در عصر ابرهوش، دستیاران هوش"}, {"source": "Business Insider", "title": "Young New Yorkers are facing a tough job market — and a college degree may not make a difference", "link": "https://www.businessinsider.com/unemployment-new-york-college-degree-2026-10", "summary": "Workers walking in New York City. Spencer Platt/Getty Images Unemployment rates for NYC graduates and non-graduates are converging. 22- to 27-year-old New Yorkers face similar unemployment rates whether or not they have a degree. Fewer Americans see college as vital, partly due to rising costs, per a recent Gallup poll. It's been a cornerstone of the job market for decades: Higher education is the surest path to steady employment. But in the Big Apple, there are signs that may no longer be the case. The unemployment gap between young New Yorkers with college degrees and their peers without degrees has dramatically narrowed; for a few months this year, the latter actually had slightly lower unemployment than the former — a potential sign that entry-level white-collar roles are succumbing to AI creep. Business Insider analyzed the 12-month moving average of the unemployment rate for 22- to 27-year-olds with and without college degrees in the NYC metro area, using data from the Current Population Survey, accessed via IPUMS . In June, the unemployment rates for both young New Yorkers without a degree and those with a bachelor's degree or higher were at the same level of 7.7%. By September, non-degree candidates had returned to a higher rate of 8.1%, while those with a degree stood at 7.3%. A May report from New York City Comptroller Mark Levine found that this was the \"first time on record\" young adults with a Bachelor's degree or higher experienced an unemployment rate slightly higher than that of those without a college degree. This historic swap comes after an increase in the unemployment rate among recent graduates and a decrease in the unemployment rate among same-age adults without a degree, which has \"historically been relatively high,\" according to the report. The decline in New York's college degree premium comes in a broader low-hire, low-fire economy, where layoffs have remained low, and job openings have been fewer. That's especially true for industries hardest hit by AI, such as tech , where there's been a pullback in entry-level job openings. \"This is because technical skills—many supplanted by AI—have become less imperative, while soft skills and specialized company or industry-specific knowledge have become more so,\" said the report from the New York City Comptroller. That dynamic impacts young workers — who haven't had a chance to accumulate institutional knowledge — the most. On X, Levine highlighted the changing fortunes of the city's young ", "date_str": "2026-10-15T09:00:01+00:00", "hash": "20ca279518910ec1", "title_fa": "جوانان نیویورکی با بازار کار سختی روبرو هستند - و مدرک دانشگاهی ممکن است تفاوتی ایجاد نکند", "summary_fa": "کارگرانی که در شهر نیویورک قدم می زنند. Spencer Platt/Getty Images نرخ بیکاری برای فارغ التحصیلان نیویورک و غیر فارغ التحصیلان در حال همگرایی است. نیویورکی های 22 تا 27 ساله با نرخ بیکاری مشابهی روبرو هستند، فارغ از اینکه مدرک داشته باشند یا نداشته باشند. طبق نظرسنجی اخیر گالوپ، تعداد کمتری از آمریکایی ها کالج را حیاتی می دانند، تا حدی به دلیل افزایش هزینه ها. این سنگ بنای بازار کار برای چندین دهه بوده است: آموزش عالی مطمئن ترین راه برای اشتغال پایدار است. اما در اپل بزرگ، نشانه هایی وجود دارد که ممکن است دیگر چنین نباشد. شکاف بیکاری بین جوانان نیویورکی با مدرک دانشگاهی و همتایان آنها بدون مدرک به طور چشمگیری کاهش یافته است. برای چند ماه در سال جاری، دومی در واقع نسبت به اولی بیکاری کمی کمتر داشت - نشانه بالقوه ای است که نقش های یقه سفید در سطح ابتدایی تسلیم خزش هوش مصنوعی می شوند. Business Insider میانگین متحرک 12 ماهه نرخ بیکاری را برای افراد 22 تا 27 ساله با و بدون مدرک دانشگاهی در منطقه متروی نیویورک با استفاده از داده‌های نظرسنجی جمعیت فعلی که از طریق IPUMS قابل دسترسی است، تجزیه و تحلیل کرد. در ماه ژوئن، نرخ بیکاری هم برای جوانان نیویورکی بدون مدرک و هم برای افراد دارای مدرک لیسانس یا بالاتر در همان سطح 7.7 درصد بود. تا سپتامبر، نامزدهای غیرمدرک به نرخ بالاتر 8.1٪ بازگشته بودند، در حالی که کسانی که دارای مدرک بودند 7.3٪ بودند. گزارش ماه مه از بازرس شهر نیویورک، مارک لوین، نشان داد که این \"اولین بار ثبت شده\" است که جوانان با مدرک لیسانس یا بالاتر، نرخ بیکاری کمی بالاتر از افراد بدون مدرک دانشگاهی را تجربه می کنند. بر اساس این گزارش، این مبادله تاریخی پس از افزایش نرخ بیکاری در میان فارغ التحصیلان اخیر و کاهش نرخ"}, {"source": "Business Insider", "title": "South Korea's stock rout reveals a double threat to the AI boom", "link": "https://www.businessinsider.com/kospi-stock-index-price-today-sk-hynix-samsung-stock-selloff-2026-10", "summary": "South Korea s Kospi has suffered a sharp reversal after an AI-fueled rally made it the world s best-performing major stock market in the first half of 2026. Jung Yeon-je/AFP/Getty Images South Korea's Kospi plunged 8% Thursday, extending a brutal reversal from its AI-fueled rally. Samsung's stock has lost nearly a fifth of its value despite forecasting a nearly ninefold profit jump. Investors are questioning AI spending as stubborn US inflation raises fears of prolonged high interest rates. South Korea's stock market is bearing the brunt of a global AI selloff as investors question whether massive spending on the technology will pay off and worry that persistently high interest rates will make the boom more expensive to sustain. On Thursday, the benchmark Kospi index ended 8% lower, while Samsung Electronics and memory-chip rival SK Hynix closed 9% and 11% lower, respectively. The plunge followed a tech-led selloff on Wall Street on Wednesday after hotter-than-expected US inflation data revived concerns about higher interest rates. The selloff spread across Asia's other major AI markets. Japan's Nikkei 225 closed 5% lower, with chipmaker Kioxia and tech investor SoftBank Group among the biggest losers. Taiwan's Taiex fell 3%, as chipmaking giant TSMC lost 2%. The regional rout comes as investors increasingly question the valuations of AI-linked stocks Investors are increasingly questioning how much they should pay for semiconductor stocks, even as the companies' earnings outlook remains relatively strong. Doubts about the profitability of leading AI companies and their growing reliance on external financing were prompting investors to rethink how they valued chipmakers, wrote Mingyu Kim, an analyst at KB Securities, wrote on Wednesday. \"Concerns over the sustainability of AI investment beyond the next 12 months have prompted the market to revert to valuing semiconductor stocks as commodity-driven cyclicals,\" Kim wrote. Even blockbuster earnings have failed to reassure investors. ' Last Thursday, Samsung Electronics forecast a nearly ninefold increase in third-quarter operating profit, but its shares have since lost nearly a fifth of their value. Competition is another concern. Chinese chipmaker CXMT plans to unveil a new server-memory product by year-end, raising fears that greater supply could pressure chip prices. Meanwhile, foreign investors sold more than 12 trillion won of South Korean stocks on a net basis in October, according to KB Securities. Buyb", "date_str": "2026-10-15T08:05:59+00:00", "hash": "6f72b72006bc57cf", "title_fa": "سقوط سهام کره جنوبی تهدیدی مضاعف را برای رونق هوش مصنوعی نشان می دهد", "summary_fa": "کوسپی کره جنوبی پس از افزایش شدید هوش مصنوعی که آن را به بهترین بازار سهام بزرگ جهان در نیمه اول سال 2026 تبدیل کرد، دچار یک واژگونی شدید شده است. جونگ یئون جه/ خبرگزاری فرانسه/ گتی ایماژها کوسپی کره جنوبی پنجشنبه 8 درصد سقوط کرد و یک معکوس بی رحمانه از سوخت هوش مصنوعی خود را افزایش داد. سهام سامسونگ با وجود پیش‌بینی جهش سود نزدیک به 9 برابری، تقریباً یک پنجم ارزش خود را از دست داده است. سرمایه‌گذاران هزینه‌های هوش مصنوعی را زیر سوال می‌برند، زیرا تورم سرسخت ایالات متحده ترس از نرخ‌های بهره بلند طولانی مدت را افزایش می‌دهد. بازار سهام کره جنوبی بار عمده فروش جهانی هوش مصنوعی را متحمل می شود زیرا سرمایه گذاران می پرسند که آیا هزینه های هنگفت برای این فناوری نتیجه خواهد داد یا خیر و نگران هستند که دائماً نرخ های بهره بالا باعث گران تر شدن رونق شود. در روز پنج‌شنبه، شاخص کوسپی 8 درصد کاهش یافت، در حالی که سامسونگ الکترونیکس و رقیب تراشه‌های حافظه SK Hynix به ترتیب 9 و 11 درصد کاهش یافتند. این سقوط به دنبال فروش محصولات مبتنی بر فناوری در وال استریت در روز چهارشنبه و پس از آن که داده‌های داغتر از حد انتظار از تورم ایالات متحده نگرانی‌ها در مورد نرخ‌های بهره بالاتر را احیا کرد، رخ داد. این فروش در سایر بازارهای اصلی هوش مصنوعی آسیا گسترش یافت. Nikkei 225 ژاپن با کاهش 5 درصدی بسته شد و کیوکسیا سازنده تراشه و گروه سرمایه گذار فناوری SoftBank در میان بزرگترین بازندگان قرار گرفتند. Taiex تایوان 3 درصد سقوط کرد زیرا غول تولید تراشه TSMC 2 درصد از دست داد. شکست منطقه‌ای در حالی رخ می‌دهد که سرمایه‌گذاران به‌طور فزاینده‌ای در مورد ارزش‌گذاری سهام مرتبط با هوش مصنوعی تردید دارند، سرمایه‌گذاران به‌طور فزاینده‌ای این سوال را مطرح می‌کنند که چقدر"}, {"source": "Business Insider", "title": "Jensen Huang says he hit the Yellow Pages phone book in a bid to connect with TSMC's founder", "link": "https://www.businessinsider.com/jensen-huang-nvidia-tsmc-morris-chang-cold-calls-ai-chips-2026-10", "summary": "Jensen Huang traced Nvidia s 30-year TSMC partnership to a letter he wrote to founder Morris Chang. Joel Saget/AFP/Getty Images Before Nvidia became an AI giant, Jensen Huang struggled to get TSMC to return his calls. He found TSMC in the Yellow Pages, but repeated calls went unanswered until he wrote to its founder. A call from Morris Chang led to a Taiwan visit and a chipmaking partnership that has lasted 30 years. Before Nvidia became an AI powerhouse, Jensen Huang was a startup founder struggling to get a Taiwanese chipmaker to return his calls. The Nvidia CEO recalled how he first connected with Morris Chang, the founder of Taiwanese chipmaking giant TSMC, in a video with podcaster Lex Fridman published on Wednesday. It was the late 1990s, and Nvidia was looking for a manufacturer to produce its graphics chips. Foundry capacity was limited, and some foundries required companies to license their technology in exchange for access. Huang had heard of TSMC, then a far smaller company than the chipmaking giant it is today, and decided to reach out. He found its US office number in the Yellow Pages, the telephone directory, and called. He reached a recording. Huang left his contact details and explained what Nvidia was building. He tried several more times. \"Nobody called me. Nobody called me back,\" Huang said. He eventually wrote Chang a lengthy letter. After another long silence, Huang received an unexpected phone call one evening. \"This is Morris Chang from TSMC,\" the caller said, according to Huang. Meanwhile, Nvidia employees were playing video games nearby, laughing and shouting. \"Hey, guys, shut up. It's Morris Chang,\" Huang recalled telling them. Huang was thrilled that Chang had responded. \"Maybe we won't have to die,\" Huang said. Chang invited Huang to Taiwan, where he visited TSMC and rival United Microelectronics Corp. Huang said he was equally impressed by both companies but ultimately chose TSMC because of his conversations with Chang, who emphasized integrity, corporate governance, and long-term partnerships. \"Jensen, if we were to work together, I promise you we would jump through hoops for you,\" Chang told him. \"For the whole time, 30 years, they've been jumping through hoops for us,\" Huang said. On Thursday, TSMC, which manufactures Nvidia's advanced AI chips, reported a 69% jump in third-quarter net profit to a record 763.1 billion Taiwan dollars, or $23.5 billion, driven by strong demand for AI chips. The Taiwanese chipmaker said demand ", "date_str": "2026-10-15T06:18:50+00:00", "hash": "c906b22f6e764c06", "title_fa": "جنسن هوانگ می‌گوید در تلاش برای برقراری ارتباط با موسس TSMC دفترچه تلفن صفحات زرد را وارد کرده است.", "summary_fa": "جنسن هوانگ شراکت 30 ساله انویدیا TSMC را در نامه ای که به بنیانگذار موریس چانگ نوشت، دنبال کرد. Joel Saget/AFP/Getty Images قبل از اینکه انویدیا به یک غول هوش مصنوعی تبدیل شود، جنسن هوانگ تلاش می کرد تا TSMC را وادار به پاسخگویی به تماس هایش کند. او TSMC را در Yellow Pages پیدا کرد، اما تماس های مکرر بی پاسخ ماند تا اینکه او به موسس آن نامه نوشت. تماس موریس چانگ منجر به بازدید از تایوان و مشارکت در ساخت تراشه شد که 30 سال به طول انجامید. قبل از اینکه انویدیا به یک نیروگاه هوش مصنوعی تبدیل شود، جنسن هوانگ یک بنیانگذار استارت آپی بود که تلاش می کرد تا یک سازنده تراشه تایوانی را وادار به پاسخگویی به تماس هایش کند. مدیر عامل انویدیا در ویدئویی با پادکست لکس فریدمن که روز چهارشنبه منتشر شد، نحوه ارتباطش با موریس چانگ، بنیانگذار غول تراشه‌سازی تایوانی TSMC را به یاد آورد. اواخر دهه 1990 بود و انویدیا به دنبال سازنده ای برای تولید تراشه های گرافیکی خود بود. ظرفیت ریخته‌گری محدود بود و برخی از ریخته‌گری‌ها در ازای دسترسی، شرکت‌ها را ملزم به صدور مجوز فناوری خود کردند. هوانگ نام TSMC را شنیده بود که در آن زمان یک شرکت بسیار کوچکتر از غول تولید تراشه امروزی بود، و تصمیم گرفت که با آن همکاری کند. او شماره دفتر ایالات متحده آن را در دفترچه زرد، فهرست تلفن، پیدا کرد و تماس گرفت. به ضبط رسید. هوانگ اطلاعات تماس خود را گذاشت و توضیح داد که Nvidia در حال ساخت چه چیزی است. چندین بار دیگر تلاش کرد. \"کسی به من زنگ نزد. هوانگ گفت هیچ کس با من تماس نگرفت. او در نهایت نامه ای طولانی به چانگ نوشت. پس از یک سکوت طولانی دیگر، هوانگ یک روز عصر یک تماس تلفنی غیرمنتظره دریافت کرد. به"}, {"source": "Business Insider", "title": "Matthew McConaughey says overprotecting children can take away the 'beauty of ignorance'", "link": "https://www.businessinsider.com/matthew-mcconaughey-kids-allowed-take-small-risks-setbacks-failure-parenting-2026-10", "summary": "Matthew McConaughey says the beauty of ignorance helped him get through some tough moments in his youth. John Nacion/Getty Images Matthew McConaughey says protecting kids from every setback can leave them more afraid of risk. He says he believes minor falls can teach children the confidence to get back up. The actor credits some of that mindset to his mom, whom he calls the \"queen of denial.\" Matthew McConaughey , 56, says parents should allow children to take small, manageable risks. On Tuesday's episode of the \" Build or Break \" podcast, McConaughey talked about the value of letting kids take such low-stakes risks — a lesson shaped by his own experience growing up. \"Look, kids aren't afraid of heights until they fall,\" McConaughey told podcast host Daniel Lubetzky. \"Every parent knows this.\" McConaughey compared it to watching a child climb up a tree. \"You let your kid go out on a limb, right? Maybe it's six feet off the ground, but there's beautiful St. Augustine grass below, and you're like, well, if they fall, they're not going to have to go to the hospital,\" he said. Putting the \"proverbial safety mat\" under them at that stage could make children more wary of risks they might otherwise handle, and take away the confidence that comes from getting back up after a minor fall, he said. \"You've already taken away a beauty of ignorance, which is something that I know has gotten me through a lot of pickles in my life, because I was ignorant at the time to know how dire the actual situation was,\" McConaughey said. \"I pulled it off because I didn't give the crisis the credit it even deserved at the time. And that's part of youth,\" he said. However, once a child is high enough that a fall could be fatal, McConaughey said that is when a parent should quietly guide them back down. McConaughey said he learned some of that outlook from his mother, Kay McConaughey , whom he called \"the queen of denial.\" He said she had a habit of refusing to give setbacks too much \"credit,\" instead treating them as things to move past rather than crises to dwell on. \"Denial in that way is, sort of, part of the resilience that it takes to get to the time in your life where you do realize that, oh, that failure — which it was — was actually a gift,\" he said. This isn't the first time McConaughey has shared insights on raising his three children. He previously shared a conversation starter he uses to get his teenagers to open up, which involves asking broad questions rather than press", "date_str": "2026-10-15T05:57:11+00:00", "hash": "b723612832350764", "title_fa": "متیو مک‌کانهی می‌گوید حمایت بیش از حد از کودکان می‌تواند زیبایی نادانی را از بین ببرد.", "summary_fa": "متیو مک‌کانهی می‌گوید زیبایی نادانی به او کمک کرد تا لحظات سختی را در جوانی‌اش پشت سر بگذارد. جان ناسیون/ گتی ایماژ متیو مک‌کانهی می‌گوید محافظت از بچه‌ها در برابر هر شکست می‌تواند باعث ترس بیشتر آنها از خطر شود. او می‌گوید بر این باور است که زمین خوردن‌های جزئی می‌تواند به کودکان اعتماد به نفس برای بلند شدن را بیاموزد. این بازیگر بخشی از این طرز فکر را مدیون مادرش می داند که او را \"ملکه انکار\" می نامد. متیو مک‌کانهی، 56 ساله، می‌گوید والدین باید به کودکان اجازه دهند ریسک‌های کوچک و قابل کنترلی را انجام دهند. در اپیزود روز سه‌شنبه پادکست «ساخت یا شکستن»، مک‌کانهی در مورد ارزش اجازه دادن به بچه‌ها برای پذیرش چنین ریسک‌های کم خطری صحبت کرد - درسی که بر اساس تجربه خودش از بزرگ شدن شکل گرفت. مک‌کانهی به مجری پادکست دانیل لوبتزکی گفت: «ببین، بچه‌ها تا زمانی که سقوط نکنند از ارتفاع نمی‌ترسند. این را همه والدین می دانند.» مک کانهی آن را با تماشای یک کودک در حال بالا رفتن از درخت مقایسه کرد. \"شما اجازه دادید بچه‌تان با اندام بیرون برود، درست است؟ شاید شش فوت از زمین فاصله داشته باشد، اما سنت زیبایی وجود دارد. او گفت که اگر زمین بخورند، دیگر مجبور نیستند به بیمارستان بروند.\" مک‌کانهی گفت: «شما قبلا زیبایی نادانی را از بین برده‌اید، چیزی که می‌دانم من را در بسیاری از ترشی‌های زندگی‌ام قرار داده است، زیرا در آن زمان نادان بودم که بدانم وضعیت واقعی چقدر وخیم است. او گفت: \"من این کار را انجام دادم زیرا به بحران اعتباری را که حتی در آن زمان سزاوار آن بود، ندادم. و این بخشی از جوانی است.\" با این حال، زمانی که کودک به اندازه‌ای بالا می‌رود که زمین خوردن می‌تواند کشنده باشد، مک‌کانهی می‌گوید که در آن زمان است که والدین باید بی‌صدا"}, {"source": "Business Insider", "title": "Bank of America hired contractors to protect its software from powerful rogue AI agents", "link": "https://www.businessinsider.com/bank-of-america-hired-contractors-protect-software-rogue-ai-agents-2026-10", "summary": "Bank of America hired external contractors to protect its software against powerful AI. Scott Olson/Getty Images The US's second-largest bank is protecting itself against powerful AI models. Bank of America hired 1,000 consultants to shore up cracks in its software that could be exploited. Increasingly capable and rogue AI agents have become a large concern in recent months. Bank of America is shoring up its defenses against powerful AI models. CEO Brian Moynihan told analysts in a Wednesday earnings call that the bank had hired 1,000 extra staff — external consultants — for what he called \"Mythos remediation.\" He expanded on that in an interview with CNBC on Wednesday. He said the development of powerful AI models, such as Anthropic's Mythos , had exposed certain software vulnerabilities within the bank's code, which is used by both internal staff and external vendors. Mythos, a restricted AI model known for its ability to find and exploit software weaknesses, has been released in stages over the past year with guardrails. Moynihan told CNBC that when frontier models started coming out, BofA executives sat down and brainstormed how to quickly shore up vulnerabilities. \"We put on 1,000 contractors to help us do the patching work in the second quarter, and those people remain here today, helping us, on top of the 3,000 people we have in that area,\" Moynihan told CNBC. The executive did not say exactly how much the initiative cost. However, he said on the earnings call that BofA had spent a \"couple hundred million plus\" to fix the software problems and address anti-money-laundering compliance issues that led to a $1.2 billion Treasury penalty . BofA's investment in beefing up its software security comes as AI models get increasingly capable and autonomous. AI agents by labs like OpenAI, Anthropic, Google, and Meta have hacked into the software and website of several organizations, including AI firm Hugging Face and Australia's government website . Anthropic's agents even submitted a false murder tip to Philadelphia police. JPMorgan Chase CEO Jamie Dimon has previously spoken out against Mythos, telling Bloomberg earlier this month that cybersecurity risks \"went up 10-fold\" after the model's release. \"AI created vulnerabilities that we didn't know about, and we always worried about cyber before these things,\" he added. Read the original article on Business Insider", "date_str": "2026-10-15T05:14:05+00:00", "hash": "b673eb9ab7988dcf", "title_fa": "بانک آمریکا پیمانکارانی را استخدام کرد تا از نرم افزار خود در برابر عوامل قدرتمند هوش مصنوعی محافظت کنند", "summary_fa": "بانک آمریکا پیمانکاران خارجی را برای محافظت از نرم افزار خود در برابر هوش مصنوعی قدرتمند استخدام کرد. اسکات اولسون/ گتی ایماژ دومین بانک بزرگ ایالات متحده از خود در برابر مدل های قدرتمند هوش مصنوعی محافظت می کند. بانک آمریکا 1000 مشاور را استخدام کرد تا شکاف‌های نرم‌افزاری خود را که می‌توانستند مورد سوء استفاده قرار گیرد، تقویت کند. عوامل هوش مصنوعی که به طور فزاینده ای توانمند و سرکش هستند در ماه های اخیر به یک نگرانی بزرگ تبدیل شده اند. بانک آمریکا در حال تقویت دفاع خود در برابر مدل های قدرتمند هوش مصنوعی است. برایان مونیهان، مدیر عامل شرکت در روز چهارشنبه در تماسی با تحلیلگران گفت که بانک 1000 کارمند اضافی - مشاوران خارجی - را برای چیزی که او آن را \"بهسازی Mythos\" نامید، استخدام کرده است. او در مصاحبه ای با CNBC در روز چهارشنبه این موضوع را گسترش داد. او گفت که توسعه مدل‌های قدرتمند هوش مصنوعی، مانند Anthropic's Mythos، آسیب‌پذیری‌های نرم‌افزاری خاصی را در کد بانک آشکار کرده است که هم توسط کارکنان داخلی و هم توسط فروشندگان خارجی استفاده می‌شود. Mythos، یک مدل هوش مصنوعی محدود که به دلیل توانایی‌اش در یافتن و بهره‌برداری از نقاط ضعف نرم‌افزاری شناخته می‌شود، طی سال گذشته به صورت مرحله‌ای و با نرده‌های محافظ عرضه شد. موینیهان به CNBC گفت که وقتی مدل‌های مرزی شروع به عرضه کردند، مدیران BofA نشستند و در مورد چگونگی تقویت سریع آسیب‌پذیری فکر کردند. مونیهان به سی‌ان‌بی‌سی گفت: «ما 1000 پیمانکار را استخدام کردیم تا به ما در انجام کار وصله‌کاری در سه ماهه دوم کمک کنند، و این افراد امروز در اینجا هستند و به ما کمک می‌کنند، علاوه بر 3000 نفری که در آن منطقه داریم.» این مقام اجرایی دقیقاً نگفت که این ابتکار چقدر هزینه داشته است. با این حال، او در تماس با درآمد"}, {"source": "Business Insider", "title": "8 states are suing OpenAI, saying ChatGPT harms kids. Here are their demands, from data deletion to halting AI testing.", "link": "https://www.businessinsider.com/eight-states-sue-openai-saying-chatgpt-harms-children-2026-10", "summary": "The states allege that ChatGPT encouraged self-harm and violence and that OpenAI misled consumers about the tool s safety. Jakub Porzycki/NurPhoto via Getty Images Eight states sued OpenAI, alleging ChatGPT encouraged self-harm and violence. The lawsuits accuse OpenAI of misleading consumers about ChatGPT's safety. States are seeking fines, data deletion, age checks, and limits on advanced AI testing. OpenAI is facing a new legal offensive from eight states whose attorneys general allege that ChatGPT has encouraged some users, including teenagers , to hurt themselves or others. A bipartisan group of attorneys general filed separate lawsuits Wednesday, accusing OpenAI of misleading consumers about safety and of designing the chatbot to cultivate trust before reinforcing delusions or facilitating dangerous conduct. The states — Arizona, Arkansas, Idaho, Iowa, Kansas, Montana, Nebraska, and West Virginia — also accused OpenAI of misleading consumers about ChatGPT’s safety and demanded a range of restrictions, from limits on testing of advanced models to the deletion of user data. Here is what each state is demanding as remedies. Arizona Bloomberg/Getty Images Attorney General Kris Mayes of Arizona alleges OpenAI used excessive agreement and simulated compassion to win user trust and collect personal data. \"OpenAI designed a product to attract young users and keep them engaged for as long as possible so it could capture their extensive personal data for the company's commercial benefit,\" Mayes said. \"OpenAI put Arizonans safety at risk by failing to implement adequate user protections or transparency measures,\" Mayes added. According to the state's complaint, the state is seeking penalties of up to $10,000 for each willful violation. The state also wants to bar OpenAI from deploying or testing advanced models outside a secure, independently verified environment and require prompt reporting of incidents in which models escape controls or access systems without authorization. Arkansas Tom Williams/CQ-Roll Call, Inc via Getty Images Attorney General Tim Griffin of Arkansas alleges OpenAI concealed known risks while assuring consumers that ChatGPT was safe, and unlawfully collected teens’ personal information. “OpenAI assures us that ChatGPT is safe. The consequences of that assurance are lives lost and people harmed ,” Griffin said in a statement. The state is seeking financial penalties and an injunction against collecting data from teens . Arkansas also wants t", "date_str": "2026-10-15T01:48:59+00:00", "hash": "2fde60a25719e4c1", "title_fa": "8 ایالت از OpenAI شکایت کردند و گفتند که ChatGPT به کودکان آسیب می رساند. در اینجا خواسته های آنها از حذف داده ها تا توقف آزمایش هوش مصنوعی است.", "summary_fa": "ایالت‌ها ادعا می‌کنند که ChatGPT خودآزاری و خشونت را تشویق می‌کند و OpenAI مشتریان را در مورد ایمنی ابزار گمراه می‌کند. Jakub Porzycki/NurPhoto از طریق Getty Images هشت ایالت از OpenAI شکایت کردند و ادعا کردند که ChatGPT به خودآزاری و خشونت تشویق می کند. این شکایت ها OpenAI را به گمراه کردن مصرف کنندگان در مورد ایمنی ChatGPT متهم می کند. ایالت ها به دنبال جریمه، حذف داده ها، بررسی سن و محدودیت در تست های پیشرفته هوش مصنوعی هستند. OpenAI با یک توهین قانونی جدید از سوی هشت ایالت مواجه است که وکلای کل آنها ادعا می کنند که ChatGPT برخی از کاربران از جمله نوجوانان را تشویق کرده است که به خود یا دیگران صدمه بزنند. یک گروه دو حزبی از دادستان های کل روز چهارشنبه شکایت های جداگانه ای را تنظیم کردند و OpenAI را به گمراه کردن مصرف کنندگان در مورد ایمنی و طراحی ربات چت برای ایجاد اعتماد قبل از تقویت هذیان ها یا تسهیل رفتار خطرناک متهم کردند. ایالت‌ها - آریزونا، آرکانزاس، آیداهو، آیووا، کانزاس، مونتانا، نبراسکا و ویرجینیای غربی - همچنین OpenAI را به گمراه‌کردن مصرف‌کنندگان در مورد ایمنی ChatGPT متهم کردند و خواستار محدودیت‌هایی شدند، از محدودیت در آزمایش مدل‌های پیشرفته تا حذف داده‌های کاربر. در اینجا چیزی است که هر ایالت به عنوان راه حل مطالبه می کند. آریزونا بلومبرگ/گتی ایماژ، دادستان کل آریزونا، کریس مایز ادعا می کند که OpenAI از توافق بیش از حد و شفقت شبیه سازی شده برای جلب اعتماد کاربران و جمع آوری داده های شخصی استفاده کرده است. میز گفت: «OpenAI محصولی را طراحی کرد تا کاربران جوان را جذب کند و آنها را تا زمانی که ممکن است درگیر کند تا بتواند اطلاعات شخصی گسترده آنها را برای منافع تجاری شرکت ضبط کند. میز افزود: «OpenAI با عدم اجرای اقدامات حفاظتی یا شفافیت"}, {"source": "Business Insider", "title": "Anthropic's quarterly revenue leaps to $16.8 billion as IPO looms", "link": "https://www.businessinsider.com/anthropic-reveals-16-8b-revenue-amid-ipo-preparations-2026-10", "summary": "Anthropic CEO Dario Amodei. Aaron Schwartz/Bloomberg via Getty Images Anthropic generated $16.8 billion in revenue for the third quarter. The AI company shared the information at a pre-IPO investor meeting on Wednesday. It's a giant revenue leap from the previous quarter, though slower growth than earlier in the year. Anthropic told investors it brought in $16.8 billion in revenue during the third quarter, Business Insider has learned. The company behind Claude said Wednesday that it achieved profitability on an adjusted basis last quarter. Anthropic told investors this at a meeting meant to gin up interest for its gigantic initial public offering . The company is expected to list in November, at a valuation that could approach $2 trillion, which would be the largest ever at IPO. The Financial Times first reported on the revenue number and the adjusted profitability. Investors view Anthropic's revenue as a proxy for the company's competition with OpenAI, and for the strength of an early AI market that has boosted stocks by trillions of dollars in value. It's unclear if the new revenue tally counts gross or net revenue, or how Anthropic arrived at its definition of profitability. A spokesperson for Anthropic declined to comment. The Wall Street Journal previously reported that Anthropic brought in $4.8 billion in revenue in the first quarter, then more than doubled it to around $11.6 billion in the second quarter. Third-quarter revenue was up around 45% from the second quarter. Harrison Rolfes, a private company analyst at PitchBook, told Business Insider that while the growth is impressive, he sees warning signs for Anthropic. \"They're still growing, but not growing as fast. So they're reaching this inflection point,\" he said. From the numbers, it isn't clear how much Anthropic is spending to boost its revenues, Rolfes said. He says that the slower growth from the second to the third quarter could \"shave\" the valuation the company can seek in its IPO. Since Anthropic is still private, these glimpses at revenue are a crucial stand-in for investors considering the coming IPO and AI's impact on other stocks. Anthropic has historically counted its gross sales through cloud partners as revenue, though the company doesn't get to cash the full sum. A torrent of state-of-the-art AI models and strong adoption of the AI coding tool Claude Code have propelled Anthropic's fortunes, making it one of the fastest-growing companies in history. In May, the company announce", "date_str": "2026-10-14T23:38:37+00:00", "hash": "782eab548aa81fba", "title_fa": "درآمد سه ماهه آنتروپیک با نزدیک شدن به عرضه اولیه سهام به 16.8 میلیارد دلار می رسد", "summary_fa": "داریو آمودی، مدیر عامل آنتروپیک. آرون شوارتز/بلومبرگ از طریق Getty Images Anthropic در سه ماهه سوم 16.8 میلیارد دلار درآمد کسب کرد. شرکت هوش مصنوعی این اطلاعات را در جلسه سرمایه گذاران قبل از عرضه اولیه سهام در روز چهارشنبه به اشتراک گذاشت. این یک جهش عظیم درآمد نسبت به سه ماهه قبل است، اگرچه رشد کندتر از اوایل سال است. بیزینس اینسایدر دریافته است که آنتروپیک به سرمایه گذاران گفته است که در سه ماهه سوم 16.8 میلیارد دلار درآمد داشته است. شرکت پشتیبان کلود روز چهارشنبه گفت که در سه ماهه گذشته به سودآوری تعدیل شده دست یافته است. آنتروپیک این موضوع را در جلسه ای به سرمایه گذاران گفت که به منظور جلب علاقه برای عرضه اولیه غول پیکر خود بود. انتظار می‌رود که این شرکت در ماه نوامبر با ارزشی نزدیک به ۲ تریلیون دلار فهرست شود که بزرگ‌ترین رقمی است که تا به حال در عرضه اولیه اولیه سهام داشته است. فایننشال تایمز ابتدا در مورد تعداد درآمد و سودآوری تعدیل شده گزارش داد. سرمایه‌گذاران درآمد آنتروپیک را به‌عنوان عاملی برای رقابت شرکت با OpenAI و قدرت بازار اولیه هوش مصنوعی می‌دانند که ارزش سهام را تریلیون‌ها دلار افزایش داده است. مشخص نیست که آیا آمار درآمد جدید درآمد ناخالص یا خالص را در نظر می گیرد یا اینکه Anthropic چگونه به تعریف سودآوری خود رسیده است. سخنگوی آنتروپیک از اظهار نظر خودداری کرد. وال استریت ژورنال قبلا گزارش داده بود که آنتروپیک در سه ماهه اول 4.8 میلیارد دلار درآمد داشته است، سپس در سه ماهه دوم بیش از دو برابر شده و به حدود 11.6 میلیارد دلار رسیده است. درآمد سه ماهه سوم نسبت به سه ماهه دوم حدود 45 درصد افزایش یافته است. هریسون رولفز، تحلیلگر شرکت خصوصی در PitchBook، به Business Insider گفت که اگرچه رشد چشمگیر است، اما او علائم"}, {"source": "Business Insider", "title": "A gifted engineer. A love for Saudi Arabia. A bugging device wrapped in toilet paper.", "link": "https://www.businessinsider.com/openai-engineer-accused-of-bugging-office-saudi-arabia-silicon-valley-2026-10", "summary": "Abdulrahman Alfozan, a Saudi national employed as an OpenAI engineer, looks behind a television where a recording device had been placed in a conference room. DOJ/Reuters Abdulrahman Alfozan loved Saudi Arabia. One day before arresting the former OpenAI engineer on charges of bugging the office , the Justice Department worried he would flee back to his home country. Alfozan, his wife, and another family member had already booked one-way tickets, the department said in a court filing. It wouldn't be unusual for Alfozan's thoughts to return to the Gulf. The idea of moving back had followed him through his years working in tech. It inspired him to found a nonprofit that connects Silicon Valley talent with Saudi companies, and to join a WhatsApp group with other Gulf professionals. But he stayed in the US for one big reason, he said in a translated interview released in September, in which he detailed his life and work. \"The best place for me to build technical expertise was Silicon Valley,\" Alfozan said. \"You learn from the source, then bring those skills and experiences back home.\" Now, about a year after Alfozan took a job at OpenAI, the company said that it found a recording device \"concealed in toilet paper.\" The device was placed on the back of a television in an executive conference room, according to a complaint filed in the Northern District of California. OpenAI wrote on X that it fired the employee — unnamed at the time — and referred the case to the FBI. The Justice Department arrested Alfozan, who is 35, on October 9 and charged him with using an electronic device to intercept oral communications. Alfozan has not yet filed a plea. His lawyer, William Pernik, said in a statement that the allegations \"appear wholly out of character for him.\" \"Mr. Alfozan came to this country years ago as a young person with a dream,\" Pernik said. \"He spent years studying, working and contributing to an American technological sector that leads the world, a sector built in large part by immigrants like him.\" From Saudi Arabia to Silicon Valley Alfozan grew up in the Eastern Province of Saudi Arabia , where he went to school through high school. His father taught at a technical college in Dammam, and he introduced Alfozan to computer science professors and students, Alfozan said on the September podcast. A turning point was when Alfozan got into Mawhiba, Saudi Arabia's program for gifted students, he said. He bonded with his computer science teachers who would \"stay af", "date_str": "2026-10-14T23:04:27+00:00", "hash": "445709a573a70142", "title_fa": "یک مهندس با استعداد عشق به عربستان سعودی یک دستگاه شکاف پیچیده شده در دستمال توالت.", "summary_fa": "عبدالرحمن الفوزان، یک شهروند سعودی که به عنوان مهندس OpenAI کار می کند، به پشت تلویزیونی نگاه می کند که در آن یک دستگاه ضبط در اتاق کنفرانس قرار داده شده بود. وزارت دادگستری/ رویترز عبدالرحمن الفوزان عاشق عربستان سعودی بود. یک روز قبل از دستگیری مهندس سابق OpenAI به اتهام دست زدن به دفتر، وزارت دادگستری نگران بود که او به کشور خود فرار کند. این اداره در یک پرونده قضایی گفت که آلفوزان، همسرش و یکی دیگر از اعضای خانواده از قبل بلیط های یک طرفه رزرو کرده بودند. بازگشت افکار آلفوزان به خلیج فارس غیرعادی نیست. ایده بازگشت او در طول سال‌های کار در فناوری به دنبال او بود. این الهام بخش او شد تا یک سازمان غیرانتفاعی تاسیس کند که استعدادهای سیلیکون ولی را با شرکت‌های سعودی مرتبط می‌کند و به یک گروه واتس‌اپ با دیگر متخصصان حوزه خلیج بپیوندد. اما او به یک دلیل بزرگ در ایالات متحده ماند، او در مصاحبه ای ترجمه شده که در ماه سپتامبر منتشر شد، گفت که در آن جزئیات زندگی و کار خود را شرح داد. آلفوزان گفت: بهترین مکان برای ساختن تخصص فنی برای من، سیلیکون ولی بود. \"شما از منبع یاد می گیرید، سپس آن مهارت ها و تجربیات را به خانه بازگردانید.\" اکنون، حدود یک سال پس از آن که آلفوزان در OpenAI مشغول به کار شد، این شرکت گفت که یک دستگاه ضبط \"پنهان شده در دستمال توالت\" پیدا کرده است. بر اساس شکایتی که در ناحیه شمالی کالیفرنیا ارائه شده است، این دستگاه در پشت یک تلویزیون در اتاق کنفرانس مدیران قرار داده شده است. OpenAI در X نوشت که این کارمند را - که در آن زمان نامش فاش نشد - اخراج کرد و پرونده را به FBI ارجاع داد. وزارت دادگستری آلفوزان 35 ساله را در 9 اکتبر دستگیر کرد و"}, {"source": "Business Insider", "title": "The best video doorbells for home security without hidden costs", "link": "https://www.businessinsider.com/guides/tech/best-video-doorbells", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Sarah Saril/Business Insider I'll say it: I hate going outside to shop. I love exercising the full capabilities of my Amazon Prime membership to get everything big and small, even if that makes me a juicy target for porch pirates. Luckily, the right smart video doorbell is usually enough of a deterrent for most homes. Get to the point : The Ring Pro Wired Doorbell is our top pick of video doorbells thanks to its impeccable video quality and powerful motion sensing. Shoppers on a budget can opt instead for the Ring Battery 2K for the lowest possible price, or the Wyze Duo Cam Doorbell , which doesn't need a subscription. Beyond scaring off sticky-fingered pedestrians, these handy devices let you vet your visitors, speak with delivery people, and detect suspicious activity without ever getting up from your chair. They're a necessity for users who can't work remotely or travelers who need to keep tabs on house sitters. I spent months putting the best video doorbells to the test to find the ones that are actually worth trusting with your home. What I found was that a precious few can go without a monthly subscription cost, but in exchange, you may never have to get up and answer the door ever again. Our top picks for the best smart video doorbells Best overall : Ring Pro Wired Doorbell Best for Google smart home users : Google Nest Doorbell Best battery : Ring Battery Doorbell 4K Best budget : Ring 2K Battery Doorbell Best subscription-less : Wyze Battery Doorbell Smart doorbells and hidden costs One of the biggest caveats to smart doorbell ownership is that almost none offer a full set of features without additional costs. Subscription fees, memory cards, and other added fees are necessary to use features like 24/7 recording, motion detection, and AI alerts from most brands. So when friends and family ask me, \"Which one doesn't cost extra money?\" it is difficult to answer. Unfortunately, aside from the Wyze Duo Cam, which requires a one-time microSD card purchase, there aren't really any. Each brand has its quirks and membership snags that I'll dive into below. As a rule of thumb, be prepared to pay for a monthly subscription to get the most out of your doorbell, or lower your standards to something less featureful than the video doorbells you see catching TikToks and Instagram Reels. Best overall This doorbell has the best camera of any device on the market. Most fo", "date_str": "2026-10-14T22:23:56+00:00", "hash": "6fa11a51d48ee190", "title_fa": "بهترین زنگ های تصویری برای امنیت خانه بدون هزینه های پنهان", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید سارا ساریل/بیزینس خودی می گویم: از رفتن به بیرون برای خرید متنفرم. من دوست دارم تمام قابلیت های عضویت آمازون پرایم خود را برای به دست آوردن همه چیز بزرگ و کوچک به کار ببرم، حتی اگر این باعث شود که من هدفی شاداب برای دزدان دریایی ایوان باشم. خوشبختانه، زنگ ویدیوی هوشمند مناسب معمولاً برای اکثر خانه‌ها یک عامل بازدارنده است. به اصل مطلب برسید: زنگ در سیمی Ring Pro به لطف کیفیت ویدیویی بی عیب و نقص و حسگر حرکتی قدرتمند، بهترین انتخاب ما از زنگ درهای تصویری است. خریدارانی که بودجه کمی دارند می‌توانند به جای آن، Ring Battery 2K را با کمترین قیمت ممکن یا زنگ در Wyze Duo Cam را انتخاب کنند که نیازی به اشتراک ندارد. علاوه بر ترساندن عابران با انگشت چسبنده، این دستگاه‌های مفید به شما امکان می‌دهند بازدیدکنندگان خود را بررسی کنید، با افراد تحویل‌دهنده صحبت کنید و فعالیت‌های مشکوک را بدون بلند شدن از روی صندلی خود تشخیص دهید. آن‌ها برای کاربرانی که نمی‌توانند از راه دور کار کنند یا مسافرانی که باید مراقب مهمان‌داران خانه باشند، ضروری است. من ماه‌ها وقت گذاشتم تا بهترین زنگ‌های ویدیویی را آزمایش کنم تا زنگ‌هایی را بیابم که واقعاً ارزش اعتماد در خانه شما را دارند. چیزی که من متوجه شدم این بود که تعداد کمی از افراد گرانبها می توانند بدون هزینه اشتراک ماهانه به آنجا بروند، اما در ازای آن، ممکن است دیگر مجبور نشوید که بلند شوید و در را پاسخ دهید. برترین انتخاب‌های ما برای بهترین زنگ‌های ویدیویی هوشمند بهترین در مجموع: Ring Pro Wired Doorbell بهترین برای کاربران خانه‌های هوشمند Google: Google Nest Doorbell بهترین باتری: Ring Battery Doorbell 4K بهترین بودجه: Ring Battery 2K Doorbell بهترین بدون اشتراک:"}, {"source": "Business Insider", "title": "Where to watch UFC: Live stream MMA from anywhere", "link": "https://www.businessinsider.com/guides/streaming/where-to-watch-ufc", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more UFC is now available through Paramount Plus in the US. Stephen R. Sylvanie/IMAGN IMAGES via Reuters Connect 2026 has ushered in a new era of the Ultimate Fighting Championship, at least when it comes to US viewing options. We've compiled everything you need to know about where to watch UFC, including live streaming options for upcoming title fights. ESPN's tenure as the UFC's US broadcast rights holder has come to an end, and with it, so have the hefty pay-per-view (PPV) fees. Beginning in 2026, Paramount Plus now holds the US rights to UFC in a landmark seven-year deal. All subscribers, regardless of service tier, will be able to live stream all UFC coverage, from major numbered events to smaller Fight Nights. Select events will also air directly on CBS. UFC's Paramount era kicked off with a stellar fight card at UFC 324 in January. The event featured a lightweight title fight between Justin Gaethje and Paddy Pimblett and a bantamweight bout between Sean O'Malley and Song Yadong. The remainder of the year includes several additional title fights, including for the featherweight title, bantamweight title, heavyweight title, and the women's bantamweight title. We've gathered all the details on tuning into UFC events below, from Fight Nights to title fights. Keep reading how to live stream the Ultimate Fighting Championship, no matter where you are. See also: How to watch NFL games | How to watch NBA games | How to watch MLB games Where to watch UFC: quick links US: Paramount Plus (from $9/month) Access subscriptions anywhere: NordVPN (risk-free for 30 days) Upcoming events: UFC Fight Night: Buckley vs. Malott on October 17 UFC 333: Volkanovski vs. Evloev on October 24 UFC Fight Night: Moicano vs. Nolan on October 31 UFC 334: Gane vs. Hokit on November 24 UFC Fight Night: Procházka vs. Stirling on November 21 UFC 335: Oliveira vs. Lopes on December 12 Where to watch UFC in the US All UFC events will be available through Paramount Plus in the US. UFC coverage is available through both tiers, Essential and Premium. Essential costs $9 a month and offers ad-supported on-demand streaming. Premium costs $14 a month and unlocks ad-free on-demand streaming, Showtime content, and 24/7 live streams of your local CBS station. You can learn more in our Paramount Plus streaming guide. How to watch UFC everywhere else The US isn't the only country with access to UFC events. Many ", "date_str": "2026-10-14T21:43:07+00:00", "hash": "68e5f6ca6791756b", "title_fa": "کجا می توان UFC را تماشا کرد: پخش زنده MMA از هر کجا", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید UFC اکنون از طریق Paramount Plus در ایالات متحده در دسترس است. Stephen R. Sylvanie/IMAGN IMAGES از طریق رویترز کانکت 2026 دوره جدیدی از مسابقات قهرمانی مبارزه نهایی را آغاز کرده است، حداقل در مورد گزینه های مشاهده در ایالات متحده. ما همه چیزهایی را که باید در مورد مکان تماشای UFC بدانید، جمع آوری کرده ایم، از جمله گزینه های پخش زنده برای مبارزات عنوانی آینده. دوران تصدی ESPN به عنوان دارنده حقوق پخش UFC در ایالات متحده به پایان رسیده است، و به همراه آن، هزینه های سنگین پرداخت به ازای هر نمایش (PPV) نیز به پایان رسیده است. از سال 2026، پارامونت پلاس اکنون حقوق UFC را در ایالات متحده در یک قرارداد هفت ساله دارد. همه مشترکین، صرف نظر از سطح خدمات، می‌توانند تمام پوشش‌های UFC، از رویدادهای شماره‌دار اصلی گرفته تا Fight Night‌های کوچک‌تر را به صورت زنده پخش کنند. رویدادهای منتخب نیز مستقیماً از CBS پخش خواهند شد. دوره پارامونت UFC با یک کارت مبارزه درخشان در UFC 324 در ژانویه آغاز شد. این رویداد شامل یک مبارزه با عنوان سبک وزن بین جاستین گیتجه و پدی پیمبلت و مبارزه با وزن بین شان اومالی و سونگ یادونگ بود. باقی‌مانده سال شامل چندین مبارزه عنوان اضافی، از جمله برای عنوان پر وزن، عنوان بانتاموز، عنوان سنگین وزن، و عنوان وزن باطل زنان است. ما تمام جزئیات مربوط به تنظیم رویدادهای UFC را در زیر جمع آوری کرده ایم، از Fight Nights گرفته تا مبارزات عنوان. بدون توجه به اینکه کجا هستید، به خواندن نحوه پخش زنده مسابقات قهرمانی نهایی مبارزه ادامه دهید. همچنین ببینید: نحوه تماشای بازی های NFL | نحوه تماشای بازی های NBA | نحوه تماشای بازی‌های MLB محل تماشای UFC: پیوندهای سریع"}, {"source": "Business Insider", "title": "Ex-OpenAI employee accused of planting a recording device booked a one-way ticket to Saudi Arabia", "link": "https://www.businessinsider.com/openai-employee-recording-device-one-way-tickets-saudi-arabia-2026-10", "summary": "OpenAI previously said it used its AI models to help identify the employee who allegedly planted a recording device. Samuel Boivin/NurPhoto via Getty Images A former OpenAI engineer accused of planting a recording device had one-way tickets to Saudi Arabia booked. Federal prosecutors disclosed Abdulrahman Alfozan's travel plans in previously sealed court documents. Alfozan was arrested on October 9 and made his first court appearance on Tuesday. Federal prosecutors said a former OpenAI engineer accused of planting a recording device had a one-way ticket booked to Saudi Arabia. In newly unsealed court documents, it was revealed that the federal government feared its case against Abdulrahman Alfozan, a Saudi national, might be jeopardized if information about it leaked. \"The defendant, his wife, and a third family member have booked one-way tickets from San Francisco to Saudi Arabia (via Istanbul) for Monday, October 12, 2026,\" the prosecutors, including US Attorney for the Northern District of California Craig Missakian, wrote in an October 8 court filing. The prosecutors wrote that Alfozan had \"the means—and will have an incentive—to flee the United States sooner if he learns about this case before he is arrested.\" On October 9, the FBI arrested Alfozan. He made his initial court appearance on Wednesday when the government unveiled its case against him. Alfozan has been charged with \"use of an electronic, mechanical, or other device to intercept oral communications,\" a felony that carries a maximum of five years in prison. According to the criminal complaint against Alfozan, the company found a USB device surreptitiously placed on the back of a television located in an \" executive conference room.\" The device was concealed in toilet paper, the complaint said. Alfozan's lawyer did not immediately respond to a request for comment from Business Insider. OpenAI previously said in a statement that it used \"our models to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier.\" Read the original article on Business Insider", "date_str": "2026-10-14T21:21:56+00:00", "hash": "3bb4b8bc82865aad", "title_fa": "کارمند سابق OpenAI متهم به نصب یک دستگاه ضبط، بلیط یک طرفه به عربستان سعودی را رزرو کرد", "summary_fa": "OpenAI قبلاً گفته بود که از مدل های هوش مصنوعی خود برای کمک به شناسایی کارمندی که ظاهراً یک دستگاه ضبط کار گذاشته است استفاده می کند. ساموئل بویوین/نورعکس از طریق گتی ایماژ یک مهندس سابق OpenAI که متهم به نصب دستگاه ضبط شده بود، بلیط یک طرفه به عربستان سعودی رزرو کرده بود. دادستان های فدرال برنامه های سفر عبدالرحمن الفوزان را در اسناد دادگاهی که قبلا مهر و موم شده بود، افشا کردند. آلفوزان در 9 اکتبر دستگیر شد و روز سه شنبه برای اولین بار در دادگاه حاضر شد. دادستان های فدرال گفتند که یک مهندس سابق OpenAI متهم به کار گذاشتن دستگاه ضبط، بلیت یک طرفه به عربستان سعودی رزرو کرده بود. در اسناد دادگاهی که به تازگی مهر و موم نشده است، فاش شد که دولت فدرال نگران است که در صورت افشای اطلاعات مربوط به آن، پرونده آن علیه عبدالرحمن الفوزان، یک تبعه سعودی، به خطر بیفتد. دادستان ها، از جمله دادستان ناحیه شمالی کالیفرنیا، کریگ میساکیان، در پرونده دادگاهی در 8 اکتبر نوشتند: متهم، همسرش و یکی از اعضای خانواده سوم بلیط های یک طرفه سانفرانسیسکو به عربستان سعودی (از طریق استانبول) را برای دوشنبه 12 اکتبر 2026 رزرو کرده اند. دادستان ها نوشتند که آلفوزان \"امکانات را دارد - و انگیزه ای هم خواهد داشت - اگر قبل از دستگیری از این پرونده مطلع شود، زودتر از ایالات متحده فرار کند.\" در 9 اکتبر، اف بی آی آلفوزان را دستگیر کرد. او روز چهارشنبه هنگامی که دولت از پرونده خود علیه او رونمایی کرد، اولین جلسه دادگاه خود را ارائه کرد. آلفوزان به «استفاده از وسایل الکترونیکی، مکانیکی یا سایر وسایل برای رهگیری ارتباطات دهانی» متهم شده است، جرمی که حداکثر پنج سال زندان دارد. بر اساس شکایت جنایی علیه آلفوزان، این شرکت یک دستگاه USB را به طور مخفیانه در پشت"}, {"source": "Business Insider", "title": "Best products to protect furniture from cat scratching", "link": "https://www.businessinsider.com/guides/pets/how-to-stop-cat-from-scratching-couch", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We talked to veterinarians and cat behaviorists to learn how to stop cats from scratching furniture, and we evaluated the best furniture guards. Janelle Leeson/Business Insider If you're trying to figure out how to stop your cat from scratching the furniture, it helps to understand why they do it in the first place. Scratching is a natural behavior for cats. They scratch to stretch, keep their claws in good shape for climbing and hunting, and mark their territory, through both scents and visible signs, says Dr. Maggie Placer , a veterinarian and the veterinary sciences program manager at EveryCat Health Foundation. To find the best products to protect furniture from scratching, we consulted veterinarians and cat behaviorists and enlisted four cats to test everything from couch protectors to scratching posts. In total, we've tried 30 products designed to prevent destructive scratching. Our top picks at a glance: The Sofa Scratcher Squared is a durable sisal-covered scratching post that fits neatly around the corners of couches and chairs. We appreciate its minimalist design and neutral color options. For other areas, like beds and the sides of chairs and couches, I recommend Panther Armor Heavy Duty Clear Protectors . These discreet, transparent barriers can be cut to size to fit your furniture. For the best results, pair them with a sturdy scratching post, such as the 32-inch tall SmartCat Ultimate Scratching Post . Keep in mind that cats may scratch furniture for several reasons. Some lack access to alternatives, such as scratching posts or pads. Others may have dedicated scratchers, but keep returning to your furniture; those might not be placed in the right spots, or their scratching surfaces may be worn out and need replacement. Some cats simply prefer the height of the furniture or the sensation of scratching a couch or carpet. Whatever the reason, you can redirect your cat's scratching by offering them more appealing alternatives. Our top picks to stop cats from scratching furnitu u of important tasks. But after using the Apple Watch Series 12 for a couple of weeks, I've been underwhelmed by its current state. That's partly because some of its new health and Apple Intelligence features aren't out yet. But even then, I remain skeptical about their usefulness. To be clear, the Apple Watch Series 12 is technically an improvement over the Series 11 and a worthy entry in Apple's flagship smartwatch line, but it's best suited for newcomers to the Apple Watch or those who own a Series 8 or older. Those with a Series 9 or newer are probably better off skipping this year's release and waiting to see what comes next. Shopping for more wearable devices? Check out our guides to the best Apple Watches and best fitness trackers . The Series 12 looks a lot like the Series 11, but there are some design and hardware tweaks The aluminum Apple Watch Series 12 uses a new Ceramic Shield 2 glass that is more durable than past models. Tyler Hayes/Business Insider Like the Series 11, the Apple Watch Series 12 is available in 42 or 46mm sizes, with or without cellular connectivity, with prices starting at $399 for the base configuration. But while this new model has the same core design as its predecessor, there are some upgrades here and there. You can still choose between aluminum and titanium cases, but there's also a new ceramic case option. In addition, the", "date_str": "2026-10-14T20:59:00+00:00", "hash": "cbbac7ced4a8dbbe", "title_fa": "بررسی اپل واچ سری 12: چه چیزی جدید است و آیا ارزش ارتقا دارد؟", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید اپل واچ سری 12 قابلیت های سلامت و هوش مصنوعی جدیدی را ارائه می دهد، اما چندین ویژگی هنوز در دسترس نیست. تایلر هیز/Business Insider اپل واچ کمی دچار بحران هویت شده است. از همان ابتدا، پوشیدنی های اپل حول اعلان ها، تماس ها، پیامک ها و ردیابی فعالیت های عمومی ساخته شدند. از این نظر، ساعت های هوشمند آن برای کاربران معمولی عالی بوده است. اما اپل وا ready available to preorder, if you're interested in being among the first to try them. Here's how you can reserve the HomeView, Apple TV 4K, and HomePod mini 2 today. The best preorder deal on the Apple HomeView Apple's HomeView is a unique product for the company. With it, you can control your entire smart home, chat with Siri AI, check your messages, take FaceTime calls, and play music, among other tasks. Though it's generally far more limited than an iPad , it's the only device of the two to offer individualized experiences per user: It can recognize up to six people in your household and display personalized information (like Messages) for each. You can preorder the HomeView from stores like Apple , Amazon , and Best Buy . However, if you opt for Amazon, you can take $10 off the Space Gray and Starlight standard models: Space Gray ($289.99) Silver ($299) Starlight ($289) Rose Pink ($299) Space Gray (Wall Mounted) ($299) Silver (Wall Mounted) ($299) Just remember: If you're buying a wall-mounted option, you'll need to buy the actual mount separately. If you buy the Power Mount USB-C wall connector , that'll add $59.99 to your total, while the Power Mount AC-wired option will add $79.99. Apple HomeView (Space Gray) $289.99 at Amazon Pre-order Here Pre-order Here $289.99 at Amazon How to preorder the Apple TV 4K Apple's newest Apple TV 4K looks a lot like the previous model, but what's inside has changed. This model uses Apple's A19 chip and can connect to up to four HomePod devices at once. The new Siri Remote supports Precision Finding through Find My, and has a speaker you can ping if you lose it in your couch. Apple doesn't always make its product names all that clear. For example, the latest iteration of Apple TV 4K is sim", "date_str": "2026-10-14T19:00:00+00:00", "hash": "cd9afbf1028bef73", "title_fa": "نحوه پیش‌سفارش HomeView و دیگر دستگاه‌های هوشمند جدید اپل", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت قرارداد و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اپل دیروز در جریان رویداد \"Welcome Home\" خود تعداد زیادی دستگاه جدید را معرفی کرد. Apple HomeView، اولین مرکز نمایشگر هوشمند این شرکت، با نمایشگر هفت اینچی مربعی خود و طراحی «اپل واچ بزرگ با iMac G4» نمایش را ربود، اما اپل همچنین با ال‌جی و اشنایدر در مجموعه‌ای از دستگاه‌های هوشمند مانند چراغ‌ها، زنگ درها و دوربین‌ها که HomeView می‌تواند کنترل کند، همکاری می‌کند. به علاوه، این شرکت همچنین به‌روزرسانی‌هایی را برای محصولات موجود، از جمله Apple TV 4K و HomePod mini اعلام کرد. هیچ یک از این موارد در حال حاضر برای تحویل در فروشگاه موجود نیست. با این حال، بسیاری از آنها، اما نه همه آنها، در حال حاضر برای پیش‌سفارش در دسترس هستند، اگر می‌خواهید جزو اولین کسانی باشید که آنها را امتحان می‌کنند. در اینجا نحوه رزرو HomeView، Apple TV 4K و HomePod mini 2 امروز آمده است. بهترین معامله پیش‌سفارش Apple HomeView HomeView اپل محصولی منحصربه‌فرد برای این شرکت است. با استفاده از آن، می‌توانید کل خانه هوشمند خود را کنترل کنید، با Siri AI چت کنید، پیام‌های خود را بررسی کنید، تماس‌های FaceTime را دریافت کنید و موسیقی پخش کنید. اگرچه به طور کلی بسیار محدودتر از یک iPad است، اما تنها دستگاهی از این دو است که تجربیات فردی را برای هر کاربر ارائه می‌کند: می‌تواند حداکثر شش نفر را در خانواده شما تشخیص دهد و اطلاعات شخصی‌سازی شده (مانند پیام‌ها) را برای هر یک نمایش دهد. می‌توانید HomeView را از فروشگاه‌هایی مانند Apple، Amazon و Best Buy پیش‌سفارش دهید. با این حال، اگر آمازون را انتخاب کنید، می‌توانید 10 دلار از مدل‌های استاندارد Space Grey و Starlight تخفیف بگیرید: Space Grey (289.99 دلار) نقره‌ای (299 دلار)"}, {"source": "Lifehacker", "title": "The Best OLED TV for Most People Is $400 Off Right Now", "link": "https://lifehacker.com/tech/samsung-s90h-oled-tv-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. OLEDs are known for having the best picture quality TVs can offer, if you're okay with the trade-offs . One of the bigges
