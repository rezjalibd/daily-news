<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۱ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۱ آذر ۱۴۰۵</span>

    <div class="search-box">

    <div class="tabs">

      <button class="tab-btn" onclick="switchTab('tech', this)">

        <span class="badge" id="badge-tech">۴</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۲</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

      tech: [{"source": "Engadget", "title": "Why so many desktop PC cases have glass walls (and why you might not want that)", "link": "https://www.engadget.com/2318044/desktop-pc-why-tempered-glass-walls-downsides/", "summary": "Tempered glass has taken over the PC case market. Learn what drives the trend and the trade-offs that could make a glass-panel build a poor fit for you.", "date_str": "2026-11-21T14:30:00+00:00", "hash": "cf8abc7d026de015", "title_fa": "چرا بسیاری از کیس های کامپیوترهای رومیزی دارای دیوارهای شیشه ای هستند (و چرا ممکن است شما آن را نخواهید)", "summary_fa": "شیشه سکوریت شده بازار کیس رایانه های شخصی را به خود اختصاص داده است. بیاموزید که چه چیزی باعث این روند و معاوضه هایی می شود که می تواند یک پانل شیشه ای را برای شما مناسب سازد. پنل‌های شیشه‌ای سکوریت شده به شما امکان می‌دهند نورپردازی گران‌قیمت GPU و RGB خود را به رخ بکشید، اما آن‌ها با چند تفاوت همراه هستند. Amoklv/Getty Images افزودن Engadget در Google: منبع برگزیده Google Discover ممکن است برای خریدهای انجام شده از پیوندها کمیسیون دریافت کنیم. فرهنگ بازی در رایانه شخصی با بازی در PS5 یا Xbox Series X تفاوت زیادی دارد. اما PS5 را با یک ریگ سفارشی مقایسه کنید که برای اجرای بهترین بازی‌های رایانه شخصی مانند Cyberpunk 2077 با کیفیت 4K و 120 فریم بر ثانیه با فعال کردن ردیابی کامل مسیر ساخته شده است، و ساخت‌های رایانه شخصی دقیقاً ظریف نیستند. بسیاری از کیس‌های رایانه‌های شخصی این روزها از پنل‌های شیشه‌ای استفاده می‌کنند، عمدتاً به این دلیل که اکثر گیمرهای هاردکور می‌خواهند قطعات گران قیمت خود را به رخ بکشند. به شرطی که اجزای خود را بشناسید و راحت در ساخت دکل بازی خود راحت باشید، احتمال زیادی وجود دارد که با یک کیس با پنل‌های شیشه‌ای مقاوم استفاده کنید. و صادقانه بگویم، اگر به یک راه‌اندازی سخت‌افزاری خودنمایی می‌خواهید که به شدت دارای نورپردازی RGB است، باید. مطمئناً، مشکلات جزئی وجود دارد که می تواند از داشتن دکل با پانل های شیشه ای ناشی شود، اما آنها بسیار غیر معمول هستند. فرقی نمی‌کند دستگاهی مینیمال‌تری می‌خواهید یا یک سیستم شیشه‌ای که رایانه گران‌قیمت خنک‌شده با مایع شما را به نمایش بگذارد، بیایید وارد فرهنگ پنل رایانه شخصی شویم. RSplaneta/Shutterstock Aesthetics دلیلی است که بسیاری از بازیکنان رایانه شخصی می‌خواهند یک دستگاه بازی سفارشی ساخته شوند. در عصری که بسیاری از ما برای جلوگیری از RAMagedon 2026، رایانه‌های", "image_url": "https://www.engadget.com/img/gallery/why-so-many-desktop-pc-cases-have-glass-walls-and-why-you-might-not-want-that/l-intro-1794852287.jpg", "category": "تراشه و سخت‌افزار", "tags": ["Google"], "datetime_fa": "۳۰ آبان • ۱۸:۰۰"}, {"source": "Zoomit", "title": "مالکیت شخصی ویلا، بهره‌برداری هتلی؛ دنسه از پروژه «کاندوتل» رونمایی کرد", "link": "https://www.zoomit.ir/report/471602-donse-condotel-chalus-tourism-investment/", "summary": "گروه دنسه با ۹ مجموعه اقامتی فعال، از ساخت پروژه‌ای در چالوس خبر داد که مالکیت شخصی واحدها را با بهره‌برداری هتلی و درآمد اجاره ترکیب می‌کند.", "date_str": "2026-11-21T14:28:19+00:00", "hash": "64547798781bf6ca", "title_fa": "مالکیت شخصی ویلا، بهره‌برداری هتلی؛ دنسه از پروژه «کاندوتل» رونمایی کرد", "summary_fa": "گروه دنسه با ۹ مجموعه اقامتی فعال، از ساخت پروژه‌ای در چالوس خبر داد که مالکیت شخصی واحدها را با بهره‌برداری هتلی و درآمد اجاره ترکیب می‌کند. تبلیغات گروه دنسه در نشست خبری خود، برنامه توسعه «کاندوتل» را به‌عنوان گام تازه فعالیتش معرفی کرد؛ مدلی که در آن، خریدار مالک یک واحد اقامتی می‌شود و در زمان‌هایی که از آن استفاده نمی‌کند، واحد تحت مدیریت یک برند هتل به مسافران اجاره داده می‌شود. مدیران این گروه، هدف از ورود به این حوزه را فعال‌کردن سرمایه‌های محبوس در خانه‌های دوم و ایجاد درآمد برای مالکان و جوامع محلی عنوان کردند. دنسه که فعالیت خود را با مدیریت و بهره‌برداری از اقامتگاه‌های موجود آغاز کرده، اکنون ۹ مجموعه فعال با ظرفیت سالانه ۳۷ هزار و ۹۶۰ اتاق‌شب دارد. به گفته نیما قاضی، نرخ اشغال مجموعه‌های این گروه در شمال کشور در نیمه نخست سال به ۸۳ درصد رسیده است. کپی لینک پروژه چالوس؛ ترکیب مالکیت شخصی و خدمات هتلی صادق ارنواز، مدیرعامل دنسه توسعه، اعلام کرد: نخستین پروژه کاندوتل این گروه در چالوس در حال ساخت است و برنامه توسعه این مدل در نقاط دیگر کشور نیز دنبال می‌شود. او این پروژه را اولین کاندوتل ایران معرفی کرد. ارنواز در توضیح این مدل گفت: خانه امکان مالکیت شخصی را فراهم می‌کند و هتل، خدمات اقامت و بهره‌برداری حرفه‌ای دارد. کاندوتل این دو ویژگی را کنار یکدیگر قرار می‌دهد تا مالک بتواند علاوه بر استفاده شخصی، از درآمد گردشگری نیز سهم ببرد. او توضیح داد که در مدل موردنظر دنسه، خریدار مالک واحد و دارای سند ملکی است؛ بنابراین مالکیت او، مانند مدل تایم‌شیرینگ، صرفاً به حق استفاده از اقامتگاه در بازه‌ای مشخص محدود نمی‌شود. مدیرعامل دنسه توسعه، مالکیت، درآمد، برند و تجربه اقامت را چهار مؤلفه اصلی این محصول دانست. به گفته او، مدیریت نگهداری و بهره‌برداری مجموعه بر عهده بهره‌بردار قرار", "image_url": "https://api2.zoomit.ir/media/danseh-condotel-project-chalus-6b01a5c59b46b92631a7b375?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳۰ آبان • ۱۷:۵۸"}, {"source": "Engadget", "title": "Etsy says it will not use sellers' content to train AI after they revolt over policy changes", "link": "https://www.engadget.com/2324090/etsy-not-use-seller-content-train-ai/", "summary": "Etsy changed its terms of use, adding a clause on AI training. Now, it has clarified that it will not use sellers' content to train AI that can copy their work.", "date_str": "2026-11-21T14:25:25+00:00", "hash": "db58f078951cf7db", "title_fa": "Etsy می گوید از محتوای فروشندگان برای آموزش هوش مصنوعی پس از شورش آنها بر سر تغییرات سیاست استفاده نخواهد کرد", "summary_fa": "Etsy شرایط استفاده خود را تغییر داد و یک بند در مورد آموزش هوش مصنوعی اضافه کرد. اکنون، مشخص کرده است که از محتوای فروشندگان برای آموزش هوش مصنوعی که بتواند کارهای آنها را کپی کند، استفاده نخواهد کرد. پس از به‌روزرسانی شرایط استفاده، فروشندگان وب‌سایت را ترک کرده‌اند. Mamun_Sheikh/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover Etsy فروشندگان پلتفرم را پس از به‌روزرسانی شرایط استفاده خود با زبانی که نشان می‌دهد می‌تواند از محتوای آنها برای آموزش هوش مصنوعی استفاده کند، کنار گذاشته‌اند. به طور دقیق، افزوده جدید به شرایط آن بیان می‌کند که Etsy و «شریک‌ها و فروشندگان شخص ثالث» آن حق استفاده از محتوای فروشندگان را برای «توسعه، آموزش، آزمایش و بهبود فناوری‌های هوش مصنوعی و یادگیری ماشین» خواهند داشت. این بند اضافه شده جدید است و قرار است در تاریخ 16 دسامبر به همراه سایر تغییرات در شرایط وب سایت اعمال شود. همانطور که نیویورک تایمز گزارش می دهد، افرادی که کالاهای دست ساز را در Etsy می فروختند، وب سایت را از زمان به روز رسانی شرایط آن به دلیل نگرانی از اینکه آثار هنری و خلاقیت آنها برای آموزش هوش مصنوعی گرفته شود، ترک کردند. Etsy در یک پست جدید در وب سایت خود از شرایط به روز شده خود دفاع کرد. گفته می‌شود که تغییر زبان صرفاً به منظور روشن کردن چگونگی استفاده از هوش مصنوعی در بازار است. جیمز عسمن، معاون عملیات این شرکت گفت: «ما از محتوای شما برای آموزش مدل‌های هوش مصنوعی که برای کپی کردن کار اصلی شما یا جایگزینی خلاقیت شما طراحی شده‌اند، استفاده نمی‌کنیم. \"باز هم، این تغییر نمی کند. هدف ما در Etsy همیشه این بوده است که شما و اقلام منحصر به فرد خود را با خریداران مرتبط کنیم.\" او همچنین گفت که محتوای فروشندگان متعلق به آنهاست و Etsy \"ادعا نمی‌کند که ساخته‌های", "image_url": "https://www.engadget.com/img/gallery/etsy-says-it-will-not-use-sellers-content-to-train-ai-after-they-revolt-over-policy-changes/l-intro-1795270607.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۳۰ آبان • ۱۷:۵۵"}, {"source": "Engadget", "title": "What data storage looked like in the early 2000s vs. today", "link": "https://www.engadget.com/2318027/what-data-storage-looked-like-early-2000s-vs-today/", "summary": "We ve come a long way in storage technology in just 25 years, from floppies and tiny USB drives to massive SSDs and cloud storage.", "date_str": "2026-11-21T14:15:00+00:00", "hash": "f251f7d7d2c05179", "title_fa": "ذخیره سازی داده ها در اوایل دهه 2000 در مقایسه با امروز چگونه بود", "summary_fa": "ما تنها در 25 سال گذشته راه درازی را در فناوری ذخیره سازی پیموده ایم، از فلاپی ها و درایوهای USB کوچک گرفته تا SSD های عظیم و فضای ذخیره سازی ابری. اولین درایوهای فلش USB 8 مگابایت داشتند. بزرگترین هارد دیسک های امروزی دارای ظرفیت 44 ترابایت هستند. Yauheni Kazlou/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover ذهن خود را به 25 سال قبل از سال 2001 برگردانید. شما به تازگی نوشتن یک مقاله مدرسه یا ایجاد یک لیست پخش از MP3 های تازه پاره شده را به پایان رسانده اید، و اکنون باید آن را از رایانه شخصی خود حذف کنید. یک برج بزرگ بژ در زیر میز و جعبه ای از دیسک های فلاپی در کشو وجود دارد - یا اگر خانواده شما به خصوص اهل فن بود، یک دوک سی دی خالی. اگر هر چیزی که می‌خواهید از کامپیوتر بیرون بیاورید بزرگتر از 1.44 مگابایت بود، فلاپی دیسک بیرون بود. در آن زمان، ذخیره سازی چیزی بود که می توانستید نگه دارید، برچسب بزنید و با انداختن آن در پشت میز از دست بدهید. فضای ذخیره سازی روی دستگاه نیز یک کالای ممتاز بود، با یک کامپیوتر سطح پایه با ظرفیت هارد دیسک 10 گیگابایت یا بیشتر. امروزه، بزرگ‌ترین هارد دیسک‌های مصرفی حدود 24 ترابایت تا 30 ترابایت هستند، در حالی که هاردهای تجاری تا 44 ترابایت و حافظه‌های SSD مصرفی به حدود 8 ترابایت می‌رسند. با این حال، امروزه بیشتر داده‌های ما روی آن دیسک‌های سخت تجاری در مرکز داده‌ای قرار می‌گیرند که هرگز نخواهیم دید. و پس از سال‌ها ارزان‌تر شدن، همه آن فضا شروع به گران‌تر شدن کرده است. در اوایل دهه 2000، سازندگان هارد دیسک کمتر از 60 دلار برای آن درایوهای 10 گیگابایتی یا حدود 6 دلار به ازای هر گیگابایت عنوان می کردند. هر چیزی که می‌خواهید بین دستگاه‌ها", "image_url": "https://www.engadget.com/img/gallery/what-data-storage-looked-like-in-the-early-2000s-vs-today/l-intro-1794851487.jpg", "category": "اقتصاد و بازرگانی", "tags": ["Google"], "datetime_fa": "۳۰ آبان • ۱۷:۴۵"}],
      media: [{"source": "Rolling Stone", "title": "‘Grand Theft Auto VI: The Album’ Is All Over the Place (in a Good Way)", "link": "https://www.rollingstone.com/music/music-album-reviews/grand-theft-auto-vi-soundtrack-album-review-1235662012/", "summary": "Featuring everyone from Travis Scott to Fuerza Regida to Michael McDonald, the soundtrack to the blockbuster video game is like a radio dial spinning on hyperspeed", "date_str": "2026-11-21T14:41:00+00:00", "hash": "0840449c37249f16", "title_fa": "«Grand Theft Auto VI: The Album» در همه جا (به روشی خوب)", "summary_fa": "موسیقی متن این بازی ویدیویی پرفروش با حضور همه افراد از تراویس اسکات گرفته تا فوئرزا رجیدا و مایکل مک دونالد، مانند یک شماره گیری رادیویی است که با سرعت بالا می چرخد. ایستگاه‌های رادیویی درون‌جهانی بازی، موسیقی متن تلاش‌های جنایی و عاشقانه آن را فراهم می‌کنند، به طوری که رانندگان از پخش جریانی اجتناب می‌کنند و شماره‌گیر را تکان می‌دهند تا زمانی که موارد دلخواه خود را پیدا کنند. Grand Theft Auto VI: آلبوم، به‌طور مناسب، شبیه یک چرخش دیوانه‌وار از صفحه‌ای آنقدر عریض است که می‌تواند حتی در یک ایستگاه موسیقی جاز هموار جابجا شود. آهنگ افتتاحیه «Starting From Zero» که با همکاری دوتایی aggro-electro Justice (که آهنگسازی بازی را انجام داد) و مایکل مک‌دونالد، خواننده روح، شنونده را به عالی منتقل می‌کند، ترکیبی از آهنگ‌های تند تند و صدای مک‌دونالد که فوراً قابل شناسایی است، به روزهای پرفروش فیلم و محبوبیت. مطمئناً پاستیشه است، اما پاستیچ به خوبی انجام شده است، و با کات پایانی آلبوم به خوبی بسته می شود. «Overtown Lights»، همکاری بین استنلی کلارک، نوازنده بیس Return to Forever، رابرت گلاسپر، پیانیست و رهبر گروه، و درامر یوسف دیز، رانندگی بی‌دیهانه آخر شب را در خیابان‌های مملو از باران و روشنایی با چراغ‌های جلوی منعکس شده تداعی می‌کند. اگر Grand Theft Auto VI: The Album فقط مجموعه‌ای از ادای احترام به روزهای خوب قدیمی تی‌شرت‌های نئونی همراه با بلیزر بود، احتمالاً یک گوش‌دادن خوب بود، همانطور که گروه‌های Justice-SZA-King Gizzard-Tame Impala «Flower In A Hurricane-Lipaaady-Cuting-Lipaady» که ژانر آن را به هم متصل می‌کنند، نشان می‌دهد. اما این مجموعه چیزی فراتر از آن است - شبیه به بازی، که جزئیات پیچیده آن را به طور محکم در نسخه ای پیشرفته از زمان حال قرار می دهد، این یک نمایش گسترده از لحظه فعلی موسیقی محبوب است.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/gta-6-review-soundtrack.jpg?crop=0px%2C83px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۳۰ آبان • ۱۸:۱۱"}, {"source": "Rolling Stone", "title": "Jason Scott and the High Heat Are the Cool, If Raunchy, Band Americana Music Needs", "link": "https://www.rollingstone.com/music/music-features/jason-scott-and-the-high-heat-interview-shit-show-1235661922/", "summary": "The Oklahoma City outfit serve up decadence in the video for \"Shit Show\" and blood in the clip for \"How to Get Away With Murder,\" two tracks off their Play Boy album", "date_str": "2026-11-21T14:30:00+00:00", "hash": "bb9369d743328ea5", "title_fa": "جیسون اسکات و گرمای بالا به گروه موسیقی آمریکاییانا نیاز دارد", "summary_fa": "جیسون اسکات، رهبر گروه همنام جیسون اسکات و هی هیت، می‌گوید لباس اوکلاهاما سیتی در ویدیوی «Shit Show» و خون در کلیپ «How to Get Away With Murder»، دو قطعه از آلبوم Play Boy «من پشت فرمان ون می‌نویسم»، انحطاط را نشان می‌دهد. \"زمان دیگری وجود ندارد.\" با این حال، رایان مگنانی، نوازنده باس، مزخرف می‌گوید: ون تنها یکی از مکان‌هایی است که اسکات، نویسنده پرکار اوکلاهاما، قادر به ارائه مطالبی است. مگنانی می‌گوید: «همین روز، از یک درایو بیرون آمدی و گفتی، «فکر می‌کنم یک آهنگ باحال نوشتم.» و من به اطراف نگاه می‌کنم، مثل «کجا آهنگ نوشتی؟ گیتار نداری». گفت: «نه، من فقط به آن فکر می‌کردم.» اسکات می‌گوید: «این هیچ معنای ذاتی ندارد، و از جایی به‌جز «این تنها کاری است که ما در اینجا انجام می‌دهیم.»»» با اسکات در گیتار و آواز و Magnani در باس، High Heat شامل گابریل موریسون و گیتار، براون و گیتار است. \"بابی\" وید در طبل. تیلور جانسون، یکی از اعضای سابق گروه، تهیه کننده گروه است. در این بعد از ظهر خاص، آنها دور یک میز در یک میخانه ایرلندی در Upper West Side منهتن جمع شده‌اند، از یک مسابقه اروپایی با گرما وارد می‌شوند و برای یک برنامه صبح شنبه CBS در روز بعد آماده می‌شوند. با هم، High Heat گروهی از افراد ناسازگار اهل اوکلاهاما هستند که می توانند در یک لحظه صمیمانه و در لحظه دیگر بی احترام باشند. گروه زمانی که Play Boy را در اوایل تابستان به جهان معرفی کردند، به سمت دومی متمایل شدند و با انتشار فیلم \"Shit Show\" و ویدئوی همراه آن، به دنیا آمدند. انتخاب سردبیر 250 آلبوم برتر قرن 21 تا کنون 100 بهترین قسمت تلویزیونی تمام دوران 500 آلبوم برتر تمام دوران 100 بهترین فیلم قرن 21", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/JasonScottandtheHighHeat-Photo-Credit-Wes-Walker.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۳۰ آبان • ۱۸:۰۰"}]

//news.recart.ir/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
