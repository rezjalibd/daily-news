<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۲۱ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۲۱ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۱۲ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۸</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۲۳</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۹</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>
    const data = {
      persian: [{"source": "Independent Persian", "title": "کلیه سه‌ونیم میلیارد تومان، مغز استخوان چهار میلیارد؛ چهره عریان فقر", "link": "https://www.independentpersian.com/node/423164/%DA%A9%D9%84%DB%8C%D9%87-%D8%B3%D9%87%E2%80%8C%D9%88%D9%86%DB%8C%D9%85-%D9%85%DB%8C%D9%84%DB%8C%D8%A7%D8%B1%D8%AF-%D8%AA%D9%88%D9%85%D8%A7%D9%86%D8%8C-%D9%85%D8%BA%D8%B2-%D8%A7%D8%B3%D8%AA%D8%AE%D9%88%D8%A7%D9%86-%DA%86%D9%87%D8%A7%D8%B1-%D9%85%DB%8C%D9%84%DB%8C%D8%A7%D8%B1%D8%AF%D8%9B-%DA%86%D9%87%D8%B1%D9%87-%D8%B9%D8%B1%DB%8C%D8%A7%D9%86-%D9%81%D9%82%D8%B1", "summary": "همزمان با گسترش فقر و سقوط قدرت خرید خانواده‌ها در ایران، گزارش‌های تازه از خیابان‌های تهران ابعاد تکان‌دهنده‌ای از بحران معیشتی در نظام جمهوری اسلامی ایران را آشکار می‌کند. در خیابان فرهنگ حسینی تهران که به «خیابان کلیه» شهرت یافته، دیوارها و درهای ساختمان‌ها از آگهی فروش اعضای بدن پر شده است. البته فروشندگان تنها به عرضه کلیه هم اکتفا نکرده‌اند و در میان آگهی‌ها، برای فروش کبد، مغز استخوان و حتی بیضه نیز اعلام آمادگی شده است. خبرنگار ایلنا در گزارشی میدانی، با شماری از فروشندگان اعضای بدن گفت‌وگو کرده است؛ این افراد در انواع مشاغل از پیک موتوری و کارگر ساختمانی گرفته تا مشاغل آزاد کار می‌کنند و برای پرداخت بدهی، تأمین پول رهن خانه یا جبران هزینه‌های زندگی حاضر شده‌اند بخشی از بدنشان را بفروشند. این گزارش در شرایطی منتشر می‌شود که طی سال‌های گذشته، همزمان با افزایش تورم، گرانی مسکن، کاهش ارزش ریال و سقوط دستمزدها، آگهی‌های فروش اعضای بدن به یکی از نشانه‌های بحران فقر در ایران تبدیل شده‌ است. اکنون روایت‌های تازه نشان می‌دهد که فشار اقتصادی حتی برخی افراد شاغل و دارای درآمد را نیز به چنین نقطه‌ای رسانده است. عابران پیاده در خیابان فرهنگ حسینی و خیابان مجاور آن، والی‌نژاد، با انبوه آگهی‌های فروش اعضای بدن مواجه می‌شوند. نزدیکی این خیابان‌ها به انجمن خیریه حمایت از بیماران کلیوی و مراکز درمانی، باعث شده است افرادی که به دنبال عضو پیوندی‌اند و کسانی که قصد فروش عضو دارند، در این محدوده به یکدیگر نزدیک شوند. یکی از کارکنان بیمارستان صدرا، واقع در انتهای خیابان فرهنگ حسینی، می‌گوید انتظار برای دریافت کلیه از مسیر رسمی ", "title_fa": "صدها مدرسه در ایتالیا تهدید به بمب‌گذاری شدند", "summary_fa": "حدود ۳۰۰ مدرسه در سراسر ایتالیا تهدید به بمب‌گذاری شدند. این خبر را جوزپه والیتارا، وزیر آموزش ایتالیا، اعلام کرد و آن را احتمالاً یک «حمله سایبری، نه یک خطر واقعی» توصیف کرد. آقای والیتارا به تلویزیون ایتالیا گفت که پشت تهدیدهای گسترده در ایتالیا و سایر نقاط اروپا که پروازها، سوپرمارکت‌ها و حتی بیمارستان‌ها را هدف قرار دادند، یک راهبرد مشخص وجود دارد. ایمیل‌ تهدید به بمب‌گذاری به مدارس شهرهای رم، ناپل، ویچنزا، فلورانس، پیزا، تریسته و بسیاری دیگر از شهرهای ایتالیا ارسال شده‌ و به‌عنوان یک اقدام احتیاطی، ساختمان‌ مدارس تخیله شدند. جورجا ملونی، نخست‌وزیر ایتالیا، جلسه‌ای با حضور وزیران ارشد و رؤسای دستگاه‌های اطلاعاتی تشکیل داده است. خانم ملونی گفت که دولت گزارش‌های متعدد «تهدید به بمب‌گذاری در مؤسسات آموزشی» را از نزدیک زیر نظر دارد، هرچند بررسی‌ها تاکنون هیچ مدرکی دال بر «خطر ملموس» نشان نداده‌اند. او در فیسبوک نوشت: «به نظر می‌رسد این گزارش‌ها بیشتر با راهبرد ایجاد اضطرار و نگرانی مرتبط باشند.» هفته گذشته، فرودگاه‌های ایتالیا و همچنین شرکت‌های هواپیمایی در سایر نقاط اروپا مجموعه‌ای از تهدیدهای دروغین بمب‌گذاری دریافت کردند که موجب موج نگرانی‌، تخلیه اماکن و اختلالات گسترده شد. اگرچه یک گروه افراطی زن‌ستیز مسئولیت تعدادی از این تهدیدها را بر عهده گرفت اما بعداً هرگونه ارتباط خود را با این هشدارهای کاذب انکار کرد. بر اساس گزارش رسانه‌های ایتالیایی، ۲۸۰ مدیر مدرسه در روزهای اخیر تهدیدهایی دریافت کرده‌اند. بر اساس گزارش‌های منتشرشده از چندین منطقه، اگرچه روز چهارشنبه در ابتدا بسیاری از مدارس تخلیه شدند، وضعیت اضطراری به‌سرعت برداشته و به دانش‌آموزان اجازه داده شد به کلاس‌های درس برگردند. استفانیا پرویِتی، رئیس منطقه اومبریا در مرکز ایتالیا، در بیانیه‌ای گفت: «در بازرسی مدارس اومبریا چیزی یافت نشده و نیروهای انتظامی با سرعت و دقت در حال بررسی و راستی‌آزمایی تک‌تک گزارش‌ها هستند.»", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/82a9/live/dba5a0f0-ddda-11f1-b865-d17d8611efca.jpg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۰ آبان • ۱۷:۵۵" مبر 2026، ساعت 2:00 بعد از ظهر UTC Link اشتراک‌گذاری تصویر هدیه: Adobe Jess news، صنعت و تجارت اینترنتی خلاقانه بنویسید. جس کار خود را در TechRadar با پوشش اخبار و بررسی های سخت افزاری آغاز کرد. برخی از تاثیرگذارترین فناوری‌هایی که Adobe در کنفرانس سالانه Max خود هر سال به نمایش می‌گذارد، ویژگی‌های آزمایشی است که در حال توسعه است، و جدیدترین آنها امروز معرفی می‌شوند: آنها می‌توانند تصاویر را به صحنه‌های سه بعدی قابل کاوش تبدیل کنند، کاراکترهای هوش مصنوعی را با صحبت کردن با آنها طراحی کنند، و ویرایش عکس را به فرآیند کپی/پیست تبدیل کنند. سپس می‌توانید با صحبت کردن با شخصیت به گونه‌ای که در FaceTime صحبت", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Adobe-Project-Screen-Test.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۲۰ آبان • ۱۷:۳۰"}, {"source": "TechCrunch Main", "title": "Databricks’ new AI agent tells CEO Ali Ghodsi the unvarnished truth", "link": "https://techcrunch.com/2026/11/11/databricks-new-ai-agent-tells-ceo-ali-ghodsi-the-unvarnished-truth/", "summary": "At 12,000 employees, AI Ghodsi is the first to admit that he can't know everyone and that they are unlikely to confess the things that go wrong to him. But he doesn't need them to. He uses Databricks' newly revised Genie agent for that.", "date_str": "2026-11-11T15:00:00+00:00", "hash": "e9a421e404cb7c13", "title_fa": "عامل هوش مصنوعی جدید دیتابریکس به مدیرعامل علی قدسی حقیقت ناپاک را می گوید", "summary_fa": "با 12000 کارمند، AI قدسی اولین کسی است که اعتراف می کند که نمی تواند همه را بشناسد و بعید است آنها به چیزهایی که برای او اشتباه می کند اعتراف کنند. اما او به آنها نیاز ندارد. او برای این کار از نماینده Genie تازه اصلاح شده Databricks استفاده می کند. دیتابریکس روز چهارشنبه از نسخه به روز شده ای از عامل هوش مصنوعی Genie خود رونمایی کرد که اکنون می تواند کارهای چند مرحله ای را انجام دهد که پایان کار طولانی مدت را می طلبد. این کار را از طریق هستی شناسی که Databricks ساخته است انجام می دهد تا به Genie زمینه مورد نیاز خود را از اطلاعاتی که مشتریان در پلت فرم Databricks ذخیره می کنند، بدهد. این شرکت می‌گوید رهبران شرکت‌ها اکنون می‌توانند طیف وسیعی از وظایف را به نماینده محول کنند و آنها را بدون نظارت کامل می‌کند. برای اثبات این موضوع، علی قدسی، مدیرعامل Databricks به من نشان داد که چگونه از آن در داخل استفاده می کند. او به جای نمایش محصول، نماینده واقعی خود را اخراج کرد و من را در آخرین چت ها و نمودارهایش راهنمایی کرد. او به من نشان داد که چگونه بخش‌هایی از یک نظرسنجی رضایت کارکنان را تجزیه و تحلیل می‌کند که در آن شرکت امتیاز خوبی کسب نمی‌کند، و چگونه به او کمک می‌کند تا اصلاحات آن نمره‌های پایینی را که برخی از مدیران پیشنهاد کرده‌اند ارزیابی کند (و رد کند). او به من نشان داد که چگونه یک فروش بزرگ را به یک مشتری بالقوه خلاصه می کند که ضعیف عمل می کند - از جمله ویژگی هایی که مشتری قبل از خرید می گوید به آن نیاز دارد. همچنین او را برای یک مصاحبه پادکست با مرور حضورهای قبلی خود و ایجاد سؤالات احتمالی آماده کرد. در حین صحبت کردن، او حتی", "image_url": "https://techcrunch.com/wp-content/uploads/2021/04/Ali_Ghodsi.jpg?resize=1200,1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۲۰ آبان • ۱۸:۳۰"}, {"source": "VentureBeat Tech", "title": "TrustedRouter launches three new encrypted 'fusion' models that combine multiple LLMs, including one exclusively with U.S. model providers", "link": "https://venturebeat.com/technology/trustedrouter-launches-three-new-encrypted-fusion-models-that-combine-multiple-llms-including-one-exclusively-with-u-s-model-providers", "summary": "Choosing an AI model for your company is hard enough. Choosing which one to use for every job is harder. Should you send a tricky code review to Anthropic’s Claude Fable 5.2, try an open-weight model such as Meituan’s LongCat-2.5, or use something else? The answer can change from one task to the next, even inside the same application. Read more", "date_str": "2026-11-11T14:39:03+00:00", "hash": "5db16d3ea1677c79", "title_fa": "TrustedRouter سه مدل جدید رمزگذاری شده «فیوژن» را راه اندازی می کند که چندین LLM را ترکیب می کند، از جمله یکی منحصراً با ارائه دهندگان مدل ایالات متحده", "summary_fa": "انتخاب یک مدل هوش مصنوعی برای شرکت شما به اندازه کافی سخت است. انتخاب اینکه کدام یک برای هر کاری استفاده شود سخت تر است. آیا باید یک بررسی کد پیچیده به Anthropic's Claude Fable 5.2 ارسال کنید، یک مدل وزن باز مانند Meituan's LongCat-2.5 را امتحان کنید یا از چیز دیگری استفاده کنید؟ پاسخ می تواند از یک کار به کار دیگر تغییر کند، حتی در داخل همان برنامه. ادامه مطلب", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic"], "datetime_fa": "۲۰ آبان • ۱۸:۰۹"}, {"source": "Ars Technica", "title": "Google DeepMind just mathematically verified key parts of Signal", "link": "https://arstechnica.com/ai/2026/11/signals-encryption-just-passed-an-ai-powered-mathematical-checkup/", "summary": "Google DeepMind researchers used agentic AI to mathematically prove, or “formally verify,” a number of the Signal protocol’s key cryptographic guarantees—a landmark development for the widely used cryptography and AI itself. Conducted as a sort of proof-of-concept project in just four weeks, the work is significant in two ways. It serves as further independent validation of the cryptography that protects massive quantities of the world's communications on platforms like the Signal app , Google Messages, and WhatsApp. And it demonstrates Google DeepMind's formal verification capabilities using a new AI framework called AlphaProof Code. More broadly, AI-aided formal verification is having a moment, but it is unclear how practical it will be for widespread use and how effective it can be at securing large amounts of code. Proponents of formal verification have long referred to it as a sort of holy grail in software security, because it uses math to check and validate that software is functioning as intended—in other words, that it doesn't have critical vulnerabilities. Read full article Comments", "date_str": "2026-11-11T14:08:57+00:00", "hash": "345389d7aa341d93", "title_fa": "Google DeepMind فقط بخش‌های کلیدی سیگنال را از نظر ریاضی تأیید کرد", "summary_fa": "محققان Google DeepMind از هوش مصنوعی عاملی برای اثبات ریاضی یا «تأیید رسمی» تعدادی از ضمانت‌های رمزنگاری کلیدی پروتکل سیگنال استفاده کردند - یک پیشرفت برجسته برای رمزنگاری پرکاربرد و خود هوش مصنوعی. این کار که به عنوان نوعی پروژه اثبات مفهوم تنها در چهار هفته انجام شد، از دو جنبه قابل توجه است. این به عنوان اعتبار سنجی مستقل بیشتر رمزنگاری عمل می کند که از مقادیر عظیمی از ارتباطات جهان در سیستم عامل هایی مانند برنامه سیگنال، پیام های گوگل و واتس اپ محافظت می کند. و قابلیت‌های تأیید رسمی Google DeepMind را با استفاده از یک چارچوب هوش مصنوعی جدید به نام AlphaProof Code نشان می‌دهد. به طور گسترده تر، تأیید رسمی با کمک هوش مصنوعی زمان زیادی دارد، اما مشخص نیست که چقدر برای استفاده گسترده عملی خواهد بود و چقدر می تواند در ایمن سازی مقادیر زیادی کد مؤثر باشد. طرفداران راستی‌آزمایی رسمی مدت‌هاست که از آن به عنوان نوعی جام مقدس در امنیت نرم‌افزار یاد می‌کنند، زیرا از ریاضیات برای بررسی و اعتبارسنجی اینکه نرم‌افزار همانطور که در نظر گرفته شده است، استفاده می‌کند – به عبارت دیگر، آسیب‌پذیری‌های حیاتی ندارد. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش Google DeepMind محققان از هوش مصنوعی عاملی برای اثبات ریاضی یا «تأیید رسمی» تعدادی از ضمانت‌های رمزنگاری کلیدی پروتکل سیگنال خود استفاده کردند - یک توسعه رمزنگاری AI به طور گسترده مورد استفاده برای رمزنگاری. قبل از عصر هوش مصنوعی، توصیف ویژگی‌های نرم‌افزاری که می‌خواستند ثابت کنند، تبدیل این خلاصه‌ها به فرمول‌ها و سپس توسعه اثبات، برای مردم بسیار زمان‌بر بود. هوش مصنوعی عاملی می تواند زمان پروژه دوم را به میزان قابل توجهی کاهش دهد و تجزیه و تحلیل هایی مانند ارزیابی سیگنال DeepMind را", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "امنیت سایبری"], "datetime_fa": "۲۰ آبان • ۱۷:۳۸"}, {"source": "Engadget", "title توسعه‌ی آینده اکوسیستم ویندوز را مشخص می‌سازد. خلق والپیپرهای پیش‌فرض جدید اغلب حاکی از معرفی یک نسخه‌ی کاملا جدید مثل ویندوز ۱۲ یا یک بازنگری و نوسازی اساسی در نسل فعلی است. طبق بررسی‌های تخصصی، احتمال وقوع سناریوی دوم یعنی ارتقای بنیادین سیستم‌عامل فعلی به‌مراتب بیشتر از رونمایی زودهنگام ویندوز ۱۲ ارزیابی می‌شود. تصاویر جدید قرار است در نسخه‌های متفاوتی برای ویرایش‌های گوناگون مانند ویندوز ۱۱ پرو و مدل‌های تجاری سیستم‌عامل ارائه شوند. با وجود شباهت‌هایی به طرح Bloom، این تصاویر صرفا تغییر رنگ یا ویرایش جزئی نسخه‌های قبلی نیستند و ساختاری نوآورانه و مجزا دارند. برنامه‌های پیشین مایکروسافت برای انتشار نسخه‌ی جدید ویندوز در هر سه سال، پس از خروج پانوس پانای تغییر کرد. در حال حاضر نشانه‌ها حاکی از آماده‌سازی یک به‌روزرسانی بزرگ برای سال ۲۰۲۷ به‌جای مهاجرت به ویندوز ۱۲ است؛ اما احتمال درز زودهنگام فایل نهایی این تصاویر در فضای مجازی وجود دارد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/microsoft-surface-pro-9-desktop-63a9993e8318d4958b6224b5?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["Microsoft"], "datetime_fa": "۲۰ آبان • ۱۷:۲۹"}, {"source": "Business Insider", "title": "I tried the famous 'PieCaken,' a 6-pound cake stuffed with 3 different pies. It was a huge hit at Friendsgiving.", "link": "https://www.businessinsider.com/piecaken-review-famous-thanksgiving-cake-2026-11", "summary": "The PieCaken is a six-pound cake with four different desserts stuffed inside, including three pies. Courtesy of PieCaken The PieCaken features pecan pie, pumpkin pie, spice cake, and apple pie filling all in one dessert. I tried it for the first time and couldn't believe how delicious every layer tasted. The PieCaken also wowed everyone at my Friendsgiving. I couldn't believe my eyes when I first saw a photo of the PieCaken. Kelly Ripa once said that the six-pound cake — which has four desserts stuffed inside — was the \"greatest thing that happened to me, besides the birth of my children.\" There's a pecan pie on the bottom, followed by a pumpkin pie layer, and then spice cake on top. If that's not enough, there's apple pie filling in the center, and everything is held together by cinnamon buttercream. It sounded like the perfect wacky dessert to bring to Friendsgiving . The PieCaken was invented by the pastry chef Zac Young. Cindy Ord/Stringer/Getty Images Young first came up with the idea in 2015 while working as the executive pastry chef at David Burke Fabrick in New York City. The restaurant's executive chef was serving a Turducken special (a chicken stuffed into a duck stuffed into a turkey), and Young decided he wanted to make a sweet version. He was just planning to make a dessert to serve by the slice. But when Young posted a photo on Instagram, the PieCaken immediately took off. The Thanksgiving dessert can be purchased on Goldbelly for $110 and ships across the US. Also currently available are a red velvet PieCaken and a $160 DecaCaken featuring 10 layers, including chocolate cream pie, coffee cake, and New York cheesecake. My PieCaken was delivered frozen two days after I placed my order. Anneta Konstantinides/Business Insider The PieCaken was shipped with dry ice. Per the instructions, I stuck it in the fridge the night before I planned to serve it and let it sit out on the counter for two hours before digging in. Unlike many desserts, the PieCaken can actually be stored in the freezer for up to three months if it's tightly wrapped in its original packaging. It also lasts in the fridge for up to seven days. At first glance, the PieCaken looked very impressive. Anneta Konstantinides/Business Insider The 5-inch cake is covered in an oat crumble, and the colors pair well with the pale-pink cinnamon buttercream. When I brought the PieCaken to a Friendsgiving dinner, its appearance wowed everyone at the table. The apple pie filling on top also looked", "date_str": "2026-11-11T14:28:03+00:00", "hash": "c9f891d6723b8225", "title_fa": "من کیک معروف \"PieCaken\" را امتحان کردم، یک کیک 6 پوندی که با 3 پای مختلف پر شده بود. موفقیت بزرگی در Friendsgiving بود.", "summary_fa": "PieCaken یک کیک شش پوندی با چهار دسر مختلف، از جمله سه پای است. با حسن نیت از PieCaken PieCaken دارای پای اسپند، پای کدو تنبل، کیک ادویه و پای سیب است که همه در یک دسر پر می شوند. من برای اولین بار آن را امتحان کردم و باورم نمی شد طعم هر لایه چقدر خوشمزه است. PieCaken همچنین همه را در Friendsgiving من شگفت زده کرد. وقتی برای اولین بار عکسی از PieCaken را دیدم، نمی توانستم چشمانم را باور کنم. کلی ریپا یک بار گفت که کیک شش پوندی - که داخل آن چهار دسر پر شده است - \"بزرگترین اتفاقی بود که برای من افتاد، به جز تولد فرزندانم.\" یک پای اسپند در پایین، به دنبال یک لایه پای کدو تنبل، و سپس کیک ادویه در بالا وجود دارد. اگر این کافی نیست، در مرکز پای سیب قرار دارد و همه چیز با کره دارچینی به هم چسبیده است. به نظر می‌رسید که دسر بی‌نقصی برای آوردن به Friendsgiving باشد. PieCaken توسط شیرینی پز Zac Young اختراع شد. سیندی اورد/استرینگر/گتی ایماژ یانگ برای اولین بار در سال 2015 در حالی که به عنوان سرآشپز اجرایی در دیوید برک فابریک در شهر نیویورک کار می کرد، این ایده را مطرح کرد. سرآشپز اجرایی رستوران در حال سرو غذای ویژه Turducken (مرغ پر شده در اردک پر شده در بوقلمون) بود و یانگ تصمیم گرفت که می خواهد یک نسخه شیرین درست کند. او فقط قصد داشت یک دسر درست کند تا آن را سرو کند. اما زمانی که یانگ عکسی را در اینستاگرام منتشر کرد، PieCaken بلافاصله بلند شد. دسر شکرگزاری را می توان در Goldbelly با قیمت 110 دلار خریداری کرد و در سراسر ایالات متحده ارسال کرد. همچنین در حال حاضر یک PieCaken قرمز مخملی و یک DecaCaken 160 دلاری با 10 لایه شامل پای", "image_url": "https://i.insider.com/6aebed8a308912814ed71171?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Apple"], "datetime_fa": "۲۰ آبان • ۱۷:۵۸"}, {"source": "Business Insider", "title": "I sold almost everything I owned before moving abroad. Now, I'm returning home with even less stuff than I packed.", "link": "https://www.businessinsider.com/sold-belongings-before-international-move-like-owning-less-2026-11", "summary": "I moved to Japan with just two bags worth of belongings. Alessa Hickman I got rid of almost everything I owned before moving to Japan , and I don't miss most of it. Having fewer belongings has made me aware of how little I need, and I've since gotten rid of more. Now, I'm preparing to return to Canada, but I plan to maintain a more minimalist lifestyle. Just about a year ago, I left my Ottawa apartment, sold most of my belongings, packed up the rest, and moved to Japan with a suitcase and carry-on. Since then, I've brought those same bags to short-term Airbnb rentals across Tokyo, Osaka, Kumamoto, and Saitama. After almost a year, I've stopped missing most of the things I left behind and started loving the flexibility that comes with having so much less. In fact, these days, I'm questioning why I ever needed so much in the first place. I wasn't exactly a minimalist back in Canada I sold most of my belongings before moving. Alessa Hickman I've always been a bit of a \"stuff\" person. I had an overflowing closet, shelves full of books, and shoes for basically every occasion, including some I wore only once or twice a year. My apartment was full of stuff, too: records, plants, kitchenware, and everything in between. My husband loves collectibles, and I always enjoyed picking up little things to make our space feel more like us. However, when we planned our yearlong move to Japan , we knew we would have to downsize. We wouldn't have an apartment to come back to, so we got rid of almost everything. Facebook Marketplace was my best friend for a few months as I sold our furniture, electronics, and beyond. I sold and donated a ton of my clothing to create a capsule wardrobe, which I'd later pare down even more to just four shirts, two skirts, a pair of pants, shorts, a dress, one pair of shoes, and a rain jacket — all organized into packing cubes. Then, we packed a f  say they've solved every one of my issues, the new device is significantly improved and much cheaper. The benefits of e-ink (and the tradeoffs) Most digital photo frames will remind you of an iPad with a decorative border around it. They're great for displaying hundreds of your photos with vibrant color, but not everyone loves the look, or the fact that these frames always need to be plugged in. An e-ink frame, on the other hand, uses a variant of the sort of low-power screen you'd find in a Kindle Colorsoft less bright, but more paperlike, and much closer to the look of a traditionally printed photo. The Aura Ink is a great choice if you want a digital frame that looks more like a \"real\" photo and doesn't need to be plugged in and doesn't light up like a tablet (though it does have a light, it's really to make up for the fact that color e-ink screens don't reflect light very well, and thus can make your pictures look way too dark without an additional boost). You'll still get all the benefits of an LCD frame like the Aura Aspen, including the ability to load photos from anywhere using the versatile Aura app (you can now even text them directly to the frame), but you'll only need to charge it once every few months. Now for the downsides: Where most digital frames allow you to flick between photos with a swipe, the Aura Ink is much more sluggish switching from one photo to another takes about 45 seconds. While an LCD can match the colors in your photo exactly, e-ink uses a \"dithering algorithm\" to blend tiny pixels together to create the illusion of different hues (\"millions\" of them, according to Aura). In practice, this means up close, your pictures will look rather grainy, and the colors won't be nearly as bright as what you see on your phone screen. The 10-inch Aura Ink offers some significant upgrades Credit: Joel Cunningham All of that said, the Aura Ink is a great product, provided you know what you're buying, and the new 10-inch m", "date_str": "2026-1 ی که من را عصبانی می‌کردند، واقعاً همان چیزی بود که من s-t را می‌دیدم، او در زوم برای من توضیح می‌دهد. ارجاعات من واقعاً راهی نبود. من می بینم که مردم من به این سمت حرکت می کنند. چرا ما اینقدر طول می کشیم تا آلبوم ها را منتشر کنیم؟ من می بینم که وست یک آلبوم را در سه روز منتشر می کند. من می دانم که او نمونه هایی را در s-t خود دریافت کرد. من روی آهنگ ها هستم بنابراین، این همان", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/stove-god-cooks-swizz-beatz-press-photo-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Diplo and Former Downtown Music CEO Andrew Bergman Launch Indie Publisher Bison Music", "link": "https://www.billboard.com/pro/diplo-andrew-bergman-bison-music/", "summary": "Diplo and Andrew Bergman , the former CEO of Downtown Music, are launching Bison Music, an independent music publisher focused on signing and developing songwriters early in their careers. Bergman will serve as the company s CEO, working alongside COO Tom Lee , CCO Juba Lee and general manager Jenny Ilibassi . The company s roster of songwriters includes Picard Bros., Leclair, Maesic, Nitti, Kaien Cruz, BomboCat, Akira Evans and Groupthink, a group whose credits span songs for artists including BTS, Dua Lipa, Bad Bunny and JENNIE. Related UMG s $775M Downtown Deal Secures EU Approval With Remedies Attached Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Agents Look Ahead as AI Keeps Advancing: We Have the Privilege of Being in a Human Industry Bison is positioning itself in contrast to a current publishing landscape that s has been dominated by catalog acquisition. Rather than buying existing intellectual property, the company says its focused on long-term artist development and making fresh, original music written by real people to connect with a global audience. “For me, there’s still nothing more exciting in music than discovering a great song from someone you’ve never heard of,” Bergman says in a press release. “That’s always been at the core of what makes music publishing a great business. And it’s what excited me about partnering with Diplo, one of the leading creative forces in the modern music business, and tmwrk, his management team and longtime business partners. We’re designed to identify and sign writers early, nurture them through the harsh realities of the music business and allow them to reap the benefits of their creative endeavors. Writers and the music publishers that serve them are at their best when they are in a collaborative mode, and we intend to operate that way internally and externally.” Diplo, who initially formed Bison before bringing Bergman on as a partner, framed the launch as a response to a moment of creative stagnation in the industry. “At a moment when it feels like music needs an injection of originality, our writers are in a position to shape where music goes next,” he says. “Andrew and I are creating a home for those writers, with a team that knows how to develop them and a company built to back them for the long term.” Bison is based in New York and Los Angeles. Additional signings will be announced in the coming months.", "date_str": "2026-11-11T15:00:00+00:00", "hash": "d4115e0138602ac2", "title_fa": "Diplo و مدیر عامل سابق Downtown Music اندرو برگمن ناشر Indie Bison Music را راه اندازی کردند.", "summary_fa": "دیپلو و اندرو برگمن، مدیر عامل سابق Downtown Music، در حال راه اندازی Bison Music، یک ناشر موسیقی مستقل هستند که بر روی امضای قرارداد و توسعه ترانه سرایان در ابتدای کار خود متمرکز است. برگمن به عنوان مدیر عامل شرکت، در کنار تام لی، مدیر ارشد اجرایی جوبا لی و مدیر کل جنی ایلیباسی کار خواهد کرد. فهرست ترانه سرایان این شرکت شامل Picard Bros، Leclair، Maesic، Nitti، Kaien Cruz، BomboCat، Akira Evans و Groupthink است، گروهی که آهنگ های آن برای هنرمندانی از جمله BTS، Dua Lipa، Bad Bunny و JENNIE است. معامله 775 میلیون دلاری مربوط به مرکز شهر UMG تاییدیه اتحادیه اروپا را با راه‌حل‌های ضمیمه آب و هوای سخت، بندهای شعاع و یافتن نسل بعدی سرفصل‌های جشنواره تضمین می‌کند: این یک مبارزه سال به سال برای زنده ماندن است. موقعیت خود را در مقابل چشم انداز فعلی انتشاراتی قرار می دهد که تحت سلطه اکتساب کاتالوگ است. این شرکت می‌گوید به‌جای خرید مالکیت معنوی موجود، بر توسعه بلندمدت هنرمندان و ساخت موسیقی تازه و اصیل نوشته شده توسط افراد واقعی برای ارتباط با مخاطبان جهانی تمرکز کرده است. برگمن در بیانیه‌ای مطبوعاتی می‌گوید: «برای من، هنوز هیچ چیز در موسیقی هیجان‌انگیزتر از کشف یک آهنگ عالی از کسی نیست که هرگز نامش را نشنیده‌اید». \"این همیشه هسته اصلی چیزی است که انتشار موسیقی را به یک تجارت عالی تبدیل می کند. و این همان چیزی است که من را از شراکت با Diplo، یکی از نیروهای خلاق پیشرو در تجارت موسیقی مدرن، و tmwrk، تیم مدیریت و شرکای تجاری قدیمی او هیجان زده کرد. ما طراحی شده ایم تا نویسندگان را زودتر شناسایی و امضا کنیم، آنها را از طریق واقعیت های خشن تجارت موسیقی پرورش دهیم و به آنها اجازه دهیم از مزایای تلاش های خلاقانه خود بهره ببرند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/BBB_Bison-2-Credit_-Anthony-Mongiello-1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "The Billion-Dollar Deal Between Primary Wave & Kobalt | Billboard On The Record", "link": "https://www.billboard.com/video/billion-dollar-deal-primary-wave-kobalt-on-the-record/", "summary": "The business of music is changing, and the stakes have never been higher. Following Primary Wave’s $1 billion acquisition of Kobalt, Primary Wave CEO/founder Larry Mestel and Kobalt CEO Laurent Hubert join Billboard On The Record host Kristin Robinson in an exclusive interview to break down the deal and what it means for the future of music publishing. They discuss how their new business arrangement will work, how many millions they’ve each spent on music catalogs this year and why it seems acquisitions and mergers have become the music industry norm in 2026. Love what you hear? Don’t forget to rate, review and subscribe so you never miss an episode of Billboard On The Record . Follow Billboard On The Record on Instagram , TikTok , Apple Podcasts , Spotify and YouTube @billbo a rd so you never miss an episode. Billboard On The Record is a podcast in partnership with SickBird Productions. Kristin Robinson: We re here to talk about the fact that Primary Wave has acquired Kobalt, and you re the CEO of Primary Wave, you re the CEO of Kobalt. Larry Mestel: We re one of the largest music companies in the world now, probably the largest owner of legendary music. It s Prince and Bob Marley and Stevie Nicks and Whitney Houston and James Brown. We provide a very unique service, which is, hey, you want a bio film, we can produce it. You want a documentary, we can produce it. You want a Broadway show, we can produce it. You want an immersive experience, we re creating eight right now. I think one of the most unique and interesting things that you guys have done is the Whitney Houston slot machines. Larry Mestel: Yeah. We re making more money for the estate of Whitney Houston than the entire estate was generating six and a half years ago when we bought into the estate. 150,000 songs being uploaded every day, how does that change the nature of what you guys do? Laurent Hubert: This is a topic that we talk about almost every day, and it s a challenge. The music industry in recent years has started to see a lot of these kind of acquisitions and mergers of major companies, and I m wondering why you think these acquisitions and this consolidation is happening now. Larry Mestel: Well, I think you re gonna see a lot more. Today we have an exclusive first press interview about one of the biggest acquisitions in music in 2026. Primary Wave has officially bought Kobalt, and the deal is reported to be well over a billion dollars. This is a big deal in the music publishing world o", "date_str": "2026-11-11T14:00:00+00:00", "hash": "41c26776ec4e37f1", "title_fa": "معامله میلیارد دلاری بین موج اولیه و کوبالت | بیلبورد در رکورد", "summary_fa": "تجارت موسیقی در حال تغییر است و مخاطرات هرگز بالاتر نبوده است. پس از خرید 1 میلیارد دلاری کوبالت توسط Primary Wave، لری مستل، مدیرعامل/موسس Primary Wave و لورن هوبرت، مدیرعامل Kobalt، مجری بیلبورد On The Record، کریستین رابینسون، در یک مصاحبه اختصاصی برای شکستن این قرارداد و معنای آن برای آینده انتشار موسیقی می‌پیوندند. آن‌ها درباره نحوه عملکرد جدید کسب‌وکارشان بحث می‌کنند، هر کدام چند میلیون دلار برای کاتالوگ‌های موسیقی در سال جاری خرج کرده‌اند و چرا به نظر می‌رسد خریدها و ادغام‌ها در سال 2026 به استاندارد صنعت موسیقی تبدیل شده‌اند. آنچه می‌شنوید را دوست دارید؟ فراموش نکنید که امتیاز دهید، مرور کنید و مشترک شوید تا هرگز قسمتی از Billboard On The Record را از دست ندهید. Billboard On The Record را در اینستاگرام، TikTok، پادکست های اپل، Spotify و YouTube @billbo a rd دنبال کنید تا هرگز قسمتی را از دست ندهید. Billboard On The Record یک پادکست با همکاری SickBird Productions است. کریستین رابینسون: ما اینجا هستیم تا در مورد این واقعیت صحبت کنیم که Primary Wave Kobalt را تصاحب کرده است، و شما مدیر عامل Primary Wave هستید، شما مدیر عامل Kobalt هستید. لری مستل: ما اکنون یکی از بزرگترین شرکت های موسیقی در جهان هستیم، احتمالاً بزرگترین صاحب موسیقی افسانه ای. این شاهزاده و باب مارلی و استیوی نیکس و ویتنی هیوستون و جیمز براون هستند. ما یک سرویس بسیار منحصر به فرد ارائه می دهیم، که هی، شما یک فیلم زیستی می خواهید، ما می توانیم آن را تولید کنیم. شما یک مستند می خواهید، ما می توانیم آن را تولید کنیم. شما یک نمایش برادوی می خواهید، ما می توانیم آن را تولید کنیم. شما می خواهید یک تجربه همه جانبه داشته باشید، ما در حال ایجاد هشت نفر هستیم. من فکر می کنم یکی از منحصر به فرد ترین و", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/On-The-Record-Thumbnails-Larry-and-Laurent-1800x1200-1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی"], "datetime_fa": "۲۰ آبان • ۱۷:۳۰"}, {"sou ertainment 360 فراتر از نمایش فیلم و تلویزیون سنتی است. این چند هفته پس از استخدام اصلی شرکای سابق محتوای Anonymous، تونی لیپ و دارا گوردون می‌گذرد. Entertainment 360 Partners گفت: «روش‌هایی که مخاطبان سرگرمی را کشف می‌کنند و با آن درگیر می‌شوند، و نیازهای شغل‌های استعدادسازی امروز نیز تغییر کرده است. \"مکس این تکامل را زود تشخیص داد و او و تیم استثنایی‌اش کسب‌وکار قابل توجهی ایجاد کردند که دقیقاً نشان دهنده همان استعدادهای اصیل و آینده‌نگری است که ما همیشه به دنبال کار با آن‌ها بوده‌ایم. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را خوشحال نگه دارید. نظرات درباره Deadline هالیوود نظارت می‌شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی را اشتباه نکنید و اشتباه نکنید.\"", "image_url": "https://deadline.com/wp-content/uploads/2026/11/split-image-1000-1.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۰ آبان • ۱۸:۲۲"}, {"source": "Deadline", "title": "‘Stupid Never Dies’ Producer Hiroyuki Kobayashi On Unique Development; Teases Potential Sequel", "link": "https://deadline.com/2026/11/stupid-never-dies-hiroyuki-kobayashi-interview-1237219225/", "summary": "In the world of Stupid Never Dies, humanity has already lost. A devastating war against a powerful monster lord eliminated 98% of the human population, leaving the remaining survivors to fend for themselves or become zombies in the process. Among them, at the bottom of the social hierarchy, is Davy (Paul Castro Jr.), a timid, [ ]", "date_str": "2026-11-11T14:15:00+00:00", "hash": "9b7d7f694ee3a27e", "title_fa": "هیرویوکی کوبایاشی تهیه‌کننده «احمق هرگز نمی‌میرد» درباره توسعه منحصر به فرد؛ تمسخر دنباله بالقوه", "summary_fa": "در دنیای احمق هرگز نمی میرد، بشریت از قبل شکست خورده است. یک جنگ ویرانگر علیه یک ارباب هیولا قدرتمند، 98٪ از جمعیت انسانی را از بین برد، و بقیه بازماندگان را به حال خود رها کرد یا در این فرآیند به زامبی تبدیل شدند. در میان آنها، در پایین سلسله مراتب اجتماعی، دیوی (پل کاسترو جونیور) ترسو قرار دارد، [ ] RPG اکشن بی نظیر اولین عنوان از GPTRACK50 است، استودی ate": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
