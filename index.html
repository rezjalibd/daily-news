inarians , our pet food reporter, Janelle Leeson, identified the best cat food, including the best affordable cat food . One thing she discovered is that many budget-friendly formulas use ingredients such as meat meals and byproducts, which can significantly lower costs. That doesn't mean they are inferior options, though: Veterinary nutritionists say these ingredients are highly nutritious. You can also save on cat food by subscribing to automatic deliveries. When you sign up for autoship at Chewy , you save 35% on your first order and 5% on future shipments. Dry", "date_str": "2026-10-31T13:35:01+00:00", "hash": "b71d4f32cc4821fb", "title_fa": "بهترین لوازم ضروری گربه مقرون به صرفه که توسط خبرنگاران ما و گربه های آنها آزمایش شده است", "summary_fa": "", "image_url": "https://i.insider.com/6ae547708bd5d6547af3455b?width=1200&format=jpeg", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۹ آبان • ۱۷:۰۵"}, {"source": "Business Insider", "title": "US forces in Europe are bracing for 'Ukraine's worst day.' AI could help them fight an overwhelming flood of missiles and drones.", "link": "https://www.businessinsider.com/ai-could-assist-targeting-for-us-forces-facing-drone-missiles-2026-10", "summary": "US officials believe future battlefields could produce large amounts of data from sensors and networks, overwhelming human operators. Master Sgt. John Healy/Multi-Domain Command - Europe US forces in Europe could face thousands of targets and incoming threats in a future conflict. Officials say AI could help troops analyze targets faster than humans can alone. AI could recommend responses while leaving final decisions to soldiers. US Army soldiers in Europe are readying for large-scale combat and the kind of overwhelming missile and drone attacks Ukraine is facing, where the massive number of threats can make it difficult for humans to keep up, and are looking to software for solutions. Concern that the speed and scale of future warfare could be too great for humans to handle without help is growing; however, Army officials have said artificial intelligence can help soldiers process large amounts of data from sensors and networks to deliver potential responses in a fight. At the Association of the United States Army convention in Washington, DC, last month, service leaders and soldiers spoke about using AI to process battlefield data and help troops make decisions without removing humans from the process. \"I think it's important to use super intelligence… for things that humans aren't necessarily good at, and that's speed and scale,\" Brig. Gen. Steven Carpenter, head of Multi-Domain Command Europe, told Business Insider, \"but I also know we shouldn't take humans completely out of the loop.\" Earlier this year, Carpenter told reporters that US forces in Europe needed to be prepared to process more than 1,500 potential targets a day while also defending against as many as 1,200 incoming missiles and drones. That volume of targets and threats could overwhelm human analysts, but AI could help them keep up. In a conflict, soldiers could use AI to analyze battlefield data and targets based on a commander's objectives and other parameters. The system could then assess available military capabilities and recommend responses, from conventional weapons strikes to electronic warfare or cyber operations. The entire process is intended to move quickly, but officials say speed isn't the only benefit. AI can also remember or recognize patterns that humans might forget or not even notice in the first place. And all of that information provides commanders with options. AI and autonomy are quickly being integrated across uncrewed systems, command and control processes, and o", "date_str": "2026-10-31T13:27:01+00:00", "hash": "9ee9ac4d630b07fb", "title_fa": "نیروهای ایالات متحده در اروپا برای \"بدترین روز اوکراین\" آماده می شوند. هوش مصنوعی می تواند به آنها کمک کند تا با سیل عظیم موشک ها و پهپادها مبارزه کنند.", "summary_fa": "مقامات آمریکایی بر این باورند که میدان‌های نبرد آینده می‌توانند مقادیر زیادی داده از حسگرها و شبکه‌ها تولید کنند و اپراتورهای انسانی را تحت تأثیر قرار دهند. استاد گروهبان جان هیلی/ فرماندهی چند دامنه - اروپا نیروهای ایالات متحده در اروپا ممکن است در درگیری آینده با هزاران هدف و تهدید روبرو شوند. مقامات می گویند هوش مصنوعی می تواند به سربازان کمک کند تا اهداف را سریعتر از انسان به تنهایی تجزیه و تحلیل کنند. هوش مصنوعی می‌تواند پاسخ‌ها را توصیه کند در حالی که تصمیم‌گیری نهایی را به سربازان واگذار می‌کند. سربازان ارتش ایالات متحده در اروپا برای نبرد در مقیاس بزرگ و نوع حملات موشکی و پهپادی که اوکراین با آن مواجه است، آماده می شوند، جایی که تعداد انبوه تهدیدها می تواند کار را برای انسان دشوار کند، و به دنبال نرم افزار برای راه حل هستند. نگرانی از این که سرعت و مقیاس جنگ آینده می تواند برای انسان ها بسیار بزرگ باشد که نمی توانند بدون کمک از عهده آن برآیند، در حال افزایش است. با این حال، مقامات ارتش گفته‌اند که هوش مصنوعی می‌تواند به سربازان کمک کند تا مقادیر زیادی از داده‌ها را از حسگرها و شبکه‌ها پردازش کنند تا پاسخ‌های بالقوه را در جنگ ارائه دهند. در کنوانسیون انجمن ارتش ایالات متحده در واشنگتن دی سی، ماه گذشته، رهبران خدمات و سربازان در مورد استفاده از هوش مصنوعی برای پردازش داده های میدان نبرد و کمک به نیروها در تصمیم گیری بدون حذف انسان از روند صحبت کردند. بریگ: «فکر می‌کنم استفاده از هوش فوق‌العاده مهم است... برای چیزهایی که انسان‌ها لزوماً در آن مهارت ندارند، و آن سرعت و مقیاس است.» ژنرال استیون کارپنتر، رئیس فرماندهی چند دامنه اروپا، به Business Insider گفت: «اما من همچنین می‌دانم که نباید انسان‌ها را به طور کامل از این حلقه خارج کنیم.» در", "image_url": "https://i.insider.com/6ae371fe9bdea7d1607d2c0e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۹ آبان • ۱۶:۵۷"}, {"source": "Business Insider", "title": "Managing 64 vacation rentals taught me one thing: I don't belong in hospitality", "link": "https://www.businessinsider.com/property-manager-vacation-rentals-hospitality-burnout-2026-10", "summary": "Paul Burke built a 64-home rental portfolio from scratch in Colorado, and sold it in two years. Courtesy of Paul Burke Paul Burke used his business and tech background to build a vacation rental portfolio in Colorado. Burke exited after two years, saying that the hospitality industry took a toll on him. Burke later founded a company for vacation rental operators, drawing on the experience he gained. This as-told-to essay is based on a conversation with Paul Burke, 42, the CEO and cofounder of Vantory, an AI startup that streamlines vacation rental operations for property managers. He previously built a 64-home rental portfolio in Colorado and sold it in 2026 after two years. The following has been edited for length and clarity. If you'd asked me two years ago if I'd ever be running a property management company, I probably would've told you you're crazy. One of my sisters lives in Winter Park, Colorado . She's a real estate agent, and I was visiting her and met her boss, who owns the brokerage. He invited me into his office that weekend, and he gave me this whole pitch on Winter Park and how billions of dollars are being invested in it, and there's all this opportunity. I thought he was trying to sell me a house, and he was like, \"We've got this brokerage, but we've wanted a property management company for five years, but we haven't found the right partner to build it with. We think you're that guy.\" Those opportunities don't just fall into your lap. I'd sold my previous tech company and was trying to figure out what was next, so I jumped at it. A jacuzzi at one of Burke s properties. Courtesy of Paul Burke Winter Park is not like Aspen. It was known for a very long time as the economical ski resort. People who were getting priced out or sick of the insane prices of the Vails and the Aspens were starting to come to Winter Park. You could get the same thing or something nicer for a third of the price. But it was not very easy to convince people to move from existing property management companies to some brand new one with a guy who had no experience. So I had to take them all for lunch, look them in the eye, shake their hands, and say, \"I will do everything it takes to take care of your property, the best it can possibly be taken care of, and have it generate as much money as possible.\" We got a handful of clients, and then once we had a handful, it was really just about execution. It's always been my approach to business: get a small handful of customers, ", "date_str": "2026-10-31T13:20:01+00:00", "hash": "a562ca79a4bd0bfa", "title_fa": "مدیریت 64 کرایه تعطیلات یک چیز به من آموخت: من به مهمان نوازی تعلق ندارم", "summary_fa": "پل برک یک نمونه کار 64 خانه اجاره ای از ابتدا در کلرادو ساخت و آن را در دو سال فروخت. با حسن نیت از پل برک پل برک از پیشینه کسب و کار و فناوری خود برای ساختن نمونه کارها برای اجاره تعطیلات در کلرادو استفاده کرد. بورک پس از دو سال از آن خارج شد و گفت که صنعت مهمان‌نوازی به او آسیب وارد کرده است. برک بعداً شرکتی را برای اپراتورهای اجاره تعطیلات تأسیس کرد و از تجربیاتی که به دست آورد استفاده کرد. این مقاله همانطور که گفته شد بر اساس گفتگو با پل برک، 42 ساله، مدیر عامل و بنیانگذار Vantory، یک استارت آپ هوش مصنوعی است که عملیات اجاره تعطیلات را برای مدیران املاک ساده می کند. او قبلاً یک نمونه کار 64 خانه اجاره ای در کلرادو ساخته بود و پس از دو سال در سال 2026 آن را فروخت. موارد زیر برای طول و وضوح ویرایش شده است. اگر دو سال پیش از من می پرسیدید که آیا هرگز یک شرکت مدیریت املاک را اداره می کنم، احتمالاً به شما می گفتم که دیوانه هستید. یکی از خواهران من در وینتر پارک، کلرادو زندگی می کند. او یک مشاور املاک و مستغلات است و من داشتم به او می‌رفتم و با رئیسش که صاحب کارگزاری است ملاقات کردم. او من را در آخر هفته به دفترش دعوت کرد و تمام این زمین پارک زمستانی را به من داد و اینکه چگونه میلیاردها دلار روی آن سرمایه گذاری می شود، و این همه فرصت وجود دارد. فکر می‌کردم می‌خواهد خانه‌ای به من بفروشد، و او می‌گوید: \"ما این کارگزاری را داریم، اما پنج سال است که یک شرکت مدیریت املاک می‌خواهیم، ​​اما شریک مناسبی برای ساختن آن پیدا نکرده‌ایم. ما فکر می‌کنیم شما آن مرد هستید.\" این فرصت‌ها فقط در دامان شما نمی‌افتند.", "image_url": "https://i.insider.com/6ae22fb6e793e12971426502?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۹ آبان • ۱۶:۵۰"}],
      media: [{"source": "Netflix NL", "title": "Complete chaos in nieuwe Duitse film op Netflix", "link": "https://www.netflix-nederland.nl/complete-chaos-in-nieuwe-duitse-film-op-netflix/", "summary": "Soms komt een release op Netflix vrijwel uit het niets, en dat is óók het geval met betrekking tot Das Geschenk (of The Birthday Gift), afkomstig uit Duitsland en nu te bekijken op de streamingdienst. Das Geschenk Das Geschenk, een komedie om precies te zijn, draait om Marlene Frischmann (Jeanne Goursaud), een alleenstaande moeder die alles tot in de puntjes wil regelen. Voor de verjaardag van haar zoontje Theo (Levin Wopp) organiseert ze een uitgebreid feest in de luxueuze villa van haar broer. Ze wil dat haar zoon een onvergetelijke dag beleeft en heeft daarom werkelijk aan alles gedacht. De voorbereidingen zijn indrukwekkend. Er zijn kleurrijke ballonnen, een glutenvrije verjaardagstaart, een piñata en zelfs bijzondere dieren om de kinderen te vermaken, écht van alles en nog wat. Marlene heeft bovendien duidelijke ideeën over de opvoeding van haar zoon en probeert ervoor te zorgen dat het feest precies volgens haar regels verloopt. Haar plannen worden echter verstoord door haar broer Timo (Edin Hasanović), een succesvolle maar nogal luidruchtige bankier. Hij heeft een compleet andere kijk op opvoeding en vindt dat zijn zus zich veel te druk maakt over allerlei regels en principes. De situatie loopt uit de hand wanneer Timo zijn neefje een bijzonder verjaardagscadeau geeft: een speelgoedpistool dat opvallend veel op een echt vuurwapen lijkt. Marlene is daar absoluut niet blij mee. Het cadeau leidt tot een verhitte discussie over geweld, mannelijkheid en de vraag welk speelgoed geschikt is voor kinderen. Ook Hans (Heiner Lauterbach), de excentrieke vader van Marlene en Timo, draagt bij aan de onrust. Hij is vooral bezig met zijn eigen spirituele ontwikkeling en heeft weinig belangstelling voor de praktische problemen waarmee zijn familie worstelt. Daarnaast is Jenny (Amal Keller) aanwezig, een idealistische vriendin en collega van Marlene die uitgesproken ideeën heeft over maatschappelijke kwesties. Haar opvattingen botsen regelmatig met die van andere gasten, waardoor zelfs de kleinste onderwerpen aanleiding geven tot verhitte discussies. Terwijl de volwassenen steeds meer met elkaar in conflict raken, beginnen ook de kinderen zich steeds minder van de regels aan te trekken. Het zorgvuldig georganiseerde verjaardagsfeest verandert langzaam in een complete chaos. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Complete chaos in nieuwe Duitse film op Netflix appeared first on Netflix Nederland - Films en Ser", "date_str": "2026-11-01T10:11:33+00:00", "hash": "f5fe9f759232de1d", "title_fa": "هرج و مرج کامل در فیلم جدید آلمانی در نتفلیکس", "summary_fa": "گاهی اوقات یک نسخه در نتفلیکس تقریباً بیهوده است، و این در مورد Das Geschenk (یا هدیه تولد) نیز صادق است که از آلمان می آید و اکنون می توان آن را در سرویس استریم مشاهده کرد. Das Geschenk Das Geschenk، یک کمدی به طور دقیق، حول محور مارلن فریشمان (ژان گورسود)، مادر مجردی می چرخد ​​که می خواهد همه چیز را تا آخرین جزئیات مرتب کند. او برای تولد پسرش تئو (لوین ووپ) یک مهمانی گسترده در ویلای مجلل برادرش ترتیب می دهد. او می خواهد پسرش روزی فراموش نشدنی داشته باشد و به همین دلیل به همه چیز فکر کرده است. آماده سازی ها چشمگیر است. بادکنک های رنگارنگ، کیک تولد بدون گلوتن، پینیاتا و حتی حیوانات خاص برای سرگرمی کودکان وجود دارد، واقعاً همه چیز و همه چیز. مارلین همچنین ایده های روشنی در مورد بزرگ کردن پسرش دارد و سعی می کند اطمینان حاصل کند که مهمانی دقیقاً طبق قوانین او پیش می رود. با این حال، برنامه های او توسط برادرش تیمو (ادین حسنوویچ)، یک بانکدار موفق اما نسبتا پر سر و صدا، مختل می شود. او دیدگاهی کاملاً متفاوت در مورد فرزندپروری دارد و فکر می‌کند که خواهرش بیش از حد نگران انواع قوانین و اصول است. وقتی تیمو به برادرزاده‌اش هدیه تولد ویژه‌ای می‌دهد، وضعیت از کنترل خارج می‌شود: یک تفنگ اسباب‌بازی که به طرز قابل توجهی شبیه یک اسلحه گرم واقعی است. مارلین مطلقاً از این موضوع خوشحال نیست. این هدیه منجر به بحث داغ در مورد خشونت، مردانگی و این سوال می شود که کدام اسباب بازی برای کودکان مناسب است. هانس (هاینر لاوترباخ)، پدر عجیب و غریب مارلین و تیمو نیز در ناآرامی ها نقش دارد. او عمدتاً به رشد معنوی خود اهمیت می دهد و علاقه چندانی به مشکلات عملی که خانواده اش با آنها دست و پنجه نرم", "image_url": "https://www.netflix-nederland.nl/wp-content/uploads/2026/10/das-geschenk.jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۱۰ آبان • ۱۳:۴۱"}, {"source": "Rolling Stone", "title": "New York City Marathon Livestream: How to Watch the 2026 Race Online for Free", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/where-to-stream-new-york-city-marathon-online-free-2026-1235650494/", "summary": "Here’s how to get a free livestream of the 2026 NYC Marathon from anywhere in the country", "date_str": "2026-11-01T10:14:00+00:00", "hash": "4bfc97c312738e49", "title_fa": "پخش زنده ماراتن شهر نیویورک: نحوه تماشای مسابقه 2026 به صورت آنلاین به صورت رایگان", "summary_fa": "در اینجا نحوه دریافت پخش زنده رایگان ماراتن نیویورک 2026 از هر نقطه از کشور آمده است اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوند در وب سایت ما خریداری کنید، Rolling Stone ممکن است کمیسیون وابسته دریافت کند. ماراتن شهر نیویورک روز یکشنبه، اول نوامبر، پنجاهمین سالگرد خود را جشن می گیرد. انتظار می‌رود بیش از 60000 دونده در هر پنج منطقه نیویورک سفر کنند، از جمله افراد حرفه‌ای، آماتور و حتی افراد مشهوری مانند جنیفر کانلی، پاتینا میلر، دیلان افرون و تیکی باربر. اگر نمی‌توانید با دو میلیون تماشاگر دیگر در خیابان‌ها صف بکشید تا ماراتون نیویورک را شخصا تماشا کنند، نگران نباشید: کل مسابقه به صورت ملی پخش می‌شود و به دوستان، اعضای خانواده و طرفداران اجازه می‌دهد تا عزیزان و دوندگان حرفه‌ای را ببینند. برای راهنمایی سریع در مورد نحوه تماشای ماراتن نیویورک، از جمله راه‌هایی برای دریافت پخش زنده آنلاین رایگان ماراتن، ادامه مطلب را بخوانید. ماراتن 2206 نیویورک در روز یکشنبه، 1 نوامبر برگزار می‌شود. زمان‌های شروع پ ite.” The cold open was framed as a ride through a budget Halloween haunted attraction, with Grace Reiter and Jeremy Culhane as a couple on a date and Kenan Thompson as a Grim Reaper guide. Tom Hanks then appeared as David S. Pumpkins, the oddball character he introduced on the show in 2016, backed by his dancing skeleton sidekicks Mikey Day and former cast member Bobby Moynihan, in what the sketch itself called the character’s third outing. Before the bit could get going, Johnson’s Trump froze the scene and cut it short. “I’ll save you four minutes: he keeps popping up and confusing people on the ride. The end,” he told the audience, before comparing himself to Pumpkins: “We both appeared in 2016, we’re both very loud, very orange.” He went on to complain about Republican polling ahead of the midterms before Belo-Osagie’s Minaj made her entrance. Minaj has not publicly addressed the sketch. The rapper remains one of the most successful acts in Billboard chart history. In 2018, she became the first woman to log 100 entries on the Billboard Hot 100, and she holds the most Hot 100 top 10s among female rappers. In 2020, she and Doja Cat became the first female rap duo to top the Hot 100, with the remix of “Say ", "date_str": "2026-11-01T05:06:19+00:00", "hash": "64f26b5eb4828a12", "title_fa": "«SNL» نیکی میناژ را پس از حضور در گردهمایی ترامپ تقلید می‌کند", "summary_fa": "برنامه زنده شنبه شب شنبه (31 اکتبر) یک هفته پس از پیوستن این خواننده رپ به او در مبارزات انتخاباتی، به حمایت نیکی میناژ از رئیس جمهور دونالد ترامپ تبدیل شد. یکی از بازیگران، سعیده بلو-اوساگی، نقش میناژ را بازی کرد و زمانی که ترامپ جیمز آستین جانسون از وفاداری او به جنبش خود ستایش کرد، در نزدیکی پایان آن، وارد طرح شد. میناژ بلو-اوساگی اعلام کرد: «ترامپ در حال کشتن آن است، و منظورم از آن، حرفه‌ام است.» این طرح همچنین او را به عنوان گزینه بعدی ترامپ برای معاونت مطبوعاتی کاخ سفید معرفی کرد. این تقلید مستقیماً به حضور میناژ در راهپیمایی 25 اکتبر ترامپ در پورت هورون، میشیگان انجامید، جایی که او با او در ایر ": "Robert Downey Jr. & Pedro Pascal Serve MCU Role Reversal For Halloween: “Costume Swap!”", "link": "https://deadline.com/2026/10/robert-downey-jr-pedro-pascal-mcu-role-reversal-halloween-1237210827/", "summary": "With less than two months left on the Avengers: Doomsday clock, Robert Downey Jr. and Pedro Pascal swapped sides for Halloween. The pair traded off their MCU roles in a paired costume, with Downey dressing as Pascal s character Mr. Fantastic and Pascal as Downey s Dr. Doom, ahead of the movie s Dec. 18 premiere in theaters. [ ]", "date_str": "2026-11-01T05:35:33+00:00", "hash": "0a300461d0034ed4", "title_fa": "رابرت داونی جونیور و پدرو پاسکال برای جشن هالووین در MCU بازی می کنند: «تبادل لباس!»", "summary_fa": "در حالی که کمتر از دو ماه به پایان فیلم Avengers: Doomsday ساعت باقی مانده بود، رابرت داونی جونیور و پدرو پاسکال طرف های خود را با هالووین عوض کردند. این زوج نقش‌های خود را در MCU در یک لباس جفت جایگزین کردند و داونی در نقش شخصیت پاسکال آقای شگفت‌انگیز و پاسکال در نقش دکتر دووم داونی، قبل از اکران فیلم در 18 دسامبر در سینماها، لباس پوشیدند. [ ] ویکتور. ریچارد. تعویض لباس! داونی این ویدیو را در اینستاگرام شرح داد. پس از اتفاقات سال گذشته The Fantastic Four: First Steps، Avengers: Doomsday شاهد فروپاشی جهان چندگانه است و قهرمانان چندین زمین را مجبور می‌کند تا علیه دکتر دووم (داونی) متحد شوند. همچنین پاسکال در نقش آقای شگفت‌انگیز، ونسا کربی در نقش سو استورم، جوزف کوین در نقش Human Torch و ایبون ماس-باچراخ در نقش The Thing پس از اولین حضورشان در MCU در First Steps بازگشته‌اند. تماشا در Deadline علاوه بر این، بازیگران شامل کریس همسورث در نقش ثور، آنتونی مکی در نقش کاپیتان آمریکا، کریس ایوانز در نقش استیو راجرز، پل راد در نقش مرد مورچه ای، تنوک هوئرتا در نقش نامور، سیمو لیو در نقش شانگ چی، لتیتیا رایت در نقش پلنگ سیاه، کلسی گرامرز در نقش هیولا، دنی رام با نقش هیولا، دنی رام‌بک در نقش هیولا، دنی رام‌بک در نقش هیولا در نقش لوکی، پاتریک استوارت در نقش پروفسور ایکس، ایان مک‌کلن در نقش مگنیتو، آلن کامینگ در نقش نایت کرولر، ربکا رومین در نقش میستیک، جیمز مارسد t 2026 Halloween Costumes, From Paris Hilton as Britney Spears to Kim Kardashian as North West Valentín Elizalde s Legacy Gets a New HBO Max Docuseries More Uplifting Moments in Latin Music Harry Styles Revives His X Factor Audition Look for Isn t She Lovely at Harryween “​Singing Jolene tonight 4 U @dollyparton,” Lizzo captioned an Instagram video showing off the elaborate costume, which featured a skin-tight yellow jumpsuit adorned with floral designs and a platinum blonde wig. In the clip, Lizzo also lip-syncs to Parton’s 1967 song “Dumb Blonde,” mouthing the lyrics, “Just cause I m blonde, don t think I m dumb, cause this dumb blonde ain t nobody s fool.” SZA was among those impressed by the look, taking to the comments to share her reaction. How is everything u do perfect, the singer wrote alongside a face with tears emoji. In a second post , Lizzo shared several more photos of her Dolly-inspired costume, including one recreating an alternate “Jolene” single cover featuring a bright red background. Another snapshot shows the “Truth Hurts” singer holding a guitar in front of a framed gold certification plaque for Parton s 2023 album, Rockstar . The display also celebrates Lizzo s contribution to Rockstar , Parton s collection of covers and original songs. Lizzo appeared on the album s rendition of Led Zeppelin s “Stairway to Heaven,” playing the flute. In 2024 when the world turned its back on me Dolly Parton asked me to play flute on her album, Lizzo captioned the photo gallery. I, of course said hell yes and my only ask was that she credit Sasha Floot as well… she not only credited @sashabefluting we went on to get a plaque for that album. She continued, Dolly, you icon you, thank you for believing in the good of humanity, for seeing our light in the darkness and loving us anyways! From H-Town to Nashville— ! We will always love you. Lizzo also showed off her love of anime for another Halloween costume in 2026, dressing up as Seiko Ayase from the series Dandadan . The singer went all out with the look, sporting a tall white wig and an oversized faux bust.", "date_str": "2026-10-31T20:18:31+00:00", "hash": "1e9f38868cb43c29", "title_fa": "لیزو برای هالووین، جستجوی نمادین «جولین» دالی پارتون را بازسازی می‌کند", "summary_fa": "لیزو در این هالووین به دالی پارتون با ظاهری الهام گرفته از دوران نمادین «جولین» اسطوره فقید کشور ادای احترام کرد. این خواننده و خواننده رپ 38 ساله در میان چندین لباس هالووین امسال خود، پارتون را با الهام از آثار هنری تک آهنگ موفق خود در سال 1973 کانالیزه کرد. مرتبط بهترین لباس های هالووین 2026، از پاریس هیلتون در نقش بریتنی اسپیرز تا کیم کارداشیان در نقش شمال غربی میراث والنتین الیزالد یک HBO مکس جدید را دریافت می کند مستندهای مستند لحظات نشاط آور بیشتر در موسیقی لاتین. @dollyparton، لیزو یک ویدیوی اینستاگرامی را توضیح داد که لباس مفصلی را نشان می‌داد، که شامل یک کت و شلوار زرد تنگ با پوست بود که با طرح‌های گل‌دار و یک کلاه گیس بلوند پلاتینی تزئین شده بود. در این کلیپ، لیزو با آهنگ پارتون در سال 1967 به نام «بلوند خنگ» همگام‌سازی می‌کند و متن آن را به زبان می‌آورد: «فقط چون من بلوند هستم، فکر نکن من خنگ هستم، چرا که این بلوند خنگ هیچ‌کس احمق نیست». SZA از جمله کسانی بود که تحت تأثیر این ظاهر قرار گرفتند و برای به اشتراک گذاشتن واکنش خود به نظرات خود پرداختند. این خواننده در کنار شکلک‌هایی با چهره اشک‌آلود نوشت: هر کاری که انجام می‌دهید چگونه است. در پست دوم، لیزو چندین عکس دیگر از لباس الهام گرفته از دالی خود را به اشتراک گذاشت، از جمله عکسی که یک جلد تکی جایگزین «جولین» با پس‌زمینه قرمز روشن را بازسازی می‌کند. یک عکس فوری دیگر خواننده \"Truth Hurts\" را نشان می دهد که یک گیتار را در مقابل یک لوح گواهی طلایی قاب شده برای آلبوم پارتون، Rockstar در سال 2023 در دست گرفته است. این نمایش همچنین سهم لیزو را در Rockstar، مجموعه کاورها و آهنگ های اصلی پارتون جشن می گیرد. لیزو در اجرای آلبوم از", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/P1186J21-e1788298463443.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۹ آبان • ۲۳:۴۸"}, {"source": "Deadline", "titl       const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {

        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
