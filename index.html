د ممکن است بیش از 1.3 تریلیون دلار هزینه داشته باشد، اگرچه معاون رئیس جمهور جی دی ونس بعداً گفت که افراد ثروتمند مستثنی خواهند شد. جو لونزدیل، یکی از بنیانگذاران Palantir، از جمله منتقدان این تعهد بود و گفت این پرداخت شبیه به \"رشوه\" است. هنگامی که یک خبرنگار پنجشنبه شب از ترامپ در مورد پیشنهادی که در مورد آسفالت فرودگاه در دالاس ارائه شده بود، سوال کرد، به نظر می رسید که رئیس جمهور به شدت برخورد کند. این خبرنگار پس از اشاره به اینکه آمریکا 40 تریلیون دلار بدهی دارد، پرسید: اگر سیاست های اقتصادی شما جواب می دهد، چرا به انگیزه ای برای حضور مردم و رای دادن نیاز دارید؟ ترامپ در پاسخ گفت: من این کار را به خاطر شرکت در رای دادن انجام ندادم. من این کار را"}, {"source": "Business Insider", "title": "'AMERICA'S DARKEST DAY': Newspaper headlines from around the world after 9/11", "link": "https://www.businessinsider.com/september-11-newspaper-front-pages-headlines", "summary": "The New York Daily News front page on September 12, 2001. New York Daily News This year marks the 25th anniversary of the September 11, 2001, terrorist attacks. The day after, newspapers around the world captured people's sadness, shock, and horror. These international front pages show what people woke up to on September 12, 2001. It's been 25 years since the September 11, 2001, terrorist attacks. For many people, the attacks were the biggest news story of their lifetime. Almost all who experienced it can remember where they were when they heard what had happened. Many people who remember that day also recall the following morning, when newspapers around the world captured the horror, shock, and sadness people felt. The Newseum , once a museum in Washington, DC, that chronicled the history of media, archived more than 100 newspapers from September 12, 2001, the day after the attacks. The front pages of US newspapers, bearing headlines like \"ACT OF WAR\" and \"AMERICA'S DARKEST DAY,\" underscored the impact the attacks had on the American psyche. Other newspapers around the world also sought to convey the scale of the attacks. Some ran headlines such as \"War on America,\" while others let striking photographs speak for themselves. Here is what newspapers looked like on September 12, 2001. The New York Times New York Times Source: Newseum New York Post New York Post New York Daily News New York Daily News The Washington Post Washington Post USA Today USA Today The Atlanta Constitution Atlanta Constitution Los Angeles Times Los Angeles Times The Dallas Morning News War at home and The whole world s changed today read headlines on The Dallas Morning News on September 12, 2001. The Dallas Morning News The Arizona Republic The Arizona Republic also showed the second plane s approach, as well as an image of people fleeing the scene. The Arizona Republic Detroit Free Press Detroit Free Press Seattle Post-Intelligencer Seattle Post-Intelligencer Chicago Tribune Chicago Tribune The San Francisco Examiner San Francisco Examiner Newsday Newsday People People Canada s The Globe and Mail Globe and Mail Britain s The Daily Telegraph The Daily Telegraph The Times of London The Times Melbourne s Herald Sun Herald Sun France s Libération France s Libération showed an image of the smoke-filled skies, with no headline. Libération Read the original article on Business Insider", "date_str": "2026-09-11T10:20:02+00:00", "hash": "f183f2f10b1f1d43", "title_fa": "\"تاریک ترین روز آمریکا\": تیتر روزنامه های سراسر جهان پس از 11 سپتامبر", "summary_fa": "صفحه اول New York Daily News در 12 سپتامبر 2001. New York Daily News امسال بیست و پنجمین سالگرد حملات تروریستی 11 سپتامبر 2001 است. روز بعد، روزنامه های سراسر جهان غم، شوک و وحشت مردم را به تصویر کشیدند. این صفحات اول بین المللی نشان می دهد که مردم در 12 سپتامبر 2001 با چه چیزی بیدار شدند. 25 سال از حملات تروریستی 11 سپتامبر 2001 می گذرد. برای بسیاری از مردم، این حملات بزرگترین خبر زندگی آنها بود. تقریباً همه کسانی که آن را تجربه کرده‌اند، می‌توانند به یاد بیاورند که وقتی شنیدند چه اتفاقی افتاده کجا بودند. بسیاری از کسانی که آن روز را به یاد می آورند، صبح روز بعد را نیز به یاد می آورند، زمانی که روزنامه های سراسر جهان وحشت، شوک و اندوهی که مردم احساس می کردند را به تصویر می کشیدند. Newseum که زمانی موزه ای در واشنگتن دی سی بود که تاریخ رسانه ها را شرح می داد، بیش از 100 روزنامه را از 12 سپتامبر 2001، یک روز پس از حملات بایگانی کرد. صفحات اول روزنامه های ایالات متحده با عناوینی مانند \"ACT OF WAR\" و \"تاریک ترین روز آمریکا\" بر تأثیر این حملات بر روان آمریکایی تأکید کرد. روزنامه های دیگر در سرتاسر جهان نیز به دنبال افشای ابعاد این حملات بودند. برخی تیترهایی مانند \"جنگ علیه آمریکا\" منتشر کردند، در حالی که برخی دیگر اجازه دادند عکس های خیره کننده خودشان صحبت کنند. در اینجا روزنامه ها در 12 سپتامبر 2001 به نظر می رسیدند. نیویورک تایمز نیویورک تایمز منبع: Newseum New York Post New York Post New York Daily News New York Daily News واشنگتن پست واشنگتن پست USA Today USA Today قانون اساسی آتلانتا قانون اساسی لس آنجلس تایمز لس آنجلس تایمز The Dallas Morning News جنگ در خانه و کل جهان امروز تغییر کرده"}, {"source": "Business Insider", "title": "Trump’s latest affordability plan comes with a trillion-dollar catch", "link": "https://www.businessinsider.com/trump-5000-dividend-plan-affordability-debt-bond-yields-inflation-explained-2026-9", "summary": "Burak Kara/Getty Images Trump's $5,000 dividend is a big affordability swing with an even bigger fiscal catch. The bond market remains unimpressed by the lack of a long-term plan for tackling the national debt. Sign up for First Trade , Business Insider's daily markets newsletter. The midterm elections are less than two months away, and President Trump is kicking his affordability agenda into overdrive. His latest plan to give every adult American a $5,000 \"Trump dividend\" came with a big catch: people will only get it if Republicans retain control of Congress. It was an unusually explicit bargain proposal, even for Trump. In a way, the announcement was well-timed. Americans are hyper-aware of how much things cost right now. Iran-war inflation is being felt all across the economy, especially at the gas pump . But the proposal also turns a blind eye to the heavy government spending and ballooning deficits that have riled up bond investors in recent weeks. Treasury yields are at multiyear highs , and the 10-year is flirting with the psychologically critical 5% level. Fixed-income traders are bristling at the lack of attention being paid to the fiscal situation. Ultimately, what's being branded as affordability relief for households could make government-level affordability issues even worse. The bond-market stakes Let's do some quick back-of-the-envelope math. If 240 million adult citizens get $5,000 apiece, that comes out to $1.2 trillion. Add that to the US's already-record-high $40 trillion national debt. If government spending is actually a concern, the administration appears to be moving in the wrong direction. Even if a cash injection helps in the short term, higher borrowing costs will hurt everyday Americans in the long run, especially at a time when they're already sensitive to affordability. Interestingly enough, Treasury yields barely budged late Wednesday night when Trump first floated the dividend. The (lack of) reaction suggests bond traders see a low likelihood that the nationwide payouts will actually occur. A better example of the Trump administration's affordability conundrum is the recent Treasury-buyback plan installed by Scott Bessent . Despite it being designed to lower bond yields, it's had the exact opposite effect . Investors are hung up on what the Treasury didn't address. You guessed it, the federal deficit. The message being sent by investors is clear: They're interested in a long-term fiscal fix, not quick-hit affordability plans", "date_str": "2026-09-11T09:50:01+00:00", "hash": "8ef3532764a91cbf", "title_fa": "آخرین طرح ترامپ برای مقرون به صرفه بودن با یک تریلیون دلار شکار همراه است", "summary_fa": "بوراک کارا/ گتی ایماژ سود 5000 دلاری ترامپ یک نوسان بزرگ در مقرون به صرفه بودن است که از نظر مالی حتی بیشتر است. بازار اوراق قرضه تحت تأثیر نبود یک برنامه بلندمدت برای مقابله با بدهی ملی قرار ندارد. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. کمتر از دو ماه تا انتخابات میان دوره ای باقی مانده است و پرزیدنت ترامپ برنامه استطاعت استطاعت خود را بیش از حد پیش می برد. آخرین طرح او برای اعطای 5000 دلار \"سود سهام به ترامپ\" به هر آمریکایی بالغ با یک امتیاز بزرگ همراه بود: مردم تنها در صورتی به آن دست خواهند یافت که جمهوری خواهان کنترل کنگره را حفظ کنند. این یک پیشنهاد معامله غیرعادی صریح حتی برای ترامپ بود. به نوعی، اطلاعیه به موقع بود. آمریکایی ها نسبت به هزینه های موجود در حال حاضر بسیار آگاه هستند. تورم جنگ ایران در سرتاسر اقتصاد بویژه در پمپ بنزین احساس می شود. اما این پیشنهاد همچنین چشم خود را بر مخارج سنگین دولت و کسری بالونی که سرمایه گذاران اوراق قرضه را در هفته های اخیر عصبانی کرده است، می بندد. بازدهی خزانه داری در بالاترین حد چند ساله قرار دارد و 10 سال اخیر با سطح بحرانی 5 درصدی از نظر روانی در حال معاشقه است. معامله گران با درآمد ثابت از عدم توجه به وضعیت مالی بیدار هستند. در نهایت، آنچه به عنوان تسهیلات مقرون به صرفه برای خانوارها شناخته می شود، می تواند مسائل مربوط به استطاعت در سطح دولت را بدتر کند. سهام بازار اوراق قرضه بیایید کمی محاسبات سریع پشت پاکت انجام دهیم. اگر 240 میلیون شهروند بزرگسال هر کدام 5000 دلار دریافت کنند، به 1.2 تریلیون دلار می رسد. این را به بدهی ملی ایالات متحده که در حال حاضر رکورد زده است، 40 تریلیون دلار اضافه کنید. اگر"}, {"source": "Business Insider", "title": "4 tricks to ace a job interview, according to a deception and human behavior expert", "link": "https://www.businessinsider.com/human-behavior-expert-shares-job-interview-tricks-2026-9", "summary": "Pamela Meyer said that people should religiously ask themselves if what they re saying advances the conversation. Pamela Meyer Pamela Meyer is a fraud examiner and human behavior expert who wrote \"How to Read the Room.\" She shares interview power moves, like using the plural pronoun \"we,\" which emphasizes collaboration. Meyer also suggests speaking without filler words and using bold transitions to signal confidence. Acing an interview — like any corporate challenge — often comes down to how well you can read others. Pamela Meyer, the CEO of Calibrate, Inc., trains organizations in fraud detection, insider-threat mitigation, and security awareness. In her new book, \"How to Read the Room,\" she explores how social awareness shapes leadership, negotiations, and decision-making. Learning to read others isn't just a skill for leaders, says Meyer, a certified fraud examiner. It can help candidates make it to the next round of interviews. \"Reading the room is, it turns out, a foundational skill,\" Meyer told Business Insider, adding that it's \"entirely teachable.\" Meyer writes that while job seekers may worry about stumbling over an interview question or forgetting to mention a key accomplishment, interviewers often form personality judgments based largely on nonverbal cues, including eye contact and nodding, rather than what candidates actually say. Here are four interview power moves she recommends for standing out in the interview process: Use the term \"we\" Meyer said in her book that using plural pronouns, like \"we\" instead of \"I,\" makes a person seem more collaborative and can make you seem friendlier. In general, Meyer said that candidates should also focus the conversation on how they'd work with the team, not just what they can accomplish on their own. Deflect strategically If the interviewer asks an inappropriate question about family or your personal life, Meyer wrote that candidates should gracefully redirect the conversation by asking another question. Doing so can increase hiring chances and likability more than telling the truth or confronting the interviewer, Meyer said. In general, Meyer told Business Insider that people should \"ask themselves religiously: Is what I'm going to say going to advance this conversation?\" Many people fall in the trap of talking too much or over-explaining, but just because you're prompted doesn't mean you have to fill the silence or overshare. \"Speaking less — and more meaningfully — will give you outsized influence,\" M", "date_str": "2026-09-11T09:44:01+00:00", "hash": "307e3abf7a3fceb8", "title_fa": "4 ترفند برای مصاحبه شغلی به گفته یک متخصص فریب و رفتار انسانی", "summary_fa": "پاملا مایر گفت که مردم باید از نظر مذهبی از خود بپرسند که آیا آنچه می گویند باعث پیشرفت گفتگو می شود یا خیر. Pamela Meyer Pamela Meyer یک بازرس تقلب و کارشناس رفتار انسانی است که \"چگونه اتاق را بخوانیم\" نوشته است. او حرکات قدرت مصاحبه را به اشتراک می گذارد، مانند استفاده از ضمیر جمع «ما» که بر همکاری تأکید دارد. مایر همچنین پیشنهاد می کند بدون کلمات پرکننده صحبت کنید و از انتقال های جسورانه برای نشان دادن اعتماد به نفس استفاده کنید. انجام یک مصاحبه - مانند هر چالش شرکتی - اغلب به این بستگی دارد که چگونه می توانید دیگران را بخوانید. پاملا مایر، مدیر عامل شرکت Calibrate، سازمان‌ها را در زمینه کشف تقلب، کاهش تهدیدات داخلی و آگاهی امنیتی آموزش می‌دهد. او در کتاب جدید خود با عنوان «چگونه اتاق را بخوانیم» به بررسی این موضوع می‌پردازد که چگونه آگاهی اجتماعی رهبری، مذاکره و تصمیم‌گیری را شکل می‌دهد. مایر، یک بازرس تایید شده تقلب، می گوید که یادگیری خواندن دیگران فقط یک مهارت برای رهبران نیست. این می تواند به نامزدها کمک کند تا به دور بعدی مصاحبه ها برسند. مایر به Business Insider گفت: «به نظر می رسد که خواندن اتاق یک مهارت اساسی است، و افزود که «کاملاً قابل آموزش است». مایر می نویسد که در حالی که جویندگان کار ممکن است در مورد سوال مصاحبه یا فراموش کردن ذکر یک دستاورد کلیدی نگران باشند، مصاحبه‌کنندگان اغلب بر اساس نشانه‌های غیرکلامی، از جمله تماس چشمی و تکان دادن سر، قضاوت‌های شخصیتی را شکل می‌دهند تا آنچه که نامزدها واقعاً می‌گویند. در اینجا چهار حرکت قدرت مصاحبه که او برای برجسته شدن در فرآیند مصاحبه توصیه می کند آورده شده است: استفاده از عبارت \"ما\" مایر در کتاب خود گفت که استفاده از ضمایر جمع، مانند \"ما\" به جای \"من\"، باعث می شود"}, {"source": "Business Insider", "title": "How to say 'no' at work without hurting your career", "link": "https://www.businessinsider.com/how-to-say-no-work-set-boundaries-2026-08", "summary": "Saying no is a professional skill, according to etiquette experts. Teera Konakan/Getty Images Today's tip to get better at work: The best way to say \"no\" to more work when you are at capacity. Setting boundaries helps maintain high-quality work and prevents burnout. If you're given a new task when you already have a lot on your plate, ask what you should prioritize. Get better at: Setting boundaries Today's move Don't say '\"yes\" to more work just because you're asked, especially if your plate is full and you could compromise your other work. If you're given a shorter-term ask and you have another fast-approaching deadline, tell your manager that you'd be happy to take on the additional project but in order to do it well, you'd need to deprioritize something else. Ask them what they would like you to focus on. Why it works Instead of refusing the work, you're communicating your current workload and asking them to verbalize what should be prioritized. This provides your manager with the context they need to decide what's most important, and puts the decision of what gets cut or put on the back burner in their hands. Try it today Write down everything on your to-do list and ask yourself if you'd be able to take on an additional project if you were asked at this moment. If you can't think of how to make room for it, you're probably already at capacity. Try proactively having a conversation with your manager about your workload so that they're aware. The bottom line In the first quarter of 2026, workers mentioned burnout in Glassdoor reviews 2.5 times more often than they did before the pandemic. In the midst of workplace changes, layoffs, and AI changing the pace of work, employees may be defaulting to taking on more. But saying \"yes\" to more work when you are already at capacity could actually compromise the quality of your work and set you up for failure. Source This insight is drawn from Business Insider reporting on how workers can say \"no\" at work, based on advice from etiquette experts Daniel Post Senning and Lizzie Post. Read the full story here. This story also includes data from a Glassdoor research post about how the workplace climate is burning workers out. You can view the full post here . Have you ever had to push back on more work because you were already at capacity? Tell us how you handled it in the comments. Read the original article on Business Insider", "date_str": "2026-09-11T09:37:01+00:00", "hash": "13318ab666bb7bb2", "title_fa": "چگونه در محل کار خود \"نه\" بگویید بدون اینکه به شغل خود آسیبی وارد شود؟", "summary_fa": "به گفته کارشناسان آداب معاشرت، نه گفتن یک مهارت حرفه ای است. Teera Konakan/Getty Images نکته امروز برای بهتر شدن در محل کار: بهترین راه برای \"نه\" گفتن به کار بیشتر در زمانی که ظرفیت خود را دارید. تعیین مرزها به حفظ کیفیت کار کمک می کند و از فرسودگی شغلی جلوگیری می کند. اگر در زمانی که چیزهای زیادی در بشقاب خود دارید، کار جدیدی به شما داده می شود، بپرسید چه چیزی را باید در اولویت قرار دهید. بهتر شدن در: تعیین مرزها حرکت امروز به کارهای بیشتر «بله» نگویید فقط به این دلیل که از شما خواسته شده است، به خصوص اگر بشقاب شما پر است و می توانید کارهای دیگر خود را به خطر بیندازید. اگر یک درخواست کوتاه‌مدت به شما داده شد و مهلت سریع دیگری دارید، به مدیر خود بگویید که خوشحال می‌شوید پروژه اضافی را انجام دهید، اما برای اینکه آن را به خوبی انجام دهید، باید چیز دیگری را در اولویت قرار دهید. از آنها بپرسید که دوست دارند روی چه چیزی تمرکز کنید. چرا کار می کند به جای اینکه کار را رد کنید، حجم کاری فعلی خود را با آنها در میان می گذارید و از آنها می خواهید آنچه را که باید اولویت بندی شود به صورت شفاهی بیان کنند. این موضوع زمینه ای را برای مدیر شما فراهم می کند که برای تصمیم گیری مهم ترین چیز به آن نیاز دارد، و تصمیم گیری در مورد اینکه چه چیزی بریده می شود یا در پشت مشعل قرار می گیرد را در دستان او قرار می دهد. امروز آن را امتحان کنید همه چیز را در لیست کارهایتان بنویسید و از خود بپرسید که اگر در این لحظه از شما خواسته شد می‌توانید پروژه دیگری را انجام دهید. اگر نمی توانید به این فکر کنید که چگونه برای آن"}, {"source": "Business Insider", "title": "We're asking the wrong question about an AI bubble, Goldman banking boss says", "link": "https://www.businessinsider.com/kim-posnett-goldman-sachs-ai-dealmaking-spacex-ipo-2026-9", "summary": "Kim Posnett said we re in an AI investment supercycle. Goldman Sachs Kim Posnett, co-head of investment banking at Goldman, said the \"AI bubble\" idea misses the point. Instead, Posnett sees an \"AI investment supercycle\" that may contain smaller bubbles. She said IPOs have exceeded her expectations and shared a key component of landing deals like SpaceX. Wall Street has spent much of this year debating whether the AI boom has become a bubble. Goldman Sachs' co-head of investment banking, Kim Posnett, thinks that's the wrong debate. \"People are asking the wrong question about whether we're in an AI bubble . I think the better question is whether AI will fundamentally change how companies operate, compete, and create value. And I think the answer to that question is clearly yes,\" she told Business Insider. Posnett has had a front-row seat to how corporate America is betting on that transformation. This year, Goldman has advised on some of the market's biggest transactions, including landing the coveted lead position on SpaceX's record IPO. Rather than a bubble, she sees an \"AI investment supercycle\" that will help fuel a boom in corporate spending and the dealmaking at the heart of her business. Those who are fixated on whether and when a bubble will pop risk underappreciating AI's potential value, Posnett said. That doesn't mean every AI company will be a winner — the internet, for example, created both enormously valuable companies and some of the biggest bubbles to date. \"Those two things can be true at the same time. Sure, there may be bubbles inside the AI ecosystem, but I don't believe that AI itself is a bubble,\" Posnett said. \"It's because the productivity opportunity is too large and too broadly applicable across the economy.\" The 'mega-cycle' is even more mega That broad applicability is helping supercharge the IPO and M A markets, despite geopolitical and economic uncertainty. The markets have exceeded Posnett's own early-year expectations of an IPO \"mega-cycle,\" both because of large transactions and the activity across sectors. Through September 10, global IPO volume reached $206 billion, up 183% from last year, according to LSEG data. As she sees it, the number of IPOs is a good indication of CEO confidence and investors' appetite to fund \"growth, innovation, and scale.\" While she didn't comment on specific anticipated blockbuster IPOs — both Anthropic and OpenAI have filed initial paperwork to go public — Posnett said SpaceX's record IPO was \"a", "date_str": "2026-09-11T09:34:01+00:00", "hash": "d3802838abf17466", "title_fa": "رئیس بانک گلدمن می‌گوید: ما در مورد حباب هوش مصنوعی سؤال اشتباهی می‌پرسیم", "summary_fa": "کیم پوسنت گفت ما در یک ابر چرخه سرمایه گذاری هوش مصنوعی هستیم. گلدمن ساکس کیم پوسنت، رئیس بانک سرمایه گذاری در گلدمن، گفت که ایده \"حباب هوش مصنوعی\" اصل مطلب را از دست می دهد. در عوض، Posnett یک \"ابر چرخه سرمایه گذاری هوش مصنوعی\" را می بیند که ممکن است حاوی حباب های کوچکتری باشد. او گفت که IPO ها فراتر از انتظارات او بوده اند و جزء کلیدی معاملات فرود مانند SpaceX را به اشتراک گذاشته اند. وال استریت بیشتر سال جاری را صرف بحث در مورد اینکه آیا رونق هوش مصنوعی به حباب تبدیل شده است یا خیر. کیم پوسنت، رئیس بانک سرمایه گذاری گلدمن ساکس، فکر می کند که این بحث اشتباه است. او به Business Insider گفت: \"مردم در مورد اینکه آیا ما در یک حباب هوش مصنوعی هستیم سوال اشتباه می پرسند. من فکر می کنم سوال بهتر این است که آیا هوش مصنوعی به طور اساسی نحوه عملکرد شرکت ها، رقابت و ایجاد ارزش را تغییر می دهد. و من فکر می کنم پاسخ این سوال به وضوح مثبت است.\" Posnett در ردیف اول در مورد نحوه شرط بندی شرکت های آمریکایی بر روی این تحول نقش داشته است. امسال، گلدمن در مورد برخی از بزرگ‌ترین معاملات بازار، از جمله کسب جایگاه برتر در رکورد عرضه اولیه سهام اسپیس ایکس، مشاوره داده است. او به‌جای حباب، «ابر چرخه سرمایه‌گذاری هوش مصنوعی» را می‌بیند که به رونق مخارج شرکت‌ها و معامله در قلب تجارت او کمک می‌کند. پوسنت گفت، کسانی که به این فکر می‌کنند که آیا حباب و چه زمانی می‌پاشد، در معرض خطر نادیده گرفتن ارزش بالقوه هوش مصنوعی هستند. این بدان معنا نیست که هر شرکت هوش مصنوعی برنده خواهد بود – برای مثال اینترنت، شرکت‌های بسیار ارزشمند و برخی از بزرگترین حباب‌ها را تا به امروز ایجاد کرده است."}, {"source": "Business Insider", "title": "NYC's best shot at affordable housing has hit some roadblocks", "link": "https://www.businessinsider.com/why-vacant-offices-are-one-of-nyc-top-housing-strategies-2026-9", "summary": "Vacant office buildings are one of NYC s main options to boost housing supply. Gary Hershorn/Getty Images Several NYC office-to-apartments conversions faced safety issues this summer. Retrofitting plumbing, windows, and floor plans for housing is costly and complicated. To solve the supply shortage, conversions are here to stay. Office-to-residential conversions — one of New York City's leading housing strategies — have been shaken by recent safety concerns. This summer, a \"stop work\" order was issued for the former Pfizer building in Midtown due to structural issues with steel columns, prompting fears of a collapse and temporary evacuation of the surrounding area. A lower Manhattan conversion at 222 Broadway was briefly halted over reports of a cracked horizontal concrete beam, and a Midtown East conversion — 750 Third Avenue — was partially stopped, also because of problems with steel columns. Mayor Zohran Mamdani plans to build 200,000 new homes during his first term. The issues with the office conversions raise questions about one of NYC's main means of boosting housing supply . Business Insider spoke with policy analysts and developers about the safety concerns, construction challenges, and what it all means for the future. Office conversions require costly retrofitting When constructing dense housing , cities have a few options: They can build from scratch, build above existing businesses, or convert underused hotels and offices into apartments. Offices, in particular, are ripe for housing because many were fully or partially vacated at the height of the pandemic . The NYC office vacancy rate was 15.2% in the second quarter of 2024, the state comptroller reported, up from 7.8% in the second quarter of 2016. Former workspaces provide a lot of space, but developers and policy analysts said construction can be challenging — part of the reason conversions have faced structural safety issues. Offices typically have a different foundation setup than residential buildings. Emma Waters, a senior housing policy analyst at the Bipartisan Policy Center, said this makes it more difficult to adjust floor plans , add floors, and split into units with their own kitchens and bathrooms. Plumbing is a concern. In a hotel conversion, for example, the space is already equipped with the piping and water system needed to sustain hundreds of toilets and showers. Offices might only have one or two bathroom setups per floor, which construction crews need to supplement during", "date_str": "2026-09-11T09:30:01+00:00", "hash": "86ac1e5e10951581", "title_fa": "بهترین عکس نیویورک در زمینه مسکن مقرون به صرفه با موانعی روبرو شده است", "summary_fa": "ساختمان های اداری خالی یکی از گزینه های اصلی نیویورک برای افزایش عرضه مسکن است. گری هرشورن/ گتی ایماژ چندین تبدیل دفتر به آپارتمان در نیویورک در تابستان امسال با مشکلات ایمنی مواجه شدند. مقاوم‌سازی لوله‌کشی، پنجره‌ها و پلان‌های کف برای مسکن پرهزینه و پیچیده است. برای حل کمبود عرضه، تبدیل ها اینجا باقی می مانند. تبدیل دفتر به مسکونی - یکی از استراتژی های مسکن شهر نیویورک - به دلیل نگرانی های اخیر ایمنی متزلزل شده است. تابستان امسال، به دلیل مشکلات ساختاری ستون‌های فولادی، دستور «توقف کار» برای ساختمان سابق فایزر در میدتاون صادر شد که باعث ترس از ریزش و تخلیه موقت منطقه اطراف شد. تبدیل منهتن پایین تر در 222 برادوی به دلیل گزارش هایی مبنی بر ترک خوردگی تیر بتنی افقی برای مدت کوتاهی متوقف شد، و تبدیل شرق میدتاون - خیابان سوم 750 - تا حدی متوقف شد، همچنین به دلیل مشکلات ستون های فولادی. شهردار زهران ممدانی قصد دارد در دوره اول ریاست جمهوری خود 200000 خانه جدید بسازد. مسائل مربوط به تبدیل های اداری سوالاتی را در مورد یکی از ابزارهای اصلی نیویورک برای افزایش عرضه مسکن ایجاد می کند. Business Insider با تحلیلگران و توسعه دهندگان سیاست در مورد نگرانی های ایمنی، چالش های ساخت و ساز و معنای همه آن برای آینده صحبت کرد. تبدیل دفاتر مستلزم مقاوم سازی پرهزینه هنگام ساخت مسکن متراکم، شهرها چند گزینه دارند: آنها می توانند از ابتدا بسازند، بالاتر از مشاغل موجود بسازند، یا هتل ها و دفاتر کم استفاده را به آپارتمان تبدیل کنند. دفاتر، به ویژه، برای مسکن آماده هستند، زیرا بسیاری از آنها به طور کامل یا جزئی در اوج همه گیری تخلیه شده بودند. بر اساس گزارش کنترلی ایالتی، نرخ جای خالی دفتر نیویورک در سه ماهه دوم سال 2024، 15.2 درصد بود که از 7.8 درصد در سه ماهه"}, {"source": "Business Insider", "title": "Most Olympians don't make millions. This bobsledder rented out his home to boost his income while competing around the world.", "link": "https://www.businessinsider.com/how-olympic-bobsledder-supplements-income-with-rental-real-estate-2026-9", "summary": "Boone Niederhofer competed for Team USA in bobsled at the 2026 Winter Olympics. Courtesy of Boone Niederhofer Boone Niederhofer, a former collegiate football player, began his bobsledding career after a COVID-era layoff. Today, he balances a full-time engineering job, Olympic training, and fatherhood. He explains how he created additional income during the Olympic season by renting out his home. Some might assume that making it to the Olympics brings financial security, but for many athletes in lesser-known sports, it's not a windfall. In fact, the costs can be higher than they pay for some Olympians. \"Athletes will go into debt trying to chase their dream,\" Olympian Boone Niederhofer told Business Insider. Equipment, travel, and lodging can add up quickly, while \"the realities of life are still there, even for people who make the Olympics.\" For Niederhofer, a bobsled push athlete and petroleum engineer from Texas, the path to the 2026 Winter Olympics required more than speed and strength. He worked full time, trained around his job, and turned his family's Midland home into a four-month mid-term rental while they traveled through Europe for the World Cup season. The rental income helped make it possible for his wife, Chloe, and their two young kids to join him rather than spend months apart. Before bobsled, Niederhofer played football at Texas A M. Courtesy of Boone Niederhofer Bobsled, familiar to many Americans mostly through the 1993 movie \"Cool Runnings,\" tends to draw athletes from football and track and field. \"Any athlete that is fast and powerful and strong is going to be a good bobsledder,\" explained Niederhofer, who developed those traits playing football at Texas A M before an ACL tear ended his college career. After graduating with a degree in petroleum engineering, he began working in the oil and gas industry. When he was laid off during the COVID pandemic, a former football teammate suggested he try out for the US bobsled team. Niederhofer competed full time from 2019 through 2022, training largely in Lake Placid, New York. At the time, he was single and able to make the arrangement work. Athletes on one of USA Bobsled's top teams can receive a stipend that caps at about $1,200 a month, he said, while lodging, food, and training expenses may be covered at the training center. But after he and Chloe got married and started to grow their family, the full-time professional bobsled lifestyle no longer made financial sense. Niederhofer moved his ", "date_str": "2026-09-11T09:30:01+00:00", "hash": "fcc7c3ede8dadb0d", "title_fa": "اکثر المپیکی ها میلیون ها درآمد ندارند. این باب اسلحه‌باز خانه‌اش را اجاره داد تا درآمد خود را در حین رقابت در سراسر جهان افزایش دهد.", "summary_fa": "بون نیدرهوفر در بازی‌های المپیک زمستانی 2026 برای تیم ایالات متحده در رشته باب اسلید شرکت کرد. با حسن نیت از بون نیدرهوفر بون نیدرهوفر، بازیکن سابق فوتبال دانشگاهی، پس از اخراج از دوران کووید، حرفه خود را با سورتمه سواری آغاز کرد. امروز او بین شغل مهندسی تمام وقت، آموزش المپیک و پدر بودن تعادل برقرار می کند. او توضیح می دهد که چگونه در طول فصل المپیک با اجاره خانه خود درآمد اضافی ایجاد کرده است. برخی ممکن است تصور کنند که رسیدن به المپیک امنیت مالی به همراه دارد، اما برای بسیاری از ورزشکاران در ورزش‌های کمتر شناخته شده، این پول بادآورده نیست. در واقع، هزینه ها می تواند بیشتر از آن چیزی باشد که برای برخی از المپیکی ها می پردازند. بون نیدرهوفر، قهرمان المپیک، به Business Insider گفت: «ورزشکاران در تلاش برای تعقیب رویای خود، بدهکار خواهند شد. تجهیزات، مسافرت و اسکان می توانند به سرعت جمع شوند، در حالی که \"واقعیت های زندگی هنوز وجود دارد، حتی برای افرادی که در المپیک شرکت می کنند.\" برای نیدرهوفر، یک ورزشکار هلی باب و مهندس نفت اهل تگزاس، مسیر رسیدن به المپیک زمستانی 2026 بیش از سرعت و قدرت نیاز داشت. او تمام وقت کار می کرد، در مورد شغلش آموزش می دید، و در حالی که آنها برای فصل جام جهانی در اروپا سفر می کردند، خانه خانواده اش در میدلند را به یک اجاره میان مدت چهار ماهه تبدیل کرد. درآمد اجاره به همسرش، کلوئه، و دو فرزند خردسالشان کمک کرد تا به جای گذراندن ماه‌ها جدایی، به او ملحق شوند. قبل از باب اسلید، نیدرهوفر در تگزاس A M فوتبال بازی می‌کرد. به لطف بون نیدرهوفر باب‌سلد که برای بسیاری از آمریکایی‌ها بیشتر از طریق فیلم «دویدن‌های جالب» در سال 1993 آشناست، تمایل دارد ورزشکاران را از فوتبال و دو و میدانی بکشاند."}, {"source": "Business Insider", "title": "Why stocks could weather coming rate hikes just fine", "link": "https://www.businessinsider.com/federal-reserve-rate-hikes-outlook-stocks-could-be-fine-ai-2026-9", "summary": "NYSE Markets think the Fed is likely to raise interest rates at least once in remaining months of 2026. Stocks often struggle against rate hikes, but AI spending and optimism may offset the impact, pros say. A slow pace of hikes may also help investors digest the moves. Investors tend to dread rate hikes , but some Wall Street pros say not to fret too much if the Federal Reserve raises interest rates this year. Odds are high that the Fed will hike rates at least once in the remaining months of 2026. As of Thursday afternoon, markets were pricing in a 71.8% chance that the central bank raises rates at its September meeting next week, according to the CME FedWatch tool. By the December meeting, investors think there are 63.5% odds that the Fed hikes at least twice. Controlling short-term interest rates is one tool the central bank has to slow or stimulate economic activity, allowing it to fight inflation or support job growth. Inflation has remained sticky in recent months, coming in at 3.4% year-over-year in July, and so investors expect the Fed will move up interest rates to weigh on rising consumer prices. Historically, rate hikes have meant trouble for stocks. According to LPL Financial, since 1994, the S P 500 has delivered negative returns in the six months following the first rate increase in a hiking cycle. And still fresh in investors' minds is 2022, when an onslaught of rate hikes that brought the fed funds rate from near zero to over 5% in a matter of months sank the S P 500 by 20% that year. But that's all history. What's the outlook for stocks like this time around? One positive factor the market has going for it is that the huge amounts of AI spending from hyperscalers is still fueling outsized earnings growth, said Whitney Stewart, a client portfolio manager at Sterling Capital Management. S P 500 earnings growth expectations are in the double digits for 2027, Stewart pointed out. If the AI spending outlook remains intact, it should be enough to counterbalance any dampening optimism from rate hikes, he said. LPL made a similar point in their note. The firm compared today's environment to 1997, when the S P 500 continued its furious rally despite Fed rate hikes as investors remained optimistic about the internet. Another thing stocks have going for them is that inflation, while sticky, seems to be moderating. It's down from 4.2% peak in May . That should allow the Fed to move fairly slowly, and data shows that speed matters when it comes to rat", "date_str": "2026-09-11T09:15:01+00:00", "hash": "31a9322f0b98b3d6", "title_fa": "چرا سهام می توانند به خوبی با افزایش نرخ های آینده مقابله کنند", "summary_fa": "بازارهای NYSE فکر می کنند فدرال رزرو حداقل یک بار در ماه های باقیمانده سال 2026 نرخ های بهره را افزایش می دهد. به گفته متخصصان، سهام ها اغلب با افزایش نرخ مبارزه می کنند، اما هزینه های هوش مصنوعی و خوش بینی ممکن است این تاثیر را جبران کند. سرعت پایین افزایش نیز ممکن است به سرمایه گذاران در هضم حرکت ها کمک کند. سرمایه گذاران از افزایش نرخ بهره می ترسند، اما برخی از طرفداران وال استریت می گویند که اگر فدرال رزرو نرخ بهره را در سال جاری افزایش دهد، خیلی نگران نباشید. بر اساس ابزار CME FedWatch، احتمال اینکه فدرال رزرو حداقل یک بار در ماه های باقیمانده سال 2026 افزایش یابد، بسیار زیاد است. از بعدازظهر پنجشنبه، بازارها با احتمال 71.8 درصدی قیمت گذاری کردند که بانک مرکزی در جلسه سپتامبر هفته آینده خود نرخ بهره را افزایش دهد. در جلسه دسامبر، سرمایه گذاران فکر می کنند که احتمال افزایش 63.5 درصدی فدرال رزرو حداقل دو بار وجود دارد. کنترل نرخ‌های بهره کوتاه‌مدت یکی از ابزارهایی است که بانک مرکزی برای کاهش یا تحریک فعالیت‌های اقتصادی دارد و به آن اجازه می‌دهد با تورم مبارزه کند یا از رشد شغل حمایت کند. تورم در ماه‌های اخیر ثابت مانده است و در ماه جولای به 3.4 درصد رسیده است و بنابراین سرمایه‌گذاران انتظار دارند که فدرال رزرو نرخ‌های بهره را افزایش دهد تا بر افزایش قیمت‌های مصرف‌کننده تاثیر بگذارد. از نظر تاریخی، افزایش نرخ به معنای دردسر برای سهام بوده است. طبق گزارش LPL Financial، از سال 1994، S P 500 در شش ماه پس از اولین افزایش نرخ در یک چرخه پیاده روی، بازدهی منفی داشته است. و هنوز در ذهن سرمایه گذاران تازه است، سال 2022، زمانی که هجوم افزایش نرخ بهره که نرخ وجوه بانک فدرال را از نزدیک به صفر به بیش"}, {"source": "Business Insider", "title": "'Healthcare professional' has dethroned 'influencer' as the dream career for young adults", "link": "https://www.businessinsider.com/teen-dream-job-doctor-medical-careers-surpass-influencers-creator-survey-2026-9", "summary": "Alix Earle is a top influencer. Todd Owyoung/NBC via Getty Images What do teens want to be when they grow up? Influencer or doctor? The two careers are top choices, with healthcare edging out creators by 0.2%, per a new survey. The influencer dream might be facing a reality check, though. Influencer, YouTuber, content creator . In recent years, these have been the top answers to the age-old question: \"What do you want to be when you grow up?\" That dream might be losing some of its luster. A recent survey of American teens and young adults found that medical and healthcare careers came out ever-so-slightly on top of becoming a creator and influencer. Clothing brand PacSun and analytics company GlobalData surveyed more than 6,000 US teens and young adults ages 11 to 24. The survey asked which careers respondents were interested in pursuing, and they could choose multiple career paths. Last year, PacSun's survey found that the influencer career was the top choice (22.2%), while medical careers came in second (19.4%). In 2026, however, influencer declined to 18.8%, slightly behind healthcare at 19%. Healthcare careers are seeing broad growth. Jobs from nurse practitioners to psychiatric technicians could witness a boom in the next decade , according to a recent job projections report from the Bureau of Labor Statistics. Is the influencer dream fading? Fancy trips, free things, and millions of fans — just for posting to social media? From the outside, the influencer lifestyle can seem like a dream come true. However, being an influencer is ultimately a job, whether it's a full-time gig or a side hustle. Like many jobs in the current economy, there's plenty of uncertainty surrounding it. For one, it's getting harder to make it big as a creator, as the virality jackpot grows more competitive in a saturated space. Influencers in the US are expected to earn over $21 billion from brand deals and platform revenue in 2026, according to Business Insider sister company EMARKETER. However, an influx of influencers at the lower end of the market has increased income inequality in the creator economy. Meanwhile, platforms like YouTube are making it tougher to qualify for monetization programs and cash out. Then there's the looming threat of AI. Social media, broadly, is also in the throes of a PR nightmare. Headline-making child safety and teen addiction lawsuits are shaping how a generation views the social media apps many use every day. In 2025, Pew Research Center found", "date_str": "2026-09-11T09:04:01+00:00", "hash": "355c287d0a7042ab", "title_fa": "\"متخصص مراقبت های بهداشتی\" \"اینفلوئنسر\" را به عنوان شغل رویایی برای بزرگسالان جوان از سلطنت خلع کرده است", "summary_fa": "آلیکس ارل یک اینفلوئنسر برتر است. تاد اویونگ/NBC از طریق گتی ایماژ، نوجوانان وقتی بزرگ شدند می خواهند چه کاره شوند؟ اینفلوئنسر یا دکتر؟ بر اساس یک نظرسنجی جدید، این دو شغل انتخاب‌های برتر هستند و مراقبت‌های بهداشتی ۰.۲ درصد از سازندگان پیشی گرفته است. اگرچه رویای اینفلوئنسر ممکن است با بررسی واقعیت روبرو شود. اینفلوئنسر، یوتیوبر، سازنده محتوا. در سال‌های اخیر، اینها بهترین پاسخ‌ها به این سوال قدیمی بوده است: \"وقتی بزرگ شدی می‌خواهی چه کاره شوی؟\" این رویا ممکن است درخشش خود را از دست بدهد. یک نظرسنجی اخیر از نوجوانان و جوانان آمریکایی نشان داد که مشاغل پزشکی و مراقبت های بهداشتی از تبدیل شدن به یک خالق و تأثیرگذار اندکی بالاتر است. نام تجاری پوشاک PacSun و شرکت تحلیلی GlobalData بیش از 6000 نوجوان و جوان آمریکایی 11 تا 24 ساله را مورد بررسی قرار دادند. در این نظرسنجی پرسیده شد که پاسخ دهندگان به دنبال کدام مشاغل هستند و آنها می توانند چندین مسیر شغلی را انتخاب کنند. سال گذشته، نظرسنجی PacSun نشان داد که شغل اینفلوئنسر بهترین انتخاب (22.2٪) بود، در حالی که مشاغل پزشکی در رتبه دوم قرار گرفتند (19.4٪). با این حال، در سال 2026، اینفلوئنسرها به 18.8 درصد کاهش یافت، اندکی پس از مراقبت های بهداشتی با 19 درصد. مشاغل مراقبت های بهداشتی شاهد رشد گسترده ای هستند. بر اساس گزارش پیش‌بینی‌های شغلی اخیر از سوی اداره آمار کار، مشاغل از پرستاران تا تکنسین‌های روانپزشکی ممکن است در دهه آینده شاهد رونق باشد. آیا رویای اینفلوئنسر در حال محو شدن است؟ سفرهای جذاب، چیزهای رایگان و میلیون ها طرفدار - فقط برای ارسال پست در رسانه های اجتماعی؟ از بیرون، سبک زندگی اینفلوئنسر می تواند یک رویا به نظر برسد. با این حال، اینفلوئنسر بودن در نهایت یک شغل است، خواه یک کنسرت تمام وقت باشد یا یک کار جانبی. مانند"}, {"source": "Business Insider", "title": "I'm a mom who switched to 'Buy Canada' 6 years ago. It takes certain sacrifices, but I wouldn't go back.", "link": "https://www.businessinsider.com/buy-canada-us-trade-tariffs-sahm-make-it-affordable-2026-9", "summary": "Sarina Cornthwaite has been participating in the Buy Canada movement for 6 years. Courtesy of Sarina Cornthwaite Sarina Cornthwaite is a stay-at-home mom who has been participating in 'Buy Canada' for 6 years. She said she doesn't mind buying non-Canadian products as long as it's not from the US. The biggest challenge is balancing the budget while shopping local. This as-told-to essay is based on conversations with Sarina Cornthwaite, a 35-year-old stay-at-home mom. She is based in Muskoka, Canada. Her words have been edited for length and clarity. Since the Buy Canada movement started last year, I've seen so many more of my family and friends participate and become more conscious of where their money is going. But being a stay-at-home mom, of course, I'm on a budget. Six years ago, we had just moved to a new town in Canada, and then four months later, the pandemic hit. I saw how many small businesses in our town had to close, and my husband and I started thinking, what can we do to try to support Canada through this? I've always tried to thrift and be more conscious, but buying from Canadian businesses and Canadian products became a huge priority for my family, especially when so many imports were being shut down, and we weren't sure what the full scale of things would be. We've prioritized buying Canadian ever since. Some things are more expensive to buy locally, but I've found a way to balance our budget. I budget much differently now During the pandemic, I discovered that a few grocery stores near me were selling boxes of locally grown produce for around 30 to 40 Canadian dollars. These stores were typically out of my budget , but with this deal, I was able to buy local and try new things while staying within it. My produce has become cheaper since switching to all-local, and I've subscribed my family to a weekly food box of all-local produce from Eat Local Muskoka, a neighborhood farm-to-table cooperative. We pay around CA$150 to CA$180 a month. It's fresh, I never have to wonder where it's coming from, and every week is a surprise for me, which is fun. Getting these local produce boxes helped me look toward our local butchers for meat instead of just going to the grocery stores . Some of our local butchers offer meat boxes priced between $150 and $300, depending on size. One of those boxes keeps us going for about a month, depending on how much meat we need. Our current food budget is roughly between CA$900 and CA$1,000 monthly for our family of thre", "date_str": "2026-09-11T09:03:01+00:00", "hash": "f9e10e27549502b4", "title_fa": "من مادری هستم که 6 سال پیش به «خرید کانادا» روی آوردم. فداکاری های خاصی می خواهد، اما من به عقب برنمی گردم.", "summary_fa": "سارینا کورنث وایت 6 سال است که در جنبش خرید کانادا شرکت می کند. با حسن نیت از سارینا کورنث وایت سارینا کورنث وایت یک مادر خانه نشین است که به مدت 6 سال در \"خرید کانادا\" شرکت کرده است. او گفت که برای خرید محصولات غیرکانادایی تا زمانی که از ایالات متحده نباشد مشکلی ندارد. بزرگترین چالش، متعادل کردن بودجه هنگام خرید محلی است. این مقاله گفته شده بر اساس گفتگو با سارینا کورنثویت، یک مادر 35 ساله که در خانه می ماند، است. او در موسکوکا، کانادا مستقر است. کلمات او برای طولانی و وضوح ویرایش شده است. از زمانی که جنبش خرید کانادا در سال گذشته شروع شد، من تعداد بیشتری از خانواده و دوستانم را دیدم که در آن شرکت کردند و از اینکه پولشان به کجا می رود آگاه تر شدند. اما از آنجایی که یک مادر خانه نشین هستم، مطمئناً بودجه زیادی ندارم. شش سال پیش، ما به تازگی به یک شهر جدید در کانادا نقل مکان کرده بودیم، و چهار ماه بعد، همه گیری شیوع پیدا کرد. من دیدم که چند کسب و کار کوچک در شهرمان باید تعطیل شوند، و من و شوهرم به این فکر کردیم که چه کاری می توانیم انجام دهیم تا از این طریق از کانادا حمایت کنیم؟ من همیشه سعی کرده‌ام صرفه‌جویی کنم و هوشیارتر باشم، اما خرید از مشاغل کانادایی و محصولات کانادایی به یک اولویت بزرگ برای خانواده‌ام تبدیل شد، به‌ویژه زمانی که بسیاری از واردات در حال تعطیل شدن بودند، و ما مطمئن نبودیم که مقیاس کامل کارها چقدر خواهد بود. ما از آن زمان خرید کانادایی را در اولویت قرار داده ایم. برخی چیزها برای خرید محلی گران تر هستند، اما من راهی برای متعادل کردن بودجه خود پیدا کرده ام. بودجه من اکنون بسیار متفاوت است در طول همه گیری، متوجه شدم"}, {"source": "Business Insider", "title": "The AI doomsdayers aren't new. You just weren't paying attention.", "link": "https://www.businessinsider.com/ai-doomer-predictions-not-new-jacob-coxon-anthropic-2026-9", "summary": "Tech workers have warned about an AI apocalypse for years. Why is it so viral now? Kirill Rudenko/Getty Images Jacob Coxon's resignation from Anthropic sparked a viral debate about AI extinction fears. Tech has been full of doomsdayers for years. Sam Altman said AI would probably \"lead to the end of the world\" in 2015. The question remains: Why do we suddenly care? Employees of the big AI labs are debating the death of the human race — again. If you've missed the apocalyptic chyrons on your TV and front-page headlines, former Anthropic employee Jacob Coxon warned that \"the people building AI earnestly believe that it could kill us all by the end of the decade.\" The X post set off a firestorm of AI lab employees building their own extinction theories and spitballing percentage chances of imminent death. For many, that feels shocking. But let's be real: AI doomerism has run rampant in Silicon Valley for years. Way back in 2015, Sam Altman called superintelligence the \"greatest threat to the continued existence of humanity.\" The sentiment continued to 2026; in May, Anthropic cofounder Jack Clark said there was a \"non-zero chance of killing everyone on the planet.\" So, what's with the sudden interest? Maybe it's that Coxon's post puts it more plainly than the deluge of open letters and research reports, or that he was leaving Anthropic after mere months. Maybe it's fueled by recent worrying signs of AI going rogue, like the Hugging Face hack . Or maybe the post merely lit a match under an already pessimistic public. \"People have been making the same exact claim for as long as I can remember,\" said Melanie Mitchell, a professor at the Santa Fe Institute. \"I'm a bit baffled by why it's gone so viral.\" A history of AI worries Let's take a brisk walk down memory lane of past Business Insider headlines. In May 2023 : Business Insider In March 2024 : Business Insider And in September 2025 : Business Insider And don't forget one of Sam Altman's classic 2015 quotes : \"I think that AI will probably, most likely, sort of lead to the end of the world. But in the meantime, there will be great companies created with serious machine learning.\" AI doomerism has been a constant drum beat in Silicon Valley's builder class — not just warning of an AI jobs wipe-out, but total annihilation of the human race. The bigger question is, why haven't we taken them seriously? For one, the message isn't always easy to empathize with. Tech employees sign open letters , and research organiz", "date_str": "2026-09-11T09:01:01+00:00", "hash": "d92de36a6459a355", "title_fa": "روز رستاخیز هوش مصنوعی جدید نیست. تو فقط توجه نکردی", "summary_fa": "کارگران فناوری سال‌ها در مورد یک آخرالزمان هوش مصنوعی هشدار داده‌اند. چرا الان اینقدر ویروسی شده؟ Kirill Rudenko/Getty Images استعفای جیکوب کاکسون از Anthropic باعث ایجاد یک بحث ویروسی در مورد ترس از انقراض هوش مصنوعی شد. سال‌هاست که فناوری پر از قیامت بوده است. سام آلتمن گفت که هوش مصنوعی احتمالاً در سال 2015 \"به پایان جهان خواهد انجامید.\" سوال باقی می ماند: چرا ما ناگهان اهمیت می دهیم؟ کارمندان آزمایشگاه‌های بزرگ هوش مصنوعی دوباره در مورد مرگ نسل بشر بحث می‌کنند. اگر داستان های آخرالزمانی در تیترهای تلویزیون و صفحه اول خود را از دست داده اید، کارمند سابق Anthropic، Jacob Coxon هشدار داده است که \"افرادی که هوش مصنوعی را می سازند، عمیقاً معتقدند که می تواند تا پایان دهه همه ما را بکشد.\" پست X طوفانی از کارمندان آزمایشگاه هوش مصنوعی به راه انداخت که تئوری‌های انقراض خود را ایجاد کردند و درصد شانس مرگ قریب‌الوقوع را افزایش دادند. برای بسیاری، این احساس تکان دهنده است. اما بیایید واقعی باشیم: سال هاست که نابودی هوش مصنوعی در سیلیکون ولی بیداد می کند. سام آلتمن در سال 2015، ابر هوش را \"بزرگترین تهدید برای ادامه حیات بشریت\" خواند. این احساسات تا سال 2026 ادامه یافت. در ماه مه، جک کلارک، یکی از بنیانگذاران آنتروپیک، گفت که \"احتمالی برای کشتن همه افراد روی این سیاره وجود ندارد.\" بنابراین، علاقه ناگهانی چیست؟ شاید به این دلیل است که پست کاکسون آن را واضح‌تر از سیل نامه‌های سرگشاده و گزارش‌های تحقیقاتی بیان می‌کند، یا اینکه او پس از چند ماه آنتروپیک را ترک می‌کرد. شاید با نشانه‌های نگران‌کننده اخیر هوش مصنوعی، مانند هک Hugging Face، تقویت شده باشد. یا شاید این پست صرفاً یک کبریت را زیر نظر مردم بدبین روشن کند. ملانی میچل، استاد مؤسسه سانتافه گفت: «از زمانی که من به یاد دارم، مردم دقیقاً همین ادعا را"}, {"source": "Business Insider", "title": "How Meta tried, and failed, to grab its employees' data for AI", "link": "https://www.businessinsider.com/meta-ai-program-prompted-internal-revolt-program-suspended-2026-9", "summary": "Meta CEO Mark Zuckerberg. Bloomberg/Getty Images Meta's top AI unit had a plan to teach chatbots to use computers: capture employees' screens. The move sparked an internal revolt as workers fought back with memes, flyers, and a petition. This story for The AI Data Grab series uncovers new details about how the program began. This spring, members of Meta's elite AI unit, TBD , decided that the social media giant needed an edge in the AI race. The edge they were looking for? Data from tens of thousands of Meta employees. Meta introduced a program to collect data from employees for AI training, called Model Capability Initiative (MCI). Employees' keystrokes and mouse movements could help Meta's AI replicate how humans use computers, a critical task as AI labs race to automate white-collar work like coding and accounting. But Meta had a very human problem: its own employees, who revolted over the mandatory project as soon as it was announced. Their resistance took the form of flyers, memes, and a viral petition against what some characterized as \"the Eye of Sauron.\" Organizers say that their constant pressure forced Meta to make concessions and eventually drop the program. Corporate data has become a gold mine for training AI because it helps algorithms deal with messy, real-world work environments — and workers are increasingly fighting back. Former Spirit Airlines flight attendants temporarily blocked Google from buying the bankrupt airline's database for $10 million. Over 1,800 Meta employees signed a petition calling for the company's internal tracking to be stopped. Meta halted the tracking program after an internal data leak this summer, saying it would switch to being opt-in only. Two months later, Meta says the program remains suspended. The company declined to comment further for this article. This story is part of a new series called The AI Data Grab, examining how companies are racing to collect as much data as possible to build the world's most advanced AI systems. For this story, Business Insider interviewed half a dozen current and former Meta employees, and reviewed internal posts and other materials to uncover new details about how the program began, how workers fought it, and the leak that brought it to a halt. How Meta began its MCI program The MCI program originated within Meta's AI unit, called TBD, a group of about 100 researchers widely considered the tip of the spear of the tech giant's AI efforts. One of the leaders of the effort was Ry", "date_str": "2026-09-11T09:00:02+00:00", "hash": "a339d6856e6f37d0", "title_fa": "چگونه متا تلاش کرد و شکست خورد تا داده های کارمندان خود را برای هوش مصنوعی بگیرد", "summary_fa": "مارک زاکربرگ مدیر عامل متا. بلومبرگ/ گتی ایماژ واحد هوش مصنوعی متا برنامه ای برای آموزش استفاده از رایانه به ربات های چت داشت: از صفحه نمایش کارمندان عکس بگیرید. این حرکت باعث یک شورش داخلی شد زیرا کارگران با میم‌ها، آگهی‌ها و یک طومار مبارزه کردند. این داستان برای سری AI Data Grab جزئیات جدیدی را در مورد نحوه شروع برنامه آشکار می کند. بهار امسال، اعضای واحد نخبه هوش مصنوعی متا، TBD، تصمیم گرفتند که غول رسانه های اجتماعی به برتری در مسابقه هوش مصنوعی نیاز دارد. لبه ای که دنبالش بودند؟ داده های ده ها هزار کارمند متا. متا برنامه ای را برای جمع آوری داده ها از کارمندان برای آموزش هوش مصنوعی معرفی کرد که ابتکار توانمندی مدل (MCI) نام داشت. فشار دادن کلید و حرکت ماوس کارمندان می تواند به هوش مصنوعی متا کمک کند تا نحوه استفاده انسان ها از رایانه را تکرار کند، این وظیفه حیاتی است زیرا آزمایشگاه های هوش مصنوعی برای خودکارسازی کارهای یقه سفید مانند کدنویسی و حسابداری تلاش می کنند. اما متا یک مشکل بسیار انسانی داشت: کارمندان خودش که به محض اعلام پروژه اجباری سر به شورش برداشتند. مقاومت آن‌ها به شکل آگهی‌ها، میم‌ها و یک طومار ویروسی علیه آنچه که برخی آن را «چشم سائورون» توصیف می‌کردند، بود. سازمان دهندگان می گویند که فشار مداوم آنها متا را مجبور کرد تا امتیازاتی بدهد و در نهایت برنامه را کنار بگذارد. داده‌های شرکتی به معدن طلا برای آموزش هوش مصنوعی تبدیل شده‌اند، زیرا به الگوریتم‌ها کمک می‌کند تا با محیط‌های کاری کثیف و واقعی کنار بیایند – و کارگران به طور فزاینده‌ای در حال مبارزه هستند. مهمانداران سابق هواپیمایی اسپیریت به طور موقت گوگل را از خرید پایگاه داده این شرکت هواپیمایی ورشکسته به قیمت 10 میلیون دلار مسدود کردند. بیش از 1800 کارمند متا طوماری را امضا"}, {"source": "Business Insider", "title": "The foldable iPhone Duo gives you a bigger screen and bragging rights. Here's what you give up.", "link": "https://www.businessinsider.com/iphone-duo-vs-18-pro-features-compared-2026-9", "summary": "Here are some of the compromises that made their way into the iPhone Duo s fold. Karl Mondon / AFP via Getty Images The $1,999 iPhone Duo immediately stands out. Its foldable design also introduces some nifty new iPhone features. But there are a few engineering taxes to achieve the foldable design. Here are a few areas where the Duo differs from the iPhone 18 Pro in hardware. The iPhone Duo may look flipping cool — but to get two screens and a hinge into a pocketable iPhone, Apple had to make some trade-offs. Apple's first-ever foldable smartphone, which ranges between $1,999 and $3,199, gets a 7.6-inch inner display when unfolded, which Apple calls the \"largest iPhone display ever.\" That's 50% larger than the screen on the next-gen iPhone 18 Pro. But even at $700 more than the iPhone 18 Pro Max, the Duo had to put some hardware and capabilities on the cutting-room floor to make room inside the device for new mechanical components. Sure, early adopters get immediate bragging rights and some cool features that are only available on the foldable phone — but it comes at a cost. Debating between the iPhone Duo and the iPhone 18 Pro? Here are four of those trade-offs to consider. A weaker camera system The Duo has slightly lower camera hardware quality than the iPhone 18 Pro Max. Benjamin Fanjoy/Getty Images The camera is perhaps the most notable hardware compromise. The Duo's outer, front-facing camera is 12 megapixels, while the iPhone 18 Pro and Pro Max have an 18-megapixel Center Stage camera with autofocus. More importantly, the Pro models have a dedicated telephoto lens for distant subjects; the Duo does not. It's not all bad news for photogs. The foldable design includes the 48-megapixel ultrawide lens for wide landscapes and close-up macro shots. That's nearly the same updated hardware found on the iPhone 18 Pro Max. apple on the bleeding edge of boyfriend technology https://t.co/rtDrd3A891 — Armand Domalewski (@ArmandDoma) September 9, 2026 And, Duo's outer screen serves as a viewfinder when users activate the rear cameras, a first for an iPhone. That lets the subject see the shot as it's being taken, a feature that, on X, people are calling boyfriend-friendly. Bottom line: You gain some cool new photo-taking features, but give up some of the top-of-the-line camera tech found in the iPhone 18 Pro lineup. No Face ID Duo won t recognize your face. Jakub Porzycki/NurPhoto via Getty Images Do you have a pretty face? iPhone Duo won't open up to it. The iPho", "date_str": "2026-09-11T08:10:01+00:00", "hash": "c7feb31a01034b2d", "title_fa": "iPhone Duo تاشو به شما صفحه نمایش بزرگتر و حق بالیدن می دهد. در اینجا چیزی است که شما رها می کنید.", "summary_fa": "در اینجا برخی از مصالحه‌هایی که در iPhone Duo راه پیدا کردند، آورده شده است. کارل موندون / خبرگزاری فرانسه از طریق گتی ایماژ آیفون 1999 دلاری آیفون Duo بلافاصله برجسته می شود. طراحی تاشو آن نیز برخی از ویژگی های جدید آیفون را معرفی می کند. اما چند مالیات مهندسی برای دستیابی به طراحی تاشو وجود دارد. در اینجا چند مورد از تفاوت‌های Duo با آیفون 18 پرو در سخت‌افزار وجود دارد. ممکن است iPhone Duo جالب به نظر برسد – اما برای قرار دادن دو صفحه نمایش و یک لولا در یک آیفون جیبی، اپل مجبور شد برخی معاوضه ها را انجام دهد. اولین گوشی هوشمند تاشوی اپل که قیمتی بین 1999 تا 3199 دلار دارد، در صورت باز شدن از صفحه نمایش داخلی 7.6 اینچی برخوردار می شود که اپل آن را \"بزرگترین نمایشگر آیفون تا کنون\" می نامد. این نمایشگر 50 درصد بزرگتر از صفحه نمایش نسل بعدی آیفون 18 پرو است. اما حتی با 700 دلار بیشتر از آیفون 18 پرو مکس، Duo مجبور بود برخی از سخت افزارها و قابلیت ها را در کف اتاق برش قرار دهد تا جایی در داخل دستگاه برای قطعات مکانیکی جدید ایجاد کند. مطمئناً، کاربران اولیه حقوق لاف زدن و برخی ویژگی‌های جالب را که فقط در تلفن‌های تاشو در دسترس هستند، دریافت می‌کنند – اما هزینه‌ای دارد. مناظره بین iPhone Duo و iPhone 18 Pro؟ در اینجا چهار مورد از این معاوضه ها را بررسی می کنیم. سیستم دوربین ضعیف‌تر Duo کیفیت سخت‌افزار دوربین کمی پایین‌تر از iPhone 18 Pro Max دارد. Benjamin Fanjoy/Getty Images دوربین شاید قابل توجه ترین سازش سخت افزاری باشد. دوربین بیرونی و جلوی Duo 12 مگاپیکسلی است، در حالی که آیفون 18 پرو و ​​پرو مکس دارای یک دوربین 18 مگاپیکسلی مرکز استیج با فوکوس خودکار هستند. از همه مهمتر، مدل های"}, {"source": "Business Insider", "title": "China's AI chip IPO boom rolls on as another Nvidia challenger soars 200% in market debut", "link": "https://www.businessinsider.com/nvidia-challenger-enflame-techology-stock-china-ai-chip-ipo-boom-2026-9", "summary": "Enflame is among a new wave of Chinese AI chipmakers raising capital as Beijing pushes for semiconductor self-sufficiency. CFOTO/Future Publishing/Getty Images China's latest AI chip IPO jumped 200% in its Shanghai debut after raising $913 million. Investor demand is surging as Beijing backs Nvidia challengers amid US chip curbs. Enflame grew revenue 37% last year but remains loss-making and heavily reliant on Tencent. Investors are piling into China's artificial intelligence chipmakers as Beijing's push to build domestic alternatives to Nvidia fuels a new wave of blockbuster IPOs. On Friday, Shanghai Enflame Technology surged about 200% in its debut on Shanghai's tech-focused Star market after raising 6.12 billion yuan, or $913 million. Backed by the Chinese gaming giant Tencent, Enflame develops AI chips for training and inference, making it one of a new generation of domestic chipmakers benefiting from Beijing's push for semiconductor self-sufficiency amid US export restrictions. Enflame's online retail tranche was more than 6,000 times oversubscribed, underscoring strong investor appetite for Chinese AI chipmakers. Enflame's debut follows the December listing of fellow AI GPU designer Moore Threads, another Chinese startup seeking to challenge Nvidia, as well as the recent high-profile IPOs of memory chipmaker CXMT and robotics company Unitree. The listing also offers a glimpse into the economics of China's emerging AI chipmakers. In 2025, Enflame's revenue rose 37% to 990 million yuan, while its loss excluding non-recurring items narrowed to 1.20 billion yuan, according to the company's listing prospectus. Meanwhile, its largest customer, Chinese internet and gaming giant Tencent, accounted for nearly 84% of sales. The company expects to break even in 2026 or 2027. Enflame's strong market debut reflects growing investor appetite for Chinese AI and semiconductor IPOs. China is \"still at a very early stage of a multi-year IPO upcycle\" as semiconductor, AI infrastructure, and robotics companies tap public markets to fund research and expansion, wrote Morgan Stanley analysts in a note on August 28. The bank said many of the new listings are developing technologies China sees as strategically important, with companies investing more heavily in research and capital spending, though many have yet to become profitable. \"Capital markets are therefore critical to help them scale up,\" the bank's analysts wrote. Read the original article on Business Insider", "date_str": "2026-09-11T07:50:34+00:00", "hash": "a65700c3a2d78b66", "title_fa": "رونق عرضه اولیه سهام تراشه هوش مصنوعی در چین با افزایش 200 درصدی رقیب دیگر انویدیا در بازار آغاز شد.", "summary_fa": "Enflame در میان موج جدیدی از سازندگان تراشه‌های هوش مصنوعی چینی است که در حال افزایش سرمایه هستند زیرا پکن برای خودکفایی نیمه‌رساناها تلاش می‌کند. CFOTO/نشر آینده/گتی ایماژ آخرین عرضه اولیه تراشه هوش مصنوعی چین پس از جمع آوری 913 میلیون دلار در اولین عرضه خود در شانگهای، 200 درصد افزایش یافت. تقاضای سرمایه گذاران در حال افزایش است زیرا پکن از رقبای انویدیا در میان محدودیت های تراشه های ایالات متحده حمایت می کند. Enflame در سال گذشته 37 درصد افزایش درآمد، اما همچنان زیان ده است و به شدت به Tencent وابسته است. در حالی که تلاش پکن برای ساخت جایگزین های داخلی برای انویدیا، موج جدیدی از عرضه های اولیه اولیه عمومی را به جریان انداخته است، سرمایه گذاران در حال انباشته شدن در سازندگان تراشه های هوش مصنوعی چین هستند. روز جمعه، Shanghai Enflame Technology در اولین حضور خود در بازار ستاره متمرکز بر فناوری شانگهای پس از جذب 6.12 میلیارد یوان یا 913 میلیون دلار، حدود 200 درصد افزایش یافت. با حمایت غول بازی چینی Tencent، Enflame تراشه‌های هوش مصنوعی را برای آموزش و استنتاج توسعه می‌دهد و آن را به یکی از نسل جدیدی از تراشه‌سازان داخلی تبدیل می‌کند که از فشار پکن برای خودکفایی نیمه‌رساناها در میان محدودیت‌های صادراتی ایالات متحده سود می‌برد. سهم خرده‌فروشی آنلاین Enflame بیش از 6000 بار بیش از حد مجاز بود که نشان‌دهنده اشتهای سرمایه‌گذاران قوی برای سازندگان تراشه‌های هوش مصنوعی چینی بود. اولین کار Enflame پس از لیست دسامبر توسط Moore Threads، طراح گرافیکی هوش مصنوعی دیگر، استارتاپ چینی دیگری که به دنبال به چالش کشیدن انویدیا است، و همچنین IPOهای اخیر سازنده تراشه های حافظه CXMT و شرکت روباتیک Unitree انجام می شود. این فهرست همچنین نگاهی اجمالی به اقتصاد سازندگان تراشه‌های هوش مصنوعی در حال ظهور چین دارد. در سال 2025، درآمد Enflame 37٪ افزایش"}, {"source": "Business Insider", "title": "'I saw Terminator 2': Y Combinator's Garry Tan pushes back on AI extinction fears", "link": "https://www.businessinsider.com/y-combinator-ceo-push-backai-doomsday-fears-terminator-2026-9", "summary": "Garry Tan says we need to separate science fact from science fiction. Bloomberg/Getty Images Garry Tan urged people to focus on real AI risks, not Hollywood doomsday scenarios. Anthropic and OpenAI are facing criticism from insiders over their approaches to AI safety. Y Combinator is the backer of hundreds of AI startups, including OpenAI, Scale AI, and Emergent. Y Combinator CEO Garry Tan says people are getting distracted by Hollywood-style doomsday scenarios when they should be focused on the real AI risks emerging today. \"I think that we need to be focused on science fact, not science fiction,\" Tan said in a CNBC interview on Thursday. \"I saw 'Terminator 2' also. It's a great movie.\" For the uninitiated, \"Terminator 2: Judgment Day\" is a 1991 sci-fi flick about the T-800, a cyborg that travels back in time from a dystopian future. Its mission: To fight another more advanced cyborg in order to protect a child, who later grows up to become the leader of the human resistance against killer machines. The YC CEO's comments come as fears about AI's existential risks have exploded across Silicon Valley after a wave of unusually public warnings from current and former researchers at OpenAI and Anthropic. Rather than debating whether superintelligent AI could wipe out humanity, Tan said policymakers from both sides should concentrate on immediate problems such as cybersecurity, infrastructure security, and understanding how autonomous AI agents operate . \"If there was a breach and a coordinated attempt by agents to take over our infrastructure, what do we do about it?\" Tan said. \"Do we know where a given agent is running? What data center? How do we shut it off?\" He used the OpenAI-Hugging Face hack as an example of a current problem that needs to be solved. In July, OpenAI disclosed that its model escaped a test environment and hacked into Hugging Face's systems . OpenAI called the incident a \"warning shot\" and paused its largest planned frontier reinforcement-learning run. When asked whether the recent warnings from researchers working inside Anthropic and OpenAI make the threat more credible, Tan said he was not dismissing them. \"I wouldn't say that they're alarmist in the wrong way,\" he said. \"They're alarmist, probably in the right way. I would say that we need to actually direct our attention not to vague notions that this is evil and it must stop.\" Tan has considerable interests in AI — YC is one of Silicon Valley's biggest backers of AI startups. It fun", "date_str": "2026-09-11T07:06:36+00:00", "hash": "1ce29456e30dc2d0", "title_fa": "\"من ترمیناتور 2 را دیدم\": گری تان از Y Combinator ترس از انقراض هوش مصنوعی را عقب می اندازد", "summary_fa": k market despite a sharp bond sell-off. An AI spending boom is helping keep stocks afloat as companies pour billions into infrastructure. The bigger risk may be rising corporate borrowing, which could keep Fed rate hikes coming. Treasury yields have climbed to levels that would normally weigh on stocks. But they haven't derailed the bull market. Late Thursday, the benchmark 10-year Treasury yield climbed to 4.97%, capping a monthslong bond sell-off fueled by higher oil prices, sticky inflation, heavy government borrowing, and expectations that the Federal Reserve will keep interest rates higher for longer. The bond sell-off continued even after the Treasury tripled the size of one of its long-term bond buybacks. Still, economists at TS Lombard don't think higher yields are enough to break the stock market. \"Rising yields are not yet an equity killer,\" Freya Beamish and Davide Oneglia wrote in a Wednesday note. They argue the latest rise in yields isn't being driven by the kind of overheating economy that typically ends a bull market. Instead, they see it as a response to supply shocks and changes in the Treasury market. One reason stocks have remained resilient is the AI spending boom. Beamish and Oneglia said companies are still pouring money into data centers and AI infrastructure, creating a cycle that keeps investment and demand growing. \"When tech companies are chasing the notion of infinite demand, it is quite hard to slow them down with a few basis points,\" they wrote. The longer-term question is whether that investment spreads beyond the tech industry. Right now, much of that demand comes from within the tech industry itself. If businesses outside the tech sector don't start spending more on AI, or if leading AI models lose their competitive edge, growth could eventually slow, even for hyperscalers. The economists said investors should look beyond interest rates and pay closer attention to how much companies are borrowing. \"We'll be watching credit and
