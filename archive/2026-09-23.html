امین و تضمین خواهد کرد. دریغ و درد که «امتیاز ویژه» برای استخدام در صنایع نیشکر، همیشه وعده‌ای روی هوا باقی ماند و حالا این جوانان می‌خواهند عملی شدن آن را ببینند. «ما همه متاهل و جویای کار هستیم. نه اغتشاش‌گریم نه دنبال بلوا و آشوب. فقط حق خود را می‌خواهیم. خودتان می‌دانید شرایط اقتصادی چقدر خراب است. کارگری که استخدام است و حقوق دارد هم نمی‌تواند از پس مخارج زندگی بر بیاید چه رسد به ما که کار و درآمد نداریم. فرزندم اگر مریض شود هزار تومان توی جیب ندارم که برایش فیش پذیرش بگیرم باقی مخارج پیش‌کش..» این بخشی از اظهارات یکی از جوانان جویای کار شهر «حر» است که دیروز دوشنبه ۳۰شهریور۱۴۰۵ برای چندمین روز پیاپی مقابل شرکت کشت و صنعت نیشکر هفت‌تپه تجمع کرده و خواهان ایجاد فرصت‌های شغلی و توسعه ظرفیت‌های اشتغال در منطقه شده‌اند. این شهروند معترض می‌گوید بیش از یک هفته است او و شماری دیگر از همشهریانش پیگیر مطالبه شغلی هستند اما تا به امروز پاسخی از سوی مسوولان شرکت"}, {"source": "IranWire", "title": "شاهزاده رضا پهلوی برای دیدار با نمایندگان دیپلماتیک کشورها وارد نیویورک شد", "link": "https://iranwire.com/fa/news-1/157940/", "summary": "دفتر ارتباطات و رسانه شاهزاده رضا پهلوی اعلام کرد که وی روز سه‌شنبه ۳۱ شهریور وارد نیویورک شده است.بر اساس این اطلاعیه، شاهزاده رضا پهل ...", "date_str": "2026-09-22T15:25:54+00:00", "hash": "ff93a76743a69519", "title_fa": "شاهزاده رضا پهلوی برای دیدار با نمایندگان دیپلماتیک کشورها وارد نیویورک شد", "summary_fa": "دفتر ارتباطات و رسانه شاهزاده رضا پهلوی اعلام کرد که وی روز سه‌شنبه ۳۱ شهریور وارد نیویورک شده است.بر اساس این اطلاعیه، شاهزاده رضا پهل ... اجلاس سالانه کنکوردیا مجمع غیرحزبی و بین‌المللی است که رهبران بخش‌های دولتی، خصوصی و مدنی را برای گفت‌وگو و ایجاد مشارکت‌های عملی درباره چالش‌های جهانی (مثل فناوری، سلامت، انرژی، امنیت و حقوق بشر) گرد هم می‌آورد. این رویداد هر سال همزمان با مجمع عمومی سازمان ملل در نیویورک برگزار می‌شود و امسال از ۲۰ تا ۲۳ سپتامبر ۲۰۲۶ در حال برگزاری است. از جمله حاضران و سخنرانان امسال، ماریا ماچادو، رهبر مخالفان ونزوئلا و برنده نوبل صلح، ژنرال دیوید پتریوس، نخست‌وزیر مالت و مقامات قطری و دیگر رهبران جهانی هست یدی در منزل شخصی خود بازداشت شده و خانواده، نزدیکان و همکارانش همچنان اطلاعی از وضعیت او ندارند. براساس اطلاعات کمیته حفاظت از روزنامه‌نگاران، نیروهای امنیتی روز ۱۸ شهریور ۱۴۰۵ وارد خانه این عکاس خبری در تهران شدند و او را بازداشت کردند. تاکنون مشخص نشده است کدام نهاد امنیتی مسئول بازداشت سعیدی است، او در چه محلی نگهداری می‌شود و چه اتهام یا اتهام‌هایی علیه او مطرح شده‌اند. مقام‌های قضایی و امنیتی نیز درباره دلایل بازداشت این عکاس توضیحی نداده‌اند. این انجمن تاکید کرده است که عکاسان خبری بخشی از بدنه رسانه‌ای ایران هستند و مسئولیت حرفه‌ای آن‌ها ثبت و روایت رویدادهای جامعه است. در اطلاعیه انجمن آمده است برخورد امنیتی با فعالیت عکاسان، علاوه‌بر نقض حقوق حرفه‌ای آن‌ها، روند اطلاع‌رسانی و ثبت تاریخ معاصر ایران را نیز مختل می‌کند. مجید سعیدی پیش‌تر نیز چند بار به‌دلیل فعالیت حرفه‌ای خود بازداشت شده بود. ماموران پلیس در ۲۷ خرداد ۱۴۰۴، هنگام عکاسی از محل حمله اسرائیل به ساختمان صداوسیمای جمهوری اسلامی در تهران، او را بازداشت و به زندان اوین منتقل کردند. سعیدی یک روز بعد، پس از بررسی کارت خبرنگاری و مجوز فعالیتش، آزاد شد. مجید سعیدی از عکاسان شناخته‌شده ایرانی است و برای پوشش پیامدهای جنگ افغانستان جوایزی از یونیسف، ورلد پرس فوتو، بنیاد رابرت اف. کندی و جوایز لوسی دریافت کرده است. پروژه بلندمدت او با عنوان «زندگی در جنگ» نیز زندگی غیرنظامیان افغانستان را در چند دهه درگیری مستند کرده است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید"}, {"source": "IranWire", "title": "فقر، ازدواج و ممانعت خانواده؛ دلایل بازماندن هزاران کودک ایرانی از تحصیل", "link": "https://iranwire.com/fa/news-1/157970-%D9%81%D9%82%D8%B1-%D8%A7%D8%B2%D8%AF%D9%88%D8%A7%D8%AC-%D9%88-%D9%85%D9%85%D8%A7%D9%86%D8%B9%D8%AA-%D8%AE%D8%A7%D9%86%D9%88%D8%A7%D8%AF%D9%87-%D8%AF%D9%84%D8%A7%DB%8C%D9%84-%D8%A8%D8%A7%D8%B2%D9%85%D8%A7%D9%86%D8%AF%D9%86-%D9%87%D8%B2%D8%A7%D8%B1%D8%A7%D9%86-%DA%A9%D9%88%D8%AF%DA%A9-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86%DB%8C-%D8%A7%D8%B2-%D8%AA%D8%AD%D8%B5%DB%8C%D9%84/", "s ا می‌تواند دسترسی آن‌ها به نظام مالی آمریکا را به خطر بیندازد. با این حال، در همین روز یک فروند هواپیمای ماهان‌ایر که از تهران برخاسته بود، در فرودگاه بین‌المللی بایون گوانگژو به زمین نشست. داده‌های فلایت‌رادار۲۴ این پرواز را ثبت کرده‌اند. این پرواز یک روز پس از آن انجام شد که چین مخالفت خود را با تحریم‌های آمریکا علیه شرکت‌های هواپیمایی ایران اعلام کرد؛ تحریم‌هایی که پکن آن‌ها را «غیرقانونی» توصیف کرده است. ادامه پرواز ماهان به چین نشان می‌دهد که فشار آمریکا، دست‌کم در نخستین ساعات پس از پایان مهلت، به توقف کامل همه پروازهای خارجی شرکت‌های ایرانی منجر نشده است. با این حال، هنوز روشن نیست که پروازهای ماهان به چین ادامه خواهند یافت یا این پرواز موردی استثنایی هم‌زمان با پایان مهلت تعیین‌شده بوده است. حتی در صورت ادامه این پروازها، مسیر چین برای بسیاری از مسافرانی که مقصدشان ترکیه، کشورهای همسایه یا کشورهای غربی است، جایگزین عملی و مناسبی محسوب نمی‌شود."}, {"source": "BBC Persian", "title": "پاکستان مدعی سرنگونی «هشت پهپاد» شلیک شده از افغانستان شد؛ طالبان: حمله‌ای صورت نگرفته است", "link": "https://www.bbc.com/persian/articles/cmzez9k8j8n3o?at_medium=RSS&at_campaign=rss", "summary": "ارتش پاکستان می‌گوید «هشت پهپاد» را که به گفته این کشور از «خاک افغانستان» در نزدیکی مرز به پرواز درآمده بودند، سرنگون کرده است. اما منابع در وزارت دفاع حکومت طالبان می‌گویند که از سوی افغانستان «هیچ حمله‌ای» به طرف پاکستان صورت نگرفته و «شایعاتی که در این مورد منتشر شده، حقیقت ندارد.»", "date_str": "2026-09-23T13:55:17+00:00", "hash": "2a039b2a25800dcc", "title_fa": "پاکستان مدعی سرنگونی «هشت پهپاد» شلیک شده از افغانستان شد؛ طالبان: حمله‌ای صورت نگرفته است", "summary_fa": "ارتش پاکستان می‌گوید «هشت پهپاد» را که به گفته این کشور از «خاک افغانستان» در نزدیکی مرز به پرواز درآمده بودند، سرنگون کرده است. اما منابع در وزارت دفاع حکومت طالبان می‌گویند که از سوی افغانستان «هیچ حمله‌ای» به طرف پاکستان صورت نگرفته و «شایعاتی که در این مورد منتشر شده، حقیقت ندارد.» منابع امنیتی پاکستان می‌گویند که تلاش‌های حکومت طالبان برای هدف قرار دادن مناطقی در خاک پاکستان را «خنثی» کرده‌اند. این تحول دو روز پس یت پتاس، ابراز تردید کردند. آن‌ها همچنین بر مخالفت احتمالی روسیه با هرگونه توافق جدی میان مینسک و واشنگتن تاکید کردند. یکی از تحلیلگران مطرح کرد که اگر گزینه ترانزیت پتاس از کشورهای بالتیک عملی شود، ممکن است راه برای عبور غلات اوکراین از بلاروس و صادرات آن از بنادر بالتیک نیز باز شود. دونالد ترامپ روز ۲۱ سپتامبر در شبکه اجتماعی خود نوشت که آمریکا در حال کار روی «توافقی عظیم» برای خرید پتاس از بلاروس، یکی از تولیدکنندگان بزرگ کود در جهان، است. او افزود: «قیمت آن به‌طور قابل‌توجهی کمتر از مبلغی خواهد بود که در حال حاضر به کانادا می‌پردازیم؛ خبری بسیار خوب برای کشاورزان و دامداران ما.» این اعلام چند روز پس از سفر جان کول، فرستاده او، به مینسک صورت گرفت؛"}, {"source": "BBC Persian", "title": "چرا سرقت از موزه‌ها رو به افزایش است؟", "link": "https://www.bbc.com/persian/articles/cy8zvz51pexo?at_medium=RSS&at_campaign=rss", "summary": "سرقت چهار تابلوی میلیون‌یورویی از موزه رنوار در فرانسه تنها تازه‌ترین حلقه از زنجیره‌ای از دستبردهای جسورانه به موزه‌ها و مجموعه‌های فرهنگی اروپا است. کارشناسان می‌گویند پس از سرقت خبرساز از موزه لوور در سال گذشته، موجی از سرقت‌های مشابه در نقاط مختلف اروپا شکل گرفته و سارقان بیش از پیش به سراغ اشیای کوچک، ارزشمند و قابل‌فروش مانند جواهرات، فلزات گران‌بها و آثار تاریخی رفته‌اند؛ روندی که نگرانی‌ها درباره امنیت گنجینه‌های فرهنگی اروپا را افزایش داده است.", "date_str": "2026-09-23T00:19:18+00:00", "hash": "88d8a4c20159da95", "title_fa": "چرا سرقت از موزه‌ها رو به افزایش است؟", "summary_fa": "سرقت چهار تابلوی میلیون‌یورویی از موزه رنوار در فرانسه تنها تازه‌ترین حلقه از زنجیره‌ای از دستبردهای جسورانه به موزه‌ها و مجموعه‌های فرهنگی اروپا است. کارشناسان می‌گویند پس از سرقت خبرساز از موزه لوور در سال گذشته، موجی از سرقت‌های مشابه در نقاط مختلف اروپا شکل گرفته و سارقان بیش از پیش به سراغ اشیای کوچک، ارزشمند و قابل‌فروش مانند جواهرات، فلزات گران‌بها و آثار تاریخی رفته‌اند؛ روندی که نگرانی‌ها درباره امنیت گنجینه‌های فرهنگی اروپا را افزایش داده است. وقتی سارقان به موزه‌ای در فرانسه دستبرد زدند و چهار تابلو از پیر-اگوست رنوار، نقاش امپرسیونیست، را که می حریم‌های ثانویه متوقف می‌شود."}, {"source": "Radio Farda", "title": "ویتکاف: یک دور از گفت‌وگوها با ایران پایان گرفت؛ استقبال ترامپ و تهدید همزمان درباره کلنگ‌گزلا", "link": "https://www.radiofarda.com/a/trump-iran-deal-witkoff-mediated-talks-gulf/33862610.html", "summary": "رئیس‌جمهور آمریکا، ساعاتی پس از سخنرانی در مجمع عمومی سازمان ملل، در نشست با رهبران کشورهای شورای همکاری خلیج فارس از شکل‌گیری «تحرک زیادی» برای دستیابی به توافق با ایران خبر داد.", "date_str": "2026-09-23T05:57:55+00:00", "hash": "d1d28e99cc6c02d9", "title_fa": "ویتکاف: یک دور از گفت‌وگوها با ایران پایان گرفت؛ استقبال ترامپ و تهدید همزمان درباره کلنگ‌گزلا", "summary_fa": "رئیس‌جمهور آمریکا، ساعاتی پس از سخنرانی در مجمع عمومی سازمان ملل، در نشست با رهبران کشورهای شورای همکاری خلیج فارس از شکل‌گیری «تحرک زیادی» برای دستیابی به توافق با ایران خبر داد. رئیس‌جمهور آمریکا ساعاتی پس از سخنرانی در مجمع عمومی سازمان ملل که بخش قابل‌توجهی از آن به موضوع ایران اختصاص داشت، در نشست با رهبران کشورهای شورای همکاری خلیج فارس نیز از شکل‌گیری «تحرک زیادی» برای دستیابی به توافق با ایران خبر داد. دونالد ترامپ در عین حال بار دیگر تهدید کرد در صورت مشاهدهٔ فعالیت در تأسیسات زیرزمینی کوه کلنگ‌گزلا، آمریکا «فوراً» آن را هدف قرار خواهد داد. آقای ترامپ در این نشست که بامداد چهارشنبه یکم مهر به‌وقت ایران و در حاشیه مجمع عمومی سازمان ملل در نیویورک برگزار شد، به تماس‌های انجام‌شده با ایران از طریق میانجی‌ها اشاره کرد و گفت استیو ویتکاف، فرستاده ویژه او، و جرد کوشنر «دیداری بسیار سازنده» با میانجی‌های درگیر در رایزنی‌ها با ایران داشته‌اند. او ساعتی قبل در سخنرانی عمومی خود از دیدار استیو ویتکاف و جرد کوشنر با هیئت ایرانی خبر داده و گفته بود جلسه «سه ساعتهٔ» آن‌ها «بسیار سازنده بود». ساعاتی پس از این نشست، استیو ویتکاف در پیامی در شبکه ایکس جزئیات بیشتری درباره تماس‌های روز سه‌شنبه ارائه داد و تأکید کرد که گفت‌وگوهای دو طرف از طریق میانجی‌ها انجام شده است. او نوشت: «امروز در حاشیه مجمع عمومی سازمان ملل، از طریق میانجی‌ها گفت‌وگوهای طولانی با هیئت ایرانی داشتیم. میانجی‌ها در طول روز میان دو طرف در رفت‌وآمد بودند.» ویتکاف افزود: «آن‌ها با موفقیت یک دور از گفت‌وگوها را به پایان رساندند که امیدواریم سازنده و امیدبخش باشد. میانجی‌ها به تلاش‌های خود ادامه خواهند داد.» اسماعیل بقائی، سخنگوی وزارت خارجه ایران، نیز صبح چهارشنبه گفت این تعامل از طریق «میانجی قطری» صورت گرفته است. او مدعی شد هدف از این تماس‌ها «ابلاغ شروط ایران»"}, {"source": "Radio Farda", "title": "چهار سناتور آمریکایی خواهان اولویت‌دادن روبیو به «پیگیری آزادی رضا ولی‌زاده» شدند", "link": "https://www.radiofarda.com/a/us-senators-call-on-rubio-to-prioritize-release-of-ex-rfe-rl-journalist-held-in-iran/33861336.html", "summary": "چهار سناتور آمریکایی همزمان با دومین سالگرد حبس رضا ولی‌زاده در ایران، از وزارت خارجۀ ایالات متحده خواستند که پیگیری آزادی او را در اولویت فوری قرار دهد.", "date_str": "2026-09-22T20:15:44+00:00", "hash": "a58d9fdec9f071e2", "title_fa": "چهار سناتور آمریکایی خواهان اولویت‌دادن روبیو به «پیگیری آزادی رضا ولی‌زاده» شدند", "summary_fa": "چهار سناتور آمریکایی همزمان با دومین سالگرد حبس رضا ولی‌زاده در ایران، از وزارت خارجۀ ایالات متحده خواستند که پیگیری آزادی او را در اولویت فوری قرار دهد. چهار سناتور دموکرات و جمهوری‌خواه آمریکا با انتشار نامه‌ای خطاب به مارکو روبیو، وزیر خارجۀ ایالات متحده، از او خواستند که آزادی رضا ولی‌زاده شهروند ایرانی-آمریکایی و روزنامه‌نگار پیشین رادیو فردا از زندان جمهوری اسلامی را «با اولویت ویژه» پیگیری کند. برایان شَتز و جکی روزِن سناتورهای دموکرات هاوایی و نوادا، و مارشا بلَک‌برن و دیوید مک‌کورمیک سناتورهای جمهوری‌خواه تنسی و پنسیلوانیا امضاکنندگان این نامه بودند که روز سه‌شنبه ۳۱ شهریورماه، همزمان با دومین سالگرد حبس رضا ولی‌زاده منتشر شد. این چهار سناتور در این نامه‌ نوشته‌اند: «ما خواهان این هستیم که آزادی و شرایط مناسب رضا ولی‌زاده، از طریق همۀ کانال‌های دیپلماتیک موجود با مقام‌های ایرانی دنبال شود». رضا ولی‌زاده از دو سال پیش در ایران زندانی است و دورۀ محکومیت ۱۰ سالۀ خود را طی می‌کند. او به جرم «همکاری با کشور متخاصم» محکوم به ۱۰ سال حبس شد. وزارت خارجۀ ایالات متحده، ضمن محکوم کردن بازداشت این روزنامه‌نگار، این اقدام را «اشتباه و ناعادلانه» خوانده است. رضا ولی‌زاده به م ها در آینده خیلی نزدیک جلسه دیگری نیز خواهند داشت.» عباس عراقچی، وزیر خارجه ایران، در نیویورک حضور دارد و مسعود پزشکیان، رئیس‌جمهور ایران، نیز در مسیر رسیدن به این شهر برای شرکت در مجمع عمومی سازمان ملل است. رئیس‌جمهور ایالات متحده کمی پیش از آن در دیدار با اندی برنهام، نخست‌وزیر بریتانیا، در حاشیه مجمع عمومی سازمان ملل متحد در نیویورک اعلام کرد که ایران و آمریکا با یکدیگر در حال گفت‌وگو هستند و او معتقد است دو کشور در مقطعی به توافق خواهند رسید. او افزود: «آنها می‌خواهند با ما گفت‌وگو کنند. آنها با ما در حال گفت‌وگو بوده‌اند و حتی امروز نیز با ما صحبت کرده‌اند و این رابطه در حال شکل‌گیری است.» ترامپ ادامه داد: «اما ما نمی‌توانیم اجازه دهیم آنها به سلاح هسته‌ای دست پیدا کنند؛ خودشان هم این را درک می‌کنند.» ساعتی بعد،‌ خبرگزاری صداوسیما دیدار عراقچی با ویتکاف را تأیید کرد و مدعی شد این دیدار با «اصرار نماینده آمریکا» انجام شد."}],
      tech: [{"source": "MIT AI", "title": "Poitras Center to fuel early careers of 50 young scientists dedicated to psychiatric disorders research", "link": "https://news.mit.edu/2026/poitras-center-to-fuel-early-careers-50-young-scientists-psychiatric-disorders-research-0922", "summary": "Patricia and James Poitras ’63, longtime MIT supporters, have launched a fellowship program for graduate students and postdocs studying major mental illness, expanding their MIT philanthropy to directly support early-career scientists. The commitment establishes 50 two-year fellowships through the Poitras Center for Psychiatric Disorders Research at MIT’s McGovern Institute for Brain Research. Five fellowships will be awarded every year for the next decade, creating a long-term talent pipeline focused specifically on psychiatric disorders. The $10 million gift is the latest in a series of philanthropic investments from the Poitras family to strengthen MIT’s capacity to address the growing burden of severe depression and anxiety, bipolar disorder, schizophrenia, and other complex psychiatric conditions. “Pat and Jim have remained steadfast in their decades-long commitment to bold research that can transform mental wellness,” says Robert Desimone, director of the McGovern Institute and head of the Poitras Center. “Their remarkable support of rising talent in the MIT ecosystem is yet another emblem of their commitment to that cause.” A philanthropic legacy Many recent mental health discoveries emerging from MIT — from molecular tools that can rewrite DNA to artificial intelligence-powered technologies that can calculate a person’s risk for developing mental illness — were hard to imagine two decades ago. Yet, Patricia and James Poitras envisioned a future where enigmatic mental health conditions could be solved. They understood this future would require not just research, but a fundamental reimagining of how psychiatric research itself is conducted. In 2007, inspired by meetings with leadership at the McGovern Institute, the Poitras Family gifted $20 million to launch the Poitras Center . By bridging the fields of basic neuroscience, clinical psychiatry, and molecular biology, the center sought to establish a unified blueprint for understanding how psychiatric disorders hijack the mind at every level, from molecular mechanisms to whole brain systems, and guide the creation of novel therapies to better treat them. Since the center’s establishment, additional investments by the Poitras family have supported research ranging from genome engineering to cognitive neuroscience. These investments have empowered scientists across disciplines to pursue innovative research questions, including how ketamine acts on synaptic communication and why schizophrenia distorts i", "date_str": "2026-09-22T19:00:00+00:00", "hash": "c2ecdcd1378ec2fd", "title_fa": "مرکز پویتراس برای ایجاد مشاغل اولیه 50 دانشمند جوان که به تحقیقات مربوط به اختلالات روانپزشکی اختصاص یافته اند", "summary_fa": "پاتریشیا و جیمز پویتراس 63، حامیان قدیمی MIT، یک برنامه کمک هزینه تحصیلی را برای دانشجویان فارغ التحصیل و فوق دکترا که در حال مطالعه بیماری های روانی عمده هستند، راه اندازی کرده اند، و کمک های بشردوستانه MIT خود را برای حمایت مستقیم از دانشمندان اولیه حرفه ای گسترش می دهند. این تعهد 50 بورسیه دو ساله را از طریق مرکز تحقیقات اختلالات روانی پویتراس در موسسه تحقیقات مغز مک گاورن MIT ایجاد می کند. پنج بورسیه هر ساله برای دهه آینده اعطا می شود و یک خط لوله استعدادهای بلند مدت ایجاد می کند که به طور خاص بر اختلالات روانپزشکی متمرکز است. این هدیه 10 میلیون دلاری آخرین مورد از یک سری سرمایه گذاری های بشردوستانه از سوی خانواده پویتراس برای تقویت ظرفیت MIT برای مقابله با بار فزاینده افسردگی و اضطراب شدید، اختلال دوقطبی، اسکیزوفرنی و سایر شرایط پیچیده روانپزشکی است. رابرت دیسیمون، مدیر مؤسسه مک گاورن و رئیس مرکز پویتراس، می‌گوید: «پت و جیم در تعهد چند دهه‌ای خود به تحقیقات جسورانه‌ای که می‌تواند سلامت روانی را تغییر دهد، ثابت قدم مانده‌اند. \"حمایت قابل توجه آنها از استعدادهای رو به رشد در ا  مشمول اقدامات حفاظتی مشابه مدل Fable این شرکت است. این پادمان‌ها میزان استفاده از مدل‌ها را برای کشف اکسپلویت‌ها در برنامه‌های کامپایل‌شده یا توسعه سلاح‌های بیولوژیکی"}, {"source": "TechCrunch AI", "title": "AstroForge is putting AI in command of its next spacecraft", "link": "https://techcrunch.com/2026/09/22/astroforge-is-putting-ai-in-command-of-its-next-spacecraft/", "summary": "Autonomy-1 will have a small, transformer-based AI model taking charge of a space probe.", "date_str": "2026-09-22T15:00:00+00:00", "hash": "86b33958c1e7fe4d", "title_fa": "AstroForge هوش مصنوعی را فرماندهی فضاپیمای بعدی خود می کند", "summary_fa": "Autonomy-1 یک مدل هوش مصنوعی کوچک مبتنی بر ترانسفورماتور خواهد داشت که مسئولیت یک کاوشگر فضایی را بر عهده خواهد گرفت. به یک سیارک پرواز کنید، روی آن فرود بیایید، اشتباه نکنید: اگر به همین راحتی بود. هنگامی که ناسا فضاپیماها را برای کاوش در منظومه شمسی می فرستد، آنها به صورت اضافی و خودکار می سازند. اما بیشتر کار توسط تیم هایی از کنترلرهای پرواز انجام می شود که از زمین با وسیله نقلیه در ارتباط هستند. ماموریت OSIRIS-REx که در سال 2018 با یک سیارک ملاقات کرد، 100 اپراتور در هر شیفت هشت ساعته داشت. اما منابعی مانند آن برای استارت‌آپ‌ها در دسترس نیستند، بنابراین AstroForge، که در حال توسعه فناوری برای استخراج سیارک‌ها است، به هوش مصنوعی روی آورده است. این شرکت یک پشته کنترل مستقل برای فضاپیمای خود به نام Solo، یک مدل مبتنی بر ترانسفورماتور ساخته شده در داخل، توسعه داده است. AstroForge قصد دارد اولین فضاپیمای خودران خود را در سال 2027 با اولین موشک پرتاب شده توسط استوک اسپیس به پرواز درآورد. این ماموریت توسط ناسا پشتیبانی می شود و انتظار می رود داده های علمی در مورد خورشید جمع آوری کند. این یک دستاورد خواهد بود: بیشتر استقلال فضاپیماها به دلیل نگرانی در مورد غیرقابل اطمینان بودن شبکه های عصبی به الگوریتم های کنترل سنتی بستگی دارد. اولین استفاده از شبکه عصبی برای کنترل موقعیت ماهواره در مدار در سال گذشته انجام شد. AstroForge، که در سال 2022 تأسیس شد و با 56 میلیون دلار سرمایه گذاری مخاطره‌آمیز حمایت می‌شود، دو نمونه اولیه فضاپیمای فضایی را به فضا پرتاب کرده است که هر دو از ناهنجاری‌هایی رنج می‌برند که آنها را از دستیابی به بیشتر اهداف مأموریت خود باز می‌دارد. در سال 2025، فضاپیمای Odin آن به اعماق فضا پرتاب شد، اما این شرکت در برقراری ارتباط با آن مشکل داشت. تعداد"}, {"source": "TechCrunch AI", "title": "Five AI safety sessions every founder should have on their TechCrunch Disrupt 2026 agenda", "link": "https://techcrunch.com/2026/09/22/five-ai-safety-sessions-every-founder-should-have-on-their-techcrunch-disrupt-2026-agenda/", "summary": "At TechCrunch Disrupt 2026, five sessions across the AI Stage and Real World AI Stage cover AI safety, featuring leaders from Anthropic, Nvidia, AWS, Waabi, and more. Register before September 25 to save up to $200.", "date_str": "2026-09-22T15:00:00+00:00", "hash": "0d08f07a6c7e57b4", "title_fa": "پنج جلسه ایمنی هوش مصنوعی که هر بنیانگذار باید در دستور کار TechCrunch Disrupt 2026 داشته باشد", "summary_fa": "آیا به یک عامل هوش مصنوعی برای دسترسی به سیستم های شرکت خود اعتماد دارید؟ کارکنان خود را در یک وسیله نقلیه خودران قرار دهید؟ رباتی را مستقر کنید که باید دنیای فیزیکی غیرقابل پیش بینی را درک کند؟ اینها دیگر سؤالات فرضی برای بنیانگذاران هوش مصنوعی نیستند. همانطور که هوش مصنوعی از دموها خارج می شود و وارد مشاغل، وسایل نقلیه، روبات ها و عوامل مستقل می شود، ایمنی و امنیت بخشی از محصول می شود. برخی از شرکت ها ارزش قابل اندازه گیری را از هوش مصنوعی دریافت می کنند. برخی دیگر هنوز 18 ماه بعد خلبان هستند. چرا؟ Anthropic Head of Applied AI Cat de Jong یک نمای نزدیک دریافت می کند. او مستقیماً با شرکت‌هایی کار می‌کند که کلود را در جریان‌های کاری حیاتی قرار می‌دهند و می‌بیند که استقرارها در کجا موفق می‌شوند، کجا متوقف می‌شوند و چه چیزی این دو را از هم جدا می‌کند. در «آنتروپیک چه می‌بیند وقتی شرکت‌ها واقعاً کلود را مستقر می‌کنند»، دی جونگ در مرحله هوش مصنوعی شرکت می‌کند تا ببیند وقتی شرکت‌ها از آزمایش هوش مصنوعی به تولید آن می‌روند چه اتفاقی می‌افتد. برای بنیان‌گذارانی که تلاش می‌کنند هوش مصنوعی را به شرکت بفروشند، تجربه او نگاهی مستقیم به این موضوع دارد که چرا برخی از استقرارها ارزش واقعی ارائه می‌دهند در حالی که برخی دیگر در حالت آزمایشی گیر کرده‌اند. یک عامل هوش مصنوعی که بتواند اقدامی انجام دهد نیز می تواند مجموعه ای کاملاً جدید از مشکلات امنیتی ایجاد کند. به چه چیزی باید دسترسی داشته باشد؟ چه کاری باید انجام دهد؟ و وقتی مجوزهای سطح برنامه کافی نباشد چه اتفاقی می‌افتد؟ در جلسه مرحله هوش مصنوعی «مشکل امنیت عامل هیچ‌کس درباره‌اش صحبت نمی‌کند»، ریک اسمیت، رئیس بخش محصولات و فناوری Okta و گاوریل کوهن، بنیان‌گذار و مدیر عامل شرکت NanoCo، به امنیت عامل در سطح"}, {"source": "NYT Tech", "title": "I Gave My Life Over to Meta’s A.I. Agent and Was Blown Away", "link": "https://www.nytimes.com/2026/09/22/technology/meta-muse-ai-agent.html", "summary": "Muse, Meta’s A.I. agent, helped handle my dental insurance, booked dinner reservations and created a podcast for me. It also required my most personal data, and trust.", "date_str": "2026-09-22T19:24:41+00:00", "hash": "b409f87794b5d833", "title_fa": "من زندگیم را به A.I متا سپردم. مامور و منفجر شد", "summary_fa": "Muse، Meta’s A.I. نماینده، به رسیدگی به بیمه دندانپزشکی من کمک کرد، رزرو شام را رزرو کرد و یک پادکست برای من ایجاد کرد. همچنین به بیشترین اطلاعات شخصی و اعتماد من نیاز داشت."}, {"source": "NYT Tech", "title": "An A.I. Image of Trump Kissing a Woman Was Fake. It Spread Anyway.", "link": "https://www.nytimes.com/2026/09/22/business/trump-natalie-harp-photo-ai.html", "summary": "Advances in artificial intelligence and the myriad ways content is shared online have made establishing authenticity even more difficult for users of social media.", "date_str": "2026-09-22T18:37:12+00:00", "hash": "0ada50001769ded5", "title_fa": "یک A.I. تصویر ترامپ در حال بوسیدن یک زن جعلی بود. به هر حال پخش شد.", "summary_fa": "پیشرفت در هوش مصنوعی و روش های بی شماری که محتوا به صورت آنلاین به اشتراک گذاشته می شود، ایجاد اصالت را برای کاربران رسانه های اجتماعی دشوارتر کرده است."}, {"source": "NYT Tech", "title": "Anthropic Releases a New A.I. Model, Opus 5.5, Amid Safety Debate", "link": "https://www.nytimes.com/2026/09/ ntinue reading...", "date_str": "2026-09-23T14:18:27+00:00", "hash": "aa502f260258558c", "title_fa": "وزارت دادگستری آمریکا از ممنوعیت حضور خبرنگاران در کاخ سفید قبل از جلسه دادگاه - به صورت زنده - دفاع می کند", "summary_fa": "وزارت دادگستری ترامپ می گوید دسترسی به کاخ سفید \"یک امتیاز است، نه یک حق\". سی‌ان‌ان، پولیتیکو و ام‌اس حالا پس از ممنوعیت انتشار رسانه‌ها از کاخ سفید توسط رئیس‌جمهور، پرونده خود را در دادگاه مطرح می‌کنند وقایع کلیدی 42 میلیون پیش تهدید ترامپ برای نابودی ایران به مجمع عمومی سازمان ملل حتی برای او خیره‌کننده است - تحلیل 1 ساعت پیش دولت ترامپ تصمیم گرفت از ممنوعیت مطبوعاتی خود در کاخ سفید در دادگاه دفاع کند. «یک امتیاز، نه یک حق»، برندها یک خطر امنیتی را پوشش می‌دهند 3 ساعت پیش ترامپ برای دیدار با شی چین در حالی که کنگره لایحه ممنوعیت ابر هوش مصنوعی را بررسی می‌کند از 2 ساعت پیش در یک پرونده حقوقی جدید در پرونده سه رسانه جدید ممنوع شده به کاخ سفید، وزارت دادگستری دولت ترامپ مکرراً از دسترسی روزنامه‌نگاران به ساختمان‌های رئیس‌جمهور دفاع نکرد. در این پرونده آمده است: «دسترسی به کاخ سفید یک امتیاز است، نه یک حق. این پرونده در ادامه تاکید کرد که این سه رسانه - با انتشار اطلاعات حساس یا طبقه بندی شده که از طریق گزارش آنها به دست آمده است - یک تهدید امنیت ملی محسوب می شود و به رئیس جمهور این حق را می دهد که از اعتبارنامه خود سلب کند. ترامپ جمعه گذشته در تصمیمی فوری که از طریق رسانه‌های اجتماعی اعلام شد، سه شبکه CNN، MS Now و Politico را ممنوع کرد. او این سه رسانه را «اخبار جعلی» نامید و تهدید کرد که ممکن است در آینده ممنوعیت‌هایی علیه سایر رسانه‌ها اعمال شود. در اوایل هفته بعد، این سه نشریه با طرح دعوی مشترک از یک قاضی فدرال خواستند که دسترسی آنها را بازگرداند و ادعا کردند که این اقدام یک اقدام غیرقانونی تلافی جویانه است که حقوق متمم اول آنها را نقض می کند. آنها در شکایت خود استدلال"}, {"source": "The Guardian AI", "title": "New UK agency to fight ‘information warfare’ from likes of Russia, Burnham tells UN", "link": "https://www.theguardian.com/technology/2026/sep/23/andy-burnham-national-centre-russian-disinformation-deepfakes", "summary": "PM aims to ‘stem poisonous tide’ of disinformation and deepfakes with National Centre for Information Defence Security chiefs will set up a new national centre to tackle disinformation and deepfakes from hostile states such as Russia, Andy Burnham has announced, saying the government had a duty to “stem the poisonous tide” from damaging British interests. The National Centre for Information Defence will “detect, attribute and disrupt” information attacks by foreign powers, many of which are enabled by AI , bringing together the intelligence agencies, law enforcement and social media companies. Continue reading...", "date_str": "2026-09-23T07:52:20+00:00", "hash": "d9191564a30ac372", "title_fa": "برنهام به سازمان ملل می‌گوید آژانس جدید بریتانیا برای مبارزه با «جنگ اطلاعاتی» مانند روسیه", "summary_fa": "اندی برنهام اعلام کرد که نخست‌وزیر قصد دارد با کمک مرکز ملی دفاع اطلاعات، «جنوب سمی» اطلاعات نادرست را متوقف کند و گفت که دولت موظف است از آسیب رساندن به منافع بریتانیا «جند سمی» را متوقف کند. مرکز ملی دفاع از اطلاعات حملات اطلاعاتی توسط قدرت‌های خارجی را که بسیاری از آنها توسط هوش مصنوعی فعال شده‌اند، شناسایی، نسبت داده و مختل می‌کند و سازمان‌های اطلاعاتی، مجری قانون و شرکت‌های رسانه‌های اجتماعی را گرد هم می‌آورد. به خواندن ادامه دهید... وظیفه آن این است که اطمینان حاصل کند که بریتانیا از توانایی دفاعی لازم برای مبارزه با جنگ اطلاعاتی و ایجاد انعطاف‌پذیری ملی با کمک به جوامع برای شناسایی و مبارزه با اطلاعات نادرست، جلوگیری از روایت «تحریف‌شده و نادرست» درباره بریتانیا برخوردار است. برنهام گفت که کشور باید در دهه آینده «چشم‌های باز» در مورد کمپین‌های «موذیانه» که بسیاری از آنها توسط روسیه سازماندهی شده بودند، که احساسات مردم در خانه درباره کشور و جامعه خود را «پیچانده» می‌کردند. در اظهارات چشم نواز، نخست وزیر پیشنهاد کرد که بریتانیایی هایی که با هزینه های زندگی دست و پنجه نرم می کنند و جوانانی که در تحصیل، آموزش یا اشتغال نیستند، ممکن است به ویژه در معرض نفوذ خارجی آنلاین باشند، و تاکید کرد که چگونه نابرابری بیشتر جامعه را تضعیف می کند. برنهام در سخنرانی سه‌شنبه شب خود در سازمان ملل در نیویورک گفت: «ما در مورد یک کمپین موذیانه صحبت می‌کنیم که به خانه‌های مردم نفوذ می‌کند و احساسات آنها را در مورد کشور و جامعه خود تغییر می‌دهد - روایتی از زوال، دامن زدن به تفرقه و کاشتن ناامیدی."}, {"source": "The Guardian AI", "title": "How would AI actually ‘kill all humans’? Here are the top five most likely scenarios | Toby Walsh", "link": "https://www.theguardian.com/australia-news/commentisfree/2026/sep/23/how-would-ai-actually-kill-all-humans-here-are-the-top-five-most-likely-scenarios", "summary": "From a dangerous new bioweapon to total societal breakdown, is a ‘superintelligent’ AI capable of wiping out humanity? Earlier this month, artificial intelligence researcher Jacob Coxon resigned from Anthropic after just four months. In an announcement on X, he stated : “The people building AI earnestly believe that it could kill us all by the end of the decade.” A senior member of Anthropic’s staff, Evan Hubinger, actually agreed with Coxon, adding he personally thinks the chance of this happening in the next decade is more than 10% . Continue reading...", "date_str": "2026-09-23T00:51:57+00:00", "hash": "4e2169bf282d2e0e", "title_fa": "چگونه هوش مصنوعی «همه انسان ها را می کشد»؟ در اینجا پنج مورد محتمل ترین سناریو | توبی والش", "summary_fa": "آیا یک هوش مصنوعی «فوق‌هوشمند» می‌تواند بشریت را از بین ببرد؟ در اوایل ماه جاری، جاکوب کوکسون، محقق هوش مصنوعی، پس از تنها چهار ماه از آنتروپیک استعفا داد. در اطلاعیه‌ای در X، او اظهار داشت: «افرادی که هوش مصنوعی می‌سازند، عمیقاً معتقدند که می‌تواند تا پایان دهه همه ما را بکشد.» یکی از اعضای ارشد کارکنان آنتروپیک، ایوان هوبینگر، در واقع با کاکسون موافق بود و اضافه کرد که او شخصا فکر می‌کند که احتمال این اتفاق در دهه آینده بیش از 10 درصد است. به خواندن ادامه دهید... اوایل این ماه، محقق هوش مصنوعی جاکوب کوکسون تنها پس از چهار ماه از آنتروپیک استعفا داد. در اطلاعیه‌ای در X، او اظهار داشت: «افرادی که هوش مصنوعی می‌سازند، عمیقاً معتقدند که می‌تواند تا پایان دهه همه ما را بکشد.» قابل درک است که این اظهارات موج زد. اکنون دند. ویژگی جدید یوتیوب همچنین پلتفرم را مستقیماً در رقابت با مجموعه رو به رشدی از برنامه های میکرودرام قرار می دهد. TikTok اخیراً PineDrama را راه‌اندازی کرده است، اپلیکیشن میکرودرام خود، در حالی که سایرین مانند ReelShort و DramaBox نیز محبوبیت خود را افزایش داده‌اند."}, {"source": "TechCrunch Main", "title": "YouTube adds new creator tools like video A/B testing, dynamic thumbnails, and live dubbing", "link": "https://techcrunch.com/2026/09/23/youtube-adds-new-creator-tools-like-video-a-b-testing-dynamic-thumbnails-and-live-dubbing/", "summary": "Many of these tools hinge on using generative AI to try out a variety of different tactics on a video to find what works best.", "date_str": "2026-09-23T14:30:00+00:00", "hash": "8bb78dcf67f179aa", "title_fa": "یوتیوب ابزارهای ایجادکننده جدیدی مانند تست ویدیوی A/B، تصاویر کوچک پویا و دوبله زنده اضافه می‌کند.", "summary_fa": "بسیاری از این ابزارها وابسته به استفاده از هوش مصنوعی مولد برای آزمایش انواع تاکتیک های مختلف در یک ویدیو هستند تا بهترین کار را پیدا کنند. در تلاشی برای کمک به سازندگان برای دسترسی بیشتر به افراد، یوتیوب روز چهارشنبه از مجموعه‌ای از ابزارهای جدید رونمایی کرد که بسیاری از آنها از هوش مصنوعی برای آزمایش تاکتیک‌های مختلف روی ویدیوها استفاده می‌کنند تا بهترین عملکرد را پیدا کنند. ویژگی جدید Ask Studio به سازندگان اجازه می‌دهد تا ویدیوهای پیش‌نویس را با هوش مصنوعی به اشتراک بگذارند تا بازخورد شخصی‌شده بر اساس محتوای قبلی و نظرات کاربران دریافت کنند. این ویژگی عناوین جایگزین و گزینه‌های ریز پیشنهاد می‌کند، تجزیه و تحلیل کانال سازنده را برای توضیح عملکرد ویدیوهای آن‌ها تجزیه و تحلیل می‌کند و توصیه‌هایی برای بهبود معیارها ارائه می‌دهد. Ask Studio در حال گسترش به برنامه های تلفن همراه YouTube است. YouTube در حال حاضر به سازندگان اجازه می‌دهد تا عناوین و تصاویر کوچک A/B را آزمایش کنند و از سال ۲۰۲۷، این ویژگی به سازندگان اجازه می‌دهد سه برش مختلف را برای Shorts آپلود و آزمایش کنند. همچنین یک ویژگی Dynamic Thumbnails وجود دارد که با استفاده از آن سازندگان می‌توانند چندین تصویر کوچک را آپلود کنند و آن را به YouTube بسپارند تا تعیین کند کدام تصویر کوچک را به بینندگان نشان دهد که احتمالاً علاقه آنها را برانگیزد. سازندگان همچنین می توانند این ابزارها را در کاتالوگ موجود خود اعمال کنند. اگر سازنده اجازه دهد، Ask Studio می‌تواند به‌طور مستقل عملکرد تصاویر کوچک را نظارت کند و آزمایش‌هایی را برای اصلاح ویدیوهای قدیمی‌تر ایجاد کند. در بخش خرید، یوتیوب اکنون از هوش مصنوعی برای برچسب‌گذاری خودکار محصولات استفاده می‌کند که می‌گوید به سازندگان کمک می‌کند از طریق برنامه‌های وابسته کسب درآمد کنند. این شرکت همچنین در حال گسترش برنامه وابسته به آمازون خود به خارج از"}, {"source": "TechCrunch Main", "title": "Here’s the trailer for Nathan Fielder’s Elizabeth Holmes documentary, in theaters October 16", "link": "https://techcrunch.com/2026/09/23/heres-the-trailer-for-nathan-fielders-elizabeth-holmes-documentary-in-theaters-october-16/", "summary": "In this cursed timeline, we have been gifted with something so unfathomable that we could never have imagined it.", "date_str": "2026-09-23T14:21:41+00:00", "hash": "03961e6bf76be8f6", "title_fa": "در اینجا تریلر مستند الیزابت هلمز به کارگردانی ناتان فیلدر است که در تاریخ 16 اکتبر در سینماها عرضه می شود.", "summary_fa": "در این جدول زمانی نفرین شده، چیزی به قدری غیرقابل درک به ما هدیه داده شده است که هرگز نمی توانستیم آن را تصور کنیم. ما در دوران گیج‌کننده‌ای زندگی می‌کنیم، جایی که قدرتمندترین افراد جهان تلاش می‌کنند خود را سایبورگ بسازند، مرگ اجتناب‌ناپذیر را غلبه کنند و فضای بیرون را مستعمره کنند. اما در بحبوحه چنین برهه‌ای از تاریخ بشریت، دنیا استخوان شما را پرت می‌کند. در این جدول زمانی نفرین شده، چیزی به قدری غیرقابل درک به ما هدیه داده شده است که هرگز نمی‌توانستیم آن را تصور کنیم، زیرا حتی در وحشی‌ترین رویاهایمان هم نمی‌توانستیم چیزی به این عالی بیاوریم: یک مستند ناتان فیلدر درباره الیزابت هلمز. برای افراد ناآشنا، ناتان فیلدر یک فیلمساز و کمدین است که به دلیل توانایی عجیبش در قرار دادن خود در موقعیت‌های ناخوشایند شناخته می‌شود، اما آنقدر در شخصیت باقی می‌ماند که هرکس را که درگیر می‌کند، حتی تماشاگر را مجبور می‌کند تا در مورد جوهر وجود خود فکر کند. و سپس الیزابت هولمز، بنیانگذار استارتاپی شرم آور Theranos که هنوز انکار می کند کار اشتباهی انجام داده است، و جهان را به این سوال وا می دارد که آیا او واقعاً اینقدر ساده لوح است، یا آیا او هنوز در حال انجام یک بازی شطرنج 5 بعدی است که هیچ یک از ما در آن ثبت نام نکرده ایم. ما برای برخورد این دو آماده نیستیم، اما یقه های یقه اسکی سیاه خود را برای نمایش آماده کنید، زیرا مستند حاصل از A24، You Can See Everything، در تاریخ 16 اکتبر به سینماها می آید. وقتی از طریق پیوندهای موجود در مقالات ما خرید می کنید، ممکن است کمیسیون کمی کسب کنیم. این بر استقلال تحریریه ما تأثیر نمی گذارد. آماندا سیلبرلینگ یک نویسنده ارشد در TechCrunch است که تقاطع فناوری و فرهنگ را پوشش می دهد. او همچنین برای"}, {"source": "TechCrunch Main", "title": "LinkedIn adds new tools to fight fake profiles and bogus work histories", "link": "https://techcrunch.com/2026/09/23/linkedin-adds-new-tools-to-fight-fake-profiles-and-bogus-work-histories/", "summary": "LinkedIn is rolling out new verification tools that let members vouch for colleagues’ work experience and give companies more control over accounts that falsely claim to employ them.", "date_str": "2026-09-23T13:00:00+00:00", "hash": "5986e8b4fec0caad", "title_fa": "لینکدین ابزار جدیدی برای مبارزه با پروفایل های جعلی و سابقه کاری جعلی اضافه می کند", "summary_fa": "لینکدین ابزارهای تأیید جدیدی را ارائه می‌کند که به اعضا اجازه می‌دهد تجربه کاری همکاران را تضمین کنند و به شرکت‌ها کنترل بیشتری بر حساب‌هایی که به دروغ ادعای استخدام آنها را دارند، می‌دهد. هوش مصنوعی ایجاد حساب‌ها و هویت‌های جعلی را برای افراد برای دستکاری آنلاین و کلاهبرداری آسان‌تر کرده است. روز چهارشنبه، لینکدین مجموعه جدیدی از ابزارها را برای مبارزه با این مشکل معرفی کرد و در عین حال به مردم و شرکت ها کمک کرد تا حضور خود را در این پلتفرم بهتر کنترل کنند. این شرکت می‌گوید اکنون به اعضا اجازه می‌دهد تجربه یکدیگر را تضمین کنند و به کسب‌وکارها کنترل‌های جدیدی را برای مدیریت افرادی که با برندشان مرتبط هستند، از جمله تغییرات دیگر، می‌دهد. ویژگی‌های جدید در زمانی به دست می‌آیند که جعل هویت به یک مشکل در سراسر اینترنت تبدیل شده است، نه محدود به لینکدین. با این حال، در شبکه‌ای که شخصیت حرفه‌ای شما شامل تجربه کاری، عناوین شغلی گذشته، گواهینامه‌ها، مدارک دانشگاهی و موارد دیگر می‌شود، این که بتوانید تأیید کنید که فردی هستید که می‌گویید هستید بسیار مهم‌تر است. چنین ادعاهایی می‌تواند منجر به فرصت‌های شغلی و پیشرفت شود، چشم‌اندازهایی که کسانی که در رزومه‌شان دروغ می‌گویند یا دروغ می‌گویند، به دست نیاورده‌اند. پس زمینه همه اینها این است که اعتبار جعلی هرگز ارزانتر یا آسانتر از امروز نبوده است. اسکار رودریگز، معاون LinkedIn در بخش محصول، در مصاحبه ای با TechCrunch گفت و برعکس، نشان دادن اعتبار هرگز مهم نبوده است. وی خاطرنشان کرد: تا به امروز، ابزارهای تأیید فعلی لینکدین برای تأیید 115 میلیون کاربر و بیش از 700000 شرکت در این پلتفرم استفاده شده است. رودریگز افزود: ما روی [تأیید] سرمایه گذاری کرده ایم، زیرا معتقدیم اصالت تنها با ارزش ترین ارز در اینترنت خواهد بود."}, {"source": "TechCrunch Main", "title": "PitPro’s first tire-changing robot goes live in Canada", "link": "https://techcrunch.com/2026/09/23/pitpros-first-tire-changing-robot-goes-live-in-canada/", "summary": "The startup says its automated system can change four tires in under 15 minutes.", "date_str": "2026-09-23T13:00:00+00:00", "hash": "d8282f36450348b8", "title_fa": "اولین ربات تعویض لاستیک PitPro در کانادا راه اندازی شد", "summary_fa": "این استارت آپ می گوید سیستم خودکار آن می تواند چهار لاستیک را در کمتر از 15 دقیقه عوض کند. اگر در کانادا زندگی می کنید، مجموعه لاستیک های برفی امسال ممکن است توسط یک ربات نصب شود. استارت‌آپ PitPro Automation از سانفرانسیسکو روز چهارشنبه اعلام کرد که اولین سیستم تعویض لاستیک خودکار خود را در یک فروشگاه تایر در کلگری، آلبرتا نصب کرده است. این استارت‌آپ می‌گوید سیستم رباتیک آن که اولین بار سال گذشته معرفی شد، می‌تواند مجموعه کاملی از چهار تایر را در کمتر از 15 دقیقه تعویض کند. اولین استقرار در محل Kal Tire یکی از بزرگترین زنجیره های خدمات تایر مستقل کانادا است. PitPro یکی از بی‌شماری استارت‌آپ است که تلاش می‌کند بخش‌های مختلف تجربه مالکیت خودرو را مختل کند. در حالی که جرمی کنراد موسس و مدیر عامل شرکت TechCrunch به TechCrunch گفت که در نهایت می‌خواهد به انواع دیگر تعمیر و نگهداری خودکار حرکت کند، او فکر می‌کند فرصت بزرگی برای ایجاد یک کسب‌وکار با لاستیک‌ها در آینده نزدیک وجود دارد. او در مصاحبه ای گفت که تعویض لاستیک ها کار کمرشکن است و لاستیک فروشی ها با کمبود عمده نیروی کار مواجه هستند. او گفت حتی زمانی که مغازه ها می توانند افرادی را برای این کار پیدا کنند، این کارگران اغلب در عرض چند ماه تا یک سال کار را ترک می کنند. او گفت که یکی از مدیران مغازه به من می گفت که باید مجوز ویژه ای برای پرداخت بیشتر دریافت کنند زیرا یک پاندا اکسپرس در آن طرف خیابان باز شد و حدود نیمی از کارمندان آنها را گرفت. سیستم PitPro به گونه ای طراحی شده است که مستقیماً به سمت محل نگهداری موجود می رود. دارای دو ربات جعبه‌ای است که هر کدام تقریباً به اندازه یک فر هستند که از ترکیبی از حسگرها و یک بازوی"}, {"source": "TechCrunch Main", "title": "Comma’s hands-off driving tech under investigation after 2 fatal crashes", "link": "https://techcrunch.com/2026/09/23/commas-hands-off-driving-tech-under-investigation-after-2-fatal-crashes/", "summary": "The investigation involves at least some crashes where it appears drivers were using \"forked\" versions of Comma's software.", "date_str": "2026-09-23T12:12:39+00:00", "hash": "8f6e3da483b9b948", "title_fa": "فناوری رانندگی دست‌آف کاما پس از 2 تصادف مرگبار در دست بررسی است", "summary_fa": "این تحقیقات حداقل شامل برخی از تصادفات است که به نظر می رسد رانندگان از نسخه های \"چنگال\" نرم افزار ویرگول استفاده می کردند. Comma.ai، استارت آپی که توسط هکر جورج هاتز تأسیس شده است، پس از پنج تصادف گزارش شده مربوط به فناوری کمک راننده دستی در بازار پس از فروش شرکت که دو مورد از آنها منجر به کشته شدن سه نفر شد، با تحقیقات فدرال مواجه است. اداره ملی ایمنی ترافیک بزرگراه، دفتر بررسی عیوب (ODI) این هفته گفت که تصادفات گزارش شده مربوط به این است که دستگاه های Comma.ai در شناسایی یا پاسخگویی به خودروهای کند یا متوقف شده در همان خط جاده ناکام هستند. در چهار مورد از تصادفات، 11 نفر مجروح شدند که حال برخی از آنها وخیم است. به گفته ODI، برخی از تصادفات، از جمله حداقل یکی از حوادث مرگبار، ممکن است شامل استفاده از نسخه های فورک شده یا اصلاح شده نرم افزار Comma.ai باشد. Comma.ai فوراً برای اظهار نظر در دسترس نیست. هاتز که در سال 2022 از فعالیت های روزانه استارتاپ فاصله گرفت، بلافاصله درخواستی برای اظهار نظر نداد. Comma.ai که در سال 2015 تأسیس شد، دستگاه هایی را می سازد که می توانند روی طیف وسیعی از اتومبیل های مدرن نصب شوند. طبق وب‌سایت استارت‌آپ، این دستگاه‌ها - و نرم‌افزار Comma.ai، openpilot - می‌توانند سیستم‌های کروز کنترل تطبیقی ​​(ACC) و مرکز محور خودکار (ALC) خودرو را برای انجام عملکردهایی شبیه به تسلا خودکار و GM Super Cruise کنترل کنند. هدف این است که رانندگی را خنک کنیم. وب‌سایت Comma.ai ادعا می‌کند که openpilot می‌تواند برای سایر وسایل نقلیه داخل خط خود به طور خودکار هدایت، شتاب و ترمزگیری کند. با این حال، مانند تسلا و جنرال موتورز، Comma.ai به رانندگان هشدار می دهد که همیشه باید بتوانند بلافاصله کنترل دستی وسیله نقلیه را با پا گذاشتن روی"}, {"source": "TechCrunch Main", "title": "Discord’s age-verification era is upon us, despite community backlash", "link": "https://techcrunch.com/2026/09/22/discords-age-verification-era-is-upon-us-despite-community-backlash/", "summary": "According to Discord, 90% of users will not have to verify their age.", "date_str": "2026-09-23T03:31:12+00:00", "hash": "e3059938f3e2a91a", "title_fa": "دوران تأیید سن Discord، علیرغم واکنش منفی جامعه، فرا رسیده است", "summary_fa": "طبق گفته Discord، 90 درصد از کاربران مجبور نیستند سن خود را تأیید کنند. از روز چهارشنبه، Discord، پلتفرم پیام‌رسانی جامعه، اقدامات تأیید سن را برای همه کاربران ارائه خواهد کرد. این عرضه پس از آن صورت می گیرد که این شرکت در ابتدا برنامه های تأیید سن خود را در ماه فوریه به تاخیر انداخت، زیرا کاربران نگران بودند اسکن های بیومتریک و بررسی شناسه می توانند حریم خصوصی آنها را به خطر بیندازند. این نگرانی ها بی اساس نبودند. سال گذشته، یک فروشنده شخص ثالث که با Discord کار می‌کند نقض شد و به طور بالقوه داده‌های 70000 کاربر، از جمله عکس‌های شناسه دولتی و سلفی‌های مورد استفاده برای تأیید هویت را در  عنوان یک نوار پارچه ای نازک با یک ماژول محاسباتی مجهز به حسگر توصیف می شود - حداقل تا سال 2028 عرضه نمی شود. شایان ذکر است که اپل در حال حاضر یک ردیاب تناسب اندام را در قالب اپل واچ خود می فروشد (این پوشیدنی تمرینات، ضربان قلب، خواب و سایر دسته ها را ضبط می کند). با این حال، فرم فاکتور جدید نسبتاً شبیه به Whoop است، که باندهای تناسب اندام ساده را می فروشد که به گفته این شرکت می تواند انواع معیارهای سلامتی را ردیابی کند. TechCrunch برای اطلاعات بیشتر با اپل تماس گرفت. این گزارش در زمانی ارائه می شود که اپل در یک دوره گذار قرار دارد. تیم کوک در ماه آگوست از سمت خود به عنوان مدیرعامل کناره‌گیری کرد و اکنون به عنوان رئیس اجرایی فعالیت می‌کند، زیرا مدیر عامل جدید جان ترنوس فرمان را در دست گرفت. این شرکت همچنین به دلیل افزایش هزینه های ناشی از کمبود حافظه با باد مخالف روبرو شده است. با وجود این، این شرکت وعده داده است که مجموعه ای از دستگاه های جدید، از جمله یک تلفن تاشو جدید، تبلت های"}, {"source": "TechCrunch Main", "title": "Hacking group ShinyHunters claims it breached the FBI, stole agents’ and applicants’ data", "link": "https://techcrunch.com/2026/09/22/hacking-group-shinyhunters-claims-it-breached-the-fbi-stole-agents-and-applicants-data/", "summary": "The theft of agents' personal information could present a major counterintelligence threat, where agents and their families are extorted into cooperating with a foreign government.", "date_str": "2026-09-22T18:40:30+00:00", "hash": "489fcdae5b4a1167", "title_fa": "گروه هک ShinyHunters مدعی است که FBI را نقض کرده است، اطلاعات ماموران و متقاضیان را به سرقت برده است.", "summary_fa": "سرقت اطلاعات شخصی ماموران می تواند یک تهدید ضد جاسوسی بزرگ باشد، جایی که ماموران و خانواده های آنها برای همکاری با یک دولت خارجی اخاذی می شوند. ShinyHunters، یک گروه مجرم سایبری پرکار که به سرقت و اخاذی اطلاعات در مقیاس بزرگ معروف است، می‌گوید که FBI را نقض کرده و داده‌های هزاران مامور و متقاضی را به سرقت برده است. هکرها این ادعا را در سایت نشت وب تاریک خود، که TechCrunch آن را بررسی کرد، مطرح کردند و گفتند که اطلاعات حساس تقریباً از همه  را با دوره‌های عملی در موضوعات مختلف از فنی (مانند تحقیقات و مدل‌های هوش مصنوعی) تا فلسفه زندگی (مانند هندسه شانس، که به دانش‌آموزان در مورد ترتیب دادن یک زندگی به گونه‌ای که ثروت خوب از طریق آن جریان می‌یابد، آموزش دهد.) دانش‌آموزان نیز روی پروژه‌های شخصی کار خواهند کرد. هدف اصلی مدرسه این است که قول می دهد به دانش آموزان مربیانی ارائه دهد که نام های بزرگی در زمینه فناوری هستند. این مدرسه در حال حاضر درخواست‌های سال اول خود را می‌پذیرد، که یک برنامه یک ساله است که شهریه ندارد، و برای حدود 50 دانش‌آموز آزاد است که بر اساس مدرک کار انتخاب می‌شوند: آنچه ساخته‌اند، ارسال کرده‌اند، یا کسب کرده‌اند، طبق پرسش‌های متداول مدرسه. آکادمی در سانفرانسیسکو واقع شده است و دانش آموزان مسئول مسکن خود خواهند بود (اگرچه مدرسه در تلاش است تا به آنها کمک کند تا آن را پیدا کنند و آنها را با سایر هم اتاقی های دانش آموز هماهنگ کنند). یک مورد قابل توجه: آکادمی در حال حاضر یک مدرسه معتبر نیست، بنابراین شرکت کنندگان مدرک یا اعتبارات دانشگاهی که به جای دیگری منتقل می شوند، کسب نخواهند کرد. در سال 2028، آکادمی Horowitz Andreessen - که یک سرمایه گذاری انتفاعی است که 42 میلیون دلار جمع آوری کرده است - امیدوار است یک برنامه دو ساله ارائه دهد. گاگان بیانی، مدیرعامل مدرسه در پستی در X گفت که در آن مرحله،"}, {"source": "VentureBeat Tech", "title": "Anthropic releases Claude Opus 5.5, beating Fable 5.1 on key agentic benchmarks at 60% cheaper API price", "link": "https://venturebeat.com/technology/anthropic-releases-claude-opus-5-5-beating-fable-5-1-on-key-agentic-benchmarks-at-60-cheaper-api-price", "summary": "Anthropic today released Claude Opus 5.5, its new frontier model aimed at long-running coding agents, research, and professional knowledge work and it both outperforms and undercuts the cost (over application programming interface, or API) of Anthropic s prior flagship models Mythos 5.1 and Fable 5.1, released just a few weeks earlier. Read more", "date_str": "2026-09-22T19:05:41+00:00", "hash": "6d6d985791054927", "title_fa": "Anthropic Claude Opus 5.5 را منتشر کرد و Fable 5.1 را در معیارها
