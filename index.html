 place. It s easy to get caught up in frenzied online shopping holidays especially when retailers sometimes sneak price hikes before major sales (Amazon's upcoming October Prime Day sale included) or deceive shoppers with tricks to get you to spend more than you intended to . Figuring out the best time to buy something requires constantly watching ever-fluctuating online prices and some knowledge of how prices have changed in the past. As a shopping editor, that is what I do for a living, and I know how time-consuming it can be. Luckily, you don t have to figure it all out yourself: Here are the best websites and extensions I've been using for years to check price history and track prices so that you can be sure you re getting the best deal possible. The best Amazon price tracker: Camelcamelcamel Credit: Camelcamelcamel.com CamelCamelCamel is among the best ways to track prices on Amazon products. You can install the browser extension (on Chrome, Firefox, Microsoft Edge, Opera, and Safari) to get access to the site s features without leaving Amazon, or you can just copy and paste an Amazon link or product name to the website s search bar. CamelCamelCamel shows you how the price of the item has gone up or down over time, how prices have changed through Amazon directly, and the fluctuations from third-party Amazon sellers who list new and used items. If you sign up for a free account, you can set up alerts so the site can notify you by email when the price of an item drops below a certain amount, if you can get it used for a given price, or if it s at an all-time low and now is a good time to buy. You can even see previous historic highs and lows and try to map out the best time to strike. The best price tracker for most online retailers and to compare prices: Honey Credit: Honey.com You've probably already heard of the \" Honey influencer scam \" that blew up in December of 2024. Essentially, Honey hijacked affiliate links from influencers who were sponsoring them. Also, in many instances, it deliberately chose not to give the best coupons to users who used the extension (going completely against its business model). Honey is not alone in this behavior. Many coupon aggregator companies hijack affiliate links; Honey just happens to be in the spotlight because it's the biggest one. Use your", "date_str": "2026-09-24T19:00:00+00:00", "hash": "0eb637de34d123d6", "title_fa": "اینها بهترین ابزارهای ردیابی قیمت هستند که من به عنوان نویسنده معاملات استفاده می کنم", "summary_fa": "افزودن به عنوان منبع برگزیده در Google افزودن به عنوان منبع برگزیده در Google ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اعتبار: Tricky_Shark/Shutterstock فهرست مطالب اگر تا به حال احساس کرده اید که با پرداخت بیش از حد برای چیزی که به عنوان یک معامله عالی تبلیغ شده است فریب خورده اید، در جای درستی هستید. گرفتار شدن در تعطیلات دیوانه‌وار خرید آنلاین آسان است، به‌خصوص زمانی که خرده‌فروش‌ها گاهی اوقات قبل از فروش عمده قیمت‌ها را افزایش می‌دهند (از جمله فروش روز اول اکتبر در آمازون) یا خریداران را با ترفندهایی فریب می‌دهند تا شما را وادار به خرج کردن بیشتر از آنچه در نظر دارید، کنند. تعیین بهترین زمان برای خرید چیزی مستلزم تماشای دائمی قیمت های آنلاین همیشه در نوسان و آگاهی از نحوه تغییر قیمت ها در گذشته است. به عنوان یک ویرایشگر خرید، این کاری است که من برای امرار معاش انجام می دهم و می دانم که چقدر می تواند زمان بر باشد. خوشبختانه، لازم نیست خودتان همه چیز را بفهمید: در اینجا بهترین وب سایت ها و افزونه هایی هستند که من سال ها برای بررسی تاریخچه قیمت ها و ردیابی قیمت ها استفاده می کردم تا مطمئن شوید که بهترین معامله ممکن را دریافت می کنید. CamelCamelCamel یکی از بهترین راه ها برای پیگیری قیمت محصولات آمازون است. می‌توانید افزونه مرورگر (در کروم، فایرفاکس، مایکروسافت اج، اپرا و سافاری) را نصب کنید تا بدون خروج از آمازون به ویژگی‌های سایت دسترسی پیدا کنید، یا فقط می‌توانید پیوند آمازون یا نام محصول را در نوار جستجوی وب‌سایت کپی و جای‌گذاری کنید. CamelCamelCamel به شما نشان می دهد که چگونه قیمت کالا در طول زمان افزایش یا کاهش یافته است، چگونه قیمت ها مستقیماً از طریق آمازون تغییر کرده است، و نوسانات فروشندگان شخص ثالث آمازون که اقلام جدید و"}, {"source": "Lifehacker", "title": "10 Shows Like 'American Horror Story' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-american-horror-story?utm_medium=RSS", "summary": "What's not an American horror story these days, amirite? But I digress. The murder house that Ryan Murphy co. built is back for another season lucky number 13 and it's a frightfully impressive celebratory reunion, bringing back a huge list of actors and characters from previous seasons (including Sarah Paulson, Evan Peters, Emma Roberts, Kathy Bates, Angela Bassett, Gabourey Sidibe, Mena Suvari, Jessica Lange, and more), with some of them playing multiple roles. If that's not enough spooky season entertainment for you, here are 10 more addictive horror shows to stream now. Channel Zero (2016 2018) A mind-bending and occasionally gruesome expansion of various online creepypastas, Nick Antosca's series takes the form of four season-long storylines. While the tone is far from juvenile, the vibe is \"childhood nightmares come to life.\" The first season anticipates I Saw the TV Glow with a story about a half-remembered TV series linked to the disappearances of several children; the second sees a group of friends trapped in a tourist-attraction haunted house that exits into a disturbing alternate reality; another finds a couple of sisters dealing with cannibals and a mysterious staircase in the middle of the woods; while the last has a newlywed couple finding a mysterious door that unlocks childhood anxieties (and a killer clown). It's all smart and genuinely freaky existential dread blending with memorable visuals such as a child made entirely of human teeth. There's even something of a stealth fifth season over on Netflix with Antosca's Brand New Cherry Flavor . Stream Channel Zero on Shudder and AMC+ or buy it from Prime Video . Channel Zero (2016 2018) at Prime Video Learn More Learn More at Prime Video Castle Rock (2018 2019) Castle Rock was sold as the hub of some sort of a Stephen King omniverse, set in his fictional town and featuring characters and creatures from across his oeuvre. That confusing, could-be-anything premise probably hurt the show more than it helped. In reality, it s an impressive anthology series that slays even if you ve never read a page of King. The first season sees Andr Holland return to his old hometown at the behest of a death-row inmate, and features a powerhouse performance from Sissy Spacek as Ruth Deaver, whose struggles with dementia culminate in \"The Queen,\" an all-time great, harrowing, hour of television. The second season resets to introduce a young Annie Wilkes (from Misery ) and a disturbing cult, and finds Bill Skarsg ", "date_str": "2026-09-24T17:00:00+00:00", "hash": "cb3338b14d8cdba3", "title_fa": "10 نمایش مانند «داستان ترسناک آمریکایی» که باید در ادامه تماشا کنید", "summary_fa": "چه چیزی این روزها یک داستان ترسناک آمریکایی نیست، امیری؟ اما من پرت می شوم. خانه قتلی که شرکت رایان مورفی. ساخته شده برای یک فصل دیگر با شماره 13 خوش شانس بازگشته است و این یک گردهمایی جشن ترسناک و تاثیرگذار است که فهرست عظیمی از بازیگران و شخصیت‌های فصل‌های گذشته (از جمله سارا پالسون، ایوان پیترز، اما رابرتز، کتی بیتس، آنجلا باست، گابوری سیدیبه، منا سوواری، و چند نقش دیگر) را به همراه دارد. اگر این سرگرمی‌های شبح‌آمیز فصلی برای شما کافی نیست، در اینجا 10 نمایش ترسناک اعتیاد آور دیگر برای پخش جریانی وجود دارد. Channel Zero (2016 2018) مجموعه‌ای از سریال نیک آنتوساکا که در قالب چهار خط داستانی یک فصل است، گسترش ذهنی و گهگاه وحشتناکی از پاستای‌های مخوف آنلاین مختلف است. در حالی که لحن به دور از نوجوانی است، حال و هوای این است که \"کابوس های دوران کودکی زنده می شوند.\" فصل اول من درخشش تلویزیون را دیدم با داستانی درباره یک سریال تلویزیونی نیمه به یاد ماندنی که به ناپدید شدن چند کودک مرتبط است، پیش بینی می کند. دومی گروهی از دوستان را می بیند که در یک خانه خالی از سکنه با جاذبه های توریستی به دام افتاده اند که به یک واقعیت متناوب نگران کننده خارج می شود. دیگری چند خواهر را پیدا می کند که با آدمخوارها و یک پلکان مرموز در وسط جنگل سروکار دارند. در حالی که آخرین یک زوج تازه ازدواج کرده است که دری مرموز پیدا می کنند که قفل اضطراب های دوران کودکی را باز می کند (و یک دلقک قاتل). این همه ترس وجودی هوشمندانه و واقعاً عجیب و غریب است که با تصاویری به یاد ماندنی مانند کودکی که تماماً از دندان انسان ساخته شده است، ترکیب شده است. حتی چیزی شبیه به فصل پنجم مخفیانه در نتفلیکس با طعم"}, {"source": "Lifehacker", "title": "If Your iPhone 18 Pro Is Randomly Rebooting, There's a Fix Coming", "link": "https://lifehacker.com/tech/iphone-18-pro-rebooting-fix?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Apple released a bunch of new devices last week. The Apple Watch Series 12 and Ultra 4 support new health-tracking features and Siri AI, while the iPhone 18 Pro and iPhone 18 Pro Max introduce the A20 chip and variable aperture for the first time on Apple's smartphones. But while all these new products are objective upgrades over their predecessors, they all have one issue in common: They keep randomly rebooting. iPhone 18 Pro $1,199.00 at Apple Shop Now Shop Now $1,199.00 at Apple What is Apple's rebooting problem? As reported by 9to5Mac , some iPhone 18 Pro users are noticing that their smartphones are freezing up after a failed Face ID scan. When this happens, you won't be able to interact with your iPhone, even if the \"Try Face ID Again\" button appears on-screen. After a few moments, the iPhone will reboot. It's not a catastrophic issue, but it is annoying, and it's affecting a number of users, as this Reddit thread shows . It's a similar story with the latest Apple Watches . While the Series 12 and Ultra 4 obviously don't use Face ID, users are still experiencing random reboots emphasis on \"random.\" Unlike the iPhone 18 Pro users, affected Apple Watch users aren't doing anything in particular when their watches reboot. They could be in the middle of a workout, chatting with Siri AI, or using the Maps app, when all of a sudden, the Apple logo appears. Some analyses showed that the Neural Engine was at fault, but Apple never confirmed the exact issue. Apple has fixes in the works for iPhone 18 Pro users That said, Apple did find solutions to the reboot issues on all of these devices, though only the Apple Watch has a current fix. Apple released watchOS 27.0.1 exclusively for Series 12 and Ultra 4 users on Wednesday, which it says should fix random reboots going forward. And while iPhone 18 Pro and 18 Pro Max users don't have a fix yet, Apple confirmed to 9to5Mac that an update is in the works. As such, don't feel the need to take your new iPhone 18 Pro to the Apple Store if your only issue is random rebooting. While some Apple Store employees have swapped out affected units, the upcoming software update should be enough to take care of the issue. While we don't have an exact ETA for the update, expect it to be called something like iOS 27.0.1, similar to watchOS 27.0.1. And if you want to ensure you update as soon as it's available, regularly check for it in Settings General Software Update .", "date_str": "2026-09-24T16:30:41+00:00", "hash": "0c3eed4d664af58c", "title_fa": "اگر آیفون 18 پرو شما به طور تصادفی راه اندازی مجدد می شود، یک مشکل در راه است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اپل هفته گذشته تعداد زیادی دستگاه جدید را عرضه کرد. اپل واچ سری 12 و اولترا 4 از ویژگی های جدید ردیابی سلامت و هوش مصنوعی سیری پشتیبانی می کنند، در حالی که آیفون 18 پرو و ​​آیفون 18 پرو مکس تراشه A20 و دیافراگم متغیر را برای اولین بار در تلفن های هوشمند اپل معرفی می کنند. اما در حالی که همه این محصولات جدید نسبت به محصولات قبلی خود ارتقای عینی دارند، همه آنها یک مشکل مشترک دارند: آنها به طور تصادفی راه اندازی مجدد را ادامه می دهند. iPhone 18 Pro $1,199.00 در Apple Shop اکنون خرید کنید $1,199.00 در Apple مشکل راه اندازی مجدد اپل چیست؟ همانطور که توسط 9to5Mac گزارش شده است، برخی از کاربران آیفون 18 پرو متوجه یخ زدن گوشی های هوشمندشان پس از اسکن ناموفق Face ID شده اند. وقتی این اتفاق می‌افتد، حتی اگر دکمه «Try Face ID Again» روی صفحه نمایش داده شود، نمی‌توانید با آیفون خود تعامل داشته باشید. پس از چند لحظه، آیفون دوباره راه اندازی می شود. این یک موضوع فاجعه بار نیست، اما آزاردهنده است و تعدادی از کاربران را تحت تاثیر قرار می دهد، همانطور که این موضوع Reddit نشان می دهد. این یک داستان مشابه با آخرین ساعت های اپل است. در حالی که مشخصا سری 12 و اولترا 4 از Face ID استفاده نمی کنند، کاربران همچنان با تاکید بر \"تصادفی\" راه اندازی مجدد تصادفی را تجربه می کنند. برخلاف کاربران آیفون 18 پرو، کاربران آسیب دیده اپل واچ هنگام راه اندازی مجدد ساعت هایشان، هیچ کار خاصی انجام نمی دهند. آن‌ها می‌توانند در وسط تمرین باشند، با Siri AI چت کنند یا از برنامه Maps استفاده کنند، زمانی که لوگوی اپل ظاهر می‌شود. برخی از تجزیه و تحلیل ها نشان داد"}],
      media: [{"source": "Billboard", "title": "Dylan Gossett on Expanding His Troubadour Sound With New Album, Touring with Mumford & Sons and ‘Trying to Make the Best Songs Possible’", "link": "https://www.billboard.com/music/country/dylan-gossett-ramblin-album-interview-1236347445/", "summary": "In early 2024, Texas native Dylan Gossett ’s breakthrough song “Coal” became his first Billboard Hot 100 hit, and went on to become certified double platinum by the Recording Industry Association of America. He followed with more homespun, organic tracks like the romantic “Beneath Oak Trees” and his 2025 self-written and self-produced debut album, Westward . With his sophomore album Ramblin’ , out Friday (Sept. 25) on Big Loud Texas / Mercury Records, Gossett aims to strike a balance between some of the more rustic fare of his previous projects and evolving his sound with even more full-bodied instrumentation. “I’m like a kid on a playground,” Gossett tells Billboard . “There’s still those stripped-back songs on this record that I love, and honestly, they’re some of my favorites on the record. But we got to do the big drum kit, open things up and widen the sonic space of each song. That’s why I think it feels a bit more complete than Westward might have been. I feel like there’s more layering. The lyrics still hold up and have the same storytelling element, but a lot of these songs, you just want to put on with your friends in the car and just jam them.” He’s previewed the new album with songs like the deceptively breezy “Clothesline,” which centers on the emotional turmoil of being in relational limbo, and the plucky, longing “Loving You Like That.” Though sonically he broadens his sound, some of the songs themselves are drawn from deep in his writing catalog, including a few songs that didn’t make it on Westward . “‘Running From the Sun’ is an older song I wrote, and then ‘Snow Melt,’ a few of those had been written before Westward ,” he says. “But some of the cooler songs on Ramblin’ that I love were buzzer-beaters. Two weeks before we had to submit [the album], I’m like ‘Can we get into the studio?’ And the idea turns into songs like ‘The Old Me’ and ‘Loving You Like That.’” Elsewhere, “Honeysuckle” looks at the values of his family and home in Texas. After his initial career breakthrough, instead of making a predictable move to Music City, the Texas A M graduate has stayed close to his roots deep in the Lone Star State. “I have no reason to leave. I’ve got so much family here and my wife and I love it. When I need to go do work, I’ll fly to Nashville real quick, or New York or L.A., and can come back home the next day. I like being able to separate work and home. It helps keep my head clear a bit,” he says. Ramblin’ also nods to the swift changes in G", "date_str": "2026-09-25T14:19:59+00:00", "hash": "d9c8a061b407a230", "title_fa": "دیلن گست در مورد گسترش صدای تروبادور خود با آلبوم جدید، تور با مامفورد و پسران و \"تلاش برای ساختن بهترین آهنگ های ممکن\"", "summary_fa": "در اوایل سال 2024، آهنگ موفقیت‌آمیز دیلن گوست، اهل تگزاس، «زغال‌سنگ» اولین موفقیت او در بیلبورد Hot 100 شد و پس از آن توسط انجمن صنعت ضبط آمریکا گواهینامه دوبل پلاتین دریافت کرد. او آهنگ‌های ارگانیک و دوست‌داشتنی‌تری مانند رمانتیک «Beneath Oak Trees» و اولین آلبوم سال ۲۰۲۵ را که توسط خودش نوشته و تولید کرد، Westward را دنبال کرد. با آلبوم دوم خود رامبلین، که جمعه (سپتامبر. 25) در Big Loud Texas / Mercury Records، Gossett قصد دارد تعادلی بین برخی از طرح‌های روستایی‌تر پروژه‌های قبلی خود و تکامل صدای خود با سازهای دقیق‌تر ایجاد کند. گوست به بیلبورد می گوید: «من مثل یک بچه در زمین بازی هستم. \"هنوز آن آهنگ‌های stripped back در این آلبوم وجود دارد که من آنها را دوست دارم، و صادقانه بگویم، آن‌ها از جمله آهنگ‌های مورد علاقه من در ضبط هستند. اما ما باید کیت بزرگ درام را انجام دهیم، همه چیز را باز کنیم و فضای صوتی هر آهنگ را گسترش دهیم. به همین دلیل است که فکر می‌کنم کمی کامل‌تر از وست‌وارد به نظر می‌رسد. احساس می کنم لایه بندی بیشتری وجود دارد. اشعار همچنان پابرجا هستند و همان عنصر داستان سرایی را دارند، اما بسیاری از این آهنگ‌ها را فقط می‌خواهید با دوستانتان در ماشین بنویسید و فقط آنها را جم کنید.» او پیش‌نمایش آلبوم جدید را با آهنگ‌هایی مانند آهنگ فریبنده «خط لباس» که بر آشفتگی عاطفی در برزخ رابطه‌ای متمرکز است، و «Loving You Like That» دلیرانه و آرزومند است. اگرچه او از نظر صوتی صدای خود را گسترش می دهد، برخی از آهنگ ها خود از عمق کاتالوگ نوشتن او استخراج شده اند، از جمله چند آهنگ که در Westward راه نیافتند. او می‌گوید: «Running From the Sun» آهنگ قدیمی‌تری است که من نوشتم، و سپس «ذوب برف»، تعدادی از آن‌ها قبل از غرب نوشته شده"}, {"source": "Billboard", "title": "Taylor Swift Says Inspiration For ‘Patient Zero’ Came From Chat With Friends About This Awkward Relationship Request From an Ex", "link": "https://www.billboard.com/music/pop/taylor-swift-inspiration-patient-zero-single-1236347468/", "summary": "Taylor Swift is opening up about the strange relationship behavior that inspired the first single from her just-released The Life of a Showgirl: The Encore deluxe edition, Patient Zero . An Instagram post from the U.K. s Capital FM on Friday morning (Sept. 25) reported that Swift had revealed the origins behind the slinky song that is one of four newly recorded tracks on the LP. I was hanging out with a bunch of friends, and one of my friends told us that she had been reached out to by the new girlfriend of an ex of hers, asking for guidance on if she had had the same experiences with this guy that this new girlfriend was having, the singer told the outlet; a spokesperson for Swift confirmed to Billboard that Swift had shared the her thoughts with Capital FM. And everyone in our group just immediately started saying like, Oh, I ve been through that too , and telling the stories of when this kind of reach out had happened for them, Swift continued. And I thought to myself, if this has happened to all of us, it s such an interesting kind of angle on humanity and on relationships, and I wonder if I could write something from the perspective of getting this phone call, and really only from the perspective and the side of the phone call of the ex who s been through it before. The song s first verse appears to dovetail with that explanation, with Swift singing, I ve gotta be honest, I ve been expecting your call/ No, it’s not a bad time at all/ I heard somebody saying there s trouble in paradise/ And my lips are sealed tight now. The chorus then says it all: It s not for me to tell/ Someone else what to do/ But if you wanna party with somebody who might know/ About the devil on his shoulder under his halo/ When the toxins take their hold, you d rather die than let it go/ But if you re sick of him, I got you, I was patient zero. The deluxe version of Swift s 12th studio album, out now, also features the newly recorded song Babylon, Pink Clouding and Cleveland! The original album spent 12 weeks at No. 1 on the Billboard 200 and opened with a record-breaking 4.002 million equivalent album units in the United States in its first week. Swift will celebrate the refreshed album s release on Sunday (Sept. 27) at the 2026 MTV VMAs, where she plans to premiere the cinematic video for Patient Zero, which co-stars Dakota Johnson and Colin Farrell. Swift directed the visual and she is slated to receive the inaugural Artist Director Honor at the show, where she is nominated 1", "date_str": "2026-09-25T14:16:30+00:00", "hash": "d10956f91ba3f31a", "title_fa": "تیلور سوئیفت می‌گوید که الهام‌بخش «بیمار صفر» از چت با دوستان درباره این درخواست رابطه ناخوشایند از یک سابق آمده است", "summary_fa": "تیلور سوئیفت در مورد رفتارهای عجیب و غریب رابطه‌ای که الهام‌بخش اولین تک‌آهنگ تازه منتشر شده‌اش The Life of a Showgirl: The Encore Deluxe Edition، Patient Zero است، صحبت می‌کند. یک پست اینستاگرامی از Capital FM بریتانیا در صبح روز جمعه (25 سپتامبر) گزارش داد که سوئیفت منشأ این آهنگ نازک که یکی از چهار آهنگ جدید ضبط شده در LP است را فاش کرده است. من در حال معاشرت با چند نفر از دوستانم بودم و یکی از دوستانم به ما گفت که دوست دختر جدید یکی از دوستان سابقش با او تماس گرفته و از او راهنمایی خواسته است که آیا او همان تجربیاتی را که این دوست دختر جدید داشت با این پسر داشته است یا خیر. سخنگوی سوئیفت به بیلبورد تأیید کرد که سوئیفت افکار خود را با Capital FM در میان گذاشته است. سوئیفت ادامه داد و همه در گروه ما بلافاصله شروع به گفتن کردند، اوه، من هم آن را پشت سر گذاشته‌ام، و داستان‌هایی را تعریف می‌کردند که چه زمانی این نوع ارتباط برای آنها اتفاق افتاده است. و با خودم فکر کردم، اگر این اتفاق برای همه ما افتاده باشد، این یک نوع زاویه جالب در مورد انسانیت و روابط است، و نمی‌دانم که آیا می‌توانم چیزی از منظر دریافت این تماس تلفنی بنویسم، و واقعاً فقط از منظر و طرف تماس تلفنی قبلی که قبلاً آن را تجربه کرده است. به نظر می‌رسد که اولین بیت آهنگ با این توضیح همراه است، با خواندن سوئیفت، باید صادق باشم، منتظر تماس شما بودم/ نه، اصلاً زمان بدی نیست/ شنیدم که یکی می‌گفت در بهشت ​​مشکلی وجود دارد/ و لب‌هایم اکنون محکم بسته شده‌اند."}, {"source": "Billboard", "title": "Val Blavatnik Named to Warner Music Group Executive Team, Elliot Grainge Named Chair of ADA, More", "link": "https://www.billboard.com/pro/val-blavatnik-warner-music-executive-elliot-grainge-ada/", "summary": "Val Blavatnik , the 28-year-old son of Warner Music Group majority owner and vice chairman Len Blavatnik , has been named managing director of Warner Music North America, U.K. and Corporate Development at the Warner Music Group, the company announced Friday (Sept. 25). In his new role the younger Blavatnik, who has held several roles at the company in recent years, and has been a board member since 2023, expects to “unify and drive business and operational strategy across these markets while guiding the company’s investment strategy to support growth,” according to a press release. Related Warner Music Group Earnings Call Recap: What You Need to Know Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction The Blavatnik announcement is part of a flurry of new executive announcements that CEO Robert Kyncl made this morning. In addition, Atlantic Music Group chairman/CEO Elliot Grainge will take over ADA as its new chairman, while Alejandro Duque , who has held the dual roles of president of Warner Latin and president of ADA since last July, has been named president of Warner Music International, adding Asia-Pacific and Europe, the Middle East and Africa under his oversight. Zach Friedman , currently COO at Atlantic Music Group, will add the title of vice chair of ADA to his resume. That means that Simon Robson , who has been president of EMEA recorded music since last September, and has spent almost 30 years in senior international roles at Warner Music, will be leaving the company. Replacing him in that role will be Guillermo Gonzalez , who has spent the past six years as president of Warner Music Iberia; Andrés Rothschild will take over Iberian operations. “We owe a tremendous debt of gratitude to Simon Robson for his dedicated service, operational excellence and trusted leadership while expanding WMG’s global footprint over his remarkable tenure, and wish him the very best in his next endeavors,” Kyncl said in a statement about Robson’s exit. Finally, Aaron Bay-Schuck has been affirmed as the sole chairman/CEO of Warner Records, two months after co-chair/COO Tom Corson was elevated to COO of the Warner Music Group. Bay-Schuck has co-led the label since 2018, and will continue as the sole chief moving forward. “To build upon our successful year in which we delivered on all three strategic priorities to grow market share, increase the value of music and increase our e", "date_str": "2026-09-25T14:01:31+00:00", "hash": "5bf76411dc423d0d", "title_fa": "Val Blavatnik به تیم اجرایی گروه موسیقی وارنر، الیوت گرینج به عنوان رئیس ADA، بیشتر", "summary_fa": "این شرکت جمعه (25 سپتامبر) اعلام کرد که وال بلاواتنیک، پسر 28 ساله مالک اکثریت و نایب رئیس گروه موسیقی وارنر، لن بلاواتنیک، به عنوان مدیر عامل وارنر موزیک آمریکای شمالی، بریتانیا و توسعه شرکتی در گروه موسیقی وارنر انتخاب شده است. طبق یک بیانیه مطبوعاتی، بلواتنیک جوان‌تر که در سال‌های اخیر چندین نقش را در شرکت داشته و از سال 2023 عضو هیئت‌مدیره بوده است، در نقش جدید خود انتظار دارد «استراتژی تجاری و عملیاتی را در این بازارها متحد کند و در عین حال استراتژی سرمایه‌گذاری شرکت را برای حمایت از رشد هدایت کند». خلاصه فراخوان درآمد گروه موسیقی وارنر مرتبط: آنچه باید بدانید بیلبورد برای افزودن آلبوم‌های رسانه هوشمند به عنوان فرمت‌های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل توپاک شکور انجام می‌دهد اعلام Blavatnik بخشی از انبوهی از اعلامیه‌های اجرایی جدید است که رابرت کینکل، مدیرعامل، صبح امروز اعلام کرد. علاوه بر این، الیوت گرینج، رئیس/مدیرعامل گروه موسیقی آتلانتیک، ریاست جدید ADA را برعهده خواهد گرفت، در حالی که آلخاندرو دوکه، که از ژوئیه گذشته نقش های دوگانه رئیس وارنر لاتین و رئیس ADA را بر عهده داشت، به عنوان رئیس شرکت بین المللی موسیقی وارنر معرفی شد و آسیا و اقیانوسیه و اروپا، خاورمیانه و آفریقا را تحت نظارت خود اضافه کرد. زک فریدمن که در حال حاضر مدیر ارشد اجرایی گروه موسیقی آتلانتیک است، عنوان نایب رئیس ADA را به رزومه خود اضافه خواهد کرد. این بدان معناست که سایمون رابسون، که از سپتامبر گذشته رئیس بخش موسیقی ضبط شده EMEA بوده و تقریباً 30 سال در نقش های بین المللی ارشد در Warner Music گذرانده است، شرکت را ترک خواهد کرد. جانشین او در این نقش گیرمو گونزالس خواهد بود که شش سال گذشته را به عنوان رئیس شرکت Warner Music Iberia سپری کرده است."}, {"source": "Billboard", "title": "Meet Melanie Santiler: Cuban Rising Star Navigates Identity & Freedom on Introspective Album ‘Los Cisnes’", "link": "https://www.billboard.com/music/latin/meet-melanie-santiler-cuban-rising-artist-los-cisnes-album-1236346732/", "summary": "In a world where Cuban reparto music is having viral momentum and making international leaps, there’s Melanie Santiler going against the tide. To best showcase her artistry, the 25-year-old rising act from Havana delivers her debut album Los Cisnes, out today (Sept. 25) under MamiFinaRecords/ONErpm. Related Nicky Jam Drops La Foto With Cuban Newcomer El Shadow After Discovering Him on Instagram Reparto Music Is Cuba s New Urban Movement: 31 Artists to Discover Ozuna, Daddy Yankee, Maluma, Bad Gyal More Artists Obsessed with Cuba s Reparto Music On the 10-track set, Santiler, a former 2025 Billboard On the Radar Latin artist, seamlessly navigates from alternative to jazz to electronic, while fearlessly redefining Latin pop music. And while she’s creating music in her own terms, three of the tracks — ”Gataza,” “Delincuente,” and “Los Repas No Lloran” — honor the booming reparto movement (a tropical and urban musical genre that derives from the barrios of her native Caribbean island). “Reparto is a constant inspiration in my music,” Santiler, who’s currently in Spain, tells Billboard over a zoom interview. “I used to produce a slow-tempo reparto, but now it’s faster and has evolved with the sounds I have been listening to. In ‘Los Repas,’ I even dared to make a ‘sad’ reparto mixed with bolero lyrics.” But beyond the melting pot of melodies — inspired by artists such as Rosalía, C. Tangana, Yomil y el Dany, Buena Vista Social Club, and Celia Cruz — Los Cisnes underlines years of soul-searching and self-reflection narrated by Santiler’s dreamy and sensual vocal prowess. Below, Santiler talks more about her debut album. Courtesy Melanie Santiler has a very different sound than what’s actually trending in Cuba today. What made you take this alternative route? This was always Melania, really; I had to mold that persona early in my career — trying to find myself, above all — but this album gives me the chance to show who I truly am, through and through. The project itself allows me to create a universe I felt I needed. When I played my music for others, I felt something was still missing — songs that truly expressed who I was. This album has made that possible, allowing people to get to know the real me. It’s true, this isn t the kind of music currently being consumed in Cuba, and that scares me a little; at the same time, though, I have great faith that there are people — in Cuba and around the world — who need this kind of music. I decided to take the risk of bei", "date_str": "2026-09-25T14:00:00+00:00", "hash": "a20405dda73a843f", "title_fa": "با ملانی سانتیلر آشنا شوید: ستاره نوظهور کوبایی هویت و آزادی را در آلبوم درون‌نگر Los Cisnes هدایت می‌کند", "summary_fa": "در دنیایی که موسیقی رپارتو کوبایی شتاب ویروسی دارد و جهش های بین المللی دارد، ملانی سانتیلر مخالف جریان است. برای به نمایش گذاشتن بهترین هنر خود، این بازیگر 25 ساله در حال ظهور از هاوانا اولین آلبوم خود را Los Cisnes امروز (25 سپتامبر) تحت MamiFinaRecords/ONErpm عرضه می کند. نیکی جم پس از کشف او در اینستاگرام، La Foto را با El Shadow تازه وارد کوبایی رها کرد. هنرمند، به طور یکپارچه از جایگزینی جاز به الکترونیک می گذرد، در حالی که بدون ترس موسیقی پاپ لاتین را بازتعریف می کند. و در حالی که او در حال ساختن موسیقی به زبان خودش است، سه قطعه از آنها - \"Gataza\"، \"Delincuente\" و \"Los Repas No Lloran\" - به جنبش پررونق reparto (یک ژانر موسیقی استوایی و شهری که برگرفته از موانع جزیره بومی او در دریای کارائیب است) احترام می گذارد. سانتیلر که در حال حاضر در اسپانیا به سر می‌برد، در مصاحبه‌ای با زوم به بیلبورد می‌گوید: «ریپارتو یک الهام‌بخش دائمی در موسیقی من است. من قبلاً یک رپارتو با سرعت آهسته تولید می‌کردم، اما اکنون سریع‌تر شده و با صداهایی که گوش می‌دادم تکامل یافته است. در «لوس رپاس»، من حتی جرأت کردم یک رپارتو «غمگین» آمیخته با اشعار بولرو بسازم. اما فراتر از دیگ ذوب ملودی ها - با الهام از هنرمندانی مانند Rosalía، C. Tangana، Yomil y el Dany، Buena Vista Social Club، و Celia Cruz - Los Cisnes بر سال ها جستجوی روح و خود بازتابی که توسط استعداد آوازی رویایی و حسی Santiler روایت شده است، تاکید می کند. در زیر، Santiler بیشتر در مورد اولین آلبوم خود صحبت می کند. با حسن نیت، ملانی سانتیلر صدایی بسیار متفاوت با آنچه که امروزه در کوبا رایج است دارد. چه شد که این مسیر جایگزین را انتخاب کردید؟ این همیشه ملانیا بود، واقعاً. من"}, {"source": "Billboard", "title": "Olivia Rodrigo, KATSEYE, SOMBR & More to Perform on 2026 iHeartRadio Jingle Ball Tour: Full Lineup", "link": "https://www.billboard.com/lists/jingle-ball-tour-2026-dates-lineup-olivia-rodrigo-katseye/", "summary": "iHeartMedia will celebrate the holiday season with its annual iHeartRadio Jingle Ball Tour, with such top artists as Olivia Rodrigo , KATSEYE , SOMBR , Hilary Duff, Jonas Brothers, Charlie Puth, RAYE, Alex Warren, OneRepublic, Ludacris, Teddy Swims and Sienna Spiro. This year, the tour, presented by Capital One, will stop in Dallas/Fort Worth, Los Angeles, Chicago, Detroit, New York City, Boston, Washington, D.C, Philadelphia and Nashville. Stella Lefty will appear on four dates including Boston, where her No. 2 Hot 100 hit Boston is likely to be especially well-received. Related KPop Demon Hunters Singers, Zara Larsson, Conan Gray, Leon Thomas More Light Up 2025 Jingle Ball LA: Exclusive Photos On Offstage “The Jingle Ball Tour has become the holiday season’s most anticipated concert event, showcasing the biggest stars and the songs that defined the year in music,” John Sykes, president of Entertainment Enterprises for iHeartMedia, and Tom Poleman, chief programming officer for iHeartMedia said in joint statement. “We’re excited to once again partner with ABC to share the energy and holiday spirit of iHeartRadio Jingle Ball with millions of fans nationwide.” iHeartRadio Jingle Ball Tour stops will be part of the exclusive network special airing on ABC in December and next day on Hulu, Disney+ and VOD. Eligible Capital One cardholders will get first access to high-demand tickets via a cardholder presale in each city. Plus, cardholders can add a Capital One Access Pass to their purchase in select markets to enjoy an exclusive pre-show party with a performing Jingle Ball artist. The iHeartRadio Jingle Ball Capital One Cardholder Pre-Sale begins Tuesday, Sept. 29, at 10 a.m. local time and runs through Thursday, Oct. 1, at 10 a.m. local time, or while pre-sale supplies last. Pre-sale info and tickets will be available at iHeartRadio.com/CapitalOne. All other tickets go on sale to the general public on Friday, Oct. 2 at noon local time and will be available at TicketMaster.com. For the 13th consecutive year, eight cities on the tour (Los Angeles, Chicago, Detroit, New York, Boston, Philadelphia, Washington, D.C. and Nashville) will partner with the Ryan Seacrest Foundation, a nonprofit organization dedicated to bringing interactive media studios into pediatric hospitals to help patients find joy during treatment. In addition, iHeartRadio’s 106.1 KISS FM s Jingle Ball in Dallas/Fort Worth will work with the Kidd s Kids, a non-profit organization whose mission f", "date_str": "2026-09-25T14:00:00+00:00", "hash": "399ef35d6678b3d7", "title_fa": "Olivia Rodrigo، KATSEYE، SOMBR و بیشتر برای اجرا در تور iHeartRadio Jingle Ball 2026: ترکیب کامل", "summary_fa": "iHeartMedia فصل تعطیلات را با تور سالانه iHeartRadio Jingle Ball، با هنرمندان برجسته ای مانند Olivia Rodrigo، KATSEYE، SOMBR، Hilary Duff، Jonas Brothers، Charlie Puth، RAYE، Alex Warren، OneRepublic، Ludacris، Teddy Swims و Sienna Spiro جشن خواهد گرفت. امسال، تور ارائه شده توسط Capital One، در دالاس/فورث ورث، لس ​​آنجلس، شیکاگو، دیترویت، نیویورک سیتی، بوستون، واشنگتن، دی سی، فیلادلفیا و نشویل متوقف خواهد شد. استلا لفتی در چهار تاریخ از جمله بوستون ظاهر خواهد شد، جایی که شماره 2 او در بخش 100 داغ بوستون احتمالاً مورد استقبال قرار خواهد گرفت. KPop Demon Hunters Singers، Zara Larsson، Conan Grey، Leon Thomas More Light Up 2025 Jingle Ball LA: عکس های اختصاصی در خارج از استیج «تور Jingle Ball به مورد انتظارترین رویداد کنسرت فصل تعطیلات تبدیل شده است، که بزرگترین ستاره ها و آهنگ هایی را که سال را در موسیقی، Endia, EndiaArt و EndiaArtter، John Sykes، EndiaArtpri, John Sykes، EndiaMeartpriry، به نمایش می گذارد. پولمن، مدیر برنامه‌نویسی iHeartMedia در بیانیه‌ای مشترک گفت. \"ما هیجان زده هستیم که بار دیگر با ABC شریک شویم تا انرژی و روحیه تعطیلات iHeartRadio Jingle Ball را با میلیون ها طرفدار در سراسر کشور به اشتراک بگذاریم.\" توقف‌های iHeartRadio Jingle Ball Tour بخشی از پخش ویژه شبکه اختصاصی ABC در ماه دسامبر و روز بعد در Hulu، Disney+ و VOD خواهد بود. دارندگان کارت Capital One واجد شرایط برای اولین بار از طریق پیش فروش دارنده کارت در هر شهر به بلیط های پر تقاضا دسترسی خواهند داشت. بعلاوه، دارندگان کارت می‌توانند در بازارهای منتخب، یک Capital One Access Pass به خرید خود اضافه کنند تا از یک مهمانی انحصاری قبل از نمایش با یک هنرمند فعال Jingle Ball لذت ببرند. پیش فروش iHeartRadio Jingle Ball Capital One Cardholder از سه شنبه، 29 سپتامبر، ساعت 10 صبح به وقت محلی آغاز می شود و"}, {"source": "Billboard", "title": "Why Aaliyah’s Family Is Still Fighting in Court — 5 Years After Her Music Catalog Returned", "link": "https://www.billboard.com/pro/aaliyah-music-streaming-family-fighting-court/", "summary": "In May 2021, three months before Aaliyah ’s music catalog returned to market after a decade of infighting over her estate, the late singer’s family members signed a deal directing how they’d split up royalties once Blackground Records began making money from it again. It wasn’t long before that contract became the topic of lawsuits — and now, five years after a moment that was supposed to end the long-running family drama for good, the court fight is ongoing. Related Legacy Publishing Launches With 800‑Song Catalog Featuring Aaliyah, Missy Elliott, Timbaland Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction That’s perhaps unsurprising. Aaliyah’s family was well known for feuding during the decade her music was out of circulation — a fact some say is to blame for the catalog’s long dormancy . Historically, the disagreements were between Barry Hankerson , Aaliyah’s uncle and the owner of Blackground Records, and the late singer’s estate, controlled by her mother, Diane Haughton . But the contract in question didn’t involve Diane. This time, Barry is pitted against Aaliyah’s cousin, Jomo Hankerson — his own son. In the May 2021 deal, Barry and Jomo Hankerson signed a written agreement granting Jomo a 20% stake in Blackground. The Blackground catalog encompasses most of Aaliyah’s music, including her albums One in a Million and Aaliyah , as well as early masters for Timbaland Magoo, Tank, Toni Braxton and JoJo. The contract coincided with Barry finally agreeing, after years of stops and starts, to a distribution deal with EMPIRE that would finally make the music available again. The Bay Area-based music company put out the Blackground catalog as planned — on streaming services for the first time, and re-issued in physical formats after years out of print — via a series of rolling releases between August and October 2021. While the music releases went smoothly and led to commercial success, including top 10 entries on multiple Billboard charts, trouble was already brewing behind the scenes. Jomo sued Barry at the end of the release schedule, claiming in an October 2021 lawsuit that his father had not delivered his 20% of the profits as promised. Related Aaliyah Lands Her First Adult R B Airplay No. 1 With ‘Gone,’ Featuring Tank In response, Barry leveled a shocking claim: that Jomo had coerced him into signing over an unearned 20% share in Blackground by stealing Aa", "date_str": "2026-09-25T14:00:00+00:00", "hash": "4aa53dc478a3dcc9", "title_fa": "چرا خانواده عالیه هنوز در دادگاه می جنگند - 5 سال پس از بازگشت کاتالوگ موسیقی او", "summary_fa": "در ماه مه 2021، سه ماه قبل از اینکه کاتالوگ موسیقی عالیه پس از یک دهه درگیری داخلی بر سر دارایی او به بازار بازگردد، اعضای خانواده خواننده فقید قراردادی را امضا کردند که در آن نحوه تقسیم حق امتیاز زمانی که Blackground Records دوباره شروع به کسب درآمد از آن کرد، امضا کردند. طولی نکشید که آن قرارداد به موضوع پرونده های قضایی تبدیل شد - و اکنون، پنج سال پس از لحظه ای که قرار بود برای همیشه به این درام خانوادگی طولانی مدت پایان دهد، دعوای دادگاه ادامه دارد. انتشارات قدیمی مرتبط با کاتالوگ 800 آهنگ با حضور عالیه، میسی الیوت، بیلبورد تیمبالند برای افزودن آلبوم‌های رسانه هوشمند به عنوان فرمت‌های فروش واجد شرایط نمودار راه‌اندازی می‌شود Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل توپاک شکور انجام می‌دهد. خانواده عالیه در طول دهه‌ای که موسیقی او از تیراژ خارج شده بود، به دلیل اختلافات بسیار مشهور بودند - واقعیتی که برخی می‌گویند عامل خفتگی طولانی کاتالوگ است. از نظر تاریخی، اختلافات بین بری هنکرسون، عموی عالیه و مالک بلک‌گراند رکوردز، و دارایی خواننده فقید که توسط مادرش دایان هاتون کنترل می‌شد، بود. اما قرارداد مورد بحث شامل دایان نمی شد. این بار، بری در مقابل پسر عموی عالیه، جومو هنکرسون - پسر خودش قرار می گیرد. در قرارداد می 2021، بری و جومو هنکرسون قراردادی کتبی امضا کردند که به جومو 20 درصد از سهام Blackground را می دهد. کاتالوگ Blackground بیشتر موسیقی های آلیا، از جمله آلبوم های او در یک میلیون و عالیه، و همچنین استادان اولیه تیمبالند ماگو، تانک، تونی براکستون و جوجو را در بر می گیرد. این قرارداد مصادف شد با اینکه بری سرانجام پس از سال ها توقف و شروع، با یک قرارداد توزیع با EMPIRE موافقت کرد که در نهایت موسیقی را دوباره در دسترس قرار"}, {"source": "Billboard", "title": "Elton John to Perform Surprise Show to Open London’s Apple Music Hall: See Opening Season Lineup", "link": "https://www.billboard.com/music/music-news/elton-john-apple-music-hall-opening-season-lineup-1236347425/", "summary": "Sir Elton John , Charli xcx , Burna Boy and Troye Sivan are among the acts performing at Apple Music Hall ’s opening season in London. Related Apple Music to Open State-of-the-Art Live Music Venue in London Elton John Plays 24-Song Concert Settles His ‘Debt’ to Brazil at 2026 Rock in Rio Elton John Others Forced to Repay $13M Legal Bill Following Hacking Lawsuit Loss The 600-capacity venue at Battersea Power Station will open on Monday (Sept. 28) with a performance from John, with tickets on sale that same day (9 a.m. U.K. time) from the venue’s official website . Baby Keem , Skye Newman , Arlo Parks and Chase Status will also join the opening run of shows before the end of 2026. See the full show dates below. John’s performance will be his first public U.K. performance in over three years, having wrapped his Farewell Yellow Brick Road tour at Glastonbury Festival in June 2023. John has sporadically performed live since, most recently at Brazil’s Rock in Rio festival on Sept. 7 . This isn t the first time that John has performed at the iconic London landmark. In 2014, he performed a private concert at the venue to mark the building’s residential and commercial redevelopment. On Tuesday, Apple announced the opening of its new state-of-the-art space which features a 48-speaker spatial audio system and a customizable 38-foot-wide stage. The space also includes two dedicated recording and mix studios, and is hardwired to for 16 or more cameras that purpose-built broadcast control room so that artists can capture a multitude of content at the shows. In 2022, the tech giant officially opened their London HQ at the Battersea location. The revamped area features studios for Apple Music Radio’s London-based hosts to broadcast from. Apple has also revealed it has partnered with UK promoter Communion ONE to support bookings and promotion at Apple Music Hall. Mazin Tappuni , a managing director at Communion ONE, said, Apple Music Hall is a fantastic venue, like nothing fans will have ever seen before. The production quality is world class, livestreaming to fans across the world, from a live room where every square foot has the artist and their fans in mind.” Apple Music Hall 2026 events Sept. 28 Elton John Oct. 2 Baby Keem Oct. 7 Skye Newman Oct. 13 Troye Sivan Oct 22. Arlo Parks Oct 29. Burna Boy Nov. 26 Chase Status Dec. 2 Charli xcx", "date_str": "2026-09-25T13:40:00+00:00", "hash": "ca08b392ddb39b65", "title_fa": "التون جان برای افتتاح سالن موزیک اپل لندن، نمایش سورپرایز اجرا می‌کند: فهرست فصل افتتاحیه را ببینید", "summary_fa": "سر التون جان، Charli xcx، Burna Boy و Troye Sivan از جمله بازیگرانی هستند که در فصل افتتاحیه Apple Music Hall در لندن اجرا می‌کنند. اپل موزیک مرتبط با جدیدترین سالن موسیقی زنده در لندن افتتاح می‌شود التون جان کنسرت 24 آهنگی اجرا می‌کند «بدهی» خود را به برزیل در سال 2026 راک در ریو تسویه می‌کند. 28) با اجرای جان، با بلیت های فروخته شده در همان روز (9 صبح به وقت بریتانیا) از وب سایت رسمی محل برگزاری. Baby Keem، Skye Newman، Arlo Parks و Chase Status نیز پیش از پایان سال 2026 به نمایش‌های افتتاحیه خواهند پیوست. تاریخ نمایش کامل را در زیر مشاهده کنید. اجرای جان اولین اجرای عمومی او در بریتانیا در بیش از سه سال است که تور خداحافظی جاده آجر زرد خود را در جشنواره گلستونبری در ژوئن 2023 به پایان رساند. جان از آن زمان به‌طور پراکنده به اجرای زنده پرداخته است که اخیراً در جشنواره راک در ریو در برزیل در 7 سپتامبر برگزار شد. این اولین باری نیست که جان در مکان دیدنی لندن اجرا می کند. در سال 2014، او یک کنسرت خصوصی در محل برگزاری به مناسبت بازسازی مسکونی و تجاری ساختمان اجرا کرد. روز سه‌شنبه، اپل از افتتاح فضای جدید و پیشرفته خود خبر داد که دارای سیستم صوتی فضایی با ۴۸ بلندگو و یک استیج با عرض ۳۸ فوت قابل تنظیم است. این فضا همچنین شامل دو استودیوی ضبط و میکس اختصاصی است و برای 16 دوربین یا بیشتر که اتاق کنترل پخش را به طور هدفمند ساخته‌اند، سیم‌کشی شده است تا هنرمندان بتوانند محتوای زیادی را در نمایش‌ها ثبت کنند. در سال 2022، غول فناوری به طور رسمی مقر لندن خود را در محل Battersea افتتاح کرد. منطقه بازسازی‌شده دارای استودیوهایی برای میزبانان رادیو موزیک اپل در لندن است تا از آن‌ها پخش کنند. اپل"}, {"source": "Billboard", "title": "Latin Music Revenue Grows 8.6% to $542M at Mid-Year, Outpacing Overall U.S. Market: RIAA", "link": "https://www.billboard.com/pro/latin-music-riaa-mid-year-report-revenue-rises/", "summary": "Latin music revenue in the U.S. reached $542.2 million in the first half of 2026, up 8.6% from the same period last year, according to the latest report from the Recording Industry Association of America (RIAA). That growth outpaced the overall U.S. recorded music market, which rose 6.9% during the same period. The results mark Latin music s 13th consecutive mid-year gain. The genre represented 9.1% of total U.S. recorded music revenue in the first half of the year, up from 8.8% at mid-year 2025 . Streaming continued to drive consumption, accounting for 96% of Latin music revenue. Revenue from paid subscriptions grew 12.4% to $308.4 million, representing 56.9% of the genre s total revenue. Related Billboard Latin Music Week Returns to Miami in 2026 Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction Physical formats also posted bigger gains, with earnings more than tripling — rising 232.2% to $14 million. Vinyl accounted for nearly all of that total, rising 245.8% to $13.7 million, as fans continued to embrace the format. Synchronization revenue more than doubled, increasing 104.2% to $3.3 million from placements in film, TV, advertising, video games and other audiovisual productions. “Latin music keeps raising the bar as more fans connect with the artists they love and discover new favorites, Rafael Fernandez Jr. ,RIAA senior vp of state public policy and Latin music, said in a statement. Whether your first experience is an iconic performance like Bad Bunny at the Super Bowl or Shakira Burna Boy’s World Cup anthem, a shared playlist or passed through a friend’s vinyl collection, there are more ways than ever to uncover and enjoy Latin music.” Bad Bunny ’s multi-Emmy-winning Super Bowl LX halftime show — the first in NFL history performed almost entirely in Spanish — and Shakira and Burna Boy ’s 2026 FIFA World Cup hit, “Dai Dai,” offered high-profile examples of Latin music’s expanding reach in the U.S. Dai Dai became the first World Cup song to top both the Billboard Global 200 and Billboard Global Excl. U.S. charts.", "date_str": "2026-09-25T13:15:00+00:00", "hash": "2fec81ca2c0d51d3", "title_fa": "RIAA: درآمد موسیقی لاتین در اواسط سال 8.6 درصد رشد کرد و به 542 میلیون دلار رسید و از کل بازار ایالات متحده پیشی گرفت.", "summary_fa": "بر اساس آخرین گزارش انجمن صنعت ضبط آمریکا (RIAA)، درآمد موسیقی لاتین در ایالات متحده در نیمه اول سال 2026 به 542.2 میلیون دلار رسید که 8.6 درصد نسبت به مدت مشابه سال گذشته افزایش یافته است. این رشد از کل بازار موسیقی ضبط شده ایالات متحده پیشی گرفت که در مدت مشابه 6.9 درصد افزایش یافت. نتایج نشان دهنده سیزدهمین موفقیت متوالی موسیقی لاتین در اواسط سال است. این ژانر 9.1 درصد از کل ایالات متحده را تشکیل می داد. درآمد موسیقی ثبت شده در نیمه اول سال از 8.8 درصد در اواسط سال 2025 افزایش یافته است. پخش جریانی همچنان مصرف را افزایش می دهد و 96 درصد از درآمد موسیقی لاتین را تشکیل می دهد. درآمد حاصل از اشتراک های پولی با 12.4 درصد رشد به 308.4 میلیون دلار رسید که 56.9 درصد از کل درآمد این ژانر را تشکیل می دهد. هفته موسیقی لاتین بیلبورد مرتبط در سال 2026 به میامی بازمی‌گردد بیلبورد برای افزودن آلبوم‌های رسانه‌های هوشمند به عنوان فرمت‌های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل Tupac Shakur انجام می‌دهد فرمت‌های فیزیکی نیز سودهای بزرگ‌تری داشتند، با بیش از سه برابر شدن درآمد - 2٪ افزایش به 231 دلار. وینیل تقریباً کل این مبلغ را به خود اختصاص داد و با افزایش 245.8 درصدی به 13.7 میلیون دلار رسید، زیرا طرفداران همچنان از این فرمت استقبال کردند. درآمد همگام سازی بیش از دو برابر شد و با افزایش 104.2 درصدی به 3.3 میلیون دلار از محل قرارگیری در فیلم، تلویزیون، تبلیغات، بازی های ویدیویی و سایر تولیدات سمعی و بصری رسید. رافائل فرناندز جونیور، معاون ارشد سیاست عمومی ایالتی و موسیقی لاتین، در بیانیه ای گفت: \"موسیقی لاتین همچنان سطح بالای خود را افزایش می دهد زیرا طرفداران بیشتری با هنرمندان مورد علاقه خود ارتباط برقرار"}, {"source": "Billboard", "title": "Today Is Dolly Parton Day – It’s 9/25", "link": "https://www.billboard.com/music/music-news/today-is-dolly-parton-day-9-25-1236346775/", "summary": "Today is officially Dolly Parton Day in the state of California and in dozens of municipalities across the U.S. The date’s significance should be obvious to fans of the late country music legend: 9-2-5 references Parton’s hit single “9 to 5” from the 1980 film of the same in which she starred alongside Jane Fonda and Lily Tomlin . Related Country Music Association To Salute Dolly Parton With Live, 2-Hour TV Special See the Best Dolly Parton Musical Tributes, From Harry Styles, Katy Perry, John Mayer, Jack White More Kacey Musgraves to Perform on 2026 VMAs in Tribute to Dolly Parton We could all afford to live a little more like Dolly, California Gov. Gavin Newsom said in a statement announcing the passage of SB931, which may be the least controversial bill he’ll ever sign. Be kind, be humble, and have some fun… With this bill, we are not just establishing a day to celebrate Dolly Parton, we are creating an annual reminder to us, every year, to live the way she did — joyfully, graciously, and with a whole lot of heart. “Her legacy goes well beyond her music,” Sen. John Laird (D-Santa Cruz), who co-authored the bipartisan bill with Sen. Shannon Grove (R-Bakersfield), said in a statement. “Now, every 9-2-5, California gets to celebrate Dolly and the remarkable legacy she shared with all of us.” “9 to 5” was an important record in Parton’s career. It was her first No. 1 hit on the Billboard Hot 100, her first Oscar nominee for best original song and a double Grammy winner (best country song and best country vocal performance, female). Read much more about this classic hit in Billboard ’s Forever No. 1 series . Related Forever No. 1: Dolly Parton, ‘9 to 5’ California SB931 – it’s too bad SB925 was already taken – was signed into law by Gov. Newsom on Sept. 20. It calls on the Governor to annually proclaim September 25 as Dolly Parton Day. Here are verbatim excerpts from the legislation : “International philanthropist, musician, and icon Dolly Parton dedicated her life to uplifting communities, promoting early literacy, and fostering a love of reading, learning, and music worldwide. “Dolly Parton lived a life of strong personal faith and displayed her beliefs through love, forgiveness, and compassion for others. She approached life with optimism, responsibility, and a humbleness that inspired millions of people. “Beyond Dolly Parton’s legendary creative career, she was a fierce advocate for equality and a beloved ally to the LGBTQ+ community, exemplifying a life", "date_str": "2026-09-25T13:00:00+00:00", "hash": "0014dce62d6b6fa4", "title_fa": "امروز روز دالی پارتون است - 25/9 است", "summary_fa": "امروز به طور رسمی روز دالی پارتون در ایالت کالیفرنیا و در ده‌ها شهر در سراسر ایالات متحده است. اهمیت این تاریخ باید برای طرفداران افسانه موسیقی کانتری آشکار باشد: 9-2-5 به آهنگ موفق پارتون \"9 تا 5\" از فیلم سال 1980 اشاره می‌کند که در آن او در کنار جین فوندا و لیلی تاملین بازی کرد. انجمن موسیقی کانتری مرتبط برای ادای احترام به دالی پارتون با پخش زنده، ویژه تلویزیونی 2 ساعته، بهترین ادای احترام به دالی پارتون، از هری استایلز، کیتی پری، جان مایر، جک وایت را ببینید. اعلام تصویب SB931، که ممکن است کم بحث‌برانگیزترین لایحه‌ای باشد که او تا به حال امضا کرده است. مهربان باشید، متواضع باشید و کمی خوش بگذرانید... با این لایحه، ما نه تنها روزی را برای جشن گرفتن دالی پارتون تعیین می کنیم، بلکه هر سال یادآوری سالانه برای ما ایجاد می کنیم که همانطور که او زندگی می کرد - با شادی، مهربانی، و با تمام قلب. سناتور جان لیرد (D-Santa Cruz)، که لایحه دو حزبی را با سناتور شانون گروو (R-Bakersfield) نویسند، در بیانیه ای گفت: \"میراث او فراتر از موسیقی او است.\" اکنون، هر 9-2-5، کالیفرنیا می تواند دالی و میراث قابل توجهی را که او با همه ما به اشتراک گذاشته است، جشن بگیرد. \"9 به 5\" یک رکورد مهم در حرفه پارتون بود. این اولین آهنگ شماره 1 او در بیلبورد Hot 100، اولین نامزد اسکار او برای بهترین آهنگ اصلی و برنده دوبار گرمی (بهترین آهنگ کانتری و بهترین اجرای آواز کانتری، زن) بود. درباره این موفقیت کلاسیک در مجموعه شماره 1 بیلبورد برای همیشه لطفاً بیشتر بخوانید. مربوط به Forever No. 1: دالی پارتون، '9 تا 5' کالیفرنیا SB931 - خیلی بد است که SB925 قبلاً گرفته شده بود - در 20 سپتامبر توسط فرماندار نیوزوم امضا شد. این قانون از فرماندار می"}, {"source": "Billboard", "title": "Hermanos Gutiérrez’s ‘Los Ojos Del Cóndor’ Album Is an Ode to South America’s Andes Mountains: ‘It Felt Like a Dedication to This Whole Region’", "link": "https://www.billboard.com/music/latin/hermanos-gutierrez-interview-los-ojos-del-condor-1236347148/", "summary": "All it took was one photograph of Estevan and Alejandro Gutiérrez’s father standing in Machu Picchu in 1987 for the brothers, known as Hermanos Gutiérrez, to find inspiration for their next project. Their studio album, Los Ojos del Cóndor , which translates to the eyes of the condor, arrived Friday (Sept. 25) as a love letter to the stories, sounds and energetic magnetism of South America’s Andes mountain range. Related Hermanos Gutiérrez Release New Album Sonido Cósmico Produced by Black Keys Dan Auerbach SXSW s Film and Music Verticals See Largest Overlap Led By Jack Johnson s SURFILMUSIC Doc Beabadobee Blasts to No. 1 on ARIA Chart With Pylon “I think it was a natural calling that we felt before we went to the studio,” Alejandro said in an interview the brothers had with Billboard in June. “We felt like from the desert, from the cosmic sound that we had in the past, we just wanted to feel and discover a new landscape. And there s not another place that is as strong and powerful as the Andes in South America because it connects so many countries from north to south, and it felt like a dedication to this whole region.” Los Ojos del Cóndor is a 10-track album that connects Hermanos Gutiérrez’s cinematic work through a recurring musical motif, sometimes emerging through guitar, while other times through organ. This creates a sense of movement and continuity across the record. The brothers’ guitars weave through the arrangements, with Estevan playing every track on the nylon-string guitar his father gave him when he was 8. Alejandro also brings a new sound to the mix by playing the charango, an Andean stringed instrument, on several songs. Produced by The Black Keys’ Dan Auerbach, it’s the third studio album released by the Ecuadorian-Swiss duo that Auerbach sits behind, after first producing their 2022 breakout project El Bueno y El Malo and their 2024 LP Sonido Cósmico . The latter reached the Billboard 200 with its spacious and deep dreamy sound that intertwines guitar melodies and gentle Latin pulses driven by subtle percussion. “When we recorded in Nashville, Dan was there, and he was kind of supervising, but also he let us do what we wanted to do,” explains Estevan. “That feeling of having the freedom of being creative but knowing that the boss is approving everything — that felt really good. So this time at the studio, we felt very comfortable and I mean, all the time, but this was very special.” For the brothers, producing such an intentional project", "date_str": "2026-09-25T13:00:00+00:00", "hash": "4e57fd2fd01592ff", "title_fa": "آلبوم «Los Ojos Del Cóndor» هرمانوس گوتیرز، قصیده‌ای از کوه‌های آند آمریکای جنوبی است: «احساس تقدیم به این منطقه بود»", "summary_fa": "تنها کافی است یک عکس از پدر استوان و الخاندرو گوتیرز که در سال 1987 در ماچو پیچو ایستاده بودند تا برادران معروف به هرمانوس گوتیرز برای پروژه بعدی خود الهام بگیرند. آلبوم استودیویی آنها، Los Ojos del Cóndor، که به چشم کندور ترجمه می شود، جمعه (25 سپتامبر) به عنوان نامه ای عاشقانه به داستان ها، صداها و مغناطیس پرانرژی رشته کوه آند آمریکای جنوبی رسید. مرتبط هرمانوس گوتیرز انتشار آلبوم جدید Sonido Cósmico محصول Black Keys Dan Auerbach SXSW فیلم و موسیقی عمودی مشاهده بزرگترین همپوشانی به رهبری جک جانسون SURFILMUSIC Doc Beadobee Blasts به شماره 1 در استودیو ARIA، فکر می کنیم که ما قبل از فراخوانی نمودار ARIA طبیعی بودیم. الخاندرو در مصاحبه ای که برادران با بیلبورد در ماه ژوئن داشتند گفت. ما احساس می‌کردیم از صحرا، از صدای کیهانی که در گذشته داشتیم، فقط می‌خواستیم منظره جدیدی را احساس کنیم و کشف کنیم. و هیچ مکان دیگری به اندازه کوه های آند در آمریکای جنوبی قوی و قدرتمند نیست، زیرا بسیاری از کشورها را از شمال به جنوب به هم متصل می کند، و احساس می کند که یک وقف به کل این منطقه است. Los Ojos del Cóndor یک آلبوم 10 آهنگی ف حمایت از کتابخانه تخیل دالی پارتون خواهد شد. بلیت‌های تماشای فیلم تازه بازسازی شده استودیو قرن بیستم در سینماها اکنون فروخته شده است. اکران مجدد 9 به 5 در تئاتر امروز در روز «مثل دالی» اعلام شد، جشن سالانه جدیدی که جهان را تشویق می‌کند تا در زندگی کودک تغییر ایجاد کند و به ماموریت مادام‌العمر پارتون احترام بگذارد و کودکان را به رویاهای بیشتر، بیشتر بیاموز، مراقبت بیشتر و بیشتر ترغیب کند. اخبار مرتبط اخبار ادای احترام به دالی پارتون نوشته کیسی ماسگریوز برای یکشنبه‌ها VMA مسدود می‌شود. ادغام الیزابت وارن در گفتگوهای معامله با پارامونت از AGها برای خیانت فراخوانی می‌کند: یک برد فقط برای دیوید الیسون Give Like Dolly Day هر سال در 25/9 عنوان فیلمی به عنوان تاریخ انتخاب می‌شود. در ددلاین تماشا کنید در 9 تا 5، گروهی از زنان کارمند اداری، مدیر دانایی که رئیس را آموزش داده اما نمی‌تواند ترفیع بگیرد (لیلی تاملین)، یک تازه وارد گیج‌شده (جین فوندا) و یک منشی شخصی فریبنده که همه تصور می‌کنند در حال برقراری رابطه نامشروع هستند (دالی پارتون) همه با هم به دنبال انتقام‌گیری از مرد بدبخت هستند."}, {"source": "Deadline", "title": "‘Scrubs’ Stars On Joel Kim Booster & X Mayo’s Departures, Ava Bunn’s Promotion, J.D.’s New Foe & Giving Interns Their Own Episodes In Season 2", "link": "https://deadline.com/2026/09/scrubs-stars-joel-kim-booster-x-mayo-departures-tosh-grant-1237062497/", "summary": "ABC s Scrubs revival starring Zach Braff (John “J.D.” Dorian), Donald Faison (Christopher Turk) and Sarah Chalke (Elliot Reid) is undergoing some cast changes heading into its second season. Two prominent recurring players are leaving, Joel Kim Booster, who played scheming attending physician Dr. Kevin Park, and X Mayo as charge nurse Raymond. Meanwhile, as reported [ ]", "date_str": "2026-09-25T14:00:00+00:00", "hash": "a2f88aaa7caccc22", "title_fa": "ستاره های «Scrubs» در Joel Kim Booster & X Mayo’s Departures، تبلیغ آوا بان، دشمن جدید J.D.", "summary_fa": "احیای فیلم Scrubs ABC با بازی زک براف (جان «جی. دو بازیکن برجسته در حال ترک می‌شوند، جوئل کیم بوستر، که در نقش پزشک معالج دکتر کوین پارک د داد. Hedges از اوایل اکتبر با این شرکت شروع به کار خواهد کرد و با تیم Boat Rocker در MIPCOM حضور خواهد داشت. رادرفورد گفت: علاوه بر تجربه فراوان، نوئل در سراسر صنعت بسیار مورد توجه است، و ما از استقبال از او در تیم Boat Rocker Studios بسیار هیجان زده هستیم. این یک زمان هیجان انگیز برای شرکت ما است زیرا ما همچنان به اجرای اولویت های استراتژیک خود ادامه می دهیم، با تمرکز روشن بر سرمایه گذاری در IP عالی و به حداکثر رساندن ارزش آن در سراسر تجارت خود. پروژه های Boat Rocker عبارتند از Netflix s Bet و Geek Girl. بی بی سی، Binge و RT تولید مشترک Mix Tape ; سریال‌های بی‌بی‌سی اسکاتلند و اسکای نیوزلند The Ridge, Apple TVs Invasion and Palm Royale, BBC America و سریال CTV سریال Orphan Black و بچه‌ها The Next Step. هجز گفت: من برای پیوستن به Boat Rocker در زمانی که شرکت به طور عمدی در IP متمایز و با کیفیت بالا سرمایه گذاری می کند، هیجان زده هستم. من مشتاقانه منتظر همکاری با تیم برای تهیه پروژه های بلندپروازانه و تقویت و گسترش مجموعه"}, {"source": "Deadline", "title": "BBC Studios Names Mediawan’s Sally Habbershaw President Of Global Distribution", "link": "https://deadline.com/2026/09/bbc-studios-names-sally-habbershaw-president-distribution-1237113669/", "summary": "BBC Studios has a new global distribution chief in place. Sally Habbershaw is exiting Mediawan after less than a year to become President of Global Distribution at the BBC s commercial arm. Her London-based role will see her overseeing BBCS s worldwide content sales business, reporting into Zai Bennett, BBC Studios Global Content CEO and Chief Creative [ ]", "date_str": "2026-09-25T10:54:20+00:00", "hash": "4a8b78f4d2be3b00", "title_fa": "استودیو بی‌بی‌سی سالی هابرشاو مدیوان را رئیس توزیع جهانی معرفی کرد", "summary_fa": "استودیوی بی‌بی‌سی یک مدیر توزیع جهانی جدید دارد. سالی هابرشاو پس از کمتر از یک سال از مدیاوان خارج می شود تا رئیس بخش توزیع جهانی در بازوی تجاری بی بی سی شود. نقش او در لندن شامل نظارت بر تجارت جهانی محتوای بی‌بی‌اس خواهد بود و به زای بنت، مدیر اجرایی محتوای جهانی استودیو بی‌بی‌سی و مدیر ارشد خلاقیت [ ] استودیو بی‌بی‌سی در بیشتر سال بدون رئیس فروش بوده است، زیرا جانت براون مستقر در ایالات متحده در ژانویه به عنوان بخشی از برنامه‌ای برای انتقال توزیع مادر در بریتانیا به پایان رسید. Habbershaw پست جدید خود را در 29 سپتامبر آغاز می کند. داستان های مرتبط اخبار Doctor Who Re-Gen Is Go! بی‌بی‌سی از تهیه‌کنندگان می‌خواهد که چشم‌انداز جدید و شجاعانه‌ای را برای مجموعه‌های علمی تخیلی ارائه کنند اخبار استودیو بی‌بی‌سی لس‌آنجلس، رئیس بدون فیلمنامه رایان او داود را برای نظارت بر فیلمنامه به عنوان مارک لینزی ارتقا می‌دهد انجی استفنسون گفت که خروج سالی یکی از موفق‌ترین و محترم‌ترین مدیران در کسب‌وکار است و تجربه‌اش در سرمایه‌گذاری محتوا، توزیع، پلت‌فرم‌های مبتنی بر موقعیت جهانی و تولید جهانی باعث می‌شود که وی تجربه‌اش را در زمینه سرمایه‌گذاری محتوا، توزیع، پلت‌فرم‌های مبتنی بر موقعیت شبکه و تولید جهانی هدایت کند. Watch on Deadline او ترکیبی نادر از رهبری تجاری، غرایز خلاق و تخصص عمیق در بازار جهانی را به همراه سابقه ای استثنایی در ایجاد مشارکت و ارائه رشد در برخی از موفق ترین کسب و کارهای محتوایی صنعت به ارمغان می آورد. من مشتاقانه منتظر همکاری با او هستم زیرا ما همچنان به حداکثر رساندن ارزش و دسترسی به مجموعه محتوای برجسته خود ادامه می دهیم. Habbershaw این بار در سال گذشته در آستانه MIPCOM کن، زمانی که او جایگزین Valerie Vleeschhouwer در Mediawan فرانسه شد، موضوع اخبار بود. او به عنوان مدیر توزیع در تولیدکننده نوجوانان"}, {"source": "Deadline", "title": "Percy Hynes White & Jeff Wahlberg Lead Lovers-On-The-Run Thriller ‘Crime Novella’, Roland Emmerich Exec-Producing & First Look Revealed", "link": "https://deadline.com/2026/09/percy-hynes-white-jeff-wahlberg-lead-film-crime-novella-1237113163/", "summary": "EXCLUSIVE: Percy Hynes White (My Old Ass), Jeff Wahlberg (Euphoria), Zlatko Burić (Triangle of Sadness), Bobby Soto (The Tax Collector) and Ava del Cielo (House of Cards) have been cast in writer-director Omar de Soto s feature directorial debut, Crime Novella, which was shot on 35mm film. Written, directed and produced by de Soto, the romance [ ]", "date_str": "2026-09-25T10:00:00+00:00", "hash": "41fb39ef57e2a931", "title_fa": "پرسی هاینس وایت و جف والبرگ نقش اصلی فیلم عاشقان در حال اجرا «Crime Novella»، رولاند امریش، تهیه‌کننده اجرایی و اولین نگاه رونمایی شد", "summary_fa": "انحصاری: پرسی هاینس وایت (الاغ قدیمی من)، جف والبرگ (سرخوشی)، زلاتکو بوریچ (مثلث غم)، بابی سوتو (مالیات‌گیرنده) و آوا دل سیلو (خانه پوشالی) در فیلم سینمایی عمر دو سوتو، نویسنده و کارگردان، نقش آفرینی کرده‌اند. به نویسندگی، کارگردانی و تهیه کنندگی دو سوتو، این رمان عاشقانه [ ] انحصاری: پرسی هاینس وایت (الاغ قدیمی من)، جف والبرگ (سرخوشی)، زلاتکو بوری (مثلث غم)، بابی سوتو (مالایه‌گیرنده) و آوا دل سیلو (خانه پوشالی، کارگردان و کارگردان فیلمنامه‌نویس او) Crime Novella که بر روی فیلم 35 میلی متری فیلمبرداری شده است. نویسندگی، کارگردانی و تهیه‌کنندگی این فیلم جنایی-هیجان‌انگیز عاشقانه، داستان دو عاشق را روایت می‌کند که برای نجات رابطه‌شان فرار می‌کنند و متوجه می‌شوند که چقدر باید برای با هم ماندن پیش بروند. در زیر یک تصویر نگاه اول است. تولید تابستان امسال با فیلمبرداری در لوکیشن آلبوکرکی، نیومکزیکو، لس آنجلس، لاس وگاس و مکزیک به پایان رسید. علاوه بر دو سوتو، این فیلم توسط پل بنت چهارم از Replica و مارکو شپرد (میدوی) از Centropolis Entertainment تهیه شده است که بودجه این فیلم را تامین کرده است. رولاند امریش تهیه کننده اجرایی است. جسیکا اولتوف و هلنا مارتل سوارد از تهیه کنندگان مشترک این فیلم هستند. داستان های مرتبط بازیگران Euphoria بازیگران جف والبرگ در نقش تکرارشونده برای فصل 3 اخبار چگونه خاویر تورپ پرسی هاینز وایت از چهارشنبه نتفلیکس نوشته شد تهیه کنندگان فیلم را به عنوان یک نسل مدرن از Badlands و Wild at Heart با روحیه متجاوز توصیف می کنند. عمر دو سوتو، شوهر استاد فاجعه Emmerich، گفت: نمی توانستم بازیگر مناسب تری بخواهم."}, {"source": "Deadline", "title": "Tales Of Syria’s Disappeared; Lebanese Wartime Adoption & Palestinian Mental Health Set For Cinemed-Aflamuna Project Incubator", "link": "https://deadline.com/2026/09/cinemed-aflamuna-project-incubator-selection-2026-1237113656/", "summary": "France’s Montpellier Mediterranean Film Festival, also known as agnolias aan", "link": "https://www.netflix-nederland.nl/netflix-kondigt-direct-opvolger-sweet-magnolias-aan/", "summary": "Sweet Magnolias is niet meer, rest in peace , rust in vrede, máár jawel, er is wel een maar , want deze populaire serie krijgt wél een opvolger, van dezelfde maker, (vermoedelijk) met dezelfde hoofdrolspeler! Ladies of the House Vlak voor de zomer kwam het vijfde seizoen van Sweet Magnolias uit, maar eigenlijk vielen de kijkcijfers een beetje tegen: de nieuwe afleveringen scoorden 30 procent minder kijkers dan seizoen 4, 2,8 miljoen weergaven in de eerste week, en dat was gewoonweg niet goed genoeg. Het is daarom niet zo n hele grote verrassing dat er geen zesde seizoen komt, maar jammer is het wel, omdat het verhaal nog niet helemaal afgerond was. Zou het ooit nog goed komen tussen Annie en Ty? Dat komen we nóóit te weten. Dan het goede nieuws: Netflix heeft wel een nieuwe serie besteld bij de maker van Sweet Magnolias, Sheryl J. Anderson. Het gaat om Ladies of the House, dat gebaseerd is op de gelijknamige roman van Lauren Edmondson. Daisy Richardson en haar twee volwassen dochters, Wallis en Cricket, staan centraal. Hun leven verandert plotseling wanneer de charismatische eigenaar van de familiewijngaard onverwacht overlijdt. De drie vrouwen blijven achter met niet alleen hun verdriet, maar ook de verantwoordelijkheid om het wijnbedrijf overeind te houden. Daarvoor moeten ze eerst hun eigen gecompliceerde onderlinge relatie zien te herstellen. JoAnna Garcia Swisher Qua sfeer lijkt het behoorlijk in het verlengde van Sweet Magnolias te liggen: een warm familiedrama met romantiek. Daarnaast is Sweet Magnolias-ster JoAnna Garcia Swisher nauw betrokken bij het nieuwe project. Zij produceert Ladies of the House samen met Kate Gordon en wordt ook met een rol in de serie in verband gebracht. Swisher heeft al gezegd dat ze bij het lezen van het boek direct viel voor Daisy, Cricket en Wallis vanwege hun onderlinge relaties, hun imperfecties, kracht e  "title": "Pas uitgebrachte hitserie nu al verlengd", "link": "https://www.netflix-nederland.nl/pas-uitgebrachte-hitserie-nu-al-verlengd/", "summary": "We hebben goed nieuws! Tromgeroffel een dramaserie die onlangs pas uitgebracht is op Netflix, en metéén een hit bleek, is nu al verlengd. Jawel, er komt een tweede seizoen, zo heeft de streamingdienst officieel bekendgemaakt. Crew Girl krijgt tweede seizoen Het gaat om Crew Girl, dat in twee weken tijd liefst 16,5 miljoen kijkers heeft getrokken. Dat succes smaakt naar meer en daarom wordt er dus een seizoen 2 gemaakt. Hoofdrolspeelster Miku Martineau (Teagan) zegt tegen Tudum: Ik kan echt niet wachten op het tweede seizoen van Crew Girl ! Er valt nog zoveel te ontdekken rond de personages, de romances en het roeiteam het wordt sowieso een wilde rit! Verhaal Crew Girl Crew Girl is coming-of-age drama dat het verhaal van de 16-jarige Teagan vertelt, een getalenteerde jonge roeister wier leven volledig op zijn kop komt te staan nadat een schandaal haar familie in de schijnwerpers zet. Op zoek naar een nieuwe start belandt ze op een prestigieuze kostschool, waar ze hoopt haar verleden achter zich te laten en zich opnieuw op haar sport te kunnen richten. Die nieuwe start verloopt echter allesbehalve volgens plan. In plaats van zelf in een boot te stappen als roeister, wordt Teagan aangesteld als stuurvrouw van het jongensroeiteam. Ze moet leidinggeven aan een groep ambitieuze teamgenoten die niet allemaal staan te springen om instructies aan te nemen van een nieuw meisje. Terwijl het team zich voorbereidt op belangrijke wedstrijden, probeert Teagan hun vertrouwen te winnen en tegelijkertijd haar eigen plek binnen de schoolgemeenschap te veroveren. Buiten het roeien om krijgt ze te maken met alles wat hoort bij het leven op een kostschool: nieuwe vriendschappen, rivaliteiten, eerste liefdes, sociale druk en de constante aanwezigheid van klasgenoten die nieuwsgierig zijn naar haar verleden. Naarmate de trainingen intensiev ls gewone burger werkelijk geen idee van had Vervolgens krijgt hij de vraag of hij misschien meer sympathie heeft gekregen voor de adel: Absoluut. Iedereen heeft een reden om de dingen te doen die hij doet. En als laatste laat hij zich uit over Grande de España: Ik hoop dat het publiek ervan geniet. Grande de España verschijnt op 23 oktober 2026 op Netflix en hieronder kun je de trailer alvast checken! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Nieuwe Spaanse dramedy op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-24T14:50:20+00:00", "hash": "c5f0c8e1d1efd0c3", "title_fa": "\"درام\" جدید اسپانیایی در نتفلیکس", "summary_fa": "سریال‌های درام هستند، سریال‌های کمدی هم هستند، اما گاهی یک سریال هم زیر مجموعه درام و هم کمدی قرار می‌گیرد. و سپس یک درامدی است! نتفلیکس به زودی یک درام جدید ساخت اسپانیا را منتشر خواهد کرد. Grande de España Grande de España (یا به انگلیسی: Fading Grandeur) یک درام اسپانیایی شش قسمتی جدید است که توسط آلوارو فرناندز-آرمرو و خوان کاوستانی ساخته شده است. داستان حول محور دون لئاندرو (آنتونیو د لا توره)، مارکی است که زمانی به نخبگان اسپانیایی تعلق داشت، اما اکنون در تباهی مالی است. با این حال او سعی می کند به هر قیمتی ظاهر خود را حفظ کند. رویای بزرگ او این است که رسماً موقعیت معتبر گرانده اسپانیا را به دست آورد، اما برای آن به پول نیاز دارد. آخرین دارایی جدی او یک ویلای خانوادگی زیبا اما ویران در مادرید است. لئاندرو تصمیم می گیرد عمارت را بفروشد و فکر می کند که خریدار عالی را پیدا کرده است که تاجر ثروتمند سوفیا کارینگتون (الکساندرا جیمنز) علاقه نشان می دهد. به نظر می رسد فروش سریع بتواند مشکلات مالی او را حل کند. فقط معلوم می شود که سوفیا برنامه پنهان خود را دارد. علاوه بر این، با پیشرفت مذاکرات، بازی اغواگری بین این دو به وجود می آید. کم کم مشخص می شود که لئاندرو و سوفیا هر دو وانمود می کنند با آنچه واقعا هستند متفاوت هستند. بنابراین، یک نجیب زاده سقوط کرده، آنتونیو د لا توره، نقش یک نجیب زاده سقوط کرده را بازی می کند، و برای آماده شدن برای این
