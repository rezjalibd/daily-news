 sound about AI. Some of the companies betting biggest on AI are also among those hiring the most. Candidates are playing up their enthusiasm — even when they have reservations. College students might think twice before telling their professors how much they use AI . But in a job interview, the incentives can flip: Suddenly, having an AI story to tell is something to brag about. But what if you don't have much experience with AI — or simply aren't sold on it? Felisha Case was laid off as a program manager at LinkedIn in May. Now, she's regularly asked during job interviews how she used AI in her previous role. Case said she has limited experience to draw on because LinkedIn only pushed employees to really adopt the technology soon before she left. \"It can feel like we're being asked to go back and get a whole new education in AI,\" she said. As employers embrace AI and look for workers with experience using it, some job seekers say they're feeling pressure to demonstrate enthusiasm for the technology — even when they have reservations about its limitations and societal impacts. They're learning AI tools in order to have examples to discuss in interviews, playing up their interest in the technology, and trying to read the room to figure out just how much enthusiasm prospective employers want to hear. AI skills are appearing in more job postings , and some of the companies investing most heavily in the technology are also adding the most workers. A recent study by Ramp and Revelio Labs found that companies making the biggest investments in AI tended to see more employment growth than companies with smaller or no AI adoption How enthusiastic about AI do you need to be? A Big Tech employee currently looking for a new job said AI tools have helped him with small coding tasks and reviewing documents, but he's skeptical of the broader hype around the technology. \"If it all magically disappeared tomorrow I wouldn't shed a tear,\" he said. Nevertheless, he believes AI roles are \"where the money is\" and where much of the tech industry seems to be headed, so he's applied for several of them. He believes his AI skepticism may have worked against him during one interview, where he couldn't feign enthusiasm for a company he thought had an outlandish AI strategy. But if he were more desperate f", "date_str": "2026-09-08T09:20:01+00:00", "hash": "717898b9bdb02a37f3a4e2cefcf756262209baaee3155753b6abe6cfb0b59d01", "title_fa": "جویندگان کار در حال یادگیری یک مهارت مصاحبه جدید هستند: چگونه در مورد هوش مصنوعی هیجان زده به نظر برسند", "summary_fa": "برخی از جویندگان کار می گویند که در طول مصاحبه یاد می گیرند که چقدر در مورد هوش مصنوعی به صدا در می آید. Connect Images/Getty Images جویندگان کار در حال یادگیری یک مهارت مصاحبه جدید هستند: چقدر هیجان زده در مورد هوش مصنوعی به نظر می رسند. برخی از شرکت‌هایی که بزرگ‌ترین شرکت‌ها را روی هوش مصنوعی شرط‌بندی می‌کنند نیز جزو کسانی هستند که بیشترین استخدام را دارند. کاندیداها با اشتیاق خود را نشان می دهند - حتی زمانی که رزرو دارند. دانشجویان ممکن است قبل از اینکه به اساتید خود بگویند چقدر از هوش مصنوعی استفاده می کنند، دو بار فکر کنند. اما در یک مصاحبه شغلی، انگیزه ها می توانند تغییر کنند: ناگهان، داشتن یک داستان هوش مصنوعی برای گفتن چیزی است که می توان درباره آن لاف زد. اما اگر تجربه زیادی با هوش مصنوعی نداشته باشید - یا به سادگی با آن فروخته نشده باشید، چه؟ فیلیشا کیس در ماه می به عنوان مدیر برنامه در لینکدین اخراج شد. اکنون، مرتباً در طول مصاحبه های شغلی از او می پرسند که چگونه از هوش مصنوعی در نقش قبلی خود استفاده کرده است. کیس گفت که تجربه محدودی برای استفاده از آن دارد، زیرا لینکدین فقط کارمندان را وادار کرد تا قبل از رفتن او واقعاً از این فناوری استفاده کنند. او گفت: «ممکن است به نظر برسد که از ما خواسته شده است که به عقب برگردیم و یک آموزش کاملاً جدید در زمینه هوش مصنوعی دریافت کنیم. از آنجایی که کارفرمایان از هوش مصنوعی استقبال می کنند و به دنبال کارگرانی با تجربه در استفاده از آن می گردند، برخی از جویندگان کار می گویند که برای نشان دادن اشتیاق به این فناوری - حتی زمانی که در مورد محدودیت ها و تأثیرات اجتماعی آن محفوظ هستند، تحت فشار هستند. آنها در حال یادگیری"}, {"source": "Business Insider", "title": "I planned my wedding in 10 weeks — and it helped me land a Big Tech job. Years later, I'm navigating my first layoff.", "link": "https://www.businessinsider.com/wedding-planning-amazon-job-market-tech-layoff-linkedin-ai-interviews-2026-9", "summary": "Felisha Case was laid off from LinkedIn in May after roughly four years at the company. Felisha Case Felisha Case planned her wedding in 10 weeks, and it helped her land a job at Amazon. Case said personal connections have played a role in every tech job she's landed. Facing her first layoff, she says AI has made her latest job search feel different from past ones. This as-told-to essay is based on a conversation with Felisha Case, a former technical program manager at LinkedIn who was laid off in May. She's 40 and lives in the Denver area. The following has been edited for length and clarity. A week before I was laid off from LinkedIn, a colleague told me he'd heard something was coming. So I waited. One morning in May, I logged into my computer and went to grab a cup of coffee while it was booting up. When I came back, there was a meeting on my calendar that hadn't been there 30 seconds earlier. I checked my email. That's when I realized: If you have this meeting, you don't have a job. For the first time in my career, after roughly 13 years working at companies including Amazon, Oracle, Twitter, and LinkedIn, I'd been laid off. There had been layoffs at LinkedIn before, but I thought other roles were more likely to be affected. So the news came as a shock. As I began looking for work , I found myself reflecting on how I'd landed jobs in the past. My first tech job came about in an unusual way: through my wedding. My wedding unexpectedly helped launch my tech career In 2013, my husband and I got engaged, and we knew we didn't want a big wedding. I loved our anniversary date of September 26, which was 11 weeks after our engagement. So, we decided to put the wedding together quickly and get married on our anniversary. My in-laws had connected us with one of their former neighbors to take our engagement and wedding photos. The photographer also worked at Amazon . She said she was impressed by how quickly I'd planned the wedding and asked if I'd be interested in a program manager job on her team. She referred me for the role, which I eventually landed. I started at Amazon a couple of months after the wedding. Moving into tech was a huge financial change for my family. Before Amazon, I worked in a project management role outside the tech industry as an hourly employee. My husband and I didn't think I'd be able to continue working if we had children because my paycheck wouldn't have covered day care. Tech changed that. We were able to finally start thinking abo", "date_str": "2026-09-08T09:16:01+00:00", "hash": "445643d554759c8ffea75dc7243a9558c6625f82e05ecf1ecc5eb653dd0a10a7", "title_fa": "من عروسی خود را در 10 هفته برنامه ریزی کردم - و این به من کمک کرد تا شغلی در زمینه فناوری بزرگ پیدا کنم. سال‌ها بعد، در حال پیمایش اولین اخراجم هستم.", "summary_fa": "فیلیشا کیس در ماه مه پس از تقریباً چهار سال حضور در این شرکت از لینکدین اخراج شد. Felisha Case فلیشا کیس عروسی خود را در 10 هفته برنامه ریزی کرد و این به او کمک کرد تا در آمازون شغلی پیدا کند. کیس گفت که ارتباطات شخصی در هر شغل فنی که او پیدا کرده است نقش داشته است. او می گوید که در مواجهه با اولین اخراج خود، هوش مصنوعی باعث شده است که آخرین جستجوی شغلی او متفاوت از شغل های گذشته باشد. این مقاله گفته شده بر اساس گفتگو با فلیشا کیس، مدیر برنامه فنی سابق لینکدین است که در ماه می اخراج شد. او 40 سال دارد و در منطقه دنور زندگی می کند. موارد زیر برای طول و وضوح ویرایش شده است. یک هفته قبل از اینکه از لینکدین اخراج شوم، یکی از همکارانم به من گفت که شنیده است چیزی در راه است. پس منتظر ماندم. یک روز صبح در ماه مه، وارد کامپیوترم شدم و در حالی که در حال بوت شدن بود، رفتم تا یک فنجان قهوه بخورم. وقتی برگشتم، جلسه ای در تقویم من بود که 30 ثانیه قبل از آن آنجا نبوده بود. ایمیلم رو چک کردم آنجا بود که فهمیدم: اگر این جلسه را داشته باشی، شغلی نداری. برای اولین بار در حرفه‌ام، پس از حدود 13 سال کار در شرکت‌هایی از جمله آمازون، اوراکل، توییتر و لینکدین، اخراج شدم. قبلاً در LinkedIn اخراج هایی صورت گرفته بود، اما من فکر می کردم که نقش های دیگر بیشتر تحت تأثیر قرار می گیرند. بنابراین این خبر شوکه کننده بود. وقتی شروع به جستجوی کار کردم، متوجه شدم که چگونه در گذشته شغل پیدا کرده ام. اولین کار فنی من به روشی غیرعادی به وجود آمد: از طریق عروسی. عروسی من به طور غیرمنتظره ای به راه اندازی حرفه"}, {"source": "Business Insider", "title": "I grew my salary to $112K after a career pivot. A layoff broke my heart and changed my perception of money and success.", "link": "https://www.businessinsider.com/salary-journeys-112k-nutrition-tech-pivot-laid-off-portfolio-career-2026-9", "summary": "Evelyn Irwanto started her career in nutrition, pivoted to tech, and was laid off from her $112,000 job in September 2025. Courtesy of Evelyn Irwanto; Getty Images; Tyler Le/BI Evelyn Irwanto is a 32-year-old living in Toronto. She was a senior manager at a marketing and branding consultancy, making CA$155,000, or roughly $112,000, before she was laid off in September 2025. Business Insider has verified Irwanto's income and employment history with documentation. The following as-told-to essay has been edited for length and clarity. I got into health and fitness near the end of high school and thought I wanted to be a dietitian . Deep down, though, I truly had no idea what I wanted to do. I grew up in a pretty typical Asian immigrant family. My parents were pushing me toward more traditional fields like business, medicine, or law. In hindsight, a nutrition career was maybe a little act of rebellion — I wanted to do something that they didn't approve of. I was pretty steadfast, so they let me go for it, but I probably should've listened to them. Spoiler alert: I didn't go into a career in dietetics. Here's my salary journey. Nutrition associate (CA$14 an hour) and server (CA$11 an hour) After graduating with a degree in nutrition and food in 2017, I got a part-time role as a nutrition associate, making around $14 Canadian dollars an hour. I also worked as a server on the side, for around CA$11 an hour plus tips. It was tough, but at that time, I was young and had energy. I'd moved out on my own, and the jobs worked with my schedule. The nutrition associate job was typically 8-to-4 shifts, and then I'd do double shifts and serve at night, starting from 5 p.m. It was fun. I really enjoyed serving. I did that for 10 months, from August 2017 through May 2018. Salary Journeys is Business Insider's first-person series following real people and their real paychecks — how they built their income, what it means for their lives, and what they learned along the way. If you're willing to share how your salary has changed over time, please fill out this Google Form . 'Eat, Pray, Love' break, $0 During that time, I was looking for a full-time position, but after not being able to find one, I started to realize I didn't want to do nutrition full-time. I'd already kind of known it in college, around the time I took a gap year off school after going to Melbourne for an exchange program, but I kept following through the motions. In mid-2018, I left my nutrition associate and ", "date_str": "2026-09-08T09:05:01+00:00", "hash": "6ddb8a4758a1d679a8aede2ba90028ad7f7060174fb781ed06ec8f84d95adb24", "title_fa": "بعد از یک چرخش شغلی، حقوقم را به 112 هزار دلار افزایش دادم. یک اخراج قلبم را شکست و تصورم را از پول و موفقیت تغییر داد.", "summary_fa": "Evelyn Irwanto کار خود را در تغذیه آغاز کرد، به فناوری پرداخت و از شغل 112000 دلاری خود در سپتامبر 2025 اخراج شد. گتی ایماژ; Tyler Le/BI Evelyn Irwanto یک 32 ساله است که در تورنتو زندگی می کند. او قبل از اینکه در سپتامبر 2025 اخراج شود، یک مدیر ارشد در یک مشاوره بازاریابی و برندسازی بود و 155000 دلار کانادا یا تقریباً 112000 دلار درآمد داشت. Business Insider درآمد و سابقه اشتغال ایروانتو را با اسناد تأیید کرده است. مقاله زیر برای طولانی بودن و وضوح ویرایش شده است. نزدیک پایان دبیرستان وارد سلامت و تناسب اندام شدم و فکر کردم که می خواهم یک متخصص تغذیه باشم. با این حال، در اعماق وجودم، واقعاً نمی دانستم چه کاری می خواهم انجام دهم. من در یک خانواده کاملا معمولی مهاجر آسیایی بزرگ شدم. پدر و مادرم مرا به سمت رشته های سنتی تری مانند تجارت، پزشکی یا حقوق سوق می دادند. با نگاهی به گذشته، شغل تغذیه شاید یک اقدام شورشی کوچک بود - من می‌خواستم کاری را انجام دهم که آنها آن را تایید نکردند. من کاملا ثابت قدم بودم، بنابراین آنها به من اجازه دادند که آن را انجام دهم، اما احتمالاً باید به آنها گوش می کردم. هشدار اسپویلر: من وارد حرفه رژیم غذایی نشدم. این سفر حقوق من است. کاردان تغذیه (ساعت 14 دلار کانادا) و سرور (ساعت 11 دلار کانادا) پس از فارغ التحصیلی در رشته تغذیه و غذا در سال 2017، به عنوان کاریار تغذیه به صورت پاره وقت مشغول به کار شدم و حدود 14 دلار کانادا در ساعت درآمد داشتم. من همچنین به عنوان یک سرور در کنار کار کردم، با حدود 11 دلار کانادا در ساعت به اضافه نکات. سخت بود اما در آن زمان جوان بودم و انرژی داشتم. من خودم بیرون رفته بودم و کارها با برنامه"}, {"source": "Business Insider", "title": "'There's no accountability': AI startups keep claiming huge revenue. VCs say the math is getting 'murky.'", "link": "https://www.businessinsider.com/why-vcs-are-questioning-ai-companies-big-revenue-claims-2026-9", "summary": "Cluely CEO Roy Lee raised eyebrows earlier this year when he admitted to misstating his startup s ARR to a TechCrunch reporter. Kimberly White/Getty Images for TechCrunch VCs love surging annual recurring revenue (ARR). It's often how they value startups. But in the AI boom, VCs are increasingly skeptical of what that number actually represents. In short, recurring revenue is often not recurring. \"There's no accountability right now,\" said one VC. Few metrics thrill Silicon Valley investors more than surging annual recurring revenue (ARR). In the AI boom, however, VCs are increasingly skeptical of what that number actually represents. \"The amount of VC-backed AI companies lying about their ARR publicly is absolutely unsettling,\" Greg Isenberg, CEO of Late Checkout, wrote in a post that went viral for saying something out loud that has been whispered about, but rarely said publicly in tech circles. ARR was a metric that came into vogue during the software era, intended to estimate the yearly sales a company can expect from paying customers, a quick way for investors to judge a startup's valuation. Now, venture capitalists and founders who spoke with Business Insider said ARR has become so loosely used that it can blur the line between contracted subscriptions, future deals, token consumption, hardware sales, and a single strong month of revenue. In short, recurring revenue is often not recurring. \"It's ARR inflation,\" said Shruti Gandhi, a general partner at Array Ventures. \"There's no accountability right now.\" Gandhi says she has called out founders for exaggerating revenue. Their defense: \"Everybody else is doing it.\" To Alexander Niehenke, a partner at Scale Venture Partners, the current trend of padding ARR reflects a top-of-the-bubble mentality when founders have all the leverage. \"It feels like we're at the tail end of 2021 again, given some of the behavior I'm seeing in the venture ecosystem,\" he said. \"Anytime you get deeper into a bull cycle, everybody has more tolerance for risk.\" Founders know how excited VCs get about ARR, according to Niehenke. \"The smart and brilliant entrepreneurs use it like catnip on us,\" he said. Cluely CEO Roy Lee raised eyebrows earlier this year when he admitted to misstating his startup's ARR to a TechCrunch reporter. But that was very much the exception. With startups under much less regulatory scrutiny than public companies, revenue claims are rarely verified. it’s genuinely crazy tech has so isolated itself from re", "date_str": "2026-09-08T09:00:03+00:00", "hash": "634d51b074ca533cd0288745dee65429b4f943d68c92a650d8c991efd2b9a53f", "title_fa": "\"هیچ پاسخگویی وجود ندارد\": استارت آپ های هوش مصنوعی مدعی درآمدهای کلان هستند. VCها می گویند که ریاضیات در حال \"تاری\" شدن است.", "summary_fa": "روی لی، مدیر عامل Cluely، اوایل سال جاری وقتی اعتراف کرد که ARR استارتاپ خود را به یک خبرنگار TechCrunch اشتباه گفته است، اظهار نظر کرد. Kimberly White/Getty Images برای TechCrunch VCها عاشق افزایش درآمد سالانه تکرارشونده (ARR) هستند. اغلب ارزش آنها برای استارت آپ هاست. اما در رونق هوش مصنوعی، VCها به طور فزاینده ای نسبت به آنچه که این عدد در واقع نشان می دهد شک دارند. به طور خلاصه، درآمد مکرر اغلب تکراری نیست. یکی از VC گفت: \"در حال حاضر هیچ پاسخگویی وجود ندارد.\" معیارهای کمی بیش از افزایش درآمد سالانه تکرارشونده (ARR) سرمایه‌گذاران دره سیلیکون را هیجان زده می‌کنند. با این حال، در رونق هوش مصنوعی، VCها به طور فزاینده ای نسبت به آنچه که این عدد در واقع نشان می دهد شک دارند. گرگ ایزنبرگ، مدیرعامل Late Checkout، در پستی نوشت: «تعداد شرکت‌های هوش مصنوعی با پشتوانه VC که به طور علنی درباره ARR خود دروغ می‌گویند، کاملاً ناراحت‌کننده است.» ARR معیاری بود که در دوران نرم‌افزار رایج شد و هدف آن تخمین فروش سالانه یک شرکت از پرداخت مشتریان بود، راهی سریع برای سرمایه‌گذاران برای قضاوت در مورد ارزش‌گذاری استارت‌آپ. اکنون، سرمایه‌گذاران و بنیان‌گذاران خطرپذیر که با Business Insider صحبت کرده‌اند، می‌گویند که ARR به قدری ضعیف مورد استفاده قرار گرفته است که می‌تواند مرز بین اشتراک‌های قراردادی، معاملات آتی، مصرف توکن، فروش سخت‌افزار و یک ماه درآمد قوی را از بین ببرد. به طور خلاصه، درآمد مکرر اغلب تکراری نیست. شروتی گاندی، شریک عمومی در Array Ventures گفت: «این تورم ARR است. \"در حال حاضر هیچ پاسخگویی وجود ندارد.\" گاندی می گوید که بنیانگذاران را به دلیل اغراق در درآمدها صدا کرده است. دفاع آنها: \"همه دارند این کار را می کنند.\" از نظر الکساندر نیهنکه، یکی از شرکای Scale Venture Partners، روند فعلی padding ARR منعکس کننده یک ذهنیت برتر حباب"}, {"source": "Business Insider", "title": "It's not your imagination: Streaming services are showing you more ads this year", "link": "https://www.businessinsider.com/streaming-ad-loads-rise-streamer-price-increases-inflation-advertising-hollywood-2026-9", "summary": "Apple TV, which has shows like Slow Horses and Ted Lasso, is one of the only streamers without an ad-supported tier. Apple Streaming services with ads are showing customers more commercials this year. Ad loads rose 18% from January to August, according to data from Ampere Analysis. Hollywood is turning to ad-supported streamers as audiences tire of consistent price hikes. If you feel like you're watching commercials with TV in between — instead of the other way around — you're not alone. Streaming advertising loads have increased this year as consumers flock to cheaper, ad-supported plans in the face of steady streamflation . Ad minutes per hour rose 18% on top streamers in the US from January to August, according to data from entertainment research firm Ampere Analysis shared exclusively with Business Insider. \"Everyone is trying to squeeze more value out of existing subscribers, because it's become so much harder and so much more expensive, in terms of cost of customer acquisition, to keep growing,\" said Brandon Katz, an analyst at entertainment data firm Greenlight Analytics. Ad loads have increased on all but one of the streamers in Ampere's analysis. Of the nine most-viewed streaming services, as measured by Nielsen's US ratings , only Prime Video showed users fewer minutes of ads per hour last month than it did at the start of the year, Ampere found. Streamers showed audiences just over five minutes of ads per hour on average in August, according to Ampere. (The research firm said it changed how it tracks ad loads at the start of this year, which makes comparisons to prior years difficult.) Netflix had the biggest ad load increase from January to August, though it still shows the fewest ads per hour of any major streamer at less than 2.5 minutes per hour. By contrast, Paramount+ shows the most ads per hour on average, Ampere found. It's showing 9 minutes of ads per hour, which means fans of Taylor Sheridan shows like \"Landman\" are spending about 15% of their viewing time watching commercials. Disney's streamers are next on the list, showing between 7.5 and 8.5 minutes per hour across Disney+ and Hulu, respectively. There isn't a significant correlation between streamers' ad-tier price and average ad loads, Business Insider found. Ad-vancing streaming profits The additional ads that audiences are seeing on streamers come amid a profit push among Hollywood giants. \"Management teams are now being pushed by investors to show how they will capture the lar", "date_str": "2026-09-08T09:00:02+00:00", "hash": "98cfe8457d9b563e732afb3e512025d8017e082dc324c61abaadc652881c5372", "title_fa": "این تصور شما نیست: سرویس های استریم امسال تبلیغات بیشتری را به شما نشان می دهند", "summary_fa": "Apple TV که دارای نمایش هایی مانند Slow Horses و Ted Lasso است، یکی از تنها استریمرهایی است که سطح پشتیبانی از تبلیغات ندارد. سرویس‌های استریم اپل با تبلیغات امسال تبلیغات بیشتری را به مشتریان نشان می‌دهند. بر اساس داده های Ampere Analysis، بار تبلیغات از ژانویه تا آگوست 18 درصد افزایش یافته است. در حالی که مخاطبان از افزایش مداوم قیمت خسته می شوند، هالیوود به پخش کننده های تبلیغاتی روی می آورد. اگر احساس می کنید در حال تماشای تبلیغات با تلویزیون در بین آن هستید - به جای برعکس - شما تنها نیستید. بارهای تبلیغات جریانی امسال افزایش یافته است زیرا مصرف کنندگان در مواجهه با تورم جریانی مداوم به سمت طرح های ارزان تر و با پشتیبانی از تبلیغات هجوم آورده اند. بر اساس داده های شرکت تحقیقات سرگرمی Ampere Analysis که به طور انحصاری با Business Insider به اشتراک گذاشته شده است، دقایق تبلیغات در ساعت در پخش کننده های برتر در ایالات متحده از ژانویه تا آگوست 18 درصد افزایش یافته است. براندون کاتز، تحلیلگر شرکت داده های سرگرمی گرین لایت آنالیتیکس، می گوید: «همه سعی می کنند ارزش بیشتری را از مشترکین موجود کم کنند، زیرا از نظر هزینه جذب مشتری، بسیار سخت تر و گران تر شده است. بارهای تبلیغات در همه استریمرها به جز یکی از آنالیزهای Ampere افزایش یافته است. Ampere دریافت که از 9 سرویس استریم پربازدید، همانطور که توسط رتبه‌بندی Nielsen در ایالات متحده اندازه‌گیری می‌شود، فقط Prime Video در ماه گذشته تعداد دقیقه‌های تبلیغات کمتری را در هر ساعت به کاربران نشان داد نسبت به ابتدای سال. بر اساس گزارش Ampere، استریم‌کنندگان در ماه اوت به طور متوسط ​​بیش از پنج دقیقه تبلیغات در ساعت به مخاطبان نشان دادند. (شرکت تحقیقاتی گفت که نحوه ردیابی بارهای تبلیغات را در ابتدای سال جاری تغییر داده است، که مقایسه"}, {"source": "Business Insider", "title": "Legal tech is booming. A new VC firm wants lawyers in on the action.", "link": "https://www.businessinsider.com/lawyers-back-new-vc-firm-gcvc-legal-tech-investing-2026-9", "summary": "Erick Rabin and Matt Holbreich. GCVC More than 50 lawyers are launching a new venture fund, GCVC, to invest in legal tech. Funding is pouring into legal, but lawyers are rarely involved in deciding which tools get funded. GCVC's investors include current and former lawyers at Salesforce, ElevenLabs, Bilt, and Rippling. A lawyer, an investor, and a founder logged onto a Zoom call. It sounds like the opening of a joke. Instead, it's part of the origin story of GCVC, a venture fund that wants lawyers to have a stake in the startups remaking their profession. The firm came out of stealth on Tuesday with more than 50 general counsels investing their own personal capital, plus Wilson Sonsini as its first law firm backer. Matt Holbreich, a former Fenwick lawyer turned investor, described the effort in Lincolnesque terms: \"There's never really been a venture capital fund of lawyers, by lawyers, for lawyers,\" he said. Investors poured $2 billion into startups building for the legal sector in the first half of the year, according to Crunchbase. Early breakout winners are now valued in the billions of dollars. Yet the lawyers who use this software are rarely in the rooms deciding which tools get funded. GCVC is an attempt to change that. Holbreich founded the firm earlier this year with Erick Rabin, Bilt's general counsel and chief compliance officer. Investors include the current and former general counsels of Salesforce, ElevenLabs, Whatnot, Ro, Circle, and Rippling. Holbreich and Rabin declined to share the fund size, citing rules that prohibit investors from marketing a fundraise. The pair is betting that the group's collective pedigree — and closeness to the profession's problems — will help the fund gain access to legal's most exciting startups. Stilta was an early proof point. Founder Oskar Block left a job at McKinsey to develop software for patent work, then duly made the pilgrimage to Sand Hill Road to raise capital. He thought Stilta had finished its seed round when a term sheet from Andreessen Horowitz landed in his inbox, he recalled. Block stopped taking meetings. Then, Rabin and Holbreich called. The two law school buddies had started an investment fund backed by the same people Stilta was trying to reach: corporate counsels . \"There are so many different funds out there, and it can be hard as a founder to know which is better,\" Block said. \"With GCVC, it was so clear why they could make good intros and how they would do it.\" Stilta made room on its ca", "date_str": "2026-09-08T09:00:01+00:00", "hash": "1669cf9296f2a40be0690e0d4c9a530a8bb93c6d8716277ded7edb654f557fe8", "title_fa": "فناوری حقوقی در حال رونق است. یک شرکت جدید VC از وکلایی می خواهد که در این زمینه حضور داشته باشند.", "summary_fa": "اریک رابین و مت هولبریچ. GCVC بیش از 50 وکیل در حال راه اندازی یک صندوق سرمایه گذاری جدید به نام GCVC برای سرمایه گذاری در فناوری حقوقی هستند. بودجه در حال سرازیر شدن به سمت حقوقی است، اما وکلا به ندرت در تصمیم گیری در مورد ابزارهایی که بودجه دریافت می کنند دخالت می کنند. سرمایه گذاران GCVC شامل وکلای فعلی و سابق در Salesforce، ElevenLabs، Bilt و Rippling هستند. یک وکیل، یک سرمایه گذار و یک بنیانگذار وارد تماس زوم شدند. به نظر می رسد شروع یک شوخی است. در عوض، این بخشی از داستان اصلی GCVC است، یک صندوق سرمایه گذاری که می خواهد وکلا در استارتاپ هایی که حرفه خود را بازسازی می کنند، سهم داشته باشند. این شرکت روز سه‌شنبه با بیش از ۵۰ وکیل عمومی که سرمایه شخصی خود را سرمایه‌گذاری کردند، به‌علاوه ویلسون سونسینی به‌عنوان اولین حامی شرکت حقوقی آن، از مخفی کاری خارج شد. مت هولبریچ، وکیل سابق Fenwick که تبدیل به سرمایه‌گذار شده است، این تلاش را با عبارت لینکلنسک توصیف می‌کند: «هیچ‌وقت واقعاً یک صندوق سرمایه‌گذاری خطرپذیر متشکل از وکلا، توسط وکلا، برای وکلا وجود نداشته است. بر اساس گزارش Crunchbase، سرمایه گذاران در نیمه اول سال 2 میلیارد دلار برای ساخت استارت آپ ها برای بخش حقوقی سرمایه گذاری کردند. ارزش برندگان زودهنگام در حال حاضر میلیاردها دلار است. با این حال وکلایی که از این نرم افزار استفاده می کنند به ندرت در اتاق تصمیم می گیرند که کدام ابزارها بودجه دریافت کنند. GCVC تلاشی برای تغییر آن است. هولبریچ در اوایل سال جاری این شرکت را با اریک رابین، مشاور عمومی و مدیر ارشد قوانین بیلت تأسیس کرد. سرمایه گذاران شامل مشاوران عمومی فعلی و سابق Salesforce، ElevenLabs، Whatnot، Ro، Circle و Rippling هستند. هولبریچ و رابین با استناد به قوانینی که سرمایه‌گذاران را از بازاریابی جمع‌آوری"}, {"source": "Business Insider", "title": "11 politicians who have changed their tune on data centers", "link": "https://www.businessinsider.com/politicians-changing-views-ai-data-centers-backlash-2026-9", "summary": "A data center protest in Austin, Texas Jay Janner/The Austin American-Statesman via Getty Images The data center backlash is here. Across the country, leaders are shifting how they talk about data centers. Now, even previous vocal supporters are tempering their statements. America's elected officials have a different tune when it comes to data centers. Amid intense public pushback, elected officials and those running for office this November have moved to rein in support for data centers or enact pauses on their development entirely. Some, like Texas Gov. Greg Abbott, represent states that are already home to massive hyperscale projects. Others, like Rep. Byron Donalds of Florida, the GOP's gubernatorial nominee, may lead states that are sorting through such proposals. A few told us that they haven't changed their minds at all, rejecting the suggestion that they've evolved on the topic. Then there are those like Pennsylvania Gov. Josh Shapiro, who are open about how getting an earful has changed their outlook. What is clear is that AI has noticeably changed how elected officials talk about data centers, projects that many statewide officials once clamored to bring home. Here is how 11 officials are shifting their stances on data centers Kathy Hochul New York Gov. Kathy Hochul Michael M. Santiago/Getty Images In July, Gov. Kathy Hochul, a Democrat, made New York the first state to impose a one-year moratorium on what she called \"hyperscale AI data centers.\" The details: Her executive order states that the temporary ban applies to data centers that need 50 megawatts or more to operate. Additionally, Hochul separately ordered that data centers either pay for their own power generation or pay more for the energy they need. Past views: In May, Hochul questioned the need for a more stringent moratorium, which was being considered by the state legislature. \"This is a local decision for municipalities, it's land use, which is the purview of local governments,\" she told reporters, per E E News. \"It's not a statewide approach necessarily, but it's something I'm looking at intensely.\" The explanation: Hochul previously told NBC News that local communities had asked for her assistance. \"At first I thought this is more of a local decision, but then I realized they don't have the negotiating ability, the clout, the wherewithal to be able to negotiate the best benefits or to make sure that these companies, as I said in my State of the State, are either bringing their own", "date_str": "2026-09-08T08:43:01+00:00", "hash": "cd1e3016d24c827b4d799bcb4a1c7cee10d7273b09f1a2d39c3de31b328aa1be", "title_fa": "11 سیاستمداری که آهنگ خود را در مراکز داده تغییر داده اند", "summary_fa": "تظاهرات مرکز داده در آستین، تگزاس جی جنر/آستین-استاتمد آمریکایی از طریق گتی ایماژ واکنش واکنش مرکز داده اینجاست. در سرتاسر کشور، رهبران در حال تغییر نحوه صحبت در مورد مراکز داده هستند. در حال حاضر، حتی حامیان پر سر و صدا قبلی اظهارات خود را تعدیل می کنند. مقامات منتخب آمریکا در مورد مراکز داده، لحن متفاوتی دارند. در میان فشارهای شدید عمومی، مقامات منتخب و کسانی که در نوامبر امسال نامزد می‌شوند، حمایت از مراکز داده را مهار کرده یا به طور کامل توسعه آنها را متوقف کرده‌اند. برخی، مانند فرماندار تگزاس، گرگ ابوت، نماینده ایالت هایی هستند که در حال حاضر خانه پروژه های عظیم در مقیاس بزرگ هستند. دیگران، مانند نماینده بایرون دونالدز از فلوریدا، نامزد فرمانداری حزب جمهوری خواه، ممکن است ایالت هایی را رهبری کنند که در حال بررسی چنین پیشنهادهایی هستند. چند نفر به ما گفتند که اصلاً نظر خود را تغییر نداده‌اند و این پیشنهاد را رد کردند که در این موضوع تکامل یافته‌اند. سپس کسانی مانند جاش شاپیرو فرماندار پنسیلوانیا وجود دارند که در مورد اینکه چگونه گرفتن گوش نگرش آنها را تغییر داده است، صحبت می کنند. آنچه واضح است این است که هوش مصنوعی نحوه صحبت مقامات منتخب در مورد مراکز داده را به طرز محسوسی تغییر داده است، پروژه هایی که بسیاری از مقامات ایالتی زمانی فریاد می زدند که آنها را به خانه بازگردانند. کتی هوچول، فرماندار نیویورک، کتی هوچول، مایکل ام سانتیاگو/ گتی ایماژ در ماه ژوئیه، فرماندار کتی هوچول، یک دموکرات، نیویورک را به اولین ایالتی تبدیل کرد که برای آنچه که او آن را «مراکز داده های هوش مصنوعی در مقیاس فوق العاده» می نامید، تعطیلی یک ساله وضع کرد. جزئیات: دستور اجرایی وی بیان می کند که ممنوعیت موقت برای مراکز داده اعمال می شود که برای کار به 50 مگاوات یا بیشتر نیاز"}, {"source": "Business Insider", "title": "Why your coworker is suddenly obsessed with their little AI minions", "link": "https://www.businessinsider.com/ai-agents-bot-bragging-workplace-flex-2026-9", "summary": "Getty Images; Tyler Le/BI As AI threatens to upend white-collar work , some professionals are attempting to flip the script. Instead of being outboxed by the bots, they're building their own — and bragging about how many AI agents they manage. Mason Scurry says his AI consulting firm has more than 30 AI \"employees\" — complete with names, job titles, designated areas of responsibility, as well as personalities, backstories, and profile pics — that work around the clock for less than a penny an hour. Frankie, his chief of staff, is a longtime hotel head concierge from Bensonhurst, who keeps track of people and tasks, handles requests, and generally helps Scurry get things done. \"Whatever it is, he knows a guy,\" his bio, written by Claude Code , reads. Penny, his \"precise and never alarmist\" token auditor, hunts down waste in how the firm uses AI models and \"treats every wasted token as somebody's money.\" Maayan Sarig, a communications manager at Meta , says she manages a team of six, only one of whom is human. One agent, Moti, watches her work flow and suggests where she can save time. Another, Yonit, acts as a \"cynical journalist,\" stress-testing pitches before she sends them out. \"I don't just write,\" Sarig says. \"I design the agents that write.\" Derrick Hicks, a veteran marketer, posted that he built a team of 16 specialized AI agents — and then built another, which he named \"Conductor,\" to help him manage all of them. His agents can audit a company's SEO, social media, advertising, messaging, and competitors, then analyze the results — a process he says has gone from taking him three or four weeks to about an hour . \"The other way I could have done it is hire people, like junior marketers, to follow my playbook step by step,\" Hicks tells me. \"Instead, it's agents and code.\" That kind of productivity gain can be real. But so is the temptation to make it sound more impressive than it is. Unlike tokenmaxxing , which was largely engineers gaming internal leaderboards, agentmaxxing or bot bragging is AI status signaling for everyone else. As no-code tools make agents easier to build, the new flex isn't merely using AI — it's claiming an entire digital workforce. Amid anxiety about AI and jobs, \"I manage 20 agents\" sends a reassuring message: I'm not being replaced by AI . I'm the boss of it. Scurry, a recent Brown University graduate, says he posted his bot count on LinkedIn to demonstrate what he can do. \"Hey, potential client, this is how my system works,\" ", "date_str": "2026-09-08T08:07:01+00:00", "hash": "ff5732066d3cc98887ac20a2a82f47f0e7f8694526985acb9e294d1e97d2cf6a", "title_fa": "چرا همکار شما به طور ناگهانی شیفته یاران کوچک هوش مصنوعی خود می شود؟", "summary_fa": "گتی ایماژ; Tyler Le/BI از آنجایی که هوش مصنوعی تهدید می کند کار یقه سفید را به هم می زند، برخی از متخصصان در حال تلاش برای تغییر اسکریپت هستند. آنها به جای اینکه توسط ربات‌ها از جعبه خارج شوند، خودشان را می‌سازند - و درباره تعداد عامل‌های هوش مصنوعی که مدیریت می‌کنند لاف می‌زنند. میسون اسکوری می‌گوید شرکت مشاوره هوش مصنوعی او بیش از 30 کارمند هوش مصنوعی دارد - با نام‌ها، عناوین شغلی، حوزه‌های مسئولیت تعیین‌شده، و همچنین شخصیت‌ها، داستان‌های پس‌زمینه، و عکس‌های نمایه - که به صورت شبانه روزی برای کمتر از یک پنی در ساعت کار می‌کنند. فرانکی، رئیس کارکنان او، یک نگهبان قدیمی هتل از بنسونهورست است که افراد و وظایف را پیگیری می کند، درخواست ها را رسیدگی می کند و به طور کلی به اسکوری در انجام کارها کمک می کند. بیوگرافی او که توسط کلود کد نوشته شده است، می گوید: «هر چه که باشد، او یک پسر را می شناسد. پنی، حسابرس نشانه‌ای «دقیق و هرگز هشداردهنده» او، ضایعات را در نحوه استفاده شرکت از مدل‌های هوش مصنوعی جستجو می‌کند و «هر توکن هدر رفته را به عنوان پول دیگران در نظر می‌گیرد». مایان ساریگ، مدیر ارتباطات متا، می‌گوید که او تیمی شش نفره را مدیریت می‌کند که تنها یکی از آنها انسان است. یکی از ماموران، موتی، جریان کار او را تماشا می کند و به او پیشنهاد می دهد که کجا می تواند در زمان صرفه جویی کند. یکی دیگر، یونیت، به عنوان یک \"خبرنگار بدبین\" عمل می کند، قبل از اینکه آنها را بفرستد، تست استرس می کند. ساریگ می گوید: «من فقط نمی نویسم. من عواملی را که می نویسند طراحی می کنم. دریک هیکس، یک بازاریاب کهنه کار، پست کرد که تیمی متشکل از 16 کارگزار تخصصی هوش مصنوعی ساخته است - و سپس دیگری را"}, {"source": "Business Insider", "title": "Arm's CEO says AI could cure cancer, but data centers are creating a bottleneck", "link": "https://www.businessinsider.com/arm-ceo-says-ai-could-cure-cancer-data-centers-bottleneck-2026-9", "summary": "AI could cure cancer in his lifetime, says Arm CEO. Bloomberg/Getty Images Arm's CEO says AI can help cure cancer, but chip supply is a major hurdle. He said he expects memory supply to remain tight for some time. Data center growth in the US faces opposition due to environmental concerns and resource shortages. Arm's CEO says AI could help humanity cure cancer within our lifetimes. First, the industry needs to figure out how to make enough chips to power it. \"I've always thought that the killer app for AI is health,\" Rene Haas said in an interview with the BBC released on Tuesday. \"AI is going to not only shorten the amount of time that those drugs can be invented, it's going to shorten the amount of time that you test them.\" Haas has led Arm since February 2022, after joining the British chip designer in 2013. Before Arm, he spent seven years at Nvidia, where he was vice president of its computing products business. In the interview, the Arm CEO said that AI could crack problems that humans alone might not. \"I believe in our lifetime, AI will help cure cancer,\" he said. Getting there, however, will require enormous amounts of computing power, Haas said. And the chips needed for cancer research or humanoid development are being gobbled up by AI companies planning data centers measured in multiple gigawatts. \"Right now, it's quite constrained. We need more fabs before we can put a data center in space, I'll tell you that much,\" he said. \"We'll probably only put data centers in space when the biggest impediment to data centers is the cost of the data center.\" Haas said AI's appetite for chips and memory is at a scale the semiconductor industry hasn't dealt with before. Building new factories isn't a quick fix: fabs can cost tens of billions of dollars and take two or three years to construct. He said the industry was in an \"absolutely supply-constrained environment\" and expected supply to remain tight for some time. Even without the chip bottleneck, AI curing cancer in the next few years is far from guaranteed. This is because medical researchers say that cancer is not a single disease but a collection of over 100 diseases that vary in patients. While AI can help researchers identify targets and predict how drugs might behave, evidence of its clinically relevant impact remains limited. The wide range of variables in each body also makes it difficult for AI models to reliably predict how a potential drug will behave in humans. Data center boom Other chip exe", "date_str": "2026-09-08T06:47:18+00:00", "hash": "92c4b593e9eab4be678160c157a61b7cb0d5e72d766f5707a3142e092d590d65", "title_fa": "مدیر عامل Arm می گوید هوش مصنوعی می تواند سرطان را درمان کند، اما مراکز داده در حال ایجاد گلوگاه هستند", "summary_fa": "مدیرعامل Arm می گوید هوش مصنوعی می تواند سرطان را در طول زندگی او درمان کند. بلومبرگ/مدیر عامل گتی ایماژ آرم می گوید هوش مصنوعی می تواند به درمان سرطان کمک کند، اما تامین تراشه یک مانع بزرگ است. او گفت که انتظار دارد عرضه حافظه برای مدتی محدود باقی بماند. رشد مرکز داده در ایالات متحده به دلیل نگرانی های زیست محیطی و کمبود منابع با مخالفت روبرو است. مدیرعامل Arm می گوید هوش مصنوعی می تواند به بشریت در درمان سرطان در طول عمر ما کمک کند. ابتدا، صنعت باید بفهمد که چگونه تراشه های کافی برای تامین انرژی تولید کند. رنه هاس در مصاحبه‌ای با بی‌بی‌سی که روز سه‌شنبه منتشر شد، گفت: من همیشه فکر می‌کردم که اپلیکیشن قاتل برای هوش مصنوعی سلامتی است. هوش مصنوعی نه تنها مدت زمان اختراع این داروها را کوتاه می‌کند، بلکه زمان آزمایش آنها را نیز کاهش می‌دهد. هاس از فوریه 2022، پس از پیوستن به طراح چیپ بریتانیایی در سال 2013، رهبری Arm را بر عهده دارد. در این مصاحبه، مدیرعامل Arm گفت که هوش مصنوعی می‌تواند مشکلاتی را برطرف کند که انسان‌ها به تنهایی ممکن است نتوانند. او گفت: \"من معتقدم در طول زندگی ما، هوش مصنوعی به درمان سرطان کمک خواهد کرد.\" هاس گفت، با این حال، رسیدن به آنجا به مقدار زیادی قدرت محاسباتی نیاز دارد. و تراشه‌های مورد نیاز برای تحقیقات سرطان یا توسعه انسان‌نما توسط شرکت‌های هوش مصنوعی که مراکز داده‌ای با چندین گیگاوات اندازه‌گیری می‌کنند، بلعیده می‌شوند. «در حال حاضر، کاملاً محدود است. قبل از اینکه بتوانیم یک مرکز داده در فضا قرار دهیم، به شما می‌گویم، ما به تجهیزات بیشتری نیاز داریم.» او گفت: «احتمالاً تنها زمانی مراکز داده را در فضا قرار خواهیم داد که بزرگترین مانع برای مراکز داده هزینه مرکز داده باشد.» هاس گفت اشتهای هوش مصنوعی برای تراشه‌ها و"}, {"source": "Business Insider", "title": "One Canadian province is betting that being nice to Trump works", "link": "https://www.businessinsider.com/canada-us-trade-war-tariffs-carney-trump-alberta-diplomacy-smith-2026-9", "summary": "Canada has stepped up efforts to promote domestically produced goods as its trade fight with the US has intensified. Graham Hughes/NurPhoto/Getty Images Alberta is betting on diplomacy with Trump while other Canadian provinces hit back. The province's top US envoy says the softer approach is winning Alberta better access in Washington. The bet is being tested as Canada and the US unleash a fresh round of tariffs. As Canada escalates its trade war with President Donald Trump, Alberta is betting on a softer approach. The oil-rich province has resisted some of the retaliation embraced elsewhere in Canada, while Premier Danielle Smith has pushed for more engagement with Washington. Alberta's top representative in the US says that strategy is getting results. \"I think the premier's diplomacy-first approach has really not only been helpful for me, but certainly helpful for the province,\" Nathan Cooper told CBC's \"West of Centre\" podcast published on Friday. \"If we look at the impact of US tariffs on the Alberta economy, we have a disproportionately low impact,\" Cooper said. Cooper said US officials have been \"significantly more responsive\" to Alberta than to some other provinces. Alberta is the only remaining province with neither a ban nor a retaliatory levy on US alcohol imports, a stance Cooper said American officials have shown \"a real appreciation\" for. \"I believe that that's actually translated into results for the province of Alberta as well,\" Cooper said. Alberta also has some insulation from the trade war. Energy is exempt from Trump's latest 50% tariffs on Canadian goods, while Canada remains by far the biggest source of US crude imports. Smith has rejected calls to use Alberta's oil as leverage against Washington, including proposals to tax or restrict exports. Meanwhile, Saskatchewan Premier Scott Moe has also argued that oil and potash should stay out of the fight, even as his province put a 50% levy on American alcohol into effect on Tuesday. The softer stance comes as the broader US-Canada trade fight escalates. Prime Minister Mark Carney's government has struggled to reach a trade deal with Trump after months of negotiations. Canada's latest counter-tariffs take effect Tuesday, including 25% on US cheese and 50% on honey and aluminum foil. The retaliatory tariffs are in response to levies imposed by Trump last month on about $20 billion of Canadian goods after months of unsuccessful trade negotiations. The tensions have also spilled beyond trade.", "date_str": "2026-09-08T05:21:13+00:00", "hash": "695b925a888af560b16b31906d7e3acacd947911d9e7b80d59cd3d1bcb6f388f", "title_fa": "یکی از استان های کانادا شرط بندی کرده است که خوب بودن با ترامپ کارساز است", "summary_fa": "با تشدید جنگ تجاری خود با ایالات متحده، کانادا تلاش های خود را برای ترویج کالاهای تولید داخل افزایش داده است. گراهام هیوز/ نورفوتو/ گتی ایماژ آلبرتا روی دیپلماسی با ترامپ شرط بندی می کند در حالی که سایر استان های کانادا پاسخ می دهند. نماینده ارشد ایالات متحده این استان می گوید که رویکرد نرم تر، دسترسی بهتر آلبرتا به واشنگتن را به ارمغان می آورد. این شرط در حالی در حال آزمایش است که کانادا و ایالات متحده دور جدیدی از تعرفه ها را آغاز کرده اند. همزمان با تشدید جنگ تجاری کانادا با رئیس جمهور دونالد ترامپ، آلبرتا روی رویکرد ملایم تری شرط بندی کرده است. این استان نفت خیز در برابر برخی از اقدامات تلافی جویانه در سایر نقاط کانادا مقاومت کرده است، در حالی که نخست وزیر دانیل اسمیت برای تعامل بیشتر با واشنگتن فشار آورده است. نماینده عالی آلبرتا در ایالات متحده می گوید که استراتژی در حال نتیجه گرفتن است. ناتان کوپر در پادکست \"West of Centre\" شبکه سی‌بی‌سی که روز جمعه منتشر شد، گفت: «فکر می‌کنم رویکرد نخست دیپلماسی نخست‌وزیر نه تنها برای من مفید بوده، بلکه مطمئناً برای استان نیز مفید بوده است». کوپر گفت: «اگر به تأثیر تعرفه های ایالات متحده بر اقتصاد آلبرتا نگاه کنیم، تأثیر نامتناسبی کم خواهیم داشت. کوپر گفت که مقامات ایالات متحده \"به طور قابل توجهی پاسخگوتر\" به آلبرتا نسبت به برخی استان های دیگر بوده اند. آلبرتا تنها استان باقی مانده است که نه ممنوعیت و نه مالیات تلافی جویانه بر واردات الکل از ایالات متحده اعمال نمی شود، موضعی که کوپر گفت مقامات آمریکایی \"قدردانی واقعی\" از آن نشان داده اند. کوپر گفت: \"من معتقدم که این در واقع به نتایج برای استان آلبرتا نیز تبدیل شده است.\" آلبرتا همچنین از جنگ تجاری محافظت می کند. انرژی از آخرین تعرفه های 50 درصدی"}, {"source": "Business Insider", "title": "Trump said he'll stop Canada's Bombardier from being sold in the US", "link": "https://www.businessinsider.com/trump-stop-canada-bombardier-sold-us-2026-9", "summary": "Trump threatened to ban the sale of Bombardier aircraft in the US. John Keeble/Getty Images Trump threatened to stop Bombardier from selling its aircraft to the US. He said the Canadian manufacturer needs to build jets in the US to win business from US customers. The US Air Force and Federal Aviation Administration are customers of Bombardier. President Donald Trump doesn't want one particular Canadian aircraft crossing over into the US. In a Truth Social post on Monday, Trump wrote: \"No more selling Bombardier in the United States! Their products aren't good enough.\" Trump said that if the company wants business from the US, it needs to build its jets in the US. Bombardier, an aircraft manufacturer ia Getty Images Andrew Garfield has spent the past year moving between some wildly different roles. Now that it's over, he says he wants to do one thing: almost nothing. His favorite place to decompress at home is not where you might expect. Andrew Garfield , 43, said his ideal day off involves a lot of lying down and looking out the window. Speaking on Monday's episode of the \"Smartless\" podcast , the actor said he was happy to do very little after nearly a year of nonstop work. \"I can do it for a couple of months. I really can,\" Garfield said. He spent 11 months moving between dramatically different roles: Sam Altman in \"Artificial,\" a grieving farmer who leads a rebellion against King Richard II in \"The Uprising,\" and magician Roy Horn in the upcoming Apple TV+ series \"Wild Things.\" Constantly switching between the characters felt disorienting, he said. \"You get to the point sometimes where you're so deeply resentful of the work that you love to do so much, and that's kind of where I'm at,\" Garfield said. By the end of it, Garfield said he was ready to take a break, adding that some of his favorite ways to unwind include reading books, watching \"dumb TV,\" and \"literally looking out\" the window. \"I have a lovely window in my house, and there's a beautiful tree that I just stare at,\" he said. \"Again, it's like the most valuable commodity outside of live performance is quiet, and time, and space, and not having our attention snatched by the things that are always snatching our attention,\" he said. Garfield said he also values time with friends and family, who help keep him grounded. \"One of the gifts of being raised the way I was is that it was made very, very clear to me by osmosis that there was no way that I could ever allow myself to drink my own Kool-Aid enough to lose myself,\" he said. That perspective has also made him more conscious of the personal cost of spending months away from home for a job. \"I'm thinking about that more as I get older. In my 20s and 30s, it was like, I'll go anywhere any time, and I'll devote myself to this in a way that's probably a little unhealthy,\" Garfield said. But now, he feels that \"time is ticking\" and has become more aware that \"it's not forever,\" he said. Other celebrities have also spoken about how they enjoy their downtime. Hilary Swank has said that exercise helps her decompress when she's stressed. \"Ultimately, working out for me is ", "date_str": "2026-09-08T04:09:23+00:00", "hash": "a5c25d7359687637a4ad58a85e19198b3fe3ca5244d425740dc93010a23a0620", "title_fa": "اندرو گارفیلد می گوید یک نقطه از خانه اش پادزهر او برای فرسودگی شغلی است", "summary_fa": "اندرو گارفیلد از انجام کارهای زیادی در روز تعطیل خود لذت نمی برد. گیلبرت فلورس/ورایتی از طریق گتی ایماژ اندرو گارفیلد سال گذشته را بین نقش‌های بسیار متفاوت سپری کرده است. حالا که تمام شده، می گوید که می خواهد یک کار را انجام دهد: تقریباً هیچ کاری. مکان مورد علاقه او برای رفع فشار در خانه جایی نیست که شما انتظار دارید. اندرو گارفیلد، 43 ساله، گفت که روز ایده آل او شامل دراز کشیدن و نگاه کردن به بیرون از پنجره است. این بازیگر که در قسمت دوشنبه پادکست «بی‌هوشمند» صحبت می‌کرد، گفت خوشحال است که پس از نزدیک به یک سال کار بی‌وقفه، خیلی کم کار می‌کند. گارفیلد گفت: \"من می توانم این کار را برای چند ماه انجام دهم. من واقعا می توانم.\" او 11 ماه را بین نقش‌های بسیار متفاوت سپری کرد: سم آلتمن در «مصنوعی»، یک کشاورز غمگین که رهبری شورش علیه پادشاه ریچارد دوم در «قیام» را برعهده داشت، و روی هورن شعبده‌باز در سریال آینده اپل تی‌وی پلاس «چیزهای وحشی». او گفت که جابجایی مداوم بین شخصیت‌ها باعث سردرگمی می‌شد. گارفیلد می‌گوید: «گاهی اوقات به نقطه‌ای می‌رسی که از کاری که خیلی دوست داری انجامش بدهی، به شدت عصبانی می‌شوی، و من به نوعی در آن هستم. در پایان، گارفیلد گفت که آماده استراحت است، و افزود که برخی از راه‌های مورد علاقه‌اش برای استراحت عبارتند از خواندن کتاب، تماشای «تلویزیون گنگ» و «به معنای واقعی کلمه نگاه کردن به بیرون» از پنجره. او گفت: \"من یک پنجره دوست داشتنی در خانه ام دارم و یک درخت زیبا وجود دارد که فقط به آن r a glimpse of what it looked like in 2026. Additional reporting by Katherine Li. For decades, a city has risen at summer s end on a remote stretch of Nevada desert. Trevor Hughes/USA TODAY via Reuters Burners call this temporary metropolis Black Rock City. Andy Barron/USA TODAY via Reuters Roughly 70,000 people were expected to attend the art and music festival this year. Andy Barron/USA TODAY via Reuters They hauled the food, water, shelter, and supplies needed to survive a week. Trevor Hughes/USA TODAY via Reuters The mutant vehicles were a sight to see. Andy Barron/USA TODAY via Reuters Rain and heavy winds forced the gates closed on the first day. Andy Barron/USA TODAY via Reuters Mud has dogged the festival in recent years. Trevor Hughes/USA TODAY via Reuters These resourceful burners got creative with their footwear. Trevor Hughes/USA TODAY via Reuters The weather didn t appear to dampen the mood. Andy Barron/USA TODAY via Reuters Some of the fashion channeled Dune. Andy Barron/USA TODAY via Reuters Goggles were a practical accessory. Trevor Hughes/USA TODAY via Reuters The Man structure rose above the Cryptomeria, a treehouse-like pavilion at the center. Trevor Hughes / USA TODAY NETWORK via Imagn Images/Reuters Art installations took shape across the playa. Trevor Hughes/USA TODAY via Reuters Titantic s End showed two halves of a massive ocean liner sinking into the dry lake bed. Trevor Hughes/USA TODAY via Reuters Gazelle Dasti s artwork, Zarvan, links Persian culture and the idea of endless time. Andy Barron/USA TODAY via Reuters Burners escaped the heat under an acre-wide canopy at the festival s center. Reuters Organizers issued a new rule this year. Trevor Hughes/USA TODAY via Reuters Smart glasse", "date_str": "2026-09-07T19:51:52+00:00", "hash": "d3c197672346de977df9e35913a29d7792605243e7d8b117e1ab37a6fbf16836", "title_fa": "19 عکس سورئال، گل و لای، هرج و مرج و زرق و برق Burning Man را نشان می دهد", "summary_fa": "اندی بارون/ USA TODAY از طریق رویترز هر سال این سوال برمی گردد: آیا Burning Man برتری خود را از دست داده است؟ اولین میلیاردرهای فناوری، واحه صحرا را به زمین بازی خود تبدیل کردند. سپس جمعیت جوان جشنواره شروع به کم شدن کردند. Burning Man توسط ژنرال Z غیرعادی تلقی شده است: در سال 2025، 10٪ از شرکت کنندگان در نظرسنجی در دهه 20 زندگی خود بودند، در مقایسه با بیش از 30٪ در سال 2015. و هنوز هم، تخمین زده می‌شود که امسال حدود 70000 نفر به زیارت شهر بلک راک رفتند و در طوفان‌های گرد و غبار و ژیمناستیک لجستیکی برای زنده ماندن به مدت یک هفته در صحرا ایستادگی کردند. شاید Burning Man دیگر آن آزمایش ضدفرهنگ پیشرفته ای نباشد که قبلا بود. اما ماشین‌های هنری همچنان می‌چرخیدند، لباس‌ها همچنان می‌درخشیدند، و پلایا هنوز به خانه گروهی از خوش‌گذران تبدیل می‌شد که شبیه هیچ‌کس دیگری نبود. این عکس‌ها نگاهی اجمالی به ظاهر آن در سال 2026 نشان می‌دهند. گزارش‌های اضافی توسط کاترین لی. برای دهه‌ها، شهری در انتهای تابستان در قسمتی دورافتاده از صحرای نوادا برآمده است. Trevor Hughes/USA TODAY از طریق رویترز Burners این کلانشهر موقت را Black Rock City می نامند. اندی بارون/ USA TODAY از طریق رویترز انتظار می رفت امسال حدود 70000 نفر در جشنواره هنر و موسیقی شرکت کنند. اندی بارون/ USA TODAY از طریق رویترز آنها غذا، آب، سرپناه و لوازم مورد نیاز برای زنده ماندن یک هفته را حمل کردند. Trevor Hughes/USA TODAY از طریق رویترز وسایل نقلیه جهش یافته منظره ای برای دیدن بودند. اندی بارون/ USA TODAY از طریق رویترز باران و باد شدید در روز اول باعث بسته شدن دروازه‌ها شد. اندی بارون/ USA TODAY از طریق رویترز Mud در سال‌های اخیر جشنواره را پشت سر گذاشته است. Trevor Hughes/USA TODAY از طریق رویترز این مشعل"}, {"source": "Business Insider", "title": "I built my tiny home for under $50,000. Here are 5 things to consider before building your own.", "link": "https://www.businessinsider.com/tiny-home-builder-says-to-consider-these-things-before-construction-2026-9", "summary": "Margo Fairchild built a 240-square-foot tiny home largely by herself. Courtesy of Margo Fairchild In 2020, Margo Fairchild built a tiny home despite having no prior construction experience. It took her 15 months and $43,779 to build the 240-square-foot tiny home in Virginia. Here are five things Fairchild says people should consider before building a tiny home. In 2020, Margo Fairchild built a tiny home on her own, despite having no professional background in home construction. To take on the project, she relied on a mix of YouTube videos and homebuilding forums. She also created an Instagram page to document her progress, where architects and builders from around the world reached out to offer advice when she had questions. It took her 15 months to build her 240-square-foot, one-bedroom, one-bathroom tiny home. The $43,779 project cost more than she anticipated, but it has paid off. The home has been featured on tiny-home YouTube channels and local news outlets, leading to other opportunities for Fairchild, including a hosting role on HGTV's \" Worst Yard on the Block .\" \"Building this tiny home has changed everything about my life,\" Fairchild told Business Insider. \"It completely changed my perspective on how I look at perfectionism, and taught me so much about resilience, tenacity, and pushing through.\" Here are five things she says to consider before building a tiny home . 1. Plan for unexpected costs Aside from plumbing, Fairchild built the home herself. Courtesy of Margo Fairchild Tiny homes, which are typically under 400 square feet, can cost between $30,000 and $60,000 to build, according to Rocket Mortgage. But that estimate may not include expenses like permit fees, utilities, or hiring an architect or builder. Fairchild had to dip into her savings to finance her home. \"Basically, any paycheck I had during that time went toward construction,\" she said. \"Almost immediately, my budget flew out the window.\" Her advice to prospective tiny-home builders is to try to list every cost before getting started, from how much wood they'll need down to the screws and nails. They should also realize they might be missing some. \"When people are building these things by themselves, there are just all of these tiny miscellaneous costs that are going to add up that you just wouldn't have even anticipated,\" she said. 2. Decide whether a tiny home on a foundation or wheels is right for you Margo Fairchild in front of her Virginia tiny home. Courtesy of Margo Fairchil", "date_str": "2026-09-07T19:27:41+00:00", "hash": "2b3c2b92725b35471a575b6100d4730ada85d9aaf4e1924723e0016d97d7f5cc", "title_fa": "من خانه کوچکم را با کمتر از 50000 دلار ساختم. در اینجا 5 نکته وجود دارد که باید قبل از ساختن خود در نظر بگیرید.", "summary_fa": "مارگو فیرچایلد یک خانه کوچک به مساحت 240 فوت مربع را تا حد زیادی توسط خودش ساخت. با حسن نیت از Margo Fairchild در سال 2020، Margo Fairchild علیرغم اینکه هیچ تجربه قبلی در ساخت و ساز نداشت، یک خانه کوچک ساخت. ساخت این خانه کوچک 240 فوت مربعی در ویرجینیا 15 ماه و 43779 دلار طول کشید. در اینجا پنج نکته وجود دارد که فیرچایلد می گوید مردم باید قبل از ساختن یک خانه کوچک در نظر بگیرند. در سال 2020، مارگو فیرچایلد علیرغم نداشتن سابقه حرفه ای در ساخت خانه، به تنهایی یک خانه کوچک ساخت. برای انجام این پروژه، او به ترکیبی از ویدیوهای یوتیوب و انجمن های خانه سازی تکیه کرد. او همچنین یک صفحه اینستاگرام برای مستندسازی پیشرفت خود ایجاد کرد، جایی که معماران و سازندگان از سراسر جهان برای ارائه مشاوره در صورت داشتن سؤال، تماس گرفتند. 15 ماه طول کشید تا خانه کوچکی به مساحت 240 فوت مربع، یک اتاق خواب و یک حمام بسازد. این پروژه 43779 دلاری بیش از آنچه او پیش بینی می کرد هزینه داشت، اما نتیجه داد. این خانه در کانال‌های یوتیوب خانگی کوچک و رسانه‌های خبری محلی نمایش داده شده است که منجر به فرصت‌های دیگری برای Fairchild شده است، از جمله نقش میزبانی در \"بدترین حیاط در بلوک\" HGTV. فیرچایلد به Business Insider گفت: «ساخت این خانه کوچک همه چیز را در زندگی من تغییر داده است. این دیدگاه من را نسبت به نگاه من به کمال گرایی کاملاً تغییر داد و در مورد انعطاف پذیری، سرسختی و تلاش بسیار به من آموخت.» در اینجا پنج چیز است که او می گوید باید قبل از ساختن یک خانه کوچک در نظر بگیرید. 1. برای هزینه های غیرمنتظره برنامه ریزی کنید جدای از لوله کشی، فیرچایلد خانه را خودش ساخت. طبق اعلام Rocket Mortgage، ساخت خانه‌های کوچک"}, {"source": "Business Insider", "title": "I coach executives. AI makes their emotional intelligence more valuable, not less.", "link": "https://www.businessinsider.com/parenting-emotional-intelligence-kids-ai-future-work2026-9", "summary": "Pam Manfredo Curtis says parents should teach their kids how to name their emotions. JAGstudios/JAGstudios Pam Manfredo Curtis is an industrial and organizational psychologist and executive coach. Parents can help their kids succeed by teaching emotional intelligence, she says. Pointing out kids' strengths and asking them to identify their own can also help. This as-told-to essay is based on a conversation with Pam Manfredo Curtis, author of \" Origin of a Leader. \" It has been edited for length and clarity . It's no surprise that we often make choices based on how we were raised. I can see it in my own life: my mom was a school psychologist. I went into psychology, too, and married a man who is also an industrial and organizational psychologist, like me. In our field, there's a lot of focus on empathy, tuning in to others, and helping them understand why they show up the way they do. Oftentimes, the answer lies in childhood. I know that might sound like psychological gobbley gook, or Freudian hogwash. I've had clients tell me that. But after working with me, they realize that emotions are data. Leaders and companies can use that data to excel — and that emotional information is becoming more important than ever in the age of AI. Parents worry about the wrong things Parents often worry about the little mistakes they make. The moment when you raise your voice, or say the wrong thing, can haunt you. Luckily, those aren't usually the things that stick with our kids over time. What matters more is our parenting patterns. Children pay attention to how we build relationships, express love, and deal with conflict. Those teachings will stay with them long into their adulthood and career. Teaching kids to name emotions is key I often ask the executives whom I coach how they are feeling. Their response is usually the same: \"Fine.\" I sometimes want to yell, \"Fine is not an emotion!\" Once, I was working with an executive of a well-known company, asking him again and again how he was feeling, and he answered, \"Fine. Fine. Fine.\" One day, he said \"sad,\" and I thought \"woohoo. There's something I can work with.\" The greatest executives I work with are able to tune into and name the emotions they're feeling. They understand why they're feeling the way they are, and can tell others. This is important data for them and their company — and something that can't be replicated by AI. Teaching children to recognize their emotions will equip them for the C-suite — or any other car", "date_str": "2026-09-07T18:49:01+00:00", "hash": "4814bdab2b50253a1bbfc021fe6c612fe4a42ed69c729f1e1abff342a164a1c8", "title_fa": "من مربی مدیران هستم هوش مصنوعی هوش هیجانی آنها را ارزشمندتر می کند نه کمتر.", "summary_fa": "پم مانفردو کورتیس می گوید والدین باید به فرزندان خود بیاموزند که چگونه احساسات خود را نامگذاری کنند. JAGstudios/JAGstudios Pam Manfredo Curtis یک روانشناس صنعتی و سازمانی و مربی اجرایی است. او می گوید والدین می توانند با آموزش هوش هیجانی به موفقیت فرزندانشان کمک کنند. اشاره به نقاط قوت بچه ها و درخواست از آنها برای شناسایی نقاط قوت خود نیز می تواند کمک کننده باشد. این مقاله گفته شده بر اساس گفتگو با پم مانفردو کورتیس، نویسنده کتاب «منشأ یک رهبر» است. \"برای طولانی و وضوح ویرایش شده است. جای تعجب نیست که ما اغلب بر اساس نحوه تربیت خود انتخاب می کنیم. من می توانم آن را در زندگی خود ببینم: مادرم یک روانشناس مدرسه بود. من هم وارد روانشناسی شدم و با مردی ازدواج کردم که او نیز مانند من یک روانشناس صنعتی و سازمانی است. در حوزه ما، تمرکز زیادی روی درک این موضوع وجود دارد که چرا آنها به دیگران همدلی می کنند و به آنها کمک می کنند. اغلب اوقات، پاسخ در دوران کودکی نهفته است. می‌دانم که ممکن است به نظر می‌رسد شبیه یک غرغر روان‌شناختی، یا هول‌شوی فرویدی است. من مشتریانی داشته ام که به من گفته اند. اما پس از کار با من، آنها متوجه می شوند که احساسات یک داده است. رهبران و شرکت‌ها می‌توانند از این داده‌ها برای برتری استفاده کنند - و این اطلاعات احساسی در عصر هوش مصنوعی بیش از هر زمان دیگری مهم می‌شود. والدین در مورد چیزهای اشتباه نگران هستند والدین اغلب نگران اشتباهات کوچکی هستند که مرتکب می شوند. لحظه ای که صدایت را بلند می کنی، یا حرف اشتباهی می زنی، می تواند شما را آزار دهد. خوشبختانه، اینها معمولاً چیزهایی نیستند که با گذشت زمان به فرزندان ما می چسبند. آنچه مهمتر است الگوهای فرزندپروری ماست. کودکان به نحوه ایجاد روابط،"}, {"source": "Business Insider", "title": "I scoured Amazon's Labor Day sale for the best deals on TVs, vacuums, and coffee makers ending soon", "link": "https://www.businessinsider.com/guides/deals/best-amazon-labor-day-sale-deals-2026", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Talia Ergas; Owen Burke/Business Insider Amazon's Labor Day deals are in their final stretch, so today is the day to check out if you've been waiting on a price drop. The retailer is still offering discounts across tech, home, kitchen, outdoor gear, fashion, and more, but many of these offers could disappear once Labor Day ends tonight. Check out Amazon's Labor Day sale before it ends. We're rounding up the best Amazon Labor Day deals still available today, focusing on products and brands worth buying rather than every markdown on the site. Below, you'll find the strongest last-minute discounts we've spotted before the sale wraps up. Amazon Labor Day sale quicklinks Alexa: Get up to 40% off Amazon Echo Away: Find carry-ons, checked bags, and more on sale Beauty: Check out styling tools, whitening kits, and skincare on sale Fashion: Score discounts on styles for men, women, and kids Headphones: Save on Bose, Sony, Shokz, and more Home: Find deals on smart home, vacuum cleaners, decor, and more Kitchen: Save on Breville, Cosori, Keurig
