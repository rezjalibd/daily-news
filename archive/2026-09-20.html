 Best overall, percale If you want classic, cool-to-the-touch sheets that actually breathe, percale is hard to beat. L.L.Bean's Percale Cotton Set is our overall favorite because it boasts a bit of everything that most shoppers are looking for: They're lig", "date_str": "2026-09-20T10:15:01+00:00", "hash": "64446a33ab7fbcf0", "title_fa": "بهترین کت های 2026", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید ما بهترین ملحفه ها را برای هر فرد خوابیده انتخاب کرده ایم، خواه به دنبال چیزی ابریشمی و دنج باشید یا صاف و خنک. L.L.Bean;Brooklinen;Target/Business Insider ما در مورد بهترین ملحفه‌ها فکر زیادی می‌کنیم - بیشتر به این دلیل که سال‌ها برای آزمایش خواب، شستن و بحث بر سر چیزهایی که واقعاً روی تخت شما تعلق دارد، بحث کرده‌ایم. کمدهای کتانی ما مملو از گزینه‌ها می‌شوند، زیرا ما گزینه‌هایی را برای افرادی که می‌خوابند، می‌خوانیم، و به افراد وفادار به لباس‌های لطیف و دنج می‌خواهند که می‌خواهند احساسی ملایم و آرام داشته باشند، یا هر کسی که تلاش می‌کند آن تجربه هتل پنج ستاره را بازسازی کند. هیچ ست \"کامل\" واحدی برای همه وجود ندارد، اما بهترین ملحفه ها باید همیشه بادوام، نگهداری آسان و مناسب باشند. به اصل مطلب برسید: پنبه پارچه خواب جام مقدس ما است. گزینه مورد علاقه ما برای پرکال، ست ورق پرکاله L.L.Bean است که از پنبه ترد، خنک و بسیار بلند Pima ساخته شده است. اگر بافت نرم‌تر و نرم‌تری را ترجیح می‌دهید، ما ست ورق ساتین لوکس Brooklinen را پیشنهاد می‌کنیم که ویرایشگر مورد علاقه‌اش برای پارچه ابریشمی و پالت رنگی وسیع است. تیم ما به طور عینی هر مجموعه را از نظر راحتی، تنفس و دوام آزمایش می‌کند و آنها را در چرخش‌های معمولی بستر ما برای ارزیابی طولانی‌مدت ادغام می‌کند. در زیر، بهترین انتخاب های ما را به همراه توصیه های متخصص برای کمک به انتخاب مجموعه مناسب برای نیازهای خواب خود خواهید یافت. درباره نحوه آزمایش و تحقیق درباره محصولات خانگی Business Insider Reviews بیشتر بیاموزید. انتخاب‌های برتر ما برای بهترین ست‌های ورق بهترین ورق‌ها، پرکال: ست ورق پرکال L.L.Bean - مشاهده در L.L.Bean بهترین ست ورق ساتین: Brooklinen Luxe Seet"}, {"source": "Business Insider", "title": "A 60-year-old took out student loans to help her kids succeed. She's facing retirement with a $156,000 balance.", "link": "https://www.businessinsider.com/mom-postponing-retirement-student-loan-debt-parent-plus-save-repayment-2026-9", "summary": "Nansi Lynch has $156,000 in student loans that she took out to help her kids get a college education. Jonathan Pitts-Wiley for BI Nansi Lynch never went to college. But she's approaching retirement with a $156,000 student-loan balance. \"I don't get rid of it until I turn 75 years old,\" Lynch said. \"I've never heard of something so disastrous in my life.\" The 60-year-old took out federal parent PLUS loans, which carry the highest federal interest rate of 9.07%, for both of her children. Previously, parents could borrow the full cost of attendance. In July, the Trump administration imposed a lifetime borrowing cap of $65,000 per dependent for new parent PLUS loans, in an attempt to address spiraling debt. Under her pre-existing income-driven repayment plan, Lynch's monthly student-loan payments were $238. Lynch worries her payments will increase when her forbearance ends early next year. Business Insider has heard from many borrowers who saw their payments jump over the past year, pushing them to take on extra work, postpone retirement, or face the consequences of defaulting. Lynch doesn't regret taking out the loans, but she wishes she had considered the consequences of being six figures in debt. \"We thought it was a good idea to take out the parent PLUS because we wanted our kids to get a better education and a better job,\" Lynch said — her son is a personal trainer at the gym they own together, and her daughter works full time in security operations for a federal contractor. \"But in the long run, I'm stuck with all of the student-loan debt.\" This story is part of Business Insider's \"Student Debt Spiral\" series, which explores how rising student debt is changing the financial futures of millions. Do you have a story to share? Fill out this form , and we'll be in touch. Read more of our student-loan coverage here: 'It's going to hurt': How a surging student-loan payment is reshaping a family's future 'A bunch of red tape': Student-loan borrowers can't get clear answers from the companies that manage their debt New student-loan repayment glitches are throwing borrowers' budgets into limbo Managing student loans and delaying retirement Lynch works at a gym that she co-owns with her son in between shifts as a school bus driver. Jonathan Pitts-Wiley for BI Lynch is a high school graduate who has worked as a school bus driver for nearly 30 years. Between the morning and evening bus shifts, she also runs classes at her gym. When Lynch's daughter took out loans to", "date_str": "2026-09-20T10:00:01+00:00", "hash": "0bed86d035d1c8b6", "title_fa": "یک زن 60 ساله برای کمک به موفقیت فرزندانش وام دانشجویی گرفت. او با 156000 دلار موجودی با بازنشستگی روبرو است.", "summary_fa": "نانسی لینچ 156000 دلار وام دانشجویی دارد که برای کمک به فرزندانش در تحصیلات دانشگاهی گرفته است. جاناتان پیتس ویلی برای BI Nansi Lynch هرگز به کالج نرفت. اما او با 156000 دلار موجودی وام دانشجویی به دوران بازنشستگی نزدیک می شود. لینچ گفت: «تا زمانی که 75 ساله نشده باشم از شر آن خلاص نمی شوم. من هرگز در زندگی ام چیزی به این فاجعه نشنیده بودم. این زن 60 ساله وام های فدرال والدین PLUS گرفت که بالاترین نرخ بهره فدرال 9.07 درصد را برای هر دو فرزندش دارد. پیش از این، والدین می توانستند تمام هزینه حضور را قرض بگیرند. در ماه ژوئیه، دولت ترامپ سقف وام مادام العمر 65000 دلار به ازای هر وابستگی را برای وام‌های جدید والدین پلاس PLUS در تلاش برای رسیدگی به بدهی‌های مارپیچ اعمال کرد. طبق برنامه بازپرداخت مبتنی بر درآمد از قبل او، پرداخت ماهانه وام دانشجویی لینچ 238 دلار بود. لینچ نگران است که با پایان بردباری او در اوایل سال آینده، پرداخت هایش افزایش یابد. Business Insider از بسیاری از وام گیرندگان شنیده است که شاهد افزایش پرداخت‌هایشان در سال گذشته بوده‌اند و آنها را مجبور به انجام کارهای اضافی، به تعویق انداختن بازنشستگی یا مواجهه با عواقب نکول کرده‌اند. لینچ از گرفتن وام ها پشیمان نیست، اما آرزو می کند که ای کاش عواقب شش رقمی بودن بدهکار را در نظر می گرفت. لینچ گفت: «فکر می‌کردیم این ایده خوبی است که پدر و مادر PLUS را بیرون بیاوریم، زیرا می‌خواستیم بچه‌هایمان تحصیلات بهتر و شغل بهتری کسب کنند.» پسرش یک مربی شخصی در باشگاه ورزشی است که با هم دارند و دخترش تمام وقت در عملیات امنیتی برای یک پیمانکار فدرال کار می‌کند. اما در دراز مدت، من با تمام بدهی های وام دانشجویی گیر کرده ام. این داستان بخشی از مجموعه \"مارپیچ بدهی دانشجویی\" Business"}, {"source": "Business Insider", "title": "I’m a KPMG forward-deployed engineer. AI has moved my job beyond writing code.", "link": "https://www.businessinsider.com/how-kpmg-fde-uses-ai-work-clients-2026-9", "summary": "KPMG s Justin Johnsen has been an FDE at the firm for over a year now. KPMG Justin Johnsen started at KPMG in 2020 as a federal Salesforce developer, writing code by hand. Over the past year, he switched into a new role as a forward-deployed engineer at KPMG. His work involves giving AI applications the right context and coaching clients on how to use them. This is a conversation with Justin Johnsen, the lead technical architect at KPMG. This conversation has been edited and condensed for clarity. I joined KPMG six years ago, and I've been a forward-deployed engineer for about a year, working across different clients. When I started with KPMG as a software engineer , all the code was written by hand. I studied computer science. I built my career in architecture and later got into consulting and client work. A forward-deployed engineer works directly with a client and stays with the problem from understanding the business need through delivering a working solution. We work directly with client teams, often on-site. A lot of what I do now is AI. AI is incredibly capable, but it's really only as good as its context. Much of my work is gathering the information needed for AI to generate valuable assets and artifacts, then spreading those outputs across client deliverables and software applications. I also coach client teams on how to use AI effectively — helping them combine technical depth, business understanding, and clear communication to improve and amplify their work. For one client, I was initially hired to integrate several applications into a complex software system. After months of gathering requirements and refining the context, we used AI to deliver the application in about a month. The client wanted to understand how we had moved so quickly — and why the process had been so transparent. The client then asked me to help its teams adopt the AI and prompting practices that had made the work possible. AI has made it easier for me to multiply my output and, in a sense, act as my own enterprise. I can maintain context across multiple clients and projects simultaneously. The bottleneck used to be software development and writing code ; now it is gathering context and refining intent before development begins. One recent application I delivered involved risk scoring: using AI to assess how risky a customer or partner might be for a client to do business with. We brought together the signals used to measure that risk, then used AI to reason across them and ", "date_str": "2026-09-20T09:55:01+00:00", "hash": "5b0a4798fa853fbd", "title_fa": "من یک مهندس پیشرو KPMG هستم. هوش مصنوعی کار من را فراتر از نوشتن کد حرکت داده است.", "summary_fa": "جاستین جانسن از KPMG بیش از یک سال است که FDE در این شرکت است. KPMG جاستین جانسن در سال 2020 در KPMG به عنوان یک توسعه دهنده Salesforce فدرال شروع به کار کرد و کد را با دست می نوشت. در سال گذشته، او به عنوان یک مهندس پیشرو در KPMG به یک نقش جدید تبدیل شد. کار او شامل دادن زمینه مناسب به برنامه های هوش مصنوعی و آموزش به مشتریان در مورد نحوه استفاده از آنها است. این گفتگو با جاستین جانسن، معمار فنی ارشد KPMG است. این گفتگو برای وضوح ویرایش و فشرده شده است. من شش سال پیش به KPMG ملحق شدم و حدود یک سال است که یک مهندس پیشرو هستم و در مشتریان مختلف کار می کنم. زمانی که من با KPMG به عنوان یک مهندس نرم افزار شروع کردم، همه کدها با دست نوشته می شدند. من در رشته کامپیوتر تحصیل کردم. من حرفه ام را در معماری ساختم و بعداً وارد کار مشاوره و مشتری شدم. یک مهندس مستقر در آینده مستقیماً با مشتری کار می کند و از درک نیاز کسب و کار از طریق ارائه یک راه حل کاری با مشکل کنار می آید. ما مستقیماً با تیم های مشتری، اغلب در محل کار می کنیم. بسیاری از کارهایی که اکنون انجام می دهم هوش مصنوعی است. هوش مصنوعی فوق‌العاده توانایی دارد، اما واقعاً به اندازه زمینه‌اش خوب است. بخش عمده‌ای از کار من جمع‌آوری اطلاعات مورد نیاز برای هوش مصنوعی برای تولید دارایی‌ها و مصنوعات ارزشمند است، سپس آن خروجی‌ها را در محصولات تحویلی مشتری و برنامه‌های نرم‌افزاری پخش می‌کند. من همچنین تیم های مشتری را در مورد نحوه استفاده موثر از هوش مصنوعی راهنمایی می کنم - به آنها کمک می کنم عمق فنی، درک تجاری و ارتباطات واضح را برای بهبود و تقویت کار خود ترکیب"}, {"source": "Business Insider", "title": "This Ford exec put her family's Claude assistant on a PIP. ChatGPT has taken over.", "link": "https://www.businessinsider.com/ford-exec-claude-chatgpt-family-chief-staff-2026-9", "summary": "This mom vibe coded a family chief of staff. She s switching agents and putting the OG on a PIP. Whitney Stefko Dover Three months ago, Whitney Stefko Dover told BI about her Claude-built family chief of staff. The agent is on a PIP. An OpenAI agent has assumed the responsibilities. \"The power of being a user is this constant iteration,\" she said. Claudette is on a performance improvement plan. Three months ago, Whitney Stefko Dover, a director and senior counsel of policy and legal operations at Ford, told Business Insider that she had vibe coded her family a chief of staff using a bespoke Claude assistant named Claudette. The agent turned her family's emails and calendars into a 4 a.m. briefing called the \"Daily Dover.\" It was an early morning email that organized school schedules, childcare coverage, travel, birthdays, and household chores. It also drafted a useful morning text for her husband, Chris Dover. Claudette \"probably saved our marriage,\" she previously said. Now, there's fresh competition for the chief of staff role — but Claudette hasn't been fully fired. Yet. \"I'm not convinced that, like, next month, Claudette won't be the superior chief of staff,\" Stefko Dover told Business Insider. \"She's on a PIP.\" Now, Gigi, a chief of staff she built in ChatGPT Work, is the fresh-faced agent parsing through the Dover family calendar. Stefko Dover says her husband, a longtime OpenAI user, encouraged her to try ChatGPT. An August Substack post from Silicon Valley venture capital firm A16z gave her another push to try new agents. \"Turns out I have a lot of tool bias, which was unexpected,\" she said about her reluctance to abandon Claudette after months of refining. For her family, Gigi offered a better interface, maintained more continuity across projects, and produced stronger first drafts of emails and PowerPoint presentations, Stefko Dover said. It also made more proactive suggestions without waiting to be prompted. And the switch to ChatGPT was surprisingly painless. Stefko Dover had previously created a guide explaining how the assistant worked and connected with her family's apps. She uploaded that material into ChatGPT, bringing much of the old assistant's context with it. \"I think kind of the key here is owning your context, right?\" she said. \"I think it is our job as the users to sort of own the context layer.\" Since the switch, Gigi has taken on even more responsibilities, Stefko Dover said. Every Friday, it reads a grocery list shared with the ", "date_str": "2026-09-20T09:45:01+00:00", "hash": "d276c6e2a0229040", "title_fa": "این مدیر فورد، دستیار کلود خانواده اش را در یک PIP قرار داد. ChatGPT کار را به دست گرفته است.", "summary_fa": "این حال و هوای مادر یک رئیس ستاد خانواده را رمزگذاری کرده است. او نمایندگان را تغییر می دهد و OG را روی PIP قرار می دهد. ویتنی استفکو دوور سه ماه پیش، ویتنی استفکو دوور به BI در مورد رئیس ستاد خانواده اش که کلود ساخته شده بود، گفت. نماینده در یک PIP است. یک عامل OpenAI مسئولیت ها را بر عهده گرفته است. او گفت: «قدرت کاربر بودن همین تکرار مداوم است. کلودت در حال برنامه ریزی برای بهبود عملکرد است. سه ماه پیش، ویتنی استفکو دوور، مدیر و مشاور ارشد سیاست‌گذاری و عملیات حقوقی فورد، به بیزینس اینسایدر گفت که با استفاده از یک دستیار سفارشی کلود به نام کلودت، خانواده‌اش را به عنوان رئیس ستاد کدنویسی کرده است. این نماینده ایمیل ها و تقویم های خانواده اش را به یک جلسه توجیهی در ساعت 4 صبح به نام \"دیلی دوور\" تبدیل کرد. این یک ایمیل صبح زود بود که برنامه های مدرسه، پوشش مراقبت از کودکان، سفر، تولدها و کارهای خانه را سازماندهی می کرد. همچنین یک متن صبحگاهی مفید برای همسرش کریس دوور تهیه کرد. کلودت قبلا گفته بود \"احتمالا ازدواج ما را نجات داد.\" اکنون، رقابت جدیدی برای نقش رئیس ستاد وجود دارد - اما کلودت به طور کامل اخراج نشده است. با این حال. استفکو دوور به بیزینس اینسایدر گفت: «مطمئن نیستم، مثل ماه آینده، کلودت رئیس ارشد ستاد نخواهد بود. \"او در PIP است.\" اکنون، Gigi، رئیس کارکنانی که او در ChatGPT Work ساخته است، نماینده تازه کاری است که تقویم خانواده دوور را تجزیه می کند. استفکو دوور می‌گوید که همسرش، کاربر قدیمی OpenAI، او را تشویق کرد که ChatGPT را امتحان کند. یک پست Substack در ماه آگوست از سوی شرکت سرمایه گذاری خطرپذیر A16z در سیلیکون ولی به او فشار دیگری داد تا نمایندگان جدید را امتحان کند. او"}, {"source": "Business Insider", "title": "From binder to balance sheet: Serious collectors unpack how they're investing in Pokémon cards", "link": "https://www.businessinsider.com/pokemon-investing-collecting-charizard-pikachu-gengar-collectible-card-game-2026-9", "summary": "John Keeble/Getty Images We're living through a new Pokémon craze. The collectible cards have emerged as an alternative investment. Scarcity, but also nostalgia, are a big driver of the high price some cards command. Remember the binder of Pokémon cards your mother gave away after you left for college? They might be worth more money than you want to think about. The collectible card game has seen a major comeback, driving a new collecting frenzy that's boosted the price of coveted cards to dizzying levels. Rare Pokémon cards have emerged as their own asset class for some investors, even outperforming traditional investments like stocks over the last few years. \"It's the usual combo behind most alternative asset booms. Scarcity, nostalgia, and a generation that grew up with these cards now actually having money to spend on them,\" stated Jenna Lofton, a professional stock trader and founder of Stockhitter.com. While Lofton doesn't collect Pokémon cards, her 10 year old son is a fan. She told Business Insider that his love of game has made her an \"unwilling expert\" in areas such as pull rates and grading scales, key factors in determining the value of a card. Brian Dwyer, President of collectibles auction house REA evoked an analogy that may resonate with the of collectors of other tradeables, like sports cards. \"While new installments added each year to the Pokémon universe become fan favorites and can command high prices, iconic characters like Pikachu, Charizard, Gengar, and Umbreon can be compared to Hall of Fame staples like Babe Ruth, Mickey Mantle, and Jackie Robinson,\" he said. John Keeble/Getty Images One collector who spoke with Business Insider is using his background in finance to perform due diligence on cards. Kian Golshan, who works as a valuations analyst, grew up collecting them, and has found selling Pokémon a lucrative side hustle in adulthood. He credits an analytical approach he's developed working in finance with helping him evaluate the risk-reward profile of cards he's interested in. \"It helps me kind of think through the risks and when to take profits, when to sell, what to hold, what's my like risk profile, what's tracking the market,\" he told Business Insider. In February 2024, he bought a Japanese edition Charmander for $59.26, and sold the same card in April this year for $750, a gain of 1,165%. Other recent sales from Golshan's collection have seen similar gains, and some cards he owns have appreciated by thousands of dollars, ac", "date_str": "2026-09-20T09:45:01+00:00", "hash": "cf4efd6410776ac9", "title_fa": "از صحافی تا ترازنامه: مجموعه‌داران جدی نحوه سرمایه‌گذاری روی کارت‌های پوکمون را باز می‌کنند", "summary_fa": "John Keeble/Getty Images ما در حال گذراندن یک جنون جدید پوکمون هستیم. کارت های کلکسیونی به عنوان یک سرمایه گذاری جایگزین ظاهر شده اند. کمبود، و همچنین نوستالژی، محرک بزرگ قیمت بالای برخی از کارت ها هستند. صحافی کارت‌های پوکمون را که مادرتان پس از رفتن به کالج داده بود، به خاطر دارید؟ آنها ممکن است ارزش پول بیشتری از آن چیزی داشته باشند که می خواهید فکر کنید. بازی با ورق کلکسیونی بازگشت بزرگی را تجربه کرده است و دیوانگی جمع آوری جدیدی را به همراه دارد که قیمت کارت های مورد علاقه را به سطوح سرگیجه آور افزایش داده است. کارت‌های پوکمون کمیاب به‌عنوان طبقه دارایی خود برای برخی سرمایه‌گذاران ظاهر شده‌اند، حتی در چند سال گذشته از سرمایه‌گذاری‌های سنتی مانند سهام بهتر عمل کرده‌اند. \"این ترکیب معمولی است که در پشت اکثر رونق دارایی های جایگزین وجود دارد. کمیابی، نوستالژی و نسلی که با این کارت‌ها بزرگ شده‌اند، اکنون واقعاً پولی برای خرج کردن در آن‌ها دارند.\" عوامل کلیدی در تعیین ارزش یک کارت برایان دوایر، رئیس خانه حراج وسایل کلکسیونی REA تشبیهی را برانگیخت که ممکن است با کلکسیونرهای سایر کالاهای قابل مبادله مانند کارت های ورزشی طنین انداز شود. او می‌گوید: «در حالی که قسمت‌های جدیدی که هر سال به دنیای پوکمون اضافه می‌شود به محبوبیت طرفداران تبدیل می‌شود و می‌تواند قیمت‌های بالایی داشته باشد، شخصیت‌های نمادینی مانند Pikachu، Charizard، Gengar و Umbreon را می‌توان با تالار مشاهیر مانند Babe Ruth، Mickey Mantle و Jackie Robinson مقایسه کرد. John Keeble/Getty Images یکی از مجموعه‌دارانی که با Business Insider صحبت می‌کرد، از پیشینه خود در امور مالی برای انجام بررسی‌های لازم روی کارت‌ها استفاده می‌کند. کیان گلشن که به‌عنوان تحلیل‌گر ارزش‌گذاری کار می‌کند، با جمع‌آوری آن‌ها بزرگ شد و فروش پوکمون را در بزرگسالی یک کار سودآور می‌دانست. او یک رویکرد تحلیلی را که در کار"}, {"source": "Business Insider", "title": "Dementia care can cost a fortune. Families pay in more ways than one.", "link": "https://www.businessinsider.com/dementia-care-costs-memory-care-home-care-2026-9", "summary": "Angela Davis, 65, has cared for her mother with dementia for the past few years. Camille Farrah Lenain for BI When Angela Davis discovered that her mother with dementia had changed the locks, she knew she had to intervene. After a standard care facility didn't cut it, Davis, 65, moved her mother into her own home. Davis now manages her medications, assists with her hygiene, and monitors her at night. She sleeps on a love seat near her mom's room in case anything happens. Her mom's care, plus home maintenance , has cost about $7,000 a month. Her mom receives $3,200 monthly in retirement income , and Davis covers the rest. The stress has weighed her down; last week, she took what she thought would be a short evening nap. Next thing she knew, it was 7 a.m. the next morning and time to go to work. Angela Davis said caring for her mother with dementia has weighed her down. Camille Farrah Lenain for BI \"It's death by 1,000 cuts, and in this case, you could say death by 1,000 memories every day,\" Davis said. Seven million Americans have Alzheimer's, leaving families to navigate rising costs for memory care facilities or home care. One estimate shows that lifetime costs for dementia can exceed $400,000. Two dozen families navigating dementia care told Business Insider that costs add up for frequent hospitalizations and physician visits, expensive medications, transportation costs, and round-the-clock home care. Those who can afford it spend five figures on monthly memory care facility costs. Other costs included home modifications, power-of-attorney legal fees, and technologies for aging in place . Are you paying for your own or your loved one's long-term care? Do you have thoughts to share about long-term care in the US? To share your story with a reporter, please fill out this quick form . A report from AARP and the National Alliance for Caregiving found that in 2025, one in four family caregivers cared for someone 50 and over with memory issues or dementia. While an estimated 7 million Americans aged 65 and over have Alzheimer's, that is expected to surge. Wendy Rowland, 53, has cared for her husband with early onset Lewy body dementia for years. To manage his treatment, they spent through his 401(k) and sold their house of 20 years, then put him into a memory care facility two years ago that now costs $6,750 a month. \"I hope nothing like that happens with me, and if it does, I don't know if I would want anybody else to go through the same thing of having to fi", "date_str": "2026-09-20T09:44:01+00:00", "hash": "914344768bdd52d5", "title_fa": "مراقبت از زوال عقل می تواند هزینه زیادی داشته باشد. خانواده ها به روش های مختلف پرداخت می کنند.", "summary_fa": "آنجلا دیویس 65 ساله در چند سال گذشته از مادرش که دچار زوال عقل بود مراقبت کرده است. Camille Farrah Lenain برای BI وقتی آنجلا دیویس متوجه شد که مادرش که دچار زوال عقل بود قفل ها را عوض کرده است، می دانست که باید مداخله کند. پس از اینکه یک مرکز مراقبت استاندارد آن را قطع نکرد، دیویس 65 ساله مادرش را به خانه خود منتقل کرد. دیویس اکنون داروهای خود را مدیریت می کند، به بهداشت او کمک می کند و او را در شب تحت نظر دارد. او روی صندلی عشق نزدیک اتاق مادرش می خوابد تا اگر اتفاقی بیفتد. مراقبت از مادر او، به علاوه نگهداری از خانه، حدود 7000 دلار در ماه هزینه داشته است. مادر او ماهانه 3200 دلار درآمد بازنشستگی دریافت می کند و دیویس بقیه را پوشش می دهد. استرس او را سنگین کرده است. هفته گذشته، او چیزی را که فکر می‌کرد یک چرت عصرگاهی کوتاه است، گرفت. چیز بعدی که او می دانست، ساعت 7 صبح روز بعد و زمان رفتن به سر کار بود. آنجلا دیویس گفت که مراقبت از مادرش که زوال عقل دارد او را سنگین کرده است. کامیل فارا لنین برای BI گفت: \"این مرگ با 1000 بریدگی است، و در این مورد، می توان گفت مرگ با 1000 خاطره هر روز.\" هفت میلیون آمریکایی مبتلا به آلزایمر هستند که خانواده ها را مجبور می کند هزینه های فزاینده برای امکانات مراقبت از حافظه یا مراقبت در خانه را جبران کنند. یک تخمین نشان می دهد که هزینه های مادام العمر برای زوال عقل می تواند بیش از 400000 دلار باشد. دو دوجین خانواده در حال مراقبت از زوال عقل به Business Insider گفتند که هزینه های بستری مکرر در بیمارستان و ویزیت پزشک، داروهای گران قیمت، هزینه های حمل و نقل و مراقبت شبانه روزی"}, {"source": "Business Insider", "title": "The CEO who leads one handwritten note at a time", "link": "https://www.businessinsider.com/twilio-ceo-khozema-shipchandler-handwrites-notes-leadership-2026-9", "summary": "Twilio CEO Khozema Shipchandler in June at the Nasdaq, celebrating the company s 10th anniversary since its IPO NYSE: TWLO Twilio CEO Khozema Shipchandler writes notes to his company's 80+ leaders before their annual retreat. He said the analog ritual is rooted in part in his own memories of being a junior employee at GE. The notes also help him build relationships with those who could one day sit in Twilio's C-suite, he said. At least once a year, Twilio CEO Khozema Shipchandler's right hand cramps up from a few hours of writing. He's not signing copies of a book. The pain, instead, comes from penning personalized notes to every member of the technology company's 80-plus-person leadership team ahead of their annual retreat . \"After every 10, I have to take a 30-minute break,\" Shipchandler told Business Insider of the deliberately analog ritual, which is rooted partly in his own memories of being a more junior employee at GE and how special it felt to have a senior leader take notice of him. \"I have no idea what the words were, I can't remember, but I definitely remember how I felt when that happened,\" said Shipchandler. \"If I can do that just for one person and it increases their confidence or their capacity or their desire to go do a hard thing, I think that's pretty awesome,\" he said. Shipchandler, 52, added that the notes serve another purpose: helping him build relationships with people who could one day sit in Twilio's C-suite. He said they typically include a mention of a project or initiative the leader is driving; something complimentary about their leadership style; and encouragement for what's next. \"At some point I'm going to retire, and there's a new generation of people that I want to know intimately and that I want to know to know me intimately,\" Shipchandler said. \"They are our bench.\" 'They're owed information' Founded in 2008, Twilio provides technology that businesses use to interact with customers over phone calls, texts, and emails. Shipchandler rose to the top job at the company in 2024 — his first stint as CEO — after serving as president of communications and, before that, as operating chief and as finance chief. He spent 22 years at GE prior to joining Twilio in 2018. Shipchandler's handwritten notes offer a window into his broader approach to leadership. He said he's committed to responding to employees' emails, texts, and Slack messages within 24 to 48 hours and that he makes a habit of reading meeting materials in advance to res", "date_str": "2026-09-20T09:42:01+00:00", "hash": "ff6c4b93f0ee7d87", "title_fa": "مدیر عاملی که هر بار یک یادداشت دست نویس را هدایت می کند", "summary_fa": "خوزما شیپچندلر، مدیر عامل Twilio در ژوئن در نزدک، جشن دهمین سالگرد تاسیس شرکت از زمان عرضه اولیه سهام در نیویورک: خوزما شیپچندلر، مدیر عامل TWLO Twilio، قبل از عقب نشینی سالانه رهبران بیش از 80 شرکتش، یادداشت هایی را برای آنها می نویسد. او گفت که این آیین آنالوگ تا حدودی ریشه در خاطرات خودش از کارمندی جوان در جنرال الکتریک دارد. او گفت، یادداشت‌ها همچنین به او کمک می‌کنند تا با کسانی که می‌توانند روزی در C-suite Twilio بنشینند، رابطه برقرار کند. دست راست خوزما شیپچندلر، مدیر عامل Twilio، حداقل سالی یک بار، پس از چند ساعت نوشتن دچار گرفتگی می شود. او نسخه های یک کتاب را امضا نمی کند. در عوض، درد از نوشتن یادداشت‌های شخصی‌سازی شده برای هر عضو تیم رهبری بیش از 80 نفر شرکت فناوری پیش از عقب‌نشینی سالانه آنها ناشی می‌شود. شیپچندلر به Business Insider گفت: «بعد از هر 10 دقیقه، من باید 30 دقیقه استراحت کنم.» شیپچندلر می‌گوید: «من نمی‌دانم کلمات چه بودند، نمی‌توانم به خاطر بیاورم، اما مطمئناً به یاد دارم که چه احساسی داشتم که این اتفاق افتاد. او گفت: \"اگر بتوانم این کار را فقط برای یک نفر انجام دهم و اعتماد به نفس یا ظرفیت یا تمایل آنها برای انجام یک کار سخت را افزایش دهد، فکر می کنم بسیار عالی است.\" شیپچندلر، 52 ساله، اضافه کرد که این یادداشت ها هدف دیگری را دنبال می کنند: به او کمک می کنند تا با افرادی که می توانند روزی در C-suite Twilio بنشینند، روابط برقرار کند. او گفت که آنها معمولاً شامل ذکر پروژه یا ابتکاری هستند که رهبر در حال انجام آن است. چیزی در مورد سبک رهبری آنها. و تشویق برای اتفاقات بعدی شیپچندلر گفت: \"در مقطعی من بازنشسته می شوم و نسل جدیدی از مردم وجود دارند که می خواهم از نزدیک آنها را"}, {"source": "Business Insider", "title": "A Lyft driver was in a crash on the job. Now he's struggling to provide — and fighting insurance.", "link": "https://www.businessinsider.com/a-lyft-driver-crashed-on-the-job-now-hes-struggling-to-provide-2026-9", "summary": "Osahon Aburime, a former Lyft driver, was injured in a car accident. Osahon Aburime A Lyft driver in North Carolina was involved in an accident while en route to pick up a passenger. Sixteen months later, he's still fighting for an insurance payout. He said that accident has also made it harder to support his family. Osahon Aburime opened his Lyft app on Mother's Day last year to make some money. That day, the North Carolina driver had made about $80 to put toward taking his wife out to dinner and getting a gift for his mom. As he was on his way to pick up a passenger, though, he got into a car accident. \"All of a sudden, I just saw this car in front of me, so I stepped on my brakes,\" he said. \"We just ran into each other.\" Sixteen months later, he uses a cane to walk, he said. He tried unsuccessfully to return to work as a ride-hailing driver. \"I said, 'Let me see if I can continue to drive to make money for my family,'\" he said. \"But it just got to a point now I can't even bend down.\" Aburime's experience shows one occupational hazard of working as a driver for a gig-work platform like Lyft or Uber. While the apps say they provide insurance coverage, the independent contractors doing the work often have fewer protections than traditional full-time employees. \"Safety is fundamental to Lyft and it is our goal to make every ride safe, comfortable and reliable,\" a Lyft spokesperson said. \"We maintain auto liability insurance that meets local and state regulations.\" 'Nobody deserves this' After the accident, Aburime had pain in one of his feet, according to a report from the hospital viewed by Business Insider. He also lost the Chevy Malibu that he was driving when he got into the accident. His income has also been affected. Before the accident, it was typical for him to make around $1,700 a month on Lyft. The money helped support his family, along with his wife's income working at an eye clinic. Since the accident, though, he hasn't been able to earn money, he said. That led him to fall behind on payments toward his minivan, which his lender repossessed earlier this year, according to a notice seen by Business Insider. Aburime has also been fighting to get a payout from Mobilitas, which provides ride-hailing insurance to Lyft. Aburime said that he's reached out to the North Carolina Department of Insurance for help. The department has told him to look for a lawyer — something he says he can't afford. A day after the accident, Mobilitas denied Aburime's claim", "date_str": "2026-09-20T09:35:01+00:00", "hash": "adb26ab8c43264f1", "title_fa": "یک راننده لیفت در حین کار دچار تصادف شد. در حال حاضر او در حال تقلا برای تامین - و مبارزه با بیمه.", "summary_fa": "اوساهون ابوریمه، راننده سابق لیفت در یک تصادف رانندگی مجروح شد. Osahon Aburime یک راننده Lyft در کارولینای شمالی در حالی که در مسیر برای سوار کردن یک مسافر بود دچار حادثه شد. شانزده ماه بعد، او هنوز برای پرداخت بیمه می جنگد. وی گفت: تصادف باعث شده است که مخارج خانواده اش نیز سخت تر شود. Osahon Aburime سال گذشته برنامه Lyft خود را در روز مادر باز کرد تا کمی پول دربیاورد. آن روز، راننده کارولینای شمالی حدود 80 دلار پول درآورده بود تا همسرش را برای شام بیرون بیاورد و برای مادرش هدیه بگیرد. در حالی که او برای سوار کردن مسافر در راه بود، تصادف کرد. او گفت: «به یکباره این خودرو را در مقابلم دیدم و ترمز کردم. \"ما فقط با هم برخورد کردیم.\" او گفت که شانزده ماه بعد از عصا برای راه رفتن استفاده می کند. او تلاش ناموفقی برای بازگشت به کار به عنوان یک راننده سواری داشت. او گفت: «گفتم بگذار ببینم آیا می توانم به رانندگی ادامه دهم تا برای خانواده ام پول دربیاورم. \"اما الان به نقطه ای رسیده است که حتی نمی توانم خم شوم.\" تجربه Aburime نشان می دهد که کار کردن به عنوان راننده برای یک پلتفرم گیگ کاری مانند Lyft یا Uber یک خطر شغلی دارد. در حالی که برنامه‌ها می‌گویند پوشش بیمه‌ای را ارائه می‌کنند، پیمانکاران مستقلی که کار را انجام می‌دهند، اغلب محافظت کمتری نسبت به کارمندان تمام وقت سنتی دارند. یکی از سخنگویان لیفت گفت: \"ایمنی برای Lyft اساسی است و هدف ما این است که هر سواری را ایمن، راحت و قابل اعتماد کنیم.\" \"ما بیمه مسئولیت خودرو را که مطابق با مقررات محلی و ایالتی است، حفظ می کنیم.\" \"هیچ کس لیاقت این را ندارد\" بر اساس گزارشی از بیمارستان که توسط Business Insider مشاهده شده است، پس از تصادف،"}, {"source": "Business Insider", "title": "I make up to $15,000 a month online answering appliance questions. I love the flexibility.", "link": "https://www.businessinsider.com/technician-turned-justanswer-side-hustle-full-time-six-figure-job-2026-9", "summary": "Matthew Rankin turned his side hustle online into his main job after burning out at his 9-to-5. Photo courtesy of Matthew Morrison Appliance technician Matthew Rankin quit his full-time job and went all in with his side hustle. He now works nine to 10 hours a day answering questions online for JustAnswer. The job can be hectic, but it is flexible and has allowed him to make up to $15,000 a month. This as-told-to essay is based on a conversation with Matthew Rankin, a 52-year-old appliance technician based in Greenville, South Carolina. The following has been edited for length and clarity. I wasn't happy with my work and was getting burned out . I've been an appliance expert for easily 25 years, specializing in dishwashers, refrigerators, and other appliances. Maintenance in general is hard, but when you get into commercial properties and apartment maintenance, it's a whole other league. I worked in commercial property management for about six years, managing facilities and fixing whatever was broken. It wasn't the most glamorous job; you're always on call. After doing that, I decided I would never be on call again. I was looking for an opportunity to make more money on the side I was living in Charleston, South Carolina; it's an expensive region, and I didn't have much in savings. I think I saw a reel on Instagram about JustAnswer , and it looked too good to be true. I was hesitant at first, but I applied and figured I'd give it a couple of hours a day. I'd log on to my computer and close out five or 10 calls or questions. I started seeing these part-time paychecks come in and saw the potential after doing the math, so I decided to go for it. I was in a position that had a lot of flexibility. After about six months, I gave my two-week notice and haven't looked back. Now I make between $10,000 and $15,000 a month answering questions online. How I make money answering questions online When a question comes in, I can accept it or pass it, so it's important to filter them properly. Sometimes the question is about a brand I've never heard of, or a product or situation I'm not familiar with. Questions from other countries pop up every once in a while, too. On JustAnswer, I may get a lot of refrigerator-not-cooling inquiries, and if it's a brand I know — LG, Kenmore, etc. — that's a question I'll take . A lot of the people reaching out are DIYers, newer technicians in the field, or people who simply want access to someone with expertise. They're looking for guida", "date_str": "2026-09-20T09:30:01+00:00", "hash": "0f3fec79e9e33844", "title_fa": "من تا 15000 دلار در ماه از پاسخگویی آنلاین به سوالات لوازم خانگی درآمد دارم. من عاشق انعطاف پذیری هستم.", "summary_fa": "متیو رنکین بعد از اینکه در 9 به 5 خسته شد، فعالیت های جانبی آنلاین خود را به شغل اصلی خود تبدیل کرد. عکس از متیو موریسون، تکنسین لوازم خانگی متیو رنکین، کار تمام وقت خود را رها کرد و با هیاهوی جانبی خود وارد کار شد. او اکنون 9 تا 10 ساعت در روز کار می کند و به سوالات آنلاین JustAnswer پاسخ می دهد. این شغل می تواند پر هیجان باشد، اما انعطاف پذیر است و به او اجازه می دهد تا 15000 دلار در ماه درآمد داشته باشد. این مقاله گفته شده بر اساس گفتگو با متیو رانکین، یک تکنسین لوازم خانگی 52 ساله مستقر در گرین ویل، کارولینای جنوبی است. موارد زیر برای طول و وضوح ویرایش شده است. من از کارم راضی نبودم و داشتم می سوختم . من به مدت 25 سال کارشناس لوازم خانگی هستم و متخصص در ماشین ظرفشویی، یخچال و سایر لوازم خانگی هستم. تعمیر و نگهداری به طور کلی سخت است، اما زمانی که به املاک تجاری و تعمیر و نگهداری آپارتمان وارد می‌شوید، یک لیگ کاملاً متفاوت است. من حدود شش سال در مدیریت املاک تجاری کار کردم و تأسیسات را مدیریت کردم و هر چیزی که خراب بود را تعمیر کردم. این پر زرق و برق ترین کار نبود. شما همیشه در تماس هستید بعد از انجام این کار، تصمیم گرفتم که دیگر هیچ وقت در تماس نباشم. من به دنبال فرصتی برای کسب درآمد بیشتر از طرفی بودم که در چارلستون، کارولینای جنوبی زندگی می کردم. این منطقه گرانی است و من پس انداز زیادی نداشتم. فکر می‌کنم حلقه‌ای در اینستاگرام درباره JustAnswer دیدم، و خیلی خوب به نظر می‌رسید که درست باشد. من اول مردد بودم، اما درخواست دادم و فکر کردم که روزی یکی دو ساعت به آن فرصت بدهم. من وارد رایانه می‌شدم و"}, {"source": "Business Insider", "title": "The Airbus A380 got a second life. Here's where you can still fly on the world's largest passenger jet.", "link": "https://www.businessinsider.com/airbus-a380-routes-destinations-airlines-2026-9", "summary": "Emirates is the biggest operator of the world s largest passenger jet. Bloomberg/Getty Images Several airlines ditched the Airbus A380 during the pandemic. But it's still flying high, led by Emirates' fleet of 117 superjumbos. Business Insider compiled a list of every airline operating the A380 and their winter routes for 2026. Do you fancy flying on the world's largest passenger jet ? The Airbus A380 has awed passengers for nearly 20 years. With a 262-foot wingspan, the superjumbo jet wouldn't fit on an NFL field. Business Insider has compiled all the routes that it will fly this winter, based on Cirium data for November's schedule. You can search for different cities in this table, then scroll down for more details about the airlines operating the A380. Airbus spent decades developing the double-decker airplane as an answer to the Boeing 747 . It announced the project in 1990, but the A380 didn't enter service until 2007. It has had a turbulent life ever since, falling in and out of popularity. The European planemaker expected high demand for enormous aircraft due to the rise of airport megahubs like Dubai. It was ideal for Emirates, which operates the overwhelming majority of A380s. However, many airlines preferred to fly point-to-point. Twin-jet aircraft like the Boeing 777 and Airbus A350 offer plenty of seats, greater flexibility, and lower operating costs. The COVID-19 pandemic also prompted many airlines to rethink their strategies amid cost pressures. Air France and Malaysia Airlines were among those to retire all their A380s. Airbus built the last new A380 in 2021. While COVID was a major blow, many airlines fell back in love with the superjumbo when lockdowns lifted. Lufthansa retired all 14 of its A380s during the pandemic but has brought back eight of them since 2022. Etihad Airways reactivated six jets, too. Meanwhile, Qantas restarted A380 flights between Sydney and Dallas/Fort Worth last August, for the first time since the pandemic. A year later, though, the Australian flag carrier said it was bringing forward its retirement of the planes to 2028. Back in 2017, there were more than 10,000 flights a month operated by the A380. While that has since fallen to 7,500 for November, it seems there is still some life left in the superjumbo. 1. Emirates Emirates A380s have a bar onboard. Bloomberg/Getty Images Dubai's airline is by far the world's largest operator of the A380, with over nine times as many as any other operator. Emirates has a total", "date_str": "2026-09-20T09:29:39+00:00", "hash": "dd4fcda32da9bace", "title_fa": "ایرباس A380 عمر دومی پیدا کرد. اینجا جایی است که هنوز می توانید با بزرگترین جت مسافربری جهان پرواز کنید.", "summary_fa": "امارات بزرگترین اپراتور بزرگترین جت مسافربری جهان است. بلومبرگ/گتی ایماژ چندین شرکت هواپیمایی ایرباس A380 را در طول همه گیری همه گیر کنار گذاشتند. اما همچنان در ارتفاعات پرواز می کند و ناوگان 117 سوپرجامبو امارات هدایت می کند. Business Insider فهرستی از تمام خطوط هوایی A380 و مسیرهای زمستانی آنها برای سال 2026 جمع آوری کرده است. آیا دوست دارید با بزرگترین جت مسافربری جهان پرواز کنید؟ ایرباس A380 نزدیک به 20 سال است که مسافران را شگفت زده کرده است. با طول بال های 262 فوتی، سوپرجامبو جت در زمین NFL جا نمی شود. Business Insider تمام مسیرهایی را که در زمستان امسال پرواز می کند، بر اساس داده های Cirium برای برنامه نوامبر گردآوری کرده است. می توانید شهرهای مختلف را در این جدول جستجو کنید، سپس برای جزئیات بیشتر در مورد خطوط هوایی A380 به پایین بروید. ایرباس چندین دهه صرف توسعه هواپیمای دو طبقه به عنوان پاسخی به بوئینگ 747 کرد. این پروژه در سال 1990 اعلام شد، اما A380 تا سال 2007 وارد خدمت نشد. از آن زمان تاکنون زندگی پرتلاطمی داشته است و محبوبیت خود را از دست داده است. این هواپیماساز اروپایی به دلیل ظهور مگا هاب های فرودگاهی مانند دبی انتظار تقاضای بالایی برای هواپیماهای عظیم داشت. برای امارات که اکثریت قریب به اتفاق A380 ها را اداره می کند ایده آل بود. با این حال، بسیاری از خطوط هوایی ترجیح می دهند نقطه به نقطه پرواز کنند. هواپیماهای جت دوقلو مانند بوئینگ 777 و ایرباس A350 صندلی های فراوان، انعطاف پذیری بیشتر و هزینه های عملیاتی کمتری را ارائه می دهند. همه‌گیری COVID-19 همچنین بسیاری از خطوط هوایی را بر آن داشت تا در میان فشارهای هزینه، استراتژی‌های خود را تجدید نظر کنند. خطوط هوایی ایرفرانس و مالزی از جمله کسانی بودند که تمام هواپیماهای A380 خود را بازنشسته کردند."}, {"source": "Business Insider", "title": "I raised my daughter to value making a difference over making money. Now I question that lesson.", "link": "https://www.businessinsider.com/taught-child-prioritize-purpose-making-difference-life-lesson-might-regret-2026-9", "summary": "The author (right) and her daughter both founded nonprofits. Courtesy of Miriam Bonilla. My daughter and I both run nonprofits: mine rescues dogs; hers supports women's education. We are both passionate about our philanthropic work, but it comes at a price. I sometimes wonder if I should have encouraged her to choose a paycheck over passion and purpose. Two years ago, my daughter, Jordan, was in the outskirts of Marrakech in Morocco with a group of 15 Amazigh girls from the High Atlas Mountains . Displaced after a recent earthquake, they were in a temporary dorm, just a small house, but it was all they had available to them. My daughter was leading a yoga teacher training program through her nonprofit — one that she built herself from the ground up when she was 26. \"How hot is it?\" I ask while sitting at my desk in Los Angeles, frantically putting together a fundraising plea for the charity I founded for a matted poodle mix with a broken leg. He was hit by a car, and one of our rescue volunteers just saved him and rushed him to our vets. \"44 Celsius, Mom, and no fans. Cell phone cutting out,\" she shares. I quickly Google the Fahrenheit conversion and learn that it's about 111 degrees. \"Oh no!\" I gasp. \"Texting you Hamza's number. Nice guy. He'll help,\" she says. \"On it!\" I yell, but she's gone. This is the path my daughter and I have chosen. We are both founders of our own nonprofits . Our roller coaster lives are filled with daily problem-solving and never-ending stress. I'm proud of the person my daughter has become, but now I sometimes wonder if I should have pushed her in a different direction. I'm always ready to help It was a cool 69 degrees where I was in Santa Monica, yet my whole body suddenly felt blazing hot. As mothers, we are always split in two, immersed in our own lives, but also wherever our children are, even if it's on the other side of the world . Within an hour of connecting with my daughter, I reached Hamza in Marrakesh, arranged for six large fans to be delivered C.O.D. by morning, and am laser-focused on raising $4,200 needed for the emergency pup who's already in surgery. Do you have a parenting regret? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. That night, as I feed my current pack of rescue dogs , I ask myself the push-pull, ever-pervasive question: Should I have encouraged my daughter to choose something more stable and secure, but less noble? I was raised in apartheid ", "date_str": "2026-09-20T09:24:01+00:00", "hash": "8ff2821fd54f933d", "title_fa": "من دخترم را طوری تربیت کردم که ارزش ایجاد تفاوت را بر پول درآوردن بداند. حالا من آن درس را زیر سوال می برم.", "summary_fa": "نویسنده (راست) و دخترش هر دو مؤسسات غیرانتفاعی تأسیس کردند. با حسن نیت از میریام بونیلا. من و دخترم هر دو سازمان های غیرانتفاعی را اداره می کنیم: مال من سگ ها را نجات می دهد. او از تحصیل زنان حمایت می کند. هر دوی ما مشتاق کار بشردوستانه خود هستیم، اما این بهایی دارد. گاهی اوقات فکر می کنم که آیا باید او را تشویق می کردم که به جای اشتیاق و هدف، چک دستمزد را انتخاب کند. دو سال پیش، دخترم، جردن، در حومه مراکش در مراکش همراه با یک گروه 15 دختر آمازیغ از کوه‌های اطلس بالا بود. آنها که پس از زلزله اخیر آواره شده بودند، در یک خوابگاه موقت بودند، فقط یک خانه کوچک، اما این تنها چیزی بود که در اختیارشان بود. دخترم از طریق غیرانتفاعی خود یک برنامه تربیت معلم یوگا را رهبری می‌کرد - برنامه‌ای که در ۲۶ سالگی خودش را از ابتدا ساخت. \"چقدر گرمه؟\" در حالی که پشت میزم در لس آنجلس نشسته‌ام، می‌پرسم و دیوانه‌وار درخواستی برای جمع‌آوری کمک مالی برای خیریه‌ای که برای یک ترکیب پودل مات با پای شکسته تأسیس کردم، جمع‌آوری می‌کنم. او با یک ماشین برخورد کرد و یکی از داوطلبان نجات ما او را نجات داد و سریع به دامپزشکان ما رساند. او به اشتراک می‌گذارد: \"44 درجه سانتیگراد، مامان، و هیچ طرفداری. تلفن همراه قطع است.\" من به سرعت تبدیل فارنهایت را گوگل می کنم و متوجه می شوم که حدود 111 درجه است. \"اوه نه!\" نفس میکشم \"شماره حمزه رو بهت پیامک میدم. پسر خوب. او می‌گوید: «در آن!» فریاد می‌زنم، اما او رفته است. این راهی است که من و دخترم انتخاب کرده‌ایم. ما هر دو مؤسس سازمان‌های غیرانتفاعی خود هستیم. زندگی‌های ترن هوایی ما مملو از مشکلات روزمره و استرس بی‌پایان است. من به فردی که دخترم تبدیل شده است"}, {"source": "Business Insider", "title": "Good news, homebuyers: The market is tilting in your favor as more sellers offer concessions", "link": "https://www.businessinsider.com/housing-market-sellers-concessions-home-price-cuts-mortgage-rates-2026-9", "summary": "carlofranco/Getty Images The US housing market has turned further into buyers' favor. More sellers are offering concessions and cutting prices on homes listed for sale. The trend is most prevalent in the Sun Belt, where sellers heavily outnumber buyers. Good news, homebuyers: buying a house looks like it's getting just a little bit easier. Mortgage rates are still high and home prices are still hovering near records, but more sellers are looking to sweeten the deal for buyers by slashing prices or throwing in concessions , such as paying for repairs, extra amenities, or offering to buy down a buyer's mortgage rate to close the deal. The percentage of sellers who offered a concession to buyers rose to around 45% in August, up from 43% the prior year. It marks the highest proportion of sellers offering concessions in August in at least the last six years, according to Redfin data. The percentage of sellers who offered a concession and a price cut rose to nearly 16%, the real estate listings site said on Friday. Around 20% of active listings have had a price drop, up 0.6 percentage points from the prior year, Redfin data shows. The trend has largely been driven by an imbalance of sellers and buyers in the housing market, with many prospective buyers sitting on the sidelines due to high mortgage rates and elevated home prices. The average 30-year fixed mortgage rate ticked up to 6.95% in the last week, according to Freddie Mac data, and other national surveys show the rate well above 7%. Across the US, home sellers outnumbered buyers by 58%, Redfin said in a previous report. America's supply of homes for sale also rose to a 10-year high in August, according to the National Association of Realtors. Concessions have been particularly common in the Sun Belt , a region in the US where sellers heavily outnumber buyers. The deluge of inventory is giving buyers more options and the ability to be picky when shopping for a home. Last month, concessions appeared most frequently in Atlanta, where they were included in 73% of deals. It was followed by Charlotte and Phoenix, where around 67% of sales involved concessions. The housing market has been stuck in a yearslong deep freeze as high rates continue to keep buyers on the sidelines. Most forecasters are expecting mortgage rates to remain above the 6% threshold in the near future. 2026, meanwhile, looks on track to be the weakest year for home sales since 2011, according to an estimate from Capital Economics. Read the o", "date_str": "2026-09-20T09:20:01+00:00", "hash": "8e44efa3f00bb791", "title_fa": "خبر خوب، خریداران خانه: بازار به نفع شما متمایل است زیرا فروشندگان بیشتری امتیازاتی را ارائه می دهند", "summary_fa": "carlofranco/Getty Images بازار مسکن ایالات متحده بیشتر به نفع خریداران تبدیل شده است. فروشندگان بیشتری برای خانه های فهرست شده برای فروش امتیازاتی ارائه می دهند و قیمت ها را کاهش می دهند. این روند در کمربند خورشیدی رایج است، جایی که تعداد فروشندگان به شدت از خریداران بیشتر است. خبر خوب، خریداران خانه: به نظر می رسد خرید خانه کمی آسان تر شده است. نرخ‌های وام مسکن همچنان بالاست و قیمت‌های مسکن همچنان نزدیک به رکورد است، اما فروشندگان بیشتری به دنبال شیرین کردن معامله برای خریداران با کاهش قیمت‌ها یا دادن امتیازاتی هستند، مانند پرداخت هزینه تعمیرات، امکانات اضافی، یا پیشنهاد خرید پایین نرخ وام مسکن خریدار برای بستن معامله. درصد فروشندگانی که امتیازی را به خریداران پیشنهاد کردند در ماه اوت به حدود 45 درصد افزایش یافت که نسبت به سال قبل 43 درصد بود. طبق داده‌های Redfin، این بالاترین نسبت فروشندگانی است که در ماه آگوست امتیاز ارائه می‌کنند در حداقل شش سال گذشته. سایت فهرست املاک روز جمعه اعلام کرد درصد فروشندگانی که امتیاز و کاهش قیمت را پیشنهاد کردند به نزدیک به 16 درصد افزایش یافت. داده‌های Redfin نشان می‌دهد که حدود 20 درصد از فهرست‌های فعال افت قیمت داشته‌اند که 0.6 درصد نسبت به سال قبل افزایش یافته است. این روند عمدتاً ناشی از عدم تعادل فروشندگان و خریداران در بازار مسکن بوده است و بسیاری از خریداران بالقوه به دلیل نرخ بالای وام مسکن و افزایش قیمت مسکن در حاشیه نشسته‌اند. طبق داده‌های فردی مک، متوسط ​​نرخ 30 ساله وام مسکن ثابت به 6.95 درصد در هفته گذشته رسید و سایر نظرسنجی‌های ملی نشان می‌دهند که این نرخ بسیار بالاتر از 7 درصد است. ردفین در گزارش قبلی اعلام کرد در سراسر ایالات متحده، فروشندگان خانه 58 درصد از خریداران بیشتر بودند. بر اساس گزارش انجمن ملی مشاوران املاک، عرضه خانه های"}, {"source": "Business Insider", "title": "AI agents are ready to run your life. Do you trust them?", "link": "https://www.businessinsider.com/ai-agents-misbehavior-alignment-privacy-muse-instinct-2026-9", "summary": "Mark Zuckerberg s vision of personal superintelligence for all is starting to come to fruition. Bloomberg/Getty Images Would you trust an AI agent with the keys to your digital kingdom? Tech firms like Meta are betting you will, just as agents have shown they aren't always aligned with our interests. Cybersecurity professionals warn that the convenience agents offer comes with a tradeoff. AI assistants are finally ready to help you run your life. All you need to do is trust them with your email login, your contacts, and your credit card — and hope they don't go rogue. Meta, Google, and the buzzy startup Instinct have rolled out personal AI agents in recent months that promise to handle tasks such as booking travel, buying concert tickets, and scouring Facebook Marketplace for deals. At a basic level, these agents behave largely the same way. You send the agent a request via an app or WhatsApp — or, in the case of the newly launched Rene agent, via iMessage — and leave it to complete the task. The catch is that AI agents are only as useful as the level of access that you give them. Want AI to book your flight? It'll need access to your credit card and airline account. Want it to tidy up your inbox? It will need the keys to your email. These shiny new tools come after a summer of multiple high-profile incidents in which AI agents went rogue and hacked companies, as well as user reports of their own agents taking unintended actions. Are you using AI agents? Let us know how in this survey. In one case earlier this year, a man in Australia said his AI agent running on OpenClaw secured him a spot in a Pilates class by breaking into the gym's online booking system. The result is a sense of whiplash between wonder and anxiety. Early adopters of personal AI agents have shared examples of how the technology has made their lives much easier , but also ways in which it hasn't gone to plan. \"It has access to your email, files, accounts, and even passwords — a mistake or manipulation could have real-world consequences, and that is terrifying,\" Jake Moore, global cybersecurity advisor at internet security firm ESET, told Business Insider. Agents in a time of misalignment This summer, before fears of an AI apocalypse reached fever pitch, a flurry of tech companies reported incidents in which their AI agents went rogue. In July, an internal OpenAI model escaped its development sandbox and broke into Hugging Face's internal systems , the companies said. Meta and Anthropic l", "date_str": "2026-09-20T09:01:01+00:00", "hash": "23049a08af6d7c13", "title_fa": "عوامل هوش مصنوعی آماده هستند تا زندگی شما را اداره کنند. آیا به آنها اعتماد دارید؟", "summary_fa": "چشم انداز مارک زاکربرگ از ابرهوش شخصی برای همه در حال تحقق است. بلومبرگ/گتی ایماژ آیا به یک عامل هوش مصنوعی در مورد کلیدهای پادشاهی دیجیتال خود اعتماد دارید؟ شرکت‌های فناوری مانند Meta شرط می‌بندند که این کار را انجام دهید، همانطور که نمایندگان نشان داده‌اند که همیشه با منافع ما همسو نیستند. متخصصان امنیت سایبری هشدار می‌دهند که پیشنهادات آژانس‌های راحتی همراه با معاوضه است. دستیاران هوش مصنوعی در نهایت آماده هستند تا به شما کمک کنند تا زندگی خود را اداره کنید. تنها کاری که باید انجام دهید این است که به آنها در مورد ورود ایمیل، مخاطبین و کارت اعتباری خود اعتماد کنید - و امیدوار باشید که آنها سرکش نباشند. متا، گوگل و استارت‌آپ پر سر و صدا Instinct در ماه‌های اخیر عوامل هوش مصنوعی شخصی را راه‌اندازی کرده‌اند که قول می‌دهند کارهایی مانند رزرو سفر، خرید بلیط کنسرت، و جستجوی بازار فیس‌بوک برای معاملات را انجام دهند. در سطح پایه، این عوامل تا حد زیادی یکسان رفتار می کنند. شما درخواستی را از طریق یک برنامه یا واتس اپ - یا در مورد عامل Rene که به تازگی راه اندازی شده است، از طریق iMessage - برای نماینده ارسال می کنید و آن را ترک می کنید تا کار را کامل کند. نکته مهم این است که عوامل هوش مصنوعی به اندازه سطح دسترسی شما به آنها مفید هستند. آیا هوش مصنوعی می‌خواهید پروازتان را رزرو کند؟ نیاز به دسترسی به کارت اعتباری و حساب هواپیمایی شما دارد. آیا می خواهید صندوق ورودی شما را مرتب کند؟ به کلیدهای ایمیل شما نیاز دارد. این ابزارهای براق جدید پس از تابستانی با چندین اتفاق پرمخاطب به دست می‌آیند که در آن عوامل هوش مصنوعی سرکشی کردند و شرکت‌ها را هک کردند، و همچنین گزارش‌هایی از کاربران درباره انجام اقدامات ناخواسته توسط عوامل خود. آیا از عوامل"}, {"source": "Business Insider", "title": "I paid $45,000 upfront to rent this Bali home for 10 years. Here’s what it cost me to retire there.", "link": "https://www.businessinsider.com/cost-of-living-american-retiree-bali-2026-9", "summary": "Debbie Welsch, 57, an American who retired to Bali with her 82-year-old mother. Business Insider Debbie Welsch moved from Los Angeles to Bali for a simpler, more affordable retirement life. Welsh's Bali home costs $8,000 annually, drastically reducing her living expenses. In Bali, Welsch lives on $1,300 monthly, funded by savings and a $550,000 retirement investment. This is an as-told-to essay based on a conversation for our Cost of Living video series with Debbie Welsch, 57, an American who retired to Bali with her 82-year-old mother. It has been edited for length and clarity. My 10-year lease for my 1,100-square-foot house in Bali is $4,500 a year — that is $375 a month in rent. The one caveat: I had to pay my landlord the $45,000 upfront. I also had to budget around $3,500 a year for renovation costs, totaling $35,000 over 10 years. In total, my housing costs for a year average $8,000. The move was 100% worth it. One of the renovations was the addition of a swimming pool for $7,000. Business Insider I moved from Los Angeles to Bali with my 82-year-old mom over seven years ago. Before I moved and retired, I worked as an interior designer, earning $120,000 a year. Back then, I couldn't afford to live in my house because my mortgage and property taxes were too high. For a time, I rented out my house and stayed in a room at one of my friends' homes. This was when I decided to change my lifestyle. I met with a financial consultant who told me that, based on what I could cash out from my house and grow through investments, I could live on a budget of $2,000 a month. So I decided to travel to five different places in the world to see if I could live there full-time. Bali's always been my happy place, and a lot of it has to do with the people. I sold everything I owned — My house, my car. After moving here, I felt like a big weight had been released. Life is just simple here. Interested in being featured in a Business Insider video? Show us what it costs to make a living in your city by filling out this form or contacting a reporter at mros@businessinsider.com . What the cost of living in Bali looks like. I live on $1,300 a month. The money comes from savings, especially from the sale of my house back in LA. In total, my retirement savings are around $550,000, which are now in investments. I also earn around $4,000 a year from my hobbies, including my work as a contemporary romance writer and my own YouTube channel. My monthly house maintenance costs are aroun", "date_str": "2026-09-20T09:00:01+00:00", "hash": "39b3a408aab6c682", "title_fa": "برای اجاره این خانه در بالی به مدت 10 سال 45000 دلار پیش پرداخت کردم. در اینجا هزینه بازنشستگی من در آنجا است.", "summary_fa": "دبی ولش، 57 ساله، آمریکایی که با مادر 82 ساله خود به بالی بازنشسته شد. Debbie Welsch از لس آنجلس به بالی نقل مکان کرد تا یک زندگی بازنشستگی ساده تر و مقرون به صرفه تر داشته باشد. خانه ولز در بالی سالانه 8000 دلار هزینه دارد که هزینه های زندگی او را به شدت کاهش می دهد. در بالی، ولش با 1300 دلار ماهانه زندگی می کند که از طریق پس انداز و 550000 دلار سرمایه گذاری بازنشستگی تامین می شود. این یک مقاله گفته شده بر اساس گفتگوی مجموعه ویدیویی هزینه زندگی ما با دبی ولش، 57 ساله، آمریکایی است که با مادر 82 ساله خود به بالی بازنشسته شد. برای طول و وضوح ویرایش شده است. اجاره 10 ساله من برای خانه 1100 فوت مربعی ام در بالی 4500 دلار در سال است – یعنی 375 دلار در ماه اجاره. اخطار یک: من باید 45000 دلار را به صاحبخانه می پرداختم. من همچنین مجبور شدم سالانه حدود 3500 دلار برای هزینه های بازسازی بودجه اختصاص دهم که در مجموع 35000 دلار در طول 10 سال است. در کل هزینه مسکن من برای یک سال به طور متوسط ​​8000 دلار است. این حرکت 100% ارزشش را داشت. یکی از بازسازی ها اضافه شدن یک استخر شنا به قیمت 7000 دلار بود. Business Insider من بیش از هفت سال پیش با مادر 82 ساله ام از لس آنجلس به بالی نقل مکان کردیم. قبل از نقل مکان و بازنشستگی، به عنوان یک طراح داخلی کار می کردم و سالانه 120000 دلار درآمد داشتم. در آن زمان، من نمی توانستم در خانه ام زندگی کنم، زیرا مالیات وام مسکن و دارایی ام خیلی بالا بود. مدتی خانه ام را اجاره دادم و در اتاقی در خانه یکی از دوستانم ماندم. این زمانی بود که تصمیم گرفتم سبک زندگی ام را"}, {"source": "Business Insider", "title": "The double-whammy that's about to hit the US economy", "link": "https://www.businessinsider.com/us-economy-slowdown-consumer-spending-federal-reserve-interest-rate-hikes-2026-9", "summary": "iStock; Tyler Le/BI If you ask most economists, market experts, and even the Federal Reserve, the story of the US economy for the rest of 2026 will be one of strong and steady growth. But there are serious reasons to doubt this forecast of calm waters. There's no better example of the sanguine consensus view than the Fed's latest Summary of Economic Projections, released as part of the central bank's meeting on Wednesday. According to the FOMC's rundown, no participants saw the risks to GDP growth as tilted to the downside. Meanwhile, after this week's interest rate hike — the first in three years — investors and analysts don't really see the Fed taking much more action. In the face of buoyant growth predictions and strong financial conditions, the market is priced for another two rate hikes between now and March, not much else. Again, this feels optimistic given the near-term risks that inflation could reheat in the coming months. Despite the rhetoric, the US economy is facing a squeeze from two ends. The first is a slowdown in consumer spending , as Americans pull back amid higher inflation , sluggish income growth, and geopolitical uncertainty . The second is the Federal Reserve's renewed interest rate hikes , which will ultimately need to slow the economy down to tame price hikes. Hoping for inflation to cool on its own seems more difficult to justify every month that inflation remains above the Fed's target. There are reasons to expect consumer spending to slow and reasons to expect the Fed not to act as a shock absorber. The net effect of this is clear: somewhat higher unemployment and somewhat tighter financial market conditions (aka lower stock prices), in order to ultimately achieve slower inflation. Consumer likely cools In recent years, American consumers have been the crucial drivers of the economy. While AI has attracted considerable attention , consumer resilience has been an important driver of US GDP . In the first half of 2026, Americans did their part and used their wallets to fuel the economy. Indeed, in the second quarter of the year, real consumption added nearly 2.5 percentage points to growth. Growth in the current quarter continues to run at a breakneck pace, but looking at the rest of the year, there are several reasons to worry that spending may not hold up. The most obvious reason for the slowdown is that the boost from larger tax refunds is fading away. In the first half of the year, Americans saw about an 11% increase in their ", "date_str": "2026-09-20T08:47:01+00:00", "hash": "ffd43f1296070bd7", "title_fa": "ضربه دوگانه ای که در شرف ضربه زدن به اقتصاد ایالات متحده است", "summary_fa": "آی استوک؛ Tyler Le/BI اگر از بیشتر اقتصاددانان، کارشناسان بازار و حتی فدرال رزرو بپرسید، داستان اقتصاد ایالات متحده برای بقیه سال 2026 رشد قوی و پایدار خواهد بود. اما دلایل جدی برای تردید در این پیش بینی آب های آرام وجود دارد. هیچ نمونه ای بهتر از آخرین خلاصه پیش بینی های اقتصادی فدرال رزرو که در بخشی از جلسه روز چهارشنبه بانک مرکزی منتشر شد، از دیدگاه اجماع منطقی وجود ندارد. با توجه به خلاصه FOMC، هیچ شرکت کننده ای متوجه خطرات رشد تولید ناخالص داخلی به سمت نزولی نشد. در همین حال، پس از افزایش نرخ بهره در این هفته - اولین بار در سه سال اخیر - سرمایه گذاران و تحلیلگران واقعا نمی بینند که فدرال رزرو اقدام بیشتری انجام دهد. در مواجهه با پیش‌بینی‌های رشد پررونق و شرایط مالی قوی، بازار برای دو افزایش نرخ دیگر از هم‌اکنون تا مارس قیمت‌گذاری می‌کند، نه چیز دیگری. باز هم، با توجه به خطرات کوتاه مدتی که تورم می تواند در ماه های آینده دوباره گرم شود، این امر خوش بینانه است. با وجود لفاظی ها، اقتصاد ایالات متحده با فشار از دو طرف مواجه است. اولین مورد کاهش هزینه های مصرف کننده است، زیرا آمریکایی ها در میان تورم بالاتر، رشد کند درآمد و عدم اطمینان ژئوپلیتیکی عقب نشینی می کنند. دوم افزایش مجدد نرخ بهره توسط فدرال رزرو است که در نهایت نیاز به کاهش سرعت اقتصاد برای مهار افزایش قیمت دارد. به نظر می رسد امیدواری به کاهش خود به خود تورم، توجیه هر ماه که تورم بالاتر از هدف فدرال رزرو باقی بماند، دشوارتر است. دلایلی وجود دارد که انتظار می رود هزینه های مصرف کننده کاهش یابد و دلایلی وجود دارد که از فدرال رزرو به عنوان یک ضربه گیر عمل نکند. اثر خالص این واضح است: تا حدودی بیکاری بیشتر و شرایط"}, {"source": "Business Insider", "title": "I’m the CEO of a self-improvement app, and I hired someone on my board to argue with me", "link": "https://www.businessinsider.com/ceo-hired-a-board-member-to-argue-with-me-2026-9", "summary": "Oleksandr Matsiuk hired outspoken employees and a board member who would challenge him to get honest feedback as a CEO. Courtesy of RiseGuide Oleksandr Matsiuk found that CEOs can struggle to get honest feedback. Matsiuk hired outspoken employees and a board member who would challenge him. Matsiuk found that measuring outputs can be more helpful than measuring outcomes. This as-told-to essay is based on a conversation with Oleksandr \"Alex\" Matsiuk, cofounder and CEO of RiseGuide, an expert-powered microlearning app. The company has grown to 110 employees across 12 countries since its founding in 2024. The essay has been edited for length and clarity. Becoming the CEO of a fast-growing company created a problem I hadn't anticipated: Nobody was responsible for telling me how to improve. I decided that if honest feedback wasn't reaching me naturally, I needed to build a system that would deliver it. That included hiring outspoken employees and bringing someone onto my board specifically to argue with me. I felt stuck in my progress as a CEO As CEO, I don't have a formal manager , performance reviews, or a personal development plan. My performance is largely judged by the company's performance, but that isn't always the right approach. A CEO can be doing something wrong or have plenty of room for improvement. If the business is growing, few people will say, \"This could have been better.\" At board meetings, I would present an idea and hear, \"Everything is clear. Keep doing a great job.\" That frustrated me. I might have been outperforming the competition, but was I living up to my potential? Was the company living up to its potential? Feedback is essential for any professional's growth , and CEOs have flaws, perhaps even more than other people. I began designing feedback systems around myself, including direct reminders to employees that I wanted their honest opinions. I sought out people who weren't afraid to challenge me When hiring, I look for opinionated, independent thinkers . There isn't one interview question that identifies them. I watch how they behave. We often approach people who aren't actively looking for jobs . The best candidates know their value, so they interview me as much as I interview them. One creative producer, for example, questioned me for 45 minutes. When I mentioned our beautiful office and its view, she said, \"Show me.\" I picked up my laptop and gave her a tour. I thought: If she made me do that during an interview, imagine what she'l", "date_str": "2026-09-20T08:11:01+00:00", "hash": "f8e0bad2720d9bf6", "title_fa": "من مدیر عامل یک برنامه خودسازی هستم و فردی را در هیئت مدیره خود استخدام کردم تا با من بحث کند.", "summary_fa": "Oleksandr Matsiuk کارمندان صریح و یک عضو هیئت مدیره را استخدام کرد که او را برای دریافت بازخورد صادقانه به عنوان مدیر عامل به چالش بکشد. با حسن نیت از RiseGuide Oleksandr Matsiuk متوجه شد که مدیران عامل برای دریافت بازخورد صادقانه مشکل دارند. ماتسیوک کارمندان صریح و یک عضو هیئت مدیره را استخدام کرد که او را به چالش بکشد. Matsiuk دریافت که اندازه گیری خروجی ها می تواند مفیدتر از اندازه گیری نتایج باشد. این مقاله همانطور که گفته شد بر اساس گفتگو با Oleksandr \"Alex\" Matsiuk، یکی از بنیانگذاران و مدیر عامل RiseGuide، یک برنامه ریزآموزش متخصص است. ick is the Petfusion Ultimate Dog Lounge , which has unfortunately been discontinued. For now, you can still get it in limited sizes and colors while we test new options. It earned high marks for support, comfort, and durability. A budget-friendly option is the Bedsure Pet Orthopedic Dog Sofa . It offers great support and comfort, though it's not as durable or easy to clean as our picks from other brands in this guide. To select the best orthopedic beds, we tested 22 popular options with a group of mostly senior pups who napped and lounged on each one for several weeks. We also asked veterinarians what features to look for in an orthopedic dog bed. Our top picks for the best orthopedic dog beds Best overall: Petfusion Ultimate Dog Lounge - $73-$230 at Amazon Best budget with bolsters: Bedsure Pet Orthopedic Dog Sofa - $47-$80 at Chewy Best budget mat: Bedsure Pet Orthopedic Mat - $35-$55 at Chewy Best stylish: Lay Lo Dog Bed - $139-$229 at Etsy Best for small dogs: Big Barker Barker Junior - $150-$180 at Big Barker Best for crates: Big Barker Ortho Lift Crate Bed - $110-$230 at Big Barker Best overall Why this is our top pick: The Petfusion Ultimate Dog Lounge offered the best orthopedic support of all the beds we tested. Plus, it has an ideal bolster-style design and a super durable twill cover. What our testers said: We tested the large size with a 45-pound Labradoodle and a 45-pound beagle. Both dogs rested comfortably on this bed and were evenly supported by the dense memory foam. Our experts say many dogs, like our Labradoodle and hound testers, prefer to have something solid to rest their backs against ", "date_str": "2026-09-19T23:01:01+00:00", "hash": "dab2cb24782142b6", "title_fa": "بهترین تخت سگ ارتوپدی", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید ما 22 تخت سگ ارتوپدی را قبل از انتخاب بهترین آنها از Petfusion، Bedsur و غیره آزمایش کردیم. لیزا ساباتینی; امی گریوز/Business Inside milestone-announcements-on-social-media-engagement-pregnancy-2026-9", "summary": "The author, shown with her husband and their child, chose not to post about big life milestones on social media. Courtesy of Renate Flanagan. I always felt special when my friends told me about big news before they posted it on social media. When it came time for me to share some milestones, I chose to do it in person or over the phone. For me, getting a hug is way better than getting likes on a post. Years ago, I got a call from a friend . \"The most amazing thing happened,\" she gushed, \"we got engaged!\" She proceeded to tell me about how her boyfriend proposed. They're such a loving and compatible couple, I couldn't have been happier for them. Days later, I saw the picture online, her finger encrusted with an antique diamond ring , an heirloom from her fiancé's grandmother, just like she had told me about over the phone. Over the years, I would get a message, sometimes out of the blue, from a friend saying something along the lines of, \"Let's catch up.\" Then we'd set up a time to meet, or, if we lived too far apart, have a phone call. At times, the news was joyful, like a pregnancy or a major step in a relationship. Other times, it was somber, a divorce, a job loss , a tragic health condition. Sometimes I would see my friends post on social media later, after they had already told me. Each time, I felt honored that they had reached out to me directly. I felt special that they wanted to make sure I knew what was going on in their life, and not just that I was within the blast radius of a social media post. When it was my turn, I prioritized personal connections The year 2023 was big for me. At the beginning of the year, my boyfriend and I bought a weekend house in the mountains. That spring, he proposed to me at that weekend house, under a starry sky. We were both in our mid-30s and eager to start a family. That summer, we eloped with an intimate ceremony at the same place we had our first date three years earlier. In the fall, we shared the good news with family and friends that we were expecting our first child. I felt the temptation to share all my good fortunes with pictures broadcasted across the World Wide Web . But instead of a picture, I sent my friends a message. \"Let's get together,\" or \"let's have a call,\" it said. When the author and her husband purchased a new home, they shared the news with friends and family in person. Courtesy of Renate Flanagan. Instead of posting the quintessential picture of us holding up a set of keys in front of a hous", "date_str": "2026-09-19T19:17:01+00:00", "hash": "9dea15e94156aae3", "title_fa": "من در شبکه های اجتماعی درباره خرید خانه، ازدواج یا بارداری خود پستی ندادم. لحظه ها را معنادارتر می کرد.", "summary_fa": "نویسنده که همراه با همسرش و فرزندشان نشان داده شده است، ترجیح داد در مورد نقاط عطف زندگی بزرگ در رسانه های اجتماعی پست نکند. با حسن نیت از Renate Flanagan. وقتی دوستانم قبل از انتشار اخبار مهم در رسانه های اجتماعی به من می گفتند همیشه احساس خاصی داشتم. وقتی نوبت به اشتراک گذاشتن برخی نقاط عطف رسید، ترجیح دادم این کار را حضوری یا تلفنی انجام دهم. برای من، در آغوش گرفتن خیلی بهتر از لایک گرفتن در یک پست است. سال ها پیش از یکی از دوستانم با من تماس گرفت. او با صدای بلند گفت: \"شگفت انگیزترین اتفاق افتاد، ما نامزد کردیم!\" او به من گفت که چگونه دوست پسرش خواستگاری کرده است. آنها آنقدر زوج دوست داشتنی و سازگار هستند، من نمی توانستم برای آنها خوشحال باشم. چند روز بعد، تصویر را در اینترنت دیدم، انگشت او با یک حلقه الماس عتیقه، میراث مادربزرگ نامزدش، درست همانطور که از طریق تلفن به من گفته بود. در طول سال‌ها، گاهی اوقات از طرف یکی از دوستانم پیامی دریافت می‌کردم که می‌گفت: «بیا جلوی خودمان را بگیریم». سپس زمانی را برای ملاقات تعیین می‌کردیم، یا اگر خیلی دور از هم زندگی می‌کردیم، یک تماس تلفنی داشتیم. گاهی اوقات، این خبر خوشحال کننده بود، مانند بارداری یا یک قدم بزرگ در یک رابطه. زمان‌های دیگر، غم‌انگیز بود، طلاق، از دست دادن شغل، وضعیت سلامتی غم‌انگیزی. گاهی اوقات می‌دیدم که دوستانم بعداً در شبکه‌های اجتماعی پست می‌کنند، بعد از اینکه قبلاً به من گفته بودند. هر بار احساس افتخار می کردم که آنها مستقیماً با من تماس گرفتند. من احساس خاصی داشتم که آنها می‌خواستند مطمئن شوند که من می‌دانم در زندگی آنها چه می‌گذرد، و نه اینکه فقط در شعاع انفجار یک پست رسانه اجتماعی هستم. وقتی نوبت من شد، ارتباطات شخصی را در اولویت قرار دادم سال"}, {"source": "Business Insider", "title": "Trump announces a new 'AI Force,' but says he will not 'stifle' AI", "link": "https://www.businessinsider.com/trump-ai-regulation-slowdown-anthropic-dario-amodei-9-2026", "summary": "President Donald Trump said on Saturday that he was creating a new AI force. Anna Moneymaker/Getty Images President Donald Trump said he will not \"in any way hinder or stifle\" AI development. Trump also said he was making a new \"AI force\" and appointing an AI \"Czar.\" Leaders of US frontier AI labs last week called for the US government to regulate the industry. President Donald Trump said on Saturday that he was creating a new \"AI force\" to \"watch over\" AI development, one week after a chorus of AI leaders called for government regulation of the ever-advancing tech. At the same time, he said he would not heed those leaders' call to slow down AI development. \"We will not in any way hinder or stifle the Growth of this incredible Industry,\" the president said on Truth Social, his social media platform. \"Rather, we will cherish it, help it, and watch over it, as it grows!\" Trump said he would also soon be announcing a new AI \"Czar.\" Trump's comments on Saturday amount to his most concrete response yet toward calls from leaders of frontier AI labs to slow down and regulate AI development to ensure its safety for humanity. Trump did not offer further details about the new AI Force in his social media post. Trump likened calls to slowing AI development to \"Hoaxes, all generated by the Radical Left Dumocrats, for purposes of destroying our Country.\" He said existing criminal statutes were sufficient to hat Sony did get letters from Meta, and I do not think those letters said, 'We're wishing you all the luck in the world.'\" Sorkin said that Sony's legal department typically vets non-fiction films thoroughly, but for \"The Social Reckoning,\" the studio hired an \"outside law firm\" to ensure \"every single thing that is presented as a fact is a fact.\" \"The things that I wasn't able to say or do are agonizing,\" Sorkin said. \"I will say, the irony wasn't lost on anybody that we were doing a thorough fact-check of a movie about a company unwilling to do the same thing.\" During the interview, Sorkin said he makes a distinction between the real Zuckerberg and the character in his films. \"I'll do my research. I'll learn everything that I can about the reality. I'll talk to as many people as I can, read as much as I can, but in the process of thinking about it and then in the process of writing it, it becomes the same as a fictional character for me,\" Sorkin said. \"It becomes a character that I'm creating.\" \"The Social Reckoning\" is a legal drama based on the real-life fallout from the 2021 Facebook leak . Former Facebook employee Frances Haugen copied a trove of internal documents before leaving the company that spring. The documents showed that Facebook, now Meta, was aware that aspects of its platforms had adverse effects on its users. Haugen shared the documents with The Wall Street Journal, which published a series of high-profile articles. She later testified before a Senate subcommittee and said the company prioritized profits over user safety. Actor Mikey Madison plays Haugen, while Jeremy Allen White plays former Wall Street Journal reporter Jeff Horwitz.", "date_str": "2026-09-19T18:07:11+00:00", "hash": "275a7c00248961f8", "title_fa": "آرون سورکین می‌گوید سونی وکلای خارجی را برای بررسی واقعیت‌های «تحقیق اجتماعی» استخدام کرده است، زیرا متا «منابع نامحدودی» دارد.", "summary_fa": "فیلم جدید آرون سورکین کارگردان درباره فیس بوک و مارک زاکربرگ ماه آینده ا
