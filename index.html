<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۴ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۴ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۵ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۲۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۲</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۸</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۷</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>
    const data = {
      persian: [{"source": "Independent Persian", "title": "از جرف‌الصخر تا مرزهای اقلیم کردستان؛ بغداد کنترل نفت و گذرگاه‌ها را گسترش می‌دهد", "link": "https://www.independentpersian.com/node/423336/%D8%AC%D9%87%D8%A7%D9%86/%D8%A7%D8%B2-%D8%AC%D8%B1%D9%81%E2%80%8C%D8%A7%D9%84%D8%B5%D8%AE%D8%B1-%D8%AA%D8%A7-%D9%85%D8%B1%D8%B2%D9%87%D8%A7%DB%8C-%D8%A7%D9%82%D9%84%DB%8C%D9%85-%DA%A9%D8%B1%D8%AF%D8%B3%D8%AA%D8%A7%D9%86%D8%9B-%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF-%DA%A9%D9%86%D8%AA%D8%B1%D9%84-%D9%86%D9%81%D8%AA-%D9%88-%DA%AF%D8%B0%D8%B1%DA%AF%D8%A7%D9%87%E2%80%8C%D9%87%D8%A7-%D8%B1%D8%A7-%DA%AF%D8%B3%D8%AA%D8%B1%D8%B4-%D9%85%DB%8C%E2%80%8C%D8%AF%D9%87%D8%AF", "summary": "علی فالح الزیدی، نخست‌وزیر عراق، سه‌شنبه سوم آذر دستور داد دولت فدرال اداره تمام گذرگاه‌های مرزی اقلیم کردستان را به دست بگیرد و وزارت نفت عراق مدیریت میدان‌های نفتی فدرال تحت حفاظت نیروهای کرد در چهار استان را بر عهده بگیرد. این دستور چهار روز پس از ورود نیروهای دولتی به جرف‌الصخر، پایگاه اصلی کتائب حزب‌الله در استان بابل صادر شده است. هر دو اقدام در پی تحقیقات درباره قاچاق نفت انجام شده است و دامنه مداخله مستقیم بغداد در حفاظت از زیرساخت‌های نفتی و نظارت بر مسیرهای انتقال فرآورده‌های نفتی را گسترش می‌دهد. صباح النعمان، سخنگوی فرمانده کل نیروهای مسلح عراق، امروز اعلام کرد که بر اساس دستور نخست‌وزیر، هیئت فدرال گذرگاه‌های مرزی اداره همه گذرگاه‌های اقلیم را بر عهده می‌گیرد. فرماندهی مرزبانی هم موظف شده است گذرگاه‌های غیررسمی در امتداد مرزهای بین‌المللی عراق، از جمله در اقلیم کردستان را ببندد. دستور مربوط به میدان‌های نفتی شامل تاسیساتی است که بغداد آن‌ها را متعلق به وزارت نفت می‌داند و حفاظت از آن‌ها در استان‌های کرکوک، نینوا، دیاله و صلاح‌الدین در اختیار نیروهای کرد است. الزیدی همچنین به دولت اقلیم دستور داده است مجوز صادرات نفت خام و فرآورده‌های نفتی را فقط از طریق وزارت نفت فدرال صادر کند. حفاظت از میدان‌ها به پلیس انرژی عراق واگذار می‌شود و دولت برای ثبت میزان تولید چاه‌ها و نظارت بر خطوط لوله، نصب کنتورهای الکترونیکی و راه‌اندازی سامانه پایش را در دستور کار قرار داده است. وزارت منابع طبیعی اقلیم می‌گوید ص حافظت می‌شود. ساعت هوشمند هواوی مجهز به سیستم‌عامل HarmonyOS 7.0 است و از بیش از ۱۱۰ حالت ورزشی، پایش ضربان قلب، سنجش اکسیژن خون (SpO2)، دمای پوست، نوار قلب (ECG)، موقعیت‌یاب ماهواره‌ای دومنظوره GNSS، تراشه‌ی NFC و بلوتوث 6.0 پشتیبانی می‌کند. قیمت ساعت هوشمند در نسخه‌ی پایه با بند سیلیکونی ۲٬۴۹۹ یوان (حدود ۳۷۵ دلار) تعیین شده و مدل مجهز به بند فلزی میلانس از جنس فولاد ضدزنگ با عدد ۲٬۹۹۹ یوان (حدود ۴۵۰ دلار) به فروش می‌رسد. هواوی هنوز برنامه‌ی عرضه‌ی جهانی ساعتش ندارد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت", "image_url": "https://api2.zoomit.ir/media/huawei-watch-air-smartwatch-6b059cca11439fc006404730?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["تراشه"], "datetime_fa": "۳ آذر • ۱۷:۵۹"}, {"source": "Lifehacker", "title": "AI May Be Scanning Your Private Signal Chats", "link": "https://lifehacker.com/tech/ai-may-be-scanning-your-private-signal-chats?utm_medium=RSS", "summary": "If you use Signal , it's likely you care at least a little bit about keeping your communication private so only you and those you're chatting with can see your message threads. Signal's end-to-end encryption keeps prying eyes out, but if you use agentic AI on your device, your chats may not be as locked down as you think. In a recent blog post , Signal president Meredith Whitaker outlined the potential threat AI assistants like Siri and Gemini pose to the platform's promise of privacy. Systems-level capabilities like Gemini Intelligence (on Android) and Siri AI's Onscreen Awareness (on iOS and macOS) scan your screen and may be able to capture data from Signal conversations in the process, which can then be used to perform tasks. Not only does this potentially expose your information, but that of other conversation participants as well. Whitaker notes that this leaves privacy protections outside of Signal's control because the platform cannot easily restrict AI access to the app. Signal has already blocked screenshot capabilities for Microsoft's Recall AI, which by default was able to take and store screen grabs of Signal messages on Windows 11. While Signal cannot guarantee that AI won't have access to your data, there are a few protections now available for those on iOS and Android as well. How to limit AI from reading your Signal chats The main workaround in Signal for now is to restrict screenshots and screen recordings inside the app, though this does not prevent AI agents from potentially grabbing content from other parts of your device. According to Signal's support documents , these protections will now be enabled by default on iOS 27 and Android with the latest versions of the Signal app. Users on iOS 27 can confirm or manually disable screenshot protection via Settings Privacy Block Siri AI . The compromise with this setting is that it also blocks you from taking screenshots of Signal conversations in the app and App Switcher, though you can disable it temporarily for 10 minutes if needed. On Android, Signal automatically engages the \"Screen security\" setting when it detects an AI agent attempting to access the screen. This, too, blocks screenshots inside the app and can be disabled via Settings Privacy App security Screen security . Signal cannot block screenshots on macOS 27. However, users can add Signal to their Excluded Apps list via System Settings Siri , which at least limits proactive access to conversations by Siri AI.", "date_str": "2026-11-24T14:30:00+00:00", "hash": "c37061c9154b4a16", "title_fa": "هوش مصنوعی ممکن است چت های سیگنال خصوصی شما را اسکن کند", "summary_fa": "اگر از Signal استفاده می کنید، احتمالاً حداقل کمی به خصوصی نگه داشتن ارتباط خود اهمیت می دهید تا فقط شما و کسانی که با آنها چت می کنید بتوانید رشته های پیام خود را ببینید. رمزگذاری سرتاسر سیگنال چشمان کنجکاو را از خود دور می کند، اما اگر از هوش مصنوعی عاملی در دستگاه خود استفاده می کنید، ممکن است چت شما آنقدر که فکر می کنید قفل نشود. در یک پست وبلاگ اخیر، مردیث ویتاکر، رئیس سیگنال، تهدید بالقوه دستیاران هوش مصنوعی مانند سیری و جمینی را برای وعده حریم خصوصی پلتفرم بیان کرد. قابلیت‌های سطح سیستم مانند Gemini Intelligence (در اندروید) و Siri AI Onscreen Awareness (در iOS و macOS) صفحه‌نمایش شما را اسکن می‌کنند و ممکن است بتوانند داده‌هایی را از مکالمات سیگنال در این فرآیند ضبط کنند، که سپس می‌تواند برای انجام وظایف استفاده شود. این نه تنها به طور بالقوه اطلاعات شما، بلکه سایر شرکت کنندگان در مکالمه را نیز آشکار می کند. ویتاکر خاطرنشان می کند که این امر حفاظت از حریم خصوصی را خارج از کنترل سیگنال قرار می دهد زیرا این پلتفرم نمی تواند به راحتی دسترسی هوش مصنوعی را به برنامه محدود کند. سیگنال قبلاً قابلیت‌های اسکرین‌شات را برای Recall AI مایکروسافت مسدود کرده است، که به طور پیش‌فرض می‌توانست پیام‌های سیگنال را در ویندوز 11 بگیرد و ذخیره کند. در حالی که سیگنال نمی‌تواند تضمین کند که هوش مصنوعی به داده‌های شما دسترسی نخواهد داشت، اکنون چند محافظت برای کسانی که در iOS و Android نیز هستند در دسترس است. چگونه هوش مصنوعی را در خواندن چت های سیگنال خود محدود کنید راه حل اصلی در سیگنال در حال حاضر محدود کردن اسکرین شات ها و ضبط صفحه در داخل برنامه است، اگرچه این مانع نمی شود که عوامل هوش مصنوعی به طور بالقوه محتوای سایر قسمت های دستگاه", "image_url": "https://lifehacker.com/imagery/articles/01M84NJC6JZ1P63B86PRX2VQBQ/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Microsoft", "امنیت سایبری"], "datetime_fa": "۳ آذر • ۱۸:۰۰"}, {"source": "The Guardian AI", "title": "Mamdani says Nvidia drama shows stock market is overly dependent on AI", "link": "https://www.theguardian.com/us-news/2026/nov/24/mamdani-nvidia-stock-market-ai", "summary": "New York City mayor notes ‘massive impact’ on working Americans’ lives when Jensen Huang stepped down as CEO Zohran Mamdani , New York City ’s mayor, on Monday weighed in on the corporate turbulence surrounding Nvidia and the chipmaker’s chief executive officer, Jensen Huang , saying he does not think working Americans “signed up for their yards and outside help. Staffing and spare-parts shortages also complicate efforts to keep warships ready. The US Navy is bringing back specialized repair commands to rebuild skills it says have eroded, as it prepares sailors to keep warships running far from shipyards and outside help. The service has so far reestablished four Shore Intermediate Maintenance Activities, or SIMA, facilities — two on the East Coast and two on the West Coast. The commands combine ship repairs with training. In a Navy announcement this summer, Capt. Bill Albert, who commands SIMA San Diego, described its return as \"reversing the degradation of technical skills at sea.\" San Diego's original SIMA was folded into a regional maintenance center over two decades ago. The Navy hopes that restoring San Diego, and standing up others, can help make repair training practice a priority on par with actually completing repairs . Sailors work on operational equipment alongside more experienced technicians at these repair facilities, developing troubleshooting skills that the naval ranks need but frequently lack. Years of consolidating maintenance organizations have reduced sailors' opportunities to master repair skills, Chief of Naval Operations Adm. Daryl Caudle told lawmakers in written testimony in May. A 2024 government watchdog report found that personnel shortages and inadequate training hindered shipboard maintenance . Among executive officers surveyed, 75% said sailors had moderate to extreme difficulty completing repairs when relying on available formal training. The Navy's problems extend beyond sailors' technical maintenance skills. That same watchdog report found many ships have difficulty even completing repairs underway with their assigned crews and obtaining enough spare parts to complete repairs. The Navy has struggled for years with a strained shipbuilding and repair industrial base. Workforce shortages , limited shipyard capacity , and constant delays have complicated efforts to ke  مهلت پس از شناسایی مناسب بالقوه، Elev8on از اولین مکالمه با عوامل استعداد، مدیران و مدیران کسب و کار کار خواهد کرد و درباره نقش ها، تعهدات و مشارکت مذاکره خواهد کرد. این طرح برای محرمانه نگه داشتن منافع با هویت ها، ارقام و مشخصاتی است که تحت قراردادهای محرمانه نگهداری می شوند. او افزود، همراه با آناتو، ما در حال حاضر روی دستوراتی در زمینه شراب و ارواح، ورزش، مهمان نوازی، سبک زندگی، زیبایی و فناوری کار می کنیم. ما به", "image_url": "https://deadline.com/wp-content/uploads/2025/08/Elevate-Management.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سرمایه‌گذاری", "بورس و طلا"], "datetime_fa": "۳ آذر • ۱۸:۱۳"}, {"source": "Rolling Stone", "title": "Never Mind the PR Stunts, Here’s the Sex Pistols Claiming to Part Ways With Frank Carter", "link": "https://www.rollingstone.com/music/music-news/sex-pistols-frank-carter-final-tour-dates-1235663381/", "summary": "Band will supposedly embark on final tour with Johnny Rotten's replacement next month", "date_str": "2026-11-24T14:47:44+00:00", "hash": "cd503c63e4708591", "title_fa": "به شیرین کاری های روابط عمومی اهمیت ندهید، در اینجا سکس پیستولز مدعی جدایی از فرانک کارتر است.", "summary_fa": "گروه ظاهرا تور نهایی را با جایگزین جانی راتن در ماه آینده آغاز خواهند کرد. آیا فرانک کارتر شانس بدی دارد؟ در یک سال و نیم گذشته، خواننده پانک 42 ساله بریتانیایی که آثارش شامل گالوس و کار انفرادی او در گروه Rattle Snakes است، به عنوان خواننده گروه Sex Pistols خدمت کرده است. اخیراً، گروه توری را برای جشن پنجاهمین سالگرد تنها آلبوم مناسب خود، Never Mind the Bollocks اجرا کرد. اما به نظر می رسد که از زمانی که پیستولز اعلام کرد بعد از اجرای بعدی نمایش های بریتانیا آینده ای برای کارتر وجود ندارد، بولوک ها مانند آونگی برای کارتر برگشته اند. استیو جونز گیتاریست به Kerrang گفت: این یک سواری باشکوه با بچه فرانکی بود، ما هر دقیقه را دوست داشتیم! نمایش ها تماشایی و البته فریاد بزرگی برای همه هواداران بود. بدون تو زیاد چیزی نیست این پایان پیستولز نیست... اما بیایید ببینیم چه اتفاقی می افتد. بیانیه کارتر همچنین احساسات متعددی را بیان می‌کند که با Sex Pistols به راحتی قابل توجه نیست: قدردانی، خوش‌بینی و امید. او گفت که به عنوان یک کودک جوان که در Sex Pistols بزرگ می‌شد، مقیاس این فرصت برای قدم گذاشتن در یکی از نمادین‌ترین نقش‌های تاریخ موسیقی برای من گم نشد. هرگز فکر نمی کردم که سه نمایش برای نجات بوش هال به همه اینها تبدیل شود. از استیو، پل [آشپز، درامز] و گلن [متلاک، بیس]، از شما برای اعتماد به من در انجام چنین وظیفه مهمی متشکرم. و از خدمه و هر طرفداری که در سرتاسر جهان لبخند می زدند، می رقصیدند و فریاد می زدند، تشکر می کنم. این یک افتخار بزرگ بوده است. او ادامه داد: همه چیزهای خوب باید به پایان برسند، و من واقعا مشتاقانه منتظرم تا برای آخرین بار دویدن خود را با پیستولز در سرزمین خونین خود جشن بگیرم. مثل", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/frank-carter-leaving-sex-pistols.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۱۸:۱۷"}, {"source": "Hollywood Reporter", "title": "Jason Segel Boards ‘Meeting Your Maker,’ Short About a Suicidal TV Puppet, as Executive Producer (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/jason-segel-meeting-your-maker-short-film-executive-producer-1236761095/", "summary": "Written and directed by Gregory J.M. Kasunich, the Oscar-qualified dark comedy short stars Jonathan Kite ('2 Broke Girls') and Otis, a depressed kids' TV puppet star who must confront his creator.", "date_str": "2026-11-24T14:45:00+00:00", "hash": "c5bc4fbc712a7729", "title_fa": "جیسون سیگل «Meeting Your Maker»، فیلم کوتاه درباره یک عروسک تلویزیونی انتحاری را به عنوان تهیه‌کننده اجرایی (انحصاری) انتخاب می‌کند.", "summary_fa": "به نویسندگی و کارگردانی گرگوری جی ام کاسونیچ، این فیلم کوتاه کمدی تاریک دارای شرایط اسکار، جاناتان کایت («2 دختر شکسته») و اوتیس، یک ستاره عروسکی تلویزیونی کودکان افسرده که باید با خالقش مقابله کند، بازی می کند. جیسون سیگل (کوچک شدن، ماپت‌ها، فراموش کردن سارا مارشال) به عنوان تهیه‌کننده اجرایی به فیلم کوتاه «ملاقات با سازنده‌تان» که دارای مدرک اسکار     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
