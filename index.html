      --search-border: #232f48;
      --toggle-bg: #1e293b;

      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;

      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;

      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);

      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {

      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {

    .meta-tag {

      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {

      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;

    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;

      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;

      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;

      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);

      cursor: pointer;
      line-height: 1;
      padding: 4px;

    .btn-close:hover {

      text-decoration: none;

      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }

      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

      header { padding: 18px 14px; padding-top: 56px; }

      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }

      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

ورد پاکستان با ورود به ایستگاه فضایی چین تاریخ‌ساز شد", "summary_fa": "محمد ذیشان علی به‌عنوان نخستین فضانورد پاکستان در مأموریتی مشترک با دو فضانورد چینی وارد ایستگاه فضایی تیان‌گونگ شد. او همچنین اولین فضانورد غیر چینی است که وارد این ایستگاه می‌شود محمد ذیشان علی، نخستین فضانورد پاکستان، روز چهارشنبه چهارم آذرماه، به نخستین فضانورد غیر چینی تبدیل شد که وارد ایستگاه فضایی «تیانگونگ» چین شده است؛ رویدادی که نه‌تنها لحظه‌ای تاریخی برای بلندپروازی‌های علمی پاکستان را رقم زد، بلکه نشانه‌ای از تلاش‌های پکن برای گسترش دیپلماسی فضایی‌اش هم به‌شمار می‌آید. این خلبان ۴۰ ساله که نخستین پاکستانیِ حاضر در مدار زمین است، به عنوان «متخصص محموله» فعالیت می‌کند و قرار است بین پنج تا ۱۰ روز در این ایستگاه اقامت داشته باشد. خدمۀ سه نفرۀ مأموریت فضایی «شنژو-۲۴»، حدود شش ساعت پس از پرتاب از «مرکز پرتاب ماهواره جیوچوان» در شمال غربی چین، با استفاده از موشک «لانگ مارچ-۲ اف»، در ساعت ۱۴:۳۵ به وقت محلی، مطابق با ۱۰:۰۵ به وقت تهران، وارد ایستگاه تیانگونگ شدند. اعضای جدید، شامل فرمانده چینی «تانگ هونگ‌بو» و مهندس پرواز «وو یی» به همراه محمد ذیشان علی با استقبال گرم سه فضانورد مأموریت «شنژو-۲۳» که از قبل در ایستگاه مستقر بودند، روبه‌رو شدند. محمد ذیشان علی برای آمادگی جهت این پرواز، هفت ماه در پکن تحت آموزش بود. او در این مدت در کلاس‌های فشرده زبان چینی شرکت و حتی روی فرهنگ عمومی چین هم مطالعه کرد؛ موضوعی که به‌گفتۀ خودش، گرچه بزرگترین چالش این دورۀ آموزشی بوده، اما برای ارتباط فعال با فضانوردان چینی و مرکز کنترل زمینیِ ایستگاه، ضروری است. ذیشان علی در طول حضورش در ایستگاه فضایی چین، در انجام آزمایش‌هایی هم مشارکت خواهد کرد؛ از جمله آزمایشی که بررسی می‌کند چگونه کامپوزیت‌های فیبر کربنیِ «خودترمیم‌شونده» می‌توانند ترک‌های کوچک در بدنه فضاپیما را به‌طور خودکار ترمیم کنند.", "image_url": "https://gdb.rferl.org/b5be94fc-2564-4f35-95fe-f061c0c2e289_cx0_cy3_cw0_w1200_h630.jpg", "category": "جامعه و رویدادها", "tags": ["روابط بین‌الملل"], "datetime_fa": "۴ آذر • ۱۸:۱۲"}, {"source": "Iran International", "title": "پایان نگرانی‌ها در تراکتور؛ حسین‌زاده: برای ادامه فصل مشکلی ندارم", "link": "https://       tech: [{"source": "Zoomit", "title": "چراغ قرمز بود، اما قطار اجازه حرکت گرفت؛ ابهام بزرگ در یکی از مرگ‌بارترین سوانح ریلی اروپا", "link": "https://www.zoomit.ir/zoomplus/471713-spain-deadly-train-crash-investigation/", "summary": "در پی برخورد دو قطار سریع‌السیر در اسپانیا دست‌کم ۶۹ نفر جان باختند؛ بررسی‌ها از صدور مجوز حرکت از سوی مرکز کنترل با وجود چراغ قرمز خبر می‌دهد.", "date_str": "2026-11-25T16:10:00+00:00", "hash": "772d3caf67bd3ef6", "title_fa": "چراغ قرمز بود، اما قطار اجازه حرکت گرفت؛ ابهام بزرگ در یکی از مرگ‌بارترین سوانح ریلی اروپا", "summary_fa": "در پی برخورد دو قطار سریع‌السیر در اسپانیا دست‌کم ۶۹ نفر جان باختند؛ بررسی‌ها از صدور مجوز حرکت از سوی مرکز کنترل با وجود چراغ قرمز خبر می‌دهد. تبلیغات توجه: این مقاله حاوی تصاویر دلخراش است. به‌گزارش ای‌بی‌سی نیوز ، حادثه صبح چهارشنبه ۲۸ اکتبر ۲۰۲۶ (۶ آبان ۱۴۰۵) در مسیر قطار سریع‌السیر مادرید به سویا و در نزدیکی شهر اوردا رخ داد. قطار شرکت دولتی رنفه (Renfe) از پشت با قطار متوقف‌شده‌ی شرکت خصوصی ایریو برخورد کرد و چند واگن از ریل خارج شدند. کپی لینک در ۱۷ دقیقه پیش از برخورد چه اتفاقی افتاد؟ حدود ساعت ۸:۳۰ صبح به وقت محلی، نقص کامپیوتری باعث اختلال در سامانه‌ی ایمنی LZB در بخشی ۶۳ کیلومتری از مسیر شد. این اختلال شش قطار را متوقف کرد، اما مرکز کنترل راه‌آهن در مادرید تصمیم گرفت حرکت برخی قطارها را از سر بگیرد. ساعت ۸:۳۶، قطار رنفه مجوز ادامه‌ی حرکت را بدون محدودیت سرعت دریافت کرد؛ درحالی‌که چراغ قرمز مسیر همچنان فعال بود. این قطار حدود ۲۵ کیلومتر حرکت کرد و سرانجام ساعت ۸:۵۳ با قطار ایریو که روی همان خط متوقف مانده بود، برخورد کرد. بررسی‌ها نشان می‌دهد راننده‌ی قطار ایریو پیش از حادثه چند بار به مرکز کنترل اطلاع داده بود که قطارش همچنان متوقف است. بااین‌حال، ظاهراً دستور توقف یا کاهش سرعت به قطار رنفه ابلاغ نشد. سرعت این قطار هنگام برخورد هنوز به‌طور قطعی مشخص نشده، اما احتمال می‌رود به حدود ۲۰۰ کیلومتربرساعت رسیده باشد. اسکار پوئنته ، وزیر حمل‌ونقل اسپانیا، می‌گوید در چنین شرایطی قطار باید با سرعت محدود و به‌اندازه‌ای حرکت می‌کرد که راننده بتواند در صورت مشاهده‌ی مانع متوقف شود. او تأکید کرده که مسئولیت اولیه‌ی این تصمیم متوجه مرکز کنترل بوده و شواهد فعلی تقصیری را متوجه رانندگان نمی‌کند. کپی لینک دومین فاجعه‌ی بزرگ ریلی اسپانیا در سال ۲۰۲۶ براساس آمار اعلام‌شده در گزارش ای‌بی‌سی", "image_url": "https://api2.zoomit.ir/media/train-accident-europe-derailment-6b041b5b6c25894452117bb6?w=1920&q=75", "category": "سینما و سریال", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آذر • ۱۹:۴۰"}, {"source": "Engadget", "title": "Nothing's Ear (note) is a pair of earbuds with built-in AI notetaking", "link": "https://www.engadget.com/2328122/nothings-ear-note-is-a-pair-of-earbuds-with-built-in-ai-notetaking/", "summary": "The company has promised to share more details on December 8.", "date_str": "2026-11-25T16:03:17+00:00", "hash": "ddb1de5f354f598d", "title_fa": "Nothing's Ear (توجه) یک جفت هدفون با یادداشت برداری هوش مصنوعی داخلی است.", "summary_fa": "این شرکت قول داده است که جزئیات بیشتری را در 8 دسامبر به اشتراک بگذارد. من برای آخرین دستگاه Nothing بیشتر هیجان زده بودم که فکر کردم یک قلم ویپ هوش مصنوعی است. هیچ چیز اضافه کردن Engadget به Google: منبع ترجیحی Google Discover قبل از 8 دسامبر و تعداد زیادی نشت هماهنگ شده برای شمارش، هیچ چیز به طور رسمی اولین دستگاه \"بومی هوش مصنوعی\" خود را معرفی نکرده است. تا حدودی ضد آب و هوا، Ear (یادداشت) یک جفت هدفون با یادداشت هوش مصنوعی داخلی است. همانطور که این شرکت به بلومبرگ گفت، این هدفون‌ها می‌توانند مکالمات حضوری، تماس‌ها، جلسات آنلاین و یادداشت‌های صوتی را رونویسی و خلاصه کنند، علاوه بر این، پخش صوتی سنتی با پشتیبانی صوتی Hi-Res را ارائه می‌دهند. این شرکت در یک بیانیه مطبوعاتی که با Engadget به اشتراک گذاشت، نوشت: «Ear (توجه) بخشی از چشم‌انداز Nothing برای ساخت لایه زمینه سخت‌افزاری هوش مصنوعی است که هوش را به لحظات، مکالمات و تجربیاتی که زندگی روزمره ما را شکل می‌دهند نزدیک‌تر می‌کند. هنوز اطلاعاتی در مورد قیمت یا مشخصات وجود ندارد، اما هیچ چیز قول نداده است که به زودی جزئیات بیشتری را به اشتراک بگذارد. این شرکت Ear (یادداشت) را به عنوان «رویکردی جدید برای بهره‌وری شخصی» توصیف می‌کند، اما Nothing اولین کسی نیست که هدفون‌هایی ": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۴ آذر • ۱۸:۴۳"}, {"source": "Zoomit", "title": "نوجوان ۱۵ ساله می‌خواست GTA 6 را به کامپیوتر بیاورد؛ تیک‌تو پروژه‌اش را متوقف کرد", "link": "https://www.zoomit.ir/gaming/471811-gta-vi-pc-project-shutdown/", "summary": "ناشر GTA 6 با ارسال اخطاریه‌ی کپی‌رایت، پروژه‌ی غیررسمی بازکامپایل نسخه‌ی لو رفته‌ی این بازی برای کامپیوتر را مسدود کرد.", "date_str": "2026-11-25T15:10:00+00:00", "hash": "a876acb88aad8f66", "title_fa": "نوجوان ۱۵ ساله می‌خواست GTA 6 را به کامپیوتر بیاورد؛ تیک‌تو پروژه‌اش را متوقف کرد", "summary_fa": "ناشر GTA 6 با ارسال اخطاریه‌ی کپی‌رایت، پروژه‌ی غیررسمی بازکامپایل نسخه‌ی لو رفته‌ی این بازی برای کامپیوتر را مسدود کرد. تبلیغات جامعه‌ی مادسازان در تلاش است تا بازی GTA 6 را پیش از عرضه‌ی رسمی روی کامپیوترهای شخصی اجرا کند؛ اما تیک‌تو یکی از بزرگ‌ترین پروژه‌های فعال در همین زمینه را متوقف کرد. پروژه‌ای مستقل به نام Leonida که یک نوجوان ۱۵ ساله با نام مستعار NotRexed مدیریتش را بر عهده داشت، پس از دریافت اخطاریه‌‌ی کپی‌رایت از دسترس خارج شد. هدف Leonida ترجمه‌ی بیلد فاش‌شده بازی از ایکس باکس به کدهای بومی ویندوز بود. افشاگری به نام Cyberleek که در تابستان چندین ویدیو از گیم‌پلی بازی منتشر کرده بود، اوایل هفته‌ی جاری فایل‌های کامل بیلد ایکس‌باکس را در اینترنت قرار داد. انتشار این بیلد موجب شد تا متخصصان حوزه‌ی مهندسی معکوس برای بازسازی کدهای بازی به فرمت قابل اجرا در کامپیوترهای شخصی وارد رقابتی جدی شوند. تیم حقوقی تیک‌تو مخزن اصلی پروژه‌ی Leonida در گیت‌هاب و بیش از ۲٬۹۰۰ فورک مرتبط با آن را هدف قرار داد. این شرکت مدعی شد: «این اقدامات حقوق مالکیت فکری آثار تیک‌تو را نقض کرده و بستری برای نقض کپی‌رایت عنوان Grand Theft Auto VI از راک‌استار گیمز فراهم می‌آورد.» توسعه‌دهندگان حتی با بهره‌گیری از ابزارهای هوش مصنوعی مانند Claude توانسته‌اند بازی را تا مرحله‌ی بارگذاری اولیه روی کامپیوتر پیش ببرند. گروه PortWatch VI روند پروژه‌های پورت و شبیه‌سازی را رصد می‌کند و در حال حاضر پروژه‌ی VIctory پیشتاز است. هم‌زمان برخی کاربران با بهره‌گیری از لایه‌ی سازگاری XCL برای اجرای بازی‌های کنسول ایکس باکس سری ایکس روی ویندوز تلاش می‌کنند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/vice-city-game-characters-6afc0b3d2314debea39c0b71?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic"], "datetime_fa": "۴ آذر • ۱۸:۴۰"}, {"source": "Business Insider", "title": "I tried 8 different types of store-bought biscuits, and the best melted in my mouth", "link": "https://www.businessinsider.com/best-store-bought-canned-biscuits-review-photos-2023-11", "summary": "I compared biscuits from Annie s, Red Lobster, Trader Joe s, Immaculate Baking, Amazon Fresh, and Pillsbury. Gabbi Shaw/Business Insider Biscuits are a beloved side at many Thanksgiving meals. I tried eight different biscuit mixes and doughs to see which was the tastiest. The original Pillsbury Biscuits and the Red Lobster Cheddar Bay Biscuits came out on top. Thanksgiving is upon us, which means families around the country are preparing their kitchens for a long day of cooking. Not every dish needs to be made from scratch, though. I decided to test eight store-bought biscuit brands to see which might make it to my Thanksgiving table. A couple of years ago, I tried Annie's Organic Flaky Biscuits, Red Lobster Cheddar Bay Biscuits, Trader Joe's Organic Biscuits, Immaculate Organic Biscuits, Happy Belly Jumbo Buttermilk Biscuits, and three different kinds from Pillsbury: its Original Flaky Layers, Grands! Southern Homestyle Southern Recipe, and Grands! Southern Homestyle Butter Tastin'. The brands are still available this year, although Amazon has since consolidated its Happy Belly and Amazon Fresh brands under the Amazon Grocery name. All were delicious, though some were slightly tastier — and better value — than others. Here's how I ranked them, from my least favorite to my favorite. For me, biscuits are one of the most beloved parts of Thanksgiving dinner. I put eight types of store-bought biscuits (from six different brands) to the test. Karen Warren/Houston Chronicle via Getty Images There are a lot of options in grocery stores, so I decided to try all the biscuit mixes and doughs I could find — both in my local store and online — ahead of my Thanksgiving feast. I was looking for biscuits that were light, flaky, and buttery, with a hint of sweetness. I'm put off by biscuits that are thick and cakey, and seem more like dinner rolls. In my opinion, a good biscuit tastes delicious without butter, so I didn't add any to the ones I bought, except when they came with butter. I ended up with seven tubes of dough and one boxed mix. All the biscuit mixes I used. Gabbi Shaw/Business Insider I bought bake-at-home biscuits from Annie's, Red Lobster, Trader Joe's, Immaculate Organic Biscuits, Pillsbury, and Happy Belly, which is now under the Amazon Grocery name. The Red Lobster biscuits were the only ones to come in a box, and its recipe yielded six to 10 biscuits. The other types, which were all canned, each contained eight. For each tube, I had to peel off the wra", "date_str": "2026-11-25T15:01:11+00:00", "hash": "8e34223850f26811", "title_fa": "من 8 نوع مختلف از بیسکویت های فروشگاهی را امتحان کردم و بهترین آنها در دهان من ذوب شد.", "summary_fa": "من بیسکویت های Annie s، Red Lobster، Trader Joe s، Immaculate Baking، Amazon Fresh و Pillsbury را مقایسه کردم. بیسکویت های Gabbi Shaw/Business Insider یکی از طرفداران مورد علاقه بسیاری از وعده های غذایی شکرگزاری است. من هشت مخلوط بیسکویت و خمیر مختلف را امتحان کردم تا ببینم کدام خوشمزه تر است. بیسکویت اصلی Pillsbury و بیسکویت Red Lobster Cheddar Bay در صدر قرار گرفتند. روز شکرگزاری در راه است، به این معنی که خانواده ها در سراسر کشور آشپزخانه های خود را برای یک روز طولانی آشپزی آماده می کنند. اگرچه لازم نیست هر ظرفی از ابتدا درست شود. تصمیم گرفتم هشت برند بیسکویتی را که از فروشگاه خریدم را آزمایش کنم تا ببینم کدام یک می تواند به میز شکرگزاری من برسد. چند سال پیش، بیسکویت‌های پوسته‌دار ارگانیک آنی، بیسکویت‌های خلیج چدار خرچنگ قرمز، بیسکویت‌های ارگانیک تریدر جو، بیسکویت‌های ارگانیک بی‌نقص، بیسکویت‌های شادی شکم جامبو باترمیلک، و سه نوع مختلف از Pillsbury اصلی، گراند فلاسکی را امتحان کردم. دستور العمل جنوبی خانگی سبک جنوبی، و بزرگ! جنوب هوم استایل کره Tastin'. این برندها امسال هنوز در دسترس هستند، اگرچه آمازون از آن زمان برندهای Happy Belly و Amazon Fresh خود را تحت نام Amazon Grocery تثبیت کرده است. همه خوشمزه بودند، اگرچه برخی از آنها کمی خوشمزه تر - و ارزش بهتر - نسبت به بقیه بودند. در اینجا من آنها را از کمترین علاقه به محبوب ترین رتبه بندی کردم. برای من، بیسکویت ها یکی از محبوب ترین قسمت های شام شکرگزاری هستند. من هشت نوع بیسکویت خریداری شده در فروشگاه (از شش مارک مختلف) را امتحان کردم. Karen Warren/Houston Chronicle از طریق Getty Images گزینه‌های زیادی در فروشگاه‌های مواد غذایی وجود دارد، بنابراین تصمیم گرفتم تمام مخلوط‌ها و خمیرهای بیسکویتی را که می‌توانم پیدا کنم - چه در فروشگاه محلی و چه آنلاین - قبل از", "image_url": "https://i.insider.com/6b05d2e6d6c5d341c9b4cc56?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آذر • ۱۸:۳۱"}, {"source": "Business Insider", "title": "The AI trade is unraveling days after Jensen Huang's comeback sparked a monster rally", "link": "https://www.businessinsider.com/nvidia-stock-softbank-kospi-index-nikkei-tsmc-ai-trade-selloff-2026-11", "summary": "US stocks sank lower on Wednesday as the relief rally stemming from Jensen Huang s return fizzled out. Michael M. Santiago/Getty Images The wheels were coming off the AI trade again on Wednesday. Two days are Jensen Huang's comeback sparked a massive rally, indexes were giving back most gainst. Nvidia dropped 9% and Anthropic continued its post-IPO decline, dropping another 10%. The AI trade was unraveling on Wednesday days after a parabolic rally sparked by Jensen Huang's reinstatement as Nvidia CEO. US stocks barreled toward another losing session the day before Thanksgiving, as the global stock rally triggered by Huang's comeback fizzled out. The Nasdaq 100 was down nearly 4% and the S P 500 fell 3%. The move attests to how temperamental the AI trade has become, with big events like Huang's return and the Anthropic IPO unable to lift sentiment and restart the bull rally. Chips, neoclouds, and hypserscalers were all down sharply on Wednesday. Nvidia dropped 9% and Anthropic continued its post-IPO decline, dropping another 10%. Nvidia remains down more than 30% from its early October high. Dell , notably, dropped 6%, despite reporting blockbuster results for the third quarter after the bell on Tuesday. \"Dell just put up one of the best quarters of the AI cycle, and the stock barely moved, yet another sign that the market is 'over' the AI trade,\" Luke Lango, an independent tech analyst, wrote in a note. \"That's the AI transition period in a nutshell: the fundamentals are booming, but the market is pricing in a slowdown that hasn't shown up in the numbers yet.\" Here's where US indexes stood around 10 a.m. ET: S P 500 : 7,045.49, down 2.1% Dow Jones Industrial Average : 49,307.49, down 1.42% (-711.21 points) Nasdaq 100 : 25,428.97, down 3.3% Here were the most notable moves in the tech sector in the US: Company Ticker Today's move CoreWeave CRWV -12% IREN IREN -12% Micron MU -11% Nebius NBIS -11% Roundhill Neocloud ETF NCLD -10% Roundhill Memory ETF DRAM -9% iShares Semiconductor ETF SOXX -8% Intel INTC -8% Vertiv VRT -7% Nvidia NVDA -6% SpaceX SPCX -6% Broadcom AVGO -4% Generac GNRC -3% Sandisk SNDK -3% Meanwhile, hot inflation data and the prospect of additional tariffs from the Trump administration were adding to the selling pressure. Analysts had been mulling whether Monday's relief rally was a dead-cat bounce , a short-lived recovery in stocks before the market makes its way to a new low. A few worries appear to have triggered the latest bout of selling", "date_str": "2026-11-25T14:59:11+00:00", "hash": "eb8c8a41f6da7243", "title_fa": "تجارت هوش مصنوعی چند روز پس از بازگشت جنسن هوانگ که جرقه‌ای برانگیخت یک تجمع هیولا در حال فروپاشی است", "summary_fa": "سهام ایالات متحده در روز چهارشنبه با کاهش رشد اقتصادی ناشی از بازده جنسن هوانگ کاهش یافت. مایکل ام. سانتیاگو/ گتی ایماژ چرخ ها دوباره در روز چهارشنبه از تجارت هوش مصنوعی خارج شدند. دو روز است که بازگشت جنسن هوانگ باعث یک رالی عظیم شد، شاخص ها بیشترین افزایش را داشتند. انویدیا 9 درصد سقوط کرد و آنتروپیک به کاهش پس از عرضه اولیه سهام ادامه داد و 10 درصد دیگر کاهش یافت. تجارت هوش مصنوعی روز چهارشنبه پس از یک رالی سهموی که توسط بازگرداندن جنسن هوانگ به عنوان مدیر عامل انویدیا آغاز شد، رو به رو شد. سهام ایالات متحده یک روز قبل از عید شکرگزاری به سمت یک جلسه نزولی دیگر رو به رو شدند، زیرا رالی سهام جهانی که به دلیل بازگشت هوانگ آغاز شد، متوقف شد. Nasdaq 100 نزدیک به 4٪ و S P 500 3٪ سقوط کرد. این حرکت نشان می‌دهد که تجارت هوش مصنوعی تا چه حد متعصب شده است، زیرا رویدادهای بزرگی مانند بازگشت هوانگ و عرضه اولیه اولیه سهام آنتروپیک قادر به افزایش احساسات و راه‌اندازی مجدد رالی گاو نر نیستند. چیپ‌ها، نئوکلادها و هایپس‌اسکیلرها همگی در روز چهارشنبه به شدت کاهش یافتند. انویدیا 9 درصد سقوط کرد و آنتروپیک به کاهش پس از عرضه اولیه سهام ادامه داد و 10 درصد دیگر کاهش یافت. انویدیا نسبت به اوایل اکتبر بیش از 30 درصد کاهش داشته است. دل، علیرغم گزارش نتایج پرفروش سه ماهه سوم پس از زنگ خطر در روز سه شنبه، 6 درصد کاهش یافت. لوک لانگو، تحلیلگر فناوری مستقل، در یادداشتی نوشت: «دل به تازگی یکی از بهترین فصل‌های چرخه هوش مصنوعی را ایجاد کرد و سهام به سختی جابه‌جا شد، و این نشانه دیگری است مبنی بر اینکه بازار تجارت هوش مصنوعی را به پایان رسانده است». این دوره گذار هوش مصنوعی به طور خلاصه است:", "image_url": "https://i.insider.com/6b06e991d6c5d341c9b4d1e7?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Nvidia", "تراشه"], "datetime_fa": "۴ آذر • ۱۸:۲۹"}, {"source": "Business Insider", "title": "My best friend and I live on opposite sides of the country. We stay connected by taking joint birthday trips.", "link": "https://www.businessinsider.com/best-friends-take-annual-birthday-trip-together-2026-11", "summary": "My best friend and I stay connected through annual trips. Laura Grace Tarpley My best friend, Heather, and I live on opposite sides of the country. To stay connected, we take annual joint birthday trips together. Our trips have changed over the years, and sometimes, our spouses or families join us. I met my best friend Heather when we were both 6 years old. We attended the same small school from first grade through high school, and as teenagers, we bonded over a shared urge to see the world beyond our little bubble. Our first trip together was a school-sponsored tour of Europe the summer before senior year, where we explored major tourist hubs like London and Paris but really fell in love with under-the-radar spots we found in Lyon, France. We bonded over our love of trying new foods, from escargot to fancy cheeses, and exploring tiny boutiques instead of touristy gift shops. Now, in our mid-30s, our lives look very different from what they did back in high school. My husband and I settled down in Olympia, Washington, and Heather and her family live in Wilmington, North Carolina. Although we live on opposite sides of the country, we've found a way to stay close through our shared love of travel with annual birthday trips . We've kept the tradition alive for 8 years now One year, we backpacked through Great Smoky Mountains National Park. Laura Grace Tarpley The tradition began in July 2018, when Heather wanted to take a long-weekend trip for her 26th birthday. Since I was in Baltimore for the summer while my husband was interning in Washington, DC , we decided she should come visit, and I could show her around both cities. When you live far away from a friend and finally reunite, it's easy to spend time just catching up on what's happening in the other person's life rather than making new memories together. But that wasn't the case this time. We had so much fun trying new things on this trip — from touring landmarks in DC to spending a rainy day in a brewery and tasting seafood dishes we never would've considered when we were kids — that we ended up making it an annual tradition to celebrate both of our birthdays. During our first trip, I showed Heather around Baltimore and DC. Laura Grace Tarpley Heather and I have each changed over the years, in big and small ways. We might be in different phases of life, and we may switch up our travel destinations, but one thing stays the same — we always find ways to spend time together in ways we both enjoy. And that ", "date_str": "2026-11-25T14:57:06+00:00", "hash": "4d12cef0dacc288f", "title_fa": "من و بهترین دوستم در دو طرف کشور زندگی می کنیم. ما با سفرهای مشترک تولد در ارتباط هستیم.", "summary_fa": "من و بهترین دوستم از طریق سفرهای سالانه در ارتباط هستیم. لورا گریس تارپلی بهترین دوستم، هدر، و من در دو طرف کشور زندگی می کنیم. برای اینکه در ارتباط باقی بمانیم، سفرهای مشترک سالانه تولد را با هم انجام می دهیم. سفرهای ما در طول سال ها تغییر کرده است و گاهی اوقات، همسر یا خانواده ما به ما می پیوندند. من بهترین دوستم هدر را زمانی که هر دو 6 ساله بودیم ملاقات کردم. ما از کلاس اول تا دبیرستان در همان مدرسه کوچک درس می‌خواندیم، و در دوران نوجوانی، تمایلی مشترک به دیدن جهان فراتر از حباب کوچکمان داشتیم. اولین سفر ما با هم یک تور اروپایی تحت حمایت مدرسه در تابستان قبل از سال آخر بود که در آن مراکز توریستی مهمی مانند لندن و پاریس را کاوش کردیم اما واقعاً عاشق نقاط زیر رادار که در لیون، فرانسه یافتیم، شدیم. ما علاقه خود را به امتحان غذاهای جدید، از اسکارگوت گرفته تا پنیرهای فانتزی، و کاوش در بوتیک‌های کوچک به جای فروشگاه‌های کادوهای توریستی به هم پیوند زدیم. اکنون، در اواسط 30 سالگی، زندگی ما با آنچه در دوران دبیرستان انجام می‌دادند بسیار متفاوت به نظر می‌رسد. من و شوهرم در المپیا، واشنگتن مستقر شدیم و هدر و خانواده اش در ویلمینگتون، کارولینای شمالی زندگی می کنند. اگرچه ما در دو طرف کشور زندگی می کنیم، اما راهی برای نزدیک ماندن از طریق عشق مشترکمان به سفر با سفرهای سالانه تولد پیدا کرده ایم. ما اکنون 8 سال rite. Idahoan s classic mashed potatoes required just the mashed potato packets and water. Idahoan classic mashed potatoes. Erin McDowell/Business Insider A 4-ounce bag of Idahoan instant mashed potatoes costs $1.67 and makes 4 servings. I appreciated the ease and not having to take up precious stove space, and I imagine I would appreciate that even more if I were actually cooking these for Thanksgiving. To make each flavor of potatoes, I boiled two cups of water and added it to a large measuring cup. I then added the entire packet of potatoes, covered it with tin foil for five minutes, and then mixed the potatoes before serving in a separate bowl. The potatoes had a good, fluffy consistency. Idahoan classic mashed potatoes. Erin McDowell/Business Insider Despite being made from a powder, they weren't grainy or thick. The classic version of Idahoan instant mashed potatoes looked and tasted like homemade mashed potatoes. Idahoan classic mashed potatoes. Erin McDowell/Business Insider If someone had told me they had come from a packet, I probably wouldn't have believed them. The butter flavor was prominent, in a good way. My only criticism of the classic mashed", "date_str": "2026-11-25T14:55:01+00:00", "hash": "14a7d53bc7d086fd", "title_fa": "من 5 نوع پوره سیب زمینی فوری خریداری شده در فروشگاه را امتحان کردم. بهترین طعم تقریباً خانگی.", "summary_fa": "من پوره سیب زمینی فوری را امتحان کردم تا مشخص کنم کدام یک برای روز شکرگزاری بهترین است. Erin McDowell/Business Insider من پوره سیب زمینی فوری از آیداهوان را در طعم های مختلف امتحان کردم. آیداهان آن را با پوره سیب زمینی کره ای و خوش طعم که کاملا سبک و خامه ای بود، میخکوب کرد. من پوره سیب زمینی بیبی بلیس این برند را بیشتر دوست داشتم. با وجود کوهی از ظروف برای روز شکرگزاری، گاهی اوقات لازم است یک یا دو میانبر انتخاب کنید. علیرغم اینکه معمولاً به پوره سیب زمینی خانگی قسم می‌خوردم، تصمیم گرفتم انواع مارک‌ها و طعم‌های پوره سیب‌زمینی فوری را امتحان کنم تا بهترین گزینه را در خواربارفروشی تعیین کنم، و ببینم آیا آن‌ها به اندازه‌ا  turkey salad to a stacked sandwich, here's how each leftover-utilizing recipe stacked up. For one dish, I tried making a turkey salad. Terri Peters The easiest recipe to follow was for turkey salad , which was similar to chicken versions I've made in the past. I used a recipe from the cooking blog Ahead of Thyme. The ingredients are simple: celery, green onion, paprika, mayo, Dijon mustard, salt, pepper, and finely chopped leftover turkey. I made a few changes to the recipe, but the dish was still good. Terri Peters I don't like the crunch of celery or onion, so for this turkey salad, I made a few adjustments. Instead of adding diced celery, green onions, and salt, I just used celery salt to flavor the salad without adding a harsh crunch. The turkey salad was great on a sandwich, and I d make it again. Terri Peters My turkey-salad sandwich tasted great. It had plenty of flavor from the mustard, paprika, and celery salt. Overall, I thought it was simple to prepare, and as an added bonus, it required ingredients I already had in my pantry and refrigerator. I'd make this turkey salad again if I had leftovers on hand. This warmThanksgiving-inspired sandwich was much harder to make. Terri Peters Our typical Thanksgiving leftovers include things like turkey breast, cranberry sauce, mac and cheese , mashed potatoes, and green-bean casserole. For the first recipe, I gathered them all up to make a sandwich using a recipe from The New York Times . I also grabbed thick sandwich bread and turkey gravy. The stuffing layer was the most labor-intensive part of the sandwich. Terri Peters I began by mixing the mayonnaise and cranberry sauce to create a cranberry mayo. Then, I combined chopped turkey with gravy to make another sauce. Since we didn't have leftover stuffing, I made a box of stuffing , pressed it into a square pan, and refrigerated i", "date_str": "2026-11-25T14:40:50+00:00", "hash": "e794668bd3571f8c", "title_fa": "من 3 روش مختلف برای استفاده از باقی مانده بوقلمون امت e_str": "2026-11-25T16:00:00+00:00", "hash": "c4bb973983fb2422", "title_fa": "«سفر به شفق‌های شمالی»: IFC آخرین‌های مایکل وینترباتم، استیو کوگان و راب برایدون را به دست می‌آورد", "summary_fa": "انحصاری: شرکت فیلم مستقل (IFC) و استودیو ساپان حقوق ایالات متحده را برای The Trip to the Northern Lights، پنجمین قسمت از فرنچایز استیو کوگان به کارگردانی مایکل وینترباتم و راب برایدون، در اختیار گرفتند. برای اکران در 9 آوریل 2027 تنظیم شده است. IFC خانه چهار فصل قبلی در The Trip بوده است [ ] بیش از پنج سال از فرارهای یونانی آنها می گذرد، کوگان نامزد 2 بار جایزه اسکار و راب برایدون نامزد 5 بار جایزه بفتا برای گشت و گذار در زیبایی ناهموار شمال اروپا دوباره متحد شدند. آنچه در ادامه می‌آید، سفری در اسکاندیناوی در جستجوی غذای خوب، گفت‌وگوی عصبانی و نگاهی اجمالی به شفق‌های شمالی گریزان است. این دو در وحشی‌ترین مناطق اروپای شمالی، از هتل‌های مجسمه‌سازی سوئدی گرفته تا جزایر دورافتاده نروژ، در سفرنامه‌ها و محاسبه‌های میانسالی، غرق می‌شوند. اخبار مرتبط: کالین فارل، استیو کوگان، چارلی هیتون، دامنال گلیسون، هیمش پاتل، نیام الگار سیمون کربی به ریچ پپیات با حمایت نتفلیکس اخبار Bad Bridgets اخبار استیو کوگان در مورد اینکه چرا مایک وایت او را در نیلوفر سفید هلنا پارتیچ ریچ ریچ پپیات بازی می کند: Winterbottom برنده بافتا گفت: ما بسیار خوشحالیم که با IFC به جاده بازگشتیم. آنها از اولین سفر در تمام آن سال ها پیش، شرکای درخشانی بوده اند. سفر به شفق شمالی استیو و راب را از مالمو در جنوب سوئد از طریق آبدره های تماشایی نروژ به جزایر لوفوتن در دایره قطب شمال نروژ می برد. امیدوارم مخاطبان هم مانند ما از این سفر لذت ببرند. در ددلاین تماشا کنید شرکت فیلم مستقل از ادامه رابطه دیرینه خود با این گروه فیلمساز درجه یک جهانی در آخرین قسمت از این فرانچایز محبوب، هیجان زده است. تعداد کمی از همکاری‌های کمدی جذابیت پایدار استیو کوگان و راب برایدون را دارند و تحت هدایت الهام‌گرفته از مایکل وینترباتم، هر", "image_url": "https://deadline.com/wp-content/uploads/2026/11/JSM_TheTrip_Norway_58.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۹:۳۰"}, {"source": "Deadline", "title": "BBC Journalists Vote To Take Strike Action Over Job Cuts", "link": "https://deadline.com/2026/11/bbc-journalists-vote-yes-industrial-action-result-1237233186/", "summary": "BBC journalists have voted in favor of taking industrial action over job cuts. The National Union of Journalists (NUJ) has been balloting BBC members since last month over a potential revolt against the corporation s plan to save more than £51 million ($67M) in its news unit. More than 100 roles are at risk. BBC News [ ]", "date_str": "2026-11-25T15:52:14+00:00", "hash": "d2b39ff204392648", "title_fa": "روزنامه‌نگاران بی‌بی‌سی به اقدام اعتصابی بر سر کاهش مشاغل رای دادند", "summary_fa": "روزنامه‌نگاران بی‌بی‌سی به اقدام صنعتی بر سر کاهش مشاغل رای مثبت دادند. اتحادیه ملی روزنامه نگاران (NUJ) از ماه گذشته به دلیل شورش احتمالی علیه برنامه این شرکت برای صرفه جویی بیش از 51 میلیون پوند (67 میلیون دلار) در واحد خبری خود، به اعضای بی بی سی رأی می دهد. بیش از 100 نقش در معرض خطر هستند. اخبار بی‌بی‌سی [ ] حدود 79.38 درصد از اعضای NUJ در بی‌بی‌سی در انگلیس، ولز و اسکاتلند از اعتصاب حمایت کردند و 91.32 درصد از اقدام کوتاه‌تر از اعتصاب حمایت کردند. میزان مشارکت 75.03 درصد بود. اخبار مرتبط جدیدترین ایده بی بی سی برای صرفه جویی 500 میلیون پوندی: اخبار مشاوران را بیاورید بی بی سی برای راه اندازی CBeebies Hub در نتفلیکس. آخرین مهلت متوجه شد که نمایندگان NUJ تلاش های هماهنگی برای رای گیری در مورد اقدامات صنعتی انجام داده اند. ماموریت اقدام به مدت یک سال طول می کشد و قدرت مذاکره اتحادیه در برابر بی بی سی را تقویت می کند. NUJ گفت: این آخرین راه حل است و هنوز تصمیمی برای اقدام اتخاذ نشده است. بی بی سی برای اظهار نظر تماس گرفته است. هدف صرفه جویی 51 میلیون پوندی BBC News کمکی به هدف کلی پخش کننده برای صرفه جویی 500 میلیون پوندی در سال های آینده است. بی‌بی‌سی حدود 200 میلیون پوند از این پس‌انداز را پرده‌برداری کرده است، که به دلیل خونریزی بیش از دو میلیون نفر از پرداخت‌کنندگان هزینه مجوز از سال 2020، مورد نیاز است. هنگامی که NUJ رای گیری ماه گذشته را اعلام کرد، بی بی سی گفت که این یک \"تحول ناامید کننده\" s no stranger to trademark litigation. It sued Urban Outfitters in 2017 for using “Coachella” in apparel names and ecommerce metadata, and a Los Angeles festival called “Hoodchella” before that. In 2022, it filed another case against concert giant Live Nation for promoting a nearby event called “Coachella Day One 22.” And in 2024, it sued a local craft beer company called Coachella Valley Brewing Co. for using the Ferris wheel in branding. Neither side immediately returned requests for comment on Wednesday (Nov. 25).", "date_str": "2026-11-25T15:26:31+00:00", "hash": "572c3f1f1cf11495", "title_fa": "کواچلا از والمارت به دلیل فروش ناک آف در فروشگاه های نزدیک جشنواره شکایت کرد: \"چه کسی به چادر کالا نیاز دارد؟\"", "summary_fa": "کواچلا از والمارت به دلیل اتهاماتی مبنی بر اینکه این غول خرده فروشی سال ها کالاهای تقلبی جشنواره را به رغم درخواست های مکرر برای توقف، فروخته است، شکایت کرده است. در شکایتی در روز سه شنبه (24 نوامبر)، صاحبان جشنواره والمارت را به نقض علائم تجاری کواچلا با چسباندن نام و لوگو روی پیراهن‌ها، لیوان‌ها و سایر اقلام، اغلب در فروشگاه‌های واقع در نزدیکی محوطه باشگاه امپایر پولو که جشنواره سالانه در آن برگزار می‌شود، متهم می‌کنند. دیزنی مرتبط به اتهام استفاده از موسیقی غیرمجاز در تبلیغات رسانه‌های اجتماعی: هرگز یک دلار پرداخت نکرده است. که جشنواره را اداره می‌کند، می‌گویند که از سال 2017 از والمارت خواسته‌اند که متوقف شود، بی‌فایده است و جشنواره را «هیچ گزینه‌ای جز طرح دعوای فعلی» باقی نمی‌گذارد. وکلای کواچلا می‌نویسند: «شاکی‌ها درخواست‌ها و درخواست‌های مکرر از والمارت را برای توقف فروش و تبلیغات کالاهای متخلف ارائه کرده‌اند. درخواست‌های شاکیان سود کمتری داشته است؛ والمارت معمولاً برای مدتی متوقف می‌شود، اما سپس از سر می‌گیرد. این پرونده ادعا می‌کند که Walmart علاقه‌مندان به جشنواره‌ها را در فروشگاه‌های اطراف هدف قرار می‌دهد، با استناد به کالاهای غیرفعال در مکان‌هایی در لا کوئینتا، کالیفرنیا، و شمال ایندیو، کالیفرنیا، که هر دو در فاصله کوتاهی با ماشین هستند. این خودرو به La Quinta Walmart که کولرها و صندلی‌های تاشو را زیر یک کپی مستقیم از لوگوی جشنواره زه ویژه در بیستمین مراسم سالانه قهرمانان ستاره‌های سی‌ان‌ان تجلیل می‌شود و دخترخوانده‌اش، مایلی سایرس، این جایزه را دریافت خواهد کرد. امسال، چهارمین جایزه سالانه میراث قهرمانان سی‌ان‌ان، سنت تجلیل از چهره‌های برجسته‌ای را که به یک عمر خدمت تقدیم کرده‌اند، با قدردانی از دالی پارتون با ادای احترام ویژه و حضور انحصاری کوروش ادامه خواهد داد، که از طرف خانواده پارتون این جایزه را می‌پذیرد. Wynonna Judd و دیگران این افتخار پس از مرگ را تقدیم خواهند کرد. تلاش‌های بشردوستانه پارتون شامل تلاش‌های او برای افزایش سواد، افزایش نرخ فارغ‌التحصیلی، حمایت از طرح‌های امدادی و بهداشتی در بلایای طبیعی، ایجاد شغل و کاهش فقر در جایی که او در تنسی شرقی بزرگ شد، بود. جایزه میراث قهرمانان سی‌ان‌ان به افتخار پارتون، شب قبل از نمایش مستند فلش سی‌ان‌ان، دالی پارتون: آهنگ‌هایی که ما را شکل دادند، برگزار می‌شود. این فیلم از مجموعه‌ای از مصاحبه‌های پارتون از آرشیو CNN در کنار دیدگاه‌های ترانه‌سرایانی از جمله دایان وارن، شین مک‌آنالی، بن جانسون و امی آلن استفاده می‌کند. Dolly Parton: The Songs That Shaped Us یکشنبه، 6 دسامبر، ساعت 20:00 به وقت محلی از CNN پخش می شود و برای مشترکین در دسترس خواهد بود. دیگر مهمانان برجسته ای که به ویژه قهرمانان CNN 2026 پیوستند عبارتند از: جان بون جووی، کلی ریپا و مارک کنسوئلوس، و بازیگر ادوارد نورتون.", "image_url": "https://variety.com/wp-content/uploads/2026/10/dolly-an-original-musical-fireside-chat-press-conference-mil-1000x667-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۴ آذر • ۱۸:۴۹"}, {"source": "Variety", "title": "The Ultimate Advent Calendar for Jet-Setters: Artist Laila Gohar’s Chocolate-Filled Creation Is Inspired by 24 Luxury Destinations", "link": "https://variety.com/2026/shopping/news/laila-gohar-luxury-advent-calendar-chocolate-travel-1236957983/", "summary": "Egyptian artist Laila Gohar is putting her characteristically whimsical spin on a holiday tradition this year, teaming up with The Luxury Collection on a limited-edition advent calendar that takes its design and culinary cues from 24 destinations around the world. The $218 calendar, available through The Luxury Collection Boutique in the U.S. and Gohar World [ ]", "date_str": "2026-11-25T15:14:15+00:00", "hash": "5ad58dcb7e2e44a8", "title_fa": "تقویم ظهور نهایی برای جت ستترها: خلاقیت هنرمند لیلا گوهر پر از شکلات از 24 مقصد لوکس الهام گرفته شده است.", "summary_fa": "هنرمند مصری لیلا گوهر امسال با مجموعه The Luxury در یک تقویم ظهور محدود که طراحی و اشارات آشپزی خود را از 24 مقصد در سراسر جهان گرفته است، یک سنت تعطیلات را انجام می دهد. تقویم 218 دلاری که از طریق The Luxury Collection Boutique در ایالات متحده موجود است. و گوهر ورلد [ ] اگر از طریق پیوندی در وب سایت ما یک محصول یا خدمات بررسی شده مستقل خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. رافائل پریتو، بنیانگذار کاسا بوسکس، با تیم های آشپزی در مجموعه The Luxury Collection همکاری کرد تا 24 طعم متمایز را توسعه دهد که شامل زعفران الهام گرفته از دبی، کنجد سیاه از کیوتو، نارگیل برشته شده توسط South Caicos و موز و نمک دریا توسط Waikiki است. مقصدهای دیگر با پرالین فندق (پاریس) و کهور دودی (Los Cabos) هستند. گوهر در بیانیه ای گفت: \"من عاشق پیش بینی افتتاح تقویم ظهور، به خصوص در تعطیلات هستم.\" هر کشو برای خودش دنیای کوچکی است که الهام گرفته از طعم‌ها، سنت‌ها و جزئیاتی است که مقصدها را در این زمان از سال بسیار خاص می‌کند. امیدوارم هر کشفی باعث کنجکاوی و شادی شود.» این هنرمند که با نام «گوهر ورلد» در ظروف خانگی به تفاسیر سوررئالیستی اشیای رومیزی سنتی تخصص دارد، با تبدیل غذا به چیدمان‌های پیچیده و اغلب خارق‌العاده، نامی برای خود دست و پا کرده است. به عنوان بخشی از این همکاری، گوهر همچنین مجموعه‌ای از پاپ‌آپ‌های تعطیلات را طراحی کرده است که از شکلات‌فروشی‌های قدیمی پاریس و داروخانه‌های میلانی الگوبرداری شده‌اند. این تاسیسات دارای پنجره‌های نمایشی و ردیفی از کشوها هستند که طرح خود تقویم را منعکس می‌کنند. در هتل پاریس پرنس دو گال، هنرمند و طراح صحنه، آلیکس بورتولی، ویترین های سفارشی با ترکیب مواد خام مورد استفاده در شکلات ها ایجاد کرد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/3.-LG_AC_LC_037_1-3.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۴ آذر • ۱۸:۴۴"}, {"source": "Billboard", "title": "The Chicks & Willie Colón Join AI Music Lawsuit Against Suno: ‘Misappropriated Identities’", "link": "https://www.billboard.com/pro/the-chicks-willie-colon-join-ai-music-lawsuit-against-suno/", "summary": "The Chicks , Willie Colón and Sam Moore are joining the legal fight against AI music. The trio of acts and their estates were among a slew of artists added Tuesday (Nov. 24) to a case filed this summer against Suno, accusing the AI song generator of breaking the law by allowing users to “conjure up a beloved musician’s identity” when they enter a name as a prompt. Related Suno, Anthropic Face $1B Copyright Lawsuits From Round Hill Music Over AI Training Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Rod Wave Indicted on Drug Gun Charges for Items Allegedly Found in Car After Speeding Stop The case, filed by Jason Isbell , was a novel action centered on artists’ likeness rights, unlike earlier lawsuits over AI labs using copyrighted music to train models. Now, that case is backed by the star power of a huge country trio, a Latin music titan and an R B legend. “Suno built and trained a model to index musicians by name,” lawyers for the artists write. “It encoded musicians’ identities into its AI model to create its commercial product without consent, and now exploits those identities by publicly using musicians’ names to Suno’s considerable commercial benefit.” In addition to the members of the Chicks (Natalie Maines, Martie Maguire and Emily Strayer) and the estates of the late Colón and Moore, the lawsuit was also joined by 10 more artists, including David Longstreth of the indie rock band Dirty Projectors; Carl Craig, a pioneering DJ of Detroit techno; Franz Nicolay of rock band The Hold Steady; and Kealiʻi Reichel, a top Hawaiian music artist. Artists as big as Madonna and SZA have spoken out against AI music , and dozens of stars like Billie Eilish, Katy Perry, Luis Fonsi and the estates of Bob Marley and Frank Sinatra joined an open letter in 2024 calling unlicensed music AI an “assault on human creativity” that “must be stopped.” But few have taken actual legal action. An indie country singer named Tony Justice is litigating a class action against Suno, and Isbell’s case was joined by Camper Van Beethoven frontman David Lowery and a handful of others. The biggest case yet came from the owners of Elvis Presley’s intellectual property, who launched landmark cases against Suno and Anthropic this fall. The Chicks, who have a long history of outspoken advocacy , represent by far the biggest living musical act to yet sue over AI. More artists could be added to the case in the future, and since the case was filed a", "date_str": "2026-11-25T15:07:33+00:00", "hash": "eadeb591fbc8b28a", "title_fa": "The Chicks & Willie Colón به شکایت موسیقی هوش مصنوعی علیه Suno می پیوندند: «هویت های اختلاس شده»", "summary_fa": "The Chicks، Willie Colón و Sam Moore در حال پیوستن به مبارزه قانونی علیه موسیقی هوش مصنوعی هستند. این سه بازیگر و دارایی‌های آن‌ها از جمله هنرمندانی بودند که سه شنبه (24 نوامبر) به پرونده‌ای که تابستان امسال علیه سونو تشکیل شده بود، اضافه شدند و تولیدکننده آهنگ هوش مصنوعی را متهم به نقض قانون می‌کند و به کاربران اجازه می‌دهد «هویت یک موسیقیدان محبوب را تداعی کنند» وقتی نامی را به عنوان درخواست وارد می‌کنند. Suno مرتبط، صورت Anthropic $ 1B شکایت حق نسخه برداری از موسیقی Round Hill به دلیل آموزش هوش مصنوعی کریس براون موافقت کرد که در حال حاضر حمایت از کودکان را افزایش دهد تا Diamond در Bitter Custdy Fight Rod Wave متهم به اتهامات اسلحه مواد مخدر برای اقلامی که گفته می شود در ماشین پیدا شده است پس از توقف سرعت، هنرمند در مرکز رسیدگی قرار گرفت. حق تشبیه، بر خلاف دعاوی قبلی در مورد آزمایشگاه های هوش مصنوعی که از موسیقی دارای حق چاپ برای آموزش مدل ها استفاده می کردند. اکنون، این مورد توسط قدرت ستاره یک سه کانتری بزرگ، یک تایتان موسیقی لاتین و یک افسانه RB پشتیبانی می شود. وکلای هنرمندان می نویسند: «سونو مدلی ساخت و آموزش داد تا نوازندگان را با نام فهرست کند. این شرکت هویت نوازندگان را در مدل هوش مصنوعی خود کدگذاری کرد تا محصول تجاری خود را بدون رضایت ایجاد کند، و اکنون از این هویت ها با استفاده عمومی از نام نوازندگان به نفع تجاری قابل توجه سونو سوء استفاده می کند. علاوه بر اعضای چیکس (ناتالی مینز، مارتی مگوایر و امیلی استریر) و املاک کولون و مور فقید، 10 هنرمند دیگر نیز به این دعوی پیوستند، از جمله دیوید لانگسترث از گروه راک مستقل Dirty Projectors. کارل کریگ، دی جی پیشگام تکنو دیترویت؛ فرانتس نیکولای از گروه راک The Hold Steady.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/P1071SQD-e1790825148246.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "موسیقی"], "datetime_fa": "۴ آذر • ۱۸:۳۷"}, {"source": "Rolling Stone", "title": "Thank You, Jensen Huang", "link": "https://www.rollingstone.com/politics/political-commentary/trump-jensen-huang-why-congress-should-investigate-1235664112/", "summary": "Trump’s reinstatement of the Nvidia chairman after a spy-sex scandal may finally force Congress to do the unexpected: its job", "date_str": "2026-11-25T15:04:37+00:00", "hash": "73f279c2fea3df06", "title_fa": "متشکرم جنسن هوانگ", "summary_fa": "بازگرداندن رئیس انویدیا توسط ترامپ پس از یک رسوایی جنسی-جاسوسی ممکن است در نهایت کنگره را مجبور به انجام کارهای غیرمنتظره کند: وظیفه اش حتی اگر فردی زندگی طولانی و متهورانه ای پر از ماجراجویی و اشتیاق داشته باشد، بعید است که فعالیت های جنسی او به پیوند یک بحران ژئوپلیتیک تبدیل شود، چه برسد به نقطه عطف دموکراسی آمریکا در انجام یک ترفند. یکی از آزاردهنده‌ترین ویژگی‌های زندگی مدرن، طنین آن با دوره قبلی آمریکاست، عصر طلایی که در آن زندگی کثیف سرمایه‌داران و دلالان قدرت صرفاً خوراک روزنامه‌نگاری نبود، بلکه دلایل دائمی نگرانی برای امنیت ملی بود. در 12 نوامبر، جنسن هوانگ، بنیانگذار میلیاردر سازنده نیمه هادی انویدیا، پس از اعتراف به چندین رابطه خارج از ازدواج - از جمله یکی از آنها با یک تبعه چینی مظنون به همکاری با مقامات اطلا  میندی کالینگ نویسنده، کارگردان، بازیگر و تهیه کننده برنده جایزه جایزه Equity in Entertainment امسال را در مراسم جشن صبحانه سالانه زنان در سرگرمی در لس آنجلس دریافت خواهد کرد. بازیگر Maitreyi Ramakrishnan که در سریال پرطرفدار نتفلیکس Never Have Iver به کالینگ بازی کرد، این جایزه را به کالینگ اهدا خواهد کرد. کالینگ به تیلور سویفت می‌پیوندد که هالیوود ریپورتر قبلاً اعلام کرده بود که جایزه رهبری شری لنسینگ را به عنوان مفتخر در مراسم جشن امسال دریافت می‌کند. خبرهای مرتبط اخبار عمومی تیلور سوئیفت با جایزه رهبری شری لنسینگ هالیوود ریپورتر در مراسم زنان در سرگرمی تجلیل خواهد شد. لیلی لینا پولیمی، مدیر ارشد بازاریابی – مصرف کننده در Eli Lilly and Company، نکاتی را در مورد تقاطع مهم سلامت و سرگرمی به اشتراک خواهد گذاشت. جایزه Equity in Entertainment به افرادی می پردازد که صدای جوامعی را که کمتر در صنعت سرگرمی حضور دارند تقویت می کنند. این جایزه در سال 2016 ایجاد شد و جنیفر لوپز، سلنا گومز، کری واشنگتن، عیسی رای، رایان مورفی، امی پاسکال و نینا جاکوبسون از جمله برگزیدگان قبلی بودند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Mindy-Kaling-Photo-by-Ari-Michelson-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Hollywood Reporter", "title": "Gotham Film & Media Institute Names 2026 Winners of Focus Features Student Short Film Showcase (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/2026-gotham-film-media-institute-focus-student-short-films-1236762790/", "summary": "The five winners will each receive a cash grant and have the opportunity for their short to be shown on Focus Features' digital streaming platform.", "date_str": "2026-11-25T15:00:00+00:00", "hash": "a0f25074eb0dd9a1", "title_fa": "موسسه فیلم و رسانه گاتهام برندگان 2026 نمایشگاه فیلم کوتاه دانشجویی Focus Features را نام برد (اختصاصی)", "summary_fa": "پنج برنده هر کدام یک کمک هزینه نقدی دریافت خواهند کرد و فرصتی برای نمایش کوتاه خود در پلتفرم پخش دیجیتالی Focus Features t/uploads/2026/11/Screenshot-2026-11-24-at-4.16.02-PM.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Variety", "title": "Vatican-Produced Doc ‘Green Lava’ Drops Trailer Featuring Justin Bieber’s ‘Everything Hallelujah’ (EXCLUSIVE)", "link": "https://variety.com/2026/awards/global/vatican-doc-trailer-justin-bieber-everything-hallelujah-1236957800/", "summary": "“Green Lava,” an inspirational Vatican-produced documentary short in the running for the Oscars, has unveiled its new global trailer which features Justin Bieber’s song “Everything Hallelujah.” The doc follows a 22-year-old Italian man named Giacomo Mattivi, who lives with Duchenne Muscular Dystrophy. Use of Bieber’s “Everything Hallelujah” was secured through a licensing agreement with Universal [ ]", "date_str": "2026-11-25T15:00:00+00:00", "hash": "f135da6d0dcfa3ec", "title_fa": "تریلر Doc «Green Lava» تولید شده توسط واتیکان با نمایش «همه چیز هاللویا» جاستین بیبر (اختصاصی)", "summary_fa": "«گدازه سبز»، یک مستند کوتاه الهام‌بخش محصول واتیکان که در حال رقابت برای اسکار است، تریلر جهانی جدید خود را با آهنگ «همه چیز هاللویا» جاستین بیبر رونمایی کرد. این مستند درباره یک مرد ۲۲ ساله ایتالیایی به نام جاکومو ماتیوی است که با دیستروفی عضلانی دوشن زندگی می کند. استفاده از \"همه چیز هاللویا\" بیبر از طریق توافق نامه مجوز با یونیورسال تضمین شد. تریلر جهانی جدید خود را که آهنگ جاستین بیبر به نام «Everything Hallelujah» را به نمایش می گذارد، رونمایی کرد. این مستند درباره یک مرد ۲۲ ساله ایتالیایی به نام جاکومو ماتیوی است که با دیستروفی عضلانی دوشن زندگی می کند. بر اساس بیانیه ای، استفاده از \"همه چیز هاللویا\" بیبر از طریق توافق نامه مجوز با Universal Music Enterprises، بخشی از UMG Recordings, Inc. پس از معرفی توسط مدیر موسیقی دانیل وایزمن، تضمین شد. در بیانیه آمده است که مضامین ایمان و قدردانی این آهنگ بازتاب دیدگاه جاکومو به زندگی و کاوش مستند خانواده، استقامت و امید است. شرایط مالی فاش نشد. داستان‌های مرتبط مستند برند راسل از     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
