  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>

      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;

      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;

      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }

      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;

      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

م نشده است. در بخش صادرات نیز بنادر شمالی رشد ۱۰ درصدی، مرزهای جاده‌ای افزایش ۹ درصدی و خطوط ریلی رشد ۵۳ درصدی را ثبت کرده‌اند. صادق مالواجرد تاکید کرد این افزایش‌ها هنوز به معنای جبران ظرفیت ازدست‌رفته بنادر جنوبی نیست. او همچنین محدودیت پذیرش کامیون‌های ایرانی در کشورهای همسایه را از مهم‌ترین مشکلات تجارت زمینی دانست و گفت با وجود فعالیت شبانه‌روزی بسیاری از گمرک‌ها و پایانه‌های ایران، محدودیت‌ها و سهمیه‌بندی کشورهای مقابل موجب تشکیل صف‌های طولانی کامیون‌ها شده است. به گفته وزیر راه، وزارت امور خارجه برای رفع این محدودیت‌ها در حال مذاکره با کشورهای همسایه است. این اظهارات در حالی مطرح می‌شود که تجارت زمینی ایران نیز طی هفته‌های گذشته با محدودیت‌هایی در مرزهای پاکستان و عراق مواجه شده است. پاکستان در ۲۵ مهرماه تجارت از گذرگاه‌های «گبد-ریمدان» و «تفتان» را تعلیق کرد. اگرچه گذرگاه گبد-ریمدان سوم آبان بازگشایی شد، گزارش‌ها نشان می‌دهد عبور محموله‌های جدید همچنان با محدودیت مواجه بوده است. در مرز عراق نیز گذرگاه «الشیب» در استان میسان، مقابل مرز چذابه ایران، بسته مانده است. مقام‌های اتاق بازرگانی تهران سوم آبان اعلام کردند سایر گذرگاه‌های مشترک ایران و عراق باز هستند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D8%A8%D9%86%D8%A7%D8%AF%D8%B1-%D8%AC%D9%86%D9%88%D8%A8_WSiy__v1024x512__box_0%2C0%2C1488%2C782.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۳ آبان • ۱۷:۲۷"}, {"source": "Independent Persian", "title": "از مین چسبنده تا شناور انفجاری؛ راهبرد ارزان ایران برای فشار بر کشتیرانی", "link": "https://www.independentpersian.com/node/423045/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D8%A7%D8%B2-%D9%85%DB%8C%D9%86-%DA%86%D8%B3%D8%A8%D9%86%D8%AF%D9%87-%D8%AA%D8%A7-%D8%B4%D9%86%D8%A7%D9%88%D8%B1-%D8%A7%D9%86%D9%81%D8%AC%D8%A7%D8%B1%DB%8C%D8%9B-%D8%B1%D8%A7%D9%87%D8%A8%D8%B1%D8%AF-%D8%A7%D8%B1%D8%B2%D8%A7%D9%86-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%A8%D8%B1%D8%A7%DB%8C-%D9%81%D8%B4%D8%A7%D8%B1-%D8%A8%D8%B1-%DA%A9%D8%B4%D8%AA%DB%8C%D8%B1%D8%A7%D9%86%DB%8C", "summary": re as a family of four, and we were excited. We hadn't been there more than 15 minutes when Michael spilled some juice on his shorts. Michael is autistic, and at that age, the sensation of wet clothing could be completely overwhelming for him. He began to have a meltdown. My husband stayed outside with our baby while I scooped Michael up and rushed him into the nearest women's bathroom. I was trying to help my son while worrying about everyone watching us By the time we got inside, Michael was screaming and crying. I took off his shorts and held them under the hand dryer while trying to calm him. I was panicked and embarrassed, doing my best. Several women were in the bathroom, including one who made her disapproval very clear. Eventually, she walked outside, and I heard her complain loudly about the \"screaming, crying kid\" in the bathroom and say that I needed to take him somewhere else. Then I heard my husband. \"That's our son. He's autistic and is having a difficult time right now.\" Another woman immediately jumped to our defense, asking the woman why she couldn't show some empathy instead of being so rude. Now an argument was happening outside the bathroom while I was still desperately trying to dry a tiny pair of shorts. I was mortified. Eventually, Michael calmed down, and we went back into the zoo. But I didn't calm down. For much of the day, I felt ashamed. I worried about running into that woman again. Somehow, I'd convinced myself I'd failed Michael and all the strangers who'd had to witness his distress. I also kept thinking: If she could see how much I was struggling, why didn't she just ask if I needed help instead of being so judgmental? I stopped trying to make other people comfortable Over the years, I've met many parents of children with disabilities who have their own versions of that story. I've also had other difficult moments with Michael at Target, Disney World, at airport security, and plenty of other p", "date_str": "2026-11-04T15:11:01+0 ny drivers have faced lower pay after accounting for their expenses. Riders, meanwhile, have contended with higher per-mile fares and longer wait times on Uber , according to a study published in September. Uber has offered some US drivers hundreds in incentive payments this fall ahead of the busy holiday season, Business Insider reported last month. The problem is broader than the US, though, executives said on Wednesday's call. Uber is also investing in attracting more delivery workers to its Uber Eats business, Khosrowshahi said. And both drivers and customers in emerging markets such as Brazil and India are being squeezed by higher fuel prices, CFO Balaji Krishnamurthy said. Fuel prices have spiked in the months since the US and Israel started a war with Iran. Uber is spending on incentives for drivers in those markets, too, Khosrowshahi said. AI is deciding exactly how and where Uber spends its incentive money, Khosrowshahi said. Uber's algorithms are trained on \"billions of trips\" and make decisions \"that humans just can't,\" he said. \"If you have a dollar, what is the maximum predicted return for that dollar?\" Khosro", "date_str": "2026-11-04T14:53:26+00:00", "hash": "c131b93d3d8a3096", "title_fa": "اوبر به درایور نیاز دارد. می خواهد پول شما را روی مشکل بیندازد", "summary_fa": "اوبر هزینه‌ها را از تخفیف‌های سوارکاران به مشوق‌هایی برای رانندگان برای کار بیشتر تغییر می‌دهد. اتحاد سباستین گولنو/تصویر از طریق Getty Images Uber در تلاش است تا رانندگان را برای کار بیشتر روی برنامه خود فریب دهد. دارا خسروشاهی، مدیرعامل این شرکت گفت: از ایالات متحده تا هند، این شرکت بیشتر برای مشوق های راننده هزینه می کند. این چالشی است که اوبر از زمان پایان همه گیری با آن مواجه نشده است. اوبر به رانندگان نیاز دارد، به این معنی که برخی از سواران پول نقد بیشتری پرداخت خواهند کرد. دارا خسروشاهی، مدیرعامل این شرکت در روز چهارشنبه در تماس با درآمد سه ماهه سوم این شرکت گفت: در ایالات متحده و خارج از کشور، خدمات حمل و نقل و حمل و نقل در حال خرج کردن رانندگان برای انجام سفرها و تحویل ب  است، از جمله انتشار اصلی آلبوم و شماره دو هفته قبلی. 1، \"شیاطین\". این آهنگ با 2.6 میلیون پخش رسمی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/04/josiah-queen-2026-press-umg-cr-brady-pettee-billboard-1800.jpg?w=1024", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۱۳ آبان • ۱۸:۵۹"}, {"source": "Deadline", "title": "Toni Collette To Star In TV Adaptation Of Norwegian Dramedy ‘Pernille’ For Apple", "link": "https://deadline.com/2026/11/toni-collette-lenni-norwegian-dramedy-pernille-apple-1237212642/", "summary": "Toni Collette is to star in Apple’s latest dramedy. The Hereditary star is fronting Lenni, a comedy drama based on Norwegian series Pernille, also known locally as Pørni. The streamer has greenlit the series from Nine Perfect Strangers producer Made Up Stories and Homeland producer Keshet International. Lenni follows a divorced social worker who, after [ ]", "date_str": "2026-11-04T16:00:00+00:00", "hash": "4019e7bf2355e897", "title_fa": "تونی کولت در اقتباس تلویزیونی از درامدی نروژی «Pernille» برای اپل بازی خواهد کرد", "summary_fa": "تونی کولت قرار است در جدیدترین درام اپل بازی کند. ستاره ارثی در نقش لنی، یک درام کمدی بر اساس سریال نروژی پرنیل، که در محلی با نام پورنی نیز شناخته می‌شود، بازی می‌کند. پخش‌کننده، سریال را از تهیه‌کننده Nine Perfect Strangers، Made Up Stories و تهیه‌کننده Homeland، Keshet International، روشن کرده است. لنی یک مددکار اجتماعی مطلقه را دنبال می‌کند که پس از [ ] همچنین بازیگرانی چون سیاران هیندز، دن ویلی، جاش مک‌کنزی، سلست باربر، ژنویو هگنی، آرکا داس و وین بلر بازی می‌کنند. Watch on Deadline Lenni بر اساس Pernille ساخته شده است که توسط Henriette Steenstrup ساخته شده است. نسخه اصلی به مدت سه فصل در Viaplay پخش شد و دو فصل آخر آن از نتفلیکس پخش شد. Lenni توسط Dearbhla Walsh از Bad Sisters کارگردانی شده و سارا شلر (Strife) آن را اقتباس کرده است. این فیلم در حال حاضر در سیدنی، استرالیا با حمایت صندوق ساخته شده در NSW از Screen NSW در حال فیلمبرداری است. تولیدکنندگان اجرایی عبارتند از Collette، Scheller، Walsh، Steenstrup، Bruna Papandrea، Steve Hutensky، Katie Amos، Avi Nir، Keren Shahar، Bård Fjulsrud و Tanya Badendyck. Collette توسط CAA، United Management، Finley Management و Jackoway Austen Tyerman Wertheimer Mandelbaum Morris Bernstein Trattner Auerbach Hynick Jaime LeVine Sample Klein نمایندگی می شود. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Porni-S5-1500.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "نتفلیکس"], "datetime_fa": "۱۳ آبان • ۱۹:۳۰"}, {"source": "Deadline", "title": "Bri Lee’s Novel ‘The Work’ Set For TV Adaptation At Dollhouse Pictures", "link": "https://deadline.com/2026/11/dollhouse-pictures-the-work-bri-lee-tv-adaptation-1237212094/", "summary": "EXCLUSIVE: Bri Lee s Australian bestseller The Work is getting a TV adaptation. Dollhouse Pictures – the Sydney-based production collective led by Rose Byrne, Krew Boylan, Shannon Murphy and Jessica Carrera – landed the screen option on the novel following a negotiation with rights holder UTA. Published by Allen Unwin, The Work is set between [ ]", "date_str": "2026-11-04T16:00:00+00:00", "hash": "27ab28103fe00427", "title_fa": "رمان «کار» اثر بری لی برای اقتباس تلویزیونی در Dollhouse Pictures", "summary_fa": "انحصاری: کتاب پرفروش استرالیایی بری لی، The Work در حال دریافت اقتباس تلویزیونی است. Dollhouse Pictures - گروه تولیدی مستقر در سیدنی به رهبری رز بایرن، کرو بویلان، شانون مورفی و جسیکا کاررا - پس از مذاکره با دارنده حقوق، UTA، گزینه‌ی نمایشگر را روی رمان قرار داد. این اثر که توسط آلن آنوین منتشر شده است بین [ ] Dollhouse Pictures – مجموعه تولیدی مستقر در سیدنی به رهبری رز بیرن، کرو بویلان، شانون مورفی و جسیکا کاررا – پس از مذاکره با دارنده حقوق UTA، گزینه صفحه نمایش را روی رمان قرار داد. در خلاصه داستان آمده است، هنگامی که آنها با هم ملاقات می کنند، شیمی آنها بلافاصله شروع می شود و یک رابطه پرتلاطم از راه دور آغاز می شود. همانطور که زندگی شخصی و حرفه ای آنها به طور فزاینده ای در هم پیچیده می شود، آنها شروع به این سوال می کنند که آیا عشق آنها می تواند از راه دور، جاه طلبی و محل کار سخت آنها دوام بیاورد یا خیر. تماشا در ددلاین، هانا لمان، فیلم‌نامه‌نویس، که مجموعه اصلی دو طرف اسنپ را ساخته و کارگردانی کرده، در حال ساخت این مجموعه تلویزیونی است و لی و کاررا تهیه‌کنندگان اجرایی آن هستند. Screen Australia از توسعه پشتیبانی می کند. کاررا گفت: من همیشه نوشته‌های بری لی و تمایل او برای زیر سوال بردن قدرت، امتیازات و نهادهایی که ما را شکل می‌دهند تحسین می‌کردم. چیزی که من را در مورد The Work هیجان زده می کند، دنیای فریبنده آن است، جایی که همه چیز ارزشی دارد و قوانین مدام در حال تغییر هستند. در قلب آن رابطه پیچیده ای وجود دارد که می پرسد اگر فردی که بیشتر آرزویش را دارید چه کسی است که بیشترین هزینه را برای شما دارد. هانا لمان صدای تیز و مطمئنی را به اقتباس می آورد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/The-Work-Bri-Lee-and-producers.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۳ آبان • ۱۹:۳۰"}, {"source": "Deadline", "title": "Isabella Pappas, Heidi Berger & Nico Greetham Join Olivia Holt, Jaimie Alexander & Rohan Campbell In ‘Survive: The Game’", "link": "https://deadline.com/2026/11/isabella-pappas-heidi-berger-nico-greetham-survive-game-1237213152/", "summary": "EXCLUSIVE: Isabella Pappas (Stranger Things: The First Shadow), Heidi Berger (Ludwig) and Nico Greetham (American Horror Story) have joined the cast of Scout Taylor-Compton’s Survive: The Game, currently filming in Gipuzkoa, Spain. The trio rounds out the lead ensemble opposite previously announced stars Olivia Holt, Jaimie Alexander and Rohan Campbell. The film is shooting in [ ]", "date_str": "2026-11-04T15:37:56+00:00", "hash": "3c3494f722f6295f", "title_fa": "ایزابلا پاپاس، هایدی برگر و نیکو گرتهام به اولیویا هولت، جیمی الکساندر و روهان کمپبل در \"Survive: The Game\" می پیوندند.", "summary_fa" https://deadline.com/wp-content/uploads/2026/11/01.-COOPER_RSBB_0234.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Anthropic", "سینما"], "datetime_fa": "۱۳ آبان • ۱۸:۵۹"}, {"source": "Pitchfork", "title": "Christine and the Queens Returns with Two New Songs", "link": "https://pitchfork.com/story/christine-and-the-queens-returns-with-two-new-songs/", "summary": "“Rendez-vous avec toi” arrives alongside an English counterpart, “Rendez-vous in your arms”", "date_str": "2026-11-04T15:07:21+00:00", "hash": "58ca1862691973dc", "title_fa": "بازگشت کریستین و کوئینز با دو آهنگ جدید", "summary_fa": "\"Rendez-vous avec toi\" در کنار یک همتای انگلیسی می آید، \"Rendez-vous in your arms\" Loader Save Story ذخیره این داستان Comment Loader Save Story Save this Story سه سال از انتشار آخرین آلبوم انفرادی مناسب کریستین و کوئینز می گذرد، یک آلبوم 20 آهنگی در آمریکا با الهام از فرشتگان. اکنون، او با آهنگ جدیدی بازگشته است که به دو روش ساخته شده است: به زبان فرانسوی (\"Rendez-vous avec toi\") و انگلیسی (\"Rendez-vous in your arms\"). هر دوی آنها با یک موزیک ویدیو به کارگردانی مشترک کریس و رافائل دی آلبوکرک و با طراحی رقص الکساندر اکمن همراه هستند. هر دو نسخه را در زیر بررسی کنید. «Rendez-vous avec toi» و «Rendez-vous in your arms» اولین پیش نمایش آلبوم جدید هنوز بدون عنوان از کریستین و کوئینز هستند که قرار است در بهار امسال منتشر شود. این به دنبال EP او در سال 2025 Catching Feelings با اسطوره دیسکوی Italo، Cerrone، و آلبوم او در سال 2024 Hopecore است که با نام رحیم ردکار منتشر شد. کریس در دسامبر امسال از آهنگ جدید دوگانه با چهار نمایش فول باند در اروپا و بریتانیا پشتیبانی خواهد کرد. او در بروکسل، لندن، و آمستردام اجرا خواهد کرد قبل از اینکه با یک مجموعه در الحمرا در پاریس به پایان برسد. کریس در مطالب مطبوعاتی گفت: \"ما رپرتواری را که باعث شد با هم رشد کنیم، دوباره مرور خواهیم کرد و اولین بار به آهنگ های منتشر نشده آلبوم بعدی گوش خواهیم داد.\" ما بازنگری می‌کنیم، دوباره تفسیر می‌کنیم، به یاد می‌آوریم و فراتر می‌رویم.» کریستین و کوئینز: 12-01 بروکسل، بلژیک - بوتانیک 12-07 لندن، انگ ate_str": "2026-11-04T15:01:32+00:00", "hash": "0407548a72dd4c57", "title_fa": "پس از تغییر کنگره توسط دموکرات ها، سهام افزایش یافت", "summary_fa": "وال استریت موج آبی را تشویق کرد که دموکرات‌ها را هم کنترل سنا و هم مجلس نمایندگان را تحت کنترل خود درآورد، با شاخص‌های اصلی بازار و سهام رسانه‌ای که صبح چهارشنبه پس از انتخابات میان‌دوره‌ای افزایش داشتند. به گفته مارکیت جی وودوم، بازارچی فری وودوم، به گفته استراتیست مارکت جی وود، شاخص نزدک کامپوزیت، شاخص Nasdaq Composite [ ] بود، میانگین صنعتی داوجونز در معاملات اولیه بیش از 1100 واحد افزایش یافت، 2.2 درصد افزایش یافت. CNBC. پس از اینکه ترامپ به نیویورک تایمز گفت که نتایج انتخابات میان دوره ای را می پذیرد، وودز گفت که افزایش بازار نیز تا حدودی ناشی از لحن و واکنش اولیه دونالد ترامپ رئیس جمهور آمریکا به نتایج است. از صبح روز چهارشنبه، دموکرات ها در سنا با برتری 54 بر 44 نسبت به جمهوری خواهان، با دو رقابت (در می سی سی پی و آلاسکا) که هنوز به AP اعلام نشده است، پیشی گرفتند. در مجلس نمایندگان، دموکرات ها 228 کرسی را به دست آورده بودند و حزب اکثریت قاطع را به دست آورده بود و حزب جمهوری خواه 139 کرسی بود و نتایج 68 رقابت هنوز مشخص نشده است. سهام رسانه‌ای که در معاملات اولیه صبح پس از میان‌ترم‌ها افزایش یافتند شامل نتفلیکس (+4%)، Comcast (+4%)، دیزنی (+3.8%)، Skydance (+2.8%) و فاکس کورپ (+2.4%) بودند. با وجود هشدار تحلیلگران مبنی بر اینکه اکثریت دموکرات‌ها در کنگره می‌توانند برای ساخت مراکز داده هوش مصنوعی با مشکل مواجه شوند، سهام‌های بزرگ فناوری نیز رشد کردند: اپل (+6%) آمازون (7.6%)، آلفابت (+4.9%) و متا (+2.4%) همگی روند صعودی داشتند. مایک بل، رئیس استراتژی در RBC BlueBay Asset Management به تایمز گفت: \"انتخابات میان دوره ای ایالات متحده یک گردباد سیاسی است.\"", "image_url": "https://variety.com/wp-content/uploads/2024/12/Media-stocks-NYSE.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "Apple", "عامل‌های هوشمند"], "datetime_fa": "۱۳ آبان • ۱۸:۳۱"}, {"source": "Billboard", "title": "How Gram Parsons Tribute Starring Emmylou Harris, Elvis Costello & The Black Crowes Came Together", "link": "https://www.billboard.com/music/rock/gram-parsons-nov-11-show-troubadour-emmylou-harris-1236368546/", "summary": "Gram Parsons was only 26 when he died in 1973 of an accidental overdose near Joshua Tree, California, but in the subsequent 50 years, the pioneering musician’s impact has only grown. As a pivotal member of The Byrds and co-founder of The Flying Burrito Brothers , as well as through his short solo career, Parsons bridged the then-divide between country music and rock, bringing the raw emotionalism of country into rock’s bravado. For his enduring musical contributions, Parsons will be inducted into the Rock Roll Hall of Fame in Los Angeles on Nov. 14 in the early influence category. Related Emmylou Harris, Elvis Costello, Black Crowes to Pay Tribute to Gram Parsons Ahead of Posthumous Rock Roll Hall of Fame Induction Rock Roll Hall of Fame Reveals Class of 2026: See Who Made It In This Year Five Takeaways From 2026 Rock Roll Hall of Fame Inductions But first, Parsons will be honored Nov. 11 at a sold-out, star-filled salute, A Song for Gram , at vaunted Los Angeles club The Troubadour. The celebration, headlined by Emmylou Harris Parson’s muse who sang on his two solo albums, including 1974’s seminal, posthumous Grievous Angel occurs less than a week after what would have been his 80th birthday on Nov. 5. Gram as an artist was way ahead of his time and I think he will continue to inspire those who come after him to follow their own vision, just as Gram did, Harris tells Billboard ahead of the tribute. Gram of course turned me on to country music and showed me the joy of playing with a band. Parsons’ daughter, Polly Parsons ; Vector Management’s Ken Levitan and Nicki Loranger ; the Rock Roll Hall of Fame s Rick Krim ; and Rolling Stone co-editor Shirley Halperin are producing the evening in partnership with the Gram Parsons estate and the Rock Roll Hall of Fame. Rolling Stone s Shirley Halperin, Polly Parsons and Vector Management’s Nicki Loranger Michael Buckner/Penske Media Polly says the Gram Parsons estate already hoped to do a tribute show for her father’s 80th birthday, and “when he got the induction, it made sense to combine the two. What better way to celebrate this moment?” Joel Peresman , Rock Roll Hall of Fame Foundation president/CEO, agrees. “Gram s story is so tied to Los Angeles,” he says of Parsons, who moved to Los Angeles in 1967 with his first group, the International Submarine Band. “The Troubadour is such a meaningful room in [his] history that it felt like the natural place to give him his own night as he is inducted under music’s highes", "date_str": "2026-11-04T15:00:00+00:00", "hash": "aee5cc262e057151", "title_fa": "چگونه Gram Parsons Tribute با بازی امیلو هریس، الویس کاستلو و The Black Crowes با هم آمدند", "summary_fa": "گرام پارسونز تنها 26 سال داشت که در سال 1973 بر اثر مصرف بیش از حد تصادفی در نزدیکی جاشوا تری، کالیفرنیا درگذشت، اما در 50 سال بعد، تأثیر این نوازنده پیشگام تنها افزایش یافته است. پارسونز به‌عنوان یکی از اعضای اصلی گروه بیردز و یکی از بنیان‌گذاران The Flying Burrito Brothers، و همچنین از طریق فعالیت کوتاه انفرادی خود، شکاف بین موسیقی کانتری و راک را از بین برد و عاطفه‌گرایی خام کانتری را به جسارت راک تبدیل کرد. پارسونز به خاطر مشارکت‌های ماندگارش در موسیقی، در 14 نوامبر در تالار مشاهیر راک رول در لس‌آنجلس در رده‌های تاثیر اولیه قرار می‌گیرد. مرتبط: Emmylou Harris، Elvis Costello، Black Crowes برای ادای احترام به Gram Parsons قبل از القای تالار مشاهیر راک رول پس از مرگ، تالار مشاهیر راک رول کلاس 2026 را نشان می دهد: ببینید چه کسی در این سال ساخته شده است. 11 در یک سلام پرفروش و پر ستاره، آهنگی برای گرم، در کلوب پر افتخار لس آنجلس The Troubadour. جشنی که با تیتر یکی از موسیقی‌های امیلو هریس پارسون، که در دو آلبوم انفرادی او، از جمله در سال 1974، اولین و پس از مرگ فرشته گریووس، خوانده شد، کمتر از یک هفته پس از تولد 80 سالگی او در 5 نوامبر برگزار می‌شود. هریس قبل از ادای احترام به بیلبورد می گوید که گرام به عنوان یک هنرمند بسیار جلوتر از زمان خود بود و من فکر می کنم او همچنان به کسانی که بعد از او می آیند الهام می بخشد تا دیدگاه خود را دنبال کنند، همانطور که گرام انجام داد. البته گرام مرا به موسیقی کانتری تبدیل کرد و لذت بازی با یک گروه را به من نشان داد. پولی پارسونز، دختر پارسونز؛ کن لویتان و نیکی لورنجر از مدیریت بردار؛ تالار مشاهیر راک رول ریک کریم ; و شرلی هالپرین،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/gram-parsons-1969-billboard-1800.jpg?w=1024", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۱۳ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Juanes Marks 25 Years in Music With First Greatest Hits Album ’25 Aniversario’: Here’s the Tracklist & Release Date", "link": "https://www.billboard.com/music/latin/juanes-greatest-hits-album-25-aniversario-release-date-tracks-1236373861/", "summary": "Celebrating the soon concluding first quarter century anniversary of his solo career, Colombian rock star Juanes will release his first greatest hit collection, titled 25 Aniversario , Billboard can report exclusively Wednesday (Nov. 4). Related 25 Questions With Juanes on the 25th Anniversary of His Solo Career: I’ve Found a Clarity That I Had Lost Long Ago Fonseca, Camilo, Juanes Carlos Vives Talk World Cup, Fatherhood and More Juanes Kicks Off His Most Extensive North American Tour: Full Setlist The 25-track career-spanning retrospective which includes Billboard Hot Latin Songs No. 1s such as La Camisa Negra, Nada Valgo Sin Tu Amor and Me Enamora comes out this Friday (Nov. 6) via Universal Music Latino. In addition to the global release across all major digital platforms, the set will be available in CD and vinyl formats as well. It has been 25 years of music — and counting, Juanes said in a statement. Thank you for so much joy and for accompanying me every step of the way. My heartfelt thanks to all my fans for ensuring that my songs continue to travel through time. You always breathe life into my music. “Over the past 25 years, Juanes, through his guitar and songwriting, has broken down borders, bringing the essence of Colombia to the world while redefining rock and Latin roots, added Angel Kaminsky, president, A R and artist relations at Universal Latin America Iberian Peninsula. This album is more than just a greatest hits collection it is a journey through the evolution of our cultural identity.” A winner of accolades including 25 Latin Grammys, four Grammys and more than 10 Billboard Latin Music Awards, Juanes born and raised in Medellín, Colombia is one of the most established and revered Latin artists of his generation, with Billboard chart-topping tracks also including Volverte a Ver Fotografía with Nelly Furtado and Gotas de Agua Dulce. In 2007, “Me Enamora” led Hot Latin Songs for 20 weeks and spent 38 weeks on the ranking. This year, Juanes also appeared on the June cover of Billboard Español along with fellow Colombian artists Camilo, Carlos Vives and Fonseca to talk about the FIFA World Cup, fatherhood and their country s spirit. 25 Aniversario , appropriately, begins with the title track to his 2000 landmark debut album, Fíjate Bien , which spoke to Colombia’s social hardships and went on to garner seven Latin Grammy nominations, with Juanes earning best new artist of the year. Also on the album are Yerbatero, Fuego and La Luz, songs fro", "date_str": "2026-11-04T15:00:00+00:00", "hash": "4d8c6e2561c46f2e", "title_fa": "خوان 25 سال موسیقی را با اولین آلبوم برتر «25 Aniversario» جشن گرفت: لیست آهنگ و تاریخ انتشار در اینجا آمده است", "summary_fa": "خوانس، ستاره راک کلمبیایی، با جشن گرفتن اولین سالگرد پایانی ربع قرن فعالیت انفرادی خود، اولین مجموعه موفق خود را با عنوان 25 Aniversario منتشر خواهد کرد که بیلبورد می تواند به طور انحصاری در چهارشنبه (4 نوامبر) گزارش دهد. 25 سوال مرتبط با خوانس در بیست و پنجمین سالگرد حرفه انفرادی او: وضوحی پیدا کردم که مدت ها پیش از دست داده بودم فونسکا، کامیلو، خوانس کارلوس ویوز درباره جام جهانی صحبت می کنند، پدر و مادر و موارد دیگر. آهنگ های داغ لاتین شماره 1 مانند La Camisa Negra، Nada Valgo Sin Tu Amor و Me Enamora این جمعه (6 نوامبر) از طریق Universal Music Latino منتشر می شود. این مجموعه علاوه بر عرضه جهانی در تمامی پلتفرم های دیجیتال اصلی، در قالب های سی دی و وینیل نیز در دسترس خواهد بود. خوانز در بیانیه ای گفت: 25 سال از موسیقی گذشته است - و همچنان در حال افزایش است. از این همه خوشحالی و همراهی من در تمام مراحل سپاسگزارم. از همه طرفدارانم صمیمانه تشکر می کنم که مطمئن شدند آهنگ های من همچنان در زمان سفر می کنند. تو همیشه به موسیقی من جان می دهی. آنجل کامینسکی، رئیس A R و روابط هنرمندان در شبه جزیره ایبری یونیورسال آمریکای لاتین، افزود: «در 25 سال گذشته، خوانس، از طریق گیتار و ترانه سرایی خود، مرزها را شکسته است، و جوهر کلمبیا را به جهان آورده و در عین حال ریشه های راک و لاتین را بازتعریف کرده است. این آلبوم بیش از یک مجموعه برترین آثار است، بلکه سفری است در مسیر تکامل هویت فرهنگی ما. برنده جوایز 25 گرمی لاتین، چهار جایزه گرمی و بیش از 10 جایزه موسیقی لاتین بیلبورد، خوانز متولد و بزرگ شده در مدلین، کلمبیا، یکی از معتبرترین و معتبرترین هنرمندان لاتین نسل خود است، با آهنگ های برتر جدول", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Juanes-cr-Mario-Alzate-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۳ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "The Cure’s Robert Smith Teases 2027 Tour Dates Will Be ‘Bursting With New Songs’", "link": "https://www.billboard.com/music/rock/the-cure-robert-smith-2027-tour-dates-bursting-new-songs-1236373864/", "summary": "After a very busy 2026, The Cure frontman Robert Smith made a bold prediction for his veteran band s 2027 tour. In a voicemail sent to Nick Grimshaw s BBC Radio 6 show this week, Smith, 67, teased more Cure shows next year, where he said fans may also get a preview of new music. The Cure were on the road this summer in support of the band s 2024 LP Songs of a Lost World , playing more than a dozen European festivals, culminating on Aug. 30 with an appearance at the Rock en Seine fest in Saint-Cloud, France. That swing also included the debut of his collaboration on Olivia Rodrigo s What s Wrong With Me, which they performed live together for the first time at the Primavera Sound festival in Barcelona, Spain in June, all highlights that Smith alluded to in his voicemail. But the real headline grabber was his hint about new music. I’m looking forward to more Cure concerts in 2027. Of course, I’m not allowed to say where or when yet, but I’m confident they will be bursting with new songs, Smith said. Watch this space…” The Cure broke a 16-year studio album drought in 2024 with the emotionally roiling Songs of a Lost World , their first LP of new music since 2008 s 4:13 Dream . A month after its release, Smith and company dropped The Show of a Lost World concert film, as well the Songs of a Live World: Troxy London MMXXIV live album, followed by the June 2025 Mixes of a Lost World remix album. Then, in a teaser in December 2024, Smith revealed that he had two more albums in the chamber, including another album which is pretty much ready to go. It s sort of a companion piece, as well as a third one that is completely different. It s really kind of random stuff, it s like late-night studio stuff. But some of it is really, really good actually, it s just very, very different. At press time no additional information was available on those two untitled, unreleased albums.", "date_str": "2026-11-04T14:13:13+00:00", "hash": "8c7ef85e60b7fd89", "title_fa": "The Cure's Robert Smith Teases تاریخ های تور 2027 با آهنگ های جدید همراه خواهد بود", "summary_fa": "پس از یک سال بسیار شلوغ در سال 2026، رابرت اسمیت، رهبر گروه The Cure، پیش بینی جسورانه ای را برای تور 2027 گروه کهنه کار خود انجام داد. اسمیت 67 ساله در یک پیام صوتی که این هفته برای برنامه رادیو 6 بی بی سی نیک گریمشاو ارسال شد، برنامه های Cure بیشتری را در سال آینده به اشتراک گذاشت و گفت که طرفداران ممکن است پیش نمایشی از موسیقی جدید را نیز دریافت کنند. The Cure در تابستان امسال برای حمایت از گروه LP Songs of a Lost 2024 در راه بود و بیش از ده ها جش rezjalibd.github.io/daily-news/archive/2026-09-14.html"}, {"date_key": "2026-09-13", "p_date": "۲۲ شهریور ۱۴۰۵", "g_date": "۱۳ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-13.html"}, {"date_key": "2026-09-12", "p_date": "۲۱ شهریور ۱۴۰۵", "g_date": "۱۲ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-12.html"}, {"date_key": "2026-09-11", "p_date": "۲۰ شهریور ۱۴۰۵", "g_date": "۱۱ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
