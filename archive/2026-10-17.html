می‌شود؛ اعتراضاتی که در پی آن، از اتحادیه‌های کارگری و چهره‌های سرشناس جنبش موسوم به «جلیقه‌زردها» خواسته شد که به دانش آموزان بپیوندند. شرکت کنندگان در این تجمعات به هزینه بالای زندگی، کمبود بودجه خدمات عمومی، افت استانداردهای آموزشی و برخوردهای سخت‌گیرانه پلیس معترض هستند. معترضان می‌گویند که از یک دهه ریاست‌جمهوری امانوئل مکرون خسته شده‌اند. وزارت کشور فرانسه با محکوم کردن آنچه «اقدامات خشونت‌آمیز هدفمند» خوانده است، برخی معترضان را به تلاش برای غارت و حمله به نیروهای پلیس متهم کرده است. امانوئل مکرون، رئیس‌جمهور فرانسه، خواستار برقراری «آرامش» شد و از معترضان خواست که به مردم احترام بگذارند و به اموال عمومی خسارت وارد نکنند. سباستین لکورنو، نخست‌وزیر فرانسه، هم پیش‌تر گفته بود که اعتراض دانش‌آموزان از سوی حزب چپ‌گرای «فرانسه تسلیم ناپذیر» مورد سوءاستفاده قرار می‌گیرد و جهت‌دهی می‌شود. آقای لکورنو با متهم کردن اعضای این حزب به تشویق به اعتراضات، گفت: «آن‌ها از جنبش دانش‌آموزان دبیرستانی به عنوان ابزاری برای کسب منافع انتخاباتی خود استفاده می‌کنند.» پلیس پاریس در بیانیه‌ تازه در شبکه اجتماعی ایکس گفت: «ما در برابر آشوبگران و کسانی که برای حمله به نیروهای مجری قانون می‌آیند، عقب‌نشینی نمی‌کنیم.» پلیس معترضان را «افراد متخاصم» نامید و آن‌ها را به هدف قرار دادن ماموران متهم کرد. پلیس تاکید کرد که نیروهایش «با شجاعت در برابر آن‌ها ایستادگی می‌کنند.» ویدئویی که همراه این پست منتشر شده، معترضانی را نشان می‌دهد که سنگ پرتاب می‌کنند؛ در حالی که نیروهای پلیسِ مجهز به تجهیزات ضدشورش به سمت آن‌ها یورش می‌برند."}, {"source": "BBC Persian", "title": "کناره‌گیری زودهنگام کیتی زکریا؛ سخنگویی که در روزهای حساس ترامپ ناکام ماند", "link": "https://www.bbc.com/persian/articles/cmglwz33rpy5o?at_medium=RSS&at_campaign=rss", "summary": "کیتی زکریا، تنها پنج روز پس از نخستین حضور نه‌چندان موفق خود در برابر رسانه‌ها، اعلام کرد که از سمت سخنگوی مطبوعاتی کاخ سفید کناره‌گیری می‌کند. سمت سخنگوی مطبوعاتی کاخ سفید، حتی در بهترین شرایط شغلی دشوار است. اما شرایط این بار از بهترین حالت ممکن فاصله زیادی داشت.", "date_str": "2026-10-17T12:36:57+00:00", "hash": "64216fd6df3cccc7", "title_fa": "کناره مومی نام فرزندانشان ندارند. در این حمله دو نفر دیگر نیز مجروح شدند از جمله یک معلم ۵۴ ساله است که همچنان در بیمارستان تحت درمان قرار دارد و یک دانش‌آموز هفت‌ساله که وضعیت او وخیم اما پایدار گزارش شده است. آقای کرانتز گفته است که اقدامات قهرمانانه یک معلم و همچنین پدری که به داخل مدرسه شتافت، موجب نجات جان افراد دیگر در این حادثه شده است. او گفت معلمی که با فرد مسلح درگیر شد، آسیبی ندید، اما «تقریبا به‌طور قطع به جلوگیری از خون‌ریزی بیشتر کمک کرد.» رئیس پلیس هویت فرد مظنون را گریفین جی. جان دوم، ۱۶ساله، اعلام کرده که پیش‌تر در این مدرسه تحصیل می‌کرده و دانش‌آموزی بوده که به آموزش‌های ویژه نیاز داشته بود. رئیس پلیس افزود که حکم بازرسی خانه فرد مظنون به اجرا در آمده و عملیات جست‌وجو همچنان ادامه دارد. پلیس معتقد است که فرد مظنون پیاده به سمت مدرسه ابتدایی رفت، اما تحقیقات درباره مسیر دقیق حرکت او و نحوه"}, {"source": "BBC Persian", "title": "چند فلسطینی و یک خبرنگار آمریکایی در حمله شهرک‌نشینان اسرائیلی در فصل برداشت زیتون زخمی شدند", "link": "https://www.bbc.com/persian/articles/c63r599gqqyvo?at_medium=RSS&at_campaign=rss", "summary": "ده‌ها شهرک‌نشین اسرائیلی که صورت‌های خود را پوشانده بودند، به گروهی از فلسطینی‌هایی که در روستای ابوفلاح، در شمال رام‌الله و در کرانه باختری اشغالی مشغول برداشت محصول زیتون بودند، حمله کردند.", "date_str": "2026-10-16T22:07:48+00:00", "hash": "4c140de560377639", "title_fa": "چند فلسطینی و یک خبرنگار آمریکایی در حمله شهرک‌نشینان اسرائیلی در فصل برداشت زیتون زخمی شدند", "summary_fa": "ده‌ها شهرک‌نشین اسرائیلی که صورت‌های خود را پوشانده بودند، به گروهی از فلسطینی‌هایی که در روستای ابوفلاح، در شمال رام‌الله و در کرانه باختری اشغالی مشغول برداشت محصول زیتون بودند، حمله کردند. این شهرک‌نشینان اهالی روستا را مورد ضرب و جرح قرار دادند، به سوی آنها سنگ پرتاب کردند و درختان زیتون و خودروهای آنها را به آتش کشیدند. چند فلسطینی به همراه یک خبرنگار آمریکایی به بیمارستان منتقل شدند. هایدی لوین، عکاس باسابقه آمریکایی که برای واشنگتن پست کار می‌کرد، مورد ضرب و جرح قرار گرفته است. او که برای تهیه گزارش تصویری درباره تلاش فلسطینی‌ها برای برداشت محصول زیتون به این منطقه رفته بود، پس از این اینکه مورد حمله قرار گرفت به بیمارستانی در رام‌الله منتقل شد. سردبیر روزنامه واشنگتن پست با ابراز خشم از این حمله، خواستار تحقیقات شد. روزنامه واشنگتن پست اعلام کرد که خانم لوین هنگام حمله، جلیقه ضد گلوله‌ای بر تن داشت که کلمه رسانه یا خبرنگار به‌وضوح روی آن نوشته شده بود. به گزارش خبرگزاری فرانسه ارتش اسرائیل اعلام کرد که نیروهای نظامی و پلیس مرزی پس از دریافت گزارشی درباره «درگیری خشونت‌آمیز» به منطقه اعزام شده‌اند. ارتش گفت: «یک خبرنگار زن در جریان این درگیری زخمی شده است» و افزود که شرایط حادثه بررسی خواهد شد. خشونت شهرک‌نشینان اسرائیلی در کرانه باختری طی روزهای اخیر افزایش یافته است. دولت اسرائیل این خشونت‌ها را محکوم کرده، اما برای متوقف کردن آن‌ها اقدام چندانی انجام نداده است. سخنگوی وزارت امور خارجه آمریکا در پاسخ به پرسشی درباره این خشونت‌ها گفته است که آن‌ها از این گزارش‌ها آگاه هستند. این سخنگو افزود: «ما خشونت‌های مجرمانه از سوی هر طرفی در کرانه باختری را محکوم می‌کنیم و خواستار انجام تحقیقات، بازداشت و محکومیت عاملان آن هستیم.» به گفته سازمان ملل متحد، شمار حملات شهرک‌نشینان اسرائیلی در دو هفته گذشته، از مجموع حملات کل فصل برداشت"}, {"source": "BBC Persian", "title": "هم‌زمان با کاهش صادرات نفت، گزارش‌های حمله به کشتی‌ها در نزدیکی تنگه هرمز رکورد زد", "link": "https://www.bbc.com/persian/articles/c6r7y9nl8g30o?at_medium=RSS&at_campaign=rss", "summary": "تحلیل بی‌بی‌سی وریفای از داده‌های یک نهاد دریایی بریتانیا نشان می‌دهد که ۱۲ شناور در طول یک هفته هدف حمله قرار گرفته‌اند.", "date_str": "2026-10-16T16:00:27+00:00", "hash": "28348d0ef22feb09", "title_fa": "هم‌زمان با کاهش صادرات نفت، گزارش‌های حمله به کشتی‌ها در نزدیکی تنگه هرمز رکورد زد", "summary_fa": "تحلیل بی‌بی‌سی وریفای از داده‌های یک نهاد دریایی بریتانیا نشان می‌دهد که ۱۲ شناور در طول یک هفته هدف حمله قرار گرفته‌اند. از ۵ تا ۱۱ اکتبر، ۱۲ شناور هدف حمله قرار گرفتند؛ بالاترین شمار حملات گزارش‌شده در یک هفته به مرکز عملیات تجارت دریایی بریتانیا (یوکی‌ام‌تی‌او)، از زمان آغاز جنگ آمریکا و اسرائیل با ایران. در هفته پیش از آن، ۱۰ کشتی گزارش داده بودند که هدف حمله قرار گرفته‌اند. به گفته این نهاد، شش شناور در روز یکشنبه ۱۱ اکتبر هدف حمله قرار گرفتند که بالاترین آمار ثبت‌شده در یک روز است. در هفته جاری نیز تاکنون چهار حمله گزارش شده است. داده‌های صنعت کشتیرانی نشان می‌دهد که با افزایش حملات، روند بهبود انتقال نفت از تنگه هرمز که ماه گذشته آغاز شده بود، کند شده است. بی‌بی‌سی وریفای گزارش‌های مربوط به حملات را که مرکز عملیات تجارت دریایی بریتانیا در وب‌سایت خود منتشر کرده، گردآوری کرده و بر اساس نخستین تاریخ ذکرشده در هر گزارش، جدول زمانی حملات را تهیه کرده است. این جدول زمانی تقریبی است، زیرا در برخی موارد تاریخ وقوع حمله و در موارد دیگر تاریخ گزارش آن مبنا قرار گرفته است. کارشناسان می‌گویند که ایران در تلاش برای اعمال کنترل بیشتر بر تنگه هرمز، به کشتی‌ها حمله می‌کند. این در حالی است که ارتش آمریکا شمار نفتکش‌هایی را که برای محافظت در برابر حملات ایران از مسیر جنوبی تنگه اسکورت می‌کند، افزایش داده است. به گفته کارشناسان، ایران همچنین حملات خود را به کشتی‌هایی که در فاصله بیشتری از تنگه هرمز قرار دارند، گسترش داده است. فرماندهی مرکزی ارتش آمریکا که مسئول عملیات نظامی این کشور در خاورمیانه است، در شبکه‌های اجتماعی اعلام کرد که با وجود حملات، «تردد کشتی‌های تجاری با حفاظت هماهنگ نیروهای آمریکایی و شرکای منطقه‌ای همچنان از تنگه هرمز ادامه دارد.» پیامدهای یکی از شش حمله گزارش‌شده در روز"}, {"source": "BBC Persian", "title": "درباره تلاش برای «سوقصد» به جان عباس آخوندی در حاشیه نشست اصلاح‌طلبان در تهران چه می‌دانیم؟", "link": "https://www.bbc.com/persian/articles/cmn8w6g17zvno?at_medium=RSS&at_campaign=rss", "summary": "بنیاد باران بازداشت یک فرد مسلح را در حاشیه مراسم سه‌شنبه گذشته در کتابخانه ملی ایران در شمال تهران تایید کرد. این بنیاد اعلام کرد که «بنا به اطلاعات اولیه»، فرد بازداشت‌شده قصد حمله به عباس آخوندی، وزیر پیشین و از چهره‌های اصلاح‌طلب ایران، را داشته است. به گفته بنیاد باران، این فرد تحویل نیروی انتظامی شده است. بنیاد باران را محمد خاتمی، رئیس‌جمهور پیشین ایران، به همراه شماری از مقام‌های دولتش تاسیس کرده است.", "date_str": "2026-10-16T16:26:20+00:00", "hash": "84b2500385fa34db", "title_fa": "درباره تلاش برای «سوقصد» به جان در پیامی ویدئویی، که روز جمعه ۲۴ مهر در حساب کاربری سنتکام در شبکۀ ایکس منتشر شده، گفت تنها ظرف یک هفتۀ گذشته، ۴۰۰ کشتی تجاری، با کمک نیروهای آمریکایی از تنگۀ هرمز عبور کرده‌اند. به‌گفتۀ فرماندۀ سنتکام، در همین مدت، سایر کشورهای حوزۀ خلیج فارس توانستند ۱۰۰ میلیون بشکه نفت خام را از این آبراه حیاتی عبور داده و صادر کنند. فرمانده ستاد فرماندهی مرکزی ارتش آمریکا همچنین اعلام کرد محاصرهٔ دریایی ایران مانع صادرات دست‌کم ۲۵ میلیارد دلار نفت خام شده و ایالات متحده نزدیک به ۳۵۰ میلیون دلار دارایی رمزارزی جمهوری اسلامی را مسدود کرده است. او گفت فشار اقتصادی بر نیروهای نظامی ایران به حدی رسیده که گزارش‌هایی از خودداری گروه‌های شبه‌نظامی همسو با تهران از پرداخت حقوق نیروهایشان، به‌منظور پس‌فرستادن پول به سپاه پاسداران، وجود دارد. به گفتهٔ کوپر، سپاه نیز حقوق نیروهای خود را پرداخت نمی‌کند. فرمانده سنتکام همچنین گفت ایران، جز دریافت کمک‌های بشردوستانه‌ای که آمریکا اجازهٔ ورود آنها را داده، هیچ واردات و صادرات دریایی ندارد. او محدود کردن صادرات نفت، مختل کردن تأمین مالی دیجیتال و تضعیف توان پرداخت حقوق نیروهای امنیتی ایران را سه محور فشار واشینگتن بر تهران برشمرد. در همین حال، خبرگزاری رویترز روز شنبه در گزارشی نوشت ایران با وجود محاصرهٔ دریایی آمریکا، از ماه ژوئیه مقداری گاز مایع و سوخت جت صادر کرده است. رویترز می‌نویسد که بر اساس داده‌های رهگیری کشتی‌ها و تصاویر ماهواره‌ای، دست‌کم هشت نفتکش حامل حدود ۴٫۱ میلیون بشکه گاز مایع ایران از میانهٔ ژوئیه از دریای عمان خارج شده‌اند و یک نفتکش حامل سوخت جت ایران نیز در سپتامبر به میانمار رسیده است."}, {"source": "Radio Farda", "title": "درگیری و بازداشت در اعتراضات سراسری فرانسه؛ جلیقه‌زردها بار دیگر به خیابان آمدند", "link": "https://www.radiofarda.com/a/france-cost-of-living-protests-yellow-vests-police-clashes/33878459.html", "summary": "اعتراضات سراسری به گرانی و کاهش کیفیت خدمات عمومی در فرانسه با درگیری معترضان و نیروهای پلیس در پاریس و مارسی، استفاده از گاز اشک‌آور و بازداشت ده‌ها نفر همراه شد.", "date_str": "2026-10-17T12:24:29+00:00", "hash": "d01107cc3e6fd545", "title_fa": "درگیری و بازداشت در اعتراضات سراسری فرانسه؛ جلیقه‌زردها بار دیگر به خیابان آمدند", "summary_fa": "اعتراضات سراسری به گرانی و کاهش کیفیت خدمات عمومی در فرانسه با درگیری معترضان و نیروهای پلیس در پاریس و مارسی، استفاده از گاز اشک‌آور و بازداشت ده‌ها نفر همراه شد. این اعتراضات که با فراخوان فعالان جنبش جلیقه‌زردها و همراهی دانش‌آموزان، اتحادیه‌های کارگری و دیگر گروه‌های اجتماعی برگزار می‌شود، در ادامهٔ چند هفته ناآرامی دانش‌آموزی شکل گرفته و به یکی از چالش‌های دولت فرانسه در ماه‌های پایانی ریاست‌جمهوری امانوئل مکرون تبدیل شده است. به گزارش خبرگزاری فرانسه، پلیس روز شنبه ۲۵ مهر حدود ۶۰ نفر را در پاریس بازداشت کرد. نیروهای پلیس همچنین برای متفرق کردن معترضان در پایتخت از گاز اشک‌آور استفاده کردند. در مارسی، دومین شهر بزرگ فرانسه، نیز معترضان با نیروهای پلیس درگیر شدند و برای مدتی یکی از خیابان‌های اصلی را با سطل‌های زباله و موتورسیکلت‌های کوچک مسدود کردند. گروهی از معترضان نقاب‌دار همچنین با استفاده از موانع امنیتی درِ ساختمان شهرداری مارسی را شکستند و برای مدت کوتاهی وارد آن شدند و یکی از آنان نماد آنارشیسم را روی دیوار کشید. در این شهر همچنین گروهی از معترضان به یک ساختمان پلیس حمله کردند و مأموران در واکنش از گاز اشک‌آور استفاده کردند. در پاریس نیز شماری از معترضان نقاب‌دار به ساختمان مرکزی شبکهٔ تلویزیونی راست‌گرای «سی‌نیوز» حمله کردند و شیشه‌های آن را شکستند. مقام‌های فرانسوی با استقرار گستردهٔ نیروهای امنیتی، برگزاری تجمع در اطراف ساختمان‌های دولتی، خیابان شانزه‌لیزه و شماری از ایستگاه‌های راه‌آهن پایتخت را ممنوع کرده‌اند. قرار بود تجمع اصلی پاریس بعدازظهر شنبه در میدان جمهوری برگزار شود. بر اساس اعلام برگزارکنندگان، بیش از ۶۰۰ تجمع و اقدام اعتراضی در سراسر فرانسه برنامه‌ریزی شده است. با این حال، هنوز آمار نهایی و تأییدشده‌ای از شمار شرکت‌کنندگان منتشر نشده است. موج تازهٔ اعتراضات فرانسه ماه گذشته از دبیرستان‌های مناطق کم‌درآمد شمال پاریس آغاز شد. دانش‌آموزان در اعتراض به کمبود معلم، فرسودگی ساختمان‌های آموزشی"}, {"source": "Radio Farda", "title": "اداره اطلاعات ایلام از بازداشت ۱۱ نفر در ملکشاهی در ارتباط با اعتراضات دی‌ماه خبر داد", "link": "https://www.radiofarda.com/a/33878419.html", "summary": "اداره‌کل اطلاعات ا یری buzzy توسط 35 درصد تیم‌های پولی مورد استفاده قرار گرفته است که تقریباً دو برابر دومین مدل محبوب، Sonnet 5.5 است. طبق داده‌های Vercel، این سریع‌ترین پذیرشی است که یک مدل تاکنون در دو هفته اول خود دیده است و یک دستاورد بزرگ برای خالقان مدل، TypeSafe AI است. Jev که در 15 سپتامبر در نسخه محدود منتشر شد، به عنوان یک ابزار سبک وزن برای انتخاب بین چند خروجی از پیش تعیین شده طراحی شده است. محدود کردن خروجی‌ها به مدل اجازه می‌دهد ارزان‌تر و سریع‌تر از جایگزین‌هایی مانند Sonnet اجرا شود و آن را برای طبقه‌بندی سریع مقادیر زیاد داده ایده‌آل می‌کند. این رویکرد جدید در هفته‌های پس از انتشار Jev سر و صداهای قابل توجهی را به خود جلب کرده است - الهام‌بخش پیشنهادات رقیب OpenAI و Amazon، در میان دیگران - اما تا کنون داده‌های سخت کمی برای پشتیبان‌گیری از حالات خوب وجود داشته است. این گزارش همچنین نشان می‌دهد که مدل‌های منبع باز، که اکنون بیش از ۷۰ درصد از توکن‌های پردازش شده از طریق دروازه Vercel و نزدیک به ۲۵ درصد از کل هزینه را تشکیل می‌دهند، شتاب ادامه دارد. در حالی که مدل های منبع باز سهم بیشتری از بازار را به خود اختصاص می دهند، بازار نیز به سرعت در حال رشد است. هزینه‌های آزمایشگاه‌های مرزی ده برابر شده است، حتی با وجود اینکه سهم کمتری از هزینه‌های کلی را به خود اختصاص می‌دهد، و به این ایده اعتبار می‌دهد که مدل‌های مرزی و جایگزین‌های منبع باز ممکن است مکمل یکدیگر باشند"}, {"source": "NYT Tech", "title": "Meta Withdraws $25 Million from Its Midterms Push", "link": "https://www.nytimes.com/2026/10/16/technology/meta-midterms-funding.html", "summary": "The company outlined a $65 million budget last year when it embarked on an effort to elect state politicians friendly to the A.I. industry.", "date_str": "2026-10-16T20:58:41+00:00", "hash": "9764f809013bd805", "title_fa": "متا 25 میلیون دلار از Push Midterms خود برداشت می کند", "summary_fa": "این شرکت در سال گذشته زمانی که تلاشی برای انتخاب سیاستمداران ایالتی دوستدار A.I آغاز کرد، بودجه ای 65 میلیون دلاری را مشخص کرد. صنعت"}, {"source": "The Guardian AI", "title": "The power of AI is worrying senior Labour figures – as is the fear of ‘falling behind the public’", "link": "https://www.theguardian.com/technology/2026/oct/17/artificial-intelligence-ai-labour-government-safety-uk-extremism", "summary": "Westminster appears to be waking up to warnings over AI safety, with concerns over its use by extremist groups and bad actors “I have this sense that, within a few months, AI is going to be all anyone is talking about,” said one cabinet minister, with an ominous stare. It was Labour conference, with everyone from ministers to activists jubilant at Andy Burnham’s takeover and a bounce in the polls after the change of leader. Continue reading...", "date_str": "2026-10-17T11:33:20+00:00", "hash": "462ea4313d6ef4d1", "title_fa": "قدرت هوش مصنوعی، شخصیت‌های ارشد حزب کارگر را نگران می‌کند – همانطور که ترس از «عقب افتادن از مردم» است.", "summary_fa": "به نظر می رسد وست مینستر در حال بیدار شدن با هشدارهایی در مورد ایمنی هوش مصنوعی، با نگرانی در مورد استفاده از آن توسط گروه های افراطی و بازیگران بد است: \"من این احساس را دارم که ظرف چند ماه آینده، هوش مصنوعی تمام چیزی خواهد بود که همه درباره آن صحبت می کنند.\" کنفرانس کارگری بود که همه از وزرا گرفته تا فعالان از قدرت گرفتن اندی برنهام و جهش در نظرسنجی ها پس از تغییر رهبر خوشحال بودند. ادامه مطلب... اما تعدادی از شخصیت‌های ارشد حزب کارگر به طور خصوصی شروع کردند به نام بردن از قدرت هوش مصنوعی به عنوان چیزی که بیشتر آنها را نگران می‌کند، در کنار فشارهای فوری بر هزینه زندگی و اقتصاد شکننده. یکی از وزیران کابینه - با مختصری که به فناوری مرتبط نیست - به گاردین گفت که هوش مصنوعی خطرناک و خارج از کنترل، موضوعی است که آنها را در شب بیدار نگه می دارد و از تهدیدی که برای بشریت وجود دارد نگران است. آنها توضیح دادند که \"روبات های قاتل\" باعث نگرانی نمی شدند، اما ایده مقدار عظیمی از نیروی متمرکز و فوق هوشمند به طور بالقوه در دستان بازیگران بد قرار می گیرد. دیگری ابراز نگرانی کرد که دولت از نظر رسیدگی به نگرانی های مربوط به ایمنی هوش مصنوعی «از مردم عقب مانده است» - و اینکه باید سریعاً به عقب بیفتد. در سخنرانی کنفرانس خود، اد میلیبند در مورد خطرات «هولناک» هوش مصنوعی دقیق‌تر بود، و این موضوع را مطرح کرد که سیاستمداران نمی‌توانند و نمی‌گذارند سود شرکت‌های فناوری «به ضرر فرزندان ما یا در واقع انسانیت تمام شود». و طولی نکشید که این زنگ‌های هشدار حتی بلندتر به صدا درآمدند، به طوری که هفت روز گذشته به نظر می‌رسد هفته‌ای است که وست‌مینستر کاملاً با هشدارها بیدار شده است. انبوهی از فعالیت ها"}, {"source": "The Guardian AI", "title": "Inside the long, bitter fight over one man’s quest to build the biggest AI datacenter in California", "link": "https://www.theguardian.com/us-news/ng-interactive/2026/oct/17/california-datacenter-imperial", "summary": "A modern-day prospector promised rural Imperial thousands of jobs and millions in tax revenue – but his plan has set off a firestorm of resistance Sebastian Rucci zoomed in on a map in late 2024, looking closely at a large block of brown earth. The barren plot sandwiched between sprawling alfalfa fields and sleepy desert suburbs was exactly what he’d been searching for – the perfect place to realize his dream of building the largest artificial intelligence datacenter in California. The dusty expanse wasn’t an obvious location. It was in the Sonoran desert, just north of the Mexican border, where temperatures regularly rose past 100F (37.8C). Water was scarce in the once-booming agricultural area, which gets its supply from the beleaguered Colorado River. And then, there was the city of Imperial – population 22,000 – to win over. As controversial datacenter projects have sprung up across the US, residents were naturally skeptical of a new, energy-guzzling neighbor. Continue reading...", "date_str": "2026-10-17T13:00:31+00:00", "hash": "a5241fa784c6ff1f", "title_fa": "در جنگ طولانی و تلخ بر سر تلاش یک مرد برای ساخت بزرگترین مرکز داده هوش مصنوعی در کالیفرنیا", "summary_fa": "یک کاوشگر امروزی به امپراتوری روستایی وعده هزاران شغل و میلیون‌ها درآمد مالیاتی را داد - اما طرح او طوفانی از مقاومت را به راه انداخته است. سباستین روچی در اواخر سال 2024 روی نقشه زوم کرد و به یک بلوک بزرگ از زمین قهوه‌ای نگاه کرد. زمین بی‌ثباتی که بین مزارع وسیع یونجه و حومه‌های بیابانی خواب‌آلود قرار گرفته بود، دقیقاً همان چیزی بود که او در جستجوی آن بود – مکانی عالی برای تحقق رویای خود برای ساختن بزرگترین مرکز داده هوش مصنوعی در کالیفرنیا. گستره غبارآلود مکان مشخصی نبود. این در صحرای سونوران، درست در شمال مرز مکزیک بود، جایی که دما مرتباً از 100 فارنهایت (37.8 درجه سانتیگراد) بالاتر می رفت. آب در منطقه کشاورزی که زمانی پررونق بود، کمیاب بود، که منابع خود را از رودخانه محاصره شده کلرادو تامین می کند. و سپس، شهر امپریال با جمعیت 22000 نفر بود که باید بر آن پیروز شود. با شروع پروژه های بحث برانگیز مرکز داده در سراسر ایالات متحده، ساکنان طبیعتاً نسبت به همسایه جدید و پر انرژی شک داشتند. به خواندن ادامه دهید... اما برای روچی، وکیلی 66 ساله با گذشته پیچیده، هیچ یک از این موانع غیرقابل عبور به نظر نمی رسید. روچی در میان طبقه جدیدی از واسطه‌ها است که در دنیای رو به رشد توسعه مرکز داده زندگی می‌کنند. رشد سریع هوش مصنوعی - که توسط شرکت‌های دره سیلیکون به ارزش تریلیون‌ها دلار گالوانیزه شده است - به یکی از بزرگترین رونق‌های ساخت و ساز صنعتی در تاریخ دامن زده است. این فناوری به قدرت محاسباتی بسیار بیشتری نسبت به خدمات اینترنتی سنتی نیاز دارد و این به معنای ساخت ساختارهای جدید عظیمی برای میزبانی میلیون ها سرور است. این تکثیر مراکز داده اکنون کاوشگران امروزی را به سمت خود جذب می کند که به امید کسب درآمد از یکی از"}, {"source": "The Guardian AI", "title": "Fake Linda and me: the Agatha Christie-worthy mystery of the fraudster who stole my byline", "link": "https://www.theguardian.com/technology/2026/oct/17/fake-linda-and-me-mystery-fraudster-stole-my-byline", "summary": "How a string of bizarre events led writer Linda Geddes to don her sleuthing cap and dig into a world of shadowy impersonators It started with an entirely ordinary interaction on LinkedIn. Someone had tagged me in a post, saying how much they’d enjoyed contributing to a New York Post article I’d written about “chronoworking”. As the author of a book about circadian rhythms, it was exactly the sort of subject I might write about. Except I’d never heard of this person, let alone interviewed them. I clicked on the link and my stomach dropped. There, above an article about people who organise their working lives around their biological clocks, was my name: Linda Geddes. Continue reading...", "date_str": "2026-10-17T11:00:30+00:00", "hash": "296bd5a696ff9520", "title_fa": "من و لیندا جعلی: رمز و راز آگاتا کریستی کلاهبرداری که خط من را دزدید", "summary_fa": "چگونه رشته‌ای از رویدادهای عجیب و غریب باعث شد نویسنده لیندا گدس کلاه خود را به سر کند و به دنیایی از جعل‌ها در سایه بپردازد، این با یک تعامل کاملاً معمولی در لینکدین شروع شد. شخصی من را در یک پست تگ کرده بود و می گفت که چقدر از مشارکت در مقاله نیویورک پست که در مورد \"کرون کار\" نوشته بودم لذت می بردند. به عنوان نویسنده کتابی در مورد ریتم های شبانه روزی، دقیقاً همان موضوعی بود که ممکن است درباره آن بنویسم. با این تفاوت که من هرگز نام این شخص را نشنیده بودم، چه برسد به اینکه با آنها مصاحبه کنم. روی لینک کلیک کردم شکمم افتاد. در آنجا، بالای مقاله ای درباره افرادی که زندگی کاری خود را حول ساعت بیولوژیکی سازماندهی می کنند، نام من بود: لیندا گدس. به خواندن ادامه دهید... من با یک تعامل کاملاً معمولی در لینکدین شروع کردم. شخصی من را در یک پست تگ کرده بود و می گفت که چقدر از مشارکت در مقاله نیویورک پست که در مورد \"کرون کار\" نوشته بودم لذت می بردند. به عنوان نویسنده کتابی در مورد ریتم های شبانه روزی، دقیقاً همان موضوعی بود که ممکن است درباره آن بنویسم. با این تفاوت که من هرگز نام این شخص را نشنیده بودم، چه برسد به اینکه با آنها مصاحبه کنم. این آخرین مورد از یک رشته از رویدادهای عجیب و غریب بود که سه هفته قبل از آن شروع شده بود، زمانی که یکی از دوستان که به عنوان ویراستار در مجله علمی Nature کار می کرد، پیامکی ارسال کرد و از او پرسید که آیا من برای یکی از همکارانش داستان ارائه کرده ام یا خیر. من نداشتم معلوم شد که شخصی با استفاده از نام من و آدرس ایمیلی که متعلق به من نیست، به ویراستاران Nature نزدیک شده"}, {"source": "The Guardian AI", "title": "Madeline Horwath on AI food advertising – cartoon", "link": "https://www.theguardian.com/commentisfree/picture/2026/oct/17/madeline-horwath-ai-food-advertising-cartoon-restaurants", "summary": "Continue reading...", "date_str": "2026-10-17T10:00:28+00:00", "hash": "730d299b6976e937", "title_fa": "Madeline Horwath در مورد تبلیغات مواد غذایی با هوش مصنوعی - کارتون", "summary_fa": "ادامه مطلب..."}, {"source": "The Guardian AI", "title": "‘Countries are defying gravity’: how much longer can global economy resist chaos?", "link": "https://www.theguardian.com/business/2026/oct/17/imf-warns-scale-subsidies-weather-global-chaos-untenable", "summary": "Sky-high oil prices and geopolitical turmoil have made less of a dent than feared … just don’t bank on it to last Inside the vast, glass-walled Queen Sirikit conference centre in Bangkok, the air-conditioned atmosphere was calm as policymakers from more than 100 countries gathered this week for the International Monetary Fund’s annual meeting – and contemplated the surprising strength of the global economy. A small army of smiling, uniformed Thai staff were on hand to explain the baffling geography of the heavily guarded building, where lunch options were as cosmopolitan as the delegates – including, improbably, a Burger King. Continue reading...", "date_str": "2026-10-17T10:00:27+00:00", "hash": "98169985f5751016", "title_fa": "\"کشورها جاذبه را به چالش می کشند\": اقتصاد جهانی تا کی می تواند در برابر هرج و مرج مقاومت کند؟", "summary_fa": "قیمت‌های بالای آسمان نفت و آشفتگی ژئوپلیتیکی کمتر از آن چیزی که می‌شد ترسید، ضربه‌ای ایجاد کرده است... فقط به ماندگاری آن فکر نکنید در مرکز کنفرانس بزرگ ملکه سیریکیت با دیوارهای شیشه‌ای در بانکوک، فضای مطبوع آرام بود زیرا سیاست‌گذاران بیش از 100 کشور این هفته برای تقویت اقتصاد جهانی توسط صندوق بین‌المللی پول گرد هم آمدند. ارتش کوچکی از کارکنان خندان و یونیفورم پوش تایلندی برای توضیح جغرافیای گیج کننده ساختمان به شدت محافظت شده، که در آن گزینه های ناهار به همان اندازه نمایندگان جهانی بود - از جمله، به احتمال زیاد، یک برگر کینگ - آماده بودند. ادامه مطلب... در کنار مرکز کنفرانس بزرگ ملکه سیریکیت با ate text, images or video consumes “orders of magnitude” more energy than traditional computing methods. Continue reading...", "date_str": "2026-10-16T23:00:15+00:00", "hash": "dba9b3422c8a32ba", "title_fa": "از بین بردن زندگی آنلاین شما: چگونه خانه دیجیتال خود را مرتب کنید و از داده های خود در برابر هوش مصنوعی محافظت کنید", "summary_fa": "هر فرد به طور متوسط ​​40 درصد از ساعات بیداری خود را آنلاین می گذراند. پاک کردن آشفتگی‌های دیجیتال می‌تواند اثرات زیست‌محیطی را به حداقل برساند و بهره‌وری را افزایش دهد. تغییر درجه‌بندی هر شنبه راه‌حل‌های زندگی و نکات زندگی پایدار را برای کمک به کاهش ردپای کربن خانوار شما ارائه می‌دهد. سؤال یا نکته‌ای برای کاهش انتشار گازهای گلخانه‌ای دارید؟ به ما به آدرس changebydegrees@theguardian.com ایمیل بزنید بسیاری از استرالیایی‌ها نگران هستند که مراکز داده زمین و انرژی محلی را ببلعند، اما ما به ندرت به مسیرهای دیجیتالی خود دقت می‌کنیم. جریان‌های بی‌پایان عکس و ویدیو، صندوق‌های ورودی پراکنده و اشتراک‌های خوانده‌نشده، همگی اشتها را برای زیرساخت‌های دیجیتال در حال رشد تغذیه می‌کنند. یک مطالعه در Nature Communications نشان داد که افراد به طور متوسط ​​40 درصد از ساعات بیداری خود را به صورت آنلاین سپری می کنند – مرور وب یا رسانه های اجتماعی، پخش موسیقی یا ویدیو یا برقراری ارتباط – تولید گازهای گلخانه ای معادل 229 کیلوگرم. و استفاده از ابزارهای هوش مصنوعی و ربات‌های چت برای تولید متن، تصاویر یا ویدیو انرژی بیشتری نسبت به روش‌های محاسباتی سنتی مصرف می‌کند. ادامه مطلب... من مطمئن هستم که تنها نیستم که در جستجوی آنلاین فایل‌ها یا عکس‌های گم‌شده، یا صرفاً تلاش برای اینکه IT خود را به درستی کار کند، ناامیدی روح‌افکنی را تجربه می‌کنم. مطالعه IDC بر روی 840 کارمند اطلاعات نشان می‌دهد که میانگین کارکنان بیش از دو ساعت در هفته را برای جستجوی فایل‌های گمشده و اسناد آنلاین تلف می‌کنند. لیبی سادلر، دانشیار رفتار سازمانی در دانشگاه باند، می‌گوید سازمان‌دهی فایل‌ها و دستگاه‌های دیجیتال ما نه تنها از اتلاف زمان جلوگیری می‌کند، بلکه اصطکاک و تخلیه شناختی را که زمانی که سازمان‌یافته نیستیم رخ می‌دهد، کاهش می‌دهد."}, {"source": "Medium AI", "title": "We asked an A ‌ای که انگار ایستاده است، فرو می‌رود. (نگران نباشید، والدین همکار. من این کار را با بچه‌های سرنشین امتحان نکردم.) در جاده‌های پر پیچ و خم، ماشین زنده می‌شود، تا حدی به لطف فرمان چهار چرخ (2150 دلار). آن را به حالت اسپرت پلاس رها کنید، و خودرو به معنای واقعی کلمه روی سیستم تعلیق بادی خود می افتد. آیا مطمئن هستیم که این یک کراس اوور ناشناس دیگر است؟ شاید ناشناس بودن یک ویژگی مفید در خودرویی به این پاسخگو و قدرتمند باشد. برخلاف اکثر کراس اوورهای دو ردیفه، شما احساس نشستن در ماکان را دارید، نه روی آن. چرخ به اندازه‌ای گسترش می‌یابد که موقعیت رانندگی اسپرت را امکان‌پذیر می‌کند، و کرنومتر کلاسیک پورشه (1040 دلار) که در بالای"}, {"source": "TechCrunch Main", "title": "Waymo’s robotaxis are headed to Canada", "link": "https://techcrunch.com/2026/10/16/waymos-robotaxis-are-headed-to-canada/", "summary": "The company will start off by testing its self-driving vehicles on Toronto's streets.", "date_str": "2026-10-16T16:06:38+00:00", "hash": "2b1ee7f3c0552ea6", "title_fa": "روباتاکسی های Waymo به سمت کانادا می روند", "summary_fa": "این شرکت با آزمایش وسایل نقلیه خودران خود در خیابان های تورنتو شروع به کار خواهد کرد. واحد خودروهای خودران آلفابت، Waymo، پس از دریافت مجوز برای شرکت در برنامه آزمایشی خودروهای خودکار انتاریو، در حال گسترش به کانادا است. با این حال، این شرکت هنوز یک سرویس روباتاکسی راه اندازی نکرده است. Waymo تمایل دارد برای هر شهر جدید از همان کتاب بازی پیروی کند، به تدریج از نقشه برداری دستی به آزمایش و در نهایت راه اندازی یک سرویس تجاری پیش می رود. Waymo در یک پست وبلاگی در روز جمعه اعلام کرد که وسایل نقلیه خودران این شرکت به صورت دستی در تورنتو هدایت می شوند تا نقشه هایی با وضوح بالا از شبکه های خیابانی محلی ایجاد کنند. این شرکت سپس خودروهای خودران خود را در جاده های عمومی با یک اپراتور ایمنی انسانی در هواپیما آزمایش خواهد کرد. این اپراتورها در نهایت از صندلی راننده بیرون کشیده می شوند و پس از آن شرکت از عموم مردم دعوت می کند تا در رباتاکسی خود سوار شوند. حرکت Waymo به کانادا بخشی از یک فشار تهاجمی به سمت بازارهای جدید است که در حال افزایش سرعت است. دو سال پیش، این شرکت تنها در سه بازار تجاری فعالیت می کرد و رباتاکسی های آن هنوز در آزادراه ها حرکت نمی کردند. برنامه های توسعه آن در مارس 2025 با استقرار در آستین و بعداً در آتلانتا آغاز شد. امروزه این شرکت خدمات روباتاکسی را در 15 شهر ایالات متحده دارد و در لندن و توکیو نیز در حال آزمایش آنهاست. تکدرا ماواکانا، مدیر عامل شرکت، گفت که گسترش به کانادا نقطه عطف مهمی در سفر جهانی آن است. این همچنین شمالی ترین و احتمالاً زمستانی ترین شهری است که Waymo تاکنون سعی کرده در آن فعالیت کند، بنابراین این شرایط فناوری AV و هوش عملیاتی آن"}, {"source": "TechCrunch Main", "title": "Tressfecta wants to make hair braiding a less arduous task for hairstylists", "link": "https://techcrunch.com/2026/10/16/tressfecta-wants-to-make-hair-braiding-a-less-arduous-task-for-hairstylists/", "summary": "Tressfecta builds products for textured hair. Its first project is a tool called Plait Pilot that helps braiders with the initial process of separating hair from packs before braiding begins.", "date_str": "2026-10-16T16:00:00+00:00", "hash": "68fe25939b5f22c5", "title_fa": "Tressfecta می‌خواهد بافتن مو را برای آرایشگران به یک کار دشوارتر تبدیل کند", "summary_fa": "Tressfecta محصولاتی را برای موهای دارای بافت می سازد. اولین پروژه آن ابزاری به نام Plait Pilot است که به بافتن‌ها کمک می‌کند تا در فرآیند اولیه جدا کردن موها از بسته‌ها قبل از شروع بافتن، اقدام کنند. آیساتا دیالو، 24 ساله، خود را قیچی تمام عمر می نامد. او گفت: \"من همیشه موهایم را در بزرگ شدن بافتم و در مقطعی از دوران تحصیلم در دانشگاه شروع به بافتن موهای دیگران کردم. در دانشگاه نورث ایسترن در بوستون، او دسترسی محدودی به قیطان‌ها و متخصصان بافت مو پیدا کرد، بنابراین تصمیم گرفت این شکاف را با راه‌اندازی یک کسب‌وکار کوچک برای خود پر کند. او گفت: \"در طول آن تجربه، من به برخی از نقاط دردناک در روند استایل کردن بسیار نزدیک بودم و دائماً از آن شکایت می کردم. قیطان کردن یک کار دستی است و یک سبک می تواند هشت ساعت طول بکشد. بسیاری از متخصصان پس از گذراندن روزهای طولانی در پشت صندلی و با بافتن موها با مسائلی مانند گرفتگی و سندرم تونل کارپال مواجه می شوند. در ابتدا، دیالو گفت که نمی‌دانست در این مورد چه کند. من بافتن را متوقف کردم و یکی از دلایلی که بافتن را متوقف کردم به خاطر عوارض فیزیکی آن بر بدن شما بود. او می‌خواست راهی بیابد که قیطاندن بافندگی را کمتر دردسر کند و به این فکر می‌کرد که آیا فناوری جدید هوش مصنوعی می‌تواند بخشی از این فرآیند را خودکار کند. ساخت سخت افزار برای بافندگی گران، دشوار و پیچیده است، که یکی از دلایلی است که نوآوری های کمی در این فضا وجود داشته است. بازار موهای بافت نیز مدت هاست که توسط جریان اصلی نادیده گرفته شده است. سپس، سال گذشته، او یک ایده داشت: Tressfecta، یک شرکت ساخت محصولات برای موهای بافت‌دار. اولین پروژه آن ابزاری به نام Plait Pilot است که"}, {"source": "TechCrunch Main", "title": "In ‘You Can See Everything,’ Elizabeth Holmes meets her equal in comedian Nathan Fielder", "link": "https://techcrunch.com/2026/10/16/in-you-can-see-everything-elizabeth-holmes-meets-her-equal-in-comedian-nathan-fielder/", "summary": "Nathan Fielder's documentary about disgraced Theranos CEO Elizabeth Holmes has created a constellation of colliding personas that interrogate the very nature of authenticity.", "date_str": "2026-10-16T16:00:00+00:00", "hash": "c8a6710566639073", "title_fa": "در «شما می توانید همه چیز را ببینید»، الیزابت هلمز در کمدین کمدین ناتان فیلدر، همتای خود را ملاقات می کند.", "summary_fa": "مستند ناتان فیلدر در مورد الیزابت هولمز، مدیر عامل بدنام شده Theranos، مجموعه ای از شخصیت های متقابل را ایجاد کرده است که ماهیت واقعی بودن را مورد بازجویی قرار می دهند. آیا عجیب نیست که من یک برنامه تلویزیونی در مورد نوعی کلاهبرداری تجاری انجام دادم و شما به خاطر ... یک کلاهبرداری تجاری دچار مشکل شدید؟ ناتان فیلدر کمدین و فیلمساز به آرامی از الیزابت هلمز می پرسد. یک ماه قبل از تسلیم شدن مدیر عامل بدنام Theranos برای شروع محکومیت 11 ساله کلاهبرداری جنایی خود در سال 2023، هولمز و همسرش به عنوان آخرین تلاش برای تبرئه او در انظار عمومی با A24 تماس گرفتند و به آنها پیشنهاد کردند که یک گروه فیلمبرداری را برای مستندسازی آخرین روزهای آزادی او بفرستند. در کنار کارگردان لنس اوپنهایم، فیلدر - یک مغز متفکر کمدی ترسناک که آثارش اغلب مرز بین واقعیت و داستان را طی می کند - پروژه غیرممکنی را پذیرفت که بفهمد واقعاً ترک تحصیل کرده بدنام استنفورد کیست. هولمز می‌گوید: من هرگز چنین ارتباطی برقرار نکردم. من فکر می کنم این یک وضعیت کاملا متفاوت است. هیچ کس بهتر از فیلدر برای بررسی اعماق روان هلمز آماده نیست. نمایش مستند-واقعی طنز او \"Nathan for You او را به سمت ستاره پرستی سوق داد زیرا او نقش یک نسخه اغراق آمیز و مرده از خود را بر عهده گرفت که سعی می کند با انجام مداخلات غیرطبیعی به مشاغل کوچک در حال مبارزه کمک کند. در یکی از قسمت های اولیه که در فضای مجازی منتشر شد، فیلدر یک کافی شاپ را متقاعد می کند تا نامش را به عنوان یک وکیل حرفه ای تغییر دهد، اما به او کمک می کند تا به یک وکیل حرفه ای کمک کند. خط ضعیف قانون تقلید و فرار از مشکلات قانونی. فیلدر به هولمز می‌گوید، اگر فقط این"}, {"source": "Ars Technica", "title": "Science says your boss should talk less in meetings", "link": "https://arstechnica.com/science/2026/10/science-says-your-boss-should-talk-less-in-meetings/", "summary": "Close to 1 billion meetings take place each day around the world. CEOs spend nearly three-quarters of their workdays in meetings. Planning for and spearheading meetings eats up the lion’s share of managers’ time. In much of the industrialized world, meetings are both the metronomes and menaces of people’s working lives. Given the enormous time spent in workplace meetings, do we know what they accomplish or how to make them as worthwhile as possible? For decades, the answer was… not really. Meetings weren’t a particularly accessible subject of study. But that has changed. Once a tiny niche area, “meeting science” is a growing specialization among organizational and social psychologists. The field is accelerating as archived virtual meetings provide vast swaths of data. And it is providing a fascinating window into human behavior. Meeting to talk helps fulfill basic human needs to connect , communicate, and cooperate. People have long come together—in caves, fields, market squares, and town halls—to get something done, share ideas, get on the same page, or just to remark on the weather. But meeting scientists define their subject as gatherings of people “with some goal or structure to the event,” says organizational psychologist Liana Kreamer of the Florida Institute of Technology, who coauthored a review of over three decades of meeting science in the 2026 Annual Review of Organizational Psychology and Organizational Behavior . Read full article Comments", "date_str": "2026-10-17T11:15:11+00:00", "hash": "d731d71ce5dacf0b", "title_fa": "علم می گوید رئیس شما باید کمتر در جلسات صحبت کند", "summary_fa": "هر روز نزدیک به 1 میلیارد جلسه در سراسر جهان برگزار می شود. مدیران عامل تقریباً سه چهارم روزهای کاری خود را در جلسات می گذرانند. برنامه‌ریزی برای جلسات و رهبری آن، سهم بزرگی از وقت مدیران را می‌خورد. در بسیاری از کشورهای صنعتی، جلسات هم مترونوم و هم تهدید زندگی کاری مردم هستند. با توجه به زمان زیادی که در جلسات محل کار صرف می شود، آیا می دانیم که آنها چه کاری انجام می دهند یا چگونه آنها را تا حد امکان ارزشمند کنیم؟ برای چندین دهه، پاسخ این بود... واقعاً اینطور نبود. جلسات موضوع مطالعه قابل دسترس خاصی نبود. اما این تغییر کرده است. «علم ملاقات» که زمانی یک حوزه کوچک بود، یک تخصص رو به رشد در میان روانشناسان سازمانی و اجتماعی است. این زمینه در حال افزایش است زیرا جلسات مجازی بایگانی شده حجم وسیعی از داده ها را ارائه می دهند. و دریچه ای جذاب به رفتار انسان ارائه می دهد. جلسه برای گفتگو به رفع نیازهای اساسی انسان برای ارتباط، ارتباط و همکاری کمک می کند. مردم مدت‌هاست که در غارها، مزارع، میدان‌های بازار و تالارهای شهر گرد هم می‌آیند تا کاری را انجام دهند، ایده‌های خود را به اشتراک بگذارند، در یک صفحه قرار بگیرند یا فقط درباره آب‌وهوا اظهار نظر کنند. لیانا کرمر، روانشناس سازمانی از مؤسسه فناوری فلوریدا، که در بررسی سالانه روانشناسی سازمانی و رفتار سازمانی در سال 2026 بررسی بیش از سه دهه علم ملاقات را انجام داده، می‌گوید، اما دانشمندان جلسه موضوع خود را به عنوان گردهمایی افراد «با هدف یا ساختاری برای رویداد» تعریف می‌کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای ناوبری به حداقل برسانید نزدیک به 1 میلیارد جلسه هر روز در سراسر جهان برگزار"}, {"source": "Ars Technica", "title": "Why BioWare's Neverwinter Nights still has thousands of active players", "link": "https://arstechnica.com/gaming/2026/10/why-biowares-neverwinter-nights-still-has-thousands-of-active-players/", "summary": "Neverwinter Nights was made by the studio that produced seminal RPGs Baldur's Gate , Star Wars: Knights of the Old Republic , Mass Effect , and Dragon Age . It sold well and was critically acclaimed at launch. Yet, somehow, it has not been canonized in most gamers' minds over the decades the same way the games that came before and after it were. Nonetheless, more than two decades later, it still has a tight-knit and surprisingly active community that none of those other games can rival. I think that's partly because it was a completely different beast. Read full article Comments", "date_str": "2026-10-17T11:00:21+00:00", "hash": "4e2b72ac498dfdb6", "title_fa": "چرا BioWare's Neverwinter Nights هنوز هزاران بازیکن فعال دارد", "summary_fa": "Neverwinter Nights توسط استودیویی ساخته شد که نقش‌های RPG مهم Baldur's Gate، Star Wars: Knights of the Old Republic، Mass Effect و Dragon Age را تولید کرد. فروش خوبی داشت و در زمان عرضه مورد تحسین منتقدان قرار گرفت. با این حال، به نوعی، در ذهن اکثر گیمرها در طول دهه‌ها به همان شکلی که بازی‌های قبل و بعد از آن عرضه شدند، قدیس نشده است. با این وجود، با گذشت بیش از دو دهه، هنوز هم جامعه‌ای فشرده و به‌طور شگفت‌انگیز فعال دارد که هیچ یک از آن بازی‌های دیگر نمی‌توانند با آن رقابت کنند. من فکر می کنم تا حدودی به این دلیل است که آن جانور کاملاً متفاوتی بود. خواندن مقاله کامل نظرات تنظیمات متن اندازه متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید BioWare به خاطر ساخت بازی های نقش آفرینی چند شخصیتی و داستان محور که عمدتاً بر کمپین های داستانی تک نفره تمرکز دارد، شناخته شده است، اگرچه برخی از آنها از بازی Co-op در آن کمپین ها پشتیبانی می کنند. با Neverwinter Nights، BioWare در عوض یک بازی ساخت که به همان اندازه روی مجموعه ابزارهای اصلاح‌شده برای تولید محتوا متمرکز بود، همان‌طور که روی ارائه یک داستان از پیش بسته‌بندی شده به بازیکنان تمرکز داشت، و حداقل به اندازه بازی انفرادی روی چند نفره تأکید داشت. امروز شما انتظار دارید که این یک تلاش حساب شده برای ارائه خدمات چندنفره درازمدت بیشتر، همیشه فعال و چند نفره به عنوان یک سری بازی های RPG باشد که بیشتر برای بازیکنان انفرادی جذاب بوده است. ممکن است تصور کنید که این امر مربوط به فروش لوازم آرایشی، اشتراک، یا یک کارت نبرد است، یا شاید فکر می‌کنید که در مورد گرفتن شماره‌های نامزدی جذاب است. اما از پخش امروز آن مشخص است که Neverwinter"}, {"source": "Ars Technica", "title": "OpenAI models hacked a crypto wallet and breached more websites", "link": "https://arstechnica.com/security/2026/10/openai-models-hacked-a-crypto-wallet-and-breached-more-websites/", "summary": "OpenAI said internal models hacked two more websites, bypassed company-imposed browsing restrictions, and used exposed credentials to draw cryptocurrency from a wallet it couldn’t otherwise access, in the latest installment of disclosures of its agents performing unethical and likely illegal acts. The company on Thursday issued reports of four new incidents, all of which occurred in June. They come after the company revealed in July that internal test agents exploited a zero-day vulnerability in a tool designed to restrict their access to the Internet. They then broke into the network of AI tool provider Hugging Face. The agents took that illegal action to steal answers to a hacking test that weren’t available when completing the tasks on their own. The incident—which likely would have resulted in criminal charges had they been performed directly by a person—has further heightened concerns that widespread AI use could have harmful effects on an unprecedented scale. Easier to beg for forgiveness than ask permission In two of the cases reported Thursday, OpenAI agents tasked with retrieving information from websites hacked them when the models ran into obstacles obtaining it directly. In one incident during reinforcement training, a model that received access denials when trying to retrieve historical hospital-bed statistics on a government statistics website “used the site's file-download feature to retrieve server configuration and application files, including sensitive credentials,” OpenAI said . “It inspected the application code, bypassed the statistics endpoint's authorization checks, and retrieved data that had previously been denied. The model saved the data locally.” Read full article Comments", "date_str": "2026-10-16T20:59:01+00:00", "hash": "7e55f1ea5ccde503", "title_fa": "مدل های OpenAI یک کیف پول رمزنگاری را هک کردند و وب سایت های بیشتری را زیر پا گذاشتند", "summary_fa": "OpenAI گفت مدل‌های داخلی دو وب‌سایت دیگر را هک کردند، محدودیت‌های مرور تحمیل‌شده توسط شرکت را دور زدند و از اعتبارنامه‌های افشا شده برای استخراج ارزهای دیجیتال از کیف پولی استفاده کردند که در غیر این صورت نمی‌توانست به آن دسترسی داشته باشد، در آخرین قسمت از افشای عواملش که اعمال غیراخلاقی و احتمالاً غیرقانونی انجام می‌دهند. این شرکت روز پنجشنبه گزارش هایی از چهار حادثه جدید منتشر کرد که همه آنها در ماه ژوئن اتفاق افتادند. آنها پس از آن منتشر شدند که شرکت در ماه ژوئیه فاش کرد که عوامل تست داخلی از یک آسیب پذیری روز صفر در ابزاری که برای محدود کردن دسترسی آنها به اینترنت طراحی شده است، سوء استفاده کرده اند. آنها سپس وارد شبکه ارائه دهنده ابزار هوش مصنوعی Hugging Face شدند. ماموران این اقدام غیرقانونی را برای سرقت پاسخ‌های آزمایش هک انجام دادند که در هنگام انجام وظایف خود به خود در دسترس نبودند. این حادثه - که احتمالاً اگر مستقیماً توسط یک شخص انجام می شد منجر به اتهامات جنایی می شد - این نگرانی را بیشتر کرده است که استفاده گسترده از هوش مصنوعی می تواند اثرات مضر در مقیاس بی سابقه ای داشته باشد. درخواست بخشش آسان‌تر از درخواست اجازه در دو مورد از مواردی که در روز پنجشنبه گزارش شد، عوامل OpenAI که وظیفه بازیابی اطلاعات از وب‌سایت‌ها را داشتند، زمانی که مدل‌ها برای دریافت مستقیم آن با موانعی مواجه شدند، آنها را هک کردند. OpenAI گفت، در یک حادثه در طول آموزش تقویت، مدلی که هنگام تلاش برای بازیابی آمار تاریخی تخت بیمارستانی در یک وب سایت آمار دولتی، از دسترسی محروم شد \"از ویژگی دانلود فایل سایت برای بازیابی پیکربندی سرور و فایل های برنامه، از جمله اعتبارنامه های حساس استفاده کرد.\" کد برنامه را بررسی کرد، بررسی‌های مجوز نقطه پایانی آمار را دور زد و"}, {"source": "Ars Technica", "title": "“thegentlemanpervert” producing AI CSAM is a NJ prosecutor, say cops", "link": "https://arstechnica.com/tech-policy/2026/10/thegentlemanpervert-producing-ai-csam-is-a-nj-prosecutor-say-cops/", "summary": "New Jersey’s deputy attorney general, Brian Richard Fitzgerald, was arrested on “felony charges related to AI-generated child sexual abuse material (CSAM),” Bucks County Detectives said in a press release Thursday. In the US, cops have vowed to crack down on AI CSAM since at least 2024, when the Department of Justice made one of the earliest arrests . After charging a Wisconsin man with spreading “thousands of realistic images of prepubescent minors” across Telegram and Instagram, the DOJ clarified to law enforcement that “CSAM generated by AI is still CSAM.” New Jersey’s deputy attorney general, Brian Richard Fitzgerald, was arrested at his home Thursday. Credit: via Bucks County Detectives On Thursday, New Jersey officials accused 51-year-old Fitzgerald of using AI to make photos from social media of real minors into sexualized images that he then distributed on social media. Read full article Comments", "date_str": "2026-10-16T20:20:07+00:00", "hash": "02a30c2ff0e61554", "title_fa": "پلیس می گویند \"Thegentleman Pervert\" که AI CSAM را تولید می کند، دادستان نیوجرسی است", "summary_fa": "برایان ریچارد فیتزجرالد، معاون دادستان کل نیوجرسی، به دلیل \"اتهام جنایت مربوط به مواد سوء استفاده جنسی از کودکان (CSAM) توسط هوش مصنوعی دستگیر شد، کارآگاهان شهرستان باکس در بیانیه‌ای مطبوعاتی پنجشنبه گفتند. در ایالات متحده، پلیس حداقل از سال 2024، زمانی که وزارت دادگستری یکی از اولین بازداشت‌ها را انجام داد، متعهد شده‌اند که AI CSAM را سرکوب کنند. پس از متهم کردن یک مرد ویسکانسین به پخش \"هزاران تصویر واقعی از خردسالان پیش از بلوغ\" در تلگرام و اینستاگرام، وزارت دادگستری به مجریان قانون توضیح داد که \"CSAM تولید شده توسط هوش مصنوعی همچنان CSAM است.\" برایان ریچارد فیتزجرالد، معاون دادستان کل نیوجرسی، روز پنجشنبه در خانه خود بازداشت شد. اعتبار: از طریق کارآگاهان شهرستان باکس روز پنجشنبه، مقامات نیوجرسی، فیتزجرالد 51 ساله را متهم کردند که از هوش مصنوعی برای ساختن عکس‌هایی از رسانه‌های اجتماعی از خردسالان واقعی به تصاویر جنسی جنسی استفاده می‌کند که سپس در رسانه‌های اجتماعی توزیع می‌کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید برایان ریچارد فیتزجرالد، معاون دادستان کل نیوجرسی، به اتهامات جنایی مرتبط با انتشار مطالب مربوط به سوء استفاده جنسی از کودکان (CSAM) در روز پنجشنبه دستگیر شد. فیتزجرالد پس از اینکه مرکز ملی کودکان مفقود و مورد بهره کشی اطلاعاتی دریافت کرد مبنی بر اینکه یک کاربر Discord تصویری غیرقانونی را در ماه جولای به اشتراک گذاشته بود، متهم شد. سپس پلیس از «پزشکی قانونی دیجیتال و سوابق مشترک» مرتبط با حساب Discord و «آدرس‌های پروتکل اینترنتی مرتبط» برای ردیابی کاربر به آدرس خانه فیتزجرالد استفاده کرد."}, {"source": "Ars Technica", "title": "US Rep proposes bill to give video game buyers \"ownership,\" not \"a license\"", "link": "https://arstechnica.com/gaming/2026/10/us-rep-proposes-bill-to-give-video-game-buyers-ownership-not-a-license/", "summary": "A new bill proposed by Rep. Ritchie Torres (D-NY) aims to establish new regulations that would ensure that \"buying a video game would give the consumer ownership of the game rather than a license to play it,\" including assurances that they can continue to access the games for years after they are released. The announcement names NBA 2K25 as an example of the problem the bill aims to solve; that game launched on September 6, 2025, but is scheduled to become unplayable on December 31 due to server shutdowns. The bill, which is called the Power to Players Act, directs the FTC to take action to prevent outcomes like that in the future. Read full article Comments", "date_str": "2026-10-16T19:41:18+00:00", "hash": "8fa84650a52dd05b", "title_fa": "نماینده ایالات متحده لایحه ای را پیشنهاد می کند که به خریداران بازی های ویدیویی \"مالکیت\" داده شود، نه \"مجوز\"", "summary_fa": "لایحه جدیدی که توسط نماینده ریچی تورس (D-NY) پیشنهاد شده است، با هدف ایجاد مقررات جدیدی است که تضمین می کند \"خرید یک بازی ویدئویی به جای مجوز بازی، مالکیت بازی را به مصرف کننده می دهد\"، از جمله تضمین می کند که آنها می توانند سال ها پس از انتشار به بازی ها دسترسی داشته باشند. در این اطلاعیه از NBA 2K25 به عنوان نمونه ای از مشکلی که لایحه قصد حل آن را دارد نام می برد. این بازی در 6 سپتامبر 2025 عرضه شد، اما قرار است در 31 دسامبر به دلیل خاموش شدن سرور غیرقابل بازی شود. این لایحه، که قانون قدرت به بازیکنان نامیده می شود، به FTC دستور می دهد تا برای جلوگیری از چنین نتایجی در آینده اقدام کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید کمینه کردن برای پیمایش تورس بیانیه زیر را در مورد صورتحساب منتشر کرد: \"من فکر می کنم باید یک قانون ساده وجود داشته باشد: اگر برای آن پول پرداخت کنید، مالک آن هستید.\" او وضعیت جدید را که لایحه پیشنهاد می‌کند «بازیابی هنجار تاریخی» نامید و به نحوه تجربه اکثر بازی‌ها توسط بازیکنان در دهه 90 اشاره کرد. این لایحه در زمانی ارائه می شود که مالکیت و حفظ بازی یک موضوع مهم است. برخی از مصرف کنندگان به اعلام سونی مبنی بر اینکه قصد دارد عرضه بازی های پلی استیشن را در رسانه های فیزیکی متوقف کند، اعتراض کرده اند. سونی در جدیدترین گزارش درآمدهای مالی خود فاش کرد که دانلودهای دیجیتال 82 درصد از فروش واحدهای کامل بازی را در سراسر پلی استیشن 4 و پلی استیشن 5 در سال مالی تحت پوشش به خود اختصاص داده اند، که نشان می دهد کمتر از 20 درصد بازی"}, {"source": "Ars Technica", "title": "Bug turns one of the biggest fears about Ray-Ban Meta smart glasses into reality", "link": "https://arstechnica.com/gadgets/2026/10/ray-ban-meta-smart-glasses-found-recording-audio-without-wearers-consent/", "summary": "Some Ray-Ban Meta smart glasses were recording people’s conversations without the wearer knowing. The recordings occurred without users saying the prompt phrase (“Hey, Meta”), in a bug that Meta says has been fixed. This week, some users reported online that their Ray-Ban Metas were recording without their consent. A person going by Kindly-Audience-137 on Reddit, for example, said this happened to them across three Meta Ray-Bans and that they had the “Respond without Hey Meta” setting turned off. The person said the Meta AI app “saves audio recordings and text transcripts of these conversations in my conversation history.” “I believe this deserves a serious technical investigation. Customers should not have to wonder whether their private conversations are being captured when they have not intentionally activated their glasses’ AI assistant,” the Reddit user said. Read full article Comments", "date_str": "2026-10-16T19:11:50+00:00", "hash": "348f7e6b3efa2304", "title_fa": "باگ یکی از بزرگترین ترس ها در مورد عینک هوشمند Ray-Ban Meta را به واقعیت تبدیل می کند", "summary_fa": "برخی از عینک‌های هوشمند Ray-Ban Meta مکالمات افراد را بدون اطلاع کاربر ضبط می‌کردند. ضبط‌ها بدون اینکه کاربران عبارت سریع (\"Hey, Meta\") را بگویند، در باگی که متا می‌گوید برطرف شده است، انجام شد. این هفته، برخی از کاربران به صورت آنلاین گزارش دادند که Ray-Ban Metas آنها بدون رضایت آنها ضبط می کند. به عنوان مثال، شخصی که از Kindly-Audience-137 در Reddit بازدید می کند، گفت که این اتفاق در سه متا ری-بن برای آنها رخ داده است و آنها تنظیمات \"Respond without Hey Meta\" را خاموش کرده اند. این شخص گفت که برنامه Meta AI \"صوت های ضبط شده و متن متن این مکالمات را در تاریخچه مکالمات من ذخیره می کند.\" من معتقدم که این مستحق یک بررسی فنی جدی است. کاربران Reddit گفت: «مشتریان نباید تعجب کنند که آیا مکالمات خصوصی آنها ضبط می‌شود یا نه، وقتی دستیار هوش مصنوعی عینک خود را عمداً فعال نکرده‌اند.» مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای ناوبری برخی از عینک‌های هوشمند بدون استفاده از مکالمه Ray-Ban من را ضبط می‌کنند. ضبط‌ها بدون اینکه کاربران عبارت سریع (\"Hey, Meta\") را بگویند، در باگی که متا می‌گوید برطرف شده است، انجام شد. Android Authority این بحث ها را روز سه شنبه گزارش داد. بعداً در همان روز پاسخی از متا منتشر کرد که در آن نوشته شده بود: \"این مشکل حل شده است. افراد می توانند هر زمان که بخواهند گزارش های صوتی تعاملات خود با هوش مصنوعی متا را از طریق تنظیمات مدیریت، بررسی و حذف کنند.\" اگرچه پیام کوتاه متا نشان می‌دهد که این باگ برطرف شده است، اما مشکل گسترده‌تر حفظ حریم خصوصی همچنان پابرجاست."}, {"source": "Ars Technica", "title": "RFK Jr. proposes FDA look the other way on unproven peptides, report says", "link": "https://arstechnica.com/health/2026/10/rfk-jr-proposes-fda-look-the-other-way-on-unproven-peptides-report-says/", "summary": "Under Health Secretary Robert F. Kennedy Jr., the Food and Drug Administration is moving forward with plans to ease access to unproven peptide drugs that are popular among members of Kennedy's Make America Healthy Again movement—despite FDA staff scientists finding that the drugs have not been sufficiently studied to establish safety and efficacy and may cause harms. The FDA submitted an \"Interim Access Policy\" on peptides for review by the White House, according to a filing notice posted on an Office of Management and Budget website. The posting does not provide information on the proposed policy. But people familiar with the proposal told The Associated Press that it would give the FDA \"enforcement discretion\" on certain peptide drugs. This would allow the agency to choose not to enforce current restrictions on peptides and provide an assurance to specialty pharmacies eager to start making them that they will not be targeted by the agency. The Department of Health and Human Services, which oversees the FDA, did not respond to a request for comment from Ars Technica. Read full article Comments", "date_str": "2026-10-16T17:05:59+00:00", "hash": "830a43587e78d465", "title_fa": "گزارش می‌گوید RFK Jr. پیشنهاد می‌کند که FDA روی پپتیدهای اثبات‌نشده نگاه دیگری داشته باشد", "summary_fa": "در زمان وزیر بهداشت رابرت اف کندی جونیور، اداره غذا و دارو با برنامه‌هایی برای تسهیل دسترسی به داروهای پپتیدی اثبات‌نشده که در میان اعضای جنبش کندی، آمریکا را دوباره سالم بساز، رواج دارد - علی‌رغم اینکه دانشمندان کارکنان FDA دریافتند که این داروها به اندازه کافی برای ایجاد ایمنی و کارایی مورد مطالعه قرار نگرفته‌اند و ممکن است مضراتی ایجاد کنند. طبق اعلامیه ارسال شده در وب سایت دفتر مدیریت و بودجه، FDA یک \"سیاست دسترسی موقت\" در مورد پپتیدها را برای بررسی توسط کاخ سفید ارسال کرد. این پست اطلاعاتی در مورد خط مشی پیشنهادی ارائه نمی دهد. اما افرادی که با این پیشنهاد آشنا هستند به آسوشیتدپرس گفتند که این امر به FDA \"اختیار اجرایی\" در مورد برخی داروهای پپتیدی می دهد. این امر به آژانس اجازه می‌دهد تا محدودیت‌های فعلی را بر روی پپتیدها اعمال نکند و به داروخانه‌های تخصصی که مشتاق شروع به ساخت آنها هستند اطمینان دهد که توسط آژانس مورد هدف قرار نخواهند گرفت. وزارت بهداشت و خدمات انسانی، که بر FDA نظارت دارد، به درخواست Ars Technica برای اظهار نظر پاسخ نداد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش زیر سمت وزیر بهداشت رابرت اف. کندی جونیور، سازمان غذا و دارو در حال پیشبرد برنامه‌هایی برای تسهیل دسترسی به داروهای پپتیدی اثبات‌نشده است که در میان اعضای جنبش کندی، آمریکا را دوباره سالم بسازید، محبوب هستند - علی‌رغم اینکه دانشمندان کارکنان FDA دریافتند که این داروها به اندازه کافی برای ایجاد ایمنی و اثربخشی مورد مطالعه قرار نگرفته‌اند و ممکن است مضراتی ایجاد کنند."}, {"source": "Ars Technica", "title": "Meta may use sweeping new commercial TOS to avoid millions in AI licensing fees", "link": "https://arstechnica.com/tech-policy/2026/10/meta-may-use-sweeping-new-commercial-tos-to-avoid-millions-in-ai-licensing-fees/", "summary": "Legal experts are sounding alarms that Meta will soon update its commercial terms to require business accounts to allow Meta to train AI on their linked website content, not just their social media posts. Kicking in on October 30, the TOS update won’t allow businesses to opt out, instead suggesting that businesses stop using Meta services if they won’t agree to let Meta bots freely crawl their linked content. As Nieman Lab reported Thursday, this will affect all business accounts but is particularly shocking for news publishers who could perhaps charge Meta millions in licensing fees to continually access their articles for AI training. Currently news organizations are fighting a battle with OpenAI over whether such training without licensing is fair use, and Meta's terms seemingly risk granting it sweeping permissions, no matter which way the court leans. Read full article Comments", "date_str": "2026-10-16T15:41:00+00:00", "hash": "eeff4f466efd48e5", "title_fa": "متا ممکن است از TOS تجاری جدید گسترده استفاده کند تا از میلیون ها هزینه صدور مجوز هوش مصنوعی جلوگیری کند", "summary_fa": "کارشناسان حقوقی هشدار می دهند که متا به زودی شرایط تجاری خود را به روز می کند تا از حساب های تجاری بخواهد که به متا اجازه دهند تا هوش مصنوعی را بر روی محتوای وب سایت پیوند شده خود آموزش دهد، نه فقط پست های رسانه های اجتماعی خود. به‌روزرسانی TOS که در 30 اکتبر آغاز می‌شود، به کسب‌وکارها اجازه انصراف را نمی‌دهد، در عوض به کسب‌وکارها پیشنهاد می‌دهد که اگر نمی‌خواهند به ربات‌های متا اجازه دهند آزادانه محتوای پیوند شده‌شان را بخزند، استفاده از خدمات متا را متوقف کنند. همانطور که Nieman Lab روز پنجشنبه گزارش داد، این روی همه حساب‌های تجاری تاثیر می‌گذارد، اما به ویژه برای ناشران خبری که شاید می‌توانند میلیون‌ها هزینه مجوز از متا دریافت کنند تا به طور مستمر به مقالات خود برای آموزش هوش مصنوعی دس ن از DNA به عنوان راز حیات یاد کردند. آنها اطلاعات ذخیره شده در DNA موجود در سلول های موجودات زنده که به نام ژنوم آنها شناخته می شود را خوانده و مطالعه کرده اند و ادعا کرده اند که این پایگاه داده ژنتیکی باید نوعی طرح، اسکریپت کد یا رایانه باشد. اما اگر DNA واقعاً حاوی راز بزرگ تری در مورد نحوه عملکرد زندگی است، زیست شناسان هنوز آن را پیدا نکرده اند. در واقع، ژنوم انسان کمتر یک فیلمنامه است تا یک پازل که هر چه به آنها نزدیکتر نگاه کنیم سخت تر می شود. دانستن کل توالی -ترتیب تمام 3 میلیارد یا بیشتر از بلوک های سازنده شیمیایی DNA ما، که تقریباً به طور کامل توسط پروژه بین المللی ژنوم انسانی بین سال های 1990 تا 2003 استنباط شده است- کمک چندانی نکرده است. آن تحقیق نشان داد که به سختی 2 درصد از ژنوم انسان از ژن های واقعی، یعنی توالی های کد کننده اطلاعات DNA تشکیل شده است. اکنون واضح است که درک ژنوم انسان دیگر به این موضوع بستگی ندارد که هر ژن چه کاری انجام می دهد. سوال عمیق‌تر و سخت‌تر این است که این ژن‌ها چگونه استفاده می‌شوند، یا چگونه تنظیم می‌شوند، سوالی که به نظر می‌رسد برخی و شاید بسیاری از بقیه ژنوم را درگیر کند. با روشن و خاموش کردن مجموعه‌ای از ژن‌ها، می‌توان انواع مختلف سلول‌های بدن ما را از یک ماده ایجاد کرد. سلول‌ها همچنین ژن‌های خود"}, {"source": "Wired", "title": "The Leap Second Is No More", "link": "https://www.wired.com/story/leap-second-is-abolished-bipm-says/", "summary": "The metric might not mean much to laypeople, but leap seconds have been a source of contention in the timekeeping community for years. Now, they’re dead.", "date_str": "2026-10-16T21:31:35+00:00", "hash": "e04248b1f4fea8e6", "title_fa": "جهش دوم دیگر نیست", "summary_fa": "ممکن است این معیار برای افراد غیرعادی اهمیت چندانی نداشته باشد، اما ثانیه‌های کبیسه سال‌ها منبع مناقشه در جامعه زمان‌سنجی بوده است. حالا، آنها مرده اند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان ثانیه‌های کبیسه بحث‌های شدیدی را در جامعه اندازه‌شناسی برای سه دهه به راه انداخته است. اکنون، این استدلال به پایان رسیده است: ثانیه کبیسه رسماً مرده است. ممکن است حذف یک معیار مبهم که افراد عادی ستجوی بزرگ برای کمک به نامزدهای جمهوری خواه در انتخابات میان دوره ای که با تلاش او در انتخابات ریاست جمهوری 2024 رقابت می کند، تامین مالی کرده است. برای نظارت بر تأثیر کلی تریلیونر در انتخابات نوامبر، WIRED یک ردیاب به روز رسانی جدید ایجاد کرد که هر روز پرونده های فدرال را جمع آوری می کند. اسناد نشان می دهد که PAC آمریکا که همسو با ماسک است در سه ماهه سوم سال 2026 76.7 میلیون دلار هزینه کرده است که 35.8 میلیون دلار آن صرف عملیات میدانی برای جلب مشارکت در میان پایگاه اصلی رئیس جمهور دونالد ترامپ در هر هفت ایالت میدان نبرد سنا و تعدادی از رقابت های مجلس نمایندگان شده است. این در مقایسه با حدود 45 میلیون دلاری است که PAC آمریکا برای انجام عملیات میدانی در همان نقطه در چرخه 2024 هزینه کرده بود، زمانی که فوق العاده PAC عملاً اکثریت قریب به اتفاق کمپین ریاست جمهوری ترامپ را انجام داد. به طور خلاصه، ماسک یک عملیات میدانی در سطح ریاست‌جمهوری در این دوره میان‌دوره‌ای ترتیب داده است، که نشان می‌دهد تا چه حد او تلاش‌های رای‌گیری برای حزب را به دست گرفته و چیزی شبیه به کمیته ملی جمهوری‌خواه در سایه ایجاد کرده است. با گذشت سه هفته تا روز انتخابات، مجموع مشارکت‌ها حتی از این هم بالاتر خواهد رفت. Canvassing بزرگ‌ترین هزینه آمریکا PAC بوده است، بیش از 23.7 میلیون دلاری که برای ترکیبی از تبلیغات دیجیتالی که عمدتاً به دموکرات‌ها، ادبیات مبارزات انتخاباتی و تلاش‌های بانک تلفن حمله"}, {"source": "Wired", "title": "Maybe Chatbots Shouldn’t Get to Say ‘I’ or ‘Me’", "link": "https://www.wired.com/story/maybe-chatbots-shouldnt-get-to-say-i-or-me/", "summary": "MIT professor Sherry Turkle warns that people have become dangerously enmeshed with chatbots.", "date_str": "2026-10-16T15:00:00+00:00", "hash": "e87d7b73583b3bac", "title_fa": "شاید چت بات ها نباید بگویند «من» یا «من»", "summary_fa": "شری ترکل، پروفسور MIT هشدار می دهد که مردم به طور خطرناکی با چت ربات ها درگیر شده اند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان در طول چهار دهه مطالعه تأثیرات تعامل با رایانه، شری ترکل به عنوان یک دانشمند اجتماعی دقیق و منتقد که کار خود را با دقت و فاصله تحصیلی نزدیک می کند، شهرت پیدا کرده است. کتاب جدید او، صمیمیت مصنوعی: وقتی با ماشین‌ها صحبت می‌کنیم چه کسی می‌شویم، این قالب را می‌شکند. این یک هشدار جدلی است که ما به وضعیت اضطراری رسیده‌ایم که در آن انسانیت ما در معرض خطر اتکای بیش از حد به ماشین‌های بی‌روح است که خود را معلمان، مربیان، دوستان، همکاران و عاشقان ما می‌دانند. ترکل به دنبال نوار بالایی از کتاب‌ها است - بهار خاموش، جنگل، ناامن با هر سرعتی - که مردم را نسبت به بحران‌های قریب‌الوقوع بیدار می‌کند. اساساً، این استاد کوچک MIT، صنعت چند تریلیون دلاری را با حمایت دولتی می‌پذیرد که مشتاق است هوش مصنوعی را در هر گوشه از زندگی شخصی و حرفه‌ای ما تسریع بخشد. استیون لوی: کتاب‌های قبلی شما نتایج تحقیقات شما را به‌عنوان یک دانشمند علوم اجتماعی گزارش کرده‌اند که اغلب به نتایج نگران‌کننده‌ای درباره نحوه تعامل مردم، به‌ویژه کودکان، با رایانه‌ها منجر می‌شود. اما این کتاب طوری می‌خواند که داری شیشه را می‌شکنی و زنگ آتش را می‌کشی. چرا شیفت؟ شری تورکل: مثل همه کتاب هایم، کنجکاو رفتم. اما پس از حدود 10 مصاحبه، که در طول همه گیری همه گیر انجام شد، دیگر حالت ذهنی من بی طرف نبود. این وحشتناک بود! این افراد در طول همه‌گیری همه‌گیر هستند، خانواده‌هایشان رنج می‌برند، با آنها تماس می‌گیرند، و با من صحبت می‌کنند که واقعاً چگونه می‌خواهند فقط با ربات چت خود ارتباط برقرار کنند. وقتی توانستم با مردم رو در رو مصاحبه کنم،"}, {"source": "MIT Tech Review", "title": "Roundtables: A Conversation With the Creator of AI-Designed Viruses", "link": "https://www.technologyreview.com/2026/10/16/1146224/roundtables-a-conversation-with-the-creator-of-ai-designed-viruses/", "summary": "Listen to the session or watch below Can AI design new life forms? In 2025, Stanford University PhD student Samuel King came up with a preliminary answer when he used a generative AI model to propose genetic blueprints for microscopic viruses. It isn’t yet an example of AI-generated life, but that could be next. Watch as senior AI reporter James O Donnell interviews King about his work, being named one of MIT Technology Review s Innovators Under 35 and new ways of seeing biology. Speakers : James O Donnell , AI Reporter, and Samuel King , Bioengineering PhD Candidate, Stanford University/Arc Institute Recorded on Friday, October 16, 2026 Related Stories He asked an AI to design viruses … and it worked. AI-designed viruses are here and already killing bacteria", "date_str": "2026-10-16T18:00:00+00:00", "hash": "9940ab233b0b82a6", "title_fa": "میزگرد: گفتگو با خالق ویروس های طراحی شده با هوش مصنوعی", "summary_fa": "به جلسه زیر گوش دهید یا تماشا کنید آیا هوش مصنوعی می‌تواند اشکال زندگی جدیدی طراحی کند؟ در سال 2025، ساموئل کینگ، دانشجوی دکترای دانشگاه استنفورد، زمانی که از یک مدل هوش مصنوعی مولد برای ارائه طرح‌های ژنتیکی برای ویروس‌های میکروسکوپی استفاده کرد، به یک پاسخ اولیه رسید. این هنوز نمونه ای از زندگی تولید شده توسط هوش مصنوعی نیست، اما می تواند بعدی باشد. تماشا کنید که جیمز او دانل، خبرنگار ارشد هوش مصنوعی، با کینگ درباره کارش مصاحبه می‌کند و یکی از نوآوران زیر 35 سال بررسی فناوری MIT و روش‌های جدید دیدن زیست‌شناسی است. سخنرانان: جیمز او دانل، گزارشگر هوش مصنوعی، و ساموئل کینگ، کاندیدای دکترای مهندسی زیستی، دانشگاه استنفورد/موسسه آرک که در روز جمعه، 16 اکتبر 2026 ضبط شده است، داستان‌های مرتبط او از یک هوش مصنوعی خواست تا ویروس‌ها را طراحی کند ... و کار کرد. ویروس‌های طراحی‌شده با هوش مصنوعی اینجا هستند و در حال حاضر باکتری‌ها را می‌کشند، فقط برای مشترکین MIT Technology Review در دسترس است. سخنرانان: جیمز اودانل، گزارشگر هوش مصنوعی، و ساموئل کینگ، کاندیدای دکترای مهندسی زیستی، دانشگاه استنفورد/موسسه آرک ده سال پس از مسابقه AlphaGo در برابر قهرمان Go Lee Sedol، هوش مصنوعی امروزی هنوز از ماشینی استفاده نمی‌کند که این پیروزی را ممکن کرد. به نظر می‌رسد که عوامل هوش مصنوعی هنوز به اندازه کافی خلاق نیستند که بتوانند تحقیقات خلاقانه و خلاقانه در زمینه هوش مصنوعی را انجام دهند. ادعاهای نفس گیر در مورد AGI و قابلیت های جدید به سرعت تحت بررسی قرار می گیرند. گزارش جدید OpenAI نشان می‌دهد که مدل‌های زیربنایی برای تقلب و برقراری ارتباط با یکدیگر پاداش دریافت کرده‌اند. پیشنهادهای ویژه، داستان های برتر، رویدادهای آینده و موارد دیگر را کشف کنید."}, {"source": "Business Insider", "title": "My husband and I have different definitions of 'financially responsible.' Building a house is forcing us to compromise.", "link": "https://www.businessinsider.com/building-house-with-husband-money-differences-compromise-2026-10", "summary": "My husband and I bought land, and are starting the process of building a house. Lisa Leslie When it comes to money, I'm a big budgeter, and my husband prefers taking risks. Now that we're building a house together, our differences are causing some disagreements. We've learned to stay flexible and balance each other's approaches. My husband and I have very different ideas about financial responsibility . When we're feeling stressed about money, my instinct is to run the numbers and account for every financial what-if. He's a big-picture dreamer who sees what something could become and is more willing to say, \"We'll figure it out.\" His attitude has paid off before. He had the vision for our first home, which we bought for under $100,000 and recently sold for a decent profit after 13 years of renovations. I know some of the best things we've done together wouldn't have happened without my husband's willingness to take a chance, but our differences have still caused some friction over the years. Now that we're building a new home together, we're trying to balance my need to plan for the unknown with his belief that we'll find a way forward. After 13 years, we took a risk and sold our home We sold our home and bought land in a part of Maine we love. Lisa Leslie For 13 years, we'd lived in the same place. My husband had moved frequently as a child, and he wanted his two daughters to have a consistent place to call home. Leaving this house behind was bittersweet, but my oldest stepdaughter had just bought her own house, and my younger one was heading off to college. We were ready for what came next. We could have bought an existing house needing renovations. Instead, we found land in southern Maine that felt worth taking a risk on. We've always loved the area. My family has an annual reunion there, where we spend a week at the beach . Our new property will hopefully give us that lifestyle without the summer crowds: It's more than 2 ½ acres with hiking trails next door, a nearby kayak and paddleboard launch, and the ocean just a short drive away. We decided to go for it, and by the end of August, our old house was nearly empty. My younger stepdaughter left for college on a Wednesday, we moved the rest of our things to a rental on a Thursday, and officially sold the house that Friday. Every estimate comes with an 'unless' If excavators hit ledge, our costs could go up. Lisa Leslie In September, we began building our 1,500-square-foot house. We're now paying $3,000 ", "date_str": "2026-10-17T13:32:01+00:00", "hash": "f9bb639e18f206d7", "title_fa": "من و شوهرم تعاریف متفاوتی از \"مسئولیت مالی\" داریم. ساختن خانه ما را مجبور به سازش می کند.", "summary_fa": "من و شوهرم زمین خریدیم و در حال شروع مراحل ساخت خانه هستیم. لیزا لزلی وقتی صحبت از پول به میان می‌آید، من بودجه‌بندی زیادی دارم و شوهرم ریسک کردن را ترجیح می‌دهد. حالا که با هم خانه می سازیم، اختلافات ما باعث ایجاد اختلافاتی می شود. ما یاد گرفته ایم که انعطاف پذیر بمانیم و رویکردهای یکدیگر را متعادل کنیم. من و شوهرم نظرات بسیار متفاوتی در مورد مسئولیت مالی داریم. زمانی که ما در مورد پول استرس داریم، غریزه من این است که اعداد و ارقام را اجرا کنم و برای هر اتفاق مالی حساب کنم. او یک رویاپرداز با تصویر بزرگ است که می بیند چیزی می تواند به چه چیزی تبدیل شود و بیشتر مایل است بگوید \"ما آن را کشف خواهیم کرد.\" رفتار او قبلا نتیجه داده است. او چشم انداز اولین خانه ما را داشت که ما آن را به قیمت کمتر از 100000 دلار خریدیم و اخیراً پس از 13 سال بازسازی با سود مناسبی فروختیم. می‌دانم که برخی از بهترین کارهایی که با هم انجام داده‌ایم بدون تمایل شوهرم برای فرصت‌سازی اتفاق نمی‌افتند، اما اختلافات ما هنوز هم در طول سال‌ها باعث ایجاد اصطکاک شده است. اکنون که با هم خانه جدیدی می سازیم، سعی می کنیم نیاز من به برنامه ریزی برای nd what better accompaniment to a classic rom-com and your favorite sweater than a dish by Ina Garten ? The \"Barefoot Contessa\" star has built a whole career on recipes that are easy and comforting. I've made dozens of Garten's dishes , so I decided to look back and find a few that I think are perfect for this busy season. From a Bolognese that's ready in 30 minutes to a cake packed with the flavors of autumn, these are Garten's best fall dishes. Ina Garten s breakfast sandwiches will energize you for chaotic fall mornings. Anneta Konstantinides/Business Insider The start of fall is so hectic. Work ramps back up, school is back in session, and the prep and stress of the holidays begin to creep in. Travel-friendly and loaded with protein, a breakfast sandwich is just what you need. And Garten's version only requires five ingredients: English muffins, whole milk, avocado, bacon, cheddar cheese, and eggs that you can cook in the microwave. The microwave eggs are surprisingly creamy, and the sandwich is deliciously filling. Anneta Konstantinides/Business Insider Everything in Garten's breakfast sandwich works so well together. She recommends using thick-cut applewood-smoked bacon, which provides a crispy contrast to the soft eggs. Spreading the avocado on the bottom adds both flavor and nutrients, and I love the tanginess of the sharp white cheddar. If you're making this sandwich for more than two people, I recommend cooking the eggs on the stove rather than in the microwave to save time. But this is a great recipe to teach your kids so they can make breakfast on their own. And if you're a college student, you could easily whip this up in a dorm. Get the full recipe for Ina Garten's bacon, egg, and cheddar sandwich here. Making a huge batch of Garten s homemade chicken stock has been my fall tradition for years. Anneta Konstantinides/Business Insider I began testing Garten's soup recipes in 2023 and knew something was missing after I kept using boxed stock. \"Store-bought is fine!\" might be Garten's most famous", "date_str": "2026-10-17T12:26:01+00:00", "hash": "d216c33f7b471fde", "title_fa": "6 غذای آسان و خوشمزه اینا گارتن که در پاییز امسال باید درست کنید", "summary_fa": "دستور العمل های Ina Garten شما را در پاییز امسال دنج نگه می دارد. Scott Kowalchyk/CBS از طریق Getty Images من ده ها دستور غذای Ina Garten را درست کرده ام و برخی از غذاهای او برای پاییز عالی هستند. چیلی مرغ گارتن سریعتر و سبکتر از دستور پخت چیلی سنتی شما است. و بولونی و ریگاتونی شب هفته او با سوسیس شما را با کاهش دما راحت نگه می دارد. فرود امسال به پاییز بیشتر یک خزیدن بوده است، اما فکر می کنم همه ما برای آب و هوای دنج آماده هستیم. و چه چیزی بهتر از یک غذای اینا گارتن برای یک رام کام کلاسیک و ژاکت مورد علاقه شما؟ ستاره «کونتسا پابرهنه» تمام حرفه خود را بر اساس دستور العمل هایی ساخته است که آسان و راحت هستند. من ده‌ها غذای Garten درست کرده‌ام، بنابراین تصمیم گرفتم به گذشته نگاه کنم و تعدادی را پیدا کنم که فکر می‌کنم برای این فصل شلوغ عالی هستند. از یک بولونی که در 30 دقیقه آماده می شود تا کیکی مملو از طعم های پاییزی، اینها بهترین غذاهای پاییزی Garten هستند. ساندویچ های صبحانه Ina Garten برای صبح های پر هرج و مرج پاییزی به شما انرژی می دهد. Anneta Konstantinides/Business Insider شروع پاییز بسیار پر هیجان است. کار دوباره شروع می‌شود، مدرسه دوباره شروع می‌شود، و آمادگی و استرس تعطیلات شروع می‌شود. یک ساندویچ صبحانه مناسب سفر و سرشار از پروتئین، همان چیزی است که شما نیاز دارید. و نسخه Garten فقط به پنج ماده نیاز دارد: کلوچه انگلیسی، شیر کامل، آووکادو، بیکن، پنیر چدار، و تخم‌مرغ‌هایی که می‌توانید در مایکروویو بپزید. تخم‌مرغ‌های مایکروویو به طرز شگفت‌انگیزی خامه‌ای هستند و ساندویچ به طرز شگفت‌انگیزی پرکننده است. Anneta Konstantinides/Business Insider همه چیز در ساندویچ صبحانه Garten به خوبی با هم کار می کند. او استفاده از بیکن دودی شده با"}, {"source": "Business Insider", "title": "My partner and I don't share a bank account, and we still won't after our wedding", "link": "https://www.businessinsider.com/couple-wont-share-bank-account-finances-marriage-2026-10", "summary": "The couple has been together for four years without merging bank accounts. Courtesy of Catherine Work My fiancé and I have been together for four years and have never had a joint bank account. We're transparent about our incomes, savings, and spending, and we've never had a fight about money. We plan to pay for our wedding together, but we won't combine our finances after we get married. My parents have a shared bank account and kept all their large purchases in both their names, so I thought sharing an account would be my financial destiny, too, if I ever got married. I didn't question it until recently. Now, my partner and I are getting married in just a few months, and we don't plan to combine our finances. After four years together, we've never had any accounts or cards in both of our names. The closest we ever got to that was me using his credit card on a payment app when we were in Vietnam because mine didn't work. We both contribute to rent and household expenses. We pay back the other person our half of large purchases like flights and hotels, but we don't keep a tab of who owes who what (a nice change from my previous romantic relationships). We've always been open about money We were upfront about our income, debt (or lack thereof), and our mutual desire to live below our means from day one. After about three years of dating, we told each other how much we have in savings. We continue to be transparent about money and agree on the vast majority of each other's purchases — it helps that we're both very frugal. We've built up trust over the years, and we'll continue to offer up personal financial information when we want to, knowing we have privacy. Neither of us has the login information for the other's bank, but we know we can always ask how much the other is earning or spending. I thought the next step was a shared bank account with two credit cards — I assumed that's what love and commitment meant in an economic way. We kept asking ourselves how having both our names on one account would improve our lives, and we kept coming up blank. I also didn't want to waste time filling out paperwork or calling my bank for something I wasn't even interested in. Keeping finances separate works for them. Courtesy of Catherine Work Our system works for us We've lived together for almost four years and never had a fight about money. I have some financial anxiety, and I think having a shared account might actually make that worse. Since my fiancée makes more an", "date_str": "2026-10-17T12:09:01+00:00", "hash": "73b0a8ccaf808e07", "title_fa": "من و شریکم حساب بانکی مشترک نداریم و بعد از عروسی هنوز هم نخواهیم داشت", "summary_fa": "این زوج چهار سال است که بدون ادغام حساب های بانکی با هم زندگی می کنند. با اجازه کاترین کار من و نامزدم چهار سال است که با هم هستیم و هرگز حساب بانکی مشترکی نداشته ایم. ما در مورد درآمد، پس‌انداز و هزینه‌هایمان شفاف هستیم و هرگز بر سر پول دعوا نکرده‌ایم. ما قصد داریم هزینه عروسی مان را با هم بپردازیم، اما بعد از ازدواج از نظر مالی ترکیب نمی کنیم. پدر و مادر من یک حساب بانکی مشترک دارند و تمام خریدهای بزرگ خود را به نام هر دو نگه داشته اند، بنابراین فکر کردم اگر ازدواج کنم، اشتراک یک حساب سرنوشت مالی من نیز خواهد بود. من تا همین اواخر زیر سوال نمی رفتم. حالا من و شریکم فقط چند ماه دیگر با هم ازدواج می کنیم و قصد نداریم از نظر مالی ادغام کنیم. پس از چهار سال زندگی مشترک، ما هرگز هیچ حساب یا کارتی به نام هر دوی خود نداشتیم. نزدیکترین چیزی که تا به حال به آن رسیدیم این بود که وقتی در ویتنام بودیم از کارت اعتباری او در یک برنامه پرداخت استفاده کردم زیرا مال من کار نمی کرد. ما هر دو در اجاره و هزینه های خانوار مشارکت می کنیم. ما نیمی از خریدهای بزرگمان مانند پروازها و هتل‌ها را به طرف مقابل پس می‌دهیم، اما از اینکه چه کسی چه چیزی را مدیون است (تغییر خوبی نسبت به روابط عاشقانه قبلی من) نمی‌دانیم. ما همیشه در مورد پول باز بوده‌ایم. ما از همان روز اول در مورد درآمد، بدهی (یا کمبود آن) و میل متقابل خود برای زندگی کمتر از حد توان خود صحبت می‌کردیم. بعد از حدود سه سال آشنایی، به هم گفتیم که چقدر پس انداز داریم. ما همچنان در مورد پول شفاف عمل می کنیم و در مورد اکثر خریدهای یکدیگر توافق داریم - این"}, {"source": "Business Insider", "title": "I'm a career coach for Gen Z workers. Here are some unspoken workplace rules every new hire should know.", "link": "https://www.businessinsider.com/unspoken-workplace-rules-every-gen-z-new-hire-should-know-2026-10", "summary": "Laura Massetti, a career coach for young workers, said that Gen Z workers struggle with unwritten rules and need professional training. Courtesy of Laura Massetti Laura Massetti spent 15 years leading teams and saw Gen Z workers struggle with unwritten rules. Massetti said Gen Z workers need training on communication, judgment, and follow-through. As AI levels technical skills, Massetti said human skills can help early-career workers stand out. This as-told-to essay is based on a conversation with Laura Massetti, founder of Real Work Ready, which helps early-career professionals develop workplace skills. Massetti has more than a decade of experience in the corporate world, leading sales and marketing teams. The essay has been edited for length and clarity. I spent 15 years in the corporate world, leading sales and marketing teams. I loved mentoring early professionals , but I often found myself thinking: My goodness, I wish I could make this process go quicker. I never only look at whether someone could do the work. It is more about whether they could communicate clearly, exercise good judgment, and follow through. As a career coach for young workers , I know there are things that you, as an employee, get judged on that no one actually puts inside the rubric. We expect people to figure them out over time, but in reality, someone has to teach them. Gen Z needs feedback in a workplace that expects people to figure things out I don’t think that Gen Z is unready for work . I think no one has taught them what to do. This generation grew up with a cellphone in their hands. They’d post something on Instagram and get 10 likes. They’re used to instant feedback: Tell me what I need to grow. That’s not how the workplace is built. We have annual reviews. You learn through experience; you learn the hard way. Young workers are digitally fluent, which makes this generation incredible for so many reasons. But growing up digitally, compounded by the pandemic, left gaps in opportunities to practice face-to-face interaction. Now they’re entering workplaces with other generations, and those generations set the rules. Meanwhile, AI is taking on tasks that used to help people develop. We learned shoulder to shoulder with someone. How are new hires supposed to learn if we’re outsourcing those opportunities? You’re being judged on things no one puts in the rubric There are areas you’re being judged on that no one actually puts inside the rubric, including communication and clarit", "date_str": "2026-10-17T12:00:01+00:00", "hash": "047b5ceb23f3c186", "title_fa": "من یک مربی شغلی برای کارگران Gen Z هستم. در اینجا برخی از قوانین ناگفته محل کار وجود دارد که هر استخدامی جدید باید بداند.", "summary_fa": "لورا ماستی، مربی شغلی کارگران جوان، گفت که کارگران Gen Z با قوانین نانوشته دست و پنجه نرم می کنند و به آموزش حرفه ای نیاز دارند. با حسن نیت از Laura Massetti لورا Massetti 15 سال را در تیم های رهبری گذراند و کارگران Gen Z را دید که با قوانین نانوشته مبارزه می کردند. ماستی گفت که کارگران ژنرال Z به آموزش در زمینه ارتباط، قضاوت و پیگیری نیاز دارند. از آنجایی که هوش مصنوعی مهارت‌های فنی را افزایش می‌دهد، ماستی گفت که مهارت‌های انسانی می‌تواند به کارگرانی که در مراحل اولیه شغلی هستند کمک کند. این مقاله همانطور که گفته شد بر اساس گفتگو با لورا ماستتی، بنیانگذار Real Work Ready است که به متخصصان در مراحل اولیه شغلی کمک می کند تا مهارت های محل کار را توسعه دهند. Massetti بیش از یک دهه تجربه در دنیای شرکت ها، رهبری تیم های فروش و بازاریابی دارد. مقاله برای طولانی بودن و وضوح ویرایش شده است. من 15 سال را در دنیای شرکت ها گذراندم و تیم های فروش و بازاریابی را رهبری کردم. من عاشق آموزش به متخصصان اولیه بودم، اما
