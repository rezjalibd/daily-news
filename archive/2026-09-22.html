 نوری چالش‌برانگیز همچون عکاسی پرتره‌ی ضد نور یا لحظات غروب آفتاب کارایی شگفت‌انگیزی دارد. این حسگر ۵۰ مگاپیکسلی در کنار لنز اولترا داینامیک زایس، سامانه‌ی ارتقایافته‌ی VCS 4.0، پوشش اختصاصی *Zeiss T و شیشه‌ی آبی با جذب عمیق نور قرار گرفته است. ترکیب دوربین‌های Vivo X500 Pro شامل موارد زیر است: وظیفه‌ی تأمین انرژی این گوشی بر دوش یک باتری ۶٬۵۱۰ میلی‌آمپرساعتی قرار دارد که از فناوری شارژ سیمی ۹۰ وات و شارژ بی‌سیم ۴۰ وات پشتیبانی می‌کند."}, {"source": "Zoomit", "title": "این پهپاد بمب‌افکن اهدافش را بدون دخالت انسان انتخاب می‌کند؛ هوش مصنوعی در خدمت صنایع نظامی", "link": "https://www.zoomit.ir/ai-articles/467559-autonomous-ai-kamikaze-drone-demo/", "summary": "استارتاپ سوئدی اسکیل‌اوت سیستمز با موفقیت پرواز و حمله‌ی کاملا خودمختار یک پهپاد انتحاری را با پردازش هوش مصنوعی آفلاین به‌نمایش گذاشت.", "date_str": "2026-09-21T14:50:00+00:00", "hash": "0e2bb07e6fc718ae", "title_fa": "این پهپاد بمب‌افکن اهدافش را بدون دخالت انسان انتخاب می‌کند؛ هوش مصنوعی در خدمت صنایع نظامی", "summary_fa": "استارتاپ سوئدی اسکیل‌اوت سیستمز با موفقیت پرواز و حمله‌ی کاملا خودمختار یک پهپاد انتحاری را با پردازش هوش مصنوعی آفلاین به‌نمایش گذاشت. تبلیغات استارتاپ سوئدی Scaleout Systems در آزمایشی میدانی نشان داد که پهپادهای مجهز به مدل‌های کوچک بینایی ماشین می‌توانند بدون نیاز به ارتباط مخابراتی، اهداف نظامی را به‌طور خودکار شناسایی کنند و مورد حمله قرار دهند. در این آزمایش که بخشی از برنامه‌ی Affordable Loitering Modular Ammunition با نام اختصاری ALMA است، از مهمات شرکت BAE Systems Bofors برای انهدام هدف استفاده شد. پهپاد مورد استفاده در رزمایش زمستانی ۲۰۲۶ پس از شناسایی و موقعیت‌یابی اهداف، یک خودروی مهندسی زرهی را در بالاترین اولویت حمله قرار داد، به‌سمت آن پرواز کرد و محموله‌ی انفجاری خود را روی آن انداخت. به‌جز فشردن دکمه‌ی آغاز عملیات، دخالت انسانی به حالت پشتیبان و نظارتی محدود بود تمامی فرآیندهای پردازشی به‌صورت محلی روی برد پهپاد انجام شد و به‌جز فشردن دکمه‌ی آغاز عملیات، دخالت انسانی به حالت پشتیبان و نظارتی محدود بود. کل ماموریت شامل ۲۰۰ ثانیه عملیات شناسایی و کمتر از ۳۲۰ ثانیه برای انهدام نهایی زمان برد که به‌دلیل بی‌نیازی از امواج ارتباطی، مصونیت بالایی در برابر جنگ الکترونیک فراهم می‌کند. فناوری اصلی به کار رفته در این پروژه، ترکیب پلتفرم Scaleout Edge با روش یادگیری در قالب یک شبکه‌ی تاکتیکی بینایی ماشین است. این پروژه تحت نام FEDAIR بخشی از شتاب‌دهنده‌ی دفاعی ناتو به‌شمار می‌رود و ۱۰۰ هزار یورو بودجه توسعه‌ای به همراه دسترسی‌های آزمایشی دریافت کرده است. در آزمایشی دیگر در دمای منفی ۱۸ درجه سانتی‌گراد سوئد، بدنه‌ی پروازی Airolit S1 مدل تشخیص اشیای YOLOv8 Nano را روی پردازشگر Jetson Orin Nano انویدیا اجرا کرد و با سرعت ۲۰ متربرثانیه و نرخ ۳۰ فریم‌برثانیه به پایش محیط پرداخت."}, {"source": "Business Insider", "title": "I built a freelance career by saying yes. Now, I'm learning when not to.", "link": "https://www.businessinsider.com/built-career-by-saying-yes-changing-strategy-2026-9", "summary": "The author is learning to say no more at this stage in her career. Courtesy of Hannah Howard After getting laid off at 27, I took the jump and went freelance. Over the years, I've said 'yes' to almost all work that came my way. I'm now 39, and the loss of a big client has me rethinking my strategy. I don't think I would have had the courage to become a freelancer if I hadn't been laid off . The year was 2014. I was 27, living in a tiny studio on the Upper West Side, conveniently located next to not one, not two, but three frozen yogurt shops. I had just lost my job , and my ego was crushed. Once the initial humiliation wore off, the layoff started to feel like a nudge toward something I'd wanted to try for a long time: Could I actually make it as a freelance writer? I gave myself six months. My definition of \"making it\" was modest. I needed to earn enough money to pay the rent on that tiny apartment and support myself without going completely broke. Somehow, I did — though just barely. There was, for instance, the afternoon I had a meltdown in Westside Market after discovering that the money I had diligently set aside for estimated quarterly taxes — look at me, being responsible! — was not even close to enough. Still, I kept going. In the 12 years since, I've had a few full-time jobs but spent most of my career working for myself . I've been a journalist, author, editor, writing teacher, and even cheese consultant. Before AI, I sometimes got paid to transcribe interviews. I once demonstrated very fancy olive oil to shoppers in grocery stores. With plenty of caveats, I love freelancing. I've traveled around the world for stories and met wonderfully weird, brilliant people I never would have encountered otherwise. I can meet a friend for lunch at 1 p.m. on a Tuesday without asking anyone's permission and stay all afternoon. When my kids have a school event , I can usually be there. I built a career by saying yes to almost everything But somewhere along the way, I also got very good at saying yes to work. Some of that work was deeply satisfying. Some of it paid well. And some of it was writing digital shelf copy — the product descriptions and specifications you see on sites like Amazon and Walmart, down to dimensions and other decidedly unpoetic details. There was nothing wrong with that work. It paid me reliably and well, which is not a small thing. But over time, I accumulated more and more work that felt farther from the reason I had wanted to become a wri", "date_str": "2026-09-22T13:07:01+00:00", "hash": "f8435304105b069b", "title_fa": "من با بله گفتن یک شغل آزاد ایجاد کردم. حالا، دارم یاد می‌گیرم که چه زمانی نباید.", "summary_fa": "نویسنده در این مرحله از حرفه خود یاد می گیرد که دیگر چیزی نگوید. با حسن نیت از هانا هوارد پس از اینکه در 27 سالگی اخراج شدم، پرش را انجام دادم و به صورت آزاد کار کردم. در طول سال‌ها، تقریباً به تمام کارهایی که سر راهم قرار گرفته «بله» گفته‌ام. من الان 39 ساله هستم و از دست دادن یک مشتری بزرگ باعث شد در استراتژیم تجدید نظر کنم. فکر نمی‌کنم اگر اخراج نمی‌شدم، جرات شغل آزاد شدن را نداشتم. سال 2014 بود. من 27 ساله بودم و در یک استودیوی کوچک در Upper West Side زندگی می‌کردم که در کنار نه یک، نه دو، بلکه سه مغازه ماست یخ‌زده قرار داشت. من تازه کارم را از دست داده بودم و نفسم خرد شده بود. هنگامی که تحقیر اولیه از بین رفت، اخراج شروع به تلنگری به سمت چیزی کرد که مدت‌ها می‌خواستم آن را امتحان کنم: آیا واقعاً می‌توانم آن را به عنوان یک نویسنده آزاد بسازم؟ شش ماه به خودم فرصت دادم. تعریف من از «ساختش» متواضعانه بود. من باید به اندازه کافی پول به دست می آوردم تا بتوانم اجاره آن آپارتمان کوچک را بپردازم و بدون اینکه کاملاً از کار بیفتم، زندگی خود را تامین کنم. به نوعی، من این کار را کردم - هرچند به سختی. به عنوان مثال، بعد از ظهری بود که پس از کشف این که پولی را که با جدیت برای مالیات های سه ماهه تخمین زده بودم کنار گذاشته بودم، در بازار وست ساید دچار بحران شدم - به من نگاه کنید که مسئول هستم! - حتی به اندازه کافی نزدیک نبود. با این حال به راهم ادامه دادم. در 12 سال پس از آن، من چند شغل تمام وقت داشتم اما بیشتر دوران حرفه ای ام را صرف کار برای خودم کردم. من روزنامه نگار، نویسنده، ویراستار،"}, {"source": "Business Insider", "title": "I flew 11,000 miles with the new Sonos Ace Ultra headphones, and their noise cancellation wowed me", "link": "https://www.businessinsider.com/guides/tech/sonos-ace-ultra-headphones-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We put the Sonos Ace Ultra headphones to the test at home and while traveling. Tyler Hayes/Business Insider The new Sonos Ace Ultra are some of the most impressive headphones I've reviewed all year, mainly because of their top-notch active noise cancellation (ANC). And I don't make that claim lightly. In addition to testing nearly every premium headphone model released over the last three years, I've already flown more than 11,000 miles with the Ace Ultra. I can assure you they're built to travel the world as much as they're suited for everyday listening at home. The Sonos Ace Ultra headphones are an upgraded version of the original Sonos Ace headphones that launched in 2024. That standard model isn't going anywhere, however, as it will remain available for a reduced MSRP of $349. Meanwhile, the new $449 Sonos Ace Ultra are meant to deliver a more premium experience, with improved performance across the board. Based on my experience, they deliver the goods. They play the hits with dynamic audio and offer a comfortable fit thanks to plush ear cups. Key design elements carry over from the original Ace, but the Ace Ultra headphones really elevate their ANC game and support new features to more seamlessly integrate with other Sonos products. Though I have some minor quibbles, these are easily among the best headphones you can get for under $500. The Ace Ultra are comfortable to wear for hours, whether you're at home or on the go The headphones offer a comfortable fit and are available in new colorways, including the Sand style pictured above. Tyler Hayes/Business Insider Sound quality and active noise cancellation are the meat of modern, premium headphones. But comfort and appearance shouldn't be ignored. Compared to the standard Sonos Ace, the most obvious visual change with this new step-up model is the expanded color choices. In addition to standard Black and White, Sonos now has Agave and Sand. Both offer an elegant look. In person, Sand is especially sophisticated without being gaudy. Both my wife and daughter instantly gravitated to my Sand-colored review unit, which drew their attention more than five rival headphones I had on hand from other brands. Even though it's hard to tell from looks alone, the headphones' fit has also been revised, with deeper ear cups. This means they should be more comfortable for a wider range of people. But while the overall dimensi", "date_str": "2026-09-22T13:00:17+00:00", "hash": "d5f5544b6c9dc045", "title_fa": "من 11000 مایل با هدفون جدید Sonos Ace Ultra پرواز کردم و حذف نویز آنها مرا شگفت زده کرد.", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید هدفون Sonos Ace Ultra را در خانه و در سفر آزمایش می کنیم. Tyler Hayes/Business Insider Sonos Ace Ultra جدید برخی از تاثیرگذارترین هدفون‌هایی هستند که در طول سال بررسی کرده‌ام، عمدتاً به دلیل سطح بالای حذف نویز فعال (ANC). و من این ادعا را ساده نمی کنم. علاوه بر آزمایش تقریباً هر مدل هدفون ممتازی که در سه سال گذشته منتشر شده است، من قبلاً بیش از 11000 مایل را با Ace Ultra پرواز کرده ام. من می توانم به شما اطمینان دهم که آنها طوری ساخته شده اند که به همان اندازه که برای گوش دادن روزمره در خانه مناسب هستند، به دنیا سفر کنند. هدفون Sonos Ace Ultra نسخه ارتقا یافته هدفون اصلی Sonos Ace است که در سال 2024 عرضه شد. با این حال، این مدل استاندارد راه به جایی نمی برد، زیرا با قیمت MSRP کاهش یافته 349 دلار در دسترس خواهد بود. در همین حال، Sonos Ace Ultra جدید 449 دلاری برای ارائه یک تجربه ممتاز تر، با عملکرد بهبود یافته در سراسر صفحه طراحی شده است. بر اساس تجربه من، آنها کالا را تحویل می دهند. آن‌ها آهنگ‌ها را با صدای پویا پخش می‌کنند و به لطف گوش‌های مجلل، تناسب راحت ارائه می‌کنند. عناصر کلیدی طراحی از Ace اصلی منتقل شده‌اند، اما هدفون Ace Ultra واقعاً بازی ANC خود را ارتقا می‌دهد و از ویژگی‌های جدید برای ادغام یکپارچه‌تر با سایر محصولات Sonos پشتیبانی می‌کند. اگرچه من برخی از ایرادات جزئی دارم، اما اینها به راحتی جزو بهترین هدفون هایی هستند که می توانید با قیمت کمتر از 500 دلار تهیه کنید. Ace Ultra برای ساعت‌ها راحت است، چه در خانه باشید و چه در حال حرکت. Tyler Hayes/Business Insider کیفیت صدا و حذف"}, {"source": "Business Insider", "title": "I tried chicken tenders from 14 fast-food chains. The crispiest, juiciest tenders won me over.", "link": "https://www.businessinsider.com/fast-food-chicken-tenders-ranked", "summary": "I compared chicken tenders from 14 fast-food chains, including McDonald s, Chick-fil-A, KFC, Wingstop, and Taco Bell. Erin McDowell/Business Insider I tried chicken tenders from 14 different fast-food chains. Chick-fil-A and KFC's chicken tenders had similar textures. Raising Cane's impressed me with its crispy-yet-juicy tenders and delicious signature sauce. It seems like every chain wants a piece of the dunkable-chicken craze. McDonald's launched its McCrispy Strips in May 2025, marking the first time chicken strips had been on its menu since the COVID-19 pandemic. Then, in June 2025, Taco Bell introduced its new Crispy Chicken Strips, with Taco Bell's CMO Taylor Montgomery telling Business Insider that Gen Z was eating more crispy chicken than other generations, and \"we need to evolve to where youth culture and the next generation of consumers are going.\" I tried chicken tenders from 14 major fast-food chains across the US to see how they compared. When it comes to my perfect tender, I'm looking for a balance between a satisfying crunch and juicy chicken. I generally prefer thick, all-white-meat tenders with a crisp, flavorful breading over thinner tenders and heavy breading. Plus, amid rising fast-food prices, value for money and portion size have become more important to me than ever before. Here's how all 14 chicken tenders ranked, from my least favorite to my favorite, based on flavor, texture, and overall value. Of all the chicken tenders I tried, Whataburger s didn t completely wow me. Erin McDowell/Business Insider A three-piece chicken tender cost $7.48 at Whataburger at the location I visited in Austin. The tenders were large and perfectly fried. Erin McDowell/Business Insider The tenders could be described as \"classic\" — they weren't anything out-of-the-box, but I enjoyed them. The meat inside was juicy, but I thought the fried coating could have had a bit more crunch. Erin McDowell/Business Insider The chicken tenders tasted good on their own and with ranch dipping sauce. They weren't bad by any stretch of the imagination. However, I did think the other tenders I tried were slightly crispier and had slightly more flavor in the batter. Regardless, for a relatively low price, I'd definitely order these again. I also ordered chicken tenders from Cook Out, a regional chain I visited in South Carolina. Cook Out chicken tenders. Erin McDowell/Business Insider The three-piece \"snack\" cost $4.99, not including tax. The chicken tenders were crispy on ", "date_str": "2026-09-22T12:48:02+00:00", "hash": "3b8b6a4c1e711982", "title_fa": "من غذای مرغ را از 14 زنجیره فست فود امتحان کردم. تردترین و آبدارترین مناقصه ها مرا جلب کردند.", "summary_fa": "من مناقصه مرغ را از 14 فست فود زنجیره ای از جمله مک دونالد اس، چیک فیل ای، کی اف سی، وینگستاپ و تاکو بل مقایسه کردم. ارین مک داول/Business Insider من مناقصه مرغ را از 14 زنجیره مختلف فست فود امتحان کردم. جوجه های Chick-fil-A و KFC بافت های مشابهی داشتند. Raising Cane's من را با طعم ترد و در عین حال آبدار و سس امضای خوشمزه خود تحت تأثیر قرار داد. به نظر می رسد که هر زنجیره ای یک تکه از شوق مرغ قابل غرق شدن را می خواهد. مک‌دونالدز نوارهای مک‌کریسپی خود را در ماه می ۲۰۲۵ راه‌اندازی کرد و این اولین باری بود که از زمان همه‌گیری کووید-۱۹، نوارهای مرغ در منوی این شرکت قرار گرفت. سپس، در ژوئن 2025، تاکو بل نوار مرغ ترد جدید خود را معرفی کرد، با تیلور مونتگومری، مدیر ارشد اجرایی تاکو بل، به Business Insider گفت که ژنرال Z نسبت به نسل های دیگر مرغ ترد بیشتری می خورد و \"ما باید به جایی که فرهنگ جوانان و نسل بعدی مصرف کنندگان می روند تکامل پیدا کنیم.\" من مناقصه مرغ را از 14 فروشگاه زنجیره ای فست فود بزرگ در سراسر ایالات متحده امتحان کردم تا ببینم چگونه آنها مقایسه می کنند. وقتی نوبت به طعم کامل من می رسد، به دنبال تعادلی بین یک کرانچ رضایت بخش و مرغ آبدار هستم. من به طور کلی گوشت های غلیظ و کاملا سفید با نان های ترد و خوش طعم را به نان های نازک تر و نان های سنگین ترجیح می دهم. بعلاوه، در میان افزایش قیمت فست فودها، ارزش پول و اندازه سهم برای من مهمتر از همیشه شده است. در اینجا همه 14 مرغ مرغ، از کمترین علاقه من تا مورد علاقه من، بر اساس طعم، بافت و ارزش کلی رتبه بندی شدند. از بین تمام غذاهای"}, {"source": "Business Insider", "title": "I stopped asking myself which decision was 'right.' Now I ask which one I'll regret least.", "link": "https://www.businessinsider.com/newborn-nicu-mom-breast-cancer-triple-negative-2026-9", "summary": "Parul Somani had a NICU baby and was diagnosed with cancer. Courtesy of Parul Somani Parul Somani had always approached major decisions by gathering data and finding answers. Somani discovered during cancer treatment that some choices have no guaranteed outcome. She developed a framework focused on making decisions she can stand behind afterward. This as-told-to essay is based on a conversation with Parul Somani , a working mother and the author of The Path of Least Regret. It has been edited for length and clarity. After giving birth to my second child in 2014, I was diagnosed with breast cancer . I was 31. That changed my life, including how I make decisions. I was always a high achiever I was raised in an immigrant family and saw the work ethic my parents demonstrated. They always valued education, and while there was never pressure from them, it was something that I absorbed: work hard, because nothing is going to be handed to you. I always had a clear plan in place, and a precision of how my life was going to play out. I rose through the ranks in consulting and tech, even after having my first daughter in 2011. I was diagnosed with cancer My daughter had to be intubated and ambulance-transported to a different hospital for an acute NICU stay . On top of that, two days before my water broke, I had felt a lump on my chest during an ultrasound appointment. The doctor told me it was likely a clogged milk duct and that it was probably nothing to worry about because I was 31. But I have a family history of cancer and genetic risk . Post-delivery, my husband wheeled me from the NICU to the neighboring breast clinic, where they also told me not to be worried. We took my daughter home a few days later. And then the surgeon called to say that it was malignant after all. It was stage II triple-negative breast cancer , the most aggressive kind. I ended up needing 10 rounds of chemotherapy, a bilateral mastectomy, and a breast reconstruction. These experiences changed the way I make decisions There was so much uncertainty and fear during this chapter, and my Type A personality kicked in. I approached every question by diving into the data like I always had, looking for the right answer. What I learned from cancer, though, was that there was no study or person to tell me what the right choice was going to be for me. There was no path of least resistance, so I thought, \"What is the path of least regret?\" What is the regret I can live with the most? What path or deci", "date_str": "2026-09-22T12:17:01+00:00", "hash": "8398501b8d65101b", "title_fa": "دیگر از خودم نپرسیدم که کدام تصمیم \"درست\" است. حالا می پرسم از کدام یک کمتر پشیمان می شوم.", "summary_fa": "پارول سومانی نوزادی در بخش مراقبت های ویژه (NICU) داشت و به سرطان مبتلا شد. با حسن نیت از Parul Somani پارول سومانی همیشه با جمع آوری داده ها و یافتن پاسخ به تصمیمات مهم نزدیک می شد. سومانی در طول درمان سرطان دریافت که برخی از انتخاب ها هیچ نتیجه تضمینی ندارند. او چارچوبی را ایجاد کرد که بر تصمیماتی متمرکز بود که بتواند پس از آن بایستد. این مقاله طبق گفته‌ها بر اساس گفتگو با پارول سومانی، مادر شاغل و نویسنده کتاب «مسیر کمترین حسرت» است. برای طول و وضوح ویرایش شده است. پس از تولد دومین فرزندم در سال 2014، تشخیص داده شد که من مبتلا به سرطان سینه هستم. من 31 ساله بودم. این زندگی من را تغییر داد، از جمله نحوه تصمیم گیری. من همیشه موفقیت بالایی داشتم. در خانواده ای مهاجر بزرگ شدم و اخلاق کاری والدینم را دیدم. آنها همیشه برای آموزش ارزش قائل بودند، و در حالی که هیچگاه فشاری از جانب آنها وجود نداشت، چیزی بود که من جذبش کردم: سخت کار کنید، زیرا چیزی به شما داده نمی شود. من همیشه یک برنامه روشن و دقیق در مورد نحوه انجام زندگی ام داشتم. من حتی پس از داشتن اولین دخترم در سال 2011 رتبه‌های را در مشاوره و فناوری ارتقا دادم. تشخیص داده شد که من مبتلا به سرطان هستم. علاوه بر این، دو روز قبل از اینکه آب من پاره شود، در یک نوبت سونوگرافی روی سینه ام یک توده احساس کرده بودم. دکتر به من گفت که احتمالاً یک مجرای شیر مسدود شده است و احتمالاً جای نگرانی نیست زیرا من 31 ساله هستم. اما من سابقه خانوادگی سرطان و خطر ژنتیکی دارم. بعد از زایمان، شوهرم مرا از NICU به کلینیک سینه همسایه منتقل کرد، در آنجا نیز به من گفتند که نگران نباشم. چند روز بعد"}, {"source": "Business Insider", "title": "Mapped: The 165 flights diverted during air traffic chaos when a fiber-optic cable was accidentally cut", "link": "https://www.businessinsider.com/mapped-165-flights-diverted-after-fiber-optic-cable-cut-accidentally-2026-9", "summary": "Workers at the site where the cable was inadvertently cut in New Jersey. New Jersey Transit An air traffic control outage caused travel chaos in the northeast on Monday. Business Insider mapped how over 150 flights were diverted to dozens of different airports. Construction workers had accidentally cut a Verizon cable, which has since been repaired. Thought you had a bad Monday? A construction crew accidentally cut a Verizon fiber-optic cable, leading to over 150 flight diversions and hundreds more cancellations. The mishap caused an air traffic control outage at a Philadelphia facility that manages flights in the northeast. A circuit there had failed, and authorities then discovered that the backup cable had been cut, said Bryan Bedford, who leads the Federal Aviation Administration. New Jersey Transit said its contractors were working about 10 feet from utility markings, and it was trying to determine whether Verizon or the contractors had made the markings. A Business Insider analysis of Flightradar24 data found 165 flights bound for Newark, LaGuardia, John F. Kennedy, and Philadelphia Airports diverted elsewhere on Monday. Newark Airport bore the brunt of the chaos: 109 diverted flights were scheduled to land there. Around 20 headed to each of the other three. Washington, DC, was the most common city that pilots re-routed to, with 22 airplanes diverting to Dulles International Airport. Meanwhile, 10 flights ended up at Lehigh Valley, a small domestic airport near Allentown, Pennsylvania. Not pictured above are another five flights from Europe that returned to their origins — often referred to as flights to nowhere. Passengers on Lufthansa Flight 412 spent eight hours on board an Airbus A350 that U-turned over the Atlantic before returning to Munich. And a TAP Air Portugal flight from Porto to Newark was about halfway across the ocean before it was also forced to turn around. United Airlines appeared to be the worst affected by Monday's outage, as Newark is one of its major hubs. Data from FlightAware showed it canceled 361 flights — 11% of its schedule — and almost 800 were delayed. American Airlines was also hit hard, with over 100 cancellations and 1,300 delays, excluding its subsidiaries that operate regional flights. About five hours after the chaos began, Transportation Secretary Sean Duffy posted on X, saying the telecom lines had been repaired and airport operations were resuming. Although with many airplanes and flight crews left out of place, ", "date_str": "2026-09-22T12:05:48+00:00", "hash": "877341b1487774a4", "title_fa": "نقشه برداری شده: 165 پرواز در هنگام هرج و مرج ترافیک هوایی به دلیل قطع تصادفی کابل فیبر نوری منحرف شدند.", "summary_fa": "کارگران در محل قطع کابل به طور ناخواسته در نیوجرسی. ترانزیت نیوجرسی قطعی کنترل ترافیک هوایی باعث هرج و مرج سفر در شمال شرق در روز دوشنبه شد. Business Insider نقشه ای را نشان داد که چگونه بیش از 150 پرواز به ده ها فرودگاه مختلف تغییر مسیر داده است. کارگران ساختمانی به طور تصادفی یک کابل Verizon را قطع کرده بودند که از آن زمان تعمیر شده است. فکر کردی دوشنبه بدی داشتی؟ یک خدمه ساختمانی به طور تصادفی کابل فیبر نوری Verizon را قطع کرد که منجر به بیش از 150 تغییر پرواز و صدها لغو پرواز دیگر شد. این اتفاق ناگوار باعث اختلال در کنترل ترافیک هوایی در تاسیسات فیلادلفیا شد که پروازها را در شمال شرق مدیریت می کند. برایان بدفورد، که اداره هوانوردی فدرال را رهبری می‌کند، گفت: یک مدار در آنجا شکست خورده بود و مقامات پس از آن متوجه شدند که کابل پشتیبان قطع شده است. نیوجرسی ترانزیت گفت که پیمانکاران آن در فاصله 10 فوتی از علامت‌های خدمات شهری کار می‌کنند و تلاش می‌کند تا مشخص کند که آیا Verizon یا پیمانکاران این علامت‌گذاری را انجام داده‌اند یا خیر. تجزیه و تحلیل Business Insider از داده‌های Flightradar24 نشان داد که 165 پرواز به مقصد فرودگاه‌های نیوآرک، لاگواردیا، جان اف کندی و فیلادلفیا در روز دوشنبه به نقاط دیگری تغییر مسیر داده‌اند. فرودگاه نیوآرک بیشترین هرج و مرج را متحمل شد: قرار بود 109 پرواز تغییر مسیر داده در آنجا فرود آیند. حدود 20 نفر به سمت هر یک از سه نفر دیگر حرکت کردند. واشنگتن دی سی رایج ترین شهری بود که خلبانان مسیر خود را تغییر دادند و 22 هواپیما به فرودگاه بین المللی دالس تغییر مسیر دادند. در همین حال، 10 پرواز در دره لیهای، یک فرودگاه داخلی کوچک در نزدیکی آلن‌تاون، پنسیلوانیا به پایان رسید. در تصویر بالا، پنج"}, {"source": "Business Insider", "title": "What we know about the FAA outage that disrupted thousands of flights across the Northeast", "link": "https://www.businessinsider.com/faa-outage-newark-northeast-airports-flight-delays-cancellations-2026-9", "summary": "A broken circuit is affecting thousands of flights in the Northeast. Gary Hershorn/Getty Images Airports across the Northeast experienced disruptions after an air traffic control outage on Monday. A construction crew accidentally cut a backup fiber line, leading to the outage. The line was repaired, and by Tuesday morning, airport operations were largely back to normal. A construction mishap affecting air traffic control equipment in New Jersey on Monday caused chaos for travelers flying through the Northeast. Transportation Secretary Sean Duffy said the equipment outage was caused after a construction crew \"accidentally cut into a fiber line.\" In an update shared around 6 p.m., Duffy said the lines had been fixed and that all impacted airport operations were resuming. \"It will take some time to clear all existing delays, so please check with your airline for the latest information,\" Duffy said. New Jersey's Newark Liberty International Airport was put under a ground stop at around 10 a.m., when a nearby air traffic control center experienced an equipment outage, forcing the Federal Aviation Administration to halt inbound flights. The outage also affected Philadelphia and New York's JFK and LaGuardia airports , with hundreds of flights delayed, diverted, or canceled. Newark has been hit hardest, with more than 500 departing and arriving flights canceled — nearly half of all scheduled operations — and over 200 delayed. As of around 7:30 a.m. Tuesday, things had returned somewhat to normal. Newark was still the worst affected, with 58 flights departing or arriving at the airport canceled, per FlightAware data. In Philadelphia, that number was 30. See the map: The 165 flights diverted during air traffic chaos when a fiber-optic cable was accidentally cut FAA Administrator Bryan Bedford told CBS News around 1 p.m. on Monday that the primary circuit, which was old and due for replacement, failed, and that about 600 feet of the backup fiber was accidentally cut out by a construction crew. The affected ATC facility was the Philadelphia Terminal Radar Approach Control, or TRACON, which manages arriving and departing aircraft in the area. Workers at the site where the cable was inadvertently cut in New Jersey. New Jersey Transit Duffy said earlier on Monday that an \"Amtrak construction crew\" cut the fiber line, causing the outage. Amtrak told Business Insider that the \"incident occurred on New Jersey Transit property and involved a New Jersey Transit contractor,\" n", "date_str": "2026-09-22T11:44:36+00:00", "hash": "c28e8cb46525591a", "title_fa": "آنچه ما در مورد قطعی FAA می دانیم که هزاران پرواز در سراسر شمال شرق را مختل کرد", "summary_fa": "مدار شکسته هزاران پرواز را در شمال شرق تحت تاثیر قرار داده است. گری هرشورن/ گتی ایماژ فرودگاه های سراسر شمال شرق پس از قطعی کنترل ترافیک هوایی در روز دوشنبه دچار اختلال شدند. یک خدمه ساخت و ساز به طور تصادفی یک خط فیبر پشتیبان را قطع کرد که منجر به قطع شد. این خط تعمیر شد و تا صبح سه شنبه، عملیات فرودگاه تا حد زیادی به حالت عادی بازگشت. یک اشتباه ساختمانی که بر تجهیزات کنترل ترافیک هوایی در نیوجرسی در روز دوشنبه تأثیر گذاشت، باعث هرج و مرج مسافرانی شد که در شمال شرق پرواز می کردند. شان دافی، وزیر حمل و نقل، گفت که این قطعی تجهیزات پس از آن ایجاد شد که یک خدمه ساختمانی \"به طور تصادفی به یک خط فیبر بریدند.\" دافی در یک به‌روزرسانی که حوالی ساعت 6 بعد از ظهر به اشتراک گذاشته شد، گفت که خطوط تعمیر شده‌اند و همه عملیات‌های فرودگاهی که تحت تأثیر قرار گرفته بودند از سر گرفته می‌شوند. دافی گفت: \"برطرف کردن تمام تاخیرهای موجود کمی طول می کشد، بنابراین لطفاً برای آخرین اطلاعات با شرکت هواپیمایی خود تماس بگیرید.\" فرودگاه بین‌المللی نیوآرک لیبرتی نیوجرسی حدود ساعت 10 صبح زمانی که مرکز کنترل ترافیک هوایی در مجاورت دچار قطعی تجهیزات شد، متوقف شد و اداره هوانوردی فدرال مجبور به توقف پروازهای ورودی شد. این قطعی همچنین بر فرودگاه‌های JFK و لاگواردیا فیلادلفیا و نیویورک تأثیر گذاشت و صدها پرواز با تأخیر، تغییر مسیر یا لغو شد. نیوآرک بیشترین ضربه را خورده است و بیش از 500 پرواز خروجی و ورودی لغو شدند - تقریباً نیمی از تمام عملیات های برنامه ریزی شده - و بیش از 200 پرواز با تاخیر. از حدود ساعت 7:30 صبح سه شنبه، همه چیز تا حدودی به حالت عادی بازگشته بود. بر اساس داده های FlightAware، نیوآرک همچنان بدترین آسیب"}, {"source": "Business Insider", "title": "Ukrainian war robots with microphones and speakers are listening in and broadcasting surrender messages to Russian troops", "link": "https://www.businessinsider.com/ukraine-robots-use-speakers-microphones-to-get-intel-and-surrender-2026-9", "summary": "Robots equipped with speakers and microphones are giving units more options in battle while limiting Ukrainian soldiers exposure to the enemy. DevDroid/Cover Images via Reuters Connect Ukraine's robots have speakers and microphones to gather intelligence and speak to enemy soldiers. Units can send forward drones with microphones to gather intelligence on a position, a maker said. And speakers mean they can tell Russian soldiers to surrender or aid their own comrades. Ukraine's developers are equipping war robots with microphones and speakers to allow them to serve as mobile spies against Russia, to urge Russian soldiers to surrender, and to talk with their own comrades who need help. Ukraine is increasingly using uncrewed ground vehicles to launch attacks, transport equipment, pick up wounded troops, and lay mines, while operators control them remotely from protected positions farther from danger. They're also being used more and more for front-line communication and intelligence gathering. Robots in Ukraine's rapidly growing fleet often include microphones, which can be used to detect Russian troops and weapon systems nearby. Increasingly, the robots are also equipped with speakers that can talk to soldiers, allowing Ukrainians in dispersed fighting positions to communicatea nd ask for help, and even to try to persuade Russian soldiers to give up their fight. DevDroid, a Ukrainian developer, recently started putting speakers on its robots that can play live and pre-recorded audio because sometimes \"we need to say something to the enemy or maybe to our soldiers,\" Oleg Fedoryshyn, its director of R D, told Business Insider. Russian soldiers have been filmed surrendering to Ukrainian war robots , including some made by DevDroid. Other Ukrainian companies, like Roboneers, have also shared examples of their robots broadcasting surrender messages to Russian soldiers. Some Ukrainian units also say they have successfully played audio telling Russian soldiers to surrender from speakers on the aerial drones. Ukraine s robots can go forward where it s too dangerous for soldiers and listen. Ukrinform/NurPhoto via Getty Images Fedoryshyn said the speakers also allow Ukrainian soldiers to request ammo or relay critical status updates to their comrades. Robots, he said, can serve as a communication bridge when radios aren't an option. Tools like these have been used to communicate with trapped soldiers and wounded troops being transported out. Microphones are a more est", "date_str": "2026-09-22T11:37:01+00:00", "hash": "5042e1de6d4560f2", "title_fa": "روبات‌های جنگی اوکراینی با میکروفون و بلندگو در حال گوش دادن و پخش پیام‌های تسلیم به سربازان روسی هستند.", "summary_fa": "ربات‌های مجهز به بلندگو و میکروفون به واحدها گزینه‌های بیشتری در نبرد می‌دهند و در عین حال حضور سربازان اوکراینی در معرض دشمن را محدود می‌کنند. DevDroid/تصاویر جلد از طریق رویترز کانکت روبات‌های اوکراین دارای بلندگو و میکروفون برای جمع‌آوری اطلاعات و صحبت با سربازان دشمن هستند. یک سازنده گفت: واحدها می توانند پهپادهای با میکروفون را برای جمع آوری اطلاعات در یک موقعیت بفرستند. و سخنرانان به این معنا هستند که می توانند به سربازان روسی بگویند تسلیم شوند یا به همرزمان خود کمک کنند. توسعه دهندگان اوکراین در حال تجهیز ربات های جنگی به میکروفون و بلندگو هستند تا به آنها اجازه دهند به عنوان جاسوس متحرک علیه روسیه خدمت کنند، سربازان روسی را به تسلیم ترغیب کنند و با همرزمان خود که به کمک نیاز دارند صحبت کنند. اوکراین به طور فزاینده ای از وسایل نقلیه زمینی بدون خدمه برای انجام حملات، حمل تجهیزات، جمع آوری سربازان مجروح و مین گذاری استفاده می کند، در حالی که اپراتورها آنها را از راه دور از مواضع محافظت شده دورتر از خطر کنترل می کنند. آنها همچنین بیشتر و بیشتر برای ارتباطات خط مقدم و جمع آوری اطلاعات مورد استفاده قرار می گیرند. ربات‌های ناوگان رو به رشد اوکراین اغلب شامل میکروفون‌هایی هستند که می‌توانند برای شناسایی سربازان روسی و سیستم‌های تسلیحاتی در نزدیکی آن‌ها استفاده شوند. روبات‌ها به‌طور فزاینده‌ای به بلندگوهایی مجهز می‌شوند که می‌توانند با سربازان صحبت کنند و به اوکراینی‌ها در مواضع جنگی پراکنده اجازه می‌دهند با هم ارتباط برقرار کنند و کمک بخواهند، و حتی سعی کنند سربازان روسی را متقاعد کنند که از جنگ خود دست بکشند. اولگ فدوریشین، مدیر R D، به Business Insider گفت: DevDroid، یک توسعه‌دهنده اوکراینی، اخیراً شروع به نصب بلندگوهایی روی ربات‌های خود کرده است که می‌توانند صدای زنده و از پیش ضبط شده را پخش کنند، زیرا گاهی"}, {"source": "Business Insider", "title": "I quit my job and became a travel 'micro influencer.' Now I make money leading tours and see the world for free.", "link": "https://www.businessinsider.com/quit-job-became-travel-micro-influencer-how-make-money-business-2026-9", "summary": "The offers and details on this page may have updated or changed since the time of publication. See our article on Business Insider for current information. Rhiannon Wood is a social media influencer who leads travel group trips around the world. Courtesy of Rhiannon Wood Rhiannon Wood, 26, fell in love with traveling during her university's study abroad program in 2021. After working minimum-wage jobs around the world, she took courses on how to monetize social media. Today, she has about 60,000 Instagram followers and is building her own travel agency. This as-told-to essay is based on a conversation with Rhiannon Wood , a 26-year-old travel micro influencer who runs a social media business and leads group tours around the world. It has been edited for length and clarity. After graduating from the University of Birmingham in the UK in 2022, I knew I wanted to travel before settling into my journalism career. I took odd jobs around the world to scratch the itch, but I didn't quite get back to the life I originally envisioned. Instead, traveling around the world — and finding a way to monetize it online — became my full-time job. I never thought that hosting group tours in Greece, Peru, and Georgia would be my business, but now I can't imagine it being anything else. My now-60,000 Instagram followers make me a \" micro influencer ,\" generally defined as an online creator with a follower count between 10,000 and 100,000. I don't make a ton of money, as I'm only about two years in, but I make enough to live comfortably and continue building my business. Here's my journey to becoming a \"micro influencer\" leading group tours and seeing the world for free, and how I make money doing it. I hired an Instagram coach to learn how to monetize social media Rhiannon Wood, 26, started her journey as a solo traveler and micro-influencer by first taking odd jobs around the world. Courtesy of Rhiannon Wood I first caught the travel bug during my senior year of university, in my study abroad program in the 2021-2022 academic year. I lived in Lyon, France, with friends, and on weekends, we took trips to the nearby mountains and other countries. I fell in love with skiing on the slopes of the Alps, which catapulted me to Lake Louise, Canada, near Banff, immediately after graduation. While skiing as much as possible in Canada, I worked at a boat-and-canoe rental company, a zipline company, and a ski resort — living on minimum-wage pay and the excitement of being in a new part o", "date_str": "2026-09-22T11:16:01+00:00", "hash": "121f9237794fdb19", "title_fa": "من کارم را رها کردم و یک «میکرو اینفلوئنسر» در سفر شدم. اکنون با تورهای مسافرتی پول در می‌آورم و دنیا را رایگان می‌بینم.", "summary_fa": "پیشنهادها و جزئیات موجود در این صفحه ممکن است از زمان انتشار به روز شده یا تغییر کرده باشند. برای اطلاعات فعلی به مقاله ما در Business Insider مراجعه کنید. Rhiannon Wood یک تأثیرگذار رسانه های اجتماعی است که سفرهای گروهی سفر به سراسر جهان را هدایت می کند. با حسن نیت از Rhiannon Wood Rhiannon Wood، 26 ساله، در طول برنامه تحصیلی دانشگاه خود در خارج از کشور در سال 2021 عاشق سفر شد. او پس از انجام مشاغل با حداقل دستمزد در سراسر جهان، دوره هایی را در مورد چگونگی کسب درآمد از رسانه های اجتماعی گذراند. او امروز حدود 60000 فالوور اینستاگرام دارد و در حال ساخت آژانس مسافرتی خود است. این مقاله گفته شده بر اساس گفتگو با ریانون وود، یک میکرو اینفلوئنسر 26 ساله در سفر است که یک تجارت رسانه های اجتماعی را اداره می کند و تورهای گروهی را در سراسر جهان هدایت می کند. برای طول و وضوح ویرایش شده است. پس از فارغ التحصیلی از دانشگاه بیرمنگام در بریتانیا در سال 2022، می دانستم که می خواهم قبل از اینکه در حرفه روزنامه نگاری خود مستقر شوم، سفر کنم. من کارهای عجیب و غریبی را در سرتاسر دنیا انجام دادم تا خارش را برطرف کنم، اما کاملاً به زندگی ای که در ابتدا تصور می کردم برنگشتم. در عوض، سفر به سراسر جهان - و یافتن راهی برای کسب درآمد آنلاین - به شغل تمام وقت من تبدیل شد. هرگز فکر نمی کردم که میزبانی تورهای گروهی در یونان، پرو و ​​گرجستان شغل من باشد، اما اکنون نمی توانم تصور کنم که چیز دیگری باشد. اکنون 60000 فالوور من در اینستاگرام از من یک \"اینفلوئنسر خرد\" می سازد که به طور کلی به عنوان یک خالق آنلاین با تعداد فالوورهای بین 10000 تا 100000 تعریف می شود. من پول زیادی به"}, {"source": "Business Insider", "title": "Ukraine says heavy bomber drones air-dropped exploding war robots miles behind Russian lines during a secretive operation", "link": "https://www.businessinsider.com/drones-drop-robots-russian-lines-ukraine-retake-territory-2026-9", "summary": "Ukraine is increasingly using robots to fight, and says dropping them with drones behind Russian lines is helping to retake territory. Ukrinform/NurPhoto via Getty Images A Ukrainian unit said it air-dropped explosive-laden war robots behind Russian lines. The Third Army Corps said it pioneered air-deploying ground robots. The unit said it took ground in Operation Vivaldi, which remains largely secret. A Ukrainian unit used heavy bomber drones to drop war robots behind Russian lines as part of a secretive operation that it says has helped retake multiple settlements. Ukraine's Third Army Corps on Sunday announced that Operation Vivaldi, near the eastern city of Lyman, had so far brought 125 square kilometers back under Ukrainian control, including 50 square kilometers retaken from Russian occupation. Many details of this significant operation remain undisclosed because it is taking place under \"conditions of maximum information silence,\" Brig. Gen. Andrii Biletskyi, commander of the Third Army Corps, said in a video shared by the unit. But he revealed one key tactic that the unit says it pioneered. \"The Third Army Corps was the first in the world to begin air-deploying ground robotic systems,\" he said, adding that \"our heavy bomber drones deliver suicide ground drones more than 10 kilometers into the enemy's rear.\" Ukraine has increasingly been using both aerial drones and ground robots to fight Russia's invasion, using them to scout and attack areas considered too dangerous for troops. Biletskyi said that during assault operations, drones and uncrewed ground vehicles \"always move ahead of the infantry,\" helping clear the way for troops that follow. The Corps said in a separate post on Monday that its robots had become a key part of the offensive, completing over 15,700 successful missions and delivering around 3,300 tons of cargo. The unit said that during the ongoing operation, its artillery and uncrewed systems have hit Russian command posts, communication hubs, logistics, river crossings, and reserves. The Third Army Corps said it used heavy bomber drones to drop robots more than 10 kilometers into the enemy s rear. Roman Chop/Global Images Ukraine via Getty Images It said that Ukrainian air defenses and electronic warfare units created a protective shield over the combat zone, blinding Russian forces and preventing them from detecting the operation's design. Biletskyi said the operation also helped counter Russia's small infiltration groups , a tactic", "date_str": "2026-09-22T10:42:06+00:00", "hash": "57e078d2eb52f175", "title_fa": "اوکراین می‌گوید هواپیماهای بدون سرنشین بمب‌افکن سنگین، ربات‌های جنگی در حال انفجار را مایل‌ها پشت خطوط روسیه طی یک عملیات محرمانه پرتاب کردند.", "summary_fa": "اوکراین به طور فزاینده‌ای از روبات‌ها برای جنگ استفاده می‌کند و می‌گوید انداختن آنها با پهپادها در پشت خطوط روسیه به بازپس‌گیری قلمرو کمک می‌کند. Ukrinform/NurPhoto از طریق گتی ایماژ یک واحد اوکراینی گفت که ربات های جنگی مملو از مواد منفجره را در پشت خطوط روسیه به هوا پرتاب کرده است. سپاه سوم ارتش گفت که پیشگام روبات های زمینی استقرار هوایی است. این یگان گفت که در عملیات ویوالدی، که تا حد زیادی مخفی باقی مانده است، زمین گیر شد. یک واحد اوکراینی از پهپادهای بمب افکن سنگین برای انداختن ربات های جنگی پشت خطوط روسیه به عنوان بخشی از یک عملیات مخفیانه استفاده کرد که می گوید به بازپس گیری چندین شهرک کمک کرده است. سپاه سوم ارتش اوکراین روز یکشنبه اعلام کرد که عملیات ویوالدی در نزدیکی شهر لیمان در شرق اوکراین تا کنون 125 کیلومتر مربع را به کنترل اوکراین بازگردانده است، از جمله 50 کیلومتر مربع که از اشغال روسیه بازپس گرفته شده است. بسیاری از جزئیات این عملیات مهم فاش نشده است زیرا تحت \"شرایط حداکثر سکوت اطلاعاتی\" انجام می شود. ژنرال آندری بیلتسکی، فرمانده سپاه سوم ارتش، در ویدئویی که توسط این واحد به اشتراک گذاشته شده است، گفت. اما او یک تاکتیک کلیدی را فاش کرد که واحد می گوید پیشگام بوده است. وی با بیان اینکه «سپاه سوم ارتش برای اولین بار در جهان استقرار سامانه‌های روباتیک زمینی را آغاز کرد»، افزود: «پهپادهای بمب‌افکن سنگین ما پهپادهای انتحاری زمینی را بیش از 10 کیلومتر به عقب دشمن می‌رسانند». اوکراین به طور فزاینده ای از پهپادهای هوایی و ربات های زمینی برای مبارزه با تهاجم روسیه استفاده می کند و از آنها برای جستجو و حمله به مناطقی استفاده می کند که برای سربازان بسیار خطرناک است. بیلتسکی گفت که در طول عملیات تهاجمی، پهپادها و وسایل نقلیه زمینی بدون سرنشین"}, {"source": "Business Insider", "title": "6 charming places around the world that will pay you to move there", "link": "https://www.businessinsider.com/international-places-that-will-pay-you-to-move-europe-italy-japan", "summary": "Sardinia, Italy, is among the European locales offering people cash to move there. DaLiu/Getty Images A handful of international towns are offering movers cash and incentives to relocate. Most of the places in need of new people are rural and have struggled with a falling population. In some places, cash incentives can reach the five-figure mark. If the high cost of living in the United States has become too much, there are a handful of countries that are more than happy to welcome new residents — so much so that they'll pay people who want to move there. From a Italian island to a small town in Switzerland, some places are offering a variety of incentives, upwards of $30,000 in some cases, to entice people to give their town a go. More often than not, transplants won't be living in the more popular — or populous — parts of a country, as these programs, which are similar to ones employed by cities across the US , are usually intended to boost underpopulated communities. But movers can still end up in a picturesque part of the world with a different way of life . Ireland, for example, wants more people on the islands not connected to the mainland , and has a program to help people buy and renovate homes there. Ireland's government said it aims to replenish the less-inhabited islands with people so \"visitors to the islands can continue to experience and appreciate the unique culture, heritage and environmental richness that the islands have to offer.\" Not everyone can get money for moving to these places. Most of the programs have certain requirements to receive the incentives, like being under a certain age or staying in the new place for a certain length of time. For foreigners, the proper visa is required, but some countries make that easier than others to obtain one. Below are six international programs offering cash and other incentives to movers. Albinen, Switzerland Albinen, Switzerland. Westend61/Getty Images In an effort to replenish its aging population, the small Swiss village of Albinen is offering nonresidents 25,000 francs (or about $30,412) per adult and 10,000 francs per child to move to the remote Alpine locale. Albinen implemented its relocation program in 2017 after many young people and families left the small village, which saw its population drop to fewer than 300 people. The Swiss village, located in the Leuk district in the canton of Valais, is quintessential quiet living. There is no school, bank, or post office, and only one remaini", "date_str": "2026-09-22T10:04:02+00:00", "hash": "f62a8f5a2af599fa", "title_fa": "6 مکان جذاب در سراسر جهان که برای نقل مکان به شما پول می دهند", "summary_fa": "ساردینیا، ایتالیا، یکی از مناطق اروپایی است که برای نقل مکان به مردم پول نقد ارائه می دهد. DaLiu/Getty Images تعداد انگشت شماری از شهرهای بین المللی به جابجایی ها پول نقد و مشوق هایی برای نقل مکان ارائه می دهند. بیشتر مکان هایی که به افراد جدید نیاز دارند روستایی هستند و با کاهش جمعیت دست و پنجه نرم کرده اند. در برخی جاها، مشوق های نقدی می تواند به مرز پنج رقمی برسد. اگر هزینه های بالای زندگی در ایالات متحده بیش از حد شده است، تعداد انگشت شماری از کشورها وجود دارند که از پذیرایی از ساکنان جدید خوشحال هستند - به طوری که به افرادی که می خواهند به آنجا نقل مکان کنند، پول پرداخت می کنند. از یک جزیره ایتالیایی گرفته تا یک شهر کوچک در سوئیس، برخی از مکان‌ها مشوق‌های مختلفی را ارائه می‌دهند که در برخی موارد بیش از 30000 دلار برای ترغیب مردم به شهر خود ارائه می‌دهند. اغلب، پیوندها در بخش‌های پرطرفدارتر - یا پرجمعیت‌تر یک کشور زندگی نمی‌کنند، زیرا این برنامه‌ها، که مشابه برنامه‌هایی هستند که در شهرهای سراسر ایالات متحده به کار می‌روند، معمولاً برای تقویت جوامع کم‌جمعیت در نظر گرفته شده‌اند. اما جابجایی ها هنوز هم می توانند در قسمتی زیبا از جهان با شیوه ای متفاوت زندگی کنند. برای مثال، ایرلند افراد بیشتری را در جزایری که به سرزمین اصلی متصل نیستند می‌خواهد و برنامه‌ای برای کمک به مردم برای خرید و بازسازی خانه‌ها در آنجا دارد. دولت ایرلند گفت که قصد دارد جزایر کمتر مسکونی را با مردم پر کند تا \"بازدیدکنندگان جزایر بتوانند همچنان فرهنگ، میراث و غنای زیست‌محیطی منحصربه‌فردی را که جزایر ارائه می‌دهند، تجربه کرده و قدردانی کنند.\" همه نمی توانند برای نقل مکان به این مکان ها پول دریافت کنند. اکثر برنامه‌ها برای دریافت مشوق‌ها شرایط خاصی دارند، مانند زیر یک سن"}, {"source": "Business Insider", "title": "A brand new Trump trade faces its first big test at this week’s US-China summit", "link": "https://www.businessinsider.com/trump-xi-summit-rare-earth-stocks-greenland-deal-china-minerals-trade-2026-9", "summary": "Evan Vucci-Pool / Getty Images The US's Greenland has made rare-earth stocks the latest Trump trade. The looming Trump-Xi summit will decide whether the rally has legs. Sign up for First Trade , Business Insider's daily markets newsletter. From a political perspective, Chinese president Xi Jinping's White House visit this week is a massive deal. Which makes it ironic that a main talking point will be tiny components the average person never sees. I'm talking about rare-earth minerals. Sporting sci-fi names like neodymium and yttrium, they help power the minuscule magnets inside phones, EVs , headphones, wind turbines … you name it. They're also crucial for data centers and military items like fighter jets and missiles. The reason why Trump wants to chat about rare earths is simple: China is sitting on the supply stash, and the US wants in on that. Easier said than done, of course, especially within such a competitive relationship. There's already been a reduction in rare earth shipments from China to the US. New data from Chinese customs showed a 13% year-over-year decline in August, and a 20% drop from the previous month. A new leg of the Trump trade While the US is entering the summit with hopes for collaboration, it doesn't appear content to sit back and play defense. This past weekend, President Trump said he reached an agreement with Denmark over Greenland that would give the US \"permanent control over security.\" While the announcement did not explicitly mention mining, investors saw the broader message: the US is looking for alternative sources of rare earths, and Greenland could be critical to that effort. The announcement swung a new piece of the ever-expanding Trump trade into action, this time favoring US rare-earth stocks. The biggest beneficiary was Critical Metals, which owns a controlling stake in Greenland's Tanbreez rare-earth project. Shares spiked as much as 43% . Other winners included USA Rare Earth (+9%), MP Materials (+6%), and Energy Fuels (+5%), which are bets on an improved US supply chain. But there's a catch: Many of the companies whose stocks got a lift from the Greenland deal are still early-stage development stories. The US may eventually be able to reduce its reliance on China, but it's not going to happen right away. Xi still holds the cards That's what makes Thursday's Trump-Xi summit the immediate test for the US's rare-earths plan. An agreement that restores steadier Chinese exports would offer the quickest relief for Ame", "date_str": "2026-09-22T09:50:01+00:00", "hash": "ebae299667b30204", "title_fa": "یک تجارت کاملاً جدید ترامپ با اولین آزمایش بزرگ خود در نشست این هفته آمریکا و چین روبرو می شود", "summary_fa": "Evan Vucci-Pool / Getty Images گرینلند ایالات متحده، سهام کشورهای کمیاب را به جدیدترین تجارت ترامپ تبدیل کرده است. نشست قریب الوقوع ترامپ و شی تصمیم خواهد گرفت که آیا این تظاهرات پاهایی دارد یا خیر. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. از منظر سیاسی، سفر این هفته شی جین پینگ رئیس جمهور چین به کاخ سفید یک توافق بزرگ است. این موضوع طعنه آمیز می کند که یک نقطه صحبت اصلی اجزای کوچکی باشد که افراد عادی هرگز نمی بینند. من در مورد مواد معدنی کمیاب صحبت می کنم. نام‌های علمی-تخیلی ورزشی مانند نئودیمیم و ایتریوم، به تقویت آهنرباهای کوچک داخل تلفن‌ها، خودروهای برقی، هدفون، توربین‌های بادی کمک می‌کنند. آنها همچنین برای مراکز داده و اقلام نظامی مانند جت های جنگنده و موشک بسیار مهم هستند. دلیل اینکه ترامپ می‌خواهد درباره خاک‌های کمیاب گپ بزند ساده است: چین در انبار عرضه نشسته است، و ایالات متحده می‌خواهد در این زمینه دخالت کند. البته گفتن آسانتر از انجام آن، به ویژه در چنین رابطه رقابتی است. در حال حاضر کاهشی در محموله های خاکی کمیاب از چین به ایالات متحده وجود داشته است. داده‌های جدید گمرک چین نشان می‌دهد که در ماه آگوست نسبت به مدت مشابه سال قبل 13 درصد و نسبت به ماه قبل 20 درصد کاهش داشته است. مرحله جدیدی از تجارت ترامپ در حالی که ایالات متحده با امید به همکاری وارد اجلاس سران می شود، به نظر نمی رسد که از نشستن و بازی دفاعی راضی باشد. پرزیدنت ترامپ در آخر هفته گذشته گفت که با دانمارک بر سر گرینلند به توافق رسیده است که به ایالات متحده \"کنترل دائمی بر امنیت\" می دهد. در حالی که در این اعلامیه به صراحت به معدن اشاره نشده بود، سرمایه‌گذاران پیام گسترده‌تری را دیدند: ایالات متحده به دنبال منابع جایگزین خاک‌های کمیاب"}, {"source": "Business Insider", "title": "I spent a year looking for a job in tech. This is what got me a role.", "link": "https://www.businessinsider.com/software-engineer-job-search-one-year-offer-2026-9", "summary": "Jinyoung Oh spent about a year looking for a job in tech. Courtesy of Jinyoung Oh Jinyoung Oh recently got an offer at a software company after a year of job searching . He applied to hundreds of jobs each month, yet focused on building skills through practice problems. \"I was locked in. I was ready for this,\" he said of the interview that led to his offer. Jinyoung Oh, 23, recently received an offer to work as a software engineer after about a year of searching. He lives in Seattle. The following has been edited for brevity and clarity. I started looking for jobs last September, before I graduated in May. When I started college, I thought I would easily find a job, but during my sophomore and junior years, I realized the market was really competitive . By senior year, I worried I had made the wrong choice in studying computer science and thought, \"I might be cooked.\" But I had already spent four years doing this, so I wanted to at least try one year of straight recruiting. Just after graduation, I had a final round interview with a Big Tech company. For a week straight, I stayed home and did LeetCode, which is a problem-solving platform where you practice for interviews . During the interview, I thought I got most of the questions right, but I didn't get the offer. There was no feedback. After that, I was demotivated because I didn't know how much more I had to prep or how competitive this market would be. I wasn't hearing back from companies . I kept a spreadsheet and applied to at least 300 jobs every month, and I would often hear back zero or one time. I focused on developing my skills My brother does computer stuff as well. When I was in college, he told me, I had to practice during the summer. So I started doing the problems whenever I had time. During school, I was busy but still trying to solve at least a few problems every month. After school, I was feeling kind of hopeless, but I kept solving practice problems and making my own projects to keep developing my skills so that I could be a better engineer. Initially, I was using a lot of AI and was just prompting. I also wanted to make sure my coding skills were at the level companies would expect, so for some projects I worked on, like creating a reminder app, I tried to use as little AI as possible and coded everything manually. My approach was to wake up, eat breakfast, go to the library, and work on problem-solving for three or four hours. Then I'd get lunch, spend three or four hours working on ", "date_str": "2026-09-22T09:46:01+00:00", "hash": "594d7556c5e2ffe7", "title_fa": "من یک سال به دنبال کار در فناوری بودم. این همان چیزی است که من را به یک نقش رساند.", "summary_fa": "جین یونگ او حدود یک سال به دنبال شغلی در زمینه فناوری بود. با حسن نیت از Jinyoung Oh Jinyoung Oh اخیراً پس از یک سال جستجوی شغل پیشنهادی در یک شرکت نرم افزاری دریافت کرد. او هر ماه برای صدها شغل درخواست داد، با این حال بر روی ایجاد مهارت از طریق مشکلات تمرینی تمرکز کرد. او در مورد مصاحبه ای که منجر به پیشنهادش شد، گفت: \"من قفل شده بودم. برای این کار آماده بودم.\" جین یونگ اوه، 23 ساله، اخیراً پس از حدود یک سال جستجو، پیشنهادی برای کار به عنوان مهندس نرم افزار دریافت کرد. او در سیاتل زندگی می کند. موارد زیر برای اختصار و وضوح ویرایش شده است. من شروع به جستجوی شغل در سپتامبر گذشته کردم، قبل از اینکه در ماه مه فارغ التحصیل شوم. وقتی کالج را شروع کردم، فکر می‌کردم به راحتی شغلی پیدا می‌کنم، اما در سال‌های دوم و دوم، متوجه شدم بازار واقعاً رقابتی است. در سال آخر، نگران بودم که انتخاب اشتباهی در تحصیل در رشته کامپیوتر داشته باشم و فکر کردم: \"ممکن است پخته شوم.\" اما من قبلاً چهار سال را صرف این کار کرده بودم، بنابراین می‌خواستم حداقل یک سال استخدام مستقیم را امتحان کنم. درست پس از فارغ التحصیلی، آخرین مصاحبه با یک شرکت فناوری بزرگ داشتم. برای یک هفته متوالی، من در خانه ماندم و LeetCode را انجام دادم، که یک پلتفرم حل مشکل است که در آن برای مصاحبه تمرین می‌کنید. در طول مصاحبه، فکر می‌کردم بیشتر سؤال‌ها را درست مطرح کرده‌ام، اما پیشنهادی دریافت نکردم. هیچ بازخوردی وجود نداشت. بعد از آن، من بی انگیزه شدم، زیرا نمی دانستم چقدر بیشتر باید آماده کنم یا این بازار چقدر رقابتی خواهد بود. من از شرکت ها خبری نداشتم. من یک صفحه گسترده نگه می داشتم و هر ماه برای حداقل 300 شغل درخواست"}, {"source": "Business Insider", "title": "Morgan Stanley says to buy these 15 high-quality stocks juicing profits ahead of earnings season", "link": "https://www.businessinsider.com/stocks-to-buy-now-earnings-season-strong-profits-high-quality-2026-9", "summary": "Michael M. Santiago/Getty Images Morgan Stanley says stocks are entering the middle part of a cycle, when quality names outperform. The bank's CIO said to stick with the quality trade, and shared a list of overweight-rated stocks. The include companies like ServiceNow, Coca-Cola, Visa, and Gilead. A few years of red-hot stock returns, some shaky recent economic data, sticky inflation, and a Fed raising interest rates may make you worry we're nearing the end of an economic cycle. But really, we're in a \"classic\" mid-cycle market environment, Morgan Stanley says. Stocks and the economy have plenty of room to run, the bank says. In a note to clients on Monday, the bank said that there are some \"hallmark\" signs of mid-cycle dynamics. For one, GDP numbers are robust. The market is also starting to place emphasis on stocks whose earnings continue to grow, even in the face of rate hikes. Mike Wilson, Morgan Stanley's chief investment officer, said that these high-quality stocks would continue to outperform and that investors should ride the trend as another earnings season approaches. \"Stick with large cap quality stocks,\" Wilson wrote in the note. \"Our factor work continues to show quality-oriented factors such as high free cash flow yield and low accruals leading the market.\" He continued: \"Factors tied to operating efficiency are also seeing clear outperformance, with the high sales-per-employee factor up 5% over the last month. In our view, this ties directly to our constructive call on AI adopters.\" Morgan Stanley has its own quality-factor criteria, with some mentioned above. But generally, quality stocks have consistent and stable earnings growth, high profit margins, a durable competitive advantage, a proven management team, and a healthy balance sheet. In the note, the bank shared a list of high-quality stocks that fit four criteria: top 1,000 by market cap, improved earnings estimates from three months ago, top third in Morgan Stanley's quality screen, and rated \"Overweight\" by the bank's analysts. Below, we've listed in descending order the 15 largest stocks on the list by market cap. NVIDIA Morningstar.com Ticker: NVDA Sector: Information Technology Industry group: Semiconductors Semiconductor Equipment Market cap: $5.28 trillion Apple Morningstar.com Ticker: AAPL Sector: Information Technology Industry group: Technology Hardware Equipment Market cap: $4.91 trillion Micron Technology Morningstar.com Ticker: MU Sector: Information Technology Industry g", "date_str": "2026-09-22T09:35:01+00:00", "hash": "731f35b4fa798d52", "title_fa": "مورگان استنلی می‌گوید این 15 سهم با کیفیت بالا را می‌خرد و سود آن را پیش از فصل سود می‌برد.", "summary_fa": "مایکل ام. سانتیاگو/ گتی ایماژ مورگان استنلی می گوید سهام در حال ورود به بخش میانی یک چرخه هستند، زمانی که نام های کیفیت بهتر عمل می کنند. مدیر عامل بانک گفت که به تجارت باکیفیت پایبند است و فهرستی از سهام دارای ارزش اضافه وزن را به اشتراک گذاشت. این شرکت‌ها شامل شرکت‌هایی مانند ServiceNow، کوکاکولا، ویزا و گیلیاد می‌شوند. چند سال بازدهی داغ سهام، برخی داده‌های متزلزل اقتصادی اخیر، تورم ثابت و افزایش نرخ بهره توسط فدرال رزرو ممکن است شما را نگران کند که به پایان چرخه اقتصادی نزدیک می‌شویم. مورگان استنلی می‌گوید، اما واقعاً، ما در یک محیط بازار میان دوره‌ای «کلاسیک» هستیم. بانک می گوید که سهام و اقتصاد فضای زیادی برای اجرا دارند. این بانک در یادداشتی به مشتریان در روز دوشنبه اعلام کرد که نشانه‌هایی از پویایی اواسط چرخه وجود دارد. برای یکی، اعداد تولید ناخالص داخلی قوی هستند. بازار همچنین شروع به تأکید بر سهامی می کند که درآمد آنها حتی در مواجهه با افزایش نرخ ها همچنان به رشد خود ادامه می دهد. مایک ویلسون، مدیر ارشد سرمایه‌گذاری مورگان استنلی، گفت که این سهام باکیفیت به عملکرد بهتر خود ادامه خواهند داد و سرمایه‌گذاران باید با نزدیک شدن به فصل دیگر سود، این روند را دنبال کنند. ویلسون در یادداشت نوشت: «با سهام باکیفیت کلاهک بزرگ بچسبید. کار فاکتورهای ما همچنان نشان می دهد که عوامل کیفیت محور مانند بازده جریان نقدی آزاد بالا و اقلام تعهدی پایین که بازار را هدایت می کنند.\" وی ادامه داد: \"عوامل مرتبط با بهره وری عملیاتی نیز عملکرد بهتری را مشاهده می کنند، با ضریب فروش بالا به ازای هر کارمند که طی ماه گذشته 5 درصد افزایش یافته است. از نظر ما، این به طور مستقیم با تماس سازنده ما با پذیرندگان هوش مصنوعی مرتبط است.\" مورگان استنلی معیارهای فاکتور کیفیت خاص خود"}, {"source": "Business Insider", "title": "What happens when an art piece goes viral? For one 23-year-old, it meant financial stability, a new apartment, and $80,000 tied up in delayed orders.", "link": "https://www.businessinsider.com/artist-went-viral-on-instagram-changed-his-finances-2026-9", "summary": "Oskar Flodstrom s pill bottle side table went viral and became the basis for his first product release with NO LOGO. NO LOGO Oskar Flodstrom, 23, went viral after creating a pill-bottle side table. With NO LOGO's help, he brought the design to market and generated $150,000 in two weeks. The hit let him leave swim teaching, but brought production delays and cash-flow pressure. When I called Oskar Flodstrom on a Wednesday, late morning, the 23-year-old Los Angeles designer politely asked whether we could talk while he was \"kind of working on something.\" He was restoring a Sonneman Orbiter lamp he had picked up on Facebook Marketplace for about $30. If he cleaned it up well, he said, it could be worth thousands. \"I live on Facebook Marketplace,\" Flodstrom told me. He has developed an eye for overlooked objects: He recently found a Paul Smith rug for $50 that he believes could fetch far more, up to 10 grand, after a professional cleaning. In Los Angeles, at least, he's noticed that convenience can outweigh price, and many sellers, particularly those with money, would rather have an item gone than hold out for a better offer. That instinct for salvaging and transforming discarded materials helped turn Flodstrom into a working artist — though he still sounds surprised by the title. \"I wake up, and I'm an artist, which doesn't even feel real to say,\" he mused. Flodstrom grew up in Illinois, skipped college, and moved to Los Angeles with about $400. NO LOGO Flodstrom grew up in Peru, Illinois, a town of roughly 10,000 people that he describes as \"the middle of nowhere.\" At 18, he chose to skip college and drove west with about $400, an apartment found through Roomster, and a plan to make rent by delivering DoorDash orders. \"Besides those details, there was, like, no direction, and I was cool with it,\" he said. Cracking the Instagram code Flodstrom initially moved to Los Angeles to pursue music, but he figured out how to monetize art and design first. Growing up, he never thought of himself as an artist. Still, he liked making things with his hands — \"little baseball bats out of wood,\" he said — and modifying old toys. Today, he describes the physical act of creating and building as a kind of meditation. Flodstrom s $2,000 vintage Mercedes in Los Angeles. NO LOGO For years, he made pieces while stringing together income from side hustles, including swim lessons. He sold the occasional artwork, but \"nothing was really popping,\" he said. Over time, he came to realize", "date_str": "2026-09-22T09:30:01+00:00", "hash": "63b15641013b5aa5", "title_fa": "وقتی یک اثر هنری در فضای مجازی منتشر می شود چه اتفاقی می افتد؟ برای یک جوان 23 ساله، این به معنای ثبات مالی، یک آپارتمان جدید و 80000 دلار بود که در سفارشات تاخیری بسته شده بود.", "summary_fa": "میز کناری بطری قرص اسکار فلودستروم به سرعت منتشر شد و مبنایی برای عرضه اولین محصول او با NO LOGO شد. NO LOGO اسکار mo, a 41-year-old human resources manager at a major footwear company in Mississippi. The following has been edited for length and clarity. I'm the distribution center human resources manager at a major footwear company. I started at the company in 2019. Before this job, I worked at a staffing and recruiting firm where I supported footwear and retail brands. I don't want to work until I'm 80 years old. I'd like to retire around 65 and open a coffee shop because I have such a passion for it. Here's my plan to make that happen. I was born in Venezuela I came to the United States in 2009 on a cultural exchange program as an au pair . I lived with an American family in Germantown, Tennessee, for almost two years. I worked full-time as an au pair and studied English and human resources management. I met my husband in 2010, and we got married in 2013. I became a US citizen in 2019. The US is a place where you have a lot of opportunities, avenues, and ways to access a home and a car. There's a lot of financial temptation. Some people have a problem with alcohol, some with gaming. I had a problem with spending. My way of demonstrating love was by spending on gifts for family members and on souvenirs while on vacation. At its highest, I had over $55,000 in credit card debt At one point, I had 10 credit cards. I tried to pay off my debt on my own, but I realized I needed some help. Through my company's employee assistance program, I learned about resources available to me. Money Management International was one of the options. Before I got help, my debt was not coming down; it was increasing because of credit card interest. With some help, I was able to redefine my budget and get out of the paycheck to paycheck cycle. My monthly payment during the three-year program was $1,077. Some months, I paid more than the monthly payments with bonuses I received at work. This April, I finally finished paying off my credit card debt. My husband and I also have a mortgage My husband owns
