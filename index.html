ary_fa": "جنسن هوانگ در GTC برلین ماه گذشته. | عکس: Soeren Stache/تصویر اتحاد از طریق Getty Images هیئت مدیره انویدیا اعلام کرد که جنسن هوانگ - بنیانگذار، رئیس و مدیرعامل قدیمی آن - پس از گزارش هایی مبنی بر دو رابطه خارج از ازدواج، یکی با یک جاسوس چینی و دیگری با یکی از مدیران انویدیا که به هوانگ گزارش داده است، استعفا داده است. پس از جلسه چهارشنبه شب، هیئت مدیره نامه استعفای هوانگ را به عنوان مدیرعامل، رئیس و عضو هیئت مدیره پذیرفت و بلافاصله اجرایی شد و کولت کرس، مدیر مالی فعلی، به عنوان مدیرعامل موقت منصوب شد. کرس از سال 2013 با انویدیا همکاری داشته است و قبلا در سیسکو و مایکروسافت حضور داشته است. انویدیا همچنین در غیاب هوانگ، ساختار شرکتی خود را تغییر می‌دهد و هاروی سی جونز، مدیر عامل سابق Synopsys را به‌عنوان صنوبر منصوب می‌کند… داستان کامل را در The Verge بخوانید. جنسن هوانگ، مدیر عامل شرکت انویدیا، جنسن هوانگ، مدیر عامل شرکت انویدیا استعفا داد پس از گزارش‌هایی مبنی بر دو رابطه خارج از ازدواج هوانگ با یک جاسوس و یکی از مدیران انویدیا، او خارج شد و کولت کرس، مدیر ارشد مالی انویدیا، وارد شد. Soeren Stache / ائتلاف تصویر از طریق Getty Images بخشی از همه چیزهایی است که تاکنون درباره رسوایی جاسوسی انویدیا با هدف قرار دادن مدیر عامل شرکت Jensen Huang می‌دانیم. او که بیش از پنج سال گزارشگری را شکست داد، کار او در CNBC، MIT Technology Review، Wired UK و سایر رسانه ها نیز منتشر شده است. هیئت مدیره انویدیا اعلام کرد که جنسن هوانگ - بنیانگذار، رئیس و مدیر عامل قدیمی آن - پس از گزارش هایی مبنی بر دو رابطه خارج از ازدواج، یکی با یک جاسوس چینی و دیگری با یکی از مدیران انویدیا که به هوانگ گزارش داده است، استعفا داده است.", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2301620664.jpg?quality=90&strip=all&crop=0%2C14.751764993408%2C100%2C70.496470013184&w=1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "Microsoft"], "datetime_fa": "۲۱ آبان • ۱۷:۲۳"}, {"source": "TechCrunch Main", "title": "Nvidia’s Jensen Huang resigns, chipmaker names CFO Colette Kress as interim CEO", "link": "https://techcrunch.com/2026/11/12/nvidias-jensen-huang-resigns-chipmaker-names-cfo-colette-kress-as-interim-ceo/", "summary": "Nvidia gets a new chief executive, days after former CEO Jensen Huang admitted to a romantic affair with an alleged Chinese spy.", "date_str": "2026-11-12T14:10:34+00:00", "hash": "a2760bfffd01a42a", "title_fa": "جنسن هوانگ انویدیا استعفا داد، تراشه‌ساز کولت کرس را به عنوان مدیرعامل موقت معرفی کرد.", "summary_fa": "چند روز پس از اعتراف جنسن هوانگ، مدیر عامل سابق، انویدیا مدیر اجرایی جدیدی پیدا کرد که با یک جاسوس چینی رابطه عاشقانه داشته است. این شرکت روز پنجشنبه گفت جنسن هوانگ از سمت خود به عنوان رئیس و مدیر اجرایی انویدیا استعفا داده است، تنها چند روز پس از اعتراف وی به رابطه عاشقانه با یک جاسوس چینی که جرقه بحران امنیت ملی در ایالات متحده را برانگیخت. انویدیا در یک پرونده نظارتی گفت که هیئت مدیره آن استعفای هوانگ را در روز چهارشنبه پذیرفت. انویدیا اعلام کرد که مدیر مالی فعلی و معاون اجرایی آن، کولیت کرس، تا زمانی که شرکت جانشین دائمی پیدا کند، به عنوان مدیر عامل موقت این شرکت انتخاب خواهد شد. کرس به عنوان مدیر مالی شرکت به خدمت خود ادامه خواهد داد. سهام انویدیا در معاملات صبح روز پنجشنبه نزدیک به 12 درصد کاهش یافت. از روز جمعه، سهام این شرکت تا 19 درصد کاهش یافته است که منجر به از دست دادن ارزش بازار بیش از 855 میلیارد دلار شده است. هوانگ انویدیا را در سال 1993 تاسیس کرد و از آن زمان تاکنون به عنوان مدیرعامل آن را رهبری می کند. تحت رهبری او، انویدیا نقش مهمی در توسعه واحد پردازش گرافیکی (GPU) ایفا کرد، یک تراشه تخصصی که پردازش گرافیکی را برای رایانه های شخصی انجام می دهد، همانطور که امروز می شناسیم. تراشه‌ها فورا مورد استقبال قرار نگرفتند و روزهای اولیه Nvidia با مبارزه و اخراج مشخص می‌شد، اما در نهایت، طراحی گرافیکی آن به قدری خوب بود که به استانداردی برای پردازش گرافیکی تبدیل شد. این تراشه‌ها همچنین در انجام همزمان تعداد زیادی محاسبات بسیار خوب عمل می‌کنند، که باعث محبوبیت آن‌ها برای کارهای محاسباتی مانند استخراج رمزنگاری و اخیراً آموزش و اجرای شبکه‌های عصبی، که مدل‌های هوش مصنوعی در هسته آن‌ها هستند، شده است.", "image_url": "https://techcrunch.com/wp-content/uploads/2025/03/GettyImages-2205210966.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۲۱ آبان • ۱۷:۴۰"}, {"source": "Ars Technica", "title": "Google pushes privacy angle as Gemini-powered smartglasses debut starting at $395", "link": "https://arstechnica.com/google/2026/11/google-pushes-privacy-angle-as-gemini-powered-smartglasses-debut-starting-at-395/", "summary": "Smartglasses have always faced an uphill road to acceptance. Not only is propping a computer up on your nose an uncomfortable proposition, but the privacy aspect has been vexing people since the Google Glass days . Now, Google is ready to take another swing at \" intelligent eyewear \" for the Gemini era after previewing its plans a couple of times. The first glasses are up for preorder today from Gentle Monster and Warby Parker, but they're no impulse buy. These devices are a collaboration between Google, Samsung, and the aforementioned eyewear designers. Gentle Monster and Warby Parker have each designed a few different frames, with options for transparent and tinted lenses. Samsung is providing the computing hardware that fits inside them, and Google has the software covered. Warby Parker has designed three frames for Google eyewear, called Alden, Reid, and Wren (see above). They are available with both standard optical and sun lenses in Pine, Saddle, and Jet Black colors at $395 and higher. Warby Parker is only selling devices in the US. Gentle Monster has gone a bit further with six styles, but Google hasn't told us any names for those yet. They come in dark red, pink, gray, and yellow colors and are available with clear, tinted, blue, or brown lenses. The Gentle Monster styles start a little higher at $449, and they will be available in the US and South Korea. Read full article Comments", "date_str": "2026-11-12T14:50:17+00:00", "hash": "741f9d666d3854d8", "title_fa": "گوگل با شروع اولین عینک هوشمند مجهز به جمینی که از 395 دلار شروع می شود، زاویه حریم خصوصی را افزایش می دهد.", "summary_fa": "عینک‌های هوشمند همیشه با مسیری سربالایی برای پذیرش روبرو بوده‌اند. نه تنها قرار دادن رایانه روی بینی شما یک پیشنهاد ناراحت کننده است، بلکه جنبه حفظ حریم خصوصی افراد را از روزهای Google Glass آزار می دهد. اکنون، گوگل پس از چند بار پیش‌نمایش برنامه‌های خود، آماده است تا تغییر دیگری در «عینک‌های هوشمند» برای عصر جمینی انجام دهد. اولین عینک امروز از Gentle Monster و Warby Parker برای پیش‌سفارش آماده شده است، اما آن‌ها بدون نیاز به خرید فوری هستند. این دستگاه ها با همکاری گوگل، سامسونگ و طراحان عینک فوق الذکر هستند. Gentle Monster و Warby Parker هر کدام چند فریم متفاوت با گزینه هایی برای لنزهای شفاف و رنگی طراحی کرده اند. سامسونگ سخت‌افزار محاسباتی را فراهم می‌کند که درون آن‌ها قرار می‌گیرد و گوگل نیز نرم‌افزار را پوشش می‌دهد. واربی ​​پارکر سه قاب برای عینک گوگل طراحی کرده است که Alden، Reid و Wren نام دارند (به بالا مراجعه کنید). آنها با لنزهای استاندارد نوری و آفتابی در رنگ های Pine، Saddle و Jet Black با قیمت 395 دلار و بالاتر در دسترس هستند. واربی ​​پارکر فقط دستگاه‌های خود را در ایالات متحده می‌فروشد. Gentle Monster با شش سبک کمی جلوتر رفته است، اما گوگل هنوز نامی برای آن ها به ما نگفته است. آنها در رنگ های قرمز تیره، صورتی، خاکستری و زرد هستند و با لنزهای شفاف، رنگی، آبی یا قهوه ای در دسترس هستند. سبک های Gentle Monster با قیمت 449 دلار کمی بالاتر شروع می شوند و در ایالات متحده و کره جنوبی در دسترس خواهند بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش عینک های هوشمند همیشه با جاده ای سربالایی برای پذیرش روبرو بوده اند. نه تنها", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/WP_ALDEN-Carousel_Lifestyle-copy-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲۱ آبان • ۱۸:۲۰"}, {"source": "Ars Technica", "title": "Nvidia CEO Jensen Huang has resigned", "link": "https://arstechnica.com/gadgets/2026/11/ceo-jensen-huangs-job-is-suddenly-on-the-line-at-nvidia/", "summary": "Nvidia chief executive Jensen Huang has resigned following revelations that he had two extramarital affairs, plunging the chipmaker at the heart of the global AI boom into crisis. The 63-year-old will be replaced by chief financial officer Colette Kress, who will serve as interim chief executive. His exit comes after he admitted to having a relationship with a woman that US authorities believe was a Chinese spy. It also emerged on Wednesday that Huang had an affair with a senior Nvidia executive. Read full article Comments", "date_str": "2026-11-12T14:05:17+00:00", "hash": "88a469109a7a693f", "title_fa": "جنسن هوانگ، مدیرعامل انویدیا استعفا داد", "summary_fa": "جنسن هوانگ، مدیر اجرایی انویدیا، پس از افشای دو رابطه خارج از ازدواج، از سمت خود استعفا داد و این سازنده تراشه در قلب رونق جهانی هوش مصنوعی را در بحران فرو برد. کولت کرس، مدیر مالی، جایگزین این 63 ساله خواهد شد که به عنوان مدیر اجرایی موقت خدمت خواهد کرد. خروج او پس از اعتراف به داشتن رابطه با زنی صورت می گیرد که مقامات آمریکایی معتقدند جاسوس چینی است. همچنین روز چهارشنبه مشخص شد که هوانگ با یکی از مدیران ارشد انویدیا رابطه نامشروع داشته است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. سهام انویدیا در معاملات قبل از بازار بیش از 10 درصد کاهش یافت که باعث افزایش زیان های قبلی پس از اعلام استعفای هوانگ شد. هوانگ، که در سال 1993 انویدیا را بنیانگذار کرد، آن را رهبری کرد که تا همین اواخر به ارزشمندترین شرکت جهان تبدیل شود. خروج هوانگ پایانی خیره کننده برای بیش از 33 سال تصدی او است که در طی آن انویدیا از یک شرکت کوچک تراشه بازی های ویدیویی به قطب اصلی رونق زیرساخت های هوش مصنوعی جهانی تبدیل شد. هوانگ به یکی از شناخته‌شده‌ترین چهره‌های فناوری تبدیل شده است، زیرا نیمه‌هادی‌های انویدیا برای آموزش و اجرای سیستم‌های هوش مصنوعی مانند ChatGPT OpenAI و Anthropic's Claude یکپارچه شدند. سهام انویدیا پس از اعلام این شرکت مبنی بر استعفای جنسن هوانگ از سمت مدیر اجرایی، کاهش قبل از بازار را افزایش داد.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/09/GettyImages-2296993009-1024x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Nvidia"], "datetime_fa": "۲۱ آبان • ۱۷:۳۵"}, {"source": "Ars Technica", "title": "Hundreds of streaming services and nothing to watch", "link": "https://arstechnica.com/gadgets/2026/11/hundreds-of-streaming-services-and-nothing-to-watch/", "summary": "“Fifty-seven channels, and nothin’ on.” Bruce Springsteen famously said those words during a concert and later in a song in the 1990s about the number of TV channels seemingly growing disproportionately to the availability of enjoyable content. Within a few years, there would be hundreds of TV channels and still, some would argue in hyperbolic frustration, “ nothing to watch.” Read full article Comments", "date_str": "2026-11-12T14:00:19+00:00", "hash": "34b19395e11170bd", "title_fa": "صدها سرویس استریم و چیزی برای تماشا", "summary_fa": "\"پنجاه و هفت کانال و هیچ چیز روشن نیست.\" بروس اسپرینگستین این کلمات را در طول یک کنسرت و بعداً در یک آهنگ در دهه 1990 در مورد تعداد کانال های تلویزیونی که ظاهراً به طور نامتناسبی نسبت به در دسترس بودن محتوای لذت بخش افزایش می یافت، گفت. در عرض چند سال، صدها کانال تلویزیونی وجود خواهد داشت و هنوز، برخی با ناامیدی هذلولی استدلال می‌کنند که «چیزی برای تماشا کردن نیست». مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش \"پنجاه و هفت کانال و هیچ چیز\" به حداقل برسانید. ظهور خدمات استریم به عنوان یک راه حل بالقوه برای این مشکل در نظر گرفته شد. به بینندگان امکان دسترسی آسان و درخواستی به هزاران فیلم و نمایش را می‌دهد، که از نظر تئوری می‌تواند تضمین کند که بینندگان همیشه چیزی برای تماشا پیدا کنند. با این حال، طبق نظرسنجی Nielsen’s Gracenote، امروز دقیقاً اینطور نیست. Gracenote، یک کسب‌وکار داده‌های محتوایی متعلق به نیلسن، از 3000 کاربر پخش ویدئو در ایالات متحده، برزیل، فرانسه، آلمان، مکزیک و بریتانیا که حداقل 18 سال سن داشتند، برای گزارش \"وضعیت بازی 2026: در میان ناامیدی‌های پراکنده، UX آینده استریم است\" نظرسنجی کرد. متوجه شد که بسیاری برای یافتن چیزی برای پخش کردن تلاش می کنند. با این حال، این لزوماً به این دلیل نیست که هیچ چیز خوبی در آن وجود ندارد، بلکه به این دلیل است که آنها به سختی می‌توانند محتوای خوب را در سرویس‌های پخش پخش کنند. برای مثال، بیش از 51 درصد از پاسخ‌دهندگان گفتند که «فراوانی محتوا و خدمات [جریان‌سازی] یافتن چیزی برای تماشا را سخت‌تر می‌کند». علاوه بر این، 19.2 درصد از پاسخ دهندگان گفتند که به طور متوسط ​​یا «همیشه» یا «اغلب» نمی دانند چه چیزی", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/GettyImages-2230766677-1024x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Engadget", "title": "Jensen Huang is out as NVIDIA CEO", "link": "https://www.engadget.com/2314584/jensen-huang-is-out-as-nvidia-ceo/", "summary": "He has held the position since the company s founding.", "date_str": "2026-11-12T14:04:30+00:00", "hash": "cdf609c2f7fd9650", "title_fa": "جنسن هوانگ به عنوان مدیرعامل NVIDIA کنار گذاشته شد", "summary_fa": "او از زمان تأسیس این شرکت این سمت را بر عهده داشته است. Heather Diehl/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover Jensen Huang دیگر مدیر عامل NVIDIA نیست. روز پنجشنبه، هیئت مدیره NVIDIA اعلام کرد که هوانگ از سمت خود به عنوان رئیس و مدیر اجرایی این شرکت استعفا داده است و بلافاصله اجرایی می شود. هوانگ نیز صندلی هیئت مدیره خود را واگذار کرد. انویدیا کولت کرس، معاون اجرایی فعلی و مدیر مالی شرکت را به عنوان مدیرعامل موقت معرفی کرد. انویدیا گفت: کرس به عنوان معاون اجرایی و مدیر ارشد مالی و در حین خدمت به عنوان مدیر اجرایی موقت تا زمانی که جانشین دائمی معرفی شود، ادامه خواهد داد. \"هیئت مدیره جستجو برای یافتن یک مدیر اجرایی دائمی را آغاز کرده و نامزدهای داخلی و خارجی را بررسی خواهد کرد.\" به عنوان بخشی از تغییر، NVIDIA همچنین اولین رئیس هیئت مدیره خود را در هاروی جونز من r I Turned Pretty، خود را برای نوبت‌های پرستیژ در ویژگی‌های مورد انتظار A24 و Neon آماده می‌کند، در حالی که ویتنی پیک در حال آماده شدن برای بزرگترین نقش‌های خود تا به امروز در جدیدترین فیلم Hunger Games و Miami Vice است، جایی که او به مایکل بی جردن می‌پیوندد. در جای دیگر، تام فرانسیس پس از اجرای موسیقی نامزد تونی، در حال ساختن موفقیت‌های خود روی صفحه نمایش است، در حالی که Keyla Monterroso Mejia ممکن است پرکارترین ستاره‌ای باشد که در حال حاضر در تلویزیون کار می‌کند. داستان‌های مرتبط تلویزیون خارج از پردیس فصل 2 مجموعه‌های آوریل تاریخ اول پردیس THR داستان روی جلد رهایی چارلی دی املیو: چگونه ملکه TikTok زندگی خود را پس گرفت کلاس 2026 به فارغ‌التحصیلان نسل بعدی مانند Zendaya، Paul Mescal، Florence Pugh و اخیراً، David Jonsson تازه وارد پلنگ سیاه می‌پیوندد. مهم نیست که چگونه به این لحظه رسیده اند، این استعداد در حال حاضر مورد تقاضا است. همانطور که Sophie Nélisse برجسته است، رقابت داغ و جلیقه زردها می گوید: \"از نظر شغلی، این شلوغ ترین کاری است که من تا به حال داشته ام.\" در زمانی که کمدی‌های کمدی شبکه تقریباً منقرض شده‌اند و میانگین تعداد قسمت‌ها در یک فصل از کمدی‌های استریم که وجود دارند تک رقمی است (و این فصل‌ها تقریباً با فرکانس مشابه دنباله‌دار هالی می‌آیند)، مونتروسو مجیا توانسته است به چیزی تقریباً غیرممکن دست یابد:", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/TALENT_NEXT-GEN-WEB-LEADS_20262-SPLASH-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Hollywood Reporter", "title": "Rotterdam Film Festival, in Nod to ‘Backrooms’ and ‘Obsession,’ Sets Analog Horror 2.0 Focus", "link": "https://www.hollywoodreporter.com/movies/movie-news/rotterdam-2027-iffr-backrooms-nod-analog-horror-focus-1236753830/", "summary": "\"Recent horror hits, such as 'Obsession' and 'Backrooms,' mark the mainstream arrival of a cultural shift which has been in the making since the turn of the millennium.\" Also getting the focus treatment are Jordan Strafer, Slovenian filmmaker Andrej Zdravič, and the late Simon Field.", "date_str": "2026-11-12T14:00:00+00:00", "hash": "3200b2cfa10d0573", "title_fa": "جشنواره فیلم روتردام، در نود به «پشت‌خانه‌ها» و «وسواس»، فوکوس آنالوگ Horror 2.0 را تنظیم می‌کند.", "summary_fa": "فیلم‌های ترسناک اخیر، مانند «وسواس» و «پشت‌خانه‌ها» نشان‌دهنده ورود جریان اصلی یک تغییر فرهنگی است که از آغاز هزاره در حال شکل‌گیری بوده است.» جردن استرافر، فیلمساز اسلوونیایی آندری زدراویچ و سیمون فیلد فقید نیز تحت درمان قرار می گیرند. جشنواره بین‌المللی فیلم روتردام (IFFR) از برنامه‌های فوکوس خود برای نسخه ۲۰۲۷ خود، از جمله تمرکز بر فیلم ترسناک آنالوگ معاصر و نگاهی به آثار ایالات متحده، رونمایی کرد. هنرمند و فیلمساز جردن استرافر. برگزارکنندگان گفتند که روتردام همچنین «تأثیر ماندگار کاله بومان، تهیه‌کننده سوئدی را که شش دهه فعالیت او به شکل‌گیری نسل‌های فیلمساز کمک کرده است، جشن خواهد گرفت». برنامه‌ها با هم به بررسی ماهیت در حال تغییر سینما و افراد و تأثیراتی می‌پردازند که همچنان به شکل‌دهی آن ادامه می‌دهند، و دیدگاه‌های مختلف را گرد هم می‌آورند تا چگونگی ادامه تکامل رسانه، هم در صفحه و هم فراتر از آن را در نظر بگیرند.» تمرکز IFFR آنالوگ Nightmares 2.0 دارای اولین نمایش های جهانی مانند The Space Between اثر Joshua Garity و قسمت پایانی سریال YouTube Midwest Angelica: Landfall است که یک پروژه ترسناک، آنالوگ و کیهانی توسط استودیو AQ است. IFFR گفت: «آثارهای ترسناک اخیر، مانند Obsession و Backrooms، نشان دهنده ورود جریان اصلی یک تغییر فرهنگی است که از آغاز هزاره در حال شکل گیری بوده است. ترسناک آنالوگ با تکیه بر زیبایی‌شناسی رسانه‌های منسوخ، فیلم‌های یافت شده و پخش‌های تخیلی نگران‌کننده، زبان بصری و حساسیت متمایزی را ایجاد کرده است که توسط جوامع آنلاین، داستان‌گویی تعاملی و تخیل جمعی اینترنت شکل گرفته است. این پدیده با حرکت بین ویدیوهای آنلاین، بازی ها و بازی های واقعیت جایگزین، سینمای تئاتر و سایر اشکال ترانس مدیا، راه های جدیدی برای تجربه و درگیر شدن با وحشت ایجاد کرده است.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/The-Space-Between-film-still-IFFR-H-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۷:۳۰"}, {"source": "Hollywood Reporter", "title": "LGBTQ Representation on TV Dropped in 2025-26, GLAAD Study Finds", "link": "https://www.hollywoodreporter.com/tv/tv-news/tv-lgbtq-representation-falls-2025-26-glaad-report-1236753347/", "summary": "Despite high-profile successes like 'Heated Rivalry,' the overall picture last season was less rosy.", "date_str": "2026-11-12T14:00:00+00:00", "hash": "d525ccbadae14540", "title_fa": "تحقیقات GLAAD نشان می دهد که نمایش LGBTQ در تلویزیون در سال 2025-26 کاهش یافته است", "summary_fa": "علیرغم موفقیت‌های برجسته‌ای مانند «رقابت داغ»، تصویر کلی فصل گذشته کمتر گلگون بود. علی‌رغم موفقیت‌های ناگهانی Heated Rivalry و برنده‌های متعدد امی برای Pluribus، فصل 2025-26 سال ضعیفی برای نمایندگی LGBTQ در تلویزیون بود. گزارش سالانه «جایی که هستیم» در تلویزیون GLAAD درباره وضعیت شخصیت‌های LGBTQ در سریال‌های فیلم‌نامه‌ای نشان می‌دهد که در فصل گذشته بازنمایی 25 درصد کاهش یافته است. این گزارش 369 شخصیت LGBTQ را در برنامه های پخش، پخش و شبکه های کابلی شمارش می کند که از 489 در فصل 2024-25 کمتر است. کاهش در میان شخصیت‌های تراجنسیتی به‌ویژه قابل توجه بود و از 33 نفر در سال‌های 2024-25 به تنها هفت نفر در فصل گذشته رسید - همه آنها در برنامه‌هایی که این فصل برنمی‌گردند. این لزوماً به این معنی نیست که در این فصل هیچ شخصیت ترنس در تلویزیون وجود نخواهد داشت، فقط نمایش‌هایی که آن هفت شخصیت در سال‌های 2025-2026 در آن ظاهر شدند، ادامه نمی‌یابند، چه به این دلیل که سریال‌های محدودی بودند، یا لغو شدند یا به اجرای مداوم پایان دادند. داستان‌های مرتبط رقابت شدید تلویزیون با نمایش‌های 4DX فیلم‌ها آغاز شد. آنها به شیوه هایی تهاجمی و خطرناک مورد هدف قرار گرفته اند. راینا دیرواتر، نویسنده اصلی گزارش و معاون مدیر تحقیقات سرگرمی و تجزیه و تحلیل موسسه رسانه ای GLAAD، گفت که زندگی از دست رفته است. اغلب می‌بینیم که رسانه‌ها آن را منعکس می‌کنند، و به دلیل بسیاری از گفتگوهای سیاسی، تعجب آور نیست که شاهد سقوط نمایندگان ترنس در تلویزیون باشیم. اما بسیار ناامید کننده است، ب ate": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
