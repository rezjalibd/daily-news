ay. They chat through how Napster, digital distribution and streaming transformed the industry, while diving into how artists have more leverage and options now than ever before. With that leverage, though, come new challenges, from an overwhelming volume of songs to rising marketing costs. Love what you hear? Don’t forget to rate, review and subscribe so you never miss an episode of Billboard On The Record. Love what you hear? Follow Billboard On The Record on Instagram, TikTok, Apple Podcasts, Spotify and Youtube @billboard so you never miss an episode. Billboard On The Record is a podcast in partnership with SickBird Productions. Host: Kristin Robinson Executive Producers: Diona DaCosta Jade Watson Produced By: Kayla Forman Mateo Vergara Edited By: Rachel Derbyshire Kristin Robinson We re going to be talking about the evolution of what it means to be an independent artist, and you know better than most this whole evolution that s taken place. Starting in the early 90s, you were in a feminist punk band, uh, called Bratmobile. Moving more into the present day, you re the president of CD Baby. Molly Newman You had to have a label. That was really the barrier to distribution to getting into stores. That s obviously, like, the fundamental difference of what things are like now. Kristin Robinson Like, even hearing the story about an A R from a label approaching you after just seeing 20 minutes of your band play, it kind of feels quaint now to think about it. Molly Newman It s super quaint. The, the way that people find artists now is, is, you know, data-driven. Kristin Robinson I ve always been curious about how far you can make it as an independent artist before tapping into a major label. Molly Newman You sometimes feel like you have to have a PhD to understand what s happening in the mu-. . . music industry. Kirstin Robinson Yeah. Molly Newman Why would a, you know, an artist who is, you know, in their early 20s know the ins and outs of this complex business and industry? Watch the full video above!", "date_str": "2026-10-14T13:00:00+00:00", "hash": "1fd6d8002de585f2", "title_fa": "چگونه اینترنت همه چیز را برای هنرمندان مستقل تغییر داد | بیلبورد در رکورد", "summary_fa": "امروزه هنرمندان مستقل بیشتری از همیشه وجود دارد - اما آیا این واقعاً به این معنی است که مستقل بودن آسان‌تر شده است؟ مولی نیومن، رئیس CD Baby، با کریستین رابینسون مجری Billboard On The Record برای اپیزودی در مورد تکامل یک هنرمند مستقل، از دهه 90، زمانی که نیومن گروه پانک خود Bratmobile را راه اندازی کرد، تا امروز می نشیند. آن‌ها در مورد اینکه Napster، توزیع دیجیتال و پخش جریانی چگونه صنعت را متحول کردند، صحبت می‌کنند، در حالی که به این می‌پردازند که چگونه هنرمندان اکنون اهرم‌ها و گزینه‌های بیشتری نسبت به قبل دارند. با این وجود، با این اهرم، چالش‌های جدیدی به وجود می‌آیند، از حجم بسیار زیاد آهنگ‌ها تا افزایش هزینه‌های بازاریابی. عاشق آنچه می شنوید؟ فراموش نکنید که امتیاز دهید، مرور کنید و مشترک شوید تا هرگز قسمتی از Billboard On The Record را از دست ندهید. عاشق آنچه می شنوید؟ Billboard On The Record را در اینستاگرام، TikTok، Apple Podcasts، Spotify و Youtube @billboard دنبال کنید تا هرگز قسمتی را از دست ندهید. Billboard On The Record یک پادکست با همکاری SickBird Productions است. مجری: کریستین رابینسون تهیه‌کنندگان اجرایی: دیونا داکوستا جید واتسون تهیه‌کننده: کایلا فورمن متئو ورگارا تدوین: ریچل دربی‌شر کریستین رابینسون ما قرار است در مورد تکامل معنای هنرمند مستقل بودن صحبت کنیم، و شما بهتر از همه این تکاملی که رخ داده است، می‌دانید. از اوایل دهه 90، شما در یک گروه پانک فمینیستی، به نام برات‌موبایل بودید. با حرکت بیشتر به سمت امروز، شما رئیس CD Baby هستید. مولی نیومن شما باید یک برچسب داشته باشید. این واقعاً مانع توزیع برای ورود به فروشگاه ها بود. این بدیهی است که تفاوت اساسی در این است که اوضاع در حال حاضر چگونه است. کریستین رابینسون حتی با شنیدن داستانی در مورد یک A R از یک لیبل که فقط بعد"}, {"source": "Billboard", "title": "Travis Barker Recalls Text From Kourtney Kardashian That Got Them Out of the Friend Zone: ‘I Thought, ‘I Can’t Mess This Up’", "link": "https://www.billboard.com/music/music-news/travis-barker-text-kourtney-kardashian-out-of-friend-zone-1236360494/", "summary": "Travis Barker and Kourtney Kardashian were friends for more than a decade before the reality TV star sent the Blink-182 drummer a text that he said changed both their lives forever. Speaking to the U.K. s The Times , Barker, 50, recalled first befriending Kourtney s younger sister, Kim, in the early 2000 s when she was a wardrobe assistant to his then-girlfriend socialite Paris Hilton. Related After F1 Singapore Concert, Lana Del Rey Hints at Another Visit to Asia Travis Barker Leans Into Benefits of Shelter Pet Adoption and Meat-Free Lifestyle in PSA For Humane World For Animals: Just Do Good All-Star Cretin Family Featuring Green Day s Billie Joe Armstrong, Rancid s Tim Armstrong Travis Barker Celebrate Ramones 50th Anniversary The drummer, who grew up working class in Fontana, Calif., then became friendly with the whole ultra-glam, decidedly not blue collar Kardashian clan when he moved near them to Calbasas, Calif. after making some money in Blink. “I mean, even when we first met, I was obviously tattooed from head to toe and in a band. I think that’s why I felt so comfortable being Kourtney’s friend because we were such opposites, he told the paper. I was like, oh, I can think she’s cute or attractive or a great mom [Kourtney was mother to three children with her ex, Scott Disick] because we’re so different.” But things changed in 2021 when he said Kourtney texted something crazy to him that moved them out of the friend zone. “I was like, what? I had to look at my phone four times. I thought, there’s no way! I’d left any thoughts of us ever being anything more, he said. Barker recalled giving a mutual guy friend some dating advice about just having fun and hooking up with women, advising him to think of dating as a sport, while trying to not get too emotionally invested. Try to find your bearings,' he told his friend. And then Kourtney texted something to the effect of, ‘Why don’t you teach me how to find my bearings?’ He recalled thinking, Oh my gosh. And I was scared because I thought, I can’t mess this up, I can’t mess this up.” So, after being friends for 15 years and getting closer during the 2020 COVID lockdowns, the couple went Instagram official in 2021 and married in 2022 in a pair of ceremonies in California and Italy. Barker and Kardashian welcomed their first child, son Rocky Thirteen Barker , in 2023. Last week, Barker revealed he was recently hospitalized for surgery to deal with arm, hand and finger numbness due to a pinched nerve in hi", "date_str": "2026-10-14T12:35:10+00:00", "hash": "ba18b755c4e64ebd", "title_fa": "تراویس بارکر متنی از کورتنی کارداشیان را به یاد می آورد که آنها را از منطقه دوست خارج کرد: \"فکر کردم، \"نمی توانم این را به هم بریزم\"", "summary_fa": "تراویس بارکر و کورتنی کارداشیان بیش از یک دهه با هم دوست بودند قبل از اینکه ستاره تلویزیون واقعیت‌ها متنی را برای درامر Blink-182 ارسال کرد که به گفته او زندگی هر دو را برای همیشه تغییر داد. بارکر 50 ساله در گفتگو با روزنامه تایمز بریتانیا، اولین بار با خواهر کوچکتر کورتنی، کیم، در اوایل دهه 2000 دوست شد، زمانی که او دستیار کمد لباس دوست دخترش پاریس هیلتون بود. مرتبط پس از کنسرت F1 سنگاپور، لانا دل ری به بازدید دیگری از آسیا اشاره می کند. پنجاهمین سالگرد نوازنده درام، که در طبقه کارگر در فونتانا، کالیفرنیا بزرگ شد، پس از آن با کل اولترا-گلم‌ها دوست شد، قطعاً زمانی که به کالباساس، کالیفرنیا نقل مکان کرد، با خانواده کارداشیان یقه آبی نبود. پس از کسب درآمد در Blink. او به روزنامه گفت: «منظورم این است که حتی زمانی که برای اولین بار همدیگر را دیدیم، واضح است که من از سر تا پا و در یک گروه موسیقی خالکوبی شده بودم. فکر می‌کنم به همین دلیل است که من از بودن دوست کورتنی احساس راحتی می‌کردم زیرا ما بسیار متضاد بودیم. من فکر می‌کنم اوه، می‌توانم فکر کنم که او ناز یا جذاب یا یک مادر عالی است [کورتنی با سابقش، اسکات دیسیک، مادر سه فرزند بود] زیرا ما بسیار متفاوت هستیم.» اما همه چیز در سال 2021 تغییر کرد که او گفت کورتنی پیام دیوانه‌واری برای او ارسال کرد که آنها را از منطقه دوست خارج کرد. \"من مثل این بودم، چی؟ مجبور شدم چهار بار به گوشیم نگاه کنم. فکر کردم راهی نیست! او گفت، من هر فکری در مورد اینکه ما چیز دیگری هستیم را ترک کرده بودم. بارکر به یاد می‌آورد که به یک دوست پسر مشترک توصیه‌هایی درباره خوش‌گذرانی و ارتباط با زنان داده است، و به او توصیه می‌کند که قرار گذاشتن"}, {"source": "Billboard", "title": "Al Jardine Says Watching Footage of Former Beach Boys Bandmate Mike Love at Ryman Concert Was ‘Shocking’: ‘I’m Speechless’", "link": "https://www.billboard.com/music/pop/al-jardine-footage-beach-boys-mike-love-shocking-1236360485/", "summary": "Al Jardine saw the same footage of a struggling Mike Love performing with the Beach Boys at the Ryman Auditorium in Nashville on Sunday (Oct. 11), and despite their years of animosity and legal battles, he said he felt for his former bandmate of more than six decades. It s shocking and I was really depressed, Jardine told Rolling Stone about his concern for Love, 85, performing with the surf pop legends at a time when the last remaining original member of the group is struggling with his health. I had to really shake myself out of it just to get onstage. Just the optics of it were just awful and I m speechless, he said of the feelings he had watching Love remain seated during the band s show and sing the occasional background as the bandleader told the audience that he s been going through some health issues for quite a while. That same night, Jardine, 84, the only other surviving member of the Beach Boys, was playing his own show with fellow former Beach Boys band members Bruce Johnston and David Marks at the Cerritos Center for the Performing arts in Cerritos, Calif. His gig also featured appearances from Carnie Wilson (late Beach Boys founder Brian Wilson s daughter and member of the 1990s group Wilson Phillips), Marilyn Wilson (Brian Wilson s first wife), as well as Jan and Dean s Dean Torrence. Just hours before, Love performed what might have been one of his final shows with the group he helped co-found with his cousins Brian, Dennis and Carl Wilson (and friend Jardine) after playing more than 7,000 gigs with his group over 65 years. And while Jardine and Love are not in regular contact, the ex-Beach Boy said he hopes his former bandmate doesn t try to keep the endless summer going for much longer. I would hope not, he said when asked by RS if he thinks the band are going to play more shows. That s just not right, that I can see. Obviously, he s a total pro. He wants to be onstage, but he just doesn t know how not to do it. He doesn t know what else to do, so I think he s trapped. Love has sued guitarist-singer Jardine several times over his use of the Beach Boys name, including in 2003 for touring under the names Beach Boys Family Friends, Al Jardine, Beach Boy and Al Jardine of the Beach Boys, claiming that the gigs represented unfair competition with the Love-led Beach Boys. While it s unclear what issues Love is struggling with, longtime friend and honorary occasional Beach Boys member actor John Stamos wrote a lengthy letter ahead of Sunday s Ry", "date_str": "2026-10-14T12:06:06+00:00", "hash": "a6eaa41b769da40f", "title_fa": "ال جاردین می گوید تماشای فیلمی از هم گروه سابق بیچ بویز مایک لاو در کنسرت رایمن \"تکان دهنده\" بود: \"من بی کلام هستم\"", "summary_fa": "ال ژاردین همان فیلم یک مایک لاو را در حال اجرا با بیچ بویز در سالن رایمن در نشویل در روز یکشنبه (11 اکتبر) دید و علیرغم سالها خصومت و نبردهای قانونی آنها، او گفت که نسبت به هم گروه سابق خود که بیش از شش دهه است احساس می کند. این شوکه کننده است و من واقعاً افسرده بودم، ژاردین در مورد نگرانی خود برای عشق 85 ساله به رولینگ استون گفت که با افسانه های موج سواری پاپ اجرا می کند در زمانی که آخرین عضو اصلی گروه با سلامتی خود دست و پنجه نرم می کند. فقط برای اینکه روی صحنه بروم مجبور شدم واقعاً خودم را از آن رها کنم. فقط اپتیک آن افتضاح بود و من زبانم بند آمده بود، او در مورد احساساتی که از تماشای نشستن عشق در طول نمایش گروه و خواندن پیش زمینه های گاه به گاه داشت، گفت، در حالی که رهبر گروه به حضار گفت که او برای مدتی طولانی با برخی از مشکلات سلامتی روبرو بوده است. در همان شب، جاردین، 84 ساله، تنها عضو بازمانده دیگر از بیچ بویز، با دیگر اعضای سابق گروه بیچ بویز، بروس جانستون و دیوید مارکس، در مرکز هنرهای نمایشی سریتوس در سریتوس، کالیفرنیا، نمایش شخصی خود را اجرا می کرد. کنسرت او همچنین شامل حضور کارنی ویلسون (بنیانگذار فقید بیچ بویز)، برایان ویلسون، بنیانگذار دختر بیچ بویز 19 و برایان ویلسون، عضو گروه 9 ویلسون بود. مرلین ویلسون (همسر اول برایان ویلسون)، و همچنین دین تورنس، جان و دین. چند ساعت قبل، لاو با گروهی که به همراه پسر عموهایش برایان، دنیس و کارل ویلسون (و دوست جاردین) بعد از بیش از 7000 کنسرت با گروهش در طول 65 سال بنیانگذاری کردند، یکی از آخرین نمایش هایش را اجرا کرد. و در حالی که جاردین و لاو به طور منظم در"}, {"source": "Billboard", "title": "‘I Don’t Know Why He Filmed That:’ 50 Cent Talks Diddy Documentary on ‘Kimmel’", "link": "https://www.billboard.com/music/rb-hip-hop/50-cent-talks-diddy-documentary-kimmel-1236360474/", "summary": "Hip-hop artist, actor, producer, businessman, troublemaker. Curtis 50 Cent Jackson is all those things, proudly so. Jackson, or Fifty as he’s happy to be called, stopped by ABC s Jimmy Kimmel Live for a chat about life, new ventures and victories. Conversation moved swiftly along to his Diddy documentary, Sean Combs: The Reckoning , for Netflix, which bagged three Emmy nominations and won in the category for outstanding picture editing for a nonfiction program. “I actually win Emmys when people bother me,” quipped 50 Cent, who executive-produced the four-part special. The New York rap heavyweight also spoke of his good fortune on getting his hands on that award-winning, behind-the-scenes footage. “When you get a RICO charge, you forget to pay the guy who had the camera,” he said on the episode, which aired Tuesday night (Oct. 13). On seeing the rushes, “I was like, yo, this is going to be great. I’m going to blow the wheels off.” Diddy, Fifty reckons, “he saw the whole thing” on an iPad while incarcerated. “I’m sure (he) thought it was the best documentary he ever saw in his life.” In the 2000s, 50 Cent was in a club of his own with four No. 1s on the Billboard Hot 100, including a nine-week reign with 2003’s “In Da Club.” In the same year, he made an appearance on just the second episode of Jimmy Kimmel Live . Much has happened since. Speaking with Kimmel all those years later, Fifty confirmed he’s making a documentary series about himself; he remembered the late DMX; discussed his new movie, Paramount Pictures’ Street Fighter ; and admitted he was a “little bit” intimidated by Robert De Niro. Adapted from Capcom‘s iconic video game, Street Fighter hits theaters Oct. 16. Watch 50 Cent’s late-night interview below.", "date_str": "2026-10-14T09:56:41+00:00", "hash": "b138707c48ee6d5a", "title_fa": "«نمی‌دانم چرا آن را فیلم‌برداری کرد»: مستند 50 Cent Talks Diddy درباره «کیمل»", "summary_fa": "هنرمند هیپ هاپ، بازیگر، تهیه کننده، تاجر، دردسرساز. کرتیس 50 سنت جکسون همه آن چیزها است، با افتخار. جکسون، یا همان طور که خوشحال است او را پنجاه می نامند، با جیمی کیمل از شبکه ABC برای گفتگو در مورد زندگی، سرمایه گذاری های جدید و پیروزی ها توقف کرد. مکالمه به سرعت به مستند دیدی او، شان کامبز: حسابرسی، برای نتفلیکس رسید، که سه نامزدی امی را به دست آورد و در بخش ویرایش تصویر برجسته برای یک برنامه غیرداستانی برنده شد. 50 سنت که تهیه کننده اجرایی این فیلم ویژه چهار قسمتی بود، با کنایه گفت: «در واقع وقتی مردم مرا اذیت می کنند، جایزه امی را می برم. این بازیگر سنگین وزن رپ نیویورکی همچنین از شانس خوب خود در دستیابی به آن فیلم برنده جایزه و پشت صحنه صحبت کرد. او در این اپیزود که سه شنبه شب (13 اکتبر) پخش شد، گفت: \"وقتی هزینه RICO دریافت می کنید، فراموش می کنید به کسی که دوربین را در اختیار دارد پول بدهید.\" با دیدن عجله ها، \"من فکر می کردم، بله، این عالی خواهد شد. من می‌خواهم چرخ‌ها را منفجر کنم.» دیدی، فیفتی فکر می‌کند، «او همه چیز را در حالی که در زندان بود، روی یک آی‌پد دید. مطمئنم (او) فکر می‌کرد که این بهترین مستندی است که در زندگی‌اش دیده است.» در دهه 2000، 50 سنت در یک کلوب مخصوص خود با چهار نفر شماره 1 در بیلبورد هات 100، از جمله یک سلطنت 9 هفته ای با \"In Da Club\" در سال 2003 بود. در همان سال، او فقط در قسمت دوم جیمی کیمل لایو ظاهر شد. از آن زمان خیلی اتفاق افتاده است. فیفتی در صحبت با کیمل تمام آن سال‌ها تایید کرد که در حال ساخت یک سریال مستند درباره خودش است. او مرحوم DMX را به یاد آورد. درباره فیلم"}, {"source": "Billboard", "title": "‘The Voice’ Singers Chari and Marcus Ladden Jr. Power Through ‘Incredible’ Battle With ‘On My Own’: Watch", "link": "https://www.billboard.com/culture/tv-film/the-voice-chari-marcus-ladden-jr-battle-on-my-own-1236360461/", "summary": "When Chari and Marcus Ladden Jr. decided to contest NBC s The Voice , they sure did come to the right place. Chari, a surgical technologist by day, bagged a perfect four-chair turn in the Blind Auditions with a performance of Oleta Adams Get Here. The 31-year-old Atlanta singer went on to join Queen Latifah’s team. Ladden turned up the feels for his audition, hitting Julie London’s Cry Me a River, and earning himself turns from Queen and Kelly Clarkson. The 19-year-old hopeful is also from Atlanta, he attended the same school as Chari, and went with Team Queen. Both are impressive talents, too. With the Battle Round underway, Chari and Ladden went head-to-head with Patti LaBelle and Michael McDonald s On My Own,” a Billboard Hot 100 leader in 1986. Progress in the competition awaits the winner, exit for the loser. If that wasn’t enough pressure, LaBelle herself was on board as the Battle Advisor to Latifah. Chari and Marcus went at it with style and class. “Well, that was ‘On My Own’ but y’all sound pretty good together,” quipped Riley Green. It was a joke there for the taking, and the country artist and judge got in first. “I loved every second of that. Y’alls vocals are unreal. That was an awesome performance.” Queen, he said as he looked at her, “good luck. I don’t know how you’re going to do it.” Kelly Clarkson remarked that Marcus’ tone was “gorgeous” and “fills the room,” with runs that were “crazy beautiful.” Chari, well, Clarkson has been in love with her vocals since the Blinds. “It seems effortless from you.” Both are “gifted vocalists,” she enthused. They crushed the song. Like all his rival coaches, Adam Levine turned for Chari. “In a way, it’s no surprise,” he said of her elite effort in this knockout phase. Marcus, however, showed a lot of grit and guts for a lad who was not expected to triumph. He stepped up to the challenge and “did an amazing job,” the Maroon 5 frontman noted. Latifah had a difficult decision to make. “I thought it was incredible. I’m so proud of both of you,” she explained. “You have done a phenomenal job.” The teen reminded Queen of Jeffrey Osborne, Latifah added, while Chari did “an extraordinary job” of making the song her own. Ultimately, Latifah went with Chari. But that wasn’t the end of the line for Ladden, who earned a lifeline when Clarkson used her steal. Everyone wins. The Voice is currently celebrating its 30th season, with episodes airing Mondays and Tuesdays at 8 p.m. ET on NBC, streaming next day on Peacock", "date_str": "2026-10-14T08:40:01+00:00", "hash": "115ef90fba995e61", "title_fa": "چاری و مارکوس لادن جونیور خوانندگان «صدا» قدرت از طریق نبرد «شگفت انگیز» با «به تنهایی»: تماشا کنید", "summary_fa": "زمانی که چاری و مارکوس لادن جونیور تصمیم گرفتند در شبکه ان‌بی‌سی The Voice شرکت کنند، مطمئناً به جای درستی آمدند. چاری، یک تکنسین جراحی روزانه، با اجرای Oleta Adams Get Here، یک چرخش کامل با چهار صندلی در Blind Auditions انجام داد. خواننده 31 ساله آتلانتا به تیم کوئین لطیفه پیوست. لادن برای تست بازیگری خود، به آهنگ Cry Me a River اثر جولی لندن ضربه زد و از ملکه و کلی کلارکسون به دست آورد. امید 19 ساله نیز اهل آتلانتا است، او در همان مدرسه چاری تحصیل کرد و با تیم کوئین رفت. هر دو نیز استعدادهای چشمگیری هستند. با شروع دور نبرد، چاری و لادن با پتی لابل و مایکل مک‌دونالد به تنهایی، یکی از رهبران 100 بیلبورد داغ در سال 1986 رودررو شدند. پیشرفت در رقابت در انتظار برنده است، خروج برای بازنده. اگر فشار کافی نبود، لابل به عنوان خودش روی بتل بود. چاری و مارکوس با سبک و کلاس به آن پرداختند. رایلی گرین با کنایه گفت: «خب، این «به تنهایی» بود، اما با هم صدای خوبی دارید. این یک شوخی بود و هنرمند و داور کشور اول وارد صحنه شدند. \"من هر ثانیه آن را دوست داشتم. آواز Y'alls غیر واقعی است. اجرای فوق العاده ای بود.\" ملکه، در حالی که به او نگاه می کرد، گفت: \"موفق باشید. من نمی‌دانم چگونه می‌خواهی این کار را انجام دهی.» کلی کلارکسون خاطرنشان کرد که لحن مارکوس \"زیبا\" بود و \"اتاق را پر می کرد\" با دویدن هایی که \"دیوانه کننده زیبا\" بودند. چاری، خب، کلارکسون از زمان Blinds عاشق آواز او بوده است. \"از شما بی زحمت به نظر می رسد.\" او مشتاق شد هر دو \"خواننده با استعداد\" هستند. آهنگ را خرد کردند. آدام لوین مانند تمام مربیان رقیب خود به چاری روی آورد. او در مورد تلاش نخبگان خود در این"}, {"source": "Billboard", "title": "Cezary Skubiszewski to Be Saluted at 2026 Screen Music Awards", "link": "https://www.billboard.com/music/awards/cezary-skubiszewski-saluted-2026-screen-music-awards-1236360450/", "summary": "Cezary Skubiszewski will receive the distinguished services to the Australian screen award later this month, the top honor at the annual Screen Music Awards. The legendary Polish Australian screen music composer will be lauded for his “extraordinary body of work” across 30-plus years on the Australian screen, according to organizers APRA AMCOS, from Neighbours, to the beloved feature films Two Hands and Red Dog and much more . Born in Warsaw, Poland in 1948, Skubiszewski was a prodigious talent. He played piano and studied classical music under the choir director of the Warsaw Opera, before moving to Paris, London and then Sydney in the 1970s. After a time training as a veterinarian, Skubiszewski returned to his calling and joined the jazz-rock group Corroboree before the decade was done. Skubiszewski had a knack for jingle writing, and would expand his music palate into orchestral and theater work throughout the 1980s, and he’d land television commissions, including the popular series Sky Trackers and Neighbours . He made the leap to the silver screen with the score for Lilian’s Story in 1996, which landed him the Asia-Pacific Film Festival award for best music. Skubiszewski go on to compose scores for some of Australia’s most iconic brands and films, including Two Hands (1999) and Red Dog (2011), in addition to compositions for the Sydney 2000 Olympic Games and Melbourne 2006 Commonwealth Games. “Thank you very much for this wonderful honor, it came as a big surprise to me and I am deeply grateful to APRA for recognizing my work with this distinguished service award,” remarks Skubiszewski in a statement. “This achievement belongs just as much to the incredible colleagues, mentors and family members who supported and inspired me along the way. I feel most fortunate indeed. A former music director and 12-time winner at the Screen Music Awards, Skubiszewski’s collection of trophies include four AACTA Awards, four AGSC Awards, the Centenary Medal in 2003 for service to Australian society and film production, and the Film Critics Circle of Australia’s Life Achievement Award in 2010 for his contribution to Australian cinema. Later in his career, Skubiszewski formed a formidable creative partnership with his own son, Jan, which has included award-winning work for Serangoon Road (2014), Picnic at Hanging Rock (2018), and High Country (2024). Presented by APRA AMCOS and the Australian Guild of Screen Composers (AGSC), the Screen Music Awards celebrate excellence ", "date_str": "2026-10-14T06:50:13+00:00", "hash": "3aca918229aae0aa", "title_fa": "سزاری اسکوبیشفسکی در جوایز موسیقی اسکرین 2026 مورد ستایش قرار می گیرد", "summary_fa": "سزاری اسکوبیشفسکی در اواخر این ماه خدمات ممتازی را برای جایزه اکران استرالیا دریافت خواهد کرد که بالاترین افتخار در جوایز سالانه موسیقی اسکرین است. به گفته برگزارکنندگان APRA AMCOS، از همسایه‌ها، تا فیلم‌های داستانی دوست‌داشتنی Two Hands و Red Dog و خیلی چیزهای دیگر، آهنگساز افسانه‌ای موسیقی لهستانی استرالیایی به‌خاطر «کارهای خارق‌العاده‌اش» در بیش از 30 سال در اکران استرالیا مورد ستایش قرار خواهد گرفت. اسکوبیشفسکی که در سال 1948 در ورشو، لهستان به دنیا آمد، یک استعداد فوق العاده بود. او پیانو می نواخت و موسیقی کلاسیک را زیر نظر سرپرست گروه کر اپرای ورشو آموخت، قبل از اینکه در دهه 1970 به پاریس، لندن و سپس سیدنی رفت. پس از مدتی آموزش به عنوان دامپزشک، Skubiszewski به کار خود بازگشت و قبل از پایان دهه به گروه جاز-راک Corroboree پیوست. Skubiszewski در نویسندگی جینگل مهارت داشت و کام موسیقی خود را به کارهای ارکسترال و تئاتر در طول دهه 1980 گسترش داد و سفارشات تلویزیونی از جمله سریال محبوب Sky Trackers و Neighbors را دریافت کرد. او با موسیقی فیلم Lilian’s Story در سال 1996 به پرده نقره ای جهش کرد که جایزه بهترین موسیقی جشنواره فیلم آسیا-اقیانوسیه را برای او به ارمغان آورد. Skubiszewski در ادامه آهنگسازی برای برخی از معروف‌ترین برندها و فیلم‌های استرالیا، از جمله Two Hands (1999) و Red Dog (2011)، علاوه بر آهنگ‌سازی برای بازی‌های المپیک 2000 سیدنی و بازی‌های مشترک المنافع ملبورن 2006. Skubiszewski در بیانیه ای اظهار داشت: \"بسیار از شما برای این افتخار فوق العاده متشکرم، این برای من یک شگفتی بزرگ بود و من عمیقا از APRA برای قدردانی از کار من با این جایزه خدمات برجسته سپاسگزارم.\" \"این موفقیت به همان اندازه متعلق به همکاران، مربیان و اعضای خانواده باورنکردنی است که در این راه از من حمایت کردند و الهام بخش بودند. من واقعاً بسیار خوش"}, {"source": "Billboard", "title": "Dom Dolla Launches Good Fortune Records", "link": "https://www.billboard.com/music/music-news/dom-dolla-lgood-fortune-records-1236360432/", "summary": "Dom Dolla , the superstar EDM DJ and producer can now add label chief to his resume. The Australian artist today unveils Good Fortune Records, which launches proper this Friday (Oct. 16) with its first release, Torren Foot rhys from the sticks’ “ DANCE .” Good Fortune expands on a party series Dom created in 2024 to bring into the spotlight emerging and established artists, doing so in unique spaces and locations. Dom’s Good Fortune nights have kicked off in Melbourne, Los Angeles, New York, Miami, Detroit, London and Manchester, and featured performances and back-to-back sets with the likes of Solomun, Green Velvet, Tiga, Fcukers and Skream. “After 20 years of DJing, I still find nothing more exciting than discovering new records that rip holes through a dance floor,” remarks Dom in a statement. “This week, I’m finally launching Good Fortune Records. A record label that began as a party brand I’ve been running events under for the last few years. A place where both new up and coming artists and established legends can come together and do what they do best.” View this post on Instagram Dom debuted “DANCE” in December 2025 when he played Sydney’s Allianz Stadium, marking the first time a homegrown DJ had filled a stadium in these parts. When Dom established another record last month, with his hometown show at Melbourne’s Marvel Stadium , he dropped the track to some 60,000 fans. Torren has been teasing DANCE on socials over the past month, keeping a list of all the DJs playing it a tally that includes the groundbreaking Docklands show where he joined Dom on stage for a performance. Dom has since played the track with Ketama at Head Trip Festival 2026 in California. “It’s been a staple in my set for the last 12 months,” Dom enthuses. View this post on Instagram There s never a dull moment for Dom. Raised in Darwin, Dom (real name: Dominic Matheson) became a fixture on Melbourne s club scene before taking his talents to the world. Last year, he was nominated for a Grammy Award; won a slew of ARIA Awards, including the inaugural ARIA Global Impact Award; sold-out two nights at Madison Square Garden and ticked off a bucket list item when he released “No Room For A Saint,” the soundtrack for F1: The Movie . It s been more of the same this year with an itinerary that has included major festival and headline shows across Asia, Latin and North America, the United Kingdom and Europe, a 13-week residency at Hï Ibiza, an extension of his residency at LIV Las Vegas, a", "date_str": "2026-10-14T04:22:26+00:00", "hash": "223af835f5f5787a", "title_fa": "Dom Dolla رکوردهای Good Fortune را راه اندازی کرد", "summary_fa": "Dom Dolla، DJ و تهیه کننده فوق ستاره EDM اکنون می تواند مدیر لیبل را به رزومه خود اضافه کند. این هنرمند استرالیایی امروز از Good Fortune Records رونمایی کرد که این روز جمعه (16 اکتبر) با اولین انتشار خود به نام Torren Foot Rhys from the sticks \"DANCE\" راه اندازی شد. Good Fortune مجموعه‌ای از مهمانی‌های Dom را که در سال ۲۰۲۴ ساخته شد گسترش می‌دهد تا هنرمندان نوظهور و جاافتاده را در کانون توجه قرار دهد و این کار را در فضاها و مکان‌های منحصربه‌فرد انجام دهند. شب های Dom’s Good Fortune در ملبورن، لس آنجلس، نیویورک، میامی، دیترویت، لندن و منچستر آغاز شده است و اجراها و ست های پشت سر هم با بازیگرانی مانند Solomun، Green Velvet، Tiga، Fcukers و Scream به نمایش گذاشته شده است. دام در بیانیه‌ای می‌گوید: «پس از 20 سال دی‌جی، هنوز هیچ چیز هیجان‌انگیزتر از کشف رکوردهای جدیدی که در یک پیست رقص سوراخ می‌کنند، پیدا نمی‌کنم. \"این هفته، من بالاخره Good Fortune Records را راه اندازی کردم. یک شرکت ضبط که به عنوان یک برند مهمانی شروع شد که من در چند سال گذشته رویدادها را تحت آن برگزار می کردم. مکانی که در آن هنرمندان تازه کار و آینده و اسطوره های تثبیت شده می توانند گرد هم آیند و کاری را که به بهترین شکل انجام می دهند، انجام دهند.\" این پست را در اینستاگرام مشاهده کنید. Dom اولین بار «DANCE» را در دسامبر 2025 هنگامی که در استادیوم آلیانز سیدنی بازی کرد، اولین باری بود که یک دی جی وطنی ورزشگاهی را در این بخش ها پر کرد. هنگامی که Dom ماه گذشته رکورد دیگری را با نمایش شهر خود در استادیوم مارول ملبورن ایجاد کرد، آهنگ را به حدود 60000 طرفدار رساند. تورن در ماه گذشته در شبکه‌های اجتماعی DANCE را مسخره کرده است، و فهرستی"}, {"source": "Deadline", "title": "Jami McGuigan Joins Select Management Group’s Canadian Team As Talent Manager", "link": "https://deadline.com/2026/10/jami-mcguigan-joins-select-canada-talent-manager-1237156676/", "summary": "EXCLUSIVE: Select Management Group, the next-generation talent management firm, today announced that veteran talent booker, producer, and strategic partnerships leader Jami McGuigan has joined the Select Canada team as a talent manager. McGuigan will help grow the company s Canadian presence and scale its efforts to cultivate the next generation of Canadian talent. Her work will [ ]", "date_str": "2026-10-14T14:30:00+00:00", "hash": "fa7d8429415950b3", "title_fa": "جامی مک گویگان به عنوان مدیر استعدادهای درخشان به تیم کانادایی گروه مدیریت انتخاب می‌پیوندد", "summary_fa": "اختصاصی: Select Management Group، شرکت مدیریت استعدادهای نسل بعدی، امروز اعلام کرد که رزرو کننده استعداد، تهیه کننده کهنه کار و رهبر مشارکت های استراتژیک، Jami McGuigan به عنوان مدیر استعداد به تیم انتخاب کانادا پیوسته است. McGuigan به رشد حضور شرکت در کانادا کمک می کند و تلاش های آن را برای پرورش نسل بعدی استعدادهای کانادایی افزایش می دهد. کار او [ ] McGuigan ملحق خواهد شد زیرا Select همچنان به گسترش ردپای کانادایی خود پس از راه اندازی در ژانویه دفتر تورنتو، اولین مکان بین المللی شرکت، ادامه می دهد. او مشتریانی از جمله مایکل مندیتا و روکسی نافوسی را به ارمغان می آورد. داستان‌های مرتبط آژانس‌ها انتخاب گروه مدیریتی Signs Nine From Love Island Mormon Wives، میلیون دلاری دایه‌ها آژانس‌های تطبیق عالی گروه مدیریت را انتخاب می‌کنند پل لوکنباو به نقش تازه ایجاد شده رئیس استعدادهای تئاتر قبل از پیوستن به Select، مک‌گویگان با رسانه‌ها و سرگرمی‌های برتر در سراسر رسانه‌ها و ویژگی‌های سرگرمی، استعدادهای استراتژیک، Bequality Media Relief و کتاب‌های Comic Nowlief کار می‌کرد. و توسعه را نشان دهد. قبل از آن، او نزدیک به یک دهه در The Late Show با استفان کولبرت، رزرو و تولید اجراهای موزیکال را گذراند و در تولیدات ویدئویی برادوی در 30 Rockefeller Plaza، از جمله نمایش امشب با بازی جیمی فالون، کار کرد. مک‌گویگان در اوایل کارش به کتاب‌سازی و تولید رویدادها در مجموعه دیک کلارک، از جمله جوایز گلدن گلوب، جوایز موسیقی آمریکا، جوایز آکادمی موسیقی کانتری، و شب راکین سال نو دیک کلارک کمک کرد. به عنوان یک تهیه کننده، کارهای او در تولیدات برنده جایزه Emmy، Peabody و Webby کمک کرده است."}, {"source": "Deadline", "title": "Mongolian-German Feature ‘Zogsool’ Wins Big At Busan Film Festival’s Vision Awards", "link": "https://deadline.com/2026/10/busan-vision-award-zogsool-mongolia-selvi-full-moon-1237156643/", "summary": "Mongolian-German feature Zogsool was the big winner in the Vision Awards at this year’s Busan International Film Festival, taking four prizes including the Vision of Jiseok Award. Directed by former cinematographer Sakhya Byamba, the film also took the NETPAC Award, FIPRESCI Award and one of two Hylife Vision Awards. Filmed on the Mongolian grasslands, the [ ]", "date_str": "2026-10-14T13:48:42+00:00", "hash": "bf9dfed6247cd8b2", "title_fa": "فیلم بلند مغولی-آلمانی «Zogsool» برنده جایزه ویژن جشنواره فیلم بوسان شد", "summary_fa": "Zogsool فیلم مغولی-آلمانی برنده بزرگ جوایز ویژن در جشنواره بین المللی فیلم بوسان امسال شد و چهار جایزه از جمله جایزه Vision of Jiseok را از آن خود کرد. این فیلم به کارگردانی فیلمبردار سابق ساخیا بیامبا، جایزه NETPAC، جایزه FIPRESCI و یکی از دو جایزه Hylife Vision را نیز دریافت کرد. فیلمبرداری شده در علفزارهای مغولستان، [ ] دیگر برندگان جوایز شامل ماه کامل از Jeong Jihye کره ای بود که جایزه CGV، جایزه K-Movie و جایزه تماشاگران Songwon Vision را برای یک فیلم کره ای دریافت کرد. خبرهای مرتبط اخبار داستانی از چیزهای جزئی ماهی قرمز در میان برندگان جوایز در بازار پروژه آسیایی بوسان اخبار بازار پروژه آسیایی پنج سازمان اتحاد تولیدکنندگان آسیایی را راه اندازی کردند. دیگر برندگان هندی عبارتند از Birds In The Dark به کارگردانی Shashank Walia که برنده جایزه تماشاگران Songwon Vision برای یک فیلم آسیایی شد. جوایز Mecenat Watch on Deadline BIFF به Agaar محصول مشترک چین و فرانسه یانگ بو و Can I Talk To You تعلق گرفت؟ از کره ای یی سونگ جون، در حالی که زنی که روی امواج می رقصد، از چوی سه دام، یک جایزه ویژه دریافت کرد. جایزه Heart Of Eurasia به ریا به کارگردانی آروین بلارمینو فیلیپینی اهدا شد. (لیست کامل برندگان جوایز را در زیر مشاهده کنید). مراسم اعطای جوایز جشنواره بین‌المللی فیلم بوسان بر ck Watch Entertainment's Missing Pieces", "summary_fa": "انحصاری: شبکه های Hearst UK و Super Channels کانادا در جستجوی قطعات گمشده هستند. یک سریال 20 قسمتی جنایی واقعی از Black Watch Entertainment مستقر در مانیتوبا در کانادا با چراغ سبز روشن شده است که شامل دو فصل از 10 قسمت است که پشت سر هم فیلمبرداری شده اند. استودیو ITV به عنوان توزیع کننده بین المللی متصل است. هر قسمت یک ساعته یک قتل را با استفاده از یک قتل بازسازی می کند [ ] هر داستان همچنین از طریق مشارکت بازرسان، شاهدان، اعضای خانواده و کارشناسان نزدیک به هر پرونده روایت می شود که از کشف تا عدالت مورد بررسی قرار می گیرد. Watch on Deadline Missing Pieces واجد شرایط دریافت اعتبار مالیاتی استانی تا 65 درصد است، بدون نیاز به محتوای کانادایی (CanCon)، زیرا مانیتوبا همچنان گزینه‌ای قوی برای فیلم‌برداری محصولات بین‌المللی در کانادا است. علاوه بر این، از آنجایی که مگان دافی، بنیانگذار بلک واچ، خالق آن است، این تولید نیز واجد شرایط مشوق مالیاتی 25 درصدی فدرال است. دافی گفت: ما همیشه به دنبال راه‌های جدیدی برای گفتن داستان‌های جنایی واقعی هستیم و Missing Pieces یک دیدگاه واقعاً منحصر به فرد ارائه می‌کند. هر پرونده با یک تکه از یک قربانی شروع می شود، و ما بازرسان را دنبال می کنیم تا آنها به عقب برگردند تا آنچه اتفاق افتاده را کشف کنند، قربانی را شناسایی کنند و در نهایت فرد مسئول را پیدا کنند. دافی تهیه کننده اجرایی Black Watch است و دایانا کارتر در همان نقش برای Hearst به همراه مارک مارابلا بازی می کند. کیم بال مسئول تولید سوپر کانال است و آلیسون رید به عنوان مجری برنامه ایفای نقش می کند. Black Watch، که در سال 2010 تأسیس شد، دارای اعتباراتی از جمله Superchannel و ITV's Endly Caught and Secrets، Lies و DNA Ties است. شبکه Lifetime The Woman With"}, {"source": "Deadline", "title": "Urban One Lines Up ‘Foul Play’ And ‘Power & Influence’ TikTok Microdramas", "link": "https://deadline.com/2026/10/urban-one-tiktok-microdramas-1237155551/", "summary": "EXCLUSIVE: Black content distributor Urban One, Inc. is launching a pair of microdramas that will launch on the Bossip TikTok account. Dreux Dougall, who has credits for Lovecra ستان Comment Loader Save Story ذخیره این داستان کارکنان Pitchfork به موسیقی‌های جدید زیادی گوش می‌دهند. مقدار زیادی از آن. در هر روز، نویسندگان، ویراستاران و همکاران ما تعداد قابل توجهی از انتشارات جدید را پشت سر می گذارند، به یکدیگر توصیه می کنند و در طول راه موارد دلخواه جدید را کشف می کنند. هر دوشنبه، با لیست پخش Pitchfork Selects، آنچه نویسندگانمان با وسواس می‌نوازند را به اشتراک می‌گذاریم و برخی از موسیقی‌های جدید مورد علاقه کارکنان Pitchfork را برجسته می‌کنیم. لیست پخش مجموعه ای از آهنگ هاست: تنها اصل راهنمای آن این است که این ها آهنگ هایی هستند که با کمال میل برای یک دوست ارسال می کنید. لیست پخش Pitchfork Selects این هفته شامل Marina Herlop، Cameron Winter، Jespfur، Zsela و غیره است. به زیر گوش دهید و لیست های پخش ما را در Apple Music و Spotify دنبال کنید. (Pitchfork از خریدهای انجام شده از طریق پیوندهای وابسته در سایت ما پورسانت دریافت می کند.) کامرون وینتر: «همه چیز در رودخانه افتاد» - والدن گرین مارینا هرلوپ: «جاک» - فیلیپ شربرن لوسی (کوپر بی. دستی): «ظاهر» - لیلی گلدبرگ پرفکت 100: «در اطراف انگشت من» - مرگ ال‌جی: «بمباران شریانی» - سام سدومسکی 10 کی‌دانکین: «ترس‌زده» - مانو ساندارسن، کلر روسای، مارتینا باستا: «گمشده و پیدا شده»: «گمشده و پیدا شده» - PS: «وقتی به سازه بله گفتی، هرگز بیرون نمی‌روی» - PS Cece Natalie: «Flood Whole Towns» - MS Keily Rude: «Faces Places» - Olivier Lafontant Ross Simonini: «Theme of the All» - WG V.V. Lightbody: \"راضی\" - نینا کورکوران جسپفور: \"(Blanket)\" - OL Omagoqa، Mfana Touchline، General C'mamane، و Zvri: \"Yebo Yehh\" - Kieran Press-Reynolds"}, {"source": "Pitchfork", "title": "Michael Stipe’s Debut Solo Album Almost Has a Release Date", "link": "https://pitchfork.com/story/michael-stipe-reveals-debut-solo-album-release-date/", "summary": "The lead single is dropping New Year’s Eve but you’ll have to wait until 2027 to hear the whole project", "date_str": "2026-10-13T16:42:26+00:00", "hash": "6874ddbc1b7e39ab", "title_fa": "اولین آلبوم انفرادی مایکل استیپ تقریباً تاریخ انتشار دارد", "summary_fa": "تک‌آهنگ اصلی شب سال ion on Your Face» اضافه می‌کند، آهنگ راه‌اندازی اولین آلبوم این تهیه‌کننده آلمانی به رهبری Ecco2k و Bladee، Wide Awake سال گذشته. این بازسازی در یک تک آهنگ دو آهنگی در کنار ریمیکس Mechatok از Body Talk salvo \"Fembot\" بسته بندی شده است. رابین دومی را به عنوان افتتاحیه مجموعه خود در تاریخ های اخیر تور Sexistential پذیرفته است. هر دو آهنگ را گوش کنید و تک آهنگ زیر را ببینید. این تک‌نفره به لیبل Robyn's Konichiwa و Universal - Island، تحت مجوز انحصاری Young اختصاص دارد."}, {"source": "Rolling Stone", "title": "‘Cameron Winter at Carnegie Hall’ Trailer Shares Glimpse of ‘Drinking Age’", "link": "https://www.rollingstone.com/music/music-news/cameron-winter-carnegie-hall-teaser-trailer-1235642403/", "summary": "The concert film, directed by Paul Thomas Anderson and shot on 35mm film, will be released this winter", "date_str": "2026-10-14T14:15:54+00:00", "hash": "3f0c5335e9d11874", "title_fa": "تریلر «Cameron Winter at Carnegie Hall» نمایی از «عصر نوشیدن» را به اشتراک می گذارد", "summary_fa": "این فیلم کنسرت به کارگردانی پل توماس اندرسون و فیلمبرداری فیلم 35 میلی‌متری، زمستان امسال منتشر می‌شود. در تیزر رسمی کامرون زمستان پل توماس اندرسون در سالن کارنگی، هزاران نفر به دنبال گرما و فرار در دسامبر سرد نیویورک هستند. آنها آن را در زمستان پیدا کردند، خواننده 24 ساله Geese که برای نمایش انفرادی خود در پیانو مستقر شد. اندرسون فیلم کنسرت آینده را روی فیلم 35 میلی‌متری فیلم‌برداری کرد، که نرمی به کارت عنوان می‌افزاید که در سراسر صفحه نمایش پخش می‌شود، Cameron Winter در Carnegie Hall: Dead at 23. در طول تیزر، وینتر فقط یک ثانیه از Drinking Age را می‌خواند که در میانه‌های فهرست 12 آهنگ ظاهر شد. همچنین زمانی که دوربین در زمستان تنظیم نشده است، تغییرات فیلم را پیش‌نمایش می‌کند، مانند زمانی که تماشاگرانی که از آینده تماشا می‌کنند با گروهی که نمایش را کنار هم می‌گذارند به پشت صحنه برده می‌شوند، یا داخل باجه فروش بلیط. رولینگ استون در نقدی از این فیلم که اولین نمایش جهانی خود را در جشنواره فیلم نیویورک داشت، نوشت: می‌توانستید در طول فیلم صدای پروانه‌ای را بشنوید که بال‌هایش را در خود تکان می‌دهد، در حالی که جمعیت با احترامی خاموش از هر آهنگ استقبال می‌کنند. این حس وجود داشت که با این فیلم ما را به کلیسا می برد. همکاری اندرسون با این مرد جوان با استعداد، تنها چیزی است که هر فیلم کنسرت عالی سعی می‌کند به کسانی که نمی‌توانستند در همان لحظه اولیه حضور داشته باشند، هدیه دهد. این فقط شما را در داخل تئاتر قرار نمی دهد. این باعث می شود که احساس کنید درون موسیقی هستید. داستان های پرطرفدار جونی میچل شهروند ایالات متحده می شود: «سفری که 62 سال پیش آغاز شد» لری دیوید اره او. سیمپسون در یک کلوپ کانتری روزی که نیکول براون کشته شد."}, {"source": "Rolling Stone", "title": "The 2027 Grammys Contenders for Song of the Year Should Be Predominantly Women", "link": "https://www.rollingstone.com/music/music-features/grammys-2027-song-of-the-year-predictions-nominees-1235639803/", "summary": "Olivia Rodrigo, Olivia Dean, Taylor Swift, and Ella Langley could all have strong showings in this Big Four category", "date_str": "2026-10-14T13:41:49+00:00", "hash": "c72ba23edb46f5c7", "title_fa": "نامزدهای جایزه گرمی 2027 برای آهنگ سال باید عمدتاً زن باشند", "summary_fa": "اولیویا رودریگو، اولیویا دین، تیلور سویفت و الا لنگلی همگی می‌توانند نمایش‌های قدرتمندی در این رده چهار بزرگ داشته باشند. رولینگ استون در 16 نوامبر نامزد دریافت جایزه گرمی می‌شود. برای هر کدام، نامزدها و همچنین اینکه چه کسی (و چه کسی باید) در شب گرمی برنده شود را پیش‌بینی می‌کنیم. اگر یک خط نهایی برای نامزدهای احتمالی آهنگ سال 2027 وجود داشته باشد، این یک میدان کاملاً باز است. تونی گروینو، سردبیر تایدال، با اشاره به برنده بزرگ سال 2025 توسط کندریک لامار، می‌گوید چیزی شبیه به ما نیست، آهنگی که همه آن را به عنوان آهنگ عالی معرفی می‌کنند، وجود ندارد. این فقدان یک انتخاب اجماع باعث می شود که فرآیند نامزدی برای هر کسی امکان پذیر باشد. تیانا لوئیس، رئیس برنامه‌نویسی پاپ در اپل می‌گوید: این یکی از هیجان‌انگیزترین گروه‌های هنرمندانی است که ما در این مدت برای این دسته‌ها داشتیم. هم ژروینو و هم لوئیس انتظار دارند که نامزدهای آهنگ سال امسال بسیار جوان تر شوند. اما فراموش نکنید که این یک دسته چهار بزرگ است که مستعد چیزه  که با همه تبلیغات منفی وحشیانه بود. بنابراین این دو نقطه ضعف من است. پکستون می‌گوید: یکی سه بود، در واقع: نداشتن زمان برای جمع‌آوری پول بیشتر، داشتن تبلیغات منفی، و حریف من از بودجه خوبی برخوردار است و شناخته شده است. صوت پشت صحنه که توسط رولینگ استون به دست آمده، بخشی از یک سری اطلاعات فاش شده از جمع آوری کمک های مالی در 24 سپتامبر است که همگی توسط یکی از شرکت کنندگان در این رویداد ضبط شده است که با نامزدی پکستون مخالفت می کند. از اواخر سپتامبر، بخش‌هایی از فایل صوتی و متن این نشست در اختیار رسانه‌های مختلف قرار گرفت. آنها با هم تصویری از نامزدی را ترسیم می‌کنند که به طور خصوصی تلاش می‌کند تا سرزنش خود را به خاطر کمپین کم‌نظیر خود و تعداد عقب مانده‌اش در نظرسنجی‌ها از بین ببرد. پکستون، که دونالد ترامپ اوایل سال"}, {"source": "Rolling Stone", "title": "More Details Emerge About Kelly Clarkson’s Feud With Brooklyn Shop", "link": "https://www.rollingstone.com/music/music-news/kelly-clarksons-brooklyn-shop-feud-security-footage-details-1235642387/", "summary": "Security footage of Clarkson's visit to Art of Play was revealed on Tuesday, while the shop's owner responded to questions from the press", "date_str": "2026-10-14T06:48:44+00:00", "hash": "07a7b2d939b9caae", "title_fa": "جزئیات بیشتر درباره دشمنی کلی کلارکسون با فروشگاه بروکلین ظاهر می شود", "summary_fa": "فیلم امنیتی بازدید کلارکسون از Art of Play در روز سه شنبه فاش شد، در حالی که صاحب مغازه به سوالات مطبوعات پاسخ داد. کلی کلارکسون در مقابل هنر بازی از زمانی که خواننده و مجری تلویزیون از فروشگاه بروکلین به دلیل رفتار با او مانند شخصیت جولیا رابرتز در Pretty Woman فراخوانی کردند، همچنان افزایش یافته است. روز شنبه، این خواننده به اشتراک گذاشت که از فروشگاه بازدید کرده است و یکی از کارمندان او را به دیده تحقیر نگاه می کند. او در X نوشت، فقط تمام راه را تا بروکلین رانندگی کردم تا این فروشگاه را بررسی کنم، فکر می‌کردم واقعاً راد به نظر می‌رسد و چند چیز برای خرید در ذهن داشتم و به معنای واقعی کلمه به نظرم می‌رسید که گویی نمی‌توانم آن را بخرم و به او گفته شد که می‌تواند چیزی قابل مقایسه برای من پیدا کند. هنر بازی توضیح داد که کلارکسون می خواست مولی، یک پرنده آوازخوان انیماترونیک را خریداری کند که برای فروش نبود. عکس‌های آنلاین بعداً تأیید کردند که این مجسمه 15000 دلار قیمت دارد. کلارکسون در پاسخ گفت که شما نه تنها بی ادب هستید، بلکه یک دروغگو نیز هستید. مغازه مدعی شد که برای پاک کردن هوا دست دراز کرده است، اما به نظر نمی رسد هوا روشن تر شود. صاحبان Art of Play در مورد این حادثه با مطبوعات صحبت می کردند و خاطرنشان کردند که پست های کلارکسون منجر به ترول قابل توجهی برای فروشگاه شده است. آدام روبین، یکی از مالکان، به USA Today گفت که تلفن و ایمیل فروشگاه مملو از پیام‌های تهدیدآمیز است. او افزود که مولی اکنون با قیمت 15 میلیون دلار برای فروش در دسترس است. روبین گفت که ما برای امنیت مغازه داران خود می ترسیم. کلی کلارکسون ما را در معرض خطر قرار داده است. او همچنین مدعی"}, {"source": "Rolling Stone", "title": "Jimmy Kimmel Takes Aim at Trump’s New Press Secretary: ‘Her Reading Is Good for an 11-Year-Old’", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/jimmy-kimmel-donald-trump-new-press-secretary-critique-1235642383/", "summary": "\"Do you know how hard it is to become Trump's worst press secretary that quickly?\"", "date_str": "2026-10-14T06:20:26+00:00", "hash": "5576e4be97ca5ac0", "title_fa": "جیمی کیمل، دبیر مطبوعاتی جدید ترامپ را هدف گرفته است: \"خواندن او برای یک کودک 11 ساله خوب است\"", "summary_fa": "آیا می دانید چقدر سخت است که به این سرعت بدترین وزیر مطبوعاتی ترامپ شوید؟ جیمی کیمل به کیتی زاخاریا، آخرین زن بلوندی که به عنوان منشی مطبوعاتی دونالد ترامپ مشغول به کار شد، توجه کرد. در اپیزود سه شنبه شب جیمی کیمل زنده، کیمل اولین روز کاری فاجعه بار زکریا را بازگو کرد. کیمل گفت که اولین روز مهدکودک برای دبیر مطبوعاتی جدید کاخ سفید، کتی زاخاریا، بود. می دانید، ترامپ برای مدت طولانی رئیس جمهور شده است. من فکر می کنم در مورد چه چیزی، 50 یا 60 سال است؟ و برای اینکه او را بیدار و علاقه مند نگه دارند هر شش ماه یک بار یک عروسک بلوند حنایی جدید می آورند تا به چرخش اضافه شود. او ادامه داد، امروز همه چیز برای مالیبو کتی خوب شروع نشد. اولین جلسه توجیهی او کوتاه بود. تنها 14 دقیقه طول کشید، اما حتی در همین مدت کوتاه، او دقیقاً کاری را که برای انجامش آورده بودند، انجام داد، یعنی یک لوله کامل از برق لب در سراسر پشت رئیس جمهور. کیمل به کلیپی از زکریا برید که می‌گوید مدت‌ها می‌خواست برای ترامپ کار کند. کیمل تکرار کرد، او می خواست برای مدت طولانی برای او کار کند. و واقعاً این تمام چیزی است که امروزه لازم است. برای اعلام پیش از سوار شدن به هواپیمای دلتا ایرلاینز، فقط کافی است و طوری لباس بپوشید. کیمل پس از پخش یک کلیپ دیگر از خواندن یک تکه کاغذ به آرامی و مکانیکی، گفت: خواندن او برای یک کودک 11 ساله خوب است. او یک دانش آموز کلاس چهارمی را به عنوان دبیر مطبوعات استخدام کرد! مجری برنامه پیشینه زکریا را شرح داد و او را یک اثر واقعی خواند. او خاطرنشان کرد که او نام خود را با نامیدن دموکرات ها پدوفیل در رسانه های اجتماعی و اهمیت دادن به"}, {"source": "Rolling Stone", "title": "Pope Leo XIV Diagnosed With Lung Cancer", "link": "https://www.rollingstone.com/culture/culture-news/pope-leo-xiv-undergo-surgery-nodule-lung-1235641026/", "summary": "The announcement was made following the pope's surgery on Tuesday to remove the lower lobe of his lung", "date_str": "2026-10-14T02:20:00+00:00", "hash": "ed40ac7591f53009", "title_fa": "پاپ لئو چهاردهم به سرطان ریه مبتلا شد", "summary_fa": "واتیکان در بیانیه‌ای اعلام کرد که پس از عمل جراحی پاپ در روز سه‌شنبه برای برداشتن لوب تحتانی ریه‌اش، پاپ لئو چهاردهم به سرطان ریه مبتلا شده است. این اعلامیه پس از عمل جراحی روز سه شنبه برای برداشتن لوب پایینی ریه راست وی اعلام شد. معاینه تشخیص آدنوکارسینوم ریه را تایید کرد که در بیانیه گفته شد آزمایش‌های قبل از عمل مشکوک به آن بود. پاپ سه ساعت در اتاق عمل بود و خود عمل جراحی حدود 90 دقیقه طول کشید. در بیانیه آمده است که این عمل موفقیت آمیز بوده و هیچ عارضه ای نداشته است. طبق گزارش بنیاد سرطان ریه آمریکا، آدنوکارسینوم ریه شایع ترین نوع سرطان ریه در ایالات متحده است و حدود 40 درصد از کل موارد سرطان ریه را تشکیل می دهد. واتیکان فاش نکرده است که سرطان در چه مرحله ای بوده و آیا پاپ تحت معالجه بیشتر قرار خواهد گرفت. روز یکشنبه پاپ اعلام کرد که تحت عمل جراحی قرار خواهد گرفت. پاپ این اعلامیه را در حالی که در شبکه های اجتماعی در میدان سنت پیتر برای دعای آنجلوس جمع شده بودند، اعلام کرد. پاپ لئو چهاردهم نوشت: دوستان عزیز، طی برخی معاینات پزشکی اخیر، پزشکان یک ندول کوچک و موضعی در ریه من پیدا کردند. در مراحل اولیه تشخیص داده شد و به خوبی محلی سازی شده است. پزشکان معتقدند که بهتر است مداخله کنیم، بنابراین، با توجه به توصیه آنها، تصمیم گرفتم برای برداشتن آن تحت عمل جراحی قرار بگیرم. قرار است این عملیات در روزهای آینده انجام شود. وی افزود: از نزدیکی معنوی شما سپاسگزارم و خود را به دعای شما می سپارم. در آن زمان، مشخص نشد که آیا ندول سرطانی است یا خیر."}, {"source": "Rolling Stone", "title": "‘The Odyssey’ Is Heading Home With Special Edition Blu-Ray Release", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/the-odyssey-blu-ray-dvd-streaming-release-date-1235642250/", "summary": "The collectible three-disc set and Steelbook are currently sold out, but you can still grab the 4K, Blu-ray, or DVD editions of the film", "date_str": "2026-10-14T00:14:09+00:00", "hash": "f5dae4a460d4d74c", "title_fa": "«اودیسه» با انتشار نسخه ویژه بلو-ری به خانه می رود", "summary_fa": "مجموعه سه دیسک کلکسیونی و Steelbook در حال حاضر فروخته شده است، اما همچنان می‌توانید نسخه‌های 4K، Blu-ray یا DVD فیلم را دریافت کنید. اگر محصول یا خدماتی را که به‌طور مستقل بررسی شده‌اند از طریق پیوندی در وب‌سایت ما خریداری کنید، Rolling Stone ممکن است کمیسیون وابسته دریافت کند. حماسه ادیسه کریستوفر نولان به خانه بازمی گردد و خوشبختانه برای طرفداران سینما، 10 سال طول نکشید. این فیلم به پلتفرم‌های ویدیویی بر اساس تقاضا راه پیدا می‌کند و در ماه نوامبر (آبان) به صورت بلوری منتشر می‌شود. 17، دقیقاً چهار ماه پس از اکران در سینماهای ایالات متحده. انتشار برای اولین بار در ماه آگوست اعلام شد، اما ما اکنون جزئیات بیشتری در مورد آنچه برای فروش است داریم. علاوه بر نسخه‌های 4K، بلوری و دی‌وی‌دی، این فیلم به‌عنوان استیل بوک کلکسیونی و مجموعه سه دیسکی کلکسیونی 300 دلاری منتشر خواهد شد. هم مجموعه کلکسیونی و هم Steelbook از زمان عرضه آنلاین فروخته شده اند. همچنین در همان روز برای خرید یا اجاره دیجیتال در دسترس خواهد بود. علاوه بر فیلم، Blu-ray دارای یک دیسک جایزه است که شامل ساخت مستند است. هر دو مجموعه Steelbook و هدیه در حال حاضر فروخته شده اند. هیچ تاریخ پخشی اعلام نشده است، اگرچه به عنوان اکران یونیورسال پیکچرز، انتظار می‌رود که این فیلم در نهایت روی Peacock بیاید. بر اساس شعر حماسی 2700 ساله هومر به همین نام، اودیسه به دنبال اودیسه (مت دیمون) است که سعی می کند پس از جنگیدن در جنگ تروا به خانه اش به ایتاکا بازگردد. به شیوه واقعی نولان، فیلم به جای دنبال کردن یک روایت سرراست، حول خط زمانی می چرخد. علاوه بر دیمون، در این فیلم تام هالند، زندایا، رابرت پتینسون و لوپیتا نیونگ او بازی می‌کنند. به گفته باکس آفیس موجو، ادیسه در صدر جدول باکس آفیس بالای فیلم‌های قبلی نولان قرار"}, {"source": "Rolling Stone", "title": "Why Is the President Posting Videos of Animals Mauling People?", "link": "https://www.rollingstone.com/politics/politics-news/trump-posts-video-man-attacked-by-tiger-1235642232/", "summary": "Trump reposted a video of William Chapman during his final moments before he was fatally attacked by a tiger at Yorkshire Wildlife Park", "date_str": "2026-10-14T00:13:10+00:00", "hash": "9010b08d7ea78d11", "title_fa": "چرا رئیس جمهور ویدیوهای حیوانات را پست می کند که مردم را آزار می دهند؟", "summary_fa": "ترامپ ویدئویی از ویلیام چپمن را در آخرین لحظات زندگی‌اش قبل از حمله مرگبار ببر در پارک حیات وحش یورکشایر بازنشر کرد، دونالد ترامپ، رئیس‌جمهور آمریکا سه‌شنبه ویدئوهای متعددی را در شبکه‌های اجتماعی به اشتراک گذاشت که حیوانات را در حال له کردن مردم نشان می‌داد. این پست‌های عجیب در حالی منتشر می‌شوند که ملت در محاصره قیمت‌های بالای بنزین، جنگ علیه ایران و بحران هزینه‌های زندگی است که با نزدیک شدن به انتخابات میان‌دوره‌ای اقتصاد کشور را تکان داده است. رئیس‌جمهور فیلم‌های خشونت‌آمیز را در حساب Truth Social خود، که معمولاً برای لاف زدن در مورد دستاوردهای درک شده‌اش و بازنشر ستایش از سوی افرادی که برای او کار می‌کنند، اختصاص داده می‌شود. ترامپ در کنار ویدئویی از حمله یک ببر توسط یک مرد نوشت: هرگز طبیعت را به هم نزنید! رئیس جمهور DJT. این کلیپ مربوط به حمله مرگبار روز شنبه در پارک حیات وحش یورکشایر بود. گاردین گزارش داد که مردی به نام ویلیام چپمن، که گمان می‌رود حدود 20 سال داشته باشد، به داخل محوطه ببر سیبری آلتای، بیش از 400 پوندی، رفت و به او حمله کرد. ترامپ این کلیپ ۴۱ ثانیه‌ای بی‌صدا را منتشر کرد که نشان می‌دهد ببر پشت گردن چپمن را گاز می‌گیرد، او را روی زمین می‌کشد و پاهایش را پنجه می‌زند. به نظر نمی رسد این کلیپ مرگ مرد را نشان دهد. گزارش شده که این حادثه چند دقیقه به طول انجامید و بلافاصله پس از مرگ چاپمن در محل حادثه اعلام شد. یک حساب رسمی کاخ سفید ویدیوی ترامپ را در X منتشر کرد. پس از اینکه ترامپ ویدیوی چپمن را منتشر کرد، رئیس‌جمهور یک مجموعه ویدئویی ۲۴ ثانیه‌ای از حمله شیرها به مردم منتشر کرد که با موسیقی شاد پخش می‌شد. مشخص نیست که آیا حملات به تصویر کشیده شده معتبر هستند یا توسط هوش مصنوعی ایجاد شده"}, {"source": "Rolling Stone", "title": "You Know Rosalind Eleazar From ‘Slow Horses.’ She’ll Blow You Away in ‘Misty Green’", "link": "https://www.rollingstone.com/tv-movies/tv-movie-reviews/rosalind-eleazar-misty-green-interview-1235639334/", "summary": "The British actor levels up as the messy title character of Chris Rock's new movie. She talks about her audition gone wrong, Oscar buzz, and why she loves \"difficult people\" like Misty", "date_str": "2026-10-13T23:00:00+00:00", "hash": "bf81a176d34d7923", "title_fa": "روزالیند الازار را از «اسب‌های کند» می‌شناسید. او شما را در «سبز مه‌آلود» خواهد برد", "summary_fa": "این بازیگر بریتانیایی در نقش شخصیت نامرتب فیلم جدید کریس راک قرار می گیرد. او در مورد خطای امتحانش، صدای اسکار، و اینکه چرا عاشق «افراد دشوار» مانند میستی اس است، صحبت می‌کند، گاهی اوقات یک اتفاق در غیرمنتظره‌ترین بسته‌ها فرا می‌رسد. برای Rosalind Eleazar، این یک جفت سایه و چند پمپ بود. این بازیگر بریتانیایی چند هفته فرصت داشت تا فیلمبرداری درام مه‌آلود کریس راک در مورد تجارت نمایشی و هنرمندان حساس و اغلب خود ویرانگر را شروع کند که آن را می‌جوید و تف می‌دهد. بنابراین او زود به لس آنجلس پرواز کرد و خود را در آنجا جاسازی کرد، به مکان‌های محلی رفت و در خیابان‌های هالیوود قدم زد. الازار نقش شخصیت اصلی را بازی می کند، بازیگری که روزی روزگاری در یک برنامه تلویزیونی موفق حضور داشت و برنده جایزه امی شد. با این حال، هنگامی که ما او را ملاقات می کنیم، میستی عمیقاً در یک آرامش حرفه ای و یک مارپیچ رو به پایین شخصی است. الازار قبلاً زمان محدودی را در لس آنجلس گذرانده بود و وظایف تبلیغاتی پروژه ها را انجام می داد. حالا او می‌خواست کمی وقت بگذارد تا واقعاً در فرهنگ غوطه‌ور شود. الازار می گوید بازیگری یک انسان شناسی سه بعدی است و برای خودش یک فنجان چای نعناع می ریزد. یک بعدازظهر اواخر در میدتاون منهتن است، چند روز پس از اولین نمایش آمریکایی Misty در جشنواره فیلم نیویورک، و او بین کنسرت های مطبوعاتی با یک پیراهن دکمه دار و شلوار جین شیک است. اینجا و آنجا چیزهای کوچک زیادی وجود داشت که فقط با حضور در لس آنجلس و جذب همه چیز اطرافم، توانستم برای او پیدا کنم. و سپس یک روز، من در یک باشگاه ورزشی Equinox بودم، زیرا سعی می‌کردم به همان اندازه که او در زندگی روزمره‌اش انجام می‌دهد، انجام دهم و این"}, {"source": "Rolling Stone", "title": "Dolly Parton’s Nephew Denies Making Threats in Effort to Quash Restraining Order", "link": "https://www.rollingstone.com/music/music-country/dolly-parton-nephew-denies-threats-restraining-order-1235642217/", "summary": "Bryan Seaver said many messages cited in a recent complaint against him were taken out of context", "date_str": "2026-10-13T22:13:21+00:00", "hash": "04ad91acd304e04a", "title_fa": "برادرزاده دالی پارتون تهدیدات خود را در تلاش برای سرکوب دستور محدود کننده انکار کرد", "summary_fa": "برایان سیور گفت که بسیاری از پیام‌های ذکر شده در شکایت اخیر علیه او از متن خارج شده‌اند. برادرزاده دالی پارتون در برابر ادعاهایی مبنی بر ارسال پیام‌های تهدیدآمیز به برخی از شرکای تجاری اسطوره فقید کشور، با این استدلال که بسیاری از متن‌ها و ایمیل‌های ذکر شده در شکایت اخیر از متن خارج شده‌اند. در اوایل این ماه، برایان سیور که به عنوان رئیس امنیتی طولانی مدت پارتون خدمت می کرد و در ویدیویی که مرگ او را اعلام می کرد ظاهر شد، به دنبال شکایت She s Alive, LLC، با یک دستور منع موقت برخورد کرد. این شرکت برای مدیریت پس از مرگ سرمایه گذاری های تجاری پارتون تأسیس شد و توسط مدیر قدیمی او، دنی نوزل، نظارت می شود. در این شکایت، سیور به راه اندازی یک کمپین فحاشی، عمدی و تشدید کننده تهدید برای استخراج پول از املاک پارتون متهم شد. همچنین ادعا کرد که هیچ چیز متعارفی در مورد شرکت امنیتی سیور وجود ندارد و آن را به عنوان یک نیروی شبه نظامی به شدت مسلح و به سبک شبه نظامی توصیف کرد که قادر به طرح تهدید و اجبار است. در این شکایت به پیام‌های متعددی از سیور اشاره شد که حاوی اعلامیه‌های قابل توجهی از این قبیل بود: من قصد دارم هر نهادی [شریک تجاری دالیوود] را که احتمالاً می‌توانم به ذهنم خطور کنم، کتک بزنم. من اهل سرگرمی نیستم من یک قاتل هستم؛ و من در روز مرگ دالی 27 میلیون دلار مهمات و اسلحه به پلیس هائیتی فروختم. اما سیور ادعا کرد که بسیاری از این پیام‌ها از ارتباطات مستقیم بین او و نوزل ​​که او را تا هفته‌های پس از مرگ پارتون دوست، همکار و متحد نزدیک من توصیف می‌کرد، خارج از چارچوب بود. سیور گفت از بسیاری از پیام‌های ذکر شده در شکایت، این پیام‌ها در خلال مکالمات خصوصی"}, {"source": "Hollywood Reporter", "title": "Netflix Film VP Doug Belgrad Out In Layoffs", "link": "https://www.hollywoodreporter.com/movies/movie-news/netflix-film-vp-doug-belgrad-layoffs-1236729799/", "summary": "The exec had been at the streaming giant since 2024, when he was hired by film chief Dan Lin.", "date_str": "2026-10-14T14:26:03+00:00", "hash": "8291cd4804645adc", "title_fa": "داگ بلگراد، معاون فیلم نتفلیکس، اخراج شد", "summary_fa": "مدیر اجرایی از سال 2024، زمانی که توسط مدیر فیلم، دن لین استخدام شد، در غول استریم حضور داشت. توسط Borys Kit، اریک هیدن، 14 اکتبر 2026، 7:26 صبح به عنوان بخشی از بزرگترین بازسازی نتفلیکس در چهار سال گذشته، داگ بلگراد، مدیر بخش فیلم، برکنار شده است، منابع به هالیوود ریپورتر گفتند. بلگراد از زمانی که در سال 2024 پس از یک دوره طولانی در سونی، از جمله رئیس کلمبیا پیکچرز، به غول استریمینگ پیوست، به عنوان دست راست رئیس فیلم دان لین خدمت کرد. استخدام او اولین حرکت بزرگ اجرایی لین در آن زمان پس از اینکه مدیر اجرایی جانشین اسکات استابر در نقش نظارت بر همه فیلم‌ها در غول استریم شد بود. روز چهارشنبه، تد ساراندوس و گرگ پیترز، روسای مشترک نتفلیکس به کارکنان اطلاع دادند که 1000 کارمند خود را که حدود 6 درصد از نیروی کار خود است، اخراج خواهد کرد. ما می دانیم که تغییراتی مانند این سخت هستند، اما اجازه دهید تمرکز خود را حفظ کنیم، یادداشت خوانده شده است. این یکی از پویاترین زمان‌ها در تاریخ سرگرمی است و برای شرکتی مانند شرکت ما که در تقاطع فناوری و سرگرمی ساخته شده است، کاملاً مناسب است. اکنون بر ماست که قدم برداریم و با هم، مثل همیشه، لحظه را ملاقات کنیم."}, {"source": "Hollywood Reporter", "title": "Banana Republic Debuts First Scripted Microseries, an Office Comedy Starring Jack Innanen (Exclusive)", "link": "https://www.hollywoodreporter.com/business/digital/banana-republic-first-scripted-microseries-jack-innanen-1236729327/", "summary": "In 'The Agency,’ aimed at the TikTok crowd, an old-school travel agency faces a harsh awakening when a corporate suit decides to modernize the business.", "date_str": "2026-10-14T14:09:13+00:00", "hash": "806327a86c4855e2", "title_fa": "موز جمهوری اولین میکروسریال فیلمنامه شده، یک کمدی اداری با بازی جک اینانن (اختصاصی)", "summary_fa": "در «آژانس» که هدف آن جمعیت TikTok است، یک آژانس مسافرتی قدیمی با بیداری سختی مواجه می‌شود که کت و شلوار شرکتی تصمیم به مدرن‌سازی کسب‌وکار می‌گیرد. میبلین. کروکس. مارک جیکوبز اینها تنها تعدادی از برندهایی هستند که اخیراً به قالب میکرودرام روی آورده اند تا نخی را بچرخانند و طبیعتاً کالاهای خود را تبلیغ می کنند. و حالا موز جمهوری را می توان به این لیست اضافه کرد. هالیوود ریپورتر دریافته است که برند متعلق به گپ اولین قسمت اولیه فیلمنامه میکرودرام خود را روز چهارشنبه آغاز کرد. جک اینانن، بازیگر بزرگسالان و اشتباهات بزرگ، در نقش چهار کارمند مختلف در یک آژانس مسافرتی قدیمی و با خدمات کامل به نام تورهای مسافرتی که با ورود کت و شلوار شرکتی (با بازی تیلور اورتگا، بازیگر نقش اشتباهات بزرگ اینانن) برای مدرن کردن آن، تکان می خورد. Milo Tucker-Meyer نقش کارآموز آژانس را بازی می کند. داستان‌های عاشقانه صابون‌آمیز، مزاحم و پرتغالی ممکن است قالب میکرودرام را در سطح جهانی محبوب کرده باشند، اما قسمت اول آژانس، این سریال را به عنوان یک کمدی اداری با برش‌های سریع و خطوط چشمک و چشمک می‌بیند. شخصیت‌های اینانن در این مجموعه پنج قسمتی شامل مدیری فاقد اعتماد به نفس، یک متخصص کشتی کروز خودسر، یک متخصص ماجراجویی که عمیقاً از ماجراجویی می‌ترسد و یک فرانسوی فرانسوی که از اواخر دهه 90 خاک آمریکا را ترک نکرده است. همانطور که می توان انتظار داشت، هر یک از شخصیت های او به طرز بی عیب و نقصی با لباس جمهوری موز پوشیده شده اند. مینا انواری، مدیر ارشد بازاریابی Banana Republic گفت که این برند تصمیم گرفت این قالب را امتحان کند تا به میراث داستان سرایی خود احترام بگذارد. شرکت پوشاک سافاری مسافرتی Banana Republic، همانطور که این شرکت در ابتدا نام داشت، زاییده فکر یک روزنامه‌نگار و تصویرگر روزنامه (موسسان مل و"}, {"source": "Hollywood Reporter", "title": "NBC’s ‘Dateline’ Headed to Canada", "link": "https://www.hollywoodreporter.com/tv/tv-news/nbc-dateline-canada-1236728864/", "summary": "America’s top-rated true crime series hosted by Canadian native Keith Morrison will launch a local version on Citytv on Nov. 26.", "date_str": "2026-10-14T14:08:06+00:00", "hash": "976b23a44ba8289e", "title_fa": "«Dateline» NBC به کانادا رفت", "summary_fa": "سریال جنایی واقعی با رتبه برتر آمریکا که توسط کیت موریسون بومی کانادا میزبانی می‌شود، نسخه محلی آن در سیتی‌تی‌وی در تاریخ 26 نوامبر عرضه می‌شود. NBCs Dateline، سریال جنایی واقعی با رتبه برتر، از 26 نوامبر یک سریال کانادایی اسپین‌آف در شمال مرز دریافت می‌کند. کیت موریسون، که چهارشنبه اولین کار خود را در روزنامه‌نگاری بین‌المللی در کانادا آغاز کرد. گسترش فرنچایز Dateline به عنوان بخشی از قرارداد صدور مجوز با استودیو راجرز. Dateline Canada در Citytv و Citytv+ توسط Diana Swain، خبرنگار تحقیقاتی ارشد سابق CBC News و مجری The Investigators در شبکه خبری CBC در کانادا میزبانی خواهد شد. او در سال 2024 پس از 33 سال کار با CBC، پخش کننده عمومی کانادا را ترک کرد، جایی که موریسون تا حدی صدای نمادین خود را کامل کرد. پس از شروع کار در رادیو کانادا در دهه 1960، موریسون در سال 1973 به عنوان خبرنگار، تهیه کننده و در نهایت گوینده خبر به شبکه CTV پیوست. در اوایل دهه 1980، موریسون یکی از مجریان برنامه خبری و امور جاری The Journal در شبکه CBC شد. او در ژانویه 1986 به عنوان مجری برنامه 5 بعد از ظهر به NBC پیوست. و ساعت 11 شب اخبار در KNBC-TV در لس آنجلس. Dateline Canada با یک ویژه دو ساعته بازبینی محکومیت نادرست رابرت بالتویچ، که به خاطر قتل دوست دختر آن زمان الیزابت بین پس از ناپدید شدنش در سال 1990 زندانی شده بود، نمایش داده می شود. بالتوویچ تا سال 2000 نه سال را در زندان گذراند، پیش از تبرئه نهایی در سال 2008 پس از اینکه دادستان همه اتهامات را کنار گذاشت. تیم Dateline Canada با بررسی پرونده های پلیس در مورد این پرونده، ادعا می کند که تحقیقات پلیس گزارش نشده ای را کشف کرده است. در فیلم ویژه جنایات واقعی، بالتوویچ، یک افسر پلیس بازنشسته"}, {"source": "Hollywood Reporter", "title": "“Ruthless, Sexual Predator”: Russell Brand Rape Allegations Detailed as Prosecution Opens Case", "link": "https://www.hollywoodreporter.com/news/general-news/russell-brand-rape-trial-prosecution-claims-sexual-assault-1236729752/", "summary": "The disgraced actor and comedian has vehemently denied three counts of rape, three charges of sexual assault and one allegation of indecent assault relating to six women.", "date_str": "2026-10-14T13:56:15+00:00", "hash": "4d997a8bc54c6c8d", "title_fa": "\"بی‌رحم، شکارچی جنسی\": جزئیات اتهامات تجاوز جنسی راسل با باز شدن پرونده توسط راسل", "summary_fa": "این بازیگر و کمدین رسوایی، سه مورد تجاوز جنسی، سه اتهام تجاوز جنسی و یک اتهام تجاوز جنسی به شش زن را به شدت رد کرده است. محاکمه تجاوز جنسی راسل برند رسماً در دادگاه سلطنتی Southwark لندن در جریان است و دادستانی این بازیگر و کمدین رسوا شده را یک شکارچی جنسی بی رحم و حساب شده توصیف می کند. هشت مرد و چهار زن در هیئت داوران حضور دارند که انتخاب آنها در روزهای دوشنبه و سه شنبه هفته جاری انجام شد. روز چهارشنبه، برند هنگام ورود به دادگاه با همسرش لورا، که گزارش شده بود در طول مراحل دادگاه به گرمی به او لبخند می زد، عکس گرفته شد. برند، که بیشتر به خاطر نقش‌هایش در فیلم «دهان بزرگ برادر بزرگ» و در «فراموش کردن سارا مارشال» شناخته می‌شود، به سه مورد تجاوز جنسی، سه اتهام تجاوز جنسی و یک اتهام تجاوز جنسی متهم شده است و شش زن متهم به ج 29636/", "summary": "“This year’s selection demonstrates the strength of Baltic co-productions and the growing contribution of our filmmakers to international cinema.”", "date_str": "2026-10-14T07:45:03+00:00", "hash": "bbb861bbdfa07899", "title_fa": "جشنواره شب های سیاه تالین از رقابت فیلم های بالتیک رونمایی کرد", "summary_fa": "\"انتخاب امسال نشان دهنده قدرت تولیدات مشترک بالتیک و سهم رو به رشد فیلمسازان ما در سینمای بین المللی است.\" جشنواره فیلم شب‌های سیاه تالین (P FF) عناوین دیگری را برای سی‌امین دوره خود که از 6 تا 22 نوامبر برگزار می‌شود، از جمله مسابقه فیلم بالتیک خود رونمایی کرده است. به گفته ادویناس پوک تا، متصدی مسابقه فیلم بالتیک، همکاری بین المللی انتخاب امسال را تعیین می کند. پنج فیلم توسط فیلمسازان خارج از کشورهای بالتیک کارگردانی شده است که استعداد و تخصص بالتیک نقش مهمی در تولید آنها دارد. پوک تا می گوید که انتخاب امسال نشان دهنده قدرت تولید مشترک بالتیک و سهم رو به رشد فیلمسازان ما در سینمای بین المللی است. تهیه کنندگان، بازیگران، سینماگران و دیگر متخصصان فیلم بالتیک تجربیات خود را فراتر از منطقه می برند و به طور فزاینده ای در پروژه های جاه طلبانه بین المللی درگیر می شوند. داستان‌های مرتبط تلویزیون Mikael Marcimain's The Cold Song بازگشتی نادر به فیلم‌های درام تلویزیون اروپایی (نگاه اول انحصاری) را نشان می‌دهد. تونی گیلروی می‌گوید بدون موفقیت آندو امکان‌پذیر نبود، 3 هفته زیر دریا (جمهوری چک، اسلواکی، لهستان، لیتوانی). مارتین کوبا آماتیا (صربستان، استونی) کارگردان. دین رادوانووی دایس-چینگ-او-مت (لیتوانی، لتونی، استونی) کارگردان. Kristijonas Vild i nas Dirt In Your Face (استونی، لتونی) کارگردان. Jaak Kilmi چگونه در طول جنگ طلاق بگیریم (لیتوانی، لوکزامبورگ، ایرلند، چک) کارگردان. Andrius Bla evi ius Lex Julia (فنلاند، لهستان، استونی، سوئد) کارگردان. Laura Hypp nen نقش مکمل (گرجستان، استونی، T rkiye، سوئیس، ایالات متحده آمریکا) کارگردان. آنا اوروشادزه"}, {"source": "Variety", "title": "Content Market and Conference Mipcom Attracts 10,100 Delegates, Down by Around 500", "link": "https://variety.com/2026/tv/global/mipcom-attendance-2026-1236911034/", "summary": "As Mipcom, the annual content market and conference in Cannes, wound down on Wednesday, Lucy Smith, the event s chief, revealed attendance figures for this year s edition. Total attendance this year was 10,100 delegates, down approximately 500 from last year, of which 3,150 were buyers that s 34% of the total delegate number down approximately [ ]", "date_str": "2026-10-14T14:28:39+00:00", "hash": "771ecf28acc88a92", "title_fa": "بازار محتوا و کنفرانس Mipcom 10100 نماینده را جذب می کند که حدود 500 نفر کاهش یافته است.", "summary_fa": "همانطور که Mipcom، بازار محتوا و کنفرانس سالانه در کن در روز چهارشنبه پایان یافت، لوسی اسمیت، رئیس رویداد، آمار حضور در نسخه امسال را فاش کرد. مجموع شرکت کنندگان امسال 10100 نماینده بود که تقریباً 500 نفر کمتر از سال گذشته بود که از این تعداد 3150 خریدار بودند که 34 درصد از تعداد کل نمایندگان تقریباً کاهش یافته است [] همانطور که Mipcom، بازار محتوا و کنفرانس سالانه در کن، در روز چهارشنبه تعطیل شد، لوسی اسمیت، رئیس رویداد، ارقام حضور امسال را برای حضور در این رویداد فاش کرد. اسمیت در یک کنفرانس مطبوعاتی گفت، من فکر می‌کنم آنچه که همه ما در این هفته اینجا دیدیم، صنعت سرگرمی جهانی است که دچار اختلال فوق‌العاده شده است. ادغام در حال تغییر شکل چشم‌انداز سرگرمی سنتی است، و در عین حال، ما شاهد هستیم که سازندگان، برندها، شرکت‌های فناوری و پلت‌فرم‌های دیجیتال به بازیگران کلیدی اقتصاد محتوا تبدیل می‌شوند، منابع جدیدی از سرگرمی، منابع جدید سرمایه‌گذاری، مخاطبان جدید و روش‌های جدید انجام کسب‌وکار را به ارمغان می‌آورند. داستان‌سرایی عمودی و میکرودرام‌های محبوب در Variety Vertical، قالب‌های موجود را به چالش می‌کشند، در حالی که هوش مصنوعی نحوه ساخت محتوا را تغییر می‌دهد. اما آنچه هیجان‌انگیز است این است که چگونه این صنعت از این اختلال استفاده می‌کند، و این اختلال در اینجا در Mipcom Cannes رخ می‌دهد. بنابراین استراتژی ما روشن است: تقویت موقعیت Mipcom به عنوان بازار بین المللی پیشرو برای محتوا، در حالی که شرکت ها، سرمایه گذاری ها، فناوری ها و مدل های کسب و کار را تغییر می دهند که سرگرمی را تغییر می دهند. ما از تجارت اصلی خود دور نمی شویم. کاملا برعکس ما در حال گسترش فرصت های اطراف آن هستیم. ما این کار را به سه روش کلیدی برای تحول صنعت انجام می‌دهیم: ارائه برندها، هوش مصنوعی، عمودی‌ها و سازندگان،"}, {"source": "Variety", "title": "Paul McCartney Calls Out Beatles Movies Because Paul Mescal Is Shorter Than John Lennon Actor; He Texted Director Sam Mendes: ‘Don’t Do This!’", "link": "https://variety.com/2026/film/news/paul-mccartney-beatles-movies-paul-mescal-too-short-1236911197/", "summary": "Paul McCartney has a bone to pick with Sam Mendes, the director of the upcoming four Beatles movies starring Paul Mescal as McCartney, Harris Dickinson as John Lennon, Joseph Quinn as George Harrison and Barry Keoghan as Ringo Starr. What s the issue? It all comes down to how tall Mescal is compared to his co-stars. [ ]", "date_str": "2026-10-14T14:24:31+00:00", "hash": "41f957fafb80705b", "title_fa": "پل مک‌کارتنی از فیلم‌های بیتلز نام می‌برد زیرا پل مسکال کوتاه‌تر از بازیگر جان لنون است. او به کارگردان سام مندز پیامک فرستاد: «این کار را نکن!»", "summary_fa": "پل مک کارتنی با سام مندز، کارگردان چهار فیلم آینده بیتلز که پل مسکال در نقش مک کارتنی، هریس دیکنسون در نقش جان لنون، ​​جوزف کوین در نقش جورج هریسون و بری کیوگان در نقش رینگو استار بازی می‌کنند، می‌تواند کار کند. موضوع چیست؟ همه چیز به قد مسکال در مقایسه با همبازی هایش برمی گردد. [ ] همه ما یک قد بودیم! مک کارتنی در پادکست Good Hang اعلام کرد که چگونه فیلم‌های مبتنی بر بیتلز به اشتباه او را کوتاه‌تر از هم گروه‌هایش نشان می‌دهند. قد همه ما یکسان بود و رینگو کمی کوچکتر بود. و اگر به عکس ها نگاه کنید، همه قد ما یکسان است. داستان‌های مرتبط A24 بریتانیایی «بدتر می‌شود»، «بازیکنان اصلی» و «وزارت زمان» در پارامونت+ در ایالات متحده پخش می‌شود. مک کارتنی درباره مسکال افزود. او از مردی که نقش جان را بازی می کند کوچکتر است. سم مندز در حال ساخت این فیلم است. گفتم، سام، فقط یک چیز دارم که باید به تو بگویم. می دانید، پل [مسکال] کمی کوچکتر است. من نمی دانم سام چگونه با آن کنار می آید. او یک عکس برای من فرستاد، عکسی از فیلمبرداری که انجام می دادند، و آنها در حال عبور از گذرگاه ابی رود هستند، و شخصیت پل به طور قابل توجهی کوچکتر است. بهش پیام دادم: سام! کوچکتر؟ این کار را نکن گفتی که این کار را نمی کنی مک کارتنی محبوب در Variety همچنین یک بار ناامیدی خود را به سم تیلور جانسون، کارگردان فیلم پسر هیچ کجا در سال 2009، که آرون تیلور-جانسون در نقش یک جان لنون نوجوان بازی کرد، ابراز کرد. توماس برودی-سنگستر نقش مکمل را در نقش مک کارتنی در درام بیوگرافی ایفا کرد، اما از تیلور-جانسون کوتاهتر است."}, {"source": "Variety", "title": "‘Zogsool’ Wins Four Prizes at Busan Vision Awards as ‘Full Moon’ Takes Three", "link": "https://variety.com/2026/film/festivals/zogsool-full-moon-busan-vision-awards-2026-1236911303/", "summary": "Sakhya Byamba’s “Zogsool” was the biggest winner at the Busan International Film Festival’s Vision Awards on Wednesday, taking home four prizes. The film won both the Netpac Award and the Fipresci Award, along with the Vision of Jiseok Award. It also shared the Hylife Vision Award with Sailesh Rathnakumar’s “Selvi,” which separately picked up the [ ]", "date_str": "2026-10-14T14:09:11+00:00", "hash": "4d621dc06e186453", "title_fa": "\"Zogsool\" برنده چهار جایزه در Busan Vision Awards شد و \"ماه کامل\" سه جایزه گرفت", "summary_fa": "فیلم «زوگ‌سول» ساخته ساخیا بیامبا با دریافت چهار جایزه بزرگ‌ترین برنده جشنواره بین‌المللی فیلم بوسان در روز چهارشنبه بود. این فیلم برنده جایزه Netpac و Fipresci به همراه جایزه Vision of Jiseok شد. همچنین جایزه Hylife Vision را با «Selvi» ساخته Sailesh Rathnakumar به اشتراک گذاشت، که به طور جداگانه [] Zogsool Sakhya Byamba بزرگترین برنده جوایز Vision جشنواره بین‌المللی فیلم بوسان در روز چهارشنبه بود و چهار جایزه را به خانه برد. در میان عناوین کره‌ای، ماه کامل جونگ جیهه برنده سه جایزه شد: جایزه CGV، جایزه K-Movie و جایزه تماشاگران Songwon Vision کره. Beyond Love s Horizon به کارگردانی پارک سونگ یول برنده جایزه فیلم مستقل KBS و جایزه Critic b شد و وون هیانگرا یکی از دو جایزه بهترین بازیگر سال را برای کارش در این فیلم دریافت کرد. کانگ سونگ هو دیگری را برای ردیابی کیهانی گرفت. Oh Sehyeon s Baler دو بار با ج         }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
