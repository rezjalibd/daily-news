ه برخی در این صنعت از Coxon انتقاد کرده اند، برخی دیگر در Anthropic و OpenAI نگرانی های او را تکرار کرده اند. در آخر هفته، داریو آمودی، مدیر عامل آنتروپیک، گفت که آزمایشگاه‌های هوش مصنوعی مرزی نیاز به سرعت توسعه دارند و در عین حال از زمان برای پیشبرد تراز"}, {"source": "Business Insider", "title": "As a local, there are 9 things I wish tourists knew before visiting Salem, Massachusetts", "link": "https://www.businessinsider.com/visiting-salem-october-advice-from-local-tourist-mistakes-2026-9", "summary": "I regularly visited Salem for years before my family moved to the storied Massachusetts town. JOSEPH PREZIOSO/AFP via Getty Images As a local, I have a front-row seat to the tourist crowds visiting Salem around Halloween . Travelers should prepare for packed streets, long lines, and zero available parking in October. Tourism is great for our economy, but visitors should do their best to shop at locally owned stores. The first time I experienced Salem , Massachusetts, over 15 years ago, I came as a tourist. The 45,000-person town became so near and dear to me that I never stopped returning. It didn't take long for my husband to fall in love with Salem as well, so we decided to get a Witch City address of our own in 2021. The town, best known as the backdrop of the 1692 witch trials, draws a huge influx of visitors every October, when it hosts its annual monthlong Haunted Happenings Festival. As a Salem resident, I see many newcomers arrive ready to dive into witchcraft and explore the historic streets without doing proper research. Here's what I think tourists should know before coming to Salem during the busiest time of year. Hotels and activities sell out months in advance, so book your itinerary as early as possible Salem can get really crowded in October. JOSEPH PREZIOSO/AFP via Getty Images Haunting Happenings Festival is one of the largest Halloween celebrations in the world, making October the busiest time in Salem. Sometimes, over 100,000 people flood the streets on a single day. Given the size of the crowds, this is not the best time to whip out the old broomstick and fly in on a whim. If you have a list of things you'd like to do and see during your visit, you must plan way ahead. Most ticketed attractions, tours, and events sell out months in advance, long before October begins. Hotels can also get completely booked a year in advance, so you may need to stay a few towns over or look into alternate, pricey rentals if you're planning a last-minute trip . The weather can be unpredictable in October, so expect the unexpected and pack layers Visitors often ask what to pack for a trip to Salem in October, but Massachusetts' weather can be very unpredictable in the fall. Don't be put off by the extended forecast. The temperature can be 74 degrees Fahrenheit one day and 47 degrees Fahrenheit the next. We've had some Octobers with beach-worthy days and others with snowstorms. Nothing is impossible, but Salem is gorgeous in any weather, especially in Octob", "date_str": "2026-09-15T15:33:39+00:00", "hash": "2a91af13018c36a0", "title_fa": "به عنوان یک محلی، 9 چیز وجود دارد که آرزو می کنم گردشگران قبل از بازدید از سالم، ماساچوست بدانند", "summary_fa": "من سالها قبل از اینکه خانواده ام به شهر معروف ماساچوست نقل مکان کنند، به طور مرتب از سالم دیدن می کردم. جوزف پرزیوسو/خبرگزاری فرانسه از طریق گتی ایماژ به عنوان یک محلی، من در ردیف جلو برای جمعیت توریستی که از سالم در حوالی هالووین بازدید می کنند، می روم. مسافران باید خود را برای خیابان‌های شلوغ، صف‌های طولانی و پارکینگ صفر در ماه اکتبر آماده کنند. گردشگری برای اقتصاد ما عالی است، اما بازدیدکنندگان باید تمام تلاش خود را برای خرید از فروشگاه های محلی انجام دهند. اولین باری که سالم، ماساچوست را بیش از 15 سال پیش تجربه کردم، به عنوان یک توریست آمدم. شهر 45000 نفری آنقدر برای من نزدیک و عزیز شد که هرگز از بازگشت باز ننشستم. طولی نکشید که شوهرم نیز عاشق سالم شد، بنابراین تصمیم گرفتیم در سال 2021 یک آدرس شهر جادوگر برای خودمان داشته باشیم. این شهر که بیشتر به عنوان پس‌زمینه محاکمه‌های جادوگران در سال 1692 شناخته می‌شود، هر ماه اکتبر، زمانی که میزبان جشنواره سالانه اتفاقات خالی از سکنه است، سیل عظیمی از بازدیدکنندگان را به خود جذب می‌کند. به عنوان یک ساکن سالم، می بینم که بسیاری از تازه واردان آماده غواصی در جادوگری و کاوش در خیابان های تاریخی بدون انجام تحقیقات مناسب هستند. در اینجا چیزی است که فکر می کنم گردشگران قبل از آمدن به سالم در شلوغ ترین زمان سال باید بدانند. هتل‌ها و فعالیت‌ها از ماه‌ها قبل به فروش می‌رسند، بنابراین هرچه زودتر برنامه سفر خود را رزرو کنید، سالم می‌تواند در ماه اکتبر واقعاً شلوغ شود. JOSEPH PREZIOSO/AFP از طریق Getty Images Haunting Happenings جشنواره یکی از بزرگترین جشن های هالووین در جهان است که اکتبر را شلوغ ترین زمان در سالم می کند. گاهی اوقات، بیش از 100000 نفر در یک روز در خیابان ها سرازیر می شوند. با توجه"}, {"source": "Business Insider", "title": "Instagram wants you to pay for its AI photo-editing filters — and it doesn't stop there", "link": "https://www.businessinsider.com/instagram-ai-photo-editing-tools-meta-one-monthly-subscription-pay-2026-9", "summary": "Meta is making Instagram users (like me) pay for more access to its AI photo-editing tools. Screenshots/Instagram/BI I've got to admit something. Meta's AI tools for editing photos are … pretty good. But! Meta will soon make you pay if you want to edit tons of your photos with AI. The Meta One monthly subscription will unlock additional AI usage and unique perks for its apps. I was having some unfettered fun playing with Instagram's new filters. Then I got hit with a paywall. \"Upgrade to Meta One Core to apply more AI effects or wait until tomorrow,\" a pop-up said on my screen. Curious, I clicked \"Upgrade.\" I was given the option for a free trial of Meta One , a new subscription that unlocks a litany of perks. This week, Meta is widely rolling out its latest subscription program after announcing the plans in May. If I accepted the monthlong trial, I could edit more photos on the app using Meta's AI \"effects\" it rolled out in July. After dozens of edits tweaking my latest professional headshots to look like they were taken on a disposable camera, or turning iPhone cat photos into higher-quality editorial shots, I wanted more. Meta s AI tools let users tweak and generate various edits to photos within the Instagram app. Would I share all of these on Insta? Probably not. Screenshots/Instagram/BI Meta has a good incentive to paywall premium features like AI. Making people pay for more editing tools, like the Effects Instagram promotes in-app, further pushes Meta up against photo-editing rivals like Adobe's Photoshop, VSCO, and emerging apps like the influencer-founded startup Tezza . Filters have always been part of the Instagram experience. It's why I first joined the app back in 2010. Would I have paid for photo-editing tools back then? No. If I'm honest, though, some of Meta's new AI photo editing tools are pretty darn good. And if there weren't the threat of content being labeled as \"Made with AI\" on Instagram, maybe I'd even post them. Meta is betting on subscriptions and bundles I swiftly signed up for the Meta One Core tier — a bundle targeting everyday consumers on Meta platforms — which would renew at $7.99 a month. The perks range from additional AI usage to unlocking the \"plus\" versions of Facebook, Instagram, and WhatsApp. Meta One subscribers can \"preview\" people's stories without actually watching them, use special app icons (like the retro Instagram one), and visually customize Facebook and WhatsApp. There are also tiers for professional account", "date_str": "2026-09-15T15:23:23+00:00", "hash": "cd007a3b10900392", "title_fa": "اینستاگرام از شما می‌خواهد که برای فیلترهای ویرایش عکس هوش مصنوعی آن هزینه کنید - و به همین جا ختم نمی‌شود", "summary_fa": "متا در حال وادار کردن کاربران اینستاگرام (مثل من) برای دسترسی بیشتر به ابزارهای ویرایش عکس هوش مصنوعی خود است. تصاویر/اینستاگرام/BI باید چیزی را اعتراف کنم. ابزارهای هوش مصنوعی متا برای ویرایش عکس‌ها بسیار خوب هستند. اما! اگر بخواهید تعداد زیادی از عکس های خود را با هوش مصنوعی ویرایش کنید، متا به زودی شما را وادار به پرداخت هزینه خواهد کرد. اشتراک ماهانه Meta One استفاده اضافی از هوش مصنوعی و مزایای منحصر به فرد را برای برنامه‌هایش باز می‌کند. من از بازی با فیلترهای جدید اینستاگرام لذت می بردم. سپس من با یک paywall ضربه خوردم. یک پاپ آپ روی صفحه نمایش من گفت: \"برای اعمال جلوه های هوش مصنوعی بیشتر به Meta One Core ارتقا دهید یا تا فردا صبر کنید.\" کنجکاو، روی \"ارتقا\" کلیک کردم. به من امکان آزمایش رایگان Meta One داده شد، یک اشتراک جدید که امتیازات زیادی را باز می کند. این هفته، متا به طور گسترده ای آخرین برنامه اشتراک خود را پس از اعلام برنامه ها در ماه مه اجرا می کند. اگر آزمایش یک ماهه را بپذیرم، می‌توانم عکس‌های بیشتری را در برنامه با استفاده از «افکت‌های» هوش مصنوعی متا که در ماه جولای عرضه شد، ویرایش کنم. پس از ده‌ها ویرایش که آخرین عکس‌های حرفه‌ای خود را به‌گونه‌ای تغییر دادم که به نظر برسند با یک دوربین یکبار مصرف گرفته شده‌اند، یا عکس‌های گربه آیفون را به عکس‌های ویرایشی با کیفیت‌تر تبدیل کردم، بیشتر می‌خواستم. ابزارهای هوش مصنوعی متا به کاربران این امکان را می‌دهند که عکس‌ها را در اپلیکیشن اینستاگرام تغییر دهند و ویرایش‌های مختلفی را ایجاد کنند. آیا همه اینها را در اینستا به اشتراک می گذارم؟ احتمالا نه. Screenshots/Instagram/BI Meta انگیزه خوبی برای ویژگی های پریمیوم paywall مانند هوش مصنوعی دارد. وادار کردن مردم به پرداخت هزینه بیشتر برای ابزارهای ویرایشی، مانند افکت‌های اینستاگرام که درون"}, {"source": "Business Insider", "title": "The best photos you missed from the 2026 Emmys", "link": "https://www.businessinsider.com/emmys-photos-inside-awards-show-2026-9", "summary": "Zendaya and Tom Holland at the Emmy Awards in September 2026. Todd Williamson/NBC via Getty Images The 2026 Emmys came and went in a flutter of awards and glamorous looks. Celebrities gathered at the Peacock Theater in Los Angeles for the event on Monday. The live broadcast didn't show everything, from celebrity couples to hugs between stars. The 2026 Emmys highlight reel might not be what you expected. On Monday night, Matthew Rhys made history by taking home not one but two awards. When Marcello Hernández took the stage to present, he invited Zendaya and \"Spider-Man\" to dine at his home. Later, John Mulaney roasted method acting and DJ Khaled in the span of two minutes. And Taylor Swift appeared in a pre-recorded skit as a rookie cop on \"Law and Order: SVU,\" leaving Easter Eggs for Swifties to analyze in her wake. The night was like an entertainment-filled Bingo card that kept viewers on their toes as celebrities honored the best TV of the year, including \" Widow's Bay \" and \"The Pitt,\" in their red-carpet best ( and worst looks , in some cases). Still, there were plenty of Emmys moments the live show didn't capture, from hugs between stars to appearances by celebrity couples. Check out some of the best moments you missed from the 2026 Emmys below. Zendaya and Tom Holland posed for a photo together. Zendaya and Tom Holland attend the Emmy Awards in September 2026. Todd Williamson/NBC via Getty Images Tom Holland didn't walk the red carpet with Zendaya , who arrived in a custom Prada gown. However, he joined her inside the event, sitting by her side throughout the show. The pair stood for a photo during the awards ceremony, grinning together. The couple caught up with Chase Infiniti. Tom Holland, Zendaya, and Chase Infiniti at the Emmy Awards in September 2026. Rich Polk/Variety via Getty Images Zendaya and Infiniti were both nominated for outstanding lead actress in a drama series for \"Euphoria\" and \"The Testaments\" at the 2026 Emmys. They didn't let the competition get in the way of their bond, laughing as they spoke. Zendaya also posed for a photo with Ayo Edebiri and Quinta Brunson. Ayo Edebiri, Zendaya, and Quinta Brunson at the Emmy Awards in September 2026. Todd Williamson/NBC via Getty Images Edebiri and Brunson were up for outstanding lead actress in a comedy series for their performances in \"The Bear\" and \"Abbott Elementary.\" The trio squeezed each other as they smiled for the shot. Elle Fanning shared a laugh with Jean Smart and Lisa Kudrow. Je", "date_str": "2026-09-15T15:17:58+00:00", "hash": "3b7ae7a332cf5591", "title_fa": "بهترین عکس هایی که از امی 2026 از دست دادید", "summary_fa": "زندایا و تام هالند در مراسم جوایز امی در سپتامبر 2026. تاد ویلیامسون/NBC از طریق گتی ایماژ جوایز امی 2026 با انبوهی از جوایز و ظاهری پر زرق و برق آمد و رفت. افراد مشهور روز دوشنبه در تئاتر طاووس در لس آنجلس برای این مراسم گرد هم آمدند. پخش زنده همه چیز را نشان نمی داد، از زوج های مشهور گرفته تا در آغوش گرفتن بین ستاره ها. حلقه برجسته امی 2026 ممکن است آن چیزی نباشد که انتظار داشتید. دوشنبه شب، متیو ریس با بردن نه یک بلکه دو جایزه تاریخ ساز شد. زمانی که مارچلو هرناندز برای ارائه روی صحنه رفت، از زندایا و «مرد عنکبوتی» دعوت کرد تا در خانه اش صرف غذا کنند. بعداً جان مولانی بازیگری متد و دی جی خالد را در مدت دو دقیقه برشته کرد. و تیلور سوئیفت در یک صحنه از پیش ضبط شده به عنوان یک پلیس تازه کار در \"قانون و نظم: SVU\" ظاهر شد و ایستر اگز را برای سویفتی ها گذاشت تا در پی او تحلیل کنند. آن شب مانند یک کارت بینگو پر از سرگرمی بود که بینندگان را در حالی نگه می‌داشت که افراد مشهور بهترین تلویزیون سال، از جمله «بیوه بیوه» و «پیت» را در بهترین‌ها (و در برخی موارد بدترین قیافه‌هایشان) در فرش قرمز تجلیل می‌کردند. با این حال، لحظات امی زیادی وجود داشت که نمایش زنده ثبت نمی کرد، از آغوش گرفتن بین ستاره ها تا حضور زوج های مشهور. برخی از بهترین لحظاتی را که از امی 2026 از دست داده اید را در زیر ببینید. زندایا و تام هالند با هم عکس گرفتند. زندایا و تام هالند در مراسم جوایز امی در سپتامبر 2026 شرکت کردند. تاد ویلیامسون/NBC از طریق گتی ایماژ تام هالند با زندایا که با لباس شخصی پرادا وارد شد روی فرش قرمز نرفت. با این"}, {"source": "Business Insider", "title": "The US fired over $22 billion in munitions fighting Iran and created stockpile shortages in the process, watchdog finds", "link": "https://www.businessinsider.com/us-fired-billions-in-weapons-fighting-iran-drained-stockpiles-report-2026-9", "summary": "US forces expended more than $22 billion in weapons fighting Iran, a new Pentagon watchdog report revealed. US Navy photo The US military fired $22 billion in weapons fighting Iran, a new watchdog report has found. The high expenditure rate has created shortages of strategic munitions. Experts have warned that the US could find itself insufficiently armed for a future conflict. US forces fired more than $22 billion in munitions fighting Iran this year, draining critical weapons stockpiles in the process, a new Defense Department watchdog report says. The Pentagon inspector general's report, which was published Monday evening, estimated the cost of Operation Epic Fury , which began on February 28, to be $33.4 billion as of June 29. That tally includes $22.3 billion for expended munitions. The new report, which offers a fresh account of the war's financial impact , cites the munitions expenditure figure to the Pentagon's budget office and said the estimate was based on replacement costs. Munitions expenditure during the war \"has resulted in strategic inventory shortfalls and revealed industrial base bottlenecks for munitions resupply,\" the report said. To address the issues, the report said, the Pentagon \"is working to streamline procurement processes and production lead times\" and to stockpile critical materials, components, and munitions. The White House and Pentagon leadership have repeatedly denied any reports of munitions shortages during the Iran war. Adm. Brad Cooper, head of US Central Command, which oversees American military operations in the Middle East, told CBS News recently that he was \"not concerned\" about munitions inventories and said the US is \"armed and ready for any contingency.\" A US Marine Corps F-35 takes off in the Middle East. US Marine Corps photo US forces struck more than 13,000 Iranian targets during the first few weeks of the conflict, employing expensive missiles launched from fighter jets, warships, and ground-based launchers. American troops and assets also fired high-end interceptors to defend against Tehran's missiles and drones. The Center for Strategic and International Studies, a US think tank, assessed in late May that American forces had already fired thousands of cruise missiles and missile interceptors, draining pre-war stockpiles. CSIS found that Tomahawk land-attack cruise missiles and certain key interceptors — such as those launched from Terminal High Altitude Area Defense and Patriot batteries — would take years", "date_str": "2026-09-15T15:17:04+00:00", "hash": "75a1ca3d9eb0b9d7", "title_fa": "دیده بان دریافت که ایالات متحده بیش از 22 میلیارد دلار مهمات را برای جنگ با ایران شلیک کرده و در این فرآیند کمبود ذخایر ایجاد کرده است.", "summary_fa": "گزارش جدید دیده‌بان پنتاگون نشان می‌دهد که نیروهای آمریکایی بیش از ۲۲ میلیارد دلار برای جنگ با ایران تسلیحات هزینه کرده‌اند. عکس نیروی دریایی ایالات متحده، یک گزارش جدید دیده بان نشان می دهد که ارتش ایالات متحده 22 میلیارد دلار سلاح در جنگ با ایران شلیک کرده است. نرخ بالای هزینه ها باعث کمبود مهمات استراتژیک شده است. کارشناسان هشدار داده اند که ایالات متحده ممکن است خود را به اندازه کافی برای یک درگیری در آینده مسلح نباشد. یک گزارش جدید دیده‌بان وزارت دفاع می‌گوید که نیروهای آمریکایی بیش از 22 میلیارد دلار مهمات را در سال جاری برای جنگ با ایران شلیک کردند که در این روند، ذخایر مهم تسلیحات را تخلیه کرد. گزارش بازرس کل پنتاگون که عصر دوشنبه منتشر شد، هزینه عملیات Epic Fury را که در 28 فوریه آغاز شد تا 29 ژوئن 33.4 میلیارد دلار تخمین زد. این آمار شامل 22.3 میلیارد دلار برای مهمات خرج شده است. در گزارش جدید، که گزارشی تازه از تأثیرات مالی جنگ ارائه می‌کند، به رقم هزینه‌های مهمات به دفتر بودجه پنتاگون اشاره می‌کند و می‌گوید این برآورد بر اساس هزینه‌های جایگزینی است. در این گزارش آمده است که مخارج مهمات در طول جنگ \"به کمبود موجودی استراتژیک منجر شده و گلوگاه های پایه صنعتی برای تامین مجدد مهمات را آشکار کرده است.\" در این گزارش آمده است که برای رسیدگی به این مسائل، پنتاگون \"در حال کار برای ساده کردن فرآیندهای تدارکات و زمان تولید\" و ذخیره مواد، قطعات و مهمات حیاتی است. کاخ سفید و رهبری پنتاگون بارها هرگونه گزارش در مورد کمبود مهمات در طول جنگ ایران را رد کرده اند. ادم برد کوپر، رئیس فرماندهی مرکزی ایالات متحده که بر عملیات نظامی آمریکا در خاورمیانه نظارت می کند، اخیراً به سی بی اس نیوز گفت که در مورد موجودی مهمات \"نگرانی\" ندارد و"}, {"source": "Business Insider", "title": "Why electric planes are almost impossible", "link": "https://www.businessinsider.com/why-electric-planes-are-almost-impossible-2026-9", "summary": "Electric cars took decades to go mainstream — electric planes might take even longer. We flew in Beta Technologies' Alia CX300, one of the most promising electric aircraft in the world, to find out why battery-powered flight has stayed almost impossible for more than 50 years. The aviation industry has burned through more than $20 billion with barely a working commercial product to show for it. Zunum Aero, Eviation, and Lilium all collapsed after raising serious money. So how is Beta different, and when will the rest of us actually get to fly electric? Read the original article on Business Insider", "date_str": "2026-09-15T14:55:21+00:00", "hash": "c041e0d6ade73805", "title_fa": "چرا هواپیماهای برقی تقریبا غیرممکن هستند", "summary_fa": "خودروهای برقی دهه ها طول کشید تا به جریان اصلی تبدیل شوند - هواپیماهای الکتریکی ممکن است حتی بیشتر طول بکشد. ما با Alia CX300 شرکت Beta Technologies، یکی از امیدوارکننده‌ترین هواپیماهای الکتریکی در جهان، پرواز کردیم تا دریابیم که چرا پرواز با باتری برای بیش از 50 سال تقریبا غیرممکن بوده است. صنعت هوانوردی بیش از 20 میلیارد دلار خرج کرده است و به سختی یک محصول تجاری کارآمد برای خود نشان می دهد. Zunum Aero، Eviation و Lilium همگی پس از جمع آوری پول جدی از بین رفتند. بنابراین چگونه بتا متفاوت است، و بقیه ما واقعاً چه زمانی می‌توانیم با برق پرواز کنیم؟ مقاله اصلی را در Business Insider Video Tech بخوانید چرا هواپیماهای الکتریکی تقریباً غیرممکن هستند نماد اشتراک گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند نماد فیس بوک حرف F. AJ Caldwell 2026-09-15T14:55:21.852Z نماد اشتراک گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند فیس بوک نماد حرف F. توضیحات Angle down icon نمادی به شکل زاویه ای که به سمت پایین است. کارکنان فناوری اخراج شده از گوگل و مایکروسافت با بازار کار دشواری روبرو می شوند نحوه مدیریت هزینه‌های رمز و در عین حال حفظ اهداف عامل در مسیر. داخل برنامه Kalshi برای جذب معامله گران وال استریت نماد پخش مثلثی که به سمت راست اشاره می کند که نشان می دهد این نوع رسانه قابل پخش است."}, {"source": "Business Insider", "title": "1.5 million student-loan borrowers left Biden's key repayment plan. Here's what's at stake for the 6 million others.", "link": "https://www.businessinsider.com/student-loan-borrowers-left-save-plan-whats-next-repayment-trump-2026-9", "summary": "The Education Department is encouraging student-loan borrowers to leave the SAVE repayment plan. Al Drago/Getty Images 1.5 million student-loan borrowers have left the SAVE repayment plan. Sept. 29 is the first deadline for borrowers to transition off the plan. Those who don't take action by their deadline will be placed in the most expensive repayment plan. Millions of student-loan borrowers have yet to leave a key repayment plan — and the first deadline is approaching. A Department of Education spokesperson confirmed that 1.5 million of the 7.5 million borrowers on the SAVE plan had selected a new repayment plan as of Monday morning, \"allowing them to make progress toward paying down their balances and access loan discharge benefits that current SAVE borrowers are missing out on.\" SAVE was a Biden-era repayment plan that offered borrowers lower monthly payments and a shorter timeline for debt relief. The Trump administration eliminated the plan this spring. Beginning July 1, servicers started notifying enrolled borrowers of their 90-day timeframe to either switch to a new plan or be placed in a standard plan with the highest payments. The 90-day deadline for the first batch of borrowers is approaching on September 29. Servicers said they expect to send notices to all SAVE borrowers by the end of 2026. Ayelet Sheffey covers all things student debt, from the latest Education Department news to stories of borrowers navigating their loans. To stay up to date on her coverage, sign up to get email alerts for her new stories here . What's next for SAVE borrowers About 80% of SAVE borrowers still haven't left the plan. Some borrowers have said they're waiting for their 90-day notices. Other borrowers said they switched off of SAVE before receiving their notice in order to begin earning credit toward forgiveness, either through an income-driven repayment plan or Public Service Loan Forgiveness, which forgives student debt for government and nonprofit workers. The Education Department did not comment on how quickly borrowers who do not select a new plan within their timeframe will be moved to a standard plan, or how they will be notified of the transition. Still, borrowers who have selected new plans have reported a range of glitches and errors . Some have received incorrect billing amounts when their actual payment was higher, and a separate group received notices that their accounts were delinquent and approaching default, when that wasn't the case. The departme", "date_str": "2026-09-15T14:46:03+00:00", "hash": "2395117512aed79a", "title_fa": "1.5 میلیون وام گیرنده وام دانشجویی طرح بازپرداخت کلیدی بایدن را ترک کردند. در اینجا چیزی است که برای 6 میلیون نفر دیگر در خطر است.", "summary_fa": "وزارت آموزش وام گیرندگان وام دانشجویی را تشویق می کند تا طرح بازپرداخت SAVE را ترک کنند. Al Drago/Getty Images 1.5 میلیون وام گیرنده وام دانشجویی از طرح بازپرداخت SAVE خارج شده اند. 29 سپتامبر اولین مهلت برای وام گیرندگان برای خروج از طرح است. کسانی که تا موعد مقرر اقدامی نکنند در گران ترین طرح بازپرداخت قرار می گیرند. میلیون‌ها وام گیرنده وام دانشجویی هنوز برنامه بازپرداخت کلیدی خود را ترک نکرده‌اند - و اولین مهلت نزدیک است. سخنگوی وزارت آموزش تأیید کرد که 1.5 میلیون از 7.5 میلیون وام گیرنده در طرح SAVE از صبح روز دوشنبه برنامه بازپرداخت جدیدی را انتخاب کرده اند، \"به آنها اجازه می دهد تا در جهت پرداخت مانده خود پیشرفت کنند و به مزایای تخلیه وام که وام گیرندگان SAVE فعلی از دست می دهند، دسترسی داشته باشند.\" SAVE یک طرح بازپرداخت دوره بایدن بود که به وام گیرندگان پرداخت های ماهانه کمتر و جدول زمانی کوتاه تری برای کاهش بدهی ارائه می داد. دولت ترامپ در بهار امسال این طرح را حذف کرد. از اول ژوئیه، سرویس‌دهندگان شروع به اطلاع رسانی به وام‌گیرندگان ثبت‌نام شده از بازه زمانی 90 روزه خود کردند تا یا به یک طرح جدید روی آورند یا در یک طرح استاندارد با بالاترین پرداخت‌ها قرار گیرند. آخرین مهلت 90 روزه برای اولین دسته از وام گیرندگان در 29 سپتامبر نزدیک است. سرویس دهندگان گفتند که انتظار دارند تا پایان سال 2026 اخطاریه هایی را برای همه وام گیرندگان SAVE ارسال کنند. Ayelet Sheffey همه بدهی های دانش آموزان را پوشش می دهد، از آخرین اخبار وزارت آموزش و پرورش تا داستان های وام گیرندگانی که وام های خود را مرور می کنند. برای به‌روز ماندن در مورد پوشش او، ثبت‌نام کنید تا هشدارهای ایمیلی برای داستان‌های جدید او در اینجا دریافت کنید. آینده وام گیرندگان SAVE چه"}, {"source": "Business Insider", "title": "I'm an American who moved to the Netherlands. If I had to move abroad again, I’d do these 5 things differently.", "link": "https://www.businessinsider.com/things-id-do-differently-moving-abroad-american-in-the-netherlands-2026-9", "summary": "As an American living in the Netherlands, there are a few things I wish I had done differently when moving abroad. Emily Pogue Six months ago, my husband and I moved from the US to the Netherlands. Looking back, there are a few things I wish I'd done differently during the move. I should've booked a hotel for our first night in the country and brought more of my medications. My great-grandparents emigrated from the Netherlands to the US, and my Dutch heritage was always in the background of my childhood. I played dress up with wooden shoes and my crayon drawings were full of tulips. So after my husband and I visited in 2024, we decided to move to the Netherlands on the Dutch-American Friendship Treaty (DAFT) visa. Six months after moving, here are the things I'd do differently if I could turn back the clock. I'd plan an in-person trip to scope out cities We moved to Utrecht despite never visiting the city before. Emily Pogue Although my husband and I had visited the Netherlands several times, we didn't know exactly where we wanted to live. So, we hired a real estate agent who works with internationals to be our boots-on-the-ground contact while we looked remotely from the States. When she would send us a potential listing, we'd run to Google Maps to try to get a sense of the neighborhood. However, there's only so much you can gauge from outdated Street View photos. If we liked the listing, we had to wake up at 3 a.m. for the video walkthrough and give an immediate (albeit groggy) \"Yes\" or \"No.\" After a month of looking, we were charmed by a traditional Dutch row house in one of the cities we'd never been to, Utrecht. We crossed our fingers that we'd like the place and put in our application. Thankfully, it was accepted. After living as digital nomads for two years, this leap of faith didn't seem that wild for my husband and me. However, I wish we had planned a scouting trip to check out each potential town, taking time to visit specific neighborhoods to get a sense of everything from the level of bike traffic to how close the nearest grocery store is. I wish I'd booked a hotel for our first night in the country Our Dutch apartment came partially furnished, including a bed. So, we figured we could arrive from the airport, wash the sheets, then sleep in our new home on our first night. Instead, we walked into our new apartment and discovered it was freezing cold. The heat wasn't working, and when it couldn't be fixed that day, we had to scramble to find a ho", "date_str": "2026-09-15T14:43:06+00:00", "hash": "f3c48cf2b27903eb", "title_fa": "من یک آمریکایی هستم که به هلند نقل مکان کردم. اگر مجبور بودم دوباره به خارج از کشور مهاجرت کنم، این 5 کار را متفاوت انجام می دادم.", "summary_fa": "به‌عنوان یک آمریکایی که در هلند زندگی می‌کنم، چند کار وجود دارد که آرزو می‌کنم در زمان مهاجرت به خارج از کشور متفاوت انجام می‌دادم. امیلی پوگ شش ماه پیش، من و شوهرم از ایالات متحده به هلند نقل مکان کردیم. با نگاهی به گذشته، چند کار وجود دارد که آرزو می‌کنم در حین جابجایی متفاوت انجام می‌دادم. من باید برای اولین شب اقامتمان در کشور هتل رزرو می کردم و داروهایم را بیشتر می آوردم. پدربزرگ و مادربزرگ من از هلند به ایالات متحده مهاجرت کردند و میراث هلندی من همیشه در پس زمینه کودکی من بود. من با کفش های چوبی لباس پوشیدم و نقاشی های مداد رنگی من پر از لاله بود. بنابراین پس از بازدید من و همسرم در سال 2024، تصمیم گرفتیم با ویزای معاهده دوستی هلند و آمریکا (DAFT) به هلند برویم. شش ماه پس از نقل مکان، در اینجا کارهایی وجود دارد که اگر می توانستم ساعت را به عقب برگردانم، متفاوت انجام می دادم. من یک سفر حضوری برای بررسی شهرها برنامه ریزی می کنم. علیرغم اینکه قبلاً هرگز از شهر بازدید نکرده بودیم به اوترخت نقل مکان کردیم. امیلی پوگ اگرچه من و همسرم چندین بار به هلند رفته بودیم، اما دقیقا نمی دانستیم کجا می خواهیم زندگی کنیم. بنابراین، ما یک مشاور املاک و مستغلات را استخدام کردیم که با بین‌المللی‌ها کار می‌کند تا تماس مستقیم ما با ما باشد در حالی که از راه دور از ایالات متحده نگاه می‌کردیم. زمانی که او فهرستی بالقوه برای ما ارسال می کرد، به سراغ نقشه های گوگل می رفتیم تا تلاش کنیم تا حسی از محله پیدا کنیم. با این حال، تنها چیزهای زیادی وجود دارد که می توانید از عکس های قدیمی نمای خیابان اندازه گیری کنید. اگر فهرست را دوست داشتیم، باید ساعت 3 صبح بیدار می‌شدیم تا ویدیو"}, {"source": "Business Insider", "title": "With yields at 2007 highs, investors say 'disorderly' bond moves are the biggest risk right now", "link": "https://www.businessinsider.com/wall-street-disorderly-bond-move-markets-top-risk-treasurys-fed-2026-9", "summary": "Michael M. Santiago/Getty Images 10-year Treasury yields touched their highest level since 2007 on Tuesday. Bank of America survey reveals bond yield spikes now surpass AI concerns for fund managers. Experts predict a Fed rate hike due to persistent high yields and inflation pressures on markets. The bond roller coaster ride in September has risen in investors' minds as the top risk to markets right now. Bond-market volatility was rattling stocks again on Tuesday, as the 10-year Treasury yield jumped to its highest level in nearly two decades. It rose to 5.04% early in the day before paring that back to around 5%. Major indexes dropped on the move, which comes as the Federal Reserve kicks off its policy meeting that's widely expected to end with a 25 basis point rate hike on Wednesday. Bank of America said on Tuesday that investors in its latest survey of fund managers flagged chaos in fixed income as the biggest risk to markets, surpassing other threats like an AI bubble and a second wave of inflation. \"The top tail risk in September is 'disorderly' rise in bond yields,\" BofA analysts wrote. While bond yields have surged, the moves might not yet be considered \"disorderly.\" It took roughly four months for the 10-year Treasury yield to go from 4.5% to 5%, and such a gradual move is thought to be more easily digested than a more sudden spike. Still, it's clear that markets have been spooked by the bond swings, and the higher borrowing costs are already being felt by US consumer and businesses. The moves also point to simmering dissatisfaction among investors about America's fiscal path. Carol Schleif, chief market strategist at BMO Wealth Management noted that the Treasury surge suggests that investors aren't happy with how policy is being crafted, and are selling bonds in response, pushing yields up in the process. Markets were disappointed in this regard last week when Treasury Secretary Scott Bessent announced a $6 billion bond buyback , which did nothing to stem the rise in yields. \"Even though the rise in bond yields so far this year has been orderly, and it has not happened overnight, these elevated yields could be here to stay for some time, especially with geopolitical concerns and elevated energy prices continuing to remain front and center,\" she said. Others have expressed similar concerns about the risk to broader markets posed by rising yields. Richard Saperstein, chief investment officer of Treasury Partners, predicted on Monday that stocks woul", "date_str": "2026-09-15T14:26:37+00:00", "hash": "81800d370c516553", "title_fa": "سرمایه گذاران می گویند که با بازدهی در بالاترین سطح سال 2007، حرکت های \"بی نظم\" اوراق قرضه بزرگترین ریسک در حال حاضر است.", "summary_fa": "مایکل ام. سانتیاگو/ گتی ایماژ بازدهی 10 ساله خزانه داری روز سه شنبه به بالاترین سطح خود از سال 2007 رسید. نظرسنجی بانک آمریکا نشان می دهد که افزایش بازده اوراق قرضه اکنون از نگرانی های مربوط به هوش مصنوعی برای مدیران صندوق پیشی گرفته است. کارشناسان افزایش نرخ بهره فدرال رزرو را به دلیل بازدهی بالا و فشارهای تورمی بر بازارها پیش بینی می کنند. ترن هوایی اوراق قرضه در ماه سپتامبر در ذهن سرمایه گذاران به عنوان بزرگترین خطر برای بازارها در حال حاضر افزایش یافته است. نوسانات بازار اوراق قرضه در روز سه‌شنبه بار دیگر سهام را به لرزه درآورد، زیرا بازدهی 10 ساله خزانه‌داری به بالاترین سطح خود در نزدیک به دو دهه اخیر جهش کرد. در اوایل روز به 5.04٪ افزایش یافت و سپس به حدود 5٪ رسید. با این حرکت، شاخص‌های اصلی کاهش یافتند، که در حالی رخ می‌دهد که فدرال رزرو جلسه سیاست‌گذاری خود را آغاز می‌کند که انتظار می‌رود با افزایش ۲۵ واحدی در روز چهارشنبه پایان یابد. بانک آمریکا روز سه‌شنبه اعلام کرد که سرمایه‌گذاران در آخرین نظرسنجی خود از مدیران صندوق‌ها، هرج و مرج در درآمد ثابت را بزرگ‌ترین خطر برای بازارها می‌دانند و از تهدیدهای دیگر مانند حباب هوش مصنوعی و موج دوم تورم پیشی می‌گیرند. تحلیلگران BofA نوشتند: «بالاترین ریسک در ماه سپتامبر، افزایش «بی نظم» در بازده اوراق قرضه است. در حالی که بازده اوراق قرضه افزایش یافته است، ممکن است این حرکت ها هنوز \"بی نظم\" تلقی نشود. تقریباً چهار ماه طول کشید تا بازدهی خزانه داری 10 ساله از 4.5 درصد به 5 درصد برسد و تصور می‌شود که چنین حرکت تدریجی راحت‌تر از یک افزایش ناگهانی تر قابل هضم است. با این حال، واضح است که بازارها به دلیل نوسانات اوراق قرضه ترسیده شده اند و هزینه های استقراض بالاتر در حال حاضر توسط"}, {"source": "Business Insider", "title": "People ask if I'm sad my son started kindergarten. After $87,000 in day care bills, I'm celebrating.", "link": "https://www.businessinsider.com/daycare-cost-more-than-mortgage-childcare-expenses-2026-9", "summary": "Mesha Griffith is excited for her son to start kindergarten so she won t have to pay astronomical prices for pre-K. Courtesy of Mesha Griffith Mesha Griffith is a children's book author and full-time working mom of one son in Columbus, Ohio. She spent over $87,000 on childcare costs over five years. Not needing to pay $1,500 each month, she and her husband plan to \"bump up\" their savings. This as-told-to essay is based on a conversation with Mesha Griffith . It has been edited for length and clarity. In the middle of August, I dropped my 5-year-old son, Ellington, off for his first day of kindergarten . Since then, people have been asking whether I feel sad about it, about my little boy growing up and leaving day care behind . In response, I usually look at them and nearly laugh. \"I've spent more than $87,000 on day care over the past five years,\" I tell them. So no, I'm not sad. We both work full time Before Ellington was born, I knew we would use day care. My husband and I both work full-time , and staying home wasn't financially realistic if we wanted to meet our long-term goals. We wanted to save for Ellington's future college expenses and build a secure retirement so that he would never feel responsible for taking care of us financially later in life. Mesha Griffith and her husband both work full time. Courtesy of Mesha Griffith We also wanted to maintain the ability to enjoy things like family vacations without constantly worrying about money. Personally, I never wanted to be a stay-at-home mom. I genuinely enjoy my work and have spent years building a career negotiating contracts I wasn't ready to walk away from. The thought of restarting my career after a five-year gap felt daunting. Both sets of grandparents were still working, and while they would have loved to help care for Ellington while we worked, it simply wasn't an option. My son went to day care at 3 months When Ellington was 12 weeks old, he started at a day care center near our home. It wasn't anything fancy, just a typical day care. We knew it would be expensive, but it was a cost we had to accept. There was no way around it, so dwelling on it felt pointless. For about nine months, we paid $1,600 a month. Then he moved to another standard day care shortly after he turned 1, where tuition increased to between $1,495 and $1,540 a month, depending on the month. We continued paying that amount until he started kindergarten in August. Mesha Griffith s son started going to day care when he wa", "date_str": "2026-09-15T14:26:01+00:00", "hash": "215eaaf643ac2e52", "title_fa": "مردم می پرسند که آیا ناراحتم که پسرم مهدکودک را شروع کرد؟ بعد از 87000 دلار صورتحساب مهدکودک، دارم جشن می‌گیرم.", "summary_fa": "مشا گریفیث برای شروع مهدکودک پسرش هیجان زده است، بنابراین او مجبور نیست برای پیش از K هزینه های نجومی بپردازد. با حسن نیت از مشا گریفیث Mesha Griffith نویسنده کتاب کودکان و مادر شاغل تمام وقت یک پسر در کلمبوس، اوهایو است. او بیش از 87000 دلار برای هزینه های مراقبت از کودکان در طول پنج سال هزینه کرد. او و همسرش که نیازی به پرداخت 1500 دلار در هر ماه ندارند، قصد دارند پس انداز خود را افزایش دهند. این مقاله گفته شده بر اساس گفتگو با مشا گریفیث است. برای طول و وضوح ویرایش شده است. در اواسط ماه اوت، پسر 5 ساله ام الینگتون را برای اولین روز مهدکودک رها کردم. از آن زمان، مردم می پرسند که آیا از این موضوع ناراحت هستم، از اینکه پسر کوچکم بزرگ شده و مهد کودک را پشت سر گذاشته است. در پاسخ، معمولاً به آنها نگاه می کنم و تقریباً می خندم. به آنها می گویم: \"من در پنج سال گذشته بیش از 87000 دلار برای مراقبت های روزانه خرج کرده ام.\" پس نه، من ناراحت نیستم. هر دوی ما تمام وقت کار می کنیم قبل از تولد الینگتون، می دانستم که از مهدکودک استفاده خواهیم کرد. من و شوهرم هر دو به طور تمام وقت کار می کنیم، و اگر بخواهیم به اهداف بلندمدت خود برسیم، ماندن در خانه از نظر مالی واقع بینانه نبود. ما می‌خواستیم برای هزینه‌های آینده دانشگاه الینگتون پس‌انداز کنیم و یک دوران بازنشستگی مطمئن بسازیم تا او هرگز در آینده در زندگی مسئولیت مراقبت مالی از ما را احساس نکند. مشا گریفیث و همسرش هر دو تمام وقت کار می کنند. با حسن نیت از مشا گریفیث ما همچنین می خواستیم توانایی لذت بردن از چیزهایی مانند تعطیلات خانوادگی را بدون نگرانی دائمی در مورد پول حفظ کنیم. من شخصاً هرگز نمی"}, {"source": "Business Insider", "title": "2 reasons investors are eyeing agriculture bets", "link": "https://www.businessinsider.com/agriculture-etfs-futures-investing-iran-war-hedges-2026-9", "summary": "More smart money is going into food futures markets, as well as wheat and soybeans. Lu Wenxiang/Xinhua via Getty Images Investors are putting money into food ETFs and futures markets as fertilizer prices climb. The Iran war, the Ukraine-Russia war, and a forecasted record El Niño threaten global food stocks. Food commodity investments offer a potential hedge against a longer, more costly Iran War. Investors are piling into bets on higher food prices. Inflows into the industry-leading Invesco DB Agriculture ETF reached record highs of $413 million in the first quarter. Across eight agricultural ETFs managed by commodity investing firm Teucrium, investors have poured in another $345 million this year to date, driving roughly 80% of the funds' growth from $227.4 million to $666.7 million. And it's not just ETF investors, smart money is going long on food, too. Professional investors held their largest net-long positions in all five food futures markets, the highest in a year, according to the CFTC's September Commitments of Traders report. Wheat and soybeans were the second-largest holdings since tracking began in 2009. The bets on agriculture come as the Iran War heats back up and concerns of key supply shortages because of the blockade of the Strait of Hormuz are met with concerns of worsening weather. Fertilizer prices are rising right as farmers in the Northern Hemisphere prepare to buy next year's fertilizer with their purse from this year's fall harvest. According to a North Dakota State University study , they're likely to remain elevated through 2028. High fertilizer costs mean that farmers will have to ration their fertilizer use, depressing crop yields. This could cause global food prices to rise 5% in the first half of 2027, according to a JPMorgan report. Some of the investor interest has to do with the particular threat this war poses on the fertilizer supply chain and global shipping, said Jake Hanley, Teucrium's director of investments. Others are considering it because food commodities act as great hedges during downturns. \"Every time the S P 500 has gone down 10% or more, this agriculture benchmark has outperformed,\" Hanley said, referring to the performance of the Agricultural Fund Index, which is equally weighted among four major food commodities, since its 2012 inception. His firm is seeing demand from individual traders who speculate on commodities, as well as financial advisors looking for a hedge for their clients in preparation for wor", "date_str": "2026-09-15T13:59:10+00:00", "hash": "2510717b754ed032", "title_fa": "2 دلیل که سرمایه گذاران به شرط بندی های کشاورزی چشم دوخته اند", "summary_fa": "پول هوشمند بیشتری وارد بازارهای آتی مواد غذایی و همچنین گندم و سویا می شود. Lu Wenxiang/Xinhua از طریق Getty Images با افزایش قیمت کود، سرمایه گذاران در حال سرمایه گذاری در صندوق های ETF مواد غذایی و بازارهای آتی هستند. جنگ ایران، جنگ اوکراین و روسیه و رکورد پیش‌بینی ال نینو، ذخایر جهانی مواد غذایی را تهدید می‌کند. سرمایه‌گذاری در کالاهای غذایی، یک مانع بالقوه در برابر جنگ طولانی‌تر و پرهزینه‌تر ایران است. سرمایه گذاران روی قیمت های بالاتر مواد غذایی شرط بندی می کنند. ورودی به صندوق پیشرو صنعت Invesco DB Agriculture ETF به رکورد 413 میلیون دلار در سه ماهه اول رسید. در هشت ETF کشاورزی که توسط شرکت سرمایه‌گذاری کالای Teucrium مدیریت می‌شوند، سرمایه‌گذاران در سال جاری 345 میلیون دلار دیگر سرمایه‌گذاری کرده‌اند که تقریباً 80 درصد از رشد صندوق‌ها را از 227.4 میلیون دلار به 666.7 میلیون دلار رسانده است. و این فقط سرمایه گذاران ETF نیستند، پول هوشمند نیز برای مدت طولانی صرف غذا می شود. بر اساس گزارش CFTC در سپتامبر تعهدات معامله گران، سرمایه گذاران حرفه ای بزرگترین موقعیت های خالص خرید خود را در هر پنج بازار آتی مواد غذایی داشتند که بالاترین میزان در یک سال گذشته است. گندم و سویا دومین ذخایر بزرگ از زمان آغاز ردیابی در سال 2009 بودند. شرط بندی ها بر روی کشاورزی در حالی صورت می گیرد که جنگ ایران دوباره داغ شده و نگرانی ها در مورد کمبود عرضه به دلیل محاصره تنگه هرمز با نگرانی از بدتر شدن آب و هوا مواجه شده است. قیمت کود در حال افزایش است زیرا کشاورزان در نیمکره شمالی آماده می شوند تا کود سال آینده را با کیف خود از برداشت پاییز امسال خریداری کنند. بر اساس یک مطالعه دانشگاه ایالتی داکوتای شمالی، احتمالاً تا سال 2028 افزایش می‌یابد. هزینه‌های بالای کود به این معنی"}, {"source": "Business Insider", "title": "Inside Turkey's $2 billion marble and stone industry", "link": "https://www.businessinsider.com/inside-turkeys-2-billion-marble-and-stone-industry-2026-9", "summary": "Most of the world's marble and travertine comes from Turkey, the world's top exporter of natural stone. But even though the country has been mining for thousands of years, waste heaps are still piling up, and mining companies are struggling to handle all of the excess stone. We went to Turkey to see how the country's natural stone industry became a $2 billion business and what the costs to the environment really are. Read the original article on Business Insider", "date_str": "2026-09-15T13:50:03+00:00", "hash": "98406ac1ddb29ed9", "title_fa": "در داخل صنعت 2 میلیارد دلاری سنگ مرمر و سنگ ترکیه", "summary_fa": "بیشتر سنگ مرمر و تراورتن جهان از ترکیه، بزرگترین صادرکننده سنگ طبیعی در جهان، به دست می آید. اما با وجود اینکه این کشور هزاران سال است که در حال استخراج معادن بوده است، هنوز انباشته زباله ها در حال انباشته شدن است و شرکت های معدنی در تلاش هستند تا سنگ های اضافی را مدیریت کنند. ما به ترکیه رفتیم تا ببینیم صنعت سنگ طبیعی این کشور چگونه به یک تجارت 2 میلیارد دلاری تبدیل شده و واقعاً چه هزینه هایی برای محیط زیست دارد. مقاله اصلی را در Business Insider Video International Inside در صنعت سنگ مرمر و سنگ ترکیه 2 میلیارد دلاری بخوانید نماد اشتراک گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند نماد فیس بوک حرف F. Selima Hussain and Yuelei Song 2026-09-15T13:50:03.205Z نماد اشتراک گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند فیس بوک نماد حرف F. توضیحات Angle down icon نمادی به شکل زاویه ای که به سمت پایین است. چگونه فیفا میلیون‌ها دلار برای چمن جام جهانی خرج می‌کند نماد پخش مثلثی که به سمت راست اشاره می‌کند که نشان می‌دهد این نوع رسانه قابل پخش است. استلا لی از BYD درباره گسترش ربات‌های تجاری و خانگی صحبت می‌کند. شهری که 70 درصد فوتبال های جهان را تشکیل می دهد نماد پخش مثلثی که به سمت راست اشاره می کند که نشان می دهد این نوع رسانه قابل پخش است."}, {"source": "Business Insider", "title": "Bandolier review: This crossbody phone case is like finally having pockets", "link": "https://www.businessinsider.com/guides/style/bandolier-phone-case-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Samantha Crozier, Sally Kaplan/Business Insider When everything you need is right at your hip, you can move a lot more freely. There are many iterations of the wearable phone-wallet case, but Bandolier makes the most polished version we've tested. Besides being extremely convenient for us to use, the cases have the luxe look of a fine leather accessory. Taylor Swift and Selena Gomez have been spotted with them, so naturally, we couldn't wait to test them out. After months of using it, I can say one thing: it's like having pockets! I no longer have to play the balancing game of clutching my phone and a coffee in one hand while I struggle to unlock my door. It may not seem like much, but for a person who wears women's clothing, the convenience of a pocket is a small miracle. Shop all phone cases at Bandolier What we love about Bandolier What could be better Hands-free way to hold cards and small essentials More expensive than a standard phone case Can replace a small bag Can feel bulky with the wallet attached Great for travel, errands, and events Only compatible with iPhones Smart add-ons available Gold hardware can get scuffed The Bandolier Remi set with accessories Samantha Crozier/Business Insider How I wear my Bandolier Samantha Crozier/Business Insider On the left , I added the wallet and AirPods case for times when I want this to fully replace a purse. It's especially useful when I'm running out the door to walk my dog, since I can grab my phone, keys, cards, and earbuds without thinking about a bag. I also use it this way for grocery runs because my phone is easy to access for my list, and I'm not juggling a purse on top of reusable totes. On the right is how I carry my phone when I'm actually using a purse. The wristlet keeps my phone secure and easy to grab, so I'm not digging around in my bag every time I need it. It's also handy for weddings, dinners, and other events where I might set my purse down but still want my phone close for taking photos. Review of the Remi case Samantha Crozier/Business Insider The Remi case is one of those accessories that actually makes everyday life easier. It's convenient when I'm running errands, walking the dog, traveling, or anytime I want my phone within reach without digging through a bag. The leather feels high-quality, the hardware looks polished, and Bandolier makes it in so many colors and finishes that it feels mo", "date_str": "2026-09-15T13:49:29+00:00", "hash": "81842bce24eb3a47", "title_fa": "بررسی Bandolier: این قاب گوشی متقاطع مانند در نهایت داشتن جیب است", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Samantha Crozier، Sally Kaplan/Business Insider وقتی همه چیزهایی که نیاز دارید درست در ناحیه ران شما باشد، می توانید خیلی آزادتر حرکت کنید. تکرارهای زیادی از قاب کیف پول تلفن پوشیدنی وجود دارد، اما Bandolier صیقلی ترین نسخه ای را که ما آزمایش کرده ایم ساخته است. قاب‌ها علاوه بر اینکه استفاده از آن برای ما بسیار راحت است، ظاهری لوکس مانند لوازم جانبی چرمی دارند. تیلور سوئیفت و سلنا گومز با آنها دیده شده اند، بنابراین طبیعتاً ما نمی توانستیم منتظر آزمایش آنها باشیم. بعد از ماه ها استفاده از آن، می توانم یک چیز را بگویم: مثل داشتن جیب است! من دیگر مجبور نیستم در حالی که برای باز کردن قفل درم تلاش می کنم، بازی متعادل کردن گوشی و یک قهوه را در یک دست انجام دهم. شاید زیاد به نظر نرسد، اما برای فردی که لباس زنانه می پوشد، راحتی یک جیب یک معجزه کوچک است. همه قاب‌های گوشی را در Bandolier بخرید چیزی که ما در مورد Bandolier دوست داریم چه چیزی می‌تواند بهتر باشد روش هندزفری برای نگه‌داشتن کارت‌ها و لوازم کوچک گران‌تر از یک قاب گوشی استاندارد می‌تواند کیف کوچکی را جایگزین کند. من Bandolier Samantha Crozier/Business Insider در سمت چپ، کیف پول و کیف AirPods را برای مواقعی که می‌خواهم به طور کامل جایگزین کیف پول شود، اضافه کردم. مخصوصاً وقتی از در بیرون می‌روم تا سگم را راه بروم، زیرا می‌توانم تلفن، کلیدها، کارت‌ها و هدفون‌هایم را بدون فکر کردن به کیفم در دست بگیرم. من همچنین از این روش برای خواربارفروشی استفاده می‌کنم، زیرا دسترسی به تلفن من برای لیست من آسان است، و من یک کیف پول را در بالای وسایل قابل استفاده مجدد قرار نمی‌دهم. در سمت راست نحوه"}, {"source": "Business Insider", "title": "Iranian strikes damaged or destroyed hundreds of buildings at US bases across 8 countries, Pentagon watchdog says", "link": "https://www.businessinsider.com/iranian-strikes-damaged-hundreds-buildings-us-bases-middle-east-report-2026-9", "summary": "US forces conducted extensive air defense operations in the Middle East during Operation Epic Fury, but some enemy munitions still reached their targets. US Army photo Iranian strikes damaged and destroyed hundreds of facilities at US bases in the Middle East. A new Pentagon watchdog report reveals the scope of damage caused by Iran's strikes against the US. Attacks on a key US naval base caused logistical challenges for American warships in the region. Iranian strikes damaged and destroyed hundreds of buildings and structures at US military bases across the Middle East this year, a new Defense Department watchdog report has revealed. The Pentagon inspector general's report, released on Monday evening, offers a fresh look at the impact of the Iran war , including the scope of damage caused by Tehran's strikes against the US following the start of joint American-Israeli military action earlier this year. US bases in Kuwait, Bahrain, Qatar, the United Arab Emirates, Saudi Arabia, Iraq, Oman, and Jordan took damage, the report said. It cited information shared by US Central Command, which oversees American military operations in the Middle East. The report to Congress, which covers developments between April 1 and June 30, does not say how much it could cost to repair those facilities. It did acknowledge, however, that Iranian attacks on US diplomatic facilities in four countries caused roughly $184 million in damage. US and partner forces shot down more than 6,000 Iranian drones and 1,500 ballistic missiles that targeted their locations, but some munitions slipped past their air defenses, causing both damage and casualties across the region. Among the facilities struck during the fighting was a US naval base in Bahrain , the American Navy's main logistics hub supporting operations in the region. Tehran targeted the base with both ballistic missiles and drones, forcing the US to divert naval sustainment resources from Bahrain to alternate locations. Iranian forces launched thousands of missiles and drones at US and partner forces. Wana News Agency/via REUTERS The report said the establishment of support naval infrastructure \"posed significant challenges\" during Operation Epic Fury , partly due to uncertainty over port access from host countries. Distance was another factor. For instance, CENTCOM shifted logistics support to Diego Garcia , a joint US-UK base in the Indian Ocean, but that required logistics cycles of more than two weeks because of the extended ", "date_str": "2026-09-15T13:47:04+00:00", "hash": "0040bd60860d718c", "title_fa": "دیده‌بان پنتاگون می‌گوید حملات ایران صدها ساختمان در پایگاه‌های ایالات متحده در ۸ کشور را تخریب یا تخریب کرده است.", "summary_fa": "نیروهای آمریکایی در طول عملیات حماسه خشم، عملیات دفاع هوایی گسترده ای را در خاورمیانه انجام دادند، اما برخی مهمات دشمن همچنان به اهداف خود رسیدند. عکس ارتش ایالات متحده حملات ایران صدها تأسیسات را در پایگاه های ایالات متحده در خاورمیانه آسیب رساند و ویران کرد. گزارش جدید دیده‌بان پنتاگون دامنه خسارات ناشی از حملات ایران به آمریکا را نشان می‌دهد. حملات به یک پایگاه کلیدی نیروی دریایی ایالات متحده باعث ایجاد چالش های لجستیکی برای کشتی های جنگی آمریکایی در منطقه شد. گزارش جدید دیده‌بان وزارت دفاع نشان می‌دهد که حملات ایران در سال جاری صدها ساختمان و ساختمان در پایگاه‌های نظامی آمریکا در سراسر خاورمیانه را تخریب کرده و ویران کرده است. گزارش بازرس کل پنتاگون که شامگاه دوشنبه منتشر شد، نگاهی تازه به تأثیر جنگ ایران، از جمله دامنه آسیب‌های ناشی از حملات تهران علیه ایالات متحده پس از شروع اقدام نظامی مشترک آمریکا و اسرائیل در اوایل سال جاری ارائه می‌کند. در این گزارش آمده است که پایگاه های آمریکا در کویت، بحرین، قطر، امارات متحده عربی، عربستان سعودی، عراق، عمان و اردن آسیب دیده اند. این گزارش به اطلاعات به اشتراک گذاشته شده توسط فرماندهی مرکزی ایالات متحده، که بر عملیات نظامی آمریکا در خاورمیانه نظارت دارد، اشاره کرد. گزارش به کنگره، که تحولات بین 1 آوریل و 30 ژوئن را پوشش می دهد، نمی گوید که تعمیر این تاسیسات چقدر می تواند هزینه داشته باشد. با این حال، این کشور اذعان کرد که حملات ایران به تأسیسات دیپلماتیک ایالات متحده در چهار کشور تقریباً 184 میلیون دلار خسارت وارد کرده است. نیروهای آمریکایی و شرکای آن بیش از 6000 پهپاد ایرانی و 1500 موشک بالستیک را که مکان های آنها را هدف قرار دادند، سرنگون کردند، اما برخی مهمات از روی پدافند هوایی آنها عبور کرد و باعث خسارت و تلفات در سراسر"}, {"source": "Business Insider", "title": "The 21 actors with the most Emmy wins of all time", "link": "https://www.businessinsider.com/actors-with-most-emmy-awards", "summary": "Jean Smart won five Emmys for Hacks, including one this year. Frazer Harrison/Getty Images The Emmys are pretty much the Oscars for television. Apple TV's \"Widow's Bay\" won big at the 2026 Emmys , which were held Monday. We compiled a list of actors with the most Emmys, from Mary Tyler Moore to Bryan Cranston. An Emmy is the biggest award an actor can win for their work on the small screen — and when there's a show or a performance Emmy voters love, it often gets multiple nominations and wins. We've pored over the stats and compiled a list of the most Emmy-awarded actors of all time. It includes some of the biggest TV stars of all time, including Bryan Cranston , Betty White, Mary Tyler Moore, and Julia Louis-Dreyfus. In fact, Louis-Dreyfus is tied with Cloris Leachman, Jean Smart, and Allison Janney for eight Emmy wins as a performer and with Carl Reiner for the most total Emmy wins among the actors on this list, with 11, if you include their awards in other categories, too. The total Emmy wins listed here aren't exclusively for performances: Some on this list have won for writing, directing, or producing — Cranston was a producer on \"Breaking Bad,\" and Louis-Dreyfus is an executive producer for \" Veep ,\" for example — but the majority of their Emmys are for acting. Here are the actors with the most Emmy wins. Carrie Wittmer contributed to a prior version of this article. 15 (tie). Don Knotts — 5 wins and 5 nominations Don Knotts at the 1962 Emmy Awards. NBC/NBCUniversal/Getty Images Knotts was nominated for five Emmy Awards (in 1961, 1962, 1963, 1966, and 1967) for his performance as Barney Fife in \"The Andy Griffith Show\" — and he won them all. 15 (tie). John Larroquette — 5 wins and 7 nominations John Larroquette at the 1985 Emmy Awards. George Long /American Broadcasting Companies/Getty Images Larroquette won four consecutive Emmys from 1985 to 1988 for his performance in \"Night Court.\" His last win came for his guest role in \"The Practice\" in 1998. 15 (tie). Candice Bergen — 5 wins and 9 nominations Candice Bergen at the 1995 Emmy Awards. Bob Riha, Jr./Getty Images All five of Bergen's wins came from her performance as the titular role in the CBS sitcom \"Murphy Brown.\" She was nominated for an additional two awards in the 2000s for \"Boston Legal.\" 15 (tie). Peter Falk — 5 wins and 12 nominations Peter Falk at the 1976 Emmy Awards. ABC Photo Archives/Disney General Entertainment Content/Getty Images All but one of Falk's Emmys came from his long-runni", "date_str": "2026-09-15T13:45:25+00:00", "hash": "5a996b13143214b6", "title_fa": "21 بازیگری که بیشترین برنده امی را در تمام دوران ها داشته اند", "summary_fa": "جین اسمارت برنده پنج جایزه امی برای هک شد، از جمله یکی در سال جاری. Frazer Harrison/Getty Images جوایز امی تقریباً اسکار تلویزیون هستند. «خلیج بیوه» اپل تی‌وی برنده بزرگی در امی 2026 شد که روز دوشنبه برگزار شد. ما لیستی از بازیگرانی که بیشترین جایزه امی را داشته اند، از مری تایلر مور گرفته تا برایان کرانستون، تهیه کرده ایم. امی بزرگ‌ترین جایزه‌ای است که یک بازیگر می‌تواند برای کارش در صفحه‌نمایش کوچک دریافت کند - و وقتی نمایش یا نمایشی وجود دارد که رای دهندگان امی دوست دارند، اغلب نامزدهای متعددی دریافت می‌کند و برنده می‌شود. ما آمار را بررسی کرده ایم و فهرستی از بازیگران دارای بیشترین جایزه امی در تمام دوران را گردآوری کرده ایم. این شامل برخی از بزرگترین ستارگان تلویزیونی تمام دوران است، از جمله برایان کرانستون، بتی وایت، مری تایلر مور و جولیا لوئیس دریفوس. در واقع، لوئیس دریفوس با کلریس لیچمن، ژان اسمارت و آلیسون جنی برای 8 برنده امی به عنوان مجری و با کارل راینر برای مجموع برنده های امی در میان بازیگران این فهرست، با 11 جایزه، اگر جوایز آنها را در سایر بخش ها نیز لحاظ کنید، برابر است. مجموع برنده‌های امی فهرست‌شده در اینجا منحصراً برای اجراها نیست: برخی از این فهرست برای نویسندگی، کارگردانی یا تهیه‌کنندگی برنده شده‌اند - کرانستون تهیه‌کننده «برکینگ بد» بود، و لویی-دریفوس برای مثال تهیه‌کننده اجرایی «ویپ» است - اما اکثر جوایز امی آنها برای بازیگری است. در اینجا بازیگرانی هستند که بیشترین برنده امی را دریافت کرده اند. کری ویتمر در نسخه قبلی این مقاله مشارکت داشت. 15 (تساوی). Don Knotts — 5 برنده و 5 نامزدی Don Knotts در جوایز Emmy 1962. NBC/NBCUniversal/Getty Images Knotts برای بازی در نقش بارنی فایف در «نمایش اندی گریفیث» نامزد پنج جایزه امی (در سال‌های 1961، 1962، 1963، 1966 و 1967) شد - و"}, {"source": "Business Insider", "title": "Agility's new humanoid is supposed to stop before it gets too close to humans", "link": "https://www.businessinsider.com/agility-robotics-reveals-early-look-at-digit-5-humanoid-robot-2026-9", "summary": "Agility Robotics Digit 5 humanoid Agility Robotics Business Insider got a first look at renderings of Digit 5, Agility Robotics' new humanoid robot. Digit 5 is designed to work near people, stopping and powering down if someone gets too close. Agility seeks a $2.5 billion public debut as it tries to prove humanoids can scale. Until now, Agility Robotics' humanoid robots have largely worked behind safety barriers in warehouses and factories, an awkward limitation for machines designed to work in spaces built for people. The company says Digit 5, its next-generation humanoid unveiled Tuesday, is designed to change that. The teal-blue robot can detect people nearby and slow down or stop when they get too close. If a person keeps approaching, Digit 5 can lower itself to the ground and shut off its motors before they reach it. Business Insider got an early look at renderings of Digit 5 ahead of its unveiling. Agility cofounder and chief robot officer Jonathan Hurst said the redesign reflects lessons the company learned from deploying earlier versions with customers, including Amazon, Toyota, and logistics company GXO. \"Digit 5 is the first machine that is the full, formal product that has come from customer requirements and solves a couple of the major, absolute blockers that we didn't really know about until we actually engaged,\" Hurst told Business Insider. Agility Robotics Digit 5 humanoid. Agility Robotics Digit 5 arrives as Agility tries to prove that its early lead in humanoids can become a real business. The company says it has Digit robots deployed across nine customer facilities in North America. But better-funded rivals, including Figure AI and Tesla, are racing to put their own robots to work. Agility says it has more than $300 million in multiyear orders for Digit 5, even as the business remains unprofitable. It generated $1.8 million in net sales in 2025 and reported a $140 million operating loss, according to a securities filing last week. Agility is led by Peggy Johnson, the former CEO of Magic Leap and a longtime executive at Microsoft and Qualcomm. The company plans to become the first US humanoid maker to go public through a SPAC deal valuing it at about $2.5 billion, even as the case for humanoid robots remains hotly debated. What does Digit 5 cost? Agility's securities filing also offered a glimpse into Digit's economics . In one model, Agility assumed a customer would pay about $200,000 for a Digit 5, plus about a $20,000 deployment fee and", "date_str": "2026-09-15T13:38:47+00:00", "hash": "53ae7ba9bb0060b9", "title_fa": "انسان نمای جدید Agility قرار است قبل از اینکه خیلی به انسان نزدیک شود متوقف شود", "summary_fa": "Agility Robotics Digit 5 ​​Humanoid Agility Robotics Business Insider اولین نگاهی به رندرهای Digit 5، ربات انسان نمای جدید Agility Robotics داشت. رقم 5 طوری طراحی شده است که در نزدیکی افراد کار کند، اگر کسی خیلی نزدیک شود، متوقف می شود و خاموش می شود. چابکی به دنبال یک نمایش عمومی 2.5 میلیارد دلاری است زیرا تلاش می کند ثابت کند که انسان نماها می توانند مقیاس شوند. تا به حال، روبات‌های انسان‌نمای Agility Robotics تا حد زیادی در پشت موانع ایمنی در انبارها و کارخانه‌ها کار می‌کرده‌اند، که محدودیتی ناخوشایند برای ماشین‌هایی است که برای کار در فضاهای ساخته شده برای افراد طراحی شده‌اند. این شرکت می گوید Digit 5، نسل بعدی انسان نمای خود که روز سه شنبه رونمایی شد، برای تغییر این موضوع طراحی شده است. ربات آبی مایل به آبی می تواند افراد نزدیک را تشخیص دهد و در صورت نزدیک شدن بیش از حد سرعت آنها را کاهش دهد یا متوقف کند. اگر شخصی همچنان نزدیک شود، رقم 5 می تواند خود را روی زمین پایین بیاورد و موتورهای خود را قبل از رسیدن به آن خاموش کند. Business Insider قبل از رونمایی از دیجیت 5 نگاهی اولیه به رندرهای آن داشت. جاناتان هرست، یکی از بنیانگذاران و مدیر ارشد ربات Agility، گفت که این طراحی مجدد منعکس کننده درس هایی است که شرکت از استقرار نسخه های قبلی با مشتریان از جمله آمازون، تویوتا و شرکت تدارکات GXO آموخته است. هرست به Business Insider گفت: «Digit 5 ​​اولین دستگاهی است که محصول کامل و رسمی است که بر اساس نیازهای مشتری ایجاد شده است و برخی از مسدودکننده‌های اصلی و مطلق را که ما واقعاً تا زمانی که درگیر نشده‌ایم نمی‌دانستیم، حل می‌کند. انسان نمای رباتیک چابکی رقم 5. Agility Robotics Digit 5 ​​در حالی از راه می رسد که Agility تلاش می"}, {"source": "Lifehacker", "title": "Why People Are Taping Fitbits to Their Arms", "link": "https://lifehacker.com/health/why-people-are-taping-fitbits-to-their-arms?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The beauty of a smart band is that it isn t a watch and doesn t need to act like one. That includes where you wear it: Whoop has the right idea with their bicep band and any-wear clothing. Since Google hasn t released a bicep band for the Fitbit Air, some users are taking matters into their own hands with rolls of tape. I ve watched this trend unfold on the Fitbit Air subreddit, as one person after another realizes they can just tape the device to their arm, or anywhere they want. I ve actually done something like this before years ago, I found myself trying to fit the Whoop onto my ankle, and then thought, wait a sec, can t I just tape it to the side of my leg? (I did, and it worked.) Google Fitbit Air - Screenless Activity Tracker $99.99 at Amazon Get Deal Get Deal $99.99 at Amazon Why are people taping Fitbits to their arms (and what kind of tape works best)? Taping your Fitbit Air to your arm (without the strap, of course) gets it off your wrist. It means the device is no longer in the way of wrist wraps or kettlebells, and you can wear any kind of sleeves or accessories you like without the Fitbit getting in the way or cramping your style. These are minor problems, to be sure. But sometimes, it s nice to just forget you re wearing something. People are experimenting with different types of adhesives. One of the more popular is KT tape , the stuff that athletes often use to stabilize a body part that s giving them some minor trouble. You can also use athletic or medical tape. But I don t really trust any of those. I find that KT tape can start peeling off in just a day if you do a really sweaty workout and then take a shower. Maybe it s not supposed to, but it can. Longer strips of tape have plenty of adhesive to keep them on, but a small piece the size you d need for a Fitbit is going to have a harder time doing its job. The best adhesive for the job is probably a CGM overpatch. CGMs, or continuous glucose monitors, are small plastic devices that are typically stuck on the back of the upper arm. A filament pierces the skin to take readings, but to keep it safely in place, the device itself has an adhesive. You can add some security by applying a large sticker called an overpatch. These overpatches are perfect for securing a Fitbit to your arm for long-term use. A typical CGM lasts about two weeks, and the Fitbit Air s battery lasts about a week. If you want the device to stay on through workouts and sh", "date_str": "2026-09-15T21:30:29+00:00", "hash": "c06df04306f560a2", "title_fa": "چرا مردم فیت بیت ها را به بازوهای خود می چسبانند؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. زیبایی یک بند هوشمند در این است که ساعت نیست و نیازی به عملکرد مانند آن ندارد. این شامل جایی است که شما آن را می پوشید: ووپ ایده درستی با بند دوسر بازو و لباس های هر لباسی دارد. از آنجایی که گوگل باند دوسر بازویی را برای Fitbit Air منتشر نکرده است، برخی از کاربران با نوارهای نواری کار را به دست خود می گیرند. من این روند را در زیر ردیت Fitbit Air مشاهده کردم، زیرا یکی پس از دیگری متوجه می شود که می تواند دستگاه را به بازوی خود یا هر جایی که می خواهد بچسباند. من واقعاً چنین کاری را سال‌ها پیش انجام داده‌ام، متوجه شدم که سعی می‌کنم هوپ را روی مچ پایم بگذارم، و سپس فکر کردم، یک ثانیه صبر کنید، آیا نمی‌توانم آن را به کنار پایم بچسبانم؟ (این کار را انجام دادم و جواب داد.) Google Fitbit Air - ردیاب فعالیت بدون صفحه 99.99 دلار در آمازون دریافت معامله دریافت معامله 99.99 دلار در آمازون چرا مردم Fitbits را به بازوهای خود می چسبانند (و چه نوع نواری بهتر عمل می کند)؟ با زدن Fitbit Air خود به بازوی خود (البته بدون بند) آن را از مچ شما خارج می کند. این بدان معناست که دستگاه دیگر در مسیر مچ‌پیچ‌ها یا کتل‌بل‌ها قرار نمی‌گیرد و می‌توانید هر نوع آستین یا لوازم جانبی را که دوست دارید بپوشید بدون اینکه Fitbit مانعی ایجاد کند یا استایل شما را تنگ کند. مطمئناً اینها مشکلات جزئی هستند. اما گاهی اوقات، فراموش کردن پوشیدن چیزی خوب است. مردم در حال آزمایش انواع مختلفی از چسب هستند. یکی از محبوب‌ترین آن‌ها نوار KT است، موادی که ورزشکاران اغلب برای تثبیت بخشی از بدن استفاده می‌کنند که باعث ایجاد مشکلات جزئی می‌شود. همچنین می توانید"}, {"source": "Lifehacker", "title": "Using This Under-Pillow Speaker Is Way More Comfortable Than Sleeping With Earbuds", "link": "https://lifehacker.com/tech/this-under-pillow-speaker-is-my-upgrade-of-the-week?utm_medium=RSS", "summary": "We may earn a commission from links on this page. If you're one of those people who can't fall asleep without a \" Sleep With Me \" podcast droning on, or playing one of those Spotify \"Sleep Music 528 Hz\" playlists, this week's upgrade is for you. I need my audio to fall asleep, and I usually resort to sleeping in earbuds, but if you're a side sleeper, it can feel like they dig straight into your skull the second you roll over. And just playing audio from your phone speaker is a non-starter when you share the bed with a partner. The Jabees Peace Duo sleep speaker is one of my favorite solutions to one of my toughest problems: How do you listen to something all night, comfortably, privately, without wearing anything on or in your ears? Jabees Peace Duo Sleep Speaker Pillow Under Pillow Speaker Bluetooth for Side Sleepers, Dual Bed Pillow Speakers with SD Card Preloaded Sleep Sounds, Sleep Timer, No Earbuds Needed (Sunrise Yellow) $49.99 at Amazon $59.99 Save $10.00 Shop Now Shop Now $49.99 at Amazon $59.99 Save $10.00 How this under-pillow speaker works The Peace Duo uses my favorite audio trend , bone conduction technology (pillow conduction technology?). Typically, bone conduction devices send sound vibrations directly toward your inner ear, through the bones of your skull, instead of blasting it out through the open air or directly into your ear canals. This speaker sits under your pillow rather than in or on your body, which is really the whole point of the \"private under-pillow listening\" claims. The sound stays close to your head and doesn't broadcast across the room the way a phone or bedside speaker would. Paired with a dual-speaker design, it gives you separate left and right listening units, so you get a bit of stereo positioning depending on how you're lying. Plus, it has a reliable 10-hour battery life, so you can run your sleep soundtrack all night without having to think about it. Before I give my full-fledged endorsement, however, there are a few caveats worth noting. Here's what to actually expect: There is some sound leakage. If someone's sleeping next to you, they may catch a bit of audio but it'll be significantly quieter than if you just played the same thing off your phone speaker. Sound gets muffled coming through the pillow. When using it for spoken-word audio like sleep podcasts, dialogue does lose some clarity if you need crisp, easily parsed speech, this isn't going to sound like a podcast studio. And it should go wi
