eash to make his podcast work. The Peterman Pod/YouTube Ryan Peterman left Meta and focused on his passion project: a tech pod. He had six months of savings. Four months in, he was still in the red. In a YouTube video, he explained how getting what felt like the flu forced a reboot. Sick days hit different when you're the face of a brand. Ryan Peterman , the host of \"The Peterman Pod,\" said a bout of illness almost ground his new independent career as a tech podcaster to a halt. In a six-minute YouTube video posted Friday, the former Meta engineer said he was bedridden for several days with what felt like a strong flu. The illness exposed a weakness. \"If I stopped, everything stopped,\" he said. \"Because I couldn't work, suddenly, everything felt fragile for the first time.\" Peterman worked at Meta as a software engineer from 2018 until February 2026, according to his LinkedIn. He said he set aside six months of savings after leaving the company to give the podcast a real shot. Four months in, the show had not made any money. Then he said he got sick. He said there was a bit of a silver lining to the illness: Getting sick made him reassess what was not working. He began taking sponsors more seriously and simplified his recording process so he could produce two episodes a week and build a cushion. Cursor and WorkOS later signed on as sponsors, he said. Roughly nine months after striking out on his own, Peterman said his podcast now sustains itself. His YouTube channel has over 109,000 subscribers. \"My career decision didn't make sense on paper,\" he said, but the goal was not simply to make money. \"Otherwise, I would have stayed at Meta.\" Peterman didn't respond to requests for comment from Business Insider. Read the original article on Business Insider", "date_str": "2026-09-23T09:01:01+00:00", "hash": "d2af6b42139686bc", "title_fa": "یک بیماری این پادکستر را مجبور کرد با یک ضعف بزرگ روبرو شود: \"همه چیز شکننده بود\"", "summary_fa": "رایان پیترمن به خود فرصتی شش ماهه داد تا پادکست خود را کار کند. Peterman Pod/YouTube رایان پیترمن Meta را ترک کرد و روی پروژه اشتیاق خود متمرکز شد: یک پاد فناوری. او شش ماه پس انداز داشت. چهار ماه بعد، او هنوز در قرمز بود. در یک ویدیوی یوتیوب، او توضیح داد که چگونه احساس آنفولانزا باعث راه‌اندازی مجدد آن شد. زمانی که شما چهره یک برند هستید، روزهای بیماری متفاوت است. رایان پیترمن، مجری برنامه The Peterman Pod، گفت که یک دوره بیماری تقریباً باعث توقف فعالیت مستقل جدید او به عنوان یک پادکست فناوری شد. در یک ویدیوی شش دقیقه‌ای در یوتیوب که روز جمعه منتشر شد، مهندس سابق متا گفت که برای چند روز به دلیل آنفولانزای شدید در بستر بود. این بیماری یک ضعف را آشکار کرد. او گفت: \"اگر متوقف شدم، همه چیز متوقف شد.\" چون نمی توانستم کار کنم، ناگهان برای اولین بار همه چیز شکننده شد. به گفته لینکدین وی، پیترمن از سال 2018 تا فوریه 2026 در متا به عنوان مهندس نرم افزار کار می کرد. او گفت که پس از ترک شرکت، شش ماه پس انداز را کنار گذاشت تا به پادکست یک شات واقعی بدهد. چهار ماه بعد، نمایش هیچ درآمدی نداشت. بعد گفت مریض شده. او گفت که این بیماری کمی وجود دارد: مریض شدن او را وادار کرد آنچه را که کار نمی کند دوباره ارزیابی کند. او شروع به جدی‌تر گرفتن حامیان مالی کرد و روند ضبط خود را ساده‌تر کرد تا بتواند هفته‌ای دو قسمت تولید کند و یک بالشتک بسازد. او گفت که Cursor و WorkOS بعداً به عنوان حامی مالی قرارداد امضا کردند. تقریباً نه ماه پس از اینکه پیترمن به تنهایی شروع به کار کرد، گفت که پادکست او اکنون خود را حفظ می کند. کانال یوتیوب او بیش از 109000 مشترک"}, {"source": "Business Insider", "title": "Amazon is trying to rehire workers it laid off, emails show", "link": "https://www.businessinsider.com/amazon-boomerang-hiring-recruiting-former-employees-laid-off-2026-9", "summary": "Amazon CEO Andy Jassy Isaac Brekken/AP Amazon is recruiting former workers, including eligible laid-off employees. Recruiters are using shorter interview loops to bring back alumni. One recruiter asked whether RTO drove a former employee to leave. Amazon wants former employees back, including some it laid off . The company is reaching out to eligible former employees about open roles across Amazon, including in its cloud-computing and AI businesses, according to recruiter emails obtained by Business Insider and a company spokesperson. In one outreach last month, Amazon's AI agent organization, led by AWS VP Swami Sivasubramanian , invited former employees in AI and machine learning fields to discuss new roles through what a recruiter called \"Swami's Boomerang Reengagement Initiative.\" In another case, an AWS Finance recruiter offered a former employee a shortened path back to an offer and asked whether Amazon's return-to-office policy had driven the employee away. \"A lot has changed since you were here, and there's some really compelling work happening across AI/ML right now,\" one of the emails stated. The emails show Amazon tapping its alumni network in the fight for AI talent against the likes of Google , OpenAI , Meta, and Anthropic . It is reaching out to former workers whose experience it already knows, offering some a faster route back, and, in one case, asking whether its in-office mandate drove someone away. Amazon has cut more than 30,000 jobs in multiple rounds of layoffs over the past year, among the largest workforce reductions in its history. Haley Silva, an Amazon spokesperson, told Business Insider that boomerang hiring is a normal, longstanding companywide practice, not a new program limited to AI or cloud computing. Silva said eligible former workers can include people Amazon laid off, but that the company is recruiting for open roles and is not specifically targeting employees who left because of RTO. Amazon's in-office expectations remain unchanged, she added. \"We're always interested in connecting with talented people — both new candidates and former Amazonians — for open roles,\" Silva said. \"Rehiring former employees is a normal, longstanding part of how we recruit, and our rehire and interview practices are consistent across the company.\" Boomerang growth Amazon has floated rehiring laid-off employees before. In 2023, AWS's Human Resources VP Ian Wilson told employees that many workers affected by the company's job cuts were eligible ", "date_str": "2026-09-23T09:00:02+00:00", "hash": "82d8012a7d92a96c", "title_fa": "ایمیل‌ها نشان می‌دهند که آمازون در تلاش است کارگرانی را که اخراج کرده است دوباره استخدام کند", "summary_fa": "مدیر عامل آمازون اندی جاسی آیزاک برکن/AP آمازون در حال استخدام کارگران سابق، از جمله کارمندان اخراج شده واجد شرایط است. استخدام کنندگان از حلقه های مصاحبه کوتاه تری برای بازگرداندن فارغ التحصیلان استفاده می کنند. یکی از استخدام کنندگان پرسید که آیا RTO یک کارمند سابق را مجبور به ترک کرد یا خیر. آمازون می خواهد کارمندان سابق خود را بازگرداند، از جمله تعدادی که اخراج کرده است. بر اساس ایمیل‌های استخدام‌کننده که توسط Business Insider و سخنگوی شرکت به دست آمده است، این شرکت در حال ارتباط با کارمندان سابق واجد شرایط در مورد نقش‌های باز در سراسر آمازون، از جمله در تجارت ابری و هوش مصنوعی است. ماه گذشته، سازمان عامل هوش مصنوعی آمازون، به رهبری سوامی سیواسوبرامانیان، معاون AWS، از کارمندان سابق در زمینه‌های هوش مصنوعی و یادگیری ماشینی دعوت کرد تا در مورد نقش‌های جدید از طریق چیزی که یک استخدام‌کننده آن را «ابتکار بازنگری بومرنگ سوامی» نامیده است، صحبت کنند. در مورد دیگری، یکی از استخدام‌کنندگان AWS Finance به یک کارمند سابق مسیر کوتاه‌تری برای بازگشت به یک پیشنهاد پیشنهاد داد و از او پرسید که آیا سیاست بازگشت به دفتر آمازون کارمند را فراری داده است یا خیر. در یکی از ایمیل‌ها آمده است: «از زمانی که شما اینجا بوده‌اید خیلی چیزها تغییر کرده است، و در حال حاضر کارهای واقعاً قانع‌کننده‌ای در AI/ML در حال انجام است. ایمیل‌ها نشان می‌دهند که آمازون از شبکه فارغ‌التحصیلان خود در مبارزه برای استعدادهای هوش مصنوعی در برابر شرکت‌هایی مانند Google، OpenAI، Meta و Anthropic استفاده می‌کند. این در حال تماس با کارگران سابق است که تجربه آنها را قبلاً می داند، به برخی از آنها مسیر بازگشت سریعتری را ارائه می دهد، و در یک مورد، این سوال را مطرح می کند که آیا مأموریت در دفترش کسی را فراری داده است یا خیر. آمازون"}, {"source": "Business Insider", "title": "Muse's normie-friendly design is the playbook for how Meta can win at AI", "link": "https://www.businessinsider.com/meta-muse-user-friendly-design-killer-feature-2026-9", "summary": "Meta s Muse AI agent mascot Meta Muse, Meta's AI agent , has become a hit app. Meta knows how to design normie-friendly apps — and that matters, a lot. As Zuck would say, it passes his \"mother\" test. Ultimately, Meta's edge in the AI battle is its vast edge in creating and cross-promoting consumer apps. With Meta's Muse agent shooting to the top of the App Store charts , I'm reminded of something Mark Zuckerberg said earlier this year. \"There's a lot of agents out there,\" Mark Zuckerberg told investors on an April earnings call. \"There aren't that many that I would want to give to my mother.\" The Meta CEO said the company was willing to tinker until it had an AI agent \"more polished and dialed and easy\" than the competition. Something that \"just works.\" Something that would pass his \"mother\" test . Nearly a half a year later, that strategy is paying off, with Meta's Muse agent overtaking ChatGPT as the top free AI app. This is the playbook for how Meta wins at AI — not by having the best frontier models, but by having the most successful consumer app and pushing it out to its billions of existing users. People seem to like Muse! Like, really like it! I've been playing around with it myself , and am pleasantly delighted by some of the tasks I've asked it to do (to be fair, it's also failed a bunch of tasks I asked it to do). It's debatable whether Muse is the most powerful or \"best\" agent. Instinct is a similar product that I know one of my colleagues was really enjoying, and it seems to have a growing fanbase. Others have noticed how similar Muse is to OpenClaw , which appeals to more technically proficient users and kicked off the personal AI agent craze. we built muse from scratch, but it is definitely heavily inspired as a product by openclaw. After I used openclaw in january I bought hundreds of mac minis for the MSL team and lots of us fell in love with using openclaw (and other personal agents). @steipete is a genius and his… — Nat Friedman (@natfriedman) September 21, 2026 But neither Instinct nor OpenClaw has the sheer power of Meta's massive user base, where it can cross-promote its apps. Nor do they have Meta's knack for creating a normie-friendly, easy-to-use consumer app. That last part is the key. Say what you want about Meta, but you have to concede they are very good at making apps so easy to use and popular that your mother (or even grandmother) can — and loves — to use. They make apps that are so easy and compelling to use that their bigge", "date_str": "2026-09-23T09:00:01+00:00", "hash": "54a6dd84d2c3f1e4", "title_fa": "طراحی هنجارپسند Muse کتاب بازی برای اینکه متا چگونه می تواند در هوش مصنوعی برنده شود است", "summary_fa": "طلسم عامل هوش مصنوعی Meta s Muse Meta Muse، عامل هوش مصنوعی متا، به یک اپلیکیشن محبوب تبدیل شده است. متا می داند که چگونه برنامه های نرم افزاری را طراحی کند - و این بسیار مهم است. همانطور که زاک می گوید، آزمون \"مادر\" خود را با موفقیت پشت سر می گذارد. در نهایت، مزیت متا در نبرد هوش مصنوعی، مزیت گسترده آن در ایجاد و تبلیغ متقابل برنامه های مصرف کننده است. زمانی که عامل Meta's Muse به صدر جدول اپ استور رسید، چیزی را که مارک زاکربرگ در اوایل سال جاری گفته بود، به یاد می‌آورم. مارک زاکربرگ در یک تماس مالی در ماه آوریل به سرمایه گذاران گفت: «نمایندگان زیادی آنجا هستند. تعداد زیادی نیست که بخواهم به مادرم بدهم. مدیر عامل متا گفت که این شرکت مایل است تا زمانی که یک عامل هوش مصنوعی «برقی‌شده‌تر، شماره‌گیری‌شده‌تر و آسان‌تر» نسبت به رقبا پیدا کند، دست به کار شود. چیزی که \"فقط کار می کند.\" چیزی که از آزمون \"مادر\" او عبور کند. تقریباً نیم سال بعد، این استراتژی در حال نتیجه دادن است و عامل Meta's Muse توانست ChatGPT را به عنوان برترین برنامه رایگان هوش مصنوعی پیشی بگیرد. این کتاب راهنمای چگونگی پیروزی متا در هوش مصنوعی است – نه با داشتن بهترین مدل‌های مرزی، بلکه با داشتن موفق‌ترین اپلیکیشن مصرف‌کننده و ارائه آن به میلیاردها کاربر فعلی‌اش. به نظر می رسد مردم میوز را دوست دارند! دوست دارم، واقعاً دوست دارم! من خودم با آن بازی می‌کردم و از برخی از کارهایی که از او خواسته‌ام خوشحالم (انصافاً، تعدادی از کارهایی که از او خواسته‌ام نیز شکست خورده است). این که میوز قدرتمندترین یا \"بهترین\" عامل است، قابل بحث است. Instinct محصول مشابهی است که می‌دانم یکی از همکارانم واقعاً از آن لذت می‌برد و به نظر می‌رسد که طرفداران زیادی دارد. دیگران"}, {"source": "Business Insider", "title": "Meet the top Anthropic scientist who predicted the core of today’s AI doom debate", "link": "https://www.businessinsider.com/jared-kaplan-ai-safety-concerns-last-year-gain-traction-anthropic-2026-9", "summary": "Jared Kaplan, Anthropic s chief science officer. Bloomberg/Getty Images Anthropic cofounder Jared Kaplan foresaw the debate about AI's danger hinging on self-improving AI. Kaplan leads research and responsible scaling at Anthropic, playing a pivotal role in the AI race. His former collaborators describe him as sharp and sensible, and they say his concerns are real. At the center of the debate over AI-driven catastrophe , there's Anthropic. At the center of Anthropic, there's Jared Kaplan. The Anthropic cofounder sounded the alarm on AI late last year: No one knows what will happen if frontier developers get AI to the point where it fully trains itself. He told the Guardian that letting AI train itself could lead to an \"intelligence explosion,\" but it's also the \"ultimate risk\" and \"maybe the biggest decision or scariest thing to do.\" The decision point for that process, he said, could arrive between 2027 and 2030. We're just about on schedule. As 2026 winds down, state-of-the-art AI systems are already helping researchers build models at both Anthropic and OpenAI. A physicist-turned-AI-researcher, Kaplan left OpenAI to cofound Anthropic with CEO Dario Amodei and others in 2021. He gives the worries about AI getting dangerously out of control some authoritative credence — his chief science officer role at Anthropic is one of tech's most influential jobs. He oversees technical research, AI safety, and Anthropic's \"responsible scaling policy.\" It's his job to mitigate the risks of powerful AI . More people are listening to Kaplan's warning. Jacob Coxon , a researcher who resigned from Anthropic earlier this month, referred directly to letting AI train itself in his now-viral X post, writing that OpenAI and Anthropic are \"gambling with our lives.\" Around two-thirds of Americans now think there's a risk AI could destroy humanity , a Politico poll found last week. The chatter has reached DC, too, with lawmakers proposing new legislation and paying new attention to long-running AI safety concerns . Jeffrey Ladish, a former Anthropic engineer and founder of the AI safety nonprofit Palisade Research, told Business Insider that when meeting with lawmakers, he referred back to Kaplan's remarks — specifically the idea that having AI train itself could let it get out of control. \"It's good for more people to hear from more engineers, researchers, people in the company who, it's not their job to do company PR,\" said Ladish. \"It's their job to figure things out.\" Now a b", "date_str": "2026-09-23T09:00:01+00:00", "hash": "645d3e88aca89458", "title_fa": "با دانشمند برتر آنتروپیک آشنا شوید که هسته اصلی بحث عذاب هوش مصنوعی امروز را پیش بینی کرد.", "summary_fa": "جرد کاپلان، مدیر ارشد علمی Anthropic. جرد کاپلان، بنیانگذار بلومبرگ/گتی ایماژز، یکی از بنیانگذاران آنتروپیک، بحث در مورد خطر هوش مصنوعی وابسته به هوش مصنوعی خود-بهبود را پیش بینی کرد. کاپلان رهبری تحقیقات و مقیاس‌پذیری مسئولانه را در آنتروپیک بر عهده دارد و نقشی اساسی در مسابقه هوش مصنوعی ایفا می‌کند. همکاران سابقش او را فردی تیزبین و معقول توصیف می کنند و می گویند نگرانی های او واقعی است. در مرکز بحث در مورد فاجعه مبتنی بر هوش مصنوعی، Anthropic وجود دارد. در مرکز آنتروپیک، جارد کاپلان قرار دارد. بنیانگذار Anthropic در اواخر سال گذشته زنگ خطر را در مورد هوش مصنوعی به صدا درآورد: هیچ کس نمی داند چه اتفاقی می افتد اگر توسعه دهندگان مرزی هوش مصنوعی را به نقطه ای برسانند که به طور کامل خود را آموزش دهد. او به گاردین گفت که اجازه دادن به آموزش هوش مصنوعی می‌تواند منجر به \"انفجار اطلاعاتی\" شود، اما این \"خطر نهایی\" و \"شاید بزرگترین تصمیم یا ترسناک‌ترین کاری است که باید انجام شود.\" او گفت که نقطه تصمیم گیری برای این فرآیند ممکن است بین سال های 2027 تا 2030 برسد. ما تقریباً طبق برنامه هستیم. با پایان یافتن سال 2026، سیستم های پیشرفته هوش مصنوعی در حال حاضر به محققان کمک می کنند تا مدل هایی را در Anthropic و OpenAI بسازند. کاپلان، فیزیکدانی که به پژوهشگر هوش مصنوعی تبدیل شده، OpenAI را ترک کرد تا در سال 2021 با مدیر عامل شرکت داریو آمودی و دیگران آنتروپیک را تأسیس کند. او نگرانی هایی را درباره خارج شدن خطرناک هوش مصنوعی از کنترل برخی اعتبار معتبر می دهد - نقش افسر ارشد علمی او در Anthropic یکی از تأثیرگذارترین مشاغل فناوری است. او بر تحقیقات فنی، ایمنی هوش مصنوعی و «سیاست مقیاس‌پذیری مسئولانه» آنتروپیک نظارت دارد. این وظیفه اوست که خطرات هوش مصنوعی قدرتمند را کاهش"}, {"source": "Business Insider", "title": "The ugly tax battle brewing between baby boomers and millennials", "link": "https://www.businessinsider.com/generational-tax-battle-boomers-millennials-2026-9", "summary": "Getty Images; Tyler Le/BI Taylor Scriber, a millennial living in Texas , is trying to join the growing ranks of his generation and buy his first home. He's been scouring listings with his real estate agent, taking a few tours to see what suits him best, and estimating his potential costs, including property taxes . The final piece of that homeowning puzzle has been stuck in Scriber's craw lately. After reading recent headlines about property taxes in the Lone Star state being slashed for older residents and those with disabilities, he started to feel that he may end up shouldering the fiscal burden through his own payments with resulting rate hikes — and costing out worst case scenarios for what the cost of his future home might realistically look like, since so many homes have those abatements. After all, since Texas has no income tax , sales and property taxes are key in funding municipal services, like schools. So as revenue from older homeowners dries up and cities continue to face budget shortfalls , he expects his local government to make up for the cuts in other ways — including taxes on his home-to-be. \"You're stuck there, and you're looking at an inevitable property tax increase, because a group of people are voting to opt themselves out,\" he says. Almost 40% of homesteads in Texas pay no property taxes for school districts. That includes about 61% of older and disabled homeowners, up from 44% in 2024. Scriber's family and friends over the age of 65 all seem sympathetic when he brings up the issue — at first. They agree that increasingly foisting more of the cost of a functional society onto younger generations could be a problem, but then they start thinking further. \"They just kind of thought about it for a moment, and they were like, 'But I want my property taxes to be lowered,'\" he says. A generational tax battle has begun to envelop the US. The current beef stretches far beyond timeless \"kids these days\" and \" OK boomer \" finger-pointing. It's turning one of America's rare forms of collective support — taxes and the social safety nets they help fund — into yet another individualistic debate, and it could have economic consequences for decades to come. For both the young and no-longer-young, the animus for the tax war comes from the same place: A sense of economic precarity. Older Americans spent decades imagining a comfortable, or at least stable, retirement with Social Security undergirding their personal savings. Instead, boomers' golden ye", "date_str": "2026-09-23T08:47:01+00:00", "hash": "d6b36351a6e6d001", "title_fa": "نبرد زشت مالیاتی بین نسل جوان و نسل هزاره در حال وقوع است", "summary_fa": "گتی ایماژ; Tyler Le/BI Taylor Scriber، یک هزاره که در تگزاس زندگی می کند، در تلاش است تا به صفوف رو به رشد نسل خود بپیوندد و اولین خانه خود را بخرد. او با مشاور املاک خود فهرست‌ها را جست‌وجو می‌کرده، چند گشت انجام می‌دهد تا ببیند چه چیزی برای او مناسب‌تر است، و هزینه‌های بالقوه‌اش از جمله مالیات بر دارایی را برآورد کرده است. آخرین قطعه از آن پازل خانه داری اخیراً در ذهن اسکایبر گیر کرده است. پس از خواندن سرفصل‌های اخیر در مورد کاهش مالیات بر دارایی در ایالت Lone Star برای ساکنان مسن‌تر و افراد دارای معلولیت، او شروع به این احساس کرد که ممکن است بار مالی را از طریق پرداخت‌های خود با افزایش نرخ‌ها به دوش بکشد - و بدترین سناریوها را برای هزینه‌های واقعی خانه آینده‌اش هزینه کند، زیرا بسیاری از خانه‌ها چنین هستند. از این گذشته، از آنجایی که تگزاس مالیات بر درآمد ندارد، مالیات بر فروش و دارایی در تأمین مالی خدمات شهری، مانند مدارس، کلیدی است. بنابراین از آنجایی که درآمد صاحبان خانه‌های مسن‌تر کاهش می‌یابد و شهرها همچنان با کمبود بودجه مواجه هستند، او انتظار دارد که دولت محلی‌اش این کاهش‌ها را به روش‌های دیگری جبران کند - از جمله مالیات بر خانه‌های آینده‌اش. او می‌گوید: «شما در آنجا گیر کرده‌اید، و به افزایش اجتناب‌ناپذیر مالیات بر دارایی نگاه می‌کنید، زیرا گروهی از مردم برای انصراف خود رأی می‌دهند. تقریباً 40 درصد از خانه‌ها در تگزاس هیچ مالیاتی برای مناطق مدرسه نمی‌پردازند. این شامل حدود 61 درصد از صاحبان خانه‌های مسن‌تر و معلول می‌شود، در مقایسه با 44 درصد در سال 2024. خانواده و دوستان بالای 65 سال اسکایبر وقتی این موضوع را مطرح می‌کند - در ابتدا همدل به نظر می‌رسند. آنها موافق هستند که تحمیل هر چه بیشتر هزینه های یک جامعه کارآمد به نسل های جوان"}, {"source": "Business Insider", "title": "NYC's DoorDash settlement is just one part of Mamdani's big swing against delivery apps", "link": "https://www.businessinsider.com/mamdani-delivery-apps-worker-pay-safety-doordash-payout-2026-9", "summary": "New York City Mayor Zohran Mamdani. ANGELA WEISS / AFP via Getty Images The last two NYC mayors have gone after major delivery companies. Mamdani's win against DoorDash this week is part of a bigger campaign over gig worker pay and safety. Business leaders fear Mamdani's policies could reduce job investments and impact local employment. Mayor Zohran Mamdani's win against DoorDash is just one battle in his bigger war on delivery companies. The $131.5 million settlement accomplished what former mayor Eric Adams' administration had begun. Now, regulating companies like Amazon, DoorDash, and Uber Eats has become a pillar of Mamdani's approach to the business world: His administration confronts blue-chip employers with lawsuits and tighter policies, and supports union efforts to boost worker safety and financial security. Business Insider spoke with City Hall leaders, union representatives, and companies at the center of Mamdani's delivery work crackdown . Worker advocates are pushing for even tighter protections, while employers worry about what it means for their businesses and operations in the city. DoorDash said in its Tuesday statement , \"We screwed up,\" but other companies say increased regulation could make it harder for delivery businesses to operate in NYC. DoorDash isn't the first delivery app to get dinged in NYC Regulating the delivery economy is thorny, especially when thousands of New Yorkers' incomes are on the line. Business leaders, big and small, say that with more hoops to jump through, they will be less likely to invest in jobs in NYC. The administration has received this criticism before, with business leaders concerned that Mamdani's policies — ranging from city-run grocery stores to taxes — could undermine job stability for small vendors and local workers. The Mamdani administration's main focus has been on eliminating delivery app junk fees and enforcing scheduling laws and gig worker protections enacted before the mayor took office. The city's Department of Consumer and Worker Protection led the effort to secure the DoorDash settlement after a court found that 264,000 Dashers were underpaid or paid late. The DCWP previously settled multimillion-dollar lawsuits with Uber Eats and Hungry Panda over what courts found to be labor violations, like unnecessary charges and unfair wages. Commissioner Sam Levine called the Tuesday settlement \"a real game changer for our enforcement and our policy development.\" Few cities have the kind of gig wo", "date_str": "2026-09-23T08:30:01+00:00", "hash": "d0bc48625056129a", "title_fa": "حل و فصل DoorDash در نیویورک تنها بخشی از نوسان بزرگ ممدانی در برابر برنامه های تحویل است.", "summary_fa": "زهران ممدانی شهردار نیویورک. آنجلا وایس / خبرگزاری فرانسه از طریق گتی ایماژ دو شهردار آخر نیویورک به دنبال شرکت های بزرگ تحویل هستند. پیروزی ممدانی مقابل DoorDash در این هفته بخشی از یک کمپین بزرگتر بر سر حقوق و ایمنی کارگران است. رهبران کسب و کار می ترسند که سیاست های ممدانی بتواند سرمایه گذاری های شغلی را کاهش دهد و بر اشتغال محلی تأثیر بگذارد. پیروزی شهردار زهران ممدانی در برابر DoorDash تنها یک نبرد در جنگ بزرگتر او در برابر شرکت های تحویل است. تسویه حساب 131.5 میلیون دلاری آنچه را که مدیریت شهردار سابق اریک آدامز آغاز کرده بود، انجام داد. اکنون، تنظیم مقررات شرکت‌هایی مانند آمازون، DoorDash، و Uber Eats به ستونی از رویکرد ممدانی در دنیای تجارت تبدیل شده است: دولت او کارفرمایان بلوچی را با شکایت‌ها و سیاست‌های سخت‌گیرانه‌تر مواجه می‌کند و از تلاش‌های اتحادیه برای افزایش ایمنی کارگران و امنیت مالی حمایت می‌کند. Business Insider با رهبران شهرداری، نمایندگان اتحادیه‌ها و شرکت‌هایی که در مرکز سرکوب کار تحویل ممدانی حضور داشتند صحبت کرد. حامیان کارگران برای حمایت های شدیدتر تلاش می کنند، در حالی که کارفرمایان نگران معنای آن برای مشاغل و عملیات خود در شهر هستند. DoorDash در بیانیه روز سه‌شنبه خود گفت: «ما خراب کردیم»، اما سایر شرکت‌ها می‌گویند افزایش مقررات می‌تواند کار شرکت‌های تحویل در نیویورک را سخت‌تر کند. DoorDash اولین برنامه تحویلی نیست که در نیویورک به کار گرفته می‌شود. تنظیم اقتصاد تحویل بسیار دشوار است، به‌ویژه زمانی که درآمد هزاران نیویورکی در خط است. رهبران کسب و کار، بزرگ و کوچک، می گویند که با حلقه های بیشتر برای پرش، احتمال کمتری برای سرمایه گذاری در مشاغل در نیویورک خواهند داشت. دولت قبلاً این انتقاد را دریافت کرده بود، زیرا رهبران تجاری نگران بودند که سیاست‌های ممدانی - از خواربار فروشی‌های شهری گرفته تا مالیات - می‌تواند"}, {"source": "Business Insider", "title": "AI minted fortunes across Asia. Now we're seeing where the money goes.", "link": "https://www.businessinsider.com/kospi-korea-stock-market-wealth-luxury-spending-hynix-samsung-japan-2026-9", "summary": "South Korea s AI-fueled stock rally has helped drive rising household wealth and strong spending at high-end department stores such as Shinsegae. Anthony Wallace/AFP/Getty Images AI-linked stock gains are spilling into luxury spending across parts of Asia. South Korea's market slump has cooled the boom, but spending is holding up. Now, massive chipmaker bonuses could send billions more flowing into the economy. Luxury spending is holding up in parts of Asia even as the AI-fueled stock-market rallies that helped create new wealth have stumbled. In South Korea and Japan, affluent consumers are still spending on jewelry, watches, and other luxury goods after huge gains in AI-linked stocks swelled household wealth. The trend is most apparent in South Korea, where Samsung Electronics, SK Hynix, and other technology companies powered a historic stock-market rally earlier this year. Markets have since turned volatile, but consumer spending has proved more resilient. \"Buoyant revenues for technology firms have helped to drive large bonuses and dividend payouts, as well as wealth effects from rising stock prices, the combined impact of which has boosted consumption spending in the first half of 2026,\" Rajiv Biswas, CEO of Asia-Pacific Economics, told Business Insider. Korean spending slowed in July before rebounding in September, a dip the bank attributed partly to market swings, Kathleen Oh, the chief Korea and Taiwan economist at Morgan Stanley, wrote in a September 17 report. She added that consumer confidence in the spending recovery remained intact. The bank raised its forecast for private consumption growth this year to 2.6% from 2.2%, citing stronger household incomes, fiscal support, rising wealth, and inbound tourism. Department stores and luxury companies are going strong The resilience is showing up at department stores. At Shinsegae, one of South Korea's biggest high-end department-store operators, same-store sales rose 15% from a year earlier in August, according to Bank of America, with luxury sales up 20%. Revenue from international customers jumped 82%. The strength fits a pattern BofA has found in past market cycles. Korean department-store sales tend to follow increases in household equity investment, with the relationship strongest at a lag of about a year. Luxury companies are seeing strong demand, too. LVMH reported strong first-half growth in Asia outside Japan. CEO Bernard Arnault highlighted the \"remarkable performance\" of Louis Vuitton's ne", "date_str": "2026-09-23T07:14:09+00:00", "hash": "e7b3d7fee225c0c1", "title_fa": "هوش مصنوعی ثروت در سراسر آسیا به دست آورد. حالا داریم می بینیم که پول کجا می رود.", "summary_fa": "افزایش سهام کره جنوبی با سوخت هوش مصنوعی به افزایش ثروت خانوارها و هزینه های قوی در فروشگاه های بزرگ مانند Shinsegae کمک کرده است. آنتونی والاس/ خبرگزاری فرانسه/ گتی ایماژ سود سهام مرتبط با هوش مصنوعی در بخش هایی از آسیا به مخارج لوکس سرازیر می شود. رکود بازار کره جنوبی رونق را کاهش داده است، اما هزینه ها همچنان ادامه دارد. اکنون، جوایز عظیم سازندگان تراشه می‌تواند میلیاردها دلار دیگر را وارد اقتصاد کند. هزینه‌های تجملاتی در بخش‌هایی از آسیا همچنان پابرجاست، حتی در شرایطی که افزایش‌های بازار سهام متاثر از هوش مصنوعی که به ایجاد ثروت جدید کمک می‌کرد، سقوط کرده است. در کره جنوبی و ژاپن، پس از افزایش ثروت در سهام مرتبط با هوش مصنوعی و افزایش ثروت خانوار، مصرف کنندگان ثروتمند همچنان برای جواهرات، ساعت و سایر کالاهای لوکس هزینه می کنند. این روند در کره جنوبی بیشتر مشهود است، جایی که سامسونگ الکترونیک، SK Hynix و سایر شرکت‌های فناوری در اوایل سال جاری یک رشد تاریخی در بازار سهام را تقویت کردند. از آن زمان بازارها بی ثبات شده اند، اما هزینه های مصرف کننده انعطاف پذیرتر شده است. راجیو ب stems Forces, said as drone crews reached this tally after they attacked and \"burned\" 21 tankers over the last three days. The strikes have been part of a Ukrainian campaign from early July targeting the hundreds-strong fleet of merchant tankers assessed to be carrying sanctioned Russian gas and oil. While many of these vessels access Russia from the Baltic, the Ukrainian effort has focused on the Black Sea and the Sea of Azov. The campaign has been dubbed Operation MoLoChKa, or an acronym that translates into \" Moscow will fall through Crimea .\" Brovdi said on his Telegram channel that the uncrewed Systems Forces had disabled 166 ships in the Black Sea and another 134 in the Sea of Azov. \"The Sea of Azov, along with the Kerch Strait, is closed and will remain so. In the northern and northeastern Black Sea, it is 'maybe we'll slip through' mode,\" his statement said. He's been one of the top commanders to champion a strategy of using mid- and long-range drones to enact a siege of sorts on Crimea , the peninsula annexed by Russia in 2014. The region is a key logistical hub for Russia's forces on the southern front, and Ukrainian commanders like Brovdi have likened it to a lynchpin of the war as a whole. The past few months have seen them hammering roads, bridges, energy facilities, and transport vessels in a bid to choke the peninsula with resource shortages. Notably, Operation MoLoChKa has relied on aerial drones, as counter-jamming, artificial intelligence, and flight technology have progressed to the point where Ukraine can use them to more consistently hit Russia's rear . Previously, Kyiv had relied on surface and underwater drones to battle Russia's navy, driving back its Black Sea Fleet from Ukraine's coast. Brovdi's statement on Telegram included over two dozen clips that appear to have been shot from drones speeding overhead toward", "date_str": "2026-09-23T05:37:10+00:00", "hash": "6e1e22c0b7e3c56f", "title_fa": "فرمانده اوکراینی می گوید پهپادهای پرنده g meet in Washington this week. Alex Wong/Getty Images President Donald Trump and Chinese leader Xi Jinping are expected to discuss AI at this week in Washington. A China technology policy analyst says AI isn't like nuclear weapons. AI's rapid evolution makes US-China limits on development unlikely. President Donald Trump and Chinese leader Xi Jinping are expected to discuss artificial intelligence when they meet in Washington this week, as Washington and Beijing explore ways to manage the technology's national security risks despite their broader rivalry. But one China technology policy analyst says the comparison many draw with nuclear arms control has its limits. \"AI isn't like nuclear weapons, and where we are with AI is also not like nuclear weapons,\" said Antonia Hmaidi, the head of the science, technology, and innovation program at the Mercator Institute for China Studies, at a media briefing on Friday. \"With nuclear weapons, it is relatively simple to verify, at least broad claims that the other side makes. It's very, very difficult to hide huge numbers of nuclear weapons somewhere. With AI, this is not the case,\" she said. AI is expected to be one of the biggest agenda items when Trump and Xi meet at the White House on Thursday, alongside trade and export controls. On Sunday, Treasury Secretary Scott Bessent said the US had proposed a new US-China AI dialogue and a notification mechanism for AI-related incidents that rise to the level of national security. Trump and Xi's meeting also comes as the debate over AI safety has intensified. Anthropic CEO Dario Amodei recently called for AI companies to slow the pace of frontier AI development. Trump has pushed back against slowing AI development, arguing the US should maintain its lead over China even as some researchers warn that increasingly powerful AI systems could pose catastrophic risks. But verification is one of the biggest obstacles to meaningful AI agreements, Hmaidi said. \"How do you verify a claim that, if Xi were to say, 'Our labs are stopping to develop AI for biotechnology, for bioweapons'? How would you even verify that? And the other way around, of course,\" she said. Hmaidi said those challenges extend beyond formal agreements. and questioned proposals for an AI equivalent of the Cold War \"red line\" between Washington and Moscow, asking how governments would even know when ", "date_str": "2026-09-23T05:22:23+00:00", "hash": "d38ef1c43232bd25", "title_fa": "یک تحلیلگر سیاست فناوری چین می گوید ترامپ و شی ممکن است در مورد هوش مصنوعی صحبت کنند، اما این موضوع مانند کنترل تسلیحات هسته ای نیست.", "summary_fa": "انتظار می‌رود در دیدار دونالد ترامپ، رئیس‌جمهور چین و شی جین‌پینگ، رهبر چین در واشنگتن این هفته، هوش مصنوعی برجسته شود. الکس وانگ/ گتی ایماژز، دونالد ترامپ، رئیس جمهور آمریکا و شی جین پینگ، رهبر چین، قرار است در این هفته در واشنگتن درباره هوش مصنوعی گفتگو کنند. یک تحلیلگر سیاست فناوری چین می گوید هوش مصنوعی مانند سلاح های هسته ای نیست. تکامل سریع هوش مصنوعی محدودیت های ایالات متحده و چین در توسعه را بعید می کند. انتظار می رود رئیس جمهور دونالد ترامپ و شی جین پینگ، رهبر چین، در دیدار این هفته در واشنگتن در مورد هوش مصنوعی بحث کنند، زیرا واشنگتن و پکن به بررسی راه هایی برای مدیریت خطرات امنیت ملی این فناوری علیرغم رقابت گسترده ترشان می پردازند. اما یک تحلیلگر سیاست فناوری چین می گوید مقایسه بسیاری با کنترل تسلیحات هسته ای محدودیت هایی دارد. آنتونیا حمیدی، رئیس برنامه علم، فناوری و نوآوری در مؤسسه مطالعات چین مرکاتور، روز جمعه در یک نشست خبری گفت: «هوش مصنوعی مانند سلاح‌های هسته‌ای نیست و جایی که ما با هوش مصنوعی هستیم نیز مانند سلاح‌های هسته‌ای نیست. او گفت: \"در مورد سلاح های هسته ای، بررسی نسبتاً ساده است، حداقل ادعاهای گسترده ای که طرف مقابل مطرح می کند. پنهان کردن تعداد زیادی از سلاح های هسته ای در جایی بسیار بسیار دشوار است. در مورد هوش مصنوعی، این چنین نیست.\" انتظار می‌رود که هوش مصنوعی یکی از بزرگ‌ترین دستور کارها در دیدار ترامپ و شی در روز پنجشنبه در کاخ سفید، در کنار کنترل‌های تجاری و صادراتی باشد. اسکات بسنت وزیر خزانه داری روز یکشنبه گفت ک eat-free diet . She also said she feels more in tune with her body than she did when she was younger. \"I trust when it tells me it needs something to eat, that it's thirsty. I listen to my body today, and I have a lot less fear,\" Moore said. \"When I was younger, I felt like my body was betraying me. And so I just tried to control it. And now I don't operate from that place.\" Early this year, Moore also said she started paying more attention to her nighttime routine . \"I've become very intentional about my evening routine. Taking the time to truly transition from the chaos of the day into a state of rest has been life-changing, and part of that is doing my skincare,\" she said. Studies suggest that strong social ties can lead to better health and longer life, with one longevity researcher calling them as important as diet and exercise. In contrast, chronic loneliness has been linked to poorer sleep, a weakened immune response, and a higher risk of heart disease, ", "date_str": "2026-09-23T05:14:41+00:00", "hash": "e2d27013acbcbcf8", "title_fa": "دمی مور، 63 ساله، می گوید که دوستی کلید پیر شدن است. او یک مراسم روزانه را با گروهی از زنان به اشتراک می گذارد.", "summary_fa": "دمی مور گفت که سعی می کند هر روز قدردانی را تمرین کند. Aurore Marechal/Getty Images دمی مور می گوید طول عمر فراتر از مبارزه با علائم پیری است. در عوض، خوب پیر شدن به معنای ایجاد فضا برای افراد و لحظاتی است که او را پر می کند. او یک تمرین روزانه را با دوستانش به اشتراک می گذارد که به آنها کمک می کند در ارتباط باقی بمانند. دمی مور، 63 ساله، گفت که رویکرد او به طول عمر شامل یک تمرین ساده روزانه با دوستانش است. مور در مصاحبه‌ای با روزنامه Harper's Bazaar Arabia که روز سه‌شنبه منتشر شد، گفت که به انجام هر روز قدردانی اعتقاد دارد و آن را به یک مراسم مشترک در \"جامعه زنان\" خود تبدیل کرده است. مور گفت: \"من گروهی دارم که در آن هر روز یک لیست سپاسگزاری به اشتراک می گذاریم. جایی که ما سه چیز را که برای آنها سپاسگزار هستیم، سه چالش یا ترس و یک ویژگی یا تایید قرار می دهیم.\" \"دیده شدن، به اشتراک گذاشتن خود برای شناخته شدن، و اجازه دادن به دیگران برای انجام همین کار.\" مور، طول عمر را به‌عنوان یک زندگی کامل‌تر می‌بیند تا نبرد با پیری. او گفت: \"ایده طول عمر سرمایه گذاری است. این سرمایه گذاری روی خودتان است. این سرمایه گذاری روی خانواده شما، سرمایه گذاری در جامعه شما است.\" مور اضافه کرد، حتی ارتباطات کوچک نیز می تواند احساس رضایت را در او ایجاد کند. او گفت: \"اگر به رختخواب بروم و روزی داشته باشم که در آن فرصتی برای ابراز مهربانی، سخاوت داشته باشم، گاهی اوقات این سخاوت فقط یک لبخند است، فقط وقت گذاشتن برای دیدن یکدیگر، یک ویژگی وجود دارد که من را پر می کند.\" مور همچنین در مورد روال سلامتی خود در گذشته صحبت کرده است. در مصاحبه ای در آوریل 2025،"}, {"source": "Business Insider", "title": "AI anxiety is sweeping the globe — and cutting across party lines: poll", "link": "https://www.businessinsider.com/ai-anxiety-sweeping-the-globe-cutting-across-party-lines-poll-2026-9", "summary": "An anti-AI placard. Dan Kitwood/Getty Images The freakout over AI that started in Silicon Valley has swept Western countries. A new POLITICO Poll finds that pluralities of adults in the US, Canada, and Europe want to pause AI development. A majority of those surveyed also believe there's a real risk the technology could destroy humanity. The freakout over AI that started in Silicon Valley and led to growing American calls to pause development has swept Western countries. A new POLITICO Poll finds that pluralities of adults in the US, Canada, and Europe want to pause AI development regardless of their political leanings — and most believe there's a real risk the technology could destroy humanity. Pluralities of respondents in several countries say it's okay for their country to fall behind others in the development of AI if it means being more responsible and secure when advancing it. And they're more likely to expect AI will destroy jobs rather than create them. The results from the poll, conducted by independent polling firm Public First, illustrate the sheer magnitude of how AI fears are spreading as some industry leaders warn the technology's advancement could have potentially grave consequences. They show people's preference for caution, even at the risk of forfeiting what could be revolutionary advancements or their country falling behind in the broader AI race. And for governments, the results offer a stark warning of the political backlash they may face if they don't take steps to rein in the technology, as leaders from US President Donald Trump to UK Prime Minister Andy Burnham scramble their responses. Across six countries — the US, Canada, the United Kingdom, France, Spain, and Germany — roughly half of adults surveyed said AI is good enough now, so they supported a pause on further development to reduce risks, rather than continuing development for added benefits. That sentiment was highest in the UK at 51% and lowest in Germany at 45%. Meanwhile, just 30% to 40% of adults in each country favored continued development to bring about \"significant benefits.\" An even greater share of adults — more than half in every country surveyed and up to almost two-thirds in the US, France, the UK, and Canada — said there was at least a \"moderate\" risk that the technology could \"destroy humanity.\" The skepticism around AI could impact Europe's ability to keep up in the global competition: The European Union, which has taken a cautionary approach by adopting th", "date_str": "2026-09-23T02:01:01+00:00", "hash": "dcd99517b4e754e9", "title_fa": "نظرسنجی: اضطراب هوش مصنوعی جهان را فرا گرفته است - و خطوط حزبی را فرا می گیرد", "summary_fa": "پلاکارد ضد هوش مصنوعی دن کیتوود/ گتی ایماژ هولناکی بر سر هوش مصنوعی که در سیلیکون ولی آغاز شد، کشورهای غربی را فراگرفته است. نظرسنجی جدید POLITICO نشان می دهد که تعداد زیادی از بزرگسالان در ایالات متحده، کانادا و اروپا می خواهند توسعه هوش مصنوعی را متوقف کنند. اکثریت کسانی که مورد بررسی قرار گرفتند نیز معتقدند خطر واقعی وجود دارد که فناوری بتواند بشریت را نابود کند. جنجال بر سر هوش مصنوعی که از سیلیکون ولی آغاز شد و منجر به افزایش فراخوان آمریکایی ها برای توقف توسعه شد، کشورهای غربی را فراگرفته است. نظرسنجی جدید POLITICO نشان می‌دهد که تعداد زیادی از بزرگسالان در ایالات متحده، کانادا و اروپا می‌خواهند توسعه هوش مصنوعی را بدون توجه به گرایش‌های سیاسی‌شان متوقف کنند – و اکثر آنها معتقدند خطر واقعی وجود دارد که فناوری می‌تواند بشریت را نابود کند. تعداد زیادی از پاسخ دهندگان در چندین کشور می گویند اشکالی ندارد که کشورشان در توسعه هوش مصنوعی از دیگران عقب بماند، اگر به معنای مسئولیت پذیری و امنیت بیشتر در هنگام پیشرفت باشد. و آنها به احتمال زیاد انتظار دارند که هوش مصنوعی مشاغل را به جای ایجاد آنها از بین ببرد. نتایج این نظرسنجی که توسط شرکت نظرسنجی مستقل Public First انجام شده است، نشان می‌دهد که چگونه ترس از هوش مصنوعی در حال گسترش است، زیرا برخی از رهبران صنعت هشدار می‌دهند که پیشرفت این فناوری می‌تواند عواقب بالقوه بدی داشته باشد. آن‌ها ترجیح مردم را برای احتیاط نشان می‌دهند، حتی در معرض خطر از دست دادن آنچه می‌تواند پیشرفت‌های انقلابی باشد یا کشورشان در رقابت گسترده‌تر هوش مصنوعی عقب بماند. و برای دولت‌ها، نتایج یک هشدار جدی درباره واکنش‌های سیاسی است که ممکن است در صورت عدم برداشتن گام‌هایی برای مهار این فناوری، به همراه رهبران از دونالد ترامپ، رئیس‌جمهور آمریکا تا اندی برنهام، نخست‌وزیر بریتانیا،"}, {"source": "Business Insider", "title": "The best Samsung Galaxy Z Fold 8 cases for the new passport-shaped smartphone", "link": "https://www.businessinsider.com/guides/tech/best-samsung-galaxy-z-fold-8-cases", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Samsung; Amazon; OtterBox; Dbrand/Business Insider Even as manufacturers improve smartphone durability, going without a case remains a risky endeavor. It only takes one drop to shatter your screen or dent your device's structure, ruining it and racking up a hefty repair bill. That's why I always recommend using a case for your smartphone, no matter how careful you are. With the release of Samsung's new foldables , I've gathered the best Galaxy Z Fold 8 cases available 52", "title_fa": "بهترین قاب های Samsung Galaxy Z Fold 8 برای گوشی هوشمند جدید به شکل پاسپورت", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید سامسونگ؛ آمازون؛ OtterBox; Dbrand/Business Insider حتی با اینکه سازندگان دوام گوشی هوشمند را بهبود می بخشند، بدون قاب گوشی همچنان یک تلاش خطرناک است. فقط یک قطره طول می کشد تا صفحه نمایش شما را بشکند یا ساختار دستگاه شما را فرو ببرد، آن را خراب کند و هزینه تعمیر سنگینی را به همراه داشته باشد. به همین دلیل است که من همیشه استفاده از قاب برای گوشی هوشمند خود را توصیه می کنم، صرف نظر از اینکه چقدر مراقب باشید. با عرضه قاب‌های تاشو جدید سامسونگ، بهترین قاب‌های Galaxy Z Fold 8 را که اکنون در دسترس هستند در زیر گردآوری کرده‌ام. چیدن ها برای تاشوها، به خصوص موارد جدید، باریک هستند. این تلفن‌ها پیچیده‌تر هستند و لولاها، صفحه‌نمایش‌های خارجی و سایر سخت‌افزارها برای آن در نظر گرفته می‌شوند، بنابراین بازار در زمان عرضه با گزینه‌های موجود اشباع نشده است. گفته شد، همچنان می‌توانید گزینه‌های محافظ سامسونگ، اسپیگن، Otterbox و موارد دیگر را پیدا کنید. تخفیف و تخفیف قاب محافظ Galaxy Z Fold 8 Case شفاف Galaxy Z Fold 8 - 25 دلار 22 دلار Fntcase Galaxy Z Fold 8 Case - 28 $ 25 $ Spidercase Z Fold 8 Case - 40 $ 34 $ Fntcase Galaxy Z Fold 8 Case with Kickstand - 8 $ Galaxy Z Fold Case 7 $ 4 $ قاب‌های Z Fold 8 به یاد داشته باشید که Z Fold 8 فاقد آهنربای داخلی است - برای استفاده از لوازم جانبی MagSafe مانند دستگیره‌های تلفن و پایه‌های ماشین، باید یک قاب با یک قاب انتخاب کنید. همه گزینه‌های زیر سازگار هستند، اما فقط برخی از آنها دارای محافظ لولا هستند. موارد بیشتر را در آمازون جستجو کنید | بورگا | Otterbox | Dbrand بهترین"}, {"source": "Business Insider", "title": "McKinsey warns that AI may get a lot more expensive for companies", "link": "https://www.businessinsider.com/mckinsey-ai-agent-costs-variable-expensive-2026-9", "summary": "McKinsey says that AI agents take different routes on the same task. AI McKinsey Company warns that not all AI agents operate the same way — and could rack up costs. McKinsey found that cost \"variance can be up to 30x between different runs.\" In a recent report, the firm said agents can cut human time on tasks by 70%. McKinsey Company warns companies that AI spending may rise even further as agents become more common. Compared to text-based AI tools, agents can cost much more to run because they are actually completing tasks. Such tasks are often multistep processes, so the same goal can be accomplished in a variety of ways, and costs vary widely. According to a McKinsey study, the cost of completion for different agents could differ by as much as 30 times. \"Imagine like you're running an operation,\" said Lari Hämäläinen, a McKinsey senior partner, \"but every day there's a 30x difference in the cost.\" The consulting giant found that about a third of organizations spend more than 10% of their technology and communications budgets on AI in its 2026 State of AI survey. McKinsey said 60% of survey respondents planned to increase their AI spending next year. And about one in five said that AI spending was beginning to create constraints in their operating costs. \"So the spend is now becoming quite material and visible,\" said Tanguy Catlin, a McKinsey senior partner and director of the McKinsey Global Institute, on Tuesday. The issue is particularly acute for software-development teams using agents to automate coding, \"which obviously is very token hungry,\" McKinsey said. The warning comes after companies spent much of the past year encouraging workers to use more AI. Amazon shut down an employee-created leaderboard tracking AI token use after some workers performed tasks solely to climb the rankings. Companies, including Coinbase and Salesforce, have also begun putting limits on AI use as bills rise. In a report published earlier this month, McKinsey said agentic AI can cut the amount of time humans spend on certain transformation-office tasks by 35% to 40%, and sometimes by 70% or more. It argued, however, that companies need to measure whether their agents are producing enough value to justify the cost. \"A lot of this we are only now learning,\" Hämäläinen said. \"In the next 12 months, it will become very relevant.\" Read the original article on Business Insider", "date_str": "2026-09-22T22:50:18+00:00", "hash": "96306a264375618e", "title_fa": "مک‌کینزی هشدار می‌دهد که ممکن است هوش مصنوعی برای شرکت‌ها بسیار گران‌تر شود", "summary_fa": "مک‌کینزی می‌گوید که عوامل هوش مصنوعی مسیرهای متفاوتی را برای یک کار انتخاب می‌کنند. شرکت AI McKinsey هشدار می دهد که همه عوامل هوش مصنوعی به یک شکل عمل نمی کنند - و ممکن است هزینه ها را افزایش دهند. مک کینزی دریافت که \"واریانس هزینه می تواند تا 30 برابر بین اجراهای مختلف باشد.\" در گزارشی که اخیراً منتشر شد، این شرکت اعلام کرد که نمایندگان می توانند زمان انجام وظایف را تا 70 درصد کاهش دهند. شرکت مک‌کینزی به شرکت‌ها هشدار می‌دهد که هزینه‌های هوش مصنوعی ممکن است با رایج‌تر شدن کارگزاران، حتی بیشتر از این افزایش یابد. در مقایسه با ابزارهای هوش مصنوعی مبتنی بر متن، عامل ها می توانند هزینه بیشتری برای اجرا داشته باشند زیرا در واقع در حال تکمیل وظایف هستند. چنین وظایفی اغلب فرآیندهای چند مرحله ای هستند، بنابراین یک هدف را می توان به روش های مختلف انجام داد و هزینه ها به طور گسترده ای متفاوت است. طبق یک مطالعه مک کینزی، هزینه تکمیل برای عوامل مختلف ممکن است تا 30 برابر متفاوت باشد. لاری هامالاینن، یکی از شرکای ارشد مک‌کینزی، می‌گوید: «تصور کنید که در حال انجام یک عملیات هستید، اما هر روز 30 برابر هزینه تفاوت وجود دارد.» این غول مشاوره در بررسی وضعیت هوش مصنوعی خود در سال 2026 دریافت که حدود یک سوم سازمان ها بیش از 10 درصد از بودجه فناوری و ارتباطات خود را صرف هوش مصنوعی می کنند. مک‌کینزی گفت 60 درصد از پاسخ‌دهندگان نظرسنجی قصد داشتند هزینه‌های هوش مصنوعی خود را در سال آینده افزایش دهند. و از هر پنج نفر یک نفر گفت که هزینه های هوش مصنوعی شروع به ایجاد محدودیت در هزینه های عملیاتی خود کرده است. تانگوی کاتلین، شریک ارشد مک‌کینزی و مدیر موسسه جهانی مک‌کینزی، روز سه‌شنبه گفت: «بنابراین هزینه‌ها اکنون کاملاً مادی و قابل مشاهده است. مک"}, {"source": "Business Insider", "title": "Marc Benioff says Salesforce's investment in Anthropic was a plan B that could pay off in ‘tens of billions’", "link": "https://www.businessinsider.com/salesforce-ai-investment-anthropic-could-be-worth-tens-of-billions-2026-9", "summary": "Marc Benioff said that OpenAI s relationship with Microsoft prevented Salesforce from investing. Bloomberg/Getty Images Marc Benioff said that OpenAI's relationship with Microsoft prevented Salesforce from investing. Salesforce backed Anthropic and other AI startups instead. Marc Benioff said Salesforce could make \"tens of billions\" from Anthropic. Not being able to invest in OpenAI may have worked out perfectly for Salesforce. On an episode of the Sources Podcast published Tuesday, Marc Benioff told host Alex Heath that he originally wanted Salesforce to invest in OpenAI. Instead, the company backed its rival Anthropic , a decision the Salesforce CEO now thinks could be worth a fortune. \"I knew Sam Altman very well,\" Benioff said. \"I was like, 'Hey, I'd really like to be investing now in the company.' And he's like, unfortunately, because of the Microsoft relationship , we were not allowed to invest in OpenAI.\" Microsoft, an enterprise software competitor to Salesforce, holds roughly 27% of OpenAI, has rights to use OpenAI technology in its products, and sells access to OpenAI models through Azure. Benioff said the situation changed Salesforce's approach. \"We felt like, whoa, we can't go here, we're going to have to go everywhere else,\" Benioff added, saying it was \"not because we were so smart\" and spotted an overlooked winner. Benioff believes the bet could pay off handsomely and said that the investment has become a close business partnership. Salesforce's Slackbot and other new interfaces are powered by Claude, Anthropic's AI model. \"It's because we have been pushed so close with Anthropic,\" Benioff said. \"I think we'll make not just billions but maybe tens of billions of dollars on it.\" Salesforce has not disclosed how much of Anthropic it owns, but an Anthropic IPO could establish a public market value for Salesforce's stake and eventually offer a way to sell shares. The Claude maker has been preparing for a potential listing, although the timing is uncertain. OpenAI is also considering a public debut, but Altman said its IPO would not happen in 2026. Read the original article on Business Insider", "date_str": "2026-09-22T22:49:49+00:00", "hash": "abe648b457f9bc15", "title_fa": "مارک بنیوف می‌گوید سرمایه‌گذاری Salesforce در Anthropic یک طرح B بود که می‌توانست «ده‌ها میلیارد» نتیجه دهد.", "summary_fa": "مارک بنیوف گفت که رابطه OpenAI با مایکروسافت مانع از سرمایه گذاری Salesforce شده است. بلومبرگ/گتی ایماژ مارک بنیوف گفت که رابطه OpenAI با مایکروسافت مانع از سرمایه گذاری Salesforce شده است. در عوض Salesforce از آنتروپیک و دیگر استارت‌آپ‌های هوش مصنوعی حمایت کرد. مارک بنیوف گفت Salesforce می تواند \"ده ها میلیارد\" از آنتروپیک درآمد داشته باشد. عدم توانایی در سرمایه گذاری در OpenAI ممکن است برای Salesforce کاملاً کارساز باشد. در یکی از قسمت‌های پادکست Sources که روز سه‌شنبه منتشر شد، مارک بنیوف به مجری برنامه الکس هیث گفت که در ابتدا می‌خواهد Salesforce در OpenAI سرمایه‌گذاری کند. در عوض، این شرکت از رقیب خود Anthropic حمایت کرد، تصمیمی که مدیر عامل Salesforce اکنون فکر می‌کند می‌تواند ارزش ثروت زیادی داشته باشد. بنیوف گفت: من سم آلتمن را به خوبی می شناختم. \"من می گفتم، \"هی، من واقعاً دوست دارم اکنون در شرکت سرمایه گذاری کنم.\" و او مثل این است که متأسفانه به دلیل رابطه مایکروسافت، ما اجازه نداشتیم در OpenAI سرمایه گذاری کنیم.\" مایکروسافت، یک رقیب نرم‌افزاری سازمانی برای Salesforce، تقریباً 27٪ از OpenAI را در اختیار دارد، حق استفاده از فناوری OpenAI را در محصولات خود دارد و دسترسی به مدل‌های OpenAI را از طریق Azure می‌فروشد. بنیوف گفت که این وضعیت رویکرد Salesforce را تغییر داد. بنیوف افزود: «احساس می‌کردیم، اوه، نمی‌توانیم به اینجا برویم، باید به هر جای دیگری برویم. بنیوف معتقد است که این شرط می تواند به خوبی نتیجه دهد و گفت که این سرمایه گذاری به یک شراکت تجاری نزدیک تبدیل شده است. Slackbot Salesforce و دیگر رابط‌های جدید توسط Claude، مدل هوش مصنوعی Anthropic طراحی شده‌اند. بنیوف گفت: «به این دلیل است که ما با آنتروپیک بسیار نزدیک شده ایم. من فکر می کنم ما نه تنها میلیاردها، بلکه شاید ده ها میلیارد دلار از آن درآمد خواهیم داشت.»"}, {"source": "Business Insider", "title": "11 best iPhone 17 cases for protection, style, and utility", "link": "https://www.businessinsider.com/guides/tech/best-iphone-17-cases", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more OtterBox; Amazon; Bellroy; Troubador; Burga; Zagg/Business Insider Though we've come a long way from the iPhones of yesteryear, protecting your device is still important. Even the best phones aren't immune to drops and dents, which is why I recommend ordering a good case to protect your investment. Ahead, I've got you covered with the best iPhone 17 cases you can trust for the job. As a phone-dropper extraordinaire and longtime case tester, I've got an array of brands I recommend. In my time testing and reviewing the iPhone 17 , I've especially loved OtterBox's super durable (albeit clunky) designs and Burga's vast library of unique prints. Spigen is also a beloved brand for meeting most users' needs for affordability and quality. The best iPhone 17 cases Browse more cases at Amazon | Zagg | Otterbox | Casetify | Bandolier | Burga Sarah Saril/Business Insider What is the best iPhone 17 case? The best case for your iPhone 17 ultimately depends on your needs. While one person may prefer a slim, affordable option like the Mkeke Clear Case , users who often misplace their device might prefer the convenience and style of a Bandolier Crossbody case . If you're looking for robust yet thick protection, I recommend the Zagg Crystal Palace Snap for its reliable protection, MagSafe compatibility, compact stand, and slim profile. Do iPhone 16 cases fit the iPhone 17? Despite their similarities,  to spend some quality time with him. Then I had an idea. \"I need you to teach me golf,\" I said one morning. \"Are you serious?\" he asked. \"Yes, and I'll pay you,\" I offered. Golf lessons were easy money for my son My son has been golfing since he was 4. For me, it was a practical choice. I wanted him to play a sport where he had less of a chance of getting hurt, and golf was one that he could potentially play well into adulthood . He took to it and ended up eventually playing on his high school team. The author said her son has been golfing since he was 4. Courtesy of Andrea Tate. When I pitched the idea of paid lessons, he jumped at the chance, motivated by the need to fill his gas tank. Plus, my new golf clubs had been sitting in my garage for two years, a gift from my husband one Christmas when we discussed what we would do when we retire. Being a master negotiator like his dad and a skilled salesman like his stepdad, he locked in a higher rate than I initially offered. If I were taking lessons from a golf pro , it would cost twice as much, which is not in my budget right now. I was not about to squabble over a few bucks, since I figured he'd get that money out of me another way anyway. Golf gave us a new way to connect We worked together to determine a date and time that worked for both of us. I get up at 5 am. He wakes up at noon. I work 9 to 5. He wasn't working — yet. The weekends were best, and I talked him into a 9 a.m. st", "date_str": "2026-09-22T21:37:01+00:00", "hash": "f77429810ae39da4", "title_fa": "دلم برای گذراندن وقت با پسر بالغم تنگ شده بود، بنابراین او را به عنوان مربی گلف خود استخدام کردم", "summary_fa": "نویسنده به دنبال راهی برای برقراری ارتباط مجدد با پسرش پس از بازگشت به خانه بود. او متوجه شد که می تواند از چند نکته برای سبز کردن استفاده کند و او به پول نقد نیاز داشت. با حسن نیت از آندریا تیت. پسرم وقتی از دانشگاه برگشت استقلال بیشتری داشت و ارتباط ما برای ما سخت بود. من می دانستم که او به پول نقد نیاز دارد و می توانم از چند درس گلف استفاده کنم، بنابراین تصمیم گرفتم او را استخدام کنم. درس‌ها به من فرصتی داد تا جنبه‌ای متفاوت از او را ببینم و آن‌ها را به سرمایه‌گذاری محکمی تبدیل کرد. وقتی پسر 23 ساله من از دانشگاه برگشت، متوجه شدم که او مستقل تر است. در حالی که این چیزی است که هر والدینی می‌خواهد، اما به معنای تعامل کمتر بین ما نیز هست. حالا خودش بدون اینکه من در خانه اش را بزنم بلند شد، صبح خودش ساندویچ تخم مرغی درست کرد و خودش را به همه جا رساند. من دیگر ساعت زنگ دار، آشپز یا راننده نبودم. او قصد داشت به زودی از خانه ما نقل مکان کند تا اولین آپارتمان خود را در لس آنجلس بگیرد و حومه شهر را پشت سر بگذارد. می دانستم که او به پول نقد اضافی نیاز دارد، زیرا او همچنان به دنبال کار بود، و من از گذراندن زمان با کیفیت با او ناامید بودم. سپس من یک ایده داشتم. یک روز صبح گفتم: \"من باید به من گلف یاد بدهی.\" \"جدی میگی؟\" او پرسید. من پیشنهاد دادم: «بله، و من به شما پول می دهم. درس های گلف برای پسرم پول آسانی بود پسرم از 4 سالگی گلف بازی می کرد. برای من این یک انتخاب عملی بود. من می‌خواستم او ورزشی را انجام دهد که در آن شانس کمتری برای آسیب‌دیدگی داشته باشد، و گلف"}, {"source": "Business Insider", "title": "Everything Trump has put his name and face on as president — so far", "link": "https://www.businessinsider.com/things-with-donald-trump-name-and-face-president", "summary": "President Donald Trump has a known penchant for putting his name on things. Kevin Dietsch/Getty Images Several initiatives and buildings have been named after President Donald Trump in his second term. He has launched TrumpRX, Trump Accounts, and announced a new \"Trump-class\" of Navy ships. His GOP allies have also renamed an airport in Florida and a bridge in Tennessee. Trump Tower . Trump National Golf Club . Trump Steaks. Even before becoming president of the United States, Donald Trump had a known penchant for putting his name on things. In his second, non-consecutive term, Trump has named — and renamed — a growing number of government programs and buildings after himself, often forging ahead with changes despite criticism and lawsuits . His board appointees, members of his administration, and other GOP allies have also taken to adding Trump's name or face to their own initiatives. \"President Trump is focused on saving our country — not garnering recognition,\" White House spokesman Davis Ingle told Business Insider. \"However, given his vast accomplishments, including signing the largest tax cut in history, securing the border, restoring peace through strength, and more, it is natural that local officials and other great patriots want to recognize the President's incredible work on behalf of the American people.\" Additionally, Trump has renamed geographical landmarks after the US, changing the Gulf of Mexico to the \"Gulf of America\" in January 2025 and Lake Ontario to \"Lake America\" in August. In a Truth Social post , he mused about changing the Strait of Hormuz to \"Trump Strait.\" Here's a look at everything Trump has put his name and face on since returning to the White House — so far. May 2025: Banners featuring portraits of Trump began appearing on government buildings in Washington, DC. WASHINGTON, DC - MAY 26: Banners showing images of U.S. President Donald Trump and Abraham Lincoln are displayed at the U.S. Department of Agriculture building on May 26, 2025 in Washington, DC. Kevin Carter/Getty Images The US Department of Agriculture was decorated with a Trump banner in May 2025. Since then, the Department of Justice, the Department of the Interior, and the Department of Labor have also been spotted flying banners with Trump's face. December 2025: The Department of the Interior announced that Trump would appear on the 2026 America the Beautiful pass. A National Park Service ranger at Rocky Mountain National Park shows the new America the Beautiful", "date_str": "2026-09-22T21:09:33+00:00", "hash": "7a9df236d158a300", "title_fa": "همه چیزهایی که ترامپ نام و چهره خود را به عنوان رئیس جمهور نشان داده است - تا کنون", "summary_fa": "دونالد ترامپ، رئیس جمهور آمریکا، تمایل زیادی به قرار دادن نام خود بر روی چیزها دارد. کوین دیچ/ گتی ایماژ چندین طرح و ساختمان به نام رئیس جمهور دونالد ترامپ در دوره دوم ریاست جمهوری خود نامگذاری شده است. او TrumpRX، Trump Accounts را راه‌اندازی کرده و کشتی‌های جدید «کلاس ترامپ» را اعلام کرده است. متحدان جمهوری‌خواه او همچنین نام یک فرودگاه در فلوریدا و یک پل در تنسی را تغییر داده‌اند. برج ترامپ. باشگاه ملی گلف ترامپ استیک ترامپ. حتی قبل از اینکه رئیس جمهور ایالات متحده شود، دونالد ترامپ تمایل زیادی به قرار دادن نام خود بر روی چیزها داشت. ترامپ در دومین دوره غیر متوالی خود، تعداد فزاینده ای از برنامه ها و ساختمان های دولتی را به نام خود نامگذاری کرده و نام خود را تغییر داده است، که اغلب با وجود انتقادات و شکایت ها، تغییرات را پیش می برد. منصوبان هیئت مدیره، اعضای دولت او و سایر متحدان جمهوری خواه نیز نام یا چهره ترامپ را به طرح های خود اضافه کرده اند. دیویس اینگل، سخنگوی کاخ سفید به بیزینس اینسایدر گفت: «پرزیدنت ترامپ بر نجات کشور ما متمرکز است - نه اینکه به رسمیت شناخته شود. با این حال، با توجه به دستاوردهای گسترده او، از جمله امضای بزرگترین کاهش مالیات در تاریخ، تامین امنیت مرزها، بازگرداندن صلح از طریق قدرت، و موارد دیگر، طبیعی است که مقامات محلی و دیگر میهن پرستان بزرگ بخواهند کار باورنکردنی رئیس جمهور را به نمایندگی از مردم آمریکا به رسمیت بشناسند. علاوه بر این، ترامپ بناهای جغرافیایی را به نام ایالات متحده تغییر نام داده است و خلیج مکزیک را در ژانویه 2025 به \"خلیج آمریکا\" و دریاچه انتاریو را به \"دریاچه آمریکا\" در ماه اوت تغییر داده است. در یک پست اجتماعی حقیقت، او در مورد تغییر تنگه هرمز به \"تنگه ترامپ\" فکر کرد. در"}, {"source": "Business Insider", "title": "MrBeast just filed a trademark application under 'Beast Band' for wearables like a fitness tracker", "link": "https://www.businessinsider.com/mrbeast-trademark-application-wearables-fitness-tracker-band-2026-9", "summary": "Jimmy Donaldson, a.k.a. MrBeast, has aligned himself with sports and fitness themes over the years. Logan Riely/NBAE via Getty Images Would you or your kids buy a MrBeast-branded activity tracker to wear on your wrist? MrBeast عی به نفع همه خواهد بود. اما درست زمانی که همه ما سنگرهای هوش مصنوعی خود را قیمت گذاری می کردیم، رشدهای هوش مصنوعی نیز به راه افتادند. مردم نمی‌توانند دستیاران هوش مصنوعی شخصی را که از آنها استفاده می‌کنند تمجید نکنند، به ویژه Instinct و Meta's Muse. ناگهان هوش مصنوعی چندان نگران کننده نبود که بتواند لباس های هالووین را به شما بدهد. مشاهده دو نظریه - هوش مصنوعی ما را نابود خواهد کرد. هوش مصنوعی به ما قدرت می‌دهد - به‌نظر می‌رسد که به‌تدریج اتفاق بیفتد. اما درک این نکته مهم است که پیام ها از اردوگاه های مختلف با انگیزه های متفاوت می آیند. به راحتی محتاطانه مشاهده صنعت هوش مصنوعی به عنوان یک لکه واحد و یکنواخت آسان است، اما واقعیت این است که قطعات جداگانه زیادی با"}, {"source": "Business Insider", "title": "Bluetti FridgePower vs Jackery FridgeGuard: Gimmick, luxury, or power outage lifesaver?", "link": "https://www.businessinsider.com/guides/home/bluetti-fridgepower-vs-jackery-fridgeguard-fridge-backup", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Refrigerated food can spoil in just four hours without power. Portable fridge backups from Jackery and Bluetti are on standby to save your groceries in case of a power outage. Bluetti; Jackery/Business Insider Losing power at home is never ideal. After you’ve located the flashlights, concern sets in over how long you’ll have to sit around without power. One of the most worrisome parts about a grid power failure is how long food will last in the fridge and freezer. These days, most homes have hundreds of dollars worth of groceries and medication in the fridge that are at risk of spoiling with just four hours without power. To keep the fridge powered up through an outage, you could invest in a whole-home generator or a portable power station . But if you’re looking for a set-it-and-forget-it solution, two leading portable power station brands have created refrigerator-specific models that sit on top of your fridge and take over power should the grid fail. I tested e. Style-wise, I stick to pairs that can go day-to-night with a simple outfit change. Over the past couple years, I've gone backpacking in Europe, hiking in a national park, and commuted back and forth between New York and New England. The best travel shoes for women I had with me featured cushioned insoles, roomy toe boxes, and a wear-with-anything silhouette. With these shoes, I've been able to withstand long TSA lines and walk around new places in comfort. For more masculine pairs, see our guide to the best travel shoes for men . How I test travel shoes Gabrielle Chase/Business Insider All-day comfort: I've done extensive testing across the best walking shoes , loafers , and other comfortable dress shoes for women . I walk in them for 15,000 to 20,000 steps at a time to make sure they don't cause my feet to overheat, which leads to aches and blisters. The most cushioned, airy walking sneakers I own are Rykä's Devotion X . Sizing and fit: I wear a size US 8 in women's shoes. I look for comfortable pairs that have a secure, adjustable fit (especially around the collar and vamp), with enough room in the toe box so I don't feel overcrowded. It's important for balance that my toes be able splay naturally while standing all day in long lines. Day-to-night style: I prefer tumbled or textured leather for dress shoes, since they make scuff marks less noticeable. I also considered how their shape looks with different hemlines. I usually go with neutral colors so I can mix and match them with any outfit in my carry-on. Weatherproofing: For any shoes that claim to be waterproof or water resistant, I determine via pour test or real-world testing whether they hold up in wet or muddy conditions. When traveling through mixed forecasts, it helps to have active shoes with a Gore-Tex upper (like the ones from Salomon or Hoka ). Weight and packability: The heaviest sh", "date_str": "2026-09-22T20:45:56+00:00", "hash": "47a5107e36e26c26", "title_fa": "بهترین کفش های مسافرتی زنانه برا lat for easy access. If you travel a lot on different airlines , the Large Clear Cosmetics Case is a safe bet since certain airlines are stricter than others about the clear bag rule. For the most elegant choice , the Etoile Mini Vanity Case seamlessly blends vintage glamour with modern practicality. How we tested the best toiletry and makeup bags We tested more than 20 toiletry and makeup bags, evaluating each one for capacity, organization, durability, portability, and leak resistance. To test capacity, I packed each bag with a realistic mix of skincare, makeup, hair care, and shower products, including brushes, lip products, compacts, full-size bottles, and small hair tools. I looked beyond whether everything technically fit and assessed how the bag performed when full. The best options held a complete routine without bulging, straining at the seams, tipping over, or becoming difficult to zip. I also evaluated how easy each bag was to organize and use. I looked for practical features such as clear or mesh compartments, elastic loops, brush holders, removable inserts, zippered pockets, and separate sections for wet or spill-prone products. Bags scored higher when I could quickly see and reach what I needed without digging through one large compartment. For portability, I considered how easily each bag fit into a carry-on or checked suitcase, how comfortable it was to carry, and how con", "date_str": "2026-09-22T20:24:35+00:00", "hash": "0c0b52d937b952c3", "title_fa": "بهترین کیف های آرایش برای سفر", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Samantha Crozier/Business Insider بهترین کیسه های آرایش برای مسافرت باید یک عمل متعادل کننده پیچیده داشته باشند: آنها باید به اندازه کافی باریک باشند که به خاطر برداشتن نیمی از چمدان از آنها رنجیده نشوید، اما به اندازه کافی جادار باشند تا همه چیزهایی را که واقعاً استفاده می کنید مناسب باشند. این ممکن است به معنای چند مینی مسافرتی، چندین محصول با ان
