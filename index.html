خ رایگان: بازی در روز شنبه، 26 سپتامبر ساعت 12:00 بعد از ظهر آغاز می‌شود. کانال ET TV: ABC Stream آنلاین: می‌توانید ABC را از طریق DirecTV، Hulu + Live TV یا Fubo پخش کنید، که در حال حاضر هر کدام یک آزمایش رایگان برای مشترکین واجد شرایط ارائه"}, {"source": "Billboard", "title": "SZA Inducted Into New Jersey Hall of Fame by Danny DeVito", "link": "https://www.billboard.com/music/awards/sza-inducted-hall-of-fame-1236348236/", "summary": "SZA has been inducted into the New Jersey Hall of Fame, honored in the Performing Arts Entertainment category at the organization s 18th annual induction ceremony on Thursday (Sept. 24). The seven-time Grammy winner was inducted by fellow New Jersey native Danny DeVito, who hosted the ceremony at the Dream Live Performing Arts Center at American Dream in East Rutherford. Born in St. Louis but raised in Maplewood and a graduate of Columbia High School, SZA kept things playful on Instagram afterward: Got inducted into the New Jersey Hall of Fame, she wrote. MORE IMPORTANTLY I MET DANNY DEVITO. View this post on Instagram Her acceptance speech was more earnest. This is probably one of the biggest honors I ve ever had, she said, recalling working local jobs from a pizza parlor to a shoe store and crediting the community that raised her. I come from a small town where everybody knows each other s first and last name… I just love community, and I promise to take that energy of community around the world wherever I go. She also shouted out fellow Columbia High School alum Lauryn Hill, who has not yet been inducted, and pushed back on the tendency to overlook the state: Sometimes people [skip] over Jersey and go straight to New York. But they re missing the meat. They re missing the heartbeat of the tri-state. SZA joins a New Jersey Hall of Fame roster that includes Whitney Houston, Bruce Springsteen, Frank Sinatra, Queen Latifah, the Jonas Brothers, Wyclef Jean and the Isley Brothers, among others. DeVito was inducted in 2010. One of the most commercially dominant artists of her generation, SZA broke through with her 2017 debut Ctrl , which reached No. 3 on the Billboard 200 and was certified triple platinum. Her 2022 follow-up SOS debuted at No. 1 and went on to spend 13 nonconsecutive weeks atop the chart, boosted by its 2024 Lana deluxe expansion, while its single Kill Bill became one of two RIAA diamond-certified hits in her catalog. A seven-time Grammy winner and 2024 recipient of the Songwriters Hall of Fame s Hal David Starlight Award, she has amassed more than 70 billion career streams.", "date_str": "2026-09-26T07:44:34+00:00", "hash": "3c1047b8b8911a8d", "title_fa": "SZA توسط دنی دویتو وارد تالار مشاهیر نیوجرسی شد", "summary_fa": "SZA به تالار مشاهیر نیوجرسی راه یافت و در رده سرگرمی هنرهای نمایشی در هجدهمین مراسم معارفه سالانه سازمان در روز پنجشنبه (24 سپتامبر) مورد تقدیر قرار گرفت. برنده هفت جایزه گرمی توسط دنی دویتو، بومی نیوجرسی، که میزبان مراسم در مرکز هنرهای نمایشی Dream Live در American Dream در شرق رادرفورد بود، معرفی شد. متولد در St. لوئیس، اما در Maplewood بزرگ شد و از دبیرستان کلمبیا فارغ التحصیل شد، SZA بعد از آن همه چیز را در اینستاگرام بازیگوش نگه داشت: او نوشت که به تالار مشاهیر نیوجرسی معرفی شد. مهمتر از آن من با دنی دویتو ملاقات کردم. این پست را در اینستاگرام مشاهده کنید سخنرانی پذیرش او جدی تر بود. او گفت که این احتمالاً یکی از بزرگترین افتخاراتی است که تا به حال داشته ام، به یاد آوردن مشاغل محلی از پیتزا فروشی تا یک فروشگاه کفش و اعتبار بخشیدن به جامعه ای که او را بزرگ کرده است. من از یک شهر کوچک آمده‌ام که همه نام و نام خانوادگی یکدیگر را می‌دانند... من فقط جامعه را دوست دارم، و قول می‌دهم که انرژی جامعه را به هر کجا که می‌روم به سراسر جهان ببرم. او همچنین فریاد زد، لورین هیل، یکی از دانش‌آموزان دبیرستان کلمبیا، که هنوز استخدام نشده است، و از تمایل به نادیده گرفتن ایالت عقب نشینی کرد: گاهی اوقات مردم از جرسی می‌گذرند و مستقیم به نیویورک می‌روند. اما دلشان برای گوشت تنگ شده است. آنها دلشان برای تپش قلب سه ایالت تنگ شده است. SZA به فهرستی از تالار مشاهیر نیوجرسی می‌پیوندد که شامل ویتنی هیوستون، بروس اسپرینگستین، فرانک سیناترا، کوئین لطیفه، برادران جوناس، وایکلف ژان و برادران ایسلی و دیگران می‌شود. DeVito در سال 2010 معرفی شد. یکی از هنرمندان برتر از نظر تجاری نسل خود، SZA با اولین Ctrl در سال 2017 که به شماره 3 در"}, {"source": "Billboard", "title": "Michelle Branch and Maren Morris Reimagine ‘Goodbye to You’ With Laguna Beach-Themed Video", "link": "https://www.billboard.com/music/pop/michelle-branch-maren-morris-reimagine-goodbye-to-you-laguna-beach-themed-video-1236348224/", "summary": "Michelle Branch has reimagined her 2002 hit Goodbye to You as a duet with Maren Morris , pairing the new version with a Laguna Beach -inspired music video starring reality star Kristin Cavallari. Out now via BMG, the reworked track turns the song into a full duet rather than a straight re-recording, with the two Grammy winners trading its lines about change, independence and letting go. Beyond thrilled to be joining Maren on her beautiful rendition of Goodbye to You,' Branch said. Call me crazy, but I prefer her version to the original. Morris, who has cited Branch as a formative influence, added: Michelle was really encouraging to let me make it my own… Her songwriting has always been ahead of its time. The pair first previewed the collaboration last month when Branch made a surprise appearance during Morris 10th-anniversary celebration of her debut album Hero at Nashville s Ryman Auditorium. The accompanying video leans hard into early-2000s nostalgia, recreating the prom scene from MTV s Laguna Beach: The Real Orange County — the reality series that famously featured Goodbye to You in its first season, with cast members singing along in a limo. Cavallari, who rose to fame on the show, appears alongside Branch and Morris. Goodbye to You is one of those songs that immediately takes me back to a very specific time in my life, she said, calling the shoot a fun, full-circle experience. The release is the second confirmed track from Everywhere and Back Again , Branch s EP marking 25 years in music, due Nov. 6 via BMG. The project revisits songs from across her catalog through new recordings with guest collaborators; it launched earlier this year with a reworked The Game of Love reuniting Branch with New Radicals frontman Gregg Alexander. The EP arrives as Branch launches her Everywhere and Back Again Tour — a nearly 20-date fall run that sold out nationwide within a week, prompting a 17-date 2027 leg. Goodbye to You originally appeared on Branch s 2001 debut album The Spirit Room , which sold three million copies worldwide and was certified double-platinum in the U.S., establishing her among a new generation of young women writing and performing their own songs. The song became her third top-40 hit, peaking at No. 21 on the Billboard Hot 100 in 2002. Branch went on to win a Grammy for her 2002 Carlos Santana collaboration The Game of Love, which reached No. 5 on the Hot 100, and topped the Hot Country Songs chart with Leave the Pieces as one half of the duo t", "date_str": "2026-09-26T07:17:34+00:00", "hash": "ffcd16ae1a324848", "title_fa": "میشل برانچ و مارن موریس با ویدیویی با موضوع ساحل لاگونا دوباره «خداحافظ با تو» را تصور می‌کنند.", "summary_fa": "میشل برانچ آهنگ 2002 Goodbye to You خود را به عنوان دوئت با مارن موریس مجسم کرده است و نسخه جدید را با موزیک ویدیویی الهام گرفته از لاگونا بیچ با بازی کریستین کاوالاری، ستاره واقعیت، جفت کرده است. در حال حاضر از طریق BMG، آهنگ بازسازی شده آهنگ را به یک دونوازی کامل و نه یک ضبط مجدد مستقیم تبدیل می کند، با دو برنده گرمی که در مورد تغییر، استقلال و رها کردن صحبت می کنند. برانچ گفت: فراتر از اینکه به مارن در اجرای زیبای Goodbye to You ملحق می شوم هیجان زده هستم. مرا دیوانه صدا کن، اما من نسخه او را به نسخه اصلی ترجیح می دهم. موریس، که از برانچ به عنوان تأثیری شکل‌دهنده یاد کرده است، افزود: میشل واقعاً دلگرم‌کننده بود که به من اجازه داد آن را خودم بسازم... آهنگ‌سرایی او همیشه جلوتر از زمان خود بوده است. این زوج ماه گذشته برای اولین بار پیش‌نمایش این همکاری را انجام دادند، زمانی که برانچ در جشن دهمین سالگرد اولین آلبوم موریس، Hero در سالن رایمن نشویل، ظاهری غافلگیرکننده داشت. ویدئوی همراه به شدت به نوستالژی های اوایل دهه 2000 متمایل است و صحنه جشن جشن را از لاگونا بیچ در ام تی وی: شهرستان اورنج واقعی - سریال واقعیتی که در فصل اول خداحافظی با تو را به نمایش می گذاشت و اعضای بازیگران در یک لیموزین در کنار هم آواز می خوانند، نمایش داده می شود. کاوالاری که در سریال به شهرت رسید، در کنار برانچ و موریس ظاهر می شود. او گفت که Goodbye to You یکی از آن آهنگ‌هایی است که من را فوراً به یک زمان خاص از زندگی‌ام برمی‌گرداند و فیلمبرداری را تجربه‌ای مفرح و دایره‌ای کامل خواند. این انتشار دومین آهنگ تایید شده از Everywhere and Back Again، EP Branch است که ۲۵ سال از موسیقی"}, {"source": "Billboard", "title": "Kylie Minogue Delivers Hits, Surprise Guests and Pyrotechnics at AFL Grand Final", "link": "https://www.billboard.com/music/pop/kylie-minogue-afl-grand-final-show-1236348210/", "summary": "Kylie Minogue delivered on her promise of the biggest spectacle at the Melbourne Cricket Ground on Saturday (Sept. 26), headlining the AFL Grand Final pre-game entertainment with a career-spanning, high-flying show in front of more than 100,000 fans — and millions more watching at home. Performing in her hometown for the first time at the event, the pop icon packed more than three decades of hits into a 20-minute set, undeterred by the rain that had soaked the venue for much of the day. A homecoming like this? I should be so lucky, she told the crowd, as the letters K and M lit the stadium s floodlights. The show opened with a video montage of home footage from Minogue s Melbourne childhood, a young schoolgirl walking onto the turf before the real Kylie launched into Love at First Sight. From there she moved through Love at First Sight, In Your Eyes, Get Outta My Way, On a Night Like This, All the Lovers and Spinning Around, backed by dancers and pyrotechnics through multiple costume changes. The set made room for guests and surprises: Kalkadunga songman William Barton joined her for a dramatic, orchestral-backed rendition of 1994 s Confide in Me, and G Flip — who had opened the pre-game entertainment with their own three-instrument set — returned to trade a rock-leaning Padam Padam. After a fake-out ending on The Loco-Motion, which sent the crowd into the dance en masse, Minogue emerged from a giant bedazzled KYLIE football and soared through the air above the stadium to close on Can t Get You Out of My Head, incorporating a remix by Melbourne DJ Dom Dolla, who appeared as her aircraft marshaller. Minogue is the first solo Australian act to headline the Grand Final since Paul Kelly in 2019, and the first Australian at all since a 2021 medley during the pandemic-relocated Perth final; recent years had featured international headliners including Robbie Williams, KISS, Katy Perry and Snoop Dogg. One of the most successful pop artists in history, Minogue has sold more than 80 million records worldwide and scored nine No. 1 albums in Australia across a nearly four-decade career. While her U.S. presence peaked with the crossover smash Can t Get You Out of My Head — which reached No. 7 on the Billboard Hot 100 — she has been a fixture on Billboard s dance charts, where the same track became the first of her 14 No. 1s on the Dance Club Songs tally. A two-time Grammy winner and 18-time ARIA Award recipient, she returned to the global spotlight in recent years with", "date_str": "2026-09-26T06:42:59+00:00", "hash": "ff38b26812a4a08e", "title_fa": "کایلی مینوگ در فینال بزرگ AFL آهنگ‌ها، مهمانان غافلگیرکننده و پیروتکنیک ارائه می‌کند.", "summary_fa": "کایلی مینوگ به وعده خود مبنی بر بزرگترین نمایش در زمین کریکت ملبورن در روز شنبه (26 سپتامبر) عمل کرد و عنوان سرگرمی قبل از بازی فینال بزرگ AFL را با یک نمایش حرفه ای و پرشور در مقابل بیش از 100000 طرفدار - و میلیون ها نفر دیگر در خانه تماشا کرد. این نماد پاپ که برای اولین بار در زادگاهش در این رویداد اجرا می‌کرد، بیش از سه دهه بازدید را در مجموعه‌ای 20 دقیقه‌ای داشت، بدون اینکه بارانی که در بیشتر روز محل برگزاری را خیس کرده بود، دلسرد شود. چنین بازگشتی به خانه؟ او به جمعیت گفت که من باید خیلی خوش شانس باشم، زیرا حروف K و M نورافکن استادیوم را روشن می کردند. نمایش با یک مونتاژ ویدیویی از فیلم های خانگی از دوران کودکی مینوگ در ملبورن آغاز شد، دختر مدرسه ای جوانی که در حال راه رفتن روی چمن بود قبل از اینکه کایلی واقعی به عشق در یک نگاه وارد شود. از آنجا به عشق در نگاه اول، در چشمان تو، از راه من برو بیرون، در شبی شبیه این، همه عاشقان و چرخیدن در اطراف، با حمایت رقصندگان و عوامل آتش نشانی از طریق تغییرات متعدد لباس، حرکت کرد. مجموعه فضایی را برای مهمانان و شگفتی‌ها باز کرد: ویلیام بارتون، خواننده کالکادونگا، برای اجرای دراماتیک و ارکستری از Confide in Me در سال 1994 به او پیوست، و جی فلیپ - که سرگرمی قبل از بازی را با مجموعه سه ساز خود افتتاح کرده بود - بازگشت تا یک Padam Padam متمایل به راک را معامله کند. پس از پایان ساختگی در The Loco-Motion، که جمعیت را به طور دسته جمعی به رقص فرستاد، مینوگ از یک فوتبال غول پیکر KYLIE که خیره شده بود بیرون آمد و در هوای بالای استادیوم اوج گرفت تا Can t Get You Out"}, {"source": "Billboard", "title": "Olivia Rodrigo’s Unraveled Tour 2026 Setlist: Every Song Played at the First Show", "link": "https://www.billboard.com/lists/olivia-rodrigo-setlist-unraveled-tour-2026-songs/", "summary": "Olivia Rodrigo unveiled her Unraveled Tour setlist Friday night (Sept. 25) in Hartford, Connecticut, where she performed nearly her entire you seem pretty sad for a girl so in love album, plus songs from GUTS and SOUR , on a stage full of wildflowers. Billboard was on site for the sold-out tour s kickoff date at Hartford s PeoplesBank Arena (formerly the XL Center), where the Stupid Song songstress was slated to headline two nights in a row. The first date of Rodrigo s Unraveled Tour went off without a hitch. A dreamy Drop Dead opened the door to a two-hour show with something to delight every kind of fan, from casual listeners there for sing-along chart-toppers, like Drivers License and Deja Vu, to Liv loyalists ready to hear their favorite sad or so-in-love song live in person for the very first time. Related Olivia Rodrigo s You Seem Pretty Sad for a Girl So in Love : All 13 Tracks Ranked Now that Rodrigo s got three full-length studio albums in her collection, two hours isn t enough to pack in everything. There were a couple songs absent from the setlist that might come as a surprise. The show puts Rodrigo s 2026 album in the spotlight. Only one song from you seem pretty sad for a girl so in love was left off on opening night ( What s Wrong With Me, one of the album s highest points) and it s missed, but fair enough. It wouldn t hit the same without Robert Smith. Though there s no room for covers, one non-album release made the cut: Serena Joy. The Cure is a standout moment in the set, and Expectations is a killer closer. See the full setlist for Olivia Rodrigo s Unraveled Tour below.", "date_str": "2026-09-26T06:14:07+00:00", "hash": "68030fdb0fb13eb7", "title_fa": "ست لیست تور Unraveled Tour Olivia Rodrigo 2026: هر آهنگی که در اولین نمایش پخش شد", "summary_fa": "اولیویا رودریگو، جمعه شب (25 سپتامبر) در هارتفورد، کانکتیکات، از لیست مجموعه‌های تور Unraveled خود رونمایی کرد، جایی که او تقریباً تمام آلبوم خود را که برای دختری بسیار عاشق به نظر می‌رسد غمگین به نظر می‌رسد، به اضافه آهنگ‌هایی از GUTS و SOUR، روی صحنه‌ای پر از گل‌های وحشی اجرا کرد. بیلبورد برای تاریخ شروع تور پرفروش در هارتفورد PeoplesBank Arena (مرکز XL سابق) در محل بود، جایی که قرار بود خواننده آهنگ احمقانه دو شب متوالی تیتر اصلی شود. اولین تاریخ تور Unraveled Rodrigo بدون هیچ مشکلی برگزار شد. یک Drop Dead رویایی در را به یک نمایش دو ساعته باز کرد که هر نوع طرفداری را به وجد آورد، از شنوندگان معمولی در آنجا برای آواز خواندن در کنار ترانه های برتر، مانند Drivers License و Deja Vu، تا وفاداران Liv که آماده شنیدن آهنگ غمگین یا عاشقانه مورد علاقه خود برای اولین بار به صورت زنده هستند. مرتبط با اولیویا رودریگو شما برای دختری خیلی عاشق بسیار غمگین به نظر می‌رسید: همه 13 آهنگ رتبه‌بندی شدند اکنون که رودریگو سه آلبوم استودیویی کامل در مجموعه خود دارد، دو ساعت برای جمع کردن همه چیز کافی نیست. چند آهنگ در لیست غایب وجود داشت که ممکن است غافلگیر کننده باشد. این نمایش آلبوم 2026 رودریگو را در کانون توجه قرار می دهد. فقط یک آهنگ از شما برای دختری بسیار غم انگیز به نظر می رسد که عاشق آن شب افتتاحیه (Whats Wrong With Me، یکی از بالاترین نقاط آلبوم) و از دست رفته است، اما به اندازه کافی منصفانه است. بدون رابرت اسمیت این اتفاق نمی افتد. اگرچه جایی برای کاور وجود ندارد، یک نسخه غیرآلبومی برش را انجام داد: سرنا جوی. The Cure یک لحظه برجسته در مجموعه است و Expectations یک قاتل نزدیکتر است. ست لیست کامل تور Unraveled اولیویا رودریگو را در زیر"}, {"source": "Billboard", "title": "Interscope’s Nicole Wyskoarko & Common Among Black Music Action Coalition Gala Honorees", "link": "https://www.billboard.com/pro/common-patti-labelle-honored-black-music-action-coalition/", "summary": "Patti LaBelle , Common , Public Enemy and label executives Nicole Wyskoarko and Tina Davis were among the esteemed honorees feted at the Black Music Action Coalition’s sixth annual BMAC Gala. Rooted in themes of pride, perseverance and purpose, the fundraiser was presented by Live Nation and hosted by radio personality/entrepreneur Kenny Burns. Joining BMAC co-founder and president/CEO Willie “Prophet” Stiggers in welcoming guests inside the Beverly Hilton ballroom in Beverly Hills were board members Ashaunna K. Ayars , Caron Veazey , Damien Smith , Naima Cochrane , Shawn Holiday and Shay M. Lawson . Related Common Accepts SAG-AFTRA SoundExchange’s Artist Impact Award: ‘Makes Me Feel Like I’ve Got to Do More’ Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction “Tonight is bigger than a gala, we’re gathering at a moment when too much is at stake for us to simply celebrate and go home,” said Stiggers in his opening remarks. “Black music has always been more than music. It has been how we told our story when others tried to write it for us, how we held onto our humanity when this country tried to deny it. We have turned pain into purpose, struggle into sounds and survival into something the entire world would eventually call culture.” BEVERLY HILLS, CALIFORNIA SEPTEMBER 24: Willie “Prophet” Stiggers, CEO President, BMAC attends the 2026 Black Music Action Coalition (BMAC) Gala at The Beverly Hilton on September 24, 2026 in Beverly Hills, California. (Photo by Frazer Harrison/Getty Images) Getty Images The jam-packed evening featured the following award presentations: The BMAC Sylvia Rhone Visionary Award to Interscope Geffen A M president/head of urban A R Nicole Wyskoarko, presented by pioneering music industry executive Rhone BMAC Harry Belafonte Change Agent Award to Common, presented by his mother, Dr. Mahlia Hines BMAC Icon Award to Patti LaBelle, presented by director Lee Daniels BMAC Founders Award to Kevin Shivers , Lee Anderson , Mallory Smith and Marty Diamond of THE·TEAM, presented by Jamea Kollie, participant in the BMAC Music Accelerator Program at Tennessee State University BMAC Social Impact Award to Public Enemy, presented by rapper Big Daddy Kane BMAC Clarence Avant Trailblazer Award to EMPIRE president Tina Davis, presented by singer Montell Jordan BMAC 365 Award to Arielle Vavasseur , Dylan Siegler , Kristin Jones , Markie Ruzzo , Sharlotte Ritchi", "date_str": "2026-09-26T01:38:45+00:00", "hash": "fff5437217eed245", "title_fa": "نیکول ویسکوارکو از Interscope و افتخار آفرینان جشن اکشن اکشن موسیقی مشکیان سیاه پوست", "summary_fa": "Patti Labelle، Common، Public Enemy و مدیران لیبل، Nicole Wyskoarko و Tina Davis از جمله برگزیدگان محترمی بودند که در ششمین جشن سالانه BMAC ائتلاف Black Music Action تجلیل شدند. این گردآوری کمک مالی که ریشه در مضامین غرور، پشتکار و هدف داشت، توسط Live Nation ارائه شد و توسط شخصیت/کارآفرین رادیویی کنی برنز میزبانی شد. اعضای هیئت مدیره Ashaunna K. Ayars، Caron Veazey، Damien Smith، Naima Cochrane، Shawn Holiday و Shay M. Lawson، یکی از بنیانگذاران و رئیس/مدیر عامل BMAC ویلی \"پیامبر\" استیگرز در استقبال از مهمانان داخل سالن رقص بورلی هیلتون در بورلی هیلز بودند. Related Common جایزه Artist Impact SAG-AFTRA SoundExchange را می‌پذیرد: «به من احساس می‌کند که باید بیشتر انجام دهم» بیلبورد برای افزودن آلبوم‌های رسانه هوشمند به عنوان فرمت‌های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را بعد از قتل توپاک شکور انجام می‌دهد. استیگرز در سخنان افتتاحیه خود گفت که ما به سادگی جشن بگیریم و به خانه برگردیم. «موسیقی سیاه همیشه فراتر از موسیقی بوده است. زمانی که دیگران سعی کردند آن را برای ما بنویسند، چگونه داستان خود را گفتیم، زمانی که این کشور سعی کرد آن را انکار کند، چگونه انسانیت خود را حفظ کردیم. ما درد را به هدف، مبارزه را به صداها و بقا را به چیزی تبدیل کرده‌ایم که تمام دنیا در نهایت آن را فرهنگ می‌نامند.» بورلی هیلز، کالیفرنیا 24 سپتامبر: ویلی «پیامبر» استیگرز، مدیر عامل شرکت BMAC در جشن 2026 Black Music Action Coalition (BMAC) در بورلی هیلتون در 24 سپتامبر 2026 در بورلی هیلز، کالیفرنیا شرکت کرد. (عکس از فریزر هریسون/گتی ایماژ) گتی ایماژ این شب پرجمعیت شامل اهدای جوایز زیر بود: جایزه بینایی BMAC Sylvia Rhone به Interscope Geffen A M رئیس/رئیس A R شهری نیکول ویسکوارکو، که توسط مدیر پیشگام صنعت موسیقی، رون BMAC هری کام، مادرش، دکتر Chamon Agent"}, {"source": "Billboard", "title": "Taylor Swift Sets 2026 Single-Day Spotify Record, Thanks to ‘The Life of a Showgirl: The Encore’", "link": "https://www.billboard.com/music/pop/taylor-swift-spotify-record-single-day-patient-zero-1236348113/", "summary": "Clearly, Swifties stuck around for The Encore . On Friday (Sept. 25), Spotify announced that Taylor Swift became the most-streamed female artist in a single day in 2026 on the platform thanks in part to her four new bonus tracks released on The Life of a Showgirl: The Encore . In addition, Patient Zero the focus track of the new quartet of songs became Spotify s most-streamed song by a female artist in a single day this year so far. Related All 4 New Songs on Taylor Swift s The Life of a Showgirl: The Encore Ranked What Are the New Songs on Taylor Swift s The Life of a Showgirl: The Encore About? Taylor Swift s The Life of a Showgirl Retakes the Stage With Encore Deluxe: Stream It Now Spotify announced the news Friday evening via social media. On September 25th, Patient Zero became Spotify’s most-streamed song by a female artist in a single day in 2026 so far, and Taylor Swift became the most-streamed female artist in a single day this year, reads the Instagram caption. View this post on Instagram In addition to “Patient Zero,” the extended Showgirl project also adds “Babylon,” “Pink Clouding” and “Cleveland!” to the original set which is no stranger to setting records. The Life of a Showgirl spent 12 weeks at No. 1 on the Billboard 200 last year and opened with a record-shattering 4.002 million equivalent album units in the United States in its first week. Now, Swifties are waiting until Sunday s (Sept. 27) MTV Video Music Awards, as the pop star is planning to premiere a cinematic music video for “Patient Zero” during the ceremony. In the meantime, she’s released a teaser revealing that Colin Farrell and Dakota Johnson co-star in the visual, which she directed. Swift will receive the inaugural Artist Director Honors at the 2026 VMAs .", "date_str": "2026-09-26T00:04:51+00:00", "hash": "c695423413ba7ea3", "title_fa": "تیلور سوئیفت به لطف «زندگی یک دختر نمایشگر: The Encore» رکورد یک روزه Spotify در سال 2026 را به نام خود ثبت کرد.", "summary_fa": "واضح است که Swifties برای The Encore گیر کرده است. روز جمعه (25 سپتامبر)، اسپاتیفای اعلام کرد که تیلور سوئیفت به لطف چهار آهنگ جایزه جدیدش که در The Life of a Showgirl: The Encore منتشر شد، در سال 2026 تبدیل به پرطرفدارترین هنرمند زن در یک روز در سال 2026 شد. علاوه بر این، Patient Zero قطعه تمرکز کوارتت جدید آهنگ‌ها، امسال تا کنون در یک روز به پر پخش‌ترین آهنگ Spotify توسط یک هنرمند زن تبدیل شده است. مرتبط هر 4 آهنگ جدید تیلور سوئیفت The Life of a Showgirl: The Encore Ranked آهنگ های جدید Taylor Swifts The Life of a Showgirl: The Encore درباره dline", "title": "Melissa Barrera Would Reprise ‘Scream’ Role If Rights “Leave” Spyglass: “I Love The Franchise”", "link": "https://deadline.com/2026/09/melissa-barrera-would-return-scream-if-rights-leave-spyglass-1237114182/", "summary": "Although she was unceremoniously fired from the franchise three years ago, Melissa Barrera remains a Scream fan. The actress, who was fired for supporting Free Palestine in 2023, recently explained that her issue is with Spyglass Media Group, whose leadership never apologized for accusing her of antisemitism over her response to the Oct. 7 Hamas [ ]", "date_str": "2026-09-25T22:35:00+00:00", "hash": "5ff4529dbcc00b1e", "title_fa": "ملیسا باررا نقش «فریاد» را دوباره بازی می‌کند اگر حقوق «ترک» کند Spyglass: «I Love The Franchise»", "summary_fa": "اگرچه او سه سال پیش بدون تشریفات از این فرنچایز اخراج شد، ملیسا باررا همچنان از طرفداران Scream است. این بازیگر که به دلیل حمایت از فلسطین آزاد در سال 2023 اخراج شد، اخیراً توضیح داد که مشکل او با گروه رسانه ای Spyglass است، که رهبری آن هرگز به خاطر متهم کردن او به یهودی ستیزی به دلیل پاسخ او به حماس در 7 اکتبر [ ] عذرخواهی نکردند. من فرنچایز را دوست دارم. برای ساخت آن فیلم ها لحظات شگفت انگیزی را سپری کردم. اما بسیاری از نفرت‌ها و مشکلاتی که در سال‌های گذشته با آن روبه‌رو بوده‌ام، به این دلیل است که رهبری آن شرکت به من برچسبی زد که من نیستم، و آنها هرگز عذرخواهی نکردند، حتی زمانی که حق من ثابت شد. باررا ادامه داد، حتی با عذرخواهی، دیگر نمی توانم با آنها کار کنم. پس نه اینکه نفسم حبس بشه من فکر نمی کنم آنها چنین توانایی را داشته باشند. اما اگر فرنچایز روزی این دست‌ها را رها کند و به دست‌هایی برود که فکر می‌کنم به میراث وس کریون بیشتر احترام بگذارد، فکر می‌کنم بله. Watch on Deadline Spyglass باررا را در نوامبر 2023 به دلیل پست‌هایش در رسانه‌های اجتماعی درباره درگیری اسرائیل و حماس و جنایاتی که علیه فلسطینی‌ها مرتکب شده بود، اخراج کرد، و این شرکت توضیح داد که آنها نسبت به یهودی‌ستیزی یا تحریک نفرت به هر شکلی، از جمله ارجاعات نادرست به نسل‌کشی، هر چیزی که پاک‌سازی نژادپرستانه را به هولوک می‌کشد، تحمل صفر دارند. پس از برکناری او، جنا اورتگا نیز از این فرنچایز خارج شد، و بعداً اشاره کرد که دنباله آن بدون حضور باررا برای ایفای نقش آخرین دختر جدیدش، سم کارپنتر، به نوعی در حال فروپاشی بود. کارگردان کریستوفر لاندون نیز با اشاره به تهدیدهای مرگبار بسیار تهاجمی و واقعاً ترسناکی که فرزندانش را هدف"}, {"source": "Deadline", "title": "Paramount To Move Its Class B Shares From Nasdaq To New York Stock Exchange In Early October", "link": "https://deadline.com/2026/09/paramount-moves-class-b-shares-nasdaq-new-york-stock-exchange-1237114159/", "summary": "Paramount said Friday it plans to start moving the listing of its Class B shares from the Nasdaq to the New York Stock Exchange in early October. Noting the still-pending $110 billion merger with Warner Bros Discovery as a key variable, the company said in an SEC filing that the date of the shift could [ ]", "date_str": "2026-09-25T22:27:01+00:00", "hash": "d4d05643beab695b", "title_fa": "پارامونت در اوایل اکتبر سهام کلاس B خود را از نزدک به بورس نیویورک منتقل می کند.", "summary_fa": "پارامونت روز جمعه اعلام کرد که قصد دارد در اوایل اکتبر، عرضه سهام کلاس B خود را از نزدک به بورس نیویورک آغاز کند. این شرکت با اشاره به ادغام 110 میلیارد دلاری معلق با Warner Bros Discovery به عنوان یک متغیر کلیدی، در پرونده SEC گفت که تاریخ تغییر [ ] می تواند [ ] مدیر عامل، دیوید الیسون، پس از توافقات قانونی با دادستان کل ایالت و انجمن نویسندگان آمریکا، به کارمندان بگوید که ادغام تقریباً دو هفته از آن تاریخ به پایان رسیده است. اگر این جدول زمانی پابرجا بماند، در 5 اکتبر بسته می شود. در ددلاین تماشا کنید هم نزدک و هم NYSE فهرست‌های رسانه‌ای و سرگرمی دارند. نزدک مدت‌هاست که بیشتر به سمت شرکت‌های فناوری از جمله نتفلیکس اهمیت می‌داد. سهام شرکت والت دیزنی از جمله سهام هایی است که در بورس نیویورک معامله می شود. تغییر صرافی توسط شرکت ها غیر معمول نیست. مرتبط: دشمنان ParaBros از دادگاه می‌خواهند در پرونده‌های نیمه‌شب تسویه حساب را رد کند: این ادغام رقابت را کاهش می‌دهد یک قاضی فدرال قرار است روز دوشنبه ریاست جلسه‌ای را برای بررسی توافق‌نامه و استماع طرف‌های دعوی برعهده داشته باشد، در حالی که جلسه از تاریخ اولیه آن در پنجشنبه این هفته به تعویق افتاد. ائتلاف Block the Merger و دیگر مخالفان توافق نامه‌های دوستانه ارسال کرده‌اند و اعتراضات خود را تکرار کرده‌اند. قاضی می تواند شرایط توافق را تغییر دهد یا حتی آن را به طور کامل رد کند، اگرچه موارد دومی نادر بوده است. اگر معامله تا اول اکتبر بسته نشود، پارامونت موافقت کرده است که روزانه 7 میلیون دلار به سهامداران WBD پرداخت کند. این کارمزد شیرین کننده ای بود که اوایل امسال داوطلبانه به عنوان راهی برای پیشی گرفتن از نتفلیکس در تعقیب WBD ارائه کرد."}, {"source": "Netflix NL", "title": "Filmkraker met sterrencast gaat door het dak op Netflix", "link": "https://www.netflix-nederland.nl/filmkraker-met-sterrencast-gaat-door-het-dak-op-netflix/", "summary": "Jij bent op zoek naar iets om dit weekend te kijken. Het liefst een film en geen hele serie. Nou: dan weet je nu wat je te doen staat, zet UNABOMBER vanavond of morgenavond nog op! Doe het! Want de film staat gelijk op de eerste plaats in de Netflix Film Top-10 en dat is niet zomaar. UNABOMBER gaat door het dak op Netflix UNABOMBER is een waargebeurde misdaadthriller van Netflix over het leven van Ted Kaczynski, de terrorist die tussen 1978 en 1995 verantwoordelijk was voor een reeks bomaanslagen in de Verenigde Staten. De film is sinds gisteren te zien op Netflix! Het verhaal begint wanneer de jonge, uitzonderlijk begaafde Ted Kaczynski op slechts zestienjarige leeftijd wordt toegelaten tot Harvard University. Daar komt hij terecht bij professor Henry Murray, die hem onderwerpt aan controversiële psychologische experimenten. Terwijl Ted worstelt met een groeiend gevoel van vervreemding, eenzaamheid en wantrouwen tegenover de maatschappij, raakt hij steeds verder geïsoleerd. Jaren later trekt hij zich terug in een afgelegen hut in de bossen van Montana, waar zijn frustratie over technologie en de moderne samenleving omslaat in geweld. Twee tijdlijnen De film wisselt voortdurend tussen twee tijdlijnen. Aan de ene kant zie je hoe Kaczynski langzaam verandert van een briljante wiskundige in de beruchte Unabomber, die bijna twintig jaar lang bompakketten verstuurt naar onder meer wetenschappers en luchtvaartmaatschappijen. Aan de andere kant volgt de film de intensieve zoektocht van de FBI, geleid door agente Joanne Miller, die alles op alles zet om de mysterieuze dader te identificeren voordat er opnieuw slachtoffers vallen. Zoals je in de kop van dit stuk hebt kunnen lezen, beschikt UNABOMBER dus over een sterrencast. Jacob Tremblay is te zien als Ted Kaczynski, Russell Crowe als professor Henry Murray en Shailene Woodley als FBI-agente Joanne Miller. Dat klinkt als een recept voor succes en dat is het dus ook, want de film gaat al behoorlijk door het dak op Netflix. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Filmkraker met sterrencast gaat door het dak op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-26T12:52:48+00:00", "hash": "17df79a8366722d9", "title_fa": "فیلم پرفروش با بازیگران ستاره از پشت بام نتفلیکس می گذرد", "summary_fa": "شما به دنبال چیزی برای تماشای این آخر هفته هستید. ترجیحا یک فیلم و نه یک سریال کامل. خوب: حالا می دانید چه کاری باید انجام دهید، UNABOMBER را امشب یا فردا شب بپوشید! انجامش بده زیرا این فیلم بلافاصله در رتبه اول 10 فیلم برتر نتفلیکس قرار می گیرد و این اتفاقی نیست. UNABOMBER در نتفلیکس از پشت بام عبور می کند UNABOMBER یک تریلر جنایی واقعی از نتفلیکس درباره زندگی تد کاچینسکی، تروریست مسئول یک سری بمب گذاری در ایالات متحده بین سال های 1978 تا 1995 است. این فیلم از دیروز در نتفلیکس قابل مشاهده است! داستان از آنجا شروع می شود که تد کاچینسکی جوان و با استعداد استثنایی تنها در شانزده سالگی در دانشگاه هاروارد پذیرفته می شود. در آنجا او به پروفسور هنری موری می رسد که او را تحت آزمایش های روانشناختی بحث برانگیز قرار می دهد. همانطور که تد با احساس بیگانگی، تنهایی و بی اعتمادی رو به رشد جامعه دست و پنجه نرم می کند، به طور فزاینده ای منزوی می شود. سال‌ها بعد، او به یک کابین دورافتاده در جنگل‌های مونتانا عقب‌نشینی می‌کند، جایی که ناامیدی او از تکنولوژی و جامعه مدرن به خشونت تبدیل می‌شود. دو خط زمانی فیلم دائماً بین دو خط زمانی جابه‌جا می‌شود. از یک طرف می بینید که چگونه کاچینسکی به آرامی از یک ریاضیدان زبردست به Unabomber بدنام تبدیل می شود که تقریباً بیست سال است بسته های بمب را برای دانشمندان و شرکت های هواپیمایی ارسال می کند. از سوی دیگر، این فیلم به دنبال جستجوی فشرده اف‌بی‌آی به رهبری مامور جوآن میلر است که هر کاری می‌تواند برای شناسایی عامل مرموز قبل از اینکه قربانیان بیشتری وجود داشته باشد، انجام می‌دهد. همانطور که ممکن است در تیتر این قطعه خوانده باشید، UNABOMBER یک بازیگر ستاره دارد. جیکوب ترمبلی در نقش تد کاچینسکی،"}, {"source": "Netflix NL", "title": "Spaans moordmysterie gaat als de brandweer op Netflix", "link": "https://www.netflix-nederland.nl/spaans-moordmysterie-gaat-als-de-brandweer-op-netflix/", "summary": "Geniet jij ook zo van zogenaamde whodunits ? Waarbij je als kijker een bepaald moordmysterie op moet lossen? Dan hebben we goed nieuws voor je, want er staat nu een whodunit op Netflix die het ook nog eens goed doet! El Problema Final We hebben het hier over El Problema Final (vrij vertaald het laatste probleem ), dat sinds gisteren te bekijken is op Netflix. En dat laten de abonnees van de streamingdienst zich bepaald geen twee keer zeggen, er wordt al massaal ingeschakeld op deze nieuwe serie. El Problema Final (The Final Problem in het Engels) is een Spaanse mysterie-thrillerserie van Netflix, gebaseerd op de gelijknamige bestseller van Arturo Pérez-Reverte (3,63 sterren op Goodreads op basis van 11.575 beoordelingen). De miniserie speelt zich af in het voorjaar van 1959 en combineert een klassieke whodunit met een sfeervolle historische setting. Dertien mensen in een zware storm Het verhaal begint wanneer dertien mensen door een zware storm vast komen te zitten in een afgelegen hotel op een klein eiland voor de kust van Mallorca. Wanneer de Engelse toeriste Elisa Mander dood wordt aangetroffen, lijkt het in eerste instantie om zelfmoord te gaan, maar al snel wordt duidelijk dat er sprake is van moord. Omdat niemand het eiland kan verlaten of bereiken, is iedere gast én elk personeelslid een verdachte. De hoofdrol is voor Basil, een gepensioneerde acteur die ooit Sherlock Holmes speelde op het witte doek. Hoewel hij geen echte detective is, besluit hij samen met de jonge thrillerschrijver Foxá de moord op te lossen. Terwijl de spanning oploopt, ontrafelen ze een steeds meer geheimen en ontdekken ze allerlei verborgen motieven. Volgens Netflix zelf heeft het allemaal wel wat weg van Sherlock Holmes én van de detectiveverhalen van Agatha Christie. Dat klinkt natuurlijk top! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Spaans moordmysterie gaat als de brandweer op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-26T12:49:24+00:00", "hash": "ffdec0849e92b269", "title_fa": "معمای قتل اسپانیایی مانند آتش نشانی در نتفلیکس پیش می رود", "summary_fa": "آیا شما هم از به اصطلاح whodunit لذت می برید؟ کجا به عنوان یک بیننده باید معمای قتل خاصی را حل کنید؟ سپس ما خبرهای خوبی برای شما داریم، زیرا اکنون یک Whodunit در نتفلیکس وجود دارد که همچنین به خوبی کار می کند! El Problema Final ما در مورد El Problema Final صحبت می کنیم (که به صورت ضعیف به عنوان آخرین مشکل ترجمه شده است) که از دیروز در نتفلیکس در دسترس است. و مشترکین سرویس استریم مطمئناً اجازه نخواهند داد که دو بار گفته شود، در حال حاضر علاقه زیادی به این سری جدید وجود دارد. El Problema Final (مشکل نهایی به زبان انگلیسی) یک سریال مهیج و رازآلود اسپانیایی از نتفلیکس است که بر اساس پرفروش‌ترین اثر آرتورو پرز-رورت (3.63 ستاره در گودریدز بر اساس 11575 نقد) به همین نام ساخته شده است. این مینی سریال در بهار سال 1959 اتفاق می‌افتد و یک سریال کلاسیک را با یک فضای تاریخی اتمسفری ترکیب می‌کند. سیزده نفر در یک طوفان شدید داستان از آنجا شروع می شود که سیزده نفر در یک هتل دورافتاده در جزیره کوچکی در سواحل مایورکا به دلیل طوفان شدید گرفتار می شوند. وقتی جسد الیزا مندر، توریست انگلیسی پیدا می‌شود، در ابتدا به نظر می‌رسد خودکشی بوده است، اما به زودی مشخص می‌شود که قتل بوده است. از آنجا که هیچ کس نمی تواند جزیره را ترک کند یا به آن برسد، هر مهمان و هر کارمند مظنون هستند. نقش اصلی را باسیل، بازیگر بازنشسته ای بازی می کند که زمانی نقش شرلوک هلمز را در صفحه نقره ای بازی می کرد. اگرچه او یک کارآگاه واقعی نیست، اما تصمیم می گیرد به همراه نویسنده جوان فیلم هیجان انگیز فاکسا قتل را حل کند. با افزایش تنش، آنها رازهای بیشتری را کشف می کنند و انواع انگیزه های پنهان را کشف می"}, {"source": "Netflix NL", "title": "Nieuwe Franse rechtbankthriller op Netflix", "link": "https://www.netflix-nederland.nl/nieuwe-franse-rechtbankthriller-op-netflix/", "summary": "Word je aangeklaagd en moet je voor de rechter verschijnen, dan neem je natuurlijk een goede advocaat in de arm. En in Frankrijk zou je Un Bon Avocat inschakelen. Hé, dat is de titel van een nieuwe thriller op Netflix! Un Bon Avocat Un Bon Avocat (in het Engels: The Good Lawyer) is een Franse juridische thrillerfilm over Léonard Landry (Laurent Lafitte), een briljante en flamboyante strafrechtadvocaat die een dubbelleven leidt. Door zijn werk komt hij regelmatig in aanraking met drugscriminelen en raakt hij zelf verslaafd aan cocaïne. Tijdens een pleidooi in de rechtszaal gaat het volledig mis: Léonard krijgt voor de ogen van iedereen een overdosis. Na een periode in een afkickkliniek probeert hij zijn leven en carrière weer op de rails te krijgen. Daarvoor krijgt hij nauwelijks tijd: hij heeft slechts één week om zijn eigen rechtszaak voor te bereiden en te voorkomen dat zijn carrière definitief voorbij is. Tegelijkertijd moet hij ook een bijzonder zware zaak behandelen. Hij verdedigt een groot industrieel concern dat ervan wordt beschuldigd banden te hebben met een terroristische organisatie in Afrika. Léonard krijgt daarbij hulp van Noé (Anthony Bajon), een jonge en vasthoudende stagiair die hij aanvankelijk helemaal niet aan zijn zijde wil hebben. Terwijl د (و وسوسه های جدید) مقابله کند، در حالی که هم شهرت و هم آینده او به عنوان یک وکیل در تعادل است. چه زمانی Un Bon Avocat در نتفلیکس خواهد بود؟ کارگردانی این فیلم بر عهده Tristan Séguéla (Tapie) است و ملانی لوران و کارول بوکه نیز در آن حضور دارند. Un Bon Avocat در تاریخ 9 نوامبر در نتفلیکس منتشر خواهد شد و در زمان نگارش این مقاله هنوز تریلر یا"}, {"source": "Netflix NL", "title": "Dit wordt het vijfde monster (in Monster seizoen 5)", "link": "https://www.netflix-nederland.nl/dit-wordt-het-vijfde-monster-in-monster-seizoen-5/", "summary": "Monster seizoen 4 (Monster: The Lizzie Borden Story) staat nu al even op Netflix én is weer een doorslaand succes. Dat betekent natuurlijk dat er ook een vijfde seizoen komt, over een nieuw monster . Monster nummer vijf: John Wayne Gacy Inmiddels heeft Monster Lizzie Borden, Ed Gein, de Menendez-broers en Jeffrey Dahmer behandeld, maar gelukkig (dat woord heeft wel een dubbele lading) zijn er nog genoeg seriemoordenaars over voor nieuwe verhalen. Monster: The Lizzie Borden Story heeft in één week tijd 12,1 miljoen views verzameld, wat de kans dus groot maakt dat Ryan Murphy (de maker van de franchise) groen licht krijgt voor een nieuw seizoen. En het heeft er alle schijn van dat we al weten over wie dat nieuwe seizoen gaat. Er doen namelijk hardnekkige geruchten dat Monster seizoen 5 het verhaal van John Wayne Gacy zal vertellen, de zogenaamde Killer Clown . Over hem heeft Netflix al een keer een documentaire (Conversations with a Killer: The John Wayne Gacy Tapes) gemaakt, maar volgens het geruchtencircuit is hij dus óók monster nummer vijf. Het waargebeurde verhaal John Wayne Gacy (1942–1994) was een Amerikaanse seriemoordenaar die in de jaren zeventig actief was in de omgeving van Chicago. Hij werd veroordeeld voor de moord op 33 jongens en jonge mannen, van wie een groot deel werd teruggevonden onder en rond zijn woning. Gacy leidde naar buiten toe een relatief normaal leven als ondernemer en was actief binnen zijn lokale gemeens ine Explains Why He’s Retiring: ‘I Live Every Day Like It’s My Last’", "link": "https://www.rollingstone.com/music/music-news/megadeth-dave-mustaine-in-my-darkest-hour-book-launch-video-1235627256/", "summary": "At the New York book launch for his memoir, In My Darkest Hour , artist was candid with fans about the thrash group’s future", "date_str": "2026-09-26T14:00:00+00:00", "hash": "9b60a54dd55ed6cb", "title_fa": "دیو ماستین از Megadeth دلیل بازنشستگی خود را توضیح می دهد: \"من هر روز طوری زندگی می کنم که انگار آخرین روز من است\"", "summary_fa": "در مراسم رونمایی کتاب در نیویورک برای خاطراتش، در تاریک ترین ساعت، هنرمند با طرفداران درباره آینده گروه ترش صریح بود، دیو ماستین به طور فیزیکی به طرفداران نشان داد که چرا مگادث آن را کنار می گذارد، در مراسم رونمایی از کتاب خاطراتش، در تاریک ترین ساعت من، اوایل ماه جاری در نیویورک. زمانی که ناظم، کوری گرو، نویسنده ارشد رولینگ استون، از او پرسید که آیا طرفدارانش باید او را باور کنند وقتی می‌گوید گروهش آن را ترک می‌کند، ماستین دست چپش را بالا گرفت تا تماشاگران ببینند. من از ناحیه دستم آسیب دیدم، او به حدود 200 نفر در مرکز موسیقی کافمن نیویورک نشان داد. برخی از شما می توانید آن را ببینید. من چیزی به نام انقباض دوپویترن دارم. در وسط دستم، تاندون ها با هم رشد کرده اند و انگشتم را پایین می کشند. بنابراین من در برخی مواقع این گزینه را دارم که عمل جراحی را انجام دهم، و فکر کردم که این تور را انجام دهم و از این رکورد پشتیبانی کنم و در آن نقطه، خواهیم دید که فناوری چگونه است. به این فکر می کنم که آیا می توانم ادامه بدهم اگر فقط بخوانم؟ من نمی خواهم این کار را انجام دهم. من می خواهم گیتار بزنم، زیرا این عشق من است. در آگوست 2025، Mustaine اعلام کرد که گروه thrash طولانی مدت زمانی پس از انتشار Megadeth بازنشسته خواهد شد. او نوشت: اگر زمان مناسبی برای گردش در جهان وجود داشت، اکنون است. همچنین این زمان مناسبی است تا به شما بگوییم این آخرین آلبوم استودیویی ماست. هنگامی که در ژانویه منتشر شد، در شماره یک بیلبورد 200 به نمایش درآمد. وقتی گرو در مراسم رونمایی از کتاب از ماستین پرسید که این دستاورد چه احساسی در او ایجاد می کند، ماستین میکروفون خود را در قسمت فاق او گذاشت"}, {"source": "Rolling Stone", "title": "Peter Gabriel Confronts Death on New Song ‘Face the Wall’", "link": "https://www.rollingstone.com/music/music-news/peter-gabriel-new-song-face-the-wall-1235632295/", "summary": "A new full moon brings the latest offering from singer's upcoming album o\\i", "date_str": "2026-09-26T13:34:03+00:00", "hash": "b34c3ec9be62fad9", "title_fa": "مواجهه پیتر گابریل با مرگ در آهنگ جدید Face the Wall", "summary_fa": "یک ماه کامل جدید جدیدترین پیشنهاد از آلبوم آینده خواننده o\\i را ارائه می دهد. پیتر گابریل در آهنگ جدید خود Face the Wall، آخرین آهنگ استودیو آینده خواننده LP o\\i، با مرگ اجتناب ناپذیر روبرو می شود. مانند تمام آهنگ های قبلی از o/i و سلف آن، آلبوم 2023 گابریل i/o آهنگ با هر دو میکس سمت روشن و میکس سمت تاریک ضبط شد. به طور مناسب، برای آهنگی درباره مردن، گابریل میکس تاریکی از Face the Wall ساخته‌ی تچاد بلیک را ارائه کرده است: غزل تا حدی درباره پیر شدن، مواجهه با بیماری است، و به مرگ در چهره نگاه می‌کند، که فکر می‌کنم ما به اندازه کافی این کار را انجام نمی‌دهیم. می‌دانم که قبلاً در مورد این موضوع صحبت کرده‌ام، اما فرهنگ‌هایی که به نظر می‌رسد مرگ را به عنوان بخشی عادی از زندگی در بر می‌گیرند، با آن راحت‌تر به نظر می‌رسند و زندگی را به طور کامل زندگی می‌کنند. جبرئیل در بیانیه ای گفت که این نقطه شروع بود. موسیقی برای بسیاری از ما یک فرآیند کاتارتیک است و وقتی من در پایان می خوانم، می بینم که شما در حال عبور از آن هستید، این یک لحظه کاتارتیک است. من فکر می کنم این یک خط مهم است. با پیشرفت آهنگ، شرایط بدتر و شدیدتر می‌شود، اما با آن شعر، دلیلی برای امیدوار بودن وجود دارد. وقتی در استودیو هستید، هرگز نمی دانید که آیا آهنگ وسیله نقلیه ای است که می تواند مردم را حمل کند یا خیر. من می دانم که این قرار است با برخی افراد صحبت کند. این آهنگ با عکسی از تاداشی کاواماتا به نام The Nest همراه بود. آموس رکس، مجسمه‌ای که در آن بهمنی از صندلی‌های چوبی از ساختمانی پایین می‌آید و به سمت راه پله‌ای با قرارگیری عجیب می‌رود. قبل از دیدن این تصویر از"}, {"source": "Rolling Stone", "title": "Lawrence Rothman Wants to Break Free From Music’s Ones and Zeroes", "link": "https://www.rollingstone.com/music/music-features/lawrence-rothman-interview-here-lies-love-1235632050/", "summary": "The songwriter celebrates human interaction on new album Here Lies Love / Sawdust to Stardust . \"Now is the biggest time in human history for artists to perform live,\" they say", "date_str": "2026-09-26T13:30:00+00:00", "hash": "af7f05c246294e5f", "title_fa": "لارنس روتمن می خواهد از یک ها و صفرهای موسیقی رهایی یابد", "summary_fa": "ترانه سرا تعامل انسانی را در آلبوم جدید Here Lies Love / Sawdust to Stardust جشن می گیرد. آنها می گویند: «اکنون بزرگترین زمان در تاریخ بشریت است که هنرمندان به اجرای زنده می پردازند. اما هر چه مدت زمان بیشتری را در فضاهای آمریکایی گذرانده باشند، چه در پروژه های خود و چه برای تولید برای امثال آماندا شایر یا مگی رز، روتمن بیشتر می آید. روتمن می‌گوید: «آمریکنا» برای من، در سال 2026، هر چیزی است که با موسیقی عالی آمریکایی مرتبط است، همه در یک توپ قرار می‌گیرند. این روح است، آر بی، خواننده-ترانه سرا، فولکلور، کانتری، راک. شما حتی کمی پانک راک هم دارید. برای من، این مکان برای شناسایی با روشی است که خلق می کنم. انگیزه‌های خلاقانه Rothman به Here Lies Love / Sawdust to Stardust تبدیل شد، LP 13 آهنگی آنها که در روز جمعه از طریق KRO Records منتشر شد. این فیلم دنباله‌ای از گاوآهن که دشت‌ها را شکست در سال 2024 است و سه‌گانه‌ای را تکمیل می‌کند که با صبح بخیر، آمریکا در سال 2021 آغاز شد. روتمن مدت کوتاهی پس از انتقال به نشویل در طول همه‌گیری و ارتباط با صحنه آمریکاییانا، این ایده را تصور کرد. در یک بعدازظهر غم انگیز اواخر تابستان در جریان Americanafest در نشویل، روتمن در پاسیو رستوران Brown s Diner نشست در حالی که جرمی آیوی در حال سرناد کردن جمعیتی در داخل آن بود و با بلندگوهای پاسیو بازی می کرد و توضیح می داد که چگونه این پروژه به نمایش درآمد. روتمن به رولینگ استون می‌گوید: من همیشه در سه‌گانه‌ها اهمیت زیادی داشته‌ام. هنری میلر، یکی از نویسندگان مورد علاقه من در تمام دوران، این مجموعه را داشت به نام Sexus, Plexus, and Nexus [سه گانه صلیب گلگون میلر]، و این مانند اولین چیزی بود که من در نوجوانی خواندم. من شاید"}, {"source": "Rolling Stone", "title": "What Some Folks Really Mean When They Claim to Have Never Heard ‘Choosin’ Texas’", "link": "https://www.rollingstone.com/music/music-country/ella-langley-choosin-texas-never-heard-the-song-meaning-1235631932/", "summary": "Proclaiming you're unfamiliar with Ella Langley's record-setting song has a lot in common with saying \"I listen to anything but country\"", "date_str": "2026-09-26T13:00:00+00:00", "hash": "a55cd9f05eb038d5", "title_fa": "وقتی برخی از مردم ادعا می کنند هرگز «انتخاب» تگزاس را نشنیده اند واقعاً چه معنایی دارند.", "summary_fa": "اعلام ناآشنا بودن شما با آهنگ ضبط الا لنگلی با گفتن «من به هر چیزی گوش می‌دهم به جز کشور» شباهت زیادی دارد، این احساس به یک جملات رایج تبدیل شد زیرا آهنگ کانتری موفق الا لنگلی در تمام تابستان در صدر 100 بیلبورد Hot 100 قرار گرفت و در نهایت از ماریا کری گذشت و رکورد طولانی‌ترین شماره یک در آن چارت را به نام خود ثبت کرد. حتی گربه دوجا ادعا کرد که در تاریکی است. وقتی از لنگلی پرسیده شد، نمی‌دانم این چیست. علیرغم آنچه که برای برخی همه جا به نظر می رسد، دیگران همچنان اصرار دارند که اصلا Choosin Texas را نشنیده اند. و اگر آنها در رسانه های اجتماعی باشند، مطمئناً به شما اطلاع می دهند. مثل همیشه توضیحات منطقی برای چنین پدیده ای وجود دارد. در عصر الگوریتم محور ما، طراحی دنیایی کاملاً ممکن است که در آن هرگز با Choosin Texas روبرو نشوید: با محتوای کشور درگیر نمی‌شوید، به فهرست‌های پخش کشور گوش نمی‌دهید، حتی وقتی وارد یک کافی‌شاپ می‌شوید، هدفون‌های گوش خود را در نمی‌آورید. دوران ضربه رادیویی تک کشت گذشته است. تجارب مشترک بسیار اندک است. این فقدان تک‌کشت بخشی از دلیلی است که چرا برخی از اعلام کردن Choosin Texas به عنوان آهنگ تابستانی خودداری کردند، در حالی که مشخص بود رقابت قابل قبولی وجود ندارد (حداقل از نظر نمودار). همه ما تابستان‌های متفاوتی را در زمان‌های موازی زندگی می‌کنیم و رسانه‌های اجتماعی فقط آنچه را که می‌خواهیم بشنویم و ببینیم به ما بازخورد می‌دهند. اگر دوست دارید در سیلو زندگی کنید، اجاره رایگان است. با این حال، در این مرحله، اگر کسی ادعا کند که حتی نام Choosin     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
