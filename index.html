ه ما نزدیک‌تر است، اما متأسفانه همچنان درگیر دعواهای بین‌بخشی دستگاه‌ها هستیم و خود را به خواب زده‌ایم». به گفته دلبری «هزینه مراقب شبانه‌روزی در منزل در شهری مانند تهران حداقل ۴۰ میلیون تومان در ماه و هزینه نگهداری در مراکز آسایشگاهی از ۵۰ تا ۱۷۰ میلیون تومان متغیر است. در شرایط اقتصادی فعلی، پرداخت چنین مبالغی از توان غالب خانواده‌ها خارج است». بحران ساختارهای مالی، صندوق‌های بازنشستگی و هزینه‌های مراقبت احمد دلبری در توصیف روند سالمندی به مقایسه ایران و کشورهای اروپایی پرداخته، گفته است: «سرعت پیری جمعیت در ایران برعکس سایر کشورها، فوق‌العاده سریع است. دو برابر شدن سهم سالمندان در فرانسه ۱۲۴ سال، در سوئد ۹۰ سال و در انگلستان ۷۵ سال طول کشید؛ در حالی که این شاخص در ایران طی کمتر از ۲۰ سال دو برابر خواهد شد و ما فرصت و زمان کافی برای رویارویی با آن را نداریم». او با تاکید بر این که «نسل دهه ۱۳۶۰ که در کودکی با مدارس چندشیفته و در جوانی با مشکلات اشتغال و مسکن روبرو بودند و به زودی وارد پیری می‌شوند» توضیح داده‌است: «اگر از امروز پتانسیل کشور برای پاسخگویی به نیازهای آنان آماده نشود، با فاجعه روبرو خواهیم شد». دلبری با اشاره به ورشکستگی صندوق‌های بازنشستگی به تشریح مشکلات پیش روی بازنشستگان پرداخته، افزوده‌است: «در حالت استاندارد و مطلوب، ضریب پشتیبانی صندوق‌های بازنشستگی باید حداقل ۵ به ۱ باشد؛ یعنی به ازای هر ۵ کارمند", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B1_JYED__v1024x512__box_0%2C48%2C1279%2C720.jpeg", "category": "موسیقی و هنر", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۷ آبان • ۱۹:۵۵"}, {"source": "BBC Persian", "title": "استقبال گرم شی از ترامپ و خوش‌‌وبش رئیس‌جمهور آمریکا با پوتین", "link": "https://www.bbc.com/persian/articles/cmx27peej4vwo?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ و ولادیمیر پوتین پس از بیش از یک سال دیدار کردند درحالی‌که برای مذاکرات مهم و تاریخی در چین با حضور شی جین‌پینگ آماده می‌شوند.", "date_str": "2026-11-18T16:44:44+00:00", "hash": "59691eb3123cdd48", "title_fa": "استقبال گرم شی از ترامپ و خوش‌‌وبش رئیس‌جمهور آمریکا با پوتین", "summary_fa": "دونالد ترامپ و ولادیمیر پوتین پس از بیش از یک سال دیدار کردند درحالی‌که برای مذاکرات مهم و تاریخی در چین با حضور شی جین‌پینگ آماده می‌شوند. رهبر چین از رئیس‌جمهور آمریکا هنگام ورود به شهر شنژن برای شرکت در نشست رهبران آسیا و اقیانوسیه (اپک) در پای هواپیما استقبال کرد. دست دادن و در آغوش گرفتن دو رئیس‌جمهور در باند فرودگاه با دقت طراحی شده بود و از آقای ترامپ استقبال گرمی شد. رئیس‌جمهور آمریکا بعدتر در محل کنفرانس و مراسم خوشامدگویی رسمی به رهبران با آقای پوتین نیز دست داد و خوش‌وبش و تبادل تعارف کرد. انتظار می‌رود دونالد ترامپ و ولادیمیر پوتین روز پنجشنبه در حاشیه این نشست، مذاکرات دوجانبه‌ای برگزار کنند که جنگ اوکراین از موضوعات گفت‌وگو است. با این حال، تمرکز اصلی در جریان مجمع همکاری اقتصادی آسیا و اقیانوسیه، بر مذاکرات آمریکا، چین و روسیه در روز پنجشنبه خواهد بود؛ مذاکراتی که نخستین دیدار حضوری این سه رهبر محسوب می‌شود. برنامه کامل مذاکرات هنوزمنتشر نشده اما اشاره‌های مختلفی به موضوعات احتمالی شده است از جمله جنگ‌های اوکراین و ایران، تسلیحات هسته‌ای، تنش‌های تجاری و تحولات حوزه هوش مصنوعی. این نخستین دیدار حضوری آقای ترامپ و آقای پوتین از اوت ۲۰۲۵ بود که رهبر روسیه به آلاسکا سفر کرد اما مذاکراتش با رئیس‌جمهور آمریکا درباره جنگ اوکراین به جایی نرسید. استقبال شخصی آقای شی از دونالد ترامپ در فرودگاه، اقدامی ویژه بود. در سفر قبلی اقای ترامپ به چین در ۲۳ اردیبهشت ۱۴۰۵، معاون آقای شی در فرودگاه به استقبال آقای ترامپ رفت. اما وقتی حدود چهار ماه بعد شی جین‌پینگ به آمریکا سفر کرد، آقای ترامپ در فرودگاه به استقبالش رفت. این استقبال آقای شی اقدامی دیپلماتیک برای ایجاد فضایی دوستانه تلقی می‌شود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/f817/live/8ad7da40-e365-11f1-99a1-253766e7ad8b.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "روابط بین‌الملل"], "datetime_fa": "۲۷ آبان • ۲۰:۱۴"}, {"source": "Iran International", "title": "وزیر امنیت داخلی آمریکا: حکومت ایران زیرساخت‌های حیاتی ایالات متحده را هدف قرار داده است", "link": "https://www.iranint ۲۶ آبان‌ماه در بروکسل با اعضای این ائتلاف سخن می‌گفت، به دلیل اظهارات انتقادی‌اش پیرامون حملات اخیر کی‌یف به عمق خاک روسیه، با واکنش تند متحدان غربی و اوکراینی مواجه شد. کولبی در نشستی از «گروه تماس دفاعی اوکراین» سخنرانی می‌کرد؛ ائتلافی غیررسمی متشکل از حدود ۵۰ کشور که هماهنگی حمایت‌های نظامی متحدان غربی از اوکراین را بر عهده دارد. این گروه همچنین به نام «گروه رامشتاین» شناخته می‌شود که برگرفته از نام پایگاه هوایی ایالات متحده در آلمان است؛ جایی که نخستین دور گفت‌وگوها در آن برگزار شد. این مقام ارشد وزارت دفاع آمریکا گفت: «با فرا رسیدن زمستان، به نظر می‌رسد روسیه همچنان به جذب نیروی انسانی بیشتر و بسیج اقتصاد جنگی خود برای یک نبرد طولانی‌مدت ادامه خواهد داد». او تأکید کرد که همه طرف‌ها باید برای «ادامه‌دار بودن» این جنگ، آماده باشند. البریج کولبی همزمان یادآوری کرد که دونالد ترامپ، رئیس‌جمهور ایالات متحده، همچنان «قویاً متعهد است که به این درگیری بر اساس شرایطی پایان دهد که ضامن صلحی پایدار باشد». دونالد ترامپ که برای شرکت در نشست «آسیا- پاسیفیک» به شهر شنژن چین سفر کرده، قرار است روز پنجشنبه ۲۸ آبان‌ماه، در نشستی تاریخی و بی‌سابقه با ولادیمیر پوتین، رئیس‌جمهور فدراسیون روسیه، و شی جین‌پینگ، رهبر چین هم شرکت کند؛ نشستی سه‌جانبه که در آن احتمالاً موضوع جنگ‌های اوکراین و ایران و تلاش‌های گوناگون برای پایان دادن به آنها هم مورد بحث قرار خواهد گرفت. همزمان قرار است جرد کوشنر و استیو ویتکاف، نمایندگان ویژۀ دونالد ترامپ در همان روز در برلین در نشستی با حضور «ائتلاف کشورهای داوطلب» شرکت کنند. این ائتلاف، به ابتکار", "image_url": "https://gdb.rferl.org/bfdabac6-1c28-432e-831d-5b2ea569e694_cx0_cy7_cw0_w1200_h630.jpg", "category": "اقتصاد و بازرگانی", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲۷ آبان • ۱۹:۰۱"}, {"source": "Radio Farda", "title": "گروسی: ۱۸ ماه است از وضعیت ذخایر اورانیوم غنی‌شده ایران اطلاع دقیقی نداریم", "link": "https://www.radiofarda.com/a/grossi-iaea-iran-uranium-stockpiles-inspections-november-2026/33901200.html", "summary": "رافائل گروسی می‌گوید آژانس نزدیک به ۱۸ ماه است از وضعیت ذخایر اورانیوم غنی‌شده ایران اطلاع دقیقی ندارد و بدون دسترسی بازرسان نمی‌تواند صلح‌آمیز بودن فعالیت‌ها را راستی‌آزمایی کند.", "date_str": "2026-11-18T15:04:03+00:00", "hash": "9c28074d4bbf83ec", "title_fa": "گروسی: ۱۸ ماه است از وضعیت ذخایر اورانیوم غنی‌شده ایران اطلاع دقیقی نداریم", "summary_fa": "رافائل گروسی می‌گوید آژانس نزدیک به ۱۸ ماه است از وضعیت ذخایر اورانیوم غنی‌شده ایران اطلاع دقیقی ندارد و بدون دسترسی بازرسان نمی‌تواند صلح‌آمیز بودن فعالیت‌ها را راستی‌آزمایی کند. رافائل گروسی، مدیرکل آژانس بین‌المللی انرژی اتمی، هشدار داد که این نهاد نزدیک به ۱۸ ماه است اطلاعات دقیقی از وضعیت ذخایر اورانیوم غنی‌شده ایران ندارد و به‌دلیل نبود دسترسی به تأسیسات هسته‌ای جمهوری اسلامی، قادر به راستی‌آزمایی فعالیت‌های آن نیست. او در عین حال از توافق همکاری هسته‌ای میان آمریکا و عربستان سعودی استقبال کرد و آن را منطبق با چارچوب حقوقی آژانس دانست. گروسی روز چهارشنبه ۲۷ آبان در آغاز نشست شورای حکام آژانس در وین اعلام کرد که به‌جز نیروگاه بوشهر، این نهاد نه اطلاعاتی درباره وضعیت مواد و تأسیسات هسته‌ای اعلام‌شده ایران دریافت کرده و نه امکان بازرسی از این تأسیسات را داشته است. آقای گروسی در نشست خبری پس از این جلسه نیز تأکید کرد: «می‌توانم تأیید کنم که بازرسی‌ها فقط در بوشهر انجام شده است. بنابراین هیچ بازرسی دیگری در ایران در جریان نیست و امیدوارم بتوانیم هرچه زودتر آن‌ها را از سر بگیریم». مدیرکل آژانس گفت ادامۀ این وضعیت مانع از انجام مسئولیت‌های نظارتی این نهاد در چارچوب پیمان منع گسترش سلاح‌های هسته‌ای، موسوم به ان‌پی‌تی، شده است. او همچنین تأکید کرد که بدون دریافت اطلاعات از ایران و دسترسی بازرسان به تأسیسات هسته‌ای، آژانس نمی‌تواند تأیید کند که مواد هسته‌ای اعلام‌شده جمهوری اسلامی همچنان صرفاً برای مقاصد صلح‌آمیز مورد استفاده قرار می‌گیرند یا نه. آژانس در آخرین برآورد خود پیش از حملات اسرائیل و آمریکا در خرداد ۱۴۰۴، ذخایر اورانیوم غنی‌شده تا سطح ۶۰ درصد ایران را حدود ۴۴۰ کیلوگرم اعلام کرده بود. با گذشت نزدیک به یک سال و نیم از آن حملات، محل نگهداری و وضعیت کنونی این ذخایر همچنان برای بازرسان بین‌المللی روشن نیست.", "image_url": "https://gdb.rferl.org/7710a908-7f09-434d-9ebe-6bda30ef1a31_cx0_cy10_cw0_w1200_h630.jpg", "category": "اقتصاد و بازرگا ش از نخستین نشست رسمی سه‌جانبه رهبران چین، آمریکا و روسیه صورت گرفت. این نخستین بار در چند دهه گذشته است که عالی‌ترین مقام چین شخصاً برای استقبال از یک رهبر خارجی به فرودگاه می‌رود. به گزارش خبرگزاری فرانسه، ترامپ پس از پیاده شدن از هواپیمای ریاست‌جمهوری آمریکا، با شی جین‌پینگ دست داد و دو رهبر یکدیگر را در آغوش گرفتند. آن‌ها سپس در... این استقبال در حالی صورت گرفت که ولادیمیر پوتین، رئیس‌جمهور روسیه، ساعاتی پیشتر هنگام ورود به چین، مورد استقبال تسای چی، از نزدیک‌ترین مقام‌ها به شی جین‌پینگ، قرار گرفته بود. رهبران سه کشور روز چهارشنبه در حاشیه نشست همکاری اقتصادی آسیا و اقیانوسیه، موسوم به اپک (APEC)، در مراسم شام رسمی حضور یافتند و پیش از گرفتن عکس دسته‌جمعی، برای نخستین بار با یکدیگر خوش‌وبش کردند. قرار است نشست سه‌جانبه ترامپ، شی و پوتین روز پنجشنبه ۲۸ آبان در شنژن برگزار شود. به گفته مقام‌های آمریکایی، جنگ ایران، جنگ اوکراین و کاهش جنگ‌افزار هسته‌ای از محورهای این گفت‌وگوها خواهد بود. به روایت خبرگزاری دولتی شینهوا، شی جین‌پینگ در دیدار با ترامپ ابراز امیدواری کرد که گفت‌وگوهای دو کشور به ایجاد روابطی سازنده و برخوردار از ثبات راهبردی منجر شود. در همین حال، پوتین که روز چهارشنبه با شی جین‌پینگ نیز دیدار کرد، در سخنرانی خود در نشست اپک مدعی شد تحریم‌های غرب علیه روسیه به دلیل تهاجم نظامی به اوکراین «شکست خورده است». او همچنین ابراز امیدواری کرد که نشست سه‌جانبه «بسیار سودمند» باشد. خبرگزاری اینترفکس نیز به نقل از یک دستیار کرملین گزارش داد که شی و پوتین درباره نشست پیش رو با ترامپ گفت‌وگو کرده‌اند، اما به تطبیق مواضع خود درباره آن نپرداخته‌اند.", "image_url": "https://gdb.rferl.org/dc09fcef-1867-4495-854f-08df3ee82709_w1200_h630.jpg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۲۷ آبان • ۱۸:۰۴"}],
      tech: [{"source": "TechCrunch AI", "title": "Sam Altman warns against a future where AI, not humans, calls the shots", "link": "https://techcrunch.com/2026/11/18/sam-altman-warns-against-a-future-where-ai-not-humans-calls-the-shots/", "summary": "Altman and Greg Brockman pushed back against Silicon Valley's growing debate over an AI takeover, while acknowledging the challenges of keeping advanced models under human control.", "date_str": "2026-11-18T16:59:00+00:00", "hash": "691e2746d9932d12", "title_fa": "سم آلتمن نسبت به آینده‌ای هشدار می‌دهد که در آن هوش مصنوعی، نه انسان‌ها، شات‌ها را می‌خواند", "summary_fa": "آلتمن و گرگ براکمن از بحث رو به رشد سیلیکون ولی بر سر تصاحب هوش مصنوعی عقب نشینی کردند و در عین حال چالش های نگهداری مدل های پیشرفته را تحت کنترل انسان پذیرفتند. سام آلتمن، یکی از بنیانگذاران و مدیر عامل OpenAI معتقد است که مردم باید در مورد اینکه چگونه فناوری هوش مصنوعی بر جهان و زندگی همه افراد تأثیر می گذارد، مسئول آینده بمانند. مدیر اجرایی هوش مصنوعی در سخنرانی روز چهارشنبه در اجلاس Dealbook نیویورک تایمز به بحث‌هایی در سیلیکون ولی درباره اینکه آیا به تدریج به هوش مصنوعی واگذار می‌شود یا خیر اشاره کرد - به این معنی که هوش مصنوعی در نهایت به مرجع تصمیم‌گیری در هر صنعت و موسسه بزرگ تبدیل خواهد شد. یکی از مواردی که اخیراً زیاد در مورد آن صحبت می‌کنیم این است که چیزی در سیلیکون ولی وجود دارد که مبارزه با آن تقریباً مضحک به نظر می‌رسد، اما هر دوی ما عمیقاً معتقدیم که مردم باید کنترل آینده را در دست داشته باشند، و صحبت‌های فزاینده‌ای در مورد این موضوع وجود دارد، خوب، این نوع واگذاری تدریجی به هوش مصنوعی یا وجود خواهد داشت یا باید وجود داشته باشد. آلتمن که صحنه را با بنیانگذار OpenAI و رئیس جمهور گرگ براکمن به اشتراک می گذاشت، گفت و من - هر دو - موافقیم که این ایده وحشتناکی است. تئوری انتقال از این ایده ناشی می‌شود که با قدرتمندتر شدن مدل‌های هوش مصنوعی، آنها یاد می‌گیرند که خودشان را بهبود بخشند - مفهومی که به عنوان خود-بهبودی بازگشتی یا RSI شناخته می‌شود. همانطور که فناوری هوش مصنوعی موجود نسل‌های جدیدتر و باهوش‌تری می‌سازد، این نسل‌ها در نهایت به یک ا fornian highways immediately and until it can convince the DMV that its cars no longer “pose an imminent hazard to public safety.” This is not Waymo’s first run-in with this problem. In Arizona, Waymo robotaxis did not recognize ramp closure signs on six occasions in Phoenix in April and entered construction zones. A month later in California, seven Waymo robotaxis entered lanes with active construction. In June, Waymo recalled the almost 3,800 robotaxis capable of highway driving. That problem led Waymo to stick to surface streets only in California after the May incidents until late July, when the robotaxis resumed highway operations. In early July, Waymo told the National Highway Traffic Safety Administration that it began updating the robotaxi software to a version that “improve[s] the recognition of freeway construction zones, more appropriately prioritize[s] construction zones over other freeway hazards, and reduce[s] speed when the AV detects that it may be in a construction zone.” Read full article Comments", "date_str": "2026-11-18T16:24:34+00:00", "hash": "648dd8dbe50098dc", "title_fa": "Waymo رباتاکسی خود را از رانندگی در بزرگراه منع کرده است - در اینجا دلیل آن است", "summary_fa": "Waymo در حال حاضر ناوگان ربات‌اکسی‌های خود را پس از برخورد با آب گرم کالیفرنیا به دلیل رفتار رانندگی خودروهایش در بزرگراه‌ها، محدود به خیابان‌های سطحی می‌کند. به طور خاص، نرم افزار تمایل دارد با سرعت وارد مناطق ساخت و ساز شود. همانطور که برای اولین بار توسط San Francisco Business Times گزارش شد، این رفتار در اوایل این ماه خشم DMV کالیفرنیا را برانگیخت، که به Waymo دستور داد تا فوراً رانندگی در بزرگراه های کالیفرنیا را متوقف کند و تا زمانی که بتواند DMV را متقاعد کند که خودروهایش دیگر \"خطری قریب الوقوع برای امنیت عمومی ندارند.\" این اولین بار Waymo با این مشکل نیست. در آریزونا، Waymo robotaxis در شش بار در فونیکس در ماه آوریل علائم بسته شدن رمپ را تشخیص نداد و وارد مناطق ساخت و ساز شد. یک ماه بعد در کالیفرنیا، هفت رباتاکسی Waymo وارد خطوط با ساخت و ساز فعال شدند. در ماه ژوئن، W  straight from the fridge and try to work quickly when incorporating it into the flour. Instead of using my palms to break up the butter, I like to use my fingertips, since they conduct less heat. Luckily, the butter doesn't need to be fully mixed into the crust, since any visible chunks will turn into crispy flakes in the oven. I always chill the dough to prevent the crust from shrinking. 2GreenEyes/iStock One of the most common pie-baking problems is crust shrinkage, which can occur when overworked dough develops excessive gluten and contracts in the oven. To prevent this, I never stretch the dough to fit it into a pan. Instead, I lift it and let it settle into the corners — and if it isn't large enough, I gently roll it out a little. Additionally, I always refrigerate my pie dough after placing it in the pan, since that allows the gluten to relax while the butter firms up. Blind baking the crust helps avoid a soggy bottom. Allison Chen For pies with particularly wet fillings, like custard or pumpkin, I like to blind bake, or partially bake, the crust before adding the filling. This process gives the bottom of the crust a head start in the oven so it has time to develop structure and crisp up before coming into contact with the filling. Once the dough is in t", "date_str": "2026-11-18T15:03:01+00:00", "hash": "f9fae0733ae9cc2a", "title_fa": "من یک نانوای حرفه ای هستم که در مدرسه شیرینی در فرانسه تحصیل کردم. در اینجا 7 نکته برای درست کردن بهترین کیک ها وجود دارد.", "summary_fa": "به‌عنوان یک نانوای حرفه‌ای که در مدرسه شیرینی‌پزی تحصیل کرده‌ام، آموخته‌ام که کدام تکنیک‌ها به ایجاد بهترین کیک‌ها کمک می‌کنند. jenifoto/Getty Images پس از حضور در مدرسه شیرینی در فرانسه، اسرار درست کردن بهترین کیک ها را آموختم. من متوجه شده ام که استفاده از سردترین کره ممکن برای خمیر، پوسته پوسته ترین پوسته را ایجاد می کند. برای فصل‌های شلوغ پخت، پای میوه‌ها را جمع‌آوری و فریز می‌کنم، تا هفته‌ها بعد آماده پخت شوند. من یک نانوایی تمام وقت هستم که در مدرسه شیرینی در فرانسه تحصیل کردم و در چ https://www.businessinsider.com/italy-trip-things-you-should-never-do-travel-advisor-tips-2026-11", "summary": "As a travel advisor, I know there are a few things you should never do when traveling to Italy. Vanessa Kromer I've worked as a travel advisor for 16 years and have sent clients on luxury Italian vacations. As someone who also loves traveling to Italy, I've seen my fair share of common tourist mistakes . In my experience, overpacking or changing hotels too many times can ruin a trip. As a luxury travel advisor, I've sent hundreds of clients to Italy over the past 16 years. Plus, as someone who loves traveling there myself (I typically take two or three trips to Italy each year), I've seen many tourists make the same mistakes repeatedly. Here are the things I always tell clients to avoid when traveling to Italy. Changing hotels too many times can ruin a trip. Vanessa Kromer Many travelers I work with want to visit three to five Italian cities in nine days, changing hotels every two nights or less. In my opinion, though, the only souvenirs these travelers will come home with are extreme sleep deprivation and zero memory of what they actually did or saw. Instead, I recommend two or three hotel changes at the most. This way, they're not living out of a suitcase for the entire trip and can really enjoy each destination. Many travelers feel obligated to visit famous attractions, regardless of their personal interests. Vanessa Kromer I find that many travelers add popular tourist destinations to their itineraries just to check them off their travel bucket lists. In my opinion, though, this is a waste of valuable vacation time. For example, if you have zero desire to see The Vatican or the Colosseum, you can fill that time with something totally amazing in Rome that piques your interest. Or, if you don't drink wine, I recommend spending free time in smaller Tuscan cities like Siena or Lucca instead of at a winery. At the end of the day, it's important to craft your Italian vacation itinerary around your desires. Because trust me — there's something for everyone. Overpacking makes travel less convenient. Vanessa Kromer Less is always more when it comes to packing for an international trip , and Italy is no exception. Far too many times, I've gone to Venice and seen people with large checked bags trying to drag them up and over hundreds of steps to their hotels. Plus, there are sometimes luggage limits on taxis, trains, and ferries. That's why I always aim to travel with just a carry-on. To do this, I alway recommend packing layers and a combination of mix-and-match", "date_str": "2026-11-18T14:33:39+00:00", "hash": "5ae98e2ef876a65e", "title_fa": "من یک مشاور سفر هستم که برای سفرهای لوکس به ایتالیا برنامه ریزی می کنم. در اینجا 5 اشتباهی وجود دارد که می بینم مسافران بارها و بارها مرتکب می شوند.", "summary_fa": "به عنوان یک مشاور سفر، می دانم چند کار وجود دارد که هرگز نباید در سفر به ایتالیا انجام دهید. ونسا کرومر من به مدت 16 سال به عنوان مشاور سفر کار کرده ام و مشتریان خود را به تعطیلات لوکس ایتالیایی فرستاده ام. من به عنوان کسی که عاشق سفر به ایتالیا هستم، اشتباهات رایج توریستی را دیده ام. در تجربه من، بسته بندی بیش از حد یا تغییر چندباره هتل می تواند یک سفر را خراب کند. من به عنوان یک مشاور سفرهای لوکس، صدها مشتری را در 16 سال گذشته به ایتالیا فرستاده ام. به‌علاوه، به‌عنوان کسی که خودم عاشق سفر به آنجا هستم (معمولاً هر سال دو یا سه سفر به ایتالیا می‌روم)، توریست‌های زیادی را دیده‌ام که به طور مکرر اشتباهات مشابهی را مرتکب می‌شوند. در اینجا چیزهایی است که من همیشه به مشتریان می گویم که هنگام سفر به ایتالیا از آن اجتناب کنند. تغییر مکرر هتل می تواند یک سفر را خراب کند. ونسا کرومر بسیاری از مسافرانی که با آنها کار می‌کنم می‌خواهند از سه تا پنج شهر ایتالیا در 9 روز بازدید کنند و هر دو شب یا کمتر هتل را عوض کنند. با این حال، به نظر من، تنها سوغاتی‌هایی که این مسافران با آن به خانه می‌آیند، محرومیت شدید از خواب و حافظه صفر از آنچه واقعاً انجام داده‌اند یا دیده‌اند است. در عوض، من حداکثر دو یا سه تغییر هتل را توصیه می کنم. به این y 27.58% of an annual household income. Even in the most affordable state, a college education costs more than a quarter of a year's income, and in 21 states, it costs more than half a year's income. See how each state ranks in terms of how a median household income compares to the average public in-state college's cost of attendance . 48. Utah University of Utah in Salt Lake City, Utah. Ladanifer/Getty Images College costs as a percentage of median household income: 27.58% 47. Hawaii University of Hawaii at Manoa in Honolulu. mizoula/Getty Images College costs as a percentage of median household income: 35.87% 46. Nevada University of Nevada campus in Reno, Nevada. sframephoto/Getty Images/iStockphoto College costs as a percentage of median household income: 35.88% 45. South Dakota University of South Dakota in Vermillion, South Dakota. Wolterk/Getty Images College costs as a percentage of median household income: 36.66% 44. North Dakota Minot State University is a public university in Minot, North Dakota. Cindy Shebley/Getty Images College costs as a percentage of median household income: 36.98% 43. Maryland University of Maryland in College Park, Maryland. sframephoto/Getty", "date_str": "2026-11-18T13:47:01+00:00", "hash": "91e607d9ce1de1c5", "title_fa": "ایالاتی که در آن مردم بیشترین هزینه را برای تحصیلات دانشگاهی می کنند، رتبه بندی شده اند", "summary_fa": "رود آیلند بالاترین هزینه تحصیل در کالج را در ایالات متحده دارد که بر اساس سهم درآمد خانوار اندازه گیری می شود. Wolterk/Getty Images به طور متوسط، تحصیلات دانشگاهی در ایالات متحده بیش از نیمی از درآمد یک سال خانواده را تشکیل می دهد. چندین کالج ایالات متحده هزینه سالانه حضور بیش از 100000 دلار در سال 2026 دارند. رود آیلند بالاترین هزینه تحصیل را به عنوان سهم درآمد دارد، در حالی که یوتا کمترین هزینه را دارد. هزینه آموزش عالی به طور کلی در حال افزایش است، اما در برخی ایالت ها، گرفتن مدرک دانشگاهی گران تر از سایر ایالت ها است. یک مطالعه اخیر WalletHub به بررسی نحوه مقایسه هزینه تحصیل در دانشگاه در ایالت های ایالا ducts advertised as deals on Amazon didn’t offer savings during the actual shopping events. The investigation also found that nearly a tenth of the deals it examined were more expensive during the sales events than on some days in the month leading up to them. Something we commonly see on Amazon and attempt to correct for in our coverage are good deals with inflated discount claims. As in, the original retail amount (the “list” price) is sometimes higher than the usual day-to-day price to make the savings seem more substantial. Sometimes, the manufacturer’s suggested retail price (MSRP) is what’s shown, though that’s not always the case. In a recent statement to investigative journalist Ronan Farrow , an unattributed Amazon spokesperson shared that its “List Price” can also be aggregated from the past 90 to 180 days of prices, not the past 30 days as Groundwork Collaborative’s research states, and is based on prices from Amazon itself and other competing retailers. However, in our experience, the confusing way pricing and discounts are communicated isn’t limited to Amazon. View this post on Instagram The group’s findings show how easy it is to distrust the prices you see, especially online, where dynamic pricing sometimes comes into play. Regardless of retailer practices, we understand the importance of curating what you see on The Verge with care. Vetting deals for coverage consideration is a big, albeit invisible, part of our jobs, even outside of big shopping events. Most of what we’re pitched day to day, or what we see in our respective feeds, never hits the site because it doesn’t meet our standards. Even when the deal is for a product ", "date_str": "2026-11-18T14:00:00+00:00", "hash": "397feb10f56377c7", "title_fa": "چگونه The Verge در حال انتخاب معاملات جمعه سیاه برای به اشتراک گذاشتن است", "summary_fa": "در ماه گذشته، ما غرق معاملات جمعه سیاه شده ایم، که نشان می دهد در بزرگترین روز خرید سال در ایالات متحده چه اتفاقی می افتد. ما به طور معمول روزانه ده ها خبر       media: [{"source": "Billboard", "title": "Luminate Adds Songwriter and Publishing Information to Service", "link": "https://www.billboard.com/pro/luminate-adds-songwriter-publishing-information/", "summary": "Entertainment data platform Luminate has added music publishing and songwriter data to its CONNECT service, starting Wednesday (Nov. 18). Available for an additional fee, Luminate users can now see the information and activity attached to musical works as well as recordings on the platform for the first time. The data is sourced from Luminate s partnerships with CISAC and the MLC along with proprietary data and advanced matching logic, as a blog post about the news states. Use cases for this publishing data — which provides information about the songwriters and underlying song copyright — include the ability to audit and evaluate which recordings are driving the most sales and streams for a given song and the ability to see and export tables of ISWC (the unique code given to every registered musical work/song) and ISRC (the unique code given to every registered sound recording) links quickly. Related Luminate Midyear Report 2026: R B/Hip-Hop Falls, Dance Rises, CDs Surge 16% More CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Over time, Luminate plans to track publishing rights to musical works and display which songwriters and publishers control those rights on their dashboards. According to the blog post, written by Luminate s chief product officer Arnaud Retureau , there are several expected benefits of its new publishing data: music publishers can see how every version of a work is performing worldwide, investors can get a clearer foundation for forecasting a catalog s value over time, performing rights organizations (PROs) can better monitor their registered ISWCs for future royalty payments, labels and distributors can clean up metadata and check release readiness and streaming services can get a clearer view of publishing rights. Related Nearly 150,000 Tracks Are Added to Streaming Services Every Day, Luminate CEO Says Providing transparency about publishing data has long been a challenge in the music business. Often, songs — also called musical works — are written by several songwriters, all of whom are represented by music publishers. Given the song is owned by a complex web of rights holders, it s much more common to find clerical errors in publishing registrations than it is on the recorded music side. To make the system even worse, sometimes recordings are released on streamin", "date_str": "2026-11-18T17:00:00+00:00", "hash": "b4a668526e7afd0f", "title_fa": "Luminate اطلاعات ترانه سرا و انتشارات را به سرویس اضافه می کند", "summary_fa": "پلتفرم داده های سرگرمی Luminate از چهارشنبه (18 نوامبر) داده های انتشارات موسیقی و ترانه سرا را به سرویس CONNECT خود اضافه کرده است. کاربران Luminate که با هزینه اضافی در دسترس هستند، اکنون می توانند اطلاعات و فعالیت های پیوست شده به آثار موسیقی و همچنین ضبط های روی پلت فرم را برای اولین بار مشاهده کنند. این داده ها از شراکت Luminate با CISAC و MLC به همراه داده های اختصاصی و منطق تطبیق پیشرفته، همانطور که یک پست وبلاگ در مورد اخبار بیان می کند، به دست آمده است. موارد استفاده برای این داده‌های انتشار - که اطلاعاتی درباره ترانه‌سراها و حق نسخه‌برداری آهنگ زیربنایی ارائه می‌کند - شامل توانایی ممیزی و ارزیابی اینکه کدام ضبط‌ها بیشترین فروش و جریان را برای یک آهنگ خاص دارند و توانایی دیدن و صادرات جداول ISWC (کد منحصر به فرد داده‌شده به هر اثر/آهنگ موسیقی ثبت‌شده) و ISRC (کد منحصربه‌فرد داده‌شده به هر پیوند ضبط شده سریع ثبت‌شده). گزارش مرتبط Luminate Midyear 2026: R B/Hip-Hop Falls، Dance Rises، سی دی ها افزایش 16 درصدی نشانه های CL بیشتر با THEBLACKLABEL، اتحاد مجدد با تدی تهیه کننده قدیمی تدی برای لحظات کامل در هوای سخت، Radius Clauses و یافتن نسل بعدی He-Linar-Festival-by-It. با گذشت زمان، Luminate قصد دارد حقوق انتشار آثار موسیقی را ردیابی کند و نشان دهد که کدام ترانه سراها و ناشران این حقوق را در داشبورد خود کنترل می کنند. بر اساس این پست وبلاگ که توسط مدیر ارشد محصول Luminate، Arnaud Retureau نوشته شده است، چندین مزیت مورد انتظار از داده‌های انتشار جدید آن وجود دارد: ناشران موسیقی می‌توانند عملکرد هر نسخه از یک اثر را در سراسر جهان ببینند، سرمایه‌گذاران می‌توانند مبنای واضح‌تری برای پیش‌بینی ارزش کاتالوگ در طول زمان به دست آورند، سازمان‌های حقوق اجرا (PROs) می‌توانند بهتر بر پرداخت‌هایشان نظارت کنند. توزیع‌کنندگان می‌توانند ابرداده‌ها", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۲۷ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "BMI Country Awards Honor ‘Choosin’ Texas,’ Jeffrey Steele, Morgan Wallen & More", "link": "https://www.billboard.com/music/awards/bmi-country-awards-honor-choosin-texas-jeffrey-steele-1236384764/", "summary": "The BMI Country Awards honored the songwriters and publishers behind many of the year’s biggest country hits on Tuesday (Nov. 17). Held at BMI’s Nashville offices, the annual celebration was what BMI’s CEO Mike O’Neill called the biggest parking lot party in Nashville. “You all give us the words we can’t find on our own,” he said to the songwriters in the room. To honor the massive, genre-shifting success of Choosin Texas — written by Ella Langley, Luke Dick, Miranda Lambert and Joybeth Taylor, and recorded by Langley — the BMI Country Awards presented the writers with the inaugural BMI Impact Award, which recognizes a song, songwriter or artist whose cultural impact has distinguished their creative work as a defining force. Choosin Texas has spent 28 weeks atop the all-genre Billboard Hot 100 so far, holding the all-time record for the most weeks at No. 1 on that chart. To honor the writers, Thomas Rhett took the stage to perform Choosin Texas. “Much love, y’all, congrats,” he told the writers. Morgan Wallen and Charlie Handsome were both named BMI country songwriter of the year for cowriting seven of BMI s most performed country songs of the year, among them I Ain t Comin Back, I Got Better, Superman and I m the Problem. Handsome took the stage and praised Wallen for his win. He’s one of the best songwriters I’ve ever met and he deserves recognition … he’s a great songwriter and artist, he said. I m the Problem was named the 2026 BMI country song of the year and is published by Big Loud Mountain, Bo Jewell Club, Ernest Money Music, Honey Hole Publishing, Sony/ATV Songs LLC and Warner-Tamerlane Publishing Corp. The song was written by Grady Block, Handsome, Jamie McLaughlin, Ernest Keith Smith and Wallen. I m the Problem topped the Country Airplay chart for eight weeks, making it one of only six songs in the chart’s history since 1990 to stay at the pinnacle for eight or more weeks. Warner-Tamerlane Publishing Corp. took home publisher of the year. In the past year, the company published 31 of the most performed songs, among them 20 Cigarettes, I m the Problem, Single Again and After All the Bars Are Closed. Thirty-eight first-time award winners were recognized during the evening, among them Summer Overstreet for Tucker Wetmore’s “3,2,1 ; BigXthaPlug, Krishon Bandplay Gaines, Jenna Johnson and KK Johnson for “All the Way ; Jackson Foote, Jordan Gray and Kevin Powers for Jelly Roll’s “Amen ; Trent Dabbs, Max McNown and Ava Suppelsa for Max McNown’s “Better", "date_str": "2026-11-18T16:47:46+00:00", "hash": "7dd79b65811ad38e", "title_fa": "جوایز کشور BMI به «چوسین» تگزاس، جفری استیل، مورگان والن و غیره افتخار می‌کند", "summary_fa": "جوایز کشور BMI در روز سه شنبه (17 نوامبر) از ترانه سرایان و ناشران بسیاری از بهترین آهنگ های کشور سال تقدیر کرد. این جشن سالانه که در دفاتر BMI در نشویل برگزار شد، همان چیزی بود که مدیر عامل BMI، مایک اونیل آن را بزرگترین جشن پارکینگ در نشویل نامید. او به ترانه سرایان حاضر در اتاق گفت: «همه شما کلماتی را به ما می‌دهید که خودمان نمی‌توانیم پیدا کنیم. به منظور گرامیداشت موفقیت عظیم و تغییر ژانر Choosin Texas - نوشته الا لنگلی، لوک دیک، میراندا لمبرت و جویبت تیلور، و توسط لنگلی ضبط شده است - جوایز کشور BMI جایزه افتتاحیه BMI Impact را به نویسندگان اهدا کرد، که آهنگ، ترانه سرا یا هنرمندی را به رسمیت می‌شناسد که اثر فرهنگی اثر متمایز آن‌ها را به عنوان نیروی خلاق مشخص کرده است. Choosin Texas تا کنون 28 هفته را در صدر 100 بیلبورد داغ همه ژانر سپری کرده است و رکورد تاریخ را برای بیشترین هفته ها در رتبه 1 این نمودار حفظ کرده است. برای قدردانی از نویسندگان، توماس رت برای اجرای Choosin Texas روی صحنه رفت. او به نویسندگان گفت: «عاشقانه، تبریک می گویم. مورگان والن و چارلی خوش تیپ هر دو به دلیل نوشتن هفت آهنگ کانتری سال BMI، از جمله I Ain t Comin Back، I Got Better، Superman و I m the Problem، به عنوان ترانه سرای کانتری BMI انتخاب شدند. خوش تیپ روی صحنه رفت و والن را به خاطر بردش تحسین کرد. او گفت که او یکی از بهترین ترانه سرایانی است که تا به حال ملاقات کرده ام و شایسته تقدیر است... او یک ترانه سرا و هنرمند بزرگ است. I m the Problem به عنوان آهنگ کانتری BMI 2026 انتخاب شد و توسط Big Loud Mountain، Bo Jewell Club، Ernest Money Music، Honey Hole Publishing، Sony/ATV Songs LLC", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/BMI-Country-Awards-Choosin-Texas-1800-billboard.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۲۰:۱۷"}, {"source": "Billboard", "title": "Ignacio Meyer Named President of Universal Music Latin America & Iberian Peninsula", "link": "https://www.billboard.com/pro/ignacio-meyer-president-universal-music-latin-america/", "summary": "Ignacio Meyer has been named president of Universal Music Latin America Iberian Peninsula, effective immediately, Billboard can announce Wednesday (Nov. 18). He will report to Felipe Holguín , who was named CEO of the division on Tuesday (Nov. 17) after it was announced Monday (Nov. 16) that Jesús López was stepping down from the position. Related Felipe Holguín Appointed CEO of Universal Music Latin America and Iberian Peninsula CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive “Artists are at the heart of how we’re building this next chapter. Nacho combines creative sensibility and strategic vision with a deep understanding of how to nurture each artist’s individuality, grow their audience, and heighten their impact across platforms,” Holguín said in a press statement. “He’ll add a powerful dimension to our leadership team as we invest in extraordinary artists and bring bold ideas to life. We know from experience how well we work together, and I’m delighted to welcome him to UMG.” Prior to joining the Universal Music team, Meyer — a 2026 Billboard Latin Power Player — was president of Univision Networks Group and previously held leadership roles at TelevisaUnivision since 2011, spanning U.S. networks and local media, radio, music and non-scripted entertainment, business development and strategic partnerships. In early October, Billboard announced that Meyer was stepping down from his post at TelevisaUnivision. Related Jesús López Steps Down as Head of Universal Music Latin America/Iberian Penninsula, Named Chairman Emeritus of UMG’s Global Talent Services “Latin music is shaping culture around the world because its artists keep pushing boundaries by embracing new sounds, new technologies, and new ways to connect with fans,” added Meyer. “Their creative ambition is a force for the entire industry. Our role is to amplify that vision with the right support, fresh thinking, and UMG’s global reach. I’m excited to work with Felipe and our teams to help artists build lasting careers and take their music even further.” Meyer is the first senior appointment by Holguín, who was recently named CEO of Universal Music Latin America Iberian Peninsula and will be based in Miami, reporting directly to Sir Lucian Grainge , chairman and CEO of UMG.", "date_str": "2026-11-18T16:32:08+00:00", "hash": "4f8483e93cf947e3", "title_fa": "ایگناسیو مایر به عنوان رئیس یونیورسال موسیقی آمریکای لاتین و شبه جزیره ایبری انتخاب شد", "summary_fa": "بیلبورد می تواند چهارشنبه (18 نوامبر) اعلام کند، ایگناسیو مایر به عنوان رئیس شبه جزیره ایبری آمریکای لاتین یونیورسال موزیک انتخاب شده است. او به فیلیپه هولگین، که روز سه‌شنبه (17 نوامبر) پس از اعلام روز دوشنبه (16 نوامبر) مبنی بر کناره‌گیری ژسوس لوپز از سمت خود، به عنوان مدیرعامل این بخش معرفی شد، گزارش خواهد داد. مرتبط Felipe Holguin منصوب مدیرعامل یونیورسال موزیک آمریکای لاتین و شبه جزیره ایبری CL Signs با THEBLACKLABEL، اتحاد مجدد با تهیه کننده قدیمی تدی برای لحظات کامل وضعیت آب و هوای سخت، بندهای شعاع و یافتن نسل بعدی عناوین جشنواره: قلب نحوه ساخت این فصل بعدی. هولگوین در بیانیه‌ای مطبوعاتی گفت: «ناچو حساسیت خلاق و دیدگاه استراتژیک را با درک عمیق نحوه پرورش فردیت هر هنرمند، رشد مخاطبان و افزایش تأثیر آن‌ها در پلتفرم‌ها ترکیب می‌کند.» او با سرمایه‌گذاری روی هنرمندان خارق‌العاده و اجرای ایده‌های جسورانه، بعد قدرتمندی به تیم رهبری ما اضافه می‌کند. ما از تجربه می دانیم که چقدر خوب با هم کار می کنیم، و من خوشحالم که او را به UMG خوش آمد می گویم.\" قبل از پیوستن به تیم یونیورسال موزیک، مایر - یک پخش کننده لاتین بیلبورد در سال 2026 - رئیس گروه شبکه های Univision بود و قبلاً از سال 2011 در TelevisaUnivision نقش رهبری داشت که شامل شبکه های ایالات متحده و رسانه های محلی، رادیو، موسیقی و سرگرمی های بدون فیلمنامه، توسعه تجاری و مشارکت های استراتژیک بود. در اوایل اکتبر، بیلبورد اعلام کرد که مایر از سمت خود در TelevisaUnivision کناره گیری می کند. ژسوس لوپز به عنوان رئیس یونیورسال موسیقی آمریکای لاتین/شبه‌جزیره ایبری کناره‌گیری می‌کند و به عنوان رئیس بازنشسته خدمات استعدادهای جهانی UMG انتخاب می‌شود: «موسیقی لاتین فرهنگ را در سراسر جهان شکل می‌دهد زیرا هنرمندان آن با پذیرش صداهای جدید، فن‌آوری‌های جدید و راه‌های جدید برای ارتباط با طرفداران، همچنان", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/ignacio-meyer-cr-universal-music-press-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۲۷ آبان • ۲۰:۰۲"}, {"source": "Billboard", "title": "‘Glee’ Star Earns Perfect Score on ‘DWTS’ Routine Honoring Late Naya Rivera — Then Gets Eliminated", "link": "https://www.billboard.com/culture/tv-film/glee-harry-shum-jr-perfect-score-dwts-honor-naya-rivera-1236384785/", "summary": "Harry Shum Jr. was sent home from Dancing With the Stars on Tuesday (Nov. 17), but not before he had the chance to honor his late Glee costar Naya Rivera. Related Harry Shum Jr. Addresses Whether He ll Be in the Glee -boot: I m Currently Really, Really Busy Watch Brandy and Monica, Sheryl Crow Maren Morris Perform Live for Grammy Night on DWTS The Glee Reboot Is Officially in the Works The actor and pro partner Jenna Johnson performed a dynamic quickstep routine set to Mark Ronson and Amy Winehouse s iconic Valerie collaboration, which is widely considered to be Rivera s signature song from her tenure as Santana Lopez on Glee . (Her cover of the track peaked at No. 54 on the Billboard Hot 100 , while Ronson and Winehouse s never appeared on the chart despite reaching No. 2 in the U.K.) “I’m excited because that song was just so meaningful to a lot of Glee fans,” Shum said leading up to the performance, according to Entertainment Weekly . I never thought I would be able to dance to that song again. This is where we just really crank it up. In the comments of DWTS s post on Instagram highlighting the tribute, Shum wrote, Love you Naya. The Grey s Anatomy star ultimately received a perfect score of 30 for the quickstep. But even though his second routine of the night a paso doble to We Found Love by Rihanna and Calvin Harris also scored perfect marks, he was sent home Tuesday night. I hope you all Gleeks are happy with our dance, Shum said in a video on Instagram after the elimination. I m so proud of our dance I m so proud of our journey. This has been a beautiful journey, and we have that forever. Love you guys. Rivera died at the age of 33 in an accidental drowning in 2020. Her loss is always felt deeply by family, friends, her castmates and fans, but it s been particularly poignant in recent weeks as Glee gears up to return after 10 years with a reboot penned by the original show s creator, Ryan Murphy. Leading lady Lea Michele is on board to reprise her role as Rachel Berry, according to reports, but Shum who currently stars on Grey s Anatomy as Dr. Kwan isn t quite sure yet if he ll slip back into Mike Chang s dancing shoes. “I’m currently really, really busy now,” he told EW in October while competing on DWTS , “but I would love to keep continuing, because I love [ Glee ].” Watch Shum and Johnson s tribute to Rivera, as well as his perfect paso doble, below:", "date_str": "2026-11-18T16:31:48+00:00", "hash": "4d2f690f9758f7d3", "title_fa": "ستاره «Glee» در مراسم روتین «DWTS» به افتخار Late Naya Rivera - سپس حذف می‌شود، امتیاز عالی کسب می‌کند", "summary_fa": "هری شوم جونیور روز سه‌شنبه (17 نوامبر) از Dancing With the Stars به ​​خانه فرستاده شد، اما نه قبل از اینکه فرصتی برای ادای احترام به نایا ریورا، بازیگر فقید خود در Glee داشته باشد. مرتبط هری شوم جونیور خطاب به اینکه آیا او در بوت شاد حضور خواهد داشت: من در حال حاضر واقعاً مشغول تماشای براندی و مونیکا، شریل کرو مارن موریس در اجرای زنده برای شب گرمی در DWTS هستم. همکاری والری، که به طور گسترده به عنوان آهنگ امضای ریورا از دوران تصدی او به عنوان سانتانا لوپز در Glee در نظر گرفته می شود. (کاور آهنگ او به شماره شماره رسید. 54 در Billboard Hot 100، در حالی که رونسون و واینهاوس با وجود رسیدن به رتبه 2 در بریتانیا هرگز در جدول ظاهر نشدند. به گفته Entertainment Weekly، شوم قبل از اجرا گفت: \"من هیجان زده هستم زیرا آن آهنگ برای بسیاری از طرفداران Glee بسیار معنادار بود.\" هرگز فکر نمی کردم بتوانم دوباره با آن آهنگ برقصم. این جایی است که ما واقعاً آن را بالا می بریم. در کامنت پست DWTS در اینستاگرام که ادای احترام را برجسته کرده بود، شوم نوشت، دوستت دارم نایا. ستاره Grey s Anatomy در نهایت امتیاز کامل 30 را برای Quickstep دریافت کرد. اما با وجود اینکه دومین روتین او در شب، یک پاسو دابل برای We Found Love توسط ریحانا و کالوین هریس نیز امتیازهای عالی کسب کرد، او سه شنبه شب به خانه فرستاده شد. شوم پس از حذف در ویدئویی در اینستاگرام گفت: امیدوارم همه گلیک ها از رقص ما راضی باشید. من خیلی به رقصمان افتخار می کنم من به سفرمان خیلی افتخار می کنم. این یک سفر زیبا بوده است و ما آن را برای همیشه داریم. شما را دوست دارم. ریورا در سال 2020 در سن 33 سالگی بر اثر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/jenna-johnson-harry-shum-dwts2-press-abc-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۲۰:۰۱"}, {"source": "Billboard", "title": "Rihanna and Dua Lipa Scoop Up Armload of New Diamond & Platinum Certifications for ‘Where Have You Been,’ ‘Levitating’ & More", "link": "https://www.billboard.com/music/music-news/rihanna-dua-lipa-new-diamond-platinum-certifications-levitating-1236384754/", "summary": "Wherever she is today, Dua Lipa is likely popping some champagne to celebrate her first-ever Diamond-certified single. Dua s label celebrated her achievement on Tuesday (Nov. 17) in an Instagram post touting the singer s nine new RIAA certifications, including the 13x Platinum status of her smash 2020 Future Nostalgia digital single Levitating ; a single reaches Diamond status at 10 million equivalent units. In addition, Dua scooped up a bunch of other major certifications, including 5x Platinum for the 2017 single IDGAF, as well as 4X Platinum for the 2020 singles Break My Heart, and 3X Platinum for Physical. A handful of her releases were also certified double Platinum, including her 2017 debut LP Dua Lipa , as well as doubles for the 2021 singles Love Again and 2023 s Houdini, Platinum status for 2024 single Illusion and gold for the 2019 song Future Nostalgia. Rihanna also got some good RIAA news for the holidays, as four of her singles reached new RIAA certification peaks. Leading the pack was the 2011 Talk That Talk album smash single Where Have You Been, co-produced by Dr. Luke, Cirkut and Calvin Harris, which is now six-times Platinum, as well as the double-Platinum certified 2012 Jay-Z collaboration and title track from her sixth album, Talk That Talk . In addition, another song from that LP, You Da One reached quadruple-Platinum status and the album itself reached quadruple-Platinum as well. Back in January, Rihanna celebrated the 10th anniversary of her 2016 ANTI album when the RIAA revealed new certifications for nine songs from that album, including her eighth Diamond certification thanks to the Billboard Hot 100 No. 5 single Love on the Brain. The spate of new certs helped Rihanna extend her record as the female artist with the most Diamond singles in RIAA history.", "date_str": "2026-11-18T16:27:59+00:00", "hash": "1b67681d37cf4026", "title_fa": "ریحانا و دوآ لیپا برای «Where Have You Been»، «Levitating» و بیشتر گواهینامه‌های جدید الماس و پلاتین دریافت کردند.", "summary_fa": "دوآ لیپا هر کجا که امروز باشد، احتمالاً شامپاین می‌نوشد تا اولین تک آهنگ خود را جشن بگیرد. لیبل Dua در روز سه‌شنبه (17 نوامبر) با انتشار پستی در اینستاگرام از 9 گواهینامه جدید RIAA، از جمله وضعیت 13 برابر پلاتینیوم تک‌آهنگ دیجیتالی فوق‌العاده Future Nostalgia 2020 Levitating، موفقیت خود را جشن گرفت. یک تک به وضعیت الماس در 10 میلیون واحد معادل می رسد. علاوه بر این، Dua چندین گواهینامه مهم دیگر از جمله 5x Platinum برای تک آهنگ IDGAF 2017 و همچنین 4X Platinum برای تک‌آهنگ‌های Break My Heart 2020 و 3X Platinum برای Physical دریافت کرد. تعداد انگشت شماری از انتشارات او نیز گواهی دوبل پلاتین دریافت کردند، از جمله اولین آلبوم او در سال 2017، دوآ لیپا، و همچنین دونفره برای تک‌آهنگ‌های Love Again در سال 2021 و هودینی در سال 2023، وضعیت پلاتینیوم برای تک‌آهنگ Illusion در سال 2024 و طلایی برای آهنگ Future Nostalgia در سال 2019. ریحانا همچنین خبرهای خوبی از RIAA برای تعطیلات دریافت کرد، زیرا چهار تک آهنگ او به اوج های جدید گواهینامه RIAA رسیدند. پیشرو در این گروه، تک آهنگ شکسته آلبوم Talk That Talk 2011 Where Have You Been، محصول مشترک دکتر لوک، سیرکات و کالوین هریس بود، که اکنون شش برابر پلاتینیوم شده است، و همچنین همکاری جی زی با تاییدیه دوبل پلاتین در سال 2012 و آهنگ عنوان از ششمین آلبوم او تاک تاک. علاوه بر این، آهنگ دیگری از آن LP، You Da One به وضعیت چهار پلاتینیوم رسید و خود آلبوم نیز به چهار پلاتین رسید. در ژانویه، ریحانا دهمین سالگرد آلبوم ANTI 2016 خود را جشن گرفت، زمانی که RIAA گواهینامه‌های جدیدی را برای 9 آهنگ از آن آلبوم، از جمله هشتمین گواهینامه الماس او به لطف تک‌آهنگ 100 شماره 5 بیلبورد، Love on the Brain، اعلام کرد. موج گواهینامه های جدید به", "image_url": "https://www.billboard.com/wp-content/uploads/2026/03/2244878033-e1774463750387.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۹:۵۷"}, {"source": "Billboard", "title": "Watch Drake Gift a Fan & Her Young Son $100,000, Courtside Seats at Toronto Raptors OVO Night Game", "link": "https://www.billboard.com/music/rb-hip-hop/drake-gifts-fans-cash-toronto-raptors-ovo-night-game-video-1236384631/", "summary": "Drake has proven to be in a league of his own when it comes to his charitable efforts. With the holidays around the corner, Drizzy kicked off the season of gifting on OVO Night at Scotiabank Arena as the Toronto Raptors battled the New York Knicks on Tuesday night (Nov. 17) north of the border. Related Drake Gives Away a Mercedes-Benz G-Wagon to a Fan at His Toronto Concert Drake Gives Away Huge Cash Prizes Luxury Cars at His 3rd Annual Strong Women, Stronger Drinks Event With Drake s Help, Toronto Raptors Rename Practice Facility OVO Athletic Centre While the Raptors came up short against the defending champions, Drake surprised a mother and her young son at the game with a pair of his courtside seats at the next Toronto home game, along with $100,000 cash. Drizzy, who serves as an official Raptors ambassador, joined the winners Mackenzie and Ezekiel on the court as the in-arena host, Strizzy, surprised them with the tickets, and then snuck in the $100,000 gift as if they were winning a Raptors jersey and not د را نابود نکنید. آپاتو و پاول با همکاری یکدیگر فیلمنامه The Comeback King را نوشتند که یک ستاره موسیقی کانتری را دنبال می کند که کارش در حال خراب شدن است. پاول که ستاره‌اش در حال افزایش بوده است، قبلاً در فیلم‌هایی مانند موفقیت رام کام سال 2023 به جز تو با سیدنی سوینی و کمدی جنایی ریچارد لینکلیتر Hit Man با آدریا آرجونا، آثار کمدی خود را به نمایش گذاشته بود. او همچنین در سریال Hulu's Chad Power بازی کرد، یک کمدی فوتبالی درباره یک فصل خراب که برای فصل 2 تمدید شده است. اخیراً، او صدای خود را به فیلم یونیورسال یعنی فیلم سوپر ماریو کهکشان در نقش فاکس مک‌کلاد، یک شخصیت متقاطع نینتندو قرض داد و در فیلم‌های A24 How to Make a Killing و نسخه بازسازی شده The Running Man از پارامونت بازی کرد. بازیگران بازگشت پادشاه نیز شامل کریستین میلیوتی، استاوروس هالکیاس و لی جین هائو هستند. این عنوان در اوایل آوریل به طور رسمی با عکسی از یک سگک کمربند بزرگ و بسیار کانتری فاش", "image_url": "https://variety.com/wp-content/uploads/2026/11/comeback-king.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۲۷ آبان • ۱۹:۵۱"}, {"source": "Variety", "title": "Steven Spielberg Calls ‘The Odyssey’ a ‘Showstopper’ and ‘One of the Greatest Things’ Matt Damon Has Ever Done", "link": "https://variety.com/2026/film/news/the-odyssey-steven-spielberg-christopher-nolan-matt-damon-1236951881/", "summary": "After a weeklong run of screening Christopher Nolan s “The Odyssey,” Universal saved the best for last, bringing out Steven Spielberg to moderate a one-on-one Q A. As the film ended and the house lights went up, the pair walked out to a standing ovation from an audience of about 600 guild members and voters who had [ ]", "date_str": "2026-11-18T16:15:00+00:00", "hash": "0e204664ec1d2da5", "title_fa": "استیون اسپیلبرگ «ادیسه» را «نمایشگاه» و «یکی از بهترین کارهایی که مت دیمون تا کنون انجام داده است» می‌خواند.", "summary_fa": "پس از یک دوره هفتگی نمایش کریستوفر نولان «اودیسه»، یونیورسال بهترین ها را برای آخرین بار حفظ کرد و استیون اسپیلبرگ را به سمت تعدیل یک QA تک به تک برد. با پایان یافتن فیلم و روشن شدن چراغ خانه، این زوج با تشویق شدید تماشاگرانی متشکل از 600 عضو انجمن و رای دهندگان که [ ] نظراتی داشتند، یونیورسال پس از یک هفته نمایش «ادیسه» کریستوفر نولان، بهترین ها را برای آخرین بار ذخیره کرد و استیون اسپیلبرگ را به سمت تعدیل یک نفر برد. قبل از اینکه اسپیلبرگ لحظه‌ای برای تمجید از نولان برای فیلم پرفروش 1.8 میلیارد دلاری داشته باشد، این نولان بود که وارد صحنه شد و با فروتنی به اسپیلبرگ گفت: «فقط باید یک دقیقه وقت بگذارم، زیرا مدت‌هاست که شما را می‌شناسم، اما هرگز با شما یک پرسش پاسخ نداده‌ام. وقتی مردی جوان تر و پسر عزیزی بودم که فیلم های شما را تماشا می کردم، فکر نمی کنم هرگز واقعاً این لحظه را تصور می کردم که در مورد فیلم من سؤال بپرسید. داستان های مرتبط نیکول کیدمن سزار افتخاری را از آکادمی فیلم فرانسه دریافت می کند اسپیلبرگ به نولان گفت که این فیلم را در ایمکس دیده است و آن را \"یک نمایش دهنده\" نامیده است. وقتی از نولان پرسیده شد که چرا اکنون و چرا اقتباس از شعر هومر را انتخاب کرده است، نولان پاسخ داد: «همیشه برای من سخت است که بفهمم بعد از آن چه کار کنم. احتمالاً یکی از دلایل، اگر آنطور که شما می گویید غیرقابل پیش بینی بوده است، به این دلیل است که برای من نیز همیشه غافلگیرکننده است. من یک پروژه را در یک زمان انجام می دهم. من در توسعه چندین چیز به طور همزمان خوب نیستم، بنابراین یک فیلم را تمام می کنم و سپس به دنبال آنچه ممکن است بعدی", "image_url": "https://variety.com/wp-content/uploads/2026/11/2074516475.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۷ آبان • ۱۹:۴۵"}, {"source": "Billboard", "title": "The New Mariah Carey Barbie Signature Doll Looks Identical to the ‘All I Want for Christmas Is You’ Singer: Shop Here", "link": "https://www.billboard.com/culture/product-recommendations/mariah-carey-2026-christmas-barbie-doll-shop-online-1236384511/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Mariah Carey defrosted and walked straight out of Mattel headquarters. Just in time for the holidays, the Queen of Christmas is adding to her Christmas merch with another Barbie Signature Mariah Carey Doll, one that looks almost eerily identical to the pop superstar herself. The festive collectible is dressed in the singer&#x2019;s iconic look from 1994&#x2019;s &#x201C;All I Want for Christmas Is You&#x201D; music video. This isn&#x2019;t Carey&#x2019;s first time getting the Barbie treatment. Her 2023 Christmas doll was such a hit that its initial release sold out in less than 24 hours. While fans can still hunt down that original edition from Walmart via online resellers, this year&#x2019;s new must-have brings the &#x2019;90s music video, in particular, to life. The 2026 doll will be available Nov. 18 for $80 at Amazon , Target and other major retailers. CHRISTMAS EDITION Barbie Signature Mariah Carey Christmas Doll $80 Buy Now at amazon $80 Buy Now at target The doll is fitted with a red Santa Claus-esque jumpsuit, belt, black ankle boots, dazzling jewelry and ultra-long hair. Released 32 years ago, &#x201C;All I Want for Christmas Is You&#x201D; has grown from a festive pop hit into one of the most recognizable Christmas songs of all time. The track continues to dominate holiday playlists and make its annual return to the Billboard Hot 100 every year, even reaching No. 1 for the first time in 2019 . Jason Tidwell/Mattel Of course, the song&#x2019;s cultural staying power extends well beyond the charts. Every Halloween, the Internet eagerly anticipates the moment Carey officially comes out of hibernation, with fans joking that the singer defrosts at the stroke of midnight on Nov. 1. Carey has fully embraced the tradition, making her annual transition into the Christmas season an event of its own through playful social media videos and festive marketing campaigns, like her yearly &#x201C;It&#x2019;s time&#x201D; video announcements . Now, she&#x2019;s bringing that unmistakable holiday energy to Barbie once again, giving fans another reason to celebrate the most wonderful time of the year. Cody Tatro/Mattel", "date_str": "2026-11-18T16:00:00+00:00", "hash": "28ab0bd9ede33bd3", "title_fa": "عروسک امضاکننده باربی جدید ماریا کری شبیه به خواننده \"همه چیزی که برای کریسمس می خواهم تو هستی\" است: از اینجا خرید کنید", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. ماریا کری یخ زدایی کرد و مستقیماً از دفتر مرکزی متل خارج شد. درست در زمان تعطیلات، ملکه کریسمس با یک عروسک امضاکننده باربی دیگر ماریا کری به کالاهای کریسمس خود اضافه می کند، عروسکی که تقریباً به طرز وحشتناکی شبیه به خود سوپراستار پاپ است. این کلکسیون جشن با ظاهر نمادین این خواننده از موزیک ویدیوی \"All I Want for Christmas Is You\" محصول 1994 پوشیده شده است. این اولین باری نیست که کری تحت درمان باربی قرار می گیرد. عروسک کریسمس 2023 او چنان موفق بود که عرضه اولیه آن در کمتر از 24 ساعت به فروش رفت. در حالی که طرفداران هنوز هم می توانند نسخه اصلی والمارت را از طریق فروشندگان آنلاین دنبال کنند، موزیک ویدیوی جدید امسال به ویژه موزیک ویدیوی دهه 90 را زنده می کند. عروسک 2026 در 18 نوامبر با قیمت 80 دلار در آمازون، تارگت و سایر خرده فروشان بزرگ در دسترس خواهد بود. نسخه کریسمس عروسک کریسمس باربی سیگنیچر ماریا کری 80 دلار همین حالا از آمازون بخرید 80 دلار همین حالا از تارگت بخرید این عروسک یک لباس یک‌سره قرمز شبیه لباس بابانوئل، کمربند، نیم‌بوت‌های مشکی، جواهرات خیره‌کننده و موهای بسیار بلند دارد. «All I Want for Christmas Is You» که 32 سال پیش منتشر شد، از یک آهنگ پاپ شاد به یکی از شناخته‌شده‌ترین آهنگ‌های کریسمس در تمام دوران تبدیل شده است. این آهنگ همچنان بر لیست‌های پخش تعطیلات تسلط دارد و هر سال به بیلبورد Hot 100 بازمی‌گردد، حتی برای اولین بار در سال 2019 به رتبه 1 می‌رسد. جیسون تیدول/متل", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Shop-Mariah-Carey-Christmas-Barbie-Signature-doll-online.png?w=720", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "As the 2026 CMA Awards Are Presented Tonight, Here Are the Races We’re Watching", "link": "https://www.billboard.com/lists/2026-cma-awards-races-to-watch/", "summary": "Many records could be set when the 60th annual CMA Awards are presented tonight (Nov. 18) at Bridgestone Arena in Nashville. One already was set was this morning, with the announcement of winners in two categories on Good Morning America . Tim McGraw won musical event of the year for a record fifth time for “McArthur,” a collab with HARDY , Eric Church and Morgan Wallen . McGraw’s previous wins in the category are for “It’s Your Love” (with Faith Hill); “Find Out Who Your Friends Are (with Tracy Lawrence and Kenny Chesney); “Feel Like a Rock Star” (with Chesney); and “Highway Don’t Care” (with Taylor Swift and Keith Urban). McGraw’s fifth win in the category allows him to break out of a tie with Brad Paisley, Urban, Chesney and Vince Gill, who have won four times each. Related 2026 CMA Awards Predictions: Who Will Win? The 60th annual CMA Awards will air live on ABC tonight at 8:00 p.m. and will stream simultaneously on Disney+ for the first time. (It will be available the next day on Hulu.) Lainey Wilson is set to host the show for the second year in a row. She’ll become the first woman to solo-host the show twice. Dolly Parton and Reba McEntire each did the honors once, in 1988 and 1991, respectively. The CMA Awards present awards to music creators in just 12 categories, compared to a whopping 100 categories at the upcoming Grammy Awards. If you don’t watch the CMA Awards faithfully, this would be a very good year to check in. Three of the five nominees for single of the year made the top five on the Billboard Hot 100, the first time in more than 50 years that that has happened. Here are various records that could be set at the 60th annual CMA Awards.", "date_str": "2026-11-18T15:50:00+00:00", "hash": "0f8f9b135a5da4b5", "title_fa": "با اهدای جوایز CMA 2026 امشب، در اینجا مسابقاتی هستند که ما تماشا می کنیم", "summary_fa": "هنگامی که شصتمین جوایز سالانه CMA امشب (18 نوامبر) در Bridgestone Arena در نشویل برگزار می شود، می توان رکوردهای بسیاری را ثبت کرد. یکی از این رویدادها امروز صبح با اعلام برندگان در دو دسته در صبح بخیر آمریکا تنظیم شده بود. تیم مک‌گرو برای پنجمین بار برای «مک آرتور» که همکاری با هاردی، اریک چرچ و مورگان والن بود، برنده رویداد موسیقی سال شد. برنده های قبلی مک گرو در این رده برای «این عشق توست» (با Faith Hill) است. «پیدا کن که دوستانت چه کسانی هستند (با تریسی لارنس و کنی چسنی)؛ «احساس مثل ستاره راک» (با چسنی)؛ و «بزرگراه مهم نیست» (با تیلور سویفت و کیت اوربان). پنجمین برد مک‌گرو در این رده به او اجازه می‌دهد تا از یک تساوی با اوربانین وی، چهار بار برنده، چنی و براد پیس برنده شود. پیش‌بینی‌های مربوط به جوایز CMA 2026: چه کسی برنده خواهد شد؟ شصتمین دوره جوایز سالانه CMA امشب ساعت 20:00 به صورت زنده از شبکه ABC پخش خواهد شد. و برای اولین بار به طور همزمان در دیزنی + پخش خواهد شد. (روز بعد در Hulu در دسترس خواهد بود.) Lainey Wilson قرار است برای دومین سال متوالی میزبان این برنامه باشد. او اولین زنی خواهد بود که دو بار مجری انفرادی این نمایش را بر عهده دارد. دالی پارتون و ربا مک انتایر هر کدام یک بار به ترتیب در سال های 1988 و 1991 این افتخارات را کسب کردند. جوایز CMA به سازندگان موسیقی تنها در 12 دسته جایزه می‌دهند، در حالی که جوایز گرمی پیش‌رو در 100 دسته جایزه اهدا می‌کند. اگر جوایز CMA را به طور منظم تماشا نمی‌کنید، امسال سال بسیار خوبی برای تماشای آن است. سه نفر از پنج نامزد دریافت جایزه تک‌آهنگ سال، در فهرست پنج آهنگ برتر Billboard Hot 100 قرار گرفتند، که برای اولین بار", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/2247566252-e1790701452269.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۱۹:۲۰"}, {"source": "Billboard", "title": "Rod Wave Indicted on Drug & Gun Charges for Items Allegedly Found in Car After Speeding Stop", "link": "https://www.billboard.com/business/legal/rod-wave-indicted-drug-gun-charges-reckless-driving-stop-1236384773/", "summary": "Rod Wave has been indicted on felony gun and drug charges in Atlanta. In an indictment obtained by Billboard , Fulton County prosecutors accuse the 28-year old hitmaker (born Rodarius Green) of unlawfully possessing oxycodone and a pistol when he was pulled over last year for reckless driving. His attorney did not immediately return a request for comment. The charges filed in October and unsealed this week – stem from the Nov. 7, 2025, incident in which Wave was arrested for allegedly speeding though a stop sign. Atlanta police said he had a .40 caliber Glock with a high-capacity magazine in his waistband as well as drugs and a 9mm handgun in the car, according to Atlanta News First . That arrest happened on the very same day that Wave received his first Grammy nomination for his title track from the critically acclaimed 2025 film Sinners . The rapper was quickly released on $8,000 bail the next day. In a statement to Billboard at the time, Rod Wave’s attorney Drew Findling said his client had been “unjustly profiled and unlawfully arrested” by a controversial Atlanta police unit known for its allegedly “aggressive tactics and emphasis on high arrest numbers.” “Mr. Green was targeted as part of this quota-driven approach, a practice that undermines justice and erodes community trust,” said Findling, a veteran defense attorney who has represented many high profile artists. “We look forward to vigorously challenging this baseless arrest and the clear violations of Mr. Green’s rights in court.” The new indictment is Wave’s second set of criminal charges in Atlanta in the past two years. In October 2025, he was indicted on six counts, including criminal property damage and reckless conduct related to an April 2025 incident at his ور مورد هدف قرار گرفت، رویه ای که عدالت را تضعیف می کند و اعتماد جامعه را از بین می برد.\" «مشتاقانه منتظریم تا در دادگاه به شدت به این دستگیری بی‌اساس و نقض آشکار حقوق آقای گرین اعتراض کنیم.» این کیفرخواست جدید، دومین مجموعه اتهامات کیفری علیه ویو در آتلانتا طی دو", "image_url": "https://www.billboard.com/wp-content/uploads/2025/05/rod-wave-last-lap-tour-2024-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۷ آبان • ۱۹:۰۴"}, {"source": "Billboard", "title": "Yellowjackets Receive Special Welcome Home Performance from Alanis Morissette", "link": "https://www.billboard.com/music/features/yellowjackets-receive-special-welcome-from-alanis-morissette-1236384784/", "summary": "NEW YORK — November 1998 — Alanis Morissette paid tribute to New Jersey’s Yellowjackets soccer team during a special MTV Unplugged performance, dedicating her acoustic set to the survivors whose return has captivated the nation.. The tribute comes amid continued public attention surrounding the team’s rescue and the unanswered questions about their ordeal. While their homecoming has been met with widespread relief, the survivors’ emotional return has underscored the challenges of adjusting to life after their harrowing experience. Known for her deeply personal songwriting, Morissette brought a particularly poignant tone to the performance. With electric guitars stripped away, familiar hits including “You Learn” and “Ironic” took on new meaning in the context of the team’s survival, touching on themes of resilience, uncertainty and the complicated emotions that follow life-altering experiences. The Yellowjackets’ return has been anything but conventional. Greeted by a barrage of reporters and camera flashes, the visibly overwhelmed survivors have offered few details about their time away. Lottie Matthews, in particular, drew attention following an unsettling appearance at the town’s memorial ceremony, adding to growing questions about what the d, waar wetenschappers in het geheim experimenteren met het versturen van signalen naar de ruimte. Wat Ye daar ontdekt en besluit te doen, zet een reeks gebeurtenissen in gang die pas veel later duidelijk worden. In het heden worden wetenschappers over de hele wereld geconfronteerd met onverklaarbare verschijnselen. Natuurkundige experimenten leveren plotseling onmogelijke resultaten op en verschillende vooraanstaande onderzoekers sterven onder mysterieuze omstandigheden. Ook beginnen sommige wetenschappers vreemde aftellingen te zien die niemand anders kan waarnemen. Wanneer een groep voormalige studievrienden uit Oxford bij de gebeurtenissen betrokken raakt, proberen ze te achterhalen wat er aan de hand is. Een van hen, Jin Cheng, krijgt toegang tot een bijzonder geavanceerd virtualrealityspel waarin ze een buitenaardse wereld moet zien te redden. Op deze planeet zorgen drie zonnen voor extreme en onvoorspelbare omstandigheden, waardoor beschavingen telkens opnieuw worden vernietigd. Langzaam ontdekken de vrienden dat het spel veel meer is dan een vorm van entertainment. Het blijkt verbonden te zijn met een buitenaardse beschaving die contact heeft gelegd met de aarde. Bovendien zijn er mensen die deze buitenaardse bezoekers als de redding van de mensheid beschouwen, terwijl anderen vrezen dat hun komst het einde van de menselijke beschaving zal betekenen. Ondertussen probeert een internation", "date_str": "2026-11-18T15:13:53+00:00", "hash": "3dc26397ff1f7734", "title_fa": "سریال 300 میلیونی بالاخره به نتفلیکس بازگشت", "summary_fa": "امروزه ساخت یک سریال هزینه زیادی دارد، اما مطمئناً شما همیشه رئیس بالاتر از رئیس دارید. و فصل 1 از 3 Body Problem چنین رئیسی بود، زیرا تقریباً 300 میلیون دلار برای آن اختصاص داده شد. 3 Body Problem به نتفلیکس بازگشت هنگامی که 3 Body Problem در سال 2024 در نتفلیکس منتشر شد، این سریال پس از فصل چهارم Stranger Things دومین سریال گران قیمت در تاریخ این سرویس پخش بود. فصل 5 این سریال قبلاً با بودجه 60 میلیون یورویی برای هر قسمت، دوباره آن
