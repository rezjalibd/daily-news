chCrunch را دریافت کنید."}, {"source": "TechCrunch Main", "title": "Waymo is scaling fast: Here’s what the fleet data shows", "link": "https://techcrunch.com/2026/09/24/waymo-is-scaling-fast-heres-what-the-fleet-data-shows/", "summary": "In the past month, Waymo has expanded its fleet in Texas by 49%. There are other hot spots as well.", "date_str": "2026-09-24T23:24:33+00:00", "hash": "3a66a601593ee047", "title_fa": "Waymo به سرعت در حال مقیاس‌پذیری است: داده‌های ناوگان نشان می‌دهند", "summary_fa": "در ماه گذشته، Waymo ناوگان خود را در تگزاس تا 49 درصد افزایش داده است. نقاط داغ دیگری نیز وجود دارد. روبات‌اکسی تجاری Waymo، هم از نظر دسترسی جغرافیایی و هم از نظر سواری، گسترده به نظر می‌رسد. و تقریباً با هر معیاری، اینطور است - تا زمانی که توجه کنید که بخش عمده ای از رباتاکسی ها واقعاً در کجا ظاهر می شوند. اعداد و ارقام در دو سال گذشته منعکس کننده نوع عرضه تجاری است که از یک شرکت پرجمعیت مانند Waymo انتظار دارید، که از گوگل خارج شده و همچنان آلفابت را مالک اکثریت آن می داند. در سپتامبر 2024، Waymo تنها در سه شهر فینیکس، لس آنجلس و سانفرانسیسکو فعالیت می کرد. امروزه، خدمات روباتاکسی را در 15 شهر ایالات متحده ارائه می دهد که بیشتر این راه اندازی های تجاری در سال گذشته انجام شده است. سواری نیز سر به فلک کشیده است و Waymo اکنون به طور میانگین هر هفته 500000 رباتاکسی سواری پولی دریافت می کند. اما نگاهی دقیق تر به ناوگان آن نشان می دهد که یک شرکت تلاش های خود را تنها در دو ایالت متمرکز کرده است. حدود 80 درصد از تقریباً 4000 رباتاکسی Waymo در کالیفرنیا و تگزاس هستند و تگزاس جایی است که اکنون در حال انجام است: ناوگان Waymo در آنجا در سه هفته گذشته تقریباً به نصف افزایش یافته است که با سوخت یک مینی ون جدید ساخت چین که شرکت شرط می‌بندد به آن کمک می‌کند، حتی اگر تعرفه‌ها هزینه‌های آن را افزایش می‌دهد، کمک کند. حدود 800 وسیله نقلیه دیگر در شهرهای دیگر ایالت ها، از جمله آریزونا و فلوریدا، یکی دیگر از نقاط داغ در حال رشد، پراکنده شده اند. اکثر آنها شاسی بلندهای الکتریکی سفید Jaguar I-Pace هستند، اما تعداد فزاینده‌ای مینی‌ون‌های جدید Zeekr RT اصلاح‌شده‌ای هستند که Waymo آن‌ها را Ojai"}, {"source": "TechCrunch Main", "title": "Nexterity wants to automate the hard, dangerous part of pipefitting", "link": "https://techcrunch.com/2026/09/24/nexterity-wants-to-automate-the-hard-dangerous-part-of-pipefitting/", "summary": "The startup's robot can tighten or loosen four bolts at a time, and it fits in a Pelican case.", "date_str": "2026-09-24T20:45:00+00:00", "hash": "ebf47e964c96376a", "title_fa": "Nexterity می خواهد بخش سخت و خطرناک لوله کشی را خودکار کند", "summary_fa": "ربات استارت آپ می تواند چهار پیچ را در یک زمان سفت یا باز کند و در یک جعبه پلیکان قرار می گیرد. لیندسی الیوت در پیچ و مهره های بزرگ است. در سیزدهمین سالانه سمپوزیوم بولتینگ سال گذشته، او گفت که نکته برجسته بازی Bolting Bingo در برابر بسیاری از دمنوش های خودخوانده گشتاور بود که در اتاق بودند. الیوت، مهندس و برنامه‌ریز سابق اکسون موبیل، سال‌ها به فکر بهبود زیرساخت‌های انتقال نفت، گاز و پتروشیمی بوده است. پیچ و مهره همان چیزی است که او روی آن فرود آمد. به طور خاص، پیچ‌هایی که بخش‌هایی از لوله را به هم متصل می‌کنند (از نظر فنی اتصالات فلنج پیچ‌دار نامیده می‌شوند). این پیچ و مهره ها برای شل شدن و سفت شدن نیاز به کار سخت و فیزیکی دارند و منشا بسیاری از آسیب های لوله کش هستند. مانند بسیاری از صنایع تجاری، کمبود نیروی کار نیز وجود دارد. او به TechCrunch گفت، این افراد وقتی از آنها خواسته می شود 12 ساعت در روز برای سه ماه متوالی کار کنند، واقعا خسته می شوند. من با لوله‌سازان در سراسر ایالات متحده، در سراسر کانادا صحبت کرده‌ام، و بارها به من گفته شده که بهره‌وری لوله‌سازی در آمریکای شمالی به طرز چشمگیری پایین است. راه حلی که الیوت در استارتاپ خود Nexterity که یکی از Startup Battlefield 200 برای شرکت در TechCrunch Disrupt انتخاب شده است، یک ربات کنترل از راه دور است که می تواند این بخش از کار را انجام دهد. این ایده ای است که می تواند اساساً این شغل خاص یقه آبی را تغییر دهد، اگر به طور گسترده مورد استفاده قرار گیرد و کارگران را ایمن تر و بهره وری تر کند. این ربات در دو قطعه اصلی تولید می شود که در اطراف یک لوله قرار می گیرند. این ربات با استفاده از"}, {"source": "TechCrunch Main", "title": "Meet Feather, the startup building the ‘Android of robotics’ for developers", "link": "https://techcrunch.com/2026/09/24/meet-feather-the-startup-building-the-android-of-robotics-for-developers/", "summary": "Feather is betting on a customizable, $30,000 platform built for software developers.", "date_str": "2026-09-24T18:52:38+00:00", "hash": "b32b56d74a6ecb90", "title_fa": "با Feather، استارت آپی که «اندروید روباتیک» را برای توسعه دهندگان ایجاد می کند، آشنا شوید", "summary_fa": "Feather روی یک پلتفرم قابل تنظیم 30000 دلاری که برای توسعه دهندگان نرم افزار ساخته شده است شرط بندی می کند. اگر بنیان‌گذاران و سرمایه‌گذاران رباتیک روی یک چیز توافق دارند، این است که «لحظه ChatGPT» که در آن یک ربات همه‌منظوره می‌تواند به طور یکپارچه با هر محیطی سازگار شود، فرا نرسیده است. نظرات در مورد اینکه آیا این پیشرفت در نزدیکی است یا یک دهه دیگر متفاوت است. Feather Robotics، یک استارت آپ انسان نما که سال گذشته تأسیس شد، در حال توسعه یک ربات برای هر دو خط زمانی است. برخلاف تسلا یا فیگور که در حال مقابله با ماموریت عالی ساختن بدن و مغز بنیادی هستند که هنوز به طور گسترده به کار گرفته نشده است، Feather ابزار سخت‌افزاری و نرم‌افزاری را برای توسعه‌دهندگان فراهم می‌کند تا در حال حاضر وظایف دنیای واقعی را انجام دهند. هوآ مای، یکی از بنیانگذاران Feather به TechCrunch گفت: «امروز نمی توانید یک ربات تسلا بخرید و در بالای آن توسعه دهید. ما متوجه شدیم که اکثر شرکت‌ها به این شکل موفق نشدند. پخش‌کننده‌های سخت‌افزاری مانند انویدیا یا اپل با محصولی شروع کردند که کار می‌کرد و قابل استقرار بود، و سپس به مرور زمان به پیچیدگی اضافه کردند. در سال 2025، پس از فروخته شدن استارت‌آپ انسان‌نمای قبلی‌اش به 1X، مای (تصویر بالا، سمت چپ) با پارسا بختیاری (تصویر بالا، سمت راست)، مهندس سابق تسلا مدل 3 که در مقطعی مستقیماً به ایلان ماسک گزارش داد، همکاری کرد تا چیزی بسازد که این دو نفر امیدوارند به اندروید رباتیک تبدیل شود. این چشم‌انداز برای Gradient Ventures جذاب بود، که در ابتدای راه‌اندازی از Feather حمایت می‌کرد و پیش‌تر راند 7.6 میلیون دلاری پیش‌بنیاد این استارت‌آپ را رهبری می‌کرد. از آن زمان، Feather یک سیستم رباتیک مدولار را راه اندازی کرده است که به توسعه دهندگان اجازه می دهد تا"}, {"source": "TechCrunch Main", "title": "Databricks buys Row Zero and is scouting for more startups to acquire", "link": "https://techcrunch.com/2026/09/24/databricks-buys-row-zero-and-is-scouting-for-more-startups-to-acquire/", "summary": "Databricks has bought cloud spreadsheet startup Row Zero, adding yet another acquisition to its 2026 shopping spree.", "date_str": "2026-09-24T17:07:55+00:00", "hash": "1cd91ed452f5fe3d", "title_fa": "Databricks Row Zero را خریداری می کند و به دنبال استارت آپ های بیشتری برای خرید است", "summary_fa": "Databricks استارتاپ صفحه‌گسترده ابری Row Zero را خریداری کرده است و خرید دیگری را به خرید سال 2026 خود اضافه کرده است. دیتبریکس روز پنجشنبه اعلام کرد که یک استارتاپ صفحه گسترده در مراحل اولیه به نام Row Zero را خریداری کرده است. داستان از این قرار است که تیم مالی Databricks عاشق Row Zero شد زیرا یک ابزار ابری بود که می‌توانست بیش از ۱ میلیون ردیف صفحه‌گسترده زنده را افزایش دهد. آنها Row Zero را با عامل هوش مصنوعی داخلی Databricks به نام Genie ترکیب می کردند. با استفاده از Genie، کاربران Databricks می‌توانند از دستورهای زبان طبیعی برای پرسیدن سؤالات تجاری پیچیده از داده‌های ذخیره‌شده در سیستم‌های Databricks، مانند تجزیه و تحلیل حاشیه سود یا وضعیت چشم‌اندازهای فروش، استفاده کنند. وقتی تیم اجرایی از تیم مالی درباره این ابزار ابری که استفاده می‌کردند پرسید، یک لامپ خاموش شد. صفحات گسترده یکی از این رابط ها هستند که هر تحلیلگر کسب و کار آن را دوست دارد. بنابراین بسیار منطقی است که با هوش تجاری (BI)، نمایندگان و صفحات گسترده ازدواج کنیم! علی قدسی، مدیر عامل Databricks در X در مورد چگونگی کاهش خرید پستی منتشر کرد. بنابراین داده‌های ایمن یک شرکت در فضای ذخیره‌سازی ابری Databricks زندگی می‌کنند و عوامل هوش مصنوعی و انسان‌ها به جای استفاده و یادگیری برخی نرم‌افزارهای هوش تجاری دیگر، از طریق فرمت صفحه‌گسترده و فرمول‌هایی که به خوبی می‌دانند، با آن تعامل دارند. با ادغام ردیف صفر با Databricks، داده‌ها را می‌توان در قالب صفحه‌گسترده دستکاری کرد، اما امن باقی می‌ماند، نه اینکه به صفحه‌گسترده ناامنی که در اطراف به اشتراک گذاشته می‌شود، منتقل شود. شرایط معامله فاش نشد. طبق گفته PitchBook، Row Zero که توسط مهندسان سابق AWS و Tableau تأسیس شد، در ماه می 2025، 10 میلیون دلار جمع آوری کرد که در آن زمان ارزش تخمینی آن 40 میلیون"}, {"source": "VentureBeat Tech", "title": "Microsoft revamps its Copilot AI with a persistent Autopilot agent and hosting for AI-generated apps", "link": "https://venturebeat.com/technology/microsoft-revamps-its-copilot-ai-with-a-persistent-autopilot-agent-and-hosting-for-ai-generated-apps", "summary": "Microsoft is giving Copilot a larger role in running the workplace, announcing a redesign Friday that combines Office collaboration, software creation and autonomous agents that continue assignments after their human colleagues sign off. Read more", "date_str": "2026-09-25T12:00:00+00:00", "hash": "4fb8d80332351298", "title_fa": "مایکروسافت هوش مصنوعی Copilot خود را با یک عامل خودکار پایلوت دائمی و میزبانی برنامه‌های تولید شده توسط هوش مصنوعی اصلاح می‌کند.", "summary_fa": "مایکروسافت به Copilot نقش بزرگ‌تری در اداره محل کار می‌دهد و یک جمعه طراحی مجدد را اعلام می‌کند که ترکیبی از همکاری آفیس، ایجاد نرم‌افزار و عوامل مستقلی است که پس از امضای همکاران انسانی خود به وظایف خود ادامه می‌دهند. ادامه مطلب"}, {"source": "VentureBeat Tech", "title": "Should your enterprise build a custom AI harness? Inkitt did for AI video — 5 key takeaways", "link": "https://venturebeat.com/technology/should-your-enterprise-build-a-custom-ai-harness-inkitt-did-for-ai-video-5-key-takeaways", "summary": "The most exciting area of development in enterprise AI right now isn t models, nor is it even agents: it s the harness. Read more", "date_str": "2026-09-24T19:27:38+00:00", "hash": "4baeb3ab82330977", "title_fa": "آیا شرکت شما باید یک مهار AI سفارشی بسازد؟ Inkitt برای ویدیوهای هوش مصنوعی انجام داد - 5 نکته کلیدی", "summary_fa": "هیجان‌انگیزترین حوزه توسعه در هوش مصنوعی سازمانی در حال حاضر مدل‌ها و حتی عوامل نیستند: مهار است. ادامه مطلب"}, {"source": "Ars Technica", "title": "CDC opens state ordering for COVID-19 vaccines after unexplained delay", "link": "https://arstechnica.com/health/2026/09/cdc-opens-state-ordering-for-covid-19-vaccines-after-unexplained-delay/", "summary": "After a nearly monthlong delay, states are now able to order this season's COVID-19 vaccines through a federal program that provides free immunizations to low-income children, the US health department says. Trump officials have still not provided a clear explanation for the delay, raising concerns about meddling from anti-vaccine Health Secretary Robert F. Kennedy Jr. On Wednesday, Ars Technica reported that the Centers for Disease Control and Prevention had still not opened ordering for 2026–2027 COVID-19 vaccines through the Vaccines for Children program. That was despite the vaccines having been approved by the Food and Drug Administration in late August. The Department of Health and Human Services (HHS) told Ars on Wednesday that “CDC has not yet finalized procurement decisions\" for the shots. The department's statement further suggested Trump officials were questioning whether children should receive them. \"HHS and CDC are committed to responsible stewardship of taxpayer resources and to ensuring that vaccines purchased through federally funded programs are appropriate for the populations those programs serve,\" the department said. Read full article Comments", "date_str": "2026-09-24T22:29:48+00:00", "hash": "9a6d52c31ca3450a", "title_fa": "CDC سفارش ایالتی واکسن کووید-19 را پس از تاخیر غیرقابل توضیح باز می کند", "summary_fa": "وزارت بهداشت ایالات متحده می گوید، پس از یک تاخیر تقریباً یک ماهه، ایالت ها اکنون می توانند واکسن های این فصل کووید-19 را از طریق یک برنامه فدرال که واکسیناسیون رایگان برای کودکان کم درآمد فراهم می کند، سفارش دهند. مقامات ترامپ هنوز توضیح روشنی برای تأخیر ارائه نکرده اند و نگرانی رابرت اف کندی جونیور وزیر بهداشت ضد واکسن را در مورد مداخله ایجاد کرده است. روز چهارشنبه، Ars Technica گزارش داد که مراکز کنترل و پیشگیری از بیماری هنوز سفارش واکسن‌های 2026-2027 COVID-19 را از طریق برنامه واکسن برای کودکان آغاز نکرده است. این در حالی بود که واکسن ها توسط سازمان غذا و دارو در اواخر ماه اوت تایید شده بود. وزارت بهداشت و خدمات انسانی (HHS) روز چهارشنبه به Ars گفت که \"CDC هنوز تصمیمات تدارکاتی را نهایی نکرده است.\" بیانیه این وزارت همچنین حاکی از آن است که مقامات ترامپ در حال سوال هستند که آیا کودکان باید آنها را دریافت کنند یا خیر. وزارت بهداشت گفت: \"HHS و CDC متعهد به نظارت مسئولانه بر منابع مالیات دهندگان و اطمینان از اینکه واکسن های خریداری شده از طریق برنامه های بودجه فدرال برای جمعیت هایی که این برنامه ها به آنها خدمت می کنند، هستند، متعهد هستند.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش، وزارت بهداشت ایالات متحده می‌گوید پس از یک تاخیر تقریباً یک ماهه، ایالت‌ها اکنون می‌توانند واکسن‌های کووید-19 این فصل را از طریق یک برنامه فدرال سفارش دهند که واکسیناسیون رایگان برای کودکان کم‌درآمد ارائه می‌کند. مقامات ترامپ هنوز توضیح روشنی برای تأخیر ارائه نکرده اند و نگرانی رابرت اف کندی جونیور وزیر بهداشت ضد واکسن را در مورد مداخله ایجاد کرده است."}, {"source": "Ars Technica", "title": "Donald Duck's uncle was partly based on Wernher von Braun", "link": "https://arstechnica.com/space/2026/09/disneys-ludwig-von-drake-was-inspired-by-rocket-scientists-65-years-ago/", "summary": "Did you know that the first character that Walt Disney created to specifically appear on television was inspired, in part, by early Space Age rocket scientists? On this day 65 years ago (September 24, 1961), Disney introduced the \"renowned scientist, lecturer, psychologist [and] world traveler,\" Ludwig Von Drake. A member of the Duck family (he is the \"brilliant and eccentric\" uncle of Donald Duck), Von Drake was \"the outstanding genius of the century\" (per Disney himself) who helped to explain scientific principles and technological concepts to the millions of people who tuned in every Sunday to watch Walt Disney's Wonderful World of Color on NBC. A few years later, after expertly (but often absent-mindedly) addressing topics such as how color television works, the health benefits of exercising, and the history of aviation, Von Drake dove into the topic for which he said he wrote the book on, in the February 10, 1963, episode \"Inside Outer Space.\" Read full article Comments", "date_str": "2026-09-24T21:40:07+00:00", "hash": "644d3caaab9b4fd6", "title_fa": "عموی دونالد داک تا حدی بر اساس ورنر فون براون بود", "summary_fa": "آیا می دانستید که اولین شخصیتی که والت دیزنی خلق کرد تا به طور خاص در تلویزیون ظاهر شود، تا حدی از دانشمندان موشکی اولیه عصر فضایی الهام گرفته شده است؟ 65 سال پیش در چنین روزی (24 سپتامبر 1961)، دیزنی \"دانشمند، مدرس، روانشناس [و] جهانگرد مشهور\"، لودویگ فون دریک را معرفی کرد. فون دریک که یکی از اعضای خانواده داک است (او عموی \"باهوش و عجیب\" دونالد داک است)، \"نابغه برجسته قرن\" (به گفته خود دیزنی) بود که به توضیح اصول علمی و مفاهیم تکنولوژیک برای میلیون ها نفری که هر یکشنبه برای تماشای دنیای رنگی شگفت انگیز والت دیزنی در NBC کوک می شدند، کمک کرد. چند سال بعد، پس از پرداختن ماهرانه (اما اغلب غیبت‌آمیز) به موضوعاتی مانند نحوه عملکرد تلویزیون رنگی، فواید ورزش برای سلامتی و تاریخچه هوانوردی، فون دریک در اپیزود «درون فضای بیرون» در 10 فوریه 1963 به موضوعی پرداخت که به گفته خودش کتاب را برای آن نوشته است. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید آیا می‌دانستید که اولین شخصیتی که والت دیزنی خلق کرد تا به طور خاص در تلویزیون ظاهر شود، تا حدی از دانشمندان موشکی اولیه عصر فضا الهام گرفته شده است؟ فون دریک در ابتدای بخش انیمیشن می‌گوید: \"شما مردم بیرون، ستاره‌هایی را خواهید دید که قبلاً هرگز ندیده‌اید... وقتی به سفر در فضای بیرونی می‌روید. در واقع، چیزهای زیادی در آنجا وجود دارد که در مورد آنها نمی‌دانید، اما اجازه ندهید که شما را آزار دهد، زیرا همه پاسخ‌ها همین جاست. من کتاب راهنمای خود را Inside Outer Space می نامم زیرا همه چیزهایی که در مورد فضای بیرونی می دانیم در داخل هستند."}, {"source": "Ars Technica", "title": "F-Droid gets its biggest update in a decade with new UI and smoother app installs", "link": "https://arstechnica.com/gadgets/2026/09/f-droid-gets-its-biggest-update-in-a-decade-with-new-ui-and-smoother-app-installs/", "summary": "Virtually every Android device comes with the Play Store preloaded, but there are other ways to get apps. F-Droid bills itself as a community-driven source for free and open source Android apps, but its official app store has gone 10 years without a major update. That's finally changing: After a multiyear effort, the team has just announced F-Droid 2.0 is rolling out. The new F-Droid client was redesigned from scratch in Kotlin Compose, which is the standard for modern Android apps. This makes the store much more responsive, and there's optional support for Android's Material theming. The interface has also been cleaned up considerably, making the most important functions easier to access and hiding some others in overflow menus. While the new F-Droid looks nicer, the update was largely about making it easier to find and install apps. When F-Droid first appeared, there wasn't much to see, but now it has thousands of open source apps. Unlike the Play Store, F-Droid doesn't track your taps and installs to push ads and suggestions—it helps you find things and gets out of the way. Read full article Comments", "date_str": "2026-09-24T19:30:42+00:00", "hash": "05b54402f31d2e44", "title_fa": "F-Droid بزرگترین به روز رسانی خود را در یک دهه با رابط کاربری جدید و نصب نرم افزارهای نرم افزاری دریافت می کند", "summary_fa": "تقریباً هر دستگاه اندرویدی دارای Play Store از پیش بارگذاری شده است، اما راه‌های دیگری برای دریافت برنامه‌ها وجود دارد. F-Droid خود را به عنوان یک منبع مبتنی بر جامعه برای برنامه های رایگان و متن باز اندروید معرفی می کند، اما فروشگاه برنامه رسمی آن 10 سال است که بدون به روز رسانی عمده کار می کند. این در نهایت در حال تغییر است: پس از تلاش چند ساله، تیم به تازگی اعلام کرده است که F-Droid 2.0 در حال عرضه است. کلاینت جدید F-Droid از ابتدا در Kotlin Compose، که استاندارد برنامه های اندرویدی مدرن است، دوباره طراحی شد. این باعث می‌شود فروشگاه بسیار پاسخگوتر باشد و پشتیبانی اختیاری از قالب‌بندی Material Android وجود دارد. این رابط نیز به میزان قابل توجهی تمیز شده است و دسترسی به مهمترین عملکردها را آسانتر کرده و برخی دیگر را در منوهای سرریز پنهان می کند. در حالی که F-Droid جدید زیباتر به نظر می رسد، به روز رسانی تا حد زیادی برای آسان تر کردن یافتن و نصب برنامه ها بود. زمانی که F-Droid برای اولین بار ظاهر شد، چیز زیادی برای دیدن وجود نداشت، اما اکنون هزاران برنامه منبع باز دارد. برخلاف Play Store، F-Droid ضربه‌ها و نصب‌های شما را برای ارائه تبلیغات و پیشنهادات ردیابی نمی‌کند - به شما کمک می‌کند چیزهایی را پیدا کنید و از سر راه خود خارج شوید. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش تقریباً هر دستگاه Android با Play Store از پیش بارگذاری شده ارائه می شود، اما راه های دیگری برای دریافت برنامه ها وجود دارد. F-Droid خود را به عنوان یک منبع مبتنی بر جامعه برای برنامه های رایگان و متن باز اندروید معرفی می کند، اما"}, {"source": "Ars Technica", "title": "New York defies Trump admin, asks court to shut down Polymarket gambling", "link": "https://arstechnica.com/tech-policy/2026/09/new-york-asks-court-to-shut-down-polymarkets-illegal-gambling-operation/", "summary": "New York sued Polymarket today, alleging that it runs an \"illegal gambling operation\" through its prediction market. “By running an unlicensed gambling operation, Polymarket has done more than just knowingly violate state law, they have put New Yorkers at risk, especially those underage who are most vulnerable to problem gaming,\" Governor Kathy Hochul said in a press release announcing the lawsuit. Polymarket is \"sidestepping its obligation to pay taxes like licensed casinos and mobile sports gambling platforms do,\" New York said. \"This tax revenue from gambling regulation funds public schools, sports programs for underserved youth, and problem gambling education and treatment.\" Read full article Comments", "date_str": "2026-09-24T19:07:19+00:00", "hash": "e60edddd1747b048", "title_fa": "نیویورک از مدیر ترامپ سرپیچی می کند و از دادگاه می خواهد که قمار پلی مارکت را تعطیل کند", "summary_fa": "نیویورک امروز از Polymarket شکایت کرد و ادعا کرد که این شرکت یک \"عملیات قمار غیرقانونی\" را از طریق بازار پیش بینی خود اجرا می کند. فرماندار کتی هوچول در بیانیه ای مطبوعاتی با اعلام این شکایت گفت: «با اجرای یک عملیات قمار بدون مجوز، پلی مارکت بیش از اینکه آگاهانه قوانین ایالتی را زیر پا بگذارد، مردم نیویورک را در معرض خطر قرار داده است، به ویژه آن دسته از افراد زیر سن قانونی که بیشترین آسیب پذیری را در برابر مشکلات بازی دارند.» نیویورک گفت که پلی مارکت از تعهد خود برای پرداخت مالیات مانند کازینوهای دارای مجوز و پلتفرم‌های قمار ورزشی سیار کنار می‌زند. این درآمد مالیاتی ناشی از مقررات قمار، بودجه مدارس دولتی، برنامه‌های ورزشی برای جوانان محروم، و آموزش و درمان مشکل قمار را تأمین می‌کند.» مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. نیویورک گفت که پلی مارکت از تعهد خود برای پرداخت مالیات مانند کازینوهای دارای مجوز و پلتفرم‌های قمار ورزشی سیار کنار می‌زند. این درآمد مالیاتی ناشی از مقررات قمار، بودجه مدارس دولتی، برنامه‌های ورزشی برای جوانان محروم، و آموزش و درمان مشکل قمار را تأمین می‌کند.» نیویورک گفت که پلی مارکت \"برای کاربران بین 18 تا 20 سال در دسترس است، اگرچه قانون نیویورک برای شرکت در شرط بندی های ورزشی تلفن همراه، افراد را ملزم می کند حداقل 21 سال سن داشته باشد.\" نیویورک قبلاً از کالشی، رقیب اصلی پلی مارکت شکایت کرده بود."}, {"source": "Ars Technica", "title": "We have a trailer for Musk documentary Elon called a \"hit piece\"", "link": "https://arstechnica.com/culture/2026/09/we-have-a-trailer-for-musk-documentary-elon-called-a-hit-piece/", "summary": "Oscar-winning documentary filmmaker Alex Gibney has never been one to shy away from controversy. His latest feature, Musk , has stirred up plenty even before its release, drawing the ire of its subject, Elon Musk, and threats of a defamation lawsuit. After the film debuted two weeks ago at the Venice International Film Festival, rumors swirled that Universal Pictures was getting cold feet about theatrically releasing the film in international markets. Those rumors appear to be unfounded (at least for now). And Musk is still on track for a US theatrical release, thanks to the folks at domestic distributor Bleecker Street Media, which released the official trailer today. Gibney has been making documentaries since the 1980s, covering such varied subjects as Jimi Hendrix, Hunter S. Thompson and gonzo journalism, WikiLeaks, Scientology, Steve Jobs, Elizabeth Holmes (the subject of another forthcoming documentary, You Can See Everything , featuring comedian Nathan Fielder), Boris Becker, The Sopranos creator David Chase , alleged Russian interference in the US 2016 presidential election, the opioid epidemic, and cyclist Lance Armstrong. He snagged his first Oscar nomination for 2005's Enron: The Smartest Guys in the Room , and won the Oscar for Best Documentary Feature two years later for Taxi to the Dark Side . Read full article Comments", "date_str": "2026-09-24T18:52:23+00:00", "hash": "c3ccf5f38ba2b15e", "title_fa": "ما یک تریلر از مستند ماسک Elon داریم به نام \"هیت قطعه\"", "summary_fa": "الکس گیبنی، مستندساز برنده اسکار، هرگز کسی نبوده که از بحث و جدل دوری کند. جدیدترین فیلم او، ماسک، حتی قبل از اکرانش بسیار برانگیخته شده و خشم سوژه خود، ایلان ماسک، و تهدید به دعوای افترا را برانگیخته است. پس از اکران این فیلم دو هفته پیش در جشنواره بین المللی فیلم ونیز، شایعاتی مبنی بر اینکه یونیورسال پیکچرز در مورد اکران تئاتری این فیلم در بازارهای بین المللی سردرگم شده است. به نظر می رسد که این شایعات بی اساس هستند (حداقل در حال حاضر). و ماسک هنوز در مسیر اکران در سینماهای ایالات متحده است، به لطف توزیع کننده داخلی Bleecker Street Media که امروز تریلر رسمی آن را منتشر کرد. گیبنی از دهه 1980 فیلم های مستند می ساخت و موضوعات مختلفی مانند جیمی هندریکس، هانتر اس. تامپسون و روزنامه نگاری گونزو، ویکی لیکس، ساینتولوژی، استیو جابز، الیزابت هولمز (موضوع مستند دیگری با نام You Can See Everything، با حضور کمدین ناتان فیلدر)، بوریس بکر، خالق سوپرانوها، دیوید چیس، مداخله ادعایی روسیه در انتخابات ریاست جمهوری آمریکا، 201 آرمسترانگ او اولین نامزدی اسکار خود را در سال 2005 برای فیلم Enron: The Smartest Guys in the Room به دست آورد و دو سال بعد برای فیلم Taxi to the Dark Side برنده اسکار بهترین فیلم مستند بلند شد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید. جدیدترین فیلم او، ماسک، حتی قبل از اکرانش بسیار برانگیخته شده و خشم سوژه خود، ایلان ماسک، و تهدید به دعوای افترا را برانگیخته است. پس از اکران این فیلم دو هفته پیش در جشنواره بین المللی فیلم ونیز، شایعاتی مبنی بر اینکه یونیورسال پیکچرز در مورد اکران تئاتری این فیلم در بازارهای بین المللی سردرگم شده است."}, {"source": "Ars Technica", "title": "Robots make combat airdrops, clear mines as Ukraine defeats Russian pincer", "link": "https://arstechnica.com/gadgets/2026/09/robots-make-combat-airdrops-clear-mines-as-ukraine-defeats-russian-pincer/", "summary": "Ukraine’s military robots are dropping from heavy drones in airborne assaults behind Russian lines as other robots clear mines ahead of advancing Ukrainian infantry. The wheeled ground robots are supporting Ukraine’s Operation Vivaldi counterattack that has crushed a Russian military pincer movement and liberated dozens of square miles of occupied Ukrainian territory so far. The Ukrainian Third Army Corps revealed a “world-first” airborne assault involving robots and drones that took place within Russian-held territory on September 21, 2026, according to the Ukrainian government media platform United24 . Heavy bomber drones air-dropped explosive ground robots more than six miles behind Russian frontlines, helping the robots bypass tough terrain and enemy defenses to attack supply lines in the rear. This is not the first time that Ukraine has used heavy drones to deliver robots closer to their intended targets. But the incident is reportedly the most ambitious robotic airborne assault to date. Read full article Comments", "date_str": "2026-09-24T18:39:47+00:00", "hash": "73d59f9d7bffff2c", "title_fa": "ربات‌ها پرتاب‌های هوایی می‌سازند، مین‌ها را پاکسازی می‌کنند، زیرا اوکراین پینسر روسیه را شکست می‌دهد", "summary_fa": "ربات‌های نظامی اوکراین از پهپادهای سنگین در حملات هوایی در پشت خطوط روسیه سقوط می‌کنند، زیرا روبات‌های دیگر پیش از پیشروی پیاده نظام اوکراینی، مین‌ها را پاکسازی می‌کنند. روبات‌های زمینی چرخدار از ضدحمله عملیات ویوالدی اوکراین پشتیبانی می‌کنند که جنبش انبر نظامی روسیه را درهم شکسته و ده‌ها مایل مربع از خاک اوکراین را تا کنون آزاد کرده است. به گفته پلتفرم رسانه ای دولت اوکراین United24، سپاه سوم ارتش اوکراین یک حمله هوایی «اولین بار در جهان» شامل ربات ها و پهپادها را که در قلمرو تحت کنترل روسیه در 21 سپتامبر 2026 انجام شد، فاش کرد. هواپیماهای بدون سرنشین بمب افکن های سنگین، ربات های زمینی انفجاری را بیش از شش مایل پشت خط مقدم روسیه پرتاب کردند و به ربات ها کمک کردند تا زمین های سخت و دفاع دشمن را برای حمله به خطوط تدارکات در عقب دور بزنند. این اولین بار نیست که اوکراین از پهپادهای سنگین برای تحویل ربات‌ها به اهداف مورد نظرشان استفاده می‌کند. اما گزارش شده است که این حادثه جاه طلبانه ترین حمله هوایی رباتیک تا به امروز است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید ربات های نظامی اوکراین در حملات هوایی در پشت خطوط روسی از پهپادهای سنگین سقوط می کنند زیرا روبات های دیگر قبل از پیشروی پیاده نظام اوکراینی مین ها را پاکسازی می کنند. روبات‌های زمینی چرخدار از ضدحمله عملیات ویوالدی اوکراین پشتیبانی می‌کنند که جنبش انبر نظامی روسیه را درهم شکسته و ده‌ها مایل مربع از خاک اوکراین را تا کنون آزاد کرده است. چند روز بعد، رسانه دفاعی اوکراینی Militarnyi گزارش داد که سپاه سوم ارتش به طور جداگانه از ربات های زمینی بیشتری برای پاکسازی ایمن مین های ضد نفر از مسیرهای بیش از 18"}, {"source": "Ars Technica", "title": "New Jersey fines data center $1.1M after drone pics expose 62 gas generators", "link": "https://arstechnica.com/tech-policy/2026/09/new-jersey-fines-data-center-1-1m-after-satellite-pics-expose-62-gas-generators/", "summary": "This week, New Jersey ordered the operator of one of the East Coast’s largest planned data centers to pay a $1.1 million fine for secretly installing and operating gas generators in violation of the state’s Air Pollution Control Act. DataOne got hit with the fine after an investigation by The Guardian and Floodlight News in August shared thermal drone footage showing that 45 of the 62 gas generators were operating. None of the generators had permits required for generators with 37-kilowatt capacity or higher, despite running at 1,982-kw capacities more than 50 times higher than the state limit. States track gas generators like DataOne uses because they emit “carbon dioxide, nitrogen oxides, carbon monoxide, and other combustion-related pollutants,” officials from New Jersey’s Department of Environmental Protection (DEP) noted. Those pollutants can worsen asthma, trigger heart attacks, and cause early deaths. Read full article Comments", "date_str": "2026-09-24T18:20:58+00:00", "hash": "369ea6fb3b1a871b", "title_fa": "نیوجرسی پس از افشای 62 ژنراتور گاز توسط پهپاد، مرکز داده را 1.1 میلیون دلار جریمه کرد", "summary_fa": "این هفته، نیوجرسی به اپراتور یکی از بزرگترین مراکز داده برنامه ریزی شده در ساحل شرقی دستور داد به دلیل نصب و راه اندازی مخفیانه ژنراتورهای گازی در نقض قانون کنترل آلودگی هوای ایالت، جریمه 1.1 میلیون دلاری بپردازد. DataOne پس از تحقیقی که توسط The Guardian و Floodlight News در ماه آگوست منتشر شد، جریمه شد. هیچ یک از ژنراتورها مجوز لازم برای ژنراتورهای با ظرفیت 37 کیلووات یا بالاتر را نداشتند، علیرغم اینکه در ظرفیت 1982 کیلووات بیش از 50 برابر بیشتر از حد مجاز دولتی کار می کردند. مقامات دپارتمان حفاظت از محیط زیست نیوجرسی (DEP) خاطرنشان کردند که ایالت ها ژنراتورهای گازی مانند DataOne را که از آنها استفاده می کند ردیابی می کنند زیرا آنها \"دی اکسید کربن، اکسیدهای نیتروژن، مونوکسید کربن و سایر آلاینده های مربوط به احتراق\" منتشر می کنند. این آلاینده‌ها می‌توانند آسم را بدتر کنند، حملات قلبی را تحریک کنند و باعث مرگ زودهنگام شوند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش این هفته، نیوجرسی به اپراتور یکی از بزرگترین مراکز داده برنامه ریزی شده ساحل شرقی دستور داد به دلیل نصب و راه اندازی مخفیانه ژنراتورهای گاز Pollution برخلاف قوانین ایالتی، جریمه 1.1 میلیون دلاری بپردازد. اد پوتوسناک، کمیسیونر DEP، با خواندن این اقدام به عنوان \"بزرگترین اقدامی که تاکنون علیه یک مرکز داده در نیوجرسی انجام شده\"، قول داد که مراکز داده \"در این ایالت بدون مجازات ساخته یا کار نخواهند کرد.\" با این حال، با وجود تاریخی بودن، راه حل ایالت بلافاصله نگرانی ساکنان را برطرف نمی کند. به DataOne 45 روز مهلت داده شد تا برای مجوزها درخواست دهد و در غیر این صورت فعالیت خود را متوقف می کند، اما آنها می توانند"}, {"source": "Ars Technica", "title": "Google's first Suncatcher orbital data center test launches October 1", "link": "https://arstechnica.com/google/2026/09/googles-first-suncatcher-orbital-data-center-test-launches-october-1/", "summary": "Google is taking its first step toward making Project Suncatcher a reality. Announced last year, Suncatcher is Google's \"moonshot\" effort to design orbital AI data centers, which AI boosters like Elon Musk and Jeff Bezos have pitched as an alternative to divisive terrestrial data centers . Google's first experimental satellite will launch on October 1 with the aim of validating Google's vision for a constellation of AI satellites . The satellite, dubbed MVP, is about the size of a refrigerator. Inside, it has four of Google's custom TPU AI accelerators, which are used to train AI models and run inference to generate tokens for AI workloads. On Earth, a data center will run thousands of these chips, which consume massive amounts of power—one of the reasons putting solar-powered AI hardware in space is so attractive. Google’s latest moonshot to put machine learning in space. MVP is starting small, with solar panels that supply only about one kilowatt of power, The New York Times reports. That's enough to power a microwave or a hair dryer. Google did not build the satellite from scratch. While the AI hardware inside is Google's, the spacecraft comes from a satellite imagery firm called Planet Labs. The initial plan was to launch two custom satellites in 2027, but Google wanted to accelerate its efforts. So the company opted to integrate its chips into a satellite that Planet Labs had already built for an early test. Read full article Comments", "date_str": "2026-09-24T16:16:34+00:00", "hash": "c51e98210519ffc6", "title_fa": "اولین آزمایش مرکز داده مداری Suncatcher گوگل در 1 اکتبر راه اندازی می شود", "summary_fa": "گوگل اولین گام خود را برای تحقق پروژه Suncatcher برمی دارد. Suncatcher که سال گذشته اعلام شد، تلاش «مهتابی» گوگل برای طراحی مراکز داده هوش مصنوعی مداری است، که تقویت‌کننده‌های هوش مصنوعی مانند ایلان ماسک و جف بزوس به عنوان جایگزینی برای مراکز داده زمینی تفرقه‌انگیز مطرح کرده‌اند. اولین ماهواره آزمایشی گوگل در اول اکتبر با هدف اعتبارسنجی دیدگاه گوگل برای مجموعه ای از ماهواره های هوش مصنوعی پرتاب می شود. این ماهواره که MVP نام دارد به اندازه یک یخچال است. در داخل، چهار تا از شتاب‌دهنده‌های TPU AI سفارشی گوگل دارد که برای آموزش مدل‌های هوش مصنوعی و اجرای استنتاج برای تولید توکن‌هایی برای بارهای کاری هوش مصنوعی استفاده می‌شوند. روی زمین، یک مرکز داده هزاران تراشه از این تراشه‌ها را اجرا می‌کند که مقادیر زیادی انرژی مصرف می‌کنند – یکی از دلایل جذاب بودن سخت‌افزار هوش مصنوعی با انرژی خورشیدی در فضا. جدیدترین مهتاب گوگل برای قرار دادن یادگیری ماشینی در فضا. نیویورک تایمز گزارش می دهد که MVP در حال شروع کوچک است، با پنل های خورشیدی که تنها حدود یک کیلووات برق را تامین می کنند. این برای روشن کردن یک مایکروویو یا سشوار کافی است. گوگل ماهواره را از ابتدا نساخته است. در حالی که سخت افزار هوش مصنوعی داخل آن متعلق به گوگل است، این فضاپیما از یک شرکت تصویربرداری ماهواره ای به نام Planet Labs است. برنامه اولیه پرتاب دو ماهواره سفارشی در سال 2027 بود، اما گوگل می خواست تلاش های خود را تسریع کند. بنابراین شرکت تصمیم گرفت تراشه‌های خود را در ماهواره‌ای که Planet Labs قبلاً برای آزمایش اولیه ساخته بود، ادغام کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش Google اولین گام خود را برای"}, {"source": "Ars Technica", "title": "OpenAI agent “didn’t accept no for an answer” in Australian government breach", "link": "https://arstechnica.com/ai/2026/09/openai-agent-didnt-accept-no-for-an-answer-in-australian-government-breach/", "summary": "Australian Prime Minister Anthony Albanese said his government is investigating a June incident in which an OpenAI agent accessed \"non-public files\" from the country's online Medicare statistics portal. OpenAI said in a statement that \"our models took actions we did not intend\" in causing the breach, which it only recently disclosed to the Australian government. Speaking in New York on Wednesday , Albanese said three other public health statistics systems also \"may have been impacted\" across Australian federal and state governments. He added that these portals \"contain non-sensitive Medicare information\" such as aggregate statistics and that early indications suggest \"no personal information is believed to have been accessed.\" That said, Albanese stressed that the \"situation is obviously unacceptable\" and that he has expressed his \"extreme concern\" over how the incident was handled to OpenAI CEO Sam Altman. Read full article Comments nical rules package that puts far more emphasis on the electric side of the cars’ hybrid power units than before. But those rules were perhaps too ambitious for 2026 , with batteries that can only power the electric motor for a tiny fraction of a lap. Such was the shock of getting it wrong that F1 may fast-track a fix for 2030 rather than 2031, when the next set of rules is currently set to start. And according to a report in Autosport , there is now some agreement on what those power units will look like. Where are we now? The current rules were finalized several years ago , when optimism about electrification among automakers was high. F1 wanted more of those automakers, and automakers wanted more electrification. The sport would give it to them with a near 50:50 split between a small 1.6 L V6 turbo and an electric motor, both driving the rear wheels. The idea worked. Audi, Cadillac, and Ford have all signed up since, joining Mercedes, Ferrari, and Honda, which recommitted after pulling out in 2021. Read full article Comments", "date_str": "2026-09-24T15:48:29+00:00", "hash": "2529e4c4f26e81b0", "title_fa": "فرمول 1 به موتورهای 3.0 لیتری V8 توربو و هیبریدی های کوچکتر برای سال 2030 نگاه می کند.", "summary_fa": "ما حتی یک سال کامل از قوانین جدید نگذشته‌ایم و فرمول 1 در حال حاضر به شدت در مورد تکرار بعدی خود فکر می‌کند، که قرار است در اوایل سال 2030 معرفی شود. این سال قرار بود سال بزرگی برای F1 باشد، با معرفی یک بسته قوانین فنی جدید جسورانه که تاکید بسیار بیشتری بر جنبه الکتریکی خودروهای هیبریدی دارد. اما این قوانین شاید برای سال 2026 بیش از حد بلندپروازانه بود، با باتری هایی که فقط می توانند موتور الکتریکی را برای کسری از یک دور تغذیه کنند. اشتباه بودن آن چنان شوکه کننده بود که F1 ممکن است برای سال 2030 به جای 2031، زمانی که مجموعه بعدی قوانین در حال حاضر شروع به کار می کند، سریعاً اصلاح شود. و بر اساس گزارشی در Autosport، اکنون توافقاتی در مورد اینکه این واحدهای قدرت چگونه خواهند بود، وجود دارد. الان کجا هستیم؟ قوانین فعلی چندین سال پیش نهایی شد، زمانی که خوش‌بینی  and manage their own workflows. We asked 7 e-commerce industry veterans what’s still broken and what needs to [ ] This story continues at The Next Web", "date_str": "2026-09-24T20:21:19+00:00", "hash": "550ad64b3a7f05f5", "title_fa": "عصر تجارت هوش مصنوعی: 7 رهبر تجارت الکترونیک در مورد آنچه هنوز خراب است", "summary_fa": "آیا به یک عامل هوش مصنوعی برای اداره فروشگاه آمازون اعتماد دارید؟ آن آینده ممکن است نزدیک باشد. اما تحول واقعی هوش مصنوعی مستلزم حرکت فراتر از ابزارهای هوش مصنوعی «پرکننده شکاف» است. این نیاز به ساخت یک لایه زیرساختی دارد که به عوامل هوش مصنوعی اجازه می دهد گردش کار خود را ایجاد و مدیریت کنند. از 7 پیشکسوت صنعت تجارت الکترونیک پرسیدیم که چه چیزی هنوز خراب است و چه چیزی باید انجام شود [ ] این داستان در The Next Web ادامه دارد در چند سال گذشته، وعده‌های تحول هوش مصنوعی صنعت تجارت الکترونیک را پر کرده است. بازار تجارت الکترونیک SaaS و ابزارهای بهینه سازی فهرست آمازون هرگز شلوغ تر از این نبوده است. پس چرا آژانس های تجارت الکترونیک و فروشندگان بزرگ هنوز زمان زیادی را صرف کار کردن فروشگاه های خود به صورت دستی می کنند؟ با مدیرانی که آژانس های تجارت الکترونیک را اداره می کنند صحبت کنید و شاهد الگوی جالبی خواهید بود. یکی از ابزارهای هوش مصنوعی مشکل را تشخیص می‌دهد، دیگری راه‌حلی را توصیه می‌کند و انسان هنوز باید بفهمد چه چیزی مهم است. آن انسان تصمیم می‌گیرد که آیا این توصیه منطقی است یا خیر، تغییر را ایجاد می‌کند و بررسی می‌کند که آیا همه آن کارآمد بوده است یا خیر. علیرغم چندین «کمپیلوت» و «دستیار هوش مصنوعی»، عملیات روزانه مدیریت مجموعه‌های چند میلیون دلاری آمازون دستی باقی می‌ماند. آنها در ده ها ابزار تکه تکه می مانند. آژانس های تجارت الکترونیک دیگر از کمبود نرم افزار رنج نمی برند. در بسیاری از موارد، آنها از آن رنج می‌برند.» سیریل گلوب، مدیر عامل شرکت Jinnify.ai، یک لایه عملیاتی بین عوامل هوش مصنوعی و سیستم‌های تجارت الکترونیک، می‌گوید. سیریل گلوب یک سرمایه‌گذار فرشته و مدیر عامل سابق و یکی از بنیان‌گذاران Aheadworks است. پشته فناوری صنعت برای بیش از دو"}, {"source": "The Next Web", "title": "81% of CIOs lack full oversight of AI agents built outside IT, Dataiku says", "link": "https://thenextweb.com/news/cio-ai-agent-oversight-dataiku-survey", "summary": "Most chief information officers cannot fully see the AI agents their staff build outside approved systems, a survey by Dataiku found. 81% of the 685 CIOs polled said they lack complete oversight of AI agents created outside formal channels. The Harris Poll ran the survey online for Dataiku from 9 to 29 July. It covered [ ] This story continues at The Next Web", "date_str": "2026-09-24T20:20:35+00:00", "hash": "8e96cbf40c5f1da4", "title_fa": "دیتایکو می‌گوید: 81 درصد از CIOها فاقد نظارت کامل بر عوامل هوش مصنوعی ساخته شده خارج از فناوری اطلاعات هستند.", "summary_fa": "نظرسنجی Dataiku نشان داد که اکثر افسران ارشد اطلاعات نمی توانند به طور کامل عوامل هوش مصنوعی را که کارکنان آنها خارج از سیستم های تایید شده می سازند ببینند. 81 درصد از 685 CIO شرکت‌کننده در نظرسنجی گفتند که فاقد نظارت کامل بر عوامل هوش مصنوعی ایجاد شده در خارج از کانال‌های رسمی هستند. نظرسنجی هریس این نظرسنجی را از 9 تا 29 ژوئیه به صورت آنلاین برای Dataiku انجام داد. تحت پوشش [ ] این داستان در The Next Web ادامه دارد 90٪ از CIOها گفتند که ردیابی کامل همه نمایندگان خود را دارند. با این حال، 72٪ گفتند که نمی توانند به طور مداوم تأیید کنند که آیا آن نمایندگان نتایج تجاری را که برای آن ساخته شده اند ارائه می دهند یا خیر. 67 درصد تخمین می زنند که 51 یا بیشتر عامل در حال تولید هستند. 83 درصد فاقد مدیریت استاندارد چرخه عمر برای نمایندگان در سراسر سازمان هستند. 47 درصد در سال جاری بیش از 20 عامل را از رده خارج کرده اند. فقط 21٪ از هزینه های هوش مصنوعی توسط تیم یا موارد استفاده کاملاً و در زمان واقعی مشاهده می کنند. 84 درصد موافقند که کارمندان سریعتر از آن چیزی که فناوری اطلاعات می تواند آنها را کنترل کند، عامل ها و برنامه ها را ایجاد می کنند. 60٪ فاقد یک لایه نظارتی مرکزی هوش مصنوعی در برنامه ها، ابزارها و محیط های IT خود هستند. CIOها همچنین در مورد اینکه چه کسی صاحب عاملی است که اشتباه می کند اختلاف نظر دارند. پاسخ‌های آن‌ها شامل تیم‌های مشترک (23%)، فناوری اطلاعات مرکزی (21%)، تیم داده یا هوش مصنوعی (20%) و امنیت، ریسک و انطباق (18%) بود. Florian Douetteau، یکی از بنیانگذاران و مدیرعامل Dataiku، گفت: \"نظارت به شما می گوید که یک نماینده در حال اجرا است. مدیریت به شما می گوید"}, {"source": "The Next Web", "title": "The next thing your endpoint manager manages is an AI agent", "link": "https://thenextweb.com/news/endpoint-management-ai-agents-automox", "summary": "Gartner forecasts that task-specific AI agents will be integrated into 40% of enterprise applications by the end of the year. That’s up from less than 5%. The systems meant to catalog what runs on a managed device haven’t kept pace. 46% of organizations automate endpoint inventorying and monitoring today, per Automox’s survey of IT professionals. [ ] This story continues at The Next Web", "date_str": "2026-09-24T19:46:46+00:00", "hash": "61936ce82656f39d", "title_fa": "چیزی که مدیر نقطه پایانی شما مدیریت می کند یک عامل هوش مصنوعی است", "summary_fa": "گارتنر پیش‌بینی می‌کند که عوامل هوش مصنوعی ویژه وظایف تا پایان سال در 40 درصد از برنامه‌های کاربردی سازمانی ادغام خواهند شد. این از کمتر از 5 درصد است. سیستم‌هایی که به منظور فهرست‌بندی مواردی که روی یک دستگاه مدیریت‌شده اجرا می‌شوند، سرعت خود را حفظ نکرده‌اند. بر اساس نظرسنجی Automox از متخصصان فناوری اطلاعات، 46 درصد از سازمان‌ها امروز فهرست‌بندی و نظارت نقطه پایانی را خودکار می‌کنند. [ ] این داستان در موجودی The Next Web Software به یک سوال ثابت پاسخ می دهد ادامه دارد. برای بیشتر تاریخ این رشته، همین کافی بود. نرم افزار در نقطه پایانی هیچ کاری انجام نداد تا زمانی که یک شخص یا یک زمان بندی به آن دستور دهد. عوامل مقیم این فرض را می شکنند. آن‌ها فایل‌های محلی را می‌خوانند، ابزارهای فراخوانی می‌کنند، APIها را فراخوانی می‌کنند و در فواصل زمانی که هر کسی به آن نگاه می‌کند، اقدامات چند مرحله‌ای انجام می‌دهد. بنابراین سوال مفید به این موضوع تغییر نمی کند که چه چیزی نصب شده است، بلکه به آنچه که مجاز است انجام دهد و چه کاری انجام داده است. آزمایشگاه های Cyberhaven دریافتند که پذیرش برنامه های مبتنی بر AI مبتنی بر نقطه پایانی در سال گذشته 509٪ رشد داشته است. آزمایشگاه‌های فانتوم BeyondTrust رشد عوامل هوش مصنوعی در محیط‌های سازمانی را 466.7 درصد در سال اعلام کردند. هر دو رقم به جای اندازه‌گیری در سطح صنعت، تله‌متری فروشنده هستند، اما به یک شکل اشاره می‌کنند. جاستین تالریکو، مدیرعامل اتوموکس می‌گوید: «هیچ‌کس همه چیز را درست انجام نمی‌دهد. اما بین اشتباه بودن و اشتباه کردن در همه جا تفاوت وجود دارد. \"یک تماس بد با یک دستگاه، شما آن را تعمیر می کنید و ادامه می دهید. همان تماس در ناوگان پخش شد، ناگهان شما اشتباهی را اصلاح نمی کنید، بلکه یک بحران را مدیریت می کنید. سرعت"}, {"source": "MIT Tech Review", "title": "The Download: the Pentagon’s AI-powered lie detector and young organ limits", "link": "https://www.technologyreview.com/2026/09/25/1145157/the-download-pentagon-ai-lie-detector-young-organ-limits/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. The Pentagon wants $30 million to build an AI-powered lie detector The US government wants to spend $30.3 million over the next five years on an improved lie detector, according to a Department of Defense budget request. The program, called “Polygraph+” or “Polygraph Next,” will focus on scoring algorithms that use AI and machine learning, as well as a technique called “standoff sensing,” which can take physiological readings from a person without attaching a device to them. The project aims to improve the accuracy and reliability of polygraph assessments. But it could just be the latest in a long line of failed attempts to use technology to detect lies. Here’s how the program could work—and why experts say AI-enabled lie detection is “the worst of both worlds.” —Amit Katwala Young organs may not be a fountain of youth for recipients Around this time last year, a hot mic caught Vladimir Putin and Xi Jinping discussing the possibility of living forever . “With the developments of biotechnology, human organs can be continuously transplanted, and people can live younger and younger, and even achieve immortality,” Putin reportedly said. He seemed to be referring to the “replacement” theory of longevity, supported by experiments that involved physically stitching young mice to old ones. Unfortunately for Putin, new research on transplanted hearts pours a little cold water on this idea. But it also offers useful insights for organ transplantation. Find out what the research reveals about the limits of rejuvenation . —Jessica Hamzelou This story is from The Checkup, our weekly biotech newsletter. Sign up to receive it in your inbox every Thursday. Roundtables: the deadly failures of the virtual border wall The US has spent billions building a “virtual wall” of surveillance towers along its southern border, promising to detect and apprehend border crossers and save lives. But an MIT Technology Review investigation found more than a thousand people died within the advertised range of the towers without getting caught. On Monday September 28, our editor-in-chief Mat Honan, senior AI reporter James O’Donnell and senior reporter for features and investigations Eileen Guo will join a subscriber-only conversation about the investigation. They’ll examine the failures of border surveillance technology and uncover the stories of the peo", "date_str": "2026-09-25T12:10:00+00:00", "hash": "225ed2381b503fb6", "title_fa": "دانلود: دروغ سنج پنتاگون با هوش مصنوعی و محدودیت های اندام جوان", "summary_fa": "بر اساس درخواست بودجه وزارت دفاع، دولت ایالات متحده می خواهد طی پنج سال آینده 30.3 میلیون دلار برای یک دستگاه دروغ یاب بهبودیافته هزینه کند. این برنامه که «Polygraph+» یا «Polygraph Next» نام دارد، بر روی الگوریتم‌های امتیازدهی که از هوش مصنوعی و یادگیری ماشینی استفاده می‌کنند و همچنین تکنیکی به نام «سنگر ایستاده» تمرکز می‌کند که می‌تواند خوانش‌های فیزیولوژیکی را از فرد بدون اتصال دستگاه به آن‌ها بگیرد. هدف این پروژه بهبود دقت و قابلیت اطمینان ارزیابی های پلی گراف است. اما این می تواند آخرین مورد از یک سری تلاش های ناموفق برای استفاده از فناوری برای کشف دروغ باشد. در اینجا این است که چگونه این برنامه می تواند کار کند - و چرا کارشناسان می گویند که تشخیص دروغ با قابلیت هوش مصنوعی \"بدترین هر دو جهان\" است. سال گذشته تقریباً در همین زمان، یک میکروفون داغ ولادیمیر پوتین و شی جین پینگ را در حال بحث درباره امکان زندگی ابدی گرفتار کرد. پوتین گفت: «با پیشرفت‌های بیوتکنولوژی، اعضای انسان می‌توانند به طور مداوم پیوند شوند و مردم جوان‌تر و جوان‌تر زندگی کنند و حتی به جاودانگی دست یابند.» به نظر می‌رسد که او به نظریه «جایگزینی» طول عمر اشاره می‌کند که با آزمایش‌هایی که شامل دوختن فیزیکی موش‌های جوان به موش‌های مسن بود، پشتیبانی می‌شود. متأسفانه برای پوتین، تحقیقات جدید در مورد قلب های پیوندی کمی آب سرد روی این ایده می ریزد. اما همچنین بینش مفیدی برای پیوند اعضا ارائه می دهد. آنچه را که تحقیقات در مورد محدودیت های جوانسازی نشان می دهد، بیابید. ایالات متحده میلیاردها دلار برای ساختن یک «دیوار مجازی» از برج‌های نظارتی در امتداد مرز جنوبی خود هزینه کرده است که وعده شناسایی و دستگیری عبورکنندگان از مرز و نجات جان افراد را داده است. اما بررسی فناوری MIT نشان داد که بیش از هزار نفر در محدوده"}, {"source": "MIT Tech Review", "title": "The Pentagon wants $30 million to build an AI-powered lie detector", "link": "https://www.technologyreview.com/2026/09/25/1145144/pentagon-ai-lie-detector/", "summary": "The US government wants to spend $30.3 million over the next five years on an improved form of lie detector, according to a Department of Defense budget request . The program, called Polygraph+ or Polygraph Next, will focus on scoring algorithms that use artificial intelligence and machine learning and on a technique called “standoff sensing,” which refers to the ability to take physiological readings without attaching a device to a subject’s person. According to details of the budget document, which were first reported by Inside Defense , the project will “modernize federal polygraph and credibility assessment technologies” to improve their accuracy and reliability. But the project may be just the latest in a long line of failed attempts to use technology to detect lies. “It’s a misguided effort to reduce the complex to something that is tangible,” says Kyri Kotsoglou, a legal scholar at Northumbria University in the UK who studies the use of polygraphs in the justice system. The move comes at a time of high tension within the department. Under Defense Secretary Pete Hegseth, the Pentagon has been increasingly turning to polygraph tests in an attempt to find the sources of alleged leaks to the press. In September, the New York Times reported that around 50 officers on the Joint Staff had been given polygraph tests after news coverage reported on the depletion of US weapons stockpiles in the war with Iran. Polygraph+ will be run by the Defense Counterintelligence and Security Agency (DCSA), which conducts background checks for the federal government. According to the budget document, which has not yet been approved by Congress, the new technology will be used for vetting of prospective employees and “insider threat detection.” It is not yet clear which specific technologies will be used, and the DCSA did not respond to a request for more information. But other Pentagon efforts offer potential clues. In 2023, the department’s Defense Innovation Unit (DIU) ran an open submission process to find companies with products that could be used for deception detection. It selected two companies to build prototypes : Presage Technologies, which claims to be able to measure heart rate and breathing rate using standard cameras, and Altec Research, a medical sensor company now branching out into non-contact sensing technologies. A screenshot of Altec’s prototype technology released by the DIU shows that it tracks head movement, facial skin temperature, and pore activity", "date_str": "2026-09-25T09:16:25+00:00", "hash": "5cdc0a493cbe6856", "title_fa": "پنتاگون 30 میلیون دلار برای ساخت یک دروغ سنج مجهز به هوش مصنوعی می خواهد", "summary_fa": "طبق درخواست بودجه وزارت دفاع، دولت ایالات متحده می خواهد طی پنج سال آینده 30.3 میلیون دلار برای یک شکل بهبودیافته دروغ سنج هزینه کند. این برنامه که Polygraph+ یا Polygraph Next نام دارد، بر روی الگوریتم‌های امتیازدهی که از هوش مصنوعی و یادگیری ماشینی استفاده می‌کنند و بر روی تکنیکی به نام «سنگر ایستاده» تمرکز می‌کند که به توانایی انجام خوانش‌های فیزیولوژیکی بدون اتصال دستگاه به فرد سوژه اشاره دارد. با توجه به جزئیات سند بودجه، که برای اولین بار توسط Inside Defense گزارش شد، این پروژه «تکنولوژی‌های پولی‌گراف فدرال و ارزیابی اعتبار را مدرن می‌کند» تا دقت و قابلیت اطمینان آنها را بهبود بخشد. اما این پروژه ممکن است آخرین مورد از یک سری تلاش های ناموفق برای استفاده از فناوری برای کشف دروغ باشد. کایری کوتسوگلو، محقق حقوقی در دانشگاه نورثومبریا در بریتانیا که استفاده از چاپگراف را در سیستم قضایی مطالعه می‌کند، می‌گوید: «این یک تلاش نادرست برای کاهش پیچیدگی به چیزی است که قابل لمس است. این حرکت در زمانی انجام می شود که تنش شدید در داخل این وزارتخانه وجود دارد. در زمان وزیر دفاع، پیت هگزث، پنتاگون به طور فزاینده ای به آزمایش های پلی گراف روی آورده است تا منابع افشاگری های ادعایی به مطبوعات را بیابد. در ماه سپتامبر، نیویورک تایمز گزارش داد که حدود 50 افسر در ستاد مشترک پس از انتشار اخباری مبنی بر کاهش ذخایر تسلیحات ایالات متحده در جنگ با ایران، آزمایشات پلی گرافی داده شده اند. Polygraph+ توسط آژانس ضد جاسوسی و امنیت دفاعی (DCSA) اداره می شود که بررسی پیشینه را برای دولت فدرال انجام می دهد. بر اساس سند بودجه، که هنوز توسط کنگره تایید نشده است، از فناوری جدید برای بررسی کارمندان احتمالی و \"تشخیص تهدیدات خودی\" استفاده خواهد شد. هنوز مشخص نیست که از کدام فناوری های خاص استفاده خواهد شد و"}, {"source": "MIT Tech Review", "title": "Young organs may not be a fountain of youth for recipients", "link": "https://www.technologyreview.com/2026/09/25/1145083/young-organs-may-not-be-a-fountain-of-youth-for-recipients/", "summary": "Around this time last year I was attending an aging conference in Manchester, listening to a talk about fly aging, when my phone started pinging. News outlets were reporting that a hot mic had caught Russia’s and China’s leaders discussing the p طرح جدید گوگل که پروژه‌ی سان‌کچر (Project Suncatcher) نام دارد، ساخت منظومه‌ای از ماهواره‌ها است که بتوانند پردازش‌های سنگین را با بهره‌گیری مستقیم از نور خورشید در خارج از جو زمین انجام دهند. ماهواره‌ی آزمایشی گوگل که به تراشه‌های اختصاصی TPU مجهز شده، در تاریخ ۱ اکتبر (۹ مهر) با موشک فالکون ۹ متعلق به اسپیس‌ایکس راهی مدار پایینی زمین خواهد شد. مأموریت در گام نخست بررسی خواهد کرد که سخت‌افزارهای پردازشی اختصاصی چگونه دربرابر فشارهای فیزیکی لحظه‌ی پرتاب، امواج شدید رادیواکتیو فضا و نوسانات شدید حرارتی تاب می‌آورند. لایک آزمایش‌های زمینی نشان داده‌اند که تراشه‌های TPU توانایی مقاومت در برابر گرانش شدید و پرتوهای رادیواکتیو را دارند، اما شبیه‌سازی همه‌ی مؤلفه‌های فضایی روی زمین ممکن نیست. گوگل برای پایداری عملکرد مدارهای الکترونیکی در فضا، سامانه‌ی خنک‌کننده‌ی نوآورانه‌ای مبتنی بر لوله‌های حرارتی و رادیاتورها طراحی کرده است. با وجود چنین تجهیزاتی، محدودیت‌های خنک‌سازی سبب می‌شود تراشه‌ها در هر نوبت فقط حدود ۱۵ دقیقه به پردازش مداوم بپردازند و سپس برای دفع حرارت خاموش شوند. تراویس بیلز ، مدیر ارشد محصول در پروژه‌ی سان‌کچر، درباره‌ی ماهیت مأموریت پیش‌رو می‌گوید: «بررسی فضا به‌عنوان مقصدی پایدار برای محاسبات مقیاس‌پذیر هوش مصنوعی روندی آنی نخواهد بود. دستیابی به چنین جایگاهی نیازمند مهندسیِ روش‌مند است؛ راهکاری که با اثبات کارایی سخت‌افزارها در برابر واقعیت‌های فیزیکی و غیرقابل‌پیش‌بینی مدار آغاز می‌شود. پرتاب نخست با هدف شناسایی کارکردها، نقاط ضعف و بهره‌گیری از دستاوردها برای مأموریت‌های"}, {"source": "Business Insider", "title": "I co-created Blue's Clues. Working on the show didn't make parenting easier, but I did learn from Steve's pause.", "link": "https://www.businessinsider.com/created-blues-clues-steves-pause-parenting-lessons-2026-9", "summary": "The author is a co-creator of Blue s Clues. Courtesy of Angela Santomero I spent my career studying how children learn. Raising my kids taught me that kids don't need us to have all the answers. They need us to stop, listen, and trust them to find their own voices. Before I became a mother, I thought I knew a lot about children. I had a master's degree in child development and instructional technology and media. I had spent years studying how young children learned , processed information, and obtained mastery over a concept. When I co-created Blue's Clues , we wanted a show built around one simple but groundbreaking idea: kids learn best when they are active participants. Steve would look directly into the camera, ask a question, and then, he would wait. That pause became one of the most important parts of the show. At first, some adults worried that the silence lasted too long. They thought children would become distracted and turn away. They thought the show was slow. But kids didn't turn away. They leaned closer. They thought about the question and shouted their answers. They believed Steve was listening because, emotionally, he was. We gave kids the time to think, and we treated what they had to say as if it mattered. I knew why Steve's pause was effective, but that didn't make it easy to do. I understood the child-development research behind that pause. What I didn't understand yet was how hard — and how important — it would be to practice it as a mother. When my daughters were little, I wanted to do everything right. I wanted to pack the right snacks, read the right books, ask the right questions, and give them the kind of childhood that would help them grow into strong, creative, and compassionate women. Because I had spent my career thinking about what children needed, I assumed all that knowledge would make parenting easier . It did not. Parenting was different from teaching kids through a TV show My daughters were not characters in a TV show. They were two completely different human beings, with their own personalities, worries, gifts, and ways of moving through the world. They didn't always respond the way the parenting books said they would. They didn't always need what I thought they needed. As mothers, we become experts at anticipating needs. So, when our kids bring us a problem, we want to fix it. We jump in with answers, solutions, and plans because helping is one way we show our love. But as my girls grew older, I started to recognize som", "date_str": "2026-09-25T12:17:01+00:00", "hash": "159d5519954b13c0", "title_fa": "من با همکاری Blue's Clues را ساختم. کار بر روی نمایش، فرزندپروری را آسان تر نکرد، اما من از مکث استیو یاد گرفتم.", "summary_fa": "نویسنده یکی از خالقان Blue s Clues است. به لطف آنجلا سانتومرو، کارم را صرف مطالعه نحوه یادگیری کودکان کردم. بزرگ کردن بچه هایم به من آموخت که بچه ها نیازی ندارند که ما همه پاسخ ها را داشته باشیم. آنها به ما نیاز دارند که بایستیم، گوش کنیم و به آنها اعتماد کنیم تا صدای خودشان را پیدا کنند. قبل از اینکه مادر شوم فکر می‌کردم در مورد بچه‌ها چیزهای زیادی می‌دانم. من فوق لیسانس رشد کودک و فناوری آموزشی و رسانه داشتم. من سال‌ها را صرف مطالعه چگونگی یادگیری کودکان خردسال، پردازش اطلاعات و تسلط بر یک مفهوم کرده بودم. زمانی که من Blue's Clues را ساختم، ما می خواستیم نمایشی بر اساس یک ایده ساده اما پیشگامانه ساخته شود: بچه ها زمانی که شرکت کننده فعال باشند، بهتر یاد می گیرند. استیو مستقیماً به دوربین نگاه می کرد، سؤالی می پرسید و سپس منتظر می ماند. آن مکث به یکی از مهم ترین بخش های نمایش تبدیل شد. در ابتدا، برخی از بزرگسالان نگران بودند که این سکوت بیش از حد طول بکشد. آنها فکر می کردند بچه ها حواسشان پرت می شود و دور می شوند. آنها فکر می کردند که نمایش کند است. اما بچه ها روی گردان نشدند. نزدیک تر خم شدند. آنها در مورد سؤال فکر کردند و پاسخ های خود را فریاد زدند. آنها معتقد بودند که استیو دارد گوش می دهد، زیرا از نظر احساسی، او گوش می دهد. ما به بچه‌ها زمان می‌دادیم تا فکر کنند و با آنچه که می‌گفتند طوری رفتار می‌کردیم که انگار مهم است. می دانستم که چرا مکث استیو موثر بود، اما این کار را آسان نکرد. من تحقیقات مربوط به رشد کودک را در پشت آن مکث درک کردم. چیزی که من هنوز نفهمیدم این بود که تمرین آن به عنوان یک مادر چقدر"}, {"source": "Business Insider", "title": "Ukraine’s fast medical robots can outrun Russian attacks, but speed creates new risks, makers and medics say", "link": "https://www.businessinsider.com/ukraine-evacuation-medical-robots-injured-troops-faster-ugv-risks-2026-9", "summary": "The MAUL purpose-built evacuation robot is designed to move faster than robots used for firing weapons and carrying gear. The First Medical Battalion of Ukraine Ukraine's robots that evacuate injured troops are designed to move much faster than other bots. It allows them to try and escape Russian attacks and get soldiers to treatment faster. But the speed also introduces new risks and compounds any errors by the operator. Ukraine's robots designed to evacuate wounded soldiers move much faster than the robots built for attacking and hauling supplies, a design choice that developers and medics say can help save lives but also introduces new risks. Ukrainian military units are increasingly using uncrewed ground vehicles (UGVs) to move injured soldiers to safety because the machines can infiltrate the areas medics can't reach, reducing the risk of additional casualties. Like medical crews, though, casualty evacuation robots are targets. Combat footage has captured robots being attacked by Russian drones . Ukrainian robotics company DevDroid purpose-built its MAUL evacuation robot to outrun threats, making it faster than other robots being used in combat. Its reconnaissance and strike system, Droid TW-12.7, has a maximum speed of 12 kilometers per hour, while its MAUL purpose-built evacuation robot has a recorded mission peak speed of 72 kilometers per hour. Oleg Fedoryshyn, the company's director of R D, told Business Insider that MAUL is quite a \"unique device from all UGVs that we have because it's very fast.\" That helps it avoid some drone attacks, he said, and it gets soldiers to treatment faster. While most of the company's robots are electric battery-powered, MAUL uses an ATV chassis and a combustion engine. The MAUL robot was designed and developed by specialists from the 1st Separate Medical Battalion, a specialized medical unit of Ukraine's ground forces. The unit has repeatedly said that moving as quickly as possible is key to successful evacuations. Brave1, a Ukrainian government-backed defense technology incubator, say that MAUL's speed is essential. It says \"one of the main challenges of the modern battlefield is to save the wounded in time,\" making specialized evacuation robots necessary. MAUL has an armored capsule to protect the injured soldier from attacks. The First Medical Battalion of Ukraine Last November, the 1st Separate Medical Battalion described an evacuation mission that was successful despite a Russian drone attack because the robot", "date_str": "2026-09-25T11:57:01+00:00", "hash": "65b88cf72801a1d1", "title_fa": "سازندگان و پزشکان می گویند ربات های پزشکی سریع اوکراین می توانند از حملات روسیه پیشی بگیرند، اما سرعت خطرات جدیدی ایجاد می کند.", "summary_fa": "ربات تخلیه هدف MAUL طوری طراحی شده است که سریعتر از ربات هایی که برای شلیک سلاح و حمل وسایل استفاده می شوند حرکت کند. اولین گردان پزشکی اوکراین ربات‌های اوکراینی که نیروهای مجروح را تخلیه می‌کنند به گونه‌ای طراحی شده‌اند که بسیار سریع‌تر از سایر ربات‌ها حرکت کنند. این به آنها اجازه می دهد تا سعی کنند از حملات روسیه فرار کنند و سربازان را سریعتر تحت درمان قرار دهند. اما سرعت همچنین خطرات جدیدی را به همراه دارد و هرگونه خطای اپراتور را تشدید می کند. روبات‌های اوکراینی که برای تخلیه سربازان مجروح طراحی شده‌اند، بسیار سریع‌تر از ربات‌هایی که برای حمله و حمل تجهیزات ساخته شده‌اند، حرکت می‌کنند، یک انتخاب طراحی که توسعه‌دهندگان و پزشکان می‌گویند می‌تواند به نجات جان افراد کمک کند، اما خطرات جدیدی را نیز به همراه دارد. واحدهای نظامی اوکراین به طور فزاینده ای از وسایل نقلیه زمینی بدون خدمه (UGV) برای انتقال سربازان مجروح به مکان امن استفاده می کنند، زیرا ماشین ها می توانند به مناطقی که پزشکان نمی توانند به آن دسترسی پیدا کنند نفوذ کرده و خطر تلفات اضافی را کاهش می دهد. با این حال، مانند خدمه پزشکی، ربات های تخلیه مصدوم نیز هدف هستند. فیلم‌های رزمی ربات‌هایی را که توسط پهپادهای روسی مورد حمله قرار می‌گیرند، ضبط کرده‌اند. شرکت رباتیک اوکراینی DevDroid ربات تخلیه MAUL خود را به منظور پیشی گرفتن از تهدیدات ساخته است و سرعت آن را نسبت به سایر ربات‌هایی که در جنگ مورد استفاده قرار می‌گیرند، می‌کند. سیستم شناسایی و حمله آن، Droid TW-12.7، حداکثر سرعت 12 کیلومتر در ساعت دارد، در حالی که ربات تخلیه هدف MAUL آن دارای حداکثر سرعت ماموریت 72 کیلومتر در ساعت است. Oleg Fedoryshyn، مدیر R D شرکت، به Business Insider گفت که MAUL یک دستگاه منحصر به فرد از همه UGV هایی است که ما داریم"}, {"source": "Business Insider", "title": "The British Army wants better drone pilots, so it makes them learn 'the hardest way to fly'", "link": "https://www.businessinsider.com/british-army-trains-drone-pilots-hardest-way-make-them-better-2026-9", "summary": "British forces are learning to fly drones manually. US Army photo The British Army is training its future drone pilots to fly manually without GPS. A commander familiar with the training efforts described this as the \"hardest way to fly.\" Like other Western forces, Britain is also training troops to operate in GPS-denied environments. The British Army is training future drone operators to fly manually without flight aids or GPS to make them better pilots, a commander involved in the efforts told Business Insider. Lt. Col. Matt Keogh said at a UK defense industry exhibition last week that Britain has acquired more than 10,000 drones in the last year through the Project Rapstone rapid procurement initiative. Most of these drones are for training purposes, not conflict. Because drone warfare technology and tactics change so quickly, as the Ukraine war has demonstrated, Rapstone doesn't buy large numbers of the newest products, which may become obsolete in a matter of weeks or months. Instead, the initiative invests in pilots. That means purchasing \"totally manually flown\" first-person-view , or FPV, drones and \"reducing the complexity of the smaller ISR platforms that don't have those safeguards,\" Keogh said, referring to intelligence, surveillance, and reconnaissance drones. Keogh said soldiers train to fly drones the way someone might learn to drive a manual car before switching to an automatic, or navigate with a map and compass before relying on GPS. \"We are closing those training gaps at the points of need,\" he explained. \"As long as those foundations are built into our pilots, in the hardest way to fly — i.e., manually — it's far easier to close that training gap.\" Britain launched the Project Rapstone initiative in September 2024 to rapidly deliver new technology, such as FPV and ISR drones , to soldiers so they can train and prepare for operations. Thousands of British Army soldiers have been trained to operate drones as part of the Rapstone initiative, though most have learned to fly ISR drones, which Western forces have long used to watch over the battlefield, rather than the FPV attack quadcopters that have seen widespread use in Ukraine. Western militaries are learning to fight under conditions similar to those in Ukraine. US Army photo Britain was training pilots to fly surveillance-type drones \"way before Ukraine,\" Keogh said. He said that learning to fly FPV drones is a more difficult skill to develop. Britain has invested in simulators and gea", "date_str": "2026-09-25T11:47:01+00:00", "hash": "f4147c1d0fffa60c", "title_fa": "ارتش بریتانیا خلبانان پهپاد بهتری می‌خواهد، بنابراین باعث می‌شود «سخت‌ترین راه پرواز» را بیاموزند.", "summary_fa": "نیروهای بریتانیایی در حال یادگیری پرواز با هواپیماهای بدون سرنشین به صورت دستی هستند. عکس ارتش ایالات متحده ارتش بریتانیا در حال آموزش خلبانان پهپاد آینده خود برای پرواز دستی بدون GPS است. یکی از فرماندهان آشنا با تلاش های آموزشی، این را \"سخت ترین راه برای پرواز\" توصیف کرد. مانند سایر نیروهای غربی، بریتانیا نیز در حال آموزش نیروها برای عملیات در محیط‌های محروم از GPS است. یکی از فرماندهان شرکت کننده در این تلاش ها به Business Insider گفت که ارتش بریتانیا در حال آموزش اپراتورهای پهپادهای آینده است تا به صورت دستی بدون کمک پرواز یا GPS پرواز کنند تا خلبانان بهتری شوند. سرهنگ دوم مت کیوگ هفته گذشته در نمایشگاه صنایع دفاعی بریتانیا گفت که بریتانیا در سال گذشته بیش از 10000 هواپیمای بدون سرنشین را از طریق طرح تدارکات سریع پروژه Rapstone خریداری کرده است. بیشتر این پهپادها برای اهداف آموزشی هستند نه درگیری. از آنجایی که فناوری و تاکتیک‌های جنگ با هواپیماهای بدون سرنشین به سرعت تغییر می‌کنند، همانطور که جنگ اوکراین نشان داده است، Rapstone تعداد زیادی از جدیدترین محصولات را خریداری نمی‌کند، که ممکن است در عرض چند هفته یا چند ماه منسوخ شود. در عوض، این ابتکار روی پایلوت ها سرمایه گذاری می کند. کیوگ با اشاره به پهپادهای اطلاعاتی، نظارتی و شناسایی گفت: این به معنای خرید پهپادهای دید اول شخص یا FPV «کاملاً به صورت دستی» و «کاهش پیچیدگی پلتفرم‌های کوچک‌تر ISR است که از آن پادمان‌ها برخوردار نیستند». کیوگ گفت که سربازان برای پرواز پهپادها به روشی آموزش می بینند که ممکن است قبل از تغییر به خودکار، رانندگی با ماشین دستی را یاد بگیرد، یا قبل از تکیه بر GPS، با نقشه و قطب نما حرکت کند. او توضیح داد: «ما در حال رفع این شکاف‌های آموزشی در نقاط مورد نیاز هستیم. تا زمانی که این پایه"}, {"source": "Business Insider", "title": "The real 'To Catch a Predator' host Chris Hansen isn't happy about 'Primetime'", "link": "https://www.businessinsider.com/where-is-chris-hansen-now-primetime-response-2026-9", "summary": "Robert Pattinson as Chris Hansen in Primetime. A24 \"Primetime\" stars Robert Pattinson as \"To Catch a Predator\" host Chris Hansen. \"To Catch a Predator\" was a hit TV show on NBC in the 2000s. The real Chris Hansen calls the movie a \"work of fiction.\" A24's \"Primetime\" is a fictionalized look at the hit show \"To Catch a Predator,\" which aired on NBC from 2004 to 2007. The film, directed by Lance Oppenheim, follows host Chris Hansen ( Robert Pattinson ), who, along with his producer Andie Bender (Merritt Wever), is determined to get \"To Catch a Predator\" to the top of the ratings at any cost. The show, which ran as part of NBC's \"Dateline\" newsmagazine franchise, was controversial from the start for televising undercover stings. With the help of the watchdog group Perverted Justice, episodes would feature hidden-camera footage of Hansen confronting men who arrived at a sting house to have sex with a minor. After tense conversations, Hansen would tell the men they were on TV and were free to leave. They'd often be arrested as soon as they left the house. All of that is depicted in \"Primetime\" with a frenetic pace and a stylized edge. Pattinson portrays Hansen as a heartless and egotistical TV personality driven to make \"To Catch a Predator\" a ratings hit, leading to the show's infamous real-life event: the suicide of Kaufman County district attorney Bill Conradt, who, after being caught in a Perverted Justice sting, fatally shot himself as a SWAT team closed in. A year later, the show was canceled. So where is the real Chris Hansen now , and what does he think of the movie's depiction of real-life events? Chris Hansen has called 'Primetime' a 'complete work of fiction' Chris Hansen. Noam Galai/WireImage/Getty Hansen was not involved in the making of \"Primetime,\" and he's already voiced his displeasure about it. After the movie's first trailer came out, he revealed that he was approached by A24, which offered to show him the movie, but he declined because he refused to sign the required NDA . After the movie had its world premiere at the Venice Film Festival in the beginning of September, Hansen told The Hollywood Reporter that the movie is \"a complete work of fiction.\" \"Based upon what I've seen in the trailer and my understanding of what has been written about the film, they wanted to create something much darker and way more dramatic,\" he said. \"I think it's an insult to the thousands of men and women who work hard every day to protect children from predator", "date_str": "2026-09-25T11:31:01+00:00", "hash": "57e22aa5d04ff83e", "title_fa": "کریس هانسن، مجری واقعی «To Catch a Predator» از «Primetime» راضی نیست", "summary_fa": "رابرت پتینسون در نقش کریس هانسن در Primetime. A24 «Primetime» رابرت پتینسون در نقش کریس هانسن مجری «To Catch a Predator» را بازی می کند. «گرفتن یک درنده» یک برنامه تلویزیونی موفق در NBC در دهه 2000 بود. کریس هنسن واقعی فیلم را \"اثر تخیلی\" می نامد. «Primetime» شبکه A24 نگاهی تخیلی به نمایش موفق «برای گرفتن شکارچی» است که از سال 2004 تا 2007 از NBC پخش شد. این فیلم به کارگردانی لنس اوپنهایم، میزبان کریس هنسن (رابرت پتینسون) است که به همراه تهیه‌کننده‌اش اندی بندر (مریت وور) مصمم هستند تا به هر قیمتی «گرفتن یک شکارچی» را در صدر رتبه‌بندی‌ها قرار دهند. این برنامه که به عنوان بخشی از امتیاز مجله خبری \"Dateline\" NBC اجرا می شد، از همان ابتدا به دلیل پخش نیش های مخفی تلویزیونی بحث برانگیز بود. با کمک گروه دیده‌بان عدالت منحرف، قسمت‌ها فیلم‌های دوربین مخفی از رویارویی هانسن با مردانی را نشان می‌دهد که برای داشتن رابطه جنسی با یک خردسال به خانه‌ای می‌آمدند. بعد از گفتگوهای پرتنش، هانسن به مردان می گفت که در تلویزیون حضور دارند و آزادند که آنجا را ترک کنند. آنها اغلب به محض خروج از خانه دستگیر می شدند. همه آن‌ها در «پرایم‌تایم» با سرعتی دیوانه‌کننده و لبه‌ای تلطیف‌شده به تصویر کشیده شده‌اند. پتینسون هانسن را به عنوان یک شخصیت تلویزیونی بی‌عاطفه و خودخواه به تصویر می‌کشد که می‌خواهد «برای گرفتن یک شکارچی» را به محبوبیتی تبدیل کند، که منجر به رویداد بدنام سریال شد: خودکشی بیل کنراد، دادستان منطقه کافمن، که پس از گرفتار شدن در یک سریال عدالت انحرافی، یک سال بعد تیم AWAT را در یک برنامه به ضرب گلوله کشت. پس کریس هنسن واقعی الان کجاست و نظر او درباره به تصویر کشیدن رویدادهای زندگی واقعی در فیلم چیست؟ کریس هنسن «Primimetime» را یک «اثر داستانی کامل» کریس هنسن نامیده است. نوام گالای/WireImage/گتی"}, {"source": "Business Insider", "title": "I got a sneak peek at Qantas’ new business class designed for the world's longest flights. Here are the coolest perks.", "link": "https://www.businessinsider.com/qantas-business-class-long-haul-flights-project-sunrise-2026-9", "summary": "A model of a new Qantas business class seat. Talia Lakritz/Business Insider As part of its Project Sunrise program, Qantas is rolling out enhanced business class seats. Upgrades include privacy doors, memory foam mattresses, wireless charging, and larger screens. Qantas' CEO said efforts to reduce jet lag have proven \"statistically significant\" in test flights. Flying between New York and Australia is about to get a whole lot nicer. As part of Qantas' \" Project Sunrise \" initiative offering more direct routes to and from Australia, the airline is rolling out specially modified Airbus A350 jets with enhanced luxury cabins. This includes refreshed first, business, premium economy, and regular coach classes, with nearly 100 of those being lucrative premium seating — something airlines have aggressively leaned into as people remain willing to pay up for nicer flying experiences . At an event in New York City on Tuesday, I got a sneak peek at what the new business-class seats will look like. Qantas said the cabins are expected to launch between Sydney and London in October 2027, followed by flights between Sydney and New York in mid-2028. Once launched, the roughly 10,000-mile treks would become the world's new longest flights , flying up to 22 hours and dethroning Singapore Airlines' route between Singapore and New York. But they won't be cheap: flyers will likely pay a premium for tickets because of the plane's lower capacity, higher fuel and crew expenses, and its exclusivity on the nonstop routes. Qantas' current one-stop business-class flights from New York to Sydney, stopping in Auckland, cost up to $13,000 round-trip in mid-November. Here are the coolest perks to expect in Qantas' new A350 business class. Sliding doors A rendering of Qantas new business class seats. Qantas Sliding privacy panels are a first for business class on Qantas. The retractable doors measure nearly 4 feet high and create an enclosed suite measuring 3.5 feet wide. Doors have become standard in business class as global airlines continue to capitalize on premium offerings . Qantas also plans to add the feature to future Boeing 787s and Airbus A321XLRs. Upgraded technology A new Project Sunrise business-class seat on display in New York City. Talia Lakritz/Business Insider In addition to power outlets and USB-A and C charging ports, the new seats feature wireless charging. The in-flight entertainment screen has also been expanded to 18 inches — 2 inches larger than systems on Qantas'", "date_str": "2026-09-25T11:14:01+00:00", "hash": "f37481ca96895009", "title_fa": "نگاهی گذرا به کلاس تجاری جدید کانتاس که برای طولانی‌ترین پروازهای جهان طراحی شده بود، انداختم. در اینجا جالب ترین امتیازات وجود دارد.", "summary_fa": "مدلی از صندلی جدید کلاس تجاری کانتاس. Talia Lakritz/Business Insider به عنوان بخشی از برنامه Project Sunrise، کانتاس صندلی‌های کلاس تجاری پیشرفته‌تری را عرضه می‌کند. ارتقاءها شامل درهای حریم خصوصی، تشک های مموری فوم، شارژ بی سیم و صفحه نمایش بزرگتر است. مدیرعامل کانتاس گفت که تلاش‌ها برای کاهش تاخیر جت در پروازهای آزمایشی از نظر آماری قابل توجه بوده است. پرواز بین نیویورک و استرالیا بسیار زیباتر می شود. به عنوان بخشی از طرح \"پروژه طلوع آفتاب\" کانتاس که مسیرهای مستقیم بیشتری را به استرالیا و از استرالیا ارائه می دهد، این شرکت هواپیمایی جت های ایرباس A350 اصلاح شده ویژه را با کابین های لوکس پیشرفته عرضه می کند. این شامل کلاس‌های کلاس‌های کلاس اول، کسب‌وکار، اقتصادی ممتاز، و کلاس‌های مربی معمولی است که تقریباً ۱۰۰ نفر از آن‌ها دارای صندلی‌های ممتاز پردرآمد هستند - چیزی که شرکت‌های هواپیمایی به شدت به آن متمایل شده‌اند، زیرا مردم همچنان مایل به پرداخت هزینه برای تجربه‌های بهتر پرواز هستند. در رویدادی در شهر نیویورک در روز سه‌شنبه، نگاهی گذرا به صندلی‌های کلاس تجاری جدید داشتم. کانتاس گفت انتظار می رود این کابین ها در اکتبر 2027 بین سیدنی و لندن راه اندازی شوند و پس از آن در اواسط سال 2028 پروازهای بین سیدنی و نیویورک انجام شود. پس از راه‌اندازی، این مسیر تقریباً 10000 مایلی به طولانی‌ترین پروازهای جدید جهان تبدیل می‌شود که تا 22 ساعت پرواز می‌کنند و مسیر خطوط هوایی سنگاپور بین سنگاپور و نیویورک را از تخت می‌برند. اما آنها ارزان نخواهند بود: به دلیل ظرفیت کمتر هواپیما، هزینه سوخت و خدمه بیشتر، و انحصاری بودن آن در مسیرهای بدون توقف، پروازکنندگان احتمالاً مبلغی را برای بلیط پرداخت خواهند کرد. پروازهای بیزینس کلاس یک توقفه کنونی کانتاس از نیویورک به سیدنی که در اوکلند توقف دارند، در اواسط نوامبر تا 13000 دلار هزینه رفت و برگشت"}, {"source": "Business Insider", "title": "The new TSA security scanners are getting smaller. Your carry-on bags will be fine.", "link": "https://www.businessinsider.com/new-tsa-security-scanners-carry-on-bags-2026-9", "summary": "Your carry-on bag should fit in the new TSA scanners. Joe Raedle/Getty Images The TSA has been rolling out an enhanced 3D X-ray scanner for around a decade. It speeds up security, but the opening is smaller than the machines it replaced. Some people worry their carry-on bags will no longer fit. They don't need to worry. The Transportation Security Administration's new X-ray scanners are better in almost every way for travelers, except one: The smaller opening may not fit some carry-on bags. The new 3D computed tomography (CT) X-ray machines have been around for a decade, and started rolling out in earnest in 2022. The multibillion-dollar project aims to make security screening more effective and speed up lines by allowing passengers to leave items like laptops and toiletries in their bags. The catch is that the opening is about half an inch smaller than the machines it replaced. Some reports are sounding the alarm that this change could force travelers to pay extra to check a bag once allowed through TSA, or buy a new one small enough to fit. The agency notes on its website that the enhanced scanners may mean certain carry-on bags now need to be checked. The reality is not so dire. Why your carry-on should still fit The TSA's new scanners — nearly 1,200 of which have been deployed at roughly 300 airports nationwide — measure 24.5 inches wide and 16.5 inches high; depth is continuous on the belt. Looking at every US airline's maximum carry-on dimensions, the standard carry-on allowance , largely set based on what can fit in an overhea
