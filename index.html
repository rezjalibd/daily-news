ays be such a legendary moment in pop music, Hilton tells Billboard exclusively. The song, the choreography, the fashion it was everything. I’ve loved re-creating her different looks over the years because each one represents such a special moment in music history. She added: Britney is not only an icon, but also a dear friend, and I’ll always love celebrating her and the incredible impact she’s had on all of us.” This isn t the first year Hilton has transformed into Spears for Halloween. In 2025, the DJ sported a shiny red jumpsuit and a teased ponytail to emulate the Oops! I Did It Again music video, and the year before that, she re-created Spears schoolgirl look in the Baby One More Time visual. In 2023, she celebrated Hallow s Eve in a blue flight attendant getup à la Brit in the 2003 Toxic music video. At this point, it s clear that Hilton is one of Spears biggest fans and the love goes both ways. The singer wrote in her The Woman in Me memoir that the Simple Life alum was “one of the people who was kindest to me when I really needed kindness. “I was crying when I read that, Hilton later said of the passage on The Kelly Clarkson Show . That really touched me. She’s just so strong. I love her so much, and I’m just so proud of her. See photos of Hilton as Spears circa 2001 below, and revisit the full VMAs performance.", "date_str": "2026-10-23T16:00:04+00:00", "hash": "0e740e1e42bdd7cf", "title_fa": "پاریس هیلتون یک «برده 4 یو» در چهارمین لباس هالووین بریتنی اسپیرز است: «لحظه‌ای افسانه‌ای در موسیقی پاپ» (عکس‌های اختصاصی)", "summary_fa": "لباس پاریس هیلتون برای هالووین 2026 چیست؟ این بریتنی است، b h (دوباره)! در عکس‌هایی که به طور انحصاری در روز جمعه (23 اکتبر) با بیلبورد به اشتراک گذاشته شد، این غول اولین ادای احترام فصل ترسناک خود را به دوست دیرینه و نماد پاپ بریتنی اسپیرز ارائه می‌کند، و به طور خاص اجرای خود را از Im a Slave 4 U در جوایز موسیقی ویدیوی MTV در سال 2001 کانالیزه می‌کند. در عکس‌های برایان زیف، هیلتون مدلی از بند سبز شاهزاده پاپ و شورت‌های نگین‌دار را بازآفرینی می‌کند و بله، او حتی با یک مار پیتون آلبینو برمه‌ای شبیه به مار پیتونی که اسپیرز ۲۵ سال پیش روی شانه‌های خود روی صحنه نمایش جوایز حمل می‌کرد، به نمایش درآمد. هیلتون به طور انحصاری به بیلبورد می گوید: «بریتنی یکی از نمادین ترین هنرمندان نسل ما است و «من یک برده 4 یو هستم» همیشه یک لحظه افسانه ای در موسیقی پاپ خواهد بود. آهنگ، رقص، مد همه چیز بود. من در طول سال‌ها دوست داشتم که ظاهر متفاوت او را دوباره خلق کنم، زیرا هر کدام نشان‌دهنده یک لحظه خاص در تاریخ موسیقی است. او افزود: بریتنی نه تنها یک نماد، بلکه یک دوست عزیز است و من همیشه دوست دارم از او و تأثیر باورنکردنی او بر همه ما تجلیل کنم. این اولین سالی نیست که هیلتون برای هالووین به Spears تبدیل شده است. در سال 2025، دی جی یک لباس سرهنگ قرمز براق و یک دم اسبی تمسخرآمیز برای تقلید از اوپس به تن کرد! موزیک ویدیو I Did It Again، و سال قبل از آن، او ظاهر دختر دانش آموزی Spears را در تصویری Baby One More Time بازسازی کرد. در سال 2023، او در موزیک ویدیوی Toxic در سال 2003، جشن حلو را با مهماندار آبی رنگ در بریتانیا جشن گرفت. در این مرحله، واضح", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/paris-hilton-britney-spears-2008-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Ariana Grande Shows Off New Bob That Has Boyfriend Ricky Alvarez Falling in Love All Over Again", "link": "https://www.billboard.com/music/music-news/ariana-grande-debuts-new-hairstyle-boyfriend-ricky-alvarez-1236367155/", "summary": "You like my hair? Gee, thanks, just chopped it. Ariana Grande is now rocking a bob, which she showed off for the first time in a Friday (Oct. 23) post on Instagram and boyfriend Ricky Alvarez is all for it. Related Ariana Grande Mourns Coco, Her Beloved Dog of 17 Years: I Will Miss You Every Day Pete Davidson Slams Online Criticism of Ex-Fiancée Ariana Grande s Appearance: I Think It’s F ked Up Ariana Grande Makes Heartfelt Tweak to Thank U, Next Lyric Dedicated to Ricky Alvarez in Final Eternal Sunshine Show The pop superstar shared a string of selfies in her post, holding the camera sideways and gazing into the lens. But instead of pulled into her signature ponytail or swept up in the chic bun Grande s been wearing lately, her hair stops short a few inches above her shoulders, the ends flipping upward in a peppy swoop. Grande let the new look speak for herself, captioning the photos with a simple heart and tagging hairstylist Brandon Pietsch. The comments quickly filled up with famous friends complimenting the Grammy winner s makeover, with Gigi Hadid writing, rlly cute !!!!!!!!! and Victorious costar Daniella Monet typing, Natural cutie. But Alvarez s comment was definitely the most forward. i wanna ask you out, the photographer wrote. Grande and Alvarez first dated back in 2015, meeting when he worked as the the singer s backup dancer. They split sometime in 2016, but rekindled their romance a decade later, with fans spotting them together throughout summer 2026 amid the Wicked actress Eternal Sunshine Tour and Petal album rollout. “Wrote some songs about Ricky/ I’m tryna make him my last,” Grande sang at her final show of the trek, meaningfully tweaking a lyric in her 2018 seven-week Billboard Hot 100 -topper, Thank U, Next to declare her reignited love for Alvarez. Petal arrived on the last day of July and debuted atop the Billboard 200 . It spawned Grande s 10th Hot 100 No. 1, Hate That I Made You Love Me. After the music video for the album s title track dropped, however, an outpour of comments on her body and appearance flooded the internet. Her rep revealed that she d be taking a step back from the spotlight shortly afterward, citing endless, ongoing public scrutiny. The break has involved dropping out of the West End revival of Sunday in the Park With George which would-be costar Jonathan Bailey has also since pulled out of and scaling back public appearances. She will, however, participate in Focker-in-Law promo as the film s Nov. 25 premiere d", "date_str": "2026-10-23T15:26:17+00:00", "hash": "70d4ef421ddcafc5", "title_fa": "آریانا گرانده باب جدیدی را نشان می دهد که دوست پسرش ریکی آلوارز دوباره عاشق شده است", "summary_fa": "موهای من را دوست داری؟ مرسی، همین الان خردش کردم. آریانا گرانده اکنون در حال تکان دادن باب است که برای اولین بار در یک پست جمعه (23 اکتبر) در اینستاگرام خود را نشان داد و دوست پسر ریکی آلوارز همه چیز را برای این کار دوست دارد. مرتبط آریانا گراند عزادار کوکو، سگ محبوبش در 17 سال است: من هر روز دلم برایت تنگ خواهد شد پیت دیویدسون انتقاد آنلاین از نامزد سابق آریانا گرانده ظاهر آریانا گرانده را به باد انتقاد می‌گیرد: من فکر می‌کنم این کار انجام می‌شود آریانا گرانده به‌خوبی توییتی را انجام می‌دهد. نمایش سوپراستار پاپ یک رشته سلفی در پست خود به اشتراک گذاشت که دوربین را به پهلو گرفته و به لنز خیره شده است. اما به جای اینکه دم اسبی مشخص خود را بکشد یا با مدل موی شیکی که اخیراً گرانده پوشیده است، موهایش چند اینچ بالاتر از شانه‌هایش کوتاه می‌شود، و انتهای آن به شکلی سرحال به سمت بالا می‌چرخد. گرانده اجازه داد ظاهر جدید خودش صحبت کند، عکس‌ها را با یک قلب ساده شرح می‌دهد و آرایشگر براندون پیچ را تگ می‌کند. نظرات به سرعت مملو از دوستان مشهوری شد که از تغییر چهره برنده گرمی تعریف می کردند، با نوشتن جیجی حدید، بسیار زیبا!!!!!!!!! و بازیگر پیروز دانیلا مونه در حال تایپ کردن، عیار طبیعی. اما نظر آلوارز قطعاً جلوگیرترین بود. عکاس نوشت: می خواهم از شما درخواست کنم. گرانده و آلوارز برای اولین بار در سال 2015 با هم قرار گرفتند و زمانی که او به عنوان رقصنده پشتیبان خواننده کار می کرد با هم ملاقات کردند. آنها زمانی در سال 2016 از هم جدا شدند، اما یک دهه بعد دوباره عاشقانه خود را احیا کردند، و طرفداران آنها را در طول تابستان 2026 در کنار هم در میان تور Eternal Sunshine Tour و آلبوم گلبرگ بازیگر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/P103MHHX-e1786379508733.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۱۸:۵۶"}, {"source": "Billboard", "title": "After a Turbulent Year, BNXN Is ‘Back Outside’ & Taking Charge of His Career: Find His Track-by-Track Guide to New EP", "link": "https://www.billboard.com/lists/bnxn-still-in-charge-back-outside-interview/", "summary": "After a heated split with his former management team in 2025, BNXN finds himself in redemption mode. The Nigerian hitmaker, who dropped out of college after catching Burna Boy s attention in the early 2020s, is looking to recapture his momentum, one song at a time. “A whole lot has changed,” BNXN reflects shortly after releasing his new EP, Still in Charge . “After I dropped the Captain album, I toured, reshuffled my team, and took a lot of time off to prepare the music that was coming next. Came back in May and dropped a little project with Sarz called The Game Needs Us. One of the songs went really crazy, Back Outside. I m really excited I got to put that out because it showed people that [ Captain ] wasn t a joke. He really knows what he s doing.” With Still in Charge , released earlier this month, the Afrobeats star sounds rejuvenated and eager to turn the page. Whether he s joining forces with Asake on the opener “Eja Meja” or wrestling with his past on “Deliberate Work,” BNXN (pronounced Benson) moves with purpose and intention. The six-track offering also radiates a warm, festive energy as he looks to shed the remnants of his turbulent past and embrace a fresh start. On “Shamaya,” BNXN trades his frustrations for celebration, revealing a lighter, more carefree side of the twenty-something singer-songwriter. Billboard caught up with BNXN for his explanation of each of the six tracks on Still in Charge , the surprising amount he paid Qing Madi for her background vocals on “16,” and how he bounced back from his highly publicized online crashout.", "date_str": "2026-10-23T15:16:31+00:00", "hash": "a5427531d34fb879", "title_fa": "پس از یک سال پرتلاطم، BNXN \"بازگشت به بیرون\" است و مسئولیت حرفه خود را بر عهده می گیرد: راهنمای آهنگ به تراک او را برای EP جدید پیدا کنید", "summary_fa": "پس از جدایی شدید با تیم مدیریت سابق خود در سال 2025، BNXN خود را در حالت رستگاری می بیند. هیت ساز نیجریه ای که پس از جلب توجه Burna Boy در اوایل دهه 2020، کالج را رها کرد، به دنبال این است که شتاب خود را دوباره به دست آورد، یک آهنگ. BNXN مدت کوتاهی پس از انتشار EP جدید خود، Still in Charge، منعکس می کند: «خیلی چیزها تغییر کرده است. «بعد از اینکه آلبوم کاپیتان را رها کردم، به تور رفتم، تیمم را تغییر دادم و زمان زیادی را برای آماده کردن موسیقی که در راه بود، گرفتم. در ماه می برگشتم و پروژه کوچکی را با Sarz به نام The Game Needs Us منتشر کردم. یکی از آهنگ ها واقعا دیوانه شد، Back Outside. من واقعاً هیجان‌زده‌ام که مجبور شدم آن را بیان کنم، زیرا به مردم نشان داد که [کاپیتان] شوخی نبود. او واقعاً می داند که دارد چه کار می کند.» با Still in Charge که در اوایل این ماه منتشر شد، ستاره Afrobeats جوان شده و مشتاق به تغییر صفحه به نظر می رسد. چه او در حال پیوستن به نیروهای Asake در بازکننده \"Eja Meja\" یا کشتی با گذشته خود در \"Deliberate Work\" باشد، BNXN (تلفظ بنسون) با هدف و نیت حرکت می کند. پیشنهاد شش آهنگی همچنین انرژی گرم و جشنی را ساطع می کند، زیرا او به دنبال رها کردن بقایای گذشته آشفته خود و در آغوش گرفتن شروعی تازه است. در «شمایا»، BNXN ناامیدی‌هایش را با جشن عوض می‌کند و جنبه‌ای سبک‌تر و بی‌خیال‌تر از خواننده و ترانه‌سرا بیست و چند ساله را نشان می‌دهد. بیلبورد با BNXN برای توضیح هر یک از شش آهنگ در Still in Charge، مبلغ شگفت‌انگیزی که به چینگ مادی برای آواز پس‌زمینه‌اش در «16» پرداخت کرد، و نحوه بازگشت او از کراش اوت", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/bnxn-2026-press-cr-mykyta-vashchenko-billboard-1800.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۸:۴۶"}, {"source": "Billboard", "title": "John Legend to Appear With Democratic Ohio Gov. Candidate Amy Acton Amid Backlash Against Opponent’s ‘Deeply Troubling’ Ad", "link": "https://www.billboard.com/culture/politics/john-legend-appear-ohio-gov-candidate-acton-backlash-ramaswamy-1236367094/", "summary": "John Legend will throw his hat into the ring for Ohio gubernatorial candidate Dr. Amy on Monday (Oct. 26), when he is slated to appear with the former state director of the Ohio Department of Health at a rally in Dayton. Legend is just one of the bold-faced names Acton will bring out on the road with her in the lead-up to the Nov. 3 midterm election in which she is facing off against tech mogul and former DOGE co-lead Vivek Ramaswamy. First up on Sunday (Oct. 25) will be a joint appearance in Akron with Democratic U.S. Senator from Georgia Rev. Raphael Warnock, followed by a rally in Cincinnati on Oct. 28 featuring Queen City natives Aaron Dessner and Matt Berninger of The National. Springfield, Ohio native Legend has long used his platform to stump for candidates and causes, backing former President Barack Obama in 2008 and endorsing former Vice President Kamala Harris in her 2024 presidential bid. He also spoke out during that campaign against unfounded, hateful racist attacks by then-candidate Donald Trump and running mate and Ohio native JD Vance against the Haitian resident of Springfield. Legend s support for Acton comes as Ramaswamy s campaign has come under fierce bipartisan pushback for a campaign ad in which Acton s long-estranged mother repeatedly calls her daughter a liar while insinuating that Acton s claims that she was sexually abused by her stepdad, and that the family was homeless and lived in a tent for a period, are untrue. “It’s not easy for a mother to say this, but Amy has a serious problem,” Donna Arthur says in the ad. “She lies about her past. She says she grew up living in a tent. None of that is true. She’s lied her entire life. Acton, 60, has said she hasn t spoken to her mother since she was 12-years-old, when officials removed her from her mother s custody. Police arrested Acton s stepfather in July 1978 on rape charges , with a grand jury later indicting Arthur for engaging in sexual conduct with Acton when she was under the age of 13. Arthur, who pleaded not guilty to the charges initially, did not appear in court and later fled, along with her mother, and became a fugitive. 13ABC also reported that documents provided by Acton s campaign include police and court records and a 1982 sheriff s report in which a park manager confirmed that Acton s stepfather, Cledith Arthur, lived at the campground years earlier. The ad, which many political pundits have called the most disturbing of a very heated political season, has gotten pu", "date_str": "2026-10-23T15:16:30+00:00", "hash": "fe8e12699023103d", "title_fa": "جان لجند با امی اکتون، نامزد دموکرات فرماندار اوهایو در میان واکنش‌های شدید علیه تبلیغ «عمقاً نگران‌کننده» مخالف ظاهر می‌شود.", "summary_fa": "جان لجند روز دوشنبه (26 اکتبر)، زمانی که قرار است همراه با مدیر سابق وزارت بهداشت اوهایو در یک گردهمایی در دیتون ظاهر شود، کلاه خود را برای کاندیدای فرمانداری اوهایو، دکتر امی، به رینگ خواهد انداخت. Legend تنها یکی از نام‌های جسورانه‌ای است که اکتون در انتخابات میان‌دوره‌ای 3 نوامبر با او در جاده‌ها به میدان می‌آورد و در آن با غول فناوری و همکار سابق DOGE ویوک راماسوامی روبرو می‌شود. اولین بار در روز یکشنبه (اکتبر. 25) یک حضور مشترک در آکرون با سناتور دموکرات ایالات متحده از جورجیا کشیش رافائل وارنوک خواهد بود و پس از آن گردهمایی در سینسیناتی در 28 اکتبر با حضور بومیان کوئین سیتی آرون دسنر و مت برنینگر از The National برگزار خواهد شد. افسانه بومی اسپرینگفیلد، اوهایو، مدت‌هاست که از پلتفرم خود برای حمایت از نامزدها و اهداف، حمایت از باراک اوباما، رئیس‌جمهور سابق در سال 2008 و حمایت از معاون رئیس‌جمهور سابق کامالا هریس در رقابت‌های ریاست‌جمهوری سال 2024 استفاده کرده است. او همچنین در جریان آن مبارزات انتخاباتی علیه حملات نژادپرستانه بی‌اساس و نفرت‌انگیز توسط دونالد ترامپ، نامزد سابق انتخابات و جی‌دی ونس، اهل اوهایو، علیه ساکنان هائیتی در اسپرینگفیلد صحبت کرد. حمایت افسانه‌ای از اکتون در حالی صورت می‌گیرد که کمپین راماسوامی با واکنش شدید دو حزبی برای تبلیغات کمپینی روبرو شده است که در آن مادر اکتون که مدت‌ها از او دور شده بود، بارها دخترش را دروغگو خطاب می‌کند و در عین حال القا می‌کند که اکتون ادعا می‌کند که توسط پدرخوانده‌اش مورد آزار جنسی قرار گرفته است، و اینکه خانواده بی‌خانمان بوده و در یک چادر زندگی می‌کنند. دونا آرتور در تبلیغ می گوید: گفتن این حرف برای مادر آسان نیست، اما امی یک مشکل جدی دارد. او در مورد گذشته خود دروغ می گوید. او می گوید که در یک چادر بزرگ شده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P106J9VJ-e1792765487484.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۱۸:۴۶"}, {"source": "Billboard", "title": "‘People Might Think I’m a Closed Book’: On Her Debut Album, Jazzy Is Opening Up", "link": "https://www.billboard.com/music/music-news/jazzy-interview-peace-and-patience-album-calvin-harris-1236367057/", "summary": "Jazzy had made a lot of music for her debut album — and when it came time to decide which songs would make it onto the project, she selected tracks around two related themes. These concepts were so crucial to the music and the experiences that informed it that she ultimately made them the name of the album. This 13-song set, Peace Patience , is out today (Oct. 23) via Chaos Records. A tight 36 minutes of sumptuous house-leaning dance pop, the album is centered around Jazzy s gorgeously textured voice and cements her as a crucial next-gen dance pop hitmaker. Related Head Trip 2026 Was (Accidentally) the Craziest One-Night Lineup in EDM History: Seven Takeaways From the Historic Festival Tate McRae Debuts at No. 1 In Australia With Housewife LISA, Miley, Kacey Musgraves John Mayer: New Music Friday Guide She s developed this reputation in her native Ireland and nearby U.K. over the last half-decade with a series of chart hits, including 2023 s Giving Me — her first solo single, which reached No. 3 on the UK Singles Chart and hit No. 1 on the Official Irish Singles Chart, knocking “Miracle” by Calvin Harris and Ellie Goulding into the No. 2 position. Harris noticed, which led to him and Jazzy pairing up for May s Satisfy, which itself hit No. 1 on Billboard s Dance Airplay chart this past June. All in, the Dublin-born DJ/producer has made these successes look pretty easy — and in fact, she makes her journey from Dublin child violinist to chart-topping dance star sound pretty breezy too. Meeting with Billboard in a sunny office in the Capitol Records building in Los Angeles on a recent Friday morning, Jazzy — dressed in athleisure — is cheerful and warm. Tonight (Oct. 23), she ll play a set at the nearby nightclub Sound, the second to last date on an American club tour around Peace Patience . The album s release party will find her back in her native Dublin, where she plans celebrate at the pub with a handful of friends before joining many thousand more the next evening for a show at the city s 3Arena that will mark her biggest headlining performance to date. Here, Jazzy talks about her origins, her album and being in the studio with Harris. You ve said you had a lot of music to choose from for the album, some of it a few years old. Were you selecting songs around a theme in terms of what ultimately made it on? Yeah, I wanted them to be cohesive, and I wanted to pick ones that meant the most to me — ones with stories I wanted to tell. I feel like people might ", "date_str": "2026-10-23T15:01:51+00:00", "hash": "5a9f46a36213bc51", "title_fa": "\"مردم ممکن است فکر کنند من یک کتاب بسته هستم\": در اولین آلبوم خود، Jazzy در حال باز شدن است", "summary_fa": "Jazzy برای اولین آلبوم خود آهنگ های زیادی ساخته بود - و زمانی که زمان تصمیم گیری فرا رسید که کدام آهنگ ها وارد پروژه شوند، او آهنگ هایی را با دو موضوع مرتبط انتخاب کرد. این مفاهیم به قدری برای موسیقی و تجربیاتی که به آن کمک می‌کرد بسیار حیاتی بودند که در نهایت او آنها را به نام آلبوم تبدیل کرد. این مجموعه 13 آهنگی، صبر صلح، امروز (23 اکتبر) از طریق Chaos Records منتشر شد. این آلبوم با 36 دقیقه رقص پاپ مجلل و متمایل به هاوس، حول صدای بسیار زیبای Jazzy متمرکز شده است و او را به عنوان یک سازنده هیت پاپ رقص نسل بعدی تعیین می کند. Related Head Trip 2026 (به طور تصادفی) دیوانه‌کننده‌ترین ترکیب یک شبه در تاریخ EDM ب ت هاگن (تام ریس", "image_url": "https://deadline.com/wp-content/uploads/2026/10/MCDCLAY_WB023.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۱۸:۵۱"}, {"source": "Deadline", "title": "Dylan Douglas’ Movie Debut ‘The Hit On Hitler’ Heads To AFM With Bleiberg, First Look", "link": "https://deadline.com/2026/10/dylan-douglas-movie-debut-hit-on-hitler-first-look-afm-1237171688/", "summary": "EXCLUSIVE: Bleiberg Entertainment has acquired international rights to historical crime thriller The Hit on Hitler: Mobsters vs. Nazis, starring Michael Douglas son Dylan Douglas in his feature debut. Currently in post-production, the film will be presented to international distributors at the upcoming American Film Market in Lost Angeles in November. Based on true events, The [ ]", "date_str": "2026-10-23T15:17:02+00:00", "hash": "3595fd41822c5551", "title_fa": "اولین فیلم دیلن داگلاس با نام «هیتلر» با بلیبرگ به AFM می رود، نگاه اول", "summary_fa": "انحصاری: Bleiberg Entertainment حقوق بین‌المللی تریلر جنایی تاریخی The Hit on Hitler: Mobsters vs. در حال حاضر این فیلم در مرحله پس از تولید قرار دارد و در ماه نوامبر در بازار فیلم آمریکا در لوست آنجلس به توزیع کنندگان بین المللی ارائه خواهد شد. بر اساس وقایع واقعی، [ ] انحصاری : Bleiberg Entertainment حقوق بین‌المللی برای فیلم جنایی تاریخی The Hit on Hitler: Mobsters vs. دیلن داگلاس، پسر 26 ساله مایکل داگلاس و کاترین زتا جونز، اولین بازی خود را به عنوان بازیگر اصلی فیلم انجام می دهد. دیوید آرکت، هری گودوینز و لورنزو آنتونوچی از دیگر بازیگران آن هستند. جانی آبراهامز، جرمی لوک، گرگ فاینلی، گراهام سیبلی شارون آزریلی، لکسی افرون و آکی آونی دیگر بازیگران این فیلم هستند. Watch on Deadline Pic به کارگردانی دنی آ. آبکاسر و نویسندگی کوستا کوندیلوپولوس است که هر دو به عنوان کارگردان و نویسنده در The Perfect Gamble و Inside Man با هم کار کردند. تهیه‌کنندگان فیلم‌های 2B و Sagi Wolf هستند. تهیه کنندگان اجرایی پری هیمن، جف هافمن هستند. ریچارد برنر، آریل سبگ، دان ورلی گالیت روزنشتاین، رافائل گلاسبرگ شارون آزریلی، یاکی رسنیر. موشه ادری آبکاسر گفت: \"من دوست داشتم به بوداپست برگردم تا فیلم ضربه به هیتلر را بسازم. بزرگ شدن دو موضوع مورد علاقه من در فیلم ها جنگ جهانی دوم و فیلم های گانگستری بود. بنابراین وقتی از این داستان واقعی مطلع شدم. مجبور شدم آن را بسازم. به علاوه دوست داشتم با دیلن داگلاس کار کنم. او بسیار حرفه ای بود و نمی توانم منتظر اجرای جهانی باشم. فکر می‌کنم آینده درخشانی در انتظارش است.»", "image_url": "https://deadline.com/wp-content/uploads/2026/10/The-Hit-On-Hitler.jpeg?w=309", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱ آبان • ۱۸:۴۷"}, {"source": "Deadline", "title": "‘The Notebook’ Musical Plans West End Premiere", "link": "https://deadline.com/2026/10/the-notebook-london-west-end-1237171679/", "summary": "The Notebook, the Ingrid Michaelson-Bekah Brunstetter stage musical adaptation of the Nicholas Sparks novel that ran on Broadway in 2024, will makes its West End debut this spring. The musical no cast has been announced will begin performances at the newly renamed Judi Dench Theatre (formerly the Shaftesbury Theatre) on March 10, 2027, [ ]", "date_str": "2026-10-23T15:08:58+00:00", "hash": "450d37b0104d5f88", "title_fa": "اولین نمایش موزیکال پلان‌های نوت بوک وست اند", "summary_fa": "نوت بوک، اقتباسی موزیکال اینگرید مایکلسون-بکا برانستتر از رمان نیکلاس اسپارکس که در سال 2024 در برادوی پخش شد، اولین نمایش خود را در بهار امسال وست اند انجام می دهد. این موزیکال هیچ بازیگری اعلام نشده است که اجراهای خود را در تئاتر جودی دنچ که به تازگی تغییر نام داده است (تئاتر سابق شفتزبری) در 10 مارس 2027 آغاز خواهد شد، [ ] The Notebook , اقتباس موزیکال روی صحنه اینگرید مایکلسون-بکا برونستتر از رمان نیکلاس اسپارکس که در بهار 20 در West2 اکران خواهد شد. کارگردانی این فیلم موزیکال بر عهده مایکل گریف و شل ویلیامز و طراحی رقص توسط کیتی اسپلمن خواهد بود. این موزیکال بر اساس رمان Sparks ساخته شده است، موسیقی و اشعار مایکلسون و کتابی از Brunstetter. داستان‌های مرتبط بازیگران ساشا بارون کوهن تایید کرد که در کوئنتین تارانتینو بازی می‌کند و در مرحله غربی بازی ب یوست.", "image_url": "https://media.pitchfork.com/photos/6adb77ef6ce05bb1686495fa/16:9/w_1280,c_limit/chappell-roan.jpg", "category": "موبایل و گجت‌ها", "tags": ["رسانه", "هنر"], "datetime_fa": "۱ آبان • ۱۸:۳۷"}, {"source": "Rolling Stone", "title": "The Dream of the Nineties Animation Boom Is Alive in ‘Wildwood’", "link": "https://www.rollingstone.com/tv-movies/tv-movie-reviews/wildwood-review-laika-animation-1235644538/", "summary": "Latest stop-motion fantasy from Laika isn’t perfect — but it makes a strong case for why this artisanal animation studio matters", "date_str": "2026-10-23T15:15:00+00:00", "hash": "d5da193930ed9d0c", "title_fa": "رونق انیمیشن رویای دهه نود در «وایلد وود» زنده است", "summary_fa": "آخرین استاپ موشن فانتزی لایکا بی‌نقص نیست - اما دلیل محکمی برای اهمیت این استودیوی انیمیشن حرفه‌ای است. خانه‌های انیمیشنی وجود دارند که در آنها طنزهای خنده‌دار، ارجاعات فرهنگ پاپ و درس‌های ساده زندگی می‌روند - و پس از آن لایکا وجود دارد. استودیوی شمال غربی اقیانوس آرام که Coraline و Kubo and the Two Strings را در اختیار ما قرار داد، حس و حال هنری و منطقه ای یک شرکت ضبط مستقل را دارد. این مانند K Records از تون های استاپ موشن است. و آن حالات مبهم هیپستر پورتلندیا در Wildwood بسیار وجود دارد، تا حدی به شکل خود تمسخر نور و تا حدی در تاریکی عجیب و غریب (یا شاید دمدمی بودن تاریک) که داستان فانتزی YA آن را رنگ می کند. گویی پایگاه اصلی لایکا در هیلزبورو، منطقه اورگان که به‌عنوان جنگل سیلیکون شناخته می‌شود، به اندازه کافی قوی نبود، این افسانه مدرن منبع خود را از رمانی از کالین ملوی، خواننده دسامبر گرایان و همسر تصویرگرش، کارسون الیس، در سال 2011 دریافت می‌کند. رویای دهه نود در این داستان بلوغ بسیار زنده است. رویای رونق انیمیشن دهه نود نیز همینطور است، که در آن اهتزاز پرچم‌های عجیب و غریب و فرکانس‌های احساسی که قبلاً استفاده نشده بود به یک رنسانس کمک کرد. در واقع، این تفریح ​​محبت آمیز فیلم از پورتلند است که اول شما را جلب می کند، یک جشن دست ساز متحرک از کافی شاپ های بوهو، بازارهای کشاورزان بد بو، مجسمه های خیابانی، و سرزمین موعود کتاب دوست که کتاب های پاول است. (مراق ": "Belgian TV series “The Inheritance,” about the death of a wealthy widow that ignites a battle over her estate, scored the Sony Pictures Television Award for best drama project at Rome s MIA Market as its 12th edition wrapped Friday. The show, which is being produced by Kristoffel Mertens and Kato Maes for Belgian shingle Panenka, [ ]", "date_str": "2026-10-23T15:34:37+00:00", "hash": "db5d40e112e57113", "title_fa": "سریال بلژیکی The Heritance جایزه تلویزیون سونی پیکچرز را در بازار MIA رم دریافت کرد.", "summary_fa": "مجموعه تلویزیونی بلژیکی \"ارث\" درباره مرگ یک بیوه ثروتمند که آتش جنگ بر سر دارایی او را به راه می‌اندازد، جایزه تلویزیونی سونی پیکچرز را برای بهترین پروژه درام در بازار MIA رم در دوازدهمین دوره آن به پایان رساند. این نمایش که توسط کریستوفل مرتنس و کاتو ماس برای شینگ بلژیکی Panenka تهیه می‌شود، [ ] مجموعه تلویزیونی بلژیکی \"ارث\" درباره مرگ یک بیوه ثروتمند که آتش جنگ بر سر املاک او را به راه می‌اندازد، جایزه تلویزیون سونی پیکچرز را برای بهترین پروژه درام در جمعه بازار MIA در رم دریافت کرد. هیئت داوران افزود: ایده شخصیت‌های هیجان‌انگیز ساکن در دنیایی اصیل، همراه با موضوع جهانی ارثیه خانواده، به سریال طنین اصیل و متمایز می‌دهد که آن را در چشم‌انداز تلویزیونی متمایز می‌کند. جوایز محبوب توسعه MIA در Variety MIA همچنین به چندین پروژه منتخب در چهار دسته بازار تولید مشترک و انجمن ارائه شد که هر کدام جوایز نقدی برای حمایت از توسعه خود دریافت کردند. جایزه توسعه پروژه سریال انیمیشن برجسته به سوفی، اگر هستی به ما نشان بده! به کارگردانی داریو پیانا ایتالیایی، محصول مشترک ایتالیا، بلژیک و اسپانیا بین برند کراس، 20 عکس تا نیمه شب و دیجیاتونز اینترتینمنت، رسید. این سریال بر روی یک نوجوان 13 ساله به نام سوفی تمرکز دارد که هر روز در قبرستان میلان برای پدربزرگش توماس عزاداری می کند. واقعیت او زمانی از هم می پاشد که دو کودک ارواح بدجنس از جهان پایین، به اصطلاح Vivitic Séance ممنوعه ای اجرا می کنند و به طور تصادفی سوفی را به این قلمرو دیگر می کشانند.", "image_url": "https://variety.com/wp-content/uploads/2026/10/Inheritance-1000-1.jpg?w=1000&#038;h=563&#038;crop=1", "ca         const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
