ur in London With Tease of More 2027 Dates Hilary Duff Reveals Why She Declared I m Going to Be a Pop Star After Lizzie McGuire Hilary Duff Pays Tribute to Hayden Panettiere: I So Deeply Wish This Wasn t the End for You The tour is an expansion of an extremely successful return to the road for Duff, having launched the Lucky Me Tour in support of her sixth studio album, Luck Or Something , making it her first full-scale global headlining tour in nearly two decades. The album additionally left a mark on the charts, debuting at No. 3 on the Billboard 200 upon its release in March of this year. Fans got a preview of the announcement of more dates before Duff officially revealed them. During the final U.K. show of the tour at London s O2 Arena last week her second sold-out performance at the venue Duff closed the night with What Dreams Are Made Of. As butterfly-shaped confetti fell over the crowd, some pieces carried the message 2027 More Dates Loading, while a countdown clock appeared on the arena screens and simultaneously went live on Duff s website. The mystery immediately sent fans online into a frenzy, speculating about where she would take the tour next. The new European dates will feature Rebecca Black as support, while Dashboard Confessional and Tegan and Sara will join Duff for select U.S. shows. The 2027 U.S. run includes stops in Orlando, Raleigh, Baltimore, Uncasville, Cleveland, Pittsburgh, Fort Worth, Milwaukee and Denver, along with other cities before the Anaheim finale. For fans hoping to catch the new shows, presales begin in select markets on Monday (Sept. 28), with additional artist and partner presales rolling out throughout the week. General onsale begins Friday (Oct. 2). Fans can sign up for Duff s artist presale through her official tour site . See the full list of tour dat", "date_str": "2026-09-23T13:00:00+00:00", "hash": "12b85439b0ceff76", "title_fa": "خوش شانس! تور لاکی من هیلاری داف هنوز تمام نشده است: 32 تاریخ دیگر اعلام شد", "summary_fa": "هیلاری داف بازگشت خودش را دارد. این ستاره پاپ پس از بازگشت طولانی‌مدت خود به جاده‌ها در سال جاری، تور Lucky Me را در سال 2027 با توقف‌هایی که به‌تازگی اعلام شده در سراسر اروپا، آمریکای لاتین و ایالات متحده برگزار می‌کند. این سفر کاملاً جدید از 7 می در مادرید آغاز می شود و داف قرار است از شهرهایی مانند برلین، پاریس، آمستردام، کپنهاگ و استکهلم قبل از رفتن به آمریکای لاتین برای توقف در سان خوان، اس و پائولو، بوئنوس آیرس و سانتیاگو سفر کند. او سپس برای اجرای نمایش دیگری به ایالات متحده بازخواهد گشت که از اول اکتبر در Sunrise، فلوریدا آغاز می شود و در 20 نوامبر در Anaheim، کالیفرنیا به پایان می رسد. این تور گسترش یک بازگشت بسیار موفق به جاده برای داف است، که تور Lucky Me را در حمایت از ششمین آلبوم استودیویی او، Luck Or Something، راه اندازی کرد، و آن را اولین تور جهانی او در مقیاس کامل در حدود دو دهه اخیر کرد. این آلبوم به‌علاوه در چارت‌ها اثری از خود بر جای گذاشت و در رتبه اول قرار گرفت. 3 در بیلبورد 200 پس از انتشار در ماه مارس سال جاری. طرفداران پیش نمایشی از اعلام تاریخ های بیشتر قبل از اینکه داف به طور رسمی آنها را فاش کند، دریافت کردند. در طول آخرین نمایش بریتانیا از تور در لندن در O2 Arena هفته گذشته دومین اجرای او در محل برگزاری داف شب را با What Dreams Are Made Of پایان داد. هنگامی که کنفتی‌های پروانه‌ای‌شکل بر روی جمعیت می‌افتند، برخی از قطعات پیام 2027 بارگیری تاریخ‌های بیشتر را داشتند، در حالی که یک ساعت شمارش معکوس روی صفحه‌نمایش‌ها ظاهر شد و به طور همزمان در وب‌سایت داف به صورت زنده پخش شد. این رمز و راز بلافاصله طرفداران را در فضای مجازی به جنون انداخت"}, {"source": "Billboard", "title": "Aaron Dessner on Songwriting & Collaborating With Taylor Swift, Noah Kahan & Gracie Abrams | Billboard On The Record", "link": "https://www.billboard.com/video/aaron-dessner-on-songwriting-with-taylor-swift/", "summary": "From Taylor Swift to Noah Kahan and Gracie Abrams, Aaron Dessner is one of the industry’s most sought-after collaborators. The musician, producer and record label owner has built a career across many different corners of the music industry, from his work with The National to producing and writing with some of today’s biggest artists to launching a studio, record label and a number of music festivals. Dessner joins Billboard’s Kristin Robinson on this week’s episode of Billboard On The Record to talk through his music industry journey, the art of collaboration, and how his experimentation with founding record labels and music festivals fed his artistic drive.Love what you hear? Don’t forget to rate, review and subscribe so you never miss an episode of Billboard On The Record.Love what you hear? Follow Billboard On The Record on Instagram, TikTok, Apple Podcasts, Spotify and Youtube @billboard so you never miss an episode. Billboard On The Record is a podcast in partnership with SickBird Productions. Kristin’s episode glam is sponsored by Booka, the new and easiest way to book LA’s most sought-after beauty and wellness professionals—all vetted, curated, and bookable in one place. For a limited time, use code BILLBOARD30 at checkout for $30 off your first booking when you go to Booka.com Aaron Dessner I feel like I m a born collaborator cause I m a twin. It s, like, built into my psyche. Kristin Robinson Gracie and Noah and Taylor, three collaborators of yours, what do each of them bring to the table that you find to be particularly their special sauce? Aaron Dessner I mean, they re all brilliant. Taylor is It s like watching some master painter create a masterpiece within minutes. Kristin Robinson Back when you guys were first getting started, you guys founded Brassland, your own record label. Aaron Dessner Yeah. That wasn t the first label we made. Later, we made something called ‘People.’ You have a new label through Interscope, Long Pond Music. What are your goals with that? The idea with it is really, like, to give a home to music, which might need more time to develop. If Long Pond is a place where people feel for some reason comfortable, like, sometimes it would be nice if there was, like, a direct outlet for that. Kristin Robinson So you co-founded Boston Calling. I wanna know the origin story for that. Aaron Dessner This opportunity came up to do a festival, and then we just kind of got together and tried it, and it worked. Kristin Robinson If you wa", "date_str": "2026-09-23T13:00:00+00:00", "hash": "98dc542ef09742a1", "title_fa": "آرون دسنر در آهنگسازی و همکاری با تیلور سویفت، نوآ کاهان و گریسی آبرامز | بیلبورد در رکورد", "summary_fa": "از تیلور سوئیفت گرفته تا نوح کاهان و گریسی آبرامز، آرون دسنر یکی از پرطرفدارترین همکاران این صنعت است. این نوازنده، تهیه‌کننده و صاحب کمپانی ضبط، در گوشه‌های مختلف صنعت موسیقی، از کارش با The National گرفته تا تهیه‌کنندگی و نویسندگی با برخی از بزرگترین هنرمندان امروزی تا راه‌اندازی یک استودیو، لیبل ضبط و تعدادی از جشنواره‌های موسیقی، حرفه‌ای ایجاد کرده است. دسنر به کریستین رابینسون بیلبورد در اپیزود این هفته بیلبورد در ضبط می‌پیوندد تا درباره سفر صنعت موسیقی خود، هنر همکاری، و اینکه چگونه آزمایش‌هایش با تأسیس شرکت‌های ضبط و جشنواره‌های موسیقی انگیزه هنری او را تغذیه می‌کند، صحبت کند. آنچه را که می‌شنوید دوست دارید؟ فراموش نکنید که امتیاز دهید، مرور کنید و مشترک شوید تا هرگز قسمتی از Billboard On The Record را از دست ندهید. آنچه را می شنوید دوست دارید؟ Billboard On The Record را در اینستاگرام، TikTok، Apple Podcasts، Spotify و Youtube @billboard دنبال کنید تا هرگز قسمتی را از دست ندهید. Billboard On The Record یک پادکست با همکاری SickBird Productions است. اپیزود کریستین توسط بوکا حمایت مالی می‌شود، این راه جدید و ساده برای رزرو پرطرفدارترین متخصصان زیبایی و تندرستی لس‌آنجلس - همه بررسی‌شده، سرپرستی شده و قابل رزرو در یک مکان. زمانی که به Booka.com مراجعه می‌کنید، برای مدت محدودی از کد BILLBOARD30 در هنگام تسویه‌حساب استفاده کنید و با 30 دلار تخفیف در اولین رزرو خود استفاده کنید. این در روان من ساخته شده است. کریستین رابینسون گریسی و نوح و تیلور، سه همکار شما، هر کدام از آنها چه چیزی را سر میز می آورند که به نظر شما سس مخصوص آنهاست؟ منظورم آرون دسنر، همه آنها فوق العاده هستند. تیلور مثل تماشای یک نقاش چیره دست است که در عرض چند دقیقه یک شاهکار خلق می کند. کریستین رابینسون زمانی که شما بچه ها برای اولین بار"}, {"source": "Billboard", "title": "Rush Members Helped Push Campaign For Permanent Neil Peart Memorial in Ontario Park Over the Top With Massive Donation", "link": "https://www.billboard.com/music/rock/rush-lee-lifeson-huge-donation-neil-peart-memorial-park-ontario-1236345237/", "summary": "Rush singer Geddy Lee and guitarist Alex Lifeson just made sure that their late bandmate drummer Neil Peart will have a permanent memorial in his old hometown. Six years after a campaign was launched to raise $1 million for a Peart memorial in Lakeside Park in St. Catharines, Ontario — near the spot where Peart spent his youth — Lee and Lifeson recently presented a check for $785,000 to the Neil Peart Commemorative Task Force Fundraising sub-committee, helping to secure the goal amount, according to CKTB News . During their ongoing Fifty Something tour, Rush earmarked a portion of the proceeds from their VIP tickets to the memorial for the drummer who died in 2020 after a battle with brain cancer; Lee also donated $1 from every ticket sold during his book tour for his My Effin Life memoir. “After years of dedicated work by the Neil Peart Commemorative Task Force and the incredible community support that brought us near the finish line, this remarkable contribution from Rush secures our $1-million fundraising goal,” said St. Catharines city manager, community programs and parks Eric Lamothe in a statement about the massive check presented to the fundraising task force after their hometown shows at Scotiabank Arena in Toronto on Aug. 13. “This public art memorial will be far more than a tribute to Neil Peart; it elevates the park into a world-class cultural landmark, he continued. We are thrilled to see a space that is already a beloved destination for residents and tourists become a global beacon for enthusiastic music fans to gather, reflect, and celebrate an icon for generations to come.” The campaign launched in 2020 in an effort to place a statue or plaque dedicated to drummer and lyricist Peart in the park that inspired the song Lakeside Park on Rush s 1975 Caress of Steel album. According to CKTB News, a staff report will be presented during a city council meeting this month detailing next steps. Morgan MacDonald of the Newfoundland Bronze Foundry was selected to design the memorial for the pavilion in Lakeside Park, which was renamed Neil Peart Pavilion in Sept. 2024. The concept from MacDonald s team includes two larger-than-life bronze sculptures of Peart, which will be connected by a pathway offering experiential and interpretive features providing insight into Peart s personal and professional legacies, including his time with the band, according to the City of St. Catharines site. The memorial park is officially slated to open in late 2027. Chec", "date_str": "2026-09-23T12:36:07+00:00", "hash": "b3da4ca51bedc21c", "title_fa": "اعضای راش به کمپین یادبود دائمی نیل پیرت در پارک انتاریو با کمک مالی عظیم کمک کردند", "summary_fa": "گدی لی، خواننده راش و الکس لایفسون، گیتاریست، تازه مطمئن شدند که نیل پیرت، درامر فقید هم گروهشان، یک یادبود دائمی در زادگاهش خواهد داشت. شش سال پس از راه‌اندازی کمپینی برای جمع‌آوری یک میلیون دلار برای یادبود Peart در پارک Lakeside در سنت. بر اساس اخبار CKTB، لی و لایفسون اخیراً چکی به ارزش 785000 دلار به کمیته فرعی نیروی کار یادبود نیل پیرت ارائه کردند که به تضمین مبلغ هدف کمک کرد. راش در جریان تور پنجاه چیزی که در جریان بود، بخشی از درآمد حاصل از بلیط های VIP خود را به یادبود درامر اختصاص داد که در سال 2020 پس از مبارزه با سرطان مغز درگذشت. لی همچنین 1 دلار از هر بلیط فروخته شده در طول تور کتاب خود را برای خاطرات My Effin Life اهدا کرد. اریک لاموت، مدیر شهر سنت کاترینز، برنامه‌های اجتماعی و پارک‌ها در بیانیه‌ای در مورد چک عظیمی که پس از نمایش خانه‌شان در خانه S. Cathrines ارائه شد، گفت: «پس از سال‌ها کار اختصاصی توسط گروه ویژه یادبود نیل پیرت و حمایت باورنکردنی جامعه که ما را به خط پایان نزدیک کرد، این کمک قابل توجه از راش هدف جمع‌آوری کمک مالی ۱ میلیون دلاری ما را تضمین می‌کند. تورنتو در 13 آگوست. او ادامه داد: «این یادبود هنری عمومی بسیار بیشتر از ادای احترام به نیل پیرت خواهد بود؛ این پارک را به یک نقطه عطف فرهنگی در سطح جهانی ارتقا می‌دهد."}, {"source": "Billboard", "title": "Red Hot Chili Peppers, Dave Grohl, Vince Staples & More Set For 2026 Silverlake Conservatory of Music 25th Anniversary Benefit Concert", "link": "https://www.billboard.com/music/music-news/2026-silverlake-conservatory-music-anniversary-benefit-lineup-1236345222/", "summary": "Los Angeles Silverlake Conservatory of Music will celebrate its 25th anniversary next month with an all-star benefit concert at the Hollywood Palladium. The Oct. 17 show will be headlined by the Red Hot Chili Peppers , as well as Foo Fighters frontman Dave Grohl, Vince Staples and comedian Marc Maron. Chili Peppers bassist Flea, one of the co-founders of the school, encouraged fans to check the event out, writing on Instagram , Come celebrate a quarter century of The Silverlake Conservatory Of Music! Yeeeeeeeah! Proceeds of course all go to the non -profit school. We teach 1000 kids a week, we are open 7 days a week. Private lessons, ensembles, choir. We are beautiful. Tickets for the benefit will go on sale to the general public on Friday (Sept. 25) at 1 p.m. ET, with a pre-sale starting on Thursday (Sept. 24); click here for information on VIP packages and sponsorship opportunities. Flea and musician Keith Tree Barry co-founded the nonprofit music school with friend Peter Weiss in 2001 with a mission to fill in the gaps in music education in L.A. public schools. The Conservatory now provides music lessons to more than 1,000 students a week, with a vibrant scholarship program that serves more than 200 students via free lessons, instruments, supplies and ensemble classes for those whose families cannot afford music lessons. In past years, the school has held an annual private dinner to raise funds, but this year it is opening its doors for the Palladium show that aims to raise around $1.5 million for programming. Previous events have included sets from Beck, Neil Young, Eddie Vedder, Patti Smith, Bruno Mars and the Chili Peppers.", "date_str": "2026-09-23T11:52:39+00:00", "hash": "860e21991a66f42b", "title_fa": "مجموعه فلفل قرمز تند تند، دیو گرول، وینس استیپلز و غیره برای کنسرت 25 سالگی موسیقی 2026 کنسرواتوار موسیقی Silverlake", "summary_fa": "کنسرواتوار موسیقی سیلورلیک لس آنجلس بیست و پنجمین سالگرد خود را ماه آینده با یک کنسرت خیریه همه ستاره در هالیوود پالادیوم جشن خواهد گرفت. سریال 17 اکتبر توسط Red Hot Chili Peppers و همچنین دیو گرول، خواننده Foo Fighters، وینس استیپلز و کمدین Marc Maron، تیتر یک خواهد بود. فلی، نوازنده بیس Chili Peppers، یکی از بنیانگذاران مدرسه، طرفداران را تشویق کرد تا از این رویداد دیدن کنند و در اینستاگرام نوشت: بیایید جشن ربع قرن هنرستان موسیقی Silverlake را جشن بگیرید! یییییییی! درآمد حاصل از آن البته همه به مدرسه غیرانتفاعی تعلق می گیرد. ما هفته ای 1000 بچه آموزش می دهیم، 7 روز هفته باز هستیم. کلاس های خصوصی، گروه ها، گروه کر. ما زیبا هستیم بلیت های این مزایا از ساعت 13 روز جمعه (25 سپتامبر) برای عموم به فروش می رسد. ET، با پیش فروش از پنجشنبه (24 سپتامبر) آغاز می شود. برای اطلاعات در مورد بسته های VIP و فرصت های حمایت اینجا را کلیک کنید. فلی و نوازنده کیث تری بری در سال 2001 با دوستش پیتر وایس مدرسه موسیقی غیرانتفاعی را با ماموریت پر کردن شکاف های آموزش موسیقی در مدارس دولتی لس آنجلس تأسیس کردند. کنسرواتوار اکنون به بیش از 1000 دانش‌آموز در هفته آموزش موسیقی ارائه می‌کند، با یک برنامه بورس تحصیلی پر جنب و جوش که به بیش از 200 دانش‌آموز از طریق کلاس‌های رایگان، سازها، لوازم و کلاس‌های گروهی برای کسانی که خانواده‌شان توان پرداخت هزینه‌های آموزش موسیقی را ندارند، خدمات می‌دهد. در سال‌های گذشته، مدرسه یک شام خصوصی سالانه برای جمع‌آوری بودجه برگزار کرده است، اما امسال درهای خود را برای نمایش پالادیوم باز می‌کند که هدف آن جمع‌آوری حدود 1.5 میلیون دلار برای برنامه‌نویسی است. رویدادهای قبلی شامل مجموعه هایی از بک، نیل یانگ، ادی ودر، پتی اسمیت، برونو مارس و فلفل چیلی بوده است."}, {"source": "Billboard", "title": "Oasis Add More Shows to Live ‘27 European/U.K. Run: See Full Tour Dates", "link": "https://www.billboard.com/music/rock/oasis-live-27-tour-dates-added-1236345228/", "summary": "Oasis has added a number of new shows to their upcoming Live ‘27 tour . Related Oasis 2027 Tour – Ticket, Setlist Festival Rumors: Our Six Biggest Questions Oasis 2027 Tour: Which Songs Should Join ( Leave) the Setlist? After Oasis Documentary Revives Live 25 Tour Madness, Gallagher Brothers Will Reunite All Over Again Next Year The band has added new shows in Rome, Italy, Munich, Germany and Knebworth House, England ahead of the ticket release this coming weekend. The band will now play a third night at Munich’s Allianz Arena (July 6), a third at Rome’s Stadio Omlimpico (July 26) and fifth and sixth shows at Knebworth House in Stevenage, England (Sept. 25, 26). Tickets for the group’s 42-show run will begin on Friday (Sept. 25). There is no general onsale, with fans having to pre-register for access before last Thursday (Sept. 17); successful applicants will then be sent a one-time code to access the opportunity to purchase tickets across the sale that is staggered across three days. One show in Paris has been rescheduled owing to planned transport disruption slated for July 24. The Gallagher brothers will now perform on July 20 and July 23 at the Stade de France in Paris’ Saint Denis district. The band has also confirmed in a press statement that there will be “no further dates added to this tour.” The Live ‘27 run will see the group perform a number of dates in the U.K., Ireland, mainland Europe and in the U.S. The run will kick off in Glasgow, Scotland on May 21, before heading to Manchester for an 11-night stand at the Etihad Stadium. The tour will then hit Munich, Barcelona, Amsterdam, Paris, Rome, before heading to the U.S. for shows in Boston and Las Vegas. They’ll return to Europe with a pair of shows at Ireland’s Slane Castle, before they wrap the tour -debut-julianne-moore-paul-giamatti-1237111122/", "summary": "Jesse Eisenberg heaped praise on Julianne Moore and Paul Giamatti, the co-stars of his latest feature, The Debut, this morning during a press conference at the San Sebastián Film Festival, where the musical comedy is set to make its European debut this week. “We filmed the first two days of the movie in one day, [ ]", "date_str": "2026-09-23T12:22:58+00:00", "hash": "a780c2d49bc5b1ad", "title_fa": "جسی آیزنبرگ به طور خاص برای «بازیگر و هنرپیشه مورد علاقه‌اش» جولیان مور و پل جیاماتی - سن سباستین در حال نوشتن اولین فیلم صحبت می‌کند.", "summary_fa": "جسی آیزنبرگ امروز صبح در یک کنفرانس مطبوعاتی در جشنواره فیلم سن سباستین، جایی که این کمدی موزیکال قرار است این هفته اولین نمایش اروپایی خود را داشته باشد، از جولیان مور و پل جیاماتی، بازیگران فیلم جدیدش، اولین فیلم، تمجید کرد. آیزنبرگ به خبرنگاران در سن سباستین گفت: «ما دو روز اول فیلم را در یک روز فیلمبرداری کردیم، [ ] آیزنبرگ به خبرنگاران در سن سباستین گفت که او به طور خاص اولین فیلم را با در نظر گرفتن مور نوشته است. این نویسنده و کارگردان گفت که از زمانی که این زوج در اولین فیلم آیزنبرگ به عنوان کارگردان با نام «وقتی نجات دنیا را تمام می‌کنی» همکاری کردند، از نزدیک کار او را تحسین کرده است. خبرهای مرتبط، براد پیت پخش‌کنندگان را به خاطر ایجاد فرصت‌ها تمجید می‌کند و می‌گوید معتقد است فضای فیلم‌های مستقل در حال حاضر مانند دهه 90 قوی است - ریسک‌های خلاقانه اخبار سن سباستین، رونق تولید برزیل هوش مصنوعی: موضوعاتی از روز اول در 2026 اولین فیلم سرمایه‌گذاران جوان در سن سباستین اولین کنفرانس پنج سال بود. پیش، با نام وقتی که نجات جهان را تمام کردی. مطمئن نیستم که در فرانسه بازی کرده یا نه. به سختی در آمریکا بازی کرد. آیزنبرگ به شوخی گفت: در خانه پدر و مادرم به سختی پخش می شد. آیزنبرگ افزود. بسیار متفاوت از The Debut است. اما یک صحنه کوچک در آن فیلم وجود دارد که او شروع به اجرای این صدای غیرعادی کرد و آن صدا برای دو سال در ذهن من بود. و وقتی شروع به نوشتن این فیلم کردم، فکر کردم که باید آن صدا باشد و باید آن بازیگر باشم. آیزنبرگ ادامه داد که وقتی فیلمنامه را تمام کرد متوجه شد که خودش را به مشکل بزرگی رسانده است."}, {"source": "Deadline", "title": "‘Where’s Wanda’ Season 2: Watch Trailer For Apple TV’s Darkly Comic German Series From UFA Fiction", "link": "https://deadline.com/2026/09/wheres-wanda-season-2-trailer-ufa-fiction-interview-1237110259/", "summary": "EXCLUSIVE: Here s the trailer for Season 2 of Apple TV s German dark comedy Where s Wanda?. The sophomore season starring Heike Makatsch (Love Actually), Axel Stein (The Vault), Lea Drinda (The Gryphon), Leo Simon and and Nikeata Thompson (Späti) debuts globally on October 21, and this is the exclusive trailer ahead of the launch. Episodes will [ ]", "date_str": "2026-09-23T12:00:00+00:00", "hash": "6c23bd0d335d40f0", "title_fa": "«Where's Wanda» فصل 2: ​​تماشای تریلر سریال آلمانی کمیک تاریک Apple TV از داستان UFA", "summary_fa": "انحصاری: در اینجا تریلر فصل 2 کمدی تاریک آلمانی اپل تی وی Where s Wanda؟ است. فصل دوم با بازی هایکه ماکاتش (در واقع عشق)، اکسل استین (The Vault)، لیا دریندا (گریفون)، لئو سیمون و و نیکیتا تامپسون (Späti) در 21 اکتبر در سطح جهانی عرضه می‌شود و این تریلر انحصاری قبل از عرضه است. اپیزودها [ ] کمدی-درام آلمانی زبان داستانی UFA بعد از اتفاقات فصل اول که کارلوتا و ددو کلات (ماکاتچ و استاین) در جستجوی دختر گمشده خود واندا (دریندا) بودند، شروع می‌شود. با شروع فصل، واندا در حالی که روی یک جسد مرده ایستاده بود دستگیر می‌شود و به زندان منتقل می‌شود. اخبار مرتبط اخبار استودیوکانال پایان فیلم نهایی را در سه گانه جاه طلبان آلمانی-زبان Woodwalkers اعلام می کند. بازیگران جین گاروفالو با بن استیلر در کمدی تلویزیون اپل نگهبان حفاظتی کارلوتا و ددو باید تمام تلاش خود را انجام دهند تا بی گناهی او را ثابت کنند و از دست دادن دوباره او جلوگیری کنند. تماشا در Deadline در تریلر ما یک واندا تکان خورده را در زندان می بینیم. این صحنه به صحنه قتل برمی گردد، زیرا واندا جسدی مرده را در پشت صحنه در یک نمایشگاه تفریحی پیدا می کند. هنگامی که پرده ها عقب می نشینند، او نشان داده می شود که بالای جسد ایستاده و جامی خون آلود در دستانش در حالی که تماشاگران نفس نفس می زنند. از آنجا، والدین even in te blazen. Ze besluiten hun moderne woning in de archipel van Stockholm tijdelijk te ruilen met Adam (Jakob Oftebro) en Scarlett (Emma Appleton), een stel dat op Sicilië woont. Carl en Helene vertrekken dus naar Italië, terwijl twee mensen die ze nog nooit hebben ontmoet hun eigen huis betrekken. Sicilië Eenmaal op Sicilië merken Carl en Helene dat er iets niet klopt. De romantische villa ziet er anders uit dan op de foto s en ze beginnen zich af te vragen wie Adam en Scarlett eigenlijk zijn. Ondertussen ontdekken Adam en Scarlett in Zweden eveneens vreemde zaken: de buren gedragen zich opvallend nieuwsgierig en een inloopkast in het huis blijkt afgesloten te zijn. Terwijl beide koppels eigenlijk aan hun relatie zouden moeten werken, groeit het wantrouwen. Verborgen affaires en andere geheimen beginnen aan het licht te komen en zelfs het vertrouwen in hun eigen partners wordt op de proef gesteld. De vakantie verandert zo steeds meer in een psychologisch spel, waarbij niemand precies weet wie de waarheid vertelt Wanneer komt Bytet op Netflix? Bytet bestaat uit vier afleveringen (en is dus een miniserie) en verschijnt op 30 oktober 2026 op Netflix. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Huizenruil gaat mis in verleidelijke nieuwe Zweedse thriller appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-23T13:47:34+00:00", "hash": "4422532c40ea18f4", "title_fa": "تبادل خانه در تریلر جدید و اغواکننده سوئدی اشتباه می شود", "summary_fa": "شما در حال و هوای یک تریلر اغوا کننده هستید. از سوئد! خوب، و نتفلیکس منتظر شماست، زیرا سرویس استریم به زودی چنین تریلر سوئدی اغوا کننده ای را منتشر خواهد کرد که در آن تبادل خانه منجر به موارد بیشتری می شود! هیجان انگیز سوئدی جدید Bytet (عنوان بین المللی A Couple of Lies) یک سری تریلر روانشناختی جدید سوئدی است که در آن تبادل خانه به ظاهر بی گناه بین دو زوج به یک بازی خطرناک پر از راز و دستکاری تبدیل می شود. این مینی سریال چهار قسمتی بر اساس رمانی به همین نام از نویسنده جنایی استفان آنهم ساخته شده است. داستان کارل (فارس فارس) و هلن (فریدا گوستاوسون)، زوجی از استکهلم را دنبال می‌کند که امیدوارند ازدواج متوقف شده خود را احیا کنند. آنها تصمیم می گیرند به طور موقت خانه مدرن خود را در مجمع الجزایر استکهلم با آدام (جاکوب افتبرو) و اسکارلت (اما اپلتون)، زوجی که در سیسیل زندگی می کنند، مبادله کنند. بنابراین کارل و هلن به ایتالیا می روند، در حالی که دو نفر که هرگز ندیده اند به خانه خودشان نقل مکان می کنند. سیسیل یک بار در سیسیل، کارل و هلن متوجه می شوند که چیزی اشتباه است. ویلای رمانتیک با عکس ها متفاوت به نظر می رسد و آنها شروع به تعجب می کنند که آدام و اسکارلت واقعاً چه کسانی هستند. در همین حال، آدام و اسکارلت نیز چیزهای عجیبی را در سوئد کشف می کنند: همسایه ها به طور قابل توجهی کنجکاو عمل می کنند و به نظر می رسد کمد دیواری در خانه قفل شده است. در حالی که هر دو زوج باید در واقع روی رابطه خود کار کنند، بی اعتمادی در حال افزایش است. امور پنهان و دیگر اسرار شروع به آشکار شدن می کند و حتی اعتماد به شریک زندگی آنها آزمایش"}, {"source": "Netflix NL", "title": "Romantische dramaserie op Netflix ‘breekt je hart’", "link": "https://www.netflix-nederland.nl/romantische-dramaserie-op-netflix-breekt-je-hart/", "summary": "Netflix noemt The Altruists een romantische dramaserie. Maar nou ja, dat dekt de lading niet helemaal. The Altruists wordt in ieder geval een miniserie met acht afleveringen, dat staat helemaal vast. The Altruists op Netflix is deeply heartbreaking The Altruists is dus een achtdelige Netflix-miniserie over de spectaculaire opkomst en ondergang van FTX, ooit een van de grootste cryptobeurzen ter wereld. De show, die een waargebeurd verhaal vertelt, volgt vooral Sam Bankman-Fried (Anthony Boyle) en Caroline Ellison (Julia Garner), twee jonge, zeer intelligente buitenbeentjes die elkaar vinden in de wereld van crypto en het gedachtegoed van ‘ effective altruism ’: zoveel mogelijk geld verdienen om daarmee uiteindelijk zoveel mogelijk goeds te kunnen doen. Sam bouwt in korte tijd FTX uit tot een miljardenbedrijf, terwijl Caroline leiding gaat geven aan zijn handelsfirma Alameda Research. Ondertussen krijgen de twee een ingewikkelde, deels geheime relatie. Ze wonen en werken samen met een kleine groep vertrouwelingen op de Bahama s, waar zakelijke beslissingen en romantische relaties steeds meer door elkaar beginnen te lopen. Financiële problemen Achter het enorme succes ontstaan ondertussen grote financiële problemen. FTX zou geld van klanten hebben gebruikt om verliezen bij Alameda op te vangen. Wanneer dat uiteindelijk aan het licht komt, ontstaat er een enorme run op de cryptobeurs en stort het imperium binnen enkele dagen volledig in. Graham Moore is de bedenker en showrunner van de serie, en hij zegt over de twee hoofdpersonages (Bankman-Fried en Ellison): Het zijn allebei personages die ik zelf nooit had kunnen bedenken, hoe hard ik het ook had geprobeerd. Moore noemt het verhaal van de serie daarnaast deeply heartbreaking . De releasedatum van The Altruists is óók al bekend: op 19 november aanstaande komen alle afleveringen van deze serie uit op Netflix. Overigens is er nog geen teaser of trailer beschikbaar, maar dat gaat ongetwijfeld snel veranderen. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Romantische dramaserie op Netflix breekt je hart appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-23T09:51:21+00:00", "hash": "50833cea8222e77e", "title_fa": "سریال درام عاشقانه در نتفلیکس \"قلب شما را می شکند\"", "summary_fa": "نتفلیکس The Altruists را یک سریال درام عاشقانه می نامد. اما خوب، این کاملا آن را پوشش نمی دهد. در هر صورت، The Altruists یک مینی سریال هشت قسمتی خواهد بود، مطمئناً. Altruists در نتفلیکس عمیقاً دلخراش است The Altruists یک مینی سریال هشت قسمتی نتفلیکس است که درباره ظهور و سقوط خیره کننده FTX، زمانی یکی از بزرگترین صرافی های رمزنگاری در جهان بود. این سریال که داستانی واقعی را روایت می‌کند، عمدتاً سم بنکمن-فرید (آنتونی بویل) و کارولین الیسون (جولیا گارنر) را دن بین آنچه خوب و بد است جذب می‌شویم... اینکه چگونه باید رفتار کنیم و چگونه نیستیم، چگونه میل و خویشتنداری را متعادل کنیم.» هادریاس افزود: \"من همیشه آلبوم‌هایم را به‌عنوان موسیقی متن فیلم‌هایی می‌دانستم که وجود ندارند. در زندگی در چیزی خیالی و کاملاً صوتی آزادی وجود دارد. من می‌توانم هر شخصیتی باشم یا اصلا وجود نداشته باشم یا بدن را به میل خود عوض کنم. صحنه‌ها می‌توانند بلافاصله تغییر کنند فقط به این دلیل که من آن را دوست دارم. این در هنگام ساختن اجرا با کیت تغییر نمی کند، تمام رمز و راز و هیجان رفتن به جایی بی قانون و رویایی دست نخورده باقی می ماند - اما من در ساختن جهان تنها نیستم و به معنای واقعی کلمه در زمان واقعی ظاهر می شود. وقتی در اتاقی هستید که طرف مقابل را در آغوش گرفته اید، تعویض بدن بسیار متفاوت است."}, {"source": "Rolling Stone", "title": "Taylor Swift Unveils ‘The Life of a Showgirl: The Encore’ Deluxe Edition", "link": "https://www.rollingstone.com/music/music-news/taylor-swift-the-life-of-a-showgirl-deluxe-album-1235630197/", "summary": "The project is the extended version of her 12th studio album, featuring four new songs", "date_str": "2026-09-23T13:20:41+00:00", "hash": "4b78e597d01d87e6", "title_fa": "تیلور سویفت از «زندگی یک دختر نمایشگر: The Encore» نسخه دلوکس رونمایی کرد", "summary_fa": "این پروژه نسخه توسعه یافته دوازدهمین آلبوم استودیویی او است که شامل چهار آهنگ جدید است. تیلور سویفت نسخه لوکس The Life of a Showgirl را اعلام کرده است. نسخه تمدید شده 25 سپتامبر با چهار آهنگ، از جمله Patient Zero که به تازگی اعلام شده است، وارد بازار می شود. حدود یک سال پیش، شما بچه ها یک کار واقعا غیرقابل درک انجام دادید. سوئیفت در شبکه‌های اجتماعی نوشت: چیزی که کاملاً ذهن من را به هم ریخت. من سفری به سوئد داشتم تا با [تهیه کنندگان] مکس و شل بک، دو همکارم در این آلبوم جشن بگیرم. در واقع ما فقط می‌خواستیم تامل کنیم و درک کنیم که چقدر برای لحظه‌ای که در آن حضور داشتیم سپاسگزار بودیم، اما یک استودیو آنجا بود و وقتی احساس می‌کردیم کاری را انجام می‌دادیم: آهنگ‌های بیشتری نوشتیم. سوئیفت یادداشت خود را به پایان رساند، امیدوارم آنها را دوست داشته باشید، زیرا آنها از قد  داشته ایم. ما از بازگشت هیجان زده ایم چورچس در مهرماه دو نمایش اجرا می کند که عواید آن صرف امور خیریه می شود. آنها گلاسکو را در 26 اکتبر و لندن را در 29 اکتبر اجرا خواهند کرد. اطلاعات بیشتر در وب سایت گروه موجود است. داستان های پرطرفدار علت مرگ هیدن پانتییر فاش شد املاک دالی پارتون پس از اخراج برادرزاده، متهم به تهدیدات، با بحران مواجه می شود. Screen Violence، در سال 2021 وارد شد. در سال 2023، میبری اعلام کرد که از گروه کناره گیری می کند تا حرفه انفرادی خود را آغاز کند. او یک LP انفرادی با نام Vicious Creature را در دسامبر 2024 منتشر کرد و در سال 2025 برای حمایت از آلبوم تور برگزار کرد."}, {"source": "Rolling Stone", "title": "Watch Brandon Flowers Showcase ‘An American Dream’ on ‘Fallon’", "link": "https://www.rollingstone.com/music/music-news/brandon-flowers-an-american-dream-performance-fallon-1235630227/", "summary": "The Killers frontman recently released a country-inspired solo album, Thrasher", "date_str": "2026-09-23T06:49:56+00:00", "hash": "91cef870d5b37bf7", "title_fa": "نمایش Brandon Flowers \"An American Dream\" در \"Fallon\" را تماشا کنید", "summary_fa": "خواننده گروه Killers اخیراً یک آلبوم انفرادی الهام گرفته از کشور منتشر کرده است، Thrasher Brandon Flowers که توسط The Tonight Show متوقف شد تا An American Dream را اجرا کند، آهنگی غم انگیز از LP Thrasher جدیدش. فلاورز با حضور در کنار گروه خود و چندین خواننده پشتیبان، اجرای هیجان انگیزی از تصنیف کانتری ارائه داد که نشان می دهد آیا پول می تواند خوشبختی بخرد یا خیر. فلاورز همچنین با مجری جیمی فالون به بحث درباره Thrasher نشست که ماه گذشته پخش شد. برخی از نوازندگانی که در این آلبوم ضبط کردند عبارتند از دیوید رالینگ، همکار Gillian Welch، بروس بوتون گیتاریست پدال استیل، و نوازنده سازدهنی چارلی مک کوی، که نوازندگی آنها باعث زیبایی ال پی های نشویل باب دیلن شد. فلاورز از ضبط آلبوم به فالون گفت که هر روز با 45 دقیقه داستان سرایی شروع می شد. من فکر می کنم، ساعت تیک تاک می کند، شما بچه ها حقوق می گیرید. اما شما همچنین می‌خواهید بشنوید، زیرا چارلی مک‌کوی داستان‌های باب دیلن را برای شما تعریف می‌کند و او داستان‌های روی اوربیسون و سپس داستان‌های گارث بروکس را در اینجا و داستان‌های ویلون جنینگز تعریف می‌کند، و رسیدن به کار سخت است. داستان‌های پرطرفدار علت مرگ هیدن پانتییر فاش شد املاک دالی پارتون پس از اخراج برادرزاده، متهم به تهدیدات، با بحران مواجه شد. مجموعه ای از سؤالات در آهنگ هنگام نواختن پیانو، از جمله سؤالی در مورد آلبوم بعدی Killers، که Flowers اخیراً تأیید کرده است که در حال انجام است. فلاورز پاسخ داد: ما عناوین زیادی داریم. اما حتی اگر می‌دانستم این چیست، تبلیغ‌کننده من به من می‌گفت که آن را با شما به اشتراک ندهم. در بازی خیلی زود است."}, {"source": "Rolling Stone", "title": "Dolly Parton’s Estate Faces Crisis After Nephew Is Fired, Accused of Threats", "link": "https://www.rollingstone.com/music/music-news/dolly-parton-estate-restraining-order-nephew-bryan-seaver-1235630186/", "summary": "In a new court filing, Bryan Seaver is accused of launching an “escalating campaign of threats” to extract money from the Parton estate", "date_str": "2026-09-23T05:01:44+00:00", "hash": "89835e97cc7613ed", "title_fa": "پس از اخراج برادرزاده به اتهام تهدید، املاک دالی پارتون با بحران مواجه شد", "summary_fa": "در یک پرونده جدید دادگاه، برایان سیور متهم به راه‌اندازی یک \"کمپین فزاینده تهدید\" برای استخراج پول از املاک پارتون شده است. روز سه‌شنبه، شرکت She s Alive که وظیفه مدیریت سرمایه‌گذاری‌های تجاری گسترده پارتون را برعهده دارد، در دادگاه ریاست‌جمهوری دیویدسون کانتی نشویل، علیه برادرزاده خواننده، برایان سیور، که به عنوان رئیس امنیت پارتون خدمت می‌کرد و در یک ویدیو مرگ او را اعلام کرد، دستور منع داد. به گزارش نیویورک تایمز، سیور متهم به راه اندازی یک کمپین فحاشی، عمدی و تشدید کننده تهدید برای استخراج پول از املاک پارتون است. در این پرونده آمده است که عملیات سیور یک عملیات اداری-امنیتی متعارف نبود. این یک نیروی شبه نظامی به شدت مسلح بود و افزود که دارای تسلیحات درجه نظامی و ده ها کارمند است. در پیام های متنی ضمیمه شده به اوراق دادگاه، تایمز گزارش داد که شخصی به نام سیور تهدیدی علیه شریک تجاری Dolywood صادر کرد و گفت که او دست انتقام تمام خانواده من خواهد شد. طبق این شکایت، سیور ظاهراً در پیامی در 3 سپتامبر به یکی از وکلای پارتون خود را قاتل توصیف کرده است. سیور همچنین از طریق پیامک به مدیر She s Alive، دنی نوزل، گفته است که پادکستی ایجاد خواهد کرد که به همکاری با برند دالی آسیب می زند و تخلفاتی را که این افراد علیه ما انجام داده اند را بیان می کند. به گزارش Variety، نازل، سیور را که اسکادران خدمات حفاظتی تقویت شده، LLC (SAPS) را اداره می‌کند، در 15 سپتامبر اخراج کرد."}, {"source": "Rolling Stone", "title": "Outkast Sue Rapper Ovrkast for Allegedly Hijacking Its ‘Famous, Extremely Valuable’ Name", "link": "https://www.rollingstone.com/music/music-news/outkast-sues-ovrkast-trademark-infringement-big-boi-andre-1235630184/", "summary": "The Atlanta hip-hop duo says rapper agreed to adopt a new name but later backed out of the deal", "date_str": "2026-09-23T01:34:34+00:00", "hash": "809e1785d27ef88b", "title_fa": "اوورکاست رپر سوئه Outkast به دلیل ربودن نام معروف و بسیار ارزشمند آن", "summary_fa": "گروه دو هیپ هاپ آتلانتا می‌گویند که خواننده رپ با انتخاب نام جدیدی موافقت کرد، اما بعداً از قرارداد منصرف شد. Outkast شکایتی تنظیم کرد و اوورکاست، خواننده رپ کالیفرنیایی و تهیه‌کننده را متهم به استفاده غیرقانونی از یک نام تقریباً یکسان پس از اذعان به اینکه باعث سردرگمی مصرف‌کنندگان شد و پس از اینکه گفته می‌شود با نامگذاری جدید موافقت کرده است، استفاده کرده است. شکایت 31 صفحه ای که در دادگاه فدرال در جورجیا ثبت شده و توسط رولینگ استون به دست آمده است، اورکاست را به نقض علامت تجاری، رقابت ناعادلانه و نقض قرارداد متهم می کند. شکایتی که توسط شرکت دوتایی آتلانتا، High Schoolers ارائه شده، می‌گوید که Outkast از زمان شکل‌گیری آن در سال 1993، یکی از شناخته‌شده‌ترین و تاثیرگذارترین بازیگران هیپ‌هاپ بوده و برنده شش جایزه گرمی و بیش از 25 میلیون رکورد بوده است. دعوای جدید ادعا می کند که اوورکاست، تهیه کننده رکورد از اوکلند، کالیفرنیا، که نام اصلی او سیلاس ویلسون است، آگاهانه نام هنری خود را برای معامله بر اساس شهرت و حسن نیت فوق العاده مرتبط با نام و نشان Outkast شاکی انتخاب کرده است. این شکایت ادعا می کند که استفاده ویلسون از نام قبلاً باعث سردرگمی مصرف کنندگان شده است و به مصاحبه رولینگ استون در سال 2025 به عنوان مدرک اشاره می کند. در آن مصاحبه، ویلسون گفت که بدترین چیز در مورد شهرت فزاینده اش متهم شدن به تقلید از اوتکاست است. انگار نه داداش او در این قطعه گفت: من حتی به اوتکست فکر نمی کردم. اورکاست [به عنوان] اوتکاست را می خوانند. آنها مثل خدای من هستند، فکر کردم آنها گفته اند Outkast. و آن را مانند، آن را نمی. تلاش‌ها برای دستیابی به ویلسون، که آهنگ‌هایی را برای هنرمندانی از دریک تا ارل سوئیت‌شرت تولید کرده است، بلافاصله در سه‌شنبه موفقیت‌آمیز نبود."}, {"source": "Rolling Stone", "title": "Niko Rubio Will Dive Into Heartbreak and Self-Discovery on Debut Album ‘Late Night Swim’", "link": "https://www.rollingstone.com/music/music-news/niko-rubio-debut-album-late-night-swim-1235630179/", "summary": "The LP arrives Oct. 30 and its next single \"dream\" will be released on Friday", "date_str": "2026-09-23T00:38:45+00:00", "hash": "5ca680ddadb70923", "title_fa": "نیکو روبیو در اولین آلبوم «شنا در اواخر شب» وارد «دلشکستگی و کشف خود» خواهد شد.", "summary_fa": "LP در 30 اکتبر وارد بازار می شود و تک آهنگ بعدی آن \"رویا\" در روز جمعه منتشر خواهد شد. ستاره نوظهور مکزیکی-سالوادورایی چند سال گذشته را گذرانده است تا لبه جایگزین تربیتش در لس آنجلس را با میراث لاتین خود ترکیب کند. آلبوم روبیو، شنای اواخر شب، در 30 اکتبر عرضه می‌شود و صدای او را با تأثیرات جهانی بیشتر گسترش می‌دهد. روبیو به رولینگ استون می‌گوید، من احساس می‌کنم که بالاخره آماده انتشار اولین آلبومم هستم. حدود شش سال از اولین انتشار من می گذرد و در آن زمان چیزهای زیادی از خودم کشف کردم. بالاخره احساس می‌کنم الان می‌دانم کی هستم. روبیو هم به عنوان خواننده و هم به عنوان ترانه سرا نامی برای خود دست و پا کرده است. او آهنگ هایی را برای افرادی مانند گوئن استفانی و اخطار نوشته است. روبیو همچنین با اولین تک‌آهنگ‌های شنای آخر شب، از جمله زن سبک زندگی ماورایی و موفقیت‌های ویروسی اخیرش در توکیو، سروصدا کرده است. در رسانه های اجتماعی، آهنگ اخیر مورد علاقه واترهاوس، جو جوناس، رنه رپ، وینس استیپلز و بری کان تی سویم قرار گرفته است. داستان‌های پرطرفدار علت مرگ هیدن پانتییر فاش شد املاک دالی پارتون پس از اخراج برادرزاده، متهم به تهدیدات، با بحران مواجه شد. رویا در روز جمعه 25 سپتامبر منتشر خواهد شد. برای شنای آخر شب، او با همکاران قدیمی خود لستر مندز، که به خاطر کارش با شکیرا، سانتانا و آستین وارد شناخته شده است، دوباره جمع شد. روبیو همچنین از وایات برنارد که تهیه کننده اجرایی بدترین دختر اسلیتر در آمریکا بود، آستین کورونا، رودیا، زاکاری، اولیویا باند و لنون کلوزر برای آلبوم آینده استفاده کرد. LP علاوه بر غرق در ریشه های L.A خود، صداهای لندن و جامائیکا را نیز بررسی خواهد کرد."}, {"source": "Rolling Stone", "title": "Tezzus and Diamond* Are Bringing Everybody With Them", "link": "https://www.rollingstone.com/music/music-features/tezzus-diamond-oway-atlanta-ysl-1235629770/", "summary": "The Atlanta rappers on finding each other, learning from Young Thug, and taking the whole crew on tour", "date_str": "2026-09-22T23:00:00+00:00", "hash": "523d8904177ef6c5", "title_fa": "تزوس و الماس* همه را با خود می آورند", "summary_fa": "رپرهای آتلانتا وقتی یکدیگر را پیدا می‌کنند، از یانگ تاگ یاد می‌گیرند و کل گروه را به تور می‌برند. برای مادرم فریاد بزن/برابر برادرانم فریاد بزن، تزوس با شوری تقریباً مذهبی در راه می‌خواند. شاید شما آن را شنیده باشید: یک رعد و برق از خواننده رپ آتلانتا که جرقه‌ای برانگیخته شده است که یک روند ویروسی در قدرت آن خطوط آغازین ایجاد کرده است. تزوس، که بخشی از گروه بازسازی‌شده و متمرکز بر جوانان Young Thug است، از این آهنگ برای پایان پروژه‌اش The Resurrecti n استفاده کرد. این انرژی عجیب و غریب از پربارترین دوران رپ آتلانتا در دهه 2010 دارد، زمانی که موسیقی که از شهر بیرون می آمد شما را مجبور می کرد به کلوپ ها بروید. در یک بعد از ظهر اواخر تابستان اخیر، دیاموند* عضو تیم جوانان YSL در دفاتر رولینگ استون در منهتن به او پیوست. شب قبل، آنها در پارک مرکزی به عنوان بخشی از تور نسل جدید Young Thug اجرا کردند. من تمام خدمه ام را به تور آوردم، می دانید چه می گویم؟ تزوس می گوید. مثلاً ما در حال ساختن خانواده خود هستیم. این دو پس از اینکه دایموند* حدود یک ساعت رانندگی کرد تا از تزوس علف هرز بخرند، ملاقات کردند. او در ماشینش هم لباس هایی برای فروش داشت و فکر می کرد که ممکن است در این سفر پولی به دست بیاورد. وقتی وارد شد، آن مکان او را به یاد یک کلوپ دوچرخه سواری انداخت، با دوستانی که در حال رفت و آمد، بازی های ویدیویی و صحبت با دختران بودند. دایموند* به رولینگ استون می‌گوید، درست مثل یک گردهمایی کوچک برای برادران، در واقع. پس بودن در اطراف خیلی جالب بود. تزوس آن را مختصرتر به خاطر می آورد: و سپس هرگز آنجا را ترک نکرد. رپرهای آتلانتا گروه خود را Way می نامند،"}, {"source": "Hollywood Reporter", "title": "‘Variations on Violence’ Wins Best Film at Oldenburg", "link": "https://www.hollywoodreporter.com/movies/movie-news/variations-on-violence-best-film-2026-oldenburg-1236708307/", "summary": "The Zachary Nichols' film won the German Independence Award for best film at the fest.", "date_str": "2026-09-23T13:42:07+00:00", "hash": "d98577d1803749d5", "title_fa": "«تغییرهای خشونت» برنده بهترین فیلم اولدنبرگ شد", "summary_fa": "فیلم زاخاری نیکولز برنده جایزه استقلال آلمان برای بهترین فیلم جشنواره شد. Zachary Nichols Variations on Violence برنده جایزه استقلال آلمان برای بهترین فیلم در جشنواره فیلم اولدنبورگ امسال، جشنواره فیلم مستقل آلمان شد. این فیلم درباره یک اپراتور هواپیمای بدون سرنشین نظامی است که خشونت کنترل از راه دور او را به خانه تعقیب می کند، همراه با خواهرش مری، که در چرخه ای از روابط ناپایدار گرفتار می شود، زیرا کنترل جانی بر واقعیت بدتر می شود. نیکولز ابتدا این پروژه را به عنوان یک چیدمان هنری توسعه داد و سپس آن را به یک ویژگی توسعه داد. «زبان خارجی» بوریس مویسوفسکی جایزه «روح سینما» را دریافت کرد که با رأی تماشاگران جشنواره تعیین می‌شود. این فیلم کانادایی در اولین اکران خود در آلمان با ایفای نقش استیو بایرز، سینتیا آسفرگر و گرگ بریک. این فیلم درباره کتی (کیم سو موری) یک زن مجرد است که پس از سقوط در یک رویداد دوستیابی سریع به کما می‌رود و با لهجه بوسنیایی از خواب بیدار می‌شود، تغییری که نحوه درک و رفتار او را تغییر می‌دهد و او را با یک نظافتچی بیمارستان مرتبط می‌کند که او را با دنیای اجتماعی جدیدی آشنا می‌کند. داستان‌های مرتبط TV Jeff Probst Reveals Major Survivor 51 Twist -- و می‌توانست بازی را برای سال‌ها تغییر دهد (انحصاری) مستندهای جدید تلویزیونی-فقط پخش‌کننده DocuStream مجموعه‌های برنامه‌های راه‌اندازی (انحصاری) Marjorie Conrad The Joyless Economy Award Award و The Original Economy Awarding Award. این فیلم 58 دقیقه‌ای از مجموعه ویدیویی زنی ناشناس ساخته شده است و تاریخچه جنسی و خیانت‌های او را در ساختاری دوپارچه دنبال می‌کند و سلیقه‌های سینمایی او، به‌ویژه وسواس فزاینده پورن او را در یک طرف کادر با داستان زندگی‌اش در طرف دیگر جفت می‌کند. هیئت داوران اولدنبورگ این فیلم را هیپنوتیزم کننده و از نظر اخلاقی پیچیده خواند. The Joyless Economy"}, {"source": "Hollywood Reporter", "title": "Nathan Fielder’s Elizabeth Holmes Doc Drops Full Trailer — and You Will Want to See Everything", "link": "https://www.hollywoodreporter.com/movies/movie-news/nathan-fielder-elizabeth-holmes-documentary-trailer-1236708309/", "summary": "The truth is (probably) out there.", "date_str": "2026-09-23T13:37:07+00:00", "hash": "041cb10c4d359132", "title_fa": "الیزابت هلمز Doc ناتان فیلدر تریلر کاملی را منتشر کرد - و شما می خواهید همه چیز را ببینید", "summary_fa": "در فیلم مستند ناتان فیلدر درباره الیزابت هلمز، بنیانگذار شرمنده Theranos، می توانید همه چیز از جمله هولمز را ببینید که (حداقل یک) اشک ریخته است. روز چهارشنبه، A24 تریلر کامل (در زیر) برای You Can See Everything from Fielder (Natan for You, The Rehearsal) و Lance Oppenheim را منتشر کرد. این دیوانه است، گیج کننده است، ناراحت کننده است، اما این برای شما ناتان است. این فیلم جدید در تاریخ 16 اکتبر پس از تور کوتاه جشنواره خود در سینماها اکران خواهد شد. «شما می‌توانید همه چیز را ببینید» به فهرست فیلم‌های «اسپوت لایت» جشنواره فیلم نیویورک ملحق شد، جایی که در 30 سپتامبر اکران خواهد شد. داستان‌های مرتبط فیلم‌های داخل NYFF Splashy Lineup: Landing Artificial, Weighting a Secret Screening and Opening on the Miraculous Paper Tiger (اختصاصی) تریلر تلویزیونی Crystal Lake Sends Pam Voorhees از لیندا کاردلینی را به آن سوی لبه می فرستد تریلر کمی بیشتر شبیه چیزی است که از زمان گذشته فاش می کند. هولمز، همه چیز در اینجا هنوز به عنوان یک معمای پیچیده در یک راز ارائه می شود. انجی هان، منتقد هالیوود ریپورتر، نوشت که شما می‌توانید همه چیز را ببینید به‌عنوان یک پرتره صمیمی و جذاب از یک کلاهبردار فریب خورده یا ناصادق شروع می‌شود که به‌عنوان چیزی حتی وحشی‌تر، جاه‌طلبانه‌تر و کمتر قابل پیش‌بینی آشکار می‌شود، تا زمانی که ما به این فکر کنیم که یک حقیقت شخصی اصلاً چه ارزشی دارد. هان از Telluride نوشت: You Can See Everything یک فیلم در دو قسمت است. نیمه دوم آن به دنده پنجم دوم می رود. چرخش های ناگهانی آن به قدری شگفت انگیز است که من از ارائه جزئیات بیش از حد بیزارم. اما من به طور کلی می گویم که در مواجهه با این واقعیت که هولمز اکنون در زندان است، و بنابراین نمی تواند از جانب خود به"}, {"source": "Hollywood Reporter", "title": "‘Digger’: Tom Cruise’s “Brave Gorgeous Misfire” Gets Very Mixed First Reactions", "link": "https://www.hollywoodreporter.com/movies/movie-news/digger-reviews-tom-cruise-1236708297/", "summary": "Alejandro G. Iñárritu's eco-epic is getting strong responses from early press screenings, which praise Cruise and the film's boldness, yet predict mainstream audience backlash: \"I expect a HORRENDOUS CinemaScore.\"", "date_str": "2026-09-23T13:26:09+00:00", "hash": "832c9710ca88129b", "title_fa": "«حفار»: واکنش‌های اولیه «برگ‌اشتباه شجاعانه» تام کروز با واکنش‌های متفاوتی روبرو شد", "summary_fa": "حماسه بومی آلخاندرو جی. ایناریتو با واکنش‌های شدیدی از نمایش‌های اولیه مطبوعاتی مواجه می‌شود که کروز و جسارت فیلم را ستایش می‌کنند، در عین حال واکنش مخاطبان جریان اصلی را پیش‌بینی می‌کنند: \"من انتظار یک CinemaScore وحشتناک را دارم.\" حفار تام کروز یک نوسان بسیار بزرگ از یک طنز دراماتیک نامیده می شود که پس از اولین نمایش مطبوعاتی فیلم واکنش های متفاوت تا منفی را برانگیخته است. در فیلم Digger، کروز تقریباً در آرایش و پروتز قابل تشخیص نیست، نقش یک غول نفتی غافل را بازی می کند که حفاری او در گرینلند یک قفسه یخ را از یخچالی خارج می کند که قرار است یک فاجعه جهانی ایجاد کند. او باید مسابقه دهد تا ثابت کند که ناجی بشریت است قبل از اینکه حادثه اکولوژیکی ویرانی در این سیاره ایجاد کند. در این فیلم ریز احمد، ساندرا اچ لر، جان گودمن، مایکل استهلبرگ و جسی پلمونز نیز ایفای نقش می کنند. داستان‌های مرتبط فیلم‌ها تام کروز نشان می‌دهد که چگونه زمان تبدیل حفار را از شش ساعت به زیر یک کار کاهش داده است تام کروز قرارداد پارامونت را برای خرید برادران وارنر به نام فراوانی فیلم برکت می‌دهد. داستانی که باعث مقایسه با دکتر. Strangelove همچنین شامل یک افشای بسیار بزرگ است که ما آن را خراب نمی کنیم و واکنش های شدیدی از سوی جمعیت دریافت می کند. با این حال، بسیاری از منتقدان انتظار دارند که Digger یک رقیب قوی جوایز باشد، به خصوص برای اجرای کروز و طراحی تولید فیلم، اما همچنین انتظار دارند که برادران وارنر و لجندری زمان بسیار سختی برای جبران سرمایه 130 میلیون دلاری خود داشته باشند (یک منتقد پیش بینی کرد من انتظار یک CinemaScore وحشتناک را دارم)."}, {"source": "Hollywood Reporter", "title": "Meet One of the Key Republicans Championing a Federal Film and TV Tax Credit", "link": "https://www.hollywoodreporter.com/news/politics-news/brian-jack-federal-film-tv-tax-credit-1236707858/", "summary": "Georgia U.S. Rep. Brian Jack, a former political advisor to President Trump, presides over a production-heavy district including Trilith Studios and is a movie props collector.", "date_str": "2026-09-23T13:25:00+00:00", "hash": "932c07a66f63cad8", "title_fa": "با یکی از جمهوری خواهان کلیدی که دارای اعتبار مالیاتی فدرال فیلم و تلویزیون هستند، آشنا شوید", "summary_fa": "برایان جک، نماینده ایالات متحده در جورجیا، مشاور سیاسی سابق رئیس جمهور ترامپ، ریاست یک منطقه پر تولید از جمله استودیو Trilith را بر عهده دارد و یک مجموعه دار لوازم سینمایی است. هالیوود به طور کلیشه ای به عنوان صنعتی مورد علاقه و حمایت سیاستمداران لیبرال تلقی می شود، اما فشار فعلی برای اعتبار مالیاتی فیلم و تلویزیون فدرال، این پرتره معمولی را پیچیده می کند. حتی قبل از اینکه دونالد ترامپ رئیس جمهور آمریکا به کنگره دستور دهد این کار را انجام دهد! در آگوست در 31، چند حامی کلیدی محافظه کار ایده انگیزشی، که در کنار جان وویت، اتحادیه ها و استودیوها به طور یکسان کار می کردند، در شاخه قانونگذاری ظاهر شدند که نماینده ایالات متحده برایان جک (R-GA) در میان آنها بود. جک، دانشجوی سال اول کنگره 38 ساله که نماینده منطقه ای از جورجیا است که از حومه آتلانتا تا مرز آلاباما امتداد دارد، از برخی جهات متحد طبیعی این صنعت است. منطقه او شامل استودیو Trilith است، مجتمع تولیدی گسترده در فایتویل که در سال‌های گذشته میزبان فیلم‌برداری‌های موانا، سوپرمن و مارول بوده است، اما تحت تأثیر جابجایی اخیر فیلم‌های اصلی برند متعلق به دیزنی به بریتانیا قرار گرفته است. در اختیار او می‌توان به چندین وسیله از برنامه تلویزیونی مورد علاقه‌اش، Entourage، کارت اعتباری که جیمز باند دنیل کریگ در کازینو رویال در سال 2006 کشید (هدیه‌ای از ستاره‌های پیاده، ریک هریسون، جک قبل از انتخاب شدنش در کنگره) و کارت ویزیت مورد استفاده سباستین بارتس در فیلم Bunderu، که در فیلم Thunderu استفاده شده بود. Trilith. همانطور که ممکن است به خاطر داشته باشید، او [بارنز] به عنوان نماینده کنگره در Thunderbolts خدمت می کرد، بنابراین من کارت ویزیت کنگره او را دارم، جک می گوید."}, {"source": "Hollywood Reporter", "title": "Broadcast TV Bounces Back: More Orders as Network Fare Drives Streaming Ratings", "link": "https://www.hollywoodreporter.com/tv/tv-features/broadcast-tv-orders-streaming-ratings-1236707741/", "summary": "An uptick in the number of scripted series and recognition of the strengths of the broadcast model is fueling optimism for the 2026-27 season.", "date_str": "2026-09-23T13:15:00+00:00", "hash": "abb7630b8aeda753", "title_fa": "پخش تلویزیون برگشت: سفارشات بیشتر به عنوان نرخ کرایه شبکه رتبه‌بندی جریان را افزایش می‌دهد", "summary_fa": "افزایش در تعداد سریال‌های فیلمنامه‌شده و شناخت نقاط قوت مدل پخش، خوش‌بینی را برای فصل 2026-27 تقویت می‌کند. متن لوگو قرن بیست و یکم برای پخش تلویزیون چندان مهربان نبوده است. DVR، جهشی در برنامه‌های کابلی اصلی و اخیراً و به طور جدی، افزایش استریم برای تبدیل شدن به روش اصلی مصرف تلویزیون توسط مردم، مدل شبکه را در چند دهه گذشته تحت تأثیر قرار داده است. آمار دروغ نمی گوید: در طول سال گذشته، شبکه های پخش بر اساس اندازه گیری گیج نیلسن، به طور متوسط ​​تنها حدود 21 درصد از کل استفاده از تلویزیون را در ایالات متحده داشته اند. اسکار به یک پلتفرم استریم منتقل می شود و جوایز امی ممکن است دنبال شود. نمایش‌های آخر شب با هزاران کاهش (یا در مورد سی‌بی‌اس، یک مورد بزرگ) متحمل مرگ می‌شوند. بدیهی است که چیزی در راه است، و اینجاست: با وجود نیروهای ساختاری که بر تجارت شبکه فشار می آورند، خوش بینی خوبی نیز در میان کسانی که در آنجا کار می کنند وجود دارد. نمایش‌های شبکه‌ای رتبه‌بندی‌هایی را که زمانی انجام می‌دادند، نمی‌گیرند، اما زمانی که به پلتفرم‌های پخش پخش می‌شوند، تفاوت زیادی را ایجاد می‌کنند. به نظر می‌رسد غول‌های رسانه‌ای که مالک شبکه‌ها و سرویس‌های پخش هستند، متوجه شده‌اند که این دو پلتفرم می‌توانند از یکدیگر پشتیبانی کنند. و در میان افرادی که واقعاً نمایش‌ها را می‌سازند، این حس رو به رشد وجود دارد که مدل شبکه‌ای برای تولید برنامه‌ها در یک برنامه زمان‌بندی مشخص، راه خوبی برای انجام تجارت است. میکی برمن، شریک UTA و نماینده ادبی تلویزیون، که نماینده چندین نویسنده و مجری برنامه است، همه چیز را به طور خلاصه بیان می کند: وقتی به بسته ترکیبی نگاه می کنید، نمایش ها کار می کنند و مردم آنها را تماشا می کنند. بخشی از جذابیت شبکه تلویزیونی، هم برای مخاطبان و هم"}, {"source": "Hollywood Reporter", "title": "Cineplex Puts Up “For Sale” Sign as It Names New CEO", "link": "https://www.hollywoodreporter.com/business/business-news/cineplex-for-sale-sign-new-ceo-1236708288/", "summary": "A “review of strategic alternatives” for the Canadian exhibition giant led by Goldman Sachs and TD Securities has started.", "date_str": "2026-09-23T12:41:57+00:00", "hash": "e5e5a451538cac59", "title_fa": "Cineplex علامت \"برای فروش\" را به عنوان مدیر عامل جدید معرفی می کند", "summary_fa": "\"بازبینی جایگزین های استراتژیک\" برای غول نمایشگاهی کانادا به رهبری گلدمن ساکس و TD Securities آغاز شده است. Cineplex همزمان با معرفی بیل واکر، رئیس سابق سینمای Landmark Cinemas به عنوان مدیر عامل جدید خود، خود را برای فروش گذاشته است و جایگزین الیس جاکوب بازنشسته شده است. به عنوان بخشی از بررسی استراتژیک، هیئت مدیره طیف وسیعی از گزینه‌ها را در نظر خواهد گرفت، از جمله، اما نه محدود به، فروش احتمالی شرکت. سینپلکس، غول نمایشگاهی کانادایی در بیانیه‌ای از طریق هیئت مدیره خود اعلام  به [مانیتور] نگاه می کردم و می گویم: «اوه، یک لحظه صبر کن، این واقعاً سخت است.» جسی آیزنبرگ اتاقی از روزنامه نگاران را با دوران درخشان اما کمی غم انگیز خود به نمایش گذاشت، در حالی که درباره آخرین چیزهای دوران کودکی خود صحبت می کرد. جولیان مور، پل جیاماتی، هالی بیلی، هاوانا رز لیو، برنادت پیترز، کولتون رایان، لیلی کوپر، ماولیک پانچولی و بانی میلیگان در فیلم The Debut به آیزنبرگ می‌پیوندند. او تحت طلسم کارگردان با اراده و معمایی (جیاماتی) خود را در نقش و دنیای پرمخاطره این تئاتر اجتماعی گم می کند. داستان‌های مرتبط فیلم‌ها براد پیت می‌گوید سینمای مستقل مانند دهه ۹۰ احساس قدرت می‌کند MIP تجاری لندن پس از ۲ سال به پایان می‌رسد، با رویداد نمایشگاه کتاب لندن جایگزین می‌شود. این بازیگر، نویسنده و کارگردان، که آخرین فیلمش «درد واقعی» نامزد دریافت چندین جایزه اسکار شد، گفت که The Debut تا حدی زندگی‌نامه‌ای است زیرا تجربه خودش از پیوستن به تئاتر اجتماعی را به تصویر می‌کشد. داستان فیلم در سال 1990 در مرکز نیوجرسی می گذرد و زمانی که در سال 1990 در مرکز نیوجرسی بودم، شبیه مونا فریدمن [شخصیت مور] بودم. خیلی خجالتی بودم من افسرده بودم و دوستی نداشتم. و سپس وقتی هفت ساله بودم وارد این تئاتر اجتماعی شدم، و ناگهان همه خیلی خوب بودند و مرا در آغوش گرفتند، او گفت که باعث قهقهه زدن از اتاق شد. رفتن از بچه‌ای که در مدرسه مسخره‌اش می‌کردند، چون موهای من هم مثل توست، موهای فرفری، و بچه‌ها به من چیزهای بدی می‌گفتند. و بعد وارد سالن تئاتر شدم و همه گفتند: وای، موهایت خیلی شگفت انگیز است!"}, {"source": "Hollywood Reporter", "title": "Brad Pitt Says Indie Cinema “Feels as Strong as in the ’90s”", "link": "https://www.hollywoodreporter.com/movies/movie-news/brad-pitt-san-sebastian-film-festival-heart-of-the-beast-1236708258/", "summary": "The Hollywood star has hit the San Sebastian Film Festival ahead of the premiere of David Ayer's 'Heart of the Beast.'", "date_str": "2026-09-23T11:08:15+00:00", "hash": "8408cd35b701d65b", "title_fa": "برد پیت می‌گوید سینمای مستقل «به اندازه دهه 90 احساس قوی می‌کند»", "summary_fa": "این ستاره هالیوود پیش از اکران فیلم «قلب هیولا» ساخته دیوید آیر در جشنواره فیلم سن سباستین حضور یافت. پیش از مراسمی که احتمالاً اولین نمایش خشمگین جشنواره فیلم سن سباستین خواهد بود، براد پیت روز چهارشنبه به دیوید آیر کارگردان قلب هیولا برای یک کنفرانس مطبوعاتی پیوست. روزنامه‌نگاران و شرکت‌کنندگان در سالن تئاتر شهر Kursaal، ​​جایی که پیت شادی‌آور اولین حضور خود را در سن سباستین از زمان ارائه فیلم Inglourious Basterds در سال 2009 در کنار کوئنتین تارانتینو، فیلم‌ساز داشت، رفتند. او با لمس پیوند انسان با سگ ها، تثبیت هالیوود و فضای فیلم مستقل فعلی، خبرنگاران را خوشحال کرد. داستان‌های مرتبط MIP تجاری لندن پس از 2 سال به پایان می‌رسد، با تلویزیون رویداد نمایشگاه کتاب لندن جایگزین می‌شود. نگاه ویژه ملکه ازدواج مجدد: Shin Min-a، Ju Ji-hoon Preview K-Drama مجلل Disney+ از پیت به‌سرعت در مورد لباس تهیه‌کننده‌اش و آنچه از منظره فیلم مستقل می‌سازد سؤال شد. ستاره سرزنده بود: من فکر می‌کنم که تنظیمات کنونی واقعاً برای [فیلم‌های] مستقل بسیار مفید بوده است، به شیوه‌ای واقعاً جالب، زیرا نگاه‌های بیشتری به این پروژه‌ها معطوف شده است. قبل از اینکه از ایر نظر خودش را بپرسد، گفت که حتی به اندازه دهه 90 قوی است. آیر گفت: من فکر می کنم خطوط لوله جدیدی از اکتشاف وجود دارد، مؤلفان جدید. او با اشاره به کارگردانان جوان ترسناک، کری بارکر و کین پارسونز، گفت: ما افرادی را داریم که از یوتیوب یا اینترنت وارد می‌شوند، اما اکنون آنچه را که من معتقدم ممکن است صعود آن باشد، می‌بینیم، زیرا فیلمسازانی را در آن فضا می‌یابیم، اما همچنین با ورود جوانان به این صنعت. آنها سلیقه های بسیار متفاوتی دارند و با حس متفاوتی نسبت به ما از رسانه بزرگ شده اند. بنابراین من در واقع در مورد آینده و فرصت های آینده و داستان های آینده ای"}, {"source": "Hollywood Reporter", "title": "MIP London Ends After 2 Years, Replaced by London Book Fair Event", "link": "https://www.hollywoodreporter.com/business/business-news/mip-london-talks-ends-london-book-fair-event-rx-france-1236708252/", "summary": "The new MIP Talks will take place in March, built around the editorial theme 'From IP to Fandom — and Fandom to Global Business.'", "date_str": "2026-09-23T09:22:16+00:00", "hash": "472f9c496e565fcf", "title_fa": "MIP لندن پس از 2 سال به پایان می رسد و با رویداد نمایشگاه کتاب لندن جایگزین می شود", "summary_fa": "گفتگوهای جدید MIP در ماه مارس برگزار خواهد شد که حول محور سرمقاله \"از IP تا فن - و فن تا تجارت جهانی\" ساخته شده است. پس از دو سال، MIP لندن به پایان رسید و قرار است با یک کنفرانس دو روزه جدید که در نمایشگاه کتاب لندن برگزار می شود، جایگزین شود. روز چهارشنبه، RX فرانسه راه اندازی MIP Talks را از 16 تا 17 مارس 2027 تأیید کرد. این رویداد با نمایشگاه کتاب لندن، یکی از رویدادهای شاخص RX برگزار می‌شود، که صداهای پیشرو را از سراسر جهان سرگرمی، رسانه و فرهنگ گرد هم می‌آورد تا آنچه را که در حال تغییر است، آنچه در حال شکستن است و فرصت‌های جدید در حال ظهور است را بررسی کنند. گفتگوهای افتتاحیه MIP حول موضوع سرمقاله از IP به Fandom و Fandom to Global Business ساخته خواهد شد، که در آن کارشناسان یک منظره سرگرمی را بررسی خواهند کرد که در آن مرزهای سنتی در حال ناپدید شدن هستند، مخاطبان در بین پلتفرم ها و تجربیات حرکت می کنند و IP می تواند از هر کجا آمده باشد. سازمان‌دهندگان اضافه شده‌اند که برنامه‌نویسی بسیار سرپرستی و به صورت سرمقاله هدایت می‌شود، گفتگوهای سرفصل، جفت‌های غیرمنتظره، روندها و داده‌های جهانی، بینش فرهنگی و مطالعات موردی از سراسر تجارت سرگرمی بین‌المللی را شامل می‌شود. لوسی اسمیت، مدیر بخش سرگرمی RX فرانسه، گفت: مرزهای سرگرمی کاملاً ناپدید شده است. IP می‌تواند از هر جایی باشد، مخاطبان در بخش‌ها فکر نمی‌کنند و یک ایده می‌تواند بیشتر و سریع‌تر از همیشه سفر کند. MIP همیشه در مورد این بوده است که بداند تجارت سرگرمی به کجا می‌رود. MIP Talks در نمایشگاه کتاب لندن این کنجکاوی را بیشتر گرد هم می‌آورد و افرادی را که در حال شکل‌دهی به آنچه رخ می‌دهد، نحوه ایجاد هواداری و مکان‌هایی که کسب‌وکارهای جهانی جدید در حال ظهور هستند،"}, {"source": "Variety", "title": "YouTube Locks Down Coachella Rights Through 2030 as it Unveils New Microdrama-Inspired Experience for Shorts, AI-Powered Tools for Music and Studio and More", "link": "https://variety.com/2026/biz/news/youtube-coachella-2030-made-on-youtube-1236872595/", "summary": "YouTube s staying in the Coachella desert for a few more years. The streamer will remain the exclusive free streaming home of Coachella through 2030, continuing its nearly 15-year partnership with the festival’s parent company Goldenvoice. The extension comes nearly six months after YouTube broadcast the Sabrina Carpenter, Justin Bieber, and Karol G-led edition of the [ ]", "date_str": "2026-09-23T14:30:04+00:00", "hash": "94e0210c85f5ca52", "title_fa": "یوتیوب حقوق کواچلا را تا سال 2030 قفل کرد زیرا از تجربه جدید الهام گرفته از میکرودرام برای فیلم‌های کوتاه، ابزارهای مجهز به هوش مصنوعی برای موسیقی و استودیو و موارد دیگر رونمایی کرد.", "summary_fa": "یوتیوب چند سال دیگر در صحرای کواچلا می ماند. این استریمر تا سال 2030 خانه پخش رایگان انحصاری Coachella باقی خواهد ماند و به همکاری نزدیک به 15 ساله خود با شرکت مادر جشنواره Goldenvoice ادامه می دهد. نیل موهان، مدیرعامل یوتیوب، چهارشنبه در جریان رویداد Made on YouTube شرکت، گفت: این تمدید تقریباً شش ماه پس از پخش نسخه‌های سابرینا کارپنتر، جاستین بیبر و کارول G توسط یوتیوب ارائه می‌شود. محبوب در Variety در طول این رویداد، این شرکت مجموعه ای از ویژگی ها و ابزارهای جدید را برای بینندگان و سازندگان در رسانه های خود معرفی کرد. برخی از دیگر محصولات جدید آن شامل فیدهای سفارشی جدید، عملکردهای مکالمه مبتنی بر هوش مصنوعی در سراسر YouTube و YouTube Music و ویژگی‌های نظرات جدید و بسیاری موارد دیگر است. یک راه‌اندازی مهم: گسترش نمایش‌ها به YouTube Shorts، که به سازندگان اجازه می‌دهد ویدیوهای کوتاه را در یک تجربه ساختاریافته با قسمت‌هایی که برای بینندگان تنظیم می‌شود قالب‌بندی کنند، یا به عبارت دیگر، Shorts را به‌عنوان میکرودرام قالب‌بندی کنند. یوتیوب اعلام کرد که بینندگان میکرودرام در نیمه اول سال 2026 از 6.5 میلیارد بازدید گذشت که نسبت به سال گذشته بیش از 60 درصد رشد داشت، در حالی که بینندگان میکرودرام در صفحه های تلویزیونی در نیمه اول سال 2026 نسبت به سال قبل 90 درصد افزایش یافت. گسترش Shorts به ساختارهای اپیزود مانند به مخاطبان رو به رشد این پلت فرم کمک می کند، که بیش از 35٪ آنها در ماه ژوئیه، YouTube Shorts را از تلویزیون تماشا کردند. این شرکت همچنین بسیاری از محصولات خود را با هوش  می توانند با تبلیغات دهان به دهان مثبت از انتظارات فراتر روند. فیلم محبوب در Variety Primetime فقط 15 میلیون دلار هزینه تولید داشت، بنابراین این فیلم در موقعیت خوبی قرار دارد تا در اکران سینمایی خود سود کند. در مقایسه، «قلب هیولا» و «جزیره فراموش‌شده» بسیار گران‌تر بودند. The Heart of the Beast برچسب قیمتی 82 میلیون دلاری دارد و جزیره فراموش شده با قیمت 80 میلیون دلار تولید شده است، بنابراین این فیلم‌ها برای توجیه بودجه قابل توجه‌شان باید فراتر از اکران در صفحه بزرگ باقی بمانند. (این به این دلیل است که صاحبان تئاتر تقریباً 50٪ از فروش بلیت را حفظ می کنند.) Primetime همچنان یک سال پرچمدار برای پتینسون است، که در فیلم موفقیت آمیز بهاری The Drama، پرفروش تابستانی کریستوفر نولان، The Odyssey بازی کرد و در فیلم آتی Dune: Part III دنیس ویلنوو ظاهر خواهد شد."}, {"source": "Variety", "title": "Production Surge in Spain Confirmed by Olsberg SPI Study, but Headwinds Approach", "link": "https://variety.com/2026/film/global/spain-production-spend-2025-6-6-billion-olsberg-spi-study-1236872765/", "summary": "Spain’s audiovisual sector is continuing to expand, with production spend expected to reach €5.68 billion ($6.6 billion) in 2025, up 45% from 2022, according to a new study by U.K.-based consultancy Olsberg SPI, commissioned by the Spain Film Commission. At a presentation held at the San Sebastian Festival, Kayleigh Hughes of Olsberg SPI said the [ ]", "date_str": "2026-09-23T13:45:08+00:00", "hash": "761d3de1c9816518", "title_fa": "افزایش تولید در اسپانیا توسط مطالعه Olsberg SPI تایید شد، اما رویکرد Headwinds", "summary_fa": "بر اساس مطالعه جدیدی که توسط موسسه مشاوره اولسبرگ SPI مستقر در بریتانیا به سفارش کمیسیون فیلم اسپانیا انجام شد، بخش سمعی و بصری اسپانیا همچنان در حال گسترش است و انتظار می‌رود هزینه تولید به 5.68 میلیارد یورو (6.6 میلیارد دلار) در سال 2025 برسد که 45 درصد نسبت به سال 2022 بیشتر است. در یک سخنرانی که در جشنواره سن سباستین برگزار شد، کایلی هیوز از Olsberg SPI، خوان مانوئل گیمرانس، از کمیسیون فیلم اسپانیا گفت: «اگر ایالات متحده یک اعتبار مالیاتی فدرال ارائه کند، من انتظار دارم تولید در آنجا رشد کند. من فکر نمی‌کنم این لزوماً برای سایر مناطق منفی باشد. بر اساس مطالعه جدیدی که توسط کمیسیون فیلم‌سی در بریتانیا به سفارش O.K. Filmcy، به سفارش کمیسیون SPA، مرکز SPA، اگر تولید در ایالات متحده افزایش یابد، اگر تولید در ایالات متحده افزایش یابد، هزینه‌های کار و سایر هزینه‌ها ممکن است افزایش یابد، که همچنان می‌تواند برخی از تولیدات را در جاهای دیگر سوق دهد. این تحقیق از داده‌های موسسه آمار اسپانیا برای اندازه‌گیری هزینه‌های تولید در سراسر فیلم، ویدئو و تلویزیون، از جمله هزینه‌های کالاها، خدمات و پرسنل استفاده می‌کند. وی افزود، با این حال، نمایشگاه، توزیع، پخش و بازی های ویدیویی را مستثنی می کند، در حالی که پس از تولید در گزارش کامل گنجانده خواهد شد. محبوب در تنوع انتظار می رود این بخش 4.98 میلیارد ارزش افزوده ناخالص (GVA) برای اقتصاد اسپانیا در سال 2025 ایجاد کند. این شامل 2.72 میلیارد فعالیت مستقیم، در کنار فعالیت غیرمستقیم تولید شده توسط تامین کنندگان و ارائه دهندگان خدمات و فعالیت های القایی مرتبط با هزینه های کارکنان است. هیوز گفت که این ارقام نشان دهنده ردپای اقتصادی رو به رشد بخش سمعی و بصری فراتر از خود شرکت های تولیدی است و از اکوسیستم وسیع تری از مشاغل و کارگران حمایت می کند."}, {"source": "Variety", "title": "Kerry Washington Expands ‘Street You Grew Up On’ Interview Series Into Weekly Ongoing Podcast From Her Simpson Street Production Company and Daylight", "link": "https://variety.com/2026/digital/news/kerry-washington-street-you-grew-up-podcast-weekly-1236867010/", "summary": "Kerry Washington is turning her Street You Grew Up On interview show, which she has run in four discrete seasons over the last several years, into an ongoing weekly podcast. The actress, producer and director, best known for her role on ABC s Scandal, first launched the show as a digital series in 2021 during the [ ]", "date_str": "2026-09-23T13:30:00+00:00", "hash": "35cd26d69f8951ee", "title_fa": "کری واشنگتن مجموعه مصاحبه‌های «خیابانی که در آن بزرگ شدی» را به پادکست هفتگی در حال انجام از شرکت تولیدی خیابان سیمپسون و Daylight گسترش می‌دهد.", "summary_fa": "کری واشنگتن در حال تبدیل برنامه مصاحبه خود در خیابان You Grow Up On است که در چهار فصل مجزا در چند سال گذشته اجرا کرده است، به یک پادکست هفتگی مداوم. این بازیگر، تهیه‌کننده و کارگردان که بیشتر به خاطر نقشش در ABC s Scandal شناخته می‌شود، اولین بار این سریال را به‌عنوان یک سریال دیجیتال در سال 2021 و در طول [ ] راه‌اندازی کرد. طبق گفته شرکت او در هر قسمت، او یک مهمان را دعوت می‌کند تا به بازدید مجدد از افراد، مکان‌ها و تجربیاتی که قبل از مشهور شدن آنها را شکل داده‌اند، بپردازد و بررسی کند که چگونه دوران کودکی، خانواده، جامعه و تعلقات همچنان بر هویت آنها تأثیر می‌گذارد. مهمانان محبوب ورایتی واشنگتن در فصل 5 این برنامه هفتگی عبارتند از: بن افلک، دواین جانسون، دمی لواتو، کالین کپرنیک و چلسی هندلر. میشل اوباما، جین فوندا، کوئین لطیفه، جان لجند، عیسی رائه و جی شتی از مهمانان گذشته در خیابان تو بزرگ شدی می‌توان به مهمانان قبلی اشاره کرد. نام شرکت من خیابان سیمپسون به نام خیابانی در برانکس است که مادرم در آن بزرگ شده است. واشنگتن در بیانیه‌ای گفت: من همیشه کنجکاو بوده‌ام که داستان‌های منشأ ما چگونه بر شخصیت ما تأثیر می‌گذارد. خیابانی که در آن بزرگ شدی به من اجازه می دهد تا با درگیر شدن در گفتگو با افرادی که سفرهایشان همه ما را مجذوب خود می کند به کشف این ایده ادامه دهم. من هیجان‌زده هستم که این مجموعه را به یک پادکست گسترش دهم و زمان بیشتری را با مهمانانمان بگذرانم تا افراد، مکان‌ها و تجربیاتی را که زندگی آن‌ها را شکل داده‌اند کاوش کنند. فصل 5 سریال Street Your Grew Up On چهارشنبه، 30 سپتامبر پخش می شود. قسمت های جدید هر چهارشنبه منتشر می شود. صدا در تمام پلتفرم‌های پادکست و ویدیوی کامل در"}, {"source": "Variety", "title": "‘Heated Rivalry’ Star Callan Potter, Cobie Smulders, Iris Apatow Joined by Colin Mochrie, Andrea Martin in ‘Any Way You Want Me’ (EXCLUSIVE)", "link": "https://variety.com/2026/film/news/colin-mochrie-andrea-martin-any-way-you-want-me-cast-1236873155/", "summary": "Comedy veterans Colin Mochrie ( Whose Line Is It Anyway? ) and Andrea Martin ( Evil, My Big Fat Greek Wedding ) have boarded Any Way You Want Me, joining Callan Potter ( Hea     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
