<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>

      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;

      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;

      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {

      color: var(--text);
      line-height: 1.8;

      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {

      margin: 0 auto;
    }
    header {

      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;

    }
    .header-actions {

      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {

    h1 {

      font-weight: 800;

      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

  <script>

یا درخواست امتیاز هسته‌ای؟ تماس تازه واشینگتن با تهران از مسیر معمول وزارت خارجه دو کشور صورت نگرفت. به گزارش روزنامه «نیویورک‌تایمز»، ونس هفته گذشته نامه‌ای را از طریق میانجی‌های قطری برای محسن رضایی فرستاد که روز یکشنبه چهارم آبان به دست او رسید. معاون رییس‌جمهور آمریکا در این نامه خواستار ازسرگیری مذاکرات جامع صلح، از جمله درباره پرونده هسته‌ای، شده و آمادگی خود را برای ریاست هیئت مذاکره‌کننده آمریکا اعلام کرده است. روزنامه «واشینگتن‌پست» نیز در گزارشی از «دیوید ایگناتیوس» نوشت که ونس در پیام خود بر منافع دو کشور تاکید کرده است. در این پیام، جلوگیری از دستیابی ایران به سلاح هسته‌ای اولویت اصلی واشینگتن معرفی شده است. در مقابل، بازسازی اقتصاد آسیب‌دیده از جنگ و تحریم‌ها و حفظ حاکمیت ملی، منافع اصلی ایران عنوان شده‌اند. ونس همچنین از تهران خواسته است نمایندگانی با اختیارات کامل برای گفت‌وگو درباره مسایل هسته‌ای معرفی کند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D8%AA%D9%88%D8%A7%D9%81%D9%82-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86_GDGV__v1024x512__box_0%2C0%2C1488%2C782.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۰ آبان • ۱۱:۰۶"}, {"source": "IranWire", "title": "جمهوری اسلامی نیروی دریایی و هوایی بریتانیا را سازمان تروریستی اعلام کرد", "link": "https://iranwire.com/fa/news-1/159640-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D9%86%DB%8C%D8%B1%D9%88%DB%8C-%D8%AF%D8%B1%DB%8C%D8%A7%DB%8C%DB%8C-%D9%88-%D9%87%D9%88%D8%A7%DB%8C%DB%8C-%D8%A8%D8%B1%DB%8C%D8%AA%D8%A7%D9%86%DB%8C%D8%A7-%D8%B1%D8%A7-%D8%B3%D8%A7%D8%B2%D9%85%D8%A7%D9%86-%D8%AA%D8%B1%D9%88%D8%B1%DB%8C%D8%B3%D8%AA%DB%8C-%D8%A7%D8%B9%D9%84%D8%A7%D9%85-%DA%A9%D8%B1%D8%AF/", "summary": "وزارت امور خارجه جمهوری اسلامی در اقدامی تلافی‌جویانه، نیروی دریایی و نیروی هوایی سلطنتی بریتانیا را «سازمان تروریستی» و سرویس اطلاعات خ ...", "date_str": "2026-11-01T08:11:21+00:00", "hash": "e7b356e3798738c5", "title_fa": "جمهوری اسلامی نیروی دریایی و هوایی بریتانیا را سازمان تروریستی اعلام کرد", "summary_fa": "وزارت امور خارجه جمهوری اسلامی در اقدامی تلافی‌جویانه، نیروی دریایی و نیروی هوایی سلطنتی بریتانیا را «سازمان تروریستی» و سرویس اطلاعات خ ... وزارت امور خارجه روز یکشنبه ۱۰آبان۱۴۰۵، در بیانیه‌ای اعلام کرد که این تصمیم با استناد به مصوبه شورای عالی امنیت ملی جمهوری اسلامی گرفته شده و از زمان انتشار بیانیه لازم‌الاجراست. بر اساس این بیانیه، سرویس اطلاعات خارجی بریتانیا، ام‌آی۶، مشمول قانون «تشدید مجازات جاسوسی و همکاری با رژیم صهیونیستی و کشورهای متخاصم علیه امنیت و منافع ملی» خواهد شد. این وزارتخانه همچنین اعلام کرد که نیروی دریایی سلطنتی و نیروی هوایی سلطنتی بریتانیا، بر اساس قانون اقدام متقابل در برابر تروریستی اعلام شدن سپاه پاسداران از سوی آمریکا، در فهرست سازمان‌های تروریستی جمهوری اسلامی قرار گرفته‌اند. وزارت امور خارجه در توضیح دلایل این تصمیم، دولت بریتانیا را به مشارکت در حملات نظامی آمریکا و اسراییل علیه ایران از طریق در اختیار گذاشتن پایگاه‌ها و امکانات نظامی و تدارکاتی متهم کرده است. در این بیانیه همچنین به تصمیم دولت بریتانیا در ۲۲تیر۱۴۰۵ برای قرار دادن سپاه پاسداران ذیل قانون تهدیدات دولتی سال ۲۰۲۶ اشاره شده است. جمهوری اسلامی این اقدامات را «خصمانه» و مغایر با منشور ملل متحد و اصول حقوق بین‌الملل توصیف کرده و مدعی شده است که تصمیم تازه تهران در چارچوب اصل اقدام متقابل اتخاذ شده است. وزارت امور خارجه همچنین مسئولیت پیامدهای این تصمیم را متوجه دولت بریتانیا دانسته، اما توضیح نداده است که تروریستی اعلام کردن دو نیروی نظامی این کشور و متخاصم شناختن سرویس اطلاعاتی آن، در عمل چه پیامدهایی خواهد داشت. در بیانیه منتشر شده مشخص نشده است که این تصمیم چه محدودیت‌های اجرایی مشخصی ایجاد می‌کند یا چه تاثیری بر روابط دیپلماتیک و امنیتی دو کشور خواهد گذاشت. اقدام تازه جمهوری اسلامی در حالی صورت گرفته که حکومت ایران بارها اقدامات کشورهای غربی علیه سپاه پاسداران را محکوم کرده", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D8%A8%D8%B1%DB%8C%D8%AA%D8%A7%D9%86%DB%8C%D8%A7_mcEC__v1024x512__box_0%2C40%2C800%2C460.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۱۰ آبان • ۱۱:۴۱"}, {"source": "IranWire", "title": وری گسترده تجاری خانواده ترامپ، از نخستین اهداف هرگونه تحقیق احتمالی خواهد بود. سوهاس سوبرامانیام، نماینده دموکرات ایالت ویرجینیا و عضو کمیته نظارت مجلس نمایندگان، به بی‌بی‌سی گفت: «ما می‌خواهیم مطمئن شویم که پول مالیات‌دهندگان [آمریکایی] به‌درستی هزینه می‌شود و به دلیل فساد به سرقت نمی‌رود یا به جیب افراد خاص سرازیر نمی‌شود.» از جمله موضوعاتی که برای تحقیق در نظر گرفته شده‌اند، می‌توان به ارتباط میان دولت و شرکت‌های تجاری، به‌ویژه شرکت‌های فعال در حوزه ارزهای دیجیتال، و همچنین فعالیت‌های تجاری بین‌المللی جرد کوشنر، داماد رئیس‌جمهور، اشاره کرد. موضوعات دیگری نیز ممکن است مورد بررسی قرار گیرند؛ از جمله هواپیمای ۴۰۰ میلیون دلاری که قطر برای استفاده به‌عنوان هواپیمای ریاست‌جمهوری آمریکا (ایر فورس وان) هدیه داده است و قراردادهای چند میلیون دلاری دفاعی که به شرکت‌های مرتبط با خانواده ترامپ", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/11f9/live/81a98dc0-d252-11f1-b6ed-51fc9a3ab608.jpg", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۰ آبان • ۰۸:۴۷"}, {"source": "Iran International", "title": "بایننس پس از حمله هکری شش میلیارد دلار از دارایی‌های سرقت‌شده را جبران کرد", "link": "https://www.iranintl.com/202611017781", "summary": "بایننس، بزرگ‌ترین صرافی ارز دیجیتال جهان، اعلام کرد که پس از حمله سایبری به این صرافی، با استفاده از منابع مالی شرکت برای خرید توکن‌های جایگزین، شش میلیارد دلار از مجموع ۶.۳ میلیارد دلار دارایی سرقت‌شده از پلتفرم خود را جبران کرده است.", "date_str": "2026-11-01T05:00:39+00:00", "hash": "da97880aa2cf24ea", "title_fa": "بایننس پس از حمله هکری شش میلیارد دلار از دارایی‌های سرقت‌شده را جبران کرد", "summary_fa": "بایننس، بزرگ‌ترین صرافی ارز دیجیتال جهان، اعلام کرد که پس از حمله سایبری به این صرافی، با استفاده از منابع مالی شرکت برای خرید توکن‌های جایگزین، شش میلیارد دلار از مجموع ۶.۳ میلیارد دلار دارایی سرقت‌شده از پلتفرم خود را جبران کرده است.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/84c920a9657e07d9bbdd01aa158a09e2f0945331-4000x2667.jpg?rect=0,284,4000,2100&w=1200&h=630&q=66& ز آغاز جنگ آمریکا و اسرائیل با ایران، پنتاگون هنوز میزان خسارات وارده به پایگاه‌های آمریکا در خاورمیانه را اعلام نکرده است. اسوشیتدپرس و وال‌استریت ژورنال در گزارش‌هایی با تحلیل تصاویر ماهواره‌ای جدید تلاش کردند تصویری روشن از این خسارات ارائه کنند.", "image_url": "https://images.euronews.com/articles/stories/09/97/50/60/1200x675_cmsv2_646fe144-2793-57a4-95ad-13d40910908c-9975060.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۰ آبان • ۰۷:۲۷"}, {"source": "BBC Persian", "title": "چرا بعضی‌ها روح می‌بینند یا حضور موجودی نامرئی را حس می‌کنند؟", "link": "https://www.bbc.com/persian/articles/cv1j3265jk25o?at_medium=RSS&at_campaign=rss", "summary": "از داستان‌های باستانی بین‌النهرین درباره ارواحی که بازماندگانشان باید از آن‌ها مراقبت کنند گرفته تا «سرود کریسمس» چارلز دیکنز، انسان‌ها تاریخی طولانی در روایت داستان‌های ارواح دارند.", "date_str": "2026-11-01T02:00:45+00:00", "hash": "ade03da636a08691", "title_fa": "چرا بعضی‌ها روح می‌بینند یا حضور موجودی نامرئی را حس می‌کنند؟", "summary_fa": "از داستان‌های باستانی بین‌النهرین درباره ارواحی که بازماندگانشان باید از آن‌ها مراقبت کنند گرفته تا «سرود کریسمس» چارلز دیکنز، انسان‌ها تاریخی طولانی در روایت داستان‌های ارواح دارند. اما چرا این شیفتگی به ارواح همچنان ادامه دارد؟ پروفسور کریستین سیموندز-مور، روان‌شناس دانشگاه وست جورجیا در آمریکا، می‌گوید مردم بدون تردید تجربه‌هایی دارند که خودشان آن‌ها را ماوراءالطبیعه می‌دانند؛ اصطلاحی که معمولا برای پدیده‌هایی به کار می‌رود که علم در حال حاضر نمی‌تواند آن‌ها را توضیح دهد. او می‌گوید: «این تجربه‌ها از نظر ذهنی کاملا واقعی‌اند... و می‌توانند تاثیر بسیار بزرگی بر افراد بگذارند.» اما این به آن معنا نیست که علت آن‌ها لزوما فراطبیعی است. به گفته سیموندز-مور، وقتی افراد چیزی ماوراءالطبیعه را تجربه می‌کنند، ممکن است اتفاق‌های مختلفی در مغز در حال رخ دادن باشد. یکی از توضیح‌های احتمالی به حالتی به نام «هیپناگوژی» مربوط می‌شود، دوره میان خواب و بیداری. سیموندز-مور می‌گوید: «بسیاری از این تجربه‌ها زمانی رخ می‌دهند که افراد در حالت‌هایی با اندکی تغییر در سطح هوشیاری قرار دارند.» در این زمان، تخیل درونی و ادراک بیرونی می‌توانند در هم بیامیزند و تشخیص تفاوت میان آن دو دشوار شود. فلج خواب نیز ممکن است در همین دوره رخ دهد. یک بررسی در سال ۲۰۱۱ برآورد کرده بود که ۷/۶ درصد از جمعیت عمومی آن را تجربه کرده‌اند. این پژوهش که در نشریه «اسلیپ مدیسن ریویوز» منتشر شد، از نمونه‌ای بین‌المللی استفاده کرده بود که دانشجویان و افراد دارای اختلالات روان‌پزشکی را شامل نمی‌شد. پروفسور کریس فرنچ از گلداسمیتس، دانشگاه لندن، که «واحد پژوهش روان‌شناسی نابهنجار» را برای بررسی علمی تجربه‌های ظاهرا ماوراءالطبیعه بنیان گذاشته، می‌گوید فلج خواب زمانی است که «بدنتان بیدار می‌شود اما مغزتان نه». فلج خواب با طیفی از نشانه‌ها همراه است، از جمله احساس شدید حضور موجود دیگری در اتاق.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/45f5/live/a1fa0ae0-d1f4-11f1-b360-61fb5d34dc08.jpg", "category": "موسیقی و هنر", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۰ آبان • ۰۵:۳۰"}, {"source": "Iran International", "title": "ترامپ و نتانیاهو در سایه احتمال ازسرگیری حملات به ایران گفت‌وگو کردند", "link": "https://www.iranintl.com/202611014973", "summary": "دونالد ترامپ و بنیامین نتانیاهو در حالی تلفنی گفت‌وگو کردند که واشینگتن گزینه‌های حمله دوباره به ایران را بررسی می‌کند و میانجی‌ها برای جلوگیری از تشدید درگیری می‌کوشند. هم‌زمان، گزارش‌ها درباره پیشرفت مذاکرات با مواضع محتاطانه تهران همراه شده است.", "date_str": "2026-11-01T00:12:58+00:00", "hash": "2496ca9f98472dac", "title_fa": "ترامپ و نتانیاهو در سایه احتمال ازسرگیری حملات به ایران گفت‌وگو کردند", "summary_fa": "دونالد ترامپ و بنیامین نتانیاهو در حالی تلفنی گفت‌وگو کردند که واشینگتن گزینه‌های حمله دوباره به ایران را بررسی می‌کند و میانجی‌ها برای جلوگیری از تشدید درگیری می‌کوشند. هم‌زمان، گزارش‌ها درباره پیشرفت مذاکرات با مواضع محتاطانه تهران همراه شده است.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/64fd8585fff6063d4a09b7693d73343c47662047-1468x1042.jpg?rect=0,136,1468,771&w=1200&h=630&q=66&fit=max&auto=format", "category": "سیاست و دیپلماسی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۰ آبان • ۰۳:۴۲"}, {"source": "Euronews Persian", "title": "تماس تلفنی ترامپ و نتانیاهو همزمان با تدارک حملات به ایران؛ رضایی: لحن آمریکا در نامه ونس تغییر کرده است", "link": "https://parsi.euronews.com/2026/11/01/trump-netanyahu-call-mohsen-rezaei-vance-letter-tone-change-oct-2026", "summary": "محسن رضایی روز شنبه تاکید کرد که تحقق هفت شرط ایران از سوی آمریکا لازمه آغاز مذاکرات پایان جنگ است. او همچنین تایید کرد که نامه ونس را دریافت کرده است، اما هنوز به آن پاسخی نداده است. این در حالی است که با نزدیک شدن به انتخابات میان‌دوره‌ای کنگره آمریکا، نگرانی‌ها از ازسرگیری جنگ افزایش یافته است.", "date_str": "2026-10-31T23:47:49+00:00", "hash": "a06afba0adf73597", "title_fa": "تماس تلفنی ترامپ و نتانیاهو همزمان با تدارک حملات به ایران؛ رضایی: لحن آمریکا در نامه ونس تغییر کرده است", "summary_fa": "محسن رضایی روز شنبه تاکید کرد که تحقق هفت شرط ایران از سوی آمریکا لازمه آغاز مذاکرات پایان جنگ است. او همچنین تایید کرد که نامه ونس را دریافت کرده است، اما هنوز به آن پاسخی نداده است. این در حالی است که با نزدیک شدن به انتخابات میان‌دوره‌ای کنگره آمریکا، نگرانی‌ها از ازسرگیری جنگ افزایش یافته است.", "image_url": "https://images.euronews.com/articles/stories/09/97/50/47/1200x675_cmsv2_8ddf1b88-dfe7-56d2-a1a6-e0903751505d-9975047.jpg", "category": "سیاست و دیپلماسی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۰ آبان • ۰۳:۱۷"}, {"source": "BBC Persian", "title": "چگونه جنگ غزه به چالشی انتخاباتی برای حامیان اسرائیل در آمریکا تبدیل شد؟", "link": "https://www.bbc.com/persian/articles/ckvg7z4l4nyqo?at_medium=RSS&at_campaign=rss", "summary": "در یکی از رقابتی‌ترین رقابت‌های انتخابات میان‌دوره‌ای آمریکا، موضع واشنگتن در قبال اسرائیل به عاملی تبدیل شده که رای‌دهندگان هر دو طرف این موضوع را به میدان کشانده است.", "date_str": "2026-10-31T23:04:05+00:00", "hash": "7aab79e7d5a09bdc", "title_fa": "چگونه جنگ غزه به چالشی انتخاباتی برای حامیان اسرائیل در آمریکا تبدیل شد؟", "summary_fa": "در یکی از رقابتی‌ترین رقابت‌های انتخابات میان‌دوره‌ای آمریکا، موضع واشنگتن در قبال اسرائیل به عاملی تبدیل شده که رای‌دهندگان هر دو طرف این موضوع را به میدان کشانده است. سمرا لقمان که تمام عمرش به دموکرات‌ها رای داده بود، با افتخار در انتخابات ریاست‌جمهوری آمریکا به دونالد ترامپ رای داد. آن زمان یک موضوع تعیین‌کننده رای او بود و در انتخابات میان‌دوره‌ای نیز همین موضوع تصمیمش را شکل خواهد داد. این آمریکایی یمنی‌تبار به بی‌بی‌سی می‌گوید: «یا غزه یا هیچ. اگر موضعتان درباره غزه، اسرائیل و فلسطین خوب نباشد، نه به شما در قدرت نیاز داریم و نه به شما رای می‌دهیم؛ فرقی هم نمی‌کند عضو چه حزبی باشید.» خشم از حمایت آمریکا از اسرائیل باعث شد در سال ۲۰۲۴ شماری از رای‌دهندگانی مانند لقمان که به‌طور سنتی به حزب دموکرات رای می‌دادند، به پیروزی جمهوری‌خواهان در ایالت کلیدی و رقابتی میشیگان کمک کنند. اکنون نیز نگرانی‌های مشابه، رای‌دهندگان هر دو سوی این مناقشه را در یکی از رقابتی‌ترین انتخابات پیش‌ رو در ماه نوامبر به تحرک واداشته است. رقابت سخت و نفس‌گیر بر سر کرسی خالی سنای میشیگان نقشی تعیین‌کننده در مشخص کردن این دارد که کدام حزب در باقی‌مانده دوران ریاست‌جمهوری ترامپ کنترل کنگره را در دست خواهد داشت. دموکرات‌ها برای حفظ این کرسی می‌جنگند و جمهوری‌خواهان در پی تصاحب آن هستند. با این حال، در آستانه روز رای‌گیری، نتیجه رقابت همچنان غیرقابل پیش‌بینی و شانه‌به‌شانه به نظر می‌رسد. در یک سوی رقابت، عبدل السید، پزشک و نامزد دموکرات، قرار دارد که اگر در ۳ نوامبر انتخاب شود، نخستین سناتور مسلمان آمریکا خواهد بود. او بارها عملیات نظامی اسرائیل در غزه پس از حملات ۷ اکتبر ۲۰۲۳ حماس و دیگر گروه‌های مسلح فلسطینی را «نسل‌کشی» توصیف کرده است، اتهامی که اسرائیل به‌شدت رد می‌کند. عبدل السید در انتخابات مقدماتی با اختلافی اندک یک دموکرات حامی اسرائیل را شکست", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/3b1c/live/ab230d00-d3ad-11f1-b441-2b33b063138f.jpg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۰ آبان • ۰۲:۳۴"}, {"source": "Iran International", "title": "سرقت از خانه مدافع رئال مادرید، همزمان با ال‌کلاسیکو", "link": "https://www.iranintl.com/202610317955", "summary": "روزنامه ال‌موندو روز شنبه گزارش داد که همزمان با بازی رئال ماد ی حاشیه اجلاس گروه ۲۰ در آتلانتا گفت: «اگر تصمیم بگیریم، می‌توانیم به اهداف نظامی خود دست پیدا کنیم. رییس‌جمهور هنوز تصمیمی نگرفته و امروز هم اعلام تازه‌ای در این زمینه ندارم. ما هیچ‌یک از این موضوعات را ساده نمی‌گیریم.» وزیر خارجه آمریکا افزود ترامپ راه‌حل دیپلماتیک را ترجیح می‌دهد، اما واشینگتن در صورت نیاز توانایی انجام عملیات نظامی را دارد. او گفت: «ترجیح ما این است که این مساله از راه مسالمت‌آمیز حل شود.» روبیو در ادامه با اشاره به مواضع جمهوری اسلامی در قبال تنگه هرمز و کشورهای منطقه گفت تهران عملا تهدید می‌کند که اگر به خواسته‌هایش نرسد، نه‌تنها کشتی‌ها را منفجر خواهد کرد، بلکه زیرساخت‌های انرژی کشورهای همسایه و سراسر منطقه را نیز هدف قرار می‌دهد. او با انتقاد از این رویکرد گفت نباید چنین تهدیدهایی به رفتاری عادی تلقی شوند. وزیر خارجه آمریکا در بخش دیگری از سخنانش گفت جمهوری اسلامی به‌روشنی نشان داده که به‌دنبال تبدیل شدن به قدرتی دارای سلاح هسته‌ای است و نباید اجازه داد چنین اتفاقی رخ دهد. او همچنین حکومت ایران را عامل اصلی بی‌ثباتی در خاورمیانه دانست. روبیو با اشاره به نقش جمهوری اسلامی در تحولات منطقه گفت بی‌ثباتی در لبنان ناشی از حمایت تهران از حزب‌الله است، حملات به عربستان سعودی به حمایت ایران از حوثی‌ها ارتباط دارد و شبه‌نظامیان مورد حمایت جمهوری اسلامی در عراق نیز حکومت این کشور را به چالش می‌کشند. او افزود: «به هر طرف که نگاه کنید، یکی از نیروهای نیابتی ایران را می‌بینید که صلح و ثبات خاورمیانه را تضعیف می‌کند.» روبیو همچنین با اشاره به سرکوب اعتراضات در ایران، جمهوری اسلامی را حکومتی توصیف کرد که مردم خود را قتل‌عام", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B4_Enbw__v1024x512__box_0%2C204%2C2048%2C1280.jpeg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۹ آبان • ۲۱:۰۴"}, {"source": "Euronews Persian", "title": "مسئول سیاست خارجی اتحادیه اروپا: لاوروف در نشست‌های گروه ۲۰ «دروغ‌های زیادی» گفت", "link": "https://parsi.euronews.com/2026/10/31/eu-foreign-policy-chief-lavrov-told-many-lies-at-g20-meetings", "summary": "کایا کالاس، سرگئی لاوروف، را متهم کرد که در جریان گفت‌وگوهای روز جمع د». او یکی از نگرانی‌های اصلی واشینگتن را تلاش جمهوری اسلامی برای دستیابی به سلاح هسته‌ای عنوان کرد و گفت دولت ترامپ هرگز اجازه نخواهد داد ایران به چنین سلاحی دست یابد. این اظهارات در حالی بیان می‌شود که عباس عراقچی، وزیر خارجۀ ایران، روز شنبه در گفت‌وگو با شبکۀ الجزیره اعلام کرد تهران فعلاً نیازی به دیدار با مقام‌های آمریکایی نمی‌بیند و تنها پس از موافقت واشینگتن با شروط جمهوری اسلامی، دربارۀ مستقیم یا غیرمستقیم بودن مذاکرات تصمیم خواهد گرفت. عراقچی همچنین تأیید کرد که هیئتی ایرانی برای ادامۀ رایزنی‌ها به دوحه اعزام شده است.", "image_url": "https://gdb.rferl.org/7713b4e1-99e9-46fd-b0a4-ad692e3ee8b9_cx6_cy5_cw89_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۹ آبان • ۲۱:۰۳"}, {"source": "IranWire", "title": "اموال مالک آموزشکده اینورس به‌ اتهام «اهانت به شیعیان» مصادره می‌شود", "link": "https://iranwire.com/fa/news-1/159628-%D8%A7%D9%85%D9%88%D8%A7%D9%84-%D9%85%D8%A7%D9%84%DA%A9-%D8%A2%D9%85%D9%88%D8%B2%D8%B4%DA%A9%D8%AF%D9%87-%D8%A7%DB%8C%D9%86%D9%88%D8%B1%D8%B3-%D8%A8%D9%87-%D8%A7%D8%AA%D9%87%D8%A7%D9%85-%D8%A7%D9%87%D8%A7%D9%86%D8%AA-%D8%A8%D9%87-%D8%B4%DB%8C%D8%B9%DB%8C%D8%A7%D9%86-%D9%85%D8%B5%D8%A7%D8%AF%D8%B1%D9%87-%D9%85%DB%8C%D8%B4%D9%88%D8%AF/", "summary": "خبرگزاری فارس، وابسته به سپاه پاسداران انقلاب اسلامی، گزارش داد، اموال آموزشکده هنری اینورس و علیرضا اردوبادی، بنیان‌گذار این مجموعه، تو ...", "date_str": "2026-10-31T16:08:55+00:00", "hash": "766e8fff8da91469", "title_fa": "اموال مالک آموزشکده اینورس به‌ اتهام «اهانت به شیعیان» مصادره می‌شود", "summary_fa": "خبرگزاری فارس، وابسته به سپاه پاسداران انقلاب اسلامی، گزارش داد، اموال آموزشکده هنری اینورس و علیرضا اردوبادی، بنیان‌گذار این مجموعه، تو ... فارس اتهام‌های علیرضا اردوبادی را «تبلیغ علیه نظام» و «اهانت به شیعیان» عنوان کرده است. آموزشکده اینورس با انتشار اطلاعیه‌ای در شبکه‌های اجتماعی اعلام کرد که در پی اقدامات قضایی، اموال این مجموعه توقیف شده و تمامی حساب‌های بانکی و درگاه پرداخت آن مسدود شده‌اند. وب‌سایت این آموزشکده نیز فیلتر شده و روند مصادره اموال آن ادامه دارد. خبرگزاری فارس، رسانه نزدیک به نهادهای امنیتی، روز شنبه نهم آبان با انتشار گزارشی با عنوان «توقیف اموال مالک آموزشکده اینورس به دلیل اقدام علیه امنیت ملی»، از توقیف اموال علیرضا اردوبادی خبر داد. فارس مدعی شد اردوبادی در صفحات شخصی خود در شبکه‌های اجتماعی مطالبی منتشر کرده که مصداق «اهانت به شیعیان» و «تبلیغ علیه نظام» است. این خبرگزاری همچنین به اجرای دستورهای قضایی برای شناسایی و توقیف اموال برخی افراد در چارچوب قانون تشدید مجازات جاسوسی و همکاری با اسراییل علیه امنیت و منافع ملی اشاره کرد، اما توضیحی درباره اتهامات رسمی اردوبادی، مرجع قضایی رسیدگی‌کننده و مستندات پرونده او ارائه نداد. آموزشکده اینورس اعلام کرده است که مسدود شدن حساب‌های بانکی و درگاه پرداخت، فروش دوره‌های آموزشی این مجموعه را متوقف کرده است. با این حال، هنرجویانی که پیش‌تر دوره‌های آموزشی را خریداری کرده‌اند، همچنان به محتوای آموزشی و خدمات پشتیبانی دسترسی دارند. علیرضا اردوبادی نیز در واکنش به این اقدامات گفته است که اینورس تاکنون محتوای سیاسی منتشر نکرده و برخورد قضایی با این مجموعه آموزشی به دلیل مواضع شخصی او صورت گرفته است. او در بخشی از واکنش خود نوشت: «حق کار کردن، یاد گرفتن و زندگی کردن هیچ‌کس نباید به ساکت ماندنش وابسته باشد. مساله‌شان با من است و دارند هزینه‌اش را از مدرسه و آدم‌هایش می‌گیرند.»", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B4_Iznm__v1024x512__box_102%2C0%2C1200%2C576.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۹ آبان • ۱۹:۳۸"}, {"source": "IranWire", "title": "آسوشیتدپرس: حملات ایران به پایگاه‌های آمریکا میلیاردها دلار خسارت به بار آورد", "link": "https://iranwire.com/fa/news-1/159629-%D8%A2%D8%B3%D9%88%D8%B4%DB%8C%D8%AA%D8%AF%D9%BE%D8%B1%D8%B3-%D8%AD%D9%85%D9%84%D8%A7%D8%AA-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%A8%D9%87-%D9%BE%D8%A7%DB%8C%DA%AF%D8%A7%D9%87%D9%87%D8%A7%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D9%85%DB%8C%D9%84%DB%8C%D8%A7%D8%B1%D8%AF%D9%87%D8%A7-%D8%AF%D9%84%D8%A7%D8%B1-%D8%AE%D8%B3%D8%A7%D8%B1%D8%AA-%D8%A8%D9%87-%D8%A8%D8%A7%D8%B1-%D8%A2%D9%88%  «تصرف قهری» دادگاه قانون اساسی متهم کرد", "summary_fa": "رئیس‌جمهور لهستان پس از تعلیق رئیس دادگاه قانون اساسی، دولت توسک را به «تصرف قهری» این نهاد متهم کرد؛ اتهامی که نخست‌وزیر آن را در چارچوب تلاش برای احیای حاکمیت قانون رد می‌کند. کارول ناوروتسکی، رئیس‌جمهور لهستان، در پی تعلیق رئیس دادگاه قانون اساسی این کشور توسط متحدان دونالد توسک، نخست‌وزیر، دولت او را به «تصرف قهری» عالی‌ترین نهاد قضایی مسئول نظارت بر قانون اساسی متهم کرد. ناوروتسکی روز شنبه ۹ آبان در بیانیه‌ای که یکی از دستیارانش مقابل ساختمان دادگاه قرائت کرد، گفت: «دیشب نظم عمومی در جمهوری لهستان نقض شد و یک نهاد قانون اساسی به‌زور تصرف شد.» این اظهارات پس از آن بیان شد که دادگاه قانون اساسی لهستان شامگاه جمعه اعلام کرد آنا کوروین-پیوتروفسکا، باسابقه‌ترین قاضی این نهاد، بوگدان شویچکوفسکی، رئیس دادگاه و از منصوبان دولت ملی‌گرای پیشین، را تعلیق کرده و خود ادارۀ دادگاه را بر عهده گرفته است. ناوروتسکی که از متحدان حزب ملی‌گرای «قانون و عدالت» است، پس از اطلاع از این تحول، سفر خود به سنگال را نیمه‌کاره گذاشت و به لهستان بازگشت. او پس از بازگشت مستقیماً به ساختمان دادگاه رفت؛ جایی که صدها معترض با حضور گستردۀ نیروهای پلیس ضدشورش، خواستار بازگشت رئیس تعلیق‌شدۀ دادگاه به سمت خود بودند. در ویدئویی که ماچی بریک، از قضات منصوب‌شده به دادگاه قانون اساسی و از متحدان دونالد توسک، در شبکه‌های اجتماعی منتشر کرده، کارول ناوروتسکی، رئیس‌جمهور لهستان، به همراه همراهانش دیده می‌شود که با کنار زدن افرادی که مانع ورود به ساختمان دادگاه شده‌اند، وارد آن می‌شود. آنا کوروین-پیوتروفسکا، قاضی‌ای که دستور تعلیق رئیس دادگاه را صادر کرده، نیز در میان این افراد حضور دارد. رئیس‌جمهور لهستان همچنین خواستار رایزنی‌های فوری سیاسی برای رسیدگی به بحران شد. در مقابل، دونالد توسک، نخست‌وزیر لهستان، از اقدامات دولت خود دفاع کرد و گفت هدف آن بازگرداندن حاکمیت قانون به دستگاه قضایی است.", "image_url": "https://gdb.rferl.org/d12832e7-ad74-47bc-9f28-65159cbdfb81_cx0_cy10_cw0_w1200_h630.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۹ آبان • ۱۸:۴۶"}, {"source": "IranWire", "title": "عراقچی: در شرایط کنونی نیازی م", "summary_fa": "چیزهای کمی آزاردهنده تر از یک صفحه نمایش لمسی بی پاسخ هستند. قبل از اینکه تلفن خود را رها کنید، در اینجا چیزی است که باید سعی کنید آن را دوباره کار کنید. Zeynepkaya/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover دلایل متعددی وجود دارد که باعث می‌شود صفحه نمایش گوشی شما به لمس شما پاسخ ندهد. گاهی اوقات این یک چیز ساده است، مانند مسدود شدن یک برنامه. مواقع دیگر، چیز جدی‌تری است، مانند افتادن گوشی شما وقتی می‌خواهید آن را از جیب خود بیرون بیاورید (همه ما آنجا بوده‌ایم). صرف نظر از «چرا»، اغلب اوقات، یک راه حل ساده می تواند بهترین دوست جیب شما را برای جلسه اسکرول بعدی شما آماده کند. نحوه رفع مشکل به این بستگی دارد که چرا در وهله اول اتفاق افتاده است. به عنوان مثال، اگر علت خرابی یک برنامه باشد، راه اندازی مجدد می تواند این کار را انجام دهد. اگر تعجب می کنید، مسدود شدن یا خراب شدن برنامه می تواند باعث شود صفحه نمایش شما پاسخ ندهد زیرا ورودی لمسی شما باید از پردازنده عبور کند تا به برنامه برسد. یک تصادف می تواند زنجیره های آن عملیات را مسدود کند و روند را متوقف کند. فقط برای واضح بودن، هر صفحه نمایشی که پاسخگو نیست یک مشکل نرم افزاری نیست. برخی نیاز به تعمیر حرفه ای دارند. Da Bali/Getty Images اگر صفحه نمایش تلفن شما به طور ناگهانی به لمس پاسخ نمی دهد، با بررسی آن از نظر ترک یا آسیب های دیگر شروع کنید. اگر موردی را مشاهده کردید، احتمالاً با مشکل سخت افزاری سروکار دارید، نه نرم افزاری. در مرحله بعد، محافظ صفحه را بردارید، زیرا می تواند آسیب را پنهان کند و همچنین می تواند دلیل عدم پاسخگویی صفحه نمایش شما باشد. اگر دستکش می پوشید، آن را در بیاورید. آنچه در اطراف", "image_url": "https://www.engadget.com/img/gallery/how-to-fix-your-phone-screen-when-its-unresponsive-to-touch/l-intro-1793286831.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "تراشه"], "datetime_fa": "۹ آبان • ۲۰:۳۰"}, {"source": "Zoomit", "title": "اسپاتیفای با سرویس ریمیکس موسیقی هوشمند، درآمد خود را افزایش می‌دهد", "link": "https://www.zoomit.ir/software-news/470158-spotify-ai-music-remix-tool/", "summary": "اسپاتیفای در تدارک انتشار ابزاری با هوش مصنوعی تا اوایل ۲۰۲۷ است که امکان بازخوانی و ریمیکس قطعات را به کاربران می‌دهد.", "date_str": "2026-10-31T17:40:00+00:00", "hash": "d99321f63a52c43d", "title_fa": "اسپاتیفای با سرویس ریمیکس موسیقی هوشمند، درآمد خود را افزایش می‌دهد", "summary_fa": "اسپاتیفای در تدارک انتشار ابزاری با هوش مصنوعی تا اوایل ۲۰۲۷ است که امکان بازخوانی و ریمیکس قطعات را به کاربران می‌دهد. تبلیغات پلتفرم اسپاتیفای قصد دارد اوایل سال ۲۰۲۷ از سرویس جدیدی با هوش مصنوعی رونمایی کند که به مشترکان امکان می‌دهد بازخوانی‌ها و ریمیکس‌های اختصاصی خود را از قطعات موسیقی تولید کنند. سازندگان در حال مذاکره برای دریافت مجوزهای لازم و متقاعد کردن هنرمندان جهت بهره‌گیری از فناوری مذکور هستند. به روایت فایننشال تایمز ، راه‌اندازی این قابلیت برای سه‌ماهه‌ی نخست سال آینده با احتمال رونمایی هم‌زمان با مراسم جوایز گرمی در بهمن و اسفند برنامه‌ریزی شده است. گزارش‌ها نشان می‌دهد دسترسی به این ابزار ماهانه ۴ تا ۵ دلار هزینه‌ی اضافی برای مشترکان در پی خواهد داشت، گرچه زمان‌بندی و مبالغ یادشده هنوز نهایی نیستند. قابلیت مورد بحث به کاربران پولی اجازه می‌دهد قطعات نامدار را بازآفرینی کنند؛ برای نمونه، ترانه‌ای فولک را به یک قطعه‌ی موسیقی الکترونیک تبدیل کنند یا صدای خواننده‌ای را روی اثر دیگری قرار دهند. برخلاف ابزارهایی مانند Suno که صرفا بر پایه‌ی متن آهنگ جدید می‌سازند، سازوکار اسپاتیفای امکان دستکاری ترانه‌های موجودِ هنرمندان همکار را فراهم می‌آورد. اسپاتیفای قراردادهایی با Universal Music Group، گروه مرلین و شرکت فرانسوی Believe امضا کرده، در حالی که مذاکره با شرکت‌های سونی موزیک و وارنر موزیک همچنان ادامه دارد. حضور در این طرح حتی در صورت توافق ناشران موسیقی اختیاری خواهد بود و جلب نظر ستاره‌های امروزی سخت‌تر از هنرمندان قدیمی‌تر گزارش می‌شود. برخی هنرمندان جوان مخالفت علنی خود را با فناوری مذکور نشان داده‌اند. اولیویا رودریگو، خواننده سرشناس، گفت: «من هرگز چنین کاری نخواهم کرد. قطعا نه. موضع بسیار سرسختی در این زمینه دارم.» مدیران بر این باورند که عواید حاصل از ریمیکس‌ها نصیب پدیدآورندگان اصلی می‌شود و پخش آنها در رتبه‌بندی‌های رسمی ترانه‌ها محاسبه خواهد شد.", "image_url": "https://api2.zoomit.ir/media/2022-3-samsung-galaxy-a53-sporify-652d0449eb21a6b54f50673f?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۹ آبان • ۲۱:۱۰"}, {"source": "Zoomit", "title": "شناسایی نوعی سلول ایمنی که مرگبارترین سرطان ریه را نابود می‌کند", "link": "https://www.zoomit.ir/health-medical/470139-gamma-delta-t-cells-lung-cancer/", "summary": "کشف توانایی سلول‌های ایمنی کمترشناخته‌شده در نابودی سرطان ریه، مسیر تازه‌ای برای توسعه‌ی درمان‌های مؤثرتر علیه این بیماری تهاجمی باز کرده است.", "date_str": "2026-10-31T17:25:00+00:00", "hash": "fa2fe590a2bbe247", "title_fa": "شناسایی نوعی سلول ایمنی که مرگبارترین سرطان ریه را نابود می‌کند", "summary_fa": "کشف توانایی سلول‌های ایمنی کمترشناخته‌شده در نابودی سرطان ریه، مسیر تازه‌ای برای توسعه‌ی درمان‌های مؤثرتر علیه این بیماری تهاجمی باز کرده است. تبلیغات سرطان ریه سلول کوچک (SCLC) از تهاجمی‌ترین انواع سرطان است و کمتر از هفت درصد بیماران مبتلا به آن، پنج سال پس از تشخیص بیماری زنده می‌مانند. یکی از دلایل دشواری درمان این سرطان، توانایی سلول‌های سرطانی در فرار از شناسایی دستگاه ایمنی است و همین ویژگی‌ باعث می‌شود برخی روش‌های ایمنی‌درمانی اثربخشی محدودی داشته باشند. به‌گزارش ساینس‌آلرت ، گروهی بین‌المللی از پژوهشگران به سرپرستی دانشمندان مؤسسه‌ی تحقیقات پزشکی والتر و الیزا هال (WEHI) در استرالیا، دریافتند نوعی سلول ایمنی به نام سلول T گاما دلتا می‌تواند سلول‌های سرطان ریه سلول کوچک را شناسایی کند و از بین ببرد. آزمایش‌ها همچنین نشان دادند که ترکیب این سلول‌ها با دو داروی موجود، توانایی آن‌ها را برای مقابله با سرطان به‌طور قابل‌توجهی افزایش می‌دهد. سرنخ اولیه‌ی پژوهش از بررسی داده‌های دو کارآزمایی بالینی بزرگ به نام‌های IMpower133 و CASPIAN به دست آمد. پژوهشگران متوجه شدند بیمارانی که تومورهایشان تعداد بیشتری سلول T گاما دلتا داشت، معمولاً پاسخ بهتری به ایمنی‌درمانی نشان می‌دادند. کیت ساترلند، زیست‌شناس مولکولی و از پژوهشگران مطالعه، می‌گوید این یافته‌ها از قوی‌ترین شواهدی هستند که نشان می‌دهند سلول‌های T گاما دلتا در تومورهای سرطان ریه سلول کوچک حضور دارند و احتمالاً می‌توانند با بیماری مبارزه کنند. ترکیب سلول‌های T گاما دلتا s": ["Google"], "datetime_fa": "۹ آبان • ۱۹:۴۵"}, {"source": "Engadget", "title": "NASA's second year-long Mars simulation mission ends today", "link": "https://www.engadget.com/2303277/nasa-second-year-long-mars-simulation-mission-ends-today/", "summary": "The second crew that spent a year inside NASA s simulated Mars habitat is emerging today, and the agency will stream it live.", "date_str": "2026-10-31T16:07:17+00:00", "hash": "17ccc87930884508", "title_fa": "دومین ماموریت شبیه سازی مریخ ناسا امروز به پایان می رسد", "summary_fa": "دومین خدمه ای که یک سال را در زیستگاه شبیه سازی شده مریخ ناسا سپری کرده اند، امروز در حال ظهور است و آژانس آن را به صورت زنده پخش خواهد کرد. آژانس پخش زنده این رویداد را از ساعت 15:00 به وقت شرقی پخش خواهد کرد. NASA Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover مجموعه دوم داوطلبان ماموریت Crew Health and Performance Exploration Analog (CHAPEA) پس از 378 روز از زیستگاه ساختگی ناسا در مریخ خارج می شوند. ناسا از امروز ساعت 15:00 به وقت شرقی، این رویداد را به صورت زنده در یوتیوب و در حساب های رسانه های اجتماعی خود پخش خواهد کرد. راس الدر، متیو مونتگومری، الن الیس و جیمز اسپایسر در 19 اکتبر 2025 به عنوان بخشی از خدمه ماموریت CHAPEA 2 وارد زیستگاه شدند. آنها بیش از یک سال در داخل یک مرکز 1700 فوت مربعی پرینت سه بعدی در محوطه جانسون ناسا در هیوستون، تگزاس زندگی کردند و عملیات ماموریت مریخ را درست در اینجا روی زمین انجام دادند. آنها پیاده روی های فضایی را شبیه سازی کردند، نگهداری زیستگاه را انجام دادند و گیاهان را پرورش دادند. خدمه حتی باید از یک قفل هوایی عبور کنند تا زیستگاه را ترک کنند. علاوه بر انزوا، شرکت‌کنندگان در معرض استرس‌های دیگری مانند تأخیرهای ارتباطی و محدودیت منابع قرار گرفتند. ناسا در سال 2023 شروع به جستجوی داوطلبان برای مأموریت های CHAPEA کرد و اولین خدمه در ژوئن همان سال وارد زیستگاه شدند. آژانس قبلاً پذیرش درخواست‌ها برای آنالوگ اکتشاف ماه و مریخ را برای تجربه یک ساله دیگری که عناصر CHAPEA را با دیگر تجربیات شبیه‌سازی فضایی ناسا ترکیب می‌کند، آغاز کرده است. این ماموریت زودتر از اوت 2027 آغاز نخواهد شد. ناسا می گوید داده های این ماموریت ها می تواند به آن کمک کند تا طراحی سیستم غذایی را", "image_url": "https://www.engadget.com/img/gallery/nasas-second-year-long-mars-simulation-mission-ends-today/l-intro-1793462639.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۹ آبان • ۱۹:۳۷"}, {"source": "Engadget", "title": "GNSS Vs GPS: What's the difference?", "link": "https://www.engadget.com/2300262/gnss-vs-gps-differences/", "summary": "GNSS and GPS are common terms in the world of satellite navigation. They may be similar, but there are some key differences between the two technologies.", "date_str": "2026-10-31T16:00:00+00:00", "hash": "1fc9fca35a940672", "title_fa": "GNSS در مقابل GPS: تفاوت چیست؟", "summary_fa": "GNSS و GPS اصطلاحات رایج در دنیای ناوبری ماهواره ای هستند. آنها ممکن است مشابه باشند، اما تفاوت های کلیدی بین این دو فناوری وجود دارد. تلفن شما احتمالاً از جی‌پی‌اس بیشتر استفاده می‌کند تا بفهمد کجا هستید. این دو ارتباط تنگاتنگی با هم دارند، همانطور که آیفون نوعی گوشی هوشمند است. GNSS مخفف Global Navigation Satellite System است که یک اصطلاح گسترده برای هر سیستم ناوبری ماهواره ای از جمله GPS است. ناسا آن را به عنوان ارائه «موقعیت مکانی مستقل» توصیف می کند زیرا، البته، آنها این کار را انجام می دهند. مهمترین نکته این است که GPS، همانطور که برای همه آشنا است، صرفاً نوعی GNSS است، به ویژه سیستم ناوبری ماهواره ای ایالات متحده. به همین جا ختم نمی شود. دیگر صورت های فلکی مهم GNSS شامل گلوناس روسیه، گالیله اتحادیه اروپا، NavIC هند و BeiDou چین است. QZSS ژاپن سیستم های ناوبری را در منطقه خود تکمیل می کند. به نظر می رسد هرکسی چیزهای خاص خود را دارد، اگرچه این سیستم ها محدود به کشورهای خودشان نیستند. به عنوان مثال، GPS در سراسر جهان کار می کند، مانند سیستم هایی که توسط روسیه، اتحادیه اروپا و چین اداره می شوند. نام ها فقط نشان دهنده این است که چه کسی آنها را اداره می کند، نه جایی که یک تلفن هوشمند می تواند از آنها استفاده کند. مردم اغلب از \"GPS\" به عنوان یک ابزار مهم برای هر سرویس مکان یابی مبتنی بر ماهواره استفاده می کنند زیرا GPS به سادگی به معروف ترین اصطلاح تبدیل شد. بنابراین، اگر به برگه مشخصات یک دستگاه نگاه می‌کنید و این دستگاه را به‌عنوان قابلیت GNSS توصیف می‌کند، می‌تواند به این معنا باشد که دستگاه می‌تواند از ماهواره‌های GPS فقط ایالات متحده استفاده کند.", "image_url": "https://www.engadget.com/img/gallery/gnss-vs-gps-whats-the-difference/l-intro-1793018949.jpg", "category": "موبایل و گجت‌ها", "tags": ["Google", "Apple"], "datetime_fa": "۹ آبان • ۱۹:۳۰"}, {"source": "Zoomit", "title": "حشرات جذب چراغ نمی‌شوند؛ پس چرا دور آن می‌چرخند؟", "link": "https://www.zoomit.ir/biology/470192-why-insects-fly-around-lights/", "summary": "حشرات به نور جذب نمی‌شوند، اما چرا دور چراغی که روشن است، پر از حشره می‌شود؟", "date_str": "2026-10-31T16:40:00+00:00", "hash": "be3eee101756030c", "title_fa": "حشرات جذب چراغ نمی‌شوند؛ پس چرا دور آن می‌چرخند؟", "summary_fa": "حشرات به نور جذب نمی‌شوند، اما چرا دور چراغی که روشن است، پر از حشره می‌شود؟ تبلیغات احتمالاً بارها دیده‌اید که شب‌ها حشرات به‌جای دورشدن از چراغ، ساعت‌ها دور آن پرواز می‌کنند؛ گاهی مسیرشان آن‌قدر عجیب می‌شود که انگار راه خروج را گم کرده‌اند. برخلاف تصور رایج، پژوهشگران می‌گویند حشرات لزوماً به‌سمت نور کشیده نمی‌شوند؛ بلکه نور مصنوعی ممکن است سیستم جهت‌یابی و کنترل پرواز آن‌ها را مختل کند. مطالعه‌ای منتشرشده در نشریه‌ی نیچر کامیونیکیشنز ، با بررسی مسیر پرواز حشرات در محیط طبیعی و آزمایشگاهی، توضیح تازه‌ای برای این رفتار ارائه می‌دهد. محققان با استفاده از دوربین‌های پرسرعت و ثبت سه‌بعدی حرکات، دریافتند حشرات هنگام نزدیک‌شدن به منابع نور مصنوعی، معمولاً مستقیماً به‌سمت چراغ پرواز نمی‌کنند؛ بلکه پشت بدنشان را به سمت روشنایی می‌چرخانند و در مسیری تقریباً عمود بر منبع نور حرکت می‌کنند. کپی لینک چراغ چگونه مسیر پرواز حشرات را به هم می‌ریزد؟ برای حفظ تعادل هنگام پرواز، بسیاری از حشرات از روشن‌ترین بخش محیط به‌عنوان نشانه‌ای برای تشخیص جهت بالا استفاده می‌کنند. در طبیعت، روشن‌ترین بخش آسمان معمولاً بالای سر آن‌ها قرار دارد؛ بنابراین حشرات با قراردادن سطح پشتی بدنشان رو به روشنایی، می‌توانند وضعیت بدن را تنظیم و تعادل پرواز را حفظ کنند. پژوهشگران این رفتار را «پاسخ به ن {"source": "Business Insider", "title": "I spent $26,000 coloring my hair over the years. I'm finally going gray, and I wish I'd done it sooner.", "link": "https://www.businessinsider.com/stopped-dyeing-hair-after-decades-going-gray-2026-10", "summary": "Westend61/Getty Images I started dyeing my hair in my 40s after seeing a photo of myself that made me look tired. Over the decades, I spent an estimated $26,000 on hair color and touch-ups every six weeks. I finally decided to embrace my gray after meeting women my age who looked beautiful naturally. My mother had the most gorgeous hair . It was a deep, rich red that looked more like Bordeaux than carrots. My favorite photograph of her is from her modeling days when she posed as one of the original Breck girls. Three of my four grandparents were redheads . My grandmothers had the more common copper color. It was my mother's father who passed down the auburn and my other grandfather's black hair that fated my cousins and me to our very dark brown. In my family, hair was a frequent topic of conversation. For my mother, in her later years, the talk often focused on how hers wasn't turning gray. I never questioned her claim that she was miraculously maintaining her original color , even though it seemed a little incredible that no wispy whites were visible on her 60+-year-old head, while silver streaks started multiplying on mine in my early 40s. My new lighter strands didn't bother me. In fact, I liked them. I thought they added dimension to my flat brown until I looked at a photo of myself and saw a sad, tired woman. I colored my hair because I was curious Maybe I was tired because at 42, I'd become a single mother of five children ranging in age from 8 months to 16 years. Or maybe it was just natural selection. My father started to turn gray in his late 30s. No matter the reason, I decided to abandon my defiant stance of aging naturally and color my hair . I was curious about the process and what the results might be. For years, I booked appointments every six weeks, investing hundreds of dollars in dye jobs and touch-ups. I estimate that over the decades, I've spent about $26,000. But the color never felt authentic. At each visit, I told my stylist to be honest with me when I was too old to keep this up. There's nothing less attractive than an older woman with a head full of unnaturally dark hair. My dyed hair looked weird in photos I hate how artificial my hair looks in our family photos . Everyone else has soft brown, but mine looks harsh. That made me start to consider solutions like leaving a few of the pieces around my face gray. My stylist thought I was nuts, so we compromised with different formulas, but I still wasn't satisfied. It was a confluence", "date_str": "2026-10-31T15:38:01+00:00", "hash": "73a3dac871699b70", "title_fa": "من در طول این سال ها 26000 دلار برای رنگ کردن موهایم خرج کردم. بالاخره دارم خاکستری می شوم و ای کاش زودتر این کار را می کردم.", "summary_fa": "Westend61/Getty Images من در 40 سالگی پس از دیدن عکسی از خودم که باعث خستگی من شد شروع به رنگ کردن موهایم کردم. در طول دهه‌ها، من هر شش هفته یکبار حدود 26000 دلار برای رنگ مو و اصلاح آن هزینه کردم. سرانجام پس از آشنایی با زنان هم سن و سال خود که به طور طبیعی زیبا به نظر می رسیدند، تصمیم گرفتم خاکستری خود را در آغوش بگیرم. مادرم زیباترین موها را داشت. رنگ قرمز پررنگ و عمیقی بود که بیشتر شبیه بوردو بود تا هویج. عکس مورد علاقه من از او مربوط به روزهای مدلینگ اوست که به عنوان یکی از دختران اصلی برک ژست گرفته است. سه تا از چهار پدربزرگ و مادربزرگ من مو قرمز بودند. مادربزرگ‌های من رنگ مسی رایج‌تری داشتند. این پدر مادرم بود که موهای سیاه و سفید پدربزرگ دیگرم را به رنگ قهوه‌ای تیره‌مان منتقل کرد. در خانواده من، مو موضوع مکرر گفتگو بود. برای مادرم، در سال‌های آخر زندگی، صحبت‌ها اغلب بر این بود که چگونه مادرم خاکستری نمی‌شد. من هرگز ادعای او را مبنی بر اینکه به طور معجزه آسایی رنگ اصلی خود را حفظ می کرد زیر سوال نبردم، حتی اگر کمی باورنکردنی به نظر می رسید که هیچ رنگ سفیدی روی سر 60+ ساله او دیده نمی شد، در حالی که رگه های نقره در اوایل 40 سالگی من شروع به تکثیر روی سر من کردند. رشته های سبک تر جدیدم آزارم نمی داد. در واقع من آنها را دوست داشتم. فکر کردم آنها به رنگ قهوه ای صاف من بعد اضافه کردند تا اینکه به عکسی از خودم نگاه کردم و زنی غمگین و خسته را دیدم. من موهایم را رنگ کردم چون کنجکاو بودم شاید خسته بودم چون در 42 سالگی مادر تنها 5 فرزند از 8 ماهگی تا 16 سالگی شدم. یا شاید فقط", "image_url": "https://i.insider.com/6ad78b05e50b02f612be534b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۹ آبان • ۱۹:۰۸"}, {"source": "Business Insider", "title": "I paid $1.6 million for the Lizzie Borden House. I wasn't prepared for what I found inside.", "link": "https://www.businessinsider.com/living-lalaurie-mansion-new-orleans-haunted-house-2026-10", "summary": "Lance Zaal owns several properties in the US. Courtesy of Lance Zaal Lance Zaal lives in the LaLaurie Mansion, a reportedly haunted property in New Orleans. His foray into ghostly properties began when he purchased the Lizzie Borden house in 2021. He wants these properties to highlight history, not just the paranormal, he says. This as-told-to essay is based on a conversation with Lance Zaal, president of US Ghost Adventures . Zaal was the subject of a recent Business Insider story . It has been edited for length and clarity . When I heard that the Lizzie Borden House was for sale in 2021, I was immediately fascinated. Most people know the famous nursery rhyme: \" Lizzie Borden took an axe…\" But few know the history of the home where the crime occurred. They don't realize that the 1892 case was one of the earliest and most widespread use of crime scene photos. Or that Lizzie was tried by an all-male jury and quickly acquitted, with the case still unsolved . When I took over the property, those weren't the scariest details. What was more terrifying was the state of the place. There were rotten doors I could put my hands through, and a toxic workplace full of employees who couldn't stand each other. Too often, historic properties are treated as cash cows and not reinvested in. I take the opposite approach: I believe these buildings with difficult and uncomfortable histories need to be cared for and accessible to everyone. I started with food tours before buying haunted properties I never wanted to become an entrepreneur. When I lost my job in tech consulting, I planned to get another, but as I did that, I explored creating my own business: food tours. By 2014, I was making more money running tours than I had as a consultant. Over time, I realized that haunted tours had strong demand and started incorporating them into my company in various cities. Buying the Borden House for $1.6 million was a natural progression for my business — a way to venture into hospitality and have a brick-and-mortar space. Lance Zaal bought the Borden House for $1.6 million. Courtesy of Lance Zaal Since then, I've expanded into other properties with sordid pasts. My company owns the Villisca Axe Murders House — the Iowa home where eight people were killed in an unsolved attack — and the Welty House, the site of fierce fighting during the Battle of Gettysburg. Since 2024, I've lived in the LaLaurie Mansion, supposedly New Orleans' most haunted property. Highlighting history, not just ", "date_str": "2026-10-31T15:12:01+00:00", "hash": "6b380c32a2e3e230", "title_fa": "من 1.6 میلیون دلار برای خانه لیزی بوردن پرداخت کردم. من برای چیزی که در داخل پیدا کردم آماده نبودم.", "summary_fa": "لنس زال دارای چندین ملک در ایالات متحده است. با حسن نیت از لنس زال لنس زال در عمارت LaLaurie زندگی می کند، یک ملک خالی از سکنه در نیواورلئان. هجوم او به املاک ارواح با خرید خانه لیزی بوردن در سال 2021 آغاز شد. او می‌گوید که او می‌خواهد این املاک تاریخ را برجسته کنند، نه فقط ماوراء الطبیعه. این مقاله همانطور که گفته شد بر اساس گفتگو با لنس زال، رئیس US Ghost Adventures است. زال موضوع یک داستان اخیر Business Insider بود. برای طول و وضوح ویرایش شده است. وقتی شنیدم که خانه لیزی بوردن در سال 2021 برای فروش است، بلافاصله مجذوب شدم. اکثر مردم قافیه معروف مهد کودک را می شناسند: \"لیزی بوردن تبر گرفت...\" اما تعداد کمی از تاریخ خانه ای که جنایت در آن رخ داده است می دانند. آنها متوجه نیستند که پرونده 1892 یکی از اولین و گسترده ترین موارد استفاده از عکس های صحنه جرم بوده است. یا اینکه لیزی توسط هیئت منصفه کاملاً مرد محاکمه شد و به سرعت تبرئه شد و پرونده هنوز حل نشده بود. وقتی ملک را تصاحب کردم، اینها ترسناک ترین جزئیات نبودند. چیزی که وحشتناک تر بود وضعیت آن مکان بود. درهای پوسیده‌ای بود که می‌توانستم دستانم را از بین ببرم، و یک محل کار سمی پر از کارمندانی که نمی‌توانستند یکدیگر را تحمل کنند. اغلب اوقات، اموال تاریخی به عنوان گاوهای نقدی تلقی می شوند و در آنها سرمایه گذاری مجدد نمی شود. من رویکرد مخالف را در پیش می گیرم: من معتقدم این ساختمان ها با تاریخچه دشوار و ناراحت کننده نیاز به مراقبت دارند و برای همه قابل دسترسی هستند. من قبل از خرید ملک های جن زده با تورهای غذایی شروع کردم و هرگز نمی خواستم کارآفرین شوم. وقتی شغلم را در مشاوره فناوری از دست دادم، برنامه‌ریزی کردم که", "image_url": "https://i.insider.com/6ad78f3b2428f6b455814056?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۹ آبان • ۱۸:۴۲"}, {"source": "Business Insider", "title": "I took a round-trip ferry to a stunning island off the coast of California for $122. It was the perfect day trip.", "link": "https://www.businessinsider.com/took-trip-to-island-in-california-catalina-express-ferry-review-2026-10", "summary": "I took a trip to Catalina Island, located off the coast of Los Angeles. Allison Tibaldi I took the Catalina Express ferry to Catalina Island , a gorgeous spot off the coast of California. For $61 each way, I enjoyed an upgraded ferry experience with snacks and priority boarding. On the island, I had a great time exploring and taking a guided kayaking tour. When I recently flew out to Southern California to visit my two young-adult children, I had some time to myself while they were both busy working. So, I decided to plan a day trip to Catalina Island, a spot many travelers describe as a stunning locale with a European feel. One of the state's Channel Islands, Catalina is located about 22 miles off the coast of Los Angeles and is easy to reach by ferry. So, I decided to book the one-hour journey from Long Beach to Avalon, Catalina's main tourist hub, with Catalina Express. There were four departures scheduled that day, a Wednesday in October. I selected 9:50 a.m., the Goldilocks of departure times — not too early or too late. Luckily, I was even able to use my first-ever senior discount and secure $5 off my ticket. For $61 each way (after the discount), I booked an upgraded ticket with priority boarding , access to a special seating area called the Commodore lounge, a drink, and a snack. This was only about $20 more than I would've paid for a standard adult ticket, which I thought seemed like a solid value. Here's what the experience was like. I started my day at the Catalina Landing in Downtown Long Beach. Allison Tibaldi I arrived at the Catalina Express terminal in Long Beach an hour early. I gave myself ample time to get there, since I know how awful Los Angeles traffic can be. Luckily, plenty of indoor seating and clean restrooms made the wait pleasant, and I read the Los Angeles Times to pass the time. About 25 minutes before the ferry was set to depart, I heard the announcement that Commodore lounge passengers could go outside and board first. The process was easy and organized. The Commodore lounge wasn t crowded. Allison Tibaldi Upon entering the lounge, I saw individual packets of Chex Mix and chocolate-chip cookies in a basket. I took one of each and selected a padded window seat; I had the row to myself. The seats were wider than those offered in the standard class of tickets, and I thought they were comfortable. Then, a crew member came by with a drink menu. There were plenty of choices included in the price of the ticket, like beer, wine, coc", "date_str": "2026-10-31T15:07:01+00:00", "hash": "b81a5a4ca20eb01b", "title_fa": "من با یک کشتی رفت و برگشت به جزیره ای خیره کننده در سواحل کالیفرنیا با قیمت 122 دلار رفتم. این سفر یک روزه عالی بود.", "summary_fa": "من به جزیره کاتالینا، واقع در سواحل لس آنجلس سفر کردم. آلیسون تیبالدی I با کشتی کاتالینا اکسپرس به جزیره کاتالینا، نقطه ای زیبا در سواحل کالیفرنیا رفت. برای هر راه 61 دلار، از یک تجربه کشتی ارتقا یافته با تنقلات و سوار شدن با اولویت لذت بردم. در جزیره، با کاوش و شرکت در یک تور قایق سواری با راهنما، اوقات خوبی را سپری کردم. زمانی که اخیراً برای دیدار دو فرزند خردسالم به کالیفرنیای جنوبی پرواز کردم، زمانی که هر دو مشغول کار بودند، برای خودم وقت گذاشتم. بنابراین، تصمیم گرفتم برای یک سفر یک روزه به جزیره کاتالینا برنامه ریزی کنم، جایی که بسیاری از مسافران آن را محلی خیره کننده با حس اروپایی توصیف می کنند. کاتالینا، یکی از جزایر کانال این ایالت، در 22 مایلی ساحل لس آنجلس واقع شده است و دسترسی به آن با کشتی آسان است. بنابراین، تصمیم گرفتم سفر یک ساعته لانگ بیچ به آوالون، مرکز اصلی توریستی کاتالینا را با کاتالینا اکسپرس رزرو کنم. چهار حرکت در آن روز برنامه ریزی شده بود، یک چهارشنبه در اکتبر. من ساعت 9:50 صبح را انتخاب کردم، طلایی‌لاک ساعت‌های حرکت - نه خیلی زود و نه خیلی دیر. خوشبختانه، من حتی توانستم از اولین تخفیف سالمندانم استفاده کنم و 5 دلار تخفیف بلیط خود را تضمین کنم. به ازای 61 دلار در هر راه (بعد از تخفیف)، یک بلیط ارتقا یافته با اولویت سوار شدن، دسترسی به یک مکان مخصوص نشستن به نام سالن Commodore، یک نوشیدنی و یک میان وعده رزرو کردم. این فقط حدود 20 دلار بیشتر از مبلغی بود که من برای یک بلیط استاندارد بزرگسالان پرداخت می کردم، که فکر می کردم ارزش قابل قبولی به نظر می رسد. در اینجا تجربه چگونه بود. من روزم را در کاتالینا لندینگ در مرکز شهر لانگ بیچ آغاز کردم. آلیسون تیبالدی", "image_url": "https://i.insider.com/6ae4ea23f3bee449b3d29c1d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["تراشه"], "datetime_fa": "۹ آبان • ۱۸:۳۷"}, {"source": "Business Insider", "title": "Vintage photos show what London looked like 100 years ago", "link": "https://www.businessinsider.com/vintage-photos-london-century-ago-2020-7", "summary": "Flappers at the bar of a nightclub in London, circa 1925. General Photographic Agency/Getty Images A century ago, London was a bustling city, filled with culture and beautiful architecture. Poverty, however, remained an issue, with slum dwellings in parts of the city. Take a look at what life was like in London in the 1920s. Today, London is a bustling, metropolitan city, and the same could be said about the city 100 years ago . Like today, London was known for its attractions such as Piccadilly Circus, Buckingham Palace, and the River Thames. But many photos show parts of the city that are unrecognizable now. From the glamorous fashion all the way to the slum dwellings, take a look at these photos from 1920s London to see how much life has changed. An aerial shot of Trafalgar Square in London shows that parts of the city are still structurally the same 100 years later. DE AGOSTINI PICTURE LIBRARY/Getty Images In the early 1800s, the square was meant to be a cultural center of the city, and it officially got its name in 1830 after several transformations, according to the Greater London Authority . At the time, Trafalgar Square was the perfect place for children to frolic in fountains. Mirrorpix/Getty Images The fountains were built in 1845. Oxford Street no longer has any cars or buses. Fox Photos/Getty Images While Oxford Street remains lined with stores and restaurants, it has recently been pedestrianized. As of October, vehicles are no longer permitted to enter between Orchard Street and Great Portland Street. Piccadilly Circus had a similar scene of hustle and bustle 100 years ago. Topical Press Agency/Getty Images If you look closely, you can see the double-decker buses that are still popular today. Piccadilly Circus has always been a popular destination in London. Universal History Archive/Getty Images Piccadilly Circus was created in 1819, and by 1920, the area had become a popular crossroads. Today, it has become a tourist destination and a must-see when visiting London. There were even traffic jams on the bridges that stretched across the River Thames back in 1920. Fox Photos/Getty Images Today, there are 35 bridges across the River Thames. The pedestrian bridges also got crowded. Fox Photos/Getty Images This image shows men in 1920 crossing a bridge over the River Thames on a windy day. For those who wanted to avoid the road traffic, the London Underground was always an option. Topical Press Agency/Getty Images The London Underground — also know", "date_str": "2026-10-31T14:17:01+00:00", "hash": "4b61ad67cfa4eecc", "title_fa": "عکس های قدیمی نشان می دهد که لندن 100 سال پیش چگونه بوده است", "summary_fa": "فلپرها در بار یک کلوپ شبانه در لندن، در حدود سال 1925. آژانس عکاسی عمومی/گتی ایماژ یک قرن پیش، لندن شهری شلوغ، مملو از فرهنگ و معماری زیبا بود. با این حال، فقر با سکونت گاه های فقیر نشین در بخش هایی از شهر همچنان یک مسئله باقی ماند. نگاهی به زندگی در لندن در دهه 1920 بیندازید. امروزه لندن شهری پرهیاهو و کلان شهری است و همین را می توان در مورد شهر 100 سال پیش نیز گفت. مانند امروز، لندن به خاطر جاذبه هایش مانند سیرک پیکادیلی، کاخ باکینگهام و رودخانه تیمز شناخته شده بود. اما بسیاری از عکس‌ها بخش‌هایی از شهر را نشان می‌دهند که اکنون قابل شناسایی نیستند. از مد پر زرق و برق گرفته تا خانه های فقیر نشین، به این عکس ها از لندن دهه 1920 نگاهی بیندازید تا ببینید چقدر زندگی تغییر کرده است. یک عکس هوایی از میدان ترافالگار در لندن نشان می‌دهد که بخش‌هایی از شهر هنوز از نظر ساختاری 100 سال بعد به همان شکل هستند. کتابخانه عکس DE AGOSTINI/Getty Images در اوایل دهه 1800، بنا به گفته مقامات لندن بزرگ، این میدان مرکز فرهنگی شهر بود و در سال 1830 پس از چندین دگرگونی نام خود را به طور رسمی دریافت کرد. در آن زمان میدان ترافالگار مکان مناسبی برای شادی کودکان در فواره ها بود. Mirrorpix/Getty Images این فواره ها در سال 1845 ساخته شدند. خیابان آکسفورد دیگر هیچ ماشین یا اتوبوسی ندارد. Fox Photos/Getty Images در حالی که خیابان آکسفورد مملو از فروشگاه ها و رستوران ها است، اخیراً عابر پیا self. \"It's a bloodbath,\" she told me. We've stayed in touch ever since. I've sent her articles, offered (unsolicited!) career advice, and occasionally shared my own professional struggles. She's kept me updated on the job hunt, her volunteer work, and the fellowships she pursued to gain experience. In June, she was still searching. But she was learning new skills, building websites, and meeting people. Then, last week, an email arrived. \"I have great news: I started my first full time job as a software engineer!\" she wrote. Kiran is now working for the Virginia Digital Service, the state's government technology modernization team. She's moved from Los Angeles to Richmond, Virginia, and is settling into her new life. Yessss! Nothing feels better than to share in other people's success, without doing any of the work. Are robots really scary? Seriously, though: Kiran's experience is worth remembering as we confront another frightening prediction about the future of work: Robots are coming for everyone's jobs. Business Insider recently launched Robonomics , a major reporting series examining how AI-powered robots could transform work, businesses, and the economy. One story, by my colleague Eugene Kim , takes us inside an enormous Amazon warehouse in Tracy, California . The facility is packed with robots that move shelves, sort packages, and transport carts. Jobs that once required people to walk ", "date_str": "2026-10-31T14:00:01+00:00", "hash": "007f883a29b7f738", "title_fa": "یک فارغ التحصیل علوم کامپیوتر به من چیزهای زیادی در مورد یافتن کار در عصر هوش مصنوعی آموخت. در اینجا چیزی است که برای به دست آوردن اولین کار بزرگ لازم است.", "summary_fa": "", "image_url": "https://i.insider.com/6ae4ffc2f3bee449b3d29d2d?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۹ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "The best affordable cat essentials, tested by our reporters and their cats", "link": "https://www.busin
