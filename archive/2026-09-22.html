 هزار میلیارد تومان رسیده است. محاسبه این ارقام بر مبنای قیمت‌های ثابت نشان می‌دهد کاهش اعلام‌شده ناشی از کوچک‌شدن واقعی حجم تولید است، نه افزایش یا تغییر قیمت‌ها. افت اقتصاد ایران تنها به نفت محدود نمانده است. کاهش تولید در صنعت، معدن، ساختمان و خدمات، همراه با افت مصرف خانوار، سرمایه‌گذاری و تجارت خارجی، نشان می‌دهد رکود بخش‌های مختلف اقتصاد را دربر گرفته است. بخش نفت و گاز با کاهش ۲۶/۴ درصدی ارزش افزوده، بیشترین سهم را در ثبت رشد منفی اقتصاد داشته است. سهم این بخش از تولید ناخالص داخلی نیز از ۲۵/۶ درصد در بهار سال گذشته به ۲۱ درصد رسیده است. براساس محاسبات مرکز آمار، کاهش فعالیت در بخش نفت و گاز به‌تنهایی ۶/۷۴ واحد درصد از رشد منفی ۱۰/۱ درصدی اقتصاد را رقم زده است. بااین‌حال، رشد منفی ۴/۶ درصدی اقتصاد بدون نفت نشان می‌دهد بحران اقتصادی به این بخش محدود نیست. گروه صنایع و معادن در بهار امسال ۱۴/۷ درصد کوچک شده است. در زیرمجموعه این گروه، تولید صنعتی ۲/۵ درصد، ساختمان ۶/۴ درصد و تولید آب و برق ۵/۴ درصد کاهش یافته است. بخش خدمات نیز که سهم بزرگی از اقتصاد ایران را تشکیل می‌دهد، رشد منفی ۴/۸ درصدی ثبت کرده است. حمل‌ونقل، انبارداری و ارتباطات با کاهش ۱۷ درصدی، از بخش‌هایی بوده‌اند که بیشترین افت را تجربه کرده‌اند. سمت تقاضای اقتصاد نیز تصویری مشابه دارد. مصرف"}, {"source": "IranWire", "title": "نسرین ستوده: برای صدمین بار به‌دلیل حجاب اجباری از ملاقات محروم شدم", "link": "https://iranwire.com/fa/news-1/157926-%D9%86%D8%B3%D8%B1%DB%8C%D9%86-%D8%B3%D8%AA%D9%88%D8%AF%D9%87-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%B5%D8%AF%D9%85%DB%8C%D9%86-%D8%A8%D8%A7%D8%B1-%D8%A8%D9%87%D8%AF%D9%84%DB%8C%D9%84-%D8%AD%D8%AC%D8%A7%D8%A8-%D8%A7%D8%AC%D8%A8%D8%A7%D8%B1%DB%8C-%D8%A7%D8%B2-%D9%85%D9%84%D8%A7%D9%82%D8%A7%D8%AA-%D9%85%D8%AD%D8%B1%D9%88%D9%85-%D8%B4%D8%AF%D9%85/", "summary": "«نسرین ستوده»، وکیل و مدافع حقوق بشر، گفته است مسئولان زندان بار دیگر به‌دلیل مخالفت او با حجاب اجباری، مانع ملاقاتش با همسر زندانی‌اش، ...", "date_str": "2026-09-22T13:02:45+00:00", "hash": "10506c5782b25673", "title_fa": "نسرین ستوده: برای صدمین بار به‌دلیل حجاب اجباری از ملاقات محروم شدم", "summary_fa": "«نسرین ستوده»، وکیل و مدافع حقوق بشر، گفته است مسئولان زندان بار دیگر به‌دلیل مخالفت او با حجاب اجباری، مانع ملاقاتش با همسر زندانی‌اش، ... ستوده روز سه‌شنبه ۳۱ شهریور ۱۴۰۵ در حساب اینستاگرام خود نوشت : «امروز برای صدمین بار از ملاقات من و رضا جلوگیری کردند.» او گفته است از سال ۱۳۸۹، چه در دورانی که خود زندانی بود و چه اکنون که همسرش در زندان به سر می‌برد، بارها به‌دلیل خودداری از رعایت حجاب اجباری از ملاقات محروم شده است. این وکیل دادگستری نوشته است: «حالا رضا داخل زندان است و من از بیرون امکان ملاقات ندارم، چون حاضر به رعایت حجاب حکومتی نیستم.» به‌گفته ستوده، این ممنوعیت نه‌تنها او، بلکه رضا خندان را نیز از حق ملاقات محروم کرده است. او با تاکید بر اینکه ملاقات از حقوق زندانیان است، خطاب به مسئولان زندان نوشته است: «به‌خاطر دو تار مو آدم کشته‌اید و ما اکنون در روزهای سالگرد جنبش مهسای عزیز هستیم. آدم‌کشی بد است، نه بی‌حجابی.» نسرین ستوده پیام خود را با شعارهای «نه به جنگ، نه به استبداد»، «نه به حجاب اجباری»، «نه به اعدام» و «آری به آزادی» به پایان رسانده است. رضا خندان، فعال حقوق زنان و مخالف حجاب اجباری، روز ۲۳ آذر ۱۴۰۳ برای اجرای حکم زندان بازداشت شد. این پرونده به فعالیت‌های او علیه حجاب اجباری، از جمله ساخت و توزیع نشان‌هایی با عبارت «من به حجاب اجباری اعتراض دارم»، مربوط است. دادگاه انقلاب تهران خندان را با اتهام‌هایی از جمله «اجتماع و تبانی علیه امنیت ملی» و «فعالیت تبلیغی علیه نظام» به شش سال زندان محکوم کرده بود. نسرین ستوده پیش‌تر گفته بود پرونده همسرش مختومه شده و اجرای دوباره حکم او غیرقانونی است. ستوده پیش از این نیز هنگام مراجعه به زندان اوین با مخالفت ماموران بر سر حجاب اجباری روبه‌رو شده بود. او پنجم دی ۱۴۰۳ اعلام"}, {"source": "IranWire", "title": "خزر سالانه ۲۰ سانتی‌متر عقب می‌رود؛ میانکاله و انزلی در خطرند", "link": "https://iranwire.com/fa/news-1/157927-%D8%AE%D8%B2%D8%B1-%D8%B3%D8%A7%D9%84%D8%A7%D9%86%D9%87-%DB%B2%DB%B0-%D8%B3%D8%A7%D9%86%D8%AA%DB%8C%D9%85%D8%AA%D8%B1-%D8%B9%D9%82%D8%A8-%D9%85%DB%8C%D8%B1%D9%88%D8%AF-%D9%85%DB%8C%D8%A7%D9%86%DA%A9%D8%A7%D9%84%D9%87-%D9%88-%D8%A7%D9%86%D8%B2%D9%84%DB%8C-%D8%AF%D8%B1-%D8%AE%D8%B7%D8%B1%D9%86%D8%AF/", "summary": "سازمان حفاظت محیط‌زیست هشدار داده است که ادامه کاهش تراز آب دریای خزر می‌تواند بخش بزرگی از زیستگاه‌های ساحلی این پهنه آبی را دگرگون کند ...", "date_str": "2026-09-22T13:14:30+00:00", "hash": "d76c9ee3757e57d6", "title_fa": "خزر سالانه ۲۰ سانتی‌متر عقب می‌رود؛ میانکاله و انزلی در خطرند", "summary_fa": "سازمان حفاظت محیط‌زیست هشدار داده است که ادامه کاهش تراز آب دریای خزر می‌تواند بخش بزرگی از زیستگاه‌های ساحلی این پهنه آبی را دگرگون کند ... این هشدار هم‌زمان با برگزاری هفتمین نشست کنفرانس اعضای کنوانسیون تهران، موسوم به «کاپ هفت»، مطرح شده است. این نشست پس از سه سال تاخیر با حضور نمایندگان ایران، روسیه، جمهوری آذربایجان، قزاقستان و ترکمنستان در تهران برگزار می‌شود. کنوانسیون تهران چارچوب همکاری پنج کشور ساحلی برای حفاظت از محیط‌زیست دریای خزر است. نمایندگان این کشورها قرار است درباره کاهش تراز آب، آلودگی‌های نفتی و صنعتی، زباله‌های دریایی، تغییرات اقلیمی و حفاظت از گونه‌های جانوری گفت‌وگو کنند. شهرام فداکار، مدیرکل دفتر حفاظت از زیست‌بوم‌ها و سواحل دریایی سازمان حفاظت محیط‌زیست، به روزنامه «پیام ما» گفته است تراز آب خزر طی دو تا سه سال گذشته سالانه بیش از ۲۰ سانتی‌متر کاهش یافته است. به‌گفته او، ادامه این روند می‌تواند تا سال ۲۰۵۰ بحران گسترده‌ای برای زیستگاه‌های وابسته به خزر ایجاد کند. برآوردهای برنامه محیط‌زیست سازمان ملل نیز نشان می‌دهد سطح آب خزر از دهه ۱۹۹۰ تاکنون حدود دو متر پایین رفته و ممکن است تا پایان قرن حاضر بین هشت تا ۲۱ متر دیگر کاهش یابد. کاهش آب ورودی رودخانه‌ها، افزایش تبخیر، آلودگی، تخریب زیستگاه‌ها و تغییرات اقلیمی از عوامل اصلی این وضعیت معرفی شده‌اند. رود ولگا به‌تنهایی حدود ۸۰ درصد آب ورودی خزر را تامین می‌کند. کاهش سطح آب، تالاب‌های انزلی و میانکاله را نیز تهدید می‌کند. تالاب انزلی بخش بزرگی از آب خود را از ارتفاعات البرز دریافت می‌کند، اما میانکاله وابستگی بیشتری به دریای خزر دارد. مقام‌های محیط‌زیست انتقال آب به میانکاله را یکی از گزینه‌های احیای این تالاب اعلام کرده‌اند، اما کاهش مداوم سطح خزر اجرای این طرح را دشوارتر می‌کند. مرگ‌ومیر فک‌های خزری، تنها پستاندار دریای خزر، یکی دیگر از نشانه‌های بحران این زیست‌بوم است. از ابتدای سال ۱۴ ای سال ۲۰۲۴ نیز الگوی مشابهی را نشان داد. امارات با صادرات بیش از ۲۱ میلیارد دلار کالا به ایران، بزرگ‌ترین مبدا واردات این کشور بود. همچنین، پس از چین و عراق، سومین مقصد بزرگ صادرات ایران بود و حدود ۷٫۱۶ میلیارد دلار کالای ایرانی دریافت کرد. با این حال، آمار امارات، تجارت غیرنفتی دوجانبه را در سال ۲۰۲۴ حدود ۶٫۶۲ میلیارد دلار، شامل ۵٫۷۴ میلیارد دلار صادرات مجدد، و در سال ۲۰۲۵ حدود ۵٫۷۳ میلیارد دلار، شامل ۴٫۸۱ میلیارد دلار صادرات مجدد، اعلام می‌کند. به نظر می‌رسد این اختلاف، دست‌کم تا حدی، ناشی از تفاوت در شیوه ثبت تجارت از مسیر نظام صادرات مجدد و"}, {"source": "BBC Persian", "title": "دیدار محرمانه در حمام سفارت بریتانیا؛ جاسوسی که میان کاگ‌ب، ام‌آی۶ و جمهوری اسلامی قرار گرفت", "link": "https://www.bbc.com/persian/articles/cqy0z7yk71w1o?at_medium=RSS&at_campaign=rss", "summary": "کتاب «ردوود» روایت همکاری مخفی یک افسر کاگ‌ب با ام‌آی۶ در ایران و انتقال اطلاعات او درباره شوروی و حزب توده به جمهوری اسلامی و پیامدهای بحث‌برانگیز آن است.", "date_str": "2026-09-22T04:39:38+00:00", "hash": "e0ada3816def5feb", "title_fa": "دیدار محرمانه در حمام سفارت بریتانیا؛ جاسوسی که میان کاگ‌ب، ام‌آی۶ و جمهوری اسلامی قرار گرفت", "summary_fa": "کتاب «ردوود» روایت همکاری مخفی یک افسر کاگ‌ب با ام‌آی۶ در ایران و انتقال اطلاعات او درباره شوروی و حزب توده به جمهوری اسلامی و پیامدهای بحث‌برانگیز آن است. دو مامور اطلاعاتی، یکی روس و دیگری بریتانیایی، در حمام کوچک خانه‌ای در محوطه سفارت بریتانیا نشسته‌اند. شیرهای آب باز است و رادیو پخش می‌شود تا صدای گفت‌وگوی آنها شنیده نشود. افسر ام‌آی۶ گمان می‌کند دستگاه‌های امنیتی ایران خانه را شنود کرده‌اند. بن مک‌اینتایر کتاب تازه‌اش را با این صحنه در تهران سال ۱۹۸۱ آغاز می‌کند. مهمان روس، ولادیمیر کوزیچکین، افسر کاگ‌ب، سرویس اطلاعاتی شوروی است. او پیشنهاد کرده برای ام‌آی۶، سازمان اطلاعات مخفی بریتانیا، جاسوسی کند و انتظار دارد پس از مدتی از ایران خارج و به بریتانیا منتقل شود. او در این جلسه، موضوعی کاملا شخصی را نیز مطرح می‌کند: به نوشته مک‌اینتایر، کوزیچکین باور دارد پزشکان غربی می‌توانند مشکل جنسی او را درمان و زندگی مشترکش را نجات دهند. این صحنه نقطه آغاز یکی از پیچیده‌ترین عملیات‌های جاسوسی دوران جنگ سرد است؛ ماجرایی که مک‌اینتایر، نویسنده بریتانیایی آثار تاریخی پرفروش، در کتاب «ردوود؛ داستان ناگفته شگفت‌انگیزترین جاسوس جنگ سرد» روایت می‌کند. کتاب ردوود (Redwood)، ماجرای جذب کوزیچکین، فعالیت مخفیانه او در تهران و فرارش از مرز بازرگان را با جزئیات یک داستان جاسوسی پیش می‌برد. اما اهمیت تاریخی آن فراتر از سرگذشت یک مامور کاگ‌ب است. مک‌اینتایر در کتاب تازه‌اش می‌گوید اطلاعات کوزیچکین درباره روابط شوروی و حزب توده، از طریق بریتانیا و آمریکا در اختیار مقام‌های جمهوری اسلامی قرار گرفت و به سرکوب گسترده این حزب در سال‌های ۱۳۶۱ و ۱۳۶۲ کمک کرد. کتاب همچنین پرسشی تاریخی و همچنان مناقشه‌برانگیز را دوباره مطرح می‌کند: آیا حزب توده و شوروی واقعا خود را برای کودتا در ایران آماده می‌کردند؟ ولادیمیر کوزیچکین در سال ۱۹۴۷ در مسکو به دنیا آمد. آندری کوزیچکین، افسر کاگ‌ب، ناپدری او بود و ولادیمیر"}, {"source": "BBC Persian", "title": "چرا توافق جدید مرزی پاکستان و چین هند را خشمگین کرده است؟", "link": "https://www.bbc.com/persian/articles/c370lv9xp5wqo?at_medium=RSS&at_campaign=rss", "summary": "توافق جدید مرزی پاکستان و چین، ادعاهای ارضی هند را به چالش کشیده و نگرانی‌های راهبردی دهلی درباره کشمیر مورد مناقشه را افزایش داده است.", "date_str": "2026-09-22T05:18:56+00:00", "hash": "101f50ff0fb04820", "title_fa": "چرا توافق جدید مرزی پاکستان و چین هند را خشمگین کرده است؟", "summary_fa": "توافق جدید مرزی پاکستان و چین، ادعاهای ارضی هند را به چالش کشیده و نگرانی‌های راهبردی دهلی درباره کشمیر مورد مناقشه را افزایش داده است. دهه‌هاست که هند از به رسمیت شناختن مرز میان پاکستان و چین در بخشی مورد مناقشه از رشته‌کوه هیمالیا که دهلی آن را متعلق به خود می‌داند، خودداری کرده است. اما هفته گذشته، پاکستان و چین خط مرزی میان خود را در بخشی دورافتاده از این منطقه کوهستانی رسمیت بخشیدند؛ اقدامی که با واکنش تند دهلی نو روبه‌رو شد. دو کشور توافق‌نامه تشکیل «کمیسیون مشترک مرزی پاکستان و چین» را امضا کردند؛ توافقی که پاکستان آن را «نقطه‌عطفی مهم» توصیف کرد و گفت به تعمیق همکاری میان دو رقیب منطقه‌ای هند در زمینه مدیریت مرزها، تجارت و ارتباطات کمک خواهد کر ، چندین و چند سری. برای بیشتر سؤالاتمان جوابی نگرفتیم. چند تایی بود،"}, {"source": "BBC Persian", "title": "اخلال گسترده در چندین فرودگاه مناطق شرقی آمریکا در پی قطع تصادفی یک کابل فیبر نوری", "link": "https://www.bbc.com/persian/articles/c39w4e0r1edeo?at_medium=RSS&at_campaign=rss", "summary": "قطع تصادفی یک کابل فیبر نوری حین عملیات حفاری برای یک پروژه ساختمانی در نیوجرسی آمریکا، موجب اخلال در فعالیت چندین فرودگاه بین‌المللی و زمین‌گیر شدن بیش از صد پرواز در مناطقی در شرق ایالات متحده شده و همزمانی این اختلال با مجمع عمومی سازمان ملل متحد در نیویورک و سفر رهبران جهان به این شهر برای سخنرانی در آن، انتقاداتی را در پی داشته است.", "date_str": "2026-09-21T20:50:35+00:00", "hash": "f84e1da3bfefd7b9", "title_fa": "اخلال گسترده در چندین فرودگاه مناطق شرقی آمریکا در پی قطع تصادفی یک کابل فیبر نوری", "summary_fa": "قطع تصادفی یک کابل فیبر نوری حین عملیات حفاری برای یک پروژه ساختمانی در نیوجرسی آمریکا، موجب اخلال در فعالیت چندین فرودگاه بین‌المللی و زمین‌گیر شدن بیش از صد پرواز در مناطقی در شرق ایالات متحده شده و همزمانی این اختلال با مجمع عمومی سازمان ملل متحد در نیویورک و سفر رهبران جهان به این شهر برای سخنرانی در آن، انتقاداتی را در پی داشته است. برایان بدفورد، یک مقام مسئول امور هوانوردی آمریکا، در یک نشست خبری مشترک با شان دافی، وزیر حمل‌ و نقل این کشور، گفت که قطع تصادفی یک کابل فیبر نوری طی عملیات گود‌برداری برای یک پرژه ساختمانی، باعث از کار افتادن یک سامانه راداری شده که هواپیماها را در هنگام برخاستن و فرود هدایت می‌کند. آقای بدفورد همچنین با تاکید بر گستردگی این مشکل گفت که تعمیر این کابل پشتیبان حدود ۱۳ ساعت زمان می‌برد. او افزود که طول بخش قطع‌شده کابل فیبر نوری حدود ۱۸۳ متر است و این کابل به‌ طور غیرعمدی و «کسی آن را حین حفاری قطع کرده است.» رفع این مشکل مستلزم خاموش کردن کامل سیستم، یا به اصطلاح «پاک‌سازی حریم هوایی» و اطمینان از ایمنی تمام پروازهاست. آقای بدفورد تخمین زد که تاکنون حدود ۹۰ پرواز به مناطق دیگر تغییر مسیر داده‌اند، اما افزود که از آمار دقیق پروازهای لغوشده اطلاعی ندارد. سخنگوی اداره هوانوردی فدرال ایالات متحده نیز به شبکه سی‌بی‌اس، شریک آمریکایی بی‌بی‌سی، گفت که متخصصان پس از بررسی مشکل پیش‌ آمده در عملکرد مشکل سیستم رادار فرودگاه، متوجه شدند که یک مدار فیبر نوری پشتیبان، در یک عملیات ساختمانی در نیوجرسی آسیب دیده است. تا لحظه تنظیم این گزارش فعالیت فرودگاه‌های زیر با «اخلال جدی» مواجه شده‌ است: این اختلال گسترده پروازها در آستانه دوره‌ای پرتردد برای شهر نیویورک مطرح می‌شود؛ جایی که قرار است رهبران جهان روز سه‌شنبه برای نشست سالانه مجمع عمومی سازمان"}, {"source": "BBC Persian", "title": "پنج شبکه اصلی آمریکا در اقدامی اعتراضی پوشش خبرهای کاخ سفید را تحریم کردند", "link": "https://www.bbc.com/persian/articles/cqwyz22xdex0o?at_medium=RSS&at_campaign=rss", "summary": "سی‌ان‌ان، پولیتیکو و ام‌اس ناو از دولت ترامپ پس از آنکه خبرنگاران آنها از ورود به کاخ سفید منع شدند، در یک اقدام قانونی، شکایتی را ثبت کرده‌اند. همزمان پنج شبکه اصلی آمریکا در اقدامی اعتراضی پوشش خبرهای کاخ سفید را تحریم کردند.", "date_str": "2026-09-21T17:24:39+00:00", "hash": "198492269d4d00f5", "title_fa": "پنج شبکه اصلی آمریکا در اقدامی اعتراضی پوشش خبرهای کاخ سفید را تحریم کردند", "summary_fa": "سی‌ان‌ان، پولیتیکو و ام‌اس ناو از دولت ترامپ پس از آنکه خبرنگاران آنها از ورود به کاخ سفید منع شدند، در یک اقدام قانونی، شکایتی را ثبت کرده‌اند. همزمان پنج شبکه اصلی آمریکا در اقدامی اعتراضی پوشش خبرهای کاخ سفید را تحریم کردند. دونالد ترامپ، رئیس‌جمهور آمریکا، روز جمعه گفت که از ورود خبرنگاران این رسانه‌ها به کاخ سفید جلوگیری می‌کند و این رسانه‌ها را متهم کرد که درباره تیم او «داستان‌پردازی یا دروغ» منتشر می‌کنند. این سه رسانه خبری گفتند خبرنگارانشان روز شنبه از ورود به ساختمان کاخ سفید منع شدند. این سه رسانه در بیانیه‌ای مشترک اعلام کردند که برای «دفاع از این اصل که دولت نباید تعیین کند رسانه‌ها درباره چه چیزی گزارش می‌دهند» اقدام قانونی کرده‌اند. پس از آن، شبکه‌های بزرگ تلویزیونی آمریکا اعلام کردند پوشش مشترک خود از فعالیت‌های رئیس جمهور آمریکا در کاخ سفید را متوقف می‌کنند؛ اقدامی که می‌تواند هم‌زمان با سفر او به نیویورک برای شرکت در مجمع عمومی سازمان ملل، خلایی در پوشش خبری ایجاد کند. متمم اول قانون اساسی آمریکا دولت را از «محدود کردن» آزادی مطبوعات منع می‌کند؛ عبارتی که دادگاه‌ها به‌طور سنتی آن را به‌گونه‌ای تفسیر کرده‌اند که دولت نمی‌تواند بر اساس محتوای پوشش خبری رسانه‌ها، علیه آنها تبعیض قائل شود. این بیانیه افزود: «اگر کسی در برابر این اقدام نایستد، این کار آزادی مطبوعات و حق مردم برای دسترسی به روزنامه‌نگاری مستقل و عاری از دخالت دولت رابا خطر مواجه می‌کند.» این رسانه‌ها روز دوشنبه در دادگاه فدرال منطقه‌ای در واشنگتن شکایت خود را ثبت کردند و از قاضی خواستند به‌سرعت ممنوعیت آقای ترامپ را خلاف قانون اساسی اعلام کند و مانع اجرای آن توسط دستیاران رئیس‌جمهوری شود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید."}, {"source": "BBC Persian", "title": "کشف پیاپی اجساد زنان، موجی از هراس را در آفریقای جنوبی به راه انداخت", "link": "https://www.bbc.com/persian/articles/cjr4vp0nrzk4o?at_medium=RSS&at_campaign=rss", "summary": "در حالی که کشف پیاپی پیکر زنان به قتل‌رسیده در شرق ژوهانسبورگ موجی از ترس و خشم را در آفریقای جنوبی برانگیخته، خانواده‌های قربانیان و فعالان حقوق زنان می‌گویند جامعه دیگر تاب تحمل خشونت بیشتر را ندارد. در منطقه اکورهولنی، جایی که از ماه ژوئیه تاکنون پیکر ۹ زن در شرایطی مشابه پیدا شده، درخواست‌ها برای اقدام فوری دولت و پلیس روزبه‌روز افزایش یافته است.", "date_str": "2026-09-21T18:18:12+00:00", "hash": "db74b4861a07e267", "title_fa": "کشف پیاپی اجساد زنان، موجی از هراس را در آفریقای جنوبی به راه انداخت", "summary_fa": "در حالی که کشف پیاپی پیکر زنان به قتل‌رسیده در شرق ژوهانسبورگ موجی از ترس و خشم را در آفریقای جنوبی برانگیخته، خانواده‌های قربانیان و فعالان حقوق زنان می‌گویند جامعه دیگر تاب تحمل خشونت بیشتر را ندارد. در منطقه اکورهولنی، جایی که از ماه ژوئیه تاکنون پیکر ۹ زن در شرایطی مشابه پیدا شده، درخواست‌ها برای اقدام فوری دولت و پلیس روزبه‌روز افزایش یافته است. نوکواندا ماتشیکیزا در حالی که درباره قتل خواهرزاده‌اش، دینه‌ئو موتاپانه، صحبت می‌کند، با گریه می‌گوید: «نمی‌دانم قرار است چه کار کنیم. اما یک چیز باید تغییر کند.» او می‌گوید: «برای خودمان و برای همه زنان دیگر. پیش از آنکه اتفاقی بیفتد، قرار است چند جسد دیگر پیدا شود؟» نوکواندا ماتشیکیزا تنها دو روز پس از آنکه بستگانش جسد دینه‌ئو موتاپانه را شناسایی کردند، از خانه‌اش در نزدیکی ژوهانسبورگ، بزرگ‌ترین شهر آفریقای جنوبی، با بی‌بی‌سی گفت‌وگو کرد.. این زن ۳۸ ساله، که مادر یک کودک خردسال بود، آخرین بار روز یکشنبه زنده دیده شد. ساعاتی بعد، پیکر او که آثار ضرب‌وجرح بر آن مشهود بود و بخشی از آن نیز سوخته بود، در منطقه مسکونی اکورهولنی پیدا شد. نوکواندا در حالی که اشک می‌ریزد، از روزی می‌گوید که خانواده ناچار خواهند شد خبر مرگ دینه‌ئو را به دخترش بگویند؛ وظیفه‌ای دردناک که دیر یا زود ناگزیر از انجام آن خواهند بود. «چطور توضیح بدهید که مادرت را وحشیانه کشته‌اند، در زمینی رها کرده‌اند و همانجا، مثل تکه‌ای زباله، دور انداخته‌اند؟ «نمی‌شود با آن کنار آمد. چیزی است که هرگز نمی‌توانی بپذیری یا از آن عبور کنی.» مرگ دینئو در این هفته، در میان مجموعه‌ای از حوادث مشابه در اکورهولنی رخ داده است، پیکر او یکی از سه جسدی بود که اخیرا در آنجا پیدا شد. در مجموع، از ماه ژوئیه تاکنون پیکر ۹ زن به‌ قتل‌ رسیده در شرایط مشابهی در این منطقه کشف شده است."}, {"source": "Radio Farda", "title": "روبیو: ترامپ آماده دیدار با پزشکیان است؛ سپاه: آمادگی نظامی به معنای نفی مذاکره نیست", "link": "https://www.radiofarda.com/a/rubio-us-open-to-meeting-iran-at-un-no-meeting-scheduled-yet/33861116.html", "summary": ".", "date_str": "2026-09-22T12:55:10+00:00", "hash": "fa50c925d618e3a0", "title_fa": "روبیو: ترامپ آماده دیدار با پزشکیان است؛ سپاه: آمادگی نظامی به معنای نفی مذاکره نیست", "summary_fa": "مارکو روبیو، وزیر امور خارجه آمریکا، روز سه‌شنبه ۳۱ شهریور گفت به باور او دونالد ترامپ، رئیس‌جمهور ایالات متحده، برای دیدار با مسعود پزشکیان، همتای ایرانی خود، در حاشیه مجمع عمومی سازمان ملل متحد در نیویورک آمادگی دارد اما هنوز برای چنین دیداری برنامه‌ریزی نشده است. روبیو در گفت‌وگو با شبکه فاکس نیوز گفت: «فکر می‌کنم چیزی که از دوره نخست این رئیس‌جمهور و اکنون شاهد خواهید بود این است که او حاضر است با هر کسی گفت‌وگو و دیدار کند.» دونالد ترامپ خود نیز دو روز پیش از آمادگی برای دیدار با پزشکیان در نیویورک خبر داده و در عین حال درباره ایران گفته بود: «من در وضعیت تصمیم‌گیری هستم و در آینده‌ای نه‌چندان دور اتفاقات بسیار بزرگی رخ خواهد داد.» وزیر خارجه آمریکا درباره دیدار و مذاکره احتمالی بین ترامپ و پزشکیان اعلام کرد: «این‌که آیا از چنین دیداری نتیجه سازنده‌ای حاصل خواهد شد یا نه، دشوارتر است، زیرا تصمیم‌گیرنده نهایی در ایران رهبر جمهوری اسلامی است و رهبر جمهوری اسلامی یک روحانی شیعه تندرو است.» روبیو ادامه داد: «باید به یاد داشته باشیم وقتی صحبت می‌کنیم، فقط دربارهٔ سیاستمداران حرف نمی‌زنیم؛ بلکه دربارهٔ افرادی صحبت می‌کنیم که تصمیم‌هایشان تحت تأثیر باورهای الهیاتی آنهاست.» وزیر امور خارجه آمریکا همچنین در گفت‌وگو با شبکه ان‌بی‌سی درباره دیدار احتمالی روسای جمهور ایالات متحده و ایران گفت: «ما برای چنین چیزی آمادگی داریم. فکر نمی‌کنم در این مرحله چیزی برنامه‌ریزی شده باشد، اما قطعاً برای چنین دیداری آمادگی داریم، به‌ویژه اگر چشم‌انداز آن به نتیجه‌ای مثبت و در نهایت تحقق هدف اصلی این موضوع منجر شود.» او افزود: «و آن هدف این است که ایران هرگز نتواند به سلاح هسته‌ای دست پیدا کند. آنها به‌سادگی نمی‌توانند چنین سلاحی داشته باشند.» همزمان حسین محبی، سخنگوی سپاه پاسداران، در گفت‌وگو با خبرگزاری جمهوری اسلامی، ایرنا، به مذاکره احتمالی با ایالات متحده روی خوش"}, {"source": "Radio Farda", "title": "ونس: آمریکا به‌دنبال از بین‌ بردن امکان احیای برنامه هسته‌ای ایران است", "link": "https://www.radiofarda.com/a/33861021.html", "summary": "جی‌دی ونس، معاون رئیس‌جمهور آمریکا، می‌گوید ایالات متحده سه تأسیسات هسته‌ای مهم ایران را از بین برده، و در حال حاضر به‌دنبال جلوگیری از احیای برنامه هسته‌ای تهران است.", "date_str": "2026-09-22T11:10:04+00:00", "hash": "0ce1f17bd3d9b1ef", "title_fa": "ونس: آمریکا به‌دنبال از بین‌ بردن امکان احیای برنامه هسته‌ای ایران است", "summary_fa": "جی‌دی ونس، معاون رئیس‌جمهور آمریکا، می‌گوید ایالات متحده سه تأسیسات هسته‌ای مهم ایران را از بین برده، و در حال حاضر به‌دنبال جلوگیری از احیای برنامه هسته‌ای تهران است. او این اظهارات را روز دوشنبه ۳۰ شهریور در گفت‌و‌گو با شبکه «نیوزمکس» بیان کرد. ونس گفت:‌ «ما تأسیسات هسته‌ای آن‌ها به‌ویژه سه تأسیسات هسته‌ای را در یک حمله تاکتیکی فوق‌العاده منهدم کردیم... حالا مسئله این است که اطمینان حاصل کنیم آن‌ها نتوانند برنامه هسته‌ای خود را بازسازی کنند.» معاون رئیس‌جمهور آمریکا اضافه کرد: «در اینجا واقعا یک روند دو مرحله‌ای وجود دارد؛ آیا ایران اگر بخواهد، می‌تواند فردا یک سلاح هسته‌ای بسازد؟ نه. آیا ایران اگر بخواهد، می‌تواند ظرف شش ماه یا یک سال یک سلاح هسته‌ای بسازد؟ نه.» جی‌دی ونس در ادامه گفت که حالا دونالد ترامپ می‌خواهد مطمئن شود که جمهوری اسلامی منابع و زیرساخت لازم برای بازسازی برنامه هسته‌ای را در اختیار نداشته باشد و دیگر نتواند سلاح هسته‌ای بسازد. این اظهارات چند هفته پس از اجرای محدودیت‌های تازه اقتصادی آمریکا بر جمهوری اسلامی مطرح می‌شود که در عملیاتی به نام «طرد اقتصادی»، کشورهای دیگر جهان را نیز برای افزایش فشارها بر جمهوری اسلامی با خود همراه کرده یا تلاش می‌کند همراه کند. معاون رئیس جمهور آمریکا در همین مصاحبه در عین حال اقدامات ایران در ایجاد «رعب و وحشت برای کشتیرانی بین‌المللی» را عامل افزایش قیمت انرژی در دنیا دانست و گفت دولت آمریکا تلاش می‌کند با این اقدامات مقابله کند تا مانع از افزایش قیمت سوخت و فشار بر مردم آمریکا شود. ونس همچنین گفت: «با وجود اینکه ایرانی‌ها هر روز برای کشتی‌ها ایجاد وحشت و ناامنی می‌کنند، ما همچنان شاهد عبور حجم قابل‌ توجهی نفت و گاز از تنگه هرمز هستیم.» برد کوپر، فرمانده نیروهای نظامی آمریکا در خاورمیانه، روز شنبه خبر داد طی چند ماه گذشته بیش از یک میلیارد بشکه نفت خام"}, {"source": "Radio Farda", "title": "بررسی راهکارهای افزایش عبور و مرور در تنگه هرمز در دیدار تازه مکرون و ترامپ", "link": "https://www.radiofarda.com/a/macron-presses-trump-on-hormuz-and-ukraine-as-oil-prices-surge/33860920.html", "summary": "امانوئل مکرون، رئیس‌جمهوری فرانسه، می‌گوید درباره راه‌های بازگشایی تنگه هرمز با دونالد ترامپ، رئیس‌جمهور آمریکا، گفت‌و‌گویی «بسیار سازنده» داشته است.", "date_str": "2026-09-22T08:33:59+00:00", "hash": "9fbef24c5276c459", "title_fa": "بررسی راهکارهای افزایش عبور و مرور در تنگه هرمز در دیدار تازه مکرون و ترامپ", "summary_fa": "امانوئل مکرون، رئیس‌جمهوری فرانسه، می‌گوید درباره راه‌های بازگشایی تنگه هرمز با دونالد ترامپ، رئیس‌جمهور آمریکا، گفت‌و‌گویی «بسیار سازنده» داشته است. این گفت‌و‌گو روز دوشنبه، ۳۰ شهریور، اندکی پس از ورود مکرون و ترامپ به نیویورک برای شرکت در مجمع عمومی سازمان ملل انجام شده است. حدود ۲۰ درصد از نفت و گاز مصرفی در جهان معمولاً از تنگه هرمز عبور می‌کرد تا این که این روند از زمان آغاز جنگ میان آمریکا و اسرائیل با ایران در اسفند ۱۴۰۴ مختل شد. مکرون در گفت‌وگو با خبرنگاران گفت: «چندین راه‌حل مورد بحث قرار گرفت که بدون نیاز به یک توافق جامع، امکان و سازوکار لازم برای عبور تعداد بیشتری کشتی کانتینری و نفتکش را فراهم می‌کند.» او با این حال جزئیات بیشتری در این زمینه ارائه نکرد. به گفته یک منبع دیپلماتیک فرانسوی در گفت‌و‌گو با رادیو بین‌الملل فرانسه، پاریس می‌خواهد با واشینگتن و دیگر شرکا برای تصویب قطعنامه‌ای در شورای امنیت سازمان ملل همکاری کند که آزادی کشتیرانی در تنگه هرمز را تضمین کند. این گزارش می‌گوید کشورهای عضو سازمان ملل می‌توانند به تأمین امنیت تردد دریایی کمک کنند و این امر احتمالاً به واشینگتن و تهران اجازه می‌دهد مذاکرات خود را بر دیگر اختلافات، از جمله برنامه هسته‌ای ایران، متمرکز کنند. فرانسه و بریتانیا پیشتر دست به یک ابتکار چندملیتی با مشارکت حدود ۴۰ کشور برای تأمین امنیت تنگه هرمز زده‌اند که پاک‌سازی مین‌های دریایی را نیز شامل می‌شود. با این حال، اجرای این مأموریت به برقراری آتش‌بس بستگی دارد و تاکنون با استقبال چندانی از سوی ترامپ روبه‌رو نشده است. فرانسه همچنین اعلام آمادگی کرده که پس از حملات به تأسیسات و مسیرهای انتقال نفت عربستان سعودی، به حفاظت از زیرساخت‌های انرژی این کشور کمک کند. این منبع تأکید کرد: «این به هیچ‌وجه به معنای مشارکت در درگیری با حوثی‌ها نیست.»"}, {"source": "Radio Farda", "title": "گروه هفت از ایران خواست از حمایت و رساندن سلاح به شورشیان حوثی دست بردارد", "link": "https://www.radiofarda.com/a/g7-foreign-ministers-call-on-iran-to-stop-arming-houthis/33860858.html", "summary": "گروه هفت می‌گوید اقدامات ایران در حمایت از حوثی‌ها «نشان‌دهنده الگویی خطرناک از تشدید تنش است که خطر تضعیف تجارت بین‌المللی و ایجاد بی‌ثباتی در جهان را به همراه دارد.»", "date_str": "2026-09-22T05:59:39+00:00", "hash": "ef1a959ae9befaad", "title_fa": "گروه هفت از ایران خواست از حمایت و رساندن سلاح به شورشیان حوثی دست بردارد", "summary_fa": "گروه هفت می‌گوید اقدامات ایران در حمایت از حوثی‌ها «نشان‌دهنده الگویی خطرناک از تشدید تنش است که خطر تضعیف تجارت بین‌المللی و ایجاد بی‌ثباتی در جهان را به همراه دارد.» وزرای خارجه گروه هفت از ایران خواستند تسلیح و حمایت از شورشیان حوثی‌ها در یمن را متوقف کند. این درخواست روز دوشنبه ۳۰ شهریور توسط وزرای خارجه بریتانیا، کانادا، فرانسه، آلمان، ایتالیا، ژاپن و ایالات متحده در بیانیه‌ای پس از نشست مشترک آنها در حاشیه مجمع عمومی سازمان ملل مطرح شد. در این بیانیه آمده که اقدامات ایران در حمایت از حوثی‌ها «نشان‌دهنده الگویی خطرناک از تشدید تنش است که خطر تضعیف تجارت بین‌المللی و ایجاد بی‌ثباتی در جهان را به همراه دارد.» این بیانیه افزوده:‌ «ما با شدیدترین لحن ممکن، حملات غیرقابل‌قبول و ادامه‌دار حوثی‌ها در یمن و علیه پادشاهی عربستان سعودی را محکوم می‌کنیم.» وزرای خارجه گروه هفت از حوثی‌ها خواسته‌اند «فوراً به تمامی اقدامات نظامی، تهدیدها و حملات علیه کشتی‌رانی غیرنظامی پایان دهند و با حسن نیت به روند سیاسی بازگردند.» در حالی که این گروه تحت حمایت ایران، جنگ خود علیه عربستان سعودی، متحد آمریکا، را تشدید کرده، دونالد ترامپ ۲۹ شهریور در گفت‌و‌گو با فاکس‌نیوز خبر داد که ایالات متحده «به‌طور مستمر با حوثی‌ها در ارتباط است و آنها توافق کرده‌اند با آمریکا وارد جنگ نشوند.» با این حال در روزهای اخیر وزارت خارجه ایالات متحده در پی وقوع انفجار در فرودگاه ریاض هشدار داد که این احتمال هست خصومت و درگیری میان عربستان سعودی و حوثی‌های شیعه تحت حمایت جمهوری اسلامی «به‌سرعت بالا بگیرد». حوثی‌های یمنی مخالف حکومت مرکزی، یکی از گروه‌های نیابتی جمهوری اسلامی محسوب می‌شوند. این در حالی است که جمهوری اسلامی اصرار دارد این گروه مستقل از تهران عمل می‌کند. آنها در روزهای اخیر همزمان با پیشروی در مناطق اطراف تنگه راهبردی باب‌المندب، جنگ خود علیه عربستان سعودی، متحد آمریکا، را"}, {"source": "Radio Farda", "title": "انتخابات پارلمانی روسیه به نفع پوتین؛ اتحادیه اروپا از «عقب‌گرد دموکراسی» انتقاد کرد", "link": "https://www.radiofarda.com/a/russia-announces-election-results-cementing-putin-s-power-eu-slams-veneer-of-democracy-/33860482.html", "summary": "مقام‌های روسیه از مشارکت بالا در انتخابات پارلمانی و یک پیروزی قابل توجه برای حزب مورد تأیید کرملین سخن می‌گویند. رئیس سیاست خارجی اتحادیه اروپا اما این انتخابات را «ساختگی» خواند", "date_str": "2026-09-21T18:52:54+00:00", "hash": "110ae6378b0b3ebf", "title_fa": "انتخابات پارلمانی روسیه به نفع پوتین؛ اتحادیه اروپا از «عقب‌گرد دموکراسی» انتقاد کرد", "summary_fa": "مقام‌های روسیه از مشارکت بالا در انتخابات پارلمانی و یک پیروزی قابل توجه برای حزب مورد تأیید کرملین سخن می‌گویند. رئیس سیاست خارجی اتحادیه اروپا اما این انتخابات را «ساختگی» خواند مقام‌های فدراسیون روسیه در مسکو، نتایج انتخابات پارلمانی را اعلام کردند؛ نتایجی که رکورد تازه‌ای را در جهت تقویت جایگاه حزب «روسیۀ متحد»، که از سوی کرملین کنترل می‌شود، به‌ نمایش گذاشت. این در حالی‌ است که اتحادیۀ اروپا، انتخابات یکشنبه ۲۹ شهریورماه را «ساختگی» خوانده است. به گفتۀ کمیسیون مرکزی انتخابات، حزب «روسیۀ متحد» در نخستین انتخابات پارلمانی که از زمان آغاز تهاجم تمام‌عیار مسکو علیه اوکراین برگزار شد، با کسب نزدیک به ۵۸ درصد آرا، ۳۵۵ کرسی از مجموع ۴۵۰ کرسی دومای روسیه را به خود اختصاص داد. در انتخاباتی به‌شدت مدیریت‌شده که در طول سه‌روز از جمعه تا یکشنبه برگزار شد، رأی‌دهندگان می‌توانستند از میان نامزدهای چندین حزب، که همگی مورد تأیید کرملین بوده و به‌طور کامل از ولادیمیر پوتین حمایت می‌کنند، به افراد مورد نظر خود رأی بدهند. حزب «یابلوکو»، تنها حزب مخالف جنگ اوکراین، از انتخابات کنار گذاشته شده بود. نیکلای ریباکوف رهبر این حزب، با حضور در یک حوزۀ رأی‌گیری در سن‌پترزبورگ، روی برگۀ رأی خود با ماژیک نوشت «برای صلح»، و آن‌را مقابل خود و دوربین عکاسان گرفت. اکثر چهره‌های اپوزیسیون روسیه،‌ یا زندانی هستند و یا در تبعید به سر می‌برند. دمیتری گودکوف، از مخالفان تبعیدی به «کارِنت تایم»، شبکۀ تلویزیونی بخش روسی رادیو اروپای آزاد/ رادیو آزادی می‌گوید: «به هیچ‌‌کس [از چهره‌های اپوزیسیون] اجازۀ نامزدی ندادند. ناظران انتخاباتی را اخراج کردند. روشن است که برگه‌های رأی را به‌صورت گسترده دستکاری کردند». گودکوف عضو «نیروهای دموکراتیک روسیه» است؛ گروهی تبعیدی از مخالفان، که در مجمع پارلمانی شورای اروپا (پِیس) مستقر است. او گفت معتقد است که این گروه به‌زودی انتخابات دوما را «بی‌اع  اولین نفری که می‌آید. میز نمایشگاه خود را هم اکنون رزرو کنید و به استارتاپ خود اولین ضربه را به مکالمات، مشتریان و ارتباطاتی که در Disrupt منتظر هستند، بدهید. وقتی از طریق پیوندهای موجود"}, {"source": "TechCrunch AI", "title": "4 days to save up to $200: Reason 2 of 5 to be at TechCrunch Disrupt 2026", "link": "https://techcrunch.com/2026/09/22/4-days-to-save-up-to-200-reason-2-of-5-to-be-at-techcrunch-disrupt-2026/", "summary": "Save up to $200 on your TechCrunch Disrupt 2026 pass, plus 50% off a second pass before prices increase on September 25 at 11:59 p.m. PT. Register today.", "date_str": "2026-09-22T14:00:00+00:00", "hash": "1f8f88ee1d459b06", "title_fa": "4 روز برای صرفه جویی تا 200 دلار: دلیل 2 از 5 برای حضور در TechCrunch Disrupt 2026", "summary_fa": "ما در حال بررسی دومین دلیل برای از دست ندادن Disrupt هستیم که در Moscone West در سانفرانسیسکو، 13 تا 15 اکتبر رخ می دهد. فناوری به سرعت حرکت می کند. تصمیماتی که اکنون می‌گیرید - چه چیزی بسازید، کجا سرمایه‌گذاری کنید، چه کسی را استخدام کنید، از کدام فناوری حمایت کنید، به کدام بازار وارد شوید - می‌تواند شش ماه بعد بسیار متفاوت به نظر برسد. به همین دلیل دیدگاه اهمیت دارد. هوش مصنوعی نحوه ساخت محصولات را تغییر می دهد. شرکت های سرمایه گذاری در حال ارزیابی مجدد محل شرط بندی خود هستند. رباتیک و هوش مصنوعی فیزیکی در حال حرکت به محیط های دنیای واقعی هستند. تقاضای زیرساخت در حال افزایش است. مدل های مالی جدید در حال ظهور هستند. بنیانگذاران در حال ساخت شرکت هایی با تیم های کوچکتر، ابزارهای جدید و انتظارات متفاوت در مورد رشد هستند. Disrupt این فرصت را به شما می دهد که بیشتر عکس را در یک مکان ببینید و از آن برای اطلاع رسانی در مورد کارهای بعدی استفاده کنید. از بیش از 200 جلسه با حضور بیش از 250 رهبر فناوری در شش مرحله صنعت، میزگردها، و جلسات اولیه، اطلاعات بینش داشته باشید. یا بر اساس علایق و عناوین شغلی که می خواهید از طریق خواستگاری مبتنی بر هوش مصنوعی با آنها ارتباط برقرار کنید، مطابقت خود را ملاقات کنید یا از طریق شبکه های بداهه ارتباط برقرار کنید. در سراسر دستور کار، سوالات عملی هستند: اگر شما یک بنیانگذار هستید، شنیدن اینکه چگونه سرمایه گذاران بازارها را ارزیابی می کنند می تواند به واضح تر شدن داستان جمع آوری سرمایه، موقعیت شما و انتخاب هایی که در مورد مکان تمرکز می کنید کمک کند. اگر سرمایه‌گذار هستید، شنیدن مستقیم از سازندگان می‌تواند دید واضح‌تری از پیشرفت فناوری، جایی که پذیرش اتفاق می‌افتد و مشکلاتی که هنوز نیاز به"}, {"source": "TechCrunch AI", "title": "Everyone can find a reason to dislike data center construction", "link": "https://techcrunch.com/2026/09/22/everyone-can-find-a-reason-to-dislike-data-center-construction/", "summary": "Inside two years of fraught AI data center debates in Pennsylvania.", "date_str": "2026-09-22T13:00:00+00:00", "hash": "fa62ecafcfb6dd2b", "title_fa": "همه می توانند دلیلی برای عدم علاقه به ساخت مرکز داده پیدا کنند", "summary_fa": "در دو سال بحث های پرحاشیه مرکز داده هوش مصنوعی در پنسیلوانیا. آزمایشگاه‌های هوش مصنوعی مرزی متقاعد شده‌اند که بزرگ‌کردن محاسبات راهی برای بهبود هوش مصنوعی است، و آنها پول خود را به اندازه تریلیون‌ها دلار پروژه‌های مرکز داده برنامه‌ریزی‌شده در اختیار خود قرار داده‌اند. بقیه ما؟ نظرسنجی‌ها از افکار عمومی نشان می‌دهد که بیش از 60 درصد آمریکایی‌ها از محدود کردن مراکز داده جدید، به‌ویژه در جوامع خود، حمایت می‌کنند. و طولانی ترین نظرسنجی ها نشان می دهد که احساسات به سرعت در حال رشد است. به گفته ردیاب های مرکز دیده بان داده، پروژه های مرکز داده به ارزش 68 میلیارد دلار توسط مخالفان محلی در سه ماهه دوم سال 2026 مختل شدند. شرکت‌های هوش مصنوعی و سرمایه‌گذاران آن‌ها برای تطبیق تقاضای فزاینده برای محصولات خود با مخالفت با زیرساخت‌های کلیدی آن مشکل دارند. برخی از پاسخ‌های صنعت، مانند این ایده که مخالفت با مرکز داده محصول مداخله مخفیانه چین است، واقعاً از آزمون بو عبور نمی‌کند. امروز، گزارش جدیدی از جامعه غیرانتفاعی داده، نگاه عمیق‌تری به آنچه که مخالفت با مراکز داده را فعال می‌کند، ارائه می‌کند. این نتیجه 18 ماه کار میدانی قوم نگاری توسط تیمی از محققان است که با 44 شهروند پنسیلوانیایی بین سال های 2024 تا 2026 مصاحبه کردند. نویسندگانی که از شیوه ارائه هوش مصنوعی انتقاد می‌کنند، سعی نمی‌کنند تأثیر تجربی مراکز داده را اندازه‌گیری کنند، بلکه می‌خواهند شیوه‌ای را درک کنند که مردم بحث درباره ساخت آن‌ها را تجربه می‌کنند. لیویا گاروفالو، محقق جامعه داده، به TechCrunch گفت: یکی از نقاط قوت قوم نگاری و انجام تحقیقات روی زمین برای مدت طولانی، سوراخ کردن حباب تبلیغات هوش مصنوعی است. مردم ناهماهنگی بین هوش مصنوعی که انقلاب صنعتی اجتناب ناپذیر بعدی است و ترس از هوش مصنوعی را درک می کنند."}, {"source": "TechCrunch AI", "title": "Nscale’s IPO will test Wall Street’s appetite for concentrated AI bets once again", "link": "https://techcrunch.com/2026/09/22/nscales-ipo-will-test-wall-streets-appetite-for-concentrated-ai-bets-once-again/", "summary": "The British AI data center developer depends on tech giants Microsoft and Anthropic for most of its revenue.", "date_str": "2026-09-22T12:23:05+00:00", "hash": "a3ab6b9bd49af8e2", "title_fa": "IPO Nscale یک بار دیگر اشتهای وال استریت را برای شرط بندی متمرکز هوش مصنوعی آزمایش خواهد کرد", "summary_fa": "توسعه‌دهنده مرکز داده هوش مصنوعی بریتانیایی برای بیشتر درآمد خود به غول‌های فناوری مایکروسافت و آنتروپیک وابسته است. هنگامی که نئوکلود بریتانیایی Nscale به بازار عرضه می شود، اشتهای سرمایه گذاران عمومی را برای سهامی که درآمد آن عمدتاً به دو مشتری وابسته است را آزمایش می کند. Nscale از زمانی که دو سال پیش از شرکت استخراج ارزهای دیجیتال استرالیایی Arkon Energy خارج شد، طبق پرونده IPO خود، بیش از 103 میلیارد دلار قرارداد جمع آوری کرده است. اما یک نکته وجود دارد: بیشتر آن، حدود 85 درصد، ناشی از قراردادی است برای تأمین مالی مایکروسافت با 43.8 میلیارد دلار محاسبات تا سال 2033، و یک قرارداد تأمین دیگر به ارزش 44.6 میلیارد دلار با Anthropic. علاوه بر این، توافق آنتروپیک مشروط به تامین مالی Nscale است و آزمایشگاه هوش مصنوعی این حق را برای خود محفوظ می‌دارد که اگر Nscale نتواند به نقاط عطفی دست یابد که در پرونده به صراحت به عنوان «سخت‌تر» طبقه‌بندی شده است. تمرکز مشتری Nscale یادآور این است که صنعت هوش مصنوعی چقدر به هم پیوسته است. یک مقاله اخیر توسط صندوق تامین اعتبار Sona Asset Management که در فایننشال تایمز منتشر شد، نشان داد که بسیاری از ارائه دهندگان زیرساخت هوش مصن شریرانه فقط روند حکمرانی جهانی هوش"}, {"source": "The Guardian AI", "title": "Davey says far right in Britain now better funded and supported than in the past – UK politics live", "link": "https://www.theguardian.com/politics/live/2026/sep/22/andy-burnham-donald-trump-un-general-assembly-uk-politics-latest-news", "summary": "Lib Dem leader tells party conference that ‘something big and dangerous is happening in our country’ If Andy Burnham wanted to inject some edge into his meeting with Donald Trump later (which he doesn’t), he could bring along a copy of today’s Financial Times. This front page headline speaks for itself. Mortgages ‘on the front line’ as Iran war deals £840 blow to homeowners British homeowners are paying an average of £840 a year more when they refinance their mortgages, as the rising borrowing costs triggered by the Iran war start to impact consumers’ spending power. Approximately 1m households have rolled off fixed-rate mortgage deals since February, according to Bank of England data. Continue reading...", "date_str": "2026-09-22T14:29:10+00:00", "hash": "e426db4b506c451f", "title_fa": "دیوی می گوید که راست افراطی در بریتانیا اکنون نسبت به گذشته بودجه و حمایت بهتری دارد - سیاست بریتانیا زنده است", "summary_fa": "رهبر دموکرات‌ها به کنفرانس حزبی می‌گوید که «اتفاق بزرگ و خطرناکی در کشور ما در حال رخ دادن است» اگر اندی برنهام بخواهد بعداً به دیدار خود با دونالد ترامپ کمک کند (که نمی‌کند)، می‌تواند نسخه‌ای از فایننشال تایمز امروز را همراه داشته باشد. این تیتر صفحه اول خودش گویای این موضوع است. وام‌های مسکن «در خط مقدم» در حالی که جنگ ایران 840 پوند به صاحبان خانه‌ها وارد می‌کند صاحبان خانه‌های بریتانیایی به‌طور متوسط ​​سالانه 840 پوند بیشتر می‌پردازند که وام‌های مسکن خود را مجدداً تأمین می‌کنند، زیرا افزایش هزینه‌های استقراض ناشی از جنگ ایران شروع به تأثیرگذاری بر قدرت هزینه‌کردن مصرف‌کنندگان کرده است. بر اساس داده های بانک مرکزی انگلستان، تقریباً یک میلیون خانوار از فوریه معاملات وام مسکن با نرخ ثابت را لغو کرده اند. ادامه مطلب... رویدادهای کلیدی 5 متر پیش دیوی می گوید لیبرالیسم در مورد «اعمال قدرت بیشتر به مردم» 9 دقیقه پیش دیوی تعهد دموکرات های لیبرال به سیاست اجتماعی را ستایش می کند 14 دقیقه پیش دیوی می گوید لیبرالیسم «ریشه در دیدن ارزش هر انسان 21 متر پیش دارد. تامین مالی و حمایت شده نسبت به گذشته 44 میلیون پیش، جنریک از انتقاد از شورای اصلاحات بریتانیا به دلیل پایان دادن به همکاری با خیریه ضد نژادپرستی فوتبال خودداری کرد. رضایت از تهدید روسیه، اما می‌گوید می‌خواهد از تشدید تنش جلوگیری کند 4 ساعت پیش وزیر سابق کابینه از برنهام خواست تا به متحدانی بپیوندد که خواهان آزمایش اجباری و پیش از انتشار مدل‌های هوش مصنوعی مرزی هستند 5 ساعت پیش شماره 10 تایید کرد که منچستر میزبان اجلاس G20 سال آینده خواهد بود. نظرات انتقادی گذشته درباره ترامپ را کاهش داد و گفت که درست است که 6 ساعت قبل از آنها فراتر برویم."}, {"source": "The Guardian AI", "title": "Superpowers cannot solve world’s problems, UN chief says in final general assembly address", "link": "https://www.theguardian.com/world/2026/sep/22/un-chief-antonio-guterres-final-general-assembly-address", "summary": "António Guterres says humanity faces unprecedented convergence of threats but mechanisms for collective action are under growing strain The world’s fault lines have turned from cracks into canyons as superpowers show that they alone do not have the military, economic and technological power to guarantee security or solve the world’s problems, the outgoing secretary general of the United Nations has said in his final address to the general assembly. In a speech laced with despair but also glimpses of defiant hope, António Guterres said that over the last decade, largely spanning his 10-year period in office, “wars erupted with devastating consequences and dragged on with despicable cruelty. Civilians were targeted. Human rights trampled. Hunger weaponised. Humanitarians killed. International law cast aside.” Continue reading...", "date_str": "2026-09-22T13:30:55+00:00", "hash": "39be2890d40f1afb", "title_fa": "دبیرکل سازمان ملل در آخرین سخنرانی مجمع عمومی گفت: ابرقدرت ها نمی توانند مشکلات جهان را حل کنند", "summary_fa": "آنتونیو گوترش می‌گوید بشریت با همگرایی بی‌سابقه‌ای از تهدیدها مواجه است، اما مکانیسم‌های اقدام جمعی تحت فشار فزاینده‌ای قرار دارند. دبیرکل نهایی سازمان ملل متحد در مجمع عمومی سازمان ملل متحد در مجمع عمومی سازمان ملل گفت: خطوط گسل جهان از شکاف‌ها به دره‌ها تبدیل شده‌اند زیرا ابرقدرت‌ها نشان می‌دهند که آنها به تنهایی قدرت نظامی، اقتصادی و فناوری برای تضمین امنیت یا حل مشکلات جهان را ندارند. آنتونیو گوترش در یک سخنرانی که سرشار از ناامیدی و همچنین چشم‌اندازهایی از امید نافرمان بود، گفت که در دهه گذشته، که عمدتاً دوره 10 ساله ریاست جمهوری او را در بر می‌گیرد، \"جنگ‌ها با عواقب ویرانگر شروع شد و با ظلم نفرت‌انگیزی به طول انجامید. غیرنظامیان هدف قرار گرفتند. حقوق بشر مورد تجاوز قرار گرفت. حقوق بشر توسط گرسنگی زیر پا گذاشته شد.\" به خواندن ادامه دهید... وی ادامه داد: شکاف های ژئوپلیتیکی عمیق تر شده، نابرابری ها تشدید شده است، اعتماد از بین رفته است. بحران آب و هوا از هشدار دور به واقعیت روزمره تبدیل شد. و هوش مصنوعی با سرعتی حرکت کرد که حتی کسانی را که آن را ایجاد کردند کور کرده است. او بدون نام بردن از اسرائیل، گفت آنچه پس از حمله حماس در اکتبر 2023 \"حمله ای به فلسطینیان در غزه بود، با مقیاسی از کشتار و ویرانی که من در تمام سال های دبیرکلی ام شاهد آن بوده ام.\" او شرکت‌های انرژی سودجو را به دلیل «در نظر گرفتن جهان به‌عنوان یک فاضلاب باز» مورد انتقاد قرار داد، حذف آفریقا از یک مکان دائمی در شورای امنیت سازمان ملل را خیره‌کننده توصیف کرد و خواستار یک قرارداد جدید برای تنظیم مقررات هوش مصنوعی شد. سیاستمدار و دیپلمات پرتغالی 77 ساله در سراسر جهان استدلال کرد که یک سیستم چندجانبه با محوریت یک سازمان ملل متحد که به تازگی نماینده سازمان ملل است، تنها"}, {"source": "The Guardian AI", "title": "Using AI to ‘talk to animals’ might make us feel clever – but what, if anything, does it do for them?", "link": "https://www.theguardian.com/technology/ng-interactive/2026/sep/22/animal-language-recordings-ai", "summary": "As animal behaviorists increasingly use AI in their research, they grapple with how to wield the technology responsibly I’m sitting in a small boat in Shark Bay, Australia, eavesdropping on a conversation between some of Earth’s most intelligent beings. The motor is off, the turquoise sea is glassy, and Stephanie King and I are motionless, transfixed by the whistles, clicks and squeezy, whirring noises made by the dolphins swimming below us. If anyone could tell me what these big-brained social mammals are saying, it would be her. Based at the University of Bristol, she co-leads Shark Bay Dolphin Research , one of the longest-running wild dolphin research projects in the world. She has spent thousands of hours watching and listening to this population. Continue reading...", "date_str": "2026-09-22T12:00:54+00:00", "hash": "5de11c943856093d", "title_fa": "استفاده از هوش مصنوعی برای \"صحبت کردن با حیوانات\" ممکن است باعث شود ما احساس باهوشی کنیم - اما اگر چیزی برای آنها انجام شود چه کاری انجام می دهد؟", "summary_fa": "از آنجایی که رفتارشناسان حیوانات به طور فزاینده ای از هوش مصنوعی در تحقیقات خود استفاده می کنند، با نحوه استفاده مسئولانه از این فناوری دست و پنجه نرم می کنند. موتور خاموش است، دریای فیروزه‌ای شیشه‌ای است، و من و استفانی کینگ بی‌حرکت مانده‌ایم، سوت‌ها، کلیک‌ها و صداهای فشردگی که توسط دلفین‌هایی که زیر ما شنا می‌کنند، متحیر شده‌ایم. اگر کسی می توانست به من بگوید این پستانداران اجتماعی با مغز بزرگ چه می گویند، او بود. او که در دانشگاه بریستول مستقر است، رهبری تحقیقات دلفین خلیج کوسه، یکی از طولانی‌ترین پروژه‌های تحقیقاتی دلفین‌های وحشی در جهان را بر عهده دارد. او هزاران ساعت را صرف تماشای و گوش دادن به این جمعیت کرده است. به خواندن ادامه دهید... مانند بسیاری دیگر از رفتارشناسان حیوانات، کینگ به طور فزاینده ای هوش مصنوعی را در روند تحقیقات خود ادغام می کند. او می‌گوید: «اگر از هوش مصنوعی مسئولانه استفاده شود، هوش مصنوعی می‌تواند آنچه را که می‌توانیم با داده‌هایی که جمع‌آوری می‌کنیم انجام دهیم، تغییر دهد. اما وقتی از او می‌پرسم که آیا هوش مصنوعی روزی به ما اجازه می‌دهد «دلفین صحبت کنیم»، کمی سفت می‌شود. او می‌گوید: «من فکر می‌کنم ما با تمرکز بر این سؤال به حیوانات آسیب می‌رسانیم. دلفین‌ها با وزوز، سوت، سوت و سایر سیگنال‌های صوتی ارتباط برقرار می‌کنند، پیمایش می‌کنند و غذا پیدا می‌کنند. این صداها در خلیج کوسه، غرب استرالیا از طریق یک میکروفون زیر آب توسط امی مارتین برای پادکست Threshold ضبط شده است، کینگ می گوید، مشکل خود هوش مصنوعی نیست، بلکه روایتی است که حول آن ساخته شده است. او حوزه کاری خود را به‌طور فزاینده‌ای به عنوان تلاشی برای یک مترجم حیوانات به کمک هوش مصنوعی می‌بیند، با سرفصل‌هایی که اعلام می‌کنند ما تقریباً «زبان مخفی» موجودات مختلف را شکسته‌ایم یا در شرف «رمزگشایی گفتار حیوانات» هستیم. حتی برای"}, {"source": "The Guardian AI", "title": "OpenAI’s George Osborne says datacentre nimbys holding back Britain", "link": "https://www.theguardian.com/politics/2026/sep/22/george-osborne-ai-datacentre-nimbys-holding-back-britain", "summary": "Former chancellor, now senior figure at OpenAI, says UK needs datacentres to maintain ‘sovereignty’ over AI tech UK politics live – latest updates Datacentre nimbys are holding Britain back, George Osborne has said in reaction to nationwide protests about the giant water- and energy-guzzling structures. The former Tory chancellor is now the head of AI for countries at OpenAI, the developer of ChatGPT. His job is to represent the company to governments around the world and he also has a role in enabling the building of datacentres and other infrastructure. Continue reading...", "date_str": "2026-09-22T11:46:01+00:00", "hash": "e3fb0bed7f0752e2", "title_fa": "جورج آزبورن از OpenAI می‌گوید مرکز داده‌ها بریتانیا را مهار می‌کند", "summary_fa": "جورج آزبورن در واکنش به اعتراضات سراسری درباره ساختارهای غول پیکر آب و انرژی گفت: صدراعظم سابق که اکنون یکی از اعضای ارشد OpenAI است، می گوید که بریتانیا برای حفظ \"حاکمیت\" بر سیاست های فناوری هوش مصنوعی بریتانیا به طور زنده نیاز دارد - آخرین به روز رسانی ها نیمبی های مرکز داده بریتانیا را عقب نگه می دارند. صدراعظم سابق محافظه‌کاران اکنون رئیس هوش مصنوعی کشورها در OpenAI، توسعه‌دهنده ChatGPT است. وظیفه او نمایندگی شرکت به دولت‌های سراسر جهان است و همچنین نقشی در ایجاد مراکز داده و سایر زیرساخت‌ها دارد. ادامه مطلب... آزبورن در سخنرانی روز یکشنبه در جشنواره بیگ برو در سامرست گفت: «شما سعی می‌کنید یک مرکز داده در بریتانیا بسازید... من زندگی‌ام را در زمانی که سیاستمدار بودم صرف این کردم که مردم را به ایجاد جاده‌ها و خطوط راه‌آهن جدید و باند فرودگاه‌ها بپذیرند و جوامع دست به دست هم بدهند – ساختن مرکز داده واقعاً سخت است». او گفت که اگر بریتانیا اجازه ساخت مراکز داده را ندهد، «حاکمیت» خود را بر فناوری از دست خواهد داد. او توضیح داد: \"شما می توانید انتخاب کنید که این دیتاسنترها را در اوهایو، جورجیا و میشیگان داشته باشید، جایی که همه آنها در حال ساخت هستند... ما اجازه نمی دهیم این چیزها ساخته شوند. آنها قرار است در جای دیگری ساخته شوند، و می دانید که این از دست دادن کنترل حاکمیتی بر مکان فیزیکی است که این چیزها در آن قرار دارند.\" اعتراضاتی در مورد مراکز داده در سراسر بریتانیا، از جمله در مرکز لندن، دوون و خارج از Holyrood در ادینبورگ وجود داشته است. مردم گفته‌اند که آسیبی به چشم‌انداز هستند، از اینکه آیا شغل‌هایی را به منطقه محلی می‌آورند یا نه، و استدلال می‌کنند که سرمایه‌گذاری و فضایی را که می‌تواند برای مسکن مقرون‌به‌صرفه استفاده شود، خواهند گرفت. همچنین نگرانی هایی"}, {"source": "The Guardian AI", "title": "AI is generating a new wave of US populism. It could be a tipping point | Robert Reich", "link": "https://www.theguardian.com/commentisfree/2026/sep/22/ai-economic-populism-tipping-point", "summary": "It’s becoming obvious to many Americans that corporations have been raking it in while workers take it on the chin Last week, the unlikely duo of Bernie Sanders and Steve Bannon both spoke before a Washington group demanding a stop to AI and its datacenters. Notably, both lambasted the corporate oligarchs behind AI. Continue reading...", "date_str": "2026-09-22T10:00:52+00:00", "hash": "e22cf1512f1e16ce", "title_fa": "هوش مصنوعی موج جدیدی از پوپولیسم ایالات متحده را ایجاد می کند. می تواند یک نقطه اوج باشد | رابرت رایش", "summary_fa": "برای بسیاری از آمریکایی‌ها بدیهی است که شرکت‌ها در حالی که کارگران آن را be a bubble and there was no evidence it is making the economy more efficient, as the Albanese government claims the technology will solve Australia’s economic malaise. Ahead of an expected interest rate rise next week Michele Bullock also said the slump in house prices was deeper than others in Australia’s recent history. Continue reading...", "date_str": "2026-09-22T08:54:50+00:00", "hash": "ca772328915e7019", "title_fa": "میشل بولاک می‌گوید هوش مصنوعی می‌تواند یک حباب باشد و هنوز استرالیا را سازنده‌تر نمی‌کند", "summary_fa": "رئیس RBA می‌گوید هوش مصنوعی «امید بزرگ سفید» است، اما پذیرش آن تا کنون به جای رشد اقتصادی به تورم افزوده است. ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید. رئیس بانک مرکزی گفت که هوش مصنوعی می‌تواند یک حباب باشد و هیچ مدرکی وجود ندارد که اقتصاد را کارآمدتر می‌کند، زیرا دولت آلبانی ادعا می‌کند که این فناوری مشکلات اقتصادی استرالیا را حل می‌کند. میشل بولاک پیش از افزایش نرخ بهره در هفته آینده نیز گفت که افت قیمت مسکن عمیق‌تر از سایرین در تاریخ اخیر استرالیا بوده است. به خواندن ادامه دهید... قیمت های نفت و تورم دوباره بر بازارها فشار می آورد، اما سهام فناوری ایالات متحده روز دوشنبه پس از اینکه صاحب فیس بوک متا نماینده جدید هوش مصنوعی Muse خود را معرفی کرد و شاهد افزایش 11 درصدی سهام آن بود، افزایش یافت. بولاک که در یک رویداد CEDA در سیدنی صحبت می کرد، گفت که رکود بی نظم در ارزش های فناوری می تواند به فعالیت های اقتصادی آسیب برساند. بولاک گفت: «همه بانک‌های مرکزی کمی نگران این موضوع هستند. \"بعضی از مردم فکر می کنند یک حباب است، برخی افراد نه. من دیدگاه خاصی به این صورت ندارم، اما این خطری است که فکر می کنم ما در حال تماشای آن هستیم.\" بولاک گفت RBA و همکارانش در خارج از کشور بر این باور بودند که هوش مصنوعی «امید سفید بزرگ» برای بهره‌وری بیشتر اقتصادها است، اما هنوز نشانه‌ای از هیچ اثری دیده نشده است، با پذیرش سریع و سرمایه‌گذاری در مراکز داده که به جای آن بر تورم افزوده است. او به تحقیقات همتای کره‌ای RBA اشاره کرد که نشان می‌دهد کارمندانی که از هوش مصنوعی استفاده می‌کنند تمایل به تولید همان خروجی دارند اما هر هفته 1.5 ساعت کمتر کار می‌کنند. بولاک گفت: «[در حالی که]"}, {"source": "The Guardian AI", "title": "British Columbia sues OpenAI and Sam Altman over Tumbler Ridge mass school shooting", "link": "https://www.theguardian.com/technology/2026/sep/22/british-columbia-sues-openai-sam-altman-tumbler-ridge-school-shooting", "summary": "Canadian province alleges deadly attack could have been prevented if company had warned police of shooter’s ChatGPT use British Columbia has sued OpenAI in California, saying a mass shooting at a school in the province could have been prevented if the company had warned local ⁠law enforcement that the shooter ⁠had used ChatGPT to ​plan the massacre. The lawsuit filed in San Francisco federal court on Monday names OpenAI and its CEO, Sam Altman, as defendants. It is seeking damages to fund recovery efforts in the province after the February attack, as well as an order directing changes to the way the company handles ChatGPT conversations that could lead to violence. Continue reading...", "date_str": "2026-09-22T04:29:22+00:00", "hash": "f1d2611ecda15ee8", "title_fa": "بریتیش کلمبیا از OpenAI و سم آلتمن به دلیل تیراندازی در مدرسه Tumbler Ridge شکایت کرد", "summary_fa": "اگر این شرکت به پلیس در مورد استفاده تیرانداز از ChatGPT هشدار داده بود، استان کانادا ادعا می کند که می توان از حمله مرگبار جلوگیری کرد. شکایتی که روز دوشنبه در دادگاه فدرال سانفرانسیسکو ثبت شد، OpenAI و مدیر عامل آن، سام آلتمن، به عنوان متهم معرفی شدند. این شرکت به دنبال خسارات مالی برای تلاش‌های بازیابی در استان پس از حمله فوریه است، و همچنین دستوری برای تغییر در نحوه مدیریت مکالمات ChatGPT که می‌تواند منجر به خشونت شود، توسط شرکت انجام شود. به خواندن ادامه دهید... نه نفر، عمدتاً کودک، در تیراندازی در مدرسه در تامبلر ریج، بریتیش کلمبیا کشته شدند. تیرانداز، جسی وان روتسلار، پس از صحبت‌هایش در مورد خشونت با اسلحه توسط تیم ایمنی شرکت پرچم‌گذاری شده بود، اما شرکت به پلیس هشدار نداد. آلتمن نامه ای به جامعه منتشر کرد و گفت که \"عمیقا متأسف است\" OpenAI با مجری قانون تماس نگرفته است. در این دادخواست می‌گوید که او وعده اصلاحات را داده بود، اما علیرغم تلاش‌های دادستان کل بریتیش کلمبیا برای مشارکت، هرگز آن را دنبال نکرد. مدرسه ای که تیراندازی در آن رخ داده در حال تخریب است و طبق دادخواست، استان مجبور شده است هزینه های مدرسه جایگزین، مراقبت های روانی و سایر عوارض تیراندازی را جبران کند. درو پوساتری، سخنگوی OpenAI، تیراندازی در Tumbler Ridge را یک تراژدی غیرقابل توصیف خواند. \"OpenAI همچنان متعهد به همکاری با مقامات دولتی و مجری قانون، و ادامه پیشبرد کار ایمنی مداوم ما است.\""}, {"source": "The Guardian AI", "title": "Halt super-intelligent AI with non-proliferation treaty, Ed Davey to say", "link": "https://www.theguardian.com/politics/2026/sep/21/halt-super-intelligent-ai-ed-davey-lib-dem-conference", "summary": "At Lib Dems’ conference in Brighton, leader will accuse Andy Burnham of relying on Donald Trump and ‘tech bros’ to solve problem Ed Davey is to call for a global nuclear-style non-proliferation treaty to halt the development of super-intelligent AI when he makes his keynote speech at the Liberal Democrat conference, accusing Andy Burnham of relying on Donald Trump and “tech bros” to solve the problem. When he addresses the faithful on the final day of the gathering in Brighton, the party leader will call for a global pause on super-intelligent AI, comparing it to a nuclear arms race that could result in technology that could “destroy us all”. Continue reading...", "date_str": "2026-09-21T21:30:26+00:00", "hash": "1ed24376e7363103", "title_fa": "اد دیوی می گوید هوش مصنوعی فوق هوشمند را با معاهده منع گسترش تسلیحات متوقف کنید", "summary_fa": "در کنفرانس لیبرال دموکرات ها در برایتون، رهبر، اندی برنهام را متهم می کند که برای حل مشکل به دونالد ترامپ متکی است و «برادران فناوری» برای حل مشکل اد دیوی می خواهد خواستار یک معاهده جهانی منع گسترش سلاح های هسته ای برای متوقف کردن توسعه هوش مصنوعی فوق هوشمند باشد، در حالی که سخنرانی اصلی خود را در کنفرانس لیبرال دموکرات ها در مورد «برادرهام ترامپ را به حل مجدد فناوری Andy» ایراد می کند. مشکل هنگامی که او در آخرین روز گردهمایی در برایتون به مومنان سخنرانی می کند، رهبر حزب خواستار توقف جهانی هوش مصنوعی فوق هوشمند خواهد شد و آن را با یک مسابقه تسلیحات هسته ای مقایسه می کند که می تواند منجر به فناوری شود که می تواند همه ما را نابود کند. ادامه مطلب... انتظار می‌رود دیوی در سخنرانی خود در روز سه‌شنبه برنامه‌هایی را برای یک آژانس بین‌المللی ایمنی بین‌المللی جدید - با الگوبرداری از آژانس بین‌المللی انرژی اتمی (IAEA) و مقر آن در بریتانیا، پس از هشدارهای متعدد از سوی محققان هوش مصنوعی در مورد اینکه هوش مصنوعی می‌تواند بشریت را در دهه آینده نابود کند، ارائه دهد. او می‌گوید: «ما بمب اتم را به چند میلیاردر واگذار نکردیم تا خودشان پلیس کنند. انتظار می‌رود دیوی خواستار یک جنبش جهانی جدید برای همکاری با یکدیگر برای محافظت از بشریت در برابر خطرات هوش مصنوعی فوق‌هوشمند شود و گفت که آژانس بین‌المللی انرژی اتمی توسط کشورهایی ساخته شده است که «با هم کار می‌کنند تا فناوری‌ای را کنترل کنند که می‌تواند همه ما را نابود کند»، اما هشدار می‌دهد که آینده هوش مصنوعی توسط «تعداد کمی از ثروتمندترین و قدرتمندترین افراد در کالیفرنیا و پکن» بدون هیچ گونه پیشرفتی آهسته تعیین می‌شود. دیوی می گوید: \"به عنوان لیبرال ها - ما می دانیم که چیزی به اندازه سلاح های هسته ای"}, {"source": "The Guardian AI", "title": "Stop relying on AI chatbots for customer care, UK banks and energy firms told", "link": "https://www.theguardian.com/technology/2026/sep/21/stop-relying-on-chatbots-for-customer-care-uk-service-providers-urged", "summary": "Citizens Advice says providers of essential services such as energy, banking, phone and internet should guarantee the ‘right to talk to a human’ Stop relying on AI chatbots for customer care and guarantee the “right to talk to a human”, Citizens Advice has urged essential service providers, as research found they wasted time, caused stress and delayed problem solving for more than half of users. The spread of the AI-powered systems to provide help about the provision of vital services such as energy, banking, phones and internet, is making it harder for millions of already digitally excluded people to handle snags, according to the frontline charity that last year provided more than 2.7 million people with one-on-one help in England and Wales. Continue reading...", "date_str": "2026-09-21T16:35:31+00:00", "hash": "08e4d6531ab678ca", "title_fa": "بانک ها و شرکت های انرژی بریتانیا اعلام کردند که برای مراقبت از مشتری به چت ربات های هوش مصنوعی تکیه نکنید", "summary_fa": "Citizens Advice می گوید که ارائه دهندگان خدمات ضروری مانند انرژی، بانکداری، تلفن و اینترنت باید «حق صحبت با یک انسان» را تضمین کنند، از اتکا به ربات های چت هوش مصنوعی برای مراقبت از مشتری خودداری کنند و «حق صحبت با یک انسان» را تضمین کنند، Citizens Advice از ارائه دهندگان خدمات ضروری خواسته است، زیرا تحقیقات نشان می دهد که آنها باعث اتلاف وقت، استرس و تاخیر در حل مشکل برای بیش از نیمی از کاربران شده اند. به گفته این موسسه خیریه خط مقدم که سال گذشته به بیش از 2.7 میلیون نفر در انگلیس و ولز کمک کرد، گسترش سیستم‌های مبتنی بر هوش مصنوعی برای ارائه خدمات حیاتی مانند انرژی، بانک، تلفن و اینترنت، رسیدگی به مشکلات را برای میلیون‌ها نفر از افرادی که قبلاً از نظر دیجیتالی محروم شده‌اند، دشوارتر می‌کند. ادامه مطلب... این موسسه خیریه به این نتیجه رسید که چت‌بات‌ها باعث آسیب می‌شوند و می‌گویند اغلب انسان‌ها را در یک «حلقه بی‌پایان» به دام می‌اندازند که در آن هیچ چیز حل نمی‌شود، و تقریباً نیمی از افرادی که مجبور به استفاده از چت‌بات بودند، آنها را مفید نمی‌دانستند، و برخی به این نتیجه رسیدند که چت‌بات تقلبی به نظر می‌رسد که «من را وادار کند تسلیم شوم». این سازمان از ارائه دهندگان خدمات خواست تا پس از بررسی تأثیر گسترده‌تر محرومیت دیجیتال که حداقل 14 میلیون شهروند بریتانیا را تحت تأثیر قرار می‌دهد، به حق جدیدی برای مشتریان برای صحبت با انسان احترام بگذارند. این پشتیبانی کندتر و کمتر قابل اعتماد را برای افرادی که با سیستم‌های آنلاین مشکل دارند یا دسترسی محدودی به آن دارند، کشف کرد و دریافت که فرسایش ارتباطات تلفنی، رو در رو و کاغذی یک سیستم پشتیبانی دو لایه ایجاد کرده است. تام مک‌اینز، مدیر سیاست‌گذاری در Citizens Advice می‌گوید: «دور زدن با چت‌بات نه تنها آزاردهنده نیست،"}, {"source": "The Guard  Snap، Twitch، Anthropic، Meta، Discord، Microsoft، Apple، Roblox، Reddit و غیره. مارک لئون، مدیر لنترن، در بیانیه‌ای گفت: همکاری بین پلتفرمی برای شناسایی و ایجاد اختلال در استثمار و سوء استفاده جنسی از کودکان ضروری است و مشارکت TikTok USDS JV به تقویت اجرای هماهنگ در سراسر اکوسیستم فناوری گسترده‌تر کمک می‌کند. منطقی است که TikTok US به Lantern بپیوندد، زیرا اکثر رقبای آن در حال حاضر در برنامه شرکت می کنند. تا سال 2025، لنترن می گوید که شرکت های شرکت کننده بیش از 2 میلیون سیگنال رفتار بالقوه نقض کننده را به اشتراک گذاشته اند. همانطور که از نظر قانونی از شرکت‌های مستقر در ایالات متحده خواسته شده است، سرمایه‌گذاری آمریکایی TikTok هنگامی که از مواد سوء استفاده جنسی از کودکان (CSAM) و سایر تهدیدات برای ایمنی کودکان آگاه می‌شود، به مرکز ملی کودکان گمشده و مورد استثمار (NCMEC) گزارش داده است. این شرکت در حال حاضر همچنین 2 میلیون دلار را به تلاش های NCMEC برای مدرن سازی CyberTipline خود اختصاص می دهد. TikTok در بیانیه‌ای مطبوعاتی گفت: این سرمایه‌گذاری به NCMEC کمک می‌کند تا ابزارهای جستجو، اتوماسیون و تجزیه و تحلیل"}, {"source": "TechCrunch Main", "title": "Singapore’s Nexstrom wants to bring 2D semiconductors to chip fabs", "link": "https://techcrunch.com/2026/09/22/singapores-nexstrom-wants-to-bring-2d-semiconductors-to-chip-fabs/", "summary": "Singapore-based Nexstrom has raised new funding to develop equipment that could help chipmakers manufacture 2D semiconductor materials at scale.", "date_str": "2026-09-22T13:20:00+00:00", "hash": "d3cdb80d59000ba0", "title_fa": "Nexstrom سنگاپور می خواهد نیمه هادی های دو بعدی را به کارخانه های تراشه بیاورد", "summary_fa": "Nexstrom مستقر در سنگاپور بودجه جدیدی را برای توسعه تجهیزاتی جمع آوری کرده است که می تواند به سازندگان تراشه در تولید مواد نیمه هادی دو بعدی در مقیاس کمک کند. برای دهه‌ها، سازندگان تراشه به دنبال ساختن نیمه‌هادی‌ها سریع‌تر از طریق کوچک کردن ترانزیستورهای سیلیکونی و بسته‌بندی تعداد بیشتری از آنها بر روی هر تراشه بودند. اما کوچک شدن ترانزیستورها مشکلات خاص خود را دارد: کنترل جریان الکترون سخت‌تر می‌شود، که مشکلاتی مانند نشت، تلفات برق و گرما را تشدید می‌کند. Nexstrom، یک استارت آپ نیمه هادی که توسط Xora Innovation انکوبه شده است، فکر می کند استفاده از مواد دو بعدی (2 بعدی) به جای سیلیکون، یکی از راه های عملی برای حل این مشکل است، به خصوص که کمبود جهانی قطعات ناشی از تقاضا برای مراکز داده هیچ نشانه ای از رها شدن نشان نمی دهد. این شرکت مستقر در سنگاپور در حال ساخت تجهیزات و فرآیندهایی است که به کارخانه های ریخته گری اجازه می دهد نیمه هادی های بسیار نازکی را که به نام دی کالکوژنیدهای فلزات انتقالی (TMDs) شناخته می شوند، مستقیماً روی ویفرهای تراشه ای بسازند. اکنون، TMD ها واقعاً دو بعدی نیستند. آنها به قدری باریک هستند که برای نشان دادن نازکی آنها با خانواده بزرگی از مواد که به آنها مواد دوبعدی می گویند دوباره جمع شدند. TMD ها فقط چند لایه اتمی ضخامت دارند، ویژگی ای که توجه سازندگان تراشه را به دنبال راه هایی برای کوچک کردن بیشتر اندازه تراشه ها جلب کرده است. این استارت‌آپ می‌گوید محصولش به نام ستاره شمالی، برای رشد مستقیم TMD‌ها روی ویفرهای 300 میلی‌متری (12 اینچی) که در تولید تراشه‌های تجاری استفاده می‌شوند، طراحی شده است. این استارتاپ در شناخت پتانسیل استفاده از نیمه هادی های دوبعدی برای کوچک کردن بیشتر تراشه ها تنها نیست. TSMC، اینتل و IMEC بلژیک همگی در حال"}, {"source": "TechCrunch Main", "title": "Bill Gates’ Breakthrough Energy bets these 21 startups will shape energy’s future", "link": "https://techcrunch.com/2026/09/22/bill-gates-breakthrough-energy-bets-these-21-startups-will-shape-energys-future/", "summary": "To the investors at Bill Gates's Breakthrough Energy, the coming wave of electrification will make data center energy demands look quaint by comparison. Here's how they're preparing.", "date_str": "2026-09-22T13:00:00+00:00", "hash": "fdf073b36bd118e2", "title_fa": "بیل گیتس شرط می‌بندد که این ۲۱ استارت‌آپ آینده انرژی را شکل خواهند داد", "summary_fa": "برای سرمایه‌گذاران شرکت انرژی پیشرفت بیل گیتس، موج برقی‌سازی آینده باعث می‌شود که تقاضای انرژی مرکز داده در مقایسه عجیب به نظر برسد. در اینجا نحوه آماده سازی آنها آمده است. در حالی که جهان روی نیازهای انرژی مراکز داده هوش مصنوعی متمرکز است، افراد شرکت Breakthrough Energy به آن توجه می کنند، اما نه به دلایلی که ممکن است فکر کنید. مراکز داده 10 درصد نسبت به تقاضای یکسان برای برق در 30 سال گذشته افزایش یافته اند. اریک تون، شریک مدیر شرکت Breakthrough Energy Ventures به TechCrunch گفت: بنابراین به نظر می رسد یک دست انداز بزرگ است، اما مراکز داده کاملا قناری در معدن زغال سنگ هستند. پیش‌بینی می‌شود که این تقاضا افزایش یابد زیرا کشورها تمام بخش‌های اقتصاد خود را برای مهار انتشار کربن برق می‌دهند. تون گفت: «برق کردن همه چیز به معنای افزایش 3 برابری تقاضا برای برق است. به عبارت دیگر، دهه‌های آینده تقلای امروز برای قدرت را در مقایسه عجیب و غریب جلوه خواهند داد. برای کمک به آماده شدن برای آینده، Breakthrough Energy چندین سال گذشته را صرف حمایت از تعداد انگشت شماری از استارت آپ های اولیه با برنامه Breakthrough Energy Fellows خود کرده است. قسمت امسال که ششمین آن است، طیفی از شرکت‌ها و فناوری‌ها را شامل می‌شود که از کشاورزی و همجوشی هسته‌ای گرفته تا رباتیک و بهره‌وری انرژی مرکز داده را در بر می‌گیرد. TechCrunch یک نگاه انحصاری به گروه ورودی دریافت کرد. این گروه از همراهان اولین باری است که از زمانی که اشلی گروش، که قبلاً برنامه Fellows را رهبری می کرد، برای تبدیل شدن به یک شریک در WovenEarth Ventures، اعلام شد. به گفته تون، در این بین، بنجامین گدی، مدیر ارشد، به عنوان مدیر اجرایی فعالیت می کند، در حالی که سازمان تصمیم می گیرد چه چیزی در آینده رخ دهد."}, {"source": "TechCrunch Main", "title": "Meta deal will help plastics recycling startup MacroCycle build its first factory", "link": "https://techcrunch.com/2026/09/22/meta-deal-will-help-plastics-recycling-startup-macrocycle-build-its-first-factory/", "summary": "Meta is giving plastic recycling a boost in a new deal with startup MacroCycle, which is building its first commercial plant.", "date_str": "2026-09-22T11:00:00+00:00", "hash": "64169faf00fe4cf5", "title_fa": "قرارداد متا به استارتاپ بازیافت پلاستیک MacroCycle کمک می کند تا اولین کارخانه خود را بسازد", "summary_fa": "متا در یک قرارداد جدید با استارتاپ MacroCycle که در حال ساخت اولین کارخانه تجاری خود است، بازیافت پلاستیک را تقویت می کند. استارت آپ بازیافت پلاستیک MacroCycle روز سه شنبه قرارداد جدیدی را با متا اعلام کرد که به سرعت توسعه اولین کارخانه تجاری آن کمک می کند. MacroCycle سه ساله، مستقر در کمبریج، ماساچوست، روش جدیدی را برای پردازش زباله های پلاستیکی ایجاد کرده است که آنها را از آلاینده ها پاک می کند و مواد بازیافتی حاصل را برای مشتریان جذاب تر می کند. این استارت‌آپ می‌گوید که فناوری آن ۸۰ درصد کمتر از پلاستیک PET بکر غیر بازیافتی (نوع معمول پلاستیکی که در بطری‌ها، ظروف و منسوجات استفاده می‌شود)، انتشار کربن کمتری تولید می‌کند. MacroCycle یکی از 20 فینالیست برتر در رقابت Startup Battlefield در سال 2025 در TechCrunch Disrupt در سانفرانسیسکو بود. بر اساس مفاد این قرارداد، متا برای حقوق انتشارات اجتناب‌شده به MacroCycle پرداخت می‌کند، که به متا امکان می‌دهد کاهش را در ردپای کربن خود حساب کند، که در نتیجه رونق هوش مصنوعی به شدت در حال رشد است. یکی از سخنگویان متا تایید کرد که این اولین قراردادی است که این شرکت امضا کرده است. MacroCycle پیش نمایشی انحصاری از اخبار را به TechCrunch داد. پرداخت برای آنچه که به عنوان اعتبار ویژگی های زیست محیطی (EACs) شناخته می شود، جریان درآمدی را برای MacroCycle فراهم می کند که می تواند به حمایت از ساخت کارخانه جدید کمک کند، کارخانه ای که با توجه به منافع متا ایالات متحده ساخته می شود، فراتر از خود اعتبار است. امیدوار است بتواند به ایجاد بازاری برای مواد کم کربن مانند پلاستیک کمک کند که در زنجیره تامین آن برای مواردی مانند بسته بندی و سخت افزار استفاده می شود. با رشد آن بازار، دسترسی گسترده تر به آن مواد باید به کاهش ردپای کربن"}, {"source": "TechCrunch Main", "title": "Morphotonics raises €40M to expand its display tech into data centers", "link": "https://techcrunch.com/2026/09/21/morphotonics-raises-e40m-as-it-tk-tk-tk-t/", "summary": "Deep tech company Morphotonics raises €40M from investors including 3M Ventures, Innovation Industries, BOM, and Invest-NL.", "date_str": "2026-09-22T06:00:00+00:00", "hash": "88186e381eeb5526", "title_fa": "Morphotonics برای گسترش فناوری نمایشگر خود به مراکز داده 40 میلیون یورو جمع آوری می کند", "summary_fa": "شرکت فناوری عمیق Morphotonics 40 میلیون یورو از سرمایه گذارانی از جمله 3M Ventures، Innovation Industries، BOM و Invest-NL جمع آوری می کند. هلند ASML احتمالاً بزرگ‌ترین نام در لیتوگرافی است که از ماشین‌های خود برای حک کردن الگوها بر روی ویفرهای سیلیکونی در داخل کارخانه تولید تراشه‌های رایانه‌ای به نام fab استفاده می‌کند. شرکت هلندی Morphotonics کوچک‌تر است و در گوشه‌ای از همان زمینه کار می‌کند: لیتوگرافی نانوایمپرنت یا NIL، فرآیندی که برای تولید نمایشگرها در عینک‌های AR و سایر اپتیک‌ها استفاده می‌شود. گفت که از زنجیره تامین ASML سود برده است و از بسیاری از فروشندگان مشابه استفاده می کند. Morphotonics 12 سال را صرف توسعه این فناوری کرده است که عمدتاً زیر نظر رادار است. اکنون، با افزایش تقاضا برای عینک‌های هوشمند و سایر اپتیک‌ها، این شرکت روز سه‌شنبه اعلام کرد که ۴۰ میلیون یورو برای افزایش تولید و ورود به بازاری جدید جمع‌آوری کرده است: قطعات نوری برای مراکز داده. صندوق شورای نوآوری اروپا (EIC)، Ernij Next (یک دفتر خانواده هلندی)، و بانک سرمایه گذاری اروپا (EIB) نیز شرکت کردند. کار Morphotonics NIL به این معنی است که استارت‌آپ یک مهر ایجاد می‌کند و آن را روی مواد حساس به نور اعمال می‌کند تا انواع مختلفی از نمایشگرها را ایجاد کند، از عینک‌های واقعیت افزوده گرفته تا صفحه‌های حریم خصوصی برای خودروها. این برای ایجاد فناوری موجبر مورد استفاده در عینک های هوشمند، از جمله نمایشگر Meta Ray-Ban، Even Reality و Magic Leap مفید است. موجبرها قطعات نازکی از شیشه یا پلاستیک هستند که نور را در یک مسیر مشخص منحرف می کنند تا تصویری را در مقابل چشم کاربر نمایش دهند. عینک هوشمند تنها یکی از کاربردهای فناوری Morphotonics است، اما در حال حاضر بیشترین تقاضا را دارد. این هفته چین اعلام کرد که فروش عینک های هوشمند در این کشور در هشت ماه اول"}, {"source": "TechCrunch Main", "title": "Kairos Power gets up to $100M from Samsung group to build nuclear reactor for Google", "link": "https://techcrunch.com/2026/09/21/kairos-power-gets-up-to-100m-from-samsung-group-to-build-nuclear-reactor-for-google/", "summary": "Future Google supplier Kairos Power inked a deal with Samsung C T to help build its first 50-megawatt nuclear power plant.", "date_str": "2026-09-21T18:23:05+00:00", "hash": "367c028ab1533571", "title_fa": "Kairos Power تا 100 میلیون دلار از گروه سامسونگ برای ساخت رآکتور هسته ای برای گوگل دریافت می کند", "summary_fa": "تامین‌کننده آینده گوگل Kairos Power قراردادی با سامسونگ C T برای کمک به ساخت اولین نیروگاه هسته‌ای 50 مگاواتی خود امضا کرد. کایروس پاور شرکت مهندسی سامسونگ سی تی را برای کمک به ساخت رآکتور نمایشی 50 مگاواتی خود برای گوگل انتخاب کرده است که این استارت آپ هسته ای قصد دارد تا سال 2030 آن را تکمیل کند. کایروس پاور روز دوشنبه گفت: به عنوان بخشی از این قرارداد، سامسونگ سی تی سرمایه گذاری سهام در کایروس انجام خواهد داد و خدمات مهندسی \"غیر نوع\" را ارائه خواهد کرد که ارزش ترکیبی آن تا 100 میلیون دلار است. سخنگوی کایروس به TechCrunch گفت که سرمایه گذاری سهام 70 میلیون دلار از کل آن را تشکیل می دهد. سامسونگ سی تی حدود دوازده راکتور هسته ای را در سرتاسر جهان ساخته یا به ساخت آن کمک کرده است. کایروس بخشی از موجی از استارت‌آپ‌های هسته‌ای است که از افزایش تقاضای برق از مراکز داده هوش مصنوعی بهره‌مند شده‌اند. گوگل برای اولین بار در پاییز 2024 با این شرکت قراردادی امضا کرد و از کایروس خواست تا سال 2035 راکتورهای هسته ای بسازد که قادر به تولید حدود نیم گیگاوات برق باشند. در حال حاضر، کایروس در حال ساخت دو راکتور در اوک ریج، تنسی است. اولین مورد، هرمس 1، یک نمایشگر کم مصرف است که به شرکت کمک می کند طراحی تجاری خود را اصلاح کند. دومی، هرمس 2، اولین رآکتور تجاری کایروس است. خروجی هرمس به عنوان 50 مگاوات اول قراردادش با گوگل به حساب می آید. این استارت آپ در اواخر سال 2024 مجوز کمیسیون تنظیم مقررات هسته ای را برای ساخت این راکتورها دریافت کرد. انتظار می رود هرمس 2 در راستای توافق اولیه خود با گوگل در سال 2030 فعالیت خود را آغاز کند. هرمس 2 یک راکتور با دمای بالا خنک‌شده با نمک فلوراید خواهد"}, {"source": "TechCrunch Main", "title": "X will now tell users when governments have forced it to limit their posts", "link": "https://techcrunch.com/2026/09/21/x-will-now-tell-users-when-governments-have-forced-it-to-limit-their-posts/", "summary": "X is expanding its “Under the Hood” transparency tool to show when posts have been downranked or withheld in response to local laws and government demands, including which country made the request.", "date_str": "2026-09-21T17:45:35+00:00", "hash": "16b0f861dd771389", "title_fa": "X اکنون به کاربران می گوید که چه زمانی دولت ها آن را مجبور به محدود کردن پست های خود کرده اند", "summary_fa": "X ابزار شفافیت «زیر سرپوش» خود را گسترش می‌دهد تا نشان دهد چه زمانی پست‌ها در پاسخ به قوانین محلی و درخواست‌های دولت، از جمله کشوری که این درخواست را انجام داده، کاهش یافته یا متوقف شده‌اند. X روز دوشنبه اعلام کرد که اکنون به کاربران می‌گوید که چه زمانی پست‌های آن‌ها به دلیل رعایت قوانین محلی، به افراد کمتری نشان داده می‌شود. این ویژگی گسترش ابزار شفاف سازی قبلی شبکه اجتماعی به نام Under the Hood است که به کاربران اجازه می دهد تا ببینند آیا برچسب هایی روی حساب یا پست های آنها اعمال شده است که می تواند روی دید آنها در پلتفرم تأثیر بگذارد. همچنین هرگونه کاهش رتبه پست های کاربران به دلیل فیلتر محتوای مورد نیاز دولت را برجسته می کند. پیش از این، اطلاعاتی درباره نحوه برچسب‌گذاری و رتبه‌بندی پست‌های یک کاربر X برای کاربران نهایی در دسترس نبود. در نتیجه، بسیاری اغلب این شرکت را که قبلاً توییتر نامیده می‌شد، متهم می‌کردند که آن‌ها را shadowban کرده است. علاوه بر این، اکثر شرکت‌هایی که داده‌های درخواست‌های دولتی را به اشتراک می‌گذارند، این کار را به صورت مجموع از طریق گزارش‌های شفاف انجام می‌دهند، نه در سطح حساب یا پست. زمانی که در ماه آگوست، X ابزار شفافیت خود را برای ارائه دید بیشتر به تصمیمات اعتدال خود به کار برد، شروع به تغییر کرد. گزینه Under the Hood در تنظیمات برنامه X به هر کسی که حداقل 10 بار در طول ماه پست گذاشته است، اجازه می دهد تا آمار انبوه خود را به عنوان یک فایل JSON، یک فرمت داده استاندارد، دانلود کند. (کاربران غیر فنی می توانند فایل را در هر چت ربات هوش مصنوعی رها کنند تا توضیح داده شود.) همین روند اکنون نشان می دهد که آیا دید یک حساب یا پست ها محدود شده است زیرا X با"}, {"source": "TechCrunch Main", "title": "Oura’s $2.2B IPO is mostly a payday for existing shareholders", "link": "https://techcrunch.com/2026/09/21/ouras-2-2b-ipo-is-mostly-a-payday-for-existing-shareholders/", "summary": "Forerunner Ventures plans to sell its entire stake in Oura for as much as $1.26 billion, according to Oura's latest IPO filing.", "date_str": "2026-09-21T16:45:47+00:00", "hash": "6507572bf8bde22e", "title_fa": "عرضه اولیه سهام 2.2 میلیارد دلاری Oura بیشتر یک روز پرداخت برای سهامداران فعلی است", "summary_fa": "بر اساس آخرین بایگانی اولیه شرکت Oura، Forerunner Ventures قصد دارد کل سهام خود در Oura را به مبلغ 1.26 میلیارد دلار بفروشد. اورا، سازنده حلقه های هوشمند، به دنبال جذب 2.2 میلیارد دلار در عرضه اولیه اولیه سهام خود است، اما به نظر می رسد سرمایه گذاران فعلی آن کسانی هستند که در این فرآیند کسب درآمد خواهند کرد. با توجه به پرونده به روز شده IPO شرکت، Oura و سهامدارانش با هم 50 میلیون سهم را با قیمتی بین 40 تا 44 دلار برای هر کدام عرضه می کنند. اما بیشتر درآمدهای IPO به سهامدارانی که 36.5 میلیون سهم یا تقریباً دو سوم کل را عرضه می کنند، خواهد رفت. اگر شرکت 42 دلار به ازای هر سهم، یعنی نقطه میانی محدوده قیمت را فهرست کند، درآمدی در حدود 1.53 میلیارد دلار برای سهامداران و 567 میلیون دلار برای شرکت، قبل از کارمزد و هزینه‌ها به همراه خواهد داشت. بخش عمده ای از آن به Forerunner Ventures، دومین سهامدار بزرگ این شرکت اختصاص خواهد یافت. این شرکت مخاطره‌آمیز قصد دارد کل 9.3 درصد سهام خود را که حدود 28.7 میلیون سهام است، به قیمت حدود 1.20 میلیارد دلار (با فرض فهرست سهام 42 دلار) قبل از پذیره‌نویسی هزینه‌ها و مالیات بفروشد. سهام Forerunner تقریباً 80٪ از سهام فروخته شده توسط سهامداران موجود در معامله را تشکیل می دهد. طبق گفته PitchBook، Forerunner برای اولین بار در شرکت Oura در دور سری B در سال 2020، 28 میلیون دلار سرمایه گذاری کرد. در همین حال، به نظر نمی‌رسد Oura با این IPO به عنوان یک رویداد جمع‌آوری سرمایه برخورد کند. در نقطه میانی 42 دلار، شرکت انتظار دارد درآمد خالص 532.6 میلیون دلاری داشته باشد و قصد دارد از حدود 526.4 میلیون دلار برای پرداخت تعهدات مالیاتی انباشته مربوط به کمک‌های سهام کارکنان که در زمان عرضه اولیه سهام"}, civilian space agency, told a gathering of military leaders and defense contractors last week near Washington, DC, that the 21st century race to the Moon is more than a battle of ideologies. The sweet spot for a Moon base, Isaacman said, is a relatively small region near the lunar south pole, and there are tangible implications for who gets there first. The Moon's south pole harbors substantial quantities of water ice concentrated on the floors of craters away from the reach of sublimating rays of sunlight. The ice inside these eternally dark craters could be used to supply water, air, and rocket fuel for a Moon base, supporting a permanent settlement and providing a springboard for future expeditions to Mars. Read full article Comments", "date_str": "2026-09-22T11:00:37+00:00", "hash": "9f7d6bdec2cbd7dc", "title_fa": "رئیس ناسا: من فقط به \"معاملات خوب\" شرکای بین المللی علاقه مند هستم", "summary_fa": "مدیر آژانس گفت: ناسا باید در راه ایجاد مشارکت های بین المللی گزینشگرتر باشد زیرا مسابقه برای رسیدن به ماه از یک نبرد برای اعتبار ملی بین ایالات متحده و چین به رقابتی پرمخاطره برای املاک و منابع فرازمینی تبدیل می شود. جارد آیزاکمن که اکنون در دهمین ماه خود در راس بزرگترین آژانس فضایی غیرنظامی جهان قرار دارد، هفته گذشته در جمع رهبران نظامی و پیمانکاران دفاعی در نزدیکی واشنگتن دی سی گفت که مسابقه قرن بیست و یکم برای رسیدن به ماه چیزی بیش از نبرد ایدئولوژی ها است. ایزاکمن گفت که نقطه شیرین یک پایگاه ماه، یک منطقه نسبتا کوچک در نزدیکی قطب جنوبی ماه است و پیامدهای ملموسی برای اینکه چه کسی زودتر به آنجا می رسد وجود دارد. قطب جنوب ماه دارای مقادیر قابل توجهی یخ آب است که در کف دهانه ها به دور از دسترس پرتوهای تصعید کننده نور خورشید متمرکز شده است. یخ درون این دهانه‌های تاریک ابدی می‌تواند برای تامین آب، هوا و سوخت موشک برای پایگاه ماه مورد استفاده قرار گیرد، از یک استقرار دائمی حمایت کند و سکوی پرشی برای سفرهای آتی به مریخ فراهم کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین pent years developing these defenses to prevent installed apps or commands entered into the terminal from accessing these resources, clearly because the company considers them a security threat. Muse completely undoes these default measures. Read full article Comments", "date_str": "2026-09-21T22:24:38+00:00", "hash": "a8b296563ab9905c", "title_fa": "Muse، دستیار هوش مصنوعی فوق‌العاده ممتاز متا، یک 0 روز جدی دارد.", "summary_fa": "مارک زاکربرگ، بنیانگذار و مدیر عامل متا، تمام تلاش خود را کرده است تا امنیت دستیار هوش مصنوعی جدید خود Muse را مطرح کند و ادعا کند که این دستیار «از پایه برای حفظ حریم خصوصی و امنیت ساخته شده است». یک آسیب‌پذیری روز صفر که به برنامه‌های اجرا شده محلی و دستورات ترمینال کنترل کامل عامل را می‌دهد، تردیدهای جدی را ایجاد می‌کند. با ایجاد سؤالات بیشتر، آمازون روز یکشنبه شروع به مسدود کردن Muse از سایت خود کرد. متا چند هفته پیش Muse را معرفی کرد. دستیار «قرار ملاقات‌ها را رزرو می‌کند، فرم‌ها را پر می‌کند و خدمات مشتری را انجام می‌دهد»، «به‌طور پیشگیرانه وظایف را حذف می‌کند» و می‌تواند «خرید کند، تصاویر تولید کند، اسناد ایجاد کند و با برنامه‌ها و خدمات مورد علاقه‌تان ارتباط برقرار کند». برنامه macOS (به طرز عجیبی، نسخه ویندوزی وجود ندارد) همچنین با حساب های WhatsApp، ایمیل، تقویم و رسانه های اجتماعی کاربر کار می کند. هنگامی که یک کار به ابزاری نیاز دارد که وجود ندارد، Muse در حال ایجاد آن است. البته، برای اینکه Muse هر یک از این کارها را انجام دهد، ابتدا کاربران باید به آن اجازه دسترسی به حساب های خود را بدهند. این شامل احراز هویت دستیار برای هر سرویس است و از آنجایی که برنامه روی macOS اجرا می شود، به آن مجوز برای طیف گسترده ای از منابع دستگاه محدود شده توسط سیستم عامل مانند نوشتن فایل ها روی دیسک، دسترسی به میکروفون و دوربین، و نظارت بر مکان و تقویم ها می دهد. اپل سال‌ها صرف توسعه این سیستم‌های دفاعی کرده است تا از دسترسی برنامه‌های نصب شده یا دستورات وارد شده به ترمینال به این منابع جلوگیری کند، زیرا این شرکت آنها را یک تهدید امنیتی می‌داند. Muse این معیارهای پیش‌فرض را کاملاً خنثی می‌کند. مقاله کامل را بخوانید نظرات تنظیمات متن"}, {"source": "Ars Technica", "title": "Military milestone: Ukrainian naval drone sinks Russian kamikaze drone boat", "link": "https://arstechnica.com/gadgets/2026/09/military-milestone-ukrainian-naval-drone-sinks-russian-kamikaze-drone-boat/", "summary": "In the world’s first clash of the drone boats, a Ukrainian naval drone destroyed a Russian explosive drone boat using a remote-controlled machine gun turret. This comes as the war in Ukraine has already seen widespread deployment of such uncrewed surface vessels in combat, along with swarms of flying attack drones and ground robots. The lopsided battle took place on September 12 when members of Ukraine’s Defense Intelligence detected the Russian uncrewed surface vessel (USV) in the Black Sea and directed a Ukrainian Navy drone boat to intercept. The Russian vessel was “positively identified” as an Orcan surface drone with a “jet ski type steerable water jet” designed to ram targets and explode, according to naval analyst HI Sutton in Naval News . Such Orcan drones have already been used to attack Ukrainian ports and ships. These often work in coordination with flying drones such as Russian Geran drones that provide aerial reconnaissance and can boost communication between drone operators and drone boats, Sutton explained. Read full article Comments", "date_str": "2026-09-21T21:07:05+00:00", "hash": "98df42b98a51b52f", "title_fa": "نقطه عطف نظامی: پهپاد نیروی دریایی اوکراین قایق پهپاد کامیکازه روسیه را غرق کرد", "summary_fa": "در اولین درگیری قایق های بدون سرنشین جهان، یک پهپاد نیروی دریایی اوکراین با استفاده از برجک مسلسل کنترل از راه دور یک قایق پهپاد انفجاری روسیه را منهدم کرد. این در حالی رخ می دهد که جنگ در اوکراین قبلاً شاهد استقرار گسترده چنین کشتی های سطحی بدون سرنشین در نبرد، همراه با انبوهی از پهپادهای تهاجمی پرنده و روبات های زمینی بوده است. این نبرد در 12 سپتامبر زمانی رخ داد که اعضای اطلاعات دفاعی اوکراین کشتی روسی بدون سرنشین (USV) را در دریای سیاه شناسایی کردند و به یک قایق بدون سرنشین نیروی دریایی اوکراین دستور دا flagship vehicles you see here—the Exobot sedan and SUV—are demonstrations of what the company is capable of and the vision it sees for future vehicles in the portfolio. It plans to have seven new cars in its portfolio by 2030—some of which will be hybrids—and while that doesn’t currently include sales outside the GCC (Gulf Cooperation Council) region, Ceer says it's building a competitive, world-class product and that if the demand is there, expansion is possible. Read full article Comments", "date_str": "2026-09-21T20:55:36+00:00", "hash": "89420360172225b9", "title_fa": "عربستان سعودی خواهان صنعت خودرو است، Ceer را با دو خودروی الکتریکی راه اندازی می کند", "summary_fa": "Ceer پروازهایی از دیترویت به ریاض، عربستان سعودی و محل اقامت فراهم کرد تا Ars بتواند از کارخانه بازدید کند. Ars محتوای تحریریه پولی را نمی پذیرد. شهر اقتصادی ملک عبدالله، عربستان سعودی—ممکن است برای برخی تعجب آور باشد، اما عربستان سعودی هرگز یک خودروساز داخلی نداشته است. این با Ceer تغییر می کند. این سرمایه‌گذاری مشترک بین صندوق سرمایه‌گذاری عمومی کشور و فاکس‌کان، اولین خودروساز داخلی پادشاهی است و بخش قابل‌توجهی از برنامه چشم‌انداز 2030 عربستان سعودی برای تنوع بخشیدن به اقتصاد این کشور به دور از تولید نفت و ارائه نوآوری‌های فنی در سطح محلی تا پایان دهه است. Ceer در زبان عربی به معنای «راندن به جلو» است و این رویکرد آینده‌نگر در خط خودرو اعمال می‌شود. خودروهای پرچمداری که در اینجا می بینید - سدان و SUV Exobot - نشان دهنده توانایی این شرکت و چشم اندازی است که برای وسایل نقلیه آینده در مجموعه می بیند. این شرکت قصد دارد تا سال 2030 هفت خودروی جدید در کارنامه خود داشته باشد - که برخی از آنها هیبریدی خواهند بود - و در حالی که در حال حاضر شامل فروش خارج از منطقه GCC (شورای همکاری خلیج فارس) نمی شود، Ceer می گوید که در حال ساخت یک محصول رقابتی و در سطح جهانی است و اگر تقاضا وجود داشته باشد، توسعه آن امکان پذیر است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین اطلاعات بیشتر را به حداقل برسانید. این با Ceer تغی
