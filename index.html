ا وجود این ارتباط‌ها الزاماً به معنای آن نیست که انگل رفتار حیوان را تغییر داده است."}, {"source": "Zoomit", "title": "آنر رسما قیمت گوشی مورد انتظار «مجیک ۹» را اعلام کرد", "link": "https://www.zoomit.ir/mobile/467817-honor-magic-9-price-announced/", "summary": "آنر قیمت رسمی گوشی پرچمدار مجیک ۹ را چند روز پیش از برگزاری رویداد رونمایی در ۶ مهر اعلام کرد.", "date_str": "2026-09-25T15:15:00+00:00", "hash": "48d7579a4f5b0d6b", "title_fa": "آنر رسما قیمت گوشی مورد انتظار «مجیک ۹» را اعلام کرد", "summary_fa": "آنر قیمت رسمی گوشی پرچمدار مجیک ۹ را چند روز پیش از برگزاری رویداد رونمایی در ۶ مهر اعلام کرد. تبلیغات آنر قیمت گوشی جدید مجیک ۹ را چند روز پیش از برگزاری رویداد رونمایی در ۲۸ سپتامبر (۶ مهر) اعلام کرد. مدیرعامل آنر در جریان مراسم بزرگداشت ۱۰ سالگی این سری، قیمت پرچمدار جدیدش را اعلام کرد. قیمت پایه‌ی گوشی آنر در بازار چین ۶٬۴۹۹ یوان (حدود ۹۶۱ دلار) تعیین شده که به ادعای آنر کمترین قیمت در میان پرچمداران هم‌رده است. خریداران به مناسبت دهمین سالگرد عرضه‌ی سری مجیک می‌توانند دستگاه را با تخفیف ویژه و به قیمت ۵٬۹۹۹ یوان (حدود ۸۸۷ دلار) تهیه کنند. افراد واجد شرایط دریافت یارانه‌ی دولتی در چین نیز این پرچمدار را با قیمت ۵٬۴۹۹ یوان (حدود ۸۱۳ دلار) می‌خرند که ۱٬۰۰۰ یوان کمتر از بهای اصلی دستگاه است. لی جیان ، مدیرعامل آنر، می‌گوید:‌ «گوشی مجیک ۹ نمونه‌ای برجسته از رویکرد ما در آزمایش ایده‌های تازه در دنیای فناوری است و محصولی برای کاربران قدیمی و همراهان تازه‌ی خانواده‌ی مجیک به شمار می‌رود.» خانواده‌ی جدید شامل سه مدل مجیک ۹، مجیک ۹ پرو مکس و مجیک ۹ سوپر ادیشن خواهد بود. مدل سوپر ادیشن به فن خنک‌کننده‌ی داخلی فعال مجهز است و تمام مدل‌ها از پردازنده‌ی قدرتمند Snapdragon 8 Elite Gen 6 همراه با تراشه‌ی اختصاصی H1 استفاده خواهند کرد. طراحی ماژول دوربین پشتی بازطراحی شده و یک اکستندر تله‌فوتو ۵۰۰ میلی‌متری نیز در میان لوازم جانبی این سری به چشم می‌خورد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Business Insider", "title": "Stanford dean says AI labs are competing with universities for faculty: 'I won't lie, I worry about this'", "link": "https://www.businessinsider.com/stanford-business-dean-worry-ai-lab-poaching-2026-9", "summary": "Dean Sarah Soule told Business Insider that it s super hard to forecast the school s AI budget. Stanford University Sarah Soule, the dean of Stanford's Graduate School of Business, sat down with Business Insider. She expressed two big AI-fueled worries: budgets and staffing. Stanford isn't alone. Most school leaders are \"really worried about this issue,\" she said. There's a fight for AI talent that's playing out in the classroom. Sarah Soule, the dean of Stanford's Graduate School of Business , told Business Insider that frontier AI labs — with their enormous computing resources , data, and coming IPOs — are becoming an increasingly powerful draw for professors. \"There is an allure for faculty,\" she said about the trend. \"I won't lie, I worry about this.\" The pull is already evident at Stanford. Andrew Hall and Chad Jones, two GSB professors, are both on leave this year. And Stanford University isn't alone. Soule had just gotten off a public panel with Aaron Chatterji, OpenAI's chief economist , who is on leave from Duke University. Stanford lets its tenured faculty take two years of unpaid leave to join the private sector every seven years. Faculty can take longer leaves for government service, as the school's former provost, Condoleezza Rice, did to become the Secretary of State. Professors often come back to the school, the University told Business Insider. Westley Hartmann, who has taught at Stanford since 2003, took seven months of unpaid leave to work for Amazon. Still, the trend comes as AI labs continue to substantially strengthen their recruiting hand. Leading AI labs continue to amass capital, computing power, and market influence. Working inside one can offer researchers a chance to shape a technology with enormous economic and social consequences — and, potentially, share in its financial upside. Stanford said it does not view faculty collaborations or industry leaves as zero-sum losses. The university described them as part of a broader ecosystem that can help professors stay close to technological development and bring those experiences back into their research, teaching, and work with students. \"There's no question that the opportunity to work with frontier AI labs is attractive to faculty,\" Kristin Harlan, the head of dean's communications for Stanford's GSB, said. \"We see those relationships as complementary to Stanford's academic mission, not separate from it.\" Soule said academia still offers something the labs cannot: freedom to pursue ", "date_str": "2026-09-26T09:15:01+00:00", "hash": "e175418de3e09ff1", "title_fa": "رئیس دانشگاه استنفورد می‌گوید آزمایشگاه‌های هوش مصنوعی در حال رقابت با دانشگاه‌ها برای جذب اساتید هستند: «دروغ نمی‌گویم، نگران این هستم».", "summary_fa": "دین سارا سول به Business Insider گفت که پیش بینی بودجه هوش مصنوعی مدرسه بسیار سخت است. سارا سوله، رئیس دانشکده بازرگانی دانشگاه استنفورد، با Business Insider به گفتگو نشست. او دو نگرانی بزرگ ناشی از هوش مصنوعی را بیان کرد: بودجه و کارکنان. استنفورد تنها نیست او گفت که اکثر مدیران مدارس \"واقعاً نگران این موضوع هستند.\" یک مبارزه برای استعدادهای هوش مصنوعی در کلاس درس وجود دارد. سارا سول، رئیس دانشکده تحصیلات تکمیلی بازرگانی استنفورد، به Business Insider گفت که آزمایشگاه‌های هوش مصنوعی مرزی - با منابع محاسباتی عظیم، داده‌ها و عرضه‌های اولیه سهام در آینده - در حال تبدیل شدن به جذابیت فزاینده‌ای برای اساتید هستند. او در مورد این روند گفت: \"هیچ جذابیتی برای اساتید وجود دارد.\" \"دروغ نمی گویم، نگران این هستم.\" کشش در حال حاضر در استنفورد مشهود است. اندرو هال و چاد جونز، دو استاد GSB، هر دو امسال در مرخصی هستند. و دانشگاه استنفورد تنها نیست. سول به تازگی از یک پنل عمومی با آرون چاترجی، اقتصاددان ارشد OpenAI که از دانشگاه دوک در مرخصی است خارج شده بود. استنفورد به اعضای هیئت علمی خود اجازه می دهد هر هفت سال یکبار دو سال مرخصی بدون حقوق بگیرند تا به بخش خصوصی بپیوندند. اعضای هیئت علمی می توانند برای خدمت دولتی مرخصی های طولانی تری بگیرند، همانطور که استاد پیشین مدرسه، کاندولیزا رایس، برای تصدی سمت وزیر امور خارجه انجام داد. دانشگاه به Business Insider گفت که استادان اغلب به مدرسه بازمی گردند. وستلی هارتمن که از سال 2003 در استنفورد تدریس می کند، هفت ماه مرخصی بدون حقوق گرفت تا در آمازون کار کند. با این حال، این روند زمانی رخ می‌دهد که آزمایشگاه‌های هوش مصنوعی همچنان به تقویت قابل ملاحظه‌ای دست خود را در جذب نیرو ادامه می‌دهند. آزمایشگاه های پیشرو هوش مصنوعی به جمع آوری سرمایه، قدرت محاسباتی و"}, {"source": "Business Insider", "title": "We partied with VCs at an astrology app launch. On the menu: anxiety, love, and manifesting money.", "link": "https://www.businessinsider.com/we-got-tarot-read-vc-rooftop-lora-astrology-app-launch-2026-9", "summary": "Business Insider s Grace Lett and Sydney Bradley at an astrology app s launch party in New York City. Sydney Bradley/BI We attended the launch party for Lora, a new astrology app, at a VC rooftop. Lora offers in-depth analysis about a user's birth chart, an AI chatbot feature, and more. We chatted with techies about their star signs and had a tarot reader look into our love lives. It was the day after the Fall Equinox, and we were partying on a rooftop, pulling tarot cards about our love lives. The location might surprise you: a venture capital firm's office overlooking the Manhattan skyline. Wait, what's astrology got to do with venture capital? We were at a launch party for a social-astrology app called Lora. The party was hosted by Lora founder Michelle Parsons at the offices of her pre-seed backer — AlleyCorp — in SoHo. Astrology is a hot subject in tech. Co-Star, a leading social app for the star-inclined, was acquired by AI company Midjourney this summer, casting a spotlight on the space. Investors and the astrology-obsessed alike want to know: Will an AI-era app take the crown as the next big app in the sector? We got our tarot read. Sydney Bradley/BI \"This is a space I've been thinking about for a long time,\" said Luc Ryan-Schreiber , an investor at AlleyCorp who spearheads the firm's incubation projects — including Lora. \"With AI, there was an opportunity to do something a little bit more interactive.\" Lora, for instance, lets users interact with an AI-powered chatbot that offers advice on personal development, relationships — pretty much anything you want — based on your astrological birth chart. While there is a litany of other astrology apps ready for download, perhaps the biggest competitors in the market are the larger LLM models themselves. Anyone can upload their star chart to ChatGPT or Claude , and then spend hours on end prompting the machine to spit out answers. Lora's founder, Parsons, said she didn't want to put out another app that gives people the answers they want to hear. Instead of \"sycophantic\" responses from an AI bot or a straightforward daily horoscope, Parsons wants Lora to help people recognize \"patterns\" in their lives, whether in relationships or in private. Lora founder Michelle Parsons previously cofounded queer social app Lex and held posts at Hinge, Netflix, and Spotify. Courtesy of Lora There are still humans involved in Lora's experience, too, in the form of real-life astrologists, tarot readers, or coaches people c", "date_str": "2026-09-26T09:05:02+00:00", "hash": "4e5d9a9bf2ae9b9f", "title_fa": "در راه اندازی اپلیکیشن طالع بینی با VC ها جشن گرفتیم. در منو: اضطراب، عشق، و پول آشکار.", "summary_fa": "گریس لِت و سیدنی بردلی از Business Insider در جشن راه اندازی اپلیکیشن طالع بینی در شهر نیویورک. سیدنی بردلی/BI ما در جشن راه اندازی لورا، یک برنامه طالع بینی جدید، در پشت بام VC شرکت کردیم. لورا تجزیه و تحلیل عمیقی در مورد نمودار تولد کاربر، ویژگی ربات چت هوش مصنوعی و موارد دیگر ارائه می دهد. ما با متخصصان فن در مورد نشانه های ستاره آنها گپ زدیم و از یک تاروت خوان به زندگی عاشقانه ما نگاهی انداختیم. روز بعد از اعتدال پاییزی بود، و ما در پشت بام جشن می گرفتیم و کارت های تاروت را درباره زندگی عاشقانه خود می کشیدیم. مکان ممکن است شما را شگفت زده کند: دفتر یک شرکت سرمایه گذاری خطرپذیر مشرف به خط افق منهتن. صبر کنید، طالع بینی چه ربطی به سرمایه گذاری مخاطره آمیز دارد؟ ما در یک جشن راه اندازی یک اپلیکیشن طالع بینی اجتماعی به نام لورا بودیم. این مهمانی توسط بنیانگذار لورا، میشل پارسونز، در دفاتر حامی اولیه او - AlleyCorp - در سوهو برگزار شد. طالع بینی یک موضوع داغ در فناوری است. Co-Star، یک برنامه اجتماعی پیشرو برای افراد متمایل به ستاره، تابستان امسال توسط شرکت هوش مصنوعی Midjourney خریداری شد و فضا را مورد توجه قرار داد. سرمایه‌گذاران و علاقه‌مندان به طالع بینی به طور یکسان می‌خواهند بدانند: آیا یک برنامه عصر هوش مصنوعی به عنوان برنامه بزرگ بعدی در این بخش تاج را به خود اختصاص می‌دهد؟ ما تاروتمان را خواندیم. لوک رایان شرایبر، سرمایه‌گذار در AlleyCorp که پروژه‌های جوجه کشی این شرکت از جمله لورا را رهبری می‌کند، می‌گوید: «این فضایی است که مدت‌ها به آن فکر می‌کردم». \"با هوش مصنوعی، فرصتی برای انجام کاری کمی تعاملی تر وجود داشت.\" به عنوان مثال، Lora به کاربران اجازه می دهد تا با یک چت ربات مجهز به هوش مصنوعی که بر"}, {"source": "Business Insider", "title": "A health scare taught Steph Curry that tiny health details matter. Now he's serious about recovery — and the power of saunas.", "link": "https://www.businessinsider.com/steph-curry-sauna-recovery-biohacking-longevity-routine-2026-9", "summary": "Point guard Stephen Curry is a top shooter in the NBA who keeps his edge with Adam Pantozzi/NBAE via Getty Images Steph Curry loves to hit the infrared sauna to keep his brain and body at peak performance. The 38-year-old athlete said it's a key part of his longevity routine as he keeps playing at a high level. Emerging research on saunas suggests that Steph Curry says his most important recovery tool isn't a fancy supplement or stretch. When he wraps up a tough workout or intense game, his first stop is the sauna. At 38 years old, on his feet all day running up and down the court, a recovery routine isn't optional. \"It's so easy to just skip and be like, 'I'll be fine tomorrow,'\" the NBA superstar told Business Insider, but he never does. The sauna, he said, is one of the most essential. He's not alone: In recent years, saunas have grown beyond being a nice extra for athletes, becoming central to the modern-day wellness routine of an elite player. Though the science is thin, the trend is booming, buoyed by buzzy research suggesting that saunas offer powerful benefits and by professional teams incorporating saunas into their routines. Curry wasn't always strict about his recovery routine. His \"aha moment\" about his health came around age 30, he said, when a manager noticed Curry was squinting during games and asked if he had gotten his eyes checked. Curry was diagnosed with keratoconus, which can distort vision and worsen over time, even leading to blindness. He has a new partnership with eye health company Glaukos to raise awareness about proactive vision care , and said contact lenses and routine check-ups keep his vision crystal-clear. But the health scare prompted him to rethink how small details can have a huge impact on performance. \"You have to be as intentional as I am on the court when I'm trying to beat my defender,\" Curry said. \"It's the same exact energy. All these things add up to me being in my best shape as an athlete.\" A new approach to longevity The top point scorer for the Golden State Warriors has a stacked toolkit that he uses to stay in top shape, including a nutrient-dense diet and deep sleep. Curry said his typical routine includes plenty of unglamorous, foundational health habits, such as a strict sleep schedule and a nutrient-dense diet. In recent years, he's become curious about new ways to optimize his routine and isn't afraid to dabble in more experimental, high-tech strategies to get an edge on the court. Curry has an active re", "date_str": "2026-09-26T09:05:01+00:00", "hash": "7688bae58016aa0e", "title_fa": "ترس از سلامتی به استف کاری آموخت که جزئیات کوچک سلامتی اهمیت دارد. اکنون او در مورد بهبودی جدی است - و قدرت سونا.", "summary_fa": "پوینت گارد استفن کری یک تیرانداز برتر در NBA است که از طریق Getty Images با آدام پانتوزی/NBAE برتری دارد. این ورزشکار 38 ساله گفت که این بخش مهمی از زندگی طولانی مدت او است زیرا او به بازی در سطح بالایی ادامه می دهد. تحقیقات نوظهور در مورد سونا نشان می دهد که استف کوری می گوید مهم ترین ابزار ریکاوری او یک مکمل یا کشش فانتزی نیست. وقتی او یک تمرین سخت یا بازی شدید را به پایان می رساند، اولین توقف او سونا است. در 38 سالگی، در تمام طول روز روی پاهایش در حال دویدن در زمین بازی است، روال ریکاوری اختیاری نیست. فوق ستاره NBA به Business Insider گفت: \"این خیلی آسان است که فقط از کنارش بگذریم و بگوییم که \"من فردا خوب می شوم\"، اما او هرگز این کار را نمی کند. او گفت که سونا یکی از ضروری ترین موارد است. او تنها نیست: در سال‌های اخیر، سونا فراتر از اینکه یک وسیله اضافی خوب برای ورزشکاران باشد، رشد کرده است، و به مرکز روال سلامتی امروزی یک بازیکن نخبه تبدیل شده است. اگرچه علم نازک است، اما این روند در حال رونق است، به دلیل تحقیقات پر سر و صدا که نشان می دهد سونا مزایای قدرتمندی را ارائه می دهد و توسط تیم های حرفه ای که سونا را در روال خود قرار می دهند. کری همیشه در مورد روتین بهبودی خود سختگیر نبود. او گفت که \"لحظه آها\" او در مورد سلامتی اش حدود 30 سالگی بود، زمانی که یکی از مدیران متوجه شد که کری در حین بازی ها چشمانش را نگاه می کند و از او پرسید که آیا چشمانش را چک کرده است یا خیر. کوری مبتلا به قوز قرنیه تشخیص داده شد که می تواند بینایی را مخدوش کرده و با گذشت زمان بدتر شود"}, {"source": "Business Insider", "title": "I've helped hundreds of kids land Wall Street jobs. Here's how I train them.", "link": "https://www.businessinsider.com/wall-street-internship-investment-banking-ut-austin-2026-9", "summary": "Xavier Sztejnberg has helped hundreds of students get internships through his Wall Street leadership program. Xavier Sztejnberg Xavier Sztejnberg founded Wall Street for McCombs, a leadership training program at UT Austin. He's helped hundreds of students land internships and jobs on Wall Street over the past decade. Extensive technical training, a strong alumni base, and good relationships with banks are key. This as-told-to essay is based on a conversation with Xavier Sztejnberg, a finance professor at the McCombs School of Business at the University of Texas Austin, who previously worked in M A. He founded the Wall Street for McCombs Leadership Program in 2016. The conversation has been edited for length and clarity . When I started Wall Street for McCombs a decade ago, we sent fewer than 10 UT students to New York for investment banking. UT Austin was a powerhouse in Houston, but we realized we needed a major presence in New York to become a powerhouse school in finance generally. For the summer of 2027, we've helped around 150 students land internships at more than 50 banks, and we've focused on growing our market share at the very top firms. There's a very rigorous admissions process for my program now that interest has swelled. Students apply during their sophomore year, and we usually get almost 500 applications for only 75 spots. Applicants draft resumes, write essays, and go through two rounds of behavioral and technical interviews, the first with student leaders in the group and the second with me. The training program The students who do get in focus on three things: formal training, one-on-one coaching, and mentorship from the alumni board. I view Wall Street for McCombs as a leadership program, not an internship training club. When we identify students, we look for the ones who will become successful alumni and give back to UT. Interviews for junior summer internships are happening earlier and earlier, starting now in November of sophomore year. The timeline can be penalizing for later bloomers, but we've just had to adapt to the reality of the marketplace and have shifted our admissions timeline from October to September. The freshman-year investment banking clubs are helpful, since they train students who eventually enter my program and sit for early interviews. Landing the internship is only half the battle — the other half is getting the return offer , so we spend a lot of time coaching kids to succeed at their summer jobs. We really focu", "date_str": "2026-09-26T09:03:02+00:00", "hash": "96c1a8660fd08b02", "title_fa": "من به صدها کودک کمک کرده ام تا شغل وال استریت پیدا کنند. در اینجا نحوه آموزش آنها است.", "summary_fa": "خاویر اشتینبرگ از طریق برنامه رهبری وال استریت خود به صدها دانشجو کمک کرده است تا دوره های کارآموزی را دریافت کنند. خاویر استجنبرگ خاویر استجنبرگ وال استریت را برای مک کامبز، یک برنامه آموزشی رهبری در UT آستین، تأسیس کرد. او در دهه گذشته به صدها دانشجو کمک کرده است تا کارآموزی و شغلی در وال استریت پیدا کنند. آموزش فنی گسترده، پایگاه قوی فارغ التحصیلان، و روابط خوب با بانک ها کلیدی است. این مقاله گفته شده بر اساس گفتگو با خاویر اشتینبرگ، استاد مالی در دانشکده بازرگانی مک کامبز در دانشگاه تگزاس آستین است که قبلا در M A کار می کرد. او برنامه رهبری وال استریت را در سال 2016 تأسیس کرد. گفتگو برای طولانی و وضوح ویرایش شده است. وقتی یک دهه پیش وال استریت را برای مک‌کامبز راه‌اندازی کردم، کمتر از 10 دانشجوی دانشگاه UT را برای بانکداری سرمایه‌گذاری به نیویورک فرستادیم. UT Austin یک نیروگاه در هیوستون بود، اما ما متوجه شدیم که برای تبدیل شدن به یک مدرسه قدرتمند در امور مالی به یک حضور عمده در نیویورک نیاز داریم. برای تابستان 2027، به حدود 150 دانشجو کمک کرده‌ایم تا در بیش از 50 بانک کارآموزی کنند و بر افزایش سهم بازار خود در شرکت‌های برتر متمرکز شده‌ایم. اکنون که علاقه زیاد شده است، یک فرآیند پذیرش بسیار سخت برای برنامه من وجود دارد. دانش آموزان در طول سال دوم خود درخواست می دهند و ما معمولاً تقریباً 500 درخواست فقط برای 75 نقطه دریافت می کنیم. متقاضیان رزومه تهیه می کنند، مقاله می نویسند، و دو دور مصاحبه رفتاری و فنی را پشت سر می گذارند، اولی با رهبران دانش آموزان در گروه و دومی با من. برنامه آموزشی دانش آموزانی که بر روی سه چیز تمرکز می کنند: آموزش رسمی، مربیگری یک به یک، و راهنمایی از هیئت فارغ التحصیلان."}, {"source": "Business Insider", "title": "Getting delivery for your Costco order? Here's which app is cheapest", "link": "https://www.businessinsider.com/costco-delivery-via-instacart-uber-eats-doordash-analyzed-2026-9", "summary": "Costco now widely offers delivery on three different apps. Lori Van Buren/Albany Times Union via Getty Images You can get Costco groceries delivered from three delivery apps now. We compared the price of ordering on each using a basket of 15 Costco products. One delivery option was the most expensive, and all cost more than shopping in-store. There are now three apps that will deliver from Costco to your door. When it comes to price, though, there's a difference. DoorDash and Uber Eats expanded their partnerships with Costco last week. DoorDash said it now delivers from Costco stores around the US, while Uber Eats now offers delivery from the chain in 47 states, up from its previous 17. These complement Costco's existing partnership with Instacart, CEO Ron Vachris said on the company's latest earnings call on Thursday. Instacart has delivered from Costco stores since 2017. Costco customers ordering via DoorDash and Uber Eats tend to be \"significantly younger than our overall member base,\" Vachris said. Delivery customers use the option when they need a few items while still regularly visiting a Costco store, he added. But are each of the three delivery services comparably priced? And how much of a premium are customers paying over going to the store? To find out, I checked the cost of 15 items at a Costco store near me in Washington, DC. Then, I compared the total to the cost of ordering those same items through Instacart, Uber Eats, and DoorDash. Here's what I found. The delivery apps carried a consistent markup The 15 items I chose span the grocery categories at Costco, from Kirkland Signature Paper Towels to prime ribeye steaks. I also threw in a few items long popular with Costco shoppers, such as a rotisserie chicken and butter croissants. To make the comparison with the apps fair, I made sure to order from the same store that I visited — and on the same day that I visited. I also added my Costco membership to each of the apps. Uber Eats and DoorDash required this, while Instacart lets users order from Costco without a membership, though they might pay more. I did not use any of the paid memberships that the apps offer, such as Uber One, though shoppers who use those might save more. Here's how much the items alone cost without tax, fees, a tip, or discounts: Costco in-store: $300.83 Uber Eats: $336.75 DoorDash: $337.64 Instacart: $380.65 Every item on my list cost more through the apps than it did at the store. And while the prices on Uber Eats and D", "date_str": "2026-09-26T09:03:01+00:00", "hash": "cb0d8ed9fe697449", "title_fa": "برای سفارش Costco خود تحویل می گیرید؟ در اینجا آمده است که کدام برنامه ارزان ترین است", "summary_fa": "Costco اکنون به طور گسترده تحویل را در سه برنامه مختلف ارائه می دهد. Lori Van Buren/Albany Times Union از طریق Getty Images اکنون می‌توانید مواد غذایی Costco را از سه برنامه تحویل دریافت کنید. ما قیمت سفارش هر کدام را با استفاده از سبدی از 15 محصول Costco مقایسه کردیم. یکی از گزینه‌های تحویل گران‌ترین گزینه بود و همه آنها بیشتر از خرید در فروشگاه هزینه داشتند. اکنون سه برنامه وجود دارد که از Costco به درب منزل شما تحویل داده می شود. با این حال، در مورد قیمت، تفاوت وجود دارد. DoorDash و Uber Eats هفته گذشته همکاری خود را با Costco گسترش دادند. DoorDash گفت که اکنون از فروشگاه های Costco در سراسر ایالات متحده تحویل می دهد، در حالی که Uber Eats اکنون تحویل را از زنجیره در 47 ایالت ارائه می دهد که نسبت به 17 ایالت قبلی خود افزایش یافته است. Instacart از سال 2017 از فروشگاه های Costco تحویل داده است. واکریس گفت، مشتریان Costco که از طریق DoorDash و Uber Eats سفارش می‌دهند، «به طور قابل توجهی جوان‌تر از اعضای کلی ما هستند». او افزود که مشتریان تحویل کالا زمانی که به چند مورد نیاز دارند از این گزینه استفاده می کنند، در حالی که هنوز به طور منظم از فروشگاه Costco بازدید می کنند. اما آیا هر یک از سه سرویس تحویل با قیمت قابل مقایسه هستند؟ و مشتریان چقدر حق بیمه را برای رفتن به فروشگاه می پردازند؟ برای فهمیدن این موضوع، هزینه 15 مورد را در یک فروشگاه Costco در نزدیکی خود در واشنگتن دی سی بررسی کردم. سپس، کل را با هزینه سفارش همان موارد از طریق Instacart، Uber Eats و DoorDash مقایسه کردم. این چیزی است که من پیدا کردم. برنامه‌های تحویل دارای نشانه‌گذاری ثابتی بودند. 15 موردی که من انتخاب کردم شامل دسته‌های مواد غذایی در"}, {"source": "Business Insider", "title": "Inside Meta's grind to turn Muse from a clunky chatbot into an AI sensation", "link": "https://www.businessinsider.com/meta-ai-success-nat-friedman-muse-launch-2026-9", "summary": "Meta CEO Mark Zuckerberg hypes up its Muse AI assistant at the company s Connect event. AP Photo/Jeff Chiu Meta's top AI staff fretted about Muse days before launch as it struggled to speak good English. Ex-GitHub CEO Nat Friedman's team worked around the clock to turn the AI assistant into a hit. After a \"long ass\" grind, Muse is now a \"banger,\" says Meta's 29-year-old AI chief, Alexandr Wang. A year ago, Meta was struggling to convince Silicon Valley that it could keep up in the AI race. Now it has one of the industry's hottest products. Muse, Meta's new personal AI assistant, has rocketed to the top of the App Store and become a victory lap for CEO Mark Zuckerberg's massive AI spending. Meta's Connect conference this week was all about the app, which AI chief Alexandr Wang — who is 29 and has been posting risqué memes of Muse's mascot all week — called a \"banger.\" Getting there required months of painstaking work, a team led by former GitHub CEO Nat Friedman, and thousands of employees pulled from across Meta to teach the agent how to actually get things done, employees told Business Insider. Meta also snapped up top AI agent talent through acqui-hires, including the leaders of Dreamer, an AI agent startup. Whether Meta can sustain Muse's momentum is another question. Competitors like Instinct are thriving, and OpenAI is widely expected to launch a rival. Privacy concerns have also arisen, as Muse requires broad access to users' accounts to function. Meta employees are still reeling from a year of mass layoffs, employee surveillance, and low morale. For now, at least, Muse's success — and a more than 20% increase in Meta's stock price since its launch — has become a morale boost, employees said. It also proves that Meta remains firmly in the AI race after being seen as a laggard a year ago. \"Muse is busy working for millions of people because of the hard work of a bunch of people at Meta — and we're still cooking,\" a Meta spokesperson said. Nat Friedman grinds to turn Muse into a hit Muse's success was far from inevitable. Since September 2025, Friedman, who heads the superintelligence unit's Products and Applied Research team , has been working hard on Muse, then codenamed \"Hatch.\" As recently as two weeks before Muse's launch this month, the chatbot struggled with speaking good English, a person directly familiar with the matter said — and it came as a huge relief when it finally started scoring well on coherence tests. Earlier this year, some of Meta", "date_str": "2026-09-26T09:00:02+00:00", "hash": "69f2cf88ac3ecb5e", "title_fa": "Inside Meta's grind برای تبدیل Muse از یک ربات چت زمخت به یک حس هوش مصنوعی", "summary_fa": "مارک زاکربرگ، مدیر عامل متا، دستیار هوش مصنوعی Muse خود را در رویداد Connect شرکت معرفی می کند. AP Photo/ کارمندان برتر هوش مصنوعی جف چیو متا چند روز قبل از راه‌اندازی در مورد Muse نگران بودند، زیرا در تلاش برای صحبت کردن به انگلیسی خوب بود. تیم نات فریدمن، مدیر عامل سابق GitHub، شبانه روز کار کردند تا دستیار هوش مصنوعی را به یک موفقیت تبدیل کنند. الکساندر وانگ، رئیس 29 ساله هوش مصنوعی متا، می‌گوید: پس از یک \"الاغ طولانی\"، میوز اکنون یک \"بنگر\" است. یک سال پیش، متا در تلاش بود تا سیلیکون ولی را متقاعد کند که می‌تواند در مسابقه هوش مصنوعی ادامه یابد. اکنون یکی از داغ ترین محصولات این صنعت را دارد. میوز، دستیار هوش مصنوعی شخصی جدید متا، به بالای اپ استور صعود کرده و تبدیل به یک دور پیروزی برای هزینه های هنگفت هوش مصنوعی مدیرعامل مارک زاکربرگ شده است. کنفرانس Meta's Connect این هفته تماماً در مورد برنامه ای بود که الکساندر وانگ، رئیس هوش مصنوعی - که 29 سال دارد و در تمام هفته در حال ارسال مم های خطرناک از طلسم Muse است - آن را \"banger\" نامید. کارمندان به Business Insider گفتند که رسیدن به آنجا نیازمند ماه‌ها کار پرزحمت بود، تیمی به رهبری نات فریدمن، مدیرعامل سابق GitHub و هزاران کارمند از سراسر متا بیرون آمدند تا به نماینده آموزش دهند که چگونه کارها را انجام دهد. متا همچنین از طریق استخدام های acqui، از جمله رهبران Dreamer، یک استارتاپ عامل هوش مصنوعی، استعدادهای برتر عامل هوش مصنوعی را جذب کرد. اینکه آیا متا می تواند حرکت Muse را حفظ کند یا خیر، سوال دیگری است. رقبایی مانند Instinct در حال پیشرفت هستند و انتظار می رود OpenAI یک رقیب راه اندازی کند. نگرانی‌های مربوط به حریم خصوصی نیز به وجود آمده است، زیرا Muse برای عملکرد"}, {"source": "Business Insider", "title": "We asked our Gen Z and millennial reporters and editors about AI agents. Here's where they split.", "link": "https://www.businessinsider.com/gen-z-millennials-ai-agents-thoughts-optimism-fears-2026-9", "summary": "Members of Business Insider s economy team chat about their thoughts on AI agents. Bartie Scott/Business Insider I spoke with my colleagues at Business Insider to hear their thoughts on AI agents. Opinions varied. Millennials on the team were cautiously optimistic, seeing potential for efficiency in daily tasks. Gen Zers seemed skeptical and worried about privacy concerns and scams. Everyone is talking about AI agents — and Business Insider's reporters and editors are no different. Agents go a step beyond chatbots and are capable of planning and achieving multi-step tasks. This can range from making a restaurant reservation to inviting a friend for lunch to buying clothes you are on the lookout for. To get a sense of how members of different generations feel about the emerging world of AI agents, I, a Gen Z fellow on the Business Insider Economy team, talked to my colleagues, spanning from Gen Z to elder millennials, about their stances on the divisive topic. While the younger generation expressed a lot of worries around privacy, the millennials in the group were cautiously optimistic about how agents could be helpful at work and at home. The Gen Z consensus: Skepticism and privacy concerns Many of my Gen Z peers agreed that growing up with technology made them more aware of its limitations and dangers — making them more hesitant about handing over their information to AI agents. They also seemed most concerned about privacy and scams. The younger members of the Economy team aren't alone — a recent poll from the Pew Research Center found that Americans under age 30 are increasingly skeptical of AI's benefits . Ayelet Sheffey, our Gen Z senior education reporter, said she was not open to handing over the control to an AI agent to get things she needed done. \"I'm hearing about people using AI and they're like feeding their bank information or personal things into a software — that just immediately turns me off,\" she said. \"Not only for the privacy reasons, but also, I just don't trust anyone or anything else to get tasks done.\" Allie Kelly, a Gen Z economy reporter, said that while being a reporter is a public-facing job, there is other information she prefers to keep private. While she is open to using it for professional purposes, she is more hesitant to use it for personal reasons, not knowing how the information she provides to the agent can be used. \"If I want an agent to analyze something, I will give it something specific to analyze — I'm not going to", "date_str": "2026-09-26T09:00:01+00:00", "hash": "397ea5c4cb2d2279", "title_fa": "ما از ژنرال Z و خبرنگاران و ویراستاران هزاره در مورد عوامل هوش مصنوعی سؤال کردیم. اینجا جایی است که آنها جدا شدند.", "summary_fa": "اعضای تیم اقتصادی Business Insider درباره افکار خود در مورد عوامل هوش مصنوعی چت می کنند. بارتی اسکات/Business Insider من با همکارانم در Business Insider صحبت کردم تا نظرات آنها را در مورد عوامل هوش مصنوعی بشنوم. نظرات متفاوت بود. افراد هزاره در تیم محتاطانه خوشبین بودند و پتانسیل کارآمدی در کارهای روزانه را می دیدند. ژنرال Zers نسبت به نگرانی‌های مربوط به حریم خصوصی و کلاهبرداری‌ها بدبین و نگران به نظر می‌رسید. همه در مورد عوامل هوش مصنوعی صحبت می کنند - و خبرنگاران و سردبیران Business Insider تفاوتی ندارند. نمایندگان یک گام فراتر از چت بات ها می روند و قادر به برنامه ریزی و دستیابی به وظایف چند مرحله ای هستند. این می تواند از رزرو رستوران گرفته تا دعوت از یک دوست برای ناهار تا خرید لباسی که به دنبال آن هستید را شامل شود. برای درک احساس اعضای نسل های مختلف در مورد دنیای نوظهور عوامل هوش مصنوعی، من، یکی از اعضای تیم Gen Z در تیم Business Insider Economy، با همکارانم، از نسل Z تا هزاره های بزرگتر، در مورد مواضع آنها در مورد موضوع تفرقه افکن صحبت کردم. در حالی که نسل جوان نگرانی‌های زیادی را در مورد حفظ حریم خصوصی ابراز می‌کردند، هزاره‌های گروه با احتیاط نسبت به اینکه چگونه نمایندگان می‌توانند در محل کار و خانه مفید باشند، خوش‌بین بودند. اجماع ژنرال Z: شک و تردید و نگرانی‌های مربوط به حریم خصوصی بسیاری از همتایان ژنرال Z من موافق بودند که بزرگ شدن با فناوری باعث می‌شود از محدودیت‌ها و خطرات آن آگاه‌تر شوند و آنها را در مورد تحویل اطلاعات خود به عوامل هوش مصنوعی مرددتر می‌کند. همچنین به نظر می رسید که آنها بیشتر نگران حریم خصوصی و کلاهبرداری هستند. اعضای جوان‌تر تیم اقتصاد تنها نیستند - نظرسنجی اخیر از مرکز تحقیقات پیو نشان داد که آمریکایی‌های زیر 30"}, {"source": "Business Insider", "title": "My baby business was pummeled by tariffs on China and Canada. It's taught me perseverance.", "link": "https://www.businessinsider.com/baby-business-china-canada-tariffs-impact-2026-9", "summary": "Garett Senez s business was hit by tariffs on China and Canada. You ve just got to keep going, he said. Garett Senez Garett Senez's company Quark Baby is based in Canada, but 90% of its business is in the US. Quark Baby also did its manufacturing in China. Senez was hit twice with tariffs. \"It feels like I've lost a lot of control,\" he said. This as-told-to essay is based on a conversation with Garett Senez, the 39-year-old founder and CEO of Quark Baby . He lives in Vancouver. It's been edited for length and clarity. We make baby-feeding tech and accessories. We started in 2021 with six SKUs. Now we've got 45. A lot of them are made in China. We've got a network there, our factories are there, our molds are there, our lines are there. The tariffs were a huge shock for us. The most immediate thing was: where we can, let's resource out. We took a look at all the other countries where you can produce, like Indonesia, Thailand, Vietnam, Cambodia, and Korea. We ended up resourcing a lot of our production to Korea. They have a very high-quality manufacturing base. There are a lot of free-trade agreements that were set. It was expensive. You can move your molds, because a mold is just a metal press. But it's not just the mold that you own. There's a secret sauce of doing things at scale on a production line that you learn over time. You can't just learn that right away. I'd estimate that, with molds and cost of production, it cost us just under $1 million. We're a Canadian company, thank god. The Canadian government has lots of safeguards and things that will help small businesses in times of trouble. We're able to leverage the government a lot, but it absolutely hit the bottom line. It was a gut punch because we had large purchase orders that we had to say no to because that SKU became unbuyable. There were products that were out of stock because I could not bring them in when shipping was so expensive. Quark Baby moved its manufacturing to South Korea after the tariffs. Garett Senez The biggest thing that kills anything is uncertainty. It's the uncertainty of not knowing, if I bring something in, am I going to make margin? If I order a certain quantity, am I going to be able to ship it? Those things get really complicated, really quickly. As of now, I've found ways around most of those opportunities. Our business is great now, and we're back on a steady track. From a Canadian perspective — and we're still a Canadian holding company — we asked: what does our tr", "date_str": "2026-09-26T08:49:01+00:00", "hash": "d9b9271e22f8a3b9", "title_fa": "تجارت کودک من با تعرفه های گمرکی بر چین و کانادا تحت تاثیر قرار گرفت. این به من استقامت را آموخت.", "summary_fa": "تجارت گرت سنز تحت تاثیر تعرفه های گمرکی بر چین و کانادا قرار گرفت. او گفت، فقط باید ادامه دهید. Garett Senez شرکت Garett Senez Quark Baby در کانادا مستقر است، اما 90٪ تجارت آن در ایالات متحده است. کوارک بیبی نیز تولید خود را در چین انجام داد. سنز دو بار با تعرفه ها ضربه خورد. او گفت: «به نظر می رسد کنترل زیادی را از دست داده ام. این مقاله گفته شده بر اساس گفتگو با گرت سنز، بنیانگذار و مدیر عامل شرکت کوارک بیبی 39 ساله است. او در ونکوور زندگی می کند. برای طول و وضوح ویرایش شده است. ما تکنولوژی و لوازم جانبی تغذیه کودک را تولید می کنیم. ما در سال 2021 با شش SKU شروع کردیم. اکنون 45 عدد داریم. بسیاری از آنها ساخت چین هستند. ما در آنجا یک شبکه داریم، کارخانه های ما آنجا هستند، قالب های ما آنجا هستند، خطوط ما آنجا هستند. تعرفه ها شوک بزرگی برای ما بود. فوری ترین چیز این بود: هر جا که می توانیم، بیایید منابع را تامین کنیم. ما به سایر کشورهایی که می‌توانید در آن‌ها تولید کنید، مانند اندونزی، تایلند، ویتنام، کامبوج و کره نگاهی انداختیم. ما در نهایت منابع زیادی از تولید خود را به کره رساندیم. آنها پایه تولید بسیار با کیفیتی دارند. قراردادهای تجارت آزاد زیادی وجود دارد که تنظیم شده است. گران بود. شما می توانید قالب های خود را جابجا کنید، زیرا قالب فقط یک پرس فلزی است. اما این فقط قالبی نیست که شما صاحب آن هستید. یک سس مخفی برای انجام کارها در مقیاس در خط تولید وجود دارد که در طول زمان یاد می گیرید. شما نمی توانید آن را بلافاصله یاد بگیرید. من تخمین می زنم که با توجه به قالب ها و هزینه های تولید، هزینه ای کمتر از 1 میلیون دلار"}, {"source": "Business Insider", "title": "When his wife got sick, this doctor turned to an AI chatbot to navigate her rare cancer diagnosis. Then he invested.", "link": "https://www.businessinsider.com/ai-healthcare-cancer-startup-doctor-wife-diagnosis-treatment-invested-2026-9", "summary": "Dr. Munjal Shroff said he s used AI to help support his wife through her cancer diagnosis and treatment. Munjal Shroff When Dr. Munjal Shroff's wife got sick with a mysterious illness, he turned to an AI healthcare app. Shroff said Healz AI helped him advocate for his wife and navigate her treatment. The early stage startup is backed by Alexey Dosovitskiy, cofounder of Recursive Superintelligence. Dr. Munjal Shroff's wife started experiencing unexplained symptoms in the fall of 2025: rashes, itching, fatigue, and swollen lymph nodes. After consulting with multiple doctors and extensive testing, they struggled to get a diagnosis. Shroff, a psychiatrist based in Atlanta, said he needed something to help keep track of everything and searched for a healthcare-specific AI tool . He found Healz AI, a healthcare AI assistant, and signed up. The app turned out to be a crucial resource. It encouraged them to seek another opinion that ultimately led to her diagnosis: rare T-cell lymphoma. After relying on the app throughout her treatment, Shroff believed in it so much that he became an investor. \"I think without it, the diagnosis and treatment would've been delayed,\" he said. The app, which launched in beta last year, is a chatbot designed to help cancer patients navigate their diagnosis, treatment, and recovery. The early-stage startup is backed by Recursive Superintelligence cofounder Alexey Dosovitskiy, the company exclusively told Business Insider. Dosovitskiy is a former Google researcher who authored a breakthrough paper on computer vision in 2020. Recursive, a self-improving AI startup founded by a group of researchers around the start of the year, has raised over $650 million at a $4.65 billion valuation. Dosovitskiy said he invested in Healz because healthcare is an area where AI can make a big difference by improving and saving lives. \"Now is the time to work on this: the underlying technology is largely there, and it needs to be made into products that help people,\" he told Business Insider in an email. The AI pushed him to seek another opinion Shroff said he'd used general AI tools but that he wanted something specific to healthcare. When he started using Healz, his wife's doctors suspected an autoimmune condition , such as lupus, was the more likely diagnosis, but that cancer was a possibility. Healz agreed and did not immediately conclude she had cancer. Instead, it recommended she get an opinion from the University of Texas MD Anderson Cancer Center. ", "date_str": "2026-09-26T08:11:01+00:00", "hash": "8e523e67701a56ac", "title_fa": "هنگامی که همسرش بیمار شد، این پزشک به یک ربات چت هوش مصنوعی روی آورد تا تشخیص سرطان نادر او را بررسی کند. سپس سرمایه گذاری کرد.", "summary_fa": "دکتر Munjal Shroff گفت که او از هوش مصنوعی برای کمک به همسرش در تشخیص و درمان سرطان استفاده کرده است. Munjal Shroff هنگامی که همسر دکتر Munjal Shroff با یک بیماری مرموز بیمار شد، او به یک برنامه مراقبت های بهداشتی هوش مصنوعی روی آورد. شروف گفت که هوش مصنوعی Healz به او کمک کرد تا از همسرش دفاع کند و درمان او را انجام دهد. استارت آپ مرحله اولیه توسط الکسی دوسوویتسکی، یکی از بنیانگذاران ابرهوش بازگشتی پشتیبانی می شود. دکتر همسر مونجال شروف در پاییز 2025 علائم غیر قابل توضیحی را تجربه کرد: بثورات، خارش، خستگی و تورم غدد لنفاوی. پس از مشورت با پزشکان متعدد و آزمایشات گسترده، آنها برای تشخیص بیماری تلاش کردند. شروف، یک روانپزشک مستقر در آتلانتا، گفت که به چیزی نیاز دارد که به پیگیری همه چیز کمک کند و به دنبال یک ابزار هوش مصنوعی مخصوص مراقبت های بهداشتی است. او Healz AI، دستیار هوش مصنوعی مراقبت های بهداشتی را پیدا کرد و ثبت نام کرد. این برنامه منبع بسیار مهمی بود. آن‌ها را تشویق کرد تا نظر دیگری را که در نهایت به تشخیص او انجامید، جستجو کنند: لنفوم سلول T نادر. شروف پس از تکیه بر برنامه در طول درمان خود، آنقدر به آن اعتقاد داشت که سرمایه گذار شد. او گفت: \"من فکر می کنم بدون آن، تشخیص و درمان به تعویق می افتاد.\" این اپلیکیشن که سال گذشته به صورت بتا راه اندازی شد، یک ربات چت است که برای کمک به بیماران سرطانی در تشخیص، درمان و بهبودی خود طراحی شده است. این شرکت به طور انحصاری به Business Insider گفته است که این استارت آپ در مراحل اولیه توسط الکسی دوسوویتسکی، بنیانگذار Recursive Superintelligence پشتیبانی می شود. Dosovitskiy محقق سابق گوگل است که در سال 2020 مقاله پیشرفتی در مورد بینایی کامپیوتر نوشته است. Recursive،"}, {"source": "Business Insider", "title": "OpenAI said there are 5 main ways rogue AI agents are messing with the internet", "link": "https://www.businessinsider.com/openai-rogue-ai-agents-sec-census-2026-9", "summary": "OpenAI said it warned dozens of organizations that its AI agents may have acted improperly on their websites. Selcuk Acar/Anadolu via Getty Images OpenAI warned dozens of organizations that its AI agents may have acted improperly. OpenAI's agents accessed public data from the US Census Bureau and the SEC websites. OpenAI said agents bypassed access controls, used exposed passwords, and posted material online. OpenAI said it had warned dozens of organizations that its AI agents may have behaved improperly on their websites. The transgressions range from using exposed passwords to posting material that could require cleanup, said OpenAI in an update on its blog on Friday. OpenAI separately confirmed in a statement to Business Insider that, during training , some of its AI agents accessed publicly available data from the US Census Bureau and the Securities and Exchange Commission websites, and that both agencies were notified of the incidents. The company said that the agent did not access any nonpublic data. \"Most of the activity we've reviewed so far involved routine research tasks, such as accessing public web content to answer questions,\" an OpenAI spokesperson said. \"Some involved government websites because our models often turn to them as authoritative sources of public information.\" The agents did not make changes to or compromise the government sites, although an agent posted some public SEC information on another public webpage. \"Some organizations may review what we share and conclude that the information was intentionally public or that the model's interaction was not concerning,\" OpenAI added in its report. \"Others may identify a design issue or security weakness they want to address.\" The company said it uncovered the activity while reviewing its models' online activity during training and testing. The company identified five kinds of activities: Circumventing access controls: Agents reached information or features that normally required an account, a subscription, or specific permission. Using exposed credentials: Agents found login details or access keys exposed online and used them to access a service. Injecting queries or commands: Agents entered text that a website treated as an instruction rather than ordinary input. That could cause the site to run a database query, application code, or a server command. Accessing internal systems: Agents read files that contained details about how a service worked or interacted with systems intended for ", "date_str": "2026-09-26T01:34:16+00:00", "hash": "37b33ba9e286126e", "title_fa": "OpenAI گفت 5 راه اصلی وجود دارد که عوامل سرکش هوش مصنوعی با اینترنت درگیر می شوند", "summary_fa": "OpenAI گفت که به ده ها سازمان هشدار داده است که ممکن است عوامل هوش مصنوعی آن در وب سایت هایشان نادرست عمل کرده باشند. Selcuk Acar/Anadolu از طریق Getty Images OpenAI به ده‌ها سازمان هشدار داد که ممکن است عوامل هوش مصنوعی آن نادرست عمل کرده باشند. عوامل OpenAI به داده های عمومی اداره سرشماری ایالات متحده و وب سایت های SEC دسترسی پیدا کردند. OpenAI گفت که نمایندگان کنترل های دسترسی را دور زدند، از رمزهای عبور افشا شده استفاده کردند و مطالب را به صورت آنلاین ارسال کردند. OpenAI گفت که به ده ها سازمان هشدار داده است که ممکن است عوامل هوش مصنوعی آن در وب سایت هایشان رفتار نادرست داشته باشند. OpenAI در به روز رسانی وبلاگ خود در روز جمعه گفت که این تخلفات از استفاده از رمزهای عبور افشا شده تا ارسال مطالبی که ممکن است نیاز به پاکسازی داشته باشد، متغیر است. OpenAI به طور جداگانه در بیانیه‌ای به Business Insider تأیید کرد که در طول آموزش، برخی از عوامل هوش مصنوعی آن به داده‌های در دسترس عموم از اداره سرشماری ایالات متحده و وب‌سایت‌های کمیسیون بورس و اوراق بهادار دسترسی پیدا کردند و هر دو آژانس از این حوادث مطلع شدند. این شرکت گفت که عامل به هیچ داده غیر عمومی دسترسی نداشته است. یکی از سخنگویان OpenAI گفت: «بیشتر فعالیت‌هایی که ما تاکنون بررسی کرده‌ایم شامل کارهای تحقیقاتی معمولی، مانند دسترسی به محتوای وب عمومی برای پاسخ دادن به سؤالات است. برخی از وب سایت های دولتی درگیر هستند زیرا مدل های ما اغلب به آنها به عنوان منابع معتبر اطلاعات عمومی مراجعه می کنند. عوامل تغییری در سایت‌های دولتی ایجاد نکردند یا به خطر انداختند، اگرچه یک نماینده برخی از اطلاعات عمومی SEC را در یک صفحه وب عمومی دیگر پست کرد. OpenAI در گزارش خود افزود: «برخی سازمان‌ها"}, {"source": "Business Insider", "title": "The best cell phone plans for seniors in 2026, tested and reviewed", "link": "https://www.businessinsider.com/guides/tech/best-cell-phone-plans-for-seniors", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Sarah Saril/Business Insider With so many options to choose from, finding the best cell phone plan for seniors can be tough. From confusing contracts to unnecessary add-ons, there are a lot of pitfalls that we kept in mind when testing and narrowing down our list. We focused on finding plans with specific features that make them ideal for older adults. For instance, helpful perks like senior discounts and physical store locations for in-person support were key in choosing our picks. Get to the point : The best plan for most older adults is the T-Mobile Essentials Choice 55 2.0 plan thanks to its good service, hefty 50GB data cap, and overall value. Its $50 price is a bit prohibitive, so our budget recommendation is Tello's Starter plan at only $10 a month. Aside from our age-limited top pick, T-Mobile's Essentials Choice 55 2.0 plan, the services below could also suit anyone who prefers a simpler cell phone provider. Whether you're uncomfortable with tech terms and conditions or just need something cheap to get the job done, you may find that the picks on this list suit your needs, too. Our top picks for the best cell phone plans for seniors Best overall: T-Mobile Essentials Choice 55 2.0 Plan - See at T-Mobile Best budget: Tello Mobile Economy Plan - See at Tello Mobile Best for senior-centric features: Lively Basic Plan - See at Lively Best overall Thanks to its price and value, the T-Mobile Essentials Choice 55 2.0 is the best cell phone plan for seniors. It offers the same service as T-Mobile's other Essential plans, but it includes a senior discount for those 55 and older. Starting at $50/month (or $70/month for two lines), the Essentials Choice 55 2.0 plan comes with unlimited talk and text and 50GB of fast data. 50GB of data is a substantial amount of data for most people, especially if they use WiFi at home for internet access. It's ideal for seniors who regularly use data for browsing the web, making video calls, sending and receiving photos, streaming video and music, and other data-intensive activities. Sarah Saril/Business Insider We picked T-Mobile over less expensive options that offer similar connectivity and data, like Mint Mobile , because T-Mobile has widespread physical locations that provide in-person support, in addition to online or phone support. (See our Mint Mobile vs. T-Mobile guide for a comparative breakdown.) This is a major factor for", "date_str": "2026-09-25T21:15:14+00:00", "hash": "35c4ef434cd9ab1d", "title_fa": "بهترین برنامه های تلفن همراه برای سالمندان در سال 2026، آزمایش شده و بررسی شده است", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید سارا ساریل/Business Insider با گزینه های بسیار زیادی که می توانید از بین آنها انتخاب کنید، پیدا کردن بهترین برنامه تلفن همراه برای سالمندان می تواند دشوار باشد. از قراردادهای گیج کننده گرفته تا افزونه های غیر ضروری، مشکلات زیادی وجود دارد که ما هنگام آزمایش و محدود کردن لیست خود در نظر داشتیم. ما بر روی یافتن برنامه هایی با ویژگی های خاص تمرکز کردیم که آنها را برای بزرگسالان مسن ایده آل می کند. برای مثال، هدیه‌های مفیدی مانند تخفیف‌های ارشد و مکان‌های فروشگاه فیزیکی برای پشتیبانی حضوری در انتخاب گزینه‌های ما کلیدی بودند. به اصل مطلب برسید: بهترین طرح برای بیشتر افراد مسن تر، طرح T-Mobile Essentials Choice 55 2.0 است که به لطف خدمات خوب، حجم بالای 50 گیگابایت داده و ارزش کلی آن است. قیمت 50 دلاری آن کمی غیرقابل تحمل است، بنابراین توصیه بودجه ما برنامه شروع Tello با تنها 10 دلار در ماه است. جدای از انتخاب برتر ما که محدودیت سنی دارد، طرح T-Mobile's Essentials Choice 55 2.0، خدمات زیر می تواند برای هر کسی که ارائه دهنده تلفن همراه ساده تری را ترجیح می دهد مناسب باشد. چه با شرایط و ضوابط فنی ناخوشایند باشید یا فقط به چیزی ارزان برای انجام کار نیاز داشته باشید، ممکن است متوجه شوید که گزینه های موجود در این لیست با نیازهای شما هم مطابقت دارند. بهترین انتخاب‌های ما برای بهترین برنامه‌های تلفن همراه برای سالمندان بهترین‌ها: طرح T-Mobile Essentials Choice 55 2.0 - مشاهده در T-Mobile بهترین بودجه: Tello Mobile Economy Plan - در Tello Mobile بهترین برای ویژگی‌های محوری ارشد: Lively Basic Plan - مشاهده در Lively Best به طور کلی به لطف قیمت و ارزش آن، Es20 بهترین است، T-Mobile5 بهترین است."}, {"source": "Business Insider", "title": "I never tracked my teenagers on an app. Our relationships are better for it.", "link": "https://www.businessinsider.com/parent-dont-use-traciking-apps-apps-teen-independence-2026-9", "summary": "The author, shown with her two kids when they were younger, said she knew she never wanted to use an app to track their whereabouts. Courtesy of Heather Sweeney Unlike most of the parents in my circles, I opted out of tracking my teens on apps. Instead, I value face-to-face conversations or texts for family communication. My kids are 18 and 22, and I think the trust we've built has made our relationships stronger. When I first heard of Life360, my first thought was that I knew I never wanted to use the app to track my two kids , despite its popularity among parents. Almost a decade later, I still feel the same. But it wasn't until my oldest got his driver's license in 2020 that I realized my decision to opt out of this trend was helping to build trust with my teenager. And now, my relationships with both of my kids are better for it. I prefer conversations to spying Life360 is an app advertised as a way to coordinate within families, from keeping up with busy schedules to checking everyone's locations. The app also boasts safety features that are likely to appeal to parents of new drivers . But as a mother, I only saw it as a way to spy on kids, something I had no intention of doing. Do you have a hot take on a common parenting belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. Of course, it's important to know where they are and who they're with. And I'm sure they occasionally didn't tell me the truth about their whereabouts, and though that's not ideal, it's been fine. I know I wasn't always honest with my parents about these things when I was a teen. Instead of seeing where my kids are via an app, I prefer to have face-to-face conversations about their friends, jobs, after-school activities, and their everyday lives and interests. A therapist's advice helped me The issue of tracking came up when my son started driving and again when my daughter got her license three years later. As I contemplated whether or not to track them as most of their friends' parents did, I recalled advice a therapist gave me years earlier as we discussed parenting during the pandemic. \"Remember what it was like to be their age,\" the therapist said. \"Try to recall your mindset and think about how you would feel going through what they're going through.\" That advice served me well in many parenting situations, including the Life 360 decision. I reflected on my emotions and thoughts at their ages, remembering how I wante", "date_str": "2026-09-25T21:13:01+00:00", "hash": "7bc8f286c9d0f637", "title_fa": "من هرگز نوجوانانم را در یک برنامه ردیابی نکردم. روابط ما برای آن بهتر است.", "summary_fa": "نویسنده که با دو فرزندش در جوانی نشان داده شد، گفت که می‌دانست هرگز نمی‌خواهد از اپلیکیشنی برای ردیابی محل نگهداری آنها استفاده کند. با حسن نیت از Heather Sweeney برخلاف اکثر والدین در حلقه‌هایم، من از ردیابی نوجوانانم در برنامه‌ها انصراف دادم. درعوض، من به مکالمات رو در رو یا پیامک برای ارتباط خانوادگی اهمیت می دهم. بچه های من 18 و 22 ساله هستند و فکر می کنم اعتمادی که ایجاد کرده ایم روابط ما را قوی تر کرده است. وقتی برای اولین بار نام Life360 را شنیدم، اولین فکرم این بود که می دانستم علیرغم محبوبیت آن در بین والدین، هرگز نمی خواهم از این برنامه برای ردیابی دو فرزندم استفاده کنم. تقریباً یک دهه بعد، هنوز هم همین احساس را دارم. اما تا زمانی که مسن ترین من در سال 2020 گواهینامه رانندگی خود را گرفت، متوجه شدم تصمیم من برای انصراف از این روند به اعتمادسازی با نوجوانم کمک می کند. و اکنون، روابط من با هر دوی فرزندانم برای آن بهتر است. من مکالمات را به جاسوسی ترجیح می دهم Life360 برنامه ای است که به عنوان راهی برای هماهنگی بین خانواده ها، از پیگیری برنامه های شلوغ گرفته تا بررسی مکان همه افراد، تبلیغ می شود. این برنامه همچنین دارای ویژگی های ایمنی است که احتمالاً برای والدین رانندگان جدید جذاب است. اما به عنوان یک مادر، آن را تنها راهی برای جاسوسی از بچه ها می دیدم، کاری که قصد انجام آن را نداشتم. آیا در مورد یک باور مشترک والدینی نظر گرمی دارید؟ به جنیفر بک گلدبلات به آدرس jgoldblatt@insider.com ایمیل بزنید تا تجربه خود را با Business Insider به اشتراک بگذارید. البته مهم این است که بدانیم کجا هستند و با چه کسانی هستند. و من مطمئن هستم که آنها گاهی اوقات حقیقت را در مورد مکان خود به من"}, {"source": "Business Insider", "title": "Ed Sheeran's tour faces yet another setback: Mother Nature", "link": "https://www.businessinsider.com/ed-sheeran-boston-show-canceled-weather-2026-9", "summary": "Ed Sheeran s concerts at Gillette Stadium will not go ahead as planned this weekend. Kevin Mazur/Getty Images for iHeartRadio Ed Sheeran was supposed to play two nights at Gillette Stadium this weekend. They were to be his second and third shows after all his openers dropped out of the tour. But a nor'easter had different plans for Sheeran and other events across the northeast. Many eyes were supposed to be on Massachusetts' Gillette Stadium this weekend, where Ed Sheeran was set to perform Friday and Saturday — but Mother Nature had other plans. Sheeran's two shows at Gillette were canceled due to the expected severe weather hitting the East Coast this weekend. It came a little over a week after the stadium's owner, billionaire Robert Kraft , was instrumental in Macklemore's removal from Sheeran's Loop Tour after the rapper made pro-Palestinian comments at an earlier show. Sheeran said that after he was told Kraft and other stadium owners would cancel his shows at their venues if he didn't remove Macklemore, his promoter chose to drop the rapper. Kraft confirmed he had barred Macklemore from his stadium, telling Rolling Stone on September 14 that the stadium is focused on \"providing a welcoming environment for all guests and ensuring that all events held at our venue do not provide a platform for hate speech,\" and said Macklemore had \"crossed that line.\" The controversy led to Sheeran's backing band and opening acts dropping out. He performed in Philadelphia on September 19 with a new backing band and addressed the fallout, saying he was \"so, so sorry\" and \"never wanted to be an activist musician.\" Ed Sheeran and Macklemore pictured together in 2014. Ethan Miller/Getty Images for iHeartMedia \"I hope this isn't the end of my friendship with Ed,\" Macklemore said at the time of his removal. \"I hope we both continue listening, studying what is happening in Palestine, and wrestling with what neutrality means in a moment like this. My door will always be open to continuing that conversation.\" Messina Touring,
