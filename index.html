 outfit. It's an early hit, rocketing to the top of the App Store charts shortly after its launch last month. On Sunday, Abraham posted about his Muse experience on X, calling Meta and Shopify's recent integration a \"win for Shopify.\" \"The amount of purchases I've made with Muse that I used to have gone to Amazon for,\" he wrote. \"Now buying from the brands directly…\" he added, along with a screenshot of him directing the agent to buy products \"from a reputable store.\" The amount of purchases I’ve made with Muse that I used to have gone to Amazon for … now buying from the brands directly … win for Shopify https://t.co/w2axEYQMiT — Leif Abraham (@leifthunder) October 4, 2026 Public, Abraham's company, offers a Muse connector that lets customers link their brokerage accounts to the agent. Abraham said he has connected his own account and also uses Muse for daily brokerage updates and calorie tracking. Abraham's story is one person's experience and doesn't mean that Amazon has an impending sales problem. AI agent shopping has yet to catch on with the general public. But Amazon's decision to block Muse from making purchases on behalf of users — Amazon raised concerns about how Muse accessed or stored customer credentials and sensitive data, along with account data scraping — risks leaving money on the table, especially if Muse shopping takes off. Shopify, meanwhile, has taken the op", "date_str": "2026-10-05T20:28:42+00:00", "hash": "aa586e2711ad13c4", "title_fa": "Meta's Muse در حال حاضر خریدهای یکی از مدیران اجرایی از آمازون را کنار گذاشته است", "summary_fa": "متا شرط می‌بندد که عامل هوش مصنوعی آن می‌تواند به مشتریان کمک کند فهرست‌های محصولات بهتری را پیدا کنند. یک مدیر عامل گفت که قبلاً نحوه خرید او با آمازون را تغییر داده است. بلومبرگ/گتی ایماژ لیف آبراهام، مدیر عامل عمومی، شراب های قدیمی و شلوار جین فانتزی Levi's می خواهد. عامل هوش مصنوعی Muse متا آنها را برای او می خرد. از آنجایی که آمازون از خرید Muse جلوگیری می کند، آبراهام گفت که متوجه شده است که سفارشات او توسط Shopify پردازش می شود. مامور هوش مصنوعی متا، میوز، به خرید لیف آبراهام رفته است. آبراهام می گوید که با مسدود کردن آمازون توسط عامل هوش مصنوعی برای سفارش دادن، این به معنای خرید کمتر از آمازون است. آبراهام، یکی از بنیانگذاران و یکی از مدیران عامل پلتفرم سرمایه گذاری Public، به Business Insider گفت که به Muse روی آورده است تا محصولاتی را خریداری کند که عمدتاً به سختی می توان آن را پیدا کرد - مراقبت از پوست، شراب های قدیمی، یک محصول کراتین آلمانی، شلوار جین Levi's را متوقف کرد. او گفت: «از زمانی که آن چیز منتشر شد، من خیلی چیزها را خریدم. \"من به معنای واقعی کلمه فقط باید پرداخت را تایید کنم، و تمام.\" Muse شرط متا است که مشتریان به عوامل هوش مصنوعی سپردند تا کارهای اینترنتی را انجام دهند، مانند رزرو رستوران برای دوستان یا پیدا کردن لباس بعدی. این یک موفقیت اولیه است و اندکی پس از عرضه در ماه گذشته به صدر جدول اپ استور صعود کرد. روز یکشنبه، آبراهام در مورد تجربه Muse خود در X پست کرد و ادغام اخیر متا و Shopify را \"برنده Shopify\" خواند. او نوشت: «مقدار خریدهایی که با Muse انجام دادم و قبلاً برای آن به آمازون می رفتم. او افزود: «اکنون خرید مستقیم از برندها...» او به همراه اسکرین شات"}, {"source": "Business Insider", "title": "Investors shrug off a fresh surge in bond yields to push the Nasdaq to a record high", "link": "https://www.businessinsider.com/stock-market-today-nasdaq-hits-record-high-bond-yields-rise-2026-10", "summary": "A trader works on the floor of the New York Stock Exchange in New York City on October 5, 2026. TIMOTHY A. CLARY / AFP via Getty Images US stocks jumped on Monday, sidestepping a fresh spike in global bond yields. A new burst of tech bullishness sent the Nasdaq Composite to a record high. The global sell-off in government bonds has fueled more fears of financial contagion. The bond sell-off is still going strong, but investors just don't seem too concerned. The sell-off in government bonds picked up steam on Monday, but investors shrugged off the latest spike in yields and piled into the tech sector. The move is the latest reflection of the animal spirits pushing the stock market higher in the final months of 2026, even as yields reach multi-decade peaks and threaten to dent equity valuations. The yield on the 10-year US Treasury surged as much as 7 basis points to 5.35% before paring slightly. The yield is sitting at its highest level since 2002. Yet, rather than panic, investors piled into stocks on Monday. The major indexes ticked higher, largely fueled by tech gains and optimism as oil prices drifted lower. Brent crude , the international benchmark, fell 1% to $100 a barrel as the G7 nations released oil stocks and exports from Middle East producers increased, easing concerns about supply tightness in the oil market. The tech surge sent the Nasdaq Composite to a fresh all-time high. Here's where US indexes stood at the 4:00 p.m. ET closing bell: S P 500 : 7,773.98, up 0.66% Dow Jones Industrial Average : 51,267.90, up 0.18% (+90.94 points) Nasdaq 100 : 31,076.44, up 0.87% In tech, SpaceX jumped 6% after Morgan Stanley said the stock looked \"cheap.\" Microsoft also rose more than 2% after Melius Research issued a \"buy\" rating on the stock, and other hyperscalers and chip giants rose amid the AI optimism to start the week. Here were some of the notable moves in tech on Monday: Company Ticker Today's move SpaceX SPCX +7.6% Tesla TSLA +2.2% Broadcom AVGO +2.1% Meta META +1.9% Nvidia NVDA +2.2% Microsoft MSFT +1.5% Alphabet GOOGL +1% \"With rates still elevated and fuel costs pressuring the broader economy, the parts of the market that can generate earnings growth fast enough to outrun higher discount rates are the ones attracting capital, and right now that's overwhelmingly the AI complex,\" Luke Lango, a tech analyst, wrote in a recent note to clients. Performance in the stock market lately has been \"heavily weighted\" toward tech and energy, causing the equa", "date_str": "2026-10-05T20:07:24+00:00", "hash": "07d7824ac3df2d08", "title_fa": "سرمایه گذاران از افزایش دوباره بازده اوراق قرضه شانه خالی می کنند تا نزدک را به بالاترین حد خود برساند", "summary_fa": "یک معامله‌گر در 5 اکتبر 2026 در بازار بورس نیویورک در شهر نیویورک کار می‌کند. تیموتی آ. کلری / خبرگزاری فرانسه از طریق گتی ایماژ سهام ایالات متحده روز دوشنبه جهش کرد و از جهش جدید در بازده اوراق قرضه جهانی کنار زد. انفجار جدیدی از روند صعودی فناوری، Nasdaq Composite را به رکوردی بالاتر رساند. فروش جهانی اوراق قرضه دولتی به ترس بیشتر از سرایت مالی دامن زده است. فروش اوراق قرضه همچنان قوی است، اما به نظر نمی‌رسد سرمایه‌گذاران خیلی نگران باشند. فروش اوراق قرضه دولتی در روز دوشنبه افزایش یافت، اما سرمایه گذاران از آخرین افزایش بازدهی چشم پوشی کردند و در بخش فناوری انباشته شدند. این حرکت جدیدترین بازتاب ارواح حیوانی است که بازار سهام را در ماه‌های پایانی سال 2026 افزایش می‌دهد، حتی در شرایطی که بازدهی به اوج‌های چند دهه‌ای رسیده و ارزش‌های سهام را تهدید می‌کند. بازدهی خزانه داری 10 ساله ایالات متحده قبل از اینکه اندکی کاهش یابد، تا 7 واحد پایه افزایش یافت و به 5.35 درصد رسید. بازده به بالاترین سطح خود از سال 2002 رسیده است. با این حال، به جای وحشت، سرمایه‌گذاران روز دوشنبه در سهام انباشته شدند. با کاهش قیمت نفت، شاخص‌های اصلی بالاتر رفتند که عمدتاً ناشی از دستاوردهای فناوری و خوش‌بینی بود. نفت خام برنت، معیار بین‌المللی، با آزادسازی ذخایر نفت و صادرات کشورهای G7 از تولیدکنندگان خاورمیانه و کاهش نگرانی‌ها در مورد کمبود عرضه در بازار نفت، 1 درصد کاهش یافت و به 100 دلار در هر بشکه رسید. جهش فناوری، نزدک کامپوزیت را به بالاترین سطح تاریخ خود رساند. این جایی است که شاخص های ایالات متحده در ساعت 4:00 بعد از ظهر ایستادند. زنگ پایانی ET: S P 500: 7773.98، 0.66% افزایش میانگین صنعتی Dow Jones: 51267.90، افزایش 0.18% (+90.94 امتیاز) Nasdaq 100: 31،076.47% Space% Inmped، 0.48% 31،076.47، Inmped. استنلی گفت که"}, {"source": "Business Insider", "title": "The US Army created a new robotics job for special operations. Now, the service wants to go bigger.", "link": "https://www.businessinsider.com/us-army-special-ops-new-robotics-job-2026-10", "summary": "These technical experts will help command teams understand integration across the force, Army Gen. Christopher LaNeve, vice chief of staff, said. US Army photo by Staff Sgt. John Bae The US Army wants to expand a new robotics role pioneered by special operations. The specialty, alongside another effort, is focused on building, modifying, and integrating robotics and new technologies. The first soldiers graduated from the course last week. The US Army wants to expand a new robotics specialty pioneered by special operations across the conventional force after graduating its first robotics technicians. The new specialty and expected expansion reflect the Army's growing belief that future wars will demand specialists who can keep pace with rapidly evolving battlefield technology. The war in Ukraine has shown how quickly innovative solutions can become obsolete, forcing soldiers to adapt in the field. US Army Special Operations Command is expected to provide Army officials with feedback for expanding the new specialty — officially robotics technician — beyond special operations in the coming weeks, Lt. Gen. Lawrence Ferguson, head of US Army Special Operations Command, said last month at an Army conference. \"These technical experts will help command teams understand integration across the force,\" said Gen. Christopher LaNeve, acting Army chief of staff, at the same event. \"We are scaling this across the Army,\" he said. Rather than simply flying drones, the Army is training these new robotic specialists to integrate drones, ground robots, artificial intelligence, and other autonomous systems across military operations. They'll serve as technical advisors for commanders while rapidly designing, modifying, and troubleshooting custom robotic hardware and software. That new specialty complements a second new role, the \"Robotics Technology Integrators Course\" graduate, whose job is to understand new technologies. The Army said the need for the specialized role became clear from lessons from recent global conflicts. \"To maintain battlefield overmatch, the Army requires a two-tiered structure: highly specialized technical architects (MOS 390A) who engineer and secure the systems, working in tandem with tactical employment specialists (RTIC) who operate them in the dirt,\" explained an Army document on the two separate but related career paths shared with Business Insider. The first 10 soldiers graduated as robotics technicians on October 2 at the Army s John F. Kennedy ", "date_str": "2026-10-05T20:01:58+00:00", "hash": "e26069accd7fac15", "title_fa": "ارتش ایالات متحده یک شغل رباتیک جدید برای عملیات ویژه ایجاد کرد. اکنون، این سرویس می‌خواهد بزرگ‌تر شود.", "summary_fa": "ژنرال کریستوفر لانیو، معاون رئیس ستاد ارتش، گفت که این کارشناسان فنی به تیم های فرماندهی کمک خواهند کرد تا ادغام در سراسر نیرو را درک کنند. عکس ارتش ایالات متحده توسط گروهبان ستاد. جان بائه ارتش ایالات متحده می خواهد نقش جدیدی در رباتیک را که توسط عملیات های ویژه آغاز شده است، گسترش دهد. این تخصص، در کنار تلاش دیگر، بر ساخت، اصلاح و ادغام رباتیک و فناوری‌های جدید متمرکز است. اولین سربازان هفته گذشته از این دوره فارغ التحصیل شدند. ارتش ایالات متحده می خواهد پس از فارغ التحصیلی اولین تکنسین های رباتیک خود، تخصص جدیدی را در رباتیک گسترش دهد که توسط عملیات های ویژه در سراسر نیروهای متعارف آغاز شده است. تخصص جدید و توسعه مورد انتظار منعکس کننده این باور رو به رشد ارتش است که جنگ های آینده به متخصصانی نیاز دارند که بتوانند با تکنولوژی میدان نبرد به سرعت در حال تکامل همگام شوند. جنگ در اوکراین نشان داده است که راه‌حل‌های نوآورانه چقدر سریع می‌توانند منسوخ شوند و سربازان را مجبور به سازگاری در این میدان کند. ژنرال لارنس فرگوسن، رئیس فرماندهی عملیات ویژه ارتش ایالات متحده، ماه گذشته در یک کنفرانس ارتش گفت که انتظار می رود فرماندهی عملیات ویژه ارتش ایالات متحده برای گسترش تخصص جدید - که به طور رسمی تکنسین رباتیک - فراتر از عملیات ویژه در هفته های آینده است، به مقامات ارتش بازخورد ارائه دهد. ژنرال کریستوفر لانیو، سرپرست ستاد ارتش، در همان رویداد گفت: \"این کارشناسان فنی به تیم های فرماندهی کمک می کنند تا ادغام در سراسر نیرو را درک کنند.\" او گفت: «ما در حال گسترش این موضوع در ارتش هستیم. ارتش به جای صرفاً پرواز پهپادها، این متخصصان رباتیک جدید را برای ادغام پهپادها، ربات های زمینی، هوش مصنوعی و سایر سیستم های خودمختار در سراسر عملیات نظامی آموزش می دهد."}, {"source": "Business Insider", "title": "Is StubHub legit? Here's why we trust the site for buying and reselling tickets", "link": "https://www.businessinsider.com/guides/tickets/stubhub-review-fees", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Chris Pizzello/AP; AP Photo/Charles Sykes; Scott A. Garfitt/Invision/AP If you're shopping for resale tickets, StubHub is one of the biggest marketplaces for concerts, sports, theater, comedy, festivals, and other live events. It can be especially useful when tickets are sold out through the original seller or when you want more seat options to compare. Before buying, it helps to know how StubHub works, whether StubHub is legit, and what to expect from the resale process. StubHub doesn't usually set ticket prices itself. Instead, the platform connects buyers with third-party sellers who set their own asking prices based on demand, seat location, available inventory, and the event's proximity. That means prices can change quickly, with some tickets dipping below face value while seats for high-demand events can cost much more than the original price. Browse tickets at StubHub. A major reason StubHub is widely trusted is its FanProtect Guarantee, which ensures buyers receive valid tickets in time for the event. If there's an issue, such as invalid tickets or delivery problems, StubHub will attempt to provide replacement tickets or issue a refund. When an event is canceled and not rescheduled, buyers may receive either a full refund or a 120% credit toward a future purchase. That said, StubHub isn't without drawbacks. Service fees can be higher than those of some competing platforms, and because prices are set by sellers, availability and cost can vary significantly. It's also important to note that FanProtect does not guarantee refunds for postponed or rescheduled events unless the event is officially canceled. Below, we break down how StubHub works in 2025, including its buyer protections, refund policies, fees, and tips for avoiding scams—so you can decide whether it's the right place to buy tickets for your next event. Is StubHub legit? In short, StubHub is a trustworthy platform for buying and selling tickets to major events. Although the company itself is not the seller, it still offers safeguards for both parties in a sale to prevent potential scams. It does, however, mean that StubHub does not control the pricing of event tickets — these are set by the users selling them. The site will instead recommend price points for sellers during the listing process. StubHub offers a 100% guarantee on every order through its exclusive FanProtect Guarantee, which I've bro", "date_str": "2026-10-05T20:00:43+00:00", "hash": "0b7d20ca3e53096e", "title_fa": "آیا StubHub قانونی است؟ به همین دلیل است که ما به سایت برای خرید و فروش مجدد بلیط اعتماد داریم", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Chris Pizzello/AP. AP Photo/چارلز سایکس; Scott A. Garfitt/Invision/AP اگر در حال خرید بلیط های فروش مجدد هستید، StubHub یکی از بزرگترین بازارهای کنسرت، ورزش، تئاتر، کمدی، جشنواره ها و سایر رویدادهای زنده است. این می تواند به ویژه زمانی مفید باشد که بلیط ها از طریق فروشنده اصلی فروخته می شوند یا زمانی که می خواهید گزینه های صندلی بیشتری برای مقایسه داشته باشید. قبل از خرید، دانستن اینکه StubHub چگونه کار می کند، قانونی بودن StubHub و انتظارات از فرآیند فروش مجدد کمک می کند. StubHub معمولاً خودش قیمت بلیط را تعیین نمی کند. در عوض، این پلتفرم خریداران را با فروشندگان شخص ثالث مرتبط می‌کند که قیمت‌های درخواستی خود را بر اساس تقاضا، مکان صندلی، موجودی موجود و نزدیکی رویداد تعیین می‌کنند. این بدان معناست که قیمت‌ها می‌توانند به سرعت تغییر کنند، به طوری که برخی از بلیط‌ها کمتر از قیمت اسمی هستند، در حالی که صندلی‌ها برای رویدادهای پرتقاضا ممکن است بسیار بیشتر از قیمت اصلی قیمت داشته باشند. بلیط ها را در StubHub مرور کنید. دلیل اصلی مورد اعتماد StubHub ضمانت FanProtect آن است که تضمین می کند خریداران بلیط های معتبر را به موقع برای رویداد دریافت می کنند. اگر مشکلی وجود داشته باشد، مانند بلیت‌های نامعتبر یا مشکلات تحویل، StubHub تلاش می‌کند بلیط‌های جایگزین ارائه کند یا بازپرداخت وجه را صادر کند. هنگامی که یک رویداد لغو می شود و دوباره برنامه ریزی نمی شود، خریداران ممکن است بازپرداخت کامل یا 120٪ اعتبار برای خرید آینده دریافت کنند. با این حال، StubHub بدون اشکال نیست. هزینه‌های خدمات می‌تواند بالاتر از برخی از پلتفرم‌های رقیب باشد، و چون قیمت‌ها توسط فروشندگان تعیین می‌شود، در دسترس بودن و هزینه می‌تواند به‌طور قابل توجهی متفاوت باشد. همچنین مهم"}, {"source": "Business Insider", "title": "The 13 artists with the most No. 1 singles on the Billboard Hot 100", "link": "https://www.businessinsider.com/artists-with-most-no-1-songs-billboard-hot-100-chart", "summary": "Taylor Swift. Matt Winkelmeyer/Getty Images for The Recording Academy There are only 13 artists in Billboard history who have topped the Hot 100 at least 10 times. Taylor Swift secured her 16th No. 1 hit in October 2026. The Beatles have the most No. 1 songs ever (20), followed closely by Mariah Carey (19). Throughout music history, there have been plenty of record-breaking songs , albums, and acts. These 13, however, have seen the most success on the Billboard Hot 100, which is widely considered to be the definitive ranking of best-selling songs in the US. Keep scrolling to see the elite tier of singles artists, listed from least to most No. 1 hits. 11 (tie). Bruno Mars — 10 Bruno Mars. Kevin Mazur/Getty Images for SelvaRey Mars earned his 10th No. 1 single — and his first song to debut at No. 1 — in January 2026 with \"I Just Might.\" This comes 16 years after his first chart-topper, \"Nothin' on You,\" in May 2016. Then came: \"Just the Way You Are\" also 0) و بعد از آن ماریا کری (19) است. در طول تاریخ موسیقی، آهنگ‌ها، آلبوم‌ها و اجراهای رکوردشکنی زیادی وجود داشته است. با این حال، این 13 آهنگ بیشترین موفقیت را در Billboard Hot 100 داشته اند، که به طور گسترده به عنوان رتبه قطعی پرفروش ترین آهنگ ها در ایالات متحده در نظر گرفته می شود. به پیمایش ادامه دهید تا ردیف نخبگان هنرمندان مجرد را ببینید که از حداقل تا بیشترین بازدیدهای شماره 1 فهرست شده اند. 11 (تساوی). برونو مارس - 10 برونو مارس. کوین مازور/گتی ایماژ برای SelvaRey Mars دهمین تک‌آهنگ شماره 1 خود را به دست آورد - و اولین آهنگش که اولین آهنگش را در رتبه اول پخش کرد. 1 - در ژانویه 2026 با \"I Just Might.\" این فیلم 16 سال پس از اولین نفر اول جدول او، \"Nothin' on You\" در می 2016 است. پس از آن آمدند: \"Just Way You are\" همچنین در سال 2010، \"Grenade\" در سال 2011، \"Locked Out of Heaven\" در سال 2012، \"When I Was Your Man\" در سال 2013، \"Upp Town!\" در سال 2015، \"این چیزی است که من دوست دارم\" در سال 2017، \"در را باز بگذار\" در سال 2021، و \"بمیر با لبخند\" در سال 2025. 11 (کراوات). استیوی واندر — 10 استیوی واندر در حال اجرا در سی و دومین دوره جوایز سالانه گرمی. CBS/Getty Images در سال 1963، در تنها 13 سالگی، استیوی واندر اولین آهنگ شماره 1 خود را با \"Fingertips\" به دست آورد. او جوانترین هنرمندی بود که تا به حال"}, {"source": "Business Insider", "title": "Only 94 songs have debuted at No. 1 in the history of the Billboard Hot 100 — here they all are", "link": "https://www.businessinsider.com/every-no-1-song-debut-billboard-hot-100", "summary": "Drake, Michael Jackson, Taylor Swift, and Ariana Grande. Prince Williams/Wireimage, Michel Linssen/Redferns, Kevin Mazur/Getty, Kevin Mazur TAS23/Getty, Tyler Le/BI Only 94 songs have debuted atop the Billboard Hot 100 since the chart was launched in 1958. \"Patient Zero\" by Taylor Swift is the most recent song to achieve this feat. Drake and Swift are tied for the most entries with 10 apiece, followed by Ariana Grande with eight. The Billboard Hot 100 is widely considered the definitive all-genre singles chart in the US. Although it was officially launched in 1958, Billboard began using modern airplay and sales data in 1991, allowing for more time-sensitive calculations and accurate rankings. Did you know Business Insider has a Spotify playlist? Listen now. Well over 1,000 songs have reached the coveted No. 1 spot , but it's far more difficult for a song to debut in the top position; it typically means a much-promoted single has met high expectations, or at least that an artist is supported and beloved by a legion of fans. Keep reading for a complete list of instant chart-toppers throughout history, listed below in chronological order. 1. You Are Not Alone by Michael Jackson You Are Not Alone was released on August 15, 1995. Michael Jackson/YouTube Michael Jackson was the first artist to achieve this feat with \"You Are Not Alone,\" which debuted at No. 1 on the chart dated September 2, 1995. It was the second single from Jackson's ninth album, \"HIStory: Past, Present and Future, Book I.\" 2. Fantasy by Mariah Carey Fantasy was released on September 12, 1995. Mariah Carey/YouTube \"Fantasy\" debuted at No. 1 on the chart dated September 30, 1995. It was the lead single from Mariah Carey's fifth album, \"Daydream.\" 3. Exhale (Shoop Shoop) by Whitney Houston Exhale (Shoop Shoop) was released on November 7, 1995. Whitney Houston/YouTube \"Exhale (Shoop Shoop)\" debuted at No. 1 on the chart dated November 25, 1995. It was the lead single from the soundtrack for the film \"Waiting to Exhale.\" 4. One Sweet Day by Mariah Carey Boyz II Men One Sweet Day was released on November 14, 1995. Mariah Carey/YouTube \"One Sweet Day\" debuted at No. 1 on the chart dated December 2, 1995. It was the second single from Carey's fifth album, \"Daydream.\" 5. I ll Be Missing You by Puff Daddy Faith Evans, featuring 112 I ll Be Missing You was released on May 23, 1997. Bad Boy Entertainment/YouTube \"I'll Be Missing You\" debuted at No. 1 on the chart dated June 14, 1997. It was the second si", one-songs-billboard-hot-100-chart", "summary": "Taylor Swift onstage at the Eras Tour. Shirlaine Forrest/TAS24/Getty Images for TAS Rights Management Taylor Swift's newest single, \"Patient Zero,\" debuted at No. 1 on the Billboard Hot 100. Swift has the fourth-most No. 1 hits in history, trailing Elvis, Mariah Carey, and The Beatles. Swift's biggest hits also include \"Blank Space,\" \"Anti-Hero,\" and \"The Fate of Ophelia.\" Since releasing her first No. 1 album in 2008, Taylor Swift has enjoyed a historic run on the charts, topping the Billboard 200 and Billboard Hot 100 over a dozen times each. Swift's collection of chart-toppers includes both radio-friendly pop singles and understated gems pushed to the top of the chart by passionate fans. Most recently, \"Patient Zero\" joined the ranks of Swift's biggest songs. On the all-time ranking of most No. 1 hits , Swift only trails Elvis, Mariah Carey, and The Beatles. All of Swift's No. 1 songs on the Hot 100 are listed below in chronological order of their peak dates. 1. We Are Never Ever Getting Back Together We Are Never Ever Getting Back Together was released as a single in 2012. Taylor Swift/YouTube Weeks at No. 1: Three Despite writing ubiquitous hits like \"You Belong With Me\" and \"Love Story\" earlier in her career (which peaked at No. 2 and No. 4, respectively), \"We Are Never Ever Getting Back Together\" was Swift's first-ever song to top the Hot 100. The country-pop crossover smash was released as the lead single from Swift's fourth album, \"Red.\" It rose from No. 72 to No. 1 in its second week of tracking and remained atop the chart for two more weeks. 2. Shake It Off Shake It Off was released as a single in 2014. Taylor Swift/YouTube Weeks at No. 1: Four \"Shake It Off\" was released as the lead single from Swift's fifth album, \"1989.\" It became her first No. 1 debut on the Hot 100. 3. Blank Space Blank Space was released as a single in 2014. Taylor Swift/YouTube Weeks at No. 1: Seven \"Blank Space,\" the second single from \"1989,\" debuted at No. 18 on the Hot 100. It rose to No. 13 before soaring to No. 1 in its third week — dethroning \"Shake It Off\" and making Swift the first woman in history to replace herself in the chart's top spot. \"Blank Space\" went on to become one of Swift's biggest hits, reigning atop the chart for nearly two months. 4. Bad Blood featuring Kendrick Lamar Bad Blood was released as a single in 2015. Taylor Swift/YouTube Weeks at No. 1: One In May 2015, a remix of \"Bad Blood\" featuring Kendrick Lamar was released as the fourth single f", "date_str": "2026-10-05T18:55:13+00:00", "hash": "bbbfc064bad360cd", "title_fa": "«بیمار صفر» تیلور سویفت جدیدترین موفقیت او در رتبه 1 است. در اینجا تمام 16 آهنگ او که در صدر جدول قرار گرفتند را مشاهده می کنید.", "summary_fa": "تیلور سویفت روی صحنه در تور Eras. شیرلین فارست/TAS24/گتی ایماژ برای مدیریت حقوق TAS جدیدترین تک آهنگ تیلور سویفت، \"بیمار صفر\"، در رتبه 1 در بیلبورد هات 100 قرار گرفت. سوئیفت پس از الویس، ماریا کری، و بیتلز، چهارمین موفقیت شماره 1 تاریخ را دارد. از بزرگترین موفقیت های سوئیفت نیز می توان به «فضای خالی»، «ضد قهرمان» و «سرنوشت اوفلیا» اشاره کرد. از زمان انتشار اولین شماره اش. تیلور سوئیفت با 1 آلبوم در سال 2008، از حضور تاریخی در چارت ها لذت برد و هر کدام بیش از ده بار در صدر بیلبورد 200 و بیلبورد هات 100 قرار گرفت. مجموعه سوئیفت از برترین‌های جدول شامل تک‌آهنگ‌های پاپ رادیویی و جواهراتی است که توسط طرفداران پرشور به بالای جدول کشیده شده‌اند. اخیراً \"بیمار صفر\" به جمع بزرگترین آهنگ های سوئیفت پیوست. سوئیفت در رده بندی تاریخ بیشترین بازدیدهای شماره 1، فقط الویس، ماریا کری و بیتلز را دنبال می کند. همه شماره های سوئیفت 1 آهنگ در Hot 100 در زیر به ترتیب زمانی تاریخ اوج آنها فهرست شده است. 1. We Are Never Ever Getting Back Together We Are Never Ever Getting Back Together در سال 2012 به عنوان یک تک آهنگ منتشر شد. تیلور سویفت/هفته های یوتیوب در رتبه 1: سه با وجود نوشتن آهنگ های موفقی مانند \"You Belong With Me\" و \"Love Story\" در اوایل دوران حرفه ای خود (که با احترام به اوج 4 رسیدیم). Getting Back Together» اولین آهنگ سوئیفت بود که در صدر 100 آهنگ داغ قرار گرفت. کراس اوور کانتری پاپ به عنوان تک آهنگ اصلی چهارمین آلبوم سوئیفت، \"قرمز\" منتشر شد. در دومین هفته ردیابی خود از شماره 72 به شماره 1 رسید و دو هفته دیگر در صدر جدول باقی ماند. 2. Shake It Off Shake It Off به عنوان یک تک آهنگ در سال 2014 منتشر شد."}, {"source": "Business Insider", "title": "The college with the highest first-year retention rate in every state", "link": "https://www.businessinsider.com/college-highest-first-year-retention-rate-every-state-2026-9", "summary": "The Massachusetts Institute of Technology had a first-year retention rate of 99%. Erica Denhoff/Icon Sportswire via Getty Images The Massachusetts Institute of Technology has a reputation for producing famous tech dropouts. But in reality, 99% of first-year students return — the highest rate in Massachusetts. Here is the college with the highest first-year retention rate in every state. Getting a student to choose a college is one thing. Getting them to come back for another year is just as important. Ranging from Ivy League universities to military academies , Business Insider calculated the college with the highest retention rate in each state. The first-year retention rate shows the proportion of students who return to their studies in the fall for their sophomore year. It's a metric colleges care about because it can indicate higher student satisfaction and strong academic support. Business Insider compiled each state's winner using provisional fall 2024 data from the Department of Education's Integrated Postsecondary Education Data System (IPEDS). The retention rate covers full-time, first-time bachelor-seeking students who entered in fall 2023 and measures whether they returned for fall 2024. The cohort size is adjusted to account for any permitted exclusions, such as a student's death. Business Insider also limited the data to degree-granting institutions only and set a minimum cohort size of 100 to avoid very small cohorts inflating retention rates. Because the data is provisional, the figures could be revised and should not be considered final counts. Here are the colleges with the highest retention rate in every state. ALABAMA: Auburn University Auburn University Ray Tan/Getty Images Adjusted first-year cohort: 5,915 Retention rate: 95% ALASKA: University of Alaska Fairbanks University of Alaska Fairbanks pabradyphoto/Getty Images Adjusted first-year cohort: 451 Retention rate: 74% ARIZONA: Arizona State University (Campus Immersion) GummyBone/Getty Images Adjusted first-year cohort: 13,867 Retention rate: 87% ARKANSAS: University of Arkansas neiu20001/Getty Images Adjusted first-year cohort: 6,289 Retention rate: 86% CALIFORNIA: Claremont McKenna College Myung J. Chun / Los Angeles Times via Getty Images Adjusted first-year cohort: 321 Retention rate: 98% COLORADO: United States Air Force Academy sanfel/Getty Images Adjusted first-year cohort: 1,101 Retention rate: 97% CONNECTICUT: United States Coast Guard Academy Cadet Memorial Field at the Un", "date_str": "2026-10-05T18:16:23+00:00", "hash": "a92f0acaa72ca024", "title_fa": "کالج با بالاترین نرخ حفظ سال اول در هر ایالت", "summary_fa": "مؤسسه فناوری ماساچوست در سال اول نرخ نگهداری 99٪ داشت. اریکا دنهوف/آیکون اسپورت وایر از طریق گتی ایماژ موسسه فناوری ماساچوست به تولید افرادی مشهور از فناوری شهرت دارد. اما در واقعیت، 99٪ از دانش آموزان سال اول بازگشت - بالاترین نرخ در ماساچوست. در اینجا کالجی با بالاترین نرخ حفظ سال اول در هر ایالت وجود دارد. وادار کردن دانشجو به انتخاب دانشگاه یک چیز است. بازگرداندن آنها برای یک سال دیگر به همان اندازه مهم است. از دانشگاه‌های آیوی لیگ گرفته تا آکادمی‌های نظامی، Business Insider کالجی را محاسبه کرد که بالاترین میزان ماندگاری را در هر ایالت دارد. نرخ ماندگاری سال اول نشان دهنده نسبت دانشجویانی است که در پاییز برای سال دوم به تحصیل خود باز می گردند. این معیاری است که کالج‌ها به آن اهمیت می‌دهند، زیرا می‌تواند نشان‌دهنده رضایت بیشتر دانشجویان و حمایت علمی قوی باشد. Business Insider برنده هر ایالت را با استفاده از داده‌های موقت پاییز 2024 از سیستم یکپارچه داده آموزش پس از دوره متوسطه وزارت آموزش (IPEDS) گردآوری کرد. نرخ ماندگاری دانشجویان تمام وقت و برای اولین بار به دنبال لیسانس که در پاییز 2023 وارد شده اند را پوشش می دهد و بررسی می کند که آیا آنها برای پاییز 2024 بازگشته اند یا خیر. اندازه گروه برای در نظر گرفتن هرگونه استثنای مجاز، مانند مرگ یک دانش آموز، تنظیم می شود. Business Insider همچنین داده‌ها را فقط به مؤسسات اعطای مدرک محدود کرده و حداقل اندازه همگروهی را 100 تعیین کرده است تا از افزایش نرخ نگهداری گروه‌های بسیار کوچک جلوگیری شود. از آنجایی که داده ها موقتی هستند، ارقام می توانند تجدید نظر شوند و نباید به عنوان شمارش نهایی در نظر گرفته شوند. در اینجا کالج هایی با بالاترین نرخ حفظ در هر ایالت آورده شده است. آلاباما: دانشگاه آبرن دانشگاه آبرن ری تان/گتی ایماژهای تنظیم"}, {"source": "Business Insider", "title": "Sam Altman says Elon Musk is a ‘bully’ who only respects people who punch him back", "link": "https://www.businessinsider.com/sam-altman-elon-musk-punch-back-cooperation-2026-10", "summary": "OpenAI CEO Sam Altman Heather Diehl/Getty Images OpenAI CEO Sam Altman said a little drama may grease the gears for talks with Elon Musk. \"I think once in a while you've got to punch a bully back in the nose,\" Altman told Vanity Fair. Altman said that Musk \"only respects people\" who take such an approach. Sam Altman says you need to accept some level of drama if you want him and Elon Musk to work together. \"I think once in a while you've got to punch a bully back in the nose,\" Altman told Vanity Fair during a wide-ranging interview. \"And I also think Elon, like many bullies, only respects people who do.\" Altman and Musk had a famous falling-out that has since been recounted and is at the center of multiple legal battles. Their drama, which is far from the only simmering beef in the AI world , is now also the backdrop to efforts among the world's largest AI companies to reach a consensus on how to steer their technology. The OpenAI CEO said he would work with Musk, who has taken to calling his one-time ally \"Scam Altman ,\" as the industry grapples with renewed concerns over AI safety. \"If you want me to be able to work with him, maybe you should be happy I hit back once in a while, but I will work with Elon, of course,\" he said. For his part, Altman said that he \"won't call myself a saint.\" At the same time, he doesn't view himself as the biggest problem. \"I'm not sure if I'm the one that you're supposed to come after between Elon and me,\" he said. In July, Musk lashed out at Altman when another account said that he had \"warned the world about Scam Altman.\" Musk quoted that post and added, \"He takes scamming to a whole new level.\" In response, Altman took a shot at Musk's advocacy for orbital data centers , something the OpenAI CEO has repeatedly expressed skepticism about. \"Homeboy you're the one selling public market investors on short-term space datacenters,\" Altman wrote. Despite the drama, AI companies have taken more steps toward cooperation. Leaders of OpenAI, Anthropic, SpaceXAI, Google, and Nvidia signed a White House-driven agreement in which the companies agreed to some self-imposed safety measures. Altman told Politico's Decoded Podcast that there's no single group chat, but officials at frontier labs have multiple avenues to continue talking. \"There's no like big WhatsApp that everybody's in,\" Altman said, \"but there's like lots of, you know, people are running into each other at the same conference. There's calls, occasional meetings, stuff li", "date_str": "2026-10-05T18:09:53+00:00", "hash": "15cb736925d14171", "title_fa": "سم آلتمن می‌گوید ایلان ماسک یک «قلدر» است که فقط به افرادی احترام می‌گذارد که به او ضربه می‌زنند", "summary_fa": "سام آلتمن، مدیر عامل OpenAI، هدر دیهل/ گتی ایماژ، مدیر عامل OpenAI، سام آلتمن، گفت که یک درام کوچک ممکن است چرخ دنده های مذاکره با ایلان ماسک را چرب کند. آلتمن به Vanity Fair گفت: «من فکر می‌کنم هر چند وقت یک بار باید با مشت به بینی یک قلدر بکوبی. آلتمن گفت که ماسک «فقط به افرادی احترام می‌گذارد» که چنین رویکردی دارند. سم آلتمن می گوید اگر می خواهید او و ایلان ماسک با هم کار کنند، باید سطحی از درام را بپذیرید. آلتمن طی یک مصاحبه گسترده به Vanity Fair گفت: \"من فکر می کنم هر چند وقت یک بار باید با مشت به بینی یک قلدر بکوبید.\" و همچنین فکر می کنم ایلان، مانند بسیاری از قلدرها، فقط به افرادی که این کار را می کنند، احترام می گذارد. آلتمن و ماسک درگیری معروفی داشتند که از آن زمان بازگو شده و در مرکز چندین نبرد حقوقی قرار دارد. درام آنها، که به دور از تنها گوشت گاو در حال جوشیدن در دنیای هوش مصنوعی است، اکنون پس‌زمینه تلاش‌های بزرگ‌ترین شرکت‌های هوش مصنوعی جهان برای دستیابی به اجماع در مورد نحوه هدایت فناوری خود است. مدیر عامل OpenAI گفت که با ماسک، که متحد سابقش را «کلاهبردار آلتمن» خطاب کرده است، کار خواهد کرد، زیرا صنعت با نگرانی‌های جدید در مورد ایمنی هوش مصنوعی دست و پنجه نرم می‌کند. او گفت: \"اگر می خواهید من بتوانم با او کار کنم، شاید باید خوشحال باشید که هر چند وقت یک بار به او پاسخ می دهم، اما البته با ایلان کار خواهم کرد.\" آلتمن به نوبه خود گفت که \"خود را قدیس نمی خواند.\" در عین حال، او خود را بزرگترین مشکل نمی بیند. او گفت: \"من مطمئن نیستم که آیا من کسی هستم که شما قرار است بین من و ایلان بیایید.\" در ماه ژوئیه،"}, {"source": "Business Insider", "title": "Steve Eisman hits back at fellow 'Big Short' trader Michael Burry's bearish AI thesis", "link": "https://www.businessinsider.com/steve-eisman-michael-burry-bearish-ai-trade-chips-nvda-crwv-2026-10", "summary": "Steve Eisman has called out his fellow Big Short trader Michael Burry on his AI thesis. Photo 1: Astrid Stawiarz/Getty Images); Photo 2: HECTOR RETAMAL / AFP) (Photo by HECTOR RETAMAL/AFP via Getty Images Two famed financial-crisis veterans are at odds over views on the AI boom. Michael Burry has sounded the alarm about a worrying component of the chip trade. Eisman hit back recently. He said Burry's thesis is \"too academic,\" citing different concerns. Michael Burry and Steve Eisman both rose to fame betting against the US housing market, but they're at odds over what the future may hold for the AI trade. Unbridled enthusiasm for AI has often been the target of Burry's bearish posts. Earlier this year, he announced bets against some of the sector's leading names and has predicted that the AI boom will end in disaster. Burry has taken aim at a specific piece of the AI story, specifically booming demand for high-tech chips to run and train models. The data center explosion has been a boon for hardware makers like Nvidia, but Burry argues that depreciating chip values are a major problem for companies. Earlier this year, he predicted the top hyperscalers would \"understate depreciation\" by more than $175 billion between 2026 and 2028. Famed short-seller Jim Chanos has voiced similar concerns about chip costs and returns on capex spending. But speaking on an episode of the New Money podcast, fellow \"Big Short\" alum Steve Eisman hit back at Burry's views. \"With all due respect to Michael, I think his argument is too academic,\" Eisman stated. \"If AI succeeds because Anthropic and OpenAI grow like crazy, and the hyperscalers do well, it won’t matter whether the depreciation schedule changed from three or four years to five or six years.\" Burry has shared this take on AI and the broader market in the last year on his Substack, Cassandra Unchained, laying out what he sees as the risks for investors due to hyperscalers overstating profits and under-reporting depreciating hardware. Eisman noted that he understands Burry's argument when it comes to AI chip depreciation schedules, an accounting tactic that made them appear significantly more profitable on paper. While Eisman implied that he agrees with Burry on the potential impact of chip depreciation, he said it's not a major problem right now. \"Where I think he is wrong, for the moment, is that there is such demand for chips right now that there is still huge demand for the older chips,\" Eisman said. Recent news out ", "date_str": "2026-10-05T18:02:34+00:00", "hash": "ae8a3b8aec7eca3e", "title_fa": "استیو آیسمن به تز نزولی هوش مصنوعی مایکل بری، معامله گر «Big Short» پاسخ داد.", "summary_fa": "استیو آیسمن در پایان نامه هوش مصنوعی خود مایکل بری، معامله گر Big Short را صدا کرده است. عکس 1: آسترید استاویارز/گتی ایماژ); عکس 2: HECTOR RETAMAL / AFP) (عکس از HECTOR RETAMAL/AFP از طریق Getty Images دو جانباز مشهور بحران مالی بر سر دیدگاه ها در مورد رونق هوش مصنوعی با هم اختلاف دارند. مایکل بری زنگ خطر را در مورد یکی از اجزای نگران کننده تجارت تراشه به صدا درآورده است. آیسمن اخیراً پاسخ داده است. او گفت که پایان نامه دانشگاهی بری متفاوت است.\" مایکل بری و استیو آیسمن هر دو در شرط بندی علیه بازار مسکن ایالات متحده به شهرت رسیدند، اما در مورد آینده ای که ممکن است برای تجارت هوش مصنوعی در انتظار باشد، اختلاف نظر دارند. اشتیاق افسارگسیخته برای هوش مصنوعی اغلب هدف پست های نزولی Burry بوده است. اوایل سال جاری، او شرط بندی هایی را علیه برخی از نام های برجسته این بخش اعلام کرد و پیش بینی کرد که رونق هوش مصنوعی با فاجعه پایان خواهد یافت. Burry بخش خاصی از داستان هوش مصنوعی را هدف قرار داده است، به ویژه تقاضای رونق برای تراشه های با فناوری پیشرفته برای اجرا و آموزش مدل ها. انفجار مرکز داده برای سازندگان سخت‌افزاری مانند انویدیا یک موهبت بوده است، اما بری استدلال می‌کند که کاهش ارزش تراشه‌ها یک مشکل بزرگ برای شرکت‌ها است. اوایل سال جاری، او پیش‌بینی کرد که ابرمقیاس‌کننده‌های برتر بین سال‌های 2026 تا 2028 بیش از 175 میلیارد دلار استهلاک را کم‌تر اعلام کنند. جیم چانوس، فروشنده مشهور کوتاه‌فروشی، نگرانی‌های مشابهی را در مورد هزینه‌های تراشه و بازده مخارج سرانه ابراز کرده است. اما در یکی از قسمت‌های پادکست New Money، استیو آیسمن، یکی از دانش‌آموزان «Big Short» به نظرات بری پاسخ داد. آیسمن گفت: \"با تمام احترامی که برای مایکل قائل هستم، فکر می کنم استدلال او بیش"}, {"source": "Lifehacker", "title": "These Are the Best October Prime Day Deals on Kindles and E-Readers", "link": "https://lifehacker.com/tech/best-kindle-and-e-reader-prime-day-deals-october-prime-day-2026?utm_medium=RSS", "summary": "We may earn a com em, which measures your room's acoustics and adjusts the sound accordingly. The process takes a few minutes, but it helps the soundbar perform better across different spaces rather than relying on a one-size-fits-all tuning profile. The soundbar also works as a smart speaker, with Amazon Alexa built in and support for Apple AirPlay 2, Google Cast, Spotify Connect, Bluetooth, and multi-room audio through the Bose app. Its biggest compromise is bass for a single soundbar, its low end is respectable, but it can't fully replace what a dedicated subwoofer brings to action movies, concerts, or bass-heavy music. The good news is that Bose allows you to expand the system later with compatible wireless subwoofers and surround speakers if you decide you want more impact. For anyone looking for a premium one-piece soundbar that delivers convincing Dolby Atmos effects, clear dialogue, built-in smart features, and a much larger soundstage than TV speakers can provide, the Smart Ultra remains one of the strongest standalone options available, especially at this price. Our Best Editor-Vetted Prime Day Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $179.00 (List Price $249.00) Sony WH-1000XM5 $198.00 (List Price $399.99) Ring Indoor Cam Plus 2K Wired Security Camera (2-Pack, White) $59.98 (Li", "date_str": "2026-10-06T13:15:00+00:00", "hash": "d9d1481086272122", "title_fa": "Soundbar Smart Ultra Premium Bose برای روز اول اکتبر بیش از 300 دلار تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. طبق گزارش ردیاب‌های قیمت، فروش اکتبر پرایم روز آمازون، Bose Smart Ultra Soundbar را از 999 دلار معمولی خود به 679 دلار کاهش داده است. PCMag Smart Ultra را \"بی نظیر\" ارزیابی کرد و توانایی آن را در ارائه صدای Dolby Atmos به طرز شگفت انگیزی بدون نیاز به اتاقی پر از بلندگوهای اضافی برجسته کرد. اگر به مدل سطح بالای Bose نیاز ندارید، یک گزینه ارزان‌تر Prime Day ن e they still hold, and he singled out both their audio performance and noise cancellation for praise. Sony WH-1000XM6 Headphones $378.00 at Amazon $459.99 Save $81.99 Get Deal Get Deal $378.00 at Amazon $459.99 Save $81.99 That noise cancellation is helped by one of the bigger upgrades Sony made with the XM6 over the previous model increasing the microphone count from eight on the XM5 to 12. Those microphones help power the active noise cancellation, Ambient Sound mode, and Adaptive Sound Control, so the headphones can respond to what's happening around you and automatically adjust how much outside sound gets through as your environment changes. There s also plenty to tinker with in Sony s companion app, including a customizable EQ for dialing in the sound to your preferences. You can even see which Bluetooth codec is currently being used the XM6 supports LDAC alongside AAC, SBC, and LC3. Battery life is another reason the XM6 works well as an everyday pair it can last up to 30 hours with ANC enabled and 40 hours with it switched off, although your actual runtime will vary depending on how you use them. That should comfortably cover a few days of commuting or work, as well as most long-haul flights. Sony has also kept the 3.5mm headphone jack for times when a wired connection makes more sense, such as plugging into an airplane entertainment system or an older audio device. October Prime Day FAQs When is Prime Day? October Prime Day begins Oct. 6 and runs through Oct. 7. It happens every year during October. When does Prime Day end? October Prime Day ends on Oct. 7, 2026. It s a two-day online sale. Is Prime Day a scam? No. Prime Day is a legitimate online sale from arguably the biggest and most reputable online retailer in the world. Our Best Editor-Vetted Prime Day Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart ", "date_str": "2026-10-06T13:09:36+00:00", "hash": "3d5e071f7bc583a1", "title_fa": "هدفون WH-1000XM6 پرچمدار سونی برای روز اول اکتبر ارزان تر ا rime Big Deal Days\" event starting today and continuing through Wednesday night let me redirect your attention to another category of e-readers entirely. Tiny e-ink devices I'm talking credit card-sized, with screens that measure around four inches are all the rage in 2026. If you too can see the appeal of carrying all of your books with you on a device so small you'll forget it's even in your pocket, it's not a bad time to jump in: Two of the best options on the market, the recently released Xteink X4 Classic and the even smaller X3 , are up to 21% off for October Prime Day. Xteink X4 Classic 4.3-Inch Pocket E-Reader $69.99 at Amazon $89.00 Save $19.01 Get Deal Get Deal $69.99 at Amazon $89.00 Save $19.01 Xteink X3 3.7-Inch Pocket E-Reader $58.65 at Amazon $69.00 Save $10.35 Get Deal Get Deal $58.65 at Amazon $69.00 Save $10.35 SEE -1 MORE Xteink is a Chinese startup that shook up the e-reading world last year with the launch of the X4 , a super bare-bones device that made up for its lack of features and usability with a cheap sub-$70 price point. Since then, a huge online community of fans has formed around the device, sharing tips on Reddit and even coming together to crowdsource an alternate operating system that fixes a lot of its early problems . Xteink quickly followed up the X4 with a slate of other devices, including the X3 and the X4 Pro , which adds a front light and touchscreen (at the cost of screen clarity and two physical buttons). The X3 was released early this year, improving on the original X4 by adding in quality-of-life improvements like a larger battery, relocated page-turn buttons, a real-time clock, and a tilt-to-turn-page feature. The X4 Classic, released in September, incorporates those changes and is also 6g lighter and a millimeter thinner than the X4, though there is a trade-off involved there: Both the X3 and the X4 Classic dropped their USB-C charging ports in favor of magnetic pogo pins that require a separate cable or adapter. These eld 2 display should prevent more scratches and cracks than past Apple Watches in this category. Lifehacker senior health editor Beth Skwarecki thinks the Series 12 is worth the upgrade at its original MSRP , so this is a bit of a no-brainer if you were already interested. The only caveat here is that the Series 12 isn't the only Apple Watch discount worth considering this October Prime Day. While the Apple Watch Ultra 4 isn't on sale, the Apple Watch SE 3 is . This isn't a \"new\" watch, per se, but it is Apple's best watch for most people. You don't get any of the above perks of the Series 12, but you do get the capable S10 chip, Apple's standard heart rate monitor, sleep and exercise tracking, and the ability to send and receive texts. There's a host of fitness and health crossover here, and, if you opt for the cellular model, you'll connect to the same 5G network as the cellular Series 12. While $349 is a great starting price for the Series 12, the SE 3 currently starts at $199 for October Prime Day. That's a tough price to beat. Our Best Editor-Vetted Prime Day Deals", "date_str": "2026-10-05T21:15:53+00:00", "hash": "3db40f49e6564faa", "title_fa": "اپل واچ جدید سری 12 از قبل برای اولین روز اکتبر در فروش است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. شما انتظار ندارید که آخرین و بهترین محصولات اپل را در فروش ببینید، به خصوص چند هفته پس از عرضه اولیه آنها. در حالی که تخفیف‌های زیادی روی محصولات اپل در روز اول اکتبر وجود دارد، از جمله در برخی از ساعت‌های اپل، مطمئناً پیش‌بینی نمی‌کردم که آخرین پرچمدار اپل کاهش قیمت داشته باشد. و با این حال، ما اینجا هستیم. اپل واچ سری 12 از 399 دلار شروع می شود. اما در روز پرایم اکتبر، اپل 50 دلار تخفیف برای ساعت دارد. با تخفیف، اکنون از 349 دلار شروع می شود، یک قیمت فوق العاده برای یک ساعت با تمام جدیدترین مزایای پوشیدنی اپل. اپل واچ سری 12 یک اپل واچ بخرید و اپل واچ دوم را با تخفیف 300 دلاری در T-Mobile دریافت کنید. معامله دریافت  a few perks. These are all excellent features, but it's tough to justify the additional $600. But what if you could save $200? That makes those perks a bit more worth the upgrade. M5 MacBook Air (13-inch) $1,099.00 at Amazon $1,299.00 Save $200.00 Get Deal Get Deal $1,099.00 at Amazon $1,299.00 Save $200.00 For October Prime Day, Amazon has an excellent deal on the 13-inch M5 MacBook Air, taking $200 off Apple's new and beefier MSRP, bringing the cost down to...well, the M5's launch price. If you've been kicking yourself for not buying one of these machines between March and June, now's your chance to turn back the clock. This MacBook Air comes with a 13.6-inch display (Apple calls it the \"13-inch\" for marketing purposes), with a resolution of 2560 by 1664 and a maximum brightness of 500 nits. You get the M5 chip, which, according to Geekbench, outperforms the MacBook Neo's A18 Pro by nearly 22% in single-core tasks and 134% in multi-core tasks. That extra $400 isn't just going towards an \"Apple tax,\" as you'll notice real-world performance increases for your money. You'll also get a 12MP Center Stage camera for video conferencing and FaceTime calls, Touch ID built into the keyboard, and support for MagSafe charging though you can also charge using either of the two USB 4 ports. Importantly, this model comes with 16GB of RAM and 512GB of storage. That should be plenty for most users, but Amazon is also hosting dis", "date_str": "2026-10-05T20:51:54+00:00", "hash": "d6cd9a5822f083c2", "title_fa": "در روز پرایم اکتبر، می‌توانید یک مک‌بوک ایر با قیمتی که قبل از بحران رم داشت، تهیه کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اگر یکی از مک‌بوک‌های M5 اپل را در زمان عرضه بخرید، برای مدل پایه آن 1099 دلار هزینه داشتید. سپس، بحران حافظه عوارض خود را گرفت و ناگهان، همان دستگاه بدون هیچ ویژگی یا تغییر جدیدی، قیمت آن 200 دلار افزایش یافت. مک بوک ایر که سال ها از 999 دلا  in the future. That's what Apple told 9to5Mac in the following statement : We have identified an issue affecting a small number of iPhone 18 Pro Max users on the AT T network that may cause a device to lose service and be unable to make calls. We released iOS 27.0.1 earlier this week and strongly encourage all iPhone 18 Pro Max users to update now, and are also issuing a carrier settings update today. These updates together are meant to help prevent this issue from occurring. While you can always install iOS 27.0.1 from Settings General Software Update , Apple says that the carrier update will install on its own at some point over the next 14 days. However, I'd advise manually installing it by heading to Settings General About . There won't be any confirmation that the carrier update installs, but rest assured, this process will ensure that it has. What if my iPhone 18 Pro Max cannot connect to cellular? Unfortunately, if your iPhone ", "date_str": "2026-10-05T15:00:00+00:00", "hash": "2ac4458dbd96f75b", "title_fa": "شاید لازم باشد آیفون 18 پرو مکس خود را تعویض کنید", "summary_fa": "آیفون 18 پرو مکس شما می تواند کارهای زیادی انجام دهد. دارای دیافراگم متغیر است که به شما امکان می دهد میزان نوری که به سنسور دوربین برخورد می کند را کنترل کنید. می تواند تا 50 درصد باتری خود را در 15 دقیقه شارژ کند (البته با آداپتور مناسب). و به لطف پردازنده جدید A20 می تواند تمام آخرین ویژگی های هوش مصنوعی اپل را اجرا کند. اما 18 پرو مکس هنوز بیش از همه یک گوشی است. اگر نمی تواند به شبکه تلفن همراه متصل شود، دیگر آیفون ندارید، بلکه یک آی پاد لمسی شکوهمند دارید. متاسفانه، این وضعیتی است که برخی از کاربران آیفون 18 پرو مکس در آن قرار دارند. علیرغم اینکه اپل \"بهترین\" آیفونی است که تا به حال ساخته است، اپل تأیید کرد که \"تعداد کمی\" از 18 واحد پرو مکس به طور خاص در شبکه اپراتور AT T دیگر نمی توانند به سرویس تلفن همراه متصل شوند، زیرا دستگاه ها فقط نماد \"SOS\" را در بالای صفحه نمایش خود نشان می دهند. این یک مشکل بسیار آشکار است: بدون سرویس تلفن همراه، برای استفاده از هر برنامه یا ویژگی که به اینترنت نیاز دارد به اتصال وای فای نیاز خواهید داشت و توانایی برقراری تماس از طریق تلفن همراه را به طور کامل از دست خواهید داد. آنقدر بد است که برخی از کاربران ممکن است حتی نتوانند با 911 تماس بگیرند. اگر آیفون 18 پرو مکس شما توانایی اتصال به سرویس تلفن همراه را دارد، به این معنی نیست که شما در این حالت بی‌خبر هستید. فقط به دلیل اینکه هنوز هیچ مشکلی در دستگاه شما وجود ندارد، همچنان می‌توانید تحت تأثیر این نقص باشید و باید آخرین به‌روزرسانی، iOS 27.0.1، و همچنین آخرین به‌روزرسانی شرکت مخابراتی AT T را نصب کنید تا مطمئن شوید که 18 Pro Max شما در آینده"}],
      media: [{"source": "Billboard", "title": "With His New Memoir, Alice Cooper Is Finally Separating Fact From Fiction: ‘I Want People to See’", "link": "https://www.billboard.com/music/rock/alice-cooper-devil-on-my-shoulder-book-1236354581/", "summary": "Alice Cooper has written a third memoir to set the record straight or as straight as it can be. Oh, there was a time we never would have done this book cause we never would have broken the mystique of Alice Cooper, the shock rock Rock Roll Hall of Famer tells Billboard about the new Devil On My Shoulder (Da Capo), which publishes on Tuesday (Oct. 6). I ve rarely allowed facts to get in the way of telling a good story. He even acknowledges in the new book’s preface, I d go as far as to say I ve been the most outrageously unreliable interviewee of all time, weaving a tangled web of embellishments and exaggerations as I went along until even I couldn t separate fact from fiction. But this time, Cooper says, Now we re not trying to build a career anymore. I want people to see the fact that, yeah, this band really went through a hell of a lot to finally make it … I don t mind decorating a story, but 90% of these stories are true. The 445-page Devil On My Shoulder follows 1976 s Me, Alice: The Autobiography of Alice Cooper , which he dismisses as “a drunken rant,” and 2007 s Alice Cooper, Golf Monster , which blends biography with his passion for the links but offers a generally more coherent, detailed and trustworthy account. Nobody really pushed Me, Alice , he notes. Nobody pushed Golf Monster . They were kind of OK, and they were fun. But this was the book we actually took a lot of time on. I spent five hours a day with [co-author Daniel Richler] just trying to remember stories and actually admitting that, OK, that might be wrong, but I remember that this did happen I don t know exactly how it happened, so I ll just tell you my version of it.’ I think any book that you read that s an autobiography is what probably om our multiple power lists, years of reporting on educational options and on information requested from the schools themselves. We invite selected schools to tell us what makes their program unique, to boast about accomplished alumni and to describe specific courses, events and speakers. Not surprisingly, students increasingly will be offered courses like Artificial Intelligence in the Entertainment Industry: Benefits, Risks and the Future, offered at American University in Washington, D.C., which explores the ways AI is transforming music creation, distribution and rights management. Billboard does not rank the schools here; they are listed alphabetically, and areas of expertise range from performance to production to management. The U.S. Department of Education hosts a free online College Scorecard that provides quantitative information to complement the qualitative profiles here, including specific data on college costs, graduation rates, employment and student debt. Students also should review the Federal Student Aid Financial Responsibility Composite Scores, compiled by the Department of Education, to confirm the financial stability of schools they are considering. In July 2025, the passage of major tax and spending legislation imposed new limits on some types of federal student loans. And college debt can significantly affect student options after graduation. So here, Billboard has included more affordable public colleges and universities. We also continue to recognize historically Black colleges and universities like Howard University and Tennessee State University and continue to add schools from outside music industry capitals, like debut honorees University ", "date_str": "2026-10-06T14:07:02+00:00", "hash": "f204bad0f3f03e13", "title_fa": "برترین مدارس تجارت موسیقی بیلبورد در سال 2026", "summary_fa": "در عصر هوش مصنوعی، چه کسی به تحصیلات دانشگاهی نیاز دارد؟ پاسخ ماهرانه یک عامل هوش مصنوعی: \"هوش مصنوعی اطلاعات را ارزان می کند؛ این اطلاعات جایگزین قضاوت،
