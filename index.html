زظهر. ET/PT / 1 بامداد BST (پنجشنبه) / 8 صبح AWST (پنجشنبه) پس دوران باز چیست؟ همانطور که جف پروبست، مجری سرسخت در تریلر سریال توضیح می دهد (که می توانید در انتهای این مقاله تماشا کنید)، به این معنی است که \"هر نوع مزیت، هر پیچشی که تا به حال انجام داده ایم، در بازی وجود دارد.\" بنابراین می‌توانید انتظار داشته باشید"}, {"source": "Business Insider", "title": "YouTube is jumping into micro dramas and helping them move from phones to TV screens", "link": "https://www.businessinsider.com/youtube-is-leaning-into-the-micro-drama-craze-2026-9", "summary": "YouTube s new Shorts series feature will help micro dramas package their shows. Noam Galai/Getty Images for Made on YouTube 2026 YouTube is leaning into the fast-growing micro-drama format. It's introducing Shorts series, a feature for creators to promote episodic shows, including micro dramas. The platform said micro-drama watch time grew 50% year over year and soared 90% on TVs. YouTube is getting in on the micro-drama craze, and helping to bring the fast-growing format to TV screens. On Wednesday, it's releasing a new feature that allows creators to bundle their short videos in a series of episodes or seasons, designed to be viewed sequentially. The tool is available to any Shorts creator, but is particularly helpful for micro-drama studios that make soap-opera-style shows aired in snippets of 1 to 3 minutes. \"Micro-drama studios, even before this tool, are having great success on YouTube, and hopefully it's going to make the viewer experience of their content even better,\" said Kurt Wilms, senior director of product at YouTube, speaking with reporters at the company's Made on YouTube event on Wednesday. Micro-drama platforms typically make money via \"freemium\" models, where viewers can watch a few episodes for free before being asked to pay up. Wilms said studios can mimic that workflow using YouTube's existing memberships product. He said a studio can offer a few episodes of a series for free, and then \"put the rest of them behind the membership table.\" YouTube also has in-feed ads that give a share of revenue to creators, offering an alternative way for them to make money. Serialized short dramas, which often live on dedicated apps like DramaBox or ReelShort, have exploded in popularity in the US over the past few years, captivating and bemusing Hollywood. Despite their zany plot lines around werewolf romances and sordid billionaire affairs, they've become a serious business. Global short-drama revenue is expected to reach $7.8 billion this year, with the US accounting for about 40% of that, per a Deloitte analysis . Streaming platforms like Paramount+ are testing out the format, and YouTube rival TikTok is diving into short dramas at full speed. Experimenting with a basic micro-drama product will give YouTube a chance to learn more about viewers' appetites and decide if it's worth investing in additional tools. YouTube is seeing a big increase in micro-drama viewing YouTube also shared some eye-opening stats on micro-drama viewership: In the first h", "date_str": "2026-09-23T21:09:50+00:00", "hash": "c15229364ba07452", "title_fa": "یوتیوب در حال پرش به سمت درام های خرد است و به آنها کمک می کند تا از تلفن ها به صفحه های تلویزیون منتقل شوند", "summary_fa": "ویژگی جدید سری Shorts YouTube به فیلم‌های درام کوچک کمک می‌کند تا نمایش‌های خود را بسته بندی کنند. Noam Galai/Getty Images for Made on YouTube 2026 یوتیوب به فرمت درام میکرو در حال رشد متمایل شده است. این مجموعه‌های Shorts را معرفی می‌کند، ویژگی‌ای برای سازندگان برای تبلیغ نمایش‌های اپیزودیک، از جمله درام‌های خرد. این پلتفرم اعلام کرد که زمان تماشای فیلم‌های میکرو درام نسبت به سال گذشته 50 درصد رشد داشته و در تلویزیون‌ها 90 درصد افزایش یافته است. یوتیوب در حال ورود به شور و شوق درام های کوچک است و کمک می کند تا این فرمت به سرعت در حال رشد به نمایشگرهای تلویزیون ارائه شود. در روز چهارشنبه، ویژگی جدیدی را منتشر می‌کند که به سازندگان اجازه می‌دهد ویدیوهای کوتاه خود را در مجموعه‌ای از قسمت‌ها یا فصل‌ها، که برای تماشای متوالی طراحی شده‌اند، دسته‌بندی کنند. این ابزار برای هر سازندگان Shorts در دسترس است، اما به ویژه برای استودیوهای درام میکرو که نمایش هایی به سبک اپرا صابون را در قطعه های 1 تا 3 دقیقه ای پخش می کنند مفید است. کرت ویلمز، مدیر ارشد تولید در یوتیوب، در روز چهارشنبه در رویداد Made on YouTube این شرکت گفت: «استودیوهای میکرو درام، حتی قبل از این ابزار، موفقیت زیادی در یوتیوب داشتند و امیدواریم که تجربه بینندگان از محتوای آنها حتی بهتر شود. پلتفرم‌های میکرو درام معمولاً از طریق مدل‌های «فریمیوم» درآمد کسب می‌کنند، جایی که بینندگان می‌توانند قبل از پرداخت هزینه، چند قسمت را به صورت رایگان تماشا کنند. ویلمز گفت استودیوها می توانند با استفاده از محصول عضویت موجود YouTube از این جریان کاری تقلید کنند. او گفت یک استودیو می تواند چند قسمت از یک سریال را به صورت رایگان ارائه دهد و سپس «بقیه آن ها را پشت میز عضویت قرار دهد». یوتیوب همچنین دارای تبلیغات درون فید است که"}, {"source": "Business Insider", "title": "Samsung Galaxy Z Fold 8 Ultra review: Peak performance and productivity", "link": "https://www.businessinsider.com/guides/tech/samsung-galaxy-z-fold-8-ultra-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more This tent-like position is great for watching content or as a bedside display. Business Insider / Brady Snyder The foldable market is officially crowded. In the form factor's early days, Samsung was merely competing with itself. Now, buyers can have their pick of foldables from Samsung, Google, Motorola, and soon, Apple. In other words, Samsung's latest flagship foldable faces its stiffest slate of competition yet. The Galaxy Z Fold 8 Ultra will have to do more than ever to justify its $2,099 price point, proving it's worth the premium over the Motorola Razr Fold, Google Pixel 11 Pro Fold , and iPhone Duo . The Galaxy Z Fold 7 represented such a monumental leap over its predecessor that I expected the Galaxy Z Fold 8 Ultra to be an incremental upgrade. In some ways, it is — the dimensions and weight are virtually unchanged — but the phone also impressed me in others. Samsung addressed two of my biggest complaints about the Galaxy Z Fold 7 by boosting battery life and making the Galaxy Z Fold 8 Ultra easier to open. It added a new rear camera and a sharper, brighter folding display. This makes for an incredible spec sheet, and the Galaxy Z Fold 8 Ultra deserves credit for being the thinnest book-style foldable sold in the U.S. However, the device lacks many quality-of-life features buyers crave from modern foldables, such as a wide aspect ratio, IP68 durability, Qi2 magnets, and pen support. As a result, the Galaxy Z Fold 8 Ultra is best for performance and productivity. For content consumption or creation, there are alternatives that offer a more complete package. Specification Details Starting price $2,099 / £1,899 / €2,199 Colors Graphite, Cream, Violet Shadow, Green Shadow (Samsung online exclusive) Release date August 7, 2026 Durability rating IP48 (water resistant up to 1.5m) Cover display 6.5-inch AMOLED Folding display 8-inch foldable AMOLED Resolution 1080 x 2520 (cover) / 2256 x 2504 (folding) Refresh rate Adaptive 1-120Hz Peak brightness 3,000 nits Processor Qualcomm Snapdragon 8 Elite Gen 5 for Galaxy RAM 12GB (on 256GB/512GB models) / 16GB (on 1TB model) Storage 256GB / 512GB / 1TB Rear cameras 200MP wide, 50MP ultrawide, 10MP telephoto Selfie cameras 10MP cover, 10MP internal Camera zoom 3x optical zoom and 30x digital zoom Video HDR10+ for 1080p up to 60 fps, 4K up to 120 fps, 8K at 30 fps Battery capacity 5,000mAh Claimed battery life Up to 27 hours", "date_str": "2026-09-23T20:46:51+00:00", "hash": "2df0d1695d1a925d", "title_fa": "بررسی Samsung Galaxy Z Fold 8 Ultra: اوج عملکرد و بهره‌وری", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید این موقعیت چادر مانند برای تماشای محتوا یا به عنوان نمایشگر کنار تخت عالی است. Business Insider/ Brady Snyder بازار تاشو رسما شلوغ است. در روزهای اولیه شکل‌گیری، سامسونگ صرفاً با خودش رقابت می‌کرد. اکنون، خریداران می توانند از سامسونگ، گوگل، موتورولا، و به زودی اپل، محصولات تاشو را انتخاب کنند. به عبارت دیگر، جدیدترین پرچمدار تاشو سامسونگ با سخت ترین رقابتی که تاکنون داشته است، روبرو است. Galaxy Z Fold 8 Ultra باید بیش از هر زمان دیگری تلاش کند تا قیمت 2099 دلاری خود را توجیه کند و ثابت کند که ارزش برتری نسبت به Motorola Razr Fold، Google Pixel 11 Pro Fold و iPhone Duo را دارد. گلکسی زد فولد 7 نشان دهنده چنان جهشی بزرگ نسبت به نسل قبلی خود بود که انتظار داشتم گلکسی زد فولد 8 اولترا یک ارتقاء تدریجی باشد. از برخی جهات، اینطور است - ابعاد و وزن تقریباً بدون تغییر است - اما تلفن در موارد دیگر نیز مرا تحت تأثیر قرار داد. سامسونگ با افزایش عمر باتری و آسان‌تر کردن باز کردن Galaxy Z Fold 8 Ultra به دو مورد از بزرگترین شکایات من در مورد Galaxy Z Fold 7 پرداخت. یک دوربین عقب جدید و یک صفحه نمایش تاشو واضح تر و روشن تر اضافه کرد. این یک برگه مشخصات باورنکردنی ایجاد می کند و Galaxy Z Fold 8 Ultra به دلیل نازک ترین صفحه تاشو به سبک کتاب فروخته شده در ایالات متحده شایسته اعتبار است. با این حال، این دستگاه فاقد بسیاری از ویژگی‌های کیفیت زندگی است که خریداران از تاشوهای مدرن می‌خواهند، مانند نسبت ابعاد گسترده، دوام IP68، آهنرباهای Qi2 و پشتیبانی از قلم. در نتیجه، Galaxy Z Fold 8 Ultra برای عملکرد و بهره وری بهترین"}, {"source": "Business Insider", "title": "Citadel's latest weapon in the hedge fund talent war is a big boomerang hire", "link": "https://www.businessinsider.com/citadel-hires-matt-giannini-business-development-walleye-hedge-fund-talent-2026-9", "summary": "Citadel CEO Ken Griffin has hired Matt Giannini for the third time. Patrick T. Fallon / AFP via Getty Images Ken Griffin's $76 billion Citadel has rehired Matt Giannini, two people familiar with the matter say. Giannini had spent less than a year at Walleye, where he was the COO for the firm's stockpicking unit. This will be Giannini's third stint at Citadel, which is fighting for top investors in the industry's talent war. Third time's the charm. Matt Giannini, a well-known recruiter in the hedge fund industry, is returning to Ken Griffin's $76 billion Citadel for his third stint, two people familiar with the matter told Business Insider. \"We're pleased to welcome Matt back to Citadel. We expect him to materially contribute to our ambitious plans to continue growing our Equities business,\" a spokesperson told Business Insider. A person close to the Miami-based manager said he would start in 2027. Giannini is joining from Walleye Capital, where he was the chief operating officer of the firm's equity long-short business for less than a year. Walleye declined to comment. Giannini did not respond to a request for comment. He joined Walleye from Citadel as the smaller manager grew its leadership bench , including fellow Citadel alum Tom DeAngelis, now Walleye's president, and Anil Gondi, who joined as head of equity long-short from Balyasny and oversaw Giannini. Giannini's departure from Citadel in 2024 was one of the biggest hedge fund personnel moves that year, as the war for top investors was intensifying, and those who had succeeded in recruiting the best talent were in high demand. After Giannini's 2024 exit, Citadel lost a number of executives focused on recruiting investing talent in the 12 months that followed, Business Insider previously reported . The firm's chief people officer, Sjoerd Gehring, left earlier this year as well. The manager has since replenished its business development ranks with promotions and external hires, including individuals from firms such as Verition, BlackRock, and JPMorgan, though it has not yet named a replacement for Gehring. His first stint at Citadel, which began in 2007, ended when he started at multistrategy rival Balyasny in 2012. At Dmitry Balyasny's eponymous firm, Giannini eventually became global cohead of business development before being rehired by Citadel for the first time in late 2018 . By the time he left Citadel for a second time, in 2024, he rose to the rank of global head of equities business development", "date_str": "2026-09-23T20:26:32+00:00", "hash": "efb1e417b0995066", "title_fa": "آخرین سلاح سیتادل در جنگ استعدادهای سرمایه گذاری پرچین، یک استخدام بومرنگ بزرگ است", "summary_fa": "کن گریفین، مدیر عامل سیتادل، مت جیانینی را برای سومین بار استخدام کرد. پاتریک تی فالون / خبرگزاری فرانسه از طریق گتی ایماژ، دو نفر از آشنایان به این موضوع می گویند که قلعه 76 میلیارد دلاری کن گریفین، مت جیانینی را دوباره استخدام کرده است. جیانینی کمتر از یک سال را در Walleye سپری کرده بود، جایی که او مدیر اجرایی واحد انبارداری شرکت بود. این سومین حضور جیانینی در سیتادل خواهد بود که برای جذب سرمایه گذاران برتر در جنگ استعدادهای صنعت می جنگد. بار سوم جذابیت است. دو نفر از آشنایان به Business Insider گفتند که مت جیانینی، یک استخدام‌کننده مشهور در صنعت صندوق‌های تامینی، برای سومین دوره کاری خود به سیتادل 76 میلیارد دلاری کن گریفین بازمی‌گردد. یکی از سخنگویان به Business Insider گفت: \"ما از استقبال مجدد مت به سیتادل خرسندیم. ما انتظار داریم که او به طور مادی در برنامه های جاه طلبانه ما برای ادامه رشد تجارت سهام ما مشارکت داشته باشد.\" یکی از افراد نزدیک به سرمربی میامی گفت که او در سال 2027 شروع به کار خواهد کرد. جیانینی از Walleye Capital می‌پیوندد، جایی که او کمتر از یک سال مدیر عملیاتی شرکت سهامی خاص بود. والی از اظهار نظر خودداری کرد. جیانینی به درخواست برای اظهار نظر پاسخ نداد. او از سیتادل به Walleye ملحق شد، زیرا مدیر کوچک‌تر نیمکت رهبری آن را افزایش داد. خروج جیانینی از سیتادل در سال 2024 یکی از بزرگترین حرکت های پرسنل صندوق های تامینی در آن سال بود، زیرا جنگ برای سرمایه گذاران برتر در حال تشدید بود و کسانی که موفق به جذب بهترین استعدادها شده بودند، تقاضای زیادی داشتند. پس از خروج جیانینی در سال 2024، سیتادل تعدادی از مدیرانی را که بر جذب استعدادهای سرمایه گذاری متمرکز بودند در 12 ماه بعد از دست داد، بیزینس اینسایدر قبلا گزارش داده"}, {"source": "Business Insider", "title": "Straight Talk plans and prices explained: iPhone 18 Pro deals, free phones, and more", "link": "https://www.businessinsider.com/guides/deals/straight-talk-plans-prices-promotions", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Straight Talk/Business Insider If you've shopped for cell service in recent years, you've probably heard of Straight Talk . The Verizon-owned MVNO uses Verizon's nationwide network to provide its customers with connectivity for data, calls, text, hotspot, and more. To make shopping simpler, I've broken down Straight Talk plans and prices below. The carrier offers a simple lineup of prepaid phone plans that range from affordable limited-data options to premium unlimited plans with perks such as mobile hotspot data, international calling, and a Walmart Plus membership. With no annual contracts and Verizon support, Straight Talk remains a popular option for budget-conscious shoppers looking for flexible wireless service. Current Straight Talk prices start at $35 a month for the Bronze 10GB plan and go up to $65 a month for the Platinum Unlimited plan . Along the way, you'll find several unlimited plans with varying hotspot allowances, cloud storage, and travel benefits, making it easier to choose a plan that fits your budget and data needs. Below, I've broken down each Straight Talk plan, its monthly price, and the key features you get with your subscription. Deal alert : Straight Talk is offering up to $480 off Apple's new iPhone 18 Pro with Gold Unlimited plans. Stock comes and goes, so I recommend checking back to see if it gets more devices. Straight Talk phone plans and prices Straight Talk offers four plans, starting at $35 a month for limited high-speed data and basic coverage. Higher tiers are more enticing for travelers and frequent data users, because in exchange for a higher monthly price, service includes hot spot data, cloud storage, international calling, and more. Plan Monthly price High-speed data Hotspot data Platinum $65* Unlimited 5G Ultrawide Unlimited Gold $55* Unlimited 5G Ultrawide 30GB Silver $45* Unlimited 5G 10GB Bronze $35* 10GB None *New customers can get a discount for their first three months by signing up with Auto Pay. Straight Talk's Bronze plan costs $35 a month and is designed for basic use. It includes unlimited talk and text, 10GB of high-speed data, and access to Verizon's nationwide 5G network on compatible devices. After you use your 10GB of premium data, speeds are reduced to 2G for the rest of your billing cycle. The plan also includes international calling and texting to Canada and Mexico, making it a solid option if you don", "date_str": "2026-09-23T20:17:19+00:00", "hash": "3521ffe32e1073be", "title_fa": "طرح‌ها و قیمت‌های Straight Talk توضیح داده شده است: معاملات iPhone 18 Pro، تلفن‌های رایگان و موارد دیگر", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید Straight Talk/Business Insider اگر در سال های اخیر برای سرویس تلفن همراه خرید کرده اید، احتمالاً نام Straight Talk را شنیده اید. MVNO متعلق به Verizon از شبکه سراسری Verizon برای ارائه اتصال برای داده، تماس، متن، نقطه اتصال و موارد دیگر به مشتریان خود استفاده می کند. برای ساده‌تر کردن خرید، طرح‌های Straight Talk و قیمت‌ها را در زیر شرح داده‌ام. این شرکت مخابراتی مجموعه ساده ای از طرح های تلفن پیش پرداخت را ارائه می دهد که از گزینه های داده محدود مقرون به صرفه تا طرح های نامحدود ممتاز با مزایایی مانند داده هات اسپات تلفن همراه، تماس های بین المللی و عضویت در Walmart Plus را شامل می شود. بدون هیچ قرارداد سالانه و پشتیبانی Verizon، Straight Talk همچنان یک گزینه محبوب برای خریدارانی است که از بودجه خود آگاه هستند و به دنبال خدمات بی‌سیم انعطاف‌پذیر هستند. قیمت فعلی Straight Talk از 35 دلار در ماه برای طرح Bronze 10GB شروع می شود و تا 65 دلار در ماه برای طرح Platinum Unlimited افزایش می یابد. در طول مسیر، چندین طرح نامحدود با امتیازات مختلف نقاط دسترسی، فضای ذخیره‌سازی ابری و مزایای سفر پیدا خواهید کرد که انتخاب طرحی را که متناسب با بودجه و نیازهای داده شما باشد، آسان‌تر می‌کند. در زیر، من هر طرح Straight Talk، قیمت ماهانه آن و ویژگی‌های کلیدی را که با اشتراک خود دریافت می‌کنید، شرح داده‌ام. هشدار معامله: Straight Talk تا 480 دلار تخفیف برای آیفون 18 پرو جدید اپل با طرح های Gold Unlimited ارائه می دهد. سهام می آید و می رود، بنابراین توصیه می کنم دوباره بررسی کنید تا ببینید آیا دستگاه های بیشتری دریافت می کند یا خیر. طرح‌ها و قیمت‌های تلفن Straight Talk چهار"}, {"source": "Business Insider", "title": "SpaceX’s historic $2 trillion debut defied one of the market's big fears", "link": "https://www.businessinsider.com/spacex-ipo-spcx-stock-elon-concentration-risk-musk-anthopic-openai-2026-9", "summary": "IPO SpaceX's IPO was big enough that it elicited fears about how it could impact market structure. But one key concern has been mostly unfounded for now, Morningstar said. Still, coming coming mega-IPOs could increase concentration risk, Morningstar says. SpaceX stock has had a volatile ride since its record-setting debut this summer. Elon Musk's rocket and AI company was hot out of the gate, but didn't sustain its momentum for long. Importantly for investors watching from the sidelines, the splashy IPO hasn't reshaped the market in the way many had feared it might leading up to the debut. Morningstar on Wednesday flagged that SpaceX's colossal market cap didn't translate into the overweighting at the index level many investors had been concerned about. This was a worry percolating in the market as index providers changed their rules to fast track the stock into major averages like the Nasdaq 100. \"Despite reaching a $2 trillion market cap on its first day of trading, limited public float meant SpaceX represented only about 0.1% of the Total Market Index at the end of August, despite earlier fears surrounding its expedited inclusion in indexes,\" stated director of analytics Alex Poukchanski. The concern was that funds that track the indexes would be forced to buy SpaceX, leaving investors exposed to the company even if they weren't interested in the IPO. Given that popular indexes like the Nasdaq 100 are cap-weighted, there were fears that index funds would end up dumping other stocks to make room for SpaceX with its enormous market capitalization. The fear has been mostly unfounded, for now. Poukchanski highlighted that the limited public share float ended up minimizing the risk, and the index weighting ended up being small. As a result, passive funds had to buy fewer shares, lowering the risk of major purchases sending the stock price soaring. For investors, this is a good sign ahead of other mega-IPOs, and rule changes might not be the market-breaking force some feared. But Poukchanski added that extreme concentration is still a risk in the era of giant tech IPOs. Giants like Anthropic and OpenAI will likely overshadow smaller offerings, and exacerbate that risk, he said. \"With anticipated IPOs from Anthropic and OpenAI, alongside continued subdued small-cap IPO activity, top-level market concentration could continue to rise, requiring further adjustments to the mega-cap segment to keep the indexes aligned with the market,\" Poukchanski added. Read the o", "date_str": "2026-09-23T19:48:18+00:00", "hash": "8e7c8363526e4adb", "title_fa": "اولین عرضه تاریخی اسپیس ایکس به ارزش 2 تریلیون دلار یکی از ترس های بزرگ بازار را به چالش کشید", "summary_fa": "IPO SpaceX به اندازه کافی بزرگ بود که باعث ایجاد ترس در مورد اینکه چگونه می تواند بر ساختار بازار تأثیر بگذارد. مورنینگ استار گفت، اما یک نگرانی کلیدی در حال حاضر عمدتاً بی اساس بوده است. مورنینگ استار می‌گوید با این حال، آتی مگا-IPOهای آینده می‌تواند خطر تمرکز را افزایش دهد. سهام اسپیس ایکس از زمان اولین رکورد خود در تابستان امسال، حرکت پرنوسانی داشته است. شرکت موشک و هوش مصنوعی ایلان ماسک از دروازه خارج شد، اما شتاب خود را برای مدت طولانی حفظ نکرد. برای سرمایه‌گذارانی که از حاشیه آن را تماشا می‌کنند، مهم است که عرضه اولیه اولیه سهام پرشور، بازار را به شکلی تغییر نداده است که بسیاری از آن می‌ترسیدند که ممکن است منجر به عرضه اولیه شود. مورنینگ استار روز چهارشنبه اعلام کرد که ارزش بازار عظیم اسپیس ایکس به وزن بیش از حد در سطح شاخص تبدیل نشده است که بسیاری از سرمایه گذاران نگران آن بوده اند. این یک نگرانی در بازار بود زیرا ارائه دهندگان شاخص قوانین خود را برای ردیابی سریع سهام به میانگین های اصلی مانند نزدک 100 تغییر دادند. الکس پوکچانسکی، مدیر بخش تجزیه و تحلیل، اظهار داشت: علیرغم رسیدن به سقف 2 تریلیون دلاری در اولین روز معاملات خود، سهام شناور عمومی محدود باعث شد که اسپیس ایکس تنها حدود 0.1 درصد از شاخص کل بازار را در پایان ماه اوت داشته باشد، علیرغم نگرانی های قبلی در مورد گنجاندن سریع آن در شاخص ها. نگرانی این بود که صندوق‌هایی که شاخص‌ها را ردیابی می‌کنند مجبور به خرید اسپیس ایکس شوند و سرمایه‌گذاران را حتی اگر علاقه‌ای به عرضه اولیه سهام نداشته باشند، در معرض این شرکت قرار دهند. با توجه به اینکه شاخص‌های محبوبی مانند نزدک 100 دارای وزن بالایی هستند، این نگرانی وجود داشت که صندوق‌های شاخص در نهایت سهام دیگر را تخلیه کنند"}, {"source": "Business Insider", "title": "Where to watch Toy Story 5: Cast, trailer, new Disney Plus prices", "link": "https://www.businessinsider.com/guides/streaming/where-to-watch-toy-story-5", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Jessie, Buzz Lightyear, Woody, and other toys return in Toy Story 5. Disney/Pixar It's Toy vs. Tech in the Toy Story franchise's latest installment, and the film is finally streaming. We've highlighted everything you need to know about where to watch Toy Story 5, no matter where you are in the world. If you don't want to scroll any further, you can stream Toy Story 5 on Disney Plus globally. Keep reading for additional details, including a look at the trailer, streaming info for past movies, and details on the latest Disney Plus price hike. Where to watch Toy Story 5: quick links US: Disney Plus (from $12.49/month) UK: Disney Plus (from £6/month) Australia: Disney Plus (from $10/month) Canada: Disney Plus (from $9/month) Other regions: Disney Plus (various) Where to watch Toy Story 5 in the US Toy Story 5 is streaming on Disney Plus in the US. The streaming service hiked its prices the same day that the film landed on the platform, so new customers will face increased fees. Ad-supported Disney Plus now starts at $12.49 a month. Ad-free Disney Plus now costs $21.49 a month or $214.99 a year. Previously, ad-supported plans cost $11.99 a month, and ad-free plans cost $18.99 a month. You can learn more in our Disney Plus price guide. If you're looking to save some money, it might be time to try one of the Disney Plus bundles . The ad-free Disney Plus and Hulu bundle and the Disney bundles containing HBO Max also faced price increases, but other bundle subscriptions (including ad-supported Disney Plus and Hulu) weren't affected by the price hike. The Disney Plus and Hulu bundle with ads costs $12.99 a month, but if you lock into a six-month contract, you can get it for just $11.99 a month (making it cheaper than subscribing to Disney Plus on its own). Where to watch Toy Story 5 in other countries Disney Plus is the streaming home to Toy Story 5 around the world. Prices vary by region and plan. In Canada, subscriptions start at $9 a month. In the UK, subscriptions begin at £6 a month. Australian Disney Plus plans start at $10 a month. Where to watch past Toy Story movies All four previous \"Toy Story\" movies are also available on Disney Plus, so if you're looking to get caught up or revisit the past, you won't need any other streaming services. The streaming platform also carries other content from the Toy Story franchise, including Toy Story Toons. Tay Story 5 cast Toy ", "date_str": "2026-09-23T19:47:51+00:00", "hash": "c6ac950fa09d51d7", "title_fa": "محل تماشای Toy Story 5: بازیگران، تریلر، قیمت‌های جدید Disney Plus", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید جسی، باز لایت‌یر، وودی و اسباب‌بازی‌های دیگر در داستان اسباب‌بازی 5 بازمی‌گردند. Disney/Pixar It's Toy vs Tech در جدیدترین قسمت مجموعه داستان اسباب‌بازی است، و فیلم بالاخره پخش می‌شود. ما همه Nathan Fielder and Lance Oppenheim's genre-bending Elizabeth Holmes documentary \"You Can See Everything\" has arrived, and it promises an intimate look at one of Silicon Valley's most notorious felons. The documentary follows Holmes, the once-celebrated founder of Theranos , a now-defunct blood-testing startup, who was accused of building the company on false promises and nonexistent technology. While Holmes has admitted that she made mistakes, she denied any criminal wrongdoing. Following a lengthy trial, Holmes was found guilty in 2022 on four counts of fraud and conspiracy. As we see in the documentary's trailer, which adopts the tone of a mind-bending mystery-thriller, Holmes has continued to maintain her innocence. But Fielder and Oppenheim are clearly skeptical. Fielder serves as a kind of host, interviewer, and narrator as he moves in with Holmes and her family in the weeks before she reported to prison to serve an 11-year-sentence in May 2023. In the trailer, Fielder bluntly asks Holmes how she ended up as a convicted felon if she did nothing wrong. She replies, \"I wish I knew, you know? I don't know. I don't feel like I understand that.\" Later, she tells Fielder, \"I don't have anything to hide.\" Here's everything to know about \"You Can See Everything.\" The documentary was filmed in secret Elizabeth Holmes in You Can See Everything. A24 Holmes reported to federal prison on May 30, 2023, to begin serving her 11-year sentence. (Her prison time has since been shortened by roughly two years.) \"You Can See Everything\" was kept under wraps for over three years until it had its surprise premiere at the Telluride Film Festival in early September. A short teaser arrived online that same day. Critics who attended the screening have described \"You Can See Everything\" as disarming, surreal, and fascinating. Holmes and her partner, Billy Evans , are depicted as \"willing, if wildly offbeat subjects,\" according to Deadline's Pete Hammond . Kyle Buchanan, the former awards columnist at The New York Times, said that Evans comes across as a \"wild narcissist\" and the \"unlikely star of this", "date_str": "2026-09-23T19:33:57+00:00", "hash": "58d16aab59606897", "title_fa": "ناتان فیلدر از تریلر «You Can See Everything» رونمایی کرد. در اینجا آنچه باید در مورد سند الیزابت هلمز بدانید آمده است.", "summary_fa": "ناتان فیلدر و الیزابت هلمز در تو می توانی همه چیز را ببینی. A24 \"You Can See Everything\" یک مستند جدید درباره الیزابت هولمز، بنیانگذار ترانوس است. هولمز از یک گروه فیلمبرداری دعوت کرد تا زندگی او را در هفته های منتهی به زندان در سال 2023 مستند کنند. کارگردانی فیلم بر عهده ناتان فیلدر است که در طول فیلمبرداری با هولمز و خانواده اش زندگی می کرد. اولین تریلر رسمی مستند ناتان فیلدر و لنس اوپنهایم با عنوان «شما می توانید همه چیز را ببینید» منتشر شد و نوید نگاهی صمیمی به یکی از بدنام ترین جنایتکاران سیلیکون ولی را می دهد. این مستند درباره هولمز، بنیانگذار مشهور Theranos است، یک استارتاپ آزمایش خون که اکنون منحل شده است، که متهم به ساختن شرکت بر اساس وعده‌های دروغین و فناوری غیرقابل‌وجود بود. در حالی که هولمز اعتراف کرده است که اشتباه کرده است، او هر گونه تخلف مجرمانه را انکار کرد. پس از یک محاکمه طولانی، هولمز در سال 2022 به چهار فقره کلاهبرداری و توطئه مجرم شناخته شد. همانطور که در تریلر مستند می بینیم که لحن یک فیلم معمایی و هیجان انگیز دارد، هولمز همچنان بی گناه خود را حفظ کرده است. اما فیلدر و اوپنهایم به وضوح شک دارند. فیلدر به‌عنوان میزبان، مصاحبه‌گر و راوی در هفته‌های قبل از اینکه هولمز و خانواده‌اش را برای اجرای حکم ۱۱ ساله در ماه مه ۲۰۲۳ به زندان منتقل کند، به عنوان میزبان، مصاحبه‌کننده و راوی عمل می‌کند. او پاسخ می دهد: \"کاش می دانستم، شما می دانید؟ من نمی دانم. احساس نمی‌کنم این را بفهمم.\" بعداً او به فیلدر گفت: \"من چیزی برای پنهان کردن ندارم.\" در اینجا همه چیزهایی که باید درباره \"شما می توانید همه چیز را ببینید\" وجود دارد. این مستند به صورت مخفیانه الیزابت هلمز در \"شما می توانید همه چیز را ببینید\" فیلمبرداری"}, {"source": "Lifehacker", "title": "The Best Power Tools to Gift Your Favorite DIYer", "link": el is that it has been re-engineered to vibrate less, making it more comfortable and safer to use. It also has a wider cutting radius and a brighter LED. This set is a great gift because it comes with everything you need to use it right out of the box, including a 20-volt DeWalt oscillating multitool, a 20-volt MAX compact battery, a charger, a tool-connect chip adapter, a fast cut wood blade, a wood with nails blade, a sanding attachment, some sandpaper, and a depth guide. DeWalt makes some of the best woodworking tools and is known for durable and precise cutting too", "date_str": "2026-09-24T14:00:22+00:00", "hash": "5c89c773be71434a", "title_fa": "بهترین ابزارهای برقی برای هدیه دادن به دست ساز مورد علاقه شما", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. انتخاب یک هدیه عالی برای آن علاقه مندان به DIY در لیست شما که به نظر می رسد از قبل هر ابزار قابل تصوری را در اختیار دارد، می تواند سخت باشد. اگر به دنبال چیز مناسبی برای کسی هستید که به تازگی ماجراجویی DIY خود را شروع کرده است، یا یک جنگجوی کارکشته آخر هفته، همه گزینه ها می توانند ترسناک باشند. به عنوان یک طرفدار باتجربه تعمیر و نگهداری خانه و همچنین یک نجار با تجربه و سازنده مبلمان، در اینجا برخی از ابزارهای مورد علاقه من برای ارائه امسال آورده شده است. بهترین ابزار کلی برای هدیه امسال مجموعه دریل و درایور مورد علاقه من، مجموعه دریل و درایور 18 ولتی LXT جدید ماکیتا، بهترین ابزار برای هر کسی است که دوست دارد خود را انجام دهد. این ابزارها از یک سیستم باتری کارآمد استفاده می کنند که به ازای هر بار شارژ زمان کار بیشتری را به شما می دهد. مته در این مجموعه می تواند حدود 70 درصد گشتاور بیشتری نسبت به مدل های قبلی خود ارائه دهد و درایور ضربه ای دارای کنترل سرعت است که به شما این امکان را می دهد تا نیروی بیشتری را بر روی مواد سخت تر و کمتر در کارهای ظریف تر استفاده کنید. این مجموعه یک هدیه عالی است زیرا آماده استفاده است، همراه با دریل چکشی 18 ولتی، درایور ضربه ای 18 ولتی، باتری 2 آمپر ساعتی، باتری 5 آمپر ساعتی و شارژر. ماکیتا به دلیل تولید بهترین باتری های موجود در بازار شناخته شده است و ا rea after dark even when the floodlight isn't on. The bigger consideration is the ongoing cost if you want more than basic camera access. Blink s subscription plans start at $3.99 per month for one device and $11.99 per month for unlimited devices, with cloud storage, video history, and advanced alerts among the features tied to the paid plans . You do get a 30-day trial to see whether those extras are useful before committing, but anyone who wants to keep recorded clips in the cloud should factor the subscription into the overall cost. For those who prefer local storage, you ll need to purchase a Sync Module XR and a MicroSD card with up to 256GB of storage separately, since the included Sync Module Core doesn t support local backups. Our Best Editor-Vetted Tech Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $199.00 (List Price $249.00) Sony WH-1000XM5 $298.00 (List Pric", "date_str": "2026-09-24T13:00:00+00:00", "hash": "02278eb13968d426", "title_fa": "این دوربین نورافکن چشمک زن با باتری در حال حاضر فقط 40 دلار قیمت دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. دوربین فلود لایت Blink Outdoor 4 در آمازون به 39.99 دلار کاهش یافته است که تخفیف قابل توجهی نسبت به قیمت فهرست 99.99 دلاری آن دارد و طبق ردیاب‌های قیمت، پایین‌ترین قیمت تا به امروز است. با این قیمت، شما یک دوربین امنیتی خانگی و یک نورافکن فعال با حرکت را در یک واحد دریافت می‌کنید، که باعث می‌شود یک راه آسان برای پوشاندن حیاط خلوت، راهرو، حیاط کناری یا هر گوشه‌ای از ملک شما که هرگز نور کافی دریافت نمی‌کند. با این حال، جذابیت واقعی این است که هیچ سیم کشی برای مقابله با آن وجود ندارد، زیرا هم دوربین و هم نورافکن با باتری کار می کنند. این انعطاف‌پذیری به جایگذاری نیز گسترش می‌یابد، زیرا دوربین از طریق وای‌فای متصل می‌شود، تا زمانی که سیگنال مناسبی داشته باشید، می‌توانید آن را بدون برنامه‌ریزی در اطراف یک پریز نزدیک نصب کنید، این بررسی PCMag اشاره می‌کند. Blink Outdoor 4 Floodli u need to check whether the door is locked, see recent access history, or let someone in while you're not home it lets you create different types of codes for different people, including one-time codes for guests or recurring codes for cleaners, dog walkers, or family members. It also works with both Alexa and Google Assistant, so checking whether the front door is locked can be as simple as asking a smart speaker. Philips says the lock is designed for doors between 1 and 1&frac34; inches thick, and installation should be manageable with a screwdriver, though replacing both a deadbolt and handle still takes some patience. Once installed, you can set it to re-lock automatically within zero to 180 seconds after closing. In all, this is probably more smart lock than you need if you only want a basic keypad. But if you want app control, fingerprint entry, guest codes, and a cleaner-looking handle set in one box, this Philips deal makes sense at just over $100. Our Best Editor-Vetted Tech Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $199.00 (List Price $249.00) Sony WH-1000XM5 $298.00 (List Price $399.99) Ring Indoor Cam Plus 2K Wired Security Camera (2-Pack, White) $59.98 (List Price $119.98) Apple iPad 11\" 128GB A16 WiFi Tablet (Blue, 2025) $427.00 (List Price $449.00) Blink Outdoor 4 1080p", "date_str": "2026-09-24T12:30:00+00:00", "hash": "1e861bd38312190e", "title_fa": "این راه اندازی کامل قفل درب هوشمند فیلیپس در حال حاضر 27 درصد تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. با توجه به ردیاب‌های قیمت، قفل درب صفحه‌کلید Wifi فیلیپس با دستگیره از قیمت معمولی 142.49 دلاری خود به 104.47 دلار کاهش یافته است. با این قیمت، یک جعبه کلید هوشمند، صفحه کلید، خواننده اثر انگشت، کنترل‌های برنامه و دسته‌ای مطابق در یک بسته دریافت می‌کنید. بسیاری از قفل‌های هوشمند با این قیمت تنها جایگزین قفل‌های بسته می‌شوند، بنابراین دسته‌ای که در آن گنجانده شده است باعث می‌شود این حس به‌روزرسانی کامل‌تری در جلوی درب بدون خرید سخت‌افزار اضافه شود. این باتری با هشت باتری قلمی کار می‌کند که شامل آن نمی‌شود. قفل درب صفحه کلید Wifi فیلیپس با دستگیره 104.47 دلار در آمازون 142.49 دلار صرفه جویی 38.02 دلار دریافت معامله دریافت معامله 104.47 دلار در آمازون 142.49 دلار صرفه جویی 38.02 دلار راحتی روزانه دلیل واقعی برای در نظر گرفتن آن است زیرا به طور مستقیم به wifi 2.4G متصل می شود. در، یا بعداً عیب‌یابی کنید. پس از اتصال، می توانید با اثر انگشت خود قفل در را باز کنید، یک پین را روی صفحه کلید وارد کنید، از برنامه Philips Home Access استفاده کنید، یا در صورت نیاز از یک کلید فیزیکی استفاده کنید. این برنامه مخصوصاً برای بررسی قفل بودن درب، مشاهده تاریخچه دسترسی اخیر، یا اجازه ورود شخصی در حالی که در خانه نیستید مفید است، این برنامه به شما امکان می دهد انواع مختلفی از کدها را برای افراد مختلف ایجاد کنید، از جمله کدهای یکبار مصرف برای مهمانان یا کدهای تکرارشونده برای نظافتچی ها، سگ گردی ها یا اعضای خانواده. همچنین با الکسا و دستیار گوگل کار می کند، بنابراین بررسی قفل بودن درب جلو می تواند به سادگی درخواست از یک بلندگوی هوشمند باشد. فیلیپس می"}, {"source": "Lifehacker", "title": "I Tried Siri AI on My New Apple Watch, and I'm Frustrated", "link": "https://lifehacker.com/tech/i-tried-siri-ai-on-the-apple-watch-and-im-frustrated?utm_medium=RSS", "summary": "We may earn a commission from links on this page. One of the big features Apple announced alongside the new Apple Watches is Siri AI now available on your wrist! You need to join a waitlist to try Apple's new and improved chatbot , and since my turn just came up, I put the new on-wrist Siri through its paces. Here's how it went, and why I don't think the experience lives up to Apple's promises (yet, anyway). What devices have Siri AI? Since Siri AI requires Apple Intelligence, you ll need a device that supports it. Those include iPhones 15 Pro and newer, and an Apple Watch that is Series 9 or newer. If you want to use Siri AI on the Apple Watch, you need both a supported watch and a supported phone a new watch and old phone won t do the trick. With my phone and watch both on iOS 27 (the iOS 27.2 developer beta on the phone; watchOS 27.0 on the Apple Watch Series 12 ), I enabled Siri AI in my phone s Settings app, which put me on a waiting list. A few days later, I got a notification that I was in. Siri AI on the Apple Watch is occasionally useful, but mostly disappointing Once I'd upgraded to Siri AI on my watch, I went about asking it plenty of questions and watched it struggle to answer many of them. The first thing I tried was to ask where I could find the nearest yoga studio; it responded with a list of yoga studios, none of them particularly close to my home. After rewording my question a few times, it finally listed one about a mile away. This is one of those examples where using AI is less efficient than a Google search or even plain old regular Siri: When I asked this same question of the old Siri model last week, it quickly found the closest studio. With my phone in another room, I next decided to try some of the questions that Apple provides as examples on the WatchOS 27 page . Here s how that went. What s a good warm-up for deadlifts? Siri gave me paragraphs of text about the purpose of warmups in general. When I tapped \"Show More,\" I was sent to the bottom of a long bulleted list of exercises. I m not reading all that. Read my upcoming events. Siri needed a good five seconds to think about this one, but then correctly rattled off my next few calendar appointments. Set a new move ring goal. Actually, I first started by asking what my Move ring goal was, and Siri could not tell me. So I blindly set a new goal, and later saw it updated to the new value in the Fitness app...sort of. When I asked for a goal of burning 350 calories, it gave me a goal", "date_str": "2026-09-23T22:00:00+00:00", "hash": "102883efafe3098c", "title_fa": "من هوش مصنوعی سیری را در اپل واچ جدیدم امتحان کردم و ناامید شدم", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. یکی از ویژگی‌های بزرگی که اپل در کنار ساعت‌های جدید اپل اعلام کرد، هوش مصنوعی Siri است که اکنون روی مچ دست شما در دسترس است! شما باید به لیست انتظار بپیوندید تا چت بات جدید و بهبودیافته اپل را امتحان کنید، و از آنجایی که نوبت من به تازگی فرا رسیده است، Siri جدید روی مچ دستی را در مراحل اولیه آن قرار دادم. در اینجا چگونگی پیش رفت، و چرا فکر نمی‌کنم این تجربه به وعده‌های اپل عمل کند (هنوز، به هر حال). چه دستگاه هایی دارای هوش مصنوعی سیری هستند؟ از آنجایی که هوش مصنوعی سیری به هوش اپل نیاز دارد، به دستگاهی نیاز خواهید داشت که از آن پشتیبانی کند. اینها شامل آیفون 15 پرو و ​​جدیدتر و اپل واچ سری 9 یا جدیدتر است. اگر می‌خواهید از هوش مصنوعی سیری در اپل واچ استفاده کنید، به یک ساعت پشتیبانی‌شده و یک تلفن پشتیبانی‌شده نیاز دارید، یک ساعت جدید و تلفن قدیمی این کار را انجام نمی‌دهد. با تلفن و ساعت خود در iOS 27 (بتای توسعه دهنده iOS 27.2 در تلفن؛ watchOS 27.0 در Apple Watch Series 12)، هوش مصنوعی Siri را در برنامه تنظیمات گوشی خود فعال کردم، که مرا در لیست انتظار قرار داد. چند روز بعد، اعلانی دریافت کردم که در آن حضور داشتم. هوش مصنوعی سیری در اپل واچ گاهی اوقات مفید است، اما بیشتر ناامیدکننده است. وقتی ساعتم را به هوش مصنوعی سیری ارتقا دادم، سؤالات زیادی از آن پرسیدم و دیدم که برای پاسخ دادن به بسیاری از آنها تلاش می کند. اولین چیزی که سعی کردم این بود که بپرسم نزدیکترین استودیوی یوگا را کجا می توانم پیدا کنم. آن را با لیستی از استودیوهای یوگا پاسخ داد، که هیچ کدام به خصوص به خانه من نزدیک"}, {"source": "Lifehacker", "title": "How Garmin's New 'Epic' Feature Helps Me See the Bigger Picture of My Training", "link": "https://lifehacker.com/health/garmins-new-epic-feature-helps-me-see-the-bigger-picture-of-my-training?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Garmin's new logging feature, Garmin Epic , is getting buried in the launch of the latest Fenix 9 watch, but it deserves a headline of its own. It's a shareable digital travel journal for your big trip, being pitched by Garmin as the kind of thing you post after a major hike or race. Personally, I think that framing undersells it. Epic is also a great training-analysis hack, and that's how I plan on using it for my upcoming marathon this fall. First things first: Garmin Epics are not to be confused with Garmin's older watch line, epix , with an \"x\". This feature is Epic , with a \"c\". The names are close enough that searching for one turns up the other, so double-check the spelling. Garmin f nix 9 Pro, inReach , Titanium, 47mm, Graphite/Black $1,199.99 at Amazon Shop Now Shop Now $1,199.99 at Amazon What is a Garmin Epic? A Garmin Epic is a digital travel journal that combines your activities, maps, photos, and key health and performance metrics into a single interactive timeline you can revisit and share. With the Fenix 9 smartwatch, you can create and start an Epic directly from your watch. For older watches, you can still create Epics in the Garmin Connect app. Once you create an Epic, you can see all activities on one map, photos, an activity feed, daily notes, and selected performance and health reports across the whole span. It's a free Garmin Connect feature, and Garmin's launch demo showed a Reports tab with sleep score, resting heart rate, and HRV status for the same dates. Credit: Meredith Dietz How to use Garmin Epic as a training tool Again, although the launch of Garmin Epic is wrapped up in the launch of the Fenix 9, you don't need that smartwatch to use Epics in the Connect app: You can find it under the Activities menu. You can also group past activities into an Epic after the fact, and that ability is what makes the training-hack angle work. An Epic can run up to 92 days and keeps cumulative distance and calories along with sleep, recovery, and HRV status. That's about 13 weeks, which conveniently covers a typical training block for a half-marathon-level event. Here are some ways to use it: Wrap a whole training block. Make one Epic per build, such as \"Fall Marathon Build\" or \"Base Phase.\" You get total volume and the recovery trend in a single view, and you can compare it against your next block. Review a training camp or big week. Garmin lists training camps as a use case: Group the days, ", "date_str": "2026-09-23T21:30:11+00:00", "hash": "3aa823ae7f1d192c", "title_fa": "چگونه ویژگی جدید \"Epic\" گارمین به من کمک می کند تا تصویر بزرگتر از آموزش من را ببینم", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. ویژگی جدید ثبت نام گارمین، Garmin Epic، در راه اندازی آخرین ساعت Fenix ​​9 مدفون شده است، اما سزاوار یک تیتر برای خودش است. این یک ژورنال سفر دیجیتال قابل اشتراک گذاری برای سفر بزرگ شما است که توسط گارمین به عنوان چیزی که بعد از یک پیاده روی یا مسابقه بزرگ پست می کنید، ارائه می شود. شخصاً فکر می‌کنم که قاب‌بندی آن را کم‌فروش می‌کند. Epic همچنین یک هک آموزشی-تحلیل عالی است، و به این ترتیب من قصد دارم از آن برای ماراتن آینده خود در پاییز امسال استفاده کنم. اولین چیزها: Garmin Epics را نباید با خط ساعت قدیمی گارمین، اپیکس، با \"x\" اشتباه گرفت. این ویژگی Epic است، با یک \"c\". نام‌ها به اندازه‌ای نزدیک هستند که جستجوی یکی، دیگری را نشان می‌دهد، بنابراین املای آن را دوباره بررسی کنید. Garmin f nix 9 Pro, inReach, Titanium, 47mm, Graphite/Black 1,199.99 دلار در آمازون خرید کنید همین حالا در آمازون 1,199.99 دلار بخرید Garmin Epic چیست؟ Garmin Epic یک مجله دیجیتال مسافرتی است که فعالیت‌ها، نقشه‌ها، عکس‌ها و معیارهای کلیدی سلامت و عملکرد شما را در یک جدول زمانی تعاملی واحد ترکیب می‌کند که می‌توانید دوباره از آن بازدید کرده و به اشتراک بگذارید. با ساعت هوشمند Fenix ​​9، می توانید یک Epic را مستقیماً از ساعت خود ایجاد کرده و شروع کنید. برای ساعت‌های قدیمی‌تر، همچنان می‌توانید Epics را در برنامه Garmin Connect ایجاد کنید. هنگامی که یک Epic ایجاد می کنید، می توانید تمام فعالیت ها را در یک نقشه، عکس ها، فید فعالیت، یادداشت های روزانه و گزارش های عملکرد و سلامت انتخاب شده را در کل مدت مشاهده کنید. این یک ویژگی Garmin Connect رایگان است و نسخه آزمایشی راه اندازی Garmin یک برگه گزارش با نمره خواب، ضربان قلب در حالت"}, {"source": "Lifehacker", "title": "Apple Has a Fix for Your New Apple Watch's Restart Bug", "link": "https://lifehacker.com/tech/apple-just-fixed-a-restart-bug-with-your-new-apple-watch?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Apple's latest Apple Watches, the Series 12 and the Ultra 4 , should be the \"best\" smartwatches the company has to offer. While they're minor upgrades over the Series 11 and Ultra 3, there are some key improvements, including the new S11 chip and a heart rate monitor that checks your pulse every five seconds. If you picked up one of these watches, you might have put these new upgrades to the test that is, if your watch didn't restart on you. As reported by MacRumors , Apple's latest smartwatches appear prone to unexpected restarts. That's according to numerous posts on the site's forums, with users saying their watches abruptly show a blank screen with the Apple logo. There doesn't appear to be any particular action that triggers it: Users say their watches rebooted when recording a workout, using Siri AI, editing watch faces, or using the Maps app. Many users on this Reddit thread share similar experiences with their new watches. Some users dug deeper, pulling their Apple Watches' diagnostics at the time of rebooting. Rather than a specific function, the culprit appears to be a timeout with the Neural Engine, the hardware that processes Apple's AI features. Users tried multiple workarounds themselves: One Redditor simply turned the watch off and on themself, and the issue never returned; others tried resetting the watch as new, but experienced rebooting again. MacRumors highlighted one case where a user received a replacement from Apple, and it, too, rebooted unexpectedly. It does appear to be an issue with the Series 12 and Ultra 4, and, luckily, Apple figured it out. watchOS 27.0.1 fixes unexpected reboots with Apple Watch Series 12 and Ultra 4 On Wednesday, Apple unexpectedly released watchOS 27.0.1 . The update has a brief changelog, with only one new addition: \"This update provides bug fixes for your Apple Watch, including fixing an issue where Apple Watch may restart unexpectedly.\" Apple didn't clarify exactly what it changed to fix the issue, but at least the reboots should be over. This update is only for Apple Watch Series 12 and Ultra 4 users, so don't expect to see it unless you have one of Apple's newest wearables. If you do, make sure to install it as soon as possible to avoid dealing with these unexpected restarts. To install watchOS 27.0.1, head to the Apple Watch app, then tap My Watch and go to General Software Update .", "date_str": "2026-09-23T20:45:17+00:00", "hash": "8483089bf189cd22", "title_fa": "اپل رفع اشکال راه اندازی مجدد اپل واچ جدید شما را برطرف کرده است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. آخرین اپل واچ های اپل، سری 12 و اولترا 4، باید \"بهترین\" ساعت های هوشمندی باشند که این شرکت ارائه می دهد. در حالی که آنها نسبت به سری 11 و اولترا 3 به‌روزرسانی‌های جزئی هستند، برخی پیشرفت‌های کلیدی وجود دارد، از جمله تراشه جدید S11 و نمایشگر ضربان قلب که هر پنج ثانیه یک بار نبض شما را بررسی می‌کند. اگر یکی از این ساعت‌ها را برمی‌داشتید، ممکن است این ارتقاهای جدید را آزمایش کرده باشید، یعنی اگر ساعت شما روی شما راه‌اندازی مجدد نمی‌شد. همانطور که توسط MacRumors گزارش شده است، به نظر می رسد آخرین ساعت های هوشمند اپل مستعد راه اندازی مجدد غیرمنتظره هستند. این بر اساس پست‌های متعدد در فروم‌های سایت است که کاربران می‌گویند ساعت‌هایشان ناگهان صفحه‌ای خالی با لوگوی اپل نشان می‌دهد. به نظر نمی‌رسد هیچ اقدام خاصی باعث آن شود: کاربران می‌گویند که ساعت‌هایشان هنگام ضبط تمرین، استفاده از هوش مصنوعی سیری، ویرایش چهره‌های ساعت یا استفاده از برنامه Maps، دوباره راه‌اندازی می‌شوند. بسیاری از کاربران در این موضوع Reddit تجربیات مشابهی را با ساعت های جدید خود به اشتراک می گذارند. برخی از کاربران در زمان راه‌اندازی مجدد، عیب‌یابی اپل واچ‌های خود را عمیق‌تر کردند. به‌جای یک عملکرد خاص، به نظر می‌رسد که مقصر وقفه‌ای با موتور عصبی است، سخت‌افزاری که ویژگی‌های هوش مصنوعی اپل را پردازش می‌کند. کاربران خودشان چندین راه حل را امتحان کردند: یک Redditor به سادگی ساعت را خاموش و خودشان روشن کردند، و مشکل هرگز بازنگشت. دیگران سعی کردند ساعت را به عنوان جدید تنظیم کنند، اما دوباره راه اندازی مجدد را تجربه کردند. MacRumors یک مورد را برجسته کرد که در آن یک کاربر جایگزینی از اپل دریافت کرد و آن نیز به طور غیرمنتظره ای راه اندازی مجدد شد. به نظر می رسد"}, {"source": "Lifehacker", "title": "Apple Intelligence Is Taking Up Way More Storage Than Apple Promised on These Devices", "link": "https://lifehacker.com/tech/if-you-updated-to-ios-27-or-macos-golden-gate-check-your-storage?utm_medium=RSS", "summary": "Apple's latest updates are all about AI Apple Intelligence, that is. When you update to iOS 27 and macOS 27 Golden Gate, Apple will invite you to try Siri AI and other new Apple Intelligence features. (Assuming your iPhone supports Apple's AI features.) But whether you use the new AI-powered Siri all the time or find yourself frequently scrolling past the AI additions, Apple Intelligence is taking up space on your device perhaps requiring more storage than you bargained for. I'll admit, I didn't think much of it when I updated my iPhone and Mac to the latest versions. I gave Siri AI a shot, adjusted Liquid Glass , and went back to doing pretty much the same things I was doing before I made the update. But once I saw headlines about how much storage Apple Intelligence actually takes up on these new updates, I had to see for myself. And, wow, were the headlines right: On my iPhone 17 Pro, Apple Intelligence alone takes up 20.65GB. On my M3 MacBook Pro, it takes up a solid 30GB. These numbers will vary by device: My M1 iMac, for example, only has 13.88GB allocated to Apple Intelligence. But still, these are large slices of my overall storage. Anyone with a small SSD knows how valuable each gigabyte really is, and upwards of 30GB for Apple Intelligence is a lot . Not only that, it's often more space than Apple's own metrics suggest: As MacRumors highlights , Apple says that Apple Intelligence should only take up to 14GB of storage at most , and even less for certain devices. So why is my MacBook Pro allocating more than double that space for Apple's AI? Why does Apple Intelligence take up so much storage on iPhone and Mac? I can't answer why Apple Intelligence is taking up so much more storage space than Apple says it should. But I can explain why Apple says its AI is supposed to occupy as much as 14GB on certain devices: Apple Intelligence is designed to run on-device whenever possible. While Apple does push certain tasks to its Private Cloud Compute platform, the company wants its AI models to run on your iPhone or Mac whenever possible. This safeguards your privacy, as none of your data has to leave your device to achieve the task though Apple says Private Cloud Compute also protects your privacy throughout the entire process. Regardless, for this reason, your iPhone or Mac will download Apple Intelligence models directly onto your device, so it can run processes on-device when it makes sense to do so. If you have a newer or more powerful device that suppor", "date_str": "2026-09-23T20:00:00+00:00", "hash": "94582fa464fe7c4b", "title_fa": "Apple Intelligence بسیار بیشتر از آنچه اپل وعده داده بود در این دستگاه ها ذخیره می کند", "summary_fa": "آخرین به‌روزرسانی‌های اپل همه در مورد هوش مصنوعی Apple Intelligence هستند. هنگامی که به iOS 27 و macOS 27 Golden Gate به‌روزرسانی می‌کنید، اپل از شما دعوت می‌کند تا هوش مصنوعی Siri و سایر ویژگی‌های جدید هوش اپل را امتحان کنید. (با فرض اینکه آیفون شما از ویژگی‌های هوش مصنوعی اپل پشتیبانی می‌کند.) اما چه همیشه از سیری جدید مجهز به هوش مصنوعی استفاده می‌کنید یا مکرراً در حال عبور از افزونه‌های هوش مصنوعی هستید، Apple Intelligence فضایی را در دستگاه شما اشغال می‌کند که احتمالاً به فضای ذخیره‌سازی بیشتری نسبت به آنچه که فکر می‌کردید نیاز دارد. اعتراف می کنم، وقتی آیفون و مک خود را به آخرین نسخه به روز کردم، زیاد به آن فکر نکردم. من به Siri AI شات دادم، Liquid Glass را تنظیم کردم و تقریباً همان کارهایی را انجام دادم که قبل از به‌روزرسانی انجام می‌دادم. اما زمانی که سرفصل‌هایی در مورد میزان فضای ذخیره‌سازی Apple Intelligence برای این به‌روزرسانی‌های جدید دیدم، باید خودم ببینم. و، وای، آیا تیترها درست بودند: در آیفون 17 پرو من، Apple Intelligence به تنهایی 20.65 گیگابایت را اشغال می کند. در مک بوک پرو M3 من، 30 گیگابایت ظرفیت دارد. این اعداد بسته به دستگاه متفاوت خواهند بود: برای مثال، M1 iMac من فقط 13.88 گیگابایت به Apple Intelligence اختصاص داده است. اما با این حال، این ها تکه های بزرگی از فضای ذخیره سازی کلی من هستند. هر کسی با یک SSD کوچک می‌داند که هر گیگابایت واقعاً چقدر ارزشمند است، و بیش از 30 گیگابایت برای Apple Intelligence بسیار زیاد است. نه تنها این، بلکه اغلب فضای بیشتری نسبت به معیارهای خود اپل نشان می دهد: همانطور که MacRumors برجسته می کند، اپل می گوید که Apple Intelligence باید حداکثر تا 14 گیگابایت فضای ذخیره سازی داشته باشد، و حتی برای دستگاه های خاص کمتر. پس"}, {"source": "Lifehacker", "title": "10 uBlock Origin Hacks Everyone Should Know", "link": "https://lifehacker.com/tech/10-hacks-every-ublock-origin-user-should-know?utm_medium=RSS", "summary": "uBlock Origin is lightweight, effective, and free from shady business practices. Unfortunately, Google's move to Manifest V3 for browser extensions has hobbled ad blockers somewhat . In response, uBlock has split into two products uBlock Origin and uBlock Origin Lite . The \"Lite\" version works with most Chromium-based browsers and Safari for iPhone, iPad, and Mac . The full version of uBlock Origin primarily works in Firefox for desktops, laptops, and Android. With those differences highlighted, here are the 10 uBlock Origin (and uBlock Origin Lite) hacks you should know about. Use uBlock Origin Lite's basic filters to block ads without giving it tab access Credit: Pranay Parab When you use uBlock Origin Lite in Chrome or Safari, it allows you to choose one of three filtering levels: Basic, Optimal, and Complete. The \"Basic\" filters won't block as many ads as the others, but it also doesn't require access to your tabs and data. These days, most extensions require access to every one of your tabs, which makes uBlock Origin Lite's \"Basic\" filters an exception that accesses as little of your data as possible. Enable these filters to get rid of cookie banners uBlock Origin and its Lite version both have built-in filters that let you block annoying cookie notices on most websites . To access this in uBlock Origin on any browser, click the extension's icon in the browser's toolbar, and select the gear icon. This will open uBlock Origin's settings page. Under \"Filter lists,\" enable EasyList/uBO - Cookie Notices . This should automatically hide most cookie banners on the internet. Use the element zapper to remove distracting elements If you see a distracting element on a webpage, you can use uBlock Origin's element zapper to quickly hide it. To use it, click the extension's icon in any browser, and select the lightning icon. You can now click the distracting element, and the extension will immediately hide it from the webpage. In the Firefox version of uBlock Origin, you can also use the picker tool to select an element, and choose from a list of elements to block. For instance, if you want to block a sponsored results widget, the picker tool lets you click the element and choose from different tags associated with the widget. This allows for more precise blocking without having to click the exact spot on the page where the full widget is highlighted. To use it in Firefox, click the uBlock Origin icon in the toolbar, and select the eyedropper tool. You can select ", "date_str": "2026-09-23T18:00:00+00:00", "hash": "205f82e485d40ce2", "title_fa": "10 هک مبدا uBlock که همه باید بدانند", "summary_fa": "uBlock Origin سبک، موثر و عاری از شیوه های تجاری مشکوک است. متأسفانه، حرکت Google به Manifest V3 برای افزونه‌های مرورگر، مسدودکننده‌های تبلیغات را تا حدودی با مشکل مواجه کرده است. در پاسخ، uBlock به دو محصول uBlock Origin و uBlock Origin Lite تقسیم شده است. نسخه Lite با اکثر مرورگرهای مبتنی بر Chromium و Safari برای iPhone، iPad و Mac کار می‌کند. نسخه کامل uBlock Origin در درجه اول در فایرفاکس برای رایانه های رومیزی، لپ تاپ ها و اندروید کار می کند. با برجسته شدن این تفاوت ها، در اینجا 10 هک uBlock Origin (و uBlock Origin Lite) وجود دارد که باید درباره آنها بدانید. از فیلترهای اساسی uBlock Origin Lite برای مسدود کردن تبلیغات بدون دادن دسترسی به برگه استفاده کنید. فیلترهای \"Basic\" به اندازه سایرین تبلیغات را مسدود نمی کنند، اما همچنین نیازی به دسترسی به برگه ها و داده های شما ندارد. این روزها، اکثر برنامه‌های افزودنی نیاز به دسترسی به هر یک از برگه‌های شما دارند، که باعث می‌شود فیلترهای «Basic» uBlock Origin Lite استثنایی باشند که به کمترین میزان ممکن به داده‌های شما دسترسی دارند. این فیلترها را فعال کنید تا از شر بنرهای کوکی خلاص شوید. uBlock Origin و نسخه Lite آن، هر دو دارای فیلترهای داخلی هستند که به شما امکان می دهند اعلامیه های کوکی های مزاحم را در اکثر وب سایت ها مسدود کنید. برای دسترسی به آن در uBlock Origin در هر مرورگری، روی نماد برنامه افزودنی در نوار ابزار مرورگر کلیک کنید و نماد چرخ دنده را انتخاب کنید. با این کار صفحه تنظیمات uBlock Origin باز می شود. در بخش «فیلتر لیست‌ها»، EasyList/uBO - Cookie Notices را فعال کنید. این باید به طور خودکار بیشتر بنرهای کوکی را در اینترنت پنهان کند. از عنصر zapper برای حذف عناصر حواس‌پرتی استفاده کنید اگر یک عنصر حواس‌پرتی را"}, {"source": "Lifehacker", "title": "Why You Probably Won't Have to Verify Your Age With Discord After All", "link": "https://lifehacker.com/tech/you-probably-wont-have-to-verify-your-age-with-discord?utm_medium=RSS", "summary": "Discord age verification is officially here. As TechCrunch reports , the company will no longer take you at your word when it comes to how old you are, no matter where you happen to be using the app. Only verified adults can use Discord without restrictions; anyone under the age of 18 will be able to continue chatting on the platform, but with certain limitations. This change didn't come out of nowhere. Discord originally planned to roll out age verification en masse back in March , but the company quickly pivoted following backlash to its February announcement . That initial news lit the internet up with controversy, as it seemed that Discord was asking all users to upload a government ID to use the service as intended. While the company's plans were a bit more nuanced than that, the criticisms did force Discord to adjust how it planned to approach age verification. Now, those rules are officially here, but the vast majority of users likely won't even notice anything has changed. How Discord's age verification now works The first step, currently rolling out, is to place all users into an \"age group.\" This entire process happens automatically, and requires zero intervention from users including uploading IDs or other means of authentication. Discord will lconsider a series of identifiers to determine your age group, including how old your account is and what servers you're a part of. The company says it does not look at messages, calls, or content to make these determinations. Based on this initial analysis, you'll be placed into one of three categories: Adult Age Group : Discord has determined you are 18 or older and can use the platform without limits. Teen Age Group : Discord has determined you are between 13 and 17 years old. You can continue using Discord with \"protections,\" while adult content and settings are no longer available. Unconfirmed : Discord cannot determine your age group, and you now have the same limitations as the Teen Age Group. New accounts also fall under this category until Discord's AI gathers enough data to make a determination. Discord is adamant that the vast majority of users will not have to verify their ages via anything other than this automatic method the company says more than 90% of users will not be asked to confirm their age, which suggests Discord is quite confident in its models. If you fall into the latter two categories but you are in fact 18 or older, you can still verify your true age with Discord. Following the ", "date_str": "2026-09-23T16:30:00+00:00", "hash": "de3a5480aa9e836e", "title_fa": "چرا احتمالاً مجبور نیستید سن خود را با اختلاف تأیید کنید؟", "summary_fa": "تأیید سن Discord رسماً اینجاست. همانطور که TechCrunch گزارش می دهد، این شرکت دیگر در مورد سن شما صحبت نمی کند، مهم نیست در کجا از برنامه استفاده می کنید. فقط بزرگسالان تأیید شده می توانند بدون محدودیت از Discord استفاده کنند. هر فردی زیر 18 سال می‌تواند به چت کردن در پلتفرم ادامه دهد، اما با محدودیت‌های خاصی. این تغییر به هیچ وجه به وجود نیامده است. Discord در ابتدا قصد داشت تا در ماه مارس تأیید سن را به صورت انبوه اجرا کند، اما شرکت به سرعت پس از واکنش شدید به اعلامیه فوریه خود تغییر مسیر داد. آن خبر اولیه، اینترنت را با بحث و جدل روشن کرد، زیرا به نظر می‌رسید که Discord از همه کاربران می‌خواهد تا یک شناسه دولتی برای استفاده از این سرویس همانطور که در نظر گرفته شده، آپلود کنند. در حالی که برنامه‌های شرکت کمی ظریف‌تر از آن بود، انتقادات Discord را مجبور کرد تا نحوه برنامه‌ریزی خود را برای نزدیک شدن به تأیید سن تنظیم کند. اکنون، این قوانین رسماً اینجا هستند، اما اکثریت قریب به اتفاق کاربران احتمالاً متوجه تغییر چیزی نخواهند شد. چگونه تأیید سن Discord اکنون کار می کند اولین مرحله که در حال حاضر در حال اجراست، قرار دادن همه کاربران در یک \"گروه سنی\" است. کل این فرآیند به طور خودکار انجام می شود و نیاز به دخالت صفر از سوی کاربران از جمله بارگذاری شناسه ها یا سایر ابزارهای احراز هویت ندارد. Discord مجموعه ای از شناسه ها را برای تعیین گروه سنی شما در نظر می گیرد، از جمله اینکه حساب کاربری شما چند ساله است و در چه سرورهایی عضو هستید. این شرکت می گوید که برای انجام این تصمیمات به پیام ها، تماس ها یا محتوا نگاه نمی کند. بر اساس این تحلیل اولیه، شما در یکی از سه دسته قرار"}, {"source": "Lifehacker", "title": "Have Deletion Anxiety? The Anti-Minimalist’s Guide to Essential Mac Maintenance", "link": "https://lifehacker.com/ad/tech/have-deletion-anxiety-the-anti-minimalists-guide-to-essential-mac-maintenance?utm_medium=RSS", "summary": "The following content is brought to you by Lifehacker partners. If you buy a product featured here, we may earn an affiliate commission or other compensation. You re cruising through a work meeting when your boss asks you to share your screen. Your stomach drops. You have something like 15 tabs open, PDFs scattered from bezel to bezel, and four identically titled Excel spreadsheets to toggle between. Basically, your Mac s desktop looks like your bedroom did in the eighth grade. While a messy desktop and digital clutter can be a source of anxiety for many people, it s actually evidence of your deep work. Between an analyst keeping 15 tabs open so a model doesn't break and a strategist searching through 12 near-identical files right before a Zoom call, the clutter comes with the work. Running a standard cleanup app to achieve desktop zero, or digital minimalism, isn t always the right solution. It assumes the mess is the problem, and it asks you to interrupt your workflow to fix something that isn t broken. The fear of accidentally purging a vital draft or dataset is a pain point for anyone with years of research and work stored on their hardware. An app like CleanMyMac by MacPaw that respects your working files and clears the system junk works the other way around: it's built to go after what's safe to remove, not the files you're actively using. MacPaw , known for user-friendly Mac software like ClearVPN and Eney , built its flagship CleanMyMac app to be a safe, quick way to tidy up your machine. CleanMyMac (Annual Subscription) Secure your Mac for the year with an annual membership. $39.95 at MacPaw Shop Now Shop Now $39.95 at MacPaw Where the slowdown actually comes from Your open tabs aren t the only thing slowing down your Mac; often, it s the invisible stuff under the hood. Preview a dataset and a cache file writes itself somewhere you ll never look. Open the same Slack PDF twice and you own two copies of it. Trial
