TSEYE متحد می شود مالک صحنه در ایستگاه تور Red Bottoms در لس آنجلس: عکس های اختصاصی ADÉLA دوباره با اعضای KATSEYE متحد می شود صاحب صحنه در ایستگاه Red Bottoms Tour در لس آنجلس: عکس های انحصاری کیدمن به الیزابت تیلور از تیلور سوئیفت خواننده پاپ اسلواکی تور Red Bottoms خود را پنجشنبه شب (اکتبر) به تئاتر فوندا آورد. 8) برای اولین بار از دو قرار لس آنجلس، ارائه یک مجموعه 16 آهنگی که نشان می دهد چرا او به سرعت به یکی از جذاب ترین نام های نوظهور موسیقی پاپ تبدیل می شود. تقاضا برای ADÉLA در لس آنجلس امشب (9 اکتبر)، زمانی که او برای دومین نمایش فروخته شده به تئاتر فوندا بازمی گردد، ادامه دارد. ADÉLA با موهای صورتی روشن خود، ریل باله صورتی تند و نورهای صورتی و قرمز که لحن را تنظیم می‌کرد، به سبک اجرای قوی‌ای متمایل شد که از روزهای حضورش در The Debut: Dream Academy، مجموعه مسابقه‌ای که او را به مخاطبان بیشتری معرفی کرد، به متمایز شدن او کمک کرده است. نمایش فروخته شده تنها چند هفته پس از انتشار اولین آلبوم او، PRIMA، که در رتبه 4 بیلبورد 200 قرار گرفت، انجام شد. دو تا از تک‌آهنگ‌های آن نیز به Billboard Hot 100 راه پیدا کرده‌اند: Ain t در لس‌آنجلس که در رتبه 27 قرار گرفت و نیکول کیدمن که اخیراً به رتبه 11 صعود کرده است. از Starving Artist، SexOnTheBeat و Superscar."}, {"source": "Billboard", "title": "‘JAŸ-Z in 8’ Finale: 5 Things We Learned From Episodes 7 & 8", "link": "https://www.billboard.com/lists/jay-z-in-8-finale-review-episodes-7-8-rick-rubin-hbo-max/", "summary": "The JAŸ-Z in 8 finale has arrived. The final two installments of Hov s HBO Max docuseries landed Friday evening (Oct. 9), with Rick Rubin helping the hip-hop legend unpack the stories behind key moments and releases from the latter years of his career. Episode seven explores hits like Hard Knock Life (Ghetto Anthem) and Empire State of Mind (with Alicia Keys), as well as essential projects like The Blueprint 3 and Streets Is Watching . As Jay reflected on his hit-packed 2009 LP, he affirmed Rubin s observation that the release marked a shift in his approach to album artwork. I started getting into collecting art around that time, the Brooklyn MC concurred. Episode eight digs into some of Jay s more heady, political work. He breaks down his exploration of intracommunity fighting amongst Black folk on The Story of O.J., explains his challenging of existing power structures on the classic No Church in the Wild and draws a throughline of generational healing between Family Feud and Legacy. Both episodes are a fitting close to the eight-part series, which used relatively broad strokes to paint the arc of Jay s life and career. The episodes also bolster the docuseries overarching argument that rap is a quintessential American art form deserving of the same respect as any of the country s foundational sounds and cultural spaces. Directed by Rubin, JAŸ-Z in 8 is a Tetragrammaton production. Executive producers include Academy Award winner Daniel Kaluuya, Jay-Z and Rubin. Leila Mattimore and David Rohde also serve as producers. The series arrives amid a celebratory year for the hip-hop mogul. He returned to the stage in an Afro during his buzzy headlining set at May s Roots Picnic , which set the scene for his string of stadium-packing JAŸ-Z 30 concerts across Los Angeles, London, Paris, and, of course, New York City. Hov actually kicked off the trek in his hometown with three sold-out Yankee Stadium shows featuring a barrage of who s who in the music industry, including Beyoncé, Rihanna, Eminem, Blue Ivy, Usher, Teyana Taylor, Slick Rick, Jaz-O, The-Dream, Clipse, Pharrell Williams and more. Last week (Sept. 24), a woman who accused Jay-Z of raping her as a 13-year-old girl fully recanted her allegations, telling a federal judge that her claims were “false,” that she had mental health issues and that her ex-attorneys filed the case without the proper due diligence. Here are five things we learned from episodes seven and eight below. The final two episodes of JAŸ-Z", "date_str": "2026-10-10T00:00:00+00:00", "hash": "6d0316b88778f781", "title_fa": "فینال «JAŸ-Z in 8»: 5 چیزهایی که از قسمت های 7 و 8 آموختیم", "summary_fa": "JAŸ-Z در فینال 8 از راه رسید. دو قسمت پایانی مجموعه‌های مستند Hovs HBO Max عصر جمعه (9 اکتبر) با ریک روبین به افسانه هیپ هاپ کمک کرد تا داستان‌های مربوط به لحظات کلیدی و نسخه‌های سال‌های آخر حرفه‌اش را باز کند. اپیزود هفتم به بررسی آثار موفقی مانند Hard Knock Life (سرود گتو) و Empire State of Mind (با آلیشیا کیز) و همچنین پروژه‌های ضروری مانند The Blueprint 3 و Streets Is Watching می‌پردازد. همانطور که جی در مورد LP پرطرفدار خود در سال 2009 منعکس می‌کرد، مشاهدات روبین را تأیید کرد که انتشار نشانگر تغییری در رویکرد او به آثار هنری آلبوم است. بروکلین MC موافق بود. اپیزود هشت به برخی از کارهای سیاسی و هولناک تر جی می پردازد. او در داستان O.J کاوش جنگ درون جامعه‌ای بین سیاه‌پوستان را شرح می‌دهد، چالش‌های خود را در مورد ساختارهای قدرت موجود در کلاسیک No Church in the Wild توضیح می‌دهد و خطی از شفای نسلی بین Family Feud و Legacy ترسیم می‌کند. هر دو قسمت نزدیک به مجموعه هشت قسمتی هستند که از خطوط نسبتاً وسیعی برای ترسیم قوس زندگی و حرفه جی استفاده کردند. این اپیزودها همچنین استدلال کلی مستندسازی را تقویت می‌کند که رپ یک هنر اساسی آمریکایی است که سزاوار احترامی است که هر یک از صداهای بنیادی و فضاهای فرهنگی کشور دارد. JAŸ-Z in 8 به کارگردانی Rubin، یک محصول چهار گرامر است. تهیه کنندگان اجرایی عبارتند از دانیل کالویا، برنده جایزه اسکار، جی زی و روبین. لیلا متیمور و دیوید روهد نیز به عنوان تهیه کننده فعالیت می کنند. این سریال در میان یک سال جشن برای غول هیپ هاپ می آید. او در جریان تیترهای پرهیاهو خود در می s Roots Picnic که صحنه را برای رشته ای از کنسرت های استادیوم JAŸ-Z 30 در سراسر لس آنجلس، لندن، پاریس و البته"}, {"source": "Billboard", "title": "Gunna Launches SB The Label Imprint & Releases ‘Pop It’ Video With Tennis Star Coco Gauff: ‘A New Chapter for Me’", "link": "https://www.billboard.com/music/rb-hip-hop/gunna-sb-label-pop-it-coco-gauff-1236358460/", "summary": "Gunna is now his own record label boss. The Atlanta rapper officially launched his SB The Label imprint in partnership with Atlantic Records on Friday (Oct. 9). SB The Label s roster includes emerging artists such as Casper Bluff, Dracc and Nechie, who teamed up with Gunna for I Can t Feel My Face in 2025. Related Gunna Announces New Album Splurge : Here s What He Said About the Release Date All 11 of Gunna s Projects Ranked Gunna Confirms He s Still Signed to Young Thug s YSL Label: No Paperwork Has Been Changed “SB The Label represents the beginning of a new chapter for me, Gunna said in a statement. It only felt right to start that chapter alongside my brothers Casper Bluff, Nechie, and Dracc, who are the first artists signed to the label. For me, this is about stepping into a new role, expanding what I can create, and building something that represents where I’m headed next. Atlantic Music Group CEO Elliot Grainge added: It’s impossible to overstate Gunna’s influence on this generation of hip-hop and music as a whole. We’re grateful and honored that he’s chosen AMG as his partner to bring this endeavor to music fans. Gunna s 2025 album, The Last Wun , was released via Young Thug s YSL imprint and 300 Entertainment. It s unclear if that will still be the case going forward. The Drip Too Hard rapper gave a vague answer regarding his label situation in a September interview with Forbes . I wouldn’t say apparently free. We in the works,” Gunna said. “There’s been a lot of talks of what’s being produced and who’s going to be behind me supporting it. In the same interview, Gunna unveiled plans for the title of his next album, Splurge . I want to introduce that, which is Splurge , he said without mentioning a release date. This upper-echelon artist who’s gravitated to another level. The 33-year-old appeared to kick off the rollout of Splurge with Pop It on Friday (Oct. 9). Gunna released a lavish visual to accompany the single, which stars American tennis phenom Coco Gauff. Gunna somehow returns one of Gauff s blistering serves into the net to kick off the clip, which impresses the 22-year-old tennis star. But this isn t your average tennis court, with a chandelier somehow hanging from above and instead of grass or clay, there s a damask carpet design laid between the lines. The scene switches to a beautiful cliffside mansion overlooking the ocean. Gunna pulls up to the opulent party in style, taking a chopper in with his love interest. He raps alongside a fl", "date_str": "2026-10-09T23:21:57+00:00", "hash": "b67b1a5e54336030", "title_fa": "گانا SB The Label Imprint را راه اندازی کرد و ویدیوی «Pop It» را با ستاره تنیس، کوکو گاف: «فصل جدید برای من» منتشر کرد.", "summary_fa": "گانا اکنون رئیس شرکت ضبط موسیقی خودش است. رپر آتلانتا رسماً SB The Label imprint خود را با همکاری آتلانتیک رکوردز در روز جمعه (9 اکتبر) راه اندازی کرد. فهرست SB The Label شامل هنرمندان نوظهوری مانند کاسپر بلوف، دراک و نچی است که با Gunna برای I Can t Feel My Face در سال 2025 همکاری کردند. مرتبط: Gunna از انتشار آلبوم جدید خود خبر داد: این چیزی است که او درباره تاریخ انتشار گفت: همه 11 پروژه Gunna رتبه بندی شده اند. در کنار برادرانم کاسپر بلوف، نچی و دراک، که اولین هنرمندانی هستند که با لیبل امضا کردند. برای من، این در مورد قدم گذاشتن در یک نقش جدید، گسترش آنچه می توانم خلق کنم و ساختن چیزی است که نشان دهنده مسیر بعدی من باشد. مدیر عامل گروه موسیقی آتلانتیک، الیوت گرینج، اضافه کرد: غیرممکن است که از تأثیر گانا بر این نسل از هیپ هاپ و موسیقی به طور کلی اغراق کنیم. ما سپاسگزار و مفتخریم که او AMG را به عنوان شریک خود انتخاب کرد تا این تلاش را برای طرفداران موسیقی ارائه دهد. آلبوم Gunna 2025، The Last Wun، از طریق Young Thugs YSL imprint و 300 Entertainment منتشر شد. مشخص نیست که آیا این وضعیت همچنان ادامه خواهد داشت یا خیر. رپر Drip Too Hard در مصاحبه ای در سپتامبر با فوربس در مورد وضعیت برچسب خود پاسخ مبهمی داد. من نمی گویم ظاهرا رایگان است. ما در حال کار هستیم.» گونا گفت: «مذاکرات زیادی در مورد اینکه چه چیزی در حال تولید است و چه کسی پشتیبان من برای حمایت از آن خواهد بود، صورت گرفته است. گونا در همان مصاحبه از برنامه های عنوان آلبوم بعدی خود، Splurge، رونمایی کرد. می خواهم آن را معرفی کنم که همان Splurge است، او بدون ذکر تاریخ انتشار گفت. این هنرمند رده بالا"}, {"source": "Billboard", "title": "50 Cent Jokes That Jay-Z Will Perform at His Future Wedding — Kanye Too, ‘If He’s Not Banned at the Time’", "link": "https://www.billboard.com/music/rb-hip-hop/50-cent-jay-z-kanye-wedding-performers-1236358464/", "summary": "50 Cent might never stop trolling Jay-Z . As the rapper, actor and film producer has been out and about promoting his upcoming movie Street Fighter , he brought up his longtime rival. During a conversation about influence and power with comedian and podcaster Andrew Schulz, his Street Fighter co-star, for Interview magazine, 50 alluded to Jay s master marketing skills. Stability is attractive, he said when talking about becoming successful and financially stable. Them looking at you and knowing the financial component is going to take away the pressure they may feel, it almost puts you in a dream sequence. You don’t personally have to be stylish. My stylist has to be stylish. They’re picking out my clothes. And if you got help with what you decided to wear today, how is that not the best version of you? You see what I’m saying? They have an opportunity to meet the best version of you because of the position you’re in. That’s how we see the person’s personality after they settle in. However, he then got into how some feel like they need to maintain relevance to be top of mind and randomly used Jay and his oft-talked-about hair as an example. After they’ve been there for a while, you see who they actually are. And if not, we see the gimmicks, he said. We see things like the Basquiat hair. When that comes, you go, No, it was intentionally grown out for a Tiffany ad. The puffy hair, cut it off. Go back to young me. He then continued by commending Jay s relationship with touring companies and his ability to change the narrative of his debut album Reasonable Doubt with his recent shows at Yankee Stadium and The Home Home Tour he did with Eminem back in 2010. If you have a strong enough relationship with the tour companies, they’ll do a touring deal with you because they’re securing the tour deal with Beyoncé , he said. When they have to do things to broaden your audience, they may do New York and Detroit. He’s done this before. He’s done the stadium in New York. Him and Em, they matched him up with the biggest rapper in the world like they’re the same. We do your hometown and then my hometown. He added: That’s just to change perception and make him appear as big as Eminem. Bro, the album showed up No. 23 on the chart when it debuted. It was not a f ing big deal then. Why is it a big deal now? It’s great marketing. Schulz then joked around and said producers of their new movie had first reached out to the Brooklyn mogul to play boxer Balrog before they hit 50 up.", "date_str": "2026-10-09T23:10:10+00:00", "hash": "2b7984b810ddb89c", "title_fa": "جوک های 50 سنت که جی زی در عروسی آینده خود اجرا خواهد کرد - کانیه نیز، \"اگر او در آن زمان ممنوع التصویر نباشد\"", "summary_fa": "50 سنت ممکن است هرگز از ترول کردن جی زی دست نکشد. از آنجایی که این خواننده رپ، بازیگر و تهیه‌کننده فیلم بیرون رفته و قصد تبلیغ فیلم آینده‌اش Street Fighter را دارد، رقیب دیرینه‌اش را مطرح کرد. در خلال گفتگو در مورد نفوذ و قدرت با کمدین و پادکست اندرو شولز، همبازی او در Street Fighter، برای مجله Interview، 50 به مهارت های بازاریابی استاد جی اشاره کرد. او وقتی در مورد موفقیت و ثبات مالی صحبت می کند، گفت: ثبات جذاب است. آنها به شما نگاه می کنند و می دانند که مؤلفه مالی فشاری را که ممکن است احساس کنند از بین می برد، تقریباً شما را در یک دنباله رویا قرار می دهد. شما شخصاً مجبور نیستید شیک باشید. استایلیست من باید شیک باشد. دارند لباس های من را انتخاب می کنند. و اگر در مورد آنچه امروز تصمیم گرفتید بپوشید کمک گرفتید، چگونه این بهترین نسخه شما نیست؟ میبینی چی میگم؟ آنها به دلیل موقعیتی که در آن هستید، فرصتی برای ملاقات با بهترین نسخه شما دارند. این گونه است که ما شخصیت فرد را بعد از تسویه حساب می‌بینیم. با این حال، او سپس متوجه شد که برخی احساس می‌کنند باید ارتباط خود را حفظ کنند تا در ذهن خود باشند و به‌طور تصادفی از جی و موهایی که اغلب درباره‌اش صحبت می‌شود به عنوان مثال استفاده کرد. بعد از مدتی که آنجا بودند، می بینید که واقعا چه کسانی هستند. و اگر نه، ما حقه ها را می بینیم، او گفت. ما چیزهایی مانند موهای باسکیا را می بینیم. وقتی این اتفاق می‌افتد، می‌روید، نه، عمداً برای تبلیغ تیفانی ساخته شده است. موهای پف کرده را قطع کن به من جوان برگرد او سپس با تمجید از رابطه جی با شرکت‌های تور و توانایی او در تغییر روایت اولین آلبومش Reasonable Doubt با"}, {"source": "Billboard", "title": "Summer Walker in Legal Dispute With Interscope Over Record Deal", "link": "https://www.billboard.com/pro/summer-walker-legal-dispute-interscope-record-deal/", "summary": "Summer Walker and Interscope Records are in a legal dispute over the status of her record deal. Walker, who signed a joint deal with the Universal Music Group (UMG) subsidiary and label/management company LVRN in 2017, sent a notice of termination to Interscope in August. Interscope responded on Friday (Oct. 9) by submitting a lawsuit, obtained and first reported by Billboard , alleging that if Walker does indeed break their deal, she’d owe $50 million for not yet delivering all her promised albums. Related Summer Walker Completes No. 1 Trilogy on Top R B/Hip-Hop Albums Chart Hilary Duff to Receive Outstanding Pop Tour of the Year Award at 2026 Billboard Live Music Summit Judge Rules Woman Accused of Shooting at Rihanna A$AP Rocky s Home Mentally Fit to Stand Trial The singer-songwriter is invoking California’s “seven-year statute,” a 1944 state law that allows an individual to exit a personal services contract after that amount of time. The statute was amended in 1987 to allow record labels to sue artists for damages if they leave after seven years but before fulfilling all their album commitments. Under that law, labels only have 45 days to bring such lawsuits in response to contract termination notices. Interscope s Friday complaint, brought at the tail-end of that period, alleges Walker has only delivered three projects from her contract’s five-album commitment: her 2019 debut Over It , which hit No. 2 on the Billboard 200, the 2021 chart-topper Still Over It and another No. 2 set, Finally Over It , in 2025. A spokesperson for Interscope told Billboard in a statement Friday, While we remain hopeful that our ongoing discussions will lead to an amicable resolution, the statutory deadline makes it necessary to file suit in order to preserve the terms of our contract. We have great respect for Summer and her music and would welcome the opportunity to continue our successful partnership.” Walker’s reps did not immediately return a request for comment on the matter. Labels have in the past used these types of damages lawsuits to respond when artists seek to terminate their record deals under the seven-year statute. Warner Bros. Records did so amid a dispute with heavy metal band Avenged Sevenfold in 2016, as did MCA with R B groups New Edition and Bell Biv DeVoe back in the 1990s. There have been numerous unsuccessful efforts in the California legislature to repeal the 1987 amendment that allows labels to bring such lawsuits, with artist advocates arguing th", "date_str": "2026-10-09T22:56:15+00:00", "hash": "d82fc5f6028d456d", "title_fa": "سامر واکر در دعوای حقوقی با Interscope بر سر معامله رکورد", "summary_fa": "سامر واکر و Interscope Records بر سر وضعیت قرارداد ضبط او درگیر اختلاف حقوقی هستند. واکر که در سال 2017 قراردادی مشترک با گروه موسیقی یونیورسال (UMG) و شرکت لیبل/مدیریت LVRN امضا کرد، در ماه اوت اخطاریه فسخ را به Interscope ارسال کرد. Interscope در روز جمعه (اکتبر. 9) با ارائه دادخواستی که برای اولین بار توسط بیلبورد به دست آمد و گزارش شد، مبنی بر اینکه اگر واکر واقعاً قرارداد آنها را زیر پا بگذارد، 50 میلیون دلار به خاطر تحویل ندادن همه آلبوم های وعده داده شده خود بدهکار خواهد بود. مربوط به Summer Walker Completes No. 1 سه گانه در جدول آلبوم های R B/Hip-Hop برتر هیلاری داف برای دریافت جایزه بهترین تور پاپ سال در اجلاس موسیقی زنده بیلبورد در سال 2026 قاضی حکم داد زن متهم به تیراندازی در خانه ریحانا A$AP Rocky Mently Fit to Stand Trial است. قانون ایالتی 1944 که به افراد اجازه می دهد پس از مدت زمانی از قرارداد خدمات شخصی خارج شوند. این اساسنامه در سال 1987 اصلاح شد تا شرکت‌های ضبط بتوانند در صورت خروج از هنرمندان پس از هفت سال اما قبل از انجام تمام تعهدات آلبوم خود، از آنها برای جبران خسارت شکایت کنند. بر اساس آن قانون، لیبل‌ها تنها 45 روز فرصت دارند تا در پاسخ به اعلامیه‌های فسخ قرارداد، چنین شکایتی را مطرح کنند. شکایت جمعه Interscope، که در انتهای آن دوره مطرح شد، ادعا می‌کند که واکر تنها سه پروژه را از قرارداد پنج آلبوم خود ارائه کرده است: اولین آلبوم او در سال 2019، که موفق به کسب رتبه اول شد. 2 در بیلبورد 200، رتبه اول جدول 2021 Still Over It و ست شماره 2 دیگر، در نهایت در سال 2025. سخنگوی Interscope در بیانیه ای روز جمعه به بیلبورد گفت، در حالی که امیدواریم بحث های در حال انجام ما"}, {"source": "Billboard", "title": "Ella Langley Cancels Oklahoma Concert Hours Before Showtime Citing ‘Serious Security Threat’", "link": "https://www.billboard.com/music/country/ella-langley-concert-canceled-tulsa-oklahoma-security-threat-1236358477/", "summary": "Only a few hours before showtime, Ella Langley has canceled her concert at Tulsa, Oklahoma’s BOK Center on Friday night (Oct. 9) because of “a serious security threat,” according to a statement on the country singer’s Instagram page. “Due to a serious security threat involving the safety of my fans, venue personnel, and the artist, Ella Langley’s scheduled performance tonight at BOK Center in Tulsa has been canceled,” reads the post that appeared shortly before 5 p.m. CT on both Langley s and the venue s socials. “The safety and well-being of everyone involved is our absolute priority, and, after careful consideration, we have determined that the show cannot proceed. We understand the disappointment this news brings and apologize to fans who planned to attend. The safety of our fans is our foremost concern and will always come first,” the message continues. Ticket refund information will be forthcoming. View this post on Instagram The Tulsa Police Department say that they had swept the area and found no credible threat. A sold-out concert was canceled tonight over threats of violence, reads a statement on the Tulsa Police Department s Facebook page. As with any large event, the Tulsa Police Department goes to great lengths to ensure that it is safe for eventgoers and those coming to perform. Before the event, we swept the area with our K-9, Bomb Team, Patrol, and BOK security for anything dangerous. We did not find anything. [Then] a call was made threatening the lives of people attending the event. Out of an abundance of caution, we swept the building and surrounding area and again found no credible threat to the event s safety. We advised the performer s staff that we found no credible threat to the event, but they decided to cancel the performance anyway. In a Facebook video from the Tulsa PD relaying the same information, Captain Richard Meulenberg went into further detail saying that after the initial routine sweep, a threatening call came in with the caller saying someone was going to bring great harm to the people at this event in the way of shots fired and bombs, so we came out again in an overabundance of caution, Meulenberg said. The person who called this in with a phone call disrupted this event for all these folks. The police also asked for the public s help on its Facebook page: This incident is under investigation. If you know anything about it that can be helpful and want a cash reward, call Tulsa Crime Stoppers at 918-596-COPS. Langley is ", "date_str": "2026-10-09T22:38:19+00:00", "hash": "3080e1509ed31e84", "title_fa": "الا لنگلی کنسرت اوکلاهما را ساعاتی قبل از زمان پخش کنسرت به دلیل تهدید امنیتی جدی لغو کرد", "summary_fa": "طبق بیانیه ای در صفحه اینستاگرام این خواننده کانتری، تنها چند ساعت قبل از زمان نمایش، الا لنگلی کنسرت خود را در مرکز BOK اوکلاهما در تالسا در شب جمعه (9 اکتبر) به دلیل \"یک تهدید جدی امنیتی\" لغو کرد. در پستی که کمی قبل از ساعت 5 بعد از ظهر منتشر شد، آمده است: «به دلیل تهدید امنیتی جدی که امنیت هواداران، پرسنل محل برگزاری و هنرمند را در بر می گیرد، اجرای برنامه ریزی شده الا لنگلی امشب در مرکز BOK در تولسا لغو شده است. سی تی در هر دو شبکه اجتماعی لنگلی و محل برگزاری. این پیام ادامه می‌دهد: \"ایمنی و رفاه همه کسانی که درگیر هستند اولویت مطلق ما است و پس از بررسی دقیق، ما به این نتیجه رسیدیم که نمایش نمی‌تواند ادامه پیدا کند. ناامیدی را که این خبر به همراه دارد را درک می‌کنیم و از طرفدارانی که قصد حضور در آن را داشتند عذرخواهی می‌کنیم. امنیت هواداران ما مهمترین نگرانی ما است و همیشه در اولویت خواهد بود.\" اطلاعات بازپرداخت بلیط به زودی اعلام خواهد شد. این پست را در اینستاگرام مشاهده کنید اداره پلیس تولسا می گوید که آنها منطقه را جارو کرده اند و هیچ تهدید معتبری پیدا نکرده اند. در بیانیه ای در صفحه فیس بوک اداره پلیس تولسا آمده است که کنسرت فروخته شده امشب به دلیل تهدید به خشونت لغو شد. مانند هر رویداد بزرگ، اداره پلیس تولسا تمام تلاش خود را می کند تا اطمینان حاصل کند که برای شرکت کنندگان رویداد و کسانی که برای اجرا می آیند ایمن است. قبل از این رویداد، ما منطقه را با K-9، تیم بمب، پاترول، و امنیت BOK برای هر چیز خطرناکی جارو کردیم. ما چیزی پیدا نکردیم. [سپس] تماسی گرفته شد که جان افرادی را که در این مراسم شرکت می کردند تهدید می کرد. از"}, {"source": "Deadline", "title": "Joseph Gordon-Levitt Warns A.I. Models Are “Being Trained To Hijack Your Intimacy”", "link": "https://deadline.com/2026/10/joseph-gordon-levitt-artificial-intelligence-1237153993/", "summary": "In a new video interview for The New York Times, actor Joseph Gordon-Levitt, serving as the United Nations’ global advocate of human-centric digital governance, has some concerning words about the impact of artificial intelligence. Things like the decline of democracy, the decline of human empathy and the hijacking of your intimacy. The video interview takes [ ]", "date_str": "2026-10-10T14:24:32+00:00", "hash": "fe41b820156ee438", "title_fa": "جوزف گوردون-لویت هشدار می دهد A.I. مدل‌ها برای ربودن صمیمیت شما آموزش دیده‌اند", "summary_fa": "در یک مصاحبه ویدیویی جدید برای نیویورک تایمز، جوزف گوردون-لویت، بازیگر، که به عنوان مدافع جهانی حکومت دیجیتال انسان محور سازمان ملل فعالیت می کند، سخنان نگران کننده ای در مورد تأثیر هوش مصنوعی بیان می کند. مواردی مانند افول دموکراسی، کاهش همدلی انسانی و ربودن صمیمیت شما. مصاحبه ویدیویی طول می کشد [ ] سوال اول: چرا مردم باید به یک بازیگر در A.I گوش دهند. ایمنی؟ گوردون-لویت پاسخ می دهد سوال بسیار منصفانه ای است. چرا به یک بازیگر گوش می دهیم؟ به حرف بازیگر گوش نده شما باید Human Compatible نوشته استوارت راسل را بخوانید. برو یوشوا بنجیو را جستجو کن. پست‌های افرادی که در راستای همسویی و ایمنی و خط‌مشی کار می‌کنند را بخوانید. شما نمی خواهید همه آن چیزها را بخوانید؟ خوب، من انجام دادم! بنابراین، می دانید، اگر می خواهید به من گوش دهید، این یک میانبر است. تماشا در Deadline گوردون-لویت ادامه می‌دهد، چیزی که ما نمی‌خواهیم این است که دسته‌ای از مردم گیج یا بی‌تفاوت باشند، در حالی که این کسب‌وکارهای بسیار سریع، آینده را خودشان طراحی می‌کنند، فقط به نفع منافع خودشان. من فکر می‌کنم بسیاری از اتفاقاتی که باید بیفتد به ارتباطات مربوط می‌شود، که در نهایت به نوعی بازیگری یا فیلم‌سازی است. در یک نقطه از مصاحبه مستقیم با دوربین تلفن همراه، از گوردون لویت پرسیده می شود که او از چه چیزی بیشتر از A.I می ترسد. او با پذیرفتن ریسکِ رنجاندن نیویورک تایمز، پاسخ می‌دهد که من به این سوال اعتراض می‌کنم، فقط به این دلیل که تقلیل این نگرانی‌ها به یک تکه‌ی کوچک از ترس، خودش یکی از مشکلات است. برای من، گفتنِ اینکه: اوه، من می‌ترسم که هوش مصنوعی بتواند تمام بشریت را نابود کند، واقعاً به اصلِ نگرانی نمی‌رسد. این نگرانی واقعاً درست است. اما این چیزی نیست که واقعاً من را نگران کند."}, {"source": "Deadline", "title": "Oscars: UK Selects ‘Rehearsals For A Revolution’ For Best International Feature Film", "link": "https://deadline.com/2026/10/oscars-uk-rehearsals-revolution-best-international-film-1237154001/", "summary": "The UK has selected Pegah Ahangarani’s Rehearsals For A Revolution as its entry to the Best International Feature Film category of the 99t 26/10/netflix-korea-the-blue-road-han-jun-hee-1237153975/", "summary": "Korean writer-director Han Jun-hee talked strategies for getting audiences to respond to risky or unfamiliar material in a masterclass at Netflix’s Creative Asia day at Busan International Film Festival. “There has to be risk for something to be interesting. Only if you take risks can you tell an interesting story. Trying to play it safe [ ]", "date_str": "2026-10-10T14:10:39+00:00", "hash": "72aad6c4d563a7d7", "title_fa": "هان جون هی کارگردان «جاده آبی» نتفلیکس در مورد ریسک کردن با داستان ها و فیلمبرداری در ژاپن", "summary_fa": "هان جون هی، نویسنده و کارگردان کره ای، در یک مسترکلاس در روز Creative Asia نتفلیکس در جشنواره بین المللی فیلم بوسان، درباره راهبردهایی برای وادار کردن مخاطبان به پاسخ به مطالب خطرناک یا ناآشنا صحبت کرد. \"برای اینکه چیزی جالب باشد باید ریسک وجود داشته باشد. تنها در صورتی که ریسک کنید می توانید داستان جالبی را تعریف کنید. تلاش برای ایمن کردن آن [ ] در یک سخنرانی که توسط مدیر محتوای نتفلیکس کره ای، کیم کیجا، مدیریت می شد، هان توضیح داد که چگونه به سریال موفق خود D.P نزدیک شده است. (2021)، درباره پلیس نظامی کره در مأموریتی برای دستگیری فراریان، و کلاس قهرمان ضعیف (2022)، درباره قلدری و خشونت دبیرستانی. هان نویسندگی و کارگردانی D.P. در حالی که او به عنوان مدیر خلاق در کلاس قهرمان ضعیف خدمت می کرد. در آخرین مهلت تماشا کنید داستان های مرتبط اخبار La Bola Negra کارگردانان در ترومای نسلی حفاری می کنند: چیزی در اعماق درون آن لمس شده است - رقبای لندن نظرات نقد ری گان نقد: سم راکول و اسکارلت جوهانسون کانال بوگی و باکال در فیلم علمی تخیلی برد برد برد برد - فقط بعضی از مردم می توانند به داستان های ارتش لندن فکر کنند زمانی که جشنواره فیلم نوآر به آن فکر می کند. مرتبط کردن اما برای مخاطبان زن، همه آنها پدر یا برادرانی دارند که احتمالاً در ارتش بوده اند. هان گفت، اگر خارج از چارچوب فکر می کنید، می تواند داستان جالبی باشد. هان در مورد کلاس قهرمان ضعیف که حول گروهی از دوستان مرد می چرخید و مبارزات زیادی را به نمایش می گذاشت، گفت: در کره تصور می شود که این ژانر را فقط می توان با بودجه کمی  می‌گوید این بار کامل‌ترین و صادقانه‌ترین روایت را از تمام زندگی‌هایش گفته است. در Devil on My Shoulder، او به شرح دوران کودکی بت و در عین حال غیرعادی می‌پردازد که در آن خانواده‌اش، به رهبری یک واعظ در کلیسای عیسی مسیح (همچنین به نام بیکرتونیت‌ها) از منطقه دیترویت به آریزونا نقل مکان کردند تا کوپر بتواند از آسم دوران کودکی رهایی یابد و پدرش بتواند در میان بومیان آمریکا کار تبلیغی انجام دهد. او در حالی که با هم گروه"}, {"source": "Rolling Stone", "title": "Can This Pediatrician Flip a South Carolina Senate Seat?", "link": "https://www.rollingstone.com/politics/politics-features/annie-andrews-south-carolina-senate-race-darline-graham-1235640624/", "summary": "Annie Andrews talks to Rolling Stone about Trump's attacks, Darline Graham, and the issues animating voters — and herself", "date_str": "2026-10-10T14:00:00+00:00", "hash": "4f85d6d03a2cdc16", "title_fa": "آیا این متخصص اطفال می تواند صندلی سنای کارولینای جنوبی را بچرخاند؟", "summary_fa": "آنی اندروز با رولینگ استون در مورد حملات ترامپ، دارلین گراهام، و مسائلی که رای دهندگان را متحرک می کند صحبت می کند - و خودش قبل از مرگش در جولای، لیندسی گراهام به مدت 23 سال بر سیاست کارولینای جنوبی حکومت کرد. این ایالت محافظه‌کار بود سپس گراهام پس از مرگ نژادپرست افسانه‌ای استروم تورموند در سال 2003 برنده کرسی شد و اکنون یک ایالت محافظه‌کار است، اما مرگ گراهام و عدم محبوبیت شدید دونالد ترامپ فرصتی را برای یک دموکرات ایجاد کرده است تا آینده ایالت را تغییر دهد. دکتر آنی اندروز وارد شوید. اندروز یک متخصص اطفال حرفه ای است که در چرخه انتخابات 2022، زمانی که با نانسی میس، نماینده کنگره به چالش کشیده شد، به سیاست روی آورد. این رقابت کافی بود تا او را به سمت جلوی نیمکت دموکرات ها در ایالت سوق دهد و اکنون او یکی از بهترین امیدهای حزب برای تسخیر کرسی حیاتی و بازپس گیری کنترل قدرتمندترین نهاد قانونگذاری در کشور است. با این حال، اندروز به رولینگ استون می گوید که توجه زیادی به مبارزات بزرگ حزب ملی دموکرات ندارد. در عوض، او می‌گوید که می‌خواهد بخشی از دوره جدیدی از دو حزب‌گرایی و سازش باشد، و به رای‌دهندگان کارولینای جنوبی اصرار می‌کند که مسائلی که برای آنها مهم است، مسائلی هستند که برای او مهم هستند: مراقبت‌های بهداشتی، مراکز داده، و قیمت گازوئیل. با این حال، میراث گراهام، خواهرش، دارلین گراهام، که در ماه جولای توسط فرماندار هنری مک مستر به کرسی لیندزی منصوب شد، در سر راه او قرار دارد. تاکنون، کمپین حزب جمهوری خواه برای انتخاب گراهام به جای برادرش تنها بر شناخت نام استوار بوده است. او تا حد زیادی در مسیر مبارزات انتخاباتی غایب بوده است، و زمانی که ظاهر شد، علاقه چندانی به این کار نشان نداده و استعداد کمی از خود نشان"}, {"source": "Rolling Stone", "title": "Geordie Greep Cancels Tour Dates Amid Sexual Misconduct Allegation", "link": "https://www.rollingstone.com/music/music-news/geordie-greep-cancel-tour-dates-sexual-misconduct-claim-1235640795/", "summary": "Singer, who denied rape accusation, cancels four gigs following alleged incident that occurred Thursday in Vancouver", "date_str": "2026-10-10T13:50:34+00:00", "hash": "407d2075e8600e38", "title_fa": "Geordie Greep تاریخ های تور را به دلیل اتهامات سوء رفتار جنسی لغو کرد", "summary_fa": "سینگر که اتهام تجاوز جنسی را رد کرد، چهار کنسرت را به دنبال حادثه ادعایی که روز پنجشنبه در ونکوور رخ داد، لغو کرد. Greep قرار بود جمعه شب در Boise، آیداهو اجرا کند و سپس یک کنسرت شنبه در سالت لیک سیتی، یوتا برگزار شود. هر دوی این نمایش‌ها و همچنین کنسرت‌های هفته آینده در بولدر، کلرادو و دنور، به دنبال حادثه‌ای که پنجشنبه در ونکوور، بریتیش کلمبیا رخ داد، لغو شدند. در آن نمایش، شخصی در خارج از محل برگزاری پرل در حال پخش بروشورهایی بود که روی آن نوشته شده بود Geordie Greep A Rapist. می دانید امروز صبح 8 اکتبر چه کردید. او فکر می کند می تواند کاری را که می خواهد انجام دهد. به او اجازه دهید بداند ونکوور در مورد متجاوزین چه فکری می کند. گریپ که در نهایت یک ساعت دیرتر از موعد مقرر روی صحنه آمد و بدون گروه حمایت کننده اش اتهامات موجود در آگهی ها را برای شروع نمایش ونکوور مطرح کرد. بنابراین اساساً اتفاقی که دیشب افتاد، من و تعدادی از گروه به چند بار بیرون رفتیم، بیرون رفتیم، با مردم آشنا شدیم، و در نهایت به موقعیتی ختم شد که واقعاً دیر در یک مهمانی خانگی، من با کسی که آنجا بود، عصا را اشتباه گرفتم، و من حرکتی انجام دادم، و گریپ به جمعیت گفت آن را ترک نکرد. من واقعاً سریع عذرخواهی کردم و این یک سوء تفاهم کامل از طرف من بود و احساس بدی داشتم، بسیار متاسفم و به شدت از کل وضعیت ناراحت شدم. من هرگز به یک زن تجاوز نمی کنم. من متجاوز نیستم این طور نیست که پایین آمد. داستان‌های پرطرفدار وحشیانه: رهبر کاتولیک طرح هگزت برای اعدام عمومی را محکوم می‌کند. Interscope ادعا می‌کند که سامر واکر 50 میلیون دلار بدهکار خواهد بود، اگر از قرارداد ضبط فاصله بگیرد"}, {"source": "Rolling Stone", "title": "Carter Faith Wants to Make You a Little Uncomfortable", "link": "https://www.rollingstone.com/music/music-features/carter-faith-interview-cherry-valley-nashville-rules-1235639912/", "summary": "The country music songwriter is putting her own spin on the genre with an unapologetic demeanor, lyrics about going crazy, and maybe some murder fantasies", "date_str": "2026-10-10T13:15:00+00:00", "hash": "cb7e970f1e8d6f82", "title_fa": "کارتر فیث می خواهد شما را کمی ناراحت کند", "summary_fa": "ترانه سرای موسیقی کانتری با رفتاری بی عذرخواهی، اشعاری در مورد دیوانه شدن، و شاید برخی از فانتزی های قتل، چرخش خود را در این ژانر انجام می دهد. آنها در زیر میز ما در اینجا در اسکین دنیس، یک هانکی تونک نه چندان دور از خانه فیث نشویل دیده نمی شوند، اما او آنها را پوشیده است، مطمئناً یک جفت تلمبه رکابی مشکی با مجموعه ای از خارهای فلزی واقعی که به پشت وصل شده اند و برای مد هستند، نه جنایت. اما هی، اگر شخص اشتباهی بیاید، مانند آنچه در موزیک ویدیوی آهنگ او Pearl Handled Pistol انجام می دهد؟ خوب است بدانید که آماده اید. فیث می‌گوید که همیشه دوست داشتم مردم را گیج کنم و آن‌ها را ناراحت کنم. Faith، همراه با استایلیست خود، کندی و کارگردان خلاق لیلی، آنها را برای این ویدئو طراحی کردند، که در آن او یک جفت غرق در خون را در نزدیکی جسد مرده پوشیده است (ما هیچ قتل واقعی نمی بینیم، اما شما حساب کنید). کفش ها، مانند موسیقی Faith، زیبا هستند، اما اگر مراقب نباشید، شما را می برند. او می‌گوید می‌دانم که من یک دختر بلوند جنوبی هستم و دوست دارم آرایش و کارهایم را انجام دهم، اما در عمق وجودم مثل یک پیرمرد عصبانی هستم. این حس خفیف ناراحتی، همراه با صدای کانتری متبلور Faith و ترانه سرایی مرزی، هسته اصلی رکورد او Cherry Valley (و نسخه لوکس اخیر، Cherry Valley Forever) است. او به همان اندازه پتسی کلین است که دیوید لینچ است، با آهنگ‌هایی که به هیچ وجه نمی‌ترسند موضوعات تابویی مانند سلامت روان، جنسی، و مواد مخدر را مطرح کنند و همه آن‌ها را در یک سرزمین رویایی آلبوم مفهومی قرار دهند و درد و زهر را در روبان‌ها و توری‌ها بپیچند. این آلبوم که در سال گذشته رتبه دوم را در فهرست"}, {"source": "Rolling Stone", "title": "The Strokes’ Nick Valensi, Aziya, and Mr Hudson Unleash New Song ‘Scream Your Name’", "link": "https://www.rollingstone.com/music/music-news/the-strokes-nick-valensi-aziya-mr-hudson-scream-your-name-1235640707/", "summary": "The track is the latest offering from newly launched record label Sick", "date_str": "2026-10-10T01:59:36+00:00", "hash": "74d5de4b17e2ae7c", "title_fa": "نیک والنسی، آزیا و آقای هادسون از گروه The Strokes آهنگ جدیدی به نام «اسم خودت را فریاد بزن» منتشر کردند.", "summary_fa": "آهنگ جدیدترین پیشنهاد از کمپانی تازه راه اندازی شده Sick است. دومین تک آهنگ از این کمپانی تازه راه اندازی شده، با نام دوست داشتنی Sick، رونمایی شد. آهنگ Scream Your Name با همکاری نیک والنسی از گروه Strokes، تهیه کننده آقای هادسون و خواننده و ترانه سرا آزیا است. آزیا یک غواصی عاشقانه با ریتم‌های تند و یک گیتار مخدوش‌کننده، آهنگ را قصیده‌ای برای فشار و کشش رابطه‌ای می‌خواند که اصلاً نباید در آن باشید. او در بیانیه‌ای گفت: وقتی نیک، بن و من وارد استودیو شدیم، من واقعاً به آنها گفتم که فقط می‌خواهم آزمایش کنم و کاوش کنم، بدون اینکه احساس کنم برنامه‌های حرفه‌ای بزرگی پشت آهنگ وجود دارد. از نظر غزلی، آزیا می‌خواست که اسمت را فریاد بزن، علی‌رغم توصیف رابطه‌ای که به شدت ناسالم است، به طرز طعنه‌ای سرگرم‌کننده باشد. او افزود، فکر می‌کنم این آهنگ ساکسیفون یا آرامش قبل از طوفان است، که فقط بلندتر و بلندتر می‌شود تا زمانی که بالاخره آن را ترک می‌کنید یا دوباره برای راند 10 وارد می‌شوید. Sick توسط Carr Callaway (معروف به نوازنده Queen Kwong)، داریان زاهدی، و نیک هینمن اولین تک‌آهنگ خود را با نام PULS.zip، KillyoS و KillyoS را با هم منتشر کرد. هنرمند RIS-707. داستان‌های پرطرفدار وحشیانه: رهبر کاتولیک طرح هگزت برای اعدام عمومی را محکوم می‌کند. Interscope ادعا می‌کند که سامر واکر 50 میلیون دلار بدهکار خواهد بود، اگر از قرارداد ضبط فاصله بگیرد U2 ترانه‌ای درباره روزالیا بنویسد. او در مورد آن چه احساسی دارد؟ هدف عبدالالسید اجازه نمی‌دهد مایک راجرز آرایش ماگا را بشویید، هدفش این است که هنرمندان تثبیت‌شده و نوظهور را در نسل‌ها، ژانرها و شهرهای مختلف برای تک‌آهنگ‌های مشترک بدون قراردادهای طولانی‌مدت محدود کند. این برچسب از هنرمندان مستقل و امضا شده استقبال می کند. Callaway اخیراً به مجله Flood گفت: من می خواهم Sick یک جامعه و"}, {"source": "Rolling Stone", "title": "Interscope Claims Summer Walker Will Owe $50 Million if She Walks Away From Record Deal", "link": "https://www.rollingstone.com/music/music-news/summer-walker-record-deal-interscope-lawsuit-1235640766/", "summary": "The label sued Friday after the singer-songwriter said she was terminating her contract under a California labor law", "date_str": "2026-10-10T01:25:55+00:00", "hash": "287c7e6463e7dd3c", "title_fa": "Interscope ادعا می کند که Summer Walker اگر از قرارداد رکورد خارج شود 50 میلیون دلار بدهکار خواهد شد.", "summary_fa": "این شرکت روز جمعه پس از آنکه این خواننده و ترانه‌سرا اعلام کرد قراردادش را تحت قانون کار کالیفرنیا فسخ می‌کند، از او شکایت کرد. سامر واکر، ستاره نامزد جایزه گرمی، پس از اعلام کناره‌گیری از قراردادی که کارشناسان صنعت موسیقی پیش از این آن را وحشیانه توصیف کرده بودند، با یک رویارویی حقوقی جدید ۵۰ میلیون دلاری با شرکت ضبط موسیقی خود روبرو است. در یک دادخواست هفت صفحه‌ای جدید که توسط رولینگ استون به دست آمده است، Interscope Records که متعلق به UMG است، ادعا می‌کند که واکر همچنان دو آلبوم استودیویی و یک EP را بر اساس قراردادی که برای اولین بار در سال 2017 امضا کرد، به این برچسب بدهکار است. این ادعا ادعا می‌کند که ضبط‌های تحویل‌نشده همچنان سررسید و برجسته هستند، اگرچه Walker اخیراً قانون کار کالیفرنیا را محدود کرده است. قراردادهای خدمات شخصی، از جمله قراردادهای ضبط، تا هفت سال. در دعوای حقوقی جدید آمده است که در نتیجه مستقیم و نزدیک عدم موفقیت واکر در تحویل ضبط‌های تحویل‌نشده، UMG متحمل خساراتی شده است و همچنان متحمل خواهد شد، از جمله اما نه محدود به سودهایی که اگر واکر تمام تعهدات خود را تحت توافق انجام می‌داد، دریافت می‌کرد. UMG حق دریافت خسارت بیش از 50,000,000 دلار برای ضبط های تحویل نشده را دارد. دعوای حقوقی پس از آن شروع شد که واکر در ماه آگوست به Interscope اطلاع داد که به زودی کار خود را بر اساس این توافق متوقف خواهد کرد. با توجه به شکایت جدید، نامه او به لیبل گفت: این نامه به عنوان اخطار رسمی خواهد بود که از 27 اوت 2026، خانم واکر دیگر خدمات خود را تحت قرارداد انجام نخواهد داد، زیرا این توافق دیگر قابل اجرا نیست. Interscope استدلال می کند که کوتاهی واکر در ارائه تمام موارد ضبط شده تحت قراردادش، او را مسئول خسارت"}, {"source": "Rolling Stone", "title": "Here’s Where You Can Still Grab iHeartRadio Jingle Ball Tickets", "link": "https://www.rollingstone.com/product-recommendations/tickets/where-to-buy-iheartradio-jingle-ball-tickets-2026-1235640410/", "summary": "The multi-city holiday bash will feature Olivia Rodrigo, Hilary Duff, Teddy Swims, and more", "date_str": "2026-10-10T00:00:00+00:00", "hash": "c246e0b47fd0dee6", "title_fa": "اینجا جایی است که هنوز می توانید بلیط های iHeartRadio Jingle Ball را بگیرید", "summary_fa": "در تعطیلات چند شهر، اولیویا رودریگو، هیلاری داف، تدی سویمز و موارد دیگر حضور خواهند داشت. شاید برای شروع فکر کردن به کریسمس خیلی زود باشد، اما برای فکر کردن به کریسمس خیلی زود نیست. و اگر به‌دنبال برنامه‌های تعطیلات هستید، تور iHeartRadio Jingle Ball در ماه دسامبر در شهرهای بزرگ با ترکیبی شامل اولیویا رودریگو، هیلاری داف، و تدی سوئیمز برگزار می‌شود. هنگامی که هفته گذشته به فروش رفت، آثار خرد تا حد زیادی برای نسخه های نیویورک و لس آنجلس از تعطیلات bash فروخته شدند. توقف‌های دیگر عبارتند از دالاس، دیترویت، فیلادلفیا و نشویل، با خط‌بندی‌ها در شهرها متفاوت است. نسخه نیویورک تور Jingle Ball بار دیگر در مدیسون اسکوئر گاردن برگزار می شود که هیلاری داف، تدی سویمز، سامبر، چارلی پوث، الکس وارن و غیره را در آن حضور خواهند داشت. نسخه لس آنجلس شامل رودریگو، داف، ری و وان ریپابلیک خواهد بود، در حالی که مجموعه دالاس شامل Katseye، Raye و Ludacris است. طرفدارانی که نمی توانند در این جشنواره شرکت کنند، می توانند برنامه ABC را تنظیم کنند، که یک برنامه ویژه تعطیلات را با نمایش اجراها پخش می کند. این ویژه روز بعد از پخش در دیزنی+ و هولو پخش خواهد شد. اگر به دنبال تماشای این تور به صورت زنده هستید، بلیط های هر یک از 9 ایستگاه در Ticketmaster موجود است. برای تاریخ های فروخته شده، طرفداران می توانند سایت های فروش مجدد را بررسی کنند. و اگر به دنبال نکاتی در مورد صرفه جویی در فروش مجدد بلیط هستید، می توانید راهنمای ما را در اینجا بررسی کنید. بلیط های نسخه لس آنجلس از Jingle Ball از حدود 200 دلار برای بخش های بالایی شروع می شود و طرفداران می توانند صندلی های 400 سطح را برای نسخه نیویورک با حدود 100 دلار دریافت کنند."}, {"source": "Rolling Stone", "title": "Ella Langley Abruptly Cancels Tulsa Show Due to ‘Serious Security Threat’", "link": "https://www.rollingstone.com/music/music-country/ella-langley-cancels-tulsa-show-security-threat-1235640718/", "summary": "According to a statement, the concert was nixed due to a threat to the singer, her team, venue staff, and fans", "date_str": "2026-10-09T22:26:09+00:00", "hash": "ea37ab6240b3a40d", "title_fa": "الا لنگلی به‌دلیل «تهدید امنیتی جدی» به‌طور ناگهانی نمایش تولسا را ​​لغو کرد", "summary_fa": "بر اساس بیانیه ای، کنسرت به دلیل تهدیدی برای خواننده، تیم او، کارکنان سالن و هواداران الا لنگلی، نمایش خود را در تولسا، اوکلاهاما، جمعه شب به دلیل تهدید امنیتی جدی برای طرفداران، کارکنان سالن و تیمش لغو کرد. ستاره کانتری این خبر را ساعاتی قبل از باز شدن درهای مرکز BOK در شبکه های اجتماعی اعلام کرد. لنگلی نوشت: به دلیل یک تهدید امنیتی جدی که شامل ایمنی هواداران من، کارکنان محل برگزاری و تیم من می شود، تصمیم فوق العاده دشواری برای لغو برنامه امشب گرفته شد و اضافه کرد که این تصمیم با توصیه مقامات محلی، تیم امنیتی او و پرسنل سالن گرفته شده است. لنگلی ادامه داد: من می‌دانم چقدر زمان، سفر، پول و برنامه‌ریزی برای حضور در یک برنامه صرف می‌شود، و نمی‌توانم به شما بگویم که چقدر متاسفم. این تصمیمی نیست که ساده گرفته شود. من خیلی مشتاق بودم که امشب را با شما بگذرانم، اما امنیت شما همیشه برای من مهمتر از هر چیز دیگری خواهد بود. من از آسیب رساندن به کسی امتناع می کنم. داستان‌های پرطرفدار وحشیانه: رهبر کاتولیک طرح هگزت برای اعدام عمومی را محکوم می‌کند. Interscope ادعا می‌کند که سامر واکر 50 میلیون دلار بدهکار خواهد بود، اگر از قرارداد ضبط فاصله بگیرد U2 ترانه‌ای درباره روزالیا بنویسد. او در مورد آن چه احساسی دارد؟ عبدالالسید به مایک راجرز اجازه نمی دهد آرایش MAGA خود را بشوید بیانیه ای که توسط محل برگزاری به اشتراک گذاشته شد، منعکس کننده پست لنگلی بود که اضافه کرد: ایمنی و رفاه همه افراد درگیر اولویت مطلق ما است و پس از بررسی دقیق، ما به این نتیجه رسیدیم که نمایش نمی تواند ادامه یابد. این مکان اعلام کرد که اطلاعات مربوط به بازپرداخت بلیط به زودی به اشتراک گذاشته خواهد شد. لنگلی در حال حاضر در انتهای تور تیتراژ قاصدک خود است"}, {"source": "Rolling Stone", "title": "The Pokémon Chaos Rising Trading Cards Are Selling Out, But You Can Still Find Them Here", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/pokemon-chaos-rising-trading-cards-price-shop-online-1235640321/", "summary": "Chaos Rising has proven to be one of the most in-demand sets, but some retailers still have the cards in stock", "date_str": "2026-10-09T22:00:00+00:00", "hash": "d3ae3ee9426c7bf9", "title_fa": "کارت‌های معاملاتی Pokémon Chaos Rising در حال فروختن هستند، اما شما همچنان می‌توانید آنها را در اینجا پیدا کنید", "summary_fa": "Chaos Rising ثابت کرده است که یکی از پرتقاضاترین مجموعه‌ها است، اما برخی از خرده‌فروش‌ها هنوز کارت‌ها را در انبار دارند. اگر محصول یا خدماتی را که به‌طور مستقل بررسی شده است از طریق پیوندی در وب‌سایت ما خریداری کنید، رولینگ استون ممکن است کمیسیون وابسته دریافت کند. وقتی پسر عموی من در استرالیا به من پیام داد که آیا می توانم مجموعه را در Target بخرم و برای او ارسال کنم، می دانستم که بازی کارتی تجاری Pok mon Chaos Rising یک معامله بزرگ است. رئیس من، که در حال حاضر در پاریس است، این تقاضا را تکرار کرد و به من mary_fa": "در طی یک سخنرانی در جشنواره فیلم لندن، او همچنین به اشتراک گذاشت که دوست دارد در یک موزیکال بازی کند یا نقشی بی کلام بازی کند، و اینکه او \"وسواس فکری\" دارد و چگونه بازی ویتنی هیوستون همه چیز را تغییر داد. نائومی آکی (من می‌خواهم با کسی برقصم، جنگ ستارگان: قسمت نهم، ظهور اسکای واکر، تبر کوچک، میکی 17، کلوپ قتل پنجشنبه) در طنز ضد سرمایه‌داری بوتس رایلی، I Love Boosters، بخشی از 70مین دوره جشنواره فیلم لندن (OFFFI) که در جشنواره فیلم 18 برگزار می‌شود، بازی می‌کند. اما روز شنبه، او نه تنها درباره فیلم جدیدش که در آن با بازیگرانی مانند کیک پالمر، دمی مور، دان چیدل و تیلور پیج حضور داشت، صحبت کرد، بلکه در مورد تجربیات حرفه‌ای و بینش‌های حرفه‌ای‌اش در مورد حرفه بازیگری در طول یک سخنرانی LFF Screen Talk صحبت کرد. در طول جلسه، که توسط گریس باربر-پلنتی، برنامه‌ریز جشنواره فیلم لندن BFI اداره می‌شد، ستاره بارها تشویق و خنده را از سوی جمعیت ستایش‌کننده‌ای که اتاق را با هیاهوی شور و شوق و جذابیت طبیعی آکی ترک کردند، برانگیخت. داستان‌های مرتبط فیلم‌ها ستاره بدفورد پارک مون چوی مسیر خود را بین کره و موسیقی هالیوود ترسیم می‌کند لیزا و کارگردان سو کیم در مستندسازی ستاره‌ها از سیستم کی‌پاپ در Always Lalisa یکی از تم‌های تکرارشونده، حرکت یکپارچه بازیگر زن بین تولیدات کوچکتر بریتانیا و فیلم‌های هالیوود و همچنین بین فیلم‌های هالیوودی و فیلم‌های هالیوود بود. آکی به اشتراک گذاشت که از این تنوع فرصت‌ها لذت می‌برد، اما همچنین اذعان کرد که در محافل صنعتی پایتخت بریتانیا بیشتر احساس می‌کند که در خانه است. او به تماشاگران گفت که صحنه فیلم لندن مانند خانه است، و برخورد با دوستان و آشنایان قدیمی بسیار راحت است. من احساس می‌کنم، شاید بحث‌برانگیز، [که] در آمریکا، مانند هالیوود است، و هالیوود چیزی نیست که به‌ویژه"}, {"source": "Hollywood Reporter", "title": "‘Bedford Park’ Star Moon Choi Charts Her Own Path Between Korea and Hollywood", "link": "https://www.hollywoodreporter.com/movies/movie-features/bedford-park-moon-choi-korea-hollywood-1236726874/", "summary": "The rising Korean actress brings her acclaimed American indie romance with Son Sukku to Busan, where she’s also serving on the festival’s main competition jury led by Chinese filmmaking legend Zhang Yimou.", "date_str": "2026-10-10T09:28:15+00:00", "hash": "8b983ed68a0e2ba1", "title_fa": "مون چوی ستاره «بدفورد پارک» مسیر خود را بین کره و هالیوود ترسیم می کند", "summary_fa": "این هنرپیشه کره ای در حال ظهور، عاشقانه مستقل آمریکایی تحسین شده خود را با سون سوکو به بوسان می آورد، جایی که او همچنین در هیئت داوران مسابقه اصلی جشنواره به رهبری اسطوره فیلمسازی چینی ژانگ ییمو حضور دارد. درام مستقل بدفورد پارک ممکن است ثابت کند که بازیگر کره ای مون چوی شکست بزرگی در صنعت فیلم ایالات متحده است، اما با این وجود او کمی نگران است که چگونه برای طرفدارانی که کار او را بهتر می شناسند، بازی کند. او به هالیوود ریپورتر می گوید که با فکر کردن به تماشاگران کره ای، کمی عصبی می شوم، زیرا نمی دانم چه انتظاری داشته باشم. بدفورد پارک پس از برنده شدن یک جایزه در ساندنس و دریافت نقدهای قوی در تورنتو، سرانجام این هفته در جشنواره بین‌المللی فیلم بوسان با تماشاگران کره‌ای ملاقات می‌کند، اما طرفداران او در آنجا جنبه متفاوتی از ستاره‌ای را که در درام‌های K مانند Mistress (2018) یا Now, We Are Breaking Up (2021) ملاقات کردند، خواهند دید. داستان‌های مرتبط فیلم‌ها دنی بویل دلیل استفاده از هوش مصنوعی را برای مگی تاچر در جوهر به اشتراک می‌گذارد - بدون اینکه از دارایی‌اش و عشق او به وسواس و اتاق‌های پشتی بپرسد تلویزیون قدرتمندترین زنان در تلویزیون بین‌المللی به نویسندگی و کارگردانی اولین فیلم بلند سینمایی استفانی آن، که در پارک بدفورد، چوی در نقش آدری، یک مادر تصادفی 36 ساله، بازی می‌کند. بازگشت به خانه حومه نیوجرسی، او هرگز از لحاظ احساسی فرار نکرده است. راننده دیگر الی (ستاره کره ای در حال ظهور سون سوکو از شهرت Roundup و D.P.)، یک کشتی گیر سابق خاردار و فرزندخوانده کره ای است که توسط یک مادر سفیدپوست بی توجه بزرگ شده است. هنگامی که آدری برای به اشتراک گذاشتن اطلاعات بیمه به الی مراجعه می کند، این برخورد به یک بحث داغ در مورد"}, {"source": "Hollywood Reporter", "title": "BlumFest Haunts New York Comic Con 2026: All the Highlights From Blumhouse Atomic Monster", "link": "https://www.hollywoodreporter.com/movies/movie-news/blumfest-new-york-comic-con-2026-highlights-1236726806/", "summary": "Craig Zobel was unveiled as the director for the adaptation of James Tynion IV and Werther Dell’Edera’s 'Something is Killing the Children,' while Curry Barker, Mike Flanagan, James Wan, Chiwetel Ejiofor, David Harbour, LaKeith Stanfield and Kristen Bell made appearances.", "date_str": "2026-10-10T01:14:29+00:00", "hash": "41cac2f49621eb25", "title_fa": "BlumFest کمیک کان نیویورک 2026 را تسخیر می کند: تمام نکات برجسته از Blumhouse Atomic Monster", "summary_fa": "کریگ زوبل به عنوان کارگردان اقتباسی از جیمز تینیون چهارم و ورتر دل ادرا به نام «چیزی در حال کشتن کودکان است» معرفی شد و کری بارکر، مایک فلانگان، جیمز وان، چیوتل اجیوفور، دیوید هاربر، لاکیت استنفیلد و کریستن بل در این فیلم حضور داشتند. متن لوگوی بلوم فست کریگ زوبل را به عنوان کارگردان اقتباسی از جیمز تینیون چهارم و ورتر دل ادرا به نام Something is Killing the Children معرفی کرد، در عین حال اولین تریلر فیلم The Exorcist: Martyrs را نیز به نمایش گذاشت و پروژه های آینده از جمله Seasons، RoboCop، Molepeople و موارد دیگر را به نمایش گذاشت. پانل دو ساعته جمعه شب شامل ترکیب A-List شامل مایک فلانگان، جیمز وان، چیوتل اجیوفور، دیوید هاربر، لیکیت استنفیلد، کری بارکر و کریستن بل بود. تقریباً در نیمه راه پانل، کل مجموعه 2027 فاش شد، از جمله ریور (15 ژانویه)، انتقام لورونا (26 فوریه)، جن گیر: شهدا، هر چیزی جز ارواح (7 مه)، فعالیت های ماوراء الطبیعه (21 مه)، پروژه جادوگر بلر (Sept.N.2) و Sep. 12). این فهرست همچنین شامل فیلمی بود که در حال حاضر بدون عنوان برای اوت 2027 تنظیم شده است. داستان‌های مرتبط فیلم‌ها LaKeith Stanfield، بن مندلسون برای بازی در Molepeople برای Atomic Monster، Paramount Primal (انحصاری) TV Crystal Lake، کشتارهای وحشیانه‌تری نسبت به فیلم‌ها ارائه می‌دهد، در طول یک پنل به اعماق پس‌زمینه جیسون بروید، که به‌عنوان موفقیت‌آمیز برای فیلم‌های باکس آفیس بک‌روم و فیلم‌های بک‌آفیس ابی‌روم و فیلم‌های باتجربه ابداع بلوم‌هاوس عمل کرد. یکی از بنیانگذاران بلومهاوس، جیسون بلوم، آنچه را که برای استودیو در پیش است، کنایه زد. سال فوق‌العاده‌ای بود، و چیزی که در مورد فیلم‌هایی که فهرست کردید این است که چقدر متفاوت هستند. او گفت که هر کس در مورد ترسناک بودن ایده متفاوتی دارد، و این چیزی است که من در مورد ترسناک دوست دارم. ما"}, {"source": "Hollywood Reporter", "title": "‘14th’ Review: Ava DuVernay Delivers Another Essential and Compelling Constitutional Deep Dive for Netflix", "link": "https://www.hollywoodreporter.com/movies/movie-reviews/14th-review-ava-duvernay-netflix-documentary-1236726558/", "summary": "Premiering at the New York Film Festival, the filmmaker's follow-up to her '13th' tackles birthright citizenship, the Equal Protection Clause and the undoing of the gains of Reconstruction.", "date_str": "2026-10-10T01:00:00+00:00", "hash": "de6d30e35dfa07c6", "title_fa": "نقد چهاردهم: آوا دوورنی یکی دیگر از غواصی عمیق اساسی و قانع کننده را برای نتفلیکس ارائه می کند", "summary_fa": "فیلمساز که در جشنواره فیلم نیویورک به نمایش درآمد، در ادامه فیلم «سیزدهمین» خود، به حق شهروندی، بند حفاظت برابر و از بین بردن دستاوردهای بازسازی می پردازد. متن لوگو در 3 نوامبر، رای دهندگان ایالات متحده در انتخابات میان دوره ای رای خواهند داد که راه درازی برای شکل دادن یا تغییر شکل دولت ما خواهد بود. نتایج، تصویری کلیدی از نحوه نگرش کشور در حال حاضر به پرداخت بدهی برند خاص دموکراسی ما ارائه می دهد. مستند جدید Ava DuVernay برای نتفلیکس بر اصلاحیه چهاردهم قانون اساسی، تلاش‌های اخیر برای سلب قدرت اصلاحیه چهاردهم، و روش‌هایی که اصلاحیه چهاردهم تجسم و نشان‌دهنده ایده‌آل‌ها و دوام طولانی‌مدت آزمایش آمریکایی است، تمرکز دارد. داستان‌های مرتبط فیلم‌ها Ava DuVernay با یکی از سیاسی‌ترین اسناد نتفلیکس بازمی‌گردد: این فیلم فیلم‌های باسن من را زیر پا گذاشت اکنون مشخص شده است که چرا آمازون نمی‌خواست فیلم مصنوعی را منتشر کند: AF پژمرده ۱۴th The Bottom Line به روش‌های درست خشمگین و الهام‌بخش است. محل برگزاری: جشنواره فیلم نیویورک (شب پایانی) تاریخ اکران: 27 نوامبر (سینما); 4 دسامبر (نتفلیکس) کارگردان: Ava DuVernay 1 ساعت و 48 دقیقه طبیعتاً، نتفلیکس در تاریخ 27 نوامبر و قبل از پخش جریانی در 4 دسامبر، چهاردهمین فیلم را برای یک نمایش کوتاه در سینما تعیین کرده است. دنباله یا همراهی برای سیزدهمین دوره نامزدی اسکار DuVernay، این سند یک تماس قاطع و فوری است و نتفلیکس آن را مستقیماً به معادل زمان‌بندی پست صوتی ارسال می‌کند. من گیج شده‌ام، اما فکر می‌کنم کار من بررسی انتخاب‌های برنامه‌نویسی یا سیاست‌های شرکتی نیست. مانند نسخه قبلی خود، برای مدت کوتاهی با یادآوری اینکه سیزدهم جایزه اسکار را از دست داد، خشمگین شدم، تا اینکه به یاد آوردم که OJ: Made in America برنده چهاردهم شد، توسط خشم به دست آمده به دست آمده است. همچنین مانند سلف خود، بیشتر یک"}, {"source": "Hollywood Reporter", "title": "Roseanne Barr’s Self-Produced TV Series Now Courting Distributors, Co-Creator Says", "link": "https://www.hollywoodreporter.com/tv/tv-news/roseanne-barrs-indie-tv-series-distributors-co-creator-1236726679/", "summary": "Allan Stephan, a ‘Roseanne’ veteran who wrote 'Meemaw’ with the former sitcom star, says representatives for the show are in talks with a few platforms.", "date_str": "2026-10-10T00:09:26+00:00", "hash": "2a64fbfbcbd3add8", "title_fa": "یکی از خالقان می‌گوید: سریال تلویزیونی خود تولید روزان بار اکنون با توزیع‌کنندگان تماس گرفته است.", "summary_fa": "آلن استفان، کهنه سرباز «روزان» که «میما» را با ستاره سابق کمدی کمدی نوشت، می‌گوید نمایندگان سریال در حال مذاکره با چند پلتفرم هستند. به گفته یکی از خالقان این پروژه، مجموعه تلویزیونی جدید روزان بار که به‌طور مستقل تولید شده است، برای توزیع‌کنندگان خرید می‌شود و تعداد کمی از آنها مورد توجه قرار گرفته است. آلن استفان، نویسنده و تهیه کننده، روز جمعه به هالیوود ریپورتر گفت: ما در حال حاضر لقمه های زیادی داریم. نمایندگان این مجموعه کمدی که توسط استفان و بار ساخته شده و با نام میماو: افسانه‌ای مدرن ساخته شده‌اند، یک تریلر برای افراد علاقه‌مند ارسال کرده‌اند و پخش‌کننده‌ها را هدف قرار داده‌اند. استفان از پلتفرم‌های خاصی نامی نبرد اما گفت که می‌دانم [نمایندگان نمایش] در حال مذاکره با چند مکان هستند. (البته، استفان به عنوان یکی از خالقان سریال، علاقه خاصی به نمایش پروژه به عنوان مورد تقاضا دارد.) صفحه شش هالیوود روز پنجشنبه این خبر را منتشر کرد که ستاره سابق کمدی کمدی، که راه اندازی مجدد روزانش در شبکه ABC در سال 2018 لغو شد، پس از انتشار یک توییت توهین آمیز درباره مشاور سابق باراک اوباما، مشاور سابق فیلم، باراک اوباما، رئیس جمهور سابق آمریکا، لغو شد. سری. گفته می‌شود که میماو به دنبال مادرسالار (با بازی بار) یک خانواده تگزاسی از پیش‌پرده‌ها می‌رود که تلاش می‌کنند یک میتوای خفاش را برای نوه‌اش ترتیب دهند. در کنار بار، رندی کواید، دریا د ماتئو، عمر گودینگ، داگ جونز و ایندی باگ ستاره‌هایی هستند. کمدین های جان لویتز، تونی هینچکلیف و کیم کانگدون در این سریال که در آستین فیلمبرداری شده است، نقش های کوتاهی را بر عهده دارند. نویسنده و تهیه کننده کمدی آلن کاورت (معمای قتل، هشت شب دیوانه)، از همکاران قدیمی آدام سندلر، در نوشتن سریال کمک کرد."}, {"source": "Hollywood Reporter", "title": "Iliza Shlesinger and Mira Sorvino to Receive Top Honors at San Diego International Film Festival", "link": "https://www.hollywoodreporter.com/movies/movie-news/san-diego-film-festival-2026-honorees-iliza-mira-sorvino-1236726731/", "summary": "The pair, set to receive Virtuoso and Trailblazer awards, will be feted at the Night of the Stars tribute at La Jolla's Conrad Prebys Performing Arts Center on Oct. 13.", "date_str": "2026-10-09T23:07:46+00:00", "hash": "54876e9f0d5a599f", "title_fa": "ایلیزا شلسینگر و میرا سوروینو جوایز برتر جشنواره بین المللی فیلم سن دیگو را دریافت خواهند کرد.", "summary_fa": "این زوج که قرار است جوایز Virtuoso و Trailblazer را دریافت کنند، در مراسم بزرگداشت Night of the Stars در مرکز هنرهای نمایشی Conrad Prebys La Jolla در 13 اکتبر برگزار می‌شوند. ایلیزا شلسینگر و میرا سوروینو در مراسم شب ستاره‌ها از جشنواره بین‌المللی فیلم Digo در کانون توجه قرار خواهند گرفت. قرار است در اکتبر در مرکز هنرهای نمایشی کنراد پربیس لا جولا برگزار شود. در 13، این رویداد شاهد دریافت جایزه تریل‌بلیزر به شلسینگر و برنده اسکار سوروینو با جایزه ویرتئوزو خواهد بود. این دومی تمایزی است که برای قدردانی از بازیگری طراحی شده است که بازی‌های اخیرش مهارت، ظرافت و دامنه فوق‌العاده‌ای را در جشنواره نشان می‌دهد. او پس از اتمام ساخت دنباله‌ی دیدار دبیرستان رومی و میشل، به این موضوع دست می‌یابد. او سپس در مقابل جان تراولتا در فیلم Thats Amore ساخته نیک واللونگا و در مقابل فی داناوی، نیکولا پلتز بکهام و جک هیوستون در باله درام پریما بازی می کند. داستان‌های مرتبط فیلم‌ها اکنون مرا بکشید نقد و بررسی: طنز خسته‌کننده هالیوودی پر از طنز کمربند بورشت فیلم‌های طنز لیزا کودرو و میرا سوروینو رومی و میشل 2 را به D23 بیاورید: ما رسماً شاهزاده‌های دیزنی شلیگنر را دریافت خواهیم کرد. آینده صنعت سرگرمی ستاره استندآپ، که ویژه بعدی‌اش Iliza Shlesigner: A Different Animal در مارس آینده در Prime Video تعظیم می‌کند، با یک کمدی رمانتیک با عنوان تعقیب تابستان به صفحه نمایش بزرگ رفت. پس از نمایش در ساندنس، این عکس به کارگردانی ژوزفین دکر نیز برای نمایش در SDIFF انتخاب شده است."}, {"source": "Hollywood Reporter", "title": "LaKeith Stanfield, Ben Mendelsohn to Star in ‘Molepeople’ for Atomic Monster, Paramount Primal (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/lakeith-stanfield-ben-mendelsohn-molepeople-1236726689/", "summary": "Paramount has set an August 2027 release for the horror thriller, which hails from director Rob Savage.", "date_str": "2026-10-09T23:04:03+00:00", "hash": "ce1024062db28038", "title_fa": "لکیت استنفیلد، بن مندلسون برای ایفای نقش در \"Molepeople\" برای Atomic Monster، Paramount Primal (اختصاصی)", "summary_fa": "پارامونت برای اکران این فیلم ترسناک در آگوست 2027 برنامه ریزی کرده است که توسط کارگردان راب ساویج ساخته شده است. متن لوگو LaKeith Stanfield و Ben Mendelsohn قرار است در Molepeople ایفای نقش کنند، یک ویژگی ترسناک که شامل ترکیب دو نیروگاه ترسناک Blumhouse Atomic Monster و Paramount Primal است. این ویژگی توسط Blumhouse Atomic Monster و Paramount تامین مالی و تولید خواهد شد و Paramount توزیع در سراسر جهان را انجام می دهد. تاریخ انتشار 27 آگوست 2027 تعیین شده است. راب ساویج که این آخر هفته افتتاحیه «مامان دیگری» را دارد، کارگردانی این فیلم ترسناک را بر عهده خواهد داشت که فیلمنامه‌ای از ناتان الستون دارد. داستان‌های مرتبط فیلم‌ها جسیکا چستین درباره مامان دیگری که ویروسی می‌شود و دوست چالش‌برانگیز آرون سورکین در فیلم‌های ed of violinists, cellists, flautists and even an organ-payer, is packed into Studio One. The iconic room, which has hosted musical legends from Edward Elgar to Harry Styles, is painted “Toy Story” blue, a fitting color given the reason everyone is [ ]", "date_str": "2026-10-10T13:55:11+00:00", "hash": "6b290e24d7ed1147", "title_fa": "برد برد در مورد چرا «ری گان» را به جای پیکسار به اسکای دنس برد: ساخت فیلم های انیمیشن برای نوجوانان و بزرگسالان «نباید یک تصمیم بحث برانگیز باشد»", "summary_fa": "در یک بعد از ظهر آرام ماه آوریل در استودیو ابی رود لندن، یک ارکستر 74 قطعه ای متشکل از نوازندگان ویولن، ویولن سل، نوازندگان فلوت و حتی یک پرداخت کننده ارگ ​​در استودیو یک جمع می شود. اتاق نمادینی که میزبان اسطوره‌های موسیقی از ادوارد الگار تا هری استایلز بوده است، با رنگ آبی «داستان اسباب‌بازی» رنگ آمیزی شده است، رنگی مناسب با توجه به این که همه [ ] ری گان انیمیشن Skydance، به کارگردانی برد برد، در نتفلیکس نمایش داده می‌شود. (در ادامه در مورد آن بیشتر توضیح خواهیم داد)، اما یک محصول انیمیشن Skydance که در دسامبر نتفلیکس پخش خواهد شد. 18 (برای اولین بار در جشنواره فیلم BFI لندن در 10 اکتبر اکران می شود). مایکل جیاکینو، آهنگساز، همکار دیرینه برد، که در ورایتی، کارگردانی ارکستر در ابی رود محبوب است. ری گان ششمین پروژه مشترک دو نفره از زمان اولین همکاری با The Incredibles در سال 2004 است و یکی از Giacchino (برنده جایزه اسکار برای Pixar s Up در سال 2010) بیش از دو دهه فرصت داشته تا برای آن آماده شود. چند ماه بعد وقتی صحبت می کنیم، آهنگساز فاش می کند که در جریان The Incredibles درباره این فیلم صحبت کردیم. من مدت زیادی است که در این مورد می دانم. با توجه به نقش کلیدی موسیقی در فیلم، برد برای اولین بار پس از شنیدن آهنگ B-52s Planet Claire، ایده یک کارآگاهی نوآر را در آینده ای به سبک جتسون ها برای ری گان تصور کرد. برد در مصاحبه ای یک روز قبل از اکران فیلم می گوید برای Bird، این لحن شبیه به تلفیق آهنگ موضوعی با سریال پلیسی دهه 1960 پیتر گان و یک فیلم علمی تخیلی هیولاهای دهه 50 بود. رفتم، این پیتر گان نیست. این چیه؟ و سپس من رفتم، Ray-Gun است. و بعد رفتم، ری"}, {"source": "Variety", "ti ی بین المللی، در میان دیگر سریال های موفق جهانی شناخته شده است. به گفته Ay Yapim، ukur که در بازارهای بین‌المللی به گودال معروف است، از سال 2017 تا کنون از تلویزیون رایگان در 105 کشور پخش شده است. این شرکت تاکید کرد که کانال رسمی یوتیوب نمایش از 6.4 میلیارد بازدید تجمعی فراتر رفته است. این فیلم به‌جای مرور مجدد این مجموعه، فصل جدیدی را در دنیای خود باز می‌کند که بر اساس ریشه‌های وارتولو ساخته شده و بر اساس کاتالوگ آی یاپیم ساخته شده است. در بیانیه اشاره شده است که تیم خلاق AI Yap m این فیلم را رهبری می کند و هوش مصنوعی در هسته تولید آن قرار دارد. در حالی که اوکور اصلی از خانواده کو اوال و محله استانبول تحت کنترل آن پیروی می کند، جایی که وفاداری خانواده با دنیای جنایتکار تلاقی می کند، فرعی به دوران کودکی و انتخاب هایی تبدیل می شود که وارتولو سادتین، که پسر نامشروع خانواده کو بیضی است، شکل می گیرد. در خلاصه داستان این فیلم آمده است: پس از از"}, {"source": "Variety", "title": "‘Under Siege,’ Netflix’s Second Most Ambitious Colombian Series – a ‘Huge Undertaking Even by Our Standards’ – Bows Nov. 6", "link": "https://variety.com/2026/film/global/under-siege-netflix-second-most-ambitious-series-bows-nov-6-1236906083/", "summary": "“Under Siege” (“Palacio”) the fictional series inspired by the storming of Colombia’s Palace of Justice by an M-19 guerrilla commando and its subsequent retaking by the Colombian army, bows Nov. 6 on Netflix. The events, which unfolded in the capital of Bogotá on Nov. 6 and 7, 1985, is recounted in the eight-part series directed [ ]", "date_str": "2026-10-10T12:42:59+00:00", "hash": "1d6196fd775c67e7", "title_fa": "«در محاصره»، دومین سریال کلمبیایی بلندپروازانه نتفلیکس - یک «تعهد بزرگ حتی بر اساس معیارهای ما» - Bows 6 نوامبر", "summary_fa": "«در محاصره» («Palacio») مجموعه داستانی با الهام از یورش به کاخ عدالت کلمبیا توسط یک کماندوی چریکی M-19 و بازپس گیری آن توسط ارتش کلمبیا، در 6 نوامبر در نتفلیکس تعظیم می کند. رویدادهایی که در ماه نوامبر در پایتخت بوگوتا رخ داد. 6 و 7، 1985، در مجموعه هشت قسمتی به کارگردانی [ ] با بازیگرانی از جمله ناتالیا ری     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
