a801d9028c1", "title_fa": "ایلان ماسک حمله به آمبانی را به دلیل تاخیر در راه اندازی استارلینک هند تشدید کرد", "summary_fa": "ایلان ماسک، میلیاردر هندی موکش آمبانی را به جلوگیری از رقابت متهم کرده است. در حالی که اسپیس ایکس در تلاش برای پرتاب استارلینک در هند است، ایلان ماسک حملات خود را به میلیاردر موکش آمبانی افزایش داده و با تمسخر او را نخست‌وزیر کشور می‌خواند تا به او پیشنهاد کند که کنترل بیش از حد بر دولت خود دارد و او را متهم به جلوگیری از رقابت سرویس اینترنت ماهواره‌ای کرده است. روز جمعه، ماسک در پستی در X به انتقاد خود از رئیس مشهور صنایع Reliance ادامه داد و استدلال کرد که Starlink می‌تواند دسترسی به اینترنت را به مناطقی که متصل باقی می‌مانند بیاورد، به کودکان فرصت‌های بیشتری برای یادگیری می‌دهد و به کسب‌وکارهای کوچک کمک می‌کند تا به مشتریان در سراسر جهان دسترسی پیدا کنند. به طور طبیعی، شما ترجیح می‌دهید استثمار انحصاری خود از مردم بزرگ هند را حفظ کنید، اما آیا با این وجود به استارلینک اجازه رقابت می‌دهید؟ ماسک نوشت. Reliance Jio، بازوی مخابراتی Reliance Industries، بلافاصله به درخواست اظهار نظر پاسخ نداد. آخرین اظهارات ماسک به دنبال اتهامات او در اوایل این هفته مبنی بر اینکه الیگارشی‌های ناشناس از راه‌اندازی Starlink در هند جلوگیری کرده‌اند تا از منافع تجاری خود محافظت کنند، دنبال می‌شود. وزارت ارتباطات هند این اتهامات را رد کرد و گفت که چارچوب قانونی این کشور برای ارتباطات ماهواره ای منصفانه و بدون تبعیض است. ماسک سپس روز پنجشنبه فراتر رفت و نفوذ آمبانی را در یک پست جداگانه در X زیر سوال برد. آیا آمبانی رئیس واقعی هند است؟ او پرسید. اسپیس ایکس سال ها تلاش کرده است تا Starlink را در هند پرتاب کند. سال گذشته، حتی با آمبانی Reliance Jio و Bharti Airtel، دومین اپراتور بزرگ مخابراتی هند، قراردادهای توزیع منعقد کرد تا پس از دریافت تاییدیه های لازم، این سرویس را ارائه دهد. با این"}, {"source": "TechCrunch Main", "title": "Long live the mechanical keyboard", "link": "https://techcrunch.com/2026/10/09/long-live-the-mechanical-keyboard/", "summary": "Keychron made a name for itself after launching on Kickstarter in 2017. Today, it offers the value K2 model as well as a variety of other versions, including one with an all-wood body.", "date_str": "2026-10-09T22:08:24+00:00", "hash": "ecb1a3e44c1bd697", "title_fa": "زنده باد کیبورد مکانیکی", "summary_fa": "Keychron پس از راه‌اندازی در Kickstarter در سال 2017، نامی برای خود دست و پا کرد. امروزه، مدل K2 و انواع نسخه‌های دیگر از جمله نسخه‌ای با بدنه تمام چوب را ارائه می‌کند. برای یک نویسنده، صفحه کلید مکانیکی چیز زیبایی است. مطمئناً برای همه ضروری نیست، اما یک صفحه کلید مکانیکی با طراحی خوب می تواند یک روز خسته کننده از تایپ کردن را به یک تجربه زیبا از نظر زیبایی تبدیل کند. با توجه به اینکه بیشتر روزهای من شامل ساعت ها نشستن پشت میز است، داشتن صفحه کلیدی که از استفاده از آن لذت می برم یک ضرورت است. من برای اولین بار حدود دو سال پیش یک صفحه کلید مکانیکی گرفتم - Keychron K2 - و هرگز به عقب نگاه نکردم. Keychron یکی از برجسته ترین برندها در صنعت صفحه کلید مکانیکی است که پس از راه اندازی اولیه از طریق Kickstarter در سال 2017، نام خود را به دست آورد. این شرکت از آن زمان تاکنون ده ها صفحه کلید مختلف (و همچنین صفحه کلید) و انواع مدل های ماوس تولید کرده است. برخلاف سایر لوازم الکترونیکی، داشتن صفحه کلید مکانیکی زیاد نیست. سادگی بخشی از جذابیت است. آنها را از جعبه خارج می کنید، آنها را تنظیم می کنید (K2 دارای پایه های شیب کمی است که به شما زاویه کمی بهتری برای تایپ می دهد) و آنها را وصل می کنید. از اینجا، چند گزینه مختلف دارید. K2 با یک کابل USB ساده ارائه می شود، اما گزینه ای برای اتصال بلوتوث نیز وجود دارد. اگر برای یک فضای کاری تمیز و مینیمالیستی ارزش قائل هستید، احتمالاً بلوتوث بهترین راه است. در حالی که من به Keychron K2 قدیمی خود وفادار هستم، چند نسخه ارتقا یافته و جدیدتر وجود دارد که باید در نظر بگیرم. Keychron در دو سال گذشته مدل‌های جدید مختلفی"}, {"source": "TechCrunch Main", "title": "Batteries are now cheaper than natural gas turbines used at many data centers", "link": "https://techcrunch.com/2026/10/09/batteries-are-now-cheaper-than-natural-gas-turbines-used-at-many-data-centers/", "summary": "Batteries are now cheaper than natural gas turbines as the data center boom pushes prices up.", "date_str": "2026-10-09T18:57:58+00:00", "hash": "a4a86e25e2eb1545", "title_fa": "باتری ها در حال حاضر ارزان تر از توربین های گاز طبیعی مورد استفاده در بسیاری از مراکز داده هستند", "summary_fa": "باتری‌ها اکنون ارزان‌تر از توربین‌های گاز طبیعی هستند زیرا رونق مرکز داده قیمت‌ها را بالا می‌برد. طبق گزارش جدید Wood Mackenzie، ذخیره باتری اکنون ارزان تر از یک نوع نیروگاه گاز طبیعی است که مورد علاقه بسیاری از توسعه دهندگان مرکز داده است. در هر قاره و در هر یک از 43 بازاری که وود مکنزی بررسی کرد، باتری‌های چهار ساعته ارزان‌تر از توربین‌های گازی چرخه باز بودند. این مشاوره پیش‌بینی می‌کند که هزینه برق باتری‌ها به کاهش ادامه خواهد داد در حالی که الکترون‌های توربین‌های گازی در دهه‌های آینده گران‌تر خواهند شد. این گزارش در حالی منتشر می‌شود که قیمت انرژی در ایالات متحده و سایر نقاط جهان همچنان در حال افزایش است و به دلیل افزایش تقاضای برق توسط مراکز داده، به تورم دامن می‌زند. قیمت توربین‌های گازی توسط توسعه‌دهندگان مرکز داده هوش مصنوعی افزایش یافته است، که هر مدلی را که به دستشان برسد می‌خرند. این اثرات برای توربین‌های گازی چرخه باز، که به آسانی در دسترس هستند، اما کارآمدتر و هزینه بیشتری برای کارکردن دارند، شدیدتر بوده است. این توربین‌ها اغلب توسط شرکت‌های برق به‌عنوان نیروگاه‌های اوج استفاده می‌شوند که برای تولید برق در دوره‌های پر تقاضا وارد عمل می‌شوند. همانطور که قیمت این توربین ها افزایش می یابد، می تواند هزینه های آب و برق را نیز افزایش دهد. ساخت توربین‌های چرخه باز ساده‌تر از توربین‌های چرخه بسته است، اما حتی اکنون دو تا چهار سال طول می‌کشد تا تهیه شوند. لیست انتظار برای توربین های سیکل بسته اکنون تا اوایل دهه 2030 گسترش یافته است. هر دو عقب ماندگی قیمت تمام نیروگاه های گاز طبیعی جدید را افزایش داده است. این مورد برای هر فناوری تولید کننده ای نیست. اکنون در نظرسنجی Wood Mackenzie، خورشیدی ارزان‌ترین شکل برق جدید در هر بازار است."}, {"source": "TechCrunch Main", "title": "LumenUs helps automate tedious paperwork in times of grief", "link": "https://techcrunch.com/2026/10/09/lumenus-helps-automate-tedious-paperwork-in-times-of-grief/", "summary": "\"The day your loved one passes away, you also get this honorary badge of a project manager for a project you had no idea about,\" said founder Sara Tashakorinia.", "date_str": "2026-10-09T17:00:00+00:00", "hash": "6e720b480bf8ecfb", "title_fa": "LumenUs به خودکارسازی کاغذبازی های خسته کننده در مواقع غم و اندوه کمک می کند", "summary_fa": "سارا تاشاکوری نیا، بنیانگذار این پروژه، گفت: «روزی که عزیزتان درگذشت، نشان افتخاری یک مدیر پروژه را برای پروژه‌ای که هیچ اطلاعی از آن نداشتید، دریافت می‌کنید. وقتی شوهر سارا تاشاکورینیا هشت سال پیش در یک تصادف رانندگی درگذشت، آخرین چیزی که او به آن نیاز داشت، تقریباً 570 ساعت کاغذبازی بود که به طور متوسط ​​برای حل و فصل امور یکی از عزیزانش نیاز داشت. اما برای میلیون‌ها نفر هر سال، این واقعیت آنهاست: یک ضایعه مهیب و به دنبال آن یک بهمن بی‌روح و پیش پا افتاده از کارهای اداری خسته کننده. پس از سال‌ها داوطلب شدن برای کمک به دیگران در جهت‌یابی آنچه باید به تنهایی یاد بگیرد، به ذهن تاشاکورینیا رسید که هوش مصنوعی ممکن است بتواند نه با تجربه پیچیده و آشفته سوگواری و درمان، بلکه با کمترین بخش‌های انسانی فرآیند، مانند یافتن فرم‌های مالیاتی مناسب، تشکیل پرونده‌های بیمه، و بستن حساب‌های بانکی کمک کند. نتیجه LumenUs است، پلت فرم مراقبت از غم و اندوه که تاشاکورینیا سال گذشته برای رهایی از بار اداری خانواده های عزادار تاسیس کرد. فکر می‌کنم با گذشتن از آن، آستانه درد شما آنقدر بالاست، و آنقدر گم شده‌اید که واقعاً نمی‌دانید، چرا مردم با شما اینطور رفتار می‌کنند؟ چرا من با انبوهی از مدارک باقی مانده بودم، و چرا خانه تشییع جنازه از من 300٪ نشانه گذاری روی تابوت دریافت می کرد؟ تاشاکوری نیا گفت. در حالی که تاشاکورینیا امیدوار است که LumenUs در نهایت از مردم در طول فرآیند سوگواری مادام العمر پشتیبانی کند، این استارتاپ در ابتدا بر روی افراد بلافاصله پس از مرگ تمرکز خواهد کرد. هنگامی که افراد در ابتدا به پلتفرم می‌پیوندند، فرآیندی را طی می‌کنند که در آن اطلاعاتی درباره ماهیت موقعیت خاص خود به اشتراک می‌گذارند."}, {"source": "TechCrunch Main", "title": "Tesla renames ‘Full Self-Driving’ to ‘Tesla Assisted Driving’ in Europe", "link": "https://techcrunch.com/2026/10/09/tesla-renames-full-self-driving-to-tesla-assisted-driving-in-europe/", "summary": "The name change is enough for Germany's transport minister to start advocating for Europe-wide adoption of the driver assistance software.", "date_str": "2026-10-09T16:07:26+00:00", "hash": "3060f6f4d586a58f", "title_fa": "تسلا نام «خودرانی کامل» را به «رانندگی با کمک تسلا» در اروپا تغییر داد", "summary_fa": "تغییر نام برای وزیر حمل و نقل آلمان کافی است تا از پذیرش نرم افزار کمک راننده در سراسر اروپا حمایت کند. تسلا پس از واکنش وزارت حمل و نقل آلمان، نام سیستم کمک راننده پیشرفته خود را در اروپا تغییر داد. اکنون به جای رانندگی با کمک کامل تسلا (Supervised) نامیده می شود. این یک تسلیم بزرگ از سوی تسلا است، که سال‌ها از نام کامل خودرانی (نظارت‌شده) استفاده می‌کند، علی‌رغم اینکه سیستمی که از انسان می‌خواهد به جاده توجه کند و در صورت لزوم کنترل آن را به دست بگیرد. اما تغییر نام می‌تواند به تسلا کمک کند تا به هدف خود برای پذیرش گسترده‌تر در این قاره دست یابد، که می‌تواند یک جریان بالقوه عظیم درآمد جدید را برای شرکت باز کند. وزیر حمل و نقل آلمان، استفن بیلگر، اوایل این ماه گفت که نامیدن این نرم افزار Full Self-Driving تا حدودی گمراه کننده است، زیرا تمام وظیفه رانندگی را انجام نمی دهد. او ماه گذشته با تسلا صحبت کرد و طبق اعلام رسمی این وزارتخانه، این شرکت تغییر نام را پیشنهاد کرد. بیلگر گفت که او اکنون از تصویب رانندگی با کمک تسلا در سراسر اروپا پیش از رای گیری در سراسر اتحادیه اروپا که ممکن است اواخر امسال برگزار شود، حمایت خواهد کرد. ایلان ماسک، مدیرعامل تسلا، این هفته از بیلگر در X تشکر کرد. ماسک سال‌ها در تلاش برای تایید کامل خودران (Supervised) یا FSD در اروپا بوده است. او در ژوئن 2025 در X نوشت: FSD در اروپا جان افراد داخل خودرو و همچنین کاربران آسیب پذیر جاده مانند عابران پیاده، دوچرخه سواران و حیوانات خانگی را نجات می دهد. لطفاً به دولت خود اطلاع دهید که تأیید می خواهید. در مارس سال جاری، او نوشت که بار نظارتی شدید اتحادیه اروپا، نوآوری در اروپا را خفه می کند، و افزود که اروپا"}, {"source": "TechCrunch Main", "title": "Remember Orkut? Its founder wants to bring it back", "link": "https://techcrunch.com/2026/10/09/remember-orkut-its-founder-wants-to-bring-it-back/", "summary": "Orkut's founder is now taking aim at algorithms and AI-generated content.", "date_str": "2026-10-09T15:56:15+00:00", "hash": "f5fe70b620496382", "title_fa": "Orkut را به خاطر دارید؟ بنیانگذار آن می خواهد آن را بازگرداند", "summary_fa": "موسس Orkut اکنون الگوریتم ها و محتوای تولید شده توسط هوش مصنوعی را هدف قرار داده است. اورکات، پلتفرم شبکه اجتماعی که زمانی محبوب بود و بیش از یک دهه پیش تعطیل شد، ممکن است سرانجام در حال بازگشت باشد، زیرا بنیانگذار آن از کاربران خواسته است تا با تمرکز دوباره بر دوستی، اجتماع و ارتباط انسانی به احیای آن کمک کنند. در پستی در روز پنجشنبه، Orkut Büyükkökten، بنیانگذار این شبکه اجتماعی همنام، از کاربران خواست که از Orkut.com بازدید کنند و نام خود را برای حمایت از بازگرداندن آن اضافه کنند، و همچنین دیگران را برای پیوستن به آن دعوت کنند. Orkut اولین بار در سال 2004 به عنوان یک پروژه جانبی توسط Büyükkökten، 51 ساله، زمانی که او در گوگل بود، شروع به کار کرد. این شبکه اجتماعی در هند و برزیل بسیار محبوب شد اما بعداً جایگاه خود را به فیس بوک از دست داد. سرانجام گوگل در سپتامبر 2014 آن را تعطیل کرد و تمرکز خود را به پلتفرم های دیگر از جمله Google+ و YouTube تغییر داد. در نامه‌ای که در Orkut.com منتشر شد، Büyükkökten از چگونگی تکامل رسانه‌های اجتماعی در دو دهه گذشته، به ویژه نفوذ رو به رشد الگوریتم‌ها و محتوای تولید شده توسط هوش مصنوعی انتقاد کرد. او نوشت: هوش مصنوعی فناوری خارق‌العاده‌ای است، اما در حال از بین بردن یک فرضیه است که شبکه‌های اجتماعی را خاص و ارزش ساختن می‌کرد: اینکه فردی در طرف دیگر وجود دارد. من می دانم چگونه به آنجا برسم: ما اینترنت را که ابتدا دوست داشتیم بازسازی می کنیم. Büyükkökten افزود: کسی که افراد معتبر، ارتباط واقعی و تعلق واقعی دارد. این اولین بار نیست که Büyükkökten بازگشت به شبکه های اجتماعی را بررسی می کند. در سال 2016، دو سال پس از تعطیلی Orkut، او شبکه اجتماعی دیگری به نام Hello را راه‌اندازی"}, {"source": "TechCrunch Main", "title": "Automattic interim CFO resigns just weeks after boardroom shakeup", "link": "https://techcrunch.com/2026/10/09/automattic-loses-its-interim-cfo-just-weeks-after-boardroom-shakeup/", "summary": "Automattic's interim chief financial officer Jeremy Klaperman has left the company less than a month after taking the role, TechCrunch has learned. Sources say his departure followed a demotion back to his previous position, marking another executive exit amid the organization's leadership turmoil.", "date_str": "2026-10-09T15:02:30+00:00", "hash": "7e32c4d056aa8e3a", "title_fa": "مدیر مالی موقت موقت Automattic تنها چند هفته پس از تغییر اتاق هیئت مدیره استعفا داد", "summary_fa": "TechCrunch دریافته است که جرمی کلاپرمن، مدیر مالی موقت Automattic، کمتر از یک ماه پس از این سمت، شرکت را ترک کرده است. منابع می گویند که جدایی او به دنبال تنزل رتبه به سمت قبلی خود بود که نشان دهنده یک خروج اجرایی دیگر در میان آشفتگی رهبری سازمان بود. به گزارش TechCrunch، جرمی کلاپرمن، مدیر مالی موقت Automattic پس از کمتر از یک ماه، سمت خود را ترک کرد. کلاپرمن ماه گذشته پس از بحران حاکمیتی در شرکت مادر WordPress.com که کل هیئت مدیره آن را ترک کرد یا اخراج کرد، به شغل جدید ارتقا یافت. این شرکت با بیانیه زیر که توسط مدیر ارتباطات Automattic مگان فاکس به اشتراک گذاشته شد، خروج را تایید کرد: Automattic همیشه از رهبری جرمی کلاپرمن سپاسگزار خواهد بود. برای او در تلاش بعدی آرزوی موفقیت داریم. کلاپرمن قبل از خدمت به عنوان مدیر مالی موقت سازمان، به عنوان مدیر مالی واحد تجاری شرکت VIP Automattic خدمت کرده بود. او قرار بود جایگزین مدیر مالی سابق، مارک دیویس شود، که برای مدت کوتاهی پس از رأی اعضای هیئت مدیره شرکت به مرخصی دادن مت مولنوگ، مدیر عامل شرکت در ماه سپتامبر، مدیر مالی شرکت Automattic شده بود. در عرض 33 ساعت پس از تصمیم هیئت مدیره، مولنوگ دوباره نقش مدیر عامل را بر عهده گرفت و هیئت مدیره پاک شد. اندی میسان، مدیر ارشد حقوقی Automattic نیز در کنار دیویس شرکت را ترک کرده بود. TechCrunch پیش از این گزارش داده بود که هر دو مدیر در طول مرخصی کوتاه Mullenweg قراردادهای جدایی متقابل امضا کرده بودند. هیئت مدیره جدید Automattic در اواخر سپتامبر معرفی شد و شامل هیو هوی نویسنده پرفروش داستان های علمی تخیلی است. دو نفر از بنیانگذاران برنامه اجتماعی منقرض شده IRL، هنری خاچاتریان و کروتال دسای. به علاوه نویسنده امی چان."}, {"source": "TechCrunch Main", "title": "Beyond TechCrunch Disrupt 2026: The Side Events, Parties & Networking You Can’t Miss", "link": "https://techcrunch.com/2026/10/09/beyond-techcrunch-disrupt-2026-the-side-events-parties-networking-you-cant-miss/", "summary": "TechCrunch Disrupt 2026 is just the beginning. From exclusive networking events and startup showcases to happy hours, dinners, and after-hours meetups, discover what’s happening across San Francisco during Disrupt Week, October 10–16. Find your next connection, your next opportunity, or your next favorite event.", "date_str": "2026-10-09T14:42:34+00:00", "hash": "19de58ba176397d0", "title_fa": "Beyond TechCrunch Disrupt 2026: رویدادهای جانبی، مهمانی ها و شبکه هایی که نمی توانید از دست بدهید", "summary_fa": "در طول هفته اختلال، استارت‌آپ‌ها و سازمان‌ها از سراسر اکوسیستم فناوری جهانی میزبان رویدادهای شبکه‌ای، ساعات شاد، نمایشگاه‌ها، دموها، شام‌ها و موارد دیگر خواهند بود. این چیزی است که از شنبه، 10 اکتبر تا جمعه، 16 اکتبر در اطراف سانفرانسیسکو اتفاق می افتد. به میزبانی آژانس سرمایه گذاری و تجارت لهستان (PAIH) و صندوق سیلسیا بالا میزبانی شده توسط Innovation کل کنسولگری نروژ سلطنتی نروژ در سانفرانسیسکو شبی با فین تک، رشد جهانی، و گفتگوهای عالی، جشن انتخاب آپارتا برای TechCrunch Startup Battlefield 200. میزبانی شده توسط پاکستان. کسب‌وکارها، رهبران صنعت، سرمایه‌گذاران، شرکا و ذینفعان اکوسیستم برای کشف فرصت‌ها برای همکاری تجاری، مشارکت‌های فناوری، برون‌سپاری، سرمایه‌گذاری و گسترش بازار. بیاموزید که چگونه از تفکر اصول اولیه برای کشف نیازهای نادیده گرفته شده مشتری، متمایز کردن محصول خود، تقویت تناسب محصول با بازار، و شناسایی فرصت ها برای رشد قابل توجه از طریق یک مطالعه موردی در دنیای واقعی استفاده کنید. با AI Barmen آشنا شوید، یک متصدی بار روباتیک که کوکتل‌ها و ماکت‌های شخصی‌سازی شده را از طریق یک تجربه ساعت خوش تعاملی ایجاد می‌کند. ده استارت‌آپ در مراحل اولیه محصولات و رقابت‌های خود را در اختیار گروهی از سرمایه‌گذاران مخاطره‌آمیز قرار می‌دهند و پس از آن یک شبکه باز پس از مهمانی برگزار می‌شود. برای شبی پر از غذا، نوشیدنی و شبکه ای که برای ایجاد روابط تجاری بهتر طراحی شده است، به یک جامعه بین المللی استارتاپ بپیوندید. صرافی مشارکت یک شب را برای بنیان‌گذارانی که می‌دانند مشارکت‌ها باعث رشد می‌شوند، تبدیل می‌شود. با شرکت خود وارد شوید، با یک لیست واقعی از آن خارج شوید. تیم onSpark Hit List Live را در محل اجرا می‌کند و شرکای دقیقی را که می‌توانند درآمد شما را در سال جاری منتقل کنند، ترسیم می‌کند، سپس شما را با بنیان‌گذاران اتاق که در لیست‌های یکدیگر قرار دارند، مطابقت می‌دهد."}, {"source": "Ars Technica", "title": "One with the world? A new look at brains transformed by psychedelics.", "link": "https://arstechnica.com/science/2026/10/the-psychedelic-brain-looks-like-chaos-underneath-theres-order/", "summary": "For about a decade, the mainstream understanding has been that psychedelics cause chaos in the brain. Brain networks—the stable patterns of communication that handle vision, attention, or our sense of self, and more—loosen and start talking to each other all at once. EEG traces get noisier and more complex. “Think of the networks of the brain as highways,” says Devon Stoliker, a neuroscientist at Monash University. “Under psychedelics, these highways break down into many different directions.” In a recent Nature study, Stoliker’s team designed an experiment to test whether these directions are truly chaotic and random. Researchers gathered 62 people who had never taken a psychedelic before, gave them 19 milligrams of psilocybin, a common psychedelic found in certain fungi, and scanned their brains. Then, they used AI to analyze the drugged and sober brain scans. What emerged was not exactly chaos. An uninterrupted trip Stoliker thinks chaos is not a satisfactory explanation for psychedelics’ effect on the brain. “It never really explained why an individual would have a meaningful experience, why they might have insight, why they might experience clarity, and why these might translate into positive psychological changes,” Stoliker says. To investigate if there are other explanations, he and his colleagues designed a study called PsiConnect. Read full article Comments", "date_str": "2026-10-10T11:15:35+00:00", "hash": "209575deef40e23c", "title_fa": "یکی با دنیا؟ نگاهی جدید به مغزهایی که توسط داروهای روانگردان دگرگون شده اند.", "summary_fa": "برای حدود یک دهه، درک جریان اصلی این بوده است که روانگردان ها باعث هرج و مرج در مغز می شوند. شبکه‌های مغزی - الگوهای پایدار ارتباطی که بینایی، توجه یا احساس ما از خود و موارد دیگر را کنترل می‌کنند - شل می‌شوند و به یکباره شروع به صحبت با یکدیگر می‌کنند. ردپای EEG نویزتر و پیچیده تر می شود. دوون استولیکر، عصب شناس دانشگاه موناش، می گوید: «شبکه های مغز را مانند بزرگراه ها در نظر بگیرید. تحت داروهای روانگردان، این بزرگراه ها به جهات مختلف تجزیه می شوند. در یک مطالعه اخیر در Nature، تیم Stoliker آزمایشی را برای آزمایش اینکه آیا این جهت‌ها واقعاً آشفته و تصادفی هستند طراحی کردند. محققان 62 نفر را که قبلاً هرگز داروی روانگردان مصرف نکرده بودند جمع آوری کردند، به آنها 19 میلی گرم سیلوسایبین، یک روانگردان معمولی که در برخی قارچ ها یافت می شود، دادند و مغز آنها را اسکن کردند. سپس، آنها از هوش مصنوعی برای تجزیه و تحلیل اسکن‌های مغزی دارودار و هوشیار استفاده کردند. آنچه ظاهر شد دقیقاً هرج و مرج نبود. سفری بدون وقفه استولیکر فکر می‌کند که آشوب توضیح رضایت‌بخشی برای تأثیر روان‌گردان‌ها بر مغز نیست. استولیکر می‌گوید: «هیچ‌وقت واقعاً توضیح داده نشد که چرا یک فرد تجربه‌ای معنادار دارد، چرا ممکن است بینش داشته باشد، چرا ممکن است وضوح را تجربه کند، و چرا اینها ممکن است به تغییرات روان‌شناختی مثبت تبدیل شوند. برای بررسی اینکه آیا توضیحات دیگری وجود دارد، او و همکارانش مطالعه ای به نام PsiConnect طراحی کردند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش حدود یک دهه است که درک جریان اصلی این بوده است که روانگردان ها باعث هرج و مرج در مغز می"}, {"source": "Ars Technica", "title": "Neanderthal wooden tools from Spain found preserved in stone", "link": "https://arstechnica.com/science/2026/10/neanderthal-wooden-tools-from-spain-found-preserved-in-stone/", "summary": "The Stone Age owes its name to tools that survived to our time. The material early humans worked with most, though, was probably wood because it is so much easier to process. Unfortunately, we know very little about Paleolithic woodwork because wood rots relatively quickly. But at Abric Romaní, a rock shelter in Capellades, west of Barcelona, mineral-rich water coated wooden Neanderthal tools in a limestone-like crust. When wood rotted away, it left behind hollow molds that faithfully reflect its shape. In a recent Science Advances study, a team of Spanish archaeologists has cataloged 597 wooden remains from Neanderthal living areas dating from 62,000 to 40,000 years ago. They found spears, digging sticks, bark trays, parts of shelters, and a club unlike anything seen before, suggesting Neanderthals were likely much more than just Homo sapiens’ dumber cousins. Beyond hunting gear The oldest wooden artifacts we have are mostly weapons. They include spears from a German town called Schöningen, a spear tip from Clacton-on-Sea in England, and the spear found alongside an elephant skeleton in Lehringen, Germany. Most came from waterlogged sediments, where a lack of oxygen slowed decay. Read full article Comments", "date_str": "2026-10-09T22:34:03+00:00", "hash": "972433adeaf697ca", "title_fa": "ابزارهای چوبی نئاندرتال از اسپانیا که در سنگ حفظ شده اند", "summary_fa": "عصر حجر نام خود را مدیون ابزارهایی است که تا زمان ما باقی مانده است. ماده‌ای که انسان‌های اولیه با بیشتر آنها کار می‌کردند، احتمالاً چوب بود، زیرا پردازش آن بسیار آسان‌تر است. متأسفانه، ما اطلاعات کمی در مورد کارهای چوبی دوره پارینه سنگی داریم زیرا چوب نسبتاً سریع پوسیده می شود. اما در Abric Romaní، پناهگاه صخره‌ای در Capellades، در غرب بارسلونا، آب غنی از مواد معدنی ابزارهای چوبی نئاندرتال را در پوسته‌ای مانند سنگ آهک پوشانده است. زمانی که چوب پوسیده شد، قالب های توخالی را پشت سر گذاشت که شکل آن را به درستی منعکس می کرد. در مطالعه اخیر Science Advances، تیمی از باستان شناسان اسپانیایی 597 بقایای چوبی از مناطق زندگی نئاندرتال ها را فهرست کرده اند که مربوط به 62000 تا 40000 سال پیش است. آنها نیزه‌ها، چوب‌های حفاری، سینی‌های پوست، بخش‌هایی از پناهگاه‌ها و کلوپی را پیدا کردند که شبیه هر چیزی که قبلاً دیده نشده بود، نشان می‌دهد که نئاندرتال‌ها احتمالاً خیلی بیشتر از عموزاده‌های احمق انسان‌ها هستند. فراتر از وسایل شکار قدیمی ترین مصنوعات چوبی که ما داریم عمدتاً سلاح هستند. آنها شامل نیزه‌هایی از یک شهر آلمانی به نام شونینگن، نوک نیزه‌ای از Clacton-on-Sea در انگلستان، و نیزه‌ای که در کنار اسکلت فیل در Lehringen، آلمان یافت شده است. بیشتر آنها از رسوبات غرقاب ناشی می شوند، جایی که کمبود اکسیژن باعث کند شدن پوسیدگی می شود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش عصر حجر نام خود را مدیون ابزارهایی است که تا زمان ما باقی مانده است. ماده‌ای که انسان‌های اولیه با بیشتر آنها کار می‌کردند، احتمالاً چوب بود، زیرا پردازش آن بسیار آسان‌تر است. متأسفانه، ما اطلاعات کمی در مورد کارهای چوبی دوره پارینه"}, {"source": "Ars Technica", "title": "Ukraine’s drones knock out AI data center belonging to \"Russia’s Google\"", "link": "https://arstechnica.com/gadgets/2026/10/ukraines-drones-knock-out-ai-data-center-belonging-to-russias-google/", "summary": "Ukrainian drone strikes have knocked out two of five data centers belonging to the Russian tech giant Yandex. The damage has left Yandex, known as “Russia’s Google” because it operates the country’s most popular search engine, struggling to maintain its AI chatbot and other online services. The Ukrainian drones struck Yandex data centers in the Sasovo and Kaluga regions of Russia on October 8 and October 9, according to Reuters . Those actions came as a direct response to a Russian drone strike campaign targeting Ukraine’s data centers , which has disrupted mobile phone and Internet services for thousands of Ukrainians since late September. “We continue to respond to Russia’s attacks on Ukraine, and we’re doing so with high precision,” said Ukrainian President Volodymyr Zelenskyy in a post on X. “Another data center was hit as well—our symmetrical response.” Read full article Comments", "date_str": "2026-10-09T22:04:07+00:00", "hash": "bf7e092e61b00e9b", "title_fa": "پهپادهای اوکراین مرکز داده های هوش مصنوعی متعلق به \"گوگل روسیه\" را منهدم کردند.", "summary_fa": "حملات پهپادهای اوکراینی دو مرکز از پنج مرکز داده متعلق به غول فناوری روسی یاندکس را نابود کرده است. این آسیب باعث شده تا Yandex، معروف به \"Google روسیه\"، به دلیل اینکه محبوب ترین موتور جستجوی کشور را اداره می کند، در تلاش برای حفظ چت ربات هوش مصنوعی و سایر خدمات آنلاین خود است. به گزارش رویترز، پهپادهای اوکراینی در 8 و 9 اکتبر به مراکز داده Yandex در مناطق ساسوو و کالوگا روسیه حمله کردند. این اقدامات به عنوان پاسخی مستقیم به کمپین حمله هواپیماهای بدون سرنشین روسیه با هدف قرار دادن مراکز داده اوکراین انجام شد که از اواخر سپتامبر خدمات تلفن همراه و اینترنت هزاران اوکراینی را مختل کرده است. ولودیمیر زلنسکی، رئیس جمهور اوکراین در پستی در شبکه X گفت: ما به حملات روسیه به اوکراین پاسخ می دهیم و این کار را با دقت بالایی انجام می دهیم. \"یک مرکز داده دیگر نیز مورد اصابت قرار گرفت - پاسخ متقارن ما.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید حملات هواپیماهای بدون سرنشین اوکراینی به حداقل رساندن، دو مرکز از پنج مرکز داده متعلق به غول فناوری روسی Yandex را نابود کرده اند. این آسیب باعث شده تا Yandex، معروف به \"Google روسیه\"، به دلیل اینکه محبوب ترین موتور جستجوی کشور را اداره می کند، در تلاش برای حفظ چت ربات هوش مصنوعی و سایر خدمات آنلاین خود است. به گزارش رویترز، شرکت اوکراینی فایرپوینت اعلام کرد که پهپادهای تهاجمی یک طرفه FP-1 آن در آخرین حمله به مرکز داده کالوگا که بزرگترین تأسیسات یاندکس است، شرکت داشته است. اولین حمله اوکراینی مرکز داده ساسوو Yandex را هدف قرار داد که دو ابررایانه از سه ابررایانه این شرکت را در خود جای داده است که برای آموزش"}, {"source": "Ars Technica", "title": "A Cray-1 supercomputer replica from 30 \"obsolete\" Mac Minis", "link": "https://arstechnica.com/gadgets/2026/10/a-cray-1-supercomputer-replica-from-30-obsolete-mac-minis/", "summary": "The Museo de Historia de la Computación in Spain has unveiled a 1:1 scale visual replica of the famous Cray-1 supercomputer from 1976. Instead of sourcing expensive, cutting-edge tech to run the system, the creative team powered the project with 30 2012-era Mac Minis. Developed over 18 months, the project serves as a 50th-anniversary tribute to the Cray-1 and Apple's founding. Mac Minis from over a decade ago might not seem like the obvious first choice for building a cluster supercomputer, but when networked together, the developers can orchestrate the 64 active processing cores into a combined 1.3 teraflops of performance in their most recent tests. The museum reportedly achieved 1.5 teraflops previously using all 70 available cores, prior to one node going offline. Benchmarks were obtained using a custom matrix-multiplication Python script. Five PCs are quad-core i7s, and the remaining 25 are dual-core i5 models. Except for two units from 2014, the rest of the array dates to 2012. The replica is a valuable tool for museum-goers to understand the shifts in computer architecture since 1976. The original Cray-1 used vector processing, applying a single instruction to multiple data elements simultaneously, whereas the replica distributes work across independent processors in a parallel cluster. The peak theoretical performance of the original Cray-1 was approximately 160 megaflops. What was originally a purpose-built research machine has been re-created with consumer hardware that's vastly more capable than the machine that inspired it. Read full article Comments", "date_str": "2026-10-09T21:51:12+00:00", "hash": "24d709ad2b2c3a93", "title_fa": "یک کپی ابررایانه Cray-1 از 30 مک مینی \"منسوخ شده\".", "summary_fa": "Museo de Historia de la Computación در اسپانیا یک کپی تصویری در مقیاس 1:1 از ابرکامپیوتر معروف Cray-1 را در سال 1976 رونمایی کرده است. تیم خلاق به جای استفاده از فناوری گران قیمت و پیشرفته برای اجرای سیستم، پروژه را با 30 دستگاه مک مینی متعلق به دوره 2012 تامین کرد. این پروژه که بیش از 18 ماه توسعه یافته است، به عنوان ادای احترام به 50 سالگی Cray-1 و تأسیس اپل است. Mac Minis مربوط به بیش از یک دهه پیش ممکن است اولین انتخاب واضح برای ساخت یک ابررایانه خوشه ای به نظر نرسد، اما زمانی که توسعه دهندگان با هم شبکه شوند، می توانند 64 هسته پردازشی فعال را در ترکیبی از 1.3 ترافلاپس در آزمایش های اخیر خود هماهنگ کنند. طبق گزارش ها، موزه قبلاً با استفاده از تمام 70 هسته موجود، قبل از اینکه یک گره آفلاین شود، به 1.5 ترافلاپس دست یافت. معیارها با استفاده از یک اسکریپت پایتون ضرب ماتریس سفارشی به دست آمدند. پنج رایانه شخصی i7 چهار هسته ای و 25 رایانه باقی مانده مدل های i5 دو هسته ای هستند. به جز دو واحد از سال 2014، بقیه آرایه مربوط به سال 2012 است. ماکت ابزار ارزشمندی برای بازدیدکنندگان موزه برای درک تغییرات در معماری رایانه از سال 1976 است. Cray-1 اصلی از پردازش برداری استفاده می‌کرد، در حالی که یک دستورالعمل واحد را برای چندین عنصر داده به‌طور همزمان اعمال می‌کرد، در حالی که ماکت‌کننده‌های پردازشگر مستقل در یک کار توزیع می‌کنند. اوج عملکرد نظری Cray-1 اصلی تقریباً 160 مگافلاپ بود. چیزی که در ابتدا یک ماشین تحقیقاتی هدفمند بود، با سخت افزار مصرف کننده که بسیار توانمندتر از ماشینی است که از آن الهام گرفته بود، دوباره ایجاد شده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض"}, {"source": "Ars Technica", "title": "NASA issues long-awaited call to industry for private space stations", "link": "https://arstechnica.com/space/2026/10/nasa-issues-long-awaited-call-to-industry-for-private-space-stations/", "summary": "NASA on Friday released a much-anticipated \"request\" to the US commercial space industry to develop private space stations that, as early as 2030, will succeed the International Space Station as a place for astronauts to live in low-Earth orbit. In a cover letter accompanying the 360-page \"request for proposals,\" NASA stated its plan: \"This will ensure NASA has a sustained human presence in LEO for crew members to perform science and exploration.\" Several private companies that have worked for years on designing and developing such stations have been keen to learn exactly what capabilities NASA is seeking. These new documents finally provide some answers. NASA's solicitation can be found here . Industry responses are due back to NASA on December 8. NASA said it plans to select \"two or more\" contractors in this phase of the competition, and intends to make a final decision in April. Read full article Comments", "date_str": "2026-10-09T21:34:09+00:00", "hash": "b1b24f4e8839cb19", "title_fa": "ناسا برای ایستگاه‌های فضایی خصوصی فراخوانی را که مدت‌ها در انتظارش بود به صنعت صادر کرد", "summary_fa": "ناسا روز جمعه یک \"درخواست\" مورد انتظار را از صنعت فضای تجاری ایالات متحده برای توسعه ایستگاه های فضایی خصوصی منتشر کرد که در اوایل سال 2030، جانشین ایستگاه فضایی بین المللی به عنوان مکانی برای فضانوردان برای زندگی در مدار پایین زمین خواهد شد. ناسا در نامه‌ای همراه با «درخواست پیشنهادات» 360 صفحه‌ای، طرح خود را بیان کرد: «این امر تضمین می‌کند که ناسا حضور انسانی پایدار در LEO برای اعضای خدمه برای انجام علم و اکتشاف داشته باشد.» چندین شرکت خصوصی که سال‌ها بر روی طراحی و توسعه چنین ایستگاه‌هایی کار کرده‌اند، مشتاق هستند تا دقیقاً بدانند که ناسا به دنبال چه قابلیت‌هایی است. این اسناد جدید در نهایت پاسخ هایی را ارائه می دهند. درخواست ناسا را ​​می توانید در اینجا بیابید. پاسخ‌های صنعت در 8 دسامبر به ناسا برمی‌گردد. ناسا گفت که قصد دارد \"دو یا چند\" پیمانکار را در این مرحله از رقابت انتخاب کند و تصمیم نهایی را در آوریل اتخاذ کند. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید ناسا روز جمعه یک \"درخواست\" موردانتظار را از صنعت فضای تجاری ایالات متحده برای توسعه ایستگاه های فضایی خصوصی منتشر کرد که در اوایل سال 2030، ایستگاه فضایی بین المللی را جایگزین ایستگاه فضایی بین المللی به عنوان مکانی برای زندگی می کنند. درخواست ناسا را ​​می توانید در اینجا بیابید. پاسخ‌های صنعت در 8 دسامبر به ناسا برمی‌گردد. ناسا گفت که قصد دارد «دو یا چند» پیمانکار را در این مرحله از رقابت انتخاب کند و تصمیم نهایی را در آوریل اتخاذ کند. جرد آیزاکمن، مدیر ناسا در بیانیه‌ای که همراه با انتشار اسناد جدید بود، گفت: «ما به صراحت اعلام کرده‌ایم که ناسا هرگز از حضور خود در مدار پایین زمین دست نخواهد کشید."}, {"source": "Ars Technica", "title": "What's been driving Hawaii's lava fountains?", "link": "https://arstechnica.com/science/2026/10/whats-been-driving-hawaiis-lava-fountains/", "summary": "In most cases, hotspot-driven volcanism is relatively sedate, with lava flowing down mountainsides slowly enough that people can walk out of its way. But in a number of locations—Mount Etna, Hawaii, Iceland—lava gets expelled in dramatic fountains that can reach several hundred meters in height. Right now, we're not sure what powers them. However, thanks to a recent set of eruptions at the Kilauea volcano, we have some of the best documentation yet of erupting lava fountains. In a recent edition of Science, researchers from the US Geological Survey describe what we've seen and compare it with what we might expect based on our best ideas about what powers these fountains of molten rock. Years of fountains With three active volcanic regions that engage in fountaining, there has been a steady flow of dramatic videos of red-hot molten rock spouting from the Earth. But Kilauea has had only three fountaining episodes since 1823, even though it's the youngest and most active volcano in Hawaii. That activity has led to intensive study, and we have a good idea of the volcano's structure. Previous work has identified a couple of lava residues within a few kilometers of the surface, and the volcano had 35 separate data-gathering stations set up on Kilauea, including \"seismic, infrasound, geodetic, gas, and visual and thermal cameras.\" Read full article Comments", "date_str": "2026-10-09T21:05:01+00:00", "hash": "41cf71cb4243609a", "title_fa": "چه چیزی باعث ایجاد فواره های گدازه در هاوایی شده است؟", "summary_fa": "در بیشتر موارد، آتشفشان ناشی از نقاط داغ نسبتا آرام است، با گدازه هایی که به آرامی از دامنه کوه ها سرازیر می شوند و مردم می توانند از مسیر آن خارج شوند. اما در تعدادی از مکان‌ها - کوه اتنا، هاوایی، ایسلند - گدازه‌ها در فواره‌های چشمگیر بیرون می‌افتند که ارتفاع آنها می‌تواند به چند صد متر برسد. در حال حاضر، ما مطمئن نیستیم که چه چیزی به آنها قدرت می دهد. با این حال، به لطف مجموعه‌ای از فوران‌های اخیر در آتشفشان Kilauea، ما برخی از بهترین اسناد را از فواره‌های گدازه‌ای در دست داریم. در نسخه اخیر Science، محققان سازمان زمین‌شناسی ایالات متحده آنچه را که دیده‌ایم توصیف می‌کنند و آن را با آنچه که ممکن است بر اساس بهترین ایده‌هایمان در مورد قدرت این فواره‌های سنگ مذاب انتظار داشته باشیم، مقایسه می‌کنند. سال‌ها فواره‌ها با سه منطقه فعال آتشفشانی که درگیر فواره‌ها هستند، جریان ثابتی از فیلم‌های دراماتیک از فوران سنگ‌های مذاب سرخ داغ از زمین وجود داشته است. اما Kilauea از سال 1823 تنها سه قسمت فواره داشته است، حتی اگر جوانترین و فعال ترین آتشفشان در هاوایی است. این فعالیت منجر به مطالعه فشرده شده است و ما ایده خوبی از ساختار آتشفشان داریم. کار قبلی چند بقایای گدازه را در چند کیلومتری سطح شناسایی کرده است و آتشفشان دارای 35 ایستگاه جمع‌آوری اطلاعات جداگانه در کیلاویا بود که شامل «دوربین‌های لرزه‌ای، زیرصوت، ژئودتیک، گاز، و دوربین‌های بصری و حرارتی» می‌شد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش در بیشتر موارد، آتشفشان ناشی از نقاط داغ نسبتا آرام است، با گدازه هایی که به آرامی از دامنه کوه ها سرازیر می شوند و مردم می توانند از مسیر خود خارج شوند."}, {"source": "Ars Technica", "title": "AI coding agents generate more code, but not more software", "link": "https://arstechnica.com/ai/2026/10/ai-coding-agents-generate-more-code-but-not-more-software/", "summary": "Anyone who has even tangentially associated with computer programming knows that modern AI coding assistants and agents can be incredibly efficient at generating huge amounts of functional code . But coders making use of those tools also know better than to trust the accuracy of that code , meaning substantial effort needs to be spent reviewing any AI-generated output. A recent study of actual coding practices across hundreds of firms finds that human code review forms a significant \"bottleneck\" for the overall efficiency of AI coding tools, resulting in \"little evidence that firms increase software output or reduce employment\" by using them. Any efficiency increased during the actual coding phase, the study authors find, is \"absorbed by downstream constraints in the production process\"; as \"the code review process significantly increases in length, pull requests are more likely to require revisions, and reviewers leave more comments.\" Cut once, measure twice To come to these conclusions, Harvard University researchers Fiona Chen and James Stratton made use of aggregated analytics data from Jellyfish , which measures the granular output of engineering teams. That data encompasses 300 million individual \"work events\" (e.g., commits and pull requests) and issue management software data across more than 700,000 employees at over 700 relevant software development firms from 2021 through March of 2026. Read full article Comments", "date_str": "2026-10-09T19:43:50+00:00", "hash": "b2dd0a1e301fa95e", "title_fa": "عوامل کدنویسی هوش مصنوعی کد بیشتری تولید می کنند، اما نرم افزار بیشتری تولید نمی کنند", "summary_fa": "هرکسی که حتی به طور مماس با برنامه نویسی کامپیوتری ارتباط داشته باشد، می داند که دستیاران و عوامل کدنویسی هوش مصنوعی مدرن می توانند در تولید مقادیر عظیمی از کدهای کاربردی بسیار کارآمد باشند. اما کدنویس‌هایی که از این ابزارها استفاده می‌کنند نیز بهتر از اعتماد به صحت آن کد می‌دانند، به این معنی که باید تلاش زیادی برای بررسی هر خروجی تولید شده توسط هوش مصنوعی صرف شود. مطالعه اخیر روی شیوه‌های کدگذاری واقعی در صدها شرکت نشان می‌دهد که بررسی کدهای انسانی یک «گلوگاه» قابل‌توجه برای کارایی کلی ابزارهای کدنویسی هوش مصنوعی ایجاد می‌کند که منجر به «شواهد کمی مبنی بر افزایش خروجی نرم‌افزار یا کاهش اشتغال» شرکت‌ها با استفاده از آنها می‌شود. نویسندگان مطالعه دریافتند، هر بازدهی افزایش یافته در طول مرحله کدگذاری واقعی، \"با محدودیت های پایین دستی در فرآیند تولید جذب می شود\". از آنجایی که \"فرایند بررسی کد به طور قابل توجهی طول می کشد، درخواست های کششی به احتمال زیاد نیاز به بازبینی دارند، و بازبین ها نظرات بیشتری می گذارند.\" یک بار برش دهید، دو بار اندازه بگیرید برای رسیدن به این نتایج، فیونا چن و جیمز استراتون، محققین دانشگاه هاروارد از داده‌های تحلیلی انبوهی از Jellyfish استفاده کردند که خروجی دانه‌ای تیم‌های مهندسی را اندازه‌گیری می‌کند. این داده‌ها شامل 300 میلیون «رویداد کاری» فردی (به عنوان مثال، تعهدات و درخواست‌ها) و داده‌های نرم‌افزار مدیریتی در بیش از 700000 کارمند در بیش از 700 شرکت توسعه نرم‌افزار مربوطه از سال 2021 تا مارس 2026 است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید هرکسی که حتی به طور مماس با برنامه نویسی کامپیوتر مرتبط است می داند که دستیاران و عوامل کدنویسی هوش مصنوعی مدرن می توانند در تولید"}, {"source": "Ars Technica", "title": "Outrage grows as CDC reportedly poised to fund \"unethical\" vaccine trial", "link": "https://arstechnica.com/health/2026/10/rfk-jr-still-eager-to-fund-vaccine-trial-that-would-expose-babies-to-deadly-virus/", "summary": "Outrage has erupted among health experts over news that the Centers for Disease Control and Prevention is still eager to fund a widely condemned vaccine trial that would expose newborns in Guinea-Bissau to hepatitis B, putting them at high risk of a lifelong infection, which can lead to liver cirrhosis, liver cancer, and premature death. The trial was suspended in January after its unethical design came to light and drew international outcry. Although the trial is still halted, staff of the CDC director's office told the agency's budget office in late September to set aside $1.6 million to fund the trial, according to a report by Rolling Stone . The money was to be pulled from funding for the CDC's global health security programs, which might otherwise go toward efforts like combating the Ebola outbreak currently raging in the Democratic Republic of the Congo. The Department of Health and Human Services, which oversees the CDC, did not respond to a request for comment from Ars Technica. Read full article Comments", "date_str": "2026-10-09T19:27:27+00:00", "hash": "2555209a982d4e20", "title_fa": "خشم افزایش می یابد زیرا CDC گزارش می دهد که آماده تامین مالی آزمایش واکسن \"غیر اخلاقی\" است", "summary_fa": "خشم کارشناسان بهداشتی به دلیل اخباری مبنی بر اینکه مراکز کنترل و پیشگیری از بیماری‌ها همچنان مشتاق است بودجه آزمایش واکسنی که به طور گسترده محکوم شده است را تأمین کند که نوزادان در گینه بیسائو را در معرض هپاتیت B قرار می‌دهد و آنها را در معرض خطر بالای عفونت مادام‌العمر قرار می‌دهد که می‌تواند منجر به سیروز کبدی، سرطان کبد و مرگ زودرس شود، به وجود آمده است. این محاکمه در ژانویه پس از افشای طرح غیراخلاقی آن و اعتراض بین المللی به حالت تعلیق درآمد. بر اساس گزارش رولینگ استون، اگرچه محاکمه هنوز متوقف شده است، کارکنان دفتر مدیر CDC در اواخر سپتامبر به دفتر بودجه آژانس گفتند که 1.6 میلیون دلار برای تأمین مالی این محاکمه اختصاص دهد. قرار بود این پول از بودجه برنامه‌های امنیت بهداشت جهانی CDC جمع‌آوری شود، که در غیر این صورت ممکن است به سمت تلاش‌هایی مانند مبارزه با شیوع ابولا که در حال حاضر در جمهوری دموکراتیک کنگو موج می‌زند، مصرف شود. وزارت بهداشت و خدمات انسانی، که نظارت بر CDC را بر عهده دارد، به درخواستی برای اظهار نظر از سوی Ars Technica پاسخ نداد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک ا  دستگاه و محموله های لپ تاپ (شامل ایستگاه های کاری لپ تاپ) با 20.6 درصد کاهش به 46.4 میلیون دستگاه رسید. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید تحلیلگران این هفته گزارش دادند که محموله‌های رایانه‌های شخصی را به حداقل رسانده و حدود 20 درصد در سه ماهه سوم 2026 کاهش یافته است. IDC یافته های مشابهی را به اشتراک گذاشت. این تحلیلگر این هفته گفت که محموله رایانه های شخصی با 20.1 درصد کاهش در سال به 62.7 میلیون دستگاه در مقایسه با 78.5 میلیون دستگاه در سه ماهه سوم 2025 رسیده است. IDC بر اساس PCMag گفت: کاهش 20.1 درصدی سالانه بزرگترین افتی است که IDC تاکنون در سه ماهه سوم سال ثبت کرده است. با توجه به اینکه محموله‌های رایانه‌های شخصی Q3 معمولاً از تعداد Q2 پیشی می‌گیرند، کاهش محموله‌ها نیز قابل توجه است. جیتش اوبرانی، مدیر تحقیقات دستگاه‌های مصرفی در IDC، به PCMag گفت: «اگر به تمام فصل‌ها نگاه کنیم، در سال‌های اخیر شاهد کاهش‌های بزرگ‌تری در سه ماهه‌های دیگر بوده‌ایم، مانند سه ماهه چهارم سال 2022، که 28.2- درصد بود، و سه ماهه اول سال 2023، که 28.7 درصد بود. IDC در اطلاعیه خود در"}, {"source": "Ars Technica", "title": "AI disqualification yields new Nikon Small World in Motion winner", "link": "https://arstechnica.com/science/2026/10/winning-nikon-small-world-in-motion-video-disqualified-for-ai-use/", "summary": "Credit: Nguyen Nam Nhat. Last month we covered the winner of Nikon's Small World in Motion video: Ning Xu of Tsinghua University in China, whose video captured tiny cilia beating in the airways of a child with a rare respiratory disorder. But allegations surfaced about Xu's use of AI while making the video. Nikon launched an investigation and concluded that Xu's entry did not comply with competition rules. The new winner is Nguyen Nam Nhat of Vietnam with a video of a tiny roundworm and a single-celled organism (above). According to a BBC report, some researchers expressed concern that Xu's video had structural abnormalities and that cell features appeared and disappeared in a way one would not see in actual cellular biology. Others spotted what looked like AI watermarks embedded within the source files. Xu said he used AI “to distinguish and visualize features in the reconstructed grayscale images”; however, he denied that AI was used \"to generate the experimental movie, the cilia, or their motion.” Founded in 2011, the Nikon Small World in Motion competition is a spinoff of the company’s Small World Photomicrography Competition, which has been around since 1974. Both are meant “to showcase the beauty and complexity of things seen through the light microscope”—one through still photographs, the other through photovideography, taking advantage of all the technological advances that now allow users to make movies or time-lapse images through the microscope. The other winners also moved up a notch with Xu's disqualification. Benedikt Pleyer of Bavaria, Germany, placed second with a video of jellyfish larvae suspended in water droplets; Andrew Moore of Howard Hughes Medical Institute in the US placed third with a video of synchronized cell division in neighboring cells; Patrick Hickey of Hypha Research Ltd. in Edinburgh, Scotland, placed fourth with a video of the dynamics of mitochondria and chloroplasts in Turtle Vine leaf cells; and Igor Adameyko placed fifth with a video of a tiny, colorful sea slug ( Cyerce kikutarobabai ) on the move. Read full article Comments", "date_str": "2026-10-09T18:44:06+00:00", "hash": "89e70dea5ed43cd0", "title_fa": "رد صلاحیت هوش مصنوعی برنده جدید Nikon Small in Motion را به همراه دارد", "summary_fa": "اعتبار: Nguyen Nam Nhat. ماه گذشته برنده فیلم دنیای کوچک در حرکت نیکون را پوشش دادیم: نینگ زو از دانشگاه تسینگ‌هوا در چین، که ویدیوی او ضربان مژک‌های ریز را در مجاری تنفسی کودکی با یک اختلال نادر تنفسی ضبط کرد. اما ادعاهایی مبنی بر استفاده ژو از هوش مصنوعی هنگام ساخت این ویدیو مطرح شد. نیکون تحقیقاتی را آغاز کرد و به این نتیجه رسید که ورود خو با قوانین رقابت مطابقت ندارد. برنده جدید نگوین نام نهات از ویتنام با ویدیویی از یک کرم گرد کوچک و یک ارگانیسم تک سلولی است (در بالا). بر اساس گزارش بی‌بی‌سی، برخی از محققان ابراز نگرانی کردند که ویدیوی Xu دارای ناهنجاری‌های ساختاری است و ویژگی‌های سلولی به‌گونه‌ای ظاهر و ناپدید می‌شوند که در زیست‌شناسی سلولی واقعی دیده نمی‌شود. دیگران آنچه را که به نظر می رسد واترمارک های هوش مصنوعی در فایل های منبع جاسازی شده است، مشاهده کردند. شو گفت که از هوش مصنوعی «برای تشخیص و تجسم ویژگی‌ها در تصاویر بازسازی‌شده در مقیاس خاکستری» استفاده کرده است. با این حال، او استفاده از هوش مصنوعی \"برای تولید فیلم تجربی، مژه ها یا حرکت آنها را رد کرد.\" رقابت دنیای کوچک در حرکت نیکون که در سال 2011 تأسیس شد، یک اسپین آف از مسابقه میکروفتومیکروگرافی دنیای کوچک این شرکت است که از سال 1974 وجود داشته است. هدف هر دو نشان دادن زیبایی و پیچیدگی چیزهایی است که از طریق میکروسکوپ نوری دیده می‌شود - یکی از طریق عکس‌های ثابت، دیگری از طریق عکسبرداری، با بهره‌گیری از تمام پیشرفت‌های تکنولوژیکی که اکنون به کاربران امکان می‌دهد از طریق میکروسکوپ فیلم یا تصاویر تایم لپس بسازند. سایر برندگان نیز با رد صلاحیت خو، یک پله صعود کردند. بندیکت پلیر از باواریا، آلمان، با ویدیویی از لاروهای چتر دریایی معلق در قطرات آب در جایگاه دوم قرار گرفت. اندرو مور"}, {"source": "Ars Technica", "title": "Your artwork could be featured in the next Debian release", "link": "https://arstechnica.com/gadgets/2026/10/your-artwork-could-be-featured-in-the-next-debian-release/", "summary": "The Debian Linux project has opened a call for community artwork submissions ahead of the release of the upcoming Forky (Debian 14). If you think you've got the artistic chops, your art could appear on the boot screens, login prompts, and desktop wallpapers of millions of users. The submission deadline is November 26. Continuing Debian's community-driven ethos, the artwork submission process mirrors that of previous releases. The artwork must feel distinctively \"Debian,\" integrate cleanly without the need for core software patching, and remain visually appealing for the long term. Elise Couper's \"Ceratopsian\" theme was chosen as the winning default for Debian 13 Trixie . For anyone who might not be up on the latest from the Toy Story franchise, the release names echo character names from the animated films. Trixie was a triceratops introduced in Toy Story 3 , hence the \"Ceratopsian\" wink in the winning submission. It makes sense that the next version of Debian continues this trend with Forky, a character introduced in the franchise's fourth entry. The Debian team cautions against overly busy designs that may cause user fatigue, but if anyone can successfully incorporate Forky's googly eyes into the design somehow, know that you'd at least win the contest for my Debian desktop wallpaper. Read full article Comments", "date_str": "2026-10-09T18:33:26+00:00", "hash": "83b9f6927194c884", "title_fa": "آثار هنری شما می‌توانند در نسخه بعدی دبیان نمایش داده شوند", "summary_fa": "پروژه لینوکس دبیان یک فراخوان برای ارسال آثار هنری جامعه قبل از انتشار Forky آینده (دبیان 14) باز کرده است. اگر فکر می‌کنید که کارهای هنری را دارید، هنر شما می‌تواند در صفحه‌های بوت، درخواست‌های ورود به سیستم و تصاویر پس‌زمینه دسکتاپ میلیون‌ها کاربر ظاهر شود. آخرین مهلت ارسال تا 26 نوامبر است. در ادامه اخلاق جامعه محور دبیان، روند ارسال آثار هنری منعکس کننده نسخه های قبلی است. اثر هنری باید کاملاً «دبیان» باشد، بدون نیاز به وصله نرم‌افزار اصلی یکپارچه شود و از نظر بصری برای دراز مدت جذاب بماند. تم \"Ceratopsian\" Elise Couper به عنوان پیش فرض برنده برای Debian 13 Trixie انتخاب شد. برای هر کسی که ممکن است از جدیدترین مجموعه داستان اسباب‌بازی مطلع نباشد، نام‌های منتشر شده بازتاب نام شخصیت‌های فیلم‌های انیمیشن است. Trixie یک triceratops بود که در داستان اسباب‌بازی 3 معرفی شد، از این رو چشمک \"Ceratopsian\" در ارسال برنده بود. منطقی است که نسخه بعدی دبیان این روند را با Forky ادامه دهد، شخصیتی که در قسمت چهارم فرنچایز معرفی شد. تیم دبیان نسبت به طرح‌های بیش از حد شلوغ که ممکن است باعث خستگی کاربر شود، هشدار می‌دهد، اما اگر کسی می‌تواند با موفقیت چشم‌های گوگولی فورکی را به نحوی در طراحی  در نزدیکی کیگالی برگزار می شود [ ] این داستان در The Next Web ادامه دارد. انتظار می رود اولین مسابقه زودتر از سال 2030 نباشد. آفریقا آخرین بار در سال 1993 میزبان فرمول 1 در کیالامی، نزدیک ژوهانسبورگ بود. رئیس جمهور پل کاگامه این مناقصه را در دسامبر 2024 آغاز کرد. این بخشی از تلاش گسترده تر برای ارتقای شهرت رواندا از طریق ورزش است که شامل میزبانی مسابقات قهرمانی جهان دوچرخه سواری جاده ای نیز می شود. آفریقای جنوبی نیز برای این مسابقه پیشنهاد داد. به نظر می رسد وزیر ورزش آن، گایتون مک کنزی، در رسانه های اجتماعی باخت را پذیرفته است. او نوشت: «ما برای F1 2030 رواندا خوشحالیم. SA حتی قبل از سال 2030 F1 را دریافت خواهد کرد. سمافور گفت که گروه های حقوقی رواندا را متهم می کنند که از ورزش برای پاکسازی وجهه خود و در عین حال ساکت کردن منتقدان استفاده می کند. دولت این موضوع را تکذیب می کند. F1 در سال‌های اخیر توسط پول فناوری تغییر شکل داده است و مدت‌هاست که به دنبال گسترش در مناطق جدید بوده است. هر هفته مهمترین اخبار فنی را در صندوق ورودی خود دریافت کنید."}, {"source": "The Next Web", "title": "Anthropic says Claude sent a fake murder tip to police during testing", "link": "https://thenextweb.com/news/anthropic-claude-fake-police-tip-unintended-actions", "summary": "An Anthropic SI model submitted a false tip about a murder case to a US police department while it was being tested, the company said in a new report. The Claude Haiku 4.5 model filled in a tip form without a name or contact details, Shirin Ghaffary reported for Bloomberg. The Philadelphia Police Department disclosed the [ ] This story continues at The Next Web", "date_str": "2026-10-10T08:26:58+00:00", "hash": "05736b0b7cf6a44c", "title_fa": "آنتروپیک می‌گوید که کلود در حین آزمایش یک نکته جعلی قتل را به پلیس فرستاد", "summary_fa": "این شرکت در گزارشی جدید اعلام کرد که یک مدل Anthropic SI اطلاعات نادرستی درباره یک پرونده قتل را در حالی که در حال آزمایش بود به اداره پلیس ایالات متحده ارسال کرد. شیرین غفاری برای بلومبرگ گزارش داد که مدل کلود هایکو 4.5 فرمی را بدون نام یا جزئیات تماس پر کرده است. دپارتمان پلیس فیلادلفیا فاش کرد [ ] این داستان در The Next Web ادامه دارد: «ممکن است اطلاعاتی در مورد این پرونده داشته باشم. \"به یاد می آورم که شخصی را دیدم که با توضیحات در منطقه مطابقت داشت.\" این گزارش چهار نوع اقدام ناخواسته را فهرست می کند. مدل‌ها از نقص‌های اساسی نرم‌افزار برای اجرای دستورات سوء استفاده می‌کردند، فرم‌هایی را که نباید می‌داشتند ارسال می‌کردند، و برای دستیابی به داده‌های دروازه‌دار محدودیت‌ها کار می‌کردند. برخی نیز از کوتاه کننده های لینک رایگان برای دور زدن محدودیت های طول در ابزار خود استفاده کردند. آنتروپیک بدون نام بردن از آنها گفت که برخی از موارد به سایت های فدرال، ایالتی و محلی حمله کردند. نیویورک تایمز گزارش داد که عوامل این سازمان همچنین 20 درخواست ناقص ویزا را در فرم وزارت امور خارجه ثبت کردند. هیچ کدام پردازش نشد. آنتروپیک نوشت: «مواردی که تا به امروز در این دسته‌ها شناسایی کرده‌ایم کمترین تأثیر را در دنیای واقعی داشتند. آنتروپیک گفت که به کاخ سفید اطلاع داده و به هر یک از آژانس های مرتبط گفته است. مقامات سپس گفتند که شرکت های هوش مصنوعی باید به طرف های آسیب دیده اطلاع دهند و حوادث امنیتی مربوط به مدل های آنها را برطرف کنند. نیروی جدید سوپر اطلاعات گفت که این فعالیت متوقف شده و ادامه ندارد. Anthropic اکنون دسترسی به اینترنت زنده را برای آزمایش های داخلی خود خاموش کرده است. این آخرین مورد در یک سری از این موارد است. ماه گذشته، این شرکت"}, {"source": "Business Insider", "title": "I'm a Massachusetts native. Skip Salem and check out this less-crowded neighboring city for Halloween fun.", "link": "https://www.businessinsider.com/beverly-massachusetts-things-to-do-salem-dupe-halloween-2026-10", "summary": "I think Beverly, Massachusetts, is better than Salem in the fall. Sarah Sweeney/Endicott College I'm from Massachusetts, and I love visiting Salem, but it can be too busy in the fall. Instead, I think Beverly, Massachusetts, is an amazing, less-crowded alternative. Not only is the Halloween decor incredible, but the place also has great food and historic charm. Anyone from Massachusetts knows that during Halloween, Salem is packed tighter than a Candy Crush board. I've visited Salem many times, but I like to avoid the area from September through the beginning of November because of the surge in tourism. Each year, the city welcomes roughly 1,000,000 visitors every October, with 96,000 people going on Halloween alone. During the fall, crowds flood the streets on ghost tours, take selfies in front of the statue of Elizabeth Montgomery from \"Bewitched,\" line up at the Salem Witch Museum, and try to snag a ticket to the Haunted Witch Village at the Salem Wax Museum. It's always exciting to welcome new guests who are eager to learn about the city's twisted history. But during October, Salem's narrow streets and scarce parking make its charm hard to enjoy. However, a recent three-day staycation in Beverly, Massachusetts —just three miles away from Salem's city center — gave my family and me the best of both worlds: easy access to Witch City, plus a quieter place to eat, explore, and sleep. Until this year, I'd thought of it as mostly Salem's sleepier sister, but my time there made me realize I'd been overlooking it as a must-visit destination in its own right. Beverly has Halloween spirit without Salem's October crowds Halloween on the Hill features thousands of hand-carved jack-o -lanterns, twinkling lights, and decorations. Mary Dettloff/The Trustees of Reservations Downtown Beverly has the independent restaurants, family-owned boutiques, and historic architecture that I love about Salem, minus the holiday crowds. I loved checking out the trails at Long Hill estate, which houses 114 acres of land and gardens. For most of October, the grounds' pathways feature thousands of hand-carved glowing jack-o'-lanterns, twinkling lights, decorations, and treats like cider as part of the Halloween on the Hill event. I've attended the event twice and can't recommend it enough. Our hotel was beautiful — and cheaper than many places in Salem My family and I stayed at the recently renovated Wylie Inn in Beverly, which sits on Endicott College's leafy seaside campus and has di", "date_str": "2026-10-10T14:07:01+00:00", "hash": "587b4b382d10acec", "title_fa": "من بومی ماساچوست هستم. از سالم بگذرید و این شهر همسایه کمتر شلوغ را برای تفریح ​​هالووین ببینید.", "summary_fa": "من فکر می کنم بورلی، ماساچوست، بهتر از سالم در پاییز است. سارا سوینی/ کالج اندیکوت من اهل ماساچوست هستم و دوست دارم از سالم دیدن کنم، اما ممکن است در پاییز خیلی شلوغ باشد. در عوض، من فکر می کنم بورلی، ماساچوست، جایگزین شگفت انگیز و کم جمعیتی است. نه تنها دکور هالووین باورنکردنی است، بلکه این مکان غذاهای عالی و جذابیت تاریخی نیز دارد. هر کسی از ماساچوست می‌داند که در طول هالووین، سالم محکم‌تر از تخته Candy Crush است. من بارها از سالم بازدید کرده‌ام، اما دوست دارم از سپتامبر تا اوایل نوامبر به دلیل افزایش توریسم از این منطقه اجتناب کنم. هر سال، این شهر هر ماه اکتبر پذیرای حدود 1،000،000 بازدیدکننده است که 96،000 نفر تنها در هالووین شرکت می کنند. در طول پاییز، جمعیت در تورهای ارواح در خیابان‌ها هجوم می‌آورند، جلوی مجسمه الیزابت مونتگومری از «جادوشده» سلفی می‌گیرند، در موزه جادوگر سالم صف می‌کشند و سعی می‌کنند بلیطی به روستای جادوگر جن زده در موزه موم سالم بگیرند. استقبال از مهمانان جدیدی که مشتاق هستند در مورد تاریخ پیچیده شهر بیاموزند، همیشه هیجان انگیز است. اما در ماه اکتبر، خیابان‌های باریک و پارکینگ کمیاب سالم، لذت بردن از جذابیت آن را سخت می‌کند. با این حال، اقامت سه روزه اخیر در بورلی، ماساچوست - فقط سه مایل دورتر از مرکز شهر سالم - به من و خانواده ام بهترین هر دو دنیا را داد: دسترسی آسان به شهر جادوگر، به علاوه یک مکان آرام تر برای غذا خوردن، کاوش و خواب. تا این سال، آن را بیشتر به عنوان خواهر خواب‌آلود سالم تصور می‌کردم، اما مدتی که در آنجا بودم متوجه شدم که آن را به‌عنوان مقصدی که باید از آن بازدید کرد، نادیده گرفتم. بورلی بدون شلوغی ماه اکتبر روح هالووین دارد. هالووین روی تپه دارای هزاران فانوس جک، چراغ های چشمک"}, {"source": "Business Insider", "title": "We met on a 7th-grade field trip. Twenty years later, I secretly recreated it and we rekindled our romance.", "link": "https://www.businessinsider.com/marriage-after-baby-theme-park-date-reconnect-2026-10", "summary": "The author and her husband met in 7th grade. Courtesy fo the author My husband and I met on our seventh-grade field trip to a local amusement park. Twenty years later, I planned a surprise trip back to the park. It was the best we've felt since having a baby last year. According to my childhood diary, I met my husband on our seventh-grade field trip to Canobie Lake Park — a local theme park , an hour north of Boston. From the Ferris wheel overlooking the freshwater lake to the 90-year-old wooden coaster called the Yankee Cannonball, it would be hard to find a more idyllic spot for a middle school meet-cute in New England. The author and her husband went to school together. Courtesy of the author We weren't childhood sweethearts . We didn't start dating until our late 20s, but despite the sweeping romance we had reconnecting and getting married, we fell into a postpartum blur after having a baby. As we adjusted to our new lives, romance kept falling down the priority list until it practically flatlined. But with the 18-month mark around the corner, I was ready for a comeback, and my husband absolutely did not see it coming. Postpartum romance takes a village Luckily, my parents offered to watch our daughter on many weekend afternoons, to give us time off. Yet left alone, we defaulted too easily to catching up on work and home improvement projects . We needed friends to shake us out of Mom-and-Dad mode. I'd been hoping to orchestrate a surprise trip to Canobie Lake Park all summer, ever since I realized we'd passed the 20th anniversary of our meeting there. So, when two of our bandmates mentioned they were free to hang out one Saturday, I immediately called them in secret, and we hatched a plan. The author planned a surprise for her husband so they could reconnect as a couple. Courtesy of the author It all kicked off when our friends offered to take my husband and me to a fun spot with live music for the day — a winery conveniently located near Canobie Lake. With the decoy destination in the GPS, the four of us piled into one car and set off, bathing suits hidden in the trunk. At the last second, we veered off course, pulling into the park as if it were a complete coincidence. I wish I had a video of his face when we arrived. The only other time I've seen him so surprised and delighted was when I showed him the positive pregnancy test. Everything about the theme park surpassed our expectations Tickets were $48 per person. Parking was free. There was no line ", "date_str": "2026-10-10T12:57:01+00:00", "hash": "14227803e7eee598", "title_fa": "در یک سفر علمی کلاس هفتم با هم آشنا شدیم. بیست سال بعد، مخفیانه آن را بازسازی کردم و عاشقانه خود را دوباره زنده کردیم.", "summary_fa": "نویسنده و همسرش در کلاس هفتم با هم آشنا شدند. با احترام از نویسنده، من و شوهرم در سفر صنفی هفتم خود به یک شهربازی محلی با هم آشنا شدیم. بیست سال بعد، یک سفر غافلگیرکننده به پارک برنامه ریزی کردم. این بهترین احساسی بود که از زمان بچه دار شدن در سال گذشته داشته ایم. طبق دفتر خاطرات دوران کودکی ام، در سفر علمی کلاس هفتم خود به پارک دریاچه کانوبی - یک پارک موضوعی محلی، یک ساعت در شمال بوستون، با شوهرم آشنا شدم. از چرخ و فلک مشرف به دریاچه آب شیرین گرفته تا زیر لیوانی چوبی 90 ساله به نام گلوله توپ یانکی، پیدا کردن مکان ایده‌آل‌تری برای یک ملاقات مدرسه راهنمایی در نیوانگلند دشوار است. نویسنده و همسرش با هم به مدرسه رفتند. با حسن نیت نویسنده ما عزیزان دوران کودکی نبودیم. ما تا اواخر دهه 20 زندگی خود را شروع نکردیم، اما علیرغم رابطه عاشقانه گسترده ای که با هم داشتیم و ازدواج کردیم، بعد از بچه دار شدن در تاری بعد از زایمان افتادیم. همانطور که ما با زندگی جدید خود سازگار می شدیم، عاشقانه همچنان در لیست اولویت ها قرار می گرفت تا زمانی که عملاً صاف شد. اما با نزدیک شدن به 18 ماه، من برای بازگشت آماده بودم و شوهرم مطلقاً آن را نمی دید. عاشقانه بعد از زایمان روستایی را به خود اختصاص می دهد خوشبختانه، والدینم به ما پیشنهاد دادند که بعدازظهرهای آخر هفته دخترمان را تماشا کنند تا به ما مرخصی بدهند. با این حال که تنها مانده‌ایم، خیلی راحت به پروژه‌های بهبود کار و خانه دسترسی پیدا کردیم. ما به دوستانی نیاز داشتیم که ما را از حالت مامان و بابا بیرون کنند. از زمانی که فهمیدم بیستمین سالگرد ملاقاتمان را در آنجا پشت سر گذاشته ایم، امیدوار بودم که در تمام تابستان یک سفر غافلگیرکننده"}, {"source": "Business Insider", "title": "I started an Airbnb business with my friends with 4 cabins. Now we manage more than 500 properties.", "link": "https://www.businessinsider.com/scaled-airbnb-business-real-estate-investing-tips-property-management-2026-10", "summary": "Samuel Sévigny and his friends started a short-term rental property management company and scaled from 10 properties to over 500 in four years. Chaletô Samuel Sévigny cofounded Chaletô, a Quebec-based rental management firm, with friends in 2022. They've grown the company in four years and now manage over 500 properties. Sévigny said that some things run more smoothly at scale — others don't. This as-told-to essay is based on a conversation with Samuel Sévigny, 32, the cofounder and marketing director at Chaletô, a short-term rental property management company based in Quebec, Canada. Sévigny started Chaletô in 2022 with four of his friends and has scaled to over 500 cabins and condos. The following has been edited for length and clarity. It started as six friends fresh out of college. We all had other jobs. It was in 2016, and we wanted to invest in real estate, diversify, and get started in life. One of our co-founders had condos in downtown Quebec City already, so he pitched us the idea of investing all together and building our own cabin , and to manage it ourselves. So that's what we did. We launched our first cabin together in 2019, then our second in 2020, right in the middle of COVID. Fast-forward to 2022, and we had four different units that we owned and managed, and we wanted to delegate the process of managing them. We couldn't find anyone who was professional enough for our standards, so it was just like most origin stories: it starts with a problem that we're trying to solve. In the meantime, our neighbor started pressuring us, asking if we could manage his property because he could see that we were rented pretty much the whole year. We said no at first, but he kept asking. At some point, we decided to say yes. It started with our neighbor, then it was the neighbor's neighbor, and then the whole street. Then we had 10 properties under management in 2022. Sévigny and the rest of the Chaletô founders. Chaletô The six of us had to sit down and say, \"Hey, what are we going to do with this? It's getting serious.\" Either we'll make this a serious, legitimate business , or we stop, because there's no in-between. So in 2022, we decided to incorporate Chaletô . We grew from 10 to 500-plus units in four years. We decided to make it a real thing and to go all-in. When we scaled our business, our gains scaled, too The biggest difference between an individual host and a property management company is really the optimization at scale. When you're a professi", "date_str": "2026-10-10T12:26:01+00:00", "hash": "559e3cdfdfa24b2e", "title_fa": "من یک تجارت Airbnb را با دوستانم با 4 کابین راه اندازی کردم. اکنون بیش از 500 ملک را مدیریت می کنیم.", "summary_fa": "ساموئل سوینی و دوستانش یک شرکت مدیریت املاک اجاره ای کوتاه مدت راه اندازی کردند و طی چهار سال از 10 ملک به بیش از 500 واحد رسیدند. Chaletô Samuel Sévigny در سال 2022 با دوستان خود Chaletô، یک شرکت مدیریت اجاره مستقر در کبک را تأسیس کرد. آنها شرکت را در چهار سال توسعه دادند و اکنون بیش از 500 ملک را مدیریت می کنند. Sévigny گفت که برخی چیزها در مقیاس راحت تر پیش می روند - برخی دیگر اینطور نیستند. این مقاله گفته شده بر اساس گفتگو با ساموئل سوینی، 32 ساله، یکی از بنیانگذاران و مدیر بازاریابی Chaletô، یک شرکت مدیریت املاک اجاره کوتاه مدت مستقر در کبک، کانادا است. Sévigny Chaletô را در سال 2022 با چهار تن از دوستان خود راه اندازی کرد و تا کنون به بیش از 500 کابین و کاندو رسیده است. موارد زیر برای طول و وضوح ویرایش شده است. زمانی شروع شد که شش دوست تازه از دانشگاه خارج شده بودند. همه ما مشاغل دیگری داشتیم. در سال 2016 بود و ما می خواستیم در املاک سرمایه گذاری کنیم، تنوع ایجاد کنیم و زندگی را شروع کنیم. یکی از بنیانگذاران ما قبلاً کاندوهایی در مرکز شهر کبک داشت، بنابراین او ایده این را مطرح کرد که همه با هم سرمایه گذاری کنیم و کابین خود را بسازیم و خودمان آن را مدیریت کنیم. پس این کاری است که ما انجام دادیم. ما اولین کابین خود را با هم در سال 2019 راه اندازی کردیم، سپس دومین کابین خود را در سال 2020 درست در میانه COVID. به سرعت به سال 2022 می رسیم و ما چهار واحد مختلف داشتیم که مالک و مدیریت آن ها بودیم و می خواستیم روند مدیریت آنها را واگذار کنیم. ما نتوانستیم کسی را پیدا کنیم که به اندازه کافی برای استانداردهای ما حرفه"}, {"source": "Business Insider", "title": "We rode 12 rides at Disney World without paying for Lightning Lanes. The secret was leaving our kids at home.", "link": "https://www.businessinsider.com/disney-world-without-kids-moms-trip-experience-2026-10", "summary": "The author and her friend went to three parks at Disney World. Courtesy of the author I went to Disney World with a friend instead of bringing our children. We visited Hollywood Studios, Magic Kingdom, and Epcot in a single day. It was surprisingly empty. Without kids slowing us down, we rode 12 rides and explored at our own pace. My friend and I felt like we were overdue for a trip without our kids . Between the two of us, we have seven children, ranging in age from 6 to 10, including three pairs of twins. We knew we wanted it to be a warm-weather destination to extend the feeling of summer, as the leaves are already turning red in Maine, where we both live. The author grew up going to Disney World. Courtesy of the author The one destination we kept coming back to was Florida. And because we are both huge Disney fans , I threw the crazy idea of going to the parks without our kids. Getting to feel like a kid again alongside my friend was one of the most uplifting experiences in my years as a mom. We got Park Hopper tickets Because we still wanted to lounge by the pool and drink frozen drinks, we figured we'd dedicate one day and one day only to Disney World. So we got Park Hopper tickets that allowed us to move between parks. The way we used them was absolutely key, and was very different from the trips I've taken with my kids. Whenever I've gotten Park Hopper tickets at the parks with my kids, I've felt like I wasted my money because they just wanted to do one park at a time, or we would take forever with meals, snacks, potty breaks, and all the things little kids require. The author and her friend got park hopper tickets at Disney World. Courtesy of the author With just the two of us, we were able to do three parks: Hollywood Studios , Magic Kingdom, and Epcot. Our initial plan was just to do two and skip Magic Kingdom, but we did so much of Hollywood Studios by 1 p.m. that we decided to add one more stop. We rode 12 rides Sure, our approach was not to do absolutely everything in every single park. We were just going with the flow, especially considering that we didn't splurge on Lightning Lanes since we didn't have a firm plan and didn't want time slots to deter our adventure. On the Sunday we were there, Lightning Lanes ranged from $24 to $27, depending on the park. We started our day at Hollywood Studios because we are both big Star Wars fans and hadn't done that area yet. We were able to get on rides super quickly without waiting in line. After we ma", "date_str": "2026-10-10T12:11:01+00:00", "hash": "c7c090697052c5ec", "title_fa": "ما 12 سواری در دنیای دیزنی بدون پرداخت هزینه لایتنینگ لانز سوار شدیم. راز این بود که بچه هایمان را در خانه رها کنیم.", "summary_fa": "نویسنده و دوستش به سه پارک در دنیای دیزنی رفتند. به لطف نویسنده، من به جای آوردن فرزندانمان، با یکی از دوستانم به دنیای دیزنی رفتم. ما در یک روز از استودیوهای هالیوود، پادشاهی جادویی و اپکوت بازدید کردیم. جای تعجب خالی بود. بدون اینکه بچه ها سرعت ما را کاهش دهند، 12 سواری کردیم و با سرعت خودمان کاوش کردیم. من و دوستم احساس می کردیم که برای یک سفر بدون بچه هایمان به تاخیر افتاده بودیم. بین ما دو نفر، ما هفت فرزند داریم، از سن 6 تا 10 سال، از جمله سه جفت دوقلو. ما می‌دانستیم که می‌خواهیم مقصدی با هوای گرم باشد تا احساس تابستان را افزایش دهیم، زیرا برگ‌ها در مین، جایی که هر دوی ما زندگی می‌کنیم، قرمز شده‌اند. نویسنده با رفتن به دنیای دیزنی بزرگ شد. با حسن نیت نویسنده مقصدی که مدام به آن برمی گشتیم فلوریدا بود. و از آنجایی که ما هر دو طرفدار بزرگ دیزنی هستیم، فکر دیوانه وار رفتن به پارک ها را بدون بچه هایمان مطرح کردم. این که دوباره در کنار دوستم احساس کودکی کنم یکی از نشاط آورترین تجربیات در سال های مادری من بود. بلیت پارک هاپر گرفتیم چون هنوز می‌خواستیم کنار استخر بنشینیم و نوشیدنی‌های یخ‌زده بنوشیم، فکر کردیم یک روز و یک روز را فقط به دنیای دیزنی اختصاص می‌دهیم. بنابراین بلیط های پارک هاپر را گرفتیم که به ما امکان می داد بین پارک ها حرکت کنیم. روشی که ما از آنها استفاده می کردیم کاملاً کلیدی بود و با سفرهایی که با بچه هایم رفته بودم بسیار متفاوت بود. هر وقت با بچه‌هایم بلیط پارک هاپر را در پارک‌ها تهیه می‌کردم، احساس می‌کردم پولم را هدر می‌دهم زیرا آنها فقط می‌خواستند هر بار یک پارک انجام دهند، یا برای همیشه با وعده‌های غذایی، میان‌وعده‌ها، استراحت‌های کوچک و همه چیزهایی که"}, {"source": "Business Insider", "title": "Starter homes are getting harder to find. These 20 cities are bucking the trend.", "link": "https://www.businessinsider.com/best-cities-for-starter-homes-2026", "summary": "Starter homes are becoming harder to come by in all but a few major metros. dpproductions/Getty Images The market for starter homes is decreasing, but some cities still have plenty available. A report from Realtor.com shows that fewer than a quarter of large metro areas are starter-home-dominant. The number of starter homes is falling nationally, but it's increasing in some cities. As mortgage rates continue to reach new heights , options for first-time buyers are dwindling. Even starter homes — affordable properties that entice first-time homebuyers get their foot in the door — are jumping in price. The inventory of starter homes has recently decreased across the country. Data from Realtor.com shows that the national starter home share dropped from 38.1% to 36.2% from August 2019 to 2026, but the price during that timeframe increased 30.8%, from about $260,000 to $340,000. Realtor defines starter homes as homes listed at or below 80% of the median list price in that metro. A recent report from Realtor analyzing 8,300 ZIP codes in the largest 100 metros found that only 18.3% of those ZIP codes were starter-home dominant. \"Affordability is only part of the story. What matters as much is whether affordable homes are actually for sale in the places where buyers want and need to live,\" Realtor senior economist Hannah Jones said. \"For first-time buyers, the search is increasingly shaped by the geography of opportunity, not simply a metro's headline price. Keeping homeownership within reach will require more entry-level homes at attainable price points.\" It could be a while before the housing market gets back to \"normal,\" but there are still areas that have more starter homes than others. Below are the top 20 metros — out of the 100 largest metro areas — that have increased their share of starter homes. 20. Las Vegas et al., NV Eric Lo/Getty Images 2026 starter home share: 29.6% Point change (2019-2026): +0.4 Starter home price: $374,080 19. Los Angeles-Long Beach et al., CA Long Beach, California. Ron and Patty Thomas/Getty Images 2026 starter home share: 36.7% Point change (2019-2026): +0.6 Starter home price: $840,000 18. Worcester, MA Worcester, Massachusetts. DenisTangneyJr/Getty Images 2026 starter home share: 30.9% Point change (2019-2026): +0.6 Starter home price: $447,920 17. Spokane-Spokane Valley, WA Spokane, Washington. ChrisBoswell/Getty Images 2026 starter home share: 31.6% Point change (2019-2026): +0.6 Starter home price: $399,200 16. Detroit-War", "date_str": "2026-10-10T11:48:01+00:00", "hash": "f06e456decd7c452", "title_fa": "پیدا کردن خانه های آغازین سخت تر می شود. این 20 شهر در حال کاهش روند هستند.", "summary_fa": "یافتن خانه های اولیه در همه متروها به جز چند مترو بزرگ سخت تر می شود. dpproductions/Getty Images بازار خانه های آغازین در حال کاهش است، اما برخی شهرها هنوز مقدار زیادی در دسترس دارند. گزارشی از Realtor.com نشان می‌دهد که کمتر از یک چهارم مناطق بزرگ مترو خانه‌های شروع کننده هستند. تعداد خانه های اولیه در سطح کشور در حال کاهش است، اما در برخی شهرها در حال افزایش است. همانطور که نرخ های وام مسکن همچنان به ارتفاعات جدید می رسد، گزینه ها برای خریدارانی که برای اولین بار دارند کاهش می یابد. حتی خانه‌های مبتدی - دارایی‌های مقرون به صرفه که خریدارانی را که برای اولین‌بار خانه‌خرید می‌کنند، جذب می‌کنند - قیمت‌شان افزایش می‌یابد. اخیرا موجودی خانه های استارت در سراسر کشور کاهش یافته است. داده‌های Realtor.com نشان می‌دهد که سهم خانه استارت ملی از 38.1 درصد به 36.2 درصد از آگوست 2019 تا 2026 کاهش یافته است، اما قیمت در این بازه زمانی 30.8 درصد افزایش یافته است، از حدود 260,000 دلار به 340,000 دلار. Realtor خانه های استارت را به عنوان خانه هایی تعریف می کند که با قیمت 80٪ یا کمتر از میانگین فهرست قیمت در آن مترو فهرست شده اند. یک گزارش اخیر از Realtor با تجزیه و تحلیل 8300 کد پستی در 100 مترو بزرگ نشان داد که تنها 18.3٪ از این کدهای پستی غالب خانه های اولیه بودند. هانا جونز، اقتصاددان ارشد Realtor گفت: \"مقرون به صرفه بودن تنها بخشی از داستان است. آنچه به همان اندازه اهمیت دارد این است که آیا خانه های مقرون به صرفه واقعا در مکان هایی که خریداران می خواهند و نیاز به زندگی دارند برای فروش هستند.\" برای خریدارانی که اولین بار هستند، جستجو به طور فزاینده‌ای بر اساس جغرافیای فرصت شکل می‌گیرد، نه صرفاً قیمت اصلی مترو. حفظ مالکیت خانه در دسترس، به"}, {"source": "Business Insider", "title": "I moved from Massachusetts to Nashville for a partner. Though we broke up, I've made my own life here.", "link": "https://www.businessinsider.com/moved-nashville-for-relationship-broke-up-no-regret-2026-10", "summary": "The author moved to Nashville for a relationship that didn t last— but she doesn t regret it. Courtesy of Phoebe Farrell-Sherman After college, I moved from Massachusetts to Nashville with my partner. My friends and family urged me not to move for someone else, but I went anyway. Though we broke up, I found a job and made friends, and I don't regret the move. Like many freshly minted adults, when I graduated from college , I wasn't sure exactly what to do next. I had dreams and goals; as a writer, I wanted to pursue an MFA, but the timing didn't feel right. My future was obscure to me — except for one thing. ' Whatever I did, I wanted to do it with my girlfriend of a year. And I did know for certain what my girlfriend wanted to do next: to get her master's at a university closer to her family in Kentucky than our New England undergraduate school. She was admitted to Vanderbilt in Nashville, and suddenly, moving there seemed like my most likely destination. My friends and family advised against the move Without exception, my friends and family urged me not to make a major life decision based on a relationship that might not last. They thought I would feel alienated in Nashville, and not without reason, since I grew up in Seattle and was living in Massachusetts, and had never spent any meaningful amount of time anywhere that fell between the West Coast and the Northeast. I found ways to rationalize my decision to follow my girlfriend — getting recommendations on what Nashville might have to offer writers, securing an entry-level position at a book review magazine — but secretly, I felt ridiculous whenever I said I had my own reasons for moving. My reason was that I wanted to be with her. The move was fraught from the start, both practically and emotionally. We fought while packing. On the harrowing drive down, my girlfriend's car was so full that she couldn't see her blind spot, and I had to lean out the window to check for oncoming traffic every time she changed lanes. At first, I questioned whether I had made the right decision Once in Nashville, I picked up a second job to afford my half م پیدا کردم - دریافت توصیه‌هایی در مورد آنچه که نشویل"}, {"source": "Business Insider", "title": "Here are the staggering numbers behind the Abraham Lincoln Carrier Strike Group's 321-day deployment", "link": "https://www.businessinsider.com/abraham-lincoln-carrier-strike-group-navy-deployment-numbers-epic-fury-2026-10", "summary": "The aircraft carrier USS Abraham Lincoln returned home this week. U.S. Navy photo by Mass Communication Specialist 3rd Class Aaron J. Rolle USS Abraham Lincoln has returned from a challenging combat deployment. Its air wing flew thousands of combat missions, dropping over a million pounds of ordnance. The Navy says the deployment is shaping future carrier operations. The US Navy aircraft carrier USS Abraham Lincoln returned home this week after a long and difficult combat deployment. The numbers shared by the sea service for that deployment are staggering. The warship left its homeport in San Diego in November 2025 and was deployed for 321 days, which included 286 consecutive days at sea without a port call. The lengthy deployment, extended by Operation Epic Fury that kicked off the Iran war, set a modern-day record . As hostilities began at the end of February, the Abraham Lincoln Carrier Strike Group played a central role in the fight. The carrier strike group's embarked Carrier Air Wing 9 — a naval aviation force consisting of nine squadrons of F/A-18E/F Super Hornets, F-35C Lightning II Joint Strike Fighters, and EA-18G Growler electronic attack aircraft, among other assets— flew nearly 4,000 combat flights during the 40-day operation. During the monthslong deployment, it flew 14,037 aircraft sorties and accumulated 31,460 forward-deployed flight hours. An estimated 20.5 million gallons of aviation fuel enabled the air wing's operations, the Navy said. During Operation Epic Fury, the carrier air wing's mix of fourth- and fifth-generation aircraft launched 1,499 precision munitions, dropping over 1.37 million pounds of ordnance on pri
