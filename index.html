"category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۱۱ آبان • ۲۰:۱۰"}, {"source": "Billboard", "title": "Morgan Wallen’s Sand in My Boots Lineup to Feature Kings of Leon, Ella Langley & More: ‘It’s Going to Be Really Top-Notch’", "link": "https://www.billboard.com/music/music-news/morgan-wallen-sand-in-my-boots-lineup-2027-1236371931/", "summary": "Morgan Wallen s Sand In My Boots Festival will make its return to Gulf Shores, Ala., from May 21 to 23, blending music and sunny beach vibes, with a top-tier performer lineup. Presented by Wallen and AEG Presents, the three-day music festival and beach vacation s lineup, which was announced Monday (Nov. 2), will feature the country star himself as a headliner, along with Kings of Leon and Choosin Texas hitmaker Ella Langley . Wallen personally curated the lineup. The rest of the bill features a wide-ranging list of artists traversing country, rock, hip-hop, electronic and more. “One thing I’m looking forward to the most about bringing Sand in My Boots Festival back is being able to have new concepts on stage and trying to elevate the experience overall for the fans, myself and other artists on the bill,” Wallen said in a statement. “I think it s going to be really top-notch and we’re going to try to do it even better this time.” Fans will be able to take in music from country artists including Koe Wetzel, Gavin Adcock, Cole Swindell, Midland, Hudson Westbrook, Kashus Culpepper and Carter Faith, as well as hip-hop artists including Nelly, Gucci Mane and Flo Rida, alternative rockers Third Eye Blind and electronic music artists Kygo, Empire of the Sun and Girl Talk. Passes go on sale starting Nov. 6 at 10 a.m. CT. Wallen s Been By Now is currently No. 1 on Billboard s Country Airplay chart, marking his fourth No. 1 of 2026, and his 23rd No. 1 overall on that chart. The country star will continue to give back to communities at Sand in My Boots through his Morgan Wallen Foundation, to support programs for youth in sports and music. In 2025, the foundation donated more than $200,000 in instruments to five schools in Alabama. Since the launch of the Morgan Wallen Foundation s Tour Give Back initiative, the foundation has contributed more than $2 million worth of instruments to schools across U.S. touring cities. See the complete lineup for Sand in My Boots below: View this post on Instagram", "date_str": "2026-11-02T16:32:05+00:00", "hash": "5b4a771b8e983e13", "title_fa": "Morgan Wallen's Sand in My Boots Lineup برای بازی Kings of Leon، Ella Langley و بیشتر: \"این واقعاً درجه یک خواهد بود\"", "summary_fa": "جشنواره Sand In My Boots مورگان والن از 21 تا 23 مه با ترکیبی از موسیقی و حال و هوای ساحلی آفتابی با ترکیبی از مجریان درجه یک به خلیج سواحل، آلا. ارائه شده توسط Wallen و AEG Presents، فستیوال سه روزه موسیقی و ترکیب تعطیلات ساحلی، که دوشنبه (2 نوامبر) اعلام شد، خود ستاره کانتری را به عنوان یک تیتر لاینر همراه با Kings of Leon و Choosin تگزاس، الا لنگلی، هیت ساز تگزاسی، به نمایش خواهند گذاشت. والن شخصا سرپرستی این ترکیب را بر عهده داشت. بقیه لایحه شامل فهرست گسترده ای از هنرمندانی است که از کشور، راک، هیپ هاپ، الکترونیک و غیره عبور می کنند. والن در بیانیه ای گفت: «یکی از چیزهایی که بیشتر از همه در مورد بازگرداندن جشنواره Sand in My Boots منتظرش هستم این است که بتوانم مفاهیم جدیدی را روی صحنه داشته باشم و سعی کنم تجربه را به طور کلی برای طرفداران، خودم و سایر هنرمندان در این لایحه ارتقا دهم. من فکر می‌کنم که واقعاً درجه یک خواهد بود و ما سعی خواهیم کرد این بار حتی بهتر این کار را انجام دهیم.» طرفداران می توانند موسیقی هنرمندان کانتری از جمله کو وتزل، گاوین ادکاک، کول سویندل، میدلند، هادسون وستبروک، کاشوس کالپپر و کارتر فیث و همچنین هنرمندان هیپ هاپ از جمله نلی، گوچی مانه و فلو ریدا، راک های آلترناتیو Third Eye Blind و Empire هنرمند موسیقی الکترونیکی از Third Eye Blind و Empire را دریافت کنند. فروش بلیط ها از 6 نوامبر در ساعت 10 صبح به وقت محلی آغاز می شود. والن Been By Now در حال حاضر در جدول کانتری ایرپلی بیلبورد شماره 1 است و چهارمین شماره 1 او در سال 2026 و بیست و سومین شماره 1 او در مجموع در این نمودار است. این ستاره کانتری از طریق بنیاد مورگان والن خود", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/P1023JD0-e1770312008806.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۱ آبان • ۲۰:۰۲"}, {"source": "Billboard", "title": "Here’s How My Chemical Romance Reacted to Earning Its First Billboard 200 No. 1 Album", "link": "https://www.billboard.com/music/rock/my-chemical-romance-the-black-parade-number-1-band-reacts-1236371933/", "summary": "We ll carry on. My Chemical Romance did just what the band sang in Welcome to the Black Parade, and 20 years later, after its deluxe reissue of The Black Parade for the album s anniversary arrived, the set has hit the summit on the Billboard 200 on the chart dated Nov. 7. Related My Chemical Romance Earns First No. 1 Album on Billboard 200 After ‘The Black Parade’ Reissue My Chemical Romance s The Black Parade at 20: Every Track Ranked My Chemical Romance Score First U.K. No. 1 With 20th Anniversary Edition of ‘The Black Parade’ Not long after the news broke on Sunday (Nov. 1), the band reacted to the news. It reshared Billboard s post to its Instagram Stories and soundtracked it with Miley Cyrus 2013 Billboard Hot 100 No. 1 Wrecking Ball. Above it were eight black heart emojis. The anniversary release arrived on Oct. 23 via Reprise Records. The album earned earned 78,000 equivalent album units in the charting week ending on Oct. 29, according to Luminate, which notes that the number was driven by albums sales, which were up more than 2,000 percent. That led to The Black Parade , which originally debuted at No. 2 in 2006, jumping from No. 139 to No. 1 on the Billboard 200. Upon the set s 20th anniversary release, the band said in a joint statement: Twenty years ago, we wrote what would become The Black Parade , our third record and the follow up to Three Cheers for Sweet Revenge . At the time, we could never have imagined what the record would mean for the band. All we knew is that we had made something crazy, and something we couldn’t wait to get it out into the world … For the first time, we have included everything we finished during those sessions in a single collection. The deluxe version of the album which also nabbed the No. 1 spot on the U.K. s Official Albums Chart dated Oct. 30 included not just the original set in its entirety, but also six bonus tracks. Three of them are fan-favorite B-sides that are found across different releases ( Heaven Help Us, Kill All Your Friends, My Way Home Is Through You ), and another three are live tracks recorded during My Chemical Romance s 2007 tour in support of the album ( Dead!, The Sharpest Lives, Someone Out There Loves You ).", "date_str": "2026-11-02T16:21:54+00:00", "hash": "2f658ef40d17770a", "title_fa": "در اینجا نحوه واکنش My Chemical Romance به کسب اولین آلبوم بیلبورد 200 شماره 1 است.", "summary_fa": "ما ادامه خواهیم داد My Chemical Romance دقیقاً همان کاری را انجام داد که گروه در Welcome to the Black Parade خواند، و 20 سال بعد، پس از انتشار مجدد لوکس The Black Parade برای سالگرد آلبوم، این مجموعه در جدول 7 نوامبر در بیلبورد 200 به قله رسید. Chemical Romance s The Black Rade at 20: Every Track Ranked My Chemical Romance Score اولین شماره در بریتانیا. 1 با انتشار بیستمین سالگرد «رژه سیاه» مدت زیادی پس از انتشار اخبار در روز یکشنبه (1 نوامبر)، گروه به این خبر واکنش نشان داد. این پست بیلبورد را مجدداً در استوری اینستاگرام خود به اشتراک گذاشت و آن را با مایلی سایرس 2013 بیلبورد داغ 100 شماره 1 Wrecking Ball پخش کرد. بالای آن هشت ایموجی قلب سیاه قرار داشت. انتشار سالگرد در 23 اکتبر از طریق Reprise Records منتشر شد. این آلبوم 78000 واحد آلبوم در هفته چارت منتهی به اکتبر به دست آورد. به گزارش Luminate، که اشاره می کند که این تعداد به دلیل فروش آلبوم ها بوده است که بیش از 2000 درصد افزایش داشته است. این منجر به The Black Parade شد که در ابتدا در سال 2006 در رتبه دوم قرار گرفت و از شماره 139 به شماره 1 بیلبورد 200 رسید. پس از انتشار بیستمین سالگرد مجموعه، گروه در بیانیه‌ای مشترک گفت: بیست سال پیش، ما چیزی نوشتیم که به The Black Parade تبدیل می‌شود و به دنبال سومین رکورد ما به The Black Parade تبدیل می‌شود. در آن زمان، هرگز نمی توانستیم تصور کنیم که این رکورد چه معنایی برای گروه دارد. تنها چیزی که می‌دانستیم این بود که چیزی دیوانه‌کننده ساخته بودیم، و چیزی که نمی‌توانستیم صبر کنیم تا آن را به دنیا عرضه کنیم... برای اولین بار، همه چیزهایی را که در طول آن جلسات به پایان رساندیم در یک مجموعه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/My-Chemical-Romance-Bryce-Hall-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۱ آبان • ۱۹:۵۱"}, {"source": "Billboard", "title": "My Chemical Romance’s ‘The Black Parade’ Finally Tops the Billboard 200: See What Else Was in the Top 10 When It First Debuted in 2006", "link": "https://www.billboard.com/lists/my-chemical-romance-black-parade-billboard-200-top-10-2006/", "summary": "My Chemical Romance ’s The Black Parade vaults from No. 139 to No. 1 on the Billboard 200 dated Nov. 7, 2026 – its 162nd week on the chart. The original edition of the emo classic nearly topped the chart when it was first released in 2006. It debuted at No. 2, just behind the Hannah Montana TV soundtrack, which was also a new arrival that week. The album was boosted by the release of The Black Parade (20th Anniversary Deluxe Edition) , which includes six bonus tracks in addition to the 14 that comprise the LP’s standard edition — three B-sides from the Black Parade era, as well as three live tracks. We thought it would be fun to take a look back at what was in the top 10 when The Black Parade first appeared there – in the week of Nov. 11, 2006. The top 10 that week included artists ranging from Hannah Montana star Miley Cyrus , who was just 13 (she would turn 14 later in the month), to Tony Bennett , who was then 80. Related The Beatles Rubber Soul Is Back in the Top 10 on the Billboard 200: See What Else Was in the Top 10 When It First Appeared There in 1966 MCR was one of five rock bands in the top 10 that week. The others: The Killers , Nickelback , Hinder and Evanescence . Six of the albums in the top 10 that week spawned at least one top 10 hit on the Billboard Hot 100. Justin Timberlake ’s career peak, FutureSex/Love Sounds , spun off four, including three that reached No. 1. Nickelback’s All The Right Reasons , also that band’s career peak, spawned three top 10 hits. Diddy ’s Press Play yielded two. Let’s zoom back in time to look at the albums in the top 10 on Nov. 11, 2006. We show the producers of each album and the peak position each album attained.", "date_str": "2026-11-02T16:04:06+00:00", "hash": "9630ba1ebc0b1ea0", "title_fa": "\"The Black Rade\" از My Chemical Romance سرانجام در صدر بیلبورد 200 قرار گرفت: ببینید چه چیز دیگری در 10 فیلم برتر در اولین بار در سال 2006 عرضه شد.", "summary_fa": "My Chemical Romance's The Black Rade از شماره 139 تا شماره 1 بیلبورد 200 مورخ 7 نوامبر 2026 - صد و شصت و دومین هفته آن در جدول قرار دارد. نسخه اصلی کلاسیک ایمو تقریباً در صدر جدول زمانی قرار گرفت که برای اولین بار در سال 2006 منتشر شد. این اولین بار در رتبه دوم قرار گرفت، درست پس از موسیقی متن تلویزیون هانا مونتانا، که در آن هفته نیز تازه وارد شد. این آلبوم با انتشار The Black Parade (نسخه لوکس بیستمین سالگرد) تقویت شد، که شامل شش قطعه جایزه به اضافه 14 قطعه است که شامل نسخه استاندارد LP است - سه B-sides از دوران Black Parade، و همچنین سه آهنگ زنده. ما فکر می‌کردیم جالب است که نگاهی به آنچه در 10 فیلم برتر وجود داشت زمانی که The Black Rade برای اولین بار در آنجا ظاهر شد - در هفته 11 نوامبر 2006 داشته باشیم. 10 نفر برتر آن هفته شامل هنرمندانی از هانا مونتانا، مایلی سایرس، که فقط 13 سال داشت (او بعداً در ماه 14 ساله می شد)، تا تونی بنت، که در آن زمان 80 ساله بود، شامل هنرمندانی می شد. یکی از پنج گروه راک در 10 گروه برتر آن هفته بود. بقیه: قاتلان، نیکل بک، هندر و اوانسنس. شش آلبوم از 10 آلبوم برتر در آن هفته حداقل یک مورد از 10 آلبوم برتر را در 100 آلبوم داغ بیلبورد به دست آوردند. اوج حرفه ای جا .", "date_str": "2026-11-02T17:00:00+00:00", "hash": "12e069bb672ee0ea", "title_fa": "نتفلیکس «Jack of Spades» جوئل کوئن را خریداری کرد و برای فصل آینده اسکار برنامه ریزی کرد.", "summary_fa": "در این فیلم که جوئل و اتان کوئن را از جمله نویسندگانش می‌دانند، پتسی فران برنده جایزه اولیویه، جاش اوکانر برنده گلدن گلوب، دامیان لوئیس برنده گلدن گلوب و لسلی منویل نامزد اسکار بازیگرانی هستند. نتفلیکس برای این فصل اسکار یک صفحه کامل دارد - رقبای آن عبارتند از La Bola Negra، 14th، Possible Love، Ray Gunn، Ink، Gentle Monster، The Mosquito Bowl، Avedon و In Waves - اما این باعث نشد که پخش کننده برای فصل بعدی اسکار برنامه ریزی کند. پخش کننده حق پخش جهانی فیلم کارگردانی بعدی جوئل کوئن، Jack of Spades را به دست آورده است که بر اساس رمان ۱۹۰۱ فرانسیس فردریکا مونترزور به نام بیگانه: داستانی از قرون وسطی است و به عنوان یک معمای گوتیک شوم مملو از دسیسه و خیانت در اتمسفریک اسکاتلندی توصیف می شود. این فیلم که تولید آن در اوایل سال جاری به پایان رسید، در پاییز 2027 و پیش از اکران روی پلتفرم در سینماها اکران خواهد شد. و این شرکت آن را به عنوان یک چشم انداز اصلی جوایز می بیند. داستان‌های مرتبط تلویزیون دروسکی با نتفلیکس قرارداد امضا می‌کند، مجموعه کمدی کلیسایی جمع‌آوری ستایش کسب‌وکار نتفلیکس اخراج‌ها در بریتانیا، با معاون، تولید آنا مالت در میان 2 تا 3 درصد از کارکنان تحت تأثیر قرار می‌گیرند. دامیان لوئیس برنده گلدن گلوب و لسلی منویل نامزد اسکار. جوئل کوئن آن را با برادرش اتان (هر دو برای فیلم No Country for Old Men در سال 2007 برنده چندین جایزه اسکار شدند) و همچنین النور کاتن و کانر مک فرسون نوشت. و آن را به همراه همسرش فرانسیس مک دورمند (که برنده جایزه اسکار برای تهیه کنندگی Nomadland 2020 شد و همچنین تهیه کننده فیلم تراژدی مکبث محصول 2021 همسرش بود) و همچنین استیون رالز، Blueprint Pictures گراهام برادبنت و پیتر گراف، و رابرت گراف، براش نقاشی هندی", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/GettyImages-2300603366_5c7a6d.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۱۱ آبان • ۲۰:۳۰"}, {"sou  because once the top 12 is set, fans can vote via text and TikTok to send one final artist to the Live Shows. While Levine has been through the process many times before, he says he s surprised by just how much fun he s still having. The chemistry between the four of us is insane, he says. You never know with those types of things what it ll be. Levine already knew Clarkson and Queen Latifah, but Green was a new addition to his Voice buddies. The two, however, clicked almost immediately. We got along kind of from the jump super well, Levine says. I love Queen and obviously I love Kelly. So it was just easy and fun. The easy chemistry translates into the competition itself, where Levine notes that the four coaches are all fiercely competitive, but without the kind of animosity that can sometimes come with fighting over artists. We were all really competitive, but in such a respectful way, he says. I really respect the guys I m working with. I love this foursome. It s really great. That doesn t mean the competition isn t intense. We fought hard, Levine says. Like, you know, it gets your heart beating fast and you re competing [at the end of the day]. There s no doubt about that, but it s all done with respect and lov", "date_str": "2026-11-02T16:00:00+00:00", "hash": "67b03950a7aea7b3", "title_fa": "آدام لوین در فیلم The Voice در کات ویک هفته صحبت می‌کند و رایلی گرین را «بلیک جوان‌تر، خنده‌دارتر و خوش‌نظرتر» می‌خواند.", "summary_fa": "آدام لوین آنقدر روی صندلی های قرمز بزرگ The Voice نشسته است تا به یاد بیاورد که چه زمانی کاملاً عجیب به نظر می رسیدند. لوین به بیلبورد می گوید وقتی ما این نمایش را شروع کردیم، صدایی وجود نداشت. این قالب قبلاً به موفقیت بزرگی در خارج از کشور در هلند تبدیل شده بود، اما زمانی که نمایش به ایالات متحده آمد، حتی مربیان هم مطمئن نبودند که وارد چه چیزی می شوند. به یاد دارم روز اولی که فکر می کردیم، این صندلی های بزرگ قرمز و احمقانه چیست و ما باید چه کار کنیم؟ The Voice مرتبط: Mower Cade Turn Four-Cair Turn Cade Mower بعد از دور نبرد ادامه می دهد برندگان The Voice: کدام مربی خواننده هر فصل برنده می شد؟ آدام لوین توسط کاور Black Sabbath در The Voice پخش می شود The Voice اکنون در سی امین فصل خود است و آن صندلی ها یکی از شناخته شده ترین قطعات در تلویزیون موسیقی هستند و لوین در یکی از آنها بازگشته است. برای فصل 30، لوین به کلی کلارکسون مربی بازگشته و رایلی گرین و کوئین لطیفه برای اولین بار مربیان برای دوره جدیدی از The Voice می‌پیوندد، که شامل پیچ و تاب هفته Cut است که از قسمت امشب (2 نوامبر) شروع می‌شود. Cut Week بزرگترین حذف در تاریخ The Voice را رقم خواهد زد، زمانی که هر مربی دو خواننده را مستقیماً به برنامه های زنده می فرستد، زیرا پنج شرکت کننده دیگر برای یک مکان باقی مانده در هر تیم مبارزه می کنند. بینندگان نیز می‌توانند در این ترکیب شرکت کنند، زیرا پس از تنظیم ۱۲ نفر برتر، طرفداران می‌توانند از طریق متن و TikTok رای دهند تا یک هنرمند نهایی را به برنامه‌های زنده بفرستند. در حالی که لوین بارها قبلاً این روند را طی کرده است، او می گوید", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/NUP_211393_00200-e1793385783635.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۱ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Taylor Swift & Jack Antonoff, Ludwig Göransson Nominated for Hollywood Music in Media Awards: Full List", "link": "https://www.billboard.com/lists/hollywood-music-in-media-awards-2026-nominations-list/", "summary": "I Knew It, I Knew You,’’ which Taylor Swift and Jack Antonoff wrote for Toy Story 5 , is nominated for song – animated film at the 2026 Hollywood Music in Media Awards (HMMA). Ludwig Göransson received three nods for his work on The Odyssey — one for the score, one for the song “When I’m Home” (co-written with fellow nominees James Blake , Travis Scott and Christopher Nolan), and one for the song’s music video. Last year, Göransson won two HMMAs for his work on Sinners and went on to win both the Oscar and Golden Globe for best original score. “I Knew It, I Knew You” and The Odyssey are thought to be the front-runners to win the Oscars for best original song and best original score, respectively, though there’s a long road ahead. Related Inside Toy Story 5 World Premiere: Taylor Swift Randy Newman s Friendly Duet More Magical Moments The Hollywood Music in Media Awards (HMMA) announced its slate of 2026 nominees for scores and songs in film and other visual media categories on Monday (Nov. 2), nearly three months before the Oscar nominations will be announced on Jan. 21. The 17th annual Hollywood Music in Media Awards (HMMA) will be held on Wednesday, Nov. 18 at the historic Avalon Hollywood in Hollywood. Composers Daniel Pemberton and Mina Samy received the most individual nominations with four each. Pemberton is nominated for his scores for the films Project Hail Mary and The Drama , the series Slow Horses, and for the song “Let Me Sell You a Dream” from Musk, which he co-wrote with David Byrne. Samy is nominated for his scores for the film Ezma and the short film Stopped and received nods for both the score and main title theme for the foreign-language TV series The Death Ward . Legendary songwriter Diane Warren received a nomination for “One Right Here” from Maserati: The Brothers , performed by Andrea Bocelli and Jennifer Hudson . Last year, Warren won her second HMMA for song documentary film for “Dear Me” from Diane Warren: Relentless, which also won an HMMA for documentary. The films Behemoth!, The Odyssey, Michael, Brother Verses Brother and Linda Perry: Let It Die Here received the most nominations, with three each. The HMMAs honor composers, songwriters, music supervisors and artists for outstanding contributions to music in film, television, video games, and other visual media. Last year, HMMA winners included “Golden” from K-Pop Demon Hunters and the original score for Sinners ; both went on to win Oscars. Special performances at the Nov. 18 s", "date_str": "2026-11-02T16:00:00+00:00", "hash": "6828de228506aa17", "title_fa": "تیلور سوئیفت و جک آنتونوف و لودویگ گورانسون نامزدهای موسیقی هالیوود در جوایز رسانه: فهرست کامل", "summary_fa": "من آن را می دانستم، تو را می شناختم» که تیلور سویفت و جک آنتونوف برای داستان اسباب بازی 5 نوشتند، نامزد آهنگ – فیلم انیمیشن در جوایز هالیوود موسیقی در رسانه ها (HMMA) 2026 است. لودویگ گورانسون برای کارش در The Odyssey سه جایزه دریافت کرد - یکی برای موسیقی، یکی برای آهنگ \"When I'm Home\" (نوشته شده با نامزدهای دیگر جیمز بلیک، تراویس اسکات و کریستوفر نولان)، و یکی برای موزیک ویدیوی آهنگ. سال گذشته، گورانسون دو جایزه HMMA را برای کارش در فیلم گناهکاران دریافت کرد و در ادامه هر دو جایزه اسکار و گلدن گلوب را برای بهترین موسیقی اورجینال دریافت کرد. تصور می‌شود که «I Knew It, I Knew You» و The Odyssey به ترتیب نامزدهای دریافت جایزه اسکار برای بهترین آهنگ اصلی و بهترین موسیقی متن هستند، اگرچه راه طولانی در پیش است. مربوط به داستان اسباب بازی 5 اولین نمایش جهانی: دوئت دوستانه تیلور سویفت رندی نیومن، لحظات جادویی بیشتر جوایز هالیوود موسیقی در رسانه (HMMA) فهرست نامزدهای سال 2026 خود را برای موسیقی و آهنگ در دسته های فیلم و سایر رسانه های تصویری در روز دوشنبه (2 نوامبر) اعلام کرد. تقریباً سه ماه قبل از مراسم سالانه موسیقی در 1 ژانویه، نامزدی سالانه موسیقی هالیوود در 1 ژانویه اعلام شد. جوایز (HMMA) چهارشنبه 18 نوامبر در سالن تاریخی آوالون هالیوود در هالیوود برگزار می شود. آهنگسازان دانیل پمبرتون و مینا سامی هر کدام با چهار نامزدی بیشترین نامزدی را دریافت کردند. پمبرتون برای آهنگ‌هایش برای فیلم‌های Project Hail Mary و The Drama، سریال Slow Horses، و برای آهنگ Let Me Sell You a Dream از ماسک، که با همکاری دیوید برن نوشته شده، نامزد شده است. سامی برای موسیقی‌هایش برای فیلم ازما و فیلم کوتاه متوقف شد، نامزد دریافت موسیقی متن و موضوع اصلی سریال خارجی زبان The Death Ward شد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/06/taylor-swift-jessie-toy-story-5-premiere-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۱ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "‘The Hunger Games: Sunrise on the Reaping (The Album)’ to Feature Ella Langley, Tyler Childers, Stevie Nicks & More: ‘Great Artists & Great Music’", "link": "https://www.billboard.com/music/music-news/the-hunger-games-sunrise-on-the-reaping-album-ella-langley-1236371836/", "summary": "When The Hunger Games: Sunrise on the Reaping (The Album) arrives Nov. 13 on MCA, with a slate of songs inspired by the upcoming latest film in The Hunger Games franchise, the 29-song album will feature an eclectic lineup of artists spanning rock, country, Americana, pop and more. Ella Langley joins on “Here Then We’re Gone,” with the star-studded album also featuring Stephen Wilson Jr. ( First in Line ), Stevie Nicks ( Doing The Best That I Can (Arena Mix) ), Tyler Childers (“Old Money”), The Smashing Pumpkins (“Black Stars”) and Noah Kahan (“Draw You Out”), among others. “We got to live the fantasy league of dream artists we wanted to work with,” Dave Cobb, the project s Grammy-winning executive producer, tells Billboard . “And the through line of all of it is honesty. I think people listen to music in such a varied way. So this is really all the things we love about great artists and great music.” The Lionsgate film Hunger Games: Sunrise on the Reaping will release in theaters on Nov. 20. Spearheaded by director Francis Lawrence, the film centers on 16-year-old Haymitch Abernathy from District 12, and begins the morning of the reaping for the 50th annual Hunger Games. Set 24 years prior to the events in the original Hunger Games trilogy, the movie follows Abernathy as he attempts to put a stop to the Hunger Games from inside the arena. Accordingly, the soundtrack weaves in a myriad of emotional profiles. “The record has so many layers. It has triumph, sadness, and it has loss and it has love,” Cobb says. “I think that s the way we looked at everything, songs that would fit every emotion that the movie has. Definitely, we talked to some of the artists about what we were looking for. Most of the artists, they loved the franchise already. They d read the book. It was incredible to see how excited people were.” Some artists, like Noah Cyrus (“Ash and Snow”), were inspired by specific characters from the franchise. Cobb recalled that Gigi Perez ( Favor ) was the first to send in music for the project. Gigi Perez was the first person we got a song back from, and she had been such a massive fan [of The Hunger Games ], knew every detail, Cobb recalls. One of the many highlights for Cobb on the album was The Smashing Pumpkins’ contribution “Black Stars.” “We talked about the feeling, and it was really cool — because he called Butch Vig, who produced [the Pumpkins’ 1993 sophomore album] Siamese Dream and the stuff that got me into Smash Pumpkins,” Cobb says. “It ", "date_str": "2026-11-02T15:34:19+00:00", "hash": "e74d444bcca483a4", "title_fa": "«بازی‌های گرسنگی: طلوع آفتاب در درو (آلبوم)» با حضور الا لنگلی، تایلر چایلدرز، استیوی نیکس و بیشتر: «هنرمندان بزرگ و موسیقی عالی»", "summary_fa": "وقتی The Hunger Games: Sunrise on the Reaping (آلبوم) در 13 نوامبر در MCA می آید، با مجموعه ای از آهنگ های الهام گرفته از جدیدترین فیلم آینده مجموعه The Hunger Games، این آلبوم 29 آهنگی شامل مجموعه ای متنوع از هنرمندان راک، کانتری، آمریکایی، پاپ و غیره خواهد بود. الا لنگلی با آلبوم پر ستاره که استیون ویلسون جونیور نیز در آن حضور دارد به «Here then We're Gone» می‌پیوندد. (اول در ردیف)، استیوی نیکس (انجام بهترین چیزی که می توانم (آرنا میکس))، تایلر چایلدرز (\"پول قدیمی\")، کدو تنبل های شکسته (\"ستاره های سیاه\") و نوآ کاهان (\"تو را بیرون بکش\") و دیگران. دیو کاب، تهیه کننده اجرایی پروژه برنده جایزه گرمی، به بیلبورد می گوید: «ما باید لیگ فانتزی هنرمندان رویایی را که می خواستیم با آنها کار کنیم، زندگی کنیم. \"و خط اصلی همه آن صداقت است. من فکر می کنم مردم به موسیقی به شیوه ای متنوع گوش می دهند. بنابراین این واقعاً تمام چیزهایی است که ما در مورد هنرمندان بزرگ و موسیقی عالی دوست داریم.» فیلم Lionsgate Hunger Games: Sunrise on the Reaping در تاریخ 20 نوامبر در سینماها اکران می شود. این فیلم به رهبری کارگردان فرانسیس لارنس، بر روی هیمیچ آبرناتی 16 ساله All I Want for Christmas Is You.” [ ]", "date_str": "2026-11-02T15:24:28+00:00", "hash": "3cec031de9808741", "title_fa": "ماریا کری دونز خز و سایه در کمپین تعطیلات گوچی «همه چیزی که برای کریسمس می خواهم تو هستی» گوچی", "summary_fa": "ماریا کری رسماً به وظیفه کریسمس بازگشته است و امسال گوچی را برای جشن ها همراه می کند. این خانه مد مجلل، ملکه کریسمس خودخوانده را برای بازی در کمپین تعطیلات سال 2026 خود، به کارگردانی هارمونی کورین، فیلمساز و فیلم موفقیت آمیز همیشگی کری، \"همه چیزی که برای کریسمس می خواهم، تو هستی\" انتخاب کرده است. [ ] نقطه کریسمس توسط هارمونی کورین هلمر Spring Breakers کارگردانی شده است. اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. فیلم کمپین جدید در داخل یک هتل مجلل اتفاق می‌افتد، جایی که کارکنان مشغول آماده‌سازی برای ورود ستاره پاپ هستند. تزیینات دقیق و آماده سازی بیش از حد برای تعطیلات، صحنه را برای کری، که ظاهراً با پوشیدن قطعاتی از کلکسیون ویژه پروانه جدید گوچی، به نشانه علاقه دیرینه خواننده به حشره بالدار و آلبوم او به همین نام در سال 1997، آماده کرد. داستان‌های مرتبط KPop Demon Hunters، ستاره‌های بازی ماهی مرکب در دهه کرۀ نتفلیکس در نقش تد ساراندوس به تانتارا، همه ما مرده‌ایم فصل دوم مایکل: گلدن گلوب ارسال را رد می‌کند تا در دسته‌های کمدی/موزیکال رقابت کند. سلطنت چندین دهه در فصل تعطیلات. این دومی به بخش ویژه ای از کارنامه خواننده تبدیل شده است، با تک آهنگ او در سال 1994 \"All I Want for Christmas Is You\" تقریبا هر ماه دسامبر، بیش از سه دهه پس از انتشار، به صدر جدول بازمی گردد. در این میان کورین یک انتخاب غیر متعارف برای تبلیغات سنتی تعطیلات است.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Screenshot-2026-11-02-at-2.43.38-PM.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۱۱ آبان • ۱۸:۵۴"}, {"source": "Variety", "title": "Inside NBC News’ Bid to Break Out From Election-Night Pack", "link": "https://variety.com/2026/tv/news/inside-nbc-news-midterm-election-night-break-out-tv-1236937405/", "summary": "Tom Llamas says that on Election Night, he’ll stay up late by sipping espresso that he takes the same way he likes his news without sugar. Hard facts are likely to surface quickly as different precincts, counties and states tabulate their votes in an election that could change control of Congress. The espresso may [ ]", "date_str": "2026-11-02T15:20:00+00:00", "hash": "12d5358d9d28784e", "title_fa": "پیشنهاد NBC News برای خروج از بسته شب انتخابات", "summary_fa": "تام لاماس می‌گوید که در شب انتخابات، با نوشیدن اسپرسو تا دیروقت بیدار می‌ماند، همان‌طور که اخبارش را بدون شکر دوست دارد. حقایق سخت احتمالاً به سرعت آشکار می شوند زیرا حوزه ها، شهرستان ها و ایالت های مختلف آرای خود را در یک انتخابات جدول بندی می کنند که می تواند کنترل کنگره را تغییر دهد. اسپرسو ممکن است [ ] در مجموع، NBC 13 ساعت پوشش خبری انتخابات را فقط در تلویزیون، از ساعت 5 بعد از ظهر، پخش خواهد کرد. زمانی که جکسون پوشش خبری را آغاز می کند و تا ساعت 6 صبح ادامه می یابد. با حضور کریگ ملوین و کیت اسنو در ساعات اولیه صبح. این نوع تناژ محض معمولاً برای رقابت های ریاست جمهوری در نظر گرفته می شود. لاماس که هر روز چندین جلسه مطالعه برگزار می‌کند تا مطمئن شود از عواملی که ممکن است بر نحوه رأی‌دهی ایالت‌های مختلف تأثیر بگذارد، می‌گوید: «این زمانی است که بینندگان بیشترین نیاز را به ما دارند. او در یک مصاحبه اخیر می‌گوید: «این یکی از مهم‌ترین شغل‌های ماست، اگر نگوییم مهم‌ترین شغل». مارک گرینشتاین، معاون اجرایی NBC News که بر بسیاری از عناصر مرتبط با پخش انتخابات نظارت می‌کند، می‌گوید: «بدیهی است که افراد زیادی در حال حاضر محتوای زیادی تولید می‌کنند، اما ما سطحی از اعتبار و مقیاس داریم. NBC می تواند در دورانی که بسیاری از شرکت های رسانه سنتی با مالکیت جدید دست و پنجه نرم می کنند، به دنبال دستیابی به زمین جدید باشد. CBS News و CNN اکنون بخشی از Skydance هستند، جایی که حامیان روزنامه نگاری به حرکت های خانواده کنترل کننده الیسون در اطراف CBS با شک و تردید نگاه می کنند. MS NOW با استفاده از نامی که تنها یک سال از عمر آن می گذرد، از NBCU جدا شده و اکنون بخشی از شرکت رسانه", "image_url": "https://variety.com/wp-content/uploads/2026/10/NBC-News-Tom-Llamas-Steve-Kornacki-Kristen-Welker.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۱ آبان • ۱۸:۵۰"}, {"source": "Variety", "title": "Can Abuse Allegations Against a Celebrity Be Silenced Over Mental Health Claims? A Defamation Lawyer Explains the Unusual Case Gripping the U.K.", "link": "https://variety.com/2026/global/global/anonymous-celebrity-abuse-allegations-uk-court-explained-1236936658/", "summary": "As has been widely reported on both side of the Atlantic, a well-known individual in the U.K. is currently waiting to hear whether his legal effort to block two media outlets from publishing allegations of inappropriate and exploitative sexual activity with girls and young women has been successful. Lawyers for the individual — who denies the [ ]", "date_str": "2026-11-02T15:09:26+00:00", "hash": "819afc41865db633", "title_fa": "آیا می توان اتهامات سوء استفاده علیه یک سلبریتی را نسبت به ادعاهای مربوط به سلامت روان ساکت کرد؟ یک وکیل افترا درباره پرونده غیرمعمولی که در بریتانیا گرفتار شده است توضیح می دهد", "summary_fa": "همانطور که به طور گسترده در دو طرف اقیانوس اطلس گزارش شده است، یک فرد شناخته شده در بریتانیا در حال حاضر منتظر است تا بشنود آیا تلاش قانونی او برای جلوگیری از انتشار اتهامات جنسی نامناسب و استثمارگرانه با دختران و زنان جوان توسط دو رسانه موفق بوده است یا خیر. وکلای این فرد - که [ ] را انکار می کند، استدلال تیم حقوقی استدلالی است که خودشان اذعان کرده اند که بسیار استثنایی است - که انتشار اتهامات علیه فرد و افشای هویت او به احتمال زیاد او را به خودکشی سوق می دهد. این پرونده غیرمعمول در میان گمانه زنی های گسترده در رسانه های اجتماعی در مورد هویت افراد مشهور به کانون اصلی بحث در بریتانیا تبدیل شده است. اما آیا این استدلال - این که انتشار یک تأثیر بالقوه کشنده خواهد داشت - واقعاً از نظر قانونی پابرجاست؟ به گفته پل توید - یک وکیل مشهور افترا از ایرلند شمالی که وکالت تعدادی از مشتریان مشهور از جمله هریسون فورد، بریتنی اسپیرز، جنیفر لوپز و جاستین تیمبرلیک را داشته است. توید اذعان می‌کند که چنین احکام حفظ حریم خصوصی افراد مشهور، که زمانی در رسانه‌های بریتانیا بدنام بود (اغلب از آنها به عنوان دستورات فوق‌العاده یاد می‌شد، اگرچه این، از نظر فنی، گزارش در مورد وجود خود دستور را نیز ممنوع می‌کند)، به امری نادر تبدیل شده است. اما او می گوید که ادعای حقوقی این فرد در دادگاه قابل قبول است. او ادعا می کند که تهدید جانی، در صورت وجود خطر واقعی خودکشی، یکی از معدود دلایل اصلی است که برای حکمی مانند این در دنیای امروز باقی مانده است. اما این باید توسط یک روانپزشک صالح و هر گونه حمایت پزشکی دیگری که دادگاه به آن نیاز دارد تأیید شود.", "image_url": "https://variety.com/wp-content/uploads/2026/11/GettyImages-2285045132.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۱ آبان • ۱۸:۳۹"}, {"source": "Variety", "title": "Dominic West, John Cleese, Portia de Rossi Join Jeff Daniels in Trudie Styler’s Comedy ‘The Reception’ (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/dominic-west-john-cleese-trudie-stylers-the-reception-1236937454/", "summary": "Dominic West (“The Crown”), John Cleese (“A Fish Called Wanda”) and Portia de Rossi (“Arrested Development”) have joined Jeff Daniels in “The Reception,” Trudie Styler s ensemble comedy. Beta Cinema is launching international sales on the project at the American Film Market, which kicks off Nov. 10. CAA is representing domestic rights. The cast also includes [ ]", "date_str": "2026-11-02T15:07:04+00:00", "hash": "3f0eb58d4b5f8b44", "title_fa": "دومینیک وست، جان کلیز، پورتیا د روسی به جف دانیلز در کمدی «پذیرایی» اثر ترودی استایلر (اختصاصی) می‌پیوندند.", "summary_fa": "دومینیک وست («تاج»)، جان کلیس («ماهی به نام واندا») و پورتیا دی روسی («توسعه دستگیر شده») به جف دانیلز در «پذیرایی»، کمدی گروه ترودی استایلر پیوستند. سینمای بتا فروش بین‌المللی این پروژه را در بازار فیلم آمریکا آغاز می‌کند، که از 10 نوامبر آغاز می‌شود. CAA نماینده حقوق داخلی است. بازیگران همچنین شامل [ ] سینمای بتا فروش خود را در بازار فیلم آمریکا راه اندازی خواهد کرد، در حالی که CAA نماینده حقوق داخلی است. دومینیک وست («تاج»)، جان کلیس («ماهی به نام واندا») و پورتیا دی روسی («توسعه دستگیر شده») به جف دانیلز در «پذیرایی»، کمدی گروه ترودی استایلر پیوستند. برونسون پینچوت (پلیس بورلی هیلز)، نیکلاس موری (با مامور من تماس بگیرید)، آلیت راس (السینور)، الیوت سامنر (حس و حس)، لوئیس فلمینگ، ویل مریک (پوست)، باربارا مارتن (دانیل دی سینار) و دانیل دی انگلند، و دانیل دِنِسیار: داستان‌های مرتبط با «وسواس»، آیا مسابقه کمدی گلدن گلوب خانه جدیدی برای تقلب در دسته‌بندی است؟ KPop Demon Hunters به ​​زودی در برنامه بازی Toca Boca World که در یک ملک بزرگ اسکاتلندی تنظیم شده است، \"The Reception\" یک جشن عروسی را دنبال می کند که با وجود غیبت عروس و داماد برگزار می شود. پس از اینکه فلیکس ویکتوریا را در محراب رها می‌کند، خانواده‌ها و دوستان آن‌ها مجبور می‌شوند یک پذیرایی عجیب و غریب را انجام دهند که به سرعت از کنترل خارج می‌شود. در حالی که مهمانان تلاش می کنند تا ظاهر خود را حفظ کنند، جشن ها جای خود را به مجموعه ای از بلایا، حوادث کمیک و ارتباطات غیرمنتظره می دهند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Berlin-International-Filmfestival-Berlinale-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "سینما و سریال", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۱۱ آبان • ۱۸:۳۷"}, {"source": "Billboard", "title": "Emilia Talks New Era, ‘Bodypainting’ Song, Her Next Album & How Zara Larsson Collab ‘Girl’s Girl’ Happened | Cafecito Con", "link": "https://www.billboard.com/video/emilia-bodypainting-next-album/", "summary": "Emilia sits down with Billboard News over coffee in Miami to talk about her new single “Bodypainting,” the pressure of leveling up after MP3 , and what fans can expect from her next album era. She also shares how her collab with Zara Larsson, “Girl s Girl (Girls Trip), came together, reflects on performing at Coachella with Luísa Sonza, and explains why Miami has become a key place for studio sessions and finishing album details. Plus, Emilia opens up about staying grounded in Nogoyá, Argentina, her fitness routine as therapy, fashion week moments and answers unexpected “Hot Coffee Pot” questions—like whether she gets jealous and if she uses a hotel alias. Emilia You don t know. We got an email from Zara Larsson s team that wants to do a song with you and me [laughs] What? No. Wow. I don t know if you re sure about this information you re giving me. Don t get my hopes up. Jessica Roiz Hi, friend, how are you? It s been so long. Emilia Very well, and you? Jessica Roiz So happy to be catching up here over a little coffee. Emilia Me too. Jessica Roiz I see you with your flow. We re here today at Studio 24 Coffee. First time I ve been here. Emilia Me too. Jessica Roiz [laughs] OK. Welcome. Emilia I want to say a matcha girl. Emilia Jessica Roiz Matcha girl. [they laugh] Emilia I got into that, I got in. What do you want? I think are you for coffee or for matcha? Jessica Roiz I m going to try the tiramisu latte. Emilia Me too. Jessica Roiz But can you make it skinny? Cashier Yes, of course. Emilia Very good choice. I m going to go a bit more traditional, I think. Um, the iced matcha latte. Cashier Yes. Emilia Can it be with oat milk? Cashier Of course. Emilia Perfect. Cashier Right away, I ll bring them to you. Emilia Jessica Roiz Thank you so much. Watch the full video above!", "date_str": "2026-11-02T15:00:00+00:00", "hash": "3a9bf6168659c72a", "title_fa": "Emilia Talks New Era، آهنگ «Bodypainting»، آلبوم بعدی او و چگونه Zara Larsson Collab «Girl's Girl» اتفاق افتاد | Cafecito Con", "summary_fa": "امیلیا در میامی با بیلبورد نیوز سر خوردن قهوه می نشیند تا در مورد تک آهنگ جدیدش «Bodypainting»، فشار بالا رفتن سطح بعد از MP3 و آنچه طرفداران می توانند از دوره آلبوم بعدی او انتظار داشته باشند صحبت کند. او همچنین به اشتراک می گذارد که چگونه همکاری خود با زارا لارسون، \"Girl s Girl (Girls Trip) گرد هم آمد، درباره اجرای کواچلا با لوئیزا سونزا فکر می کند، و توضیح می دهد که چرا میامی به مکانی کلیدی برای جلسات استودیو و تکمیل جزئیات آلبوم تبدیل شده است. به علاوه، امیلیا در مورد ماندن در نوگویا، آرژانتین، برنامه تناسب اندام خود به عنوان درمان، لحظات هفته مد و پاسخ به سؤالات غیرمنتظره «قهوه داغ» صحبت می کند - مانند اینکه آیا حسادت می کند و آیا از نام مستعار هتل استفاده می کند یا خیر. امیلیا تو نمی دانی ما یک ایمیل از تیم زارا لارسون دریافت کردیم که می‌خواهد با من و شما آهنگی بسازد [می‌خندد] چه؟ نه عجب نمی دانم در مورد این اطلاعاتی که به من می دهید مطمئن هستید یا خیر. امیدم را از دست نده جسیکا رویز سلام، دوست، خوبی؟ خیلی طولانی شده امیلیا خیلی خوب، و شما؟ جسیکا رویز خیلی خوشحالم که با یک قهوه به اینجا می رسم. امیلیا من هم همینطور جسیکا رویز من شما را با جریان خود می بینم. ما امروز اینجا در استودیو 24 قهوه هستیم. اولین بار است که اینجا هستم امیلیا من هم همینطور جسیکا رویز [با خنده] باشه. خوش آمدید. امیلیا می خواهم بگویم یک دختر ماچا. امیلیا جسیکا رویز ماچا دختر. [می خندند] امیلیا من وارد آن شدم، وارد شدم. چه می خواهی؟ فکر کنم قهوه میخوری یا ماچا؟ جسیکا رویز من قصد دارم لاته تیرامیسو را امتحان کنم. امیلیا من هم همینطور جسیکا رویز اما آیا می توانید آن را لاغر کنید؟", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Cafecito-Con-Thumbnails-Emilia-1920x1080-V2.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۱ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "My Chemical Romance’s ‘The Black Parade’ at 20: Every Track Ranked", "link": "https://www.billboard.com/lists/my-chemical-romances-the-black-parade-best-songs-ranked/", "summary": "Where do we go when we die? The pharaohs thought we’d need our earthly possessions, so they got buried along with them; today, surveys suggest a solid third of Americans believe in ghosts. My Chemical Romance frontman Gerard Way thought death transported us to a poignant moment from our lives — like when his father took him into the city to see a marching band. When My Chemical Romance — Way, his bassist brother Mikey, guitarists Frank Iero and Ray Toro, and drummer Bob Bryar — released The Black Parade on October 23, 2006, they were emo up-and-comers seeking to be the world’s greatest rock band. They were fresh off playing Warped Tour parking lots with Fall Out Boy, and opening arenas for Green Day while they toured on their smash rock opera, American Idiot . To follow their 2004 breakthrough Three Cheers for Sweet Revenge , the Jersey quintet escaped to L.A. s long-rumored-to-be-haunted Paramour Mansion with Idiot producer Rob Cavallo to record their magnum opus. Commercially, The Black Parade performed well: It sold 240,000 copies its opening week, but ultimately finished second on the Billboard 200 to the Hannah Montana soundtrack’s 281,000. But this week, two decades later, My Chemical Romance finishes the job by reaching the top of the Billboard 200 (on the chart dated Nov. 6) for the first time. Their 20th anniversary deluxe edition of The Black Parade (released Oct. 23 on Reprise) propels the set to No. 1, backed by an ongoing reunion tour that’s earned them an army of new fans. There’s a strong argument that MCR is even bigger today than at their MySpace-era apex. Let’s have some fun, and revisit the legacy of arguably the most resonant rock album since Nevermind . We’ve ranked all 14 original Black Parade tracks, along with the four additional B-sides included on the 2026 re-release.", "date_str": "2026-11-02T14:27:12+00:00", "hash": "72b4fd481bd215ae", "title_fa": "«رژه سیاه» از My Chemical Romance در 20: هر آهنگ رتبه‌بندی شده است", "summary_fa": "وقتی می میریم کجا بریم؟ فراعنه فکر می کردند که ما به دارایی های زمینی خود نیاز داریم، بنابراین همراه با آنها دفن شدند. امروزه، نظرسنجی‌ها نشان می‌دهد که یک سوم آمریکایی‌ها به ارواح اعتقاد دارند. جرارد وی، خواننده My Chemical Romance فکر می‌کرد که مرگ ما را به لحظه‌ای دردناک از زندگی‌مان منتقل می‌کند - مانند زمانی که پدرش او را برای دیدن یک گروه موسیقی به شهر برد. هنگامی که My Chemical Romance - Way، برادر بیس‌اش Mikey، گیتاریست‌ها Frank Iero و Ray Toro، و درامر Bob Bryar - The Black Parade را در 23 اکتبر 2006 منتشر کردند، آن‌ها افراد ایم     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
