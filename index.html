rs from the New York Knicks would also appear, like Josh Hart, Karl-Anthony Towns, OG Anunoby, Mikal Bridges, Jose Alvarado and more. Other artists who have been known to appear at SNL in the past, include Timothée Chalamet, Ben Stiller, Alec Baldwin, Mariska Hargitay, Meryl Streep, Harry Styles and others. Where to Watch Saturday Night Live Online for Free For cord-cutters, there are a few ways to watch SNL online, if you don t have cable, especially if you want to watch for free. DirecTV has a five-day free trial , while other streaming services, like Fubo and Hulu + Live TV , also offer free trials, so you can watch for free. EDITOR S PICK DirecTV Get 5-Day Free Trial Comes with a five-day free trial. A subscription to DirecTV gets you access to live TV, local and cable channels, including NBC, at $59.99 per month for the first three months of service ($89.99 per month afterward). The service even offers a five-day free trial to watch for free, if you sign up now. 600+ FREE CHANNELS Sling TV Get Sling TV Sling Orange Blue ", "date_str": "2026-09-26T23:30:00+00:00", "hash": "bd4046bd3b046701", "title_fa": "Jalen Brunson و KATSEYE در \"SNL\": اینجا جایی است که می توان پخش آنلاین فصل 52 را به صورت زنده و رایگان تماشا کرد", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. شنبه (26 سپتامبر)، شنبه شب زنده با اولین قسمت از فصل 52 باز می گردد. این برنامه کمدی اسکچ، سوپراستار نیویورک نیکس و MVP فینال NBA، جالن برانسون را میزبانی می کند، در حالی که گروه دخترانه پاپ KATSEYE به عنوان مهمان موسیقی ایفای نقش می کند. دریافت آزمایشی رایگان 5 روزه DirecTV Brunson و KATSEYE هر دو در حال ساخت SNL خود هستند. با این حال، تنها چهار عضو از شش عضو KATSEYE - دانیلا آوانزینی، لارا راج، مگان اسکیندیل و یونچای جونگ - انتظار می‌رود در طول نمایش اجرا کنند. نحوه تماشای زنده شنبه شب به صورت آنلاین، در یک نگاه: تاریخ: 26 سپتامبر شبکه: مجری NBC، مهمان موزیکال: Jalen Brunson KATSEYE پخش آنلاین: DirecTV، Fubo، Hulu + Live TV، Sling TV، Peacock چه زمانی پخش زنده شنبه شب شروع می شود؟ SNL در روز شنبه (26 سپتامبر) با ساعت شروع 23:30 نمایش داده می شود. ET/PT. کدام شبکه تلویزیونی دارای برنامه زنده شنبه شب است؟ در سال 2026، SNL در تلویزیون NBC پخش می شود. در همین حال، نمایش طرح واریته برای پخش زنده در Peacock در دسترس است. چه کسی در شنبه شب زنده امشب ظاهر می شود؟ SNL به خاطر حضور افراد مشهور در طول نمایش شناخته شده است، بنابراین به احتمال زیاد ممکن است تعدادی از بازیگران مشهور، بازیگران زن و هنرمندان ضبط کننده در این برنامه حضور داشته باشند. از آنجایی که جالن برانسون میزبانی می کند، انتظار می رود که بازیکنان دیگری از نیویورک نیکس نیز ظاهر شوند، مانند جاش هارت، کارل-آنتونی تاونز، OG Anunoby، Mikal"}, {"source": "Billboard", "title": "Chuck Varga, GWAR Founding Member, Dies at 68 After Cancer Battle", "link": "https://www.billboard.com/music/rock/chuck-varga-death-gwar-founding-member-dies-cancer-battle-1236348335/", "summary": "Chuck Varga, a founding member of the costumed heavy metal band GWAR , has died following a battle with cancer. He was 68. Varga’s death was announced Friday (Sept. 25) in a social media post by GWAR bassist Casey Orr, who performs as Beefcake the Mighty. Related Gone But Not Forgotten: Musicians We Lost in 2026 Watch GWAR Turn Chappell Roan s Hit Into a Pink Pony Mosh Pit With Face-Melting Cover GWAR Singer Reacts to Alleged Outrage Over Onstage Murder of Trump Musk Dummies Amid 1st Amendment Crisis: It s Looney Tunes “He was one of a kind. As an artist, as a performer; as a scholar and a gentleman,” Orr wrote on Facebook , noting that Varga died peacefully alongside his wife, Bambi. “I’m better for having known him and the world is lesser for his leaving.” Varga was best known for creating and portraying GWAR’s Sexecutioner character, beginning in 1985. He left the band in 1997 but continued to make occasional appearances with the group before retiring from performing in 2021, according to the band’s website . In his tribute, Orr wrote that Varga is “most likely being welcomed into Valhalla right now” by the late GWAR members Dave Brockie, the band’s longtime frontman who performed as Oderus Urungus, and Cory Smoot, the guitarist who performed as Flattus Maximus. “Raise your glass and tell his tales. Legends never die. Hail Varga! Hail Sexicutioner!” Orr concluded. In June, GWAR launched a fundraiser to help Varga’s family cover the mounting costs of his medical care, including cancer treatments, hospice care, specialized medical equipment and additional nursing support. Donors who contributed to the fundraiser received access to exclusive merchandise created for the campaign, including a new T-shirt designed by Varga. Born in 1958, Varga studied at Virginia Commonwealth University before co-founding Slave Pit Studios in Richmond, Virginia, where he helped develop the art-driven project that became GWAR. A multidisciplinary artist, Varga created and portrayed Sexecutioner while also contributing costumes, sets, props and comic art to the band’s elaborate world. He left GWAR in 1997 but continued to make occasional appearances before retiring from performing in 2021. Chuck Varga s contributions to the GWAR and Slave Pit collective are enormous, Bob Gorman (aka Bonesnapper) wrote in a statement posted on the donation page. The influence of his illustrations, character designs, performances, and artistic vision can still be felt throughout GWAR today.", "date_str": "2026-09-26T19:52:56+00:00", "hash": "a7235d9d73fe66a9", "title_fa": "چاک وارگا، بنیانگذار GWAR، پس از نبرد با سرطان در سن 68 سالگی درگذشت", "summary_fa": "چاک وارگا، یکی از اعضای موسس گروه هوی متال GWAR، در پی نبرد با سرطان درگذشت. او 68 سال داشت. مرگ وارگا در روز جمعه (25 سپتامبر) در یک پست رسانه اجتماعی توسط کیسی اور، نوازنده بیس GWAR، که در نقش Beefcake the Mighty اجرا می‌کرد، اعلام شد. موارد مرتبط رفته اما فراموش نشده است: موسیقیدانانی که در سال 2026 از دست دادیم تماشا کنید GWAR Hit Chappell Roan را به یک پونی صورتی پونی موش پیت تبدیل می کند با پوششی که در حال آب شدن است خواننده GWAR به خشم ادعایی درباره قتل ترامپ ماسک آدمک روی صحنه واکنش نشان می دهد. او در فیس بوک نوشت و اشاره کرد که وارگا در کنار همسرش، بامبی، در آرامش درگذشت. \"من برای شناختن او بهترم و دنیا برای رفتنش کمتر است.\" وارگا بیشتر به خاطر خلق و به تصویر کشیدن شخصیت GWAR's Sexecutioner معروف بود که در سال 1985 شروع شد. به گفته وب سایت گروه، او در سال 1997 گروه را ترک کرد اما پیش از بازنشستگی از اجرا در سال 2021، به حضور گهگاهی با گروه ادامه داد. اور در ادای احترام خود نوشت که به احتمال زیاد وارگا در حال حاضر توسط اعضای فقید GWAR، دیو بروکی، رهبر قدیمی گروه که در نقش اودروس اورونگوس و کوری اسموت، گیتاریست که در نقش فلاتوس ماکسیموس اجرا می‌کرد، از وارگا استقبال می‌کند. \"لیوانت را بلند کن و قصه هایش را بگو. افسانه ها هرگز نمی میرند. درود بر وارگا! اور نتیجه گرفت. در ماه ژوئن، GWAR برای کمک به خانواده وارگا در تامین هزینه های فزاینده مراقبت های پزشکی او، از جمله درمان سرطان، مراقبت از آسایشگاه، تجهیزات پزشکی تخصصی و حمایت پرستاری اضافی، جمع آوری کمک مالی راه اندازی کرد. اهداکنندگانی که به جمع آوری کمک مالی کمک کردند، به کالاهای انحصاری ایجاد شده برای این کمپین،"}, {"source": "Billboard", "title": "Olivia Rodrigo’s Unraveled Tour Opener Blooms With Hit After Hit & A Dissolving Dress: 5 Best Moments", "link": "https://www.billboard.com/lists/olivia-rodrigo-unraveled-tour-night-one-best-moments/", "summary": "When you ve been writing about why you should be listening to Olivia Rodrigo for more than five-and-a-half years and by three full-length, no-skip albums later, you ve somehow just seen her live in person for the first time, it takes a moment to piece together what you want to say. I can t believe we re here, Rodrigo voiced a few songs into opening night of her Unraveled Tour Friday (Sept. 25). There were indisputable setlist highs and stunning visuals during the arena tour s launch in Hartford, Connecticut. There were pink and white flowers everywhere, and somewhere there was a never-ending supply of more pink and white flowers in reach of stagehands replacing any that got shuffled away. Those flowers must be line item No. 1 on Olivia s concert rider. Related Olivia Rodrigo s Unraveled Tour 2026 Setlist: Every Song Played at the First Show And from those pink and white flowers, and the chirping of birds and crickets, emerged the star of the show on date one of two at Hartford s PeoplesBank Arena like, she got up from a field of wildflowers on the stage floor, where she set the show in motion with a whimsical Drop Dead. She bloomed in front of a sold-out arena in the middle of sleepy Connecticut on a Friday night, a room with an audience that leaned female but had enough men there to cover the goofy deep vocal part on Expectations and probably shed a tear or two to Drivers License like you will, too. View this post on Instagram There were families of all kinds, with the kind of parent sitting behind you that teaches their children to pay attention to the opening act a good decision to make here, where Wolf Alice did a fine job warming up the crowd. (Some of Liv s favorites: You re a Germ and Bros. If you haven t listened to them, you should do a deep dive, Rodrigo said during her set, after playing Happy Birthday to her mom on piano.) The Unraveled Tour is a concert for all ages to enjoy OK, yeah, there s a f or two and because of Rodrigo s influences, along with a stellar touring band, it s got rock show vibes. There are beautiful, gut-wrenching piano-pop moments, like the inescapable Drivers License, but most of the you seem pretty sad for a girl so in love singer-songwriter s slower-tempo tracks lean into rock ballad territory live on the Unraveled stage. And then there are anthems like Expectations and All-American Bitch, can t-miss bits on a setlist that honestly has no misses. With three albums worth of material to pull from, Rodrigo curated a 2026 s", "date_str": "2026-09-26T19:46:16+00:00", "hash": "25c3286c146ec7de", "title_fa": "افتتاحیه تور Unraveled Olivia Rodrigo's Blooms With Hit After Hit & A Dissolving Dress: 5 بهترین لحظه ها", "summary_fa": "وقتی می نویسید که چرا باید به اولیویا رودریگو برای بیش از پنج سال و نیم گوش دهید و بعداً با سه آلبوم کامل و بدون پرش، او را برای اولین بار به صورت زنده دیدید، یک لحظه طول می کشد تا آنچه را که می خواهید بگویید. نمی توانم باور کنم که اینجا هستیم، رودریگو در شب افتتاحیه تور Unraveled خود در جمعه (25 سپتامبر) چند آهنگ را صداگذاری کرد. در طول راه اندازی تور آرنا در هارتفورد، کانکتیکات، اوج های غیرقابل انکار و تصاویری خیره کننده وجود داشت. همه جا گل های صورتی و سفید وجود داشت، و جایی وجود داشت که تعداد بی پایانی از گل های صورتی و سفید بیشتر در دسترس دست اندرکاران صحنه قرار داشت که جایگزین گل هایی می شد که به هم ریخته می شدند. این گل‌ها باید خط شماره 1 سوار کنسرت اولیویا باشند. ست لیست مربوط به تور Unraveled Olivia Rodrigo 2026: هر آهنگی که در اولین نمایش پخش می شود و از میان آن گل های صورتی و سفید و صدای جیک پرندگان و جیرجیرک ها، ستاره نمایش در تاریخ یکی از دو در هارتفورد PeoplesBank Arena ظاهر شد، مثل این که او از صحنه نمایشی با جریان های وحشی برخاست. رها کردن مرده. او در یک شب جمعه در وسط کانکتیکات خواب‌آلود، در مقابل یک عرصه‌ی فروخته‌شده شکوفا شد، اتاقی با تماشاگرانی که زن تکیه داشتند اما مردان کافی در آنجا داشت تا بخش صوتی عمیق و احمقانه‌ای در Expectations را پوشش دهد و احتمالاً مانند شما نیز یکی دو اشک برای گواهینامه رانندگی ریخت. این پست را در اینستاگرام مشاهده کنید خانواده‌هایی از همه نوع بودند، با نوع پدر و مادری که پشت سر شما نشسته بودند و به فرزندان خود یاد می‌دهند که به افتتاحیه توجه کنند، تصمیم خوبی برای گرفتن اینجاست، جایی که ولف آلیس"}, {"source": "Billboard", "title": "Here’s What Ella Langley Said After a Fan Boldly Asked Her Out", "link": "https://www.billboard.com/music/music-news/ella-langley-fan-asks-her-out-response-tiktok-1236348289/", "summary": "Ella Langley had a sharp response after a fan asked her out on a date in public. The 27-year-old country star — whose “Choosin’ Texas” recently made history on the Billboard Hot 100 — didn’t mince words when responding to TikTok user Tiki after he attempted to court her outside her Knoxville, Tennessee, show on Thursday (Sept. 24). Related Ella Langley Toasts Choosin Texas Setting All-Time Hot 100 High: Today Doesn t Feel Like a Real Thing Ella Langley Claims the Hot 100 Crown But Could Mariah Carey Take It Right Back This Holiday Season? Chuck Varga, GWAR Founding Member, Dies at 68 After Cancer Battle In a video that has since gone viral, Tiki can be heard shouting through a gate, “Ella, how many likes to take you on a date?” Langley, who was standing in a parking lot surrounded by a group of people, looks toward him with a straight face before replying, “Not enough in the world,” then turning away. The sports-centric digital creator took the rejection in stride, crossing his arms and looking into the camera before replying, “You miss 100% of the shots you don’t take.” The exchange sparked a range of reactions in the comments, with some viewers criticizing Langley’s response. “This rubbed me the wrong way. And I like her,” one person wrote, while another questioned, “Literally what is her problem?” A third commenter took issue with the way Langley delivered the rejection, writing, “She could have laughed and said no in a whole different way.” The singer-songwriter — who is reportedly dating fellow country singer Tucker Wetmore — later offered some context in the comments, writing, “It was meant to come off as dark humor. You said that and it got quiet and I got nervous,” according to TMZ . The comment now appears to have been deleted. Earlier in the week, Langley’s “Choosin’ Texas” smash notched a 23rd week atop the Billboard Hot 100, breaking the record for the most weeks at No. 1 on the U.S. chart. The song debuted in the top 40 of the Hot 100 at No. 39 in November and surged to spend 23 non-consecutive weeks at No. 1, dethroning Mariah Carey’s “All I Want for Christmas” as the record-holder. She celebrated with a heartfelt video posted to Instagram, thanking her fans. “I’m genuinely trying to find the words to help explain what’s going on in my brain today,” Langley began. “Thank you so much for loving this song, for listening to it… I’m running out of hyperboles to describe how I feel.” She added, “Just thank you so much, it’s changing my life, it’s ", "date_str": "2026-09-26T17:43:33+00:00", "hash": "d1714e3b1a9759aa", "title_fa": "این چیزی است که الا لنگلی بعد از اینکه یک طرفدار جسورانه از او درخواست کرد، گفت", "summary_fa": "الا لنگلی پس از اینکه یکی از طرفداران از او خواست تا برای یک قرار در ملاء عام شرکت کند، واکنش تندی داشت. این ستاره کانتری 27 ساله - که \"Choosin' Texas\" او اخیراً در بیلبورد Hot 100 تاریخ ساز شد - هنگامی که به کاربر TikTok یعنی Tiki در روز پنج شنبه (24 سپتامبر) تلاش کرد از او خواستگاری کند، سخنانش را کوتاه نکرد. نان تست های مرتبط الا لنگلی Choosin Texas Setting All-time Hot 100 High: امروز احساس نمی کند که الا لنگلی یک تاج داغ ۱۰۰ را به دست می آورد، اما آیا ماریا کری می تواند آن را درست در این فصل تعطیلات بازگرداند؟ چاک وارگا، عضو موسس GWAR، در سن 68 سالگی پس از نبرد با سرطان درگذشت. در ویدئویی که از آن زمان به بعد در فضای مجازی منتشر شد، صدای تیکی شنیده می‌شود که از دروازه فریاد می‌زند: «الا، چند تا لایک دارد که تو را به یک قرار بگذارند؟» لنگلی که در پارکینگی ایستاده بود که توسط گروهی از مردم احاطه شده بود، قبل از اینکه پاسخ دهد، \"در دنیا کافی نیست\"، با چهره ای صاف به سمت او نگاه می کند، سپس روی می زند. خالق دیجیتال ورزش محور این رد را به آرامی پذیرفت، دستانش را روی هم گذاشت و به دوربین نگاه کرد و سپس پاسخ داد: «شما 100 درصد از عکس‌هایی را که نمی‌گیرید از دست می‌دهید». این تبادل طیفی از واکنش‌ها را در کامنت‌ها برانگیخت و برخی از بینندگان از پاسخ لنگلی انتقاد کردند. \"این من را به راه اشتباهی مالش داد. و من او را دوست دارم،\" یک نفر نوشت، در حالی که دیگری پرسید، \"به معنای واقعی کلمه مشکل او چیست؟\" سومین نظر دهنده با نحوه رد رد توسط لنگلی مخالفت کرد و نوشت: \"او می توانست بخندد و به روشی دیگر نه بگوید.\" این"}, {"source": "Billboard", "title": "Stray Kids Close Latin American Tour in Mexico With Festival STRAYCITY: ‘Did You Miss Us?’", "link": "https://www.billboard.com/music/latin/stray-kids-mexico-straycity-show-night-one-review-1236348306/", "summary": "K-pop supergroup Stray Kids recreated an ephemeral city built on music and energetic choreography called STRAYCITY on Friday (Sept. 25). The event took place at the GNP Seguros Stadium in Mexico City, where they wrap up this weekend the Latin American leg of their tour. The result was a grand celebration attended by approximately 60,000 fans (according to Ocesa), symbolizing the bonds of friendship between South Korea and Mexico. Related President of Mexico Explains Stray Kids Absence at the National Palace After Confirming Group s Visit Stray Kids Drives Fans Wild in Historic Rock in Rio Debut Mexico President Announces BTS 2027 Return After Meeting With South Korea Leader The return of the group — made up of Bang Chan, Lee Know, Changbin, Hyunjin, Han, Felix, Seungmin and I.N. — to the iconic stadium came 17 months after their debut in the Latin American country at the same venue. And they didn’t come alone: STRAYCITY, a concert designed in a festival style, also featured performances by the South Korean-Japanese band Nexz, as well as Mexican acts Renee and Andrés Obregón, who opened the show. “We’re back in Mexico after a year. Did you miss us? ¡No manchen! ” said Bang Chan, mixing Korean with Mexican slang, with the help of an interpreter. “This is the venue we visited on the last tour, and over there it says living is incredible, ” added Hyunjin, pointing to a slogan displayed on one of the stadium’s structures. “I even took a picture of it.” Thousands of Nachimbongs — Stray Kids’ official light sticks — illuminated the stands, creating a warm vibe. Fans who didn’t have one of those improvised by using their phone lights to join in. The STAYs — as Stray Kids’ fans are known — performed some of the choreographies along with the group, as the stadium roared to the rhythm of hits like “TOPLINE,” “S-Class,” “Bounce Back,” “MANIAC,” “DOMINO,” “Thunderous” and “DIVINE.” Each track was synchronized with the moves of the dancers accompanying the idols. The setlist also included “Walkin on Water,” “God’s Menu,” “Chk Chk Boom” and a rock version of “LALALALA.” On the stage, three massive towers that emitted flames lit up in perfect coordination with the fans’ Nachimbongs, creating an immersive atmosphere that elevated every moment of the show. Among the STAYs in attendance was a very special guest: South Korean president Lee Jae-myung, accompanied by first lady Kim Hye-kyung, who held her Nachimbong high and cheered with the fandom. The South Korean head of sta", "date_str": "2026-09-26T17:16:28+00:00", "hash": "df93fe8e6a8c90df", "title_fa": "Stray Kids تور آمریکای لاتین را در مکزیک با فستیوال STRAYCITY بستند: «آیا دلت برای ما تنگ شده بود؟»", "summary_fa": "سوپرگروه کی پاپ Stray Kids در روز جمعه (25 سپتامبر) شهری زودگذر را بازسازی کرد که بر اساس موسیقی و رقص پرانرژی ساخته شده بود به نام STRAYCITY. این رویداد در استادیوم GNP Seguros در مکزیکو سیتی برگزار شد، جایی که آنها این آخر هفته دور آمریکای لاتین خود را به پایان رساندند. نتیجه یک جشن باشکوه با حضور حدود 60000 هوادار (به گفته اوسا) بود که نمادی از پیوندهای دوستی بین کره جنوبی و مکزیک بود. رئیس‌جمهور مرتبط مکزیک غیبت بچه‌های ولگرد در کاخ ملی را پس از تأیید بازدید گروه توضیح می‌دهد. بچه‌های ولگرد طرفداران را در سنگ تاریخی در ریو رانده می‌کنند. اولین رئیس‌جمهور مکزیک بازگشت BTS 2027 را پس از ملاقات با رهبر کره جنوبی اعلام کرد بازگشت گروه - متشکل از Bang Chan، Lee Hyunx, ChangNmin، و Lee Hyunx، ChangNmin. - به استادیوم نمادین 17 ماه پس از اولین بازی آنها در کشور آمریکای لاتین در همان محل آمد. و آنها به تنهایی نیامدند: STRAYCITY، کنسرتی که به سبک جشنواره طراحی شده بود، همچنین اجرای گروه کره جنوبی-ژاپنی Nexz، و همچنین بازیگران مکزیکی Renee و Andrés Obregón، که نمایش را افتتاح کردند، اجرا شد. بنگ چان با کمک یک مترجم گفت: \"ما بعد از یک سال به مکزیک برگشتیم. دلت برای ما تنگ نشده بود؟\" هیونجین با اشاره به شعاری که در یکی از سازه های استادیوم نمایش داده شده است، اضافه کرد: «این مکانی است که در آخرین تور از آن بازدید کردیم، و در آنجا می گوید زندگی باورنکردنی است. حتی از آن عکس هم گرفتم. هزاران ناچیمبونگ - چوب‌های نور رسمی بچه‌های ولگرد - غرفه‌ها را روشن کردند و حال و هوای گرمی ایجاد کردند. طرفدارانی که یکی از آن‌هایی را نداشتند که با استفاده از چراغ‌های تلفن خود برای پیوستن به آن‌ها بداهه‌سازی کنند. STAYs - همانطور که طرفداران Stray Kids"}, {"source": "Billboard", "title": "Kenny Chesney Welcomes Fans Into ‘Silver Sands Marina’ During Intimate Nashville Show: 5 Best Moments", "link": "https://www.billboard.com/lists/kenny-chesney-sands-marina-nashville-show-pinnacle-review/", "summary": "Three decades ago, East Tennessee native Kenny Chesney was playing tiny dive bars that dotted Nashville’s downtown, such as the Music City dive bar The Turf, playing his songs for anyone who would listen. He’s long since ascended to being one of country music’s steadiest hitmakers and stadium headliners, as well as a Country Music Hall of Fame member. But Friday night (Sept. 25), to celebrate the release of his 21st studio album , Silver Sands Marina , Chesney traded stadiums and massive screens for a pop-up show at the intimate, 4,500-capacity venue The Pinnacle, not far from those Broadway bars where he got his start. Related Kenny Chesney Sets 2027 Stadium Tour With Eric Church, Sheryl Crow Greylan James: I Don’t Think I Knew How Much I Missed It Over the course of 22 songs, Chesney sailed through a mix of new songs such “Talkin’ Dirt” and the album’s title track, “Silver Sands Marina,” and drew from his deep well of hits on songs like “Reality,” “I Go Back” and “Living in Fast Forward.” He also offered up “something we haven’t done in years,” playing a hit from 2009 “Ain’t Back Yet,” which he last performed back in 2015. Outside the venue, fans were already getting into the vibe of the album, thanks to the album-themed outdoor area of The Pinnacle. The area included the pink building featured on the album’s cover, as well as pier carnival games, food trucks, a limited-edition vinyl store and more. Fans who didn t score tickets to the show also had the opportunity to hear the concert, as it was broadcast live on Chesney s No Shoes Radio , on SiriusXM s Channel 59. Inside the venue, Chesney reflected on his early years in the music industry, telling the crowd, “When I first started in this business, I just wanted like one song on the radio so everybody back home would think I was cool where I could prove ‘em wrong or whatever it was..I thought, ‘If I could just get one song on the radio so me and my buddies could go around the country and play the places that our heroes played, just one time… this past summer was our 34th trip, so it’s pretty cool.” Energetic fans were packed into the upper balcony, as well as the floor in front of the main stage and surrounding a thrust stage. Ever mindful of his entire audience in the room, Chesney regularly made the rounds to every side of the room throughout the set, waving and smiling at the crowd. He closed out the evening with “Just Don’t Happen Twice,” before waving to the crowd and signing shirts, hats and vinyl", "date_str": "2026-09-26T16:47:39+00:00", "hash": "94223529100b0c6c", "title_fa": "استقبال کنی چسنی از طرفداران در «Silver Sands Marina» در طول نمایش Intimate Nashville: 5 بهترین لحظه", "summary_fa": "سه دهه پیش، کنی چسنی، اهل تنسی شرقی، در حال نواختن میله‌های شیرجه کوچکی بود که در مرکز شهر نشویل پراکنده بودند، مانند نوار غواصی شهر موسیقی The Turf، و آهنگ‌هایش را برای هر کسی که گوش می‌داد پخش می‌کرد. او مدت‌هاست که به یکی از ثابت‌ترین آهنگسازان موسیقی کانتری و سرتیترهای استادیوم و همچنین عضو تالار مشاهیر موسیقی کانتری تبدیل شده است. اما شب جمعه (سپتامبر. 25)، برای جشن انتشار بیست و یکمین آلبوم استودیویی خود، Silver Sands Marina، چسنی استادیوم ها و صفحه نمایش های عظیم را با یک نمایش پاپ آپ در محل صمیمی، 4500 نفری The Pinnacle، نه چندان دور از آن کافه های برادوی که شروع به کار کرد، عوض کرد. کنی چسنی در تور استادیوم 2027 با اریک چرچ، شریل کرو گریلان جیمز: فکر نمی‌کنم می‌دانستم چقدر از دست دادم، چسنی در طول 22 آهنگ، ترکیبی از آهنگ‌های جدید مانند «Talkin’ Dirt» و آهنگ عنوان آلبوم، «Silver» و «Silver» را دنبال کرد. \"واقعیت\"، \"من به عقب برمی گردم\" و \"زندگی در سریع به جلو\". او همچنین «کاری که ما در سال‌ها انجام نداده‌ایم» را پیشنهاد داد، با اجرای آهنگی از «هنوز بازگشته» در سال 2009، که آخرین بار در سال 2015 اجرا کرد. در خارج از محل برگزاری، به لطف فضای بیرونی The Pinnacle با تم آلبوم، طرفداران از قبل در حال ورود به حال و هوای آلبوم بودند. این منطقه شامل ساختمان صورتی روی جلد آلبوم، و همچنین بازی‌های کارناوال اسکله، کامیون‌های حمل غذا، یک فروشگاه وینیل با نسخه محدود و موارد دیگر بود. طرفدارانی که بلیت نمایش را دریافت نکردند، همچنین این فرصت را داشتند که کنسرت را بشنوند، زیرا این کنسرت به صورت زنده از رادیو No Shoes Chesney، در کانال 59 SiriusXM پخش شد. در داخل سالن، چسنی به سال‌های اولیه‌اش در صنعت موسیقی فکر کرد و به جمعیت گفت:"}, {"source": "Billboard", "title": "Here’s the Host & Musical Guest for Every ‘Saturday Night Live’ Season Premiere", "link": "https://www.billboard.com/lists/saturday-night-live-host-and-musical-guest-every-season-premiere-episode/", "summary": "When host Jalen Brunson and musical guest KATSEYE take the stage at Studio 8H in New York for Saturday Night Live ’s Season 52 opener on Saturday (Sept. 26), they’ll join a long and star-studded lineage. We took a look back to see who was booked as host and musical guest on the first episodes of every previous season of the show. These are considered plum bookings: Viewers often make an extra effort to check out the first episode of a season. As a result, producers go all out to open the season with a strong episode. For SNL , that means booking a hot host and musical guest. Related KATSEYE, Turnstile, Rosalía and Gracie Abrams Tapped as Musical Guests For Saturday Night Live Season 52 They have definitely done that this year. KATSEYE has logged six top 40 hits on the Billboard Hot 100, topped by “Gabriela,” which reached No. 21. They received two Grammy nods for the ceremony earlier this year: best new artist and best pop duo/group performance for “Gabriela.” KATSEYE will become the first all-female group to be the musical guest on a season-opening episode of SNL. Brunson, the New York Knicks All-Star point guard and 2026 NBA Finals MVP, will become the third basketball star to host a season-opener, following Charles Barkley (1993) and LeBron James (2007). Legendary comedian George Carlin was host of the first episode on Oct. 11, 1975. There were two musical guests that night Billy Preston and Janis Ian both of whom had had big recent hits on the Billboard Hot 100 . Steve Martin has hosted four season-openers, more than anyone else. Tom Hanks is in second place, having hosted two season-openers. Ye (formerly Kanye West ) has been the musical guest on three season-openers, more than anyone else. The Rolling Stones and Miley Cyrus are the only performers who were both host and musical guest on a season-opener. If you’re ready to go back in time, here are the hosts and musical guests on the first episode of every SNL season.", "date_str": "2026-09-26T15:32:58+00:00", "hash": "e1a37e8f6d90fb63", "title_fa": "در اینجا میزبان و مهمان موزیکال برای هر اولین فصل «Saturday Night Live» است", "summary_fa": "وقتی Jalen Brunson میزبان و مهمان موسیقی KATSEYE در استودیو 8H در نیویورک برای افتتاحیه فصل 52 Saturday Night Live در روز شنبه (26 سپتامبر) روی صحنه می روند، آنها به یک سلسله طولانی و پر ستاره می پیوندند. نگاهی به گذشته انداختیم تا ببینیم چه کسی به عنوان مجری و مهمان موزیکال در قسمت های اول هر فصل قبلی برنامه رزرو شده است. این‌ها رزرو آلو در نظر گرفته می‌شوند: بینندگان اغلب تلاش بیشتری می‌کنند تا قسمت اول یک فصل را تماشا کنند. در نتیجه، تهیه کنندگان تمام تلاش خود را می کنند تا فصل را با یک قسمت قوی باز کنند. برای SNL، این به معنای رزرو یک میزبان داغ و مهمان موسیقی است. مرتبط KATSEYE، ، درست است؟ Shaqua هنگامی که اطلاعات جدید ظاهر می شود، حقیقت ممکن است بسیار نزدیکتر از آن چیزی باشد که او فکر می کرد. سرنخ ها او را به سمت افرادی از محیط آشنای خود هدایت می کند. در نتیجه، او شروع به شک به اعضای خانواده و دوستان می کند، افرادی که سال ها روی آنها حساب کرده است. به نظر می رسد هرکسی اسرار و انگیزه های خاص خود را دارد و تشخیص اینکه چه کسی صادق است و چه کسی چیزی را پنهان می کند به طور فزاینده ای دشوار می"}, {"source": "Netflix NL", "title": "Bizarre spelshow is verrassende hit op Netflix", "link": "https://www.netflix-nederland.nl/bizarre-spelshow-is-verrassende-hit-op-netflix/", "summary": "Netflix is van alle markten thuis. Films en series behoren al sinds jaar en dag tot de catalogus van de streamingdienst, maar anno 2026 maakt Netflix ook heuse spelshows. En soms doen die het best goed. Wonka s The Golden Ticket is verrassende hit op Netflix Dat geldt bijvoorbeeld voor Wonka s The Golden Ticket, dat in Nederland in de top 10 met best bekeken series staat, op de zesde plaats. En dat is eigenlijk best verrassend te noemen! Wonka s The Golden Ticket is dus een nieuwe Netflix-realitycompetitie die volledig is geïnspireerd op de wereld van Willy Wonka uit Roald Dahls Charlie and the Chocolate Factory (Sjakie en de chocoladefabriek). Op 23 september ging de show in première op Netflix. In het programma krijgen twaalf winnaars van een gouden ticket toegang tot Wonka s beroemde chocoladefabriek. Iedere winnaar neemt een zelfgekozen partner mee, waardoor in totaal 24 deelnemers aan het avontuur beginnen. Eenmaal binnen blijkt het echter allesbehalve een ontspannen bezoekje: de kandidaten worden geconfronteerd met het ene bizarre spelletje na het andere. De uitdagingen testen niet alleen hun fysieke vaardigheden, maar ook (onder andere) hun intelligentie, waarnaast ze soms morele keuzes voor de kiezen krijgen. De deelnemers moeten samenwerken, strategieën bedenken en bepalen wie ze wel en niet kunnen vertrouwen. Netflix noemt de serie een combinatie tussen een د انتخاب‌های اخلاقی انجام دهند. شرکت کنندگان باید با هم کار کنند، استراتژی داشته باشند و تعیین کنند که به چه کسانی می توانند اعتماد کنند و نمی توانند. نتفلیکس این سریال را ترکیبی از یک نمایش بازی تماشایی و یک آزمایش اجتماعی می‌داند که همه در دنیای رنگارنگ و آشفته ونکا است. در نهایت، تنها یک شرکت‌کننده می‌تواند جایزه نقدی بزرگ و متحول کننده زندگی را برنده شود. ویلی ونکا کارخانه شکلات سازی طبیعتاً، بلیط طلایی وونکا به صراحت به فیلم کلاسیک کارخانه شکلات سازی ویلی ونکا از سال 1971"}, {"source": "Rolling Stone", "title": "Florence Road Land Top Slot at Ohana After Gear Stolen: ‘It Means a Lot for a Little Irish Band’", "link": "https://www.rollingstone.com/music/music-news/florence-road-ohana-festival-performance-gear-stolen-1235632448/", "summary": "After having to cancel their Friday performance, fest organizers were able to squeeze the band in right before Tyler Childers' Saturday headlining set", "date_str": "2026-09-27T14:09:59+00:00", "hash": "952325fe7a457ddf", "title_fa": "اسلات برتر Florence Road Land در Ohana After Gear Stolen: \"برای یک گروه کوچک ایرلندی معنی زیادی دارد\"", "summary_fa": "پس از اینکه مجبور به لغو اجرای جمعه خود شدند، برگزارکنندگان جشنواره توانستند گروه را درست قبل از مجموعه تیترهای شنبه تایلر چایلدرز تحت فشار بگذارند. این یک خبر ویرانگر برای کنش در حال افزایش بود، که مجبور شدند اجرای خود را بعد از ظهر جمعه در جشنواره Ohana Eddie Vedder در دانا پوینت، کالیفرنیا لغو کنند. فلورانس رود در رسانه‌های اجتماعی خطاب به طرفداران خود نوشت، ما کاملاً همه چیز را امتحان کرده‌ایم تا این اتفاق بیفتد. ما هر کاری از دستمان بر می‌آید انجام می‌دهیم زیرا واقعاً، واقعاً می‌خواهیم برای شما بازی کنیم. روز بعد، گروه یک خبر خوب داشت و اعلام کرد که در حالی که زمان اصلی جمعه آنها در ساعت 2 بعد از ظهر بود. لغو شده بود، این جشنواره توانست آنها را بین دو بازیکن سنگین آلاباما شیکس و تایلر چایلدر در اواخر همان شب فشرده کند. وقتی لیلی آرون خواننده اصلی، هانا کلی درامر، اما براندون گیتاریست و آیلبه بری نوازنده باس حوالی ساعت 8 شب روی صحنه رفتند. روز شنبه، آرون از رهبر گروه Pear ان تنها جیب بردار زنده در نیویورک شناخته شده است، پروژه ای که در حال حاضر جوایز زیادی را به خود اختصاص داده است. در این فیلم، تورتورو نقش هری را بازی می‌کند، یک جیب‌بر باتجربه که وقتی یک کار اشتباه می‌شود، زندگی تحت کنترلش به آشوب کشیده می‌شود و زنجیره‌ای از رویدادها را رقم می‌زند که در طول 36 ساعت اتفاق می‌افتد. داستان‌های مرتبط نکات تلویزیونی از جنسیت و شهر و نارکوس: نگاهی به آثار ادبی که برای اقتباس‌های صفحه نمایش در فیلم‌های Iberseries Platino Industria ارائه شده‌اند جایزه درخشان چشم طلایی که بین آنها قرار گرفته بود، تورتورو درباره بزرگ شدن در یک خانواده مهاجر، دوستی چند دهه ای خود با اسپایک لی و انتقال از بازیگری به فیلمسازی صحبت کرد. از تورتورو، که به طور پیوسته به یکی از برجسته‌ترین بازیگران صنعت تبدیل شده است، هنوز نامزدی اسکار را در رزومه خود ثبت نکرده است، در مورد پیوستن به مسابقه بهترین بازیگر امسال با موفقیت ساندنس The Only Living Picket در نیویورک سوال شد. او در مورد کمپین جوایز آتی پاسخ داد. اما حالا من نقش اول فیلم را دارم، بنابراین از فیلم حمایت خواهم کرد زیرا فیلم را دوست دارم."}, {"source": "Hollywood Reporter", "title": "Hints of ‘Sex and the City’ and ‘Narcos’: A Look at Literary Works Being Pitched for Screen Adaptations at Iberseries & Platino Industria", "link": "https://www.hollywoodreporter.com/tv/tv-news/book-screen-adaptation-pitches-iberseries-platino-industria-1236696290/", "summary": "Among the featured books are also the memoirs of a Medellín drug cartel founder and Che Guevara’s first wife, plus a graphic novel by the creator of the opening title design for 'Only Murders in the Building.'", "date_str": "2026-09-27T08:00:00+00:00", "hash": "782488c9f67745fa", "title_fa": "نکاتی از «سکس و شهر» و «نارکوس»: نگاهی به آثار ادبی که برای اقتباس‌های صفحه نمایش در Iberseries و Platino Industria ارائه می‌شوند", "summary_fa": "در میان کتاب‌های برجسته، خاطرات بنیان‌گذار کارتل مواد مخدر مدلین و همسر اول چه گوارا، به‌علاوه یک رمان گرافیکی از خالق طرح عنوان آغازین «فقط قتل‌ها در ساختمان» است. اگر به مدرکی در مورد پتانسیل آثار ادبی جهان اسپانیایی زبان برای اقتباس برای نمایش نیاز دارید، باید به موفقیت مرسدس ران نویسنده پرفروش YA با فیلم Prime Video و بنر تولید فیلم Pokeepsie Banijay با امثال سه گانه Fault و فیلم Drawn Together که اخیراً راه اندازی شده است نگاه نکنید. Literary Works Pitch for Audiovisual Adaptation، ابتکار جدیدی است که توسط Iberseries Platino Industria با همکاری فدراسیون صنفی ناشران اسپانیا (FGEE) توسعه یافته و در ششمین نسخه امسال در مادرید که از 29 سپتامبر تا اکتبر برگزار می شود، ارائه شد. 2، به دنبال ارتباط ناشران و آژانس‌های ادبی با شرکت‌های تولید، پخش‌کننده‌ها، استودیوها و شبکه‌های تلویزیونی است تا جستجوی آنها برای ویژگی‌های فکری جدید را تغذیه کند. داستان‌های مرتبط فیلم‌ها مراقبت مهربان مایک لی جوایز سن سباستین را به‌عنوان La Bola Negra، NAZA کسب امتیاز تماشاگران فیلم‌ها در نشست زوریخ، تغییر بازی گلن باسنر و ادوارد برگر یادآوری خاطرات در سفری وحشیانه پس از یک فراخوان برای ارسال، سازمان‌دهندگان 14 اثر از اسپانیا و هر کدام از مکزیک یک اثر را انتخاب کردند. داستان ها از ژانرها، زمان ها و موقعیت های مختلف می آیند. در اینجا نگاهی به پروژه های در حال اجرا در مادرید می اندازیم: Alguien como t توسط خاویر بوش Agencia Literaria Antonia Kerrigan، اسپانیا رمان نویسنده کاتالانی بر یک رابطه شدید و فرامرزی بین یک زن متاهل از بارسلونا و یک صاحب گالری هنری از پاریس متمرکز است، در حالی که دختر این زن بعدها سعی می کند جزئیات عاشقانه ای را با هم بسازد."}, {"source": "Hollywood Reporter", "title": "Jalen Brunson Brings the New York Knicks to the ‘Saturday Night Live’ Season 52 Premiere", "link": "https://www.hollywoodreporter.com/tv/tv-news/jalen-brunson-snl-season-52-premiere-knicks-players-1236712688/", "summary": "Karl-Anthony Towns, Josh Hart, OG Anunoby and Mikal Bridges showed up to support the NBA Finals MVP's first hosting stint.", "date_str": "2026-09-27T03:49:43+00:00", "hash": "8c386e5d66860be8", "title_fa": "Jalen Brunson New York Knicks را به اولین فصل 52 \"Saturday Night Live\" می آورد.", "summary_fa": "Karl-Anthony Towns، Josh Hart، OG Anunoby و Mikal Bridges برای حمایت از اولین میزبانی MVP Finals NB     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

      const filtered = rawItems.filter(item => {

        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

          readList.push(item);

          unreadList.push(item);
        }
      });

              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
