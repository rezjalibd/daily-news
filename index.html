ex-CEO, Tamay Besiroglu, now works as a research scientist at Google's AI division, DeepMind, according to his LinkedIn profile. Over a dozen other former Mechanize employees now work at Google, per LinkedIn, mostly on the company's 'midtraining' efforts — a key part of building the best chatbot. Google and Besiroglu declined to comment. Google had been in talks for a $1.5 billion-plus deal for Mechanize's tech and talent, Business Insider previously reported . The final terms of the deal weren't disclosed. Mechanize's former chief of staff, Guive Assadi, now describes himself as its CEO, per LinkedIn. Google has been struggling to release an AI model that's widely viewed as competitive lately. It has used talent deals — which are typically structured to avoid antitrust scrutiny compared to fully fledged acquisitions — to gain an edge. For example, Google snapped up AI coding startup Windsurf's talent last year, with former CEO Varun Mohan now leading Google's agentic coding program Antigravity. Mechanize's technology helps tech companies' AI models improve at coding, a challenge Google has struggled with. Mechanize said earlier this year that it raised $9.1 million in a funding round at a $500 million valuation. Besiroglu previously cofounded Epoch AI, which also focused on testing AI models. Have a tip? Contact Hugh via email at hlangley@businessinsider.com or Signal at 628-228-1836. Contact Charles via email at crollet@businessinsider.com or on Signal and WhatsApp at 628-282-2811 . Contact Katie Roof via email at kroof@businessinsider.com or Signal at @kroof.26 Read the original article on Business Insider", "date_str": "2026-09-11T18:54:54+00:00", "hash": "b7b51ce96a011a8d", "title_fa": "گوگل به تازگی قرارداد 1.5 میلیارد دلاری خود را با استعداد بیش از 1.5 میلیارد دلاری برای استارتاپ هوش مصنوعی Mechanize تکمیل کرده است", "summary_fa": "ساندار پیچای، مدیر عامل گوگل. تامای بسیر اوغلو، مدیر عامل سابق بلومبرگ/ گتی ایماژ مکانیزه، به همراه بیش از ده ها کارمند دیگر، اکنون در گوگل کار می کنند. شرایط معامله فاش نشد. گوگل در حال مذاکره برای یک معامله بیش از 1.5 میلیارد دلاری بود. Mechanize سال گذشته با مأموریت خودکارسازی هر شغل در جهان راه اندازی شد. گوگل استعدادهای جدیدی در مسابقه هوش مصنوعی دارد. پست های عمومی نشان می دهد که غول فناوری قرارداد استعداد خود را با استارتاپ سانفرانسیسکو Mechanize Inc کامل کرده است. بر اساس پروفایل لینکدین خود، تامای بسیر اوغلو، بنیانگذار و مدیر عامل سابق Mechanize، اکنون به عنوان یک دانشمند پژوهشی در بخش هوش مصنوعی گوگل، DeepMind، کار می کند. بیش از دوجین کارمند سابق Mechanize اکنون در گوگل کار می‌کنند، طبق LinkedIn، که عمدتاً در تلاش‌های «آموزش میانی» این شرکت هستند - بخش کلیدی ساخت بهترین چت بات. گوگل و بسیر اوغلو از اظهار نظر خودداری کردند. به گزارش بیزینس اینسایدر، گوگل در حال مذاکره برای قراردادی به ارزش 1.5 میلیارد دلار برای فناوری و استعدادهای مکانیزه بود. شرایط نهایی معامله فاش نشد. به گفته لینکدین، رئیس سابق دفتر مکانیزه، گیو اسدی، اکنون خود را مدیرعامل آن معرفی می کند. گوگل برای عرضه یک مدل هوش مصنوعی که اخیراً به طور گسترده به عنوان رقابتی شناخته می شود، در تلاش بوده است. این شرکت از معاملات استعداد - که معمولاً برای جلوگیری از بررسی دقیق ضد انحصار در مقایسه با خریدهای تمام عیار ساخته شده اند - برای به دست آوردن برتری استفاده کرده است. به عنوان مثال، گوگل در سال گذشته استعدادهای استارتاپ کدنویسی هوش مصنوعی Windsurf را شناسایی کرد و مدیر عامل سابق Varun Mohan اکنون برنامه کدگذاری عاملی گوگل Antigravity را رهبری می کند. فناوری Mechanize به بهبود مدل‌های هوش مصنوعی شرکت‌های فناوری در کدنویسی کمک می‌کند، چالشی که"}, {"source": "Business Insider", "title": "I had my dream job, but never felt financially secure. I went from $500,000 in debt to debt-free in under 2 years.", "link": "https://www.businessinsider.com/looked-rich-500k-debt-credit-cards-retirement2026-9", "summary": "Christos Garkinos went into debt in his late 50s. Courtesy of Christos Garkinos Christos Garkinos was terrified of being like his dad, who died young with no money. He's always had a relatively high salary, but didn't feel financially secure. He went about $500,000 into debt in his late 50s and is rebuilding his finances in his 60s. This as-told-to essay is based on a conversation with Christos Garkinos, founder of Covet by Christos . It has been edited for length and clarity . I learned from a very young age what success meant: it was money in the till after the lunch rush. My Greek immigrant parents owned a diner in Detroit. Each day, 150 people would flood in for lunch, and my family would fall apart. My mom would be screaming, throwing things at my dad; as a kid, I wondered every day if we would make it through. But two hours later, with the money in the till, we'd all be having fun. My dad was diagnosed with lung cancer when I was in my 20s. The business failed, and so did his health. I was making good money working for major global companies like Disney and Virgin, but I never felt financially secure. That's partially because I sent a good portion of my check home to support my parents. I took a loan to pay for my dad's hospice medications My dad died when I was in my mid-20s. While he was in hospice, I was trying to find money to pay for his medication. My parents didn't have any money, so I took out a small personal loan of about $2,000 to make my dad more comfortable in his last days. That's when money became a big fear of mine. I was terrified of ending up like my dad. At the same time, when I made good money, I felt I didn't deserve it. I wasn't comfortable with money, so I would find ways to spend it. Christos Garkinos didn t feel comfortable with money so he would spend it. Nikolas Kominis/Photographer I was doing one thing right, however: I had a 401(k) retirement account , something my parents never had. That gave me peace of mind that I would die penniless, like my dad. I got my dream job, but I sabotaged myself I was living in LA , working in fashion, which had been my dream since I'd first heard the \"click clack\" of high heels as a boy. I had a lot going for me, and eventually landed a reality show that I leveraged into a spot on the Home Shopping Network . I had been absolutely obsessed with the network since I was 14. When I went to Florida and saw a set with my name on it, I freaked out. A part of me thought, \"What can I do to mess thi", "date_str": "2026-09-11T18:39:01+00:00", "hash": "a4780c50b24a4aa3", "title_fa": "من شغل رویایی خود را داشتم، اما هرگز احساس امنیت مالی نکردم. من از 500000 دلار بدهی در کمتر از 2 سال به بدون بدهی تبدیل شدم.", "summary_fa": "کریستوس گارکینوس در اواخر دهه 50 عمرش بدهکار شد. با حسن نیت از کریستوس گارکینوس کریستوس گارکینوس از اینکه شبیه پدرش باشد که جوان بدون پول مرده بود، وحشت داشت. او همیشه حقوق نسبتاً بالایی داشت، اما از نظر مالی احساس امنیت نمی کرد. او در اواخر دهه 50 زندگی خود حدود 500000 دلار بدهی کرد و در 60 سالگی در حال بازسازی امور مالی خود است. این مقاله همانطور که گفته شد بر اساس گفتگو با کریستوس گارکینوس، بنیانگذار Covet توسط کریستوس است. برای طول و وضوح ویرایش شده است. من از کودکی یاد گرفتم که موفقیت به چه معناست: این پول بود تا بعد از عجله ناهار. والدین مهاجر یونانی من یک غذاخوری در دیترویت داشتند. هر روز 150 نفر برای ناهار سرازیر می شدند و خانواده من از هم می پاشیدند. مادرم جیغ می‌کشید، چیزهایی را به طرف پدرم پرتاب می‌کرد. در کودکی، هر روز به این فکر می‌کردم که آیا از پس آن برمی‌آییم. اما دو ساعت بعد، با پول در دست، همه ما به خوش گذرانی خواهیم پرداخت. زمانی که من در 20 سالگی بودم تشخیص داده شد که پدرم به سرطان ریه مبتلا شده است. این تجارت شکست خورد و سلامتی او نیز شکست خورد. من با کار برای شرکت های بزرگ جهانی مانند دیزنی و ویرجین پول خوبی به دست می آوردم، اما هرگز احساس امنیت مالی نمی کردم. این تا حدی به این دلیل است که من بخش خوبی از چک خود را برای حمایت از والدینم به خانه فرستادم. وام گرفتم تا هزینه داروهای آسایشگاه پدرم را بپردازم پدرم زمانی که من در اواسط 20 سالگی بودم فوت کرد. زمانی که او در آسایشگاه بود، سعی می‌کردم پولی برای پرداخت هزینه داروهایش پیدا کنم. پدر و مادرم هیچ پولی نداشتند، بنابراین من یک وام شخصی کوچک حدود 2000 دلار گرفتم تا"}, {"source": "Business Insider", "title": "Hugging Face CEO says asking Anthropic researcher ‘about AI extinction risk is like asking your AC guy about climate change’", "link": "https://www.businessinsider.com/hugging-face-clement-delangue-jacob-coxon-ac-guy-2026-9", "summary": "Hugging Face CEO Clement Delangue compared a former Anthropic researcher s AI fears to those of an AC guy talking about climate change. Bloomberg/Getty Images Hugging Face CEO Clement Delangue isn't here for the Jacob Coxon discourse. Coxon went viral after posting that he resigned from Anthropic due to concerns about AI's risks. Delangue suggested that Coxon doesn't have the requisite expertise to make such a claim. Hugging Face CEO Clement Delangue questioned the focus on a former Anthropic researcher who said AI workers privately fear the technology could kill all humans. \"Sorry, but asking Jacob about AI extinction risk is like asking your AC guy about climate change,\" Delangue wrote on X on Friday. Delangue said that Jacob Coxon, the former Anthropic researcher whose resignation has sparked a renewed debate about AI's risks, should be put into the proper context. \"Not saying it's necessarily uninteresting or wrong per se but let's keep things in perspective and hear from the full range of expertise across the ecosystem!\" Delangue wrote. Coxon wrote on Tuesday on X that he was resigning due to concerns that both Anthropic and OpenAI, where he previously worked, are \"racing straight to self-improving superintelligence and gambling with our lives.\" \"The people building AI earnestly believe that it could kill us all by the end of the decade,\" he wrote. \"This is not a marketing stunt.\" Delangue later said that his comparison to an \"AC guy\" was not meant \"to discredit\" Coxon \"at all.\" Rather, Delangue said, there needs to be a more robust conversation about AI's risks. \"It's simply that we should put any one perspective in context and listen to the broader AI ecosystem too,\" he wrote. Delangue also said it was his \"understanding\" that Coxon mostly focused on pretraining, in which researchers train AI models on large datasets, rather than more risk-focused research. In his series of posts, Coxon said he worked on pretraining research at both OpenAI and Anthropic \"for the last three years.\" Ethan Perez, alignment team lead at Anthropic, later wrote on X that Coxon was a \"senior researcher who joined Anthropic in May\" and that OpenAI's chief rival had been trying to recruit Coxon for roughly two years. Some in tech, like SpaceX CEO Elon Musk , whose company includes SpaceXAI, have been critical of Coxon's claims. In response to someone who recounted the lead-up to The Wall Street Journal's initial story on Coxon's resignation (which came before Coxon's tweets)", "date_str": "2026-09-11T18:25:05+00:00", "hash": "883f04282a486b98", "title_fa": "مدیر اجرایی Hugging Face می‌گوید پرسیدن از محقق Anthropic در مورد خطر انقراض هوش مصنوعی مانند این است که از مرد AC خود در مورد تغییرات آب و هوا بپرسید.", "summary_fa": "کلمنت دلانگ، مدیر اجرایی Hugging Face، ترس های هوش مصنوعی محقق سابق Anthropic را با ترس های یک مرد AC که در مورد تغییرات آب و هوایی صحبت می کرد، مقایسه کرد. کلمنت دلانگ، مدیر عامل بلومبرگ/گتی ایماژز که صورت در آغوش گرفته است، برای سخنرانی جیکوب کاکسون اینجا نیست. کاکسون پس از انتشار پستی مبنی بر اینکه به دلیل نگرانی در مورد خطرات هوش مصنوعی از آنتروپیک استعفا داد، در فضای مجازی منتشر شد. دلانگ پیشنهاد کرد که کاکسون تخصص لازم برای طرح چنین ادعایی را ندارد. کلمنت دلانگ، مدیر اجرایی Hugging Face، تمرکز روی یک محقق سابق Anthropic را زیر سوال برد که گفت کارکنان هوش مصنوعی به طور خصوصی از این می ترسند که این فناوری بتواند همه انسان ها را بکشد. دلانگ در روز جمعه در X نوشت: «متاسفم، اما پرسیدن از جیکوب در مورد خطر انقراض هوش مصنوعی مانند این است که از فرد AC خود در مورد تغییرات آب و هوا بپرسید. دلانگ گفت که جیکوب کوکسون، محقق سابق آنتروپیک که استعفای او بحث جدیدی در مورد خطرات هوش مصنوعی به راه انداخته است، باید در چارچوب مناسب قرار گیرد. \"نگفتیم که لزوماً به خودی خود جالب یا اشتباه است، اما بیایید همه چیز را در چشم انداز نگه داریم و از طیف کامل تخصص در سراسر اکوسیستم بشنویم!\" دلانگو نوشت. کاکسون روز سه‌شنبه در روز X نوشت که به دلیل نگرانی از این که هم Anthropic و هم OpenAI، جایی که او قبلاً در آن کار می‌کردند، \"مستقیماً به سمت سوپرهوش خودسازی و قمار با زندگی ما مسابقه می‌دهند، استعفا می‌دهد.\" او نوشت: «افرادی که هوش مصنوعی می‌سازند، عمیقاً معتقدند که می‌تواند تا پایان دهه همه ما را بکشد. \"این یک شیرین کاری بازاریابی نیست.\" دلانگ بعداً گفت که مقایسه او با یک \"مرد AC\" اصلا به معنای \"بی اعتبار کردن\" کاکسون نبود."}, {"source": "Business Insider", "title": "Apple's new CEO was asked about 'pervert glasses.' Here was his response.", "link": "https://www.businessinsider.com/apple-ceo-ai-glasses-watch-privacy-concerns-meta-2026-9", "summary": "Apple CEO John Ternus says the company wants people around the user feel comfortable about the Apple Watch s new AI listening features. Carlos Barria/Reuters Apple CEO John Ternus wants people to feel comfortable about the Apple Watch's new AI listening capabilities. Ternus was asked about concerns about AI glasses, specifically that some have called them \"pervert glasses.\" Apple exec Greg Joswiak called it \"quite a marketing slogan.\" Ternus stressed that the Apple Watch features don't record. Apple would kindly like to stay far away from Meta's ongoing reputational challenges with AI glasses. Apple CEO John Ternus was recently asked about how the company thinks about privacy in the age of AI wearables in light of backlash around AI glasses like Meta's. After all, Apple is rumored to be cooking up some AI glasses of its own in its labs. \"I know you can't talk about unannounced products, but what do you think about the backlash around what people are calling, you know, 'pervert glasses,' \" Tom's Guide editor in chief Mark Spoonauer asked. Before Ternus could answer, Greg Joswiak, Apple's senior vice president of worldwide marketing who also being interviewed, quipped: \"That's quite a marketing slogan.\" The remark drew laughter from Ternus. Meta is actively fighting back at that perception with a marketing blitz that emphasizes the AI glasses' light that alerts people when the recording feature is activated. It's also taken steps to thwart users who tamper with that light and pledged to remove \"harassing\" videos recorded by the AI glasses from Instagram ( Business Insider has found those moderation efforts are off to a bumpy start.) Meta declined to comment on the Apple executives' remarks. Beyond some laughter at a rival's expense, the pair of Apple execs instead looked to explain how the company hopes to address privacy concerns when it releases two new AI-enabled listening features alongside the next generation of Apple Watches. \"We wanted to do this in a way that people feel comfortable using it, and people around the user feel comfortable about its existence,\" Ternus said. While its first foldable phone, iPhone Duo, stole the show, Apple also announced that Apple Watch Series 12 and Apple Watch Ultra 4 will come with optional \"audio intelligence\" features that, depending on a user's preference, can mean Siri is always listening to your conversations throughout the day. Apple says the features don't start working until the on-device AI detects speech and", "date_str": "2026-09-11T17:52:34+00:00", "hash": "9764a06ecdfa3775", "title_fa": "از مدیر عامل جدید اپل در مورد \"عینک منحرف\" سوال شد. این پاسخ او بود.", "summary_fa": "جان ترنوس، مدیر عامل اپل می‌گوید که این شرکت می‌خواهد اطرافیان کاربر نسبت به ویژگی‌های جدید گوش دادن به هوش مصنوعی اپل واچ احساس راحتی کنند. کارلوس باریا/ رویترز، مدیر عامل اپل، جان ترنوس از مردم می خواهد که در مورد قابلیت های گوش دادن هوش مصنوعی جدید اپل واچ احساس راحتی کنند. از ترنوس در مورد نگرانی در مورد عینک های هوش مصنوعی پرسیده شد، به ویژه اینکه برخی آنها را \"عینک منحرف\" نامیده اند. گرگ جوسویاک، مدیر اجرایی اپل، آن را «یک شعار بازاریابی» خواند. ترنوس تاکید کرد که ویژگی های اپل واچ ضبط نمی شود. اپل با مهربانی می‌خواهد با عینک‌های هوش مصنوعی از چالش‌های شهرت مداوم متا دور بماند. اخیراً از جان ترنوس، مدیر عامل اپل پرسیده شد که این شرکت چگونه در مورد حفظ حریم خصوصی در عصر ابزارهای پوشیدنی هوش مصنوعی با توجه به واکنش های منفی پیرامون عینک های هوش مصنوعی مانند متا فکر می کند. به هر حال، شایعه شده است که اپل در آزمایشگاه‌های خود لیوان‌های هوش مصنوعی را برای خود می‌پزد. مارک اسپوناور، سردبیر تامز گاید، پرسید: «می‌دانم که نمی‌توانید در مورد محصولات اعلام‌نشده صحبت کنید، اما درباره واکنش‌هایی که مردم به آن‌ها می‌گویند، «عینک منحرف» چه فکر می‌کنید؟ قبل از اینکه ترنوس بتواند پاسخ دهد، گرگ جوسویاک، معاون ارشد بازاریابی اپل در سراسر جهان که او نیز در حال مصاحبه بود، به طعنه گفت: \"این یک شعار بازاریابی است.\" این اظهارات باعث خنده ترنوس شد. متا به طور فعال در حال مقابله با این تصور با یک حمله بازاریابی است که بر نور عینک هوش مصنوعی تأکید می کند که هنگام فعال شدن ویژگی ضبط به مردم هشدار می دهد. همچنین اقداماتی برای خنثی کردن کاربرانی که این نور را دستکاری کرده‌اند و متعهد شده‌اند که ویدیوهای آزاردهنده ضبط‌شده توسط عینک‌های هوش مصنوعی را از اینستاگرام حذف کنند، انجام"}, {"source": "Business Insider", "title": "AI employees with apocalypse fears face a troubling question: Should they quit or stay?", "link": "https://www.businessinsider.com/ai-apocalypse-workers-fearing-face-thorny-career-dilemma-2026-9", "summary": "Dario Amodei, CEO of Anthropic Bloomberg/Getty Images Jacob Coxon's Anthropic exit sparked debate over whether to push for AI safety from inside or out. The resignation also drew scrutiny over its impact on Anthropic's image and upcoming IPO. AI workers' stay-or-go conundrum has a World War II parallel, a tech historian says. AI workers with apocalypse fears are facing a troubling, though not unprecedented, career dilemma . Should they quit their jobs to avoid potentially helping make the doomsday scenario they envision a reality? Or, should they drive change for the better from within? It's a thorny predicament that came into focus this week when Jacob Coxon, a former OpenAI employee, said in an X post that he was resigning from Anthropic because the \"people building AI earnestly believe that it could kill us all by the end of the decade.\" Soon after, Evan Hubinger, who leads Anthropic's alignment stress-testing team, essentially backed Coxon, saying he believes there is a greater-than-10% chance AI could kill all humans within the next decade. Why some workers stay For AI workers worried that they're contributing to mankind's destruction, deciding whether to quit or stay put is more complicated than it may seem, said Jeremie Harris, CEO and cofounder of Gladstone AI, a Washington, DC-based safety and advisory company focused on national security risks and catastrophic threats from advanced AI. \"I don't particularly fault anyone for making either call,\" he said. Harris said his job involves regularly talking with staff at Anthropic and other top AI labs, and that in recent months he's heard many express fears similar to those Coxon described. While quitting can be a moral response to building a dangerous technology , he said, Al labs could end up with few or no workers willing to press for change if resignations pile up. \"The people who are left are going to be the ones who are least concerned about safety,\" Harris said, while \"people who care arguably should be the ones in the seat.\" In response to Coxon's announcement, Anthropic employee Anna Wang said on X that she works at the company because she thinks she \"can do better at reducing risks from the inside.\" She added that she respects and endorses others \"who think that it's better to do so from the outside.\" A spokesperson for Anthropic declined to comment after confirming Wang's employment. Coxon's X post, which also sparked online debate over its impact on Anthropic's image, the company's coming IP", "date_str": "2026-09-11T17:49:37+00:00", "hash": "1556890c3ea08429", "title_fa": "کارمندان هوش مصنوعی با ترس از آخرالزمان با یک سوال نگران کننده روبرو می شوند: آیا باید کار را ترک کنند یا بمانند؟", "summary_fa": "داریو آمودی، مدیرعامل Anthropic Bloomberg/Getty Images خروج Jacob Coxon Anthropic بحث هایی را برانگیخت که آیا باید برای ایمنی هوش مصنوعی از داخل یا خارج تلاش کرد. این استعفا همچنین به دلیل تأثیر آن بر تصویر آنتروپیک و عرضه اولیه عمومی سهام آتی مورد بررسی قرار گرفت. یک تاریخ‌دان فناوری می‌گوید معمای ماندن یا رفتن کارگران هوش مصنوعی مشابهی در جنگ جهانی دوم دارد. کارکنان هوش مصنوعی با ترس از آخرالزمان با یک معضل شغلی نگران‌کننده، هرچند بی‌سابقه مواجه هستند. آیا آنها باید شغل خود را رها کنند تا از کمک بالقوه برای تحقق سناریوی روز قیامت که تصور می کنند اجتناب کنند؟ یا، آیا باید از درون تغییر را به سمت بهتر شدن سوق دهند؟ این یک مخمصه خاردار است که این هفته زمانی که Jacob Coxon، یک کارمند سابق OpenAI، در یک پست X گفت که از Anthropic استعفا می دهد، مورد توجه قرار گرفت زیرا \"افرادی که هوش مصنوعی می سازند جدی معتقدند که می تواند تا پایان دهه همه ما را بکشد.\" بلافاصله پس از آن، ایوان هابینگر، که تیم تست استرس همسویی Anthropic را رهبری می‌کند، اساساً از Coxon حمایت کرد و گفت که او معتقد است بیش از 10٪ احتمال دارد که هوش مصنوعی بتواند همه انسان‌ها را در دهه آینده بکشد. چرا برخی از کارگران می‌مانند جرمی هریس، مدیرعامل و یکی از بنیان‌گذاران Gladstone AI، یک شرکت مشاوره ایمنی و ایمنی مستقر در واشنگتن دی‌سی که بر روی خطرات امنیتی ملی و فاجعه‌ای پیشرفته تمرکز دارد، گفت: چرا برخی از کارگران می‌مانند، از آنجایی که کارکنان هوش مصنوعی نگران هستند که در نابودی بشریت نقش دارند، تصمیم‌گیری در مورد ترک یا ماندن در محل کار پیچیده‌تر از آن چیزی است که به نظر می‌رسد. او گفت: «من برای برقراری هر یک از این دو تماس به‌خصوص کسی را مقصر نمی‌دانم. هریس گفت شغل"}, {"source": "Business Insider", "title": "Brooks Brothers creative director Michael Bastian remembers 9/11", "link": "https://www.businessinsider.com/brooks-brothers-creative-director-michael-bastian-remembers-9-11-2026-9", "summary": "The Brooks Brothers location at Manhattan's One Liberty Plaza sustained heavy damage when the Twin Towers collapsed on September 11, 2001. The store reopened exactly one year after the attacks. While the store is no longer there — it closed in 2018 amid planned renovations and relocated a few blocks away — the memories stay with the company's creative director, Michael Bastian, 25 years later. Read the original article on Business Insider", "date_str": "2026-09-11T17:46:14+00:00", "hash": "37b38ccccbe27e76", "title_fa": "مایکل باستیان، مدیر خلاق برادران بروکس، 11 سپتامبر را به یاد می آورد", "summary_fa": "مکان Brooks Brothers در One Liberty Plaza منهتن با فروریختن برج های دوقلو در 11 سپتامبر 2001 آسیب زیادی دید. فروشگاه دقیقا یک سال پس از حملات بازگشایی شد. در حالی که فروشگاه دیگر آنجا نیست - در سال 2018 در بحبوحه بازسازی های برنامه ریزی شده بسته شد و چند بلوک دورتر جابه جا شد - خاطرات با مدیر خلاق شرکت، مایکل باستیان، 25 سال بعد باقی می ماند. مقاله اصلی را در Business Insider بخوانید"}, {"source": "Business Insider", "title": "A billionaire wanted $125 million for his Aspen compound. He got $33.5 million.", "link": "https://www.businessinsider.com/bill-koch-aspen-estate-sign-colorado-record-setting-real-estate-2025-2", "summary": "Bill Koch finally offloaded his Aspen, Colorado, but not for the $125 million he had hoped for. Shawn O Connor Bill Koch's Aspen compound sold at auction for $33.5M, far below its onetime $125M asking price. The property spans 52 acres with a main lodge, seven cabins, and numerous luxury amenities. Koch bought the compound for $26.5M in 2007, but couldn't find a buyer by listing it traditionally. Billionaire and member of the famed Koch family Bill Koch tried to offload his massive compound in Aspen for nine figures, but ended up selling it at auction for nearly $100 million below the listing price. The founder of Oxbow Carbon bought the ski-town property in 2007 for $26.5 million and later added 31 acres. The compound hit the market in 2015 with an asking price of $100 million. Koch eventually dropped the price to $80 million the following year. In 2020, he sold the additional 31 acres he added for $14.5 million, but held on to the lodge and the rest of the 52-acre property. In 2025, Koch relisted the property at $125 million, but it didn't sell. In 2026, Koch went the auction route — a tactic sometimes employed for notable properties . The property finally sold in July, but for a fraction of its original listing price. The Wall Street Journal reported that the winning bid was $33.5 million — a 73% decrease from its peak listing price. Koch's lofty $125 million price would have been the most expensive sale in Colorado history, beating Palatir Alex Karp's recent $120 million ranch purchase in nearby Snowmass, Colorado. Koch, who has a net worth of $2 billion, according to Forbes, sold his stake in Koch Industries to his brothers for $470 million in 1983. That left him with plenty of money to make renovations to his Colorado ranch. The recently sold main lodge spans 16,600 square feet and is accompanied by seven cabins — one of which is a home gym. The property also includes hot tubs, hiking trails, and an altitude-acclimation room. See what else awaits the new owner of this massive compound. Bill Koch purchased the 52-acre property for $26.5 million in 2007. Koch s 52-acre property. Shawn O Connor According to Architectural Digest , the property was used as a dude ranch and an event venue before Koch bought it. He later added about 31 more acres to the property. An aerial view of the vast amount of land. Shawn O Connor He eventually sold those extra acres for $14.5 million in 2020. In 2015, Koch listed the entire property for $100 million. An aerial view o", "date_str": "2026-09-11T17:41:27+00:00", "hash": "5a1ba9b0c506adac", "title_fa": "یک میلیاردر برای مجتمع آسپن خود 125 میلیون دلار می خواست. او 33.5 میلیون دلار گرفت.", "summary_fa": "بیل کخ در نهایت آسپن خود را در کلرادو تخلیه کرد، اما نه برای 125 میلیون دلاری که انتظارش را داشت. مجتمع آسپن شاون او کانر بیل کخ در حراجی به قیمت 33.5 میلیون دلار فروخته شد که بسیار کمتر از قیمت درخواستی 125 میلیون دلاری قبلی خود بود. مساحت این ملک 52 هکتار با یک اقامتگاه اصلی، هفت کابین و امکانات لوکس متعدد است. کوچ این ترکیب را به قیمت 26.5 میلیون دلار در سال 2007 خریداری کرد، اما با فهرست کردن سنتی آن خریدار پیدا نکرد. میلیاردر و عضو خانواده مشهور کوخ، بیل کخ، تلاش کرد تا مجتمع عظیم خود را در آسپن با قیمت 9 رقمی تخلیه کند، اما در نهایت آن را در حراجی به قیمت نزدیک به 100 میلیون دلار زیر قیمت فهرست فروخت. بنیانگذار Oxbow Carbon ملک شهر اسکی را در سال 2007 به قیمت 26.5 میلیون دلار خرید و بعداً 31 هکتار به آن اضافه کرد. این ترکیب در سال 2015 با قیمت درخواستی 100 میلیون دلار وارد بازار شد. Koch در نهایت قیمت را به 80 میلیون دلار در سال بعد کاهش داد. در سال 2020، او 31 هکتار اضافی را که اضافه کرده بود به قیمت 14.5 میلیون دلار فروخت، اما در لژ و بقیه ملک 52 هکتاری باقی ماند. در سال 2025، کخ این ملک را به قیمت 125 میلیون دلار در فهرست خود قرار داد، اما آن را فروخت. در سال 2026، کخ به مسیر حراج رفت - تاکتیکی که گاهی اوقات برای املاک قابل توجه به کار می رود. ملک در نهایت در ماه ژوئیه فروخته شد، اما برای کسری از قیمت اصلی خود. وال استریت ژورنال گزارش داد که پیشنهاد برنده 33.5 میلیون دلار بوده است که کاهش 73 درصدی نسبت به اوج قیمت فهرست خود را نشان می دهد. قیمت بالای 125 میلیون دلاری کخ گران‌ترین"}, {"source": "Business Insider", "title": "Trump threatened Canada's Bombardier over US production. Here's where the planemaker already employs Americans.", "link": "https://www.businessinsider.com/states-where-canada-bombardier-employs-americans-amid-trump-threats-2026-9", "summary": "Bombardier celebrated the completion of its 100th wing for the Global 7500 in Red Oak, Texas, in 2021. Bombardier President Donald Trump threatened to ban Canada's Bombardier from US sales if it doesn't build here. The planemaker already employs thousands of people in the US and spends $2.5 billion annually. Both Republican senators from Kansas, where Bombardier's US headquarters is, defended the company. Canada's biggest aircraft manufacturer has a larger footprint in the US than many people think. Bombardier — known for making multimillion-dollar private jets for A-list celebrities like Matt Damon and Beyoncé — has been among the targets of President Donald Trump's escalating trade war with Canada . The aerospace sector was not among the president's latest sweeping tariffs, but he still floated the idea of banning Bombardier from selling in the US. In a Monday Truth Social post, Trump said the planemaker is \"treating America like a 'piggybank'\" and must build here if it wants access to the US market: \"NO MORE SELLING BOMBARDIER IN THE UNITED STATES!\" he wrote. \"Their products aren't good enough!\" Bombardier quickly released a statement, and without naming Trump, pointed to the company's deep presence in the US: It described thousands of direct jobs across over 20 states, $2.5 billion spent across roughly 2,800 American suppliers in 47 states each year, and a network of offices, maintenance facilities, manufacturing plants , and service centers that serve its high-net-worth customers. Its US headquarters are in Wichita, Kansas, where the Learjet was manufactured until the program's end in 2022, but now focuses on defense, flight testing, and servicing. It also builds wings in Texas and flight control components in California, and it has a large parts distribution center in Chicago that has operated since 2005. It also has mobile truck response team centers — technicians dispatched to assist grounded aircraft in need of repair, technical assistance, or parts — based in 13 states. Overall, Bombardier said it employs 3,500 direct employees in the US. And despite threats from Trump, it told Reuters on Wednesday that it wants to hire another 500, some of whom will work at a new service center set to open in Indiana in November. Some Republicans have publicly defended Bombardier. In a Monday statement , US Sen. Jerry Moran of Kansas said Wichita employs over 1,000 Americans and that he'd contacted the president to ensure he is \"aware of the significant contribu", "date_str": "2026-09-11T17:41:07+00:00", "hash": "f236dde57acdc124", "title_fa": "ترامپ شرکت بمباردیر کانادا را به خاطر تولید آمریکا تهدید کرد. اینجا جایی است که هواپیماساز قبلاً آمریکایی ها را استخدام می کند.", "summary_fa": "Bombardier تکمیل 100 بال خود را برای Global 7500 در Red Oak، تگزاس، در سال 2021 جشن گرفت. دونالد ترامپ، رئیس جمهور بمباردیر تهدید کرد که اگر بمباردیر کانادا در اینجا ساخته نشود، از فروش ایالات متحده منع می کند. این هواپیماساز در حال حاضر هزاران نفر را در ایالات متحده استخدام می کند و سالانه 2.5 میلیارد دلار هزینه می کند. هر دو سناتور جمهوری خواه از کانزاس، جایی که مقر بمباردیر در ایالات متحده است، از این شرکت دفاع کردند. بزرگترین سازنده هواپیمای کانادا، ردپایی در ایالات متحده بیش از آن چیزی است که بسیاری از مردم فکر می کنند. Bombardier - که به خاطر ساخت جت های خصوصی چند میلیون دلاری برای افراد مشهور لیست A مانند مت دیمون و بیانسه معروف است - از جمله اهداف تشدید جنگ تجاری دونالد ترامپ رئیس جمهور آمریکا با کانادا بوده است. بخش هوافضا جزو جدیدترین تعرفه های گسترده رئیس جمهور نبود، اما او همچنان ایده ممنوعیت فروش بمباردیر در ایالات متحده را مطرح کرد. ترامپ در روز دوشنبه در یک پست اجتماعی حقیقت گفت که سازنده هواپیما با آمریکا «مانند یک قلک» رفتار می‌کند و اگر می‌خواهد به بازار ایالات متحده دسترسی داشته باشد باید اینجا بسازد: «دیگر بمب‌افکن فروش در ایالات متحده وجود ندارد!» او نوشت. \"محصولات آنها به اندازه کافی خوب نیست!\" Bombardier به سرعت بیانیه ای را منتشر کرد و بدون نام بردن از ترامپ، به حضور عمیق این شرکت در ایالات متحده اشاره کرد: هزاران شغل مستقیم در بیش از 20 ایالت، 2.5 میلیارد دلار در حدود 2800 تامین کننده آمریکایی در 47 ایالت در سال خرج می شود، و شبکه ای از دفاتر، امکانات تعمیر و نگهداری، کارخانه های تولیدی و مراکز خدماتی با ارزش بالای مشتریانش. مقر ایالات متحده در ویچیتا، کانزاس است، جایی که لیرجت تا پایان برنامه در سال 2022 در"}, {"source": "Business Insider", "title": "Breaking down my $550,000 retirement savings in Bali, Indonesia", "link": "https://www.businessinsider.com/personal-finance/investing/cost-living-retirement-bali-savings-indones e frightening difference between AI and other threats like nuclear war and asteroids", "link": "https://www.businessinsider.com/what-makes-ai-different-from-nuclear-war-climate-change-asteroids-2026-9", "summary": "KATERYNA KON/SCIENCE PHOTO LIBRARY/Getty Images Geoffrey Hinton says a 10% chance AI causes human extinction is not an 'unreasonable' belief. Ramana Kumar explains what distinguishes superintelligent AI from other modern threats like war. The issue, he said, is that AI's capabilities are advancing faster than humans can control. Climate change can't anticipate our next move. An asteroid can't dodge us. And while humans can be adversaries in a nuclear war, the fallout that follows isn't trying to outsmart anyone. For Business Insider's video series \" AI Architects ,\" Ramana Kumar told Business Insider in May 2025 that superintelligent AI could be different. We reconnected with him on Thursday as fresh warnings about AI risk drew new attention to that conversation. Kumar said he does not see AI risk as replacing concerns about climate change, nuclear war, or other catastrophes. Instead, he sees them as related problems: What can happen when power becomes too concentrated, and societies fail to coordinate enough to keep it in check. Superintelligent AI, he added, could be an extreme version of that broader danger. Kumar, who spent about five years as a research scientist on Google DeepMind 's technical AGI safety team, said what distinguishes a powerful adversarial AI is that it could anticipate what humans were doing and work against attempts to stop it. KATERYNA KON/SCIENCE PHOTO LIBRARY/Getty Images That possibility is back in the spotlight after an Anthropic employee quit this week, warning on X that the technology could \"kill us all.\" In response, Geoffrey Hinton, the computer scientist known as the \"Godfather of AI, told BBC Newsnight on Wednesday that a 10% chance of AI wiping out humanity within a decade was \"not an unreasonable estimate.\" He also stressed that nobody knows how to make a reliable prediction. Kumar's warning helps explain what could make that hypothetical threat so difficult to contain: Humans wouldn't simply be trying to stop something dangerous. They could be trying to stop something intelligent enough to work against them. AI could know we're trying to stop it Ramana Kumar spoke with Business Insider in May 2025 for our AI Architects video series. Courtesy of Ramana Kumar Kumar said the aftermath of a nuclear war could be catastrophic. The fallout itself, however, wouldn't be trying to outsmart the humans responding to it. \"When it's the fallout, it's not an adversary, it's just nature taking its course, and humans can work against ", "date_str": "2026-09-11T17:21:58+00:00", "hash": "200d01e20b5d8047", "title_fa": "یک محقق سابق ایمنی Google DeepMind تفاوت ترسناک بین هوش مصنوعی و سایر تهدیدات مانند جنگ هسته ای و سیارک ها را توضیح می دهد.", "summary_fa": "کاترینا کن/کتابخانه عکس علمی/گتی ایماژ جفری هینتون می‌گوید احتمال 10 درصد هوش مصنوعی باعث انقراض انسان‌ها می‌شود، یک باور «غیر معقول» نیست. رامانا کومار توضیح می دهد که چه چیزی هوش مصنوعی فوق هوشمند را از سایر تهدیدات مدرن مانند جنگ متمایز می کند. به گفته او، مسئله این است که توانایی‌های هوش مصنوعی سریع‌تر از آنچه انسان می‌تواند کنترل کند در حال پیشرفت است. تغییرات آب و هوایی نمی تواند حرکت بعدی ما را پیش بینی کند. یک سیارک نمی تواند از ما طفره برود. و در حالی که انسان‌ها می‌توانند در یک جنگ هسته‌ای دشمن باشند، پیامدهایی که در پی می‌آیند تلاش برای پیشی گرفتن از کسی نیست. رامانا کومار برای مجموعه ویدیویی Business Insider «معماران هوش مصنوعی» در می 2025 به Business Insider گفت که هوش مصنوعی فوق‌هوشمند می‌تواند متفاوت باشد. ما روز پنجشنبه دوباره با او ارتباط برقرار کردیم زیرا هشدارهای تازه در مورد خطر هوش مصنوعی توجه جدیدی را به آن مکالمه جلب کرد. کومار گفت که خطر هوش مصنوعی را جایگزین نگرانی‌ها در مورد تغییرات آب و هوایی، جنگ هسته‌ای یا سایر فجایع نمی‌داند. در عوض، او آن‌ها را مشکلات مرتبط می‌داند: وقتی قدرت بیش از حد متمرکز شود و جوامع در هماهنگی کافی برای کنترل آن ناکام باشند، چه اتفاقی می‌افتد. او افزود که هوش مصنوعی فوق‌هوشمند می‌تواند نسخه‌ای شدید از این خطر گسترده‌تر باشد. کومار، که حدود پنج سال به عنوان یک دانشمند پژوهشی در تیم ایمنی فنی AGI گوگل دیپ‌مایند گذراند، گفت آنچه که هوش مصنوعی قدرتمند دشمن را متمایز می‌کند این است که می‌تواند کارهایی که انسان‌ها انجام می‌دهند را پیش‌بینی کند و در برابر تلاش‌ها برای متوقف کردن آن کار کند. KATERYNA KON/کتابخانه عکس علمی/Getty Images این احتمال پس از استعفای یکی از کارکنان Anthropic در این هفته در کانون توجه قرار گرفت و در X هشدار داد که"}, {"source": "Business Insider", "title": "In supply chain cyberattacks, AI is being used to fight AI", "link": "https://www.businessinsider.com/supply-chain-cyberattacks-ai-to-fight-ai-2026-9", "summary": "Getty Images; BI Logistics companies have reported data breaches, highlighting supply chain vulnerabilities. AI in supply chains increases efficiency but also exposes systems to cyber threats, experts say. Supply chain cyberattacks disrupt operations, prompting calls for AI-enhanced cybersecurity measures. In mid-August, Uber Freight revealed a cybersecurity incident involving unauthorized access to a portion of its systems and data. Days prior, Ceva Logistics , a subsidiary of CMA CGM, reported a data breach that affected numerous companies and leaked their customers' personal information. Weeks before that, Coca-Cola's dairy brand Fairlife was hit by a ransomware attack , prompting the company to temporarily suspend its US operations. Concerns around supply chain hacks are only growing, \"as we do more and more intelligent things with these computers and as more and more they're becoming the brain of an autonomous system,\" Said Ouissal, the founder CEO of the edge-computing software company ZEDEDA, told Business Insider. Warehouses and plants are adopting AI technologies like trackers on trucks and forklifts, cameras and temperature sensors inside facilities, laptops and tablets, and GPS systems. As they do, they're becoming more vulnerable to cybersecurity incidents, said Bart Bullard, the chief technology officer of Source Logistics, a warehousing, fulfillment, and transportation provider. It's a catch-22: the very technologies that supply chain operators use to stay competitive are also \"vectors of entry\" for hackers to gain access to company systems, Bullard said. As supply chain executives grapple with this increasingly common challenge, they're also finding that AI can be a part of the solution, Ouissal said. What's at stake in a supply chain cyberattack When a data breach occurs, companies will shut down their systems until they can identify the source of the issue. That can take an average of 247 days, according to an IBM report this year. Supply chain attacks are particularly problematic because a data breach that suspends operations can disrupt the timing of the entire supply chain. Production is delayed and products could expire, Bullard said. That's what happened when Jaguar Land Rover was hit by a cyber attack last fall. Production halted for six weeks. During the shutdown, suppliers lost work, and some small companies went out of business, said Liz James, a managing security consultant at cybersecurity firm NCC Group. Attacks also occur with", "date_str": "2026-09-11T17:12:17+00:00", "hash": "5a99edc96755bdc5", "title_fa": "در حملات سایبری زنجیره تامین، از هوش مصنوعی برای مبارزه با هوش مصنوعی استفاده می شود", "summary_fa": "گتی ایماژ; شرکت‌های لجستیک BI نقض داده‌ها را گزارش کرده‌اند که آسیب‌پذیری‌های زنجیره تامین را برجسته کرده‌اند. کارشناسان می‌گویند هوش مصنوعی در زنجیره‌های تامین، کارایی را افزایش می‌دهد، اما سیستم‌ها را در معرض تهدیدات سایبری نیز قرار می‌دهد. حملات سایبری زنجیره تامین، عملیات را مختل می کند و باعث می شود که اقدامات امنیتی سایبری تقویت شده با هوش مصنوعی درخواست شود. در اواسط آگوست، Uber Freight یک حادثه امنیت سایبری شامل دسترسی غیرمجاز به بخشی از سیستم ها و داده های خود را فاش کرد. چند روز قبل، Ceva Logistics، یکی از شرکت‌های تابعه CMA CGM، نقض داده‌ای را گزارش کرد که شرکت‌های متعددی را تحت تأثیر قرار داد و اطلاعات شخصی مشتریان آنها را فاش کرد. هفته‌ها قبل از آن، برند لبنیات کوکاکولا فیرلایف مورد حمله باج‌افزاری قرار گرفت که باعث شد این شرکت به‌طور موقت فعالیت‌های خود در ایالات متحده را به حالت تعلیق درآورد. Said Ouissal، مدیرعامل شرکت نرم‌افزار محاسبات لبه ZEDEDA، به Business Insider گفت: نگرانی‌ها در مورد هک‌های زنجیره تامین تنها در حال افزایش است، \"از آنجایی که ما کارهای هوشمندانه‌تری با این رایانه‌ها انجام می‌دهیم و هرچه بیشتر و بیشتر به مغز یک سیستم مستقل تبدیل می‌شوند.\" انبارها و کارخانه‌ها از فناوری‌های هوش مصنوعی مانند ردیاب‌ها در کامیون‌ها و لیفتراک‌ها، دوربین‌ها و سنسورهای دما در داخل تأسیسات، لپ‌تاپ‌ها و تبلت‌ها و سیستم‌های GPS استفاده می‌کنند. بارت بولارد، مدیر ارشد فناوری سورس لجستیک، یک تامین کننده انبارداری، تکمیل و حمل و نقل، گفت: همانطور که آنها انجام می دهند، آنها در برابر حوادث امنیت سایبری آسیب پذیرتر می شوند. بولارد گفت: فناوری‌هایی که اپراتورهای زنجیره تامین برای رقابتی ماندن از آن استفاده می‌کنند، برای هکرها برای دسترسی به سیستم‌های شرکت نیز \"بردار ورود\" هستند. Ouissal گفت، از آنجایی که مدیران زنجیره تامین با این چالش رو به افزایش رایج دست و پنجه نرم می"}, {"source": "Business Insider", "title": "BofA says record-high diesel is a ‘real-economy pressure point’ that's flashing a warning", "link": "https://www.businessinsider.com/diesel-record-price-economic-impact-shipping-freight-gas-bofa-2026-9", "summary": "Bloomberg/Getty Images Diesel prices in the US hit $6 per gallon for the first time on Friday amid oil's latest surge. BofA warns that high diesel costs are a \"pressure point\" for the economy. \"Record diesel prices will impact every cargo, shipment, every delivery Americans are taking,\" GasBuddy said. The market's attention may be on rising bond yields , but Bank of America says there's a more immediate concern for the economy already feeling the sting of high energy costs. Diesel prices set a new record on Thursday, topping $6 per gallon for the first time ever in the US. Investors are already attuned to crude oil prices, which have climbed past $100 per barrel and pushed up the cost of regular gas, but BofA says markets are underestimating the broader impact of surging diesel. The combination of geopolitical tensions and global refining constraints has kept energy markets in focus as princes continue trending upward. In BofA's view, markets need to pay attention to the cost of diesel as a source of volatility, as it is the fuel source for much of the commercial economy. \"Markets stop panicking when policymakers start panicking…but no panic anywhere despite the highest 30yr yield since Jun'07 and spiking commodities; oil at $100/bbl takes headlines but diesel is the key real-economy pressure point: shipping, trucking, agriculture, construction, mining,\" BofA wrote in a note to investors on Friday. \"Blasé markets + bravado policy = recipe for volatility.\" Gas market intelligence platform GasBuddy said that while the headlines are focused on the price of gasoline , record-high diesel costs are too important to ignore. \"Not every day are new all-time records set, and this will be a particularly painful one for the economy that may not even be immediately felt, but record diesel prices will impact every cargo, shipment, every delivery Americans are taking, and are likely to reignite inflation up and down the supply chain,\" said Patrick De Haan, GasBuddy's head of petroleum analysis. Gasbuddy noted that the prices of household goods and groceries are likely to be driven upward by higher diesel costs. That comes at a time when inflation weighing on consumer sentiment, and continues to outpace wage growth . Finance pros have predicted recently that even while gas and diesel prices rise, the coming energy shock may be even larger market watchers are anticipating. The average cost of diesel fuel in the US has risen about 60% since the Iran war broke out in Februar", "date_str": "2026-09-11T17:09:43+00:00", "hash": "66202b21ffb862a9", "title_fa": "BofA می‌گوید رکورد بالای دیزل یک «نقطه فشار اقتصادی واقعی» است که یک هشدار است", "summary_fa": "بلومبرگ/گتی ایماژ قیمت دیزل در ایالات متحده برای اولین بار در روز جمعه در بحبوحه آخرین افزایش قیمت نفت به ۶ دلار در هر گالن رسید. BofA هشدار می دهد که هزینه های بالای دیزل یک \"نقطه فشار\" برای اقتصاد است. GasBuddy گفت: \"قیمت های بی سابقه دیزل بر هر محموله، محموله، هر تحویلی که آمریکایی ها می گیرند، تاثیر می گذارد.\" توجه بازار ممکن است معطوف به افزایش بازده اوراق قرضه باشد، اما بانک آمریکا می‌گوید نگرانی‌های فوری‌تری برای اقتصاد وجود دارد که در حال حاضر فشار ناشی از هزینه‌های بالای انرژی را احساس می‌کند. قیمت گازوئیل در روز پنجشنبه رکورد جدیدی را ثبت کرد و برای اولین بار در ایالات متحده از 6 دلار در هر گالن عبور کرد. سرمایه‌گذاران در حال حاضر با قیمت‌های نفت خام که از 100 دلار در هر بشکه گذشته و قیمت گاز معمولی را بالا برده است، هماهنگ شده‌اند، اما BofA می‌گوید بازارها تأثیر گسترده‌تر افزایش گازوئیل را دست کم می‌گیرند. ترکیب تنش‌های ژئوپلیتیکی و محدودیت‌های پالایش جهانی، بازارهای انرژی را در کانون توجه قرار داده است، زیرا شاهزاده‌ها به روند صعودی خود ادامه می‌دهند. از نظر BofA، بازارها باید به هزینه دیزل به عنوان منبع نوسانات توجه کنند، زیرا این منبع سوخت برای بیشتر اقتصاد تجاری است. زمانی که سیاست گذاران شروع به وحشت کردند، بازارها دچار وحشت نمی شوند... اما با وجود بالاترین بازدهی 30 ساله از ژوئن 07 و جهش کالاها، هیچ وحشتی در هیچ کجا وجود ندارد؛ نفت 100 دلار در هر بشکه خبرها را به خود اختصاص می دهد، اما گازوئیل نقطه فشار اصلی اقتصاد واقعی است: کشتیرانی، حمل و نقل، کشاورزی، ساخت و ساز، سرمایه گذاران در روز جمعه نوشتند. \"بازارهای Blasé + سیاست شجاعانه = دستور العمل برای نوسانات.\" پلتفرم اطلاعاتی بازار گاز GasBuddy گفت که در حالی که سرفصل ها بر قیمت بنزین متمرکز"}, {"source": "Business Insider", "title": "Why moms on your social feed are suddenly saying not to post your kids' pics anymore", "link": "https://www.businessinsider.com/parents-stop-posting-kid-photos-ai-fears-meta-ai-suggestions-2026-9", "summary": "MTStock Studio/Getty Images The parenting debate about how much to share photos of kids is changing because of AI. A viral video about Meta AI's suggested questions has people worried. Meta said they were a mistake that has been fixed. Fears that children's photos may be used for CSAM is changing how parents and photographers share online. The debate about whether or not to post your kids' faces on social media isn't new. I have friends whose kids are in college now who I remember struggled with the decision about whether to post baby photos to Instagram. But very recently, that conversation has taken a significant turn because of concerns about AI — and even prompted Meta to take action. Two viral things have happened on Instagram in the last week or so, with pretty different origins but ultimately the same result: parents saying that they shouldn't post images of their children online anymore. The first was a viral Instagram from Kalie Robins, a mom in Utah. Robins was shocked and creeped out when she noticed Meta AI suggestions on a video she had posted of herself and her kid. The Meta AI chatbot suggested questions like \"who's the child passenger?\" Following more of the Meta AI questions, Robins found that it pulled photos of her that she believed had been deleted, and information about her kids from her mother's Facebook page. View this post on Instagram A post shared by Kalie | Travel Mom Creator (@kontheinside) While yes, Meta AI was pulling information that already exists online, it was also suggesting questions about the identity of children — potentially suggesting that to strangers (it's unclear if only Kalie saw this set of Meta AI questions or if a stranger would have been suggested different ones). Meta told me that these AI suggestions were a mistake that had since been fixed. \"When someone clicks on a prompt and uses this feature, the response it generates is based on information the user already has access to,\" said Meta spokesperson Andy Stone. \"But we missed the mark because the feature never should have prompted the individual with questions like that and we've fixed that issue.\" Meta AI suggested questions about her kids I spoke with Robins, and she expressed that she wasn't unaware of how Meta AI was able to pull up the information. To her, it was a stark reminder of just how much of our data is on social media, even if we don't realize it. \"I thought I was so careful because I never did the back-to-school photos with the school and t", "date_str": "2026-09-11T17:06:59+00:00", "hash": "1ecd5b7d431a972b", "title_fa": "چرا مادران در فید اجتماعی شما ناگهان می گویند که دیگر عکس های بچه هایتان را پست نکنید", "summary_fa": "استودیو MTStock/Getty Images بحث والدین درباره میزان اشتراک‌گذاری عکس‌های کودکان به دلیل هوش مصنوعی در حال تغییر است. یک ویدیوی ویروسی درباره سوالات پیشنهادی متا هوش مصنوعی مردم را نگران کرده است. متا گفت که آنها اشتباهی بودند که رفع شده است. ترس از استفاده از عکس‌های کودکان برای CSAM نحوه اشتراک‌گذاری آنلاین والدین و عکاسان را تغییر می‌دهد. بحث در مورد اینکه آیا باید چهره فرزندان خود را در رسانه های اجتماعی پست کنید یا نه موضوع جدیدی نیست. من دوستانی دارم که بچه‌هایشان اکنون در دانشگاه هستند و به یاد می‌آورم که با تصمیم‌گیری درباره پست کردن عکس‌های کودک در اینستاگرام مشکل داشتند. اما اخیراً، این مکالمه به دلیل نگرانی‌های مربوط به هوش مصنوعی تغییر قابل توجهی پیدا کرده است - و حتی متا را وادار به اقدامی کرده است. در هفته گذشته دو اتفاق ویروسی در اینستاگرام رخ داده است، با منشأ کاملاً متفاوت، اما در نهایت نتیجه یکسان: والدین می‌گویند که دیگر نباید تصاویر فرزندان خود را به صورت آنلاین منتشر کنند. اولین مورد یک اینستاگرام ویروسی از کالی رابینز، مادری در یوتا بود. رابینز وقتی متوجه پیشنهادات هوش مصنوعی متا در ویدیویی شد که از خودش و فرزندش پست کرده بود، شوکه شد و خزید. ربات چت هوش مصنوعی متا سوالاتی مانند \"کودک مسافر کیست؟\" رابینز در ادامه سوالات بیشتر هوش مصنوعی متا دریافت که عکس‌هایی از او که فکر می‌کرد حذف شده‌اند و اطلاعات مربوط به بچه‌هایش را از صفحه فیس‌بوک مادرش بیرون آورده است. مشاهده این پست در اینستاگرام پست به اشتراک گذاشته شده توسط Kalie | Travel Mom Creator (@kontheinside) در حالی که بله، هوش مصنوعی متا در حال جمع‌آوری اطلاعاتی بود که قبلاً به صورت آنلاین وجود دارد، همچنین سؤالاتی در مورد هویت کودکان پیشنهاد می‌کرد - احتمالاً این موضوع را به غریبه‌ها پیشنهاد می‌کرد (معلوم نیست که آیا فقط کالی"}, {"source": "Business Insider", "title": "Brooks Brothers was steps from the World Trade Center on 9/11. Its creative director still can't look at the pictures.", "link": "https://www.businessinsider.com/brooks-brothers-9-11-store-ground-zero-2026-9", "summary": "Brooks Brothers creative director Michael Bastian spoke with Business Insider about the 25th anniversary of 9/11. JP Yim/Getty Images for Delivering Good ; Peter Turnley/Getty Images It has been 25 years since the terrorist attacks of September 11, 2001. A Brooks Brothers store near Ground Zero served as a morgue in the aftermath of the attacks. Creative director Michael Bastian told Business Insider he \"still can't look at the pictures\" from that day. Like many people, Brooks Brothers creative director Michael Bastian remembers exactly where he was on the morning of September 11, 2001 . \"9/11 is personal for me,\" he told Business Insider during New York Fashion Week on Thursday as Brooks Brothers presented its Spring/Summer 2027 collection. \"I was in the air on 9/11. I was flying back from a trade show in Paris. I was working at Bergdorf Goodman at the time. And I ended up in Nova Scotia in Halifax, Canada.\" After hijacked planes hit the World Trade Center and the Pentagon, the Federal Aviation Administration issued a full national ground stop, shutting US airspace for the first time in history. It took Bastian four days to get back home to a New York City that was no longer recognizable. A Brooks Brothers store near the World Trade Center sustained heavy damage on September 11, 2001. Peter Turnley/Getty Images \"It really changed everyone's life,\" Bastian, who joined Brooks Brothers as creative director in 2020, said. Brooks Brothers, a 208-year-old menswear brand founded by Henry Sands Brooks in New York City, is also part of the history of that terrible day and the recovery efforts that followed. In the immediate aftermath of the September 11 terrorist attacks, a Brooks Brothers store, located next to the World Trade Center at One Liberty Plaza, served a different, tragic purpose: a makeshift morgue. Firefighters at One Liberty Plaza on September 16, 2001. Spencer Platt/Getty Images Once a place where job candidates deliberated over ties ahead of interviews in the Twin Towers, the men's shirt department at Brooks Brothers transformed into a holding area for bodies — and body parts — pulled from the rubble of the World Trade Center . Victims' remains were held there until they could be moved to New York City's Office of the Chief Medical Examiner for identification. The Brooks Brothers location at One Liberty Plaza sustained heavy damage when the Twin Towers collapsed, but reopened exactly one year after the attacks. While the store is no longer there — ", "date_str": "2026-09-11T16:38:12+00:00", "hash": "099dfbd2a380599d", "title_fa": "برادران بروکس در 11 سپتامبر چند قدم از مرکز تجارت جهانی فاصله داشت. مدیر خلاق آن هنوز نمی تواند به تصاویر نگاه کند.", "summary_fa": "مایکل باستیان، مدیر خلاق برادران بروکس، با بیزینس اینسایدر درباره بیست و پنجمین سالگرد 11 سپتامبر صحبت کرد. JP Yim/Getty Images for Delivering Good ; پیتر ترنلی/ گتی ایماژ 25 سال از حملات تروریستی 11 سپتامبر 2001 می گذرد. ​​یک فروشگاه برادران بروکس در نزدیکی Ground Zero به عنوان سردخانه پس از حملات عمل کرد. مایکل باستیان، مدیر خلاقیت، به Business Insider گفت که «هنوز نمی‌تواند به تصاویر آن روز نگاه کند». مانند بسیاری از مردم، مایکل باستیان، مدیر خلاق برادران بروکس، دقیقاً به یاد می آورد که در صبح روز 11 سپتامبر 2001 کجا بود. او روز پنجشنبه در هفته مد نیویورک به Business Insider گفت: «11 سپتامبر برای من شخصی است. من در 11 سپتامبر در هوا بودم. از یک نمایشگاه تجاری در پاریس پرواز می کردم. در آن زمان در برگدورف گودم
