<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۷ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۷ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۹ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۱۲</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۸</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۲۱</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

شته‌شدگان و اعدام‌شدگان، بازداشت‌شدگان و ناپدیدشدگان، نقض دادرسی عادلانه، وخیم‌تر شدن فضای مدنی و معیشت مردم و وضعیت محیط زیست و همچنین شرایط زندان‌های ایران در این هشت ماه پرداخته است. رویدادهای دی ماه ۱۴۰۴ و رخدادهای جنگ هم در گزارش مای ساتو بررسی شده‌اند. با این حال خانم ساتو تاکید کرد که «آنچه در این گزارش آمده است، تنها بخش کوچکی از اتفاقاتی است که افتاده است. قطع ارتباطات مخابراتی هیچ راه ایمن برای ارسال اطلاعات به خارج ازکشور باقی نگذاشت. برخی از افرادی که در ابتدا برای ارائه اطلاعات پیشقدم شده بودند، با سنجیدن دوباره پیامدهای این اقدام برای خود و ًخانواده‌شان، رضایت خود را پس گرفتند.» از این رو، «هیچ بخش این گزارش نباید به عنوان تصویر کامل از آنچه بر مردم در ایران رفته است تلقی شود.» خانم ساتو نوشت: «در بازه این گزارش، هزاران نفر در ایران، هم در اثر حملات ایالت متحده آمریکا", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/0439/live/1b71ede0-d2de-11f1-b677-b762d2f83f6e.jpg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آبان • ۱۸:۱۵"}, {"source": "Iran International", "title": "علیه فراموشی؛ علیرضا دبیر چرا از محسنی‌اژه‌ای، قاضی‌القضات اعدام، تشکر کرد؟", "link": "https://www.iranintl.com/202610280980", "summary": "علیرضا دبیر، رییس فدراسیون کشتی در گفتگویی در حاشیه مسابقات جهانی کشتی، از غلامحسین محسنی‌اژه‌ای، رییس قوه قضاییه، تشکر ویژه‌ای کرد.", "date_str": "2026-10-28T14:33:30+00:00", "hash": "46a1acb5d6e4e620", "title_fa": "علیه فراموشی؛ علیرضا دبیر چرا از محسنی‌اژه‌ای، قاضی‌القضات اعدام، تشکر کرد؟", "summary_fa": "علیرضا دبیر، رییس فدراسیون کشتی در گفتگویی در حاشیه مسابقات جهانی کشتی، از غلامحسین محسنی‌اژه‌ای، رییس قوه قضاییه، تشکر ویژه‌ای کرد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/a112846c590eb8052e346ba300c80d0960f085c7-1080x1350.png?rect=0,195,1080,567&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آبان • ۱۸:۰۳"}, {"source": "Iran International", "title": "مرگبارترین سوانح ریلی تاریخ اسپانیا", "link": یلی با تبار عرب نیز، در پی مشارکت گسترده رأی‌دهندگان با انگیزه بالا، در مجموع ۱۹ کرسی به دست خواهند آورد که رقمی بی‌سابقه برای این احزاب است. با ادامه شمارش آرا، نتایج همچنان ممکن است تغییر کند، اما به نظر می‌رسد شانس آیزنکوت برای پیروزی بسیار ضعیف شده است. ائتلاف او که احزاب مخالف نتانیاهو از چپ میانه تا راست تندرو را در بر می‌گیرد، برخلاف نظرسنجی‌های پیش از انتخابات که از رقابتی نزدیک حکایت داشتند، عملکردی ضعیف‌تر از انتظار داشته است. اگرچه ائتلاف نتانیاهو اکثریت شکننده خود را در کنست، پارلمان ۱۲۰ کرسی اسرائیل، از دست داده است، مخالفان او نیز امید چندانی برای برکناری نخست‌وزیر ندارند؛ مگر آنکه به توافقی بعید برای جلب حمایت گسترده احزاب عرب دست یابند، اقدامی که بسیاری از رهبران یهودی با آن مخالف‌اند. حتی در چنین شرایطی نیز نتانیاهو در جریان مذاکرات برای تشکیل ائتلاف جدید، یا تا زمان برگزاری انتخابات بعدی در سال آینده، در مقام نخست‌وزیر موقت باقی خواهد ماند. این در حالی است که رئیس‌جمهور اسرائیل از احزاب این کشور خواست که با رسیدن به تفاهم، مانع از برگزاری انتخابات بعدی شوند. اسحاق هرتزوگ که مسئولیت تعیین نامزد مأمور تشکیل دولت را بر عهده دارد، گفت: «باید هر کاری", "image_url": "https://gdb.rferl.org/8cb4cfab-c0a3-4041-8095-113e121737bd_cx1_cy1_cw95_w1200_h630.jpg", "category": "سیاست و دیپلماسی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۶ آبان • ۱۷:۵۸"}],
      tech: [{"source": "TechCrunch AI", "title": "Voice AI in vogue: Nvidia releases new open transcription model", "link": "https://techcrunch.com/2026/10/28/voice-ai-in-vogue-nvidia-releases-new-open-transcription-model/", "summary": "Nvidia just released a free speech-to-text model that can transcribe up to 40 languages, but it only works on recordings, not live audio, so it’s a big step for meeting and medical transcription tools while still leaving real-time use to rivals like ElevenLabs.", "date_str": "2026-10-28T15:00:00+00:00", "hash": "24055bcef47ecfc1", "title_fa": "هوش مصنوعی صوتی در مد: انویدیا مدل رونویسی باز جدیدی را منتشر کرد", "summary_fa": "انویدیا به تازگی یک مدل گفتار به متن رایگان منتشر کرده است که می‌تواند تا 40 زبان را رونویسی کند، اما فقط روی ضبط‌ها کار می‌کند، نه صدای زنده، بنابراین گام بزرگی برای ابزارهای رونویسی جلسات و پزشکی است و در عین حال استفاده بلادرنگ را به رقبایی مانند ElevenLabs واگذار می‌کند. انویدیا روز چهارشنبه Nemotron 3.5 Transcribe را منتشر کرد، یک مدل رایگان و با وزن باز که صدا را به حداکثر 40 زبان رونویسی می کند. همچنین نسخه 2 Granary، مجموعه داده گفتار منبع باز خود را منتشر کرد. انویدیا به خود می بالد که Nemotron 3.5 می تواند 31 زبان را به انگلیسی و از انگلیسی ترجمه کند، ضبط ها را تا یک ساعت انجام دهد و تا 8 سخنران را از هم تفکیک کند. این شرکت ادعا می کند که در معیارها، از جمله Hugging Face s Open ASR Leaderboard، رقبای خود را شکست می دهد. این ابزارها توسعه‌دهندگانی را هدف قرار می‌دهند که برنامه‌هایی را برای جلسات کاری و رونویسی پزشکی می‌سازند، دو مورد از تثبیت‌ترین پایگاه‌های هوش مصنوعی در محل کار. انویدیا می گوید که توسعه دهندگان می توانند از مدل، مجموعه داده Granary به روز شده و ابزارهایی مانند مدل NeMo Speech برای سفارشی کردن برنامه ها برای تشخیص اصطلاحات تخصصی صنعت در هر زبان استفاده کنند. یک اشکال: رونویسی با صدای ضبط شده کار می کند، نه با پخش جریانی زنده. با این حال، این شرکت قول می‌دهد که Transcribe با 30 میلیارد پارامتر، می‌تواند روی یک تراشه واحد اجرا شود، از کنترل‌کننده روباتیک Jetson AGX Thor و تراشه DGX Spark mans in readable code and then compiled into binary 1s and 0s that the PC or console running it can read; decompiling is the reversal of that process, revealing a game’s source code, which humans can then edit and mess around with for fun. This used to be an extremely laborious process. But now it is not, because humans aren’t doing much of it any more. Continue reading...", "date_str": "2026-10-28T15:00:05+00:00", "hash": "2a0d333e32b79c20", "title_fa": "رسانه‌های اجتماعی پر از بازی‌های ویدیویی عجیب و غریب هستند. همه آنها از کجا می آیند؟", "summary_fa": "ابزارهای هوش مصنوعی اصلاح و بازآفرینی بازی‌ها را آسان‌تر می‌کنند و سؤالاتی را در مورد دزدی دریایی، حق نسخه‌برداری و این که این فناوری تا چه حد می‌تواند صنعت را مختل کند ایجاد می‌کند • آیا دکمه‌های فشاری به صندوق ورودی شما تحویل داده نمی‌شوند؟ اینجا ثبت‌نام کنید اگر الگوریتم‌های رسانه‌های اجتماعی شما به این نتیجه رسیده‌اند که شما به بازی‌های ویدیویی علاقه دارید، در چند هفته گذشته اتفاق عجیبی رخ داده است. فید شما، مانند من، مملو از کلیپ‌هایی از پخش‌کننده‌هایی است که در حال پخش ترکیب‌های عجیب و غریب از بازی‌های ویدیویی محبوب هستند. Skyrim در Minecraft. هالو، به جز شخصیت اصلی ماریو است. اسکیت 2 در نقشه های Call of Duty. سیلی از مدهای بازی کدگذاری شده با ظاهر حرفه ای که نگاه کردن به آنها برای 30 ثانیه کمی جالب است، اما در نهایت بی اهمیت است. آیا می‌توانم مدی را دانلود کنم که به من امکان بازی Wii Bowling را در یک شوتر زامبی بدهد؟ نه، اما من بسیار علاقه مندم که آنها از کجا آمده اند. البته، پاسخ - یا حداقل، بیشتر پاسخ - هوش مصنوعی است. پس از یک هفته تحقیق در این مورد (به‌ویژه به لطف حالت پخش مجدد در YouTube برای این ویدیوی آموزنده، که من را در این مسیر قرار داد) اکنون می‌دانم که این حالت‌های mashup فقط ویدیوهای تولید شده توسط هوش مصنوعی نیستند، بلکه کدنویسی به کمک هوش مصنوعی هستند. اساساً از چند هفته پیش، Anthropic's Claude در دیکامپایل کردن کد بازی های ویدیویی بسیار خوب عمل کرده است. بازی‌ها توسط انسان‌ها با کدهای قابل خواندن نوشته می‌شوند و سپس به 1 و 0 باینری کامپایل می‌شوند که رایانه شخصی یا کنسولی که آن را اجرا می‌کند ست مثل دزدیدن شمش‌های طلای خالص است. ارزش برخی از محموله‌های سرقت‌شده به بیش از ۳۰ میلیون دلار می‌رسد. دزدیدن قطعات بسیار آسان‌تر از سرقت بانک به حساب می‌آید.» لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/cover-6a82b32b7023b9d484304a01?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۶ آبان • ۱۷:۳۵"}, {"source": "Lifehacker", "title": "These Are the Best Arc Browser Alternatives, Now That It's Shutting Down", "link": "https://lifehacker.com/tech/best-arc-browser-alternatives?utm_medium=RSS", "summary": "Well, it happened: The Browser Company has finally announced that it will be sunsetting the Arc browser before the end of 2026 . The writing has been on the wall for well over a year now: Arc had already been put on ice, receiving only maintenance updates after the Browser Company switched its focus to Dia, an AI browser that shares Arc s framework but lacks the wonderful interface features that made Arc such a joy to use . This is sad news for the Arc faithful. If you're one of them, or if you re looking for an alternative to the regular browsers like Safari and Chrome, all hope is not lost. Export your Arc data , and try out one of these Arc-like alternatives. The Zen Browser is the best Arc alternative Credit: Zen Browser Zen has become the de facto option for all users looking to find something that looks and works like Arc. In some ways, it s better than Arc; in some ways it falls short. It has the look and feel down to a T. Zen has the same vertical sidebar, with customizable workspaces and pinned tabs up top. And like Arc, Zen has mods that let you customize the browser's user interface (plus a ton of community-developed mods ready to go). Zen is also free to use, and it s open-source. Cherry on top? There are no AI features. None. No upsells, no VPN, no schemes, nothing. It s built on Firefox, and it has a privacy-first approach. I ve been using Zen for months, and I m quite happy with it. The only downside I can see is the Firefox web engine; while Gecko has come a long way, it can still sometimes fall short of Chromium, mostly because Google Chrome is such a popular browser, most websites are designed to run best on it. When I run into an issue with a website, I tend to switch to Chrome for a while. Zen can also sometimes be a memory hog, but once I got better at tab hygiene (automatically closing older tabs and being vigilant about workspace management), the experience got quite a bit better. And yes, there is extension support: Anything that runs on Firefox will run here too. Firefox has most of the important extensions covered, and it s the only major browser that still supports the full-scale uBlock Origin ad blocker (which works like a treat in Zen, too). Vivaldi takes a maximalist approach to web browsing Credit: Vivaldi Alternatively, you can go to the opposite end of the spectrum and try out a maximalist browsing approac:. For a while, Microsoft Edge was the cleaner, faster, better version of Chrome, but now, that title goes to Vivaldi . ", "date_str": "2026-10-28T14:30:00+00:00", "hash": "ff29aebf5d792a95", "title_fa": "اینها بهترین گزینه های جایگزین مرورگر Arc هستند، اکنون که در حال خاموش شدن است", "summary_fa": "خوب، این اتفاق افتاد: شرکت مرورگر سرانجام اعلام کرد که مرورگر Arc را قبل از پایان سال 2026 غروب می کند. این نوشته بیش از یک سال است که روی دیوار مانده است: Arc قبلاً روی یخ گذاشته شده بود و پس از اینکه شرکت مرورگر تمرکز خود را بر روی Dia تغییر داد، فقط به‌روزرسانی‌های تعمیر و نگهداری را دریافت می‌کرد، یک مرورگر هوش مصنوعی که چارچوب Arc را به اشتراک می‌گذارد اما فاقد ویژگی‌های رابط فوق‌العاده‌ای است که Arc را برای استفاده بسیار لذت‌بخش کرده است. این یک خبر ناراحت کننده برای وفاداران Arc است. اگر شما یکی از آنها هستید، یا اگر به دنبال جایگزینی برای مرورگرهای معمولی مانند سافاری و کروم هستید، تمام امیدتان از بین نمی رود. داده های Arc خود را صادر کنید و یکی از این گزینه های مشابه Arc را امتحان کنید. مرورگر Zen بهترین جایگزین Arc است. از برخی جهات، بهتر از Arc است. از برخی جهات کوتاه می آید. ظاهر و احساسی تا حد T دارد. Zen همان نوار کناری عمودی، با فضاهای کاری قابل تنظیم و برگه‌های سنجاق‌شده در بالا را دارد. و مانند Arc، Zen دارای حالت‌هایی است که به شما امکان می‌دهد رابط کاربری مرورگر را سفارشی کنید (به‌علاوه تعداد زیادی مدهای توسعه‌یافته توسط جامعه آماده کار). استفاده از Zen نیز رایگان است و منبع باز است. گیلاس بالای سر؟ هیچ ویژگی هوش مصنوعی وجود ندارد. هیچ کدام. بدون افزایش فروش، بدون VPN، بدون طرح، هیچ چیز. این بر روی فایرفاکس ساخته شده است، و رویکرد اول حفظ حریم خصوصی دارد. من ماه هاست که از Zen استفاده می کنم و کاملا از آن راضی هستم. تنها نقطه ضعفی که می توانم ببینم موتور وب فایرفاکس است. اگرچه Gecko راه درازی را پیموده است، هنوز هم گاهی اوقات ممکن است از Chromium کوتاه بیاید، بیشتر به این", "image_url": "https://lifehacker.com/imagery/articles/01M619S6VG20JXY66C81C857NA/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "Microsoft"], "datetime_fa": "۶ آبان • ۱۸:۰۰"}, {"source": "Lifehacker", "title": "This Pricey New Accessory Gives Your Kindle a Feature That Used to Be Standard", "link": "https://lifehacker.com/tech/the-kindle-page-turn-cover-turns-your-paperwhite-into-an-oasis?utm_medium=RSS", "summary": "We may earn a commission from links on this page. It has been 14 years since Amazon made a Kindle e-reader without a touchscreen, and while I certainly don't miss the days of slowly paging through my e-book library with the arrow keys on my Kindle Keyboard, the move to touch navigation did have one unfortunate result, at least for a small subset of readers: the loss of physical page-turn buttons. Once standard on all Kindles, they eventually became a premium feature available only on the pricey Kindle Oasis, before being dropped from the lineup entirely when that device was retired in 2024. While this fall's overhaul of the Kindle lineup introduced upgrades like a metal enclosure and a flush-front design, Amazon hasn't exactly reintroduced physical buttons, but the company has launched a new accessory to appeal to the roughly 5% of the market (per Kevin Keith, Amazon's vice president in charge of Kindle) that essentially turns your new Kindle Paperwhite Signature Edition into a Kindle Oasis: the Kindle Page-Turn Cover . The Page-Turn Cover builds the buttons into the case Credit: Joel Cunningham Releasing alongside the new flush-front Kindle Paperwhite Signature Edition, the Page-Turn Cover is made of plant-based leather (in one of three colors to match your Kindle Graphite, Fig, or Seaglass Green) with a magnetic front flap, a soft interior, and a right-hand bezel made of lightly textured plastic that houses two thin, elongated buttons. When you slot your compatible Kindle into the case, connecting it magnetically and via the built-in pogo pins, it will automatically pair with the device, allowing you to turn pages with a button press instead of a tap. By default, the top button will advance you forward by one page, and the bottom button will do the reverse, though you can change which does which in your device settings. While the physical buttons on some Boox and Barnes Noble Nook devices allow you to map different functions like skipping an entire chapter or scrubbing through a book quickly to a long-press or double-tap, as of this writing, the Page-Turn Cover will only let you turn one page at a time. The buttons also only work for turning pages; you'll still navigate your library and the device menus using the touchscreen. If you're a lefty, or prefer to swap which hand you use to hold your e-reader, you can change up the orientation by turning off Lock Rotation on your device; when you flip it over to hold in your other hand, the text will automatica", "date_str": "2026-10-28T14:00:10+00:00", "hash": "dd0d822a23fcdec2", "title_fa": "این لوازم جانبی گران قیمت به کیندل شما ویژگی استانداردی می دهد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. ۱۴ سال از زمانی که آمازون یک کتابخوان الکترونیکی Kindle بدون صفحه لمسی ساخت، می‌گذرد، و اگرچه من مطمئناً روزهایی را که به آرامی در کتابخانه کتاب الکترونیکی خود با کلیدهای پیکان روی صفحه‌کلید Kindle خود جستجو می‌کردم را از دست نمی‌دهم، حرکت به سمت ناوبری لمسی حداقل برای زیرمجموعه کوچکی از خوانندگان یک نتیجه ناگوار داشت: از دست دادن دکمه‌های فیزیکی برای چرخاندن صفحه. زمانی که روی همه کیندل‌ها استاندارد بود، در نهایت به یک ویژگی ممتاز تبدیل شدند که فقط در کیندل اوزیس گران‌قیمت در دسترس بود، قبل از اینکه در سال 2024 زمانی که آن دستگاه بازنشسته شد، به‌طور کامل از خط تولید حذف شدند. در حالی که در پاییز امسال تغییرات اساسی در سری Kindle به‌روزرسانی‌هایی مانند یک محفظه فلزی و طراحی هموار در جلو ارائه شد، آمازون دقیقاً دکمه‌های فیزیکی را مجدداً معرفی نکرده است، اما این شرکت لوازم جانبی جدیدی را برای جذب تقریباً 5 درصد از بازار عرضه کرده است (از نظر کوین کیت، معاون آمازون، معاون رئیس‌جمهور جدید آمازون، مسئول Kindle) Kindle Oasis: Kindle Page-Turn Cover . روکش Page-Turn دکمه ها را در قاب قرار می دهد اعتبار: Joel Cunningham در کنار نسخه جدید کیندل Paperwhite Signature Edition در جلو، روکش Page-Turn از چرم گیاهی ساخته شده است (در یکی از سه رنگ برای مطابقت با Kindle Graphite، Figure، یا Seglass Enterprise با لبه جلویی نرم، سبز مگنتی و شیشه ای دریایی) ساخته شده از پلاستیک با بافت سبک که دو دکمه نازک و کشیده را در خود جای داده است. هنگامی که Kindle سازگار خود را در قاب قرار می دهید، آن را به صورت مغناطیسی و از طریق پین های pogo داخلی متصل می کنید، به طور خودکار با دستگاه جفت می شود و به شما امکان می دهد", "image_url": "https://lifehacker.com/imagery/articles/01M5ZEKWQEG8Y4Q7V0VY0TWX8T/hero-image.fill.size_1200x675.png", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۶ آبان • ۱۷:۳۰"}],
      media: [{"source": "Billboard", "title": "Harry Shum Jr. and Jenna Johnson Scare Up a Wickedly Spooky Dance to a Britney Spears Classic on ‘DWTS’: Watch", "link": "https://www.billboard.com/culture/tv-film/harry-shum-johnson-spooky-dance-britney-spears-toxic-dwts-watch-1236369531/", "summary": "It was a frightfully entertaining night on Dancing With the Stars on Tuesday (Oct. 27) when the show got into the Halloween spirit a few days early on a Horror Movie Night -themed episode. And nobody nailed the combination of scares and flawless steps more than Glee alum Harry Shum Jr. and his professional dance partner Jenna Johnson. Related ADÉLA Says The Baddest Bi es Ain t in LA, But Hot Topic Thinks Otherwise: Shop Exclusive Prima Merch Online The Glee Reboot Is Officially in the Works Julia Stiles Pays Emotional Tribute to Late 10 Things I Hate About You Co-Star Heath Ledger on Dancing With the Stars : Watch Shum hit the stage in a blood-soaked white shirt and tie, his face dripping with viscera as Johnson stalked him across the floor in a look inspired by the Saw horror franchise. Dancing to 2WEI s cover of Britney Spears 2004 hit Toxic, the pair did a high-energy contemporary routine full of daring lifts, spins and one impressive move where Johnson sat on Shum s shoulder and then lay down flat to form a human T shape. The acrobatic routine rushed to a conclusion with Johnson grabbing Shum and ripping off his tie, sending the actor crashing to the ground, convulsing, as each attempt to get up was met by his partner repeatedly shoving him down with her foot. The dance ended on the creepiest of notes, with Saw s Billy the Puppet rolling onto the stage on his squeaky tricycle. The dance clearly landed with the judges, with guest adjudicator Shirley Ballas saying she d never seen anything like it and Bruno Toniolo dubbing it perfect, leading to the first 40/40 perfect score of the season so far. Because there was no elimination during last week s Dedication Night, two stars were sent packing on Tuesday, marking the last dance for The Bachelorette s Tyler Cameron and his partner Sharna Burgess — who did a Dracula-themed Viennese waltz to Annie Lennox s Love Song For a Vampire — and Savannah Bananas player Jackson Olson and professional partner Emma Slater, who did a Joker -inspired routine to Frank Sinatra s That s Life. DWTS airs live on Tuesdays at 8 p.m. ET on ABC and Disney+ and streams the next day on Hulu. Watch Shum and Johnson get Toxic below.", "date_str": "2026-10-28T15:00:31+00:00", "hash": "21ed8c1f212f39f0", "title_fa": "هری شوم جونیور و جنا جانسون در DWTS یک رقص وحشتناک وحشتناک را با یک کلاسیک بریتنی اسپیرز می ترسانند: تماشا کنید", "summary_fa": "این یک شب سرگرم‌کننده وحشتناک در Dancing With the Stars در روز سه‌شنبه (۲۷ اکتبر) بود، زمانی که نمایش چند روز زودتر در یک قسمت با مضمون شب فیلم ترسناک به روح هالووین رسید. و هیچ کس بیشتر از زاج Glee Harry Shum Jr و شریک رقص حرفه ای او Jenna Johnson، ترکیبی از ترس ها و گام های بی عیب و نقص را نمیخکوب کرد. ADÉLA می گوید بدترین چیز در لس آنجلس است، اما موضوع داغ به گونه ای دیگر فکر می کند: خرید آنلاین کالای انحصاری Prima را انجام می دهد. پیراهن و کراوات سفید آغشته به خون، در حالی که جانسون با نگاهی الهام‌گرفته از فرنچایز ترسناک Saw، او را روی زمین تعقیب می‌کرد. این زوج با رقصیدن روی جلد 2WEI از بریتنی اسپیرز 2004، یک روال معاصر پرانرژی پر از بلند کردن جسورانه، چرخش و یک حرکت چشمگیر انجام دادند که در آن جانسون روی شانه شوم نشست و سپس صاف دراز کشید تا به شکل T انسان شکل بگیرد. روال آکروباتیک با عجله به پایان رسید و جانسون شوم را گرفت و کراواتش را پاره کرد، بازیگر را به زمین خورد و تشنج کرد، زیرا هر تلاشی برای بلند شدن توسط شریک زندگی‌اش که مکرراً او را با پا به پایین هل می‌داد، مواجه می‌شد. رقص با ترسناک ترین نت ها به پایان رسید، بیلی عروسک اره که با سه چرخه جیرجیر خود روی صحنه می غلتید. رقص به وضوح با داوران روبرو شد، شرلی بالاس داور مهمان گفت که هرگز چیزی شبیه به آن ندیده است و برونو تونیولو آن را کامل دوبله کرده است، که منجر به اولین امتیاز عالی 40/40 فصل تا کنون شده است. از آنجایی که در شب تقدیم هفته گذشته حذفی وجود نداشت، دو ستاره در روز سه‌شنبه برای جمع‌آوری بسته‌بندی فرستاده شدند، که آخرین رقص تایلر کامرون،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/harry-shum-dwts-toxic-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Westwood Recordings Enters JV With Monstercat, With Eye on Artist Development & Global Reach", "link": "https://www.billboard.com/pro/electronic-label-westwood-recordings-signs-jv-monstercat/", "summary": "Canadian independent electronic label Westwood Recordings has entered a joint venture with fellow Canadian electronic label Monstercat. The partnership will provide Westwood with access to capital, global infrastructure (including monthly royalty accounting, global digital distribution and a gaming partnerships department) and an expanded team. Westwood will continue to be based in Vancouver and run by its founder, Nick Middleton . Related Indie Electronic Label Monstercat Acquired by Create Music Group Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Middleton, one half of longstanding electronic duo The Funk Hunters, founded Westwood Recordings in 2013 as a home for bass, electronic and hip-hop. The imprint s roster includes Big Gigantic, Dirtwire, Cut Chemist, Flamingosis, Maddy O Neal and Chali 2na. Beyond releases, the label has done branded events and stage takeovers at British Columbia music festivals Shambhala Music Festival and Rifflandia and Vancouver’s Malkin Bowl, an outdoor venue in the city s Stanley Park. The partnership is part of a broader expansion spurred by Monstercat s 2025 acquisition by Create Music Group, which invested $50 million in the label — funding that contributed to the new venture with Westwood. As part of the joint venture, Monstercat will support Westwood in signing new artists and recordings, expanding its release schedule, entering new genres and pursuing catalog acquisitions. The partnership will also support the launch of a publishing arm, building on Westwood’s history in synch licensing. “I’ve always respected how Monstercat has built its business, especially how transparent they are with their artists and how connected they are to their fans. Those things matter a lot to me, and we’ve built Westwood with that same care,” Middleton said in a statement. “After more than a decade of running Westwood independently, I know how much the right support can mean for an artist or a record. This partnership gives us the backing to put more behind the music we believe in, be more ambitious with the artists and projects we take on, and open more doors for the people we work with. We’ve built something special with Westwood, and there’s a lot more I want to do. After years of working together, the trust I have in Daniel and the Monstercat team is a big part of why this feels right. They understand what we’re building and wan", "date_str": "2026-10-28T15:00:00+00:00", "hash": "7e7a262e987327d7", "title_fa": "Westwood Recordings با Monstercat، با چشم به توسعه هنرمندان و دسترسی جهانی وارد JV می شود", "summary_fa": "برچسب الکترونیکی مستقل کانادایی Westwood Recordings وارد یک سرمایه گذاری مشترک با همتای خود برچسب الکترونیکی کانادایی Monstercat شده است. این مشارکت به وست‌وود دسترسی به سرمایه، زیرساخت‌های جهانی (از جمله حسابداری ماهانه حق امتیاز، توزیع دیجیتال جهانی و بخش مشارکت‌های بازی) و یک تیم گسترده را فراهم می‌کند. Westwood همچنان در ونکوور مستقر است و توسط بنیانگذار آن، نیک میدلتون اداره می شود. Label Indie Electronic Monstercat که توسط گروه موسیقی Create خریداری شد، کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در سن 71 سالگی درگذشت. باس، الکترونیک و هیپ هاپ. فهرست آثار شامل Big Gigantic، Dirtwire، Cut Chemist، Flamingosis، Maddy O Neal و Chali 2na است. علاوه بر انتشارات، این لیبل رویدادهای مارکدار و تصاحب صحنه‌ها را در جشنواره‌های موسیقی بریتیش کلمبیا جشنواره موسیقی شامبالا و Rifflandia و Malkin Bowl ونکوور، یک مکان در فضای باز در پارک استانلی شهر، انجام داده است. این مشارکت بخشی از توسعه گسترده‌تر است که توسط گروه Create Music Group در سال 2025 توسط Monstercat، که 50 میلیون دلار در این لیبل سرمایه‌گذاری کرد - سرمایه‌گذاری کرد - سرمایه‌گذاری که به سرمایه‌گذاری جدید با Westwood کمک کرد. به عنوان بخشی از سرمایه گذاری مشترک، Monstercat از Westwood در امضای قرارداد با هنرمندان و ضبط های جدید، گسترش برنامه انتشار خود، ورود به ژانرهای جدید و پیگیری خرید کاتالوگ حمایت خواهد کرد. این مشارکت همچنین از راه‌اندازی بازوی انتشاراتی که بر اساس تاریخچه وست‌وود در صدور مجوز همگام است، حمایت می‌کند. من همیشه به اینکه Monstercat چگونه کسب و کار خود را ایجاد کرده است، احترام می‌گذارم، به خصوص اینکه چقدر آنها با هنرمندان خود شفاف هستند و چقدر با طرفداران خود مرتبط هستند. میدلتون در بیانیه‌ای گفت: «پس از بیش از یک دهه مدیریت مستقل وست‌وود، می‌دانم حمایت درست چقدر می‌تواند برای یک هنرمند یا", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Brandy, Lena Waithe & More Named Members of 2026 Ebony Power 100 Honoree Court", "link": "https://www.billboard.com/music/awards/brandy-2026-ebony-power-100-honoree-1236369539/", "summary": "Grammy Award-winning artist Brandy , Emmy Award-winning writer-producer-actor Lena Waithe and Allen Media Group founder Byron Allen are three of the six special honorees who will be celebrated during the 2026 Ebony Power 100 Gala. The event will take place at the Hollywood Palladium in Los Angeles on Nov. 9. The three additional special honorees comprising the Power 100 Court are Seattle Storm WNBA player Flau jae Johnson, digital influencer and culinary tastemaker Keith Lee and NASA Astronaut Emeritus Victor Glover. Encompassing music, sports, media ownership, finance and space exploration, the court personifies the gala’s theme, “The Stories We Shape.” In accepting their award on stage, each member of the court will be honored with a dedicated tribute. “For more than 80 years, Ebony has kept the record of the people moving Black America forward, and the court is that record at its most vivid,” said Ebony CEO Eden Bridgeman in announcing the news. “They wrote it themselves, and that is exactly what this year’s Power 100 celebrates.” The ceremony will take honorees and guests inside an immersive creative world called “La Cour” — a reimagining of historical grand royal courts. Headlining the evening’s live entertainment will be Grammy winners Kirk Franklin and T.I., who will open and close the celebration, respectively. T.I. is also a member of this year’s Power 100 Music Innovators class. T.I., as well as every member of the 2026 Power 100, will be recognized during the ceremony. Additional honorees in the Music Innovators class who were previously announced include Jay-Z, Megan Thee Stallion, Durand Bernarr and Adam Blackstone. The complete list of Power 100 honorees — leaders chosen across 11 categories — is available on the Ebony website . The 2026 Ebony Power 100 Gala is produced in partnership with Jesse Collins Entertainment.", "date_str": "2026-10-28T15:00:00+00:00", "hash": "5435e903293f9249", "title_fa": "برندی، لنا ویث و سایرین اعضای نام‌گذاری شده در دادگاه Honoree Ebony Power 100 2026", "summary_fa": "برندی هنرمند برنده جایزه گرمی، لنا وایت نویسنده، تهیه کننده و بازیگر برنده جایزه امی و بایرون آلن، بنیانگذار گروه رسانه ای آلن، سه نفر از شش جایزه ویژه هستند که در مراسم جشن آبنوس پاور 100 2026 تجلیل خواهند شد. این رویداد در تاریخ 9 نوامبر در هالیوود پالادیوم در لس آنجلس برگزار خواهد شد. سه جایزه ویژه دیگر که شامل Power 100 Court هستند عبارتند از فلو جاه جانسون بازیکن WNBA سیاتل استورم، کیت لی، اینفلوئنسر دیجیتال و طعم‌دهنده آشپزی و فضانورد بازنشسته ناسا، ویکتور گلاور. این دادگاه که شامل موسیقی، ورزش، مالکیت رسانه، امور مالی و اکتشاف فضایی است، مضمون گالا، \"داستان هایی که ما شکل می دهیم\" را به تصویر می کشد. با دریافت جایزه خود بر روی صحنه، از هر یک از اعضای دادگاه با یک ادای احترام ویژه تجلیل خواهد شد. ادن بریجمن، مدیرعامل آبنوس در اعلام این خبر گفت: \"بیش از 80 سال، آبنوس سابقه افرادی را که سیاه‌پوست آمریکا را به جلو می‌برند، حفظ کرده است و دادگاه این رکورد در واضح‌ترین حالت خود است.\" آنها خودشان آن را نوشتند و این دقیقا همان چیزی است که Power 100 امسال جشن می گیرد. مراسم تجلیل‌کنندگان و مهمانان را به دنیای خلاقانه‌ای به نام «La Cour» می‌برد - تصویری دوباره از بارگاه‌های سلطنتی بزرگ. کرک فرانکلین و تی.آی برندگان جایزه گرمی، تیتر اصلی برنامه های سرگرمی زنده این شب خواهند بود که به ترتیب جشن را افتتاح و تعطیل خواهند کرد. T.I. همچنین یکی از اعضای کلاس Power 100 Music Innovators امسال است. T.I و همچنین تمامی اعضای Power 100 2026 در این مراسم مورد تقدیر قرار خواهند گرفت. برگزیدگان دیگر در کلاس نوآوران موسیقی که قبلا اعلام شده بودند عبارتند از Jay-Z، Megan Thee Stallion، Durand Bernarr و Adam Blackstone. فهرست کامل برگزیدگان Power 100 - رهبران انتخاب شده در 11 دسته", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2258989577.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Ezekiel Lewis Talks New Epic Records CEO Gig & the Art of A&R: ‘It’s Not About Genres. It’s About Artists’", "link": "https://www.billboard.com/pro/epic-records-ezekiel-lewis-ceo-role-first-time-interview/", "summary": "Ezekiel Zeke Lewis doesn t have the typical origin story of a major label CEO. He got his start as a Grammy-winning songwriter and producer in Atlanta, co-penning songs like One Less Lonely Girl by Justin Bieber and The Way I Are by Timbaland , often with his collective The Clutch, before he made his jump to the boardroom. Today, however, Lewis sees the creative journey as critical to his understanding of the music business and what artists need from their industry partners. When I got inside the building, I realized that my songwriting career and the fact that I had achieved some success was a miracle, he explains. He was fascinated by the way music moves through buildings, and he found a new calling to get inside to help creators navigate the industry with greater success. Related Molly Neuman on the Evolution of Independent Music From the 90s to Now: ‘It Was a High-Risk Business’ First, he built up his own publishing house, Bar Music Group. Then he landed an A R gig at Motown Records, where he worked his way up the ladder to become senior vp of A R by the time he left in 2018. That job was also where he first worked with legendary label executive Sylvia Rhone , who he says taught him to be diligent, never give up and never take no for an answer, as he puts it. But when Rhone left the job and took a role at Sony Music s Epic Records, where she eventually rose to become its CEO/chairman, she courted Lewis to follow her and scout the next generation of talent there. As Lewis has advanced in his career at Epic, he s played a pivotal role in shaping the careers of 21 Savage, Madison Beer, BIA, Black Eyed Peas, DDG, Future, GIVĒON, Zara Larsson, Mariah the Scientist, Travis Scott, Southside, Meghan Trainor and Tyla. When Rhone stepped away in 2025, rumors swirled that Lewis was being eyed as her successor. In March, the confirmation finally came that Lewis had been appointed CEO/chairman of Epic. Lewis joins the latest episode of Billboard On the Record in his first-ever interview as CEO and chairman to discuss what it takes to run a successful label in 2026, how he approaches A R, and how his songwriting career shaped his leadership in the boardroom. To watch this episode of Billboard On the Record , sponsored by ASCAP, check out the YouTube video below or click here for more viewing and listening options. An edited and condensed excerpt of the conversation can also be found below. You have built up your whole business career in music in A R. This historical", "date_str": "2026-10-28T14:16:06+00:00", "hash": "7dac87e2fece64c2", "title_fa": "ازکیل لوئیس درباره ژانرها صحبت می کند. درباره هنرمندان است", "summary_fa": "Ezekiel Zeke Lewis داستان منشأ معمولی یک مدیر عامل لیبل بزرگ را ندارد. او کار خود را به عنوان یک ترانه‌سرا و تهیه‌کننده برنده گرمی در آتلانتا آغاز کرد و آهنگ‌هایی مانند One Less Lonely Girl اثر جاستین بیبر و The Way I Are از تیمبالند، اغلب با گروه خود The Clutch، قبل از اینکه به اتاق هیئت مدیره بپرد، نوشت. با این حال، امروز، لوئیس سفر خلاقانه را برای درک خود از تجارت موسیقی و آنچه هنرمندان از شرکای خود در صنعت نیاز دارند، حیاتی می‌داند. او توضیح می دهد که وقتی وارد ساختمان شدم، متوجه شدم که حرفه ترانه سرایی من و این واقعیت که به موفقیت هایی دست یافته ام یک معجزه است. او مجذوب روشی بود که موسیقی در ساختمان‌ها حرکت می‌کند و فراخوان جدیدی برای ورود به داخل پیدا کرد تا به سازندگان کمک کند تا با موفقیت بیشتری در صنعت حرکت کنند. مولی نیومن در مورد تکامل موسیقی مستقل از دهه 90 تا کنون: «این یک تجارت پرخطر بود» ابتدا، او انتشارات خود را به نام گروه موسیقی بار تأسیس کرد. سپس یک کنسرت A R را در Motown Records انجام داد، جایی که از نردبان بالا رفت تا در سال 2018، معاون ارشد A R شود. این کار همچنین جایی بود که او برای اولین بار با سیلویا رون، مدیر اجرایی لیبل افسانه ای کار کرد، که به گفته او به او آموخت که سخت کوش باشد، هرگز تسلیم نشود و هرگز جواب منفی ندهد. اما زمانی که رون کار را ترک کرد و در سونی موزیک اپیک رکوردز ایفای نقش کرد، جایی که در نهایت به مدیرعاملی/رئیس آن تبدیل شد، از لوئیس خواست که او را دنبال کند و نسل بعدی استعدادها را در آنجا جستجو کند. از آنجایی که لوئیس در حرفه خود در Epic پیشرفت کرده است، او نقش اساسی", "image_url": "https://www.billboard.com/wp-content/uploads/2023/05/Ezekiel-Lewis-2023-cr-Travis-Shinn-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آبان • ۱۷:۴۶"}, {"source": "Billboard", "title": "Leading U.K. Indies Distiller Records & Speedy Wunderground Launch Label Partnership With New Heartworms Material", "link": "https://www.billboard.com/pro/distiller-records-speedy-wunderground-labels-partnership/", "summary": "Leading U.K. indie record labels Distiller Records and Speedy Wunderground have launched a new partnership. The new collaboration begins with the release of Heartworms’ new single “Guess I’m Stuck in the Dark,” out Tuesday (Oct. 27). Under the new partnership, Speedy Wunderground will retain “full creative autonomy over its A R and production” and utilize Distiller’s “marketing, distribution, and operational scale to amplify its roster further,” per a joint statement. Speedy Wunderground was founded in London by producer Dan Carey and has been instrumental in shaping the sound of the capital’s indie and alternative scene for the past decade with Black Country, New Road, Squid, Black Midi and Mercury Prize winners English Teacher all releasing early material via the label. In his work as a producer, Carey has credits on studio albums by Fontaines D.C. , Wet Leg and Kneecap , among others. Distiller, led by managing director James Moodie , recently scored its first U.K. No. 1 album with Blossoms’ sixth studio album Songs From the Wedding Cake . Its roster also includes Reverend The Makers, Yonaka, Sports Team and The Ramona Flowers. Heartworms is the moniker for London-based musician Josephine Orme, who released her 2025 debut album Glutton for Punishment through Speedy Wunderground. The album charted at No. 9 on the U.K.’s Independent Albums Chart. She’ll be the lead support act for Interpol and Bloc Party ’s co-headline tour in the U.K. and Europe, beginning Nov. 20 in Birmingham. Speaking on the collaboration Moodie said, “I’ve always loved what Dan and the team at Speedy Wunderground have built, it’s a respected label brand that is the very definition of creative integrity and credibility. This partnership is about giving each artist a bigger platform, deeper resources, and the backing to push their incredible talents even further. Carey added, “It s a great partnership as the team at Distiller are really experienced and clearly understand the ethos of Speedy and the way we like to work. We re looking forward to working together on a range of different projects, from very quick turnaround punk records to big campaigns — kicking off with this week s release from Heartworms.”", "date_str": "2026-10-28T14:11:26+00:00", "hash": "9722d924b029fda0", "title_fa": "مشارکت لیبل پیشرو در هند Distiller Records & Speedy Wunderground Launch با مواد جدید Heartworms", "summary_fa": "شرکت‌های موسیقی مستقل پیشرو در بریتانیا Distiller Records و Speedy Wunderground همکاری جدیدی را راه‌اندازی کرده‌اند. همکاری جدید با انتشار تک آهنگ جدید Heartworms \"Guess I'm Stuck in the Dark\" در روز سه شنبه (27 اکتبر) آغاز می شود. طبق یک بیانیه مشترک، Speedy Wunderground بر اساس شراکت جدید، \"استقلال خلاقانه کامل در مورد A R و تولید خود\" را حفظ خواهد کرد و از \"بازاریابی، توزیع و مقیاس عملیاتی Distiller برای تقویت بیشتر فهرست خود\" استفاده خواهد کرد. Speedy Wunderground در لندن توسط تهیه کننده Dan Carey تأسیس شد و در شکل دادن به صدای صحنه مستقل و جایگزین پایتخت در دهه گذشته با برندگان Black Country، New Road، Squid، Black Midi و Mercury Prize معلم انگلیسی که همگی مطالب اولیه را از طریق این لیبل منتشر کردند، نقش اساسی داشته است. کری در کار خود به‌عنوان تهیه‌کننده، در آلبوم‌های استودیویی از فونتینز دی سی، پا خیس و کاسه زانو و غیره نام‌هایی دارد. Distiller به رهبری جیمز مودی، مدیر عامل، اخیراً اولین آلبوم شماره 1 بریتانیا را با ششمین آلبوم استودیویی Blossoms Songs From the Wedding Cake به دست آورد. فهرست آن همچنین شامل Reverend The Makers، Yonaka، Sports Team و The Ramona Flowers است. Heartworms نام ژوزفین اورمه، موسیقیدان ساکن لندن است که اولین آلبوم خود را در سال 2025 Glutton for Punishment از طریق Speedy Wunderground منتشر کرد. این آلبوم در جدول آلبوم های مستقل بریتانیا در رتبه نهم جدول قرار گرفت. او نقش اصلی پشتیبانی برای تور مشترک اینترپل و حزب بلوک در بریتانیا و اروپا خواهد بود که از 20 نوامبر در بیرمنگام آغاز می شود. مودی در مورد همکاری گفت: \"من همیشه آنچه را دن و تیم Speedy Wunderground ساخته اند دوست داشته ام، این یک برند معتبر برچسبی است که دقیقاً یکپارچگی و اعتبار خلا ingstone.com/music/music-news/bob-dylan-not-dark-yet-first-time-seven-years-1235649184/", "summary": "He shaved two minutes off the Time Out of Mind classic, but added in a distinct reggae touch and made some of the darkest lyrics of his career feel significantly less dreary", "date_str": "2026-10-28T14:53:21+00:00", "hash": "f2cee5fb00a3f44a", "title_fa": "باب دیلن برای اولین بار بعد از هفت سال «هنوز تاریک» را بازی کرد و کاملاً آن را دوباره تصور کرد.", "summary_fa": "او دو دقیقه از کلاسیک Time Out of Mind تراشید، اما با یک لمس رگی متمایز اضافه کرد و باعث شد تا برخی از تاریک‌ترین اشعار حرفه‌ای‌اش به‌طور قابل‌توجهی کمتر ترسناک به نظر برسند. در سالن میتسوبیشی الکتریک در دوسلدورف، آلمان، در 27 اکتبر، او کلاسیک Time Out of Mind Not Dark Yet را برای اولین بار پس از هفت سال منتشر کرد. هیچ شباهتی به 191 اجرای زنده قبلی این آهنگ در سه دهه گذشته نداشت. تنها با چهار دقیقه و 30 ثانیه، دو دقیقه کوتاهتر از ضبط استودیو در سال 1997 است، حتی اگر او تمام آیات را خواند. اما او با کمی لمس رگی اضافه کرد، بسیاری از حال و هوای غم انگیزی را که عملاً آهنگ را تعریف می کند حذف کرد، و خطوط تیره ای ایجاد کرد که انگار گاهی اوقات بار من بیش از تحمل من است و می دانم که به نظر می رسد من در حال حرکت هستم، اما هنوز هم به نوعی روشن و حتی خوش بین به نظر می رسم. Time Out of Mind به وضوح در ذهن دیلن است زیرا او همچنین ترتیبات جدیدی از تلاش برای رسیدن به بهشت ​​و میلیون مایل را در ایستگاه های اخیر تور معرفی کرد. ال پی تحسین شده دوران کاملا جدیدی از حرفه دیلن را آغاز کرد و جایزه گرمی آلبوم سال را برای او به ارمغان آورد، اما او هرگز از تنظیم آهنگ های دانیل لانوا، تهیه کننده، راضی نبود. دیلن در سال 2001 به میکال گیلمور از رولینگ استون گفت [این آلبوم] بیش از چند بار از آهنگ خارج شد و مردم ناامید شدند. اگر اراده داشتم می توانستم. من در آن زمان این کار را نکردم، و بنابراین شما باید آن را به جایی که خود رویداد می‌خواهد هدایت کنید. احساس می کنم یکسانی در ریتم ها وجود دارد.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/bob-dylan-not-dark-yet.jpg?crop=0px%2C35px%2C1800px%2C1014px&#038;res     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
