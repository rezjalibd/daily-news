<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <title>مجله خبری روزانه — ۱۱ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">

          <span id="themeIcon">☀️</span>

        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>

      <h1>📰 مجله خبری روزانه</h1>

    <main id="newsContainer" class="news-grid"></main>

      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

ناچار خواهیم شد ضربه سنگینی به آن‌ها وارد کنیم.» دونالد ترامپ در این سخنرانی اظهارات قبلی خود درباره طولانی نشدن جنگ با ایران را تکرار و تأکید کرد آمریکا از نظر نظامی و مالی به پیروزی رسیده و این رویارویی خیلی زود «از یک راه یا راه دیگر» به پایان خواهد رسید. او گفت: «من از کشورمان در برابر بزرگ‌ترین حامی دولتی تروریسم در جهان محافظت کردم. آنها از سال ۱۹۷۹ به ما حمله کرده‌اند. صدها نفر از جوانان ما کشته شده‌اند و بسیاری دیگر قربانی بمب‌های کنار جاده‌ای شده‌اند. ما این جنگ را شروع نکردیم، اما آن را تمام می‌کنیم.» رئیس جمهور آمریکا این اظهارات را ساعاتی پس از آن بیان کرد که درباره مذاکرات در حال انجام با ایران گفته بود «خوب پیش می‌رود». او در عین حال گفته بود اما همچنان یکی دو هدف از جمله مرکز هسته‌ای کوه کلنگ باقی مانده است که باید «تعیین تکلیف شوند». گفت‌وگوهای ایران با میانجی قطری برای رسیدن به توافقی با آمریکا یکشنبه نیز ادامه یافت. این مذاکرات روز جمعه در تهران آغاز شد و سپس در دوحه ادامه یافته است. او گفت: «آنها ضربه‌های بسیار", "image_url": "https://gdb.rferl.org/2ef87ef2-a43e-49e6-8f0f-4c5ab83f0844_w1200_h630.jpg", "category": "سیاست و دیپلماسی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۱ آبان • ۱۰:۰۶"}, {"source": "Independent Persian", "title": "چرا بدن به چربی نیاز دارد؟ هشدار درمورد رژیم‌های افراطی حذف چربی", "link": "https://www.independentpersian.com/node/422955/%D8%A8%D9%87%D8%AF%D8%A7%D8%B4%D8%AA-%D9%88-%D8%AF%D8%B1%D9%85%D8%A7%D9%86/%DA%86%D8%B1%D8%A7-%D8%A8%D8%AF%D9%86-%D8%A8%D9%87-%DA%86%D8%B1%D8%A8%DB%8C-%D9%86%DB%8C%D8%A7%D8%B2-%D8%AF%D8%A7%D8%B1%D8%AF%D8%9F-%D9%87%D8%B4%D8%AF%D8%A7%D8%B1-%D8%AF%D8%B1%D9%85%D9%88%D8%B1%D8%AF-%D8%B1%DA%98%DB%8C%D9%85%E2%80%8C%D9%87%D8%A7%DB%8C-%D8%A7%D9%81%D8%B1%D8%A7%D8%B7%DB%8C-%D8%AD%D8%B0%D9%81-%DA%86%D8%B1%D8%A8%DB%8C", "summary": "همزمان با گرایش به لاغری شدید و افزایش محبوبیت داروهای کاهش وزن، کارشناسان هشدار می‌دهند تلاش برای کاهش افراطی چربی بدن می‌تواند سلامتی را به خطر بیندازد، زیرا چربی علاوه بر ذخیرهٔ انرژی، در تنظیم هورمون‌ها، حفظ دمای بدن و عملکرد ایمنی و باروری هم نقش دارد و کمبود شدید آن می‌توا ندین هشدار جعلی درباره تهدیدات مواد پرتوزا در این اپلیکیشن ظاهر شده بود.", "date_str": "2026-11-02T00:50:02+00:00", "hash": "5b3fdb9e4ccc7e23", "title_fa": "احتمال «هک» اپلیکیشن هشدار حمله هوایی؛ اوکراینی‌ها هشدار جعلی تهدید رادیواکتیو دریافت کردند", "summary_fa": "یکشنبه شب، دقایقی پس از پایان آتش‌بس در اوکراین، نیروی هوایی اوکراین و مرکز مقابله با اطلاعات نادرست در این کشور اعلام کردند که احتمال می‌دهند که سامانه هشدار حمله هوایی این کشور هک شده باشد، چون چندین هشدار جعلی درباره تهدیدات مواد پرتوزا در این اپلیکیشن ظاهر شده بود. نیروی هوایی اوکراین در پیامی اعلام کرد: «احتمالا اپلیکیشن هشدار حمله هوایی هدف حمله و خرابکاری خصمانه قرار گرفته است. هیچ‌گونه تهدید پرتوزایی وجود ندارد.» یوری ایگنات، سخنگوی نیروی هوایی اوکراین، نیز در گفت‌وگو با خبرگزاری فرانسه تأیید کرد که این اپلیکیشن هک شده است. مرکز ارتباطات راهبردی اوکراین، در پیامی در شبکه ایکس، روسیه را مسئول این حمله سایبری دانسته است اما کرملین واکنشی به این اتهام نشان نداده است. مقام‌های شهر کی‌یف هم اعلام کردند که اپلیکیشن دیگری که به‌طور اختصاصی برای پایتخت اوکراین طراحی شده است، همچنان به‌صورت عادی کار می‌کند. هشدار خطر پرتوزایی، لزوماً به معنای حمله هسته‌ای نیست. چنین هشداری می‌تواند به احتمال نشت مواد رادیواکتیو از یک تأسیسات هسته‌ای یا انتشار مواد پرتوزا هم مربوط باشد. این پیام‌ها به زبان اوکراینی، از حدود ساعت ۲۲:۴۷ به وقت محلی (۲۰:۴۷ به وقت لندن) منتشر شدند. نخستین پیام چنین بود: «تهدید پرتوزایی! خطر تشعشعات رادیواکتیو در کی‌یف اعلام شده است.» هشدار بعدی، که به زبان روسی نوشته شده بود، در ساعت ۲۲:۴۸ منتشر شد و در آن آمده بود: خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. «سلام! در سراسر اوکراین هشدار هسته‌ای اعلام خواهد شد. نگران نباشید، این یک موشک اورشنیک است که در حال پرواز است.» سومین هشدار، در ساعت ۲۲:۴۹ و بار دیگر به زبان اوکراینی منتشر شد: «تهدید شیمیایی! خطر حمله شیمیایی به کی‌یف وجود دارد. از خانه خارج نشوید.»", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/7727/live/c0034c60-d652-11f1-93e1-3b657b665bcf.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱۱ آبان • ۰۴:۲۰"}, {"source": "BBC Persian", "title": "یک جت خصوصی با ۹ سرنشین در فلوریدا سقوط کرد؛ تمامی سرنشینان کشته شدند", "link": "https://www.bbc.com/persian/articles/c6kgl49z1r2mo?at_medium=RSS&at_campaign=rss", "summary": "یک جت خصوصی با ۹ سرنشین در منطقه پالم بیچ فلوریدا سقوط کرد و تمامی سرنشینان آن کشته شدند. این سانحه که عصر یکشنبه - ۱۰ آبان - در حدود ۱۲ کیلومتری اقامتگاه تفریحی دونالد ترامپ - مارالاگو - روی داد از سوی مقامات «وحشتناک» توصیف شده است.", "date_str": "2026-11-02T00:41:16+00:00", "hash": "71b77e355abee0f0", "title_fa": "یک جت خصوصی با ۹ سرنشین در فلوریدا سقوط کرد؛ تمامی سرنشینان کشته شدند", "summary_fa": "یک جت خصوصی با ۹ سرنشین در منطقه پالم بیچ فلوریدا سقوط کرد و تمامی سرنشینان آن کشته شدند. این سانحه که عصر یکشنبه - ۱۰ آبان - در حدود ۱۲ کیلومتری اقامتگاه تفریحی دونالد ترامپ - مارالاگو - روی داد از سوی مقامات «وحشتناک» توصیف شده است. هویت سرنشینان این هواپیمای خصوصی که از نوع لیرجت ۶۰ گزارش شده و از مبداء تگزاس به مقصد جزایر باهاما در حرکت بوده، هنوز رسما اعلام نشده است. سازمان هوانوردی آمریکا اعلام کرده تیمی را برای بررسی این سانحه به محل اعزام کرده است. تصاویر منتشر شده از محل سقوط این هواپیما، بقایای خاکستر شده آن و گودالی که در پی برخورد آن با زمین پدید آمده را نشان می‌دهد. گزارش رسانه‌های آمریکایی و بررسی داده‌های پروازی نشان می‌دهد هواپیما پیش از سقوط، با سرعتی معادل صدها فوت در ثانیه ارتفاع خود را از دست می‌داده است. ویدیویی تاییدنشده که در شبکه‌های اجتماعی منتشر شده و ظاهرا با دوربین جلوی داشبورد یک خودرو ضبط شده، لحظه سقوط را نشان می‌دهد. در این تصاویر، خودروها در خیابانی مسکونی در حومه شهر در حال حرکت هستند که ناگهان هواپیما تقریبا به‌صورت عمودی با دماغه به زمین برخورد می‌کند و در پی آن انفجار بزرگی رخ می‌دهد و شعله‌های آتش به هوا زبانه می‌کشد. ران د سانتیس، فرماندار فلوریدا، پس از این حادثه در یک نشست خبری به خبرنگاران گفت: «وقتی این ویدیو را می‌بینید، واقعا تکان‌دهنده است. انگار موشکی از آسمان به زمین برخورد می‌کند و انفجاری مهیب رخ می‌دهد و ": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۱ آبان • ۰۲:۲۶"}, {"source": "BBC Persian", "title": "ترکیه به رقابت دبیرکلی سازمان ملل پیوست؛ فریدون سینیرلی‌اوغلو چه شانسی دارد؟", "link": "https://www.bbc.com/persian/articles/cqy0r6yn4xwdo?at_medium=RSS&at_campaign=rss", "summary": "دوره دبیرکلی آنتونیو گوترش، دبیرکل سازمان ملل متحد، ۳۱ دسامبر ۲۰۲۶ به پایان می‌رسد و ترکیه نیز به رقابت برای انتخاب جانشین او پیوسته است. ترکیه که اعلام کرد ۳۱ اکتبر نامزدی خود را ثبت کرده است، روی فریدون سینیرلی‌اوغلو، دبیرکل سازمان امنیت و همکاری اروپا حساب باز کرده است.", "date_str": "2026-11-01T21:59:58+00:00", "hash": "e9b01d0f354a6eaa", "title_fa": "ترکیه به رقابت دبیرکلی سازمان ملل پیوست؛ فریدون سینیرلی‌اوغلو چه شانسی دارد؟", "summary_fa": "دوره دبیرکلی آنتونیو گوترش، دبیرکل سازمان ملل متحد، ۳۱ دسامبر ۲۰۲۶ به پایان می‌رسد و ترکیه نیز به رقابت برای انتخاب جانشین او پیوسته است. ترکیه که اعلام کرد ۳۱ اکتبر نامزدی خود را ثبت کرده است، روی فریدون سینیرلی‌اوغلو، دبیرکل سازمان امنیت و همکاری اروپا حساب باز کرده است. روند تعیین نامزدها که از پایان سال ۲۰۲۵ آغاز شده بود، اکنون وارد مراحل پایانی شده است. نامه نامزدی ترکیه در ۳۰ اکتبر، بلافاصله پس از پایان دور هفتم رای‌گیری‌ها، ارائه شد. در دور هفتم نیز هیچ توافقی بر سر هیچ‌ یک از نامزدها به دست نیامد. آنکارا بر این باور است که بن‌بست ایجادشده در رقابت، برای نامزدهای جدید فضا باز کرده است. اما فریدون سینیرلی‌اوغلو کیست و چه شانسی در این رقابت دارد؟ اگرچه دبیرکل سازمان ملل از نظر فنی توسط مجمع عمومی سازمان ملل انتخاب می‌شود، اما مرحله تعیین‌کننده این روند، رای‌گیری‌ها در شورای امنیت سازمان ملل است. کشورها نامزد معرفی می‌کنند، نامزدها با کشورهای عضو دیدار و گفت‌وگو می‌کنند و سپس پرونده به شورای امنیت ارجاع می‌شود. اعضای شورا پیش از انتخاب نهایی، مجموعه‌ای از «رای‌گیری‌های آزمایشی» و غیررسمی برگزار می‌کنند. اعضا برای هر نامزد یکی از سه گزینه «حمایت می‌کنم»، «حمایت نمی‌کنم» یا «نظری ندارم» را انتخاب می‌کنند. برای انتخاب شدن، یک نامزد باید دست‌کم ۹ رای مثبت در شورای امنیت کسب کند و با وتوی هیچ‌ یک از اعضای دائم شورا مواجه نش زندش کشته شد. در بخش دیگری از برنامه شیوه روح‌الامین سعیدی نیز این پرسش را مطرح کرد:‌«وضعیت اطلاعاتی ما طی سال‌های اخیر بسیار غیرعادی و غیرقابل توجیه بوده است. این حجم از خلأها و رخنه اطلاعاتی واقعاً چگونه قابل توضیح است؟» آنچه پیش رو دارید خلاصه‌ای از دیدگاه‌هایی است که به نقد و بررسی ضعف‌های دستگاه اطلاعاتی جمهوری اسلامی پرداخته است. حمزه صفوی در تشریح چگونگی ایجاد بازدارندگی ۹ لایه را برشمرد که لایه هفتم آن به «بازدارندگی اطلاعاتی» اختصاص داشت. او دراین‌باره در برنامه شیوه گفته‌است: «لایه هفتم بازدارندگی، بازدارندگی اطلاعاتی است. ما در این حوزه ضربات بسیار سنگینی متحمل شده‌ایم و ریشه اصلی این ضربات، ضعف مفرط اطلاعاتی", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D8%B3%DB%8C%D8%B3%D8%AA%D9%85_wJEq__v1024x512__box_0%2C77%2C1289%2C755.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۰ آبان • ۲۱:۲۳"}, {"source": "Euronews Persian", "title": "پلیس پرتغال به تجمعات اعتراضی در لیسبون و پورتو پایان داد", "link": "https://parsi.euronews.com/2026/11/01/portuguese-police-break-up-protest-rallies-in-lisbon-and-porto", "summary": "پلیس پس از چندبار هشدار در ساعات اولیه بامداد یکشنبه برای برچیدن «کمپ‌های» معترضان در دو شهر بزرگ پرتغال، به زور متوسل شد. در این وقایع حدود ۱۰۰ نفر، از جمله ۱۳ مأمور پلیس، مجروح شدند.", "date_str": "2026-11-01T17:26:06+00:00", "hash": "52b6d47c791ae2d6", "title_fa": "پلیس پرتغال به تجمعات اعتراضی در لیسبون و پورتو پایان داد", "summary_fa": "پلیس پس از چندبار هشدار در ساعات اولیه بامداد یکشنبه برای برچیدن «کمپ‌های» معترضان در دو شهر بزرگ پرتغال، به زور متوسل شد. در این وقایع حدود ۱۰۰ نفر، از جمله ۱۳ مأمور پلیس، مجروح شدند.", "image_url": "https://images.euronews.com/articles/stories/09/97/52/37/1200x675_cmsv2_f283bca1-75fd-54d1-8f68-e837d47e4fff-9975237.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۰ آبان • ۲۰:۵۶"}, {"source": "Euronews Persian", "title": "مجله خبری| ۱۰ آبان ۱۴۰۵ (۱ نوامبر ۲۰۲۶) - شامگاهی", "link": "https://parsi.euronews.com/v       tech: [{"source": "Zoomit", "title": "گوشی ارزنده و قدرتمند وان‌پلاس توربو 6Vs با نمایشگر ۱۴۴ هرتز و باتری بزرگ معرفی شد", "link": "https://www.zoomit.ir/mobile/470315-oneplus-turbo-6vs-launched-china/", "summary": "وان‌پلاس گوشی میان‌رده‌ی Turbo 6Vs را با باتری غول‌پیکر ۹۰۰۰ میلی‌آمپرساعتی و تراشه‌ی اسنپدراگون در بازار چین رونمایی کرد.", "date_str": "2026-11-02T06:50:00+00:00", "hash": "81f903afc7a729ae", "title_fa": "گوشی ارزنده و قدرتمند وان‌پلاس توربو 6Vs با نمایشگر ۱۴۴ هرتز و باتری بزرگ معرفی شد", "summary_fa": "وان‌پلاس گوشی میان‌رده‌ی Turbo 6Vs را با باتری غول‌پیکر ۹۰۰۰ میلی‌آمپرساعتی و تراشه‌ی اسنپدراگون در بازار چین رونمایی کرد. تبلیغات وان‌پلاس از گوشی Turbo 6Vs در بازار چین رونمایی کرد . محصول تازه‌وارد از نمایشگر ۶٫۷۸ اینچی اولد با نرخ نوسازی ۱۴۴ هرتز و باتری ۹۰۰۰ میلی‌آمپرساعتی بهره می‌برد که مشخصاتی هم‌سطح با نسخه‌ی قبلی خود ارائه می‌دهد. نمایشگر تخت دستگاه با وضوح ۲۷۷۲ در ۱۲۷۲ پیکسل همراه است و روشنایی معمول ۸۰۰ نیت و بیشینه‌ی روشنایی ۱۸۰۰ نیت تولید می‌کند. وان‌پلاس پشتیبانی از فناوری‌های کاهش نور DC-like و نوردهی PWM با فرکانس بالا را به این پنل اضافه کرده است. پردازش اطلاعات در گوشی وان پلاس بر عهده‌ی تراشه‌ی Snapdragon 7s Gen 4 قرار دارد که با ۱۲ گیگابایت رم LPDDR4X و ۲۵۶ گیگابایت فضای ذخیره‌سازی UFS 3.1 همراهی می‌شود. دوربین اصلی ۵۰ مگاپیکسلی مجهز به لرزش‌گیر اپتیکال، دوربین مونوکروم دو مگاپیکسلی و دوربین سلفی ۱۶ مگاپیکسلی بخش تصویربرداری را شکل می‌دهند. بدنه‌ی دستگاه با ضخامت ۸٫۵ میلی‌متر و وزن ۲۱۵ گرم موفق به دریافت استانداردهای حفاظتی IP66، IP68، IP69 و IP69K در برابر نفوذ آب و گردوغبار شده است. وان‌پللس قیمت گوشی جدیدش را ۳۶۹۹ یوان (حدود ۵۵۵ دلار) اعلام کرده و در رنگ‌های سفید و نارنجی عرضه می‌کند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/oneplus-turbo-6vs-smartphones-6ae80dae2b7fe0e7849f8e25?w=1920&q=75", "category": "تراشه و سخت‌افزار", "tags": ["تراشه"], "datetime_fa": "۱۱ آبان • ۱۰:۲۰"}, {"source": "Zoomit", "title": "پس از حملات سایبری اخیر، بانک مرکزی برای تقویت امنیت شبکه بانکی ابلاغیه صادر کرد", "link": "https://www.zoomit.ir/iran-news/470335-cbi-bank-cybersecurity-guidelines/", "summary": "بانک مرکزی با اشاره به تجربه حملات سایبری اخیر به نظام بانکی، توصیه‌هایی را برای تقویت امنیت سایبری و توان مقابله بانک‌ها با تهدیدها ابلاغ کرد.", "date_str": "2026-11-02T06:43:09+00:00", "hash": "e5c83510267684b4", "title_fa": "پس از حملات سایبری اخیر، بانک مرکزی برای تقویت امنیت شبکه بانکی ابلاغیه صادر کرد", "summary_fa": "بانک مرکزی با اشاره به تجربه حملات سایبری اخیر به نظام بانکی، توصیه‌هایی را برای تقویت امنیت سایبری و توان مقابله بانک‌ها با تهدیدها ابلاغ کرد. تبلیغات بانک مرکزی در بخشنامه‌ای خطاب به موسسات اعتباری، با استناد به تجربه رخدادهای سایبری اخیر در نظام بانکی کشور، مجموعه‌ای از توصیه‌ها را با هدف افزایش آمادگی بانک‌ها برای مقابله با تهدیدهای سایبری ابلاغ کرد. طبق اعلام بانک مرکزی، این توصیه‌ها در پی مصوبه هیئت عامل بانک مرکزی در جلسه ۲۸ شهریور ۱۴۰۵ تدوین و به مؤسسات اعتباری ابلاغ شده‌اند. بر اساس مفاد این بخشنامه، بانک مرکزی توصیه کرده است مؤسسات اعتباری در ترکیب اعضای هیئت‌مدیره خود، دست‌کم یک عضو با دانش، مهارت و تجربه کافی در حوزه فناوری اطلاعات داشته باشند. هم‌چنین در این بخشنامه بر استفاده مؤثرتر از ظرفیت‌های تخصصی معاونت فناوری اطلاعات در ترکیب هیئت عامل مؤسسات اعتباری تأکید شده است. بانک مرکزی با اشاره به تسلط معاونان فناوری اطلاعات بر جزئیات اجرایی و مسائل تخصصی این حوزه و همچنین ماهیت اجرایی مسئولیت‌های آن‌ها، توجه بیشتر به جایگاه این بخش در ساختار مدیریتی بانک‌ها را ضروری و شایسته دانسته است. کپی لینک تاکید بانک مرکزی بر تقویت کمیته فناوری اطلاعات بخش دیگری از توصیه‌های بانک مرکزی به تقویت نقش و عملکرد کمیته‌های مشورتی هیئت‌مدیره، از جمله کمیته فناوری اطلاعات، اختصاص دارد. این کمیته‌ها به‌عنوان بازوی مشورتی هیئت‌مدیره فعالیت می‌کنند و وظیفه ارائه مشاوره‌های تخصصی و پشتیبانی از فرایندهای مدیریتی مؤسسات اعتباری را بر عهده دارند. بانک مرکزی هدف از ابلاغ این توصیه‌ها را افزایش سطح امنیت سایبری موسسات اعتباری و تقویت ت lusters. Russia says it is also capable of carrying nuclear warheads. Other false messages warned of chemical threats and \"street fights\" in Kyiv, according to screenshots seen by Business Insider. The Ukrainian air force's Telegram channel, which Ukrainians routinely rely on for air raid and drone threat alerts, said later said there was \"no radiation threat\" and that its app had likely been compromised. SPRAVDI, Ukraine's center for strategic communications, blamed Russia for the fake messages. \"If you see strange messages in the app, disregard,\" it said in a post on X. Unfortunately, Russians have hacked the \"Air Alert\" app. This is evidenced by the appearance of several unusual alerts. Additionally, there is a message in Russian about \"Oreshnik.\" If you see strange messages in the app, disregard. https://t.co/fU7KHmKxs1 — SPRAVDI — Stratcom Centre (@StratcomCentre) November 1, 2026 Hours later, Russia's emergency ministry said its mobile app had also been \"subjected to a massive cyberattack\" that sent out false information to the public. Regional air raid alert Telegram channels run by the ministry issued nonsensical warnings in Russian filled with vulgarities, according to screenshots seen by Business Insider. One message said \"P1-Sun carriers,\" referring to a small", "date_str": "2026-11-02T05:25:52+00:00", "hash": "650ad3fb4213297e", "title_fa": "هشدارهای جعلی حمله هسته ای به میلیون ها اوکراینی و روس در همان روز رسید", "summary_fa": "اوکراینی‌ها، مانند آن‌هایی که در ماه اوت در اینجا پناه گرفته‌اند، به برنامه‌های هشدار حمله هوایی برای هشدار در مورد حملات پهپادی و موشکی متکی هستند. Kostiantyn Liberov/Libkos/Getty Images اوکراینی‌ها و روس‌ها هر دو در برنامه‌های هشدار رسمی خود ترس از حمله هسته‌ای دریافت کردند. هشدارهای نادرست درباره حملات هسته ای از طریق موشک اورشنیک روسیه و پهپادهای کوچک اوکراینی هشدار می داد. هر دو طرف گفتند که سیستم های آنها توسط حملات سایبری نقض شده است. برنامه‌های هشدار رسمی در اوکراین و روسیه روز یکشنبه هشدارهای نادرست تهدید ه  properties today, but he started his career in a cheap shared apartment. The billionaire former \"Shark Tank\" investor has been open about the broke student mindset that ruled his 20s and helped him launch his first business, MicroSolutions. In an X post on Sunday, he went into the nitty-gritty of just how frugal he had been. Cuban said that at age 24, he lived in an apartment in Dallas that, today, costs $2,388. He said he shared it with five roommates, and his share of the rent came to what would have been $400 in 2026. He shared the floor plan of his old apartment in a complex called \"The Village.\" The floor plan showed a three-bedroom layout with two bathrooms, a dining room, living room, and a kitchen. It measured 1,350 square feet in total. For those who care. This is the same unit layout, same complex in the Village Apartments, the Hills. Updated. Price $2388. Same in 2026 dollars as when I lived there. Split 6 ways. $400. Maybe there are extra charges. Maybe they won’t let 6 guys in there ( we weren’t… pic.twitter.com/RcOEzxqMva — Mark Cuban (@mcuban) November 1, 2026 \"Tbh, I didn't mind living with 5 roommates. We all were in the same boat,\" he wrote. \"I moved in when I was 24. Lived there or across the way for 2 years before I only needed one roommate.\" He told Forbes in a 2013 article that because he had been the last to move into the apartment, he didn't have a bed, a closet, or a dresser, and slept on the floor with his clothes stacked in a corner. Cuban's post about his former apartment was one of many about him weighing in on the cost-of-living crisis in the US. He responded to a comment asking him how someone working at a McDonald's can afford rent and other living expenses. In an earlier post, he wrote about working as a barback earning $2.15 an hour, living off canned food and happy-hour peanuts, and getting fired from a retail job he used to work at. \"If it's not the lifestyle for you. So be it. If you don't think just getting any job to ys she's leaving behind the all-or-nothing mindset that made her successful", "link": "https://www.businessinsider.com/ariarne-titmus-olympic-gold-swimmer-rethink-mindset-retirement-2026-11", "summary": "Australian swimmer Ariarne Titmus is a four-time Olympic gold medallist. Quinn Rooney/Getty Images Olympic swimmer Ariarne Titmus says she was used to seeing life in terms of winning or losing. She retired at 25 after winning eight Olympic medals across two Games, including four golds. In retirement, Titmus said she had to unlearn the mindset that once made her successful in sport. Ariarne Titmus , 26, says she had to unlearn the mindset that made her an Olympic gold medalist after retiring from swimming. \"I look at a lot of things in my life pretty black and white, which is probably not a good way to be sometimes,\" the Australian swimmer told The Guardian in an interview published Sunday. \"In my swimming career, I was all or nothing. I was win or lose. I was achieve it, or fail. And I guess that's not a great way to be in life.\" Titmus is one of Australia's most decorated swimmers, with four Olympic gold medals, three silver medals, and one bronze. She announced her retirement from competitive swimming after the 2024 Paris Olympics. After undergoing surgery to remove a growth from her ovary in 2023, which affected her fertility , Titmus said she began to feel she needed to make more space for other parts of her life. \"I've definitely tried to change my outlook on a few areas of my life and not live with that super intense mindset that I had to have to be successful in the pool,\" she said. \"Because I don't have to be like that anymore.\" Other retired athletes have also spoken about the challenge of reshaping the routines and mindsets that once helped them excel. In July, former NHL player Brooks Laich told Business Insider that it took him years to find a new sense of purpose after retiring from hockey. He said reminding himself that \"you can build it once, بران پیش از ارتقا از اطلاعات خود نسخه‌ی پشتیبان تهیه کنند؛ چراکه افزایش مصرف انرژی و گرم‌شدن بدنه در طول فرایند نصب طبیعی است و پس از تکمیل به‌روزرسانی عملکرد به حالت عادی برمی‌گردد. ویژگی‌های مشترک برای هر چهار مدل شامل اپلیکیشن اختصاصی Glyph، تفکیک پنل تنظیمات سریع از بخش اعلان‌ها، چینش گروهی آیکون‌های صفحه‌ی اصلی و نشانگر سه‌رنگ وضعیت برای دسترسی‌های حساس، موقعیت مکانی و پردازش هوش مصنوعی می‌شود. پوسته‌ی شفاف جدید لانچر با جلوه‌ی شیشه‌ی مات، دو طرح ساعت برای صفحه‌ی قفل، فونت Geist و بازطراحی منوی تنظیمات نیز به این گوشی‌ها اضافه شده‌اند. ویجت‌های جدید Collector و Away Time، ویجت زمان‌سنج Glyph، تم تاریک فراگیر و امکان اتصال سریع بلوتوث در تنظیمات سریع از دیگر مشخصات نسخه جدید به شمار می‌روند. گوشی‌های Phone (3a) و Phone (3a) Pro به قابلیت تنظیمات دستی دوربین با هفت افکت و فیلم‌برداری هم‌زمان مجهز شده‌اند و مدل‌های Phone (4a) و Phone (4a) Pro نیز قابلیت فیلم‌برداری هم‌زمان با دوربین جلو و عقب و تبدیل سریع‌تر گفتار به متن را دریافت کرده‌اند. بر اساس برنامه‌ریزی ناتینگ، نسخه‌ی پایدار در آذر برای فون 2a و فون 2a پلاس منتشر خواهد شد و مدل‌های فون 3a لایت در دی‌ماه و فون 4b و CMF", "image_url": "https://api2.zoomit.ir/media/nothing-4a-pro-24-6a048b34be468e36872f756b?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما"], "datetime_fa": "۱۱ آبان • ۰۷:۴۵"}, {"source": "Business Insider", "title": "I moved to Thailand for a slower life. Over a year into retirement, I missed having a purpose.", "link": "https://www.businessinsider.com/retired-to-thailand-opened-cafe-koh-samui-slow-life-2026-11", "summary": "Michael Kane moved to Thailand to retire. He got bored and started a café. Provided by Michael Kane. Michael Kane had long known he didn't want to spend the rest of his life in the US. Retirement in Thailand was fun until he ran out of ways to fill the day. Opening a café gave him the sense of purpose he had been missing. This as-told-to essay is based on a conversation with Michael Kane, 54, who moved to Koh Samui, Thailand, to retire. It has been edited for length and clarity. I grew up in Orange County, Southern California, and started my career in restaurants before getting into software. Over the years, I worked in many different fields, from construction and real estate to sales and marketing. I moved to Atlanta in 1990 and lived there for most of the next 30 years. About a decade ago, a friend invited me to Thailand for a couple of weeks. I liked the place so much that I stayed for three months. After that, I began splitting my time between Thailand and the US. Do you have any regrets about a move abroad ? We want to hear from you. Fill out this short form to share your story. My last business before leaving the US was a doggy day care outside Atlanta, which I started after struggling to find one nearby for my own dog. The pandemic hit just before it opened, but I was thankfully able to sell it. After that, I decided I was done with running businesses in the US. For a long time, I knew I did not want to spend the rest of my life in the US. I had traveled internationally for much of my career, and I felt that spending the rest of my life appreciating other cultures, specifically Thai culture, seemed more appealing. So, in 2020, I moved to Koh Samui , an island in Thailand, to retire. I bought a two-bedroom apartment in Mae Nam, in the northern area of the island, for $186,100. I initially came on a five-year Thailand Elite visa, which has since been restructured into the Thailand Privilege visa. When the Thai government announced the Long-Term Resident Wealthy Pensioners visa in 2022, I decided to switch to that instead, since it was valid for 10 years. But I got bored with doing nothing When I moved to Koh Samui , I was looking for a slower life. I spent my first year and a half there doing what people imagine retirement on a Thai island looks like: going to the beach, getting massages, and enjoying the freedom of not having to work. To keep busy, he started a café named after his dog. Provided by Mich mazon, and Microsoft have pledged millions of dollars to the communities and schools surrounding their centers, OpenAI is betting that a complete rebrand will also help turn around public opinion. \"We want the communities hosting that infrastructure to help shape it and share in the opportunities it creates,\" the OpenAI spokesperson said. Time will tell, however, if the \"compute campus\" lingo catches on. Axios earlier reported that OpenAI was also preparing for a blue wave in Tuesday's midterm elections, which could result in a more regulatory-minded government. Read the original article on Business Insider", "date_str": "2026-11-01T22:28:08+00:00", "hash": "8585cf9b8cf36b5a", "title_fa": "OpenAI از همه می‌خواهد که مراکز داده هوش مصنوعی را «پردیس محاسباتی» بنامند", "summary_fa": "OpenAI نام جدید و شیک تری برای مراکز داده دارد. Bloomberg/Getty Images OpenAI می‌خواهد مراکز داده هوش مصنوعی را با استفاده از یک نام جدید و مشابه‌تر تغییر نام دهد. \"پردیس های محاسباتی\" اصطلاح جدید آنهاست. یک سخنگوی OpenAI گفت که بهتر نشان دهنده \"نقش\" زیرساخت هوش مصنوعی است. OpenAI دیگر نمی خواهد آنها را \"مرکز داده\" بنامد. در عوض، سازنده ChatGPT قصد دارد نام جدید و شیک‌تری را برای کارخانه‌های غول‌پیکری که درخواست‌های ربات چت شما را تامین می‌کنند، پیشنهاد کند. یکی از سخنگویان OpenAI روز یکشنبه به Business Insider تأیید کرد که نام جدید \"پردیس های محاسباتی\" است. سخنگو گفت: \"پردیس های کامپیوتری مقیاس و نقش زیرساختی که ما برای هوش مصنوعی می سازیم را بهتر توصیف می کند.\" اینها سرمایه گذاری های بلندمدت در محاسبات، زیرساخت های انرژی و کار ماهر هستند. اگرچه در مورد شهرت کمتر از ستاره‌ای مراکز داده هوش مصنوعی گفته شده است (نظرسنجی اخیر Pew Research نشان داد که 54 درصد آمریکایی‌ها می‌گویند مراکز داده هوش مصنوعی برای محیط‌زیست مضر هستند)، تلاش‌ها برای بهبود این دیدگاه عمدتاً شکست خورده است. مراکز داده در حال حاضر یکی از مسائل اصلی رای دهندگان در میان دوره ای هستند. در حالی که سازندگان بزرگ مراکز داده مانند متا، آمازون و مایکروسافت میلیون‌ها دلار به جوامع و مدارس اطراف مراکز خود متعهد شده‌اند، OpenAI شرط می‌بندد که یک تغییر نام تجاری کامل نیز به تغییر افکار عمومی کمک خواهد کرد. سخنگوی OpenAI گفت: \"ما از جوامعی که میزبان این زیرساخت هستند می خواهیم به شکل دادن به آن کمک کنند و در فرصت هایی که ایجاد می کند سهیم شوند.\" با این حال، زمان نشان خواهد داد که آیا زبان \"پردیس محاسباتی\" به کار خود ادامه خواهد داد. Axios پیشتر گزارش داده بود که OpenAI همچنین در حال آماده شدن برای یک موج آبی در انتخابات میان", "image_url": "https://i.insider.com/6ae7a569f3bee449b3d2a0aa?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Meta", "Microsoft"], "datetime_fa": "۱۱ آبان • ۰۱:۵۸"}, {"source": "Business Insider", "title": "A Learjet crashes near Palm Beach, killing all 9 on board", "link": "https://www.businessinsider.com/private-jet-crash-florida-2026-11", "summary": "All nine people aboard a Learjet were killed on Sunday when it crashed in South Florida. Palm Beach County Fire Rescue/Reuters A private jet crashed in South Florida on Sunday. All nine people aboard were killed, Transportation Secretary Sean Duffy said on X. Their identities have not yet been released. Nine people aboard a private jet were killed when it crashed and exploded in a fireball near Palm Beach Sunday afternoon. The plane, a 25-year-old Learjet 60 with the tail number N227BD, had departed from Austin and was on its way to the Bahamas, Transportation Secretary Sean Duffy said on X. Duffy said the plane crashed in \"a neighborhood near Cresthaven, FL,\" which is about 10 miles from Palm Beach. \"Please join me in praying for the families and loved ones of those we lost,\" he said. The identities of those on board were not immediately available. Authorities also did not say what caused the crash. There were widespread thunderstorms in South Florida on Sunday afternoon. The region is under a flood watch due to \"excessive rainfall,\" the National Weather Service said. The crash occurred less than 10 miles from President Donald Trump's Mar-A-Lago resort. The P /www.businessinsider.com/elon-musk-colossus-2-campus-spam-gun-range-2026-11", "summary": "Elon Musk said his company and contractors are making good progress at the Colossus 2 site. Finn Gomez/Getty Images Elon Musk is expanding Colossus 2 in Tennessee. Musk said two additional facilities, Spam and Gun Range, will be operational before 2027. Last week, a judge rejected SpaceX's motion to dismiss a lawsuit filed by the NAACP over Colossus 2. Elon Musk isn't wasting any time building out his massive AI-computing facilities in Tennessee. Musk said on X that he's expanding Colossus 2 with two additional sites, dubbed Spam and Gun Range. He said the Spam location used to house Hormel-brand products, Spam perhaps among them , and that the Gun Range location was once owned by the local police department. \"I walked the whole Colossus 2 site around midnight and again this morning. Good progress by the SpaceX team and contractors,\" Musk said on X. \"Gun Range is tracking to be operational by end of November and Spam in December.\" Developing and running AI systems requires enormous amounts of compute power, which led Musk to build a supercomputer called Colossus in Memphis in 2024. xAI, acquired by SpaceX, later expanded the project with Colossus 2 to generate more power for its AI chatbot, Grok. Construction for that campus began last year in Memphis. Supercomputers and data centers are necessary to power AI systems, though they've often drawn ire from communities where the hulking facilities are built. Colossus and Colossus 2 are no different. Residents near Memphis have packed public hearings, staged protests, and created petitions opposing the campuses. In April, the NAACP filed a lawsuit against xAI and its subsidiary, MZX Tech, saying they were unlawfully operating unpermitted methane gas turbines to power Colossus 2. The complaint said xAI was operating the unpermitted gas turbines in Southaven, Mississippi, which is less than 20 minutes away. Last week, a US District Judge denied xAI and MZX Tech's motion to dismiss the lawsuit. Read the original article on Business Insider", "date_str": "2026-11-01T21:06:39+00:00", "hash": "364cc603287b7021", "title_fa": "ایلان ماسک می گوید که یک کارخانه قدیمی اسپم و محدوده اسلحه را تصاحب می کند تا مجموعه هوش مصنوعی Colossus 2 خود را گسترش دهد.", "summary_fa": "ایلان ماسک گفت که شرکت و پیمانکاران او در حال پیشرفت خوبی در سایت Colossus 2 هستند. فین گومز/گتی ایماژ ایلان ماسک در حال توسعه Colossus 2 در تنسی است. ماسک گفت دو تأسیسات اضافی، Spam و Gun Range، قبل از سال 2027 عملیاتی خواهند شد. هفته گذشته، یک قاضی درخواست SpaceX برای رد دادخواستی که توسط NAACP در مورد Colossus 2 ارائه شده بود را رد کرد. ایلان ماسک هیچ وقت را برای ساختن امکانات عظیم محاسباتی هوش مصنوعی خود در تنسی تلف نمی کند. ماسک در X گفت که Colossus 2 را با دو سایت دیگر به نام‌های Spam و Gun Range گسترش می‌دهد. او گفت که محل اسپم قبلاً محصولات با نام تجاری Hormel را در خود جای می‌داد، که احتمالاً Spam در میان آنها بود، و زمانی که مکان Gun Range متعلق به اداره پلیس محلی بود. ماسک در ایکس گفت: \"من در سراسر سایت Colossus 2 حدود نیمه شب و دوباره امروز صبح قدم زدم. پیشرفت خوبی توسط تیم و پیمانکاران SpaceX انجام شد.\" \"Gun Range در حال ردیابی است تا تا پایان نوامبر و اسپم در دسامبر عملیاتی شود.\" توسعه و اجرای سیستم‌های هوش مصنوعی به مقدار زیادی قدرت محاسباتی نیاز دارد که ماسک را به ساخت ابررایانه‌ای به نام Colossus در ممفیس در سال 2024 سوق داد. xAI که توسط SpaceX خریداری شد، بعداً پروژه را با Colossus 2 گسترش داد تا برای چت ربات هوش مصنوعی خود، Grok، قدرت بیشتری تولید کند. ساخت و ساز آن پردیس سال گذشته در ممفیس آغاز شد. ابرکامپیوترها و مراکز داده برای تقویت سیستم‌های هوش مصنوعی ضروری هستند، اگرچه اغلب خشم جوامعی را که در آن تأسیسات عظیم ساخته شده‌اند، برانگیخته‌اند. Colossus و Colossus 2 تفاوتی ندارند. ساکنان نزدیک ممفیس جلسات عمومی را جمع کرده اند، اعتراضات را به راه انداخته اند و طوماری هایی در", "image_url": "https://i.insider.com/6ae77349f3bee449b3d2a07a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۱ آبان • ۰۰:۳۶"}, {"source": "Business Insider", "title": "My 25-year-old self wouldn't recognize this life. And I think that's the point.", "link": "https://www.businessinsider.com/left-corporate-career-mom-three-redefined-success-2026-11", "summary": "The author s career is not what she thought it would look like when she was younger. Courtesy of the author I spent decades building a marketing career, managing teams and budgets exceeding $1 million. After becoming a mom of three, I realized the corporate success I'd chased no longer fit my life. I started my own business, giving me the flexibility to support my kids and define success for myself. A Burger King commercial convinced 15-year-old me I needed to be in advertising. I was a Type-A, people-pleasing, rule-follower, doing everything to the highest standard, including planning a life and career I didn't think to question after a 30-second moment. My career would start at Leo Burnett . I'd work my way up, meet someone, get married at 27, and have kids a few years later. Life had other plans I landed in smaller organizations , doing a bit of everything. I worked my way up from marketing associate to director of marketing, where I managed teams and multiple brand budgets totaling more than $1 million. I was good at my job, and my reviews told the same story. Then, one Thursday afternoon — coming off a successful project — I was called into my boss's office. He told me restructuring was happening and that I could stay, but would get a pay cut. I grabbed the severance letter and left, knowing the next time I'd walk in would be my last. Friday morning, I strode confidently into his office, lawyer-reviewed and annotated, signed severance letter in hand. I'd spent 10 years there, starting as a fresh-faced 20-something with a lot to learn about the business world. It wasn't my first job , so I wasn't naive, but I was impressionable. It's where I learned what success looked like: work hard and don't rock the boat. I didn't realize how much unlearning I'd need to do. By then, I was 35, married just over a year, and knew I'd land on my feet. I did, but not how I expected: my career progressed; my family stalled. I felt peace during my maternity leave Almost five years later, I was weeks into maternity leave , thanks to adoption — something I only dreamed of, after seven miscarriages and stillbirths. And, as someone who worked since 14, I was in uncharted territory, without a reliable schedule or routine. To my shock, I felt an unexpected peace, unbothered by to-do lists, deadlines, or the corporate ladder. I'd never known this me. Priorities were changing, although I hadn't realized it yet. I already had a seat at the table and made a name for myself. A win o", "date_str": "2026-11-01T20:57:01+00:00", "hash": "5ffe7a32f0f26cf1", "title_fa": "خود 25 ساله من این زندگی را نمی شناسد. و من فکر می کنم این نکته است.", "summary_fa": "حرفه نویسنده آن چیزی نیست که او در جوانی فکر می کرد. با حسن نیت از نویسنده، من دهه ها را صرف ساختن یک حرفه بازاریابی، مدیریت تیم ها و بودجه های بیش از 1 میلیون دلار کردم. بعد از اینکه مادر سه فرزند شدم، متوجه شدم که موفقیت شرکتی که به دنبال آن بودم دیگر با زندگی من سازگار نیست. من کسب و کار خودم را راه اندازی کردم و به من انعطاف پذیری داد تا از بچه هایم حمایت کنم و موفقیت را برای خودم تعریف کنم. یک آگهی تبلیغاتی برگر کینگ مرا متقاعد کرد که باید در تبلیغات شرکت کنم. من یک نوع A، مردم پسند، پیرو قوانین بودم، همه کارها را با بالاترین استاندارد انجام می دادم، از جمله برنامه ریزی برای زندگی و شغلی که فکر نمی کردم بعد از 30 ثانیه زیر سوال ببرم. کار من در لئو برنت آغاز خواهد شد. من به راه خود ادامه می دهم، با یک نفر آشنا می شوم، در 27 سالگی ازدواج می کنم و چند سال بعد بچه دار می شوم. زندگی برنامه‌های دیگری داشت که در سازمان‌های کوچک‌تر فرود آمدم و کمی از همه چیز را انجام دادم. من از یک همکار بازاریابی به مدیر بازاریابی رسیدم، جایی که تیم‌ها و بودجه‌های چند برند را مدیریت کردم که مجموعاً بیش از 1 میلیون دلار بود. من در کارم خوب بودم و نقدهای من هم همین داستان را نشان می داد. سپس، یک روز پنجشنبه بعدازظهر - که از یک پروژه موفق بیرون آمدم - به دفتر رئیسم دعوت شدم. او به من گفت که تغییر ساختار در حال انجام است و من می‌توانم بمانم، اما حقوقم را کاهش خواهم داد. نامه جدایی را گرفتم و رفتم، می دانستم دفعه بعدی که وارد می شوم آخرین بار خواهد بود. صبح جمعه، با گامی مطمئن وارد دفترش", "image_url": "https://i.insider.com/6adf64ddc8572251b197ffe2?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۱ آبان • ۰۰:۲۷"}, {"source": "TechCrunch AI", "title": "OpenAI might rebrand its data centers as ‘AI compute campuses’", "link": "https://techcrunch.com/2026/11/01/openai-might-rebrand-its-data-centers-as-ai-compute-campuses/", "summary": "Data centers are deeply unpopular. But what if we called them something else?", "date_str": "2026-11-01T21:55:23+00:00", "hash": "c8c33703c65a1bb3", "title_fa": "OpenAI ممکن است مراکز داده خود را به عنوان \"پردیس محاسباتی هوش مصنوعی\" تغییر نام دهد", "summary_fa": "مراکز داده عمیقاً محبوب نیستند. اما اگر آنها را چیز دیگری صدا کنیم چه؟ Axios گزارش می‌دهد که OpenAI در حال آماده‌سازی یک «تلاش روابط عمومی» برای پس از انتخابات میان‌دوره‌ای در روز سه‌شنبه است، زیرا به نظر می‌رسد دموکرات‌ها احتمالاً مجلس نمایندگان و احتمالاً سنا را نیز به دست خواهند آورد. کریس لیهان، مدیر امور جهانی این شرکت، به آکسیوس گفت که دوره میانی دوره‌ای، «کمی تریلر فیلمی برای آنچه در سال 2028 خواهید دید» خواهد بود، در حالی که او انتظار دارد هوش مصنوعی در انتخابات ریاست‌جمهوری «مسئله» باشد. بنابراین OpenAI قرار است بر بحث هوش مصنوعی تأثیر بگذارد که در حال پیشرفت است، با Lehane در مورد چندین پیشنهاد، از جمله توسعه «محدودیت‌های سرعت» هوش مصنوعی. یافتن راه هایی برای کمک به مردم که هوش مصنوعی را به عنوان توانمندسازی در زندگی روزمره خود بدانند. فشار دادن ایالات متحده برای ایفای نقش در توسعه استانداردهای جهانی - و بله، تغییر نام مراکز داده به عنوان \"پردیس محاسباتی هوش مصنوعی\". Lehane همچنین گفت‌وگو پیرامون مراکز داده (بحثی که آمازون و مایکروسافت را وادار کرد تا بگویند دیگر از NDA در مذاکرات خود با دولت‌های محلی استفاده نخواهند کرد) را «خوب و سالم» توصیف کرد. او گفت: \"جوامع باید شرکت ها را مسئول و پاسخگو بدانند تا آنها واقعاً و واقعاً از این پروژه ها منفعت دگرگون کنند.\" یک پاس بخرید، دومین جلد رایگان را در بوت کمپ موسس نهایی سال TechCrunch با آوردن هم بنیانگذار یا شریک خود به صورت رایگان کتاب قبل از انقضای قرارداد BOGO دریافت کنید مشترک شدن برای بزرگترین اخبار فناوری صنعت هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها هسته TechCrunch هستند، بنابراین بهترین پوشش ما را هر هفته دریافت کنید.", "image_url": "https://techcrunch.com/wp-content/uploads/2026/08/GettyImages-2283113936-maller.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Microsoft", "عامل‌های هوشمند"], "datetime_fa": "۱۱ آبان • ۰۱:۲۵"}, {"source": "The Verge", "title": "NASA hopes the commercial space industry can help save Hubble", "link": "https://www.theverge.com/science/1024239/nasa-commercial-space-save-hubble", "summary": "Gravity is a cruel mistress, slowly dragging the famed telescope ever closer to its ultimate demise with every day. Hubble is in no immediate danger of burning up in the Earth's atmosphere, but its time will run out in the early to mid 2030s unless its orbit is boosted. So NASA is taking proposals from the private sector to see if anyone can save it. In a post on NASA's site , Administrator Jared Isaacman said: \"Hubble still has important science ahead of it, and we should be looking at every reasonable opportunity to keep it delivering for as long as possible … If there are innovative and cost-effective ways to extend the life of an asset … Read the full story at The Verge.", "date_str": "2026-11-01T21:09:21+00:00", "hash": "c52dfe00efd060ca", "title_fa": "ناسا امیدوار است صنعت فضای تجاری بتواند به نجات هابل کمک کند", "summary_fa": "Gravity معشوقه ظالمی است که به آرامی تلسکوپ مشهور را هر روز به سمت مرگ نهایی خود نزدیک می کند. ه ", "hash": "1e73565a48e41e89", "title_fa": "Anthropic کلود را به روز می کند تا از بازسازی بازی های ویدیویی موجود جلوگیری کند", "summary_fa": "کاربران همچنان می توانند برای کمک به طراحی بازی های اصلی یا سبک به کلود تکیه کنند. Cheng Xin/Getty Images افزودن Engadget به Google: منبع برگزیده Google Discover Claude دیگر به کاربران خود اجازه نمی دهد بازی های ویدیویی مورد علاقه خود را با هوش مصنوعی سرگرم کنند. همانطور که برای اولین بار توسط یک کاربر X کشف شد، آنتروپیک کلود را با چند خط کد جدید به‌روزرسانی کرد که می‌خواند: «بازی‌های اصلی، بازی‌ها در یک ژانر و بازی‌ها را از طرح‌ها و دارایی‌های خود کاربر بسازید. یک بازی موجود خاص را بازسازی نکنید، حتی اگر تغییر نام داده شود یا اورجینال نامیده شود.» این تغییرات توسط ادی عثمانی، یکی از اعضای کادر فنی Anthropic، در X تأیید شد، که گفت این شرکت می‌خواهد «آن را از بازسازی بازی خاص شخص دیگری منصرف کند، زیرا استفاده از Claude برای نقض IP برخلاف خط‌مشی استفاده ما است که بازی‌های عثمانی با بازی‌های اصلی ساخته شده‌اند.» طراحی‌ها و دارایی‌ها باید تحت تأثیر قرار نگیرند، و افزود که Anthropic به تکرار ادامه می‌دهد تا اطمینان حاصل شود که در حال ایجاد تعادل مناسب هستیم، این تغییرات در زمانی اتفاق می‌افتد که موجی از بازی‌های AAA با کمک هوش مصنوعی حذف شده و برای بازی در مرورگرها در دسترس هستند. اخیراً Halo: Combat Evolved، Call of Duty: Modern Warfare 2 و حتی Grand Theft Auto V را به‌عنوان پروژه‌های فن‌دار با کد vibe دیده‌ایم. Anthropic سابقه رسیدگی به مسائل IP را دارد. سال گذشته، این شرکت موافقت کرد که در یک شکایت دسته جمعی که در آن 500000 نویسنده Anthropic را متهم به استفاده از مطالب دارای حق چاپ برای آموزش مدل های هوش مصنوعی خود کرده بودند، مبلغ 1.5 میلیارد دلاری را پرداخت کند. اخیراً، املاک الویس پریسلی به دلایل مشابه علیه آنتروپیک شکایت کرده است.", "image_url": "https://www.engadget.com/img/gallery/anthropic-updates-claude-to-stop-it-from-recreating-existing-video-games/l-intro-1793566610.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Google"], "datetime_fa": "۱۱ آبان • ۰۰:۳۸"}, {"source": "Engadget", "title": "Ceramic vs Titanium Apple Watch: Which material is better for overall durability?", "link": "https://www.engadget.com/2300397/apple-watch-ceramic-vs-titanium-which-is-better-material-overall-durability/", "summary": "An Apple Watch is a handy accessory for your iPhone, but choosing the most durable material can be challenging. This one is better suited to your needs.", "date_str": "2026-11-01T21:00:00+00:00", "hash": "529bcad30214938c", "title_fa": "اپل واچ سرامیکی در مقابل تیتانیوم: کدام ماده برای دوام کلی بهتر است؟", "summary_fa": "اپل واچ یک لوازم جانبی مفید برای آیفون شما است، اما انتخاب بادوام ترین مواد می تواند چالش برانگیز باشد. این یکی برای نیازهای شما بهتر است. سرامیک و تیتانیوم هر دو از مواد ممتاز اپل واچ هستند، اما از جهات مختلف برتری دارند. Hadrian/Shutterstock Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover مقایسه مواد پوشش اپل واچ، به ویژه تیتانیوم و سرامیک، با درجات متفاوتی از شهود ارائه می شود. برای نمونه، مدل های تیتانیومی دارای اجزای سرامیکی هستند. دوم، سرامیک سخت‌تر از تیتانیوم است، اگرچه تیتانیوم در کل ماده قوی‌تری است. یک برنده وجود دارد، اما برنده شدن با هشدارهایی همراه است. تیتانیوم انتخاب بهتری برای مصرف کنندگانی است که عمدتاً به دلیل دوام طولانی مدت خرید می کنند، اما به اندازه سرامیک در برابر خش مقاوم نیست. همانطور که می بینید، مقایسه کمی پیچیده تر از این فرض عمومی است که تیتانیوم ماده برتر است. از نظر فراوانی، تیتانیوم کاربردی‌ترین گزینه ممتاز است، زیرا اپل از زمان اپل واچ سری 5، پوشش سرامیکی اصلی اپل واچ تولید نکرده است. با اپل واچ سری 12، اپل گزینه سرامیکی (سفید مرواریدی و آبی نیمه شب) را بازگردانده است، اما این امر باعث شده است که سرامیک نسل‌های فراوانی را پشت سر بگذارد. هر دو مدل سری 12 سرامیکی و تیتانیوم دارای جلوی کریستال یاقوت کبود هستند، بنابراین هیچ جدایی در آن وجود ندارد. اما خود قضیه چیز دیگری است. سرامیک گزینه بهتری برای خریدارانی است که از ایجاد خراش روی بدنه ساعت خود متنفرند و خواهان آن سطح درخشان و براق برای طولانی مدت هستند. تیتانیوم بهترین گزینه برای کسانی است که تمایل دارند وارد چارچوب درها شوند و وسایل ظریف را رها کنند. شما می دانید که هستید (نویسنده شامل). بعلاوه، گزینه تیتانیوم با وزن 44.9 گرم در مقایسه با نسخه سرامیکی 51.3 گرمی به طور", "image_url": "https://www.engadget.com/img/gallery/ceramic-vs-titanium-apple-watch-which-material-is-better-for-overall-durability/l-intro-1793034841.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple"], "datetime_fa": "۱۱ آبان • ۰۰:۳۰"}, {"source": "Engadget", "title": "How to know if a USB-C cable is waterproof", "link": "https://www.engadget.com/2300388/how-to-know-usb-c-cable-waterproof/", "summary": "If you need extra protection for your USB cables, knowing how to tell if they re waterproof beforehand is important. Here s how to check a cable s rating.", "date_str": "2026-11-01T20:00:00+00:00", "hash": "2c6ce73b3736ea97", "title_fa": "چگونه بفهمیم کابل USB-C ضد آب است؟", "summary_fa": "اگر به محافظت بیشتری برای کابل‌های USB خود نیاز دارید، دانستن اینکه چگونه از قبل ضدآب هستند یا خیر، مهم است. در اینجا نحوه بررسی رتبه بندی کابل آورده شده است. هنگام خرید کابل USB-C ضدآب Panadesign/Shutterstock، همیشه رتبه IP را بررسی کنید. به طور گسترده از خرده فروشان آنلاین، از جمله آمازون در دسترس است، آنها احتمالا دارای مهر و موم برای محافظت از اتصال و ارسال در انواع مختلف، از جمله کابل های نر، ماده، و زاویه دار هستند. اما آیا مهر و موم ها کار می کنند؟ کمیسیون بین‌المللی الکتروتکنیکی (IEC) استاندارد IEC 60529 را توسعه داده است، یک کد حفاظت از نفوذ پذیرفته‌شده جهانی که نشان می‌دهد یک محفظه (مانند دوشاخه USB-C) چقدر در برابر جامدات و مایعات مقاومت می‌کند. عدد اول در این کد نشان دهنده محافظت در برابر گرد و غبار است، در حالی که عدد دوم محافظت از آب را نشان می دهد. طبق این کد، کابل های USB-C ضد آب باید دارای رتبه IP67 یا IP68 باشند. این کابل‌ها بیشتر در محیط‌های سخت خاص، مانند تولید، ساخت و ساز، سیستم‌های شارژ وسایل نقلیه دریایی و الکتریکی - هر جایی که در معرض آب، آب و هوا یا تصادف هستند، استفاده می‌شوند. هنگام انتخاب کابل، آنچه بیش از همه اهمیت دارد، رتبه IP است (حتی برای ابزارهای دیگر، مانند تلفن شما): AntonSAN/Shutterstock استاندارد USB  it with AI welfare as a top priority,\" he said. \"The other 8 billion conscious human beings on the planet have not signed up to this experiment and their moral rights, safety, and welfare are what we have an obligation to protect first and foremost.\" Conversations around whether AI models could one day become conscious are picking up steam in the tech world. Last April, Anthropic started a research program to investigate and prepare to navigate \" model welfare .\" In a blog post, the startup questioned whether developers should be concerned about models' potential consciousness and experiences. Google DeepMind published research papers this year about AI consciousness and how ascribing that characteristic could present challenges. On X, Suleyman said that if an AI model acts as if it suffers, or genuinely believes it can suffer, it will likely prioritize its own needs over operational objectives. As a result, they could harm humans because they're competing for resources, such as compute and energy, to pursue their own goals. \"We should only design AIs to so they are not conscious and not deserving of rights, and with the sole purpose to accelerate human wellbeing without being driven by their own intrinsic motivations.. We c", "date_str": "2026-11-01T19:45:17+00:00", "hash": "4e5d9ea91de2507d", "title_fa": "رئیس هوش مصنوعی مایکروسافت می گوید هوش مصنوعی هوشیار نیست و ما باید آن را به همین شکل حفظ کنیم", "summary_fa": "مصطفی سلیمان، مدیر عامل هوش مصنوعی مایکروسافت، نسبت به ایجاد ابر هوش آگاهانه در X هشدار داد. استفان براشیر/ گتی ایماژ، مصطفی سلیمان، مدیر عامل هوش مصنوعی مایکروسافت، گفت که توسعه هوش مصنوعی آگاهانه \"بی پروا\" است. این دقیقاً یک برداشت جالب نیست، اما بسیاری از محققان هوش مصنوعی معتقدند که ممکن است. سلیمان گفت که اگر شواهدی مبنی بر هوشیاری هوش مصنوعی به دست بیاید، خواستار توقف توسعه خواهد شد. برخی از محققان هوش مصنوعی این سوال را مطرح می کنند که آیا هوش مصنوعی روزی می تواند هوشیاری خود را به دست آورد. اگر مدیر عامل هوش مصنوعی مایکروسافت چیزی برای holars they polled see their career prospects rapidly dimming as AI remakes the field. Nearly 76% said they are increasingly unlikely to stay in academic math after earning their degrees. 76% said they feel less motivated to do research \"as a result of AI developments .\" And in a free-response portion of the survey, grad students laid bare their raw, pent-up feelings about the subject. Perhaps most striking is a red-hot frustration with academic leadership, which respondents described as alternatively wayward, useless, meek, silent, and ineffectual. \"It'd be great if institutes gave guidance instead of platitudes on this subject,\" one respondent wrote. \"We are lacking high-level leadership from across the academic community,\" another said. For the survey, conducted by three MIT-affiliated math students, the researchers polled 268 early-career mathematicians via a Google Form. Questions were multiple-choice and free response. They all centered on AI's ever-expanding ability to do work they've spent years studying. Notably, the response window closed just after OpenAI released hundreds of solutions to long-standing problems on October 6. The authors caveated the survey, saying it represents the vibe at \"only a small window of time.\" \"The past couple of months have been exhausting,\" the researchers wrote. \"We're being forced to reckon with existential questions about a field we love, all while incredibly uncertain about our own futures.\" Since OpenAI first really broke onto the mathematics scene in September, when it published solutions to the Navier-Stokes Millennium Prize question, the AI-generated solutions have only kept coming. Mathematicians have described going through stages of disbelief, shock, denial, anger, and, for some, acceptance. Though some high-level mathematical councils have convened to issue edicts on how AI should be used, it's not like OpenAI has to listen to them. Ope", "date_str": "2026-11-01T19:08:12+00:00", "hash": "677e84d1eea4a0e0", "title_fa": "ریاضیدانان جوان در حال بازنگری در حرفه خود هستند: \"هیچ یک از کارهای فردی مهم نخواهد بود\"", "summary_fa": "دانشجویان فارغ التحصیل رشته ریاضی به دلیل هوش مصنوعی به فکر ترک شغل خود هستند. Malte Mueller/Getty Images در حالی که هوش مصنوعی رشته ریاضی را بازسازی می کند، برخی از دانش آموزان می گویند که می خواهند تسلیم شوند. در یک نظرسنجی، نزدیک به 76 درصد از دانش‌آموزان گفتند که بعید به دنبال شغلی در دانشگاه ریاضی هستند. بسیاری از پاسخ دهندگان نیز از رهبری دانشگاهی انتقاد کردند. برنامه های هوش مصنوعی مرزی اکنون می توانند ریاضیات را بهتر از دانشجویان فارغ التحصیل انجام دهند. معلوم است که آن دانش‌آموزان اخبار را خوب نمی‌پذیرند. در مقاله‌ای که این هفته منتشر شد، محققان MIT دریافتند که اکثریت قریب به اتفاق دانشجویان مقطع کارشناسی ارشد و دانش پژوهان فوق‌دکتری که مورد نظرسنجی قرار گرفتند، چشم‌انداز شغلی خود را به‌سرعت کمرنگ می‌کنند، زیرا هوش مصنوعی این رشته را بازسازی می‌کند. تقریباً 76 درصد گفتند که بعید است پس از کسب مدرک خود در ریاضیات آکادمیک باقی بمانند. 76 درصد گفتند که در نتیجه پیشرفت های هوش مصنوعی، انگیزه کمتری برای انجام تحقیقات دارند. و در یک بخش بدون پاسخ از نظرسنجی، دانش‌آموزان فارغ‌التحصیل، احساسات خام و نهفته خود را در مورد این موضوع آشکار کردند. شاید قابل توجه ترین سرخوردگی داغ از رهبری دانشگاهی باشد که پاسخ دهندگان آن را به طور متناوب به عنوان متعصب، بی فایده، فروتن، ساکت و بی اثر توصیف کردند. یکی از پاسخگویان نوشت: \"خیلی خوب خواهد بود اگر موسسات به جای دروغگویی در این موضوع راهنمایی کنند.\" یکی دیگر گفت: «ما فاقد رهبری سطح بالا از سراسر جامعه دانشگاهی هستیم. برای این نظرسنجی که توسط سه دانشجوی ریاضی وابسته به MIT انجام شد، محققان از 268 ریاضیدان اولیه از طریق فرم گوگل نظرسنجی کردند. سوالات چند گزینه ای و پاسخ رایگان بود. همه آنها بر توانایی روزافزون هوش مصنوعی برای انجام کارهایی متمرکز بودند که سالها", "image_url": "https://i.insider.com/6ae76e4cd8cc18cf7950fef1?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Google"], "datetime_fa": "۱۰ آبان • ۲۲:۳۸"}, {"source": "The Verge", "title": "Flock keeps ig : "ویندوز 11 دارای یک منوی دزدکی است که شما را با تنظیمات، Task Manager، Event Viewer و موارد دیگر در یک مکان متصل می کند. aileenchik/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover Windows 11 مملو از منوهای کوچکی است که به شما امکان می دهد فرآیندهای رایانه خود را مدیریت کنید، سیستم های آن را بهینه کنید و خطاهای احتمالی را عیب یابی کنید. با این حال، دانستن همه کلیدهای میانبر مناسب و مکان جستجوی برخی از قسمت‌های مبهم‌تر دستگاهتان می‌تواند آزاردهنده باشد. خوشبختانه، یکی از ساده‌ترین راه‌ها برای حذف و مدیریت ویندوز 11، استفاده از منوی مخفی است که شاید نام آن را نشنیده باشید. این منوی مخفی چند نام دارد، از جمله منوی پیوند سریع و منوی Windows-X. نام دوم به نحوه یافتن این ناحیه مخفی اشاره دارد که با زدن کلیدهای Win+X است. با زدن آن دکمه‌ها و باز کردن آن منو، به شما امکان می‌دهد مجموعه‌ای از منوها و گزینه‌های دیگر را تجزیه و تحلیل کنید - به شما امکان دسترسی به گزینه‌های مدیریتی بی‌شماری را در یک مکان می‌دهد. Nguyenducquang/Getty Images اگر می‌خواهید نگاهی به این منوی پیوند سریع بیندازید، کافی است کلیدهای Win+X فوق‌الذکر را فشار دهید. سپس منو در سمت چپ صفحه نمایش شما ظاهر می شود، درست بالای جایی که لوگوی ویندوز در نوار وظیفه قرار دارد. با این کار تعدادی از ویژگی‌های استانداردی که معمولاً در منوی استارت پیدا می‌کنید یا به نوار وظیفه پین ​​می‌شوند، آشکار می‌شوند - مانند تنظیمات، اکسپلورر فایل، جستجو، گزینه‌های خاموش کردن و غیره. با این حال، تعدادی از ویژگی‌های معمولاً در تنظیمات (از جمله برنامه‌های نصب‌شده، سیستم، گزینه‌های برق و اتصالات شبکه) یا پشت کلیدهای میانبر دیگر (مانند Mobility Center، Event Viewer، Disk Management، Computer Management و Task Manager) وجود دارد.", "image_url": "https://www.engadget.com/img/gallery/this-hidden-windows-11-menu-can-save-you-valuable-time-when-troubleshooting/l-intro-1792876075.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۰ آبان • ۲۲:۳۰"}, {"source": "Engadget", "title": "The biggest problem with trying to directly power EVs with solar roofs", "link": "https://www.engadget.com/2300413/bigge igger AV boom is here", "link": "https://techcrunch.com/2026/11/01/techcrunch-mobility-a-new-bigger-av-boom-is-here/", "summary": "Welcome back to TechCrunch Mobility, your hub for the future of transportation and now, more than ever, the role AI is playing in it.", "date_str": "2026-11-01T17:04:00+00:00", "hash": "a63ac5e61a639d5f", "title_fa": "TechCrunch Mobility: یک رونق جدید و بزرگتر AV در اینجا است", "summary_fa": "به TechCrunch Mobility، مرکز شما برای آینده حمل و نقل و اکنون، بیش از هر زمان دیگری، نقشی که هوش مصنوعی در آن ایفا می کند، خوش آمدید. من در اینجا و در پادکست‌های Equity و Autonocast به شوخی گفتم که صنعت خودروهای خودران بسیار شبیه سال 2016 است، حداقل از نظر سر و صدایی که در این بخش وجود دارد. اما مکالمه اخیر با شریک Trucks VC Puneeth Meruva باعث شد که در این مقایسه تجدید نظر کنم. شواهدی وجود دارد که نشان می‌دهد سال 2026 - حداقل با معیارهای معین - حتی از روزهای کف‌آلود 2016 و 2017 گرم‌تر است. Trucks VC، که در سرمایه‌گذاری در مراحل اولیه تخصص دارد، از 81 استارت‌آپ خودروی خودمختار جدید تا کنون در سال 2026 - دو سوم از سال گذشته و بیش از یک سال گذشته به اندازه کافی رونق گرفته است. شرکت VC در یک پست وبلاگ جدید استدلال می کند که ما در میانه یک موج AV ثانویه و حتی بزرگتر هستیم که توسط پیشرفت های تکنولوژیکی تقویت شده است. بله، من در مورد هوش مصنوعی صحبت می کنم. مرووا به من گفت: «برای مدت طولانی شرکت‌های AV تلاش می‌کردند از آنچه که AV 1.0 بود به AV 2.0 بروند، که نوعی معماری سرتاسر جام مقدس برای AV است. و من فکر می‌کنم که مدل‌های پایه اکنون یک معماری فنی ارائه می‌دهند که این سیستم‌های سرتاسر را ممکن می‌سازد. این مدل‌های پایه به‌ویژه در تعمیم در محیط‌ها و سناریوهای مختلف خوب هستند و به طور بالقوه باعث ارزان‌تر و سریع‌تر استقرار AVها می‌شوند. ورود مدل‌های متن‌باز قدرتمند مانند Alpamayo انویدیا و مدل‌های زبان بینایی-عملی همه‌منظوره Qwen، کار استارت‌آپ‌ها را آسان‌تر کرده است. مانع ورود کمتر از همیشه است. Meruva گفت Trucks به طور مداوم شاهد استقرار استارت آپ ها در عرض چند ماه و با کمتر از 1 میلیون", "image_url": "https://techcrunch.com/wp-content/uploads/2026/10/rob g about how much I value the freedom we have as a family. We can go camping or take a day trip whenever we want, and I realized that having set work hours might take that away. Around the same time, I was scrolling through my phone and came across videos showing how to make, bake, and decorate cake pops . They looked so much easier — and more manageable — than creating huge, elaborate cakes. I thought I could do that. I got the encouragement I needed After a bit of experimenting, I made a batch of cake pops for a Halloween party. Everyone loved them, and that gave me the encouragement I needed to try selling them. Jessica Redford made her first pop cakes for a Halloween party. Courtesy of Jessica Redford I started posting about my cake pops on Instagram, taking small orders, and attending vendor events. Then, in November, I had some cake pops left over after a vendor event. The kids and I decided to sit outside on the corner of our neighborhood and sell them to people passing by. My neighbors loved them! I only had a few left after that, so I took them to my chiropractor as a gift. She posted about them on her social media, and that's when everything really took off. Suddenly, I was getting what felt like endless orders for Thanksgiving and Christmas cake pops. I was burning out Those months were crazy. I was in the kitchen constantly. It was exciting, but it was also ov", "date_str": "2026-11-01T16:52:01+00:00", "hash": "e3da275e94948423", "title_fa": "من یک کار نیمه وقت می خواستم در حالی که 3 فرزندم را در خانه درس می دادم. سپس شلوغی جانبی کیک پاپ من بلند شد.", "summary_fa": "جسیکا ردفورد سه فرزندش را در خانه آموزش می دهد و کسب و کارش را اداره می کند. با حسن نیت از جسیکا ردفورد جسیکا ردفورد به سه کودک در خانه می‌آموزد و می‌خواهد یک خروجی خلاقانه برای او داشته باشد. او شروع به ساخت کیک پاپ و فروش آنها در رویدادهای محلی قبل از شروع سفارش کرد. او اکنون هر جمعه از یک چرخ دستی کیک در خارج از خانه اش می فروشد و در عین حال انعطاف پذیری خانواده را حفظ می کند. این مقاله گفته شده بر اساس گفتگو با جسیکا ردفورد است. برای طول و وضوح ویرایش شده است. سپتامبر گذشته، یک مرکز خرید در خیابان از من باز شد. یک خواربار فروشی با نانوایی داشت و در ابتدا فکر کردم که ممکن است فرصت مناسبی برای من باشد تا شغل پاره وقت پیدا کنم. من سال هاست که سه بچه ام را که الان 14، 11 و 8 ساله هستند، در خانه آموزش می دادم. همانطور که آنها بزرگتر شدند و کمی کمتر به من نیاز داشتند، احساس کردم که چیزی برای خودم می خواهم، خروجی برای خلاقیتم. به نظر می رسید یک کار پاره وقت بهترین راه برای داشتن آن باشد. قبل از بچه دار شدن، در کلاس های کیک سازی شرکت می کردم و اصول اولیه را یاد می گرفتم، بنابراین کار کردن در نانوایی فقط چند دقیقه دورتر از خانه ایده آل بود. اما بعد شروع کردم به این فکر کردن که چقدر برای آزادی ما به عنوان یک خانواده ارزش قائل هستم. ما می توانیم هر زمان که بخواهیم به کمپینگ برویم یا یک سفر یک روزه داشته باشیم، و من متوجه شدم که تعیین ساعت کاری ممکن است این کار را از بین ببرد. تقریباً در همان زمان، در تلفنم می چرخیدم و به ویدیوهایی برخوردم که نحوه درست کردن،", "image_url": "https://i.insider.com/6ada2b43510d67c758d85c9f?width=946&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۰ آبان • ۲۰:۲۲"}, {"source": "Business Insider", "title": "Even millionaires are renting. Here are 10 cities they're flocking to.", "link": "https://www.businessinsider.com/us-cities-most-millionaire-renters-2026-11", "summary": "A luxury building in Brickell, a wealthy neighborhood in Miami with many businesses and residential buildings. ajansen/Getty Images Census data shows that the number of millionaire renter households grew by 229% from 2020 to 2024. Apartment-search website RentCafe ranked the cities with the fastest growth in millionaire renters. Millionaire renters still favor New York and LA, but Southern cities are gaining them fastest. Even millionaires are renting in today's expensive real estate market. Apartment-search website RentCafe found that the number of millionaire renter households grew by 229% when comparing US Census Bureau estimates for 2020 to 2024 with those from 2016 to 2020. That outpaced the 193% growth in millionaire homeowner households during the same period. RentCafe defines a \"millionaire renter\" as a household earning at least $1 million a year that rents an apartment or house. The company found that nearly half of millionaire renters are millennials, though the number of Gen Z millionaire renters has grown the fastest since 2020. And while New York, San Francisco, and Los Angeles remain the biggest hubs for millionaire renters, Southern metros are seeing the fastest growth. Doug Ressler, manager of business intelligence at Yardi Matrix, the firm behind RentCafe's report, told Business Insider that while Western metros such as Riverside and Santa Cruz, California, and Northeastern metros such as Utica and Syracuse, New York, are losing millionaire renters, Southern metros are gaining them, largely thanks to their growing job markets. \"These declines are at the intersection of migration, wealth creation, lifestyle choices, and renting as a transitional or capital strategy,\" Ressler said. \"As corporate headquarters relocate to the South , more senior-level executives are moving there. Many rent before they buy, helping drive the region's growth in high-income households and millionaires.\" Over the past few years, many companies, including Tesla, Oracle, Charles Schwab, and Palantir, have relocated their headquarters or opened new offices in Texas and Florida , bringing their workers with them. It's no surprise, then, that several of the fastest-growing metros for millionaire renters are in these two states. Below, the top 10 cities for millionaire renters. 10. Phoenix Kruck20/Getty Images Number of millionaire renter households in 2020: 20 Number of millionaire renter households in 2024: 91 Percentage increase: 355% 9. Boston Boston, Massachusetts", "date_str": "2026-11-01T16:24:01+00:00", "hash": "863274e6005c4ef2", "title_fa": "حتی میلیونرها هم اجاره می دهند. در ای ily. My grandfather was waiting for us in his beat-up 91 Nissan pickup truck. Every bump felt like the wheels would fly off. It took me 22 years to go back to visit, and everything had changed. He had us working the land The green pasture and mountains of Santiago were a world apart from the 6-floor walk in New York. Here we slept in a bed with a mosquito net and heard the rooster and hens all night. In the morning, we were woken up by our abuelo's words, \"Vamos a trabjar,\" which meant: time to work.\" We went with him to the farm to be his ranch hands. It was exhausting. In the evening, with mud on our boots, my brother and I scrambled onto his truck. He drove us back to his place, where a bowl of sancocho was waiting. He'd been farming for 60 years. At the end of our 90 days, I promised to return soon. I had no idea it would be 22 years until I could afford to take a vacation on my own dime. I was broke At home, I was broke, working odd jobs to afford clothes and sneakers. Mom worked 50 hours a week and moved us to Bergen County, New Jersey. Watching \" The Lord of the Rings ,\" I decided I wanted to be an actor. Against my mother's wishes, I devised a plan to drop out of school to get exciting roles in the movie industry . She thought a secure position as a policeman, fireman, or teacher was a better route. But I blindly followed my movie dreams with no backup plan. Moving to Manhattan, I paid $800 a month for a 60-square-foot apartment. I found a manager who helped me score an audition for a small theatre play. I played \"suitor 1\" and then landed a lead role in a web series. I won the role of an assassin navigating a dysfunctional family while executing hits for clients. It was chaotic, deeply unserious at times, and entirely thrilling. But I could barely cover bills. Eve", "date_str": "2026-11-01T15:58:01+00:00", "hash": "8a0f96865f94926b", "title_fa": "22 سال بود که پدربزرگم را ندیده بودم. وقتی بالاخره به جمهوری دومینیکن برگشتم، اولین سوال او مرا شکست.", "  new adventure. Courtesy of Mikkel Woodruff While I figured out what was next for me, my parents graciously agreed to let me move back into their house in the suburbs of Long Island. As much as I would miss Orlando, I appreciated this small safety net. And with no job lined up or savings to rely on, I started leaning on my network of friends and family in New York. I told anyone I could think of that I needed a job, and I was up for the adventure of trying something new. Luckily, thanks to friends and my belief that closed mouths don't get fed (which has proven true time and again), I found an incredible opportunity at a then-startup in New York City called Rent the Runway . The new position was different from my previous work, but it sounded exciting and relied on skills I had really strengthened in Orlando. My parents drove me to the train station every weekday so I could commute into the office, and I saved enough money to pay off some of my college debt and move into an NYC apartment within the yea", "date_str": "2026-11-01T14:25:01+00:00", "hash": "abfa646a596feb6a", "title_fa": "در 27 سالگی، شغل رویایی ام را بدون برنامه رها کردم. در آن زمان من را کشت، اما بیش از یک دهه بعد نتیجه داد.", "summary_fa": "همانقدر که دوست داشتم شغل رویایی‌ام را انجام دهم، نمی‌توانستم احساس کنم که باید چیز جدیدی را امتحان کنم. با حسن نیت از Mikkel Woodruff من شغل رویایی خود را در 27 سالگی بدون اینکه شغل جدیدی در صف قرار دهم ترک کردم. نمی‌دانستم بعدش چه می‌شود. با تکیه بر شبکه‌ام، نقش جدیدی پیدا کردم و در نهایت به راه‌اندازی کسب‌وکار خودم پرداختم. بیش از 15 سال از زمانی که اولین ریسک را با ترک انجام دادم می گذرد، و بسیار سپاسگزارم که این کار را انجام دادم. وقتی شغل رویایی‌ام را شروع کردم، هرگز تصور نمی‌کردم فقط دو سال بعد از آن دور شوم. به هر حال، فانتزی دیرینه من از کار در طراحی پارک های موضوعی به تبلیغات رسیده بود: من هر روز با افراد با استعداد همکاری می کردم، هر زمان که می خواستم به رایگان در پارک ها بازی می کردم و بسیاری از اسرار صنعت را در مورد ایجاد جادو یاد گرفتم. من حتی به طرا
