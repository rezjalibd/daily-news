  <style>
    :root[data-theme="dark"] {

      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

له قرار گرفت. مقام‌های سعودی حوثی‌های یمن را مسئول این حمله معرفی کرده و از زخمی شدن ۱۱ نفر خبر داده‌اند. سازمان دفاع مدنی عربستان در بیانیه‌ای اعلام کرد که زخمی‌ها شامل دو شهروند سعودی، دو تبعۀ هند، سه تبعۀ نپال و چهار تبعۀ مصر هستند. خبرگزاری فرانسه نیز به نقل از یک منبع آگاه از جزئیات حمله گزارش داد که دست‌کم دو نفر از زخمی‌ها بر اثر سوختگی شدید در وضعیت وخیمی قرار دارند. به‌گفتۀ این منبع، هنگام وقوع حمله شماری از افراد در حال تعمیر خسارت‌های واردشده به برج در حملۀ هفتۀ گذشته بودند. سه شاهد عینی به خبرگزاری فرانسه گفته‌اند که حملۀ تازه، برج ۸۰طبقۀ صندوق سرمایه‌گذاری عمومی عربستان را در منطقۀ مالی ملک عبدالله هدف قرار داده است. این برج با ارتفاع ۳۸۵ متر، بلندترین ساختمان ریاض و یکی از شاخص‌ترین بناهای پایتخت عربستان است. ترکی المالکی، سخنگوی ائتلاف نظامی به رهبری عربستان سعودی در یمن، این حمله را «تروریستی و بزدلانه» توصیف کرد و گفت نهادهای مسئول در حال بررسی محل حادثه هستند. او نام ساختمان هدف قرارگرفته را اعلام نکرد. این برج پیش‌تر روز پنجشنبه ۲۸ آبان نیز هدف حملۀ حوثی‌ها قرار گرفته بود. مقام‌های سعودی در آن زمان اعلام کردند که چند طبقۀ ساختمان و دو بنای مجاور آسیب دیده‌اند، اما کسی زخمی نشده است. حوثی‌ها مسئولیت حملۀ قبلی را پذیرفتند، اما تا زمان انتشار گزارش‌های تازه، بیانیه‌ای دربارۀ حملۀ روز سه‌شنبه منتشر نکرده‌اند. حملات حوثی‌ها به مراکز اقتصادی عربستان در هفته‌های اخیر افزایش یافته است. این", "image_url": "https://gdb.rferl.org/82f2b656-64e5-4061-803a-ea3401fde728_w1200_h630.jpg", "category": "استارتاپ و سرمایه‌گذاری", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۳ آذر • ۲۱:۰۴"}, {"source": "Iran International", "title": "پاسخ شهروندان به فراخوان فرزندآوری مجتبی خامنه‌ای: گردن برای طناب دار می‌خواهید؟", "link": "https://www.iranintl.com/202611242861", "summary": "انتشار پیام مجتبی خامنه‌ای، رهبر غایب جمهوری اسلامی درباره ضرورت افزایش جمعیت و فرزندآوری، موجی از خشم و اعتراض شهروندان را به دنبال داشت. آن‌ها با اشاره به فشارهای اقتصادی، فقدان امنیت و نگرانی از آینده فرزندانشان، پیام مکتوب منتسب به رهبر غایب از نظر را به چالش کشیدند.", "date_str": "2026-11-24T17:  مجتبی خامنه‌ای به عنوان سومین رهبر جمهوری اسلامی را منتشر کرده‌اند. این کلیپ بخشی از فیلم مستندی با عنوان «برگزیده» است که قرار است منتشر شود. اسفندماه سال گذشته پس از آنکه،‌ ساختمان مجلس خبرگان هدف قرار گرفت، گزارش شد که نیروهای امنیتی نمایندگان این مجلس را برای انتخاب رهبر بعدی، مخفیانه به ساختمانی امن منتقل کرده‌اند. پس از انتشار این ویدئو برخی از کانال‌های تلگرامی با انطباق تصاویر گزارش دادند که این جلسه پس از حمله به ساختمان اصلی خبرگان، در مرکز همایش باغ موزه دفاع مقدس قم برگزار شده است. بررسی‌های بی‌بی‌سی هم از انطباق تصاویر با مرکز همایش باغ موزه دفاع مقدس قم حکایت دارد. در این ویدئو برخی از اعضای مجلس خبرگان دیده می شوند و به نظر می‌رسد محمدعلی موحدی کرمانی، سیدهاشم حسینی بوشهری، عباس کعبی‌نسب و محسن اراکی در جایگاه ریاست جلسه نشسته‌اند. در لحظه اعلام نتایج آرا به نظر می‌رسد عباس کعبی‌نسب، نماینده خوزستان، منشی اول هیئت رئیسه می‌گوید: «حضرت آیت‌الله سیدمجتبی خامنه‌ای با اکثریت بیش از دو سوم آرای حاضران به عنوان رهبر آینده معرفی شد.» در این جلسه، علیرضا اعرافی، نایب رئیسه دوم مجلس خبرگان که گفته می‌شود یکی از گزینه‌های رهبری بود، در جایگاه هیئت رئیسه حضور ندارد. علیرضا اعرافی در آن زمان یکی از سه عضو شورای موقت رهبری است. از ۸۸ عضو مجلس خبرگان رهبری در مجموع ۵۹ در این جلسه حضور داشتند که گفته شد ۴۹ نفر به مجتبی خامنه‌ای رای دادند. محسن حیدری آل کثیر، نماینده استان خوزستان در خبرگان، گفته بود آقای اعرافی هم در این جلسه هشت رای آورده بود. در این جلسه یک رای هم باطله اعلام شد. گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/0ad4/live/daac08d0-e819-11f1-ab42-55d8d8278025.jpg", "category": "امنیت سایبری و شبکه", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۳ آذر • ۲۰:۴۳"}, {"source": "Iran International", "title": "حمله حوثی‌های یمن به برجی در منطقه مالی ریاض ۱۱ زخمی بر جا گذاشت", "link": "https://www.iranintl.com/202611249422", "summary": "به‌گفته مقام‌های سعودی، در حمله حوثی‌های مورد حمایت جمهوری اسلامی به برجی در منطقه مالی ریاض،  امنیتشان در اختیار نیروهای کرد بوده است. مخالفت اربیل و برکناری مقام‌های عراقی مسرور بارزانی، نخست‌وزیر اقلیم کردستان، دستور الزیدی را «غیرقابل قبول» خواند و گفت این تصمیم با مذاکرات پیشین اربیل و بغداد مغایرت دارد. او گفت دولت اقلیم تصمیم‌هایی را که مغایر قانون اساسی عراق بداند، نمی‌پذیرد. الزیدی و بارزانی دو هفته پیش در بغداد درباره مدیریت میدان‌های نفتی، درآمدهای نفتی و غیرنفتی، سهم اقلیم از بودجه فدرال سال ۲۰۲۷ و حقوق کارکنان بخش دولتی گفت‌وگو کرده بودند. در توافق امنیتی سپتامبر هم پیش‌بینی شده بود گذرگاه‌های رسمی با مدیریت مشترک باز بمانند و گذرگاه‌های غیرمجاز بسته شوند. دستور سه‌شنبه اداره گذرگاه‌ها را به یک نهاد فدرال می‌سپارد. تصمیم الزیدی پس از بررسی گزارش کمیته تحقیق درباره قاچاق نفت در شرکت دولتی نفت شمال اعلام شد. او رئیس هیئت گذرگاه‌های مرزی عراق، فرمانده عملیات کرکوک و رئیس پلیس این استان را برکنار کرد. مدیر شرکت نفت شمال و معاونانش هم از کار معلق شدند و پرونده به دستگاه قضایی ارجاع شد. Read More This section contains relevant reference points, placed in (Inn", "date_str": "2026-11-24T14:18:29+00:00", "hash": "659e6f1440f039b2", "title_fa": "از جرف‌الصخر تا مرزهای اقلیم کردستان؛ بغداد کنترل نفت و گذرگاه‌ها را گسترش می‌دهد", "summary_fa": "علی فالح الزیدی، نخست‌وزیر عراق، سه‌شنبه سوم آذر دستور داد دولت فدرال اداره تمام گذرگاه‌های مرزی اقلیم کردستان را به دست بگیرد و وزارت نفت عراق مدیریت میدان‌های نفتی فدرال تحت حفاظت نیروهای کرد در چهار استان را بر عهده بگیرد. این دستور چهار روز پس از ورود نیروهای دولتی به جرف‌الصخر، پایگاه اصلی کتائب حزب‌الله در استان بابل صادر شده است. هر دو اقدام در پی تحقیقات درباره قاچاق نفت انجام شده است و دامنه مداخله مستقیم بغداد در حفاظت از زیرساخت‌های نفتی و نظارت بر مسیرهای انتقال فرآورده‌های نفتی را گسترش می‌دهد. صباح النعمان، سخنگوی فرمانده کل نیروهای مسلح عراق، امروز اعلام کرد که بر اساس دستور نخست‌وزیر، هیئت فدرال گذرگاه‌های مرزی اداره همه گذرگاه‌های اقلیم را بر عهده می‌گیرد. فرماندهی مرزبانی هم موظف شده است گذرگاه‌های غیررسمی در امتداد مرزهای بین‌المللی عراق، از جمله در اقلیم کردستان را ببندد. دستور مربوط به میدان‌های ers have opted to label AI-generated content on their platforms, and until now, Tidal was one of them. However, the company is about to take a harder stance. Tidal announced that in the coming weeks, it will fully ban AI music because of the harm it does to human artists. Tidal debuted its initial AI policy in July 2026, which included labeling and demonetizing all songs created entirely with AI. That wasn't enough to stem the tide of AI slop, though. Over the past 90 days, Tidal reports that 43 percent of new uploads were completely AI-generated. On November 6, new uploads to Tidal hit a whopping 60 percent AI-generated. As things stand, Tidal hosts 27 million tracks labeled as AI, all of which were obviously added in the past couple of years. That accounts for 6.3 percent of Tidal's total catalog. On December 9, Tidal will delete all those songs. The streamer notes this will have essentially no negative impact because 96 percent of AI-labeled tracks got zero plays in the past 90 days. Throughout its announcement, Tidal is careful to stipulate that it's only talking about music that has been fully created by AI. Artists can still use AI tools as long as the final product contains human elements. Read full article Comments", "date_str": "2026-11-24T17:34:34+00:00", "hash": "6286c3c0d9c366e6", "title_fa": "Tidal ممنوعیت موسیقی تولید شده توسط هوش مصنوعی را اعلام کرد. 27 میلیون تراک حذف خواهد شد", "summary_fa": "اکثر ارائه دهندگان پخش موسیقی ترجیح داده اند محتوای تولید شده با هوش مصنوعی را روی پلتفرم های خود برچسب گذاری کنند و تا کنون، Tidal یکی از آنها بود. با این حال، این شرکت قرار است موضع سخت تری اتخاذ کند. Tidal اعلام کرد که در هفته‌های آینده، موسیقی هوش مصنوعی را به دلیل آسیب‌هایی که به هنرمندان انسان وارد می‌کند، به طور کامل ممنوع خواهد کرد. Tidal سیاست اولیه هوش مصنوعی خود را در ژوئیه 2026 آغاز کرد که شامل برچسب زدن و غیرفعال کردن تمام آهنگ‌هایی بود که کاملاً با هوش مصنوعی ایجاد شده بودند. با این حال، این برای جلوگیری از روند شیب هوش مصنوعی کافی نبود. طی 90 روز گذشته، Tidal گزارش می دهد که 43 درصد از آپلودهای جدید کاملاً با هوش مصنوعی تولید شده اند. در 6 نوامبر، آپلودهای جدید در Tidal به 60 درصد از هوش مصنوعی دست یافتند. همانطور که همه چیز وجود دارد، Tidal میزبان 27 میلیون آهنگ با برچسب هوش مصنوعی است که همه آنها به وضوح در چند سال گذشته اضافه شده اند. این 6.3 درصد از کل کاتالوگ Tidal را تشکیل می دهد. در 9 دسامبر، Tidal همه آن آهنگ ها را حذف خواهد کرد. پخش کننده یادآور می شود که این اساساً هیچ تأثیر منفی نخواهد داشت زیرا 96 درصد از آهنگ های دارای برچسب هوش مصنوعی در 90 روز گذشته پخش صفر داشته اند. Tidal در سراسر اعلامیه خود مراقب است که قید کند که فقط در مورد موسیقی صحبت می کند که به طور کامل توسط هوش مصنوعی ایجاد شده است. تا زمانی که محصول نهایی حاوی عناصر انسانی باشد، هنرمندان همچنان می توانند از ابزارهای هوش مصنوعی استفاده کنند. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/GettyImages-1083228790-2560x1440.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۳ آذر • ۲۱:۰۴"}, {"source": "Engadget", "title": "How much does it cost to replace an out-of-warranty Tesla battery?", "link": "https://www.engadget.com/2321241/how-much-replace-tesla-battery-out-of-warranty/", "summary": "Check out what goes into a Tesla battery bill beyond the pack itself, and know when a repair, a refurbished pack or extra coverage makes sense for you.", "date_str": "2026-11-24T17:45:00+00:00", "hash": "927092cf0b7d6ecd", "title_fa": "هزینه تعویض باتری تسلا بدون گارانتی چقدر است؟", "summary_fa": "بررسی کنید که چه چیزی در قبض باتری تسلا فراتر از بسته بسته می شود و بدانید که تعمیر، بسته بازسازی شده یا پوشش اضافی چه زمانی برای شما منطقی است. باتری تسلا می تواند سال ها فراتر از گارانتی آن دوام بیاورد، اما تعویض آن پس از اتمام پوشش ممکن است بیش از 20000 دلار هزینه داشته باشد. BBRDRVN/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover داشتن مالک تسلا مطمئناً باعث می‌شود که ظاهری جذاب و دوست‌دار محیط‌زیست داشته باشید، به‌ویژه در مقایسه با خودروی گازسوز همسایه‌تان. اما تمام این هیجان زمانی که خودروی الکتریکی مسافت قبلی را طی نمی کند و تعویض باتری در کارت ها احساس می شود شروع به محو شدن می کند. استفاده از تسلا با گارانتی منقضی شده می‌تواند اعصاب‌تان را به هم بزند، به‌ویژه به این دلیل که هزینه تعویض باتری می‌تواند از ۱۲۶۰۰ دلار تا بیش از ۲۰ هزار دلار باشد. اینکه در نهایت چقدر می پردازید بستگی به مدل ماشین شما و قطعات دیگری که نیاز به تعمیر یا تعویض دارند دارد، اما تسلا نمودار قیمتی برای آماده شدن برای سفر گران قیمت پیش رو به شما ارائه نمی دهد. مسئله این است که تخریب باتری فقط یک شیمی اولیه است، بنابراین از دست دادن چند مایل برد با افزایش سن نباید شما را شگفت‌زده کند، حتی اگر از علل اصلی آسیب باتری خودروهای برقی اجتناب کنید. این دقیقاً نشانه ای نیست که شما نگران تعویض کامل باتری باشید. گزارشی در سال 2025 از Recurrent به طور کلی بیش از 30000 خودروی برقی را بررسی کرد و کمتر از 4 درصد آنها تا کنون نیاز به تعویض باتری داشته اند، البته به استثنای فراخوان های عمده. داده‌های مکرر استفاده شده از چندین سازنده و سال‌های مدل مختلف، بنابراین دقیقاً یک نرخ خرابی خاص تسلا نیست. Phaitoons/Getty Images در حالی که", "image_url": "https://www.engadget.com/img/gallery/how-much-does-it-cost-to-replace-an-out-of-warranty-tesla-battery/l-intro-1794923761.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۳ آذر • ۲۱:۱۵"}, {"source": "Zoomit", "title": "پاک‌سازی بزرگ تایدل؛ رقیب معروف اسپاتیفای ۲۹ میلیون آهنگ هوش مصنوعی را حذف می‌کند", "link": "https://www.zoomit.ir/ai-articles/471795-tidal-ban-remove-29-million-ai-generated-songs/", "summary": "تایدل اعلام کرد ۲۹ میلیون آهنگ ساخته‌شده با هوش مصنوعی را حذف می‌کند.", "date_str": "2026-11-24T17:50:08+00:00", "hash": "ec54980db662a58f", "title_fa": "پاک‌سازی بزرگ تایدل؛ رقیب معروف اسپاتیفای ۲۹ میلیون آهنگ هوش مصنوعی را حذف می‌کند", "summary_fa": "تایدل اعلام کرد ۲۹ میلیون آهنگ ساخته‌شده با هوش مصنوعی را حذف می‌کند. تبلیغات سرویس استریم موسیقی تایدل (Tidal) از ۹ دسامبر ۲۰۲۶ (۱۸ آذر ۱۴۰۵) فرایند حذف آثار موسیقی تولیدشده با هوش مصنوعی را آغاز می‌کند. شرکت انتظار دارد تا پایان سال میلادی حدود ۲۹ میلیون قطعه از فهرست موسیقی‌های این سرویس حذف شوند. تایدل همچنین اعلام کرده است که پس از اجرای سیاست جدید، روزانه بین ۸۰ تا ۸۵ هزار قطعه‌ی موسیقی ساخته‌شده با هوش مصنوعی را پیش از انتشار رد خواهد کرد. آمار منتشرشده از سوی تایدل نشان می‌دهد که در ۹۰ روز گذشته، حدود ۴۳ درصد از موسیقی‌های ارسال‌شده به این پلتفرم، کاملاً با هوش مصنوعی ساخته شده‌اند. این وضعیت در بعضی روزها شدیدتر بوده است؛ به‌طوری‌که در اواسط ماه گذشته، سهم آهنگ‌های هوش مصنوعی از کل آثار دریافتی تایدل به بیش از ۶۰ درصد رسید. درحال‌حاضر، حدود ۲۷ میلیون قطعه در فهرست تایدل دارای برچسب تولیدشده با هوش مصنوعی هستند که معادل ۶٫۳ درصد از کل آثار موجود در این سرویس است. اما نکته‌ی جالب به میزان استقبال شنوندگان برمی‌گردد. براساس آمار تایدل، ۹۶ درصد از قطعات دارای برچسب هوش مصنوعی در سه ماه گذشته حتی یک‌بار هم پخش نشده‌اند. به‌گفته‌ی این شرکت، انتشار انبوه چنین آثاری باعث شده است پیدا‌کردن موسیقی‌های واقعی و هنرمندان موردعلاقه برای کاربران دشوارتر شود. محدودیت جدید تایدل شامل تمام آهنگ‌هایی که در مراحل تولیدشان از هوش مصنوعی استفاده شده، نخواهد شد. براساس سیاست اعلام‌شده، آثاری که هنرمندان در ساخت آن‌ها از ابزارهای هوش مصنوعی کمک گرفته‌اند، همچنان می‌توانند در پلتفرم منتشر شوند؛ مشروط بر اینکه موسیقی، خروجی کاملاً تولیدشده‌ی یک ابزار هوش مصنوعی نباشد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری مبین احمدی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/tidal-music-app-smartphone-6b05cdcd1f4c677d1df59ed1?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۳ آذر • ۲۱:۲۰"}, {"source": "Zoomit", "title": "رکوردشکنی در سایه ال‌نینو؛ زمین بالاترین ناهنجاری یک‌روزه دما را تجربه کرد", "link": "https://www.zoomit.ir/energy-environment/471794-earth-saw-most-hot-day-ever-record/", "summary": "درحالی‌که ال‌نینوی قدرتمند کنونی هنوز به اوج خود نرسیده است، رکورد بیشترین ناهنجاری دمایی زمین در ۲۰ نوامبر ۲۰۲۶ ثبت شد.", "date_str": "2026-11-24T17:50:00+00:00", "hash": "1592bbcce370938e", "title_fa": "رکوردشکنی در سایه ال‌نینو؛ زمین بالاترین ناهنجاری یک‌روزه دما را تجربه کرد", "summary_fa": "درحالی‌که ال‌نینوی قدرتمند کنونی هنوز به اوج خود نرسیده است، رکورد بیشترین ناهنجاری دمایی زمین در ۲۰ نوامبر ۲۰۲۶ ثبت شد. تبلیغات زمین به‌تازگی شدیدترین ناهنجاری دمایی ثبت‌شده در یک روز را از زمان آغاز اندازه‌گیری‌ها تجربه کرد. براساس داده‌های اولیه سرویس تغییرات اقلیمی کوپرنیک (C3S)، مستقر در اروپا، جمعه ۲۰ نوامبر ۲۰۲۶، دمای زمین ۲٫۱۲ درجه سانتی‌گراد بالاتر از میانگین دوران پیشاصنعتی بود؛ یعنی دورانی که انسان‌ها هنوز سوزاندن سوخت‌های فسیلی را آغاز نکرده بودند. این رکورد جدید حاصل ترکیب تغییرات اقلیمی بلندمدت ناشی از فعالیت انسان و پدیده ال‌نینوی بسیار قدرتمندی است که احتمالاً شدیدترین نمونه آن در هزار سال گذشته به شمار می‌رود. این اتفاق در حالی رخ می‌دهد که مذاکرات بین‌المللی در اجلاس اقلیمی COP31 به بن‌بست رسیده و کشورها نتوانسته‌اند بر سر راهکاری جهانی برای مهار گرمایش زمین به توافق برسند. با تشدید ال‌نینو و رسیدن آن به اوج خود در طول حدود یک ماه آینده، احتمالاً روزهای بیشتری را تجربه خواهیم کرد که دمای زمین در آن‌ها دست‌کم ۲ درجه سانتی‌گراد بالاتر از میانگین پیشاصنعتی باشد. همچنین انتظار می‌رود که در چند ماه آینده نیز رکوردهای گرمایی جدید ثبت شوند. احتمال دارد سال ۲۰۲۶ با پشت سر گذاشتن سال ۲۰۲۴، به گرم‌ترین سال ثبت‌شده در تاریخ تبدیل شود زکری لیب، دانشمند مؤسسه غیرانتفاعی پژوهشی «کلایمت سنترال»، می‌گوید : «فکر می‌کنم در طول چند ماه آینده (احتمالاً تا مارس ۲۰۲۷) روزهای بیشتری را خواهیم دید که دمای زمین در آن‌ها از ۲ درجه سانتی‌گراد بالاتر از میانگین پیشاصنعتی فراتر رود؛ هرچند همچنان انتظار دارم چنین روزهایی در مقایسه با تمام روزهای سال، پدیده‌ای نادر باشند، نه وضعیتی معمول.» پیش‌بینی می‌شود دمای زمین در هر دو سال ۲۰۲۶ و ۲۰۲۷ بیش از ۱٫۵ درجه سانتی‌گراد بالاتر از سطح پیشاصنعتی باشد؛ آستانه‌ای که تاکنون تنها در سال ۲۰۲۴ از آن عبور شده است.", "image_url": "https://api2.zoomit.ir/media/girl-drinking-water-under-sun-6b05 ving my own space, so I got an apartment in Elizabeth City, North Carolina , just a 35-minute drive from my hometown. At first, having my independence back felt great. But before long, loneliness crept in. Sure, I was close to my loved ones, but I didn't have a built-in group of friends nearby. Most days, I fell into the same routine: work, sleep, then spend weekends with family. I missed having people to call for a last-minute drink, a fitness class, or something new to do. Because I wasn't in Chicago anymore, I worried my life was destined to be boring. Elizabeth City is much smaller, with fewer than 20,000 residents, compared to Chicago's almost 3 million. I no longer had easy access to nationally acclaimed shows, large festivals, or trendy restaurants, either. I knew I needed to find a way to meet people and bring more energy, fulfillment, and socializing into my life outside my 9-to-5. So, I decided to try getting a weekend service job where I'd be able to meet lots of new people. Taking a weekend job at a brewery helped me find the community I was missing Taking this bartending job introduced me to a wonderful group of coworkers and customers who I now call friends. Abigail Ali I hadn't worked in the service industry before, but I thought the experience could put me face-to-face with locals and, hopefully, expose me to more of what my city has to offer. When deciding which establishment to apply to, I chose a local downtown brewery, mainly because it was close to my apartment and seemed like an easy spot to meet other people in their mid-20s. On my first night working a full shift, the brewery was packed with a line from the bar to the door the whole time. Luckily, my time liv", "date_str": "2026-11-24T17:31:01+00:00", "hash": "8556854b969b97b5", "title_fa": "فکر می کردم رفتن به یک شهر کوچکتر زندگی اجتماعی من را برای همیشه خراب می کند. گرفتن یک شغل پاره وقت آن را بهتر از همیشه کرد.", "summary_fa": "پس از نقل مکان به یک شهر کوچک، یافتن یک شغل پاره وقت راهی عالی 1% on Monday, adding nearly $1 trillion to its market capitalization, after cofounder Jensen Huang was reinstated as CEO. He'd resigned less than two weeks prior following reports that he had extramarital affairs with a woman accused of being a Chinese spy (China has denied those allegations) and a direct subordinate. \"The rational market crowd is taking the month off,\" Gordon, an entrepreneurship professor who researches financial markets and technology at the University of Michigan's Ross School of Business, told Business Insider. Nvidia's market cap cratered by nearly $3 trillion, or almost 50%, between October 6 and November 20. Investors were reacting to not only the snowballing Huang scandal, but also rising fears that the debt-fueled AI infrastructure boom would end in disaster, newly elected Democratic lawmakers would curb the data-center buildout, and stubborn inflation would prompt higher interest rates. The huge swings in Nvidia stock after Huang's departure and return show the company's market value has \"little to do\" with its business and \"everything to do\" with its leader, Gordon said, drawing a parallel to Tesla and Elon Musk . As Business Insider's Alistair Barr wrote in a column yesterday, Huang's reinstatement was a rare chance for investors to put a clear dollar value on a CEO. Gordon said that a rational Nvidia investor \"should now price in the risk if Huang has a heart attack, or is tossed back out\" once President Donald Trump, who urged Nvidia's board to reinstate Huang, leaves the White House. \"I have witnessed corporate governance and misgovernance, political pressure on CEOs and boards from Presidents and members of Congress,\" Gordon said. \"I've seen fire and I've seen rain. But I haven't seen th", "date_str": "2026-11-24T17:16:59+00:00", "hash": "a13b551adb6d7011", "title_fa": "گوروی فناوری می‌گوید سهام انویدیا دارای سایه‌هایی از لاله‌های هلندی و Bored Ape NFT است", "summary_fa": "جنسن هوانگ به عنوان مدیرعامل انویدیا بازگردانده شد. Jens Kalaene/تصویر اتحاد از طریق Getty Images، اریک گوردون می‌گوید ارزش بازار انویدیا «ارتباط کمی» با تجارت آن و «همه چیز» با جنسن هوانگ دارد. گوردون به Business Insider گفت که این سهام به اندازه لاله های هلندی و NFT ها از واقعیت جدا هستند. او گفت که سرمایه‌گذاران اکنون که ارزش او را می‌دانند باید ریسک خروج هوانگ دیگر را ارزیابی کنند. گل های پر جنب و جوش. میمون های کارتونی. سهام انویدیا؟ اریک گوردون با اشاره به شیدایی گل لاله در دهه 1600 و شور و شوق در مورد محصولات کلکسیونی دیجیتال در طول همه‌گیری COVID-19، می‌گوید: ارزش بازار سازنده تراشه‌های هوش مصنوعی «همان ارتباطی با واقعیت اقتصادی دارد که لامپ‌های لاله هلندی و Bored Ape NFT داشتند». سهام انویدیا در روز دوشنبه 31 درصد افزایش یافت و نزدیک به 1 تریلیون دلار به ارزش بازار آن افزود، پس از آن که جنسن هوانگ یکی از بنیانگذاران آن به عنوان مدیرعامل بازگردانده شد. او کمتر از دو هفته قبل به دنبال گزارش هایی مبنی بر داشتن روابط خارج از ازدواج با زنی که متهم به جاسوسی چینی (چین این اتهامات را رد کرده است) و زیردستان مستقیم استعفا داده بود. گوردون، استاد کارآفرینی که در مورد بازارهای مالی و فناوری در دانشکده بازرگانی راس دانشگاه میشیگان تحقیق می‌کند، به Business Insider گفت: «جمعیت منطقی بازار، ماه را تعطیل می‌کند». ارزش بازار انویدیا بین 6 اکتبر و 20 نوامبر نزدیک به 3 تریلیون دلار یا تقریبا 50 درصد کاهش یافت. سرمایه گذاران نه تنها به رسوایی گلوله برفی هوانگ، بلکه نگرانی فزاینده مبنی بر اینکه رونق زیرساخت های هوش مصنوعی ناشی از بدهی به فاجعه ختم شود، قانونگذاران تازه انتخاب شده دموکرات باعث کاهش بهره بیشتر از داده ها شوند، واکنش نشان می دهند. نرخ ها گوردون گفت که نوسانات عظیم", "image_url": "https://i.insider.com/6b059007d6c5d341c9b4c97a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه", "بورس و طلا"], "datetime_fa": "۳ آذر • ۲۰:۴۶"}, {"source": "Business Insider", "title": "Sony says 'GTA 6' players logged nearly 78,000 years of PlayStation time in 4 days", "link": "https://www.businessinsider.com/gta-6-playstation-logged-nearly-78k-years-on-ps5-2026-11", "summary": "Grand Theft Auto 6 is the first full reboot of the franchise in 13 years. Rockstar Games \"GTA 6\" launched less than a week ago. The release has been record-breaking. Sony says PlayStation users logged 683 million hours, or 77,968 years. The game — which follows two Bonnie-and-Clyde-style romancers — received rave reviews. \"Grand Theft Auto\" fans waited more than a decade for a brand-new game. It finally launched last week, and players are playing the heck out of it. On Monday, Sony, the maker of PlayStation consoles, published a letter thanking fans for making \"GTA 6\" the \"biggest launch in PlayStation history.\" Sony said the game recorded the highest number of concurrent players in the console's history. On PlayStation 5 alone, between November 19 and November 22, gamers logged 683 million hours of \"GTA 6\" gameplay, the company reported. That's roughly 77,968 years, or about one-quarter of the time Homo sapiens have been on Earth. Players averaged 17.4 hours in those four days, per Sony. Those numbers capture just a piece of \"GTA 6's\" record launch. The game was also released on Xbox Series S and X. \"The excitement and passion of the community have made this a truly special moment for all of us,\" Sony wrote. \"GTA 6\" shattered entertainment records . It generated an estimated $3.79 billion on November 19 alone, publisher Take-Two Interactive reported. That's roughly $1.3 billion more than \"Spider-Man: Brand New Day's\" entire box office, and more than double \"The Odyssey's\" $1.8 billion theatrical release. Like its predecessors, \"GTA 6\" follows criminals — but its main characters, Jason and Lucia, begin as down-on-their-luck lovers who resort to crime to get by. The game asks players to take on tasks from fighting drug kings and stealing cars to fixing a dilapidated home's drywall . It still keeps a lot of the themes that have made \"Grand Theft Auto\" a popular franchise for generations. For example, it continues to skewer some aspects of American society, like our reliance on time-sucking phone apps . The game — Rockstar's first mainline \"Grand Theft Auto\" installment since \"GTA 5\" in 2013 — has received rave reviews from streamers and major tech publications. The positive initial reviews sent Take-Two Interactive's stock spiking 6% last Wednesday, the day before its release. The sales momentum could easily extend into next year — it has a highly anticipated PC launch, likely coming in early 2027. Read the original article on Business Insider", "date_str": "2026-11-24T17:11:34+00:00", "hash": "5db1ab67379e2349", "title_fa": "سونی می‌گوید بازیکنان «GTA 6» تقریباً 78000 سال از زمان پلی‌استیشن را در 4 روز ثبت کردند.", "summary_fa": "Grand Theft Auto 6 اولین راه‌اندازی کامل این فرنچایز در 13 سال گذشته است. بازی Rockstar \"GTA 6\" کمتر از یک هفته پیش راه اندازی شد. انتشار رکورد شکنی بوده است. سونی می گوید کاربران پلی استیشن 683 میلیون ساعت یا 77968 سال ثبت نام کرده اند. این بازی - که به دنبال دو عاشق به سبک بانی و کلاید است - نقدهای مثبتی دریافت کرد. طرفداران \"Grand Theft Auto\" بیش از یک دهه منتظر یک بازی کاملاً جدید بودند. بالاخره هفته گذشته راه اندازی شد و بازیکنان در حال بازی کردن هستند. روز دوشنبه، سونی، سازنده کنسول‌های پلی‌استیشن، نامه‌ای منتشر کرد که در آن از طرفداران به خاطر تبدیل «GTA 6» به «بزرگ‌ترین عرضه در تاریخ پلی‌استیشن» تشکر کرد. سونی اعلام کرد که این بازی بیشترین تعداد بازیکن همزمان را در تاریخ کنسول ثبت کرده است. این شرکت گزارش داد که تنها در پلی استیشن 5، بین 19 نوامبر تا 22 نوامبر، گیمرها 683 میلیون ساعت از گیم پلی \"GTA 6\" را ثبت کردند. این تقریباً 77968 سال یا تقریباً یک چهارم زمانی است که انسان‌های خردمند روی زمین بوده‌اند. به ازای هر سونی، بازیکنان در آن چهار روز به طور متوسط ​​17.4 ساعت کار کردند. این اعداد تنها بخشی از رکورد راه اندازی \"GTA 6\" را نشان می دهد. این بازی همچنین برای Xbox Series S و X منتشر شد. سونی نوشت: \"هیجان و شور جامعه باعث شده است که این لحظه واقعاً ویژه ای برای همه ما باشد.\" \"GTA 6\" رکوردهای سرگرمی را شکست. ناشر Take-Two Interactive گزارش داد که تنها در 19 ن ی آفلاین. و برای درایوهای طولانی‌تر، می‌توانید گوشی را وصل کنید تا شارژ خود را حفظ کرده و آن را از نور مستقیم خورشید دور نگه دارید، در حالت ایده‌آل در نزدیکی دریچه تهویه مطبوع به خنک ماندن آن کمک می‌کند. Alon Alexander/Shutterstock گوگل گفته است که مدیریت گرما یکی از دلایل اصلی محدود کردن پیکسل 10 و پیکسل 10 پرو در شارژ بی‌سیم 15 واتی بوده است،", "image_url": "https://www.engadget.com/img/gallery/wireless-android-auto-has-a-phone-battery-draining-problem-but-you-can-fix-it/l-intro-1795024197.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "تراشه", "موسیقی"], "datetime_fa": "۳ آذر • ۲۰:۱۵"}, {"source": "Business Insider", "title": "President Trump helped reinstate Nvidia CEO Jensen Huang. Here's a complete timeline of their short but close relationship.", "link": "https://www.businessinsider.com/relationship-timeline-donald-trump-jensen-huang-2026-11", "summary": "US President Donald Trump with Nvidia CEO Jensen Huang at a White House event in April 2025. Andrew Harnik/Getty Images President Donald Trump said Monday that he convinced Nvidia's board to reinstate Jensen Huang. The two met for the first time in January 2025 but have had a close relationship ever since. So, how did we get here? Jensen Huang is officially back as Nvidia's CEO . And President Donald Trump told multiple outlets on Monday that he had a role in his reinstatement, saying he helped persuade Nvidia's board to bring him back. Huang resigned as CEO and from the board following an extramarital affair scandal , including with a woman suspected of having ties to Chinese intelligence. Huang's return has also brought renewed attention to his relationship with the president. Since they first met nearly two years ago, their relationship has become more visible, with the two appearing to maintain increasingly close ties. Here is a timeline of the relationship between Trump and Huang. January 31, 2025: Donald Trump and Jensen Huang meet for the first time. Huang and President Trump at the White House on April 30, 2025. JIM WATSON/AFP via Getty Images Trump and Huang first met on January 31, 2025, according to The Wall Street Journal . The meeting came shortly after Chinese AI company DeepSeek released a model that sent shockwaves through the US tech industry and sent Nvidia's shares plunging. However, the meeting was planned long before that, the Journal reported. Trump said that Huang was a \"gentleman\" and that \"it was a good meeting,\" Reuters reported. April 4, 2025: Huang attends a $1 million-per- head dinner at Mar-a-Lago. Trump arrives at Miami International Airport on April 3, 2025. MANDEL NGAN/AFP via Getty Images NPR reported that the administration was expected to enforce export restrictions on Nvidia's H20 AI chips to China, but that following the Mar-a-Lago dinner, this was held off. This hold-up lasted only a few days , and limits were imposed, per CNBC. April 30, 2025: Huang says he wants the Trump administration to change course on AI chip exports. Trump and Huang at an event at the White House on April 30, 2025. Andrew Harnik/Getty Images Bloomberg reported that prior to an Investing in America event at the White House, Huang told reporters that \"we need to accelerate the diffusion of American AI technology around the world\" and \"the policies and encouragement from the administration really need to support that.\" Nvidia had said earlier in ", "date_str": "2026-11-24T16:58:57+00:00", "hash": "4c89d95099795497", "title_fa": "پرزیدنت ترامپ به بازگرداندن جنسن هوانگ، مدیرعامل انویدیا کمک کرد. در اینجا جدول زمانی کاملی از رابطه کوتاه اما نزدیک آنها آورده شده است.", "summary_fa": "دونالد ترامپ، رئیس‌جمهور ایالات متحده و جنسن هوانگ، مدیرعامل انویدیا در رویدادی در کاخ سفید در آوریل 2025. اندرو هارنیک/گتی ایماژ، رئیس‌جمهور دونالد ترامپ، دوشنبه گفت که هیئت‌مدیره انویدیا را متقاعد کرده است که جنسن هوانگ را بازگرداند. این دو برای اولین بار در ژانویه 2025 ملاقات کردند اما از آن زمان تاکنون رابطه نزدیکی با هم داشتند. پس چگونه به اینجا رسیدیم؟ جنسن هوا mpkin in pies, cakes, and muffins. Though you may only associate it with holiday pies or spiced lattes, pumpkin is actually a versatile fruit that shines in a variety of sweet and savory dishes. When using pumpkin in the kitchen, many opt for the canned stuff. Fortunately, canned pumpkin can be an accessible ingredient that elevates all sorts of dishes, drinks, and desserts. However, some recipes benefit from using fresh pumpkin — even if a little more chopping and prep is required. For a little help on deciding which route to take, Business Insider asked chefs to share their favorite and least favorite ways to use canned pumpkin. Use canned pumpkin to elevate mac and cheese. Haruna_cchi / Shutterstock Chef and culinary consultant Clare Langan told Business Insider that she likes to put canned pumpkin in mac and cheese. \"Just stir canned pumpkin into the cheese sauce with freshly chopped fresh rosemary, thyme, or sage,\" Langan said. \"Add some freshly grated nutmeg and voilà.\" Langan said she suggests using more robust cheeses , such as Gruyère or sharp cheddar, when making pumpkin mac and cheese. It can be used as a substitute for eggs in bread. Teri Virbickis / Shutterstock New York City-based pastry chef Tracy Wilk said that canned pumpkin can be used as a vegan-friendly egg substitute in many quick bread recipes. \"You can use a quarter cup of canned pumpkin for each egg your bread recipe calls for,\" Wilk said. \"It adds delicious nutrients and a slight pumpkin flavor.\" Wilk especially recommends trying pumpkin as an egg replacer in zucchini bread. Pumpkin butter is an indulgent spread that s fairly easy to make at home. Teri Virbickis / Shutterstock \" Make pumpkin butter by simmering canned pumpkin with maple syrup or brown sugar, and then add a few tablespoons of butter and a dash of pumpkin-pie spice,\" Langan said. Cool the mixture and store it in the fridge. It's pretty versatile: spread it on toast, dip apples into it, or swirl it into oatmeal. Use i  with and move through. With the recently launched Genie 4 update , this tool is purportedly even more powerful. It now allows you to request live edits (like \"make it snow\") and incorporate sound and dialog into your prompts. Google is also promising more realistic physics and natural movements in its renderings. These promises point to the future of AI in all kinds of ways from robotics to world sims but the tool requires a lot of computing power, and access is limited for the time being. You can dive in now if you're on one of the Google AI Ultra plans ($99.99 or $199.99 a month), or join the waitlist if you're a Google AI Pro user ($19.99 a month). But if you've got access, is it worth the effort (and money)? I put it to the test. What Google says you can do with Genie 4 It's no exaggeration to say you can build an entire virtual world in Google Genie. It's going to be a more basic, less developed, and more chaotic world than the one in, say, GTA 6 , but you can do it. Think of it like generating an AI video from a prompt, but you can then walk through the video and go as deep as you like, taking turns along the way. Everything is rendered in real time, at a resolution of 720p and at 24 frames per second. That's not to say the engine is storing a massive 3D map in memory, however after a minute or so, it's going to start to forget the places you've already seen. And while the basic layout will stay fixed, you might notice disappearing trees or changing colors. Walking with the dinosaurs in Genie. Credit: Lifehacker Google's official line is \"visual details and object permanence can still shift or drift over time\" in Genie 4, so it's a known limitation. The tool is presented as-is, with the intention to develop it further over time as models improve, and it's aimed at filmmakers, historians, designers, scientists, robotics engineers, and game developers. Or indeed, anyone who just wants to get lost in a world that isn't real. Some of the demos you'll find as  retail investor who bought NVDA shares last week is up around 11% today (from being down 15% at Friday's close).\" Patel noted that throughout the Nvidia turmoil that led to Huang's resignation, retail traders were major dip-buyers, adding $1.12 billion in Nvidia shares last week. When it came to last week's other big event, individual investors were less enthusiastic. While retail traders were ready for the Anthropic IPO, the Claude maker's historic offering couldn't unseat SpaceX as retail investors' most-bought IPO stock. In fact, Vanda's data shows Anthropic didn't even come in second in terms of retail buying on IPO day, finishing behind both SpaceX and Coinbase . The cohort's strategy shifted on Monday when Anthropic started trending downward as Nvidia surged. Patel noted that retail enthusiasm for the newly minted ANT stock was on par with Nvidia for most of the day, even as the stock slumped. \"Anthropic is the other big winner from the return of Jensen — it is the second-most bought stock by retail today,\" he stated. \"While net retail buying in ANT didn't break any IPO records, activity picked up on Friday to $98mn (vs. $60mn last Thursday when the stock listed).\" Patel also flagged another indicator that suggests retail has maintained a risk-on stance during the latest stretch of volatility. On top of piling into Nvidi", "date_str": "2026-11-24T16:06:02+00:00", "hash": "340e5895483643f3", "title_fa": "از عرضه اولیه عمومی سهام آنتروپیک تا بازگشت هوانگ، در اینجا آمده است که چگونه خرده فروشی ها بازارهای بی نظم را معامله کرده اند.", "summary_fa": "مردم در Nasdaq MarketSite مشاهده می کنند که سهام آنتروپیک پس از عرضه اولیه اولیه خود شروع به معامله می کند. استفانی کیث/نورعکس از طریق گتی ایماژ این روزها بازار میدان مین کاتالیزورهای خوب و بد بوده است. معامله گران خرده فروشی نوسانات گسترده ای را در مورد عرضه اولیه عمومی سهام آنتروپیک و بازگشت جنسن هوانگ انجام دادند. واندا ریسرچ گفت که تاجران خرده‌فروشی خریداران بزرگ انویدیا قبل از رالی روز دوشنبه بودند. تاجران خ ion to gain access to its Delta system. Delta creates a unified battlefield picture for units, helping them find and strike targets faster. It's another sign of Ukraine's shift from aid recipient to a military partner Western allies want to learn from. Ukraine intends to share its Delta battlefield management system with Germany, marking another step in the country's transition from a recipient of Western military aid to a partner with proven battlefield technology and expertise . Ukraine's defense ministry announced on Tuesday that the two nations' defense ministers had \"signed a letter of intent to cooperate on developing, implementing, and using the Delta combat digital ecosystem.\" Germany will be given access to the system and plans to further support its development, the ministry said, but that access will not include Ukraine's combat or operational data. The agreement would make Germany the first partner nation to secure access to the Delta system, which provides units with a single picture of the battlefield by combining data and intelligence from satellites, radars, and drones. Commanders can access the system on laptops, phones, and tablets. It reduces the time it takes for units to locate and engage targets. Evgeniy Khmara, Ukraine's defense minister, said on Tuesday that \"Ukraine has technological solutions tested at the front . Delta is a unique digital platform that combines planning, operations management, and situational analysis.\" \"German technological expertise will help develop and scale up the system's capabilities,\" he said. \"This is an important step for our mutually beneficial defense cooperation. Ukraine's partnership with Germany will strengthen both our countries and the security of Europe as a whole.\" Germany has already tested Delta, but further work is required before its military can use the system. \"The next step will be signing a separate agreement setting out the practical, technical, and legal terms of cooperation,\" Ukraine's defense ministry said. German officials previously said that their military needs to determine which parts of Delta could be integrated into its own systems, suggesting that Germany is not looking to adopt Ukraine's version wholesale. The news is another step in Ukraine's evolving relationship with its We", "date_str": "2026-11-24T15:49:08+00:00", "hash": "4e19a207c407cf0c", "title_fa": "در حالی که اروپا از جنگ خود درس می گیرد، اوکراین در حال به اشتراک گذاشتن سیستم مدیریت رزمی دلتای آزمایش شده خود با آلمان است", "summary_fa": "متحدان می خواهند از مدیریت میدان نبرد اوکراین، از جمله سیستم دلتا، بیاموزند. Dmytro Smolienko/ Ukrinform/ Future Publishing از طریق Getty Images اوکراین می گوید آلمان اولین کشور شریکی خواهد بود که به سیستم دلتا خود دسترسی پیدا می کند. دلتا یک تصویر یکپارچه میدان نبرد برای واحدها ایجاد می‌کند و به آنها کمک می‌کند تا اهداف را سریع‌تر پیدا کنند و به آنها حمله کنند. این نشانه دیگری از تغییر اوکراین از دریافت کننده کمک به شریک نظامی است که متحدان غربی می خواهند از آن بیاموزند. اوکراین قصد دارد سیستم مدیریت میدان نبرد دلتا خود را با آلمان به اشتراک بگذارد و این گامی دیگر در گذار این کشور از دریافت کننده کمک های نظامی غرب به شریکی با فناوری و تخصص اثبات شده میدان نبرد است. وزارت دفاع اوکراین روز سه‌شنبه اعلام کرد وزرای دفاع دو کشور \"نامه‌ای مبنی بر همکاری برای توسعه، اجرا و استفاده از اکوسیستم دیجیتالی رزمی دلتا\" امضا کرده‌اند. این وزارتخانه گفت که آلمان به این سیستم دسترسی خواهد داشت و قصد دارد از توسعه آن بیشتر حمایت کند، اما این دسترسی شامل اطلاعات رزمی یا عملیاتی اوکراین نمی شود. این توافق آلمان را به اولین کشور شریکی تبدیل می کند که دسترسی ایمن به سامانه دلتا را دارد که با ترکیب داده ها و اطلاعات ماهواره ها، رادارها و پهپادها، تصویر واحدی از میدان نبرد را در اختیار واحدها قرار می دهد. فرماندهان می توانند روی لپ تاپ، تلفن و تبلت به سیستم دسترسی داشته باشند. زمان لازم برای مکان یابی و درگیری با اهداف واحدها را کاهش می دهد. اوگنی خمارا، وزیر دفاع اوکراین، روز سه‌شنبه گفت: «اوکراین راه‌حل‌های فن‌آوری آزمایش شده در جبهه را دارد. دلتا یک پلت فرم 0-year low. Goldman Sachs Global Investment Research The bank estimated that \"depressed\" churn was weighing on yearly wage growth by around 0.3 percentage points. Wage growth has trended lower for most of the past five years, falling to a 3.1% yearly pace in October, according to the Bureau of Labor Statistics. Churn has moved lower for decades, thanks to an aging workforce and improved matches between workers and employers, which means fewer employers have let go of workers and fewer workers are quitting their jobs compared to the past, Mei said. The bank highlighted two reasons the drop in churn has accelerated recently: The job-switching boom during the pandemic has died down. AI adoption is also reducing churn. Churn has fallen below pre-pandemic levels in sectors with higher AI adoption rates and greater potential to automate, Mei said. AI is thought to have a negative impact on wages, as firms, in theory, could turn to the tech to lower labor costs, which drives down demand for workers in AI-exposed fields", "date_str": "2026-11-24T15:40:04+00:00", "hash": "5e1292b6b8dd29c9", "title_fa": "گلدمن ساکس می گوید یک الگوی غیرمعمول در بازار کار می تواند به دستمزد کارگران ضربه بزند", "summary_fa": "گلدمن ساکس در یادداشت مشتری نوشت: بازار کار شاهد ریزش غیرمعمول کم است، روندی که می تواند بر دستمزد کارگران تأثیر منفی بگذارد. گلدمن ساکس گفت: پل هکت/این پیکچرز با مسئولیت محدود/ کوربیس از طریق گتی ایماژ، بازار کار کم استخدام و کم آتش می تواند باعث افزایش دستمزد کارگران شود. در یک تحلیل جدید، بانک تخمین زد که ریزش کم در بازار کار بر رشد سالانه دستمزدها تأثیر گذاشته است. این به این دلیل است که کارگران بیشتر احتمال دارد که دستمزد کمتر یا افزایش دستمزد کمتر را در نقش خود بپذیرند. یک روند غیرمعمول در بازار کار می تواند عامل ضربه به دستمزد شما باشد. تجزیه و تحلیل گلدمن ساکس پیامد احتمالی بازار کار کم استخدام و کم آتش را نشان می دهد - پویایی که در آن کارفرمایان بسیاری از کارگران را رها نمی کنند و در عین حال استخدام های جدید را نیز محدود می کنند. پیرفرانچسکو می، اقتصاددان این بان  them. \"I was feeling good, working full time, and started to notice very subtle issues,\" he told Business Insider. \"I never thought it was going to be anything super serious. \" When the pain persisted for four months, accompanied by alarming symptoms like rectal bleeding , Faratzis underwent a colonoscopy that found a large tumor. He was diagnosed with stage 4 colorectal cancer. That was in 2019. After extensive treatments, including chemo and radiation, the cancer seemed to recede. About a year ago, another large tumor appeared. Now 36, Faratzis is facing intensive measures to fight the cancer, including a life-altering surgery, and an uncertain future as a single dad of a two-and-a-half-year-old daughter. \"I feel like I'm kind of in limbo right now,\" he said. \"My life is between going to the hospital and trying to be there for my kid as much as possible, not miss out on things in her life, and keep my head on straight while all this is going on.\" He shared the subtle symptoms that led up to his diagnosis, the challenges of treatment, and what everyone — especially young people — should know about cancer risk. Spotting subtle signs of colon cancer Faratzis said he noticed symptoms around January 2019, four months before he was diagnosed. At the time, he was busy but generally full of energy, working out at the gym five days a week and focused on his career. The main symptom was a little abdominal pain when he bent over to tie his shoes. Once in a while, he noticed a bit of blood after using the bathroom. Rectal bleeding is one of the biggest warning signs of colon cancer , particularly in young people. He assumed it was hemorrhoids, a common", "date_str": "2026-11-24T15:38:21+00:00", "hash": "32ef3d9553257614", "title_fa": "او 29 سال داشت و 5 روز در هفته به ورزشگاه می رفت. معلوم شد که یک معده درد کوچک مرحله 4 سرطان است.", "summary_fa": "جو فراتزیس در سن 29 سالگی با وجود اینکه سالم و فعال بود، به سرطان روده بزرگ در مرحله 4 مبتلا شد. با حسن نیت از جو فاراتزی op during major sales? Millions of Amazon Prime users currently pay $14.99 per month or $139 per year for their memberships though other plans cost less if you qualify. For example, the Amazon Prime Student program allows young adults between the ages of 18 and 24 to get all of the Prime perks for half the cost $7.49 per month or $69 annually. If you re on the fence about signing up for (or renewing) your Prime membership, here s how to judge whether or not the benefits outweigh the $139 cost. The benefits of Amazon Prime Here are the main perks of Amazon Prime that make it worth the cost for so many users. Free two-day shipping on millions of items: This is the main draw of Prime. If you shop frequently on Amazon and want quick free delivery, the shipping perks alone may make Prime worthwhile. Prime members also get free same-day delivery on over 3 million items in eligible areas. The ultra-fast (and morally suspect ) shipping usually costs $9.99 per order for non-members, though you can choose lower-cost or free shipping options if you're willing to place larger orders and wait longer to receive them. Access to Prime Video : Prime includes unlimited streaming of movies, TV shows, and Amazon Originals. If you ask me, the content library isn t as robust as Netflix or Hulu, but this is still an added value. Other Prime benefits: You also get Amazon Music for streaming songs, Prime Reading for ebooks, magazines, and audiobooks; Prime gaming, free photo storage, and occasional exclusive discounts/deals. Amazon Prime Rewards Visa card : Cardholders get 5% back on Amazon/Whole Foods purchases. Prime members who use this card extensively can earn rewards that offset the annual fee. Number of users: Prime benefits can be shared with other members of your household. The more users, the more value per person. Is an Amazon Prime account worth it? Let's say you don't care about Prime Video, Amazon Music, or free e-books, and just want to know if you'll save money you would otherwise be spending on shipping. For non-Prime members, Amazon requires a minimum order of $35 to qualify for free shipping on eligible items. The average shipping costs f", "date_str": "2026-11-24T16:00:00+00:00", "hash": "a15f35204e5cd6a9", "title_fa": "چند وقت یکبار باید از آمازون سفارش دهید تا پرایم ارزشش را داشته باشد", "summary_fa": "جمعه سیاه تا 27 نوامبر باقی نمانده است، اما فروش جمعه سیاه اولیه آمازون چند روزی است که افزایش یافته است. برای خریداران مکرر آمازون، Prime می تواند به سرعت هزینه خود را عمدتاً به لطف امتیاز حمل و نقل رایگان پرداخت کند. اما اگر مرتباً از آمازون سفارش نمی‌دهید، ریاضی چگونه از بین می‌رود؟ اگر فقط در زمان فروش عمده خرید می کنید ارزش ثبت نام را دارد؟ میلیون‌ها کاربر Amazon Prime در حال حاضر 14.99 دلار در ماه یا 139 دلار در سال برای عضویت خود می‌پردازند، اگرچه سایر برنامه‌ها در صورت واجد شرایط بودن هزینه کمتری دارند. به عنوان مثال، برنامه Amazon Prime Student به جوانان بین سنین 18 تا 24 سال اجازه می دهد تا با نیمی از هزینه 7.49 دلار در ماه یا 69 دلار در سال، تمام مزایای Prime را دریافت کنند. اگر در مورد ثبت نام (یا تمدید) عضویت خود در Prime تصمیم ندارید، در اینجا نحوه قضاوت در مورد اینکه آیا مزایا بیش از هزینه 139 دلاری است یا خیر، توضیح داده شده است. مزایای آمازون پرایم در اینجا مزایای اصلی آمازون پرایم است که ارزش هزینه‌های آن را برای کاربران زیادی دارد. ارسال رایگان دو روزه میلیون‌ها کالا: این بازی اصلی پرایم است. اگر اغلب در آمازون خرید می کنید و می خواهید تحویل سریع و رایگان داشته باشید، مزایای حمل و نقل به تنهایی ممکن است Prime را ارزشمند کند. اعضای Prime همچنین تحویل رایگان در همان روز بیش از 3 میلیون کالا در مناطق واجد شرایط دریافت می کنند. حمل و نقل فوق سریع (و از نظر اخلاقی مشکوک) معمولاً 9.99 دلار به ازای هر سفارش برای غیرعضوها هزینه دارد، اگرچه اگر مایل به ثبت سفارش های بزرگتر هستید و برای دریافت آنها بیشتر منتظر بمانید، می توانید گزینه های هزینه کمتر یا ارسال رایگان را انتخاب کنید. دسترسی", "image_url": "https://lifehacker.com/imagery/articles/01HF2H4YKF9VWRN57JKZGD7GC2/hero-image.fill.size_1200x675.jpg", "category": "هوش مص ی اجرا در ساتنا، پایا، پل و پیچک ابلاغ کرد؛ این تغییر به‌صورت مرحله‌ای پیاده‌سازی می‌شود.", "date_str": "2026-11-24T15:30:00+00:00", "hash": "df7d196403e94d1b", "title_fa": "ثبت دلیل برای تراکنش‌های بانکی اجباری شد", "summary_fa": "بانک مرکزی فهرست ۴۱گانه عناوین «بابت» را برای اجرا در ساتنا، پایا، پل و پیچک ابلاغ کرد؛ این تغییر به‌صورت مرحله‌ای پیاده‌سازی می‌شود. تبلیغات به گزارش روابط عمومی بانک مرکزی، این بانک در راستای اجرای تکالیف مقرر در بند (ب) ماده (۱۹) قانون بانک مرکزی جمهوری اسلامی ایران، طی بخشنامه شماره ۲۲۹۴۲۰/۰۵ مورخ ۲ آذر ۱۴۰۵، فهرست جدید ۴۱‌گانه عناوین فیلد «بابت» در تراکنش‌های بانکی را به شبکه بانکی ابلاغ کرده است. این تغییرات تمامی سامانه‌های ساتنا، پایا، پل، چکاوک، پیچک و چکاد و سایر زیرساخت‌های مرتبط را در بر می‌گیرد. بر اساس بخشنامه ابلاغی و با توجه به درخواست‌ها و ملاحظات مطرح‌شده از سوی بانک‌ها و توافق انجام‌شده برای تسریع در اجرای این تغییر ضروری، پیاده‌سازی فهرست جدید به‌صورت مرحله‌ای نیز مورد تأیید بانک مرکزی قرار گرفته است. در مرحله نخست، عناوین جدید مطابق فهرست ابلاغی، به‌صورت یک فهرست واحد در تاریخ تعیین‌شده در سامانه‌های مربوط پیاده‌سازی و در اختیار مشتریان قرار می‌گیرد. در مرحله دوم نیز پس از فراهم‌شدن زیرساخت‌ها و الزامات فنی مورد نیاز و با فاصله زمانی کوتاه از اجرای مرحله نخست، امکان نمایش و انتخاب چندسطحی عناوین فراهم خواهد شد. هدف از این تغییر، تسهیل انتخاب عنوان متناسب با ماهیت تراکنش و بهبود تجربه کاربری مشتریان عنوان شده است. کپی لینک پایان اعتبار فهرست قبلی برای تراکنش‌های جدید طبق اعلام بانک مرکزی، از زمان اجرای تغییرات، ثبت تمامی تراکنش‌ها و درخواست‌های جدید در سامانه‌های یادشده صرفاً بر اساس فهرست جدید ۴۱‌گانه عناوین «بابت» انجام می‌شود و پس از آن امکان ثبت تراکنش یا درخواست جدید با استفاده از عناوین فهرست قبلی وجود نخواهد داشت. با این حال، برای دستورپرداخت‌های پایای دارای تاریخ آتی که پیش از اجرای تغییرات از مشتریان دریافت و در سامانه متمرکز بانک ثبت شده‌اند تا در زمان سررسید به سامانه پایا ارسال شوند، مهلت مشخصی در نظر گرفته شده است. این", "image_url": "https://api2.zoomit.ir/media/new-banking-debit-list-6b05918411439fc0064046de?w=1920&q=75", "category": "موسیقی و هنر", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۳ آذر • ۱۹:۰۰"}, {"source": "Lifehacker", "title": "Three Reasons Not to Use ‘Buy Now, Pay Later’ During Black Friday", "link": "https://lifehacker.com/dont-use-amazon-buy-now-pay-later-prime-day-2026?utm_medium=RSS", "summary": "Gone are the days of needing to wait until after Thanksgiving to shop some seriously substantial Black Friday sales . As you're adding item after item to your cart during the sale, you might be tempted by offers for an \"affordable monthly payment system.\" Also known as \"buy now, pay later\" (BNPL), the pitch is a tempting one: Buy what you need now, and pay later, \" on your own timeline .\" But as convenient as it sounds, you should think twice before using buy now, pay later options, whether during Black Friday, Cyber Monday, or at any other time. While BNPL plans can allow you to pay for purchases in installments without interest, they come with a cost that can easily outweigh any big discounts. Let's take a look at the hidden costs of BNPL, and why you're better off paying upfront for all your Black Friday purchases. How does Amazon's buy now, pay later program work? To be clear, Amazon doesn't have its own buy now, pay later program, and the company is not uniquely misleading on this front. The process is straightforward: you choose your items, select Affirm (a third-party lender) at checkout, complete a quick application, and receive an instant decision on your loan terms. Individual transactions initiated through Affirm are limited to $25,000, with a daily maximum of $100,000 across multiple purchases but of course, your Black Friday splurge will be nowhere near that big, right? ( Right?! ) The main draw of these programs is the ability to \"pay at your own pace.\" If you are required to pay a down payment, that is due at the time of the transaction. From there, your first monthly payment is usually due one month after your purchase is processed. Each following payment will be due one month later, on the same day of the month. You can choose your own timeline, usually spanning 3, 6, 12, or 24 months, depending on the purchase amount and your creditworthiness. Unlike traditional credit cards, Affirm shows you the exact payment amount and total cost upfront, and claims no hidden fees or compound interest. You need a separate Affirm account in addition to your Amazon Prime membership . The application process requires basic information, including your name, mobile phone number, date of birth, and the last four digits of your Social Security number. Affirm performs a soft credit check initially, which doesn't impact your credit score, though they may conduct a hard inquiry for some loans. BNPL plans are helpful if you really need to finance something big, bu", "date_str": "2026-11-24T15:30:00+00:00", "hash": "6d783d6940e9a02d", "title_fa": "سه دلیل برای عدم استفاده از «اکنون بخرید، بعداً بپردازید» در جمعه سیاه", "summary_fa": "روزهایی که باید منتظر بمانید تا بعد از عید شکرگزاری برای خرید برخی از فروش های قابل توجه جمعه سیاه گذشته بود. از آنجایی که در حین فروش، آیتم‌های دیگری را به سبد خرید خود اضافه می‌کنید، ممکن است با پیشنهادات «سیستم پرداخت ماهانه مقرون‌به‌صرفه» وسوسه شوید. همچنین به‌عنوان «اکنون بخرید، بعداً بپردازید» (BNPL) نیز شناخته می‌شود، پیشنهادی وسوسه‌انگیز است: آنچه را که اکنون نیاز دارید بخرید و بعداً «در جدول زمانی خودتان» بپردازید. اما هر چقدر هم که راحت به نظر می رسد، باید قبل از استفاده از خرید اکنون دو بار فکر کنید، گزینه های بعدی را بپردازید، چه در جمعه سیاه، چه در روز دوشنبه سایبری یا هر زمان دیگری. در حالی که طرح‌های BNPL به شما امکان می‌دهند برای خرید به صورت اقساطی بدون بهره پرداخت کنید، هزینه‌ای دارند که به راحتی می‌تواند از هر تخفیف بزرگی بیشتر باشد. بیایید نگاهی به هزینه‌های پنهان BNPL بیندازیم، و چرا بهتر است برای همه خریدهای جمعه سیاه خود پیش‌پرداخت کنید. برنامه خرید در حال حاضر، پرداخت بعداً آمازون چگونه کار می کند؟ برای روشن بودن، آمازون برنامه خرید خود را در حال حاضر، پرداخت بعداً ندارد، و این شرکت به طور منحصر به فردی در این زمینه گمراه کننده نیست. این روند ساده است: شما موارد خود را انتخاب می کنید، تأیید (یک وام دهنده شخص ثالث) را در هنگام پرداخت انتخاب می کنید، یک درخواست سریع را تکمیل می کنید و تصمیم فوری در مورد شرایط وام خود دریافت می کنید. تراکنش‌های انفرادی که از طریق Affirm شروع می‌شوند به 25000 دلار محدود می‌شوند، با حداکثر روزانه 100000 دلار در خریدهای متعدد، اما مطمئناً هجوم جمعه سیاه شما به این بزرگی نخواهد بود، درست است؟ (درسته؟! ) نکته اصلی این برنامه ها توانایی \"پرداخت با سرعت خود\" است. اگر شما ملزم به پرداخت پیش پرداخت هستید، این", "image_url": "https://lifehacker.com/imagery/articles/01J03XDC2A0HZTS5ZSFV585KY3/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۳ آذر • ۱۹:۰۰"}, {"source": "The Verge", "title": "You can lock in Hulu and Disney Plus for as low as $5 per month for a year", "link": "https://www.theverge.com/gadgets/1041150/hulu-disney-plus-black-friday-ad-free-streaming-subscription-deal-sale-2026", "summary": "Emmy Rossum leads the fantastic cast of Furious. | Image: Hulu The Black Friday offers on streaming services are rolling in, and the latest deal includes Disney Plus and Hulu for a steeply discounted monthly rate. There are sales happening for both the ad-supported and ad-free tiers that offer full access to both services, and either will save you quite a bit of money. For those who despise ads, you can opt for the ad-free version for $14.99 per month (was $21.99) for a year, costing you $180 instead of $264 over the duration. This deal is located in a small banner near the bottom of the sale page via Hulu or Disney Plus . The ad-supported tier drops from $12.99 to just $4.99, so you’ll pay $60 over the course of the year instead of $156. You have through Cyber Monday, November 30th, at 11:59PM PST to take advantage of the lower prices. Disney Plus and Hulu bundle Where to Buy: $12.99 $4.99 at Hulu (ad-supported, monthly) $21.99 $14.99 at Hulu (ad-free, monthly) The Hulu and Disney Plus bundle is one of the best values in streaming, especially if you have kids who can’t get enough Disney movies and other cartoons. On the other hand, Hulu is home to plenty of shows made for adults, including Furious (a crime drama that gripped this household like no other show this year), The Bear , Shōgun , Alien: Earth , The Lowdown , and many more. It’s worth the subscription just for those alone. The bundle includes Star Wars and Marvel content plus fun, uplifting shows to dig into over the holidays, like Bob’s Burgers , Futurama , The Simpsons , and It’s Always Sunny in Philadelphia , to name some mainstays that tend to attract subscribers. If you’re considering other subscription services, we covered discounts on Paramount Plus (I might snag this to watch Cupertino ), HBO Max , and Peacock . ( The Fall and Rise of Reggie Dinkins is fun!)", "date_str": "2026-11-24T15:24:46+00:00", "hash": "85ab219cccad96fc", "title_fa": "می توانید Hulu و Disney Plus را با حداقل 5 دلار در ماه به مدت یک سال قفل کنید", "summary_fa": "Emmy Rossum بازیگران فوق العاده Furious را رهبری می کند. | تصویر: Hulu پیشنهادات جمعه سیاه در سرویس‌های پخش جریان دارد، و آخرین معامله شامل Disney Plus و Hulu برای نرخ ماهیانه با تخفیف شدید است. فروش هایی برای هر دو دسته با پشتیبانی و بدون آگهی انجام می شود که دسترسی کامل به هر دو سرویس را ارائه می دهند و هر کدام مقدار زیادی در هزینه شما صرفه جویی می کنند. برای کسانی که تبلیغات را تحقیر می کنند، می توانید نسخه بدون آگهی را با قیمت 14.99 دلار در ماه (21.99 دلار) برای یک سال انتخاب کنید، که به جای 264 دلار در طول مدت، 180 دلار هزینه دارد. این معامله در یک بنر کوچک در نزدیکی پایین صفحه فروش از طریق Hulu یا Disney Plus قرار دارد. سطح پشتیبانی از تبلیغات از 12.99 دلار به 4.99 دلار کاهش می یابد، بنابراین به جای 156 دلار، 60 دلار در طول سال پرداخت خواهید کرد. تا 30 نوامبر، ساعت 23:59 به وقت PST، فرصت دارید تا از قیمت‌های پایین‌تر استفاده کنید. بسته Disney Plus و Hulu از کجا بخریم: 12.99 دلار 4.99 دلار در Hulu (پشتیبانی از آگهی، ماهانه) 21.99 دلار 14.99 دلار در Hulu (بدون آگهی، ماهانه) بسته Hulu و Disney Plus یکی از بهترین ارزش‌ها در جریان است، به خصوص اگر بچه‌هایی دارید که نمی‌توانند به اندازه کافی فیلم‌های Distonney و اتومبیل‌های دیگری تهیه کنند. از سوی دیگر، Hulu خانه نمایش‌های زیادی است که برای بزرگسالان ساخته شده‌اند، از جمله Furious (یک درام جنایی که امسال مانند هیچ نمایش دیگری در این خانواده وجود نداشت)، The Bear، Shōgun، Alien: Earth، The Lowdown و بسیاری دیگر. فقط برای کسانی که به تنهایی ارزش اشتراک دارند. این بسته شامل محتوای جنگ‌های ستارگان و مارول به‌علاوه برنامه‌های سرگرم‌کننده و نشاط‌آور برای بررسی در تعطیلات است، مانند Bob’s Burgers، Futurama،", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/furiouslede.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "سینما"], "datetime_fa": "۳ آذر • ۱۸:۵۴"}, {"source": "MIT Tech Review", "title": "Raising the stakes for enterprise networks with AI modernization", "link": "https://www.technologyreview.com/2026/11/24/1148091/raising-the-stakes-for-enterprise-networks-with-ai-modernization/", "summary": "Enterprise networks are under severe strain. As companies rush to deploy artificial intelligence, the technology is quickly becoming the biggest source of demand on the network . Now, agentic AI is adding to the load. Tasks conducted by AI agents generate an estimated 450% more network traffic than the same tasks done by human workers. As AI inference shifts from hyperscale training clouds—the huge centralized data centers where raw AI models ingest vast datasets and learn—to real-time, latency-sensitive applications, the need for on-premises or near-premises infrastructure grows. As a result, the gap between enterprise networks that are ready to support AI and those that are not is widening. As few as half of enterprises believe their current networks can handle AI’s bandwidth and latency demands, according to a recent study . DOWNLOAD THE REPORT This report explores how treating network modernization as an on-going strategy rather than a one-off project can help organizations adapt in the face of disruption and uncertainty. Key findings from the report include: AI may force companies to shift from a cloud-first approach to routing workloads. Training AI requires server-to-server data center architectures, while inference calls for low-latency connectivity close to users. Enterprises may need to fundamentally reconsider their network architecture to meet these requirements. AI inference is pushing infrastructure back on premises. Inference typically requires real-time processing and is sensitive to latency, making hosting such capabilities on distant hyperscale clouds neither economical nor practical. Inconsistent latency can lead to AI model failures, driving up queue wait times, saturating GPUs loads, and causing bottlenecks in data flows. Large enterprises may need on-premises or near-premises inference, which reverses years of cloud-first consolidation and forces new approaches to data center architecture, connectivity, and physical infrastructure. AI workloads are stressing physical network capacity in unexpected ways. The traffic increase from agentic AI, combined with inference moving on-premises, is exposing bandwidth bottlenecks in legacy underlay infrastructure. Network modernization is an ongoing project that requires a holistic approach, allowing companies to adapt with ease. A combination of strong architectural governance, reusable design templates, and retained internal expertise supports organizations in adapting to disruptive events witho", "date_str": "2026-11-24T15:15:16+00:00", "hash": "675df89f748bbd5a", "title_fa": "افزایش ریسک برای شبکه های سازمانی با نوسازی هوش مصنوعی", "summary_fa": "شبکه های سازمانی تحت فشار شدید قرار دارند. با عجله شرکت ها برای استقرار هوش مصنوعی، این فناوری به سرعت به بزرگترین منبع تقاضا در شبکه تبدیل می شود. ا ion for a potential conflict against a peer-level adversary, officials have warned that contested airspaces, drone threats, and electronic warfare will make evacuations difficult and require medical teams to care for casualties on the ground for hours, if not days. And evacuations, once they're underway, may be slower. In a potential Indo-Pacific war, for instance, vast distances between remote islands and installations could add complications. US forces relied on air superio", "date_str": "2026-11-24T14:59:37+00:00", "hash": "3c8661031d5ba5c9", "title_fa": "نیروی دریایی ایالات متحده در حال آموزش تیم‌های پزشکی کوچک برای مراقبت از سربازان بشدت مجروح تا 8 ساعت است", "summary_fa": "سیستم‌های مراقبت در مسیر متشکل از دو عضو تیم پزشکی هستند و می‌توانند از حداکثر دو پرسنل آسیب‌دیده به مدت هشت ساعت مراقبت کنند. عکس نیروی دریایی ایالات متحده توسط متخصص ارتباطات جمعی کلاس 1 مارکوس ال استنلی نیروی دریایی ایالات متحده در حال آزمایش آموزش جدید برای پزشکانی است که از سربازان مجروح در حین تخلیه مراقبت می کنند. تیم‌های دو نفره می‌توانند به مدت هشت ساعت از دو سرباز مجروح بدخیم مراقبت کنند. جنگ های آینده می تواند تخلیه سربازان مجروح را بسیار دشوارتر از درگیری های گذشته کند. نیروی دریایی ایالات متحده در حال آزمایش یک برنامه آموزشی جدید برای تیم های پزشکی دو نفره برای مراقبت از سربازان مجروح تا هشت ساعت در طول تخلیه طولانی مدت از طریق زمین، هوا یا دریا است. برنامه جدید، پزشکان را در مهارت‌های حیاتی مانند کنترل خونریزی، آماده‌سازی تیم‌ها برای چالش‌های درمان بیماران در شرایط سخت، آگاه نگه می‌دارد. بدون هیچ تضمینی برای تخلیه سریع در جنگ‌های احتمالی آینده، تیم‌های پزشکی ارتش ایالات متحده برای مراقبت از بیماران در مدت زمان طولانی‌تری آماده می‌شوند. طبق یک بیانیه مطبوعاتی، تیم‌های دو نفره، که به سیستم‌های مراقبت در مسیر شناخته می‌شوند، تحت آموزش‌های پایداری مبتنی بر شبیه‌سازی به رهبری سلول آموزش پیشرفته نیروهای دریایی نیروی دریایی آتلانتیک قرار خواهند گرفت. این تیم ها شامل یک پرستار مراقبت های ویژه یا ترومای اورژانس و یک سرباز بیمارستان آموزش دیده به پیراپزشک هستند و به ویژه برای محیط های دو ousing and rental affordability, as the housing market might shift into a buyer's market, with increased supply giving buyers more options — helping to ease pressure on housing prices. \"It's going to be great for the buyers,\" he said. \"But if you are then trying to sell a house there, you're going to have much more competition.\" Here are the top 10 states on the report's household-growth measure, where permit pace most exceeds projected household change, adjusted by total number of current households. Land availability and economic growth in many of these states have helped ensure that building permits outpace expected increases in demand. \"Utah, Idaho, South Carolina and North Carolina, South Dakota. I mean, all these places have more land available in their major cities and surrounding areas,\" Irwin said. He also pointed to the flock of new businesses in the Carolinas, and how the presence of businesses and research innovation centers has also spurred cities in these states to grow. North Carolina , in particular, led the nation, as its permit pace from January to August 2026 stood at a 6.11 gap per 1,000 households. That's after it approved an average of 8,072 permits a month, versus 4,640 projected households. Ka", "date_str": "2026-11-24T14:32:18+00:00", "hash": "0fe19071f973c5d3", "title_fa": "10 ایالت برتر قرار است بیشترین مسکن را برای جمعیت رو به رشد خود بسازند", "summary_fa": "کارولینای شمالی، کانزاس و ویرجینیای غربی پیشتاز هستند تا به خانه‌ها اجازه دهند تا رشد پیش‌بینی‌شده خانوار را برآورده کنند. جرمی اریکسون/ بلومبرگ از طریق گتی ایماژ مجوزهای ساخت خانه در ایالات متحده از رشد خانوارهای جدید پیشی گرفته است که توسط بازیگران برجسته ایالتی هدایت می شود. کارولینای شمالی با صدور 8072 مجوز ماهانه برای 4640 خانوار جدید پیشتاز در صدور مجوزهای مسکن است. کشورهایی با افزایش عرضه می توانند شاهد کاهش فشارهای قیمتی باشند. ایالات متحده به عنوان یک کل در حال تصویب مجوزهای ساختمانی سریعتر از رشد پیش بینی شده خانوار است، اما سرعت ملی توسط چند ایالت با عملکرد بهتر افزای
