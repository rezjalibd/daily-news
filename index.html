<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۲۷ آبان ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۲۷ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۱۸ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۰۷:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۳۱</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۱۱</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۱۳</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>
    const data = {
      persian: [{"source": "Independent Persian", "title": "پایان وقفه دوماهه درگیری‌ها با سومین حمله سپاه به بحرین و پاسخ نظامی واشنگتن", "link": "https://www.independentpersian.com/node/423257/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D9%BE%D8%A7%DB%8C%D8%A7%D9%86-%D9%88%D9%82%D9%81%D9%87-%D8%AF%D9%88%D9%85%D8%A7%D9%87%D9%87-%D8%AF%D8%B1%DA%AF%DB%8C%D8%B1%DB%8C%E2%80%8C%D9%87%D8%A7-%D8%A8%D8%A7-%D8%B3%D9%88%D9%85%DB%8C%D9%86-%D8%AD%D9%85%D9%84%D9%87-%D8%B3%D9%BE%D8%A7%D9%87-%D8%A8%D9%87%C2%A0%D8%A8%D8%AD%D8%B1%DB%8C%D9%86-%D9%88-%D9%BE%D8%A7%D8%B3%D8%AE-%D9%86%D8%B8%D8%A7%D9%85%DB%8C", "summary": "جمهوری اسلامی ایران می‌گوید روز سه‌شنبه با پهپاد به یک تاسیسات راداری آمریکا در بحرین حمله کرده است. این سومین حمله در روزهای اخیر به اهداف آمریکا در این کشور جزیره‌ای در خلیج فارس بود. آمریکا نیز در واکنش، مواضعی نظامی ایران را در امتداد یک مسیر مهم کشتیرانی هدف قرار داد. اسوشیتدپرس می‌نویسد، این حملات و ضدحملات به وقفه‌ای حدود دوماهه در درگیری‌ها پایان دادند. حمله به بحرین با محکومیت کشورهای منطقه روبه‌رو شد. تحلیلگران می‌گویند متوقف ماندن مذاکرات صلح و افزایش فشارهای اقتصادی بر تهران، خطر تشدید گسترده درگیری‌ها را افزایش داده است. بحرین اعلام کرد سامانه‌های پدافند هوایی این کشور با موفقیت «حملات هوایی خائنانه جمهوری اسلامی» را رهگیری کرده‌اند. ارتش آمریکا نیز اعلام کرد این حمله هیچ خسارتی به تجهیزات آمریکایی وارد نکرده و هیچ‌یک از نیروهای این کشور زخمی نشده‌اند. یک مقام آمریکایی گفت چند ساعت بعد، یک جنگنده آمریکایی موضع پرتاب موشک متعلق به نیروی شبه‌نظامی سپاه پاسداران را در تنگه هرمز هدف حمله قرار داد. این مقام که برای تشریح عملیات نظامی حساس نخواست نامش فاش شود، گفت در حمله به جزیره قشم از «مهمات دقیق» استفاده شده و آمریکا در واکنش به «اقدامات تهاجمی» علیه نیروهای آمریکایی دست به این حمله زده است. احمد نفیسی، یکی از مقام‌های محلی، گفت این حمله هیچ خسارتی به مناطق مسکونی و تجاری یا زیرساخت‌ها وارد نکرده است. ارتش آمریکا در طول ماه جاری میلادی به‌صورت دوره‌ای حملاتی را انجام داده که به نظر می‌رسد حملاتی محدود در جزیره قشم و دیگر  خطر خونریزی شدید را به میزان قابل‌توجهی افزایش دهد انجام می‌دهد. به گزارش مجلهٔ تایم، سازمان غذا و داروی آمریکا روز ۹ نوامبر داروی آسوندکسیان (Asundexian) را با نام تجاری «سان‌هاربو»‌ (Sunharbo) تأیید کرد. این دارو روزانه مصرف می‌شود و برای افرادی در نظر گرفته شده است که به‌تازگی دچار سکتهٔ مغزی ایسکمیک (ناشی از گرفتگی رگ‌های مغز) یا حملهٔ ایسکمیک گذرا شده‌اند. سکتهٔ مغزی ایسکمیک زمانی رخ می‌دهد که گرفتگی رگ‌ها جریان خون را به بخشی از مغز قطع کند. حملهٔ ایسکمیک گذرا نیز بر اثر انسداد موقت جریان خون مغز رخ می‌دهد، اما برخلاف سکتهٔ مغزی، معمولاً آسیب دائمی بر جای نمی‌گذارد. در پژوهشی که شرکت داروسازی بایر نتایج آن را به سازمان غذا و داروی آمریکا ارائه کرد، پژوهشگران دریافتند مصرف آسوندکسیان همراه با داروهای ضد پلاکت مانند آسپیرین، خطر سکتهٔ مغزی دوباره را در مدتی کمی بیش از یک سال ۲۶ درصد کاهش می‌دهد. این نتیجه از مقایسه با گروهی به دست آمد که دارونما را همراه با درمان ضد پلاکت مصرف کرده بودند. دکتر اشکان شعاع‌منش، استاد پزشکی دانشگاه مک‌مستر کانادا و یکی از سرپرستان این کارآزمایی بالینی، می‌گوید: «داده‌ها بسیار قوی‌اند و جامعهٔ بین‌المللی متخصصان سکتهٔ مغزی نیز واکنش مثبتی نشان داده است. مشتاقیم این دارو هرچه زودتر در اختیار بیماران قرار گیرد.» کاهش خطر سکته بدون افزایش چشمگیر خونریزی سکته‌های مغزی به دو دستهٔ اصلی تقسیم می‌شوند: سکتهٔ ایسکمیک که بر اثر انسداد رگ‌های خون‌رسان به مغز رخ می‌دهد و سکتهٔ هموراژیک یا خونریزی‌دهنده که بر اثر پاره شدن رگ‌های ضعیف‌شدهٔ مغز و خونریزی رخ می‌دهد. حدود ۸۷ درصد سکته‌های مغزی در آمریکا از نوع ایسکمیک‌اند. هر سال حدود ۷۹۵ هزار نفر در آمریکا دچار سکتهٔ مغزی می‌شوند و نزدیک به یک‌چهارم موارد سکته در افرادی رخ می‌دهد که پیش‌تر نیز سکته کرده‌اند. به گفتهٔ شعاع‌منش، پیشگیری از سکتهٔ مغزی مجدد همچنان یکی از چالش‌های مهم درمانی است. مشکل اصلی آن است که داروهای جلوگیری‌کننده از تشکیل لخته باید به‌اندازه‌ای مؤثر باشند که خطر انسداد رگ‌ها را کاهش دهند، اما در عین حال باعث خونریزی بیش‌ازحد نشوند. نتایج پژوهش بایر نشان می‌دهد آسوندکسیان ممکن است به برطرف شدن این مشکل کمک کند. در این کارآزمایی، کاهش ۲۶ درصدی خطر سکتهٔ مغزی با افزایش معنادار مو       tech: [{"source": "Zoomit", "title": "آشفتگی در بازار ارز دیجیتال؛ آستر در چند دقیقه سقوط کرد و میلیون‌ها دلار معامله لیکویید شد", "link": "https://www.zoomit.ir/cryptocurrency/471256-aster-token-price-volatility-investigation/", "summary": "مدیرعامل صرافی غیرمتمرکز استر از بررسی نوسان شدید و سقوط قیمت توکن این پلتفرم در بازه‌ی زمانی ۱۵ دقیقه‌ای خبر داد.", "date_str": "2026-11-18T02:30:00+00:00", "hash": "b4f6e6c382011e76", "title_fa": "آشفتگی در بازار ارز دیجیتال؛ آستر در چند دقیقه سقوط کرد و میلیون‌ها دلار معامله لیکویید شد", "summary_fa": "مدیرعامل صرافی غیرمتمرکز استر از بررسی نوسان شدید و سقوط قیمت توکن این پلتفرم در بازه‌ی زمانی ۱۵ دقیقه‌ای خبر داد. تبلیغات قیمت توکن بومی آ ستر (ASTER) پس از یک دوره نوسان شدید که طی آن تا بالای ۰٫۷۱ دلار صعود کرده بود، ظرف مدت کوتاهی به ۰٫۴۸ دلار سقوط کرد. تیم توسعه‌دهنده‌ی این صرافی غیرمتمرکز اعلام کرده است که بررسی‌ها برای مشخص شدن ابعاد این اتفاق جریان دارد. لئونارد لیونگ ، مدیرعامل صرافی استر، این نوسان را ناشی از تصفیه و لیکوئیدشدن موقعیت‌های معاملاتی با اهرم بسیار بالا دانست. لیونگ این رخداد را دارای ابعاد مشکوک قلمداد کرد و افزود که فعالیت‌های جاری پلتفرم روندی عادی را طی می‌کند و ارتباطی میان این تحولات با فرایندهای بازارسازی توکن وجود ندارد. مدیرعامل آستر می‌گوید : «احتمالا نیت‌های مخرب در پشت این تسویه‌های اهرمی سنگین وجود داشته است، بااین‌حال تیم ما همچنان در حال بررسی دقیق ماجراست.» داده‌های معاملاتی نشان می‌دهد هم‌زمان با این تلاطم قیمتی، حجم معاملات مشتقه توکن به شکل چشمگیری افزایش یافته است. حجم معاملات آتی در طول ۲۴ ساعت به ۱٫۲۹ میلیارد دلار رسید که رشد ۱۲۱ درصدی را نشان می‌دهد، درحالی‌که حجم معاملات اسپات با رشد ۶۷ درصدی به ۱۱۸٫۳ میلیون دلار رسید. مجموع موقعیت‌های اهرمی لیکوئید شده به حدود ۹٫۱ میلیون دلار رسید که شامل ۵٫۹۷ میلیون دلار موقعیت خرید و ۳٫۱۴ میلیون دلار موقعیت فروش می‌شود. قیمت توکن پس از این ریزش ناگهانی به حدود ۰٫۵۵ دلار بازگشت که نسبت به اوج روزانه کاهشی ۲۲٫۵ درصدی را ثبت کرده است. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ ن rnia, 86 workers in roles such as sales, general administration, and technology and product were cut on August 7, according to a regulatory filing. There were other reductions in Washington state and outside the US. Internal documents reviewed by Business Insider show Salesforce's standard severance package offers eligible U.S. workers can receive up to 30 weeks of base pay based on level, tenure, and age. Salesforce this week also set AI budgets for employees after some spent thousands per month on tokens last quarter, according to an internal memo viewed by Business Insider. Salesforce has had a turbulent year amid worries about how AI will affect traditional software business models. CEO Marc Benioff has pushed back on this idea, saying at the company's last earnings report: \" This is not the Saaspocalypse .\" Salesforce stock was down 9% on Tuesday. Have a tip? Contact this reporter via email at astewart@businessinsider.com or Signal at +1-425-344-8242. Use a personal email address and a non-work device; here's our guide to sharing information securely . Read the original article on Business Insider", "date_str": "2026-11-17T23:14:01+00:00", "hash": "9bd3c5d4d41954f2", "title_fa": "پیام های داخلی نشان می دهد که Salesforce شروع به کاهش مشاغل بیشتری کرده است", "summary_fa": "پیام‌های نیروی فروش داخلی بلومبرگ/گتی ایماژ نشان می‌دهد که این شرکت شروع به کاهش مشاغل بیشتری کرده است. این کاهش ها به دنبال اخراج های قبلی در Salesforce در سال جاری است. اسناد داخلی بررسی شده توسط Business Insider بسته استاندارد انفصال Salesforce را نشان می دهد. بر اساس پیام های داخلی مشاهده شده توسط Business Insider، Salesforce شروع به کاهش مشاغل بیشتری کرده است. دامنه کاهش ها نامشخص است. کارمندان در پیام‌هایی در یک کانال داخلی Slack درباره کاهش‌هایی که این هفته اتفاق می‌افتد بحث کردند. چند نفر از کارمندان نوشتند که اخیراً اخراج شده اند. یکی از این افراد خاطرنشان کرد که طبق پیام هایی که توسط Business Insider بررسی شده است، رئیس آنها رها شده است. یکی از مدیران ارشد Salesforce، در زمینه انطباق با فناوری اطلاعات و استراتژی محتوا، همچنین در یک پست عمومی لینکدین نوشت که آنها و سایر هم تیمی‌های خود تحت تأثیر کاهش نیرو در صبح دوشنبه قرار گرفتند. در اوایل سال جاری، Salesforce اخراج‌هایی را انجام داد. در کالیفرنیا، 86 کارگر در نقش‌هایی مانند فروش، اداره کل، و فناوری و محصول در 7 آگوست بر اساس یک پرونده نظارتی برکنار شدند. کاهش های دیگری در ایالت واشنگتن و خارج از ایالات متحده وجود داشت. اسناد داخلی بررسی‌شده توسط Business Insider نشان می‌دهد که بسته استاندارد بازپرداخت Salesforce به کارگران واجد شرایط ایالات متحده پیشنهاد می‌کند تا حداکثر 30 هفته حقوق پایه بر اساس سطح، مدت تصدی و سن دریافت کنند. بر اساس یک یادداشت داخلی که توسط Business Insider مشاهده شد، Salesforce این هفته همچنین پس از صرف هزاران دلار در ماه برای توکن ها در سه ماهه گذشته، بودجه هوش مصنوعی را برای کارمندان تعیین کرد. Salesforce سال پرتلاطمی را در میان نگرانی‌ها در مورد اینکه چگونه هوش مصنوعی بر مدل‌های تجاری نرم‌افزار سنتی تأثیر می‌گذارد، پشت سر گذاشته است. مدیرعامل", "image_url": "https://i.insider.com/6afcb25368dc6b6660b83df2?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۲۷ آبان • ۰۲:۴۴"}, {"source": "Business Insider", "title": "The US Navy used expired munitions against Iran in a workaround the top official compared to eating old bread", "link": "https://www.businessinsider.com/navy-fired-expired-munitions-during-iran-war-acting-secretary-says-2026-11", "summary": "The USS Delbert D. Black fires a Tomahawk missile during Operation Epic Fury. US Navy The Navy fired recoded, expired munitions during the Iran war, acting Navy Secretary Hung Cao said. Cao compared the practice to reviving stale bread with water and a microwave. The disclosure comes amid concerns about US missile stockpiles and production bottlenecks. The US Navy fired expired munitions during its war with Iran after changing their ammunition condition codes, the service's top civilian official told lawmakers Tuesday, comparing the practice to reviving stale bread with water and a microwave. Acting Navy Secretary Hung Cao made the disclosure during his Senate confirmation hearing Tuesday, as lawmakers questioned the Pentagon's heavy expenditure of costly precision weapons during Operation Epic Fury . \"A lot of the munitions we used in Epic Fury, we were able to recode those,\" Cao said. \"They were Code Echo, Code Foxtrot, which means they're expired.\" According to a Defense Logistics Agency manual, codes Echo and Foxtrot represent materiel currently unserviceable but that could otherwise undergo limited restoration or repair. Cao, a retired Navy captain and former explosive ordnance disposal officer, compared the practice to stretching food supplies. \"I came from a poor family,\" he said. \"Things like bread, doesn't expire. You just rub some water on it and microwave for 15 seconds, and it's good to go.\" Cao did not identify which particular munitions were recoded or how many were fired. Many of the precision weapons the US used in the Iran war cost millions of dollars each, potentially making the ability to restore and use older stock useful in a pinch. The disclosure came while responding to Sen. Deb Fischer, a Nebraska Republican, who asked whether the Navy was striking the right balance between expensive precision weapons and cheaper weapons that could be produced in mass numbers. Cao said the Navy had increased Tomahawk cruise missile production from roughly 125 annually during his military career to more than 60 a month now. Cao's remarks come after months of worry surrounding whether the Pentagon has adequate quantities of costly missiles and other munitions on hand. A Pentagon Inspector General report released in September cited findings from the Office of the Under Secretary for Acquisition and Sustainment that the munitions expenditures throughout the war with Iran had resulted in \"strategic inventory shortfalls and revealed industrial base bottle", "date_str": "2026-11-17T22:51:59+00:00", "hash": "e2f642d1a1310ed2", "tit r\" مجموع پخش ها: 1,003,121,503 28. The Man The Man. YouTube/Taylor Swift Album: \"Lover\" مجموع پخش ها: 1,052,500,683 27. Karma Karma. تیلور سوئیفت/آلبوم یوتیوب: \"نیمه های شب\" مجموع پخش ها: 1,057,613,144 26. ...آماده ای برای آن؟ ... آماده برای آن؟ آلبوم YouTube/Taylor Swift: \"Reputation\" مجموع پخش‌ها: 1,069,245,364 25. وحشی ترین رویاها (نسخه تیلور) تیلور سوئیفت در طول تیلور سویفت روی صحنه اجرا می کند | تور Eras در Caesars Superdome در 25 اکتبر 2024 در نیواورلئان، لوئیزیانا. اریکا گلدرینگ/TAS24/گتی ایماژ برای آلبوم مدیریت حقوق TAS: \"1989 (نسخه تیلور)\" مجموع پخش‌ها: 1,071,645,633 24. تیلور سویفت مسحور برای", "image_url": "https://i.insider.com/6af24a3980d4b24f18347d38?width=1200&format=jpeg", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۲۷ آبان • ۰۲:۰۷"}, {"source": "TechCrunch AI", "title": "Nvidia says it doesn’t plan to reappoint Jensen Huang as CEO", "link": "https://techcrunch.com/2026/11/17/nvidia-says-it-doesnt-plan-to-reappoint-jensen-huang-as-ceo/", "summary": "The former CEO offered to return to his top role at the company after his resignation last week.", "date_str": "2026-11-17T22:42:27+00:00", "hash": "4ab9084497b73062", "title_fa": "انویدیا می گوید قصد ندارد دوباره جنسن هوانگ را به عنوان مدیرعامل انتخاب کند", "summary_fa": "مدیر عامل سابق پس از استعفای خود در هفته گذشته پیشنهاد بازگشت به سمت اصلی خود در شرکت را داد. علیرغم پیشنهاد اخیر جنسن هوانگ، بنیانگذار و مدیر عامل سابق انویدیا برای بازگشت به شرکت تراشه ای که او در ساخت آن از پایه کمک کرد، این شرکت به دنبال پس گرفتن او نیست. در طی تماس با شرکت در روز سه‌شنبه، رئیس Nvidia، هاروی سی جونز به شنوندگان گفت که بازگشت هوانگ چیزی نیست که رهبری شرکت در نظر داشته باشد. جونز گفت، در 12 نوامبر، هیئت مدیره ما اعلام کرد که پس از افشای رفتار شخصی مغایر با قوانین رفتاری، استانداردها و هنجارهای فرهنگی شرکت، جنسن هوانگ داوطلبانه از سمت خود به عنوان رئیس، مدیرعامل و عضو هیئت مدیره استعفا داد. هیئت مدیره انویدیا به اتفاق آرا استعفای او را پذیرفت و قصد ندارد جنسن را به عنوان مدیرعامل بازگرداند.  که قبل از راه‌اندازی آن‌ها را آزمایش کرده‌اند، به دنبال دارند؟ ادامه مطلب", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI"], "datetime_fa": "۲۷ آبان • ۰۲:۰۳"}, {"source": "Ars Technica", "title": "Yet another satellite company is jockeying for a rocket—but this one makes sense", "link": "https://arstechnica.com/space/2026/11/yet-another-satellite-company-is-jockeying-for-a-rocket-but-this-one-makes-sense/", "summary": "Finnish satellite developer ICEYE announced Tuesday that it is seeking to buy Italian rocket-maker Avio for more than $2.2 billion in a transaction aimed at creating Europe's first true vertically integrated end-to-end space company. The announcement came as an all-cash voluntary tender offer from an Italian subsidiary of ICEYE to Avio's shareholders, led by the Italian defense conglomerate Leonardo. Avio said its board of directors \"has taken note of the notice\" from ICEYE and is considering the purchase offer. Avio builds the Vega C rocket, a solid-fueled launcher designed to carry up to 3.3 metric tons (7,300 pounds) of payload to low-Earth orbit. The Vega C has flown successfully seven times in eight attempts since 2022. It is a follow-on to an earlier version of the Vega rocket that amassed a 20-for-22 record since debuting in 2012. Read full article Comments", "date_str": "2026-11-17T22:44:46+00:00", "hash": "f862aa903d9f4b59", "title_fa": "با این حال، یک شرکت ماهواره‌ای دیگر به دنبال موشک است - اما این یکی منطقی است", "summary_fa": "توسعه دهنده ماهواره فنلاندی ICEYE روز سه شنبه اعلام کرد که به دنبال خرید موشک ساز ایتالیایی Avio به مبلغ بیش از 2.2 میلیارد دلار در معامله ای با هدف ایجاد اولین شرکت واقعی فضایی یکپارچه عمودی اروپا است. این اعلامیه به عنوان یک پیشنهاد مناقصه داوطلبانه تماماً نقدی از سوی یک شرکت تابعه ایتالیایی ICEYE به سهامداران Avio به رهبری شرکت دفاعی ایتالیایی لئوناردو منتشر شد. Avio گفت که هیئت مدیره آن \"اطلاعات ICEYE\" را مورد توجه قرار داده و در حال بررسی پیشنهاد خرید است. Avio موشک Vega C را می سازد، یک پرتابگر سوخت جامد که برای حمل حداکثر 3.3 تن (7300 پوند) محموله به مدار پایین زمین طراحی شده است. Vega C از سال 2022 در هشت بار موفق به پرواز شده است. این یک نسخه بعدی از موشک Vega است که از زمان عرضه در سال 2012 رکورد 20 به 22 را به دست آورد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید توسعه دهنده ماهواره فنلاندی ICEYE روز سه شنبه اعلام کرد که به دنبال خرید موشک ساز ایتالیایی Avio به قیمت بیش از 2.2 میلیارد دلار در معامله ای است که هدف آن ایجاد اولین شرکت فضایی واقعی در اروپا است. بر اساس گزارش اخیر سازمان همکاری و توسعه اقتصادی، ICEYE تا حد زیادی موفق ترین استارت آپ فضایی در اروپا است، جایی که دسترسی به سرمایه خصوصی، موانع نظارتی و بازارهای پراکنده اغلب مانع رشد استارتاپ ها می شود. ارزش ICEYE پس از آخرین دور جمع آوری کمک مالی شرکت در ماه ژوئن به بیش از 12 میلیارد دلار می رسد.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/VV28_Decollage_plan_large_ZLV-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۷ آبان • ۰۲:۱۴"}, {"source": "Ars Technica", "title": "Hundreds of websites deliver potent malware cocktail to unsuspecting visitors", "link": "https://arstechnica.com/security/2026/11/malicious-code-delivered-through-optimizely-hits-visitors-to-hundreds-of-sites/", "summary": "Hundreds of websites using the Optimizely website personalization platform served unsuspecting visitors a potent malware cocktail that targeted cryptocurrency wallets, stole payment card data, cookies, and screenshots, and delivered exploit kits for infecting iPhones and iPads, researchers said Tuesday. ReportURI said it identified 178 websites—including CNN, Zoom, the BBC, and Salesforce—that were affected. JavaScript digitally signed by Optimizely and then loaded into customer pages had been modified to include malicious components that attempted to infect visitor devices with multiple payloads. When wares were installed successfully, they swapped user cryptocurrency wallet addresses for the attackers. Other components skimmed payment cards, stole cookies and screenshots, and, on iPhones and iPads, delivered iOS exploit kits known as Coruna and DarkSword. Optimizely infrastructure delivers multipurpose malware Optimizely serves JavaScript “snippets” that include both company code and code that is provided by each customer. The JavaScript, which can be served directly from Optimizely or from a customer endpoint, runs on every page the customer serves. Somehow, the attackers wrote their own code into a portion of each affected customer’s JavaScript and then delivered it from cdn.optimizely.com. A valid certificate for that domain signed the JavaScript. Read full article Comments", "date_str": "2026-11-17T22:32:16+00:00", "hash": "4aa2adebd278e6ef", "title_fa": "صدها وب سایت کوکتل بدافزار قوی را به بازدیدکنندگان ناآگاه ارائه می کنند", "summary_fa": "به گفته محققان، صدها وب‌سایت با استفاده از پلتفرم شخصی‌سازی وب‌سایت Optimizely، یک کوکتل بدافزار قوی را به بازدیدکنندگان ناشناس ارائه کردند که کیف پول‌های رمزنگاری‌شده را هدف قرار می‌داد، داده‌های کارت پرداخت، کوکی‌ها و اسکرین‌شات‌ها را به سرقت می‌برد و کیت‌های بهره‌برداری را برای آلوده کردن آیفون‌ها و آی‌پدها تحویل می‌داد. ReportURI گفت 178 وب سایت از جمله CNN، Zoom، BBC و Salesforce را شناسایی کرده است که تحت تأثیر قرار گرفته اند. جاوا اسکریپت که به صورت دیجیتالی توسط Optimizely امضا شده و سپس در صفحات مشتری بارگذاری می‌شود، به گونه‌ای اصلاح شده است که شامل اجزای مخربی باشد که سعی می‌کنند دستگاه‌های بازدیدکننده را با بارهای متعدد آلوده کنند. زمانی که نرم افزارها با موفقیت نصب شدند، آدرس کیف پول ارزهای دیجیتال کاربران را با مهاجمان تعویض کردند. سایر مؤلفه‌ها کارت‌های پرداخت را کم‌کم می‌کردند، کوکی‌ها و اسکرین‌شات‌ها را می‌دزدیدند، و در آیفون‌ها و آی‌پدها، کیت‌های بهره‌برداری iOS معروف به Coruna و DarkSword را تحویل می‌دادند. Optimizely زیرساخت بدافزار چندمنظوره را ارائه می‌کند. Optimizely «قطعات» جاوا اسکریپت را ارائه می‌کند که شامل کد شرکت و کد ارائه‌شده توسط هر مشتری است. جاوا اسکریپت که می تواند مستقیماً از Optimizely یا از نقطه پایانی مشتری ارائه شود، در هر صفحه ای که مشتری ارائه می دهد اجرا می شود. به نوعی، مهاجمان کد خود را در بخشی از جاوا اسکریپت هر یک از مشتریان تحت تأثیر قرار می‌دادند و سپس آن را از cdn.optimizely.com تحویل می‌دادند. یک گواهی معتبر برای آن دامنه جاوا اسکریپت را امضا کرد. خواندن مقاله کامل نظرات تنظیمات متن اندازه متن داستان کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل رساندن صدها وب سایت با استفاده از پلت فرم شخصی سازی وب سایت Optimizely یک کوکتل بدافزار قوی را به بازدیدکنندگان ناآگاه ارائه", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/malicious-website-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Apple", "امنیت سایبری"], "datetime_fa": "۲۷ آبان • ۰۲:۰۲"}, {"source": "Engadget", "title": "NVIDIA's board chair says the company is not considering reinstating Jensen Huang as CEO", "link": "https://www.engadget.com/2319982/nvidias-board-chair-says-the-company-is-not-considering-reinstating-jensen-huang-as-ceo/", "summary": "NVIDIA s board chair said it doesn t want Jensen Huang back in the CEO role during the company s first earnings call since his resignation.", "date_str": "2026-11-17T22:21:27+00:00", "hash": "a3eb8ef3280557c9", "title_fa": "رئیس هیئت مدیره انویدیا می گوید این شرکت در نظر ندارد جنسن هوانگ را به عنوان مدیرعامل بازگرداند.", "summary_fa": "رئیس هیئت مدیره انویدیا اعلام کرد که نمی‌خواهد جنسن هوانگ در اولین تماس با شرکت از زمان استعفای خود به عنوان مدیر عامل شرکت بازگردد. Heather Diehl/Getty Images افزودن Engadget به Google: منبع برگزیده Google Discover هاروی جونز، رئیس هیئت مدیره اخیراً منصوب شده NVIDIA، روز سه شنبه به فراخوان درآمد سه ماهه سوم این شرکت پیوست تا در مورد استعفای جنسن هوانگ اظهار نظر کند. علیرغم اینکه مدیر عامل سابق احتمال بازگشت احتمالی به موقعیت قبلی خود را مطرح کرد، هاروی این احتمال را رد کرد و گفت که هیئت مدیره در حال بررسی مجدد هوانگ نیست. جونز بعداً گفت که او و کولت کرس، مدیرعامل موقت جدید شرکت، به هیچ سوالی در رابطه با هوانگ پاسخ نخواهند داد. جونز گفت: «در 12 نوامبر، هیئت مدیره ما اعلام کرد که پس از افشای رفتار شخصی مغایر با قوانین رفتاری، استانداردها و هنجارهای فرهنگی شرکت، جنسن هوانگ داوطلبانه از سمت خود به عنوان رئیس، مدیرعامل و عضو هیئت مدیره استعفا داد. هیئت مدیره NVIDIA به اتفاق آرا استعفای او را پذیرفت و قصد ندارد جنسن را به عنوان مدیرعامل بازگرداند. در طول این تماس، کرس گفت که این شرکت کارمندان خود را در اولویت قرار داده است. او گفت: \"ما از کارکنان خود در طول این انتقال مراقبت خواهیم کرد تا مطمئن شویم که آنها ایمن هستند و مطمئن شویم که کار می تواند در محیط فعلی انجام شود.\" و در حالی که او مستقیماً به هوانگ یا استعفای او اشاره نکرد، گفت که \"همچنین زمانی وجود دارد که در مورد رهبری خود و اهمیت رهبری ما در سراسر این سازمان فکر کنیم.\" با این حال، او سعی کرد تا تماس را بر سه ماهه پرفروش NVIDIA متمرکز کند و گفت که \"از دیدگاه [یک] تجارت، تجارت طبق معمول است\" برای غول تراشه.", "image_url": "https://www.engadget.com/img/gallery/nvidias-board-chair-says-the-company-is-not-considering-reinstating-jensen-huang-as-ceo/l-intro-1794956015.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Nvidia", "تراشه"], "datetime_fa": "۲۷ آبان • ۰۱:۵۱"}, {"source": "Engadget", "title": "Waymo is pausing all freeway rides after California DMV says the robotaxis are 'imminent hazard to public safety'", "link": "https://www.engadget.com/2319947/waymo-is-pausing-all-freeway-rides-after-california-dmv-says-the-robotaxis-are-imminent-hazard-to-public-safety/", "summary": "Restrictions were made by California s DMV after a driverless Waymo was caught trying to pass a Highway Patrol vehicle that was slowing traffic.", "date_str": "2026-11-17T21:57:49+00:00", "hash": "04a349d9709da1c6", "title_fa": "Waymo تمام مسیرهای سواری در بزرگراه را پس از اینکه کالیفرنیا DMV اعلام کرد رباتاکسی ها \"خطر قریب الوقوع برای امنیت عمومی\" هستند را متوقف می کند.", "summary_fa": "محد -plans-to-reinstate-jensen-huang/", "summary": "Despite pressure from President Trump, Elon Musk, and Silicon Valley executives, Nvidia’s board says it “does not intend” to reinstate the company’s ousted CEO.", "date_str": "2026-11-17T22:19:19+00:00", "hash": "90a6a34c197935df", "title_fa": "هیئت مدیره انویدیا هیچ برنامه ای برای بازگرداندن جنسن هوانگ ندارد", "summary_fa": "علیرغم فشارهای رئیس جمهور ترامپ، ایلان ماسک و مدیران سیلیکون ولی، هیئت مدیره انویدیا می گوید که \"نمی خواهد\" مدیر عامل برکنار شده شرکت را بازگرداند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان همانطور که انویدیا درآمد سه ماهه سوم خود را در روز سه شنبه گزارش داد، عملکرد مالی شرکت تحت الشعاع درام پیرامون مدیرعامل سابقش قرار گرفت. و هیئت مدیره انویدیا بلافاصله یک چیز را روشن کرد: جنسن هوانگ برنمی‌گردد. هاروی جونز، رئیس هیئت مدیره انویدیا، در آغاز تماس با درآمد، بر قدرت و \"فناوری پیشگامانه\" شرکت تاکید کرد، قبل از اینکه به شرایط پیرامون خروج هوانگ بپردازد. جونز گفت: «در 12 نوامبر، هیئت مدیره ما اعلام کرد که پس از افشای رفتار شخصی مغایر با قوانین رفتاری، استانداردها و هنجارهای فرهنگی شرکت، Jesnen Huang داوطلبانه از سمت خود استعفا داد ... و هیئت مدیره به اتفاق آرا استعفای او را پذیرفت و قصد بازگرداندن Jensen را ندارد. این یک داستان در حال توسعه است. لطفا برای به روز رسانی دوباره بررسی کنید. نتایج جستجوی بهتری می خواهید؟ WIRED را به یک منبع ترجیحی در Google تبدیل کنید", "image_url": "https://media.wired.com/photos/6afccb299b8ae6ebe897d1d7/191:100/w_1280,c_limit/2026-11-12T153402Z_941150596_RC2X6I9AZJQN_RTRMADP_3_NVIDIA-CEO-COLETTE-KRESS.JPG", "category": "هوش مصنوعی مولد", "tags": ["Google", "Nvidia"], "datetime_fa": "۲۷ آبان • ۰۱:۴۹"}, {"source": "Business Insider", "title": "LeBron James sues AI sports-betting analytics app over alleged bogus endorsement", "link": "https://www.businessinsider.com/lebron-sues-ai-sports-betting-analytics-app-fake-endorsement-2026-11", "summary": "LeBron James is suing PlayVision. Mitchell Leff/Getty Images LeBron James is suing PlayVision, saying its Bron app illegally used his name and likeness. The lawsuit says PlayVision illegally traded on James' identity to unjustly enrich itself. \"Defendants selected the name 'Bron' precisely to evoke Mr. James,\" the lawsuit alleges. NBA legend LeBron James is taking an AI sports-betting analytics app dubbed Bron to court, accusing the startup behind the tool of stealing his name and likeness to make consumers believe he endorsed it. James' lawsuit, filed Tuesday in Manhattan federal court by celebrity attorney Alex Spiro , alleges that PlayVision, the Y Combinator-backed company behind the app, illegally traded on the basketball star's identity to unjustly enrich itself. \"Defendants selected the name 'Bron' precisely to evoke Mr. James, to trade on his fame and goodwill, and to falsely suggest to the public that Mr. James endorsed or was affiliated with the Bron App,\" the lawsuit says. In addition to PlayVision, the company's founders, Mark Zogby and Anish Gupta — the CEO — are also named as defendants in the lawsuit. Representatives for PlayVision did not immediately respond to a request for comment by Business Insider. The lawsuit points to a November advertisement that it says was built around an AI-generated version of James in a No. 23 jersey bearing his \"Bron\" nickname and sporting tattoos that mimicked his. \"Speaking in Mr. James's voice, the AI-generated Mr. James scrolls through wagers on other NBA players in Defendants' Bron App. The Ad then urges viewers to 'Scroll to bet,'\" says the lawsuit, which alleges trademark infringement. The ad \"catapulted the Bron App from obscurity to controversy, with the Ad gaining a million views within a day—exactly as Defendants intended. But Mr. James has no affiliation with Defendants or their product,\" the lawsuit says. The complaint alleges that the defendants violated James' rights and treated the violation as a \"marketing expense.\" When James' attorneys sent the company a cease-and-desist letter, the lawsuit says the startup used it as an opportunity to \"gin up additional publicity, taking down the Ad while teasing 'a new name' without delivering one and daring Mr. James to file a lawsuit.\" The lawsuit, which seeks a jury trial and an unspecified amount of monetary damages, said James is \"one of the most recognizable identities in the world\" and that he commands tens of millions of dollars in fees for endorsi", "date_str": "2026-11-17T22:01:23+00:00", "hash": "6114631f44e9aea6", "title_fa": "لبرون جیمز از برنامه تحلیلی شرط بندی ورزشی هوش مصنوعی به دلیل تایید جعلی شکایت کرد", "summary_fa": "لبرون جیمز از PlayVision شکایت کرد. Mitchell Leff/Getty Images لبرون جیمز از PlayVision شکایت کرد و گفت که برنامه Bron آن به طور غیرقانونی از نام و شباهت او استفاده کرده است. این شکایت می گوید که PlayVision به طور غیرقانونی با هویت جیمز معامله کرده است تا به ناحق خود را غنی کند. در این دادخواست آمده است: «مدافعان نام «برون» را دقیقاً برای یادآوری آقای جیمز انتخاب کردند. لبرون جیمز، اسطوره NBA، یک اپلیکیشن تجزیه و تحلیل شرط‌بندی ورزشی هوش مصنوعی به نام Bron را به دادگاه می‌کشد و استارت‌آپ پشت ابزاری را متهم می‌کند که نام و شباهت او را به سرقت برده است تا مشتریان باور کنند که او آن را تایید کرده است. شکایت جیمز که روز سه‌شنبه توسط وکیل مشهور الکس اسپیرو در دادگاه فدرال منهتن تنظیم شد، ادعا می‌کند که PlayVision، شرکت تحت حمایت Y Combinator در پشت برنامه، به طور غیرقانونی با هویت ستاره بسکتبال معامله کرده است تا به‌طور ناعادلانه خود را غنی کند. در دادخواست می‌گوید: «مدافعان نام «برون» را دقیقاً برای برانگیختن آقای جیمز، تجارت بر سر شهرت و حسن نیت او، و به دروغ به مردم پیشنهاد می‌کنند که آقای جیمز برنامه برون را تأیید کرده یا به آن وابسته است، انتخاب کرده‌اند. علاوه بر PlayVision، بنیانگذاران این شرکت، مارک زوگبی و آنیش گوپتا - مدیر عامل - نیز به عنوان متهم در این دعوی نام برده می شوند. نمایندگان PlayVision بلافاصله به درخواست اظهار نظر توسط Business Insider پاسخ ندادند. این دادخواست به تبلیغی در ماه نوامبر اشاره می‌کند که می‌گوید حول نسخه‌ای از جیمز که توسط هوش مصنوعی ساخته perating and testing on highways, citing three incidents in which Waymo's robotaxis \"entered an active construction closure.\" The restriction took effect on November 11. The restriction will remain in place until Waymo demonstrates to the DMV that it has taken effective corrective actions to address the problems that prompted it. \"The Department determined that Waymo's driverless freeway operations pose an imminent hazard to public safety due to recurring incursions by its vehicles into active construction zones where construction workers, vehicles and equipment are present, despite a prior restriction and corrective actions implemented following similar incidents that occurred on May 18, 2026,\" a DMV spokesperson said. A Waymo spokesperson said that the recent incidents did not involve injuries or collisions and that, while the DMV order only limits freeway operations in California, the company will temporarily pause highway operations nationwide. \"We are working with the California DMV and other state officials diligently and responsibly to resume freeway operations,\" the spokesperson said. As the DMV points out, the restrictions come several months after Waymo tried to address this exact issue. In May, Waymo said it self-suspended highway operations to improve how its autonomous cars behaved around construction zones. On July 29, Waymo announced that it was \"gradually resuming\" freeway routes. The company told TechCrunch at the time that it had implemented \"software updates designed to improve the performance around freeway construction zones.\" The updates appeared insufficient to prevent the latest incidents. The DMV spokesperson cited two cases in which Waymo entered an active construction closure: one on ", "date_str": "2026-11-17T21:17:12+00:00", "hash": "cdae212b2c1dd5c8", "title_fa": "Waymo همچنان در مسیریابی مناطق ساخت‌وساز در بزرگراه‌ها با مشکلاتی مواجه است", "summary_fa": "Waymo قبلاً عملیات بزرگراه را برای رفع مشکلات مربوط به مناطق ساخت و ساز onds? The main difference is where they come from. Natural diamonds are mined from the earth, while lab-grown diamonds are grown in a lab using technology that recreates the conditions under which diamonds form. Lab-grown diamonds usually cost less, which means you can often get a larger carat size for the same budget. Shop all discounted diamond jewelry at Macy's . Shopping for more discounts today? Check out our roundup of all the best early Black Friday deals . Read ", "date_str": "2026-11-17T21:04:08+00:00", "hash": "a6cc876d785adf72", "title_fa": "جواهرات الماس میسی 50 تا 80 درصد تخفیف دارند و قیمت آن از 100 دلار شروع می شود.", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید معاملات جواهرات الماس Macy's Macy در حال حاضر 50 تا 80 درصد تخفیف دارند و به ندرت الماس هایی با این قیمت پایین مشاهده می کنیم. اگر در این فصل تعطیلات به دنبال هدیه ای برای شخصی خاص هستید، این فرصتی عالی برای دریافت یک هدیه لوکس با قیمتی شگفت آور مناسب است. حتی می توانید جواهرات الماس را با قیمت زیر 100 دلار پیدا کنید. تمام جواهرات الماس با تخفیف را در میسی بخرید، از جمله دستبندهای تنیس، حلقه های نامزدی، گل میخ های الماس، و آویزهای یک نفره. چیزی در مورد باز کردن یک جعبه جواهرات کوچک وجود دارد که هرگز قدیمی نمی شود. یک جفت گل میخ الماس، یک آویز ساده یا یک دستبند تنیس نوعی هدیه است که بدون نیاز به دانستن سایز یا استایل دقیق شخصی، احساسی هیجان‌انگیز و شخصی به شما می‌دهد - و با این قیمت‌ها، می‌توانید بدون خرج کردن چهار رقمی چیزی خاص بدهید. بعلاوه، اگر در حال برنامه ریزی برای پیشنهاد تعطیلات هستید، هزاران حلقه نامزدی در دسترس است - از جمله یک حلقه الماس دو قیراطی که در آزمایشگاه رشد کرده و تنها 200 دلار است. در اینجا برخی از معاملات برجسته از این فروش برجسته وجود دارد. برای معاملات در همه دسته‌ها، مرکز معاملات جمعه سیاه ما را بررسی کنید. بهترین جواهرات الماس در فروش در پرسش و پاسخ میسی در فروش جواهرات الماس میسی آیا می توانید جواهرات الماس را به میسی برگردانید؟ جواهرات نفیس تا زمانی که در شرایط اصلی با برچسب قیمت ضمیمه شده ns on technology now. We used to have backup systems. And the backup systems are overwhelmed by the new systems now.\" Then Mullin told Fox viewers that they should \"breathe.\" And be assured that the US is probably not under a cyber attack — something he felt \"98%\" confident about. I would very much like to live in a world where a top federal official doesn't muddle through national news interviews about outages. I would very much like to live in a world where the administration hadn't spent much of last year telling us the federal government was incompetent and should be radically downsized . Because sometimes we really want the federal government — not \"one guy\" — to be able to tell us what's actually happening inside these complicated systems, and what should be done about it. But I also think we'd have these exact same problems if we had the most competent, well-meaning public servants in charge right now. That's because all of this stuff is gnarly and complicated. Long before the AI boom, we've had technologists pointing out how rickety and poorly maintained much of America's d", "date_str": "2026-11-17T21:00:26+00:00", "hash": "5de2c12285ec32fe", "title_fa": "شاید تمام قطعی ها به دلیل هوش مصنوعی باشد. شاید نه. ما در زمان گیج کننده ای هستیم.", "summary_fa": "مارکوین مولین، رئیس وزارت امنیت داخلی، می‌گوید نرم‌افزار جدید هوش مصنوعی ممکن است مقصر موجی از قطع شدن رایانه باشد. Shawn Thew/EPA/Bloomberg از طریق Getty Images هی! چه خبر از این همه قطعی؟ آیا آنها نسبتی دارند؟ این یک سوال معقول است، حتی برای افرادی که از تئوری های توطئه اجتناب می کنند. به نظر می رسد که دولت فدرال واقعاً نمی داند. شنیدن آن ناامیدکننده است - و چیزی که باید به شنیدن آن عادت کنیم. آیا هوش مصنوعی باعث شد که دولت ایالات متحده تمام سفرهای هوایی را در روز جمعه تعطیل کند؟ دولت ایالات متحده می گوید که ممکن است. همچنین، شاید نه. چه کسی می داند؟ اما نگران نباشید. این پاسخ گیج کننده ای از وزیر امنیت داخلی، مارکوین مولین است. او روز دوشنبه در فاکس نیوز رفت و گفت که زمین‌گیری سراسری در هفته گذشته 5403/chance-xbox-series-x-plugged-into-wrong-hdmi-port/", "summary": "Make sure you re getting the most out of your Xbox Series X, starting with a port check.", "date_str": "2026-11-17T21:00:00+00:00", "hash": "d58fd63308aadb9b", "title_fa": "این احتمال وجود دارد که Xbox Series X شما به پورت HDMI اشتباهی وصل شده باشد", "summary_fa": "مطمئن شوید که از Xbox Series X خود بیشترین بهره را می برید، با بررسی پورت شروع کنید. مطمئن شوید که بیشترین بهره را از Xbox Series X خود می برید. Proxima Studio/Shutterstock Add Engadget on Google: Preferred Source Google Discover این در ابتدا یک پیشنهاد احمقانه به نظر می رسد، درست است؟ مطمئناً تنها کاری که باید انجام دهید این است که کابل HDMI را که همراه با سری X شما ارائه می شود به تلویزیون خود وصل کنید و آماده لذت بردن از بهترین بازی های Xbox خواهید بود، نه؟ همیشه به این سادگی نیست. اگرچه تلویزیون فعلی شما ممکن است از HDMI 2.1 پشتیبانی کند، ورودی ای که تضمین می کند سری X می تواند حداکثر وضوح و نرخ فریم خود را نشان دهد، این بدان معنا نیست که همه پورت های تلویزیون شما مطابق با 2.1 هستند. این آخرین استاندارد با وضوح بالا واقعاً اهمیت دارد، زیرا بدون آن، ویژگی‌های بصری پیشرفته مانند نرخ تجدید متغیر متغیر از جدول خارج می‌شوند. دانستن مشخصات تلویزیون فعلی شما بسیار مهم است. برای مثال، اگر مدل قدیمی‌ای است که فقط از HDMI 2.0 پشتیبانی می‌کند، می‌توانید اکنون خواندن این مقاله را متوقف کنید و به خروجی بالای 1440p/120 fps یا 4K/60 fps از سری X خود بسنده کنید. با این حال، اگر صاحب یک صفحه‌نمایش تخت نیمه‌مدرن هستید، احتمال خوبی وجود دارد که پورت‌های قابل انطباق با HDMI 1 تنها با یک یا دو پورت HDMI at2 باشد. 4K/120 فریم در ثانیه و VRR با نرخ فریم صاف از Xbox. بیایید کمی بهتر سوکت‌های HDMI تلویزیون خود را بشناسیم، در مورد اینکه آیا باید کابلی را که در جعبه همراه سری X ارائه می‌شود، ارتقا دهید یا خیر، بحث کنیم و به این موضوع بپردازیم که چرا HDMI 2.1 برای بازی‌های نسل فعلی بسیار مهم است. Mulad Images/Shutterstock احتمالاً،", "image_url": "https://www.engadget.com/img/gallery/theres-a-chance-your-xbox-series-x-is-plugged-into-the-wrong-hdmi-port/l-intro-1794516377.jpg", "category": "فناوری و نوآوری", "tags": ["Google"], "datetime_fa": "۲۷ آبان • ۰۰:۳۰"}, {"source": "Zoomit", "title": "ارتش آمریکا ربات‌های جنگی را به شکار گروهی فرستاد", "link": "https://www.zoomit.ir/robotics-smart-machines/471254-darpa-autonomous-war-robots-test/", "summary": "پنتاگون تاکتیک رزمی شکار گروهی را با استفاده از چهار خودروی زمینی خودران و مجهز به پهپاد آزمایش کرد.", "date_str": "2026-11-17T21:40:00+00:00", "hash": "d4f516c139b01efe", "title_fa": "ارتش آمریکا ربات‌های جنگی را به شکار گروهی فرستاد", "summary_fa": "پنتاگون تاکتیک رزمی شکار گروهی را با استفاده از چهار خودروی زمینی خودران و مجهز به پهپاد آزمایش کرد. تبلیغات پنتاگون کارآمدی گروهی از خودروهای زمینی بدون سرنشین (UGV) را در شرایط شبیه‌سازی‌شده‌ی نبرد مورد آزمایش قرار داد. در جریان این رزمایش که اواسط اکتبر (مهر و آبان) در منطقه‌ی سنت ویت واقع در پایگاه فورت ناکس ایالت کنتاکی برگزار شد، چهار ربات زمینی به‌صورت گروهی برای پایش ناهمواری‌ها و کشف نیروهای دشمن وارد عملیات شدند. تمرین نظامی مذکور به درخواست متحدان اروپایی برنامه‌ریزی شد تا شرایط اقلیمی مشابه با جغرافیای اروپا ارزیابی شود. ساختار ماژولار خودروها امکان نصب انواع تسلیحات تاکتیکی و سامانه‌های پیشرفته را روی بدنه فراهم می‌کند. ۰:۰۰ / ۰:۰۰ لایک جیسون گرگوری ، مشاور فنی دارپا، می‌گوید : «در فورت ناکس بررسی می‌کنیم که چگونه فناوری تحرک خودران می‌تواند با محموله‌های مختلف ترکیب شود تا قابلیت‌های جدیدی در اختیار نیروهای رزمی قرار دهد.» در سناریوی عملیاتی، یک هدایت‌گر انسانی داده‌های اولیه‌ی تهدید فرضی را به‌همراه تصاویر ماهواره‌ای دریافت کرد و کاروان ربات‌ها را به‌سمت منطقه فرستاد. یکی از خودروها برای شناسایی جلوتر از بقیه حرکت کرد و سه دستگاه دیگر در موقعیت پشتیبانی مستقر شدند. خودروی پیشرو مجهز به پهپاد بود و سه دستگاه از چهار ربات حاضر نیز توانایی حمل و پرواز پهپاد برای شناسایی هوایی یا حمله را داشتند. پس از بررسی منطقه توسط ربات شناسایی، بقیه‌ی واحدها پوشش میدانی را برقرار کردند و یک راکت شبیه‌سازی‌شده به‌سمت هدفی در فاصله‌ی حدود ۲۷۴ متری شلیک شد. در پایان، آخرین ربات از پشت یک برآمدگی خارج شد تا پیامدهای درگیری را ارزیابی کند. تمامی مراحل جابه‌جایی و ردیابی اهداف به‌صورت مستقل انجام گرفت، اما شلیک سلاح منوط به تأیید کاربر انسانی باقی ماند. گرگوری می‌گوید: «تمام تحرک، تمام جابه‌جایی‌ها و تمام شناسایی‌ها کاملا خودران هستند، اما آن‌ها تا زمانی که انسان دستور شلیک ندهد، ماشه", "image_url": "https://api2.zoomit.ir/media/us-army-combat-ugv-robots-6afac00f2314debea39c0891?w=1920&q=75", "category": "موسیقی و هنر", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۷ آبان • ۰۱:۱۰"}, {"source": "Lifehacker", "title": "Why Do AI Posters All Look Like That?", "link": "https://lifehacker.com/tech/why-do-ai-posters-all-look-like-that?utm_medium=RSS", "summary": "You know the look by now. Every poster for a business or event has pictures of uncanny-looking people, buildings that don t look right, and always that one font . But why? If generative AI is supposedly able to think and be creative, why do so many of its results come out looking exactly the same? The answer is complicated, and it has to do with what chatbots define as thinking. At this point, gone are the days of chatbots like ChatGPT, Claude, or Gemini simply generating text immediately in response to a prompt. Some very fast models do, but most employ what s known as thinking models , which are a bit of a misnomer. The thinking really just consists of generating a set of sub-prompts before executing the main one. And it s in that hidden, generated text that most of the choices (to the extent that we can call the statistical output of an AI model a choice ) occur that determine how a design looks. The hidden design brief behind every AI poster To borrow a classic and implausible example , if you were to give an AI chatbot the instruction Make a peanut butter and jelly sandwich, it would start by generating step-by-step instructions on how to make the sandwich before trying to make one (if it could). Most of this happens invisibly in the background, and many proprietary chatbots won t show you their in-process thinking prompts even if you ask. In the case of an AI poster, it might break down make a poster into smaller steps such as create a design brief for a poster. To demonstrate this while doing some testing for this piece, I added additional prompts for ChatGPT to explain the design briefs it generated, which included details like layout, colors, and typography. The problem is those instructions are still subject to the same flaws as any other AI-generated text. They can t properly fact-check; they can t walk into the real world and see the thing they re describing; and they can hallucinate or fall back on stale formats that become easy to notice after a while. For example, while testing, I had ChatGPT generate a poster for a Lifehacker-themed nightclub. In every case, the underlying brief it generated outlined some basic details, but occasionally it added things I hadn t asked for. This included additional text, iconography, and in one case it even added the design brief explanation I had requested as the bottom half of the poster. Those mistakes filter into the final product, when the brief is then fed into the image generator that ultimately makes ", "date_str": "2026-11-17T21:30:00+00:00", "hash": "e836dc6fe1611757", "title_fa": "چرا پوسترهای هوش مصنوعی همه اینطور به نظر می رسند؟", "summary_fa": "شما تا الان قیافه را می شناسید. هر پوستری برای یک کسب و کار یا رویداد دارای عکس هایی از افراد عجیب و غریب، ساختمان هایی است که درست به نظر نمی رسند، و همیشه یک فونت دارد. اما چرا؟ اگر ظاهراً هوش مصنوعی مولد قادر به فکر کردن و خلاقیت است، چرا بسیاری از نتایج آن دقیقاً مشابه به نظر می رسد؟ پاسخ پیچیده است، و به آنچه چت بات ها به عنوان تفکر تعریف می کنند مربوط می شود. در این مرحله، روزهای چت ربات هایی مانند ChatGPT، Claude یا Gemini که به سادگی در پاسخ به یک درخواست بلافاصله متن تولید می کردند، گذشته است. برخی از مدل‌های بسیار سریع این کار را انجام می‌دهند، اما بیشتر آن‌ها از مدل‌های فکری استفاده می‌کنند که کمی اشتباه هستند. تفکر واقعاً شامل ایجاد مجموعه ای از دستورات فرعی قبل از اجرای دستور اصلی است. و در آن متن مخفی و تولید شده است که بیشتر انتخاب‌ها (تا جایی که بتوانیم خروجی آماری یک مدل هوش مصنوعی را انتخاب بنامیم) رخ می‌دهد که نحوه ظاهر یک طرح را تعیین می‌کند. خلاصه طراحی پنهان پشت هر پوستر هوش مصنوعی برای قرض گرفتن یک مثال کلاسیک و غیرقابل قبول، اگر به یک ربات چت هوش مصنوعی دستور تهیه ساندویچ کره بادام زمینی و ژله را بدهید، با ایجاد دستورالعمل های گام به گام در مورد نحوه درست کردن ساندویچ قبل از تلاش برای تهیه آن (اگر می تواند) شروع می شود. بیشتر این موارد به‌طور نامرئی در پس‌زمینه اتفاق می‌افتد، و بسیاری از ربات‌های چت اختصاصی حتی اگر بپرسید، اعلان‌های تفکر در فرآیند خود را به شما نشان نمی‌دهند. در مورد یک پوستر هوش مصنوعی، ممکن است یک پوستر را به مراحل کوچکتر تقسیم کند، مانند ایجاد یک طرح مختصر برای یک پوستر. برای نشان دادن این موضوع در حین انجام برخی", "image_url": "https://lifehacker.com/imagery/articles/01M7BAY49JQKM90PJX9YB0W7JY/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Google"], "datetime_fa": "۲۷ آبان • ۰۱:۰۰"}, {"source": "Lifehacker", "title": "These Are the Best Early Black Friday 2026 Deals on Samsung Devices", "link": "https://lifehacker.com/tech/these-are-the-best-early-black-friday-deals-on-samsung-devices?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Black Friday might be a couple of weeks away, but Samsung is rolling out the discounts early, with deals on its entire lineup of devices, including smartphones, tablets, laptops, and wearables. While not all of these early Black Friday offers are true discounts, you can find ways to save money on some devices through these promotions. Here's what Samsung's offering ahead of the official Black Friday discounts . Best early Black Friday deals on Samsung smartphones Samsung is offering some decent discounts on both its flagship smartphones and its midrange and budget lines. However, as part of its early Black Friday sale, t ace on campus earlier this year. Co-organized by MITHIC, SHASS, SERC, and the MIT Generative AI Impact Consortium (MGAIC), the event featured presentations and panels concentrating on jobs, democracy, and AI. On campus, the report on AI and education warned that AI is eroding the “creative friction” that has long defined an MIT education: students debating ideas and challenging one another, their professors, and their teaching assistants, in class and out of it. MITHIC faculty co-lead Seth Mnookin , a science writing professor and head of Comparative Media Studies Program/Writing (CMS/W), said, “The report wasn’t saying that AI is here and we all need to adapt. It was saying that we need to be asking more fundamental questions.” “When the United States entered World War II in 1941, the Institute’s newly minted scientists and engineers helped shape that era through science and technology,” Mnookin sai", "date_str": "2026-11-17T20:40:00+00:00", "hash": "83c75f6726ae19d2", "title_fa": "توجه به هوش مصنوعی، جامعه و بشریت", "summary_fa": "دانشجویان MIT کمتر به ساعات اداری می روند. آنها زمان کمتری را صرف کار روی مجموعه‌های مشکل و با یکدیگر می‌کنند. اینها از جمله یافته‌های گزارش اخیر MIT در مورد هوش مصنوعی و آموزش بودند، و یکی از دلایلی است که تعداد فزاینده‌ای از اساتید دانشگاه MIT نگران این هستند که چگونه هوش مصنوعی مولد نحوه کار افراد را تغییر می‌دهد و بر نحوه تفکر، یادگیری و ارتباط آنها با یکدیگر تأثیر می‌گذارد. برای MIT Human Insight Collaborative (MITHIC)، این سوالات به کانون اصلی تبدیل شده‌اند، و MITHIC با همکاران در سراسر موسسه، از جمله مسئولیت‌های اجتماعی و اخلاقی محاسبات (SERC)، کار می‌کند تا به MIT کمک کند تا به آنها رسیدگی کند. MITHIC که در سال 2024 به عنوان یک ابتکار استراتژیک راه اندازی شد، دانشمندان، هنرمندان، مربیان و محققان را گرد هم می آورد تا ابعاد انسانی چالش های تعیین کننده زمان ما را بررسی کنند. از زمان راه اندازی، MITHIC از 67 پروژه در 31 واحد MIT پشتیبانی کرده است که در مجموع 5.5 میلیون دلار بودجه ارائه کرده است. تقریباً یک سوم این پروژه‌ها بر هوش مصن ory": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۲۷ آبان • ۰۰:۰۰"}, {"source": "Ars Technica", "title": "“Trump was in bed with Jensen”: Critics balk at Huang’s wish to return to Nvidia", "link": "https://arstechnica.com/tech-policy/2026/11/trump-was-in-bed-with-jensen-critics-balk-at-huangs-wish-to-return-to-nvidia/", "summary": "On Monday, large trucks began circling the streets of Washington, DC, carrying billboards urging Congress to investigate the Trump administration’s ties with Nvidia’s disgraced CEO Jensen Huang. “Jensen was in bed with a spy from China,” the billboards created by the Tech Oversight Project (TOP) alleged. “Trump was in bed with Jensen.” TOP is a nonprofit that describes itself as “dedicated to reining in Big Tech.” Currently, Trump is supporting a campaign to bring back Huang as Nvidia’s CEO—despite many Republicans calling it a “ horrible idea. \" Breaking his silence, Huang issued a statement Tuesday saying he would be “honored” to return, but the board said reinstatement is not under consideration as an internal investigation into US spying claims remains ongoing. Huang used the moment to say that his interests align with the US's, saying: Read full article Comments", "date_str": "2026-11-17T20:32:55+00:00", "hash": "586cd770baa0d377", "title_fa": "\"ترامپ با جنسن در رختخواب بود\": منتقدان از تمایل هوانگ برای بازگشت به انویدیا مخالفت کردند.", "summary_fa": "روز دوشنبه، کامیون‌های بزرگ در خیابان‌های واشنگتن دی سی چرخیدند و بیلبوردهایی را حمل می‌کردند که از کنگره می‌خواستند در مورد روابط دولت ترامپ با جنسن هوانگ، مدیرعامل بدنام انویدیا تحقیق کند. بیلبوردهای ایجاد شده توسط پروژه نظارت فناوری (TOP) ادعا می کنند: \"جنسن با جاسوسی از چین در رختخواب بود.\" ترامپ با جنسن در رختخواب بود. TOP یک سازمان غیرانتفاعی است که خود را \"متعهد به مهار فناوری بزرگ\" توصیف می کند. در حال حاضر، ترامپ از کمپینی برای بازگرداندن هوانگ به عنوان مدیرعامل انویدیا حمایت می‌کند – علی‌رغم اینکه بسیاری از جمهوری‌خواهان آن را «ایده وحش رگ فکر می‌کنند. این شرکت روز یکشنبه ۲۴ آبان برای نخستین بار موفق شد مرحله فوقانی موشک غول‌پیکر استارشیپ را بازیابی کند؛ دستاوردی که با مهار این مرحله از آسمان به کمک بازوهای «چاپستیک» برج پرتاب در تگزاس رقم خورد. مهار استارشیپ لحظه‌ای تاریخی برای اسپیس‌ایکس بود و چشم‌انداز این شرکت برای استفاده مجدد کامل و سریع از موشک‌ها را یک گام بزرگ به واقعیت نزدیک‌تر کرد. بااین‌حال، ایلان ماسک اهل درجازدن و دل‌خوش‌کردن به دستاوردهای گذشته نیست. به همین دلیل، او خیلی زود از آینده‌ای به‌مراتب جاه‌طلبانه‌تر برای استارشیپ سخن گفت. ماسک دوشنبه ۱۶ نوامبر در ایکس نوشت : «استارشیپ نسخه چهار (V4) حدود ۷۰ متر ارتفاع خواهد داشت که تقریباً ۴۰ درصد افزایش [نسبت به V3] محسوب می‌شود و توانایی حمل بیش از ۶۰ درصد سوخت بیشتر را خواهد داشت. تعداد موتورها نیز به ۹ عدد افزایش خواهد یافت؛ به‌طوری‌که سه موتور دیگر از نوع رپتور خلأ به آن اضافه می‌شود. این موتورها از نسخه V4 با رانش بیشتر خواهند بود.» نسخه کنونی استارشیپ، یعنی همان موشکی که روز شنبه ۲۳ آبان در پانزدهمین پرواز آزمایشی پرتاب شد، نسخه V3 است. استارشیپ بزرگ‌ترین و قدرتمندترین موشک ساخته‌شده تاکنون محسوب می‌شود و هنگامی که مرحله اول با نام سوپر هوی و مرحله فوقانی با نام شیپ روی یکدیگر قرار می‌گیرند، ارتفاعش به ۱۲۴ متر می‌رسد. مرحله فوقانی استارشیپ در نسخه سوم، ۵۲ متر ارتفاع دارد و به ۶ موتور رپتور V3 اسپیس‌ایکس مجهز است. بوستر سوپر هوی نسخه سوم نیز که آن هم برای استفاده مجدد طراحی شده، از ۳۳ موتور رپتور نیرو می‌گیرد. بنابراین، همان‌طور که ماسک در پست خود اشاره کرد، نسخه V4 شیپ", "image_url": "https://api2.zoomit.ir/media/the-ship-upper-stage-comes-in-for-a-landing-at-its-launch-tower-6afcbae92314debea39c0e91?w=1920&q=75", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۷ آبان • ۰۰:۱۰"}, {"source": "Zoomit", "title": "آنر مجیک ۱۰ با دوربین جدیدش عکاسی موبایل را متحول می‌کند", "link": "https://www.zoomit.ir/mobile/471155-honor-magic10-series-camera-specs-leaked/", "summary": "اطلاعات فاش‌شده نشان می‌دهد پرچمداران سری مجیک ۱۰ آنر ممکن است با دوربین ۲۰۰ مگاپیکسلی پیشرفته روانه‌ی بازار شوند.", "date_str": "2026-11-1 ther attempt to get out of jail. The Saudi national and former OpenAI employee is facing a wiretap charge. His lawyers say prosecutors told him they haven't found evidence to charge him with espionage. A lawyer for the Saudi national accused of bugging OpenAI's San Francisco office is making another attempt to get him released from jail , saying that Justice Department prosecutors haven't dug up any evidence that would support espionage charges. \"Government counsel acknowledged that if there were supporting evidence, new charges would have been brought when Mr. Alfozan was indicted,\" David Rizk, the attorney for Abdulrahman Alfozan, said in a court filing ahead of his client's Tuesday court appearance. \"Instead, Mr. Alfozan was indicted solely on the Wiretap Act count that was the subject of the Complaint.\" Federal prosecutors in San Francisco arrested Alfozan in October, accusing him of planting a listening device in a conference room at OpenAI's office, where he worked as an engineer. The criminal complaint accused him of interception of oral communications. Prosecutors brought a grand jury indictment against Alfozan later in October, but didn't include more severe charges, such as espionage or theft of trade secrets. Rizk said prosecutors said in two meetings this month that no evidence emerged to bring additional charges against him. Rizk asked US District Judge Vince Chhabria, who is overseeing the case, to order the Justice Department to hand over additional information that would enable the defense lawyer to formally request Alfozan's release from jail. A spokesperson for the US Attorney's office in San Francisco didn't immediately respond to a request for comment. Alfozan has pleaded not guilty to the charges against him. A federal judge ordered him to remain in jail while awaiting trial, ruling there was a high risk he would flee if released because the Saudi government offered to pay his bond and because his wife and son had already flown to Saudi Arabia. Photos included in the criminal complaint show images of a USB device plugged into the back of a conference room TV and wrapped in toilet paper. The complaint also included what prosecutors said was a photo of Alfozan checking on the device a week after another OpenAI employee found it hidden there. According to Rizk, the ", "date_str": "2026-11-17T20:13:16+00:00", "hash": "a19c698c78d14b6d", "title_fa": "وکیل او می گوید که وزارت دادگستری مدرکی دال بر جاسوسی عربستان در پرونده علیه مهندس OpenAI پیدا نکرده است", "summary_fa": "عبدالرحمن آلفوزان و وکیلش دیوید ریزک در طرحی از روز جمعه، 3 نوامبر 2026 در دادگاه با قاضی پیتر کانگ صحبت می کنند. ویکی الن بهرینگر عبدالرحمن آلفوزان تلاش دیگری برای رهایی از زندان انجام می دهد. این تبعه سعودی و کارمند سابق OpenAI با اتهام استراق سمع مواجه است. وکلای او می گویند که دادستان ها به او گفته اند که مدرکی برای متهم کردن او به جاسوسی پیدا نکرده اند. یک وکیل این شهروند سعودی متهم به دستبرد به دفتر OpenAI در سانفرانسیسکو، تلاش دیگری برای آزادی او از زندان انجام می‌دهد و می‌گوید که دادستان‌های وزارت دادگستری هیچ مدرکی برای حمایت از اتهامات جاسوسی کشف نکرده‌اند. «وکیل دولت اذعان کرد که اگر شواهد تأیید کننده وجود داشت، زمانی که آقای آقایی بود اتهامات جدیدی مطرح می شد. دیوید ریزک، وکیل عبدالرحمن آلفوزان، در تشکیل پرونده دادگاه پیش از حضور در دادگاه باز موکلش در روز سه شنبه گفت: \"آلفوزان تنها بر اساس قانون استراق سمع که موضوع شکایت بود، متهم شد.\" جایی که به عنوان مهندس کار می کرد. شکایت کیفری او را به شنود ارتباطات شفاهی متهم کرد. دادستان ها در اواخر ماه اکتبر کیفرخواستی را علیه آلفوزان مطرح کردند، اما اتهامات شدیدتری مانند جاسوسی یا سرقت اسرار تجاری را شامل نشد. ریزک گفت که دادستان ها در دو جلسه در این ماه گفتند که هیچ مدرکی برای طرح اتهامات اضافی علیه او به دست نیامده است. ریزک از قاضی ناحیه ایالات متحده وینس چابریا، که بر این پرونده نظارت دارد، خواست تا به وزارت دادگستری دستور دهد اطلاعات بیشتری را به وکیل مدافع اجازه دهد تا رسماً آزادی آلفوزان از زندان را درخواست کند. سخنگوی دفتر دادستانی ایالات متحده در سانفرانسیسکو بلافاصله به درخو sailable. Other versions do some things better, but this one does everything right no mistakes. It stays close to the original text; it's perfectly produced; and it has a consistency of tone and vision that makes it the most balanced of all versions of the story. A Christmas Carol might not have the best Scrooge of all time, but George C. Scott's performance is a solid nine out of ten, and this version features the most adorable and pitiable Tiny Tim of all and the best Ghost of Christmas Present, played by Edward Woodward, who played the policeman in The Wicker Man. Where to stream it : Roku , Tubi , Pluto TV Scrooge (1935) Shot in the midst of the Great Depression, the first sound version of A Christmas Carol digs deeper into the despair and horror of the story than any other adaptation. It s a bleak, German expressionist Christmas flick, and Seymour Hicks sickly, ha", "date_str": "2026-11-17T20:30:00+00:00", "hash": "ef5f350bfd118e09", "title_fa": "هر نسخه از «سرود کریسمس»، رتبه‌بندی شده (و مکان پخش آن‌ها)", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. چارلز دیکنز سرود کریسمس بهترین داستان در مورد کریسمس است که تا به حال بهتر از داستانی با مریم و جوزف و آخور نوشته شده است. داستان 1843 در مورد یک بخیل که توسط ارواح خودپسند کتک خورده است (احتمالا) فیلمبرداری شده ترین داستان تمام دوران است. ده ها اقتباس سینمایی از سرود کریسمس از زمان اسکروج در سینماها و تلویزیون منتشر شده است. یا روح مارلی در سال 1901 منتشر شد. صدها یا هزار ثانیه اگر تصورات مجدد و قسمت های بسیار خاص کمدی ها را حساب کنید. اما کدام نسخه بهترین است؟ من تمام اقتباس‌های اصلی تئاتر و تلویزیونی «سرود کریسمس» را به دقت بررسی کرده‌ام و هر کدام را از نظر روحیه تعطیلات، هوس‌های دیکنزی و اسکروج-اسیتی رتبه‌بندی کرده‌ام تا به فهرست قطعی و بدون استدلال بهترین به بدترین سرودهای کریسمس برسم. برای رتبه بندی سرودهای کریسمس، باید تصمیم بگیرید که سرود کریسمس برای شما چیست. معیارهای من برای گنجاندن: باید تمام طول باشد (حداقل حدود یک ساعت). باید به طور گسترده، یا در سینماها، در تلویزیون شبکه، یا از طریق یک سرویس پخش بزرگتر منتشر شده باشد، و باید نسبتاً به یک اقتباس مستقیم مدرنیزاسیون، تخیل مجدد، دنباله ها و آن قسمت از مرد شش میلیون دلاری (با عرض پوزش، طرفداران Scrooged) نزدیک باشد. با استفاده از این معیارها، Carols را به 17 موردی که در زیر می‌بینید، از بهترین تا بدترین رتبه‌بندی کرده‌ام، همراه با جایی که می‌توانید هر کدام را پخش کنید. سرود کریسمس (1984) سخت است که یک اقتباس از A Christmas Caro l را به عنوان بهترین مطلق تمام دوران انتخاب کنیم، اما نسخه فیلم تلویزیونی 1984 با بازی جورج سی اسکات غیرقابل انکار است. نسخه های دیگر برخی کارها را بهتر انجام می دهند، اما این یکی همه کارها را", "image_url": "https://lifehacker.com/imagery/articles/01HHRW45BDXTNRNVY9JN2PA2T1/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "سینما"], "datetime_fa": "۲۷ آبان • ۰۰:۰۰"}, {"source": "Lifehacker", "title": "'Ghost Accounts' Are Putting Your Security at Risk, but You Can Protect Yourself", "link": "https://lifehacker.com/tech/you-should-delete-your-old-ghost-accounts-security?utm_medium=RSS", "summary": "In all the years you've been online, you've likely created more accounts than you can remember, whether to shop on a website you made one purchase from, sign up for a newsletter you've since stopped reading, or download apps for school or work that you no longer need. These so-called \"ghost accounts\" all the old, forgotten logins that are still active but not in use could expose your data in the event of a breach, increasing the risk of your information being used in malicious ways. That's why it's important to go through the effort to find and delete dormant accounts. Here's how to get started. How old accounts can compromise your security As McAfee describes , ghost accounts may retain lots of sensitive data, such as your contact details (phone numbers, emails, and addresses), purchase histories, payment details, and passwords. While this doesn't mean your information is sure to be compromised, the more places it lives, the more opportunities there are for bad actors to get ahold of it. You're less likely to be keeping tabs on activity in older accounts, which may also have weak or reused passwords that haven't been updated in years. If that company or service experiences a data breach, not only is your stored data there exposed, but that information (including your password) can be used to access other accounts using tactics like credential stuffing and phishing. This also increases the risk of identity theft, as threat actors can use your name, birth date, and other information to open fraudulent accounts. How to find and delete your old accounts Unfortunately, finding and removing forgotten accounts can be tedious. If you have a password manager, the easiest way to start is to audit older items as well as look at security reports that identify weak or reused passwords, as well as data breaches that have impacted your accounts. If you've saved credentials in your browser keychain, go through the same process to find dormant accounts. The next place to look is in your email: Search for account confirmation and verification emails as well as password resets using keywords like \"verify your email,\" \"free trial,\" \"welcome,\" \"confirm your account,\" or \"sign up.\" Add a date filter to narrow down older accounts. Do this across all of your email addresses. Next, audit accounts you've created using single sign-on, such as Google, Apple, or Facebook. For Google, this is under Account Settings Linked apps . For Apple, go to System Settings [Your Name] Sign in wit", "date_str": "2026-11-17T20:00:00+00:00", "hash": "a7752ea6b1d8a8fc", "title_fa": "«حساب‌های شبح» امنیت شما را به خطر می‌اندازند، اما شما می‌توانید از خود محافظت کنید", "summary_fa": "امیلی لانگ یک نویسنده مستقل در سالت لیک سیتی است. پس از فارغ التحصیلی از دانشگاه دوک، او چندین سال را صرف گزارش در مورد نیروی کار فدرال برای دولت اجرایی، نشریه شرکت رسانه آتلانتیک، در واشنگتن دی سی کرد. او تقریباً یک دهه تجربه به عنوان فریلنسر در پوش
