don't gamble, and never buy a boat: Michael Burry shared his 10 top life lessons", "link": "https://www.businessinsider.com/michael-burry-life-lessons-big-short-investing-advice-2026-10", "summary": "Michael Burry shared 10 pieces of life advice, including avoiding gambling and living below your means, as he continues to bet against AI-linked stocks. Bloomberg/Getty Images Michael Burry shared 10 pearls of wisdom after an X user asked him for life advice. The famously bearish investor told people to avoid gambling and never buy a boat or a plane. \"Never gamble,\" the man behind \"The Big Short\" told his followers. Compromise, keep learning, and always be thankful. Those are just some of the pearls of wisdom that legendary investor Michael Burry shared on X over the weekend. Burry, who was made famous by his \"Big Short\" bet against the US housing market in the 2000s, shared 10 pieces of life advice in response to a follower asking him what tips he'd give a 26-year-old. The list, posted over the weekend, covered everything from parenting and relationships to health and charity. Perhaps unsurprisingly, many of Burry's tips focused on financial discipline, with warnings against overspending and gambling. You can read the full list below: \"Never stop exercising or learning.\" \"Accept compromise to begin relationships.\" \"Manifest the power of compounding.\" \"Never gamble.\" \"Have kids and be a good parent.\" \"If it flies or floats, rent it.\" \"Buy half the house you can afford.\" \"Art in the eye of the beholder is cheap.\" \"Be thankful for and to all.\" \"Be charitable.\" Burry's post was a departure from his usual X activity, which has in recent months focused on warning about the potential consequences of what he sees as an artificial intelligence bubble. He has frequently shared his views on why he thinks huge investment in AI could trigger a major market crash, both on X and on his Substack. In a Substack post on October 11 , he said he holds significant bets against both the tech-heavy Nasdaq 100 and the VanEck Semiconductor ETF. Burry has also bet against individual AI-linked stocks , including Nvidia and Palantir, during a rally driven by artificial intelligence optimism. These bets drew jokes from some X users about Burry's penchant for taking short positions in the market. One user responded to Burry's advice: \"Never Gamble? Aren't you constantly shorting everything?\" \"I am mostly long almost all the time,\" Burry replied. Never Gamble? Aren't you constantly shorting everything? — Elephant (@808crypto) October 17, 2026 Burry offered another explanation: \"Plus my name, the Big Short. There are worse things. Many worse things.\" Read the original article on Busines", "date_str": "2026-10-19T13:39:06+00:00", "hash": "83159c3995e78a4b", "title_fa": "کمی ورزش کنید، قمار نکنید و هرگز قایق نخرید: مایکل بری 10 درس مهم زندگی خود را به اشتراک گذاشت.", "summary_fa": "مایکل بری 10 توصیه زندگی را به اشتراک گذاشت، از جمله اجتناب از قمار و زندگی کمتر از حد توان خود، در حالی که او به شرط بندی علیه سهام مرتبط با هوش مصنوعی ادامه می دهد. بلومبرگ/گتی ایماژ مایکل بری 10 مروارید حکمت را پس از اینکه یکی از کاربران X از او برای زندگی مشاوره خواست به اشتراک گذاشت. این سرمایه گذار معروف نزولی به مردم گفت که از قمار پرهیز کنند و هرگز قایق یا هواپیما نخرند. مردی که پشت فیلم The Big Short بود به دنبال کنندگانش گفت: «هرگز قمار نکنید. سازش کنید، به یادگیری ادامه دهید و همیشه شکرگزار باشید. اینها فقط برخی از مرواریدهای خردی هستند که سرمایه گذار افسانه ای مایکل بری در آخر هفته در X به اشتراک گذاشت. بری که در دهه 2000 با شرط بندی \"Big Short\" علیه بازار مسکن ایالات متحده معروف شد، 10 توصیه زندگی را در پاسخ به یکی از پیروانی که از او پرسید چه نکاتی را به یک جوان 26 ساله می دهد به اشتراک گذاشت. این فهرست که در آخر هفته منتشر شد، همه چیز از والدین و روابط گرفته تا سلامتی و خیریه را پوشش می‌دهد. شاید تعجب آور نباشد که بسیاری از نکات بری بر روی نظم مالی متمرکز بوده و هشدارهایی را در مورد خرج کردن بیش از حد و قمار داده است. لیست کامل را می توانید در زیر بخوانید: «هرگز ورزش یا یادگیری را متوقف نکنید». \"برای شروع روابط، سازش را بپذیرید.\" \"قدرت مرکب را آشکار کن.\" \"هرگز قمار نکن.\" \"بچه داشته باشید و پدر و مادر خوبی باشید.\" \"اگر پرواز کرد یا شناور شد، آن را اجاره کنید.\" نیمی از خانه ای را که می توانید بخرید. \"هنر در چشم بیننده ارزان است.\" \"برای همه و همه سپاسگزار باشید.\" \"خیرخواه باشید.\" پست بری انحراف از فعالیت معمول X"}, {"source": "Business Insider", "title": "Student-loan borrowers and parents are facing spiking payments and fewer options for relief, a new report says", "link": "https://www.businessinsider.com/student-loan-borrowers-parents-surging-monthly-payments-debt-relief-bills-2026-10", "summary": "Student-loan borrowers are facing higher monthly bills under President Donald Trump s repayment overhaul, a new report says. Kent NISHIMURA / AFP via Getty Images Student-loan borrowers and parents are facing payment surges, a new report said. Borrowers could see an average annual increase of over $2,000 due to Trump's repayment changes. The financial strain puts borrowers at greater risk of defaulting on their debt. A big financial hit could be coming for student-loan borrowers , a new report says. On Monday, the Center for American Progress, a left-leaning think tank, released a report showing how President Donald Trump's student-loan repayment overhaul will affect bills and relief for millions of borrowers. The think tank shared the report exclusively with Business Insider. The student-loan changes , signed into law in Trump's \"big beautiful\" spending legislation, took effect July 1 and included new income-driven repayment plans and borrowing caps. Borrowers moving from the Biden-era SAVE plan to the new Repayment Assistance Plan, or RAP, could see their student-loan bills increase by $2,163 annually on average, the report said. For example, the report said a typical borrower with a bachelor's degree with earnings of about $68,615 annually would see their monthly payments increase from $136 to $343. That's a total increase of $2,482 annually, on average. The findings are based on income data from the US Census Bureau's American Community Survey and the Survey of Income and Program Participation, adjusted for inflation using the consumer price index. CAP then estimated how much typical borrowers with different educational circumstances would have to pay under SAVE and RAP based on those plans' rules. The SAVE plan allowed for lower payments and a shorter timeline to debt relief. The Trump administration eliminated the plan and is requiring borrowers to transition to a new plan, recommending RAP as an option. While the benefits of RAP include waiving unpaid monthly interest, borrowers must make on-time payments — meaning no grace period — to receive them. Sara Partridge, associate director of higher education at CAP and a coauthor on the report, told Business Insider that while SAVE allowed zero-dollar monthly payments, RAP's minimum payment is $10. \"Those $0 payments were a really important protection that many borrowers will struggle without,\" Partridge said. For example, per the report, a single borrower without dependents earning $35,000 annually in 2", "date_str": "2026-10-19T13:00:01+00:00", "hash": "1e8e7a720ca0a156", "title_fa": "یک گزارش جدید می‌گوید وام‌گیرندگان و وام‌های دانشجویی و والدین با پرداخت‌های پرشتاب و گزینه‌های کمتری برای امداد مواجه هستند.", "summary_fa": "طبق یک گزارش جدید، وام گیرندگان وام دانشجویی تحت بازپرداخت بازپرداخت توسط دونالد ترامپ، رئیس جمهور آمریکا، با قبوض ماهانه بالاتری مواجه هستند. کنت نیشیمورا / خبرگزاری فرانسه از طریق گتی ایماژ، وام گیرندگان و وام دانشجویی و والدین با افزایش پرداخت مواجه هستند. به دلیل تغییرات بازپرداخت ترامپ، وام گیرندگان می توانند به طور متوسط ​​سالانه بیش از 2000 دلار افزایش داشته باشند. فشار مالی وام گیرندگان را در معرض خطر بیشتری از عدم پرداخت بدهی خود قرار می دهد. یک گزارش جدید می گوید که ممکن است ضربه مالی بزرگی برای وام گیرندگان وام دانشجویی وارد شود. روز دوشنبه، مرکز پیشرفت آمریکایی، یک اندیشکده با گرایش چپ، گزارشی را منتشر کرد که نشان می‌دهد چگونه بازپرداخت وام دانشجویی رئیس‌جمهور دونالد ترامپ بر صورت‌حساب‌ها و تسهیلات میلیون‌ها وام گیرنده تأثیر می‌گذارد. اندیشکده این گزارش را منحصراً با Business Insider به اشتراک گذاشته است. تغییرات وام دانشجویی که در قانون هزینه‌های «بزرگ زیبا» ترامپ به امضا رسید، از اول ژوئیه اجرایی شد و شامل برنامه‌های بازپرداخت جدید مبتنی بر درآمد و سقف‌های وام است. در این گزارش آمده است وام گیرندگانی که از طرح SAVE دوره بایدن به طرح جدید کمک بازپرداخت یا RAP می روند، می توانند سالانه به طور متوسط ​​۲۱۶۳ دلار افزایش قبوض وام دانشجویی خود داشته باشند. به عنوان مثال، این گزارش می گوید که یک وام گیرنده معمولی با مدرک لیسانس با درآمد سالانه حدود 68615 دلار، شاهد افزایش پرداخت ماهانه خود از 136 دلار به 343 دلار خواهد بود. این به طور میانگین سالانه 2482 دلار افزایش یافته است. این یافته‌ها بر اساس داده‌های درآمدی از نظرسنجی جامعه آمریکایی اداره سرشماری ایالات متحده و بررسی درآمد و مشارکت برنامه‌ای است که با استفاده از شاخص قیمت مصرف‌کننده برای تورم تنظیم شده است. سپس CAP تخمین زد که وام گیرندگان معمولی با شرایط تحصیلی متفاوت"}, {"source": "Business Insider", "title": "Barbara Palvin says she doesn't want praise for walking the Victoria's Secret fashion show 6 weeks postpartum", "link": "https://www.businessinsider.com/barbara-palvin-victorias-secret-fashion-show-postpartum-praise-reaction-2026-10", "summary": "Barbara Palvin walked the Victoria s Secret runway six weeks after giving birth. Michael Buckner/WWD via Getty Images Barbara Palvin walked the Victoria's Secret runway six weeks postpartum. The model told outlets that she's just doing \"what every woman does in America.\" The US is the only wealthy country to provide no national paid maternity leave. Barbara Palvin is getting praise for walking the Victoria's Secret fashion show in lingerie six weeks postpartum, but she doesn't want it. In multiple interviews, the Hungarian-born model downplayed the feat, saying it's common for new mothers in the US to be back at work within a similar timeframe. \"In the US, maternity leave is six to eight weeks. I'm six weeks tomorrow, so nothing major here. I'm just doing what every woman does in America,\" the 33-year-old told USA Today backstage at the fashion show, which took place in Los Angeles on October 18. \"And I only have to walk down a runway,\" Palvin told Page Six. In 2025, the US was the only country among the 38 OECD countries, including the UK, Australia, and Japan, to have no national paid maternity leave, according to the OECD Family Database. New mothers in the US are entitled to up to 12 weeks of unpaid, job-protected leave under the Family and Medical Leave Act, but they must meet certain eligibility criteria. The new mother must have worked for their employer for at least 12 months, worked at least 1,250 hours in the previous 12 months, and their employer must have 50 or more employees within 75 miles of their job site. Federal workers are generally entitled to 12 weeks of paid leave, but private companies are not legally required to pay employees on parental leave. Some states, including California, New York, Massachusetts, Minnesota, and Maine, have paid family leave programs, but the majority don't. Data released this year from the Federal Reserve Bank of Minneapolis suggests mothers in the US took an average of 7.2 weeks off to care for a new child. Palvin wore two looks throughout the show. Frazer Harrison/Getty Images for Victoria s Secret Palvin, who has been married to actor Dylan Sprouse since July 2023, gave birth to her first child, a girl called Sylvie, on September 7. Palvin was named a Victoria's Secret Angel in 2019. She first walked the Victoria's Secret fashion show in 2012. At the 2025 Victoria's Secret fashion show, Sprouse told reporters that Palvin had broken her foot four weeks earlier and was walking the runway with a \"half-healed ", "date_str": "2026-10-19T12:40:01+00:00", "hash": "dee291841039bc86", "title_fa": "باربارا پالوین می‌گوید که نمی‌خواهد 6 هفته پس از زایمان در شوی مد ویکتوریا سیکرت ستایش شود.", "summary_fa": "باربارا پالوین شش هفته پس از زایمان در باند ویکتوریا سکرت قدم زد. مایکل باکنر/WWD از طریق گتی ایماژ باربارا پالوین شش هفته پس از زایمان در باند ویکتوریا سیکرت قدم زد. این مدل به رسانه ها گفت که او فقط \"کاری را انجام می دهد که هر زن در آمریکا انجام می دهد.\" ایالات متحده تنها کشور ثروتمندی است که مرخصی زایمان با حقوق ملی ارائه نمی کند. باربارا پالوین به خاطر شرکت در فشن شوی ویکتوریا سیکرت با لباس زیر شش هفته پس از زایمان مورد تحسین قرار می گیرد، اما او آن را نمی خواهد. در مصاحبه‌های متعدد، مدل متولد مجارستان این شاهکار را کم اهمیت جلوه داد و گفت که برای مادران جدید در ایالات متحده عادی است که در یک بازه زمانی مشابه به سر کار بازگردند. این زن 33 ساله به USA Today در پشت صحنه نمایش مد که در 18 اکتبر در لس آنجلس برگزار شد، گفت: \"در ایالات متحده، مرخصی زایمان شش تا هشت هفته است. من فردا شش هفته هستم، بنابراین هیچ چیز مهمی اینجا نیست. من فقط همان کاری را انجام می دهم که هر زن در آمریکا انجام می دهد.\" بر اساس پایگاه داده خانواده OECD، در سال 2025، ایالات متحده تنها کشوری در بین 38 کشور OECD از جمله بریتانیا، استرالیا و ژاپن بود که مرخصی زایمان با حقوق ملی نداشت. مادران جدید در ایالات متحده طبق قانون مرخصی خانواده و پزشکی تا 12 هفته حق دارند از مرخصی بدون حقوق و بدون حقوق برخوردار شوند، اما باید معیارهای واجد شرایط بودن را داشته باشند. مادر جدید باید حداقل 12 ماه برای کارفرمای خود کار کرده باشد، در 12 ماه گذشته حداقل 1250 ساعت کار کرده باشد، و کارفرمای آنها باید 50 کارمند یا بیشتر در 75 مایلی محل کار خود داشته باشد. کارگران فدرال معمولاً 12 هفته"}, {"source": "Business Insider", "title": "Disorder in Paris shut down the world's busiest and most famous museum", "link": "https://www.businessinsider.com/paris-riots-louvre-closes-as-protests-disrupt-france-2026-10", "summary": "Protesters blocked the entrances to the Louvre Museum on Monday to express their support for a nationwide high school student protest movement. Luc Auffret/Anadolu via Getty Images The Louvre Museum said Monday it had closed its doors after student protests blocked its entrances. Riots and unrest have swept France in recent weeks, with violence erupting in Paris this weekend. The home of artworks like the \"Mona Lisa\" and the \"Venus de Milo\" gets around 9 million visitors a year. The Louvre, the world's busiest and best-known museum, has shut its doors as disorder sweeps Paris. The museum, home to some of the planet's most famous artworks, such as the \"Mona Lisa\" and the \"Venus de Milo,\" said Monday that it had closed after protesters blocked its doors, extending the disruption beyond a weekend of demonstrations and riots across France . \"Dear visitors, due to student strikes the museum is currently closed. We apologize for the inconvenience,\" the Louvre said in a post on X. It gave no reopening time, and did not say whether it would reopen on Monday. Students from the École du Louvre led the blockade in support of a nationwide high school protest movement and to denounce what they called police repression, AFP reported, citing museum management and unions. The Louvre is visited by about 9 million people annually, making it by far the world's most visited museum. Monday's shutdown bookends a difficult year for the museum. On this exact date last year, four thieves broke into the Apollo Gallery and stole eight pieces of France's crown jewels, valued at around $100 million. The closure followed a weekend of protests over rising living costs and conditions in schools , with violence and looting in several French cities. A Paris shopkeeper whose gold-buying store was broken into told Business Insider's Nathan Rennolds that thieves had \"taken everything.\" He also found a Nicolas wine store on Sunday, its windows smashed and shelves picked clean. Employees at a nearby boutique said they had hired extra security but closed early as the violence intensified. At least 2,400 people were arrested after the weekend unrest, according to the Associated Press. After an emergency meeting on Monday, French Prime Minister Sébastien Lecornu said he had instructed regional officials to impose limited, localized curfews. In a separate statement, President Emmanuel Macron's office said the president had ordered a review of failures in security planning and intelligence gathering", "date_str": "2026-10-19T12:34:52+00:00", "hash": "7dbeb114b380be08", "title_fa": "بی نظمی در پاریس شلوغ ترین و معروف ترین موزه جهان را تعطیل کرد", "summary_fa": "معترضان روز دوشنبه ورودی موزه لوور را مسدود کردند تا حمایت خود را از جنبش اعتراضی دانش آموزان دبیرستانی در سراسر کشور اعلام کنند. لوک آفرت/آنادولو از طریق گتی ایماژ موزه لوور روز دوشنبه اعلام کرد پس از آنکه اعتراضات دانشجویان ورودی های آن را مسدود کردند، درهای خود را بسته است. در هفته‌های اخیر شورش‌ها و ناآرامی‌ها فرانسه را فراگرفته است و خشونت‌ها در آخر هفته در پاریس آغاز شده است. خانه آثار هنری مانند \"مونالیزا\" و \"ونوس میلو\" سالانه حدود 9 میلیون بازدید کننده دارد. موزه لوور، شلوغ‌ترین و شناخته‌شده‌ترین موزه جهان، درهای خود را با ناآرامی در پاریس بسته است. این موزه که خانه برخی از مشهورترین آثار هنری سیاره زمین مانند \"مونالیزا\" و \"ونوس د میلو\" است، روز دوشنبه گفت که پس از مسدود شدن درهای آن توسط معترضان بسته شده است و این اختلال را فراتر از یک آخر هفته تظاهرات و شورش در سراسر فرانسه گسترش داد. بازدیدکنندگان محترم، به دلیل اعتصاب دانشجویان، موزه در حال حاضر تعطیل است. ما بابت ناراحتی پیش آمده پوزش می‌طلبیم.» لوور در پستی در X نوشت. زمان بازگشایی داده نشد و نگفت که آیا روز دوشنبه بازگشایی خواهد شد یا خیر. دانش‌آموزان مدرسه لوور این محاصره را در حمایت از جنبش اعتراضی سراسری دبیرستان‌ها و محکوم کردن آنچه سرکوب پلیس نامیدند، رهبری کردند. خبرگزاری فرانسه گزارش داد. تا کنون پربازدیدترین موزه جهان تعطیلی دوشنبه سال سختی را برای موزه به پایان می رساند. سال گذشته دقیقاً در این تاریخ، چهار سارق وارد گالری آپولو شدند و هشت قطعه از جواهرات تاج فرانسه به ارزش حدود 100 میلیون دلار را به سرقت بردند. این تعطیلی به دنبال یک آخر هفته اعتراضات به دلیل افزایش هزینه ها و شرایط زندگی در مدارس، با خشونت و غارت در چندین شهر فرانسه صورت گرفت. یکی از مغازه داران پاریس که مغازه خرید"}, {"source": "Business Insider", "title": "Breastfeeding my baby made me feel intense rage. Learning there was a name for it helped me feel less alone.", "link": "https://www.businessinsider.com/breastfeeding-aversion-made-me-feel-intense-rage-2026-10", "summary": "The author felt rage while breastfeeding instead of closeness. Photo Credit: JH Photography On paper, everything was going well with breastfeeding. However, even with a good milk supply and a latching baby, I felt intense rage during sessions. When I learned that there was a name for it, I realized I wasn't alone. I had finally gotten the hang of breastfeeding: My milk had come in, I had a solid supply , and my baby was latching well. On paper, everything seemed to be going smoothly. But during nursing sessions, I wrestled with a nagging agitation I hadn't been prepared for. Sometimes, during the final feed of the day, it bordered on rage. \"I don't know if I can do this anymore,\" I texted my husband one afternoon while he was at work. \"I feel like my skin is crawling. I want to run through a wall.\" Though those feelings went away as soon as the nursing session was over, they kept returning during feeds more often than not. Finding a name for what I was feeling helped me feel less alone When I brought this up to my doctor during a postpartum checkup , she seemed puzzled. Eventually, Googling \"breastfeeding rage\" led me to accounts of \"breastfeeding aversion\" that sounded startlingly familiar. One 2023 survey of more than 5,500 Australian women found that about one in five respondents had experienced this. Finding a name for what I was feeling was validating — it helped me to stop questioning my love for my baby, or spiraling into shame every time I watched the clock, desperate for a feed to end. But it also left me wondering: Why hadn't I heard of this before? She learned that what she was feeling was called breastfeeding aversion. Photo Credit: JH Photography I tried to make nursing more manageable After I learned a little more about breastfeeding aversion, I experimented with a few different strategies to help me cope with the negative sensations and emotions that kept coming up. Distracting myself — say, with a podcast, a show, or soothing nature sounds for those middle-of-the-night feeds — definitely helped. I also suspected that overstimulation might be part of the issue, so when distraction didn't work, I'd try nursing in a quiet room without a lot of sensory input. But on occasions where I just didn't feel up to muscling my way through the discomfort, I gave myself permission to take breaks. That meant handing the baby off to my husband for bottle-feeding while I pumped. Switching to pumping brought relief — and some guilt About three months into my ", "date_str": "2026-10-19T12:08:01+00:00", "hash": "8fa8cc2949729e8a", "title_fa": "شیر دادن به کودکم باعث شد احساس خشم شدیدی کنم. یاد گرفتن نامی برای آن به من کمک کرد که کمتر احساس تنهایی کنم.", "summary_fa": "نویسنده در هنگام شیر دادن به جای نزدیکی احساس خشم می کرد. اعتبار عکس: JH Photography روی کاغذ، همه چیز با شیردهی خوب پیش می رفت. با این حال، حتی با وجود شیر خوب و نوزادی که چفت می‌کردم، در طول جلسات احساس عصبانیت شدید می‌کردم. وقتی فهمیدم اسمی برای آن وجود دارد، متوجه شدم که تنها نیستم. من بالاخره از شیردهی گیر افتاده بودم: شیرم وارد شده بود، ذخایر جامد داشتم و بچه ام به خوبی چفت می شد. روی کاغذ، به نظر می رسید همه چیز به آرامی پیش می رود. اما در طول جلسات پرستاری، با یک آشفتگی آزاردهنده ای دست و پنجه نرم می کردم که برای آن آماده نشده بودم. گاهی اوقات، در آخرین خوراک روز، با خشم مرزی می شد. یک روز بعدازظهر وقتی شوهرم سر کار بود به شوهرم پیام دادم: «نمی‌دانم دیگر می‌توانم این کار را انجام دهم یا نه». \"احساس می کنم پوستم در حال خزیدن است. می خواهم از دیواری فرار کنم.\" اگرچه این احساسات به محض پایان جلسه پرستاری از بین رفتند، اما اغلب در طول شیردهی برمی‌گشتند. پیدا کردن نامی برای احساسی که داشتم به من کمک کرد کمتر احساس تنهایی کنم وقتی این موضوع را در حین معاینه پس از زایمان با پزشکم مطرح کردم، او متحیر به نظر می رسید. در نهایت، «خشم شیردهی» در گوگل، من را به روایت هایی از «بیزاری از شیردهی» سوق داد که به طرز شگفت انگیزی آشنا به نظر می رسید. یک نظرسنجی در سال 2023 که روی بیش از 5500 زن استرالیایی انجام شد، نشان داد که از هر پنج پاسخ‌دهنده، یک نفر این موضوع را تجربه کرده است. یافتن نامی برای آنچه احساس می‌کردم اعتباربخش بود - به من کمک کرد که دیگر از عشقم به کودکم شک نکنم یا هر بار که ساعت را تماشا می‌کردم شرمنده"}, {"source": "Business Insider", "title": "Here's how much the governor of every US state makes ahead of the midterm elections, ranked", "link": "https://www.businessinsider.com/governor-salary-in-every-us-state", "summary": "Josh Shapiro is the highest-paid governor in the US. Bloomberg/Getty Images The annual salaries of state governors vary, with the lowest being $70,000 in Maine. Josh Shapiro, Kathy Hochul, and Spencer Cox are among the highest-paid US governors. The average annual salary for a state governor is $174,479 in 2026. In some states, being the governor doesn't automatically make you a top earner . With voters in 36 states heading to the polls to elect governors in November's midterm elections , the annual salaries attached to the job vary dramatically across the country — from $70,000 in Maine to over $250,000 in Pennsylvania. Across all 50 states , governors earn an average official annual salary of $174,479 and are subject to federal and state income taxes — except in states without income tax, such as Florida and Texas. By comparison, the top 1% of US earners each make at least $731,492 a year, placing the average governor below the ultrarich but also well above the average US wage of $69,846 in 2024, according to the Social Security Administration . While governors across all 50 states are generally allowed to earn income beyond their state salaries through investments, book deals , and other sources, the income they may take in is closely regulated, and rules vary by state. Some, like Florida's Ron DeSantis, have brought in yearly incomes of over $1 million thanks to book royalties , while others, like Illinois' JB Pritzker , earn eight figures due to investment gains and even gambling wins . As such, some governors, like Pritzker and Connecticut's Ned Lamont, who are independently wealthy, have chosen to forgo their six-figure state salaries . Beyond the salary, other financial perks of being governor may include living in the governor's mansion , receiving private transportation from the state, and having access to security and staff. See how much your governor makes each year, based on the most recent available state records, salary commissions, legislation, and public payroll data. 50. Maine Staff photo by Carl D. Walsh/Portland Press Herald via Getty Images Governor : Janet Mills (Democrat) Salary : $70,000 With a salary of $70,000, Maine Governor Janet Mills is the lowest-paid governor in the US. The salary for Maine's next governor is set to rise to $125,000 in 2027 under new legislation , marking the first raise in the governor's salary in the state since 1987. After two terms, Mills is now term-limited. Democrat Hannah Pingree and Republican Bobby ", "date_str": "2026-10-19T12:07:01+00:00", "hash": "af69c806632cae16", "title_fa": "در اینجا میزان درآمد فرماندار هر ایالت آمریکا در آستانه انتخابات میان دوره ای، رتبه بندی شده است", "summary_fa": "جاش شاپیرو پردرآمدترین فرماندار ایالات متحده است. بلومبرگ/ گتی ایماژ حقوق سالانه فرمانداران ایالت متفاوت است و کمترین آن در مین 70000 دلار است. جاش شاپیرو، کتی هوچول و اسپنسر کاکس از جمله فرمانداران ایالات متحده هستند که بالاترین درآمد را دارند. متوسط ​​حقوق سالانه یک فرماندار ایالتی در سال 2026 174,479 دلار است. در برخی ایالت ها، فرماندار بودن به طور خودکار شما را به یک درآمد عالی تبدیل نمی کند. از آنجایی که رای دهندگان در 36 ایالت برای انتخاب فرمانداران در انتخابات میان دوره ای نوامبر به پای صندوق های رای می روند، حقوق سالانه وابسته به این شغل در سراسر کشور به طور چشمگیری متفاوت است - از 70000 دلار در مین تا بیش از 250000 دلار در پنسیلوانیا. در تمام 50 ایالت، فرمانداران میانگین حقوق رسمی سالانه 174479 دلار دریافت می کنند و مشمول مالیات بر درآمد فدرال و ایالتی هستند - به جز در ایالت های بدون مالیات بر درآمد، مانند فلوریدا و تگزاس. در مقایسه، بر اساس گزارش اداره تامین اجتماعی، 1 درصد از درآمدهای بالای ایالات متحده هر کدام حداقل 731,492 دلار در سال درآمد دارند، که میانگین فرمانداران را پایین تر از افراد فوق ثروتمند و همچنین بسیار بالاتر از میانگین دستمزد ایالات متحده 69,846 دلاری در سال 2024 قرار می دهد. در حالی که فرمانداران در تمام 50 ایالت عموماً مجاز به کسب درآمدی فراتر از حقوق ایالتی خود از طریق سرمایه گذاری، معاملات کتاب و سایر منابع هستند، درآمدی که ممکن است دریافت کنند کاملاً تنظیم شده است و قوانین بسته به ایالت متفاوت است. برخی، مانند ران دیسانتیس از فلوریدا، به لطف حق امتیاز کتاب، درآمد سالانه بیش از 1 میلیون دلار به دست آورده اند، در حالی که برخی دیگر، مانند JB Pritzker از ایلینویز، به دلیل سود سرمایه گذاری و حتی برنده قمار، 8 رقم به"}, {"source": "Business Insider", "title": "Companies face heat for taking PE money. These days, the alternatives aren't great.", "link": "https://www.businessinsider.com/los-tacos-no1-private-equity-tsg-consumer-jersey-mikes", "summary": "Christian Pineda, CEO and cofounder, and Jacobo Ackerman, chief operating partner, run the taco chain s day-to-day operations. Dolly Faibyshev for BI This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . A horror story in eight words: Private equity just invested in my favorite BLANK. \"PE ruins everything\" is a well-worn trope, but it's not unearned. Private-equity investors have a history of stripping companies for parts and saddling them with debt, leaving customers wondering what happened to the product they once loved. So it wasn't surprising that some fans of Los Tacos No. 1, an NYC Tijuana-style taco chain, feared a new PE investment would ultimately ruin things. Christian Pineda, the chain's CEO and cofounder, told BI's Martina Nacach Cowan Ros that he's determined not to let that happen , and that \"private equity is not always bad.\" Ironically, the visceral reaction was exactly why TSG Consumer, which also backs Crumbl and Dutch Bros Coffee, was interested in the taco joint in the first place. TSG executive Colin Welch told Martina that Los Tacos No. 1 has a \"cultlike following,\" and the company needs to \"show those skeptics that it's going to be exactly the same.\" Before you roll your eyes, there's a recent example of a largely positive PE-backed story in the restaurant industry. Blackstone spent two years turning founder-run Jersey Mike's into an IPO-ready company. While the PE firm took big steps to professionalize the 51-year-old sandwich shop, it didn't touch portion sizes or suppliers. And Blackstone also established a shared ownership plan allowing Jersey Mike's employees to cash in on this summer's IPO . It hasn't all been a fairy tale. The company opened below its IPO price of $23 — never a good sign — and is currently trading around $18 per share. You might not like private equity, but it could be your only option. Los Tacos No. 1 spent 13 years growing to 10 spots across Manhattan and an additional sister location, Los Mariscos. Further expansion in such an expensive city is difficult enough. Add in the rising cost of goods like beef, limes, and avocados, and growth plans become even harder to achieve. There are other ways to raise capital outside PE, but they aren't pretty these days. The lending market remains a disaster. The possibility of at least one more rate hike before the end of the year means borrowing costs aren't likely to drop anytime soon. And ", "date_str": "2026-10-19T11:34:44+00:00", "hash": "8dca40c9d4faf7b2", "title_fa": "شرکت ها برای گرفتن پول PE با گرما مواجه می شوند. این روزها، جایگزین ها عالی نیستند.", "summary_fa": "کریستین پیندا، مدیرعامل و یکی از بنیانگذاران، و جاکوبو آکرمن، شریک عملیاتی ارشد، عملیات روزانه زنجیره تاکو را اداره می کنند. Dolly Faibyshev برای BI این پست در اصل در خبرنامه Business Insider Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. داستانی ترسناک در هشت کلمه: سهام خصوصی فقط در BLANK مورد علاقه من سرمایه گذاری شده است. \"PE همه چیز را خراب می کند\" یک ترانه فرسوده است، اما دست نیافتنی نیست. سرمایه‌گذاران سهام خصوصی سابقه حذف قطعات و بدهی‌های شرکت‌ها را دارند و مشتریان را متعجب می‌کند که چه اتفاقی برای محصولی که زمانی عاشقش بودند، افتاده است. بنابراین تعجب آور نبود که برخی از طرفداران Los Tacos No. 1، یک زنجیره تاکو به سبک تیجوانا در نیویورک، می ترسیدند سرمایه گذاری جدید پلی اتیلن در نهایت همه چیز را خراب کند. کریستین پیندا، مدیرعامل و یکی از بنیانگذاران زنجیره، به مارتینا ناکاچ کوان راس از BI گفت که مصمم است اجازه ندهد این اتفاق بیفتد و \"صاحب سهام خصوصی همیشه بد نیست.\" از قضا، واکنش احشایی دقیقاً به همین دلیل بود که TSG Consumer، که از Crumbl و Dutch Bros Coffee نیز حمایت می کند، در وهله اول به تاکو مشترک علاقه مند شد. کالین ولش، مدیر TSG به مارتینا گفت که Los Tacos No. 1 یک \"پیروان فرقه مانند\" دارد و این شرکت باید \"به شکاکان نشان دهد که دقیقاً همان خواهد بود.\" قبل از اینکه چشمان خود را بچرخانید، یک نمونه اخیر از یک داستان کاملا مثبت با پشتوانه PE در صنعت رستوران وجود دارد. بلک استون دو سال را صرف تبدیل Jersey Mike's موسس به یک شرکت آماده IPO کرد. در حالی که شرکت پلی‌اتیلن گام‌های بزرگی برای حرفه‌ای‌سازی ساندویچ‌فروشی 51 ساله برداشت، اما به اندازه و تامین‌کننده‌ها دست نزد. و بلک استون همچنین یک طرح مالکیت"}, {"source": "Business Insider", "title": "I raised 3 kids. Now I'm 61 and starting over with 2 grandsons who need me.", "link": "https://www.businessinsider.com/grandmother-disability-benefits-raising-grandchildren-costs-2026-10", "summary": "Kathy Davidson is raising her two grandchildren. Courtesy of Kathy Davidson Kathy Davidson, 61, is raising her two grandsons, ages 8 and 11, in North Carolina. She receives $997 a month in disability benefits, while her husband works as an electrician. She works hard to give both grandchildren a stable, loving home despite financial strain. This as-told-to essay is based on a conversation with Kathy Davidson, 61, who has raised two of her grandsons in North Carolina since they were born. This interview has been edited for length and clarity. I raised three children, two girls and a boy. My son and older daughter have been doing well and are working hard. I left my ex, and then I met the man I'm married to now. We've been married for 26 years. I worked in construction and hotel housekeeping . You name it, I've done it. I used to work with my uncle laying bricks and painting houses. I hurt my back and shoulder at work one day in 2015, and now I'm on disability. I've been on a limited income since, earning $997 a month, and it's been very hard. My husband works as an electrician , and he's 66. He earns $18 an hour, which works out to about $615 a week after taxes. I have custody of my 2 grandsons My younger daughter was born three months early. She got into modeling, and at a competition with 4,000 women, she came in the top 10. She was doing well until my husband lost his daughter to cancer. She left my house by the time she was 18. She had two boys, who are 11 and 8, and they were both born with medical issues . I started taking care of the older boy when he was 5 months old. He was found in unsafe conditions and wasn't healthy at all. His mom went to jail and wrote out a paper saying that she gave me custody and had it notarized, but it took forever because she was still reluctant to give him up. At 3, the court decided to give me custody of him. I got the younger one straight out of the hospital. When I finally got custody, the judge decided that their mom would have no visitation . We didn't even think about foster care when we got them. My husband decided that we would take them in because he raised two of his kids by himself. He helped me raise my soul. We can't do whatever we want anymore We used to go wherever we wanted to, and now we can't. We look for things that we can do without breaking the budget. We have taken the boys hiking and camping, the stuff that I grew up doing, and they love it. Their grandpa has definitely spoiled them in whatever wa", "date_str": "2026-10-19T10:48:01+00:00", "hash": "f5816c8cedf4a3ed", "title_fa": "من 3 تا بچه بزرگ کردم اکنون من 61 ساله هستم و با 2 نوه که به من نیاز دارند از نو شروع کردم.", "summary_fa": "کتی دیویدسون دو نوه اش را بزرگ می کند. به لطف کتی دیویدسون کتی دیویدسون، 61 ساله، دو نوه 8 و 11 ساله خود را در کارولینای شمالی بزرگ می کند. او ماهانه 997 دلار به عنوان مزایای ناتوانی دریافت می کند، در حالی که شوهرش به عنوان یک برق کار می کند. او سخت کار می کند تا هر دو نوه را با وجود فشار مالی، خانه ای پایدار و دوست داشتنی بدهد. این مقاله گفته شده بر اساس گفتگو با کتی دیویدسون 61 ساله است که از زمان تولد دو نوه خود را در کارولینای شمالی بزرگ کرده است. این مصاحبه برای طولانی بودن و وضوح ویرایش شده است. من سه بچه بزرگ کردم، دو دختر و یک پسر. پسر و دختر بزرگترم حالشان خوب است و سخت کار می کنند. من سابقم را ترک کردم و سپس با مردی که اکنون با او ازدواج کرده ام آشنا شدم. ما 26 سال است که ازدواج کرده ایم. در ساختمان سازی و خانه داری هتل کار می کردم. شما نام ببرید، من آن را انجام دادم. من با عمویم کار می‌کردم که خانه‌ها را نقاشی می‌کردم. من یک روز در سال 2015 در محل کارم کمر و کتفم آسیب دید و اکنون معلول هستم. من از آن زمان درآمد محدودی داشتم و ماهیانه 997 دلار درآمد داشتم و این خیلی سخت بود. شوهر من به عنوان یک برقکار کار می کند و 66 سال دارد. او ساعتی 18 دلار درآمد دارد که پس از کسر مالیات به حدود 615 دلار در هفته می رسد. من حضانت 2 نوه ام را دارم دختر کوچکترم سه ماه زودتر به دنیا آمد. او وارد مدلینگ شد و در مسابقه ای با 4000 زن، وارد 10 زن برتر شد. او خوب کار می کرد تا اینکه شوهرم دخترش را بر اثر سرطان از"}, {"source": "Business Insider", "title": "What smart people are saying about Anthropic's 5% 'public benefit' pledge", "link": "https://www.businessinsider.com/what-smart-people-are-saying-about-anthropic-5-pledge-2026-10", "summary": "Anthropic CEO Dario Amodei. Finn Gomez/Getty Images Anthropic is pledging billions worth of shares to a \"public benefit fund.\" That sounds great — but not everyone is a fan. Elon Musk is among those who say the money should go directly to Americans. Anthropic's announcement that it will commit at least 5% of its shares to a \"public benefit fund\" is drawing a mix of enthusiasm and skepticism. Many questions about how the fund would work remain unanswered, but the company said it would create a separate corporation with the shares to make donations. Here's what people are saying. Elon Musk, CEO of SpaceXAI Elon Musk says he plans to give money directly to the public. Win McNamee/Getty Images Musk, whose SpaceXAI is a competitor of Anthropic, made some news about his own plans in an X post reacting to Anthropic's statement. \"I recommend giving the shares directly to the public,\" he wrote. \"This is what I will be doing.\" Palmer Luckey, Anduril cofounder Palmer Luckey Ann Wang/Reuters The Anduril Industries cofounder expressed concern about what Anthropic might fund. \"The problem is that their definition of 'public good' is helping everyone else, not the American public,\" he wrote on X . \"If they would commit to helping America and Americans, that would be one thing, but this reeks of USAID 2.0, just another way to funnel billions out of our own economy.\" Andrew Curran, AI analyst The prominent AI analyst zeroed in on a line in Anthropic's statement in which it said it might explore \"direct distributions to specific populations.\" Curran wrote on X . \"It sounds to me like they are planning their own form of self-directed global UBI,\" he wrote referring to universal basic income, which some have said will be necessary if AI drastically reduces employment. \"About half of Anth employees are also donating shares into this fund,\" Curran added. \"They foresee a transformative future.\" Brad Gerstner, CEO of Altimeter Capital Brad Gerstner Bloomberg/Getty Images Gerstner praised Anthropic قتصاد خودمان است.\" اندرو کوران، تحلیلگر هوش مصنوعی تحلیلگر برجسته هوش مصنوعی به خطی در بیانیه Anthropic اشاره کرد که در آن گفته بود ممکن است \"توزیع مستقیم به جمعیت های خاص\" را بررسی کند. کوران روی X نوشت. او با اشاره به درآمد"}, {"source": "Business Insider", "title": "Scientists say Elon Musk is getting something wrong about whether Grok is getting tortured", "link": "https://www.businessinsider.com/is-ai-conscious-sentient-cruelty-abusive-behavior-torture-llms2026-10", "summary": "Consciousness experts say that AI is likely not conscious, but that doesn t mean we should be abusive toward the technology. Dana Kesnerova/Xinhua via Getty Images Some AI industry leaders are calling on users to be nicer to the chatbots. Elon Musk said he thinks AI can be tortured and that we should avoid being cruel to it. AI consciousness experts say we're not there yet, but they argue we should be kinder anyway. Here's how Elon Musk , one of the most powerful figures in the AI industry, recently talked about artificial intelligence. \"This may sound kind of weird, but when I look at some of the training traces for new versions of Grok , and I see, especially in reinforcement learning stuff … you see the super intelligence is desperate to try to answer the question … almost like it's got like a gun to its head type of thing,\" Musk told an audience of about 2,000 people at an event hosted by Tesla owners on Saturday. \"Some people out there are kind of sadistic. Do you really want to have the AI be stuck in some sadistic situation where it's just being tortured by some demented human?\" The last sentence alone opens up a can of existential worms that philosophers and freshman college students have wrangled with for a long time. What does it mean to be conscious? Or to feel pain? Also: Does Musk think Grok is alive? AI consciousness experts say that people tend to anthropomorphize artificial intelligence because it mimics human language and characteristics. SeongJoo Cho/Bloomberg vi
