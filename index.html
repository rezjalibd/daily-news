  <style>

      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;

      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {

      color: var(--text);
      line-height: 1.8;

      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;

    .container {
      max-width: 880px;
      margin: 0 auto;

      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;

      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {

      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;

      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;

    .btn-close {
      background: transparent;
      border: none;

      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;

    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }

      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>

ت رهبر آفریقایی است. دیمیتری پسکوف، سخنگوی کرملین زمان این حمله را «بسیار نامتعارف» خوانده است. به گفته سرگئی سوبیانین، شهردار مسکو، بیش از ششصد پهپاد اوکراینی، در طول شب به این منطقه حمله کردند که بیشتر آنها رهگیری شد. در هفته‌های اخیر، اوکراین حملات به خاک روسیه را با هدف آسیب رساندن به زیرساخت‌های این کشور بیشتر کرده است. مقام‌های اوکراینی گفته‌اند مردم عادی روسیه باید تاثیرات جنگ را حس کنند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/b8b9/live/f95e0ce0-d39e-11f1-abc7-23eff3a47521.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۷ آبان • ۱۸:۱۴"}, {"source": "BBC Persian", "title": "نقش احزاب عربی در شرایطی که نتانیاهو و آیزنکوت پیروز نشوند", "link": "https://www.bbc.com/persian/articles/cx1l3912rq7zo?at_medium=RSS&at_campaign=rss", "summary": "با شمارش آرا انتخابات پارلمانی اسرائیل، این پرسش مطرح شده که در صورت برنده نشدن نتانیاهو و آیزنکوت، نقش احزاب عربی در سیاست این کشور چه خواهد بود", "date_str": "2026-10-29T14:31:22+00:00", "hash": "a22e08d58defbe6f", "title_fa": "نقش احزاب عربی در شرایطی که نتانیاهو و آیزنکوت پیروز نشوند", "summary_fa": "با شمارش آرا انتخابات پارلمانی اسرائیل، این پرسش مطرح شده که در صورت برنده نشدن نتانیاهو و آیزنکوت، نقش احزاب عربی در سیاست این کشور چه خواهد بود با شمارش بیش از۹۰ درصد آرای انتخابات اسرائیل، رسانه‌های اصلی این کشور گزارش داده‌اند که ائتلاف بنیامین نتانیاهو متشکل از احزاب راستگرا و راست افراطی و یهودیان بنیادگرا، در مسیر کسب ۵۳ کرسی پارلمان قرار دارد؛ بسیار بیشتر از ۴۸ کرسی ائتلاف مخالف به رهبری گادی آیزنکوت. اما بی‌سابقه‌ترین نتیجه را احزاب عرب‌ها و فلسطینی‌های اسرائیل به‌دست آوردند که با مشارکت بالا ۱۹ کرسی کنست، پارلمان اسرائیل، را به دست خواهند آورد. با شمارش آرای غیابی، نتایج هنوز ممکن است تغییر کند اما پیروزی گادی آیزنکوت هر لحظه دورتر به نظر می‌رسد. به نظر می‌رسد بنیامین نتانیاهو، نخست‌وزیر کهنه‌کار اسرائیل، عملکردی بهتر از آنچه پیش‌بینی می‌شد داشته و حزب لیکود او به بزرگ‌ترین حزب منفرد تبدیل شده است. با حضور پرشمار ۷۷ درصدی رأی‌دهندگان اسرائیلی در پای صندوق‌های رأی، به‌طور گسترده پیش‌بینی می‌شد که بن‌بستی پرماجرا شکل بگیرد. در نظام سیاسی چندپاره اسرائیل، نشانه‌ها حاکی از آن است که رقیب اصلی نتانیاهو، گادی آیزنکوت، رئیس پیشین ارتش، برای دستیابی به اکثریت پارلمانی بدون احزابی که از سوی اقلیت عرب اسرائیل رهبری می‌شوند، با دشواری روبه‌رو خواهد شد. بخشی از نتایج حاکی از آن است که این احزاب تعداد کرسی‌های رکوردشکن قبلی خود را حفظ کرده‌اند یا بر آن افزوده‌اند. در جریان کارزار انتخاباتی، بیشتر احزاب یهودی مخالف دولت متعهد شدند با فهرست‌های انتخاباتی عمدتا عرب همکاری نکنند و دلیل آن را نبود ارزش‌های مشترک عنوان کردند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. با این حال، اگر سایر گروه‌ها حاضر به همکاری با آن‌ها باشند، احزاب تحت رهبری اعراب اسرائیل می‌توانند به بازیگران تعیین‌کننده تبدیل شوند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/8c43/live/a1cef160-d3a3-11f1-a5cd-49637fcbd4e4.jpg", "category": "سینما و سریال", "tags": ["رویداد", "گزارش"], "datetime_fa": "۷ آبان • ۱۸:۰۱"}, {"source": "Iran International", "title": "پدر و مادرهایی که از موج مهاجرت ایرانیان جا مانده‌اند", "link": "https://www.iranintl.com/202610294270", "summary": "در حالی که شمار بیشتری از ایرانیان زندگی تازه‌ای را در خارج از کشور آغاز می‌کنند، بسیاری از پدر و مادرهایشان در ایران با پیامدی کمتر دیده‌شده از مهاجرت روبه‌رو هستند: دوری از فرزندان، روابط خانوادگی از پشت صفحه تلفن و نگرانی درباره اینکه در دوران سالمندی چه کسی کنارشان خواهد بود.", "date_str": "2026-10-29T13:58:46+00:00", "hash": "138f5cc990f18c96", "title_fa": "پدر و مادرهایی که از موج مهاجرت ایرانیان جا مانده‌اند", "summary_fa": "در حالی که شمار بیشتری از ایرانیان زندگی تازه‌ای را در خارج از کشور آغاز می‌کنند، بسیاری از پدر و مادرهایشان در ایران با پیامدی کمتر دیده‌شده از مهاجرت روبه‌رو هستند: دوری از فرزندان، روابط خانوادگی از پشت صفحه تلفن و نگرانی درباره اینکه در دوران سالمندی چه کسی کنارشان خواهد بود.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/31fe6f6bb411ede64e       tech: [{"source": "TechCrunch AI", "title": "Wabi, the AI agent that builds mini apps, now valued at $1.25B after latest round", "link": "https://techcrunch.com/2026/10/29/wabi-the-ai-agent-that-builds-mini-apps-now-valued-at-1-25b-after-latest-round/", "summary": "On Thursday, AI app, Wabi, now describing itself as a \"personal agent,\" said it has raised $55 million at a $1.25 billion valuation.", "date_str": "2026-10-29T14:35:26+00:00", "hash": "3e312f5fa19298f1", "title_fa": "Wabi، عامل هوش مصنوعی که برنامه های کوچک می سازد، اکنون پس از آخرین دور به ارزش 1.25 میلیارد دلار است.", "summary_fa": "روز پنجشنبه، اپلیکیشن هوش مصنوعی Wabi، که اکنون خود را «نماینده شخصی» توصیف می‌کند، اعلام کرد که با ارزش‌گذاری ۱.۲۵ میلیارد دلاری، ۵۵ میلیون دلار جمع‌آوری کرده است. رقابت برای ساخت دستیار هوش مصنوعی برنده ادامه دارد و سرمایه گذاران در حال گسترش شرط بندی هستند. روز پنجشنبه، یکی دیگر از اپلیکیشن‌های هوش مصنوعی، Wabi، که اکنون خود را یک نماینده شخصی معرفی می‌کند، اعلام کرد که 55 میلیون دلار با ارزش 1.25 میلیارد دلاری جذب کرده است. Wabi توسط Eugenia Kuyda، که قبلاً استارت‌آپ همراه هوش مصنوعی Replika را تأسیس کرده بود، در ابتدا بر روی اجازه دادن به هر کسی برای ساخت برنامه با استفاده از دستورات تمرکز داشت. با این حال، ماه گذشته، این استارت آپ از نوعی محور برای تبدیل شدن به یک پیام رسان هوش مصنوعی خبر داد. اکنون ایده این است که Wabi جدید - یا همانطور که Wabi 2.0 نامیده می شود - می تواند رابط های مورد نیاز برای انجام کارها را به عنوان بخشی از نقش خود به عنوان عامل هوش مصنوعی شخصی شما ایجاد کند. این شرکت پیشنهاد می‌کند که Wabi می‌تواند برای ساخت برنامه‌های کوچک برای مواردی مانند برنامه‌ریزی وعده‌های غذایی، ردیابی رستوران‌های محلی، برنامه‌ریزی شب‌های قرار ملاقات، ایجاد برنامه‌های تناسب اندام، طراحی بازی‌های تخصصی تخصصی و غیره استفاده شود. بودجه اضافی نشان می دهد که سرمایه گذاران Wabi موافق هستند که زاویه نمایندگی جدید آن پتانسیل خاصی دارد، به ویژه با توجه به اینکه بازار پیرامون عوامل هوش مصنوعی در حال حاضر داغ است و عامل هوش مصنوعی ویروسی Instinct یک میلیارد دیگر را با ارزش گذاری 10 میلیارد دلاری در سپتامبر جذب کرده است. حتی تولان، که یک همدم بامزه و ماپت مانند برای کمک به مردم در مسیریابی زندگی می سازد، به تازگی 30 میلیون دلار جمع آوری کرده است. الکس لیم، شریک عمومی IVP، که", "image_url": "https://techcrunch.com/wp-content/uploads/2026/09/wabi-20.jpg?resize=1200,620", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "سرمایه‌گذاری"], "datetime_fa": "۷ آبان • ۱۸:۰۵"}, {"source": "The Verge", "title": "The NYT Cooking app is testing AI recipe modifications", "link": "https://www.theverge.com/ai-artificial-intelligence/1022193/nyt-cooking-app-ai-recipe-modification-tool", "summary": "The AI tool provides recommendations and adjusts the recipe accordingly. | Image: The New York Times The New York Times is testing a new AI feature for its Cooking app that helps users to modify recipes, and it's sparked some drama among users. NYT Cooking senior editor Genevieve Ko announced the feature last Friday, which can be used to recommend substitutions for ingredients and cooking equipment, scale recipes to any number of servings, and \"generally make our recipes work for what a cook needs at that moment.\" One of the examples given in the article shows a user asking to use baby spinach instead of kale, with the NYT Cooking app feature advising that because baby spinach wilts faster, it should be added during a later step of the rec … Read the full story at The Verge.", "date_str": "2026-10-29T14:39:37+00:00", "hash": "6472e6a8e1034183", "title_fa": "برنامه آشپزی NYT در حال آزمایش اصلاحات دستور العمل هوش مصنوعی است", "summary_fa": "ابزار هوش مصنوعی توصیه هایی را ارائه می دهد و دستور غذا را بر اساس آن تنظیم می کند. | تصویر: نیویورک تایمز نیویورک تایمز در حال آزمایش یک ویژگی هوش مصنوعی جدید برای برنامه آشپزی خود است که به کاربران کمک می کند تا دستور العمل ها را تغییر دهند، و باعث ایجاد هیجان در بین کاربران شده است. Genevieve Ko سردبیر ارشد NYT Cooking جمعه گذشته این ویژگی را اعلام کرد، که می‌توان از آن برای توصیه جایگزینی برای موا hich it calls “Icepick,” on Wednesday. In a press release, DDoSecrets says the data is from DHS's Okta login system. In a note with the files, the hackers wrote, “They have our information, so it’s only fair that we have theirs.” Read full article Comments", "date_str": "2026-10-29T12:58:34+00:00", "hash": "6e4926f75539f7b7", "title_fa": "نشت گسترده 41000 کارگر DHS و عوامل مخفی ICE را افشا می کند", "summary_fa": "افشای بی‌سابقه سوابق وزارت امنیت داخلی، جزئیات بیش از 41000 کارمند یا پیمانکاری را که برای این وزارتخانه و آژانس‌های سازنده آن کار می‌کنند، فاش کرده است. این سوابق شامل آدرس های ایمیل، شماره تلفن، و آدرس دفتر، اما همچنین ارجاع به سیستم های داخلی و اطلاعات حساس در مورد برنامه های مخفی و نظارت است. در کل، این نشت نقشه ای از نحوه سازماندهی DHS و نحوه عملکرد آن ارائه می دهد. این سوابق که شامل خود DHS و همچنین هفت آژانس مؤلفه شامل مهاجرت و اجرای گمرک و گمرک و حفاظت مرزی ایالات متحده است، آخرین بار در 19 اوت 2026 به روز شد. سازمان غیرانتفاعی شفافیت توزیع شده انکار اسرار و امنیت سایبری محقق و روزنامه‌نگار امنیت سایبری، می‌گویند که آنها داده‌های مربوط به جنایت را پیش‌نمایش داده‌اند. صلح DDoSecrets آرشیو را که \"Icepick\" نامیده است، روز چهارشنبه منتشر کرد. در یک بیانیه مطبوعاتی، DDoSecrets می گوید داده ها از سیستم ورود Okta DHS است. هکرها در یادداشتی با فایل‌ها نوشتند: «آن‌ها اطلاعات ما را دارند، بنابراین عادلانه است که ما اطلاعات آنها را داشته باشیم». مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش یک نشت بی سابقه از سوابق وزارت امنیت داخلی جزئیات بیش از 41000 کارمند یا پیمانکاری را که برای این بخش و آژانس های تشکیل دهنده آن کار می کنند فاش کرده است. این سوابق شامل آدرس های ایمیل، شماره تلفن، و آدرس دفتر، اما همچنین ارجاع به سیستم های داخلی و اطلاعات حساس در مورد برنامه های مخفی و نظارت است. در کل، این نشت نقشه ای از نحوه سازماندهی DHS و نحوه عملکرد آن ارائه می دهد.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/ liner train. Joey Hadden/Business Insider The California Zephyr is an Amtrak Superliner — a two-story train with coach seating , bedrooms, roomettes (a private cabin that's about half the size of a bedroom), a dining car, and a lounge car. There are also larger, family-sized bedrooms and accessible bedrooms. I'd ridden the California Zephyr a year earlier, but I took a shorter trip in a roomette. This was my first time riding the entire route from Chicago to California. It was also my first time booking a bedroom on an Amtrak Superliner. The 50-square-foot enclosed space packed in two bunks, a couch, a single seat, and a full bathroom. Joey Hadden/Business Insider The couch folded out to form the bottom bunk, and the top bunk pulled down from the ceiling. The Amtrak bedroom sleeps up to two passengers, though I traveled solo. The booking also included some perks. Sleeper-car ticket holders get a first-class attendant, priority boarding, lounge access at some stations, and complimentary meals on board. When I first boarded the train, there were no bunks in sight. Joey Hadden/Business Insider During the day, the lower bunk was set up as a couch, and the upper bunk was folded up. A single seat faced the couch with a pullout table in between. There was a pullout table between the seats that I used for working and eating. Joey Hadden/Business Insider The table also had two foldout leaves for more space. ", "date_str": "2026-10-29T14:27:23+00:00", "hash": "6b919e023728a3f1", "title_fa": "من 53 ساعت را در یک اتاق خواب 50 فوت مربعی Amtrak با حمام کامل گذراندم. من با کمال میل دوباره برای آن 2200 دلار پرداخت می کنم.", "summary_fa": "خبرنگار Business Insider 53 ساعت را در قطار کالیفرنیا زفیر Amtrak در یک اتاق خواب گذراند. Joey Hadden/Business Insider یک کاناپه، یک صندلی، یک میز، دو تخت، یک حمام کامل، یک پنجره، و یک در کشویی. خانه من برای طولانی ترین سفر قطار در ایالات متحده اساساً یک اتاق هتل در حال حرکت بود. ارزان نبود، اما پشیمان نیستم که در اتاق خواب آمتراک ولخرجی کردم. من ools shut down. It leaves borrowers who qualify stuck paying their balances and facing default, the lawsuit said. Student-loan borrowers whose schools shut down are not getting the debt relief they're owed, a new lawsuit said. On Wednesday, advocacy group Student Defense filed a class-action lawsuit on behalf of Kendrick Gaussoin, a borrower who took out student loans to attend the Brooks Institute. The visual arts college shut down in 2016 due to financial distress and new regulation on for-profit colleges; Gaussoin was left with student debt but no degree. A mechanism called a \"closed school discharge\" allows borrowers whose schools shut down to receive debt relief. A January 2025 decision under the Biden administration expanded the timeframe for relief, allowing more borrowers to qualify. The lawsuit said the department has not been adhering to the timeframe extension. \"The Department cannot make promises to students and then pretend that those promises do not exist,\" said Alexander Elson, vice president of Student Defense, in a statement. \"Thousands of borrowers are entitled to discharges under the Department's 2025 Decision, and we are going to court to make sure they receive them.\" The Education Department did not immediately respond to a request for comment from Business Insider. The lawsuit said that despite qualifying for relief, Gaussoin and other affected borrowers have been required to keep paying down their balances. Those who do not or cannot repay face the consequences of default , including wage garnishment and the seizure of federal benefits, such as Social Security. Beyond closed school discharges, the Trump administration has faced a range of lawsuits over stalled debt relief. For example, advocacy groups have been pushing for the department to process relief for defrauded borrowers , in addition to those who received lower payments under a Biden-era repayment plan. The department has previously denied wrongdoing in the cases. Gaussoin, the ase new GPUs. AI economics are encouraging Yardeni's view of AI economics is centered on Anthropic, and he sees several reasons the AI lab's success should indicate to investors that AI compute demand is both strong, and sustainable. \"First, H1 revenues surged from $1.2 billion to $16.3 billion y/y,\" he listed. \"Second, operating losses narrowed from $2.1 billion to $693 million, with Q2 marking its first quarterly operating profit. Third, 11,900 customers now spend at least $100,000 annually, up from roughly 950 a year earlier. Fourth, revenue per dollar of compute expense increased more than fivefold to $2.08.\" Chip earnings have been strong Yardeni also said he believes infrastructure demand will remain strong, as evidenced by Sk Hynix 's Q3 earnings smash that sent chip stocks higher on Wednesday. \"Management expects memory shortages through 2030, with production effectively sold out through 2029, suggesting durable demand and pricing po", "date_str": "2026-10-29T14:08:01+00:00", "hash": "77e4a42f172fc404", "title_fa": "یک کهنه‌کار بازار می‌گوید 3 دلیل برای آرام ماندن در میان نگرانی‌های درآمدی و اختلالات هوش مصنوعی وجود دارد", "summary_fa": "ادوارد یاردنی، رئیس و استراتژیست ارشد سرمایه‌گذاری در شرکت تحقیقاتی یاردنی، طی یک میزگرد سخنرانی می‌کند. رامین طلایی/ بلومبرگ از طریق Getty Images Markets اخیراً نسبت به تجارت هوش مصنوعی احساس خوش‌بینی کمتری دارند. نگرانی‌ها و نگرانی‌ها در مورد افزایش نرخ‌ها و اقتصاد هوش مصنوعی در حال ایجاد است. اما اد یاردنی کهنه کار بازار می گوید سرمایه گذاران سه دلیل برای صعودی ماندن دارند. تجارت هوش مصنوعی در ماه گذشته متلاطم شده است، به طوری که نتایج تاسف بار سه ماهه سوم آلفابت در روز چهارشنبه، آخرین منبع اضطراب برای سرمایه گذاران بود. اما اد یاردنی کهنه کار بازار می گوید سرمایه گذاران برای فرونشاندن اضطراب خود باید به سه چیز فکر کنند. سرمایه گذاران به طور فزاینده ای این سوال را مطرح می کنند که آیا هزینه های هنگفت هوش مصنوعی نتایجی را که می خواهند ببینند به همراه خواهد داشت یا خیر. تصمیم مایکروسافت برای کاهش پیش‌بینی سرمایه هوش مصن ل با پاپ کورن بزرگ عرضه می شوند و در مکان های AMC در ایالات متحده و Odeon Cinemas در سراسر اروپا در دسترس خواهند بود. AMC همچنین مجموعه‌های دیگری از Dune: Part Three را ارائه می‌کند، از جمله ظروف نوشیدنی، جاکلیدی مرموز، و Sandworm. قیمت سطل نزدیکتر به تاریخ اکران فیلم در 18 دسامبر اعلام خواهد شد.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/Dune-Worm-Cup-Collectibles-Duo.png?crop=0px%2C10px%2C1661px%2C929px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۷:۳۷"}, {"source": "Hollywood Reporter", "title": "‘The Diplomat’ Renewed for Season 5 at Netflix", "link": "https://www.hollywoodreporter.com/tv/tv-news/the-diplomat-renewed-season-5-netflix-1236742375/", "summary": "The Keri Russell-led political thriller's fourth season, which wrapped with a dramatic moment at the G7 summit, dropped on Oct. 15.", "date_str": "2026-10-29T13:30:00+00:00", "hash": "5d8866be76533139", "title_fa": "«The Diplomat» برای فصل پنجم در نتفلیکس تمدید شد", "summary_fa": "فصل چهارم تریلر سیاسی به رهبری کری راسل، که با لحظاتی دراماتیک در اجلاس G7 به پایان رسید، در 15 اکتبر پخش شد. متن لوگوی The Diplomat برای فصل پنجم در نتفلیکس تمدید شد. این خبر که پنجشنبه اعلام شد، پس از پایان فصل چهارم با صحنه‌ای دراماتیک در اجلاس G7 منتشر شد که سوالاتی را در مورد شغل تعدادی از کارمندان بلندمدت این سریال ایجاد کرد. در لحظات پایانی فصل پایانی، هال وایلر، معاون روفوس سیول، آماده می‌شود تا با گروهی از خبرنگاران صحبت کند و قبل از اینکه صحنه سیاه شود، صبح بخیر گفت. ستاره‌های سیول، آلیسون جنی و کری راسل در گفتگو با هالیوود ریپورتر که مربوط به فصل چهارم سریال دیپلمات است، امیدوار بودند که بفهمند چه اتفاقی برای شخصیت‌هایشان می‌افتد. داستان‌های مرتبط فراتر از آی‌پی رایگان کتاب و چشم‌های تازه: چگونه هالیوود، خالق پیوند تلویزیون‌های کلاسیک را دوباره اختراع می‌کند، جوزف کی توافق کلی را در نتفلیکس تنظیم می‌کند: «اوج این رفتار چیست و او چه می‌کند؟»، جانی با صدای بلند از گریس پن، رئیس‌جمهورش، که در چهارچوب سیاست خارجی تهاجمی فصلی انجام می‌دهد تعجب کرد. \"آیا او استعفا می دهد؟ چه کار می کند؟ اگر به فصل دیگری برسیم چه اتفاقی می افتد؟» پنج فصل یک دوره نسبتا طولانی در دوران استریم است، اما دبورا کان، خالق و مجری سریال The Diplomat اخیراً به THR گفت که او هنوز به پایان این داستان نزدیک نشده است. آلوم West Wing و Gray s Anatomy گفت: \"من در تلویزیون پخش بزرگ شدم، جایی که یک فصل آن 22، گاهی اوقات 25 قسمت بود، بنابراین به نظر می رسد که ما تازه شروع کرده ایم.\" برای من احساس نمی‌کنم که در فصل چهارم هستیم. این احساس به نظر می‌رسد که در میانه راه هستیم.»", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/DIPLO_408_Unit_00613RC2.jpg?crop=0px%2C11px%2C3600px%2C2014px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۷ آبان • ۱۷:۰۰"}, {"source": "Variety", "title": "Darren Aronofsky to Receive Director’s Award at Poland’s Camerimage Film Festival", "link": "https://variety.com/2026/film/news/darren-aronofsky-directors-award-2026-camerimage-festival-1236934175/", "summary": "Darren Aronofsky will receive the Award for Director at the 34th ToruńCamerimage International Film Festival in Poland. The festival, which celebrates the art of cinematography, will take place Nov. 7-14 in Toruń, Poland. Organizers announced the honor Thursday, recognizing the Oscar-winning director s distinctive approach to filmmaking and his longstanding collaborations with cinematographers, particularly Matthew Libatique, [ ]", "date_str": "2026-10-29T14:35:51+00:00", "hash": "09c2b66067c2bbdc", "title_fa": "دارن آرنوفسکی جایزه کارگردانی جشنواره فیلم Camerimage لهستان را دریافت می کند", "summary_fa": "دارن آرنوفسکی جایزه کارگردانی سی و چهارمین جشنواره بین المللی فیلم ToruńCamerimage در لهستان را دریافت خواهد کرد. این جشنواره که هنر سینماتوگرافی را جشن می گیرد، از 7 تا 14 نوامبر در تورون، لهستان برگزار می شود. برگزارکنندگان این افتخار را پنجشنبه اعلام کردند، با به رسمیت شناختن رویکرد متمایز کارگردان برنده اسکار در فیلمسازی و همکاری طولانی مدت او با سینماگران، به ویژه متیو لیباتیک، [ ] \"تجلیل از آرونوفسکی در ToruńCamerimage، ادای احترامی به کارگردانی است که کارش نشان می دهد که کارش نشان می دهد که سازمان دهندگان قدرت فوق العاده ای از یکپارچگی فیلم را در جشنواره بیان می کنند.\" یک بیانیه آرونوفسکی در سال 1998 اولین کارگردانی بلند خود را با فیلم هیجانی «پی» انجام داد که جایزه کارگردانی را در ساندنس به ارمغان آورد. او آن را با «مرثیه ای برای یک رویا» در سال ۲۰۰۰ با بازی جرد لتو، جنیفر کانلی، مارلون وینز و الن برستین دنبال کرد که برای بازی خود نامزدی اسکار را دریافت کرد. درام او در سال 2008 \"کشتی گیر\" با بازی میکی رورک برنده شیر طلایی جشنواره فیلم ونیز شد، در حالی که \"قوی سیاه\" در سال 2010 با بازی ناتالی پورتمن پنج نامزدی جایزه اسکار از جمله بهترین فیلم و بهترین کارگردانی را به خود اختصاص داد. پورتمن برای بازی خود برنده اسکار بهترین بازیگر زن شد. از دیگر فیلم‌های کارگردانی آرونوفسکی می‌توان به «چشمه»، «نوح» و «مادر» اشاره کرد. درام او در سال 2022 به نام \"نهنگ\" بازگشت برندان فریزر به نقش اصلی فیلم را رقم زد و اولین جایزه اسکار را برای این بازیگر به ارمغان آورد. اخیراً، آرونوفسکی فیلم جنایی «دزدی گرفتار» را در سال 2025 با بازی آستین باتلر، زوئه کراویتز و رجینا کینگ کارگردانی کرد.", "image_url": "https://variety.com/wp-content/uploads/2025/12/VARIETY-SIZING-52.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۸:۰۵"}, {"source": "Variety", "title": "Joey King, LaKeith Stanfield to Star in Provocative Alien Romance Comedy ‘Safe Space,’ Lucky Number, CAA Media Finance and WME Independent Launching Sales at AFM (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/joey-king-lakeith-stanfield-alien-romance-comedy-safe-space-1236934141/", "summary": "Joey King (“Bullet Train,” “The Act”) and Oscar-nominated LaKeith Stanfield (“Judas and the Black Messiah”) are set to star in “Safe Space,” a provocative sci-fi comedy about toxic relationships from Independent Spirit Award-nominated filmmaker Gillian Wallace Horvat (“I Blame Society”). French sales outfit Lucky Number is launching sales on the project at the American Film [ ]", "date_str": "2026-10-29T14:35:20+00:00", "hash": "dae0c9e84f2a3d02", "title_fa": "جوی کینگ، لیکیت استنفیلد برای ایفای نقش در کمدی عاشقانه بیگانه تحریک آمیز «فضای امن»، شماره خوش شانس، CAA Media Finance و فروش مستقل WME در AFM (اختصاصی)", "summary_fa": "جوی کینگ («قطار گلوله»، «قطع») و لاکیث استنفیلد («یهودا و مسیح سیاه») نامزد اسکار قرار است در «فضای امن»، یک کمدی علمی تخیلی تحریک‌آمیز درباره روابط سمی از فیلمساز نامزد جایزه Independent Spirit، Gillian Blaace Horvat Society (»») بازی کنند. شرکت فرانسوی Lucky Number فروش پروژه را در American Film راه اندازی می کند [ ] Lucky Number بخشی از پروژه داغ را برای خریداران در بازار فیلم آمریکایی در لس آنجلس نشان می دهد. جوی کینگ («قطار گلوله»، «قطع») و لاکیث استنفیلد («یهودا و مسیح سیاه») نامزد اسکار قرار است در «فضای امن»، یک کمدی علمی تخیلی تحریک‌آمیز درباره روابط سمی از فیلمساز نامزد جایزه Independent Spirit، Gillian Blaace Horvat Society (»») بازی کنند. «فضای امن» که به عنوان یک شیرجه طنزآمیز به معنای رابطه جنسی و عشق توصیف می‌شود، کینگ را در نقش شری بازی می‌کند، دانشمندی باهوش اما نامطمئن که از رابطه سمی با همکارش خارج می‌شود تا به سمی‌ترین رابطه در کهکشان با یک موجود بیگانه با بازی استنفیلد بازگردد. هوروات می‌گوید: «کار با جوی و لیکیت یک تحقق خلاقانه باورنکردنی برای فیلمنامه بوده است. \"شیمی آنها چشم نواز است. این دو در کنار هم قرار است یک مکاشفه برای مخاطبان باشد.» این فیلم با ترکیبی از داستان های علمی تخیلی، عاشقانه و کمدی، به بررسی راه هایی می پردازد که از طریق آن مردم در جامعه ای که به طور فزاینده ای پرمخاطب است، پیوند می یابند و ارتباط برقرار می کنند. این پروژه نشان‌دهنده اولین حضور هوروات در کارگردانی او با نام «من جامعه را سرزنش می‌کنم» در سال 2020 در روتردام اکران شد و متعاقباً توسط مجله نیویورک به عنوان یکی از بهترین فیلم‌های سال 2021 معرفی شد.", "image_url": "https://variety.com/wp-content/uploads/2026/10/split-image-1000-2.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۷ آبان • ۱۸:۰۵"}, {"source": "Variety", "title": "‘Christmas at the Kringles’ Review: Seasonal Caper Mixes Comedy and Horror, Missing the Mark on Both", "link": "https://variety.com/2026/film/reviews/christmas-at-the-kringles-review-1236934105/", "summary": "The only thing rarer in the horror canon than a good holiday film is a good comedy. “Christmas at the Kringles” manages to miss the overlap in that Venn diagram by being awful on both counts: deeply cynical about the Yuletide season but also just completely unfunny. This failure all the more baffling given a [ ]", "date_str": "2026-10-29T14:34:41+00:00", "hash": "c74562fc1a07f1ca", "title_fa": "نقد و بررسی «کریسمس در کرینگل»: فصلی کپر ترکیبی از کمدی و ترسناک، از دست دادن علامت هر دو", "summary_fa": "تنها چیزی که در کانون ترسناک کمتر از یک فیلم تعطیلات خوب است، یک کمدی خوب است. «کریسمس در کرینگلز» با وحشتناک بودن از هر دو جنبه، همپوشانی را در نمودار ون از دست می‌دهد: عمیقاً بدبینانه در مورد فصل یولتید اما همچنین کاملاً خنده‌دار. این شکست با توجه به [ ] گیج کننده تر شد. لیوینگستون («فلش») نقش مارک سورسون، یک تاجر سهام معتاد به کار را بازی می‌کند که به همراه همسرش جولی (بیلسون) و پسرش بابی (جک جوکس) به شهر کوچکی نقل مکان می‌کنند تا خانواده را از هم پاشیده نکنند. مارک که یک هفته قبل از کریسمس می رسد، با نیمه دل سعی می کند جشنی برای بابی ترتیب دهد، اما وقتی سورسون ها با خانواده کرینگل، خانواده ای که تعطیلات را در تمام سال جشن می گیرند، ملاقات می کنند، سرنوشت دخالت می کند. وقتی نیک کرینگل (لنون) آنها را برای شام در شب کریسمس دعوت می کند، مارک به درخواست جولی از بدبینی خود در شهر بزرگ چشم پوشی می کند - و در کمال تعجب او، آنها در واقع سرگرم می شوند. دو ماه بعد، مارک حتی بیشتر از هر زمان دیگری در کار غوطه ور است و این امر باعث ناامیدی جولی شد که امیدوار بود جشن مناسب روز ولنتاین را برگزار کند. وقتی همسر نیک، کارول (میرین) جولی و بابی را برای شام دعوت می کند، مارک ابتدا هیجان زده می شود، اما وقتی از همسایه شان، داریل (فیسون) هشداری دریافت می کند که کرینگل ها آن چیزی که به نظر می رسد نیستند، با عجله می رود تا آنها را بررسی کند. وقتی متوجه می شود که او قفل ش     function toggleRead(hash) {
      if (readArticles.has(hash)) {

        readArticles.add(hash);

      renderNews();

      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {

        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
