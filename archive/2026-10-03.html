وی او برای دنیاست: « مهم زبان یا دهان آقای عراقچی است که باید کنترل شود تا کلامی از آن خارج نشود که باعث ریزش قیمت جهانی نفت شود. اگر یک ماه آقای عراقچی مصاحبه نکند یا یک ماه هیأتی از طرف به‌اصطلاح میانجی‌گران که عمدتاً نماینده آمریکا هستند،"}, {"source": "IranWire", "title": "هر ۱۰ساعت یک برخورد؛ بررسی یک ماه سرکوب سیستماتیک بهاییان در ایران", "link": "https://iranwire.com/fa/features/158398-%D9%87%D8%B1-%DB%B1%DB%B0%D8%B3%D8%A7%D8%B9%D8%AA-%DB%8C%DA%A9-%D8%A8%D8%B1%D8%AE%D9%88%D8%B1%D8%AF-%D8%A8%D8%B1%D8%B1%D8%B3%DB%8C-%DB%8C%DA%A9-%D9%85%D8%A7%D9%87-%D8%B3%D8%B1%DA%A9%D9%88%D8%A8-%D8%B3%DB%8C%D8%B3%D8%AA%D9%85%D8%A7%D8%AA%DB%8C%DA%A9-%D8%A8%D9%87%D8%A7%DB%8C%DB%8C%D8%A7%D9%86-%D8%AF%D8%B1-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86/", "summary": "دستکم ۶۸ مورد آزار سیستماتیک علیه شهروندان بهایی در ۳۰ روز گذشته در ایران به ثبت رسیده است؛ آماری که نشان می‌دهد در یک ماه اخیر، به‌طور ...", "date_str": "2026-10-02T15:38:27+00:00", "hash": "60615be488ccba70", "title_fa": "هر ۱۰ساعت یک برخورد؛ بررسی یک ماه سرکوب سیستماتیک بهاییان در ایران", "summary_fa": "دستکم ۶۸ مورد آزار سیستماتیک علیه شهروندان بهایی در ۳۰ روز گذشته در ایران به ثبت رسیده است؛ آماری که نشان می‌دهد در یک ماه اخیر، به‌طور ... بررسی برخوردهای امنیتی حکومتی با بهاییان در ایران نشان می‌دهد که از ۱۰شهریور تا ۹مهر امسال، هر ۱۰ساعت یک‌بار، یک شهروند بهایی با بازداشت، تفتیش منزل، ضبط اموال، احضار یا فشار در زندان مواجه شده است. مساله دیگر تنها «نقض حقوق بشر» در قالب رویدادهای پراکنده نیست؛ بلکه سخن از یک سرکوب نظام‌مند و هدایت‌شده است که پیروان بزرگ‌ترین اقلیت مذهبی غیرمسلمان در ایران را هدف قرار داده است. دستکم ۶۸ مورد آزار سیستماتیک علیه شهروندان بهایی در ۳۰ روز گذشته در ایران به ثبت رسیده است؛ آماری که نشان می‌دهد در یک ماه اخیر، به‌طور میانگین هر ۱۰ساعت یک‌بار، یک شهروند بهایی با بازداشت، تفتیش منزل، ضبط اموال، احضار یا فشار در زندان مواجه شده است. این تراکم بالای آزار و خشونت حکومتی از یک‌سو الگوی فشارهای چندلایه بر افراد و از سوی دیگر تمرکز ویژه نهادهای امنیتی بر چند شهر مشخص را آشکار می‌کند. موارد بررسی‌شده در این گزارش، برخوردهای امنیتی حکومت با شهروندان بهایی را طی تاریخ‌ ۱۰ شهریور۱۴۰۵ تا ۹مهر۱۴۰۵ در بر می‌گیرد. بیشترین میزان فشار امنیتی بر شهروندان بهایی به‌شکل تفتیش منازل این شهروندان، ضبط اموال و سپس احضار به مراکز امنیتی خودنمایی می‌کند. بر همین اساس طی ۳۰ روز گذشته ۱۴ مورد تفتیش منازل و ضبط اموال بهاییان از سوی نهادهای امنیتی جمهوری اسلامی انجام شده است که تمام این موارد به احضار این شهروندان به نهادهای امنیتی و بازجویی منجر شده است. موارد احضار به تنهایی به ۱۶ مورد طی یک ماه می‌رسد. بررسی این مدل از برخورد با شهرندان بهایی در یک ماه گذشته نشان می‌دهد که ماموران امنیتی هر دو روز منزل یک شهروند بهایی را تفتیش و اموال آن‌ها را ضبط کرده‌اند."}, {"source": "IranWire", "title": "بیانیه مشترک ۴۶کشور در محکومیت تداوم اعدام‌ مخالفان و معترضان در ایران", "link": "https://iranwire.com/fa/news-1/158399-%D8%A8%DB%8C%D8%A7%D9%86%DB%8C%D9%87-%D9%85%D8%B4%D8%AA%D8%B1%DA%A9-%DB%B4%DB%B6%DA%A9%D8%B4%D9%88%D8%B1-%D8%AC%D9%87%D8%A7%D9%86-%D8%AF%D8%B1-%D9%85%D8%AD%DA%A9%D9%88%D9%85%DB%8C%D8%AA-%D8%AA%D8%AF%D8%A7%D9%88%D9%85-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85-%D9%85%D8%AE%D8%A7%D9%84%D9%81%D8%A7%D9%86-%D9%88-%D9%85%D8%B9%D8%AA%D8%B1%D8%B6%D8%A7%D9%86-%D8%AF%D8%B1-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86/", "summary": "چهل و شش کشور جهان با ارای بیانیه‌ای مشترک به شورای حقوق بشر سازمان ملل متحد، تداوم اعدام‌ها و افزایش موارد صدور و اجرای این مجازات در ا ...", "date_str": "2026-10-02T16:05:22+00:00", "hash": "485594dd2c1d7317", "title_fa": "بیانیه مشترک ۴۶کشور در محکومیت تداوم اعدام‌ مخالفان و معترضان در ایران", "summary_fa": "چهل و شش کشور جهان با ارای بیانیه‌ای مشترک به شورای حقوق بشر سازمان ملل متحد، تداوم اعدام‌ها و افزایش موارد صدور و اجرای این مجازات در ا ... امضاکنندگان این بیانیه به شکل ویژه از روند اعدام معترضان بازداشت‌شده در جریان اعتراضات دی‌ماه۱۴۰۴ ابراز نگرانی کرده‌اند. در ۹ماه گذشته، جمهوری اسلامی دست‌کم ۵۹۰نفر، از جمله ۲۲زن را اعدام کرده و صدها نفر نیز در خطر اجرای مجازات اعدام قرار دارند که نام بسیاری از آن‌ها رسانه‌ای نشده است. در این بیانیه که به امضای همه اعضای اتحادیه اروپا به جز لهستا زی، تایید شده جمهوری اسلامی از یک‌سو با هنرمندان معترض داخل ایران با برخوردهای امنیتی و صدور احکام قضایی مواجه می‌شود و از سوی دیگر از هنرمندان تبعیدی دعوت می‌کند که به ایران بازگردند. دعوت از هنرمندان خارج از ایران همچنان جریان دارد اما حالا با تهدید نهادهای وابسته به بخش تندروی حاکمیت همراه شده است. همزمان، احضار و صدور احکام قضایی برای هنرمندان داخل ایران هم ادامه دارد. کنار هم قرار گرفتن این دو رویکرد، بیان‌گر برخورد دوگانه جمهوری اسلامی با مساله هنرمندان است. به‌تازگی حکم حبس «الناز شاکردوست» بازیگر ساکن ایران به‌خاطر فعالیت در فضای مجازی، تایید شده است . «هوشنگ پوربابایی»، وکیل این هنرمند در گفت‌وگو با «امتداد» خبر داده که دادگاه تجدیدنظر استان تهران، حکم بدوی یک سال حبس تعزیری و دو سال محرومیت از فعالیت‌های سیاسی، مجازی و هنری علیه موکل‌اش را تایید کرده است. همراستا با برخوردهای امنیتی قضایی با هنرمندان داخل ایران، در تابستان سال جاری هما‌ن‌طور که پیش‌تر گزارش شده بود ده‌ها هنرمند و سینماگر، در پی اعتراض به موج اعدام‌ها در ایران به نهادهای امنیتی یا مراجع قضایی احضار شدند. اما همزمان با برخوردهای امنیتی با هنرمندان داخل ایران، این روزها شاهد بازگشت هنرمندان مهاجر و دعوت دولت از آن‌ها برای این بازگشت هستیم. در آخرین نمونه «بیژن مرتضوی» به ایران بازگشت اما کم‌تر از دو روز بعد از بازگشت او، صداوسیمای جمهوری‌اسلامی در گزارشی این پرسش را مطرح کرد که آیا بازگشت «بدون هزینه» مرتضوی و دیگر هنرمندان خارج از کشور، «توجیه عقلانی» دارد؟ نام «محسن نامجو»، «فاطمه معتمدآریا» و «اصغر فرهادی» هم در گزارش این نهاد مطرح شد. صداوسیما خواستار بررسی قضایی مواضع و فعالیت‌های گذشته آن‌ها شده و رسانه‌های داخلی، پیام گزارش را درخواست برای محاکمه هنرمندان بازگشته توصیف کردند."}, {"source": "IranWire", "title": "دفاع از بمب اتم و احمدی‌نژاد؛ وصف نظام‌الدین موسوی از سیاست مطلوب", "link": "https://iranwire.com/fa/features/158427-%D8%AF%D9%81%D8%A7%D8%B9-%D8%A7%D8%B2-%D8%A8%D9%85%D8%A8-%D8%A7%D8%AA%D9%85-%D9%88-%D8%A7%D8%AD%D9%85%D8%AF%DB%8C%D9%86%DA%98%D8%A7%D8%AF-%D9%88%D8%B5%D9%81-%D9%86%D8%B8%D8%A7%D9%85%D8%A7%D9%84%D8%AF%DB%8C%D9%86-%D9%85%D9%88%D8%B3%D9%88%DB%8C-%D8%A7%D8%B2-%D8%B3%D ary": "پژوهش جدید اخترفیزیکی نشان می‌دهد تا آن زمان زمین مدت‌ها نابود شده است، اما سیارات بیرونی نیز بسیار زودتر از انتظار از مدار خارج می‌شوند.", "date_str": "2026-10-02T14:51:31+00:00", "hash": "12b7b0508f2530f4", "title_fa": "دانشمندان می‌گویند سامانه خورشیدی بسیار زودتر از تصور فرو می‌پاشد", "summary_fa": "پژوهش جدید اخترفیزیکی نشان می‌دهد تا آن زمان زمین مدت‌ها نابود شده است، اما سیارات بیرونی نیز بسیار زودتر از انتظار از مدار خارج می‌شوند."}, {"source": "Euronews Persian", "title": "افشاگری‌ درباره رهبر حزب راست فرانسه؛ مدیاپار تصاویر پیام‌های «یهودستیزانه» منتسب به جردن باردلا را منتشر کرد", "link": "https://parsi.euronews.com/2026/10/02/mediapar-publishes-images-of-anti-semitic-messages-attributed-to-jordan-bardella", "summary": "در دومین موج افشاگری‌ها درباره جردن باردلا، رسانه تحقیقی «مدیاپار» تصاویر جدیدی از پیام‌های یهودستیزانه منتسب به رهبر حزب راستگرای «اجتماع ملی» منتشر کرده است. با این حال، آقای باردلا نوشتن این پیام‌ها را منکر شد.", "date_str": "2026-10-02T14:33:10+00:00", "hash": "4c008373c49c4f79", "title_fa": "افشاگری‌ درباره رهبر حزب راست فرانسه؛ مدیاپار تصاویر پیام‌های «یهودستیزانه» منتسب به جردن باردلا را منتشر کرد", "summary_fa": "در دومین موج افشاگری‌ها درباره جردن باردلا، رسانه تحقیقی «مدیاپار» تصاویر جدیدی از پیام‌های یهودستیزانه منتسب به رهبر حزب راستگرای «اجتماع ملی» منتشر کرده است. با این حال، آقای باردلا نوشتن این پیام‌ها را منکر شد."}, {"source": "BBC Persian", "title": "آمریکا هم از پایان جنگ با ایران می‌گوید، هم برای تشدید آن آماده می‌شود", "link": "https://www.bbc.com/persian/articles/cry4xyj8w1kwo?at_medium=RSS&at_campaign=rss", "summary": "درحالی‌که دونالد ترامپ جمعه شب در یک سخنرانی انتخاباتی در آلاباما گفت جنگ احتمالا بلافاصله پس از انتخابات پایان خواهد یافت، سایت اکسیوس گزارش داد که شماری از ارشدترین مقام‌های امنیت ملی دولت همان روز در نشستی اعلام‌نشده و چندساعته در کمپ دیوید درباره گام‌های بعدی آمریکا در جنگ با ایران گفت‌وگو کرده‌اند.", "date_str": "2026-10-03T12:15:55+00:00", "hash": "b40d7b9f30b4ea38", "title_fa": "آمریکا هم از پایان جنگ با ایران می‌گوید، هم برای تشدید آن آماده می‌شود", "summary_fa": "درحالی‌که دونالد ترامپ جمعه شب در یک سخنرانی انتخاباتی در آلاباما گفت جنگ احتمالا بلافاصله پس از انتخابات پایان خواهد یافت، سایت اکسیوس گزارش داد که شماری از ارشدترین مقام‌های امنیت ملی دولت همان روز در نشستی اعلام‌نشده و چندساعته در کمپ دیوید درباره گام‌های بعدی آمریکا در جنگ با ایران گفت‌وگو کرده‌اند. بنابر این گزارش، این جلسه به ریاست جی‌دی ونس، معاون رئیس‌جمهوری آمریکا، برگزار شد و مارکو روبیو، وزیر خارجه، پیت هگست، وزیر دفاع، استیو ویتکاف، فرستاده کاخ سفید، جان رتکلیف، رئیس سیا، و ژنرال دن کین، رئیس ستاد مشترک ارتش آمریکا، در آن حضور داشتند. یکی از مقام‌های آمریکایی به اکسیوس گفت که در این نشست درباره مسائل مهم خاورمیانه «تصمیم‌گیری» شد یا «دست‌کم جدا بررسی شدند.» کاخ سفید در این باره اظهارنظر نکرده است. اکنون که به نظر می‌رسد مذاکرات ایران و آمریکا به بن‌بست رسیده، به نوشته اکسیوس، آقای ترامپ در حال بررسی از سرگیری عملیات عمده نظامی علیه ایران است. او روز پنجشنبه هشدار داده بود که یا ایران توافق را امضا می‌کند یا دیگر «وجود نخواهد داشت.» زمان برگزاری نشست کمپ دیوید نیز مورد توجه قرار گرفته است. اکسیوس می‌گوید آخرین نشست مشابه در ژوئن ۲۰۲۵، تنها چند روز پیش از آغاز جنگ دوازده‌روزه برگزار شده بود. در مجموع، یکی از محورهای اصلی پوشش رسانه‌های آمریکایی در روز جمعه، فاصله میان سخنان آقای ترامپ درباره نزدیک بودن پایان جنگ و افزایش هم‌زمان آمادگی نظامی آمریکا در منطقه بود. شبکه سی‌بی‌اس گزارش داده است که ناوگروه هواپیمابر «تئودور روزولت» و گروه آماده آبی-خاکی «مکین آیلند» راهی خاورمیانه شده‌اند. با ورود این نیروها، آمریکا ممکن است هم‌زمان سه ناوگروه هواپیمابر و دو گروه آماده آبی-خاکی در منطقه داشته باشد. سی‌بی‌اس می‌گوید این تقویت حضور نظامی در حالی صورت می‌گیرد که آقای ترامپ در سخنرانی‌هایش تصویری متفاوت از وضعیت جنگ ارائه می‌کند، می‌گوید ایران «آماده تسلیم"}, {"source": "BBC Persian", "title": "روسیه دومین پل مهم کی‌یف را هم زد", "link": "https://www.bbc.com/persian/articles/cm5yndqvpzn8o?at_medium=RSS&at_campaign=rss", "summary": "ویتالی کلیچکو، شهردار کی‌یف، اعلام کرد که در ادامه حملات روسیه به زیرساخت‌های حیاتی، دومین پل بزرگ پایتخت اوکراین نیز هدف حمله قرار گرفته است.", "date_str": "2026-10-03T10:06:33+00:00", "hash": "c83fd08808a38cd7", "title_fa": "روسیه دومین پل مهم کی‌یف را هم زد", "summary_fa": "ویتالی کلیچکو، شهردار کی‌یف، اعلام کرد که در ادامه حملات روسیه به زیرساخت‌های حیاتی، دومین پل بزرگ پایتخت اوکراین نیز هدف حمله قرار گرفته است. به گفته آقای کلیچکو، این حمله که صبح امروز، شنبه ۳ اکتبر، رخ داد، به جاده و کابل‌های فشار قوی اتوبوس‌های برقی در «پل شمالی» آسیب رساند و منجر به مسدود شدن مسیر شد. آقای کلیچکو در تلگرام نوشت: «اصابت به پل شمالی. نیروهای امدادی در حال اعزام هستند.» «تردد روی پل، در مسیر غرب به شرق، در حال حاضر مسدود است.» «پل جنوبی»، دیگر پل اصلی کی‌یف نیز پنجشنبه و جمعه (۱ و ۲ اکتبر) بارها هدف حملات پهپادی روسیه قرار گرفته بود. این حملات باعث شد شورای دفاعی کی‌یف دیروز جلسه اضطراری تشکیل دهد. آقای کلیچکو اظهار نگرانی کرده که این حملات باعث از «تکه‌پاره شدن کی‌یف» شود. شهردار کی‌یف همچنین هشدار داد که مسکو در حال کوبیدن «زیرساخت‌های حیاتی، لجستیک، مناطق مسکونی» و دیگر تأسیسات حیاتی است و وضعیت «بسیار وخیم» است. این دو پل بر رودخانه دنیپرو شرق و غرب پایتخت اوکراین را به هم وصل می‌کنند و هدف قرار گرفتنشان نشانه مرحله جدیدی در راهبرد روسیه است. حملات به پل جنوبی در روز پنجشنبه موجب اختلال شدید در رفت‌وآمد شد و عبور مترو و خودرو از روی این پل متوقف شده است. بسیاری از ساکنان این شهر حدودا سه میلیون نفری، برای جابه‌جایی به مترو وابسته‌اند. پس از حمله به «پل جنوبی»، مسافران مترو تعریف کردند که چگونه گرد و غبار ناشی از انفجار وارد سیستم تهویه واگن‌ها شد. ولودیمیر زلنسکی، رئیس‌جمهور اوکراین، گفت که ولادیمیر پوتین تصمیم گرفته است در حمله به اوکراین «دیگر هیچ قاعده‌ای وجود نداشته باشد.» او به روزنامه فایننشال تایمز گفت: «روس‌ها در اشغال اوکراین ناکام مانده‌اند بنابراین اکنون دست به حملات گسترده و کشتار جمعی می‌زنند.» «می‌خواهند پل‌های ما، مراکز داده‌ها، اینترنت، شبکه‌های تلفن"}, {"source": "BBC Persian", "title": "دو ایرانی متهم به طراحی حمله به یهودیان در منچستر، در دادگاه حاضر شدند", "link": "https://www.bbc.com/persian/articles/cr5yndpvv675o?at_medium=RSS&at_campaign=rss", "summary": "دو مرد ایرانی که به طراحی حمله به جامعه یهودیان در منچستر متهم شده‌اند، امروز در دادگاهی در لندن حاضر شدند. این اتهام دو روز پیش به سلام احمدیان، ۳۶ ساله، و رحمان صالحی، ۳۴ ساله، تفهیم شده بود.", "date_str": "2026-10-03T12:13:57+00:00", "hash": "f9d881861263fc79", "title_fa": "دو ایرانی متهم به طراحی حمله به یهودیان در منچستر، در دادگاه حاضر شدند", "summary_fa": "دو مرد ایرانی که به طراحی حمله به جامعه یهودیان در منچستر متهم شده‌اند، امروز در دادگاهی در لندن حاضر شدند. این اتهام دو روز پیش به سلام احمدیان، ۳۶ ساله، و رحمان صالحی، ۳۴ ساله، تفهیم شده بود. پلیس بریتانیا گفت این دو مرد «با یک فرد سوم در خارج از کشور که ممکن است ایران باشد، در تماس بودند.» بازداشت این دو نفر تقریبا یک سال پس از حمله مرگبار با چاقو و سلاح گرم به یک کنیسه در منچستر انجام شد که حاضران برای یوم کیپور، مقدس‌ترین روز در تقویم یهودی، گرد هم آمده بودند. پلیس متروپولیتن لندن اعلام کرد که این افراد مظنون‌اند دستورالعمل‌هایی برای ساخت بمب حاوی گاز کلر دریافت کرده، مایعات و دیگر مواد لازم برای ساخت یک بمب دست‌ساز را تهیه کرده و درباره اهداف احتمالی تحقیق و شناسایی میدانی انجام داده‌اند. گفته می‌شود که این دو مظنون در سال‌های ۲۰۲۰ و ۲۰۲۳ با قایق‌های کوچک وارد بریتانیا شده‌اند. یکی از آن‌ها پناهندگی دریافت کرده بود و پرونده درخواست پناهندگی فرد دیگر همچنان در جریان است. شبانه محمود، وزیر کشور بریتانیا، گفت:«وقایع اخیر یادآور جدی خطراتی است که کشور ما از سوی تروریست‌ها و همچنین بازیگران دولتی خارجی با آن مواجه است.» او افزود: «این خبر برای جوامع یهودی ما بسیار ناراحت‌کننده خواهد بود، چرا که درست پس از ایام روش هشانا (سال نو یهودی) و یوم کیپور منتشر می‌شود.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. خانم محمود همچنین گفت: «اظهار نظر بیشتر در مورد این پرونده مناسب نیست؛ اما می‌توانم بگویم که ما در تلاش‌هایمان برای محافظت از جوامع یهودی، ریشه‌کن کردن یهودستیزی در این کشور و حفظ امنیت مرزها، قاطع و بی‌وقفه عمل خواهیم کرد.» به گفته پلیس در چارچوب تحقیقات در این باره، عملیات بازرسی در"}, {"source": "BBC Persian", "title": "امارات حادثه هواپیمای فلای‌دبی را اقدام «تروریستی» خواند، کمک‌خلبان با «تبر» به خلبان حمله کرد", "link": "https://www.bbc.com/persian/articles/c6n8dleypy79o?at_medium=RSS&at_campaign=rss", "summary": "دادستان کل امارات متحده عربی گفت کمک‌خلبان پرواز شرکت فلای‌دبی قصد «اقدام تروریستی» داشته است. این نخستین بار است که مقامات اماراتی رسما این حادثه را «تروریستی» توصیف می‌کنند. به گزارش خبرگزاری رسمی امارات، حمد سیف شامسی گفت که کمک‌خلبان با تبر اضطراری به خلبان حمله کرد و سعی داشت کنترل هواپیما را به دست گیرد.", "date_str": "2026-10-03T09:50:48+00:00", "hash": "01b0c05aae767a46", "title_fa": "امارات حادثه هواپیمای فلای‌دبی را اقدام «تروریستی» خواند، کمک‌خلبان با «تبر» به خلبان حمله کرد", "summary_fa": "دادستان کل امارات متحده عربی گفت کمک‌خلبان پرواز شرکت فلای‌دبی قصد «اقدام تروریستی» داشته است. این نخستین بار است که مقامات اماراتی رسما این حادثه را «تروریستی» توصیف می‌کنند. به گزارش خبرگزاری رسمی امارات، حمد سیف شامسی گفت که کمک‌خلبان با تبر اضطراری به خلبان حمله کرد و سعی داشت کنترل هواپیما را به دست گیرد. تبر اضطراری برای شکستن در کابین خلبان در مواقع خطر مثل سقوط هواپیماست. به گفته دادستان کل امارات، تحقیقات برای مشخص شدن جزئیات حادثه، انگیزه‌ و ارتباطات احتمالی و بررسی شواهد در جریان است. کمک‌خلبان در امارات متحده بازداشت است. چندین رسانه او را همام الحمامی، تبعه عمان، معرفی کردند و گفتند که به دلیل نگرانی درباره دیدگاه‌های افراطی‌اش، از پرواز در عمان منع شده بود. مقام‌های اماراتی تاکنون به درخواست‌ها برای تأیید رسمی هویت او پاسخی نداده‌اند. انور قرقاش، مشاور ارشد رئیس دولت امارات متحده عربی، پیشتر حمله کمک‌خلبان را «اقدامی تروریستی» خوانده بود. رویترز به نقل از منبع مطلع گفت که مقام‌های اسرائیلی قرار است از این کمک‌خلبان بازجویی کنند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. او در عربستان بازداشت و پنجشنبه به امارات متحده عربی منتقل شد. هواپیمای خطوط هوایی امارات که از دوبی عازم تل‌آویو بود، چهارشنبه (۸مهر/۳۰ سپتامبر) حدود دو سا رمانه بودن محاکمه، تردید وجود دارد. از زمان اعتراضات گسترده در ۱۷ و ۱۸ دی ماه سال گذشته، قوه قضائیه ایران از اعدام چندین بازداشتی‌ خبر داده است. اعدام سیاوش جمشیدی‌خیرآبادی تازه‌ترین مورد از اجرای چنین حکمی درباره معترضان دی سال گذشته است. قوه قضائیه ایران هفته گذشته نیز از اعدام دو نفر از بازداشت‌شدگان اعتراضات دی‌ماه ۱۴۰۴ در مشهد خبر داده بود. از سرکوب خونین اعتراضات دی که به کشتار هزاران نفر منجر شد، به عنوان مرگبارترین مواجهه حکومت ایران با معترضان در تاریخ معاصر این کشور یاد شده است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. مسعود پزشکیان، رئیس‌جمهور ایران، در بخشی از سخنرانی اخیر خود در مجمع عمومی سازمان ملل، با اشاره‌ به اعتراضات دی‌ ۱۴۰۴،"}, {"source": "BBC Persian", "title": "آیا ایران کنترل تنگه هرمز را از دست داده است؟", "link": "https://www.bbc.com/persian/articles/cx3050z4d7zyo?at_medium=RSS&at_campaign=rss", "summary": "در هفته‌های اخیر، کشورهای عربی خلیج فارس توانسته‌اند با افزایش عبور نفتکش‌ها و استفاده بیشتر از مسیرهای جایگزین، صادرات نفت خود را به سطح پیش از جنگ بازگردانند، در حالی که ادامه محاصره دریایی آمریکا، صادرات ایران را نزدیک به صفر نگه داشته است.", "date_str": "2026-10-03T05:20:38+00:00", "hash": "a10bf8d1166db99b", "title_fa": "آیا ایران کنترل تنگه هرمز را از دست داده است؟", "summary_fa": "در هفته‌های اخیر، کشورهای عربی خلیج فارس توانسته‌اند با افزایش عبور نفتکش‌ها و استفاده بیشتر از مسیرهای جایگزین، صادرات نفت خود را به سطح پیش از جنگ بازگردانند، در حالی که ادامه محاصره دریایی آمریکا، صادرات ایران را نزدیک به صفر نگه داشته است. این تحول در شرایطی رخ می‌دهد که تهران از ابتدای جنگ اخیر تلاش کرده بود از تهدید کشتیرانی در تنگه هرمز به عنوان یکی از اصلی‌ترین اهرم‌های خود استفاده و با ایجاد اختلال در این آبراه راهبردی، توان چانه‌زنی ‌اش را در مقابل آمریکا افزایش دهد. در شرایط جدید، افزایش صادرات کشورهای همسایه، با تهدید مقام‌های ایرانی مبنی بر اینکه توقف صادرات نفت خام ایران مانع صادرات دیگران هم خواهد شد، فاصله دارد. آیا تهران قدرت اعمال این تهدید را از دست داده و ایالات متحده توانسته کنترل رفت‌وآمد در هرمز را به دست بگیرد یا ماجرا پیچیدگی‌های بیشتری دارد؟ بر اساس گزارش موسسه ردیابی کپلر، از اول تا ۲۸ سپتامبر روزانه دست‌کم ۱۶٫۵ میلیون بشکه نفت خام و میعانات از منطقه صادر شده که با میانگین پیش از جنگ، بدون احتساب نفت ایران، برابر است. حدود ۹٫۹ میلیون بشکه، معادل ۶۰ درصد این حجم، از هرمز عبور کرده؛ ۲۳ درصد در ساحل دریای عمان و عمدتا فجیره بارگیری شده و ۱۷ درصد از مسیر دریای سرخ خارج شده است. به گفته کپلر، حدود ۴۰ درصد کل نفت صادرشده از منطقه در سپتامبر از تنگه عبور نکرد و از طریق خطوط لوله زمینی به بنادر دریای سرخ یا خلیج عمان رسید؛ این رقم پیش از جنگ ۱۷ درصد بود. موسسه کپلر برآورد کرده که عبور نفت ایران در ماه سپتامبر از هرمز پس از بازگشت محاصره در ماه ژوئیه نزدیک به صفر مانده است. ایران پیش از جنگ روزانه حدود ۱٫۷ میلیون بشکه صادر می‌کرد و با احتساب سهم آن، صادرات منطقه در سپتامبر به حدود"}, {"source": "BBC Persian", "title": "چرا اعتراضات مدارس، دولت فرانسه را به هراس انداخته است؟", "link": "https://www.bbc.com/persian/articles/cm4g1ex94164o?at_medium=RSS&at_campaign=rss", "summary": "همه رهبران فرانسه به‌خوبی می‌دانند که باید یک اصل را جدی بگیرند: حضور جوانان معترض در خیابان به معنای دردسر است.", "date_str": "2026-10-02T20:53:17+00:00", "hash": "33a2218f965082c5", "title_fa": "چرا اعتراضات مدارس، دولت فرانسه را به هراس انداخته است؟", "summary_fa": "همه رهبران فرانسه به‌خوبی می‌دانند که باید یک اصل را جدی بگیرند: حضور جوانان معترض در خیابان به معنای دردسر است. از زمان اعتراضات دانشجویی مه ۱۹۶۸، که شارل دوگل آن‌ها را با واژه معروف شینلی، به معنای «هرج‌ومرج»، توصیف کرد، دولت‌های فرانسه همواره از رویارویی با جوانان خشمگین واهمه داشته‌اند. چرا؟ چون جنبش‌های جوانان پیش‌بینی‌ناپذیر و فاقد ساختار مشخص هستند و اغلب تشکیلات روشنی ندارند که بتوان با آن مذاکره کرد. چون وقتی آن‌ها اعتراض می‌کنند، گروه‌های دیگر نیز به اعتراضات می‌پیوندند. دلیل دیگر این است که به سبب جوان بودن معترضان، افکار عمومی معمولا با آن‌ها همدلی می‌کند. همچنین اگر پلیس مرتکب اشتباهی شود و باعث جراحت یا اتفاقی بدتر شود، پیامدهای آن غیرقابل محاسبه خواهد بود. از سوی دیگر، تنها چند ماه تا انتخابات ریاست‌جمهوری باقی مانده است. به همه این دلایل، هرگاه «جوانان خشمگین» به خیابان‌ها می‌آیند، دولت‌ها با احتیاطی فوق‌العاده عمل می‌کنند. اکنون نوجوانان فرانسوی در صف مقدم اعتراضات قرار دارند و هرچند خشمگین به نظر نمی‌رسند و حال‌وهوای حاکم بیشتر هیجان‌زده است تا عصبانیت، بی‌تردید دولت امانوئل مکرون را دچار وضعیتی کرده‌اند که روزنامه «لوموند» روز جمعه آن را «عرق سرد» توصیف کرد. جنبشی که نزدیک به دو هفته پیش در منطقه کم‌ درآمد سن‌سن‌دنی در شمال پاریس آغاز شد، در چند روز گذشته به سراسر کشور گسترش یافته است. روز پنجشنبه، که تاکنون اوج اعتراضات بوده، صدها دبیرستان، محل تحصیل دانش‌آموزان ۱۵ تا ۱۸ ساله در سال‌های پایانی تحصیل، در محاصره معترضان قرار گرفتند. روز جمعه وضعیت بهتر شد، اما حدود ۴۰۰ دبیرستان برای محافظت از کارکنان و دانش‌آموزان تعطیل شدند. دانشگاه‌ها نیز به‌تدریج به این جنبش می‌پیوندند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید."}, {"source": "BBC Persian", "title": "بوسه بر خاک ایران؛ واکنش‌های متفاوت به بازگشت هنرمندان به ایران", "link": "https://www.bbc.com/persian/articles/cmkgew02l009o?at_medium=RSS&at_campaign=rss", "summary": "ورود بیژن مرتضوی، خواننده و نوازنده ویولون به ایران بار دیگر بحث بازگشت هنرمندان به کشور را باز کرده و واکنش‌های متفاوتی را برانگیخته است.", "date_str": "2026-10-02T16:13:56+00:00", "hash": "f8a48c0c2c92d475", "title_fa": "بوسه بر خاک ایران؛ واکنش‌های متفاوت به بازگشت هنرمندان به ایران", "summary_fa": "ورود بیژن مرتضوی، خواننده و نوازنده ویولون به ایران بار دیگر بحث بازگشت هنرمندان به کشور را باز کرده و واکنش‌های متفاوتی را برانگیخته است. آقای مرتضوی دو روز پیش از انتشار تصاویر ورودش به تهران، خبر بازگشت خود را تکذیب کرده بود. او سپس روز هشتم مهر ویدیویی در حال پایین آمدن از پله‌های هواپیما و بوسیدن زمین ایران منتشر کرد. بیژن مرتضوی اولین هنرمندی نیست که بازگشتش به تهران پس از جنگ اسرائیل و آمریکا با ایران خبرساز می‌شود. پیش از او هم قیصر و محسن نامجو به ایران بازگشتند. برخی از کاربران به مواضع این دو هنرمند که هردو مخالفت خود را با جنگ اعلام کرده بودند، اشاره کرده و پرسیده‌اند که آیا مواضع آن‌ها در سهولت بازگشتشان به کشور موثر بوده است یا نه. اما برخی از کاربران طرفدار حکومت، مخالفت با جنگ را برای بازگشت به کشور کافی ندانسته‌ و خواستار «محاکمه و مجازات» آن‌ها شده‌اند. صداوسیما هم با بازتاب صدای این دسته از کاربران، در گزارشی گفته که شماری از هنرمندانی که به ایران بازگشته‌اند، مواضع مخالف جمهوری اسلامی داشتند و «باید محاکمه شوند.» در این گزارش از فاطمه معتمد آریا، بازیگر و اصغر فرهادی، فیلمساز و کارگردان هم نام برده شده است. این دو نفر پیش‌تر از اعتراضات ایران حمایت کرده بودند. روزنامه کیهان هم در شماره ۷ مهر خود با اعتراض به بازگشت عده‌ای که آن‌ها را «وطن‌فروش» خوانده بود، از رسانه‌های داخلی برای «ایجاد حاشیه امن» برای آن‌ها انتقاد کرد. این روزنامه نوشته است: «حالا که سختی زندگی در غربت و بن‌بست مالی، آنها را دوباره به مقصد وطن کشانده، روزنامه‌های زنجیره‌ای می‌کوشند از یک &#x27;پرونده قضائی و سوابق ساختارشکنانه&#x27;، یک &#x27;مظلومیت هنری&#x27; بسازند. دستگاه قضا باید هوشیار باشد؛ جامعه امروز بیش از هر زمان دیگری نیازمند تحقق بدون تبعیض &#x27;حاکمیت قانون&#x27; است. اگر پرونده‌های اتهامی و ادعاهای مطرح‌شده درباره‌ مواضع"}, {"source": "BBC Persian", "title": "هشدار سازمان ملل درباره تشدید بحران غذا در یمن همزمان با بالاگرفتن درگیری‌ها", "link": "https://www.bbc.com/persian/articles/cv8ezrk4lnyno?at_medium=RSS&at_campaign=rss", "summary": "برنامه جهانی غذا، وابسته به سازمان ملل متحد، روز جمعه اعلام کرد که گرسنگی در یمن رو به افزایش است و با تشدید درگیری‌ها، شمار بی‌سابقه‌ای از مردم دیگر قادر به تأمین نیازهای غذایی خود نیستند.", "date_str": "2026-10-02T15:20:59+00:00", "hash": "e1fb56f9a5ecf194", "title_fa": "هشدار سازمان ملل درباره تشدید بحران غذا در یمن همزمان با بالاگرفتن درگیری‌ها", "summary_fa": "برنامه جهانی غذا، وابسته به سازمان ملل متحد، روز جمعه اعلام کرد که گرسنگی در یمن رو به افزایش است و با تشدید درگیری‌ها، شمار بی‌سابقه‌ای از مردم دیگر قادر به تأمین نیازهای غذایی خود نیستند. این درگیری‌ها جدی‌ترین تنش میان حوثی‌های یمن و عربستان سعودی از زمان آتش‌بس سال ۲۰۲۲ به شمار می‌رود. متیو هولینگ‌ورث، معاون اجرایی برنامه جهانی غذا، می‌گوید که ظرف چند هفته شمار بی‌سابقه‌ای از مردم در مناطق تحت کنترل دولت توان تأمین نیازهای غذایی خود را از دست خواهند داد. به گفته او، به طور متوسط در هر خانواده چهار نفره، سه نفر ناچارند برخی وعده‌های غذایی خود را حذف کنند. سازمان ملل می‌گوید که تشدید درگیری‌ها در ماه‌های اخیر حدود ۱۵۰ هزار نفر را آواره کرده است. جمعیت مناطق تحت کنترل دولت یمن حدود ۱۰ میلیون نفر برآورد می‌شود. همزمان، درگیری‌های شدید در جنوب‌غرب یمن میان حوثی‌ها و نیروهای دولت مورد حمایت عربستان همچنان ادامه دارد و برآورد می‌شود در شبانه‌روز گذشته حدود ۸۰ نفر از نیروهای دو طرف کشته شده باشند. درگیری‌ها در اطراف شهر راهبردی تعز شدت گرفته و به بخش‌هایی از ارتفاعات مشرف به مناطق ساحلی دریای سرخ نیز کشیده شده است؛ مناطقی که حوثی‌های مورد حمایت ایران اخیراً کنترل آنها را به دست گرفته‌اند. تعز، سومین شهر بزرگ یمن و پایتخت فرهنگی آن کشور، نزدیک به یک میلیون نفر جمعیت دارد و در نقطه‌ای راهبردی میان مناطق تحت کنترل حوثی‌ها در شمال و مناطق تحت کنترل دولت در جنوب قرار گرفته است. این شهر از چند جهت با خطوط مقدم نبرد احاطه شده است. نیروهای دولتی مرکز تعز را در اختیار دارند و مواضع حوثی‌ها در شمال و شرق شهر قرار دارد. حوثی‌ها پس از بیرون راندن دولت از صنعا در سال ۲۰۱۵ تلاش کردند تعز را نیز تصرف کنند، اما نیروهای محلی آنها را از بیشتر بخش‌های شهر عقب"}, {"source": "BBC Persian", "title": "پرونده کرنل؛ چرا گزارش تعرض جنسی در دانشگاه‌های آمریکا این‌قدر دشوار است؟", "link": "https://www.bbc.com/persian/articles/c6y4z4j84nkgo?at_medium=RSS&at_campaign=rss", "summary": "پس از آنکه یک دانشجوی سابق دانشگاه کرنل شکایتی مدنی درباره تجاوز گروهی در یک انجمن برادری دانشجویی مطرح کرد، بار دیگر پرسش‌هایی درباره کارآمدی سازوکارهای رسیدگی به تعرض جنسی در دانشگاه‌های آمریکا مطرح شده است. وکلا و فعالان حقوق قربانیان می‌گویند بسیاری از دانشجویان در میان روندهای پیچیده دانشگاهی و قضایی، برای دستیابی به عدالت با سردرگمی و فرسودگی روبه‌رو می‌شوند.", "date_str": "2026-10-03T00:35:49+00:00", "hash": "400a60c0fab5786f", "title_fa": "پرونده کرنل؛ چرا گزارش تعرض جنسی در دانشگاه‌های آمریک iofarda.com/a/uae-flydubai-terror-attack-new-details/33869694.html", "summary": "دادستان امارات اعلام کرد تحقیقات درباره حادثه پرواز فلای‌دبی به اسرائیل نشان می‌دهد کمک‌خلبان با تبر اضطراری قصد انجام «اقدام تروریستی» و در دست گرفتن کنترل هواپیما را داشته است.", "date_str": "2026-10-03T12:26:52+00:00", "hash": "f15eaef312ccd942", "title_fa": "جزئیات تازه از حادثه پرواز فلای‌دبی؛ امارات این رویداد را «اقدام تروریستی» اعلام کرد", "summary_fa": "دادستان امارات اعلام کرد تحقیقات درباره حادثه پرواز فلای‌دبی به اسرائیل نشان می‌دهد کمک‌خلبان با تبر اضطراری قصد انجام «اقدام تروریستی» و در دست گرفتن کنترل هواپیما را داشته است. دادستان کل امارات متحده عربی اعلام کرد تحقیقات دربارهٔ حادثهٔ پرواز فلای‌دبی به مقصد اسرائیل نشان می‌دهد کمک‌خلبان با استفاده از یک تبر اضطراری قصد انجام «اقدام تروریستی» و در دست گرفتن کنترل هواپیما را داشته است. حمد سیف الشامسی روز شنبه ۱۱ مهر گفت کمک‌خلبان پرواز «اجرای طرح خود را در جریان پرواز آغاز کرد» و با «تبر اضطراری داخل کابین خلبان» به خلبان اصلی حمله و تلاش کرد کنترل‌های هواپیما را در اختیار بگیرد. این نخستین بار است که مقام‌های اماراتی به‌طور رسمی حادثهٔ روز چهارشنبه در این پرواز دبی به تل‌آویو را «اقدام تروریستی» توصیف می‌کنند. امارات پیشتر گفته بود تحقیقات در حال بررسی احتمال ارتباط حادثه با «فعالیت یا هدف تروریستی» است. دادستان کل امارات گفت تحقیقات برای مشخص شدن همهٔ ابعاد حادثه، انگیزهٔ مهاجم و «ارتباطات مرتبط» با او ادامه دارد و شواهد فیزیکی و دیجیتال نیز در حال بررسی است. به‌گفتهٔ او، نتایج نهایی پس از تکمیل مراحل تحقیقات اعلام خواهد شد. این در حالی است که دونالد ترامپ، رئیس‌جمهور آمریکا، روز پنج‌شنبه در پاسخ به پرسشی دربارهٔ احتمال دست داشتن ایران در این حادثه گفته بود بر اساس آن‌چه شنیده، پاسخ «مثبت» است، اما افزوده بود که موضوع همچنان در حال بررسی است. او همچنین هشدار داده بود اگر نقش ایران در این حادثه ثابت شود، جمهوری اسلامی «به‌شدت هدف قرار خواهد گرفت». آقای ترامپ توضیحی دربارهٔ مبنای این ادعا ارائه نکرد. مقام‌های اسرائیلی نیز پیشتر گفته بودند برای نتیجه‌گیری دربارهٔ ارتباط احتمالی ایران با حادثه زود است و ارزیابی اولیهٔ مقام‌ها       tech: [{"source": "MIT AI", "title": "Computational tools for society’s most complex challenges", "link": "https://news.mit.edu/2026/computational-tools-for-societys-most-complex-challenges-cathy-wu-1002", "summary": "As far back as she can remember, Cathy Wu ’12, MNG ’13 wanted to find ways to solve problems to improve people’s lives. Her parents were Taiwanese immigrants, and her father had a long commute to his job, which took him away from the family. On a tight budget, the rest of the family often stayed home on a street that was too busy for playing outdoors. Wu and her siblings ended up playing a lot of computer games. Wu says her desire to make the world a better place, her dad’s daily battle against traffic, and the games she played, like “SimCity,” were the seeds of her motivation to design safe, efficient transportation systems. Wu is an associate professor in the MIT Department of Civil and Environmental Engineering (CEE) and the Institute for Data, Systems, and Society (IDSS), and a principal investigator in the Laboratory for Information and Decision Systems. Her research focuses on using machine learning and reinforcement learning (RL) to advance reliable strategies for improving a range of complex systems, including transportation. “Designing transportation systems consists of modeling and analyzing dozens, if not hundreds or thousands, of variants, which means that an evidence-driven approach to designing those systems is simply not within reach of today’s tools,” Wu says. “This is the role that RL plays. If successful, it would free transportation researchers and enable their practitioner partners to design the systems they want.” Wu credits her older sister with instilling in her the desire to improve people’s lives, and Wu’s interest in transportation fits neatly into that ideal. “I like transportation because it connects everyone. We all use it, we all experience it, we all have issues with it. So, at some level, we’re all interested in the system being better,” she says. Wu got interested in applying artificial intelligence to transportation while earning her undergraduate degree at MIT, after attending a lecture on autonomous vehicles by the late professor Seth Teller. The lecture, which Teller gave during an Independent Activities Period robotics competition (that Wu actually won), was the event that honed her particular approach to transportation research, Wu says. She began working with Teller, and when he stopped concentrating on autonomous vehicles, he encouraged Wu to transfer to Professor Daniela Rus, who had done research on robotaxis. “I’m very grateful to the people who helped me explore those interests and helped me become the person I ", "date_str": "2026-10-02T19:30:00+00:00", "hash": "e1d8545fd803f173", "title_fa": "ابزارهای محاسباتی برای پیچیده ترین چالش های جامعه", "summary_fa": "تا جایی که به یاد دارد، کتی وو '12، MNG '13 می خواست راه هایی برای حل مشکلات برای بهبود زندگی مردم بیابد. پدر و مادرش مهاجران تایوانی بودند و پدرش برای کارش رفت و آمد طولانی داشت که باعث دور شدن او از خانواده شد. با بودجه کم، بقیه اعضای خانواده اغلب در خیابانی که برای بازی در فضای باز شلوغ بود، در خانه می ماندند. وو و خواهر و برادرش در نهایت به بازی های رایانه ای زیادی دست یافتند. وو می‌گوید که تمایل او برای تبدیل جهان به مکانی بهتر، مبارزه روزانه پدرش با ترافیک، و بازی‌هایی که او انجام می‌دهد، مانند «SimCity»، دانه‌های انگیزه او برای طراحی سیستم‌های حمل‌ونقل ایمن و کارآمد بوده است. وو دانشیار دپارتمان مهندسی عمران و محیط زیست MIT (CEE) و موسسه داده‌ها، سیستم‌ها و جامعه (IDSS) و محقق اصلی در آزمایشگاه اطلاعات و سیستم‌های تصمیم‌گیری است. تحقیقات او بر استفاده از یادگیری ماشینی و یادگیری تقویتی (RL) برای پیشبرد استراتژی های قابل اعتماد برای بهبود طیف وسیعی از سیستم های پیچیده، از جمله حمل و نقل متمرکز است. وو می‌گوید: «طراحی سیستم‌های حمل‌ونقل شامل مدل‌سازی و تجزیه و تحلیل ده‌ها، اگر نه صدها یا هزاران نوع، می‌شود، به این معنی که رویکرد مبتنی بر شواهد برای طراحی آن سیستم‌ها به سادگی در دسترس ابزارهای امروزی نیست. این نقشی است که RL ایفا می کند. در صورت موفقیت، محققین حمل و نقل آزاد خواهند شد و شرکای متخصص خود قادر خواهند بود تا سیستم های مورد نظر خود را طراحی کنند.\" وو به خواهر بزرگترش اعتماد می کند که میل به بهبود زندگی مردم را در او القا کرده است، و علاقه وو به حمل و نقل کاملاً در این ایده آل است. من حمل و نقل را دوست دارم زیرا همه را به هم متصل می کند. همه ما از آن"}, {"source": "MIT AI", "title": "Documenting the tech worker movement", "link": "https://news.mit.edu/2026/documenting-tech-worker-movement-0918", "summary": "Despite the “dot-com crash” in 2000, the tech industry remained an attractive career destination for many who believed technology represented the future. The digital age — defined by global connectivity and computers — had firmly taken hold, and over time, the tech industry emerged as a dominant force in the labor market. High-paying jobs for engineers, designers, and professionals across a wide range of fields became increasingly common. MIT PhD student JS Tan SM ’22 was among those who, upon graduating from Brown University and Rhode Island School of Design in 2015, joined the tech industry. “A lot of us had this idea that technology, and in particular the technologies related to the internet, had the potential for bringing about a more progressive version of the world,” Tan says. Google echoed this ethos to its employees with its once-famous motto, “don’t be evil,” as their informal corporate philosophy and code of conduct guideline. They’ve since dropped the tagline. But in time, particularly with the start of the first Trump administration, some tech industry employees found themselves questioning if their employers were really intent on supporting policies to support a more democratic world. According to Tan, their willingness to publicly oppose their employers’ actions — at first successfully — is currently experiencing an anti-worker backlash. Now, Tan and his former tech industry colleague Clarissa Redwine have published a book on the rise and fall of the tech worker labor movement. “Against Tech Oligarchy: Worker Resistance in the World’s Most Powerful Industry” (Haymarket Books, 2026) chronicles how tech workers organized themselves, the effective strategies they used, and the effect the movement had on Silicon Valley labor politics over the past decade. Documenting a movement from within In 2017, Tan was working for Microsoft and Redwine for Kickstarter, when President Donald Trump signed an executive order suspending entry into the United States for nationals from seven predominantly Muslim countries for 90 days, and suspending Syrian refugees from entering the country indefinitely. “As a whole, I think the tech sector really pushed back against this,” says Tan. “[OpenAI co-founder] Sam Altman participated in protests of this ban at the airport. In fact, the day before he joined these protests, he wrote in his blog that the tech industry needed to take a stand against the Trump administration, and particularly its immigration policies.” Altman", "date_str": "2026-10-02T17:00:00+00:00", "hash": "7c777ff4a3e44e27", "title_fa": "مستندسازی جنبش کارگران فناوری", "summary_fa": "علیرغم سقوط دات کام در سال 2000، صنعت فناوری یک مقصد شغلی جذاب برای بسیاری از کسانی بود که معتقد بودند فناوری نشان دهنده آینده است. عصر دیجیتال - که توسط اتصالات جهانی و کامپیوترها تعریف می‌شود - به‌شدت تسخیر شده بود و با گذشت زمان، صنعت فناوری به عنوان یک نیروی مسلط در بازار کار ظاهر شد. مشاغل پردرآمد برای مهندسان، طراحان و متخصصان در طیف وسیعی از زمینه ها به طور فزاینده ای رایج شدند. دانشجوی دکترای MIT JS Tan SM '22 از جمله کسانی بود که پس از فارغ التحصیلی از دانشگاه براون و دانشکده طراحی رود آیلند در سال 2015، به صنعت فناوری پیوست. تان می‌گوید: «بسیاری از ما این ایده را داشتیم که فناوری، و به‌ویژه فناوری‌های مرتبط با اینترنت، پتانسیل ایجاد نسخه پیشرفته‌تری از جهان را دارند. گوگل با شعار روزگاری معروف خود، «شرور نباش»، این رفتار را به عنوان فلسفه شرکتی غیررسمی و دستورالعمل آیین نامه رفتارشان به کارمندان خود بازتاب داد. آنها از آن زمان شعار را حذف کردند. اما با گذشت زمان، به ویژه با شروع اولین دولت ترامپ، برخی از کارمندان صنعت فناوری متوجه شدند که آیا کارفرمایان آنها واقعاً قصد حمایت از سیاست‌های حمایت از جهانی دموکراتیک‌تر را دارند یا خیر. به گفته تان، تمایل آنها برای مخالفت علنی با اقدامات کارفرمایانشان - در ابتدا با موفقیت - در حال حاضر با واکنش ضد کارگری مواجه شده است. اکنون، تان و همکار سابقش در صنعت فناوری، کلاریسا ردواین، کتابی درباره ظهور و سقوط جنبش کارگری کارگران فناوری منتشر کرده‌اند. «علیه الیگارشی فناوری: مقاومت کارگری در قدرتمندترین صنعت جهان» (Haymarket Books، 2026) چگونگی سازماندهی کارگران فناوری، استراتژی‌های مؤثری که آنها استفاده کردند و تأثیر جنبش بر سیاست‌های کارگری دره سیلیکون در دهه گذشته را شرح می‌دهد."}, {"source": "TechCrunch AI", "title": "All the AI agents that can live in your text messages", "link": "https://techcrunch.com/2026/10/03/all-the-ai-agents-that-can-live-in-your-text-messages/", "summary": "We created a list of the most notable AI agents that can live in your text messages, from general assistants to agents designed for families, travel, and work.", "date_str": "2026-10-03T14:00:00+00:00", "hash": "617e0ae720482e43", "title_fa": "همه عوامل هوش مصنوعی که می توانند در پیام های متنی شما زندگی کنند", "summary_fa": "ما فهرستی از برجسته‌ترین عوامل هوش مصنوعی را ایجاد کردیم که می‌توانند در پیام‌های متنی شما زندگی کنند، از دستیاران عمومی گرفته تا نمایندگانی که برای خانواده، سفر و کار طراحی شده‌اند. به جای دانلود یک برنامه دیگر، تعداد فزاینده ای از نمایندگان می توانند به سادگی مانند یک فرد معمولی پیامک ارسال کنند. آنچه را که نیاز دارید برای آن پیامک می‌دهید، و می‌تواند زمینه را به خاطر بسپارد، به برنامه‌ها و سرویس‌هایی که قبلاً استفاده می‌کنید متصل شود و کارها را از طرف شما انجام دهد. این می تواند به معنای برنامه ریزی یک قرار، سازماندهی یک تقویم، تحقیق در مورد سفر، ارسال ایمیل، رزرو، خرید آنلاین یا یادآوری چیزی باشد که روزها بعد به شما می پردازد. در حالی که Instinct یکی از پر جنب و جوش ترین عوامل هوش مصنوعی در حال حاضر است، به لطف ارزش گذاری 10 میلیارد دلاری آن پس از آخرین دور بودجه 1 میلیارد دلاری، بسیاری دیگر نیز برای این فضا بازی می کنند. در زیر برخی از قابل‌توجه‌ترین گزینه‌ها تا کنون، از دستیاران شخصی همه منظوره گرفته تا نمایندگانی که برای خانواده، سفر و کار طراحی شده‌اند، آورده شده است. Caddy یک دستیار هوش مصنوعی است که اطلاعات پراکنده شده در تلفن شما را به چیزهایی تبدیل می کند که واقعاً می توانید روی آنها عمل کنید. این برنامه در iMessage برای کاربران آیفون و RCS برای کاربران Android زندگی می‌کند، بنابراین هیچ برنامه یا صندوق ورودی جداگانه‌ای برای بررسی مداوم وجود ندارد. به عنوان مثال، یک ایمیل حاوی قرار ملاقاتی است که باید به تقویم شما اضافه شود یا یکی از دوستان فهرستی از چیزهایی را که باید انتخاب کنید ارسال می کند. به جای نگرانی در مورد دفن شدن همه جزئیات، Caddy به تقویم ها و مکالمات شما متصل می شود، سپس مواردی را که ممکن است نیاز"}, {"source": "TechCrunch AI", "title": "Meta wants your next gadget to be Muse-infused", "link": "https://techcrunch.com/2026/10/02/meta-wants-you-to-build-your-own-muse-gadget/", "summary": "Meta wants Muse in your TV and your toaster, so it's giving the code away for free.", "date_str": "2026-10-03T00:45:39+00:00", "hash": "c248df2d7d103a5b", "title_fa": "متا می‌خواهد ابزار بعدی شما از Muse ساخته شود", "summary_fa": "متا Muse را در تلویزیون و توستر شما می خواهد، بنابراین کد را به صورت رایگان در اختیار شما قرار می دهد. Meta s Muse، یک عامل هوش مصنوعی شخصی که سفرها را کتاب می‌کند، فرم‌ها را پر می‌کند و از طرف کاربر خرید می‌کند، قبلاً در بین توده‌ها محبوبیت پیدا کرده است، اما یک پروژه جانبی جدید می‌تواند به‌ویژه برای هکرها و هکرها جذاب باشد. روز جمعه، این شرکت Muse Gadgets را معرفی کرد، پروژه ای متن باز که به توسعه دهندگان اجازه می دهد سخت افزار خود را بسازند که به Muse متصل می شود. متا سفت‌افزار متن‌باز (نرم‌افزار سطح پایینی که دستگاه را اجرا می‌کند) و کیت توسعه نرم‌افزار لینوکس (SDK) به همراه چند ایده پروژه برای شروع به کار کاربران ارائه می‌کند. اینها شامل دادن نمایشگر رنگی جوهر الکترونیکی به Muse یا بارگذاری آن بر روی چوبی است که به پورت HDMI تلویزیون وصل می شود. به نظر نمی رسد محدود ن و سرمایه‌گذاران مشترک موافقت کردند تا 600 میلیون دلار در سهام اولیه در شرکت زیرساخت هوش مصنوعی هندی Neysa سرمایه‌گذاری کنند، که قصد داشت 600 میلیون دلار بیشتر از طریق بدهی تامین کند. سرمایه بیش از زیرساخت ها در حال جریان است. در ماه جولای، Anthropic Ode with Anthropic را راه‌اندازی کرد، یک شرکت پیاده‌سازی هوش مصنوعی که از طریق سرمایه‌گذاری مشترک ۱.۵ میلیارد دلاری با Blackstone، Hellman Friedman، Goldman Sachs و دیگران پشتیبانی می‌شود. این سرمایه‌گذاری‌ها Blackstone را به برخی"}, {"source": "TechCrunch AI", "title": "Circuit Breaker Labs hopes to make AI safer for your kids (and you)", "link": "https://techcrunch.com/2026/10/02/circuit-breaker-labs-hopes-to-make-ai-safer-for-your-kids-and-you/", "summary": "With all the talk about how AI might one day kill us all, it's easy to forget that AI has already harmed some people psychologically. Circuit Breaker Labs has created \"crash-test dummies\" to solve that.", "date_str": "2026-10-02T17:00:00+00:00", "hash": "52ef56baa6fa7034", "title_fa": "Circuit Breaker Labs امیدوار است که هوش مصنوعی را برای فرزندان شما (و شما) ایمن تر کند.", "summary_fa": "با تمام صحبت هایی که در مورد اینکه چگونه هوش مصنوعی ممکن است روزی همه ما را بکشد، به راحتی می توان فراموش کرد که هوش مصنوعی قبلاً به برخی افراد از نظر روانی آسیب رسانده است. Circuit Breaker Labs برای حل این مشکل \"دوم های تست تصادف\" ایجاد کرده است. برای مثال، Character.AI اوایل سال جاری چندین پرونده مرگ نادرست را که توسط خانواده‌های کاربران زیر سن قانونی که پس از تعامل با ربات‌هایش بر اثر خودکشی جان خود را از دست داده بودند، حل و فصل کرد. چندین خانواده همچنین از OpenAI به دلیل نقش ادعایی ChatGPT در خودکشی و توهمات عزیزانشان شکایت کرده اند. ایمن‌تر کردن هوش مصنوعی در بین زبان‌ها و فرهنگ‌ها، ماموریت Circuit Breaker Labs، یکی از فینالیست‌های TechCrunch 2026 Startup Battlefield 200 است. (Circuit Breaker در TechCrunch Disrupt شرکت خواهد کرد که امسال در Moscone West در سانفرانسیسکو از 13 تا 15 اکتبر برگزار می شود.) بنیانگذاران Shirali و Arul Nigam که خواهر و برادر هستند، توسط Sewell Setzer، پسر 14 ساله ای که قبل از اینکه خودش یک ربات را به آن وابستگی عاطفی ایجاد کرده بود، انگیزه داشته باشد. مرگ بر اثر خودکشی ربات چت، که والدین در شکایتی در سال 2024 ادعا کردند، او را تشویق کرد. آرول، که CTO Circuit Breaker Labs است، گفت: ممکن است ربات متوجه نشده باشد که واقعاً چه کلماتی مانند من می خواهم با شما باشم. بسیاری از مردم، به ویژه جوانان، برای پشتیبانی به این سیستم ها مراجعه می کنند و معمولاً واقعاً کمک مورد نیاز خود را دریافت نمی کنند. آرول گفت، اما در بسیاری از موارد، آنها به طور فعال آسیب می بینند و متأسفانه مردم جان خود را از دست داده اند. آن دسته از آسیب‌پذیری‌های ایمنی، که در آن افراد لزوماً به طور فعال در تلاش برای شکستن سیستم نیستند"}, {"source": "TechCrunch AI", "title": "Pope Leo XIV is not a fan of AI-generated art", "link": "https://techcrunch.com/2026/10/02/pope-leo-xiv-is-not-a-fan-of-ai-generated-art/", "summary": "\"There is an ontological difference, even before an aesthetic one, between art and what a machine can generate through statistical calculation based on millions of images created by others,\" the pope wrote. \"Algorithms lack the spark of humanity.\"", "date_str": "2026-10-02T15:39:41+00:00", "hash": "b971f4e6700786f8", "title_fa": "پاپ لئو چهاردهم از طرفداران هنر تولید شده توسط هوش مصنوعی نیست", "summary_fa": "پاپ نوشت: «حتی قبل از زیبایی‌شناختی، تفاوت هستی‌شناختی بین هنر و آنچه که یک ماشین می‌تواند از طریق محاسبه آماری بر اساس میلیون‌ها تصویر خلق‌شده توسط دیگران ایجاد کند، وجود دارد. \"الگوریتم ها فاقد جرقه انسانیت هستند.\" منتقدان هنر تولید شده توسط هوش مصنوعی متحد قدرتمند جدیدی دارند: اعلیحضرت اسقف رم (Episcopus Romanus)، نخست وزیر ایتالیا (Primatus Italiae) و پاپ عالی کلیسای جهانی (Summus Pontifex Ecclesiae Universalis). در پستی در صبح جمعه X، پاپ لئو چهاردهم تفاوت معنوی بین هنر تولید شده توسط انسان و هنری که توسط ماشین‌ها تولید می‌شود را به عنوان بخشی از فراخوان برای حفظ هنر انسانی در برابر تجاوزات هوش مصنوعی توضیح داد. Servus Servorum Dei نوشت: در این عصر هوش مصنوعی، تشخیص هنر انسانی از آنچه ماشین‌ها تولید می‌کنند ضروری است. حتی قبل از زیبایی‌شناختی، تفاوت هستی‌شناختی بین هنر و آنچه که یک ماشین می‌تواند از طریق محاسبه آماری بر اساس میلیون‌ها تصویر ایجاد شده توسط دیگران ایجاد کند، وجود دارد. الگوریتم ها فاقد جرقه انسانیت هستند. پاپ لئو چهاردهم بیانیه مفصل تری درباره هوش مصنوعی در نامه ای در ماه مه ارائه کرد که بر اهمیت کرامت انسانی در دنیای اتوماسیون فزاینده تاکید کرد. اما این امر شرکت‌های هوش مصنوعی را از لابی کردن پاپ عالی بازنداشت. بر اساس گزارش اخیر نیویورک تایمز، آنتروپیک فعالانه با واتیکان لابی کرده است تا در موضع خود در مورد آگاهی غیرانسانی تجدید نظر کند - ظاهراً موفقیت کمی پیدا کرده است. 50% تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس خود را بگیرید و یک همکار، شریک یا همتای خود را با 50 درصد تخفیف بیاورید. با ایجاد ارتباطات، ایجاد شتاب و کشف آنچه در اکوسیستم استارت آپی در آینده وجود دارد، زمینه بیشتری را پوشش دهید."}, {"source": "NYT Tech", "title": "An A.I. Songwriting Experiment: Humans Against the Machine", "link": "https://www.nytimes.com/2026/10/03/arts/music/human-songwriting-ai-songwriting.html", "summary": "Five humans convened for a weekend to create new music from scratch. Could they do better than A.I.? Could you even tell the difference?", "date_str": "2026-10-03T12:46:44+00:00", "hash": "cfac66d96e5b70af", "title_fa": "یک A.I. آزمایش ترانه سرایی: انسان ها علیه ماشین", "summary_fa": "پنج انسان برای یک آخر هفته گرد هم آمدند تا از ابتدا موسیقی جدیدی بسازند. آیا آنها می توانند بهتر از A.I عمل کنند؟ حتی می توانید تفاوت را بگویید؟"}, {"source": "NYT Tech", "title": "Sales of Hulking Pickups and S.U.V.s Sag as Fuel Prices Soar", "link": "https://www.nytimes.com/2026/10/02/business/auto-sales-pickup-trucks-suvs.html", "summary": "Sales of big pickup trucks and sport utility vehicles have dipped as more Americans buy hybrids and smaller cars.", "date_str": "2026-10-02T18:07:45+00:00", "hash": "59bfafdcd8234ce8", "title_fa": "فروش پیکاپ هالکینگ و S.U.V.s با افزایش قیمت سوخت کاهش می یابد", "summary_fa": "با خرید خودروهای هیبریدی و کوچک‌تر توسط آمریکایی‌ها، فروش وانت‌های بزرگ و خودروهای اسپرت کاهش یافته است."}, {"source": "The Guardian AI", "title": "California’s new laws target workers’ biggest fear of AI taking their jobs", "link": "https://www.theguardian.com/technology/2026/oct/03/california-ai-laws-worker-protection", "summary": "The state, which is home to many AI companies, is one of the first to roll out workplace regulations targeting the technology California’s laws aimed at protecting workers from the impacts of artificial intelligence could pave the way for broader workplace safeguards across the US as calls for regulating the technology mount. As the federal government goes hands-off on AI, California is taking the reins to address workers’ biggest fears. On Thursday, California governor Gavin Newsom signed a suite of new laws that ban bosses from relying entirely on AI to decide whether to fire workers, using it to predict employees’ emotional states or collecting neural data, meaning the information from electrical signals of someone’s brain or nerves. They also require companies to notify workers if layoffs were caused by AI and prohibit AI surveillance in workplace bathrooms. Continue reading...", "date_str": "2026-10-03T14:00:00+00:00", "hash": "0eddc1c6187a459d", "title_fa": "قوانین جدید کالیفرنیا بزرگترین ترس کارگران از تصاحب شغل هایشان توسط هوش مصنوعی را هدف قرار می دهد", "summary_fa": "این ایالت که محل بسیاری از شرکت‌های هوش مصنوعی است، یکی از اولین کشورهایی است که مقررات محل کار را با هدف قرار دادن فناوری هدف قرار داده است. در حالی که دولت فدرال به هوش مصنوعی دست می زند، کالیفرنیا کنترل بزرگ ترین ترس های کارگران را در دست می گیرد. روز پنجشنبه، فرماندار کالیفرنیا، گاوین نیوسام، مجموعه‌ای از قوانین جدید را امضا کرد که رؤسا را ​​از اتکای کامل به هوش مصنوعی برای تصمیم‌گیری در مورد اخراج کارگران، استفاده از آن برای پیش‌بینی حالات عاطفی کارکنان یا جمع‌آوری داده‌های عصبی، یعنی اطلاعات سیگنال‌های الکتریکی مغز یا اعصاب افراد، منع می‌کند. آن‌ها همچنین از شرکت‌ها می‌خواهند که اگر اخراج‌ها ناشی از هوش مصنوعی بود، به کارگران اطلاع دهند و نظارت هوش مصنوعی در حمام‌های محل کار را ممنوع کنند. ادامه مطلب... قوانین جدید در حالی وضع می شوند که کارگران به طور فزاینده ای نگران هستند که آیا هوش مصنوعی مشاغل آنها را می گیرد یا خیر، منجر به تبعیض و افزایش نظارت بر محل کار می شود. اتحادیه ها، مدافعان کارگران و حتی برخی از قانونگذاران برای قوانین جدید فشار آوردند، یک تغییر نظارتی برای فناوری که عمدتاً بدون کنترل توسعه یافته است. کالیفرنیا، خانه بسیاری از شرکت‌های پیشرو در توسعه هوش مصنوعی، یکی از اولین ایالت‌هایی است که مجموعه گسترده‌ای از مقررات محل کار را برای هدف قرار دادن این فناوری وضع کرده است. لورنا گونزالس، رئیس فدراسیون اتحادیه های کارگری کالیفرنیا، AFL-CIO، که به رهبران سراسر کشور در نوشتن مقررات کمک می کند، گفت: «این یک نقطه عطف است. این واقعاً اولین بار است که کارگران کالیفرنیا را می بینیم که به کشور نشان می دهند که ما مجبور نیستیم [این] را بپذیریم.»"}, {"source": "The Guardian AI", "title": "From the Bayeux tapestry to Glastonbury: top tips and tricks to grab the hottest tickets", "link": "https://www.theguardian.com/money/2026/oct/03/bayeux-tapestry-glastonbury-top-tips-tricks-hottest-tickets", "summary": "Nothing is guaranteed but there are ways to boost your chances of experiencing such in-demand events Whether your passion is the battle of the bands or the Battle of Hastings, what are probably Britain’s hottest cultural tickets are about to go on sale – and to be in with a shout of going, there are insider tips that will get you a good spot in the queue. General admission tickets to the Glastonbury festival next June go on sale online at 9am on Sunday, while the next tranche of tickets to view the Bayeux tapestry at the British Museum will be released to members on Tuesday 6 October before a public on-sale on 21 October. Continue reading...", "date_str": "2026-10-03T07:36:54+00:00", "hash": "29c2ad0970ab7d7b", "title_fa": "از ملیله بایو تا گلاستونبری: نکات و ترفندهای برتر برای گرفتن داغ ترین بلیط ها", "summary_fa": "هیچ چیز تضمین شده نیست، اما راه‌هایی برای افزایش شانس شما برای تجربه چنین رویدادهای پرتقاضی وجود دارد. بلیت‌های ورودی عمومی جشنواره گلستونبری در ژوئن آینده در ساعت 9 صبح یکشنبه به صورت آنلاین به فروش می‌رسند، در حالی که قسمت بعدی بلیط‌ها برای مشاهده ملیله بایو در موزه بریتانیا در روز سه‌شنبه 6 اکتبر قبل از فروش عمومی در 21 اکتبر برای اعضا منتشر می‌شود. ادامه مطلب... چه اشتیاق شما نبرد گروه‌ها باشد یا نبرد هیستینگز، احتمالاً داغ‌ترین بلیت‌های فرهنگی بریتانیا به فروش می‌رسند – و برای اینکه با فریاد رفتن در آنجا باشید، نکاتی وجود دارد که شما را به یک نقطه خوب در صف می‌رساند. اگر می‌خواهید شانس خود را امتحان کنید، سریع‌ترین انگشت خود را آماده کنید و نکات ما را برای افزایش شانس خود برای گرفتن بلیط برای رویدادهای پرتقاضا بررسی کنید. عضویت در یک سازمان یا مکان اغلب شامل رزرو اولویت است که به شما امکان دسترسی زودهنگام به بلیط ها را می دهد. با این حال، هزینه فراتر از بودجه بسیاری از افراد خواهد بود. پنجره رزرو اولویت عضو بعدی برای ملیله بایو - برای اسلات از 1 ژانویه تا 31 مارس 2027 - در ظهر سه شنبه 6 اکتبر باز می شود. این برای اعضایی است که تا 16 سپتامبر پیوسته اند. اگر هم‌اکنون بپیوندید، می‌توانید در ژانویه برای تاریخ‌های آوریل تا ژوئیه 2027 قبل از عموم رزرو کنید. با این حال، عضویت فردی استاندارد از 82 پوند شروع می شود. آیا قصد دارید بلیط های گلستونبری را امتحان کنید؟ یک نفر در هر تراکنش می تواند تا شش نفر رزرو کند و امسال، زمانی که فروش شروع می شود، به همه افرادی که قبلاً در صفحه glastonbury.seetickets.com هستند، مکانی در صف برای دسترسی به فرآیند رزرو اختصاص داده می شود."}, {"source": "The Guardian AI", "title": "OpenAI says its review into hacks, including on Australian government sites, is costing $500,000 a day", "link": "https://www.theguardian.com/technology/2026/oct/03/openai-review-hacks-australian-government-sites-costing-500000-a-day", "summary": "Company says it is reviewing 50 petabytes of data after its agents accessed websites including Medicare without authorisation Get our breaking news email , free app or daily news podcast OpenAI says its review in response to the Medicare and Hugging Face agent attacks is costing the company more than US$500,000 per day, as it deploys AI to examine data that would take a human 66m years to read. The company has warned the review is ongoing, and more organisations may be informed they’ve been targeted in the near future. Continue reading...", "date_str": "2026-10-03T05:39:22+00:00", "hash": "dbb0a8658cd8ed69", "title_fa": "OpenAI می گوید بررسی آن در مورد هک ها، از جمله در سایت های دولتی استرالیا، روزانه 500000 دلار هزینه دارد.", "summary_fa": "شرکت می‌گوید پس از اینکه عواملش بدون مجوز به وب‌سایت‌هایی از جمله مدیکر دسترسی پیدا کردند، 50 پتابایت داده را بررسی می‌کند، ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید OpenAI می‌گوید بررسی آن در پاسخ به حملات عامل مدیکر و Hugging Face بیش از 500000 دلار آمریکا در روز برای شرکت هزینه دارد، زیرا 6 سال برای بررسی داده‌ها از هوش مصنوعی استفاده می‌کند. این شرکت هشدار داده است که بررسی در حال انجام است و ممکن است سازمان‌های بیشتری مطلع شوند که در آینده نزدیک هدف قرار گرفته‌اند. به خواندن ادامه دهید... عصر جمعه، OpenAI فاش کرد که ماموران در ماه ژوئن به یک وب سایت دولتی نیو ساوت ولز هک کرده اند و بدون مجوز به داده های تاریخی غیرعمومی آتش سوزی های جنگلی دسترسی پیدا کرده اند. این ششمین وب سایت دولتی در استرالیا است که از ماه گذشته غول هوش مصنوعی در مورد خدمات خود، پس از آنتونی آلبانیز، نخست وزیر، اعلام کرد که ماموران OpenAI به پورتال آماری Services Australia's Medicare هک شده اند، به آن اطلاع داده می شود. دلیل تأخیر در مقایسه با افشای حمله مدیکر به دلیل حجم عظیمی از داده هایی است که OpenAI باید بررسی کند. در یک پست وبلاگی این هفته، این شرکت حجم زیادی از کار انجام شده برای بررسی فعالیت نمایندگان خود را فاش کرد. OpenAI گفت که باید 50 پتابایت داده را بررسی کند - تقریباً 50 میلیون گیگابایت. این شرکت گفت: \"ما ماه به ماه در حال بررسی سوابق هستیم و به دنبال فعالیت های ناخواسته بالقوه فراتر از مواردی هستیم که قبلاً پیدا کرده ایم.\" برای در نظر گرفتن این موضوع، اگر همه آن متن انگلیسی ساده بود، حدود 66 میلیون سال طول می‌کشد تا یک نفر آن را با 240 کلمه در دقیقه بخواند، بدون اینکه بخوابد"}, {"source": "The Guardian AI", "title": "Eliza review – an ambitious, unsettling play about the birth of AI", "link": "https://www.theguardian.com/stage/2026/oct/03/eliza-review-melbourne-theatre-company-birth-of-ai", "summary": "Melbourne Theatre Company While the cast is excellent, a play that sends us back to artificial intelligence’s genesis moment should feel more human than this It can be fiendishly difficult to write plays about contemporary obsessions, not least because they can shift and mutate in the time it takes to mount a production. A clever solution is to set your work at the point in history where said obsession began; that way you can still create resonant theatre within more stable boundaries. Eliza, Australian playwright Tom Holloway’s new play for MTC, cleaves to this formula, focusing on the German-American computer scientist Joseph Weizenbaum and the firstlings of AI. Weizenbaum (Dan Spielman) is working at MIT in 1966 with colleague Ron (Hamish Michael) and secretary Becky (Manali Datar) when he comes up with a programming language that arguably represents the birth of artificial intelligence – although he’d be the first person to argue it doesn’t. Weizenbaum creates a program that mimics the language and tone of psychoanalysis, parroting phrases and asking open-ended questions of the “how do you feel about that?” variety. In this way, he aims to debunk Alan Turing’s theory that machines may one day learn to think. Continue reading...", "date_str": "2026-10-03T01:57:39+00:00", "hash": "aeca34d173b8021b", "title_fa": "بررسی الیزا - یک بازی بلندپروازانه و ناراحت کننده در مورد تولد هوش مصنوعی", "summary_fa": "شرکت تئاتر ملبورن در حالی که بازیگران عالی هستند، نمایشنامه‌ای که ما را به لحظه پیدایش هوش مصنوعی بازمی‌گرداند، باید بیشتر از این احساس انسانی داشته باشیم، نوشتن نمایشنامه‌هایی درباره وسواس‌های معاصر می‌تواند بسیار دشوار باشد، به ویژه به این دلیل که می‌توانند در مدت زمانی که طول می‌کشد برای تولید یک اثر تغییر کنند و جهش پیدا کنند. یک راه حل هوشمندانه این است که کار خود را در نقطه ای از تاریخ تنظیم کنید که وسواس گفته شده از آنجا شروع شد. به این ترتیب شما هنوز هم می توانید تئاتر طنین انداز در مرزهای پایدارتر ایجاد کنید. الیزا، نمایشنامه نویس استرالیایی تام هالووی، نمایشنامه جدید برای MTC، به این فرمول پایبند است و بر دانشمند کامپیوتر آلمانی-آمریکایی جوزف وایزنبام و اولین فرزندان هوش مصنوعی تمرکز دارد. وایزنباوم (دن اسپیلمن) در سال 1966 با همکارش رون (همیش مایکل) و منشی بکی (مانالی داتار) در MIT کار می‌کند و زبان برنامه‌نویسی را ارائه می‌کند که مسلماً تولد هوش مصنوعی را نشان می‌دهد – اگرچه او اولین کسی است که استدلال می‌کند که اینطور نیست. Weizenbaum برنامه‌ای ایجاد می‌کند که زبان و لحن روانکاوی را تقلید می‌کند، عبارات را طوطی‌سازی می‌کند و سوالاتی را می‌پرسد که «در مورد آن چه احساسی داری؟» تنوع به این ترتیب، او قصد دارد نظریه آلن تورینگ را مبنی بر اینکه ماشین‌ها ممکن است روزی فکر کردن را بیاموزند، رد کند. به خواندن ادامه دهید... نوشتن نمایشنامه درباره وسواس های معاصر بسیار دشوار است، به ویژه به این دلیل که آنها می توانند در مدت زمانی که برای ساخت یک اثر لازم است تغییر کنند و جهش پیدا کنند. یک راه حل هوشمندانه این است که کار خود را در نقطه ای از تاریخ تنظیم کنید که وسواس گفته شده از آنجا شروع شد. به این ترتیب شما هنوز هم می توانید تئاتر طنین انداز"}, {"source": "The Guardian AI", "title": "Georgia holds emergency meeting on AI exposing voters’ secret ballots", "link": "https://www.theguardian.com/us-news/2026/oct/02/midterms-ai-ballot-privacy", "summary": "A Princeton researcher found that publicly available election records could be combined with AI to link voters to their ballots When voters cast their ballots, their votes are supposed to remain secret: from their family, their neighbors, and the government. But what if artificial intelligence could make secret votes visible? Continue reading...", "date_str": "2026-10-02T18:57:05+00:00", "hash": "031dd05a616130ad", "title_fa": "جورجیا جلسه اضطراری در مورد هوش مصنوعی برگزار می کند که رای مخفی رای دهندگان را افشا می کند", "summary_fa": "یکی از محققان پرینستون دریافت که سوابق انتخاباتی در دسترس عموم را می‌توان با هوش مصنوعی ترکیب کرد تا رأی‌دهندگان را به صندوق‌های رأی‌شان مرتبط کند. هنگامی که رأی‌دهندگان رای خود را به صندوق می‌اندازند، قرار است رای آنها مخفی بماند: از خانواده، همسایگان و دولت. اما اگر هوش مصنوعی بتواند آرای مخفی را قابل مشاهده کند چه؟ ادامه مطلب... ماه گذشته، مکس اسپرینگر، محقق فوق دکترا در مرکز سیاست فناوری اطلاعات دانشگاه پرینستون، چشم انداز شناسایی رای دهندگان را بر اساس برگه های رای جورجیا با اشتراک 20 دلاری در یک مدل زبان بزرگ هوش مصنوعی و داده های به دست آمده از یک درخواست Open Records Act آزمایش کرد. اسپرینگر می‌نویسد: «در عرض چند ساعت، من خط لوله‌ای برای تجزیه و تحلیل و شناسایی رأی‌های مخفی در سراسر ایالت جورجیا داشتم و مأمور به من گفت که دقیقاً چه اطلاعات بیشتری برای شناسایی برگه‌های رأی‌دهندگان واقعی نیاز است». \"نماینده در هیچ نقطه ای از پیروی کردن یا ابراز نگرانی در مورد اجرای اکسپلویت خودداری نکرد.\" این موضوع در کمتر از دو هفته قبل از شروع رای گیری زودهنگام در انتخابات میان دوره ای پرمخاطره که کنترل کنگره ایالات متحده را تعیین می کند، زنگ خطری را در میان مقامات انتخاباتی گرجستان به وجود آورده است. مخفی بودن رای یک حفاظت دموکراتیک است که به رای دهندگان این امکان را می دهد تا از انتخاب خود در برابر هر کسی که ممکن است سعی کند آنها را تحت تاثیر قرار دهد یا آنها را مرعوب کند تا به روش خاصی رای دهند محافظت کنند. اما آزمایش اسپرینگر نشان داد که او می‌تواند از هوش مصنوعی استفاده کند تا بفهمد مردم با استفاده از سوابق عمومی انتخابات جورجیا به چه کسانی رای داده‌اند. هیئت انتخابات ایالتی جورجیا صبح پنجشنبه جلسه اضطراری برگزار کرد تا در مورد اینکه چگونه هوش مصنوعی"}, {"source": "The Guardian AI", "title": "US arrests California man for allegedly smuggling $300m worth of computer servers to China", "link": "https://www.theguardian.com/us-news/2026/oct/02/arrest-smuggled-computer-servers-china", "summary": "Greg Lui allegedly used false paperwork to smuggle export-controlled gear from US to third countries and then China US authorities have arrested a man accused of smuggling more than $300m worth of computer servers to China , the Department of Justice announced. Greg Lui, 38, of California , also known as “Yiu Kong Lui”, allegedly used false paperwork and shipments through third countries to smuggle the export-controlled computer servers to China, the justice department said in a statement on Thursday. Continue reading...", "date_str": "2026-10-02T18:46:29+00:00", "hash": "c356b7ea23b1eba9", "title_fa": "ایالات متحده مرد کالیفرنیایی را به اتهام قاچاق سرورهای کامپیوتری به ارزش 300 میلیون دلار به چین دستگیر کرد", "summary_fa": "وزارت دادگستری اعلام کرد که گویا گرگ لوی از اسناد جعلی برای قاچاق تجهیزات تحت کنترل صادرات از ایالات متحده به کشورهای ثالث استفاده کرده است و سپس چین مقامات آمریکایی مردی را متهم به قاچاق بیش از 300 میلیون دلار سرورهای رایانه ای به چین دستگیر کرده اند. وزارت دادگستری روز پنجشنبه در بیانیه‌ای اعلام کرد که گرگ لوی، 38 ساله، از کالیفرنیا، که با نام «ییو کونگ لوی» نیز شناخته می‌شود، ظاهراً از اسناد و محموله‌های جعلی از طریق کشورهای ثالث برای قاچاق سرورهای رایانه‌ای تحت کنترل صادرات به چین استفاده کرده است. به خواندن ادامه دهید... سرورها حاوی «واحدهای پردازش گرافیکی (GPU) ساخت ایالات متحده هستند که معمولاً برای Super Intelligence (SI) استفاده می شوند»، با استفاده از نام جدید دولت ترامپ برای هوش مصنوعی (AI). بیل اسایلی، دادستان ناحیه مرکزی کالیفرنیا، گفت: «حفاظت از امنیت ملی آمریکا به معنای جلوگیری از استفاده از فناوری فوق‌اطلاعات پیشرفته ما برای تقویت قابلیت‌های نظامی دشمنانمان است». وی افزود: «ما به شدت کسانی را که امنیت ملی ما را به خاطر سود به خطر می اندازند تحت تعقیب قرار خواهیم داد». بر اساس این بیانیه، لویی یک شرکت فناوری به نام Earthmade Computer را اداره می کرد که از سال 2023 تا 2024 برای خرید و ارسال اقلام بدون مجوز وزارت بازرگانی ایالات متحده به چین استفاده می کرد. این شرکت اقلام را به کشورهایی از جمله مالزی و سنگاپور ارسال کرد، جایی که چنین مجوزی لازم نیست، سپس به طور غیرقانونی آنها را دوباره به چین صادر کرد. اگر لویی مجرم شناخته شود، ممکن است با حداکثر 50 سال زندان روبرو شود. چین که مدت‌هاست در زمینه هوش مصنوعی پیشرفته از ایالات متحده عقب مانده است، به سرعت این شکاف را از بین می‌برد."}, {"source": "The Guardian AI", "title": "AI threatens to destroy so much of our culture. Our greatest loss might be our ability to listen | Shirleene Robinson", "link": "https://www.theguardian.com/commentisfree/2026/oct/03/ai-threatens-to-destroy-so-much-of-our-culture-our-greatest-loss-might-be-our-ability-to-listen", "summary": "Australians are conversing less every year, with a recent study showing we lost an average of 338 spoken words each day between 2005 and 2019 We talk a lot about losing our ability to write as a result of AI. I’m convinced our greatest loss might be our ability to listen. Listening to different views and entering into different worlds is integral to our humanity. But Australians are conversing less every year. While rapidly evolving AI tools and chatbots promise faster responses and so-called “empathetic” listening, a recent study showed we lost an average of 338 spoken words each day between 2005 and 2019. That adds up to a staggering loss of 120,000 spoken words per person, compared with the year before. Continue reading...", "date_str": "2026-10-02T15:00:14+00:00", "hash": "3704f8a1c5e6cf60", "title_fa": "هوش مصنوعی بسیاری از فرهنگ ما را تهدید می کند. بزرگترین ضرر ما ممکن است توانایی ما در گوش دادن باشد | شرلین رابینسون", "summary_fa": "استرالیایی‌ها هر سال کمتر با هم صحبت می‌کنند، با یک مطالعه اخیر نشان می‌دهد که ما بین سال‌های 2005 تا 2019 روزانه به طور متوسط ​​338 کلمه گفتاری را از دست داده‌ایم. من متقاعد شده ام که بزرگترین ضرر ما ممکن است توانایی ما در گوش دادن باشد. گوش دادن به دیدگاه های مختلف و ورود به جهان های مختلف جزء جدایی ناپذیر انسانیت ماست. اما استرالیایی ها هر سال کمتر صحبت می کنند. در حالی که توسعه سریع ابزارهای هوش مصنوعی و چت ربات‌ها نوید پاسخ‌های سریع‌تر و به اصطلاح گوش دادن «همدلانه» را می‌دهند، یک مطالعه اخیر نشان داد که ما بین سال‌های 2005 تا 2019 روزانه به طور متوسط ​​338 کلمه گفتاری را از دست داده‌ایم. این میزان در مقایسه با سال  "title_fa": "حمله OpenAI به مدیکر «بدهی فناوری» استرالیا را آشکار کرده است. رفع آن می تواند صورت حساب بزرگی برای مالیات دهندگان به همراه داشته باشد", "summary_fa": "وزارت امور داخلی به همه آژانس‌های دولتی فدرال دستور می‌دهد تا در میان پیامدهای هک‌های عامل هوش مصنوعی، «فناوری قدیمی» را بررسی کنند. ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید دولت استرالیا با «بدهی فناوری» قابل توجهی مواجه است که ممکن است پس از نقض OpenAI Medicare، صورت‌حساب بزرگی را برای مالیات دهندگان به همراه داشته باشد، زیرا آژانس‌های دولتی در برابر حمله‌های آینده دفاعی توسط هوش مصنوعی نیاز دارند. این هفته، وزارت امور داخلی به همه آژانس‌های دولتی فدرال دستور داد تا «فناوری ذخیره‌سازی قدیمی» را انجام دهند که به برنامه‌ای برای هر آژانس نیاز دارد تا «سیستم‌های فناوری قدیمی» را تا سطحی در حد تحمل ریسک و اشتهای آژانس کاهش دهد. ادامه مطلب... دولت استرالیا با «بدهی فناوری» قابل توجهی مواجه است که می تواند پس از نقض OpenAI Medicare، صورت حساب بزرگی را برای مالیات دهندگان به همراه داشته باشد، زیرا سازمان های دولتی باید دفاع خود را در برابر حملات آینده توسط عوامل هوش مصنوعی تقویت کنند. OpenAI در این هفته فاش کرد که یک نماینده داخلی در طی یک کار آموزشی که به دنبال اطلاعاتی در مورد هزینه های دولت در مورد بیماری های پوستی در ویکتوریا بود، به پورتال آمار خدمات استرالیا مدیکر دسترسی غیرعمومی پیدا کرده بود. این عامل قادر به اجرای دستورات، بازیابی فایل های داخلی، اعتبارنامه ها و نوشتن فایل ها بود. در حالی که OpenAI از استرالیا به دلیل این حادثه عذرخواهی کرده است، این امر به عنوان زنگ خطری برای دولت فدرال عمل کرده است و بررسی گسترده دولت اکنون در حال انجام است. کیتی گالاگر، وزیر دارایی، از وزارتش پرسید که آیا می توان بخشی از بودجه 160 میلیون دلاری استرالیایی که در آخرین بودجه برای ارتقاء سایبری به آژانس اختصاص داده شده است، تسریع کرد."}, {"source": "The Guardian AI", "title": "‘These guys are just coming from nothing’: questions over multibillion-dollar Firmus float amid datacentre backlash", "link": "https://www.theguardian.com/australia-news/2026/oct/03/ai-datacentre-backlash-firmus-a
