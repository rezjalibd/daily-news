ike he'd been left with a \"tattoo of a legacy\" of Iger, who was Disney's top exec from 2005 until Chapek took over in February 2020, and served again from November 2022 to March of this year. \"I feel that's tremendously unfair, not only given the circumstances upon which I took the job, but the fact that the board had a very quick trigger — and frankly, sided with a guy who wanted his job back,\" Chapek said in an interview with Business Insider. Nearly four years after Chapek's firing, he has set out to rehabilitate his reputation with a new book detailing his rise inside the Mouse House and his dramatic departure from Disney . The book's rollout has involved a whole lot of Iger bashing and far less soul-searching from Chapek. Under Chapek, Disney had PR stumbles, including fights with star actor Scarlett Johansson and Florida Gov. Ron DeSantis . Wall Street was initially pleased with Chapek, and the stock more than doubled in less than a year, soaring from its pandemic low of $79 to $197 in March 2021. Disney+ grew to over 150 million subscribers in under three years. Riding high, Chapek set an ambitious goal: 230 million to 260 million subscribers by the end of 2024. Shares tumbled back to pandemic lows, however, after Disney's streaming business lost nearly $1.5 billion in a single quarter. In late 2022, Disney's board dismissed Chapek and reinstated Iger as CEO. Chapek's take: He \"fell victim\" to a plot by his former boss to undermine him from the start. Representatives for Disney, where Iger is a board member, didn't respond to requests for comment. Iger hasn't publicly responded to Chapek's recent criticisms, though he said in a Harvard Business Review interview published last week that when Disney chose Chapek as his successor,", "date_str": "2026-10-01T17:22:42+00:00", "hash": "e202b7685b47069a", "title_fa": "باب چاپک می‌گوید که نباید سمت مدیرعاملی دیزنی را می‌گرفت – و توصیه‌هایی به جاش دامارو دارد.", "summary_fa": "مدیر عامل سابق دیزنی باب چاپک (سمت چپ) از رئیس فعلی جاش دی آمارو (وسط) حمایت می کند اما باب ایگر (راست) را هدف قرار می دهد. استیون فردمن/گتی ایماژ; شرکت والت دیزنی/آسوشیتدپرس؛ جردن اشتراوس/اینویژن/AP باب چاپک می گوید که نباید سمت مدیر عاملی دیزنی را می گرفت و قربانی نقشه ای از باب ایگر شد. چاپک از جاش دامارو، مدیر ارشد اجرایی فعلی حمایت می کند و می گوید ارتقای شغلی او \"مناسب\" بود. چاپک توصیه هایی به D'Amaro ارائه کرد، از جمله اجتناب از جنگ های فرهنگی. باب چاپک می‌گوید اگر می‌توانست به گذشته برگردد، یک پاسخ ساده به پیشنهاد نقش مدیر عامل دیزنی می‌داد: «نه». زمان کوتاه و پرتلاطم چاپک در مقام اول با درگیری او با باب ایگر، جانشین قبلی او مشخص شد. چاپک گفت که احساس می‌کند با \"خالکوبی میراث\" ایگر، که از سال 2005 تا زمانی که چاپک در فوریه 2020 مدیریت را بر عهده گرفت، مدیر ارشد دیزنی بود، باقی مانده است و دوباره از نوامبر 2022 تا مارس سال جاری خدمت کرد. چاپک در مصاحبه ای با Business Insider گفت: \"من احساس می کنم که این بسیار ناعادلانه است، نه تنها با توجه به شرایطی که من کار را آغاز کردم، بلکه با توجه به این واقعیت که هیئت مدیره یک محرک بسیار سریع داشت - و صادقانه بگویم، طرفدار مردی بود که می خواست شغل خود را بازگرداند.\" نزدیک به چهار سال پس از اخراج چاپک، او تصمیم گرفته است تا با کتاب جدیدی که به جزئیات ظهور او در خانه موش و خروج چشمگیرش از دیزنی می‌پردازد، شهرت خود را بازسازی کند. انتشار این کتاب شامل کلنجارهای ایگر و جستجوی روحی بسیار کمتری از چاپک بوده است. در زمان چاپک، دیزنی دچار مشکلات روابط عمومی شد، از جمله دعوا با بازیگر ستاره اسکارلت جوهانسون و فرماندار فلوریدا، ران دیسانتیس. وال"}, {"source": "Business Insider", "title": "OpenAI parts ways with 3 researchers who it says mishandled sensitive information", "link": "https://www.businessinsider.com/openai-three-researchers-information-handling-2026-10", "summary": "OpenAI said it has parted ways with three employees. Samuel Boivin/NurPhoto via Getty Images OpenAI said it has \"parted ways\" with three employees. The company said the individuals violated policies \"on accessing and handling sensitive company information.\" OpenAI has been under in ست\". این شرکت گفت که این افراد خط‌مشی‌های «در مورد دسترسی و مدیریت اطلاعات حساس شرکت» را نقض کرده‌اند. OpenAI از زمانی که این شرکت فاش کرد که عوامل هوش مصنوعی آن Hugging Face را نقض کرده اند، تحت فشار شدید قرار گرفته است. OpenAI می گوید راه خود را با سه محقق جدا کرده است که به گفته این شرکت، خط مشی های آن برای به اشتراک گذاری اطلاعات حساس را نقض کرده اند. سخنگوی OpenAI در بیانیه ای گفت: \"ما راه خود را با سه نفر به دلیل نقض سیاست های ما در مورد دسترسی و مدیریت اطلاعات حساس شرکت جدا کردیم.\" \"تحقیقات ما تأیید کرد که این افراد اطلاعات حساس خارج از رویه‌های شرکت را به درستی مدیریت کرده‌اند، خط‌مشی‌های ما را نقض کرده و اعتماد ضروری برای کار ما را شکسته‌اند.\" وال استریت ژورنال گزارش داد که کارمندان مورد بحث ظاهرا \"اطلاعات محرمانه شرکت را با یک سازمان ایمنی هوش مصنوعی شخص ثالث به اشتراک گذاشته اند.\" یک سخنگوی OpenAI به سوالی در مورد ماهیت اشتراک گذاری اطلاعات پاسخ نداد. OpenAI هم در داخل و هم از خارج به دلیل رسیدگی به مسائل ایمنی مرتبط با هوش مصنوعی با فشارهایی مواجه شده است، پس از افشای آن که عوامل سرکش پس از نقض یک محیط تست امن که قرار نبود اجازه دسترسی به اینترنت را بدهد، Hugging Face را هک کردند. این شرکت اخیراً اعلام کرد که از ارزیابی‌های مستقل موارد ایمنی پشتیبانی می‌کند، ایده‌ای که حمایت فزاینده‌ای را در سراسر صنعت به دست آورده است. این شرکت ماه گذشته در پستی گفت: \"OpenAI متعهد به حمایت از ارزیابی های مستقل با سطوح دسترسی عمیق در آموزش، ارزیابی و"}, {"source": "Business Insider", "title": "I worked at Spirit Halloween for 3 years. Here are 9 mistakes I saw customers make when shopping for costumes and decor.", "link": "https://www.businessinsider.com/things-not-to-do-spirit-halloween-stores-from-employee-2026-10", "summary": "After working at Spirit Halloween for three years, I ve identified common mistakes customers make. Stephanie Pitera Statile I worked at Spirit Halloween for three years and saw many customers make the same mistakes. I always encouraged shoppers to invest in high-quality pieces they can reuse year after year. Many customers forgot to check Halloween makeup for irritants and allergens. Halloween has always been more of a lifestyle than a holiday for me, much to the chagrin of my husband and family. Although I worked at Spirit Halloween — the seasonal chain known for taking over empty storefronts — for three years, I've been a longtime customer and have even joked that the store was created just for me. Here are nine mistakes I saw customers make while shopping for their costumes and seasonal decor at the popular Halloween chain. Only coming into the store once per season One of the biggest mistakes I saw customers make was only visiting once per year. The stores get truckloads of new merchandise delivered weekly, so chances are you'll find something new every time you stop by. I also recommend asking an associate on the sales floor when the next delivery will be. I was always happy to help customers find the latest products. Not browsing the entire store Accessories can be found throughout the store. Stephanie Pitera Statile When shopping for accessories to complete your look, keep your eyes open and peruse the entire store because hidden gems are everywhere. The checkout line, in particular, is always full of the best selection of chokers, earrings, and other fun novelty items. Going straight for the lowest price instead of investing in quality pieces I ve found Spirit Halloween s Signature Collection costumes are made with higher-quality fabrics. Stephanie Pitera Statile If you only plan to wear a costume once, it's fine to go for the cheap stuff. But investing a little more can extend the costume's wear. Spirit Halloween offers a line of Signature Collection costumes, which cost more but are made with higher-quality fabrics. I've found these pieces can last through several years of Halloween events or cosplay fun. And, in my opinion, investing in great accessories to complete the look is just as important. For example, if you're dressing up as a vampire, fangs can add an extra layer to the costume. However, a cheap pair probably won't last the night. The Scarecrow-brand fangs are my favorite. Stephanie Pitera Statile My personal favorite is the Scarecrow ", "date_str": "2026-10-01T16:59:47+00:00", "hash": "d73fff7a3691d1bb", "title_fa": "من 3 سال در Spirit Halloween کار کردم. در اینجا 9 اشتباهی را که دیدم مشتریان هنگام خرید لباس و دکور مرتکب می شوند، آورده شده است.", "summary_fa": "پس از سه سال کار در Spirit Halloween، اشتباهات رایج مشتریان را شناسایی کردم. Stephanie Pitera Statile من سه سال در Spirit Halloween کار کردم و دیدم که بسیاری از مشتریان اشتباهات مشابهی را مرتکب می شوند. من همیشه خریداران را تشویق می کردم که روی قطعات باکیفیت سرمایه گذاری کنند که بتوانند سال به سال دوباره از آنها استفاده کنند. بسیاری از مشتریان فراموش کردند که آرایش هالووین را برای محرک ها و آلرژن ها بررسی کنند. هالووین همیشه برای من بیشتر یک سبک زندگی بوده تا یک تعطیلات که باعث ناراحتی همسر و خانواده ام شده است. اگرچه من سه سال در Spirit Halloween - زنجیره فصلی که به خاطر تصاحب ویترین های خالی شهرت دارد - کار کردم، مشتری دیرینه ای بودم و حتی به شوخی گفتم که فروشگاه فقط برای من ایجاد شده است. در اینجا 9 اشتباهی وجود دارد که دیدم مشتریان هنگام خرید لباس و دکوراسیون فصلی خود در زنجیره محبوب هالووین مرتکب شدند. فقط یک بار در هر فصل به فروشگاه آمدن یکی از بزرگترین اشتباهاتی که دیدم مشتریان مرتکب می شوند این بود که فقط یک بار در سال به فروشگاه مراجعه می کردند. فروشگاه‌ها بارها بارهای کالای جدید را به صورت هفتگی تحویل می‌گیرند، بنابراین به احتمال زیاد هر بار که به آنجا می‌روید، چیز جدیدی پیدا خواهید کرد. همچنین توصیه می کنم از یکی از همکاران در طبقه فروش بپرسید که تحویل بعدی چه زمانی خواهد بود. من همیشه خوشحال بودم که به مشتریان کمک کنم تا جدیدترین محصولات را پیدا کنند. عدم مرور کل فروشگاه لوازم جانبی را می توان در سراسر فروشگاه پیدا کرد. Stephanie Pitera Statile هنگام خرید لوازم جانبی برای تکمیل ظاهر خود، چشمان خود را باز نگه دارید و کل فروشگاه را بررسی کنید زیرا جواهرات پنهان همه جا هستند. به‌ویژه خط پرداخت همیشه مملو"}, {"source": "Business Insider", "title": "Best Visible phone plan le app while browsing in-store to activate a flashing light that helps locate items on shelves. The feature has been available for employees and Spark delivery drivers over the past several months, and is built into the new digital price tags appearing in Walmart's US stores for the past year. With the Walmart app — and its AI shopping assistant, Sparky — customers can search for the exact item they want and tap a button on the product listing page to activate a little green light in the aisle where they're standing. Employees have had access to the flashing light feature for several months. Dominick Reuter/Business Insider Business Insider saw the tech in action during a store tour in April, and a Spark driver said it has helped her fulfill delivery orders faster. The lights are also used by store employees to more quickly and accurately re-stock shelves, the company said. This aspect of the digital price tag technology has garnered less attention so far than the question of whether the miniature displays would be used to change prices more dynamically. Last week, CEO John Furner pledged that the company will never set prices based on the time of day or who's shopping, and that there will be no \"personalized price\" at Walmart . Walmart says all maximum display prices are set centrally at its headquarters, while store managers have discretion to offer certain discounts to remain competitive in their markets. Read the original article on Business Insider", "date_str": "2026-10-01T16:40:12+00:00", "hash": "315ba3f837a45e55", "title_fa": "Walmart ویژگی جدیدی را برای خریداران در برچسب های قیمت دیجیتال خود روشن می کند", "summary_fa": "چراغ‌های نشانگر در برچسب‌های قیمت دیجیتال جدید که در سال گذشته در فروشگاه‌های Walmart ایالات متحده ظاهر شده‌اند، تعبیه شده‌اند. Dominick Reuter/Business Insider خریداران Walmart اکنون می توانند از این برنامه برای فعال کردن چراغ چشمک زن برای کمک به یافتن اقلام موجود در قفسه ها استفاده کنند. این ویژگی بخشی از عرضه برچسب های قیمت دیجیتال این pliance repair. Her", "date_str": "2026-10-02T14:00:00+00:00", "hash": "37b84744e392b43e", "title_fa": "این ابزارهای برقی بی سیم DeWalt تا 40٪ تخفیف در Lowe's در حال حاضر دارند.", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اگر در پاییز امسال به دنبال ابزارهای برقی جدید برای انجام پروژه های DIY خود هستید، ممکن است متوجه شده باشید که ابزارهای شارژی با کیفیت می توانند گران باشند. به طور متناقض، انتخاب ابزارهای با کیفیت بالاتر با عمر باتری طولانی در دراز مدت باعث صرفه جویی در هزینه شما می شود، اما کنترل بودجه در حال حاضر می تواند دشوار باشد. خوشبختانه، با نزدیک شدن رویداد ماه اکتبر آمازون، Lowe's فروش رقابتی خود را راه اندازی کرده است و تخفیف های عمده ای را برای گزینه های قابل اعتماد DeWalt ارائه می دهد. اینها بهترین معاملاتی هستند که در حال حاضر می بینم. بهترین مجموعه دریل و درایور DeWalt یک مته و درایور خوب پایه و اساس یک مجموعه ابزار شارژی است، زیرا به شما امکان می‌دهد پیچ‌ها و پیچ‌ها را بچرخانید و سوراخ‌هایی را برای پروژه‌های اساسی DIY ایجاد کنید، از قفسه‌های آویزان گرفته تا تعمیر لولای در. DeWalt یک مجموعه مته و درایور را به خاطر عمر باتری خوب و دوام آن مشهور می کند. این مجموعه ای است که من هر روز در فروشگاه حرفه ای خود از آن استفاده می کنم و استفاده روزانه را با شدت بالا نگه می دارد. مجموعه مته و درایور 20 ولتی DeWalt با قیمت 179 دلار، 25 درصد تخفیف از قیمت معمولی خود به فروش می رسد. این دستگاه دارای یک دریل 20 ولتی، یک درایور ضربه ای، دو باتری 1.5 آمپر ساعتی، یک شارژر و یک کیف ابزار می باشد. بهترین معاملات در مورد اره های چرخدار شارژی DeWalt DeWalt به دلیل اختراع اره بازویی شعاعی، پیش درآمدی برای اره های چرخدار امروزی، که اغلب برای قالب گیری و برش استفاده می"}, {"source": "Lifehacker", "title": "The Top 10 Movies Right Now, According to Streaming Data", "link": "https://lifehacker.com/entertainment/the-top-10-movies-right-now-according-to-streaming-data-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The most-streamed movies in September, according to JustWatch , include a couple of early Halloween treats: low-budget, high-scare horror flicks Backrooms and Obsession both made the top 10. If you like more gentle supernatural stories, 1990s classic Practical Magic made the charts too. You could also check out best-actor-ever favorites Robert De Niro in The Whisper Man and Dustin Hoffman in Tuner. So there's something for everyone. Backrooms (2026) Director Kane Parsons' analog horror breakthrough is proof that atmosphere, mood, and a fascinating story is scarier than CGI monsters every time. Based on the viral YouTube series of the same name, Backrooms tells the story of Clark (Chiwetel Ejiofor), a store owner who discovers a labyrinthian liminal space in his furniture shop's basement. Renate Reinsve plays his therapist, who thinks it's a delusion, until she goes downstairs for a visit. A hit with critics Backrooms is sitting at 87% fresh on Rotten Tomatoes and audiences, Backrooms is a delicious early Halloween treat for horror fans. Stream Backrooms on HBO Max. Backrooms at HBO Max Learn More Learn More at HBO Max Practical Magic (1998) Released to streaming to coincide with the sequel's release in theaters, Practical Magic is a beloved supernatural rom-com finding a new audience in 2026. Sandra Bullock and Nicole Kidman play Sally and Gilly, sister-witches cursed with losing any man they ever love. Sally's romantic interest appears in the form of Aidan Quinn playing a detective investigating the disappearance of Gilly's abusive boyfriend. Can love, magic, and the power of sisterhood break the family curse? With a little help from '90s nostalgia, you bet they can. Stream Practical Magic on HBO Max. Practical Magic at HBO Max Learn More Learn More at HBO Max Obsession (2026) Director Curry Barker is still in his 20s, but his debut theatrical feature is the kind of horror film that changes the entire genre. Obsession is a classic \"be careful what you wish for\" story that feels fresh thanks to its talented young cast, unpredictable plot, and careful pace. Michael Johnston plays a young man too scared to tell his crush how he feels, so he wishes she'd fall in love with him instead. The result is a nightmare embodied by Inde Navarrette, whose portrayal of the villain/victim is at once harrowing, terrifying, and heartbreaking. Obsession is the best horror movie I've seen in years. Stream Obsession on Peacock ", "date_str": "2026-10-02T13:30:00+00:00", "hash": "d0b6d0f88a1af772", "title_fa": "10 فیلم برتر در حال حاضر، بر اساس داده های جریان", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. طبق گفته JustWatch، پرفروش‌ترین فیلم‌های ماه سپتامبر شامل چند فیلم اولیه هالووین هستند: فیلم‌های ترسناک کم‌هزینه و ترسناک Backrooms و Obsession هر دو در بین ۱۰ فیلم برتر قرار گرفتند. اگر داستان‌های فراطبیعی ملایم‌تری دوست دارید، جادوی عملی کلاسیک دهه ۱۹۹۰ نیز در جدول قرار گرفت. همچنین می‌توانید رابرت دنیرو را در فیلم The Whisper Man و داستین هافمن در تیونر، بهترین بازیگر مرد را نیز بررسی کنید. بنابراین چیزی برای همه وجود دارد. Backrooms (2026) موفقیت آنالوگ ترسناک کارگردان کین پارسونز گواه این است که اتمسفر، حال و هوا و داستانی جذاب هر بار ترسناک‌تر از هیولاهای CGI است. بر اساس مجموعه ویروسی یوتیوب به همین نام، Backrooms داستان کلارک (Chiwetel Ejiofor) را روایت می کند، صاحب فروشگاهی که یک فضای مرزی هزارتویی را در زیرزمین مغازه مبلمان خود کشف می کند. Renate Reinsve نقش درمانگر او را بازی می کند که فکر می کند این یک توهم است تا اینکه برای ملاقات به طبقه پایین می رود. بک‌روم‌ها در Rotten Tomatoes و مخاطبان با 87 درصد جذابیت مورد توجه منتقدان قرار گرفته‌اند، Backrooms یک غذای خوشمزه اوایل هالووین برای طرفداران ترسناک است. استریم اتاق‌های پشتیبان در HBO Max. Backrooms در HBO Max بیشتر بیاموزید در HBO Max Practical Magic (1998) که همزمان با اکران دنباله در سینماها برای استریم منتشر شد، Practical Magic یک رام ماوراء طبیعی دوست داشتنی است که در سال 2026 مخاطب جدیدی پیدا می کند. ساندرا بولاک و نیکول کیدمن نقش سالی و گیلی را بازی می کنند، خواهر جادوگرانی که با از دست دادن هر مردی که دوستشان داشته اند نفرین شده اند. علاقه عاشقانه سالی به شکل ایدان کوین در نقش کارآگاهی ظاهر می شود که در حال تحقیق در مورد ناپدید شدن دوست پسر بدرفتار گیلی است. آیا عشق، جادو"}, {"source": "Lifehacker", "title": "This TP-Link Wi-Fi 7 Router Is 32% Off for October Prime Day", "link": "https://lifehacker.com/tech/tp-link-archer-be550-wi-fi-7-router-sale-early-october-prime-day-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Early October Prime Day deals are making Wi-Fi 7 upgrades considerably less expensive, with the TP-Link Archer BE550 dropping to $169.99 from $249.99 on Amazon. For more on this year's sale, check out our extensive Prime Day 2026 coverage . TP-Link Archer BE550 Wi-Fi 7 Router $169.99 at Amazon $249.99 Save $80.00 Get Deal Get Deal $169.99 at Amazon $249.99 Save $80.00 This tri-band router spreads traffic across 2.4GHz, 5GHz, and 6GHz bands, with support for newer Wi-Fi 7 features including Multi-Link Operation and 320MHz channels. Plus, all five of its ports (one WAN port and four LAN ports) run at 2.5Gbps, meaning a desktop, a gaming console, and a NAS can each pull multi-gigabit speeds at the same time. You also get a USB 3.0 port for plugging in an external drive, with the whole thing managed through TP-Link's Tether app or a web interface. As for its performance, it reportedly delivers excellent top speeds, and its range performance holds up well across a multi-level house, so you should still have enough bandwidth for large downloads, 4K streaming, and other demanding tasks happening simultaneously in different parts of the home. Its EasyMesh support also means you can pair it with another certified router or extender later. That said, while the BE550 has very good range for a standalone router, it s not a mesh system, so speeds naturally decline as you move farther away or between floors, and you may need that second EasyMesh unit after all. Also, its WAN port tops out at 2.5Gbps, so peak speeds fall short of what a router like the eero Max 7 can hit, though that only becomes a problem if your internet plan is faster than 2.5Gbps. October Prime Day FAQs When is Prime Day? October Prime Day is Oct. 6 and runs through Oct. 7. It happens every year during October. Is Prime Day a scam? No. Prime Day is a legitimate online sale from arguably the biggest and most reputable online retailer in the world. What goes on sale on Prime Day? Since Prime Big Deal Days happens in the fall, you're likely to see more deals on gaming and indoor gym equipment. Amazon has already announced some of the 35 categories that will be on sale, including beauty, tech, kitchen, fashion, and home. Some brands Amazon has already mentioned are: Shark, Princess Polly, Soundcore by Anker, UGG, Nest New York, Sony, Tarte, Adidas, and Barefoot Dreams. Our Best Edi", "date_str": "2026-10-02T12:30:00+00:00", "hash": "4b792a52616bf0a2", "title_fa": "این روتر TP-Link Wi-Fi 7 برای اولین روز اکتبر 32 درصد تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. معاملات اوایل اکتبر Prime Day به‌روزرسانی‌های Wi-Fi 7 را به‌طور قابل‌توجهی ارزان‌تر می‌کنند، به طوری که TP-Link Archer BE550 از 249.99 دلار در آمازون به 169.99 دلار کاهش یافته است. برای اطلاعات بیشتر در مورد فروش امسال، پوشش گسترده Prime Day 2026 ما را بررسی کنید. روتر Wi-Fi 7 TP-Link Archer BE550 169.99 دلار در آمازون 249.99 دلار صرفه جویی 80.00 دلار دریافت معامله دریافت معامله 169.99 دلار در آمازون 249.99 دلار صرفه جویی 80.00 دلار این روتر سه باند ترافیک را در 2.4 گیگاهرتز، باند جدید 5 گیگاهرتز، باند 7 گیگاهرتز، پشتیبانی از WiFier، 5 گیگاهرتز پخش می کند. ویژگی هایی از جمله عملکرد چند لینک و کانال های 320 مگاهرتز. به علاوه، هر پنج پورت آن (یک پورت WAN و چهار پورت LAN) با سرعت 2.5 گیگابیت بر ثانیه اجرا می‌شوند، به این معنی که یک دسکتاپ، یک کنسول بازی و یک NAS هر کدام می‌توانند سرعت چند گیگابیتی را به طور همزمان داشته باشند. شما همچنین یک پورت USB 3.0 برای وصل کردن یک درایو خارجی دریافت می‌کنید که همه چیز از طریق برنامه Tether TP-Link یا یک رابط وب مدیریت می‌شود. در مورد عملکرد آن، طبق گزارش‌ها، حداکثر سرعت عالی را ارائه می‌دهد و عملکرد برد آن در یک خانه چند سطحی به خوبی حفظ می‌شود، بنابراین شما همچنان باید پهنای باند کافی برای دانلودهای بزرگ، پخش جریانی 4K و سایر کارهای سخت که به طور همزمان در بخش‌های مختلف خانه انجام می‌شوند، داشته باشید. پشتیبانی EasyMesh آن همچنین به این معنی است که می توانید بعداً آن را با یک روتر یا توسعه دهنده تأیید شده دیگر جفت کنید. همانطور که گفته شد، در حالی که BE550 برد بسیار خوبی"}, {"source": "Lifehacker", "title": "The Best Deals on Anker Tech During the October Prime Day Sale", "link": "https://lifehacker.com/tech/best-anker-deals-early-october-prime-day-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Anker has really made a name for itself outside of their batteries, expanding to headphones, speakers, projectors, and other tech products. Their power stations are still one of the most recognized in the industry, but their other products are climbing up their respective ladders as well. There are many Anker products on sale right now during the early October Prime Day sale , and I've rounded up the best power banks, headphones, and power stations I could find. I'll keep updating this list as more Anker products go on sale throughout the sale. The best Anker power station deals during the early October Prime Day sale The best deal on a power station is the Anker SOLIX S2000 , which is 43% off right now, landing at $679.99 (originally $1,199). I own an Anker power station that is slightly bigger than this one, and I can vouch for their quality and practicality. The S200 is great for anyone who lives in a house that is prone to losing power during a storm or anyone looking for a compact but powerful portable power station they can take to a backyard or camping. It can power an average fridge for 35 hours, according to Anker, which gives you an idea of how powerful the S200 is. The best time to buy a power bank is when they're massively discounted, not when the food in your fridge is spoiling from a power outage. Anker SOLIX S2000 1500W Solar Portable Power Station $679.99 at Amazon $1,199.00 Save $519.01 Get Deal Get Deal $679.99 at Amazon $1,199.00 Save $519.01 Other Anker power station deals Anker Solix C300 DC Portable Power Station $199.99 (originally $249.99) Anker Solix C200 Power Station with 60W Solar Panel $229.99 (originally $259.99) Anker SOLIX C2000 Gen 2 Portable Power Station $899.99 (originally $1,499) The best power bank deals during the early October Prime Day sale There is something about having a charging station for all of your devices that gives me a sense of peace. Maybe it's practicality or organization, but I love it. The Anker Qi2.2 Foldable MagSafe Charger can do that for your phone, smartwatch, and earbuds all at once. It also props your phone up as a stand. Right now, it's $119.99 (originally $149.99), after a 20% discount. Anker Prime 3-in-1 Wireless Charging Station, MagSafe Charger Stand Compatible, Qi2.2 25W Certified Palm-Sized Foldable Charger for iPhone 17/16, Apple Watch, AirPods (Non-Battery, Adapt", "date_str": "2026-10-01T21:30:20+00:00", "hash": "a334dfda21276a4c", "title_fa": "بهترین تخفیف‌ها در Anker Tech در طول فروش روز اول اکتبر", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. Anker واقعاً خارج از باتری‌های خود نامی برای خود دست و پا کرده است و به هدفون، بلندگو، پروژکتور و سایر محصولات فناوری گسترش یافته است. نیروگاه های آنها هنوز یکی از شناخته شده ترین نیروگاه ها در صنعت هستند، اما سایر محصولات آنها نیز از نردبان های مربوطه خود بالا می روند. در حال حاضر بسیاری از محصولات Anker در فروش اولیه در اوایل  s shown in the Collections screen Credit: Khamosh Pathak The Collections tab in the Photos app arranges itself automatically, showing you suggested photos, memories, and highlight reels at the top. Unfortunately, the way Apple orders things is a bit of a mess. The thing is, Photos has plenty of useful categories and shortcuts for accessing media quickly, such as for screenshots, custom albums, and utilities like Hidden Folder. As such, you should reorder the Collections tab to make it work better for you. Tap the Menu button at the top of the Collections tab and choose Reorder . My advice is to bring the Utilities and Media Types collections to the top, as they serve as useful shortcuts. Use \"Captured By Me\" to hide screenshots and saved photos If you're like me, your camera roll is filled with too many screenshots, saved photos, memes, GIFs, and videos. They all have their place, but the clutter gets in the way when you want to see or show photos you ve actually clicked with your iPhone s camera . As it happens, iOS 27 adds a new feature called \"Captured By Me\" that only filters photos and videos you ve shot yourself. If you go to the Collections tab, you ll find a new Captured By Me section in Utilities . You can also activate this when browsing photos in Library using the Filter button. Hide photos of an ex from showing up in Memories Credit: Khamosh Pathak Apple s Photos suggestions are so good, I let the app handle the images that show up on my iPhone and Apple Watch's wallpaper, along with a widget on my iPhone's Home Screen. But suggestions are only as good as your curation. The last thing you want is to see a photo of your ex (or an ex-friend) when you re trying to get through emails in the morning. If you don t want to see a person too often, open their photo, tap the Menu button ", "date_str": "2026-10-01T20:30:00+00:00", "hash": "2b6d83e41d3d6447", "title_fa": "10 هک «عکس‌های» اپل که هر کاربر آیفون باید بداند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. برنامه Photos اپل چیزی بیش از یک رول دوربین ساده است که تمام فضای ذخیره سازی iCloud شما را می خورد. برخلاف تصور رایج، می‌توانید برنامه را سفارشی کنید تا پیدا کردن عکس‌ها و ویدیوهای مورد نظرتان را آسان‌تر کند، در حالی که ویژگی‌های پنهان به شما کمک می‌کنند تا فضای ذخیره‌سازی خود را تمیز کنید و مجموعه رسانه‌های خود را مرتب نگه دارید. اگر آیفون دارید، این 10 هک ضروری است. iPhone 18 Pro 1,199.00 دلار در Apple Shop اکنون خرید کنید 1,199.00 دلار در Apple iPhone 18 Pro Max 1,299.00 دلار در Apple Shop Now اکنون خرید کنید 1,299.00 دلار در Apple iPhone Duo 1,999.00 دلار در Apple iPhone Duo پیش خرید کنید. در صفحه مجموعه ها نشان داده شده است اعتبار: خاموش پاتک برگه مجموعه ها در برنامه عکس ها به طور خودکار مرتب می شود و عکس ها، خاطرات و حلقه های برجسته را به شما نشان می دهد. متأسفانه، روشی که اپل سفارش می دهد کمی آشفته است. نکته اینجاست که Photos دسته‌بندی‌ها و میانبرهای مفید زیادی برای دسترسی سریع به رسانه‌ها دارد، مانند عکس‌های صفحه، آلبوم‌های سفارشی و ابزارهایی مانند پوشه پنهان. به این ترتیب، باید برگه مجموعه‌ها را دوباره ترتیب دهید تا برای شما بهتر کار کند. روی دکمه منو در بالای برگه مجموعه ها ضربه بزنید و ترتیب مجدد را انتخاب کنید. توصیه من این است که مجموعه های Utilities و Media Types را به بالاترین سطح خود برسانید، زیرا آنها به عنوان میانبرهای مفید عمل می کنند. از \"Captured By Me\" برای مخفی کردن اسکرین شات ها و عکس های ذخیره شده استفاده کنید اگر شما هم مانند من هستید، رول دوربین شما با تعداد زیادی اسکرین شات، عکس های ذخیره شده، میم ها، GIF ها و ویدئوها پر شده"}, {"source": "Lifehacker", "title": "Why You Shouldn't Expect a Tiny Kindle Any Time Soon", "link": "https://lifehacker.com/tech/dont-expect-tiny-kindle-soon?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Earlier this week , I commented that the recent boom in tiny e-readers I'm talking about those credit card-sized, Chinese-made e-ink devices that have become all the rage on BookTok and Reddit was the most interesting thing to happen to the market in years. From the Xteink X4 Pro to the forthcoming Boox Picco , these wee little guys, which are small enough to slip into any pocket, have gathered a cult following of readers who prize ultra-portability above all else. Today's announcement of a redesigned line of Kindles didn't do anything to change that opinion. Setting aside the additional reveal of long-requested accessories like a Bluetooth page-turn remote and a charging dock , these new Kindles mostly deliver the same familiar Amazon e-reader experience in a slightly more refined package. And if you were hoping Amazon might hop on the bandwagon with a tiny e-reader of its own or even a phone-shaped e-reader like the Boox Palma well, I wouldn't hold your breath. Amazon Kindle 16GB $149.99 at Amazon Shop Now Shop Now $149.99 at Amazon Xteink X4 Pro 4.3-Inch Pocket E-Reader $99.00 at Amazon Get Deal Get Deal $99.00 at Amazon SEE -1 MORE Yesterday, Amazon invited other journalists and me to the company's New York City headquarters to check out the new Kindles , and during our talk with Kevin Keith, vice president of the Kindle team, we asked him if the company has been monitoring the pocket e-reader trend, and if it would ever make a Kindle with a screen smaller than the standard six inches. His response didn't surprise me at all. \"Our answer to that is, I think [ the basic Kindle ] when you're at 140 grams, and you're this lightweight, you can carry it almost anywhere. I carry these in my pocket. In your bag, you're not even going to know it's there,\" Keith said. \"I think that's first and foremost what I'd say.\" That is, Amazon already thinks the six-inch device is plenty small enough for most readers, and as a company, Amazon is generally targeting most readers. The tiny e-reader audience is \"a very vocal group of people,\" he added, \"but I don't know how big that group of people is.\" While it's monitoring the chatter around devices like the Palma or even smaller options like the X4 Pro, for Amazon, the existing entry-level Kindle is \"a really good format,\" Keith said. \"Getting to four or five inches, I think there's just a lot of compromises there that you have to make. The core answer is just making a bett", "date_str": "2026-10-01T19:54:10+00:00", "hash": "ee0b9bab61060abb", "title_fa": "چرا نباید به این زودی منتظر یک کیندل کوچک باشید؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اوایل این هفته، من اظهار نظر کردم که رونق اخیر در کتاب‌خوان‌های الکترونیکی کوچکی که درباره آن دستگاه‌های جوهر الکترونیکی با اندازه کارت اعتباری و ساخت چین صحبت می‌کنم که در BookTok و Reddit بسیار محبوب شده‌اند، جالب‌ترین اتفاقی بود که در سال‌های اخیر در بازار رخ داده است. از Xteink X4 Pro گرفته تا Boox Picco آینده، این بچه‌های کوچک که به اندازه کافی کوچک هستند تا در هر جیبی قرار بگیرند، پیروانی از خوانندگانی را جمع‌آوری کرده‌اند که بیش از هر چیز دیگری را به حمل‌ونقل فوق‌العاده می‌دهند. اعلام امروز یک خط بازطراحی شده کیندل چیزی برای تغییر این نظر انجام نداد. این کیندل‌های جدید با کنار گذاشتن نمایان شدن لوازم جانبی طولانی‌مدت درخواستی مانند کنترل از راه دور بلوتوث و پایه شارژ، همان تجربه آشنای کتابخوان الکترونیکی آمازون را در بسته‌بندی کمی اصلاح‌شده‌تر ارائه می‌کنند. و اگر امیدوار بودید که آمازون بتواند با یک کتابخوان الکترونیکی کوچک خودش یا حتی یک کتابخوان الکترونیکی به شکل تلفن مانند Boox Palma خوب راه بیفتد، من نفس شما را حبس نمی کردم. Amazon Kindle 16GB 149.99 دلار در آمازون خرید اکنون خرید 149.99 دلار در Amazon Xteink X4 Pro 4.3-Inch Pocket E-Reader 99.00 دلار در آمازون دریافت معامله دریافت معامله 99.00 دلار در آمازون SEE -1 بیشتر دیروز، آمازون و روزنامه نگاران جدید New York و من و روزنامه نگاران جدید New York را به شرکت دعوت کردند. طی صحبتی که با کوین کیث، معاون تیم Kindle داشتیم، از او پرسیدیم که آیا این شرکت روند کتابخوان های الکترونیکی جیبی را زیر نظر دارد و آیا هرگز کیندلی با صفحه نمایش کوچکتر از شش اینچ استاندارد تولید خواهد کرد. پاسخ او اصلاً من را شگفت زده نکرد. کیت گفت: \"پاسخ ما به آن این است، من فکر می‌کنم [کیندل"}, {"source": "Lifehacker", "title": "Amazon Prime Members Can Get Two Free E-Books in October", "link": "https://lifehacker.com/free-kindle-books-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. You can get thousands of free e-books over the course of 2026 if you know where and when to look. All year long, Amazon is offering free Kindle e-books to readers, with new opportunities popping up every month. In October, Prime members can get two free Kindle e-books from Amazon's First Reads program. What is Amazon's First Reads program? Amazon First Reads is a program aimed at Prime members that offers early access to new e-books across many genres, as curated by First Reads editors (one of many Prime Member benefits ). Prime members can choose to download one free e-book every month from a rotating list though some months that number is bumped up to two, usually with a free short novel and non-members get them for a discounted price. These e-books can be read on any compatible Kindle device or via the free Kindle app. Amazon Kindle (16 GB) Lightest and most compact Kindle, now with faster page turns, and higher contrast ratio. $149.99 at Amazon Shop Now Shop Now $149.99 at Amazon How to get your free Amazon Kindle e-books in October Go to the First Reads landing page to see the full list of e-books available this month. Once you find a book that seems interesting, click the \"Shop Now\" button from the First Reads landing page. Make sure you re not being redirected to the Kindle or Amazon mobile application, because you won't see the free book option there; instead, use your internet browser on your phone or computer. Make sure you re not clicking the Pre-order for... button, as that will direct you to pay; instead, click the Read for Free or the \"Buy Now with 1-Click\" button under the \"First Reads\" banner on the book's Amazon page (don't worry, you won't be charged). This will send the e-book directly to the Kindle linked to your Amazon account. You can see what it should look like from the screenshot below. Credit: Daniel Oropeza You ll know you did it right when you see a Thanks, [your name]! order summary indicating the e-book is being auto-delivered to the Kindle Cloud Reader. Free Amazon Kindle e-books available in October 2026 This month, you can choose one from 10 new Kindle e-books, including this month's short read . Amazon notes the genre for each of the books above the title, offering a quick way to narrow down your options. (If you hover over the \"See Editor Notes\" under the \"Shop Now\" button, you'll be able to read a ", "date_str": "2026-10-01T19:30:00+00:00", "hash": "b5ad5dd4fee2a314", "title_fa": "اعضای پرایم آمازون می توانند در ماه اکتبر دو کتاب الکترونیکی رایگان دریافت کنند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اگر بدانید کجا و چه زمانی باید جستجو کنید، می‌توانید هزاران کتاب الکترونیکی رایگان در طول سال 2026 دریافت کنید. در تمام طول سال، آمازون کتاب‌های الکترونیکی رایگان Kindle را با فرصت‌های جدید هر ماه به خوانندگان ارائه می‌کند. در ماه اکتبر، اعضای Prime می توانند دو کتاب الکترونیکی رایگان Kindle را از برنامه First Reads آمازون دریافت کنند. برنامه First Reads آمازون چیست؟ Amazon First Reads برنامه‌ای با هدف اعضای Prime است که دسترسی زودهنگام به کتاب‌های الکترونیکی جدید را در بسیاری از ژانرها ارائه می‌کند، همانطور که توسط ویراستاران First Reads (یکی از مزایای متعدد Prime Member) تنظیم شده است. اعضای Prime می‌توانند هر ماه یک کتاب الکترونیکی رایگان را از فهرست چرخشی دانلود کنند، اگرچه در برخی از ماه‌ها این تعداد به دو عدد افزایش می‌یابد، معمولاً با یک رمان کوتاه رایگان و غیرعضوها آنها را با قیمتی با تخفیف دریافت می‌کنند. این کتاب‌های الکترونیکی را می‌توان در هر دستگاه کیندل سازگار یا از طریق برنامه رایگان Kindle خواند. Amazon Kindle (16 گیگابایت) سبک‌ترین و فشرده‌ترین کیندل، اکنون با چرخش سریع‌تر صفحه و نسب ید بسازید. این ماشین چمن زنی 48 ولتی Greenworks دارای 31 درصد تخفیف است، اگر می خواهید شبیه یک فرد عاقل و مسئولیت پذیر در آنجا به نظر برسند، چمن ها نیاز به مراقبت های تکان دهنده ای دارند، که یک ماشین چمن زنی جامد را به یک قطعه ضروری از تجهیزات فضای باز تبدیل می کند. مدل 48 ولتی 20 اینچی Greenworks فوق‌العاده بی‌صدا است، بنابراین شما همسایه‌ها را آزار نمی‌دهید، حتی اگر دوست دارید صبح‌ها قبل از گرم شدن هوا چمن‌زنی کنید، باتری‌های دوتایی با یک بار شارژ از حیاط‌های متوسط ​​عبور می‌کنند و با فشار دادن یک دکمه شروع می‌شود. با 31٪ تخفیف، یک برد-برد است و اگر حیاط کوچکتری دارید، می توانید حتی کمتر برای نسخه 17 اینچی خرج کنید که 32٪ تخفیف دارد. Greenworks 48 ولت (2 x 24 ولت) 20 اینچ بدون برس شارژی (فشار) چمن زنی (چراغ جلو LED)، (2) باتری 4.0Ah و شارژر سریع دو پورت (125+ ابزار سازگار) 329.98 دلار در آمازون. 479.99 دلار آمازون. 479.99 دلار صرفه جویی 150.01 دلار Greenworks 2 x 24V (48V) 17 اینچی چمن زنی شارژی 259.98"}, {"source": "Lifehacker", "title": "I Tried the Pixel Watch's New 'Health Guardian,' and I'm Not Convinced It's Useful", "link": "https://lifehacker.com/health/pixel-watches-new-health-features?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Google s Health Guardian feature set has rolled out to Pixel Watches 3, 4, and 5 this week and will be coming to Fitbit Air users later this year. Google says the new features include reports on your blood pressure trends and on insulin resistance, which is a big claim for a wearable. Here s what we know about Health Guardian, including how to set it up and what to expect. Google Pixel Watch 5 (41mm) - Android Smartwatch - Obsidian - LTE $499.99 at Amazon Learn More Learn More $499.99 at Amazon Can you really measure insulin resistance with a wearable? Credit: Beth Skwarecki Insulin resistance is associated with type 2 diabetes, and can be an early sign that you are heading toward pre-diabetes or diabetes. When your body s insulin receptors stop responding as strongly to insulin, you re more likely to have higher blood glucose. Insulin resistance is normally measured with bloodwork. For example, your fasting glucose levels and fasting insulin are combined into a score called HOMA-IR. If you re concerned about insulin resistance or pre-diabetes, it s best to talk to an actual healthcare professional to find out what tests they recommend, and what to do with the results. The insulin resistance feature coming to Google Health is, Google notes, not intended for medical purposes and not a pre-screener for diabetes. Google published a paper describing some of the testing that went into developing its insulin resistance algorithm. In the study, the researchers had people use their own Fitbits or Pixel Watches to record a variety of metrics, including heart rate, HRV, and activity. It s not clear from this paper exactly how the algorithm works or whether it s likely to be useful in a general population, but apparently Google is betting on it being an interesting factor to track in your Google Health app. Can you really measure blood pressure with a wearable? Credit: Beth Skwarecki Google also published a paper on a blood pressure algorithm, although it is not peer-reviewed. Instead of explaining how the algorithm works, it describes how the researchers tried to figure out what their AI-based model might be looking at. According to this paper, Google's model works about as well as clinical blood pressure measurements, but it's not clear how useful it would be in the real world. For example, the study excluded people with heart disease, but I'd imagine plenty of people with heart disease would be interested in their ", "date_str": "2026-10-01T17:30:00+00:00", "hash": "a0361b783704745d", "title_fa": "من «نگهبان سلامت» جدید پیکسل واچ را امتحان کردم و مطمئن نیستم مفید باشد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. مجموعه ویژگی‌های Health Guardian Google در این هفته برای Pixel Watches 3، 4 و 5 عرضه شده است و اواخر امسال برای کاربران Fitbit Air عرضه خواهد شد. گوگل می گوید که ویژگی های جدید شامل گزارش هایی در مورد روند فشار خون و مقاومت به انسولین است که ادعای بزرگی برای یک پوشیدنی است. در اینجا آنچه ما در مورد Health Guardian می دانیم، از جمله نحوه تنظیم آن و آنچه باید انتظار داشته باشیم، آورده شده است. Google Pixel Watch 5 (41mm) - Android Smartwatch - Obsidian - LTE 499.99 دلار در آمازون بیشتر بدانید 499.99 دلار در آمازون آیا واقعاً می توانید مقاومت به انسولین را با یک ابزار پوشیدنی اندازه گیری کنید؟ اعتبار: مقاومت به انسولین Beth Skwarecki با دیابت نوع 2 مرتبط است و می تواند نشانه اولیه ای باشد که شما به سمت پیش دیابت یا دیابت می روید. هنگامی که گیرنده های انسولین بدن شما به شدت به انسولین پاسخ نمی دهند، احتمال افزایش گلوکز خون شما افزایش می یابد. مقاومت به انسولین معمولاً با آزمایش خون اندازه گیری می شود. به عنوان مثال، سطح گلوکز ناشتا و انسولین ناشتا در نمره ای به نام HOMA-IR ترکیب می شوند. اگر نگران مقاومت به انسولین یا پیش دیابت هستید، بهتر است با یک متخصص مراقبت های بهداشتی واقعی صحبت کنید تا دریابید که آنها چه آزمایشاتی را توصیه می کنند و با نتایج چه باید کرد. به گفته گوگل، ویژگی مقاومت به انسولین که در Google Health ارائه می شود، برای مقاصد پزشکی در نظر گرفته نشده است و یک پیش نمایشگر برای دیابت نیست. گوگل مقاله‌ای منتشر کرد که در آن برخی از آزمایش‌هایی که برای توسعه الگوریتم مقاومت به انسولین انجام شد، توضیح داد. در این مطالعه، محققان از افراد خواستند"}, {"source": "Lifehacker", "title": "10 Shows Like 'Crew Girl' You Should Watch Next", "link": "https://lifehacker.com/entertainment/best-shows-like-crew-girl?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Sports, romance, and the drama of starting over: Netflix's Crew Girl has it all, or at least everything you could ask for in a coming-of-age YA drama. Miku Martineau ( Bet , The Miniature Wife ) stars as Teagan Tao, a champion rower who flees a family scandal with her mother and ends up at a private school but the school has no girls' rowing program, so, despite a lack of experience, she signs on as a coxswain on the boys' team, intending to show 'em all how it's done (while also managing a teen love triangle for the ages). If you're looking for more angsty teen dramas some also with a sporty edge try these other shows. Finding Her Edge (2026 ) Another coming-of-age sports drama, this one shares with Crew Girl not just a Canadian origin but an executive producer in Jeff Norton. Oh, and also a love triangle this time involving ice dancing partners. Madelyn Keys is Adriana Russo, scion of a family of competitive ice skaters fallen on hard times. Adriana and her sister hope to reclaim past glory, but things are complicated by her developing feelings for her new skating partner, Brayden, as well as reawakening feelings for her ex-boyfriend, now a competitor. Stream Finding Her Edge on Netflix. Finding Her Edge (2026 ) at Netflix Learn More Learn More at Netflix The Summer I Turned Pretty (2022 2025) Less about sports, but nevertheless one of streaming's most compelling teen love triangles. And it takes place near water, so I'm counting it. Adapted from the trilogy of YA bestsellers by Jenny Han, this series focuses on the coming-of-age of teenager Belly Conklin (Lola Tung), who is 16 as the series starts. Belly and her family spend every summer at Cousins Beach with the Fisher family, a tradition that's all well and good until she starts to develop a romantic attraction for first one Fisher brother (Christopher Briney), and then the other (Gavin Casalegno), planting the seeds for a love triangle that unfolds over the course of several summers, and which sees Belly grow into young adulthood to a soundtrack made up largely of Taylor Swift tunes. The three-season run is over, but there's a continuation movie on the way. Stream The Summer I Turned Pretty on Prime Video. The Summer I Turned Pretty (2022 2025) at Prime Video Learn More Learn More at Prime Video Gossip Girl (2007 2012) Crew Girl co-star Thomas Cadrot (Coach Hayden) described the show as \" Gossip Girl and Friday Night Lights on a boat,\" so our next cou", "date_str": "2026-10-01T16:30:00+00:00", "hash": "fd6423223fa88f8a", "title_fa": "10 نمایش مانند «دختر خدمه» که باید در ادامه تماشا کنید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. ورزش، عاشقانه، و درام شروع دوباره: دختر خدمه نتفلیکس همه چیز را دارد، یا حداقل هر چیزی را که می‌توانید در یک درام YA در دوران بلوغ بخواهید، دارد. میکو مارتینو (بت، همسر مینیاتوری) در نقش تیگان تائو، یک قهرمان قایقران که از یک رسوایی خانوادگی با مادرش فرار می‌کند و به یک مدرسه خصوصی می‌گریزد، اما مدرسه برنامه قایقرانی دخترانه ندارد، بنابراین، علی‌رغم فقدان تجربه، او به‌عنوان یک قایق‌ران در تیم پسران ثبت‌نام می‌کند و قصد دارد نشان دهد که چگونه این کار را انجام داده است. اعصار). اگر به دنبال درام‌های نوجوانانه‌تر خشمگین هستید، برخی از آن‌ها نیز با حاشیه‌های ورزشی، این نمایش‌های دیگر را امتحان کنید. Finding Her Edge (2026) یکی دیگر از درام‌های ورزشی دوران بلوغ، این درام با Crew Girl نه تنها اصالتاً کانادایی بلکه یک تهیه‌کننده اجرایی در جف نورتون است. اوه، و همچنین یک مثلث عشقی این بار شامل شرکای رقص روی یخ. Madelyn Keys آدریانا روسو، فرزند خانواده ای از اسکیت بازان رقابتی است که در روزهای سخت سقوط کرده اند. آدریانا و خواهرش امیدوارند که شکوه گذشته را به دست آورند، اما همه چیز به دلیل رشد احساسات او نسبت به شریک اسکیت جدیدش، برایدن، و همچنین بیدار شدن دوباره احساسات نسبت به دوست پسر سابقش که اکنون یک رقیب است، پیچیده می شود. Finding Her Edge را در نتفلیکس پخش کنید. Finding Her Edge (2026 ) در Netflix بیشتر بدانید در Netflix بیشتر بدانید تابستان زیبا شدم (2022 2025) کمتر در مورد ورزش است، اما با این وجود یکی از متقاعد کننده ترین مثلث های عاشقانه نوجوانان است. و در نزدیکی آب اتفاق می افتد، بنابراین من آن را می شمارم. این سریال برگرفته از سه گانه پرفروش‌های YA توسط جنی هان، بر روی سن بلوغ نوجوانی به نام"}, {"source": "Lifehacker", "title": "You Could Lose Your Access to 'Old Reddit' Forever, but There's a Workaround", "link": "https://lifehacker.com/tech/how-to-keep-your-access-to-old-reddit?utm_medium=RSS", "summary": "\"Old Reddit\" is the only way I use Reddit. That's not the case for most of the tech in my life. I don't make a point of only using an iPhone from a decade ago, or avoid playing video games with more than 64 bits. But, in my view, Old Reddit is the only proper way to use the website. While \"new\" Reddit has more \"features,\" it's bloated and slow. Old Reddit might be extremely basic, and looks about the same as it did when I first started \"redditing,\" but it works. Unfortunately, most of us likely won't be able to experience Old Reddit for much longer. On Wednesday, Reddit announced a series of infrastructure changes on its r/modnews subreddit. Normally, these updates wouldn't make tech headlines I can't say Reddit \"mod news\" often finds its way into my feeds. But as part of these changes, Reddit confirmed a rather massive deprecation: Users will lose access to Old Reddit unless they've used the platform sometime in the last six months. It's not enough to use Reddit itself, mind you: Unless you use Old Reddit at least once in a six-month period, you'll lose access for good. This builds on a previous Old Reddit change the company rolled out over the summer, which requires users to be logged in in order to access this version of Reddit. While we don't have a true deadline for when these new changes take effect, the new announcement makes it clear that, \"in the next few months, we ll further limit access for logged-in users to only those who have used Old Reddit in the last six months (which covers the vast majority of all Old Reddit users). The only exception is for moderators. Why is Reddit going after Old Reddit? According to Reddit, these changes are designed to prevent abuse on its platform. By forcing users to log in to use Old Reddit, the company says it prevents unauthenticated access, its \"largest source of abusive scraping and automated traffic.\" By blocking accounts that haven't accessed Old Reddit in the past six months, Reddit says it's solving another problem: Now, bad actors won't be able to make Reddit accounts for the sole purpose of accessing (and scraping) Old Reddit and its content. In Reddit's view, these changes don't affect Old Reddit users. If you rely on Old Reddit, the company thinks you'll be using it frequently enough to bypass these new rules. As such, Reddit believes the vast majority of affected users will only be those trying to abuse Old Reddit, not those who actively use it. The problem is, not everyone who uses Old Reddit is so", "date_str": "2026-10-01T16:00:50+00:00", "hash": "1b7749692eeee738", "title_fa": "ممکن است برای همیشه دسترسی خود را به \"Old Reddit\" از دست بدهید، اما یک راه حل وجود دارد", "summary_fa": "\"Old Reddit\" تنها راهی است که من از Reddit استفاده می کنم. این در مورد بیشتر فناوری های زندگی من صدق نمی کند. من فقط از یک آیفون یک دهه پیش استفاده نمی کنم یا از بازی های ویدیویی با بیش از 64 بیت اجتناب می کنم. اما، به نظر من، Old Reddit تنها راه مناسب برای استفاده از وب سایت است. در حالی که Reddit \"جدید\" دارای \"ویژگی های\" بیشتری است، اما پف کرده و کند است. Reddit قدیمی ممکن است بسیار ابتدایی باشد، و تقریباً مشابه زمانی است که من برای اولین بار \"redditing\" را شروع کردم، اما کار می کند. متأسفانه، بسیاری از ما به احتمال زیاد نمی توانیم Old Reddit را برای مدت طولانی تری تجربه کنیم. روز چهارشنبه، Reddit یک سری تغییرات زیرساختی را در ساب ردیت r/modnews خود اعلام کرد. به طور معمول، این به‌روزرسانی‌ها به سرفصل‌های فناوری تبدیل نمی‌شوند. اما به عنوان بخشی از این تغییرات، Reddit یک انکار نسبتاً گسترده را تأیید کرد: کاربران دسترسی به Old Reddit را از دست خواهند داد مگر اینکه در شش ماه گذشته از این پلتفرم استفاده کرده باشند. استفاده از Reddit کافی نیست، توجه داشته باشید: اگر حداقل یک بار در یک دوره شش ماهه از Reddit قدیمی استفاده نکنید، برای همیشه دسترسی را از دست خواهید داد. این بر اساس تغییر قبلی قدیمی Reddit است که شرکت در تابستان ارائه کرده بود، که برای دسترسی به این نسخه از Reddit نیاز به ورود به سیستم دارد. در حالی که ما ضرب الاجل واقعی برای اعمال این تغییرات جدید نداریم، اطلاعیه جدید به وضوح نشان می دهد که \"در چند ماه آینده، دسترسی کاربرانی که وارد سیستم شده اند را فقط به کسانی محدود خواهیم کرد که در شش ماه گذشته از Old Reddit استفاده کرده اند (که اکثریت قریب به اتفاق همه کاربران Old"}, {"source": "Lifehacker", "title": "Amazon Just Released New Kindles, but I'm More Excited About the Accessories", "link": "https://lifehacker.com/tech/amazon-just-released-new-kindles-and-accessories?utm_medium=RSS", "summary": "We may earn a commission from links on this page. When Amazon raised the prices of most of its Kindle devices last month some by more than 30% it looked like a reaction to the ongoing RAM crisis, but it may have also have been a bit of clever timing: Today, the company has announced a near-total overhaul of its line of e-readers , which are now thinner, lighter, faster, and more thoughtfully designed than ever, and as we've all already absorbed the price hike, there's no bitter pill to swallow alongside the news. Certainly, the new Kindles are lovely devices: The entire lineup, from the $150 entry-level Kindle to the $319 Kindle Colorsoft Signature Edition, now features a new flush-front design. An upgraded standard Kindle and the pricier Signature Editions now have an aluminium back, giving them a premium feel and allowing for a new line of magnetic accessories. Yesterday, Amazon invited Lifehacker and a number of other tech sites to its headquarters to check out the new lineup, and while I can say that these are easily the prettiest Kindles ever available in a number of trendy new colors they are also still mostly just Kindles: improved, to be sure, but not really new . That's why I'm more excited by the accompanying lineup of accessories, including a case with integrated physical buttons and, at long last, a Bluetooth page-turner remote. The standard Kindle now feels more premium Amazon Kindle 16GB $149.99 at Amazon Shop Now Shop Now $149.99 at Amazon Amazon Kids Kindle 16GB $179.99 at Amazon Shop Now Shop Now $179.99 ": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. اگر برخی از کارهای پاییزی DIY برای انجام دادن دارید، یک مجموعه خوب از ابزارهای بی سیم ضروری است. اما ممکن است متوجه شده باشید که قیمت ابزارها بالا رفته است و ممکن است انجام لیست کارهایتان با بودجه سخت باشد. اکتبر Prime Day اغلب رقبا را تشویق می کند تا معاملات خود را ارائه دهند، و Home Depot برخی از ابزارهای خود را تا 50٪ در طول فروش پاییز خود کاهش داده است. در اینجا برخی از بهترین معاملات موجود در حال حاضر وجود دارد. بهترین معاملات در مورد مجموعه ابزارهای بی سیم در Home Depot یک مجموعه ابزار بی سیم می تواند راه خوبی برای صرفه جویی در هزینه شما باشد. اگر قصد دارید تعمیراتی انجام دهید، مانند تعویض تخته نرده یا تعمیر نرده ها، یا برای پروژه های نجاری DIY، مجموعه ای از ابزارهای بی سیم یک تغییر دهنده بازی هستند. مجموعه ابزار بی سیم 18 ولتی 8 ابزار Milwaukee با قیمت 649 دلار به فروش می رسد که 50 درصد از قیمت معمولی آن تخفیف دارد. این مجموعه دارای یک دریل، یک درایور ضربه ای، یک آچار ضربه ای اینچی، یک اره رفت و برگشتی، یک چرخ زاویه ای، یک ابزار چندگانه نوسانی، یک اره مدور، یک چراغ کار، دو باتری 4 آمپر ساعتی، یک شارژر و یک کیف ابزار می باشد. بهترین پیشنهادات در مورد چرخ‌های برقی و آچار ضربه‌ای در Home Depot جغجغه‌های برقی و آچار ضربه‌ای برای چرخاندن مهره‌ها برای تعمیر و نگهداری خودرو یا تعمیر و نگهداری لوازم خانگی مفید هستند. آنها همچنین می توانند به شکستن پیچ سرسختی که گرفته شده است کمک کنند. در اینجا برخی از بهترین معاملات در مورد ضامن و آچار برقی"}],
      media: [{"source": "Billboard", "title": "Sienna Spiro: Photos From the Billboard Shoot", "link": "https://www.billboard.com/photos/sienna-spiro-photos-billboard-shoot-1236350401/", "summary": "Sienna Spiro always beats Omer Fedi to the studio. “I’m usually pretty early — I’ve never gotten there before her,” the hitmaking producer tells Billboard with a laugh. “She’s always there on the piano, like, ‘OK, I have a song.’ The best stuff that we’ve made together is stuff that she basically comes to the studio with the song 99% done.” So, when Fedi arrived at New York’s Electric Lady Studios for one of the rising English singer–songwriter’s last sessions for her debut album, Visitor , she greeted him — with the idea, hook and chords for single “Great Expectation” ready to go. “She said, ‘Oh, I had this idea. What do you think?’ ” he recalls, still in awe. “[She] did it all alone, sounding amazing.” This is a side of Spiro with which the public — knowing her more as an incredible vocalist than anything else — isn’t as familiar. But at just 20 years old, she’s completely in control of her artistry, down to every word she sings. The London native was just a teenager when a TikTok of her singing Finneas’ “Break My Heart Again” yielded an immediate influx of interested managers and, soon afterward, label offers. Since partnering with Miriam Maslin at Method Music for management and inking a deal with Capitol Records, she’s established herself as one of Gen Z’s most gifted performers — and has proved her hitmaking capabilities. By early 2026, Spiro had made her first appearance on the Billboard Hot 100 with her breakout single, “Die on This Hill,” which went on to peak at No. 19. (Meanwhile, since its July debut, “Great Expectation” has been climbing the Hot 100, and it recently made Spiro the youngest British female artist to score a U.K. No. 1 in 12 years.) And yes, she really does write all of her own songs. Read the full Sienna Spiro story here .", "date_str": "2026-10-02T14:00:02+00:00", "hash": "aabcb6155927003a", "title_fa": "Sienna Spiro: Photos from the Billboard Shoot", "summary_fa": "سینا اسپیرو همیشه عمر فدی را در استودیو شکست می دهد. تهیه‌کننده موفق با خنده به بیلبورد می‌گوید: «من معمولاً خیلی زود هستم – هرگز قبل از او به آنجا نرسیده‌ام. او همیشه روی پیانو حاضر است، مثلاً، «باشه، من یک آهنگ دارم.» بهترین چیزهایی که با هم ساخته‌ایم چیزهایی است که او اساساً با آهنگی که ۹۹ درصد آن را انجام داده به استودیو می‌آید.» بنابراین، هنگامی که فدی برای یکی از آخرین جلسات خواننده و ترانه سرای انگلیسی در حال رشد برای اولین آلبوم خود، بازدید کننده، به استودیو الکتریک لیدی نیویورک رسید، با او احوالپرسی کرد – با ایده، قلاب و آکورد برای تک آهنگ «انتظار بزرگ» آماده انتشار. او همچنان در حیرت به یاد می آورد: \"او گفت: \"اوه، من این ایده را داشتم. شما چه فکر می کنید؟\" \"[او] این کار را به تنهایی انجام داد، به نظر شگفت انگیز است.\" این جنبه ای از اسپیرو است که عموم مردم - که او را بیش از هر چیز دیگری به عنوان یک خواننده باورنکردنی می شناسند - آنقدرها با آن آشنا نیستند. اما تنها در 20 سالگی، او کاملاً کنترل هنر خود را دارد، تا هر کلمه ای که می خواند. این بومی لندن نوجوانی بیش نبود که تیک‌تاک از آهنگ «دوباره قلبم را بشکن» از فینیاس، هجوم فوری مدیران علاقه‌مند را به همراه داشت و بلافاصله پس از آن، پیشنهادهایی برای لیبل‌ها ارائه شد. از زمان همکاری با میریام مازلین در متد موزیک برای مدیریت و عقد قرارداد با Capitol Records، او خود را به عنوان یکی از بااستعدادترین مجریان Gen Z تثبیت کرد - و توانایی های خود را در آهنگسازی ثابت کرد. در اوایل سال 2026، اسپیرو اولین حضور خود را در بیلبورد Hot 100 با تک‌آهنگ فراگیر خود، «Die on This Hill» داشت، که در نهایت به رتبه 19 رسید. (در"}, {"source": "Billboard", "title": "Press Play on LISA’s New Highly Limited PlayStation Controller Designed With the Star’s Input", "link": "https://www.billboard.com/culture/product-recommendations/lisa-playstation-controller-limited-edition-shop-online-1236352092/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. LISA is pushing buttons on a whole new kind of release. As the BLACKPINK star gears up for her new EP, PRESS PLAY, out Oct. 23 , featuring the lead single SaWaDiKa, she s bringing that same energy from the music world into gaming with a fun PlayStation collab. The partnership, which follows LISA and the gaming brand s first team-up since the global PS5 campaign last year, now expands into an all-new limited-edition DualSense wireless controller and a merchandise collection designed with LISA s help. Gaming is something I do whenever I have time to relax, so getting to create this collection with PlayStation was very exciting, LISA said of the collab. I had a lot of fun adding in little details that I knew my fans would notice, and I wanted the fans to have something they can connect with. The LISA limited-edition controller arrives Oct. 30 in limited quantities, while the accompanying merch collection launches Oct. 23 with apparel, hats, tote bags, keychains, stickers and more. Both the controller and select merchandise will be available for preorder beginning Oct. 2 at 10:00 a.m. local time through PlayStation and LISA s official Amazon store . LIMITED EDITION PlayStation DualSense Wireless Controller LISA Limited Edition Preorder $84 Buy Now at playstation $84 Buy Now at amazon HOODIE LISA x PlayStation Oversized Hoodie Preorder $120 Buy Now at playstation $120 Buy Now at amazon TOTE LISA x PlayStation Graphic Tote Bag Preorder $55 Buy Now at playstation $55 Buy Now at amazon GRAPHIC TEE LISA x PlayStation Oversized Graphic Tee Preorder $45 Buy Now at playstation $45 Buy Now at amazon shop full Lisa x PlayStation merch collection here PlayStation For fans in the U.K., France, Germany, Austria, Spain, Portugal, Italy, the Netherlands, Belgium and Luxembourg, preorders for the LISA Limited Edition DualSense wireless controller will also open Oct. 2 at 10:00 a.m. local time through PlayStation s online store . Quantities are limited, so fans will want to press play as soon as preorders go live. LISA is set to release her new EP, PRESS PLAY, on Oct. 23, following her 2025 solo debut album, Alter Ego, which was No. 1 on Billboard s Top Album Sales chart. She previously launched her solo career with the 2021 single album LALISA,", "date_str": "2026-10-02T14:00:00+00:00", "hash": "870389378ad6e7e7", "title_fa": "Play را روی کنترلر جدید بسیار محدود پلی استیشن LISA که با ورودی ستاره طراحی شده است فشار دهید", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. LISA در حال فشار دادن دکمه‌ها بر روی نوع جدیدی از انتشار است. همانطور که ستاره BLACKPINK برای EP جدید خود، PRESS PLAY، که در 23 اکتبر منتشر می شود، با تک آهنگ اصلی SaWaDiKa آماده می شود، او همان انرژی را از دنیای موسیقی به بازی با همکاری سرگرم کننده پلی استیشن می آورد. این همکاری که به دنبال اولین تیم LISA و این برند بازی از زمان کمپین جهانی PS5 در سال گذشته است، اکنون به یک کنترل‌کننده بی‌سیم DualSense با نسخه محدود جدید و مجموعه‌ای از کالاها که با کمک LISA طراحی شده است، گسترش می‌یابد. LISA در مورد این همکاری گفت که بازی کاری است که هر زمان که زمان استراحت داشته باشم انجام می دهم، بنابراین ایجاد این مجموعه با پلی استیشن بسیار هیجان انگیز بود. من از افزودن جزئیات کوچکی که می‌دانستم طرفدارانم متوجه آن خواهند شد بسیار لذت بردم و می‌خواستم طرفداران چیزی داشته باشند که بتوانند با آن ارتباط برقرار کنند. کنترلر نسخه محدود LISA در 30 اکتبر در تعداد محدود وارد بازار می شود، در حالی که مجموعه کالاهای همراه با پوشاک، کلاه، کیف های حمل و نقل، جاکلیدی، برچسب و موارد دیگر در 23 اکتبر عرضه می شود. هم کنترلر و هم کالای منتخب از 2 اکتبر ساعت 10 صبح برای پیش‌سفارش در دسترس خواهند بود. به وقت محلی از طریق پلی استیشن و فروشگاه رسمی آمازون LISA. نسخه محدود PlayStation DualSense Wireless Controller LISA Limited Edition پیش خرید 84 دلاری اکنون در playstation 84 دلاری بخرید هم اکنون در آمازون خرید کنید HOODIE"}, {"source": "Billboard", "title": "Mass Appeal & Whatnot Partner to Bring Hip-Hop to New York Comic Con Featuring Nas, Lauryn Hill, Busta Rhymes & More", "link": "https://www.billboard.com/culture/events/mass-appeal-whatnot-hip-hop-new-york-comic-con-nas-fugees-1236352187/", "summary": "Mass Appeal and Whatnot are merging hip-hop, comics, art, fashion, sports and collectibles at this year s New York City Comic Con. During the four-day convention, the sprawling 5,000-square-foot shopping mall-inspired Whatnot Liveplex will be the Home of Hip-Hop Collectibles featuring live shopping events, auctions, artist appearances, cultural programming and exclusive merch from Anderson .Paak Cordae , Busta Rhymes J Dilla , Nas and the Fugees . “Last year at Comic Con was a special moment for us,” Nas said in a press release. “The response to the Legend Has It panel showed how much love there is for Hip Hop, art and storytelling in that community. We’re excited to be back this year with Whatnot and share some of the new projects we’ve been creating with Marvel. Ms. Lauryn Hill will have a couple things going on during the installation. She and Wyclef Jean will commemorate the 30th anniversary of The Score with an exclusive, limited-edition superhero-inspired art print and they will be signing collectibles for fans. She also will celebrate her and Nas classic song If I Ruled the World (Imagine That) with a limited edition 30th anniversary t-shirt and hoodie. You can check out some of the other exclusive product drops below: Heavy Is The Crown: A special edition of the Marvel comic collaboration from Anderson .Paak and Cordae, sharing its title with the artists’ forthcoming album. The release features exclusive cover artwork by celebrated Japanese comic artist Peach Momoko. Courtesy of publicist Incredible Hulk #1: A new edition of the landmark 1962 comic that introduced the Hulk to the world. Its exclusive cover recreates the original issue’s iconic artwork, with Hip Hop legends Busta Rhymes and J Dilla stepping into the roles of Bruce Banner and the Hulk. Courtesy of publicist Marvel Hip Hop Covers Anniversary Set: A 10-comic collection celebrating the 10th anniversary of Marvel’s popular Hip Hop variant-cover series, which reimagined classic album artwork using Marvel superheroes. Curated by hip-hop journalist Rob Markman, the set brings back 10 fan-favorite covers with premium metallic-foil finishes and will be available exclusively through Mass Appeal live shopping streams. New York Comic Con 2026 will take place Oct. 8–11 at the Javits Center in New York City.", "date_str": "2026-10-02T14:00:00+00:00", "hash": "c124cd92abc6969c", "title_fa": "درخواست انبوه و شریک Whatnot برای آوردن هیپ هاپ به کمیک کان نیویورک با حضور Nas، Lauryn Hill، Busta Rhymes و غیره", "summary_fa": "Mass Appeal و Whatnot در حال ادغام هیپ هاپ، کمیک، هنر، مد، ورزش و آثار کلکسیونی در کامیک کان شهر نیویورک امسال هستند. در طول این کنوانسیون چهار روزه، مرکز خرید وسیع 5000 فوت مربعی با الهام از Whatnot Liveplex خانه مجموعه های هیپ هاپ با رویدادهای خرید زنده، حراج ها، حضور هنرمندان، برنامه های فرهنگی و کالاهای انحصاری از Anderson .Paak Cordae و Busta Rhymes خواهد بود. ناس در یک بیانیه مطبوعاتی گفت: «سال گذشته در Comic Con لحظه خاصی برای ما بود. \"پاسخ به پنل Legend Has It نشان داد که چقدر عشق به هیپ هاپ، هنر و داستان سرایی در آن جامعه وجود دارد. ما هیجان زده هستیم که امسال با Whatnot برمی گردیم و برخی از پروژه های جدیدی را که ایجاد کرده ایم با مارول به اشتراک می گذاریم. خانم لورین هیل در حین نصب چند اتفاق خواهد افتاد. او و وایکلف ژان سی‌امین سالگرد The Score را با یک چاپ هنری منحصر به فرد و با الهام از ابرقهرمانان گرامی می‌دارند و کلکسیون‌هایی را برای طرفداران امضا می‌کنند. او همچنین آهنگ کلاسیک خود و ناس را اگر من بر جهان حکومت کنم (تصور کن) را با یک تی شرت و هودی به مناسبت 30 سالگی جشن می گیرد. می‌توانید برخی از محصولات انحصاری دیگر را در زیر مشاهده کنید: Heavy Is The Crown: نسخه ویژه‌ای از همکاری کمیک مارول از اندرسون. Paak و Cordae، که عنوان آن را با آلبوم آینده هنرمندان به اشتراک می‌گذارد. این نسخه دارای آثار هنری روی جلد انحصاری توسط هنرمند مشهور کمیک ژاپنی هلو موموکو است. با حسن نیت از تبلیغ کننده شگفت انگیز هالک شماره 1: نسخه جدیدی از کمیک برجسته 1962 که هالک را به جهان معرفی کرد. جلد انحصاری آن آثار هنری نمادین شماره اصلی را بازسازی می‌کند و اسطوره‌های هیپ هاپ، بوستا رایمز و جی"}, {"source": "Billboard", "title": "All of Taylor Swift’s Bonus Tracks, Ranked (Staff Picks)", "link": "https://www.billboard.com/lists/taylor-swift-bonus-tracks-ranked/", "summary": "When Taylor Swift announced that her record-shattering album The Life of a Showgirl was getting four companion songs in the form of The Life of a Showgirl: The Encore , her explanation was simple. “I took a trip to Sweden to celebrate with Max [Martin] and Shellback, my two collaborators on this album,” she revealed in September 2026. “But there was a studio there and we did what we do when we feel anything at all: We wrote more songs.” One thing that can inarguably be said of Swift: She has no trouble finding songwriting inspirations. She’s not only one of today’s biggest, most awarded stars — she’s one of our most prolific, fascinating songwriters, constantly adding to a catalog that charts her evolution as an artist and human being. Since Swift gave us The Encore to celebrate, we decided to celebrate these four new Swift bonus songs by ranking all of the singer-songwriter s bonus tracks. What constitutes a bonus track? Well, we set a few parameters, which you may or may not agree with (and if you don’t, let us know). Obviously, there are songs clearly designated as bonus tracks — songs on deluxe editions are easy shoo-ins — but other releases were murkier. After some debate among the staff, we decided that the second half of The Tortured Poets Department: The Anthology does not constitute a full disc of bonus tracks; after all, Swift herself called it a “secret double album,” indicating it is one cohesive piece of art. The songs added to Midnights via Midnights (3am Edition) and Midnights (Til Dawn Edition) and Midnights (Late Night Edition) , however, do count as bonus songs. We are not including “deluxe edition” tracks that are alternate versions of songs on her studio albums, either. That means anything that’s a “piano version,” “acoustic version,” “international version” or remix isn’t included here. And for the purposes of this list, we’re only rounding up bonus tracks to Swift’s first-edition studio albums — meaning that we’re not looking at songs released on her (Taylor’s Version) re-recordings. (A project for another time, perhaps.) Plus, it probably goes without saying: This doesn’t include soundtrack songs or one-offs — after all, bonus songs have to be bonus to something. Without further ado, here’s our ranking of Taylor Swift’s bonus songs, from worst to best.", "date_str": "2026-10-02T14:00:00+00:00", "hash": "5c64a9e83200aaa2", "title_fa": "همه آهنگ‌های جایزه تیلور سویفت، رتبه‌بندی شده (انتخاب کارکنان)", "summary_fa": "وقتی تیلور سوئیفت اعلام کرد که آلبوم رکوردشکنش The Life of a Showgirl در حال دریافت چهار آهنگ همراه در قالب The Life of a Showgirl: The Encore است، توضیح او ساده بود. او در سپتامبر 2026 فاش کرد: «من سفری به سوئد داشتم تا با مکس [مارتین] و شل بک، دو همکارم در این آلبوم جشن بگیرم. اما یک استودیو آنجا بود و ما کاری را انجام می‌دادیم که هر چیزی را احساس می‌کردیم: آهنگ‌های بیشتری نوشتیم.» چیزی که می توان در مورد سوئیفت گفت: او هیچ مشکلی در یافتن الهامات ترانه سرایی ندارد. او نه تنها یکی از بزرگترین و پر جایزه ترین ستاره های امروزی است - او یکی از پرکارترین و جذاب ترین ترانه سرایان ما است که دائماً به فهرستی اضافه می کند که تکامل او را به عنوان یک هنرمند و انسان ترسیم می کند. از آنجایی که سوئیفت The Encore را به ما داد تا جشن بگیریم، تصمیم گرفتیم این چهار آهنگ جایزه جدید سوئیفت را با رتبه‌بندی تمام آهنگ‌های جایزه خواننده و ترانه‌سرا جشن بگیریم. آهنگ جایزه چیست؟ خوب، ما چند پارامتر را تنظیم می کنیم که ممکن است با آنها موافق باشید یا نباشید (و اگر موافق نیستید، به ما اطلاع دهید). بدیهی است که آهنگ‌هایی وجود دارند که به وضوح به‌عنوان آهنگ‌های جایزه تعیین شده‌اند – آهنگ‌های نسخه‌های لوکس به آسانی به دست می‌آیند – اما انتشارات دیگر تیره‌تر بودند. پس از بحث و جدل در میان کارکنان، تصمیم گرفتیم که نیمه دوم بخش شاعران شکنجه شده: گلچین یک دیسک کامل از تراک های جایزه را تشکیل نمی دهد. به هر حال، خود سوئیفت آن را «آلبوم دوگانه مخفی» نامید، که نشان می‌دهد این یک اثر هنری منسجم است. آهنگ هایی که از طریق Midnights (نسخه 3 صبح) و Midnights (نسخه تایل سپیده) و Midnights (نسخه آخر شب) به Midnights"}, {"source": "Billboard", "title": "Alexander Skarsgård Has All the Slick Moves, But No Shirt in Video For Rolling Stones’ ‘Mr. Charm’", "link": "https://www.billboard.com/music/rock/alexander-skarsgard-video-rolling-stones-mr-charm-watch-1236352896/", "summary": "If you ve ever fantasized about seeing a sweat-soaked, shirtless Alexander Skarsgård vigorously dancing in tight pants at night in front of a flaming tree, well, the Rolling Stones are here to make your dreams come true. The band dropped the video for the Foreign Tongues single Mr. Charm on Thursday (Oct. 1) and it is a feast for the eyes and senses. The Henry Scholfield-directed clip has a pretty simple premise: Skarsgård shows up to sleepy Palmdale, Calif. with his Blue Steel gaze to charm the locals and hoof his way through town. The scene opens at an old gas station, where the Pillion actor struts up in his red cowboy boots, tight black jeans, chest full of silver necklaces and fringed buckskin jacket (but, as noted above, no shirt), strikes a pose, checks his fit in the mirror and then slinks around making everyone fall in love with him. The lyrics to the classic Stones rocker say it all: I could show you places that you have never seen/ And fill your mind with images of tantalizing dreams/ And caves full of crystals shot through with pinks and greens/ And no man’s land in the Darkest Days of 1916/ Call me Mr. Charm, Mr. Charm, Mr. Charm/ Call me Mr. Charm, Mr. Charm, Mr. Charm, Mick Jagger sings. For the record, mid-way through, Skarsgård does away with pretenses and loses the shirt for a seductive, oiled-up bed dance that still fails to impress the one person in town seemingly immune to his charms, nonplussed model Sara Sampaio. Mr. Charm is the latest single from the Stones Foreign Tongues album, which debuted at No. 7 on the Billboard 200 in July. Previous videos from the album have also featured some Hollywood stars, including Anya Taylor-Joy and Charles Melton in Jealous Lover and Odessa A Zion in In the Stars. Watch the Mr. Charm video below.", "date_str": "2026-10-02T13:35:10+00:00", "hash": "ffd84547990f5fbf", "title_fa": "الکساندر اسکارسگارد تمام حرکات نرم و روان را دارد، اما هیچ پیراهنی در ویدیوی رولینگ استونز «Mr. جذابیت", "summary_fa": "اگر تا به حال در مورد دیدن یک الکساندر اسکارسگارد خیس عرق و بدون پیراهن در حال رقصیدن شدید با شلوارهای تنگ در شب در مقابل درختی شعله ور خیال پردازی کرده اید، خوب، رولینگ استونز اینجاست تا رویاهای شما را محقق کند. گروه ویدئوی تک آهنگ \"زبان های خارجی آقای جذاب\" را در روز پنجشنبه (1 اکتبر) منتشر کرد و این یک جشن برای چشم ها و حواس است. کلیپ به کارگردانی هنری شولفیلد یک پیش فرض بسیار ساده دارد: اسکارسگارد در پالمدیل خواب آلود، کالیفرنیا ظاهر می شود. با نگاه آبی فولادی خود برای مجذوب شدن مردم محلی و عبور از شهر. صحنه در یک پمپ بنزین قدیمی باز می شود، جایی که بازیگر Pillion با چکمه های کابویی قرمز، شلوار جین مشکی تنگ، سینه پر از گردنبند نقره ای و ژاکت پوست حاشیه دار (اما همانطور که در بالا اشاره شد، بدون پیراهن)، ژست می گیرد، تناسب خود را در آینه بررسی می کند و سپس همه را عاشق خود می کند. اشعار راکر کلاسیک استونز گویای همه چیز است: می‌توانم مکان‌هایی را به شما نشان دهم که هرگز ندیده‌اید/ و ذهنتان را با تصاویری از رویاهای وسوسه‌انگیز پر کنید/ و غارهای پر از کریستال‌هایی که با رنگ‌های صورتی و سبز پر شده‌اند/ و سرزمین هیچ مردی در تاریک‌ترین روزهای سال 1916/ مرا صدا بزنید آقای افسون، آقای جذابیت، آقای جذابیت، آقای جذابیت، آقای جذابیت. میک جگر آواز می خواند. برای ثبت، در اواسط راه، اسکارسگارد تظاهر را کنار می‌گذارد و پیراهن یک رقص اغواکننده و روغن‌کاری شده در رختخواب را از دست می‌دهد که هنوز نمی‌تواند فردی را در شهر که ظاهراً از جذابیت‌هایش مصون است، سارا سامپایو، مدل بی‌نظیر او را تحت تأثیر قرار دهد. Mr. Charm آخرین تک آهنگ از آلبوم Stones Foreign Tongues است که در ژوئیه در رتبه 7 بیلبورد 200 قرار"}, {"source": "Billboard", "title": "Austin City Limits 2026: Here’s Where to Watch the Three-Day Music Festival Live Online for Free", "link": "https://www.billboard.com/culture/product-recommendations/austin-city-limits-festival-2026-watch-livestream-online-free-1236352339/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. With festival season coming to an end, Austin City Limits Music Festival 2026 is one of the most-anticipated with a stellar lineup featuring headliners including Charli xcx, Skrillex, Twenty One Pilots, Lorde, The xx, Audrey Hobert , Bleachers, Blood Orange, Turnstile, Geese and others. If you can t make it to Zilker Metropolitan Park in Texas, Austin City Limits is available to livestream on Disney+ and Hulu throughout the entire three-day music festival starting on Friday (Oct. 2). Check out a livestream schedule here . Watch on Disney+ How to Watch Austin City Limits 2026 Live Online for Free Sign up for Disney+ to watch all sorts of movies and TV shows from The Walt Disney Company, Lucasfilm, Marvel Studios, Pixar Animation, Twentieth Century Studios, National Geographic, as well as Hulu originals with the Disney+ and Hulu bundle. Austin City Limits Music Festival Get Disney+ Get Disney+ and Hulu plans starting at $12.99 per month. Disney+ plans start at $12.49 per month for the ad-supported plan, while you can go ad-free
