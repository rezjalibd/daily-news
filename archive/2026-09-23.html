gnet helped you steer, and a cerium compound scrubbed the exhaust . All of these devices function because of 17 metals collectively known as rare earth elements . The scientists who gave the group that name in 1794 created a misnomer. Cerium alone is about as common in the Earth’s crust as copper. However, separating rare earth minerals from one another and from raw ore is intensely difficult. As a result, countries that control the processing of rare earth minerals have a lot of political leverage. Read full article Comments", "date_str": "2026-09-23T13:37:05+00:00", "hash": "cccaea961d5cf6e1", "title_fa": "آمریکا لبه خاکی کمیاب خود را کنار گذاشت. چین نهایت استفاده را برد.", "summary_fa": "به اطراف خود نگاه کنید، عناصر کمیاب خاکی را در کار خواهید دید. تلفن می لرزد زیرا آهنربا وزنه ای را حرکت می دهد. صفحه آن با پودر سریم جلا داده شد. اتصال آن به سایر نقاط جهان از اقیانوس ها بر روی کابل های تقویت شده با اربیوم عبور می کند. اگر امروز رانندگی می‌کردید، یک آهن‌ربای خاکی کمیاب به شما کمک می‌کرد تا هدایت کنید، و یک ترکیب سریم اگزوز را تمیز کرد. همه این دستگاه ها به دلیل وجود 17 فلز که در مجموع به عنوان عناصر خاکی کمیاب شناخته می شوند، کار می کنند. دانشمندانی که در سال 1794 این نام را به این گروه دادند، یک نام اشتباه ایجاد کردند. سریم به تنهایی تقریباً به اندازه مس در پوسته زمین رایج است. با این حال، جداسازی مواد معدنی خاکی کمیاب از یکدیگر و از سنگ معدنی به شدت دشوار است. در نتیجه، کشورهایی که فرآوری مواد معدنی کمیاب خاکی را کنترل می کنند، اهرم سیاسی زیادی دارند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل رساندن به اطراف خود نگاه کنید، عناصر کمیاب خاکی را در کار خواهید دید. تلفن می لرزد زیرا آهنربا وزنه ای را حرکت می دهد. صفحه آن با پودر سریم جلا داده شد. اتصال آن به سایر نقاط جهان از اقیانوس ها بر روی کابل های تقویت شده با اربیوم عبور می کند. اگر امروز رانندگی می‌کردید، یک آهن‌ربای خاکی کمیاب به شما کمک می‌کرد تا هدایت کنید، و یک ترکیب سریم اگزوز را تمیز کرد. چین بیشتر مواد معدنی خاکی کمیاب مورد استفاده در سراسر جهان را پردازش می کند و این فقط لوازم الکترونیکی مصرفی نیست که به صادرات چین بستگی دارد. جت های جنگنده F-35 ارتش"}, {"source": "Ars Technica", "title": "Small undersea volcanoes may unleash outsized tsunamis", "link": "https://arstechnica.com/science/2026/09/small-undersea-volcanoes-may-unleash-outsized-tsunamis/", "summary": "Krakatau, a volcanic island in Indonesia, killed more than 30,000 people when it erupted in 1883. One might assume that volcanic debris posed the major threat, yet many of the victims died from a tsunami caused by the volcanic eruption instead. Volcanoes at sea can pose hazards quite different from those on land, as their impact can vary depending on how the volcanic activity interacts with seawater. In the deep ocean, high water pressure can suppress explosive volcanic activity, making eruptions less destructive. But closer to the surface, the lower water pressure and the high temperatures of volcanic material can cause violent explosions. Yet scientists still do not fully understand the conditions under which volcanic activity can cause a tsunami. To better understand these risks, an international team of researchers examined the 2022 Hunga eruption in Tonga, focusing on the rapid caldera collapse that may have amplified its powerful tsunami. Calderas form when the ground above a magma reservoir collapses as the magma drains away. Comparisons of seafloor topography before and after the eruption showed that a roughly 4-kilometer-wide caldera sank by about a kilometer during the eruption. Read full article Comments", "date_str": "2026-09-23T11:15:30+00:00", "hash": "bdbdde957e6b931b", "title_fa": "آتشفشان های کوچک زیردریایی ممکن است سونامی های بزرگی را ایجاد کنند", "summary_fa": "کراکاتاو، جزیره‌ای آتشفشانی در اندونزی، بیش از 30000 نفر را در زمان فوران آن در سال 1883 کشته است. می‌توان تصور کرد که زباله‌های آتشفشانی تهدید بزرگی بوده است، اما در عوض بسیاری از قربانیان در اثر سونامی ناشی از فوران آتشفشان جان خود را از دست دادند. آتشفشان‌های موجود در دریا می‌توانند خطراتی کاملاً متفاوت از آتشفشان‌های روی زمین داشته باشند، زیرا تأثیر آنها بسته به نحوه تعامل فعالیت آتشفشانی با آب دریا می‌تواند متفاوت باشد. در اعماق اقیانوس، فشار بالای آب می‌تواند فعالیت‌های آتشفشانی انفجاری را سرکوب کند و فوران‌ها را کمتر مخرب کند. اما نزدیکتر به سطح، فشار کمتر آب و دمای بالای مواد آتشفشانی می تواند باعث انفجارهای شدید شود. با این حال، دانشمندان هنوز به طور کامل شرایطی را که تحت آن فعالیت های آتشفشانی می تواند باعث ایجاد سونامی شود، درک نکرده اند. برای درک بهتر این خطرات، یک تیم بین المللی از محققان فوران هونگا در سال 2022 در تونگا را با تمرکز بر فروپاشی سریع دهانه دهان که ممکن است سونامی قدرتمند آن را تقویت کرده باشد، بررسی کردند. هنگامی که زمین بالای یک مخزن ماگما فرو می ریزد و در نتیجه ماگما تخلیه می شود، کالدرا تشکیل می شود. مقایسه توپوگرافی کف دریا قبل و بعد از فوران نشان داد که یک دهانه دهانه تقریباً 4 کیلومتری در طول فوران حدود یک کیلومتر غرق شد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید کراکاتائو، جزیره آتشفشانی در اندونزی که در سال 1883 بیش از 30000 نفر را کشت. در عوض فوران آتشفشانی"}, {"source": "Ars Technica", "title": "A new report from Europe raises serious alarms about orbital collisions", "link": "https://arstechnica.com/space/2026/09/there-are-now-17000-satellites-in-orbit-and-growing-should-we-be-concerned/", "summary": "The 2013 sci-fi blockbuster film Gravity , starring Sandra Bullock and George Clooney, popularized the notion of the Kessler syndrome. In the movie, Russia shoots down a defunct satellite and creates a cloud of debris, leading to serious tension in orbit. The movie is fantastic, a true thriller, and while some liberties were taken with the depiction of outer space, the basic premise of a cascading series of collisions rendering orbits too cluttered with debris to be usable is valid. The idea was first proposed by NASA scientists Donald Kessler and Burton Cour-Palais nearly half a century ago. Still, the movie was science fiction, right? Read full article Comments", "date_str": "2026-09-23T11:00:17+00:00", "hash": "f235a5c2c56f66a4", "title_fa": "گزارش جدیدی از اروپا هشدارهای جدی در مورد برخوردهای مداری ایجاد می کند", "summary_fa": "فیلم موفق علمی تخیلی Gravity با بازی ساندرا بولاک و جورج کلونی در سال 2013، مفهوم سندرم کسلر را رایج کرد. در این فیلم، روسیه یک ماهواره از کار افتاده را ساقط می کند و ابری از زباله ایجاد می کند که منجر به تنش جدی در مدار می شود. این فیلم فوق‌العاده است، یک هیجان واقعی است، و در حالی که برخی از آزادی‌ها با به تصویر کشیدن فضای بیرونی گرفته شده است، فرض اصلی مجموعه‌ای از برخوردهای آبشاری که مدارها را بیش از حد مملو از زباله‌ها می‌سازد تا قابل استفاده نباشد، معتبر است. این ایده اولین بار توسط دانشمندان ناسا، دونالد کسلر و برتون کور-پالاس، تقریباً نیم قرن پیش ارائه شد. با این حال، فیلم علمی تخیلی بود، درست است؟ مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید فیلم پرفروش علمی تخیلی Gravity در سال 2013 با بازی ساندرا بولاک و جورج کلونی، مفهوم سندرم کسلر را رایج کرد. در این فیلم، روسیه یک ماهواره از کار افتاده را ساقط می کند و ابری از زباله ایجاد می کند که منجر به تنش جدی در مدار می شود. خوب، از زمان انتشار Gravity خیلی چیزها تغییر کرده است. در زمانی که تماشاگران تئاتر روی لبه‌های صندلی‌های خود می‌نشستند و به تماشای زباله‌های بولاک می‌پرداختند، تنها حدود 1000 ماهواره فعال در مدار بودند. طبق گفته CelesTrak، امروزه این تعداد به 17000 نزدیکتر است. غلبه این رشد توسط صورت فلکی استارلینک اسپیس ایکس انجام شده است که اکنون تقریباً 11000 ماهواره در مدار دارد و هزاران ماهواره دیگر نیز در راه هستند. و SpaceX در رقابت برای ارائه اینترنت از فضا تنها نیست. آمازون صدها ماهواره را پرتاب کرده است که هزاران ماهواره دیگر را دنبال می"}, {"source": "Ars Technica", "title": "Woman's brain worm infection confirmed after eggs grow tails in lab test", "link": "https://arstechnica.com/health/2026/09/womans-brain-worm-infection-confirmed-after-eggs-grow-tails-in-lab-test/", "summary": "Out of nowhere, a woman's right arm and leg started shaking uncontrollably. In the moments leading up to the experience, she seemed well; she had no headache, confusion, or weakness. But for about a minute, half of her body juddered. The woman, a rice farmer in the Philippines, headed to the emergency department. There, doctors gave her a physical exam and found nothing out of the ordinary. Then they took a look at her brain. Magnetic resonance imaging revealed a bright cluster of nodules surrounded by fluid in her left frontal lobe. The doctors had an immediate guess as to what they were: worm eggs. An MRI of the woman's brain showing nodules. Credit: NEJM, 2026 In a case report published in the latest issue of the New England Journal of Medicine , doctors write that they suspected the woman had neuroschistosomiasis, an uncommon complication of an infection with a Schistosoma parasitic worm, aka a blood fluke. In the Philippines, the most common fluke is S. japonicum . It's also found in China and part of Indonesia; despite its name, it has been eliminated from Japan. Read full article Comments", "date_str": "2026-09-22T21:42:14+00:00", "hash": "8cb3cece746a14be", "title_fa": "عفونت کرم مغزی زن پس از رشد دم تخم در آزمایش آزمایشگاهی تایید شد", "summary_fa": "از ناکجاآباد، دست و پای راست زنی شروع به لرزیدن کرد. در لحظات منتهی به تجربه، او خوب به نظر می رسید. او هیچ سردرد، گیجی یا ضعفی نداشت. اما حدود یک دقیقه نیمی از بدنش می لرزید. این زن، یک کشاورز برنج در فیلیپین، به بخش اورژانس رفت. در آنجا پزشکان او را معاینه فیزیکی کردند و هیچ چیز غیرعادی پیدا نکردند. سپس نگاهی به مغز او انداختند. تصویربرداری رزونانس مغناطیسی یک خوشه روشن از ندول‌ها را نشان داد که توسط مایع در لوب فرونتال چپ او احاطه شده بود. پزشکان فوراً حدس زدند که آنها چه هستند: تخم کرم. MRI از مغز زن که گره هایی را نشان می دهد. اعتبار: NEJM، 2026 در گزارش موردی منتشر شده در آخرین شماره مجله پزشکی نیوانگلند، پزشکان می نویسند که آنها مشکوک بودند که این زن مبتلا به نوروشیستوزومیازیس است، یک عارضه غیر معمول عفونت با یک کرم انگلی شیستوزوما، که به فلوک خون معروف است. در فیلیپین، شایع ترین بیماری S. japonicum است. همچنین در چین و بخشی از اندونزی یافت می شود. با وجود نامش از ژاپن حذف شده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید، دست و پای راست زن به طور غیرقابل کنترلی شروع به لرزیدن کرد. در لحظات منتهی به تجربه، او خوب به نظر می رسید. او هیچ سردرد، گیجی یا ضعفی نداشت. اما حدود یک دقیقه نیمی از بدنش می لرزید. S. japonicum مانند خویشاوندان خود دارای یک چرخه زندگی شیطانی است که با ریختن تخم های آن در ادرار یا مدفوع حیوانات مختلف از جمله انسان شروع می شود. وقتی شرایط مساعد باشد، تخم‌ها به شکل لارو آزاد در می‌آیند. اینها به دنبال انواع خاصی از حلزون های"}, {"source": "Ars Technica", "title": "New Anthropic, OpenAI models make same promise: A little more for a lot less money", "link": "https://arstechnica.com/ai/2026/09/new-anthropic-openai-models-make-same-promise-a-little-more-for-a-lot-less-money/", "summary": "OpenAI and Anthropic both recently released new models aimed at lowering costs. Anthropic announced Opus 5.5, the latest version of its main mass-market workhorse model, used for tasks like coding and other complex knowledge work. And OpenAI announced GPT-6 Sol and Luna, the latest versions of its middle-of-the-road or smaller models focused on efficiency and speed. Read full article Comments", "date_str": "2026-09-22T21:25:18+00:00", "hash": "d6ca60f034b9530f", "title_fa": "مدل‌های جدید Anthropic و OpenAI همان وعده را می‌دهند: کمی بیشتر برای پول بسیار کمتر", "summary_fa": "OpenAI و Anthropic هر دو به تازگی مدل های جدیدی را با هدف کاهش هزینه ها منتشر کرده اند. آنتروپیک Opus 5.5 را معرفی کرد، آخرین نسخه از مدل اصلی اصلی خود در بازار انبوه، که برای کارهایی مانند کدنویسی و سایر کارهای دانش پیچیده استفاده می شود. و OpenAI GPT-6 Sol و Luna را معرفی کرد، آخرین نسخه‌های مدل‌های متوسط ​​یا کوچک‌تر خود با تمرکز بر کارایی و سرعت. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید این نسخه های جدید در مورد قابلیت های جدید پیشگامانه نیستند. در عوض، آنها در مورد کارایی هستند. همانطور که OpenAI و Anthropic هر دو مشتریان سازمانی را هدف قرار می دهند، در حال رقابت با مدل های وزن باز هستند زیرا سازمان ها در حال بررسی تغییر رویه های خود و استفاده از روترهای مدل برای استفاده کمتر از این مدل های مرزی گران قیمت به نفع جایگزین های ارزان تر هستند. Anthropic و OpenAI استدلال می‌کنند که این نسخه‌های جدید پاکت را به سمت مرز می‌برند (البته عمدتاً به روش‌های متوسط)، در حالی که هزینه‌ها را به میزان قابل توجهی کاهش می‌دهند. Opus 5.5 در بالاترین سطح از مدل های معرفی شده امروز قرار دارد، اما زمینه گسترده تر اینجاست که Anthropic در رقابت خود با OpenAI کمی پیشروی می کند. OpenAI در اوایل این ماه GPT-6 Astra را منتشر کرد که گاهی اوقات به طور متوسط ​​Opus 5 را در بنچمارک ها و احساسات کاربران شکست می دهد. (از نظر قیمت و قابلیت، Astra با Opus و Fable رقابت می‌کند.) معیارهای Anthropic و شرکای آن اکنون نشان می‌دهند که Opus 5.5 در کدنویسی و کار دانش در برخی موارد بهتر از GPT-6 Astra عمل می‌کند، البته در"}, {"source": "Ars Technica", "title": "Cities across US oppose Trump FCC plan to preempt local broadband rules", "link": "https://arstechnica.com/tech-policy/2026/09/cities-across-us-oppose-trump-fcc-plan-to-preempt-local-broadband-rules/", "summary": "Cities and counties around the US are angry at the Trump administration over a proposal to override local rules that govern the deployment of wired broadband networks. The Federal Communications Commission has been taking public comments on a Notice of Proposed Rulemaking that proposes to preempt state and local permitting rules. The FCC argues that too many local governments \"excessively delay approvals and seek to extract exorbitant sums from providers, resulting in costs that render some deployments infeasible.\" The FCC plan is supported by broadband providers, but local governments told the FCC that it would override rules that protect public safety. Local governments say the plan is illegal and that the FCC should instead focus on how Internet providers thwart competition with permit-hoarding and other tactics that prevent competitors from deploying networks. Read full article Comments", "date_str": "2026-09-22T20:38:30+00:00", "hash": "3e501e1ac0e14145", "title_fa": "شهرهای سراسر ایالات متحده با طرح FCC ترامپ برای جلوگیری از قوانین پهنای باند محلی مخالف هستند", "summary_fa": "شهرها و شهرستان های سراسر ایالات متحده از دولت ترامپ به دلیل پیشنهادی برای نادیده گرفتن قوانین محلی حاکم بر استقرار شبکه های پهن باند سیمی عصبانی هستند. کمیسیون ارتباطات فدرال نظرات عمومی را در مورد اعلان قوانین پیشنهادی ارائه کرده است که پیشنهاد می کند از قوانین مجوز ایالتی و محلی جلوگیری شود. FCC استدلال می‌کند که بسیاری از دولت‌های محلی «به‌شدت تأییدیه‌ها را به تأخیر می‌اندازند و به دنبال استخراج مبالغ گزاف از ارائه‌دهندگان هستند، که منجر به هزینه‌هایی می‌شود که برخی از استقرارها را غیرممکن می‌سازد». طرح FCC توسط ارائه‌دهندگان پهنای باند پشتیبانی می‌شود، اما دولت‌های محلی به FCC گفته‌اند که قوانینی را که از ایمنی عمومی محافظت می‌کنند، لغو خواهد کرد. دولت‌های محلی می‌گویند که این طرح غیرقانونی است و FCC باید در عوض بر روی این موضوع تمرکز کند که چگونه ارائه‌دهندگان اینترنت رقابت را با احتکار مجوز و سایر تاکتیک‌هایی که مانع استقرار شبکه‌های رقبا می‌شود، خنثی می‌کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید شهرها و شهرستان های سراسر ایالات متحده از دولت ترامپ به دلیل پیشنهادی برای لغو قوانین محلی که بر استقرار شبکه های پهن باند سیمی حاکم است عصبانی هستند. سند FCC نظرات بسیاری را از سوی رهبران شهرداری‌های منفرد و از سوی گروه‌هایی که دولت‌های محلی در سراسر کشور را نمایندگی می‌کنند، جلب کرده است. آنها به برنامه‌های FCC برای تعیین مهلت ۱۲۰ روزه برای پردازش مجوزها و محدودیت‌های پیشنهادی برای هزینه‌ها و غرامتی که دولت‌های محلی می‌توانند از ارائه‌دهندگان درخواست کنند، اعتراض دارند. «مجوز محلی مانعی برای استقرار پهنای باند نیست – این یک کارکرد ایمنی عمومی ضروری است که از ساکنان، مالیات دهندگان و همه کاربران حق عبور عمومی محدود و چند مستاجر محافظت"}, {"source": "Ars Technica", "title": "Microsoft disrupts AI-assisted platform that compromised 12,000 accounts", "link": "https://arstechnica.com/security/2026/09/microsoft-disrupts-ai-assisted-platform-that-compromised-12000/", "summary": "Microsoft said Tuesday that it led an industry-wide disruption of a subscription-based scam platform that used an AI chatbot to compromise 12,000 Microsoft accounts over a few-month span. Named EvilTokens, the platform was introduced over a Telegram channel in February and charged an initial $1,500 fee and a recurring $500 charge each month after that. EvilTokens provided a single service for streamlining most steps required to compromise email accounts in large numbers. From there, the platform helped customers analyze inboxes, select targets that would provide the biggest potential payouts, and draft follow-up emails that provided realistic ruses for tricking company employees into transferring funds to attacker-controlled accounts. Minutes, not days “While EvilTokens helped cybercriminals access email accounts, at the center of the service was an AI-style chatbot that could analyze a victim’s inbox and help criminals identify trusted relationships, payment authorizations, and sensitive responsibilities, as well as other circumstances where fraud was most likely to succeed,” Microsoft said . “The platform could even recommend fraud strategies, including drafting messages that impersonated trusted contacts to help criminals trick victims into taking action.” Read full article Comments", "date_str": "2026-09-22T19:45:47+00:00", "hash": "d1a9413c73aabb5b", "title_fa": "مایکروسافت پلتفرمی را که با هوش مصنوعی 12000 حساب را در معرض خطر قرار داده بود، مختل کرد", "summary_fa": "مایکروسافت روز سه‌شنبه اعلام کرد که منجر به اختلال در صنعت پلتفرم کلاهبرداری مبتنی بر اشتراک شده است که از یک ربات چت هوش مصنوعی برای به خطر انداختن 12000 حساب مایکروسافت در مدت چند ماه استفاده می‌کرد. این پلتفرم با نام EvilTokens در ماه فوریه از طریق یک کانال تلگرامی معرفی شد و هزینه اولیه 1500 دلار و هزینه تکراری 500 دلاری را هر ماه پس از آن دریافت کرد. EvilTokens یک سرویس واحد برای ساده‌سازی بیشتر مراحل مورد نیاز برای به خطر انداختن حساب‌های ایمیل در تعداد زیاد ارائه کرد. از آنجا، این پلتفرم به مشتریان کمک کرد تا صندوق‌های ورودی را تجزیه و تحلیل کنند، اهدافی را انتخاب کنند که بیشترین پرداخت‌های بالقوه را ارائه می‌دهند، و پیش‌نویس ایمیل‌های بعدی را که حقه‌های واقع بینانه‌ای برای فریب کارمندان شرکت برای انتقال وجوه به حساب‌های تحت کنترل مهاجم ارائه می‌دادند. مایکروسافت گفت: «در حالی که EvilTokens به مجرمان سایبری کمک می‌کرد تا به حساب‌های ایمیل دسترسی پیدا کنند، در مرکز این سرویس یک ربات چت به سبک هوش مصنوعی قرار داشت که می‌توانست صندوق ورودی قربانی را تجزیه و تحلیل کند و به مجرمان کمک کند تا روابط قابل اعتماد، مجوزهای پرداخت، و مسئولیت‌های حساس و همچنین شرایط دیگری را که احتمال موفقیت کلاهبرداری در آن‌ها وجود دارد، شناسایی کنند. این پلتفرم حتی می‌تواند استراتژی‌های کلاهبرداری را توصیه کند، از جمله تهیه پیش‌نویس پیام‌هایی که جعل هویت مخاطبین مورد اعتماد را برای کمک به مجرمان برای فریب قربانیان برای انجام اقدام، ارائه می‌کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش مایکروسافت روز سه شنبه گفت که منجر به اختلال در صنعت پلتفرم کلاهبرداری مبتنی بر اشتراک شده است که از یک ربات چت هوش مصنوعی"}, {"source": "Ars Technica", "title": "Lawsuit demands OpenAI pay for new school after ChatGPT used in shooting", "link": "https://arstechnica.com/tech-policy/2026/09/lawsuit-demands-openai-pay-for-new-school-after-chatgpt-used-in-shooting/", "summary": "The families of victims killed in one of the deadliest mass shootings in Canada’s history have already sued OpenAI over its failure to warn law enforcement after discovering in advance that the shooter was using ChatGPT to plan the violence. Now, British Columbia is suing, explaining for the first time how costly and extreme the disaster response has been. OpenAI and Sam Altman owe the tiny remote mining community shattered by the tragedy much more than an apology, the Canadian province argued. They must make meaningful changes to end ChatGPT-assisted violence and then pay whatever it costs to help Tumbler Ridge to rebuild, recover, and heal. In a complaint filed Monday, British Columbia explained that Tumbler Ridge Secondary School had to be demolished after an 18-year-old transgender shooter, Jesse Van Rootselaar, died by suicide there in February after killing five kids and an education assistant. In total, eight lives were lost, as prior to the school shooting, Van Rootselaar shot their mother and half-brother. Read full article Comments", "date_str": "2026-09-22T19:28:23+00:00", "hash": "5c09c438fb8fa105", "title_fa": "شکایت از OpenAI برای مدرسه جدید پس از استفاده از ChatGPT در تیراندازی درخواست می کند", "summary_fa": "خانواده‌های قربانیانی که در یکی از مرگبارترین تیراندازی‌های دسته جمعی در تاریخ کانادا کشته شده‌اند، پیش از این متوجه شده بودند که تیرانداز از ChatGPT برای برنامه‌ریزی خشونت استفاده می‌کرده است. اکنون، بریتیش کلمبیا شکایت می کند و برای اولین بار توضیح می دهد که واکنش در برابر فاجعه چقدر پرهزینه و شدید بوده است. استان کانادا استدلال کرد که OpenAI و سام آلتمن به جامعه کوچک استخراج از راه دور که توسط این فاجعه متلاشی شده اند، بیشتر از یک عذرخواهی مدیون هستند. آنها باید تغییرات معنی داری برای پایان دادن به خشونت به کمک ChatGPT ایجاد کنند و سپس هر هزینه ای را برای کمک به Tumbler Ridge برای بازسازی، بهبودی و بهبودی بپردازند. در شکایتی که دوشنبه ارائه شد، بریتیش کلمبیا توضیح داد که مدرسه متوسطه تامبلر ریج پس از اینکه یک تیرانداز 18 ساله تراجنسیتی به نام جسی ون روتسلار پس از کشتن پنج کودک و یک دستیار آموزشی در فوریه در آنجا با خودکشی جان خود را از دست داد، باید تخریب شود. در مجموع، هشت نفر جان خود را از دست دادند، زیرا قبل از تیراندازی در مدرسه، ون روتسلار به مادر و برادر ناتنی آنها شلیک کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید خانواده های قربانیانی که در یکی از مرگبارترین تیراندازی های دسته جمعی در تاریخ کانادا کشته شدند، قبلاً از OpenAI به دلیل عدم هشدار دادن به مجریان قانون پس از اینکه قبلاً متوجه شده بودند که تیرانداز از خشونت استفاده کرده است شکایت کرده اند. پیش از این، مدرسه راهنمایی \"هم از نظر جغرافیایی و هم از نظر فرهنگی\" در قلب شهر قرار داشت. اما پس از تیراندازی، این یک \"نماد اجتناب ناپذیر تروما\" شد."}, {"source": "Ars Technica", "title": "Adobe Premiere finally brings powerful video editing to Android, and it's free", "link": "https://arstechnica.com/gadgets/2026/09/adobe-premiere-finally-brings-powerful-video-editing-to-android-and-its-free/", "summary": "Video editing has never been Android's strong suit. While Apple has long offered iMovie for iPhone and iPad, Google has never had a comparable offering. Adobe is now stepping up to fill this feature gap with a proper version of Premiere. The app is now available in the Play Store for almost all Android devices, and it's free (mostly). Android's version of Premiere doesn't offer all the features you'd get in the desktop application, but it's a big step up from the soon-to-be-retired Premiere Rush app. You can import as many video tracks as you want, trim them, split them, add effects, and export videos in up to 4K resolution. It can even extract audio from clips, reduce background noise, and add voiceovers. The app emphasizes the YouTube Short format, even defaulting your video outputs to portrait 16:9, but you can change that to something more traditional. On a standard smartphone, the app splits the screen with the timeline at the bottom and preview up top. Adobe says that Premiere is optimized for multiple form factors. If you have a foldable phone, the UI adjusts to give you more breathing room, placing the timeline to the right of the video. That makes sense as the default, as Premiere wants you to make YouTube Shorts, but if you're working with something wider, there's a layout toggle that puts the widescreen video above the expanded timeline. The split is also adjustable if you want to make your video or timeline larger. Read full article Comments", "date_str": "2026-09-22T19:08:58+00:00", "hash": "fb48cf9f7589b49d", "title_fa": "Adobe Premiere بالاخره ویرایش ویدیویی قدرتمندی را به اندروید می آورد و این برنامه رایگان است", "summary_fa": "ویرایش ویدیو هرگز مناسب اندروید نبوده است. در حالی که اپل مدت‌هاست که iMovie را برای آیفون و آی‌پد ارائه کرده است، گوگل هرگز پیشنهاد مشابهی نداشته است. Adobe در حال حاضر برای پر کردن این شکاف ویژگی با نسخه مناسب پریمیر در حال افزایش است. این برنامه اکنون در فروشگاه Play تقریباً برای همه دستگاه های اندرویدی موجود است و (بیشتر) رایگان است. نسخه اندروید پریمیر همه ویژگی‌هایی را که در برنامه دسکتاپ دریافت می‌کنید ارائه نمی‌کند، اما این یک گام بزرگ در مقایسه با برنامه Premiere Rush است که به زودی بازنشسته می‌شود. می‌توانید هر تعداد آهنگ ویدیویی را که می‌خواهید وارد کنید، آن‌ها را برش دهید، آن‌ها را تقسیم کنید، جلوه‌ها اضافه کنید و ویدیوها را با وضوح 4K صادر کنید. حتی می‌تواند صدا را از کلیپ‌ها استخراج کند، نویز پس‌زمینه را کاهش دهد و صدا را اضافه کند. این برنامه بر فرمت YouTube Short تأکید دارد، حتی خروجی های ویدیوی شما را به صورت عمودی 16:9 پیش فرض قرار می دهد، اما می توانید آن را به چیزی سنتی تر تغییر دهید. در یک تلفن هوشمند استاندارد، برنامه صفحه نمایش را با جدول زمانی در پایین و پیش نمایش به بالا را تقسیم می کند. Adobe می گوید که Premiere برای چندین فرم فاکتور بهینه شده است. اگر تلفن تاشو دارید، رابط کاربری تنظیم می‌شود تا فضای تنفس بیشتری به شما بدهد و جدول زمانی را در سمت راست ویدیو قرار می‌دهد. این به‌عنوان پیش‌فرض منطقی است، زیرا Premiere از شما می‌خواهد YouTube Shorts بسازید، اما اگر با چیزی گسترده‌تر کار می‌کنید، یک تغییر چیدمان وجود دارد که ویدیوی عریض را بالاتر از جدول زمانی توسعه‌یافته قرار می‌دهد. اگر می‌خواهید ویدیو یا خط زمانی خود را بزرگ‌تر کنید، تقسیم نیز قابل تنظیم است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض"}, {"source": "Ars Technica", "title": "Review: Resident Evil might just be the best gaming adaptation yet", "link": "https://arstechnica.com/culture/2026/09/review-resident-evil-is-the-fresh-take-this-flagging-franchise-really-needed/", "summary": "I was on the fence about going to see the latest Resident Evil reboot to review, given how uninspired the prior reboot attempt in 2021 turned out to be. But director Zach Cregger gave us last year's phenomenal Weapons, and early word of mouth was extremely positive, so I took a chance. I'm glad I did, because the film is terrific. Cregger's distinctive sensibility is just what the flagging franchise needed: a truly fresh take on a well-trodden fictional world that blends horror, humor, and some pretty over-the-top gore in just the right ratios. And you don't need to be a Resident Evil franchise fan to enjoy it. (Spoilers below, but we'll give you a heads-up before any major reveals.) When the first Resident Evil game debuted in 1996, it was an immediate commercial and critical success, spawning several sequel games, comics, novels, and a very lucrative film franchise directed by Paul W.S. Anderson and starring Milla Jovovich. Reviews were mixed, despite the films’ massive box office success. The first reboot, Welcome to Raccoon City (2021) , was critically panned and had a disappointing box office, grossing just $42 million globally against its $25 million budget. The studio nixed its plans for a direct sequel, and a 2022 Netflix series was also canceled after a less-than-stellar first season. Read full article Comments", "date_str": "2026-09-22T17:30:07+00:00", "hash": "174d400168f7025d", "title_fa": "نقد و بررسی: Resident Evil ممکن است بهترین اقتباس از بازی باشد", "summary_fa": "با توجه به اینکه تلاش قبلی برای راه‌اندازی مجدد در سال 2021 چقدر غیر الهام‌بخش بود، می‌خواستم آخرین راه‌اندازی Resident Evil را برای بررسی ببینم. اما کارگردان Zach Cregger سال گذشته سلاح‌های فوق‌العاده‌ای را به ما داد، و تبلیغات دهان به دهان بسیار مثبت بود، بنابراین من از فرصت استفاده کردم. من خوشحالم که این کار را انجام دادم، زیرا فیلم فوق العاده است. حساسیت متمایز کرگر دقیقاً همان چیزی است که فرنچایز پرچم‌دار به آن نیاز داشت: برداشتی واقعاً تازه از یک دنیای تخیلی به خوبی زیر پا گذاشته شده که وحشت، طنز و برخی از غم‌انگیزهای فوق‌العاده را در نسبت‌های مناسب ترکیب می‌کند. و نیازی نیست که طرفدار فرنچایز Resident Evil باشید تا از آن لذت ببرید. (در زیر اسپویل‌ها، اما قبل از هر فاش شدن مهمی به شما اطلاع می‌دهیم.) وقتی اولین بازی Resident Evil در سال 1996 عرضه شد، یک موفقیت تجاری و انتقادی فوری بود و چندین بازی دنباله‌دار، کمیک، رمان و یک فرانچایز فیلم بسیار پرسود به کارگردانی Paul W.S. اندرسون و با بازی میلا جووویچ. علیرغم موفقیت عظیم فیلم ها در باکس آفیس، نقدها متفاوت بود. اولین ریبوت، به شهر راکون (2021) خوش آمدید، به شدت مورد توجه قرار گرفت و باکس آفیس ناامیدکننده ای داشت و تنها 42 میلیون دلار در سطح جهانی در برابر بودجه 25 میلیون دلاری خود فروخت. این استودیو برنامه های خود را برای دنباله مستقیم لغو کرد و یک سریال نتفلیکس 2022 نیز پس از فصل اول نه چندان درخشان لغو شد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش من در حصار دیدن آخرین راه‌اندازی Resident Evil برای بررسی بودم، با توجه به اینکه تلاش برای راه‌اندازی مجدد قبلی در سال 2021 چقدر غیر"}, {"source": "Ars Technica", "title": "Toyota orders workers to train humanoid robots but says humans won't be replaced", "link": "https://arstechnica.com/ai/2026/09/toyota-claims-plan-for-400000-factory-robots-wont-replace-human-workers/", "summary": "Toyota workers are already helping to train humanoid robots as part of the automaker’s race to eventually deploy 400,000 factory robots—but a Toyota executive said the robotic push is not meant to directly replace humans. Starting in 2028, the Toyota Motor group aims to start investing $6.42 billion every year in upgrading factories with the new robotic workforce, according to Nikkei Asia . The company wants to put 150,000 robots in its own automotive plants and deploy another 250,000 at group company facilities that produce various components and materials. Toyota has already begun deploying some of its ELEY humanoid robots across assembly lines to learn from human workers. Nikkei Asia reported that workers are teaching the robots, which roll around on wheels, to perform tasks requiring precise hand movements by wearing “jigs” based on the humanoids’ fingers. Read full article Comments", "date_str": "2026-09-22T17:06:16+00:00", "hash": "d1dfe81290ef1c9e", "title_fa": "تویوتا به کارگران دستور آموزش ربات‌های انسان‌نما را می‌دهد اما می‌گوید انسان‌ها جایگزین نمی‌شوند", "summary_fa": "کارگران تویوتا در حال حاضر به آموزش ربات‌های انسان‌نما به عنوان بخشی از مسابقه خودروسازان برای استقرار 400000 ربات کارخانه کمک می‌کنند، اما یکی از مدیران تویوتا می‌گوید که این فشار رباتیک به‌منظور جایگزینی مستقیم انسان‌ها نیست. بر اساس گزارش نیکی آسیا، گروه تویوتا موتور قصد دارد از سال 2028 شروع به سرمایه گذاری 6.42 میلیارد دلاری در ارتقاء کارخانه ها با نیروی کار جدید رباتیک کند. این شرکت می‌خواهد 150000 ربات را در کارخانه‌های خودروسازی خود قرار دهد و 250000 ربات دیگر را در تاسیسات شرکت گروهی که قطعات و مواد مختلف تولید می‌کنند مستقر کند. تویوتا در حال حاضر استقرار برخی از ربات های انسان نما ELEY خود را در خطوط مونتاژ برای یادگیری از کارگران انسانی آغاز کرده است. Nikkei Asia گزارش داد که کارگران به روبات‌هایی که روی چرخ‌ها می‌چرخند، آموزش می‌دهند تا با استفاده از \"جنگ\" بر اساس انگشتان انسان‌نما، کارهایی را انجام دهند که نیاز به حرکات دقیق دست دارند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید کارمندان تویوتا در حال حاضر به آموزش ربات های انسان نما به عنوان بخشی از مسابقه خودروسازان برای استقرار 400000 ربات کارخانه کمک می کنند – اما گفته می شود ربات انسانی به طور مستقیم جایگزین من نمی شود. این به طور طبیعی سؤالاتی را در مورد آینده نیروی انسانی این خودروساز مستقر در ژاپن ایجاد می کند که دارای 18000 کارگر کهنه کار در 60 کارخانه در سراسر جهان از جمله 11 کارخانه تولید ایالات متحده است. اما هیروکی ناکاجیما، معاون اجرایی تویوتا، به نیکی آسیا گفت که هدف این شرکت «دنیایی است که روبات‌ها با انسان‌ها همزیستی کنند، نه جایگزین کردن آنها»."}, {"source": "Ars Technica", "title": "IT mistake erases 11 years of viewing history for hospitals’ maternity records", "link": "https://arstechnica.com/information-technology/2026/09/it-mistake-erases-11-years-of-viewing-history-for-hospitals-maternity-records/", "summary": "A “human error” in the IT department led to Nottingham University Hospitals NHS Trust (NUH) losing data from maternity records over an 11-year span. The data loss occurred on August 18, the English hospitals announced in a blog post on Monday spotted by The Register . The blog said the problem is “the result of human error” during routine technical work while “creating a copy of a radiotherapy database for reporting purposes.” The post reads: Read full article Comments", "date_str": "2026-09-22T16:55:40+00:00", "hash": "727642335e50715e", "title_fa": "اشتباه فناوری اطلاعات 11 سال سابقه مشاهده سوابق زایمان بیمارستان ها را پاک می کند", "summary_fa": "یک \"خطای انسانی\" در بخش فناوری اطلاعات منجر به از دست دادن اطلاعات سوابق زایمان در طول 11 سال از بیمارستان های دانشگاه ناتینگهام شد. بیمارستان های انگلیسی روز دوشنبه در یک پست وبلاگی که توسط The Register مشاهده شد، اعلام کردند که از دست دادن داده ها در 18 آگوست رخ داده است. این وبلاگ گفت که این مشکل \"نتیجه خطای انسانی\" در حین کار فنی معمول در هنگام \"ایجاد یک کپی از پایگاه داده رادیوتراپی برای اهداف گزارش\" است. در این پست آمده است: مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید یک \"خطای انسانی\" در بخش فناوری اطلاعات منجر به از دست دادن داده های سوابق زایمان در طول 11 سال در بیمارستان های دانشگاه ناتینگهام شد. این فرآیند از مجموعه ای از دستورالعمل های کامپیوتری از پیش نوشته شده استفاده می کرد که قبلاً برای یک سیستم بیمارستانی متفاوت استفاده شده بود. تنظیمی که باید قبل از اجرای فرآیند تغییر می کرد، از دست رفت. در نتیجه، این فرآیند به جای پایگاه داده رادیوتراپی بر روی پایگاه داده زایمان انجام شد و باعث شد پایگاه داده سوابق زایمان بازنویسی شود. پایگاه داده بازنویسی شده حاوی داده‌هایی از پایگاه داده بارداری قبلی NUH است که شامل سوابق زایمان برای زنان و نوزادانی است که از سپتامبر 2011 تا نوامبر 2022 از NUH مراقبت شده‌اند. NUH نتوانسته است برخی از داده‌ها را بازیابی کند، وبلاگ گفت: ... ما نتوانستیم تاریخچه کاملی را بازیابی کنیم که نشان می‌دهد چه کسی در طول این دوره سوابق زایمان را مشاهده کرده است. در نتیجه، در بیشتر موارد، ممکن است نتوانیم تأیید کنیم که آیا سوابق زایمان توسط شخص خاصی بین سپتامبر 2011 و نوامبر 2022 مشاهده شده است یا"}, {"source": "Ars Technica", "title": "Effort begins to fill the void left by terminated US climate report", "link": "https://arstechnica.com/science/2026/09/effort-begins-to-fill-the-void-left-by-terminated-us-climate-report/", "summary": "Last year, the Trump administration did what it could to shut down work on the next US National Climate Assessment, eliminating funding for the US Global Change Research Program and booting hundreds of contributing authors. The administration even took past reports offline, forcing others to host copies so the information would still be accessible. And this all comes despite the fact that these reports are legally required. Later in the year, the American Geophysical Union and American Meteorological Society announced an effort to give researchers a central place to compile the kind of work that would have fed the next US report, as well as potential regional and local reports. This “ US Climate Collection ” works differently from the US Global Change Research Program or the International Panel on Climate Change (IPCC). Rather than facilitating the writing of a giant, coordinated report, the groups are inviting teams of researchers to publish peer-reviewed papers in scientific journals, which will then be added to a centralized resource for future report-writers. The first paper has now been added to that collection. It’s the work of 175 authors (many of whom had been working on the US report), and it is actually being published in two journals—one operated by the American Geophysical Union and one by the American Meteorological Society. That’s because this paper is intended to provide a roadmap to prioritize future contributions. Read full article Comments", "date_str": "2026-09-22T16:26:30+00:00", "hash": "42a527da5ad8423f", "title_fa": "تلاش برای پر کردن خلاء ناشی از پایان گزارش آب و هوای ایالات متحده آغاز می شود", "summary_fa": "سال گذشته، دولت ترامپ هر چه در توان داشت انجام داد تا کار بر روی ارزیابی ملی آب و هوای ایالات متحده را متوقف کند، بودجه برنامه تحقیقاتی تغییرات جهانی ایالات متحده را حذف کرد و صدها نویسنده مشارکت کننده را راه اندازی کرد. دولت حتی گزارش‌های گذشته را آفلاین می‌کرد و دیگران را مجبور می‌کرد تا کپی‌ها را میزبانی کنند تا اطلاعات همچنان قابل دسترسی باشد. و همه اینها علیرغم این واقعیت است که این گزارش ها از نظر قانونی مورد نیاز هستند. بعداً در سال، اتحادیه ژئوفیزیک آمریکا و انجمن هواشناسی آمریکا اعلام کردند که تلاشی برای ارائه یک مکان مرکزی به محققان برای جمع‌آوری نوع کاری که می‌تواند گزارش بعدی ایالات متحده و همچنین گزارش‌های منطقه‌ای و محلی بالقوه را تامین کند. این \"مجموعه آب و هوای ایالات متحده\" متفاوت از برنامه تحقیقاتی تغییرات جهانی ایالات متحده یا پانل بین المللی تغییر آب و هوا (IPCC) عمل می کند. به جای تسهیل نوشتن یک گزارش هماهنگ و غول‌پیکر، گروه‌ها از تیم‌هایی از محققان دعوت می‌کنند تا مقالات بررسی شده را در مجلات علمی منتشر کنند، که سپس به یک منبع متمرکز برای گزارش‌نویسان آینده اضافه می‌شود. اکنون اولین مقاله به آن مجموعه اضافه شده است. این کار 175 نویسنده است (که بسیاری از آنها روی گزارش ایالات متحده کار می کردند) و در واقع در دو مجله منتشر می شود - یکی توسط اتحادیه ژئوفیزیک آمریکا و دیگری توسط انجمن هواشناسی آمریکا. به این دلیل که این مقاله قصد دارد نقشه راه را برای اولویت بندی مشارکت های آینده ارائه دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش سال گذشته، دولت ترامپ هر چه در توان داشت انجام داد تا کار بر روی ارزیابی"}, {"source": "Ars Technica", "title": "Shuffling the deck chairs: Xbox continues its \"reset\" with dramatic restructuring", "link": "https://arstechnica.com/gaming/2026/09/shuffling-the-deck-chairs-xbox-continues-its-reset-with-dramatic-restructuring/", "summary": "When Xbox announced sweeping layoffs in July as part of a brutal \"reset\" for the gaming brand, Xbox CEO Asha Sharma said part of the pre-existing problem in the gaming unit was \"teams, studios, and functions [that] often operate independently, [making it] harder to work toward a shared goal.\" Today, the company announced a radical restructuring of its internal studios that is seemingly designed to reduce that \"independence\" for the teams behind some of gaming's biggest franchises. The biggest apparent change is for the Halo franchise, which will now be under the remit of Call of Duty maker Activision. Halo Studios (formerly 343 Industries), which recently released Halo: Campaign Evolved , will remain as just a \"small team\" to support the player community, Microsoft said, with the remaining staffing roles eliminated as part of 268 newly announced layoffs. \"For Halo, our goal is clear: make the greatest Halo game ever, worthy of its universe and legacy, while staying true to what made players love it in the first place,\" Activision President Rob Kostich said in a statement provided to Kotaku . \"It is a bold ambition, one that this franchise deserves. We have already begun assembling a purpose-built team, unique in capability and talent, ready and excited to deliver this next chapter with the community.\" Read full article Comments", "date_str": "2026-09-22T15:30:53+00:00", "hash": "8e8fe0218f8957b1", "title_fa": "به هم ریختن صندلی های عرشه: ایکس باکس به \"بازنشانی\" خود با بازسازی چشمگیر ادامه می دهد", "summary_fa": "هنگامی که ایکس باکس در ماه جولای اخراج گسترده کارکنان خود را به عنوان بخشی از \"بازنشانی\" وحشیانه برای برند بازی اعلام کرد، آشا شارما مدیر عامل ایکس باکس گفت که بخشی از مشکل از قبل موجود در واحد بازی \"تیم ها، استودیوها و عملکردهایی است که اغلب به طور مستقل عمل می کنند و کار برای رسیدن به یک هدف مشترک را سخت تر می کنند.\" امروز، این شرکت تغییر ساختار بنیادی استودیوهای داخلی خود را اعلام کرد که ظاهراً برای کاهش این «استقلال» برای تیم‌های پشت سر برخی از بزرگترین فرنچایزهای بازی طراحی شده است. بزرگترین تغییر ظاهری مربوط به فرنچایز Halo است که اکنون تحت مسئولیت سازنده Call of Duty Activision خواهد بود. مایکروسافت گفت که استودیو Halo (343 Industries سابق) که اخیراً Halo: Campaign Evolved را منتشر کرد، به عنوان یک \"تیم کوچک\" برای حمایت از جامعه بازیکنان باقی خواهد ماند و نقش‌های باقیمانده کارکنان به عنوان بخشی از 268 اخراج جدید اعلام شده حذف شدند. راب کوستیچ، رئیس اکتیویژن در بیانیه‌ای که در اختیار Kotaku قرار گرفته است، گفت: \"هدف ما برای Halo روشن است: ساخت بزرگترین بازی Halo، شایسته جهان و میراثش، در حالی که به چیزی که بازیکنان را در وهله اول عاشق آن می‌کرد، وفادار بمانیم.\" \"این یک جاه طلبی جسورانه است که این فرنچایز شایسته آن است. ما قبلاً شروع به جمع‌آوری یک تیم هدفمند کرده‌ایم که از نظر توانایی و استعداد منحصربه‌فرد، آماده و هیجان‌زده برای ارائه این فصل بعدی با جامعه است.\" مقاله کامل را بخوانید نظرات تنظیمات متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش هنگامی که ایکس باکس اعلام کرد که در ماه جولای \"تعطیلی فراگیر\" Xbox را به عنوان \"بخشی از انصراف باکس\" اعلام کرد. مدیر عامل شرکت آشا شارما گفت"}, {"source": "Ars Technica", "title": "Protests for Germany’s car industry as job losses loom", "link": "https://arstechnica.com/cars/2026/09/protests-for-germanys-car-industry-as-job-losses-loom/", "summary": "The future is looking increasingly bleak for Germany’s automotive industry. Since the turn of the century, car makers have been among the crown jewels of the German economy, punching above their weight in terms of investment and innovation. But those companies are now facing multiple problems at once, from declining demand at home and stronger competition from abroad to the cost of punitive and arbitrary new tariffs, on top of preexisting structural challenges like an aging workforce and a slow recovery from COVID. Total automotive sales in Europe have fallen from a peak of almost 18 million in 2019 to around 13 million in 2025, and some share of that smaller market is increasingly going to new entrants from China, which has its own spare automotive production capacity problem to worry about. And while the US market has always been the most profitable for German car exports, that was before the imposition of new import tariffs, which currently stand at 25 percent but could be subject to change at any time. Factory closures now seem not just possible but likely, something that would have been unthinkable just a few years ago. Earlier this summer, news emerged that Volkswagen Group is considering closing four of its German factories to prepare for the future. Things have not gotten much better for VW Group in the months since that news broke. Read full article Comments", "date_str": "2026-09-22T14:40:47+00:00", "hash": "504e00b89c8d3ca4", "title_fa": "تظاهرات برای صنعت خودروی آلمان در حالی که از دست دادن شغل در حال افزایش است", "summary_fa": "آینده برای صنعت خودروسازی آلمان به طور فزاینده ای تاریک به نظر می رسد. از آغاز قرن حاضر، خودروسازان در میان جواهرات اقتصاد آلمان بوده اند و از نظر سرمایه گذاری و نوآوری بالاتر از وزن خود هستند. اما این شرکت‌ها اکنون با مشکلات متعددی در یک زمان مواجه هستند، از کاهش تقاضا در داخل و رقابت قوی‌تر از خارج گرفته تا هزینه تعرفه‌های جدید تنبیهی و خودسرانه، در کنار چالش‌های ساختاری موجود مانند پیر شدن نیروی کار و بهبود آهسته از COVID. مجموع فروش خودرو در اروپا از اوج تقریباً 18 میلیون در سال 2019 به حدود 13 میلیون در سال 2025 کاهش یافته است و بخشی از این بازار کوچکتر به طور فزاینده ای به شرکت های تازه وارد از چین می رسد که مشکل ظرفیت تولید خودروی اضافی خود را دارد که نگران آن است. و در حالی که بازار ایالات متحده همیشه سودآورترین بازار برای صادرات خودرو آلمان بوده است، این قبل از اعمال تعرفه های وارداتی جدید بود که در حال حاضر 25 درصد است اما می تواند در هر زمان تغییر کند. تعطیلی کارخانه ها در حال حاضر نه تنها ممکن، بلکه محتمل به نظر می رسد، چیزی که تا چند سال پیش غیرقابل تصور بود. اوایل تابستان امسال، اخباری منتشر شد مبنی بر اینکه گروه فولکس واگن در نظر دارد چهار کارخانه آلمانی خود را ببندد تا برای آینده آماده شود. در چند ماه پس از انتشار آن خبر، اوضاع برای گروه فولکس واگن بهتر نشده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش آینده برای صنعت خودروسازی آلمان به طور فزاینده ای تاریک به نظر می رسد. از آغاز قرن حاضر، خودروسازان در میان جواهرات اقتصاد آلمان بوده اند"}, {"source": "Wired", "title": "Meta’s Muse AI Assistant Rolled Out With a Serious Security Flaw", "link": "https://www.wired.com/story/metas-muse-ai-agent-zero-day/", "summary": "Meta says it issued a fix for the Muse zero-day vulnerability that would have let attackers do “whatever” they wanted on a victim’s Mac, highlighting the inherent dangers of AI helpers.", "date_str": "2026-09-23T12:54:58+00:00", "hash": "c0075da3e91cce9c", "title_fa": "دستیار هوش مصنوعی Meta’s Muse با یک نقص امنیتی جدی راه اندازی شد", "summary_fa": "متا می‌گوید اصلاحاتی را برای آسیب ld، Budget", "summary_fa": "طیف گلکسی سامسونگ از پرچمدار و بودجه گرفته تا چرخاندن و تاشو، وسعت کیهان گوشی های هوشمند را در بر می گیرد. WIRED اینجاست تا به شما در انتخابتان کمک کند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان در این مقاله برجسته شده است آیفون و سپس گوشی های Samsung Galaxy—دو برند محبوب تلفن در ایالات متحده. اما در حالی که اپل تنها شرکت پشت سیستم عامل موبایل iOS است، حتی بهترین گوشی های سامسونگ با رقابت سختی در دنیای اندروید روبرو هستند. (و بله، تلفن‌های گلکسی تلفن‌های اندرویدی هستند، اگرچه سامسونگ لایه آن را روی Android «One UI» می‌نامد.) تلفن‌های پیکسل Google دستگاه‌های اندرویدی مورد علاقه ما هستند، اما پیشنهادات سامسونگ به همان اندازه عالی هستند و اغلب سخت‌افزار بهتری دارند. در کنار گوگل، سامسونگ وعده طولانی‌ترین پشتیبانی نرم‌افزاری را برای دستگاه‌های ارزان‌قیمت و پیشرفته خود می‌دهد. این بدان معناست که شما مجبور نیستید مرتباً آن را ارتقا دهید، زیرا به‌روز، امن و بدون اشکال باقی می‌ماند. اما این غول کره ای مدل های بسیار زیادی با قیمت های متفاوت دارد، بنابراین بهترین گوشی سامسونگ کدام است؟ ما آن را در اینجا در این راهنما مرتب می کنیم. ما همچنین نکات و ترفندهایی برای استفاده حداکثری از سخت افزار جدید براق شما داریم. راهنمای تلفن همراه ما را بررسی کنید، از جمله بهترین قاب‌های Samsung Galaxy S26، بهترین قاب‌های Samsung Galaxy S25، بهترین گوشی‌های اندروید، بهترین گوشی‌های ارزان، بهترین گوشی‌های پیکسل، و بهترین گوشی‌های تاشو. به روز شده در سپتامبر 2026: ما Samsung Galaxy Z Fold8، Galaxy A37 و Galaxy Z Flip8 را اضافه کرده‌ایم. به Galaxy Z Fold8 Ultra و Galaxy S26 FE اشاره کرد. برخی از دستگاه های قدیمی را حذف کرد. به روز رسانی بخش بهترین زمان برای خرید. و قیمت های به روز شده"}, {"source": "Wired", "title": "A Startup Wants to Power Data Centers With ‘Supercritical’ Carbon Dioxide", "link": "https://www.wired.com/story/startup-power-data-centers-supercritical-co2/", "summary": "The technology could strap onto existing gas turbines and make them more efficient—but it wouldn’t do away with their emissions entirely.", "date_str": "2026-09-23T11:00:00+00:00", "hash": "c3c215e8e47d9b5c", "title_fa": "یک استارت آپ می خواهد مراکز داده را با دی اکسید کربن «فوق بحرانی» نیرو دهد", "summary_fa": "این فناوری می‌تواند به توربین‌های گاز موجود متصل شود و آنها را کارآمدتر کند، اما انتشار گازهای گلخانه‌ای آن‌ها را به طور کامل از بین نمی‌برد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان یک شرکت جدید طرحی برای کارآمدتر کردن توربین های گاز کثیف که مراکز داده را تامین می کنند، دارد: دی اکسید کربن مایع. American Supercritical چهارشنبه از مخفی کاری خارج شد و 8 میلیون دلار بودجه را اعلام کرد. این سازمان می‌خواهد توربین‌های گازی ناکارآمدی را که بسیاری از مراکز داده برای تولید برق به آن‌ها متکی هستند، با واحدهایی که می‌توانند انرژی بیشتری تولید کنند، بدون افزودن گازهای گلخانه‌ای (اگرچه توربین‌های گازسوز به انتشار آلودگی کربن ادامه می‌دهند) بازسازی کند. این فناوری همچنین می‌تواند از نظر تئوری در طیف گسترده‌ای از منابع انرژی در زمانی که تقاضای برق به طور سرسام‌آوری افزایش می‌یابد مورد استفاده قرار گیرد. سیمون شوهام، یکی از بنیانگذاران، می‌گوید: «ما می‌خواهیم با توربین‌های گازی شروع کنیم، اما در نهایت فراتر از آن گسترش پیدا می‌کنیم. اکثر نیروگاه‌های گازی بزرگ در ایالات متحده از مجموعه‌ای از موتورهای حرارتی در آنچه به عنوان فرآیند سیکل ترکیبی شناخته می‌شود استفاده می‌کنند: ابتدا، توربین‌ها برق را از سوزاندن هوای فشرده و گاز طبیعی تولید می‌کنند، سپس یک موتور جداگانه از اگزوز داغ برای تولید بخار و ایجاد انرژی اضافی استفاده می‌کند. اما به دلایل مختلف، مراکز داده در سرتاسر ایالات متحده تصمیم گرفته‌اند که عملیات خود را با آنچه به عنوان توربین‌های چرخه ساده شناخته می‌شوند، تغذیه کنند و جزء بخار را کنار بگذارند. این توربین ها نسبت به نیروگاه های سیکل ترکیبی کارایی بسیار کمتری دارند. معمولاً تنها حدود 35 درصد از انرژی توربین‌های چرخه ساده به الکتریسیته تبدیل می‌شود، در حالی که بقیه به عنوان اگزوز خارج می‌شود. (در نیروگاه‌های سیکل ترکیبی، این رقم به 60 تا 65"}, {"source": "Wired", "title": "This App Makes Your Laptop Screen Look Like Paper", "link": "https://www.wired.com/story/paperman-makes-your-laptop-screen-look-like-paper/", "summary": "The app Paperman gives your screen some added texture in an effort to make it easier on your eyes. It works best for reading, writing, or otherwise working with text.", "date_str": "2026-09-23T10:45:00+00:00", "hash": "2a923837e6ff9214", "title_fa": "این برنامه صفحه نمایش لپ تاپ شما را شبیه کاغذ می کند", "summary_fa": "برنامه Paperman به صفحه نمایش شما بافتی اضافه می دهد تا چشمان شما را راحت تر کند. برای خواندن، نوشتن یا کار با متن بهترین کار را دارد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان فناوری اکنون بسیار استریل است—همه چیز در همان صفحه های درخشان زندگی می کند. خوب است، پس وقتی برنامه‌ای را پیدا می‌کنید که بیشتر فقط برای افزودن کمی سنگ به این دستگاه‌ها وجود دارد. اینگونه است که من Paperman را تفسیر می‌کنم، که باعث می‌شود همه چیز روی صفحه رایانه شما به نظر برسد که روی کاغذ چاپ شده است. این برنامه از توسعه دهندگان فنلاندی DoublOne، این کار را با افزودن یک پوشش بافتی بر روی هر چیزی که روی صفحه می بینید انجام می دهد. من دارم این را در مک بوکم تایپ می کنم، اما همه چیز روی صفحه نمایش من به نظر می رسد که روی لوازم التحریر ممتاز است. طرفداران بازی های ویدیویی قدیمی درباره فیلترهای CRT که ظاهر نمایشگرهای محدب قدیمی را شبیه سازی می کنند، می دانند. Paperman چنین است، اما به جای تلویزیون یکپارچهسازی با سیستمعامل، کاغذ را تقلید می کند. فقط برنامه را باز کنید، نوع کاغذی را که می خواهید انتخاب کنید، و کل صفحه نمایش شما با یک بافت دلپذیر پوشیده می شود. هدف این است که به شما کمک کند روی کار خود تمرکز کنید و نمایشگر را دلپذیرتر کنید. توسعه‌دهندگان مجموعه‌ای از تحقیقات آکادمیک را جمع‌آوری کرده‌اند که در صفحه‌ای در وب‌سایت Paperman جمع‌آوری شده است، که به مطالعاتی اشاره می‌کند که نشان می‌دهد سطوح مات و بافت کاغذ به خستگی بصری کمک می‌کنند. آیا یک لایه مات یا کاغذ مجازی روی صفحه نمایش شما می تواند به همین روش کمک کند؟ Zoé Kilperti، نیمی از استودیوی دو نفره DoublOne که پشت این برنامه قرار دارد،"}, {"source": "Wired", "title": "SmartLabels QR Code Organizing System Review (2026): AI Made Sense of My Junk Draw  up to $95 for each eligible iPhone purchased by someone who felt misled about Siri’s release. You have until December 21 to submit a claim.", "date_str": "2026-09-22T18:19:13+00:00", "hash": "6f98bf87c37ecb5d", "title_fa": "چگونه می توانید کاهش 250 میلیون دلاری Apple Siri Settlement را مطالبه کنید", "summary_fa": "اپل ممکن است برای هر آیفون واجد شرایط خریداری شده توسط شخصی که در مورد انتشار سیری گمراه شده است، تا 95 دلار بپردازد. شما تا 21 دسامبر فرصت دارید درخواست خود را ارسال کنید. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان در ماه مه، اپل موافقت کرد که به عنوان بخشی از یک دادخواست دسته جمعی به دلیل ادعاهایی که این شرکت ابزارهای هوش اپل خود، به ویژه تعمیرات اساسی Siri AI با تاخیر طولانی مدت را به تعویق انداخته، 250 میلیون دلار بپردازد. اگرچه دستیار صوتی بهبود یافته Siri AI اکنون برای دارندگان آیفون های جدیدتر از طریق iOS 27 در دسترس است، اما ممکن است همچنان واجد شرایط دریافت پول نقد برای خریدهای گذشته باشید. این تسویه حساب مشتریانی در ایالات متحده را پوشش می دهد که از 10 ژوئن 2024 تا 29 مارس 2025 خریدهای خود را انجام داده اند و برخی از مدل های iPhone 15 یا iPhone 16 را از اپل خریداری کرده اند. اگر واجد شرایط باشید، ممکن است برای هر گوشی تا 95 دلار دریافت کنید. این توافق حول ارتقای ویژگی های سیری توسط اپل برای فروش آیفون می چرخد. در بخشی از بیانیه ای که باید هنگام پر کردن فرم ادعا امضا کنید، آمده است: «انتظار داشتم یک ویژگی هوشمند سیری اپل را دریافت کنم و آن را دریافت نکردم. به عنوان بخشی از توافق، اپل هرگونه تخلف را رد می کند. در بخشی از بیانیه اپل از ماه می در مورد تسویه حساب آمده است: «ما این موضوع را حل کردیم تا تمرکز خود را بر انجام کارهایی که به بهترین شکل انجام می‌دهیم، ارائه نوآورانه‌ترین محصولات و خدمات به کاربران خود بمانیم. برای ثبت ادعا، به وب سایت اختصاصی مراجعه کنید: smartphoneaisettlement.com. روی دکمه آبی در گوشه سمت راست بالای صفحه با عنوان"}, {"source": "Wired", "title": "Rabbit Is Back, This Time With an AI Agent App", "link": "https://www.wired.com/story/rabbit-r1-os3-jesse-lyu/", "summary": "Two years after tr munication-starts-with-the-recipient", "summary": "I don’t know about you, but when I read something I can tell was clearly produced by a large language model, it puts me off immediately. I lose interest, and I sometimes lose trust in whoever sent it, especially when they clearly haven’t put any thought into it. That reaction is becoming a lot more [ ] This story continues at The Next Web", "date_str": "2026-09-23T13:46:55+00:00", "hash": "3179f05a73c2872f", "title_fa": "چرا ارتباط موثر هوش مصنوعی با گیرنده شروع می شود؟", "summary_fa": "شما را نمی‌دانم، اما وقتی چیزی را می‌خوانم که می‌توانم بگویم به وضوح توسط یک مدل زبان بزرگ تولید شده است، فوراً من را ناامید می‌کند. علاقه‌ام را از دست می‌دهم، و گاهی اعتمادم را به کسی که آن را فرستاده از دست می‌دهم، به‌خصوص وقتی که به وضوح فکری به آن نکرده‌اند. این واکنش بسیار بیشتر می شود [ ] این داستان در The Next Web ادامه می یابد. آنقدر رایج شده است که 40٪ از کارگران می گویند که در ماه گذشته کار هوش مصنوعی دریافت کرده اند و پرداختن به آن به طور متوسط ​​تقریباً دو ساعت برای این کارگران هزینه دارد. این مالیات نامرئی سالانه میلیون ها دلار برای یک سازمان بزرگ جمع می شود. مدیر عامل ما، ویکتور ریپاربلی، اخیراً در یک یادداشت داخلی نام دیگری برای این موضوع گذاشته است: \"هوش مصنوعی\". هوش مصنوعی تولید محتوا را ارزان‌تر می‌کند بدون اینکه آن را برای کسی که آن را دریافت می‌کند مفیدتر کند. مشکل اصلی این است که فراموش می کنیم چرا در وهله اول با هم ارتباط برقرار می کنیم. ما یادداشت‌ها، تابلوها یا به‌روزرسانی‌ها را به خاطر خودشان نمی‌نویسیم. ما آنها را می نویسیم تا چیزی را در طرف دیگر تغییر دهیم: آنها را مطلع کنیم، آموزش دهیم، آنها را وادار به عمل کنیم یا از آنها بینش بیابیم. گیرنده کسی است که اهمیت دارد. تنها معیار واقعی ارتباط موفق این است که آیا آن کار را برای آنها انجام داده است، نه اینکه چقدر سریع یا ارزان تولید شده است. هنگامی که طرف گیرنده را می گیرید، بلافاصله آشکار می شود که هوش مصنوعی را نمی توان به عنوان یک میانبر مشاهده کرد و باید آزمایش شود. این فلسفه منجر به دو قانون داخلی در تیم من شده است. قانون اول: شما نمی‌توانید از هوش مصنوعی ord این دور را رهبری کرد. Tekever گفت که این اولین سرمایه گذاری مستقیم UC Investments در اروپا است. بیلی گیفورد یک حامی موجود است. Merlyn Advisors به ​​عنوان یک سرمایه گذار استراتژیک جدید پیوست. سر بن والاس، وزیر دفاع سابق بریتانیا، در آنجا به عنوان مدیر پورتفولیو کار می کند. Crescent Cove، Ventura Capital و Iberis Capital که قبلاً سهام داشتند نیز دوباره سرمایه گذاری کردند. Tekever رشد خود را تمام نکرده است. گفته شد که بسته اول اکثر 580 میلیون دلار را پوشش می دهد. انتظار می رود که بسته شدن بیشتر در ماه های آینده سرمایه گذاران استراتژیک جدیدی را به همراه داشته باشد. این شرکت گفت که این پول برای توسعه بین المللی، ظرفیت تولید و فناوری و خریدهای استراتژیک تامین مالی خواهد شد. همچنین توسعه سیستم‌های خودران مبتنی بر هوش مصنوعی را سرعت می‌بخشد. مندز به بلومبرگ گفت که Tekever بیش از 1500 کارمند دارد و در حال افزودن خطوط تولید و زیرساخت در کشورهایی از جمله بریتانیا و فرانسه است. او گفت که این شرکت قصد دارد از عملیات موجود خود به عنوان بستری برای عرضه فناوری ها و شرکت های به دست آمده به بازار استفاده کند."}, {"source": "The Next Web", "title": "Mozilla puts up posters criticising Musk and Zuckerberg across New York", "link": "https://thenextweb.com/news/mozilla-posters-musk-zuckerberg-new-york", "summary": "The Mozilla Foundation has begun putting up posters across New York criticizing tech billionaires, including Mark Zuckerberg and Elon Musk. The campaign went up this week, Business Insider reported. The foundation is the nonprofit that owns Mozilla Corporation, the maker of Firefox. Its posters set the work of Musk, Zuckerberg and Jeff Bezos against projects [ ] This story continues at The Next Web", "date_str": "2026-09-23T12:57:52+00:00", "hash": "c45b889cfe158d45", "title_fa": "موزیلا پوسترهایی در انتقاد از ماسک و زاکربرگ در سراسر نیویورک نصب می کند", "summary_fa": "بنیاد موزیلا شروع به نصب پوسترهایی در سراسر نیویورک در انتقاد از میلیاردرهای فناوری از جمله مارک زاکربرگ و ایلان ماسک کرده است. بیزینس اینسایدر گزارش داد که این کمپین این هفته افزایش یافت. این بنیاد یک سازما n change by the day. Fearn, the modern patent prosecution firm for startups, was built around a different model. The company has launched an AI-native patent firm. [ ] This story continues at The Next Web", "date_str": "2026-09-23T12:00:47+00:00", "hash": "2643a67c8322ed2f", "title_fa": "شرکت ثبت اختراع Fearn بومی هوش مصنوعی راه اندازی شد تا ساعت قابل پرداخت را به عهده بگیرد", "summary_fa": "یک درخواست ثبت اختراع معمولی می تواند 30 تا 40 ساعت وقت وکالت داشته باشد و هزینه حقوقی آن بین 18000 تا 40000 دلار است. استارت‌آپ‌ها ماه‌ها منتظر می‌مانند تا از فناوری‌هایی محافظت کنند که می‌تواند روز به روز تغییر کند. Fearn، شرکت مدرن تعقیب ثبت اختراع برای استارت‌آپ‌ها، بر اساس مدل متفاوتی ساخته شده است. این شرکت یک شرکت ثبت اختراع بومی هوش مصنوعی راه اندازی کرده است. [ ] این داستان در The Next Web ادامه دارد. این شرکت 5.5 میلیون دلار از Kindred Ventures، a16z Speedrun، Designer Fund و Essence VC جمع آوری کرده است. Fearn وارد بازار 14 میلیارد دلاری ثبت اختراع جهانی می شود و شرکت های در مراحل اولیه هر سال 150000 درخواست ثبت اختراع جدید را ثبت می کنند. هان کیم و آنجلا گائو، فارغ التحصیلان کالتک، Fearn را پس از مشاهده همان مشکل از طرف مقابل، تأسیس کردند. کیم اختراعات خود را در موریسون فورستر تحت پیگرد قانونی قرار داده بود، در حالی که گائو مدرک دکترای خود را در علوم کامپیوتر و هوش مصنوعی دریافت کرد. آنها در ابتدا نرم افزاری را برای شرکت های حقوقی ساختند. آنها به سرعت متوجه شدند که ابزار بهتر به تنهایی نمی تواند مدل را درست کند. صرفه جویی در زمان به معنای از دست رفتن درآمد بود و IP حساس پیش از تشکیل پرونده، استقرار ایمن هوش مصنوعی را دشوار می کرد. بنابراین آنها به جای آن شرکت را حول این فناوری ساختند. امروزه Fearn صدها کاربر دارد، از استارت‌آپ‌های سرمایه‌گذاری شده تا شرکت‌های عمومی. هان کیم، یکی از بنیانگذاران و مدیرعامل Fearn، گفت: \"ما Fearn را شروع کردیم زیرا فناوری و اقتصاد حقوق ثبت اختراع اکنون جدایی ناپذیر هستند.\" «اگر هوش مصنوعی کار را سریع‌تر می‌کند، مشتری باید در زمان چرخش و صورتحساب احساس کند. این تنها در صورتی کار می کند که"}, {"source": "The Next Web", "title": "Volkswagen becomes the first US volume brand to offer in-car gaming", "link": "https://thenextweb.com/news/volkswagen-airconsole-in-car-gaming-2027-models", "summary": "Volkswagen of America, Inc. is introducing N-Dream’s AirConsole in-car gaming platform on select model year 2027 vehicles. It becomes the first volume automotive brand in the United States to offer this in-vehicle entertainment experience. AirConsole allows vehicle occupants to play multiplayer games directly through the vehicle’s infotainment display. They use their compatible smartphones as game [ ] This story continues at The Next Web", "date_str": "2026-09-23T12:00:25+00:00", "hash": "60ba572004a0ad68", "title_fa": "فولکس واگن به اولین برند آمریکایی تبدیل می شود که بازی های داخل خودرو را ارائه می دهد", "summary_fa": "فولکس واگن آمریکا، پلتفرم بازی N-Dream's AirConsole را در خودروهای منتخب سال 2027 معرفی می کند. این اولین برند خودرویی حجمی در ایالات متحده است که این تجربه سرگرمی در داخل خودرو را ارائه می دهد. AirConsole به سرنشینان خودرو این امکان را می دهد که مستقیماً از طریق صفحه نمایش اطلاعات سرگرمی خودرو، بازی های چند نفره را انجام دهند. آنها از تلفن های هوشمند سازگار خود به عنوان بازی استفاده می کنند [ ] این داستان در The Next Web Launching با کاتالوگ 20 بازی ادامه دارد، AirConsole مجموعه رو به رشدی از تجربیات بازی های چند نفره و غیررسمی را ارائه می دهد. بازیکنان به سادگی یک کد QR را روی صفحه اسکن می کنند تا گوشی های هوشمند سازگار خود را به عنوان کنترلر متصل کنند. سپس آنها می توانند با هم بازی کنند. مجموعه راه اندازی شامل عناوین شناخته شده جهانی مانند PAC-MAN™ Championship Edition، UNO® Car Party!، Tetris® و غیره است. Rachael Zaluzec، مدیر بازاریابی فولکس واگن آمریکا، گفت: \"فولکس واگن متعهد به ایجاد تجربیاتی است که مردم را گرد هم می آورد و هر تعاملی را با برند ما معنادارتر می کند.\" «بازی در خودرو کمک می‌کند لحظات روزمره را به تجربه‌های مشترک تبدیل کند، و به خانواده‌ها و دوستان راه جدیدی برای ارتباط، خندیدن و گذراندن وقت با هم در حالی که از فولکس واگن خود لذت می‌برند، می‌دهد.» آمریکای شمالی بزرگترین یی دریافتند لایه‌های رشد صدف حلزون مانند حلقه‌های درخت، شدت بارندگی‌ها و طوفان‌های باستانی را ثبت و حفظ می‌کنند.", "date_str": "2026-09-23T13:05:00+00:00", "hash": "e63fb2175d06251d", "title_fa": "حلزون‌ها تاریخ طوفان‌های گذشته را روی صدف خود حمل می‌کنند", "summary_fa": "پژوهشگران استرالیایی دریافتند لایه‌های رشد صدف حلزون مانند حلقه‌های درخت، شدت بارندگی‌ها و طوفان‌های باستانی را ثبت و حفظ می‌کنند. تبلیغات شاید صدف حلزون‌ها در نگاه اول فقط پوششی سخت برای محافظت از بدن این جانوران کوچک به نظر برسد، اما پژوهش جدید نشان می‌دهد این ساختار می‌تواند مانند دفترچه خاطرات طبیعی، اطلاعاتی درباره آب‌وهوا و رویدادهای شدید اقلیمی گذشته در خود نگه دارد. پژوهشگران دانشگاه کوئینزلند استرالیا دریافته‌اند که لایه‌های رشد صدف حلزون‌های خشکی می‌توانند نشانه‌هایی از بارندگی‌های شدید، طوفان‌ها و حتی شرایط محیطی هزاران سال قبل را ثبت کنند. راز ثبت تاریخچه آب‌وهوای گذشته در صدف حلزون، به شیوه رشد آن مربوط می‌شود. حلزون از همان ابتدای زندگی صدف کوچکی دارد که با بزرگ‌تر شدن جانور، لایه‌به‌لایه رشد می‌کند و اطلاعات محیط اطراف را در خود نگه می‌دارد. جادوی مخاط حلزون؛ فرمول مخفی طبیعت برای تبدیل یک ماده به پنج ابزار 18 مرداد 05 مطالعه &#x27; 3 از آنجا که حلزون نمی‌تواند صدف مارپیچی خود را بازتر کند، با بزرگ‌تر شدن بدنش، لایه‌های جدیدی به لبه باز صدف اضافه می‌شود. اندامی به نام «مانتل» یا جبه که پشت حلزون قرار دارد، ماده‌ای به نام کربنات کلسیم ترشح می‌کند. این ماده در تماس با هوا سخت می‌شود و بخش تازه‌ای از صدف را شکل می‌دهد. در نتیجه، صدف حلزون مانند حلقه‌های رشد درخت، مرحله‌به‌مرحله بزرگ می‌شود و هر لایه اطلاعاتی از دوره‌ای مشخص از زندگی جانور را در خود حفظ می‌کند. پژوهشگران برای بررسی این موضوع، صدف گونه‌ای حلزون نواری ( Figuladra bayensis ) را مطالعه کردند. آنها در بخش‌هایی از این صدف مقدار بیشتری رادیوکربن پیدا کردند که به آزمایش‌های هسته‌ای انجام‌شده در استرالیا در دهه ۱۹۶۰ مربوط بود. بررسی صدف حلزون نواری بیگندن نشان داد تغییرات رشد آن با دوره‌های بارندگی شدید و طوفان‌های مشخص سال‌های ۲۰۱۵ و ۲۰۱۷ مرتبط بوده است"}, {"source": "Zoomit", "title": "هوش مصنوعی در خط مقدم؛ دیجی‌کالا چگونه همزمان تجربه خرید و ساختار هزینه‌ها را تغییر داد؟", "link": "https://www.zoomit.ir/tech-iran/467759-digikala-ai-transforming-shopping-experience-and-cost-structure/", "summary": "گزارش سال ۱۴۰۴ دیجی‌کالا نشان می‌دهد که هوش مصنوعی در این پلتفرم از یک ویژگی جانبی، به هسته مرکزی عملیات و تجربه کاربری تبدیل شده است.", "date_str": "2026-09-23T12:58:57+00:00", "hash": "e79c3a8dd4bcfd66", "title_fa": "هوش مصنوعی در خط مقدم؛ دیجی‌کالا چگونه همزمان تجربه خرید و ساختار هزینه‌ها را تغییر داد؟", "summary_fa": "گزارش سال ۱۴۰۴ دیجی‌کالا نشان می‌دهد که هوش مصنوعی در این پلتفرم از یک ویژگی جانبی، به هسته مرکزی عملیات و تجربه کاربری تبدیل شده است. تبلیغات یکی از نوآوری‌های مهم امسال، تجهیز خودِ گزارش سالانه دیجی‌کالا به یک دستیار هوش مصنوعی است؛ قابلیتی که روی لندینگ گزارش قرار گرفته و به کاربران اجازه می‌دهد به‌جای مطالعه متن، داده‌های مورد نیاز خود را مستقیماً از طریق پرسش‌وپاسخ استخراج کنند. در بخش دیگری از این گزارش و در فصل «ما و خلق تجربه‌های هوشمند» در فصل پنجم این گزارش، با ارائه آمارهای دقیق نشان می‌دهد که ابزارهای مبتنی بر هوش مصنوعی چگونه هم در لایه تعامل با مشتری و هم در بهینه‌سازی هزینه‌های پلتفرم اثرگذار بوده‌اند. کپی لینک تحول در جست‌وجو و تصمیم‌گیری کاربر بر اساس داده‌های منتشرشده، ابزارهای هوشمند مسیر خرید کاربران را کوتاه‌تر و دقیق‌تر کرده‌اند. قابلیت «خلاصه نظرات» که اکنون برای بیش از ۴۲۴ هزار محصول فعال است، ماهانه توسط یک میلیون نفر استفاده می‌شود و ۵.۲ میلیون بار کلیک دریافت می‌کند. این ویژگی با ثبت رضایت ۸۸ درصدی کاربران، توانسته نرخ افزودن کالا به سبد خرید را ۴ درصد افزایش دهد. هم‌زمان، جست‌وجوی تصویری پلتفرم نیز رشد قابل‌توجه ۲۰ برابری را در سال ۱۴۰۴ تجربه کرده است. دستیار هوشمند دیجی‌کالا نیز در این سال با جذب ۱.۱۷ میلیون کاربر یکتا، به یک سرویس کلیدی تبدیل شد. ثبت ۲.۵۲ میلیون مکالمه و تبادل ۷.۱ میلیون پیام، نشان‌دهنده تمایل کاربران به عبور از جست‌وجوی سنتی و استفاده از مکالمه مستقیم برای یافتن کالا و مقایسه قیمت‌هاست. سیستم‌های پیشنهاددهی هوشمند نیز مستقیماً بر درآمدهای پلتفرم اثر گذاشته‌اند؛ کلیک روزانه ۱۴۰ هزار کاربر روی بخش «در کنارش خریداری شده» باعث رشد ۱۰۰ درصدی درآمد روزانه این بخش شده و بازدید ۴۰۰ هزار کاربر از «کالاهای مشابه»، رشد درآمد ۲۰۰ درصدی را برای آن به همراه داشته است."}, {"source": "Zoomit", "title": "مدل های مرسدس بنز برقی راساموتور", "link": "https://www.zoomit.ir/pr/467758-mercedes-benz-electric-cars-rasa-motor/", "summary": "راسا موتور ۵ مدل از خودروهای تمام‌الکتریکی و پلاگین‌هیبرید مرسدس بنز شامل EQA، EQB و EQE را برای بازار ایران معرفی کرد.", "date_str": "2026-09-23T12:51:20+00:00", "hash": "3175bb7b48492189", "title_fa": "مدل های مرسدس بنز برقی راساموتور", "summary_fa": "راسا موتور ۵ مدل از خودروهای تمام‌الکتریکی و پلاگین‌هیبرید مرسدس بنز شامل EQA، EQB و EQE را برای بازار ایران معرفی کرد. این مطلب صرفا جنبه تبلیغاتی داشته و زومیت هیچ مسئولیتی را در رابطه با آن نمی‌پذیرد راسا موتور ۵ مدل از خودروهای تمام‌الکتریکی و پلاگین‌هیبرید مرسدس بنز شامل EQA، EQB و EQE را برای بازار ایران معرفی کرد. تبلیغات چکیده : دوران غرش موتورها و تعویض دنده‌های پردردسر به سر آمده؛ حالا سکوت مطلق آکوستیک، شتاب‌های زیر ۵ ثانیه و رانندگی پاک، معیار جدید لوکس‌سواری در جهان است! با ورود جدیدترین سبد محصولات الکتریکی و پلاگین‌هیبرید مرسدس بنز توسط راسا موتور خاورمیانه، این استانداردهای فوق‌پیشرفته به ایران رسیده‌اند. در این مقاله جامع، ۵ مدل شگفت‌انگیز این برند را زیر ذره‌بین برده‌ایم: از کراس‌اوور شهری و چابک EQA و شاسی‌بلند جادار خانوادگی EQB، تا اوج تجمل و آیرودینامیک در سدان و SUV قدرتمند EQE با فناوری‌های خیره‌کننده‌ای چون هایپراسکرین، و در نهایت سدان محوربلند C350 e L که با سیستم پلاگین‌هیبرید، ترکیبی از قدرت بنزین و پاکی برق را ارائه می‌دهد. اگر می‌خواهید با مشخصات فنی، برد پیمایش و امکانات بی‌نظیر این سفینه‌های هوشمند مرسدس بنز آشنا شوید، همین حالا کلیک کنید و وارد دنیای آینده شوید! تجربه سواری با خودروهای مدرن، دیگر با غرش موتور و تعویض دنده تعریف نمی‌شود، سکوت آکوستیک کابین و شتاب آنی زیر ۵ ثانیه معیار جدید لوکس‌سواری است. ورود سبد محصولات الکتریکی و پلاگین‌هیبرید اشتوتگارت توسط راسا موتور خاورمیانه، این استاندارد جهانی را وارد کشور کرد. حضور مرسدس بنز برقی در ایران یعنی دستیابی به پلتفرم هوشمند MBUX، تعلیق بادی تطب  ادامه با بیان این که «کودکانی در این مدرسه جان باختند که هیچ نسبتی با جنگ نداشتند» تصریح کرد: «من این جنایت را صریح و بی هیچ ملاحظه‌ای محکوم می‌کنم.» معاون علمی رئیس‌جمهور با اشاره به این که «آمریکا و رژیم صهیونیستی هیچ توجیهی برای کشتن کودکان و حمله به مدرسه ندارند» اضافه کرد: «هیچ ادعای امنیتی، نظامی و سیاسی نمی‌تواند مرگ کودکی که پشت نیمکت مدرسه نشسته را توجیه کند.» افشین هم‌چنین گفت: «ما این جنایت را نه فراموش می‌کنیم، نه عادی می‌پنداریم و نه می‌گذاریم در هیاهوی جنگ به حاشیه رانده شود. بر این باوریم که عدالت باید در حق همه مسئولان این جنایت اجرا شود.» او در ادامه نیز تاکید کرد: «درد شجره طیبه درد راه‌هایی است که پیش از این که انتخاب شود، ناتمام ماند. این است معنی شجره طیبه برای من: این‌جا سرزمین آینده ناتمام است.»"}, {"source": "Zoomit", "title": "اسکات بسنت مدیر ستاد هوش مصنوعی ترامپ می‌شود؟", "link": "https://www.zoomit.ir/ai-articles/467741-scott-bessent-frontrunner-trump-ai-czar/", "summary": "اسکات بسنت، وزیر خزانه‌داری آمریکا، جدی‌ترین گزینه برای هدایت سیاست‌های کلان هوش مصنوعی دونالد ترامپ است.", "date_str": "2026-09-23T07:52:23+00:00", "hash": "854677dd57abe0fb", "title_fa": "اسکات بسنت مدیر ستاد هوش مصنوعی ترامپ می‌شود؟", "summary_fa": "اسکات بسنت، وزیر خزانه‌داری آمریکا، جدی‌ترین گزینه برای هدایت سیاست‌های کلان هوش مصنوعی دونالد ترامپ است. تبلیغات ساختار مدیریتی و نظارتی حوزه‌ی فناوری در ایالات متحده دستخوش تحولات تازه‌ای شده است و کاخ سفید تلاش می‌کند با سازماندهی مجدد رهبری فناوری‌های نوین، راهبردهای بلندپروازانه‌ی خود را به‌شکل منسجم‌تری پیگیری کند. افزایش نگرانی‌ها درباره‌ی پیامدها و ریسک‌های ناشی از توسعه‌ی شتابان مدل‌های محاسباتی، واشینگتن را به بازتعریف سازوکارهای نظارتی واداشته است. بر اساس گزارش اختصاصی سمافور ، اسکات بسنت وزیر خزانه‌داری ایالات متحده اکنون به‌عنوان بخت نخست برای تصدی جایگاه مشاور ارشد و هماهنگ‌کننده‌ی سیاست‌های هوش مصنوعی دونالد ترامپ مطرح شده است. سه منبع آگاه تأیید کرده‌اند که بررسی‌ها برای واگذاری این مسئولیت کلیدی به بسنت در جریان است، هرچند گزینه‌های نام‌آشنای دیگری نیز در فهرست ارزیابی قرار دارند. بسنت تنها نام مطرح در 26-09-23T06:10:00+00:00", "hash": "6628782dac700890", "title_fa": "افتتاح سالن موسیقی اپل در لندن با قابلیت ضبط صدای سه‌بعدی", "summary_fa": "اپل سالن پیشرفته‌ی Apple Music Hall را با ظرفیت ۶۰۰ نفر در نیروگاه تاریخی بترسی لندن افتتاح کرد. تبلیغات اپل سالن پیشرفته‌ی Apple Music Hall را در نیروگاه تاریخی بترسی لندن افتتاح کرد تا ارتباط نزدیک‌تری میان هنرمندان و طرفداران در اجراهای زنده شکل بگیرد. معماری سالن از آجرکاری‌های تاریخی، قوس‌های شیاردار، بالکن‌های برنزی و دیواری شیشه‌ای با چشم‌انداز رودخانه‌ی تیمز الهام گرفته است. فضای ۶۰۰ نفره‌ی سالن مجهز به استیج ۱۱٫۵ متری با قابلیت تغییر چیدمان و سیستم صوتی متشکل از ۴۸ اسپیکر برای پخش صدای فضایی است. هنرمندان می‌توانند اجراهای زنده را با ترکیب صدای فراگیر و کیفیت استودیویی روی صحنه ببرند. الیور شوسر ، معاون ارشد بخش اپل موزیک و محتوای بین‌الملل اپل، گفت: «عشق عمیق اپل به موسیقی به همان روزهای نخست برمی‌گردد، از عرضه‌ی آی‌پاد و جشنواره‌ی موسیقی آی‌تیونز گرفته تا آغاز به کار اپل موزیک. اکنون با افتتاح Apple Music Hall، بار دیگر با حمایت از موسیقی زنده به شیوه‌ای که تنها از عهده‌ی اپل برمی‌آید، گامی بی‌سابقه در تعهد خود به هنرمندان و طرفداران برمی‌داریم.» بخش پشتیبانی سالن از دو استودیوی اختصاصی ضبط و میکس حرفه‌ای و زیرساخت بیش از ۱۶ دوربین پشتیبانی می‌کند که امکان فیلم‌برداری هم‌زمان با دوربین‌های سنتی پخش زنده و آیفون را دارد. اجراهای زنده به‌صورت جهانی پخش مستقیم خواهند شد تا مخاطبان خارج از لندن نیز امکان تماشای برنامه‌ها را داشته باشند. زین لو ، مدیر خلاقیت جهانی اپل موزیک و مجری ارشد Apple Music 1، گفت: «در اپل موزیک، ما اهمیت زیادی به موسیقی، هنرمندان سازنده‌ی آن و داستان زندگی‌شان می‌دهیم. ما همیشه به‌دنبال فرصت‌های تازه برای پیوند دادن هنرمندان و طرفداران هستیم؛ چون خودمان نیز طرفداریم. چه راهی بهتر از یک مکان جدید برای بزرگداشت این رابطه، جایی که بتوانیم موسیقی شگفت‌انگیز را در فضایی فوق‌العاده تجربه کنیم و آن را با جهان به اشتراک بگذاریم."}, {"source": "Zoomit", "title": "اپل اولین بتای عمومی iOS 27.2 را در دسترس قرار داد", "link": "https://www.zoomit.ir/os/467725-apple-releases-ios-27-2-public-beta/", "summary": ند. پیوند رویدادهای امروز را باید در لحظه‌هایی جست که آدم‌ها به راهی امتحان‌نشده اعتماد کردند. حاصل بعضی از آن تصمیم‌ها اکنون زیر انگشتان ما، در کابل‌های کف اقیانوس و حتی در محاسبه‌ی مدار سیاره‌ای دوردست حضور دارد. فهرست مطالب اندروید ۱ از محیط آزمایش بیرون آمد جرقه‌ای که کارگاه رابرت بوش را جهانی کرد نپتون پیش از تلسکوپ روی کاغذ پیدا شد نینتندو بازی را با ۴۸ کارت گل‌دار آغاز کرد HTC Dream اولین گوشی اندرویدی شد چارلز کائو راه عبور اینترنت از تار شیشه‌ای را گشود کپی لینک اندروید ۱ از محیط آزمایش بیرون آمد ۱۸ سال پیش، اندروید دیگر فقط وعده‌ای برای توسعه‌دهندگان نبود. گوگل نسخه‌ی نهایی Android 1.0 SDK را منتشر کرد و تی‌موبایل نیز T-Mobile G1 را به‌عنوان نخستین گوشی مجهز به سیستم‌عامل تازه نمایش داد. برنامه‌نویسان از آن لحظه می‌توانستند به رابط‌های نرم‌افزاری پایدار تکیه کنند و برنامه‌هایشان را برای محصولی واقعی بسازند. اولین نسخه‌ی اندروید، موبایل را به بستری برای رقابت توسعه‌دهندگان بدل کرد اندروید مارکت قرار بود همراه گوشی در دسترس قرار بگیرد و راهی نسبتا باز برای توزیع برنامه‌ها بسازد. اهمیت رونمایی تنها به یک سیستم‌عامل تازه محدود نماند. اندروید سازندگان سخت‌افزار، اپراتورها و توسعه‌دهندگان مستقل را در اکوسیستمی مشترک گرد آورد و موبایل را به بستری تبدیل کرد که ارزشش با تعداد و تنوع برنامه‌ها افزایش می‌یافت. ردپای همان تصمیم هنوز در میلیاردها دستگاه دیده می‌شود. فروشگاه‌های اپلیکیشن، به‌روزرسانی نرم‌افزاری و رقابت بر سر خدمات موبایلی امروز عادی به نظر می‌رسند، اما Android 1.0 از نخستین گام‌های جدی برای تثبیت چنین الگویی بود."}, {"source": "Zoomit", "title": "«به وایس‌سیتی خوش آمدید»؛ تابلو یک میلیون دلاری GTA 6 در میامی نصب شد!", "link": "https://www.zoomit.ir/gaming/467720-rockstar-gta-6-miami-sign/", "summary": "راک‌استار گیمز با پرداخت نزدیک به یک میلیون دلار، تابلوی تبلیغاتی عظیمی از GTA 6 را روی سقف ورزشگاه میامی نصب کرد.", "date_str": "2026-09-23T05:28:14+00:00", "hash": "d98f2f712d83f95b", "title_fa": "«به وایس‌سیتی خوش آمدید»؛ تابلو یک میلیون دلاری GTA 6 در میامی نصب شد!", "summary_fa": "راک‌استار گیمز با پرداخت نزدیک به یک میلیون دلار، تابلوی تبلیغاتی عظیمی از GTA 6 را روی سقف ورزشگاه میامی نصب کرد. تبلیغات راک‌استار گیمز با صرف هزینه‌ای نزدیک به یک میلیون دلار، تابلوی تبلیغاتی بزرگی با عبارت «به وایس‌سیتی خوش آمدید» را بر فراز سقف ورزشگاه Kaseya Center در شهر میامی نصب کرد. مسافرانی که با هواپیما از بالای این ورزشگاه عبور می‌کنند، می‌توانند پیام خوش‌آمدگویی بازی GTA 6 را روی سقف مشاهده کنند. منطقه‌ی میامی-دید طبق توافق تبلیغاتی، مبلغ ۹۷۵ هزار دلار از راک‌استار دریافت می‌کند. مسئولان محلی پیش‌تر بر سر پذیرش این تبلیغات به دلیل محتوای خشن بازی بحث‌های فراوانی داشتند؛ اما در نهایت با اجرای طرح موافقت کردند. مذاکراتی هم درباره‌ی رویدادهای جانبی و تصاحب تبلیغاتی فرودگاه در ماه اوت مطرح شده بود که هنوز وضعیت اجرایی آنها مشخص نیست. ورزشگاه Kaseya Center میزبان بازی‌های تیم بسکتبال Miami Heat در لیگ NBA است و نخستین دیدار خانگی فصل در تاریخ ۲۱ اکتبر (۳۰ مهر) برگزار می‌شود. مدارک فاش‌شده نشان می‌دهد تابلوی بازی حداقل تا یک سال پس از نصب یا تا پایان آخرین بازی خانگی فصل ۲۷-۲۰۲۶ بر فراز ورزشگاه باقی خواهد ماند. بازی GTA 6 در تاریخ ۱۹ نوامبر (۲۸ آبان) برای کنسول‌های ایکس باکس سری ایکس و اس و پلی استیشن ۵ منتشر خواهد شد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "گوشی موتورولا سیگنچر ۲۷ با طراحی بحث‌برانگیز و قدرتمندترین تراشه کوالکام معرفی شد", "link": "https://www.zoomit.ir/mobile/467717-motorola-signature-27-qualcomm-extreme-chip/", "summary": "موتورولا با سیگنچر ۲۷، نخستین گوشی مجهز به تراشه‌ی پرچمدار جدید کوالکام را همراه با دوربین ۲۰۰ مگاپیکسلی رونمایی کرد.", "date_str": "2026-09-23T04:42:03+00:00", "hash": "415accdb3dec7fe1", "title_fa": "گوشی موتورولا سیگنچر ۲۷ با طراحی بحث‌برانگیز و قدرتمندترین تراشه کوالکام معرفی شد", "summary_fa": "موتورولا با سیگنچر ۲۷، نخستین گوشی مجهز به تراشه‌ی پرچمدار جدید کوالکام را همراه با دوربین ۲۰۰ مگاپیکسلی رونمایی کرد. تبلیغات موتورولا اولین برندی محسوب می‌شود که گوشی مجهز به تراشه‌ی رده‌بالای Snapdragon 8 Elite Extreme Gen 6 کوالکام را در گوشی جدیدش قرار داد. سیگنچر ۲۷ ظاهرا پیشرفته‌ترین پرچمدار موتورولا در چند سال اخیر خواهد بود. قیمت گوشی و تاریخ عرضه هنوز مشخص نیست؛ اما تازه‌ترین حسگر دوربین سونی و سیستم صوتی طراحی‌شده با همکاری Bang Olufsen را در فهرست محدود مشخصات گوشی می‌بینیم خریداران احتمالی پیش از توجه به امکانات فنی باید با طراحی نامتعارف گوشی کنار بیایند؛ ظاهری که احتمالا واکنش‌های کاملا متفاوتی برمی‌انگیزد. بدنه‌ی باریک آلومینیومی سیگنچر ۲۷ در رنگ مشکی با نام Pantone Coal Smoke یا سبز با نام Pantone Capulet Olive عرضه می‌شود. بدنه در بخش پشتی با شیبی تدریجی به قسمتی می‌رسد که موتورولا آن را «کمرا پلین» می‌نامد. چهار لنز و یک فلاش با چیدمانی قوس‌مانند و عجیب روی همان بخش جای گرفته‌اند و ظاهر منحصربه‌فردی به گوشی می‌دهند. تنها تعداد محدودی از مشخصات سیگنچر ۲۷ تأیید شده‌اند؛ اما قابلیت‌های فنی معرفی‌شده جذاب به نظر می‌رسند. نشان B O کنار دوربین‌ها از مشارکت Bang Olufsen در طراحی بخش صوتی خبر می‌دهد. موتورولا وعده‌ی هفت سال به‌روزرسانی اندروید را داده؛ سطحی از پشتیبانی که هنوز در میان گوشی‌های همین برند کم‌سابقه به‌شمار می‌رود. در پنل پشت شاهد دوربین تله‌فوتو پریسکوپی ۲۰۰ مگاپیکسلی و دوربین اصلی ۵۰ مگاپیکسلی هستیم. جذابیت اصلی دوربین ۵۰ مگاپیکسلی به استفاده از حسگر جدید سونی با نام Lytia 910 و فناوری LOFIC مربوط می‌شود. حسگری که در ویوو X500 پرو مکس نیز دیده شد و در همان گوشی گستره‌ی دینامیکی ۱۷ استاپی را فراهم می‌کند؛ باید دید سیگنچر ۲۷ هم به عملکردی هم‌سطح دست می‌یابد یا نه."}, {"source": "Zoomit", "title": "اسنپدراگون 8 الیت و الیت اکستریم نسل 6 معرفی شدند؛ آغاز رقابت نفس‌گیر با A20 Pro", "link": "https://www.zoomit.ir/processor/467714-snapdragon-8-elite-gen6-announced/", "summary": "کوالکام با اسنپدراگون 8 الیت نسل 6 و مدل Extreme، مرز تازه‌ای میان تراشه‌های پرچمدار اندرویدی ترسیم می‌کند.", "date_str": "2026-09-23T04:40:52+00:00", "hash": "7a12fc7694edbb0d", "title_fa": "اسنپدراگون 8 الیت و الیت اکستریم نسل 6 معرفی شدند؛ آغاز رقابت نفس‌گیر با A20 Pro", "summary_fa": "کوالکام با اسنپدراگون 8 الیت نسل 6 و مدل Extreme، مرز تازه‌ای میان تراشه‌های پرچمدار اندرویدی ترسیم می‌کند. تبلیغات خا ": "25b6b8d3f03b413d", "title_fa": "تویوتا احتمالا خودرو مجهز به سیستم بردافزا عرضه می‌کند", "summary_fa": "تویوتا قصد دارد نخستین خودروی برقی مجهز به سیستم بردافزا را برای عرضه در بازار چین تولید کند. تبلیغات تویوتا تولید نخستین خودروی برقی مجهز به سیستم بردافزا یا EREV را برای بازار چین آغاز خواهد کرد. ساخت این محصول از اوایل ۲۰۲۷ با ظرفیت اولیه چندصد دستگاه در ماه کلید می‌خورد. به گزارش Nikkei Asia ، غول خودروسازی ژاپن تصمیم دارد ظرفیت مونتاژ سالانه را در طول سال ۲۰۲۷ به ۲۰۰ هزار دستگاه و در سال ۲۰۲۸ به حدود ۴۰۰ هزار دستگاه برساند. برخلاف خودروهای هیبریدی مرسوم، سامانه‌های بردافزا از موتور برقی برای به حرکت درآوردن چرخ‌ها بهره می‌برند و پیشرانه‌ی احتراقی صرفا نقش ژنراتور برای شارژ باتری را ایفا می‌کند. اخیرا نیسان روگ هیبرید نیز با ساختاری مشابه معرفی شد. بی‌ام‌و نیز قصد دارد فناوری مشابهی را روی مدل‌های iX5 و X7 پیاده کند. تویوتا و بی‌ام‌و هم‌زمان روی فناوری پیل سوختی هیدروژنی همکاری مشترک دارند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "شیائومی ۱۸ پرو مکس با ۲ دوربین ۲۰۰ مگاپیکسلی عرضه می‌شود", "link": "https://www.zoomit.ir/mobile/467644-xiaomi-18-pro-series-specs-revealed/", "summary": "مشخصات فنی پرچمداران سری شیائومی ۱۸ پرو پیش از رونمایی تأیید شد.", "date_str": "2026-09-22T21:40:00+00:00", "hash": "ce57c48f700c690a", "title_fa": "شیائومی ۱۸ پرو مکس با ۲ دوربین ۲۰۰ مگاپیکسلی عرضه می‌شود", "summary_fa": "مشخصات فنی پرچمداران سری شیائومی ۱۸ پرو پیش از رونمایی تأیید شد. تبلیغات شیائومی پیش از رونمایی رسمی، مشخصات مهم پرچمداران نسل جدیدش شامل شیائومی ۱۸ پرو و ۱۸ پرو مکس را منتشر کرد . تمرکز اصلی روی ارتقای چشمگیر دوربین‌ها قرار دارد که با همکاری لایکا توسعه یافته است. گوشی‌های جدید شیائومی با سیستم تصویربرداری دوگانه‌ی ۲۰۰ مگاپیکسلی لایکا عرضه می‌شوند. دوربین اصلی حسگر بزرگ ۱/۱٫۲۸ اینچی دارد و دوربین تله‌فوتو پریسکوپی به حسگر ۱/۱٫۵۶ اینچی مجهز است تا فضای نوری بسیار بیشتری نسبت‌به دوربین‌های رایج فراهم کند
