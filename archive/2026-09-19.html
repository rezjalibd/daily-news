ت آزادراه تهران–شمال در روزهای تعطیل به ۷۲۰ هزار تومان رسید", "link": "https://www.zoomit.ir/iran-news/467482-tehran-north-freeway-toll-rates-holidays/", "summary": "خودروهای سواری برای رفت‌وبرگشت از آزادراه تهران–شمال در روزهای تعطیل باید مجموعا ۷۲۰ هزار تومان عوارض پرداخت کنند.", "date_str": "2026-09-19T07:22:03+00:00", "hash": "9811729d3f905f8f", "title_fa": "عوارض رفت‌وبرگشت آزادراه تهران–شمال در روزهای تعطیل به ۷۲۰ هزار تومان رسید", "summary_fa": "خودروهای سواری برای رفت‌وبرگشت از آزادراه تهران–شمال در روزهای تعطیل باید مجموعا ۷۲۰ هزار تومان عوارض پرداخت کنند. تبلیغات عوارض عبور رفت‌وبرگشت خودروهای سواری از بخش‌های بهره‌برداری‌شده آزادراه تهران–شمال در روزهای تعطیل به ۷۲۰ هزار تومان می‌رسد. گفتنی است که تاکنون، قطعات یک و چهار و بخشی از قطعه دو، ازجمله تونل البرز شرقی، تکمیل شده و زیر بار ترافیک رفته‌اند. براساس برنامه اعلام‌شده، قطعه یا منطقه سه این آزادراه نیز قرار است طی پنج سال ساخته شود؛ بخشی که از نظر فنی، اجرایی و مالی، دشوارترین قطعه آزادراه تهران–شمال محسوب می‌شود. کپی لینک عوارض ۳۶۰ هزار تومانی برای هر مسیر در روزهای تعطیل نرخ عوارض عبور از قطعات ساخته‌شده آزادراه تهران–شمال در روزهای عادی و تعطیل متفاوت است. یک خودرو سواری برای عبور یک‌طرفه از تمام بخش‌های فعال آزادراه در روز تعطیل باید درمجموع ۳۶۰ هزار تومان عوارض بپردازد. بنابراین، هزینه رفت‌وبرگشت یک خودرو سواری از آزادراه تهران–شمال در روزهای تعطیل به ۷۲۰ هزار تومان می‌رسد. در روزهای تعطیل، عوارض عبور خودرو سواری از قطعه یک ۱۲۰ هزار تومان است. عبور از تونل البرز شرقی نیز ۱۱۵ هزار تومان هزینه دارد. نرخ عوارض قطعه دو ۹۰ هزار تومان و عوارض قطعه چهار ۳۵ هزار تومان تعیین شده است. کپی لینک عوارض رفت‌وبرگشت اتوبوس و وانت چقدر است؟ نرخ عوارض عبور رفت‌وبرگشت اتوبوس از آزادراه تهران–شمال ۸۷۰ هزار تومان اعلام شده است. وانت‌ها نیز برای تردد رفت‌وبرگشت در این آزادراه باید درمجموع ۸۵۴ هزار تومان عوارض پرداخت کنند. کپی لینک قطعه سوم آزادراه تهران–شمال طی پنج سال ساخته می‌شود حسین دهقان، رئیس بنیاد مستضعفان، اوایل شهریور امسال در حاشیه بازدید از آزادراه تهران–شمال درباره دشواری‌های ساخت قطعه سوم گفته بود: «قطعه oomit", "title": "پیشنهاد مجلس برای افزایش مبلغ کالابرگ به دو میلیون تومان", "link": "https://www.zoomit.ir/iran-news/467470-parliament-proposal-increase-electronic-coupon/", "summary": "رئیس کمیسیون اجتماعی مجلس از پیشنهاد افزایش مبلغ کالابرگ به ۱٫۵ تا ۲ میلیون تومان برای هر نفر خبر داد.", "date_str": "2026-09-19T06:24:13+00:00", "hash": "db702cc32796992b", "title_fa": "پیشنهاد مجلس برای افزایش مبلغ کالابرگ به دو میلیون تومان", "summary_fa": "رئیس کمیسیون اجتماعی مجلس از پیشنهاد افزایش مبلغ کالابرگ به ۱٫۵ تا ۲ میلیون تومان برای هر نفر خبر داد. تبلیغات رئیس کمیسیون اجتماعی مجلس از پیشنهاد تعیین مبلغی بین ۱٫۵ تا دو میلیون تومان برای کالابرگ خبر داد و گفت بر اساس برآوردهای بودجه سال ۱۴۰۵، این رقم باید به تقریبا ۲٫۵ میلیون تومان برای هر نفر برسد. علی بابایی، رئیس کمیسیون اجتماعی مجلس، اعلام کرد پیشنهاد افزایش مبلغ کالابرگ در نشست‌های مشترک با احمد میدری، وزیر تعاون، کار و رفاه اجتماعی و همچنین در صحن علنی مجلس مطرح شده است. به گفته او، با توجه به شرایط اقتصادی کنونی، نوسان نرخ ارز و تغییر درآمدهای ارزی، پیشنهاد اولیه اختصاص مبلغی بین ۱٫۵ تا ۲ میلیون تومان به هر نفر ارائه شده است."}, {"source": "Zoomit", "title": "فروش محصولات اپل و سامسونگ و گوگل در آمریکا ممنوع می‌شود؟", "link": "https://www.zoomit.ir/business/467459-usitc-spatial-audio-patent-probe/", "summary": "کمیسیون تجارت بین‌الملل آمریکا تحقیقاتی را درباره‌ی نقض پتنت‌ها توسط اپل، سامسونگ و گوگل آغاز کرد.", "date_str": "2026-09-19T06:15:00+00:00", "hash": "9643025be3fb5b0b", "title_fa": "فروش محصولات اپل و سامسونگ و گوگل در آمریکا ممنوع می‌شود؟", "summary_fa": "کمیسیون تجارت بین‌الملل آمریکا تحقیقاتی را درباره‌ی نقض پتنت‌ها توسط اپل، سامسونگ و گوگل آغاز کرد. تبلیغات کمیسیون تجارت بین‌الملل آمریکا (USITC) تحقیقات تازه‌ای را پیرامون نقض پتنت‌های حوزه‌ی صدای فضایی آغاز کرده است که احتمال دارد به ممنوعیت واردات و فروش برخی دستگاه‌های اپل، سامسونگ و گوگل در ایالات متحده ختم شود. بررسی پرونده پس از شکایت شرکت BoomCloud 360 کلید خورد؛ شرکتی کالیفرنیایی که روی نرم‌افزارهای بهینه‌سازی صدا برای فیلم، بازی و موسیقی تمرکز دارد و پتنت‌های متعددی را در زمینه‌ی پردازش صدای فراگیر به ثبت رسانده است. شکایت اولیه در مردادماه ثبت شد و سه مورد اختلاف حق اختراع مرتبط با پردازش صدای فضایی را در بر می‌گیرد. شاکی خواستار صدور «دستور منع محدود» برای جلوگیری از ورود کالاهای ناقض پتنت و توقف فعالیت‌های تجاری مرتبط با آن‌ها شده است. فهرست دقیق محصولاتی که ادعا می‌شود از فناوری‌های ثبت‌شده بهره‌برداری غیرقانونی کرده‌اند، هنوز به‌صورت عمومی در دسترس نیست. اپل، سامسونگ و گوگل در پاسخ به این ادعاها، دادخواست‌هایی را برای دریافت حکم اعلامی ثبت کرده‌اند تا بی‌اساس‌بودن نقض حق اختراع را به اثبات برسانند. سرنوشت این پرونده حقوقی و تصمیم نهایی نهادهای نظارتی آمریکا طی ماه‌های آینده مشخص خواهد شد."}, {"source": "Zoomit", "title": "افشاگری علیه مایکروسافت و اوپن‌ای‌آی؛ هر دو شرکت می‌دانستند که در حال نابودی وب هستند", "link": "https://www.zoomit.ir/ai-articles/467469-openai-microsoft-doom-loop-web-documents/", "summary": "اسناد تازه نشان می‌دهد اوپن‌ای‌آی و مایکروسافت از آسیب به وب، ناشران و ترافیک سایت‌ها آگاه بودند.", "date_str": "2026-09-19T06:02:44+00:00", "hash": "e936902e34521e57", "title_fa": "افشاگری علیه مایکروسافت و اوپن‌ای‌آی؛ هر دو شرکت می‌دانستند که در حال نابودی وب هستند", "summary_fa": "اسناد تازه نشان می‌دهد اوپن‌ای‌آی و مایکروسافت از آسیب به وب، ناشران و ترافیک سایت‌ها آگاه بودند. تبلیغات اسناد تازه‌ای که در پرونده‌ی نیویورک تایمز علیه اوپن‌ای‌آی و مایکروسافت منتشر شده ، تصویری تند و صریح از پشت‌صحنه‌ی توسعه‌ی هوش مصنوعی ترسیم می‌کند. در این مدارک، از «دور باطل» برای توصیف اثر این محصولات بر وب گفته شده، از «بزرگ‌ترین سرقت کار در تاریخ بشر» یاد شده و استدلال شرکت‌ها برای گردآوری داده‌ها، «تمسخر کامل» ایده‌ی استفاده‌ی منصفانه توصیف شده است. متن‌های فاش‌شده نشان می‌دهند که بحث فقط بر سر یک اختلاف حقوقی ساده نبوده، بلکه مدیران و کارکنان دو شرکت از پیامدهای گسترده‌ی روندی خبر داشته‌اند که بعدتر با عنوان Google Zero توصیف شد؛ وضعیتی که در آن کاربر پاسخ را مستقیم از چت‌بات می‌گیرد و دیگر نیازی به کلیک‌کردن روی منبع نمی‌بیند. در میان نام‌هایی که در این اسناد تکرار می‌شوند، برنت هکت ، مدیر علم کاربردی oomit.ir/time-tunnel/467437-smiley-otzi-space-history-2026-09-19/", "summary": "سال‌ها پیش در چنین روزی، زبان اینترنت تغییر کرد، اوتسی از یخ بیرون آمد و ۱۲ نوترینو پنجره‌ای تازه به جهان گشودند.", "date_str": "2026-09-19T05:30:00+00:00", "hash": "cbaf1ddba9c3ebe7", "title_fa": "۲۸ شهریور؛ از نخستین لبخند دیجیتال تا معادله‌ای که موشک‌ها را می‌راند", "summary_fa": "سال‌ها پیش در چنین روزی، زبان اینترنت تغییر کرد، اوتسی از یخ بیرون آمد و ۱۲ نوترینو پنجره‌ای تازه به جهان گشودند. تبلیغات بعضی ایده‌های بزرگ در آزمایشگاهی عظیم متولد می‌شوند و بعضی دیگر تنها ۱۰ دقیقه زمان می‌برند. در روایت امروز، هر دو مسیر به نقطه‌ای ماندگار در تاریخ علم و فناوری می‌رسند. از ذرات گریزان یک ابرنواختر تا مومیایی عصر مس و معادله‌ای که هنوز بر طراحی موشک حکم‌رانی می‌کند، هر قصه نشان می‌دهد کشف‌های ماندگار گاهی از دل کمترین نشانه‌ها بیرون می‌آیند. فهرست مطالب مردی که انفجار یک ستاره را در مخزن آب دید پرواز کوتاهی که ۲۸۶ روز طول کشید سه نویسه‌ای که به اینترنت حالت چهره دادند کوهنوردی که پنج هزار سال در یخ مانده بود معادله‌ای که هنوز اندازه‌ی موشک را تعیین می‌کند کپی لینک مردی که انفجار یک ستاره را در مخزن آب دید از حدود ۱۰ به توان ۱۶ نوترینویی که از آشکارساز کامیوکانده گذشتند، فقط ۱۲ مورد به دام افتادند. همین ۱۲ رد کم‌رنگ کافی بود تا دانشمندان فروپاشی ستاره‌ای در فاصله‌ی تقریبی ۱۷۰ هزار سال نوری را به شیوه‌ای کاملا تازه ببینند. ماساتوشی کوشیبا که ۱۰۰ سال پیش در تویوهـاشی ژاپن زاده شد، آشکارساز زیرزمینی کامیوکانده (Kamiokande) را برای چنین شکار دشواری آماده کرده بود. مخزن ۲٬۱۴۰ تنی آب با حدود ۱٬۱۰۰ لوله‌ی فوتوفزون‌گر احاطه شده بود. برخورد نادر نوترینو با ماده، ذره‌ای باردار و برق بسیار ضعیفی از نور پدید می‌آورد که حسگرها ثبتش می‌کردند. هنگام رسیدن نوترینوهای ابرنواخترSupernova 1987A، مخزن آب عملا به تلسکوپی برای دیدن جهان نامرئی بدل شد. سهم کوشیبا از نوبل فیزیک ۲۰۰۲ پاداش گشودن همین پنجره بود. اخترشناسی نوترینویی امروز می‌تواند پیش از رسیدن نور مرئی، خبر فروپاشی ستاره‌ای دوردست را به رصدخانه‌های جهان برساند. کپی لینک پرواز کوتاهی که ۲۸۶ روز طول کشید سونیتا ویلیامز قرار بود با پرواز آزمایشی سرنشین‌دار استارلاینر بویینگ"}, {"source": "Zoomit", "title": "این گوشی عجیب، باتری و دوربین قابل تعویض دارد", "link": "https://www.zoomit.ir/mobile/467377-tecno-atom-edition-modular-phone/", "summary": "تکنو گوشی مفهومی «اتم» با ضخامت ۴٫۹ میلی‌متر را به‌نمایش گذاشت که از طریق اتصال آهنربایی، ماژول‌های مختلف را به دستگاه متصل می‌کند.", "date_str": "2026-09-19T04:15:00+00:00", "hash": "8129a351c80b4f00", "title_fa": "این گوشی عجیب، باتری و دوربین قابل تعویض دارد", "summary_fa": "تکنو گوشی مفهومی «اتم» با ضخامت ۴٫۹ میلی‌متر را به‌نمایش گذاشت که از طریق اتصال آهنربایی، ماژول‌های مختلف را به دستگاه متصل می‌کند. تبلیغات تکنو از یک گوشی مفهومی متفاوت به نام ATOM Edition رونمایی کرد که می‌تواند یکی از جالب‌ترین پروژه‌ها برای بازگرداندن ایده‌ی گوشی‌های ماژولار باشد. گوشی اتم بخشی از پروژه‌ی Modular Magnetic Interconnection Technology تکنو است و به‌جای آنکه تمام سخت‌افزار موردنیاز را داخل بدنه قرار دهد، امکان اضافه‌کردن قابلیت‌های مختلف از طریق ماژول‌های جداگانه را فراهم می‌کند. زومیت لایک بدنه‌ی گوشی ATOM فقط ۴٫۹ میلی‌متر ضخامت دارد و ماژول‌ها از طریق اتصال آهنربایی به پشت گوشی متصل می‌شوند. تکنو ماژول‌هایی مانند باتری اضافه، دوربین اکشن، لنز تله‌فوتو، اسپیکر و تجهیزات دیگری را نشان داد. ماژول تله‌فوتو می‌تواند از نمایشگر خود گوشی به‌عنوان منظره‌یاب استفاده کند. ارتباط میان گوشی و ماژول‌ها فقط به آهنربا محدود نمی‌شود. سیستم از پین‌های فیزیکی برای انتقال برق و ارتباطات بی‌سیم مانند وای‌فای، بلوتوث و mmWave برای انتقال داده استفاده می‌کند. ایده این است که کاربر به‌جای حمل دائمی سخت‌افزار اضافی، فقط ماژولی را که در آن لحظه لازم دارد به گوشی متصل کند. زومیت لایک اتم هنوز در مرحله‌ی مفهومی قرار دارد و تکنو قیمت گوشی یا زمان عرضه‌اش را اعلام نکرده. این پروژه بیشتر تلاشی برای نشان‌دادن یک معماری متفاوت است؛ رویکردی که می‌خواهد گوشی را به یک محصول باریک تبدیل کند و قابلیت‌های جدید را به‌صورت ماژولار در اختیار کاربر قرار دهد."}, {"source": "Zoomit", "title": "مینی کامپیوتر هوش مصنوعی ایسوس با تراشه قدرتمند اسنپدراگون معرفی شد", "link": "https://www.zoomit.ir/desktop/467421-asus-ascent-qn10-mini-pc/", "summary": "ایسوس عرضه مینی پی‌سی Ascent QN10 مجهز به پردازنده‌ی اسنپدراگون X2 الیت را آغاز کرد.", "date_str": "2026-09-19T02:30:00+00:00", "hash": "fa71891a5ddfe302", "title_fa": "مینی کامپیوتر هوش مصنوعی ایسوس با تراشه قدرتمند اسنپدراگون معرفی شد", "summary_fa": "ایسوس عرضه مینی پی‌سی Ascent QN10 مجهز به پردازنده‌ی اسنپدراگون X2 الیت را آغاز کرد. تبلیغات ایسوس عرضه‌ی مینی پی‌سی Ascent QN10 را آغاز کرد ؛ دستگاهی که نخستین کامپیوتر کوچک بازار با تراشه‌ی اسنپدراگون X2 الیت کوالکام با واحد پردازش عصبی ۸۰ تاپسی است تا پردازش‌های هوش مصنوعی مانند مدل‌های زبانی، پردازش تصویر و خودکارسازی فرایندها را به‌صورت محلی اجرا کند. تا پیش از عرضه‌ی مینی کامپیوتر ایسوس، دستگاه‌های مشابه ویندوزی صرفا کیت‌های توسعه مانند Windows Dev Kit 2023 بودند که برای بهینه‌سازی برنامه‌ها توسط توسعه‌دهندگان طراحی می‌شدند. مدل Ascent QN10 ساختاری مصرف‌کننده دارد و به‌جای بدنه‌ی پلاستیکی از شاسی آلومینیومی بهره می‌برد. یکی از رسانه‌ها می‌گوید Ascent QN10 «می‌تواند جایگزین مک مینی M4 برای کاربران ویندوز باشد.» حجم بدنه‌ی مینی پی‌سی جدید ایسوس تنها ۰٫۷ لیتر است و ابعادی معادل ۱۳ در ۱۳ در ۳٫۸ سانتی‌متر با وزن تقریبی ۷۲۵ گرم دارد. مینی کامپیوتر از پردازنده‌ی ۱۸ هسته‌ای Snapdragon X2 Elite، پردازنده‌ی گرافیکی Adreno X2-90، حداکثر ۳۲ گیگابایت رم LPDDR5x و فضای ذخیره‌سازی ۵۱۲ گیگابایت، یک یا دو ترابایت استفاده می‌کند. مجموعه‌ی درگاه‌های دستگاه شامل سه پورت USB4، چهار پورت USB-A، جک ۳٫۵ میلی‌متری صدا، درگاه HDMI 2.1 و اترنت ۲٫۵ گیگابیت است. ارتباطات بی‌سیم از طریق وای‌فای ۷ و بلوتوث ۶ برقرار می‌شود و سیستم خنک‌کننده‌ی آن حرارت پردازنده و فضای ذخیره‌سازی را با هدایت مجزای جریان هوا از یکدیگر تفکیک می‌کند. قیمت مینی کامپیوتر جدید ایسوس ۱٬۳۵۰ دلار است."}, {"source": "Zoomit", "title": "مایکروسافت ماه آینده یک مراسم دیگر هم برگزار می‌کند", "link": "https://www.zoomit.ir/exhibition/467418-microsoft-onedrive-copilot-event-october/", "summary": "مایکروسافت رویداد دیجیتال سالانه‌ی وان‌درایو و کوپایلت را برای نمایش قابلیت‌های جدید هوش مصنوعی برگزار می‌کند.", "date_str": "2026-09-18T23:10:00+00:00", "hash": "e33f37f3db528e50", "title_fa": "مایکروسافت ماه آینده یک مراسم دیگر هم برگزار می‌کند", "summary_fa": "مایکروسافت رویداد دیجیتال سالانه‌ی وان‌درایو و کوپایلت را برای نمایش قابلیت‌های جدید هوش مصنوعی برگزار می‌کند. تبلیغات مایکروسافت رویداد دیجیتال سالانه‌ی OneDrive + Copilot را در تاریخ ۲۰ اکتبر ۲۰۲۶ (۲۸ مهر ۱۴۰۵) برگزار خواهد کرد. رویدادِ یادشده علاوه‌بر مراسم ویژه‌ی ویندوز ۱۱ و سرفیس در ماه آینده برپا می‌شود و تمرکز اصلی‌اش روی قابلیت‌های هوش مصنوعی خواهد بود. حضور در گردهمایی یادشده به‌صورت رایگان و آنلاین امکان‌پذیر است و بخش پرسش و پاسخ زنده پس از ارائه‌ها برگزار خواهد شد. سخنرانان کلیدی مایکروسافت در پستی رسمی معرفی شده‌اند: مایکروسافت درباره‌ی حضور سایر مدیران و متخصصان فنی در جریان برنامه اعلام کرد: «رهبران محصول، مهندسان و متخصصان بخش‌های مختلف تیم وان‌درایو تجربیات خود را در طول رویداد به اشتراک خواهند گذاشت.» گروه کارشناسان حاضر دموی محصولات و کاربردهای واقعی وان‌درایو و مایکروسافت ۳۶۵ را نمایش خواهند داد. وان‌درایو در بسیاری از کارهای هوش مصنوعی نقش مهمی دارد و اسناد و تصاویر را به ابزارهایی مثل کوپایلت متصل می‌کند تا فایل‌ها مستقیما به نتایج کاری ملموس تبدیل شوند."}, {"source": "Zoomit", "title": "هواوی هم گوشی «پرو مکس» برای رقابت با آیفون ۱۸ پرو مکس می‌سازد", "link": "https://www.zoomit.ir/mobile/467384-huawei-mate-90-pro-max-specs/", "summary": "مشخصات گوشی پرچمدار هواوی میت ۹۰ پرو مکس از جمله دوربین ۲۰۰ مگاپیکسلی و تراشه‌ی کرین ۹۰۵۰ پرو فاش شد.", "date_str": "2026-09-18T21:15:00+00:00", "hash": "7c469d133c370a17", "title_fa": "هواوی هم گوشی «پرو مکس» برای رقابت با آیفون ۱۸ پرو مکس می‌سازد", "summary_fa": "مشخصات گوشی پرچمدار هواوی میت ۹۰ پرو مکس از جمله دوربین ۲۰۰ مگاپیکسلی و تراشه‌ی کرین ۹۰۵۰ پرو فاش شد. تبلیغات مشخصات کلیدی گوشی هواوی میت ۹۰ پرو مکس پیش از رونمایی فاش شد. غول فناوری چین می‌خواهد رقیب آیفون ۱۸ پرو مکس را با تغییراتی چشمگیر در پردازنده و دوربین روانه‌ی بازار کند. به ادعای یک افشاگر چینی ، پرچمدار قدرتمند هواوی به تراشه‌ی Kirin 9050 Pro مجهز خواهد بود. پیش‌تر، گوشی تاشدنی سه‌تکه‌ی میت XT 2 آلتیمیت دیزاین نیز با همین پردازنده معرفی ید کند سامانه کنترل حرارتی تلسکوپ مطابق انتظار کار می‌کند. پژوهشگران درطول ۳۰ روز آینده همچنان وضعیت رومن را زیر نظر خواهند داشت؛ اما ثبت نخستین عکس آزمایشی نشان می‌دهد که تلسکوپ فاز بحرانی پس از پرتاب را با موفقیت پشت سر گذاشته است. تصاویر اولیه، میدانی از ستارگان تار و محو به رنگ‌های سبز، زرد و آبی را در پس‌زمینه‌ای آبی نشان می‌دهند؛ به‌طوری‌که ستاره‌های منفرد بیشتر از آنکه به نقاط نورانی شبیه باشند، شبیه هاله یا دونات به نظر می‌رسند. البته جای نگرانی نیست؛ دوربین هنوز در محفظه خود در حال خنک‌شدن است و هنوز به‌درستی فوکوس و کالیبره نشده است. بنابراین وقتی به‌طور کامل راه‌اندازی شود، این دونات‌های بامزه به نقاط نورانی درخشان و شفاف تبدیل خواهند شد. جاش شلیدر، دانشمند حوزه ابزار در مرکز پرواز فضایی گادرد ناسا، گفت: «پس از سال‌ها تلاش برای"}, {"source": "Zoomit", "title": "هندزفری پشت‌باز جدید بوز با بیس کوبنده و شارژدهی چشمگیر معرفی شد", "link": "https://www.zoomit.ir/headset/467390-bose-ultra-open-earbuds-gen-2/", "summary": "بوز نسل دوم هندزفری اولترا اوپن و مدل ارزان‌تر آن را با شارژدهی بهتر و صدای قوی‌تر رونمایی کرد.", "date_str": "2026-09-18T19:50:00+00:00", "hash": "6f9fe240c5f0430a", "title_fa": "هندزفری پشت‌باز جدید بوز با بیس کوبنده و شارژدهی چشمگیر معرفی شد", "summary_fa": "بوز نسل دوم هندزفری اولترا اوپن و مدل ارزان‌تر آن را با شارژدهی بهتر و صدای قوی‌تر رونمایی کرد. تبلیغات بوز نسل دوم ایرباد Ultra Open Earbuds را همراه با یک مدل اسپرت و ارزان‌تر رونمایی کرد . مدل‌های جدید هدفون بوز با طراحی پشت‌باز، کیفیت صدای بهبودیافته و دوام باتری بیشتر روانه ‌یبازار خواهند شد. قیمت هدفون از ۲۹۹ دلار آغاز می‌شود و از ۱۰ مهر در رنگ‌های مشکی، سفید دودی، شکلاتی گیلاسی، سبز زیتونی و صورتی آسمانی در دسترس قرار می‌گیرد. مدل Bose Sport Open Earbuds نیز هم‌زمان با قیمت ۱۹۹ دلار در رنگ‌های مشکی، سفید دودی و سبز اکالیپتوس در دسترس خریداران قرار می‌گیرد. نسل دوم اولترا اوپن از درایور جدیدی دارد که صدای بلندتر، تنظیم خودکار حجم صدا و بیس عمیق‌تری را ارائه می‌دهد. قابلیت جدید Cinema Mode با فناوری TrueSpatial صدای فراگیرتری ایجاد می‌کند و شارژدهی گوشی‌ها به ۹ ساعت و همراه با کیس ۰۶ تا ۲۰۱۷ شش آزمایش هسته‌ای زیرزمینی در پونگی-ری انجام داد. آخرین آزمایش، بزرگ‌ترین آن‌ها بود و قدرت انفجار آن معادل حدود ۱۰۰ تا ۲۵۰ کیلوتن TNT برآورد شده است. به گزارش ساینس ، سازمان زمین‌شناسی آمریکا این انفجار را به‌صورت رویدادی لرزه‌ای با بزرگی ۶٫۳ ثبت کرد. حدود هشت دقیقه بعد نیز رویدادی با بزرگی ۴٫۱ رخ داد که احتمالاً ناشی از فروریختن حفره‌ی زیرزمینی ایجادشده بر اثر انفجار بود. در روزهای نخست، برخلاف انتظار، پس‌لرزه‌های زیادی دیده نشد. اما حدود سه هفته بعد فعالیت لرزه‌ای پایدارتری آغاز شد."}, {"source": "Zoomit", "title": "پایان عصر تخصص‌گرایی؟ مدل شغلی جدید در راه است", "link": "https://www.zoomit.ir/business/467378-ai-jobs-specialisation-technology-impact/", "summary": "پژوهش‌های تاریخی نشان می‌دهند بخش عمده‌ی مشاغل مدرن برخلاف تصور عمومی، از تقسیم کار سرچشمه می‌گیرند نه جهش‌های فناورانه.", "date_str": "2026-09-18T18:45:00+00:00", "hash": "236dd3a49bed63b4", "title_fa": "پایان عصر تخصص‌گرایی؟ مدل شغلی جدید در راه است", "summary_fa": "پژوهش‌های تاریخی نشان می‌دهند بخش عمده‌ی مشاغل مدرن برخلاف تصور عمومی، از تقسیم کار سرچشمه می‌گیرند نه جهش‌های فناورانه. تبلیغات پژوهشگران تاریخ اقتصاد با واکاوی سوابق بازار کار در قرن‌های گذشته دریافتند که عامل اصلی تنوع مشاغل جدید، فرآیند تخصص‌گرایی بر پایه‌ی نظریات آدام اسمیت بوده است و موج‌های فناوری بر اساس ایده‌ی جوزف شومپیتز سهم کمتری در شکل‌گیری مشاغل ماندگار دارند. شواهد تاریخی نشان می‌دهد شغل ساعت‌سازی در بریتانیای سال ۱۵۵۰ میلادی طی دو قرن به ده‌ها شغل تخصصی نظیر حکاک، طلاکار و سازنده‌ی فنرِ ساعت تقسیم شد. فایننشال تایمز به نقل از پژوهشگران بازار کار در ایالات متحده می‌گوید ، تحلیل مشاغل ایجادشده میان سال‌های ۲۰۱۱ تا ۲۰۲۳ با کمک هوش مصنوعی نشان می‌دهد سهم مشاغل وابسته به فناوری حدود یک‌سوم بوده و اکثریت بازار را شامل نمی‌شود. بررسی داده‌های سوئد بین سال‌های ۱۸۸۰ تا ۲۰۱۹ نشان می‌دهد که بین سال‌های ۱۹۹۰ تا ۲۰۱۹، مشاغل مبتنی بر تقسیم کار ۶۰ درصد اشتغال را تشکیل داده‌اند، درحالی‌که سهم مشاغل با فناوری نوین تنها ۳۰ درصد برآورد می‌شود. یافته‌ها ثابت می‌کنند موقعیت‌های شغلیِ برخاسته از تخصص‌گرایی، بقای بسیار طولانی‌تری نسبت‌به مشاغل حوزه‌ی فناوری دارند؛ چراکه حدود ۷۰ درصد اشتغال سال‌های ۱۹۹۰ تا ۲۰۱۹ مربوط به حوزه‌هایی بوده که در اواخر قرن نوزدهم نیز وجود داشته‌اند؛ روندی که با ورود هوش مصنوعی می‌تواند دستخوش تغییر شود. آمار OpenAI نشان می‌دهد ۱۷ درصد پیام‌های کاری کاربران مربوط به انجام وظایف سایر مشاغل است که نشانه‌ای از دستکاری مرزهای تخصصی توسط هوش مصنوعی به‌شمار می‌رود. لوئیس گاریکانو ، نویسنده‌ی کتاب مشاغل نامنظم، می‌گوید: «اگر هوش مصنوعی موجب معکوس‌شدن تقسیم کار شود، این پدیده یک ویژگی غیرعادی در این انقلاب نسبت‌به تمام پیشرفت‌های پیشین علم خواهد بود.»"}, {"source": "Zoomit", "title": "ایمپلنت مغزی جدید، آواتاری می‌سازد که به جای افراد معلول حرف می‌زند و اشاره می‌کند", "link": "https://www.zoomit.ir/health-medical/467389-ucsf-bci-speech-movement-implant/", "summary": "پژوهشگران رابط مغز و رایانه‌ای ساخته‌اند که می‌تواند هم‌زمان سیگنال‌های مغز افراد فلج را به گفتار و حرکات ارتباطی تبدیل کند.", "date_str": "2026-09-18T18:15:00+00:00", "hash": "524d5d5f54d8b478", "title_fa": "ایمپلنت مغزی جدید، آواتاری می‌سازد که به جای افراد معلول حرف می‌زند و اشاره می‌کند", "summary_fa": "پژوهشگران رابط مغز و رایانه‌ای ساخته‌اند که می‌تواند هم‌زمان سیگنال‌های مغز افراد فلج را به گفتار و حرکات ارتباطی تبدیل کند. تبلیغات پژوهشگران دانشگاه کالیفرنیا سان‌فرانسیسکو ایمپلنت مغزی جدیدی ساخته‌اند که می‌تواند سیگنال‌های مغز افراد مبتلا به معلولیت شدید را هم‌زمان به گفتار و حرکات بدن تبدیل کند. این فناوری به‌جای تمرکز صرف بر بازگرداندن توانایی صحبت‌کردن یا حرکت‌دادن یک عضو، تلاش می‌کند چند روش ارتباطی طبیعی انسان را با یک رابط واحد بازسازی کند. رابط مغز و رایانه (BCI) جدید می‌تواند فعالیت‌های عصبی مرتبط با صحبت‌کردن و حرکات ارتباطی مانند تکان دادن سر، دست تکان دادن، شانه بالا انداختن یا علامت تأیید را دریافت و به حرکت یک آواتار دیجیتالی روی صفحه تبدیل کند. بیشتر سامانه‌های BCI که تاکنون برای افراد معلول آزمایش شده‌اند، معمولاً روی عملکرد خاصی همچون تبدیل فعالیت مغز به متن یا کنترل بازوی رباتیک تمرکز داشته‌اند. اما ارتباط انسانی فقط به کلمات محدود نمی‌شود. حرکات صورت و دست، حالت بدن و اشاره‌ها بخش مهمی از انتقال احساس و معنا هستند. سامانه‌ی جدید تلاش می‌کند این دو مسیر را هم‌زمان رمزگشایی کند. الکترودهای کاشته‌شده در بخش‌هایی از مغز که در تولید گفتار و کنترل حرکت نقش دارند، الگوهای عصبی را ثبت می‌کنند. سپس الگوریتم‌های یادگیری ماشین این سیگنال‌ها را تفسیر کرده و آن‌ها را به خروجی قابل مشاهده تبدیل می‌کنند. در آزمایش اولیه، دو فرد مبتلا به معلولیت شدید سیستم جدید را امتحان کردند. به نوشته نیوساینتیست ، یکی از شرکت‌کنندگان که دچار سکته‌ی ساقه‌ی مغز شده بود و دیگری که به بیماری نورون حرکتی مبتلا بود، توانستند مجموعه‌ای از کلمات و حرکات از پیش تعریف‌شده را با کمک آواتار دیجیتالی اجرا کنند. عملکرد یکی از شرکت‌کنندگان در تشخیص گفتار به دقت ۱۰۰ درصد و عملکرد شرکت‌کننده‌ی دیگر در تشخیص گفتار و حرکات به‌ترتیب حدود ۷۵ و ۸۵ درصد گزارش شد."}, {"source": "Zoomit", "title": "با این وب‌سایت، مدل جدید آیفون را طراحی کنید!", "link": "https://www.zoomit.ir/websites/467444-design-the-next-iphone-tool/", "summary": "ابزار تعاملی جدیدی راه‌اندازی شده که به کاربران اجازه می‌دهد آیفون بعدی را با قطعات استاندارد یا عجیب شخصی‌سازی کنند.", "date_str": "2026-09-18T18:10:00+00:00", "hash": "fdf8e2283ae9527c", "title_fa": "با این وب‌سایت، مدل جدید آیفون را طراحی کنید!", "summary_fa": "ابزار تعاملی جدیدی راه‌اندازی شده که به کاربران اجازه می‌دهد آیفون بعدی را با قطعات استاندارد یا عجیب شخصی‌سازی کنند. تبلیغات یک توسعه‌دهنده به نام نیل آگاروال وب‌سایتی تعاملی به نام Design the Next iPhone ایجاد کرده است که به کاربران اجازه می‌دهد ظاهر یک گوشی شبیه‌سازی‌شده را بر اساس سلیقه‌ی خود تغییر دهند. افراد می‌توانند در این بستر، قطعات متداول گوشی‌های هوشمند را با ابزارهای کاملا غیرمعمول و عجیب ترکیب کنند. کار با یک بدنه‌ی خام و سه‌بعدی آغاز می‌شود که قابلیت چرخش در زاویه‌های گوناگون را دارد. کاربران می‌توانند اجزایی نظیر دوربین‌ها، دکمه‌های تنظیم صدا، درگاه لایتنینگ، دکمه‌ی هوم و لوگو اپل را به هر تعداد دلخواه روی بدنه قرار دهند و گوشی متفاوتی بسازند. امکانات دیگری مانند جک هدفون، درگاه HDMI، دکمه‌ی چرخان اپل واچ ، لولا و کلیک‌ویل کلاسیک آیپاد نیز در فهرست قطعات به چشم می‌خورند. کاربران حتی می‌توانند لوازمی م
