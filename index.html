<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۶ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۶ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۷ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۹:۴۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۲۸</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۲۲</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۲۳</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

ز بازداشت این روزنامه‌نگار در روز چهارشنبه چهارم آذر ۱۴۰۵ و ضبط تلفن همراه و لپ‌تاپش، او را به پلیس امنیت منتقل کردند. محمودیان در آنجا بارها با سیلی‌های شدید مورد ضرب‌وشتم قرار گرفت و شدت ضربات به حدی بود که به در و دیوار برخورد می‌کرد. در ادامه، ماموران با کشیدن کیسه پلاستیکی روی سر محمودیان و ایجاد حالت خفگی، تلاش کردند از او اعتراف اجباری بگیرند. این اقدام چندین بار تکرار شد و به گفته منابع نزدیک به او، بدنش دچار لرزش و رعشه شدید شد. کیسه‌های پلاستیکی نیز در جریان این شکنجه چندین بار تعویض شدند. همچنین ماموران سر او را میان پاهایش قرار داده و به ضرب‌وشتم ادامه دادند. محمودیان در پی این رفتارها بیهوش شد و با حضور نیروهای اورژانس به بیمارستان انتقال یافت. او پس از چند ساعت بستری، بار دیگر به محل بازداشت بازگردانده شد. بر اساس همین اطلاعات، قاضی کشیک نیز با وجود گزارش محمودیان درباره ضرب‌وشتم و شکنجه و وضعیت جسمانی او، با تمسخر از این گزارش عبور کرده اقدامی برای رسیدگی به رفتار ماموران انجام نداده است. پرونده جدید این روزنامه‌نگار در ارتباط با انتشار سندی درباره اجرای احکام اعدام میلاد آرمون و نوید نجاران، دو زندانی پرونده موسوم به «بچه‌های اکباتان»، تشکیل شده است. ضابطان قضایی این سند را محرمانه اعلام کرده‌اند. مهدی محمودیان پس از تفهیم اتهام‌های «فعالیت تبلیغی علیه نظام» و «نشر اکاذیب» به زندان تهران بزرگ منتقل شده است. منابع نزدیک به مهدی محمودیان با انتشار این گزارش خواهان دسترسی فوری به خدمات پزشکی مستقل، معاینه پزشکی قانونی و ثبت آثار احتمالی شکنجه و", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D9%85%D9%87%D8%AF%DB%8C_Fkab__v1024x512__box_0%2C14%2C576%2C317.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۵ آذر • ۱۸:۱۹"}, {"source": "Euronews Persian", "title": "اتهامات تازه یهودستیزی علیه جردن باردلا؛ رهبر راست افراطی فرانسه اتهامات را رد کرد", "link": "https://parsi.euronews.com/2026/11/26/jordan-bardella-denies-new-antisemitism-allegations-facebook-messages", "summary": "لوموند و مدیاپارت پیام‌های تازه‌ای از مکالمات خصوصی منتسب به جردن باردلا منتشر کردند که حاوی مضامین یهودستیزانه است. رئی 436bae91fdc7ef4a-6000x4000.jpg?rect=0,425,6000,3150&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۵ آذر • ۱۸:۱۰"}, {"source": "Radio Farda", "title": "ایتالیا می‌گوید دو شهروند این کشور در حمله پهپادی ایران به کویت کشته شدند", "link": "https://www.radiofarda.com/a/italy-says-two-citizens-killed-in-iranian-drone-strike-in-kuwait/33906409.html", "summary": "وزارت خارجه ایتالیا روز پنجشنبه پنجم آذر گزارش‌ها درباره کشته شدن دو شهروند این کشور در حمله پهپادی ایران به کویت را تأیید کرد.", "date_str": "2026-11-26T14:44:25+00:00", "hash": "6fd3af6087c5c6e4", "title_fa": "ایتالیا می‌گوید دو شهروند این کشور در حمله پهپادی ایران به کویت کشته شدند", "summary_fa": "وزارت خارجه ایتالیا روز پنجشنبه پنجم آذر گزارش‌ها درباره کشته شدن دو شهروند این کشور در حمله پهپادی ایران به کویت را تأیید کرد. این پهپادها به گفته وزارت دفاع کویت، یک «تأسیسات حیاتی» را هدف قرار داده بودند. خبرگزاری ایتالیایی آنسا و خبرگزاری رویترز اعلام کرده بودند این دو نفر از تکنسین‌های غیرنظامی شرکت آلمانی «راین‌متال» بودند. وزارت امور خارجه ایتالیا نیز می‌گوید دو شهروند این کشور که برای شرکت دفاعی آلمانی راین‌متال کار می‌کردند، روز پنج‌شنبه در پی حمله پهپادهای ایرانی در کویت کشته شدند. این وزارتخانه در بیانیه‌ای اعلام کرد: «انفجاری ناشی از حمله پهپادی در محلی رخ داد که دو تکنسین ایتالیایی شرکت راین‌متال ایتالیا در آن مشغول کار بودند.» این بیانیه افزود هر دو نفر جان باختند. همچنین آنتونیو تایانی، وزیر خارجه ایتالیا، در اظهاراتی در مجلس سنا این کشور خبر داد حدود ساعت ۱۴ روز پنج‌شنبه، پهپادهایی با منشأ ایرانی تأسیسات نظامی کویت، از جمله یک ایستگاه شناسایی پدافند هوایی را هدف قرار دادند؛ جایی که دو تکنسین ایتالیایی شرکت راین‌متال ایتالیا مشغول به کار بودند. به گزارش خبرگزاری آنسا، او گفت: «انفجاری شدید رخ داد و بر اساس گزارش‌هایی که از کویت به دست ما رسیده است، هر دو هم‌وطنمان جان باخته‌اند.» تایانی با ابراز همدردی با خانواده‌های این دو قربانی، اعلام کرد سفارت ایتالیا بلافاصله برای بررسی وضعیت وارد عمل شده و خود او نیز با لورنتسو مورینی، سفیر این iquez , Óscar Maydon and Jorsshh, Chuyín takes on the carnal pleasures and intoxicating excesses common to contemporary corridos — then gives them a comedic twist. His protagonist doesn’t escape the consequences. On “Paniki,” a cheating Chuyín goes to ridiculous lengths to conceal his infidelity, only to get caught when he tries his luck again. On the album opener, “Rehabilitado,” he declares himself rehabilitated while remaining tempted by his vices. “Everyone sings about the never-ending party. I sing about the hangover,” he says. “Everyone sings about partying, partying and partying. I sang about getting sent to rehab.” Consequences are central to Chuyín’s character, but so is perseverance. “Chuyín is the guy everything happens to, and somehow he gets back up and keeps going,” he explains. “Everything that could go wrong happens to Chuyín, and he gets up with the same smile and says, ‘OK, let’s keep going.’” Beh", "date_str": "2026-11-26T15:00:00+00:00", "hash": "756d72573264fac7", "title_fa": "درون دنیای دیوانه چویین: «همه درباره مهمانی بی پایان می خوانند. من درباره خماری می خوانم", "summary_fa": "در مراسم جوایز موسیقی لاتین بیلبورد 2026، ماه گذشته، گروهی از چویین‌ها با جلیقه‌های تنگ سفید صحنه را در حین اجرای موسیقی پوئس یا نی پدو به بخش روانپزشکی تبدیل کردند. در پایان نمایش، اعضای Fuerza Regida در زیر ماسک‌های بزرگ نشان داده شد - نگاهی اجمالی به دنیای پر هرج و مرج آلبوم اولین ستاره موسیقی مکزیکا، Los Locos Nunca Mueren (مردم دیوانه هرگز نمی‌میرند). مطالب مرتبط چویین کیست؟ اولین آلبوم هنرمند نقابدار Los Locos Nunca Mueren وارد نمودارهای بیلبورد شد Chuyin اولین بیلبورد شماره 1 را با «Pues Qué Le Hago؟» از همه اجراها در جوایز موسیقی لاتین بیلبورد در سال 2026 آشکار می کند اما برای درک مجری مرموز نقابدار، ابتدا وارد فضای خالی شوید. این خواننده نقابدار به بیلبورد می گوید: «قبل از چویین، هیچ چیزی وجود نداشت، فقط فضای سیاه. طبق داستان اصلی او، او در 6 مه 2023 در یک کنسرت Fuerza Regida در تپیک، نایاریت، جایی که جسوس اورتیز پاز (JOP) خواننده او را به فرزندی پذیرفت، پا به عی مولد", "tags": ["امنیت سایبری", "سینما", "موسیقی"], "datetime_fa": "۵ آذر • ۱۸:۲۳"}, {"source": "Rolling Stone", "title": "All the ‘GTA’ Games Ever, Ranked", "link": "https://www.rollingstone.com/culture/rs-gaming-lists/gta-grand-theft-auto-games-ranked-1235661232/", "summary": "From handheld free-for-alls to the newest groundbreaking title, here's all the franchise's entries, from worst to best", "date_str": "2026-11-26T15:00:00+00:00", "hash": "9f20aba60492d1a6", "title_fa": "همه بازی‌های «GTA» که تاکنون رتبه‌بندی شده‌اند", "summary_fa": "از بازی‌های رایگان برای همه تا جدیدترین عنوان پیشگامانه، در اینجا همه ورودی‌های فرنچایز، از بدترین تا بهترین آمده است، مگر اینکه در 30 سال گذشته در صندوق بانکی محبوس شده باشید، احتمال زیادی وجود دارد که نام Grand Theft Auto را شنیده باشید. این سری که در ابتدا برای رایانه های شخصی و پلی استیشن در سال 1997 عرضه شد، قبل از تبدیل شدن به یک پدیده فرهنگ پاپ در اوایل دهه 2000، به عنوان یک موفقیت تجاری خوب برای طرفداران طنز هیجانی و شوترها آغاز شد. امروزه، این یکی از شناخته‌شده‌ترین ویژگی‌های سرگرمی روی زمین است که از مرزهای بازی فراتر می‌رود – با آخرین نسخه آن، GTA VI، که امسال با پردرآمدترین راه‌اندازی رسانه‌ای تا کنون وارد بازار می‌شود. فروش روز اول GTA VI بیش از 3.79 میلیارد دلار، بیشتر از هر بازی یا فیلم دیگری، تولید ناخالص داخلی یک کشور کوچک است. اما بیشتر از پول، تأثیر GTA بر بازی و فرهنگ در کل میراث واقعی آن است. حماسه جنایی جهان باز به نحوه توسعه بازی های ویدیویی اطلاع داده است. لحن سینمایی آن طعم قدیمی هالیوود را میخکوب کرد که بازی های قبلی فقط به طور مبهم می توانستند از آن تقلید کنند. آزادی انتخاب در نحوه بازی با تقلیدکنندگان الهام‌بخش از همه نوع، از کرایه‌های بچه‌پسند گرفته تا کپی‌کنندگان مستقیم در تعقیب گیم‌پلی خشن گانگستر. در خارج از حوزه صنعت، GTA به سنگ محک برای بازی به عنوان یک مفهوم تبدیل شد. به هر فیلم یا نمایشی فکر کنید که در آن شخصیت ها در حال بازی های ویدیویی هستند. بسیار محتمل است که تصویر بصری یک کلون رندر شده خام از GTA باشد. سیاستمداران و حامیان هر دو طرف راهرو که هدف از دست دادن بی‌پایان مروارید هستند، این نام را به عنوان عامل اصلی زوال اجتماعی مطرح کرده‌اند. برای برخی، این یک", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/gta-lead-list.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آذر • ۱۸:۳۰"}, {"source": "Rolling Stone", "title": "Football Practice and Red Dirt Music: On the Field With Oklahoma Band Keyland", "link": "https://www.rollingstone.com/music/music-features/keyland-oklahoma-football-bixby-1235664441/", "summary": "“There’s a huge Venn diagram of coaches’ interests outside of football, and one of them is music,” says Kyle Ross, a high-school coach and touring artist", "date_str": "2026-11-26T15:00:00+00:00", "hash": "ea09c9590848e259", "title_fa": "تمرین فوتبال و موسیقی قرمز خاک: در زمین با گروه اوکلاهاما کیلند", "summary_fa": "کایل راس، مربی دبیرستان و هنرمند تور، می‌گوید: «نمودار ون بزرگی از علایق مربیان خارج از فوتبال وجود دارد، و یکی از آنها موسیقی است. مسلما هیچ روزی برای فوتبال بهتر از تماشای آن یا بازی کردن آن نیست. اما در این بعد از ظهر خاص اواخر تابستان، علی‌رغم دمای سه رقمی و آفتاب اوکلاهما که هوا را حتی داغ‌تر می‌کند، فوتبال یک کار غرق در عرق است: مربی کایل راس من را در تمرین قرار می‌دهد. از دست هیچ یک از ما نیست که شغل اصلی راس مربیگری ورزشکاران پرانرژی نوجوانان در برنامه فوتبال شاخص این ایالت، در بیکسبی است، و من یک روزنامه نگار نامتعارف در اواخر دهه 40 او هستم. اگر تمرینات راس را درست و سالم تمام کنم، آن را موفقیت آمیز اعلام خواهیم کرد. «تو چی؟ سه به سه یا چهار به چهار اینجا پاس می‌گیرند؟» راس - که همچنین بنیانگذار و رهبر گروه Keyland است - از من می پرسد. فوتبال من در دبیرستان، 30 سال پیش به پایان رسید، اما من یک گیرنده شکاف بودم که به گرفتن هر چیزی که به راهم می‌افتد شهرت داشتم. اگر الان شروع به انداختن کارت کنم والدینم چه می گویند؟ به او قول می دهم: «بدنم را روی این چمن می اندازم تا پاس را از دست ندهم. در چند ماه آینده، راس تلاش خواهد کرد تا به عنوان مربی و هنرمند تور، تعادل نسبتاً منحصر به فردی ایجاد کند. او سالن مرکوری در تولسا، در 30 دقیقه شمال بیکسبی را تیتر خواهد کرد و آن را به فروش خواهد رساند، یک مسیر ساحل شرقی را برای مورگان وید باز خواهد کرد و مجموعه ای از تاریخ های سال 2027 را اعلام خواهد کرد که از کیتلین باتس حمایت می کنند. و در حالی که او ظاهراً در حال تبلیغ Knuckle Sandwich، سومین آلبوم استودیویی کیلند", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Keyland020-2.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۵ آذر • ۱۸:۳۰"}, {"source": "Hollywood Reporter", "title": "Get Ready for the Great Asterix Film Festival and Three Restored ‘Asterix’ Animated Movies!", "link": "https://www.hollywoodreporter.com/movies/movie-news/asterix-film-festival-three-restored-asterix-movies-coming-1236763992/", "summary": "StudioCanal and Mediatoon Distribution have struck a distribution agreement for the popular European comic book franchise.", "date_str": "2026-11-26T14:59:34+00:00", "hash": "3045644c5abdd881", "title_fa": "برای جشنواره بزرگ فیلم آستریکس و سه انیمیشن بازسازی شده «آستریکس» آماده شوید!", "summary_fa": "StudioCanal و Mediatoon Distribution قراردادی را برای توزیع مجموعه محبوب کتاب های مصور اروپایی منعقد کرده اند. StudioCanal، واحد استودیو Canal+ Group، و Mediatoon Distribution، بازوی توزیع محتوا Média-Participations، توافقنامه توزیع اروپایی را که شامل سه فیلم کلاسیک انیمیشن آستریکس بازسازی شده است، منعقد کرده‌اند. این قرارداد شامل سه عنوان برجسته از کاتالوگ فرنچایز، یعنی آستریکس گول، آستریکس و کلئوپاترا، و آستریکس رم را فتح می‌کند، در چندین قلمرو اروپایی، از جمله فرانسه، آلمان، لهستان و هلند. شرایط مالی فاش نشد. اولین ابتکار مهم تحت این مشارکت، جشنواره بزرگ فیلم آستریکس خواهد بود که توسط StudioCanal در آلمان از ژانویه 2027 برگزار می شود. داستان‌های مرتبط سازندگان تاریک تلویزیونی در اولین تیزر خبری از جنگل‌های وهم‌آور آلمان بازدید می‌کنند. دادگاه فرانسوی درخواست تجدیدنظر دوپاردیو در پرونده تجاوز را رد کرد. شرکت مشهور در ماجراجویی‌های روز پنجشنبه اعلام کرد که جشنواره این سه فیلم را در نسخه‌های بازسازی‌شده‌شان به صفحه بزرگ بازمی‌گرداند و به مخاطبان فرصتی منحصربه‌فرد برای کشف دوباره برخی از نمادین‌ترین انیمیشن‌های ماجراجویی ارائه می‌دهد. در کنار این رویداد تئاتری، مجموعه جعبه دی وی دی کلکسیونی شامل این سه فیلم به ترتیب در فصل تعطیلات 2026 و در بهار 2027 در فرانسه و آلمان منتشر خواهد شد. در لهستان و هلند، این فیلم‌ها بر روی پلتفرم‌های ویدیویی بر اساس تقاضا نیز در دسترس خواهند بود و مخاطبان جدیدی را در هر دو منطقه به دست خواهند آورد. این ابتکار بخشی از یک تلاش گسترده تر برای جشن گرفتن و ترویج جهان آستریکس در سراسر اروپا است. به گفته استودیوکانال، این چندین نقطه عطف مهم در تاریخ این فرنچایز در سال‌های آینده همراه خواهد بود، از جمله پنجاهمین سالگرد Asterix Conques Rome و شصتمین سالگرد Asterix the Gaul در سال 2028.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2019/11/asterix-publicity_-_h_2019_.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۵ آذر • ۱۸:۲۹"}, {"source": "Billboard", "title": "Was The Rolling Stones’ 1973 Still Part of the Band’s Classic Period, Or the Beginning of the End? (Greatest Pop Stars Podcast)", "link": "https://www.billboard.com/music/pop/rolling-stones-1973-greatest-pop-stars-podcast-discussion-1236390158/", "summary": "In 1973, The Rolling Stones were coming off one of the greatest album runs in rock and roll history, a four-album stretch that cemented them as the World s Greatest Rock and Roll Band, culminating in 1972 s Exile on Main Street and its legendarily hedonistic accompanying tour. Rather than take time off to victory lap following this iconic period, they headed to Jamaica to record their third album of the 70s, released in 1973 as Goats Head Soup — which topped the Billboard 200 and spawned a Billboard Hot 100 No. 1 single with breakup ballad Angie, but drew middling lukewarm and is now viewed by many fans as the beginning of the end of the band s glory days. On this Vintage Pop Stardom episode of the Greatest Pop Stars podcast , host Andrew Unterberger is joined by Billboard executive digital director, east coast Joe Lynch — who wrote an excellent Stones cover story in July — to discuss a fascinating year in the Stones trajectory, where they were still one of the biggest bands in the world, but moving into their holiday period as rock standard-bearers. Along the way, we answer all the most pressing questions about the 1973 Rolling Stones: Was Goats Head Soup really that much of a step down for the Stones, or is it a bit misunderstood historically? Is it surprising we didn t get more of a reggae album out of it? What was the deal with that album title and album cover? Is Angie a little too MOR for our tastes? How much did the band go on to miss Mick Taylor (and/or Jimmy Miller) after their departures? Was Truman Capote really unable to find a story following the Stones on their single most storied tour? And perhaps most importantly: Why the hell are we doing the 1973 Rolling Stones for this podcast right now anyway? Check it out above, along with a YouTube playlist of the Stones biggest 1973 moments — all of which are discussed in the episode — and subscribe to the Greatest Pop Stars podcast on Apple Music or Spotify (or wherever you get your podcasts ) for weekly discussions every Thursday about all things related to pop stardom! And as we say in every one of these GPS podcast posts — if you have the time and money to spare, please consider donating to any of these causes in the fight for trans rights: Transgender Law Center Trans Lifeline Destination Tomorrow Gender-Affirming Care Fundraising on GoFundMe Human Rights Campaign – In Your Area", "date_str": "2026-11-26T14:47:13+00:00", "hash": "03cece9e5f3a13a9", "title_fa": "آیا سال 1973 رولینگ استونز هنوز بخشی از دوره کلاسیک گروه بود یا آغاز پایان آن؟ (پادکست بزرگترین ستاره های پاپ)", "summary_fa": "در سال 1973، رولینگ استونز یکی از بهترین آلبوم‌های تاریخ راک اند رول را منتشر کرد، چهار آلبومی که آنها را به عنوان بزرگترین گروه موسیقی راک اند رول جهان تثبیت کرد و در تبعید در خیابان اصلی در سال 1972 و ت         const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
