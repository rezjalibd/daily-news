iggle will host, introducing audiences to a lineup of true stories that honor the courage, sacrifice and legacy of America’s [ ]", "date_str": "2026-10-30T16:30:00+00:00", "hash": "5c807a0a9ea32fc1", "title_fa": "اپرا وینفری، کریستن بل، بیل هدر و بسیاری دیگر در فیلم ویژه روز کهنه سربازان \"American Valor: A Salute to Our Heroes\" حضور خواهند داشت.", "summary_fa": "روز شنبه، ۱۴ نوامبر، ویژه «شجاوری آمریکایی: درود بر قهرمانان ما» برای چهاردهمین سال خود در ایستگاه‌های ABC، CBS، NBC و فاکس بازمی‌گردد. راب ریگل، بازیگر، کمدین و کهنه‌کار نیروی تفنگداران دریایی ایالات متحده میزبانی خواهد کرد و مجموعه‌ای از داستان‌های واقعی آمریکایی، داستان‌های فداکارانه آمریکایی و همکار آمریکایی را به مخاطبان معرفی می‌کند. ویژه روز کهنه سربازان \" Valor: A Salute to Our Heroes \" برای چهاردهمین سال خود در ایستگاه های ABC، CBS، NBC و Fox در روز شنبه، 14 نوامبر بازمی گردد. تیم هولبرت، رئیس مرکز کهنه سربازان آمریکا و تهیه‌کننده اجرایی «شفت آمریکا» در بیانیه‌ای گفت: «دلاوری آمریکایی» به این معناست که به‌عنوان یک ملت چه کسی هستیم و چه کسی مدیون آن هستیم. دویست و پنجاه سال آمریکا، هشتاد و پنج سال از پرل هاربر، بیست و پنج سال از 11 سپتامبر. برنامه امسال نسل‌های آمریکایی را در بهترین حالت خود گرد هم می‌آورد و به ما یادآوری می‌کند که چه کسی هستیم و چه کسی می‌خواهیم باشیم.» همچنین ادای احترامی به 25مین سالگرد مجموعه \"Band of Brothers\" و ادای احترام به جیمی استوارت با همکاری فیلم زندگینامه \"جیمی\" در 6 نوامبر برگزار خواهد شد. ریگل گفت: «من از بازگشت برای «شجاوری آمریکایی» و کمک به احترام به مردان و زنانی که به کشور ما خدمت کرده‌اند، هیجان‌زده هستم. \"این کهنه سربازان داستان های باورنکردنی دارند و مهم است که ما همچنان آنها را به اشتراک بگذاریم و آنچه را که آنها به کشورمان داده اند را بشناسیم. من همچنین مفتخرم که امسال بخشی از ادای احترام به جیمی استوارت هستم، کسی که حرفه خود را برای خدمت در طول جنگ جهانی دوم متوقف کرد. داستان او نمونه بزرگ دیگری از فداکاری های بسیاری از آمریکایی ها در خدمت به کشورمان است.\"", "image_url": "https://variety.com/wp-content/uploads/2026/06/oprah.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۸ آبان • ۲۰:۰۰"}, {"source": "Variety", "title": "The Ultimate Gift for Film Lovers? Criterion’s New Stanley Kubrick Box Set", "link": "https://variety.com/2026/shopping/news/stanley-kubrick-criterion-box-set-buy-online-1236935266/", "summary": "For the film buff who already owns every Criterion release worth having, the boutique home-video distributor has made holiday shopping a little easier this year. Released Oct. 20, &#x201C;The Complete Kubrick&#x201D; is a sprawling, 30-disc box set featuring all 13 of Stanley Kubrick&#x2019;s feature films and three early shorts, restored in 4K. The collection, which [ ]", "date_str": "2026-10-30T16:22:10+00:00", "hash": "c7f74687fce3cce8", "title_fa": "بهترین هدیه برای عاشقان فیلم؟ جعبه جعبه جدید استنلی کوبریک Criterion", "summary_fa": "برای علاقه مندان به فیلم که در حال حاضر تمامی نسخه های Criterion را دارند که ارزش داشتن را داشته باشد، توزیع کننده بوتیک ویدئوهای خانگی امسال خرید تعطیلات را کمی آسان کرده است. «کوبریک کامل» که در 20 اکتبر اکران شد مجموعه‌ای وسیع با 30 دیسک است که شامل تمام 13 فیلم بلند استنلی کوبریک و سه فیلم کوتاه اولیه است که با کیفیت 4K بازسازی شده‌اند. مجموعه ای که [ ] اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. در میان عناوین گنجانده شده برخی از تأثیرگذارترین فیلم های قرن بیستم، از جمله طنز جنگ سرد «Dr. Strangelove» (1964)، حماسه علمی-تخیلی پیشگامانه «2001: A Space Odyssey» (1968)، درام جنایی دیستوپایی «A Clockwork Orange» (1971) و اقتباس استیون کینگ «The Shining» (1980) با بازی جک نیکلسون. این مجموعه همچنین شامل درام ضدجنگ «مسیرهای شکوه» (1957) به رهبری کرک داگلاس، حماسه تاریخی برنده اسکار «اسپارتاکوس» (1960)، فیلم جنگ ویتنام «جلیقه فلزی کامل» (1987) و درام دوره‌ای «بری لیندون» (1975) است که به دلیل استفاده از شمع‌ها و اقتباس‌های خاص از فیلم‌های سینمایی تحسین شده است. برای سینماگران علاقه مند به آثار قبلی و کمتر شناخته شده این فیلمساز، مجموعه شامل تریلر نوآر «کشتن» (1956)، درام بوکس «بوسه قاتل» (1955) و اقتباس او از رمان جنجالی «لولیتا» ولادیمیر ناباکوف (1962) است.", "image_url": "https://variety.com/wp-content/uploads/2026/10/81KrvZSCjEL._SL1500_.jpg?w=1000&#038;h=563&#038;crop=1", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۸ آبان • ۱۹:۵۲"}, {"source": "Billboard", "title": "Yami Safdie and Maluma’s ‘Felicidades,’ & More: Vote for the Best New Latin Music Release This Week", "link": "https://www.billboard.com/music/latin/best-new-latin-music-poll-yami-safdie-maluma-daddy-yankee-1236371009/", "summary": "This week, Billboard’s New Music Latin poll — curated with key recommendations by Billboard Latin and Billboard Español editors — features new music including albums by Daddy Yankee (La Postal) and Wow Popy (Mundial) . It also spotlights fiery collaborations such as Los Dos de Tamaulipas and Frontera on Piquito ; Santana and Natalia Lafourcade on Hermano ; and new Latin couple La Joaqui and Tiago PZK on Obsesión,” produced by Ovy on the Drums. Most notably Yami Safdie and Maluma teamed up for the first time on “Felicidades” — a cumbia-pop fusion that celebrates a person who walked out of a toxic relationship. On the catchy collab, both the Argentina songstress and Colombian superstar encourage those who are back on the market to embrace their self-worth and new, single life. “Congratulations on having made the best decision of your life […] because it truly is better to be alone than to live a fake love,” goes the empowering chorus. Daddy Yankee surprised fans with the release of his new studio album La Postal, a 15-track set that includes collaborations with Cardi B, Myke Towers, and Danny Ocean, among others. From pop to bachata to reggaetón, the Puerto Rican artist — who is The Latin Recording Academy’s 2026 Person of the Year — delivers feel-good and romantic songs. “I wanted to tell the real story of love: what we experience, what we feel, and what we often don’t know how to express. A love that isn’t always perfect or fake. A love that is raw and real, with its moments of happiness, its contradictions, its wounds, its goodbyes, and its healing,” the artist said in a press statement. “This album comes from the real experiences we go through in a relationship: true love and true heartbreak, without filters and without pretending. It talks also about the love of family, the discipline of loving yourself and the love that comes from having faith. These are stories I have lived, witnessed and carried with me.” Also dropping new music this week are Emilia and Codiciado. Which release this week do you think is best? Give these new albums a spin and vote for your favorite new Latin music release below. Editor’s Note: The results of the weekly New Music Latin poll will be posted if the poll generates more than 1,000 votes. This poll closes at 11 a.m. ET on Monday (Nov. 2). Take Our Poll Take Our Poll", "date_str": "2026-10-30T16:00:02+00:00", "hash": "26a3f4d513d915b9", "title_fa": "\"Felicidades\" و بیشتر از Yami Safdie و Maluma: برای بهترین نسخه جدید موسیقی لاتین رای دهید این هفته", "summary_fa": "این هفته، نظرسنجی لاتین New Music Billboard - که با توصیه‌های کلیدی توسط ویراستاران Billboard Latin و Billboard Español انجام شده است - دارای موسیقی جدیدی از جمله آلبوم‌های Daddy Yankee (La Postal) و Wow Popy (Mundial) است. همچنین همکاری های آتشینی مانند Los Dos de Tamaulipas و Frontera در Piquito را برجسته می کند. سانتانا و ناتالیا لافورکید در هرمانو. و زوج لاتین جدید La Joaqui و Tiago PZK در Obsesión، تولید شده توسط Ovy on the Drums. مهم‌تر از همه، یامی سافدی و مالوما برای اولین بار در «Felicidades» با یکدیگر همکاری کردند - یک تلفیقی کامبیا-پاپ که فردی را تجلیل می‌کند که از یک رابطه سمی خارج شده است. در این همکاری جذاب، هم خواننده آرژانتینی و هم سوپراستار کلمبیایی، کسانی را که به بازار بازگشته‌اند تشویق می‌کنند تا ارزش خود و زندگی مجردی جدید خود را در آغوش بگیرند. گروه کر قدرتمند می‌گوید: «تبریک می‌گویم که بهترین تصمیم زندگی‌تان را گرفتید […] زیرا واقعاً تنها بودن بهتر از زندگی کردن یک عشق ساختگی است. Daddy Yankee با انتشار آلبوم استودیویی جدید خود La Postal، یک مجموعه 15 آهنگی که شامل همکاری با Cardi B، Myke Towers و Danny Ocean و دیگران است، طرفداران را شگفت زده کرد. از پاپ گرفته تا باچاتا و رگیتون، هنرمند پورتوریکویی - که شخصیت سال 2026 آکادمی ضبط لاتین است - آهنگ‌هایی با احساس خوب و عاشقانه ارائه می‌کند. می‌خواستم داستان واقعی عشق را بگویم: آنچه را که تجربه می‌کنیم، آنچه را که احساس می‌کنیم، و آنچه اغلب نمی‌دانیم چگونه بیان کنیم. عشقی که همیشه کامل یا ساختگی نیست. عشقی خام و واقعی، با لحظات شادی، تناقضات، زخم‌ها، خداحافظی‌ها و التیام‌بخش‌هایش.» این هنرمند در بیانیه‌ای گفت: «این آلبوم برگرفته از تجربیات واقعی است که ما در یک رابطه تجربه می‌کنیم: عشق واقعی و دلشکستگی واقعی، بدون فیلتر و بدون تظاهر. همچنین", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/maluma-yami-safdie-cr-padox-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Olivia Rodrigo Wears Concert Shirt Supporting Dr. Amy Acton for Ohio Governor Amid Ramaswamy Ad Controversy", "link": "https://www.billboard.com/music/music-news/olivia-rodrigo-dr-amy-acton-governor-shirt-ohio-concert-1236370955/", "summary": "Olivia Rodrigo got involved in the Ohio gubernatorial race while stopping in the state s capital Columbus on her Unraveled Tour on Thursday (Oct. 29). Related Olivia Rodrigo Checks Out My Chemical Romance Show as Both Acts Aim High on Billboard 200 Olivia Rodrigo Slams Donald Trump Administration for Picking Fights With Pop Stars Olivia Rodrigo Slams ICE for Using Her Song to Promote Racist, Hateful Propaganda During her set at the Schottenstein Center supporting the Billboard 200 -topping 2026 album You Seem Pretty Sad for a Girl So in Love , the singer donned a white T-shirt that read: Dr. Amy Acton for Governor. As captured in footage from the show, Rodrigo made a point of highlighting the top and giving a thumbs-up to the camera beaming images to the arena s big screens. Acton also took note of the gesture, sharing a photo of Rodrigo s political fashion choice on Instagram and writing, Ohio loves you, @oliviarodrigo ! The pop star s show of support comes with just a few days left until Tuesday s (Nov. 3) midterm election, which will decide who will replace term-limited Ohio Gov. Mike DeWine. President Donald Trump has been traveling around the country in recent weeks to drum up support for Republican candidates including for Acton s opponent, billionaire tech mogul and brief DOGE department co-leader Vivek Ramaswamy. Ramaswamy recently faced bipartisan backlash for airing an ad starring Acton s mother, from whom the Democratic politician has been estranged for more than 40 years after Acton s then-stepfather was charged with raping her as a young child nearly 50 years ago, according to NBC News . Without discussing the rape case, Acton s mother calls her daughter a liar in the ad and urges Ohioans not to vote for her. It s not surprising that Vivek Ramaswamy has stooped to such a despicable low as to attempt to turn the sexual abuse Amy endured at 12 years old from our birth mother s husband into a political talking point, Anton s brother, Philip Stearns, said in a statement of the ad — which both Ramaswamy and Trump have stood by even as it has drawn bipartisan rebuke and been dubbed one of the most vile ads of an already very contentious, costly midterm election season. This desperate, disgusting attack reveals exactly who Vivek Ramaswamy is at his core — a pathetic excuse for a man who is willing to hurt anyone as long as it gets him what he wants, Sterns adds. Rodrigo has long been vocal about her political views, particularly reproductive freedoms", "date_str": "2026-10-30T15:34:01+00:00", "hash": "ff4e5566455094fa", "title_fa": "اولیویا رودریگو پیراهن کنسرت حمایت از دکتر امی اکتون برای فرماندار اوهایو در میان جنجال تبلیغاتی راماسوامی می پوشد.", "summary_fa": "اولیویا رودریگو در حالی که در تور Unraveled خود در روز پنجشنبه (29 اکتبر) در کلمبوس پایتخت ایالت توقف می کرد، در مسابقه فرمانداری اوهایو شرکت کرد. مرتبط اولیویا رودریگو نمایش عاشقانه شیمیایی من را در حالی که هدف هر دوی آنها در بیلبورد 200 بالا است را بررسی می کند. آلبوم 2026 You Seem Pretty Sad for a Girl So in Love، خواننده یک تی شرت سفید پوشید که روی آن نوشته شده بود: دکتر امی اکتون برای فرماندار. همانطور که در تصاویری از نمایش گرفته شده است، رودریگو با برجسته کردن قسمت بالایی و دادن انگشت شست به دوربین که تصاویر را به صفحه نمایش بزرگ میدان می فرستد، اشاره کرد. اکتون همچنین به این ژست توجه کرد و عکسی از انتخاب مد سیاسی رودریگو در اینستاگرام به اشتراک گذاشت و نوشت، اوهایو شما را دوست دارد، @oliviarodrigo! تنها چند روز تا انتخابات میان‌دوره‌ای سه‌شنبه (3 نوامبر) باقی مانده است، که در آن تصمیم می‌گیرد چه کسی جایگزین مایک دی‌واین، فرماندار اوهایو با دوره محدود، خواهد شد. دونالد ترامپ، رئیس‌جمهور آمریکا در هفته‌های اخیر به سراسر کشور سفر کرده است تا از نامزدهای جمهوری‌خواه حمایت کند، از جمله از رقیب اکتون، غول فناوری میلیاردر و ویوک راماسوامی، یکی از رهبران بخش DOGE. به گزارش ان بی سی نیوز، راماسوامی اخیراً به دلیل پخش تبلیغی با حضور مادر اکتون، که این سیاستمدار دموکرات بیش از 40 سال پس از متهم شدن ناپدری آن زمان اکتون به تجاوز جنسی به او در کودکی نزدیک به 50 سال پیش، از او دور بود، با واکنش شدید دو حزب مواجه شد. مادر اکتون بدون اینکه در مورد پرونده تجاوز صحبت کند، دخترش را در آگهی دروغگو خطاب می کند و از مردم اوهایو می خواهد که به او رای ندهند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/P108EWUI-e1790403880895.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۱۹:۰۴"}, {"source": "Billboard", "title": "Harry Styles’ Together, Together Tour 2026: Here’s Where to Buy Last-Minute New York Residency Tickets Online", "link": "https://www.billboard.com/culture/product-recommendations/harry-styles-together-together-2026-tour-shop-tickets-online-1236160428/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. After nearly 30 concerts, Harry Styles&#x2019; massive New York City residency at Madison Square Garden , as part of the Together, Together tour , is coming to a close with just two more dates on Friday (Oct. 30) and Saturday (Oct. 31) &#x2014; AKA Harryween, an elaborate and over-the-top costume party for Halloween. Additionally, English DJ Jamie xx is set to open during the entire MSG residency, which in support of his fourth album, Kiss All the Time. Disco, Occasionally . Afterwards, the Grammy Award-winning singer/songwriter heads to Australia to close out the tour. Shop Harry Styles Tour Tickets AT Ticketmaster Tickets to the tour first went on sale through Live Nation and Ticketmaster , while the retailer&#x2019;s Face Value Exchange program is an option for fans to resell tickets. However, many of the dates have either sold out, or are very close to selling out, so one of the best ways to find last-minute Harry Styles tickets online is through third-party sites, such as StubHub , Vivid Seats , SeatGeek , TicketNetwork , Gametime , Event Tickets Center and others. All online retailers guarantee authentic tickets in time for your concert. Prices may be above or below face value at times. Where to Find Harry Styles Tickets Online EDITOR'S PICK Find Harry Styles Tickets at StubHub find tickets here Top choice for concert tickets in 2026. StubHub has all-in pricing, so all fees are listed upfront. The site&#x2019;s &#x201C;FanProtect Guarantee&#x201D; ensures that tickets are valid and delivered in time for the concert. If not, you&#x2019;ll get your money back. Additionally, if the concert is canceled and not rescheduled, you&#x2019;ll receive 120% credit, or be offered a full refund without the extra credit. At the time of publishing, Harry Styles tickets start at $763. EARN REWARDS Find Harry Styles Tickets at Vivid Seats FIND TICKETS HERE Vivid Seats lets you search by type of seat, such as suite, standing room, front of section or the VIP section, while the retailer prioritizes &#x201C;Super Sellers&#x201D; who are &#x201C;experienced, highly-rated sellers.&#x201D; With Vivid Seats, your purchase is protected with the company&#x2019;s &#x201C;100% Buyer Guarantee,&#x201D; which ensures that you receive legitimate tick", "date_str": "2026-10-30T15:30:59+00:00", "hash": "20be371bb5c56fe2", "title_fa": "تور هری استایلز با هم، با هم 2026: در اینجا می توان بلیط لحظه آخری اقامت نیویورک را به صورت آنلاین خریداری کرد", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. پس از نزدیک به 30 کنسرت، اقامتگاه عظیم هری استایلز در شهر نیویورک در مدیسون اسکوئر گاردن، به عنوان بخشی از تور Together, Together، تنها با دو تاریخ دیگر در جمعه (30 اکتبر) و شنبه (اکتبر) به پایان می رسد. 31) - AKA Harryween، یک مهمانی لباس پیچیده و فوق العاده برای هالووین. علاوه بر این، دی جی انگلیسی Jamie xx قرار است در طول دوره اقامت MSG، که در حمایت از چهارمین آلبوم او، Kiss All Time، افتتاح شود. دیسکو، گاهی اوقات پس از آن، خواننده/ترانه سرای برنده جایزه گرمی برای پایان دادن به تور به استرالیا می رود. بلیط‌های تور هری استایلز را در Ticketmaster بخرید بلیط‌های تور ابتدا از طریق Live Nation و Ticketmaster به فروش رفت، در حالی که برنامه تبادل ارزش اسمی خرده‌فروش گزینه‌ای برای طرفداران برای فروش مجدد بلیط است. با این حال، بسیاری از تاریخ ها یا فروخته شده اند یا بسیار نزدیک به فروش هستند، بنابراین یکی از بهترین راه ها برای یافتن بلیط های لحظه آخری هری استایلز به صورت آنلاین از طریق سایت های شخص ثالث، مانند StubHub، Vivid Seat، SeatGeek، TicketNetwork، Gametime، مرکز بلیط رویداد و موارد دیگر است. همه خرده فروشان آنلاین بلیط های معتبر را به موقع برای کنسرت شما تضمین می کنند. قیمت ها ممکن است در مواقعی بالاتر یا کمتر از ارزش اسمی باشند. کجا می‌توان بلیط‌های هری استایلز را پیدا کرد. انتخاب ویرایشگر آنلاین بلیط‌های هری استایلز را در StubHub پیدا کنید، بلیت‌ها را اینجا بیابید بهترین انتخاب برای بلیت‌های کنسرت در سال 2026. StubHub قیمت‌های همه جانبه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/01/P115RXXH-e1769111580602.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۱۹:۰۰"}, {"source": "Billboard", "title": "Blue Oyster Cult’s ‘Reacher’ Synch Hits No. 1 on Top TV Songs Chart", "link": "https://www.billboard.com/music/chart-beat/blue-oyster-cult-reacher-synch-number-1-top-tv-songs-chart-1236370970/", "summary": "Blue Oyster Cult ’s “(Don’t Fear) the Reaper” jumps to No. 1 on Billboard ’s Top TV Songs chart, powered by Tunefind (a Songtradr company), for September 2026, driven by its synch in the new season of Prime Video’s Reacher . Rankings for the Top TV Songs chart are based on song and show data provided by Tunefind and ranked using a formula blending that data with sales and streaming information tracked by Luminate during the corresponding period of September 2026. “The Reaper” appears in the sixth episode of Reacher ’s fourth season; it aired on Sept. 2, with its season finale following two weeks later on Sept. 16 (a spinoff series, Neagley , premiered the same day; more on it later). In September 2026, “The Reaper” earned 11.8 million official streams and sold 1,000 downloads in the United States, according to Luminate. The tune was Blue Oyster Cult’s top-charting song on the Billboard Hot 100, peaking at No. 12 in 1976. Reacher is also represented on the September 2026 Top TV Songs list by Mondo Cozmo’s “Sweet Forever,” which bows at No. 10 (207,000 streams, 1,000 downloads) after being heard in the season finale. Aforementioned spinoff Neagley , also airing on Prime Video, occupies two positions on the 10-song chart as well, paced by Ambrosia’s “How Much I Feel,” which comes in at No. 6 (6.7 million streams, 1,000 downloads). The track peaked at No. 3 on the Hot 100 in 1978. See the full chart, also featuring music from Ted Lasso , Monster: The Lizzie Borden Story , Chad Powers and The Shards , below. Rank, Song, Artist, Show (Network) 1. (Don t Fear) the Reaper, Blue Oyster Cult, Reacher (Prime Video) 2. Jump Around, House of Pain, Ted Lasso (Apple TV+) 3. Smalltown Boy, Bronski Beat, Monster: The Lizzie Borden Story (Netflix) 4. The Promise, When in Rome, Chad Powers (Hulu) 5. Hold On, Wilson Phillips, Ted Lasso (Apple TV+) 6. How Much I Feel, Ambrosia, Neagley (Prime Video) 7. Bette Davis Eyes, Kim Carnes, The Shards (FX) 8. Pump Up the Jam, Technotronic, Neagley (Prime Video) 9. When I Get My Hands on You, The New Basement Tapes, Ted Lasso (Apple TV+) 10. Sweet Forever, Mondo Cozmo, Reacher (Prime Video)", "date_str": "2026-10-30T15:20:42+00:00", "hash": "e23b8ea827ee1e9b", "title_fa": "سینک «ریچر» از گروه Blue Oyster در جدول آهنگ های برتر تلویزیون رتبه اول را کسب کرد.", "summary_fa": "آهنگ Blue Oyster Cult \"(Don't Fear) the Reaper\" به رتبه 1 جدول آهنگ های برتر تلویزیونی بیلبورد، با پشتیبانی از Tunefind (یکی از شرکت های Songtradr) برای سپتامبر 2026، به دلیل همگام سازی آن در فصل جدید Prime Video's Reacher، پرش کرد. رتبه‌بندی نمودار آهنگ‌های برتر تلویزیون بر اساس داده‌های آهنگ و نمایش ارائه‌شده توسط Tunefind است و با استفاده از فرمولی ترکیبی از این داده‌ها با اطلاعات فروش و پخش‌شده توسط Luminate در دوره مشابه سپتامبر ۲۰۲۶ رتبه‌بندی می‌شود. \"درو\" در قسمت ششم از فصل چهارم ریچر ظاهر می شود. در 2 سپتامبر پخش شد و پایان فصل آن دو هفته بعد در 16 سپتامبر پخش شد (سریال اسپین آف، Neagley، در همان روز نمایش داده شد؛ بعداً در مورد آن بیشتر توضیح خواهیم داد). طبق گزارش Luminate، در سپتامبر 2026، «درو» 11.8 میلیون استریم رسمی به دست آورد و 1000 بار دانلود در ایالات متحده فروخت. این آهنگ، آهنگ برتر بلو Oyster Cult در بیلبورد Hot 100 بود که در سال 1976 به رتبه 12 رسید. ریچر همچنین در فهرست آهنگ‌های برتر تلویزیونی سپتامبر 2026 توسط آهنگ Sweet Forever از Mondo Cozmo که پس از شنیدن در پایان فصل در رتبه 10 قرار می‌گیرد (207000 استریم، 1000 بارگیری) است. اسپین‌آف فوق‌الذکر Neagley که در پرایم ویدیو نیز پخش می‌شود، در جدول 10 آهنگی نیز دو جایگاه را به خود اختصاص داده است، با آهنگ «چقدر احساس می‌کنم» از آمبروزیا، که در رتبه 6 قرار دارد (6.7 میلیون استریم، 1000 دانلود). این آهنگ در سال 1978 در هات 100 به رتبه 3 رسید. نمودار کامل را که شامل موسیقی تد لاسو، هیولا: داستان لیزی بوردن، چاد پاورز و شارد نیز می‌شود، در زیر ببینید. رتبه، آهنگ، هنرمند، نمایش (شبکه) 1. (Don t Fear) The Reaper، Blue Oyster Cult، Reacher (Prime Video) 2. Jump Around، House of Pain، Ted Lasso", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/2199986182-e1793373065791.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "موسیقی", "نتفلیکس"], "datetime_fa": "۸ آبان • ۱۸:۵۰"}, {"source": "Billboard", "title": "Watch ‘SNL’s Michael Che and Colin Jost Almost Get Stiffed By a Taylor Swift Question on ‘Who Wants to Be A Millionaire’", "link": "https://www.billboard.com/culture/tv-film/snl-michael-che-colin-jost-taylor-swift-question-millionaire-1236370947/", "summary": "Weekend Update co-anchors Michael Che and Colin Jost are used to sitting behind an anchor desk on Saturday Night Live and delivering punch line-laden takes on the day s news. But when the duo appeared on this week s episode of Who Wants to Be a Millionaire , it was their turn to put their news know-how to the test. And when it came to the $4,000 question about the shortest track on Taylor Swift s The Life of a Showgirl album, the pair showed that beneath all the jokes they re, kind of, Swifties at heart. Well, at least Jost is. The question was, Ironically, what innuendo-laden song is the shortest track on Taylor Swift s album The Life of a Showgirl ?, with the answers including Wood, Anti-Hero, Cruel Summer and Karma. Che, who initially reacted to the question with an uh-oh, of course, had jokes, beginning with Innuendo-laden? Is that a terrorist?, to which host Jimmy Kimmel yes-and d You re thinking of Innuendo Laden. Jost, though, went through the track length of each, randomly throwing out the totally freestyled answer, Cruel Summer is 3:23, Karma is 4:24,” as Kimmel giggled at the bit. “So, there’s one, that’s why I was originally thinking that it was A,” Jost said, referring to “Wood.” “I don’t want to explain to you why,” he told Che, who paused for a second and then said wide-eyed, Oh! “And, I feel like the irony is, if you know some of the lyrics of the song, is talking about size,” Jost explained, showing off his Swifty knowledge while teasing out the “shortest track” hint in the clue. Che trusted his news pal, telling Jost to, “Lock it in, baby. I wood.” As any Swiftie knows, Wood is the only one of the four on the album and, as suggested by the clue, it is filthy with innuendo about the impressive nature of Swift s husband Travis Kelce s package. Che and Jost survived their Swift challenge and won $250,000 for the charities Answer the Call and Food Bank for NYC on the show. Watch Che and Jost wrestle with the Swift question below. View this post on Instagram", "date_str": "2026-10-30T15:13:53+00:00", "hash": "81d28e4d2ad50b54", "title_fa": "تماشای «مایکل چه و کالین جوست از SNL تقریباً با یک سؤال تیلور سوئیفت در مورد «چه کسی می‌خواهد میلیونر شود» خفه می‌شوند", "summary_fa": "مایکل چه و کالین جوست، مجریان به‌روزرسانی آخر هفته، عادت دارند پشت میز مجریان در شنبه شب لایو بنشینند و در اخبار روز برنامه‌های پربار را ارائه دهند. اما وقتی این دو در قسمت این هفته از چه کسی می خواهد میلیونر شود، ظاهر شدند، نوبت آنها بود که دانش خبری خود را آزمایش کنند. و وقتی نوبت به سوال 4000 دلاری در مورد کوتاه‌ترین آهنگ آلبوم The Life of a Showgirl تیلور سوئیفت رسید، این زوج نشان دادند که در زیر تمام شوخی‌ها، به نوعی، سوئیفت‌ها هستند. خوب، حداقل جوست اینطور است. سوال این بود که از قضا، کوتاه ترین آهنگ آلبوم تیلور سوئیفت به نام The Life of a Showgirl کدام آهنگ مملو از کنایه است؟، با پاسخ هایی از جمله Wood، Anti-Hero، Cruel Summer و Karma. چه، که در ابتدا با یک اوه-اوه به این سوال واکنش نشان داد، البته، شوخی هایی داشت، که با Innuendo-laden شروع می شد؟ آیا این یک تروریست است؟، به میزبانی که جیمی کیمل بله و d شما به Innuendo Laden فکر می کنید. با این حال، جوست طول مسیر هر کدام را طی کرد، و به‌طور تصادفی پاسخ کاملاً آزاد را بیرون داد، تابستان ظالمانه 3:23 است، کارما 4:24 است. جوست با اشاره به \"وود\" گفت: \"بنابراین، یکی وجود دارد، به همین دلیل من در ابتدا فکر می کردم که A است.\" او به چه گفت: «نمی‌خواهم دلیلش را برایت توضیح دهم. جوست توضیح داد: \"و، من احساس می کنم کنایه از این است که اگر برخی از اشعار آهنگ را می دانید، در مورد اندازه صحبت می کنید.\" چه به دوست خبری خود اعتماد کرد و به جوست گفت: «قفلش کن عزیزم. من چوب می کنم.» همانطور که هر سوئیفتی می‌داند، وود تنها یکی از چهار آلبوم آلبوم است و همانطور که سرنخ نشان می‌دهد، کثیف با کنایه‌هایی در مورد", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P114IF5M-e1793371383100.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۱۸:۴۳"}, {"source": "Billboard", "title": "Chart Rewind: In 1976, Vern Gosdin Made His Debut ‘On’ Hot Country Songs", "link": "https://www.billboard.com/music/chart-beat/vern-gosdin-hangin-on-chart-rewind-1976-1236370365/", "summary": "Vern Gosdin’s lonesome tone and distinctive quiver made him one of country music’s singular artists, earning the nickname “The Voice.” His run on the Billboard charts began when his Elektra single, “Hangin’ On,” edged onto the Hot Country Songs list dated Oct. 30, 1976. Related Vern Gosdin, Country Music s The Voice, Dies At 74 Nashville Songwriters Hall of Fame Honoree Vern Gosdin Remembered as One of the Best of All Time Chart Rewind: In 2011, Scotty McCreery s Debut Album Made Him a Clear Country Favorite In truth, Gosdin had charted the song previously, taking it to No. 37 in 1967 as one-half of The Gosdin Brothers, including younger sibling Rex Gosdin. That version’s studio band included two future members of The Byrds, Clarence White and Gene Parsons. Written by Buddy Mize and Ira Allen, “Hangin’ On” was resurrected by producer Gary S. Paxton – who also produced Bobby “Boris” Pickett’s Halloween novelty “Monster Mash” – and recorded at Nashville’s Sound Stage in April 1976. Emmylou Harris provided female harmonies, as it rose to No. 16 on Jan. 8, 1977, launching a string of 41 Gosdin solo entries. Nineteen of them ascended to the top 10 – beginning with the “Hangin’ On” flip side, “Yesterday’s Gone” – and three of those titles reached No. 1: 1984’s “I Can Tell by the Way You Dance (You’re Gonna Love Me Tonight),” 1988’s “Set ‘Em Up Joe” and 1989’s “I’m Still Crazy.” An Alabama native, Gosdin shared the Country Music Association’s song of the year award with Max D. Barnes for the grief-stricken 1989 ballad “Chiseled in Stone,” and saw his top 10 1982 single “Today My World Slipped Away,” co-written with Mark Wright, rise to No. 3 in 1997 after it was covered by George Strait. Gosdin died at age 74 on April 28, 2009.", "date_str": "2026-10-30T15:12:39+00:00", "hash": "de181e0c0867a334", "title_fa": "بازگشت نمودار: در سال 1976، ورن گوسدین اولین آهنگ خود را با نام «On» Hot Country Songs انجام داد.", "summary_fa": "لحن تنها و لحن متمایز ورن گوسدین او را به یکی از هنرمندان بی‌نظیر موسیقی کانتری تبدیل کرد و لقب «صدا» را به خود اختصاص داد. حضور او در نمودارهای بیلبورد زمانی آغاز شد که تک‌آهنگ Elektra او، \"Hangin' On\" در فهرست آهنگ‌های Hot Country در تاریخ 30 اکتبر 1976 قرار گرفت. مربوط به ورن گوسدین، موسیقی کانتری، The Voice، در 74 تالار مشاهیر ترانه سرایان نشویل می میرد. افتخاری ورن گوسدین به عنوان یکی از بهترین های تمام دوران ها یاد می شود. عقب نشینی نمودار: در سال 2011، اولین آلبوم اسکاتی مک کری، او را به عنوان Clear Country Favourite ساخته بود. در سال 1967 به عنوان نیمی از برادران گوسدین، از جمله خواهر و برادر کوچکتر رکس گوسدین. گروه استودیویی آن نسخه شامل دو عضو آینده بیردز، کلارنس وایت و جین پارسونز بود. «Hangin’ On» که توسط بادی مایز و ایرا آلن نوشته شده بود، توسط تهیه‌کننده گری اس. پکستون زنده شد - که همچنین فیلم جدید هالووین بابی «بوریس» پیکت «Monster Mash» را تهیه کرد - و در استیج صدا در نشویل در آوریل 1976 ضبط شد. 1977، راه اندازی رشته ای از 41 مدخل انفرادی Gosdin. 19 نفر از آنها به 10 تای برتر صعود کردند - که با \"Hangin' On\" شروع شد، \"Yesterday's Gone\" - و سه تا از این عناوین به رتبه اول رسیدند. 1: «I Can Tell By Way You Dance» محصول 1984 (امشب دوستم خواهی داشت)، «Set ‘Em Up Joe» محصول 1988 و «I'm Still Crazy» محصول 1989. گوسدین که اهل آلاباما است، جایزه آهنگ سال انجمن موسیقی کانتری را با مکس دی. بارنز برای تصنیف غم‌انگیز «Chiseled in Stone» در سال 1989 به اشتراک گذاشت و 10 تک آهنگ برتر خود در سال 1982 «Today My World Slipped Away» را دید که با همکاری مارک رایت نوشته شده بود و", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Vern-Gosdin-1977-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۸ آبان • ۱۸:۴۲"}, {"source": "Billboard", "title": "Queens of the Stone Age Finds Healing in New Album ‘Perfecth’: ‘What Has Been Shattered is Made More Beautiful by the Act of Repair’", "link": "https://www.billboard.com/music/rock/queens-of-the-stone-new-album-perfecth-interview-1236370959/", "summary": "Queens of The Stone Age turned to kintsugi, the delicate Japanese art of repairing broken pottery by filling the cracks with molten gold, to create its new album, Perfecth . By embracing this Eastern technique, the California band reflects in their new LP on the process they faced following the recent health issues and personal struggles of vocalist Josh Homme, seeking transformation through the act of repair. “What has been shattered is made more beautiful, not less, by the act of repair,” Homme tells Billboard Español in a video interview. “That is why the songs on this album speak about different forms of love — for family, for friends and for other people, whether significant or insignificant. There are bonds that sustain us, and others that end up breaking us. Homme is excited about this new work, the band s ninth album, which led him and his bandmates (also including Troy Van Leeuwen (guitar), Dean Fertita (guitar and keyboards) and Jon Theodore (drums)) to work in different studios, cities and moments, even revisiting songs from previous sessions. Such is the case with fourth single “Run Away From the Mob,” originally recorded in 2013 with close collaborator Dave Grohl on the drums. Or “Sunday,” a track originally co-written by Homme for Iggy Pop’s 2016 album Post Pop Depression , in which the Queens frontman actively participated. Produced by Homme and bassist Michael Shuman, this nine-track LP, released Friday (Oct. 30) through Matador Records, was born from sessions recorded in places from New Orleans to Los Angeles, achieving a production that Homme describes as “very raw, very natural sounding.” I think a lot of these things were played all in a room together with all the band members together, explains the 53-year-old frontman. And so, you want things to sound as if you are sitting in the middle of the room with us. And so, it s very much like the 70s, where it feels like you re sitting in the room. And, so that s kind of the overall sound of this record. The result is a dark, emotional album that goes beyond the band s relentless stoner rock. In just 36 minutes — Queens shortest album to date — tracks such as powerful second single “Insignificant Other,” as well as “Where The Goth Girls At?,” “Mono,” “From The Cliff,” “Easy Street” and “Phantom Limb,” masterfully flirt with genres like art rock, jazz, folk and country blues. Following the surreal experience Homme and his bandmates had in 2024 when they entered the Catacombs of Paris to record", "date_str": "2026-10-30T15:02:48+00:00", "hash": "3ac505017a1356d0", "title_fa": "Queens of the Stone Age در آلبوم جدید «Perfecth» شفا می یابد: «آنچه شکسته شده است با عمل تعمیر زیباتر شده است»", "summary_fa": "Queens of The Stone Age برای ایجاد آلبوم جدید خود، sh": "485d8984a169d02f", "title_fa": "ببینید که سر پاتریک استوارت به «پت گاوچران» در Cheeky Country Infomercial تبدیل می‌شود", "summary_fa": "کابوی کلاسیک پاتریک استوارت شامل کاورهایی از آهنگ های غربی بود و به نفع کمیته نجات بین المللی بود. سر پاتریک استوارت، که در 28 اکتبر درگذشت، مردی با استعدادهای متعدد بود، از مقابله با چالش برانگیزترین قهرمانان شکسپیر تا تبدیل شدن به یک نام آشنا در Star Trek. اما آیا می‌دانستید که او تمایلی (بسیار گستاخ) به موسیقی کانتری نیز داشت؟ در سال 2016، استوارت یک خبررسان تقلبی به سبک دهه نود را برای آنچه که پاتریک استوارت's Cowboy Classics نامید، رها کرد، جایی که او در نقش «کاوبوی پت، معروف به «خواننده برتر گاوچران انگلستان» بازی کرد. استوارت با پیراهن فلانل، کلاه گاوچرانی و البته کلاه گاوچران، بخش‌هایی از آثار کلاسیک غربی مانند «Rawhide»، «Ghost) Riders in the Sky» و «Streets of Laredo» را علیه مناظر مختلف از سراسر ایالات متحده خواند. همانطور که راوی به خود می بالید، \"گاهی اوقات لازم است یک انگلیسی به ما بیاموزد که آمریکایی بودن چه چیزی عالی است.\" استوارت این پروژه را در توییتر خود معرفی کرد و نوشت: «چهارمین مریکا مبارک، کشوری عالی و قدرتمند. لوو، پت کابوی.» اگرچه راوی به خود می بالید که این مجموعه شامل 27 آهنگ است، کلاسیک کابوی پاتریک استوارت در واقع پروژه ای برای خیریه بود که تمام درآمد حاصل از آن به نفع کمیته نجات بین المللی، یک سازمان جهانی کمک های بشردوستانه، امداد و توسعه است که به خانواده های آسیب دیده از بحران در اروپا، خاورمیانه و جاهای دیگر کمک می کند. استوارت نسخه‌های محدودی از وب‌سایت خود را با نمونه‌گیری که برای دانلود در دسترس است فروخت – اگرچه مشخص نیست که آیا نسخه‌های فیزیکی واقعاً وجود داشته است یا خیر.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/10/patrick-stewart-cowboy-pat.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۱۸:۳۹"}, {"source": "Hollywood Reporter", "title": "Bobby Wright, ‘McHale’s Navy’ Actor, Singer and Son of Kitty Wells, Dies at 84", "link": "https://www.hollywoodreporter.com/tv/tv-news/bobby-wright-dead-mchales-navy-kitty-wells-1236743539/", "summary": "He portrayed the radio operator Willy Moss on the ABC comedy and had a country hit with “Here I Go Again.”", "date_str": "2026-10-30T15:34:18+00:00", "hash": "7d6708f1499ea747", "title_fa": "بابی رایت، بازیگر، خواننده و پسر کیتی ولز «مک‌هیل نیروی دریایی» در ۸۴ سالگی درگذشت.", "summary_fa": "او نقش اپراتور رادیویی ویلی ماس را در کمدی ای‌بی‌سی بازی کرد و با آهنگ «اینجا دوباره بروم» موفق به کسب موفقیت شد. بابی رایت، خواننده و پسر کیتی ولز، اسطوره موسیقی کانتری که نقش اپراتور رادیویی ویلی ماس را در کمدی محبوب ABC McHale's Navy بازی می کرد، روز سه شنبه در خانه خود در مدیسون، تنسی درگذشت. او 84 سال داشت. McHale’s Navy، با بازی ارنست بورگنین، جو فلین و تیم کانوی، به مدت چهار فصل (1962-1966) پخش شد و رایت در تمام 138 قسمت این نمایش که در قایق نیروی دریایی ایالات متحده PT-73 در اقیانوس آرام در طول جنگ جهانی دوم تنظیم شد، ظاهر شد. او همچنین با بقیه بازیگران در فیلم های McHale’s Navy (1964) و McHale’s Navy Joins the Air Force (1966) ظاهر شد. داستان های مرتبط قدردانی منتقد حرفه پاتریک استوارت ازدواج نادر و هیجان انگیز فیلم های معتبر و عامه پسند بود. نمودار آهنگ های کانتری، با آهنگ ملایم «Here I Go Again» در سال 1971 در رتبه 13 قرار گرفت. تک آهنگ های دیگر او عبارتند از: \"Lay Some Happiness on Me\"، \"Everybody Needs a Rainbow\"، یک کاور از \"Seasons in the Sun\" تری جکس، \"Lovin' Someone on My Mind\" و \"I'm Turning You Loose\" را نام برد. یکی از سه فرزند، جان رابرت رایت جونیور در 30 مارس 1942 در چارلستون، ویرجینیای غربی به دنیا آمد. پدرش جانی رایت بود که در کنسرتی به نام جانی جک به جنوب سفر کرد و ولز اغلب با آنها اجرا داشت.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/Bobby-Wright-Obit-Template-Headshot-Everett-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۸ آبان • ۱۹:۰۴"}, {"source": "Hollywood Reporter", "title": "Canadian Rock Icon Bryan Adams Takes Aim at Trump, Says His Protest Song Gets Standing Ovations in Red States (Exc 026-05-30-PM-8452.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۸ آبان • ۱۸:۵۱"}, {"source": "Billboard", "title": "‘Occupational Hazard’ Rock Doc Details the Untold Story of Jimmy Buffett’s ‘Ragtag,’ Pre-Fame Coral Reefer Band", "link": "https://www.billboard.com/music/rock/occupational-hazard-documentary-jimmy-buffett-1236370741/", "summary": "The Coral Reefer Band is as intrinsically a part of the Jimmy Buffett universe as the E Street Band is to Bruce Springsteen s, the Heartbreakers are to Tom Petty s and so on. But a largely untold portion of the band s story is the focus of the new documentary Occupational Hazard: The First Coral Reefers , which, after a nearly nine-month run in film festivals and theaters, becomes available Oct. 30 for rent via Apple TV, Amazon Prime Video, Google Play and Fandango. As the title indicates, Occupational Hazard is an origin story, from the beginnings of Buffett s career as a troubadour (after a tenure writing for Billboard ) and his move to Key West, Florida, where he assembled the initial Coral Reefer lineup during the mid-70s. (He used the name for an imaginary band during his solo performances before then.) Narrated by actor and Buffett friend Jeff Bridges, it details a decidedly different and significantly less polished ensemble than Parrotheads became used to from the late ‘70s until Buffett s death on Sept. 1, 2023. The portrayal is of a time when the Coral Reefer crew was wasted but not really wasting away, as Buffett registered defining tracks such as Margaritaville, Cheeseburger in Paradise, Volcano, Fins and Son of a Son of a Sailor. We wanted to capture the time before the Parrothead phenomenon began, when it was still rough n ready out on the road director-producer John H. Cunningham tells Billboard via Zoom. Those were wild times; many viewers who are watching this have no idea that period even existed for this band, because they ve seen this very organized, polished group for such a long time,” he says. “But the first years were a little bit different. Some of the band are starting to pass away and disappear without the history being recorded. So just for historical purposes, we thought this was an important time to document. Original Coral Reefer Roger Bartlett, who composed the film s score, readily acknowledges that we were fully staffed with artificial inspiration in great quantities during that time. But the guitarist, who performed with Buffett as an acoustic duo before the band formed, also maintains that the early days were really the best days for other reasons. It was before the bodyguard and before (Buffett) flew on a private plane and had the restaurants and all of that, Bartlett explains. We drove in a Rent-a-Car and raced down the corridors of the airports to get to the plane before the doors closed. We sat in economy class and re", "date_str": "2026-10-30T14:34:35+00:00", "hash": "bc73869e229ab164", "title_fa": "مستند راک «خطر شغلی» داستان ناگفته «راگتاگ» جیمی بافت، پیش از شهرت گروه کرال ریفر را شرح می دهد.", "summary_fa": "گروه Coral Reefer به همان اندازه که گروه E Street برای بروس اسپرینگستین، Heartbreakers برای تام پتی و غیره ذاتاً بخشی از جهان جیمی بافت هستند. اما بخش ناگفته‌ای از داستان گروه، تمرکز مستند جدید Occupational Hazard: The First Coral Reefers است، که پس از تقریباً نه ماه نمایش در جشنواره‌ها و تئاترها، در 30 اکتبر برای اجاره از طریق Apple TV، Amazon Prime Video، Google Play و Fandango در دسترس قرار می‌گیرد. همانطور که عنوان نشان می‌دهد، Occupational Hazard یک داستان منشأ است، از آغاز کار بافت به عنوان یک تروبادور (پس از نوشتن دوره‌ای برای بیلبورد) و نقل مکان او به کی وست، فلوریدا، جایی که او در اواسط دهه 70 ترکیب اولیه Coral Reefer را جمع‌آوری کرد. (او پیش از آن در طول اجراهای انفرادی خود از این نام برای یک گروه تخیلی استفاده می کرد.) که توسط بازیگر و دوست بافت، جف بریجز روایت می شود، جزئیات یک گروه کاملاً متفاوت و به طور قابل توجهی کمتر صیقلی نسبت به گروهی که Parrotheads از اواخر دهه 70 ت  "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
