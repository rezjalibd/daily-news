ل دولتی همراه بود، و حاضر بود بسیاری از درآمدهای بالقوه را فدای این قابلیت پیش بینی کند. مادرم که یک مددکار اجتماعی بود نیز شغل بسیار ثابتی داشت. آنها رویکرد مشابهی برای پول و سرمایه گذاری داشتند. وقتی بازار سهام در دهه 1980 سقوط کرد، من داستان را در اخبار شنیدم و از پدر و مادرم پرسیدم که آیا ما خوب هستیم. یادم می‌آید که پدرم می‌گفت من نباید نگران باشم - والدینم روی آن سرمایه‌گذاری نکردند، بنابراین ما در امان بودیم. من فقط زمانی ریسک کردم که احساس کردم باید زندگی خانواده ام بسیار کم خطر و ساده باشد. پدر و مادرم به این راضی بودند. اولش من هم بودم تنها زمانی که ریسک نکردن غیرقابل تحمل به نظر می رسید، راحت بودم. من برای اولین بار در 24 سالگی ازدواج کردم و به سرعت مشخص شد که ازدواج به نتیجه نمی رسد. من جرأت رفتن را نداشتم تا"}, {"source": "Business Insider", "title": "Chain restaurants are closing hundreds of locations across the US in 2026. See the list.", "link": "https://www.businessinsider.com/restaurant-chains-closing-locations-2026", "summary": "Wendy s intends to close roughly 5% to 6% of its US footprint this year. Mike Campbell/NurPhoto via Getty Images Multiple restaurant chains have shared plans to close locations in 2026. Wendy's closed 289 US restaurants in the first half of 2026. Pizza Hut said it intended to shutter 250 US locations in the first half of the year. Some fast-food and fast-casual chains are shrinking their footprints in 2026, as restaurants navigate a difficult environment marked by rising costs, cautious consumers, and intensifying competition for diners’ dollars. Restaurant chains including Wendy’s , Papa John's, Pizza Hut, Red Lobster, Starbucks, and Bahama Breeze have closed locations or announced plans to do so this year. Some are pulling back from underperforming restaurants, while others are restructuring or refocusing on more profitable markets. The planned closures come amid a challenging few years for restaurant chains, driven by inflation, rising labor costs , and shifting customer preferences. Some brands have leaned on value meals and innovations to bring more customers through the door. \"What's really worked within quick service hasn't been value, as much,\" TD Cowen analyst Andrew Charles previously told Business Insider . \"Value is important, but you look at when McDonald's, Burger King, etc, have done well — it's really when they have great menu innovation or great marketing that they really see customers respond.\" Several chains have announced broad closure plans, while others have quietly or abruptly shuttered individual restaurants since the start of the year. Here’s what to know. Starbucks closed around 250 locations across North America in 2026. Starbucks coffee shop. Beata Zawrzel/NurPhoto via Getty Images Starbucks closed about 250 locations across the US and Canada in late September as part of its “Back to Starbucks” turnaround plan. The closures represented roughly 1% of the chain’s more than 18,000 North American coffeehouses. In a September announcement , the company said it had reviewed its store portfolio and identified locations where it could not consistently deliver the experience it wanted for customers and employees or find a path to acceptable financial performance. The closures followed a 2025 restructuring that resulted in the net closure of 107 North American locations. Starbucks said it remains committed to growing in the region and is accelerating plans to renovate 1,500 coffeehouses. Founded in Seattle in 1971, Starbucks has grown int", "date_str": "2026-10-02T12:52:01+00:00", "hash": "cc289bf0714c46e4", "title_fa": "رستوران های زنجیره ای در سال 2026 صدها مکان را در سراسر ایالات متحده می بندند. فهرست را ببینید.", "summary_fa": "Wendy s قصد دارد در سال جاری تقریباً 5 تا 6 درصد از ردپای خود در ایالات متحده را ببندد. Mike Campbell/NurPhoto از طریق Getty Images چندین رستوران زنجیره‌ای برنامه‌هایی را برای بستن مکان‌ها در سال 2026 به اشتراک گذاشته‌اند. وندی 289 رستوران ایالات متحده را در نیمه اول سال 2026 تعطیل کرد. پیتزا هات گفت که قصد دارد در نیمه اول سال 250 مکان در ایالات متحده را ببندد. برخی از فست فودهای زنجیره ای و فست فودهای معمولی در سال 2026 جای پای خود را کاهش می دهند، زیرا رستوران ها در محیط دشواری هستند که با افزایش هزینه ها، مصرف کنندگان محتاط و تشدید رقابت برای دلارهای غذاخوری مشخص شده است. رستوران‌های زنجیره‌ای از جمله Wendy’s، Papa John's، Pizza Hut، Red Lobster، Starbucks، و Bahama Breeze مکان‌های خود را تعطیل کرده‌اند یا برنامه‌هایی را برای انجام این کار در سال جاری اعلام کرده‌اند. برخی در حال عقب نشینی از رستوران های با عملکرد ضعیف هستند، در حالی که برخی دیگر در حال تغییر ساختار یا تمرکز مجدد بر بازارهای سودآورتر هستند. تعطیلی های برنامه ریزی شده در بحبوحه چند سال چالش برانگیز برای رستوران های زنجیره ای رخ می دهد که ناشی از تورم، افزایش هزینه های نیروی کار و تغییر ترجیحات مشتریان است. برخی از برندها به وعده‌های غذایی با ارزش و نوآوری‌ها تکیه کرده‌اند تا مشتریان بیشتری را از آن خود کنند. اندرو چارلز، تحلیلگر TD Cowen، قبلاً به Business Insider گفته بود: «آنچه واقعاً در سرویس سریع کار می‌کند، ارزش چندانی ندارد. \"ارزش مهم است، اما شما به زمانی نگاه می کنید که مک دونالد، برگر کینگ و غیره عملکرد خوبی داشته اند - در واقع زمانی است که آنها نوآوری عالی در منو یا بازاریابی عالی دارند که واقعاً می بینند که مشتریان پاسخ می دهند.\" چندین زنجیره برنامه‌های تعطیلی گسترده‌ای را اعلام"}, {"source": "Business Insider", "title": "Bankers, don't dodge train fares on your commute. It could get you barred from the industry.", "link": "https://www.businessinsider.com/hsbc-banker-barred-from-finance-industry-dodging-train-fare-conviction-2026-10", "summary": "A former HSBC executive was barred from UK financial services after using a train-ticket fraud scheme to dodge nearly $7,900 in fares. Bloomberg/Getty Images A former HSBC executive has been barred from UK financial services over train fare fraud. The FCA said Joseph Molloy’s conviction showed a lack of honesty and integrity. Molloy dodged £5,911 in fares using a ticketing method known as \"donutting.\" A former HSBC executive learned that a train ticket can become a career-ending expense in finance. Joseph Molloy was barred on Thursday by the UK’s Financial Conduct Authority from regulated financial services work after a criminal conviction for dodging fares. Molloy, 53, who until his retirement last year was the head of passive equity at HSBC Asset Management, used a method called \"donutting\" on journeys from his home on the outskirts of London to HSBC's office in the city. Instead of buying a ticket for his whole commute, he bought tickets for short journeys at either end, leaving an unpaid \"hole\" in the middle. Prosecutors said he used false names and addresses to obtain multiple travel cards and improperly claimed a travel discount intended for unemployed job seekers. The court heard the plan was used 740 times over 11 months, avoiding £5,911, or roughly $7,900, in fares. In February, Inner London Crown Court sentenced Molloy to 10 months' imprisonment, suspended for 18 months. He was barred from the railway operator for a year, ordered to complete 80 hours of unpaid work and pay £5,000, around $6,605 in compensation, plus costs and a victim surcharge. The Financial Conduct Authority issued what amounts to a lifetime prohibition from the industry. FCA-regulated firms cannot employ Molloy in a regulated role unless the regulator later lifts the ban. The agency said the conviction showed a \"clear and serious\" lack of honesty and integrity, so he was not \"fit and proper\" for regulated work. In the US, the Financial Industry Regulatory Authority, or FINRA, oversees brokerage firms and the brokers who work for them. It can permanently bar brokers from the industry, typically for misconduct involving clients or securities. The FCA’s power is broader: it can prohibit someone from working in regulated finance if it decides they are not fit and proper, including because of dishonesty outside the office. The lesson for bankers: an off-the-clock fraud can still call professional trustworthiness into question. Read the original article on Business Insider", "date_str": "2026-10-02T12:48:26+00:00", "hash": "45e8fc6b571e4cb3", "title_fa": "بانکداران، از کرایه قطار در رفت و آمد خود طفره نروید. ممکن است شما را از این صنعت محروم کند.", "summary_fa": "یکی از مدیران سابق HSBC پس از استفاده از یک طرح تقلب در بلیط قطار برای طفره رفتن نزدیک به 7900 دلار کرایه از خدمات مالی بریتانیا محروم شد. بلومبرگ/گتی ایماژ یکی از مدیران سابق HSBC به دلیل تقلب در کرایه قطار از خدمات مالی بریتانیا محروم شد. FCA گفت محکومیت جوزف مولوی نشان دهنده عدم صداقت و درستکاری است. Molloy با استفاده از روشی به نام \"دوناتینگ\" از 5911 پوند کرایه طفره رفت. یکی از مدیران سابق HSBC متوجه شد که بلیط قطار می تواند به یک هزینه پایان کار در امور مالی تبدیل شود. جوزف مولوی روز پنجشنبه از سوی اداره رفتار مالی بریتانیا از فعالیت خدمات مالی تنظیم شده پس از محکومیت کیفری به دلیل طفره رفتن کرایه ها منع شد. مولوی، 53 ساله، که تا زمان بازنشستگی خود در سال گذشته، رئیس سهام غیرفعال در مدیریت دارایی HSBC بود، از روشی به نام «دونات» در سفرهای خود از خانه خود در حومه لندن به دفتر HSBC در شهر استفاده می کرد. او به جای خرید بلیط برای کل رفت و آمدش، بلیط سفرهای کوتاه را در دو انتها خرید و یک \"سوراخ\" بدون پرداخت در وسط باقی گذاشت. دادستان ها گفتند که او از نام ها و آدرس های جعلی برای دریافت کارت های سفر متعدد استفاده کرده و به طور نادرست مدعی تخفیف سفر برای جویندگان کار بیکار شده است. دادگاه شنیده است که این طرح 740 بار در طول 11 ماه مورد استفاده قرار گرفت و از 5911 پوند یا تقریباً 7900 دلار کرایه اجتناب شد. در ماه فوریه، دادگاه داخلی لندن، مولوی را به 10 ماه حبس، به مدت 18 ماه به حالت تعلیق محکوم کرد. او به مدت یک سال از حضور در اپراتور راه آهن محروم شد، به او دستور دادند 80 ساعت کار بدون مزد انجام دهد و 5000 پوند،"}, {"source": "Business Insider", "title": "We didn't plan to live within walking distance of my family. Then, my sisters and parents all moved to our neighborhood.", "link": "https://www.businessinsider.com/whole-family-moved-to-same-neighborhood-pros-cons-florida-2026-10", "summary": "My entire family moved to the same neighborhood in Florida. I never imagined we d live within walking distance to my sisters and parents. John Paul Hernandez We live within walking distance of my parents, sisters, and other family members. Daily life includes driveway waves and Sunday dinners, plus a lot of clear boundaries. It's nice to have a support system close by and for our kids to grow up close to their cousins. On a typical day, I may see my cousin waving from her driveway, catch my mother or sister on a morning walk, and run into family members at the local Publix. Some days, I'll have an espresso with my father in the afternoon, or my wife will shop with my mother after work. I don't live with my extended family or have special teleportation powers. These are just the kind of moments that are possible when you live a few houses away from most of your family. Living within walking distance of most of my family was never the goal, but we've made the best of it I ve become neighbors with a lot of my family members in Florida. Marcia Straub/Getty Images We never intended to become neighbors with my parents and siblings, but many of us ended up house hunting at the same time. My wife and I wanted a bigger place for our growing family; my parents were downsizing; one sister was getting married; and another sister was leaving her nearby rental to buy her first home. We were all based in Palm Beach County , Florida, and wanted to stay in the general area. At the time, we felt priced out of the market, and so do many others in our communities. When my wife and I found a great neighborhood on the Treasure Coast that wasn't 55-plus and had everything we needed, we were sold. Once my family heard about it, they were interested, too. One by one, we all ended up in the same neighborhood. Not long after, an out-of-state cousin also moved onto the same street as my wife and me. By 2024, we were all neighbors within walking distance of each other. My wife and I live on the community lake, a two-minute walk from one of my sisters. My other sister is a street over, less than 10 minutes away, past my cousin's place. Our parents are on the opposite side of the lake. A house on the neighboring cul-de-sac blocks them from view, and we can walk to their place in 15 minutes. Not all families can be so close, but if you have a healthy dynamic, you get to appreciate what \"it takes a village\" really means, especially with kids. For example, on Sundays we all get together fo", "date_str": "2026-10-02T12:36:01+00:00", "hash": "9a8d63d6ad644f0c", "title_fa": "ما قصد نداشتیم در فاصله کمی از خانواده ام زندگی کنیم. سپس، خواهران و پدر و مادرم همه به محله ما نقل مکان کردند.", "summary_fa": "تمام خانواده من به همان محله در فلوریدا نقل مکان کردند. هرگز تصور نمی‌کردم که در فاصله‌ای چند قدمی تا خواهران و والدینم زندگی کنیم. جان پل هرناندز ما در چند قدمی والدین، خواهران و سایر اعضای خانواده ام زندگی می کنیم. زندگی روزمره شامل موج‌های جاده‌ای و شام‌های یکشنبه، به‌علاوه بسیاری از مرزهای روشن است. خوب است که یک سیستم پشتیبانی در نزدیکی خود داشته باشیم و بچه هایمان در نزدیکی پسرعموهای خود بزرگ شوند. در یک روز معمولی، ممکن است پسر عمویم را ببینم که از راه خانه‌اش دست تکان می‌دهد، مادر یا خواهرم را در پیاده‌روی صبحگاهی می‌گیرد و در Publix محلی با اعضای خانواده برخورد می‌کند. بعضی روزها بعد از ظهر با پدرم یک اسپرسو می خورم یا همسرم بعد از کار با مادرم خرید می کند. من با خانواده بزرگم زندگی نمی‌کنم یا قدرت انتقال از راه دور خاصی ندارم. اینها فقط از آن دسته لحظاتی هستند که زمانی ممکن است که شما چند خانه دورتر از اکثر اعضای خانواده خود زندگی کنید. زندگی در فاصله پیاده روی بیشتر اعضای خانواده من هرگز هدف نبوده است، اما ما بهترین استفاده را از آن داشته ایم و با بسیاری از اعضای خانواده ام در فلوریدا همسایه شده ام. Marcia Straub/Getty Images ما هرگز قصد نداشتیم با پدر و مادر و خواهر و برادرم همسایه شویم، اما بسیاری از ما در همان زمان به شکار خانه‌ای می‌رفتیم. من و همسرم مکانی بزرگتر برای خانواده در حال رشد خود می خواستیم. والدینم در حال کوچک کردن بودند. یک خواهر در حال ازدواج بود. و خواهر دیگری اجاره خانه خود را در همان نزدیکی ترک می کرد تا اولین خانه اش را بخرد. همه ما در شهرستان پالم بیچ، فلوریدا مستقر بودیم و می خواستیم در منطقه عمومی بمانیم. در آن زمان، ما احساس می‌کردیم که از بازار خارج"}, {"source": "Business Insider", "title": "Where every US governor stands on AI and the data-center boom", "link": "https://www.businessinsider.com/where-every-us-governor-stands-ai-data-centers-midterms-2026-10", "summary": "Some state governors are bigger advocates for AI and data centers than others. Tayfun Coskun/Anadolu via Getty Images Midterm elections are right around the corner, with Election Day on November 3. Artificial intelligence and the data-center boom have pushed their way into the political arena. US governors' views range from exploring an AI \"kill switch\" to welcoming data centers. It's up to voters whether artificial intelligence will play a role in the outcome of the coming midterm elections . The AI boom — and the infrastructure needed to power it — has slowly become a flashpoint in US politics. The debate ranges from AI safety, regulation, and deepfakes to the rapid expansion of data centers . Many Big Tech firms advocate for faster expansion, while local residents have pushed back against data-center projects over their potential environmental and energy-cost impacts. One big question for voters: What roles should state and federal governments play in regulating AI? Another is how much power local communities should have over the data centers increasingly being built in their backyards. Governors across the political spectrum — 17 of whom are up for reelection this year — have taken varied approaches to the AI boom. All 39 gubernatorial races, across 36 states and three territories, are on November 3. Some governors, including California's Gavin Newsom (D) and New York's Kathy Hochul (D), are exploring an AI \" kill switch \" that would disable advanced AI systems in an out-of-control event. Republican Utah Gov. Spencer Cox has also called for federal AI safety rules. Others, including the Republican governors of Nevada and North Dakota and the Democratic governors of Michigan and New Mexico — whose states have major AI-computing projects under construction — see data centers as an economic opportunity. Here's what every US governor has said so far about AI, data centers, or both. Alabama Stew Milne/Getty Images Alabama Gov. Kay Ivey (R) has approached AI as an opportunity to improve government, but one that needs guardrails. In 2024, she created a statewide generative AI task force to examine how it could be used within the state government, emphasizing both the usage of AI and transparency, privacy, and public safety. \"GenAI represents a monumental step forward in the potential for our state government to serve the public,\" Ivey said in a 2024 statement . \"However, its capabilities must first be studied carefully to ensure it is implemented in the most ", "date_str": "2026-10-02T11:13:01+00:00", "hash": "bce69bc848854ee2", "title_fa": "جایی که هر فرماندار ایالات متحده روی هوش مصنوعی و رونق مرکز داده ایستاده است", "summary_fa": "برخی از فرمانداران ایالت ها حامیان بزرگ تری برای هوش مصنوعی و مراکز داده نسبت به دیگران هستند. Tayfun Coskun/Anadolu از طریق Getty Images انتخابات میان دوره ای نزدیک است و روز انتخابات در 3 نوامبر است. هوش مصنوعی و رونق مرکز داده راه خود را به عرصه سیاسی سوق داده است. دیدگاه فرمانداران ایالات متحده از کاوش در یک \"سوئیچ کشتن\" هوش مصنوعی تا استقبال از مراکز داده را شامل می شود. این به رای دهندگان بستگی دارد که آیا هوش مصنوعی در نتیجه انتخابات میان دوره ای آینده نقشی خواهد داشت یا خیر. رونق هوش مصنوعی - و زیرساخت های مورد نیاز برای تقویت آن - به آرامی به نقطه عطف در سیاست ایالات متحده تبدیل شده است. این بحث از ایمنی هوش مصنوعی، مقررات، و جعل عمیق گرفته تا گسترش سریع مراکز داده را شامل می شود. بسیاری از شرکت‌های بزرگ فناوری از گسترش سریع‌تر حمایت می‌کنند، در حالی که ساکنان محلی به دلیل اثرات بالقوه زیست‌محیطی و هزینه انرژی، پروژه‌های مرکز داده را کنار زده‌اند. یک سوال بزرگ برای رأی دهندگان: دولت های ایالتی و فدرال چه نقشی باید در تنظیم هوش مصنوعی ایفا کنند؟ دیگری این است که جوامع محلی چقدر باید بر مراکز داده ای که به طور فزاینده ای در حیاط خلوت خود ساخته می شوند، داشته باشند. فرمانداران در سراسر طیف سیاسی - که 17 نفر از آنها امسال برای انتخاب مجدد انتخاب شده اند - رویکردهای مختلفی را برای رونق هوش مصنوعی در پیش گرفته اند. همه 39 نژاد فرمانداری، در 36 ایالت و سه قلمرو، در 3 نوامبر برگزار می شوند. برخی از فرمانداران، از جمله گاوین نیوسام (D) از کالیفرنیا و کتی هوچول (D) از نیویورک، در حال بررسی یک \"سوئیچ کشتن\" هوش مصنوعی هستند که سیستم های هوش مصنوعی پیشرفته را در یک رویداد خارج از کنترل غیرفعال"}, {"source": "Business Insider", "title": "I’m a former flight attendant. Here are 9 things I wish passengers would stop doing on airplanes.", "link": "https://www.businessinsider.com/wish-flyers-would-stop-doing-on-planes-flight-attendant-2026-10", "summary": "I was a flight attendant for now-defunct Ukraine International Airlines for nearly 10 years. Here are the etiquette mistakes I saw passengers make. Alona Vasylieva I was a flight attendant for nearly 10 years and I witnessed some of the worst passenger behaviors. I saw far too many people go to the lavatory barefoot or blast music without headphones. We also know if you've snuck into an empty business-class seat. I worked as a flight attendant on long-haul international routes for nearly a decade — and I got an unfiltered, front-row seat to some of the worst passenger etiquette in commercial air travel. Most people want a peaceful trip, but small habits can quickly turn a flight into a nightmare for everyone nearby. Looking back at my years in the sky, here are the main things I wish passengers would stop doing on flights. Pillows, blankets, and safety gear aren t personal souvenirs People would often take business-class perks back to their economy seat. Patrick T. Fallon / AFP via Getty Images Depending on the aircraft layout, economy passengers often walked through business class during boarding. I frequently caught people grabbing business-class pillows, premium headphones, or plush blankets on their way back to their seats. Others tried to pack away cabin blankets and safety cards and even pull life vests from under their seats as souvenirs. My crew had to count all those items. Missing life vests meant delaying the flight to replace them, and missing blankets created real supply headaches for our colleagues on the next leg. You won t get away with sneaking into empty premium seats You ll get caught sneaking into premium cabins. Paul Yeung/Bloomberg via Getty Images After the boarding doors closed, I often saw passengers spot an empty business-class seat and try to sneak into it. This almost always happened on long overnight flights when the cabin lights went dim, and people thought we wouldn't notice. But as crew, we always knew our cabin layout inside out and exactly how many passengers were booked in business class. Asking someone to pack up their things and move back to economy in front of a quiet cabin was never a fun moment. At least wear shoes to the lavatory I always wear shoes to the bathroom. Jan Woitas/picture alliance via Getty Images I used to see passengers take off their shoes and walk down the aisle in socks — and sometimes barefoot — on almost every single flight. The cabin floor collects endless dust and dirt tracked in from busy airp", "date_str": "2026-10-02T10:48:01+00:00", "hash": "c1b9638a8ad41f3e", "title_fa": "من یک مهماندار سابق هواپیما هستم. در اینجا 9 کاری وجود دارد که ای کاش مسافران در هواپیما انجام نمی دادند.", "summary_fa": "من نزدیک به 10 سال مهماندار هواپیمایی بین المللی اوکراین بودم که اکنون از کار افتاده است. در اینجا اشتباهات آدابی است که دیدم مسافران مرتکب می شوند. آلونا واسیلیوا من نزدیک به 10 سال مهماندار هواپیما بودم و شاهد برخی از بدترین رفتارهای مسافران بودم. من دیدم که افراد زیادی با پای برهنه به دستشویی می‌روند یا بدون هدفون با صدای بلند موسیقی پخش می‌کنند. ما همچنین می دانیم که آیا به یک صندلی خالی کلاس تجاری سر زده اید یا خیر. من نزدیک به یک دهه به عنوان مهماندار در مسیرهای بین‌المللی طولانی مدت کار می‌کردم - و یک صندلی بدون فیلتر و ردیف جلو برای برخی از بدترین آداب مسافرتی در سفرهای هوایی تجاری گرفتم. اکثر مردم خواهان یک سفر آرام هستند، اما عادات کوچک می تواند به سرعت یک پرواز را به یک کابوس برای همه افراد نزدیک تبدیل کند. با نگاهی به سال‌های زندگی‌ام در آسمان، اینها کارهای اصلی هستند که آرزو می‌کنم مسافران در پروازها انجام ندهند. بالش‌ها، پتوها و وسایل ایمنی سوغاتی شخصی نیستند. پاتریک تی. فالون / خبرگزاری فرانسه از طریق گتی ایماژ بسته به طرح هواپیما، مسافران اکونومی اغلب در کلاس تجاری در هنگام سوار شدن به هواپیما راه می رفتند. من اغلب افرادی را در حال گرفتن بالش های کلاس تجاری، هدفون های ممتاز، یا پتوهای مخمل دار در راه بازگشت به صندلی خود می گرفتم. برخی دیگر سعی کردند پتوهای کابین و کارت های ایمنی را جمع کنند و حتی جلیقه نجات را از زیر صندلی های خود به عنوان سوغاتی بیرون بیاورند. خدمه من مجبور بودند همه آن موارد را بشمارند. مفقود شدن جلیقه نجات به معنای تاخیر در پرواز برای جایگزینی آنها بود و پتوهای گم شده باعث ایجاد دردسرهای واقعی برای همکاران ما در قسمت بعدی شد. با رفتن مخفیانه به صندلی‌های ممتاز خالی از دست"}, {"source": "Business Insider", "title": "'I couldn't let everyone else die': The Flydubai pilot stabbed by his coworker describes how he helped save Flight 1073", "link": "https://www.businessinsider.com/flydubai-captain-smit-machchhar-describes-how-helped-save-flight-1073-2026-10", "summary": "Smit Machchhar, the captain of Flydubai Flight 1073, has been hailed as a hero. Israel Foreign Ministry/Reuters Smit Machchhar, the captain of Flydubai Flight 1073, spoke to India's prime minister on Friday. In a video call from the hospital, he described how he opened the cockpit door after being stabbed. Machchhar has been hailed a hero for helping stop his fellow pilot from crashing the plane. The Flydubai captain who was stabbed by his copilot has described how he fought to save the airplane with nearly 180 passengers. \"Even with my eyes closed, I know exactly what is happening in the cockpit. When I was lying on the floor, I could sense the aircraft was going down,\" Smit Machchhar told Indian Prime Minister Narendra Modi in Hindi in a video published Friday. On Wednesday, Flydubai Flight 1073 from Dubai to Tel Aviv suddenly dropped more than 15,000 feet before passengers and crew members subdued the first officer, and the plane safely diverted to Tabuk, Saudi Arabia. An unforgettable conversation with Captain Smit, filled with pride and emotions. pic.twitter.com/CCf46PKOWR — Narendra Modi (@narendramodi) October 2, 2026 \"I knew for a fact that if I could just give the door one last push, that was the only chance, and even then, I was taking a beating,\" Machchhar said on a video call from the hospital, which was widely translated into English. \"I just managed to open it. Everyone else arrived, and they all played their part too,\" he added. \"I was acting to save my own life, of course, but at the same time, I knew I couldn't let everyone else die.\" After landing, the other pilot was arrested, Israeli Prime Minister Benjamin Netanyahu said in a statement. He also called Machchhar a \"true hero.\" Machchhar said he has been a pilot for 17 years and a captain for the last 11 years. His LinkedIn profile shows he began his career at SpiceJet, an Indian budget airline, before joining Flydubai four years ago. The passengers who helped regain control of the airplane — Yaniv Hayun, Or Pardilov, Shota Musayev, and his wife Sigalit — met with Netanyahu on Thursday. They described tying the first officer with a headphone cable. \"I salute these heroes, who displayed exceptional resourcefulness and courage,\" Netanyahu said. \"They saved many lives. They prevented a huge disaster.\" Read the original article on Business Insider", "date_str": "2026-10-02T10:04:13+00:00", "hash": "608b58015a54f798", "title_fa": "\"نمی‌توانستم بگذارم دیگران بمیرند\": خلبان فلای دبی که توسط همکارش چاقو خورده است، توضیح می‌دهد که چگونه به نجات پرواز 1073 کمک کرده است.", "summary_fa": "اسمیت ماچهار، کاپیتان پرواز 1073 فلای دبی، به عنوان یک قهرمان مورد ستایش قرار گرفته است. وزارت خارجه اسرائیل/ رویترز اسمیت ماخچار، کاپیتان پرواز 1073 فلای دبی، روز جمعه با نخست وزیر هند صحبت کرد. او در یک تماس ویدیویی از بیمارستان توضیح داد که چگونه پس از ضربه چاقو در کابین خلبان را باز کرده است. ماچهار به دلیل کمک به جلوگیری از سقوط هواپیما توسط خلبان همکارش به عنوان قهرمان شناخته شده است. کاپیتان فلای دبی که توسط خلبانش چاقو خورد، توضیح داد که چگونه برای نجات هواپیمای نزدیک به 180 مسافر جنگید. اسمیت ماچار در ویدئویی که روز جمعه منتشر شد به نخست وزیر هند به نارندرا مودی به هندی گفت: \"حتی با چشمانم بسته، دقیقا می دانم که در کابین خلبان چه اتفاقی می افتد. وقتی روی زمین دراز کشیده بودم، می توانستم هواپیما در حال سقوط را حس کنم.\" روز چهارشنبه، پرواز 1073 فلای دبی از دبی به تل آویو به طور ناگهانی بیش از 15000 فوت سقوط کرد قبل از اینکه مسافران و خدمه افسر اول را تحت کنترل درآوردند و هواپیما به سلامت به تبوک، عربستان سعودی تغییر مسیر داد. گفتگوی فراموش نشدنی با کاپیتان اسمیت، پر از غرور و احساسات. pic.twitter.com/CCf46PKOWR — نارندرا مودی (@narendramodi) 2 اکتبر 2026، ماخچار در یک تماس ویدیویی از بیمارستان که به طور گسترده به انگلیسی ترجمه شد، گفت: «به درستی می‌دانستم که اگر بتوانم آخرین فشار را به در بزنم، این تنها فرصت بود، و حتی در آن زمان، کتک می‌زدم. او افزود: \"من فقط توانستم آن را باز کنم. بقیه هم آمدند و همه آنها نیز نقش خود را ایفا کردند.\" \"البته من برای نجات جان خودم اقدام می کردم، اما در همان زمان می دانستم که نمی توانم اجازه دهم بقیه بمیرند.\" بنیامین نتانیاهو، نخست وزیر رژیم صهیونیستی در بیانیه ای گفت: پس از"}, {"source": "Business Insider", "title": "I was on the Flydubai flight that plunged 17,000 feet after the cockpit attack. I didn't realize my life was at stake.", "link": "https://www.businessinsider.com/flydubai-flight-pilot-stabbing-incident-passenger-what-happened-2026-10", "summary": "Almog Italie was a passenger on FlyDubai flight FZ1073. Courtesy of Almog Italie Almog Italie and his family were on Flydubai flight FZ1073. Italie said the plane dropped rapidly, like a \"rollercoaster.\" \"In situations like this, you have to remain calm to stay alive,\" he said. This as-told-to essay is based on a conversation with Almog Italie, 52, who works in digital marketing and lives in Ness Ziona, Israel. The following has been edited for length and clarity. On September 30, my family was traveling back from a two-week holiday in Japan with Flydubai . It was a terrific vacation, but we had some bad weather, including an earthquake and a typhoon. It was a very extreme trip. Then, on our way back, our airplane dived. Our stopover was in Dubai, and we were meant to land in Tel Aviv, not too far from where we live. But our plane started descending rapidly near the end of the journey, and there was a disturbance in the cockpit. Initially, we thought it was an attack, but we don't know the facts, and we don't have conclusions yet. I would never have imagined something like this would happen on our way home from vacation. The sudden descent on board was quite scary My wife, two children, and I were on the plane together. At first, it was a smooth flight. As we reached the Jordanian border, the airplane suddenly began to drop rapidly. It was descending very quickly like a roller coaster. It was quite scary. At first, we thought we hit some turbulence , but I didn't hear any alerts from the pilot asking us to buckle up. We also realized it was too much of a disruption to be turbulence. I didn't see the masks come down. Maybe we didn't lose pressure. The airplane seemed to balance for a while before descending again. I saw people rushing to the cockpit, and after a few minutes, somebody came and told us that one of the pilots had stabbed another pilot. They said the person now piloting the flight was looking for an airport where we could land. From what I could tell, it was a small handful of passengers who helped take control. They told all the passengers to be prepared, because we might have a rough landing. During the descent, my family and I were trying to buckle up and save our lives. When the plane started ascending again, there was a massive force, which made it hard to even sit. My back was sticking to the chair. I tried to make a joke to my kids, who are 13 and 16, that this was just an extension of the roller coaster they rode at Universal Studios Ja", "date_str": "2026-10-02T10:01:47+00:00", "hash": "2c89a4401f448b05", "title_fa": "من در پرواز Flydubai بودم که پس از حمله به کابین خلبان از ارتفاع 17000 پایی سقوط کرد. من متوجه نشدم که زندگی من در خطر است.", "summary_fa": "Almog Italie مسافر پرواز FZ1073 FlyDubai بود. با حسن نیت از Almog Italie Almog Italie و خانواده اش در پرواز FZ1073 Flydubai بودند. ایتالیا گفت که هواپیما به سرعت مانند یک ترن هوایی سقوط کرد. او گفت: «در شرایطی مانند این، برای زنده ماندن باید آرامش خود را حفظ کنید. این مقاله گفته شده بر اساس گفتگو با Almog Italie، 52 ساله است که در بازاریابی دیجیتال کار می کند و در Ness Ziona، اسرائیل زندگی می کند. موارد زیر برای طول و وضوح ویرایش شده است. در 30 سپتامبر، خانواده من از یک تعطیلات دو هفته ای در ژاپن با Flydubai در حال بازگشت بودند. تعطیلات فوق‌العاده‌ای بود، اما هوای بدی داشتیم، از جمله زلزله و طوفان. این یک سفر بسیار شدید بود. سپس در راه بازگشت، هواپیمای ما شیرجه زد. توقفگاه ما در دبی بود و قرار بود در تل آویو فرود بیاییم، نه چندان دور از محل زندگیمان. اما هواپیمای ما در اواخر سفر به سرعت شروع به فرود کرد و در کابین خلبان اختلال ایجاد شد. در ابتدا فکر می‌کردیم که این یک حمله است، اما واقعیت‌ها را نمی‌دانیم و هنوز نتیجه‌گیری نداریم. من هرگز تصور نمی کردم چنین اتفاقی در راه بازگشت به خانه از تعطیلات رخ دهد. فرود ناگهانی هواپیما بسیار ترسناک بود من و همسرم، دو فرزندم و با هم در هواپیما بودیم. در ابتدا پرواز آرامی بود. وقتی به مرز اردن رسیدیم، هواپیما ناگهان شروع به سقوط کرد. مثل یک ترن هوایی خیلی سریع پایین می آمد. کاملا ترسناک بود ابتدا فکر می‌کردیم که دچار تلاطم شده‌ایم، اما هیچ هشداری از خلبان نشنیدم که از ما بخواهد دست و پنجه نرم کنیم. ما همچنین متوجه شدیم که این اختلال بیش از حد باعث آشفتگی است. من ندیدم که ماسک ها پایین بیایند. شاید فشار را کم نکردیم. به نظر می رسید هواپیما"}, {"source": "Business Insider", "title": "I worked a finance day job and a supermarket night job. I've saved up nearly $300K toward early retirement.", "link": "https://www.businessinsider.com/finance-worker-with-supermarket-night-job-saves-toward-early-retirement-2026-10", "summary": "Ryan Lowe. Ryan Lowe worked two jobs and lives with his parents so he can retire early. Ryan Lowe Ryan Lowe lives with his parents in Massachusetts and recently worked two jobs. The 27-year-old wants to retire in his 40s and spend time traveling. He's saved up almost $300,000. This as-told-to essay is based on conversations with Ryan Lowe, a 27-year-old living in Massachusetts who shared documentation of his savings with Business Insider. His words have been lightly edited for length and clarity. I want to retire early . So I tried working two jobs — an office finance job during the day and as a product sorter in a grocery store at night. I also live with my parents and drive a 20-year-old Toyota Camry. I'm 27. I don't drink, I don't smoke, and I don't go out to parties. My parents buy the groceries. A lot of people would look at my lifestyle and say that I'm a bum, and they're not wrong. Over the years, though, I've saved up nearly $300,000. I get paid between $1,100 and $1,200 every week from both gigs, and I usually put $1,000 of that paycheck into the S P 500. It's a very safe long-term investment. If that were to crash, then we'd have bigger issues than my retirement fund . I'm hoping to retire in my 40s and spend time traveling. When I'm not traveling, I want to have a chill, quiet lifestyle — just like I do now. The grocery store was unsustainable I quit my job at Stop Shop three weeks ago. I wanted to stay, but the time I spent commuting was starting to add up. I also didn't have time for important things, like working out and eating good food. Ryan Lowe, a 27-year-old living in Massachusetts, in his Stop Shop uniform. Lowe tried working two jobs so he could retire early. Ryan Lowe I loved my job in the grocery store . It was just me in my own world, and it was as easy as it gets. The managers were usually gone, and they would leave notes for me. I previously had another grocery store job at Whole Foods. That worked because, at the time, my finance job had a hybrid schedule. Now, however, I have to go into the office in Boston every day. I work in East Boston, and I'm salaried, so I'm limited to 40 hours a week no matter how much I want to work. For a whole week, I was spending 12 hours commuting on the Mass Pike. I recently went on a trip to the Italian Alps, and while I was there, I was thinking to myself, I don't want to go back to doing that with driving every day and working two jobs . I'm looking for another side hustle I can do at night — ho", "date_str": "2026-10-02T10:00:02+00:00", "hash": "263b5a4b02722a9a", "title_fa": "من یک کار روزانه مالی و یک کار شبانه در سوپرمارکت کار می کردم. من نزدیک به 300 هزار دلار برای بازنشستگی پیش از موعد پس انداز کرده ام.", "summary_fa": "رایان لو. رایان لو دو شغل داشت و با پدر و مادرش زندگی می کرد تا بتواند زودتر بازنشسته شود. رایان لو رایان لو با پدر و مادرش در ماساچوست زندگی می کند و اخیراً دو شغل داشته است. این جوان 27 ساله می‌خواهد در 40 سالگی بازنشسته شود و وقت خود را صرف سفر کند. او تقریباً 300000 دلار پس انداز کرده است. این مقاله گفته شده بر اساس گفتگو با رایان لو، یک جوان 27 ساله ساکن ماساچوست است که اسناد پس انداز خود را با Business Insider به اشتراک گذاشته است. کلمات او برای طولانی بودن و وضوح کمی ویرایش شده است. من می خواهم زودتر بازنشسته شوم. بنابراین من سعی کردم دو شغل کار کنم - یک شغل اداری در طول روز و به عنوان یک طبقه بندی محصولات در یک فروشگاه مواد غذایی در شب. من هم با پدر و مادرم زندگی می کنم و یک تویوتا کمری 20 ساله رانندگی می کنم. من 27 سالمه. نه مشروب میخورم، نه سیگار میکشم و نه مهمانی بیرون میروم. پدر و مادرم مواد غذایی را می خرند. خیلی‌ها به سبک زندگی من نگاه می‌کنند و می‌گویند که من آدم بدی هستم و اشتباه نمی‌کنند. با این حال، در طول سال ها، من نزدیک به 300000 دلار پس انداز کرده ام. من هر هفته از هر دو کنسرت بین 1100 تا 1200 دلار دستمزد می گیرم و معمولاً 1000 دلار از آن چک را در S P 500 می گذارم. این یک سرمایه گذاری طولانی مدت بسیار مطمئن است. اگر قرار بود سقوط کند، پس ما مشکلات بزرگتری نسبت به صندوق بازنشستگی من داشتیم. امیدوارم در 40 سالگی بازنشسته شوم و زمانی را صرف سفر کنم. وقتی سفر نمی‌کنم، می‌خواهم سبک زندگی آرام و آرامی داشته باشم - درست مثل الان. خواربارفروشی ناپایدار بود من سه هفته پیش"}, {"source": "Business Insider", "title": "I've been struggling to find work for over 2 years. It's taken a toll on my finances, confidence, and social life.", "link": "https://www.businessinsider.com/job-market-long-term-unemployment-tech-career-finances-social-life-2026-10", "summary": "Jeremy Spiegel has been searching for full-time work for more than two years. Jeremy Spiegel Jeremy Spiegel has been searching for full-time work for more than two years. He said the job search has taken a toll on his finances, confidence, and social life. He shared what he's learned after more than two years of job searching. This as-told-to essay is based on a conversation with Jeremy Spiegel, a job seeker in his 40s who lives in Massachusetts. The following has been edited for length and clarity. In my job search, I've been told so many times a version of \"It's not you, it's us!\" that I'm beginning to wonder if it is, in fact, me. I've been without a full-time job for more than two years since losing my regional director of account services role at a publishing company. The lasting impact of my job search has been devastating to my ego and self-worth in ways I simply did not think could happen. I believe I was excellent at my job. I was confident. Decisive. Passionate. I inspired other people. Those were things I could hang my hat on. Today, I feel alone. I hesitate. I worry. I avoid going out and socializing, something I used to very much enjoy. I fear someone will ask about my job search. Or someone new may ask the most innocuous question in the world: \"What do you do for work?\" The only other time I lost my job was in 2009 during the Great Recession . I had less than five years of experience, and I found a new job quickly. Now, I have more than 20 years of experience, and I'm still searching. My job search has put a strain on my family A year into my unemployment, a family member asked whether I thought I had offended anyone at the companies I was applying to. In his mind, that seemed the only explanation for my unemployment. I had to explain, as I have to others, that there isn't just one reason why the job search is so challenging for many right now. It's complicated and overwhelming. I was very successful during the first half of my career. It's because of that that my family hasn't had to make any major financial decisions or drastically change our lifestyle. We're not in immediate danger of losing anything. But as with everything, that security is finite. My wife works, but her salary wouldn't sustain us, so I still need to contribute significantly from our savings. While we've been able to get by, we've still had to cut back on certain things. We used to be a two-car family. We're now a one-car family. The trip to Disney World that my son keeps", "date_str": "2026-10-02T10:00:02+00:00", "hash": "8746bccee2b460b9", "title_fa": "من بیش از 2 سال است که در تلاش برای یافتن کار هستم. این بر امور مالی، اعتماد به نفس و زندگی اجتماعی من تأثیر گذاشته است.", "summary_fa": "جرمی اشپیگل بیش از دو سال است که به دنبال کار تمام وقت بوده است. جرمی اشپیگل جرمی اشپیگل بیش از دو سال است که به دنبال کار تمام وقت بوده است. او گفت که جست‌وجوی شغل بر وضعیت مالی، اعتماد به نفس و زندگی اجتماعی او تأثیر گذاشته است. او آنچه را که پس از بیش از دو سال جستجوی کار آموخته است به اشتراک گذاشت. این مقاله همانطور که گفته شد بر اساس گفتگو با جرمی اشپیگل، یک جویای کار در 40 سالگی است که در ماساچوست زندگی می کند. موارد زیر برای طول و وضوح ویرایش شده است. در جستجوی شغلم، بارها به من گفته شده است که \"این تو نیستی، ما هستیم!\" که من شروع به تعجب می کنم که آیا در واقع من هستم. من بیش از دو سال است که از زمانی که نقش مدیر خدمات حسابداری منطقه ای خود را در یک شرکت انتشاراتی از دست داده ام، بدون کار تمام وقت بوده ام. تأثیر ماندگار جستجوی شغل من به شیوه‌هایی که فکر نمی‌کردم ممکن است اتفاق بیفتد، برای من و عزت نفس من ویرانگر بوده است. معتقدم در کارم عالی بودم. من مطمئن بودم. تعیین کننده. پرشور. من به دیگران الهام دادم. اینها چیزهایی بودند که می توانستم کلاهم را به آن آویزان کنم. امروز احساس تنهایی میکنم تردید دارم من نگرانم از بیرون رفتن و معاشرت پرهیز می کنم، چیزی که قبلاً از آن بسیار لذت می بردم. می ترسم کسی در مورد جستجوی شغل من بپرسد. یا ممکن است شخصی جدید بی ضررترین سوال دنیا را بپرسد: \"برای کار چه کار می کنی؟\" تنها بار دیگری که شغلم را از دست دادم در سال 2009 در دوران رکود بزرگ بود. من کمتر از پنج سال سابقه کار داشتم و به سرعت کار جدیدی پیدا کردم. الان بیش از 20 سال"}, {"source": "Business Insider", "title": "Why prediction markets might take a bite out of New York's tax revenue", "link": "https://www.businessinsider.com/new-york-gambling-tax-revenue-faces-loss-prediction-market-growth-2026-10", "summary": "DragonImages/Getty Images Mobile sports betting has become New York's second-largest driver of gambling revenue. The rise of prediction markets, which aren't taxed the same in the state, could be a revenue hit. More problem gamblers and gamblers turning to prediction markets could cause financial strain. New York has turned mobile sports betting via apps like DraftKings and FanDuel into a lucrative source of state revenue. This raises a question for lawmakers and state finances: Can platforms that offer sports-related contracts compete with sportbooks — and avoid the state's 51% tax rate? In the first quarter of 2026, mobile sports betting brought in around $328 million in tax receipts for the state, according to a report from the state comptroller's office. Nationwide, New York accounts for a third of all state tax collections on sports betting revenues. But prediction markets like Polymarket and Kalshi have begun offering sports gamblers a new way to play — and they are taxed at a lower federal level. Early evidence from DraftKings suggests those platforms might be attracting different customers — a company spokesperson said in a statement that only about 1% of its sportbook customers overlap with Kalshi in states where sports betting is legal. Even still, if 1% of sportsbook activity in New York moved to prediction markets, it could result in a $13 million revenue hit, according to an analysis from the Tax Policy Center . \"For a user, it's not clear that engaging in activity on a prediction market is a substantially different activity than placing a wager on a mobile sports betting platform,\" said Maria Doulis, the New York State deputy comptroller for budget and policy analysis. \"But from the state's perspective, those two activities are taxed differently and can yield two different outcomes.\" Prediction markets argue that they fall under federal oversight as derivatives exchanges, rather than being subject to state gambling laws . Most recently, New York moved to sue Polymarket, with Governor Kathy Hochul saying that she'll \"always stand up for New Yorkers when bad corporate actors prey on consumers and threaten tax dollars that fund schools and critical public services.\" Prediction markets' growth has accelerated since they added sports . Trading volume on Kalshi rose nearly thirteenfold a year after it added sports contracts. And Polymarket also saw skyrocketing growth after adding sports to its platform, according to a report from the New York Stat", "date_str": "2026-10-02T10:00:01+00:00", "hash": "25e788ff97998cc9", "title_fa": "چرا بازارهای پیش‌بینی ممکن است کمی از درآمد مالیاتی نیویورک کم کنند؟", "summary_fa": "DragonImages/Getty Images شرط‌بندی‌های ورزشی موبایل به دومین محرک بزرگ درآمد قمار در نیویورک تبدیل شده‌اند. افزایش بازارهای پیش‌بینی، که مالیات آن‌ها در ایالت یکسان نیست، می‌تواند یک ضربه به درآمد باشد. بیشتر قماربازان و قماربازانی که به بازارهای پیش‌بینی روی می‌آورند می‌تواند باعث فشار مالی شود. نیویورک شرط بندی ورزشی موبایلی را از طریق برنامه هایی مانند DraftKings و FanDuel به منبع درآمدی پرسود دولتی تبدیل کرده است. این سوالی را برای قانونگذاران و امور مالی ایالتی ایجاد می‌کند: آیا پلتفرم‌هایی که قراردادهای مرتبط با ورزش را ارائه می‌دهند می‌توانند با کتاب‌های ورزشی رقابت کنند - و از نرخ مالیات 51 درصدی ایالت اجتناب کنند؟ طبق گزارش دفتر کنترل ایالتی، در سه ماهه اول سال 2026، شرط بندی های ورزشی موبایلی حدود 328 میلیون دلار درآمد مالیاتی برای ایالت به همراه داشت. در سراسر کشور، نیویورک یک سوم کل جمع آوری مالیات های ایالتی در درآمدهای شرط بندی ورزشی را تشکیل می دهد. اما بازارهای پیش‌بینی مانند Polymarket و Kalshi شروع کرده‌اند به قماربازان ورزشی راه جدیدی برای بازی ارائه می‌کنند - و آنها در سطح فدرال پایین‌تری مالیات می‌گیرند. شواهد اولیه از DraftKings نشان می‌دهد که این پلتفرم‌ها ممکن است مشتریان مختلفی را جذب کنند - سخنگوی شرکت در بیانیه‌ای گفت که تنها حدود 1٪ از مشتریان کتاب ورزشی آن با Kalshi در ایالت‌هایی که شرط‌بندی ورزشی قانونی است همپوشانی دارند. بر اساس تجزیه و تحلیل مرکز سیاست مالیاتی، حتی اگر 1 درصد از فعالیت کتاب های ورزشی در نیویورک به سمت بازارهای پیش بینی حرکت کند، می تواند به درآمد 13 میلیون دلاری منجر شود. ماریا دولیس، معاون کنترل بودجه و تحلیل سیاست ایالت نیویورک، گفت: «برای یک کاربر، مشخص نیست که درگیر شدن در فعالیت در یک بازار پیش‌بینی، فعالیتی اساساً متفاوت از شرط‌بندی در یک پلتفرم شرط‌بندی ورزشی تلفن همراه باشد». اما از دیدگاه ایالت، این"}, {"source": "Business Insider", "title": "AI still needs a human touch. Consulting stocks are the latest proof.", "link": "https://www.businessinsider.com/why-accenture-consulting-stocks-thrive-ai-trade-needs-human-touch-2026-10", "summary": "Davide Bonaldo/SOPA Images/LightRocket via Getty Images Accenture earnings showed companies aren't simply buying AI bots — they still need help making them useful. Consulting stocks are bouncing back as AI's former victims become its installers. Sign up for First Trade , Business Insider's daily markets newsletter. When it became clear that AI was going to be an unprecedented world-transforming force, investors were quick to write off entire industries. Goodbye, software. And consulting? Doomed to be replaced by the machines. The stock losses were swift and unforgiving. In the time since, both industries — and many others briefly afflicted by AI mania — have made their way back. The ball has been in their court to prove themselves, and the number of reclamation stories is growing. Accenture became the latest comeback kid on Thursday after reporting an across-the-board earnings beat. Investors keyed in on evidence that the company is successfully adjusting to the AI boom. More than 400 clients began advanced-AI projects during its fiscal year, showing that businesses are paying Accenture to put the technology to work at scale. The company was rewarded with a 16% single-day stock surge , bringing its recovery to 71% from a nearly nine-year low reached in June. The rebound is rippling outward. Cognizant, another IT-services company that was swept into the June sell-off, has also rallied sharply off its own low. Its shares jumped another 6% on Thursday alongside Accenture's results. So not only is AI not crushing the consulting industry, it's actually fueling a new line of business installing AI systems. It's the type of adaptability that investors like to see. Remember the SaaSpocalypse? Consulting is hardly the first sector to turn the AI-cannibalization narrative on its head. Software has also been blazing a trail back to prominence , with companies like Salesforce, ServiceNow, Workday, and CrowdStrike leveraging AI in different ways to juice growth, rather than being squashed. Of course, there is some nuance required. The firms that perform critical data, workflow, or security tasks have most clearly shown that AI can be applied to their business in a positive way. A wave of AI-apocalypse fears has made cybersecurity the best-performing theme within software in recent weeks. Meanwhile, the shares of more pure-play developers are still working their way back to positive territory for the year. Investors shouldn't get too far ahead of themselves quite yet. S", "date_str": "2026-10-02T09:50:01+00:00", "hash": "ecacbcdcd9a3a273", "title_fa": "هوش مصنوعی همچنان به لمس انسان نیاز دارد. سهام مشاوره آخرین مدرک است.", "summary_fa": "Davide Bonaldo/SOPA Images/LightRocket از طریق Getty Images درآمد Accenture نشان داد که شرکت‌ها صرفاً ربات‌های هوش مصنوعی نمی‌خرند - آنها همچنان برای مفید بودن آنها به کمک نیاز دارند. با تبدیل شدن قربانیان سابق هوش مصنوعی به نصب کنندگان آن، سهام مشاوره در حال بازگشت است. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. وقتی مشخص شد که هوش مصنوعی قرار است نیرویی بی‌سابقه در جهان باشد، سرمایه‌گذاران به سرعت کل صنایع را حذف کردند. خداحافظ نرم افزار و مشاوره؟ محکوم به جایگزینی با ماشین آلات. زیان سهام سریع و غیرقابل بخشش بود. پس از آن، هر دو صنعت - و بسیاری دیگر که برای مدت کوتاهی دچار شیدایی هوش مصنوعی شده‌اند - راه خود را باز کرده‌اند. توپ برای اثبات خود در زمین آنها بوده است و تعداد داستان های احیا در حال افزایش است. اکسنچر در روز پنجشنبه پس از گزارش یک افت درآمد کلی، جدیدترین بچه بازگشتی شد. سرمایه گذاران شواهدی را به دست آوردند که نشان می دهد این شرکت با موفقیت خود را با رونق هوش مصنوعی سازگار می کند. بیش از 400 مشتری پروژه های پیشرفته هوش مصنوعی را در طول سال مالی خود آغاز کردند، که نشان می دهد کسب و کارها به Accenture پول می دهند تا این فناوری را در مقیاس بزرگ به کار گیرند. این شرکت با افزایش 16 درصدی سهام یک روزه پاداش دریافت کرد که بهبود آن را از پایین‌ترین سطح 9 ساله خود در ژوئن به 71 درصد رساند. ریباند به سمت بیرون موج می زند. Cognizant، یکی دیگر از شرکت‌های خدمات IT که در ماه ژوئن به فروش رفت، نیز به شدت کاهش یافته است. سهام آن در روز پنجشنبه در کنار نتایج Accenture 6 درصد دیگر جهش کرد. بنابراین نه تنها هوش مصنوعی صنعت مشاوره را در هم شکسته نیست، بلکه در"}, {"source": "Business Insider", "title": "How to get ahead of the job-search 'cattle call'", "link": "https://www.businessinsider.com/career-coaches-say-network-before-job-opening-posted-2026-10", "summary": "It can be helpful to connect with people inside a company you re targeting, so that you re ready when an opening appears. Jovanmandic/Getty Images If you're looking for a job, having contacts at an employer can help you be ready when a role opens . Building a relationship can help you avoid the application cattle call, one career coach said. A warm introduction can be \"worth its weight in gold\" during a crowded job search, a recruiter said. The best way to beat the line for a job is to get there before it forms. Talking with an employer before the company ever posts a job — and not after — could help you land a role there, said veteran career coach Laura Labovich. She recommends that job seekers identify where they want to work, examine their network for any ties to the organization, and start building relationships inside well before a job post goes up. \"The way to win is to not apply. Get in before they have the opening. Make connections. Become an insider,\" Labovich said. If you wait until you see a job post before reaching out to an employer, you might already be too late, she said. That's because once a role is posted, recruiters or HR will often feel compelled to tell you to apply online — even if they already know you — to ensure that every candidate gets equal consideration, Labovich said. Getting in line with everybody else can make the process seem \"more like a cattle call,\" she said. ' Worth its weight in gold' Aside from the stress it can bring, the take-a-number approach is also rarely the best path to landing a role, as almost anyone looking for a desk job in the AI era can attest. The average job posting received 244 applications in 2025, according to an analysis by the hiring software company Greenhouse of more than 640 million applications from 6,000-plus companies. That was up from 116 applications per job in 2022. Having someone who can pass your résumé to a recruiter or hiring manager and help you stand out is \"worth its weight in gold\" when there are so many people looking for jobs, said Rick Wargo, managing partner of the global technology practice at the recruitment firm Boyden. \"A warm introduction is always the best way to go about a job search,\" he said. Don't fix the roof when it's raining Naturally, if a job has yet to be posted, you can't make a pitch for it. Still, that doesn't mean you're powerless. What you can do is consider whether the employer has hired for the kinds of jobs you might want — and use that to guide early ou", "date_str": "2026-10-02T09:46:02+00:00", "hash": "94ccfcf37e97a57f", "title_fa": "چگونه از «تماس گاو» در جستجوی کار جلوتر باشیم", "summary_fa": "این می تواند مفید باشد که با افراد داخل شرکتی که هدف آن هستید ارتباط برقرار کنید، به طوری که هنگام ظاهر شدن یک افتتاحیه آماده باشید. Jovanmandic/Getty Images اگر به دنبال شغلی هستید، داشتن تماس با یک کارفرما می تواند به شما کمک کند هنگام باز شدن یک نقش آماده باشید. یکی از مربیان حرفه ای گفت که ایجاد یک رابطه می تواند به شما کمک کند از تماس با گاوهای کاربردی اجتناب کنید. یک کارگزین گفت که یک معرفی گرم می تواند در طول یک جستجوی شغلی شلوغ \"ارزش وزن خود را به طلا داشته باشد\". بهترین راه برای شکست دادن خط یک کار این است که قبل از شکل گیری آن به آنجا برسید. لورا لابوویچ، مربی حرفه ای کهنه کار، گفت که صحبت با یک کارفرما قبل از اینکه شرکت شغلی را پست کند - و نه بعد از آن - می تواند به شما کمک کند تا در آنجا نقشی داشته باشید. او توصیه می کند که جویندگان کار مشخص کنند که کجا می خواهند کار کنند، شبکه خود را از نظر هرگونه ارتباط با سازمان بررسی کنند و قبل از اینکه پست شغلی بالا برود شروع به ایجاد روابط در داخل خود کنند. \"راه برنده شدن این است که درخواست نکنید. قبل از اینکه آنها افتتاحیه شوند، وارد شوید. ارتباط برقرار کنید. لابوویچ گفت: اگر منتظر بمانید تا یک پست شغلی را ببینید و قبل از تماس با کارفرما، ممکن است خیلی دیر شده باشید. به این دلیل است که وقتی یک نقش پست می شود، استخدام کنندگان یا منابع انسانی اغلب احساس می کنند مجبور می شوند به شما بگویند که به صورت آنلاین درخواست دهید - حتی اگر شما را از قبل می شناسند - تا اطمینان حاصل شود که همه نامزدها می توانند به یکسان توجه کنند. گاوها را صدا می"}, {"source": "Business Insider", "title": "A full-time lawyer with 10 income streams shares her biggest flops, and the easiest way to earn side money in 2026", "link": "https://www.businessinsider.com/serial-side-hustler-shares-how-to-start-making-money-today-2026-10", "summary": "Lucy Zheng and her husband have built a household with 10 income streams. Lucy Zheng Lucy Zheng has experimented with multiple ventures, from a fashion blog to a bounce-house business. Not all of them took off. Some flops include leather hats and recycled-plastic tote bags. Zheng has 10 income streams, and says user-generated content is a low-cost way to start earning on the side. Lucy Zheng has been building side businesses since 2012 , when she was looking to supplement the income from her first job out of law school and pay down student loans. Her first project was a fashion blog. \"Blogging was a huge thing back in 2012,\" she told Business Insider. It was also cheap to get into. Aside from a \"semi-decent camera,\" she said, \"there was virtually no cost.\" Over the past 14 years, Zheng and her husband have tried a range of ventures, from Etsy shops to a bounce-house business. Not all of them worked, but each venture gave Zheng skills she used to inform the next. Her fashion blog taught her website-building and graphic-design skills, which she and her husband used to create a physical wedding planner. Later, their experience importing the planners and working with overseas factories helped them start a real estate sign business. \"Everything builds on stuff we did in the past,\" she said. Her biggest flops More than a decade of side hustling has inevitably brought failures. Zheng and her husband once tried to sell tote bags made from recycled plastic. They bought about 50 bags, built a website, and promoted the business on social media, but after about three months with no sales, they shut it down. The leather hat business turned out to be a flop. Courtesy of Lucy Zheng A men's leather-hat business also failed to take off. \"Businesses with physical products and inventory, especially in the fashion space, are not an easy thing to get into,\" Zheng said. \"If you don't have a really good, solid plan of action, it can be very hard to keep running.\" The push toward more passive income streams Zheng has also shut down businesses that made money but proved too time-intensive. Her fashion blog, for instance, generated income through sponsored posts and advertising, but only when she was actively creating content. \"If I wasn't working on a blog post, then I wouldn't be making money,\" she said. That realization led her to YouTube. The longer-form videos took time to make, but could continue to generate ad revenue even years after she uploaded them. Zheng experimented wi", "date_str": "2026-10-02T09:30:01+00:00", "hash": "c79c302663761e58", "title_fa": "یک وکیل تمام وقت با 10 جریان درآمد، بزرگترین شکست های خود و ساده ترین راه برای کسب درآمد جانبی در سال 2026 را به اشتراک می گذارد.", "summary_fa": "لوسی ژنگ و همسرش خانواده ای با 10 جریان درآمد ساخته اند. لوسی ژنگ لوسی ژنگ چندین سرمایه گذاری را تجربه کرده است، از یک وبلاگ مد گرفته تا یک کسب و کار پرفروش. همه آنها بلند نشدند. برخی از فلاپ ها شامل کلاه های چرمی و کیسه های پلاستیکی بازیافتی هستند. ژنگ 10 جریان درآمد دارد و می‌گوید محتوای تولید شده توسط کاربر راهی کم‌هزینه برای شروع کسب درآمد است. لوسی ژنگ از سال 2012، زمانی که به دنبال تکمیل درآمد حاصل از اولین شغل خود از دانشکده حقوق و پرداخت وام های دانشجویی بود، مشغول ایجاد مشاغل جانبی است. اولین پروژه او یک وبلاگ مد بود. او به Business Insider گفت: «وبلاگینگ در سال 2012 چیز بزرگی بود. ورود به آن نیز ارزان بود. او گفت، جدای از «دوربین نیمه مناسب»، «عملاً هیچ هزینه‌ای وجود نداشت». در 14 سال گذشته، ژنگ و همسرش مجموعه‌ای از سرمایه‌گذاری‌ها را امتحان کرده‌اند، از فروشگاه‌های Etsy گرفته تا کسب‌وکار پرفروش. همه آن‌ها کار نمی‌کردند، اما هر سرمایه‌گذاری مهارت‌هایی را به ژنگ می‌داد که برای اطلاع‌رسانی بعدی استفاده می‌کرد. وبلاگ مد او مهارت های طراحی وب سایت و طراحی گرافیکی را به او آموزش داد، که او و همسرش از آنها برای ایجاد یک برنامه ریز عروسی فیزیکی استفاده کردند. بعداً، تجربه آنها در واردات برنامه ریزان و کار با کارخانه های خارج از کشور به آنها کمک کرد تا یک تجارت علائم املاک و مستغلات را راه اندازی کنند. او گفت: \"همه چیز بر اساس کارهایی است که در گذشته انجام می دادیم.\" بزرگ‌ترین شکست‌های او بیش از یک دهه تلاش‌های جانبی ناگزیر شکست‌هایی را به همراه داشته است. ژنگ و همسرش یک بار سعی کردند کیسه های حمل و نقل ساخته شده از پلاستیک بازیافتی را بفروشند. آنها حدود 50 کیف خریدند، یک وب سایت ساختند و کسب و کار را"}, {"source": "Business Insider", "title": "United is going hard for Delta customers over Starlink. And some United customers don't like it.", "link": "https://www.businessinsider.com/frequent-fliers-united-loyalty-status-delta-convert-2026-10", "summary": "United s latest status-match campaign comes as major US airlines compete for high-value frequent fliers. Patrick T Fallon/AFP/Getty Images United Airlines is trying to lure Delta and American's elite travelers with a status-match offer. United is pitching faster on board internet alongside its status-match offer. Some Delta frequent fliers say Starlink WiFi could persuade them to switch. If you're a loyal Delta flier, you're one of United Airlines ' hottest targets right now. United went on the offensive this week, offering eligible elite members of Delta Air Lines and American Airlines a loyalty status match . Some Delta customers have complained online that the company needs to offer better products to retain its frequent fliers, including smoother internet service. United's X account replied to several complaints, encouraging them to consider switching. David Hansson, a programmer and writer, wrote in an X post that he would be convinced to switch from Delta to United because of Starlink access. Delta has opted not to use Starlink on its planes, a decision that has riled Elon Musk and given United an in. \"I'm a @delta Diamond Medallion flier, and I'm generally happy with the airline, but the one thing that could make me switch to @united is Starlink,\" Hansson wrote on Wednesday. \"It's just so much better. Crazy to deny your customers the best just because you don't like Elon.\" Others used the moment to poke fun at the airlines' different approaches to onboard WiFi. \"United is a blue collar airline for knowledge workers who need to work on their laptops even when they're on a plane,\" another X user wrote on the platform. Josh Kaplan, an investor and startup founder, said on X that he's been a Delta Diamond member for 10 years, but this year will be the last. \"I'm sure complaining about Delta will sound like a champagne problem, but oh well. A few things finally broke me,\" Kaplan wrote, citing difficult upgrades, long lounge lines, unreliable WiFi, chaotic boarding, and steep fares. United isn't alone. American Airlines also launched a status-match promotion on Wednesday. The carrier plans to begin installing Starlink WiFi on more than 500 narrow-body aircraft beginning in the first quarter of 2027, it said in May. The moves underscore how fiercely the biggest US airlines are competing for high-value frequent fliers, whose spending on premium cabins, airline credit cards, and business travel makes them some of the industry's most valuable customers. Statu", "date_str": "2026-10-02T09:29:48+00:00", "hash": "9272090728531cdc", "title_fa": "یونایتد به سختی برای مشتریان دلتا نسبت به Starlink تلاش می کند. و برخی از مشتریان یونایتد آن را دوست ندارند.", "summary_fa": "آخرین کمپین یونایتد در شرایطی انجام می شود که خطوط هوایی بزرگ ایالات متحده برای پروازهای مکرر با ارزش بالا رقابت می کنند. پاتریک تی فالون/ خبرگزاری فرانسه/ گتی ایماژ یونایتد ایرلاینز در تلاش است تا مسافران نخبه دلتا و آمریکا را با پیشنهادی برای تطبیق وضعیت جذب کند. یونایتد در کنار پیشنهاد مسابقه وضعیت خود، سرعت بیشتری در اینترنت ارائه می دهد. برخی از پروازهای مکرر دلتا می گویند که Starlink WiFi می تواند آنها را متقاعد کند که تغییر دهند. اگر یک هواپیمای وفادار دلتا هستید، در حال حاضر یکی از داغ ترین اهداف خطوط هوایی یونایتد هستید. یونایتد در این هفته حمله کرد و به اعضای نخبه واجد شرایط دلتا ایر لاین و امریکن ایرلاینز یک مسابقه وضعیت وفاداری ارائه کرد. برخی از مشتریان دلتا به صورت آنلاین شکایت کرده اند که این شرکت باید محصولات بهتری را برای حفظ پروازهای مکرر خود، از جمله خدمات اینترنتی روان تر، ارائه دهد. حساب کاربری یونایتد به چندین شکایت پاسخ داد و آنها را تشویق کرد که تغییر کنند. دیوید هانسون، برنامه نویس و نویسنده، در پست ایکس نوشت که متقاعد خواهد شد که به دلیل دسترسی Starlink از دلتا به یونایتد تغییر مکان دهد. دلتا تصمیم گرفته است که از Starlink در هواپیماهای خود استفاده نکند، تصمیمی که ایلان ماسک را عصبانی کرده و به یونایتد کمک کرده است. هانسون روز چهارشنبه نوشت: \"من یک پرواز مدالیون الماس @delta هستم، و به طور کلی از خط هوایی راضی هستم، اما تنها چیزی که می تواند مرا به @united تغییر دهد، استارلینک است.\" \"این خیلی بهتر است. دیوانه وار است که مشتریان خود را فقط به این دلیل که از ایلان خوشتان نمی آید، بهترین ها را انکار کنید.\" دیگران از این لحظه استفاده کردند تا رویکردهای متفاوت خطوط هوایی را برای وای فای داخلی مورد تمسخر قرار دهند."}, {"source": "Business Insider", "title": "CEOs keep crying AGI. What does that even mean?", "link": "https://www.businessinsider.com/tech-ceos-declare-agi-is-here-2026-10", "summary": "Nvidia CEO Jensen Huang (middle right) and OpenAI President Greg Brockman (right) discuss AI with President Donald Trump after a recent meeting. Kevin Dietsch/Getty Images Tech CEOs have started saying AI has reached a critical — and highly debated — threshold. AGI is typically taken to mean an AI that can match or exceed human intelligence. Engineers told Business Insider the term is overblown. \"Welcome to the AGI era,\" OpenAI president Greg Brockman declared on a call with reporters in September, touting the company's latest AI model. \"For me, personally, I do think we're there.\" Recently, tech CEOs and people on X alike are throwing around a buzzword that was once a distant, largely theoretical goal for artificial intelligence. AGI , or artificial general intelligence, is a nebulous term often taken to mean an AI model that can perform a wide variety of tasks as well as or better than a human. Aside from Brockman, influential people who have said we've reached that point include Elon Musk , Sam Altman , and Jensen Huang . However, others in the industry told Business Insider that the term is, at best, too poorly defined to serve as a meaningful benchmark. At worst, they called claims that AGI is here dishonest marketing practices . \"It's all just marketing talk, and it's complete nonsense,\" said Peter Voss, who was among the first software engineers to use the term. \"If you had AGI right now, we would certainly know it.\" What is AGI? And why are tech leaders saying we've reached it? In 2002, Ben Goertzel was having trouble deciding on a book title for a project on a speculative, versatile type of AI called a \"thinking machine,\" which is capable of, say, beating a human at chess while also learning to drive a car. After reaching out to friends, he settled on the term: \"Artificial General Intelligence.\" Voss, who contributed a chapter for the book, said such a machine represented a \" dream that has really not been realized in AI .\" The leading chatbots today, he said, have difficulty branching out beyond certain limited capabilities and learning new skills with the same plasticity as humans. Humans, he said, can learn to work at a call center given one or two days of training. An AGI system should be able to do the same, but current AI systems struggle with such tasks. \"Right now, to try and do even something as simple as customer support, you need billions of dollars of engineering,\" he said. \"You need hundreds of thousands of example conversations, and ", "date_str": "2026-10-02T09:19:01+00:00", "hash": "e0993077ff2756a7", "title_fa": "مدیران عامل مدام گریه می کنند AGI. اصلاً به چه معناست؟", "summary_fa": "جنسن هوانگ، مدیر عامل انویدیا (راست میانی) و رئیس OpenAI، گرگ براکمن (راست) پس از جلسه اخیر درباره هوش مصنوعی با رئیس جمهور دونالد ترامپ گفتگو کردند. کوین دیچ/ مدیران اجرایی شرکت گتی ایمیجز گفته اند که هوش مصنوعی به آستانه بحرانی - و بسیار مورد بحث - رسیده است. AGI معمولاً به معنای هوش مصنوعی است که می تواند با هوش انسانی مطابقت داشته باشد یا از آن فراتر رود. مهندسان به Business Insider گفتند که این اصطلاح بیش از حد است. گرگ براکمن، رئیس OpenAI، در تماسی با خبرنگاران در ماه سپتامبر، با تبلیغ آخرین مدل هوش مصنوعی شرکت، اعلام کرد: «به عصر AGI خوش آمدید». برای من، شخصاً، فکر می‌کنم ما آنجا هستیم.» اخیراً، مدیران عامل فناوری و افراد در X به طور یکسان در مورد یک کلمه کلیدی صحبت می کنند که زمانی یک هدف دوردست و عمدتاً نظری برای هوش مصنوعی بود. AGI یا هوش عمومی مصنوعی، اصطلاحی مبهم است که اغلب به معنای یک مدل هوش مصنوعی است که می تواند وظایف مختلفی را به خوبی یا بهتر از یک انسان انجام دهد. به غیر از براکمن، افراد با نفوذی که گفته اند به آن نقطه رسیده ایم عبارتند از الون ماسک، سام آلتمن و جنسن هوانگ. با این حال، سایرین در صنعت به Business Insider گفتند که این اصطلاح در بهترین حالت آنقدر ضعیف تعریف شده است که نمی تواند به عنوان یک معیار معنادار عمل کند. در بدترین حالت، آنها ادعاهایی را مبنی بر اینکه AGI در اینجا شیوه های بازاریابی غیر صادقانه است نامیدند. پیتر ووس که جزو اولین مهندسان نرم افزاری بود که از این اصطلاح استفاده کرد، گفت: «همه اینها فقط بحث بازاریابی است و کاملاً مزخرف است. \"اگر شما همین الان AGI داشتید، مطمئناً آن را می دانستیم.\" AGI چیست؟ و چرا رهبران فناوری می گویند ما به"}, {"source": "Business Insider", "title": "I run an AI company with a workforce of 34 AI agents. My days are powered by Diet Coke, DoorDash, and 'Claude walks' — here's my routine.", "link": "https://www.businessinsider.com/open-machine-ceo-allie-k-miller-discusses-ai-daily-life-2026-10", "summary": "Allie K. Miller. Adam Hendershott This as-told-to essay is based on a conversation with Allie K. Miller, the CEO of Open Machine, based in New York, about her daily routine. It's been edited for length and clarity. I studied cognitive science at Dartmouth College and completed a three-year independent study in machine learning and natural-language processing, graduating in 2010. I later earned my MBA from Wharton. In 2016, I joined IBM Watson as a product manager, eventually becoming a lead product manager, and launched IBM's first multimodal AI team. In 2019, I joined Amazon Web Services , where I worked as the global head of machine learning for startups and venture capital for three and a half years. I founded Open Machine in 2022 after leaving AWS. Open Machine is focused on business transformation at scale. What I want most is for people to rethink how they work and achieve more than just 10%-15% productivity gains. Here's a day in my life running my company in New York City. I wake up around 8 a.m. Because my AI system has been working for me all night, I have the flexibility to stay in bed for the first 30 minutes of my day and avoid 9 a.m. client meetings. That first hour and a half is triage mode, where I look at escalations. I have a morning briefing that gives me a rundown of the day: the weather, what to wear, and how to manage my energy. It also helps block out work-free time, so I can get deep work done before I have to be out the door. For my personal life, the briefing also gives outfit ideas based on the local weather and suggests funky activities in whatever city I'm in — a recent San Francisco briefing surfaced pianos scattered through a botanical garden. I want it to help me make room for those experiences, too. I don't have a set breakfast time, and it's grab-and-go. Today, I had Trader Joe's egg bites. My fridge is filled with protein and sustenance I can grab in less than two minutes. Sometimes I order DoorDash avocado toast. I have about 34 AI agents working for me They're connected to my goals, decisions, meeting transcripts, email, Google Docs, Notion, and other contexts. They run off prompts, decide what smart things to do, and then send me a summary email. The same thing happens in Slack, where our Claude agents will ping me with updates. I use Codex Live Voice Mode — a voice interface for my entire AI workforce — to triage whatever needs my attention. That might mean going through emails, reviewing research papers, or pulling f", "date_str": "2026-10-02T09:05:01+00:00", "hash": "92a8a1e611d94f58", "title_fa": "من یک شرکت هوش مصنوعی را با نیروی کاری متشکل از 34 عامل هوش مصنوعی اداره می کنم. روزهای من با کوکای رژیمی، DoorDash، و «کلود راه می‌رود» تأمین می‌شود - این برنامه روتین من است.", "summary_fa": "آلی کی میلر. آدام هندرسات این مقاله گفته شده بر اساس گفتگو با آلی کی میلر، مدیر عامل ماشین باز، مستقر در نیویورک، در مورد کارهای روزمره او است. برای طول و وضوح ویرایش شده است. من علوم شناختی را در کالج دارتموث مطالعه کردم و یک مطالعه مستقل سه ساله را در زمینه یادگیری ماشین و پردازش زبان طبیعی به پایان رساندم و در سال 2010 فارغ التحصیل شدم. بعداً MBA خود را از وارتون دریافت کردم. در سال 2016، من به عنوان مدیر محصول به IBM Watson ملحق شدم، در نهایت مدیر محصول اصلی شدم و اولین تیم هوش مصنوعی چندوجهی IBM را راه اندازی کردم. در سال 2019، به خدمات وب آمازون پیوستم، جایی که به مدت سه سال و نیم به عنوان رئیس جهانی یادگیری ماشین برای استارت‌آپ‌ها و سرمایه‌گذاری مخاطره‌آمیز کار کردم. من Open Machine را در سال 2022 پس از ترک AWS تأسیس کردم. Open Machine بر تحول کسب و کار در مقیاس متمرکز است. آنچه من بیشتر از همه می‌خواهم این است که مردم درباره نحوه کار خود تجدید نظر کنند و به بیش از 10 تا 15 درصد افزایش بهره‌وری دست یابند. در اینجا یک روز از زندگی من است که شرکتم را در شهر نیویورک اداره می کنم. من حوالی ساعت 8 صبح از خواب بیدار می شوم، زیرا سیستم هوش مصنوعی من تمام شب را برای من کار می کند، من این انعطاف را دارم که 30 دقیقه اول روز را در رختخواب بمانم و از ملاقات با مشتری در ساعت 9 صبح اجتناب کنم. آن ساعت و نیم اول حالت تریاژ است، جایی که من به تشدیدها نگاه می کنم. من یک جلسه توجیهی صبحگاهی دارم که خلاصه ای از روز را به من می دهد: آب و هوا، چه بپوشم، و چگونه انرژی خود را مدیریت کنم. همچنین"}, {"source": "Business Insider", "title": "Why VCs are funding a concert business as a hedge against AI", "link": "https://www.businessinsider.com/vcs-funding-rasa-world-concerts-as-a-hedge-against-ai-2026-9", "summary": "Pier Play by RASA at the Santa Monica Pier earlier this year. Courtesy of RASA RASA is a concert business for and by tech people, hosting an festival this weekend in Santa Monica. It has raised more than $8 million from VCs who see IRL experiences as a hedge against AI. RASA's founder wants it to become the \"Palantir\" of the concert business. As most VCs pour billions into AI startups, a select few are making a counterbet on a traditionally low-tech business: Concerts. They figure the more life moves onto screens, the more valuable it will become to get people off them. \"Real life experiences are the ultimate hedge against AI,\" said Paul Martino, managing partner at Bullpen Capital. \"The place you're going to escape from AI is a concert.\" Martino is one of around a dozen VCs who have invested around $9.5 million into a Los Angeles-based startup RASA World, which produces electronic dance music festivals and live events around the globe. Earlier this month, it hosted an EDM festival for 3,000 people on the San Francisco waterfront. This weekend, it is holding a two-day festival on the Santa Monica pier featuring DJs Arodes and Claptone, with an expected crowd of 8,000 people. Founded in 2023 by three serial tech entrepreneurs, RASA is decidedly for tech people, by tech people. Rather than spend money on expensive acts, the company has used its capital to hire engineers and data specialists to build what cofounder and CEO Ahmad Muhaisen described as an internal \"super tool\" to combine the data from ticketing, social interactions, and attendance. Part of RASA's appeal to VCs is that the founders speak in the lingua franca of venture-backed software. Muhaisen said investors often arrive expecting to meet a slick \"nightlife promoter\" only to be pleasantly surprised when he throws around terms like customer-acquisition cost, lifetime value, and scalable distribution. \"Suddenly they meet us, and they're like, 'Wait, you're tech founders,'\" he said. Pier Play by RASA at the Santa Monica Pier earlier this year. Amandala Photography Muhaisen grew up in Lebanon where he studied computer engineering. After moving to the US, he cofounded a fintech company but left in 2022 to build a business around the gatherings he had been throwing in San Francisco. \"These events started with 50 people in my house,\" Muhaisen said. \"Suddenly, there are a thousand people showing up and renting beautiful venues.\" Muhaisen wants RASA to become the \"Palantir\" of the concert business: an i", "date_str": "2026-10-02T09:00:01+00:00", "hash": "c4c7916d3d9223b9", "title_fa": "چرا VCها یک کسب و کار کنسرت را به عنوان پوششی در برابر هوش مصنوعی تامین می کنند؟", "summary_fa": "Pier Play توسط RASA در اسکله سانتا مونیکا در اوایل امسال. با حسن نیت از RASA RASA یک کسب و کار کنسرت برای و توسط افراد فناوری است که میزبان جشنواره ای در آخر هفته در سانتا مونیکا است. بیش از 8 میلیون دلار از VCهایی که تجارب IRL را پوششی در برابر هوش مصنوعی می دانند، جمع آوری کرده است. موسس RASA می خواهد که آن را به \"Palantir\" تجارت کنسرت تبدیل کند. از آنجایی که اکثر VCها میلیاردها دلار را برای استارتاپ های هوش مصنوعی می ریزند، تعداد معدودی از آنها در حال ایجاد یک رقابت در یک تجارت سنتی با فناوری پایین هستند: کنسرت ها. آنها تصور می کنند که هرچه زندگی بیشتر روی صفحه نمایش ها حرکت کند، دور کردن مردم از آنها ارزشمندتر می شود. پل مارتینو، شریک مدیریت بولپن کپیتال، می‌گوید: «تجارب زندگی واقعی بهترین پوشش در برابر هوش مصنوعی است. جایی که قرار است از دست هوش مصنوعی فرار کنید کنسرت است. مارتینو یکی از ده ها VC است که حدود 9.5 میلیون دلار در استارتاپ RASA World مستقر در لس آنجلس سرمایه گذاری کرده است که جشنواره های موسیقی رقص الکترونیک و رویدادهای زنده را در سراسر جهان تولید می کند. اوایل این ماه، میزبان جشنواره EDM برای 3000 نفر در اسکله سانفرانسیسکو بود. این آخر هفته، فستیوالی دو روزه در اسکله سانتا مونیکا با حضور دی جی های آرودس و کلاپتون برگزار می کند که انتظار می رود جمعیتی بالغ بر 8000 نفر داشته باشند. RASA که در سال 2023 توسط سه کارآفرین فناوری زنجیره ای تأسیس شد، قطعاً برای افراد فناوری، توسط افراد فناوری است. این شرکت به جای صرف پول برای کارهای گران قیمت، از سرمایه خود برای استخدام مهندسان و متخصصان داده استفاده کرده است تا چیزی را بسازد که یکی از بنیانگذاران و مدیرعامل احمد محیسن به"}, {"source": "Business Insider", "title": "AI is taking over the painstaking work of Silicon Valley's most-coveted engineers", "link": "https://www.businessinsider.com/cuda-engineers-adapt-ai-reshapes-nvidia-chip-expertise-2026-10", "summary": "CUDA inventor Ian Buck, vice president of hyperscale and high-performance computing at Nvidia. GTC CUDA engineers are elite coders who squeeze speed out of Nvidia's chips. AI is reshaping the job as demand for scarce expertise continues to grow. AI could soon write CUDA code that humans can verify but not fully understand. For years, CUDA engineers who optimize Nvidia chips have been among tech's most sought-after specialists. Now, they're increasingly managing AI that does it for them. These engineers specialize in using Compute Unified Device Architecture (CUDA) — Nvidia's software for programming its AI chips, known as GPUs — to write code that can run AI as efficiently as possible. The jobs are coveted because compute costs are massive; engineers who can squeeze the most value from a chip can save companies millions. CUDA engineers traditionally spent their days writing kernels — the small pieces of code that tell a GPU how to do a single job as quickly as possible — and then testing them to find the fastest version. Now, AI is taking over much of that painstaking work by generating hundreds of kernels, testing them, and picking the best one. As a result, CUDA engineers increasingly spend their time supervising coding agents. It's part of a broader shift across the software industry, where developers are moving from writing code to managing AI . This involves setting goals, checking results, and stepping in when the AI gets stuck, said Jeremy Nixon, founder of the startup Infinity, which builds AI that optimizes chip software. Because AI can introduce \"bizarre\" bugs that humans wouldn't have written, the job of reviewing AI code has become \"more intense,\" said Anne Ouyang, cofounder of the AI infrastructure startup Standard Kernel. Despite the shift, hiring data suggests demand for CUDA engineers remains strong. While overall demand for software engineers is lower than in 2023, \"demand for some specialized skills, like CUDA, has grown,\" said Elena Magrini, head of global research at the labor market analytics firm Lightcast. And scarcity remains a challenge, even as AI has supercharged productivity, said Bing Xu, founder of the AI optimization startup INT21. That's because the deepest CUDA expertise was built over more than 20 years, long before AI sent demand soaring. \"In the past, we couldn't hire enough good-quality CUDA engineers, and now AI is filling the gap,\" Xu said. CUDA engineer jobs are evolving CUDA engineering roles exist both inside and o", "date_str": "2026-10-02T09:00:01+00:00", "hash": "bc116b297d63ba37", "title_fa": "هوش مصنوعی کار پر زحمت ترین مهندسان سیلیکون ولی را به عهده می گیرد", "summary_fa": "مخترع CUDA، ایان باک، معاون رئیس بخش هایپرمقیاس و محاسبات با عملکرد بالا در انویدیا. مهندسان GTC CUDA کدنویسان نخبه ای هستند که سرعت را از تراشه های انویدیا کم می کنند. هوش مصنوعی در حال تغییر شکل شغل است زیرا تقاضا برای تخصص کمیاب همچنان در حال رشد است. هوش مصنوعی به زودی می‌تواند کد CUDA را بنویسد که انسان‌ها می‌توانند آن‌ها را تأیید کنند اما به طور کامل آن را درک نمی‌کنند. برای سال‌ها، مهندسان CUDA که تراشه‌های انویدیا را بهینه‌سازی می‌کنن
