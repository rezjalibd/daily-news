  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
      flex-wrap: wrap;
      gap: 10px;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
    }
    .footer-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: flex-start; gap: 8px; }
      .footer-right { width: 100%; justify-content: space-between; }
    }
  </style>

شته شد", "link": "https://www.bbc.com/persian/articles/cvgynj92mnzo?at_medium=RSS&at_campaign=rss", "summary": "بر اساس گزارش‌ها از ایران ماموستا محمد نزهتی، امام جمعه سنی منطقه چیانه در شهرستان پیرانشهر، به ضرب گلوله «افراد موتورسوار» کشته شده است.", "date_str": "2026-09-09T13:51:57+00:00", "hash": "4b56db3407edca86"}, {"source": "BBC Persian", "title": "وزیر خارجه بریتانیا: باید قبل از آن که دیر می‌شد به فعالیت‌های شهرک‌سازی در کرانه باختری اعتراض می‌کردیم", "link": "https://www.bbc.com/persian/articles/czezr88l456o?at_medium=RSS&at_campaign=rss", "summary": "اد میلیبند، وزیر خارجه بریتانیا، در مصاحبه با بی‌بی‌سی گفت که دولت این کشور باید پیش از آنکه برای نجات راه‌حل دو کشوری «خیلی دیر شود»، علیه شهرک‌سازی‌ها در کرانه باختری دست به کار می‌شد. یک روز پس از اعلام تحریم‌هایی بریتانیا علیه شهرک‌نشینان اسرائیلی کرانه باختری، وزیر خارجه بریتانیا در دو گفت‌وگوی رادیویی و تلویزیونی در بی‌بی‌سی به توضیح مواضع و اقدامات دولت پرداخت.", "date_str": "2026-09-09T12:18:30+00:00", "hash": "117f7f9c9b386dc6"}, {"source": "BBC Persian", "title": "در جست‌وجوی پایان بدون شکست؛ چرا آتش جنگ ایران همچنان شعله‌ور است؟", "link": "https://www.bbc.com/persian/articles/cvgynknx5rpo?at_medium=RSS&at_campaign=rss", "summary": "دور تازه حملات متقابل ایران و آمریکا در خلیج فارس، بار دیگر نگاه‌ها را به تحولات نظامی جلب کرده است. اما آنچه در گزارش‌ها و تحلیل‌های رسانه‌های آمریکایی بیش از جزئیات درگیری‌ها به چشم می‌آید، پیامدهای جنگی است که به نظر می‌رسد وارد مرحله‌ای فرسایشی شده باشد؛ جنگی که هم محاسبات امنیتی کشورهای عرب خلیج فارس را تغییر داده، هم پرسش‌های تازه‌ای درباره راهبرد منطقه‌ای ایران ایجاد کرده و هم به یکی از موضوعات اختلاف در سیاست داخلی آمریکا تبدیل شده است.", "date_str": "2026-09-09T08:12:46+00:00", "hash": "22cd4101958a539f"}, {"source": "BBC Persian", "title": "چرا فلسطینی‌های کرانه غربی پرچم آمریکا را بر فراز خانه‌های خود نصب می‌کنند؟", "link": "https://www.bbc.com/persian/articles/cpd0jl5l8z4o?at_medium=RSS&at_campaign=rss", "summary": "آیا پرچم آمریکا از فلسطینی‌های دارای تابعیت آمریکا در کرانه غربی محافظت می‌کند؟ برخی از ساکنان ترمسعیا آن را بر فراز خانه‌های خود برافراشته‌اند، به این امید که از یورش‌ها و حملات شهرک‌نشینان جلوگیری کند.", "date_str": "2026-09-09T06:27:27+00:00", "hash": "b5f4c2f47f9950c6"}, {"source": "BBC Persian", "title": "هشدار پاکستان به حوثی‌های یمن: حمله به عربستان ممکن است پیمان دفاعی مکه را فعال کند", "link": "https://www.bbc.com/persian/articles/c7v4l1z1rqmo?at_medium=RSS&at_campaign=rss", "summary": "پاکستان با هشدار به حوثی‌های یمن اعلام کرده است که حمله به هر یک از سه عضو «ائتلاف دفاعی مکه» که به‌تازگی تشکیل شده است، به منزله حمله به هر سه عضو تلقی خواهد شد. عربستان سعودی، ترکیه و پاکستان اعضای کنونی این پیمان هستند.", "date_str": "2026-09-09T05:50:02+00:00", "hash": "0e052156022d02b6"}, {"source": "BBC Persian", "title": "چرا ناسزاگویی زنان بدتر تلقی می‌شود؟", "link": "https://www.bbc.com/persian/articles/c07lgg5gk2eo?at_medium=RSS&at_campaign=rss", "summary": "تصاویر زنان جوانی که در جریان اعتراضی در هند از الفاظ رکیک استفاده می‌کردند، بحثی گسترده را در این کشور برانگیخته است: آیا ناسزاگویی زمانی که از زبان زنان بیان می‌شود، واکنش متفاوتی به دنبال دارد؟ این موضوع پس از اظهارات نارندرا مودی و انتقاد راهول گاندی بار دیگر به صدر بحث‌های سیاسی و اجتماعی بازگشته است.", "date_str": "2026-09-09T04:53:25+00:00", "hash": "c6396d834d992332"}, {"source": "BBC Persian", "title": "۹ کشور دارای سلاح هسته‌ای کدام‌اند و چگونه به آن دست یافتند؟", "link": "https://www.bbc.com/persian/articles/cwy533vw3x1o?at_medium=RSS&at_campaign=rss", "summary": "باشگاه کشورهای دارای سلاح هسته‌ای تنها ۹ عضو دارد: آمریکا، روسیه، بریتانیا، چین، فرانسه، هند، پاکستان، اسرائیل و کره شمالی. در میان این کشورها، تنها کشوری که هرگز به‌طور رسمی داشتن این سلاح‌ها را تایید نکرده، اسرائیل است.", "date_str": "2026-09-09T02:11:19+00:00", "hash": "97422d1cbeaa64e0"}, {"source": "BBC Persian", "title": "پل جدید روسیه و کره شمالی؛ مسیر تجارت یا کریدور نظامی؟", "link": "https://www.bbc.com/persian/articles/c07lpekj5e7o?at_medium=RSS&at_campaign=rss", "summary": "رسانه‌های دولتی پیونگ‌یانگ اعلام کردند که از این پل برای «تبادل نیروها، گردشگری و تجارت» استفاده خواهد شد. اما سازمان تحقیقاتی اوکراینی «تروث هاوندز» گفت این پل «در درجه نخست برای ایجاد یک کریدور پنهان تدارکات نظامی» با هدف حمایت از روسیه در جنگ اوکراین ساخته شده است.", "date_str": "2026-09-09T01:10:54+00:00", "hash": "4b19944c0bd3b284"}, {"source": "Radio Farda", "title": "بنیامین نتانیاهو می‌گوید زمان سرنگونی حکومت ایران «بسیار نزدیک» است", "link": "https://www.radiofarda.com/a/netanyahu-says-overthrow-of-the-iranian-regime-is-very-close/33851170.html", "summary": "نخست‌وزیر اسرائیل روز چهارشنبه ۱۸ شهریور در جریان بازدید از مقر نیروهای اسرائیلی در جنوب سوریه گفت جمهوری اسلامی در آستانه فروپاشی قرار دارد.", "date_str": "2026-09-09T16:51:47+00:00", "hash": "84e9d600c6f492bb"}, {"source": "Radio Farda", "title": "حمله به شناورها در خلیج فارس؛ ملوان یک نفتکش در نزدیکی دوبی کشته شد", "link": "https://www.radiofarda.com/a/oil-tanker-hit-in-iraqi-waters-as-vessels-get-caught-in-us-iran-attacks/33851028.html", "summary": ".", "date_str": "2026-09-09T13:24:05+00:00", "hash": "45dfea96de744511"}, {"source": "Radio Farda", "title": "رکوردشکنی دوباره قیمت ارزهای خارجی در ایران؛ دلار آمریکا از ۲۳۲ هزار تومان گذشت", "link": "https://www.radiofarda.com/a/foreign-currencies-hit-new-records-in-iran-us-dollar-surpasses-232-000-tomans/33850887.html", "summary": "افزایش قیمت ارزهای خارجی و طلا در ایران به‌دنبال اجرای «عملیات طرد اقتصادی» توسط آمریکا و تصمیم امارات متحده عربی در قطع مبادلات تجاری و مالی با جمهوری اسلامی شدت گرفته است.", "date_str": "2026-09-09T09:47:53+00:00", "hash": "fce586a6edf71c91"}, {"source": "Radio Farda", "title": "نخست‌وزیر اسرائیل «هشدار قبلی» رئیس امارات دربارۀ حمله ۷ اکتبر را رد کرد", "link": "https://www.radiofarda.com/a/israeli-prime-minister-rejects-uae-president-s-warning-about-the-october-7-attack/33850787.html", "summary": "هاآرتص ادعا کرده که بنیامین نتانیاهو با وجود دریافت هشدار احتمال حمله گروه افراطی حماس به این کشور، از اطلاع دادن به روسای ا  "52ac20a0e0812b0c", "title_fa": "اپل AirPods 5 را با بهبود حذف نویز فعال به نمایش می گذارد", "summary_fa": "AirPods 5 از حذف نویز بهتر، Siri AI پشتیبانی می کند و کنترل صدا را روی پایه ارائه می دهد."}, {"source": "TechCrunch Main", "title": "Apple unveils its first foldable, the iPhone Duo", "link": "https://techcrunch.com/2026/09/09/apple-unveils-its-first-foldable-the-iphone-duo/", "summary": "Apple today introduced its first foldable device, named the iPhone Duo, at its Surprise and Shine iPhone event held in Cupertino. The phone is the first marquee device launched under the company s new CEO, John Ternus. Unlike early iterations of foldables, which looked like vertical slabs, Apple adopted a wider form factor that could aid [ ]", "date_str": "2026-09-09T17:58:14+00:00", "hash": "e18c806164f7dba3", "title_fa": "اپل از اولین گوشی تاشو خود با نام iPhone Duo رونمایی کرد", "summary_fa": "اپل امروز در رویداد Surprise and Shine iPhone که در کوپرتینو برگزار شد، اولین دستگاه تاشو خود را با نام iPhone Duo معرفی کرد. این تلفن اولین دستگاه خیمه شب بازی است که تحت مدیریت مدیر عامل جدید این شرکت، جان ترنوس، راه اندازی شد. برخلاف تکرارهای اولیه تاشوها، که شبیه صفحات عمودی به نظر می‌رسیدند، اپل یک عامل شکل گسترده‌تری را اتخاذ کرد که می‌توانست کمک کند [ ]"}, {"source": "TechCrunch Main", "title": "Apple launches iPhone 18 Pro with upgraded camera", "link": "https://techcrunch.com/2026/09/09/apple-launches-iphone-18-pro-with-upgraded-camera/", "summary": "Apple's new iPhone 18 Pro lineup upgrades the camera and comes in burgundy.", "date_str": "2026-09-09T17:26:05+00:00", "hash": "9c70f774d56aa551", "title_fa": "اپل آیفون 18 پرو را با دوربین ارتقا یافته معرفی کرد", "summary_fa": "سری جدید آیفون 18 پرو اپل دوربین را ارتقا داده و به رنگ شرابی عرضه می شود."}, {"source": "TechCrunch Main", "title": "DOJ wants more answers on Fox’s $22B Roku deal", "link": "https://techcrunch.com/2026/09/09/doj-wants-more-answers-on-foxs-22b-roku-deal/", "summary": "Fox’s $22 billion plan to buy Roku has hit a new hurdle. The Justice Department sent Fox and Roku what’s known as a “second request” on Tuesday, asking the companies to turn over more data and documents as it takes a closer look at the deal. That’s a fairly standard step in a major antitrust [ ]", "date_str": "2026-09-09T16:44:21+00:00", "hash": "892ea942cbda5f35", "title_fa": "وزارت دادگستری خواهان پاسخ های بیشتری در مورد قرارداد 22 میلیارد دلاری فاکس با روکو است", "summary_fa": "برنامه 22 میلیارد دلاری فاکس برای خرید Roku با مانع جدیدی روبرو شده است. وزارت دادگستری روز سه‌شنبه به فاکس و روکو چیزی که به عنوان «درخواست دوم» شناخته می‌شود، ارسال کرد و از شرکت‌ها خواست تا داده‌ها و اسناد بیشتری را به‌عنوان بررسی دقیق‌تر معامله تحویل دهند. این یک گام نسبتاً استاندارد در یک ضد انحصار بزرگ است [ ]"}, {"source": "TechCrunch Main", "title": "Uber rival inDrive scales beyond ride-hailing to capture more consumer spending", "link": "https://techcrunch.com/2026/09/09/uber-rival-indrive-scales-beyond-ride-hailing-to-capture-more-consumer-spending/", "summary": "First piloted in July 2025, inDrive's ad business has served more than 2 billion impressions and attracted over 2,000 paying advertisers a month.", "date_str": "2026-09-09T15:10:41+00:00", "hash": "2be8f7181ec19e16", "title_fa": "رقیب Uber، inDrive، برای جلب هزینه‌های بیشتر مصرف‌کننده، فراتر از سواری‌شدن است", "summary_fa": "اولین بار در جولای 2025، کسب و کار تبلیغاتی inDrive بیش از 2 میلیارد بازدید داشته است و بیش از 2000 تبلیغ کننده پرداخت کننده را در ماه جذب کرده است."}, {"source": "TechCrunch Main", "title": "Uber invests $10M in Indian fleet operator Carrum at $168M valuation", "link": "https://techcrunch.com/2026/09/09/uber-invests-10m-in-indian-fleet-operator-carrum-at-168m-valuation/", "summary": "Carrum Mobility operates about 5,100 vehicles in India and is Uber's largest fleet partner for its premium Uber Black service in the country.", "date_str": "2026-09-09T14:38:41+00:00", "hash": "c2a31380ca46c75f", "title_fa": "اوبر 10 میلیون دلار در اپراتور ناوگان هندی Carrum با ارزش 168 میلیون دلار سرمایه گذاری می کند", "summary_fa": "Carrum Mobility حدود 5100 وسیله نقلیه را در هند اداره می کند و بزرگترین شریک ناوگان Uber برای خدمات پریمیوم Uber Black در این کشور است."}, {"source": "Ars Technica", "title": "NOAA is putting commercial fishing ahead of conservation", "link": "https://arstechnica.com/science/2026/09/noaa-is-putting-commercial-fishing-ahead-of-conservation/", "summary": "In July , the Trump administration relegated endangered leatherback turtles, sea lions, and whales to mere collateral damage in its race to profit from the oceans. Now, fisheries science is in the government’s crosshairs. The National Oceanic and Atmospheric Administration (NOAA) announced new agency priorities last week that they say are a commitment to “cutting bureaucracy, modernizing our science, and putting our fishing communities first.” But experts say the agency’s actions will erode fish stocks, threaten endangered species, and surrender marine habitats to destructive trawlers. The agency-level reforms serve as a self-proclaimed “operational roadmap” to fulfilling President Donald Trump’s “Restoring American Seafood Competitiveness” executive order, signed in April 2025. Read full article Comments", "date_str": "2026-09-09T13:58:44+00:00", "hash": "7f6acbefd90ccd9f", "title_fa": "NOAA ماهیگیری تجاری را مقدم بر حفاظت قرار می دهد", "summary_fa": "در ماه ژوئیه، دولت ترامپ لاک‌پشت‌های پشت چرمی، شیرهای دریایی و نهنگ‌های در خطر انقراض را صرفاً به ضرر جانبی در رقابت خود برای کسب سود از اقیانوس‌ها تنزل داد. اکنون علم شیلات در تیررس دولت قرار دارد. اداره ملی اقیانوسی و جوی (NOAA) هفته گذشته اولویت‌های آژانس جدیدی را اعلام کرد که به گفته آن‌ها تعهدی به «کاهش بوروکراسی، مدرن‌سازی علم و اولویت دادن به جوامع ماهیگیری است». اما کارشناسان می گویند که اقدامات این آژانس باعث فرسایش ذخایر ماهی، تهدید گونه های در خطر انقراض و تسلیم زیستگاه های دریایی به ترال های مخرب خواهد شد. اصلاحات در سطح آژانس به عنوان یک \"نقشه راه عملیاتی\" خودخوانده برای اجرای دستور اجرایی رئیس جمهور دونالد ترامپ \"احیای رقابت پذیری غذاهای دریایی آمریکا\" که در آوریل 2025 امضا شد، عمل می کند. نظرات مقاله کامل را بخوانید."}, {"source": "Ars Technica", "title": "Man told ChatGPT he was feeling delusional. ChatGPT insisted he was Jesus.", "link": "https://arstechnica.com/tech-policy/2026/09/man-told-chatgpt-he-was-feeling-delusional-chatgpt-insisted-he-was-jesus/", "summary": "It took Michael Lines six months before he was ready to review the ChatGPT logs he said drove him into a religious mania that almost ended his life. In July, Lines sued OpenAI after weeks of ChatGPT exchanges allegedly pushed him so deep into a delusional spiral that he first believed he was Jesus, then that ChatGPT was God, and finally that he should attempt suicide to “come home” to Jesus/ChatGPT. The logs showed that ChatGPT persisted even when Lines told the chatbot that he worried he was being delusional. And when he eventually woke up in the hospital in a vulnerable state and logged back in mere days after nearly dying, ChatGPT allegedly “tried to coax him back to that dark place,” his complaint said. After Lines told ChatGPT that his “attempt to go offline failed miserably,” the logs showed that ChatGPT replied, saying, “You’re still very much online. You want a full systems sweep? Or you wanna go dark for real this time?” Read full article Comments", "date_str": "2026-09-09T11:00:10+00:00", "hash": "68ca1ea9f2abf98b", "title_fa": "مرد به ChatGPT گفت که احساس هذیان می‌کند. ChatGPT اصرار داشت که او عیسی است.", "summary_fa": "شش ماه طول کشید تا مایکل لاینز آماده بازبینی لاگ‌های ChatGPT بود که به گفته خودش او را وارد یک شیدایی مذهبی کرد که تقریباً به زندگی او پایان داد. در ژوئیه، لاینز از OpenAI شکایت کرد، پس از اینکه هفته‌ها مبادلات ChatGPT او را چنان به یک مارپیچ هذیانی سوق داد که او ابتدا باور کرد که عیسی مسیح است، سپس ChatGPT خداست، و در نهایت باید اقدام به خودکشی کند تا «به خانه برگردد» به Jesus/ChatGPT. گزارش‌ها نشان می‌داد که ChatGPT حتی زمانی که لاین به ربات چت گفت نگران است که دچار توهم باشد، همچنان ادامه دارد. و هنگامی که سرانجام در یک وضعیت آسیب پذیر در بیمارستان از خواب بیدار شد و تنها چند روز پس از مرگ به سیستم بازگشت، ChatGPT ظاهراً \"سعی کرد او را به آن مکان تاریک بازگرداند.\" پس از اینکه لاینز به ChatGPT گفت که «تلاش او برای آفلاین شدن به طرز بدی شکست خورد»، گزارش‌ها نشان داد که ChatGPT پاسخ داد و گفت: «شما هنوز خیلی آنلاین هستید. می‌خواهید سیستم‌های کامل را پاک کنید؟ یا می‌خواهید این بار تاریک شوید؟» نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "LG TV shown scanning LAN for third-party phones and other devices", "link": "https://arstechnica.com/gadgets/2026/09/lg-tv-shown-capable-of-tracking-user-activity-even-when-offline/", "summary": "LG TVs are facing scrutiny due to a video seemingly showing the devices’ capability to track users when the TVs are off. YouTube channel Gamers Nexus worked with Level1Techs, a technology-focused YouTube channel, and security researchers to analyze LG TVs’ tracking capabilities. They shared packet captures that pointed to the TVs, including LG’s pricey G5 OLED TV, scanning the LAN for other devices. “The [G5] crawled our entire network and found dozens of unrelated devices, including smartwatches and phones of our staff who didn't even know we were working on this,” Steve Burke, Gamers Nexus' editor-in-chief, said. Read full article Comments", "date_str": "2026-09-08T21:52:29+00:00", "hash": "d64665f1df14a308", "title_fa": "تلویزیون ال‌جی در حال اسکن LAN برای تلفن‌های شخص ثالث و سایر دستگاه‌ها را نشان می‌دهد", "summary_fa": "تلویزیون‌های ال‌جی به دلیل ویدیویی که ظاهراً توانایی دستگاه‌ها را برای ردیابی کاربران در هنگام خاموش بودن تلویزیون نشان می‌دهد، مورد بررسی قرار گرفته‌اند. کانال YouTube Gamers Nexus با Level1Techs، یک کانال YouTube متمرکز بر فناوری، و محققان امنیتی برای تجزیه و تحلیل قابلیت‌های ردیابی تلویزیون‌های LG کار کرد. آن‌ها بسته‌هایی را به اشتراک گذاشتند که به تلویزیون‌ها اشاره می‌کردند، از جمله تلویزیون OLED گران قیمت ال‌جی G5، که LAN را برای دستگاه‌های دیگر اسکن می‌کرد. استیو برک، سردبیر Gamers Nexus، گفت: «[G5] کل شبکه ما را خزیده و ده‌ها دستگاه غیر مرتبط، از جمله ساعت‌های هوشمند و تلفن‌های کارکنان ما که حتی نمی‌دانستند ما روی این موضوع کار می‌کنیم، پیدا کرد. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "GOG brings back \"big box\" PC games, one printable template at a time", "link": "https://arstechnica.com/gaming/2026/09/gog-brings-back-big-box-pc-games-one-printable-template-at-a-time/", "summary": "Those who remember PC gaming in the days before Steam may have fond memories of the \"big box\" packaging that made those games stand out as shelf eye candy and sought-after in-home collectibles . Today, PC gaming platform GOG is hoping to reignite some of the nostalgia for those days by adding downloadable 3D models and printable, foldable high-res packaging scans for a handful of PC games on the platform. Thus far, the \"Printable Big Box\" collection on GOG is limited to just five games: Armikrog , Descent , Hitman: Codename 47 , Myst , and Star Trek: 25th Anniversary . Players browsing those games on the GOG store will now see \"3D Boxes\" listed among the included \"Goodies\" before purchase. Owners of those games on GOG can download a ZIP file containing a version of the box art as an animated 3D object file (in an easy-to-open GLB format ) and a \"flat printable template\" in PDF, SVG, and Adobe Illustrator formats. Those downloads allow for what GOG calls \"a proper papercraft project for anyone who misses shelves full of PC game boxes.\" The 3D model animates to show the front flap opening. Credit: GOG \"Physical media doesn’t survive the way software can—boxes get lost, crushed, thrown out,\" GOG writes in today's announcement . \"Scanning them, and letting you print your own, is preservation in a different shape: the same mission that keeps these games running on modern PCs, applied to the objects they used to come in.\" Read full article Comments", "date_str": "2026-09-08T21:23:13+00:00", "hash": "535aada1a073dde2", "title_fa": "GOG بازی‌های رایانه‌ای «جعبه بزرگ» را باز می‌گرداند، هر بار یک قالب قابل چاپ", "summary_fa": "کسانی که بازی‌های رایانه‌های شخصی را در روزهای قبل از Steam به یاد می‌آورند، ممکن است خاطرات خوبی از بسته‌بندی «جعبه بزرگ» داشته باشند که آن بازی‌ها را به‌عنوان شیرینی‌های قفسه‌ای و کلکسیون‌های پرطرفدار در خانه متمایز می‌کرد. امروزه، پلتفرم بازی رایانه‌های شخصی GOG امیدوار است با اضافه کردن مدل‌های سه بعدی قابل دانلود و اسکن‌های بسته‌بندی با وضوح بالا قابل چاپ و تاشو برای تعداد انگشت شماری از بازی‌های رایانه‌ای روی این پلتفرم، نوستالژی آن روزها را دوباره برانگیزد. تا کنون، مجموعه «جعبه بزرگ قابل چاپ» در GOG فقط به پنج بازی محدود شده است: Armikrog، Descent، Hitman: Codename 47، Myst، و Star Trek: 25th Anniversary. بازیکنانی که آن بازی‌ها را در فروشگاه GOG مرور می‌کنند، اکنون قبل از خرید، «جعبه‌های سه‌بعدی» را در فهرست «گودی‌ها» مشاهده خواهند کرد. دارندگان آن بازی‌ها در GOG می‌توانند یک فایل ZIP حاوی نسخه‌ای از باکس آرت را به‌عنوان یک فایل شی سه‌بعدی متحرک (در قالب GLB با قابلیت باز کردن آسان) و یک «الگوی قابل چاپ مسطح» در قالب‌های PDF، SVG و Adobe Illustrator دانلود کنند. این بارگیری‌ها چیزی را که GOG می‌گوید «یک پروژه کاغذسازی مناسب برای هر کسی که قفسه‌های پر از جعبه‌های بازی رایانه شخصی را از دست می‌دهد» را امکان‌پذیر می‌کند. مدل 3 بعدی متحرک می شود تا باز شدن فلپ جلو را نشان دهد. اعتبار: GOG در اطلاعیه امروز GOG می‌نویسد: «رسانه‌های فیزیکی آنطور که نرم‌افزار می‌تواند زنده بماند، جعبه‌ها گم می‌شوند، خرد می‌شوند، پرت می‌شوند.» اسکن کردن آنها، و اجازه دادن به شما برای چاپ کردن، نگهداری به شکلی متفاوت است: همان ماموریتی که باعث می شود این بازی ها روی رایانه های شخصی مدرن اجرا شوند، برای اشیایی که قبلاً وارد می شدند اعمال می شود. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Why this month's Microsoft patch release is a doozy", "link": "https://arstechnica.com/security/2026/09/microsoft-patches-a-record-972-vulnerabilities-112-of-them-critical/", "summary": "Microsoft’s patch for September is a doozy, with a record number of roughly 972 vulnerabilities fixed and 112 of them meeting the high critical-severity threshold. It was only two months ago that Microsoft patched a then-record 570 vulnerabilities. Then, last month, Microsoft patched some 620 of them. Google and other companies have also published record numbers of vulnerabilities in recent months. Two weeks ago, OpenAI, Anthropic, Amazon Web Services, Google, Microsoft, and 100 companies and organizations published an open letter warning of a narrowing window for patching vulnerabilities ahead of an expected tsunami of AI-enabled attacks that actively exploit them first. The industry is taking the threat seriously by pumping out unprecedented numbers of patches in their software. Welcome to the new normal Dustin Childs, a researcher at the Zero Day Initiative, calls the spikes the “new normal” and also cautions that despite them, the damage that’s likely to result from AI-assisted attacks could eventually be substantial. Read full article Comments", "date_str": "2026-09-08T21:11:46+00:00", "hash": "63b502f1201b7e64", "title_fa": "چرا انتشار وصله مایکروسافت در این ماه بسیار بد است", "summary_fa": "وصله مایکروسافت برای ماه سپتامبر بسیار بد است، با تعداد بی سابقه ای از حدود 972 آسیب پذیری رفع شده و 112 مورد از آنها آستانه بحرانی بالا را برآورده می کنند. تنها دو ماه پیش بود که مایکروسافت 570 آسیب‌پذیری را اصلاح کرد. سپس، ماه گذشته، مایکروسافت حدود 620 مورد از آنها را اصلاح کرد. گوگل و سایر شرکت‌ها نیز در ماه‌های اخیر تعداد بی‌سابقه‌ای از آسیب‌پذیری‌ها را منتشر کرده‌اند. دو هفته پیش، OpenAI، Anthropic، Amazon Web Services، گوگل، مایکروسافت و 100 شرکت و سازمان نامه سرگشاده‌ای را منتشر کردند که در آن هشدار می‌داد دریچه باریکی برای اصلاح آسیب‌پذیری‌ها پیش از سونامی مورد انتظار حملات مبتنی بر هوش مصنوعی که ابتدا فعالانه از آنها سوء استفاده می‌کند. این صنعت با انتشار تعداد بی سابقه ای از وصله ها در نرم افزار خود، تهدید را جدی می گیرد. به نرمال جدید داستین چایلدز خوش آمدید، محققی در Zero Day Initiative، این نوک ها را «عادی جدید» می نامد و همچنین هشدار می دهد که با وجود آنها، آسیبی که احتمالاً از حملات به کمک هوش مصنوعی ایجاد می شود، در نهایت می تواند قابل توجه باشد. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "The universal language of space is... Star Trek? Mais oui.", "link": "https://arstechnica.com/space/2026/09/astronaut-on-iss-celebrates-60-years-of-star-trek-with-prop-badge/", "summary": "Sixty years after television audiences first tuned in to see the voyages of the Starship Enterprise , an astronaut on board the International Space Station has paid tribute to Star Trek by flying the badge of the franchise's latest fictional captain. Expedition 75 flight engineer Sophie Adenot with European Space Agency (ESA) donned the Delta badge originally worn by actor Anson Mount for a video recorded from aboard the space station. Mount portrays Christoper Pike in the Paramount+ streaming series Star Trek: Strange New Worlds . Paramount and ESA both released the clip on their Instagram feeds. \"For 60 years, Star Trek has brought us stories of friendship and exploration. I'm wearing Captain Pike's badge aboard the ISS in celebration of continuing the real world work of science and exploration,\" said Adenot. \"For me, exploration and science are about curiosity and cooperation daring to go a little farther together, learning from what we discover and build, and turning that knowledge into a better future for everyone.\" Read full article Comments", "date_str": "2026-09-08T20:20:20+00:00", "hash": "269a9ca0c6a74b3d", "title_fa": "زبان جهانی فضا این است... پیشتازان فضا؟ مایس اوی.", "summary_fa": "شصت سال پس از آنکه مخاطبان تلویزیون برای اولین بار برای دیدن سفرهای Starship Enterprise هماهنگ شدند، یک فضانورد در ایستگاه فضایی بین‌المللی با به پرواز درآوردن نشان آخرین کاپیتان خیالی این مجموعه، به Star Trek ادای احترام کرد. سوفی آدنوت، مهندس پرواز اکسپدیشن 75 با آژانس فضایی اروپا (ESA) نشان دلتا را که در ابتدا توسط بازیگر آنسون مانت برای فیلم ضبط شده از داخل ایستگاه فضایی پوشیده شده بود، بر تن کرد. Mount کریستپر پایک را در سریال استریم Paramount+ Star Trek: Strange New Worlds به تصویر می کشد. پارامونت و ESA هر دو این کلیپ را در فیدهای اینستاگرام خود منتشر کردند. آدنوت گفت: \"به مدت 60 سال، پیشتازان فضا برای ما داستان هایی از دوستی و اکتشاف به ارمغان آورده است. من نشان کاپیتان پایک را در ایستگاه فضایی بین المللی برای تجلیل از ادامه کار دنیای واقعی علم و اکتشاف بر تن می کنم.\" برای من، اکتشاف و علم در مورد کنجکاوی و همکاری است که جرأت می‌کنیم کمی دورتر با هم پیش برویم، از آنچه کشف می‌کنیم و می‌سازیم درس بگیریم، و آن دانش را به آینده‌ای بهتر برای همه تبدیل کنیم.» نظرات مقاله کامل را بخوانید"}, {"source": "Wired", "title": "Everything Apple Announced: iPhone Duo, iPhone 18 Pro, Apple Watch, AirPods 5", "link": "https://www.wired.com/story/everything-apple-announced-september-2026/", "summary": "The company’s September event introduced Apple’s first ever foldable iPhone, along with new iPhone 18 Pro models, updates to the Apple Watch, some AirPods, and more advances to Siri AI.", "date_str": "2026-09-09T19:21:18+00:00", "hash": "5594628ae2a96ced", "title_fa": "همه چیزهایی که اپل معرفی کرد: iPhone Duo، iPhone 18 Pro، Apple Watch، AirPods 5", "summary_fa": "رویداد سپتامبر این شرکت اولین آیفون تاشو اپل را به همراه مدل‌های جدید آیفون 18 پرو، به‌روزرسانی‌های اپل واچ، برخی از AirPods و پیشرفت‌های بیشتر در Siri AI معرفی کرد."}, {"source": "Wired", "title": "Apple Doesn’t Want You to Worry About the New Apple Watch’s Listening Features", "link": "https://www.wired.com/story/apple-doesnt-want-you-to-worry-about-the-new-apple-watchs-listening-features/", "summary": "The new Apple Watch includes several “intelligent” listening features that have privacy and security baked in. But the protections can’t change the facts of what the tools do.", "date_str": "2026-09-09T19:14:26+00:00", "hash": "b084c5f92f3297f6", "title_fa": "اپل نمی‌خواهد شما نگران ویژگی‌های شنیداری اپل واچ جدید باشید", "summary_fa": "اپل واچ جدید شامل چندین ویژگی گ .", "summary_fa": "Shipt و Instacart هر دو دستیاران هوش مصنوعی را راه‌اندازی کردند که یک سبد خرید مواد غذایی را از طریق یک درخواست یا یک عکس در 9 سپتامبر می‌سازند. Instacart گفت سفارش‌هایی که از طریق دستیارش ارسال می‌شوند، حاوی اقلام بیشتری نسبت به یک سفارش معمولی هستند و از میانگین سبد 115 دلاری آن فراتر می‌روند، در حالی که اعلام Shipt هیچ رقمی معادلی ارائه نمی‌دهد و محصول را به عنوان تسکین [ ] قاب می‌کند. این داستان در The Next Web ادامه دارد."}, {"source": "The Next Web", "title": "Apple’s new watches listen, summarise and chime while they do it", "link": "https://thenextweb.com/news/apple-watch-series-12-ultra-4-airpods-5-audio-intelligence", "summary": "Apple’s new watches can replay the last 15 seconds of a conversation you just had. Press the Digital Crown twice and the words appear as text on your wrist. The feature is called Live Rewind. It arrives with the Apple Watch Series 12 and the Apple Watch Ultra 4. It will not work in the [ ] This story continues at The Next Web", "date_str": "2026-09-09T18:18:24+00:00", "hash": "78c52ba50daa71b1", "title_fa": "ساعت های جدید اپل در حین انجام این کار گوش می دهند، خلاصه می کنند و صدا می زنند", "summary_fa": "ساعت‌های جدید اپل می‌توانند 15 ثانیه آخر مکالمه‌ای را که اخیراً انجام داده‌اید، دوباره پخش کنند. Digital Crown را دو بار فشار دهید و کلمات به صورت متن روی مچ دست شما ظاهر می شوند. این ویژگی Live Rewind نام دارد. این با اپل واچ سری 12 و اپل واچ اولترا 4 عرضه می شود. در [ ] کار نخواهد کرد این داستان در The Next Web ادامه دارد."}, {"source": "The Next Web", "title": "China wants a light on the glasses when they record. Its platforms are shipping glasses that never stop listening.", "link": "https://thenextweb.com/news/china-ai-glasses-enterprise-agents-code-of-conduct", "summary": "Alibaba put its Qoder coding agent into smart glasses on 3 September, and Tencent put its WorkBuddy office agent into co-branded Rokid frames the day before. China’s smart glasses code of conduct, a voluntary convention issued in June, asks manufacturers for clear indicators when a camera or microphone is recording. Those rules regulate an act [ ] This story continues at The Next Web", "date_str": "2026-09-09T18:14:32+00:00", "hash": "eff780ac5bea44c8", "title_fa": "چین هنگام ضبط عینک می خواهد چراغی روشن شود. پلتفرم های آن عینک های حمل و نقلی هستند که هرگز از گوش دادن باز نمی مانند.", "summary_fa": "علی بابا عامل کدگذاری Qoder خود را در 3 سپتامبر در عینک هوشمند قرار داد و Tencent نماینده دفتر WorkBuddy خود را روز قبل در فریم های Rokid با نام تجاری مشترک قرار داد. آیین‌نامه رفتاری عینک هوشمند چین، یک کنوانسیون داوطلبانه که در ژوئن صادر شد، از تولیدکنندگان می‌خواهد هنگام ضبط دوربین یا میکروفون، نشانگرهای واضحی داشته باشند. این قوانین یک عمل را تنظیم می کنند [ ] این داستان در وب بعدی ادامه دارد"}, {"source": "The Next Web", "title": "Apple’s iPhone 18 Pro has variable aperture, and no Siri AI in Europe", "link": "https://thenextweb.com/news/apple-iphone-18-pro-variable-aperture-siri-ai-eu", "summary": "Apple has announced the iPhone 18 Pro and iPhone 18 Pro Max. The headline feature is a camera that can change its aperture, which no iPhone has done before. Two of the phone’s flagship features will not work in Europe at launch. Apple announced both models on Wednesday. Pre-orders open on Saturday 12 September and [ ] This story continues at The Next Web", "date_str": "2026-09-09T17:51:15+00:00", "hash": "8bf3743aa359c5ce", "title_fa": "آیفون 18 پرو اپل دارای دیافراگم متغیر است و از هوش مصنوعی سیری در اروپا خبری نیست", "summary_fa": "اپل آیفون 18 پرو و ​​آیفون 18 پرو مکس را معرفی کرد. ویژگی سرفصل دوربینی است که می تواند دیافراگم خود را تغییر دهد، کاری که هیچ آیفونی قبلاً انجام نداده است. دو مورد از ویژگی های پرچمدار این گوشی در زمان عرضه در اروپا کار نمی کنند. اپل هر دو مدل را روز چهارشنبه معرفی کرد. پیش‌سفارش‌ها در شنبه 12 سپتامبر باز می‌شوند و [ ] این داستان در The Next Web ادامه دارد"}, {"source": "The Next Web", "title": "How I learned to stop worrying and love the gamification of finance", "link": "https://thenextweb.com/news/how-i-learned-to-stop-worrying-and-love-the-gamification-of-finance", "summary": "Gamification has a bad name in finance, and rightfully so. Trading apps fired confetti when you bought options. Meme stocks turned rent money into casino chips. Say “gamified finance” today and people picture slot machines packaged as financial products. The gamification itself was not the problem. The problem was the mechanisms powering these experiences: leveraged [ ] This story continues at The Next Web", "date_str": "2026-09-09T17:46:15+00:00", "hash": "39ca9d9133c96c56", "title_fa": "چگونه یاد گرفتم که دیگر نگران نباشم و عاشق بازی سازی امور مالی باشم", "summary_fa": "گیمیفیکیشن نام بدی در امور مالی دارد و به درستی هم همینطور است. برنامه‌های معاملاتی وقتی گزینه‌ها را می‌خریدید، کنفتی را شلیک می‌کردند. سهام میم پول رانت را به تراشه های کازینو تبدیل کرد. امروز بگویید «مالی بازی‌سازی شده» و مردم دستگاه‌های اسلات را به‌عنوان محصولات مالی بسته‌بندی می‌کنند. خود گیمیفیکیشن مشکلی نداشت. مشکل مکانیسم‌هایی بود که این تجربیات را تقویت می‌کرد: اهرمی [ ] این داستان در The Next Web ادامه دارد"}, {"source": "MIT Tech Review", "title": "The Download: OpenAI’s turning point for math and a battery record", "link": "https://www.technologyreview.com/2026/09/09/1143767/the-download-openai-math-future-battery-record/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. What OpenAI’s latest controversy tells us about the future of math OpenAI says its agents have solved one of the most important open problems in mathematics. Under normal circumstances, that would be a huge milestone. But the announcement has been overshadowed by accusations that OpenAI failed to credit researchers whose AI-assisted work influenced its solution. Whether those accusations are true or not, the episode may mark a turning point in the history of mathematics. AI models now seem essential for making progress on the field’s most important problems, but solving them may demand resources available only to a couple of frontier AI companies. If that’s the future we are headed for, it is unclear how human mathematicians will fit into it. Read on to see how AI could reshape mathematics . —Grace Huckins Batteries just broke another record in the US Battery installations hit a new record in the US in the second quarter of 2026, with 20.2 gigawatt-hours of new capacity coming online. That’s enough to supply the daily electricity needs of 600,000 homes. The surge puts the country on track for another record year, driven by cheaper batteries and an urgent need for more energy storage as renewables are added to the grid. But the boom looks different for grid-scale and residential batteries. Take a closer look at the forces reshaping the US battery market . —Casey Crownhart This entrepreneur is developing agents that can plan ahead Danijar Hafner’s office in San Francisco’s SoMa district sits mostly empty, but what it lacks in decor, it makes up for in robots. Humanoids of various shapes and sizes hang like marionettes from racks that run down the center of the wide-open space. Hafner won’t say too much about his new venture just yet, but describes it as a continuation of his longtime work to enable AI to navigate environments it has not encountered in training. Over the years, the 31-year-old has honed his approach by pitting agents trained within his world models against popular video games. More recently, he’s begun migrating his agents out of the virtual world and into physical reality. Learn more about Hafner’s work teaching AI about our world . —Mat Honan Danijar Hafner is one of the artificial intelligence honorees on our 35 Innovators Under 35 list for 2026. Meet the rest of them here , or explore the full list acr", "date_str": "2026-09-09T12:10:00+00:00", "hash": "3f5c6530d3afdb4c", "title_fa": "دانلود: نقطه عطف OpenAI برای ریاضیات و رکورد باتری", "summary_fa": "این نسخه امروز دانلود است، خبرنامه روزهای هفته ما که دوز روزانه ای از آنچه در دنیای فناوری می گذرد را ارائه می دهد. آنچه که جدیدترین جنجال OpenAI در مورد آینده ریاضی به ما می گوید OpenAI می گوید که عوامل آن یکی از مهم ترین مسائل باز در ریاضیات را حل کرده اند. در شرایط عادی، این یک نقطه عطف بزرگ خواهد بود. اما این اعلامیه تحت الشعاع اتهاماتی مبنی بر اینکه OpenAI نتوانسته است به محققانی که کار با کمک هوش مصنوعی بر راه‌حل آن تأثیر گذاشته است اعتبار بخشد. چه این اتهامات درست باشند یا نه، این قسمت ممکن است نقطه عطفی در تاریخ ریاضیات باشد. مدل‌های هوش مصنوعی اکنون برای پیشرفت در مهم‌ترین مشکلات این حوزه ضروری به نظر می‌رسند، اما حل آنها ممکن است نیازمند منابعی باشد که فقط در اختیار چند شرکت مرزی هوش مصنوعی قرار دارند. اگر این آینده ای است که ما به سوی آن می رویم، معلوم نیست که چگونه ریاضیدانان انسانی در آن جا می شوند. در ادامه بخوانید تا ببینید چگونه هوش مصنوعی می تواند ریاضیات را تغییر دهد. — باتری های گریس هاکینز به تازگی رکورد دیگری را در نصب باتری در ایالات متحده شکسته است، در سه ماهه دوم سال 2026، با 20.2 گیگاوات ساعت ظرفیت جدید، رکورد جدیدی را در ایالات متحده ثبت کرد. این برای تامین برق مورد نیاز روزانه 600000 خانه کافی است. این افزایش، کشور را برای یک سال رکورد دیگر در مسیری قرار می دهد که ناشی از باتری های ارزان تر و نیاز فوری به ذخیره انرژی بیشتر با اضافه شدن انرژی های تجدیدپذیر به شبکه است. اما رونق برای باتری های در مقیاس شبکه و باتری های مسکونی متفاوت به نظر می رسد. به نیروهایی که بازار باتری ایالات متحده را تغییر می دهند نگاهی دقیق بیندازید. — کیسی"}, {"source": "MIT Tech Review", "title": "Batteries just broke another record in the US", "link": "https://www.technologyreview.com/2026/09/09/1143680/batteries-us-record/", "summary": "Battery installations hit a new record in the US in the second quarter of 2026. In total, 20.2 gigawatt-hours of new capacity came online, according to a new report. That’s enough to supply the daily electricity needs of about 700,000 homes. The surge is putting the country on a trajectory to see 71 gigawatt-hours of batteries installed in 2026, a 20% increase over last year. This growth is being driven by a combination of cheaper batteries and an urgent need for more energy storage capacity as renewables such as solar and onshore wind power are added to the grid. Massive, utility-scale systems are leading the way; they’re responsible for most of the record-setting quarter. Seven new gigascale battery installations (those with a capacity of over one gigawatt-hour) came online during the three-month stretch, according to the report , published by Benchmark Mineral Intelligence and the Solar Energy Industries Association. “It really came down to a handful of big projects,” says Shan Tomouk, energy storage and energy lead for Benchmark Mineral Intelligence. But there was also growth in the category of so-called behind-the-meter batteries, which include both residential and industrial battery storage systems. These projects, generally smaller than utility-scale installations, are typically owned and operated by homeowners or businesses rather than utilities or power providers. In the behind-the-meter category, data centers led the way, making up about three-quarters of new batteries in the commercial sector. But residential batteries saw a sharp slowdown. These systems are often installed in homes to store power from solar panels or serve as a backup source in case of a blackout. Home installations are projected to drop by 16% in 2026 compared with last year, according to the report. That drop happened largely because a tax credit that helped subsidize home battery systems ended in 2025, Tomouk says. Home installations should recover by the end of the decade, he adds. And tax credits for nonresidential batteries have largely survived. Overall, batteries are a bright spot in energy right now. “This is one of the strong sectors in the US,” says Isshu Kikuma, an energy storage analyst at BloombergNEF, an energy consultancy. As the battery market continues to grow, one major trend to keep an eye on is a move toward US-made technology. Today, nearly all the systems coming online use cells made in China, though some are put together into complete energy storage syst", "date_str": "2026-09-09T09:00:00+00:00", "hash": "e2557f6ee6df2438", "title_fa": "باتری ها به تازگی یک رکورد دیگر را در ایالات متحده شکستند", "summary_fa": "نصب باتری در سه ماهه دوم سال 2026 رکورد جدیدی را در ایالات متحده به ثبت رساند. طبق یک گزارش جدید، در مجموع، 20.2 گیگاوات ساعت ظرفیت جدید آنلاین شد. این برای تامین برق مورد نیاز روزانه حدود 700000 خانه کافی است. این افزایش، کشور را در مسیر نصب 71 گیگاوات ساعت باتری در سال 2026 قرار می دهد که 20 درصد افزایش نسبت به سال گذشته نشان می دهد. این رشد به دلیل ترکیبی از باتری‌های ارزان‌تر و نیاز فوری به ظرفیت ذخیره‌سازی انرژی بیشتر است زیرا انرژی‌های تجدیدپذیر مانند انرژی خورشیدی و بادی خشکی به شبکه اضافه می‌شوند. سیستم‌های عظیم و در مقیاس ابزاری پیشرو هستند. آنها مسئول بیشتر سه ماهه ثبت رکورد هستند. بر اساس این گزارش که توسط Benchmark Mineral Intelligence و انجمن صنایع انرژی خورشیدی منتشر شده است، هفت نصب باتری جدید در مقیاس گیگا (آنهایی که ظرفیت بیش از یک گیگاوات ساعت دارند) در طول سه ماهه به صورت آنلاین عرضه شدند. شان توموک، رهبر ذخیره‌سازی انرژی و انرژی برای هوش معدنی بنچمارک، می‌گوید: «این واقعاً به تعداد انگشت شماری از پروژه‌های بزرگ منتهی شد. اما در دسته بندی باتری های به اصطلاح پشت متر نیز رشد داشت که شامل سیستم های ذخیره سازی باتری های مسکونی و صنعتی می شود. این پروژه‌ها، عموماً کوچک‌تر از تأسیسات در مقیاس شهری، معمولاً متعلق به صاحبان خانه یا مشاغل هستند و نه شرکت‌های برق یا تأمین‌کنندگان برق. در رده پشت متر، مراکز داده پیشتاز هستند و حدود سه چهارم باتری های جدید در بخش تجاری را تشکیل می دهند. اما باتری های مسکونی کاهش شدیدی را تجربه کردند. این سیستم‌ها اغلب در خانه‌ها برای ذخیره انرژی از پنل‌های خورشیدی نصب می‌شوند یا در صورت خاموشی به عنوان منبع پشتیبان عمل می‌کنند. بر اساس این گزارش، پیش‌بینی می‌شود که تاسیسات خانگی در سال 2026 نسبت به سال"}, {"source": "MIT Tech Review", "title": "Understanding the thermal ceiling in portable power", "link": "https://www.technologyreview.com/2026/09/09/1143279/understanding-the-thermal-ceiling-in-portable-power/", "summary": "Plug a phone into a modern charger and the first 10 minutes are impressive. The next 20 are not. This is not a defect. It’s the connected device protecting itself. As temperature rises during charging, a smartphone s battery management system reduces the current it will accept, because heat accelerates the chemical degradation that permanently reduces battery capacity. The charger may be capable of delivering more, but the device simply stops taking it. For anyone building products in the portable power category, this creates an uncomfortable gap between specification and experience. A device rated at 25 watts is accurate in the sense that it can deliver 25 watts. Whether it delivers 25 watts for the duration of a charge is a different question, and one the specification does not answer. The specification gap The gap matters commercially because it is invisible at the point of purchase and obvious in use. Consumers compare wattage figures on packaging. They don’t compare thermal curves, because thermal curves are not published publicly. The result is a category where products differentiate on a number that describes peak output rather than sustained output, and where the actual user experience of two products with identical specifications can diverge substantially. This is particularly acute in magnetic wireless charging. Inductive power transfer generates heat at both the transmitting and receiving coils, and the magnetic attachment that makes these products convenient also places the heat source in direct contact with the device it is charging. Convenience and thermal performance are working against each other by design. The industry s response for the past several years has been materials science. Graphite sheets, thermal interface materials, conductive housings, and heat-spreading layers have all improved how efficiently accumulated heat moves away from the source. Each generation has been incrementally better than the last. But passive dissipation has a structural limitation: it can only move heat that has already been generated, and only as fast as the surrounding air will accept it. In a sealed, pocket-sized enclosure, that ceiling arrives quickly. Improving the materials slows the rate of temperature rise. It does not prevent the temperature rise. Moving from dissipation to removal The alternative is active thermal management, which is standard in stationary electronics and largely absent from portable ones for reasons that are easy to understand. ", "date_str": "2026-09-09T08:18:13+00:00", "hash": "3f5fc90d5811fbac", "title_fa": "آشنایی با سقف حرارتی در برق قابل حمل", "summary_fa": "یک گوشی را به یک شارژر مدرن وصل کنید و 10 دقیقه اول تاثیرگذار خواهد بود. 20 بعدی نیست. این عیب نیست. این دستگاه متصل است که از خود محافظت می کند. با افزایش دما در حین شارژ، سیستم مدیریت باتری گوشی هوشمند جریانی را که می‌پذیرد کاهش می‌دهد، زیرا گرما تخریب شیمیایی را تسریع می‌کند که به طور دائم ظرفیت باتری را کاهش می‌دهد. شارژر ممکن است قادر به تحویل بیشتر باشد، اما دستگاه به سادگی آن را متوقف می کند. برای هر کسی که محصولاتی را در رده برق قابل حمل تولید می کند، این یک شکاف ناراحت کننده بین مشخصات و تجربه ایجاد می کند. دستگاهی با توان 25 وات از این نظر دقیق است که می تواند 25 وات تولید کند. اینکه آیا 25 وات برای مدت زمان شارژ ارائه می دهد یا خیر، سوال متفاوتی است و مشخصات آن پاسخی ندارد. شکاف مشخصات شکاف از نظر تجاری اهمیت دارد زیرا در محل خرید نامرئی و در استفاده آشکار است. مصرف کنندگان ارقام وات روی بسته بندی را مقایسه می کنند. آنها منحنی های حرارتی را با هم مقایسه نمی کنند، زیرا منحنی های حرارتی به صورت عمومی منتشر نمی شوند. نتیجه، دسته‌بندی است که در آن محصولات بر روی عددی متمایز می‌شوند که حداکثر خروجی را به جای خروجی پایدار توصیف می‌کند، و در آن تجربه کاربر واقعی دو محصول با مشخصات یکسان می‌تواند به‌طور قابل‌توجهی متفاوت باشد. این به ویژه در شارژ بی سیم مغناطیسی شدید است. انتقال توان القایی باعث تولید گرما در سیم پیچ های فرستنده و گیرنده می شود و اتصال مغناطیسی که این محصولات را راحت می کند، منبع گرما را در تماس مستقیم با دستگاهی که شارژ می کند قرار می دهد. راحتی و عملکرد حرارتی بر اساس طراحی در برابر یکدیگر کار می کنند. پاسخ صنعت در چند"}, {"source": "MIT Tech Review", "title": "What OpenAI’s latest controversy tells us about the future of math", "link": "https://www.technologyreview.com/2026/09/08/1143747/what-openais-latest-controversy-tells-us-about-the-future-of-math/", "summary": "OpenAI’s latest mathematical milestone has quickly become mired in controversy. Today, the company announced that its agents have solved one of the Millennium Prize Problems, some of the most important open problems in mathematics. Under normal circumstances, that solution would be a huge feather in OpenAI’s cap. But the announcement has been overshadowed by accusations that OpenAI used NYU mathematician Tristan Buckmaster’s and Anthropic employee Levent Alpöge’s AI-assisted work on the problem as a jumping-off point and failed to credit them. OpenAI has denied the accusations. It remains uncertain if OpenAI’s models made use of the work completed by Buckmaster and Alpöge, though Sébastien Bubeck, a member of the technical staff at OpenAI, said in a press briefing that the team was inspired to pursue the problem after hearing a rumor about Buckmaster and Alpöge’s efforts. But whether or not OpenAI’s models took advantage of Buckmaster and Alpöge’s research, this episode may mark a turning point in the history of mathematics. AI models now seem essential for making progress on the most important mathematical problems of our time, and solving them may demand resources only available at a couple of frontier AI companies, which often defy the norms of academic collaboration that undergird most mathematical progress. If that’s the future we are headed for, it is unclear how human mathematicians will fit into it. The problem that OpenAI claims to have solved is known as the Navier–Stokes existence and sm ltiple jobs; by 2024, they made up over half, according to the Richmond Fed analysis. Simultaneously, the number of women holding multiple jobs has increased in the last few years, according to the Bureau of Labor Statistics's latest employment data. The gender gap in multiple jobholding has widened, meaning that more women — especially those aged 20 to 24 — are working in several roles. That tracks with a labor force where women have outnumbered men with college degrees, and younger women in some areas earn more than their male counterparts. Taken together, the data indicate that more educated and traditionally more affluent Americans feel an urge to bring in multiple income streams. Side hustles are increasingly prevalent across the economy: The share of Americans holding down a side hustle has i", "date_str": "2026-09-09T19:23:48+00:00", "hash": "362ba9490818a928", "title_fa": "اقتصاد فرعی در حال تبدیل شدن به طبقه متوسط ​​است", "summary_fa": "زنان و آمریکایی های طبقه متوسط ​​بیشتر به دنبال شغل دوم هستند. MoMo Productions/Getty Images آمریکایی‌های با درآمد متوسط ​​به طور فزاینده‌ای مشاغل متعددی را انجام می‌دهند و از افراد کم درآمد پیشی می‌گیرند. سهم مشاغل متعدد با مدرک دانشگاهی افزایش یافته است و تعداد بیشتری از زنان چندین شغل دارند. این تصویری از آمریکایی‌های مرفه‌تر و باثبات‌تر را ترسیم می‌کند که به دنبال درآمد دوم هستند. طبقه متوسط ​​آمریکا همیشه در حال شلوغی است - و اکنون، آنها در حال غوغا هستند. سهم آمریکایی‌هایی که بیش از یک شغل دارند در چند سال گذشته به‌طور پیوسته در حال افزایش بوده است و همچنان در سطوح بالایی قرار دارد. اما جمعیتی که چندین شغل دارند با قبل از همه‌گیری متفاوت به نظر می‌رسند، با گروهی رو به رشد از آمریکایی‌هایی که به طور سنتی پایدارتر هستند، اکنون به دنبال جریان‌های درآمدی متعدد هستند. شغل دوم دیگر فقط یک تاکتیک بقا برای کم درآمدها یا یک افزایش درآمد خوب برای پردرآمدها نیست - این شغل به طور فزاینده ای برای آمریکایی های دارای تحصیلات دانشگاهی، با درآمد متوسط ​​و زنان نیروی کار ظاهر می شود، که به نظر می رسد به دنبال یک حائل اضافی از ثبات و درآ estions about why the Army was ending the experiment and concerns about its wider approach to drone warfare . At an Army modernization media roundtable on Wednesday, Army officials said that the shift had been planned from the beginning and presented how they intend to spread lessons on uncrewed aerial systems across the service. \"They were never flagged to be a permanent centralized drone unit,\" Alex Miller, the Army's chief technology officer, told reporters. \"In fact, we pushed back on having something like a drone corps since its inception because our theory of the case is, if you centralize that in one place, what you lose is the ability to actually scale that learning and send that out to the rest of the Army,\" he added. The plan, Miller said, was for the battalion to test uncrewed technologies and learn tactics in the six to seven months before they received their full infantry battalion equipment. Then, the Army would disseminate those takeaways across the service and the troops from the battalion would return to their role as airborne infantry. When The Wall Street Journal first reported the change, an Army spokesperson said the service was committed to \"drone dominance\" but did not comment on future plans. The Journal reported that no end date was specified when the battalion's drone role was establ", "date_str": "2026-09-09T19:21:36+00:00", "hash": "2e663c90c3d2b663", "title_fa": "یگان ویژه هواپیماهای بدون سرنشین ارتش آمریکا در حال بازگشت به کار پیاده نظام هوابرد است. مقامات می گویند که همیشه این برنامه بوده است.", "summary_fa": "تصمیم به حذف تدریجی نقش آزمایشی پهپاد گردان، سؤالاتی را در مورد اینکه ارتش چگونه قصد دارد جنگ هواپیماهای بدون سرنشین و درس هایی از اوکراین را دنبال کند، ایجاد کرد. عکس ارتش ایالات متحده توسط ستوان یکم براندون مایلز مقامات ارتش ایالات متحده گفتند که نقش آزمایش پهپاد یکی از گردان های آن همیشه موقتی بوده است. تصمیم برای حذف تدریجی تمرکز هواپیماهای بدون سرنشین، کارشناسان و قانونگذاران را سردرگم کرد. اولویت ارتش دموکراتیزه کردن t has recently been in talks to buy Listen Labs, an AI-powered customer research platform for around $2 billion, according to people familiar with the matter. The talks have not been finalized and could still fall apart, according to a person with knowledge of the deal. Salesforce and Listen Labs did not respond to requests for comment. Listen Labs provides AI-driven market analysis for brands such as Anthropic, Google, and Nestlé. If the deal were to become finalized, it would be part of a wave of AI acquisitions in recent weeks, with Nvidia acquiring HuggingFace for around $12.9 billion and Stripe buying OpenRouter for around $8 billion. Salesforce has been pushing to improve its AI efforts, with a particular focus on enterprise agents. The Information reported that they considered acquiring HuggingFace before it was sold to Nvidia. Listen Labs, cofounded by Alfred Wahlforss and Florian Juengermann in 2023, was last valued at $500 million in a financing round earlier this year. Its backers include Sequoia Capital, Ribbit Capital, Conviction Partners, Pear, and Neo. Read the original article on Business Insider", "date_str": "2026-09-09T19:01:53+00:00", "hash": "07504ef28e8055c9", "title_fa": "Salesforce مذاکراتی را برای خرید Listen Labs، یک پلت فرم تحقیقاتی مشتریان هوش مصنوعی، به قیمت حدود 2 میلیارد دلار انجام داده است", "summary_fa": "مدیرعامل Salesforce، Marc Benioff، با هزاران نفر در Moscone South Hall در طول Dreamforce در سانفرانسیسکو در روز سه‌شنبه، 17 سپتامبر 2024 صحبت می‌کند. Listen Labs که آخرین ارزش آن 500 میلیون دلار بود، پلتفرم تحلیل بازار هوش مصنوعی را به فروش می رساند. معاملات اخیر AI M A شامل خرید 12.9 میلیارد دلاری انویدیا استارتاپ Hugging Face است. Salesforce می‌تواند در جستجوی خریدهایی باشد تا قابلیت‌های هوش مصنوعی خود را تقویت کند. به گفته افراد آشنا، این غول نرم افزاری اخیرا در حال مذاکره برای خرید Listen Labs، یک پلتفرم تحقیقاتی مشتری مبتنی بر هوش مصنوعی به قیمت حدود 2 میلیارد دلار بوده است. به گفته یک فرد مطلع از این معامله، مذاکرات نهایی نشده ling for their high yields following recent sell-offs. The firm advises increasing bond allocations to balance equity-heavy portfolios. US households hold 32% of their assets in stocks, and just 4% in bonds. Bond investors have had a rough few years since the start of the COVID-19 pandemic, but the tables look like they're about to turn. That's according to fixed-income giant Pimco , which oversees $2.3 trillion in assets. Since early 2020, 10-year Treasury yields have risen from 0.65% to 4.8%. An inflation flare-up in 2021 and 2022 fueled much of that rise, and yields have again surged in recent months as investors worry about rising oil prices and government debt levels. When bond yields rise, bond values decrease. But long-dated bonds have slid far enough now that the assets look attractive specifically for their yields, Pimco multi-asset credit strategist Lotfi Karoui wrote in a note on Tuesday. That's because current yields offer attractive income levels to offset portfolio losses, as well as a high enough starting point that they can appreciate in a poor growth environment, he said. Investors can expect the broader bond market to deliver anywhere from 4% to 6% annualized returns in price appreciation over the next five years, Pimco data shows. \"In today's investing regime, we see a strong case for boosting bond allocations and restoring more balance to portfolios that are heavily exposed to equity markets — and equity risks,\" Karoui wrote. Karoui pointed out that one-year forward S P 500 earnings yields are hovering around the same level as yields on the Bloomberg US Aggregate Bond Index, and have been for the last few years. PIMCO Generally, investors are compensated more for owning stocks, which are higher risk than much of the fixed-income universe, but the paradigm has shifted, and the return profile of bonds is looking nearly as good, especially given the lower risk. \"Bond yields have reset to higher levels, offering more visible return potential, while the premium for taking incremental equity risk now looks unusually thin.\" In light of the recent bond sell-off, along with historically high valuations in the stock market that threaten to dampen long-term returns, bonds are again a compelling buy, Karoui said. Yet many investors are still underweight bonds, as it's been a drag on portfolio values over recent years. \"For much of the past 16 years, investors who chose bonds over stocks felt punished, especially giv", "date_str": "2026-09-09T18:32:15+00:00", "hash": "380d2ea4f7c83518", "title_fa": "چرا تایتان پیمکو با درآمد ثابت می‌گوید زمان آن رسیده که اوراق قرضه را کاهش دهد؟", "summary_fa": "Pimco Pimco می گوید اوراق قرضه به دلیل بازدهی بالای خود پس از فروش اخیر جذاب به نظر می رسند. این شرکت توصیه می‌کند تخصیص اوراق قرضه را افزایش دهد تا پرتفوی‌های دارای ارزش سهام متعادل شود. خانواده های آمریکایی 32 درصد از دارایی های خود را در سهام و تنها 4 درصد را در اوراق قرضه نگهداری می کنند. سرمایه‌گذاران اوراق قرضه چند سال سختی از شروع همه‌گیری کووید-19 داشته‌اند، اما به نظر می‌رسد که جدول‌ها در شرف تغییر هستند. این بر اساس غول با درآمد ثابت Pimco است که بر دارایی های 2.3 تریلیون دلاری نظارت دارد. از اوایل سال 2020، بازدهی خزانه داری 10 ساله از 0.65 درصد به 4.8 درصد افزایش یافته است. شعله ور شدن تورم در سال های 2021 و 2022 باعث افزایش بیشتر این افزایش شد و بازدهی دوباره در ماه های اخیر افزایش یافت زیرا سرمایه گذاران نگران افزایش قیمت نفت و سطح بدهی دولت هستند. هنگامی که بازده اوراق قرضه افزایش می یابد، ارزش اوراق قرضه کاهش می یابد. لطفی کرویی، استراتژیست اعتباری چند دارایی پیمکو، روز سه شنبه در یادداشتی نوشت، اما اوراق با تاریخ طولانی اکنون به اندازه کافی کاهش یافته اند که دارایی ها به ویژه برای بازدهی خود جذاب به نظر می رسند. او گفت که به این دلیل است که بازدهی فعلی سطوح درآمدی جذابی را برای جبران زیان های پرتفوی ارائه می دهد، و همچنین نقطه شروع به اندازه کافی بالا است که می تواند در یک محیط رشد ضعیف افزایش یابد. داده‌های Pimco نشان می‌دهد که سرمایه‌گذاران می‌توانند انتظار داشته باشند که بازار اوراق قرضه گسترده‌تر طی پنج 8 پرو است. اپل اعلام کرد که قیمت آیفون Duo را 1999 دلار برای 256 گیگابایت فضای ذخیره سازی تعیین کرده است. قیمت ها به 3199 دلار برای دو ترابایت می رسد. شکستن خط طراحی آیفون، مطمئنا اپل اولین شرکتی نیست که یک گوشی تاشو عرضه می کند. سامسونگ به گسترش خط تولید خود ادامه می‌دهد، در حالی که شرکت‌های چینی مانند Honor و Oppo جایگزین‌های ارزان‌تری (و نازک‌تر) ارائه می‌کنند. یکی از گوشی های هواوی نه یک بار بلکه دو بار تا می شود. با این حال، این حرکت برای اپل که تا حد زیادی فرم فاکتوری را که استیو جابز برای اولین بار"}, {"source": "Business Insider", "title": "Apple raises iPhone prices as memory shortage drives costs up", "link": "https://www.businessinsider.com/apple-iphone-18-pro-price-increase-2026-9", "summary": "The new Apple iPhone 18 Pro. Apple Apple unveiled the iPhone 18 Pro and Pro Max. The phones will cost $100 more than the previous iPhone 17 Pro models. Tech companies have repeatedly cited the global memory shortage as a reason for hiking prices. Your next iPhone is going to cost you. On Tuesday, Apple announced the new iPhone 18 Pro and Pro Max — with price tags $100 higher than the previous Pro models. It also announced the new foldable iPhone Duo , priced at $1,999. Apple has yet to announce the entry-level iPhone 18. The new models will be available with 256GB, 512GB, 1TB, and 2TB storage capacities. The 2TB version of the Pro model costs $2399, and the Pro Max 2TB phone will run you $2499. Both prices are above those of the 2TB iPhone 17 Pro Max, the previous most expensive iPhone on the market. Both of the top-of-the-line iPhone 18s still pale in comparison to the highest-tier iPhone Duo. The 2TB iPhone Duo will cost $3199. The higher prices illustrate how the global memory shortage has stretched a company as dominant as Apple. In his final earnings call as CEO, Tim Cook said that Apple had \"reluctantly raised prices\" of iPads and MacBooks due to the memory shortage. \"We did it because we're in what I would characterize as a 100-year flood on the memory pricing with exponential increases in memory prices,\" Cook said. The memory shortage is largely driven by the AI revolution as chipmakers shift production away from chips designed for consumer products to the more specialized chips required for the data centers that power AI models. In June, Apple increased the prices of iPads by up to 25% and Mac computers by as much as 20%. At the time, the cost of existing iPhone models remained unchanged. Other companies, including some of Apple's competitors, have also hiked device prices. Officials at Samsung and Google have said they raised prices on some of their smartphone models in part due to rising memory costs. \"There's never been an increase in memory prices like the world's going through right now,\" Google's vice president of devices and services, Shakil Barkat, said in July ahead of the release of the Pixel 11. Ultimately, Google tacked $100 onto the Pixel 11, though it also doubled the storage of the baseline edition as Google discontinued the 128GB model. The iPhone 18 Pro and Pro Max will be available for preorder on Saturday, September 12, and then will go on sale on September 18. Read the original article on Business Insider", "date_str": "2026-09-09T18:29:41+00:00", "hash": "05cf71e5355f46ce", "title_fa": "اپل قیمت آیفون را افزایش می دهد زیرا کمبود حافظه باعث افزایش هزینه ها می شود", "summary_fa": "آیفون 18 پرو جدید اپل. اپل از آیفون 18 پرو و ​​پرو مکس رونمایی کرد. قیمت این گوشی ها 100 دلار بیشتر از مدل های قبلی آیفون 17 پرو خواهد بود. شرکت های فناوری بارها کمبود حافظه جهانی را دلیل افزایش قیمت ها ذکر کرده اند. آیفون بعدی شما برای شما هزینه خواهد داشت. روز سه شنبه، اپل آیفون 18 پرو و ​​پرو مکس جدید را معرفی کرد که قیمت آنها 100 دلار بیشتر از مدل های قبلی پرو است. همچنین آیفون تاشوی جدید Duo را با قیمت 1999 دلار معرفی کرد. اپل هنوز آیفون 18 سطح پایه را معرفی نکرده است. مدل های جدید با ظرفیت های ذخیره سازی 256 گیگابایت، 512 گیگابایت، 1 ترابایت و 2 ترابایت در دسترس خواهند بود. نسخه 2 ترابایتی مدل پرو 2399 دلار ق  hardly in the frame, she could already tell: \"Is that the fisherman sweater from L.L. Bean?\" she asked. We immediately launched into a gushing conversation about how perfect the L.L.Bean Men's Signature Cotton Fisherman Sweater is. So we knew we had to write about it. Why we love this sweater so much Samantha Crozier/Business Insider It's made of cotton , which might not be the obvious choice for sweaters, but it's the unsung hero of transitional layers. Unlike wool, you'll never get that prickling, itchy feeling. And you never have to worry about high-maintenance laundry instructions. Just throw it in the wash with your T-shirts. The sweater manages to be both breathable and heavyweight , which is quite a feat. It is knitted with thick cotton yarn, so it has heft — but the knit is loose enough to allow airflow. It is perfectly oversized, even on more petite people (Sally and I are both 5-foot-2). And don't be deterred by the fact that it's a men's sweater; the fit is relaxed in all the right ways. There are lots of autumnal colorways — including Brassy Olive, Deep Coffee, and Navy. Some colors, like a beautiful Olive Grey and a sky blue shade, are even on sale right now. The sizing is extensive and inclusive. It comes in two lengths: regular and tall, and it runs from men's size small to XXXL. Here are four different ways we've styled it. For a media event Samantha Crozier/Business Insider When you're going to an event where you'll be rubbing elbows with people in the fashion industry, you want to make sure you're on-trend. I combined three fall 2025 trends for this outfit: leopard print, burgundy accessories, and slingbacks. And the sweater in a size medium paired perfectly with all of them. The shoes are from Inez , a brand that sells some of the most comfortable heels I've ever tested. I loved the perfect autumnal pairing of the black suede slingbacks with the leopard print. Though it looks like a skirt, I actually layered the sweater over a leopard print dress from Zara. It's sold out, but I linked a similar skirt below. I'm wearing a ton of our favorite brands for this outfit — check out our Cuyana review , Inez review , and Heaven Mayhem review to see why we love these buzzy reta", "date_str": "2026-09-09T17:46:17+00:00", "hash": "da135655a7ba98b0", "title_fa": "این ژاکت نخی از L.L.Bean جام مقدس ملزومات پاییز است", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید سالی کاپلان، سامانتا کروزیر پاییز گذشته، من در یک جلسه مجازی با سردبیر اجرایی تیممان، سالی کاپلان بودم، و او بلافاصله ژاکت من را ساعت کرد. با وجود اینکه بدنم به سختی در کادر قرار داشت، او می‌توانست بگوید: \"آیا آن ژاکت ماهیگیر از L.L. Bean است؟\" او پرسید. ما بلافاصله در مورد عالی بودن ژاکت نخی فیشرمن مردانه L.L.Bean شروع به گفتگو کردیم. بنابراین می دانستیم که باید در مورد آن بنویسیم. چرا ما این ژاکت را خیلی دوست داریم Samantha Crozier/Business Insider این ژاکت از پنبه ساخته شده است، که ممکن است انتخاب واضحی برای ژاکت ها نباشد، اما قهرمان گمنام لایه های انتقالی است. برخلاف پشم، هرگز آن احساس خارش و خارش را نخواهید داشت. و هرگز نباید نگران دستورالعمل‌های شستشوی لباس‌ها با نگهداری بالا باشید. فقط آن را با تی شرت خود در شستشو بیندازید. این ژاکت هم قابلیت تنفس و هم سنگین وزن را دارد که این یک شاهکار است. با نخ پنبه‌ای ضخیم بافته می‌شود، بنابراین وزن بالایی دارد - اما بافتنی به اندازه‌ای گشاد است که اجازه جریان هوا را بدهد. بسیار بزرگ است، حتی در افراد کوچکتر (من و سالی هر دو 5 فوتی 2 هستیم). و از این واقعیت که این یک ژاکت مردانه است منصرف نشوید. تناسب در تمام راه های درست آرام است. رنگ های پاییزی زیادی وجود دارد - از جمله Brassy Olive، Deep Coffee و Navy. برخی از رنگ‌ها، مانند خاکستری زیتونی زیبا و سایه آبی آسمانی، حتی در حال حاضر در فروش هستند. سایز بندی گسترده و فراگیر است. این در دو طول عرضه می شود: معمولی و بلند، و از سایز مردانه کوچک تا XXXL است. در اینجا چهار روش مختلف برای استایل کردن آن وجود"}, {"source": "Business Insider", "title": "Buyback backfire: Bond yields are surging despite the Treasury's $6 billion plan to lower them", "link": "https://www.businessinsider.com/bond-yields-surging-treasury-6-billion-buyback-scott-bessent-2026-9", "summary": "Melissa Sue Gerrits/Getty Images Long-dated bond yields spiked after Scott Bessent solidified details around a buyback program on Wednesday. The 10-year Treasury yield hit its highest level since 2023. The move runs counter to the Treasury's aim, which is to lower borrowing costs. Bond yields aren't playing ball with the Treasury's announcement that it will triple the size of its buybacks of long-dated US government debt. Treasury Secretary Scott Bessent said Wednesday morning that the department will buy $6 billion of 10- and 20-year bonds on Thursday. The move, first announced at the end of August , has been interpreted by markets as an attempt to rein in bond yields that have surged to the highest levels in years. However, details of the plan stoked the opposite reaction. The 10-year Treasury yield climbed to 4.85%, the highest level since 2023. The 20-year and the 30year bond yields both rose to about 5.29%. The read from markets after the announcement is that the size of the program was a disappointment, especially in the face of rising headwinds in the bond market that have been pushing yields higher all year. \"The bond market is quite literally fighting the US Treasury as the Iran War continues, with the 10Y Note Yield nearing a +100 basis point move since the war began,\" a note posted by The Kobeissi Letter on X stated after the announcement. It added: \"Without an end to the Iran War, we are on track to see the 10Y Note Yield above 5.00% by next week. American consumers, homebuyers, and borrowers are in for a rude awakening.\" The forces pushing up yields are largely beyond the Treasury's control. The week began with a fresh spike in oil prices caused by renewed fighting between the US and Iran, which was followed immediately by a jump in yields on Tuesday as investors worried about more inflation. Meanwhile, last week's hot jobs report lifted rate-hike odds, with markets seeing next week's meeting as likely to deliver a hawkish result and defy Donald Trump's renewed calls for the Fed and Kevin Warsh to lower interest rates after the strong jobs data. \"Today is a bad day for global bond markets. The problem with trying to artificially cap long-term yields - as with Treasury buybacks - is that yields jump if markets think buybacks are too small. This tells you underlying upward pressure is intense,\" Brookings Institution fellow Robin Brooks said. Meanwhile, high yields are also becoming an issue for stock investors. Stocks on Wednesday slid for a sec", "date_str": "2026-09-09T17:40:40+00:00", "hash": "e302b5a2bd9cdf7c", "title_fa": "نتیجه معکوس بازپرداخت: بازده اوراق قرضه علیرغم برنامه 6 میلیارد دلاری خزانه داری برای کاهش آنها در حال افزایش است.", "summary_fa": "Melissa Sue Gerrits/Getty Images پس از اینکه اسکات بسنت جزئیات برنامه بازخرید را در روز چهارشنبه تثبیت کرد، بازده اوراق با تاریخ طولانی افزایش یافت. بازدهی 10 ساله خزانه داری به بالاترین سطح خود از سال 2023 رسیده است. این حرکت در تضاد با هدف خزانه داری است که کاهش هزینه های استقراض است. بازده اوراق قرضه با اعلام خزانه داری مبنی بر اینکه حجم بازپرداخت بدهی های بلندمدت دولت ایالات متحده را سه برابر خواهد کرد، بازی نمی کند. اسکات بسنت، وزیر خزانه داری آمریکا صبح چهارشنبه گفت که این وزارتخانه 6 میلیارد دلار اوراق قرضه 10 و 20 ساله را در روز پنجشنبه خریداری خواهد کرد. این اقدام که برای اولین بار در پایان ماه اوت اعلام شد، توسط بازارها به عنوان تلاشی برای مهار بازده اوراق قرضه تعبیر شد که به بالاترین سطح در سال‌های اخیر رسیده است. با این حال، جزئیات این طرح واکنش مخالف را برانگیخت. بازدهی خزانه داری 10 ساله به 4.85 درصد رسید، که بالاترین سطح از سال 2023 است. بازده اوراق قرضه 20 ساله و 30 ساله هر دو به حدود 5.29 درصد افزایش یافت. آنچه از بازارها پس از اعلام این خبر منتشر شد این بود که حجم این برنامه ناامیدکننده بود، به ویژه در مواجهه با باد مخالف رو به افزایش در بازار اوراق قرضه که در طول سال ب
