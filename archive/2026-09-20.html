جره‌ها دور شوند."}, {"source": "BBC Persian", "title": "نخستین کنسرت پس از کنار گذاشتن رپر حامی فلسطین؛ اد شیرن عذرخواهی کرد", "link": "https://www.bbc.com/persian/articles/cm93v6pg1433o?at_medium=RSS&at_campaign=rss", "summary": "اد شیرن از هوادارانش به‌دلیل «اشتباه‌هایی» که مرتکب شده است عذرخواهی کرد؛ او این سخنان را در نخستین کنسرتش پس از آن مطرح کرد که مکل‌مور به‌دلیل حرف‌هایش در حمایت از فلسطینی‌ها روی صحنه، از برنامه تور او کنار گذاشته شد.", "date_str": "2026-09-20T12:06:10+00:00", "hash": "39cf809cca2257a7", "title_fa": "نخستین کنسرت پس از کنار گذاشتن رپر حامی فلسطین؛ اد شیرن عذرخواهی کرد", "summary_fa": "اد شیرن از هوادارانش به‌دلیل «اشتباه‌هایی» که مرتکب شده است عذرخواهی کرد؛ او این سخنان را در نخستین کنسرتش پس از آن مطرح کرد که مکل‌مور به‌دلیل حرف‌هایش در حمایت از فلسطینی‌ها روی صحنه، از برنامه تور او کنار گذاشته شد. این خواننده کنسرتش در فیلادلفیا را با پرداختن به جنجالی آغاز کرد که از آن زمان تور او را درگیر خود کرده و باعث شده است تمام هنرمندانی که قرار بود پیش از او روی صحنه بروند، از ادامه همکاری انصراف دهند. شیرن گفت: «هیچ‌وقت نمی‌خواستم یک موسیقیدان فعال سیاسی باشم اما این ماجرا من را در میانه بحثی مهم و پرشور درباره آزادی بیان و پیچیده‌ترین مسئله سیاسی روی کره زمین قرار داده است.» او حملات ۷ اکتبر ۲۰۲۳ به رهبری حماس را «هولناک» توصیف کرد و وضعیت غزه را «توجیه‌ناپذیر» خواند. این خواننده گفته است که تصمیم کنار گذاشتن مکل‌مور را نه او که برگزارکنندگان برنامه گرفته‌اند. این جنجال باعث شد قیمت بلیت‌ها کاهش یابد و فروش بلیت برای بخش باقی‌مانده تور «لوپ» او در آمریکا افت کند. شیرن به حاضران گفت اگرچه به انتقاد از موسیقی‌اش عادت دارد ولی «این هفته انتقادها درباره موضوعی بسیار مهم‌تر بود و مجبور شدم تصمیم‌های دشواری بگیرم و در گرفتن این تصمیم‌ها اشتباه‌هایی هم کرده‌ام و واقعا، واقعا، متاسفم.» او گفت می‌خواهد «به این پرسش پاسخ دهد که در مورد وضعیت اسرائیل و فلسطین کجا ایستاده‌ام و آیا برگزاری این کنسرت امشب در اینجا نشان می‌دهد که موضع من چیست یا نه.» شیرن گفت: «در دوران حرفه‌ای‌ام تلاش کرده‌ام به هیچ عنوان مفسر سیاسی نباشم، چون می‌خواهم موسیقی و کنسرت‌هایم درباره اتحاد باشند، نه تفرقه. اما این یک مسئله انسانی است و دیگر نمی‌توانم احساسم درباره آن را پنهان کنم.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید."}, {"source": "BBC Persian", "title": "برادر دایانا: رسانه‌ها در زندگی هری و مگان تاثیر «سرطانی» دارند", "link": "https://www.bbc.com/persian/articles/cqvgyeg1gd7ro?at_medium=RSS&at_campaign=rss", "summary": "ارل اسپنسر، برادر دایانا، همسر اول پادشاه چارلز سوم بریتانیا، به بی‌بی‌سی گفت که رفتار رسانه‌ها با شاهزاده هری و همسرش مگان جلوه‌هایی است از آنچه بر سر خواهرش رفت دارد. او تاثیر رسانه‌‌ها بر زندکی دوک و دوشس ساسکس را «سرطانی» توصیف کرد و گفت مردم باید از نمونه دایانا «درس بگیرند». شاهزاده هری و مگان مارکل اخیرا، شش سال پس از کناره‌گیری از وظایف سلطنتی، از کالیفرنیا به بریتانیا بازگشتند. آنها بارها از رسانه‌ها انتقاد کرده‌اند.", "date_str": "2026-09-20T11:20:13+00:00", "hash": "602ababbb92cff03", "title_fa": "برادر دایانا: رسانه‌ها در زندگی هری و مگان تاثیر «سرطانی» دارند", "summary_fa": "ارل اسپنسر، برادر دایانا، همسر اول پادشاه چارلز سوم بریتانیا، به بی‌بی‌سی گفت که رفتار رسانه‌ها با شاهزاده هری و همسرش مگان جلوه‌هایی است از آنچه بر سر خواهرش رفت دارد. او تاثیر رسانه‌‌ها بر زندکی دوک و دوشس ساسکس را «سرطانی» توصیف کرد و گفت مردم باید از نمونه دایانا «درس بگیرند». شاهزاده هری و مگان مارکل اخیرا، شش سال پس از کناره‌گیری از وظایف سلطنتی، از کالیفرنیا به بریتانیا بازگشتند. آنها بارها از رسانه‌ها انتقاد کرده‌اند. ارل اسپنسر در گفت‌وگو با لورا کونزبرگ درباره اینکه دایانا هم با چنین فشار رسانه‌ای روبرو بود، گفت: «اگر به یک مقاله در یک روزنامه زرد درباره دایانا یا زوجی که اشاره کردید - هری و مگان - نگاه کنید، می‌بینید که می‌توانند واقعا، واقعا، ناخوشایند باشند.» «فکر می‌کنم بر مردم است که از نمونه دایانا درس بگیرند.» او گفت: «من اینجا نیستم که از طرف هری و مگان صحبت کنم اما برای هر کسی که هر روز به این شکل در حال نابود شدن است، باید تاثیری سرطانی در زندگی‌اش داشته باشد.» او گفت که «اشک‌های» خواهرش را از پوشش رسانه‌ها دیده بود و اینکه به انتقاد «بسیار، بسیار حساس» شده بود. ارل اسپنسر گفت خواهرش که در سال ۱۹۸۱ با پادشاه چارلز که در آن زمان شاهزاده بود، ازدواج کرد «واقعا بر اثر آن همه انتقاد به‌شدت ضعیف شده بود» و دیدن بازتاب‌هایی از آن وضعیت در زندگی شاهزاده هری و مگان را «مایه تاسف» توصیف کرد. او همچنین گفت فکر می‌کند در رسانه‌ها این تصور وجود دارد که او «طرف هری است» اما «من طرف پسران خواهر مرحومم هستم، هر دوی آنها، و اگر هر کدام از آنها چیزی می‌خواستند، به یک اندازه در کنارشان می‌بودم.» پرنسس دایانا در تصادف رانندگی در پاریس در ۳۱ اوت ۱۹۹۷ جان باخت. اظهارات او درباره هری و مگان تنها چند هفته پس"}, {"source": "BBC Persian", "title": "نخستین حمله موشکی حوثی‌ها به پایتخت عربستان از زمان شروع دوباره جنگ", "link": "https://www.bbc.com/persian/articles/c6jdv87y8158o?at_medium=RSS&at_campaign=rss", "summary": "عربستان سعودی تایید کرد که حوثی‌های یمن تلاش کرده‌اند با موشک بالستیک ریاض، پایتخت، را هدف قرار دهند. این نخستین حمله به ریاض از زمان شروع دوباره جنگ با حوثی‌ها است. عربستان می‌گوید موشکی که به ریاض شلیک شده بود «رهگیری و منهدم» شده است.", "date_str": "2026-09-20T09:58:34+00:00", "hash": "6f69037f9a7198d6", "title_fa": "نخستین حمله موشکی حوثی‌ها به پایتخت عربستان از زمان شروع دوباره جنگ", "summary_fa": "عربستان سعودی تایید کرد که حوثی‌های یمن تلاش کرده‌اند با موشک بالستیک ریاض، پایتخت، را هدف قرار دهند. این نخستین حمله به ریاض از زمان شروع دوباره جنگ با حوثی‌ها است. عربستان می‌گوید موشکی که به ریاض شلیک شده بود «رهگیری و منهدم» شده است. خبرگزاری‌های مختلف اما گزارش دادند که برخی ساکنان ریاض صدای انفجار شنیدند و بعدتر هم عده‌ای ستون دود را در نزدیکی فرودگاه مشاهده کردند. خبرگزاری فرانسه هم گزارش داده است که در ریاض، روز شنبه، دو صدای مهیب انفجارشنیده شده است و خبرنگارانش یک مخزن سوخت شرکت نفتی آرامکو در نزدیکی فرودگاه را دیده‌اند که آتش گرفته بود. وزارت انرژی عربستان، ۱۱ سپتامبر (۲۰ شهریور)، فعالیت خط لوله نفت خام شرق‌ـ‌غرب را موقتا متوقف کرد. این خط روز قبل هدف حمله پهپادهایی قرار گرفت که عربستان گفت از عراق به پرواز درآمده بودند. حوثی‌ها بخش بزرگی از یمن را در کنترل دارند و اخیرا شهرهای ساحلی مجاور تنگه‌ باب‌المندب و جزایر آن را هم تصرف کرده‌اند. آمریکا شنبه هشدار داد که جنگ ممکن است «به‌سرعت تشدید شود.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. دونالد ترامپ، رئیس‌جمهور آمریکا، هم تعطیلات آخر هفته خود در اقامتگاه کمپ دیوید را ناتمام گذاشت و زودتر از موقع به کاخ سفید بازگشت. کاخ سفید توضیحی درباره بازگشت زودهنگام آقای ترامپ نداد. در همین حال، تعدادی از سفارتخانه‌های آمریکا در غرب آسیا با صدور هشدارهای امنیتی فوری از اتباع خود خواستند به دستورالعمل‌های امنیتی عمل کنند و گفتند که احتمال لغو پروازها در منطقه وجود دارد. با بالا گرفتن جنگ حوثی‌ها و عربستان، هاکان فیدان، وزیر امور خارجه ترکیه، شنبه‌ شب گفت که عربستان سعودی ممکن است نیاز به کمک‌ نظامی داشته باشد و ترکیه این موارد را در چارچوب پیمان دفاعی مکه بررسی خواهد کرد."}, {"source": "BBC Persian", "title": "دیدار سران چین و آمریکا؛ تایوان برگ اصلی معامله، ایران و روسیه در حاشیه چانه‌زنی", "link": "https://www.bbc.com/persian/articles/c6rr412lz94xo?at_medium=RSS&at_campaign=rss", "summary": "در آستانه دیدار برنامه‌ریزی‌شده دونالد ترامپ و شی جین‌پینگ در واشنگتن، تایوان بار دیگر به مهم‌ترین محور اختلاف و چانه‌زنی میان پکن و واشنگتن تبدیل شده است. گزارش‌ها حاکی از آن است که چین فروش احتمالی تسلیحات جدید آمریکا به تایوان را به سرنوشت این دیدار گره زده؛ موضوعی که از نگاه برخی ناظران، نشانه ورود روابط دو قدرت به مرحله‌ای معامله‌محورتر بر سر حساس‌ترین پرونده در روابط دوجانبه است.", "date_str": "2026-09-20T05:04:48+00:00", "hash": "74d53e4ac1e15630", "title_fa": "دیدار سران چین و آمریکا؛ تایوان برگ اصلی معامله، ایران و روسیه در حاشیه چانه‌زنی", "summary_fa": "در آستانه دیدار برنامه‌ریزی‌شده دونالد ترامپ و شی جین‌پینگ در واشنگتن، تایوان بار دیگر به مهم‌ترین محور اختلاف و چانه‌زنی میان پکن و واشنگتن تبدیل شده است. گزارش‌ها حاکی از آن است که چین فروش احتمالی تسلیحات جدید آمریکا به تایوان را به سرنوشت این دیدار گره زده؛ موضوعی که از نگاه برخی ناظران، نشانه ورود روابط دو قدرت به مرحله‌ای معامله‌محورتر بر سر حساس‌ترین پرونده در روابط دوجانبه است. دیدار دونالد ترامپ و شی جین پینگ که قرار است به زودی در واشنگتن برگزار شود، در کانون توجه دیپلماتیک جهان قرار دارد. هنوز هیچ‌کس نمی‌تواند با اطمینان تایید کند که شی جین‌پینگ واقعا پا به خاک آمریکا خواهد گذاشت یا نه. یکی از دلایل این ابهام، مسئله‌ای است که همه طرف‌ها به‌خوبی با آن آشنا هستند: تایوان. چندین منبع آگاه از روابط آمریکا و چین گفته‌اند پکن به واشنگتن اطلاع داده است که اگر آمریکا پیش از این دیدار، هرگونه بسته جدید فروش تسلیحاتی چند میلیارد دلاری به تایوان را تایید کند، چین قصد دارد نشست سران دو کشور را لغو کند. دونالد ترامپ اعلام کرده است که ۲۴ سپتامبر در کاخ سفید میزبان شی جین‌پینگ و همسرش در یک ضیافت رسمی خواهد بود، چند خبرگزاری به نقل از یک مقام ارشد دولت آمریکا گزارش داده‌اند که دونالد ترامپ، رئیس‌جمهور آمریکا، قصد دارد شخصا به پایگاه اندروز در حومه واشنگتن برود تا از شی جین‌پینگ، رئیس‌جمهور چین،استقبال کند. حضور شخص رئیس‌جمهور آمریکا برای استقبال از یک رئیس دولت خارجی در فرودگاه، رخدادی بسیار نادر است. در صورت تایید این حضور، به استثنای مورد ویژه سفر پاپ به آمریکا، این نخستین بار در بیش از ۶۰ سال گذشته خواهد بود که یک رئیس‌جمهور آمریکا به این شکل از یک رهبر خارجی استقبال می‌کند. آیا تعامل چین و آمریکا بر سر تایوان وارد مرحله‌ای تازه شده است؟ به نظر می‌رسد پکن"}, {"source": "BBC Persian", "title": "انتخابات برلین؛ آیا الیف ارالپ، سیاستمدار ترک‌تبار، «ممدانی» پایتخت آلمان خواهد شد؟", "link": "https://www.bbc.com/persian/articles/ckq63qev6ye3o?at_medium=RSS&at_campaign=rss", "summary": "برلین، پایتخت آلمان، روز یکشنبه شاهد یکی از رقابتی‌ترین انتخابات ایالتی تاریخ خود خواهد بود؛ انتخاباتی که در آن الیف ارالپ، سیاستمدار ترک‌تبار حزب چپ، در نظرسنجی‌ها از رقبای خود پیش افتاده و در آستانه رقم زدن یک اتفاق تاریخی قرار گرفته است. در صورت پیروزی، او نخستین فرد با پیشینه مهاجرتی خواهد بود که به مقام شهردار برلین می‌رسد؛ موفقیتی که برخی آن را با ظهور زهران ممدانی در نیویورک مقایسه کرده‌اند.", "date_str": "2026-09-20T05:03:51+00:00", "hash": "0f07e14647c6e7b9", "title_fa": "انتخابات برلین؛ آیا الیف ارالپ، سیاستمدار ترک‌تبار، «ممدانی» پایتخت آلمان خواهد شد؟", "summary_fa": "برلین، پایتخت آلمان، روز یکشنبه شاهد یکی از رقابتی‌ترین انتخابات ایالتی تاریخ خود خواهد بود؛ انتخاباتی که در آن الیف ارالپ، سیاستمدار ترک‌تبار حزب چپ، در نظرسنجی‌ها از رقبای خود پیش افتاده و در آستانه رقم زدن یک اتفاق تاریخی قرار گرفته است. در صورت پیروزی، او نخستین فرد با پیشینه مهاجرتی خواهد بود که به مقام شهردار برلین می‌رسد؛ موفقیتی که برخی آن را با ظهور زهران ممدانی در نیویورک مقایسه کرده‌اند. برلین، پایتخت آلمان، در آستانه یکی از رقابتی‌ترین انتخابات ایالتی تاریخ خود قرار دارد؛ انتخاباتی که در آن احزاب دموکرات مسیحی، چپ، آلترناتیو برای آلمان و سبزها در نظرسنجی‌ها رقابتی بسیار نزدیک با یکدیگر دارند. بر اساس نظرسنجی‌ها، الیف ارالپ، نامزد حزب چپ، پیشتاز رقابت انتخاباتی است و به جدی‌ترین مدعی مقام شهردار برلین تبدیل شده است. در تازه‌ترین نظرسنجی شبکه زد‌دی‌اف، حزب چپ با ۲۲ درصد آرا همچنان در صدر قرار دارد و حزب دموکرات مسیحی به رهبری فریدریش مرتس، صدراعظم آلمان، با ۲۰ درصد در جایگاه دوم ایستاده است. حزب راست افراطی آلترناتیو برای آلمان که نسبت به انتخابات گذشته سهم آرای خود را دو برابر کرده، با ۱۸ درصد در جایگاه سوم ایستاده است. حزب سبزها با ۱۵ درصد در رتبه چهارم قرار دارد و حزب سوسیال دموکرات که اکنون با حزب دموکرات مسیحی در ائتلاف حکومتی است، با ۱۲ درصد قرار دارد. در حالی که میزان حمایت از حزب پوپولیست چپ‌گرای «ائتلاف زارا واگن‌کنشت» حدود ۴ درصد برآورد می‌شود، هنوز مشخص نیست که آیا این حزب خواهد توانست از حد نصاب ۵ درصدی لازم برای ورود به پارلمان ایالتی عبور کند یا نه. یک نظرسنجی‌ که روز پنج‌شنبه منتشر شد نشان داد ۲۳ درصد از رای‌دهندگان هنوز تصمیم نهایی خود را نگرفته‌اند. اگرچه انتخابات برلین یک انتخابات ایالتی است، اما نتایج آن می‌تواند بر آینده سیاسی فریدریش مرتس، که هم صدراعظم و هم"}, {"source": "BBC Persian", "title": "کابوس باب‌المندب؛ حوثی‌ها چگونه معادلات عربستان‌سعودی را برهم زدند؟", "link": "https://www.bbc.com/persian/articles/cr1e5qjy9d32o?at_medium=RSS&at_campaign=rss", "summary": "در حالی که پیشروی حوثی‌ها به سوی باب‌المندب نگرانی‌های عربستان را تشدید کرده، ریاض تلاش‌های دیپلماتیک خود را برای جلب حمایت بین‌المللی در برابر آنچه تهدیدی فزای ن، فیلسوفان، پیامبران یا جادوگران؟»، می‌گوید که این، موضوع نخستین سخنرانی فریدریش نیچه، فیلسوف آلمانی، در دانشگاه بازل نیز بوده است: «او دیدگاهی بسیار متعادل درباره این مسئله ارائه کرد. نیچه گفت، هومر شاعری بود که ایلیاد و اودیسه را نوشت اما این یک ادعای تاریخی نبود، بلکه بیشتر قضاوتی زیبایی‌شناختی محسوب می‌شد.»"}, {"source": "Radio Farda", "title": "رضایی: شروط اصلی ایران برای آمریکا؛ قالیباف: تا شروط محقق نشده تنگه هرمز باز نمی‌شود", "link": "https://www.radiofarda.com/a/iran-says-it-has-conveyed-conditions-to-re-engage-in-talks-with-us/33859457.html", "summary": ".", "date_str": "2026-09-19T17:05:11+00:00", "hash": "94dd79d6345b7ecc", "title_fa": "رضایی: شروط اصلی ایران برای آمریکا؛ قالیباف: تا شروط محقق نشده تنگه هرمز باز نمی‌شود", "summary_fa": "یک روز پس از آن که یک عضو شورای عالی امنیت ایران «هفت شرط» جمهوری اسلامی برای آمریکا را برشمرد، رئیس مجلس ایران تأکید کرد که تا این شروط محقق نشود، تنگه هرمز شانسی برای باز شدن نخواهد داشت. به گفته محسن رضایی، دبیر شورای عالی امنیت ملی ایران، جمهوری اسلامی «شروط» خود برای توقف جنگ با آمریکا و مذاکره را از طریق قطر منتقل کرده و منتظر پاسخ رئیس‌جمهور ایالات متحده است. رضایی می‌گوید در مصاحبه‌اش هفت شرط را عنوان کرده، اما او بر سه شرط تأکید داشته، سه شرطی که رسانه‌های حکومتی به عنوان «شروط اصلی» ایران از آنها یاد کرده‌اند. محسن رضایی روز شنبه ۲۸ شهریور در گفت‌وگو با شبکه الجزیره گفت این سه شرط «اصلی» شامل پایان دادن به جنگ در تمامی جبهه‌ها، آزادسازی دارایی‌های مسدودشده ایران و پایان دادن به محاصرهٔ دریایی جزایر ایران است. به نوشته تسنیم، «توقف دخالت آمریکا در امور داخلی ایران» از جمله دیگر شرایط تهران برای واشینگتن است. سه شرطی که او اکنون به‌طور کلی برای پایان جنگ اعلام کرده، سه تعهد از موارد مندرج در تفاهم‌نامهٔ اسلام‌آباد است که خرداد امسال دو طرف امضا کردند اما سه هفته بعد در پی حملات سپاه به چند نفتکش در جنوب تنگه هرمز و سپس حملات چند روزه و گستردهٔ آمریکا در واکنش به آن عملاً فروپاشید. این موضع یک روز بعد از آن اعلام شده که دونالد ترامپ خبر داد حکومت ایران خواهان توافق با ایالات متحده است، اما تأکید کرد که اگر توافق at it’s worth, it seems unlikely that AI at this point can significantly change the equation around bioweapons or viruses … What has prevented bioweapon attacks through the past decades is not the difficulty of inventing new deadly viruses, but other, more prosaic issues. Consider the failure of Aum Shinrikyo to kill vast numbers of people with botulism and anthrax by spraying these around central Tokyo. There are a lot of logistical challenges, and chemical weapons seem more straightforward. Those exist without AI needing to invent new ones. Continue reading...", "date_str": "2026-09-19T20:00:58+00:00", "hash": "aa07051573f0f54d", "title_fa": "سؤالات روز رستاخیز هوش مصنوعی شما پاسخ داد: \"اگر چیزی باشد، افرادی مانند من می توانند در مورد آن چه کاری انجام دهند؟\"", "summary_fa": "پس از یک هفته هشدارهای هشداردهنده در مورد پتانسیل هوش مصنوعی برای نابود کردن جهان آنگونه که ما می شناسیم، خبرنگاران فناوری ما آیشا داون، بلیک مونتگومری و دن میلمو به سؤالات شما در مورد واقعیت تهدید هوش مصنوعی به زبان واقع بینانه پاسخ دادند که چگونه هوش مصنوعی واقعاً من را می کشد؟ تهدید اصلی پروکسی چیست؟ جنگ هسته ای، مرگ بر اثر فروپاشی جامعه، ویروس؟ من تمام این گزارش‌ها را می‌شنوم که ممکن است ما را بکشد، اما هنوز مطمئن نیستم که چگونه عملاً ممکن است این اتفاق بیفتد؟ صادقانه بگویم، همه چیز بیش از حد احمقانه به نظر می رسد که نمی توان آن را جدی گرفت. Pottys99 عایشه: با توجه به ارزشی که دارد، بعید به نظر می‌رسد که هوش مصنوعی در این مرحله بتواند به طور قابل توجهی معادله مربوط به سلاح‌های زیستی یا ویروس‌ها را تغییر دهد... آنچه در دهه‌های گذشته از حملات سلاح‌های زیستی جلوگیری کرده است، دشواری اختراع ویروس‌های کشنده جدید نیست، بلکه مسائل دیگر و پیش پا افتاده‌تر است. شکست Aum Shinrikyo را در کشتن تعداد زیادی از افراد مبتلا به بوتولیسم و ​​سیاه زخم با سمپاشی در اطراف مرکز توکیو در نظر بگیرید. چالش های لجستیکی زیادی وجود دارد و سلاح های شیمیایی ساده تر به نظر می رسند. اینها بدون نیاز به اختراع هوش مصنوعی وجود دارند. به خواندن ادامه دهید... شاید انسان‌ها تصمیم ضعیفی بگیرند که هوش مصنوعی را مسئول سیستم‌های هسته‌ای کلیدی کنند، اما به نظر می‌رسد این بیشتر یک خطای انسانی است تا یک خطای AI سرکش. انسان ها همچنین می توانند تصمیم ضعیفی برای پرتاب کلاهک های تاکتیکی بدون هوش مصنوعی بگیرند. در غیر این صورت چگونه هوش مصنوعی ممکن است ما را بکشد؟ البته سناریوهای قابل قبول زیادی وجود دارد. اگر غیرنظامی در غزه یا ایران هستید، می‌تواند یک موشک آمریکایی یا اسرائیلی را"}, {"source": "The Guardian AI", "title": "Trump’s ‘biggest miscalculation’? How one adviser steered the great AI freakout", "link": "https://www.theguardian.com/us-news/2026/sep/20/david-sacks-trump-ai-czar", "summary": "David Sacks convinced Trump against any restrictions on AI – putting the White House out of step with its own party As lawmakers from both sides of the aisle in the US have joined together calling for the regulation of powerful artificial intelligence models, one of the few vocal naysayers has been Donald Trump . He’s called the perceived dangers of the technology a “hoax” and a “scam”, arguing that the government already has “tremendous CRIMINAL and REGULATORY power over these companies”. It’s a starkly different stance from those of his former adviser Steve Bannon , the Republican Texas senator Ted Cruz and even the heads of the world’s leading AI companies. But it’s directly in line with the opinion of David Sacks – a prominent billionaire venture capitalist and Trump’s onetime AI and crypto czar, who has pushed back publicly and forcefully against recent claims of an impending AI apocalypse. Continue reading...", "date_str": "2026-09-20T13:00:17+00:00", "hash": "fe31b9de8d859413", "title_fa": "\"بزرگترین اشتباه محاسباتی\" ترامپ؟ چگونه یک مشاور این فریب بزرگ هوش مصنوعی را هدایت کرد", "summary_fa": "دیوید ساکس ترامپ را در برابر هرگونه محدودیتی برای هوش مصنوعی متقاعد کرد - کنار گذاشتن کاخ سفید با حزب خود در حالی که قانونگذاران از هر دو طرف در ایالات متحده با هم متحد شده اند و خواستار تنظیم مدل های قدرتمند هوش مصنوعی شده اند، یکی از معدود مخالفان پر سر و صدا دونالد ترامپ بوده است. او خطرات محسوس این فناوری را یک «فریب» و «کلاهبرداری» نامید و استدلال کرد که دولت در حال حاضر «قدرت کیفری و نظارتی فوق‌العاده‌ای بر این شرکت‌ها دارد». این موضع کاملاً متفاوت از موضع استیو بنن، مشاور سابق او، تد کروز، سناتور جمهوری‌خواه تگزاس و حتی روسای شرکت‌های برجسته هوش مصنوعی در جهان است. اما این به طور مستقیم با نظر دیوید ساکس - یک میلیاردر برجسته سرمایه‌گذاری ریسک‌پذیر و تزار سابق هوش مصنوعی و ارزهای دیجیتال ترامپ، مطابقت دارد، که به طور علنی و قاطعانه از ادعاهای اخیر درباره یک آخرالزمان هوش مصنوعی عقب نشینی کرده است. ادامه مطلب... ساکس، که معتقد است مقررات، پیشتازی ایالات متحده را در رقابت جهانی هوش مصنوعی از بین می برد، به عنوان زمزمه کننده هوش مصنوعی ترامپ - مشاوری که بیشترین نفوذ را در کاخ سفید در این موضوع دارد، دیده می شود. او بارها و بارها به رئیس‌جمهور توصیه کرده است که به مقررات هوش مصنوعی نگاهی نرم بدهد و به اجرای دستورات اجرایی و سایر اقدامات با هدف کاهش محدودیت‌ها در این فناوری کمک کند. او همچنین دارای سهام مستقیم مالی در چندین شرکت هوش مصنوعی است. روز جمعه، بیش از 100 محقق، استاد و فن‌شناس هوش مصنوعی نامه‌ای را امضا کردند که در آن خواستار ارزیابی شخص ثالث مدل‌های هوش مصنوعی و تشریح چگونگی انجام این کار شدند. امضاکنندگان شامل برخی از برجسته ترین متخصصان در این زمینه، مانند جفری هینتون، \"پدرخوانده هوش مصنوعی\" و استوارت راسل، دانشمند مشهور کامپیوتر"}, {"source": "The Guardian AI", "title": "UK startup snares $20m to recreate gigs with ‘hyper-realistic’ digital avatars", "link": "https://www.theguardian.com/business/2026/sep/20/uk-startup-15m-investment-concerts-digital-versions-musicians", "summary": "Unit1 hopes to offer cheaper version of shows such as Abba Voyage, showcasing living and dead artists in any venue The former chief executive of Andrew Lloyd Webber’s entertainment group has obtained a near-£15m investment for his UK music tech startup that hopes to recreate classic concerts by manifesting musicians as digital avatars. Unit1 was set up last year by Barney Wragg, an entertainment executive who ran Lord Lloyd-Webber’s Cats-to-Evita empire for five years from late 2011. It has secured the $20m in funding from a group of investors, including tech backer Balderton Capital through its partner Daniel Waterhouse, who made early investments in Spotify. Continue reading...", "date_str": "2026-09-20T13:00:16+00:00", "hash": "6f860b4cfd31cadb", "title_fa": "استارت‌آپ بریتانیایی 20 میلیون دلار برای بازسازی کنسرت‌ها با آواتارهای دیجیتالی «بیش از حد واقعی» به دام می‌اندازد.", "summary_fa": "واحد 1 امیدوار است که نسخه ارزان‌تری از نمایش‌هایی مانند آبا وویج را ارائه کند، هنرمندان زنده و مرده را در هر مکانی به نمایش بگذارد. مدیر اجرایی سابق گروه سرگرمی اندرو لوید وبر، سرمایه‌گذاری نزدیک به 15 میلیون پوند برای استارت‌آپ فناوری موسیقی بریتانیایی خود دریافت کرده است که امیدوار است با نشان دادن نوازندگان به عنوان آواتار دیجیتال، کنسرت‌های کلاسیک را بازسازی کند. Unit1 سال گذشته توسط بارنی راگ، یک مدیر سرگرمی که امپراتوری Cats-to-Evita Lord Lloyd-Webber's Cats-to-Evita را به مدت پنج سال از اواخر سال 2011 اداره می کرد، راه اندازی شد. 20 میلیون دلار سرمایه از گروهی از سرمایه گذاران، از جمله حامی فناوری Balderton Capital از طریق شریک خود دانیل واترهاوس، که سرمایه گذاری اولیه در Spotify را انجام داده است، تضمین کرده است. به خواندن ادامه دهید... این شرکت امیدوار است که کنسرت هایی را با آواتارهای دیجیتالی «بیش از حد واقع گرایانه» هنرمندان زنده ای که دیگر در حال تور نیستند و با بازسازی اجراهای موجود از نوازندگان مرده روی صحنه ببرد. در مورد دوم، آواتارها را از طریق ترکیبی از فیلم‌های آرشیو و استخدام بازیگران و نوازندگانی که یا شبیه ستاره درگذشته به نظر می‌رسند یا بازی می‌کنند، قبل از ترکیب کردن فیلم‌ها با یکدیگر، توسعه می‌دهد. Unit1 این فناوری را با خواننده، ترانه‌سرا و نوازنده اسکاتلندی، KT Tunstall، که در طول دوره‌ای در شرکت موسیقی EMI با Wragg کار می‌کرد، آزمایش کرده است. در خلبان، تونستال در یک استودیوی لندن توسط دوربین‌های ضبط حرکت فیلمبرداری شد، در حالی که او اجرای دو دهه‌ای را در Later… با جولز هلند بازسازی می‌کرد و از آواتار برای به‌روزرسانی ویژگی‌های خود به شکل فعلی‌اش استفاده می‌کرد. صنعت موسیقی مدت‌هاست که با ایده ایجاد آواتارهای بزرگ‌ت  متحده در رتبه دوم قرار دارد و این دو ابرقدرت درگیر رقابتی فزاینده هستند زیرا خطرات با قابلیت‌های هر مدل جدید افزایش می‌یابد. تحلیلگران عموماً موافق هستند که مدل های مرزی یا پیشرفته ایالات متحده هنوز تا حدودی از همتایان چینی خود جلوتر هستند. اما در چند هفته گذشته، موسیقی خلق و خوی سیلیکون ولی به طور قطعی تیره و تار بوده است، زیرا افراد خودی در مورد فجایع بالقوه ای که می تواند ناشی از \"از دست دادن کنترل\" پیشرفته ترین هوش مصنوعی باشد، هشدار داده است. و شنبه گذشته داریو آمودی، مدیر اجرایی آنتروپیک، «پیش‌گیری جهانی از مرزها» را مطرح کرد - چیزی که به گفته او «نیاز به همکاری با چین» دارد. لیان جی سو از گروه تحقیقاتی فناوری Omdia می گوید: «چین قطعاً پذیرای کاهش رشد شرایط شرکت های آمریکایی نیست. برای دولت، هوش مصنوعی یک «قابلیت اصلی حاکمیت» است و پکن نمی‌خواهد پیشرفت‌های حاصل شده در کاهش شکاف با مدل‌های مرزی ایالات متحده را به خطر بیندازد."}, {"source": "The Guardian AI", "title": "More Australians to live into their 90s as life expectancy forecast to rise over coming decades", "link": "https://www.theguardian.com/australia-news/2026/sep/20/intergenerational-report-australian-life-expectancy-forecast-to-rise", "summary": "Treasury’s latest intergenerational report projects life expectancy at birth will reach 89 for women and 86 for men by 2066 Follow our Australia news live blog for latest updates Get our breaking news email , free app or daily news podcast Australian households will shrink but more people can expect to live well into their 90s, according to the latest update to forecasts of the country’s long-term future. Treasury’s latest intergenerational report, to be published in full on Monday, will project the impact of government policies 40 years into the future. Continue reading...", "date_str": "2026-09-20T04:32:26+00:00", "hash": "fc79b291533c21de", "title_fa": "استرالیایی‌های بیشتری تا 90 سالگی زندگی می‌کنند زیرا پیش‌بینی امید به زندگی در دهه‌های آینده افزایش می‌یابد", "summary_fa": "آخرین گزارش بین نسلی وزارت خزانه داری نشان می دهد که امید به زندگی در بدو تولد تا سال 2066 به 89 برای زنان و 86 برای مردان خواهد رسید برای آخرین به روز رسانی ها وبلاگ اخبار استرالیا را دنبال کنید تا آخرین به روز رسانی ها را دریافت کنید. آخرین گزارش بین نسلی وزارت خزانه داری که به طور کامل در روز دوشنبه منتشر می شود، تأثیر سیاست های دولت را در 40 سال آینده نشان می دهد. به خواندن ادامه دهید... عصاره ای که روز یکشنبه منتشر شد نشان داد که پیش بینی می شود امید به زندگی در بدو تولد برای زنان تا سال 2065/66 به 90 سال برسد، در حالی که در حال حاضر حدود 86 سال است. این گزارش همچنین نشان می‌دهد که هوش مصنوعی (AI) در چهار دهه آینده به «تأثیر تعیین‌کننده» بر اقتصاد تبدیل خواهد شد، زیرا خزانه‌دار، جیم چالمرز، هشدار داد که با «خطرات بسیار قابل‌توجهی» همراه خواهد بود. پیش‌بینی می‌شود که امید به زندگی برای مردان در چهار دهه آینده به 86 سال افزایش یابد که در مقایسه با 82 سال بیشتر است. چالمرز گفت، سیستم مراقبت های بهداشتی جهانی استرالیا و تأثیر تحقیقات پزشکی، محرک های اصلی افزایش امید به زندگی بودند. او گفت که این گزارش موردی را برای سرمایه گذاری های بیشتر در مدیکر، طرح مزایای دارویی و راه اندازی اخیر کلینیک های مراقبت فوری بیان می کند. چالمرز در برنامه یکشنبه نیوز 24 گفت، اما جمعیت رو به رشد و پیر نیز در مرکز فشارهای بلندمدت بودجه قرار خواهد گرفت. او گفت: «عناصری از گزارش بین نسلی وجود دارد که با هم مواجه هستند، اما این یک گزارش بدبینانه نیست... زیرا استرالیایی‌ها واقعاً در موقعیت بهتری قرار دارند و برای همه این تغییرات شتاب‌دهنده‌ای که ما شاهد آن هستیم، آماده‌تر هستند»."}, {"source": "The Guardian AI", "title": "Australia has done precious little to prepare for the dangers of AI. Where is brilliant leadership when you need it? | Zoe Daniel", "link": "https://www.theguardian.com/commentisfree/2026/sep/20/australia-has-done-precious-little-to-prepare-for-the-dangers-of-ai-where-is-brilliant-leadership-when-you-need-it", "summary": "Australia faces stark choices about the most significant technological development since the splitting of the atom in the 1930s Get our breaking news email , free app or daily news podcast There’s nothing like a threat of human ex rved glass panel that spans the left face and top of the case, giving it a unique, eye-catching look. It’s easy to build in, supports a wide variety of components and cooling setups, and has a thoughtful, refined design. Hyte X50 Where to Buy: $149.99 $99.99 at Hyte Unlike a lot of cases with big glass panels, the X50 has excellent airflow, with louvered fins along the back for ventilation, a porous mesh front, and plenty of spots for radiators and fans. It comes in a variety of bold colors, too, like the lavender-adjacent “taro milk” and trendy “matcha,” as well as more classic black and white options. If you’d rather opt for something a little more subtle, the X50 Air swaps the glass panel for curved mesh, and is only $79.99 (usually $119.99) from Hyte .", "date_str": "2026-09-19T15:00:00+00:00", "hash": "9a20a90c2806b4c8", "title_fa": "قاب کامپیوتر رنگارنگ و منحصر به فرد Hyte X50 50 دلار تخفیف دارد", "summary_fa": "Hyte X50 یک کیس رایانه شخصی است که واقعاً از طراحی جعبه سیاه معمولی متمایز است و تا 21 سپتامبر 2026 در سایت شرکت 50 دلار تخفیف دارد که قیمت آن را به 99.99 دلار کاهش می دهد. این کیس جذاب از مادربردهای ITX تا فرم فاکتورهای E-ATX و پردازنده‌های گرافیکی با طول حداکثر 430 میلی‌متر پشتیبانی می‌کند که حتی بزرگ‌ترین گزینه‌های موجود را نیز پوشش می‌دهد. ویژگی برجسته یک پنل شیشه ای منحنی عظیم است که در سمت چپ و بالای کیس قرار دارد و ظاهری منحصر به فرد و چشم نواز به آن می بخشد. ساخت آن آسان است، از طیف گسترده ای از اجزا و تنظیمات خنک کننده پشتیبانی می کند و دارای طراحی متفکرانه و ظریفی است. Hyte X50 از کجا بخریم: 149.99 دلار 99.99 دلار در Hyte برخلاف بسیاری از کیس‌ها با پانل‌های شیشه‌ای بزرگ، X50 دارای جریان هوای عالی است، با باله‌های لووردار در امتداد پشت برای تهویه، جلوی مش متخلخل، و نقاط فراوان برای رادیاتورها و فن‌ها. همچنین در انواع رنگ‌های پررنگ، مانند «تارو شیر» در مجاورت اسطوخودوس و «مچا» مد روز، و همچنین گزینه‌های کلاسیک سیاه و سفید موجود است. اگر ترجیح می‌دهید چیزی کمی ظریف‌تر را انتخاب کنید، X50 Air پنل شیشه‌ای را با مش منحنی عوض می‌کند و تنها ۷۹.۹۹ دلار (معمولاً ۱۱۹.۹۹ دلار) از Hyte است. Gadgets Gaming PC Gaming کیف رنگارنگ و منحصربفرد Hyte X50 PC دارای 50 دلار تخفیف است. Brad Bourque 19 سپتامبر 2026، ساعت 3:00 بعد از ظهر UTC اشتراک لینک اگر چیزی را از پیوند Verge خریداری کنید، Vox Media ممکن است کمیسیون دریافت کند. بیانیه اخلاقی ما را ببینید. براد بورک یک روزنامه‌نگار فناوری و نویسنده تجاری است که در پورتلند، اورگان مستقر است. او به سایت هایی مانند Digital Trends، Business Insider و WIRED کمک کرده است. Hyte X50 یک کیس رایانه"}, {"source": "TechCrunch Main", "title": "The US Navy just told us what’s on its tech wish list for the next several years", "link": "https://techcrunch.com/2026/09/19/even-mid-sprint-to-a-secret-flight-the-navys-tech-chief-had-a-pitch-for-investors/", "summary": "Navy CTO Justin Fanelli talks co-investing alongside VCs instead of funding early research himself, recent buys like a $562 million autonomous refueling deal, and the Navy's updated wish list — from AI to quantum — for where founders should be building next.", "date_str": "2026-09-19T17:00:00+00:00", "hash": "70b455c4d41105d4", "title_fa": "نیروی دریایی ایالات متحده به تازگی به ما گفت که در لیست آرزوهای فناوری خود برای چندین سال آینده چه چیزی وجود دارد", "summary_fa": "جاستین فانلی، مدیر ارشد فناوری نیروی دریایی، به جای تأمین مالی تحقیقات اولیه، خریدهای اخیر مانند قرارداد سوخت‌گیری خودکار 562 میلیون دلاری، و فهرست به‌روزرسانی‌شده نیروی دریایی - از هوش مصنوعی تا کوانتومی - برای جایی که بنیان‌گذاران باید در آینده بسازند، درباره سرمایه‌گذاری مشترک در کنار VCها صحبت می‌کند. جاستین فانلی، افسر ارشد فناوری وزارت نیروی دریایی، در سه سال و نیم گذشته تلاش کرده است تا تجارت با نیروی دریایی ایالات متحده را آسان‌تر کند. وقتی سال گذشته برای اولین بار با او صحبت کردیم، او تغییری را از آنچه که او دولت پدربزرگ شما می نامید - «نمودار اسپاگتی» از نقاط ورودی برای استارت آپ ها - به چیزی نزدیک تر به یک قیف توصیف کرد، جایی که شرکت هایی که نتایج قوی نشان می دهند به عنوان خدمات سازمانی به پایگاه فناوری نیروی دریایی کشیده می شوند. این هفته، دوباره با او در یک تماس ویدیویی آشنا شدیم، و این بار، او نه تنها به دنبال ساده‌تر کردن روند خرید بود، بلکه به معنای واقعی کلمه، پروازی را که سفارش داده بود بدون هیچ مقصدی به اشتراک گذاشته بود، انجام داد. فانلی گفت، شما یک ساعت و 15 دقیقه فرصت دارید تا سوار هواپیما شوید، آنچه را که به او گفته شده بازگو می کند، در حالی که راه می رفت با تلفن خود صحبت می کرد و خورشید پشت سر او می تابد. من دوست دارم کجا؟ اوه خدای من! و آنها اینگونه بودند، ما [تدارکات] را مشخص خواهیم کرد، وقتی به آنجا رسیدید به شما خواهیم گفت. و من می خواهم، برای بیش از یک شب؟ و آنها مانند، بله. همانطور که او به سمت ماشینش می رفت، هنوز مطمئن نبود که برای چه چیزی بسته بندی می کند یا به کجا می رود. او که از ماجراجویی پیش رو هیجان زده به نظر"}, {"source": "Ars Technica", "title": "An undercover Google analyst infiltrated a notorious supply-chain hacking gang", "link": "https://arstechnica.com/security/2026/09/an-undercover-google-analyst-infiltrated-a-notorious-supply-chain-hacking-gang/", "summary": "Before two of its alleged members were arrested and charged in Australia last month, the hacker group known as TeamPCP carried out a hacking spree unlike any other in history. It tainted hundreds of open-source programs with its malware, stole developer accounts to perpetuate that software supply-chain hacking, and even released a Dune -themed self-spreading worm to automate the process, ultimately breaching more than a thousand companies. Now Google’s threat intelligence group has revealed that during a key moment of TeamPCP’s rampage, the company’s own undercover researcher had infiltrated the group—allowing Google to monitor the hacking spree from the inside, warn breach targets, and even help disrupt the group’s attempts to exploit those victims. In a talk at security firm SentinelOne's LABScon research conference today, Google Threat Intelligence Group researcher Austin Larsen will present details on the company’s investigation—and infiltration—of TeamPCP amidst the group’s unprecedented, chaotic supply-chain hacking campaign. According to Larsen, Google eventually followed a trail of operational security mistakes allegedly made by one of the two Australians now accused of being leading members of the hacker group and passed on key identifying details to law enforcement. The company also received intelligence from ShinyHunters, another infamous cybercriminal group that TeamPCP partnered with, but which later turned on the supply-chain hackers. And perhaps most surprisingly, Larsen says that Google’s security subsidiary Mandiant had an undercover analyst—not himself—within the group’s inner circle from almost the beginning of TeamPCP’s time in the spotlight. Read full article Comments", "date_str": "2026-09-20T11:07:00+00:00", "hash": "8387a0dd9523423e", "title_fa": "یک تحلیلگر مخفی گوگل به یک باند بدنام هک زنجیره تامین نفوذ کرد", "summary_fa": "قبل از اینکه دو نفر از اعضای ادعایی آن در ماه گذشته در استرالیا دستگیر و متهم شوند، گروه هکری معروف به TeamPCP اقدام به هک کردن غیرقانونی در تاریخ کرد. صدها برنامه منبع باز را با بدافزار خود آلوده کرد، حساب‌های توسعه‌دهنده را به سرقت برد تا هک زنجیره تامین نرم‌افزار را تداوم بخشد، و حتی یک کرم خودگستر با مضمون Dune را برای خودکارسازی فرآیند منتشر کرد که در نهایت بیش از هزار شرکت را نقض کرد. اکنون گروه اطلاعاتی تهدید گوگل فاش کرده است که در یک لحظه کلیدی از حمله TeamPCP، محقق مخفی خود این شرکت به این گروه نفوذ کرده است - به گوگل اجازه می‌دهد تا هکرها را از داخل نظارت کند، به اهداف نقض هشدار دهد و حتی به اختلال در تلاش‌های گروه برای بهره‌برداری از این قربانیان کمک کند. در یک سخنرانی در کنفرانس تحقیقاتی LABScon شرکت امنیتی SentinelOne امروز، آستین لارسن، محقق گروه اطلاعاتی تهدید گوگل، جزئیاتی را در مورد تحقیقات و نفوذ شرکت به TeamPCP در میان کمپین هک زنجیره تامین بی‌سابقه و آشفته گروه ارائه خواهد کرد. به گفته لارسن، گوگل در نهایت دنباله ای از اشتباهات امنیتی عملیاتی را دنبال کرد که گفته می شد توسط یکی از دو استرالیایی که اکنون متهم به عضویت در گروه هکر هستند مرتکب شده و جزئیات شناسایی کلیدی را به مجریان قانون منتقل کرده است. این شرکت همچنین اطلاعاتی را از ShinyHunters، یکی دیگر از گروه‌های مجرم سایبری بدنام دریافت کرد که TeamPCP با آن شریک شد، اما بعداً هکرهای زنجیره تامین را فعال کرد. و شاید شگفت‌انگیزتر از همه، لارسن می‌گوید که شرکت امنیتی گوگل، Mandiant، تقریباً از ابتدای زمان TeamPCP در کانون توجه، یک تحلیلگر مخفی - نه خودش - در حلقه داخلی گروه داشت."}, {"source": "Ars Technica", "title": "Don't call it an SUV: The Ferrari Purosangue review", "link": "https://arstechnica.com/cars/2026/09/dont-call-it-an-suv-the-ferrari-purosangue-review/", "summary": "Ferrari’s two-seat sports cars might be the brand’s identity, but the Italian automaker has always catered to customers who want to bring more than one passenger along for the ride. It started building cars with back seats in the 1960s with the 250 GT 2+2; as the name suggests, the second row was more for occasional use, something that was true all the way through to the 612 in the early 2000s. Ferrari followed with its first true four-seater, the all-wheel drive FF , which adopted \" Breadvan \" styling. Its first hatchback was still a three-door, though, and slightly more practical for carrying cargo rather than humans in the rear. That was true for the GTC4 that followed , too. But with the Purosangue, the rear passengers have been given something of an upgrade. For one thing, there is an extra pair of doors, rear-hinged ones that provide direct access to the pair of rear bucket seats. There’s still a rear hatch, so this is technically a five-door. But there’s an immovable firewall between the cargo area and the passenger cabin, and the rear seats do not fold flat. So unlike the 21st century breadvans we have previously reviewed, a Costco run in the Purosangue might be possible, but you’re probably going to want a roof rack if you plan to go skiing, cycling, or anything else that requires bulky equipment. It’s also probably accurate that Ferrari says the Purosangue is not an SUV but an FUV—a Ferrari Utility Vehicle. Underneath that long hood lives a 6.5 L naturally aspirated V12, but mounted back in the chassis such that this is technically a front-mid engined layout. That contributes to the 49:51 front-to-rear weight ratio, as does the use of a transaxle gearbox for the rear wheels (an eight-speed, dual-clutch box); a separate power transfer unit at the front of the engine drives the front wheels, for this is an all-wheel drive Ferrari. But make no mistake, it’s a substantial one, too, befitting that massive 715 hp (533 kW), 528 lb-ft (716 Nm) engine: 195.8 inches (4,973 mm) long, 79.8 inches (2,028 mm) wide, 62.6 inches (1,589 mm) tall, with a 118.1-inch (3,018 mm) wheelbase and a 4,784 lbs (2,170 kg) curb weight. Read full article Comments", "date_str": "2026-09-20T10:00:02+00:00", "hash": "b2b00d34fa6e4064", "title_fa": "آن را SUV نگویید: بررسی فراری Purosangue", "summary_fa": "خودروهای اسپرت دو سرنشین فراری ممکن است هویت این برند باشند، اما این خودروساز ایتالیایی همیشه به مشتریانی که می‌خواهند بیش از یک مسافر را برای سواری همراه خود بیاورند، توجه کرده است. در دهه 1960 با 250 GT 2+2 شروع به ساخت خودروهایی با صندلی عقب کرد. همانطور که از نام آن پیداست، ردیف دوم بیشتر برای استفاده گاه و بیگاه بود، چیزی که در تمام مسیرهای 612 در اوایل دهه 2000 صادق بود. فراری با اولین خودروی چهار نفره واقعی خود، FF تمام چرخ متحرک، که از سبک \"Breadvan\" استفاده کرد، استفاده کرد. اگرچه اولین هاچ بک آن هنوز سه در بود و برای حمل بار به جای انسان در عقب کمی کاربردی تر بود. این در مورد GTC4 که پس از آن نیز وجود داشت نیز صادق بود. اما با Purosangue، سرنشینان عقب چیزی شبیه به ارتقا یافته اند. برای یک چیز، یک جفت در اضافی وجود دارد، درهای لولایی عقب که دسترسی مستقیم به جفت صندلی سطلی عقب را فراهم می کند. هنوز یک دریچه عقب وجود دارد، بنابراین از نظر فنی یک دریچه پنج در است. اما بین قسمت بار و کابین سرنشین یک دیوار آتش غیر قابل حرکت وجود دارد و صندلی‌های عقب صاف نمی‌شوند. بنابراین برخلاف نان‌وان‌های قرن بیست و یکمی که قبلاً بررسی کرده‌ایم، یک مسابقه Costco در Purosangue ممکن است امکان‌پذیر باشد، اما اگر قصد دارید به اسکی، دوچرخه‌سواری یا هر چیز دیگری که نیاز به تجهیزات حجیم دارد، احتمالاً یک قفسه سقفی می‌خواهید. همچنین احتمالاً درست است که فراری می‌گوید Purosangue یک SUV نیست بلکه یک FUV است - یک خودروی کاربردی فراری. در زیر این کاپوت بلند، یک V12 تنفس طبیعی 6.5 لیتری وجود دارد، اما پشت در شاسی نصب شده است که از نظر فنی، یک طرح موتور جلو وسط است. این به نسبت وزن جلو به عقب"}, {"source": "Ars Technica", "title": "T. rex teeth indicate it ran as warm as an elephant", "link": "https://arstechnica.com/science/2026/09/t-rex-teeth-indicate-it-ran-as-warm-as-an-elephant/", "summary": "For most of the last century, T. rex was pictured as a sluggish, tail-dragging reptile that had to warm up in the sun before it could go anywhere. Then, further research changed that view, replacing it with the active, bird-like animal shown in the movie Jurassic Park . But whether T. rex used warm blood to power that activity remained a question. Now we might have gotten closer to an answer. A team of researchers led by Randon J. Flores and Robert A. Eagle, geochemists at the University of California, Los Angeles, has measured the T. rex body temperature by analyzing its teeth. This dental thermometer read about 36° Celsius—roughly the body temperature of a modern elephant. Dental thermometry Paleontologists have long argued about dinosaur physiology based on indirect evidence like bone microstructure, growth rates, and where fossils turn up on the map. Some studies suggested many dinosaurs were endotherms, generating their own body heat like birds and mammals. Others argued that each lineage may have had its own thermal strategy. Read full article Comments", "date_str": "2026-09-20T09:00:11+00:00", "hash": "f175fc047c27e062", "title_fa": "دندان های تی رکس نشان می دهد که به اندازه یک فیل گرم می دوید", "summary_fa": "در بیشتر قرن گذشته، تی رکس به عنوان یک خزنده تنبل و دم کشیده تصویر می شد که قبل از اینکه بتواند به جایی برود، باید زیر نور خورشید گرم می شد. سپس، تحقیقات بیشتر این دیدگاه را تغییر داد و جانور پرنده‌مانندی که در ake. Football Sundays are officially back, and my recipe for easy slow-cooker Buffalo chicken dip is guaranteed to be the MVP at any party. Practically every time I entertain friends — be it for game day , the Super Bowl, or any party — I'm always asked if I'll be making my famous Buffalo chicken dip. Over the years, I've tweaked recipes I've seen online to come up with the easiest, most crowd-pleasing dip. It requires only six main ingredients, plus seasonings you'll probably already have in your pantry. Here's how to make my easy slow-cooker Buffalo chicken dip. My recipe for slow-cooker Buffalo chicken dip requires only six main ingredients. Erin McDowell/Business Insider To make the dip, which feeds about 10 people, you'll need: A 6-quart slow cooker or Crock-Pot A rotisserie chicken (or 1 lb of cooked chicken) 12 fluid ounces Frank's RedHot Buffalo sauce ½ cup ranch dressing 16-ounce cream cheese 1 cup shredded cheddar cheese 1 cup shredded mozzarella cheese Salt, pepper, garlic powder I always start by separating the breasts from the rotisserie chicken and removing the skin. Erin McDowell/Business Insider I like to use rotisserie chicken for this recipe because it's often easier and cheaper than buying chicken breasts and boiling them myself. I find that the rotisserie chicken also packs much more flavor, and saves me from having to do any actual cooking. When it comes to game-day recipes, easiest is usually best. Then I shred the rotisserie chicken. Erin McDowell/Business Insider I usually do this step by hand, but you can also use two forks to shred your chicken. By the end, you should have about 3 cups of shredded rotisserie chicken. I put the cream cheese in the slow cooker and cut it into cubes with a knife. Erin McDowell/Business Insider This helps ensure the cream cheese melts evenly and is well-distributed throughout the dip. You can use full-fat or low-fat cream cheese for this dip, depending on your preference — I've had success using both. I then add the rotisserie chicken to the slow cooker and season it. Erin McDowell/Business Insider I usually eyeball how much seasoning I use, but typically go for about a tablespoon of garlic powder, a tablespoo", "date_str": "2026-09-20T13:12:01+00:00", "hash": "9d3bc021d841e66e", "title_fa": "من این دیپ مرغ آهسته پز بوفالو 6 ماده ای را هر روز بازی درست می کنم. همیشه برای جمعیت خوشایند است.", "summary_fa": "دیپ مرغ بوفالو تنها به شش ماده نیاز دارد. ارین مک داول/Business Insider من همان دیپ مرغ بوفالو را برای هر مهمانی، روز بازی و سوپر بول درست می کنم. این فقط شش ماده به اضافه ادویه ها نیاز دارد و در یک اجاق گاز آهسته می آید. این برای جمعیت خوشایندتر است و ساختن آن به طرز باورنکردنی آسان است. یکشنبه‌های فوتبال رسماً بازگشته‌اند، و دستور غذای من برای غذای آهسته‌پز مرغ بوفالو تضمین شده است که MVP در هر مهمانی باشد. تقریباً هر بار که دوستان را سرگرم می کنم - چه برای روز بازی، سوپر بول یا هر مهمانی دیگری - همیشه از من می پرسند که آیا می خواهم دیپ مرغ بوفالو معروفم را درست کنم. در طول سال‌ها، من دستور العمل‌هایی را که به صورت آنلاین دیده‌ام تغییر داده‌ام تا ساده‌ترین و جذاب‌ترین غذا را به دست بیاورم. این فقط به شش ماده اصلی نیاز دارد، به علاوه چاشنی هایی که احتمالاً از قبل در انبار خود خواهید داشت. در اینجا طرز تهیه دیپ مرغ بوفالو آهسته پز من آورده شده است. دستور من برای دیپ مرغ بوفالو آهسته پز فقط به شش ماده اصلی نیاز دارد. ارین مک داول/Business Insider برای درست کردن این غذا که حدود 10 نفر را تغذیه می کند، به این موارد نیاز دارید: یک اجاق گاز آهسته 6 لیتری یا دیگ یک مرغ جوجه گردان (یا 1 پوند مرغ پخته) 12 اونس مایع سس بوفالو Frank's RedHot ½ فنجان پنیر خامه ای سرخ شده 1 فنجان پنیر خامه ای 1 فنجان فنجان پنیر موزارلای رنده شده نمک، فلفل، پودر سیر من همیشه با جدا کردن سینه ها از مرغ جوجه گردان و جدا کردن پوست شروع می کنم. Erin McDowell/Business Insider من دوست دارم از مرغ جوجه گردان برای این دستور غذا استفاده کنم، زیرا اغلب راحت تر و"}, {"source": "Business Insider", "title": "Half the drones in a recent US Army combat exercise were designed to be expendable", "link": "https://www.businessinsider.com/half-of-drones-at-us-army-exercise-were-expendable-2026-9", "summary": "The war in Ukraine has shown the value of soldiers having a lot of drones they can expend without worrying about replacing them. US Army photo by Staff Sgt. Trevin Rund US Army soldiers used about 2,000 attack drones in a recent exercise. Half of those systems were designed to be consumable and used like ammunition. Army officials and leaders have said small, low-cost drones are more useful in larger volumes. The US Army brought thousands of drones to a recent combat exercise, and roughly half were designed to be expendable. Soldiers could use and lose the drones in the fight, treating them like ammunition. The Army's shift toward using low-cost drones has relied on amassing enough systems to make them expendable. It's getting tens of thousands of drones to soldiers through the Drone Dominance Program, the goal being that soldiers use these systems without worrying about quickly coming up empty. At the recent Saber Junction exercise in Germany, Army soldiers used approximately 1,900 autonomous systems. \"Those numbers continue to increase every rotation, and we will continue to increase them in future rotations,\" Maj. Gen. Christopher Norrie, acting commander of US Army Europe and Africa, told reporters at a roundtable on Thursday, which Business Insider received a transcript of. Of those roughly 2,000 drones used during the exercise, \"1,000 were consumable,\" Brig. Gen. Terry Tillis, head of the 7th Army Training Command, said, adding that soldiers were using them \" like a munition .\" \"They're fired, and then it's employing them in a matter to achieve effects on the battlefield,\" he said. At the Saber Junction exercise, US soldiers used drones in different combat scenarios , some informed by the war in Ukraine, against electronic warfare and counter-drone systems. Army officials said replicating more challenging environments was important for giving soldiers realistic experiences. Using a bunch of drones was similarly important, as \"those drones are now a part of our basics of being able to survive and integrate into protection plans, using them to sense further and strike faster,\" Norrie said. Other Army leaders have said drones are more of a niche capability if soldiers only have a few of them. US Army photo by SPC. Kaleb Lampkin Russia's war in Ukraine has shown that while drones do not always replace more exquisite strike capabilities, they can offer soldiers a low-cost and effective method for hitting enemy targets. Not worrying about losing the drones", "date_str": "2026-09-20T12:47:01+00:00", "hash": "fdd3a4a74b53dc75", "title_fa": "نیمی از پهپادها در رزمایش اخیر ارتش ایالات متحده به گونه ای طراحی شده اند که قابل مصرف باشند", "summary_fa": "جنگ در اوکراین نشان داد که سربازان دارای پهپادهای زیادی هستند که می توانند بدون نگرانی در مورد تعویض آنها خرج کنند. عکس ارتش ایالات متحده توسط گروهبان ستاد. سربازان ارتش ایالات متحده تروین راند در تمرین اخیر از حدود 2000 پهپاد تهاجمی استفاده کردند. نیمی از این سیستم ها به گونه ای طراحی شده بودند که قابل مصرف باشند و مانند مهمات مورد استفاده قرار گیرند. مقامات و رهبران ارتش گفته اند پهپادهای کوچک و کم هزینه در حجم های بزرگتر مفیدتر هستند. ارتش ایالات متحده هزاران پهپاد را به رزمایش اخیر آورده است و تقریباً نیمی از آنها به گونه ای طراحی شده بودند که قابل مصرف باشند. سربازان می توانند از پهپادها در جنگ استفاده کنند و آنها را از دست بدهند و با آنها مانند مهمات رفتار کنند. تغییر ارتش به سمت استفاده از پهپادهای ارزان قیمت متکی به جمع آوری سیستم های کافی برای ساخت آنها قابل مصرف است. ده‌ها هزار پهپاد را از طریق برنامه تسلط هواپیماهای بدون سرنشین به سربازان می‌رساند، هدف این است که سربازان از این سیستم‌ها بدون نگرانی در مورد خالی شدن سریع استفاده کنند. در رزمایش اخیر Saber Junction در آلمان، سربازان ارتش از حدود 1900 سیستم خودگردان استفاده کردند. سرلشکر کریستوفر نوری، فرمانده موقت ارتش آمریکا در اروپا و آفریقا، روز پنجشنبه در میزگردی که Business Insider متنی از آن را دریافت کرد، به خبرنگاران گفت: «این اعداد همچنان در هر چرخش افزایش می‌یابند، و ما در چرخش‌های آینده به افزایش آن‌ها ادامه خواهیم داد». از حدود 2000 پهپاد مورد استفاده در این رزمایش، \"1000 مورد مصرفی بود.\" ژنرال تری تیلیس، رئیس فرماندهی آموزش ارتش هفتم، گفت که سربازان از آنها \"مانند مهمات\" استفاده می کنند. او گفت: \"آنها اخراج می شوند و سپس آنها را در یک موضوع به کار می گیرد تا در میدان نبرد تأثیر"}, {"source": "Business Insider", "title": "I stayed at a Chicago hotel that was once a Gilded Age men's club. The history drew me in, but playful details won me over.", "link": "https://www.businessinsider.com/chicago-athletic-association-hotel-review-2026-9", "summary": "The Chicago Athletic Association is a hotel that was once an ultra-exclusive gentlemen s club. Business Insider s reporter booked a stay. Joey Hadden/Business Insider When I checked in at the Chicago Athletic Association, I felt transported to the Gilded Age. But that was just the beginning of my stay at the 19th-century private club turned hotel. Parts of the hotel appeared frozen in time, while others breathed new life into its history. I've never been good at sports, and I've never been fond of exercise, so you might be wondering why I chose the Chicago Athletic Association when booking hotels for my first-ever trip to the city. I wanted to step back in time. The Gilded Age hotel was a private club where professional athletes and high-profile individuals trained and socialized from 1893 to 2007. Following its closure and a lengthy transformation project, the Chicago Athletic Association reopened as a hotel in 2015. I spent one night there in February for $250. It felt extremely luxurious for the price point, and some surprising details made me certain I'd book it again. Parts of my stay felt like a time warp, but the hotel's history also came out in ways I didn't see coming. Welcome to the Chicago Athletic Association, the 19th-century private club that s now a hotel. Joey Hadden/Business Insider The Venetian-Gothic-style building was designed by architect and club member Henry Ives Cobb, who took inspiration from the Doge's Palace in Venice, according to the hotel's website . The hotel stood out to me among modern buildings on Michigan Avenue in Downtown Chicago. It's just across from Millennium Park and the Bean (formally known as Cloud Gate) and within walking distance of many tourist hot spots like the Art Institute of Chicago, the Chicago Theater, and the Chicago Riverwalk. Inside, the past lives on. Joey Hadden/Business Insider The Chicago Athletic Association began as a Gilded Age gentlemen's club joined by influential sports icons. Membership opened to women in 1972. It was a stomping ground for industry moguls like William Wrigley and Marshall Field . It was a training base for five-time Olympic gold-medal swimmer Johnny Weissmuller and the first professional football player, William \"Pudge\" Heffelfinger. The building's history is celebrated inside the hotel, with 19th-century relics and refurbished materials, from wood paneling to marble flooring, Elizabeth Story, the hotel's sales and marketing director, told Business Insider. As I stepped in", "date_str": "2026-09-20T12:10:01+00:00", "hash": "29d611ffbe5c9bf9", "title_fa": "در هتلی در شیکاگو که زمانی باشگاه مردانه عصر طلایی بود، اقامت داشتم. تاریخ مرا جذب کرد، اما جزئیات بازیگوش مرا جلب کرد.", "summary_fa": "انجمن ورزشی شیکاگو هتلی است که زمانی یک باشگاه فوق العاده انحصاری آقایان بود. خبرنگار Business Insider اقامتی را رزرو کرده است. جوی هادن/خودی تجاری وقتی در انجمن ورزشی شیکاگو ثبت نام کردم، احساس کردم که به عصر طلایی منتقل شده ام. اما این تازه آغاز اقامت من در کلوب خصوصی قرن نوزدهمی بود که تبدیل به هتل شد. بخش هایی از هتل در زمان یخ زده به نظر می رسید، در حالی که برخی دیگر جان تازه ای در تاریخ آن دمیدند. من هرگز در ورزش خوب نبودم و هرگز به ورزش علاقه نداشتم، بنابراین ممکن است تعجب کنید که چرا هنگام رزرو هتل برای اولین سفرم به این شهر، انجمن ورزشی شیکاگو را انتخاب کردم. می خواستم در زمان به عقب برگردم. هتل طلایی عصر یک باشگاه خصوصی بود که در آن ورزشکاران حرفه ای و افراد برجسته از سال 1893 تا 2007 در آن آموزش می دیدند و اجتماعی می شدند. پس از بسته شدن آن و یک پروژه تحول طولانی، انجمن ورزشی شیکاگو به عنوان یک هتل در سال 2015 بازگشایی شد. من در ماه فوریه یک شب را با 250 دلار آنجا گذراندم. نسبت به قیمت بسیار لوکس به نظر می رسید، و برخی جزئیات غافلگیرکننده باعث شد مطمئن شوم که دوباره آن را رزرو خواهم کرد. بخش‌هایی از اقامت من مانند یک پیچ و تاب زمانی بود، اما تاریخچه هتل نیز به گونه‌ای آشکار شد که من نمی‌دانستم که در راه باشد. به انجمن ورزشی شیکاگو، باشگاه خصوصی قرن نوزدهمی که اکنون به یک هتل تبدیل شده است، خوش آمدید. Joey Hadden/Business Insider بنا به وب سایت هتل، ساختمان به سبک ونیزی-گوتیک توسط معمار و عضو باشگاه هنری ایوز کاب طراحی شده است که از کاخ دوج در ونیز الهام گرفته است. هتل در میان ساختمان‌های مدرن در خیابان میشیگان در مرکز شهر شیکاگو"}, {"source": "Business Insider", "title": "I left New York, moved to Boston, and had 3 kids. Along the way, I built a career that looks nothing like the one I planned.", "link": "https://www.businessinsider.com/moved-from-nyc-boston-had-kids-while-building-career-2026-9", "summary": "The author pictured a completely different career for herself when she was young. Courtesy of Jenn Sinrich I always wanted to work at magazines, but when I did, it wasn't quite what I imagined. I wanted to write more, and went freelance. Then, my husband and I moved from New York to Boston. While building our family, I also built a career I love. As a teenager, I'd sit on my bed flipping through glossy magazines, fascinated and completely absorbed by the empowering stories about women. The news felt dominated by men, but magazines seemed to offer a different world — one where women's lives, bodies, careers, and opinions were worthy of entire pages. I knew from an early age I wanted to help bring more of those stories to life. In 2012, after studying journalism at Northeastern University, I moved to New York City as quickly as I could, interning at Ladies' Home Journal and Self , then gravitating toward parenting publications including What To Expect, American Baby, and Fit Pregnancy. Motherhood fascinated me long before I became a mother . It was the same intrigue and interest that drew me to magazines — the power of women, what their bodies could do, and the enormity of the identity shift involved in raising a child. Writing about pregnancy and parenting somehow felt very natural to me, even when I understood both mostly in theory. The author decided to go freelance so she could write more. Courtesy of Jenn Sinrich I loved editing, but I wanted to write Working at magazines wasn't quite how I'd imagined it from my childhood bedroom . I loved editing: finding the heart of a story, moving pieces around, and helping a writer say what they were trying to say. My boss, Mindy, was one of the first people to make me believe that my creativity and instincts were worth trusting. She taught me nearly everything I knew about shaping a narrative. But I also began to feel restless. I was putting so much of myself into stories that ultimately ran under somebody else's name. I longed for that authorship and craved the terrifying privilege of starting with a blank page, figuring out what I had to say, and hoping it might matter to even one reader. Mindy warned me that freelancing would be hard . I believed her and quit anyway. I had just gotten engaged, was planning a wedding, and was already thinking about having children. I also knew that if I kept waiting to feel established enough to become a writer, I might spend my entire career editing other people's work. The aut", "date_str": "2026-09-20T12:07:01+00:00", "hash": "55f65ab50106235b", "title_fa": "من نیویورک را ترک کردم، به بوستون نقل مکان کردم و 3 فرزند داشتم. در طول مسیر، شغلی ساختم که هیچ شباهتی به آنچه برنامه ریزی کرده بودم نداشت.", "summary_fa": "نویسنده در جوانی حرفه ای کاملا متفاوت را برای خود به تصویر کشید. با حسن نیت از جن سینریچ من همیشه می خواستم در مجلات کار کنم، اما و hared with my husband. My new temporary home is my parents' converted single-car garage , a roughly 150-square-foot casita. I have asked for a divorce, although we haven't filed anything yet, so I'm still getting used to saying that word. My marriage had reached a point where I knew I needed to leave. Friends offered me places to stay, but my parents are both in their early 70s , and I wanted to spend time with them. However, the idea of living together still scared me. Our relationship was especially rocky around the time I left home as a teenager, when I vowed I would never live with them again. We've all changed and grown in the 20 years since. I've matured and gained perspective with age, and they've softened and become more introspective. The casita also offers more privacy than living in my old bedroom would. Still, I worried moving back home would return us to those old dynamics, but it's only been a gift. The author has a sofa and a bunk bed in her space. Courtesy of Camilla Richardson Living in such a small space has challenges The casita is about 10 feet by 15 feet, and an adult life does not fit neatly into that square footage. But in reality, it's enough. It holds a bunk bed, a sofa, a kitchenette, a dresser, and a small bathroom. There's even a little portable island for me to sit at, though I use it to hold books and paperwork at the moment. Laundry and cleaning supplies are accessible in the main house, but my trips over are most often to spend time with my parents rather than for practical reasons. I'm still moving belongings out of my house and deciding what deserves a spot here. I've downsized my clothes and cleared out makeup and skincare products I wasn't using. My book collection is harder to cull; I love my books, and haven't figured out what to do about that yet. The room was already furnished when I moved in, and we swapped a wardrobe for a more practical clothing rack; my mom donated the former, along with some shelves, to make space. I didn n Simat de la Valldigna. Courtesy of Kevin Schreck Kevin Schreck moved from a small town in North Carolina to Valencia, Spain, for a teaching program. Schreck expected a short stay, but fell for Valencia and does not plan to return to the US. He told Business Insider that he feels safer and happier in Spain, and his life is more affordable. This as-told-to essay is based on a conversation with Kevin Schreck, a 33-year-old from North Carolina who moved to Spain in 2018. The conversation has been edited for length and clarity. I was pursuing a master's in Spanish when I met my husband, who was also working on his master's. He's from Valencia , so when we finished our programs, I thought, \"He's lived here for a couple of years, why don't I go ahead and try Spain?\" I applied to a Spanish program that places native English speakers in public schools as classroom language assistants. I got really lucky and was assigned to a school in Valencia. At first, my plan was to live there for a couple of years, improve my Spanish, and then return to the US to become a language teacher. I imagined having the typical American dream, you know, a house with a big yard and all that. But I fell in love with Spain . I have so many fond memories of my first year in Valencia. I was this guy from Wilmington, North Carolina, learning about a new culture, trying new foods, meeting a ton of people, and going out with my husband and his friends. I know I'm lucky, and not everyone has that experience. It's easy to get disillusioned when you're in a new country and don't have a community. But having my husband with me allowed me to immerse myself. It gave me an advantage, an easier way in, and that's something I really appreciate now. Now I'm getting my Spanish citizenship Moving abroad was pretty easy. The teaching program provided me with a student visa, so I didn't have to figure everything out on my own or work with lawyers. I was earning €1,000 ($1,146) a month through the program. It wasn't an amazing salary, but it was fairly typical and enough to live on. At the time, my partner and I rented an apartment in a decent area for €700 ($802) a month, which we split, so I could cover my rent and bills and still save a little. It took me three months to receive my first payment. I was a recent college graduate relying on my savings, so that period was really stressful. But in the end, it all worked out. I stayed in the program for a couple of years, which also made it eas", "date_str": "2026-09-20T11:20:01+00:00", "hash": "bd7b6fe854bde452", "title_fa": "فکر می کردم رویای آمریکایی را می خواهم. نقل مکان به شهر کوچکی در اسپانیا نظرم را تغییر داد.", "summary_fa": "کوین شرک در سیمات د لا والدینا. با حسن نیت از کوین شرک کوین شرک از شهری کوچک در کارولینای شمالی به والنسیا، اسپانیا، برای یک برنامه آموزشی نقل مکان کرد. شرک انتظار اقامت کوتاهی داشت، اما به والنسیا افتاد و قصد بازگشت به ایالات متحده را ندارد. او به Business Insider گفت که در اسپانیا احساس امنیت و شادی بیشتری می کند و زندگی او مقرون به صرفه تر است. این مقاله گفته شده بر اساس گفتگو با کوین شرک، یک 33 ساله از کارولینای شمالی است که در سال 2018 به اسپانیا نقل مکان کرد. گفتگو برای طولانی بودن و وضوح ویرایش شده است. در حال ادامه تحصیل در مقطع کارشناسی ارشد به زبان اسپانیایی بودم که با شوهرم آشنا شدم که او نیز در کار کارشناسی ارشد خود بود. او اهل والنسیا است، پس وقتی برنامه‌هایمان را تمام کردیم، فکر کردم، \"او چند سالی است که اینجا زندگی می‌کند، چرا من ادامه ندهم و اسپانیا را امتحان نکنم؟\" من برای یک برنامه اسپانیایی درخواست دادم که انگلیسی زبانان بومی را در مدارس دولتی به عنوان دستیار زبان کلاس درس قرار می دهد. من واقعاً خوش شانس بودم و به مدرسه ای در والنسیا منصوب شدم. در ابتدا، برنامه من این بود که چند سال در آنجا زندگی کنم، زبان اسپانیایی خود را بهبود بخشم و سپس به ایالات متحده برگردم تا معلم زبان شوم. من رویای معمولی آمریکایی را تصور کردم، می دانید، خانه ای با حیاط بزرگ و همه چیز. اما من عاشق اسپانیا شدم. من خاطرات بسیار خوبی از اولین سال حضورم در والنسیا دارم. من این مرد اهل ویلمینگتون، کارولینای شمالی بودم که در مورد فرهنگ جدیدی یاد می‌گرفتم، غذاهای جدید را امتحان می‌کردم، با افراد زیادی ملاقات می‌کردم و با شوهرم و دوستانش بیرون می‌رفتم. می دانم که خوش شانس هستم و همه"}, {"source": "Business Insider", "title": "My outdoorsy husband didn't want to take a baby and a toddler camping. I insisted — and regretted it by 2 a.m.", "link": "https://www.businessinsider.com/camping-baby-toddler-husband-was-right-family-trip-2026-9", "summary": "The author went camping with her family, but it only lasted 36 hours. Courtesy of the author I convinced my reluctant husband to take our two young kids camping. Mosquito bites and the summer heat kept our toddler awake and miserable. We abandoned the trip after 36 hours but decided to try camping again. The first sign that our family camping trip was a bad idea was that my husband and I were fighting. Although he was a rugged outdoorsman who took frequent solo kayaking expeditions in the wilderness, he hated dragging our two kids into the woods in the peak of summer heat and mosquito season. I disagreed. I'd only discovered a love for the outdoors as an adult, but I had a vision: our family playing in the water, me lounging by the lake in my sundress while the 13-month-old napped. In truth, I had mid-summer anxiety and was desperate. Born in East Africa, I hated Minnesota winters . So I was frantic when I realized it was July and we hadn't moved beyond a 10-mile radius of our home. I wanted our family to make memories in the woods, and I wanted it now. We went camping with our 2 kids Finally, he consented. He booked two nights in a state forest at the edge of the Boundary Waters, a massive forest on the border of Minnesota and Canada. The author s husband set up the campsite. Courtesy of the author The next sign of trouble: we weren't prepared. With three days to go before we left, we dashed around the city for essentials in 90-degree weather: a clunky fan from Cabela's and a screen shelter from the RV store (that turned out to be gazebo-sized and had to be replaced). I balked at the $100 camping chair but added it to the cart anyway. Finding the right tent was a challenge. We had a two-person backpacking tent from life before kids. A no-go. Luckily, a friend lent us his tent. We packed enough for two weeks, and by the miracle of extra daylight, we were ready to go by Friday. We arrived at the campsite. I slapped citronella spray on my toddler's legs before she excitedly ran through the winding path from our campsite to the water. I followed her, and my daughters and I sat by the water, watching three boys hunt tadpoles. I didn't notice the bug bites she was getting, preoccupied with blocking the sticks my newly mobile infant was trying to sneak into her mouth. The kids woke up at 2 a.m. We quickly learned that camping with young kids was just like parenting at home, only with fewer amenities, more dust, and no safe spot to park our infant. After dinner, ", "date_str": "2026-09-20T11:17:01+00:00", "hash": "80eabf7c73c6a5c6", "title_fa": "شوهر من در فضای باز نمی خواست یک نوزاد و یک کودک نوپا را به کمپینگ ببرد. من اصرار کردم - و تا ساعت 2 صبح پشیمان شدم.", "summary_fa": "نویسنده با خانواده اش به کمپینگ رفت، اما تنها 36 ساعت طول کشید. با حسن نیت نویسنده، شوهرم را متقاعد کردم که دو بچه خردسال ما را به کمپینگ ببرد. نیش پشه و گرمای تابستان کودک نوپای ما را بیدار و بدبخت نگه داشته است. ما سفر را پس از 36 ساعت رها کردیم اما تصمیم گرفتیم دوباره کمپینگ را امتحان کنیم. اولین نشانه ای که نشان می دهد سفر کمپینگ خانوادگی ما ایده بدی بود، دعوای من و شوهرم بود. اگرچه او مردی سرسخت در فضای باز بود که به طور مکرر در بیابان به کایاک سواری انفرادی می رفت، اما از کشیدن دو بچه ما به جنگل در اوج گرمای تابستان و فصل پشه متنفر بود. من مخالفت کردم. من فقط در بزرگسالی عشق به خارج از منزل را کشف کرده بودم، اما یک چشم انداز داشتم: خانواده ما در آب بازی می کردند، من با سارافان کنار دریاچه استراحت می کردم در حالی که کودک 13 ماهه چرت می زد. در حقیقت، من در اواسط تابستان اضطراب داشتم و مستأصل بودم. من در شرق آفریقا به دنی etchy, and super soft. It remains one of the comfiest things I've ever had on my body. Though the pants come in petite and long inseams, Spanx recommends the regular length for someone 5-foot-7. I selected the Wide-Leg Pants in a size Medium, with a Half-Zip sweatshirt in a size Small. Both fit me impeccably. I wear the whole set with crisp, white sneakers and oversized sunglasses. It's not often I feel fancy in sweats, but all together this look makes me feel glamorous in a dressed-down kind of way. I machine washed mine with cold water and tumbled dried low per the manufacturer's instructions, and was pleasantly surprised to find zero shrinkage the next time I wore it. Another little bonus with the fabric is that it offers UPF 50+ protection. How the $40 Amazon sweatsuit compares For only $54, this Amazon is pretty similar to its pricier counterpart. Talia Ergas/Business Insider Meanwhile, the Amazon version is sold as a full set. I ordered the rich, dark brown color called Coffee. When I opened the zippered plastic bag it came in, it was exactly the hue I expected. The stretchy, silky-soft, medium-weight fabric is also much more expensive-looking than I anticipated. And it feels just like the Spanx AirEssentials fabric. I love how comfortable the top feels, and it looks equally stylish with leggings or", "date_str": "2026-09-20T11:00:01+00:00", "hash": "a45a1a37c979a604", "title_fa": "من نسخه 40 دلاری مانتو اسپانکس مورد علاقه ام آمازون را امتحان کردم. انتظار نداشتم اینقدر تحت تاثیر قرار بگیرم.", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید Talia Ergas/Business Insider از میان تمام لباس‌هایی که من امتحان کرده‌ام، ست AirEssentials اسپانکس استاندارد طلایی است. من شنیده بودم که هم توسط ویراستاران خودمان و هم اپرا مورد تمجید قرار گرفته است، قبل از اینکه بالاخره یکی دو سال پیش خودم را دریافت کنم. از آنجایی که خیلی آن را دوست داشتم، در فکر سرمایه‌گذاری روی یک لباس ورزشی دوم اسپانکس بودم، اما ales specialist. Google soon offered him the position, with a six-figure salary. Waters wasn't sure he wanted to return. He'd grown frustrated with the bureaucracy at Google and how the reorganization that eliminated his team had been handled. But walking away meant giving up about a few hundred thousand dollars in unvested equity. \"I killed myself working and dedicating myself, and then all I got to show for it was getting let go,\" said the 42-year-old, who lives in San Francisco. He'd also dreamed of starting his own company. The layoff, he said, \"ripped the bandaid off.\" Waters decided to bet on himself and pursue Kanawai AI, a startup he cofounded. \"All the equity that was unvested was gone,\" he said. \"I went from making very high six figures to zero.\" Rob Waters chose to pursue an AI startup rather than return to Google and continue vesting his equity. Rob Waters Stock compensation has long given Big Tech workers a powerful incentive to stay put. Since the end of 2022, shares of Meta, Alphabet, Amazon, Apple, and Microsoft have all at least doubled. But years of Big Tech layoffs have reminded some workers that their stock compensation isn't guaranteed. Meanwhile, the AI boom has created another path to potential equity riches. And for some workers, years of gains on vested stock have given them the financial security to leave Big Tech on their own terms. When Big Tech stock makes leaving easier Julie Zhu, 29, had wanted to become a founder since she was 18 and said she'd developed a \"love-hate relationship\" with Apple, where she worked as a product designer. She was grateful for what she'd learned at the company but said it was a high-pressure, high-stress environment. She wanted more control over her work. Still, Zhu wanted to make sure she could afford the risk of leaving. Her goal was to have three to five years of runway. Her Apple stock came in handy. \"I didn't s", "date_str": "2026-09-20T10:30:01+00:00", "hash": "d6b9dc7150888e80", "title_fa":
