  <script>

om/a/trump-confirms-us-strike-on-iran/33889786.html", "summary": ".", "date_str": "2026-11-03T14:51:57+00:00", "hash": "d2951f13f842d813", "title_fa": "ترامپ حمله به قشم را تأیید کرد؛ رضایی: پاسخ آمریکا در مذاکرات «قانع‌کننده» نبود", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا، روز سه‌شنبه ۱۲ آبان در گفت‌وگوی تلفنی با شبکه فاکس‌نیوز اعلام کرد که ایالات متحده شب گذشته حملاتی را علیه ایران انجام داده است. از سوی دیگر دبیر شورای عالی امنیت ملی جمهوری اسلامی اعلام کرد پاسخ آمریکا به طرح پیشنهادی ایران «قانع‌کننده» نیست. دونالد ترامپ در برنامه «فاکس اند فرندز» گفت: «آن‌ها یک تأسیسات ضدهوایی ساخته بودند... به‌محض اینکه ساخت آن به پایان رسید، دیشب به‌خوبی آن را هدف قرار دادیم.» ساعاتی پیش رسانه‌های آمریکایی از جمله روزنامه وال‌استریت جورنال و شبکه خبری سی‌ان‌ان از حملات محدود دوشنبه‌شب به جزیره قشم و پدافند هوایی آن با هدف «حفاظت از نیروها و تجهیزات نظامی آمریکا در منطقه» بوده است. رئیس‌جمهور آمریکا در بخش دیگری از گفت‌وگو با فاکس نیوز بار دیگر تهدیدهای خود درباره احتمال اقدام نظامی را تکرار کرد و به شبکه فاکس‌نیوز گفت: «من به دنبال کشتن شمار زیادی از مردم نیستم؛ اما اگر مجبور شویم، این کار را خواهیم کرد.» این اظهارات در حالی مطرح می‌شود که کشورهای منطقه خود را برای احتمال ازسرگیری حملات آمریکا پس از انتخابات میان‌دوره‌ای این کشور آماده می‌کنند. با این حال، ترامپ روز دوشنبه درباره عملی کردن تهدیدهایش برای ازسرگیری حملات نظامی پس از انتخابات ابراز تردید کرده بود. او گفت معتقد است تهران در پی دستیابی هرچه سریع‌تر به توافق است و چنین توافقی «ممکن است حاصل شود». محسن رضایی، دبیر شورای عالی امنیت ملی ایران، روز سه‌شنبه با انتشار متنی در شبکه ایکس گفت که پاسخ آمریکا به مطالبات ایران قانع‌کننده نبوده است. او خواستار تحقق «کامل و صریح» هفت شرط ایران توسط آمریکا شد و افزود: «تنها در این صورت تنگه هرمز باز خواهد شد.» ساعاتی پیش‌تر نیز محمدباقر قالیباف، رئیس مجلس شورای اسلامی و مذاکره‌کننده ارشد ایران، کشورهای منطقه خاورمیانه را تهدید کرد و گفت «توپ در زمین آمریکاست که از جنگ جلوگیری", "image_url": "https://gdb.rferl.org/9938205d-a094-4242-9193-b0f78e7c0253_w1200_h630.jpg", "categ متمرکزی رخ دهد، تبعات آن می‌تواند کل نظام بانکی را تحت تاثیر قرار دهد. - مرتضی ترک‌تبریزی ، رئیس هیئت‌مدیره بانک تجارت او با بیان اینکه نگاه به زیرساخت‌های بانکی هم‌چنان تحت تاثیر تفکر تمرکزگرایانه گذشته است، گفت: «با وجود توسعه فناوری‌هایی مانند بلاکچین و راهکارهای نرم‌افزاری و زیرساخت‌های توزیع‌شده، هم‌چنان بر تمرکزگرایی اصرار داریم. در بسیاری از موارد نیز رویکردهای امنیتی باعث شده‌اند دست بخش خصوصی برای استفاده از ظرفیت‌ها و فناوری‌های جدید بسته بماند.» ترک‌تبریزی با اشاره به تجربه اختلال‌های گسترده در زیرساخت‌های بانکی گفت: «ما قبلا از این رویکرد آسیب دیده‌ایم؛ در یک مقطع، اختلالی گسترده باعث شد", "image_url": "https://api2.zoomit.ir/media/banking-data-center-resilience-panel-6ae9e1a1b001528ef859d3fb?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۲ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "I made marinara sauces using 4 celebrity chefs' recipes, and the best came from Ina Garten", "link": "https://www.businessinsider.com/trying-famous-marinara-sauce-recipes-best-one-ina-garten-2026-11", "summary": "I compared sauce recipes from four different celebrity chefs, including Tyler Florence, Giada De Laurentiis, and Ina Garten, to find a solid, go-to marinara that also tastes delicious. Paige Bennett I made marinara sauces using recipes from celebrity chefs like Alex Guarnaschelli and Ina Garten. Giada De Laurentiis' sauce had a celery aftertaste I didn't like and took the longest to make. I loved the sweet, rich flavor and inclusion of red wine in Garten's marinara recipe. I love a simple bowl of pasta with a classic marinara, especially when the sauce is homemade. Homemade marinara is easy enough to make on a busy weeknight and uses ingredients already in my pantry, like tomatoes (often canned), onions, garlic, olive oil, and herbs. In search of a sauce recipe I want to make and eat on repeat, I tried recipes from celebrity chefs Alex Guarnaschelli, Tyler Florence, Giada De Laurentiis , and Ina Garten. Here's how it went. Florence s simple marinara uses basic pantry staples. Paige Bennett Florence's marinara-sauce recipe , which I found on the Food Network website, takes only about 30 minutes to make and relies on dried herbs for flavor. His recipe called for canned crushed tomatoes, one onion, minced garlic, sugar, salt, pepper, dried basil, dried oregano, and a bay leaf. The recipe required very little prep. Paige Bennett I already had all of these things in my pantry, which meant I was off to a great start. Plus, this recipe didn't require much chopping, aside from about three cloves of garlic and one onion. Once those were chopped, I sautéed the onion and minced garlic in oil for about five minutes, then added the remaining ingredients. The sauce was done pretty quickly. Paige Bennett While the tomatoes and spices simmered together, I boiled some pasta. I made sure to occasionally stir my sauce so it wouldn't stick to the pan. In about 35 minutes, I had homemade marinara and pasta ready to go. The flavor was good, but I d prefer fresh herbs over dried ones. Paige Bennett This marinara was chunkier thanks to the tomato and onion. I liked the slightly sweet and herby flavors, but if I made this again, I'd follow Guarnaschelli's lead and stir in some fresh basil at the end. Though it would increase the cooking time, I would also sauté the onions a little bit longer than five minutes since they were chewier than I wanted. Still, this pantry-staple marinara is a great option for an impressive weeknight dinner — especially if you haven't had time to pick up", "date_str": "2026-11-03T14:22:44+00:00", "hash": "127167b5a1610f46", "title_fa": "من سس مارینارا را با استفاده از دستور پخت 4 سرآشپز مشهور درست کردم و بهترین آنها از Ina Garten تهیه شد.", "summary_fa": "من دستور العمل های سس را از چهار سرآشپز مشهور مختلف، از جمله تایلر فلورانس، گیادا دی لورنتیس، و اینا گارتن مقایسه کردم تا یک مارینارای جامد و قابل استفاده پیدا کنم که طعم خوشمزه ای نیز دارد. پیج بنت من سس های مارینارا را با استفاده از دستور العمل های سرآشپزهای مشهوری مانند الکس گوارناشلی و اینا گارتن درست کردم. سس Giada De Laurentis مزه ای از کرفس داشت که من دوست نداشتم و طولانی ترین زمان برای تهیه آن طول کشید. من عاشق طعم شیرین و غنی و گنجاندن شراب قرمز در دستور غذای مارینارای گارتن بودم. من عاشق یک کاسه پاستا ساده با یک مارینارای کلاسیک هستم، مخصوصاً وقتی سس آن خانگی باشد. مارینارای خانگی به اندازه کافی در یک شب شلوغ هفته درست می شود و از موادی مانند گوجه فرنگی (اغلب کنسرو شده)، پیاز، سیر، روغن زیتون و گیاهان استفاده می کند. در جستجوی دستور العمل سسی که می‌خواهم آن را درست کنم و تکرار کنم، دستور العمل‌هایی را از سرآشپزهای مشهور الکس گوارناشلی، تایلر فلورانس، گیادا د لاورنتیس و اینا گارتن امتحان کردم. در اینجا نحوه انجام آن است. مارینارای ساده فلورانس از لوازم اصلی انبارداری استفاده می کند. دستور تهیه سس مارینارا پیج بنت فلورانس، که در وب سایت شبکه غذا پیدا کردم، فقط حدود 30 دقیقه طول می کشد و برای طعم دادن به گیاهان خشک متکی است. دستور او شامل کنسرو گوجه فرنگی خرد شده، یک عدد پیاز، سیر خرد شده، شکر، نمک، فلفل، ریحان خشک، پونه کوهی خشک و یک برگ بو بود. دستور پخت نیاز به آماده سازی بسیار کمی داشت. پیج بنت من قبلاً همه این چیزها را در انبار داشتم، که به این معنی بود که شروع خوبی داشتم. علاوه بر این، این دستور غذا به خرد کردن زیادی نیاز نداشت، به غیر از حدود سه حبه", "image_url": "https://i.insider.com/6ae8f9ae426e175d4818d849?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۲ آبان • ۱۷:۵۲"}, {"source": "Business Insider", "title": "As a flight attendant, I wish passengers would leave the window shades open. I've got my reasons, but it's not up to me.", "link": "https://www.businessinsider.com/should-i-open-windows-in-air-flight-attendant-explains-why-2026-10", "summary": "Regardless of whether you feel the window shade should be open or shut during flight, I (not pictured) say the passenger in the window seat should get to control it. Dobrila Vignjevic/Getty Images As a flight attendant , I prefer open window shades — but the choice is up to those in window seats. I love watching the scenery and feel safer, as we all get more visibility into our surroundings. Unless we're stopped at a warm destination or the cabin is rowdy, I am team window shades up. When it comes to whether window shades should be open or shut during a flight, my answer is simple: Generally, it's up to the passenger in the window seat . The choice is theirs to make, unless there's an onboard issue or the crew has instructed otherwise. If I'm in the aisle, and the person in the window seat has the shade down during my flight, I'll be disappointed, but I'll respect their decision. When I'm on the job as a flight attendant, I typically prefer it when my passengers keep the window shades open, too. Generally, I feel safer leaving the shades open When the window shades are open, we can all have a better view of our surroundings. Leanna Coy; Ignatiev/Getty Images Since becoming a flight attendant four years ago, I appreciate having the window shades up even more, especially during takeoff and landing. It gives passengers and crew members more visibility and can improve their situational awareness, which is crucial in the unlikely event of an emergency or evacuation. A passenger might even be able to spot a potential issue before the crew does. If there were a fire on the aircraft's wing, for example, someone in the window seat might be the first person to notice. Many international airlines actually require window shades to remain open during takeoff and landing, and some US airlines encourage the practice, even though it is not mandated by the Federal Aviation Administration. It also gives all of us the chance to catch incredible views I ve seen national parks from above and caught glimpses of the northern lights outside of plane windows. Leanna Coy On a less serious note, it makes me kind of sad when passengers don't care about seeing the view out of the window. Even just a few decades ago, being able to look at the world from the sky was a much rarer experience. Many people never get the opportunity to do so, either. I've been on more than 800 flights, but taking in the scenery and sights never gets old. I've gotten aerial views of Canyonlands, Capitol Reef,", "date_str": "2026-11-03T12:54:01+00:00", "hash": "09c8d4e7bf656ab1", "title_fa": "به عنوان مهماندار هواپیما، ای کاش مسافران پنجره ها را باز می گذاشتند. من دلایلم را دارم، اما این به من بستگی ندارد.", "summary_fa": "صرف نظر از اینکه احساس می کنید سایه پنجره باید در طول پرواز باز باشد یا بسته، من (در تصویر نیست) می گویم مسافر روی صندلی پنجره باید آن را کنترل کند. Dobrila Vignjevic/Getty Images به‌عنوان مهماندار هواپیما، من سایه‌های پنجره باز را ترجیح می‌دهم – اما انتخاب با کسانی است که روی صندلی‌های پنجره نشسته‌اند. من عاشق تماشای مناظر هستم و احساس امنیت بیشتری می کنم، زیرا همه ما دید بیشتری نسبت به محیط اطراف خود داریم. مگر اینکه در یک مقصد گرم متوقف شده باشیم یا کابین شلوغ باشد، من پنجره های تیم را بالا می برم. وقتی صحبت از باز یا بسته بودن سایه‌بان‌های پنجره در طول پرواز به میان می‌آید، پاسخ من ساده است: به طور کلی، این به مسافر در صندلی پنجره بستگی دارد. انتخاب با آنهاست، مگر اینکه مشکلی در کشتی وجود داشته باشد یا خدمه دستور دیگری داده باشند. اگر من در راهرو باشم و شخصی که روی صندلی پنجره در طول پروازم سایه داشته باشد، ناامید خواهم شد، اما به تصمیم آنها احترام می گذارم. زمانی که من به عنوان مهماندار هواپیما مشغول به کار هستم، معمولاً زمانی که مسافرانم پنجره های پنجره را باز نگه دارند، ترجیح می دهم. به طور کلی، من احساس امنیت بیشتری می کنم که سایه ها را باز نگه دارم وقتی سایه های پنجره باز هستند، همه ما می توانیم دید بهتری از محیط اطراف خود داشته باشیم. لیانا کوی; ایگناتیف/ گتی ایماژ از زمانی که چهار سال پیش مهماندار هواپیما شدم، از اینکه سایه‌های پنجره‌ها حتی در هنگام برخاستن و فرود آمدن بیشتر باشد، قدردانی می‌کنم. این به مسافران و اعضای خدمه دید بیشتری می دهد و می تواند آگاهی موقعیتی آنها را بهبود بخشد، که در صورت غیر محتمل اضطراری یا تخلیه بسیار مهم است. یک مسافر حتی ممکن است بتواند یک مشکل بالقوه", "image_url": "https://i.insider.com/6ae49e728bd5d6547af34048?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱۲ آبان • ۱۶:۲۴"}, {"source": "Business Insider", "title": "What smart people are saying after the Nasdaq sank into correction territory, down 10% from recent highs", "link": "https://www.businessinsider.com/nasdaq-correction-decline-ai-spending-tech-stocks-market-outlook-midterms-2026-11", "summary": "The Nasdaq 100 slid by over 10% from its recent high, entering a technical correction. Osmancan Gurdogan/Anadolu via Getty Images The Nasdaq 100 slumped into a technical correction on Monday, down 10.4% from its October 6 peak. Economist David Rosenberg said tech stocks have slumped over concerns about returns on AI spending. Other market commentators said investors were pricing in a Democratic victory in the midterms. Is the AI-fueled market boom stalling out? That was the question on investors' minds after the Nasdaq 100 slumped into a technical correction on Monday, defined as a decline of 10% or more from a recent peak. The tech-heavy US stock index closed at just under 28,000 points, a hefty 10.4% below the all-time high of over 31,000 points it notched on October 6. It was the Nasdaq 100's third correction of 2026, and came as investors increasingly asked when the massive sums that Big Tech is pouring into AI might pay off . There were signs of recovery on Tuesday with Nasdaq 100 futures up about 0.7% as of 9 a.m. ET. Here's what smart people are saying about the correction. David Rosenberg, president of Rosenberg Research A correction was \" probably inevitable \" given the huge volume of capital pouring into \"any company claiming to have an AI angle,\" David Rosenberg, the president of Rosenberg Research, said in a morning note on Tuesday. The former chief North American economist at Merrill Lynch said that \"both sides of the AI trade are faltering at once.\" The likes of Microsoft and Alphabet have sold off because th . The idea of code rot has really caught on in the young people's popular imagination, probably because they're going to spend a lot of their lives dealing with it. They've even taken the idea of code rot into life, and use the phrase to describe anything that is worn out or malfunctioning. If the ice cream machine isn't working at McDonald's, it's code rotted. Bad grades on a report card? Code rot. Kids are making videos where they demonstrate actual code rot: or point out physical things that are code rotted, like a cat: or their school: Interestingly, a lot of the online discourse around code rotting concerns the massive video game platform Roblox . Because Roblox games there are made by users, there's often not a lot of incentive for the creators to keep the games current with the platform's changes, so a lot of Gen Z's childhood memories of playing games are sinking into code rot. Here's a video about it: Another interesting wrinkle is the tone these videos take. Code rot is seen as apocalyptic. While it's mostly hyperbole, I think part of it is the realization that the entire world is code rotted. The old programs that used to run within the \"Western Culture\" operating system no longer apply and everything is starting to glitch out. What does \"PDF file\" mean? The meaning of \"PDF file\" depends on the context. If you're at work, it refers to a Portable Document Format file, a format created by Adobe that is famously hard for older people to open. In slang, though, PDF file is algo speak for \"pedophile.\" Because that word is flagged by moderation software online, people say \"PDF File\" to skirt the censorship. Why was Freddy Krueger (supposedly) can", "date_str": "2026-11-03T14:30:00+00:00", "hash": "284b676b6b56727b", "title_fa": "راهنمای بزرگسالان خارج از تماس برای فرهنگ کودک: «پوسیدگی کد» به چه معناست؟", "summary_fa": "راهنمای خارج از تماس این هفته نگاهی به پدیده‌ای می‌اندازد که احتمالاً زندگی نسل‌های جوان را تعریف می‌کند: پوسیدگی کد هم پوسیدگی کد واقعی به سبک رایانه‌ای و هم نوع فرهنگی گریزان‌تر. من همچنین نگاهی به جنجال ساختگی در مورد \"لغو\" فردی کروگر، و در نهایت، آوردن همه چیز به خانه با ویدئوهای ویروسی از رقص دوست پسرها دارم. \"پوسیدگی کد\" به چه معناست؟ انتظار داشته باشید که جوانان در مورد پوسیدگی کد برای مدتی، شاید برای بقیه عمر خود صحبت کنند. این مفهومی است که بیش از هر نسل قبلی آنها را تحت تأثیر قرار خواهد داد. پوسیدگی کد، یا پوسیدگی نرم‌افزار، توضیح می‌دهد که چه اتفاقی برای یک برنامه رایانه‌ای می‌افتد که سخت‌افزار و سیستم عامل آن به‌طور پیش‌رو اجرا شود. اگر برنامه‌های قدیمی‌تر به‌روزرسانی نشوند، ثبات و مشکل کمتری پیدا می‌کنند تا زمانی که در نهایت غیرقابل استفاده شوند. ایده پوسیدگی کد واقعاً در تخیل رایج جوانان جا افتاده است، احتمالاً به این دلیل که آنها قرار است بسیاری از عمر خود را صرف مقابله با آن کنند. آنها حتی ایده پوسیدگی کد را نیز به زندگی خود وارد کرده‌اند و از این عبارت برای توصیف هر چیزی که فرسوده یا خراب است استفاده می‌کنند. اگر دستگاه بستنی ساز در مک دونالد کار نمی کند، کد آن پوسیده شده است. نمرات بد در کارنامه؟ پوسیدگی کد. بچه‌ها در حال ساختن ویدیوهایی هستند که پوسیدگی کد واقعی را نشان می‌دهند: یا به چیزهای فیزیکی که کد پوسیده شده‌اند، مانند گربه: یا مدرسه‌شان اشاره می‌کنند: جالب است که بسیاری از گفتمان‌های آنلاین درباره پوسیدگی کد مربوط به پلتفرم عظیم بازی‌های ویدیویی Roblox است. از آنجایی که بازی‌های Roblox در آنجا توسط کاربران ساخته می‌شوند، اغلب انگیزه زیادی برای سازندگان وجود ندارد که بازی‌ها را با تغییرات پلتفرم به روز نگه دارند، بنابراین بسیاری از خاطرات کودکی Gen Z از", "image_url": "https://lifehacker.com/imagery/articles/01M6F1KJM6V6HRHSVE3DKDKX6V/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۲ آبان • ۱۸:۰۰"}, {"source": "Lifehacker", "title": "The Google Pixel Watch 5 Is $100 Off Right Now", "link": "https://lifehacker.com/tech/google-pixel-watch-5-sale-november-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Amaz     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
