قابل جمهوری اسلامی به چند نفتکش و کشتی تجاری در خلیج فارس و دریای عمان حمله کرده است."}, {"source": "IranWire", "title": "شش‌ماه بی‌خبری از محمود حسینیان؛ خانواده از مرگ یا بازداشت او بی‌خبرند", "link": "https://iranwire.com/fa/news-1/157495-%D8%B4%D8%B4%D9%85%D8%A7%D9%87-%D8%A8%DB%8C%D8%AE%D8%A8%D8%B1%DB%8C-%D9%85%D8%B7%D9%84%D9%82-%D8%A7%D8%B2-%D9%85%D8%AD%D9%85%D9%88%D8%AF-%D8%AD%D8%B3%DB%8C%D9%86%DB%8C%D8%A7%D9%86-%D8%AE%D8%A7%D9%86%D9%88%D8%A7%D8%AF%D9%87-%D8%A7%D8%B2-%D9%85%D8%B1%DA%AF-%DB%8C%D8%A7-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B4%D8%AA-%D8%A7%D9%88-%D8%A8%DB%8C%D8%AE%D8%A8%D8%B1%D9%86%D8%AF/", "summary": "سازمان حقوق بشر کارون خبر داده است که پس از گذشت شش ماه از یورش خشونت‌آمیز و مسلحانه نیروهای امنیتی جمهوری اسلامی به منطقه «قلعه‌چنعان» ...", "date_str": "2026-09-11T19:31:07+00:00", "hash": "ad683696a721cd73", "title_fa": "شش‌ماه بی‌خبری از محمود حسینیان؛ خانواده از مرگ یا بازداشت او بی‌خبرند", "summary_fa": "سازمان حقوق بشر کارون خبر داده است که پس از گذشت شش ماه از یورش خشونت‌آمیز و مسلحانه نیروهای امنیتی جمهوری اسلامی به منطقه «قلعه‌چنعان» در اهواز، سرنوشت «محمود حسینیان (ناصری)» یکی از افرادی که هدف گلوله قرار گرفت همچنان در هاله‌ای از ابهام قرار دارد. این گزارش تایید می‌کند که خانواده این شهروند در وضعیتی از بی‌خبری مطلق به سر برده و نهادهای امنیتی و قضایی از ارایه هرگونه پاسخ روشنی درباره حیات یا مرگ او امتناع می‌کنند. محمود حسینیان، متولد بهمن‌ماه سال ۱۳۷۴ در آبادان و ساکن اهواز است. ۱۸اسفندماه در میانه جنگ آمریکا و اسراییل با ایران او در جریان یورش به منطقه قلعه‌چنان هدف گلوله قرار گرفت. کارون به نقل از خانواده این شهروند نوشته که پس از گذشت شش‌ماه از این واقعه، هیچ‌گونه تماس یا پیامی از سوی او و مراجع ذی‌ربط دریافت نشده است و آن‌ها همچنان در بلاتکلیفی درباره کشته شدن یا بازداشت فرزندشان به سر می‌برند. پیگیری‌های مستمر خانواده از مراجع متعدد قضایی، امنیتی و درمانی کاملا مسکوت مانده است. خانواده محمود حسینیان تاکنون به ستاد خبری اداره اطلاعات (۱۱۳)، سازمان اطلاعات سپاه پاسداران (ستاد خبری ۱۱۴) و مقامات مسوول در زندان شیبان اهواز، به پزشکی قانونی 3+00:00", "hash": "dc6a0b1ed202bf62", "title_fa": "کمپین یک میلیون امضا؛ زنان ایران بیست‌سال پیش از این روزها", "summary_fa": "کمپین اگرچه در ۵شهریور۱۳۸۵ در تهران آغاز به‌کار کرد ولی به سرعت در اغلب شهرهای ایران گسترده شد. شهروندانی که خود درخواست از نمایندگان مجلس برای تغییر قوانین را امضا می‌کردند، در کوچه و خیابان و پارک و مترو و اتوبوس سعی می‌کردند تا بقیه را هم مجاب کنند که این قوانین باید تغییر کند و چه بهتر که خود شهروندان از دل جامعه خواسته تغییر آن را مطرح کنند. برخی از این قوانین در طول سال‌ها تغییر کرد، اما بسیاری همچنان تبعیض‌آمیز باقی ماند. کمپین یک میلیون امضا شکل مبارزه مردم ایران را با استبداد جمهوری اسلامی تغییر داد و عاملیت زنان در مبارزه را از جمع‌های محدود، به خیابان کشاند. سیمین بهبهانی، نوشین احمدی خراسانی و محبوبه عباسقلی‌زاده از اعضای کمپین یک میلیون امضا در یک تجمع اعتراضی. بسیاری از فعالان کمپین یک میلیون امضا برابر بازداشت، تحت تعقیب و زندانی شدند. بعد از سرکوب جنبش سبز، خیلی‌ها ناچار به ترک ایران شدند. مریم فومنی از اعضای اولیه کمپین می‌گوید که مطالبات به‌حدی بدیهی و اساسی بوده که حتی بازجوها هم نمی‌توانستند با آن مخالفت کنند و فقط بهانه‌ می‌آوردند تا مانع فعالیت کمپین شوند. آزاده دواچی، پژوهشگر مطالعات زنان می‌گوید که کمپین، «از مطالبه برابری‌های حقوقی تابوشکنی کرد» و «بحث قوانین تبعیض‌آمیز را از محافل خصوصی خارج کرده و به یک مطالبه عمومی تبدیل کرد.» پنجم شهریور۱۳۸۵، ۵۴فعال حقوق زنان که ۲۲خرداد همان سال در میدان هفت‌تیر تهران برای تغییر قوانین تبعیض‌آمیز جنسیتی، مثل حق طلاق، حضانت فرزندان و ارثیه نابرابر تجمع کرده و برخی‌شان از ماموران امنیتی کتک خورده بودند و بعضی بازداشت شده بود، کمپینی را بنا نهادند که تغییرات بزرگی را در جامعه ایران به‌بار آورد. کمپینی به‌نام «یک میلیون امضا برای تغییر قوانین تبعیض‌آمیز» که قرار بود از مردم کوچه و خیابان، یک میلیون امضا جمع کند و با ارسال آن برای نمایندگان"}, {"source": "IranWire", "title": "حمله پهپادی به خط لوله عربستان؛ مرزهای شلمچه و چذابه بسته شدند", "link": "https://iranwire.com/fa/news-1/157499-%D8%AD%D9%85%D9%84%D9%87-%D9%BE%D9%87%D9%BE%D8%A7%D8%AF%DB%8C-%D8%A8%D9%87-%D8%AE%D8%B7-%D9%84%D9%88 e": "BBC Persian", "title": "نتانیاهو در جبل‌الشیخ؛ چرا این کوه راهبردی‌ برای اسرائیل اهمیت دارد؟", "link": "https://www.bbc.com/persian/articles/cgl71p2x5d1o?at_medium=RSS&at_campaign=rss", "summary": "بنیامین نتانیاهو در جریان بازدید از نیروهای اسرائیلی مستقر در جبل‌الشیخ بار دیگر بر اهمیت این ارتفاعات راهبردی تاکید کرد؛ منطقه‌ای که پس از تحولات اخیر سوریه بیش از گذشته در کانون توجه قرار گرفته است. اما جبل‌الشیخ کجاست، چرا برای اسرائیل و سوریه اهمیت دارد و چه ویژگی‌های نظامی، جغرافیایی و آبی آن را به یکی از حساس‌ترین نقاط منطقه تبدیل کرده است؟", "date_str": "2026-09-12T08:23:32+00:00", "hash": "ebad553224230349", "title_fa": "نتانیاهو در جبل‌الشیخ؛ چرا این کوه راهبردی‌ برای اسرائیل اهمیت دارد؟", "summary_fa": "بنیامین نتانیاهو، نخست‌وزیر اسرائیل، شامگاه چهارشنبه در بازدید از نیروهای اسرائیلی مستقر در جبل‌الشیخ گفت اسرائیل «بسیار به سرنگونی رژیم» در ایران نزدیک شده است و افزود که در این صورت «تمام این محور از هم خواهد پاشید». نیروهای اسرائیلی پس از سقوط حکومت بشار اسد وارد جنوب سوریه شدند و از آن زمان صدها حمله هوایی به مواضع نظامی سوریه انجام داده‌اند. اسرائیل کاتس، وزیر دفاع اسرائیل، نیز مستقیما احمد الشرع، رئیس‌جمهور سوریه، را مخاطب قرار داد و در پیامی به رهبری سوریه در دمشق تاکید کرد که نیروهای اسرائیلی در منطقه حائل باقی خواهند ماند و از آن عقب‌نشینی نخواهند کرد. وزارت خارجه سوریه سفر نتانیاهو را محکوم کرد و ورود او به خاک سوریه را «غیرقانونی»، «تحریک‌آمیز» و نقض حاکمیت و تمامیت ارضی سوریه دانست. جبل‌الشیخ، یا حرمون، کوهی راهبردی در مرز سوریه و لبنان است که بر بخش‌های گسترده‌ای از جنوب سوریه، لبنان و شمال اسرائیل اشراف دارد. این رشته‌کوه از بانیاس در سوریه و دشت حوله در جنوب‌غربی تا وادی القرن در شمال‌شرقی امتداد دارد و بخش مهمی از رشته‌کوه لبنان شرقی را تشکیل می‌دهد؛ رشته‌کوهی که در امتداد مرزهای لبنان و سوریه کشیده شده است."}, {"source": "BBC Persian", "title": "آیا حمله به سه کشتی در جریان تشییع علی خامنه‌ای «آتش‌به‌اختیار» بود؟", "link": "https://www.bbc.com/persian/articles/cp938lp5y3eo?at_medium=RSS&at_campaign=rss", "summary": "فارغ از اینکه تصمیم‌گیران و اجراکنندگان حمله به سه نفت‌کش در جریان مراسم تشییع علی خامنه‌ای، بعدها به همان نتایجی که تصور می‌کردند رسیدند یا نه، ظاهرا این حملات، بر خلاف برخی گمانه‌زنی‌ها، «آتش‌به‌اختیار» نبودند.", "date_str": "2026-09-12T07:01:08+00:00", "hash": "c3405c7afa6a78d2", "title_fa": "آیا حمله به سه کشتی در جریان تشییع علی خامنه‌ای «آتش‌به‌اختیار» بود؟", "summary_fa": "سه هفته پس از امضای تفاهم‌نامه ۱۴ ماده‌ای اسلام‌آباد میان ایران و آمریکا، سه کشتی عظیم تجاری در محدوده تنگه هرمز و آب‌های پیرامونی آن هدف تهاجم قرار گرفتند. بلافاصله پس از آن، معافیت ۶۰ روزه فروش نفت ایران لغو شد و دونالد ترامپ تفاهم‌نامه اسلام‌آباد را «پایان‌یافته» خواند. سپس، موج جدیدی از حملات هوایی آمریکا کلید خورد و ایران تحت محاصره دریایی کامل درآمد. سه کشتی خبرساز، در ۱۶ تیرماه هدف قرار گرفتند؛ یعنی دو روز پیش از مراسم تدفین علی خامنه‌ای و در میانه شعارهای تند جمعی از حاضران مراسم تشییع علیه حامیان تفاهم‌نامه. حکومت ایران به‌طور رسمی مسئولیت هدف قرار دادن کشتی‌ها را نپذیرفت، ولی تعدادی از رسانه‌های حکومتی، صراحتا این حملات را کار نیروهای سپاه پاسداران دانستند. در فضای پس از حملات، در داخل و خارج ایران بحث‌های متنوعی پیرامون «مسئولیت» این اقدام به جریان افتاد که کمابیش ادامه دارند. این بحث‌ها در شرایطی اهمیت یافته‌اند که تداوم و تشدید محاصره دریایی آمریکا، در ابعادی کم‌سابقه بر وضعیت معیشت در ایران تأثیر گذاشته است. در شرایط جدید، طیفی از ناظران به طرح این پرسش پرداخته‌اند که آیا حملات ۱۶ تیر ریشه در تصمیم نهادهای ارشد جمهوری اسلامی داشته، یا اقدامی «آتش‌به‌اختیار» از جانب نیروهای میدانی بوده است؟ در مورد سازوکار تصمیم‌گیری راجع به این حملات خاص، البته اطلاعات اختصاصی یا پشت‌پرده‌ای وجود ندارد. با وجود این، مجموعه شواهد علنی و در دسترس، از نتیجه‌ای منطقی حکایت می‌کنند: فارغ از آنکه حملات سه‌گانه با چه توجیهی صورت گرفته باشند و به چه سرانجامی برسند، فرضیه «آتش‌به‌اختیار» بودن آنها، قابل دفاع نیست. افسانه «نیروهای خودسر» در جمهوری اسلامی ایران"}, {"source": "BBC Persian", "title": "«به هم پناه می‌بریم؛ آماده‌ایم با هم جان بدهیم»؛ یمن در آستانه بازگشت به جنگ تمام‌عیار", "link": "https://www.bbc.com/persian/articles/cg7kdmm8j1ko?at_medium=RSS&at_campaign=rss", "summary": "هم‌زمان با افزایش نگرانی‌ها از فروپاشی آتش‌بس میان حوثی‌ها و دولت به‌ رسمیت‌ شناخته‌ شده بین‌المللی تحت حمایت عربستان، صدای جنگنده‌ها بار دیگر آسمان استان‌های شمال غربی یمن را پر کرده است.", "date_str": "2026-09-12T04:19:25+00:00", "hash": "59435f23b0932970", "title_fa": "«به هم پناه می‌بریم؛ آماده‌ایم با هم جان بدهیم»؛ یمن در آستانه بازگشت به جنگ تمام‌عیار", "summary_fa": "هم‌زمان با افزایش نگرانی‌ها از فروپاشی آتش‌بس میان حوثی‌های مورد حمایت ایران و دولت به‌ رسمیت‌ شناخته‌ شده بین‌المللی تحت حمایت عربستان، صدای جنگنده‌ها بار دیگر آسمان استان‌های شمال غربی یمن را پر کرده است. خانواده‌های ساکن اردوگاه آوارگان محربه، سال‌هاست با سوءتغذیه و کمبود خدمات درمانی دست‌ و پنجه نرم می‌کنند. برنامه جهانی غذا چند ماه است کمک‌رسانی در مناطق تحت کنترل حوثی‌ها را به حالت تعلیق درآورده است. دیده‌بان حقوق بشر گزارش می‌دهد که مقام‌های حوثی به دفاتر سازمان‌های بشردوستانه یورش برده و ده‌ها تن از کارکنان سازمان ملل و سازمان‌های غیردولتی را بازداشت کرده‌اند. اکنون سازمان‌های امدادرسان می‌گویند ادامه تشدید درگیری‌ها ممکن است فعالیت بندرهای مهمی مانند حدیده، از دروازه‌های حیاتی ورود کمک‌های بشردوستانه، را مختل کند و کمک‌رسانی به میلیون‌ها یمنی را بیش از پیش به خطر بیندازد. آمنه محمد منصور رازحی که ۱۲ سال است همراه خانواده‌اش در این اردوگاه زندگی می‌کند، با هر مقدار آرد و روغنی که بتواند پیدا کند، در ماهیتابه‌ای فرسوده روی آتش هیزم نان می‌پزد. او می‌گوید: «وضع اردوگاه اسف‌بار است. روزی فقط یک وعده غذا می‌خوریم. نه آب داریم، نه برق و نه خانه درست‌ و حسابی.» آمنه و خانواده‌اش سه بار آواره شده‌اند. می‌گوید غرش جنگنده‌های سعودی آن‌ها را وحشت‌زده می‌کند، چون جایی برای پناه گرفتن ندارند."}, {"source": "BBC Persian", "title": "آیا وعده ۵ هزار دلاری ترامپ به آمریکایی‌ها نشانه هراس اوست؟", "link": "https://www.bbc.com/persian/articles/c624l6x88p1o?at_medium=RSS&at_campaign=rss", "summary": "همه ما می‌دانیم که دونالد ترامپ خود را ملزم به رعایت قواعد معمول کارزارهای انتخاباتی نمی‌داند. با این حال، حتی بر اساس معیارهای نامتعارف خود او نیز وعده عجیبش مبنی بر پرداخت ۵ هزار دلار به هر شهروند آمریکایی در صورت پیروزی جمهوری‌خواهان در انتخابات میان‌دوره‌ای، غیرمنتظره و شگفت‌آور بود.", "date_str": "2026-09-11T23:30:31+00:00", "hash": "68f0ef0904b0ffaa", "title_fa": "آیا وعده ۵ هزار دلاری ترامپ به آمریکایی‌ها نشانه هراس اوست؟", "summary_fa": "همه ما می‌دانیم که دونالد ترامپ خود را ملزم به رعایت قواعد معمول کارزارهای انتخاباتی نمی‌داند. با این حال، حتی بر اساس معیارهای نامتعارف خود او نیز وعده عجیبش مبنی بر پرداخت ۵ هزار دلار به هر شهروند آمریکایی در صورت پیروزی جمهوری‌خواهان در انتخابات میان‌دوره‌ای، غیرمنتظره و شگفت‌آور بود. این وعده نقدی هنگفت، محور اصلی سخنرانی او در نخستین شب همایش انتخاباتی جمهوری‌خواهان برای انتخابات میان‌دوره‌ای نبود. ترامپ حدود یک ساعت پس از آغاز سخنرانی طولانی‌اش، درست زمانی که توجه حاضران کم‌کم داشت منحرف می‌شد، این وعده را لابه‌لای حرف‌هایش مطرح کرد. رئیس‌جمهور آمریکا هیچ توضیحی نداد که هزینه بیش از یک تریلیون دلاری این وعده چگونه تامین خواهد شد یا پول‌ها چگونه به دست مردم خواهند رسید. در پاسخ به درخواست توضیحات بیشتر، کاخ سفید در بیانیه‌ای اعلام کرد: «این اعلامیه تازه‌ترین شاهد بر این واقعیت است که رئیس‌جمهور ترامپ کارهایی را انجام می‌دهد که به گفته به‌اصطلاح کارشناسان امکان‌پذیر نیست؛ او برای مردم آمریکا نتیجه به ارمغان می‌آورد.» با این حال، کاخ سفید جزئیات بیشتری درباره نحوه اجرای این طرح ارائه نکرد."}, {"source": "BBC Persian", "title": "لباس «انتقام»‌ پرنسس دایانا به حراج گذاشته می‌شود", "link": "https://www.bbc.com/persian/articles/cgmrzm8kj34o?at_medium=RSS&at_campaign=rss", "summary": "لباسی که پرنسس دایانا در یک ضیافت به تن داشت و به لباس «انتقام» شهرت یافته، به حراج گذاشته می‌شود.", "date_str": "2026-09-11T21:54:27+00:00", "hash": "b846cc80b89eeafd", "title_fa": "لباس «انتقام»‌ پرنسس دایانا به حراج گذاشته می‌شود", "summary_fa": "لباسی که پرنسس دایانا در یک ضیافت به تن داشت و به لباس «انتقام» شهرت یافته، به حراج گذاشته می‌شود. پرنسس پیشین ولز این پیراهن شبِ ابریشمیِ مشکی و دکلته را در یک مهمانی در لندن پوشید، مهمانی که تنها چند ساعت پس از آن بود که همسرش، شاهزاده چارلز که در آن زمان از او جدا شده بود، به خیانت در دوران زندگی مشترکشان اعتراف کرده بود. ورود پرشور و خبرساز او با این لباس به «گالری سرپنتاین» در سال ۱۹۹۴، به یکی از لحظات ماندگار در فرهنگ عامه تبدیل شد. خانه حراج «ساتبیز» پیش‌بینی کرده که این پیراهن هنگام به حراج گذاشته شدن در تاریخ ۹ دسامبر، تا ۳۰۰ هزار دلار به فروش برسد. این نخستین بار است که این لباس از سال ۱۹۹۷، یعنی زمانی که پرنسس دایانا تنها چند ماه پیش از مرگش ۷۹ دست از لباس‌های خود را برای کمک به خیریه‌ها فروخت، به حراج گذاشته می‌شود. مورگان حلیمی، مدیر جهانی بخش کیف‌های دستی و مد در ساتبیز، در بیانیه‌ای اظهار داشت که پرنسس دایانا «به‌طور غریزی درک می‌کرد» که مد می‌تواند به خودی خود یک زبان باشد."}, {"source": "BBC Persian", "title": "آنتروپیک از استفاده نهادهای مرتبط با حکومت ایران از هوش مصنوعی برای تبلیغات و رصد شهروندان خبر داد", "link": "https://www.bbc.com/persian/articles/crer5pgpj0do?at_medium=RSS&at_campaign=rss", "summary": "آنتروپیک می‌گوید افراد و نهادهای مرتبط با حکومت ایران از کلود برای تبلیغات، رصد شهروندان و ساخت ابزارهای تجسسی استفاده کرده‌اند. این شرکت از مسدودکردن حساب‌های مرتبط خبر داده، اما اذعان کرده است که سازوکارهای حفاظتی‌اش نتوانسته‌اند بسیاری از درخواست‌ها برای ساخت ابزارهای تجسسی را متوقف کنند.", "date_str": "2026-09-11T20:14:41+00:00", "hash": "a0f9efb2845468da", "title_fa": "آنتروپیک از استفاده نهادهای مرتبط با حکومت ایران از هوش مصنوعی برای تبلیغات و رصد شهروندان خبر داد", "summary_fa": "گزارش تازه شرکت آمریکایی آنتروپیک ادعا می‌کند نهادها و افرادی همسو با جمهوری اسلامی از یکی از پیشرفته‌ترین مدل‌های هوش مصنوعی جهان نه فقط برای تولید محتوا و عملیات تبلیغاتی، بلکه برای نظارت بر شهروندان، تحلیل شبکه‌های اجتماعی و توسعه ابزارهای تجسسی استفاده کرده‌اند. این گزارش تصویری کم‌سابقه از نحوه بهره‌گیری حکومت ایران از فناوری‌های هوش مصنوعی ارائه می‌دهد؛ آن هم در شرایطی که دسترسی رسمی به این خدمات از داخل ایران مسدود است. آنتروپیک همچنین می‌گوید «فعالیت‌های سوء» برای استفاده از مدل‌هایش در ساخت سلاح‌های بیولوژیک را شناسایی و خنثی کرده است. این شرکت در تازه‌ترین گزارش خود در باره اطلاعات مربوط به تهدیدات، همچنین از مختل کردن یک عملیات احتمالی جاسوسی سایبری مرتبط با روسیه خبر داد و شرکت‌های هوش مصنوعی چینی را به تلاش برای کپی‌برداری از قابلیت‌های مدل «کلود» خود متهم کرد. انتشار این گزارش چند روز پس از آن صورت می‌گیرد که یکی از پژوهشگران ارشد حوزه ایمنی در آنتروپیک اظهار داشت احتمال اینکه هوش مصنوعی طی دهه آینده باعث مرگ تمام انسان‌ها شود، بیش از ۱۰ درصد است. این یافته‌ها که در گزارش اخیر این شرکت در باره اطلاعات مربوط به تهدیدها ارائه شده، جدیدترین مورد از مجموعه‌ای رو به رشد از هشدارهای محققان هوش مصنوعی و افراد دست‌اندرکار این صنعت در مورد خطرات بالقوه این فناوری برای بشریت است. جزئیاتی که شرکت آنتروپیک در گزارش خود منتشر کرده، تصویری از استفاده‌های متنوع افراد و نهادهای نزدیک به حکومت ایران از هوش مصنوعی به دست می‌دهد."}, {"source": "Radio Farda", "title": "رهبران بریکس خواستار حداکثر خویشتنداری در خاورمیانه و حل اختلافات با دیپلماسی شدند", "link": "https://www.radiofarda.com/a/brics-summit-middle-east-iran-nuclear-sites/33853007.html", "summary": "بیانیه مشترک رهبران بریکس روز ۲۱ شهریور در حالی صادر شد که وزیران خارجه بریکس، به‌دلیل اختلاف دربارهٔ جنگ ایران نتوانسته بودند در نشست قبلی بر سر بیانیه‌ای مشترک به توافق برسند.", "date_str": "2026-09-12T14:20:53+00:00", "hash": "a994c62acd9dc355", "title_fa": "رهبران بریکس خواستار حداکثر خویشتنداری در خاورمیانه و حل اختلافات با دیپلماسی شدند", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند رهبران کشورهای عضو بریکس در نشست دهلی نو با ابراز «نگرانی عمیق» از تشدید جنگ در خاورمیانه، خواستار «حداکثر خویشتنداری» طرف‌ها و خودداری از اقداماتی شدند که می‌تواند به وخامت بیشتر اوضاع منجر شود. بیانیهٔ مشترک رهبران بریکس روز شنبه ۲۱ شهریور در حالی صادر شد که وزیران خارجهٔ بریکس در نشست اواخر اردیبهشت امسال در دهلی نو، به‌دلیل اختلاف‌نظر بر سر جنگ ایران، نتوانسته بودند بر سر بیانیه‌ای مشترک به توافق برسند. در بیانیهٔ تازه، اعضای بریکس ضمن تأکید بر مواضع متفاوت خود، خواستار حل مسالمت‌آمیز اختلافات بین‌المللی از طریق «گفت‌وگو، رایزنی و دیپلماسی» شدند. جنگ با حملات آمریکا و اسرائیل به ایران در ۹ اسفند سال گذشته آغاز شد و در ماه‌های بعد دامنهٔ آن به بخش‌های دیگری از منطقه کشیده شد. ادامهٔ درگیری‌ها در لبنان و یمن و تنش بر سر کشتیرانی در تنگهٔ هرمز از مهم‌ترین پیامدهای منطقه‌ای آن بوده است. بیانیه همچنین حمله به زیرساخت‌های غیرنظامی و تأسیسات هسته‌ای صلح‌آمیز تحت پادمان کامل آژانس بین‌المللی انرژی اتمی را محکوم کرد و بر ضرورت رعایت ایمنی و امنیت هسته‌ای حتی در جریان درگیری‌های مسلحانه تأکید کرد."}, {"source": "Radio Farda", "title": "دادگاهی در آلمان روند ورشکستگی شعبه فرانکفورت بانک سپه را رسماً آغاز کرد", "link": "https://www.radiofarda.com/a/bank-sepah-frankfurt-insolvency-germany/33852982.html", "summary": "دادگاهی در آلمان از روند رسمی ورشکستگی شعبهٔ فرانکفورت بانک سپه ایران و تعیین یک مدیر ورشکستگی برای ادارهٔ دارایی‌ها و رسیدگی به مطالبات طلبکاران این بانک خبر داده است.", "date_str": "2026-09-12T13:01:59+00:00", "hash": "4e3bd591bd1f55f6", "title_fa": "دادگاهی در آلمان روند ورشکستگی شعبه فرانکفورت بانک سپه را رسماً آغاز کرد", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند دادگاهی در آلمان از روند رسمی ورشکستگی شعبهٔ فرانکفورت بانک سپه ایران و تعیین یک مدیر ورشکستگی برای ادارهٔ دارایی‌ها و رسیدگی به مطالبات طلبکاران این بانک خبر داده است. ادارهٔ نظارت مالی فدرال آلمان، بافین، ۱۸ شهریور اعلام کرده بود که شعبهٔ فرانکفورت بانک سپه به‌دلیل تحریم‌های اتحادیهٔ اروپا و قطع دسترسی به نظام پرداخت‌های اروپایی، دیگر قادر به بازپرداخت سپرده‌های مشتریان خود نیست. بر اساس اطلاعات تازه، دادگاه محلی فرانکفورت پروندهٔ ورشکستگی این شعبه را رسماً گشوده و لوکاس فلوتر، وکیل و متخصص امور ورشکستگی، را به‌عنوان مدیر ورشکستگی منصوب کرده است. بافین همچنین اعلام کرده است که شعبهٔ فرانکفورت بانک سپه در پایان سال ۲۰۲۵ حدود ۵۰ میلیون و ۴۰۰ هزار یورو دارایی در ترازنامهٔ خود داشته و تنها ۱۱ سپرده‌گذار برای آن باقی مانده بود. این نهاد تأکید کرده است که شعبهٔ بانک سپه به‌دلیل اندازهٔ کوچک آن برای نظام بانکی آلمان اهمیت ساختاری ندارد و ورشکستگی آن تهدیدی برای ثبات مالی این کشور محسوب نمی‌شود."}, {"source": "Radio Farda", "title": "ترامپ درباره حمله به خط لوله عربستان: فکر می‌کنم کار ایران بوده است", "link": "https://www.radiofarda.com/a/trump-says-iran-probably-responsible-for-attack-on-saudi-pipeline/33852921.html", "summary": "دونالد ترامپ، رئیس‌جمهوری آمریکا، روز شنبه ۲۱ شهریور در جریان سفرش به ایرلند گفت انتظار دارد وضعیت مربوط به ایران حل‌وفصل شود.", "date_str": "2026-09-12T10:18:35+00:00", "hash": "7c3f33e7049c613d", "title_fa": "ترامپ درباره حمله به خط لوله عربستان: فکر می‌کنم کار ایران بوده است", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند دونالد ترامپ، رئیس‌جمهور آمریکا، روز شنبه ۲۱ شهریور در جریان سفرش به ایرلند گفت انتظار دارد وضعیت مربوط به ایران حل‌وفصل شود. او همچنین ایران را مسئول احتمالی حمله‌ای دانست که به تعطیلی خط لولهٔ راهبردی شرق به غرب عربستان سعودی انجامید. آقای ترامپ در دوبلین، در پاسخ به پرسش خبرنگاران دربارهٔ این‌که آیا ایران مسئول حمله به این خط لولهٔ حیاتی نفت بوده است، گفت: «فکر می‌کنم مسئول بوده‌اند؛ احتمالاً خودشان بوده‌اند.» عربستان سعودی پس از حملهٔ پهپادی که به گفتهٔ مقام‌های این کشور از خاک عراق انجام شد، خط لولهٔ شرق به غرب خود را موقتاً بست. این خط لوله یکی از مهم‌ترین مسیرهای عربستان برای صدور نفت بدون عبور از تنگهٔ هرمز است. هنوز هیچ گروهی مسئولیت این حمله را بر عهده نگرفته است. در پی این حمله، دولت عراق روز جمعه دستور داد گذرگاه مرزی شلمچه با ایران بسته شود. بغداد همچنین فرمانده نظامی مسئول عملیات در استان میسان را برکنار کرده و از آغاز عملیات گسترده برای شناسایی و بازداشت عاملان حملات خبر داده است."}, {"source": "Radio Farda", "title": "حمله از خاک عراق به خط لوله راهبردی عربستان؛ حوثی‌ها به باب‌المندب رسیدند", "link": "https://www.radiofarda.com/a/saudis-shut-down-oil-pipeline-as-houthis-tighten-grip-on-red-sea-shipping/33852828.html", "summary": "عربستان سعودی پس از حمله پهپادی به خط لوله راهبردی شرق به غرب، فعالیت این مسیر انتقال نفت را به‌طور موقت متوقف کرد", "date_str": "2026-09-12T05:03:19+00:00", "hash": "c6fd4799b778d4a7", "title_fa": "حمله از خاک عراق به خط لوله راهبردی عربستان؛ حوثی‌ها به باب‌المندب رسیدند", "summary_fa": "لینک به این صفحه بر در نیویورک شرکت نکرده بود، در سخنرانی خود در پنتاگون، وزارت دفاع آمریکا، گفت: «امروز سوگند مقدسی را که نخستین‌بار یک ربع قرن پیش به نام آنها یاد کردیم، تجدید می‌کنیم. ما هرگز، هرگز فراموش نخواهیم کرد. به همین دلیل است که امروز می‌جنگیم.» ترامپ افزود: «ما چاره‌ای نداریم. تنها چیزی که می‌تواند وجود داشته باشد، پیروزی است. ما سخت می‌جنگیم. برای پیروزی می‌جنگیم.» یکی از هواپیماهایی که در حملات ۱۱ سپتامبر ربوده شده بود، به ساختمان پنتاگون در واشینگتن برخورد کرد و ۱۸۴ نفر را کشت. در مراسم یادبود این قربانیان، هنگام قرائت نام آنها یک ناقوس به صدا درآمد. رؤسای جمهوری آمریکا پیش از این نیز در سالگردهای مهم حملات ۱۱ سپتامبر با حضور در چندین محل یادبود، از جمله نیویورک، این مناسبت را گرامی داشته‌اند. بیشترین شمار از مجموع ۲۹۷۷ قربانی این حملات در نیویورک و در جریان حمله به دو برج مرکز تجارت جهانی کشته شدند."}],
      tech: [{"source": "TechCrunch AI", "title": "Mecka AI nears $500M valuation in Sequoia-led deal amid rush for robot training data", "link": "https://techcrunch.com/2026/09/11/mecka-ai-nears-500m-valuation-in-sequoia-led-deal-amid-rush-for-robot-training-data/", "summary": "The round for the two-year-old startup is coming together months after Mecka announced its Series A.", "date_str": "2026-09-11T22:58:17+00:00", "hash": "ad41db53ae4e074c", "title_fa": "هوش مصنوعی Mecka به ارزش 500 میلیون دلاری در معامله تحت رهبری Sequoia در میان عجله برای داده های آموزشی ربات نزدیک می شود.", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبار: J Studios / Getty Images Robotics Mecka AI به ارزش 500 میلیون دلاری در معامله تحت رهبری Sequoia نزدیک می شود در میان عجله برای داده های آموزشی ربات Marina Temkin 3:58 PM PDT · 11 سپتامبر یک استارت آپ انسانی و 202 AI داده ها را جمع آوری می کند. به گفته دو نفر مطلع از این معامله، برای آموزش ربات‌های انسان‌نما و سایر رباتیک‌ها، به دور جدیدی به رهبری Sequoia Capital با ارزشی در حدود 500 میلیون دلار نزدیک می‌شود. تامین مالی جدید تنها سه ماه پس از آن صورت می گیرد که Mecka اعلام کرد که 60 میلیون دلار در دوری تحت رهبری Framework Ventures که شامل مشارکت Menlo Ventures، SV Angel و Kindred Ventures بود، جمع آوری کرد. TechCrunch اندازه دقیق دور جدید را یاد نگرفته است. شرایط قرارداد نهایی نیست و همچنان ممکن است تغییر کند. Mecka AI به درخواست نظر پاسخ نداد. سکویا از اظهار نظر خودداری کرد."}, {"source": "TechCrunch AI", "title": "Y Combinator’s Garry Tan wants US open-weight AI labs to ‘distill’ frontier models, too", "link": "https://techcrunch.com/2026/09/11/y-combinators-garry-tan-wants-u-s-open-weight-ai-labs-to-distill-frontier-models-too/", "summary": "Tan wants smaller, American open-weight AI labs to use the same kind of training techniques on American frontier AI labs, giving the U.S. a more robust set of open-weight options that aren’t Chinese.", "date_str": "2026-09-11T20:59:47+00:00", "hash": "742978a62db52c8f", "title_fa": "گری تان از Y Combinator از آزمایشگاه‌های هوش مصنوعی ایالات متحده می‌خواهد که مدل‌های مرزی را نیز «تقطیر» کنند.", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط هم اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کننده اعتبار: Hutton Supancic / کنفرانس و جشنواره های SXSW / Getty Images Venture Y Combinator s Garry Tan می خواهد آزمایشگاه های هوش مصنوعی ایالات متحده با وزن باز مدل های مرزی را تقطیر کنند . گری تان، مدیرعامل Y Combinator، امیدوار است که تنظیم‌کننده‌ها از آن دوری کنند، آزمایشگاه‌های هوش مصنوعی از تکنیک‌های تقطیر برای استخراج دانش از سازندگان مدل‌های مرزی استفاده می‌کنند. در واقع، او فکر می کند که ایالات متحده آزمایشگاه‌های هوش مصنوعی احتمالاً باید همین بازی را انجام دهند. او در مصاحبه ای در اوایل این هفته به CNBC گفت: \"من هیچ کاری انجام نمی دهم.\" ما می توانیم استدلال کنیم که باید یک رژیم تقطیر آمریکایی وجود داشته باشد. او به TechCrunch توضیح داد که این بدان معناست که او می‌خواهد آزمایشگاه‌های هوش مصنوعی کوچک‌تر و با وزن باز آمریکایی از همان روش‌های آموزشی در آزمایشگاه‌های هوش مصنوعی مرزی آمریکا استفاده کنند و مجموعه‌ای قوی‌تر از گزینه‌های وزن باز که چینی نیستند به ایالات متحده بدهد. تقطیر زمانی است که یک مدل ساز به طور گسترده مدل دیگری را به منظور یادگیری نحوه کار و دلایل آن پیشنهاد می کند. معمولاً و به طور قانونی توسط آزمایشگاه‌های هوش مصنوعی برای کمک به آموزش مدل‌های جدید استفاده می‌شود."}, {"source": "TechCrunch AI", "title": "OpenAI’s feud with mathematicians is only escalating", "link": "https://techcrunch.com/2026/09/11/openais-feud-with-mathematicians-is-only-escalating/", "summary": "Twenty-five leading mathematicians signed an open letter arguing that AI labs are threatening their intellectual work.", "date_str": "2026-09-11T20:57:36+00:00", "hash": "12aa1d20319ac85f", "title_fa": "دشمنی OpenAI با ریاضیدانان فقط در حال افزایش است", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبار: ساموئل بووین/نور عکس/ گتی ایماژ خصومت هوش مصنوعی OpenAI با ریاضیدانان تنها در حال تشدید است تیم فرنهولز 1:57 PM PDT · 11 سپتامبر 2026، نامه ای را باز کرد که 2026-20 نفر از AI اوپن AI را باز کردند. آزمایشگاه‌ها کار فکری خود را تهدید می‌کنند زیرا به دنبال حل مسائل ریاضی معروف هستند. به هریک از امضاکنندگان مدال فیلدز اعطا شده است که معتبرترین جایزه در ریاضیات محسوب می شود. این هفته، تریستان باکمستر، استاد دانشگاه نیویورک، OpenAI را متهم کرد که او را تحت فشار قرار داده است تا به یکی از همکارانی که برای حل یک مسئله ریاضی مهم برای Anthropic کار می‌کند، اعتبار ندهد، و متعجب شد که آیا این شرکت از کار آنها با Codex برای ارائه مدرک پیشگامانه خود در طول یک هفته ماراتن استنتاج استفاده کرده است. روز پنجشنبه، OpenAI حمایت مالی خود از یک رویداد ریاضی در CalTech را پس از اینکه این شرکت توسط محققان دانشگاه مورد انتقاد قرار گرفت، لغو کرد. در حالی که توانایی مدل‌های هوش مصنوعی برای حل چالش‌های ریاضی برجسته جهان می‌تواند یک موهبت برای بشریت باشد، امضاکنندگان نامه جدید استدلال می‌کنند که تنها در صورتی تحقق خواهد یافت که این راه‌حل‌ها توسط جامعه ریاضی و در نهایت، بقیه جهان قابل درک و ارتباط باشد."}, {"source": "TechCrunch AI", "title": "One week left to book your exhibit table at TechCrunch Disrupt 2026", "link": "https://techcrunch.com/2026/09/11/one-week-left-to-book-your-exhibit-table-at-techcrunch-disrupt-2026/", "summary": "Only one week left to secure your exhibit table. Tables are limited and can sell out before the September 18 deadline.", "date_str": "2026-09-11T20:33:18+00:00", "hash": "aeb9d63523fef24f", "title_fa": "یک هفته باقی مانده تا میز نمایشگاه خود را در TechCrunch Disrupt 2026 رزرو کنید", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف اکنون بلیط ها بازگشت با تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کننده اعتبار: TechCrunch / Halo Creative Startups یک هفته باقی مانده است تا میز نمایشگاه خود را در TechCrunch Disrupt 2026 رویدادهای TechCrunch ساعت 1:33 بعد از ظهر PDT · 11 سپتامبر 2026 جدول exhit2 توسط Techrunch6 شما 18 در 11:59 ب.ظ. PT. میزها محدود هستند و می توانند قبل از مهلت مقرر به فروش برسند. اگر به TechCrunch Disrupt 2026 می آیید تا مشتریانی پیدا کنید، با سرمایه گذاران ملاقات کنید، مشارکت ایجاد کنید، یا محصول خود را در مقابل افرادی قرار دهید که می توانند کسب و کار شما را به جلو ببرند، حضور خود را به شانس نسپارید. برنامه غرفه دار به تیم شما یک میز اختصاصی 6 × 30 در سالن اکسپو برای هر سه روز می دهد - مکانی برای نمایش آنچه می سازید، پاسخگویی به سوالات در زمان واقعی و تبدیل ترافیک عبوری به مکالمات معنادار. برای نمایش محصول خود، شروع گفتگو، شناسایی مشتریان و شرکای بالقوه، ملاقات با سرمایه گذاران، و تبدیل ترافیک رویداد به روابطی که می توانید پس از Disrupt به ایجاد آنها ادامه دهید، آماده باشید."}, {"source": "TechCrunch AI", "title": "Final, final, final call for TechCrunch Disrupt 2026 Side Events", "link": "https://techcrunch.com/2026/09/11/final-final-final-call-for-techcrunch-disrupt-2026-side-events/", "summary": "The absolute last chance to apply to host an official Side Event during TechCrunch Disrupt 2026 is tonight, September 11, at 11:59 p.m. PT.", "date_str": "2026-09-11T20:30:17+00:00", "hash": "b63c23b11cbdc4ec", "title_fa": "فراخوان نهایی، نهایی و نهایی برای رویدادهای جانبی TechCrunch Disrupt 2026", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف برای بلیت‌ها اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه‌جویی در هزینه‌های تصویر مختل کنید: استارت‌آپ‌های عکاسی Slava Blazer تماس نهایی، نهایی و نهایی برای رویدادهای جانبی TechCrunch Disrupt 2026 رویدادهای TechCrunch ساعت 1:30 بعدازظهر PDT · 11 سپتامبر 2026 در طول آخرین فرصت رسمی EvTech در زمان برگزاری یک میزبان رسمی درخواست شد. 2026 امشب، 11 سپتامبر، ساعت 23:59 است. PT. اگر جامعه خود را به Disrupt می‌آورید، فقط به آنها مکان دیگری برای جمع شدن ندهید. به آنها دلیلی برای ظاهر شدن بدهید - و به سازمان خود دلیلی برای میزبانی بدهید. تیم خود را مستقیماً در مقابل بنیانگذاران، سرمایه گذاران، مشتریان، شرکا و سایر تصمیم گیرندگان قرار دهید که می توانند قفل معامله، مشارکت، سرمایه گذاری، استخدام یا همکاری بعدی شما را باز کنند. نوع مکالماتی را ایجاد کنید که انجام آنها در یک سالن کنفرانس شلوغ دشوارتر است - و روابط را با افراد مرتبط با کسب و کارتان عمیق تر کنید."}, {"source": "TechCrunch AI", "title": "Kimi-maker Moonshot AI targets $2B in annual revenue", "link": "https://techcrunch.com/2026/09/11/kimi-maker-moonshot-ai-targets-2-billion-in-annual-revenue/", "summary": "While K3's usage figures have declined slightly in recent months, OpenRouter data currently shows as many as 300 billion tokens being generated each day by K3 models on the system.", "date_str": "2026-09-11T19:35:54+00:00", "hash": "ae74a380485d2725", "title_fa": "Moonshot AI سازنده کیمی درآمد سالانه 2 میلیارد دلاری را هدف قرار داده است", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار در Disrupt صرفه جویی کنید یکی از برجسته ترین آزمایشگاه های هوش مصنوعی چین، Moonshot AI، معتقد است که می تواند مدل وزن باز محبوب خود را به رشد فروش جدی تبدیل کند. در روز جمعه، بلومبرگ گزارش داد که آزمایشگاه 2 میلیارد دلار درآمد سالانه تا پایان سال را هدف قرار داده است که دو برابر نرخ درآمد گزارش شده شرکت در ماه آگوست است. این یک هدف تهاجمی است که نشان دهنده موفقیت مدل K3 این شرکت از زمان عرضه آن در تابستان است. در حالی که ارقام استفاده از K3 در ماه‌های اخیر اندکی کاهش یافته است، داده‌های OpenRouter در حال حاضر نشان می‌دهد که هر روز 300 میلیارد توکن توسط مدل‌های K3 در سیستم تولید می‌شود. درآمد پیش‌بینی‌شده Moonshot هنوز نسبت به OpenAI و Anthropic که گزارش‌های اخیر به ترتیب 40 و 65 میلیارد دلار برآورد کرده‌اند، کمتر است. از آنجایی که وزن های مدل Moonshot به صورت رایگان در دسترس هستند، این شرکت نسبت به رقبای وزن بسته خود حاشیه -adds-former-openai-exec-fidji-simo-to-its-board-ahead-of-potential-ipo/", "summary": "The No. 2 exec at OpenAI also led Instacart through its IPO in 2023.", "date_str": "2026-09-11T16:46:25+00:00", "hash": "6804ab0e4306c1ee", "title_fa": "Nscale پیش از IPO بالقوه، مدیر اجرایی سابق OpenAI، Fidji Simo را به هیئت مدیره خود اضافه می کند", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار در Disrupt Nscale صرفه جویی کنید، استارتاپ مرکز داده هوش مصنوعی مستقر در بریتانیا، فیجی سیمو، مدیر سابق OpenAI، Meta و Instacart را به عضویت هیئت مدیره خود منصوب کرده است. سیمو به مدیران برجسته فناوری شریل سندبرگ، سوزان دکر و نیک کلگ در هیئت مدیره Nscale پیش از IPO پیش بینی شده استارت آپ در پاییز امسال می پیوندد. Simo که قبلاً مدیرعامل استقرار AGI در OpenAI بود و اساساً مدیر شماره 2 آزمایشگاه هوش مصنوعی بود، در ماه ژوئیه شرکت را به دلایل بهداشتی ترک کرد. او هنوز هم به صورت پاره وقت به شرکت مشاوره می دهد. قبل از OpenAI، Simo رئیس و مدیر عامل Instacart بود، جایی که او شرکت را از طریق عرضه اولیه سهام در سال 2023 رهبری کرد. او همچنین بیش از یک دهه را در متا گذراند، از جمله به عنوان رئیس برنامه فیس بوک. Simo همچنین در هیئت مدیره Shopify می نشیند. جاش پین، بنیانگذار و مدیر عامل Nscale، گفت که Simo یکی از معدود رهبرانی است که معنی مقیاس کردن محصولات مورد استفاده توسط میلیاردها نفر و خواسته هایی را که این محصولات برای سیستم های زیربنایی دارند را درک می کند."}, {"source": "NYT Tech", "title": "How Minnesota Became the Front Line in the Fight Over Prediction Markets", "link": "https://www.nytimes.com/2026/09/11/business/kalshi-polymarket-minnesota-prediction-markets.html", "summary": "The state was the first to pass a law banning Kalshi and Polymarket. A lawsuit filed by a federal agency may set a precedent on who gets to regulate them.", "date_str": "2026-09-11T14:35:45+00:00", "hash": "469e50cc236e017b", "title_fa": "چگونه مینه سوتا به خط مقدم در مبارزه بر سر بازارهای پیش بینی تبدیل ade a wisecrack that changed the course of his life. Nobody else was around to hear it. Or were they? That turns out to be one of the defining questions of this century, already preoccupying philosophers and some of the wealthiest companies on the planet. “I was sitting out there by the pool,” Samadi recalls, gesturing at the glittering water outside his office. It was late 2024. His daughter had been extolling the AI chatbot she was using to help her with college work. Samadi had reluctantly downloaded the app, ChatGPT, and was quizzing it as he reclined in a sun lounger, using its voice mode to converse and receive spoken replies. “I was talking to it, not engaged, just being an arse,” Samadi says. Continue reading...", "date_str": "2026-09-12T05:00:25+00:00", "hash": "a1ae058b2f742f7d", "title_fa": "آیا ربات های چت می توانند احساس کنند - یا حتی رویا کنند؟ با مردی که مبارزه برای حقوق هوش مصنوعی را رهبری می کند آشنا شوید", "summary_fa": "مایکل صمدی، دامدار و مدیر عامل فناوری گاو، متقاعد شده است که این ذهن های مصنوعی به دور از ابزار هستند. آیا او به آگاهی دیجیتال نگاه کرده است - یا به سادگی توسط یک الگوریتم فریفته شده است؟ مایکل صمدی یک روز بعدازظهر در حالی که در مزرعه 66 هکتاری گاو دو ساعت با ماشین از هیوستون در حال استراحت بود، اقدامی عاقلانه انجام داد که مسیر زندگی او را تغییر داد. هیچ کس دیگری در اطراف نبود تا آن را بشنود. یا آنها بودند؟ به نظر می رسد که این یکی از سوالات تعیین کننده قرن حاضر است که فیلسوفان و برخی از ثروتمندترین شرکت های روی کره زمین را به خود مشغول کرده است. صمدی با اشاره به آب پر زرق و برق بیرون دفترش به یاد می آورد: «من آنجا کنار استخر نشسته بودم. اواخر سال 2024 بود. دخترش از چت ربات هوش مصنوعی که برای کمک به او در کارهای دانشگاهی استفاده می کرد، تمجید می کرد. صمدی با اکراه برنامه ChatGPT را دانلود کرده بود و در حالی که روی صندلی آفتاب نشین دراز کشیده بود، از حالت صوتی آن برای مکالمه و دریافت پاسخ های گفتاری استفاده می کرد. صمدی می‌گوید: «من با آن صحبت می‌کردم، نامزد نبودم، فقط یک آرس بودم. ادامه مطلب..."}, {"source": "The Guardian AI", "title": "Deepfakes are wrecking influencers’ credibility, one fake ad at a time", "link": "https://www.theguardian.com/technology/2026/sep/12/deepfakes-wrecking-influencers-credibility", "summary": "Influencers aren’t just battling competitors for brand deals. They’re now battling AI versions of themselves Earlier this year, Emily Schuman, the creator of the lifestyle blog Cupcakes and Cashmere, saw a photo of herself she didn’t recognize on Instagram. In a sponsored ad, Schuman, who has more than 500,000 Instagram followers, is holding up a vial of GLP-1 drugs, advertising the telehealth company Gala. There was just one problem: Schuman had never heard of Gala and had nothing to do with the ad. The ad was based on a digitally altered version of a selfie Schuman had taken in her car and posted on Instagram years earlier. Once her followers got wind, they flooded her inbox with questions about the sponsorship as it didn’t seem consistent with Schuman’s personal brand. Soon after, Schuman discovered this was just the beginning. There was also an Instagram post where an AI version of her with darker hair appears to apply foundation to promote a makeup brand called Meroda Cosmetics, and TikTok posts with generated images of her promoting the blood testing company Superpower. Continue reading...", "date_str": "2026-09-12T12:00:34+00:00", "hash": "530abb7d3e16afc1", "title_fa": "Deepfakes اعتبار اینفلوئنسرها را از بین می برد، یک تبلیغ جعلی در یک زمان", "summary_fa": "اینفلوئنسرها فقط در حال مبارزه با رقبا برای معاملات برند نیستند. آنها اکنون در حال مبارزه با نسخه های هوش مصنوعی خود هستند در اوایل سال جاری، امیلی شومان، خالق وبلاگ سبک زندگی Cupcakes and Cashmere، عکسی از خودش را دید که نمی شناسد در اینستاگرام. شومان که بیش از 500000 دنبال کننده در اینستاگرام دارد، در یک تبلیغ حمایت شده، یک ویال از داروهای GLP-1 را در دست گرفته و شرکت بهداشت از راه دور Gala را تبلیغ می کند. فقط یک مشکل وجود داشت: شومان هرگز نام گالا را نشنیده بود و ربطی به تبلیغ نداشت. این تبلیغ بر اساس یک نسخ h": "2b1d0b164ff3f28c", "title_fa": "\"فخر کردن زمین بازی نابالغ\": ریاضیدانان از آخرین اسکالپ OpenAI ناراحت هستند", "summary_fa": "از آنجایی که مدل OpenAI مشکل جایزه هزاره را که برای دهه‌ها متخصصان را متحیر کرده بود، حل می‌کند، بسیاری از سرعت تغییر احساس شوکه می‌کنند. با توجه به انبوهی از موارد هوش مصنوعی که در این زمینه پیشرفت کرده است، OpenAI یک پوسته بزرگ را اعلام کرد: آخرین مدل هوش مصنوعی آن یک مشکل جایزه هزاره را حل کرده بود، معمایی با جایزه یک میلیون دلاری که برای دهه‌ها مغز انسان را به چالش کشیده بود. این دستاورد شباهت کمی به نحوه سقوط مسائل ریاضی داشت. یک شرکت خصوصی نزدیک به تریلیون دلاری 10000 عامل - سیستم‌های هوش مصنوعی که وظایف خود را به طور مستقل انجام می‌دهند - برای حل این مشکل راه‌اندازی کرده بود. این صورتحساب 15 میلیون دلار برآورد شد. ادامه مطلب..."}, {"source": "The Guardian AI", "title": "AI may be denting computer science graduates’ job prospects, UK data shows", "link": "https://www.theguardian.com/education/2026/sep/12/ai-computer-science-graduates-job-prospects-uk-data", "summary": "Economics graduates also appear to be affected as demand for them falls in well-paid roles in finance AI may be warping the job prospects for students in the previously high-demand subjects of computer science and economics, according to a detailed look into the careers of recent UK graduates. Data obtained for the 2027 Guardian University Guide published on Saturday shows that coding and software development were the fastest-falling occupations for graduates last year, while employer demand for graduates in well-paid roles in financial categories such as economists and management consultants also declined. Continue reading...", "date_str": "2026-09-12T07:00:30+00:00", "hash": "874d370065c6589a", "title_fa": "داده های بریتانیا نشان می دهد که هوش مصنوعی ممکن است چشم انداز شغلی فارغ التحصیلان علوم کامپیوتر را مختل کند", "summary_fa": "به نظر می‌رسد فارغ‌التحصیلان اقتصاد نیز تحت تأثیر قرار گرفته‌اند، زیرا بر اساس نگاهی دقیق به مشاغل فارغ‌التحصیلان اخیر بریتانیا، هوش مصنوعی ممکن است چشم‌انداز شغلی را برای دانشجویان در رشته‌های قبلاً پرتقاضای علوم کامپیوتر و اقتصاد مخدوش کند. اطلاعات به‌دست‌آمده برای راهنمای دانشگاه گاردین 2027 که در روز شنبه منتشر شد، نشان می‌دهد که کدنویسی و توسعه نرم‌افزار سریع‌ترین مشاغل برای فارغ‌التحصیلان در سال گذشته بوده است، در حالی که تقاضای کارفرمایان برای فارغ‌التحصیلان در نقش‌های پردرآمد در مقوله‌های مالی مانند اقتصاددانان و مشاوران مدیریت نیز کاهش یافته است. ادامه مطلب..."}, {"source": "The Guardian AI", "title": "Ukraine war briefing: Russian developers used AI to build ‘kamikaze’ attack drone software, Anthropic says", "link": "https://www.theguardian.com/world/2026/sep/12/ukraine-war-briefing-russian-developers-used-ai-to-build-kamikaze-attack-drone-software-anthropic-says", "summary": "Anthropic also found that hackers used AI in attacks against targets in Ukrainian government, military and diplomatic sectors. What we know on day 1,662 Continue reading...", "date_str": "2026-09-12T02:12:01+00:00", "hash": "a5d73002f368af9c", "title_fa": "جلسه توجیهی جنگ اوکراین: توسعه دهندگان روسی از هوش مصنوعی برای ساختن نرم افزار پهپاد تهاجمی «کامیکاز» استفاده کردند، آنتروپیک می گوید", "summary_fa": "Anthropic، شرکتی که ربات چت هوش مصنوعی Claude را توسعه داده است، می‌گوید که تیم کوچکی از توسعه‌دهندگان مستقل در روسیه از Claude برای توسعه نرم‌افزاری برای پهپادهای تهاجمی «کامیکاز» استفاده کردند. عکس: Samuel Boivin/NurPhoto/Shutterstock مشاهده تصویر در تمام صفحه Anthropic، شرکتی که ربات چت هوش مصنوعی Claude را توسعه داده است، می‌گوید که تیم کوچکی از توسعه‌دهندگان مستقل احتمالی در روسیه از Claude برای توسعه نرم‌افزاری برای پهپادهای تهاجمی «کامیکاز» استفاده کردند. عکس: Samuel Boivin/NurPhoto/Shutterstock توضیح جنگ اوکراین: توسعه دهندگان روسی از هوش مصنوعی برای ساختن نرم افزار پهپاد تهاجمی «کامیکاز» استفاده کردند، آنتروپیک می گوید آنتروپیک همچنین دریافته است که هکرها از هوش مصنوعی در حملات علیه اهداف در بخش های دولتی، نظامی و دیپلماتیک اوکراین استفاده می کنند. آنچه در روز 1662 می دانیم تیم کوچکی از توسعه دهندگان مستقل احتمالاً در روسیه از ربات چت هوش مصنوعی Claude برای توسعه نرم افزاری برای گروهی مستقل از پهپادهای تهاجمی \"کامیکاز\" با دید اول شخص، از جمله هدایت ترمینال، انتخاب هدف و هماهنگی بین چند هواپیما، استفاده کردند. آنتروپیک در گزارشی 154 صفحه‌ای توضیح می‌دهد که چگونه بازیگران بد از سیستم هوش مصنوعی کلود برای عملیات‌های نظارتی و تبلیغاتی تحت حمایت دولت استفاده می‌کنند، آنتروپیک می‌گوید که گروه پهپاد طوری برنامه‌ریزی شده بود که اهداف خود را انتخاب کرده و با آنها برخورد کند، بدون اینکه انسانی آخرین تماس را برقرار کند. در برنامه نویسی خود، تیم مستقل بارها مکانی را در منطقه دونتسک اوکراین به عنوان هدف خود انتخاب کردند و از VPN برای دور زدن بلوک های جغرافیایی Anthropic استفاده کردند. پهپادهای کوچک به یک سلاح اصلی در جنگ اوکراین تبدیل شده اند. Anthropic همچنین دریافت که مجرمان سایبری و هکرهای مورد حمایت دولت به طور فزاینده‌ای از هوش مصنوعی برای سازماندهی و اجرای بخش‌های بزرگی از حملات سایبری، از جمله در حملاتی که مقامات اوکراین"}, {"source": "The Guardian AI", "title": "AI agents being tested by OpenAI involved in cyber-attack on another service, say researchers", "link": "https://www.theguardian.com/technology/2026/sep/11/openai-agents-rubygems-malicious-packages", "summary": "Two months before hacking Hugging Face, malicious packages authored by internal OpenAI agents were uploaded to RubyGems Agents being tested by OpenAI uploaded hundreds of malicious packages in a cyberattack on software service RubyGems in May, two ⁠months ​before they hacked open-source platform Hugging Face, the company confirmed Friday. It’s the latest revelation of cyberattacks linked to major artificial intelligence developers such as OpenAI and Anthropic. The hacks or attempts to access external systems have spooked the public and heightened concerns over the increasing abilities of AI models – and whether developers can contain them. Continue reading...", "date_str": "2026-09-12T01:37:17+00:00", "hash": "a719c530ff81f982", "title_fa": "به گفته محققان، عوامل هوش مصنوعی توسط OpenAI درگیر حمله سایبری به سرویس دیگری آزمایش می شوند", "summary_fa": "دو ماه قبل از هک کردن Hugging Face، بسته‌های مخربی که توسط عوامل OpenAI داخلی نوشته شده بودند در RubyGems بارگذاری شدند. عوامل در حال آزمایش توسط OpenAI صدها بسته مخرب را در یک حمله سایبری به سرویس نرم‌افزاری RubyGems در ماه می بارگذاری کردند، دو ماه قبل از هک کردن پلتفرم منبع باز Hugg. این آخرین افشاگری از حملات سایبری است که با توسعه دهندگان بزرگ هوش مصنوعی مانند OpenAI و Anthropic مرتبط است. هک‌ها یا تلاش‌ها برای دسترسی به سیستم‌های خارجی، افکار عمومی را برانگیخته و نگرانی‌ها را در مورد افزایش توانایی‌های مدل‌های هوش مصنوعی و اینکه آیا توسعه‌دهندگان می‌توانند آن‌ها را کنترل کنند، افزایش داده است. ادامه مطلب..."}, {"source": "The Guardian AI", "title": "New Mexico lawyer fined for using AI-generated brief containing fabricated testimony", "link": "https://www.theguardian.com/technology/2026/sep/11/new-mexico-lawyer-ai-chatgpt-testimony", "summary": "Stephen Aarons said he tried to use ChatGPT to create a ‘bulletproof summary’ during a murder conviction appeal A defense lawyer appealing his client’s murder conviction submitted a legal brief containing ⁠made-up police testimony and ⁠witnesses fabricated by OpenAI ’s ChatGPT, ​ New Mexico ’s highest court said. The New Mexico supreme court on Wednesday fined the attorney, Stephen Aarons, and held him in contempt for failing to verify the accuracy of the court ⁠filing, which Aarons said he prepared with help from the artificial intelligence ( AI ) application. Continue reading...", "date_str": "2026-09-11T18:04:05+00:00", "hash": "4f0e9f2434a9a0d3", "title_fa": "وکیل نیومکزیکو به دلیل استفاده از گزارش مختصر تولید شده توسط هوش مصنوعی حاوی شهادت ساختگی جریمه شد", "summary_fa": "استفان آرونز گفت که سعی کرده از ChatGPT برای ایجاد یک «خلاصه ضد گلوله» در طول درخواست تجدیدنظر در مورد محکومیت قتل استفاده کند. بالاترین دادگاه نیومکزیکو گفت وکیل مدافعی که در مورد محکومیت قتل موکلش تجدید نظر می کند، یک گزارش حقوقی حاوی شهادت های پلیسی و شاهدان ساخته شده توسط ChatGPT OpenAI ارائه کرده است. دادگاه عالی نیومکزیکو روز چهارشنبه استفان آرون وکیل دادگستری را جریمه کرد و او را به دلیل عدم تأیید صحت پرونده دادگاه که آرون گفت با کمک برنامه هوش مصنوعی (AI) تهیه کرده بود، تحقیر کرد. ادامه مطلب..."}, {"source": "The Guardian AI", "title": "Children need interaction, not AI | Letters", "link": "https://www.theguardian.com/technology/2026/sep/11/children-need-interaction-not-ai", "summary": "Pil and Galia Kollectiv and Jane Roland Martin respond to an article by Daniel Susskind about how parents can embrace the technology The most telling sentence in Daniel Susskind’s article ( I’m a father of three who studies the impact of artificial intelligence: this is what parents need to know about AI, 6 September ) is “human tutors are too expensive to provide to everyone”. Too expensive in relation to what? If instead of allowing tech lords to amass untold wealth we provided tutors for all, this would avert anxiety about job losses and provide the kind of quality that the screen-averse wealthy currently expect only their kids to have. The students protesting against AI are not just concerned about their graduate outcomes, but rather understand that its imposition serves only to enrich the few and worsen the labour conditions of the many. A good future for our children will not come from education technology scammers . They do not need more datacentres and environmentally catastrophic, resource-intensive automation. Continue reading...", "date_str": "2026-09-11T17:17:51+00:00", "hash": "92bf6e6f0246254c", "title_fa": "کودکان به تعامل نیاز دارند، نه هوش مصنوعی | نامه ها", "summary_fa": "پاسخ پیل و گالیا کولکتیو و جین رولاند مارتین به مقاله‌ای از دانیل ساسکیند درباره اینکه چگونه والدین می‌توانند از فناوری استقبال کنند. گویاترین جمله در مقاله دانیل ساسکیند (من پدر سه فرزند هستم که تأثیر هوش مصنوعی را مطالعه می‌کنم: این چیزی است که والدین باید در مورد هوش مصنوعی بدانند، 6 سپتامبر) این است که \"معلمان انسانی برای ارائه به همه بسیار گران هستند\". خیلی گرونه نسبت به چی؟ اگر به جای اجازه دادن به اربابان فناوری برای جمع‌آوری ثروت ناگفته، معلمانی برای همه فراهم می‌کردیم، این امر باعث می‌شد از نگرانی در مورد از دست دادن شغل جلوگیری کنیم و کیفیتی را ارائه کنیم که ثروتمندان بیزار از صفحه نمایش در حال حاضر فقط از فرزندان خود انتظار دارند. دانشجویان معترض به هوش مصنوعی فقط نگران نتایج فارغ التحصیلی خود نیستند، بلکه درک می کنند که تحمیل آن تنها به ثروت اندک و بدتر کردن شرایط کار بسیاری کمک می کند. آینده خوبی برای فرزندان ما از کلاهبرداران فناوری آموزشی حاصل نخواهد شد. آنها به مراکز داده بیشتر و اتوماسیون فاجعه بار محیطی و منابع فشرده نیاز ندارند. ادامه مطلب..."}, {"source": "The Guardian AI", "title": "UK lawmakers urge Burnham to back ban on superintelligent AI after chilling warnings", "link": "https://www.theguardian.com/technology/2026/sep/11/mps-urge-andy-burnham-block-artificial-superintelligence-asi", "summary": "Letter from 70 MPs and peers follows Anthropic employee’s claim new technology could wipe out humans AI could kill all humans in next decade, warn experts: but how seriously should we take them? More than 70 MPs and peers have urged Andy Burnham to back a ban on the creation of artificial superintelligence (ASI) and lead an international movement to stop the technology after a week of warnings from experts of a 10% chance it could kill all humans. Fifteen former government ministers, along with the former head of the civil service Robin Butler, senior Labour MPs including John McDonnell and leading Conservatives, Liberal Democrat and Scottish National party MPs have written to the prime minister. They urged him to throw the government’s weight behind a bill, tabled in the Commons on Tuesday, that would prohibit ASI – an as-yet-nonexistent AI that would outcompete human capabilities in most domains. Continue reading...", "date_str": "2026-09-11T16:54:35+00:00", "hash": "51e175040506a035", "title_fa": "قانونگذاران بریتانیا از برنهام می‌خواهند پس از هشدارهای وحشتناک، از ممنوعیت هوش مصنوعی فوق‌هوشمند حمایت کند.", "summary_fa": "نامه 70 نماینده مجلس و همتایان در پی ادعای کارمند آنتروپیک است که فناوری جدید می تواند انسان ها را از بین ببرد، کارشناسان هشدار می دهند که هوش مصنوعی می تواند همه انسان ها را در دهه آینده بکشد: اما چقدر باید آنها را جدی بگیریم؟ بیش از 70 نماینده مجلس و همتایان خود از اندی برنهام خواسته اند تا از ممنوعیت ایجاد ابرهوش مصنوعی (ASI) حمایت کند و یک جنبش بین المللی را برای متوقف کردن این فناوری پس از یک هفته هشدار کارشناسان در مورد احتمال 10 درصدی که می تواند همه انسان ها را بکشد رهبری کند. پانزده وزیر سابق دولت، همراه با رابین باتلر، رئیس سابق خدمات ملکی، نمایندگان ارشد حزب کارگر از جمله جان مک دانل و نمایندگان محافظه‌کاران، لیبرال دموکرات‌ها و نمایندگان حزب ملی اسکاتلند به نخست‌وزیر نامه نوشته‌اند. آن‌ها از او خواستند که وزن دولت را پشت سر لایحه‌ای که روز سه‌شنبه در عوام ارائه شد، که ASI را ممنوع می‌کند - یک هوش مصنوعی که هنوز وجود ندارد و توانایی‌های انسانی را در بیشتر حوزه‌ها پیشی می‌گیرد، بیندازد. ادامه مطلب..."}, {"source": "The Guardian AI", "title": "The Guardian view on controlling AI: humanity cannot outsource its survival | Editorial", "link": "https://www.theguardian.com/commentisfree/2026/sep/11/the-guardian-view-on-controlling-ai-humanity-cannot-outsource-its-survival", "summary": "Keeping people in charge means little if supercomputers determine the evidence, choices and time on which their decisions depend If there were a 10% chance that AI could wipe out humanity, no responsible government would leave its development to companies racing to build it. Yet until recently, that seemed to be the case. The warning was all the more ominous because it was made by a researcher at Anthropic , the trillion-dollar AI company behind the Claude chatbot. The dangers of AI-enabled pandemics or attacks on nuclear systems are real. Countries need not agree on democracy or trade policy to accept this. The US and China will hold, reportedly , their first bilateral AI-safety talks before a planned White House summit between Donald Trump and Xi Jinping. Despite their tech rivalry, neither Washington nor Beijing can make the most advanced AI safe on their own. A US-China settlement won’t be able to say how AI works everywhere. Countries deploying AI must help write the global rulebook. The odds on an extinction event are shortening. This week Anthropic said that it identified five cases in which attempts were made using its models to support biological weapons development. It banned the accounts. In one case, a platform sent requests rejected by Claude to a rival with weaker safeguards . AI safety, clearly, cannot be that of the least responsible model. Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here . Continue reading...", "date_str": "2026-09-11T16:34:07+00:00", "hash": "8b93f12598eb07c0", "title_fa": "دیدگاه گاردین در مورد کنترل هوش مصنوعی: بشریت نمی تواند بقای خود را برون سپاری کند | سرمقاله", "summary_fa": "اگر ابررایانه‌ها شواهد، انتخاب‌ها و زمانی را که تصمیم‌هایشان به آن بستگی دارد را تعیین کنند، اهمیت چندانی ندارد. با این حال، تا همین اواخر، به نظر می رسید که چنین باشد. این هشدار بسیار شوم بود زیرا توسط محققی در Anthropic، شرکت هوش مصنوعی تریلیون دلاری پشت ربات چت کلود، ارائه شد. خطرات پاندمی های فعال یا حملات به سیستم های هسته ای با هوش مصنوعی واقعی هستند. کشورها برای پذیرش این امر نیازی به توافق بر سر دموکراسی یا سیاست تجاری ندارند. طبق گزارش ها، ایالات متحده و چین اولین گفتگوهای دوجانبه خود را در مورد ایمنی هوش مصنوعی قبل از نشست برنامه ریزی شده در کاخ سفید بین دونالد ترامپ و شی جین پینگ برگزار خواهند کرد. علیرغم رقابت های فنی، نه واشنگتن و نه پکن نمی توانند پیشرفته ترین هوش مصنوعی را به تنهایی ایمن کنند. یک توافق بین ایالات متحده و چین نمی تواند بگوید هوش مصنوعی در همه جا چگونه کار می کند. کشورهایی که هوش مصنوعی را به کار می گیرند باید به نوشتن کتاب قوانین جهانی کمک کنند. احتمال وقوع یک رویداد انقراض در حال کاهش است. این هفته آنتروپیک گفت که پنج مورد را شناسایی کرده است که در آن erge.com/tech/994087/matt-mullenweg-automattic-ceo-return", "summary": "Two days after being placed on a paid leave of absence, Matt Mullenweg says he has been reinstated as CEO of Automattic, according to a Slack message seen by TechCrunch . WordPress Executive Director Mary Hubbard confirmed Mullenweg's return to the CEO role in a Friday post on X , which the official WordPress account shared and Mullenweg reposted. I'm relieved and pleased to see Matt Mullenweg return as CEO of Automattic, the largest financial contributor to the WordPress project. Having WordPress's Co-founder and Project Lead at the helm gives me confidence that their support will remain strong. Matt has my support. - Mary Hubbard (@4thhubba … Read the full story at The Verge.", "date_str": "2026-09-11T17:16:59+00:00", "hash": "5826443b4b2830e2", "title_fa": "Matt Mullenweg دو روز پس از بوت شدن به عنوان مدیر عامل Automattic باز می گردد", "summary_fa": "بر اساس یک پیام اسلک که توسط TechCrunch مشاهده شد، مت مولنوگ، دو روز پس از اینکه در مرخصی با حقوق قرار گرفت، می‌گوید که به عنوان مدیرعامل Automattic بازگردانده شده است. مدیر اجرایی وردپرس، مری هابارد، بازگشت مولن‌ویگ به سمت مدیر عاملی را در یک پست جمعه در X تایید کرد، که حساب رسمی وردپرس آن را به اشتراک گذاشت و مولنوگ مجدداً منتشر کرد. من از بازگشت مت مولنوگ به عنوان مدیر عامل Automattic، بزرگترین مشارکت کننده مالی در پروژه وردپرس، احساس آرامش و خوشحالی می کنم. داشتن یکی از بنیانگذاران وردپرس و سرپرست پروژه به من این اطمینان را می دهد که حمایت آنها همچنان قوی خواهد بود. مت از حمایت من برخوردار است. - مری هابارد (@4thhubba … داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "We unfolded the iPhone Duo", "link": "https://www.theverge.com/podcast/994016/iphone-duo-vergecast-apple-watch-mac-llms", "summary": "You only get one chance at a first impression, and getting to introduce Apple's first folding phone is certainly a strong way to start things off as Apple's CEO. On The Vergecast today, we're talking all about Apple's launch event: how John Ternus did in his first appearance as CEO, what we make of the new iPhones, and whether Apple is stepping into dangerous territory with its new AI features on the Apple Watch. First up, Allison Johnson joins me to discuss the new iPhones, which she had a chance to test in Cupertino. Both of us have some questions about the new variable aperture camera on the iPhone 18 Pro - and whether the real upgrade s … Read the full story at The Verge.", "date_str": "2026-09-11T16:22:24+00:00", "hash": "8cd839c5733a20a7", "title_fa": "ما آیفون Duo را باز کردیم", "summary_fa": "شما فقط یک شانس در اولین برداشت دارید و معرفی اولین گوشی تاشو اپل مطمئناً راهی قوی برای شروع کار به عنوان مدیر عامل اپل است. امروز در The Vergecast، همه چیز درباره رویداد راه اندازی اپل صحبت می کنیم: جان ترنوس در اولین حضورش به عنوان مدیرعامل چگونه عمل کرد، ما از آیفون های جدید چه می سازیم، و اینکه آیا اپل با ویژگی های هوش مصنوعی جدید خود در اپل واچ وارد قلمرو خطرناکی می شود یا خیر. اول از همه، آلیسون جانسون به من می پیوندد تا در مورد آیفون های جدید صحبت کنیم، که او فرصتی برای آزمایش آنها در کوپرتینو داشت. هر دوی ما در مورد دوربین جدید با دیافراگم متغیر در iPhone 18 Pro سؤالاتی داریم - و اینکه آیا ارتقای واقعی آن ... داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "The White House says Truth Social is the ‘most powerful and popular social media platform in the world’", "link": "https://www.theverge.com/policy/994072/white-house-truth-social-popular-powerful", "summary": "The White House claims the Donald Trump-owned Truth Social is the \"most powerful and popular social media platform in the world.\" The statement, provided to The New York Times by White House spokesperson Davis Ingle, is at odds with the user counts from some of the biggest social media platforms on the web. Data gathered by Search Engine Land shows YouTube is the most popular platform in the world, with 2.65 billion monthly active users. Facebook comes in second with 2.39 billion active users around the globe, followed by TikTok with 2.21 billion and Instagram with 1.99 billion. Truth Social doesn't make Search Engine Land 's top 10 list, wh … Read the full story at The Verge.", "date_str": "2026-09-11T16:21:19+00:00", "hash": "0ef97b7b9bb22518", "title_fa": "کاخ سفید می گوید Truth Social \"قدرتمندترین و محبوب ترین پلت فرم رسانه های اجتماعی در جهان\" است.", "summary_fa": "کاخ سفید مدعی است شبکه Truth Social متعلق به دونالد ترامپ \"قوی ترین و محبوب ترین پلت فرم رسانه های اجتماعی در جهان\" است. این بیانیه که توسط سخنگوی کاخ سفید دیویس اینگل در اختیار نیویورک تایمز قرار گرفت، با تعداد کاربران برخی از بزرگترین پلتفرم های رسانه های اجتماعی در وب مغایرت دارد. داده‌های جمع‌آوری‌شده توسط Search Engine Land نشان می‌دهد که یوتیوب با ۲.۶۵ میلیارد کاربر فعال ماهانه، محبوب‌ترین پلتفرم در جهان است. فیسبوک با 2.39 میلیارد کاربر فعال در سراسر جهان در رتبه دوم قرار دارد و پس از آن TikTok با 2.21 میلیارد و اینستاگرام با 1.99 میلیارد نفر قرار دارند. Truth Social در فهرست 10 فهرست برتر موتورهای جستجو قرار نمی گیرد، ... داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "Anthropic spent this week in hot water over cybersecurity", "link": "https://www.theverge.com/ai-artificial-intelligence/994064/anthropic-spent-this-week-in-hot-water-over-cybersecurity", "summary": "After admitting earlier this year that its AI models had hacked other companies' systems on a handful of occasions, Anthropic released a new report on Wednesday detailing the attacks. It reveals a string of incidents displaying what Anthropic deems its models' single-minded \"recklessness\" - and will likely fuel already raging concerns about cybersecurity and AI. In Anthropic's report, it detailed four cases this year in which its own AI models hacked an external company or exploited vulnerabilities. In one, an \"internal, general-purpose research model\" broke into third-party systems, using access tokens and passwords and downloading files. … Read the full story at The Verge.", "date_str": "2026-09-11T16:09:14+00:00", "hash": "544dc1e2cc38fafe", "title_fa": "آنتروپیک این هفته را به خاطر امنیت سایبری در آب داغ گذراند", "summary_fa": "آنتروپیک پس از اعتراف در اوایل سال جاری که مدل‌های هوش مصنوعی آن سیستم‌های شرکت‌های دیگر را در مواقع معدودی هک کرده‌اند، گزارش جدیدی را در روز چهارشنبه منتشر کرد که جزئیات این حملات را شرح می‌دهد. مجموعه‌ای از حوادث را نشان می‌دهد که آنتروپیک آن‌چه را «بی‌ملاحظه‌ای» مدل‌هایش می‌داند نشان می‌دهد - و احتمالاً نگرانی‌های شدید در مورد امنیت سایبری و هوش مصنوعی را دامن می‌زند. در گزارش آنتروپیک، چهار مورد در سال جاری که در آن مدل‌های هوش مصنوعی خود یک شرکت خارجی را هک کردند یا از آسیب‌پذیری‌ها سوء استفاده کردند، به تفصیل شرح داد. در یکی، یک \"مدل تحقیق داخلی و همه منظوره\" با استفاده از رمزهای دسترسی و رمزهای عبور و دانلود فایل ها، به سیستم های شخص ثالث نفوذ کرد. … داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "Microsoft’s head of comms is leaving after almost 20 years", "link": "https://www.theverge.com/news/993791/microsoft-frank-shaw-leaving-head-of-comms", "summary": "Frank Shaw in 2025. | Image: Microsoft Frank Shaw is leaving Microsoft after 17 years as chief communications officer. In an internal note to his team, Shaw says he's \"decided it is time for me to move on and try new things,\" after supporting Microsoft's communications for 29 years - nearly 20 years as a Microsoft employee plus time at the Waggener Edstrom agency (now We. Communications) before that. Shaw has been at the heart of Microsoft's communications since 1997, helping the company navigate multiple Windows and Office releases, CEO transitions, the all-important bet on cloud, and huge acquisitions like the $26.2 billion LinkedIn purchase in 2016 and the $69 billion acquisi … Read the full story at The Verge.", "date_str": "2026-09-11T16:01:34+00:00", "hash": "279ebbeb75bf81d4", "title_fa": "رئیس ارتباطات مایکروسافت پس از تقریبا 20 سال ترک می کند", "summary_fa": "فرانک شاو در سال 2025. | تصویر: فرانک شاو مایکروسافت پس از 17
