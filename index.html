of the best surprises of our adult lives: a party with more than 40 of their closest friends and family members. They deserved to be celebrated My grandma traveled from Delaware to our hometown in Westchester County to help bring the surprise together. For months, she fielded my frantic calls about table arrangements, centerpieces, and cake flavors, while I dodged my parents at home. Trying to surprise the people you live with is no small feat. The author and her twin brother threw their parents a party for their 30th anniversary. Courtesy of the author I quietly texted out invitations, made decorations, including \"Back in 1996\" cards for each place setting, and coordinated with vendors and the restaurant to make sure every detail was just right. I was flooded with butterflies. I wanted so badly for them to be completely stunned — they deserved it. And because I had dropped off the decorations beforehand, the final setup was in the hands of my grandma and my best friend since kindergarten, who I tasked with bringing my vision to life. My brother and his girlfriend needed a believable reason to come home from Austin for the weekend. He told my parents they'd visit to celebrate their pearl anniversary , which made sense before a major work trip. He fibbed. There was no work trip . We surprised them Several weeks before they arrived, my brother \"made a reservation\" at one of our favorite restaurants — where he had worked in high schoo", "date_str": "2026-10-11T14:24:01+00:00", "hash": "125f5ab7c6c73d38", "title_fa": "پدر و مادرم 25 سال را صرف جشن گرفتن من کردند. برای 30 سالگی آنها، بالاخره توانستم آنها را جشن بگیرم.", "summary_fa": "پدر و مادر نویسنده 30 سال است که ازدواج کرده اند. با حسن نیت نویسنده والدین من در نوجوانی با هم آشنا شدند و امسال سی امین سالگرد ازدواج خود را جشن گرفتند. من و برادر دوقلویم با بیش از 40 دوست و اقوام آنها را غافلگیر کردیم. برنامه ریزی برای مهمانی به من یادآوری کرد که پدر و مادرم داستانی فراتر از بزرگ کردن ما دارند. پدر و مادرم در ماه مه 1986، زمانی که فقط 14 و 15 ساله بودند، آشنا شدند و در سپتامبر همان سال شروع به ملاقات کردند. فقط یک ماه بعد، مادرم 15 ساله شد. او نمی تواند دقیقاً به خاطر بیاورد که اولین قرار آنها چه بوده است. او می‌گوید شاید یک فیلم یا چیز ساده‌ای مانند معاشرت با دوستان. اما وقتی برای اولین بار پدرم - مردی آرام و در عین حال بامزه - را دید که با دوست صمیمی‌اش در حالی که در آن طرف خیابان بچه‌دار بود، بازی می‌کرد، هیچ‌کدام نمی‌دانستند که قرار است با هم چه نوع سفری داشته باشند. آنها در ژوئن 1996 در الکس هنری، یک سالن پذیرایی محبوب در آن زمان که چند سال بعد بسته شد، ازدواج کردند. امسال، یک روز قبل از 30 سالگی رسمی آنها، من و برادر دوقلویم آنچه را که می‌گفتم یکی از بهترین شگفتی‌های زندگی بزرگسالانمان بود، انجام دادیم: مهمانی با بیش از 40 نفر از نزدیک‌ترین دوستان و اعضای خانواده‌شان. آنها شایسته تجلیل بودند مادربزرگ من از دلاور به زادگاه ما در شهرستان وستچستر سفر کرد تا به جمع آوری شگفتی کمک کند. او برای ماه‌ها تماس‌های دیوانه‌وار من را در مورد چیدمان میز، تزئینات مرکزی و طعم‌های کیک انجام می‌داد، در حالی که من از والدینم در خانه طفره می‌رفتم. تلاش برای غافلگیری افرادی که با آنها زندگی می کنید کار کوچکی نیست. این نویسنده و برادر دوقلویش"}, {"source": "Business Insider", "title": "I'm an American who's pregnant in France. It's been great in some ways, but there are times I wish I were back home.", "link": "https://www.businessinsider.com/american-pregnant-in-france-benefits-challenges-surprises-2026-10", "summary": "There s a lot that I ve loved about the French approach to pregnancy. Audrey Bruno I knew I'd likely have my first child abroad when I married a Frenchman and moved to France in 2021. So far, I've loved a lot about France's approach to pregnancy , including the use of midwives. However, I miss American traditions like baby showers, my favorite snacks, and the people I love. When I fell in love with a Frenchman who wanted kids as much as I did, I knew there was a distinct possibility that I'd be going through pregnancy on foreign soil. And when we moved to France in 2021, with no intention of leaving anytime soon, my fate seemed all but sealed. Earlier in 2026, I found out that we were pregnant for the first time. For a year leading up to this moment, I'd set the stage for everything to go as smoothly as possible, ensuring that I was properly registered in France's national health-insurance program and completing all the preliminary checkups. Yet, despite my best efforts, nothing could have prepared me for the cultural differences surrounding pregnancy in France. Although I've found there's a lot to love about the French approach, there have also been a handful of times I've wished I were back in the US with my family in Southern California, where I'm originally from. I was expecting to have an OB-GYN, but using midwives is the norm over here I always thought I would have an OB-GYN, but that s less common in France. Grace Cary/Getty Images Though midwifery isn't regulated nationally in the US, it is in France. Here, midwives are required to attend six years of schooling and obtain a master's degree. They're allowed to prescribe medicine and lead childbirth, and I've found that most French people with low-risk pregnancies are recommended to them over OB-GYNs for all the steps of pregnancy and delivery. I'm being treated by three midwives, and I love the way they're specialized to my different needs. There's one who performs the sonograms and monthly checkups, one who will get me through the delivery, and one who provides classes to help me prepare. Plus, they'll visit you at home to make sure your recovery is on track after the big event. That's not as common with physicians in the US. Most of my pregnancy costs are covered by the national health insurance program Although I haven't been pregnant while living in the United States, I've heard plenty of horror stories about hefty hospital bills — even for Americans who are covered by insurance. By contrast, Fr", "date_str": "2026-10-11T14:21:01+00:00", "hash": "12b42cdee068106f", "title_fa": "من یک آمریکایی هستم که در فرانسه باردار هستم. از برخی جهات عالی بود، اما مواقعی وجود دارد که آرزو می کنم به خانه برگردم.", "summary_fa": "چیزهای زیادی در مورد رویکرد فرانسوی به بارداری دوست داشتم. آدری برونو وقتی با یک فرانسوی ازدواج کردم و در سال 2021 به فرانسه نقل مکان کردم، می‌دانستم که احتمالاً اولین فرزندم را در خارج از کشور خواهم داشت. با این حال، دلم برای سنت‌های آمریکایی مانند حمام کردن نوزاد، تنقلات مورد علاقه‌ام و افرادی که دوستشان دارم، تنگ شده است. وقتی عاشق مردی فرانسوی شدم که مثل من بچه می‌خواست، می‌دانستم که احتمال بارداری من در خاک خارجی وجود دارد. و هنگامی که در سال 2021 به فرانسه نقل مکان کردیم، بدون اینکه قصد ترک این زودی‌ها را نداشته باشیم، به نظر می‌رسد سرنوشت من کاملاً بسته شده است. اوایل سال 2026 متوجه شدم که برای اولین بار باردار شده ایم. برای یک سال منتهی به این لحظه، زمینه را فراهم کردم تا همه چیز تا حد امکان راحت پیش برود، و اطمینان حاصل کنم که به درستی در برنامه بیمه سلامت ملی فرانسه ثبت نام کرده ام و تمام معاینات اولیه را تکمیل کرده ام. با این حال، علیرغم تمام تلاش‌های من، هیچ چیز نمی‌توانست مرا برای تفاوت‌های فرهنگی پیرامون بارداری در فرانسه آماده کند. اگرچه متوجه شده ام که در مورد رویکرد فرانسوی چیزهای زیادی برای دوست داشتن وجود دارد، اما تعداد انگشت شماری نیز بوده است که آرزو کرده ام ای کاش به همراه خانواده ام در کالیفرنیای جنوبی، جایی که اصالتاً از آنجا هستم، به ایالات متحده برمی گشتم. من انتظار داشتم یک OB-GYN داشته باشم، اما استفاده از ماماها در اینجا عادی است، من همیشه فکر می کردم که یک OB-GYN داشته باشم، اما در فرانسه کمتر رایج است. گریس کری/گتی ایماژ اگرچه مامایی در ایالات متحده تحت نظارت ملی نیست، اما در فرانسه است. در اینجا ماماها ملزم به حضور در مدرسه شش ساله و اخذ مدرک کارشناسی ارشد هستند. آنها مجاز به"}, {"source": "Business Insider", "title": "Inside America's only internet sea cable maker, supplying Google and Microsoft", "link": "https://www.businessinsider.com/inside-americas-only-internet-sea-cable-maker-supplying-google-2026-10", "summary": "Ninety-nine percent of international internet traffic flows through cables stretched across the ocean floor. Demand is at an all-time high as the world becomes more dependent on cloud computing and AI. But only one US company can both make and lay them. We visited its 73-year-old factory and went aboard a multimillion-dollar cable-laying ship to see how it is keeping up — and why our data still needs to travel thousands of feet beneath the sea. Read the original article on Business Insider", "date_str": "2026-10-11T13:33:01+00:00", "hash": "040d9b29f1fa22ea", "title_fa": "در داخل تنها سازنده کابل اینترنت دریایی آمریکا که گوگل و مایکروسافت را تامین می کند", "summary_fa": "نود و نه درصد از ترافیک اینترنت بین‌المللی از طریق کابل‌های کشیده شده در کف اقیانوس جریان دارد. با وابستگی بیشتر جهان به محاسبات ابری و هوش مصنوعی، تقاضا به بالاترین حد خود رسیده است. اما فقط یک شرکت آمریکایی می تواند آنها را هم بسازد و هم راه اندازی کند. ما از کارخانه 73 ساله آن بازدید کردیم و سوار یک کشتی چند میلیون دلاری کابل‌گذاری شدیم تا ببینیم که چگونه کار می‌کند - و چرا داده‌های ما هنوز باید هزاران فوت زیر دریا سفر کنند. مقاله اصلی را در Business Insider Video Tech در داخل آمریکا بخوانید. X LinkedIn کپی پیوند نماد فیس بوک حرف F. Bethany Johnson 2026-10-11T13:33:01.402Z نماد اشتراک گذاری یک فلش منحنی به سمت راست. X LinkedIn کپی پیوند فیس بوک نماد حرف F. توضیحات Angle down icon نمادی به شکل زاویه ای که به سمت پایین است. چگونه با داشتن هوش مصنوعی خود می‌توانید قفل عوامل دقیق‌تر و دقیق‌تر را باز کنید. چرا هواپیماهای الکتریکی تقریبا غیرممکن هستند. کارکنان فناوری اخراج شده از گوگل و مایکروسافت با بازار کار دشواری روبرو می شوند"}, {"source": "Business Insider", "title": "My mom was raising me and caring for her mom with Alzheimer's. Our neighbors became our village.", "link": "https://www.businessinsider.com/cohousing-alzheimers-caregiving-single-mom-community-2026-10", "summary": "Courtesy of the author My mom moved us from Brooklyn to Michigan after my grandma developed Alzheimer's. I helped care for my grandma while my mom navigated caregiving as a single parent. Our cohousing community became an extended family that supported all of us. I spent the first years of my life on the brownstone-lined streets of Brooklyn, waking up to the sounds of birds chirping mixed with car horns reverberating throughout the city. Little did I know that my childhood would take an unexpected turn. In the middle of first grade, my mom pulled me out of school , packed our suitcases, and moved us across the country to Michigan as my grandma, Lillian, was diagnosed with Alzheimer's and needed extra support. My immediate family is small, just my mom and me, and Michigan felt completely foreign at the time. We moved into a co-housing community My mom always emphasized the importance of building family through community. With that in mind, she moved us to Great Oak Cohousing, a community designed around the concept of independent living with shared amenities: a common house, an expansive garden, and a variety of gathering spaces, all collaboratively managed by residents. I fell in love with Great Oak almost immediately. It unlocked a lifestyle that had been missing in New York : raw nature all around us, the ability to run around independently, and an unmatched sense of community. The author moved from New York to Michigan to help care for her grandmother. Courtesy of the author We welcomed my grandma into our new home with open arms, picking her up from my aunt Heidi's house, where she lived during the week, and bringing her to ours for long weekends. My grandma had visited us in New York when I was a baby, but beyond that, we hadn't spent much time together. Almost immediately after the move, we became rascals together, finding many ways to play and get into trouble. We had a community My mom often tells the story of a time we were at our local grocery store . I was tasked with pushing my grandma in her wheelchair. Soon after we arrived, we disappeared from my mom's view. When she spotted us, I was whisking my grandma up and down the aisles while she stuck her arm out, knocking boxes of cookies off the shelves as we went, the two of us bursting into laughter. We were two peas in a pod. At cohousing, we could sit outside and toss tennis balls around while neighbors strolled by and engaged us in friendly small talk. We could enjoy our dinner at picnic table", "date_str": "2026-10-11T12:48:01+00:00", "hash": "bb30edcd64d489fa", "title_fa": "مادرم مرا بزرگ می کرد و از مادرش که آلزایمر داشت مراقبت می کرد. همسایه های ما روستای ما شدند.", "summary_fa": "با حسن نیت نویسنده پس از اینکه مادربزرگم به آلزایمر مبتلا شد، مادرم ما را از بروکلین به میشیگان نقل مکان کرد. من به مراقبت از مادربزرگم کمک کردم در حالی که مادرم به عنوان یک والدین مجرد مراقب مراقبت بود. جامعه همنشینی ما تبدیل به یک خانواده بزرگ شد که از همه ما حمایت کرد. سال‌های اول زندگی‌ام را در خیابان‌های بروکلین با ردیفی از سنگ‌های قهوه‌ای گذراندم و با صدای جیر جیر پرندگان که با بوق ماشین‌ها در سراسر شهر طنین‌انداز می‌شد از خواب بیدار شدم. نمی دانستم دوران کودکی من تغییر غیرمنتظره ای خواهد داشت. در اواسط کلاس اول، مادرم مرا از مدرسه بیرون کشید، چمدان‌هایمان را جمع کرد و ما را در سراسر کشور به میشیگان منتقل کرد، زیرا مادربزرگم، لیلیان، به آلزایمر مبتلا شده بود و به حمایت بیشتری نیاز داشت. خانواده نزدیک من کوچک هستند، فقط من و مادرم، و میشیگان در آن زمان احساس غریبی می کرد. ما به یک جامعه مسکونی نقل مکان کردیم مادر من همیشه بر اهمیت ایجاد خانواده از طریق جامعه تأکید می کرد. با در نظر گرفتن این موضوع، او ما را به Great Oak Cohousing منتقل کرد، جامعه ای که بر اساس مفهوم زندگی مستقل با امکانات مشترک طراحی شده است: یک خانه مشترک، یک باغ وسیع، و فضاهای گردهمایی متنوع، که همه به طور مشترک توسط ساکنان اداره می شوند. من تقریبا بلافاصله عاشق بلوط بزرگ شدم. این شیوه زندگی را باز کرد که در نیویورک گم شده بود: طبیعت خام در اطراف ما، توانایی دویدن مستقل و احساس بی بدیل از اجتماع. نویسنده از نیویورک به میشیگان نقل مکان کرد تا به مادربزرگش کمک کند. با حسن نیت از نویسنده ما مادربزرگم را با آغوش باز به خانه جدیدمان پذیرفتیم، او را از خانه عمه ام هایدی، جایی که در طول هفته زندگی می کرد،"}, {"source": "Business Insider", "title": "My favorite hidden gem in California has incredible food and wine — and it's more affordable than Napa Valley", "link": "https://www.businessinsider.com/paso-robles-california-wine-tastings-hidden-gem-2026-10", "summary": "Paso Robles is my favorite hidden gem in California. Courtesy of JUSTIN Winery My favorite hidden gem in California is Paso Robles, a central coast town filled with wineries. Paso Robles has much cheaper tastings than Napa. The average cost is $27, while it's $79 in Napa. There's also a range of great restaurants, from Michelin-starred dinners to handmade pastas. Where should you go in California for delicious food, sprawling vineyards, and the satisfying sound of a freshly uncorked wine bottle? Let me guess, you're thinking of Napa . But what if I told you there's a hidden gem on the central coast where you can get all of the above with fewer crowds, lower prices, and cooler tasting experiences? Welcome to Paso Robles . A wine for everyone You ll find the stunning Justin vineyards and winery in Paso Robles. Courtesy of JUSTIN Winery Growing up in the Bay Area , Napa Valley quickly became a special place for my family. With no relatives living in the US, my Greek parents took us there every Christmas to make the holidays feel special. I've visited Napa over 20 times, but over the past few years, Paso Robles has stolen my heart. Paso Robles is almost exactly in the middle of Los Angeles and San Francisco, about 200 miles each way. Parallel to the mountains and the sea, the region has a unique terroir due to big temperature swings. The topography's distinctive microclimates are perfect for growing a variety of grapes, helping Paso distinguish itself in a crowded California wine market . \"The diversity of this area really separates itself from the monoculture that Napa has become,\" Andrew Jones, the owner of Field Recordings Winery, told me. Adding to that diversity is the low barrier to entry in the Paso Robles wine industry. Most of the wineries are small and family-owned, and the winemakers are often on-site to guide you. This refreshingly laid-back approach makes tastings feel intimate and approachable, and they're at a far more accessible price point than Napa, where the high cost of winemaking has trickled down to tourists. Silicon Valley Bank's 2026 direct-to-consumer wine report found that the average tasting fee in Napa is $79, while it's $27 in Paso Robles. \"Napa has a taller order; they have to live up to a brand that's worldwide,\" said Neeta Mittal, one of the first Indian women to open a winery in the US. \"Where we thrive in Paso is we're able to etch our own identity, and that's a great nimbleness that we're allowed.\" Tasting experiences with a ", "date_str": "2026-10-11T12:28:02+00:00", "hash": "40b0ead8a0c66eea", "title_fa": "جواهر پنهان مورد علاقه من در کالیفرنیا غذا و شراب باورنکردنی دارد - و مقرون به صرفه تر از دره ناپا است.", "summary_fa": "پاسو روبلز جواهر پنهان مورد علاقه من در کالیفرنیا است. با حسن نیت از شراب سازی جاستین جواهر پنهان مورد علاقه من در کالیفرنیا پاسو روبلز است، شهر ساحلی مرکزی پر از کارخانه های شراب سازی. Paso Robles مزه های بسیار ارزان تری نسبت به Napa دارد. میانگین هزینه 27 دلار است، در حالی که در ناپا 79 دلار است. طیف وسیعی از رستوران‌های عالی، از شام‌های ستاره‌دار میشلن تا پاستاهای دست‌ساز نیز وجود دارد. کجا باید در کالیفرنیا برای غذاهای خوشمزه، تاکستان‌های وسیع و صدای رضایت‌بخش یک بطری شراب تازه بدون چوب پنبه بروید؟ بگذار حدس بزنم، تو به ناپا فکر می کنی. اما اگر به شما بگویم جواهر پنهانی در ساحل مرکزی وجود دارد که می‌توانید تمام موارد بالا را با جمعیت کمتر، قیمت‌های پایین‌تر و تجربه‌های طعم خنک‌تر به دست آورید، چه؟ به پاسو روبلز خوش آمدید. شرابی برای همه شما تاکستان ها و کارخانه شراب سازی خیره کننده جاستین را در پاسو روبلز خواهید یافت. با حسن نیت از شراب سازی جاستین که در منطقه خلیج بزرگ شد، دره ناپا به سرعت به مکانی ویژه برای خانواده من تبدیل شد. بدون هیچ اقوام ساکن ایالات متحده، والدین یونانی من هر کریسمس ما را به آنجا می بردند تا تعطیلات احساس خاصی داشته باشند. من بیش از 20 بار از ناپا دیدن کرده ام، اما در چند سال گذشته، پاسو روبلز قلب من را ربوده است. پاسو روبلز تقریباً دقیقاً در وسط لس آنجلس و سانفرانسیسکو قرار دارد و از هر طرف حدود 200 مایل فاصله دارد. به موازات کوه و دریا، این منطقه به دلیل نوسانات شدید دمایی دارای یک ترویر منحصر به فرد است. ریزاقلیم های متمایز توپوگرافی برای پرورش انواع انگور عالی است و به پاسو کمک می کند خود را در بازار شلوغ شراب کالیفرنیا متمایز کند. اندرو جونز، مالک شراب سازی فیلد"}, {"source": "Business Insider", "title": "We live on a 'family compound' with my parents and siblings. It's made raising our daughter much easier.", "link": "https://www.businessinsider.com/we-live-on-same-property-as-parents-siblings-family-compound-2026-10", "summary": "We have our own house, but my husband and I live on the same property as my parents and siblings. Taylor Bunting My husband and I live in a separate house on the same property where my immediate family lives. In total, nine family members and three dogs live in the two houses on our \"family compound.\" We love spending time with my close-knit family , and it's been great for our daughter, too. There's a popular saying that it takes a village to raise a child. I'd always understood the saying as a metaphor. But when my husband and I decided to build a house on the same property where my parents, younger siblings, and my brother's fiancé live, that adage became a lot more literal. Now, we're raising our daughter on our \"family compound,\" with our village right next door. A compound wasn't the initial plan, but living here has been an incredible experience My parents built their house first. Taylor Bunting Although my family had jokingly talked about building houses next door to each other since I was a child, we never thought we could make that a reality. However, the arrangement started to materialize in 2024. At the time, my husband and I were living about 15 minutes from my childhood home, which was bursting at the seams with my three siblings, my brother's fiancé, both my parents, and their two adorable golden retrievers. My parents had been searching for a larger home for years, but eventually decided to purchase a piece of land in our Massachusetts hometown. Here, they built a house big enough for all six of them to live together comfortably, and realized there was enough room left on the property for my husband and me to build our own house if we wanted to. They began construction on their home that same year, and not long after, my husband and I decided to sell our existing home and break ground on a new place on the property. In total, nine family members and three dogs live in the two houses, which are just a short walk away from each other. I love that our house is just a quick walk away from my parents home. Taylor Bunting We've now been living here for six months and couldn't ask for a better living arrangement . I love being able to see my siblings off for their first day of school or prom night, having game nights with my family, and enjoying slow, cozy days watching football together. Not only are my husband and I fortunate enough to have our built-in best friends only a short walk away, but we also get to watch our daughter grow up with direc", "date_str": "2026-10-11T12:24:01+00:00", "hash": "5ddb616538b65873", "title_fa": "ما با پدر و مادر و خواهر و برادرم در یک «محل خانوادگی» زندگی می کنیم. این کار تربیت دخترمان را بسیار آسان کرده است.", "summary_fa": "ما خانه خودمان داریم، اما من و شوهرم با پدر و مادر و خواهر و برادرم در یک ملک زندگی می کنیم. تیلور بانتینگ من و شوهرم در خانه ای جداگانه در همان ملکی زندگی می کنیم که خانواده نزدیکم در آن زندگی می کنند. در مجموع، نه عضو خانواده و سه سگ در دو خانه در \"محوطه خانوادگی\" ما زندگی می کنند. ما عاشق گذراندن وقت با خانواده صمیمی خود هستیم، و این برای دخترمان نیز عالی بوده است. یک ضرب المثل معروف وجود دارد که می گوید برای بزرگ کردن یک بچه یک روستا لازم است. من همیشه این ضرب المثل را به عنوان یک استعاره می فهمیدم. اما وقتی من و شوهرم تصمیم گرفتیم در همان ملکی که پدر و مادرم، خواهر و برادر کوچکترم و نامزد برادرم زندگی می کنند خانه ای بسازیم، این ضرب المثل بسیار واقعی تر شد. اکنون، ما دخترمان را در \"محوطه خانوادگی\" خود با دهکده خود درست همسایه بزرگ می کنیم. یک مجتمع نقشه اولیه نبود، اما زندگی در اینجا یک تجربه باورنکردنی بوده است والدین من ابتدا خانه خود را ساختند. تیلور بانتینگ اگرچه خانواده من از کودکی من به شوخی در مورد ساخت خانه های همسایه با یکدیگر صحبت می کردند، ما هرگز فکر نمی کردیم که بتوانیم آن را به واقعیت تبدیل کنیم. با این حال، این ترتیب در سال 2024 شروع شد. در آن زمان، من و شوهرم حدود 15 دقیقه از خانه دوران کودکی‌ام که با سه خواهر و برادرم، نامزد برادرم، هر دو پدر و مادرم، و دو گلدن رتریور شایان ستایش در حال ترکیدن بود، زندگی می‌کردیم. والدین من سال‌ها به دنبال خانه بزرگ‌تری می‌گشتند، اما در نهایت تصمیم گرفتند یک قطعه زمین در زادگاه ما ماساچوست بخرند. در اینجا، آنها خانه ای به اندازه کافی بزرگ ساختند که هر شش نفر بتوانند به"}, {"source": "Business Insider", "title": "I thought we'd be at an extended-stay hotel for 2 weeks. We stayed for 3 months while house-hunting.", "link": "https://www.businessinsider.com/lived-in-extended-stay-hotel-months-while-house-hunting-2026-10", "summary": "The author and her family stayed in an extended-stay hotel for nearly three months while looking for a rental. Courtesy of Tonya Russell We wanted to find a rental to live in while building a new house. It took nearly three months, and we stayed in an extended-stay hotel during our search. I felt cramped at times, but I missed some things about it when we moved. After eight years in the same home, my family needed a change. We planned to rent while we built a new house , imagining a brief transition between the two. Instead, the rental market had other plans. Apparently, it was a very popular time to be looking for a new place to live. With multiple families vying for each house, landlords could be choosy. Being self-employed with dogs put us near the bottom of the list. In the meantime, we were living in an extended-stay hotel . Still, I wasn't discouraged because…well, how long could it take to find a match? What I thought would be a two-week hotel stay stretched into nearly three months. During that time, my husband, our 1-year-old daughter, Talia, two dogs, and our cat learned what it meant to live with little space . More surprisingly, hotel living changed how I parented — and eventually, my views on home. We took what we needed, and the rest went in storage We moved everything we owned into two storage units, and I packed for a short stay. We took what fit in our SUV: a large suitcase, a bag for my daughter, stuffed with pajamas and outfits, a few toys and books, a box of diapers, a litter box, the travel stroller we kept in our car, and a travel wagon that would become a lifeline. By the second week, I was making weekly trips to storage to rotate my daughter's toys. Living in a hotel can make toddlers bored fast. I also started feeling boxed in. I missed my home, hated walking the dogs at all hours, and dreaded the slow elevators that occasionally got stuck. Some days, I'd climb four flights of stairs or take my high-energy dog for runs. Talia and I frequented the supermarket just to keep from going crazy. The author s daughter enjoyed playing in the hotel. Courtesy of Tonya Russell I rethought how I parent I also had to rethink some parenting rules . At home, I was against both junk food and screen time. But the hotel breakfast buffet had limited vegetarian options. When Talia pointed at the plain donuts, I let her have one. She usually took one bite. She also asked for my husband's vegan sausages, so she had one with him most mornings. Screen time", "date_str": "2026-10-11T12:22:01+00:00", "hash": "4ec24ea4218dfdf6", "title_fa": "فکر می کردم 2 هفته در یک هتل با اقامت طولانی مدت باشیم. ما 3 ماه در حال شکار خانه ماندیم.", "summary_fa": "نویسنده و خانواده‌اش نزدیک به سه ماه در هتلی با اقامت طولانی‌مدت در حالی که به دنبال اجاره‌ای بودند، اقامت داشتند. با حسن نیت از تونیا راسل ما می خواستیم در حین ساختن یک خانه جدید، اجاره ای برای زندگی در آن پیدا کنیم. نزدیک به سه ماه طول کشید و در طول جستجویمان در هتلی با اقامت طولانی اقامت کردیم. گاهی اوقات احساس تنگی می‌کردم، اما وقتی نقل مکان می‌کردیم، بعضی چیزها را از دست می‌دادم. پس از هشت سال اقامت در همان خانه، خانواده ام نیاز به تغییر داشتند. ما برنامه ریزی کردیم که در حالی که یک خانه جدید می ساختیم، اجاره کنیم و یک انتقال کوتاه بین این دو را تصور می کردیم. در عوض، بازار اجاره برنامه های دیگری داشت. ظاهراً زمان بسیار محبوبی برای جستجوی یک مکان جدید برای زندگی بود. با چند خانواده که برای هر خانه رقابت می کنند، صاحبخانه ها می توانند انتخاب کننده باشند. خوداشتغالی با سگ ها ما را در انتهای لیست قرار می دهد. در همین حین، ما در یک هتل با اقامت طولانی زندگی می کردیم. با این حال، من دلسرد نشدم زیرا...خب، چقدر طول می کشد تا یک مسابقه پیدا کنم؟ چیزی که من فکر می‌کردم اقامت دو هفته‌ای در هتل است که تقریباً سه ماه طول کشید. در آن زمان، شوهرم، دختر 1 ساله‌مان، تالیا، دو سگ و گربه‌مان یاد گرفتند که زندگی با فضای کم به چه معناست. شگفت‌آورتر اینکه زندگی در هتل، نحوه تربیت من و در نهایت، دیدگاه من را در مورد خانه تغییر داد. ما آنچه را که نیاز داشتیم برداشتیم و بقیه به انبار رفتیم. همه چیزهایی را که داشتیم به دو واحد انبار منتقل کردیم و من برای اقامت کوتاهی بسته بندی کردم. ما آنچه را که در شاسی بلندمان بود برداشتیم: یک چمدان بزرگ، یک کیف برای دخترم،"}, {"source": "Business Insider", "title": "I'm having my third child at 39. It's a different experience from when I was pregnant with my other 2 boys.", "link": "https://www.businessinsider.com/third-pregnancy-older-different-experience-2026-10", "summary": "The author is pregnant for the third time at 39. Courtesy of Bethaney Phillips I'm 39 and pregnant with my third boy. I had my other two at 29 and 31. It's different this time around. I'm experiencing more nausea and fatigue, but my boys help me out. I'm having my third child at 39. It's a different experience from when I was pregnant with my other 2 boys. My 40th birthday is in April, and my third son is due just two months before my milestone age . It's a fact that came as a bigger surprise to me than anyone else. A few days after a missed period and continual cramping, I asked my husband to go buy a test. It lit up with double lines so quickly that, in my shock, I wondered if there were multiple babies. Later, I learned I was hosting just one new babe. Things are different this time The pregnancy was unexpected , but not unwelcome. After several miscarriages, likely due to my bicornuate (or heart-shaped) uterus, I thought our days of having babies were over. However, this one found a viable spot to hold onto, and he's now over half-grown, having just completed his anatomy scan with nonstop movement. Unlike my earlier pregnancies , this one is taking a greater toll. At five months pregnant, I'm more tired and nauseous, and my belly has gotten bigger faster. That meant earlier acid reflux, more bathroom breaks, more months of waddling, and all the difficulties that come with pregnancy: it's a process to stand up, hard to bend over, and I'm just plain slow. Every day, the words, \"And that's Uncle Joe, he's a moving kinda slow\" from Petticoat Junction play in my head. Not unlike Uncle Joe, I'm moving very slowly at all times. And that's with extra sleep — after getting my sons (7 and 9) to sleep each night, I'm in bed right behind them, usually crashed out by 8:30 or 9. This body is doing a lot of growing, and it's exhausted. Much to my husband's chagrin, there was no \"fun period\" of this pregnancy. I went straight from constant nausea to feeling uncomfortable. This is likely due to it being a third advanced pregnancy. Despite only gaining 15 pounds thus far, I'm short with a short torso, so when the baby grows, I grow along with him. One thing that has made life easier this go-around is that my children are older now. Now, I have two helpers who can pick things up, fetch drinks, or take out the trash. At home, they do most of my bending and gathering and are happy to help; it's a far cry from the early days of having two under 2. I have a clean bill of hea", "date_str": "2026-10-11T12:04:01+00:00", "hash": "9bb583c626c06127", "title_fa": "من سومین فرزندم را در 39 سالگی به دنیا می‌آورم. این تجربه متفاوت از زمانی است که 2 پسر دیگرم را باردار بودم.", "summary_fa": "نویسنده برای بار سوم در 39 سالگی باردار است. با اجازه بتانی فیلیپس من 39 ساله هستم و سومین پسرم را باردارم. من دو تای دیگرم را در 29 و 31 سالگی داشتم. این بار متفاوت است. من تهوع و خستگی بیشتری را تجربه می کنم، اما پسرانم به من کمک می کنند. من سومین فرزندم را در 39 سالگی به دنیا می‌آورم. این تجربه متفاوت از زمانی است که 2 پسر دیگرم را باردار بودم. تولد 40 سالگی من در آوریل است و پسر سوم من فقط دو ماه قبل از سن عطف من به دنیا می آید. این واقعیتی است که بیش از هر کس دیگری برای من شگفت زده شد. چند روز بعد از پریود نشدن و گرفتگی مداوم، از شوهرم خواستم برود آزمایش بخرد. آنقدر سریع با خطوط دوتایی روشن شد که در شوک من فکر کردم که آیا چند نوزاد وجود دارد یا خیر. بعداً فهمیدم که میزبان فقط یک کودک جدید هستم. این بار همه چیز متفاوت است. بارداری غیرمنتظره بود، اما ناخواسته نبود. بعد از چندین بار سقط جنین، احتمالاً به خاطر رحم دو شاخ (یا قلبی شکل) من، فکر کردم روزهای بچه دار شدن ما به پایان رسیده است. با این حال، این یکی مکان مناسبی برای نگه داشتن پیدا کرد، و اکنون نیمه بزرگ شده است، و به تازگی اسکن آناتومی خود را با حرکت بی وقفه کامل کرده است. بر خلاف بارداری های قبلی من، این یکی تلفات بیشتری دارد. در ماه پنجم بارداری، من خسته تر و حالت تهوع دارم و شکمم سریعتر بزرگ شده است. این به معنای رفلاکس اسید معده زودتر، استراحت بیشتر در حمام، ماه‌های بیشتر دست و پا زدن و تمام مشکلاتی است که با بارداری پیش می‌آید: این فرآیندی است که باید سرپا ایستادن، به سختی خم شد، و من فقط آهسته هستم. هر"}, {"source": "Business Insider", "title": "My friends use AI regularly, but I refuse to. I'm learning to keep my beliefs and opinions about it to myself.", "link": "https://www.businessinsider.com/friends-love-ai-refuse-peer-pressure-2026-10", "summary": "The author refuses to use AI. Courtesy of Ashley Archambault I decided early on that I don't want to use AI; I can't see any practical ways it could help me. My friends, however, love using AI in their daily lives. It has created some uncomfortable situations, but I try not to share my opinions. My first true encounter with AI was at a teacher training about two years ago, where the objective was to show the different ways AI could save teachers' time. My reaction to using AI to design my next lesson plan was not positive. I admittedly saw the ease in stating your lesson's objective and yielding a full lesson plan in seconds. It was tempting to give it a try, but all I could think about was how I wouldn't even know how to teach without designing my own lesson plans. I then decided to ask AI for an age-appropriate chore chart for my 10-year-old son at the time. It was the one thing in my life that I could think of that I really needed help with. The list AI gave me was adequate, but I knew I would never reference it. It felt cold and generic. I decided then not to use AI anymore; I wish I could say the same for my friends. I feel peer pressure to start using AI All my close friends use AI regularly to do everything from designing their weekly meal plans to scheduling out their entire weeks. They rave about how brilliant and helpful it is. Getting on board with AI is almost starting to feel like peer pressure. I do realize that I cannot entirely resist technological change, but choosing to do my own thing instead of using AI is my choice right now. What makes me most uncomfortable is feeling like I'm being interrogated about why I'm choosing not to use it. I'd love to stand on the rooftops and yell about why I don't want to use AI, but because I love my friends, I don't want to criticize them and their choices. Because of a good friend, AI did me a big favor once One of my friends talked me out of a poor haircut decision by asking ChatGPT to alter a photo she had of me with the haircut. It was not a good look, and in this instance, a friend used AI to save me from regretting a rash haircut decision and many years of awkwardly growing my hair out. Still, this one experiment wasn't enough to lure me to AI use in my everyday life. While I do my best to support and hype up my friends, I make a point of telling my girlfriends that I prefer their untouched, original photos. And it's the truth. I explain that I love seeing all the imperfections, and that the unfilt", "date_str": "2026-10-11T11:47:01+00:00", "hash": "5b83183a6174387a", "title_fa": "دوستان من به طور مرتب از هوش مصنوعی استفاده می کنند، اما من از این کار خودداری می کنم. دارم یاد می‌گیرم که باورها و نظراتم را در مورد آن برای خودم نگه دارم.", "summary_fa": "نویسنده از استفاده از هوش مصنوعی امتناع می ورزد. با حسن نیت از اشلی آرچمبل من در اوایل تصمیم گرفتم که نمی خواهم از هوش مصنوعی استفاده کنم. من هیچ راه عملی نمی بینم که می تواند به من کمک کند. با این حال، دوستان من عاشق استفاده از هوش مصنوعی در زندگی روزمره خود هستند. موقعیت های ناراحت کننده ای ایجاد کرده است، اما سعی می کنم نظرات خود را به اشتراک ندهم. اولین برخورد واقعی من با هوش مصنوعی حدود دو سال پیش در یک دوره آموزشی معلم بود، جایی که هدف آن نشان دادن راه‌های مختلفی بود که هوش مصنوعی می‌تواند در وقت معلمان صرفه‌جویی کند. واکنش من به استفاده از هوش مصنوعی برای طراحی طرح درس بعدی مثبت نبود. من مسلماً سهولت را در بیان هدف درس شما و ارائه یک طرح کامل درسی در چند ثانیه دیدم. وسوسه انگیز بود که آن را امتحان کنم، اما تمام چیزی که می توانستم به آن فکر کنم این بود که چگونه بدون طراحی برنامه های درسی خودم حتی نمی دانم چگونه تدریس کنم. سپس تصمیم گرفتم از هوش مصنوعی برای پسر 10 ساله‌ام در آن زمان، یک نمودار کاری مناسب با سنش بخواهم. این تنها چیزی در زندگی من بود که می توانستم به آن فکر کنم که واقعاً به کمک نیاز داشتم. فهرستی که هوش مصنوعی به من داد کافی بود، اما می‌دانستم که هرگز به آن اشاره نمی‌کنم. احساس سرد و عمومی می کرد. تصمیم گرفتم دیگر از هوش مصنوعی استفاده نکنم. کاش برای دوستانم هم همین را می گفتم. من برای شروع استفاده از هوش مصنوعی فشار همسالانم را احساس می کنم همه دوستان نزدیک من به طور منظم از هوش مصنوعی استفاده می کنند تا همه چیز را از طراحی برنامه غذایی هفتگی خود تا برنامه ریزی کل هفته هایشان انجام دهند. آنها"}, {"source": "Business Insider", "title": "I started a cookie business and scaled too quickly. We got caught up in a growth-at-all-costs mentality — here's how I turned it around.", "link": "https://www.businessinsider.com/how-partake-foods-founder-denise-woodard-scaled-small-business-2026-10", "summary": "Partake Foods founder, Denise Woodard, says storytelling has been a big part of her company s success. Denise Woodard Denise Woodard founded Partake Foods after her daughter's life-threatening food allergies. She says expanding too far, too wide, too fast in 2020 was almost deadly to the business. Woodard has raised millions in funding and credits storytelling for her success. This as-told-to essay is based on a conversation with Denise Woodard, founder and CEO of Partake Foods. The following has been edited for length and clarity. I spent my career in consumer packaged goods and spent significant time at The Coca-Cola Company. Then my daughter Vivienne came along. She's 11 now, but right around her first birthday, we had a couple of scary incidents that alerted us to the fact that she had multiple life-threatening food allergies . She was allergic to foods I consider to be super simple: eggs, tree nuts, bananas, and sesame. I started to realize that food allergies were going to become a big part of our everyday lives. I was really frustrated with the options from a taste and nutritional perspective. Most of all, I thought about how, emotionally, she wouldn't be able to partake in so many social events like birthday parties, playdates, and school snack time, and that she'd always feel excluded and othered. I wanted to create a solution for that. Woodard and her daughter Vivienne when she was younger. Partake Foods In June 2016, I incorporated my food company as Vivi's Life LLC, because I just wanted to make my daughter's life easier. I was knocking on doors, selling cookies out of my car We officially launched in the New York market, in independent stores, in August 2017, and from then all the way through 2019, I was knocking on doors and selling cookies out of my car. Our marketing strategy was super grassroots: local trade shows and events, and demos in grocery stores. We didn't have any extra dollars, and those things cost our family time. It was a full-family adventure. We used to drive around with a demo table in the back of our car, and if we were in the city for the day and went to a store that wasn't selling cookies, we would literally pull up and do a demo in that moment. Woodard used samples and taste tests as an early marketing tool. Denise Woodard The storytelling and the tasting of the product were our entire marketing strategy for the first couple of years. Even as we've scaled and moved away from demos, storytelling is such a huge part of th", "date_str": "2026-10-11T11:08:01+00:00", "hash": "d2a7d760ddce5ddb", "title_fa": "من یک تجارت کوکی راه اندازی کردم و خیلی سریع گسترش یافتم. ما گرفتار یک ذهنیت رشد به هر قیمتی شدیم - در اینجا نحوه تغییر من این است.", "summary_fa": "دنیس وودارد، بنیانگذار Partake Foods، می گوید که داستان سرایی بخش بزرگی از موفقیت شرکت او بوده است. دنیس وودارد دنیس وودارد پس از آلرژی های غذایی تهدید کننده زندگی دخترش، شرکت «Partake Foods» را تأسیس کرد. او می‌گوید گسترش بیش از حد، خیلی گسترده و خیلی سریع در سال 2020 تقریباً برای این تجارت کشنده بود. وودارد میلیون‌ها بودجه جمع‌آوری کرده و داستان سرایی را برای موفقیتش اعتبار می‌دهد. این مقاله همانطور که گفته شد بر اساس گفتگو با دنیس وودارد، بنیانگذار و مدیر عامل شرکت غذای پارتاکی است. موارد زیر برای طول و وضوح ویرایش شده است. من کارم را در کالاهای بسته بندی مصرفی گذراندم و زمان زیادی را در شرکت کوکاکولا گذراندم. سپس دخترم ویوین آمد. او اکنون 11 ساله است، اما درست در حوالی اولین سالگرد تولدش، چند اتفاق ترسناک داشتیم که به ما هشدار داد که او چندین آلرژی غذایی تهدید کننده زندگی دارد. او به غذاهایی که من فکر می کنم بسیار ساده هستند حساسیت داشت: تخم مرغ، آجیل درختی، موز و کنجد. متوجه شدم که آلرژی غذایی به بخش بزرگی از زندگی روزمره ما تبدیل خواهد شد. من واقعا از گزینه ها از منظر طعم و تغذیه ناامید شدم. بیشتر از همه، به این فکر می‌کردم که چگونه از نظر عاطفی، او نمی‌تواند در بسیاری از رویدادهای اجتماعی مانند جشن تولد، جشن‌های بازی، و میان وعده‌های مدرسه شرکت کند، و همیشه احساس طرد شدن و دور شدن از دیگران می‌کند. من می خواستم برای آن راه حلی ایجاد کنم. وودارد و دخترش ویوین در جوانی. Partake Foods در ژوئن 2016، من شرکت غذایی خود را به عنوان Vivi's Life LLC ثبت کردم، زیرا فقط می خواستم زندگی دخترم را آسان تر کنم. درها را می زدم، از ماشینم بیسکویت می فروختم. ما به طور رسمی در بازار نیویورک، در فروشگاه های مستقل،"}, {"source": "Business Insider", "title": "I got divorced abroad and decided to stay in Europe. My $900 pension goes so much further in a tiny French village.", "link": "https://www.businessinsider.com/got-divorced-abroad-stayed-in-france-cheaper-living-pension-2026-10", "summary": "Karen Anderson moved to a small village in Northwestern France. Courtesy of Karen Anderson/ Getty Images After divorcing her European husband, Karen Anderson decided to remain in France. She says she'd love to move back to the US, but the higher cost of living makes that unrealistic. She says affordable housing and healthcare have made life in France far less stressful. This as-told-to essay is based on a conversation with Karen Anderson, 57, a Californian who moved to the UK in 2011 and now lives in a small village in northwestern France. The conversation has been edited for length and clarity. I was working as a 911 dispatcher for a California police department when I met my ex-husband, who is English. After dating for a year, we got married in 2011 and eventually moved to his home country, the United Kingdom. I wanted a different life and the chance to experience more of the world. For years, we split our time between the UK, where he worked, and France. And in 2016, we bought a house in France for €45,000 ($50,450), far less than anything we could have afforded in the UK. At closing, I remember being handed more than 100 pages of paperwork. We were foreigners buying a home in a language we didn't understand, so it was very scary. But our hands were held during the process. After my divorce, I decided to remain in France In 2021, I returned to the US to care for my mom, who had been diagnosed with cancer. After getting screened myself, I was also diagnosed, so I ended up staying in the States for about a year while undergoing treatment. During that time, I got a job at Amazon , which helped me get health coverage. I eventually returned to Europe, but by 2023, my ex-husband and I decided to divorce. Although we were married in California, we had to divorce under French law. The process was difficult and took three years to finalize. While the divorce was still underway, I returned to the US to see whether I could make a life there again. It took me about six months to find work, and I eventually became a flight attendant with Frontier Airlines. Unfortunately, I could only afford a twin bed in a house I shared with 13 other women, so I decided to move back to Europe. Once our divorce was finalized, my ex-husband bought out my share of the house. This year, I bought a home of my own in France for €59,100 ($66,159). The process couldn't have been more different from the first time around. I only had to sign three documents electronically, and that was it. T", "date_str": "2026-10-11T11:02:01+00:00", "hash": "c65b00eab1a63131", "title_fa": "من در خارج از کشور طلاق گرفتم و تصمیم گرفتم در اروپا بمانم. حقوق بازنشستگی 900 دلاری من در یک دهکده کوچک فرانسوی بسیار فراتر می رود.", "summary_fa": "کارن اندرسون به دهکده ای کوچک در شمال غربی فرانسه نقل مکان کرد. با اجازه کارن اندرسون/ Getty Images پس از طلاق از همسر اروپایی خود، کارن اندرسون تصمیم گرفت در فرانسه بماند. او می‌گوید که دوست دارد به ایالات متحده برگردد، اما هزینه‌های زندگی بالاتر این را غیرواقعی می‌کند. او می گوید مسکن مقرون به صرفه و مراقبت های بهداشتی زندگی در فرانسه را بسیار کم استرس کرده است. این مقاله گفته شده بر اساس گفتگو با کارن اندرسون، 57 ساله، کالیفرنیایی است که در سال 2011 به بریتانیا نقل مکان کرد و اکنون در دهکده ای کوچک در شمال غربی فرانسه زندگی می کند. گفتگو برای طولانی بودن و وضوح ویرایش شده است. من به عنوان اعزام کننده 911 برای اداره پلیس کالیفرنیا کار می کردم که با شوهر سابقم که انگلیسی است آشنا شدم. پس از یک سال آشنایی، در سال 2011 ازدواج کردیم و در نهایت به کشور او، انگلستان نقل مکان کردیم. من یک زندگی متفاوت و فرصتی برای تجربه بیشتر جهان می خواستم. سال‌ها زمان خود را بین بریتانیا، جایی که او کار می‌کرد، و فرانسه تقسیم می‌کردیم. و در سال 2016، خانه ای در فرانسه به قیمت 45000 یورو (50450 دلار) خریدیم که بسیار کمتر از هر چیزی که می توانستیم در بریتانیا بپردازیم. در پایان، به یاد دارم که بیش از 100 صفحه کاغذ به من تحویل داده شد. ما خارجی ها بودیم که به زبانی که نمی فهمیدیم خانه می خریدیم، بنابراین خیلی ترسناک بود. اما در طول این کار دستان ما گرفته شد. پس از طلاق، تصمیم گرفتم در فرانسه بمانم در سال 2021، برای مراقبت از مادرم که به سرطان مبتلا شده بود، به ایالات متحده بازگشتم. پس از انجام غربالگری، من نیز تشخیص داده شد، بنابراین در پایان درمان حدود یک سال در ایالات متحده ماندم. در آن"}, {"source": "Business Insider", "title": "I left my $200K Microsoft job to bet on my startup. Work became less fun, and AI made me feel ready to build it alone.", "link": "https://www.businessinsider.com/microsoft-engineer-quit-big-tech-job-build-ai-startup-solo-2026-10", "summary": "Junead Khan left Microsoft in 2025 to focus on building his AI startup, Treasury, without a cofounder or venture capital funding. Junead Khan Junead Khan earned over $200,000 his at Microsoft, but he decided to leave the company anyway. He said the job had become less fun and that he wanted to go all in on his side business. He resigned with no customers or VC funding and has since grown his social-media following to around 30,000. This as-told-to essay is based on a conversation with Junead Khan, a 25-year-old entrepreneur in Seattle. He worked at Microsoft before resigning last year to focus on his startup, Treasury. The following has been edited for length and clarity. I had a really good experience at Microsoft when I first joined full-time in 2023. It was my first job out of college, and I joined right in the middle of the AI boom . I was involved in the rollout of data centers across the world. It was a great opportunity. Then Microsoft experienced some service outages , and by early 2025, I saw a greater emphasis on security and service stability. It felt like shipping things got slower. That started to take some of the fun out of the job for me. At the same time, I was watching new AI coding tools emerge. I wanted to experiment with them and get access to them faster. I was making very good money at Microsoft : I earned more than $200,000 in 2024, including stock and bonuses. But I didn't feel like I was learning all the AI skills I wanted to learn. I started to think more seriously about leaving the company and pursuing an AI startup I'd been working on on the side. Still, I wasn't ready to quit immediately. I built my startup on the side of my full-time job My business idea came to me during my senior year of college. I was born and raised in the UK but came to the US in 2019 to pursue a bachelor's degree in computer science at the University of North Carolina. I had money to manage in both countries, and I felt like the existing financial tools weren't working well for me. Around the same time, AI models were getting much better. I started wondering if I could use the technology to build a financial advisor tool for the average person who might not have access to one or want to pay thousands of dollars a year for one. So after graduating from college and before starting at Microsoft later that summer, I started building Treasury, which I describe as an AI money coach. For roughly the next two years, I worked on the business at night and on the w", "date_str": "2026-10-11T11:00:02+00:00", "hash": "d9177fc8a3919ec1", "title_fa": "من کار 200 هزار دلاری خود در مایکروسافت را ترک کردم تا روی استارت آپم شرط بندی کنم. کار کمتر سرگرم کننده شد و هوش مصنوعی باعث شد من احساس کنم آماده ساختن آن به تنهایی هستم.", "summary_fa": "جوناد خان در سال 2025 مایکروسافت را ترک کرد تا بر ساخت استارتاپ هوش مصنوعی خود، خزانه داری، بدون سرمایه گذار یا سرمایه گذاری خطرپذیر تمرکز کند. جوناد خان جوناد خان بیش از 200000 دلار در مایکروسافت درآمد داشت، اما تصمیم گرفت به هر حال شرکت را ترک کند. او گفت که این کار کمتر سرگرم کننده شده است و او می خواهد همه چیز را در تجارت جانبی خود انجام دهد. او بدون هیچ مشتری یا بودجه VC استعفا داد و از آن زمان تاکنون تعداد فالوورهای خود را در شبکه های اجتماعی به حدود 30000 افزایش داده است. این مقاله گفته شده بر اساس گفتگو با جوناد خان، یک کارآفرین ۲۵ ساله در سیاتل است. او قبل از استعفا در سال گذشته در مایکروسافت کار می کرد تا روی استارتاپ خود، خزانه داری تمرکز کند. موارد زیر برای طول و وضوح ویرایش شده است. زمانی که برای اولین بار در سال 2023 به طور تمام وقت به مایکروسافت پیوستم، تجربه بسیار خوبی در مایکروسافت داشتم. این اولین شغل من خارج از کالج بود، و درست در میانه رونق هوش مصنوعی به این کار پیوستم. من در راه اندازی مراکز داده در سراسر جهان نقش داشتم. این یک فرصت عالی بود. سپس مایکروسافت با برخی از اختلالات خدمات مواجه شد و در اوایل سال 2025، تاکید بیشتری بر امنیت و ثبات خدمات دیدم. به نظر می رسید حمل و نقل کالا کندتر شده است. این باعث شد تا قسمتی از سرگرمی کار را برای من از بین ببرد. در همان زمان، من شاهد ظهور ابزارهای کدنویسی جدید هوش مصنوعی بودم. می خواستم با آنها آزمایش کنم و سریعتر به آنها دسترسی داشته باشم. من در مایکروسافت پول بسیار خوبی به دست آوردم: در سال 2024 بیش از 200000 دلار به دست آوردم، از جمله سهام و پاداش. اما احساس"}, {"source": "Business Insider", "title": "The best Sambas alternatives that are better than the originals", "link": "https://www.businessinsider.com/guides/style/adidas-sambas-alternatives", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Bared Footwear, Alohas, SeaVees The World Cup put a spotlight on soccer this summer. Now that we're into fall, everyone has hung onto the notion of sporty, low-profile sneakers as their go-to casual sporty option. The shoes that best embody this look are the Adidas Sambas . Originally introduced in 1949 as a training shoe for professional athletes, the slim sneaker is now everywhere thanks to its timeless silhouette and easy-to-style colorways. During peak Sambas hype I considered buying a pair, but didn't want to dress like a carbon copy of everyone else. Below are the best Sambas alternatives I've found, including a handful that worn by our style editors. For more of the top trendy sneakers we've tested, see our guide to the best retro sneakers . Learn more about how the Reviews team tests shoes at BI. SeaVees Low-Profile Trainer Seavees SeaVees ' nylon-and-suede sneakers have a memory foam footbed crafted with recycled materials. They're lightweight with a slim fit and discreet silhouette, which makes them easy style with jeans, trousers, or track pants. The sawtooth rubber soles add extra grip, and we're big fans of the minimal branding. They're the perfect amount of unremarkable, though still a clear derivative of retro-style runners. Gola Viper Talia Ergas/Business Insider White sneakers are a staple in my everyday wardrobe, whether I'm wearing a dress or athleisure, so I was excited to try some Gola sneakers. The Vipers are a high-quality leather alternatives to Sambas, which offer a similar suede T-toe and a translucent gum sole. After removing them from the box, I was immediately impressed with their sturdy yet flexible feel. They felt comfortable on the first wear. Although they look equally good with leggings or a sundress, my favorite styling choice for these shoes is to have them peeking out from underneath a pair of wide-leg slacks. They add a sporty touch, yet still manage to look polished. These fit true to size. They look good with various sock lengths, but I found them most comfortable with calf-length socks since the tongue of the shoe rubbed against my ankle a bit when I wore them with short socks. Bared Footwear Amakihi Bared Footwear Bared Footwear is one of our favorite shoe brands here on the Reviews team. I've tried their strappy heels , lug-soled loafers , and knee-high boots , and somehow each pair is more comfortable than the last. They", "date_str": "2026-10-11T11:00:01+00:00", "hash": "f5bd72efd6bcd480", "title_fa": "بهترین جایگزین های سامباس که بهتر از نسخه اصلی هستند", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید کفش های برهنه، آلوها، سی وییز جام جهانی تابستان امسال فوتبال را مورد توجه قرار داد. اکنون که وارد پاییز شده‌ایم، همه به فکر کفش‌های ورزشی اسپرت و کم حاشیه به‌عنوان گزینه‌ی اسپرت گاه به گاه خود هستند. کفش هایی که به بهترین شکل این ظاهر را تجسم می کنند، آدیداس سامباس هستند. این کتانی باریک که در ابتدا در سال 1949 به عنوان یک کفش آموزشی برای ورزشکاران حرفه ای معرفی شد، اکنون به لطف سایه های بی انتها و رنگ های ساده آن در همه جا وجود دارد. در زمان اوج تبلیغات سامباس، من به خرید یک جفت فکر کردم، اما نمی‌خواستم مانند یک کپی از سایرین لباس بپوشم. در زیر بهترین جایگزین های Sambas که من پیدا کرده ام، از جمله تعداد انگشت شماری که توسط ویراستاران سبک ما استفاده می شود، آورده شده است. برای اطلاعات بیشتر از برترین کفش‌های کتانی مد روز که آزمایش کرده‌ایم، راهنمای ما را در مورد بهترین کفش‌های کتانی رترو ببینید. درباره نحوه آزمایش کفش‌ها در BI توسط تیم بررسی‌ها بیشتر بدانید. کفش‌های کتانی نایلونی و جیر SeaVees با مشخصات کم SeaVees دارای کفی حافظه دار هستند که با مواد بازیافتی ساخته شده است. آنها سبک وزن با اندام باریک و سیلوئت محتاطانه هستند که باعث می‌شود با شلوار جین، شلوار یا شلوار سبک به راحتی استایل شوند. زیره‌های لاستیکی دندانه‌دار چسبندگی بیشتری می‌بخشند و ما از طرفداران پروپاقرص مینیمال هستیم. آنها مقدار عالی غیرقابل توجه هستند، اگرچه هنوز مشتق واضحی از دوندگان سبک یکپارچهسازی با سیستمعامل هستند. Gola Viper Talia Ergas/Business Insider کفش‌های کتانی سفید یک عنصر اصلی در کمد لباس روزمره من هستند، چه من لباس بپوشم و چه ورزشی، بنابراین من هیجان زده بودم که برخی از کفش‌های ورزشی"}, {"source": "Business Insider", "title": "British Airways is launching the world's largest business-class cabin on its Airbus A380s. Take a look inside.", "link": "https://www.businessinsider.com/photos-british-airways-airbus-a380-with-worlds-biggest-business-class-2026-10", "summary": "British Airways is re-fitting its Airbus A380s with 106 business-class suites. Courtesy of British Airways British Airways is updating its Airbus A380s with plush first-class suites. This week, it unveiled new designs, including what it says is the world's largest business-class cabin. The new A380 was expected to debut earlier this year and is now set for the coming months. Airlines love business class, and British Airways' latest updates to its Airbus A380s are proof. This week, the airline unveiled a major overhaul to the interiors of its superjumbos, including what it says is the world's largest business-class cabin, with over 100 suites spanning the double-decker jet's upper floor. \"This is the largest single investment that any airline has ever made in reconfiguring an aircraft, stretching from nose to tail and touching every single aspect of the experience on board,\" CEO Sean Doyle said at a media event, which Business Insider attended. Over 35,000 individual parts are installed on each aircraft as part of the retrofit, which includes new galleys and staircases, British Airways said. While the A380 has fallen out of favor with many airlines since the pandemic, it still plays a key role in British Airways' fleet. The flag carrier has 12 such airplanes — the second most behind Emirates. \"You're going to see a glimpse into the future of long-haul air travel on British Airways, and it represents the investment we've been making in our premium experience, and the A380 is one of our flagships in demonstrating our commitment to that mission,\" Doyle said. British Airways is making a rare bet on the A380. A British Airways Airbus A380. Nicolas Economou/NurPhoto via Getty Images Airbus stopped making the A380 in 2021, as many carriers retired their superjumbo jets to save costs during the pandemic. However, its enormous size allows space for extra features and plush first-class suites. Although the aircraft type is expected to stop flying by 2040, British Airways is spending millions retrofitting its A380s as its most opulent offering. British Airways previously unveiled its luxurious first-class suite in 2024. Pete Syme/Business Insider \"Our ambition throughout this whole transformation journey is to take British Airways to the next level and to make it really special,\" Calum Laming, chief customer officer, said during British Airways' first-class suite reveal in 2024. While most US airlines have cut first class , European carriers have been investing in ext", "date_str": "2026-10-11T10:58:01+00:00", "hash": "ab2d9f54eca2a1b6", "title_fa": "بریتیش ایرویز بزرگترین کابین بیزینس کلاس جهان را در ایرباس A380 خود راه اندازی می کند. نگاهی به داخل بیندازید.", "summary_fa": "بریتیش ایرویز در حال تجهیز هواپیماهای ایرباس A380 خود با 106 سوئیت کلاس تجاری است. بریتیش ایرویز بریتیش ایرویز ایرباس A380 خود را با سوئیت های درجه یک شیک به روز می کند. این هفته، از طرح های جدید، از جمله آنچه که می گوید بزرگترین کابین کلاس تجاری جهان است، رونمایی کرد. انتظار می رفت A380 جدید در اوایل سال جاری معرفی شود و اکنون برای ماه های آینده آماده شده است. خطوط هوایی عاشق کلاس تجاری هستند و آخرین به‌روزرسانی‌های بریتیش ایرویز برای ایرباس A380 خود گواه این موضوع است. این هفته، این شرکت هواپیمایی از یک تعمیر اساسی در فضای داخلی سوپرجامبوهای خود، از جمله آنچه که می‌گوید بزرگترین کابین کلاس تجاری جهان است، با بیش از 100 سوئیت در طبقه بالای جت دو طبقه، رونمایی کرد. شان دویل، مدیر عامل شرکت در یک رویداد رسانه ای که Business Insider در آن حضو ts are coming for one of companies' most profitable customer behaviors: doing nothing. As personal AI agents make their way into people's financial lives, early users are using them to lower internet bills, recover airline credits, find cheaper insurance, chase refunds, and unearth money they had forgotten was theirs. Noah Shinn, the CEO of Instinct, one such personal AI agent, touted their saving benefits on an episode of \"Invest Like the Best\" released last week, saying they can scan users' bank transactions, identify forgotten subscriptions , and cancel them. \"It just sends back the number of what it saved you,\" Shinn said. Meta has marketed its new agent , Muse, in a similar way. That could come at a cost to insurers, airlines, banks, broadband providers, and subscription businesses — industries that have for decades benefited, at least in part, from consumer inertia: the millions of people who do not compare the renewal price, dispute the fee , call about the credit, or brave the cancellation maze. Wall Street has already seemingly begun trading on that thesis. In the two weeks after Muse launched, the share prices of Airbnb and Booking.com dropped 12% and 10%, respectively. Planet Fitness shares dropped 17% over the same period. No insurer or consumer experts Business Insider spoke to could put a reliable dollar figure on the potential impact. But Tony Soloman, director of insurance intelligence at J.D. Power, said personal AI agents \"would certainly be disruptive\" for insurers. \"Right now, to actually purchase a policy or make a change, you still need to contact someone, but if AI replaces that, then the carriers lose control over the consumer journey,\" he said. Let the bots do the haggling Muse, Meta’s personal AI agent. Smith Collection/Gado/Getty Images Some early users have already leveraged personal AI agents to make significant savings . AJ Stuyvenberg, an engineer at Datadog, asked ChatGPT to negotiate with Verizon after Comcast offered him faster fiber internet for $50 a month. After a little over an hour in Verizon’s live chat,", "date_str": "2026-10-11T10:11:01+00:00", "hash": "a74f21cb89c93d97", "title_fa": "عامل هوش مصنوعی شما پول شما را پس می خواهد - و این می تواند برای این شرکت ها دردسر ایجاد کند", "summary_fa": "عوامل هوش مصنوعی شخصی به مصرف کنندگان کمک می کنند تا پول نقد را پس بگیرند - و شرکت هایی را که از اینرسی مصرف کننده سود می برند، تهدید می کنند. Cheng Xin/Getty Images شرکت‌های بیمه مدت‌هاست که از مشتریانی که خرید نمی‌کنند یا قیمت‌ها را به چالش می‌کشند سود می‌برند. عوامل هوش مصنوعی شخصی می توانند مدل کسب و کار را با مقایسه قیمت ها و چانه زدن تغییر دهند. یکی از تحلیلگران بیمه به Business Insider گفت: «این مطمئناً مخل خواهد بود. عوامل هوش مصنوعی شخصی برای یکی از سودآورترین رفتارهای مشتریان شرکت ها آمده اند: انجام هیچ کاری. همانطور که عوامل هوش مصنوعی شخصی راه خود را به زندگی مالی مردم باز می کنند، کاربران اولیه از آنها برای کاهش صورتحساب اینترنت، بازیابی اعتبارات هواپیمایی، یافتن بیمه ارزان تر، تعقیب بازپرداخت و کشف پولی که فراموش کرده اند مال آنهاست استفاده می کنند. Noah Shinn، مدیر عامل Instinct، یکی از عوامل هوش مصنوعی شخصی، مزایای پس انداز خود را در قسمتی از \"Invest Like the Best\" که هفته گذشته منتشر شد، تبلیغ کرد و گفت که می توانند تراکنش های بانکی کاربران را اسکن کنند، اشتراک های فراموش شده را شناسایی کرده و آنها را لغو کنند. Shinn گفت: \"این فقط تعداد چیزی را که شما را نجات داده است، پس می فرستد.\" متا نماینده جدید خود، Muse را نیز به روشی مشابه به بازار عرضه کرده است. این امر می‌تواند برای بیمه‌گران، خطوط هوایی، بانک‌ها، ارائه‌دهندگان پهنای باند و کسب‌وکارهای اشتراک هزینه داشته باشد - صنایعی که برای دهه‌ها حداقل تا حدی از اینرسی مصرف‌کننده سود برده‌اند: میلیون‌ها نفری که قیمت تمدید را مقایسه نمی‌کنند، در مورد کارمزد بحث نمی‌کنند، در مورد اعتبار تماس نمی‌گیرند یا شجاعانه در پیچ و خم کنسل کردن شرکت نمی‌کنند. به نظر می رسد وال استریت تجارت بر روی آن"}, {"source": "Business Insider", "title": "I'm a top auto industry analyst. Improv taught me to scare myself in public.", "link": "https://www.businessinsider.com/industry-analyst-improv-classes-better-work-2026-10", "summary": "Erin Keating took five seasons of improv classes. It taught her about how to really listen to coworkers and family. Erin Keating Erin Keating spoke too fast during her first big presentation. She also felt kinda sweaty. In her mid-40s, she took an improv class to get better onstage. It's taught her lessons about listening to others that have helped at work and at home. This as-told-to essay is based on a conversation with Erin Keating, an executive analyst for Cox Automotive. It has been edited for length and clarity. People should scare themselves. In public. I tested that theory out in my mid-40s by taking five seasons of improv classes at the DC Improv Comedy Club. My goal was not to become a comedian — I wanted to take on a challenge that I could easily fail at. And to add to the pressure, I had to perform in front of my family. I work as an executive analyst in the auto industry at Cox Automotive. I distill data to explain the industry's market dynamics to automakers, dealership groups, lenders, and journalists . The material I cover can quickly get boring if I'm not careful. Some of those conversations happen in small rooms, others happen in high-pressure settings: on stages in front of hundreds or thousands of people, on live television, at product unveilings, in podcasts, you name it. I also consider myself an introvert . I didn't always feel so comfortable in front of people — and I certainly haven't always been the funniest person in the room. Getting on the stage At my first major corporate presentation, I couldn't stop sweating. My colleagues said I was good, but I was talking too fast. Their feedback was basically, \"You did fine. Slow down.\" I improved over time and got less sweaty when talking in front of people. There was still more I could learn. I decided to take the improv classes in 2018 because, honestly, I was a little bit bored. I had just left a marketing communications job and was trying to figure out what to do next. I knew I liked talking: I was hosting a successful podcast about books, but I wanted to be better at having conversations. Loving to talk is definitely not the same as being a good conversationalist. The classes with a cast of characters… So, I joined my first class. I was there with a biology teacher, a German woman who was really funny, an older woman who had done a ton of onstage acting, and a handful of people (like me) who were nervous about participating. The majority of us stuck it out for our five consecutive s", "date_str": "2026-10-11T10:03:01+00:00", "hash": "a14edf3284edabcd", "title_fa": "من یک تحلیلگر برتر صنعت خودرو هستم. Improv به من آموخت که خودم را در جمع بترسانم.", "summary_fa": "ارین کیتینگ در پنج فصل کلاس‌های اصلاحی شرکت کرد. این به او یاد داد که چگونه واقعاً به صحبت های همکاران و خانواده گوش دهد. ارین کیتینگ ارین کیتینگ در اولین سخنرانی بزرگ خود خیلی سریع صحبت کرد. او همچنین احساس می کرد کمی عرق کرده است. او در اواسط 40 سالگی خود، برای بهتر شدن روی صحنه، در یک کلاس اصلاحی شرکت کرد. به او درس هایی در مورد گوش دادن به دیگرانی که در محل کار و خانه کمک کرده اند، آموخته است. این مقاله گفته شده بر اساس گفتگو با ارین کیتینگ، تحلیلگر اجرایی Cox Automotive است. برای طول و وضوح ویرایش شده است. مردم باید خود را بترسانند. در ملاء عام من این تئوری را در اواسط دهه 40م با گذراندن پنج فصل کلاس‌های بداهه در کلوپ کمدی دی سی امپروف آزمایش کردم. هدف من کمدین شدن نبود - می خواستم چالشی را انجام دهم که به راحتی در آن شکست بخورم. و برای افزایش فشار مجبور شدم جلوی خانواده ام اجرا کنم. من به عنوان یک تحلیلگر اجرایی در صنعت خودرو در Cox Automotive کار می کنم. من داده ها را تقطیر می کنم تا پویایی بازار صنعت را برای خودروسازان، گروه های نمایندگی، وام دهندگان و روزنامه نگاران توضیح دهم. اگر مراقب نباشم، مطالبی که پوشش می دهم می تواند به سرعت خسته کننده شود. برخی از این مکالمات در اتاق‌های کوچک اتفاق می‌افتند، برخی دیگر در محیط‌های پرفشار اتفاق می‌افتند: روی صحنه‌ها در مقابل صدها یا هزاران نفر، در تلویزیون زنده، در مراسم رونمایی از محصول، در پادکست‌ها. من هم خودم را درونگرا می دانم. من همیشه در مقابل مردم احساس راحتی نمی‌کردم - و مطمئناً همیشه خنده‌دارترین فرد در اتاق نبوده‌ام. روی صحنه رفتن در اولین سخنرانی بزرگ شرکتی ام، نتوانستم جلوی عرق کردنم را بگیرم. همکارانم گفتند من خوب هستم، اما"}, {"source": "Business Insider", "title": "Retail's holiday hiring push is shaping up to be worse than last year's disappointing run", "link": "https://www.businessinsider.com/retail-holiday-hiring-worse-than-last-year-2026-10", "summary": "Retail is a key step in many workers career journey, and seasonal roles are how a lot of retail employees got their start. Joe Raedle/Getty Images The retail industry's seasonal hiring push is on track to be the lowest in years. The shift reflects a trend toward earlier hiring and less reliance on seasonal workers. Fewer seasonal jobs could also start to erode a once-common first step on workers' career ladders. The annual stampede of seasonal retail job openings continues to taper off, with hiring expected to be at its lowest level since the Financial Crisis. As mid-October approaches, some major companies have not said if they will bulk up their front lines to a specific target. \"It's a little bit of chicken right now with retailers and the economy going, 'Okay, who's going to move first?'\" said Trent Cotton , head of talent-acquisition insights at recruiting-software company ICIMS. \"It will be interesting to see this at the end of the year.\" This year's retail industry hiring push is on track to be lower than last year's tally of 461,000, according to career transition firm Challenger, Gray Christmas. A report released last month projects that this year will see around 450,000 seasonal retail jobs, the lowest gain in nearly 20 years. \"Almost every hiring announcement we've seen in the last three years is smaller and more surgical than the pre-pandemic playbook. Even if the big names come in at last year's numbers, the total will likely fall well short of the 2019—2021 peaks,\" chief revenue officer Andy Challenger said in a statement. This year, Spirit Halloween and craft shop Michaels led the charge, saying they intended to hire 52,000 and 10,000 seasonal workers, respectively. Amazon has not yet shared its plans, and Walmart told Business Insider it will take the same approach as last year, which did not have a hiring goal target. \"Our stores are well-staffed and ready to serve customers this holiday season,\" the company said. Target said it will once again rely on its on-demand team of about 43,000 workers and leave further hiring up to local managers. Walmart and Target both said last year they would prioritize assigning additional seasonal hours to existing employees . Cotton also said that these smaller numbers reflect a trend toward earlier hiring and less reliance on seasonal workers. \"They're moving it back to over the summer, so that way they're fully staffed by October going into November and December,\" he said. That point also came up several", "date_str": "2026-10-11T09:49:01+00:00", "hash": "503248a092dadf4c", "title_fa": "فشار استخدام در تعطیلات خرده‌فروشی بدتر از دوره ناامیدکننده سال گذشته است", "summary_fa": "خرده فروشی یک گام کلیدی در مسیر شغلی بسیاری از کارگران است و نقش های فصلی نحوه شروع کار بسیاری از کارمندان خرده فروشی است. Joe Raedle/Getty Images فشار استخدام فصلی صنعت خرده‌فروشی در مسیر پایین‌ترین میزان در سال‌های اخیر قرار دارد. این تغییر نشان دهنده گرایش به استخدام زودتر و اتکای کمتر به کارگران فصلی است. تعداد کمتری از مشاغل فصلی نیز می‌تواند باعث از بین رفتن اولین گام معمولی در نردبان شغلی کارگران شود. ازدحام سالانه فرصت‌های شغلی فصلی خرده‌فروشی همچنان رو به کاهش است و انتظار می‌رود استخدام در پایین‌ترین سطح خود از زمان بحران مالی باشد. با نزدیک شدن به اواسط اکتبر، برخی از شرکت های بزرگ نگفته اند که آیا خطوط مقدم خود را به یک هدف خاص افزایش می دهند یا خیر. ترنت کاتن، رئیس بینش جذب استعداد در شرکت نرم‌افزار استخدام ICIMS، می‌گوید: «در حال حاضر با خرده‌فروشی‌ها و اقتصاد spectators what they were most excited for in markets, though, the responses were surprisingly unified. Most attendees I chatted with quickly made it clear there's one game changer they're most focused on right now: agentic AI . \"AI agents will create more time for investors to do other things,\" one veteran trader told me on the sidelines of the event. \"That's the most important thing there is. When everything is automated, everyone will have more time to do what they love. I'm 1,000% positive that it will be the force we need.\" John Samuelson, the chief investment office of family office advisory firm Karas Partners, told me he's spent years helping clients understand digital assets. The bitcoin pin on his lapel hinted that he might be focused mostly on the crypto market's recent turnaround , but I was wrong. John Samuelson (right) chats with fellow summit attendee and investor David Arquilla about financial markets Samuel O Brient/Business Insider Samuelson also brought up agentic AI for finance as the thing he's most interested in, as he sees it as bridging the gap between traditional finance and decentralized finance, or DeFi. \"I see it as a very good thing across the board,\" he said. \"It's a good thing for crypto and the digital-asset world because they now actually have a very extreme use case for the cryptocurrencies in the payment system area. It's a very good thing for the AI world because [AI agents] now have an ability to be able to complete transactions with each other.\" David Arquilla, a content producer who has also been investing and trading for y", "date_str": "2026-10-11T09:45:01+00:00", "hash": "c08c8d93d76da15f", "title_fa": "من در یک اجلاس سرمایه‌گذاران خرده‌فروش شرکت کردم، و جمعیت معامله‌گران روزانه نسبت به هوش مصنوعی عامل خوش‌بین هستند.", "summary_fa": "آنتونی پمپلیانو با یک مهمان در اجلاس سرمایه گذاران سیلویا در شهر نیویورک گپ می زند. ساموئل او برینت/خودی تجاری من اخیرا در اجلاس سرمایه گذاران سیلویا در شهر نیویورک شرکت کردم. بسیاری از
