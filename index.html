job-seeker-used-claude-track-search-improve-interviews-2026-10", "summary": "In her job search, Margareth Felicia Gono created an AI workflow that helped her evaluate roles and analyze interview sentiment Courtesy of Margareth Felicia Gono Margareth Felicia Gono used AI to bring structure to her job search , landing a role at DoorDash. She built Claude tools to assess her résumé and analyze the sentiment of interviews. Gono said she didn't want AI to exaggerate her experience or make her sound like everyone else. Margareth Felicia Gono, 24, recently started as a senior associate at DoorDash after completing a master's degree in applied analytics in May. During her job search, she created an AI workflow that helped her evaluate roles and analyze interview sentiment. The following is based on conversations that have been edited for brevity and clarity. At the beginning of my job search, it was pretty scattershot. Because I was an international student and needed a visa, I felt I had to apply to anything that might relate to my experience, even if it wasn't the right fit. I grew up in Indonesia and didn't want to leave the US without getting corporate experience. My parents paid for my tuition at a private university, then an Ivy League master's on top of that. I started tracking my results. What roles got responses? What didn't? What patterns showed up? Anxiety is unprocessed data. I was tired of feeling bad about my search and figured I might as well learn something instead. Around the second or third round of interviews, I noticed I would get a little bit of hesitation from employers, and I wanted to understand why that was happening. Was it me, my experience, my résumé, or that I needed a visa? I used Claude as a career coach I used Claude almost like a partner and built this tracker for my applications. I'd take a job description and ask Claude to identify the main skills, keywords, and themes. Then I built another automation agent into that same project. Basically, it was my own version of what people call an ATS score. I'd paste the job description and my résumé together and ask, \"What top keywords am I missing?\" I didn't want AI to invent experience or make me sound like everyone else . I wanted it to show me where my experience wasn't being communicated clearly enough. Sometimes that meant changing one bullet. Sometimes it meant realizing that applying would be a waste of time. As I went along, I became more intentional about who I wanted to work under and what types of jobs I applied for. I used Claude to act like a career c", "date_str": "2026-10-04T09:49:01+00:00", "hash": "1ab7e3b37f246b30", "title_fa": "من از هوش مصنوعی برای پیگیری رد شغلم استفاده کردم. این جستجوی من را تغییر داد و من استخدام شدم.", "summary_fa": "مارگارت فلیسیا گونو در جستجوی شغل خود یک گردش کار هوش مصنوعی ایجاد کرد که به او کمک کرد تا نقش‌ها را ارزیابی کند و احساسات مصاحبه را تحلیل کند. او ابزارهای کلود را برای ارزیابی رزومه و تحلیل احساسات مصاحبه ها ساخت. گونو گفت که نمی‌خواهد هوش مصنوعی تجربه‌اش را اغراق کند یا صدایش را مثل بقیه کند. مارگارت فلیسیا گونو، 24 ساله، اخیراً پس از اتمام مدرک کارشناسی ارشد در تحلیل کاربردی در ماه می، به عنوان کاردان ارشد در DoorDash شروع به کار کرد. او در طول جستجوی شغلی خود، یک گردش کار هوش مصنوعی ایجاد کرد که به او کمک کرد تا نقش ها را ارزیابی کند و احساسات مصاحبه را تجزیه و تحلیل کند. مطالب زیر بر اساس گفتگوهایی است که برای اختصار و وضوح ویرایش شده است. در ابتدای جستجوی کار من، بسیار پراکنده بود. از آنجایی که من یک دانشجوی بین المللی بودم و نیاز به ویزا داشتم، احساس کردم باید برای هر چیزی که ممکن است به تجربه من مرتبط باشد، درخواست بدهم، حتی اگر مناسب نباشد. من در اندونزی بزرگ شدم و نمی خواستم ایالات متحده را بدون کسب تجربه شرکتی ترک کنم. پدر و مادرم هزینه شهریه من را در یک دانشگاه خصوصی پرداخت کردند، سپس برای کارشناسی ارشد Ivy League علاوه بر آن. من شروع به پیگیری نتایج خود کردم. چه نقش هایی با واکنش مواجه شدند؟ چی نشد؟ چه الگوهایی نشان داده شد؟ اضطراب داده های پردازش نشده است. من از احساس بدی در مورد جستجوی خود خسته شده بودم و به این فکر کردم که ممکن است به جای آن چیزی یاد بگیرم. در حوالی دور دوم یا سوم مصاحبه ها، متوجه شدم که کمی از کارفرمایان تردید می کنم، و می خواستم بفهمم چرا این اتفاق می افتد. آیا این من بودم، تجربه‌ام، رزومه‌ام، یا اینکه"}, {"source": "Business Insider", "title": "These 5 states will pay you to build a tiny home in your backyard", "link": "https://www.businessinsider.com/states-will-compensate-you-for-building-tiny-home-adu-2026", "summary": "An ADU built by Villa in a California backyard. miller.photo for Villa Building tiny backyard homes can be expensive . The units can range in cost — from under $100,000 to over $300,000. These states will help with the cost by providing homeowners with grant money. Here are the programs, how much homeowners can receive, and who is eligible to apply. If you've looked into building a tiny home in your backyard, you've probably discovered what many have: While they may save you money in the long run, they can be expensive to build. These homes, called accessory dwelling units , or ADUs, are small housing units ranging from 150 square feet to 1,200 square feet, depending on where you live. While detached backyard units are popular, ADUs can be incorporated into many parts of a property, including as a garage or basement conversion, an above-garage unit, or an attic or upper-level apartment. The average cost of a unit can range from $100,000 to $300,000, not to mention the permit cost, and securing a loan to build an ADU can be challenging . In California, where most backyard homes are being built, ADU building permits cost anywhere from $450 to $15,000 — even before construction starts, Backyard Unlimited, a company that builds ADUs, said. That's not all: Other costs could include site preparation, which includes anything from inspections to running utility lines. To put it another way, if you don't have cash easily available or the ability to access financing for the project, it can be cost-prohibitive, making it harder for middle- and low-income homeowners to actually build one, studies have shown. To combat this disparity, promote equity, and ultimately propel the construction of much-needed housing, some states — as well as nonprofits in specific cities — have established loan and or grant programs to provide assistance. The deadlines for these programs vary from state to state. Those interested in building an ADU should be prepared for next year's application cycles, as they often experience high demand. Here are the ADU programs launched nationwide. Colorado: A new grant program is still rolling out A tiny home in Colorado. Ray Wise/Getty Images In 2024, Colorado passed HB24-1152 to assist homeowners in building ADUs. The Colorado Department of Local Affairs (DOLA) works directly with local governments as they implement regulatory changes to comply with HB24-1152. DOLA also runs the Accessory Dwelling Unit Grant Program (ADUG), which provides $5 million ", "date_str": "2026-10-04T09:31:02+00:00", "hash": "819228c61e5a0ed3", "title_fa": "این 5 ایالت به شما پول می دهند تا یک خانه کوچک در حیاط خلوت خود بسازید", "summary_fa": "ADU ساخته شده توسط ویلا در حیاط خلوت کالیفرنیا. miller.photo برای ویلا ساختن خانه های حیاط خلوت کوچک می تواند گران باشد. قیمت واحدها می تواند متغیر باشد - از زیر 100000 دلار تا بیش از 300000 دلار. این ایالت ها با ارائه پول کمک هزینه به صاحبان خانه کمک خواهند کرد. در اینجا برنامه‌ها، میزان دریافتی مالکان خانه و چه کسی واجد شرایط درخواست است. اگر به دنبال ساختن یک خانه کوچک در حیاط خلوت خود بوده اید، احتمالاً متوجه شده اید که بسیاری چه چیزی دارند: در حالی که ممکن است در درازمدت در هزینه شما صرفه جویی کنند، ساخت آنها ممکن است گران تمام شود. این خانه ها که واحدهای مسکونی جانبی یا ADU نامیده می شوند، واحدهای مسکونی کوچکی هستند که بسته به محل زندگی شما از 150 فوت مربع تا 1200 فوت مربع مساحت دارند. در حالی که واحدهای حیاط خلوت جدا محبوب هستند، ADU ها را می توان در بسیاری از قسمت های یک ملک گنجاند، از جمله به عنوان تبدیل گاراژ یا زیرزمین، یک واحد بالای گاراژ، یا یک اتاق زیر شیروانی یا آپارتمان در سطح بالا. هزینه متوسط ​​یک واحد می تواند از 100000 تا 300000 دلار متغیر باشد، بدون ذکر هزینه مجوز، و تضمین وام برای ساخت ADU می تواند چالش برانگیز باشد. Backyard Unlimited، یک شرکت سازنده ADU، گفت در کالیفرنیا، جایی که اکثر خانه‌های حیاط خلوت در آن ساخته می‌شوند، مجوزهای ساختمانی ADU بین 450 تا 15000 دلار هزینه دارند - حتی قبل از شروع ساخت‌وساز. این همه چیز نیست: سایر هزینه ها می تواند شامل آماده سازی سایت باشد که شامل هر چیزی از بازرسی گرفته تا راه اندازی خطوط برق می شود. به بیان دیگر، مطالعات نشان داده است که اگر پول نقد به راحتی در دسترس نباشید یا توانایی دسترسی به منابع مالی برای پروژه را"}, {"source": "Business Insider", "title": "Real-estate investors who started with little savings share 4 creative ways they bought property", "link": "https://www.businessinsider.com/creative-financing-strategies-buying-real-estate-investment-properties-building-wealth-2026-10", "summary": "Grace Cary/Getty Images Four investors share how they used existing assets to fund their first rental properties. Their approaches included borrowing from their 401(k), home equity, and a paid-off truck. The strategies lowered the cash barrier but added debt. It's easy for prospective real-estate investors to get discouraged by sticker shock. Many lenders require a down payment of at least 20% for an investment property. With the median US home price hovering around $400,000 , that can mean coming up with $80,000 — and that's without factoring in closing costs, repairs, and cash reserves. If you don't have tens of thousands of dollars in cash at your disposal, investing in real estate isn't necessarily out of reach. Business Insider spoke with four investors who found creative ways to use assets they already had — from retirement savings to a paid-off truck — to help finance their first deals. Lucy Zheng borrowed from her 401(k) Lucy Zheng and her husband bought their first investment property by tapping into retirement funds. Lucy Zheng When Lucy Zheng wanted to buy her first rental in 2023, she was cash-strapped and living in California, where prices felt unaffordable. She began looking at cheaper Midwest markets, eventually focusing on Detroit, where she found homes selling for about $60,000. To fund the purchase, Zheng put in about $15,000 of her own money and borrowed the rest from her 401(k), allowing her to buy the property in cash. Under the rules of her employer-sponsored plan, she could borrow up to $50,000 or 50% of her vested account balance, whichever was less. For Zheng, the appeal was speed and cost. She said she received the money within a few business days, paid a $75 fee, and closed on the property within two weeks. She also liked that the interest on the loan went back into her own retirement account. To make the monthly repayments manageable, she temporarily reduced her regular 401(k) contributions so the loan payments roughly replaced what she had already been setting aside from each paycheck. The major caveat, she noted, was the job-related risk: If she left or lost her job, she would have had to repay the balance immediately. Mark Kearney used a HELOC to buy his first rental Mark Kearney used a HELOC to help buy his first rental. The income from his real-estate portfolio eventually allowed him to retire early. Mazske Finance Florida-based investor Mark Kearney never earned more than $52,000 a year and didn't think real-estate investi", "date_str": "2026-10-04T09:25:01+00:00", "hash": "bb2241644408d89c", "title_fa": "سرمایه گذاران املاک و مستغلات که با اندک پس انداز شروع به کار کرده اند، 4 روش خلاقانه برای خرید ملک به اشتراک می گذارند", "summary_fa": "گریس کری/گتی ایماژ چهار سرمایه گذار نحوه استفاده از دارایی های موجود را برای تامین مالی اولین املاک اجاره ای خود به اشتراک می گذارند. رویکردهای آنها شامل وام گرفتن از 401(k)، سرمایه خانگی و کامیونی بود که پرداخت می شد. این استراتژی ها مانع نقدینگی را کاهش داد اما بدهی را اضافه کرد. برای سرمایه گذاران احتمالی املاک و مستغلات آسان است که از شوک برچسب دلسرد شوند. بسیاری از وام دهندگان نیاز به پیش پرداخت حداقل 20٪ برای یک ملک سرمایه گذاری دارند. با میانگین قیمت خانه در ایالات متحده در حدود 400000 دلار، این می تواند به معنای رسیدن به 80000 دلار باشد - و این بدون در نظر گرفتن هزینه های بسته شدن، تعمیرات و ذخایر نقدی است. اگر ده ها هزار دلار پول نقد در اختیار ندارید، سرمایه گذاری در املاک و مستغلات لزوما دور از دسترس نیست. Business Insider با چهار سرمایه‌گذار صحبت کرد که راه‌های خلاقانه‌ای برای استفاده از دارایی‌هایی که قبلاً داشتند - از پس‌انداز بازنشستگی گرفته تا یک کامیون با درآمد - برای کمک به تأمین مالی اولین معاملات خود پیدا کردند. لوسی ژنگ از 401(k) خود وام گرفت لوسی ژنگ و همسرش اولین ملک سرمایه گذاری خود را با استفاده از صندوق های بازنشستگی خریداری کردند. لوسی ژنگ هنگامی که لوسی ژنگ می‌خواست اولین خانه اجاره‌ای خود را در سال 2023 بخرد، در تنگنای نقدی قرار داشت و در کالیفرنیا زندگی می‌کرد، جایی که قیمت‌ها غیرقابل قبول به نظر می‌رسید. او شروع به جستجوی بازارهای ارزان‌تر غرب میانه کرد و در نهایت روی دیترویت تمرکز کرد، جایی که خانه‌هایی را یافت که حدود 60000 دلار فروخته می‌شدند. ژنگ برای تامین مالی خرید، حدود 15000 دلار از پول خود را گذاشت و بقیه را از 401(k) خود قرض کرد و به او اجازه داد ملک را نقدا خریداری کند. طبق قوانین"}, {"source": "Business Insider", "title": "As a French woman, I cherish my 'French Sundays.' I wouldn't change this weekend routine for anything.", "link": "https://www.businessinsider.com/what-are-french-sundays-weekend-routine-self-care-2026-10", "summary": "The author spends her Sundays relaxing and reconnecting with friends and family. Courtesy of Virginie Romary \"French Sundays\" are a trend that seems to be gaining popularity in the US. Being French, they have been one of my routines throughout my life. They're a day to completely unwind and a chance to recharge before the week begins. I grew up in France , where Sundays have their own distinctive feeling. It's not just another day of the week for us — and even though I've moved to the US, it's something I've taken with me. On Sundays, most traditional shops and services are closed, with only a few exceptions in tourist areas. It's a day dedicated to slowing down and resetting. I haven't lived in France for 10 years, but I still continue to uphold the tradition of unwinding on Sundays, and I have no intention of changing it. Sundays are for slowing down and relaxing When I was living in France , I couldn't go grocery shopping on Sundays or buy a new pair of jeans as the shops were closed. Now that I reside in the US, I maintain this habit of organizing my time so that I can run errands on the other days of the week, even late at night, but never on Sundays. I don't do chores either. Vacuuming can wait until another day — responding to emails can, too. Sundays are dedicated to reconnecting with my family, my friends, and myself. The key is to savor the day without rushing from one activity to another while prioritizing self-care . My mornings at home are always relaxed, spent enjoying slow moments with my family, listening to jazz, practicing slow-flow yoga, or playing games. In the afternoon, I like to have friends over to share a glass of wine. I don't even cook on Sundays, since it's not my favorite activity and I handle it during the week. I'm perfectly happy with a plate of pasta and sometimes even skip the salad. French Sundays are not a waste of a day When I moved to the US , I noticed a different approach to Sundays; there, they are often viewed as a catch-up day for everything that wasn't done during the week. My American friends tend to prefer their Sundays to be productive. I believe French Sundays are even more beneficial than a day focused on productivity . It doesn't mean lying on the couch all day scrolling on the phone, but rather engaging in activities that restore my mind and body. My brain cannot remain in productivity mode constantly; it requires some downtime. By allowing myself to slow down on Sundays, I feel less anxious and stressed. ", "date_str": "2026-10-04T09:18:01+00:00", "hash": "9f22261859798ad0", "title_fa": "من به عنوان یک زن فرانسوی، \"یکشنبه های فرانسوی\" خود را گرامی می دارم. من روال آخر هفته را با هیچ چیز تغییر نمی دهم.", "summary_fa": "نویسنده یکشنبه های خود را به استراحت و برقراری ارتباط مجدد با دوستان و خانواده می گذراند. با حسن نیت ویرجینی روماری \"یکشنبه های فرانسوی\" روندی است که به نظر می رسد در ایالات متحده محبوبیت بیشتری پیدا کند. فرانسوی بودن آنها یکی از روتین های زندگی من بوده است. آنها روزی برای استراحت کامل و فرصتی برای شارژ مجدد قبل از شروع هفته هستند. من در فرانسه بزرگ شدم، جایی که یکشنبه ها احساس خاص خود را دارند. این فقط یک روز دیگر از هفته برای ما نیست - و حتی اگر به ایالات متحده نقل مکان کرده‌ام، این چیزی است که با خودم برده‌ام. یکشنبه‌ها، اکثر فروشگاه‌ها و خدمات سنتی بسته هستند، به استثنای چند مورد در مناطق توریستی. این روزی است که به کاهش سرعت و تنظیم مجدد اختصاص داده شده است. من 10 سال است که در فرانسه زندگی نکرده ام، اما همچنان به سنت استراحت در یکشنبه ها ادامه می دهم و قصد تغییر آن را ندارم. یکشنبه‌ها برای کاهش سرعت و استراحت هستند وقتی در فرانسه زندگی می‌کردم، نمی‌توانستم یکشنبه‌ها به خرید مواد غذایی بروم یا یک شلوار جین جدید بخرم، زیرا مغازه‌ها بسته بودند. اکنون که در ایالات متحده زندگی می‌کنم، این عادت را حفظ می‌کنم که وقتم را طوری سازماندهی کنم که بتوانم در روزهای دیگر هفته، حتی اواخر شب، کارهایم را انجام دهم، اما یکشنبه‌ها هرگز. من هم کارهای خانه انجام نمی دهم. جاروبرقی می تواند تا یک روز دیگر صبر کند - پاسخ دادن به ایمیل ها نیز می تواند. یکشنبه ها به برقراری ارتباط مجدد با خانواده، دوستانم و خودم اختصاص دارد. نکته کلیدی این است که بدون عجله از یک فعالیت به فعالیت دیگر و در عین حال اولویت دادن به مراقبت از خود، روز را بچشید. صبح‌های من در خانه همیشه آرام است، با خانواده‌ام از لحظات"}, {"source": "Business Insider", "title": "AI was supposed to kill tech jobs. The data on job openings says otherwise.", "link": "https://www.businessinsider.com/tech-job-openings-rise-ai-fuels-hardware-engineering-demand-2026-10", "summary": "Mechanical systems expert Chris David leads a tour of Meta s data center in Temple, Texas. Mikala Compton/The Austin American-Statesman via Getty Images A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . Fears that AI will wipe out tech jobs aren't showing up in the data. Job openings at tech companies are climbing, while layoffs continue to ease after a brutal industry reset following the pandemic, according to new data from TrueUp , a hiring platform that tracks more than 9,000 technology companies. TrueUp is currently tracking more than 280,000 open tech jobs across startups and big tech firms, up strongly from the start of 2026. Layoffs haven't disappeared, but they're no longer happening at anything like the pace of the post-pandemic downturn. About 190,000 tech workers have been laid off so far this year, putting 2026 on track to finish well below the roughly 430,000 job cuts recorded during the industry's layoff peak in 2023. The recovery isn't happening evenly across the sector. Demand for hardware engineers has surged this year, fueled by massive spending on AI infrastructure. \"It's not surprising given the interest in GPU innovation, AI robotics, US manufacturing startups, and SpaceX,\" Amit Taylor, TrueUp's founder, told Business Insider. Software engineering job listings, meanwhile, have held up surprisingly well despite predictions that AI coding tools would sharply reduce demand for programmers. The numbers suggest AI is changing what tech companies hire for, not eliminating the need to hire. Demand is shifting toward engineers building the physical foundations of AI — chips, servers, robotics, manufacturing, and data centers — while software hiring remains resilient. Taken together, the data points to a tech job market that is finding its footing. Companies are still cutting jobs in some areas, but they're also hiring aggressively where AI investment is booming. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-10-04T09:15:01+00:00", "hash": "e8273a67a0fd8291", "title_fa": "قرار بود هوش مصنوعی مشاغل فناوری را از بین ببرد. داده های مربوط به فرصت های شغلی چیز دیگری می گوید.", "summary_fa": "کریس دیوید، متخصص سیستم‌های مکانیکی، یک تور از مرکز داده متا در تمپل، تگزاس را هدایت می‌کند. Mikala Compton/Austin American-Statesman از طریق Getty Images نسخه ای از این داستان در ابتدا در خبرنامه AI Insider منتشر شد. برای خبرنامه هفتگی AI Insider Business Insider در اینجا ثبت نام کنید. ترس از این که هوش مصنوعی مشاغل فناوری را از بین ببرد، در داده ها نشان داده نمی شود. بر اساس داده‌های جدید TrueUp، پلتفرم استخدامی که بیش از ۹۰۰۰ شرکت فناوری را زیر نظر دارد، فرصت‌های شغلی در شرکت‌های فناوری در حال افزایش است، در حالی که اخراج‌ها پس از بازنشانی بی‌رحمانه صنعت پس از همه‌گیری همچنان کاهش می‌یابد. TrueUp در حال حاضر بیش از 280000 شغل باز فناوری را در بین استارت آپ ها و شرکت های بزرگ فناوری ردیابی می کند که نسبت به ابتدای سال 2026 به شدت افزایش یافته است. اخراج ها از بین نرفته اند، اما دیگر با سرعت رکود پس از همه گیری اتفاق نمی افتد. حدود 190000 کارمند فناوری تا کنون در سال جاری اخراج شده اند، که سال 2026 را در مسیری قرار می دهد که بسیار کمتر از حدود 430000 کاهش شغل ثبت شده در زمان اوج اخراج این صنعت در سال 2023 به پایان برسد. بهبود در این بخش به طور یکسان اتفاق نمی افتد. تقاضا برای مهندسان سخت افزار در سال جاری افزایش یافته است که به دلیل هزینه های هنگفت در زیرساخت های هوش مصنوعی تقویت شده است. آمیت تیلور، بنیانگذار TrueUp، به Business Insider گفت: «با توجه به علاقه به نوآوری GPU، رباتیک هوش مصنوعی، استارت آپ های تولیدی ایالات متحده و SpaceX، تعجب آور نیست. در همین حال، لیست مشاغل مهندسی نرم افزار علیرغم پیش بینی ها مبنی بر اینکه ابزارهای کدنویسی هوش مصنوعی به شدت تقاضا برای برنامه نویسان را کاهش می دهد، به طرز"}, {"source": "Business Insider", "title": "Her family kept getting cancer. At 33, a saliva test explained why.", "link": "https://www.businessinsider.com/woman-family-cancer-history-tested-lynch-syndrome-2026-9", "summary": "Michelle York, 43, was diagnosed with Lynch syndrome 10 years ago. Lynch syndrome heightens her risk of developing multiple cancers, especially colon cancer. Michelle York Michelle York, 43, had family history of multiple cancers on her mom's side. York tested positive for Lynch syndrome, an underdiagnosed, symptomless condition that increases cancer risk. York and her other family members who tested positive get more frequent cancer screenings. On her mom's side, Michelle York has a long family history of cancer. Her great-grandmother died from colon cancer. Her grandfather had stomach and brain cancer, and his sisters died from liver, ovarian, and breast cancer, respectively. Her mother's cousin died from pancreatic cancer. Then, when York was 33, her mother came across a possible explanation: Lynch syndrome . An inherited genetic mutation, Lynch syndrome is underdiagnosed, symptomless, and increases the risk of cancers, including colorectal, uterine, stomach, ovarian, pancreatic, among others. With colon cancer in particular, it can increase lifetime risk as high as 80%, and is sometimes associated with more aggressive forms of the cancer. About 1 in 300 Americans is estimated to have Lynch syndrome, though many don't find out until after they've been diagnosed with cancer . York's mother, who was a nurse at the time and had read about Lynch through her work, decided to get tested. \"She thought: 'Well, what if I do have this and what if my daughter has this?'\" York, now a 43-year-old content creator in Los Angeles, told Business Insider. At the time, York was also dealing with pelvic pain caused by complex ovarian cysts — cysts containing either solid tissue or irregularities that could mask growing tumors. If she also had Lynch, her cysts would warrant an even closer look, given her heightened ovarian cancer risk. Both York and her mom tested positive for Lynch, as did both of York's siblings and other family members on her mother's side. Now, they get annual screenings to catch any potential cancers earlier. \"In the beginning, it was a little bit more anxiety-inducing,\" York said. But after about a decade of regular screenings, she feels reassured that she's lowering her risk of developing late-stage cancer. \"I think knowledge is power — now, it almost feels comforting because I know that I started doing this young.\" A quick saliva test York (second from left) with her mother, sister, and brother — all of whom tested positive for Lynch syndrome. Miche", "date_str": "2026-10-04T09:15:01+00:00", "hash": "5ebf7c952b10ef6e", "title_fa": "خانواده او مدام سرطان می گرفتند. در 33 سالگی، آزمایش بزاق علت را توضیح داد.", "summary_fa": "میشل یورک، 43 ساله، 10 سال پیش به سندرم لینچ مبتلا شد. سندرم لینچ خطر ابتلا به سرطان های متعدد، به ویژه سرطان روده بزرگ را افزایش می دهد. میشل یورک میشل یورک، 43 ساله، سابقه خانوادگی سرطان های متعدد از طرف مادرش داشت. تست یورک برای نشانگان لینچ مثبت شد، یک بیماری بدون علامت و بدون علامت که خطر سرطان را افزایش می دهد. یورک و سایر اعضای خانواده‌اش که آزمایششان مثبت بود، بیشتر غربالگری‌های سرطان را انجام می‌دهند. از طرف مادرش، میشل یورک سابقه خانوادگی طولانی سرطان دارد. مادربزرگ او بر اثر سرطان روده بزرگ درگذشت. پدربزرگ او به سرطان معده و مغز مبتلا بود و خواهرانش به ترتیب از سرطان کبد، تخمدان و سینه جان باختند. پسر عموی مادرش بر اثر سرطان پانکراس فوت کرد. سپس، وقتی یورک 33 ساله بود، مادرش با یک توضیح احتمالی مواجه شد: سندرم لینچ. سندرم لینچ که یک جهش ژنتیکی ارثی است، تشخیص داده نشده، بدون علامت است و خطر ابتلا به سرطان‌هایی از جمله کولورکتال، رحم، معده، تخمدان، پانکراس و غیره را افزایش می‌دهد. به طور خاص با سرطان روده بزرگ، می تواند خطر ابتلا به سرطان را تا 80 درصد افزایش دهد و گاهی اوقات با انواع تهاجمی تر سرطان همراه است. تخمین زده می‌شود که از هر 300 آمریکایی، 1 نفر به سندرم لینچ مبتلا باشد، اگرچه بسیاری از آنها تا زمانی که سرطان در آنها تشخیص داده نمی‌شود، متوجه می‌شوند. مادر یورک که در آن زمان پرستار بود و از طریق کارش در مورد لینچ خوانده بود، تصمیم گرفت آزمایش بدهد. یورک که اکنون یک خالق محتوای 43 ساله در لس آنجلس است، به Business Insider گفت: \"او فکر کرد: \"خب، اگر من این را داشته باشم و دخترم چه می شود؟\" در آن زمان، یورک همچنین با درد لگن ناشی از کیست‌های پیچیده تخمدان – کیست‌هایی"}, {"source": "Business Insider", "title": "After about a year of using the scooter, I sold my car.", "link": "https://www.businessinsider.com/commuter-sells-car-turns-gas-powered-scooter-save-money-2026-10", "summary": "Gary Brown sold his car and now uses his gas-powered scooter to commute to work. Gary Brown The costs of car ownership have been increasing, from new car prices to gas. One commuter ditched his car in favor of a gas-powered scooter. It's a practical, money-saving alternative when paired with apps like Uber, he said. This as-told-to essay is based on a conversation with Gary Brown, an architectural visualization artist in Charlotte, North Carolina. It has been edited for length and clarity. My wife and I own a townhouse here in Charlotte. It's about four miles from where I work. We actually closed on the house as the city shut down due to COVID in 2020. We entered that period where everybody was working from home for about two years. Then, as I started going back to working in an office, I realized that I hadn't really driven much because I've been working from home. I'm spending $700 a month on a car payment, insurance, parking fees at my office, and all the other costs of a car just to drive four miles down the road. That started to get me thinking: How else can I get there? At first, I got an electric Segway scooter, but after about six months, I realized that it was too hard on my back. I also considered taking the bus or the light rail, but the routes don't go quite close enough. I ended up getting a gas scooter. I had seen them while studying abroad in Europe and realized that this problem has already been solved by just about every other country except ours. It checked all the boxes: It's fuel-efficient. I could park in a garage downtown and not pay anything — a huge deal, given that I was spending thousands of dollars a year parking my car there. It also gets 60 miles per gallon and has some storage and heated seats. Owning a scooter is cheaper than owning a car I bought my scooter used for $3500 cash. A helmet and other gear cost another $1000. The operating costs are much lower than a car: My insurance is $35 a month, and gas for the month averages to about $15. Yearly maintenance that runs about $300. Riding in the heat and cold can be rough at times, but that's a tradeoff I can accept. If the weather is really bad, I'll ask my wife to drive me to work, or I'll take a rideshare. Uber and all those apps have helped facilitate my turn to a scooter. After about a year of using the scooter, I had barely used my Tesla, so I sold it. When I first started this experiment, there was only ever my scooter, a motorcycle or two, and a handful of bicycles whe", "date_str": "2026-10-04T09:13:01+00:00", "hash": "d2c3186c6db78a30", "title_fa": "بعد از حدود یک سال استفاده از اسکوتر، ماشینم را فروختم.", "summary_fa": "گری براون ماشین خود را فروخت و اکنون از اسکوتر گازسوز خود برای رفت و آمد به محل کار استفاده می کند. گری براون هزینه های مالکیت خودرو افزایش یافته است، از قیمت خودروهای جدید گرفته تا بنزین. یکی از مسافران اتومبیل خود را به نفع یک اسکوتر گازسوز رها کرد. او گفت که این یک جایگزین عملی و صرفه جویی در هزینه زمانی است که با برنامه هایی مانند Uber جفت شود. این مقاله همانطور که گفته شد بر اساس گفتگو با گری براون، هنرمند تجسم معماری در شارلوت، کارولینای شمالی است. برای طول و وضوح ویرایش شده است. من و همسرم یک خانه شهری در اینجا در شارلوت داریم. حدود چهار مایل از محل کار من فاصله دارد. ما در واقع با تعطیل شدن شهر به دلیل کووید در سال 2020، خانه را بستیم. وارد دوره ای شدیم که همه حدود دو سال از خانه کار می کردند. سپس، وقتی شروع به بازگشت به کار در یک اداره کردم، متوجه شدم که واقعاً زیاد رانندگی نکرده‌ام، زیرا از خانه کار می‌کردم. من 700 دلار در ماه برای پرداخت ماشین، بیمه، هزینه پارکینگ در دفترم، و تمام هزینه های دیگر یک ماشین فقط برای رانندگی چهار مایلی در جاده خرج می کنم. این باعث شد من به این فکر کنم: چگونه می توانم به آنجا برسم؟ ابتدا یک اسکوتر برقی سگوی گرفتم، اما بعد از حدود شش ماه متوجه شدم که پشتم خیلی سخت است. من همچنین در نظر داشتم از اتوبوس یا قطار سبک استفاده کنم، اما مسیرها به اندازه کافی نزدیک نیستند. بالاخره یک اسکوتر گاز گرفتم. من آنها را در حین تحصیل در خارج از کشور در اروپا دیده بودم و متوجه شدم که این مشکل تقریباً توسط هر کشور دیگری به جز کشور ما حل شده است. تمام کادرها را علامت زد: مصرف سوخت کارآمد"}, {"source": "Business Insider", "title": "I thought a recruiter had found me the perfect job — then he asked me to pay. These are the warning signs I missed.", "link": "https://www.businessinsider.com/how-spot-fake-recruiters-tips-job-seekers-linkedin-2026-10", "summary": "Alyshia Hull. Alyshia Hull Alyshia Hull was approached by a recruiter with a job opportunity that seemed like a good fit for her. After sending her résumé, she was told she would need to pay for a résumé service before she could progress. She realized the offer was a scam. Other indicators could be asking for overly personal information. I've spent six years writing about the workplace, and though this job market has been unexpectedly difficult, I thought I had learned its ins and outs. I've seen readers go through this, and as a freelancer open to a full-time position, I've experienced it, too. Apply online, post on LinkedIn, get contacted by a recruiter, interview, take a test, interview again— and then get ghosted . Repeat. When hope began to feel scarce earlier this year, I woke up to an email from a \"recruiter.\" His message was long, detailed, and complimentary. He praised my writing and portfolio and explained how closely my experience aligned with a role he was hiring for. At first, all he asked for in return was my résumé . The email was kind, detailed, convincing — and a scam. The scam was convincing I received this from the recruiter: \"I'm currently partnering with the recruiting team supporting a confidential Senior Editorial Strategy Lead Workplace Career Content opportunity with Indeed, and I wanted to reach out personally because your profile is unusually aligned with what this team is trying to build.\" His email included a photo of himself, and his signature linked to a LinkedIn profile that he claimed was his. The verified profile was filled with endorsements, an image of himself, and years of experience listed on his page. I'd heard of recruiter scams before, but I didn't see any harm in his email. I agreed to send him my résumé. His next email didn't ask for anything either He complimented my work again, gave me a more detailed overview of the role, and laid out the pay range of $125,000-$165,000. I was excited to see the range, especially because it was higher than I had anticipated and more than I had earned in my previous roles. I thought, He's not asking for anything. Maybe it's real? Then came the third email After a few days had passed, he told me the hiring team had reviewed my candidacy and, though \"the feedback was positive overall,\" my résumé needed improvement before we could proceed. To move forward, I'd need to have my résumé redone through a service he worked with. Otherwise, he couldn't advance me. He said: \"My intention is", "date_str": "2026-10-04T09:05:01+00:00", "hash": "0a812a23acff2b96", "title_fa": "فکر می‌کردم یک استخدام‌کننده شغل مناسبی را برای من پیدا کرده است - سپس از من خواست پول بدهم. اینها علائم هشدار دهنده ای است که من از دست دادم.", "summary_fa": "آلیشیا هال. Alyshia Hull Alyshia Hull توسط یک استخدام کننده با یک فرصت شغلی که برای او مناسب به نظر می رسید به او مراجعه کرد. پس از ارسال رزومه، به او گفته شد که قبل از پیشرفت باید هزینه خدمات رزومه را پرداخت کند. او متوجه شد که این پیشنهاد یک کلاهبرداری بوده است. سایر شاخص‌ها می‌توانند درخواست اطلاعات بیش از حد شخصی باشند. من شش سال را صرف نوشتن درباره محل کار کرده‌ام، و اگرچه این بازار کار به‌طور غیرمنتظره‌ای دشوار بوده است، فکر می‌کردم نکات و نکات آن را یاد گرفته‌ام. خوانندگانی را دیده‌ام که این کار را انجام داده‌اند، و به‌عنوان یک فریلنسر که برای یک موقعیت تمام وقت باز است، من نیز آن را تجربه کرده‌ام. به صورت آنلاین درخواست دهید، در لینکدین پست کنید، یک استخدام کننده با شما تماس بگیرد، مصاحبه کنید، در آزمون شرکت کنید، دوباره مصاحبه کنید – و سپس شبح شوید. تکرار کنید. زمانی که امید در اوایل امسال کم شد، با ایمیلی از یک «کارگزین» از خواب بیدار شدم. پیام او طولانی، مفصل و تعریف‌کننده بود. او نوشته و کارنامه من را تحسین کرد و توضیح داد که چقدر تجربه من با نقشی که او برای آن استخدام می‌کند همخوانی دارد. در ابتدا، تنها چیزی که او در ازای آن درخواست کرد، رزومه من بود. ایمیل مهربان، مفصل، قانع کننده و کلاهبرداری بود. این کلاهبرداری متقاعدکننده بود که من این را از استخدام‌کننده دریافت کردم: \"در حال حاضر با تیم استخدام همکاری می‌کنم که از یک فرصت محتوای محرمانه برای محتوای شغلی در استراتژی ارشد تحریریه ارشد با Indeed پشتیبانی می‌کند، و می‌خواستم شخصاً تماس بگیرم زیرا نمایه شما به طور غیرمعمولی با آنچه این تیم در تلاش برای ساختن است همسو است.\" ایمیل او شامل عکسی از خودش بود و امضای او به نمایه لینکدین که ادعا می‌کرد"}, {"source": "Business Insider", "title": "My son's Trump Account app is boring. Here's why I think other investing apps should take note.", "link": "https://www.businessinsider.com/trump-account-app-boring-design-investing-review-2026-10", "summary": "Checking the Trump App while holding my son. Alex Nicoll/BI I opened a Trump Account for my son to take advantage of the free $1,000 seed money. When I opened the app, I was struck by how boring it was. There's almost nothing to do. This is great news for encouraging responsible investing, as other apps inch toward gambling. When I finally finished opening up my son's Trump Account , I was shocked at how boring the app was. Like many parents of babies born since 2025, I signed up for the Trump Account to get the free $1,000. My wife and I are saving up for a down payment in hopes of finding the one affordable home in all of New York City, so for our little babe, this will be the bulk of his investment portfolio for now. We're very boring investors for both personal and professional reasons. But knowing Trump's flair for the theatrical and reporting on his record-setting level of stock trading as president , I was expecting something a lot more entertaining than what I got. My editor and I even joked that maybe I could \"yeet\" the money into some wild investments: maybe space or robotics stocks . Whatever was getting the most attention on Wall Street Bets at the moment. Instead, it's shockingly simple. The only Trumpian things about it are the gold design theme and the name. The sign-up process, which I had procrastinated for weeks in fear of being buried in forms, was straightforward. And once I signed up, my son's money was automatically placed in $SPYM, State Street's S P 500 tracking index for long-term holds, which has lower fees than its popular $SPY fund. Other than adding more money, looking at my performance or projecting how much money my son would have on his 18th birthday or 60th birthday if I continued to contribute, there was basically nothing to do. The blandness is refreshing in a world where gambling, stock trading, and investing are more accessible and intertwined than ever. When I spoke to Dr. Daniel Crosby, chief behavioral officer at Orion Advisor Solutions, for a previous story on sports betting and investing , he said the apps for both gambling and trading share the same \"reward structure: rapid feedback, variable outcomes, and a scoreboard you can check at any moment.\" \"The product changes from a same-game parlay to a call option on a meme stock, but the behavioral reward is remarkably similar,\" he said The Treasury Department announced on Wednesday that it would soon auto-enroll children, guaranteeing that the Trump accounts will be ", "date_str": "2026-10-04T09:00:01+00:00", "hash": "8444cef81fc94e62", "title_fa": "برنامه حساب ترامپ پسرم خسته کننده است. به همین دلیل است که فکر می کنم سایر برنامه های سرمایه گذاری باید توجه داشته باشند.", "summary_fa": "بررسی اپلیکیشن ترامپ در حالی که پسرم را در آغوش گرفته ام. Alex Nicoll/BI من یک حساب ترامپ برای پسرم باز کردم تا از 1000 دلار اولیه پول رایگان استفاده کند. وقتی برنامه را باز کردم، از خسته کننده بودن آن شگفت زده شدم. تقریبا هیچ کاری برای انجام دادن وجود ندارد. این خبر عالی برای تشویق سرمایه‌گذاری مسئولانه است، زیرا سایر برنامه‌ها به سمت قمار حرکت می‌کنند. وقتی بالاخره باز کردن حساب ترامپ پسرم را تمام کردم، از خسته کننده بودن این برنامه شوکه شدم. مانند بسیاری از والدین نوزادان متولد شده از سال 2025، من برای دریافت 1000 دلار رایگان در حساب ترامپ ثبت نام کردم. من و همسرم به امید یافتن یک خانه مقرون به صرفه در کل شهر نیویورک، برای پیش پرداخت پس انداز می کنیم، بنابراین برای کودک کوچکمان، این بخش عمده سبد سرمایه گذاری او در حال حاضر خواهد بود. ما به دلایل شخصی و حرفه ای سرمایه گذاران بسیار خسته کننده ای هستیم. اما با دانستن استعداد ترامپ برای نمایش و گزارش‌دهی از سطح بی‌سابقه معاملات سهام او به عنوان رئیس‌جمهور، انتظار داشتم چیزی بسیار سرگرم‌کننده‌تر از آنچه به دست آوردم. من و ویراستارم حتی به شوخی گفتیم که شاید بتوانم پول را در برخی سرمایه‌گذاری‌های بی‌نظیر «خروج» کنم: شاید سهام فضا یا روباتیک. هر چیزی که در حال حاضر در وال استریت Bets بیشترین توجه را به خود جلب کرده بود. در عوض، به طرز تکان دهنده ای ساده است. تنها چیزهای ترامپی در مورد آن طرح و نام طلایی است. روند ثبت نام، که من هفته ها به تعویق انداخته بودم از ترس دفن شدن در فرم ها، ساده بود. و هنگامی که ثبت نام کردم، پول پسرم به طور خودکار در $SPYM، شاخص ردیابی S P 500 در ایالت استریت برای نگهداری طولانی مدت، که کارمزد کمتری نسبت به صندوق"}, {"source": "Business Insider", "title": "'It felt like the Hunger Games had started': Employees are 'loud working' in an effort to secure their jobs", "link": "https://www.businessinsider.com/loud-working-job-security-layoffs-linkedin-promotions-2026-10", "summary": "Getty Images; Alyssa Powell/BI Out: quiet quitting. In: loud working. Workers are loudly professing just how much they're doing. It's a shift from the bare minimum era, with workers clamoring for visibility in an uncertain market. Now, workers feel like they're competing to fend off layoffs or build job security. It's time to get loud about work. After the era of quiet quitting — workers showing up, doing their jobs, and not much beyond that — the job market's pendulum has shifted. Job-hopping is harder ; layoffs feel like a constant threat even as mass job cuts haven't yet hit the bulk of the economy. And for the employees who now feel more stuck in place, some are now \"loud working\" — trying to ensure their work is visible and gets noticed. They hope that showing off to their bosses and colleagues will help them get promotions and avoid layoffs. Other people are \"loud working\" by focusing on building their personal brands online — showcasing their work rather than letting it speak for itself. Some hope that in an uncertain economy, visibility will improve their career prospects — and help them dominate LinkedIn or other platforms' algorithms. Vicki Salemi, a career expert with the jobs site Monster, said that loud working can involve making sure that holding on to one's current job doesn't lead to stagnation. Salemi said employees have to be more visible and be more vocal about their achievements, rather than just keeping their heads down and focusing on completing tasks. \"Leaving may feel risky, so workers may concentrate more energy on demonstrating their value internally where they already are,\" she said. Working louder, not harder Abhinav Bohra, an applied scientist at Amazon, said one strategy that he believes helped him earn multiple promotions at the company was learning to \"read what the room wants.\" If there were 10 problems his team was working on, he would try to identify the two or three that his manager most wanted solved — and focus more of his efforts on them. \"Once you solve the critical problem, you automatically get visibility,\" he said. For some workers, that visibility might feel like the only thing between them and a layoff. A former Meta employee who was laid off earlier this year said the competition for the spotlight intensified in recent years as the company went through layoffs and restructurings. He saw coworkers try to take on as much work as possible. Some even tried to take over someone else's work, he said. Their goal, it s", "date_str": "2026-10-04T09:00:01+00:00", "hash": "f58d074505f88291", "title_fa": "\"احساس می‌کرد بازی‌های گرسنگی شروع شده است\": کارمندان در تلاش برای ایمن کردن شغل خود \"با صدای بلند کار می‌کنند\"", "summary_fa": "گتی ایماژ; آلیسا پاول/بی‌آی‌آی: ترک بی‌صدا. در: کار با صدای بلند. کارگران با صدای بلند اظهار می کنند که چقدر کار می کنند. این یک تغییر از دوران حداقلی است، با کارگرانی که برای دیده شدن در بازار نامطمئن فریاد می زنند. اکنون، کارگران احساس می‌کنند برای جلوگیری از اخراج یا ایجاد امنیت شغلی در حال رقابت هستند. وقت آن است که در مورد کار با صدای بلند صحبت کنید. پس از دوران ترک بی سر و صدا - کارگران حاضر شدند، کارهایشان را انجام دادند، و خیلی فراتر از آن - آونگ بازار کار تغییر کرده است. کار کردن سخت تر است. اخراج کارکنان مانند یک تهدید دائمی احساس می‌شود، حتی در شرایطی که کاهش گسترده مشاغل هنوز بخش عمده‌ای از اقتصاد را تحت تأثیر قرار نداده است. و برای کارمندانی که اکنون احساس می‌کنند بیشتر در جای خود گیر کرده‌اند، برخی اکنون «با صدای بلند کار می‌کنند» – تلاش می‌کنند مطمئن شوند که کارشان قابل مشاهده است و مورد توجه قرار می‌گیرد. آنها امیدوارند که خودنمایی به روسای و همکارانشان به آنها کمک کند تا ترفیع بگیرند و از اخراج اجتناب کنند. افراد دیگر با تمرکز بر روی ساخت برندهای شخصی خود به صورت آنلاین \"با صدای بلند کار می کنند\" - به جای اینکه بگذارند خودشان صحبت کنند، کار خود را به نمایش بگذارند. برخی امیدوارند که در یک اقتصاد نامطمئن، دید چشم‌انداز شغلی آنها را بهبود بخشد - و به آنها کمک کند بر لینکدین یا الگوریتم‌های دیگر پلتفرم‌ها تسلط پیدا کنند. ویکی سالمی، کارشناس شغلی در سایت مشاغل Monster، گفت که کار با صدای بلند می تواند شامل اطمینان از اینکه نگه داشتن شغل فعلی منجر به رکود نمی شود. سالمی گفت که کارمندان باید بیشتر دیده شوند و در مورد دستاوردهای خود با صدای بیشتری صحبت کنند، نه اینکه فقط سر خود را پایین"}, {"source": "Business Insider", "title": "I tried ChatGPT’s new try-it-on shopping function. It worked for daily outfits, but couldn't handle a Halloween costume.", "link": "https://www.businessinsider.com/tested-limits-of-chatgpts-new-try-it-on-shopping-function-2026-10", "summary": "I tested ChatGPT s virtual try-on feature on jewelry, daily outfits, a wedding dress, and my cat. ChatGPT/Business Insider I tested ChatGPT's virtual try-on feature on jewelry, outfits, and my cat. The tool rendered simple accessories and clothing with impressive realism. Complex looks fell short, producing inaccurate garments and altered body proportions. ChatGPT wants to be your new virtual fitting room . OpenAI on Thursday rolled out two shopping features globally, allowing users to virtually try on clothing and accessories and save their favorite finds for later. The new Try On button lets shoppers upload a selfie or full-body photo to see how products might look on them. Users can also upload screenshots of items or celebrity outfits and ask ChatGPT to find similar pieces available for purchase. Both features are powered by OpenAI's new ChatGPT Images 2.5 model, which the company said delivers more realistic lighting and textures. I tested the function, from a simple necklace try-on to a complicated full-body costume, and included a cat in the mix to see if the AI could also dress our four-legged friends. Here's what it excelled at — and where things began to get weird. Starting with accessories I let ChatGPT accessorize my original selfie (left) with a moon pendant (middle) and a full necklace stack (right). ChatGPT/Business Insider I started simple with a selfie and a request to find me products that could recreate a silver necklace stack I found on Pinterest, and a little moon pendant in particular, as a centerpiece. Screenshot/Business Insider The AI quickly found options for the moon pendant at various price points and gave me two options: I could try on the pendant, or I could try on the entire layered necklace look. I tested out both looks. The proportions seemed correct and extremely realistic, and could convince me to make a purchase, even though I prefer to shop for jewelry in person. Testing a full-body outfit My original dressing room selfie (left), compared with the virtual try-on of a top (middle) and a full-body outfit change (right). ChatGPT/Business Insider I pulled out another Pinterest save for a concert outfit inspiration, and chose a dressing room selfie with a simple background to try it on. Screenshot/Business Insider The AI categorized the style I'm seeking as \" whimsigoth \" and recommended products consistent with the branding, including garments from Disturbia and Free People. Screenshot/ Business Insider I tried on both a si", "date_str": "2026-10-04T08:11:01+00:00", "hash": "d5c322883740d696", "title_fa": "من تابع خرید آزمایشی جدید ChatGPT را امتحان کردم. برای لباس های روزانه کار می کرد، اما نمی توانست لباس هالووین را تحمل کند.", "summary_fa": "من ویژگی آزمایش مجازی ChatGPT را روی جواهرات، لباس‌های روزانه، لباس عروس و گربه‌ام آزمایش کردم. ChatGPT/Business Insider من ویژگی آزمایش مجازی ChatGPT را روی جواهرات، لباس‌ها و گربه‌ام آزمایش کردم. این ابزار لوازم جانبی و لباس های ساده را با رئالیسم چشمگیر ارائه می کرد. ظاهر پیچیده کوتاه شد و لباس های نادرست و تناسب بدن را تغییر داد. ChatGPT می خواهد اتاق مناسب مجازی جدید شما باشد. OpenAI در روز پنجشنبه دو ویژگی خرید را در سطح جهانی ارائه کرد که به کاربران این امکان را می دهد تا لباس و لوازم جانبی را به صورت مجازی امتحان کنند و یافته های مورد علاقه خود را برای بعد ذخیره کنند. دکمه جدید Try On به خریداران این امکان را می دهد که یک عکس سلفی یا تمام بدن آپلود کنند تا ببینند محصولات چگونه ممکن است روی آنها ظاهر شوند. کاربران همچنین می‌توانند اسکرین‌شات‌هایی از آیتم‌ها یا لباس‌های افراد مشهور آپلود کنند و از ChatGPT بخواهند قطعات مشابهی را که برای خرید در دسترس هستند پیدا کند. هر دو ویژگی از مدل جدید ChatGPT Images 2.5 OpenAI پشتیبانی می‌شوند که به گفته شرکت، نور و بافت‌های واقعی‌تری ارائه می‌دهد. من این عملکرد را آزمایش کردم، از یک گردنبند ساده گرفته تا یک لباس کامل بدن پیچیده، و یک گربه را در ترکیب قرار دادم تا ببینم آیا هوش مصنوعی می تواند دوستان چهارپای ما را نیز لباس بپوشاند. در اینجا این است که در چه چیزی عالی بود - و جایی که همه چیز شروع به عجیب شدن کرد. از لوازم جانبی شروع کردم، به ChatGPT اجازه دادم سلفی اصلی من (سمت چپ) را با یک آویز ماه (وسط) و یک پشته گردنبند کامل (راست) اضافه کند. ChatGPT/Business Insider من کار ساده‌ای را با یک عکس سلفی و درخواستی برای یافتن محصولاتی که می‌توانند پشته گردنبند نقره‌ای را"}, {"source": "Business Insider", "title": "Scott Bessent compares AI CEOs who warn of catastrophe to Hannibal Lecter: 'Stop me before I kill again'", "link": "https://www.businessinsider.com/scott-bessent-compares-ai-ceos-seeking-regulation-to-hannibal-lecter-2026-10", "summary": "Scott Bessent invoked The Silence of the Lambs while discussing government regulation of AI. Frederick M. Brown/Getty Images The Treasury Secretary says pro-regulation AI CEOs bring to mind a movie villain. \"It's kind of like Hannibal Lecter: Stop me before I kill again.\" Bessent says the industry can slow itself down, without government intervention. Treasury Secretary Scott Bessent had some things to say about pro-regulation tech leaders that might go down better with fava beans and a nice Chianti. During a Saturday appearance on \"The Axios Show,\" Bessent compared CEOs who want the government to slap guardrails on AI to a reviled cinematic figure. \"I mean, it's kind of like Hannibal Lecter : Stop me before I kill again,\" Bessent said. \"This alarmism without solutions by some of the AI community — that's not leadership.\" Bessent invoked \"The Silence of the Lambs\" serial killer while saying that AI bosses who want Washington to erect guardrails for the tech they are building should slow down development themselves without government intervention. Bessent's comments are in line with the White House's response to the chorus of AI leaders who last month called for an organized slowdown among AI companies, citing fears that their technology is getting out of control. Some, like Anthropic CEO Dario Amodei , asked the US government to step in and regulate the companies. President Donald Trump brought together AI CEOs for a meeting at the White House that resulted in a voluntary self-policing pledge. Bessent said that AI companies appear to be taking the White House's advice. He cited OpenAI's recent decision to shelve a new model after internal tests raised questions about whether the AI would follow users' instructions. \"The labs have been very cooperative,\" he said. Others in the AI community have warned that the race to dominate the space is sparking a dangerous disregard for safety guardrails . \"You can't do safety from second place,\" Sarah Heck, Anthropic's head of public policy, said on X last week. An OpenAI safety leader, David Robinson , publicly announced his resignation on Saturday, saying he believes the company is moving too fast to ensure its models can't wreak havoc on society. Read the original article on Business Insider", "date_str": "2026-10-03T20:35:02+00:00", "hash": "d39b38849840376b", "title_fa": "اسکات بسنت مدیران عامل هوش مصنوعی را که درباره فاجعه هشدار می دهند با هانیبال لکتر مقایسه می کند: \"قبل از اینکه دوباره بکشم جلوی من را بگیرید\"", "summary_fa": "اسکات بسنت هنگام بحث در مورد مقررات دولتی هوش مصنوعی از The Silence of the Lambs استفاده کرد. فردریک ام. براون/ گتی ایماژ وزیر خزانه داری می گوید که مدیران عامل هوش مصنوعی طرفدار مقررات، یک شخصیت شرور سینما را به یاد می آورند. \"مثل هانیبال لکتر است: قبل از اینکه دوباره بکشم جلوی من را بگیرید.\" بسنت می گوید که صنعت می تواند بدون دخالت دولت، سرعت خود را کاهش دهد. اسکات بسنت، وزیر خزانه داری، در مورد رهبران فن آوری طرفدار مقررات چیزهایی برای گفتن داشت که ممکن است با لوبیا فاوا و یک چیانتی خوب پایین ب I faced scrutiny over the Hugging Face hack. The OpenAI leader who just quit and issued a stark warning about safety says that, like other recent Big Tech defectors, he plans to help solve the problem from the outside. David Robinson worked at OpenAI for three and a half years and ran transparency for the safety team. In an essay published Saturday in The Atlantic , he said he oversaw the company's \"preparedness framework\" and the writing of a slew of safety reports. \"Perhaps I should have stayed and fought for fundamental shifts in our staffing and culture, but in practice, my colleagues and I were so busy sprinting that we seldom had the chance to consider big changes, much less to actually make them,\" he wrote. \"That's why I concluded that stronger incentives for safety — coming from outside the company — are a big part of getting this right.\" Robinson said he hired a PR firm, Spitfire Strategies, to help him with the public attention he'll receive following his departure. \"But the decision to speak out is mine alone,\" he added. That might be aimed at claims from some that public resignations by workers from companies, including Anthropic and Google, are part of a coordinated effort to spread mistrust of AI and foment government regulation. Elon Musk, for instance, said that former Anthropic employee Jacob Coxon 's resignation and subsequent public appearances seem \"like a setup,\" which Coxon denied. In response to Robinson's essay, an OpenAI spokesperson said in a statement that the company is working to ensure AI models don't outpace the safety measures they've implemented. \"As our models become more capable, we continue to strengthen our safety and security practices to address the risks we see today while building safety cases to anticipate the risks of future advances,\" the spokesperson said. \"We're making sure our models don't become more capable than we can safely manage and secure, and we pause training or hold back models when we need to slow down.\" The spokesperson said OpenAI is taking steps to improve security for its AI models. \"We're making significant changes to strengthen security in our research and testing environment", "date_str": "2026-10-03T19:01:53+00:00", "hash": "11202690dfcdf67f", "title_fa": "رهبر OpenAI که استعفا داد می گوید که می تواند کارهای بیشتری را برای ایمنی از خارج از شرکت انجام دهد", "summary_fa": "دیوید رابینسون از OpenAI استعفا داد و گفت که این شرکت نسبت به فناوری بی دقتی می کند. دیوید رابینسون، کارمند بخش OpenAI مجمع جهانی اقتصاد، مقاله ای در مورد پادمان های هوش مصنوعی منتشر کرد. رابینسون گفت که قصد دارد انگیزه‌های هوش مصنوعی را برای توسعه با سرعت مطمئن تقویت کند. خروج او پس از آن صورت می گیرد که OpenAI با بررسی دقیق هک Hugging Face مواجه شد. رهبر OpenAI که به تازگی استعفا داده و یک هشدار جدی در مورد ایمنی صادر کرده است، می‌گوید که مانند سایر افرادی که اخیراً از فناوری بزرگ خارج شده‌اند، قصد دارد به حل مشکل از بیرون کمک کند. دیوید رابینسون به مدت سه سال و نیم در OpenAI کار کرد و شفافیت را برای تیم ایمنی اجرا کرد. در مقاله ای که روز شنبه در آتلانتیک منتشر شد، او گفت که بر \"چارچوب آمادگی\" شرکت و نوشتن مجموعه ای از گزارش های ایمنی نظارت داشته است. او می‌نویسد: «شاید باید می‌ماندم و برای تغییرات اساسی در کارکنان و فرهنگ‌مان می‌جنگیدم، اما در عمل، من و همکارانم آنقدر مشغول دویدن بودیم که به ندرت این شانس را داشتیم که تغییرات بزرگ را در نظر بگیریم، چه برسد به اینکه واقعاً آنها را ایجاد کنیم. به همین دلیل است که به این نتیجه رسیدم که انگیزه‌های قوی‌تر برای ایمنی - که از خارج از شرکت می‌آیند - بخش بزرگی از درست کردن این موضوع است. رابینسون گفت که او یک شرکت روابط عمومی به نام Spitfire Strategies را استخدام کرد تا به او در جلب توجه عمومی که پس از خروجش جلب خواهد کرد کمک کند. او افزود: \"اما تصمیم برای صحبت کردن تنها با من است.\" این ممکن است به ادعای برخی باشد مبنی بر اینکه استعفای عمومی توسط کارکنان شرکت‌هایی از جمله آنتروپیک و گوگل بخشی از تلاش هماهنگ برای"}, {"source": "Business Insider", "title": "People say I don't look like a multimillionaire. Good — I'm not trying to.", "link": "https://www.businessinsider.com/tori-dunlap-multimillionaire-spending-looking-rich-2026-10", "summary": "Tori Dunlap went into debt to buy her car at age 22, she s now a multimillionaire. Courtesy of Tori Dunlap Tori Dunlap became a millionaire at 27, about five years ago. She refuses to spend on signifiers of wealth that aren't meaningful to her. Her privacy has become more important as she builds wealth, she says. This as-told-to essay is based on a conversation with Tori Dunlap , founder of Her First $100K and author of \" Financial Feminist .\" It has been edited for length and clarity . My parents were very good at teaching me about money , not just by what they said, but by what they did. They were middle-class — by no means rich — but they made very smart financial decisions and equipped me with a lot of financial skills. By college, I was the friend whom other friends came to ask about money. I set myself a very public goal of saving my first $100,000 when I was 25 — which I achieved. By 27, I was a millionaire, and now, at 32, I'm a multimillionaire . Yet I don't look or act the way many believe a multimillionaire should. Here's what I refuse to spend on — and what's become even more important to me as I build wealth . I don't spend on signifiers of wealth I'm often told online that I don't look like a multimillionaire should. My hair, for example. If I'm going to be on television, I'll get it blown out. But when I'm creating content for my community, it's often pulled back. Tori Dunlap gets her hair done every three months. Courtesy of Tori Dunlap I get my hair done about every three months, which is more than most people. Yet I'm not going to spend the money — or, more importantly to me these days, the time — to have it done constantly. It's just not a priority for me when I have a company to run. I drive a 12-year-old Toyota I still drive the same Toyota RAV4 that I went into debt to purchase when I was 22. It's a cute car, it's dependable, and it does everything I need it to. Maybe I'll change my mind and get a flashier car in the future. It's fine for people to change their minds about what's important to them. But I'm not going to buy a luxury car just to show my wealth. I rented until last year Until last year, I rented an apartment even though I was a multimillionaire. I could afford to buy, but I didn't have the time to search for a house. Then, my landlord decided to sell. That happened to me twice in a row, and made me realize I was willing to invest the time to find a house I love. As I've built wealth, time has become the currency that mat", "date_str": "2026-10-03T17:42:01+00:00", "hash": "66a69926f1d48e1d", "title_fa": "مردم می گویند من شبیه یک مولتی میلیونر نیستم. خوب - من سعی نمی کنم.", "summary_fa": "توری دانلپ در سن 22 سالگی برای خرید ماشینش بدهکار شد، او اکنون یک مولتی میلیونر است. به لطف توری دانلپ توری دانلپ حدود پنج سال پیش در 27 سالگی میلیونر شد. او از خرج کردن برای نشانه های ثروت که برای او بی معنی هستند، امتناع می کند. او می‌گوید که حریم خصوصی او با ایجاد ثروت بیشتر اهمیت پیدا کرده است. این مقاله گفته شده بر اساس گفتگو با توری دانلپ، بنیانگذار ۱۰۰ هزار دلاری او و نویسنده کتاب «فمینیست مالی» است. برای طول و وضوح ویرایش شده است. پدر و مادرم در آموزش من در مورد پول بسیار خوب بودند، نه فقط با آنچه که می گفتند، بلکه با آنچه انجام می دادند. آنها از طبقه متوسط ​​بودند - به هیچ وجه ثروتمند - اما تصمیمات مالی بسیار هوشمندانه ای گرفتند و من را به مهارت های مالی زیادی مجهز کردند. در دانشگاه، من دوستی بودم که دوستان دیگر برای پرسیدن پول از او آمده بودند. من یک هدف بسیار عمومی برای خودم گذاشتم که در ۲۵ سالگی اولین ۱۰۰۰۰۰ دلارم را پس انداز کنم – که به آن دست یافتم. در 27 سالگی میلیونر بودم و اکنون در 32 سالگی یک مولتی میلیونر هستم. با این حال، من آنطور که خیلی ها معتقدند یک مولتی میلیونر باید رفتار کنم، ظاهر یا رفتار نمی کنم. در اینجا چیزی است که من از خرج کردن در آن امتناع می‌کنم - و با ثروتمند کردنم چه چیزی برایم مهم‌تر می‌شود. من برای نشانه‌های ثروت خرج نمی‌کنم. اغلب در اینترنت به من گفته می‌شود که شبیه یک مولتی میلیونر نیستم. مثلا موهای من اگر قرار باشد در تلویزیون حضور داشته باشم، آن را به باد می دهم. اما زمانی که من برای جامعه خود محتوا ایجاد می کنم، اغلب به عقب کشیده می شود. توری دانلپ هر سه ماه یکبار"}, {"source": "Business Insider", "title": "Elon Musk says Tesla is trying to prevent robotaxis from running over cats at night", "link": "https://www.businessinsider.com/elon-musk-tesla-trying-to-stop-robotaxis-from-hitting-cats-2026-10", "summary": "Elon Musk says gray cats on a dark road are vexing for robotaxis. Kaylee Greenlee/Reuters Tesla CEO Elon Musk said one problem for robotaxis at night has whiskers and a tail. \"Literally trying to avoid grey kittens on grey tarmac in the dark,\" he said. A Waymo hit and killed a cat at night last year. There are many challenges to putting self-driving cars on the road. Elon Musk says one of them has nine lives. The Tesla CEO announced on Saturday that the company is expanding the operating hours of its robotaxis from 10 p.m. to 11 p.m. in Austin and said that his team has been trying to overcome a rather stealthy problem. \"The main thing we're trying to solve is making sure that we don't run over pets when they're hard to see at night,\" Musk wrote in an X post . \"Literally trying to avoid grey kittens on grey tarmac in the dark.\" After years of delays , Tesla's robotaxis were rolled out in Austin last year. Since then, the company has gradually expanded the availability there and in other Texas cities and in Florida. Cybercabs use \"camera vision and sensors\" to navigate, according to Tesla. In its vehicle manuals, Tesla says that low or limited light — including unlit or poorly lit roads at night — can limit a camera's ability to provide accurate visual information. Cats and dogs, which are prone to darting unpredictably into the street, could pose a higher risk than the relatively routine flow of traffic. In a reply to a comment on his X post on Saturday, Musk pointed to AI-assisted camera processing as a way to improve nighttime visibility. \"Visual spectrum cameras can see very well in the dark when AI is doing the photon count analysis,\" he said. The National Highway Traffic Safety Administration is investigating Telsa's camera system for full self-driving vehicles and whether it's good enough at spotting road hazards in less-than-ideal visibility conditions. The robotaxi industry leader, Waymo, uses a different system than Tesla — LiDAR , which uses laser beams to scan the environment. One late night last year, a Waymo struck and killed a 9-year-old tabby cat named KitKat — prompting an outpouring of tributes from residents in the neighborhood. In September 2025, a Tesla Model Y operating in its Austin robotaxi service struck a dog that ran into the street, the company reported. The report, which Tesla filed with the National Highway Traffic Safety Administration, said the dog ran away from the car, apparently uninjured. Musk has owned cats , including o", "date_str": "2026-10-03T17:35:57+00:00", "hash": "e096eb275fd19b44", "title_fa": "ایلان ماسک می‌گوید تسلا در تلاش است تا از رد شدن ربات‌اکسی روی گربه‌ها در شب جلوگیری کند", "summary_fa": "ایلان ماسک می گوید گربه های خاکستری در یک جاده تاریک برای رباتاکسی آزاردهنده هستند. ایلان ماسک، مدیرعامل رویترز تسلا، کیلی گرینلی، گفت که یکی از مشکلات رباتاکسی در شب، سبیل و دم دارد. او گفت: «به معنای واقعی کلمه تلاش برای اجتناب از بچه گربه های خاکستری روی آسفالت خاکستری در تاریکی است. سال گذشته یک Waymo یک گربه را در شب زد و کشت. چالش های زیادی برای قرار دادن خودروهای خودران در جاده ها وجود دارد. ایلان ماسک می گوید یکی از آنها 9 زندگی دارد. مدیرعامل تسلا روز شنبه اعلام کرد که این شرکت ساعات کار رباتاکسی خود را از ساعت 10 شب افزایش می دهد. تا ساعت 11 شب در آستین و گفت که تیم او در تلاش برای غلبه بر یک مشکل نسبتاً پنهانی بوده است. ماسک در پست ایکس نوشت: «مهمترین چیزی که ما سعی در حل آن داریم این است که مطمئن شویم حیوانات خانگی را وقتی که در شب به سختی دیده می‌شوند زیر پا نگذاریم. \"به معنای واقعی کلمه تلاش برای جلوگیری از بچه گربه های خاکستری روی آسفالت خاکستری در تاریکی.\" پس از سال ها تاخیر، رباتاکسی تسلا سال گذشته در آستین راه اندازی شد. از آن زمان، این شرکت به تدریج در دسترس بودن را در آنجا و سایر شهرهای تگزاس و فلوریدا گسترش داد. به گفته تسلا، کابین‌های سایبری از «دوربین و حسگرها» برای حرکت استفاده می‌کنند. تسلا در کتابچه راهنمای خودرو خود می گوید که نور کم یا محدود - از جمله جاده های بدون نور یا کم نور در شب - می تواند توانایی دوربین در ارائه اطلاعات بصری دقیق را محدود کند. گربه‌ها و سگ‌ها که مستعد تیراندازی غیرقابل پیش‌بینی به خیابان هستند، می‌توانند خطر بیشتری نسبت به جریان نسبتاً معمول ترافیک داشته باشند. ماسک در پاسخ به یک نظر در پست X خود"}, {"source": "Business Insider", "title": "I've been to Cancún countless times — but I prefer this quieter island about 30 minutes away", "link": "https://www.businessinsider.com/favorite-place-to-go-mexico-island-near-cancun-isla-mujeres-2026-10", "summary": "Isla Mujeres offered gorgeous food, great views, and fewer crowds than Cancún. Kaila Yu I love visiting Cancún , but I've been on the hunt for a similar spot that has fewer crowds. Recently, I fell in love with Isla Mujeres, an island near Cancún that has great food and beaches. I think Isla Mujeres is a perfect spot for fans of Cancún who want a beach trip with less nightlife. I love Cancún's balmy, multi-blue-toned water, but I'm less fond of the crowds, nightlife, and traffic. These days, when I travel, I want as much peace and nature as possible, from calming ocean waves to the squeaky chatter of local birds. I've been to Cancún countless times, but recently visited the nearby Isla Mujeres for the first time — and found it to be the quiet, tropical escape that I needed. This island is just a 30-minute boat ride from Cancún, but it feels worlds away. It's also much smaller — the entire island of Isla Mujeres is 5 miles long, less than half of Cancún's Hotel Zone alone. The island is ideal for those who, like me, want to avoid the crowds and loud music of Cancún and Tulum. The island is just a quick ferry ride from Cancún I felt relaxed as soon as I arrived. Holly Hildreth/Getty Images Isla Mujeres is an easy day trip from Cancún, but there are plenty of hotels — from luxury options to budget picks — for those who wish to stay longer. On this trip, I picked an all-inclusive resort that provided a catamaran ride from Cancún, though there's also take a ferry for under $20 (one way). The vacation began the moment I boarded the catamaran: I found a prime, comfortable spot next to the captain and enjoyed the scenic boat ride . The crew told us it's not rare to see dolphins along the way (although we sadly didn't). One of the first things I did upon arriving was explore the island. It was fun to pass brightly colored homes painted in shades like banana yellow and aquamarine, and watch cute iguanas sunbathe. I also stopped at popular Instagrammable spots and monuments, such as the Mayan goddess Ixchel statue at Punta Sur, toward the southern tip of the island. Isla Mujeres is one of the best places in the world to swim with whale sharks On Isla Mujeres, you can swim with whale sharks. Brandi Mueller/Getty Images Every year, hundreds of whale sharks arrive on Isla Mujeres between summer and early fall for a bountiful plankton feast. I learned that this is widely considered one of the ethical places to swim with whale sharks because regulations are in place to pr", "date_str": "2026-10-03T17:27:01+00:00", "hash": "7609ad339482b4c4", "title_fa": "من بارها به کانکون رفته‌ام - اما این جزیره ساکت‌تر را که حدود 30 دقیقه دورتر است ترجیح می‌دهم.", "summary_fa": "Isla Mujeres غذاهای باشکوه، مناظر عالی و جمعیت کمتری نسبت به Cancún ارائه می‌دهد. Kaila Yu من عاشق بازدید از کانکون هستم، اما در جستجوی مکان مشابهی بوده‌ام که جمعیت کمتری دارد. اخیراً عاشق Isla Mujeres شدم، جزیره ای در نزدیکی Cancún که غذاهای عالی و سواحل دارد. فکر می‌کنم Isla Mujeres یک مکان عالی برای طرفداران کانکون است که می‌خواهند یک سفر ساحلی با تفریحات شبانه کمتر داشته باشند. من عاشق آب ملایم و چند رنگ آبی کانکون هستم، اما کمتر به شلوغی، تفریحات شبانه و ترافیک علاقه دارم. این روزها که به مسافرت می‌روم، تا حد امکان آرامش و طبیعت را می‌خواهم، از امواج آرام اقیانوس گرفته تا صدای جیرجیر پرندگان محلی. من بارها به کانکون رفته‌ام، اما اخیراً برای اولین بار از Isla Mujeres در نزدیکی آن دیدن کردم - و متوجه شدم که این مکان فراری آرام و گرمسیری است که به آن نیاز داشتم. این جزیره تنها 30 دقیقه با قایق تا کانکون فاصله دارد، اما احساس می‌کنید دنیاها دورتر هستند. همچنین بسیار کوچکتر است - کل جزیره Isla Mujeres 5 مایل طول دارد که کمتر از نیمی از منطقه هتل کانکون به تنهایی است. این جزیره برای کسانی ایده آل است که مانند من می خواهند از شلوغی و موسیقی بلند کانکون و تولوم دوری کنند. این جزیره فقط یک کشتی سواری سریع از کانکون است که به محض ورود احساس آرامش کردم. Holly Hildreth/Getty Images Isla Mujeres یک سفر یک روزه آسان از کانکون است، اما تعداد زیادی هتل - از گزینه های لوکس گرفته تا انتخاب های ارزان قیمت - برای کسانی که می خواهند بیشتر بمانند وجود دارد. در این سفر، یک استراحتگاه جامع را انتخاب کردم که امکان سواری با کاتاماران از کانکون را فراهم می‌کرد، اگرچه با کشتی زیر 20 دلار (یک طرفه) نیز وجود دارد. تعطیلات از لحظه"}, {"source": "Business Insider", "title": "How to watch Ohio State vs. Iowa: Live streams, channel, odds, venue", "link": "https://www.businessinsider.com/guides/streaming/how-to-watch-ohio-state-vs-iowa-college-football-2026-10", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The Ohio State Buckeyes head to Iowa to take on the Hawkeyes this weekend. Kirk Irwin/Getty Images It's an eye for an eye in this weekend's marquee Big Ten match-up. We've scoured the streaming options to highlight everything you need to know about how to watch Ohio State vs. Iowa, no matter where you are. There are a few easy ways to live stream the Buckeyes vs. Hawkeyes game. In the US, you can live stream the game on CBS via Paramount Plus Premium . In the UK and other international markets, DAZN will live stream the matc ecoming a parent. Courtesy of Lara Kramer. I've traveled a lot for work and pleasure, so I have some high standards when it comes to hotels. Since having a child, my needs have shifted, and I now look for different things. Attention is my new favorite amenity. It means so much when traveling with kids. When my husband and I were planning our honeymoon along the Amalfi Coast, we had three criteria for every hotel we booked: superb dining, a dreamy wellness program, and a wow factor. We wanted something like a breathtaking view or spa-inspired bathroom , something that would keep us on our just-married high. Years later, having traded newlywed life for the life of new parents, we were adamant that we would continue traveling. At 2 months old, our daughter Mabel had a passport. Before her first birthday, she'd clocked two international trips — one to Paris and one to the Dominican Republic — along with a domestic jaunt to Asheville. With each new hotel check-in during this new phase of life, I found that what I needed from my hotel stays started to shift. The parent effect I've had a long career in the travel space, with a decade spent on staff at \"Fodor's Travel\" and \"Condé Nast Traveler,\" and now as a freelance travel writer. Hotels have always been front and center in my career and personal life. In my early years, I built digital products and guided editorial strategy centered on hotel evaluation, and later in my career, I was boots-on-the-ground reporting on the guest experience at luxury hotels around the world. My reporting always focused on the details the industry celebrates: the architecture, the spa, the lobby bar, the Michelin-starred restaurant . The author said she wanted to continue traveling after having a child. Courtesy of Lara Kramer. But traveling with my daughter forced me to notice a different set of details, ones that most travelers, and many hotels, overlook. Suddenly, I cared less about the premium wine list and more about if the in-room blackout curtains actually worked. I found myself checking how flexible the dinner hours were, whether there were affordable laundry services with same-day turnaround, whether the mini fridge could fit several bottles of milk, and whether there was a park within walking distance. The things I rarely, if ever, considered had suddenly become the things that could make or break my stay.", "date_str": "2026-10-03T15:36:01+00:00", "hash": "9f5ac9b502bfa78f", "title_fa": "من نزدیک به یک دهه هتل های لوکس را بررسی کردم. مادر شدن چیزی را که به دنبالش هستم تغییر داد.", "summary_fa": "نویسنده می‌گوید نزدیک به یک دهه است که هتل‌های مجلل را بررسی کرده است، اما امکاناتی که او به دنبال آن است از زمانی که پدر و مادر شد تغییر کرده است. با حسن نیت از لارا کرامر. من برای کار و تفریح ​​زیاد سفر کرده ام، بنابراین در مورد هتل ها استانداردهای بالایی دارم. از زمان داشتن فرزند، نیازهای من تغییر کرده است و اکنون به دنبال چیزهای مختلف هستم. توجه، امکانات مورد علاقه جدید من است. وقتی با بچه ها سفر می کنید خیلی معنی دارد. زمانی که من و شوهرم در حال برنامه ریزی برای ماه عسل خود در امتداد ساحل آمالفی بودیم، برای هر هتلی که رزرو می کردیم سه معیار داشتیم: غذاخوری عالی، یک برنامه سلامتی رویایی، و فاکتور شگفت انگیز. ما چیزی مانند منظره ای خیره کننده یا حمام الهام گرفته از آبگرم می خواستیم، چیزی که ما را در اوج تازه ازدواجمان نگه دارد. سال ها بعد، با معاوضه زندگی تازه ازدواج کرده با زندگی والدین جدید، ما مصمم بودیم که به سفر ادامه دهیم. در 2 ماهگی، دخترمان میبل پاسپورت داشت. قبل از اولین تولدش، او دو سفر بین المللی - یکی به پاریس و دیگری به جمهوری دومینیکن - همراه با یک گردش داخلی به آشویل داشت. با هر بار ورود به هتل جدید در این مرحله جدید از زندگی، متوجه شدم که آنچه از اقامت در هتل نیاز داشتم شروع به تغییر کرد. اثر والد من یک کار طولانی در فضای سفر داشتم، با یک دهه گذراندن روی کارمندان «فودورز سفر» و «مسافر کونده ناست» و اکنون به عنوان یک سفرنامه نویس آزاد. هتل ها همیشه در زندگی حرفه ای و شخصی من نقش اول و محوری داشته اند. در سال‌های اولیه‌ام، محصولات دیجیتالی ساختم و استراتژی سرمقاله‌ای را هدایت کردم که بر ارزیابی هتل متمرکز بود، و بعداً در"}, {"source": "Business Insider", "title": "I ordered the same 3 items at Jersey Mike's and Subway. Neither sandwich chain was perfect, but one stood out.", "link": "https://www.businessinsider.com/subway-vs-jersey-mikes-sandwich-comparison-which-is-better-review-2026-10", "summary": "I headed to both Jersey Mike s and Subway to see which sandwich chain is my top pick. Savannah Born I ordered a cold sandwich, a hot sandwich, and a cookie at Jersey Mike's and Subway to compare. Jersey Mike's Club Sub blew me away, but I didn't love either chain's cheesesteak. Both chains had great chocolate-chip cookies, but, overall, I prefer Jersey Mike's to Subway. For years, Subway felt like the only relevant sandwich chain. Its 2008 \"five, five dollar, five dollar footlong \" jingle still lives in my head. The Connecticut-founded fast-food giant operates over 35,000 restaurants worldwide, with the most recent 2025 industry data estimating an annual $9.2 billion in United States system-wide sales. Subway remains the largest sandwich chain in the US, both in location count and estimated sales — but size isn't the whole picture. Its US footprint has fallen from more than 27,000 locations in 2015 to fewer than 19,000 today, with more than 700 closures in 2025 alone. Subway's domestic location count has declined every year since its 2015 peak (though it has seen international growth ). In April 2024, Subway was sold to Roark Capital — a private equity firm that also has a large stake in sandwich-chain competitor Jimmy John's — for a reported $9.6 billion. Meanwhile, Jersey Mike's made headlines in July 2026 after announcing plans to go public . It hit the New York Stock Exchange with a $1 billion IPO, one of the largest restaurant-sector debuts in recent years. The New Jersey-founded sandwich chain now operates more than 3,300 locations across the US and Canada. Earlier this year, the chain also announced plans to expand into Europe by opening hundreds of locations across the UK and Ireland. By comparison, in 2015, it had just over 1,000 total locations. Jersey Mike's financials track with its physical growth. In 2025, it posted more than $4 billion in US system-wide sales, a major feat for a chain that has far fewer locations than Subway yet has become one of its top competitors. With all the buzz, I wanted to see which chain actually had better-tasting sandwiches and offered more value to customers. To do so, I ordered a similar cold club sandwich, hot Philly cheesesteak, and chocolate-chip cookie at each, sticking to the chain's regular size and default preparations. Here's how they stacked up. I started at Jersey Mike s, a chain I d never tried. Savannah Born Walking in, the first thing I noticed was a wall decal that read, \"It's not a real Jersey Mik", "date_str": "2026-10-03T15:15:01+00:00", "hash": "8299d4be31bc501b", "title_fa": "من همان 3 مورد را در Jersey Mike's و Subway سفارش دادم. هیچکدام از زنجیرهای ساندویچ کامل نبودند، اما یکی از آنها برجسته بود.", "summary_fa": "من به سمت Jersey Mike s و Subway رفتم تا ببینم کدام زنجیره ساندویچ بهترین انتخاب من است. Savannah Born من برای مقایسه یک ساندویچ سرد، یک ساندویچ گرم و یک کلوچه در Jersey Mike's و Subway سفارش دادم. Jersey Mike's Club Sub من را غافلگیر کرد، اما من استیک پنیر هیچ کدام از این دو زنجیره را دوست نداشتم. هر دو زنجیره شیرینی‌های شکلاتی عالی داشتند، اما در کل، من Jersey Mike's را به Subway ترجیح می‌دهم. برای سال‌ها، Subway تنها زنجیره ساندویچ مرتبط بود. جنگ 2008 \"پنج، پنج دلاری، پنج دلاری\" آن هنوز در ذهن من زنده است. غول فست فود تأسیس شده در کنتیکت بیش از 35000 رستوران را در سراسر جهان اداره می کند، با آخرین داده های صنعت سال 2025 که فروش سالانه 9.2 میلیارد دلاری در سراسر سیستم ایالات متحده را برآورد می کند. Subway همچنان بزرگترین زنجیره ساندویچ در ایالات متحده است، هم از نظر تعداد مکان و هم از نظر فروش تخمینی - اما اندازه تصویر کامل نیست. ردپای آن در ایالات متحده از بیش از 27000 مکان در سال 2015 به کمتر از 19000 مکان امروزی کاهش یافته te House said that seniors who want to check on their eligibility can call 1-800-633-4227, and those who want to check on the status of their payment can call 1-800-772-1213. Read the original article on Business Insider", "date_str": "2026-10-03T14:54:50+00:00", "hash": "b23d1664046ae695", "title_fa": "کاخ سفید یک بار تخفیف 90 دلاری را برای برخی از کاربران مدیکر اعلام کرد", "summary_fa": "پرزیدنت ترامپ روز جمعه گفت که دولت او به برخی از سالمندان ثبت نام شده در بخش B مدیکر چک می دهد. بیش از 20 میلیون سالمند واجد شرایط پرداخت خواهند بود. 90 دلار حدود نیمی از حق بیمه استاندارد یک ماهه Medicare Part B را پوشش می دهد. دونالد ترامپ، رئیس جمهور آمریکا، با نزدیک شدن به دوره میان دوره ای، چک های بیشتری را کاهش می دهد - این بار برای برخی از آمریکایی های مسن ثبت نام شده در مدیکر. ترامپ اعلام کرد که دولت او 90 دلار به 20 میلیون نفر از بیش از 60 میلیون نفری که در بخش B مدیکر ثبت نام کرده اند، که مواردی مانند ویزیت پزشک را پوشش می دهد، اهدا خواهد کرد. یک برگه اطلاعات کاخ سفید می گوید که چک ها تا \"اوایل اکتبر\" به دست خواهند آمد. حق بیمه استاندارد ماهانه برای Medicare Part B حدود 203 دلار است، به این معنی که چک ها تقریباً نیمی از پرداخت یک ماه را پوشش می دهند. کاخ سفید گفت که ثبت نام کنندگان قسمت B که حق بیمه آنها قبلاً توسط Medicaid پرداخت شده است یا هزینه اضافی مربوط به درآمد را پرداخت می کنند، واجد شرایط نیستند. ترامپ گفت برای پرداخت هزینه این اقدام، از صندوق بهبود مدیکر که در سال 2008 توسط کنگره برای تامین مالی بهبود برنامه سنتی مدیکر ایجاد شد، پول خواهد گرفت. کاخ سفید گفت که سالمندانی که می خواهند واجد شرایط بودن خود را بررسی کنند می توانند با شماره 1-800-633-4227 تماس بگیرند و کسانی که می خواهند وضعیت پرداخت خود را بررسی کنند می توانند با شماره 1-800-772-1213 تماس بگیرند. مقاله اصلی را در Business Insider بخوانید"}],
