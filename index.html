خته شده است که به دنبال مواردی است که پاک کردن ایمن هستند، نه فایل‌هایی که فعالانه استفاده می‌کنید. MacPaw که به دلیل نرم افزارهای کاربرپسند مک مانند ClearVPN و Eney شناخته شده است، برنامه CleanMyMac پرچمدار خود را ساخته تا راهی"}],
      media: [{"source": "Billboard", "title": "Kehlani & Monaleo Talk Mental Health, Motherhood & Boundaries | Billboard R&B/Hip-Hop House 2026", "link": "https://www.billboard.com/video/kehlani-monaleo-talk-mental-health-motherhood/", "summary": "This is sponsored content. Kehlani and Monaleo sit down for Billboard ’s Like-Minded (in partnership with BetterHelp) for an honest conversation about motherhood, mental health, identity and boundaries. From “perfect mom” pressure to community care, healing in real time and navigating fame, this panel goes deep. This episode is hosted by Gail Mitchell ( Billboard R B/Hip-Hop) alongside Sonni Williams (BetterHelp), a licensed professional counselor specializing in perinatal mental health. Monaleo: Everybody wants to feel like they re like the perfect mother, they re doing everything right, and I think it s OK to admit that you re gonna drop the ball sometimes. Kehlani: Everything I watch my daughter process, I feel like I m double processing. So I ve really tried to like focus on just like having as much joy with her as possible while being honest when things aren t as joyous. Gail Mitchell: So I m Gail Mitchell, editor-at-large of R B/Hip-Hop for Billboard magazine. Welcome, you guys. So thrilled to be here, have you here. Welcome to Like-Minded, uh, presented by BetterHelp, a space where artists and cultural voices come together for honest conversations about mental health, the progress we ve made, and where we still have room to grow. Uh, sitting to my left, I m joined by Sonni Williams, who is with BetterHelp. She s a licensed professional counselor specializing in perinatal mental health. And now we re getting ready to be joined by two of my favorite artists, fearless women, uh, Kehlani and Monaleo. So I hope y all are ready for some women talk. Monaleo: Yes. Kehlani: Yeah. Gail Mitchell: OK. Kehlani: Yeah, girl stuff.Hey. Gail Mitchell: Cause we re gonna have a candid conversation about motherhood, identity and caring for yourself while caring for others. So first question, and, uh, either one of you can start and the other ha-answer the question as well. Uh, what truth about motherhood do you wish women were given permission to admit without having their love for their children questioned? Watch the full video above!", "date_str": "2026-09-24T14:20:09+00:00", "hash": "0bb24b851ead0736", "title_fa": "کهلانی و مونالئو تاک سلامت روان، مادری و مرزها | Billboard R&B/Hip-Hop House 2026", "summary_fa": "این محتوای حمایت شده است. کهلانی و مونالئو برای گفتگوی صادقانه درباره مادری، سلامت روان، هویت و مرزها، برای Billboard’s Like-Minded (با مشارکت BetterHelp) می نشینند. این پانل از فشار \"مادر کامل\" گرفته تا مراقبت از جامعه، درمان در زمان واقعی و پیمایش شهرت، عمیق است. این قسمت توسط گیل میچل (بیلبورد R B/Hip-Hop) در کنار Sonni Williams (BetterHelp)، یک مشاور حرفه ای دارای مجوز متخصص در سلامت روان پری ناتال، میزبانی می شود. مونالئو: همه می‌خواهند احساس کنند مثل یک مادر عالی هستند، همه چیز را درست انجام می‌دهند، و من فکر می‌کنم خوب است اعتراف کنیم که گاهی توپ را رها می‌کنی. کهلانی: هر چیزی را که دخترم پردازش می‌کند، احساس می‌کنم دوبار پردازش می‌کنم. بنابراین من واقعاً سعی کرده‌ام که دوست داشته باشم روی آن تمرکز کنم، درست مثل اینکه تا آنجا که ممکن است با او شادی داشته باشم در حالی که وقتی همه چیز به همان اندازه شادی‌آور نیست صادق باشم. گیل میچل: پس من گیل میچل، سردبیر R B/Hip-Hop مجله بیلبورد هستم. خوش آمدید، بچه ها. خیلی خوشحالم که اینجا هستم، شما اینجا هستید. به Like-Minded خوش آمدید، اوه، ارائه شده توسط BetterHelp، فضایی که در آن هنرمندان و صداهای فرهنگی گرد هم می آیند تا در مورد سلامت روان، پیشرفتی که به دست آورده ایم، و جایی که هنوز فضایی برای رشد داریم، گفتگوهایی صادقانه داشته باشند. اوه، در سمت چپ من نشسته ام، سونی ویلیامز، که با BetterHelp است، به من ملحق شده است. او یک مشاور حرفه ای دارای مجوز متخصص در سلامت روان پری ناتال است. و اکنون آماده می شویم تا دو تن از هنرمندان مورد علاقه من، زنان بی باک، آه، کهلانی و مونالئو به ما ملحق شوند. بنابراین امیدوارم همه شما برای صحبت چند زن آماده باشید. مونالئو: بله. کهلانی: آره. گیل میچل: باشه. کهلانی: آره، دختره."}, {"source": "Billboard", "title": "Sony Music Latin Partners With Luis R. Conríquez’s K Music to Drive Música Mexicana’s Growth", "link": "https://www.billboard.com/pro/sony-music-luis-r-conriquez-label-musica-mexicana/", "summary": "Sony Music Latin has signed an agreement with K Music, the record label founded by Freddy Becerra , Leonardo Soto and Mexican singer-songwriter Luis R. Conríquez , Billboard can exclusively announce on Thursday (Sept. 24). The new alliance is part of the multinational label s strategy to continue driving the growth of Música Mexicana and its evolving expressions. The collaboration includes a focus on artistic development, distribution and strengthening the projects supported by K Music, as well as the continued global growth of regional Mexican music and Latin music. Related Warner Chappell Music Boosts Música Mexicana Growth With Carlos Ruiz at the Helm Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction “Luis R. Conriquez has established himself as a leader of the movement and a true innovator within Mexican music. Together with K Music, he has brought together the genre’s top talent, building a solid, forward-looking project, Alex Gallardo, Sony Music Latin president, said in a statement. For Sony Music Latin, it is a true honor to partner with them in this new chapter, which will undoubtedly mark a milestone in Mexican music.” Considered one of the most influential voices in contemporary Mexican music and the new wave of modern corridos, Conríquez has positioned himself as one of the most-streamed artists in the genre on digital platforms, with No. 1 hits on Billboard s Regional Mexican Airplay chart including “JGL” with La Adictiva, “Si Ya Hiciste El Mal” with Jessie Uribe and “Con Todo Respetillo.” Founded in 2019 in Riverside, Calif., K Music — initially launched as Kartel Music — has played a key role in promoting regional Mexican music, driving its recent global expansion. The label represents some of the genre s most promising stars, starting with Conríquez and including Joel De La P and Tony Aguirre. “K Music was founded with the goal of elevating Mexican music and discovering the next generations of artists, providing them with the infrastructure to build careers that transcend borders, Becerra said. K Music grew exponentially thanks to our audience, our team of executives, and the talent of the artists who place their trust in us. In 2026, we partnered with Sony Music Latin, taking our platform to a new level so that we can continue to be a standard-bearer for Mexican culture and continue providing the best development tools to the talent we represen", "date_str": "2026-09-24T14:00:00+00:00", "hash": "1fa9263ea3187003", "title_fa": "سونی موزیک لاتین با موزیک K لوئیس آر. کنریکز شریک می شود تا رشد موسیقی مکزیکا را به پیش ببرد.", "summary_fa": "سونی موزیک لاتین قراردادی را با K Music امضا کرده است، شرکت ضبط موسیقی که توسط فردی بکارا، لئوناردو سوتو و خواننده و ترانه سرای مکزیکی، لوئیس آر. کونریکز تأسیس شده است، بیلبورد می تواند به طور انحصاری در روز پنجشنبه (24 سپتامبر) اعلام کند. اتحاد جدید بخشی از استراتژی لیبل چندملیتی برای ادامه رشد موسیقی مکزیکا و عبارات در حال تکامل آن است. این همکاری شامل تمرکز بر توسعه هنری، توزیع و تقویت پروژه های حمایت شده توسط K Music و همچنین رشد مداوم جهانی موسیقی منطقه ای مکزیکی و موسیقی لاتین است. موسیقی مرتبط وارنر چاپل رشد موسیقی مکزیکی را با کارلوس روئیز در بیلبورد هلم افزایش می‌دهد تا آلبوم‌های رسانه‌ای هوشمند را به‌عنوان فرمت‌های فروش واجد شرایط در نمودار اضافه کند Duane Keffe D Davis اولین مصاحبه را پس از محکومیت قتل توپاک شکور «Luis R. Conriquez خود را به عنوان یک رهبر جنبش و یک مبتکر واقعی در موسیقی مکزیکی تثبیت کرده است. الکس گالاردو، رئیس لاتین موزیک سونی در بیانیه‌ای گفت: او به همراه K Music، استعدادهای برتر این ژانر را گرد هم آورده و یک پروژه محکم و آینده‌نگر ساخته است. برای سونی موزیک لاتین، شراکت با آنها در این فصل جدید، که بدون شک نقطه عطفی در موسیقی مکزیکی خواهد بود، یک افتخار واقعی است. Conríquez که یکی از تاثیرگذارترین صداها در موسیقی معاصر مکزیک و موج جدید کوریدوس های مدرن در نظر گرفته می شود، خود را به عنوان یکی از پرمخاطب ترین هنرمندان این ژانر در پلتفرم های دیجیتال معرفی کرده است. 1 مورد در جدول پخش منطقه ای مکزیکی بیلبورد از جمله \"JGL\" با La Adictiva، \"Si Ya Hiciste El Mal\" با Jessie Uribe و \"Con Todo Respetillo\". K Music که در سال 2019 در ریورساید، کالیفرنیا تأسیس شد - در ابتدا با نام Kartel Music راه اندازی شد -"}, {"source": "Billboard", "title": "How ‘Chicago’ Is Bringing a New Reality to Broadway — And Reaping the Rewards", "link": "https://www.billboard.com/music/pop/chicago-broadway-reality-stars-casting-1236345649/", "summary": "In the alley outside Broadway’s Ambassador Theatre — home for 23 years now to the musical Chicago — there’s an unofficial “wall of fame.” Adorning the white bricks are the names of all the actors who’ve played the lead roles in the show, a group that includes a slew of Broadway legends, but also quite a few unexpected show people. There are pop artists like Brandy, Usher and Ashlee Simpson, and actors known better for the screen than the stage, like Pamela Anderson, Melanie Griffith and Sofia Vergara. And then there s a different sort of celebrity altogether: seven Chicago alumni best known from the world of reality television. Soon, a new name will join them under the list of actresses who’ve played Roxie Hart: Reece Weaver, the breakout star of Netflix’s America’s Sweethearts: Dallas Cowboys Cheerleaders . Weaver is the latest example of an approach to casting that Chicago ’s producer team has excelled at perhaps better than any other on the Great White Way, one which has surely contributed significantly to Chicago ’s standing as the longest-running current show on Broadway, and the longest-running American musical, period: “put-in” a star from outside the musical theater world; prove said star can hold their own alongside actual Broadway people; and hopefully, watch ticket sales soar. In recent years, Chicago has taken that mandate one step further with reality stars, mainly “Bravo-lebrities,” along with RuPaul’s Drag Race alum Jinkx Monsoon (as Matron Mama Morton), The Secret Lives of Mormon Wives ’ Whitney Leavitt (whose casting as Roxie yielded the highest grosses the show has seen), and, now, Weaver representing Netflix. The practice has its roots in the mid-90s, when Barry Weissler ( Chicago ’s lead producer with his wife Fran) was working on the revival of Grease and started to realize the potential benefit of casting new faces with established brands (like Brooke Shields, John Stamos and Rosie O’Donnell) in the show. “I think Barry started to realize you can bring in someone that’s at the top of pop culture, or in the cultural zeitgeist, and that can bring people to purchase a ticket — and then they discover all this other Broadway talent surrounding them,” says Brett England, now Weissler’s associate producer on Chicago . Chicago — John Kander and Fred Ebb’s now-iconic musical about two “merry murderesses” who get their 15 minutes of fame in Jazz Age Chicago — was an even more natural fit for celebrity casting, particularly for reality stars. “T", "date_str": "2026-09-24T14:00:00+00:00", "hash": "6a72e837ae574c4e", "title_fa": "چگونه «شیکاگو» واقعیت جدیدی را به برادوی می‌آورد - و از آن پاداش می‌گیرد", "summary_fa": "در کوچه بیرون از تئاتر سفیر برادوی - که اکنون 23 سال است که نمایش موزیکال شیکاگو در آن جا گرفته است - یک «دیوار شهرت» غیررسمی وجود دارد. تزیین آجرهای سفید نام تمام بازیگرانی است که نقش‌های اصلی این نمایش را بازی کرده‌اند، گروهی که شامل تعداد زیادی از افسانه‌های برادوی، و همچنین تعداد کمی از افراد نمایش غیرمنتظره است. هنرمندان پاپ مانند برندی، آشر و اشلی سیمپسون، و بازیگرانی مانند پاملا اندرسون، ملانی گریفیث و سوفیا ورگارا برای نمایش بیشتر از صحنه نمایش شناخته می شوند. و سپس یک نوع متفاوت از سلبریتی وجود دارد: هفت فارغ التحصیل شیکاگو که در دنیای تلویزیون واقعیت شناخته شده است. به زودی، نام جدیدی به آنها در فهرست بازیگرانی که نقش روکسی هارت را بازی کرده‌اند، ملحق می‌شود: ریس ویور، ستاره اصلی سریال دلبران آمریکایی نتفلیکس: دالاس کابوی‌ها Cheerleaders. ویور آخرین نمونه از رویکردی در انتخاب بازیگران است که تیم تهیه کننده شیکاگو در آن شاید بهتر از هر تیم دیگری در Great White Way برتری داشته باشد، رویکردی که مطمئناً نقش مهمی در جایگاه شیکاگو به عنوان طولانی‌ترین نمایش کنونی در برادوی و طولانی‌ترین موزیکال آمریکایی داشته است، دوره: «موسیقی از جهان خارج» ثابت کنید ستاره گفته شده می تواند در کنار مردم واقعی برادوی خود را حفظ کند. و امیدوارم شاهد افزایش فروش بلیط باشید. در سال‌های اخیر، شیکاگو با ستاره‌های رئالیتی، عمدتاً «براو-شاهرات»، همراه با آلوم مسابقه Drag Race، Jinkx Monsoon (در نقش Matron Mama Morton)، The Secret Lives of Mormon Wives «Whitney Levitt» (که بازیگری در نقش Roxie در نقش Roxie نمایش داده می‌شود)، و در حال حاضر بالاترین فیلم را نشان می‌دهد، این دستور را پیش برده است. این رویه ریشه در اواسط دهه 90 دارد، زمانی که بری وایسلر (تهیه کننده اصلی شیکاگو به همراه همسرش فران) روی احیای گریس کار می کرد و شروع"}, {"source": "Billboard", "title": "Tito Double P, Ozuna, Pablo Alborán, Kapo & More to Perform at 2026 Billboard Latin Music Awards", "link": "https://www.billboard.com/music/latin/2026-billboard-latin-music-awards-performers-tito-double-p-1236345616/", "summary": "Billboard and Telemundo have unveiled the first wave of performers set for the 2026 Billboard Latin Music Awards on Oct. 22. Carlos Rivera, Chuyin, Kapo, Manuel Turizo, Melymel, Ozuna, Pablo Alborán, RIZA, Tito Double P, Víctor Manuelle, Xavi and Yahritza y Su Esencia are among the first set of artists to perform at the coveted Latin music gala. Additionally, Carmen Villalobos and Javier Poza return as co-hosts. This year, Peso Pluma leads the list of finalists with 17 entries including Artist of the Year; Top Latin Album of the Year for DINASTÍA with Tito Double P; and Regional Mexican Artist of the Year, Solo. The Música Mexicana star is followed by Tito Double P with 15 mentions, Fuerza Regida with 12, Karol G with nine, Prince Royce with eight, and Bad Bunny with seven. Related Peso Pluma Leads 2026 Billboard Latin Music Awards Finalists: Complete List Grupo Frontera, Santos Bravos, Mau y Ricky, Anuel AA More to Join Billboard Latin Music Week 2026: See the Full Program Rubén Blades to Receive Icon Award at 2026 Billboard Latin Music Awards: No One Succeeds Without Help In addition to its 47 awards categories that span Latin pop, tropical, Latin rhythm and regional Mexican, the awards show will present its honorary awards, including Billboard Vanguard Award, Billboard Lifetime Achievement Award, and Billboard Spirit of Hope Award. The 2026 Billboard Latin Music Awards will broadcast live on Oct. 22 via Telemundo and Peacock from James L. Knight Center in Downtown Miami. It will also be available on Universo and the Telemundo app, as well as throughout Latin America and the Caribbean via Telemundo Internacional. The ceremony also coincides with Billboard Latin Music Week taking place Oct. 19 to Oct. 21 at the Faena Forum in Miami Beach with confirmed speakers Fuerza Regida, Greeicy, Grupo Frontera, Jay Wheeler, Kany García, Maluma, Pitbull, Rawayana, Ryan Castro, Quevedo, Trueno, and many more. For full programming and to to register for Billboard Latin Music Week, click here . Tickets to attend the awards show, can be purchased here .", "date_str": "2026-09-24T13:45:00+00:00", "hash": "fd24c9c67221a2aa", "title_fa": "Tito Double P، Ozuna، Pablo Alboran، Kapo و بیشتر برای اجرای جوایز موسیقی لاتین Billboard 2026", "summary_fa": "بیلبورد و تله‌موندو اولین موج نوازندگانی را که برای جوایز موسیقی لاتین بیلبورد 2026 در 22 اکتبر برگزار می‌شود، رونمایی کردند. کارلوس ریورا، چویین، کاپو، مانوئل توریزو، ملیمل، اوزونا، پابلو آلبوران، RIZA، تیتو دابل پی، ویکتور مانوئل، ژاوی و ژاوی از سوئریتزا از جمله اولین هنرمندانی هستند که در مجموعه سوئریت اجرا می‌کنند. جشن موسیقی لاتین مورد علاقه علاوه بر این، کارمن ویلالوبوس و خاویر پوزا به عنوان میزبان مشترک بازگشتند. امسال، پزو پلوما با 17 اثر از جمله هنرمند سال، در فهرست فینالیست ها پیشتاز است. بهترین آلبوم لاتین سال برای DINASTÍA با Tito Double P. و هنرمند منطقه ای مکزیکی سال، انفرادی. پس از ستاره Música Mexicana، تیتو دابل پی با 15 بار، Fuerza Regida با 12 بار، کارول جی با 9 بار، شاهزاده رویس با 8 بار و Bad Bunny با 7 بار حضور دارند. Peso Pluma مرتبط فینالیست‌های جوایز موسیقی لاتین بیلبورد 2026 پیشتاز شد: فهرست کامل Grupo Frontera، Santos Bravos، Mau y Ricky، Anuel AA موارد بیشتری برای پیوستن به هفته موسیقی لاتین بیلبورد 2026: برنامه کامل Rubén Blades را برای دریافت جایزه آیکون لاتین در سال 2026 مشاهده کنید. 47 دسته جوایز که شامل پاپ لاتین، استوایی، ریتم لاتین و مکزیکی منطقه ای می شود، نمایش جوایز جوایز افتخاری خود را از جمله جایزه پیشتاز بیلبورد، جایزه یک عمر دستاورد بیلبورد و جایزه روح امید بیلبورد ارائه می کند. جوایز موسیقی لاتین بیلبورد 2026 در 22 اکتبر از طریق Telemundo و Peacock از مرکز جیمز ال نایت در مرکز شهر میامی پخش می شود. همچنین در Universo و برنامه Telemundo و همچنین در سراسر آمریکای لاتین و کارائیب از طریق Telemundo Internacional در دسترس خواهد بود. این مراسم همچنین همزمان با هفته موسیقی لاتین بیلبورد است که از 19 اکتبر تا اکتبر برگزار می شود. 21 در انجمن Faena در ساحل میامی با سخنرانان"}, {"source": "Billboard", "title": "KATSEYE’s Movie ‘KATSEYE: WILD HEARTS’ Coming to Disney+ Soon", "link": "https://www.billboard.com/music/pop/katseye-movie-wild-hearts-disney-plus-hulu-release-date-1236346256/", "summary": "If you missed out on seeing KATSEYE on movie screens in their special theatrical release KATSEYE: WILD HEARTS earlier this summer, take heart, you will soon be able to watch all the action again on Disney+. On Wednesday (Sept. 23), Disney+ and Hulu announced that the film will stream on both platforms in the U.S. and on Disney+ internationally beginning on Oct. 16 after hitting the big screen in August. The film dropped two days before the Grammy-nominated girl group released their Billboard 200 No. 1 WILD EP. A synopsis describes the love letter to their beloved fan group EYEKONS as a, captivating journey into the group s bold new era while celebrating the fans who helped make it possible. Featuring never-before-seen footage, EYEKONS fan videos, and intimate interviews from the group members, the film explores the powerful bond between KATSEYE and their global fandom. The film takes EYEKONS on the intense ride singers Daniela Avanzini, Yoonchae, Lara Raj, Megan Skinediel and currently on-hiatus members Manon Bannerman and Sophia Laforteza have been on since their formation on the 2023 reality TV competition series Dream Academy — later the subject of the Netflix series Pop Star Academy: Katseye — through to their chart-topping global success. It was directed by Nadia Hallgren ( Becoming ) and produced by Interscope Films and Boardwalk Pictures, in partnership with HYBE x Geffen. KATSEYE kicked off a European run of shows on their Wildworld tour on Sept. 1 in Dublin, Ireland and dates are slated to pick up again in North America on Oct. 13 at Kaseya Center in Miami, Fla.", "date_str": "2026-09-24T13:10:32+00:00", "hash": "f541e073cacb7f14", "title_fa": "فیلم KATSEYE 'KATSEYE: WILD HEARTS' به زودی به دیزنی + عرضه می شود", "summary_fa": "اگر در اوایل تابستان امسال کاتسی را روی پرده‌های فیلم در اکران ویژه‌شان در سینمای KATSEYE: WILD HEARTS از دست دادید، دل‌تان را بخرید، به‌زودی می‌توانید دوباره همه اکشن‌ها را در دیزنی پلاس تماشا کنید. روز چهارشنبه (23 سپتامبر)، Disney+ و Hulu اعلام کردند که این فیلم در هر دو پلتفرم در ایالات متحده و دیزنی پلاس در سطح بین‌المللی از تاریخ 16 اکتبر پس از اکران در ماه آگوست به نمایش در خواهد آمد. این فیلم دو روز قبل از اینکه گروه دختر نامزد جایزه گرمی EP WILD شماره 1 بیلبورد 200 خود را منتشر کند پخش شد. خلاصه داستان نامه عاشقانه به گروه هواداران محبوبشان EYEKONS را به عنوان یک سفر جذاب به عصر جدید جسورانه گروه توصیف می کند و در عین حال از طرفدارانی که در ایجاد آن کمک کردند تجلیل می شود. این فیلم با فیلم‌هایی که قبلاً دیده نشده بود، ویدیوهای طرفداران EYEKONS و مصاحبه‌های صمیمی اعضای گروه، پیوند قدرتمند بین KATSEYE و طرفداران جهانی آن‌ها را بررسی می‌کند. این فیلم EYEKONS را بر روی خوانندگان سواری شدید دانیلا آوانزینی، یونچا، لارا راج، مگان اسکیندیل و اعضایی که در حال حاضر در حال وقفه هستند، Manon Bannerman و Sophia Laforteza از زمان شکل‌گیری آن‌ها در سریال مسابقه تلویزیونی واقعیت 2023 رویا آکادمی - که بعدها موضوع نمودار نتفلیکس-سریال نتفلیکس پاپ استار آکادمی تا موفقیت جهانی آن‌ها بود. این فیلم توسط نادیا هالگرن (شدن) کارگردانی شد و توسط Interscope Films و Boardwalk Pictures با همکاری HYBE x Geffen تهیه شد. KATSEYE در تور Wildworld خود در 1 سپتامبر در دوبلین، ایرلند، برنامه های اروپایی را آغاز کرد و قرار است در 13 اکتبر دوباره در آمریکای شمالی در مرکز Kaseya در میامی، فلوریدا اجرا شود. آدرس ایمیل شما منتشر نخواهد شد. فیلدهای الزامی علامت گذاری شده اند *"}, {"source": "Billboard", "title": "This Bose x Thom Browne Collab Features One of the Audio Brand’s Most Luxurious Headphones Yet", "link": "https://www.billboard.com/culture/product-recommendations/bose-thom-browne-stylish-headphones-price-shop-online-1236345996/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Are headphones the new fashion accessory? Bose seems to think so. The audio brand and Thom Browne are giving the humble listening accessory a decidedly couture makeover with the Bose x Thom Browne QuietComfort Ultra Headphones (2nd Gen) , a $950 collaboration that puts luxury materials and fashion firmly in the foreground. The headphones first appeared on the runway at Thom Browne’s Fall 2026 show at San Francisco’s Legion of Honor on Feb. 6, during the designer’s GQ Bowl presentation ahead of Super Bowl LX. Models carried and wore the over-the-ear headphones alongside Browne’s signature tailoring, immediately turning a familiar piece of tech into part of the collection’s visual aesthetic. Now, the runway curiosity is becoming a retail reality. Available for preorder Sept. 24 ahead of its Sept. 28 launch, the collaboration channels Browne’s iconic gray suit through cashmere-coated details, four-bar branding, a compact cashmere case and the designer s signature red, white and blue stripe. IMMERSIVE AUDIO Bose x Thom Browne QuietComfort Ultra Headphones (2nd Gen) Preorder $950 Buy Now at Bose Underneath all that cashmere is a genuine Bose flagship. The Thom Browne edition uses the QuietComfort Ultra Headphones (2nd Gen), which Bose introduced as a new generation in 2025, with upgraded noise cancellation , lossless USB-C audio, longer battery life and improved processing. It also brings Bose Immersive Audio plus the newer Cinema Mode, which creates a more spacious soundstage for movies and video. The headphones support phone calls through built-in microphones with background-noise reduction, while battery life reaches up to 30 hours, or 23 hours with Immersive Audio enabled. Robbie Lawrence What makes the Thom Browne version different is less about reinventing Bose’s audio technology and more about reframing it. The performance features are already part of Bose’s latest QuietComfort Ultra Headphones (2nd Gen), but Browne transforms the hardware into something of a tailored suit. In that sense, the collaboration makes a familiar piece of audio gear feel less like an electronic device and more like a deliberate fashion accessory.", "date_str": "2026-09-24T13:00:00+00:00", "hash": "6236556d9a7ece8e", "title_fa": "این Bose x Thom Browne Collab دارای یکی از مجلل ترین هدفون های برند صوتی تاکنون است.", "summary_fa": "همه محصولات و خدمات ارائه شده به طور مستقل توسط ویراستاران انتخاب می شوند. با این حال، بیلبورد ممکن است برای سفارش‌هایی که از طریق پیوندهای خرده‌فروشی‌اش ارسال می‌شود، کمیسیون دریافت کند و خرده‌فروش ممکن است داده‌های قابل حسابرسی خاصی را برای اهداف حسابداری دریافت کند. آیا هدفون لوازم جانبی مد جدید است؟ به نظر می رسد بوز اینطور فکر می کند. برند صوتی و Thom Browne با هدفون Bose x Thom Browne QuietComfort Ultra (نسل دوم) به لوازم جانبی گوش دادن متواضع ظاهری کاملاً مد می‌دهند، یک همکاری 950 دلاری که مواد لوکس و مد را محکم در پیش‌زمینه قرار می‌دهد. این هدفون اولین بار در نمایشگاه پاییز 2026 تام براون در لژیون افتخار سانفرانسیسکو در 6 فوریه، در جریان ارائه GQ Bowl طراح قبل از Super Bowl LX، روی باند فرودگاه ظاهر شد. مدل‌ها هدفون‌های روگوشی را در کنار خیاطی با امضای براون حمل می‌کردند و می‌پوشیدند و بلافاصله یک فناوری آشنا را به بخشی از زیبایی‌شناسی بصری مجموعه تبدیل می‌کردند. اکنون، کنجکاوی باند در حال تبدیل شدن به یک واقعیت خرده فروشی است. این کانال برای پیش‌سفارش در 24 سپتامبر قبل از عرضه در 28 سپتامبر، کت و شلوار خاکستری نمادین براون را از طریق جزئیات روکش‌شده از ترمه، مارک چهار میله‌ای، جعبه ترمه جمع‌وجور و خطوط قرمز، سفید و آبی امضای طراح ارائه می‌کند. هدفون IMMERSIVE AUDIO Bose x Thom Browne QuietComfort Ultra (نسل دوم) پیش‌سفارش 950 دلاری اکنون در Bose خرید کنید. نسخه Thom Browne از هدفون QuietComfort Ultra (نسل دوم) استفاده می کند که بوز به عنوان نسل جدیدی در سال 2025 معرفی کرد، با قابلیت حذف نویز ارتقا یافته، صدای USB-C بدون اتلاف، عمر باتری بیشتر و پردازش بهبودیافته. همچنین Bose Immersive Audio را به همراه حالت سینمای جدیدتر ارائه می‌کند که صحنه‌های صوتی وسیع‌تری را برای فیلم‌ها و ویدیوها ایجاد می‌کند. این"}, {"source": "Billboard", "title": "Spotify’s ‘Reserved’ Concert Ticket Feature Now Includes Setlists, Share Cards & More", "link": "https://www.billboard.com/pro/spotify-concert-ticket-feature-reserved-setlists/", "summary": "Four months after Spotify global head of music Charlie Hellman announced the launch of the streamer s ticketing initiative Reserved, the company has unveiled a trio of new features. First announced on May 21 at Spotify s 2026 Investor Day, Reserved identifies an artist s most dedicated fans on the platform (determined by streams, saves and shares) and then holds two tickets for those fans (provided they re Premium subscribers) when the artist announces a tour. In an interview with Billboard following the announcement, Hellman said the initiative would represent a huge change from the level of stress that fans typically experience when buying concert tickets. Over the summer, the streaming service experimented with the feature on several Live Nation tours across the U.S., though Hellman noted the company would be scaling the initiative to additional promoters throughout the year. Related Spotify s Head of Music Announces Reserved Ticketing Initiative: As AI Proliferates, Real World Experiences Mean That Much More Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction On Thursday (Sept. 24), Spotify revealed three additional Reserved features. They include a pair of personalized share cards that users can text to friends and/or share on social media — one when they re selected for a Reserved offer and another after they buy tickets using the feature. Each share card shows the name of the artist, details of the show and Reserved badging, according to a blog post announcing the new features. The second feature unveiled on Thursday is the addition of dedicated tour setlists for users who purchase tickets using Reserved. Those setlists, sourced from setlist.fm, will populate on the user s event page so they can get a sense of what songs they might hear at the show. Setlist playlists will update after every show, while the setlist on the user s event page will reflect the songs played at the particular concert they attended. Lastly, Spotify revealed what the blog post calls an enhanced in-app destination — essentially a central hub for all of a user s Reserved content, including share cards, pre- and post-show setlists, key event details, venue information and past performances. The new features are set to begin rolling out on Thursday (Sept. 24). Setlists will be available for participating artist tours as soon as they kick off, including Miley, Role Model, beabadoobee, J", "date_str": "2026-09-24T13:00:00+00:00", "hash": "2e7489a9a9e2ce74", "title_fa": "ویژگی بلیت کنسرت «رزرو شده» Spotify اکنون شامل لیست‌های مجموعه، کارت‌های اشتراک‌گذاری و موارد دیگر می‌شود", "summary_fa": "چهار ماه پس از اینکه چارلی هلمن، رئیس موسیقی جهانی اسپاتیفای از راه‌اندازی ابتکار تهیه بلیط استریمر Reserved خبر داد، این شرکت از سه ویژگی جدید رونمایی کرد. اولین بار در 21 مه در روز سرمایه‌گذار Spotify در سال 2026 اعلام شد، Reserved فداکارترین طرفداران یک هنرمند را در پلتفرم شناسایی می‌کند (که توسط جریان‌ها، ذخیره‌ها و اشتراک‌گذاری‌ها مشخص می‌شوند) و سپس دو بلیط برای آن طرفداران نگه می‌دارد (به شرطی که آنها مشترک Premium باشند) وقتی هنرمند توری را اعلام می‌کند. هلمن در مصاحبه ای با بیلبورد پس از اعلام این خبر گفت که این ابتکار نشان دهنده تغییر بزرگی نسبت به سطح استرسی است که طرفداران معمولاً هنگام خرید بلیط کنسرت تجربه می کنند. در طول تابستان، این سرویس استریم این ویژگی را در چندین تور Live Nation در سراسر ایالات متحده آزمایش کرد، اگرچه هلمن خاطرنشان کرد که این شرکت در طول سال ابتکار عمل را برای تبلیغ‌کنندگان بیشتری افزایش خواهد داد. رئیس بخش موسیقی مرتبط Spotify ابتکار رزرو بلیط را اعلام کرد: با افزایش هوش مصنوعی، تجربیات دنیای واقعی به این معناست که بیلبوردهای بیشتری برای افزودن آلبوم‌های رسانه هوشمند به عنوان فرمت‌های فروش واجد شرایط نمودار، Duane Keffe D Davis اولین مصاحبه را بعد از Tupac Shakur Murder Conviction در روز پنجشنبه منتشر کرد. این کارت‌ها شامل یک جفت کارت اشتراک‌گذاری شخصی‌شده است که کاربران می‌توانند به دوستانشان پیامک بدهند و/یا در رسانه‌های اجتماعی به اشتراک بگذارند – یکی زمانی که برای پیشنهاد رزرو شده انتخاب می‌شوند و دیگری پس از خرید بلیط با استفاده از این ویژگی. طبق یک پست وبلاگی که ویژگی های جدید را اعلام می کند، هر کارت اشتراک نام هنرمند، جزئیات نمایش و نشان رزرو شده را نشان می دهد. دومین ویژگی که در روز پنجشنبه رونمایی شد، افزودن لیست های اختصاصی تور برای کاربرانی است که با استفاده از"}, {"source": "Billboard", "title": "Enigmatic Preview of Taylor Swift’s ‘Patient Zero’ Video Teases Two Major Hollywood Co-Stars, Death in the Family", "link": "https://www.billboard.com/music/pop/preview-taylor-swift-patient-zero-video-dakota-johnson-farrell-1236346258/", "summary": "With less than one sleep left before Taylor Swift unveils her new single, Patient Zero , Swifties got a 13-second preview of the dramatic video for the song on Thursday morning (Sept. 24). The brief clip that spawned more questions than answers premiered on CBS Mornings and Swift s Instagram feed, revealing a pair of Hollywood stars at its center. The video preview opens with a mirror image of Swift — in a white tank and gray shorts — turning on the water faucet in a dimly lit, industrial-looking bathroom before quickly cutting to footage of two women diving into a pool trailed by a swarm of bubbles. A long shot from behind then reveals what appears to be two female figures flanking a male statue, also in a gray-and-white concrete space and then a pair of black roses placed on a snow-covered headstone. In keeping with the enigmatic sneak peek whose running time in, naturally, Swift s favorite number, the final image is of two female figures in long black coats — again seen only from behind — standing in front of the grave in a snowy cemetery, with the one that appears to be Swift comforting the other as they look at a headstone that reads 1989-2022, Gone too Soon, with the word daughter visible, but the name obscured. There is a final, brief glimpse of a stricken-looking Swift slowly turning her head, with the singer s 10-carat engagement ring on full display. It ends with the credits, which lists Swift as its star, of course, along with Colin Farrell and Dakota Johnson. While no lyrics are heard in the preview, it is soundtracked by a lilting, Irish folk music-tinged instrumental. The final images include Farrell emerging from a luxury sedan at night and Johnson looking haunted at what appears to be a party and then all three, dressed in all black, in a lounge. Swift may have hinted at Johnson s involvement in the video during her surprise Emmy s pop-in last week in in a Law Order: Special Victims Unit sketch, in which her Det. Olivia Benson dropped a cryptic string of clues that sent Swifties into Easter egg hunt overdrive. The final clue, North or South, may have been a tip-off to Johnson, whose first name can be paired with the directional clues to unveil North and South Dakota. The Farrell and Johnson cameos are not the first time major Hollywood stars have turned up in a Swift music video. They follow on the heels of Domhnall Gleeson, Jodie Turner-Smith and Greta Lee in video for the Billboard Hot 100 No. 1 Showgirl hit Opalite, as well as Josh Charl", "date_str": "2026-09-24T12:38:57+00:00", "hash": "ff27bd22fab99517", "title_fa": "پیش‌نمایش مرموز ویدیوی «بیمار صفر» تیلور سوئیفت، دو همبازی بزرگ هالیوود، مرگ در خانواده را اذیت می‌کند.", "summary_fa": "در حالی که کمتر از یک خواب باقی مانده تا تیلور سویفت از تک آهنگ جدید خود به نام Patient Zero پرده برداری کند، سوئیفتیس صبح روز پنجشنبه (24 سپتامبر) پیش نمایشی 13 ثانیه ای از ویدیوی دراماتیک این آهنگ دریافت کرد. کلیپ کوتاهی که سوالات بیشتری نسبت به پاسخ ها ایجاد کرد، برای اولین بار در CBS Mornings و فید اینستاگرام سوئیفت پخش شد و یک جفت ستاره هالیوود را در مرکز خود نشان داد. پیش‌نمایش ویدیو با تصویر آینه‌ای از سویفت - با مخزن سفید و شورت خاکستری - شروع می‌شود که شیر آب را در حمامی کم‌نور و صنعتی باز می‌کند و به سرعت به فیلم شیرجه دو زن در استخری می‌پردازد که توسط انبوهی از حباب‌ها دنبال می‌شود. سپس یک عکس بلند از پشت نشان می‌دهد که به نظر می‌رسد دو پیکره زن در کنار یک مجسمه مرد، همچنین در یک فضای بتونی خاکستری و سفید و سپس یک جفت گل رز سیاه روی یک سنگ قبر پوشیده از برف قرار گرفته‌اند. مطابق با نگاه مرموز و مرموز که به طور طبیعی، زمان اجرای آن در شماره مورد علاقه سوئیفت است، تصویر نهایی دو چهره زن با کت‌های سیاه بلند است - که دوباره فقط از پشت دیده می‌شود - در قبرستانی برفی در مقابل قبر ایستاده‌اند، در حالی که به نظر می‌رسد سوئیفت به سنگ قبر دیگری نگاه می‌کند که عبارت دختر را 1989 می‌خواند. نام مبهم است یک نگاه کوتاه و نهایی از سویفتی که به‌نظر می‌رسد آهسته سرش را می‌چرخاند، با حلقه نامزدی 10 قیراطی این خواننده در نمایش کامل وجود دارد. با تیتراژ پایان می‌یابد، که البته سوئیفت را در کنار کالین فارل و داکوتا جانسون به عنوان ستاره‌اش معرفی می‌کند. در حالی که هیچ شعری در پیش‌نمایش شنیده نمی‌شود، موسیقی متن آن توسط یک ساز روشن و با رنگ موسیقی محلی"}, {"source": "Billboard", "title": "New Found Glory to Honor Late Guitarist Chad Gilbert During Shows at His Happiest Place on Earth", "link": "https://www.billboard.com/music/rock/new-found-glory-honor-chad-gilbert-shows-epcot-setlists-1236346252/", "summary": "New Found Glory will pay tribute to late guitarist Chad Gilbert with a series of shows at his favorite place on Earth. In an Instagram post on Wednesday (Sept. 23), the group announced that following Gilbert s death at 45 on Sunday (Sept. 20) after a long battle with cancer they will honor him by returning to the stage at EPCOT at the Disney World Resort in Orlando, Fla. during the upcoming Eat to the Beat Concert series. First off, we want to thank everyone for the overwhelming amount of love and tribute posts for Chad these past few days, they wrote in the post . Seeing how deeply he touched so many lives means everything to us, and we know he would be so proud to see it. As they process the loss of their longtime friend and bandmate, the group said they were canceling their planned appearance at the Aftershock Festival (Oct.1-4) in Sacramento in order to pay proper tribute to Disney superfan Gilbert at his happiest place on Earth. We rarely cancel shows but this felt needed, they wrote. Anyone who knew Chad knew that he was a massive Disney fan. Our shows at Epcot were dates he was so excited for and he was actively planning to be on stage with us there. He had already worked on the setlists with us and was practicing as much as possible to be ready. Because of how much he wanted to play these shows, taking the stage at Epcot feels like the right way to honor him, and what he would want us to do. Before Gilbert s death, their plan was to announce the setlist for the Epcot shows ahead of time, which is why they posted it in their Insta announcement. Every note we play and every word you sing at Epcot is for Chad, they said. Thank you all for wrapping us in so much love, understanding, and support as we come together to honor his legacy. NFG will play six different sets during their two-day run at EPCOT on Monday (Sept. 28) and Tuesday (Sept. 29) and perform such fan favorites as Something I Call Personality, All About Her, A Love Song, Failure s Not Flattering, Dressed to Kill, My Friends Over You, Hit or Miss, All Downhill From Here, Better Off Dead and All Downhill From Here, among others. Bands play three sets a night during the EPCOT International Food Wine Festival, which will also feature upcoming sets from Element and Smash Mouth, after earlier appearances from The War and Treaty, Yellowcard, Couch, Fitz and the Tantrums, MercyMe and Grupo Manía. Gilbert s wife, Lisa Cimorelli, announced the guitarist s death over the weekend, six months after the", "date_str": "2026-09-24T11:59:08+00:00", "hash": "eaee799618e2746f", "title_fa": "افتخار جدید برای تجلیل از گیتاریست فقید چاد گیلبرت در طول نمایش در شادترین مکان او روی زمین", "summary_fa": "New Found Glory به گیتاریست فقید چاد گیلبرت با مجموعه‌ای از نمایش‌ها در مکان مورد علاقه‌اش در زمین ادای احترام خواهد کرد. در یک پست اینستاگرامی در روز چهارشنبه (23 سپتامبر)، این گروه اعلام کرد که پس از مرگ گیلبرت در 45 سالگی در روز یکشنبه (20 سپتامبر) پس از یک مبارزه طولانی با سرطان، او را با بازگشت به صحنه در EPCOT در Disney World Resort در اورلاندو، فلوریدا در طول سری آتی Eat to the Beat Concert تجلیل خواهند کرد. آنها در این پست نوشتند، ابتدا می خواهیم از همه به خاطر پست های محبت آمیز و ادای احترام زیادی که در چند روز گذشته برای چاد ارسال کردند تشکر کنیم. دیدن اینکه او چقدر زندگی‌های بسیاری را تحت تأثیر قرار داده است برای ما همه چیز دارد و می‌دانیم که او از دیدن آن بسیار افتخار می‌کند. در حالی که آنها از دست دادن دوست و هم گروه قدیمی خود را بررسی می کنند، گروه اعلام کردند که حضور برنامه ریزی شده خود در جشنواره پس لرزه (1-4 اکتبر) در ساکرامنتو را لغو می کنند تا ادای احترام مناسبی به گیلبرت فوق فن دیزنی در شادترین مکان او روی زمین داشته باشند. آنها نوشتند که ما به ندرت برنامه‌ها را لغو می‌کنیم، اما این احساس نیاز است. هر کسی که چاد را می‌شناخت می‌دانست که او از طرفداران پرشور دیزنی است. نمایش های ما در Epcot تاریخ هایی بود که او برای آن بسیار هیجان زده بود و او به طور فعال برنامه ریزی می کرد که در آنجا با ما روی صحنه باشد. او قبلاً روی ست لیست ها با ما کار کرده بود و تا حد امکان تمرین می کرد تا آماده باشد. به دلیل اینکه چقدر او می‌خواست این نمایش‌ها را بازی کند، روی صحنه رفتن در Epcot احساس می‌کند راه درستی برای بزرگداشت"}, {"source": "Billboard", "title": "Ex-AFA CEO Olly Arkins Appointed Deputy Lord Mayor of Sydney", "link": "https://www.billboard.com/pro/ex-afa-ceo-olly-arkins-voted-deputy-lord-mayor-sydney/", "summary": "SYDNEY, Australia Olly Arkins , former chief executive officer of the Australian Festival Association , is the new deputy lord mayor for the City of Sydney. Arkins was this week unanimously voted to the role, two years after being elected to the City of Sydney Council. And with the latest appointment, Arkins becomes the first openly trans deputy mayor of Australia’s most populous city. “I ran for Council because I have lived in Sydney at its best; fun, welcoming, diverse and affordable. I have also lived it at its worst; lockout laws, eye-watering rents and policing policies that attempted to put music festivals out of business,” she said in a statement to the Australian Broadcasting Corporation. “I’m ready to get to work on making Sydney a city that’s easy and enjoyable to live in, and one people around the world are desperate to visit.” A lifelong Sydneysider, Arkins’ work has included advocating for special entertainment precincts, investing in affordable housing, supporting the city s LGBTQIA+ community, and backing such landmark events as Yabun and Mardi Gras. Arkins exited the AFA last month , ending an impactful five-year stint with the association. Speaking with Billboard , Arkins identified the opportunity to rewrite the Music Festivals Act in New South Wales, resulting in significant reforms passed by the state parliament in September 2024, as her “biggest achievement” with the AFA. While leading the trade body, Arkins advocated for the federal government to establish and then increase Revive Live funding, including dedicated support for music festivals; helped secure the introduction of drug-checking services at music festivals in both Victoria and New South Wales; renegotiated the OneMusic licence scheme to secure improved terms for music festivals; and more. She also serves as deputy chair of the cultural, creative and nightlife committee, and co-chair of the creative and nightlife advisory panel, and is a board member of local government New South Wales. Two years ago, in September 2024, Arkins proudly became the first trans councillor to be elected to the City of Sydney.", "date_str": "2026-09-24T09:31:22+00:00", "hash": "85c77ea3cc4c869d", "title_fa": "اولی آرکینز، مدیر عامل سابق AFA به عنوان معاون شهردار سیدنی منصوب شد", "summary_fa": "سیدنی، استرالیا اولی آرکینز، مدیر اجرایی سابق انجمن جشنواره استرالیا، معاون جدید شهردار شهر سیدنی است. آرکینز این هفته، دو سال پس از انتخاب شدن به عضویت شورای شهر سیدنی، به اتفاق آرا به این نقش رای داده شد. و با آخرین انتصاب، آرکینز اولین معاون شهردار ترنس پرجمعیت ترین شهر استرالیا می شود. «من برای شورای شهر کاندید شدم زیرا در بهترین حالت خود در سیدنی زندگی کرده‌ام؛ سرگرم کننده، خوش‌آمد، متنوع و مقرون به صرفه. من نیز آن را در بدترین حالت خود زندگی کرده ام. او در بیانیه‌ای به شرکت پخش استرالیایی گفت: قوانین قفل، اجاره‌های چشمگیر و سیاست‌های پلیسی که سعی در از بین بردن جشنواره‌های موسیقی داشتند. من آماده‌ام برای ساختن سیدنی شهری که زندگی در آن آسان و لذت‌بخش باشد و مردمی در سرتاسر جهان به شدت از آن دیدن کنند، کار کنم.» کار آرکینز که یک شهروند مادام العمر در سیدنی بود، شامل حمایت از مناطق ویژه سرگرمی، سرمایه گذاری در مسکن مقرون به صرفه، حمایت از جامعه LGBTQIA+ شهر و حمایت از رویدادهای شاخصی مانند Yabun و Mardi Gras است. آرکینز ماه گذشته از AFA خارج شد و به فعالیت پنج ساله تاثیرگذار این انجمن پایان داد. در صحبت با بیلبورد، آرکینز فرصت بازنویسی قانون جشنواره های موسیقی در نیو ساوت ولز را که منجر به اصلاحات قابل توجهی در پارلمان ایالتی در سپتامبر 2024 شد، به عنوان \"بزرگترین دستاورد\" خود با AFA شناسایی کرد. آرکینز در حالی که رهبری سازمان تجاری را بر عهده داشت، از دولت فدرال برای ایجاد و سپس افزایش بودجه Revive Live، از جمله حمایت اختصاصی از جشنواره‌های موسیقی، حمایت کرد. به ارائه خدمات کنترل مواد مخدر در جشنواره های موسیقی در ویکتوریا و نیو ساوت ولز کمک کرد. برای تضمین شرایط بهبود یافته برای جشنواره های موسیقی، طرح مجوز OneMusic را مجدداً مذاکره کرد. و بیشتر"}, {"source": "Deadline", "title": "‘The Girl With The Dragon Tattoo’: David Oyelowo & Viola Prettejohn Cast As Leads In Sky’s TV Reimagining", "link": "https://deadline.com/2026/09/girl-with-the-dragon-tattoo-david-oyelowo-viola-prettejohn-1237112372/", "summary": "EXCLUSIVE: Sky has found its Mikael Blomkvist and Lisbeth Salander for the network s upcoming TV adaptation of Stieg Larsson s The Girl with the Dragon Tattoo. David Oyelowo (Silo) and rising star Viola Prettejohn (The Crown) will play the leads in Sony Pictures Television and Left Bank Pictures’ splashy adaptation, which comes around 15 years after [ ]", "date_str": "2026-09-24T14:30:00+00:00", "hash": "c92870b346079223", "title_fa": "\"دختری با خالکوبی اژدها\": دیوید اویلوو و ویولا پرتژون به عنوان بازیگران نقش اول در بازسازی تلویزیون اسکای", "summary_fa": "اختصاصی: Sky Mikael Blomkvist و Lisbeth Salander خود را برای اقتباس تلویزیونی آینده شبکه از The Girl with the Dragon Tattoo اثر استیگ لارسون پیدا کرده است. دیوید اویلوو (سیلو) و ستاره در حال ظهور ویولا پرتژون (تاج) نقش اصلی را در تلویزیون سونی پیکچرز و اقتباس پرشور Left Bank Pictures بازی خواهند کرد که حدو س سیتی چیفز برای پخش تیزر تریلر فیلم بیوگرافی Madden، دیوید او. راسل از مربی فوتبال تالار مشاهیر، تحلیلگر تلویزیونی و نماد برند بازی های ویدیویی جان مدن استفاده کرد. پخش کننده در نظر دارد عکس را در روز شکرگزاری 2026 منتشر کند، با توجه به اینکه مدن و شریک CBS او پت سامرال بودند که کمک کردند بازی NFL روز شکرگزاری در خانه ها اصلی شود (که قبل از مدن نام turducken را شنیده بود؟) نیکلاس کیج نقش مدن را بازی می کند، دای، مربی ماهر و جوشان آل رادیو، مربی صاحب نامشخص آل وییس. به یک پیروزی بعید در سوپر بول 1977. راسل از آنجا شروع می‌کند و مسیر بعید را ترسیم می‌کند که مدن را از حواشی NFL گرفته تا به نوعی تبدیل به مغز و برندی شود که در پشت بازی Madden NFL قرار دارد، چیزی که به یکی از پرفروش‌ترین فرنچایزهای بازی‌های ویدیویی در تمام دوران تبدیل می‌شود. آن همکاری با EA Sports (جان مولانی در نقش تریپ هاوکینز، بنیانگذار EA) نقطه ورود به حرفه پخش NFL مدن بود. فقط یک جان مدن وجود دارد. آنها یکی دیگر نساختند، دیویس کریستین بیل در تیزر غرغر می کند. فوتبال بدون او فوتبال نخواهد بود."}, {"source": "Deadline", "title": "Kristen Bell & Adam Brody Are Living Under The Same Roof In ‘Nobody Wants This’ Season 3 Trailer", "link": "https://deadline.com/2026/09/nobody-wants-this-season-3-trailer-kristen-bell-adam-brody-1237112084/", "summary": "Netflix has dropped the first trailer for Season 3 of Nobody Wants This, which finds Joanne (Kristen Bell) and Noah (Adam Brody) both enamored with the fact that they re now living together. We also get a quick glimpse at series creator Erin Foster, who spills a drink on Adam. It s her first on-screen appearance in [ ]", "date_str": "2026-09-24T14:00:00+00:00", "hash": "90b44d9d7f9893fd", "title_fa": "کریستن بل و آدام برودی در تریلر فصل سوم «Nobody Wants This» زیر یک سقف زندگی می کنند", "summary_fa": "نتفلیکس اولین تریلر فصل 3 Nobody Wants This را منتشر کرده است که جوآن (کریستن بل) و نوح (آدام برودی) هر دو شیفته این واقعیت هستند که اکنون با هم زندگی می کنند. ما همچنین نگاهی اجمالی به خالق سریال ارین فاستر داریم که نوشیدنی را روی آدام می ریزد. این اولین حضور مه می دهد. رسانه ها به دنبال شنیدن جدید هستند", "summary_fa": "به روز شده: کاخ سفید به محرومیت از دسترسی به خبرنگاران برای CNN، Politico و MS NOW ادامه داده است، حتی پس از اینکه یک قاضی علیه ممنوعیت دونالد ترامپ حکم داد و اعتبارنامه باید بازگردانده شود. بتسی کلاین، خبرنگار سی ان ان گزارش داد که هنوز به او اجازه دسترسی به محوطه داده نمی شد، و از خارج از قاضی ناحیه سفید [ ] ایالات متحده، تیموتی کلی، در حکمی که یک شبه صادر شد، دستور منع موقت صادر کرد که مستلزم بازگرداندن دسترسی است. او به این نتیجه رسید که این رسانه ها از رسیدگی عادلانه محروم شده اند، اما همچنین نشان داد که شاکیان رسانه احتمالاً در ادعاهای اصلاحیه پنجم خود موفق خواهند شد. این دستور به مدت 14 روز ادامه دارد زیرا او استدلال های حقوقی بیشتری را بررسی می کند. تا صبح پنجشنبه، هنوز استخر تلویزیونی برای پوشش مراسم رئیس جمهور و بانوی اول برای استقبال از شی جین پینگ رئیس جمهور چین و همسرش پنگ لیوان وجود نداشت. پس از حذف سی‌ان‌ان از وظایف استخر خود در روز دوشنبه، چهار شبکه دیگر در استخر تلویزیون اعلام کردند که در چرخش شرکت نخواهند کرد. در ددلاین تماشا کنید تئودور بوتروس جونیور، وکیل اصلی که نماینده شبکه‌ها است، خاطرنشان کرد که ادامه انکار اعتبارنامه در تشکیل پرونده به قاضی در روز پنجشنبه. او نوشت که زمان بسیار مهم است که قرار است سی ان ان امروز عصر به عنوان استخر تلویزیونی برای دیدار رئیس جمهور شی جین پینگ از کاخ سفید باشد. بوتروس نوشت که متهمان قبلاً بارها دستور دادگاه را نقض کرده اند. او برای یک ویدئو یا کنفرانس تلفنی در صبح پنجشنبه فراخوان داد. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت"}, {"source": "Deadline", "title": "Thriller ‘Sender’, Starring Britt Lower, Rhea Seehorn, David Dastmalchian & Jamie Lee Curtis, Gets U.S. Deal", "link": "https://deadline.com/2026/09/sender-britt-lower-jamie-lee-curtis-us-deal-dark-sky-1237111448/", "summary": "EXCLUSIVE: Dark Sky Films has acquired U.S. distribution rights to Sender, the psychological thriller from writer-director Russell Goldman, starring Britt Lower, Rhea Seehorn, Anna Baryshnikov, David Dastmalchian, Utkarsh Ambudkar, and Jamie Lee Curtis, who also produces. Following a festival run that began with its world premiere in Narrative Feature Competition at SXSW, Dark Sky Films [ ]", "date_str": "2026-09-24T13:38:26+00:00", "hash": "346852d417f04405", "title_fa": "فیلم هیجان‌انگیز «فرستنده» با بازی بریت لوور، ریا سیهورن، دیوید دستمالچیان و جیمی لی کرتیس، با آمریکا قرارداد می‌گیرد.", "summary_fa": "اختصاصی: Dark Sky Films حق پخش در ایالات متحده را برای Sender، فیلم هیجانی روانشناختی راسل گلدمن، نویسنده و کارگردان، با بازی بریت لوور، ریا سیهورن، آنا باریشنیکوف، دیوید دستمالچیان، اوتکارش آمبودکار، و جیمی لی کرتیس که تهیه کننده نیز می باشد، به دست آورده است. پس از برگزاری جشنواره ای که با اولین نمایش جهانی خود در مسابقه داستانی داستانی در SXSW آغاز شد، Dark Sky Films [ ] انحصاری: Dark Sky Films ایالات متحده را تصاحب کرد. حق پخش Sender، فیلم هیجان‌انگیز روان‌شناختی راسل گلدمن، نویسنده و کارگردان، با بازی بریت لوور، ریا سیهورن، آنا باریشنیکوف، دیوید دستمالچیان، اوتکارش آمبودکار، و جیمی لی کرتیس که تهیه‌کنندگی نیز دارد. این خرید پیش از نمایش Senders s لس آنجلس در Beyond Fest و اولین نمایش اروپایی در پنجاه و نهمین جشنواره بین المللی فیلم فوق العاده Sitges انجام می شود. پس از اولین نمایش خود در SXSW، این فیلم به عنوان نمایشی در جشنواره بین المللی فیلم سانفرانسیسکو انتخاب شد و جوایز هیئت داوران را برای بهترین فیلم در جشنواره فیلم Sidewalk و جشنواره فیلم Chattanooga دریافت کرد. داستان‌های مرتبط نظرات نقد فرستنده: بریت لوور استارها در فیلم هیجان‌انگیز روان‌شناختی هیجان‌انگیزتر از جدایی - SXSW بازیگران بریت لوور تو تا لاین فیلم ترسناک روان‌شناختی فرستنده فیلم ترسناک روان‌شناختی تهیه‌شده توسط جیمی لی کرتیس توافقنامه توزیع توسط گرگ نیومن، رئیس تهیه‌کننده فیلم، دارک اسکای و وینسکیس مذاکره شد. مولی هالام و راسل گلدمن نویسنده و کارگردان به نمایندگی از فیلمسازان. مت شردر از Concourse Media فروش بین المللی را انجام می دهد. در Deadline In Sender تماشا کنید، Lower در نقش جولیا، زنی که اخیرا هوشیار و بیکار است، تلاش می کند تا زن ilm the best is. Simply the best. Best of the Best. Best of the Best is the best op Netflix Jawel, het gaat dus om Best of the Best, dat aan kop gaat in de top 10 op Netflix. Vóór Superman. Vóór The Whisper Man. En wereldwijd is deze dansfilm al 4,3 miljoen keer bekeken! Best of the Best is een nieuwe Netflix-komedie over Maya en Anjali, twee jeugdvriendinnen die samen gaan studeren aan UCLA. Ze kennen elkaar al vrijwel hun hele leven en beginnen vol enthousiasme aan een nieuwe fase, maar hun vriendschap wordt flink op de proef gesteld wanneer ze terechtkomen in de bijzonder competitieve wereld van Bollywood-fusiondans. Maya, gespeeld door Maitreyi Ramakrishnan (Never Have I Ever), en Anjali, gespeeld door Priyanka Kedia, besluiten zich aan te sluiten bij het Bollywood-dansteam van hun universiteit. Zulke teams combineren traditionele Zuid-Aziatische dansstijlen met moderne genres en strijden tegen teams van andere Amerikaanse universiteiten. Hun grote doel wordt uiteindelijk om met hun team het Amerikaanse nationale kampioenschap te winnen. Al snel ontdekken de vriendinnen dat het veel serieuzer is dan gewoon samen dansen. Binnen het team heerst een prestatiedruk van jewelste en bovendien is de concurrentie met andere universiteiten hevig. Om überhaupt kans te maken op de nationale titel moeten Maya en Anjali veel trainen en zo hun plaats binnen de groep zien te veroveren. Netflix heeft het in ieder geval over een meedogenloos competitieve en luidruchtige wereld . Zoektocht naar identiteit Tegelijkertijd, en dat mogen we niet vergeten, zitten Maya en Anjali midden in hun eerste jaar als studenten. Ze krijgen te maken met onder andere een hoop verwachtingen vanuit hun families en de zoektocht naar wie ze zelf eigenlijk willen zijn. Hun Zuid-Aziatische achtergrond speelt daarbij een belangrijke rol: de dansgroep is niet alleen een plek om wedstrijden te winnen, maar ook een manier om aansluiting te vinden bij hun cultuur en bij andere Zuid-Aziatische studenten. Wil j op of the world . Ze doen het in de regel méér dan geweldig op Netflix. En daarom heeft de streamingdienst nu de rechten van een kostuumdrama van de zender Starz gekocht. Nieuw kostuumdrama Dangerous Liaisons Het gaat om Dangerous Liaisons, dat niet nieuw is maar in 2022 zijn debuut maakte op Starz. Het is een historisch romantisch drama (of een kostuumdrama dus) en dient als voorloper op de beroemde achttiende-eeuwse roman Les Liaisons dangereuses van schrijver Pierre Choderlos de Laclos. De serie vertelt hoe Camille en Pascal Valmont, later bekend als de Marquise de Merteuil en Vicomte de Valmont, uitgroeien tot de beruchte verleiders en manipulators uit het oorspronkelijke verhaal. Het verhaal speelt zich af in Parijs, vlak voor de Franse Revolutie. Camille (Alice Englert) en Valmont (Nicholas Denton) zijn jonge geliefden die allebei proberen hogerop te komen in een maatschappij waarin afkomst en geld vrijwel alles bepalen. Hun relatie is intens, maar ook destructief: liefde, jaloezie, verraad en wraak lopen voortdurend door elkaar. Om te krijgen wat ze willen, ontdekken ze dat verleiding en geheimen krachtige wapens zijn. Hogere kringen van de Franse aristocratie Camille probeert zich los te maken van haar verleden en krijgt toegang tot de hogere kringen van de Franse aristocratie. Ze wordt daarbij onder de hoede genomen van de invloedrijke Marquise de Merteuil, gespeeld door Lesley Manville. Valmont heeft ondertussen zijn adellijke titel verloren en probeert die koste wat kost terug te krijgen. De twee sluiten deals met elkaar en gebruiken andere mensen voor hun plannen, maar hun gevoelens voor elkaar maken die spelletjes steeds ingewikkelder. Dan zit er nog wel een klein addertje onder het gras. We wéten dat Dangerous Liaisons op 27 oktober aanstaande uitkomt op Netflix in de Verenigde Staten, maar of dat ook in Nederland het geval zal zijn is nog eventjes de vraag. Vermoedelijk wel! Op de releasedatum moeten we alleen nog even wachten. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Netflix komt uit het niets met kostuumdrama appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-24T10:27:02+00:00", "hash": "7d85827394a1f254", "title_fa": "نتفلیکس با درام صحنه و لباس از ناکجاآباد بیرون می آید", "summary_fa": "درام های صحنه و لباس در صدر جهان قرار دارند. به عنوان یک قاعده، آنها در نتفلیکس بیش از حد عالی عمل می کنند. و به همین دلیل است که سرویس پخش اکنون حقوق یک درام صحنه و لباس را از کانال Starz خریداری کرده است. درام جدید صحنه و لباس Dangerous Liaisons This is Dangerous Liaisons، که جدید نیست اما اولین بار در Starz در سال 2022 ظاهر شد. این یک درام عاشقانه تاریخی (یا یک درام لباس) است و به عنوان پیش درآمد رمان معروف قرن هجدهم Les Liaisons Dangereuses نوشته نویسنده پیر چودرلوس د لاکلو عمل می کند. این سریال نشان می‌دهد که چگونه کامیل و پاسکال والمونت، که بعداً به نام مارکیز دو مرتویل و ویکومت دو والمونت شناخته شدند، به اغواگران و دستکاری‌کنندگان بدنام داستان اصلی تبدیل شدند. داستان در پاریس، درست قبل از انقلاب فرانسه می گذرد. کامیل (آلیس انگلرت) و والمونت (نیکلاس دنتون) عاشقان جوانی هستند که هر دو در تلاشند تا در جامعه‌ای که ریشه و پول تقریباً همه چیز را تعیین می‌کند رشد کنند. رابطه آنها شدید، اما ویرانگر است: عشق، حسادت، خیانت و انتقام دائماً در هم تنیده شده اند. برای رسیدن به آنچه می خواهند، متوجه می شوند که وسوسه و اسرار سلاح های قدرتمندی هستند. حلقه های عالی اشراف فرانسوی کامیل سعی می کند از گذشته خود رهایی یابد و به حلقه های عالی اشراف فرانسوی دسترسی پیدا کند. او تحت بال مارکیز دو مرتویل با نفوذ، با بازی لسلی منویل قرار می گیرد. والمونت اکنون عنوان نجیب خود را از دست داده است و در تلاش برای پس گرفتن آن به هر قیمتی است. این دو با یکدیگر معامله می کنند و از افراد دیگر برای برنامه های خود استفاده می کنند، اما احساسات آنها نسبت به یکدیگر این بازی ها را به طور فزاینده ای پیچیده"}, {"source": "Netflix NL", "title": "Kijkers krijgen geen genoeg van mysterieuze rampenserie op Netflix", "link": "https://www.netflix-nederland.nl/kijkers-krijgen-g ید می کند. تئودور جی. بوتروس جونیور، وکیل CNN، MS NOW و Politico در بیانیه ای به هالیوود ریپورتر گفت: ما از اقدام سریع دادگاه بسیار قدردانی می کنیم. ترامپ هفته گذشته گفت که این سه رسانه را از کاخ سفید منع می کند و متعاقباً آن را با ذکر نگرانی های مبهم در مورد امنیت ملی توجیه کرد. استخر تلویزیون کاخ سفید از آن زمان به حالت تعلیق درآمده است و CNN قادر به شرکت در آن نیست. در دستور منع موقت، کلی نوشت که پس از بررسی حقایق، شاکیان استدلالی به اندازه کافی قوی ارائه کردند تا تصمیم را تضمین کند. برای مثال، کاخ سفید چند ماه پس از انتشار برخی از گزارش‌هایی که برای توجیه ممنوعیت وی به آن اشاره کرده بود، گذرنامه بتسی کلاین، خبرنگار CNN را تمدید کرد. شاکیان همچنین احتمالاً موفق خواهند شد نشان دهند که پاس‌های سخت آنها بدون روند قانونی کافی از نظر قانون اساسی باطل شده است. قاعده کلی این است که افراد باید قبل از اینکه دولت آنها را از منافع مورد حمایت قانون اساسی محروم کند، اخطار و فرصتی برای شنیده شدن دریافت کنند. او در این حکم نوشته است. متهمان مناقشه ندارند که شاکیان اخطار و فرصتی برای شنیدن قبل از ابطال پاس های سخت خود دریافت"}, {"source": "Variety", "title": "Meta Unveils VR Glasses for $1,299, Promises 3D Films from Lionsgate, James Cameron, and Enhanced Versions of ‘Avengers’ and ‘Star Wars’", "link": "https://variety.com/2026/biz/news/meta-unveils-vr-glasses-for-1299-3d-films-1236874307/", "summary": "Meta’s given its glasses a virtual-reality upgrade. Meta unveiled its new $1,299 VR glasses at its annual Meta Connect event on Wednesday, an upgraded version of its Quest headset line. The product, the company promises, will usher in “a new era for virtual reality” by providing “a cinema, courtside seat, workspace, and console” for users at home. “We [ ]", "date_str": "2026-09-24T14:26:03+00:00", "hash": "eda2202cdc226907", "title_fa": "متا از عینک‌های واقعیت مجازی با قیمت 1299 دلار رونمایی کرد، قول فیلم‌های سه بعدی از Lionsgate، James Cameron و نسخه‌های پیشرفته «Avengers» و «Star Wars» را می‌دهد.", "summary_fa": "متا به عینک خود یک ارتقای واقعیت مجازی داده است. متا در رویداد س sely this contrast that fascinates me and makes him a good character for a film: someone who’s reserved and almost [ ]", "date_str": "2026-09-24T14:08:27+00:00", "hash": "0fc4d4fd1922b1a3", "title_fa": "«میک جگر حراج‌ها» در «چکش» سایمون والون تجلیل شد: «او در سایه‌ها است اما در کانون توجه است» (انحصاری)", "summary_fa": "جف کونز یا مارینا آبراموویچ را همه می شناسند، اما دنیای هنر یک سلبریتی دیگر را پنهان کرده است: ستاره حراج و رئیس سابق ساتبی، سیمون دی پوری. او در سایه‌ها است اما در کانون توجه است. دقیقاً همین تضاد است که من را مجذوب می‌کند و او را به شخصیت خوبی برای یک فیلم تبدیل می‌کند: کسی که محفوظ است و تقریباً [ ] اولین کلیپ مستند جدید پیش از اکران جهانی در جشنواره فیلم زوریخ او در سایه‌ها اما در کانون توجه است. دقیقاً همین تضاد است که مرا مجذوب خود می‌کند و او را به شخصیت خوبی برای یک فیلم تبدیل می‌کند: کسی که گاهی محتاط و تقریباً خجالتی است، اما بعداً میک جگر حراج می‌شود. سیمون والون کارگردان The Hammer می گوید این نام مستعار به خوبی به او می آید. داستان‌های مرتبط کمدی ماوراء الطبیعه Don t F — k With Ghosts در صورت تقاضا، کانال اصلی یوتیوب را راه اندازی کرد (اختصاصی) ماهرشالا علی سرانجام فیلم Blade خود را با «مادرت مادرت مادرت» ساخت مستند او، اولین نمایش جهانی در جشنواره فیلم زوریخ، توسط Kiss Kill, AIG, AIG Filmry, AIG, Forma. مجله بلک مربع. در ورایتی والون که در پشت بانی نیز محبوبیت داشت، در مورد کارگردان بازیگری، بانی تیمرمن بلافاصله جذب مغناطیس، دانش هنر و شخصیت بزرگتر از دی پوری شد. ناگفته نماند سبک پرشور او هنگام برگزاری حراج ها. وقتی از بیرون می‌آییم، اغلب تصور می‌کنیم کاری که او انجام می‌دهد می‌تواند به هنر یا هنر به طور کلی آسیب برساند. او خاطرنشان می کند، اما در دنیای هنر، به هیچ وجه اینطور درک نمی شود. در این سند که به بررسی حراج‌های گذشته و گذشته او می‌پردازد، از جمله حراجی در مسکو، که به نظر یک رویداد تاریخی بود که در آن کمونیسم و ​​سرمایه‌داری با هم برخورد کردند، می‌گوید هنرمندان"}, {"source": "Variety", "title": "Tribeca Festival Opens Submissions for Untold Stories Filmmaker Program With $1.2 Million Prize (EXCLUSIVE)", "link": "https://variety.com/2026/film/news/tribeca-festival-untold-stories-submissions-open-2026-1236873975/", "summary": "Tribeca Festival and AT T have opened submissions for the 10th anniversary of AT T Untold Stories, the filmmaker development program that awards one emerging director $1.2 million to produce a feature film. The production prize, which increased from $1 million to $1.2 million in 2026, is billed by Tribeca and AT T as the largest unrestricted film [ ]", "date_str": "2026-09-24T14:00:00+00:00", "hash": "6c44b5d63328ec1f", "title_fa": "جشنواره ترایبکا برای برنامه فیلمساز داستان های ناگفته با جایزه 1.2 میلیون دلاری (انحصاری) ارسال می کند.", "summary_fa": "جشنواره ترایبکا و AT T برای دهمین سالگرد AT T Untold Stories، برنامه توسعه فیلمساز که به یک کارگردان نوظهور 1.2 میلیون دلار جایزه برای تولید یک فیلم بلند جایزه می دهد، ارسال کرده اند. جایزه تولید، که از 1 میلیون دلار به 1.2 میلیون دلار در سال 2026 افزایش یافت، توسط Tribeca و AT T به عنوان بزرگترین فیلم بدون محدودیت تعیین می شود [ ] هر سال، پنج تیم فیلمسازی برای ارائه پروژه های خود به صورت زنده در جشنواره ترایبکا انتخاب می شوند که یک برنده بودجه کامل تولید، راهنمایی و حمایت تمام سال از استودیو ترایبکا را دریافت می کند. نمایش فیلم برنده در جشنواره سال بعد نیز تضمین شده است. محبوب در Variety دریافت‌کننده بعدی در جشنواره ترایبکا ۲۰۲۷ انتخاب می‌شود و ۱.۲ میلیون دلار برای تولید پیش از نمایش تضمینی در نسخه ۲۰۲۸ دریافت خواهد کرد. برایس نوربیتز، معاون استودیو ترایبکا و توسعه هنرمندان، گفت که ترایبکا به‌طور باورنکردنی به همکاری یک دهه‌ای ما با AT T و موفقیت فیلم‌سازانی که در داستان‌های ناگفته آمده‌اند افتخار می‌کند. ما شاهد بودیم که داستان‌سرایان پیشگام ایده‌های جدید جسورانه را از مفهومی به صفحه دیگر می‌بردند، حمایت توزیع‌کنندگان اصلی را جلب می‌کردند و به مخاطبانی می‌رسیدند که داستان‌هایشان شایسته آن است. نوربیتس افزود که رشد مداوم این برنامه گواهی بر قدرت سرمایه گذاری بر روی صداهای در حال ظهور است، به ویژه در زمانی که فیلمسازی مستقل هرگز سخت تر از این نبوده است. داستان های ناگفته که در سال 2017 راه اندازی شد، بیش از 9.2 میلیون دلا     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `

          <div>

            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';

    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
