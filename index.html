ه است، از لباس ها گرفته تا شلوارهای شیک و مناسب برای کار. خرده‌فروش هنوز برخی از وسایل ورزشی مورد علاقه ما را حمل می‌کند، اما تنوع کافی وجود دارد که مشتریان می‌توانند هنگام خرید در Athleta، بقیه کمد خود را نیز بسازند. این برند باکیفیت است، که اغلب با برچسب قیمتی به همان اندازه همراه است، اما یکی از ساده‌ترین راه‌ها برای کاهش هزینه‌ها، استفاده از کد کوپن Athleta قبل از بررسی است. ویراستاران تیم سبک ما چندین مورد Athleta را در طول سال‌ها آزمایش کرده‌اند و این برند به طور مداوم راحتی، کیفیت و سهولت پوشیدن را ارائه می‌دهد. لباس‌های برجسته‌ای مانند شلوار بلند بلند فوق‌العاده و شلوار بلند بلند بی‌پایان جایگاه‌هایی را در ست تمرینی و شلوارهای کار ما برای خرید لباس‌های جذاب و دوام در روزهای طولانی به دست آورده‌اند. ما اغلب در طول سال فروش Athleta را مشاهده می کنیم، اما کدهای تبلیغاتی یک راه آسان برای صرفه جویی در سبد خرید شما هستند. با این حال، یافتن آنها سخت است، بنابراین ما همیشه به دنبال کوپن های جدید و سایر تخفیف ها هستیم. در زیر، بهترین کوپن‌ها، کدهای تبلیغاتی و معاملات آتلتا را گردآوری کرده‌ایم. بهترین کوپن های امروزی Athleta در اولین سفارش خود با استفاده از کارت اعتباری جوایز Encore ظرف 14 روز پس از باز شدن با کد تبلیغاتی، 20% پس انداز می کنید:* 14DAYPASS بازگشت به خرید *برای استفاده از این کدها باید عضو برنامه پاداش Athleta باشید و کارت اعتباری پاداش شرکت Gap داشته باشید. کوپن های قبلی Athleta این"}, {"source": "Business Insider", "title": "I broke into tech sales after working in construction. Here's how I landed a more flexible job with higher earning potential.", "link": "https://www.businessinsider.com/went-from-construction-worker-tech-sales-one-year-heres-how-2026-10", "summary": "Bryan Ruiz. Courtesy of Bryan Ruiz Bryan Ruiz transitioned from construction to tech sales for a higher earning potential. Ruiz used online courses such as CourseCareers to gain the skills needed for a career in tech sales. His perseverance led to a flexible and profitable career path at a SaaS company. This as-told-to essay is based on a conversation with Bryan Ruiz, a 27-year-old tech sales representative based in Sioux Falls, South Dakota. It has been edited for length and clarity. I grew up in Puerto Rico, and about seven years ago, I moved to the US to look for construction work . After working in construction for a couple of years, I found it to be really back-breaking work. It didn't matter how hard I worked or how many skills I developed; there was always a cap on what I could earn because I was paid by the hour. I tried to get noticed and eventually get a raise, but it didn't work. I started thinking about pursuing a career where I'm really rewarded for the amount of work I put in. Within a year, I went from earning $18 an hour doing physical labor to a new career that put me on track to earn six figures. I decided to look into sales I was drawn to sales because it offered more upside than hourly work, and I liked the idea that strong performance could directly affect my earnings. I didn't know anything about sales. I watched a ton of YouTube videos trying to understand the space and what sales was about. I listened to podcasts on the job site, watched videos after work, and read books whenever I could. One podcast that helped me later on was \" 30 Minutes to President's Club .\" I also took a course through CourseCareers . The track I did was specifically for tech sales. I don't think you necessarily need a course to break into sales, but it helped me because it gave me a structured path to follow. It cost around $500, and I split it into a few payments. I finished the course in about a week because I desperately wanted to start my new career. I started applying to almost anything and everything I could find Landing interviews was a struggle at first, but eventually I got three interviews — and you only need one yes. I tried to schedule them during my breaks or see if I could get time off work to do them. My first interview completely destroyed my confidence. The hiring manager challenged me about not having any sales experience, and I reacted poorly. I started doubting whether this was for me. At the end of it, the hiring manager told me I should ", "date_str": "2026-10-12T20:32:58+00:00", "hash": "98545994e3b7b340", "title_fa": "من بعد از کار در ساخت و ساز وارد بخش فروش فناوری شدم. در اینجا آمده است که چگونه من یک شغل انعطاف پذیرتر با پتانسیل درآمد بالاتر پیدا کردم.", "summary_fa": "برایان رویز. با حسن نیت برایان رویز برایان رویز برای پتانسیل درآمد بالاتر از ساخت و ساز به فروش فناوری انتقال یافت. رویز از دوره های آنلاین مانند CourseCareers برای به دست آوردن مهارت های مورد نیاز برای حرفه ای در فروش فناوری استفاده کرد. پشتکار او منجر به یک مسیر شغلی منعطف و سودآور در یک شرکت SaaS شد. این مقاله گفته شده بر اساس گفتگو با برایان رویز، نماینده فروش فناوری 27 ساله مستقر در سیوکس فالز، داکوتای جنوبی است. برای طول و وضوح ویرایش شده است. من در پورتوریکو بزرگ شدم و حدود هفت سال پیش برای جستجوی کار ساختمانی به ایالات متحده نقل مکان کردم. بعد از چند سال کار در ساخت و ساز، متوجه شدم که این کار واقعاً یک کار کمرشکن است. اهمیتی نداشت که چقدر سخت کار کرده ام یا مهارت های زیادی کسب کرده ام. همیشه محدودیتی برای درآمدم وجود داشت، زیرا ساعتی حقوق می گرفتم. سعی کردم مورد توجه قرار بگیرم و در نهایت افزایش حقوق بگیرم، اما نشد. شروع کردم به فکر کردن در مورد شغلی که در آن برای مقدار کاری که انجام می‌دهم پاداش دریافت می‌کنم. در عرض یک سال، از درآمد 18 دلار در ساعت کار بدنی به شغل جدیدی رسیدم که من را در مسیر کسب شش رقمی قرار داد. تصمیم گرفتم به فروش نگاه کنم که به سمت فروش جذب شده بودم، زیرا بیشتر از کار ساعتی سودمند بود، و این ایده را دوست داشتم که عملکرد قوی می تواند مستقیماً بر درآمد من تأثیر بگذارد. من چیزی در مورد فروش نمی دانستم. من تعداد زیادی ویدیوی یوتیوب را تماشا کردم که سعی می‌کردم فضا و فروش را بفهمم. در سایت کار به پادکست گوش می‌دادم، بعد از کار ویدیوها را تماشا می‌کردم و هر وقت که می‌توانستم کتاب می‌خواندم. یکی از پادکست‌هایی که بعداً"}, {"source": "Business Insider", "title": "I'm a working parent who's built over 150 AI agents to help run my life. I get digital overload, but I'm getting more time back.", "link": "https://www.businessinsider.com/dad-built-150-personal-ai-agents-to-run-his-life-2026-10", "summary": "Tristen O Brien has built over 150 AI agents, including an AI family assistant. Sarah Lutomski/Sarah Lu Photography Tristen O'Brien is a working dad who built over 150 AI agents to manage his life and get back time. O'Brien's family has mixed opinions on AI, but they all use the AI family bot he built. He built an AI video game to help manage his agents and reduce digital overload. This as-told-to essay is based on a conversation with Tristen O'Brien, a 44-year-old AI educator and content creator who works in cybersecurity based in Indiana. His words have been edited for length and clarity. For a long time, I've felt like I can only focus on three things at a time without everything falling apart: family, work, and school. If I tried to add something else, one of those three things would fail. I've been in the tech industry for over 20 years, and I'm working toward my doctorate in AI . I'm also a YouTuber. I spent years learning the programming language Python because I wanted to create a world where I could automate parts of my life, giving me more time for hobbies and other things. Then ChatGPT came out , and I realized I had wasted about five years doing that. Since learning how to build AI agents , I've built over 150 of them to help me run my life. I'm now down to using around 70. I've always wanted to automate parts of my life There's a book about automating the boring parts of your life with the programming language Python. Years ago, I found this book and decided to learn it. Then, when ChatGPT came out, I quickly got into it. I'm not a developer; I do this by vibe coding. I first used ChatGPT to make funny songs and things like that. My interest kept growing, and I kept doing more with it. I've switched to Claude as my main model now, but I still use ChatGPT , Perplexity, and Gemini. Two years ago, I went to an AI conference where I learned about AI agents. I remember being so excited about what I had learned that I told myself that as soon as I got home, I was finally going to automate my life with AI. I use a specific prompting technique to build my agents The very first agent that I built after the conference was a Chipotle burrito agent that could order my burrito for me. I love Chipotle , and it was silly, but that agent helped me see the power of AI. When I build agents, I'm never just like, \" OK, Claude , this is what I want you to do, do the whole thing.\" Claude has a command called \"/goal\" that keeps the agent going until it gets the goal", "date_str": "2026-10-12T20:08:02+00:00", "hash": "91244e3a0fc67e27", "title_fa": "من یک والدین شاغل هستم که بیش از 150 عامل هوش مصنوعی برای کمک به اداره زندگی من ساخته است. من بیش از حد دیجیتال دریافت می کنم، اما زمان بیشتری را به عقب برمی گردم.", "summary_fa": "Tristen O Brien بیش از 150 عامل هوش مصنوعی از جمله یک دستیار خانواده هوش مصنوعی ساخته است. سارا لوتومسکی/ عکاسی سارا لو تریستن اوبراین پدری شاغل است که بیش از 150 عامل هوش مصنوعی را برای مدیریت زندگی خود و بازگشت زمان ساخته است. خانواده O'Brien نظرات متفاوتی در مورد هوش مصنوعی دارند، اما همه آنها از ربات خانواده هوش مصنوعی که او ساخته است استفاده می کنند. او یک بازی ویدیویی هوش مصنوعی ساخت تا به مدیریت عوامل خود و کاهش بار دیجیتال کمک کند. این مقاله گفته شده بر اساس گفتگو با Tristen O'Brien، یک مربی 44 ساله هوش مصنوعی و خالق محتوا است که در امنیت سایبری مستقر در ایندیانا کار می کند. کلمات او برای طولانی و وضوح ویرایش شده است. برای مدت طولانی، احساس می‌کردم که می‌توانم همزمان روی سه چیز تمرکز کنم بدون اینکه همه چیز از هم بپاشد: خانواده، کار و مدرسه. اگر می خواستم چیز دیگری اضافه کنم، یکی از آن سه مورد شکست می خورد. من بیش از 20 سال است که در صنعت فناوری فعالیت می کنم و در حال کار به سمت دکترای خود در زمینه هوش مصنوعی هستم. من هم یوتیوبر هستم. من سال‌ها صرف یادگیری زبان برنامه‌نویسی پایتون کردم، زیرا می‌خواستم دنیایی ایجاد کنم که بتوانم بخش‌هایی از زندگی‌ام را خودکار کنم و زمان بیشتری برای سرگرمی‌ها و چیزهای دیگر به من بدهم. سپس ChatGPT منتشر شد، و من متوجه شدم که حدود پنج سال را برای انجام این کار تلف کرده ام. از زمانی که یاد گرفتم چگونه عوامل هوش مصنوعی بسازم، بیش از 150 عدد از آنها را برای کمک به اداره زندگی خود ساخته ام. من در حال حاضر به استفاده از حدود 70 کاهش یافته ام. من همیشه می خواستم قسمت هایی از زندگی ام را خودکار کنم کتابی در مورد خودکار"}, {"source": "Business Insider", "title": "The best wet-dry vacuums in 2026", "link": "https://www.businessinsider.com/guides/home/best-wet-dry-vacuums", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more A wet-dry vacuum halves the time spent cleaning, leaving floors shiny and dust-free. Alex Temblador/Business Insider Since I started cleaning my floors with a wet-dry vacuum, my cleaning time has been cut in half, allowing me to spend my time on things I love, like sewing, reading, and writing. They vacuum up dirt, dust, and debris while mopping up stains, wet messes, and grime. The best wet-dry vacuums are equipped with a range of features, such as the ability to lie flat to reach under low furniture, detect and adjust power to the dirt, and self-clean the brushroll, which ultimately ensured my floors were cleaner than they had been when I used just a vacuum and a mop . Get to the point: The Tineco Floor One S7 Stretch Ultra is my first choice for the best overall wet-dry vacuum; it has a lie-flat design, dirt detection technology, and an efficient, quick self-drying system. Our budget choice, the Roborock F25, has solid front and side edge cleaning, about 34 minutes of battery life, heated drying, and dirt detection technology, which is not something that similarly priced wet-dry vacuums in this price range can boast. Over the last five years, I've tested 30 wet-dry vacuums on the hard floors — and sometimes rugs — of my 1,600-square-foot house. I'm evaluating the cleaning capabilities, battery life, and ease of use, including their self-cleaning systems. Keep reading to learn about our favorite seven wet-dry vacuums and how they keep floors clean, sanitized, and pristine. If you prefer a completely automated, hands-off approach, explore our top picks for the best robot vacuum mops . Our top picks for the best wet-dry vacuums Best overall wet-dry vacuum: Tineco Floor One S7 Stretch Ultra - See at Amazon Best value wet-dry vacuum: Roborock F25 - See at Amazon Best splurge wet-dry vacuum: Tineco Floor ONE Station S9 Scientist Pro - See at Amazon Best wet-dry vacuum for pets: Bissell Crosswave Reach Plus - See at Amazon Best low-maintenance wet-dry vacuum: Narwal S30 Pro - See at Narwal Best lightweight wet-dry vacuum: Shark HydroVac Messmaster Cordless - See at Amazon Best chemical-free wet-dry vacuum: iRobot Roomba Electro 5-in-1 Hard Floor Cleaner - See at Amazon Best overall Tineco leads the way in mop-vacs. The feature that Tineco pioneered early on in its floorcare and continues to prioritize in its models today is dirt-detect technology, which enables the va", "date_str": "2026-10-12T19:57:51+00:00", "hash": "6e138d92b33800c9", "title_fa": "بهترین جاروبرقی های مرطوب و خشک در سال 2026", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید جاروبرقی مرطوب و خشک زمان صرف شده برای تمیز کردن را به نصف کاهش می دهد و کف ها را براق و عاری از گرد و غبار می کند. الکس تمبلادور/Business Insider از زمانی که شروع به تمیز کردن کف‌هایم با جاروبرقی مرطوب و خشک کردم، زمان تمیز کردن من به نصف کاهش یافت و به من این امکان را می‌دهد که وقتم را صرف کارهایی کنم که دوست دارم، مانند خیاطی، خواندن و نوشتن. آنها خاک، گرد و غبار و زباله ها را با جاروبرقی پاک می کنند و در عین حال لکه ها، آلودگی های مرطوب و کثیفی را پاک می کنند. بهترین جاروبرقی‌های خشک و مرطوب به طیف وسیعی از ویژگی‌ها مجهز شده‌اند، مانند قابلیت دراز کشیدن برای رسیدن به زیر مبلمان کم، تشخیص و تنظیم قدرت با خاک، و تمیز کردن خودکار برس رول، که در نهایت تضمین می‌کند که کف‌های من تمیزتر از زمانی که فقط از جاروبرقی و جاروبرقی استفاده می‌کردم، تمیز می‌شوند. به اصل مطلب بروید: Tineco Floor One S7 Stretch Ultra اولین انتخاب من برای بهترین جاروبرقی خشک و مرطوب است. دارای طراحی صاف، فناوری تشخیص کثیفی و سیستم خود خشک کن سریع و کارآمد است. انتخاب مقرون به صرفه ما، Roborock F25، دارای تمیز کردن محکم جلو و لبه‌های جانبی، عمر باتری حدود 34 دقیقه، خشک کردن با گرمایش، و فناوری تشخیص کثیفی است، که چیزی نیست که جاروبرقی‌های مرطوب و خشک با قیمت مشابه در این محدوده قیمت بتوانند به خود ببالند. در طول پنج سال گذشته، من 30 جاروبرقی مرطوب و خشک را بر روی کف های سخت - و گاهی اوقات فرش - خانه 1600 فوت مربعی خود آزمایش کرده ام. من در حال ارزیابی قابلیت‌های تمیز کردن، عمر"}, {"source": "Business Insider", "title": "How to make economy feel like an upgrade, according to a travel expert who's spent 3,500 hours in premium cabins", "link": "https://www.businessinsider.com/economy-flight-comfort-tips-travel-expert-2026-10", "summary": "Flight expert Zach Griff shares how to bring the luxuries of first and business class to the economy cabin. Courtesy of Zach Griff Flying economy can feel crowded, cramped, and generally unpleasant. But it doesn't have to be. Here's how to give yourself an upgrade when you're stuck in economy. Economy seats may be smaller than those in upgraded classes, but that doesn't mean you have to be cramped between passengers. Economy tickets may not include a meal, but that doesn't mean you can't have a fine-dining experience. The economy cabin will never be as comfortable as first class , but that doesn't mean you can't make the most of it. Enter Zach Griff, travel expert and author of the travel newsletter From the Tray Table . Griff estimates he's spent 3,500 hours flying more than 1.8 million miles in business and first-class cabins . He flies 150,000 miles a year on average, including roughly 50,000 in economy. With so much experience in premium cabins , Griff has a few tips that make his economy flights feel like an upgrade. Start by booking a flight during an unpopular travel time. Joey Hadden/Business Insider One of the big perks of premium cabins is having more personal space. If you can avoid flying in a crowded economy cabin, you may be more likely to end up with an empty seat next to you, which can feel like an upgrade, Griff told Business Insider. According to Griff, the earliest and latest departures of the day tend to have the most empty seats. Aim for a Saturday or midweek booking, he added. Try to find a flight with two-seater rows. Chris Cooper/Bloomberg via Getty Images Griff said sitting in a row without a middle seat can make economy feel like an upgrade, too. There are rows like this on some wide-body planes, which have two aisles and are typically used for long-distance travel. So while you're searching for flights for your next international trip, take a look at the seat map before you book. Keep checking for open seats until boarding and move to the row with the most space. Joey Hadden/Business Insider When Griff flies economy, he starts checking the seat map for his trip two days before departure to see how full it is. \"If it's looking like maybe another row has more space, I'd always move to that row to see if that may end up open,\" he said. \"Monitor the seat map until the minute before boarding starts and move around to optimize your chances of finding an empty seat.\" You may even end up with your own row. Treat yourself to a nice meal. ", "date_str": "2026-10-12T19:40:48+00:00", "hash": "9b85ba81193c1828", "title_fa": "به گفته یک کارشناس سفر که 3500 ساعت را در کابین‌های ممتاز گذرانده است، چگونه می‌توان احساس اقتصادی را مانند یک ارتقاء ایجاد کرد.", "summary_fa": "زک گریف، کارشناس پرواز، نحوه آوردن تجملات کلاس اول و تجاری را به کابین اقتصادی به اشتراک می گذارد. به لطف Zach Griff Flying Economic می‌تواند شلوغ، تنگ و به طور کلی ناخوشایند باشد. اما لازم نیست که باشد. در اینجا نحوه ارتقای خود را در زمانی که در اقتصاد گیر کرده اید آورده شده است. صندلی‌های اکونومی ممکن است کوچک‌تر از صندلی‌های کلاس‌های ارتقا یافته باشند، اما این بدان معنا نیست که باید بین مسافران تنگ باشد. بلیط های اکونومی ممکن است شامل یک وعده غذایی نباشند، اما این بدان معنا نیست که نمی توانید یک غذای خوب را تجربه کنید. کابین اکونومی هرگز به راحتی درجه یک نخواهد بود، اما این بدان معنا نیست که نمی توانید از آن نهایت استفاده را ببرید. زک گریف، کارشناس سفر و نویسنده خبرنامه سفر از جدول سینی را وارد کنید. گریف تخمین می زند که او 3500 ساعت را صرف پرواز بیش از 1.8 میلیون مایل در کابین های تجاری و درجه یک کرده است. او به طور متوسط ​​150000 مایل در سال پرواز می کند که تقریباً 50000 مایل در اقتصاد است. با تجربه بسیار زیاد در کابین‌های ممتاز، گریف نکاتی را ارائه می‌کند که باعث می‌شود پروازهای اکونومی او مانند یک ارتقاء به نظر برسد. با رزرو پرواز در زمان سفر نامطلوب شروع کنید. Joey Hadden/Business Insider یکی از مزایای بزرگ کابین های ممتاز، داشتن فضای شخصی بیشتر است. گریف به Business Insider گفت: اگر بتوانید از پرواز در یک کابین شلوغ اقتصادی اجتناب کنید، ممکن است در نهایت یک صندلی خالی در کنار خود داشته باشید که می تواند یک ارتقاء باشد. به گفته گریف، اولین و آخرین حرکت‌های روز معمولاً خالی‌ترین صندلی‌ها را دارند. او اضافه کرد که یک شنبه یا اواسط هفته رزرو کنید. سعی کنید پروازی با ردیف های دو نفره پیدا کنید. کریس کوپر/"}, {"source": "Business Insider", "title": "Losing your job after age 50 could derail your career", "link": "https://www.businessinsider.com/losing-job-after-50-long-term-unemployment-age-discrimination-retire-2026-10", "summary": "Thomas Heep (left), Steven Fielding (center), and Jon McCarty (right) struggled to find work after losing their jobs later in life. Thomas Heep (left), Steven Fielding (center), and Jon McCarty (right) Some Americans who lose their jobs after age 50 spend years struggling to find comparable work. In September, the average unemployment duration for workers ages 55 to 64 was over eight months. Some older job seekers suspect age discrimination is hurting their chances of finding work. Cathy Valentine lost her job as a transformation lead in 2023. After three years struggling to find a comparable full-time job, the 61-year-old is now a prep cook at a cafe. She said she earns about an eighth of her previous salary. \"It just feels like I tried to do everything right and I still am stuck,\" said Valentine, who lives in Florida. Some older workers who lose their jobs can afford to retire, while others find a comparable role fairly quickly. But those who don't risk getting stuck in a job search that drags on for months or even years — and is getting longer. On some metrics, older Americans are doing just fine in the job market . As of September, older workers had lower unemployment rates than younger workers, and when they were jobless, the median length of that unemployment was shorter. But those figures obscure a worse trend for older job seekers . While half of 55 to 64-year-olds were jobless for a relatively low three months, the group's average unemployment duration was more than eight months in September. That means some older workers have been unemployed for so long that they're pulling the average way up. The gap between the average and median has widened in recent months, suggesting the longest job searches may be growing even longer. In September, about 173,000 unemployed Americans ages 55 to 64 had been out of work for at least six months, and some are facing far longer stretches of unemployment. A Bureau of Labor Statistics analysis found that only 57% of workers ages 55 to 64 who lost their long-held jobs any time between 2023 and 2025 had found new jobs as of January 2026. By contrast, 73% of workers ages 25 to 54 who lost long-held jobs in that period had found new work. Some older workers may have taken their job loss as a sign they should retire. But for others, it marked the beginning of an uphill battle to find another job. The struggle to get hired after 50 As their searches drag on for months or years, older job seekers like Valentine often blam", "date_str": "2026-10-12T19:37:31+00:00", "hash": "a1a4a01b08cfbd6c", "title_fa": "از دست دادن شغل خود بعد از 50 سالگی می تواند شغل شما را از مسیر خارج کند", "summary_fa": "توماس هیپ (چپ)، استیون فیلدینگ (مرکز) و جان مک کارتی (راست) پس از از دست دادن شغل خود در اواخر زندگی برای یافتن کار تلاش کردند. توماس هیپ (چپ)، استیون فیلدینگ (مرکز)، و جان مک کارتی (راست) برخی از آمریکایی‌هایی که پس از 50 سالگی شغل خود را از دست می‌دهند، سال‌ها در تلاش برای یافتن کار مشابه هستند. در ماه سپتامبر، میانگین مدت بیکاری برای کارگران 55 تا 64 ساله بیش از هشت ماه بود. برخی از سالمندان جویای کار گمان می کنند که تبعیض سنی به شانس آنها برای یافتن کار آسیب می رساند. کتی ولنتاین در سال 2023 شغل خود را به عنوان مدیر تحول از دست داد. پس از سه سال تلاش برای یافتن شغل تمام وقت مشابه، این مرد 61 ساله اکنون یک آشپز مقدماتی در یک کافه است. او گفت که حدود یک هشتم حقوق قبلی خود را دریافت می کند. ولنتاین که در فلوریدا زندگی می‌کند، گفت: «فقط احساس می‌کنم سعی کردم همه چیز را درست انجام دهم و هنوز گیر کرده‌ام. برخی از کارگران مسن‌تر که شغل خود را از دست می‌دهند، می‌توانند بازنشسته شوند، در حالی که برخی دیگر نسبتاً سریع نقش مشابهی پیدا می‌کنند. اما کسانی که ریسک نمی کنند در جستجوی شغلی گیر بیفتند که ماه ها یا حتی سال ها طول می کشد - و طولانی تر می شود. در برخی از معیارها، آمریکایی های مسن تر در بازار کار به خوبی عمل می کنند. در ماه سپتامبر، کارگران مسن‌تر نسبت به کارگران جوان‌تر نرخ بیکاری کمتری داشتند و زمانی که بیکار بودند، میانگین طول بیکاری کوتاه‌تر بود. اما این ارقام روند بدتری را برای جویندگان کار مسن تر پنهان می کند. در حالی که نیمی از افراد 55 تا 64 ساله برای سه ماه نسبتاً کم بیکار بودند، میانگین مدت بیکاری این گروه در سپتامبر بیش از"}, {"source": "Business Insider", "title": "Photos show why George and Amal Clooney are still one of the best-dressed couples in Hollywood", "link": "https://www.businessinsider.com/george-amal-clooney-best-outfits", "summary": "Amal Clooney and George Clooney at the 2026 Albies in London. Taylor Hill/Getty Images George and Amal Clooney have been a power couple for over a decade. They're also one of the best-dressed celebrity couples in Hollywood. You can't miss them at the Venice Film Festival, Met Gala, or anywhere else. Few celebrity couples are at the level of George and Amal Clooney . The actor and lawyer have been married for over a decade, during which time they've both remained at the top of their fields. They're also extremely stylish. Talk about a power couple . Here's a look at the best style moments they've had together. George Clooney and Amal Clooney made their red-carpet debut in September 2014. Rachel Murray/Getty Images They attended a gala event in Florence, Italy, while wearing matching black ensembles. Amal stunned in a strapless Dolce Gabbana gown with sparkles on the back of her skirt, and George donned a tuxedo with a satin tie. It marked the couple's first red-carpet appearance together. For their first Met Gala in 2015, the Clooneys revealed the bolder side of their fashion. Amal Clooney and George Clooney at the Met Gala on May 4, 2015. Axelle/Bauer-Griffin/Getty Images Amal especially stood out in a red, strapless ball gown custom-made for her by Margiela and John Galliano. It had a paillette-covered bodice and an asymmetrical tiered skirt. George's look was also special. He wore a black jacket that was cropped in front and longer in the back, and a white button-up with a matching bow tie. The actor completed his look with a red pocket square that matched his wife's dress. They let loose later that year at the launch event for George s Casamigos tequila brand. Iconic/Stringer/Getty Images George looked relaxed in a white button-up shirt, light jeans, brown boots, and a metallic watch while promoting his tequila brand . Amal, however, seemed ready to party. She wore a gold minidress covered in sequins, black pointed pumps, and stud earrings. Amal and George wore coordinated, all-black outfits again for a Berlin film festival in 2016. Matthias Nareyek/Getty Images Amal looked stunning in a sleeveless black dress covered in dazzling sequins. The gown's skirt also had a sheer overlay made from tulle that reached the floor. George, on the other hand, wore a black tuxedo with a matching shirt and tie. They also put their own twist on Hollywood glamour that year. Anthony Harvey/Getty Images At the 2016 Cannes Film Festival, George and Amal walked the red carpe", "date_str": "2026-10-12T19:21:37+00:00", "hash": "400b8d62fefdbfae", "title_fa": "عکس ها نشان می دهد که چرا جورج و امل کلونی هنوز یکی از خوش پوش ترین زوج های هالیوود هستند", "summary_fa": "امل کلونی و جورج کلونی در آلبی 2026 در لندن. تیلور هیل/ گتی ایماژ جورج و امل کلونی بیش از یک دهه است که زوج قدرتمندی هستند. آنها همچنین یکی از خوش پوش ترین زوج های مشهور هالیوود هستند. شما نمی توانید آنها را در جشنواره فیلم ونیز، مت گالا یا هر جای دیگری از دست بدهید. تعداد کمی از زوج های مشهور در سطح جورج و امل کلونی هستند. این بازیگر و وکیل بیش از یک دهه است که ازدواج کرده اند و در این مدت هر دو در صدر زمینه های خود باقی مانده اند. آنها همچنین بسیار شیک هستند. در مورد یک زوج قدرتمند صحبت کنید. در اینجا نگاهی داریم به بهترین لحظات سبکی که آنها با هم داشته اند. جورج کلونی و امل کلونی اولین حضور خود را روی فرش قرمز در سپتامبر 2014 انجام دادند. ریچل موری/ گتی ایماژ آنها در یک مراسم جشن در فلورانس ایتالیا شرکت کردند، در حالی که لباس های مشکی همرنگ بر تن داشتند. امل با لباس مجلسی بدون بند دولچه گابانا با درخشش در پشت دامن خود مبهوت شد و جورج لباسی با یک کراوات ساتن پوشید. این اولین حضور مشترک این زوج روی فرش قرمز بود. برای اولین بار در سال 2015، خانواده کلونی جنبه جسورانه مد خود را آشکار کردند. امل کلونی و جورج کلونی در مراسم مت گالا در 4 می 2015. Axelle/Bauer-Griffin/Getty Images امل به ویژه در لباس مجلسی قرمز و بدون بند که توسط Margiela و جان گالیانو برای او ساخته شده بود برجسته بود. نیم تنه پوشیده از جلیقه و دامن طبقه ای نامتقارن داشت. قیافه جورج هم خاص بود. او یک کت مشکی پوشیده بود که از جلو بریده شده بود و در پشت بلندتر بود و یک دکمه سفید به همراه یک پاپیون همسان. این بازیگر ظاهر خود را با یک"}, {"source": "Business Insider", "title": "One chart shows white-collar biz is thriving even as jobs dry up", "link": "https://www.businessinsider.com/white-collar-employment-falling-output-surges-2026-10", "summary": "Employment in white-collar sectors has dipped, while output is surging. Maskot/Getty Images Employment has dropped in white-collar sectors, while output has continued to surge. AI and economic uncertainty are two likely reasons for the sluggish white-collar job market. Still, how productive AI makes companies remains a question. The white-collar sector is doing more with less. While the number of total jobs has slid in industries like finance, tech, and professional services, output has been on a tear. Gad Levanon, the chief economist at the Burning Glass Institute, examined how employment in white-collar-heavy sectors compares with real gross domestic product . He wrote in a Substack article that employment in finance, insurance, information, and professional and business services is collectively down roughly 2% since the end of 2022, while real output for these sectors has soared by 16%. The ongoing slow decline in employment for this group goes against historical patterns and highlights how workers and job seekers are facing a largely frozen, low-hire, low-fire job market . \"A growing share of the work businesses used to get done by consultants, contractors, call centers and their own back-office staff is now delivered by software, cloud and IT firms, which produce far more per worker and add almost no staff,\" Levanon told Business Insider. \"That is why the sector's output keeps rising while its hiring has stopped.\" The divergence also risks breaking the traditional link between economic growth and rising fortunes for everyday Americans. \"Even a strong, continual growth in GDP may not translate into jobs for people, may not translate into a higher quality of life for people as well,\" said Cory Stahle, an economist at the Indeed Hiring Lab. People looking in these kinds of sectors may be having a challenging time. \"It's important to remember for these job seekers that a career is not necessarily built over the course of two or three years,\" Stahle said. \"It's usually built over the course of two or three decades. So what the pattern is now could easily shift a couple of years from now. So it's important to be reactive but not overreact to what we're seeing in the data, either.\" Have you been job searching in these white-collar sectors? Have you had to make a career pivot? Reach out to this reporter to share what that's been like at mhoff@businessinsider.com . Levanon said on Substack that there's demand in these white-collar fields, but firms can meet it", "date_str": "2026-10-12T19:20:50+00:00", "hash": "71594fedb402ee06", "title_fa": "یک نمودار نشان می دهد که تجارت یقه سفید در حال رونق است حتی با خشک شدن مشاغل", "summary_fa": "اشتغال در بخش های یقه سفید کاهش یافته است، در حالی که تولید در حال افزایش است. Maskot/Getty Images اشتغال در بخش های یقه سفید کاهش یافته است، در حالی که تولید همچنان افزایش یافته است. هوش مصنوعی و عدم اطمینان اقتصادی دو دلیل محتمل برای کسادی بازار کار یقه سفید هستند. با این حال، اینکه هوش مصنوعی چقدر باعث تولید شرکت‌ها می‌شود یک سوال باقی مانده است. بخش یقه سفید بیشتر با کمتر انجام می دهد. در حالی که تعداد کل مشاغل در صنایعی مانند مالی، فناوری و خدمات حرفه ای کاهش یافته است، تولید کاهش یافته است. گاد لوانون، اقتصاددان ارشد موسسه شیشه سوزان، چگونگی مقایسه اشتغال در بخش‌های سنگین یقه سفید را با تولید ناخالص داخلی واقعی بررسی کرد. او در مقاله Substack نوشت که اشتغال در امور مالی، بیمه، اطلاعات، و خدمات حرفه ای و تجاری از پایان سال 2022 تقریباً 2 درصد کاهش یافته است، در حالی که تولید واقعی این بخش ها 16 درصد افزایش یافته است. کاهش آهسته مداوم اشتغال برای این گروه برخلاف الگوهای تاریخی است و نشان می‌دهد که چگونه کارگران و جویندگان کار با بازار کار عمدتاً منجمد، کم‌استخدام و کم آتش مواجه هستند. لوانون به Business Insider گفت: «سهم فزاینده‌ای از کاری که قبلاً توسط مشاوران، پیمانکاران، مراکز تماس و کارکنان پشتیبان خود انجام می‌شد، اکنون توسط شرکت‌های نرم‌افزار، ابر و فناوری اطلاعات ارائه می‌شود که به ازای هر کارگر بسیار بیشتر تولید می‌کنند و تقریباً هیچ کارمندی اضافه نمی‌شود.» \"به همین دلیل است که تولید این بخش همچنان در حال افزایش است در حالی که استخدام آن متوقف شده است.\" این واگرایی همچنین خطر شکستن پیوند سنتی بین رشد اقتصادی و افزایش ثروت را برای آمریکایی‌های روزمره به همراه دارد. کوری استال، اقتصاددان در آزمایشگاه Indeed Hiring می‌گوید: «حتی یک رشد قوی و مستمر در تولید ناخالص داخلی"}, {"source": "Business Insider", "title": "All of the best memes about the Kelly Clarkson drama over a fake bird", "link": "https://www.businessinsider.com/kelly-clarkson-art-of-play-memes-feud-bird-2026-10", "summary": "Kelly Clarkson has gotten into a feud with a Brooklyn art store. Weiss Eubanks/NBCUniversal via Getty Images The internet has a hot new feud: Kelly Clarkson vs. a Brooklyn toy store. The drama has spawned countless memes poking fun at the superstar's beef. Here are our favorites. You probably didn't have \" American Idol winner gets into public argument with toy store online\" on your bingo card this week — but here we are. On Saturday, Three-time Grammy winner and former talk show host Kelly Clarkson posted on X , criticizing the \"Art of Play\" toy shop in Brooklyn. Clarkson said she was considering buying a few things, but was \"looked at as if I couldn't afford it.\" She compared the experience to Julia Roberts' character in \"Pretty Woman.\" \"Wow, dude,\" she wrote. \"You're an idiot and just lost a huge sale.\" The post racked up more than 44 million views as of Monday afternoon. The store responded , saying Clarkson was interested in a \"one-of-a-kind singing and dancing bird automaton\" that's used in magic shows there and that it wasn't for sale. Clarkson fired back, the store responded again … Business Insider's Amanda Goh summed up the whole small-business dispute if you need to catch up. Of course, the internet doesn't miss a chance to chime in on the celebrity drama — especially one over a fake bird. \"Kelly Clarkson just came into my apartment and demanded to buy a load bearing wall,\" wrote @missladysalad on X. Another user poked fun at Marco Rubio: When you realize you have to go to Brooklyn to resolve a conflict with a one-of-a-kind singing dancing bird automaton. pic.twitter.com/XLIP7JCIDe — Yael Bar tur (@yaelbt) October 12, 2026 Me and my friends monitoring the Kelly clarkson magic shop situation pic.twitter.com/J3uPNrNV77 — Max Berlinger (@Berlinger) October 12, 2026 Others imagined how to explain it all — or how \"Molly\" felt about the drama. molly finding out she has to stay at the brooklyn toy store instead of going home with kelly clarkson pic.twitter.com/QbBuuk9WLg — Jill Gutowitz (@jillboard) October 12, 2026 Kelly Clarkson at Target when they tell her she can’t buy one of the big red balls outside https://t.co/8lGZajKpGO — Matt (@Yuncle1) October 12, 2026 Kelly Clarkson has a taser and she won’t leave the Rainforest Cafe until they sell her an animatronic toucan — ann lee news and updates (@samcorb) October 12, 2026 Miranda: I can’t believe Kelly Clarkson defamed a local business over a toy bird Charlotte: More women need to stand up for themse", "date_str": "2026-10-12T19:15:40+00:00", "hash": "6eac8da9d7bdca8a", "title_fa": "همه بهترین میم ها در مورد درام کلی کلارکسون در مورد یک پرنده جعلی", "summary_fa": "کلی کلارکسون با یک فروشگاه هنری در بروکلین درگیر شده است. Weiss Eubanks/NBCUniversal از طریق Getty Images اینترنت یک دشمنی داغ جدید دارد: کلی کلارکسون در مقابل یک فروشگاه اسباب‌بازی بروکلین. این درام باعث ایجاد میم‌های بی‌شماری شده است که با گوشت گاو این سوپراستار مسخره می‌کنند. در اینجا موارد مورد علاقه ما هستند. احتمالاً این هفته \"برنده امریکن آیدل وارد بحث عمومی با فروشگاه اسباب بازی آنلاین می شود\" در کارت یکنوع بازی شبیه لوتو خود را نداشتید — اما ما اینجا هستیم. روز شنبه، کلی کلارکسون، برنده سه جایزه گرمی و مجری سابق برنامه گفتگو در X پستی منتشر کرد و از فروشگاه اسباب‌بازی «هنر بازی» در بروکلین انتقاد کرد. کلارکسون گفت که در نظر دارد چند چیز بخرد، اما \"به نظر می رسد که من نمی توانم آن را بخرم.\" او این تجربه را با شخصیت جولیا رابرتز در «زن زیبا» مقایسه کرد. او نوشت: \"وای رفیق.\" \"تو یک احمق هستی و فقط یک فروش هنگفت را از دست داده ای.\" این پست تا بعدازظهر دوشنبه بیش از 44 میلیون بازدید داشت. فروشگاه پاسخ داد و گفت که کلارکسون علاقه مند به یک \"خودکار پرنده آواز و رقصنده بی نظیر\" است که در نمایش های جادویی در آنجا استفاده می شود و برای فروش نیست. کلارکسون پاسخ داد، فروشگاه دوباره پاسخ داد... آماندا گو، مدیر بیزینس اینسایدر، کل بحث در مورد تجارت کوچک را خلاصه کرد. البته، اینترنت فرصتی را از دست نمی دهد تا به درام مشهور مشهور بپردازد - به خصوص یکی از پرنده های جعلی. @missladysalad در X نوشت: «کلی کلارکسون به‌تازگی وارد آپارتمان من شد و خواستار خرید یک دیوار باربر شد.» کاربر دیگری به مارکو روبیو مسخره کرد: وقتی متوجه شدید که باید به بروکلین بروید تا با یک خودکار پرنده رقصنده بی‌نظیر به بروکلین بروید. pic.twitter.com/XLIP7JCIDe — Yael Bar tur (@yaelbt)"}, {"source": "Business Insider", "title": "Jeremy Strong argued with Aaron Sorkin in-character as Mark Zuckerberg over this one line in 'The Social Reckoning'", "link": "https://www.businessinsider.com/jeremy-strong-argued-aaron-sorkin-social-reckoning-line-zuckerberg-2026-10", "summary": "Jeremy Strong as Mark Zuckerberg in The Social Reckoning. Sony Jeremy Strong loves going Method, talking and acting like his character even when cameras aren't rolling. So \"Social Reckoning\" director Aaron Sorkin wasn't surprised Strong acted like Mark Zuckerberg on set. He was surprised, though, that Strong became such a big Zuck defender. Jeremy Strong is known for his intense Method acting on set. But even \"The Social Reckoning\" director Aaron Sorkin was surprised by how all-in Strong went in embodying Mark Zuckerberg . Sorkin, who had worked with the acclaimed actor on two of his previous directing efforts, \"Molly's Game\" and \"The Trial of the Chicago 7,\" wasn't shocked when Strong showed up on \" The Social Reckoning \" set speaking and acting like the Facebook founder. But Sorkin never imagined Strong would end up becoming a staunch Zuckerberg defender in the process. \"I knew he's a very immersive actor,\" Sorkin told Business Insider . \"I never heard him use his own voice. He only spoke as Mark, he only behaved as Mark. But I didn't expect that he was going to be a constant defender of Mark. Not just on the set, but the emails I would get at night at the hotel.\" Sorkin said this continued even in post-production, when Strong, still in-character as Zuckerberg, argued with his director over a line in the movie. \"The Social Reckoning\" tells the story of former Facebook employee turned whistleblower Frances Haugen (Mikey Madison), who leaked hundreds of thousands of documents to Wall Street Journal reporter Jeff Horwitz (Jeremy Allen-White) that revealed Facebook's algorithm was designed to spread inflammatory content and encouraged extremism, at the expense of users' safety and mental health. Jeremy Strong and Aaron Sorkin. Sean Zanni/Getty Images Strong-as-Zuckerberg wrote Sorkin about a scene in which his character has been debating Bill Burr's character Charlie, a fictionalized former Facebook investor, about free speech and fact-checking advertisements. \"He ends the debate by saying, 'It's a business, Charlie. You know why we don't fact-check ads? Because we don't have to. Are you new?'\" Sorkin recalled. \"Jeremy felt that it was just about money. That Mark was saying this is a business, it's about money, and that's why we do it,\" Sorkin continued. \"But that was not the argument that Mark had been making for the entire movie, which is that it's a free speech thing. That Facebook is the town square. So my feeling was Mark isn't saying it's about the mon", "date_str": "2026-10-12T18:59:06+00:00", "hash": "6ca428bc52ba91b2", "title_fa": "جرمی استرانگ با آرون سورکین در نقش مارک زاکربرگ بر سر همین یک خط در «حساب اجتماعی» بحث کرد.", "summary_fa": "جرمی استرانگ در نقش مارک زاکربرگ در The Social Reckoning. سونی جرمی استرانگ دوست دارد به روش ادامه دهد، مانند شخصیت خود صحبت کند و رفتار کند، حتی زمانی که دوربین ها در حال چرخش نیستند. بنابراین آرون سورکین کارگردان «Social Reckoning» تعجب نکرد که استرانگ مانند مارک زاکربرگ سر صحنه فیلمبرداری بازی کرد. با این حال، او شگفت زده شد که استرانگ به یک مدافع بزرگ زاک تبدیل شد. جرمی استرانگ به خاطر بازی شدید متد در صحنه فیلمبرداری شهرت دارد. اما حتی آرون سورکین، کارگردان «The Social Reckoning» از اینکه چگونه All-in Strong توانست مارک زاکربرگ را تجسم کند شگفت زده شد. سورکین که با این بازیگر تحسین‌شده در دو تلاش قبلی‌اش برای کارگردانی کار کرده بود، «بازی مولی» و «محاکمه شیکاگو 7»، وقتی استرانگ در صحنه «حساب اجتماعی» ظاهر شد و مانند بنیان‌گذار فیس‌بوک صحبت می‌کرد، شوکه نشد. اما سورکین هرگز تصور نمی کرد که استرانگ در نهایت به یک مدافع سرسخت زاکربرگ تبدیل شود. سورکین به Business Insider گفت: «می دانستم که او بازیگر بسیار جذابی است. \"من هرگز نشنیدم که او از صدای خودش استفاده کند. او فقط به عنوان مارک صحبت می کرد، او فقط مانند مارک رفتار می کرد. اما من انتظار نداشتم که او مدافع ثابت مارک باشد. نه فقط در صحنه فیلمبرداری، بلکه ایمیل هایی که من در شب در هتل دریافت می کردم.\" سورکین گفت که این موضوع حتی در مراحل پس از تولید هم ادامه پیدا کرد، زمانی که استرانگ که هنوز در نقش زاکربرگ حضور داشت، با کارگردانش بر سر یک خط در فیلم بحث کرد. \"The Social Reckoning\" داستان کارمند سابق فیس بوک را روایت می کند که به افشاگری تبدیل شده بود، فرانسیس هاگن (مایکی مدیسون) که صدها هزار سند را به جف هورویتز (جرمی آلن وایت) خبرنگار وال استریت ژورنال فاش کرد که نشان می"}, {"source": "Business Insider", "title": "This entrepreneur says Amazon nearly destroyed his business. He still shops on it every week. 'It's crazy.'", "link": "https://www.businessinsider.com/he-says-amazon-nearly-wrecked-bedscrunchie-business-still-shop-amazon-2026-10", "summary": "Business Insider Jack Nekhala's Bed Scrunchie sales faced a major hit after Amazon deactivated his seller account. Nekhala says the loss left the founders in debt, yet he still shops on Amazon several times a week. The habit bothers him more than he can explain. Jack Nekhala has every reason to stop shopping on Amazon . His company, Bed Scrunchie, generated about $4.5 million in 2024 and was on track for more, Nekhala said. However, Amazon deactivated its seller account just before the holidays that year, cutting off its biggest sales channel. \"Once the collapse happened through Amazon, it basically collapsed the entire business,\" Nekhala told Business Insider for our So Expensive video series. That makes his next admission harder to say. \"I still shop on Amazon ,\" Nekhala said. \"I have a daughter. She needs bikes. She needs a scooter, she needs all sorts, she needs different things. And that's the place we go to.\" He said he shops on Amazon two to three times a week and sometimes has several orders in a single day. The habit bothers him more than he can explain, he said. \"Continuing to shop there feels like being forced to sit down to dinner with the institution that upended your life.\" Founders of the Bed Scrunchie: Jack Nekhala (left) and Michael Nusinkis (right). Courtesy of Jack The account shutdown, he said, left him and his business partner carrying debt and trying to rebuild the financial security they had spent nearly 20 years creating for their young families. \"My life has not been the same,\" he said. For Nekhala, his Amazon shopping habit reflects how deeply the online marketplace has become embedded in everyday life. In a recent survey of shoppers across the US and Europe, 75% of consumers said they buy from Amazon at least once a month. \"I do not shop there because I have forgiven what happened. I shop there because Amazon has made itself so convenient and embedded in everyday life that even people who feel harmed by it continue to depend on it,\" Nekhala said. \"It's crazy,\" he added of his own shopping habits . \"It's really incredible what they've accomplished.\" Amazon became the default Jack Nekhala launched his Bed Scrunchie product in 2019. Business Insider The appeal of Amazon isn't just price. It's the convenience, Nekhala said. Amazon already has his payment information, shipping addresses, and purchase history. Adding one more item to an order is often easier than creating an account somewhere else, he said. \"They remove all the frictio", "date_str": "2026-10-12T18:47:22+00:00", "hash": "64e3b9a2f993f9be", "title_fa": "این کارآفرین می گوید که آمازون تقریباً تجارت او را نابود کرده است. او هنوز هر هفته از آن خرید می کند. این دیوانه است.", "summary_fa": "پس از اینکه آمازون حساب فروشنده او را غیرفعال کرد، فروش Bed Scrunchie جک نخالا با ضربه بزرگی مواجه شد. نخالا می‌گوید این ضرر بنیانگذاران را بدهکار کرده است، با این حال او هنوز چندین بار در هفته از آمازون خرید می‌کند. این عادت بیش از آن که بتواند توضیح دهد او را آزار می دهد. جک نخالا دلایل زیادی برای توقف خرید در آمازون دارد. نخالا گفت که شرکت او، Bed Scrunchie، در سال 2024 حدود 4.5 میلیون دلار درآمد داشت و در مسیر رشد قرار داشت. با این حال، آمازون حساب فروشنده خود را درست قبل از تعطیلات همان سال غیرفعال کرد و بزرگترین کانال فروش خود را قطع کرد. Nekhala برای مجموعه ویدیویی So Expensive ما به Business Insider گفت: «زمانی که سقوط از طریق آمازون اتفاق افتاد، اساساً کل تجارت را از بین برد. این امر بیان پذیرش بعدی او را سخت تر می کند. نخالا گفت: \"من هنوز از آمازون خرید می کنم.\" \"من یک دختر دارم. او به دوچرخه نیاز دارد. او به یک اسکوتر نیاز دارد، او به همه نوع نیاز دارد، او به چیزهای مختلف نیاز دارد. و این همان جایی است که ما به آنجا می رویم.\" او گفت که هفته ای دو تا سه بار از آمازون خرید می کند و گاهی اوقات چندین سفارش در یک روز دارد. او گفت: \"این عادت بیشتر از آن که بتواند توضیح دهد او را آزار می دهد.\" با حسن نیت از جک، او گفت که بسته شدن حساب باعث شد او و شریک تجاری اش بدهی داشته باشند و سعی کنند امنیت مالی را که نزدیک به 20 سال صرف ایجاد خانواده های جوان خود کرده بودند، بازسازی کنند. او گفت: «زندگی من مثل قبل نبوده است. برای Nekhala، عادت خرید او از آمازون نشان می دهد که بازار آنلاین چقدر عمیق"}, {"source": "Business Insider", "title": "Meta says it's launching the biggest and best AI models it has ever built", "link": "https://www.businessinsider.com/meta-launches-muse-wonder-series-to-rival-anthropic-openai-models-2026-10", "summary": "Meta CEO Mark Zuckerberg. Chris Unger/Zuffa LLC Meta says its latest AI models have finally caught up with its rivals. Meta tailored its models, Muse Wonder and Wonder Full, for work and completing multi-step tasks. Meta CEO Mark Zuckerberg teased the release by posting a photo of a watermelon. Meta has launched a new series of AI models, Muse Wonder, that it says has caught up to labs like Anthropic and OpenAI. \"Muse Wonder is a much larger and more advanced class of models that brings us to the frontier,\" CEO Mark Zuckerberg posted on X on Monday. It’s the latest sign that Meta’s big bet on AI — which has raised questions from investors — is paying off after the launch of its personal AI assistant, Muse . Meta is spending hundreds of billions of dollars on AI, prompting some investor doubts earlier this year. The Wonder series comes in two versions: Muse Wonder, a smaller, fast model Meta expects people to use for daily work, and Wonder Full, a larger and more capable version, the company said in a statement. Meta built its new AI models to complete complex multi-step tasks, such as disputing an insurance claim. To handle that, the AIs have features such as memory and the ability to try alternative approaches. The Muse Wonder series was internally codenamed Watermelon, according to a person familiar with the matter. In July, Business Insider reported that Meta AI chief Alexandr Wang had told staff that Watermelon had caught up to OpenAI. \"Watermelon uses an order of magnitude more compute than Avocado,\" he said at the time, referring to Meta's codename for Muse Spark, a prior family of models. In the lead-up to Muse Wonder's launch, Zuckerberg and other Meta employees teased the release with watermelon-themed posts: Muse ordered me 🍉 how thoughtful! pic.twitter.com/1M2lImJdkB — Mark Zuckerberg (@finkd) October 12, a, these are the tips and tricks that will help you get the most out of Proton Pass. Create a separate shareable vault in Proton Pass for guests Password managers offer a secure alternative to writing down wifi passwords and other logins or sending them via text. In Proton Pass, you can create a separate vault specifically for your home and share a limited list of credentials such as guest wifi, smart lock codes, and streaming information with visitors. Vaults can be set as view only, and you can revoke access at any time. Users without a Proton Pass account receive a shared link, which can be set to expire after a specific amount of time or number of views. Build an emergency kit vault in Proton Pass to share with trusted contacts Another use case for separate vaults is as an \"in case of emergency\" selection of items that you can share with trusted contacts. For paid users, Proton Pass has a dedicated emergency access feature, which lets up to five contacts of your choice get into your account after a dedicated waiting period in the event of your illness or death. Alternatively, you can set up a vault that contains only specific items, such as logins or secure notes, and share it with those who may need the information if you are incapacitated or unreachable. Remember that guest access can be set to expire or revoked at any time. Use custom hidden fields to protect security answers and PIN codes When you create an item in Proton Pass, you have the option to add custom fields, which allow you to save additional information relevant to your credential, such as text notes and 2FA codes. You can also select a Hidden field, which masks the text by default until you reveal it (similar to how passwords are masked). This prevents someone from looking over your shoulder and catching sight of sensitive information, such as security question answers and PINs. Custom fields are available on paid Proton plans. Create burner identities for online shopping by combining email aliases and virtual cards A Proton Pass selling point is its hide-my-email alias feature, which generates a unique email address when you sign up for a new account. Email aliases forward to your main inbox, but they prevent you from having ", "date_str": "2026-10-12T20:30:09+00:00", "hash": "0be3b3d3de98ac77", "title_fa": "10 هک که هر کاربر پاس پروتون باید بداند", "summary_fa": "امیلی لانگ یک نویسنده مستقل در سالت لیک سیتی است. پس از فارغ التحصیلی از دانشگاه دوک، او چندین سال را صرف گزارش در مورد نیروی کار فدرال برای دولت اجرایی، نشریه شرکت رسانه آتلانتیک، در واشنگتن دی سی کرد. او تقریباً یک دهه تجربه به عنوان فریلنسر در پوشش فناوری (از جمله مسائل مربوط به امنیت، حریم خصوصی، و جریان) و همچنین امور مالی شخصی و سفر دارد. علاوه بر Lifehacker، کارهای او در Wirecutter، Toms Guide و ZDNET نیز نمایش داده شده است. امیلی همچنین به عنوان راهنمای سفر در سراسر ایالات متحده و به عنوان یک ویرایشگر محتوا کار کرده است. او فوق لیسانس مددکاری اجتماعی دارد و یک درمانگر مجاز در یوتا است. به عنوان منبع ترجیحی در Google اضافه کنید به عنوان منبع برگزیده در اعتبار Google اضافه کنید: فهرست مطالب Ian Moore/Lifehacker/Proton Pass Proton Pass برنامه مدیریت رمز عبور از Proton متمرکز بر حریم خصوصی است (که مجموعه ابزارهای آن شامل Proton Mail و Proton VPN نیز می شود). چه در حال حاضر کاربر پروتون هستید یا به دنبال یک مدیر رمز عبور جدید برای ذخیره ایمن اعتبار و سایر داده های خود هستید، اینها نکات و ترفندهایی هستند که به شما کمک می کنند حداکثر استفاده را از Proton Pass ببرید. مدیران رمز عبور جایگزینی امن برای نوشتن رمزهای عبور وای فای و سایر ورودها یا ارسال آنها از طریق متن ارائه می دهند. در Proton Pass، می توانید یک خزانه جداگانه به طور خاص برای خانه خود ایجاد کنید و لیست محدودی از اعتبارنامه ها مانند وای فای مهمان، کدهای قفل هوشمند و اطلاعات جریانی را با بازدیدکنندگان به اشتراک بگذارید. خزانه‌ها را می‌توان فقط به‌عنوان مشاهده تنظیم کرد و می‌توانید در هر زمان دسترسی را لغو کنید. کاربران بدون حساب Proton Pass یک پیوند مشترک دریافت می کنند که می تواند"}, {"source": "Lifehacker", "title": "Why the Treadmill Can Feel So Much Easier Than Running Outside (but It Actually Isn't)", "link": "https://lifehacker.com/health/why-treadmill-running-is-not-easier-than-running-outside?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Is the treadmill harder or easier than running outdoors? Survey runners, and you ll get plenty of different opinions on which feels harder or easier, but the basic physics of running are the same on both. (I promise.) So why do people who are used to treadmills find that they re suddenly slower when they run outdoors? I m going to run through the factors that are at play here, and talk about how to adapt if you want to be able to enjoy both. NordicTrack T Series Treadmill $744.90 at Amazon $799.00 Save $54.10 Get Deal Get Deal $744.90 at Amazon $799.00 Save $54.10 Why treadmills sometimes feel harder than running outside If you find treadmill running harder, you probably already know the reason: It s boring . You have nothing to distract you from your own effort and the glowing numbers telling you how little progress you ve made. This is a problem that we can train our brains to solve for us over time , whether with distractions, mindfulness, or simply being grateful that we re not outdoors in the bad weather. The treadmill does not move your feet Physics-wise, running on a treadmill is pretty much identical to running outdoors in identical conditions. It is not true that the treadmill \"moves your feet,\" as I have seen runners claim. Running is the action of pushing off the ground to move yourself forward relative to the ground. If the treadmill moves your feet theory were correct, would we not have to consider the rotating Earth its own sort of treadmill? And thus it would be 2,000 times harder to run west than to run east? In reality, you have to spend just as much effort to stay in place on a treadmill going 6.5 miles per hour, as you do to move forward at 6.5 miles per hour on flat, steady ground. In other words: in both scenarios, you are asking your muscles to push off with a force that will keep you moving 6.5 mph faster than the ground. Physics is not the reason why the treadmill feels different. You only need to add a 1% incline if you are running very fast Then there s the issue of wind resistance. Some runners will say you need to set the treadmill s incline to 0.5% or 1% to mimic outdoor air resistance. Even on a calm day, your body has to push into the air to keep moving. Adding a small incline to the treadmill is supposed to mimic that extra effort. But that is only true if you run at a pace of 7:30 per mile (8.0 mph) or faster. Below that, the difference is so small as to be meaningless, a sc", "date_str": "2026-10-12T20:00:00+00:00", "hash": "2e8ea582c336cb3e", "title_fa": "چرا تردمیل می تواند بسیار آسان تر از دویدن در بیرون باشد (اما در واقع اینطور نیست)", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. آیا تردمیل سخت تر یا آسان تر از دویدن در فضای باز است؟ با نظرسنجی در مورد دوندگان، نظرات مختلفی را دریافت خواهید کرد که در مورد آنها سخت تر یا آسان تر است، اما فیزیک اساسی دویدن در هر دو یکسان است. (قول می دهم.) پس چرا افرادی که به تردمیل عادت دارند، وقتی در فضای باز می دوند، متوجه می شوند که ناگهان کندتر می شوند؟ من قصد دارم عواملی را که در اینجا نقش دارند بررسی کنم و در مورد اینکه اگر می خواهید از هر دو لذت ببرید، چگونه سازگار شوید صحبت خواهم کرد. تردمیل سری NordicTrack T 744.90 دلار در آمازون 799.00 دلار صرفه جویی 54.10 دلار دریافت معامله دریافت معامله 744.90 دلار در آمازون 799.00 دلار پس انداز 54.10 دلار چرا تردمیل ها گاهی اوقات سخت تر از دویدن در بیرون هستند اگر متوجه شدید تردمیل سخت تر می دود، احتمالاً دلیل آن را می دانید. شما چیزی ندارید که حواس شما را از تلاش خود و اعداد درخشان که به شما می گوید چقدر پیشرفت کمی داشته اید منحرف کند. این مشکلی است که می‌توانیم مغزمان را آموزش دهیم تا در طول زمان آن را حل کند، چه با حواس‌پرتی، تمرکز حواس، یا به سادگی از اینکه در هوای بد بیرون نیستیم. از نظر فیزیک، تردمیل پاهای شما را حرکت نمی دهد، د
