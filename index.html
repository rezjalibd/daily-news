<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <title>مجله خبری روزانه — ۲۵ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۲۵ آبان ۱۴۰۵</span>

    <div class="tabs">

      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

, "summary_fa": "سه مرد در اردن به جرم دست داشتن در تیراندازی مرگبار به یک کلیسا در حدود سه هفته پیش، به اعدام محکوم شدند. این حمله ۲۳ اکتبر رخ داد و ۹ نفر کشته و ۳۴ نفر زخمی شدند. قربانیان در مراسم تشییع یک مسیحی در یک کلیسای ارتدوکس یونانی در استان کرک حضور داشتند. نیروهای مسلح اردن امروز، یکشنبه ۱۵ نوامبر، در بیانیه‌ای اعلام کردند که این افراد به ارتکاب «اقدامات تروریستی» و همچنین نگهداری سلاح، «ترویج اندیشه‌های یک سازمان تروریستی» و «توطئه برای ارتکاب اقدامات تروریستی» محکوم شده‌اند. این سه مرد، دو برادر اردنی و شوهرخواهرشان، پس از حمله از محل گریختند و سه روز بعد دستگیر شدند. هویت آنها اعلام عمومی نشده است. استان کرک میزبان جمعیت مسیحی قابل‌توجهی در کشور عمدتا مسلمان اردن است. تصاویر دوربین‌های مداربسته از روز حمله، سه مرد مسلح را نشان می‌دهد که به کلیسای سنت جورج در روستای حمود نزدیک می‌شوند و به آن تیراندازی می‌کنند. در ویدئوی دیگری کشته‌شدگان و افراد زخمی در میان آشفتگی محوطه کلیسا روی زمین دیده می‌شوند. هنوز مشخص نیست که چرا مهاجمان آن کلیسا را برای حمله انتخاب کردند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. اندکی پس از این حمله، ملک عبدالله دوم، پادشاه اردن، در شبکه اجتماعی ایکس نوشت: «حمله تروریستی به کرک با شدیدترین واکنش تلافی‌جویانه روبه‌رو خواهد شد. کسانی که به‌اشتباه تصور می‌کنند می‌توانند با گلوله‌ها بین اردنی‌ها تفرقه بیندازند، در برابر وحدت ما هیچ شانسی ندارند.» این سه مرد پس از تیراندازی گریختند و بعد داخل خانه‌ای متروکه در استان کرک، در جنوب امان، پایتخت، شناسایی شدند. اداره امنیت عمومی در آن زمان اعلام کرد که آنها حاضر به تسلیم نشدند و به نیروهای امنیتی تیراندازی کردند و هر سه در پاسخ نیروهای امنیتی مجروح شدند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/5221/live/2c940320-e110-11f1-a2d0-ff163dc3689d.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۲۴ آبان • ۱۹:۵۱"}, {"source": "BBC Persian", "title": "بزرگ‌ترین معمای فرمول یک؛ الماس ۳۰۰ هزار دلاری چگونه ناپدید شد؟", "link": "https://www.bbc.com/persian/a ر جنوبی تنگه هرمز منفجر شدند", "summary_fa": "روابط عمومی نیروی دریایی سپاه پاسداران روز یک‌شنبه ۲۴ آبان اعلام کرد دو نفتکش در مسیر «غیرمجاز» در جنوب تنگه هرمز، پس از برخورد با مین د ... بر اساس بیانیه سپاه، یکی از این دو شناور یک نفتکش غول‌پیکر (سوپر نفتکش) بوده که بیش از دو میلیون بشکه نفت خام حمل می‌کرده است. سپاه اعلام کرد این نفتکش پس از انفجار و آتش‌سوزی شدید در آب‌های جنوبی خلیج فارس غرق شده است. در این بیانیه ادعا شده است که هر دو نفتکش تحت حمایت ارتش آمریکا بوده‌اند و با خاموش‌کردن تمامی سامانه‌های شناسایی و موقعیت‌یاب قصد عبور از مسیر غیرمجاز تنگه هرمز را داشته‌اند. سپاه نام این کشتی‌ها و مبدا حرکت آن‌ها را اعلام نکرده است. این ادعا در حالی مطرح می‌شود که ارتش آمریکا پیش‌تر بارها از پاک‌سازی مین‌ها از مسیرهای اصلی کشتیرانی در تنگه هرمز خبر داده است. تهران در هفته‌های اخیر چندین بار از آتش‌سوزی در کشتی‌های عبوری از تنگه هرمز خبر داده و در برخی موارد برخورد این شناورها با مین دریایی را علت حادثه اعلام کرده است. فرماندهی مرکزی ایالات متحده (سنتکام) نیز که مسوولیت نظارت بر عملیات نظامی آمریکا در منطقه را بر عهده دارد، از تردد کشتی‌ها در این آبراه پشتیبانی می‌کند. سنتکام روز شنبه اعلام کرد نیروهای نظامی آمریکا از عبور بیش از یک میلیارد و ۷۰۰ میلیون بشکه نفت خام از تنگه هرمز حمایت کرده‌اند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/8_UXIR__v1024x512__box_0%2C693%2C1200%2C1325.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۲۴ آبان • ۱۸:۳۹"}, {"source": "IranWire", "title": "فریبا اسدی، فعال مدنی، به شش سال حبس محکوم شد", "link": "https://iranwire.com/fa/news-1/160271-%D9%81%D8%B1%DB%8C%D8%A8%D8%A7-%D8%A7%D8%B3%D8%AF%DB%8C-%D9%81%D8%B9%D8%A7%D9%84-%D9%85%D8%AF%D9%86%DB%8C-%D8%A8%D9%87-%D8%B4%D8%B4-%D8%B3%D8%A7%D9%84-%D8%AD%D8%A8%D8%B3-%D9%85%D8%AD%DA%A9%D9%88%D9%85-%D8%B4%D8%AF/", "summary": "فریبا اسدی، فعال مدنی و از بازداش ur lives. After about three aisles, I noticed this woman. Older, alone, watching us. Staring at us. I was so conceited about my sons that I assumed she was charmed by us until she walked over and said, \"Are all of these children yours?\" I was 30 years old. Young for this many children or really any children at all. I told her yes, these were my sons, and she dropped the same three words I have since come to loathe with every fiber of my being. \"You poor thing.\" Said always with a cluck of the tongue or a sad shake of the head. My children, always within earshot, told in so many words and so many ways that they were less valuable because they were many and I was one. An unwanted death knell to the happy, regular life we were enjoying mere moments ago. I heard this so often A version of this conversation happened with absurd frequency when my sons were growing up. Strangers would notice that I was on my own with four sons and that I needed to get the details. \"Are all these yours?\" was often the opening salvo. A question that was no one's business, a question that turned my sons, my lovely, funny, beautiful boys, into things. I always answered, I'm not sure why. Maybe I hoped for a different response , a positive affirmation of what I saw. \"Wow, they're all so good!\" or \"They all look so much like you,\" or some other compliment to warm me and bolster me or keep me going. Because it was not easy raising the boys on my own . We never had any money, no matter how many jobs I worked. We rented houses we could barely afford and sometimes couldn't afford at all. We moved a lot. We lost so many little heirlooms in those moves, which breaks my heart to this day. We rarely had a car. We walked everywhere. It was lonely to be a single mom It was lonely too, raising the boys on my", "date_str": "2026-11-15T16:49:01+00:00", "hash": "4592630a5b5a5b5c", "title_fa": "من یک مادر مجرد 4 پسر بودم. سخت ترین قسمت همیشه پول یا خستگی نبود، بلکه قضاوت بود.", "summary_fa": "نویسنده e \"Saturday Night Live\" cast poked fun at the Nvidia scandal this week. Jensen Huang resigned as Nvidia's CEO last week after admitting to an affair. Former 'SNL' cast member Bowen Yang returned to play Huang: \"It's me. Jensen 'hide your wife' Huang.\" This week's \"Saturday Night Live\" cold open was a who's-who of the AI revolution. Comedian John Mulaney kicked off the episode by playing a CIA officer conducting national security training for tech billionaires. Specifically, how to identify a spy. Mulaney's character is joined by Palantir cofounder Peter Thiel (James Austin Johnson), OpenAI CEO Sam Altman (Ben Marshall), Anthropic CEO Dario Amodei (Jane Wickline), Meta CEO Mark Zuckerberg (Andrew Dismukes), and SpaceX CEO Elon Musk (Jeremy Culhane). \"America needs you to learn the difference between a woman who actually wants to have sex with you, and a woman who is clearly a spy,\" Mulaney said. \"You all saw how former Nvidia CEO Jensen Huang resigned this week after he was caught having an affair with an alleged Chinese spy.\" Last Sunday, Nvidia's board of directors said it would investigate whether Huang was the \"target of a foreign intelligence effort\" on the same day he admitted to an extramarital affair in a memo to staff. Huang resigned from his position days later. On \"Saturday Night Live,\" Mulaney's character empathized with the tech billionaires. \"Look, I can't imagine how disorienting this has been for you. To go from these bug-eyed little weirdos to being gods,\" Mulaney said. \"Never in the history of our species have people as pale and as strange as you, A: survived, and B: been given all the world's wealth and power.\" Mulaney asked the tech executives why someone \"very beautiful\" would be interested in them. \"Because I have a good personality and normal, human mannerisms?\" Marshall's Altman said. Zuckerberg, played by Dismukes, guessed it's because \"she's comforted by my Meta glasses recording her at all times.\" Wickline's Amodei theorized it's because \"she's using me... for my body.\" Mulaney then asked the group to pretend an attractive woman approached them at the bar and asked, \"What are you working on?\" Amodei and Zuckerberg weighed in. \"I would say, Madam, what a pleasure to see you this evening. May I interest you in an industry secret?\" Amodei said. Zuckerberg said he would \"as", "date_str": "2026-11-15T16:30:43+00:00", "hash": "db2833b8cf785231", "title_fa": "«SNL» جنسن هوانگ و میلیاردرهای فناوری دیگر را تقلید می‌کند: «می‌توانم شما را در یک راز صنعتی خوشحال کنم؟»", "summary_fa": "سریال Saturday Night Live به عنوان میلیاردرهای فناوری، ایلان ماسک، مارک زاکربرگ، داریو آمودی، سم آلتمن و پیتر تیل به ایفای نقش پرداختند. شنبه شب زنده / NBC جان مولانی و بازیگران \"Saturday Night Live\" رسوایی انویدیا این هفته را مسخره کردند. جنسن هوانگ هفته گذشته پس از اعتراف به یک رابطه نامشروع از سمت مدیرعاملی انویدیا استعفا داد. Bowen Yang یکی از بازیگران سابق SNL برای بازی در نقش هوانگ بازگشت: \"این من هستم. Jensen همسرت را پنهان کن\" هوانگ.\" برنامه «شنبه‌شب زنده» این هفته باز سرد، از انقلاب هوش مصنوعی کیست. جان مولانی، کمدین، این اپیزود را با بازی در نقش افسر سیا که آموزش امنیت ملی را برای میلیاردرهای فناوری برگزار می کرد، آغاز کرد. به طور خاص، چگونه یک جاسوس را شناسایی کنیم. پیتر تیل، بنیانگذار Palantir (جیمز آستین جانسون)، مدیر عامل OpenAI سام آلتمن (بن مارشال)، مدیر عامل آنتروپیک، داریو آمودی (جین ویکلین)، مدیر عامل متا، مارک زاکربرگ (اندرو دیسموکس)، و مدیر عامل اسپیس ایکس، ایلان ماسک‌هان، به شخصیت مولانی پیوستند. مولانی گفت: «آمریکا به شما نیاز دارد که تفاوت بین زنی که واقعاً می‌خواهد با شما رابطه جنسی داشته باشد و زنی که به وضوح جاسوس است را بیاموزید. \"همه شما دیدید که چگونه جنسن هوانگ، مدیر عامل سابق انویدیا، این هفته پس از اینکه با یک جاسوس چینی رابطه نامشروع داشت، استعفا داد.\" یکشنبه گذشته، هیئت مدیره انویدیا گفت که در همان روزی که هوانگ در یادداشتی به کارکنان خود به رابطه خارج از ازدواج خود اعتراف کرد، بررسی خواهد کرد که آیا هوانگ \"هدف یک تلاش اطلاعاتی خارجی\" بوده است یا خیر. هوانگ چ o Find N6: این تاشوها چگونه با هم مقایسه می شوند", "summary_fa": "صحنه تلفن های هوشمند تاشو در حال انفجار است زیرا اپل به تازگی اعلام کرده است که بالاخره وارد عرصه می شود. در اینجا نحوه مقایسه iPhone Duo با Oppo Find N6 آمده است. لولاهای مختلف، اولویت‌های متفاوت، همان ضربه غول‌پیکر در پس‌انداز شما. سام رادرفورد مت اسمیت برای Engadget افزودن Engadget در Google: منبع ترجیحی Google Discover بازار گوشی‌های تاشو اکنون بسیار جالب‌تر شده است که اپل رسما (بالاخره) با iPhone Duo وارد بازار شد. Find N6 Oppo از زمان عرضه بهار 2026 مورد توجه قرار گرفته است، و هر دو تلفن نشان دهنده تلاش های مهندسی جدی برای حل یک مشکل هستند: بسته بندی یک صفحه نمایش به اندازه تبلت در چیزی که در جیب شما قرار می گیرد. اما این دو تاشو رویکردهای متفاوتی دارند. iPhone Duo به زبان طراحی امضای اپل و ادغام اکوسیستم متکی است، در حالی که Find N6 مرزهای نازکی و وضوح دوربین را جابجا می کند. این مقایسه به طراحی، نمایشگر، دوام، دوربین‌ها، عملکرد، باتری، نرم‌افزار و قیمت‌ها می‌پردازد تا بفهمد کدام تاشو سزاوار جایگاهی در جیب شماست. باید اشاره کنیم که در این برهه از زمان، iPhone Duo هنوز عرضه نشده است، بنابراین بیش از چند تجربه عملی به طور کامل آزمایش نشده است. برای یکسان کردن زمین بازی، ما به مشخصات روی کاغذ برای این قطعه مقایسه می‌مانیم. سم رادرفورد برای Engadget هر دو دستگاه از طراحی آشنای تاشو به سبک کتاب استفاده می‌کنند، اما نسبت‌های آنها تا حدی متفاوت است. آیفون Duo دارای صفحه نمایش بیرونی 5.4 اینچی و صفحه نمایش داخلی 7.6 اینچی است. پنل داخلی از فناوری OLED با پشتیبانی از ProMotion 120 هرتز، HDR10 و Dolby Vision به‌علاوه حداکثر روشنایی تا 3000 نیت استفاده می‌کند. پنل بیرونی، در حالی که کوچکتر است، دارای همان صفحه نمایش OLED است.", "image_url": "https://www.engadget.com/img/gallery/iphone-duo-vs-oppo-find-n6-how-these-foldables-compare/l-intro-1793990461.jpg", "category": "موبایل و گجت‌ها", "tags": ["Google", "Apple"], "datetime_fa": "۲۴ آبان • ۱۹:۰۰"}, {"source": "Engadget", "title": "How much electricity does your home sound system typically use?", "link": "https://www.engadget.com/2313696/how-much-electricity-sound-system-uses/", "summary": "A home sound system is a great upgrade, but it does use electricity which means you re paying for the power. Here s how to measure how much power it s using.", "date_str": "2026-11-15T15:15:00+00:00", "hash": "9241b2c372a2c453", "title_fa": "سیستم صوتی خانه شما معمولا چقدر برق مصرف می کند؟", "summary_fa": "سیستم صوتی خانگی یک ارتقاء عالی است، اما از برق استفاده می کند که به این معنی است که شما هزینه برق را پرداخت می کنید. در اینجا نحوه اندازه گیری میزان مصرف برق آورده شده است. چگونه در مورد مصرف انرژی سیستم صوتی خانه خود فکر کنید و اندازه گیری کنید. Grassetto/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover با ادامه افزایش هزینه‌های انرژی، مصرف‌کنندگان آگاه به هزینه باید مصرف انرژی خود را مدیریت کنند. در حالی که نیازهای برق متفاوت است، یک سیستم صوتی خانگی معمولی از 20 تا 50 وات در حالت آماده به کار استفاده می کند که در حداکثر صدا به 200 وات افزایش می یابد. اما بسیاری از تنظیمات معمولی نیستند، بنابراین چگونه تنظیمات خود را ارزیابی می کنید؟ اجزای اصلی صوتی مانند صفحه‌های گردان و پخش‌کننده‌های سی‌دی کمترین انرژی را مصرف می‌کنند، اما ارتباط مستقیمی بین حجم پخش و مصرف انرژی وجود دارد. هر چه بلندتر بروید، انرژی بیشتری نیاز دارد. علاقه‌مندان به شنوایی که از ترکیبات باطنی از تجهیزات پیشرفته و فناوری آنالوگ قدیمی (به ویژه تقویت‌کننده‌ها) استفاده می‌کنند، ممکن است هزینه‌های بیشتری برای اجرای سیستم خود داشته باشند. به طور مشابه، اسپیکرهایی که به طور مستقل تغذیه می شوند، ذاتاً انرژی بیشتری نسبت به آنهایی که مستقیماً از آمپلی فایر برق می گیرند، مصرف می کنند، و سیستم های سینمای خانگی بزرگ تمایل دارند حتی انرژی بیشتری مصرف کنند. همچنین این درست است که وصل کردن هر یک از اجزای سیستم که با باتری کار می‌کنند می‌تواند سلول‌های برق را به مرور زمان کاهش دهد، اگرچه اکثر اسپیکرهای جریان مدرن برای این کار طراحی شده‌اند. شارژرهای USB حتی در حالت استندبای که به برق وصل می‌شوند، برق مصرف می‌کنند که در کل خانه شما جمع می‌شود. Nanci Santos/Getty Images برای اندازه‌گیری تنظیمات خود، ابتدا اجزای آن را فهرست کنید", "image_url": "https://www.en 10 نمودار برتر خود با کمان شماره 4 BLOW UP دست می یابد. جدول بیلبورد 200 محبوب ترین آلبوم های هفته را در ایالات متحده رتبه بندی می کند. بر اساس مصرف چند متری اندازه گیری شده در واحدهای آلبوم معادل، گردآوری شده توسط Luminate. واحدها شامل فروش آلبوم، آلبوم‌های معادل آهنگ (TEA) و پخش آلبوم‌های معادل (SEA) هستند. هر واحد معادل یک فروش آلبوم، یا 10 آهنگ منفرد فروخته شده از یک آلبوم، یا 2500 پخش صوتی و تصویری رسمی با پشتیبانی آگهی یا 1000 پخش صوتی و تصویری رسمی بر اساس تقاضای پولی/اشتراک تولید شده توسط آهنگ‌های یک", "image_url": "https://www.billboard.com/wp-content/uploads/2026/06/olivia-rodrigo-press-olivia-parker-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۴ آبان • ۲۳:۳۰"}, {"source": "Billboard", "title": "‘SNL’ Sets December Return With Amanda Seyfried as Host & Don Toliver as Musical Guest", "link": "https://www.billboard.com/culture/tv-film/snl-amanda-seyfried-don-toliver-december-2026-1236382445/", "summary": "Saturday Night Live will return in December with two first-timers taking the stage. Amanda Seyfried will make her hosting debut, while Don Toliver will perform as musical guest for the first time during the Dec. 5 episode. Related Phoebe Bridgers Stuns With Haunting Black-Light Skeleton Performance on SNL : Watch Don Toliver on Working With Travis Scott, Life With Kali Uchis Rock Hall Ambitions 2027 Grammy Nominations Final Predictions: Best New Artist The NBC sketch comedy series is taking a three-week break following its Nov. 14 episode, hosted by John Mulaney with musical guest Phoebe Bridgers . Seyfried s hosting debut comes amid a busy stretch for the actress, who recently appeared in Nathan Fielder and Lance Oppenheim s You Can See Everything , the documentary about former Theranos CEO Elizabeth Holmes. Toliver s SNL debut follows a milestone year for the Houston-born rapper and singer, who has continued teasing his next project, NITROUS , most recently with the release of “Party With the Boys.” The upcoming album follows OCTANE , which debuted at No. 1 on the Billboard 200 in February, marking his first chart-topper. He later took the project on a North American arena tour and teamed up with Drake on tracks “Cold Shoulder” and “Solar Eclipse.” Toliver also graced the cover of Billboard in March 2026, discussing his career, creative process and rise in hip-hop. He is also among the artists featured in Billboard s early predictions for the 2027 Grammy Awards best new artist category. The upcoming episode will be part of SNL s 52nd season, which premiered Sept. 26 with New York Knicks star Jalen Brunson making his hosting debut and KATSEYE serving as musical guest. Since then, the show has welcomed Dakota Johnson, Shane Gillis, Inde Navarrette, Druski and Mulaney as hosts, with Turnstile, Rosalía, Gracie Abrams, The Strokes and Bridgers among the season s musical guests. see you on dec 5th! pic.twitter.com/ihPJuAeBIQ Saturday Night Live (@nbcsnl) November 15, 2026", "date_str": "2026-11-15T19:14:59+00:00", "hash": "f68f0810d1ba9161", "title_fa": "«SNL» با آماندا سیفرید به عنوان میزبان و دان تولیور به عنوان مهمان موزیکال، بازگشت دسامبر را تنظیم می کند.", "summary_fa": "شنبه نایت لایو در ماه دسامبر با دو نفر برای اولین بار روی صحنه بازخواهد گشت. آماندا سیفرید اولین میزبانی خود را خواهد داشت، در حالی که دان تولیور به عنوان مهمان موسیقی برای اولین بار در قسمت 5 دسامبر اجرا خواهد کرد. فیبی بریجرز مرتبط با اجرای اسکلت سیاه-نور خارق العاده در SNL شگفت زده می شود: دان تولیور را در کار با تراویس اسکات تماشا کنید، زندگی با کالی اوچیس راک هال جاه طلبی ها 2027 نامزدهای گرمی پیش بینی های نهایی: بهترین هنرمند جدید سریال کمدی اسکچ NBC به مدت سه هفته با اجرای موسیقی 1 پخش می شود. مهمان فیبی بریجرز اولین میزبانی سایفرید در بحبوحه فعالیت‌های پرمشغله‌ای برای این بازیگر انجام می‌شود که اخیراً در مستندی درباره الیزابت هولمز، مدیر عامل سابق Theranos، ناتان فیلدر و لنس اوپنهایم، شما می‌توانید همه چیز را ببینید، ظاهر شد. اولین بازی Toliver SNL به دنبال یک سال مهم برای رپر و خواننده متولد هیوستون است که به اجرای پروژه بعدی خود، NITROUS، اخیراً با انتشار \"Party With the Boys\" ادامه داده است. آلبوم آتی دنباله‌دار OCTANE است که اولین بار در رتبه‌ی شماره‌ی اول عرضه شد. 1 در بیلبورد 200 در ماه فوریه، اولین بار او را در جدول برتر قرار داد. او بعداً این پروژه را در یک تور در آمریکای شمالی شرکت کرد و با دریک در آهنگ‌های «شانه سرد» و «خورشید گرفتگی» همکاری کرد. تولیور همچنین در مارس 2026 جلد بیلبورد را زیبا کرد و در مورد حرفه، روند خلاقیت و ظهور خود در هیپ هاپ صحبت کرد. او همچنین در میان هنرمندانی است که در پیش‌بینی‌های اولیه بیلبورد برای جایزه گرمی 2027 بهترین هنرمند جدید حضور دارند. قسمت آینده بخشی از فصل 52 SNL خواهد بود، که در 26 سپتامبر با حضور Jalen Brunson، ستاره نیویورک نیکز، اولین میزبانی خود و KATSEYE به عنوان", "image_url": "https://www.billboard.com/wp-content/uploads/2026/03/cover-don-toliver-billboard-2026-bb3-daniel-prakopcyk-5-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۴ آبان • ۲۲:۴۴"}, {"source": "Deadline", "title": "Kevin Feige Felt Bringing X-Men Into ‘Avengers’ Franchise Was “Fun Way” To Celebrate 25 Years", "link": "https://deadline.com/2026/11/kevin-feige-x-men-avengerss-fun-way-celebrate-25-years-1237224515/", "summary": "As Avengers: Doomsday assembles into theaters next month, Kevin Feige is celebrating more than 25 years of Marvel s cinematic journey. The Marvel Studios president, who was also an associate producer on 2000 s X-Men, recently explained that it just felt right to bring the mutant superherhoes of Xavier s School for Gifted Youngsters into the MCU with [ ]", "date_str": "2026-11-15T19:21:52+00:00", "hash": "8f52699bb5f65053", "title_fa": "کوین فایگ احساس کرد آوردن مردان ایکس به فرانچایز «انتقام‌جویان» برای جشن ۲۵ سالگی «راهی سرگرم‌کننده» بود.", "summary_fa": "در حالی که Avengers: Doomsday ماه آینده وارد سینماها می شود، کوین فایج بیش از 25 سال از سفر سینمایی مارول را جشن می گیرد. رئیس استودیوی مارول، که یکی از تهیه‌کنندگان فیلم مردان ایکس در سال 2000 نیز بود، اخیراً توضیح داد که درست به نظر می‌رسد که ابرقهرمان‌های جهش‌یافته مدرسه Xaviers School for Gifted Youngsters را با [ ] به MCU بیاوریم. Feige به Empire توضیح داد که احساس درستی داشت. احساس می‌کردم راهی سرگرم‌کننده برای به اوج رسیدن یک ربع قرن داستان‌گویی است. به کارگردانی برادران روسو، Avengers: Doomsday شاهد فروپاشی چندجهانی است که قهرمانان چندین زمین را وادار می‌کند تا علیه دکتر دووم (رابرت داونی جونیور)، از جمله ستارگان سری اصلی لایو اکشن مردان ایکس، متحد شوند. در ددلاین تماشا کنید پاتریک استوارت فقید (پروفسور ایکس)، ایان مک‌کلن (مگنتو)، ربکا رومین (مستیک)، جیمز ماردن (سیکلوپ)، آلن کامین (نایت‌کرولر) و کلسی گرامر (جانور) همگی برای ایفای نقش در فیلم Avengers: Doomsday سال گذشته قرارداد امضا کردند. در همین حال، کریستوفر ابوت (چارلز خاویر/پروفسور ایکس)، آدام درایور (ناتانیل میلبری/آقای شوم)، ایند ناوارت (سرکش)، مایا بوید (طوفان)، کیت کانر (سیکلوپ)، سدی سینک (ژان گری)، سامارا ویینگ (اما ژرمن) نقش آن‌ها را بر عهده می‌گیرند. نسل جدید جهش‌یافته‌های MCU در Jake Schreier's X-Men، که قرار است در 5 مه 2028 نمایش داده شود. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را خوشحال نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/X-MEN-Hugh-Jackman-James-Marsden-Patrick-Stewart-Halle-Berry-Famke-Janssen-2000.-TM-and-Copyri-MCDAVDO-WD014-1000.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۴ آبان • ۲۲:۵۱"}, {"source": "Rolling Stone", "title": "Slayer’s Tom Araya Pauses Concert to Reprimand Unruly Fans: ‘Maintain Yourself’", "link": "https://www.rollingstone.com/music/music-news/slayer-tom-araya-pauses-concert-reprimand-unruly-fans-1235658570/", "summary": "“We’re gonna pause until you guys get your shit and your act together,” singer told destructive crowd. “There’s no one to blame but you”", "date_str": "2026-11-15T19:01:08+00:00", "hash": "45b319be59743df9", "title_fa": "تام آرایا از Slayer کنسرت خود را برای توبیخ هواداران سرکش متوقف کرد: \"خودت را حفظ کن\"", "summary_fa": " ازسازی شده است. محتوای پشت صحنه شامل یک مستند «ساخت»، به‌علاوه ویدیوهای متن ترانه و سایر ویژگی‌ها است. این مجموعه همچنین همراه با کارت پستال های کلکسیونی با تصاویر اصلی از انیماتورهایی است که روی فیلم کار کرده اند. کاور آرت الهام گرفته از انیمه نیز منحصراً برای انتشار فیزیکی ساخته شده است. این اکران یک فیلم بزرگ برای «شکارچیان شیاطین KPop» را پوشش می‌دهد، که پس از اکران در ژوئن گذشته به یکی از بزرگترین فیلم‌های اصلی نتفلیکس تبدیل شد. این فیلم که توسط مگی کانگ و کریس آپلهانس کارگردانی شده و با همکاری Sony Pictures Animation تهیه شده است، سوپراستارهای کی پاپ رومی، میرا و زوئی - با صداپیشگی آردن چو، می هونگ و جی یونگ یو - را دنبال می‌کند که وقتی استادیوم‌ها را نمی‌فروشند، به عنوان شکارچیان شیطان زندگی می‌کنند.", "image_url": "https://variety.com/wp-content/uploads/2026/08/kpop-demon-hunters-criterion-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۲۴ آبان • ۲۱:۳۲"}, {"source": "Billboard", "title": "Phoebe Bridgers Stuns With Haunting Black-Light Skeleton Performance on ‘SNL’: Watch", "link": "https://www.billboard.com/music/music-news/phoebe-bridgers-snl-bobby-still-standing-performances-1236382415/", "summary": "Phoebe Bridgers returned to Saturday Night Live as musical guest on Nov. 14, delivering two performances from her latest album, Lost Weekend . During the John Mulaney-hosted episode, the 32-year-old indie-rock singer-songwriter performed “Bobby” and “Still Standing,” both featured on her third album, which debuted at No. 2 on the Billboard 200 in August. Related Phoebe Bridgers (and Nine of Her Collaborators) Talk Injecting Fresh Blood Into Her Lost Weekend Album s Sound Phoebe Bridgers Slams ICE Idiots Debuts Songs From Her Existential New Album at MSG: 5 Best Moments From Her Top-Secret Show Phoebe Bridgers’ ‘Lost Weekend’: All 16 Tracks Ranked The singer-songwriter s SNL appearance follows the late October release of her five-track EP, Live at Madison Square Garden , recorded during her 2023 performance at the New York City venue. For her first performance, Bridgers took the stage with a full backing band for “Bobby,” a lovestruck track presumably inspired by her relationship with comedian Bo Burnham . The song, which Burnham co-wrote and is believed to be inspired by their relationship, finds Bridgers exploring the excitement of falling in love. The boygenius artist returned later in the show for a haunting performance of “Still Standing,” which explores her complicated relationship with her father. Wearing a flowing white dress that glowed under black lights, Bridgers revealed skeletal face makeup that transformed the performance into an eerie visual. The skeletal look has become a recurring part of Bridgers’ visual aesthetic, particularly during the Punisher era, when she frequently wore skeleton bodysuits onstage. The appearance marked another memorable SNL moment for Bridgers, who previously made headlines during her 2021 performance of “Kyoto” when she famously smashed her guitar against a stage monitor at the end of the song. The NBC sketch comedy series is currently three episodes into its 52nd season, which premiered in September with New York Knicks star Jalen Brunson making his hosting debut and KATSEYE serving as musical guest. Dakota Johnson hosted the following week, with Turnstile performing as musical guest. SNL will now take a three-week break before returning Dec. 5 with Amanda Seyfried as host and Don Toliver as musical guest. The episode will mark Seyfried’s hosting debut and Toliver’s first appearance on the show. Watch Phoebe Bridgers perform “Bobby” and “Still Standing” on SNL below.", "date_str": "2026-11-15T17:41:02+00:00", "hash": "8e07552361eea9d7", "title_fa": "فیبی بریجرز با اجرای شگفت انگیز اسکلت سیاه-نور در «SNL» شگفت زده می شود: تماشا کنید", "summary_fa": "فیبی بریجرز به عنوان مهمان موزیکال در 14 نوامبر به شنبه شب زنده بازگشت و دو اجرا از آخرین آلبوم خود، آخر هفته گمشده را اجرا کرد. در طول اپیزودی که جان مولانی میزبان آن بود، این خواننده و ترانه‌سرا 32 ساله راک مستقل «بابی» و «هنوز ایستاده» را اجرا کرد که هر دو در سومین آلبوم او حضور داشتند که در ماه آگوست در رتبه دوم بیلبورد 200 قرار گرفت. فیبی بریجرز مرتبط (و نه نفر از همکارانش) گفتگو تزریق خون تازه به آلبوم آخر هفته گمشده‌اش. حضور SNL خواننده و ترانه سرا پس از انتشار اواخر اکتبر EP پنج ترانه او، Live at Madison Square Garden، که در اجرای سال 2023 او در محل برگزاری شهر نیویورک ضبط شد، انجام می شود. برای اولین اجرای خود، بریجرز با یک گروه پشتیبان کامل برای «بابی» روی صحنه رفت، آهنگی عاشقانه که احتمالاً از رابطه او با کمدین بو برنهام الهام گرفته شده است. این آهنگ، که برنهام با همکاری آن‌ها نوشته و گفته می‌شود از رابطه آنها الهام گرفته شده است، بریجرز را در حال کشف هیجان عاشق شدن می‌بیند. این هنرمند پسر جوان بعداً در نمایش برای اجرای هیجان انگیز \"هنوز ایستاده\" بازگشت که رابطه پیچیده او با پدرش را بررسی می کند. بریجرز با پوشیدن یک لباس سفید روان که زیر نورهای سیاه می درخشید، آرایش صورت اسکلتی را نشان داد که اجرا را به تصویری وهم انگیز تبدیل کرد. ظاهر اسکلتی به بخش تکراری زیبایی شناسی بصری بریجر تبدیل شده است، به ویژه در دوران پانیشر، زمانی که او اغلب لباس های بدن اسکلت روی صحنه می پوشید. این ظاهر یکی دیگر از لحظات به یاد ماندنی SNL برای بریجرز بود، که قبلاً در طول اجرای سال 2021 خود از \"Kyoto\" زمانی که گیتار خود را به مانیتور صحنه در انتهای آهنگ کوبید، تیتر خبرها شد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/phoebe-bridgers-snl-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۴ آبان • ۲۱:۱۱"}, {"source": "Deadline", "title": "Johnny Depp’s ‘Ebenezer’ Richer Abroad At $42M WW; ‘Ramayana’ Nears $150M WW; ‘Godzilla Minus Zero’ Roars Past $100M WW; ‘Wildwood’ $70M – Global Box Office", "link": "https://deadline.com/2026/11/box-office-global-ebenezer-ramayana-godzilla-minus-zero-1237224479/", "summary": "When it came to Johnny Depp s comeback movie Ebenezer, moviegoers abroad weren t as cheap as stateside audiences who gave it a discount with a $ rdelen. Ze zien de zaak totaal verschillend, en dat kost hen hun vriendschap. Dan schuift het verhaal door naar 2014. De veroordeelde moordenaar staat op het punt vrij te komen en de twee vrouwen worden opnieuw met elkaar geconfronteerd. De serie stelt een lastige vraag: mag iemand die zijn straf heeft uitgezeten, maar misschien nog altijd gevaarlijk is, terugkeren in de samenleving? Is Prawo Bestii gebaseerd op een waargebeurd verhaal? De serie is geïnspireerd op de zaak van Mariusz Trynkiewicz, een Poolse seriemoordenaar die in 1988 vier jonge jongens vermoordde. Zijn misdaden zorgden voor grote verontwaardiging in Polen. Tientallen jaren later leidden ze opnieuw tot een landelijke discussie over hoe je omgaat met gevaarlijke criminelen. De echte zaak: wat deed Mariusz Trynkiewicz? Trynkiewicz werkte als leraar lichamelijke opvoeding en woonde in Piotrków Trybunalski, een stad in het midden van Polen. 1988: Hij vermoordde eerst een dertienjarige jongen. Enkele weken later: Hij lokte drie andere jongens naar zijn woning, waar hij hen ook om het leven bracht. De slachtoffers: Ze waren tussen de elf en dertien jaar oud. Het bewijs: De lichamen van de laatste drie slachtoffers werden later gevonden, nadat Trynkiewicz had geprobeerd zijn misdaden te verbergen. Veroordeling: van doodstraf naar 25 jaar cel Na zijn arrestatie bekende Trynkiewicz de moorden. In 1989 werd hij viermaal ter dood veroordeeld. Die straf is nooit uitgevoerd. Nadat Polen de doodstraf had afgeschaft, werd zijn straf omgezet in 25 jaar gevangenisstraf. De ‘beestenwet’: waar komt de titel vandaan? Toen zijn straf in februari 2014 bijna afliep, ontstond grote onrust in Polen. Deskundigen vreesden dat Trynkiewicz opnieuw ernstige misdrijven zou plegen. De zaak droeg bij aan de invoering van een omstreden wet, in de Poolse media bekend als de ‘beestenwet", "date_str": "2026-11-15T17:56:09+00:00", "hash": "36aa70d113c68cf7", "title_fa": "Prawo Bestii در نتفلیکس: آیا سریال واقعی است؟", "summary_fa": "بله     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {

        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
