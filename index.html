<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۵ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

90c41", "title_fa": "حسن گلشن‌نژاد، از بازداشت‌شدگان اعتراضات دی‌ماه، به اعدام محکوم شد", "summary_fa": "حسن گلشن‌نژاد، ۳۶ ساله و از بازداشت‌شدگان مرتبط با اعتراضات دی‌ماه ۱۴۰۴، به اتهام «اقدام عملیاتی به نفع اسراییل» از سوی شعبه پنجم دادگاه ... به گزارش خبرگزاری هرانا، ارگان خبری مجموعه فعالان حقوق بشر در ایران، گلشن‌نژاد در ارتباط با شرکت در تجمعات اعتراضی دی‌ماه بازداشت و در زندان وکیل‌آباد مشهد زندانی شد. او پنجم اسفند ۱۴۰۴، هنگامی که در کافه یکی از دوستانش قهوه می‌نوشید، بازداشت شد. ماموران پس از دستگیری، او را به منزلش منتقل کرده و تعدادی از وسایل شخصی او را ضبط کردند. گلشن‌نژاد پس از بازداشت به مدت ۱۰ روز در سلول انفرادی بازداشتگاه اداره اطلاعات نگهداری شد و سپس به بند ۶/۱ زندان وکیل‌آباد مشهد انتقال یافت. او از آن زمان تاکنون در این زندان به سر می‌برد. این شهروند ۳۶ ساله که شغل آزاد دارد، پدر یک پسر هشت‌ساله است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/image_5_ilrV__v1024x512__box_21%2C0%2C1164%2C599.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۴ آبان • ۱۸:۵۴"}, {"source": "Independent Persian", "title": "زنان کنار نمی‌آیند، حکومت عقب نمی‌نشیند", "link": "https://www.independentpersian.com/node/422887/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D8%B2%D9%86%D8%A7%D9%86-%DA%A9%D9%86%D8%A7%D8%B1-%D9%86%D9%85%DB%8C%E2%80%8C%D8%A2%DB%8C%D9%86%D8%AF%D8%8C-%D8%AD%DA%A9%D9%88%D9%85%D8%AA-%D8%B9%D9%82%D8%A8-%D9%86%D9%85%DB%8C%E2%80%8C%D9%86%D8%B4%DB%8C%D9%86%D8%AF", "summary": "دادستانی تهران روز دوشنبه چهارم آبان از تشکیل پرونده قضایی برای برگزارکنندگان نمایشگاه «آرت‌فر تهران»، احضار آنان و مسدود شدن پایگاه اینترنتی فروش بلیت و حساب کاربری برگزارکننده خبر داد. این اقدام که پس از انتشار تصاویر حضور زنان بدون حجاب اجباری در رویداد هنری ایران‌مال صورت گرفت، از تازه‌ترین نمونه‌های گسترش فشا  Hollywood sensibility to verticals. Kayla Oaddams/Getty Images for Warner Brothers Pictures Film producer Tommy Harper is shutting down his micro drama app VeYou after about six months. Harper, who sought to build the \"HBO\" of the genre, said he would still produce for other platforms. The micro drama space has shifted as tech giants push in. The app that wanted to be the \"HBO\" of micro dramas is shutting down. Prolific film producer Tommy Harper is shutting down his app, VeYou, after about six months. A message on VeYou said the service would end November 6. Harper told Business Insider he would continue producing series, distributing them via TikTok's micro-drama app PineDrama , YouTube, and other partners. Harper, whose credits include \"Star Wars\" and \"Top Gun: Maverick,\" is one of several Hollywood vets trying to bring their prestige sensibility to micro dramas, the soapy, low-budget series that got their start in China and have exploded in the US. The move shows how fast the space is changing as Big Tech companies lean in. Micro dramas — also called \"verticals\" — cost a fraction of a traditional feature-length movie, but apps often lose money because of the high cost of marketing, and VeYou didn't have massive financial backing. \"In the past year, TikTok, Meta, and YouTube all moved hard into short drama,\" Harper emailed. \"When the three biggest attention platforms commit to a format, distribution is decided. The opportunity for an independent company is to be the best supplier to those platforms, not to compete with them for installs. So we're focused where we have the edge: making the shows.\" Harper raised an undisclosed amount of seed funding for VeYou from investor S32, a venture firm started by Google Ventures founder Bill Maris, who's also backed 23andMe, Impossible Foods, and Nest. VeYou has made a handful of originals, starting with \"Love Under Fire,\" a romance drama starring Kasey Esser, who wrote the series alongside Harper. The micro drama market is changing fast The micro drama space has changed dramatically in recent months. In the past year, AI-generated characters have increasingly taken their place alongside human actors, and free, ad-supported offerings are competing with the \"freemium\" apps that had dominated the landscape. A report by media consultancy Owl Co. found two-thirds of films released by leading apps in the third quarter of this year outside China were AI-generated, up from ", "date_str": "2026-10-26T16:10:25+00:00", "hash": "d6db3bfa2e29d86c", "title_fa": "اپلیکیشنی که می‌خواست «HBO» درام‌های خرد باشد در حال خاموش شدن است", "summary_fa": "تامی هارپر، تهیه کننده فیلم، به دنبال این است که حساسیت هالیوود را به عمودی ها برساند. Kayla Oaddams/Getty Images برای Warner Brothers Pictures تهیه کننده فیلم تامی هارپر برنامه درام میکرو VeYou خود را پس از حدود شش ماه تعطیل می کند. هارپر که به دنبال ساخت \"HBO\" این ژانر بود، گفت که همچنان برای پلتفرم های دیگر تولید خواهد کرد. فضای درام خرد با فشار غول‌های فناوری تغییر کرده است. اپلیکیشنی که می‌خواست «HBO» درام‌های خرد باشد در حال خاموش شدن است. تامی هارپر، تهیه کننده پرکار فیلم، اپلیکیشن خود VeYou را پس از حدود شش ماه تعطیل می کند. پیامی در VeYou گفت که این سرویس در 6 نوامبر به پایان می‌رسد. هارپر به Business Insider گفت که به تولید سریال‌ها ادامه می‌دهد و آنها را از طریق برنامه میکرودرام TikTok PineDrama، YouTube و سایر شرکای خود توزیع می‌کند. هارپر که تیتراژ او شامل «جنگ ستارگان» و «تاپ گان: ماوریک» است، یکی از چندین دامپزشک هالیوودی است که تلاش می‌کند تا حساسیت پرستیژ خود را به درام‌های خرد، سریال‌های صابونی و کم‌هزینه‌ای که در چین شروع شد و در ایالات متحده منفجر شد، بیاورد. این حرکت نشان می‌دهد که با توجه به شرکت‌های بزرگ فناوری با چه سرعتی فضا در حال تغییر است. درام‌های خرد – که «عمودی» نیز نامیده می‌شود – هزینه کسری از یک فیلم بلند سنتی دارد، اما برنامه‌ها اغلب به دلیل هزینه بالای بازاریابی ضرر می‌کنند و VeYou پشتوانه مالی زیادی نداشت. هارپر ایمیل کرد: «در سال گذشته، تیک تاک، متا و یوتیوب همگی به شدت به سمت درام کوتاه حرکت کردند. d, you'll have to catch a plane or a boat. Trying to do too much in one trip People traveling to a new location often feel pressure to visit as many destinations as possible. But if you never take a minute to enjoy just being here, you're missing out on a big chunk of the Alaska experience. Plus, having a little flex time in your schedule helps accommodate when excessive wind, rain, or rough seas keep you from doing planned activities. I recommend giving yourself two or three days in a community before moving on. Not learning the local vocabulary In Alaska, we have a lot of local lingo that can be helpful to know. For example, if someone says they're going outside, they're not just leaving the building — they're leaving the state. To us, outside means \"Outside\" with a capital \"O,\" which is anywhere that's not Alaska. Another thing to remember is that we don't typically use road numbers for our highways (no matter what your GPS tries to tell you). Instead, we use the names of highways. Forgetting that some attractions and activities are seasonal The northern lights can typically be seen in Alaska between late August and late April. biletskiyevgen", "date_str": "2026-10-26T16:07:43+00:00", "hash": "5920ae69d01c5bf9", "title_fa": "من بیش از 35 سال در آلاسکا زندگی کرده ام. در اینجا 6 اشتباهی وجود دارد که من همیشه می بینم که گردشگران هنگام بازدید از ایالت مرتکب می شوند.", "summary_fa": "به عنوان یک محلی، من می دانم چند کار وجود دارد که هرگز نباید در آلاسکا انجام دهید. لیزا مالونی با بیش از 35 سال زندگی در آلاسکا، بازدیدکنندگان زیادی را دیده ام که اشتباهات مشابهی را مرتکب شده اند. بسیاری از گردشگران وسعت آلاسکا را دست کم می گیرند و فکر می کنند این ایالت بیشتر از آنچه که هست قابل تردد است. بسیاری از بازدیدکنندگان متوجه نمی شوند که برخی از جاذبه ها و فعالیت ها فصلی هستند. به عنوان فردی که بیش از 35 سال در آلاسکا زندگی کرده است، می بینم که چرا گردشگران عاشق سفر به اینجا هستند. از پارک‌های ملی زیبا گرفته تا فرصت‌هایی برای دیدن شفق‌های شمالی، این ایالت چیزی برای همه دارد.  with outsized power. That's not unusual for giant tech companies launched in the past few decades (Larry Page and Sergey Brin have effective control of Google; Mark Zuckerberg has the same at Meta, as does Elon Musk at SpaceX.) It's also something you see at some prominent media companies (Rupert Murdoch and his son Lachlan have effective control of his two public companies; Larry and David Ellison have the same at Skydance.) Anthropic's twist on the idea is that control is split between two different groups of insiders. There's a clique of seven founders, including CEO Dario Amodei and his sister, Daniela, who control 50.1% of shareholder voting power. And there's also a trust with the power to appoint four of the company's seven directors. Put those two together, and you get a corporate constitution designed to keep public investors outside the real decisions. The founders control the outcome of any shareholder vote; the trust controls the board. In theory, those two groups could end up in conflict on major issues. The trust-appointed directors might, say, vote to replace Amodei with a new CEO. Or the founder group could veto a sale approved by the board. In reality, there's a lot of overlap between the two groups. For starters, Anthropic created and funds the trust. And Anthropic itself says it has made sure the trust is staffed with people who see the world the same way its executives do: \"In practice to date, the Trustees and company executives have collaborated closely on sourcing, interviewing, and selecting Trustees,\" the company notes in its S-1 filing. The main takeaway is that there's no way for an individual shareholder, or even institutional shareholders who own significant chunks of Anthropic's equity, to force it to m", "date_str": "2026-10-26T15:48:43+00:00", "hash": "b3a1883a55729350", "title_fa": "Anthropic پول شما را می گیرد - اما توصیه شما را نه", "summary_fa": "داریو آمودی، مدیرعامل آنتروپیک و شش بنیانگذارش پس از انتشار عمومی، 50.1 درصد از سهام رای شرکت را کنترل خواهند کرد. Oliver Contreras / AFP از طریق Getty Images سرمایه گذاران عمومی بالاخره فرصتی برای سرمایه گذاری در Anthropic پیدا کردند. اما برخلاف سایر شرکت‌های دولتی، آنتروپیک در تصمیم‌گیری‌های مهم، نظر مردم را نمی‌خواهد. در عوض، Anthropic به طور موثر توسط Dario Amodei مدیرعامل و گروهی از افراد داخلی دیگر کنترل خواهد شد. در چند هفته آینده، سرمایه گذاران عمومی شانس خود را برای خرید یک قطعه آنتروپیک خواهند داشت. اما سرمایه گذاران معمولی هرگز فرصتی برای هدایت تصمیمات غول هوش مصنوعی نخواهند داشت: حتی اگر آنتروپیک در حال عرضه عمومی است، اساساً یک شرکت خصوصی باقی خواهد ماند که توسط تعداد انگشت شماری از افراد با قدرت بزرگ کنترل می شود. این برای شرکت‌های غول‌پیکر فناوری که در چند دهه گذشته راه‌اندازی شده‌اند غیرعادی نیست (لری پیج و سرگی برین کنترل مؤثری بر گوگل دارند؛ مارک زاکربرگ در متا و ایلان ماسک در اسپیس ایکس همین کار را دارد). تغییر در این ایده این است که کنترل بین دو گروه مختلف از خودی ها تقسیم می شود. گروهی متشکل از هفت بنیانگذار، از جمله مدیر عامل داریو آمودی و خواهرش، دانیلا، وجود دارد که 50.1 درصد از قدرت رای سهامداران را در اختیار دارند. و همچنین یک اعتماد با قدرت انتصاب چهار نفر از هفت مدیر شرکت وجود دارد. این دو را کنار هم بگذارید، و یک اساسنامه شرکتی به دست می آورید که برای نگه داشتن سرمایه گذاران عمومی از تصمیمات واقعی طراحی شده است. بنیانگذاران نتیجه هر رأی سهامداران را کنترل می کنند. اعتماد هیئت مدیره را کنترل می کند. از نظر تئوری، این دو گروه ممکن است در مورد مسائل عمده با هم درگیر شوند. مدیرانی که توسط اعتماد منصوب می‌شوند، ممکن است به جایگزینی آمودی", "image_url": "https://i.insider.com/6adf730aab741a2ebdf1153f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Google", "Meta"], "datetime_fa": "۴ آبان • ۱۹:۱۸"}, {"source": "Business Insider", "title": "Ukraine's been waiting almost a month for Hegseth to sign off on Patriot missiles, Zelenskyy says", "link": "https://www.businessinsider.com/ukraine-waiting-month-for-pete-hegseth-approval-patriot-missiles-zelenskyy-2026-10", "summary": "Ukraine said it has waited weeks for the US to sign off on crucial missile interceptors. US Army photo Ukraine has been waiting nearly a month for the US to sign off on crucial missile interceptors, its president says. Kyiv said it is specifically waiting for the Pentagon to approve Patriot and NASAMS missiles. Ukraine has repeatedly faced low stockpiles of interceptors as it defends against Russian missiles. Kyiv has been waiting nearly a month for US Defense Secretary Pete Hegseth to sign off on crucial missile interceptors, Ukrainian President Volodymyr Zelenskyy said on Monday. Zelenskyy said Ukraine has been waiting on approval to procure interceptors for its Patriot and NASAMS systems. The former is the country's most reliable defense against Russian ballistic missiles . The Ukrainian president said that he instructed his team \"to raise this with the American side once again. Conversations with other countries are also ongoing.\" Most of the interceptors for Ukraine's air defense systems, including its Patriot batteries, are supplied through NATO's Prioritised Ukraine Requirements List (PURL) initiative, in which allies and partners buy weapons from the US and then transfer them to Kyiv. It is unclear how many interceptors have been held up, or why Hegseth had not signed off on their transfer. A senior Pentagon official told Business Insider \"there has been no change\" to department policy \"regarding intelligence sharing or any capabilities we are enabling Europeans to provide to Ukraine.\" The Patriot system makes up the top tier of Ukraine s air defense network. David Poe/Fort Bliss Public Affairs Office The PURL initiative \"continues unaltered,\" the official added. Ukraine has faced repeated interceptor shortages, making it difficult to effectively defend against worsening Russian ballistic missile attacks, which, alongside armed jet-powered drones , have hammered Kyiv in a series of deadly bombardments. The American-made MIM-104 Patriot surface-to-air missile system is a key piece of Kyiv's defensive umbrella. Ukrainian officials have urged the US and European allies to send more interceptors — PAC-2 and PAC-3 models in particular. Global munitions stockpiles , however, are under increased strain. \"We are working on several tracks — with the United States, Europe, and other partners that have stocks of PAC-2 and PAC-3 missiles,\" Zelenskyy said Monday in a social media post. The Iran war has put tremendous stress on munition stockpiles. Col. Yurii Ih", "date_str": "2026-10-26T15:31:31+00:00", "hash": "6ba4baa8a97b2d63", "title_fa": "زلنسکی می‌گوید اوکراین تقریبا یک ماه منتظر است تا هگزت موشک‌های پاتریوت را امضا کند.", "summary_fa": "اوکراین گفت هفته ها منتظر بوده است تا آمریکا رهگیرهای موشکی مهم را امضا کند. عکس ارتش ایالات متحده، رئیس جمهور اوکراین می گوید، اوکراین نزدیک به یک ماه منتظر بوده است تا ایالات متحده رهگیرهای موشکی مهم را امضا کند. کیف اعلام کرد که به طور خاص منتظر است تا پنتاگون موشک های پاتریوت و ناسامس را تأیید کند. اوکراین بارها با ذخیره کم رهگیرها در هنگام دفاع در برابر موشک های روسی مواجه شده است. ولودیمیر زلنسکی، رئیس‌جمهور اوکراین روز دوشنبه گفت که کی‌یف نزدیک به یک ماه منتظر است تا پیت هگزت، وزیر دفاع آمریکا، رهگیرهای موشکی مهم را امضا کند. زلنسکی گفت که اوکراین منتظر مجوز برای تهیه رهگیر برای سیستم های پاتریوت و ناسامس خود بوده است. مورد اول قابل اطمینان ترین دفاع کشور در برابر موشک های بالستیک روسیه است. رئیس جمهور اوکراین گفت که به تیم خود دستور داده است این موضوع را یک بار دیگر با طرف آمریکایی مطرح کنند. گفتگوها با سایر کشورها نیز ادامه دارد.\" بیشتر رهگیرهای سیستم های دفاع هوایی اوکراین، از جمله باتری های پاتریوت آن، از طریق ابتکار فهرست نیازمندی های اوکراین اولویت بندی شده ناتو (PURL) تامین می شود که در آن متحدان و شرکا از ایالات متحده تسلیحات می خرند و سپس آنها را به کیف منتقل می کنند. مشخص نیست که چه تعداد رهگیر در زمان انتقال آنها متوقف شده است، یا چرا او امضا نکرده است. یک مقام ارشد پنتاگون به Business Insider گفت: «هیچ تغییری» در سیاست وزارتخانه «در رابطه با اشتراک‌گذاری اطلاعات یا هر قابلیتی که اروپایی‌ها را قادر می‌سازیم به اوکراین ارائه کنند» صورت نگرفته است. سامانه پاتریوت بالاترین سطح شبکه دفاع هوایی اوکراین را تشکیل می دهد. این مقام افزود: دیوید پو/دفتر امور عمومی فورت بلیس طرح PURL \"بدون تغییر ادامه دارد.\" اوکراین با کمبودهای مکرر رهگیر مواجه شده", "image_url": "https://i.insider.com/6adf6c2dc8572251b1980020?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آبان • ۱۹:۰۱"}, {"source": "Business Insider", "title": "Microsoft is offering buyouts to around 60,000 employees. Read the memo.", "link": "https://www.businessinsider.com/microsoft-is-offering-buyouts-read-the-memo-2026-10", "summary": "Microsoft Chief People Officer Amy Coleman. Microsoft Microsoft is offering buyouts to around 60,000 employees. The offers will go out later today, and resemble Microsoft's standard severance offer. The buyout offer could help Microsoft cut costs and reshape its workforce for the AI era. Microsoft is offering buyouts, according to a memo Chief People Officer Amy Coleman sent to employees Monday. \"The Voluntary Exit Offer reflects an important part of how we're evolving our approach to change: creating greater flexibility and, where possible, more ways for employees to shape their next chapter,\" Coleman wrote. Microsoft's voluntary exit offer is the company's latest attempt to slim its workforce without another round of involuntary cuts. After spending heavily on AI infrastructure and reducing headcount this year, Microsoft is offering remaining employees a chance to leave, testing whether voluntary departures can cut costs. Eligible employees in the U.S., Canada, India, and the U.K. at level 70, which includes senior leaders at the company, and below, will receive an email later Monday with the terms of the offer. Only some teams are participating, excluding sales organizations, some engineering, and some corporate functions. Around 60,000 employees — or more than a quarter of the company's workforce — about will be eligible, a spokesperson told Business Insider, and the terms will be similar to Microsoft's standard severance. The US severance package offered when Microsoft laid off employees earlier this year included a minimum of 60 days of base pay, during which employees will remain on the payroll, and, for most employees, up to a maximum of 39 weeks of base pay, based on seniority and tenure. Employees at internal levels 64 and below received one week of base pay per six months of service, for example, and employees at levels 65 to 67 will receive two weeks of base pay per six months of service, according to offers reviewed by Business Insider . Eligible employees will have until early December to decide whether to take the offer and exit at the end of the year, and there are no plans for another buyout at this time, Microsoft's spokesperson said. The buyout offer follows Microsoft's Voluntary Retirement Program, which offered a retirement buyout to about 9,000 eligible employees based on age and tenure. About one-third of eligible employees took the buyout , in line with expectations, a person familiar with the turnout told Business Insider in June. ", "date_str": "2026-10-26T15:30:25+00:00", "hash": "9f77cccdd5fa43d7", "title_fa": "مایکروسافت به حدود 60000 کارمند خرید پیشنهاد می کند. یادداشت را بخوانید.", "summary_fa": "امی کلمن، مدیر ارشد مایکروسافت. مایکروسافت مایکروسافت به حدود 60000 کارمند خرید پیشنهاد می کند. این پیشنهادها بعداً امروز منتشر می‌شوند و شبیه به پیشنهاد جدایی استاندارد مایکروسافت هستند. پیشنهاد خرید می تواند به مایکروسافت کمک کند تا هزینه ها را کاهش دهد و نیروی کار خود را برای عصر هوش مصنوعی تغییر دهد. بر اساس یادداشتی که امی کلمن، مدیر ارشد مردمی، روز دوشنبه برای کارمندان ارسال کرد، مایکروسافت پیشنهاد خرید می دهد. کلمن می‌نویسد: «پیشنهاد خروج داوطلبانه بخش مهمی از چگونگی تغییر رویکرد خود را برای تغییر منعکس می‌کند: ایجاد انعطاف‌پذیری بیشتر و در صورت امکان، راه‌های بیشتری برای کارمندان برای شکل دادن به فصل بعدی خود». پیشنهاد خروج دا  "hash": "d5ccb870290c8a30", "title_fa": "درآمد هوش مصنوعی، تصمیم مهم فدرال رزرو، میان‌دوره: سهام در حال شروع یک کشش حیاتی 2 هفته‌ای است.", "summary_fa": "مایکل ناگل/ بلومبرگ از طریق Getty Images NYSE دو هفته آینده برای بازارها بسیار بزرگ خواهد بود. آلفابت، مایکروسافت و آمازون درآمدهای این هفته را گزارش کردند و فدرال رزرو روز چهارشنبه تصمیم سیاستی را ارائه کرد. انتخابات میان دوره ای هفته آینده نیز پیامدهای بالقوه ای برای هضم سرمایه گذاران خواهد داشت. سهام در چند هفته بسیار مهم شروع به کار می کنند. علاوه بر پرونده S-1 Anhtropic که صبح دوشنبه منتشر شد، خط لوله رویدادهای بازار در هفته شامل نتایج مالی بازیگران برتر در تجارت هوش مصنوعی، تصمیم فدرال رزرو درباره نرخ بهره و نحوه نگاه رئیس آن، کوین وارش به اقتصاد و نتیجه انتخابات میان دوره ای ایالات متحده است. بازار گسترده تر در چند ماه گذشته نسبتاً صاف بوده است، به طوری که S P 500 از 4 آگوست کمتر از 1.5 درصد کاهش یافته است. اما بخش‌های خاصی از تجارت هوش مصنوعی در ماه اکتبر یک دوره کاهش ریسک جدی را متحمل شدند، که نگرانی‌هایی را در مورد آشفتگی احتمالی ایجاد کرد که بازار گسترده‌تر را به شدت به ثروت چند شرکت وابسته می‌داند. افزایش هزینه‌های وام‌گیری نگرانی‌ها از عقب‌نشینی هزینه‌های زیرساخت‌های هوش مصنوعی را افزایش داده است که باعث سقوط نئوکلادها و سهام تراشه‌ها می‌شود. بیایید نگاهی دقیق‌تر به آنچه سرمایه‌گذاران تماشا خواهند کرد بیاندازیم. درآمدهای هوش مصنوعی سرمایه‌گذاران در چند هفته آینده چشمشان به درآمدهای بزرگ فناوری خواهد بود، زیرا آنها به دنبال سرنخ‌هایی در مورد اینکه تجارت هوش مصنوعی به کجا می‌رود - اینکه آیا فرامقیاس‌کنندگان سرمایه‌گذاری خود را کسب درآمد می‌کنند و اینکه آیا می‌توانند انتظار داشته باشند که هزینه‌های کلان ادامه پیدا کند، خواهند بود. در اینجا تقویمی از برخی از برترین گزارش‌های درآمدی ساعت آورده شده است: چهارشنبه، 28 اکتبر: آلفابت مایکروسافت پنجشنبه، 29 اکتبر آمازون دوشنبه، 2 نوامبر اپل سه‌شنبه، 3 نوامبر دستگاه‌های میکرو پیشرفته «ما عموماً انتظار", "image_url": "https://i.insider.com/6adf661a8e95884e1ca83387?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "Apple", "Microsoft"], "datetime_fa": "۴ آبان • ۱۸:۵۸"}, {"source": "Business Insider", "title": "My partner and I have lived 45 minutes apart for years. Right now, the benefits actually outweigh the challenges.", "link": "https://www.businessinsider.com/in-middle-distance-relationship-benefits-no-rush-to-move-closer-2026-10", "summary": "My partner and I often joke that we re in a middle-distance relationship. Lindsey Galloway My partner lives in a spacious house in rural Colorado , and I live in a condo in Boulder. We haven't found a place that fits both of our needs yet, so we're content living 45 minutes apart. There are challenges, but we enjoy spending lots of time at each other's homes. Every weekend, my partner makes the best breakfast : over-medium eggs, handmade tortillas, and fresh hash browns. We often eat outside thanks to Colorado's bright, sunny days, then we'll walk around the lake, watch some football, and spend the evening roasting marshmallows over the fire pit. Then, when Sunday night arrives, I get in my car and drive the 45 minutes back to my dream condo to get ready for the week ahead. My partner and I met at work 13 years ago, and we intend to spend the rest of our lives together, but we still live apart. We know each other's rhythms, quirks, and needs, and have no secrets, just separate addresses. I often joke that we're in a \"middle-distance\" relationship. At least we're in the same state, but it's also not always easy or convenient to drop by for dinner. Living apart lets us each keep a home we love Both of us are divorced, and we both love the houses we have. My partner lives in rural northeastern Colorado and bought his home after his divorce. It's bigger than mine, with a huge yard and a custom-designed patio built for entertaining. His neighborhood isn't exactly walkable, but he's originally from a small town in Texas , so he doesn't mind driving longer distances to get to places he wants to go. Meanwhile, after my divorce, I moved back into the Boulder condo I had been renting out while married. My unit is smaller than my partner's, but I love its mountain views and proximity to all my favorite places, like my go-to local bakery. It needed a lot of work when I moved back in, but I invested in new paint and flooring to really make it mine again. I want to stay close to Boulder, and he wants a big house. The tight, expensive housing market has made it tough to find a new place we both love. Though we've toured many houses together over the last six months, we haven't been impressed by any of them enough to leave the places we've already made our own. Our setup isn't as tough as people think We ve built a routine that works well for us. Lindsey Galloway One thing that has made this arrangement easier is that we're used to living out of our suitcases. I'm a profe", "date_str": "2026-10-26T15:26:01+00:00", "hash": "256002ba377119c5", "title_fa": "من و شریکم سال هاست که با فاصله 45 دقیقه از هم زندگی می کنیم. در حال حاضر، مزایا در واقع از چالش ها بیشتر است.", "summary_fa": "من و شریکم اغلب به شوخی می گوییم که در یک رابطه از راه دور هستیم. لیندسی گالووی شریک زندگی من در یک خانه بزرگ در روستایی کلرادو زندگی می کند و من در یک آپارتمان در بولدر زندگی می کنم. ما هنوز مکانی را پیدا نکرده‌ایم که هر دوی نیازهایمان را برآورده کند، بنابراین از زندگی با فاصله 45 دقیقه راضی هستیم. چالش هایی وجود دارد، اما ما از گذراندن زمان زیادی در خانه یکدیگر لذت می بریم. هر آخر هفته، شریک زندگی من بهترین صبحانه را درست می کند: تخم مرغ های متوسط، تورتیلاهای دست ساز، و هاش براون تازه. ما اغلب به لطف روزهای روشن و آفتابی کلرادو بیرون غذا می خوریم، سپس در اطراف دریاچه قدم می زنیم، کمی فوتبال تماشا می کنیم، و عصر را با برشته کردن گل ختمی روی آتشدان می گذرانیم. سپس، وقتی یکشنبه شب فرا می‌رسد، سوار ماشینم می‌شوم و 45 دقیقه را به کانکس رویایی‌ام برمی‌گردانم تا برای هفته پیش رو آماده شوم. من و شریکم 13 سال پیش در محل کار با هم آشنا شدیم و قصد داریم تا پایان عمر را با هم بگذرانیم، اما هنوز جدا از هم زندگی می کنیم. ما ریتم‌ها، خصلت‌ها و نیازهای یکدیگر را می‌دانیم و هیچ رازی نداریم، فقط آدرس‌های جداگانه داریم. من اغلب به شوخی می گویم که ما در یک رابطه \"از راه دور\" هستیم. حداقل ما در یک وضعیت هستیم، اما همیشه رفتن برای شام آسان یا راحت نیست. زندگی جدا از هم به ما اجازه می‌دهد خانه‌ای داشته باشیم که دوستش داریم. شریک زندگی من در روستایی شمال شرقی کلرادو زندگی می کند و پس از طلاق خانه اش را خرید. این بزرگتر از مال من است، با یک حیاط بزرگ و یک پاسیو با طراحی سفارشی که برای سرگرمی ساخته شده است. محله او دقیقاً قابل پیاده‌روی", "image_url": "https://i.insider.com/6adb7a95510d67c758d86399?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آبان • ۱۸:۵۶"}, {"source": "Business Insider", "title": "What smart people are saying about Anthropic's IPO paperwork", "link": "https://www.businessinsider.com/anthropic-ipo-smart-people-investor-reactions-2026-10", "summary": "Anthropic, led by Dario Amodei, filed its S-1 paperwork in Monday. Bloomberg/Getty Images Anthropic filed its S-1 on Monday, revealing the company's internal financials. Investors, researchers, and tech onlookers shared their thoughts. Some applied S-1 learnings to their own industries, like startups and venture capital. Anthropic is ready to IPO. Analysts and onlookers are weighing in. On Monday, the AI lab filed its hotly anticipated S-1 paperwork . The prospectus offered an inside look at Anthropic's financials: a net loss of about $42 billion in 2025 and revenue of $4.6 billion. It plans to trade under the ticker symbol ANT. The S-1 sets the stage for a blockbuster IPO . Here's what smart people are saying about Anthropic's filing: Sarah Guo, founder of Conviction Conviction founder Sarah Guo said she was interested to see how Anthropic s mission changes (or doesn t) after going public. Big Event Media/Getty Images for HumanX Conference Venture capitalist Sarah Guo opened her X post with a big \"CONGRATS\" to Anthropic on the S-1 filing. Guo shared her first takeaways: the inflection in operating profi  اسناد مورد انتظار S-1 خود را ثبت کرد. این دفترچه نگاهی درونی به وضعیت مالی آنتروپیک داشت: ضرر خالص حدود 42 میلیارد دلار در سال 2025 و درآمد 4.6 میلیارد دلار. این شرکت قصد دارد تحت نماد نماد ANT معامله کند. S-1 زمینه را برای عرضه اولیه عمومی سهام پرفروش فراهم می کند. این چیزی است که افراد باهوش در مورد پرونده آنتروپیک می گویند: سارا گو، بنیانگذار Conviction Conviction، سارا گوئو، گفت که علاقه مند است ببیند که ماموریت آنتروپیک چگونه پس از انتشار عمومی تغییر می کند (یا نمی کند). رویداد بزرگ رسانه/ گتی ایماژ برای کنفرانس HumanX سارا گوئو، سرمایه‌دار مخاطره‌آمیز، پست X خود را با \"تبریک\" بزرگ به Anthropic در پرونده S-1 باز کرد. گوا اولین نکات خود را به اشتراک گذاشت: عطف در سود عملیاتی، تمرکز بر کشف جدید، عدم تطابق بین درآمد مبتنی بر مصرف و تعهدات محاسباتی بلند مدت، و موارد دیگر. گوئو نوشت: \"من کنجکاو هستم که ببینم چگونه 1) یک شرکت با ماموریت قوی چگونه تغییر می کند - یا نمی کند - چگونه تحت بازرسی عمومی سه ماهه عمل می کند و 2) چگونه افکار عمومی ممکن است تغییر کند وقتی خرده فروشی ها قسمتی از آن را دارند.\" آن بوردتسکی، بنیانگذار Elora Capital آن بوردتسکی گفت که S-1 یک نوار (بالا) تعیین کرد. کیمبرلی وایت/گتی ایماژ برای TechCrunch آن بوردتسکی قبل از تأسیس", "image_url": "https://i.insider.com/6adf6394ab741a2ebdf114ce?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "سرمایه‌گذاری", "بورس و طلا"], "datetime_fa": "۴ آبان • ۱۸:۲۶"}, {"source": "NYT Tech", "title": "Meet Anthropic’s Seven Founders as the A.I. Firm Prepares for an IPO", "link": "https://www.nytimes.com/2026/10/26/technology/anthropic-founders.html", "summary": "Former OpenAI employees started the company in 2021 after disagreements over how to safely build artificial intelligence. An I.P.O. could make them billionaires.", "date_str": "2026-10-26T15:24:56+00:00", "hash": "84f2efd9bb73d59f", "title_fa": "با هفت بنیانگذار آنتروپیک به عنوان A.I آشنا شوید. شرکت برای IPO آماده می شود", "summary_fa": "کارمندان سابق OpenAI این شرکت را در سال 2021 پس از اختلاف نظر در مورد چگونگی bf049e769d061a626b00d5b467ae51/0_0_4169_3335/master/4169.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctbGl2ZS5wbmc&enable=upscale&s=d43ca2a7e2b107d297cad743cb9956f3", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "Meta", "سرمایه‌گذاری"], "datetime_fa": "۴ آبان • ۱۹:۰۳"}, {"source": "The Guardian AI", "title": "Anthropic filing for US stock market listing reveals rapid revenue gains and even larger losses", "link": "https://www.theguardian.com/technology/2026/oct/26/anthropic-files-listing-stock-market", "summary": "Market debut of AI company behind Claude chatbot will be one of largest in US history, a test of the AI boom’s financial viability Anthropic has publicly filed for a stock market listing, one of the largest debuts in history. The company’s float on the US market is likely to be a high-water mark in the multitrillion-dollar AI boom and a test of its financial viability. Analysts and investors have valued the San Francisco-based company, founded in 2021, at more than $1.5tn. The company, which will will list under the symbol ANT, confidentially filed with US financial regulators for an initial public offering in June. Continue reading...", "date_str": "2026-10-26T13:12:59+00:00", "hash": "05b03e3cafe05934", "title_fa": "بایگانی انسان برای فهرست شدن در بازار سهام ایالات متحده، سودهای سریع درآمد و زیان های بزرگتر را نشان می دهد", "summary_fa": "اولین حضور در بازار شرکت هوش مصنوعی پشت ربات چت کلود یکی از بزرگترین در تاریخ ایالات متحده خواهد بود، آزمایشی برای رونق مالی هوش مصنوعی Anthropic به طور عمومی برای یک لیست در بازار سهام ثبت کرده است، که یکی از بزرگترین اولین عرضه ها در تاریخ است. شناور بودن این شرکت در بازار ایالات متحده احتمالاً یک علامت پر آب در رونق چند تریلیون دلاری هوش مصنوعی و آزمایشی برای دوام مالی آن خواهد بود. تحلیلگران و سرمایه گذاران شرکت مستقر در سانفرانسیسکو را که در سال 2021 تأسیس شده است، بیش از 1.5 تریلیون دلار ارزیابی کرده اند. این شرکت که تحت نماد ANT فهرست خواهد شد، به طور محرمانه برای عرضه اولیه عمومی در ماه ژوئن به تنظیم کننده های مالی ایالات متحده ارسال کرد. به خواندن ادامه دهید... در دفترچه سرمایه‌گذار این شرکت آمده است: «ما معتقدیم هوش مصنوعی یکی از مهم‌ترین فناوری‌ها در تاریخ بشر است. محققان و مدیران آنتروپیک بارها در مورد پتانسیل هوش مصنوعی برای انقراض انسان هشدار داده اند. آنتروپیک پیشرو در رقابت برای ایجاد مدل‌های هوش مصنوعی قدرتمند و پیشرو در رونق هوش مصنوعی آمریکا، ربات چت کلود را به عنوان محصول شاخص خود ارائه می‌کند که دارای ویژگی‌های تولید متن و همچنین قابلیت‌های کدنویسی و امنیت سایبری پیشرفته است. داریو آمودی، مدیر عامل شرکت، پس از ترک OpenAI، سازنده ChatGPT، این شرکت را تاسیس کرد. پرونده‌های حسابرسی شده Anthropic اولین نگاه عمومی به سلامت مالی آن را ارائه می‌کند، که در ماه‌های اخیر موضوع گمانه‌زنی‌های شدید به عنوان پرسش‌هایی درباره چرخش احتمالی حباب هوش مصنوعی بوده است. این شرکت درآمد سریع رو به رشد را در دفترچه توضیح داد: 41 میلیون دلار در سال 2023، 386 میلیون دلار در سال 2024، 4.585 میلیارد دلار در سال 2025 (افزایش بیش از 1000 درصد)، سپس 16.286 میلیارد دلار تنها در شش", "image_url": "https://i.guim.co.uk/img/media/445e90b032229c54129ea99217bf19c2cdd0d1a3/315_0_4582_3666/master/4582.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=33743c1351070150a448fc340ecd40d9", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "امنیت سایبری"], "datetime_fa": "۴ آبان • ۱۶:۴۲"}, {"source": "The Verge", "title": "Microsoft offers buyouts to 60,000 employees", "link": "https://www.theverge.com/tech/1018666/microsoft-expands-buyouts-60000-employees-eligible", "summary": "Microsoft is offering voluntary buyouts to up to 60,000 employees across the US, UK, Canada, and India. In a message to employees , Microsoft chief people officer Amy Coleman e flavors and balances out often overly sweet items,\" Lamagna said. If you don't want to sprinkle pure salt on your dessert, you can opt for crushed salted nuts, like peanuts or cashews, which will still do the trick and add extra texture. Remove your store-bought pie from its packaging to make it look homemade. A coat of chocolate can help keep a pie s filing in place. Animas Photography/Shutterstock Alexandra Lourdes, co-owner of Saint Honoré Doughnuts and Beignets, told BI that the easiest way to elevate a store-bought pie is to simply remove it from its original packaging. \"Make sure you take it out of the box it came in,\" Lourdes said. \"If you place it in a new box, add a ribbon, or arrange it on a beau", "date_str": "2026-10-26T14:21:39+00:00", "hash": "33696153a0ef0bb4", "title_fa": "به گفته نانواها و سرآشپزها، 12 راه آسان برای اینکه پایی که در فروشگاه خریداری می شود طعمی داشته باشد و خانگی به نظر برسد.", "summary_fa": "چند راه وجود دارد که می توانید مردم را فریب دهید تا فکر کنند پای خریده شده در فروشگاه شما خانگی است. راشل آسکیناسی سرآشپزها و نانوایان نکاتی را در مورد نحوه ساختن کیک های خریداری شده از فروشگاه به صورت خانگی و طعم بهتر به اشتراک گذاشتند. ذوب کردن کمی کره یا پاشیدن نمک روی پای می تواند به تعادل شیرینی آن کمک کند. پای خود را با پودر قند، حروف مات شده یا کمی کارامل تزئین کنید. همه وقت ندارند یک پای خوشمزه از ابتدا درست کنند. خوشبختانه، برخی از نسخه‌های خریداری شده در فروشگاه می‌توانند بسیار خوشمزه باشند - و اگر چند ترفند مفید را بلد باشید، می‌توانید آن را به صورت خانگی انتخاب کنید. بنابراین، Business Insider با سرآشپزها، نانواها و دیگر متخصصان آشپزی در مورد روش های مورد علاقه آنها برای بالا بردن پای های از پیش آماده صحبت کرد. در اینجا چند مورد از بهترین نکات آنها وجود دارد که ممکن است بخواهید قبل از غذای بعدی محله یا شام تعطیلات خود یادداشت کنید. یک سس کارامل گیاهی درست کنید تا طعم لذیذی به پای خریداری شده در فروشگاه اضافه کنید. نم نم نم نم کارامل می تواند دسر را بالا ببرد. لین میچل/ گتی ایماژ، نانوای حرفه ای و برنده جایزه TLC \"Cake Boss: Next Great Baker\" دانا هربرت، به Business Insider گفت که توصیه می کند سس کارامل گیاهی را به پای های آماده اضافه کنید. هربرت گفت: \"کمی دارچین، رزماری، آویشن، زنجبیل یا هل را به سس کارامل گرم اضافه کنید و آن را با پای سرو کنید.\" حتی گیاهان معطر سنتی می توانند مکمل دسرهای شیرین باشند. اگر مطمئن نیستید که آیا یک گیاه خاص با پای شما سازگار است یا نه، هربرت توصیه کرد چشمان خود را ببندید و گیاه یا ادویه را استشمام کنید - اگر بتوانید چیزی", "image_url": "https://i.insider.com/6adf5e778e95884e1ca83338?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آبان • ۱۷:۵۱"}, {"source": "Business Insider", "title": "I moved back home at 40. My husband, toddler, and I now live in my mom's living room.", "link": "https://www.businessinsider.com/moved-back-home-live-in-moms-one-bedroom-apartment-2026-10", "summary": "I moved back home at 40 and live in my mom s small apartment with my husband and our son. Yaritza Betancourt After my husband lost his job, we moved across the country and into my mom's one-bedroom apartment. My husband, toddler, and I live in her living room, and it's not always easy sharing a small space. However, the arrangement has come with lots of benefits and we've been able to get back on our feet. 7:30 p.m. marks the start of my son's bedtime routine. First, I pull out our pillows and bedding from under the chaise sofa bed, which I share with my son. Once our makeshift bed is set, I close the curtains separating it from the rest of the one-bedroom apartment. The tiny living room becomes our private oasis. I can almost forget we're at my mom's place, sleeping on a convertible sofa she'd originally bought for our annual visits, while my 6-foot-3 husband sleeps on his own air mattress on the ground right next to us. After my husband lost his job, moving in with my mom seemed like the right decision We booked one-way tickets to Logan Airport and never looked back. Yaritza Betancourt Squeezing into my mom's small Boston apartment was never the plan. Right after I graduated from college, I had moved to California to chase my Hollywood dreams of becoming an actor. During my two decades of living on the West Coast, I met my husband, got married, and became a stay-at-home mom. However, our lives were turned upside down in 2025 when my husband lost his job. For the first time, we really started thinking about moving to Boston, where I had grown up and my family still lived. I figured it would give us more flexibility with childcare, and a fresh start in a new city might be what we needed. When I called my mom to tell her about our plans, she was thrilled. She'd been telling us to move to Boston for years, and said we could stay with her in her one-bedroom apartment until we found a new place. So, we booked one-way tickets to Logan Airport and moved in with my mom. It's been challenging for all of us to share a one-bedroom apartment A curtain separates the living room from the rest of the apartment. Yaritza Betancourt Arriving in Boston was exciting, but the transition to sharing a one-bedroom apartment was trying — we took over the entire living room. The room became cluttered, with our clothes and suitcases spilling into the hallway. My mom expressed concern about the mess, so we rented a nearby storage unit for most of our belongings. Still, though, the t", "date_str": "2026-10-26T14:02:44+00:00", "hash": "4322f70f603cf9c8", "title_fa": "من در 40 سالگی به خانه برگشتم. من و شوهرم، کودک نوپا، اکنون در اتاق نشیمن مادرم زندگی می کنیم.", "summary_fa": "من در 40 سالگی به خانه برگشتم و در آپارتمان کوچک مادرم با شوهرم و پسرمان زندگی می کنم. یاریتزا بتانکور بعد از اینکه شوهرم شغلش را از دست داد، ما در سراسر کشور نقل مکان کردیم و به آپارتمان یک خوابه مادرم رفتیم. من و شوهرم، کودک نوپا، در اتاق نشیمن او زندگی می‌کنیم، و به اشتراک گذاشتن یک فضای کوچک همیشه آسان نیست. با این حال، این ترتیب مزایای زیادی به همراه داشته است و ما توانسته ایم دوباره روی پای خود بایستیم. ساعت 7:30 بعد از ظهر نشانه ش et plug. So I did what I do these days whenever I'm out of my depth: I asked ChatGPT . I sent it photos at every stage. It told me which tools to buy, showed me how to strip the cable, arrange the eight tiny wires in the right order, and even drew little diagrams when words weren't enough. When I got frustrated, it gave me a pep talk. My first attempt only delivered about 100 Mbps instead of our 1 Gbps internet connection. ChatGPT guessed two wires were faulty, suggested an inexpensive cable tester, interpreted the flashing lights from a photo, and confirmed the diagnosis. I cut the connector off and started again with a simpler plug it recommended. The result? Around 850 Mbps. My only complaint: ChatGPT would occasionally disappear down a rabbit hole with advice that was far more complicated than I needed, so I'd remind it I wasn't rewiring Silicon Valley. I just wanted my wife's Zoom calls to stop dropping. So far, her video calls have been perfect. Without ChatGPT, there's no chance I'd have pulled this off. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-10-26T14:00:01+00:00", "hash": "2c0296685445f0f5", "title_fa": "وای فای قوی همسر خوشبخت زندگی شاد. چگونه ChatGPT به من کمک کرد اینترنت خانگی خود را تعمیر کنم.", "summary_fa": "", "image_url": "https://i.insider.com/6adbc820c8572251b197f992?width=850&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["OpenAI"], "datetime_fa": "۴ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "The most famous musician of all time from every US state", "link": "https://www.businessinsider.com/most-famous-musician-from-every-state", "summary": "Dolly Parton had a whole theme park dedicated to her in Tennessee. Ron Davis/Getty Images Every state lays claim to at least one famous musician. We considered each artist's popularity, awards, and record sales to compile our list. Prince is famously from Minnesota, while Tony Bennett edged out the competition in New York. Though places like New York and California are known for producing countless celebrities, it turns out there's at least one — in most cases, many more — famous musicians from every US state. Business Insider has already identified the most famous band from every state , so we're now focusing on individual singers, songwriters, and performers. This encompasses country pioneers, rappers, jazz cats, pop stars — you name it. Even if they perform(ed) with a backing band, these musicians stand out as the star of the show. The list is somewhat subjective, but to help determine the most famous musician from every state, Business Insider looked at each artist's reputation (within their own era), record sales, and awards. It's also important to note that while most of these people were born in their corresponding state, others were not, but spent a lot of time living there. Check out which musician took the No. 1 spot in your home state. ALABAMA: Hank Williams GAB Archive/Redferns/Getty Images Hank Williams, who was born in Mount Olive, Alabama, is widely considered the father of country music and the genre's foremost songwriter. Before the pioneering musician tragically died at 29 years old in 1953, he released a slew of singles that rocketed to the top of the country music charts, including \"Kaw-Liga,\" \"Honky Tonk Blues,\" and \"Hey Good Lookin'.\" Although his career was cut short, his impressive catalog of songs lives on in the contemporary musical landscape, thanks to covers by artists including James Brown, Red Hot Chili Peppers, and Ray Charles. He was inducted into the Rock and Roll Hall of Fame in 1987. ALASKA: Jewel Steve Jennings/WireImage/Getty Although she was born in Payson, Utah, Jewel Kilcher grew up near Homer, Alaska, and is by far the state's most successful musical export. The singer has earned four Grammy nominations and sold more than 30 million records. She's best known for hit songs including \"Who Will Save Your Soul\" and \"You Were Meant for Me.\" Jewel, 52, is also known for her yodeling, which she learned from her father, Atz Kilcher, a local musician and star of the reality show \"Alaska: The Last Frontier.\" ARIZONA: Linda Ro", "date_str": "2026-10-26T13:49:24+00:00", "hash": "844f55462a49d922", "title_fa": "مشهورترین موسیقیدان تمام دوران از هر ایالت آمریکا", "summary_fa": "دالی پارتون یک پارک موضوعی کامل به او در تنسی اختصاص داده بود. ران دیویس/ گتی ایماژ هر ایالت حداقل یک نوازنده مشهور را مدعی است. ما محبوبیت، جوایز و رکورد فروش هر هنرمند را برای تهیه لیست خود در نظر گرفتیم. پرینس از شهر مینه سوتا است، در حالی که تونی بنت در رقابت در نیویورک پیشی گرفت. اگرچه مکان‌هایی مانند نیویورک و کالیفرنیا به خاطر تولید افراد مشهور بی‌شمار شناخته می‌شوند، اما مشخص شده است که حداقل یک - در بیشتر موارد، بسیاری دیگر - از نوازندگان مشهور از هر ایالت ایالات متحده وجود دارد. Business Insider قبلاً مشهورترین گروه را از هر ایالت شناسایی کرده است، بنابراین ما اکنون بر روی خوانندگان، ترانه سراها و مجریان فردی تمرکز می کنیم. این شامل پیشگامان کانتری، رپرها، گربه‌های جاز، ستاره‌های پاپ می‌شود. حتی اگر آنها با یک گروه پشتیبان اجرا کنند، این نوازندگان به عنوان ستاره نمایش برجسته می شوند. فهرست تا حدودی ذهنی است، اما برای کمک به تعیین مشهورترین موسیقیدان از هر ایالت، Business Insider به شهرت هر هنرمند (در دوره خود)، فروش رکورد و جوایز نگاه کرد. توجه به این نکته نیز مهم است که در حالی که اکثر این افراد در وضعیت مشابه خود به دنیا آمده اند، دیگران متولد نشده اند، اما زمان زیادی را در آنجا سپری کرده اند. ببینید کدام نوازنده شماره No را گرفته است. 1 نقطه در ایالت شما آلاباما: هنک ویلیامز بایگانی GAB/Redferns/Getty Images هنک ویلیامز، که در مونت اولیو، آلاباما به دنیا آمد، به طور گسترده پدر موسیقی کانتری و پیشروترین ترانه سرای این سبک در نظر گرفته می شود. قبل از اینکه این نوازنده پیشرو در 29 سالگی در سال 1953 به طرز غم انگیزی بمیرد، او تعداد زیادی تک آهنگ را منتشر کرد که به صدر جدول موسیقی کانتری رسید، از جمله \"Kaw-Liga\"، \"Honky Tonk Blues\"", "image_url": "https://i.insid       media: [{"source": "Billboard", "title": "Ella Langley’s ‘Choosin’ Texas’ Rebounds for Record-Extending 25th Week at No. 1 on Hot 100", "link": "https://www.billboard.com/lists/ella-langley-choosin-texas-hot-100-number-one-25th-week/", "summary": "Ella Langley ’s “Choosin’ Texas” rises a spot to notch a record-extending 25th week at No. 1 on the Billboard Hot 100 . Here’s an updated look at the longest-leading hits, ranked by most weeks spent at No. 1 on the Hot 100, since the chart began in August 1958: 25 weeks (to date), “Choosin’ Texas,” Ella Langley, 2026 22, “All I Want for Christmas Is You,” Mariah Carey, 2019-26 19, “A Bar Song (Tipsy),” Shaboozey, 2024 19, “Old Town Road,” Lil Nas X feat. Billy Ray Cyrus, 2019 16, “Last Night,” Morgan Wallen, 2023 16, “Despacito,” Luis Fonsi Daddy Yankee feat. Justin Bieber, 2017 16, “One Sweet Day,” Mariah Carey Boyz II Men, 1995-96 “Choosin’ Texas” initially ruled the Hot 100 in February, on its way to setting multiple chart records . Plus, three songs crash the Hot 100’s top five: Tate McRae’s “Housewife” debuts at No. 2; Olivia Rodrigo and Chappell Roan’s “Expectations” vaults 63-3, following the release of its remix adding Roan; and Zach Bryan’s “Lies,” featuring Lana Del Rey, opens at No. 4. Read on for details of the entire top 10 on this week’s Hot 100. The Hot 100 blends all-genre U.S. streaming (official audio and official video), radio airplay and sales data, the lattermost metric reflecting purchases of physical singles and digital tracks from full-service digital music retailers; digital singles sales from direct-to-consumer (D2C) sites are excluded from chart calculations. All charts dated Oct. 31, 2026, will update on Billboard.com tomorrow, Oct. 27. For all chart news, you can follow @billboard and @billboardcharts on both X, formerly known as Twitter, and Instagram. Plus, for all chart rules and explanations, click here . Luminate, the independent data provider to the Billboard charts, completes a thorough review of all data submissions used in compiling the weekly chart rankings. Luminate reviews and authenticates data. In partnership with Billboard , data deemed suspicious or unverifiable is removed, using established criteria, before final chart calculations are made and published.", "date_str": "2026-10-26T16:58:56+00:00", "hash": "44d4a27c94fc6c15", "title_fa": "«Choosin» تگزاس از الا لنگلی برای رکورد طولانی بیست و پنجمین هفته در رتبه اول در Hot 100 قرار گرفت.", "summary_fa": "«Choosin' Texas» از الا لنگلی رتبه‌ای را به خود اختصاص داد و در بیست و پنجمین هفته رکورددار رتبه اول در بیلبورد Hot 100 قرار گرفت. در اینجا نگاهی به روز به طولانی ترین موفقیت ها، رتبه بندی شده توسط اکثر هفته های صرف شده در شماره 1 در Hot 100، از زمان شروع نمودار در آگوست 1958: 25 هفته (تا امروز)، \"Choosin' Texas\"، Ella Langley، 2026 22، \"All I Want for Christmas Is You، 6 Mariah19\" (Tipsy)،” Shaboozey, 2024 19, “Old Town Road”, Lil Nas X feat. بیلی ری سایرس، 2019 16، «شب گذشته»، مورگان والن، 2023 16، «Despacito»، شاهکار پدر یانکی لوئیس فونسی. جاستین بیبر، ۲۰۱۷ ۱۶، «یک روز شیرین»، ماریا کری بویز دوم مردان، ۱۹۹۵-۹۶ «چوسین تگزاس» در ابتدا در ماه فوریه، در مسیر رسیدن به رکوردهای متعدد در چارت، بر ۱۰۰ نفر برتر حکمرانی کرد. به‌علاوه، سه آهنگ در بین پنج آهنگ برتر Hot 100 قرار می‌گیرند: «Housewife» از تیت مک‌ری در رتبه اول قرار گرفت. 2 \"انتظارات\" اولیویا رودریگو و چاپل روان پس از انتشار ریمیکس آن که Roan را اضافه کرد، 63-3 به نمایش درآمد. و «دروغ‌ها» زاک برایان، با حضور لانا دل ری، در رتبه 4 باز می‌شود. برای جزئیات کامل 10 تای برتر در Hot 100 این هفته، به ادامه مطلب مراجعه کنید. The Hot 100 ترکیبی از همه ژانرهای U.S. پخش جریانی (صوت رسمی و ویدیوی رسمی)، پخش رادیویی و داده‌های فروش، آخرین معیار منعکس‌کننده خرید تک‌آهنگ‌های فیزیکی و آهنگ‌های دیجیتال از خرده‌فروشان موسیقی دیجیتال با خدمات کامل؛ فروش تک آهنگ های دیجیتال از سایت های مستقیم به مصرف کننده (D2C) از محاسبات نمودار حذف شده است. همه نمودارهای مورخ 31 اکتبر 2026، فردا، 27 اکتبر در Billboard.com به‌روزرسانی می‌شوند. برای همه اخبار ن ne of the cookies on the snack table, then joins the rest of his classmates-turned-friends for a group photo. Coming Up Roses marks the fourth track on Styles March album Kiss All the Time. Disco, Ocassionally which debuted atop the Billboard 200 to get the music video treatment. Billboard Hot 100 No. 1 single Aperture also got a visual, as did American Girls and Dance No More. Watch the new video for Coming Up Roses above.", "date_str": "2026-10-26T16:35:08+00:00", "hash": "9dc348a8d1c46d99", "title_fa": "هری استایلز از طریق تفاوت هایش با گروهی از غریبه ها در ویدیوی \"Coming Up Roses\" می رقصد", "summary_fa": "هری استایلز در موزیک ویدیوی جدید خود برای Coming Up Roses، در زمین رقص با گروهی از غریبه ها نقاط مشترکی پیدا می کند که خواننده و ترانه سرا را در کنار یک پیشخدمت باردار، مردی با گردنبند، یک گاوچران جین پوشیده و شخصیت های دیگر در حال یادگیری گام های جدید می داند. هری استایلز مرتبط بی سر و صدا نشان می دهد که در حال انتشار یک موزیک ویدیوی جدید برای آهنگ مورد علاقه طرفداران است. 26) با استایلز در سالن رقص با ترکیب عجیب و غریب از همکلاسی‌هایش شروع می‌کند، ابتدا با چند چمباتمه خود را گرم می‌کند قبل از اینکه به آرامی جای خود را پیدا کند در حالی که به طرز ناشیانه گام‌های اولیه را با شرکای مختلف امتحان می‌کند. همانطور که او بهبود می یابد، برنده گرمی قبل از اینکه به مردی با کت و شلوار بچرخد، با زنی با لباس عروس دور می شود و به طور تصادفی او را روی میز می چرخاند. فقط برای امشب، بیایید به دنبال خماری برویم/ و من با شما صحبت خواهم کرد که چرا امن است، او آواز می خواند. در حالی که کلماتم را زیر و رو می کنم و از طریق حقیقت روی صورتم می افتم/ فقط کلمه را بگو و ما امتحان می کنیم. در طول ساز ارکستر آهنگ، استایلز و همکلاسی‌هایش در حال اجرای یک روال تک‌نوازی الهام‌بخش که شامل تعدادی حرکات پرنده‌مانند است، تماشا می‌کنند. پس از اخراج کلاس، ستاره پاپ بریتانیایی برای لحظه‌ای به عقب می‌نشیند تا با تعمق یکی از کلوچه‌های روی میز تنقلات را میل کند، سپس به بقیه همکلاسی‌هایش که تبدیل به دوستان شده‌اند، برای یک عکس دسته جمعی می‌پیوندد. Coming Up Roses چهارمین آهنگ آلبوم Styles March را به نام Kiss All Time نشان می دهد. دیسکو، گهگاهی که در بالای بیلبورد 200 برای دریافت درمان", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/harry-styles-coming-up-roses-screenshot-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آبان • ۲۰:۰۵"}, {"source": "Billboard", "title": "Sam Fender Criticizes Own Tour Prices, Eliminates Premium Standing Tickets for U.K. Shows: ‘It’s Bollocks’", "link": "https://www.billboard.com/music/rock/sam-fender-criticizes-his-tour-prices-2027-uk-shows-1236367890/", "summary": "Sam Fender is heading out on a Proper Massive stadium tour in June 2027, but he’s “not happy” with the prices of his own shows. Related Sam Fender Is Doing a Proper Massive Stadium Tour for 2027 in U.K. Ireland, Including Nights at Wembley How Sam Fender Olivia Dean s Rein Me In Became the U.K. s Longest-Running No. 1 Single Ever Capitol Music Group CEO Tom March on the Incredible Sienna Spiro, Breaking Sam Fender in the U.S. More The 32-year-old wrote on Instagram Saturday (Oct. 24) that he was disappointed with the pricing for the upcoming run and that “they’re getting changed.” Fender is due to play a number of stadium shows in Newcastle, Manchester, Cardiff, Edinburgh and two nights at London’s Wembley Stadium in June. Fender first responded to the tour prices in an Instagram comment writing, “I’m not happy with these prices, they’re getting changed. It got inflated well more than I’d had in mind, it should only be inflated in relation to the cost of putting the show on.” The “Rein Me In” star responded to criticism of a premium and more expensive ticket for the front standing area. “The standing will not be split as well, I had no idea about it,” he explained. “I have no idea how this was normalised in gigs. It’s bollocks and it won’t be happening on this tour.” Fender revealed the revised prices on his Instagram Story Sunday and changed the layout of the shows. I ve managed to get front standing tickets removed from the U.K. stadium tour. Whoever buys a standing ticket gets as much chance as anyone to be at the front. No more 120 quid standing tickets either.” He added, Costs are astronomical compared to two years ago, I can t control the venue and ticketing fees, that s a sad reality of today s industry. General admission tickets will now begin at £85 ($113), with seated tickets priced at £55 ($73), £75 ($100) and £95 ($126) depending on the seats locations. These prices exclude venue and ticket company fees, and the £1 per ticket contribution to the LIVE Trust which supports grassroots venues across the U.K. A presale for tickets begins at 9:30 GMT on Wednesday (Oct. 28), followed by a general sale on Friday (Oct. 31). Earlier this year, Fender broke the all-time record for the longest-running No. 1 on the U.K. s Official Singles Chart with 23 non-consecutive weeks at the summit for Olivia Dean collaboration Rein Me In. The song peaked at No. 45 on the Billboard Hot 100 .", "date_str": "2026-10-26T16:13:22+00:00", "hash": "59d2b6f515c456e1", "title_fa": "سم فندر از قیمت‌های تور خود انتقاد می‌کند، بلیط‌های ممتاز ایستاده برای نمایش‌های بریتانیا را حذف می‌کند: «این بولوک است»", "summary_fa": "سام فندر در ژوئن 2027 برای یک تور استادیوم Proper Massive می رود، اما از قیمت نمایش های خودش «راضی نیست». سام فندر در حال برگزاری یک تور استادیوم عظیم برای سال 2027 در بریتانیا در ایرلند است، از جمله شب‌هایی در ومبلی چگونه سم فندر اولیویا دین Rein Me In به طولانی‌ترین تک آهنگ تاریخ بریتانیا تبدیل شد. این مرد 32 ساله شنبه (اکتبر) در اینستاگرام نوشت. 24) که او از قیمت گذاری برای اجرای آینده ناامید شده است و \"آنها در حال تغییر هستند.\" فندر قرار است تعدادی نمایش در استادیوم در نیوکاسل، منچستر، کاردیف، ادینبورگ و دو شب در ورزشگاه ومبلی لندن در ماه ژوئن برگزار کند. فندر ابتدا در یک کامنت اینستاگرامی به قیمت تورها پاسخ داد و نوشت: «من از این قیمت‌ها راضی نیستم، آنها در حال تغییر هستند. خیلی بیشتر از آن چیزی که من در ذهن داشتم متورم شد، فقط باید در رابطه با هزینه اجرای نمایش باد کرد.\" ستاره \"Rein Me In\" به انتقاد از بلیط ممتاز و گرانتر برای محوطه جلویی پاسخ داد. او توضیح داد: \"جایگاه نیز تقسیم نخواهد شد، من هیچ ایده ای در مورد آن نداشتم.\" من نمی دانم که چگونه این در کنسرت ها عادی شد. این بولوک است و در این تور اتفاق نخواهد افتاد.\" فندر در استوری اینستاگرام خود یکشنبه قیمت های اصلاح شده را فاش کرد و طرح نمایش ها را تغییر داد. من موفق شدم بلیط های ایستاده جلو را از تور استادیوم بریتانیا حذف کنم. هرکسی که بلیط ایستاده بخرد به اندازه هر کسی شانس حضور در جلو را دارد. بلیط ایستاده 120 دلاری نیز وجود ندارد.\" او افزود، هزینه ها در مقایسه با دو سال پیش نجومی است، من نمی توانم محل برگزاری و هزینه های بلیط را کنترل کنم، که این یک واقعیت غم انگیز صنعت امروز است. بلیط های", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/sam-fender-cr-melissa-gardner-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آبان • ۱۹:۴۳"}, {"source": "Billboard", "title": "A Full List of Current 2026 K-Pop Concerts (Updating)", "link": "https://www.billboard.com/culture/product-recommendations/current-k-pop-concerts-1236234463/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. There are enough K-pop concerts and world tours this year to make keeping track of who’s touring where a challenge. As the genre becomes more popular in the States and across the globe, artists have begun expanding their horizons, taking their tours beyond Asia to stop in North America and beyond. That s not even including the K-pop acts headlining music festivals and conventions that are taking place this year. On the docket for 2026, we ve seen big names embarking on massive world tours and even Las Vegas residencies, like BLACKPINK s Lisa s Viva La Lisa . Epik High, BOYNEXTDOOR and KATSEYE are just a few big names touring towards t حسابرسی خاصی را برای اهداف حسابداری دریافت کند. امسال کنسرت‌های کی‌پاپ و تورهای جهانی به اندازه‌ای وجود دارد که ردیابی افرادی که در کجا تور می‌روند به یک چالش تبدیل شود. با محبوبیت بیشتر این ژانر در ایالات متحده و در سراسر جهان، هنرمندان شروع به گسترش افق های خود کرده اند و تورهای خود را فراتر از آسیا می برند تا در آمریکای شمالی و فراتر از آن متوقف شوند. این حتی شامل کنش‌های کی‌پاپ سرفصل جشنواره‌ها و کنوانسیون‌های موسیقی که امسال برگزار می‌شود، نیست. در تاریخ 2026، نام‌های بزرگی را دیده‌ایم که تورهای عظیم جهانی و حتی اقامتگاه‌های لاس وگاس را آغاز کرده‌اند، مانند BLACKPINK s Lisas Viva La Lisa. Epik High، BOYNEXTDOOR و KATSEYE تنها چند نام بزرگ هستند که در پایان سال تور می‌کنند و هنرمندان بیشتری مدام تورهای خود را اعلام می‌کنند. برای آگاه نگه داشتن شما، فهرستی از کنسرت های کی پاپ که تا کنون در سال 2026 برگزار می شود و جایی که می توانید بلیط بخرید، گردآوری کرده ایم. مثل همیشه، به خاطر داشته باشید که مکان رسمی برای گرفتن بلیط همه این رویدادها از طریق Ticketmaster خواهد بود. همانطور که گفته شد، ما همچنین پیوندهایی را به سایت های فروش مجدد و سایت های شخص ثالث اضافه کرده ایم. کنسرت‌های کی‌پاپ ۲۰۲۶ (به‌روزرسانی‌شده) اکتبر ۲۰۲۶: ۲۷ اکتبر: تور Epik High Epik High 3.0 در لاس‌وگاس، NV (خرید بلیت در StubHub یا SeatGeek) ۲۸ اکتبر: تور KATSEYE Wildworld 2026، بلیت‌ها در MasyBuH در Bos. SeatGeek ) 29 اکتبر: تور Epik High Epik High 3.0 در سن دیگو، کالیفرنیا (خرید بلیط در StubHub یا SeatGeek)", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/K-Pop-2026-Concerts-Buy-Tickets-Online.png?w=720", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آبان • ۱۹:۴۰"}, {"source": "Billboard", "title": "Turnstile Bring Hardcore Fury (and 60,000 Fans) to Washington Monument: Exclusive Photos", "link": "https://www.billboard.com/photos/turnstile-washington-monument-photos-1236367838/", "summary": "Turnstile brought the pit to America s front yard on Saturday (Oct. 24), playing a free show for more than 60,000 fans gathered near the Washington Monument in Washington, D.C. The Baltimore hardcore group s biggest show to date was also the final gig on the North American tour in support of their Never Enough album and a landmark for the group whose Maryland-bred singer is a practical native of the nation s capital. The show, Turnstile at the Washington Monument, was co-hosted by Human Concern International and aimed at raising funds to benefit humanitarian efforts in Palestine, Sudan and Lebanon. The gig drew legions of the Grammy-winning hardcore band s fans to the hilly lawn near the iconic monument for a rager that featured massive, roiling mosh pits , a likely first for the august site that in the past has hosted everything from the massive 1963 civil rights March on Washington to this past summer s tepid Great American State Fair Kickoff. According to The Washington Post , singer Brendan Yates told the crowd, Today we’re here to gather around music to celebrate humanity. But also to fight for it. Be loud enough for the White House to hear,” then leading the crowd in a pro-Palestinian chant, Free Palestine!, with his head turned toward the White House just blocks away, as well as Free Sudan! and Free Lebanon! Before the 75-minute show, Human Concern International s global director announced that the show had reportedly earned $150,000, easily surpassing the initial $100K goal. The 19-track setlist included such beloved songs as Birds, Endless, Keep It Moving, Holiday, Blackout and the finale, T.L.C. (Turnstile Love Connection). Turnstile won their first of two Grammy Awards in February for best rock album ( Never Enough ) and best metal performance ( Birds ) and then made their Saturday Night Live debut earlier this month, becoming the first hardcore group to rock the Studio 8H stage since Fear s legendarily chaotic 1981 debut. Check out Billboard s exclusive pics from the show.", "date_str": "2026-10-26T16:04:36+00:00", "hash": "1b87f78dfa887cf2", "title_fa": "Turnstile Bring Hardcore Fury (و 60000 طرفدار) را به بنای یادبود واشنگتن: عکس های اختصاصی", "summary_fa": "Turnstile روز شنبه (24 اکتبر) گودال را به حیاط جلویی آمریکا آورد و نمایشی رایگان برای بیش از 60000 طرفدار که در نزدیکی بنای یادبود واشنگتن در واشنگتن گرد هم آمده بودند اجرا کرد. این نمایش، Turnstile در بنای یادبود واشنگتن، توسط Human Concern International برگزار شد و هدف آن جمع آوری کمک های مالی برای کمک به تلاش های بشردوستانه در فلسطین، سودان و لبنان بود. این کنسرت لشکر طرفداران گروه هاردکور برنده گرمی را به چمنزار تپه‌ای نزدیک بنای یادبود نمادین کشاند تا خشمگینی که گودال‌های موش عظیم و متلاطم را نشان می‌دهد، احتمالاً اولین بار برای سایت آگوست که در گذشته میزبان همه چیز بود، از راهپیمایی عظیم حقوق مدنی در واشنگتن در سال 1963 تا تابستان گذشته تابستانی گرم در ایالت آمریکا. به گزارش واشنگتن پست، برندان یتس خواننده به جمعیت گفت: امروز اینجا هستیم تا دور موسیقی جمع شویم تا بشریت را جشن بگیریم. بلکه برای آن مبارزه کنید. آنقدر بلند باشید که کاخ سفید بشنود.» سپس جمعیت را با شعار طرفدار فلسطین، فلسطین آزاد کن!، با سر چرخانده به سمت کاخ سفید و همچنین سودان آزاد! و لبنان آزاد هدایت کرد! این لیست 19 آهنگی شامل آهنگ های محبوبی مانند Birds، Endless، Keep It Moving، Holiday، Blackout و پایانی، T.L.C. (ترنستیل عشق اتصال). Turnstile اولین بار از دو جایزه گرمی خود را در فوریه برای بهترین آلبوم راک (Never Enough) و بهترین اجرای متال (پرندگان) دریافت کرد و سپس اولین بازی Saturday Night Live خود را در اوایل این ماه انجام داد و اولین گروه هاردکور بود که از زمان اولین نمایش پر هرج و مرج افسانه ای Fear در سال 1981، صحنه استودیو 8H را راک کرد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/08-turnstile-washington-monument-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آبان • ۱۹:۳۴"}, {"source": "Deadline", "title": "CAA Signs Bloodline Banter Comedy Duo", "link": "https://deadline.com/2026/10/bloodline-banter-comedy-duo-signs-caa-1237171648/", "summary": "EXCLUSIVE: CAA has signed Landon Mauk and Riley Mitchell, a pair of cousins better known as comedy duo Bloodline Banter.
