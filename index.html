 Co-Founder Billy Jones", "link": "https://pitchfork.com/story/brooklyn-street-named-after-late-babys-all-right-co-founder-billy-jones/", "summary": "“Billy did more for music in New York than what can be put into words”", "date_str": "2026-10-19T19:25:54+00:00", "hash": "788a5af31c026ba7", "title_fa": "خیابان بروکلین به نام بیلی جونز، بنیانگذار Late Baby’s All Right نامگذاری شده است", "summary_fa": "«بیلی برای موسیقی در نیویورک بیشتر از آن چیزی که بتوان آن را در قالب کلمات بیان کرد» Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان بیلی جونز، یکی از بنیانگذاران و مالک فقید Baby's All Right همراه با چندین مورد دیگر از زندگی شبانه شهر نیویورک، خیابان جدیدی به نام خود دارد. Billy Jones Way در طی مراسمی در روز یکشنبه، در گوشه خیابان بدفورد و برادوی در بروکلین، درست پایین خیابان از Baby’s رونمایی شد. جونز در سال 2025 بر اثر گلیوبلاستوما درگذشت. او 45 سال داشت. علاوه بر Baby’s، جونز مکان‌هایی در شهر نیویورک از جمله Night Club 101، Elvis Guesthouse، The Dance و Funny Bar را افتتاح کرد. پس از رونمایی خیابانی، Baby's All Right میزبان مهمانی بود که شامل مجموعه‌های شگفت‌انگیز از Blood Orange، Porches، Fcukers و غیره بود."}, {"source": "Pitchfork", "title": "Watch Cardi B Blaze Through Her No-Brakes Tiny Desk Performance", "link": "https://pitchfork.com/story/watch-cardi-b-blaze-through-her-no-brakes-tiny-desk-performance/", "summary": "The rapper’s backing band gave fresh, rock-inflected updates to singles like “ErrTime,” “Up,” and “Bodak Yellow”", "date_str": "2026-10-19T17:07:09+00:00", "hash": "24206fd2f7984727", "title_fa": "Cardi B Blaze Through Her No-Brakes Tiny Desk Performance را تماشا کنید", "summary_fa": "گروه پشتیبان رپر به‌روزرسانی‌های تازه و سبکی را برای تک‌آهنگ‌هایی مانند «ErrTime»، «Up» و «Bodak Yellow» ارائه کرد. این خواننده رپ در 18 دقیقه یک مجموعه هشت آهنگی را اجرا کرد و فقط مکث کوتاهی کرد تا نوازندگان پشتیبان خود را فریاد بزند و در یک نقطه به کمبود کیک خرچنگ مریلند در راکب خود اشاره کرد. در همین حال، گروه نه نفره به‌روزرسانی‌های تازه و سبکی را برای تک‌آهنگ‌هایی مانند Am I the Drama ارائه کرد؟ «ErrTime»، «Up» و «Bodak Yellow». پایین رفتن آن را تماشا کنید. در ماه فوریه، کاردی بی برای دومین حضور خود به عنوان مهمان موسیقی، در اپیزودی که توسط الکساندر اسکارسگارد میزبانی شد، به صحنه زنده شنبه شب بازگشت. تا کنون او موضوع آیا من درام هستم؟ ، آلبوم سال 2025 او، با چند قطعه تکی: جام تابستانی \"Ah Ha\" و \"Don't Chart\"، سهم او در موسیقی متن فیلم Grand Theft Auto VI. درباره کاردی بی در 25 خنده دارترین خواننده رپ تمام دوران بخوانید."}, {"source": "Pitchfork", "title": "Sophia Stel, Worldpeace DMT, Weed420, and More: This Week’s Pitchfork Selects Playlist", "link": "https://pitchfork.com/story/sophia-stel-worldpeace-dmt-weed-420-this-weeks-pitchfork-selects-playlist/", "summary": "Our weekly playlist highlights songs that our writers, editors, and contributors are listening to on repeat", "date_str": "2026-10-19T17:00:59+00:00", "hash": "d0a3308296de306b", "title_fa": "Sophia Stel، Worldpeace DMT، Weed420، و بیشتر: این هفته Pitchfork لیست پخش را انتخاب می کند", "summary_fa": "فهرست پخش هفتگی ما آهنگ‌هایی را برجسته می‌کند که نویسندگان، ویراستاران و مشارکت‌کنندگان ما با تکرار به آن‌ها گوش می‌دهند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان کارکنان Pitchfork به موسیقی‌های جدید زیادی گوش می‌دهند. مقدار زیادی از آن. در هر روز، نویسندگان، ویراستاران و همکاران ما تعداد قابل توجهی از انتشارات جدید را پشت سر می گذارند، به یکدیگر توصیه می کنند و در طول راه موارد دلخواه جدید را کشف می کنند. هر دوشنبه، با لیست پخش Pitchfork Selects، آنچه نویسندگانمان با وسواس می‌نوازند را به اشتراک می‌گذاریم و برخی از موسیقی‌های جدید مورد علاقه کارکنان Pitchfork را برجسته می‌کنیم. لیست پخش مجموعه ای از آهنگ ها است: تنها اصل راهنمای آن این است که این ها آهنگ هایی هستند که با کمال میل برای یک دوست ارسال می کنید. لیست پخش Pitchfork Selects این هفته دارای Sophia Stel، Worldpeace DMT، Weed 420 و موارد دیگر است. به زیر گوش دهید و لیست های پخش ما را در Apple Music و Spotify دنبال کنید. (Pitchfork از خریدهایی که از طریق پیوندهای وابسته در سایت ما انجام می شود، پورسانت دریافت می کند.) Worldpeace DMT: Ivy — Hattie Lindert Olivia Rodrigo, Chappell Roan: Expectations — Anna Gaca Sophia Stel: Better Believe It — Olivier Lafontant June McDoom: Dream Dub — Lily Goldquí Lasson Vedos —2 Babyfxce E: Fake Don — Alphonse Pierre Foenem: Milwaukee Brewers — Mano Sundaresan Fka Boursin: From Space Between — JL Andy Shauf - Angela the Traveler — Nina Corcoran TVOD: Wet Brain — NC سارا کولیج: Mickey — LG On the Ifness — LG On the Ifness: VL: Lucki: What It Is — OL Pi'erre Bourne: What's Latest — MS A$AP Rocky: Shroom Clouds — Alex Suskind 509 BMG: Haitian K [ft. KeepTweakin] - OL"}, {"source": "Pitchfork", "title": "Watch Underscores Debut New Song With Jane Remover", "link": "https://pitchfork.com/story/watch-underscores-bring-out-jane-remover-to-debut-new-song/", "summary": "The duo premiered the collaboration during Underscores’ Charli xcx support slot in Inglewood", "date_str": "2026-10-19T17:00:53+00:00", "hash": "cf93b29fa149d1b6", "title_fa": "اولین آهنگ جدید Underscores را با جین ریموور تماشا کنید", "summary_fa": "این دو نفر اولین بار این همکاری را در طول شکاف پشتیبانی Charli xcx Underscores در Inglewood Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان شب گذشته، Underscores مهمان غافلگیرکننده جین ریموور را به صحنه انجمن کیا در اینگلوود، کالیفرنیا دعوت کرد، جایی که او از Charli xcx حمایت می کرد. تصاویری از اولین آهنگ جدید این دو نفر که هنوز نامی ندارد را در زیر تماشا کنید. هر دو هنرمند امسال با Pitchfork در مورد یک همکاری احتمالی صحبت کرده اند. در مصاحبه‌ای با Mano Sundaresan که در ژوئن منتشر شد، جین ریموور گفت که آوریل هارپر گری از Underscores \"فقط باید برای من چیزهایی بفرستد.\" آنها اضافه کردند، \"او قبل از اینکه هر دو مجبور شویم در تورهای مربوطه خودمان را ترک کنیم، مرا مورد ضرب و شتم قرار داد و او اینگونه گفت، اوه، می‌خواهی برایت چیزهایی بفرستم؟ جین ریموور افزود، اگرچه آنها فوراً این کار را انجام ندادند، \"می‌دانی این فقط کارمایی است؟ این سرنوشت است. اما این خواهر لعنتی من است. من او را تا ماه و برگشت دوست دارم.\""}, {"source": "Pitchfork", "title": "Tinashe Is Touring in 2027", "link": "https://pitchfork.com/story/tinashe-is-touring-in-2027/", "summary": "The Show Must Go On kicks off in April", "date_str": "2026-10-19T16:38:09+00:00", "hash": "6c350510bd4333ff", "title_fa": "Tinashe در حال گردش در سال 2027 است", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان عملیات: Uplift Tinashe به مرحله بعدی رفته است. ستاره پاپ استار به تازگی تور بهار 2027 را پشت آلبوم تحسین شده اعلام کرده است که در آوریل آینده با سه قرار تگزاس آغاز می شود. این سفر یک ماه بعد در کالیفرنیا به پایان می رسد. مسیر زیر را بررسی کنید. قبل از پایان سال، Tinashe میزبان اجرای دور پیروزی در بروکلین (در 24 اکتبر) و لس آنجلس (در 7 نوامبر) خواهد بود. او همچنین قرار است دو تاریخ در تور جاری هری استایلز در بهار آینده افتتاح کند. تیناشه ماه گذشته Popstar را با گروهی از تمجیدهای انتقادی و تجاری و همچنین آثار هنرمندانی از جمله Charli XCX منتشر کرد، که او را در Austin City Limits آوردند تا «Nobody Wanna Dance Anymore» و «Melatonin» را برای اولین بار به نمایش بگذارند. Tinashe: The Show Must Go On اکنون در Ticketmaster بخرید اکنون در Stubhub The Show Must Go On 10-24 Brooklyn, NY – Brooklyn Paramount 11-07 Los Angeles, CA - Hollywood Palladium 04-14 Dallas, TX - The Bomb Factory 04-15 A. Walltheerek A. 04-16 هیوستون، TX - Bayou Music Hall 04-18 Kansas City, MO - The Midland Theatre 04-20 Nashville, TN - Marathon Music Works 04-22 Atlanta, GA - The Eastern 04-24 Charlotte, NC - The Fillmore 04-24An Philmore, The Fillmore, The Fillmore 04-26Anshville, 26-04-Anshville - Franklin Music Hall 04-28 Boston, MA - Roadrunner 05-01 Pittsburgh, PA - Stage AE 05-05 Denver, CO - Mission Ballroom 05-06 Salt Lake City, UT - The Union 05-08 Portland, OR - TBA 05-11 Seattle Vancou, 05-10 British Bottle Vancou WA - Paramount Theatre 05-13 Oakland, CA - Fox Theatre 05-15 Los Angeles, CA - Shrine Expo Hall"}, {"source": "Rolling Stone", "title": "Solitary Confinement and Soft Rock in a Notorious Russian Prison", "link": "https://www.rollingstone.com/politics/politics-features/evan-gershkovich-book-excerpt-inside-moscow-prison-1235644004/", "summary": "In an excerpt from This Cursed Beautiful Land , journalist Evan Gershkovich writes about getting locked up after his 2023 arrest", "date_str": "2026-10-20T14:00:00+00:00", "hash": "e04170ba824ce274", "title_fa": "سلول انفرادی و راک نرم در یک زندان بدنام روسیه", "summary_fa": "در گزیده ای از این سرزمین زیبای نفرین شده، روزنامه نگار ایوان گرشکویچ در مورد حبس شدن پس از دستگیری اش در سال 2023 می نویسد. گرشکویچ شش سال پیش به مسکو نقل مکان کرده بود، یک روزنامه نگار جوان که امیدوار بود دانش خانوادگی خود از زبان روسی و علاقه به وطن پدر و مادرش را به حرفه خبرنگاری خارجی تبدیل کند. او موفق بود - اما با هزینه ای وحشتناک. در سال 2023، گرشکویچ در حالی که در مورد شرکت نظامی خصوصی روسی واگنر گروپ گزارش می داد، توسط ماموران سرویس های امنیتی روسیه دستگیر و به جاسوسی متهم شد. محاکمه و پس از آن بازداشت او یکی از دراماتیک ترین داستان های رسانه ای حمله روسیه به اوکراین بود. گرشکویچ 17 ماه را در زندان گذراند، که بیشتر آن را در زندان بدنام لفورتوو مسکو گذراند، قبل از اینکه به عنوان بخشی از مبادله زندانیان سیاسی در اوت 2024 آزاد شود. اولین چیزی که ثبت کردم موسیقی بود. آرامش‌بخش و شاداب بود — راک نرم، شاید مربوط به اواسط دهه ۲۰۰۰. بعد از آهنگ صدای جینگ آمد. «Relax FM»، صدای مردانه باریتون نرمی که قبل از تغییر به روسی به زبان انگلیسی با لهجه اعلام شد، «برای افکار آرام و شاد». افکار من دقیقاً آرام و خوشحال نبودند: در سلول شماره 40 به تازگی بسته شده بود. همانطور که به محیط جدیدم نگاه می کردم، صدای تق تق کلیدهای فلزی را در قفل پشت سرم شنیدم، پیچ مرده که با دو پیچ پر سر و صدا در جای خود می لغزید. سرم را زیر یک آویز فرو بردم و وارد فضایی دنج شدم. حدود دوازده فوت طول، هشت فوت عرض. در بالاترین نقطه، سقف مقعر حدود یازده فوت بالاتر از کف سیمانی قرار داشت. از آنجایی که من دقیقاً شش فوت قد دارم، سلول می‌تواند دو نفر"}, {"source": "Rolling Stone", "title": "The 2027 Grammys’ Best Rap Album Nominees May Not Be the Usual Suspects", "link": "https://www.rollingstone.com/music/music-features/grammys-2027-best-rap-album-predictions-nominees-1235644526/", "summary": "Look for Don Toliver to score his first Best Rap Album nomination, and strong showings by J. Cole, Cardi B, A$AP Rocky", "date_str": "2026-10-20T13:54:38+00:00", "hash": "173bad44f808dae9", "title_fa": "نامزدهای بهترین آلبوم رپ گرمی 2027 ممکن است مظنونین معمول نباشند", "summary_fa": "به دنبال دون تولیور باشید تا اولین نامزدی بهترین آلبوم رپ خود را به دست آورد، و نمایش قوی توسط جی کول، کاردی بی، A$AP راکی ​​پیشرو در نامزدی جایزه گرمی در 16 نوامبر، \"رولینگ استون\" در حال تقسیم 11 دسته مختلف است. برای هر کدام، نامزدها و همچنین اینکه چه کسی (و چه کسی باید) در شب گرمی برنده شود را پیش‌بینی می‌کنیم. رابطه آکادمی ضبط با هیپ هاپ در دهه گذشته بسیار بهبود یافته است. رای دهندگانی که قبلاً به دلیل تحقیر هنرمندان میراث دار محترم و تازه واردان تحسین شده فرهنگی به نفع عزیزان رسانه اصلی مورد انتقاد قرار می گرفتند، اخیراً در فرآیند انتخاب خود تأکید کمتری بر موفقیت تجاری و جذابیت متقاطع داشته اند. آکادمی ضبط صدا در پاسخ به شکست هایی مانند پیروزی بدنام بهترین آلبوم رپ مککلمور و رایان لوئیس بر کندریک لامار در پنجاه و ششمین دوره جوایز سالانه گرمی، به این انتقادات پرداخت و صندوق رای خود را اصلاح کرد تا گنجاندن و تنوع درخواستی مردم را منعکس کند. Phylicia Fant، مدیر جهانی موسیقی و فرهنگ سیاه، آمازون موزیک، به رولینگ استون می گوید: من شاهد بوده ام که آکادمی ضبط گام های مهمی در گسترش و تنوع اعضای رای خود برداشته است. هیپ هاپ صرفا یک ژانر نیست. این یک نیروی محرکه در تکامل موسیقی، مد، هنر و فرهنگ جهانی است. اکنون، در نظر گرفتن پول فرهنگی یک کنش بیش از هر زمان دیگری مرتبط است و در نتیجه نمایش دقیق تری از بهترین موسیقی هیپ هاپ ارائه می شود. این امر به بازیگرانی که برای اضافه کردن جایزه گرمی به فهرست جوایز خود که احتمالاً در گذشته مورد توجه قرار نمی‌گرفتند، امید تازه‌ای داده است و زمینه را برای نامزدهای بالقوه گسترده‌تر از همیشه کرده است."}, {"source": "Rolling Stone", "title": "Rosalía, Daddy Yankee, And Silvana Estrada to Perform at 2026 Latin Grammys", "link": "https://www.rollingstone.com/music/music-latin/latin-grammy-2026-performers-rosalia-daddy-yankee-1235645073/", "summary": "Anitta, Banda Los Recoditos, Jorge Drexler, Kany García, Juanes, Carín León, Mon Laferte, Vivir Quintana, Rawayana, Elena Rose, and Xavi will also perform at the ceremony", "date_str": "2026-10-20T13:00:00+00:00", "hash": "ada04e49f4c56d72", "title_fa": "روزالیا، بابا یانکی و سیلوانا استرادا در گرمی لاتین ۲۰۲۶ اجرا خواهند کرد", "summary_fa": "Anitta، Banda Los Recoditos، Jorge Drexler، Kany García، Juanes، Carín León، Mon Laferte، Vivir Quintana، Rawayana، Elena Rose و Xavi نیز در این مراسم اجرا خواهند کرد. گرمی لاتین لیست بازیگران هیجان انگیز خود را برای مراسم 2027 اعلام کرده است. روز سه‌شنبه، آکادمی ضبط لاتین نامزدهای برتر روزالیا و سیلوانا استرادا و بابا یانکی شخصیت سال 2026 را در مراسم امسال که در 12 نوامبر در MGM Grand Garden Arena در لاس‌وگاس برگزار می‌شود، معرفی کرد. سال، آهنگ سال، بهترین آهنگ پاپ، و بیشتر. استرادا 2025 LP Vendrán Suaves Lluvias برای دسته بندی های بزرگی مانند آلبوم سال، ضبط سال، و آهنگ سال آماده است. سایر نامزدهای جایزه گرمی لاتین نیز روی صحنه خواهند رفت، از جمله خورخه درکسلر و مون لافرته. درکسلر 7 تا برای LP Taracá خود گرفت در حالی که Mon Laferte 6 برای Femme Fatale دریافت کرد. آنیتا، کارین لئون، راویانا و النا رز نیز در این مراسم اجرا خواهند کرد. هر هنرمند امسال برای دریافت جایزه پرجمعیت آلبوم سال حضور دارد. داستان‌های پرطرفدار ماریا کری شکایت 20 میلیون دلاری هتک حرمت برادر را به خاطر خاطرات کامل شکست داد. عمل جراحی پایین تایید کننده جنسیت از جمله نوازندگان دیگر شامل نامزدهای آهنگ سال، خوانس و ویویر کوینتانا، نامزد بهترین آلبوم پاپ سنتی، کانی گارسیا، نامزد بهترین آلبوم موسیقی معاصر مکزیکی، ژاوی، و باندا لوس رکودیتوس است که برای بهترین آلبوم باندا نامزد شده است."}, {"source": "Rolling Stone", "title": "Alex Warren and Megan Moroney Want to Share It All", "link": "https://www.rollingstone.com/music/music-features/alex-warren-megan-moroney-musicians-on-musicians-1235644262/", "summary": "Two chart-topping stars find common ground on the joys and perils of playing live and being as vulnerable as humanly possible", "date_str": "2026-10-20T13:00:00+00:00", "hash": "668278d01f5fae4c", "title_fa": "الکس وارن و مگان مورونی می خواهند همه چیز را به اشتراک بگذارند", "summary_fa": "دو ستاره برتر جدول، نقاط مشترکی را در مورد شادی‌ها و خطرات اجرای زنده و آسیب‌پذیر بودن تا حد امکان از نظر انسانی پیدا می‌کنند، لکس وارن و مگان مورونی ممکن است در ژانرهای متفاوتی کار کنند، اما آنها آهنگ‌هایی را از یک مکان بسیار مشابه می‌نویسند: با شخصی بودن و تا جایی که می‌توانند با طرفداران صریح باشند. مورونی در ماشینی خارج از رستورانی در فرانکلین، تنسی با وارن که به شدت موافق است، می‌گوید: «فکر می‌کنم همیشه تیم آسیب‌پذیر هستم، حتی اگر عجیب باشد». او می افزاید: \"شما تعداد زیادی نوازنده مرموز دارید که می توانید آنها را بررسی کنید.\" اما فکر می‌کنم شبیه هر سفیدپوستی دیگر در یک Buc-ee هستم و فکر نمی‌کنم نیازی به بازی در آن نقش [اسرارآمیز] داشته باشم.» وارن و مورونی با تبدیل کردن اوج، پست‌ها و دل‌شکستگی‌های زندگی Gen Z به آهنگ‌های پربازدید، حرفه‌ای را به‌وجود آورده‌اند، با مورونی که یک برند کانتری و پاپ را تمرین می‌کند که او آن را دختر گاوچران ایمو می‌نامد، و وارن با ترکیب پاپ، راک و فولک به سرودهای سرودهای خودش. غم و اندوه از دست دادن والدین یا عموی خود، روابط اوایل دهه بیست، بدبختی های اجتماعی، شک و تردید به خود - هیچ چیز برای این هنرمندان ساکن نشویل که از صحبت کردن در مورد همه چیزهایی که به نظر می رسد مشترک هستند لذت می برند، دور از ذهن نیست. مورونی می‌گوید: «داستان‌های ما به نوعی دیوانه‌کننده است. \"ما شباهت های زیادی داریم.\" این درست است. هر دو هنرمند به لطف رسانه‌های اجتماعی و TikTok در مراحل اولیه پیشرفت شغلی پیدا کردند، تک‌آهنگ‌های عظیمی از اولین آلبوم‌های خود داشتند (تنسی نارنجی که پنج برابر پلاتین شده بود، «Ordinary» رکوردشکنی او) و در ژانرهای مختلف با یکدیگر همکاری کرده‌اند. هر دوی آن‌ها امسال آلبوم‌های موفقی منتشر کردند: ابر ۹ با رنگ صورتی و"}, {"source": "Rolling Stone", "title": "This Portable Drum Device Lets You Play Music Anywhere, Anytime (And Makes a Great Gift)", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/aeroband-pocketdrum-2-ultra-drumsticks-features-review-2026-1235645200/", "summary": "Here’s how the new Aeroband PocketDrum 2 Ultra lets you drum on-the-go and have more fun jamming", "date_str": "2026-10-20T12:01:00+00:00", "hash": "9f36588576b3cb86", "title_fa": "این دستگاه درام قابل حمل به شما امکان می دهد موسیقی را در هر مکان و هر زمان پخش کنید (و یک هدیه عالی می دهد)", "summary_fa": "در اینجا آمده است که چگونه Aeroband PocketDrum 2 Ultra جدید به شما امکان می دهد در حال حرکت درام بزنید و از پارازیت های سرگرم کننده بیشتری لذت ببرید اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Rolling Stone ممکن است کمیسیون وابسته دریافت کند. هر نوازنده ای احتمالا با انگشتان خود به هر سطحی ضربه می زند یا مداد را به پاهای خود می زند. اکنون راه بهتری برای پخش موسیقی در حین حرکت وجود دارد: PocketDrum 2 Ultra جدید Aeroband. این دستگاه شامل دو چوب حسگر حرکتی سبک وزن است که حرکات شما را به صدای مجازی تبدیل می‌کند و شما بازخورد لمسی دریافت می‌کنید تا هر ضربه را به یک ضرب متصل کنید. این دستگاه دارای پاسخ دینامیکی 127 سطحی است که به زبان انگلیسی ساده به این معنی است که می‌تواند همه چیز را از ضربه‌های کوچک و ملایم گرفته تا ضربه‌های مشتاقانه‌تر ثبت کند. یک ژیروسکوپ داخلی با نرخ نمونه برداری 8000 هرتز زاویه و شدت ضربه را در زمان واقعی ثبت می کند. وزن هر چوب فقط 58 گرم (تقریباً به وزن یک تخم مرغ) و عمر باتری آن تا 8 ساعت است. این بدان معناست که می‌توانید در هر مکانی، بدون فضای اختصاصی، در حین مسافرت یا خارج از منزل به پارازیت ادامه دهید. PocketDrum 2 Ultra همچنین شامل 12 کیت صدا و بیش از 100 شیار است که شامل آهنگ های راک، EDM، پاپ و حتی کاسه آواز می شود. کاربران می توانند صداهای جدید را کاوش کنند، دامنه خود را بهبود بخشند، یا هر طور که می خواهند باز شوند. حتی اگر تجربه موسیقی ندارید، PocketDrum 2 Ultra با ویژگی‌هایی مانند Auto Groove که به ایجاد حس زمان‌بندی و ضرب آهنگ کمک می‌کند، آسان است. اگر می‌خواهید"}, {"source": "Rolling Stone", "title": "Jon Stewart Criticizes JD Vance for Constantly Demonizing Immigrants", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/jon-stewart-jd-vance-immigrants-criticism-daily-show-1235645320/", "summary": "\"I'm sorry Vance, are you seriously suggesting that immigrants have brought a culture of revolution and protest to France?\" the host asked on The Daily Show", "date_str": "2026-10-20T06:34:11+00:00", "hash": "6b7e8565267cd17f", "title_fa": "جان استوارت از JD Vance به دلیل شیطان سازی دائمی مهاجران انتقاد می کند", "summary_fa": "\"متاسفم ونس، آیا شما جدی می گویید که مهاجران فرهنگ انقلاب و اعتراض را به فرانسه آورده اند؟\" مجری در برنامه The Daily Show پرسید: جان استوارت در آخرین قسمت از برنامه The Daily Show، جی دی ونس را مورد هدف قرار داد و از معاون رئیس جمهور به خاطر لفاظی های مداوم ضد مهاجرت او انتقاد کرد. استوارت نمایش دوشنبه شب را با کلیپی از ونس در حال پاسخگویی به سوالات اخیر در تالار شهر افتتاح کرد. در طول این رویداد، زنی از ونس پرسید، چرا به خاطر مسائلی که قرار است به عنوان معاون رئیس جمهور حل کنید، مهاجران را قربانی می کنید؟ پس از اینکه ونس پاسخ داد من از این سوال قدردانی می کنم، استوارت مداخله کرد که به هیچ وجه، نه در هیچ سیاره ای، نه در هیچ جدول زمانی، جی دی ونس از این سوال قدردانی نمی کند. استوارت اضافه کرد که او از این سوال متنفر است. باعث خارش ریش می شود. و این شاید اولین چیزی باشد که می گویید پاسخی که این زن جوان می خواهد دریافت کند، پاسخ واقعی نخواهد بود. ونس به زن گفت، تا آنجا که لفاظی من در اینجا ناقص بوده است، این به من مربوط است. استوارت نفس نفس زد. اوه، این شعار شماست؟ میزبان پرسید. پوپودی نرفکت است. گاهی اوقات شما به خشونت علیه جوامع آسیب پذیر دامن می زنید و سپس عذرخواهی می کنید. منظورم این است که همه ما Mein Bad را می خوانیم. وی افزود: «بنابراین لفاظی غیرانسانی علیه مهاجران، که همه ما فکر می‌کردیم سنگ بنای و استراتژی عمدی به قدرت رسیدن دونالد ترامپ و جی."}, {"source": "Rolling Stone", "title": "Cardi B’s Tiny Desk Performance Is a Masterclass in Excellence", "link": "https://www.rollingstone.com/music/music-news/cardi-b-tiny-desk-performance-video-1235645313/", "summary": "The rap superstar brought a full live band and delivered one of the most sensational Tiny Desk performances to date", "date_str": "2026-10-20T05:32:12+00:00", "hash": "d4421e17e51b9ea0", "title_fa": "عملکرد میز کوچک Cardi B یک کلاس فوق العاده عالی است", "summary_fa": "سوپراستار رپ یک گروه زنده کامل را آورد و یکی از پرحاشیه‌ترین اجراهای تینی دسک تا به امروز را اجرا کرد. به گفته این نشریه، توقف خواننده رپ برنده گرمی در دفتر موسیقی NPR، جمعیت زیادی را به خود جلب کرد. و کسانی که می‌توانند نمایش زنده کاردی را با گروهش تماشا کنند، که موسیقی مجلل راک و جاز از آهنگ‌های او ارائه کرد، می‌توانند خود را جزو معدود افراد خوش شانس بدانند. در ویدئویی که روز دوشنبه برای اولین بار پخش شد، کاردی مدیریت تینی دسک را بر عهده گرفت و یک استاد کلاس هشت آهنگ در کنترل نفس، شادی و نمایش را به ارمغان آورد. این خواننده رپ خواننده برانکس زمان را تلف نکرد و یک اجرای دراماتیک Hello را از دومین آلبوم استودیویی مورد انتظارش به نام آیا من درام هستم؟ او پیش از این که برای یک استراحت سریع مکث کند و به «مرد کلام تو» سر بزند، تک‌آهنگ آلبومش ErrTime را دنبال کرد (که باعث می‌شود او برای خداحافظی تلخ و شیرینی با همسر سابقش افست دست تکان دهد). جذابیت این اجرا با خوانندگان پس زمینه تیفانی استیونز و آبونی فرانکلین برجسته شد. کاردی سپس آهنگ‌هایی از اولین بازی پیشگامانه‌اش، Invasion of Privacy را اجرا کرد و آهنگ‌های مورد علاقه طرفداران Be Careful و Bodak Yellow را حذف کرد. در این بین، او به LP دوم خود با Up (خود یک درس بی امان در همخوانی) و انتشار انفرادی Ah Ha بازگشت. در اواخر ست کمتر از 19 دقیقه، کاردی شوخی‌های خاص خود را تزریق کرد - مشاهده نبود کیک خرچنگ مریلند در سوارکارش و اینکه چگونه انتخاب شلوار لاتکس او در گرمای تابستان عرق می‌کرد. در کنار کاردی، استیونز و فرانکلین، گروه او - متشکل از آدام بلک استون در باس و کلید، دی‌جی ری جی، کیبورد یوجین رابرتز، گیتاریست کلیتون سیرز، درامر سدریک"}, {"source": "Rolling Stone", "title": "Muna Safe After Tour Bus Catches Fire on California Highway", "link": "https://www.rollingstone.com/music/music-news/muna-tour-bus-catches-fire-safe-1235645213/", "summary": "Naomi McPherson asked for help finding \"the grandchild of the warlock whose curse is wreaking havoc on my life\"", "date_str": "2026-10-20T00:59:33+00:00", "hash": "1e8e960772f57abe", "title_fa": "ایمن مونا پس از آتش گرفتن اتوبوس تور در بزرگراه کالیفرنیا", "summary_fa": "نائومی مک فرسون برای یافتن \"نوه جنگجو که نفرین او زندگی من را ویران می کند\" درخواست کمک کرد. این صحنه توسط دوربین محلی KTLA ضبط شد که گزارش داد این حادثه باعث بسته شدن چندین خط در جاده شلوغ شده است. این ایستگاه گفت که راننده متوجه نشد که اتوبوس در حال سوختن است که گشت بزرگراه کالیفرنیا در ساعت 8:00 صبح تماس گرفت. درباره یک اتوبوس شعله ور در آزادراه 5 به سمت جنوب. پس از اینکه اتوبوس از یک فریم خارج شد، سازمان آتش نشانی بربنک توانست آتش را خاموش کند. مونا عکسی از پوشش KTLA در رسانه های اجتماعی خود به همراه یک عنوان به اشتراک گذاشت: گروه MUNA همانطور که در اخبار امروز صبح دیده می شود. گروه گفت که بسیاری از وسایل شخصی گم شده اند، اما خدا را شکر همه ما در امان هستیم. در بخش نظرات، نوازنده نائومی مک فرسون نوشت، اگر کسی می تواند به من کمک کند نوه جنگجو را پیدا کنم که نفرینش زندگی من را ویران می کند تا بتوانم آنها را به بالای کوه ببرم تا پیشگویی را برآورده کنم / نفرینی را که بر من وارد شده است خنثی کنم، بسیار قابل قدردانی است. داستان‌های پرطرفدار ماریا کری شکایت 20 میلیون دلاری هتک حرمت برادر را به خاطر خاطرات کامل شکست داد. جراحی پایین تایید کننده جنسیت در ماه سپتامبر، مونا اعلام کرد که مک فرسون، که گیتار می‌نوازد، سینتز و در گروه می‌خواند، برای مراقبت از مادرشان، هریت، که در مراحل پایانی نبرد با سرطان بود، باید چندین تاریخ تور را از دست بدهد. مونا همچنین در این پست به هریت ادای احترام کرد و او را \"یکی از بزرگترین، عاقل ترین و دوست داشتنی ترین افراد\" خواند."}, {"source": "Rolling Stone", "title": "Parke Is Trading Its Signature Neutrals for Halloween Colors: Where to Shop the New Drop", "link": "https://www.rollingstone.com/product-recommendations/style/parke-halloween-collection-oct-2026-viral-mockneck-online-1235644666/", "summary": "The only thing scarier than Halloween? Missing Parke's latest drop on Oct. 20, featuring new mocknecks, hoodies, and more", "date_str": "2026-10-20T00:31:42+00:00", "hash": "a98029244ef5ca75", "title_fa": "Parke در حال معامله رنگ‌های خنثی خود با رنگ‌های هالووین است: از کجا می‌توان قطره جدید را خرید", "summary_fa": "تنها چیزی که ترسناک تر از هالووین است؟ Missing Parke در تاریخ 20 اکتبر، با مدل‌های جدید، هودی‌ها، و موارد دیگر اگر محصول یا خدماتی را که به‌طور مستقل بررسی شده است را از طریق پیوندی در وب‌سایت ما خریداری کنید، Rolling Stone ممکن است کمیسیون وابسته دریافت کند. پارک راهی برای از دست دادن ذهن مردم به خاطر یک سویشرت دارد. و درست زمانی که فکر می‌کردید کمدتان به اندازه کافی کت و شلوار دارد، این برند با یک قطره دیگر بازگشته است، این بار با رنگ نارنجی و مشکی هالووین. مجموعه پارک هالووین سه‌شنبه، 20 اکتبر ساعت 10 صبح به وقت شرقی/7 صبح به وقت محلی در وب‌سایت رسمی Parke عرضه می‌شود، با قیمتی که بر اساس کاهش‌های قبلی انتظار می‌رود حدود 17 دلار و 140 دلار باشد. این مجموعه شامل تی‌شرت‌های جدید دانشگاهی، هودی‌ها، مانکن‌ها، و شلوارهای ورزشی باکسر، به‌علاوه گیره‌های پنجه‌ای است که همه در رنگ‌های الهام‌گرفته از تعطیلات هستند. یکی از Acid Wash Amber یا Acid Wash Black را انتخاب کنید. سایزهای XS تا XL هنوز در انبار هستند (اما نه برای مدت طولانی.) نرم، قابل تنفس و برای استفاده در تمام طول سال عالی است. اگر تعجب می کنید که چگونه یک سویشرت اینقدر به یک رویداد تبدیل شده است، تنها نیستید. Parke پیروان وفاداری خود را پیرامون گرافیک‌های الهام‌گرفته از کلاس‌های قدیمی، تناسب‌های بزرگ و مدل‌های ساختگی خود ایجاد کرده است که به نوعی باعث می‌شود لباس پوشیدن کمتر کار سختی به نظر برسد. و وسواس فراتر از TikTok است. طبق مصاحبه فوربس در سال 2025، پارک در سال 2024 بدون صرف یک سکه برای تبلیغات پولی، 16 میلیون دلار درآمد کسب کرد. چلسی کرامر (بنیانگذار و مدیر عامل) به این نشریه گفت که تبلیغات دهان به دهان قدرتمندترین ابزار ما بوده است، به ویژه در محوطه های دانشگاهی. برای دریافت تعمیر پارک"}, {"source": "Rolling Stone", "title": "Mariah Carey Beats Brother’s $20 Million Defamation Lawsuit Over Tell-All Memoir", "link": "https://www.rollingstone.com/music/music-news/mariah-carey-brother-defamation-lawsuit-memoir-1235645209/", "summary": "A judge struck down the long-running lawsuit Monday", "date_str": "2026-10-20T00:15:18+00:00", "hash": "776d8ecde6c31ba2", "title_fa": "ماریا کری شکایت 20 میلیون دلاری برادرش را برای افترا به خاطر خاطرات Tell-All شکست داد", "summary_fa": "ماریا کری در یک نبرد حقوقی پنج ساله با برادرش پیروز شد و با رد ادعاهای باقی مانده خود مبنی بر بدنام کردن او در کتاب خاطرات پرفروش سال 2020 خود \"معنای ماریا کری\" پیروز شد. در حکمی که روز دوشنبه صادر شد و توسط رولینگ استون به دست آمد، قاضی لزلی A. استروث از دادگاه عالی ایالت نیویورک دریافت که مورگان کری نتوانست ثابت کند که خواهر فوق‌ستاره‌اش هنگام بیان اظهاراتی که به چالش کشیده بود، با \"بدخواهی واقعی\" رفتار کرده است. مورگان در دادخواست خود مدعی شد که خواهرش با به تصویر کشیدن او به عنوان فردی خشن، متهم کردن او به قاچاق \"مواد غذایی پودر شده (اشاره به کوکائین)\" و توصیف او به عنوان داشتن \"مشکلات رفتاری\" در دوران کودکی به \"شهرت عالی و بی عیب\" او آسیب رسانده است. او ادعا کرد که ماریا به مادر مرحومشان به عنوان منبع برخی از مطالب اعتماد کرده بود و بیشتر نگران موفقیت تجاری خاطرات بود تا صحت ادعاهای او. او گفت که خسارات وی \"به گمان می رود بیش از 20 میلیون دلار باشد.\" اما قاضی متوجه شد که مورگان به سادگی با اشاره به وخامت رابطه خود با خواهر و برادر معروفش نمی تواند سوء نیت واقعی را اثبات کند. بر اساس قانون ضد SLAPP نیویورک، شاکی باید نشان دهد که یک متهم اظهارات نادرستی را با علم به نادرست بودن آن یا با بی توجهی بی پروا به حقیقت بیان کرده است. جاستیس استروث نوشت: «شاکی به اندازه کافی سوء نیت واقعی از جانب [ماریا] را مطرح نکرده است. شاکی از ارائه هیچ مدرکی مبنی بر اینکه [ماریا] چنین اظهاراتی را با آگاهی از نادرستی آنها یا با بی اعتنایی بی پروا به نادرستی آنها یا با بی توجهی بی پروا به حقیقت بیان کرده است، ارائه نمی دهد. در حالی که شاکی مدعی است که"}, {"source": "Hollywood Reporter", "title": "Parke’s Cult-Favorite Sweatshirt Gets Acid Washed for Halloween", "link": "https://www.hollywoodreporter.com/lifestyle/shopping/parke-halloween-2026-release-acid-wash-mockneck-sweatshirt-1236736114/", "summary": "The internet asked, Parke listened: The brand brings back its sold-out washes from Halloween 2025.", "date_str": "2026-10-20T14:08:16+00:00", "hash": "e41cd961ce298b16", "title_fa": "سویشرت محبوب فرقه پارک برای هالووین اسید شسته می شود", "summary_fa": "اینترنت پرسید، پارک گوش داد: این برند شستشوهای فروخته شده خود را از هالووین 2025 بازمی گرداند. اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، هالیوود ریپورتر ممکن است کمیسیون وابسته دریافت کند. رسمی است: Parke رنگ های اسید شویی محبوب خود را برای هالووین 2026 دوباره راه اندازی کرده است. در روز سه شنبه، اکتبر در دسترس است. 20، خط تولید محدود شامل Acid Wash Amber و Acid Wash Black در مجموعه‌ای از پرفروش‌ترین سایه‌های این برند است: هودی Varsity، شلوار ورزشی باکسر، تی شرت ورزشی، هماهنگ کننده Claw Clip و البته، Varsity Mockneck همیشه فروخته شده. یکی از کاربران اینستاگرام می نویسد: از شما برای ذخیره مجدد آنها در سال جاری سپاسگزارم زیرا این فروشندگان که بیش از 500 دلار دریافت می کنند قلب من را می شکنند. داستان‌های مرتبط Lifestyle حلقه هوشمند جدید RingConn نسل 3 اولین نمایش جوایز را در سوئیت هدیه‌ای Emmys نشان می‌دهد. دیگر کمپین‌های اخیر شامل مشارکت Parke's Pink Aid با ماه آگاهی از سرطان سینه، مجموعه پاییز 26 آن و مجموعه دانشگاهی پارکه، اولین عرضه پوشاک دارای مجوز این برند است که با مشارکت برند سبک زندگی ورزشی 47 ایجاد شده است. از زمان راه اندازی در سال 2022، خط تولید پوشاک چلسی پارک که مستقیماً به مصرف کننده عرضه می شود، رسانه های اجتماعی را تحت تأثیر قرار داده است. چیزی که به‌عنوان لباس‌های جین بازسازی‌شده شروع شد، به‌سرعت به لباس‌های راحتی با عرضه محدود تبدیل شد، که مهم‌ترین آن‌ها، ماک یقه‌ی امضای Parke بود که در عرض چند دقیقه پس از فروش آنلاین به فروش می‌رسید. تا آوریل 2026، این برند مد ویروسی راه خود را به فروشگاه های Target در سراسر کشور باز کرد."}, {"source": "Hollywood Reporter", "title": "Instagram Lines Up Donatella Versace, A$AP Rocky, Finneas, Chloé Zhao as This Year’s Creator Awards Judges (Exclusive)", "link": "https://www.hollywoodreporter.com/business/digital/instagram-rings-2026-returns-judges-versace-zhao-asap-rocky-1236735554/", "summary": "The Instagram awards program, Rings, returns for a second year, with new judges and both digital and physical gifts for honorees.", "date_str": "2026-10-20T14:00:08+00:00", "hash": "6b70e49996d774f5", "title_fa": "اینستاگرام Donatella Versace، A$AP Rocky، Finneas، Chloé Zhao را به عنوان داوران جایزه سازندگان امسال (اختصاصی) انتخاب کرد", "summary_fa": "برنامه جوایز اینستاگرام، حلقه ها، برای دومین سال با داوران جدید و هدایای دیجیتال و فیزیکی برای برگزیدگان بازمی گردد. اینستاگرام برنامه جوایز سازندگان داخلی خود را برای دومین سال بازمی گرداند: حلقه های اینستاگرام. حلقه‌ها یک بار دیگر شاهد یک پانل ستاره‌ای از داوران خواهند بود که سازندگان برنده را از سراسر پلتفرم نامزد و انتخاب می‌کنند که شامل انواع ژانرها و محتوا می‌شود، با برندگان یک حلقه طلای فیزیکی طراحی شده توسط Emily Adams Bode Aujla (که همچنین یک داور است) و همچنین ابزارهای خلاق دیجیتال ویژه‌ای که می‌توانند برای تشخیص پروفایل اینستاگرام خود استفاده کنند. هالیوود ریپورتر دریافته است که هیئت داوران Rings 2026 شامل نماد مد Donatella Versace، A$AP Rocky، طراح Emily Adams Bode Aujla، Finneas، کارگردان Chloé Zhao، اسکی باز حرفه ای Mikaela Shiffrin، هنرمندان OSGEMEOS، رئیس اینستاگرام Adam Mosseri، رقصنده مد اینستاگرام، رقصنده و شرکای مد اینستاگرام Lachore. چن، ویل ولش سردبیر سابق GQ، ایسامایا فرنچ آرتیست آرایشگر، ویکاس خانا سرآشپز و جک ادواردز خالق. چن به THR می‌گوید: ما واقعاً می‌خواستیم این ترکیب جهانی از افرادی را داشته باشیم که فرهنگ را در زمینه‌های مربوطه و فراتر از آن پیش می‌برند. ما فکر می کنیم افرادی هستند که در دنیا و همچنین در اینستاگرام کارهای جالبی انجام می دهند و مسیر خود را ترسیم کرده اند. چن می‌گوید که داوران هم نامزدها و هم برندگان را انتخاب می‌کنند، چن می‌گوید من عاشق تماشای مکالماتی هستم که مانند بازیگران روی بازیگران، نمادها روی نمادها است، و این همان رویکردی است که ما در پیش گرفتیم. [برندگان] هنرمندانی هستند که در راه تبدیل شدن به نماد در رشته‌های خود هستند، که توسط نمادهای مشابه انتخاب می‌شوند، و بنابراین توسط الگوریتمی انتخاب نمی‌شود، بلکه توسط افرادی در این حوزه انتخاب می‌شود و کسانی که در خارج از جهان هستند که در حال کشف و الهام گرفتن"}, {"source": "Hollywood Reporter", "title": "‘Yaga’ Review: Carrie-Anne Moss and Hudson Williams in AMC+’s Intriguing but Undercooked Brew of Modern Crime and Ancient Folklore", "link": "https://www.hollywoodreporter.com/tv/tv-reviews/yaga-review-carrie-anne-moss-hudson-williams-amc-plus-1236729018/", "summary": "Clark Backo and Noah Reid also star in Kat Sandler's adaptation of her own play, a reimagining of the Baba Yaga myth centered around the search for a missing college student.", "date_str": "2026-10-20T14:00:00+00:00", "hash": "f88fff0f2f5a2484", "title_fa": "نقد «یاگا»: کری آن ماس و هادسون ویلیامز در فیلم جذاب اما پخته نشده جنایت مدرن و فولکلور باستانی AMC+", "summary_fa": "کلارک باکو و نوآ رید همچنین در اقتباس کت سندلر از نمایشنامه خود بازی می‌کنند، که بازآفرینی اسطوره بابا یاگا حول محور جستجوی یک دانشجوی گم‌شده است. شاید درست باشد که Yaga، هیجان انگیز ژانر جدید از AMC+ و Crave، به طرز اهریمنی به سختی شناسایی شود. از این گذشته، تنها کاری است که اسطوره‌ها همیشه انجام می‌دادند، که تغییر شکل می‌دهد - برای انعکاس یک زمینه جدید، معرفی دیدگاهی تازه، ارائه اخلاقی به روز. و در حالی که مدتی طول می کشد تا ببینیم این نسخه از داستان بابا یاگا (همانطور که در فولکلور اسلاوی، نه، همانطور که توسط چند شخصیت مختلف، فیلم جان ویک توضیح داده شده است) ممکن است چه شکلی به خود بگیرد، در ابتدا به اندازه کافی آسان است که تحت طلسم آن قرار بگیریم. فضا بسیار سرد است، بازیگران پر از بازیگرانی هستند که شما در کارهای دیگر دوستشان داشتید. اما هر چه طولانی‌تر اجرا شود، جذابیت‌های آن نازک‌تر می‌شود - نمایشی را پشت سر می‌گذارد که به اندازه کافی لذت‌بخش است، اما آنقدر تیز نیست که بتوان از آن لذت برد. داستان‌های مرتبط بازیگران تلویزیونی یاگا کنایه می‌زنند برخورد به موقع در مورد خشم زن، دابل هادسون ویلیامز و بسیاری از چیزهای مرغی تلویزیون AMC در Mayfair Witches: Salem Coven اولین بار در دسامبر به عنوان کاترین زتا  استفاده از هوش مصنوعی ساخته شده‌اند. و به دنبال آن است که کارگران ایالات متحده در صنعت میکرودرام اخیراً در مورد راه هایی صحبت می کنند که این فناوری کسب و کار را تغییر داده است. در ماه سپتامبر، کارگران این صنعت به THR گفتند که فرصت‌های شغلی کمتری را مشاهده می‌کنند و همچنین استفاده نادرست از این فناوری را در کار خود مشاهده می‌کنند. رواج هوش مصنوعی در فیلم‌های کوچک در عناوینی که شرکت Owl در سه ماهه اخیر در برنامه‌هایی که بینندگان را ملزم به پرداخت هزینه داستان‌هایشان می‌کنند، پیدا کرده است. تنها یک عنوان لایو اکشن – My X-Ray Vision از ReelShort’s Right Through You Sees Right Through You – فهرست"}, {"source": "Hollywood Reporter", "title": "‘The Hunting Wives’ Are Playing With Fire in Spicy Season 2 Trailer", "link": "https://www.hollywoodreporter.com/tv/tv-news/the-hunting-wives-season-2-trailer-margot-sophie-1236735968/", "summary": "Brittany Snow and Malin Åkerman tease their onscreen romance in the first look at the Netflix show's Thanksgiving Day return.", "date_str": "2026-10-20T14:00:00+00:00", "hash": "07f1730a1a6e41c2", "title_fa": "«همسران شکار» در تریلر فصل دوم Spicy در حال بازی با آتش هستند", "summary_fa": "بریتنی اسنو و مالین اکرمن در اولین نگاه به بازگشت روز شکرگزاری سریال نتفلیکس، عاشقانه روی پرده خود را به زبان می آورند. متن لوگو زنان خانه دار تگزاس بازگشته اند و فصل شکار است. تریلر کامل فصل دوم The Hunting Wives منتشر شد، و اولین نگاه به سریال بریتنی اسنو و مالین اکرمن با بازی نتفلیکس نشان می‌دهد که فصل دوم با انتشار هر هشت قسمت در نتفلیکس در 26 نوامبر، اسلحه‌های بزرگ را به نمایش می‌گذارد. همانطور که توسط بازیگران و خالق ربکا کاتر وعده داده شده است، تریلر (زیر) رابطه جنسی بیشتر، خونریزی بیشتر، رازهای تهدید کننده بیشتر را نشان می دهد، و حتی ورود به یک نمایش واقعی، a la The Real Housewive s، برای این گروه محافظه کار از زنان تگزاس شرقی که با انتشار فصل اول در سال گذشته به یک هیجان جذاب تابستانی تبدیل شدند. همچنین یک آشتی تند برای سوفی و ​​مارگو را اذیت می کند. داستان های مرتبط تلویزیون نتفلیکس دو فصل از A24 s Apology با بازی گوئینت پالترو را در برنامه اجرا می کند، میندی کالینگ، یکی از خالقان آن، نقش روی پرده در فصل 3 را ایفا می کند. با بازگشت فصل دوم، ارادۀ آن‌ها در رابطه با عاشقانه‌شان مورد آزمایش قرار می‌گیرد – در اینجا لاگین رسمی است: در شروع فصل دوم، سوفی و ​​مارگو در حال خروج هستند. اما به زودی، اسرار قدیمی و دشمنان جدید آنها را مجبور می کنند که دوباره کنار هم قرار گیرند. همانطور که آنها بازی های خطرناک خود را انجام می دهند، این سوال پیش می آید. آیا آنها شکارچی هستند یا شکار شده؟ در همین حال، این سریال قبلاً قبل از بازگشت روز شکرگزاری، فصل سوم را تمدید کرده است. درموت مولرونی، جیمی ری نیومن، ایوان جونیگ کیت، جورج فریر، کارن رودریگز و هانتر امری دیگر بازیگران این فیلم"}, {"source": "Hollywood Reporter", "title": "Hannah Berner and Paige DeSorbo’s ‘Giggly Squad’ to Play Madison Square Garden (Exclusive)", "link": "https://www.hollywoodreporter.com/business/digital/hannah-berner-and-paige-desorbos-giggly-squad-to-play-madison-square-garden-exclusive-1236736103/", "summary": "This will be the first female hosted podcast to perform at MSG.", "date_str": "2026-10-20T14:00:00+00:00", "hash": "547b8ac2fa566c37", "title_fa": "«جوخه جیگلی» هانا برنر و پیج دسوربو برای بازی در مدیسون اسکوئر گاردن (انحصاری)", "summary_fa": "این اولین پادکست زن میزبانی خواهد بود که در MSG اجرا می کند. جوخه گیگلی هانا برنر و پیج دسوربو به مدیسون اسکوئر گاردن می آیند. این پادکست محبوب در 18 فوریه 2027 به عنوان بخشی از یک تور گسترده تر در ایالات متحده و اروپا برای ضبط زنده نمایش در باغ متوقف می شود. این اولین پادکست زن میزبانی خواهد بود که در مدیسون اسکوئر گاردن اجرا می کند. برنر و دسوربو این برنامه را در سال 2020 در اینستاگرام لایو راه اندازی کردند، زیرا این دو در برنامه واقعیت نمایشی Summer House براوو به شهرت رسیدند. از آن زمان به یک پادکست کمدی برتر تبدیل شده است. این برنامه که دو بار در هفته پخش می شود، دو دوست را در مورد زندگی، قرار ملاقات، فرهنگ پاپ، مد و موارد دیگر گفتگو می کنند. این پادکست قبلاً تورهای زنده را در 70 شهر برگزار کرده است، از جمله دو برنامه در رادیو سیتی موزیک هال، و جرقه کتاب پرفروش نیویورک تایمز، How to Giggle . Giggly ی مبتنی بر هوش مصنوعی، قراردادی برای صدور مجوز محتوا با شرکت موسیقی مستقل Believe مستقر در فرانسه منعقد کرده است، توافقی که بخش توزیع دیجیتال Believe را نیز تحت پوشش TuneCore قرار می دهد. Believe در بیانیه‌ای گفت: این معامله جدیدترین قرارداد در قراردادهای پایدار Spotify با شرکت‌های موسیقی برای این ابزار است، پس از توافق‌هایی با Universal Music Group، Merlin و [] Believe و Spotify یک سال در مورد شراکت بحث می‌کردند، و مشارکت هنرمندان آن داوطلبانه است. هنرمندان ابتدا می توانند انتخاب کنند که آیا در یک سرویس هوش مصنوعی شرکت کنند یا خیر و سپس، پس از آن، تصمیم بگیرند که آیا به Spotify اجازه استفاده از کار آنها برای این ابزار را بدهند یا خیر. دنیس لادگیلری، مدیرعامل و بنیان‌گذار Believe در بیانیه‌ای گفت: «با هم، یک فعالیت بازمیکس طرفداران را به تجربه‌ای با مجوز تبدیل می‌کنیم که ایجاد ریمیکس طرفداران را در پلتفرم کنترل‌شده Spotify افزایش می‌دهد و برای هنرمندان درآمد ایجاد می‌کند. اینگونه است که چهار اصل ما رضایت، کنترل، جبران خسارت و شفافیت به مزایای ملموس برای هنرمندان تبدیل می شود. به همان اندازه مهم، ما تعهدی برای محافظت از هنرمندان داریم که در حفاظت‌های تقویت‌شده Spotify در برابر هرزنامه‌ها و محتوای کم‌ارزش تولید شده توسط هوش مصنوعی منعکس شده است، و کار مداوم Believe برای تقویت بیشتر چارچوب محتوای موسیقی GenAI خود را نشان می‌دهد. این تلاش‌ها نشان می‌دهد که چگونه با هم کار می‌کنیم تا شیب هوش مصنوعی را ریشه کن کنیم و هوش مصنوعی را به یک ارزش‌آفرین برای طرفداران موسیقی، هنرمندان و صاحبان حق تبدیل کنیم.» چارلی هلمن، معاون ارشد اسپاتیفای و رئیس موسیقی جهانی، ادعا کرد که ابزار ریمیکس می‌تواند «ارتباط بین طرفداران و هنرمندانی را که دوستشان دارند عمیق‌تر کند» و «ارزش جدیدی برای هنرمندان ایجاد کند و توجه را"}, {"source": "Variety", "title": "Palestinian Filmmaker Rakan Mayasi on His Search for Unconventional Stories and Portraying ‘Communities That Have Not Been on Film Before’", "link": "https://variety.com/2026/film/global/rakan-mayasi-yesterday-the-eye-didnt-sleep-1236917359/", "summary": "Iconoclastic Palestinian filmmaker Rakan Mayasi’s debut feature “Yesterday the Eye Didn     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
