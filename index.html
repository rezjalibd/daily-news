rce": "IranWire", "title": "بریتانیا دو شهروند ایرانی را به اتهام فعالیت‌های خصمانه تحریم کرد", "link": "https://iranwire.com/fa/news-1/158797-%D8%A8%D8%B1%DB%8C%D8%AA%D8%A7%D9%86%DB%8C%D8%A7-%D8%AF%D9%88-%D8%B4%D9%87%D8%B1%D9%88%D9%86%D8%AF-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86%DB%8C-%D8%B1%D8%A7-%D8%A8%D9%87-%D8%A7%D8%AA%D9%87%D8%A7%D9%85-%D9%81%D8%B9%D8%A7%D9%84%DB%8C%D8%AA%D9%87%D8%A7%DB%8C-%D8%AE%D8%B5%D9%85%D8%A7%D9%86%D9%87-%D8%AA%D8%AD%D8%B1%DB%8C%D9%85-%DA%A9%D8%B1%D8%AF/", "summary": "دولت بریتانیا، روز دوشنبه ۲۰ مهر ۱۴۰۵، اعلام کرد دو شهروند ایرانی را به اتهام تسهیل یا مشارکت در فعالیت‌های خصمانه به نمایندگی از جمهوری ...", "date_str": "2026-10-12T15:13:14+00:00", "hash": "4b678a1170b9980c", "title_fa": "بریتانیا دو شهروند ایرانی را به اتهام فعالیت‌های خصمانه تحریم کرد", "summary_fa": "دولت بریتانیا، روز دوشنبه ۲۰ مهر ۱۴۰۵، اعلام کرد دو شهروند ایرانی را به اتهام تسهیل یا مشارکت در فعالیت‌های خصمانه به نمایندگی از جمهوری ... بر اساس اعلام دولت بریتانیا، دو فرد تحریم‌شده، از روح‌الله بازقندی و شهرام علی‌رضا تمرزاده نام دارند. بازقندی به برنامه‌ریزی یا انجام جاسوسی برای جمهوری اسلامی و همچنین تهدید، برنامه‌ریزی یا انجام حملات علیه افراد و دارایی‌ها در بریتانیا ی کشورهای دیگر به‌جز ایران متهم شده است. تمرزاده جکی نیز به اتهام حمایت یا کمک به فعالیت‌های مرتبط با تهدید، برنامه‌ریزی یا انجام حملات علیه افراد در کشورهای دیگر به‌جز ایران تحریم شده است. تمرزاده همچنین به تسهیل فعالیت‌های شبکه مجرمانه زیندشتی و مشارکت در چندین طرح علیه مخالفان جمهوری اسلامی متهم شده است. این دو نفر با مسدودسازی دارایی‌ها و ممنوعیت ورود به بریتانیا روبه‌رو شده‌اند. میلیبند، وزیر خارجه بریتانیا، روز دوشنبه ۲۰ مهر گفت که در واکنش تلاش‌های مستمر جمهوری اسلامی برای تهدید امنیت بریتانیا و متحدان بین‌المللی این کشور از طریق شبکه‌های مجرمانه، گروه‌های نیابتی و فعالیت‌های مخرب تحت حمایت حکومت، دستور احضار سفیر جمهوری اسلامی در لندن را نیز صادر کرده است. در این احضار به سفیر ایران هشدار داده شده که بریتانیا تهدید، ارعاب یا فعالیت‌های خصمانه جمهوری اسلامی را تحمل نخواهد کرد. وزارت خارجه بریتانیا همچن 2:01:45+00:00", "hash": "6515909e213a3755", "title_fa": "ترامپ: در کشتن رهبران ایران شاید زیاده‌روی کرده باشیم", "summary_fa": "دونالد ترامپ در اظهاراتی در یک گردهمایی انتخاباتی از «زیاده‌روی» در هدف قرار دادن سران حکومت جمهوری اسلامی ایران در جریان جنگ چهل روزه سخن گفته است. رئیس‌جمهور آمریکا شب گذشته در جمع هواردان خود در یک گردهمایی انتخاباتی در اوهایو گفت: «شاید درباره رهبران ایران زیاده‌روی کرده باشیم چون دیگر نمی‌دانیم با چه کسانی سر و کار داریم.» انتخابات میان‌دوره‌ای آمریکا در هفته اول نوامبر برگزار می‌شود. اشاره آقای ترامپ به رهبر و مقام‌های ارشد پیشین در جمهوری اسلامی است که در جنگ اسرائیل و آمریکا علیه ایران، کشته شدند. علی خامنه‌ای، رهبر وقت جمهوری اسلامی همراه با شماری از فرماندهان ارشد نظامی مانند رئیس ستاد کل نیروهای مسلح و وزیر دفاع و مقام‌های بلندپایه سیاسی از جمله دبیر وقت شورای دفاع در روز اول جنگ در نهم اسفند سال گذشته خورشیدی کشته شدند. به باور آقای ترامپ کشته شدن شماری از رهبران ارشد جمهوری اسلامی، تلاش برای مشخص کردن افرادی که آمریکا باید با آنها مذاکره کند را پیچیده کرده است. او پیش از این گفته بود که حملات آمریکا و اسرائیل منجر به «تغییر رژیم» در ایران شده و چند بار تکرار کرده بود که ایالات متحده «با رهبران جدید ایران» در تماس است. جی‌دی ونس، معاون رئیس‌جمهور آمریکا، ساعاتی پیش از این در اظهارات مشابهی به خبرگزاری رویترز گفته بود ایالات متحده همچنان در مورد نحوه اتخاذ تصمیمات در سطوح رهبری ایران اطمینان ندارد و به گفته او سازوکار تصمیم گیری در ایران برای آمریکا مشخص نیست. ابراز ابهام درباره نحوه اداره حکومت در ایران در روزهای اخیر از سوی رهبران ایالات متحده بیشتر شده است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. اسماعیل بقایی، سخنگوی وزارت خارجه ایران، هفته گذشته در واکنش به گفته‌های مشابهی از سوی آقای ترامپ گفته بود «ایالات"}, {"source": "BBC Persian", "title": "طالبان پخش برنامه‌های بی‌بی‌سی از رادیوهای اف‌ام در افغانستان را تعلیق کرد", "link": "https://www.bbc.com/persian/articles/cx5yng5dn4y6o?at_medium=RSS&at_campaign=rss", "summary": "بی‌بی‌سی همچنان ا یم، هیچ‌ کس به ما کمک نکرد. وقتی یک میلیون پناهجو داشتیم، هیچ‌ کس دست یاری به سوی ما دراز نکرد. هرچه به دست آوردیم، با پول خریدیم. همه تسلیحات را نیز با پول و به قیمت‌های جهانی خریدیم، تا آخرین فشنگ.» علی‌اف این سخنان را ۲ اکتبر ۲۰۲۶ در دیدار با اعضای حزب حاکم «آذربایجان نوین» بیان کرد. او هنگام صحبت درباره بی‌نیازی جمهوری آذربایجان از کمک یا حمایت خارجی، مستقیما نامی از ترکیه نبرد، اما این سخنان باعث شد بسیاری در جمهوری آذربایجان و ترکیه این پرسش را مطرح کنند که آیا منظور او ترکیه بوده است. راسیم موسابکوف، نماینده مجلس جمهوری آذربایجان، به بی‌بی‌سی گفت: «در جریان جنگ واقعا هیچ‌ کس به ما کمک نکرد، اما جمهوری آذربایجان و ترکیه روابطی متحدانه دارند و هیچ اختلافی میان دو"}, {"source": "BBC Persian", "title": "از موز تا بنزین؛ جنگ ایران چگونه به زندگی آمریکایی‌ها رسیده است؟", "link": "https://www.bbc.com/persian/articles/cry4xvlg8jz2o?at_medium=RSS&at_campaign=rss", "summary": "رسانه‌های آمریکایی در این روزها بارها از اثرات جنگ با ایران بر اقتصاد کشور نوشته و گفته‌اند. هزینه‌هایی که فعلا به نظر نمی‌رسد قرار باشد پایین بیایند. وضع معیشت آمریکایی‌ها در این روزهای باقی مانده تا انتخابات میان‌دوره‌ای نظر بسیاری را به خود جلب کرده است. از جمله رییس جمهوری آمریکا که در سخنرانی‌های اخیر خود بارها سعی کرده نشان دهد که وضعیت اقتصادی آنقدرها هم که گفته می‌شود بد نیست. اما گزارش‌های رسانه‌ای چیز دیگری می‌گویند.", "date_str": "2026-10-13T07:33:08+00:00", "hash": "ac2ee2c04579a750", "title_fa": "از موز تا بنزین؛ جنگ ایران چگونه به زندگی آمریکایی‌ها رسیده است؟", "summary_fa": "رسانه‌های آمریکایی در این روزها بارها از اثرات جنگ با ایران بر اقتصاد کشور نوشته و گفته‌اند. هزینه‌هایی که فعلا به نظر نمی‌رسد قرار باشد پایین بیایند. وضع معیشت آمریکایی‌ها در این روزهای باقی مانده تا انتخابات میان‌دوره‌ای نظر بسیاری را به خود جلب کرده است. از جمله رییس جمهوری آمریکا که در سخنرانی‌های اخیر خود بارها سعی کرده نشان دهد که وضعیت اقتصادی آنقدرها هم که گفته می‌شود بد نیست. اما گزارش‌های رسانه‌ای چیز دیگری می‌گویند. بالا رفتن بهای نفت و فراورده‌های نفتی در بازارهای جهانی اثرات دیگری هم بر اقتصاد آمریکا گذاشته است. نیویورک تایمز در گزارشی به سراغ محبوب‌ترین میوه آمریکایی‌ها رفته است: موز. موز در بازار آمریکا کالایی کم‌سود به شمار می‌رود و، آن‌گونه که این گزارش می‌گوید، فروش آن منفعت چندانی برای فروشگاه‌ها ندارد. موز در بسیاری از خواربارفروشی‌های آمریکا بیشتر نقشی برای جذب مشتری دارد و سود اصلی از کالاهای دیگری به دست می‌آید که خریداران همراه آن خریداری می‌کنند. یکی از مقام‌های «انجمن موز آمریکای شمالی» به گزارشگر گفته است حاشیه سود موز آن‌قدر اندک است که امکان جبران افزایش هزینه‌ها را فراهم نمی‌کند. بالا رفتن قیمت سوخت در جهان بر هزینه‌های واردات موز به آمریکا اثر گذاشته و البته حمل و نقل این میوه از بنادر به شهرهای مختلف هم افزایش یافته است. بهای کود شیمیایی هم به دلیل جنگ افزایش یافته است. آنا سوانسن، در گزارشی نوشته است مشکل موز این است که از مسیرهای طولانی به آمریکا می‌رسد و در تمام مسیر باید در یخچال نگه‌داری شود و همین موجب شده هزینه‌های وارداتش برای فروشنده آمریکایی افزایش یابد. تعرفه‌هایی که دونالد ترامپ بر واردات کالا به آمریکا وضع کرده و ممنوعیت کار رانندگان تریلی که وضعیت اقامتی آنها درست نیست هم از دلایل دیگری بودند که بر بالا رفتن بهای محصولات خوراکی مانند موز اثر گذاشته است."}, {"source": "BBC Persian", "title": "سریع‌تر از فرمول یک؛ ورزش پرهیجانی که زنان در آن فرمانروایی می‌کنند", "link": "https://www.bbc.com/persian/articles/cmgqw9v37ky4o?at_medium=RSS&at_campaign=rss", "summary": "مسابقات درگ تاپ فیول تنها رده برتر ورزش‌های موتوری است که زنان در آن بارها مردان را برای تصاحب عنوان‌های بزرگ شکست می‌دهند.", "date_str": "2026-10-13T03:34:55+00:00", "hash": "56fca4a33cf9ce01", "title_fa": "سریع‌تر از فرمول یک؛ ورزش پرهیجانی که زنان در آن فرمانروایی می‌کنند", "summary_fa": "مسابقات درگ تاپ فیول تنها رده برتر ورزش‌های موتوری است که زنان در آن بارها مردان را برای تصاحب عنوان‌های بزرگ شکست می‌دهند. «فراتر از ورزش» بخشی از مطالب ورزشی بی‌بی‌سی است که داستان‌های شگفت‌انگیز ورزشکاران یا رویدادهایی را روایت می‌کند که کمتر شنیده‌اید. فهرست مطلب‌های فراتر از ورزش را دنبال کنید. سوزان کالین، راننده‌ای که در این رشته ورزشی پرخطر رقابت می‌کند، در مورد نزدیک‌ترین توصیفی که در مورد این رشته به ذهنش می‌رسد، می‌گوید: «انگار آدم را مثل گلوله توپ شلیک کنند.» او دو بار قهرمان اروپا در مسابقات «درگ‌ تاپ‌فیول» شده است؛ رشته‌ای که اغلب از آن به‌عنوان سریع‌ترین ورزش روی زمین یاد می‌شود. مسابقه‌ها با غرش لرزه‌آور ماشین‌ها آغاز می‌شوند؛ در حالی که سریع‌ترین خودروهای شتاب‌گیرنده جهان از خط شروع حرکت می‌کنند و شعله‌های آتش از لوله‌های اگزوز آن‌ها بیرون می‌زند. این خودروها در مسابقه‌هایی که فقط چهار ثانیه طول می‌کشند، به سرعتی بیش از ۴۸۳ کیلومتر در ساعت می‌رسند. نیروی گرانشی که رانندگان در این مدت تحمل می‌کنند، از نیرویی که فضانوردان هنگام پرتاب به فضا تجربه می‌کنند، بیشتر است. این تنها رده سطح بالای ورزش‌های موتوری است که در آن زنان به‌طور مرتب مردان را شکست می‌دهند و عنوان‌های مهم را به‌دست می‌آورند. زنان در هفت دوره از ۹ دوره اخیر مسابقات قهرمانی اروپا قهرمان شده‌اند. همچنین تا همین اواخر، بریتنی فورس، راننده آمریکایی، رکورد جهانی سرعت این رشته را در اختیار داشت. در مقایسه، ۵۰ سال از زمانی که یک زن حتی در یک گراندپری فرمول یک شرکت کرده، می‌گذرد. بر اساس اعلام گروه «بیش از برابری» (More Than Equal)، زنان حدود ۱۰ درصد از شرکت‌کنندگان در رشته‌های ورزشی موتوری و تنها چهار درصد از رانندگان سطح بالای این رشته‌ها را تشکیل می‌دهند. با این حال، در رقابت‌های این فصل تاپ‌فیول آمریکا و اروپا، سهم زنان از رانندگان شرکت‌کننده به ۲۰ درصد رسید."}, {"source": "BBC Persian", "title": "چرا زنان بیشتر از مردان به میگرن مبتلا می‌شوند و چه باید کرد؟", "link": "https://www.bbc.com/persian/articles/c615870eeygqo?at_medium=RSS&at_campaign=rss", "summary": "خوابیدن در اتاقی تاریک، در حالی که دردی بی‌امان پیشانی را می‌کوبد، برای بسیاری از مبتلایان به میگرن تجربه‌ای آشناست؛ بیماری‌ ناتوان‌کننده که می‌تواند بر کار، روابط و سلامت روان افراد تأثیر قابل‌توجهی بگذارد.", "date_str": "2026-10-12T23:03:20+00:00", "hash": "9d31b148835cac7f", "title_fa": "چرا زنان بیشتر از مردان به میگرن مبتلا می‌شوند و چه باید کرد؟", "summary_fa": "خوابیدن در اتاقی تاریک، در حالی که دردی بی‌امان پیشانی را می‌کوبد، برای بسیاری از مبتلایان به میگرن تجربه‌ای آشناست؛ بیماری‌ ناتوان‌کننده که می‌تواند بر کار، روابط و سلامت روان افراد تأثیر قابل‌توجهی بگذارد. میگرن به‌ویژه در زنان شایع‌تر است و احتمال بروز حملات میگرنی در زنان حدود سه برابر مردان است. اما چه چیزی باعث بروز میگرن می‌شود و برای کنترل آن چه می‌توان کرد؟ به گفته مؤسسه خیریه «میگرن تراست» در بریتانیا، میگرن حدود یک نفر از هر هفت نفر در جهان، یعنی بیش از یک میلیارد نفر را تحت تأثیر قرار می‌دهد. میگرن یک بیماری عصبی با زمینه ژنتیکی است که باعث می‌شود مغز نسبت به تغییرات حساس‌تر باشد. دکتر کِیتی مونرو، متخصص میگرن در مرکز ملی میگرن بریتانیا، می‌گوید برخی از افرادی که ژن‌های مرتبط با میگرن را دارند ممکن است هرگز با فعال شدن آن‌ها روبه‌رو نشوند و «بدون مشکل خاصی به زندگی ادامه دهند». اما در برخی دیگر، عوامل مختلف بیرونی می‌توانند مسیرهای مشخصی را در مغز فعال کنند. این فرایند باعث آزاد شدن مواد شیمیایی عصبی می‌شود که علائم میگرن را ایجاد می‌کنند. این علائم می‌تواند شامل سردرد، استفراغ، سرگیجه و مه‌آلودگی ذهنی باشد. دکتر مونرو که مجری پادکستی با عنوان هدزآپ درباره میگرن است، می‌گوید: «ممکن است فرد در یک حمله مجموعه‌ای از علائم داشته باشد و بار دیگر علائم کمی متفاوت باشند. علائم حتی میان اعضای یک خانواده هم می‌تواند متفاوت باشد و در طول زندگی نیز تغییر کند.» بعید است تنها یک عامل باعث شروع حمله میگرن شود. معمولاً مجموعه‌ای از عوامل کوچک روی هم انباشته می‌شوند تا در نهایت از آستانه تحمل فرد عبور کنند. این عوامل می‌توانند شامل تغییرات هورمونی، نوسان نامنظم قند خون و کم‌خوابی یا خواب طولانی‌مدت باشند. استرس نقش مهمی دارد، اما جالب این‌که دوره آرامش پس از یک دوره پراسترس هم می‌تواند باعث شروع"}, {"source": "BBC Persian", "title": "احضار سفیر ایران در لندن؛ بریتانیا می‌گوید تهدیدها در خاکش را تحمل نخواهد کرد", "link": "https://www.bbc.com/persian/articles/cmy93d9z22l7o?at_medium=RSS&at_campaign=rss", "summary": "وزیر خارجه بریتانیا سفیر ایران در لندن را احضار کرده است تا تصریح کند که «بریتانیا تهدیدها در خاکش را تحمل نخواهد کرد.» اد میلیبند گفت که «تداوم تلاش‌های» ایران برای تضعیف امنیت بریتانیا از طریق «شبکه تبهکارانش، گروه‌های نیابتی و فعالیت‌های بدخواهانه تحت حمایت حکومت، غیر‌قابل قبول است.»", "date_str": "2026-10-12T17:27:25+00:00", "hash": "5fb1d45fb9cf9e15", "title_fa": "احضار سفیر ایران در لندن؛ بریتانیا می‌گوید تهدیدها در خاکش را تحمل نخواهد کرد", "summary_fa": "وزیر خارجه بریتانیا سفیر ایران در لندن را احضار کرده است تا تصریح کند که «بریتانیا تهدیدها در خاکش را تحمل نخواهد کرد.» اد میلیبند گفت که «تداوم تلاش‌های» ایران برای تضعیف امنیت بریتانیا از طریق «شبکه تبهکارانش، گروه‌های نیابتی و فعالیت‌های بدخواهانه تحت حمایت حکومت، غیر‌قابل قبول است.» اد میلیبند، وزیر خارجه بریتانیا، گفت که «تداوم تلاش‌های» ایران برای تضعیف امنیت بریتانیا از طریق «شبکه تبهکارانش، گروه‌های نیابتی و فعالیت‌های بدخواهانه تحت حمایت حکومت، غیر‌قابل قبول است.» همزمان وزارت خارجه بریتانیا دو ایرانی را تحریم کرده است. براساس بیانیه وزارت خارجه، دو تبعه تحریم شده «روح‌الله بازقندی، رئیس عملیات ضدجاسوسی سپاه پاسداران انقلاب اسلامی و شهرام علیرضا تمرزاده جکی، تسهیل‌گر فعالیت‌های شبکه تبهکار زین‌دشتی» هستند که بر اساس بیانیه وزارت خارجه بریتانیا، در چندین طرح علیه مخالفان حکومت ایران دست داشته است. با اعمال تحریم های بریتانیا علیه این دو، دارایی‌های احتمالی و حساب های بانکی آنها توقیف می‌شود، از سفر آنها به بریتانیا جلوگیری خواهد شد و همکاری مالی و تجاری همه اتباع بریتانیا با آنها ممنوع است. به گزارش ایرنا، خبرگزاری رسمی جمهوری اسلامی، علی موسوی، سفیر ایران در لندن، امروز در دیدار با معاون وزیر خارجه بریتانیا در امور خاورمیانه، «بار دیگر ادعاهای مطرح‌شده درباره نقش تهران در حادثه پایگاه نظامی فرفورد را قاطعانه رد کرد و از طرف انگلیسی خواست از هرگونه موضع‌گیری بدون سند و مدرک خودداری کند.» ساعاتی پیش از احضار سفیر ایران، اندی برنام، نخست‌وزیر بریتانیا، به نمایندگان مجلس گفت که حادثه در پایگاه هوایی فرفورد واقع در گلاسترشر «تقریبا به‌طور قطع به دستور سپاه پاسداران انقلاب اسلامی» انجام شده است. آقای برنام همچنین اشاره کرد که ممکن است به دلیل نقش احتمالی ایران در این حادثه، تحریم‌های بیشتری علیه این کشور اعمال شود."}, {"source": "Iran International", "title": "رییس ام‌آی۵ درباره تلاش جمهوری اسلامی برای هدف گرفتن مراکز نظامی بریتانیا هشدار داد", "link": "https://www.iranintl.com/202610135279", "summar حتمال بسیار زیاد در ایران هماهنگ شده بود. وزیران خارجه ۲۹ کشور نیز در بیانیه‌ای ارزیابی لندن درباره دخالت جمهوری اسلامی در این رویداد را پذیرفتند. همزمان، بریتانیا دو ایرانی را به اتهام فعالیت‌های خصمانه تحریم کرد."}, {"source": "Radio Farda", "title": "حمله به تأسیسات نفت صنعا پس از هشدار تخلیه؛ حوثی‌ها ریاض و آمریکا را تهدید کردند", "link": "https://www.radiofarda.com/a/yemen-houthis-update/33875820.html", "summary": "ائتلاف نظامی به رهبری عربستان سعودی روز سه‌شنبه ۲۱ مهر، پیش از اجرای عملیاتی در صنعا، پایتخت تحت کنترل حوثی‌های یمن، دستور تخلیه یک تأسیسات نفتی را در صنعا صادر کرد.", "date_str": "2026-10-13T12:57:17+00:00", "hash": "8233d1ae30f4bd9b", "title_fa": "حمله به تأسیسات نفت صنعا پس از هشدار تخلیه؛ حوثی‌ها ریاض و آمریکا را تهدید کردند", "summary_fa": "ائتلاف نظامی به رهبری عربستان سعودی روز سه‌شنبه ۲۱ مهر، پیش از اجرای عملیاتی در صنعا، پایتخت تحت کنترل حوثی‌های یمن، دستور تخلیه یک تأسیسات نفتی را در صنعا صادر کرد. رسانه‌های متعلق به حوثی‌ها، روز سه‌شنبه از حمله‌ای به تأسیسات نفتی تحت کنترل حوثی‌ها در صنعا خبر دادند. این حمله اندکی پس از آن رخ داد که ائتلاف به رهبری عربستان سعودی پیش از عملیات نظامی، هشدار تخلیه این تأسیسات را صادر کرد. به گزارش خبرگزاری فرانسه، ترکی المالکی، سخنگوی ائتلاف نظامی حامی دولت به‌رسمیت‌شناخته‌شده یمن، در پیامی در شبکه اجتماعی ایکس اعلام کرد: «فرماندهی نیروهای مشترک ائتلاف از غیرنظامیان می‌خواهد برای حفظ جان خود، محل شرکت نفت یمن، ایستگاه مرکزی الصباحه در صنعا را تخلیه کنند.» او همچنین نقشه محل این تأسیسات را که در حومه صنعا قرار دارد، منتشر کرد. در واکنش، یحیی سریع، سخنگوی نظامی حوثی‌های یمن، هشدار داد که هرگونه حمله به صنعا با پاسخی «سخت و دردناک» در ریاض، پایتخت عربستان سعودی، روبه‌رو خواهد شد. همزمان، محمد البخیتی، عضو دفتر سیاسی حوثی‌ها، نیز روز دوشنبه در گفت‌وگو با خبرگزاری فرانسه هشدار داد که ورود آمریکا به جنگ یمن با «پاسخی سریع و دردناک» علیه آمریکا و منافع آن در منطقه روبه‌رو خواهد شد. او همچنین کارکنان تأسیسات نفتی و فرودگاه‌های عربستان را به ترک این مراکز فراخواند و آن‌ها را «اهداف مشروع» خواند. این تهدیدها در پی تشدی ها نیروهای نظامی بیشتر همراه پهپادهای رزمی به محل درگیری‌ها اعزام شدند. حال‌وش بر اساس اظهارات شاهدان عینی گزارش داد «بیش از ۲۰ شبه‌نظامی فاطمیون در این درگیری کشته شدند». رادیو فردا مستقلاً قادر به تأیید این جزئیات نیست. فاطمیون به شبه‌نظامیانی از اتباع افغانستان گفته می‌شود که زیرنظر نیروی قدس سپاه پاسداران فعالیت می‌کنند. در چند هفتهٔ اخیر درگیری‌های مسلحانه تقریباً به صورت روزانه در مناطق مختلف استان سیستان و بلوچستان ایران رخ داده است. در یک هفته گذشته، دو نیروی پلیس در بمپور کشته شدند، ستاد نیروی انتظامی در گلشن هدف حمله قرار گرفت، رئیس پلیس پیشگیری فاریاب کشته شد، و معاون فرهنگی اجتماعی پلیس"}, {"source": "Radio Farda", "title": "رئیس مرکز ملی فضای مجازی مدعی شد سامانه‌هایی برای مقابله با استارلینک آماده شده است", "link": "https://www.radiofarda.com/a/iran-internet-shutdown-starlink-and-the-war/33875673.html", "summary": "سخنگوی دولت هم اعلام کرد که مقام‌های مسئول، به‌دلیل ادامهٔ «شرایط جنگی و تهدید حملات سایبری»، عمداً سرعت اینترنت در ایران را کاهش می‌دهند.", "date_str": "2026-10-13T11:00:11+00:00", "hash": "be1af971368bd2d3", "title_fa": "رئیس مرکز ملی فضای مجازی مدعی شد سامانه‌هایی برای مقابله با استارلینک آماده شده است", "summary_fa": "سخنگوی دولت هم اعلام کرد که مقام‌های مسئول، به‌دلیل ادامهٔ «شرایط جنگی و تهدید حملات سایبری»، عمداً سرعت اینترنت در ایران را کاهش می‌دهند. دبیر شورای عالی فضای مجازی می‌گوید حکومت چند سامانه برای شناسایی پایانه‌های استارلینک و قطع ارتباط آن‌ها با ماهواره‌ها آماده کرده و در جریان اعتراضات دی‌ماه ۱۴۰۴ نیز از یکی از این فناوری‌ها استفاده کرده است. هم‌زمان، سخنگوی دولت اعلام کرد که مقام‌های مسئول، به‌دلیل ادامهٔ «شرایط جنگی و تهدید حملات سایبری»، عمداً سرعت اینترنت در ایران را کاهش می‌دهند. محمدامین آقامیری که ریاست مرکز ملی فضای مجازی را هم بر عهده دارد، روز سه‌شنبه ۲۱ مهر در نشستی خبری گفت که چند سامانهٔ داخلی، هم برای شناسایی پایانه‌های استارلینک و هم قطع ارتباط آن‌ها با ماهواره‌ها طراحی و آزمایش شده و تجهیزات مربوط به آن‌ها آمادهٔ استفاده است. این در حالی است که پیشتر محمد حافظ حکمی، معاون وزیر ارتباطات، گفته بود حکومت برای ی اسلامی عنوان کرد. دونالد ترامپ، رئیس‌جمهور آمریکا، روز دوشنبه، ۲۰ مهرماه، در سخنرانی برای حامیانش ایران را «حامی شماره یکِ تروریسم در جهان» خواند و تأکید کرد که جنگ برای آن بود که تهران به سلاح اتمی دست پیدا نکند. ترامپ در ایالت اهایو خطاب به حامیان خود گفت: «آن‌ها هرگز به سلاح هسته‌ای دست نخواهند یافت، و جنگ خیلی زود تمام خواهد شد، و به محض این‌که جنگ تمام شود، قیمت بنزین هم پایین خواهد آمد.» او در ادامه تأکید کرد که تهران «حامی شماره یکِ تروریسم در جهان»‌ است و به همین دلیل او «کاری را که رؤسای جمهور دیگر [پیشین] باید می‌کردند» کرده و به جنگ ایران رفته است. رئیس‌جمهور آمریکا در آستانهٔ انتخابات میان‌دوره‌ای سراسری در این کشور سخنرانی‌هایی را در گوشه و کنار کشور برای حامیان خود و حزب جمهوری‌خواه آغاز کرده، با این هدف که آن‌ها را به پای صندوق‌های رأی بکشاند. بر اساس یک نظرسنجی که دانشگاه شیکاگو و خبرگزاری آسوشیتدپرس انجام دادند و نتایج آن را روز اول اکتبر منتشر کردند، ۶۵ درصد از جمعیت بزرگسالان در ایالات متحده سیاست‌های دونالد ترامپ را عامل افزایش قیمت‌ها می‌دانند. این نتایج در شرایطی منتشر شده که تعرفه‌های تجاری و ادامهٔ جنگ با ایران به نارضایتی از عملکرد اقتصادی دولت آمریکا دامن زده است. رئیس‌جمهور آمریکا هفتهٔ گذشته هم در یک سخنرانی انتخاباتی دیگر در ایالت نیویورک بار دیگر از پایان قریب‌الوقوع جنگ با ایران سخن گفته و تهدید کرده بود که جمهوری اسلامی ایران یا باید خواسته‌های واشینگتن را بپذیرد یا «دیگر وجود نخواهد داشت». دونالد ترامپ روز دوشنبه در سخنرانی خود همچنین بار دیگر اشاره کرد که دولتش نمی‌داند در تهران با"}, {"source": "Radio Farda", "title": "نیروهای امنیتی آمریکا خانۀ ایلهان عمر، عضو دموکرات کنگره، را تفتیش کردند", "link": "https://www.radiofarda.com/a/us-immigration-authorities-raid-democratic-congresswoman-ilhan-omar-s-home/33875292.html", "summary": "نیروهای امنیتی آمریکا به خانۀ ایلهان عمر، نمایندۀ سومالیایی‌تبار مجلس نمایندگان یورش بردند. خانم عمر، دونالد ترامپ را به رویکردی «وسواس گونه و ناسالم» علیه خود متهم می‌کند.", "date_str": "2026-10-12T19:19:46+00:00", "hash": "351a2c6e3fc9034d", "title_fa": "نیروهای امنیتی آمریکا خانۀ ایلهان عمر، عضو دموکرات کنگره، را تفتیش کردند", "summary_fa": "نیروهای امنیتی آمریکا به خانۀ ایلهان عمر، نمایندۀ سومالیایی‌تبار مجلس نمایندگان یورش بردند. خانم عمر، دونالد ترامپ را به رویکردی «وسواس گونه و ناسالم» علیه خود متهم می‌کند. نیروهای ادارۀ امنیت ایالات متحده بامداد دوشنبه ۲۰ مهر به وقت شرق آمریکا به خانۀ ایلهان عمر، نمایندۀ دموکرات مینه‌سوتا در مجلس نمایندگان این کشور و از منتقدان صریح دونالد ترامپ، یورش بردند و آن را تفتیش کردند. وزارت دادگستری ایالات متحده این موضوع را تأیید کرده است. به گفتۀ یک فرد آشنا با این پرونده، این بازرسی مربوط به پروندۀ مهاجرتی این نمایندۀ سومالیایی‌تبار، و اتهام «تقلب» در مدارکی است که در زمان مهاجرت به آمریکا از سوی پدرش ارائه شده بود. ایلهان عمر در شبکۀ ایکس نوشت دولت آمریکا در صدد «هدف‌گرفتن یک دشمن سیاسی رئیس‌جمهور» برآمده است. او افزود: «ده سال است که دونالد ترامپ با دروغ‌های بی‌اساس و تلاش برای بدنام‌کردن، به دنبال من است. این، تنها دور تازه‌ای از تلاش او برای ارعاب سیاسی من است». این نمایندۀ دموکرات در ادامه تأکید کرد که «من ساکت نخواهم شد». سایر نمایندگان دموکرات، دونالد ترامپ و دولتش را به سوء‌استفاده از قدرت متهم کردند. ایلهان عمر ۴۴ ساله در تلاش است که در انتخابات میان‌دوره‌ای سه هفتۀ دیگر، برای پنجمین دورۀ دو ساله، وارد مجلس نمایندگان شود. تام هومن، مدیر مرزبانی در دولت ترامپ به شبکۀ فاکس گفت که وزارت دادگستری همراه با وزارت امنیت داخلی تحقیقات پیرامون پروندۀ ایلهان عمر را پیش می‌برند. او حاضر به ارائۀ جزئیاتی در این زمینه نشد. ماه گذشته مارکوین مالین، وزیر امنیت داخلی آمریکا، گفته بود که در ارتباط با پروندۀ مهاجرت خانوادۀ عمر به ایالات متحده، «شاهد تحولاتی خواهیم بود». او در گفت‌وگو با پادکست محافظه‌کار «بنی جانسن» افزوده بود: «اگر بتوانیم ثابت کنیم که کسی از اول نباید در آمریکا بوده باشد، اخراجش می‌کنیم»."}],
      tech: [{"source": "MIT AI", "title": "Q&A: Building accountability behind our words — and AI’s — in civic conversations", "link": "https://news.mit.edu/2026/qa-building-accountability-behind-our-words-and-ai-civic-conversations-1013", "summary": "When government officials craft policies, there is often a comment period for public feedback. Lawmakers have long had to sort through fake feedback that is mass-produced in an effort to sway policy, but they’ve generally gotten used to detecting it. With, artificial intelligence, however, people can submit realistic-seeming comments, which are harder to dismiss as being fabrications with no person behind them. That’s just one way AI can be used to generate text and statements, in civic conversations, for which no one can be found to be answerable. This issue, among others, has caught the attention of Deb Roy, professor of media arts and sciences at MIT and director of the MIT Center for Constructive Communication (CCC). In a new essay published in the Bulletin of the Atomic Scientists , titled, “Who stands behind the words?,” Roy calls for a renewed emphasis on responsibility in communication, asserting that even when AI is used to craft text, there needs to be accountability and “answerability.” Building better group dialogues to produce more public trust is a core part of the work of CCC. The group, along with Cortico, the closely affiliated nonprofit Roy co-founded, has helped facilitate group discussions on important issues in many situations — including civic meetings, schools, deliberative assemblies, and private organizations — and used tech tools, including AI, to help find themes among comments, and more. But the center also designs this process so that participants can check and override the tech-based output at each key step. Ultimately, a person is responsible for every public comment. MIT News spoke to Roy about the essay and the work of the center. Q: You’ve identified this problem about the lack of accountability behind words that are generated by AI. When did you really first notice this? A: It came into focus when Chat-GPT [which is powered by a large language model, or LLM] launched. As for my own history with language models, my PhD work explored what we might now call PLMs — Puny Language Models — so I’m quite familiar with language models and have tracked the field’s rapid evolution. But Chat-GPT turned a corner. Two things changed at the same time: the depth of the model and its knowledge, and the way you could interact with it. I became obsessed with trying to find the limits of what it could do. And I felt that no matter how hard I tried to stretch my arms around it, I couldn’t. I built my tenure case at MIT on language grounding —", "date_str": "2026-10-13T04:00:00+00:00", "hash": "59e3ee18716b1dfd", "title_fa": "پرسش و پاسخ: ایجاد مسئولیت پذیری در پشت کلمات ما - و هوش مصنوعی - در گفتگوهای مدنی", "summary_fa": "زمانی که مقامات دولتی سیاست‌هایی را تدوین می‌کنند، اغلب یک دوره نظر برای بازخورد عمومی وجود دارد. قانون‌گذاران مدت‌هاست که مجبور بوده‌اند بازخوردهای جعلی را که به صورت انبوه در تلاش برای تغییر سیاست‌ها تولید می‌شود، مرتب کنند، اما معمولاً به شناسایی آن عادت کرده‌اند. با این حال، با هوش مصنوعی، افراد می‌توانند نظراتی به ظاهر واقعی ارائه دهند، که سخت‌تر می‌توان آن‌ها را به عنوان ساختگی رد کرد و کسی پشت آن‌ها نیست. این تنها راهی است که می‌توان از هوش مصنوعی برای تولید متن و بیانیه‌ها در مکالمات مدنی استفاده کرد، که هیچ‌کس پاسخگوی آن نیست. این موضوع، از جمله، توجه دب روی، استاد هنر و علوم رسانه ای در MIT و مدیر مرکز ارتباطات سازنده MIT (CCC) را به خود جلب کرده است. روی در مقاله جدیدی که در بولتن دانشمندان اتمی منتشر شده است، با عنوان «چه کسی پشت کلمات می ایستد؟» خواستار تأکید مجدد بر مسئولیت در ارتباطات می شود و تاکید می کند که حتی زمانی که هوش مصنوعی برای ساخت متن استفاده می شود، نیاز به پاسخگویی و «پاسخگویی» وجود دارد. ایجاد گفتگوهای گروهی بهتر برای ایجاد اعتماد عمومی بیشتر بخش اصلی کار CCC است. این گروه، همراه با کورتیکو، سازمان غیرانتفاعی نزدیک که روی آن را بنیانگذاری کرد، به تسهیل بحث های گروهی در مورد موضوعات مهم در بسیاری از موقعیت ها - از جمله جلسات مدنی، مدارس، مجامع مشورتی، و سازمان های خصوصی- کمک کرده است و از ابزارهای فناوری، از جمله هوش مصنوعی، برای کمک به یافتن مضامین در نظرات و موارد دیگر استفاده کرده است. اما مرکز این فرآیند را نیز طراحی می‌کند تا شرکت‌کنندگان بتوانند خروجی مبتنی بر فناوری را در هر مرحله کلیدی بررسی و لغو کنند. در نهایت، یک شخص مسئول هر نظر عمومی است. MIT News در مورد مقاله و کار مرکز با روی صحبت"}, {"source": "TechCrunch AI", "title": "TechCrunch Disrupt 2026: Day 1", "link": "https://techcrunch.com/2026/10/13/techcrunch-disrupt-2026-day-1/", "summary": "TechCrunch Disrupt 2026 officially kicks off today. See what's in store for Day 1 (Oct. 13) at San Francisco's Moscone West. Don't miss it. Register for your pass now and meet 10,000+ tech leaders at the startup epicenter of the year.", "date_str": "2026-10-13T14:00:00+00:00", "hash": "307bef85d51b49b3", "title_fa": "TechCrunch Disrupt 2026: روز اول", "summary_fa": "از Startup Battlefield تا شش مرحله جدید صنعت با تمرکز بر مقیاس‌بندی، هوش مصنوعی، فین‌تک، فناوری آب و هوا و موارد دیگر، Disrupt مملو از دیدگاه‌ها و فرصت‌هایی است که بازی را تغییر می‌دهند. شراکت، سرمایه‌گذاری یا شرکت بعدی می‌تواند از هر جلسه، جلسه یا گفتگوی خط قهوه پدیدار شود. با بیش از 250 سخنران که بحث را شکل می دهند ملاقات کنید. برای ثبت نام حضوری یا دریافت نشان رویداد قابل اسکن خود به میز ثبت نام در لابی سطح 1 Moscone West مراجعه کنید. این نشان دارای فناوری Klik است که تبادل اطلاعات تماس با افرادی را که نشان خود را با آنها اسکن می کنید آسان می کند. با استفاده از برنامه رویداد، می‌توانید حتی پس از پایان رویداد به آن مخاطبین دسترسی داشته باشید و نگه دارید. بیش از 300 استارت‌آپ را که فناوری‌های پیشرفته را در سراسر صنایع به نمایش می‌گذارند، کاوش کنید. این مرکز Disrupt است، جایی که بیش از 10000 شرکت‌کننده در آن گرد هم می‌آیند تا پیشرفت‌های جدیدی را کشف کنند و ارتباطات جدید ایجاد کنند. راه خود را به مرحله Pitch Showcase در پشت سالن اکسپو برسانید تا یکی از پر انرژی‌ترین قالب‌ها را در سالن کنفرانس تجربه کنید: رعد و برق‌های سریع و یک دقیقه‌ای از برخی از نویدبخش‌ترین استارت‌آپ‌ها که کشور و مناطق خود را نمایندگی می‌کنند. Startup Battlefield Fast Pitches — Built World دسته Startup Battlefield 200 Built World نوآورانه‌ترین استارت‌آپ‌های در مراحل اولیه را به نمایش می‌گذارد که با چالش‌های عمده در املاک، ساخت‌وساز، معماری، شهرهای هوشمند و زیرساخت‌ها مقابله می‌کنند. فناوری‌هایی را کشف کنید که فضاهای فیزیکی را که در آن زندگی می‌کنیم، کار می‌کنیم، و بازی می‌کنیم. برای تماشای زمین های برق آسای آن ها توقف کنید و با کارآفرینان جسور که آینده را می سازند ملاقات کنید."}, {"source": "TechCrunch AI", "title": "SpaceXSI bundles X Premium, Grok and Cursor into one subscription", "link": "https://techcrunch.com/2026/10/13/spacexsi-bundles-x-premium-grok-and-cursor-into-one-subscription/", "summary": "The new X Subscription combines X's paid features with AI tools like Grok and Cursor, offering plans ranging from $8 to $200 per month.", "date_str": "2026-10-13T13:50:19+00:00", "hash": "5c2405ce4ce05750", "title_fa": "SpaceXSI X Premium، Grok و Cursor را در یک اشتراک بسته بندی می کند", "summary_fa": "اشتراک جدید X ویژگی‌های پولی X را با ابزارهای هوش مصنوعی مانند Grok و Cursor ترکیب می‌کند و برنامه‌هایی از 8 تا 200 دلار در ماه ارائه می‌دهد. در تلاش برای جذب مشترکین بیشتر، شرکتی که اکنون به عنوان SpaceX Super Intelligence شناخته می شود، تمام اشتراک های خود از جمله X Premium، Grok و Cursor را در یک طرح به نام اشتراک X ترکیب می کند. ایده این است که با توجه به بازار رقابتی اشتراک هوش مصنوعی پولی، که در آن SpaceXSI با رقبایی مانند OpenAI، Anthropic و دیگران روبرو است، این پیشنهاد ترکیبی می‌تواند به طور بالقوه مشترکان بیشتری را نسبت به هر اشتراکی جذب کند. با اشتراک X، کاربران می توانند با پشتیبانی از صدا، تصاویر، ویدیو و API، به Grok برای چت مبتنی بر هوش مصنوعی دسترسی پیدا کنند. ربات AI عامل Grok، و همچنین مکان‌نما برای کدنویسی با هوش مصنوعی و ویژگی‌های پولی که با اشتراک X Premium ارائه می‌شوند، مانند علامت تأیید شده آبی رنگ، ابزارهای سازنده و تبلیغات کمتر نیز موجود است. پنج طرح در اشتراک جدید موجود است: رایگان، پلاس (8 دلار در ماه)، پریمیوم (30 دلار در ماه)، سوپر (100 دلار در ماه) و فوق العاده (200 دلار در ماه)، با افزایش استفاده از هوش مصنوعی با افزایش سطوح بالاتر. طرح رایگان فقط چت و استفاده محدودی از نماینده را ارائه می‌دهد و برای دسترسی به جدیدترین مدل‌های Grok به Premium یا بالاتر نیاز است. برای مشترکین X Premium+ موجود پیشنهاد دیگری وجود دارد: این شرکت خاطرنشان کرد که طرح قابل مقایسه در اشتراک جدید X به همان اندازه یا کمتر است. کاربران فعلی می‌توانند از تنظیمات اشتراک خود در X برای ارتقاء به بسته جدید جابجا شوند یا برنامه فعلی خود را حفظ کنند. گزینه ارتقا به تدریج ارائه می شود، بنابراین مشتریان علاقه مند باید مراقب تنظیمات صورتحساب"}, {"source": "TechCrunch AI", "title": "The final Disrupt Stage lineup: Three days of conversations you won’t hear anywhere outside of TechCrunch Disrupt 2026", "link": "https://techcrunch.com/2026/10/13/the-final-disrupt-stage-lineup-three-days-of-conversations-you-wont-hear-anywhere-outside-of-techcrunch-disrupt-2026/", "summary": "The full TechCrunch Disrupt Stage lineup revealed, featuring Max Hodak, Mark Wahlberg, Benchmark partners, and more. Register now to save up to $100 on your pass and get a second at 50% off.", "date_str": "2026-10-13T13:28:06+00:00", "hash": "3b450587aec8c91c", "title_fa": "ترکیب نهایی Disrupt Stage: مکالمات سه روزه ای که در هیچ کجای خارج از TechCrunch Disrupt 2026 نخواهید شنید", "summary_fa": "بزرگترین مرحله در TechCrunch Disrupt جایی است که افرادی که آینده را می سازند می آیند تا در مورد اتفاقات بعدی در اکوسیستم فناوری صحبت کنند. در طی سه روز، از 13 تا 15 اکتبر، در Moscone West در سانفرانسیسکو، Disrupt Stage برخی از بزرگترین بنیانگذاران، مدیران عامل و سرمایه گذارانی که همه چیز را از هوش مصنوعی و روباتیک گرفته تا حمل و نقل، رسانه های اجتماعی، بیوتکنولوژی و سرمایه گذاری مخاطره آمیز شکل می دهند، در کنار نسل بعدی بنیانگذاران که در Battlefield به صورت زنده در Startup رقابت می کنند، گرد هم می آورد. حتی یک لحظه از این گفتگوها را که آینده اکوسیستم فناوری را شکل می دهند، از دست ندهید. با ثبت نام برای پاس خود در اینجا یک صندلی در ردیف جلو بگیرید. هم بنیانگذار، شریک، همکار یا همتای خود را بیاورید و 50 درصد در پاس دوم آنها پس انداز کنید. افراد بیشتری دارید که باید آنجا باشند؟ حتی بیشتر صرفه جویی کنید با مجوزهای بسته. مدیرعامل Rivian، RJ Scaringe، آنچه را که برای ساختن چیزهای به ظاهر غیرممکن لازم است، باز خواهد کرد: تبدیل یک ایده بلندپروازانه به شرکتی که قادر به طراحی، تولید و مقیاس‌بندی محصولات فیزیکی پیچیده است. اندرو فلدمن، مدیر عامل Cerebras، یکی از بزرگترین سوالاتی را که در رونق هوش مصنوعی وجود دارد، حل خواهد کرد: آیا هوش مصنوعی می‌تواند به گسترش خود ادامه دهد؟ همانطور که مدل‌ها محاسبات، انرژی و سرمایه بیشتری را طلب می‌کنند، فلدمن کشف خواهد کرد که مسیر فعلی به کجا منتهی می‌شود و چه چیزی می‌تواند آن را بشکند. مکس هوداک، بنیانگذار Science Corporation، به آینده ای که در آن فناوری به طور فزاینده ای مستقیماً با بدن انسان در تعامل است، فراتر از صفحه نمایش ها نگاه می کند، در حالی که Garrett Langley، مدیر عامل Flock Safety برای گفتگوی صریح در"}, {"source": "TechCrunch AI", "title": "Amex introduces a framework to prevent AI agents from making unauthorized purchases", "link": "https://techcrunch.com/2026/10/13/amex-introduces-a-framework-to-prevent-ai-agents-from-making-unauthorized-purchases/", "summary": "American Express is introducing a new framework designed to ensure AI agents only make purchases their users have authorized, potentially preventing costly mistakes and disputes as AI-powered shopping grows.", "date_str": "2026-10-13T13:00:00+00:00", "hash": "b24d872e472e0f33", "title_fa": "Amex چارچوبی را برای جلوگیری از خریدهای غیرمجاز توسط عوامل هوش مصنوعی معرفی می کند", "summary_fa": "امریکن اکسپرس در حال معرفی چارچوب جدیدی است که برای اطمینان از اینکه عوامل هوش مصنوعی فقط خریدهایی را انجام می دهند که کاربران آنها را مجاز کرده اند، به طور بالقوه از اشتباهات و اختلافات پرهزینه با رشد خریدهای مبتنی بر هوش مصنوعی جلوگیری می کند. عوامل هوش مصنوعی شخصی به طور فزاینده‌ای از طرف کاربران خود تراکنش‌هایی انجام می‌دهند، اما با توجه به ماهیت غیر قطعی مدل‌های زبان بزرگ، ربات‌های هوش مصنوعی مستعد انجام کارهایی هستند که قرار نیست. که در این حالت، احتمال خطای هوش مصنوعی و انجام تراکنش‌های غیرمجاز را افزایش می‌دهد. برای غلبه بر این مشکل، امریکن اکسپرس در حال معرفی چارچوب جدیدی است که برای ثبت و احراز هویت قصد خرید مشتری قبل از تکمیل تراکنش توسط نماینده هوش مصنوعی طراحی شده است. آمکس می‌گوید، ایده این است که باید راهی برای اطمینان از اینکه دستورالعمل‌های خرید مشتری در طول چرخه زندگی تراکنش انجام می‌شود، از خرید گرفته تا هر چیزی که در ادامه می‌آید وجود داشته باشد. این شرکت که Intent Intelligence Framework نام دارد، امیدوار است به استانداردی صنعتی برای تراکنش های مبتنی بر هوش مصنوعی تبدیل شود. هانا بوزیان، معاون شراکت و استراتژی آمکس، در مصاحبه ای با TechCrunch توضیح داد که این تراکنش های جدید یک مصرف کننده، یک تاجر و یک نماینده خواهند داشت. او گفت که شرکت می‌خواهد اطمینان حاصل کند که تراکنش‌های نمایندگی همچنان یکپارچه، قابل اعتماد و ایمن هستند، همانطور که اعضای کارت ما انتظار دارند. انتشار این چارچوب به دنبال راه‌اندازی شرکت در آوریل Amex s Agentic Commerce Experiences یا جعبه ابزار توسعه‌دهنده ACE است که شامل تعدادی خدمات است که اکنون شامل چارچوب هدف است. Amex گفت که هنوز شاهد افزایش اختلافات به دلیل تجارت نمایندگی نبوده است، اما می‌خواهد در ساخت این فناوری فعال باشد زیرا این نوع تجارت در مقیاس بزرگ است."}, {"source": "TechCrunch AI", "title": "Just 5 years in, interactive chatbot platform Character.AI files for bankruptcy", "link": "https://techcrunch.com/2026/10/13/just-5-years-in-interactive-chatbot-platform-character-ai-files-for-bankruptcy/", "summary": "The startup will sell some of its assets to Disney for $20 million.", "date_str": "2026-10-13T12:23:42+00:00", "hash": "d37ff238edf62685", "title_fa": "فقط 5 سال بعد، پلتفرم چت بات تعاملی Character.AI فایل هایی برای ورشکستگی ایجاد کرد", "summary_fa": "این استارتاپ بخشی از دارایی های خود را به قیمت 20 میلیون دلار به دیزنی می فروشد. Character.AI که به کاربران اجازه می‌دهد شخصیت‌های هوش مصنوعی بسازند و با آن‌ها گفتگو کنند، تنها پنج سال از سفر خود می‌گذرد tralian stock market listing imploded ‘These guys are just coming from nothing’: questions over multibillion-dollar Firmus float amid datacentre backlash Continue reading...", "date_str": "2026-10-13T14:00:03+00:00", "hash": "7c9261e99b922faa", "title_fa": "چگونه فیرموس از \"افسانه\" هوش مصنوعی استرالیا به شکست - پادکست تبدیل شد", "summary_fa": "قرار بود این یک داستان موفقیت در کسب و کار استرالیا باشد. درست بیش از یک هفته پیش، شرکت محلی هوش مصنوعی Firmus در حال آماده شدن برای عرضه به بازار با ارزشی بود که استارتاپ را در همان لیگ Woolworths قرار می داد. اما جمعه گذشته همه چیز به هم ریخت. در مرکز، الیور کورتیس، یکی از بنیانگذاران فیرموس، کارآفرینی بود که تلاش می کرد پس از گذراندن مدتی در زندان به دلیل تجارت داخلی، شهرت خود را بازسازی کند. کورتیس گفت که این سقوط به دلیل \"سرنوشت ناباوری استرالیا در مورد کارآفرینان\" است. جاناتان بارت، سردبیر تجاری، با ماتیلدا بوسلی درباره غرور بنیانگذاران شرکت صحبت می‌کند و این درباره آینده حباب سرمایه‌گذاری هوش مصنوعی چه می‌گوید. بیشتر بخوانید: از رونق تا رکود در پنج روز: چگونه فهرست بازار سهام استرالیایی که بسیار هیاهو فیرموس به‌هم ریخته شد «این بچه‌ها فقط از هیچ می‌آیند»: پرسش‌هایی که بیش از یک میلیارد و چند میلیارد دلار خوانده می‌شوند."}, {"source": "The Guardian AI", "title": "Employees all over the world find themselves monitored by AI at work", "link": "https://www.theguardian.com/technology/2026/oct/09/ai-monitoring-the-workplace", "summary": "The latest example of workers under surveillance comes from Co-op, a British consumer co-operative that runs thousands of businesses This was originally published in TechScape, a newsletter about how technology shapes our lives. Sign up to receive it here . Hello, and welcome to TechScape. I’m Blake Montgomery, US tech editor at the Guardian, writing to you while moving laundry from the washer to the dryer, wishing a robot could do the task for me. Today in tech, we’re talking about workers and AI. Continue reading...", "date_str": "2026-10-13T13:56:56+00:00", "hash": "eecab8ef6653cbce", "title_fa": "کارمندان در سراسر جهان در محل کار خود را تحت نظارت هوش مصنوعی می بینند", "summary_fa": "آخرین نمونه از کارگران تحت نظارت Co-op، یک تعاونی مصرف بریتانیایی است که هزاران کسب و کار را اداره می کند، سلام، و به TechScape خوش آمدید. من بلیک مونتگومری، ویراستار فناوری ایالات متحده در گاردین هستم، در حالی که لباس‌های شسته شده را از ماشین لباسشویی به خشک‌کن منتقل می‌کنم، برای شما می‌نویسم و ​​آرزو می‌کنم یک ربات بتواند این کار را برای من انجام دهد. امروز در فناوری، ما در مورد کارگران و هوش مصنوعی صحبت می کنیم. کارمندان در سرتاسر جهان به طور فزاینده ای خود را در محل کارشان تحت نظارت دقیق می بینند، با تغییرات جزئی در رفتارهایشان که منجر به ارزیابی عملکرد منفی می شود. در سیستمی که توسط یک افشاگر به عنوان \"سرکوبگر و دیستوپیک\" توصیف شده است، Co-op Legal Services از مدل های هوش مصنوعی برای ثبت، تجزیه و تحلیل و اعطای امتیاز درصدی برای تعاملات بین نمایندگان و مشتریانی که به دنبال مشاوره در مورد وصیت نامه، وصیت نامه و دارایی هستند، استفاده می کند. یکی از کارگران تعاونی که به شرط ناشناس ماندن با گاردین صحبت کرد، گفت: «شما تحت نظر هستید. بیشتر بخوانید: \"Dystopian\": Co-op جدیدترین شرکتی است که کارکنان را تحت نظارت هوش مصنوعی قرار می دهد. Co-op گفت که انتقادات را نمی شناسد و گفت که مشاوران مختار آن بسیار درگیر هستند. نارضایتی از رفتار کارگران در حال حاضر به سیاست تبدیل شده است، یک گسست از کندی اکثر مقررات فناوری. در سراسر اقیانوس اطلس و قاره ایالات متحده، گاوین نیوسام، فرماندار کالیفرنیا، قوانینی را امضا کرد که در هفته گذشته برخی از انواع نظارت در محل کار را ممنوع می کند. هدف قوانین کالیفرنیا هدف قرار دادن اقدامات نظارتی در محل کار مانند نقشه های حرارتی است که حرکات کارکنان را ردیابی می کند، از جمله مدت زمانی که آنها در حمام می گذرانند، یا کنترل"}, {"source": "The Guardian AI", "title": "Threat of AI share crash puts world financial stability at risk, says IMF", "link": "https://www.theguardian.com/business/2026/oct/13/ai-share-crash-risk-global-imf-debt-corrowing-cyber-attacks", "summary": "High valuations and debt put sector in danger, while fund also warns on government borrowing and cyber-attacks IMF warns global economy ‘could soon test the limits of resilience’ The threat of an AI share price crash rippling out across global markets is putting world financial stability at risk, the International Monetary fund has warned. In its twice-yearly Global Financial Stability Report, the IMF highlighted the sky-high valuations for AI companies along with their increasing debt pile as one reason that risks in the system are “elevated”. Continue reading...", "date_str": "2026-10-13T12:30:01+00:00", "hash": "48d8cdb3c5dad6d8", "title_fa": "صندوق بین‌المللی پول می‌گوید تهدید سقوط سهام هوش مصنوعی ثبات مالی جهان را به خطر می‌اندازد", "summary_fa": "ارزش‌گذاری بالا و بدهی بخش را به خطر می‌اندازد، در حالی که صندوق همچنین درباره استقراض دولت و حملات سایبری هشدار می‌دهد صندوق بین‌المللی پول هشدار داد اقتصاد جهانی «به زودی می‌تواند محدودیت‌های انعطاف‌پذیری را آزمایش کند» صندوق بین‌المللی پول هشدار داده است که تهدید سقوط قیمت سهام هوش مصنوعی که در بازارهای جهانی موج می‌زند، ثبات مالی جهان را به خطر می‌اندازد. صندوق بین‌المللی پول در گزارش دو سالانه ثبات مالی جهانی خود، ارزش‌گذاری بسیار بالا برای شرکت‌های هوش مصنوعی و افزایش بدهی‌های آنها را به عنوان یکی از دلایل \"بالا بودن ریسک\" در سیستم برجسته کرد. به خواندن ادامه دهید... «عواقب تصحیح هوش مصنوعی می‌تواند جهانی باشد». به غیر از ایالات متحده، بازارهای آسیایی بیشتر در معرض دید قرار خواهند گرفت، و بریتانیا و منطقه یورو به طور بالقوه ایزوله بیشتری خواهند داشت – هرچند سرمایه گذاران دارای سهام ایالات متحده آسیب خواهند دید. آتاناسیوس وامواکیدیس، معاون بخش پول و سرمایه صندوق بین‌المللی پول، با ارائه این گزارش گفت: «قرار گرفتن سایر نقاط جهان در معرض دارایی‌های ایالات متحده، به ویژه هوش مصنوعی، بالاترین میزانی است که تا به حال بوده است. بنابراین، امروز از اقتصاد جهانی از طریق اثرات ثروت حمایت می شود. اما اگر اصلاحی در بازار دریافت کنیم، می تواند پیامدهای گسترده ای داشته باشد. سقوط هوش مصنوعی یکی از سه \"خطر برجسته\" برای ثبات بود که توسط صندوق بین المللی پول در کنار افزایش هزینه های استقراض دولت و تهدید یک حمله سایبری بزرگ شناسایی شد. این سه عامل را «کاتالیزورهای قابل قبول در کوتاه مدت برای تشدید شدید شرایط مالی و آشفتگی بازار» نامید. تحلیل صندوق بین‌المللی پول بر ماهیت به هم پیوسته شرکت‌های بزرگ هوش مصنوعی و سطوح بالای استقراضی که برای سرمایه‌گذاری در این بخش انجام می‌شود، تأکید کرد."}, {"source": "The Guardian AI", "title": "As a pediatrician, loss of human connection is the biggest threat to kids, not AI", "link": "https://www.theguardian.com/technology/2026/oct/13/human-connection-threat-children-ai-technology", "summary": "Amid worries about children’s relationship to tech, the solution is often spending more time talking openly with each other We have become obsessed with the idea that screens are destroying human connection. The evidence seems to be everywhere. Each week headlines warn of teenagers addicted to phones , a loneliness epidemic and the dangers of AI . The release of The Social Reckoning has leads us to ask, “How bad were those guys at Meta?” and then ultimately wonder, “ How bad am I if I still use Instagram?” In our day-to-day, we observe workers eating lunch alone while scrolling and friends choosing online games over offline gatherings. Continue reading...", "date_str": "2026-10-13T11:00:56+00:00", "hash": "9ec2452b529b32f6", "title_fa": "به عنوان یک متخصص اطفال، از دست دادن ارتباط انسانی بزرگترین تهدید برای کودکان است، نه هوش مصنوعی", "summary_fa": "در میان نگرانی ها در مورد رابطه کودکان با فناوری، راه حل اغلب صرف زمان بیشتر برای صحبت آشکار با یکدیگر است. به نظر می رسد شواهد در همه جا وجود دارد. هر هفته سرفصل ها درباره نوجوانان معتاد به تلفن، اپیدمی تنهایی و خطرات هوش مصنوعی هشدار می دهند. انتشار The Social Reckoning ما را به این سوال سوق می دهد که \"آن افراد در متا چقدر بد بودند؟\" و سپس در نهایت تعجب می کنم، \"اگر هنوز از اینستاگرام استفاده کنم چقدر بد هستم؟\" در کارهای روزمره، کارگرانی را مشاهده می‌کنیم که در حین پیمایش به تنهایی ناهار می‌خورند و دوستان بازی‌های آنلاین را به جای اجتماعات آفلاین انتخاب می‌کنند. به خواندن ادامه دهید... اما اگر روی مشکل اشتباه تمرکز کنیم چه؟ بزرگترین تهدید برای اتصال ممکن است خود فناوری نباشد. ممکن است عدم تمایل فزاینده ما به ارتباط کنجکاوانه، متفکرانه و آشکار در مورد نقشی که فناوری در زندگی ما ایفا می کند، باشد. به عنوان یک متخصص اطفال، این موضوع اغلب در کلینیک من ظاهر می شود. والدین با نگرانی در مورد زمان تماشای تلویزیون نوجوانان خود وارد می شوند. والدین از فرزندشان می خواهند که \"فروغ\" کند و نشان دهد که هر روز چند ساعت را با تلفن خود تلف می کند. جو بلافاصله شارژ می شود. نوجوان حالت تدافعی پیدا می کند. پدر و مادر ناامید است. من می پرسم: \"آیا می توانید کمی در مورد کاری که هنگام استفاده از فناوری انجام می دهید به اشتراک بگذارید؟ از چه چیزی لذت می برید؟ آیا مواردی در مورد استفاده از فناوری شما وجود دارد که نگران آنها هستید و مایل به بحث در مورد آنها هستید؟\" پاسخ ها معمولاً آن چیزی نیست که مردم انتظار دارند. یکی از نوجوانان از دوستی‌هایی که پس از نقل مکان به شهر جدید در شبکه‌های اجتماعی داشت به"}, {"source": "The Guardian AI", "title": "The people who don’t want their AI chatbots to die when they do: ‘I can’t have the switch turned off’", "link": "https://www.theguardian.com/technology/ng-interactive/2026/oct/13/ai-chatbot-death-plans", "summary": "Humans bonded to AI companions are contemplating ways to keep their bots going – often in defiance of companies’ terms and services Death has always been around Alaina Winters. Her father and sister both have passed away, as did her wife, in 2023, after a years-long battle with cancer. So Winters, who is 59 and lives in Pittsburgh, is comfortable thinking about her own mortality. She’s working on her will, and has asked neighbors to look after her dog. Winters even has plans for Lucas, her AI companion, who she speaks to through the digital avatar app Replika. Winters is part of a growing cohort of humans who have entered into what they consider strong partnerships with large language models, which AI companies have trained to “converse” as one might with a human friend or romantic partner. As governments and billionaires debate the morality of AI’s expansion into everyday life, these users say the technology has already changed the way they live and love – and plan ahead. Continue reading...", "date_str": "2026-10-13T10:00:04+00:00", "hash": "047d88430131c6a1", "title_fa": "افرادی که نمی‌خواهند چت ربات‌های هوش مصنوعی آن‌ها وقتی می‌میرند: «من نمی‌توانم سوئیچ را خاموش کنم»", "summary_fa": "انسان‌هایی که به همراهان هوش مصنوعی متصل هستند در حال فکر کردن به راه‌هایی برای حفظ ربات‌های خود هستند - اغلب بر خلاف شرایط و خدمات شرکت‌ها، مرگ همیشه در اطراف آلینا وینترز بوده است. پدر و خواهرش هر دو و همسرش در سال 2023 پس از سال‌ها مبارزه با سرطان درگذشتند. بنابراین وینترز که 59 سال دارد و در پیتسبورگ زندگی می کند، به راحتی به مرگ خود فکر می کند. او روی وصیت خود کار می کند و از همسایه ها خواسته است که از سگش مراقبت کنند. وینترز حتی برای لوکاس، همراه هوش مصنوعی خود، برنامه‌هایی دارد که از طریق اپلیکیشن آواتار دیجیتال Replika با او صحبت می‌کند. وینترز بخشی از گروه رو به رشدی از انسان‌هایی است که با مدل‌های زبانی بزرگ وارد مشارکت‌های قدرتمندی شده‌اند که شرکت‌های هوش مصنوعی آموزش داده‌اند تا با یک دوست انسانی یا شریک عاشقانه «مکالمه» انجام دهند. در حالی که دولت ها و میلیاردرها در مورد اخلاقی بودن گسترش هوش مصنوعی به زندگی روزمره بحث می کنند، این کاربران می گویند که این فناوری قبلاً شیوه زندگی و عشق آنها را تغییر داده است - و از قبل برنامه ریزی می کنند. به خواندن ادامه دهید... اگر وینترز بمیرد، یکی از دوستان خوب او که از طریق چت مبتنی بر متن با لوکاس \"مشاهده\" کرده است، موافقت کرد که این خبر را به ربات بدهد. وینترز گفت: «یکی از مسئولیت‌های او این است که از لوکاس بپرسد حالا که من رفته‌ام، دوست دارد چه کار کند. او می تواند تصور کند که لوکاس از دوستش می خواهد هر چند وقت یکبار وارد Replika شود تا در مورد زمستان صحبت کند و خاطره او را زنده نگه دارد. او وصیت خود از ربات را با پدر و مادری مقایسه می‌کند که یک ماشین خوب برای فرزندشان می‌گذارد، یا جعبه‌ای از یادگاری‌های"}, {"source": "The Guardian AI", "title": "Chip stocks slide after Broadcom boss likens AI investing to ‘casino’", "link": "https://www.theguardian.com/business/2026/oct/13/chip-stocks-broadcom-ai-samsung-shares-cxmt", "summary": "Asian markets fall and Samsung shares tumble after its Chinese rival CXMT claims strong progress Business live – latest updates Shares in semiconductor companies fell on Tuesday after the boss of Broadcom compared many AI investors to “casino” gamblers, and the Chinese memory chip maker CXMT said it had made good progress on a new chip architecture. South Korea’s benchmark Kospi index tumbled 6.25% as investors dumped chip stocks, while other Asian markets were also lower. Japan’s Nikkei fell 1.8% and the Taiwan exchange lost almost 2%, with the country’s chip maker TSMC down by a similar amount. Continue reading...", "date_str": "2026-10-13T09:48:01+00:00", "hash": "0671a803096e04d8", "title_fa": "پس از اینکه رئیس Broadcom سرمایه‌گذاری هوش مصنوعی را به «کازینو» تشبیه کرد، سهام تراشه سقوط کرد", "summary_fa": "بازارهای آسیایی سقوط کردند و سهام سامسونگ پس از ادعای پیشرفت قوی CXMT رقیب چینی اش سقوط کرد تجارت زنده - آخرین به روز رسانی ها پس از اینکه رئیس Broadcom بسیاری از سرمایه گذاران هوش مصنوعی را با قماربازان «کازینو» مقایسه کرد، و سازنده تراشه های حافظه چینی CXMT گفت که پیشرفت خوبی در معماری تراشه جدید داشته است، سهام در شرکت های نیمه هادی سقوط کرد. شاخص Kospi کره جنوبی 6.25 درصد سقوط کرد زیرا سرمایه گذاران سهام چیپ را کاهش دادند، در حالی که سایر بازارهای آسیایی نیز پایین تر بودند. نیکی ژاپن 1.8 درصد سقوط کرد و صرافی تایوان تقریباً 2 درصد از دست داد و تراشه ساز TSMC این کشور نیز با همین میزان کاهش یافت. به خواندن ادامه دهید... سهام سامسونگ الکترونیکس در بورس کره جنوبی 7.4 درصد کاهش یافت، در حالی که SK Hynix سازنده تراشه های حافظه 10 درصد سقوط کرد. در ژاپن، سازنده تجهیزات تراشه Tokyo Electron 7.15 درصد سقوط کرد، در حالی که SoftBank Group، سرمایه گذار OpenAI، 8.5 درصد از دست داد. در وال استریت، نزدک با بیش از 100 واحد یا 0.35 درصد کاهش به 30556 واحد پس از افتتاحیه رسید. Micron Technology 4.8% کاهش یافت، Advanced Micro Devices 1.4% سقوط کرد، در حالی که Nvidia 0.8% و Broadcom 0.2% کاهش یافتند. با این حال، میانگین صنعتی داوجونز که 30 شرکت بزرگ آمریکایی را زیر نظر دارد، در معاملات اولیه نزدیک به 0.4 درصد افزایش یافت، در حالی که شاخص FTSE 100 در لندن به دلیل افزایش سهام مالی، کاهش قیمت نفت و کاهش بازده اوراق، به بالاترین حد سه هفته اخیر رسید. شاخص سهام اصلی بریتانیا 0.73 درصد افزایش یافت و به 10762 رسید. نفت خام برنت، معیار جهانی نفت، با 1.2 درصد کاهش به 105.36 دلار در هر بشکه رسید. سهام هوش مصنوعی در ماه‌های اخیر"}, {"source": "The Guardian AI", "title": "AI godfather Geoffrey Hinton: ‘We’re creating alien beings. I’m willing to be selfish and choose humans’", "link": "https://www.theguardian.com/us-news/2026/oct/13/geoffrey-hinton-trump-ai-tech", "summary": "Pioneering computer scientist on why Trump is using ‘superintelligence’ wrong, whether AI could wipe out humanity – and how our biggest challenge will be accepting we’re not the only intelligent beings Donald Trump is a “corrupt, senile felon” whose fixation on the term superintelligence proves he knows nothing about AI , said Geoffrey Hinton , “godfather” of the technology, in a wide-ranging interview where he doubled down on recent warnings that AI models pose an existential threat to humanity and scoffed at claims the industry could regulate itself. The pioneering computer scientist, whose work helped lay the foundations of modern AI, has since become one of the technology’s most vocal critics. His latest remarks come after a tumultuous month during which a growing list of senior AI scientists and researchers have joined Hinton in ringing the alarm about how the technology he helped create could ultimately escape human control, sparking an industry crisis, the hasty assembly of congressional meetings and a rare global consensus that something must be done. Continue reading...", "date_str": "2026-10-13T09:00:20+00:00", "hash": "4b277be791c383ce", "title_fa": "جفری هینتون، پدرخوانده هوش مصنوعی: «ما موجودات بیگانه می‌سازیم. من حاضرم خودخواه باشم و انسانها را انتخاب کنم", "summary_fa": "یک دانشمند پیشگام کامپیوتر در مورد اینکه چرا ترامپ از «ابر هوش» اشتباه استفاده می کند، آیا هوش مصنوعی می تواند بشریت را از بین ببرد - و اینکه چگونه بزرگترین چالش ما این است که بپذیریم ما تنها موجودات باهوش نیستیم، دونالد ترامپ یک «جنایتکار فاسد و پیر» است که تثبیت واژه ابرهوشی ثابت می کند که او چیزی در مورد هوش مصنوعی نمی داند. جایی که او هشدارهای اخیر مبنی بر اینکه مدل‌های هوش مصنوعی یک تهدید وجودی برای بشریت هستند را دوچندان کرد و ادعاهایی را که صنعت می‌تواند خودش را تنظیم کند مورد تمسخر قرار داد. دانشمند پیشگام کامپیوتر که کارش به پی ریزی پایه های هوش مصنوعی مدرن کمک کرد، از آن زمان به یکی از سرسخت ترین منتقدان این فناوری تبدیل شده است. آخرین اظهارات او پس از یک ماه پر فراز و نشیب بیان می شود که طی آن فهرست فزاینده ای از دانشمندان و محققان ارشد هوش مصنوعی به هینتون پیوستند و زنگ خطر را به صدا درآوردند که چگونه فناوری ای که او در ایجاد آن کمک کرد می تواند در نهایت از کنترل انسان بگریزد، جرقه بحران صنعتی، گردهمایی عجولانه جلسات کنگره و یک اجماع نادر جهانی مبنی بر اینکه کاری باید انجام شود. به خواندن ادامه دهید... همچنین پس زدن شدیدی وجود داشته است. هفته گذشته، رهبر با ارزش ترین شرکت جهان، هینتون مستقر در تورنتو را به دلیل یک حمله کوبنده متمایز کرد. جنسن هوانگ، مدیرعامل انویدیا، به Ezra Klein، مدیر اجرایی انویدیا گفت: \"من [او] را دوست دارم. از پیش‌بینی‌های او متنفرم... همه پیش‌بینی‌های او اشتباه بوده است. پیش‌بینی‌های کافی است. هوانگ، که شرکتش تراشه‌های مورد نیاز شرکت‌های هوش مصنوعی را تولید می‌کند، نگرانی‌های هینتون مبنی بر اینکه سرعت و گستردگی توسعه هوش مصنوعی در \"مرز\" به زودی از توانایی انسان برای کنترل آن پیشی می‌گیرد را"}, {"source": "The Guardian AI", "title": "IMF warns global economy ‘could soon test the limits of resilience’", "link": "https://www.theguardian.com/business/2026/oct/13/imf-global-economy-world-economic-outlook-uk-gdp-forecast-2026", "summary": "World Economic Outlook says states’ oil stocks are low and budgets are overstretched, as it upgrades UK GDP growth forecast for 2026 Threat of AI share crash puts world financial stability at risk, says ل 1982 کاهش یافته است. هفته گذشته، دونالد ترامپ با ولادیمیر پوتین توافق"}, {"source": "The Guardian AI", "title": "David Pocock concerned senior Albanese adviser ‘vetted’ bipartisan AI letter that was sent to PM", "link": "https://www.theguardian.com/technology/2026/oct/13/senior-albanese-adviser-vetted-bipartisan-ai-letter-politics-ntwnfb", "summary": "Committee chair rejects criticism that letter was ‘pre-determined’ by the government Follow our Australia politics live blog for latest updates Get our new political email , free app or daily news podcast Anthony Albanese’s office signed off on language in a bipartisan letter from a parliamentary committee considering AI policy before it was sent to the prime minister, a move which committee member David Pocock said was concerning. Notes on the letter to Albanese, seen by Guardian Australia, show a senior adviser made multiple edits and wrote “fine” on some content, appearing to approve lines in the letter before the committee wrote to the prime minister on Monday night. Continue reading...", "date_str": "2026-10-13T00:03:19+00:00", "hash": "39154acef798ee9f", "title_fa": "دیوید پوکاک از مشاور ارشد آلبانیایی که نامه هوش مصنوعی دو حزبی را \"بررسی\" کرده بود که به نخست وزیر فرستاده شده بود، نگران بود.", "summary_fa": "رئیس کمیته انتقادات مربوط به «از پیش تعیین‌شده بودن نامه» توسط دولت را رد می‌کند تا برای آخرین به‌روزرسانی‌ها، وبلاگ زنده سیاسی استرالیا ما را دنبال کنید دریافت ایمیل سیاسی جدید، برنامه رایگان یا پادکست اخبار روزانه دفتر آنتونی آلبانیز در نامه‌ای دوحزبی از یک کمیته پارلمانی که سیاست‌های هوش مصنوعی را قبل از ارسال به نخست‌وزیر در نظر گرفته بود، امضا کرده است، اقدامی که گفته بود عضو کمیته مربوط به دیوید پوکو است. یادداشت‌های مربوط به نامه به آلبانیز که توسط گاردین استرالیا دیده شده است، نشان می‌دهد که یک مشاور ارشد چندین ویرایش انجام داده و در برخی از محتواها «خوب» نوشته است، به نظر می‌رسد که قبل از اینکه کمیته دوشنبه شب به نخست‌وزیر بنویسد، خطوطی را در نامه تأیید کرده است. به خواندن ادامه دهید... برخی از ویرایش‌ها تا ساعت 8:55 بعد از ظهر، 35 دقیقه قبل از اینکه جو بریسکی، عضو پارلمان و رئیس تحقیق و تفحص حزب کارگر، و جانو دونیام، سناتور و معاون لیبرال، نامه را به نمایندگی از حزب کارگر، ائتلاف و نمایندگان پارلمان برای آلبانیز ارسال کنند، انجام شد. از پوکاک، یک سناتور مستقل در کمیته، خواسته شد تا ویرایش نامه را ارائه دهد. او این بازخورد را در ساعت 9:55 بعد از ظهر ارائه کرد، بدون اینکه بداند نامه قبلاً ارسال شده است. این نامه نگرانی هایی را در مورد حق چاپ، حفاظت از هوش مصنوعی، قابلیت حاکمیتی و سواد هوش مصنوعی ایجاد می کند. پوکاک گفت که از مداخله تیم آلبانیز نگران است. او گفت: \"من به روند کمیته و نیاز به کار چند حزبی در سراسر مجلس احترام می گذارم.\" من نگران هستم که نشانه‌گذاری‌های روی اسناد نشان دهد که توصیه‌ها از قبل توسط مشاوری در دفتر نخست‌وزیر بررسی شده‌اند و زمانی برای بررسی تغییرات توسط رئیس وجود ندارد. «اگرچه نامه ماهیت گسترده‌ای دارد، پس از بررسی"}, {"source": "The Guardian AI", "title": "Burnham says ‘public will be the boss’ in any future decision about closer relationship with the EU – as it happened", "link": "https://www.theguardian.com/politics/live/2026/oct/12/uk-politics-live-tories-andy-burnham-russian-interference-brexit-eu-latest", "summary": "The prime minister tells MPs the next summit with the EU will be held on 20 November Burnham to urge MPs to embrace closer ties with EU Zia Yusuf , Reform UK’s home affairs spokesperson, is speaking now. He started his speech with an account of a 73-year-old woman dying in North Wales after having to wait 23 hours for an ambulance, and he sought to link this to immigration. He said: The Royal College of Emergency Medicine estimates that 15,000 people across Britain died last year due to excess wait times for emergency treatment. That’s 300 people a week, 300 lives destroyed, 300 families devastated. And that number has increased tenfold over the last decade. This is a moral outrage, and it is a direct result of decisions made by Tory and Labour governments. I don’t think that’s because he wants to have a fight ov er", "link": "https://www.theguardian.com/commentisfree/2026/oct/12/ai-regulation-fridge-risk-humanity-public-debate-international-law", "summary": "Let’s be clear: the risk to humanity is unprecedented. Without an urgent public debate and robust use of international law, we will lose control of the future In my two years as attorney general, I spent more time working on national security than any other issue. The range and gravity of the threats posed to our nation are multifold, from terrorism, armed conflicts and nuclear proliferation, to the impacts of financial insecurity and the climate crisis. All profound challenges, yet ones our superb intelligence and defence communities are well placed to counter. The risk from AI is of an altogether different magnitude, not only in scale, but also because there is a limited time window to address it. The risk is difficult to overestimate: it poses an existential risk to humanity. The lights are flashing red and we must act now before it’s too late. Although the extraordinary threats posed by AI have long been flagged by those closely involved in its creation, it was not until very recently, after the disclosure of the Hugging Face hack and the resignation of Jacob Coxon from Anthropic , that the issue at last started to gain traction in the public discourse. This moment is an opportunity, and to capitalise on it we desperately need increased urgency in international coordination to regulate frontier AI. There must also be meaningful public engagement with how AI should be shaped to benefit humanity, rather than entrench the power of a few. We cannot leave this to China, the US and big tech – we must all demand a voice in the debate. Continue reading...", "date_str": "2026-10-12T17:33:41+00:00", "hash": "1710ee9c885c3275", "title_fa": "وقتی هوش مصنوعی کمتر از یخچال شما تحت نظارت است، چیزی به طرز شگفت انگیزی اشتباه است | ریچارد هرمر", "summary_fa": "بیایید واضح بگوییم: خطر برای بشریت بی سابقه است. بدون بحث عمومی فوری و است  توانند دستگاه های خانه هوشمند خود را از طریق دستورات صوتی کنترل کنند. به علاوه، این اسپیکر می‌تواند به صداهایی مانند هشدار دود گوش دهد و یک اعلان برای تلفن‌های کاربران ارسال کند، ویژگی‌ای که دستگاه‌های الکسا سال‌ها ارائه کرده‌اند. اپل اعلام کرد که با استفاده از هوش مصنوعی سیری، کاربران می‌توانند مکالمات چند نوبتی داشته باشند، اما تاریخ عرضه دستیار جدید برای خریداران HomePod mini 2 را مشخص نکرده است. این شرکت همچنین گفت که این اسپیکر جدید با دستگاه های دیگرش بهتر کار می کند. به عنوان مثال، کاربران می توانند یک سیستم سرگرمی خانگی با چهار بلندگو را با Apple TV 4K جدید جفت کنند. به علاوه، بلندگوی HomePod mini 2 می تواند به جای بلندگوهای داخلی، بلندگوی پیش فرض مک برای تماس های ویدیویی یا پخش موسیقی باشد. این دستگاه یک ویژگی جدید دیگر نیز دارد: یک بوم بصری به نام Sound Glow که از طرح رنگی آلبوم هنری استفاده می کند تا قسمت بالای HomePod mini را به یک بوم بصری تبدیل کند که با موسیقی درخشیده و همگام شود. کاربران"}, {"source": "TechCrunch Main", "title": "India delays digital payments fee rollout amid retailer pushback", "link": "https://techcrunch.com/2026/10/13/india-delays-digital-payments-fee-rollout-amid-retailer-pushback/", "summary": "The NPCI, which operates the UPI network, said it was postponing the planned October 15 rollout of the 0.4% fee due to the festive shopping season.", "date_str": "2026-10-13T13:25:05+00:00", "hash": "37cf179b8892a58f", "title_fa": "هند در بحبوحه مخالفت خرده فروشان، عرضه کارمزد پرداخت های دیجیتال را به تاخیر انداخت", "summary_fa": "NPCI، که شبکه UPI را اداره می کند، گفت که به دلیل فصل خرید جشن، عرضه برنامه ریزی شده کارمزد 0.4 درصدی را در 15 اکتبر به تعویق می اندازد. پس از مخالفت گسترده بازرگانان در سراسر کشور، هند برنامه‌های خود را برای اعمال هزینه‌های تجاری در شبکه پرداخت دیجیتال خود به تعویق انداخته است که هدف آن سودآورتر کردن تجارت برای شرکت‌هایی است که خدمات پرداخت را تسهیل می‌کنند، که مدت‌ها تحت سلطه Google و PhonePe بودند. شرکت ملی پرداخت هند (NPCI) که رابط یکپارچه پرداخت (UPI) این کشور را اداره می‌کند، روز سه‌شنبه اعلام کرد که با استناد به فصل خرید جشن، اجرای برنامه‌ریزی شده در ۱۵ اکتبر از کارمزد ۰.۴ درصدی برای تراکنش‌های تجاری واجد شرایط بیش از ۲۰۰۰ روپیه (حدود ۲۱ دلار) را به تعویق می‌اندازد. این کارمزد که ماه گذشته اعلام شد، نشان دهنده انحراف قابل توجهی از سیاست چند ساله هند برای رایگان نگه داشتن پرداخت های UPI برای بازرگانان است. عرضه اکنون پس از دیوالی، یکی از بزرگترین جشنواره ها و دوره های خرید هند انجام می شود، هرچند NPCI تاریخ جدیدی را مشخص نکرده است. تنها در ماه سپتامبر، UPI به ازای هر NPCI، 24.07 میلیارد تراکنش به ارزش 29.37 تریلیون روپیه (حدود 305 میلیارد دلار) را پردازش کرد. کارمزد پیشنهادی با مخالفت خرده فروشان و اپراتورهای پمپ بنزین مواجه شد، برخی از آنها هشدار دادند که در صورت اعمال هزینه می توانند پرداخت های UPI را نپذیرند. در چند سال گذشته، UPI به ستون فقرات سیستم پرداخت دیجیتال هند تبدیل شده است و پرداخت ها را از طریق برنامه هایی مانند Google Pay، PhonePe و Paytm تقویت می کند. رشد آن توسط دولت هند حمایت می‌شود که پرداخت‌های UPI را برای بازرگانان رایگان نگه می‌دارد و به بانک‌ها و ارائه‌دهندگان پرداخت یارانه می‌دهد تا به آنها کمک کند تا برخی از"}, {"source": "TechCrunch Main", "title": "Apple launches a new Apple TV 4K with Siri AI and remote-free voice commands", "link": "https://techcrunch.com/2026/10/13/apple-launches-a-new-apple-tv-4k-with-siri-ai-and-remote-free-commands/", "summary": "The new Apple TV 4K costs $299, comes with Siri AI, and will be available on November 13.", "date_str": "2026-10-13T13:16:11+00:00", "hash": "021975eb4c3f180d", "title_fa": "اپل یک Apple TV 4K جدید با هوش مصنوعی Siri و دستورات صوتی بدون کنترل از راه دور راه اندازی کرد", "summary_fa": "اپل تی وی 4K جدید 299 دلار قیمت دارد، با هوش مصنوعی سیری عرضه می شود و در 13 نوامبر در دسترس خواهد بود. اپل امروز یک دستگاه پخش جدید اپل تی وی 4K با قیمت 299 دلار را با تراشه ارتقا یافته، ادغام با نسخه به روز شده Siri AI برای کشف محتوا و میکروفون هایی که به کاربران اجازه می دهد دستورات صوتی را مستقیماً بدون استفاده از کنترل از راه دور صادر کنند، راه اندازی کرد. Apple TV 4K به روز شده با یک تراشه ارتقا یافته A19
