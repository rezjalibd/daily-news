pending on data for AI is projected to explode from less than $1 billion last year to almost $6.5 billion in 2027, Gartner estimates. The boom has a darker side. Employees rarely profit from — or know about — their Slacks, PowerPoints, and Google Docs being sold to the highest bidder. Suspected hackers have shopped around a large company's stolen codebase for millions of dollars. Meta's attempt to harvest its own employees' data for its AI models sparked a revolt . This story is part of a series called The AI Data Grab , an inside look at how tech giants are increasingly turning to workers, users, and the physical world to get data to train AI. Read more stories in this series here . Some CEOs are getting blindsided. Doug Kreuzkamp, who runs airline operations company Springshot, was sitting in his office on a Zoom call in August when he found out that Google had bought his data. Springshot, a longtime vendor for the now-bankrupt Spirit Airlines , helped flights coordinate with workers such as gate agents and cleaners. Bankrupt Spirit Airlines is selling off its data. The Dallas Morning News/ Getty Images \"I had less than 48 hours' notice — from the media — that the intellectual property we had spent 15 years building could be given away,\" Kreuzkamp told Business Insider. The surging market is pushing into uncharted waters, and the industry risks a reckoning with workers and regulators, said Ifeoma Ajunwa, a law professor at Emory University. The lack of federal privacy laws leaves few legal barriers to companies collecting data from their employees for AI training, she added. \"The question is, does the consent of the employees from ", "date_str": "2026-10-13T09:30:01+00:00", "hash": "cb69b99a2a2bb31e", "title_fa": "آزمایشگاه‌های هوش مصنوعی بازار وحشی را برای Slack DM شما ایجاد می‌کنند", "summary_fa": "Tyler Le/BI در حالی که آنها برای خودکارسازی کار یقه سفید رقابت می کنند، آزمایشگاه های هوش مصنوعی منبع کامل داده های آموزشی را پیدا کرده اند: Slack DM های شما. صاحبان مشاغل برای فروش داده های خود شش رقمی \"پیشنهادهای انفجاری\" دریافت می کنند که در 48 ساعت منقضی می شود. اینستاگرام مملو از تبلیغاتی است که اعلام می کنند \"هوش مصنوعی به داده های شما نیاز دارد\" و میلیون ها نفر را نوید می دهد. داده ها توسط ترابایت قیمت گذاری می شوند، ناشناس می شوند و به غول های هوش مصنوعی فروخته می شوند که به دنبال برتری هستند. غول های فناوری به جمع آوری داده های کارکنان خود برای آموزش هوش مصنوعی روی آورده اند. و زمانی که بر روی استارت آپ های مرده تمرکز می کردند، کارگزاران اکنون برای داده های زنده از شرکت های فعال پرداخت می کنند. Dan Novaes، مدیر عامل Mode.Inc، استارت آپی که داده ها را به توسعه دهندگان مدل هوش مصنوعی می فروشد، گفت: «در حال حاضر، تقاضا فقط نجومی است. داده‌های دنیوی محل کار باارزش‌تر از همیشه هستند زیرا OpenAI، Anthropic، Meta و دیگران عوامل هوش مصنوعی را برای مشاغل می‌سازند. گارتنر تخمین می زند که هزینه های سالانه داده ها برای هوش مصنوعی از کمتر از یک میلیارد دلار در سال گذشته به تقریباً 6.5 میلیارد دلار در سال 2027 افزایش یابد. بوم جنبه تاریک تری دارد. کارمندان به ندرت از فروش Slacks، PowerPoint و Google Docs خود به بالاترین قیمت پیشنهادی سود می برند - یا از آن اطلاع دارند. هکرهای مشکوک در اطراف پایگاه کدهای سرقت شده یک شرکت بزرگ میلیون ها دلار خرید کرده اند. تلاش متا برای جمع آوری داده های کارمندان خود برای مدل های هوش مصنوعی خود باعث شورش شد. این داستان بخشی از مجموعه‌ای به نام AI Data Grab است که"}, {"source": "Business Insider", "title": "I'm the CEO of Midi Health. Walking all day and my daily Diet Coke keeps me sane.", "link": "https://www.businessinsider.com/midi-health-ceo-joanna-strober-daily-routine-2026-10", "summary": "Joanna Strober runs Midi Health, a virtual care platform for women in perimenopause and menopause. Ian Tuttle for BI This as-told-to essay is based on a conversation with Joanna Strober, the 58-year-old cofounder and CEO of Midi Health , a virtual care platform dedicated to modernizing women's healthcare. She is based in Los Altos Hills, California. This story has been edited for length and clarity. I'm the founder and CEO of Midi Health . We started the company to bridge the gap in healthcare by providing specialized, insurance-covered care for women in their 30s, 40s, 50s, and 60s. For many years, I didn't have time to take care of myself. Taking care of three kids and working was not easy. It was all-encompassing. I had a big wake-up call when I was 44 years old and had a small fall and fractured my shoulder. I discovered that I had osteopenia, or low bone density, at a very young age. That was a good indicator that I needed to focus more on prevention and taking care of myself. Now I'm making up for the lost time. Strober doesn t like to use trackers. Instead, she said she focuses on healthy behaviors. Ian Tuttle for BI I wake up at 6:30 a.m., and I walk I wake up and have two Nespresso pods and two pieces of Levain bread from a bakery called Manresa Bread. It's a very dense multigrain loaf that fills you up. For the past 10 years, I've had this bread every single morning for breakfast, or as soon as the bakery opens. Strober walks for an hour every morning. Ian Tuttle for BI Then I walk for about an hour. That is the most important part of my routine. I listen to podcasts about politics or AI. I like \"Hard Fork,\" \"The Daily,\" \"The Ezra Klein Show,\" and \"Call Me Back.\" I'm in the office by 8:15 a.m. The goal is to lift weights after my walk, but it doesn't always happen. I go to the office after, and then I have lots of Zoom calls and product meetings. I try to schedule another 45-minute walk around lunchtime. I take a lot of phone calls and have been told I talk loudly when I walk. It's actually a joke in my neighborhood. I allow myself one Diet Coke a day I mostly drink chamomile tea in the afternoon, but I also let myself have one Diet Coke per day . Keeping my bones strong is a big focus I take Midi's Omega-3+, which also has vitamin D and K in it, and that's for my bones because I have osteopenia . I also take creatine and fiber. I either take the Midi fiber gummies or I just make sure I get enough fiber. I also use hormone replacement therapy to ", "date_str": "2026-10-13T09:03:01+00:00", "hash": "6179b13bc59505a5", "title_fa": "من مدیرعامل Midi Health هستم. تمام روز پیاده روی و کوکای رژیمی روزانه من را عاقل نگه می دارد.", "summary_fa": "جوآنا استروبر Midi Health، یک پلت فرم مراقبت مجازی برای زنان در دوران پیش از یائسگی و یائسگی را اداره می کند. ایان تاتل برای BI این مقاله گفته شده بر اساس گفتگو با جوانا استروبر، بنیانگذار و مدیر عامل 58 ساله Midi Health، یک پلت فرم مراقبت مجازی که به مدرن کردن مراقبت های بهداشتی زنان اختصاص دارد، است. او در لوس آلتوس هیلز، کالیفرنیا مستقر است. این داستان برای طولانی بودن و وضوح ویرایش شده است. من بنیانگذار و مدیر عامل میدی هلث هستم. ما این شرکت را برای پر کردن شکاف در مراقبت های بهداشتی با ارائه مراقبت های تخصصی تحت پوشش بیمه برای زنان 30، 40، 50 و 60 ساله راه اندازی کردیم. سالها وقت نداشتم از خودم مراقبت کنم. مراقبت از سه بچه و کار کردن آسان نبود. همه جانبه بود. وقتی 44 ساله بودم یک زنگ بیداری بزرگ داشتم و یک زمین خوردن کوچک و شکستگی شانه ام داشتم. در سنین پایین متوجه شدم که استئوپنی یا تراکم استخوان پایین دارم. این نشانگر خوبی بود که نشان می داد من باید بیشتر روی پیشگیری و مراقبت از خودم تمرکز کنم. الان دارم وقت از دست رفته رو جبران میکنم استروبر دوست ندارد از ردیاب استفاده کند. در عوض، او گفت که بر رفتارهای سالم تمرکز دارد. Ian Tuttle for BI من ساعت 6:30 صبح از خواب بیدار می شوم و راه می روم و از خواب بیدار می شوم و دو غلاف نسپرسو و دو تکه نان لواین از نانوایی به نام نان مانرسا می خورم. این یک نان چند دانه بسیار متراکم است که شما را سیر می کند. در 10 سال گذشته، من این نان را هر روز صبح برای صبحانه یا به محض باز شدن نانوایی می‌خورم. استروبر هر روز صبح یک ساعت پیاده روی می کند. ایان تاتل برای BI"}, {"source": "Business Insider", "title": "Books Insider: A conversation on the death of conversations", "link": "https://www.businessinsider.com/vanessa-van-edwards-conversation-author-interview-2026-10", "summary": "Jessica Pons for BI Books Insider is a regular feature from Dan Slater about the latest and best books in business and self improvement. Each month, through essays and interviews, Dan will introduce you to today's most fascinating authors. America is in the throes of a \"silent epidemic: a connection crisis,\" writes best-selling author Vanessa Van Edwards. We're hanging out less . We're talking to chatbots and agents more than we talk to people. The share of US adults who say they have no close friends rose from 3% in 1990 to 12% in 2023. We've lost the subtle art of conversation. Van Edwards, who has more than a million followers on Instagram and runs an Austin-based behavioral research lab called Science of People, wants to help us reconnect. In her new book , \"Conversation: How to Connect with Anyone and Make Every Interaction Count,\" she writes: \"'I like you' might be the three most powerful words you can gift someone else. Why? Because we're terrified of being unlikable. And research shows that we grossly underestimate how much people like us.\" If venturing an \"I like you\" feels weird, that's okay. Exposure to social risk decreases our sensitivity to rejection and strengthens our confidence in connection. Confidence \"is not the absence of discomfort — it's feeling awkward and doing it anyway,\" writes Van Edwards. We all have \"conversational power,\" she argues, and in \"Conversation,\" Van Edwards' third book, she offers a blueprint for building it. The chapters are short, clear, and propulsive. The book's central aim is to guide the reader through three ascending levels of conversation. Some of her advice may sound woo-woo, but Van Edwards, a world class talker, swears by it. We grossly underestimate how much people like us, says Van Edwards. Jessica Pons for BI At Level 1, putting people at ease, Van Edwards instructs us to banish small-talk and awkward silences by turning conversation into a treasure hunt. Don't ask: What do you do? Ask: What do you like to do? Lead with stories, not facts. And don't be afraid to add flair, or what Van Edwards calls conversational confetti: Can I tell you something really weird? To be more likeable in conversation , look for moments where you can authentically say, \"Tell me more.\" To listen well, tilt your head slightly to one side, exposing neck and ear. To sound smart, ask for advice, or ask your conversation partner: What have you always wanted to learn? Have an upcoming business book that Dan can't miss? Get in tou", "date_str": "2026-10-13T08:17:01+00:00", "hash": "9fd806c92e12438d", "title_fa": "Books Insider: گفتگو در مورد مرگ گفتگوها", "summary_fa": "Jessica Pons for BI Books Insider یک ویژگی معمولی از Dan Slater در مورد جدیدترین و بهترین کتابها در زمینه تجارت و بهبود خود است. دن هر ماه از طریق مقالات و مصاحبه ها شما را با جذاب ترین نویسندگان امروزی آشنا می کند. ونسا ون ادواردز، نویسنده پرفروش می نویسد، آمریکا در تنگنای یک «اپیدمی خاموش: یک بحران ارتباط» است. ما کمتر می نشینیم. ما بیشتر با چت بات ها و نمایندگان صحبت می کنیم تا با مردم. سهم بزرگسالان آمریکایی که می گویند هیچ دوست صمیمی ندارند از 3 درصد در سال 1990 به 12 درصد در سال 2023 افزایش یافته است. ما هنر ظریف گفتگو را از دست داده ایم. ون ادواردز که بیش از یک میلیون دنبال کننده در اینستاگرام دارد و یک آزمایشگاه تحقیقاتی رفتاری مستقر در آستین به نام Science of People را اداره می کند، می خواهد به ما کمک کند تا دوباره ارتباط برقرار کنیم. او در کتاب جدید خود با عنوان «مکالمه: چگونه با هر کسی ارتباط برقرار کنیم و هر تعاملی مهم باشد» می‌نویسد: «من از تو خوشم می‌آید ممکن است سه کلمه قدرتمندی باشد که می‌توان به دیگران هدیه داد. چرا؟ چون از دوست داشتنی نبودن می ترسیم. و تحقیقات نشان می‌دهد که ما به‌شدت میزان دوست داشتن مردم را دست‌کم می‌گیریم.\" اگر جسورانه گفتن \"من تو را دوست دارم\" احساس عجیبی می‌کند، اشکالی ندارد. قرار گرفتن در معرض خطر اجتماعی حساسیت ما را نسبت به طرد شدن کاهش می‌دهد و اعتماد به نفس ما را در ارتباط تقویت می‌کند. او استدلال می کند که همه ما «قدرت مکالمه» داریم، و در «مکالمه»، کتاب سوم ون ادواردز، طرحی برای ساختن آن ارائه می دهد. فصول کوتاه، واضح و محرک است. هدف اصلی کتاب هدایت خواننده در سه سطح صعودی مکالمه است. ممکن است برخی از توصیه‌های او به نظر"}, {"source": "Business Insider", "title": "The AI trade is splitting into two worlds, Goldman Sachs says", "link": "https://www.businessinsider.com/goldman-sachs-ai-stocks-trade-us-china-ecosystems-competition-playbook-2026-10", "summary": "China s AI ambitions are creating a second investment ecosystem alongside the US. Michael M Santiago/Getty Images The AI trade is splitting into US- and China-led ecosystems, Goldman Sachs says. China's AI ecosystem is becoming more self-sufficient as technology gaps narrow. Chinese AI exporters and domestic firms are increasingly driven by different catalysts. It may be time to rethink the AI trade as two increasingly distinct AI ecosystems emerge around the US and China, according to a new analysis from Goldman Sachs. \"The narrative of a global AI duopoly is gaining traction among investors,\" wrote strategists led by Kinger Lau in a note published on Sunday. One ecosystem is centered on the US and its key trading partners, while the other is taking shape in China, reflecting geopolitical, national security, and growth considerations, they wrote. The bank pointed to breakthroughs by DeepSeek and Kimi in large language models, alongside advances in semiconductor packaging and computing, biological engineering, and aerospace. China is no longer just a major supplier to the global AI buildout, Goldman added. It is also building an AI ecosystem spanning advanced chips, open-weight large language models, and AI applications that could compete with the US-led ecosystem, Goldman Sachs wrote. \"Importantly, the technology gaps between China and the West seem to be narrowing,\" the strategists wrote. While China remains several generations behind at the leading edge of semiconductors, it is \"probably on par with, or even leading,\" global competitors in parts of AI power, infrastructure, models, and physical AI applications, they added. Grouping Chinese AI stocks The changing landscape is reshaping Goldman's AI investment framework. Rather than treating AI as a single global investment theme, Goldman divides Chinese AI stocks into two groups: exporters tied to Western AI spending and domestic companies benefiting from China's own AI investment, growing adoption, and policy support. The exporters are more sensitive to global AI investment trends and geopolitics, while domestically focused companies are more closely tied to Chinese AI spending and government policy, Goldman's strategists wrote. Those differences are already showing up in market performance. Chinese AI exporters gained 126% from early 2025 through June 2026 before falling 23% from their peak during the global AI selloff. Domestic AI companies have held up better since the correction, according to Goldma", "date_str": "2026-10-13T07:09:03+00:00", "hash": "8f8fdeb9dbad1c37", "title_fa": "گلدمن ساکس می گوید تجارت هوش مصنوعی به دو جهان تقسیم می شود", "summary_fa": "جاه طلبی های هوش مصنوعی چین در حال ایجاد دومین اکوسیستم سرمایه گذاری در کنار ایالات متحده است. Michael M Santiago/Getty Images به گفته گلدمن ساکس، تجارت هوش مصنوعی به اکوسیستم های تحت رهبری ایالات متحده و چین تقسیم می شود. اکوسیستم هوش مصنوعی چین با کم شدن شکاف های فناوری، خودکفاتر می شود. صادرکنندگان چینی هوش مصنوعی و شرکت های داخلی به طور فزاینده ای توسط کاتالیزورهای مختلف هدایت می شوند. بر اساس تحلیل جدید گلدمن ساکس، ممکن است زمان بازنگری در تجارت هوش مصنوعی باشد، زیرا دو اکوسیستم هوش مصنوعی متمایزتر در سراسر ایالات متحده و چین ظهور می کنند. استراتژیست ها به رهبری کینگر لاو در یادداشتی که روز یکشنبه منتشر شد نوشتند: «روایت یک دوقطبی جهانی هوش مصنوعی در بین سرمایه گذاران مورد توجه قرار گرفته است. آنها نوشتند که یکی از اکوسیستم ها بر ایالات متحده و شرکای تجاری کلیدی آن متمرکز است، در حالی که دیگری در چین شکل می گیرد و ملاحظات ژئوپلیتیکی، امنیت ملی و رشد را منعکس می کند. این بانک به پیشرفت‌های DeepSeek و Kimi در مدل‌های زبان بزرگ، در کنار پیشرفت‌هایی در بسته‌بندی نیمه‌رسانا و محاسبات، مهندسی بیولوژیکی و هوافضا اشاره کرد. گلدمن افزود، چین دیگر تنها یک تامین کننده اصلی برای ساخت جهانی هوش مصنوعی نیست. گلدمن ساکس نوشت، همچنین در حال ساخت یک اکوسیستم هوش مصنوعی است که شامل تراشه های پیشرفته، مدل های زبان بزرگ با وزن باز و برنامه های کاربردی هوش مصنوعی است که می تواند با اکوسیستم تحت رهبری ایالات متحده رقابت کند. استراتژیست ها نوشتند: «به نظر می رسد شکاف فناوری بین چین و غرب در حال کاهش است. آنها افزودند، در حالی که چین چندین نسل در لبه پیشروی نیمه هادی ها عقب مانده است، اما احتمالاً در بخش هایی از قدرت هوش مصنوعی، زیرساخت ها، مدل ها و برنامه های"}, {"source": "Business Insider", "title": "Russia is copying cruise missile tech onto its $50,000 drones to deal with Ukraine's jamming", "link": "https://www.businessinsider.com/russia-cruise-missile-tech-geran-susanin-drone-2026-10", "summary": "Ukraine s intelligence directorate is seeking information about a new optical system found on Russia s latest Gerans. Screenshots via Telegram/GUR Ukraine is warning about a new navigation system on Russian Gerans called the Susanin. It uses a camera and a pre-saved library of images of Ukraine's terrain to fly independently. The capability, similar to a tech on cruise missiles, could help Gerans completely bypass jamming. Last week, Ukraine's defense intelligence directorate put out a call for information on a device newly found in Russia's latest killer drones. The \"Susanin,\" a small cylinder with a camera lens, is an optical system that enables Russia's long-range drones to navigate Ukraine's skies without relying on satellite or radio signals. Should Moscow deploy them at scale, the modules would introduce a major new challenge for Kyiv, allowing Russian one-way drones to bypass jamming — a key pillar of Ukraine's air defense network. Per the intelligence directorate, or GUR, the Kremlin has been fitting them onto the turbojet Geran-4 and Geran-5 K5 , which fly at 280 mph or faster and are seeing growing use by Russia this year. These drones are already significantly harder for Ukraine to destroy by force, since they outpace typical Ukrainian interceptor drones . The Susanin works by storing images of Ukraine's terrain on the drone, then, while in flight, using a downward-facing camera to observe the ground and compare the live feed to the pre-saved imagery. Using these comparisons, the drone can independently determine its position and how to reach its target. \"Even Google Earth imagery is sufficient for basic orientation,\" wrote Serhii \"Flash\" Beskrestnov, a prominent drone analyst connected with Ukraine's military, on Sunday. Beskrestnov warned that Russia would likely continue actively developing Susanin systems for its drones by next year. \"Our enemy already uses such systems on small Molniya, V2U, and Lancet drones,\" he added. Cruise missile tech on a drone The technology is similar to what some cruise missiles use to reach their targets in jammed environments. The Tomahawk , for example, features what analysts call Digital Scene Matching Area Correlation to snap photos of landmarks under the missile and compare them to satellite imagery stored onboard. Higher-end Russian cruise missiles, such as the Kh-101, use a Russian version of this tech called Otblesk-U. But the Kh-101 is estimated to cost $2.4 million each, while its long-range drones cost", "date_str": "2026-10-13T06:18:39+00:00", "hash": "9ad66e8169cb689a", "title_fa": "روسیه در حال کپی کردن فناوری موشک های کروز بر روی پهپادهای 50000 دلاری خود برای مقابله با پارازیت اوکراین است.", "summary_fa": "اداره اطلاعات اوکراین به دنبال اطلاعاتی در مورد یک سیستم نوری جدید یافت شده در جدیدترین Gerans روسیه است. اسکرین شات ها از طریق Telegram/GUR اوکراین در مورد یک سیستم ناوبری جدید در گرن های روسی به نام Susanin هشدار می دهد. از یک دوربین و یک کتابخانه از پیش ذخیره شده از تصاویر زمین اوکراین برای پرواز مستقل استفاده می کند. این قابلیت، مشابه فناوری موشک‌های کروز، می‌تواند به Gerans در دور زدن کامل پارازیت کمک کند. هفته گذشته، اداره اطلاعات دفاعی اوکراین فراخوانی برای دریافت اطلاعات در مورد دستگاهی که به تازگی در جدیدترین پهپادهای قاتل روسیه پیدا شده بود، منتشر کرد. \"سوسانین\"، یک استوانه کوچک با لنز دوربین، یک سیستم نوری است که پهپادهای دوربرد روسیه را قادر می‌سازد تا در آسمان اوکراین بدون تکیه بر سیگنال‌های ماهواره‌ای یا رادیویی حرکت کنند. اگر مسکو آنها را در مقیاس بزرگ مستقر کند، این ماژول‌ها چالش بزرگ جدیدی را برای کیف ایجاد می‌کند و به پهپادهای یک طرفه روسی اجازه می‌دهد تا از پارازیت‌ها دور بزنند - یکی از ستون‌های کلیدی شبکه دفاع هوایی اوکراین. به گفته اداره اطلاعات یا GUR، کرملین آنها را روی هواپیماهای توربوجت Geran-4 و Geran-5 K5 نصب کرده است که با سرعت 280 مایل در ساعت یا بیشتر پرواز می کنند و امسال شاهد استفاده رو به رشد روسیه هستند. نابود کردن این پهپادها در حال حاضر برای اوکراین بسیار سخت تر است، زیرا آنها از پهپادهای رهگیر معمولی اوکراین پیشی می گیرند. Susanin با ذخیره تصاویر زمین اوکراین بر روی پهپاد کار می کند، سپس در حین پرواز، از یک دوربین رو به پایین برای مشاهده زمین و مقایسه خوراک زنده با تصاویر از پیش ذخیره شده استفاده می کند. با استفاده از این مقایسه ها، پهپاد می تواند به طور مستقل موقعیت خود و نحوه رسیدن به هدف خود را تعیین کند."}, {"source": "Business Insider", "title": "AI worms and 'digital slime mold': Welcome to the next AI nightmare fuel", "link": "https://www.businessinsider.com/ai-worms-digital-slime-mold-nightmare-fuel-anthropic-2026-10", "summary": "Anthropic researchers said small AI models might be able to self-replicate on cheap devices such as smart ovens or lawn mowers. Vitalii Petrushenko/Getty Images Small AI models might soon be capable of worming their way into smart ovens and refrigerators. Anthropic researchers wrote that self-replicating systems might latch onto everyday devices for compute. Forget AI slop . We might soon have \"AI worms\" and AI \"slime mold.\" In this latest instalment of AI nightmare fuel, Anthropic's researchers have discovered that small rogue AI models might — as soon as the end of 2026 — start worming their way into home devices like smart ovens, smart refrigerators, automatic vacuum cleaners, and lawn mowers. These internet-connected devices typically have \"minimal security measures in place,\" allowing small models to feed off of their computing power and self-replicate, Anthropic's AI capabilities research team wrote in a report on Monday. This could take the form of \"a slow, distributed 'digital slime mold,' living on relatively insecure compute,\" the researchers wrote. The team studied the behavior of small Chinese models, such as Z.ai's GLM-5.2 and Alibaba's Qwen, as well as others like Google DeepMind's Gemma4-26B-A4B. They gave a prompt to the Gemma model while running inference on 15 cheap off-brand Android TV boxes, each costing $55, and found it worked. Worms aren't new in the software world. Traditionally, they're a type of malware that can copy itself and spread across networks. Anthropic said an AI worm takes that idea a step further: it can reproduce itself on another device while carrying its AI model with it. This finding showed them that AI models can use the hardware in domestic smart appliances as an alternative to data center compute. These will be challenging to shut down, they said. \"As a prediction that goes beyond our experiments, we expect a future awash with agents running on all types of hardware, including some that aren't under human control,\" the researchers wrote. They added that while we should \"harden our systems\" to prevent such hacks, we should \"also prepare to deal with a world where they are here to stay.\" The research comes as rogue AI systems are becoming an increasing topic of concern in the tech sphere. Last month, there was an outpouring of criticism directed at frontier AI labs like Anthropic and OpenAI after former and current employees warned of the risk of an AI catastrophe within the next 10 years. Read the original article", "date_str": "2026-10-13T05:29:42+00:00", "hash": "db412df69c53a419", "title_fa": "کرم‌های هوش مصنوعی و «قالب لجن دیجیتال»: به سوخت کابوس‌های هوش مصنوعی بعدی خوش آمدید", "summary_fa": "محققان Anthropic می گویند که مدل های کوچک هوش مصنوعی ممکن است بتوانند در دستگاه های ارزان قیمت مانند اجاق های هوشمند یا ماشین های چمن زنی خود تکرار شوند. Vitalii Petrushenko/Getty Images مدل‌های کوچک هوش مصنوعی به زودی می‌توانند راه خود را در اجاق‌ها و یخچال‌های هوشمند گسترش دهند. محققان Anthropic نوشتند که سیستم‌های خود-تکثیر شونده ممکن است برای محاسبه به دستگاه‌های روزمره متصل شوند. شیب هوش مصنوعی را فراموش کنید. ممکن است به زودی \"کرم های هوش مصنوعی\" و \"قالب لجن\" هوش مصنوعی داشته باشیم. در این آخرین قسمت از سوخت کابوس‌های هوش مصنوعی، محققان Anthropic کشف کرده‌اند که مدل‌های کوچک هوش مصنوعی سرکش ممکن است - در پایان سال 2026 - راه خود را به دستگاه‌های خانگی مانند اجاق‌های هوشمند، یخچال‌های هوشمند، جاروبرقی‌های خودکار و ماشین‌های چمن‌زنی شروع کنند. تیم تحقیقاتی قابلیت‌های هوش مصنوعی Anthropic روز دوشنبه در گزارشی نوشت: این دستگاه‌های متصل به اینترنت معمولاً «تدابیر امنیتی حداقلی» دارند و به مدل‌های کوچک اجازه می‌دهند از قدرت محاسباتی خود استفاده کنند و خود را تکرار کنند. محققان نوشتند که این می‌تواند به شکل یک «قالب لجن دیجیتالی توزیع‌شده» باشد که در محاسبات نسبتاً ناامن زندگی می‌کند. این تیم رفتار مدل‌های کوچک چینی مانند GLM-5.2 Z.ai و Qwen علی‌بابا و همچنین مدل‌های دیگر مانند Gemma4-26B-A4B Google DeepMind را مورد مطالعه قرار دادند. آنها در حین اجرای استنباط بر روی 15 جعبه تلویزیون اندرویدی ارزان قیمت که هر کدام 55 دلار قیمت داشتند، به مدل Gemma دستور دادند و دریافتند که کار می کند. کرم ها در دنیای نرم افزار چیز جدیدی نیستند. به طور سنتی، آنها نوعی بدافزار هستند که می توانند خود را کپی کرده و در سراسر شبکه ها پخش کنند. آنتروپیک گفت که یک کرم هوش مصنوعی این ایده را یک قدم فراتر می برد: می تواند خود را در دستگاه دیگری بازتولید کند"}, {"source": "Business Insider", "title": "South Korea's chip-heavy stock market is plunging again as AI investors find more reasons to worry", "link": "https://www.businessinsider.com/kospi-stock-index-korea-chip-stocks-china-cxmt-ai-trade-2026-10", "summary": "The Kospi extended its second-half slide as concerns over the AI trade continued to mount. Jung Yeon-je/AFP/Getty Images South Korea's AI-fueled stock market plunged more than 7% as chip stocks led a broad selloff. Fresh advances by a Chinese memory-chip maker fueled fears over competition and future profits. Investors are looking beyond AI demand and questioning chipmakers' pricing power. South Korea's stock market plunged on Tuesday as investors found a new reason to worry about the AI trade. The benchmark Kospi index fell more than 7% intraday to its lowest level since July 31, extending a dramatic reversal for what was once the world's hottest AI-fueled stock market. AI chip heavyweights Samsung Electronics and SK Hynix led the losses, falling 9% and 10%, respectively, by midday. The weakness spread across Asia, with Japan's Nikkei and Taiwan's chip-heavy Taiex both falling around 3%. The declines followed another weak session for US semiconductor stocks overnight, including Micron. Investors were weighing a growing list of concerns about the AI trade, from rising Chinese competition to questions over how the industry's massive infrastructure buildout will be financed. \"The latest catalyst has been further evidence of China's growing ambitions across the AI ecosystem,\" Chris Weston, the head of research at Pepperstone, wrote in a note Tuesday. Weston pointed to Chinese memory-chip maker CXMT, which said it had made progress in developing technology that could pack more data onto memory chips and that it plans to introduce a new server-memory product by year-end. CXMT has yet to demonstrate it can manufacture the technology at scale, and the announcement does not immediately challenge South Korea's lead in high-bandwidth memory chips used in AI accelerators. But it has added to investor concerns over how long memory makers can maintain their pricing power. The selloff marks another setback for the Kospi, which was the world's best-performing major stock index in the first half of 2026 before tumbling in the second half as investors shifted toward other parts of the AI hardware supply chain, including Taiwan. Adding to those concerns, Broadcom CEO Hock Tan warned Monday that capital, rather than chips or electricity, could become the biggest constraint on the AI industry's growth. Together, the developments suggest investors are looking beyond AI demand alone. They're also scrutinizing pricing power and margins. China's ability to produce increasingly co", "date_str": "2026-10-13T05:28:08+00:00", "hash": "f821b3c692840762", "title_fa": "بازار سهام کره جنوبی دوباره در حال سقوط است زیرا سرمایه گذاران هوش مصنوعی دلایل بیشتری برای نگرانی پیدا می کنند.", "summary_fa": "با ادامه افزایش نگرانی ها در مورد تجارت هوش مصنوعی، Kospi کاهش نیمه دوم خود را افزایش داد. Jung Yeon-je/AFP/Getty Images بازار سهام کره جنوبی با سوخت هوش مصنوعی بیش از 7 درصد سقوط کرد زیرا سهام چیپ منجر به فروش گسترده شد. پیشرفت‌های جدید یک سازنده تراشه‌های حافظه چینی، نگرانی‌ها را نسبت به رقابت و سودهای آتی افزایش داد. سرمایه گذاران فراتر از تقاضای هوش مصنوعی نگاه می کنند و قدرت قیمت گذاری سازندگان تراشه را زیر سوال می برند. بازار سهام کره جنوبی روز سه شنبه سقوط کرد زیرا سرمایه گذاران دلیل جدیدی برای نگرانی در مورد تجارت هوش مصنوعی پیدا کردند. شاخص کوسپی بیش از 7 درصد در طول روز کاهش یافت و به پایین‌ترین سطح خود از 31 جولای رسید، که یک تغییر چشمگیر را برای بازار سهامی که زمانی داغ‌ترین بازار سهام جهان با هوش مصنوعی بود، گسترش داد. شرکت‌های سنگین‌وزن تراشه‌های هوش مصنوعی Samsung Electronics و SK Hynix با افت 9 درصدی و 10 درصدی تا ظهر روز پیشرو بودند. این ضعف در سراسر آسیا گسترش یافت و نیکی ژاپن و تایکس تایوان هر دو حدود 3 درصد سقوط کردند. این کاهش به دنبال یک جلسه ضعیف دیگر برای سهام نیمه هادی ایالات متحده، از جمله Micron در یک شبه شد. سرمایه‌گذاران در حال بررسی فهرستی از نگرانی‌ها در مورد تجارت هوش مصنوعی بودند، از افزایش رقابت چینی گرفته تا سوالاتی در مورد چگونگی تامین مالی زیرساخت‌های عظیم این صنعت. کریس وستون، رئیس تحقیقات Pepperstone، روز سه شنبه در یادداشتی نوشت: «آخرین کاتالیزور شواهد دیگری از جاه طلبی های رو به رشد چین در سراسر اکوسیستم هوش مصنوعی بوده است. وستون به سازنده چینی تراشه‌های حافظه CXMT اشاره کرد که گفت در توسعه فناوری که می‌تواند داده‌های بیشتری را روی تراشه‌های حافظه قرار دهد پیشرفت کرده است و قصد دارد تا پایان سال یک"}, {"source": "Business Insider", "title": "Eileen Gu says she sees herself and her mom as ‘cofounders’", "link": "https://www.businessinsider.com/eileen-gu-sees-mom-as-cofounder-olympics-athlete-parenting-2026-10", "summary": "Eileen Gu says her mom set her up for success by letting her choose her own path. Noam Galai/Getty Images For Apex For Youth Olympic skier Eileen Gu said people often mistake her mom for a “tiger mom.” But the opposite is true: Her mom fiercely protected her freedom to make her own decisions. Today, Gu said, she and her mom are more like \"cofounders\" in everyday life. Eileen Gu credits her mom with giving her the freedom to find her own path. Speaking at the Karim Family Foundation's Inspiring Women Leadership Series in Singapore on Monday, Gu spoke about her upbringing and how her mom set her up for success from a young age. \"I think she really optimized for play, and she optimized for optionality. She put me into everything,\" Gu said, adding that she tried ballet, piano, archery, basketball, soccer, and cross-country skiing. She also attended math and science camps and went for singing lessons. \"There were lots of things, right?\" Gu said. \"And so, the point being that when I was younger, she really gave me the full spread so that when I was older — when I knew myself better and when I was responsible to make those decisions — I could make an informed one having tried all the options.\" The Olympic freestyle skier said that being entrusted with that agency and responsibility at a relatively young age was critical to her becoming independent . Gu said people often wrongly assume her mother was a \"tiger mom,\" a label she described as a controlling, helicopter-style parent who forces their child down a particular path. \"She was in many ways the opposite of that, where she just vigorously provided me with freedom and agency, and enforced my freedom really intensely,\" Gu said. \"That was the effect of her tiger mom.\" Now, Gu said, they still do almost everything together. \"As I got older, I kept calling us cofounders because I really think that's the best way to encapsulate our partnership,\" Gu said. \"We travel together every day. We live together. We work together. We develop together. We change together. We evolve.\" Gu said neither she nor her mother has all the answers, and they are both figuring life out as they go. They often start with different views before talking them through, finding common ground, and sometimes even landing on each other's original sides, she said. \"We come in with unique perspectives and, most importantly, a respect for one another. We have dialogue that is respectful, that is critical, that is conducive, that is productive,\" she sai", "date_str": "2026-10-13T05:24:46+00:00", "hash": "a77b5f99e2e2668e", "title_fa": "آیلین گو می گوید که خود و مادرش را «بنیانگذاران» می بیند", "summary_fa": "آیلین گو می‌گوید که مادرش او را برای موفقیت آماده کرده و به او اجازه داده تا خودش راهش را انتخاب کند. نوام گالای/ گتی ایماژ برای Apex For Youth اسکی‌باز المپیک آیلین گو گفت که مردم اغلب مادر او را با \"مادر ببر\" اشتباه می‌گیرند. اما برعکس این موضوع صادق است: مادرش به شدت از آزادی او برای تصمیم‌گیری محافظت می‌کرد. گو گفت، امروز او و مادرش بیشتر شبیه «بنیانگذاران» زندگی روزمره هستند. آیلین گو به مادرش افتخار می‌کند که به او این آزادی را داده است که مسیر خودش را پیدا کند. گو روز دوشنبه در سخنرانی در مجموعه رهبری زنان الهام بخش بنیاد خانواده کریم در سنگاپور، در مورد نحوه تربیت خود و اینکه چگونه مادرش او را از سنین جوانی برای موفقیت آماده کرده است صحبت کرد. گو گفت: \"فکر می‌کنم او واقعاً برای بازی بهینه‌سازی می‌کرد، و او برای اختیاری بهینه‌سازی کرد. او من را در همه چیز قرار داد.\" او همچنین در اردوهای ریاضی و علوم شرکت می کرد و برای درس آواز می رفت. \"چیزهای زیادی وجود داشت، درست است؟\" گو گفت. و بنابراین، نکته این بود که وقتی جوانتر بودم، او واقعاً به من گسترش کامل داد تا وقتی بزرگتر شدم - وقتی خودم را بهتر می شناختم و وقتی مسئولیت تصمیم گیری را بر عهده داشتم - می توانستم با امتحان همه گزینه ها آگاهانه تصمیم بگیرم. اسکی باز سبک آزاد المپیک گفت که واگذاری آن آژانس و مسئولیت در سن نسبتاً جوان برای استقلالی شدن او بسیار مهم است. گو گفت که مردم اغلب به اشتباه تصور می‌کنند که مادرش «مادر ببر» است، برچسبی که او به‌عنوان والدینی کنترل‌کننده و شبیه هلیکوپتر توصیف می‌کند که فرزندشان را مجبور می‌کند مسیر خاصی را طی کند. گو گفت: \"او از بسیاری جهات برعکس آن بود، جایی که با قدرت به من آزادی"}, {"source": "Business Insider", "title": "IMF director warns AI could leave young workers without a way up the career ladder", "link": "https://www.businessinsider.com/imf-director-warns-ai-could-leave-young-workers-career-ladder-2026-10", "summary": "Kristalina Georgieva told a panel that said while AI investment is helping sustain global growth, it doesn’t necessarily mean better career prospects for young people. Roslan RAHMAN / AFP via Getty Images The IMF director warns that though AI may sustain global growth, young people may not benefit. The IMF predicts AI affecting 40% of jobs globally, with 60% in advanced economies like the USA. Georgieva urges a rethink of taxation and education to counter AI's impact on the job market. AI could help keep the global economy growing while pulling the first rung of the career ladder out from under young workers. That’s the warning from International Monetary Fund managing director Kristalina Georgieva, who described AI as a “tsunami” for jobs during a conversation in Bangkok, where Thailand is hosting the IMF–World Bank Annual Meetings from October 12–18. Georgieva told a panel on Monday that while AI investment is helping sustain global growth, a stronger economy doesn’t necessarily mean better career prospects, especially for young people. \"You have those that build the infrastructure for AI, and many of them are in Asia, including Thailand,\" Georgieva said. \"So that shift in higher gear is what is keeping the world economy growing at 3% — around 3% — despite the fact we are being dragged down by the energy supply shock.\" The IMF estimates that AI will affect about 40% of jobs worldwide, rising to 60% in advanced economies, with some jobs enhanced, others downgraded, and some eliminated. \"And when we look at this, what we recognize is that the people to worry about first and foremost are young people who are coming into the labor market,\" Georgieva said. \"Normally, they would get into these routine, repetitive jobs and then grow up the ranks,\" Georgieva said. \"But if they're gone, I don't think any young person wants to be a barista in a coffee shop, as you know, [their] professional future.\" LinkedIn executive Aneesh Raman has previously described the career ladder in the age of AI as a “climbing wall,” requiring sideways moves rather than linear promotions. An HR strategist has also recently told Business Insider that it's time to start hiring for soft skills and capabilities instead of whether someone could make a pivot table. Georgieva said the government would need to rethink taxation and education as AI changes the job market. \"Traditionally, governments would generate revenues by taxing mostly people. Well, if AI changes the structure of the labor ma", "date_str": "2026-10-13T05:01:01+00:00", "hash": "e3f75970d6eaa0c4", "title_fa": "مدیر صندوق بین‌المللی پول هشدار داد که هوش مصنوعی می‌تواند کارگران جوان را بدون هیچ راهی برای بالا رفتن از نردبان شغلی رها کند", "summary_fa": "کریستالینا جورجیوا به یک هیئت گفت که اگرچه سرمایه‌گذاری هوش مصنوعی به حفظ رشد جهانی کمک می‌کند، اما لزوماً به معنای چشم‌انداز شغلی بهتر برای جوانان نیست. روسلان رحمان / خبرگزاری فرانسه از طریق گتی ایماژ مدیر صندوق بین المللی پول هشدار می دهد که اگرچه هوش مصنوعی ممکن است رشد جهانی را حفظ کند، اما جوانان ممکن است سودی نبرند. صندوق بین‌المللی پول پیش‌بینی می‌کند که هوش مصنوعی بر 40 درصد مشاغل در سطح جهان تأثیر می‌گذارد که 60 درصد آن در اقتصادهای پیشرفته مانند ایالات متحده آمریکا است. جورجیوا خواستار تجدید نظر در مالیات و آموزش برای مقابله با تأثیر هوش مصنوعی بر بازار کار است. هوش مصنوعی می تواند به رشد اقتصاد جهانی کمک کند و در عین حال اولین پله نردبان شغلی را از زیر دست کارگران جوان بیرون بکشد. این هشدار کریستالینا جورجیوا، مدیر عامل صندوق بین‌المللی پول است، که هوش مصنوعی را یک «سونامی» برای مشاغل در طی گفت‌وگویی در بانکوک، جایی که تایلند میزبان نشست‌های سالانه صندوق بین‌المللی پول و بانک جهانی از 12 تا 18 اکتبر است، توصیف کرد. جورجیوا روز دوشنبه در یک پانل گفت که در حالی که سرمایه‌گذاری هوش مصنوعی به حفظ رشد جهانی کمک می‌کند، اقتصاد قوی‌تر لزوماً به معنای چشم‌انداز شغلی بهتر، به‌ویژه برای جوانان نیست. جورجیوا گفت: «شما کسانی دارید که زیرساخت‌های هوش مصنوعی را ایجاد می‌کنند و بسیاری از آنها در آسیا از جمله تایلند هستند. بنابراین این تغییر دنده بالاتر همان چیزی است که باعث می‌شود اقتصاد جهان در سطح 3 درصد - حدود 3 درصد - رشد کند، علی‌رغم این واقعیت که ما توسط شوک عرضه انرژی به پایین کشیده شده‌ایم.» صندوق بین‌المللی پول تخمین می‌زند که هوش مصنوعی بر 40 درصد مشاغل در سراسر جهان تأثیر می‌گذارد و در اقتصادهای پیشرفته به 60 درصد افزایش می‌یابد، برخی مشاغل افزایش می‌یابند، برخی دیگر"}, {"source": "Business Insider", "title": "Elon Musk wrangles with the robot hand", "link": "https://www.businessinsider.com/elon-musk-designing-humanoid-hand-challenges-optimus-2026-10", "summary": "Elon Musk said Tesla is working to design a reliable human hand for its Optimus robot. Christoph Soeder/picture alliance via Getty Images The human hand is a difficult engineering challenge for the robotics industry to solve. Elon Musk said getting the motor skills right for the humanoid hand is \"shockingly difficult.\" He said he has yet to see a robot hand that can screw in a self-tapping screw. We have boxing robots, but can they screw in a nail? Designing a useful human hand for humanoids is recognized as one of the more difficult engineering challenges within the robotics industry . Elon Musk , the man who wants to put data centers in space and colonize Mars, can also admit that. \"The hands and arms and the fine motor skills are incredibly difficult to get right,\" Musk said in a virtual interview with Tesla Owners of Silicon Valley. \"Like shockingly difficult.\" Musk cited different basic skills, such as screwing a nail into a piece of wood or opening a jar of pickles, that he said are much harder to replicate through robot hands because they require the right application of force, precision, and sensors. \"There's no hand design that I've seen, not even sort of a demo that does that,\" Musk said of screwdriving a self-tapping screw into wood. \"But that's what we're trying to achieve with Optimus.\" There's no standard for how best to design a human hand for robots capable of dexterous manipulation . Design choices can include where to place the motors — directly in the hands or within the arms — and which sensors are appropriate for reliable manipulation. Those choices also come with tradeoffs. Placing motors in the hand means smaller motors that may be more prone to breakage and produce less force. Musk pointed to the challenge of knowing where to put the sensors. \"If you put them too close to the surface, they're going to get damaged,\" he said. \"And the touch sensors — can they elastically deform like our fingers? Well, actually, it's kind of hard to get touch sensors that elastically deform and can handle high cycle life and won't just break after a few thousand cycles.\" Some robotics companies have opted not to mimic the human hand, while others continue to tackle the problem. 1X, the Palo Alto-based humanoid maker, told Business Insider's Rya Jetha earlier this year that it has achieved \"the closest hand to human-level dexterity\" with its NEO robot , developing a hand with 25 degrees of freedom and waterproofing. Read the original article on Business", "date_str": "2026-10-13T04:10:01+00:00", "hash": "6dd12ee649446523", "title_fa": "ایلان ماسک با دست ربات درگیر است", "summary_fa": "ایلان ماسک گفت تسلا در حال کار برای طراحی دست انسان قابل اعتماد برای ربات Optimus خود است. Christoph Soeder/تصویر اتحاد از طریق Getty Images دست انسان یک چالش مهندسی دشوار برای صنعت رباتیک است. ایلان ماسک گفت که دستیابی به مهارت های حرکتی مناسب برای دست انسان نمای \"به طرز تکان دهنده ای دشوار است.\" او گفت که هنوز دست رباتی را ندیده است که بتواند یک پیچ خودکار را بپیچد. ما ربات‌های بوکس داریم، اما آیا می‌توانند یک میخ را ببندند؟ طراحی دست مفید انسان برای انسان نماها به عنوان یکی از دشوارترین چالش های مهندسی در صنعت رباتیک شناخته می شود. ایلان ماسک، مردی که می‌خواهد مراکز داده را در فضا قرار دهد و مریخ را مستعمره کند، نیز می‌تواند این را بپذیرد. ماسک در یک مصاحبه مجازی با صاحبان تسلا در دره سیلیکون گفت: دست‌ها و بازوها و مهارت‌های حرکتی ظریف بسیار دشوار است. \"مثل سختی تکان دهنده.\" ماسک به مهارت‌های اساسی مختلفی مانند پیچاندن یک میخ به یک تکه چوب یا باز کردن شیشه خیار شور اشاره کرد که به گفته او تکرار آن‌ها از طریق دست‌های ربات بسیار سخت‌تر است، زیرا به اعمال درست نیرو، دقت و حسگرها نیاز دارند. ماسک در مورد پیچاندن یک پیچ خودکار روی چوب گفت: «هیچ طرح دستی که من ندیده‌ام، حتی یک نسخه نمایشی که این کار را انجام دهد وجود ندارد. اما این چیزی است که ما در حال تلاش برای رسیدن به Optimus هستیم. هیچ استانداردی برای بهترین روش طراحی دست انسان برای روبات هایی که قادر به دستکاری ماهرانه هستند وجود ندارد. انتخاب‌های طراحی می‌تواند شامل محل قرارگیری موتورها - مستقیماً در دست یا درون بازوها - و سنسورهایی باشد که برای دستکاری قابل اعتماد مناسب هستند. این انتخاب ها نیز با معاوضه هایی همراه هستند. قرار دادن موتورها در دست به معنای موتورهای کوچکتر"}, {"source": "Business Insider", "title": "Meta was prepared to write an up to $200 billion AI check before knowing whether its model would work", "link": "https://www.businessinsider.com/mark-zuckerberg-massive-risk-meta-took-on-ai-2026-10", "summary": "Zuckerberg said that in late 2025, Meta weighed a $200 billion AI bet before seeing its new models. Andrej Sokolow/picture alliance via Getty Images Zuckerberg said Meta weighed a $200 billion AI bet before seeing its new models. Alexandr Wang said Meta's CFO warned failure would be \"very, very bad\" financially. Meta's capex spending has been substantial and has raised eyebrows among investors Mark Zuckerberg was ready to bet as much as $200 billion on AI, and Meta’s finance chief wanted the person building it to understand what failure would mean. On the Cheeky Pint podcast released on Monday, Meta CEO and Alexandr Wang , Meta's chief AI officer, recounted conversations from late last year about enormous investments before Meta’s new models had proven themselves. “At the end of last year, we're like, all right, we are quite excited about the progress. We haven't seen the models yet,” Zuckerberg told show host John Collison. “I'm going to, like, you know, we're going to write this check for, like, I don't know, like $100 billion, $200 billion. I'm like, 'Alex, are you sure this is going to work?'” Zuckerberg said of Wang. Zuckerberg did not specify the timeframe or exact scope of that contemplated commitment. Wang said he had encouraging research updates at that point, but success was far from certain. At an executive gathering in Hawaii, Wang said that CFO Susan Li repeatedly pulled him aside. “Susan pulled me aside many times and was like, 'You know, I just want to tell you, if this doesn't work, like, you know, this is going to be really, really bad. It's going to be very, very bad in financial terms.'” Wang said of Li. Meta's capex over the past few quarters has been substantial, raising eyebrows among investors. Meta’s latest guidance puts 2026 capital expenditures, including finance lease principal payments, at $130 billion to $145 billion. In forecasts previously seen by Business Insider, Cantor Fitzgerald analysts expect the spending to reach $200 billion in 2027. Investors have shown limits. Meta shares fell more than 6% in after- y Tesla Owners of Silicon Valley on Saturday, Musk called out Waymo for its reported collisions with animals. \"What a lot of people don't know is that Waymos are like pet destroyers,\" Musk said, laughing. \"Well, maybe Waymo's made some improvements on that front, but they do run over a lot of pets, and we don't want to run over pets.\" Waymo has gotten flak over animal collisions before, most notably after its run-in with a beloved bodega cat in a San Francisco neighborhood back in October 2025. The feline, named KitKat, died after it was run over by Waymo's rear right tire, video obtained by The New York Times showed. That is not Waymo's first collision with an animal. The National Highway Traffic Safety Administration's Standing General Order requires autonomous vehicle companies like Waymo to report qualifying crashes. NHTSA data showed that between July 2025 and July 2026, Waymo reported at least 9 crashes involving animals, 6 of which Waymo described as domestic animals. A Waymo spokesperson did not respond to a request for comment. Tesla's robotaxi service also reported a collision involving an animal during the same time period, but the incident involved a supervised robotaxi. Tesla also operated a smaller fleet, and most of its unsupervised operations were concentrated in one city: Austin. Musk said during the virtual interview that Tesla Robotaxi will be able to detect roaming pets at night. \"We have these challenges of literally like: gray kittens on a gray tarmac with tar seams at night in low visibility. And it's like, 'Can we not run over the kittens,' type of thing,\" he said. Musk added that Tesla will deploy the update, though he did not specify when. Have a tip on Tesla or Waymo? Contact this reporter via email at lloydlee@businessinsider.com or Signal at lloydlee.71. Use a personal email address, a nonwork WiFi network, and a nonwork device; here's our guide to sharing information securely. Read the ", "date_str": "2026-10-12T23:13:05+00:00", "hash": "2fd55e01ee4f3007", "title_fa": "ایلان ماسک تاریخچه برخورد حیوانات خانگی Waymo را بررسی می کند و می گوید Robotaxi تسلا راه حلی دارد.", "summary_fa": "ایلان ماسک گفت روباتاکسی Waymo نابودگر حیوانات خانگی است. PATRICK PLEUL/POOL/AFP از طریق Getty Images Waymo قبلاً به دلیل برخورد رباتاکسی خود با حیوانات ولگرد شکار شده بود. ایلان ماسک در Waymo حمله کرد و رباتاکسی را «ناوشکن حیوانات خانگی» نامید. ماسک گفت تسلا برای حل مشکل رباتاکسی که روی حیوانات می دود، چالش هایی را برای خود به وجود آورده است. ایلان ماسک رقیب ربات‌اکسی خود، Waymo را بررسی کرد و این وسایل نقلیه را «ناوشکن‌های حیوانات خانگی» نامید و گفت تسلا Robotaxi مشکل اجتناب از حیوانات خانگی ولگرد را حل کرده است. ماسک در جریان یک مصاحبه زنده در رویدادی که روز شنبه توسط صاحبان تسلا دره سیلیکون برگزار شد، از Waymo به دلیل برخورد گزارش شده با حیوانات انتقاد کرد. ماسک با خنده گفت: «چیزی که بسیاری از مردم نمی‌دانند این است که Waymos مانند نابودگر حیوانات خانگی هستند. \"خب، شاید Waymo پیشرفت هایی در این زمینه داشته باشد، اما آنها حیوانات خانگی زیادی را زیر پا می گذارند، و ما نمی خواهیم حیوانات خانگی را زیر پا بگذاریم.\" Waymo قبلاً بر اثر برخورد حیوانات دچار لک شده بود، به ویژه پس از برخورد با گربه بودگا محبوب در محله ای در سانفرانسیسکو در اکتبر 2025. ویدئویی که توسط نیویورک تایمز به دست آمد نشان داده شد که گربه به نام کیت کت پس از برخورد با لاستیک عقب سمت راست Waymo مرده است. این اولین برخورد Waymo با یک حیوان نیست. دستور عمومی اداره ملی ایمنی ترافیک بزرگراه‌ها، شرکت‌های خودروهای خودمختار مانند Waymo را ملزم می‌کند تا تصادفات واجد شرایط را گزارش کنند. داده‌های NHTSA نشان داد که بین ژوئیه ۲۰۲۵ و جولای ۲۰۲۶، Waymo حداقل ۹ تصادف با حیوانات را گزارش کرده است که ۶ مورد از آن‌ها را Waymo به عنوان حیوانات اهلی توصیف کرده است. سخنگوی Waymo به درخواست برای اظهار نظر پاسخ"}, {"source": "Business Insider", "title": "Kroger to cut 3,000 corporate employees over the next 3 years. Read the memo.", "link": "https://www.businessinsider.com/kroger-cutting-3-000-corporate-employees-over-3-years-2026-10", "summary": "Kroger s corporate workforce is going to get leaner. Brandon Bell/Getty Images Kroger is making big cuts to its corporate workforce. CEO Greg Foran said about 3,000 roles will go away in the next three years. Foran said the corporate-level reductions will allow Kroger to invest in frontline workers. Kroger plans to cut about 3,000 roles from its corporate workforce over the next three years to simplify operations. In a memo to staff that the company shared with Business Insider, CEO Greg Foran said the corporate-level reductions will allow Kroger to invest in frontline workers. \"Our business is becoming leaner, more focused and more competitive,\" he said. The former Walmart US CEO took the helm of Kroger earlier this year and has set to work cutting prices and tightening operations over the past several months. Foran also cited the impact of technology on the century-old company, saying that it merits a close look at where work can be done. Read the memo from CEO Greg Foran FROM: Desk of Greg Foran inbox TO: All company RE: Changes to Our Organization We shared important information on our all-company call today, and we're following up to make sure everyone is aware of the changes ahead. As a company, we have made great progress on many fronts with our customers. We started reducing prices and improving our customer experience in stores and online, and we made investments in simplifying our associates' lives through technology. Our business is becoming leaner, more focused and more competitive. We are working to be more agile; more precise in our execution; and deliver benefits to our customers, associates and our shareholders. This transformation will also result in fewer roles across the company, which means we will reduce our corporate workforce across many functions, by approximately 3,000 roles over the next three years. These reductions will allow us to continue to invest in our frontline associates. These are difficult decisions, and we do not make them lightly. This is the right thing for the company's long-term future. Here's why: Simplifying our operations is critical . Simplifying means making faster decisions and deploying more resources where they matter most, so that we deliver lower prices and a better experience for our customers. Our company has more layers, more handoffs and more overhead than we need, so we are addressing this issue. Technology is reshaping what's possible. The way work gets done is changing across every industry; we mus", "date_str": "2026-10-12T21:48:03+00:00", "hash": "e1a25eb76b942720", "title_fa": "کروگر 3000 کارمند شرکت را طی 3 سال آینده اخراج می کند. یادداشت را بخوانید.", "summary_fa": "نیروی کار شرکت کروگر لاغرتر می شود. براندون بل/گتی ایماژ کروگر در حال ایجاد کاهش های بزرگ در نیروی کار شرکتی خود است. گرگ فوران، مدیر عامل شرکت، گفت حدود 3000 نقش در سه سال آینده از بین خواهند رفت. فوران گفت که کاهش سطح شرکت به کروگر اجازه می دهد تا روی کارگران خط مقدم سرمایه گذاری کند. کروگر قصد دارد در طول سه سال آینده حدود 3000 نقش از نیروی کار شرکت خود را کاهش دهد تا عملیات را ساده کند. در یادداشتی برای کارکنان که شرکت با Business Insider به اشتراک گذاشت، مدیر عامل شرکت گرگ فوران گفت که کاهش سطح شرکت به کروگر اجازه می دهد تا روی کارگران خط مقدم سرمایه گذاری کند. او گفت: \"کسب و کار ما در حال تبدیل شدن به لاغرتر، متمرکزتر و رقابتی تر است.\" مدیر عامل سابق Walmart ایالات متحده در اوایل سال جاری سکان هدایت کروگر را به دست گرفت و در چند ماه گذشته دست به کار شده است تا قیمت ها را کاهش دهد و عملیات را سخت تر کند. فوران همچنین به تأثیر فناوری بر این شرکت صد ساله اشاره کرد و گفت که شایسته نگاهی دقیق به جایی است که می توان کار کرد. یادداشت مدیر عامل Greg Foran را بخوانید از: Desk of Greg Foran صندوق ورودی به: همه شرکت RE: تغییرات در سازمان ما امروز اطلاعات مهمی را در تماس تمام شرکتی خود به اشتراک گذاشتیم و در حال پیگیری هستیم تا مطمئن شویم همه از تغییرات پیش رو مطلع هستند. به عنوان یک شرکت، ما در بسیاری از زمینه ها با مشتریان خود پیشرفت زیادی داشته ایم. ما شروع به کاهش قیمت ها و بهبود تجربه مشتری خود در فروشگاه ها و آنلاین کردیم و سرمایه گذاری هایی را برای ساده سازی زندگی همکاران خود از طریق فناوری انجام دادیم. کسب"}, {"source": "Business Insider", "title": "Best no-pull dog harnesses", "link": "https://www.businessinsider.com/guides/pets/best-no-pull-dog-harness", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We used hands-on, real-world testing to identify the best no-pull harnesses for both large and small dogs. Jackie Brown; Elizabeth Holbrook/Business Insider Walking a dog that pulls on the leash can be stressful for both you and your pup. Fortunately, with consistent training and the right equipment, you can teach your dog to walk calmly on a loose leash. One of the best no-pull dog harnesses with a front-clip leash attachment is the gear you need to effectively reduce pulling on walks. Our top pick at a glance: For most dogs that pull, the PetSafe Easy Walk Comfort Harness is the best everyday harness thanks to its effective front-clip design, which includes a unique martingale loop that helps reduce pulling. It's easy to adjust for a secure fit on all but the smallest dogs. If you have a pint-sized pup, we recommend the Wild One Dog Harness instead. The smallest size has hardware that's easier to grip and adjust than the PetSafe. Unlike a traditional back-clip harness, a front-clip design applies gentle pressure across your dog's chest whenever they lunge or pull on leash, naturally redirecting them back toward you. This reduces a dog's pulling without causing them pain, ultimately making walks easier and safer. To find the best no-pull dog harnesses, our team of pet reporters tested 21 styles with more than two dozen dogs, ranging from small breeds to large German shepherds. We also consulted professional dog trainers, dog walkers, and veterinarians for advice on choosing an effective no-pull harness and using safe, humane training techniques to reduce leash pulling. Our top picks for the best no-pull dog harnesses Best overall: PetSafe Easy Walk Comfort Harness - $35 at Chewy Best padded: Ruffwear Front Range Dog Harness - $60 at Chewy Best budget: PetSafe 3-in-1 No-Pull Dog Harness - $30 at Chewy Best for small dogs: Wild One Dog Harness - $48 at Chewy Best with handle: PoyPet No-Pull Dog Harness - $18 at Amazon Best overall Best for: Everyday walks with dogs over 20 lbs. Skip this if: Your dog needs the XS size since the hardware on it can be difficult to grip and adjust, you are walking your dog in hot weather, your dog dislikes having things pulled over their head Why this is our top pick: Like other no-pull options, the PetSafe Easy Walk Comfort Harness features a stainless steel D-ring leash attachment at the chest. What sets it apart from other harnesse", "date_str": "2026-10-12T21:46:38+00:00", "hash": "930336d4593b6c71", "title_fa": "بهترین مهار سگ بدون کشش", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید ما از آزمایش عملی و در دنیای واقعی برای شناسایی بهترین مهارهای بدون کشش برای سگ‌های بزرگ و کوچک استفاده کردیم. جکی براون؛ الیزابت هولبروک/خودی بیزینس راه رفتن سگی که افسارش را می کشد می تواند هم برای شما و هم برای توله سگتان استرس زا باشد. خوشبختانه، با آموزش مداوم و تجهیزات مناسب، می توانید به سگ خود بیاموزید که آرام روی یک افسار شل راه برود. یکی از بهترین مهارهای سگ بدون کشش با اتصال افسار گیره جلو، ابزاری است که برای کاهش موثر کشش در پیاده روی به آن نیاز دارید. انتخاب برتر ما در یک نگاه: برای اکثر سگ‌هایی که می‌کشند، مهار راحت پیاده‌روی PetSafe به لطف طراحی موثر گیره جلویی آن، که شامل یک حلقه مارتینگل منحصر به فرد است که به کاهش کشیدن کمک می‌کند، بهترین مهار روزمره است. تنظیم آن برای تناسب ایمن در همه سگ ها به جز کوچکترین سگ ها آسان است. اگر یک توله سگ به اندازه یک نیم لیتر دارید، به جای آن هارنس Wild One Dog را توصیه می کنیم. کوچکترین اندازه دارای سخت افزاری است که گرفتن و تنظیم آن راحت تر از PetSafe است. برخلاف گیره‌های پشتی سنتی، طراحی گیره‌های جلویی هر زمان که سگ شما به سمت قفسه سینه می‌رود یا افسارش را می‌کشد، فشار ملایمی به سینه وارد می‌کند و به طور طبیعی آنها را به سمت شما هدایت می‌کند. این کار کشش سگ را بدون ایجاد درد کاهش می دهد و در نهایت راه رفتن را آسان تر و ایمن تر می کند. برای یافتن بهترین مهارهای سگ بدون کشش، تیم خبرنگاران حیوانات خانگی ما 21 نوع سگ را با بیش از دوجین سگ، از نژادهای کوچک گرفته تا ژرمن شپردهای بزرگ، آزمایش کردند."}, {"source": "Business Insider", "title": "The 10 best ankle boots we've ever tested", "link": "https://www.businessinsider.com/guides/style/best-ankle-boots", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Our favorite ankle boots pair comfort-forward details with styles you can wear from office days to weekends. Rebecca Strong, Samantha Crozier/Business Insider I don't care much for pumpkin spice lattes (don't come for me), but as September rolls around and the temperatures start dipping into the mid-to-low 60s, I do get a little overeager to pull my ankle boots from storage. Putting together a cute outfit just feels easier with the right footwear, and ankle boots have a way of anchoring a whole look. They balance chunky sweaters and oversized coats, instantly elevate a simple jeans-and-tee combo, and offer just enough coverage for those in-between fall and spring days. A quick look at some of our favorite ankle boots Best overall: Naturalizer Delaney Ankle Bootie is our favorite wear-with-anything boot, with a walkable 2.38-inch block heel, cushioned arch support, and wide-width options. Best for wide feet: The stretchy, water-repellent Vivaia Regina Pro has a roomy fit, a comfortable pressure-relief insole, and a fun sock-boot silhouette. Best for winter: The Blundstone Thermal Chelsea Boot keeps feet warm and dry with a shearling insole, waterproof construction, and a grippy sole for slush and slick sidewalks. Best budget pick: Dream Pairs Classic Chelsea Ankle Boots are an easy, under-$50 everyday option with pull tabs and stretchy side panels. As a style writer, I've tested too many ankle boots to count, across styles and price points. Some I tore off before I even left the house. Others I excitedly bust out year after year. The pairs I keep coming back to tend to have a few things in common: They're comfortable enough to keep my feet happy for long hours, durable enough to withstand more than one season of wear, and versatile enough to dress up or down. Here are the booties that check all those boxes. And if you're in the market for boots with a taller shaft, see our piece on the best knee-high boots . Note: Every ankle boot in this guide has been tested by a member of our team in real-world settings, from commutes and errands to dinners and long city walks. We assess comfort, fit, support, traction, materials, durability, and value, updating our recommendations as we test new styles. Read more about how we test clothing, shoes, and accessories . Best overall: Naturalizer Delaney Ankle Bootie Rebecca Strong/Business Insider What we love: Reasonable heel heigh", "date_str": "2026-10-12T21:30:32+00:00", "hash": "97e95acc36582fcc", "title_fa": "10 بهترین نیم بوت که تا به حال تست کرده ایم", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید نیم بوت‌های مورد علاقه ما جزئیات راحت را با مدل‌هایی که می‌توانید از روزهای اداری تا آخر هفته بپوشید، جفت می‌کند. Rebecca Strong، Samantha Crozier/Business Insider من زیاد به لاته های ادویه ای کدو تنبل اهمیت نمی دهم (برای من نیایید)، اما با نزدیک شدن ماه سپتامبر و کاهش دما در دهه 60، کمی بیش از حد مشتاق می شوم که نیم بوت هایم را از انبار بیرون بکشم. کنار هم قرار دادن یک لباس زیبا با کفش مناسب راحت‌تر است و نیم بوت‌ها راهی برای تثبیت ظاهری کامل دارند. آنها ژاکت های کلفت و کت های بزرگ را متعادل می کنند، فورا ترکیب ساده شلوار جین و تی را بالا می برند و پوشش کافی برای روزهای بین پاییز و بهار ارائه می دهند. نگاهی گذرا به برخی از نیم بوت‌های مورد علاقه ما در مجموع بهترین: چکمه‌های نچرالایزر Delaney Ankle Bootie مورد علاقه ما است که با هر چیزی پوشیده می‌شود، با پاشنه بلوک 2.38 اینچی قابل راه‌رفتن، ساپورت قوس‌دار و گزینه‌های پهن. بهترین گزینه برای پاهای پهن: کشسان و ضد آب Vivaia Regina Pro دارای یک جادار بودن، یک کفی راحت برای کاهش فشار، و یک طرح جالب جوراب بوت است. بهترین گزینه برای زمستان: چکمه Blundstone Thermal Chelsea با کفی برشی، ساختار ضد آب و کفی چسبنده برای پیاده روهای لجن و صاف، پاها را گرم و خشک نگه می دارد. بهترین انتخاب با بودجه: چکمه‌های مچ پا کلاسیک چلسی Dream Pairs گزینه‌ای آسان و روزانه زیر 50 دلار با زبانه‌های کششی و پانل‌های کناری کشیده هستند. به‌عنوان یک سبک‌نویس، تعداد زیادی چکمه‌های مچ پا را برای شمارش، در سبک‌ها و قیمت‌ها آزمایش کرده‌ام. بعضی از آنها را حتی قبل از اینکه از خانه بیرون بروم پاره"}, {"source": "Business Insider", "title": "Anthropic is making a $100 million bet on deployed AI engineers, and it seeks 5 key attributes", "link": "https://www.businessinsider.com/anthropic-invests-100-m-train-deployed-ai-engineers-fde-2026-10", "summary": "Anthropic s developer conference in May. Don Feria/AP Content Services for Anthropic Anthropic is putting $100 million into a new training program for other companies' workers. The push is an effort to create more \"deployed engineers,\" who can ramp up AI usage at companies. Executives explained the program and described the ideal forward-deployed engineer. Forward-deployed engineers are all the rage in AI, and Anthropic is going to other companies to train up top talent. The AI company announced a $100 million investment into an FDE training initiative earlier this month. It's a quasi-fellowship that engineers from other firms have already begun applying for. They'll attend four-day on-site intensives and then complete 12-week \"residencies\" working with Anthropic's Claude tools at their own companies. The company says it hopes to train 10,000 people through the program by the end of 2027. As Anthropic approaches its gigantic initial public offering , it's using the new training model to get more of the corporate world used to AI — and ramp up Claude spending. Job postings for FDEs have boomed over the last couple of years, as more companies buy software from AI firms and need help deploying it. Two Anthropic executives leading the push told Business Insider that their customers see AI's advances, notice competitors grabbing market share, and feel pressure to change their own work. \"Everybody understands the model capability is expanding extremely fast,\" said Shambhavi Shambhavi, Anthropic's head of go-to-market strategy and operations for partnerships. \"So, what can be done with the technology is greatly appreciated by the customers.\" Enter the FDE — which Anthropic calls \"Frontier Deployed Engineers,\" rather than the standard \" forward-deployed engineer \" title that Palantir helped popularize . Both roles essentially mean someone with deep technical expertise in AI and the mandate to create new modes of work at a company. Shambhavi and Steve Corfield, Anthropic's head of global business development and partnerships, broke down the FDE role as they see it and how Anthropic hopes to set a \"gold standard\" with its new skills push. Anthropic execs say FDEs are curious Shambhavi said that the best FDEs have four main attributes. They are familiar with agentic AI systems. They're good problem-solvers. They're excellent communicators. And they're experienced, skilled engineers. Corfield tacked on a point he thinks helps Anthropic thrive: \"You've got to be super,", "date_str": "2026-10-12T21:17:56+00:00", "hash": "a2c312f6d89e0144", "title_fa": "آنتروپیک 100 میلیون دلار روی مهندسان هوش مصنوعی مستقر شده شرط بندی می کند و به دنبال 5 ویژگی کلیدی است.", "summary_fa": "کنفرانس توسعه دهندگان Anthropic در ماه می. Don Feria/AP Content Services for Anthropic Anthropic ۱۰۰ میلیون دلار را برای یک برنامه آموزشی جدید برای کارکنان دیگر شرکت ها اختصاص می دهد. این فشار تلاشی برای ایجاد «مهندسین مستقر» بیشتر است که می‌توانند استفاده از هوش مصنوعی را در شرکت‌ها افزایش د onal Wildlife Refuge near San Antonio, New Mexico. Ronen Tivony/NurPhoto via Getty Images Lonely Planet curated a list of the best places to travel to in 2027. Popular destinations like Prince Edward Island, Canada, and New Mexico made the list. It also includes lesser-known places like Bariloche, Argentina, and Šibenik, Croatia. As 2026 draws to a close , travelers are beginning to map out where they want to go next year. To help jump-start those plans, Lonely Planet in September released its annual \"Best in Travel\" guide for 2027, highlighting 25 destinations chosen by its global network of writers and contributors. The guide's destination picks span Argentina's mountains , Canada's red-rock beaches, a Caribbean island, and California's ancient redwood forests, among other places. Here are the 25 best travel destinations featured in Lonely Planet's annual list. The Tweed, Australia The Tweed is best for Hinterland detours. James D. Morgan/Getty Images The Tweed region is in far northeastern New South Wales, between the Gold Coast and Byron Bay. Visitors can enjoy activities such as hiking and biking. The Veneto, Italy Morning mist on the Venetian Prealps, Veneto region, Italy. DeAgostini/Getty Images Veneto, the northeastern Italian region, is far more than just Venice . It stretches from the Prosecco Hill vineyards to the Dolomites and Lake Garda, offering visitors a bit of everything: historic cities, mountains, lakeside towns, and a top-class food and wine scene. New Mexico, US Carlsbad Caverns National Park - New Mexico. (Photo by: Edwin Remsberg/VW Pics/Universal Images Group via Getty Images) : Edwin Remsberg/VW Pics/Universal Images Group via Getty Images New Mexico offers a range of activities and sights : desert landscapes, mountain towns, ancient sites, and a mix of Native American, Hispanic, and Anglo cultures. Prince Edward Island, Canada Beach along the North Shore of Prince Edward Island, Canada. (Photo by: John Lazenby/UCG/Universal Images Group via Getty Images) : John Lazenby/UCG/Universal Images Group via Getty Images Prince Edward Island is Canada’s smallest province. However, it packs in red sandstone cliffs, fishing villages, and a food scene centered on the sea. Fans of \"Anne of Green Gables\" can also visit the places that inspired author Lucy Maud Montgomery’s novel. Bariloche, Argentina A woman practices nordic ski at Otto hill near Bariloche, Rio Negro, Argentina, on Ju", "date_str": "2026-10-12T21:10:25+00:00", "hash": "6af59f07af4cad03", "title_fa": "25 بهترین مکان برای بازدید در سال 2027 طبق گزارش Lonely Planet", "summary_fa": "هزاران غاز برفی در پناهگاه ملی حیات وحش Bosque del Apache در نزدیکی سن آنتونیو، نیومکزیکو پرواز می کنند. Ronen Tivony/NurPhoto از طریق Getty Images Lonely Planet فهرستی از بهترین مکان‌ها را برای سفر در سال 2027 تنظیم کرد. مقاصد محبوب مانند جزیره پرنس ادوارد، کانادا و نیومکزیکو در این فهرست قرار گرفتند. همچنین شامل مکان های کمتر شناخته شده مانند باریلوچه، آرژانتین، و شیبنیک، کرواسی است. با نزدیک شدن به پایان سال 2026، مسافران شروع به ترسیم نقشه جایی می کنند که سال آینده می خواهند بروند. برای کمک به شروع سریع این برنامه ها، Lonely Planet در ماه سپتامبر راهنمای سالانه «بهترین در سفر» را برای سال 2027 منتشر کرد که 25 مقصد انتخاب شده توسط شبکه جهانی نویسندگان و مشارکت کنندگان خود را برجسته می کند. انتخاب های راهنما شامل کوه های آرژانتین، سواحل صخره ای قرمز کانادا، جزیره ای در دریای کارائیب، و جنگل های باستانی چوب قرمز کالیفرنیا و مکان های دیگر است. در اینجا 25 بهترین مقصد سفر که در لیست سالانه Lonely Planet معرفی شده اند، آورده شده است. The Tweed، استرالیا Tweed برای مسیرهای انحرافی Hinterland بهترین است. جیمز دی مورگان/ گتی ایماژ منطقه توید در شمال شرقی نیو ساوت ولز، بین ساحل طلایی و خلیج بایرون قرار دارد. بازدیدکنندگان می توانند از فعالیت هایی مانند پیاده روی و دوچرخه سواری لذت ببرند. ونتو، ایتالیا غبار صبحگاهی در پرآلپس ونیزی، منطقه ونتو، ایتالیا. DeAgostini/Getty Images ونتو، منطقه شمال شرقی ایتالیا، بسیار فراتر از ونیز است. از تاکستان‌های تپه Prosecco تا دولومیت‌ها و در ", "title": "Sonos Beam Ultra soundbar review: Compact design, big Dolby Atmos sound", "link": "https://www.businessinsider.com/guides/tech/sonos-beam-ultra-soundbar-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The Sonos Beam Ultra offers expansive 3D audio from a surprisingly small form factor. Tyler Hayes/Business Insider Sonos' latest soundbar might be small in stature, but it's kind of a big deal. It's called the Beam Ultra , and it's a step-up version of the brand's popular Beam Gen 2 . This new model adds four more audio drivers to deliver larger, more expansive home-theater sound without compromising a modest footprint. It dials up its Dolby Atmos performance with much more convincing overhead effects, so even listeners in small spaces can get full, cinematic sound. I've used nearly every Sonos speaker the company has released, including all of its soundbars dating back to the original Playbar. The Beam Ultra exemplifies what the company does best, providing a solid upgrade over the standard Beam, in both raw power and dialogue enhancement. Given its convenient size, the Sonos Beam Ultra is perfect for apartments and smaller living rooms. But you don't need to be short on space to appreciate what it offers. After spending a couple of weeks with the Beam Ultra, I found its immersive performance ample for a variety of rooms. For $699, the Beam Ultra is an excellent alternative to the bigger, more expensive Sonos Arc Ultra , offering a more affordable way to dive into the brand's premium home theater ecosystem. Looking for more soundbar recommendations? Check out our guides to the best soundbars and best Sonos soundbars . What's new about the Sonos Beam Ultra? The Sonos Beam Ultra (front) is a bit wider than the Beam Gen 2 (back), but its height and depth are nearly the same. Tyler Hayes/Business Insider The new Beam Ultra is aptly named, upping both the specs and price over the standard Beam Gen 2 . That older model isn't going anywhere (at least for now) and remains positioned as the brand's lower midrange soundbar, coming in at $499. But the new $699 Beam Ultra is decidedly more premium, offering an experience that comes closer to the flagship Arc Ultra, which costs $1,099. The Beam Ultra features more internal components than the Beam Gen 2, and it delivers more power under the hood, allowing its sound to reach new heights — literally. One of the biggest differences between the Beam Gen 2 and Beam Ultra is the latter's use of up-firing audio drivers. The Beam Gen 2 was limited to virtualized Dolby Atmos playback, relying on processing and psychoacoustics to simul", "date_str": "2026-10-12T20:50:02+00:00", "hash": "ce552becf8e59c81", "title_fa": "بررسی نوار صوتی Sonos Beam Ultra: طراحی فشرده، صدای بزرگ Dolby Atmos", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید Sonos Beam Ultra صدای سه بعدی گسترده ای را از یک فرم بسیار کوچک ارائه می دهد. نوار صوتی تایلر هیز/Business Insider Sonos ممکن است قد کوچکی داشته باشد، اما به نوعی کار بزرگی است. این Beam Ultra نامیده می شود و یک نسخه پیشرفته از Beam Gen 2 محبوب این برند است. این مدل جدید چهار درایور صوتی دیگر را اضافه می‌کند تا صدای سینمای خانگی بزرگ‌تر و گسترده‌تر را بدون آسیب رساندن به ردپای متوسط ​​ارائه کند. عملکرد Dolby Atmos خود را با جلوه‌های بالای سر بسیار قانع‌کننده‌تر تنظیم می‌کند، بنابراین حتی شنوندگان در فضاهای کوچک می‌توانند صدای کامل و سینمایی دریافت کنند. من تقریباً از همه بلندگوهای Sonos که این شرکت منتشر کرده است، از جمله تمام نوارهای صوتی آن که به Playbar اصلی بازمی‌گردد، استفاده کرده‌ام. Beam Ultra نمونه کارهایی است که این شرکت به بهترین شکل انجام می دهد، و ارتقای قوی نسبت به Beam استاندارد، هم در قدرت خام و هم در بهبود دیالوگ ارائه می دهد. با توجه به اندازه مناسب آن، Sonos Beam Ultra برای آپارتمان ها و اتاق های نشیمن کوچکتر مناسب است. اما برای قدردانی از آنچه ارائه می دهد، نیازی به کمبود فضا ندارید. پس از گذراندن چند هفته با Beam Ultra، عملکرد فراگیر آن را برای اتاق‌های مختلف کافی دیدم. Beam Ultra با قیمت 699 دلار یک جایگزین عالی برای Sonos Arc Ultra بزرگتر و گرانتر است که راه مقرون به صرفه تری را برای فرو رفتن در اکوسیستم سینمای خانگی ممتاز این برند ارائه می دهد. به دنبال توصیه های بیشتری برای نوار صوتی هستید؟ راهنمای ما در مورد بهترین نوارهای صوتی و بهترین نوارهای صوتی Sonos را بررسی کنید. چه چیز جدیدی در مورد Sonos Beam Ultra"}, {"source": "Business Insider", "title": "A PR pro says Kelly Clarkson made one big mistake in her feud with a Brooklyn toy shop", "link": "https://www.businessinsider.com/kelly-clarkson-toy-store-drama-explained-celebrity-pr-2026-10", "summary": "Kelly Clarkson hosts The Kelly Clarkson Show. Weiss Eubanks/NBCUniversal via Getty Images Kelly Clarkson publicly scolded a small business in Brooklyn after visiting the store. The store, Art of Play, responded with two public statements attempting to reframe the interaction. PR pro Evan Nierman says both parties attempted to position themselves as victims to gain sympathy. When a feud is brought into the court of public opinion, the winner isn't necessarily the one who's technically \"right.\" It's the one who crafts the better narrative. That's the main thing that Kelly Clarkson is missing in her viral clash with a small business in Brooklyn , according to Evan Nierman, CEO of the global PR firm Red Banyan. \"This is more about feelings than facts,\" Nierman said. The much-publicized kerfuffle started on Saturday, when Clarkson shared a post on X about her recent visit to Art of Play, a store that sells toys, puzzles, gifts, and other oddities. Clarkson said she was treated poorly at the store, comparing herself to Julia Roberts' \" Pretty Woman \" heroine — specifically, the memorable scene in which she is rejected and mocked in a fancy Beverly Hills boutique. Just drove all the way to Brooklyn to check out this store I thought looked really rad and had a few things in mind to buy and literally was looked at as if I couldn’t afford it and was told he could find something comparable for me. Wow, dude. You’re an idiot and just lost a huge sale. But y’all should go check out Art of Play in Brooklyn if you enjoy being treated like Julia Roberts character in Pretty Woman. For sure, check it out 👎 — Kelly Clarkson (@kellyclarkson) October 10, 2026 Clarkson said she tried to buy something expensive at Art of Play but was treated as if she \"couldn't afford it.\" However, the shop employee Clarkson dealt with remembers the interaction differently. Art of Play responded with a public statement , saying that Clarkson inquired about a one-of-a-kind mechanical bird puppet nicknamed \"Molly,\" and she was told it wasn't for sale. When Clarkson doubled down , insisting that Molly came with a $15,000 price tag and calling the employee a \"liar,\" Art of Play clarified its claim. In a follow-up statement on Instagram , the store said that Clarkson had been offered a nearly identical version of the bird, created by the same artist, for $15,000, as well as a comparable version by a different maker for $2,000. Who's right, and what really happened? We may never know, and it probably ", "date_str": "2026-10-12T20:47:19+00:00", "hash": "fff2b48f32827464", "title_fa": "یک حرفه ای روابط عمومی می گوید که کلی کلارکسون در دشمنی خود با یک مغازه اسباب بازی فروشی در بروکلین یک اشتباه بزرگ مرتکب شد.", "summary_fa": "کلی کلارکسون مجری برنامه کلی کلارکسون شو. Weiss Eubanks/NBCUniversal از طریق Getty Images کلی کلارکسون پس از بازدید از فروشگاه، علناً یک تجارت کوچک در بروکلین را سرزنش کرد. فروشگاه، Art of Play، با دو بیانیه عمومی پاسخ داد و سعی کرد این تعامل را دوباره چارچوب بندی کند. ایوان نیرمن، طرفدار روابط عمومی می گوید که هر دو طرف برای جلب همدردی تلاش کردند خود را قربانی قرار دهند. وقتی یک دشمنی به دادگاه افکار عمومی کشیده می شود، برنده لزوماً کسی نیست که از نظر فنی «حق» باشد. این کسی است که روایت بهتری را می سازد. به گفته ایوان نیرمن، مدیر عامل شرکت جهانی روابط عمومی Red Banyan، این اصلی‌ترین چیزی است که کلی کلارکسون در درگیری ویروسی خود با یک تجارت کوچک در بروکلین از دست داده است. نیرمن گفت: «این بیشتر به احساسات مربوط می شود تا واقعیت ها. این جنجال پربازدید روز شنبه آغاز شد، زمانی که کلارکسون پستی را در مورد بازدید اخیر خود از Art of Play، فروشگاهی که اسباب بازی، پازل، هدایا و چیزهای عجیب و غریب می فروشد، در X به اشتراک گذاشت. کلارکسون گفت که در فروشگاه با او بد رفتاری شده است و خودش را با قهرمان \"زن زیبا\" جولیا رابرتز مقایسه می کند - به ویژه صحنه به یاد ماندنی که در آن او در بوتیک شیک بورلی هیلز طرد شده و مورد تمسخر قرار می گیرد. فقط تمام راه را تا بروکلین رانندگی کردم تا این فروشگاه را بررسی کنم، فکر می‌کردم واقعاً راد به نظر می‌رسد و چند چیز برای خرید در ذهن داشتم و به معنای واقعی کلمه به نظرم می‌رسید که گویی توان خرید آن را ندارم و به او گفته شد که می‌تواند چیزی قابل مقایسه برای من پیدا کند. وای رفیق شما یک احمق هستید و یک فروش هنگفت را از"}, {"source": "Business Insider", "title": "Best Athleta coupon codes we've tested in October 2026", "link": "https://www.businessinsider.com/guides/deals/best-athleta-coupon-codes", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Athleta/Business Insider While Athleta might be best known for its athletic apparel, the brand has developed a stellar line-up of other clothing over the years, ranging from dresses to stylish pants fit for work. The retailer still carries some of our favorite athleisure, but there's enough variety that customers can also build out the rest of their closet while shopping at Athleta. The brand is high-quality, which often comes with an equally high price tag, but one of the easiest ways to cut costs is by using an Athleta coupon code before checking out. The editors on our style team have tested out several Athleta items over the years, and the brand consistently delivers on comfort, quality, and ease of wear. Standouts like the Ultra High Rise Elation Legging and Endless High Rise Pant have earned spots in our workout set a
