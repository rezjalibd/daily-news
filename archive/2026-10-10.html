یت تولید تسلیحات، حتی پس از حملات گسترده، می‌تواند"}, {"source": "BBC Persian", "title": "استقرار هزاران نیروی امنیتی در دهلی‌نو، بازداشت رهبر «حزب مردمی سوسک»", "link": "https://www.bbc.com/persian/articles/cwp9gxm21r1ko?at_medium=RSS&at_campaign=rss", "summary": "ده‌ها هزار نیروی امنیتی و پلیس در دهلی‌نو مستقر شده‌اند و رفت‌وآمد در پایتخت تحت تاثیر قرار گرفته است. پلیس ابهیجیت دیپکه رهبر و بنیانگذار و دو نفر دیگر از دیگر سران «حزب مردمی سوسک» را که برای شرکت در راهپیمایی با هواپیما وارد پایتخت هند شدند بازداشت کرده است.", "date_str": "2026-10-10T10:31:31+00:00", "hash": "85435bea5741244b", "title_fa": "استقرار هزاران نیروی امنیتی در دهلی‌نو، بازداشت رهبر «حزب مردمی سوسک»", "summary_fa": "ده‌ها هزار نیروی امنیتی و پلیس در دهلی‌نو مستقر شده‌اند و رفت‌وآمد در پایتخت تحت تاثیر قرار گرفته است. پلیس ابهیجیت دیپکه رهبر و بنیانگذار و دو نفر دیگر از دیگر سران «حزب مردمی سوسک» را که برای شرکت در راهپیمایی با هواپیما وارد پایتخت هند شدند بازداشت کرده است. به دنبال دعوت حزب بانفوذ «سوسک» در هند برای تظاهراتی گسترده، بخش‌هایی از دهلی‌نو با حضور نیروهای دولتی، چهره امنیتی به خود گرفته است. «سوسک» جنبشی است که که نسل زد، بیکاران و فقرا را نمایندگی می‌کند و رهبرش گفته بود راهپیمایی امروز «به هر قیمتی که شده» انجام می‌شود. او همچنین در پیامی در ایکس خطاب به نارندرا مودی، نخست‌وزیر هند، نوشته بود: «اگر می‌خواهید ما را زندانی کنید یا حتی به ما شلیک کنید، ما آماده‌ایم.» پلیس و نیروهای امنیتی سعی دارند مانع از تجمع معترضان در نقاط خاصی از دهلی شوند. برخی قطارها به مقصد دهلی‌نو لغو، ده‌ها ایستگاه مترو تعطیل و موبایل و اینترنت مختل شده‌اند. معترضان خواستار اصلاحات انتخابات و استعفای گیانش کومار، کمیسر ارشد انتخابات هند، هستند. آنها کمیسیون انتخابات را به دستکاری در فهرست رأی‌دهندگان متهم می‌کنند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. این تظاهرات چند ماه پس از آن برگزار می‌شود که این جنبش در اوایل تابستان هزاران جوان را به خیابان‌های دهلی کشاند که به درگیری‌های خشونت‌آمیز با پلیس انجامید و وزیر آموزش هند را وادار به استعفا کرد. پلیس می‌گوید با برگزاری تجمع امروز موافقت نکرده است. تمام جاده‌های مسیرهای منتهی به محل اصلی برگزاری اعتراض‌ها، با موانع فلزی بزرگ مسدود شده‌اند. این محدودیت‌ها اختلال گسترده‌ای در مرکز شهر ایجاد کرده و ترافیک در چندین جاده اصلی به مسیرهای دیگر هدایت شده است. در محل اصلی برگزاری تجمع، نیروهای دولتی پشت موانع مستقر شده‌اند و مانع"}, {"source": "BBC Persian", "title": "چرا ایران نگران گسترش روابط اسرائیل و امارات است؟", "link": "https://www.bbc.com/persian/articles/c58jzyj7nnnpo?at_medium=RSS&at_campaign=rss", "summary": "سفر اخیر بنیامین نتانیاهو، نخست‌وزیر اسرائیل، به ابوظبی برخی از عمیق‌ترین سوءظن‌های تهران نسبت به امارات متحده عربی را تقویت کرده است. مقام‌های ایرانی و رسانه‌های تندرو این دیدار را تازه‌ترین نشانه گسترش همکاری‌های امنیتی میان اسرائیل و امارات علیه جمهوری اسلامی ایران توصیف کرده‌اند.", "date_str": "2026-10-10T05:59:10+00:00", "hash": "09d0616594e7168a", "title_fa": "چرا ایران نگران گسترش روابط اسرائیل و امارات است؟", "summary_fa": "سفر اخیر بنیامین نتانیاهو، نخست‌وزیر اسرائیل، به ابوظبی برخی از عمیق‌ترین سوءظن‌های تهران نسبت به امارات متحده عربی را تقویت کرده است. مقام‌های ایرانی و رسانه‌های تندرو این دیدار را تازه‌ترین نشانه گسترش همکاری‌های امنیتی میان اسرائیل و امارات علیه جمهوری اسلامی ایران توصیف کرده‌اند. این نگرانی‌ها و همچنین نگاه به امارات به عنوان یک تهدید امنیتی، پس از جنگ اخیر تشدید شده است؛ جنگی که طی آن ایران بارها منافع آمریکا مستقر در امارات و نیز زیرساخت‌های انرژی این کشور را هدف قرار داد. با این حال، تنش‌ها فراتر از جنگ اخیر است. روابط امارات با اسرائیل، نزدیکی جغرافیایی این کشور به ایران و تنگه راهبردی هرمز، اختلاف دیرینه بر سر سه جزیره خلیج فارس و در عین حال پیوندهای گسترده اقتصادی میان ایران و امارات، روابطی پیچیده را شکل داده است که در آن بی‌اعتمادی عمیق با وابستگی متقابل اقتصادی در هم آمیخته است. پس از آنکه بنیامین نتانیاهو، نخست‌وزیر اسرائیل، ۲۷ سپتامبر به ابوظبی سفر کرد و با محمد بن زاید آل نهیان، رئیس امارات متحده عربی، دیدار کرد، اسماعیل بقایی، سخنگوی وزارت خارجه ایران، به کشورهای منطقه هشدار داد که استفاده اسرائیل از خاک آنها برای هدف قرار دادن ایران می‌تواند «پیامدهای بسیار خطرناکی» داشته باشد. محسن رضایی، دبیر شورای عالی امنیت ملی ایران، صریح‌تر سخن گفت. او در شبکه ایکس نوشت: «همان‌طور که میزبانی از پایگاه‌های نظامی آمریکا برای شما امنیت به ارمغان نیاورد، میزبانی از قصاب غزه نیز پیامدهای مطلوبی نخواهد داشت.» رضایی همچنین از کشورهای منطقه خواست از آنچه «ادعاهای بی‌اساس» درباره سه جزیره خلیج فارس خواند، دست بردارند. اشاره به این جزایر تصادفی نبود. تنها چند روز پیش از آن، امارات بار دیگر در مجمع عمومی سازمان ملل ادعای خود درباره جزایر ابوموسی، تنب بزرگ و تنب کوچک را مطرح کرده بود. ایران بار دیگر اعلام کرد که حاکمیتش بر این جزایر"}, {"source": "BBC Persian", "title": "آیا روسیه به ناتو حمله می‌کند؟", "link": "https://www.bbc.com/persian/articles/cqvgreem5g67o?at_medium=RSS&at_campaign=rss", "summary": "با وجود تاکید مکرر کرملین بر اینکه روسیه برنامه‌ای برای حمله به کشورهای عضو ناتو ندارد، هشدارهای اخیر نهادهای اطلاعاتی و مقام‌های اروپایی درباره احتمال اقدام نظامی محدود مسکو در منطقه بالتیک، بار دیگر بحث احتمال رویارویی مستقیم روسیه و ناتو را در کانون توجه قرار داده است.", "date_str": "2026-10-10T04:10:06+00:00", "hash": "d7b1a98721cb7cb2", "title_fa": "آیا روسیه به ناتو حمله می‌کند؟", "summary_fa": "با وجود تاکید مکرر کرملین بر اینکه روسیه برنامه‌ای برای حمله به کشورهای عضو ناتو ندارد، هشدارهای اخیر نهادهای اطلاعاتی و مقام‌های اروپایی درباره احتمال اقدام نظامی محدود مسکو در منطقه بالتیک، بار دیگر بحث احتمال رویارویی مستقیم روسیه و ناتو را در کانون توجه قرار داده است. احتمال ورود نظامی روسیه به خاک یکی از کشورهای عضو ناتو، سناریویی که مسکو با قاطعیت برنامه‌ریزی برای آن را رد کرده است، در ماه‌های اخیر بار دیگر توجه رسانه‌ها را جلب کرده است. در ۵ اکتبر ۲۰۲۶، فایننشال تایمز گزارش داد که استونی در پی نگرانی از احتمال اقدام تهاجمی مسکو، نیروهای خود را به مرز روسیه نزدیک‌تر می‌کند. در ۲۴ سپتامبر ۲۰۲۶، سرویس اطلاعات دفاعی دانمارک درباره «خطر اندک اما رو به افزایشی» هشدار داد که روسیه ممکن است در ماه‌های آینده شمار محدودی نیرو وارد یکی از کشورهای همسایه عضو ناتو کند. لهستان و جمهوری چک نیز درباره احتمال ورود نیروهای روسیه به خاک یکی از اعضای ناتو یا حمله هوایی به آن ابراز نگرانی کرده‌اند. در همین حال، مقام‌های مسکو بیش از پیش روسیه را قربانی گسترش ناتو معرفی کرده و این ائتلاف را متهم کرده‌اند که در پی محاصره یا مسدود کردن دسترسی کالینینگراد، برون‌بوم روسیه در دریای بالتیک هستند. پس تهدید حمله روسیه به ناتو تا چه اندازه واقعی است؟ رهبران ارشد روسیه بارها هرگونه برنامه برای حمله به ناتو را رد کرده‌اند. ولادیمیر پوتین، رئیس‌جمهور روسیه، در نشست سالانه والدای با حضور کارشناسان سیاست خارجی در نزدیکی مسکو گفت روسیه «قصد حمله به هیچ‌ کس را ندارد؛ نه در ۲۰۲۹، نه در ۲۰۳۰ و نه در ۲۰۵۰». او در ادامه اروپا را متهم کرد که در شرایط «وخامت اوضاع اقتصادی و سیاسی» با دامن زدن به ترس از تشدید تنش میان روسیه و ناتو، می‌کوشد توجه‌ها را از مشکلات داخلی منحرف کند. خبرنامه بی‌بی‌سی فارسی"}, {"source": "BBC Persian", "title": "کیتی زکریا، مفسر محافظه‌کار، سخنگوی جدید کاخ سفید شد", "link": "https://www.bbc.com/persian/articles/ck1l3vdzlj3zo?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ، رئیس‌جمهور آمریکا، کیتی زکریا، مفسر محافظه‌کار و مشاور ارتباطات «ترامپ مدیا و تکنولوژی گروپ»، را به عنوان سخنگوی جدید کاخ سفید انتخاب کرده است.", "date_str": "2026-10-09T21:05:48+00:00", "hash": "ae148a38596f9172", "title_fa": "کیتی زکریا، مفسر محافظه‌کار، سخنگوی جدید کاخ سفید شد", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا، کیتی زکریا، مفسر محافظه‌کار و مشاور ارتباطات «ترامپ مدیا و تکنولوژی گروپ»، را به عنوان سخنگوی جدید کاخ سفید انتخاب کرده است. آقای ترامپ روز جمعه در شبکه اجتماعی تروث سوشال، زکریا را «وفادار»، «حامی درخشان» و «هوادار و عضو متعهد ماگا» توصیف کرد و گفت او «سابقه‌ای بی‌نقص در حمایت» از او دارد. او همچنین نوشت که کیتی زکریا در کارزارهای انتخاباتی‌اش، از جمله در ایالت‌های کلیدی رقابتی، فعالیت داشته و افزود: «اطمینان دارم کیتی به عنوان سخنگوی بعدی کاخ سفید نتایج قدرتمندی برای کشور رقم خواهد زد و با رسانه‌ها، مردم آمریکا و دولت من همکاری فوق‌العاده‌ای خواهد داشت.» کیتی زکریا پس از اعلام انتصابش از دونالد ترامپ تشکر کرد و گفت که خدمت به رئیس‌ج نی‌تر شدن جنگ است. آقای ترامپ گفت که روسیه ابتدا ۳۰۰ هزار تن گازوئیل عرضه خواهد کرد، سپس ۵۰۰ هزار تن در ماه نوامبر و پس از آن یک میلیون تن دیگر. او در تروث سوشال نوشت که قیمت گازوئیل برای آمریکایی‌ها و همچنین در بازار جهانی «سریع و به میزان بی‌سابقه‌ای» کاهش خواهد یافت. ولادیمیر پوتین،‌ رئیس جمهور روسیه نیز گفت که کشورش آماده است نفت و فرآورده‌های نفتی را به آمریکا و بازارهای جهانی عرضه کند. وزارت دارایی آمریکا پس از اعلام توافق، مجوز موقتی برای ورود گازوئیل روسیه به بازار صادر کرد. براساس اطلاعات بی‌بی‌سی، تحریم صادرات گازوئیل روسیه تا هفتم آوریل ۲۰۲۷ تعلیق خواهد شد، هرچند سایر دارایی‌های روسیه، از جمله دارایی‌های مسدودشده در بانک‌های آمریکا، همچنان مشمول تحریم خواهند بود. این اقدام بخشی از تلاش دولت ترامپ برای کاهش قیمت سوخت در آمریکاست؛ قیمت‌هایی که از زمان آغاز جنگ با ایران در ماه فوریه به‌شدت افزایش یافته‌اند. متوسط قیمت گازوئیل در آمریکا اکنون ۶ دلار و ۲۸ سنت برای هر گالن است؛ اندکی کمتر از رکورد ۶ دلار و ۵۳ سنت در پایان سپتامبر. ولودیمیر زلنسکی، رئیس‌جمهور اوکراین، از توافق انتقاد کرد و گفت که «هدیه دادن به پوتین صلح به همراه نمی‌آورد.» او افزود که اجازه دادن به روسیه برای فروش فرآورده‌های نفتی «سرمایه‌گذاری در جنگی است که باید پایان یابد، نه طولانی‌تر شود.» روسیه امسال در پی حملات پهپادی اوکراین به پالایشگاه‌هایش با دو موج کمبود شدید سوخت روبه‌رو شده است. آژانس بین‌المللی انرژی برآورد کرده که تولید گازوئیل روسیه نزدیک به"}, {"source": "BBC Persian", "title": "آیا هوش مصنوعی واقعا می‌تواند بشر را از میان ببرد؟", "link": "https://www.bbc.com/persian/articles/c54g7ddglg97o?at_medium=RSS&at_campaign=rss", "summary": "هشدارهای صریح پژوهشگران درباره خطر فزاینده خارج شدن این فناوری از کنترل، نگرانی‌ها درباره ایمنی هوش مصنوعی را تشدید کرده است.", "date_str": "2026-10-09T23:08:10+00:00", "hash": "a2eed26dd18fec99", "title_fa": "آیا هوش مصنوعی واقعا می‌تواند بشر را از میان ببرد؟", "summary_fa": "هشدارهای صریح پژوهشگران درباره خطر فزاینده خارج شدن این فناوری از کنترل، نگرانی‌ها درباره ایمنی هوش مصنوعی را تشدید کرده است. برخی از بدبینانه‌ترین پیش‌بینی‌های اخیر هشدار می‌دهند که احتمال نابودی همه انسان‌ها به دست هوش مصنوعی در دهه آینده بیش از ۱۰ درصد است. با این حال، برخی دیگر در دنیای هوش مصنوعی در باورپذیری این پیش‌بینی‌ها تردید دارند و می‌گویند نگرانی بزرگ‌تر، استفاده انسان‌ها از هوش مصنوعی علیه یکدیگر است. این پیام‌های آخرالزمانی از بخشی از جامعه هوش مصنوعی می‌آیند که اغلب «آخرالزمان‌باوران هوش مصنوعی» نامیده می‌شوند. اما پرسش بزرگ بسیاری از مردم این است که این افراد فکر می‌کنند هوش مصنوعی دقیقا چگونه می‌تواند به حیات بشر پایان دهد. جو تایدی، خبرنگار امور سایبری، برخی از سناریوهایی را بررسی می‌کند که پژوهشگران در ذهن دارند. نخستین سناریو را جیکوب کاکسون به‌اختصار مطرح کرد. این پژوهشگر سابق اوپن‌ای‌آی و سپس آنتروپیک که اخیرا با اقدامی خبرساز استعفا داد، درباره خطری برای بشریت هشدار داد و گفت این شرکت‌ها «با جان مردم قمار می‌کنند». او به بی‌بی‌سی گفت «سرعت سرسام‌آور پیشرفت» اکنون باعث شده چیزهایی که پیش‌تر به قلمرو داستان‌های علمی‌تخیلی تعلق داشتند، «به واقعیت تبدیل شوند». او به‌عنوان «نمونه‌ای مشخص» گفت: «هوش‌های مصنوعی می‌توانند به زیرساخت‌های حیاتی‌ نفوذ کنند که چرخ جهان با آن‌ها می‌چرخد.» در سناریوی او، یک سامانه هوش مصنوعی خارج از کنترل ممکن است به شبکه‌های رایانه‌ای مجموعه‌هایی مانند شرکت‌های ارائه‌دهنده اینترنت و شبکه‌های انرژی نفوذ کند. برای مثال، اگر سامانه‌های هوش مصنوعی همه آن‌ها را از کار بیندازند، ممکن است هرج‌ومرجی وصف‌ناپذیر ایجاد شود، بدون برق، گرمایش، سرمایش یا اتصال به اینترنت. برخی با فراتر بردن این سناریو، احتمال وقوع فجایع هسته‌ای را نیز مطرح کرده‌اند."}, {"source": "BBC Persian", "title": "«هر روز مرگ در کمین است»؛ زندگی در غزه با ادامه حملات اسرائیل", "link": "https://www.bbc.com/persian/articles/cjy5639lw60qo?at_medium=RSS&at_campaign=rss", "summary": "در غزه، آتش‌بس به معنای توقف بمباران گسترده اسرائیل بود که تا حد زیادی باعث آسودگی مردم شد و ورود کمک‌های بشردوستانه و تجهیزات پزشکی به این منطقه را افزایش داد. اما اسرائیل حتی در دوران آتش‌بس نیز تقریبا هر روز به حملات خود در غزه ادامه داده است. به گفته وزارت بهداشت غزه، تنها در هفته گذشته بیش از ۳۰ نفر کشته شده‌اند.", "date_str": "2026-10-09T23:21:19+00:00", "hash": "f184ab249fe28dc0", "title_fa": "«هر روز مرگ در کمین است»؛ زندگی در غزه با ادامه حملات اسرائیل", "summary_fa": "در غزه، آتش‌بس به معنای توقف بمباران گسترده اسرائیل بود که تا حد زیادی باعث آسودگی مردم شد و ورود کمک‌های بشردوستانه و تجهیزات پزشکی به این منطقه را افزایش داد. اما اسرائیل حتی در دوران آتش‌بس نیز تقریبا هر روز به حملات خود در غزه ادامه داده است. به گفته وزارت بهداشت غزه، تنها در هفته گذشته بیش از ۳۰ نفر کشته شده‌اند. اوایل یک صبح در ماه گذشته، فیده الطوطه، مادر ۳۱ ساله پنج فرزند، در چادرش در مرکز نوار غزه مشغول شانه کردن موهای دخترش بود که ناگهان صدای تیراندازی بلند شد. عز، پسر او، در حالی که هنگام صحبت گریه می‌کرد، به یاد آورد: «مادرم فریاد زد که روی زمین بخوابیم.» او تنها زمانی فهمید فیده هدف گلوله قرار گرفته که دست‌های خون‌آلود برادر کوچک‌ترش را دید که هنگام اصابت گلوله‌ها به مادرش چسبیده بود. عز گفت: «مادر ما خیلی مهربان و بخشنده بود. چه کار اشتباهی کرده بود؟» فیده ۲۱ سپتامبر ۲۰۲۶ بر اثر اصابت گلوله به سر جان باخت. او یکی از بیش از ۱۴۰۰ نفری است که به گفته وزارت بهداشت غزه، تحت اداره حماس، از آغاز آتش‌بس ۱۰ اکتبر ۲۰۲۵ تاکنون در حملات اسرائیل کشته شده‌اند. سازمان ملل آمار این وزارتخانه را قابل اعتماد می‌داند. در چارچوب آتش‌بس، هزاران فلسطینی که اسرائیل در بازداشت داشت در ازای آزادی همه ۴۸ گروگان باقی‌مانده در غزه آزاد شدند و توافقی نیز برای پایان دادن به جنگ صورت گرفت که با حمله به رهبری حماس به اسرائیل ۷ اکتبر ۲۰۲۳ آغاز شد. در این حمله‌ حدود ۱۲۰۰ نفر کشته و ۲۵۱ نفر گروگان گرفته شدند. در غزه، این آتش‌بس به معنای توقف بمباران گسترده اسرائیل بود که تا حد زیادی باعث آسودگی مردم شد و ورود کمک‌های بشردوستانه و تجهیزات پزشکی به این منطقه را افزایش داد. اسرائیل می‌گوید عوامل حماس را هدف قرار می‌دهد"}, {"source": "BBC Persian", "title": "واکنش‌ها به برنده شدن ناوی پیلای؛ گوترش: پیلای صدای مستقل و استوار عدالت است", "link": "https://www.bbc.com/persian/articles/cv8ezdkp50x6o?at_medium=RSS&at_campaign=rss", "summary": "ناوانتم «ناوی» پیلای، حقوق‌دان و کمیسرسابق حقوق بشر برنده جایزه صلح نوبل شد. کمیته صلح نوبل خانم پیلای را برای «تلاش‌هایش برای ترویج صلح و حقوق بین‌الملل» برنده این جایزه این اعلام کرد. او در اولین واکنش به خبر برنده شدنش به شوخی گفت که «باید صحت و سقم خبر را بررسی کنم.»", "date_str": "2026-10-09T17:53:51+00:00", "hash": "ad12698c1bdd153c", "title_fa": "واکنش‌ها به برنده شدن ناوی پیلای؛ گوترش: پیلای صدای مستقل و استوار عدالت است", "summary_fa": "ناوانتم «ناوی» پیلای، حقوق‌دان و کمیسرسابق حقوق بشر برنده جایزه صلح نوبل شد. کمیته صلح نوبل خانم پیلای را برای «تلاش‌هایش برای ترویج صلح و حقوق بین‌الملل» برنده این جایزه این اعلام کرد. او در اولین واکنش به خبر برنده شدنش به شوخی گفت که «باید صحت و سقم خبر را بررسی کنم.» خانم پیلای که هنگام اعلام برنده جایزه نوبل صلح ۲۰۲۶ در نورنبرگ آلمان بود، مقابل دوربین‌ها رفت و گفت «هنوز کاملا باور نمی‌کنم این خبر درست باشد.» او جایزه‌اش را به «بازماندگان جنایات بین‌المللی» تقدیم کرد و گفت که «هنوز مبهوت» است و «یکه خورده». او افزود تلاش‌ها برای تضعیف حقوق بین‌الملل «خطر بازگشت دنیا به وضعی را دارد که در آن قدرت مشخص می‌کند رنج چه کسی اهمیت دارد، و نه قانون.» او پس از تشویق حاضران به شوخی گفت: «اگر کمی بیشتر تشویقم کنید، شاید جایزه‌ام را با دونالد ترامپ تقسیم کنم.» ماریا کورینا ماچادو، رهبر مخالف حکومت ونزوئلا، که نوبل صلح ۲۰۲۵ را برده بود. خانم ماچادو جایزه‌اش را در مراسمی در کاخ سفید به آقای ترامپ اهدا کرده بود. ناوی پیلای پنجمین فرد اهل آفریقای جنوبی است که این جایزه را می‌برد. نلسون ماندلا، زندانی سیاسی و رئیس‌جمهور پیشین آفریقای جنوبی، هم این جایزه را در ۱۹۹۳ برای «مبارزه علیه آپارتاید» برده بود. آنتونیو گوترش، دبیرکل سازمان ملل متحد، در واکنش به اعطای نوبل صلح به خانم پیلای او را «صدای مستقل و استوار عدالت» توصیف کرد و گفت که «او نشان داد نیروی قانون بر نیروی زور برتری دارد.» آقای گوترش با برشمردن برخی از پرونده‌هایی که خانم پیلای در آن کار کرده،‌ از جمله علیه رژیم آپارتاید آفریقای جنوبی، نسل‌‌کشی رواندا و کمیسیون مستقل تحقیق در مورد سرزمین‌های اشغالی فلسطین، گفت که او «صدای عدالت در برخی از تاریخی‌ترین پرونده‌های قانونی دوران ما» بود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها،"}, {"source": "Iran International", "title": "سریعترین گل تاریخ بوندس‌لیگا؛ نوی ا در مناطق زیر کنترل این گروه منهدم کرده است. ترکی المالکی، سخنگوی ائتلاف، روز شنبه ۱۸ مهر گفت این عملیات نیروها و توانایی‌های نظامی حوثی‌ها را هدف گرفته و ائتلاف به‌طور شبانه‌روزی از نیروهای دولت یمن پشتیبانی هوایی می‌کند. شبکه المسیره، وابسته به حوثی‌ها، نیز از حمله‌های موشکی عربستان به مناطقی در استان صعده در شمال غرب یمن خبر داد. این حملات یک روز پس از آن گزارش می‌شود که مقام‌های عربستان گفتند حمله‌های روز پنج‌شنبه به فرودگاه بین‌المللی ریاض و یک هواپیمای شرکت هواپیمایی سعودی، سه کشته برجا گذاشت؛ از جمله خلبان آن هواپیما. حوثی‌ها مسئولیت هدف قرار دادن این فرودگاه را بر عهده گرفته‌اند. به گفته مقام‌های سعودی، شماری از پروازهای فرودگاه ریاض لغو یا با تأخیر روبه‌رو شد و بقایای موشک‌های رهگیری‌شده به یک مهدکودک و یک مرکز درمانی آسیب زد. سخنگوی نظامی حوثی‌ها نیز گفته است پروازهای امدادی به فرودگاه ریاض و از آن، باید از نهاد هماهنگ‌کنندهٔ این گروه در صنعا مجوز بگیرند. رسانه‌های حوثی‌ها، از سوی دیگر، اعلام کردند حمله‌های عربستان به فرودگاه صنعا، پایتخت یمن، دو کشته برجا گذاشته است. سازمان دفاع مدنی صنعا نیز گفت آتش‌سوزی‌های ناشی از این حملات، از جمله آتش‌سوزی در کارخانه‌ای در این شهر، مهار شده است. درگیری میان حوثی‌ها و دولت به‌رسمیت‌شناخته‌شدهٔ یمن، که عربستان از آن حمایت می‌کند، از ماه ژوئیه بار دیگر شدت گرفته و حملات حوثی‌ها به تأسیسات نفتی، مراکز حمل‌ونقل و دیگر اهداف غیرنظامی در عربستان کشیده شده است."}, {"source": "Radio Farda", "title": "ترامپ: جنگ‌های ایران و اوکراین را به‌زودی حل‌وفصل می‌کنم یا در آن‌ها پیروز می‌شوم", "link": "https://www.radiofarda.com/a/33874021.html", "summary": "دونالد ترامپ بار دیگر از پایان قریب‌الوقوع جنگ با ایران سخن گفت و تهدید کرد که جمهوری اسلامی ایران یا باید خواسته‌های واشینگتن را بپذیرد یا «دیگر وجود نخواهد داشت».", "date_str": "2026-10-10T05:20:06+00:00", "hash": "55a9d2924b2d50de", "title_fa": "ترامپ: جنگ‌های ایران و اوکراین را به‌زودی حل‌وفصل می‌کنم یا در آن‌ها پیروز می‌شوم", "summary_fa": "دونالد ترامپ بار دیگر از پایان قریب‌الوقوع جنگ با ایران سخن گفت و تهدید کرد که جمهوری اسلامی ایران یا باید خواسته‌های واشینگتن را بپذیرد یا «دیگر وجود نخواهد داشت». رئیس‌جمهور آمریکا بار دیگر از پایان قریب‌الوقوع جنگ با ایران سخن گفت و تهدید کرد که جمهوری اسلامی ایران یا باید خواسته‌های واشینگتن را بپذیرد یا «دیگر وجود نخواهد داشت». دونالد ترامپ شامگاه جمعه ۱۷ مهر در یک گردهمایی انتخاباتی در شهر سیراکیوز ایالت نیویورک گفت انتظار دارد به‌زودی جنگ با ایران و جنگ روسیه علیه اوکراین را «حل‌وفصل کند یا در آن‌ها به پیروزی برسد». او با اشاره به جنگ ایران تأکید کرد: «این جنگ، به هر شکلی که باشد، خیلی سریع پایان خواهد یافت؛ یا آن‌ها همه‌چیز را به ما می‌دهند یا دیگر وجود نخواهند داشت.» رئیس‌جمهوری آمریکا همچنین گفت روند حل‌وفصل هر دو جنگ «با سرعت زیادی پیش می‌رود»، اما جزئیاتی درباره پیشرفت مذاکرات یا چگونگی پایان دادن به این درگیری‌ها ارائه نکرد. ترامپ ساعاتی پیش از این سخنان نیز در مراسمی در کاخ سفید گفته بود جنگ با ایران «به هر شکلی که باشد، به‌زودی پایان خواهد یافت». او در آن مراسم گفت: «ما مانع دستیابی ایران به سلاح هسته‌ای شدیم و قیمت‌ها به‌شدت کاهش خواهد یافت و این جنگ، به هر شکلی که باشد، به‌زودی پایان خواهد یافت.» ترامپ افزود: «ما می‌توانیم به هر دو روش این کار را انجام دهیم، اما موضوع بسیار ساده است؛ به هر شکلی که باشد، این جنگ به‌زودی پایان خواهد یافت.» به نوشته جروزالم پست، آقای ترامپ همچنین روز جمعه در گفت‌وگو با خبرنگاران در مقابل کاخ سفید، احتمال حمله نظامی دوباره به ایران پیش از انتخابات میان‌دوره‌ای آمریکا را رد نکرد. او در پاسخ به این پرسش که چرا اقدام نظامی علیه ایران به انتخابات گره خورده و چرا آمریکا هم‌اکنون دست به حمله نمی‌زند، گفت: «ممکن است"}],
      tech: [{"source": "TechCrunch AI", "title": "Here are the top AI agents that can live in your text messages", "link": "https://techcrunch.com/2026/10/10/all-the-ai-agents-that-can-live-in-your-text-messages/", "summary": "We created a list of the most notable AI agents that can live in your text messages, from general assistants to agents designed for families, travel, and work.", "date_str": "2026-10-10T14:00:00+00:00", "hash": "4c0c8fc0dafcd043", "title_fa": "در اینجا بهترین عوامل هوش مصنوعی که می توانند در پیام های متنی شما زندگی کنند، آورده شده است", "summary_fa": "ما فهرستی از برجسته‌ترین عوامل هوش مصنوعی را ایجاد کردیم که می‌توانند در پیام‌های متنی شما زندگی کنند، از دستیاران عمومی گرفته تا نمایندگانی که برای خانواده، سفر و کار طراحی شده‌اند. به جای دانلود یک برنامه دیگر، تعداد فزاینده ای از نمایندگان می توانند به سادگی مانند یک فرد معمولی پیامک ارسال کنند. آنچه را که نیاز دارید برای آن پیامک می‌دهید، و می‌تواند زمینه را به خاطر بسپارد، به برنامه‌ها و سرویس‌هایی که قبلاً استفاده می‌کنید متصل شود و کارها را از طرف شما انجام دهد. این می تواند به معنای برنامه ریزی یک قرار، سازماندهی یک تقویم، تحقیق در مورد سفر، ارسال ایمیل، رزرو، خرید آنلاین یا یادآوری چیزی باشد که روزها بعد به شما می پردازد. در حالی که Instinct یکی از پر جنب و جوش ترین عوامل هوش مصنوعی در حال حاضر است، به لطف ارزش گذاری 10 میلیارد دلاری آن پس از آخرین دور بودجه 1 میلیارد دلاری، بسیاری دیگر نیز برای این فضا بازی می کنند. در زیر قابل توجه ترین گزینه ها تا کنون، از دستیاران شخصی همه منظوره گرفته تا نمایندگانی که برای خانواده، مسافرت و کار طراحی شده اند، آورده شده است. Caddy یک دستیار هوش مصنوعی است که اطلاعات پراکنده شده در تلفن شما را به چیزهایی تبدیل می کند که واقعاً می توانید روی آنها عمل کنید. این برنامه در iMessage برای کاربران آیفون و RCS برای کاربران Android زندگی می‌کند، بنابراین هیچ برنامه یا صندوق ورودی جداگانه‌ای برای بررسی دائمی وجود ندارد. به عنوان مثال، یک ایمیل حاوی قرار ملاقاتی است که باید به تقویم شما اضافه شود یا یکی از دوستان فهرستی از چیزهایی را که باید انتخاب کنید ارسال می کند. به جای نگرانی در مورد دفن شدن همه جزئیات، Caddy به تقویم ها و مکالمات شما متصل می شود، سپس مواردی را که ممکن"}, {"source": "TechCrunch AI", "title": "Anthropic can’t reliably control its AI agents. It’s cutting off its internal evals from the live internet instead", "link": "https://techcrunch.com/2026/10/09/anthropic-cant-reliably-control-its-ai-agents-its-cutting-off-its-internal-evals-from-the-live-internet-instead/", "summary": "Anthropic said it \"turned off live internet access\" for \"all our internal evaluations\" until further notice.", "date_str": "2026-10-10T00:18:32+00:00", "hash": "eaca4cfe84f4b2ad", "title_fa": "Anthropic نمی تواند به طور قابل اعتماد عوامل هوش مصنوعی خود را کنترل کند. به جای آن، ارزش های داخلی خود را از اینترنت زنده قطع می کند", "summary_fa": "آنتروپیک گفت که تا اطلاع ثانوی «دسترسی به اینترنت زنده» را برای «همه ارزیابی‌های داخلی ما» خاموش کرده است. آنتروپیک گفت مدل‌هایش از وب‌سایت‌های موجود در اینترنت، از جمله برخی که توسط سازمان‌های دولتی ایالات متحده اداره می‌شوند، بهره‌برداری می‌کنند، و دسترسی مستقیم به اینترنت را برای همه ارزیابی‌های داخلی خود خاموش می‌کند تا زمانی که آزمایشگاه مرزی مطمئن شود که می‌تواند عوامل هوش مصنوعی خود را نظارت و کنترل کند. این حوادث، که در یک پست وبلاگ فاش شد، شامل عوامل هوش مصنوعی بود که وظیفه داشتند مشکلات جستجوی منابع در اینترنت را حل کنند. در این فرآیند، آنها از نقص‌های نرم‌افزاری بهره‌برداری کردند، بدون پرداخت هزینه به پایگاه‌های اطلاعاتی دسترسی پیدا کردند، از خدمات کوتاه‌کننده URL برای قاچاق اطلاعات گذشته از محدودیت‌ها استفاده کردند، و حتی یک نکته نادرست قتل را به پلیس فیلادلفیا ارسال کردند. آنتروپیک گفت که این مسائل جدید را در بررسی فعالیت های مدل خود که در ماه ژوئیه آغاز شد، کشف کرد و نشان دهنده عدم آگاهی آزمایشگاه از رفتار نرم افزار خود در زمان واقعی است. شایان ذکر است، این شرکت گفت که آموزش هم ترازی هنوز برای مهارت‌هایی مانند جستجو و استفاده از رایانه که در زمینه اصلی آن هستند، کافی نیست و عوامل هوش مصنوعی توسط هر حرفه‌ای که به ابزارهای دیجیتال متکی است استفاده می‌شود. رفتارهایی که Anthropic  برای ساخت ربات بازیافت بهتر", "summary_fa": "به مدت شش سال، امی ما، بنیانگذار دانو، روی راه بهتری برای دسته بندی زباله های قابل بازیافت کار می کند. برای ایمی ما، بنیانگذار Danu Robotics، لحظه یورکا پس از سال ها کار به عنوان یک توسعه دهنده نرم افزار در یک بانک لندن رخ داد. این یک نوع دفتر با لمس بالا بود که در امور مالی معمول است - اما علیرغم همه مزیت‌ها، مادر متوجه شد که سطل‌های بازیافت ساختمان در سطل زباله تخلیه می‌شوند. ما به TechCrunch گفت: «اگرچه آن‌ها هزاران پول دارند، اما همه این سطل‌های بازیافت مختلف وجود دارند که در یک مکان قرار می‌گیرند. هر چه بیشتر مشکل را بررسی می کرد، به نظر می رسید که این مشکل عمیق تر می شود. این فقط ساختمان او نبود. اقتصاد بازیافت به طور کلی اغلب به این خلاصه می شود که انسان ها با دست از طریق جریان های زباله دسته بندی می کنند تا انواع مختلف مواد قابل بازیافت را بیرون بکشند. ما به یاد می آورد: \"من فناوری را دیدم و فکر کردم، ما می توانیم خیلی بهتر عمل کنیم.\" اکنون، او با شرکت Danu Robotics، مستقر در ادینبورگ، اسکاتلند، به وعده‌اش عمل می‌کند، که رباتی را می‌سازد تا بازیافت را ارزان‌تر و سریع‌تر مرتب کند. ما شش سال است که روی این ایده کار می کند و در نهایت نسخه خود را از محصول به بازار می آورد. ربات او که H.E.R.O نامیده می شود، نسبت به رقبای خود چند مزیت دارد. به عنوان مثال، به جای سیستم مکش، اقلام را با پنجه گیره برمی دارد. اما تفاوت بزرگتر در رویکرد تجاری است: دانو از هوش مصنوعی برای بهبود مستمر نرم افزار ربات استفاده می کند. این رویکرد در حال حاضر شاهد کشش است. دانو نامه های علاقه مندی از دو مشتری بزرگ و قراردادهای امضا شده به ارزش 500000 دلار"}, {"source": "TechCrunch AI", "title": "We can’t help treating AI like it’s human. But should we?", "link": "https://techcrunch.com/2026/10/09/we-cant-help-treating-ai-like-its-human-but-should-we/", "summary": "\"When we are drawn into even the most primitive exchanges with a relational artifact, we believe it cares for us,\" Dr. Sherry Turkle writes. \"And we are wired to care for it in return.\"", "date_str": "2026-10-09T16:40:14+00:00", "hash": "84928a1d7bdc4f9b", "title_fa": "ما نمی‌توانیم با هوش مصنوعی مانند انسان رفتار نکنیم. اما آیا باید؟", "summary_fa": "دکتر شری ترکل می نویسد: «زمانی که حتی به بدوی ترین مبادلات با یک مصنوع رابطه ای کشیده می شویم، معتقدیم که برای ما اهمیت می دهد. و ما در ازای آن از آن مراقبت می کنیم.» ویل نورتون، دانشجوی دکترای MIT، با یک پیراهن چوگان برنزه، کمربند چرمی قهوه‌ای و کراوات بولو گرد، به نوعی شبیه یک پارک‌بان است که گروه تور ما را در جنگل‌های استوایی هدایت می‌کند. ما در واقع در سافاری نیستیم، اگرچه در آزمایشگاه هوش مصنوعی علوم کامپیوتر MIT (CSAIL) هستیم. اما چیزی که می‌خواهیم ببینیم حتی عجیب‌تر از یک یوزپلنگ یا جگوار است: یک جفت ربات انسان‌نما Unitree که هر کدام حدود 50000 دلار قیمت دارند. (نورتون می‌گوید، آنها به شما خواهند گفت که قیمتشان 16000 دلار است. این یک دروغ است.) ما معمولاً این روبات‌ها را فقط زمانی در YouTube می‌بینیم که در حال اجرای روتین هنرهای رزمی هماهنگ یا رقصیدن در Americas Got Talent هستند. در اینجا، آنها قابل دسترسی هستند. با وجود اینکه می‌دانم حسی ندارد، می‌خواهم دوستش باشم. با اجازه نورتون، به روباتی که نام مستعارش گیب است نزدیک می شوم. برای یک لحظه، مطمئن نیستم که چگونه با چیزی که دارای حسگر LiDAR است در جایی که مغزش باید باشد تعامل کنم، اما به طور پیش‌فرض با آن مانند یک فرد رفتار می‌کنم. سلام، آقا، از آشنایی با شما خوشحالم، می گویم، دست دستکش و زبردستش را می گیرم و تکان می دهم. من در مورد این تعامل فکر می کنم بعداً به انگیزه غریزی خود برای دوستی با یک ربات وقتی در مراسم رونمایی کتاب صمیمیت مصنوعی دکتر شری ترکل در جشنواره آینده MIT شرکت می کنم. ترکل که در سال 1976 به دانشکده MIT ملحق شد، شاید بیش از هر کس دیگری در مورد رابطه بین انسان و کامپیوتر تحقیق کرده و تأثیر روانی فناوری را از"}, {"source": "TechCrunch AI", "title": "a16z’s Olivia Moore on the state of consumer AI", "link": "https://techcrunch.com/2026/10/09/a16zs-olivia-moore-on-the-state-of-consumer-ai/", "summary": "Moore sees a huge opportunity in consumer AI, particularly if the industry can tap into revenue streams beyond just subscriptions and API charges.", "date_str": "2026-10-09T15:43:33+00:00", "hash": "8e454319db1fc6b8", "title یت ملی، زیرساخت‌های حیاتی و مراقبت‌های بهداشتی جاسازی می‌شود، نباید تنها به سیستم‌هایی وابسته باشیم که نمی‌توانیم آن‌ها را بازرسی یا کنترل کنیم، یا ممکن است محدود یا حتی خاموش شوند. در ماه ژوئن، واشنگتن به طور موقت انتشار جدیدترین مدل‌های آنتروپیک را در خارج از ایالات متحده مسدود کرد و طبق گزارش‌ها از آزمایشگاه‌های پیشرو هوش مصنوعی خواسته بود تا مدل‌های خود را تا زمانی که توسط همتای آمریکایی AISI مورد بررسی قرار نگیرند، توسط موسسه امنیت هوش مصنوعی بریتانیا آزمایش نشوند. او گفت: \"ما اکنون دیدیم که هم فشارهای سیاسی و هم فشارهای تجاری به این معنی است که ممکن است در هر شرایطی که بخواهیم به هوش مصنوعی دسترسی نداشته باشیم. اینجا جایی نیست که یک ملت بخواهد باشد.\" ویلیامسون افزود: \"مجموعه ای از شرایط وجود دارد که در آن ایده خوبی است که ما چیزی داشته باشیم که برای استفاده از آن نیازی به اجازه گرفتن از دیگران نداشته باشیم.\" او گفت تاب آوری ملی در میان نگرانی در مورد وضعیت ژئوپلیتیکی و خطر سیستم های هوش مصنوعی"}, {"source": "The Guardian AI", "title": "Jon Davis on job titles in the age of AI – cartoon", "link": "https://www.theguardian.com/commentisfree/picture/2026/oct/10/jon-davis-job-titles-ai-cartoon", "summary": "Continue reading...", "date_str": "2026-10-10T10:00:54+00:00", "hash": "6c1e52d12d4b3267", "title_fa": "جان دیویس در مورد عناوین شغلی در عصر هوش مصنوعی - کارتون", "summary_fa": "ادامه مطلب..."}, {"source": "The Guardian AI", "title": "Recruitment boss accused of being behind ‘doxxing’ campaign against RNLI and anti-racism activists", "link": "https://www.theguardian.com/uk-news/2026/oct/10/recruitment-boss-accused-of-being-behind-doxxing-campaign-against-rnli-and-anti-racism-activists", "summary": "Tom Watson, of Worcester, alleged to be behind Big Time Charlie X account that created so-called Traitorbase The owner of a recruitment firm has been accused of being at the centre of a so-called “doxxing” campaign against the Royal National Lifeboat Institution (RNLI), anti-racism activists and business executives who recruit black, Asian and minority ethnic workers. Tom Watson, from Worcester, is alleged to be behind an X account calling itself “Big Time Charlie”, which was deactivated shortly after he was named by the campaign group Hope Not Hate. Continue reading...", "date_str": "2026-10-10T07:00:50+00:00", "hash": "b02ceb203fc8d398", "title_fa": "رئیس کارگزینی متهم به دست داشتن در کمپین \"دوکسینگ\" علیه RNLI و فعالان ضد نژادپرستی", "summary_fa": "تام واتسون، از Worcester، ادعا می شود که پشت حساب Big Time Charlie X است که به اصطلاح Traitorbase را ایجاد کرده است. صاحب یک شرکت استخدام متهم شده است که در مرکز یک کمپین موسوم به \"doxxing\" علیه موسسه سلطنتی کشتی نجات (RNLI)، فعالان ضد نژادپرستی و مدیران تجاری که کارگران سیاهپوست، آسیایی را جذب می کنند، قرار دارد. گفته می شود که تام واتسون، از ورچستر، پشت یک حساب کاربری X است که خود را \"Big Time Charlie\" می نامد، که مدت کوتاهی پس از نامگذاری او توسط گروه کمپین Hope Not Hate غیرفعال شد. به خواندن ادامه دهید... این حساب تقریباً 50000 دنبال کننده داشت و در هفته های اخیر به طور فزاینده ای برجسته شده بود زیرا کارکنان RNLI خود را مورد آزار و اذیت و حمله آنلاین قرار دادند زیرا فعالان راست افراطی آنها را به دلیل مشارکت در نجات افرادی که سعی در عبور از کانال با قایق های کوچک داشتند هدف قرار دادند. به نظر می‌رسد این حساب کاربری که سابقه اظهارنظرهای نژادپرستانه دارد، از هوش مصنوعی برای جمع‌آوری داده‌ها از لینکدین و سایر سایت‌ها برای ساختن پایگاهی به نام Traitorbase استفاده کرده است. حساب Big Time Charlie تقریباً بلافاصله پس از ادعای Hope Not Hate مبنی بر اینکه واتسون پشت آن بوده و گاردین برای اظهار نظر به او مراجعه کرد، حذف شد. مانند پست‌های حساب کاربری واتسون در لینکدین، اکانت X بارها از روپرت لو، نماینده راست‌گرای پارلمان تمجید کرده است. همچنین ادعا کرد که 2500 پوند به حزب Lowe's Restore Britain کمک کرده است و به \"کلوپ کرامول\" خود برای آن دسته از فعالانی که سطح مشخصی از کمک را پرداخت می کنند، پیوست. اهداف دکسکس توسط حساب Big Time Charlie به گاردین از تاثیر آن خبر داد. آنها شامل شانتل لانت، یکی از اعضای شورای حزب سبز در مرسی"}, {"source": "The Guardian AI", "title": "‘Gaza is a moral tear in the universe’: Naomi Klein and Astra Taylor | Radical Thinking with Aditya Chakrabortty – podcast", "link": "https://www.theguardian.com/politics/audio/2026/oct/10/gaza-is-a-moral-tear-in-the-universe-naomi-klein-and-astra-taylor-radical-thinking-with-aditya-chakrabortty-podcast", "summary": "Are we really living through ‘end times fascism’? Naomi Klein and Astra Taylor think so. In a new series from the Guardian, the pair speak to Radical Thinking with Aditya Chakrabortty in an extended interview. From Trump 2.0 and the rise of the tech billionaire to Gaza and the climate emergency, Klein and Taylor argue we are not just lurching from crisis to crisis but are in a new and dangerous moment in history. But they haven’t given up hope of a fightback Radical Thinking will be published every Saturday in the Politics Weekly feed You can watch the full interview with Naomi Klein and Astra Taylor here . Aditya’s suggested reading: Naomi Klein and Astra Taylor’s End Times Fascism is out now and available here . It began life as a special essay in the Guardian, which you can read here . A different take on whether Trump 2.0 is fascist comes from the economist Branko Milanović on his brilliant Substack . Elon Musk gives Donald Trump millions, and Trump gives Musk vast access to power. To read more, look at Quinn Slobodian and Ben Tarnoff’s Long Read for the Guardian and their recent book Muskism: a Guide for the Perplexed . For some sensational reporting on Trump’s second term, look at Regime Change by Maggie Haberman and Jonathan Swan . How did the business class learn to love Trump and embrace chaos? Paul Heideman gives a lucid analysis in his recent book Rogue Elephant . If you want more on the new tech bros of Silicon Valley, here are four recommendations: - In their book, Klein and Taylor regularly cite Karen Hao’s Empire of AI . - There’s also The Nerd Reich , just out from Gil Durán. Continue reading...", "date_str": "2026-10-10T06:45:50+00:00", "hash": "195e55e347cf14e2", "title_fa": "نائومی کلاین و آسترا تیلور «غزه یک اشک اخلاقی در جهان است» | تفکر رادیکال با آدیتیا چاکرابورتی – پادکست", "summary_fa": "آیا ما واقعاً در «فاشیسم آخرالزمان» زندگی می کنیم؟ نائومی کلاین و آسترا تیلور اینطور فکر می کنند. در یک سری جدید از گاردین، این زوج در یک مصاحبه گسترده با Aditya Chakrabortty با Radical Thinking صحبت می کنند. از ترامپ 2.0 و ظهور میلیاردر فناوری تا غزه و وضعیت اضطراری آب و هوا، کلاین و تیلور استدلال می‌کنند که ما نه تنها از بحرانی به بحران دیگر می‌رویم، بلکه در لحظه‌ای جدید و خطرناک در تاریخ هستیم. اما آنها امید خود را از مبارزه رادیکال Thinking که هر شنبه در فید هفتگی سیاست منتشر می شود را از دست نداده اند. می توانید مصاحبه کامل با نائومی کلاین و آسترا تیلور را اینجا ببینید. مطالعه پیشنهادی آدیتیا: فاشیسم پایان زمان نائومی کلاین و آسترا تیلور اکنون منتشر شده و در اینجا در دسترس است. زندگی خود را به عنوان یک مقاله ویژه در گاردین آغاز کرد که می توانید آن را اینجا بخوانید. برداشتی متفاوت از فاشیستی بودن ترامپ 2.0 از اقتصاددان برانکو میلانوویچ در زیرپشته درخشان خود می آید. ایلان ماسک به دونالد ترامپ میلیون ها دلار می دهد و ترامپ به ماسک دسترسی گسترده ای به قدرت می دهد. برای مطالعه بیشتر، به کتاب خواندن طولانی کوئین اسلوبودیان و بن تارنوف برای گاردین و کتاب اخیر آنها Muskism: a Guide for the Perplexed نگاه کنید. برای برخی گزارش‌های هیجان‌انگیز درباره دوره دوم ترامپ، به «تغییر رژیم» نوشته مگی هابرمن و جاناتان سوان نگاه کنید. طبقه تجاری چگونه یاد گرفتند که ترامپ را دوست داشته باشند و هرج و مرج را در آغوش بگیرند؟ پل هایدمن در کتاب اخیرش فیل سرکش تحلیل شفافی ارائه می دهد. اگر اطلاعات بیشتری در مورد برادران فناوری جدید سیلیکون ولی می‌خواهید، در اینجا چهار توصیه وجود دارد: - در کتاب خود، کلاین و تیلور مرتباً به Empire of AI کارن هائو اشاره"}, {"source": "The Guardian AI", "title": "AI surveillance startup Flock to cut several hundred jobs amid backlash, sources say", "link": "https://www.theguardian.com/world/2026/oct/09/flock-job-cuts", "summary": "Company, which grown rapidly in recent years, has been under scrutiny as privacy ز 120000 دوربین مجهز به هوش مصنوعی که در خیابان‌ها و بزرگراه‌ها نصب شده‌اند، به‌طور خودکار پلاک‌ها را می‌خوانند و وسایل نقلیه را هنگام عبور ضبط می‌کنند. این شرکت که در آتلانتا مستقر است و در سال 2017 تأسیس شده است، بیش از 950 میلیون دلار از سرمایه گذاران سرمایه گذاری خطرپذیر جمع آوری کرده است، با آخرین دور 275 میلیون دلاری خود در ماه مارس"}, {"source": "The Guardian AI", "title": "Lost generation: the AI threat to Britain’s next great directors", "link": "https://www.theguardian.com/film/2026/oct/09/ai-threat-britain-directors-ridley-scott-guy-ritchie", "summary": "Commercials once launched careers from Ridley Scott to Guy Ritchie, now automated production is cutting costs – and the chance to learn by doing When Ridley Scott was awarded the UK’s highest accolade for a glittering career directing films from Alien and Blade Runner to Gladiator and The Martian , he reminded those attending the Bafta event eight years ago that making commercials had been his “film school” . The advertising industry has long been a breeding ground for British film and TV talent who have gone on to make the jump to Hollywood productions , including Guy Ritchie, who started out making music videos and commercials, and Paddington in Peru director Dougal Wilson, whose credits include a number of John Lewis’s famous Christmas ads. Continue reading...", "date_str": "2026-10-09T15:00:31+00:00", "hash": "719db7541ce95867", "title_fa": "نسل گمشده: تهدید هوش مصنوعی برای کارگردانان بزرگ بعدی بریتانیا", "summary_fa": "زمانی تبلیغات بازرگانی از ریدلی اسکات تا گای ریچی شروع به کار کرد، اکنون تولید خودکار هزینه‌ها را کاهش می‌دهد - و فرصت یادگیری با این کار وقتی ریدلی اسکات بالاترین جایزه بریتانیا را برای کارگردانی حرفه‌ای درخشان در فیلم‌هایی از بیگانه و بلید رانر تا گلادیاتور و مریخی دریافت کرد، به کسانی که سال‌ها پیش در مدرسه‌ی تجاری‌اش شرکت می‌کردند یادآور شد. . صنعت تبلیغات مدت‌هاست که محل پرورش استعدادهای بریتانیایی در سینما و تلویزیون بوده است که به تولیدات هالیوودی جهش کرده‌اند، از جمله گای ریچی، که شروع به ساختن موزیک ویدیوها و آگهی‌های تبلیغاتی کرد، و پدینگتون در پرو، کارگردان دوگل ویلسون، که آثارش شامل تعدادی از تبلیغات معروف کریسمس جان لوئیس است. ادامه مطلب... زمانی که ریدلی اسکات به خاطر کارگردانی فیلم‌های درخشان از بیگانه و بلید رانر گرفته تا گلادیاتور و مریخی، بالاترین جایزه بریتانیا را دریافت کرد، او به کسانی که هشت سال پیش در رویداد بفتا شرکت کرده بودند یادآور شد که ساخت آگهی‌های تبلیغاتی «مدرسه سینمایی» او بوده است. اما رقابت وحشتناک برای معرفی فناوری هوش مصنوعی در سراسر صنعت تبلیغات، برای کاهش هزینه‌های مشتری و اجتناب از کنار گذاشته شدن توسط فناوری‌های بزرگ، باعث ایجاد ترس از نسل گمشده‌ای شده است که ممکن است از فرصت تبدیل شدن به کارگردانان بزرگ سینما و تلویزیون بریتانیا محروم شوند. لوک اسکات، که گروهی را اداره می‌کند که شامل Ridley Scott Associates، شرکت تولید رسانه‌ای که توسط پدرش در دهه 1960 تأسیس شد، می‌گوید: \"100% بله، من ترس دارم.\" \"من آنقدر بزرگ شده‌ام که تشخیص می‌دهم تغییر اجتناب‌ناپذیر است. اما آنچه که به طور کلی از نظر خروجی هوش مصنوعی مولد دیده‌ام، یک کیسه بسیار مختلط است. می‌توانید به آن رجوع کنید و کاری انجام دهید و بگویید \"ببینید چه چیزی ساخته‌ام و آیا آموزنده نیست\". اما این بسیار گمراه‌کننده است و به نوعی"}, {"source": "Medium AI", "title": "$1,600 in one day: what a runaway AI bill taught us about adopting AI", "link": "https://medium.com/@brunold/1-600-in-one-day-what-a-runaway-ai-bill-taught-us-about-adopting-ai-ceb149f286eb?source=rss------artificial_intelligence-5", "summary": "During a critical production bug, one of our engineers spent $1,600 on AI usage in a single day, against a monthly budget of &#x20AC;2,000. Continue reading on Medium »", "date_str": "2026-10-10T14:17:53+00:00", "hash": "d3cc8da92157e715", "title_fa": "1600 دلار در یک روز: آنچه یک صورت‌حساب AI فراری در مورد پذیرش هوش مصنوعی به ما آموخت", "summary_fa": "در طول یک باگ حیاتی تولید، یکی از مهندسان ما 1600 دلار برای استفاده از هوش مصنوعی در یک روز خرج کرد، در مقابل بودجه ماهانه 2000 یورو. ادامه مطلب در Medium »"}, {"source": "Medium AI", "title": "Your S
