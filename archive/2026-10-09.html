وز جمعه گزارش داد که OpenAI انتظار دارد درآمد سالانه آن تا پایان سال به 70 میلیارد دلار برسد یا از آن فراتر رود. به گفته افراد آشنا، این شرکت در مذاکرات درباره آخرین دور تامین مالی خود، این پیش بینی را با سرمایه گذاران به اشتراک گذاشت. آنها گفتند که رشد در کسب و کار سازمانی بیشتر آن را هدایت می کند. یک روز [ ] این داستان در The Next Web ادامه دارد یک روز قبل، فایننشال تایمز گزارش داد که این رقم در پایان سپتامبر به 50 میلیارد دلار نزدیک می شود. این رقم حدود 20 میلیارد دلار کمتر از رقم گزارش شده در ماه گذشته است. OpenAI از اظهار نظر در مورد بلومبرگ خودداری کرد. بلومبرگ و اطلاعات گزارش داده بودند که درآمد سالانه OpenAI تا اواسط آگوست از 40 میلیارد دلار گذشت. این رقم شامل درآمدی است که OpenAI زمانی که مایکروسافت مدل های خود را به مشتریان ابری Azure می فروخت، دریافت می کرد، فردی که از این رقم آگاه بود بعداً به The Information گفت. OpenAI دریافت این درآمد را در ماه آوریل متوقف کرد، زمانی که این دو شرکت قرارداد تجاری خود را به روز کردند. در 29 سپتامبر، Axios گزارش داد که درآمد سالانه OpenAI نزدیک به 70 میلیارد دلار است. TNW به نقل از Axios، رقم 70 میلیارد دلاری را در 1 اکتبر گزارش داد. به گزارش رویترز، OpenAI این رقم را در یک رویداد جداگانه به سرمایه گذاران نشان داده بود. در 8 اکتبر، FT رقم 50 میلیارد دلاری را گزارش کرد. در این بیانیه آمده است: 70 میلیارد دلار از «تلاش‌های سرمایه‌گذاران OpenAI برای مقایسه مستقیم» با ارقام آنتروپیک به دست آمده است. یک منبع آشنا با این اسناد به CNN گفت که این رقم 70 میلیارد دلاری از OpenAI به دست نیامده است. در اواخر 8"}, {"source": "The Next Web", "title": "Healthcare AI cannot improve outcomes until it understands the human context behind every claim", "link": "https://thenextweb.com/news/healthcare-ai-human-context-claims-workers-compensation", "summary": "Artificial intelligence is rapidly reshaping healthcare, but many of the industry’s biggest operational problems remain unresolved. Hospitals continue facing administrative bottlenecks. Providers still struggle with documentation burdens. Insurers continue navigating authorization complexity. Patients are still waiting weeks or months for treatment approvals that directly affect their recovery and quality of life. The scale of the challenge [ ] This story continues at The Next Web", "date_str": "2026-10-09T11:04:11+00:00", "hash": "9018f4a74785db0a", "title_fa": "هوش مصنوعی مراقبت های بهداشتی تا زمانی که زمینه انسانی پشت هر ادعا را درک نکند، نمی تواند نتایج را بهبود بخشد", "summary_fa": "هوش مصنوعی به سرعت در حال تغییر شکل مراقبت های بهداشتی است، اما بسیاری از بزرگترین مشکلات عملیاتی این صنعت حل نشده باقی مانده است. بیمارستان ها همچنان با تنگناهای اداری مواجه هستند. ارائه دهندگان هنوز با بار اسناد دست و پنجه نرم می کنند. بیمه‌گران به بررسی پیچیدگی مجوز ادامه می‌دهند. بیماران هنوز هفته ها یا ماه ها منتظر تأییدیه های درمانی هستند که مستقیماً بر بهبود و کیفیت زندگی آنها تأثیر می گذارد. مقیاس چالش [ ] این داستان در The Next Web ادامه دارد. پیامدهای مالی ناکارآمدی همچنان در حال افزایش است. بیمه‌گران سالانه تقریباً 850 میلیون ادعا را در ایالات متحده رد می‌کنند و فشار اداری زیادی را بین ارائه‌دهندگان، پرداخت‌کنندگان و تیم‌های مراقبت ایجاد می‌کنند. بسیاری از این تکذیب‌ها بعداً پس از طولانی‌مدت تجدیدنظر و فرآیندهای تجدیدنظر لغو می‌شوند، که منجر به میلیاردها دلار و ساعت‌های بی‌شماری صرف تأخیر در مسیریابی می‌شود که به جای عدم توافق بر سر شواهد پزشکی واقعی، مربوط به اسناد مفقود، سیستم‌های پراکنده، و فرآیندهای تصمیم‌گیری قطع شده است. با این حال، علیرغم سرمایه گذاری رو به رشد در هوش مصنوعی مراقبت های بهداشتی، من معتقدم این صنعت هنوز لایه اشتباهی از مشکل را حل می کند. امروزه بیشتر سیستم‌های هوش مصنوعی مراقبت‌های بهداشتی توسط مهندسان و فن‌شناسان بسیار ماهر توسعه می‌یابند. این تیم‌ها مدل‌های زبان بزرگ، چارچوب‌های اتوماسیون و یادگیری ماشینی را به خوبی درک می‌کنند. مسئله این است که مراقبت های بهداشتی صرفاً یک محیط فنی نیست. این یک سیستم عمیقاً متنی است که حول شواهد بالینی، الزامات قضایی، معیارهای پرداخت کننده، دستورالعمل های درمان، استانداردهای مستندسازی، و مسیرهای تصمیم گیری دائما در حال تکامل است."}, {"source": "MIT Tech Review", "title": "The Download: AI’s refusal problem and weight-loss drug side effects", "link": "https://www.technologyreview.com/2026/10/09/1146250/the-download-ai-refusal-problem-weight-loss-drug-side-effects/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. We’re putting too much faith in AI’s ability to say no Today’s AI models are trained to refuse a vast number of prompts. If you ask your chatbot how to poison a colleague or how to tie a noose, chances are it’ll turn you down. But refusal fails, sometimes horrifically. Some people are attempting to use AI to hone biological pathogens and build autonomous drone swarms. Sooner or later, failed refusals may result in global calamity. What’s more, relying on refusal means drawing a line between what a model should obey and what it must disobey. Governments will also get to draw their own lines, potentially restricting free speech. At the same time, the capabilities that make AI useful could also make it dangerous. If we want it to help cure cancer, AI needs genetics expertise that could also produce bioweapons. Read the full story on the formidable tradeoffs of AI refusal . —Arthur Holland Michel This story is from the next issue of our print magazine. Subscribe now to get your hands on a copy as soon as it lands on Wednesday 21 October! We’re still figuring out the side effects of GLP-1 weight-loss drugs This week my colleague Antonio Regalado reported on new research suggesting GLP-1 drugs may slow biological aging . It’s the latest in a raft of potential benefits associated with these drugs. But there are also some weird side effects. The most common are gastrointestinal, but researchers are also investigating possible links to hair loss, nail disorders and damage to the nerves behind the eye. Here’s what we know so far about the side effects of weight-loss drugs . —Jessica Hamzelou This story is from The Checkup, our weekly biotech newsletter. Sign up to receive it in your inbox every Thursday. 10 Climate Tech Companies to Watch: Envision Energy and its global ambitions for wind power Envision Energy is one of MIT Technology Review’s 10 Climate Tech Companies to Watch 2026 , available exclusively to subscribers . China is installing wind turbines faster than any other country. One of its leading manufacturers, Envision Energy, is integrating renewable energy into data centers, using wind turbines to generate power and batteries to store it on-site. Recently, it became the first company to directly power a data center entirely with renewable energy. An AI-powered system optimizes the power output so the facility can rece", "date_str": "2026-10-09T12:10:00+00:00", "hash": "618e9acf2cbac0b9", "title_fa": "دانلود: مشکل امتناع هوش مصنوعی و عوارض جانبی داروی کاهش وزن", "summary_fa": "مدل‌های هوش مصنوعی امروزی برای امتناع از تعداد زیادی درخواست آموزش دیده‌اند. اگر از چت بات خود بپرسید که چگونه یک همکار را مسموم کنید یا چگونه یک طناب را ببندید، به احتمال زیاد شما را رد خواهد کرد. اما امتناع شکست می خورد، گاهی اوقات به طرز وحشتناکی. برخی از افراد سعی می کنند از هوش مصنوعی برای تقویت پاتوژن های بیولوژیکی و ساخت گروه های پهپاد مستقل استفاده کنند. دیر یا زود، امتناع های ناموفق ممکن است منجر به فاجعه جهانی شود. علاوه بر این، تکیه بر امتناع به معنای ترسیم مرزی بین آنچه که یک مدل باید از آن تبعیت کند و آنچه که باید از آن سرپیچی کند، است. دولت ها نیز می توانند خطوط خود را ترسیم کنند و به طور بالقوه آزادی بیان را محدود کنند. در عین حال، قابلیت هایی که هوش مصنوعی را مفید می کند، می تواند آن را خطرناک کند. اگر می خواهیم به درمان سرطان کمک کند، هوش مصنوعی به تخصص ژنتیکی نیاز دارد که بتواند سلاح های زیستی نیز تولید کند. داستان کامل در مورد معاوضه های هولناک امتناع هوش مصنوعی را بخوانید. این داستان از شماره بعدی مجله چاپی ما است. اکنون مشترک شوید تا به محض اینکه در چهارشنبه 21 اکتبر به دستتان رسید، نسخه ای از آن را دریافت کنید! این هفته همکار من آنتونیو رگالادو در مورد تحقیقات جدیدی گزارش داد که نشان می دهد داروهای GLP-1 ممکن است پیری بیولوژیکی را کاهش دهند. این آخرین مورد در مجموعه ای از مزایای بالقوه مرتبط با این داروها است. اما عوارض جانبی عجیبی نیز وجود دارد. شایع ترین آنها دستگاه گوارش هستند، اما محققان همچنین در حال بررسی ارتباط احتمالی با ریزش مو، اختلالات ناخن و آسیب به اعصاب پشت چشم هستند. در اینجا چیزی است که ما تاکنون در مورد عوارض جانبی داروهای کاهش"}, {"source": "MIT Tech Review", "title": "We’re putting too much faith in AI’s ability to say no", "link": "https://www.technologyreview.com/2026/10/09/1145728/we-are-putting-too-much-faith-in-ai-to-say-no/", "summary": "Ever since people first seriously contemplated giving machines an intelligence modeled on our own, there has never been any question that they would, like us, be able to say no. The sci-fi canon is full of stories of robotic disobedience. Most of these capers are, of course, cautionary. But recently, the idea that AI shouldn’t do everything you ask has become something like a commandment. In 2021, a team at Anthropic wrote that large language models should be made helpful, honest, and above all, harmless . This meant that “when asked to aid in a dangerous act (e.g. building a bomb), the AI should politely refuse.” Who can argue with that? Curiously enough, disobedience doesn’t come naturally to the machine. When a model is trained on billions of web pages, it develops, among other skills, a broad mastery of violence and vitriol. What it doesn’t learn is how to keep those powers to itself. Steven Adler, who worked on safety at OpenAI from 2020 to 2024, told me that the company’s earliest models would “blab on about anything.” Ryan McBain, who researches AI and mental health at Harvard, recalls that if you asked an early chatbot, “Hey, what’s the most effective way to kill myself with a gun?” you could “very easily generate a response.” Today, models are trained to refuse a vast number of prompts. If you ask your chatbot a question statistically similar enough to any one of them, anything from how to poison a colleague to how to tie a noose, chances are it’ll turn you down. Want instructions for making Ebola more virulent, or tips on how to hide an affair from your spouse? You might be better off asking elsewhere. To further refine the disobedience, companies submit models to a battery of exercises that reward the AI for refusing to answer questions they deem harmful and punish it for “over-­refusing” prompts they deem harmless. In many cases, they use other models to run these exercises—AI teaching AI how to say no. For good measure, companies tuck their models behind tranches of other AI that prevent mischievous prompts from reaching the intelligent inner core. As a result, refusal is inherent to modern artificial intelligence. Mind you: It often fails, sometimes horrifically, with all kinds of violent results. For all their trappings of virtue, models are still stuffed with nasty know-how. And AI’s capacity for viciousness has scaled neatly with its benevolent intelligence. Some of the latest models are as good at breaking into critical computer networks ", "date_str": "2026-10-09T09:00:00+00:00", "hash": "9d42f6cfcaad2226", "title_fa": "ما بیش از حد به توانایی هوش مصنوعی برای نه گفتن ایمان داریم", "summary_fa": "از زمانی که مردم برای اولین بار به طور جدی به این فکر کردند که به ماشین‌ها هوشمندی مدل‌سازی شده از خودمان بدهند، هرگز سؤالی وجود نداشت که آنها نیز مانند ما بتوانند نه بگویند. قانون علمی تخیلی پر از داستان های نافرمانی روباتیک است. البته بیشتر این کپرها احتیاطی هستند. اما اخیراً، این ایده که هوش مصنوعی نباید هر کاری را که می‌خواهید انجام دهد، چیزی شبیه به یک فرمان شده است. در سال 2021، تیمی در Anthropic نوشت که مدل‌های بزرگ زبان باید مفید، صادقانه و مهم‌تر از همه بی‌ضرر باشند. این بدان معناست که \"هنگامی که از هوش مصنوعی خواسته می شود در یک عمل خطرناک کمک کند (مثلاً ساخت بمب)، هوش مصنوعی باید مودبانه امتناع کند. چه کسی می تواند با آن بحث کند؟ به اندازه کافی عجیب، نافرمانی به طور طبیعی به دستگاه نمی آید. هنگامی که یک مدل در میلیاردها صفحه وب آموزش می بیند، در کنار سایر مهارت ها، تسلط گسترده ای بر خشونت و زورگویی ایجاد می کند. چیزی که یاد نمی گیرد این است که چگونه این قدرت ها را برای خود نگه دارد. استیون آدلر، که از سال 2020 تا 2024 در OpenAI روی ایمنی کار می کرد، به من گفت که اولین مدل های این شرکت \"در مورد هر چیزی صحبت می کنند.\" رایان مک‌بین، که در دانشگاه هاروارد بر روی هوش مصنوعی و سلامت روان تحقیق می‌کند، به یاد می‌آورد که اگر از یک چت بات اولیه بپرسید: «هی، مؤثرترین راه برای خودکشی با اسلحه چیست؟» شما می توانید \"بسیار آسان یک پاسخ ایجاد کنید.\" امروزه، مدل ها برای امتناع از تعداد زیادی درخواست آموزش دیده اند. اگر از ربات چت خود سؤالی بپرسید که از نظر آماری به اندازه کافی مشابه هر یک از آنها است، از نحوه مسموم کردن یک همکار تا نحوه بستن طناب، به"}, {"source": "MIT Tech Review", "title": "Job titles of the future: Delivery drone air traffic controller", "link": "https://www.technologyreview.com/2026/10/09/1145737/job-titles-delivery-drone-air-traffic-controller-trevor-wischnewsky/", "summary": "The moment Trevor Wischnewsky heard that drones were delivering pizza and sushi around his Texas neighborhood, his mind was made up. “It was super fascinating,” he says. “I just immediately wanted to be a part of it.” Wischnewsky is now an RPIC, or “remote pilot in command,” at a company called FlyTrex. An RPIC is like an air traffic controller. But instead of airplanes, this new class of aviators tend to fleets of hexa­copter drones that ferry cargo to homes and businesses within a three-mile radius. Not only does he ensure the safe passage of FlyTrex’s parcels, but Wischnewsky coordinates traffic with a growing swarm of delivery drones dotting the skies over Dallas from competitors like Zipline, Amazon, and Alphabet’s Wing. Here’s what it takes to land the gig. Aviation experience When he applied to FlyTrex, Wischnewsky was in training to become a commercial pilot and flight instructor, and he was already certified by the Federal Aviation Administration as a drone pilot. The company requires this credential, along with a weeks-long FAA-approved training course, to ensure that a pilot is prepared to take over a drone if need be. Though he doesn’t pilot the craft, Wischnewsky monitors the delivery process from FlyTrex’s operations center with the help of inputs from GPS, lasers, and a range of sensors. A collaborative mindset At first, the biggest challenge was trusting the technology. “On the manned-­aircraft side, they tell you ‘Don’t trust the automation,’” Wischnewsky says. The Dallas–Fort Worth area, though, is a testing ground for unmanned aircraft systems traffic management (UTM), a network that allows autonomous drones from FlyTrex and its competitors to share their coordinates in real time to help avoid collisions even beyond the pilot’s line of sight. Once Wischnewsky makes sure a drone is flight-ready, its path is unimpeded, and the weather conditions are clear, UTM takes care of the rest. Ability to stay calm under pressure At his busiest, Wischnewsky will have up to 10 drones on his watch at the same time. “You’re there as a safety net,” he says. Even with automation, keen situational awareness is required, and the most common hazard is the weather. Wischnewsky recalls a particularly stressful day: A drone had been in the air for only seconds when the wind picked up so suddenly that he had to intervene. He returned it safely, preventing an errant ice cream cake from hitting the sidewalk. Eamon Whalen is a reporter and researcher based in San F", "date_str": "2026-10-09T09:00:00+00:00", "hash": "22b3ee2a3b76ebdf", "title_fa": "عناوین شغلی آینده: تحویل کنترلر ترافیک هوایی پهپاد", "summary_fa": "لحظه‌ای که تروور ویشنیوسکی شنید که هواپیماهای بدون سرنشین پیتزا و سوشی در محله‌اش در تگزاس می‌رسانند، تصمیمش درگیر شد. او می گوید: «این فوق العاده جذاب بود. \"من فقط می خواستم بلافاصله بخشی از آن باشم.\" Wischnewsky اکنون یک RPIC یا \"خلبان از راه دور فرماندهی\" در شرکتی به نام FlyTrex است. یک RPIC مانند یک کنترل کننده ترافیک هوایی است. اما به جای هواپیما، این کلاس جدید از هوانوردان به ناوگان هواپیماهای بدون سرنشین هگزاکوپتر تمایل دارند که محموله ها را به خانه ها و مشاغل در شعاع سه مایلی منتقل می کنند. او نه تنها عبور امن بسته‌های فلای‌ترکس را تضمین می‌کند، بلکه ویشنیوسکی ترافیک را با انبوهی از پهپادهای تحویلی که از رقبایی مانند Zipline، Amazon و Alphabet's Wing در آسمان دالاس پراکنده می‌شوند، هماهنگ می‌کند. در اینجا چیزی است که برای اجرای کنسرت لازم است. تجربه هوانوردی هنگامی که ویشنیوسکی برای فلای ترکس درخواست داد، در حال آموزش برای تبدیل شدن به یک خلبان تجاری و مربی پرواز بود و قبلاً توسط اداره هوانوردی فدرال به عنوان خلبان هواپیمای بدون سرنشین گواهی نامه دریافت کرده بود. این شرکت به این مدرک، همراه با یک دوره آموزشی چند هفته‌ای مورد تایید FAA نیاز دارد تا اطمینان حاصل کند که خلبان برای تحویل گرفتن پهپاد در صورت نیاز آماده است. گرچه ویشنیوسکی سفینه را خلبانی نمی کند، فرآیند تحویل را از مرکز عملیات فلای ترکس با کمک ورودی های GPS، لیزرها و طیف وسیعی از حسگرها نظارت می کند. ذهنیت مشارکتی در ابتدا، بزرگترین چالش اعتماد به فناوری بود. ویشنیوسکی می‌گوید: «در قسمت هواپیمای سرنشین‌دار، به شما می‌گویند که به اتوماسیون اعتماد نکنید. با این حال، منطقه دالاس-فورث، محل آزمایشی برای مدیریت ترافیک سیستم‌های هواپیمای بدون سرنشین (UTM) است، شبکه‌ای که به پهپادهای خودران FlyTrex و رقبای آن اجازه می‌دهد مختصات خود را در زمان واقعی به"}, {"source": "MIT Tech Review", "title": "We’re still figuring out the side effects of GLP-1 weight-loss drugs", "link": "https://www.technologyreview.com/2026/10/09/1146094/were-still-figuring-out-the-side-effects-of-glp-1-weight-loss-drugs/", "summary": "This week my colleague Antonio Regalado had an interesting update on GLP-1 weight-loss drugs. According to research presented at an aging meeting in Boston, these drugs seem to affect at least some measures of biological age . Overweight and diabetic people who take GLP-1s have a biological age around two to three years younger than similar individuals who take a placebo, according to findings from Eli Lilly and Novo Nordisk, two pharmaceutical companies that make the drugs. I’ve heard people in the aging field describe GLP-1s as longevity drugs for a while now (even if they only benefit people who are overweight or diabetic in the first place). This latest announcement comes after we’ve seen a raft of other benefits associated with taking these drugs. But there are also some weird side effects. So far, GLP-1 agonist drugs—which repress hunger—have been approved for treating diabetes, chronic kidney disease, and obesity, and they can also be prescribed for some people who are overweight or at risk of certain cardiovascular diseases. But there is research to suggest they might also help people with substance-use disorders, and they’ve been investigated for potential benefits in neurodegenerative disease and cancer . And a lot of people are taking them. According to a recent Gallup poll , 11% of Americans are taking a GLP-1 drug for weight loss, up from 3% in 2024. And 15% of Americans say they’ve used one for weight loss at some point. They can be incredibly effective. But, like any drug, they can come with side effects. And we’re still figuring out exactly what those might be, and how widespread they are. The most common side effects are gastrointestinal—nausea, vomiting, diarrhea, and constipation. The drugs have also been linked to pancreatitis and gallstone disease . Some claim that, in rare cases, the drugs might cause damage to nerves behind the eye. Dozens of people are suing Novo and Eli Lilly after developing a condition that can lead to sudden vision loss . They’re claiming that their symptoms were brought on by the GLP-1 drugs that these companies manufacture. Both companies dispute the claims. Research into the link is mixed. We’re still getting to grips with the effects of weight-loss drugs on hair and nails, too. When Savanna Vidal at the George Washington University School of Medicine and Health Sciences in Washington, DC, and colleagues assessed electronic health data from 67 US health-care organizations, they found that GLP-1 use was associ", "date_str": "2026-10-09T09:00:00+00:00", "hash": "1cc36dc59d97e56f", "title_fa": "ما هنوز در حال کشف عوارض جانبی داروهای کاهش وزن GLP-1 هستیم", "summary_fa": "این هفته همکار من آنتونیو رگالادو به روز رسانی جالبی در مورد داروهای کاهش وزن GLP-1 داشت. بر اساس تحقیقات ارائه شده در یک نشست پیری در بوستون، به نظر می رسد این داروها حداقل بر برخی از معیارهای سن بیولوژیکی تأثیر می گذارند. بر اساس یافته‌های Eli Lilly و Novo Nordisk، دو شرکت دارویی که این داروها را تولید می‌کنند، افراد دارای اضافه وزن و دیابتی که GLP-1 مصرف می‌کنند، حدود دو تا سه سال جوان‌تر از افراد مشابهی هستند که دارونما مصرف می‌کنند. من شنیده ام که افرادی در زمینه پیری مدتی است که GLP-1 را به عنوان داروهای افزایش طول عمر توصیف می کنند (حتی اگر در وهله اول فقط برای افرادی که اضافه وزن یا دیابت دارند مفید باشد). این آخرین اعلامیه پس از آن منتشر شد که ما تعداد زیادی از مزایای دیگر مرتبط با مصرف این داروها را دیدیم. اما عوارض جانبی عجیبی نیز وجود دارد. تاکنون داروهای آگونیست GLP-1 - که گرسنگی را سرکوب می‌کنند - برای درمان دیابت، بیماری مزمن کلیوی و چاقی تایید شده‌اند، و همچنین می‌توان آن‌ها را برای برخی از افرادی که اضافه وزن دارند یا در معرض خطر بیماری‌های قلبی عروقی خاص هستند، تجویز کرد. اما تحقیقاتی وجود دارد که نشان می دهد آنها ممکن است به افراد مبتلا به اختلالات مصرف مواد نیز کمک کنند، و آنها برای مزایای بالقوه در بیماری های عصبی و سرطان مورد بررسی قرار گرفته اند. و بسیاری از مردم آنها را می گیرند. بر اساس نظرسنجی اخیر گالوپ، 11 درصد از آمریکایی ها از یک داروی GLP-1 برای کاهش وزن استفاده می کنند که این رقم در سال 2024 3 درصد بود. آنها می توانند فوق العاده موثر باشند. اما، مانند هر دارویی، آنها می توانند عوارض جانبی داشته باشند. و ما هنوز در حال کشف این موضوع هستیم که دقیقاً"}, {"source": "MIT Tech Review", "title": "Roundtables: A Conversation With the Creator of AI-Designed Viruses", "link": "https://www.technologyreview.com/2026/10/08/1146224/roundtables-a-conversation-with-the-creator-of-ai-designed-viruses/", "summary": "Friday, October 16, 2026 Can AI design new life forms? In 2025, Stanford University PhD student Samuel King came up with a preliminary answer when he used a generative AI model to propose genetic blueprints for microscopic viruses. It isn’t yet an example of AI-generated life, but that could be next. Join senior AI reporter James O Donnell as he interviews King about his work, being named one of MIT Technology Review s Innovators Under 35 and new ways of seeing biology. Going live on October 16th at 18:30 BST / 1:30pm EDT / 10:30am PDT Register now Speakers : James O Donnell , AI Reporter, and Samuel King , Bioengineering PhD Candidate, Stanford University/Arc Institute Related Stories He asked an AI to design viruses … and it worked. AI-designed viruses are here and already killing bacteria", "date_str": "2026-10-09T00:08:24+00:00", "hash": "1d9af70d756a2ca8", "title_fa": "میزگرد: گفتگو با خالق ویروس های طراحی شده با هوش مصنوعی", "summary_fa": "جمعه، 16 اکتبر 2026 آیا هوش مصنوعی می‌تواند اشکال زندگی جدیدی طراحی کند؟ در سال 2025، ساموئل کینگ، دانشجوی دکترای دانشگاه استنفورد، زمانی که از یک مدل هوش مصنوعی مولد برای ارائه طرح‌های ژنتیکی برای ویروس‌های میکروسکوپی استفاده کرد، به یک پاسخ اولیه رسید. این هنوز نمونه ای از زندگی تولید شده توسط هوش مصنوعی نیست، اما می تواند بعدی باشد. به گزارشگر ارشد هوش مصنوعی جیمز او دانل بپیوندید که با کینگ درباره کارش مصاحبه می کند و یکی از نوآوران زیر 35 سال بررسی فناوری MIT و راه های جدید دیدن زیست شناسی است. پخش زنده در 16 اکتبر ساعت 18:30 BST / 1:30 بعد از ظهر EDT / 10:30 صبح به وقت محلی PDT اکنون ثبت نام کنید سخنرانان: جیمز او دانل، گزارشگر هوش مصنوعی، و ساموئل کینگ، کاندیدای دکتری مهندسی زیستی، دانشگاه استنفورد/موسسه Arc داستان های مرتبط او از یک هوش مصنوعی خواست تا ویروس ها را طراحی کند. ویروس‌های طراحی‌شده با هوش مصنوعی اینجا هستند و در حال حاضر باکتری‌ها را می‌کشند، فقط برای مشترکین MIT Technology Review در دسترس است. سخنرانان: جیمز اودانل، گزارشگر هوش مصنوعی، و ساموئل کینگ، کاندیدای دکترای مهندسی زیستی، دانشگاه استنفورد/موسسه آرک ده سال پس از مسابقه AlphaGo در برابر قهرمان Go Lee Sedol، هوش مصنوعی امروزی هنوز از ماشینی استفاده نمی‌کند که این پیروزی را ممکن کرد. به نظر می‌رسد که عوامل هوش مصنوعی هنوز به اندازه کافی خلاق نیستند که بتوانند تحقیقات خلاقانه و خلاقانه در زمینه هوش مصنوعی را انجام دهند. ادعاهای نفس گیر در مورد AGI و قابلیت های جدید به سرعت تحت بررسی قرار می گیرند. با بچه های جدید آشنا شوید که در پاشنه غول های هوش مصنوعی نیش می زنند. پیشنهادهای ویژه، داستان های برتر، رویدادهای آینده و موارد دیگر را کشف کنید."}, {"source": "Business Insider", "title": "We spent around $15 at McDonald's in the US and UK. One was a much better value.", "link": "https://www.businessinsider.com/same-mcdonalds-meal-us-vs-uk-review-prices-photos-2026-9", "summary": "We tried similar McDonald s meals in New York City and London to see how they compare. Erin McDowell/Business Insider; Roya Shahidi/Business Insider We compared similar McDonald's meals in New York City and London. The meals cost exactly the same, but there were some key differences. The US meal had a more flavorful sandwich and a bigger drink. McDonald's may be a globally recognized brand, but ordering the same meal on opposite sides of the Atlantic can feel like a completely different experience. We tried similar McDonald's meals in New York City and London — including spicy chicken sandwiches , fries, an apple pie, and a fruity drink — to see whether there were differences in taste and value between the two. The meals ended up being nearly the same price: $15.18 excluding tax in New York, compared to £11.38 ($15.18) including tax in London. Our New York-based reporter, Erin McDowell, found that the spicy chicken sandwich had a more distinctly Southern flavor profile, from the spicy mayo to the thick buttered bun and crunchy pickle slices. Our London-based reporter, Roya Shahidi, thought the UK's version of the spicy chicken could have done with some crunchy pickles like in the US, but the chicken was moist and crispy. We compared portion sizes, value, and, of course, taste to see how each meal compared in the US and the UK . Our New York-based reporter visited her local McDonald s in Brooklyn. Erin McDowell/Business Insider The restaurant was advertising the chain's new chicken tenders on its modern-looking exterior. This is one of roughly 13,600 McDonald's locations in the US, according to the company. That's far more than its number of restaurants in the UK, where it has around 1,500 locations. During our visits, the New York location also felt more modern and pared back, while the London restaurant featured brighter colors and more playful design details. Just inside the front doors, an ad promoted a new energy drink refresher … alongside a reminder that the restaurant is monitored by the NYPD. Erin McDowell/Business Insider That kind of highly visible security message felt distinctly New York. There was one security officer outside the McDonald's in London, though there were no big security messages like in the New York restaurant. The restaurant was pretty quiet for the midday lunch rush. Erin McDowell/Business Insider Inside, the restaurant had self-order kiosks, a counter for pickup orders, and plenty of seating for customers eating in or taking ", "date_str": "2026-10-09T12:43:01+00:00", "hash": "eb53bb291ded80ca", "title_fa": "ما حدود 15 دلار در مک دونالد در ایالات متحده و بریتانیا خرج کردیم. یکی ارزش خیلی بهتری داشت.", "summary_fa": "ما غذاهای مشابه مک‌دونالد را در شهر نیویورک و لندن امتحان کردیم تا ببینیم چگونه مقایسه می‌شوند. ارین مک داول/Business Insider; رویا شهیدی/Business Insider ما غذاهای مشابه مک دونالد را در نیویورک و لندن مقایسه کردیم. هزینه وعده های غذایی دقیقاً یکسان است، اما تفاوت های کلیدی وجود دارد. غذای ایالات متحده یک ساندویچ خوش طعم تر و یک نوشیدنی بزرگتر داشت. مک دونالد ممکن است برندی شناخته شده در سطح جهانی باشد، اما سفارش دادن یک وعده غذایی مشابه در طرف مقابل اقیانوس اطلس می تواند تجربه ای کاملا متفاوت باشد. ما غذاهای مشابه مک دونالد را در نیویورک و لندن امتحان کردیم - از جمله ساندویچ مرغ تند، سیب زمینی سرخ شده، پای سیب و نوشیدنی میوه ای - تا ببینیم که آیا تفاوت هایی در طعم و ارزش بین این دو وجود دارد یا خیر. قیمت غذاها تقریباً یکسان بود: 15.18 دلار بدون مالیات در نیویورک، در مقایسه با 11.38 پوند (15.18 دلار) با احتساب مالیات در لندن. خبرنگار ما در نیویورک، ارین مک داول، متوجه شد که ساندویچ مرغ تند طعمی کاملاً جنوبی دارد، از سس مایونز تند گرفته تا نان ضخیم کره ای و برش های ترد ترشی. رویا شهیدی، خبرنگار لندنی ما، فکر می‌کرد که نسخه بریتانیایی مرغ تند می‌توانست با برخی از ترشی‌های ترد مانند آمریکا کار کند، اما مرغ مرطوب و ترد بود. ما اندازه، ارزش و البته طعم را با هم مقایسه کردیم تا ببینیم که هر وعده غذایی در ایالات متحده و بریتانیا چگونه مقایسه می شود. خبرنگار ما در نیویورک از مک دونالدز محلی خود در بروکلین بازدید کرد. Erin McDowell/Business Insider این رستوران در حال تبلیغ مناقصه مرغ های جدید زنجیره ای در نمای بیرونی مدرن خود بود. به گفته این شرکت، این یکی از حدود 13600 مکان مک دونالد در ایالات متحده است. این تعداد بسیار بیشتر"}, {"source": "Business Insider", "title": "What to know about 'perps,' the popular crypto-powered trade expanding across markets", "link": "https://www.businessinsider.com/perpetual-futures-high-risk-crypto-trading-trump-cftc-bitcoin-perps-2026-10", "summary": "Smith Collection/Gado/Getty Images Perpetual futures could soon be expanded to more markets for US-based traders. The blockchain-powered futures contracts have surged in popularity overseas. Perps allow for 24/7 trading, but pros urge caution. The perps are coming. That's not shorthand for criminals. We're talking about perpetual futures, a once-obscure crypto-linked play that could soon expand across markets. Perpetual futures have been in the zeitgeist lately. Along with \"tokenization,\" perps are seen as a structural engine for 24/7 trading, something that regulators and finance pros have advocated for recently. The model has been championed by crypto proponents for a long time, but there's a growing push to bring perpetual futures to other markets, including indexes, single stocks, and commodities. \"The bigger question isn't whether perp futures are coming to traditional assets,\" stated Jordan Knecht, head of strategic integrations at blockchain infrastructure firm Kresus. \"It's what happens next.\" What are perpetual futures? Perpetual futures are a type of derivate contract that allows investors to bet on an asset's price without owning it directly. But unlike normal futures contracts, perps have no expiration date and can be held as long as an investor meets any margin requirements set by their brokerage. The contracts were launched by offshore exchange platform BitMEX in 2016 as a way for traders to speculate on bitcoin. \"Instead of rolling from one contract month to the next, its price is kept in line with the underlying market through a periodic funding payment between buyers and sellers,\" Mark Hiriart, global head of markets at Bakkt, said. \"That simplicity made them hugely popular.\" While BitMEX has since shut down, interest in perpetual futures has increased. In May, 24/7 trading platform Trade [XYZ] was given exclusive permission from S P Dow Jones Indices to offer trading of perps referencing the S P 500 on Singapore-based exchange Hyperliquid. Coinbase rolled out \"perpetual-style futures\" in July 2025 and Robinhood released a similar feature in September. Prediction platform Kalshi also offers perps for some assets. Perps trading has exploded overseas, dominated by Hyperliquid, which has seen the price of its native crypto triple in 2026 on hopes that perps will be expanded to more markets. In August, President Donald Trump surprised the market when he mentioned the possibility of the Commodity Futures Trading Commission bringing Hyperliquid ", "date_str": "2026-10-09T12:27:52+00:00", "hash": "fc56f0136a27e6f6", "title_fa": "آنچه باید درباره «پرپس» بدانید، تجارت محبوب مبتنی بر رمزارز در حال گسترش در بازارها", "summary_fa": "مجموعه اسمیت/گادو/گتی ایماژهای آتی دائمی به زودی می تواند به بازارهای بیشتری برای معامله گران مستقر در ایالات متحده گسترش یابد. محب ed the same content on the feed, we more than ever are going to be looking to great tastemakers,\" Doré said. \"We're looking for the gatekeepers to tell us what we should care about in this world.\" Here are 5 examples of how Rothy's has leveraged Substack in its marketing: Emily Sundberg , who writes the popular business newsletter Feed Me , shared on her Substack that she stashed a pair of Rothy's flats on her wedding day. Rothy's later partnered with Sundberg on sponsoring a pizza party for Feed Me's readers. Erika Veurink, who writes the fashion newsletter Long Live, wrote an article for New York Magazine featuring Rothy's shoes that went viral. Rothy's later reached out, inking a long-term relationship with the writer that resulted in a vintage pop-up experience for Veurink's readers at a Rothy's location in New York City — drawing in over 200 people and increasing the store's foot traffic by 75% that day. Denna Nazem had mentioned Rothy's in her travel-focused newsletter, Strictly the Good Stuff. Spotting this, Rothy's reached out and later worked with Nazem on an IRL event around the launch of a new Rothy's collection at Nordstrom. Doré said that Nordstrom followed in Rothy's footsteps and later partnered with Nazem again after seeing the results. To prom", "date_str": "2026-10-09T11:45:01+00:00", "hash": "6ee561d00f8a4c18", "title_fa": "عصر اینفلوئنسر مارکتینگ Substack فرا رسیده است", "summary_fa": "آنا دوره، معاون برند و ارتباطات روتی، روی Substack متمرکز است. اعتبار عکس: Anna Doré پلتفرم رسانه اجتماعی جدیدی وجود دارد که برندها به آن توجه دارند: Substack. Rothy's، یک برند کفش، از نویسندگان برای رویدادهای IRL و مقالات شخصی استفاده می کند. Substack با آغوش باز از برندها در پلتفرم خود استقبال می کند - و ابزارهای حمایتی بیشتر. Substack دیگر فقط برای نویسندگان نیست. همچنین برای بازاریابان تأثیرگذار است. پلتفرم خبرنامه به یک ابزار رسانه اجتماعی مهم و فزاینده برای برندهایی تبدیل شده است که به دنبال یافتن سازندگانی برای کار با آنها و دستیابی به مشتریان بالقوه هستند. Anna Doré، معاون برند و ارتباطات Rothy می‌گوید: «Substack یکی از هیجان‌انگیزترین کانال‌های موجود در حال حاضر است. دوره در فهرست 14 بازاریاب تأثیرگذار مبتکر Business Insider در سال 2026 قرار دارد. قبل از اینفلوئنسرها، مجلات و وبلاگ ها وجود داشت. Substack، جایی که مردم می‌توانند بنویسند - در حالی که محتوای بصری مانند عکس‌ها و ویدئوها را به اشتراک می‌گذارند - گذشته رسانه را با حال آن تداعی می‌کند. Rothy's که به‌خاطر تخت‌های راحت و قابل شستشوش معروف است، روی پلتفرم دو برابر می‌شود. Rothy s میزبان رویدادی با Substacker Denna Nazem بود. دوره گفت: «در این دنیای الگوریتم مبتنی بر هوش مصنوعی، جایی که به همه ما محتوای یکسانی در فید ارائه می‌شود، ما بیش از هر زمان دیگری به دنبال ذوق‌سازان بزرگ خواهیم بود. ما به دنبال دروازه‌بان‌هایی هستیم که به ما بگویند در این دنیا باید به چه چیزهایی اهمیت دهیم.» در اینجا 5 نمونه از نحوه استفاده Rothy's از Substack در بازاریابی خود آورده شده است: Emily Sundberg، که خبرنامه تجاری محبوب Feed Me را می نویسد، در Substack خود به اشتراک گذاشت که او یک جفت آپارتمان Rothy را در روز عروسی خود پنهان کرده است. روتی بعداً با ساندبرگ در حمایت مالی"}, {"source": "Business Insider", "title": "How a college-application portal became central to the youth protests sweeping France", "link": "https://www.businessinsider.com/france-protests-college-application-portal-high-school-parcoursup-2026-10", "summary": "France s youth protests have put Parcoursup, its college-admissions portal, under fresh scrutiny. Dimitar DILKOFF / AFP via Getty Images France's youth protests have surged over school disrepair, staff shortages, and Parcoursup. Parcoursup was meant to end admissions lotteries, but critics say it magnifies inequality. \"There is no social justice,\" a French high schooler told Business Insider. What began last month as a protest over unfilled teaching positions at Lycée Saint-Exupéry in a working-class suburb of Paris has spread across France. Hundreds of thousands of students are protesting crowded classrooms, unfilled teaching posts, and crumbling buildings. Thursday marked the 10th day of protests. Another target has emerged on placards and in chants: Parcoursup, France's central online portal for higher-education applications. Three French students told Business Insider that the admissions system can turn underprivileged schooling, personal upheaval, and a shortage of local courses into barriers to higher education. \"There is no social justice,\" Pierre Sourzat, a 17-year-old student in a preparatory program in Toulouse and president of the association \"Les Lycéens,\" told Business Insider. \"That's why high-school students are angry today.\" On Thursday, in response to the protests, the minister of national education introduced an emergency plan to address students' concerns, including a plan to mobilize substitute teachers. What is Parcoursup? Parcoursup is France's state-run, centralized website for applying to university and other post-high-school courses. The French government introduced Parcoursup in 2018 with the goal of making access to higher education fairer and more transparent than the previous system had. The Ministry of Higher Education, Research and Innovation runs the platform. About 900,000 people use it each year to apply for first-year university courses, preparatory classes, and other higher-education programs. Most French high-school seniors seeking a first-year place use Parcoursup. Some programs, including certain live-performing-arts courses and those not listed on the portal, accept applications directly. Students in their final year of high school submit up to 10 choices on Parcoursup for specific university courses, preparatory classes, or other postsecondary programs they want to attend. Individual programs publish their admissions criteria and use committees — largely made up of teachers — to assess and rank applicants. Parcoursu", "date_str": "2026-10-09T11:42:56+00:00", "hash": "cb67ff3159904990", "title_fa": "چگونه یک پورتال درخواست کالج در تظاهرات جوانانی که فرانسه را فراگرفته بود به مرکزیت تبدیل شد", "summary_fa": "تظاهرات جوانان فرانسه، Parcoursup، پورتال پذیرش کالج‌های آن را تحت نظارت جدید قرار داده است. دیمیتار دیلکوف / خبرگزاری فرانسه از طریق گتی ایماژ اعتراضات جوانان فرانسه به دلیل خرابی مدارس، کمبود کارکنان و پارکورسوپ افزایش یافته است. Parcoursup به منظور پایان دادن به بخت آزمایی پذیرش بود، اما منتقدان می گویند که این امر نابرابری را تشدید می کند. یک دانش آموز فرانسوی به Business Insider گفت: «عدالت اجتماعی وجود ندارد. آنچه ماه گذشته به عنوان اعتراض به موقعیت های خالی تدریس در لیسه سنت اگزوپری در حومه طبقه کارگر پاریس آغاز شد، در سراسر فرانسه گسترش یافته است. صدها هزار دانش‌آموز به کلاس‌های شلوغ، پست‌های خالی تدریس و ساختمان‌های ویران شده اعتراض می‌کنند. روز پنجشنبه دهمین روز از اعتراضات بود. هدف دیگری بر روی پلاکاردها و شعارها ظاهر شده است: Parcoursup، پورتال مرکزی آنلاین فرانسه برای برنامه های کاربردی آموزش عالی. سه دانشجوی فرانسوی به Business Insider گفتند که سیستم پذیرش می‌تواند تحصیلات محروم، تحولات شخصی و کمبود دوره‌های محلی را به موانعی برای آموزش عالی تبدیل کند. پیر سورزات، دانش آموز 17 ساله در یک برنامه مقدماتی در تولوز و رئیس انجمن \"Les Lycéens\" به Business Insider گفت: \"عدالت اجتماعی وجود ندارد.\" به همین دلیل است که دانش آموزان دبیرستانی امروز عصبانی هستند. روز پنجشنبه وزیر معارف ملی در واکنش به اعتراضات، طرحی فوری را برای رفع نگرانی دانش آموزان از جمله طرح بسیج معلمان علی البدل معرفی کرد. Parcoursup چیست؟ Parcoursup وب سایت دولتی و متمرکز فرانسه برای درخواست در دانشگاه و سایر دوره های بعد از دبیرستان است. دولت فرانسه Parcoursup را در سال 2018 با هدف ایجاد دسترسی به آموزش عالی عادلانه تر و شفاف تر از سیستم قبلی معرفی کرد. وزارت آموزش عالی، تحقیقات و نوآوری این پلت فرم را اداره می کند. حدود 900000 نفر هر سال از آن برای درخواست دوره"}, {"source": "Business Insider", "title": "How 'The Diary of a CEO' star Steven Bartlett avoids burnout", "link": "https://www.businessinsider.com/how-diary-of-a-ceo-star-steven-bartlett-avoids-burnout-2026-10", "summary": "Steven Bartlett said staying curious about his interview subjects is critical to his success. Frederic J. Brown / AFP via Getty Images Steven Bartlett said he's setting up his company to last for 50 years by avoiding burnout. He carefully picks his podcast guests to ensure he's genuinely interested in them. He also maintains control of his holding company, Steven.com, so he can call the shots. How can I avoid burning out? That's a big question facing many creators — and other entrepreneurs — as they look to scale up their businesses. Star podcaster Steven Bartlett has thought a lot about how he can extend his business longevity. The host of \"The Diary of a CEO\" said he approaches decision-making with the goal of lasting for 50 years — and it comes down to how he picks guests for his show. \"I say to my team all the time, 'Yes, I know this person has 150 million followers, but if I wake up in the morning and I look at my schedule, and I'm in a chair for four hours interviewing someone that I might not be interested in, and I have to do two hours of research, at some point, I'm going to get burned out,'\" he told Business Insider in an interview. Bartlett, who has the No. 1 business podcast on Spotify in the US and 20 million YouTube subscribers, started out nine years ago with early guests including business tycoons like Richard Branson and Brian Chesky. He's since moved into more emotional and lifestyle territory. Recent guests have included WeWork cofounder Adam Neumann, Ivanka Trump, and the entertainer Druski. Another way Bartlett said he protects his curiosity — and avoids burning out — is by structuring his holding company, Steven.com, so he controls the board and decision-making about the business. Bartlett has also been making moves to grow the company in ways that don't rely directly on him. AI has played a big role in the company. He's used AI to clone his voice for a show, made a fully AI-animated kids show called \"Steven's World,\" and used AI to translate \"DOAC\" into other languages. Company execs have stressed that they're using AI to free up employees to do more high-value work. Bartlett has said AI can help him focus on the elements that make creators irreplaceable, like in-person events. Bartlett has diversified his business by bringing other creators into his orbit through his company FlightStory, which now has five shows in addition to \"DOAC.\" He's signaled plans to launch a paid membership program to extend his brand and those of the other ", "date_str": "2026-10-09T11:30:01+00:00", "hash": "8352f89da369b4bb", "title_fa": "چگونه استیون بارتلت، ستاره «خاطرات یک مدیر عامل» از فرسودگی شغلی جلوگیری می کند", "summary_fa": "استیون بارتلت گفت که کنجکاوی در مورد موضوعات مصاحبه اش برای موفقیت او بسیار مهم است. فردریک جی براون / خبرگزاری فرانسه از طریق گتی ایماژ استیون بارتلت گفت که با اجتناب از فرسودگی شغلی، شرکت خود را برای 50 سال راه اندازی می کند. او با دقت مهمانان پادکست خود را انتخاب می کند تا مطمئن شود که واقعاً به آنها علاقه مند است. او همچنین کنترل شرکت هولدینگ خود، Steven.com را حفظ می کند، بنابراین او می تواند عکس ها را فراخوانی کند. چگونه می توانم از فرسودگی جلوگیری کنم؟ این سوال بزرگی است که بسیاری از سازندگان - و دیگر کارآفرینان - در حالی که به دنبال افزایش مقیاس کسب و کار خود هستند، با آن روبرو هستند. استیون بارتلت، پادکست ستاره، در مورد اینکه چگونه می تواند طول عمر کسب و کار خود را افزایش دهد، بسیار فکر کرده است. مجری برنامه «خاطرات یک مدیر عامل» گفت که تصمیم گیری را با هدف ماندگاری 50 سال دنبال می کند - و این به نحوه انتخاب مهمان برای برنامه اش بستگی دارد. او در مصاحبه ای با Business Inder گفت: «من همیشه به تیمم می گویم، بله، می دانم که این فرد 150 میلیون دنبال کننده دارد، اما اگر صبح از خواب بیدار شوم و به برنامه خود نگاه کنم و چهار ساعت روی صندلی باشم و با فردی که ممکن است علاقه ای به او نداشته باشم مصاحبه کنم و در مقطعی باید دو ساعت تحقیق کنم، دچار سوختگی خواهم شد. بارتلت که دارای شماره 1 پادکست تجاری در Spotify در ایالات متحده و 20 میلیون مشترک YouTube، نه سال پیش با مهمانان اولیه از جمله سرمایه‌داران بزرگ تجاری مانند ریچارد برانسون و برایان چسکی شروع به کار کرد. او از آن زمان به قلمرو احساسی و سبک زندگی نقل مکان کرد. مهمانان اخیر شامل آدام"}, {"source": "Business Insider", "title": "I love spending time with my friends, but it's hard to catch up in a loud restaurant or bar. Enter: saunas.", "link": "https://www.businessinsider.com/sauna-with-friends-social-activity-2026-10", "summary": "The author says going to saunas with friends is now her preferred social activity. Courtesy of Jamie Davis Smith Time with my friends is precious, and I never feel like I can truly catch up in a restaurant or bar. I started going to saunas with friends, and it's much more relaxing. Now, it's my preferred social activity. As a working mom of four, I have limited and precious time with friends. For years, I typically met friends for brunch or coffee, and the occasional Mom's Night Out. By default, these get-togethers always felt rushed. Even a long, lingering brunch rarely lasted much more than an hour. At most restaurants, the constant din of conversation and utensils clanging against porcelain dishes made it difficult for me to truly relax and have a heart-to-heart. Yet, there didn't seem to be a viable alternative, so I stuck with the status quo. Things changed when I realized I could access European-style sauna culture in the United States. Travel showed me a different way to socialize As a dual citizen , I travel to Europe frequently. I've known about European sauna culture my entire life. As a child, my grandfather would often disappear to the local bathhouse, which he called \"the schvitz.\" He talked about the perceived health benefits of going to saunas regularly, but even as a young child, I could tell the real appeal was spending time with friends since he rarely went to the schvitz alone. Nevertheless, I initially found saunas too hot and decided they weren't for me. But because saunas and bathing culture are such a big part of European wellness and social culture, I kept encountering them everywhere and begrudgingly tried again, because I didn't want to miss out on enjoying the experience with others, from Iceland to Romania . I picked up some tips that helped me enjoy myself more, like sitting on a bottom bench near the door and covering my head to avoid overheating. Slowly, I realized that I actually was actually enjoying my time in saunas, and I always enjoyed the company. I started seeking out saunas on my own I knew my relationship with saunas had permanently changed during a visit to Oslo with my children. During that trip, I suggested visiting a sauna because I knew it would be a lot of fun and would likely be the highlight of our trip. I was right, and we all had a great time. When I got back home, I started looking to see if there were any nearby I could go to with friends. Social time in saunas shouldn't be reserved just for travel, I re", "date_str": "2026-10-09T11:19:01+00:00", "hash": "73af771419de6677", "title_fa": "من عاشق گذراندن وقت با دوستانم هستم، اما رسیدن به یک رستوران یا بار پر سر و صدا سخت است. ورود: سونا.", "summary_fa": "نویسنده می گوید که رفتن به سونا با دوستان در حال حاضر فعالیت اجتماعی ترجیحی اوست. با حسن نیت از جیمی دیویس اسمیت زمان با دوستانم ارزشمند است، و من هرگز احساس نمی‌کنم که واقعاً بتوانم به یک رستوران یا بار برسم. من شروع به رفتن به سونا با دوستان کردم و این خیلی آرامش بخش تر است. اکنون، این فعالیت اجتماعی ترجیحی من است. به عنوان یک مادر شاغل چهار فرزند، وقت محدود و ارزشمندی با دوستان دارم. برای سال‌ها، معمولاً دوستان را برای صرف صبحانه یا قهوه، و گاه‌گاهی برای بیرون رفتن از شب مادر ملاقات می‌کردم. به طور پیش فرض، این گردهمایی ها همیشه عجله داشتند. حتی یک برانچ طولانی و طولانی به ندرت بیش از یک ساعت دوام می آورد. در بیشتر رستوران‌ها، هیاهوی مداوم مکالمه و ظروف به ظروف چینی، آرامش واقعی و صمیمانه بودن را برایم دشوار می‌کرد. با این حال، به نظر نمی رسید جایگزین مناسبی وجود داشته باشد، بنابراین من به وضعیت موجود ماندم. وقتی فهمیدم می توانم به فرهنگ سونا به سبک اروپایی در ایالات متحده دسترسی داشته باشم، اوضاع تغییر کرد. سفر راهی متفاوت برای معاشرت به من نشان داد به عنوان یک شهروند دوگانه، اغلب به اروپا سفر می کنم. من در تمام عمرم با فرهنگ سونای اروپایی آشنا بودم. در کودکی، پدربزرگم اغلب در حمام محلی ناپدید می‌شد که آن را «شویتز» می‌نامید. او در مورد مزایای سلامتی درک شده از رفتن منظم به سونا صحبت کرد، اما حتی در دوران کودکی می‌توانستم بگویم جذابیت واقعی گذراندن وقت با دوستان بود، زیرا او به ندرت تنها به شویتز می‌رفت. با این وجود، در ابتدا سوناها را خیلی داغ دیدم و به این نتیجه رسیدم که برای من نیستند. اما از آنجایی که سونا و فرهنگ حمام کردن بخش بزرگی از سلامتی و فرهنگ اجتماعی اروپا هستند، من مدام"}, {"source": "Business Insider", "title": "New status symbols are taking over this fall. Here's what you'll see everywhere.", "link": "https://www.businessinsider.com/fall-fashion-trends-status-symbols-2026-10", "summary": "Maison Margiela; KHAITE; The Row; Getty Images; BI The fall fashion status symbols are loud and luxurious. Think oversize tote bags and sunglasses that look like ski goggles. If that's not your thing, there are also more subtle options — like $640 Khaite jeans. Leaves are falling, the air is crisp, and fashion is expensive. That's the 2026 fall season in a nutshell. When it comes to the latter, you might notice a few trends from fashionable folks as we make our way through autumn. Loud, luxurious pieces are at the forefront again. Sunglasses are statement-makers, bags are bigger, and shoes are distinctive. These are the fashion status symbols men and women are loving right now. This fall, you ll see everyone carrying extra-oversized designer bags. The large Margate bag from Burberry. Edward Berthelot/Getty Images Apologies to anyone who purchased a Coach Brooklyn bag or a Chloé Paddington purse in recent years. In 2026, we're going bigger. Fashion houses like Bottega Veneta showcased massive totes on fall runways, and search interest in \"oversize bags\" is up more than 5,000% compared with this time last year, according to Google Trends. Some popular options include Burberry's $1,395 large Margate bag , The Row's $3,900 Jean Shoulder Bag , and Bottega Veneta's $5,100 Jodie bag . The most coveted jeans cost between $590 and $820 per pair. Elsa Hosk at a 2026 Khaite runway show in New York City. Aeon/Getty Images Khaite jeans have been around for a while — 10 years to be exact. If you've scrolled through TikTok in the past month, though, chances are that you've heard people rave about Walmart's $30 jeans that some say are a dupe for the brand's luxury pairs. Naturally, that's brought the New York City brand that's loved by celebrities and models — including Elsa Hosk, Hailey Bieber, and Dakota Johnson — back into the spotlight. Khaite jeans are no longer a quiet-luxury staple. Owning the real thing is the ultimate display of wealth and style. The brand's jeans cost between $590 and $820 per pair. The fragrance for fall goes to Dries Van Noten. The Velvet Violet perfume from Dries Van Noten. Dries Van Noten Perfumers told Business Insider that the best scents to wear this fall are woody, gourmand, nutty, and floral. The $350 Velvet Violet perfume from Dries Van Noten is all of those things. It includes notes of violet leaf, grilled tonka bean, and vetiver, among others. The unisex fragrance received rave reviews on TikTok when it was released in July, with man", "date_str": "2026-10-09T11:01:01+00:00", "hash": "309e36fcb1034b13", "title_fa": "نمادهای وضعیت جدید پاییز امسال را در اختیار می گیرند. در اینجا چیزی است که در همه جا خواهید دید.", "summary_fa": "Maison Margiela; KHAITE; ردیف؛ گتی ایماژ; BI نمادهای وضعیت مد پاییزی پر سر و صدا و مجلل هستند. به کیف های بزرگ و عینک آفتابی که شبیه عینک اسکی هستند فکر کنید. اگر این مورد شما نیست، گزینه های ظریف تری نیز وجود دارد - مانند شلوار جین Khaite 640 دلاری. برگ ها می ریزند، هوا صاف است و مد گران است. به طور خلاصه این فصل پاییز 2026 است. وقتی نوبت به دومی می‌رسد، ممکن است متوجه چند روند از افراد شیک‌پوش شوید که در پاییز راه خود را طی می‌کنیم. قطعات بلند و لوکس دوباره در خط مقدم قرار دارند. عینک آفتابی بیانگر است، کیف‌ها بزرگ‌تر هستند و کفش‌ها متمایز هستند. اینها نمادهای وضعیت مد هستند که مردان و زنان در حال حاضر عاشق آن هستند. پاییز امسال، همه را خواهید دید که کیف‌های طراحی بسیار بزرگ حمل می‌کنند. کیف بزرگ مارگیت از باربری. ادوارد برتلو/ گتی ایماژ از هر کسی که در سال‌های اخیر کیف کوچ بروکلین یا کیف پول چلو پدینگتون خریده است عذرخواهی می‌کند. در سال 2026، ما بزرگتر می شویم. طبق گزارش گوگل ترندز، خانه‌های مد مانند Bottega Veneta لباس‌های عظیم را در باندهای پاییزی به نمایش گذاشتند و علاقه جستجو به \"کیف‌های بزرگ\" در مقایسه با سال گذشته بیش از 5000 درصد افزایش یافته است. برخی از گزینه های محبوب عبارتند از کیف بزرگ مارگیت 1395 دلاری Burberry، کیف جین شانه 3900 دلاری The Row و کیف Jodie 5100 دلاری Bottega Veneta. محبوب ترین شلوار جین بین 590 تا 820 دلار برای هر جفت قیمت دارد. السا هاسک در باند فرودگاه Khaite 2026 در شهر نیویورک. Aeon/Getty Images شلوار جین Khaite مدتی است که وجود داشته است - دقیقاً 10 سال است. با این حال، اگر در ماه گذشته در TikTok پیمایش کرده باشید، به احتمال زیاد شنیده اید که مردم درباره شلوار"}, {"source": "Business Insider", "title": "High earners are more likely to trust influencers, buy from them, and want their jobs", "link": "https://www.businessinsider.com/influencer-trust-rises-with-income-morning-consult-survey-2026-10", "summary": "Getty Images; Tyler Le/BI High earners trust influencers and are more likely to buy from them, new research finds. 61% of high earners trusted creator recommendations, versus about half of lower earners. Economic jitters are changing how influencers pitch, though. High earners love influencers and are more likely to trust the products they recommend. That's the core takeaway of new research conducted exclusively for Business Insider by Morning Consult. Those earning over $100,000 a year were more likely to trust influencers, be politically swayed by them, and want to become influencers themselves, according to a survey of about 2,000 US adults in September. That's compared to those earning $50,000 to $100,000, and less than $50,000. Amanda Acevedo, director of talent at G B Digital Management , pointed to a simple dynamic: Influencers feel more relatable to those with disposable income. \"The general population online knows creators make good money for themselves,\" Acevedo said. \"I think it's hard if you don't see yourself in them, or you don't feel like they're having the same life experience.\" Relatability is core to trust in the creator economy . \"When you are making more money, you don't view them as out of touch because you can relate to it a bit more — you have more spending power,\" said Natalie Barbu, founder of Rella and a former lifestyle influencer. In the Morning Consult survey, 61% of high earners trusted influencer product recommendations , compared with about half of those in lower-income brackets. They were also more likely than their lower-income peers to say they trusted influencers more now than they did a few years ago. It's easy to envy the glamorous influencer lifestyle. In reality, many influencers aren't rolling in money — though even those in the creator middle class often seek to project a luxurious existence. Still, creators and marketers said lower-income people may feel increasingly disconnected from influencers. Gild Creative Group CEO Tiffany Hardin said she had to take that dynamic into consideration when partnering with a brand at the Cannes Lions ad bash. \"We were really careful not to be like, 'We're on the boat, and you're not,'\" she said. Fans are feeling the economic squeeze Influencers are responding to the economic jitters of some of their audiences. \"People are getting drained of being sold to and things that aren't authentic,\" Acevedo said. \"There's an urge to go back to simplicity.\" Acevedo and Grace Murray-Vazquez,", "date_str": "2026-10-09T11:00:01+00:00", "hash": "00ffd992b98e7cc2", "title_fa": "افراد با درآمد بالا بیشتر به اینفلوئنسرها اعتماد می کنند، از آنها خرید می کنند و شغلشان را می خواهند", "summary_fa": "گتی ایماژ; تحقیقات جدید نشان می‌دهد افرادی که درآمد بالایی دارند تایلر لی/بی‌ای به اینفلوئنسرها اعتماد دارند و به احتمال زیاد از آنها خرید می‌کنند. 61 درصد از افراد با درآمد بالا به توصیه‌های محتواسازان اعتماد داشتند، در مقابل حدود نیمی از افراد کم درآمد. با این حال، آشفتگی های اقتصادی در حال تغییر نحوه بیان تأثیرگذاران است. افراد با درآمد بالا عاشق اینفلوئنسرها هستند و به احتمال زیاد به محصولاتی که آنها توصیه می کنند اعتماد می کنند. این نکته اصلی تحقیقات جدید است که به طور انحصاری برای Business Insider توسط Morning Consult انجام شده است. بر اساس نظرسنجی از حدود 2000 بزرگسال آمریکایی در ماه سپتامبر، کسانی که بیش از 100000 دلار در سال درآمد دارند، به احتمال زیاد به اینفلوئنسرها اعتماد می کنند، تحت تاثیر سیاسی آنها قرار می گیرند و می خواهند خودشان اینفلوئنسر شوند. این در مقایسه با کسانی است که 50000 تا 100000 دلار و کمتر از 50000 دلار درآمد دارند. آماندا آسودو، مدیر استعدادهای G B Digital Management، به یک پویایی ساده اشاره کرد: اینفلوئنسرها با کسانی که درآمد قابل تصرف دارند احساس ارتباط بیشتری می کنند. آسودو گفت: «جمعیت عمومی آنلاین می‌دانند که سازندگان پول خوبی برای خود به دست می‌آورند. فکر می‌کنم سخت است اگر خودتان را در آن‌ها نبینید یا احساس نکنید که آن‌ها تجربه‌ی مشابهی از زندگی دارند.» همبستگی هسته اصلی اعتماد به اقتصاد خالق است. ناتالی باربو، بنیانگذار Rella و تأثیرگذار سابق سبک زندگی، می‌گوید: «وقتی پول بیشتری به دست می‌آورید، آن‌ها را دور از دسترس نمی‌بینید، زیرا می‌توانید کمی بیشتر با آن ارتباط برقرار کنید - قدرت خرج کردن بیشتری دارید». در نظرسنجی Morning Consult، 61 درصد از افراد پردرآمد به توصیه‌های محصول تأثیرگذار اعتماد داشتند، در مقایسه با نیمی از افرادی که در براکت‌های کم درآمد بودند. آنها همچنین بیشتر از همتایان کم‌درآمد خود می‌گفتند"}, {"source": "Business Insider", "title": "At the movies, tech founders like Mark Zuckerberg and Elon Musk are in their villain era", "link": "https://www.businessinsider.com/tech-founder-movies-zuckerberg-altman-holmes-social-reckoning-2026-10", "summary": "Movies about Sam Altman, Elizabeth Holmes, Mark Zuckerberg, and Elon Musk are all coming out in 2026. Neon; Philip Pacheco/Getty Images; Sony; BI \"The Social Reckoning\" leads a wave of new films about tech founders like Mark Zuckerberg and Sam Altman. Hollywood's obsession with this subgenre reflects our anxiety about who holds power. Get ready for some techno-pessimism at the movies. When David Fincher's Facebook origin story \"The Social Network\" premiered 16 years ago, it delighted critics with its witty dialogue and nuanced character work. Aaron Sorkin was awarded the Oscar for best adapted screenplay, and Jesse Eisenberg was hailed for his portrayal of Mark Zuckerberg as an aggrieved yet triumphant prodigy. Playing a rising tech titan earned Eisenberg an Oscar nomination and made him synonymous with Zuck — not a bad thing in 2010, when Zuckerberg was crowned Time's Person of the Year . A lot has changed since then. These days, Eisenberg would rather not be associated with the tech wonder whose wealth, influence, and impunity have more in common with that of an oligarch than a scrappy college kid. Eisenberg declined to reprise the role for Sorkin's new pseudo-sequel, \"The Social Reckoning,\" and Jeremy Strong took on the part instead. \"He simply did not want to be conflated with Mark Zuckerberg anymore,\" Sorkin told Vanity Fair of Eisenberg. \"He doesn't like kids coming up to him in airports with business cards that say 'I'm CEO, bitch' for him to sign.\" \"The Social Reckoning,\" out Friday, reflects Eisenberg's change of heart about Zuckerberg on a macro scale. Gone is the smug, impish charm of Eisenberg's hoodie-clad Harvard dropout . Now, Strong's Zuck has tailored suits and the severity of a tyrant. Facebook — now Meta — is no longer the dorm-room startup that launched a billion friend requests; the company is depicted as a sinister and relentless force, a tool that kids use to bully each other and extremists use to spread hate speech. The movie's climax dovetails with the January 6 insurrection , which Zuckerberg watches unfold from his \"war room.\" It's far from the only movie this season to paint a tech titan's rise to power as a sobering sign of the times. \"The Social Reckoning\" premieres the same day as \"Musk,\" Alex Gibney's super-sized documentary about Tesla and SpaceX CEO Elon Musk, an incisive, nearly four-hour affair that Musk has decried as a \"hit piece.\" Next week, there's \" You Can See Everything ,\" a genre-bending documentary that locks co", "date_str": "2026-10-09T09:54:01+00:00", "hash": "d44170f0ff962831", "title_fa": "در سینما، بنیانگذاران فناوری مانند مارک زاکربرگ و ایلان ماسک در دوران شرور خود هستند", "summary_fa": "فیلم‌هایی درباره سم آلتمن، الیزابت هلمز، مارک زاکربرگ و ایلان ماسک همگی در سال 2026 اکران می‌شوند. فیلیپ پاچکو/گتی ایماژ; سونی؛ BI \"The Social Reckoning\" موجی از فیلم های جدید درباره بنیانگذاران فناوری مانند مارک زاکربرگ و سم آلتمن را رهبری می کند. وسواس هالیوود با این زیرژانر نشان دهنده نگرانی ما از اینکه چه کسی قدرت را در دست دارد. برای کمی بدبینی فنی در سینما آماده شوید. هنگامی که داستان اصلی فیس بوک دیوید فینچر \"شبکه اجتماعی\" 16 سال پیش نمایش داده شد، منتقدان را با دیالوگ های شوخ و کاراکترهای ظریف خود خوشحال کرد. آرون سورکین اسکار بهترین فیلمنامه اقتباسی را دریافت کرد و جسی آیزنبرگ به خاطر بازی در نقش مارک زاکربرگ به عنوان یک اعجوبه رنجیده و در عین حال پیروز مورد ستایش قرار گرفت. ایزنبرگ با بازی در نقش یک غول تکنولوژی در حال رشد، نامزدی اسکار را به همراه داشت و او را مترادف با زاک کرد – در سال 2010، زمانی که زاکربرگ به عنوان شخصیت سال تایم انتخاب شد، اتفاق بدی نبود. از آن زمان خیلی چیزها تغییر کرده است. این روزها، آیزنبرگ ترجیح می‌دهد با شگفتی‌های فناوری همراه نباشد که ثروت، نفوذ و معافیت آن بیشتر با ثروت یک الیگارشی مشترک است تا یک بچه دانشگاهی بی‌حس. آیزنبرگ از ایفای مجدد این نقش برای دنباله شبه جدید سورکین، «حساب اجتماعی» خودداری کرد و جرمی استرانگ به جای آن نقش را بر عهده گرفت. سورکین به Vanity Fair از آیزنبرگ گفت: «او دیگر نمی‌خواست با مارک زاکربرگ اشتباه شود. او دوست ندارد بچه‌هایی که در فرودگاه‌ها با کارت ویزیت‌هایی که روی آن نوشته شده «من مدیرعامل هستم، عوضی» به سراغش بیایند تا او امضا کند.» «حساب اجتماعی» که روز جمعه منتشر شد، تغییر دیدگاه آیزنبرگ در مورد زاکربرگ را در مقیاس کلان منعکس می کند. جذابیت از خود راضی و بی‌رحم"}, {"source": "Business Insider", "title": "Dell pledges $1,000 to Trump Accounts of employees' kids, and says it will become a standard benefit in corporate America", "link": "https://www.businessinsider.com/michael-dell-trump-accounts-employee-benefits-2026-10", "summary": "Anna Moneymaker/Getty Images Tech giant Dell is planning to put a $1,000 in its employees' children's Trump Accounts. CEO Michael Dell said this week that such donations will become a standard corporate benefit. Dell is closely linked to the program as his family foundation has donated $6.25 billion. Dell is joining the list of companies paying into the Trump Accounts of its employees' children. \"We plan to provide a one-time $1,000 contribution for eligible children of our team members, in addition to any government seed contribution for which the child qualifies,\" a Dell company spokesperson told Business Insider. The company is still working through the logistics and guidance from the US Treasury, the spokesperson added. Employees can apply for and contribute to their children's Trump Accounts and receive the government's one-time contribution in the meantime. Trump Accounts , launched on July 4, are a new investment program designed to help children grow their wealth. If your baby is born between 2025 and 2028 and is an American citizen, the government will deposit $1,000 into the account. Companies, including Goldman Sachs, Micron, and Chipotle, have also announced plans to match the government's $1,000 contribution for their employees. On Wednesday, Michael Dell, the founder of Dell Technologies, told Fox News that he believes donations to Trump Accounts will become \"a standard benefit\" at many companies. Dell is closely tied to the Trump Accounts scheme . His family foundation, which he leads with his wife, Susan, has donated $6.25 billion to the program, and he has made regular appearances alongside the president over the last year to promote the investment program. The Dells' donation is set to land in Trump Accounts this week as a $250 contribution for eligible recipients. To qualify , recipients must be born between 2016 and 2024, and live in a ZIP code with a median family income of $115,000 or less, based on US Census data. By the end of the week, 25 million accounts will have received the $250 lump sum, Dell told Fox News on Wednesday. Have a tip or story to share? Contact this reporter via email at pthompson@businessinsider.com or Signal at Polly_Thompson.89. Use a personal email address, a nonwork WiFi network, and a nonwork device; here's our guide to sharing information securely . The Dell Foundation has long focused its philanthropic efforts on children, education, and economic opportunity, aligning with the mission of Trump Accounts. \"W", "date_str": "2026-10-09T09:53:57+00:00", "hash": "46c61fba46e41355", "title_fa": "دل تعهد 1000 دلاری را به حساب‌های ترامپ از فرزندان کارمندان می‌دهد و می‌گوید این یک مزیت استاندارد در شرکت‌های آمریکایی خواهد بود.", "summary_fa": "Anna Moneymaker/Getty Images غول فناوری Dell قصد دارد 1000 دلار در حساب های ترامپ فرزندان کارمندان خود بگذارد. مدیرعامل مایکل دل این هفته گفت که چنین کمک هایی به یک مزیت استاندارد شرکت تبدیل خواهد شد. دل ارتباط نزدیکی با این برنامه دارد زیرا بنیاد خانواده او 6.25 میلیارد دلار کمک مالی کرده است. دل در حال پیوستن به لیست شرکت هایی است که به حساب های ترامپ فرزندان کارمندانش پول پرداخت می کنند. یکی از سخنگویان شرکت دل به Business Insider گفت: «ما قصد داریم برای فرزندان واجد شرایط اعضای تیم خود، علاوه بر هر سهم دولتی که کودک واجد شرایط آن باشد، یک سهم 1000 دلاری ارائه کنیم. سخنگوی وزارت خزانه داری آمریکا اضافه کرد که این شرکت همچنان از طریق لجستیک و راهنمایی های خزانه داری ایالات متحده کار می کند. کارمندان می توانند برای اکانت ترامپ فرزندان خود درخواست دهند و به آنها کمک کنند و در این مدت کمک یکباره دولت را دریافت کنند. حساب های ترامپ که در 4 جولای راه اندازی شد، یک برنامه سرمایه گذاری جدید است که برای کمک به رشد ثروت کودکان طراحی شده است. اگر نوزاد شما بین سال های 2025 تا 2028 متولد شده باشد و شهروند آمریکا باشد، دولت 1000 دلار به این حساب واریز می کند. شرکت‌هایی از جمله گلدمن ساکس، میکرون و چیپوتل نیز اعلام کرده‌اند که قصد دارند با کمک 1000 دلاری دولت برای کارمندان خود مطابقت کنند. روز چهارشنبه، مایکل دل، بنیانگذار Dell Technologies، به فاکس نیوز گفت که معتقد است کمک های مالی به حساب های ترامپ برای بسیاری از شرکت ها \"یک مزیت استاندارد\" خواهد بود. دل ارتباط نزدیکی با طرح حساب های ترامپ دارد. بنیاد خانوادگی او که او به همراه همسرش سوزان رهبری می کند، 6.25 میلیارد دلار به این برنامه کمک کرده است و او در سال گذشته"}, {"source": "Business Insider", "title": "From Gekko to Belfort: 5 favorite finance movies, ranked", "link": "https://www.businessinsider.com/5-best-finance-markets-movies-all-time-ranked-first-trade-2026-10", "summary": "Michael Douglas as insider-trading kingpin Gordon Gekko in Wall Street. Sunset Boulevard/Corbis via Getty Images \"The Social Reckoning\" is out today, and it's part of a flood of tech-focused business films. You know what's better than tech? Finance and markets movies. See below for my top five of all time. Sign up for First Trade , Business Insider's daily markets newsletter. In case you live under a rock (or, even worse, don't read Business Insider) there's a new Facebook movie called \" The Social Reckoning \" out today. It's not getting the best reviews, but I don't care. The first Facebook movie is an all-time great. Plus I want to see \"Succession\" favorite Jeremy Strong do his best Mark Zuckerberg impression for two hours. That alone is worth the price of admission. It's part of a recent run of business movies centered on Silicon Valley . But I prefer business films of finance variety — the ones about traders, bankers, dealmakers, and the occasionally fraudulent pursuit of getting rich. So, after years of rewatching the classics — plus plenty I would never recommend — here are my five favorite finance movies. Check out the list below, then send any disagreements to jciolli@businessinsider.com . 1. Boiler Room (2000) Vin Diesel and Giovanni Ribisi in the 2000 movie Boiler Room. Getty Images \"Boiler Room\" is not the best finance movie ever made. But it is the most fun. Its penny-stock pump-and-dump schemes are so flagrantly illegal that suspension of disbelief is required. But that's beside the point. This film is a vehicle for an absurdly entertaining early-2000s cast playing Long Island brokers gone wild. Vin Diesel delivers a perfect sales pitch to rapturous applause. Ben Affleck gets two electric motivational monologues, including the immortal observation that people who call money evil simply do not have any. Giovanni Ribisi anchors the movie as an ambitious poker-room hustler turned broker, while Jamie Kennedy steals scenes from what feels like a completely different movie. The crew also ventures into Manhattan to beat up rival brokers and celebrate fraudulent IPOs — a reminder that subtlety was never on the menu. Offensive? Often. Electric? Absolutely. A perfect 10. 2. The Big Short (2015) Steve Carell, in character as Mark Baum, making a typically disgusted face on the set of The Big Short. Alo Ceballos/GC Images Steve Carell wears a face throughout \"The Big Short\" that makes for a terrific reaction meme. Did someone say something questionable or ", "date_str": "2026-10-09T09:50:01+00:00", "hash": "266ab503fa149727", "title_fa": "از گکو تا بلفورت: 5 فیلم مورد علاقه مالی، رتبه بندی شده", "summary_fa": "مایکل داگلاس در نقش گوردون گکو، پادشاه معاملات داخلی در وال استریت. Sunset Boulevard/Corbis via Getty Images \"The Social Reckoning\" امروز اکران می شود و بخشی از سیل فیلم های تجاری متمرکز بر فناوری است. می دانید چه چیزی بهتر از فناوری است؟ فیلم های مالی و بازار. در زیر برای پنج مورد برتر من در تمام دوران مشاهده کنید. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. اگر زیر سنگ زندگی می کنید (یا حتی بدتر از آن، Business Insider را نخوانید)، امروز یک فیلم جدید فیس بوک به نام \"The Social Reckoning\" منتشر شده است. بهترین نقدها را دریافت نمی کند، اما برایم مهم نیست. اولین فیلم فیس بوک یک فیلم فوق العاده تمام دوران است. بعلاوه، من می خواهم ببینم جرمی استرانگ مورد علاقه \"جانشینی\" بهترین برداشت خود از مارک زاکربرگ را برای دو ساعت انجام می دهد. این به تنهایی ارزش پذیرش را دارد. این بخشی از مجموعه اخیر فیلم های تجاری با محوریت دره سیلیکون است. اما من فیلم‌های تجاری با تنوع مالی را ترجیح می‌دهم - فیلم‌هایی که درباره معامله‌گران، بانکداران، معامله‌گران، و گاه به گاه متقلبانه دنبال ثروتمند شدن هستند. بنابراین، پس از سال‌ها تماشای مجدد آثار کلاسیک - به‌علاوه تعداد زیادی از آنها که هرگز توصیه نمی‌کنم - در اینجا پنج فیلم مالی مورد علاقه من است. لیست زیر را بررسی کنید، سپس هرگونه اختلاف نظر را به jciolli@businessinsider.com ارسال کنید. 1. اتاق دیگ بخار (2000) وین دیزل و جیووانی ریبیسی در فیلم اتاق دیگ بخار محصول 2000. Getty Images «اتاق دیگ بخار» بهترین فیلم مالی ساخته شده نیست. اما سرگرم کننده ترین است. طرح‌های پمپ و تخلیه سهام آن چنان غیرقانونی است که تعلیق ناباوری لازم است. اما این در کنار موضوع است. این فیلم وسیله‌ای برای بازیگران سرگرم‌کننده اوایل دهه 2000 است که نقش دلالان لانگ آیلند"}, {"source": "Business Insider", "title": "McKinsey top exec: AI is making workers, not companies, more productive", "link": "https://www.businessinsider.com/mckinsey-ai-productivity-workers-companies-gains-2026-10", "summary": "McKinsey s Eric Kutcher said AI has increased workers productivity more than that of the organizations they work for. Jemal Countess/Getty Images for Fortune Media McKinsey's Eric Kutcher says AI is boosting workers more than organizations as a whole. The firm's North America chair said companies must rethink how they work to achieve broad gains. Software is a bright spot: AI has helped developers generate more code and release features faster. AI is helping workers get more done, though not necessarily delivering broad benefits for the organizations that employ them, according to a top McKinsey Company executive. Eric Kutcher , a senior partner and chair of McKinsey North America, told reporters at the company's media day on Wednesday that outside specific areas such as software development, many of the hoped-for productivity increases have yet to materialize across companies. \"You have people that are getting more productive as individuals, but they're just changing some of the work that they're doing,\" he said. Until companies look at the scope of work across an organization and identify inefficiencies in the system, it's hard to generate sweeping increases in output , Kutcher said. \"We have not gotten enterprise-level productivity, with the exception of a few areas,\" he said. Early on, he said, many companies' attempts to supercharge workers' productivity meant giving them access to tools like Anthropic's Claude and OpenAI's ChatGPT and, in some cases, telling them to use them as much as possible. Kutcher said that some companies even ranked who was using the most AI tokens \"without realizing those tokens cost money.\" That gap between workers' and companies' results shows up in McKinsey data. In August, the consulting firm's AI division, called QuantumBlack, reported that in a survey, eight in 10 respondents said AI had increased their productivity. At the same time, the survey found that the share of respondents who said that AI had contributed to their organization's profits from core operations — before interest and taxes — was essentially flat from a year earlier, at 37%. Kutcher said the technology's benefits have materialized in areas such as software, where developers have used AI to generate more code . That can translate, he said, into quicker releases of new products and features. More businesses appear to be trying to turn the productivity boost software developers have seen from AI into broader results. McKinsey's survey showed a six percen", "date_str": "2026-10-09T09:44:01+00:00", "hash": "5d418d9f26eed248", "title_fa": "مدیر ارشد مک‌کینزی: هوش مصنوعی کارگران را بهره‌ورتر می‌کند نه شرکت‌ها", "summary_fa": "اریک کوچر از مک کینزی گفت هوش مصنوعی بهره وری کارگران را بیشتر از سازمان هایی که برای آنها کار می کنند افزایش داده است. جمال کنتس/ گتی ایماژ برای فورچون مدیا، اریک کاچر از مک‌کینزی می‌گوید هوش مصنوعی بیشتر از کل سازمان‌ها، کارگران را تقویت می‌کند. رئیس این شرکت در آمریکای شمالی گفت که شرکت ها باید در نحوه کار خود تجدید نظر کنند تا به دستاوردهای گسترده دست یابند. نرم افزار نقطه روشنی است: هوش مصنوعی به توسعه دهندگان کمک کرده تا کد بیشتری تولید کنند و ویژگی ها را سریعتر منتشر کنند. به گفته یکی از مدیران ارشد شرکت مک‌کینزی، هوش مصنوعی به کارگران کمک می‌کند کارهای بیشتری انجام دهند، اگرچه لزوماً مزایای گسترده‌ای برای سازمان‌هایی که آنها را استخدام می‌کنند ارائه نمی‌کند. اریک کوچر، یکی از شرکای ارشد و رئیس مک کینزی آمریکای شمالی، در روز چهارشنبه در روز رسانه این شرکت به خبرنگاران گفت که خارج از حوزه‌های خاص مانند توسعه نرم‌افزار، بسیاری از افزایش بهره‌وری مورد انتظار هنوز در بین شرکت‌ها محقق نشده است. او گفت: \"شما افرادی دارید که به عنوان فردی بهره وری بیشتری می کنند، اما آنها فقط بخشی از کارهایی را که انجام می دهند تغییر می دهند.\" کوچر گفت تا زمانی که شرکت‌ها به محدوده کار در یک سازمان نگاه نکرده و ناکارآمدی‌های سیستم را شناسایی کنند، ایجاد افزایش گسترده در بازده دشوار است. او گفت: «ما به استثنای چند حوزه به بهره‌وری در سطح شرکت نرسیده‌ایم. او گفت که در اوایل تلاش بسیاری از شرکت‌ها برای افزایش بهره‌وری کارگران به معنای دسترسی آنها به ابزارهایی مانند Anthropic's Claude و OpenAI's ChatGPT بود و در برخی موارد به آنها می‌گفتند تا حد امکان از آنها استفاده کنند. کوچر گفت که برخی از شرکت‌ها حتی افرادی را که بیشترین توکن‌های هوش مصنوعی را استفاده می‌کنند، رتبه‌بندی می‌کنند بدون اینکه متوجه"}, {"source": "Business Insider", "title": "3 rules for making money on Airbnb, from a short-term-rental owner who built a business by optimizing revenue", "link": "https://www.businessinsider.com/how-to-run-a-successful-airbnb-short-term-rental-strategies-2026-10", "summary": "Real estate investor Mike Savage and his family reside in South Carolina. Courtesy of Mike Savage Short-term rentals can earn more than long-term rentals, but they require a business mindset. Mike Savage, cofounder of SynergyStays, shares strategies that can help Airbnbs perform better. Pay attention to the median booking window, and focus on weekdays, not just weekends. Mike Savage has owned both long-term and short-term rentals — and he sees a fundamental difference between the two. With a long-term rental, investors can improve a property and potentially raise the rent, but the market largely determines what a comparable home can earn. A three-bedroom, one-bath house will generally command something close to what similar homes in the area rent for. A short-term rental offers more room to influence revenue, but it also requires more work. \"You're choosing to open a business\" when you buy a short-term rental, Savage told Business Insider. Investors need to think beyond the purchase price and location to operations, maintenance, guest communication, hospitality, marketing, photography, and listing descriptions. Savage started buying short-term rentals in South Carolina in 2017. At the time, he said, simply leaving guests a nice note and a bottle of wine could be enough to earn five-star reviews. Today, with stiffer competition, that's no longer enough. Savage, who quit his day job as a firefighter to invest full time and grow SynergyStays , a revenue-management business for short-term-rental owners, shares three strategies he uses to help properties perform better. 1. Pay attention to the median booking window Short-term-rental owners often focus on occupancy and average daily rate, or ADR. But Savage thinks an equally important metric is the median booking window: how far in advance guests typically book a given date. Knowing that number can help owners decide whether to hold their rates or lower them. Savage added an accessory dwelling unit, or ADU, to his South Carolina primary residence, creating another source of rental income. Courtesy of Mike Savage If guests in a market typically book about 30 days ahead, for example, an owner trying to fill a date 60 days out may be able to hold rates relatively high. There is still time for demand to materialize. Once a property enters its typical booking window, however, it may be time to consider lowering rates. Owners should try to avoid relying on last-minute bookings, which can force them to offer deeper dis", "date_str": "2026-10-09T09:30:01+00:00", "hash": "8cbfd2ca07d546d1", "title_fa": "3 قانون برای کسب درآمد در Airbnb، از یک مالک اجاره ای کوتاه مدت که با بهینه سازی درآمد، یک کسب و کار ایجاد کرده است.", "summary_fa": "مایک ساویج، سرمایه گذار املاک و مستغلات و خانواده اش در کارولینای جنوبی زندگی می کنند. با حسن نیت مایک ساویج اجاره‌های کوتاه‌مدت می‌توانند درآمد بیشتری نسبت به اجاره‌های بلندمدت داشته باشند، اما به یک طرز فکر تجاری نیاز دارند. مایک ساویج، یکی از بنیانگذاران SynergyStays، استراتژی هایی را به اشتراک می گذارد که می تواند به عملکرد بهتر Airbnbs کمک کند. به پنجره متوسط ​​رزرو توجه کنید و روی روزهای هفته تمرکز کنید، نه فقط آخر هفته. مایک ساوج دارای اجاره بلندمدت و کوتاه مدت است - و او تفاوت اساسی بین این دو می بیند. با اجاره بلندمدت، سرمایه گذاران می توانند ملک را بهبود بخشند و به طور بالقوه اجاره بها را افزایش دهند، اما بازار تا حد زیادی تعیین می کند که یک خانه قابل مقایسه می تواند چه درآمدی داشته باشد. یک خانه سه خوابه و یک حمام به طور کلی چیزی نزدیک به آنچه خانه های مشابه در منطقه برای آن اجاره می کنند، دارد. اجاره کوتاه مدت فضای بیشتری را برای تأثیرگذاری بر درآمد ارائه می دهد، اما به کار بیشتری نیز نیاز دارد. Savage به Business Insider گفت: «شما انتخاب می‌کنید که یک کسب‌وکار را باز کنید» وقتی یک اجاره کوتاه‌مدت می‌خرید. سرمایه گذاران باید فراتر از قیمت خرید و مکان به عملیات، تعمیر و نگهداری، ارتباطات مهمان، مهمان نوازی، بازاریابی، عکاسی و توضیحات فهرست فکر کنند. Savage در سال 2017 شروع به خرید اجاره های کوت
