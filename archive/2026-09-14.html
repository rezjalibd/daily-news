      media: [{"source": "Billboard", "title": "Juanes Talks Colombian Coffee, Remembers ‘Un Día Normal’ & Sings ‘Es Por Ti’ | Cafecito Con", "link": "https://www.billboard.com/video/juanes-un-dia-normal-es-por-ti-cafecito-con/", "summary": "Juanes sits down with Billboard for Cafecito Con to enjoy a cafecito in Miami, and gifts us an “Es Por Ti” serenade. Between pan de bono, memories and laughs, he reflects on Un Día Normal turning 25 and its cross-generational impact, opens up about his Juan Esteban project and genre-blending sound, and shares the music (and creativity) that continues to connect eras. Along the way, Juanes visits Manantial Market to order Colombian coffee and pan de bono, breaks down how “Es Por Ti” was written in Bogotá, answers how many black shirts he owns, talks about painting as another form of expression, explains how he prepares for tour (voice, guitar, rehearsals), spotlights Marea Viva and its work supporting sustainable housing in Chocó, Colombia, and wraps with guitar plus rapid-fire “hot cafecito” questions. Juanes: And it s because of you. That shine my eyes today. And it s because of you. Jessica Roiz: Thanks, Juanes. Please. Have you been here before or not? Juanes: First time I m coming here. Jessica Roiz We re at Manantial Market in Miami. Let s explore the place together. Juanes: It s like a dream more or less for me. Jessica Roiz: For you? It feels like home. It feels ? Juanes: Yes, look, I see that bread there like [ growls ] I m dying to eat this bread. [ Laughs ] Jessica Roiz:Is it a cheese bread? Juanes: Mmm, bread with cheese. [ growls ] I want to eat that thing. Hi, what s your name? Nice to meet you, Claudia. Claudia: Nice to meet you. Juanes: Oh, thanks. How are you? Claudia: Super good. Yes, yes. Yes, very well. Juanes: Want a one hundred percent Colombian coffee? Nice little coffee. You know what? I ll have one of, of, of those instead. So, two coffees. Because yes, I ll have a double espresso right now. It makes me want to clean this whole place here and organize everything again. So we re very, very nice. Perfect. Claudia: So I m going to prepare two coffees. Juanes: Two little coffees and you don t want to eat anything. What do you want? A what? Look, look how delicious those breads are. What about cheese bread? Jessica Roiz: I like pan de bono. Claudia: It s really good. Pan de bono? Ready. With cheese. Juanes: I used to drink, I used to drink, like, 10 coffees a day. They told me that you re really into coffee. What? No, I love it, but I really had to stop because it I drank too much coffee. Watch this full video above!", "date_str": "2026-09-14T14:28:18+00:00", "hash": "289aa0bfc52dafd3", "title_fa": "Juanes با قهوه کلمبیایی صحبت می کند، \"Un Día Normal\" را به یاد می آورد و \"Es Por Ti\" را می خواند | Cafecito Con", "summary_fa": "Juanes با Billboard برای Cafecito Con می‌نشیند تا از یک کافه‌سیتو در میامی لذت ببرد و یک سرناد «Es Por Ti» به ما هدیه می‌دهد. بین پان دو بونو، خاطرات و خنده ها، او درباره 25 سالگی Un Día Normal و تأثیر بین نسلی آن فکر می کند، در مورد پروژه خوان استبان و صدای ترکیبی ژانر خود صحبت می کند، و موسیقی (و خلاقیت) را که همچنان دوران ها را به هم متصل می کند به اشتراک می گذارد. در طول راه، خوانس از بازار Manantial بازدید می کند تا قهوه کلمبیایی و پان د بونو سفارش دهد، نحوه نوشته شدن «Es Por Ti» را در بوگوتا شرح می دهد، پاسخ می دهد که چند پیراهن مشکی دارد، در مورد نقاشی به عنوان شکل دیگری از بیان صحبت می کند، توضیح می دهد که چگونه برای تور آماده می شود (صدا، گیتار، تمرین)، نورهای کانونی Marea Supporting و Colombia و حمایت از آن را نشان می دهد. با سوالات گیتار به همراه آتش سریع \"کافه سیتو داغ\". خوانز: و این به خاطر توست. که امروز چشمانم می درخشد و به خاطر توست جسیکا رویز: ممنون، خوانز. لطفا قبلا اینجا بودی یا نه؟ خوانز: اولین باری است که می آیم اینجا. جسیکا رویز ما در بازار Manantial در میامی هستیم. بیایید با هم مکان را کشف کنیم. خوانس: برای من کم و بیش مثل یک رویاست. جسیکا رویز: برای تو؟ مثل خانه است. احساس می کند؟ خوانس: بله، نگاه کن، من می بینم که نان آنجا مثل [غرغر می کند] دارم میمیرم تا این نان را بخورم. [می خندد] جسیکا رویز: نان پنیری است؟ Juanes: Mmm، نان با پنیر. [غرغر می کند] می خواهم آن چیز را بخورم. سلام اسمت چیه از آشنایی با شما خوشحالم، کلودیا. کلودیا: از آشنایی با شما خوشحالم. خوانز: اوه، ممنون. چطوری؟ کلودیا: فوق العاده"}, {"source": "Billboard", "title": "Juanes on His Most Extensive U.S. Tour Yet: ‘I Think Right Now We Have the Best Version of Our Show’", "link": "https://www.billboard.com/music/latin/juanes-world-tour-2026-cafecito-con-video-interview-1236338982/", "summary": "“It’s the first time I’m going to do such an extensive tour in the United States,” Juanes tells Billboard associate editor Jessica Roiz in the latest episode of Cafecito Con , premiering Monday (Sept. 14). “I love opening new paths, having new goals and connecting with people.” Related Juanes Kicks Off His Most Extensive North American Tour: Full Setlist Fonseca, Camilo, Juanes Carlos Vives Talk World Cup, Fatherhood and More Eladio Carrión Reveals He Nearly Died in Video Shoot With Cazzu: But We re Here Alive The Colombian rockstar launched his 30-date Juanes World Tour 2026 on Sept. 3 in Orlando, Fla., celebrating 25 years of his solo career with a career-spanning set that includes “La Camisa Negra,” “A Dios le Pido,” “Es Por Ti” and “Nada Valgo Sin Tu Amor,” alongside songs from his latest 2026 album, JuanesTeban . Juanes tells Billboard that he prepares for each show with a daily 40-minute vocal routine, constant guitar practice and rehearsals with his band. He and his team also worked with creative collaborators from Argentina on the tour’s lighting, visuals and stage design. “I love for people to go to the show and for it to be one surprise after another from beginning to end,” he says. “We organize everything through harmony or the BPM of each song, as if you were a DJ at a party.” In the interview, the Colombian singer and guitarist — known for his many No. 1 hits on the Hot Latin Songs chart, including “Me Enamora,” “La Camisa Negra,” and “Fotografía” — reflects on the 25th anniversary of Un Día Normal. The album, which topped the Top Latin Albums chart and spent 104 weeks on the tally, serves as a milestone in his career. Juanes also opens up about his creative evolution, his passion for painting, Colombian traditions, and the secret behind his famously youthful hair. In June, Juanes joined fellow Colombian stars Carlos Vives, Fonseca and Camilo for Billboard Español ’s historic cover story on soccer, fatherhood and their country’s spirit. Watch Juanes’ full Cafecito Con interview above.", "date_str": "2026-09-14T14:00:00+00:00", "hash": "4aa211f683bddac4", "title_fa": "Juanes در گسترده ترین تور ایالات متحده تاکنون: \"من فکر می کنم در حال حاضر بهترین نسخه نمایش خود را داریم\"", "summary_fa": "خوانز در آخرین قسمت از Cafecito Con که دوشنبه (14 سپتامبر) پخش می شود، به جسیکا رویز، سردبیر بیلبورد می گوید: «این اولین بار است که می خواهم چنین تور گسترده ای را در ایالات متحده انجام دهم. \"من عاشق باز کردن مسیرهای جدید، داشتن اهداف جدید و ارتباط با مردم هستم.\" خوانس مرتبط، گسترده‌ترین تور آمریکای شمالی خود را آغاز می‌کند: ست لیست کامل Fonseca، Camilo، Juanes Carlos Vives Talk World Cup، پدری و موارد دیگر Eladio Carrión فاش می‌کند که در فیلمبرداری ویدیویی با Cazzu نزدیک بود بمیرد: اما ما اینجا زنده‌ایم ستاره راک کلمبیایی 30-World62 Tourate را در Juptan2 منتشر کرد. 3 در اورلاندو، فلوریدا، 25 سال فعالیت انفرادی خود را با مجموعه‌ای حرفه‌ای که شامل «La Camisa Negra»، «A Dios le Pido»، «Es Por Ti» و «Nada Valgo Sin Tu Amor» به همراه آهنگ‌هایی از آخرین آلبوم سال 2026 خود، JuanesTeban، جشن گرفت. خوانز به بیلبورد می‌گوید که برای هر برنامه با یک روتین روزانه 40 دقیقه‌ای آواز، تمرین مداوم گیتار و تمرین با گروهش آماده می‌شود. او و تیمش همچنین با همکاران خلاق از آرژانتین در زمینه نورپردازی، تصاویر و طراحی صحنه تور کار کردند. او می‌گوید: «من عاشق این هستم که مردم به نمایش بروند و از ابتدا تا انتها این نمایش یکی پس از دیگری شگفت‌انگیز باشد. \"ما همه چیز را از طریق هارمونی یا BPM هر آهنگ سازماندهی می کنیم، گویی که شما یک دی جی در یک مهمانی هستید.\" در این مصاحبه، خواننده و گیتاریست کلمبیایی - که به خاطر شماره های متعددش شناخته می شود. 1 موفقیت در نمودار آهنگ های لاتین داغ، از جمله \"Me Enamora\"، \"La Camisa Negra\" و \"Fotografía\" - منعکس کننده بیست و پنجمین سالگرد Un Día Normal است. این آلبوم که در صدر جدول آلبوم‌های لاتین برتر قرار گرفت و 104 هفته در این فهرست"}, {"source": "Billboard", "title": "Dionne Warwick, Mya, Saweetie Join Forces on New Anthem ‘One Heart Can Change the World’", "link": "https://www.billboard.com/music/music-news/dionne-warwick-mya-saweetie-one-heart-can-change-world-1236339300/", "summary": "Grammy Award-winning legend Dionne Warwick has teamed with Grammy-winning R B/pop singer Mya and platinum-certified rap star Saweetie as the featured artists on the new anthem “One Heart Can Change the World.” The song is being released Sept. 25 in conjunction with the 45 th annual International World Peace Day. As the press announcement notes, “the day is dedicated to strengthening the ideals of peace both within and among all nations and peoples.” Academy Award-winning actor Forest Whitaker, the United Nations’ International Good Will Ambassador, is the single’s narrator. Also appearing on “One Heart Can Change the World” are Grammy-winning violinist Miri Ben-Ari and sound healer Ana Netanel. Commented Warwick, “I was part of the supergroup that united for USA For Africa in 1985 with a Michael Jackson/Lionel Richie-penned song produced by Quincy Jones, We Are the World. This groundbreaking musical collaboration was aimed at raising awareness for famine relief in Ethiopia. I was also joined in 1986 by my friends Elton John, Gladys Knight and Stevie Wonder on the Burt Bacharach/Carole Bayer Sager anthem That’s What Friends Are For, a No. 1 Grammy-winning song with all proceeds to this day benefiting the American Foundation for AIDS Research (amfAR.) I have seen just how powerful a song for a call to action can be.” Danny Labretti [L-to-R] Dionne Warwick, Damon Elliott, Forest Whitaker In his work on behalf of the United Nations, Whitaker also oversees the Whitaker Peace and Development Initiative (WPDI). The Sept. 25 release date for “One Heart Can Change the World” also marks the same day that WPDI will be hosting its “Rise As One” gala at Gotham Hall in New York City. Taking the stage that evening as honorees are Warwick, Mya and Saweetie. “In a world that longs for peace, it begins with a smile; from a smile hope takes flight,” said Whitaker in the press announcement. “One smile, one world, one heart.” “One Heart Can Change the World” is the third in a series of high-profile pairings from Warwick’s upcoming DWuets album with 17-time Academy Award-nominated songwriter and special Oscar recipient Diane Warren. Announced in March, DWuets — whose first two singles featured Cynthia Erivo and John Legend, respectively —will be the final album in Warwick’s storied career. Her Grammy-winning son Damon Elliott is producing all of the duets. As with the prior singles, “One Heart Can Change the World” is being released through Elliott Entertainment and Vydia Distr", "date_str": "2026-09-14T14:00:00+00:00", "hash": "96b4b004536a7f0e", "title_fa": "Dionne Warwick، Mya، Saweetie در سرود جدید \"One Heart Can Change the World\" به نیروها می پیوندند", "summary_fa": "دیون وارویک، اسطوره برنده جایزه گرمی، با میا خواننده آر بی/پاپ برنده گرمی و ساویتی، ستاره رپ دارای گواهینامه پلاتین، به عنوان هنرمندان برجسته در سرود جدید «One Heart Can Change the World» همکاری کردند. این آهنگ در 25 سپتامبر همزمان با چهل و پنجمین سالانه روز جهانی صلح منتشر می شود. همانطور که در اطلاعیه مطبوعاتی اشاره شده است، \"این روز به تقویت آرمان های صلح در داخل و بین همه ملت ها و مردم اختصاص دارد.\" فارست ویتاکر، بازیگر برنده جایزه اسکار، سفیر حسن نیت بین‌المللی سازمان ملل، راوی این آهنگ است. همچنین میری بن‌آری، ویولونیست برنده جایزه گرمی و آنا نتانل، شفا دهنده صدا، در \"One Heart Cannge the World\" حضور دارند. وارویک اظهار داشت: \"من بخشی از سوپرگروهی بودم که برای ایالات متحده آمریکا برای آفریقا در سال 1985 با آهنگی که توسط مایکل جکسون/لیونل ریچی نوشته شده بود توسط کوئینسی جونز، ما جهان هستیم، متحد شدم. این همکاری موسیقی پیشگامانه با هدف افزایش آگاهی برای رهایی از قحطی در اتیوپی انجام شد. استیوی واندر در سرود برت باچاراچ/کارول بایر ساگر That's What Friends Are For, a No. 1 آهنگ برنده گرمی با تمام درآمدهای حاصل از آن تا به امروز که به نفع بنیاد آمریکایی تحقیقات ایدز (amfAR) است. دنی لابرتی [L-to-R] Dionne Warwick، Damon Elliott، Forest Whitaker در کار خود از طرف سازمان ملل، ویتاکر همچنین بر ابتکار صلح و توسعه ویتاکر (WPDI) نظارت دارد. سپتامبر تاریخ انتشار 25 \"One Heart Can Change the World\" نیز همان روزی است که WPDI میزبان جشن \"Rise As One\" خود در گاتهام هال در شهر نیویورک خواهد بود. وارویک، میا و ساویتی در آن شب به عنوان برگزیدگان روی صحنه رفتند. ویتاکر در بیانیه مطبوعاتی گفت: «در جهانی که آرزوی صلح دارد، با لبخند آغاز می‌شود؛ امید از لبخند فرار می‌کند."}, {"source": "Billboard", "title": "Cheetah Chrome, Dead Boys Guitarist and Co-Founder Dies at 71", "link": "https://www.billboard.com/music/rock/cheetah-chrome-death-dead-boys-guitarist-dies-obituary-1236339325/", "summary": "Dead Boys guitarist and co-founder Cheetah Chrome has died at 71. The Cleveland-bred punk group announced the news in an Instagram message on Sunday night (Sept. 13) in which they wrote , We are incredibly sad to announce the news of the passing of our beloved friend and bandmate Cheetah Chrome. Cheetah was a true original, an architect of the punk rock movement. a one man hurricane tearing up the musical landscape with his feral guitar riffs and manic energy. Related Juanes on His Most Extensive U.S. Tour Yet: I Think Right Now We Have the Best Version of Our Show Gone But Not Forgotten: Musicians We Lost in 2026 Dionne Warwick, Mya, Saweetie Join Forces on New Anthem One Heart Can Change the World The tribute to the punk pioneer born Eugene Richard O Connor in Cleveland on Feb. 18, 1955, continued, Beyond all that Cheetah was also just a really sweet guy that loved rock-roll. We extend our deepest condolences to Cheetah s family, friends and fans around the world. His music lives on and will continue to inspire others for generations to come. We ask for privacy during this difficult time. At press time Billboard had not independently confirmed the details of Chrome s death and no cause of death had been announced. Chrome got his start in the short-lived, chaotic pre-punk Cleveland band Rocket From the Tombs, joining the band fronted by journalist and future Pere Ubu singer David Thomas for a year before it imploded and produced the Dead Boys and Pere Ubu. Dead Boys was fronted by kinetic, unpredictable live-wire singer Stiv Bators — who died at 40 in June 1990 — and earned a reputation as one of the most intense, unhinged bands of the era. The group, which also featured drummer Johnny Blitz, bassist Jeff Magnum and rhythm guitarist Jimmy Zero, moved to New York in 1976 and gained notoriety with a series of wild shows at the Mecca of punk: CBGB. The group s 1977 debut album, Young, Loud and Snotty , was produced by former Escorts singer Genya Ravan and exploded out of the gate with the song that would become their signature howl to arms: Sonic Reducer . The headlong blitz featuring Bators strangulated vocals, Chrome s paint-peeling guitar solo and Blitz s double-time surf rock solo is considered one of the building blocks of the punk movement. It s been covered by bands from Pearl Jam to Foetus, the Dictators and Patti Smith and was the featured cover by former Replacements bassist Tommy Stinson during his stint with Guns N Roses. The group only managed t", "date_str": "2026-09-14T13:25:19+00:00", "hash": "9371f3dda868b71c", "title_fa": "چیتا کروم، گیتاریست و یکی از بنیانگذاران Dead Boys در ۷۱ سالگی درگذشت", "summary_fa": "چیتا کروم، گیتاریست و یکی از بنیانگذاران Dead Boys در سن 71 سالگی درگذشت. گروه پانک پرورش یافته کلیولند یکشنبه شب (13 سپتامبر) در پیامی اینستاگرامی این خبر را اعلام کرد و در آن نوشت: با ناراحتی فوق العاده ای خبر درگذشت دوست و هم گروه محبوبمان چیتا کروم را اعلام می کنیم. چیتا یک اصیل واقعی بود، معمار جنبش پانک راک. طوفان یک نفره که چشم انداز موسیقی را با ریف های گیتار وحشی و انرژی شیدایی اش پاره می کند. Juanes مرتبط در گسترده‌ترین تور ایالات متحده تاکنون: فکر می‌کنم در حال حاضر بهترین نسخه از برنامه ما رفته است اما فراموش نشده است: نوازندگانی که در سال 2026 از دست دادیم Dionne Warwick، Mya، Saweetie به نیروها در New Anthem بپیوندند. 18، 1955، ادامه داد، فراتر از همه اینها چیتا همچنین یک مرد واقعاً شیرین بود که عاشق راک رول بود. ما عمیق ترین تسلیت خود را به خانواده، دوستان و طرفداران چیتا در سراسر جهان ابراز می کنیم. موسیقی او همچنان زنده است و برای نسل های آینده الهام بخش دیگران خواهد بود. ما برای حفظ حریم خصوصی در این زمان دشوار درخواست می کنیم. در زمان انتشار، بیلبورد به طور مستقل جزئیات مرگ کروم را تایید نکرده بود و هیچ دلیلی برای مرگ اعلام نشده بود. کروم کار خود را با گروه کوتاه مدت و پر هرج و مرج پیش پانک کلیولند Rocket From the Tomb آغاز کرد و به گروهی ملحق شد که توسط روزنامه نگار و خواننده آینده پر اوبو دیوید توماس به مدت یک سال پیش از انفجار و تولید Dead Boys و Pere Ubu پیوست. گروه Dead Boys با استیو باتورز، خواننده زنده و غیرقابل پیش‌بینی، که در ژوئن 1990 در سن 40 سالگی از دنیا رفت، روبرو شد و به عنوان یکی از قوی‌ترین و بی‌هدف‌ترین گروه‌های موسیقی آن دوران"}, {"source": "Billboard", "title": "‘Gabby’s Dollhouse’ Welcomes Doozie to the ‘Meow-Meow Bow-Wow Family’: Watch Her First Duet With Big Sis Gabby", "link": "https://www.billboard.com/music/music-news/gabbys-dollhouse-sister-doozie-duet-meow-meow-bow-wow-family-1236338838/", "summary": "In the new season of Gabby s Dollhouse , the Gabby Cats are making room for the Doozie Dogs. When season 14 of the long-running preschool series arrives Tuesday on Netflix, Gabby will be joined by her kid sister Doozie, who is just as obsessed with dogs as Gabby is with Cats. Now, Billboard Family has the exclusive premiere of the sisters first-ever duet: Meow-Meow Bow-Wow Family. Related Ahead of Gabby s Dollhouse Season 13, Take a em Meow /em gical Trip to Fairylandia With Brand-New Song: Premiere Before Gabby s Dollhouse Returns for Season 12, Pandy Paws Tells Us Why It s Good to Be a Gabby Cat in Brand-New Song: Premiere Don t You Wanna Go? Inside Gabby s Dollhouse Live s North American Expansion In the brand-new scene, we get to meet Doozie and her pup Puggie dancing and playing alongside Gabby and her cat Pandy. Sisters, whiskers, cats and dogs/ Waggin tails and clappin paws, they all sing together. We get along so happily/ We re a meow-meow bow-wow family. Watch below: Meow-Meow Bow-Wow Family is the focus track of the upcoming six-song Gabby s Dollhouse EP Pawty Time , which also arrives Tuesday via Republic Records: Kids Family. “This EP is such a fun milestone for the Gabby’s Dollhouse universe,” says Bree Bowles, senior vice president, Republic Records: Kids Family. “Introducing Doozie through music creates a whole new way for families to connect with these characters, and ‘Meow-Meow Bow-Wow Family’ perfectly captures the heart of what makes this franchise so special. We’re incredibly proud to continue growing the music alongside DreamWorks Animation and bringing fans even more stories they can sing, dance, and celebrate together.” Across the four new episodes hitting Netflix on Tuesday, Gabby (Laila Lockhart Kraner) and Doozie (Celestina Harris) will bring a whole new sisterly dynamic to the show, and music will play a big role in their family. “We’ve always believed that music is one of the most joyful ways to expand the world of Gabby’s Dollhouse , and Pawty Time is no exception,” says Alexandra Nickson, senior vice president, music, DreamWorks Animation. “Bringing Gabby and Doozie together musically opens the door to a wonderful new dynamic that families will instantly fall in love with. Music has always been central to the storytelling in Gabby’s Dollhouse , and this EP captures the fun, warmth, humor, and imagination that define both series.” Find the full Pawty Time track list below: “Meow-Meow Bow-Wow Family” “Doggy Dogs” “Fairy Sitter D", "date_str": "2026-09-14T12:30:00+00:00", "hash": "515a2c8c6c26ca6a", "title_fa": "«خانه عروسکی گابی» به دوزی در «خانواده میو-میو بو-واو» خوش آمد می‌گوید: اولین دوئت او را با سیس بزرگ گابی تماشا کنید", "summary_fa": "در فصل جدید Gabby s Dollhouse، گربه‌های Gabby در حال باز کردن فضایی برای Doozie Dogs هستند. وقتی فصل 14 سریال طولانی مدت پیش دبستانی روز سه شنبه در نتفلیکس می آید، گابی با خواهر بچه اش دوزی همراه می شود که به همان اندازه که گبی با گربه ها وسواس زیادی به سگ دارد. اکنون، خانواده بیلبورد اولین نمایش انحصاری اولین دوئت خواهران را دارد: Meow-Meow Bow-Wow Family. مربوط به قبل از Gabby s Dollhouse فصل 13، Take a em Meow/em Gical Trip to Fairylandia با آهنگ کاملاً جدید: نمایش قبل از بازگشت Gabbys Dollhouse برای فصل 12، Pandy Paws به ما می گوید چرا خوب است که گربه Gabby در Brand-New You Tong باشی؟ Inside Gabby Dollhouse Live s North America Expansion در صحنه کاملاً جدید، با دوزی و توله سگش پاگی روبرو می شویم که در کنار گبی و گربه اش پاندی می رقصند و بازی می کنند. خواهران، سبیل‌ها، گربه‌ها و سگ‌ها/ دم‌های واگن و پنجه‌های دست، همه با هم آواز می‌خوانند. ما خیلی با خوشحالی کنار می آییم/ ما یک خانواده میو-میو کمان-واو هستیم. در زیر تماشا کنید: Meow-Meow Bow-Wow Family قطعه محوری شش آهنگ آینده Gabby Dollhouse EP Pawty Time است که سه شنبه از طریق Republic Records: Kids Family نیز منتشر می شود. بری بولز، معاون ارشد Republic Records: Kids Family می گوید: «این EP نقطه عطف جالبی برای دنیای خانه عروسکی Gabby است. «معرفی دوزی از طریق موسیقی راه کاملاً جدیدی را برای خانواده‌ها ایجاد می‌کند تا با این شخصیت‌ها ارتباط برقرار کنند، و «خانواده میو-میو باو-واو» کاملاً قلب چیزی را که این فرنچایز را بسیار خاص می‌کند تسخیر می‌کند. ما فوق‌العاده مفتخریم که به رشد موسیقی در کنار DreamWorks Animation ادامه می‌دهیم و داستان‌های بیشتری را برای طرفداران به ارمغان می‌آوریم که بتوانند با هم بخوانند، برقصند و جشن بگیرند.» در"}, {"source": "Billboard", "title": "Inspired By U2, Oprah Winfrey Bringing Immersive, Star-Studded ‘AHA’ Experience to Las Vegas’ Sphere", "link": "https://www.billboard.com/culture/lifestyle/oprah-winfrey-aha-experience-las-vegas-sphere-details-1236339313/", "summary": "Oprah Winfrey is taking talk into a whole new dimension. The veteran host will launch Oprah Winfrey s AHA at Sphere in Las Vegas next April, a weekend-long event featuring musicians, artists and storytellers from around the world appearing live on stage with Winfrey in what is described as a brand-new visual, musically immersive symphony of senses. The 2027 shows on April 2, 3 and 4 were inspired by Winfrey s visit to see the very first Sphere resident performers, U2, back when the Irish rock legends opened the venue in 2023 with their U2: UV Achtung Baby Live at Sphere. “‘AHA’ is a dream that came to me as I sat in awe at the opening night of U2 at the Sphere, mesmerized by the possibilities of how the space could be used as a tool for creating greater awareness and understanding of ourselves and our connection to each other,” said Winfrey in a statement. “Creating this experience has felt like the culmination of what I’ve spoken about and worked towards my entire life.” Presale sign-up and weekend packages for the event are available now here ; a general on-sale begins on Sept. 25 at 10 a.m. PT. The two-hour show will feature Winfrey appearing live on stage with special guests, including performances from seven-time Grammy winner Jacob Collier, an appearance by poet and author Ocean Vuong ( On Earth We re Briefly Gorgeous ), musician Ajeet, gospel singer Wintley Phipps and others. The show s music direction and original music is being composed by Oscar nominee Max Richter ( Hamnet ), Grammy-winning musician and vocal director Jason White and Grammy-nominated composer, producer and electronic artist Jon Hopkins. In addition, the show will feature writing from MacArthur Genius grant recipient and Oscar-winning screenwriter Tarell Alvin McCraney ( Moonlight ) and original works by artist Es Devlin and the Plum Village Monks. Described as a journey of light, sound, music, storytelling, nature and shared humanity, the Live Nation-presented show is being designed by a production team including director Ethan Tobman and produced by Emmy-winner Baz Halpin of Silent House Group. In a promo video, Winfrey describes her first visit to the Sphere and how it inspired the new show. I had a big AHA! moment. What if this magnificent space could take us to the edge of the universe and deep within ourselves for an immersive symphony of awe, wonder and joy? she asks. Executive producers including Winfrey, along with producer of The Life You Want tour, Together Live founder", "date_str": "2026-09-14T12:30:00+00:00", "hash": "6fbb2eb8ae203ab2", "title_fa": "اپرا وینفری با الهام از U2، تجربه ای همهجانبه و ستاره دار \"AHA\" را به کره لاس وگاس می آورد", "summary_fa": "اپرا وینفری بحث را وارد ابعاد کاملاً جدیدی می کند. مجری کهنه کار AHA اپرا وینفری را در آوریل آینده در Sphere در لاس وگاس راه اندازی می کند، رویدادی آخر هفته با حضور نوازندگان، هنرمندان و داستان سرایان از سراسر جهان که به صورت زنده با وینفری روی صحنه حاضر می شوند، چیزی که به عنوان سمفونی حسی کاملاً بصری و غوطه ور از نظر موسیقی توصیف می شود. نمایش‌های 2027 در 2، 3 و 4 آوریل از بازدید وینفری برای دیدن اولین اجراکنندگان ساکن Sphere، U2، الهام گرفته شده است، زمانی که اسطوره‌های راک ایرلندی در سال 2023 با U2: UV Achtung Baby Live در Sphere سالن را افتتاح کردند. وینفری در بیانیه‌ای گفت: «AHA» رویایی است که وقتی با هیبت در شب افتتاحیه U2 در Sphere نشسته بودم، به سراغم آمد، و مسحور این احتمالات بودم که چگونه می‌توان از فضا به عنوان ابزاری برای ایجاد آگاهی و درک بیشتر از خود و ارتباطمان با یکدیگر استفاده کرد. \"ایجاد این تجربه اوج چیزی است که من در مورد آن صحبت کرده ام و برای تمام زندگی ام کار کرده ام.\" ثبت نام پیش فروش و بسته های آخر هفته برای این رویداد هم اکنون در اینجا موجود است. فروش عمومی در 25 سپتامبر در ساعت 10 صبح به وقت PT آغاز می شود. این نمایش دو ساعته شامل اجرای زنده وینفری روی صحنه با مهمانان ویژه می شود، از جمله اجراهایی از برنده هفت جایزه گرمی، جاکوب کولیر، حضور شاعر و نویسنده اوشن وونگ (در زمین ما به طور خلاصه زرق و برق دار هستیم)، موسیقیدان اجیت، خواننده انجیل، وینتلی فیپس و دیگران."}, {"source": "Billboard", "title": "Travis Barker Leans Into Benefits of Shelter Pet Adoption and Meat-Free Lifestyle in PSA For Humane World For Animals: ‘Just Do Good’", "link": "https://www.billboard.com/music/music-news/travis-barker-psa-humane-world-for-animals-vegan-pet-adoption-1236337614/", "summary": "It s not a stretch to say that when Blink-182 drummer Travis Barker gets behind his kit he is an animal. The hard-bashing, in-demand producer and collaborator attacks the skins like they owe him money. But in a new PSA for Humane World For Animals (formerly known as the Humane Society of the United States), Barker, 50, steps out from behind his drums to share a very special message about taking action to stand up for animals as part of the organization s Small Steps For Good campaign. Related Travis Barker Told Son Landon Barker to Turn Down ‘The Voice’: ‘You’re Way Too Cool for That’ All-Star Cretin Family Featuring Green Day s Billie Joe Armstrong, Rancid s Tim Armstrong Travis Barker Celebrate Ramones 50th Anniversary Cheetah Chrome, Dead Boys Guitarist and Co-Founder Dies at 71 I haven t eaten meat since I was 13 and I ve been a vegetarian since then, Barker, 50, tells Billboard about his longtime meat-free lifestyle. I didn t like the taste at the time and then I figured out where hot dogs and ham and steak came from and there s not a chance nope, can t do that! I ve always loved animals and I never liked the taste of meat. Barker says he teamed up with the Humane World For Animals because he felt a kinship with their mission. Plus, the goals of the campaign felt like a natural fit for him, including adopting pets from local animal shelters, not wearing products made out of real fur and using cruelty-free products such as those from his own vegan wellness company, Barker Wellness . He s been such an outspoken advocate for animal welfare that Barker says some of his favorite designers will make vegan versions of their clothes or sneakers for him and his next collab with VANS is planned as an all-vegan shoe. All my clothes are vegan-friendly, says Barker, who describes his daily uniform as Dickies pants, all-vegan Vans and a T-shirt. He s also happy to put his money where his meat-free mouth is, including investing in L.A. s upscale plant-based Crossroads Kitchen after chef Tal Ronnen pitched him on the idea at a Bad Brains show. The other day I was at Jay Leno s garage and we drove some cars and when I left with my 84-year-old dad I said, let s eat at this spot, and I could tell he wasn t thrilled, he said of his choice of Lotus Vegan, a spot he remembered riding his bike to when he lived in North Hollywood. And then during our meal, I said, dad, I eat at these places because they re all vegan and they need the support to stay open for business another", "date_str": "2026-09-14T11:15:00+00:00", "hash": "aa31a56264687867", "title_fa": "تراویس بارکر به مزایای پذیرش حیوانات خانگی در پناهگاه و سبک زندگی بدون گوشت در PSA For Humane World For Animals: \"Just Do Good", "summary_fa": "زیاد نیست که بگوییم وقتی تراویس بارکر درامر Blink-182 پشت کیت خود می‌رود، او یک حیوان است. تهیه کننده و همکار سرسخت و پرتقاضا به پوست ها حمله می کند که انگار به او بدهکار هستند. اما در یک PSA جدید برای دنیای انسانی برای حیوانات (که قبلاً به عنوان انجمن انسانی ایالات متحده شناخته می شد)، بارکر 50 ساله از پشت طبل های خود بیرون می آید تا پیام بسیار ویژه ای را در مورد اقدام برای دفاع از حیوانات به عنوان بخشی از کمپین گام های کوچک سازمان به اشتراک بگذارد. مرتبط تراویس بارکر به پسر لاندون بارکر گفت که «صدا» را رد کند: «تو خیلی باحالی برای این» خانواده ستاره‌ای کرتین با حضور بیلی جو آرمسترانگ از گرین دی، تیم آرمسترانگ، تیم آرمسترانگ، تراویس بارکر، پنجاهمین سالگرد رامونز را جشن می‌گیرند و در Cheetah Dieaound، و Cheetah Dieaerist. بارکر 50 ساله از 13 سالگی گوشت نخورده و از آن به بعد گیاهخوار بوده ام. من آن زمان طعم آن را دوست نداشتم و بعد فهمیدم که هات داگ و ژامبون و استیک از کجا آمده اند و شانسی نیست، نه، نمی توانم این کار را انجام دهم! من همیشه حیوانات را دوست داشتم و هرگز طعم گوشت را دوست نداشتم. بارکر می‌گوید که با World Humane For Animals همکاری کرده است، زیرا با مأموریت آنها احساس خویشاوندی کرده است. بعلاوه، اهداف کمپین برای او مناسب طبیعی بود، از جمله پذیرفتن حیوانات خانگی از پناهگاه های حیوانات محلی، نپوشیدن محصولات ساخته شده از خز واقعی و استفاده از محصولات عاری از ظلم مانند محصولات شرکت سلامتی وگان خودش، Barker Wellness. او چنان مدافع صریح رفاه حیوانات بوده که بارکر می‌گوید برخی از طراحان مورد علاقه‌اش نسخه‌های گیاهی از لباس‌ها یا کفش‌های کتانی خود را برای او می‌سازند و همکاری بعدی او با VANS به عنوان یک کفش کاملا"}, {"source": "Billboard", "title": "Charli XCX Responds to Fan Backlash Over Limited Tour Dates: ‘Emotionally and Physically Hard’", "link": "https://www.billboard.com/music/pop/charli-xcx-addresses-limited-tour-dates-1236339292/", "summary": "Charli XCX has responded to fan frustration over the limited number of dates on the upcoming UK and European leg of her Music, Fashion, Film tour, explaining that touring takes a significant toll on her. The singer recently announced a six-show 2027 run across Dublin, Glasgow, Manchester, London, Amsterdam and Paris, prompting some fans to voice disappointment in the comments over the small number of arena dates. In an Instagram statement, Charli acknowledged the reaction directly. I know there s a lot of frustration in the comments about the fact that I am not doing lots of dates. I am really sorry if you feel disappointed, but I have to honor my truth as an artist: touring is really emotionally and physically hard for me, she wrote. I am not looking for sympathy and I have a huge amount of respect for artists who can handle it at an intense, lengthy and high-octane level, but I am just not one of those human beings and I never have been, she continued, noting she had opted for a shorter run on her current North American tour for the same reasons. I m sorry if you feel I am letting you down; I really am. Perhaps one day I will be built for the kind of touring you expect from me, but right now I am not. She added that she hoped both fans and herself would enjoy the shows, saying she would try my best to stay in a healthy and positive mindset. The tour supports Music, Fashion, Film , Charli s seventh studio album, released July 24 as the follow-up to her culture-dominating 2024 record Brat . The album marked another sharp turn for the Essex-raised artist, leaning into darker, grittier rock sounds, and debuted at No. 1 on the Official U.K. Albums Chart — her fourth U.K. chart-topper, and one that made her the first British female artist to score two new No. 1 albums in the same calendar year. In the U.S., the album opened at No. 3 on the Billboard 200 and gave Charli her first No. 1 on Billboard s Top Album Sales chart. The UK and European run follows a landmark summer that included her first headline set at Reading Festival, and precedes the North American leg of the tour, which commenced on Friday (Sept. 11) in Philadelphia. The 12-date arena trek includes stops in New York, Toronto, Boston, Atlanta and Los Angeles before wrapping in Las Vegas on Oct. 23. Electronic artist Underscores will join Charli on the road.", "date_str": "2026-09-14T07:37:28+00:00", "hash": "27b104a9df162796", "title_fa": "واکنش Charli XCX به واکنش طرفداران در مورد تاریخ های محدود تور: از نظر احساسی و فیزیکی سخت است", "summary_fa": "چارلی XCX به ناامیدی طرفداران در مورد تعداد محدودی از تاریخ‌ها در دوره آتی موسیقی، مد و فیلم در بریتانیا و اروپا واکنش نشان داده است و توضیح داده است که تور تلفات قابل توجهی برای او می‌گیرد. این خواننده اخیراً از برگزاری شش برنامه در سال 2027 در دوبلین، گلاسکو، منچستر، لندن، آمستردام و پاریس خبر داد که باعث شد برخی از طرفداران ناامیدی خود را در نظرات در مورد تعداد کم تاریخ‌های مسابقه ابراز کنند. چارلی در یک بیانیه اینستاگرامی مستقیماً این واکنش را تایید کرد. من می دانم که در نظرات درباره این واقعیت که من قرارهای زیادی انجام نمی دهم، ناامیدی زیادی وجود دارد. من واقعا متاسفم اگر احساس ناامیدی می کنید، اما باید به حقیقت خود به عنوان یک هنرمند احترام بگذارم: او نوشت: تور از نظر احساسی و جسمی برای من واقعا سخت است. من به دنبال همدردی نیستم و احترام زیادی برای هنرمندانی قائل هستم که می توانند در سطح شدید، طولانی و با اکتان بالا از عهده آن برآیند، اما من یکی از آن انسان ها نیستم و هرگز هم نبوده ام، او ادامه داد و اشاره کرد که در تور فعلی آمریکای شمالی خود به همین دلایل، دوره کوتاه تری را انتخاب کرده است. متاسفم اگر احساس می کنید دارم ناامیدتان می کنم. من واقعا هستم. شاید روزی برای آن توری که از من انتظار دارید ساخته شوم، اما در حال حاضر نیستم. او اضافه کرد که امیدوار است هم طرفداران و هم خودش از نمایش ها لذت ببرند و گفت که تمام تلاشم را می کند تا ذهنی سالم و مثبت داشته باشم. این تور از موسیقی، مد، فیلم، هفتمین آلبوم استودیویی چارلی پشتیبانی می‌کند که در ۲۴ ژوئیه به عنوان دنباله‌ای بر آلبوم غالب فرهنگی او در سال ۲۰۲۴ منتشر شد. این آلبوم چرخش شدید دیگری را برای هنرمند"}, {"source": "Billboard", "title": "Icehouse to Celebrate 40 Years of ‘Man of Colours’ With 2027 Australian Tour", "link": "https://www.billboard.com/music/concerts/icehouse-man-of-colors-40th-anniversary-australian-tour-1236339285/", "summary": "Icehouse will mark the 40th anniversary of their landmark album Man of Colours with a 2027 Australian tour that doubles as their first indoor headline run in more than 20 years. Across June and July 2027, the Australian rock band led by Iva Davies will perform the 1987 album in full for the first time — including songs they have never played live — alongside a set of career-spanning hits. We ve never played some of the songs from the album, so this tour is going to include some firsts for us as well as our fans, Davies said. He noted the seated, indoor format marks a shift from the band s recent output: Compared to the big outdoor shows we ve mainly been playing over the past 15 years, indoors means we get to play more songs and create an even bigger show for us all. The six-date run opens at the Newcastle Entertainment Centre on June 5 and travels to Brisbane, Sydney, Melbourne, Adelaide and Perth, wrapping July 10. Fan-club and PayPal presales begin Sept. 16, with general tickets on sale Friday, Sept. 18 at 11 a.m. local time via TEG Live. Special guests are to be announced. Beyond the album, the shows will feature signature tracks including Great Southern Land, Hey Little Girl, We Can Get Together and Love in Motion. Man of Colours , released in September 1987, was the commercial peak of Icehouse s career. The band s fifth studio album, it spent 11 weeks at No. 1 on the Australian albums chart, also topped the New Zealand chart, and has sold more than one million copies. It won ARIA Awards for Album of the Year and Highest Selling Album in 1988. The album also gave Icehouse their biggest U.S. success. Electric Blue — co-written by Davies and John Oates of Hall Oates — became the band s only Australian No. 1 single and reached No. 7 on the Billboard Hot 100, their highest-charting U.S. single, while Crazy climbed to No. 14. Both were also top 10 hits on Billboard s Mainstream Rock chart, and Man of Colours reached No. 43 on the Billboard 200. ICEHOUSE — MAN OF COLOURS 40TH ANNIVERSARY + THE HITS, AUSTRALIA 2027 June 5 — Newcastle — Newcastle Entertainment Centre June 12 — Brisbane — Brisbane Entertainment Centre June 19 — Sydney — TikTok Entertainment Centre June 26 — Melbourne — Margaret Court Arena July 3 — Adelaide — Adelaide Entertainment Centre July 10 — Perth — RAC Arena", "date_str": "2026-09-14T07:14:37+00:00", "hash": "97e0933af31d98db", "title_fa": "خانه یخی برای جشن گرفتن 40 سال \"مرد رنگی\" با تور استرالیا 2027", "summary_fa": "Icehouse چهلمین سالگرد آلبوم برجسته خود Man of Colors را با یک تور استرالیایی در سال 2027 جشن می گیرد که به عنوان اولین برنامه سرپوشیده آنها در بیش از 20 سال گذشته دو برابر می شود. در ژوئن و ژوئیه 2027، گروه راک استرالیایی به رهبری ایوا دیویس آلبوم 1987 را برای اولین بار به طور کامل اجرا می کند - شامل آهنگ هایی که هرگز به صورت زنده پخش نکرده اند - در کنار مجموعه ای از آهنگ های موفق حرفه ای. دیویس گفت: ما هرگز برخی از آهنگ‌های آلبوم را پخش نکرده‌ایم، بنابراین این تور شامل اولین‌ها برای ما و همچنین طرفداران ما می‌شود. او اشاره کرد که فرمت نشسته و داخلی نشان دهنده تغییری نسبت به خروجی اخیر گروه است: در مقایسه با نمایش های بزرگ در فضای باز که عمدتاً در 15 سال گذشته اجرا می کردیم، در داخل خانه به این معنی است که می توانیم آهنگ های بیشتری را اجرا کنیم و نمایشی حتی بزرگتر برای همه ما ایجاد کنیم. دوره شش روزه در مرکز سرگرمی نیوکاسل در تاریخ 5 ژوئن آغاز می شود و به بریزبن، سیدنی، ملبورن، آدلاید و پرث سفر می کند و در 10 ژوئیه به پایان می رسد. پیش فروش کلوپ هواداران و پی پال از 16 سپتامبر آغاز می شود، با فروش بلیت های عمومی جمعه، 18 سپتامبر، ساعت 11 صبح به وقت محلی به وقت محلی Live. میهمانان ویژه اعلام می شود. فراتر از آلبوم، نمایش ها دارای قطعاتی از جمله Great Southern Land، Hey Little Girl، We Can Get Together و Love in Motion خواهند بود. فیلم Man of Colors که در سپتامبر 1987 منتشر شد، اوج تجاری حرفه آیس هاوس بود. پنجمین آلبوم استودیویی گروه، 11 هفته در رتبه اول جدول آلبوم های استرالیا قرار گرفت، همچنین در صدر جدول نیوزلند قرار گرفت و"}, {"source": "Billboard", "title": "The Fray Set 2027 Australia and New Zealand Tour With Dashboard Confessional", "link": "https://www.billboard.com/music/concerts/the-fray-australia-tour-2027-1236339282/", "summary": "The Fray are returning to Australia and New Zealand in February 2027 for the Summer of Light Tour, less than two years after selling out their last run Down Under. The eight-date trek pairs four indoor headline shows with four outdoor dates staged as part of the Lookout Festival series, and will conclude in Auckland for the band s first-ever performance in New Zealand. The indoor run, presented by TEG Live, opens at Melbourne s Margaret Court Arena on Feb. 5 and continues through Wollongong, Sydney s Hordern Pavilion and Auckland s Eventfinda Stadium, with support from Dashboard Confessional and Australian artist Rachael Fahim. The Lookout Festival dates, presented by Face to Face Touring, add British indie-pop act Bastille to the bill alongside Dashboard Confessional and local acts Killing Heidi and Little Birdy, running across Torquay, Perth, Lake Macquarie and Sandstone Point. The tour supports A Light That Waits, the Denver band s first full-length album in more than a decade, released in March. It is also their first as a core trio of singer-guitarist Joe King, guitarist Dave Welsh and drummer Ben Wysocki. We had such an incredible time touring in Australia in 2025. The energy from those crowds was unbelievable, King said. To come back and be able to share A Light That Waits alongside the songs fans have grown up with — and to have our long-time friends Dashboard Confessional with us — is going to make these nights unforgettable. The Fray rose to prominence in the mid-2000s as one of the defining piano-rock acts of their era. Their 2005 debut album How to Save a Life was certified four-times platinum in the U.S. and remains one of the best-selling digital debuts of all time, powered by two enduring singles: Over My Head (Cable Car) and the title track. How to Save a Life became a cultural touchstone through its use on ABC s Grey s Anatomy, reached No. 3 on the Billboard Hot 100, spent a marathon 58 weeks on the chart and has since been certified Diamond by the RIAA. The band s 2009 self-titled follow-up debuted at No. 1 on the Billboard 200, and across their career they have earned four Grammy nominations and three Billboard Music Awards. Tickets go on general sale Thursday, Sept. 17 at 10 a.m. local time, following artist and promoter presales earlier in the week. THE FRAY — AUSTRALIA NEW ZEALAND 2027 Indoor shows (TEG Live) Feb. 5 — Melbourne — Margaret Court Arena Feb. 10 — Wollongong — Waves Feb. 11 — Sydney — Hordern Pavilion Feb. 17 — Auckland —", "date_str": "2026-09-14T04:57:50+00:00", "hash": "b98f161b1fa81bdd", "title_fa": "The Fray Set 2027 تور استرالیا و نیوزلند با داشبورد اعتراف", "summary_fa": "The Fray در فوریه 2027 برای تور تابستان نور به استرالیا و نیوزیلند بازمی‌گردند، کمتر از دو سال پس از فروش آخرین دوره خود Down Under. این هشت قرار راهپیمایی شامل چهار نمایش سرپوشیده با چهار قرار در فضای باز است که به عنوان بخشی از مجموعه جشنواره Lookout روی صحنه می رود، و در اوکلند برای اولین اجرای گروه در نیوزیلند به پایان می رسد. مسابقه داخل سالن که توسط TEG Live ارائه شده است، در ماه فوریه در Margaret Court Arena در ملبورن افتتاح می شود. 5 و با حمایت Dashboard Confessional و هنرمند استرالیایی Rachael Fahim از طریق Wollongong، Hordern Pavilion سیدنی و ورزشگاه Eventfinda در اوکلند ادامه می‌یابد. تاریخ‌های جشنواره Lookout که توسط Face to Face Touring ارائه می‌شود، موسیقی پاپ مستقل بریتانیایی Bastille را در کنار داشبورد Confessional و کنش‌های محلی Killing Heidi و Little Birdy که در سراسر Torquay، Perth، Lake Macquarie و Sandstone Point اجرا می‌شود، به لایحه اضافه می‌کند. این تور از A Light That Waits، اولین آلبوم کامل گروه دنور در بیش از یک دهه گذشته، که در ماه مارس منتشر شد، پشتیبانی می کند. همچنین اولین آنها به عنوان سه نفر اصلی از خواننده-گیتاریست جو کینگ، گیتاریست دیو ولش و درامر بن ویسوکی است. کینگ گفت: ما در سال 2025 در استرالیا زمان فوق‌العاده‌ای را در تور استرالیا سپری کردیم. انرژی این جمعیت باور نکردنی بود. بازگشتن و به اشتراک گذاشتن نوری که منتظر است در کنار آهنگ‌هایی که طرفداران با آن‌ها بزرگ شده‌اند را به اشتراک بگذارید - و داشتن دوستان دیرینه Dashboard Confessional با ما - این شب‌ها را فراموش‌نشدنی خواهد کرد. فری در اواسط دهه 2000 به عنوان یکی از بازیگران راک پیانو در دوران خود به شهرت رسید. اولین آلبوم آنها در سال 2005 چگونه یک زندگی را نجات دهیم چهار برابر گواهی پلاتین در ایالات"}, {"source": "Deadline", "title": "‘Happy Death Day’s Jessica Rothe Says She & Christopher Landon “Broke The Third Movie,” Waiting For Universal, Blumhouse To Fund", "link": "https://deadline.com/2026/09/happy-death-day-jessica-rothe-chris-landon-broke-third-movie-1237101692/", "summary": "As Jessica Rothe grows in her scream queen cinematic career, the Happy Death Day star is ready to return to her horror roots. While discussing her new Joshua Giuliano slasher River at Deadline s TIFF Studio, the actress revealed she and Happy Death Day franchise writer/director Christopher Landon broke the third movie and just need funding. [ ]", "date_str": "2026-09-14T14:29:31+00:00", "hash": "d2df5c6986a93cdb", "title_fa": "جسیکا راث از «روز مرگ مبارک» می‌گوید او و کریستوفر لاندون «فیلم سوم را شکستند»، در انتظار سرمایه‌گذاری یونیورسال و بلومهاوس", "summary_fa": "با رشد جسیکا روث در حرفه سینمایی ملکه جیغ خود، ستاره روز مرگ مبارک آماده بازگشت به ریشه های ترسناک خود است. در حالی که در استودیوی TIFF ددلاین درباره رودخانه اسلشر جدیدش جاشوا جولیانو صحبت می‌کرد، این بازیگر فاش کرد که او و کریستوفر لاندون، نویسنده/کارگردان فرنچایز روز مرگ مبارک، فیلم سوم را شکستند و فقط به بودجه نیاز دارند. او گفت، بنابراین، من و کریس لاندون در واقع کل داستان را شکستیم، که واقعا سرگرم کننده بود. ما به یک مکان نامعلوم Le Pain Quotidien در بین خانه هایمان رفتیم و ساعت ها آنجا نشستیم و فیلم سوم را شکستیم. و اکنون، ما فقط منتظر یونیورسال و بلومهاوس هستیم که فقط کمی پول به ما بدهند. این انحصاری Deadline است. اول اینجا شنیدی در روز مرگ مبارک (2017)، نوشته اسکات لوبدل و کارگردانی لاندون، دانشجوی خودمحور تری گلبمن (روث) در روز تولدش به قتل می رسد، اما دوباره در ابتدای روز از خواب بیدار می شود. همانطور که کابوس مدام تکرار می شود، او باید هویت قاتل خود را کشف کند تا این چرخه را متوقف کند. در Deadline دنباله 2019 Happy Death Day 2U به نویسندگی و کارگردانی لندون، عنصر علمی تخیلی را بسط می دهد زیرا او خود را در یک جهان موازی در نتیجه آزمایش های دوستش در سفر در زمان می یابد. جسیکا روث به روز رسانی در روز مرگ مبارک 3 | استودیو ددلاین در #TIFF2026 pic.twitter.com/cb2zf4R3rC"}, {"source": "Deadline", "title": "Jon Cohen Named President Of Lipovsky & Stein’s Wonderlab Banner", "link": "https://deadline.com/2026/09/lipovsky-stein-name-jon-cohen-president-wonderlab-1237099558/", "summary": "Jon Cohen has joined Wonderlab, the newly launched production company of Final Destination: Bloodlines helmers Zach Lipovsky and Adam Stein, as President. Cohen comes over from J.J. Abrams Bad Robot, where he most recently served as Head of Film. We are so incredibly excited to launch Wonderlab with Jon, Lipovsky and Stein said. During his time at [ ]", "date_str": "2026-09-14T14:00:00+00:00", "hash": "4c9c2ea04bae3389", "title_fa": "جان کوهن به عنوان رئیس بنر لیپوفسکی و استاین واندرلب انتخاب شد", "summary_fa": "جان کوهن به عنوان رئیس، به Wonderlab، شرکت تولیدی تازه راه‌اندازی Final Destination: Bloodlines helmers Zach Lipovsky و Adam Stein پیوست. کوهن از جی.جی. آبرامز بد ربات، جایی که او اخیراً به عنوان رئیس فیلم مشغول به کار بود. لیپوفسکی و استین گفتند که ما بسیار هیجان زده هستیم که Wonderlab را با جان، راه اندازی کنیم. در دوران حضورش در [ ]"}, {"source": "Deadline", "title": "Former Tubi Production Chief Ashla Soter Joins Post House Digital Sword", "link": "https://deadline.com/2026/09/digital-swords-hires-tubi-exec-ashla-soter-1237099939/", "summary": "EXCLUSIVE: Post house Digital Sword has hired former Tubi production exec Ashla Soter. A month after exiting the streamer, she s been named Executive Producer and SVP of Production at Digital Sword, where she will assume oversight of production across the company s full slate, working with studios, brands, and agencies alongside Digital Sword s global editorial, color, [ ]", "date_str": "2026-09-14T14:00:00+00:00", "hash": "0ad22c329220977f", "title_fa": "اشلا سوتر، رئیس سابق تولید توبی، به شمشیر دیجیتالی پست هاوس پیوست", "summary_fa": "انحصاری: شمشیر دیجیتال خانه پست، مدیر سابق تولید Tubi، اشلا سوتر را استخدام کرده است. یک ماه پس از خروج از استریمر، او به عنوان تهیه کننده اجرایی و معاون تولید در Digital Sword انتخاب شد، جایی که او نظارت بر تولید را در کل شرکت به عهده خواهد گرفت و با استودیوها، مارک ها و آژانس ها در کنار سرمقاله جهانی Digital Sword، رنگ، [ ]"}, {"source": "Deadline", "title": "‘Sunday In The Park With George’ Revival Delayed After Ariana Grande & Jonathan Bailey Exit", "link": "https://deadline.com/2026/09/sunday-in-the-park-delayed-ariana-grande-jonathan-bailey-1237101671/", "summary": "The West End revival of Stephen Sondheim and James Lapine s Sunday in the Park with George has now been delayed following the exits of Ariana Grande and Jonathan Bailey. Producer Empire Street Productions posted on Instagram that the planned 2027 release will no longer proceed as scheduled. It said the company retain the rights with [ ]", "date_str": "2026-09-14T13:54:52+00:00", "hash": "5bb5a6be0c26d0f0", "title_fa": "احیای «یکشنبه در پارک با جورج» پس از خروج آریانا گرانده و جاناتان بیلی به تعویق افتاد", "summary_fa": "احیای یکشنبه استفان ساندهیم و جیمز لاپین در وست اند در پارک با جورج اکنون به دلیل خروج آریانا گرانده و جاناتان بیلی به تعویق افتاده است. تهیه کننده امپایر استریت پروداکشنز در اینستاگرام منتشر کرد که برنامه ریزی شده برای انتشار در سال 2027 دیگر طبق برنامه پیش نمی رود. گفت که این شرکت حقوق خود را برای ارائه محصول در سال 2028 حفظ می کند. این تصمیم نشان دهنده یک چرخش است پس از اینکه تولیدکنندگان در ابتدا گفته بودند نمایش پس از خروج گرانده ادامه خواهد داشت. با این حال، ددلاین چند هفته بعد فاش کرد که بیلی، ستاره بریجرتون نیز در حال انصراف است. در آن زمان او گفت که حمایتش از گرانده تزلزل ناپذیر است. یکشنبه گرانده در خروجی پارک در پایان تور او در عرصه حضور داشت و توسط نمایندگان او به عنوان یک وقفه بسیار شایسته از کارها و حضورهای عمومی که منجر به بررسی مداوم و بی پایان عمومی شده است، توضیح داده شد. Watch on Deadline Deadline خبر تجدید حیات یکشنبه در پارک لندن را در پایان سال گذشته منتشر کرد. موزیکال برادوی برنده پولیتزر در سال 1984 از نقاشی هنرمند فرانسوی ژرژ سورات الهام گرفته شده است. داستان حول محور جورج، نسخه ای تخیلی از سورات، که عمیقاً در نقاشی شاهکارش غوطه ور است، و نوه اش، هنرمند معاصر متضاد و بدبین، می چرخد."}, {"source": "Deadline", "title": "Andrew Scott To Star In Film Version Of Simon Stephens Stage Play ‘Sea Wall’", "link": "https://deadline.com/2026/09/andrew-scott-sea-wall-1237072906/", "summary": "Andrew Scott will star in a new feature film version of Simon Stephens Sea Wall, a play that the actor originally performed in 2008 at the Bush Theatre in London and that was later staged on Broadway in 2019 with Tom Sturridge in the sole role. The film, though, won t be a traditional stage-to-screen adaptation: [ ]", "date_str": "2026-09-14T13:30:00+00:00", "hash": "2251c5e2b2428169", "title_fa": "اندرو اسکات برای بازی در نسخه سینمایی سایمون استفنز استیج نمایش «دیوار دریا»", "summary_fa": "اندرو اسکات در نسخه سینمایی جدید سیمون استفنز سی وال بازی خواهد کرد، نمایشی که این بازیگر ابتدا در سال 2008 در تئاتر بوش لندن اجرا کرد و بعداً در برادوی در سال 2019 با نقش انفرادی تام استوریج به روی صحنه رفت. با این حال، این فیلم یک اقتباس سنتی از صحنه به صفحه نمایش نخواهد بود: در چیزی که تهیه‌کنندگان آن را رویکردی منحصربه‌فرد می‌خوانند، Sea Wall اساساً به عنوان فیلمی درباره ایجاد تئاتر دوباره در نظر گرفته می‌شود. اسکات این بازی انفرادی را در استودیوی آف برادوی سی ویو در اکتبر اجرا خواهد کرد و این فیلم شامل اجراهای او و همچنین تصاویری از پشت صحنه و در خانه خواهد بود و تماشاگران در هر اجرا به عنوان یک شخصیت اصلی در این فیلم حضور خواهند داشت. این فیلم در طول 19 اجرا در استودیو Seaview از جمعه، 16 اکتبر، تا جمعه، 30 اکتبر ضبط خواهد شد. برنده جایزه Peabody، تینا ساتر (Broadways Is This A Room؟، TVs Reality) کارگردانی خواهد کرد. Watch on Deadline Sea Wall، پس از اولین نمایشش در بریتانیا در سال 2008، در سال 2019 در تئاتر عمومی در برادوی ایالات متحده در یک فیلم دوبل با نمایشنامه تک‌پرده دیگری به نام «یک زندگی نیک پین» با بازی جیک جیلنهال ارائه شد. این دو نمایش سپس به تئاتر هادسون برادوی منتقل شدند. فیلم جدید در واقع دومین باری است که Sea Wall با اسکات ضبط می شود: در سال 2012، یک فیلم کوتاه 30 دقیقه ای اقتباسی از نمایش صحنه به کارگردانی نمایشنامه نویس همراه با تهیه کننده اندرو پورتر ساخته شد. ظاهراً نسخه آینده این دیدگاه را از طریق جنبه‌های پشت صحنه و مخاطب گسترش خواهد داد. این نمایشنامه خود یک مونولوگ است که در آن یک مرد جوان بریتانیایی به نام الکس داستانی دلخراش از یک حادثه ویرانگر را بازگو می"}, {"source": "Deadline", "title": "Well Go USA Entertainment Acquires ‘The Optimist’ For Digital Release On November 17", "link": "https://deadline.com/2026/09/well-go-usa-entertainment-acquires-optimist-1237101652/", "summary": "EXCLUSIVE: Well Go USA Entertainment has acquired Holocaust survivor drama The Optimist, for a digital release on November 17, followed by a Blu-ray and DVD launch on December 18. The digital push follows the film s wide U.S. theatrical release by Trafalgar Releasing in March. Written and directed by Finn Taylor, and developed and produced by [ ]", "date_str": "2026-09-14T13:29:55+00:00", "hash": "b66d8d2073287c9f", "title_fa": "Well Go USA Entertainment \"The Optimist\" را برای عرضه دیجیتال در 17 نوامبر خریداری کرد", "summary_fa": "انحصاری: Well Go USA Entertainment درام بازمانده هولوکاست The Optimist را برای اکران دیجیتالی در 17 نوامبر خریداری کرد و به دنبال آن بلوری و دی وی دی در 18 دسامبر عرضه شد. این فشار دیجیتال پس از اکران گسترده فیلم در ایالات متحده توسط Trafalgar Releasing در ماه مارس انجام می شود. فیلم The Optimist به نویسندگی و کارگردانی فین تیلور و توسعه و تهیه کنندگی جینین توماس، استیون لانگ (آواتار: آتش و خاکستر) در نقش هربرت هلر، بازمانده هولوکاست، بازی می‌کند. داستان بین نسلی شفا و تاب آوری الهام گرفته شده از شخصیت واقعی هلر است که پس از زنده ماندن از اردوگاه های کار اجباری ترز n و آشویتس و فرار از راهپیمایی مرگ در سال 1945 در نوجوانی به ساختن یک زندگی آرام در سانفرانسیسکو در بزرگسالی پرداخت. در آخرین مهلت تماشا کنید داستان‌های مرتبط اخبار هیجان‌انگیز Dove Cameron RJ Mitte کاسی فروش خود را در بازار TIFF آغاز می‌کند. فیشر)، یک نوجوان پریشان که با مبارزات خودش دست و پنجه نرم می کند. هربرت از طریق آسیب پذیری مشترک آنها، شهامت این را پیدا می کند که داستان خود را به طور عمومی به اشتراک بگذارد، و راهی به سمت شفا برای هر دوی آنها ایجاد کند. این فیلم بین زمان حال و گذشته به عقب و جلو می رود و با دوران کودکی هلر در یک خانواده یهودی سکولا y Thomas Tributes: Figures From Across The Industry Remember Legendary UK Producer Of ‘The Last Emperor’ & ‘Crash’", "link": "https://deadline.com/2026/09/jeremy-thomas-tributes-producer-the-last-emperor-crash-1237101548/", "summary": "Tributes from across the industry have been rolling in this weekend following the death of veteran producer Jeremy Thomas. He died on September 11. He was 77 years old. His family announced his death in a statement on Saturday, September 12. “Jeremy Thomas, the celebrated British producer of The Last Emperor and of over 40 [ ]", "date_str": "2026-09-14T11:08:01+00:00", "hash": "bfde1029845eadd9", "title_fa": "ادای احترام جرمی توماس: چهره هایی از سراسر صنعت تهیه کننده افسانه ای بریتانیایی «آخرین امپراطور» و «سقوط» را به یاد می آورند", "summary_fa": "پس از مرگ جرمی توماس، تهیه‌کننده کهنه‌کار، ادای احترام از سراسر صنعت در این آخر هفته برگزار شد. او در 11 سپتامبر درگذشت. او 77 سال داشت. خانواده او در بیانیه ای در روز شنبه، 12 سپتامبر درگذشت او را اعلام کردند. جرمی توماس، تهیه کننده مشهور بریتانیایی آخرین امپراتور و بیش از 40 فیلم دیگر، در سن 77 سالگی درگذشت. توماس در اواخر روز جمعه یازدهم در خانه روستایی خود در آکسفوردشایر در حالی که در محاصره خانواده و عزیزانش بود، با آرامش درگذشت. داستان‌های مرتبط جشنواره‌ها می التوخی در ونیز شیر طلایی برنده شد ریکاردو اسکامارسیو جرمی توماس را به یاد می‌آورد -- برندگان کنفرانس مطبوعاتی اخبار درگذشت جرمی توماس: تهیه‌کننده افسانه‌ای بریتانیایی The Last Emperor Crash 77 ساله بود، تام برنارد، رئیس Sony Pictures Classics، دستاوردهای توماس را به‌عنوان یک بیانیه فوق‌العاده توصیف کرد. برنارد گفت: یکی از تاسف‌های بزرگ من این است که او هرگز توسط یکی از جشنواره‌های بزرگ به‌خاطر سهم فوق‌العاده‌اش در صنعت ما مورد تقدیر قرار نگرفت. من همیشه به یاد می‌آورم که با او در اسکار بودم، وقتی او جایزه بهترین فیلم را برد، او کاملاً هیجان‌زده بود. او یک دوست عالی برای Sony Pictures Classics بود، اما مهمتر از همه، او یک دوست عالی برای من بود. به شدت دلتنگش خواهم شد بفتا روز دوشنبه بیانیه رسمی را به اشتراک گذاشت. در یادداشت آمده kte in het verleden zo geobsedeerd door de zaak dat zijn huwelijk en gezin eraan kapotgingen. De ontvoering dwingt Tom en Pete dus om samen te werken. Terwijl rechercheur Amanda Beck (Michelle Monaghan) het officiële onderzoek leidt, proberen zij te begrijpen waarom Jake het nieuwe doelwit is geworden en welke verbinding er bestaat met de oude moorden. Daarbij komen steeds meer geheimen uit Petes oorspronkelijke onderzoek naar boven. Bijna 60 miljoen kijkers The Whisper Man staat dus wéér op nummer één in de top 10 met meest bekeken films. Wereldwijd gezien werd de film al 23,2 miljoen (week één) plus 33,4 miljoen (week twee) bekeken. Een totaalaantal van 56,6 miljoen kijkers dus! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Onheilspellende film knokt zich terug naar plek 1 op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-14T11:19:42+00:00", "hash": "9248c89b92f2718c", "title_fa": "فیلم شوم به رتبه 1 در نتفلیکس باز می گردد", "summary_fa": "گاهی اوقات یک فیلم یا سریال به رتبه اول در 10 نتفلیکس برتر می رسد، اما پس از آن کیک از بین می رود و عنوان مورد نظر باید جای خود را رها کند. با این حال، مرد Whisper غیرممکن را انجام می دهد: برای بازگشت به شماره یک مبارزه کند! The Whisper Man again on one Let's a step back: The Whisper Man بر اساس کتابی به همین نام اثر الکس نورث ساخته شده است. در این فیلم، آدام اسکات نقش تام کندی، نویسنده جنایی و بیوه را بازی می کند. او با پسر هشت ساله‌اش جیک تلاش می‌کند زندگی‌اش را به مسیر اصلی بازگرداند، اما بدترین کابوس او اتفاق می‌افتد: جیک ربوده می‌شود. به زودی معلوم می شود که این ناپدید شدن شباهت هایی با مجموعه بدنام کودک کشی سال ها پیش دارد. آن قتل های قدیمی توسط یک قاتل زنجیره ای معروف به مرد نجوا انجام شد. او نام مستعار خود را به دلیل نحوه ارتباط وحشتناکی که با کودکان داشت دریافت کرد. نکته عجیب این است که مرد Whisper Man اصلی، فرانک کارتر، سال ها پشت میله های زندان بوده است. با این حال، همان ویژگی ها در آدم ربایی جیک دوباره ظاهر می شوند. ب erbonden lijkt te zijn met oude Praagse mythologie. Zoals je van Dan Brown gewend bent, moet Langdon vervolgens allerlei aanwijzingen en symbolen ontcijferen. Praag (met zijn oude kerkjes en dergelijke) speelt daarbij een heel grote rol, maar later verplaatst het verhaal zich ook naar Londen en New York. Dan Brown Inmiddels heeft Netflix bekendgemaakt dat Morgan Spector (wat de aankomende serie betreft) in de huid van Langdon kruipt. Rebecca Hall is Katherine en verder bestaat de cast uit Cherry Jones als Heide Nagel, Corey Stoll als Everett Finch, Rob Delaney als Jonas Faukman en Abbey Lee als Sasha Vesna. Ook Mamadou Athie, Ben Levi Ross, Anamaria Marinca, Richard Sammel en Elena Saurel spelen rollen in The Secret of Secret. Kunnen we je verder nog iets vertellen over het project? Carlton Cuse moet het verhaal omturnen tot een serie, die in totaal acht afleveringen krijgt. Een releasedatum hebben we nog niet. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Nieuwe Dan Brown-serie op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-13T18:43:02+00:00", "hash": "1e84defa62c86669", "title_fa": "سریال جدید دن براون در نتفلیکس", "summary_fa": "راز اسرار کتابی از دن براون است، اما آن کتاب به زودی به سریالی در نتفلیکس تبدیل خواهد شد. آن سریال هنوز نام رسمی ندارد، اما در واقع چه مشکلی با The Secret of Secrets دارد؟ نتفلیکس درهای خود را باز می کند راز اسرار اثر دن براون به زبان هلندی با عنوان راز نهایی منتشر شده است. این ششمین کتاب درباره رابرت لنگدون، استاد سمبولیسم از جمله رمز داوینچی، دوزخ و راز برنینی است. لنگدون برای شرکت در سخنرانی مهم کاترین سولومون، دانشمندی که ما از نماد گمشده می شناسیم، به پراگ می رود. کاترین و لنگدون اکنون در یک رابطه عاشقانه هستند. کاترین تحقیقاتی را در زمینه علم نوتیک انجام می دهد، جایی که او تلاش می کند تا به طور علمی سؤالات بزرگ در مورد آگاهی انسان را بررسی کند. او همچنین در شرف انتشار کتابی با اکتشافاتی است که معتقد است می‌تواند ایده‌های اساسی در مورد ذهن انسان را وارونه کند. نسخه خطی گم شده است سپس همه چیز کاملاً اشتباه است. یک قتل وحشیانه انجام می شود، کاترین ناپدید می شود و دست نوشته او نیز ناپدید می شود. لنگدون سعی می کند بفهمد چه اتفاقی برای او افتاده است، اما به زودی متوجه می شود که به نظر می رسد یک سازمان قدرتمند هر کاری می کند تا اطلاعات خاصی را مخفی نگه دارد. در همان زمان، او توسط یک حریف وحشتناک که به نظر می رسد با اساطیر پراگ باستان مرتبط است، تعقیب می شود. همانطور که از دن براون انتظار دارید، لنگدون باید انواع سرنخ ها و نمادها را رمزگشایی کند. پراگ (با کلیساهای قدیمی و امثال آن) نقش بسیار مهمی دارد، اما بعدها داستان به لندن و نیویورک نیز می رود. دن براون نتفلیکس اکنون اعلام کرده است که مورگان اسپکتور (تا جایی که به سریال آینده مربوط می شود) نقش"}, {"source": "Netflix NL", "title": "Netflix-kijkers krijgen geen genoeg van nieuwe Nederlandse serie", "link": "https://www.netflix-nederland.nl/netflix-kijkers-krijgen-geen-genoeg-van-nieuwe-nederlandse-serie/", "summary": "Wederom is een Nederlandse serie erin geslaagd om Netflix helemaal over te nemen. Ditmaal een verhaal dat velen toch al zullen kennen. Als het niet het boek is geweest dat je hebt gelezen, dan is het wel de film van een decennium geleden. Maar de nieuwe verfilming is een instant succes. Want de kijkers zijn lyrisch én de reeks staat ook eerste in de Netflix Top-10. Psychologische thriller We hebben het uiteraard over De Eetclub, een Nederlandse psychologische thrillerserie, gebaseerd op de welbekende bestseller van Saskia Noort. Het verhaal draait om Karen, die met haar gezin verhuist naar het welvarende Bergen. Ze heeft moeite om haar plek te vinden, totdat ze wordt opgenomen in een hechte vriendengroep die zichzelf De Eetclub noemt. De leden leiden op het eerste gezicht een zorgeloos bestaan: luxe huizen, etentjes, feestjes, nou, je kent het wel. Nu al mega succes Achter die perfecte buitenkant blijkt echter van alles mis te zijn. Wanneer de villa van een van de stellen in brand vliegt en Evert om het leven komt, verandert de sfeer binnen de groep natuurlijk volledig. Karen krijgt steeds meer het gevoel dat zijn dood geen eenvoudig ongeluk was. Terwijl ze probeert te achterhalen wat er werkelijk is gebeurd, ontdekt ze dat haar nieuwe vrienden geheimen voor elkaar hebben en dat relaties binnen de groep veel ingewikkelder zijn dan ze aanvankelijk dacht. Hoe meer Karen ontdekt, hoe moeilijker het wordt om te bepalen wie ze nog kan vertrouwen Niet onopgemerkt Loes Haverkort, Remko Vrijdag, Noortje Herlaar, Edwin Jonker, Rifka Lodeizen, Matthijs van de Sande Bakhuyzen, Charlie-Chan Dagelet en Teun Luijkx spelen de hoofdrollen in De Eetclub, dat nu dus op Netflix staat. En dat is niet onopgemerkt voorbijgegaan, want de serie staat gelijk eerste in de Netflix-lijsten! Opnieuw een Nederlandse hit voor de streamingdienst. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Netflix-kijkers krijgen geen genoeg van nieuwe Nederlandse serie appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-13T16:29:59+00:00", "hash": "aea9dbbd48f078e2", "title_fa": "تماشاگران نتفلیکس از سریال جدید هلندی سیر نمی شوند", "summary_fa": "یک بار دیگر یک سریال هلندی توانسته است نتفلیکس را به طور کامل تصاحب کند. این بار داستانی که خیلی ها از قبل می دانند. اگر کتابی که خواندید نبود، فیلم یک دهه پیش بود. اما اقتباس فیلم جدید یک موفقیت فوری است. چون بیننده ها غنایی هستند و سریال هم در 10 تاپ برتر نتفلیکس اول است. تریلر روانشناختی البته در مورد De Eetclub، یک سریال هیجان انگیز روانشناختی هلندی صحبت می کنیم که بر اساس پرفروش ترین اثر ساسکیا نورت ساخته شده است. داستان حول محور کارن می چرخد ​​که با خانواده اش به برگن مرفه نقل مکان می کند. او تلاش می کند تا جای خود را پیدا کند تا اینکه در یک گروه نزدیک از دوستان که خود را The Eating Club می نامند پذیرفته می شود. در نگاه اول، اعضا زندگی بی دغدغه ای را پیش می برند: خانه های مجلل، شام، مهمانی ها، خوب، شما تمرین را می دانید. در حال حاضر یک موفقیت بزرگ. با این حال، در پشت آن نمای بیرونی عالی، همه چیز اشتباه به نظر می رسد. زمانی که ویلای یکی از زوج ها آتش می گیرد و اورت می میرد، طبیعتا فضای درون گروه به کلی تغییر می کند. کارن به طور فزاینده ای احساس می کند که مرگ او یک تصادف ساده نبوده است. همانطور که او سعی می کند بفهمد واقعا چه اتفاقی افتاده است، متوجه می شود که دوستان جدیدش رازهای یکدیگر را پنهان می کنند و روابط درون گروه بسیار پیچیده تر از آن چیزی است که او در ابتدا فکر می کرد. هرچه کارن بیشتر کشف کند، تشخیص اینکه به چه کسی می تواند اعتماد کند دشوارتر می شود. بی توجه نیست. Loes Haverkort، Remko Vrijdag، Noortje Herlaar، Edwin Jonker، Rifka Lodeizen، Matthijs van de Sande Bakhuyzen، Charlie-Chan Dagelet و Teun Luijkx نقش‌های اصلی"}, {"source": "Pitchfork", "title": "Jeff Tweedy, Robert Glasper, Weyes Blood to Play Big Ears 2027", "link": "https://pitchfork.com/story/jeff-tweedy-robert-glasper-weyes-blood-to-play-big-ears-2027/", "summary": "Oneohtrix Point Never, Thundercat, Wednesday, Courtney Barnett, SML, Dinner Party, Sylvan Esso, and more will also perform at the Knoxville festival", "date_str": "2026-09-14T14:05:59+00:00", "hash": "d373f6cfc14c8d44", "title_fa": "جف تویدی، رابرت گلاسپر، ویز بلاد برای بازی گوش بزرگ 2027", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Big Ears قرار است مرکز شهر ناکسویل، تنسی را برای نسخه 2027 خود، که از 1 تا 4 آوریل برگزار می شود، تصاحب کند. جف تویدی، رابرت گلاسپر، ویز بلاد، Oneohtrix Point Never، بیل فریزل، و مهمانی شام - سوپرگروه گلاسپر، تراس مارتین، کاماسی واشنگتن، و 9th Wonder - در صدر فهرست جشنواره موسیقی، هنر و فیلم قرار دارند. همچنین تاندرکت، چهارشنبه، ناتالی مرچنت، ماویس استیپلز، کورتنی بارنت، سیلوان اسو، جیم جیمز، و کوین موربی و دیگران در این فهرست قرار دارند. در مجموع، این جشنواره بیش از 250 اجرا را در 22 سالن اجرا می کند. نسخه 2027 Big Ears همچنین اجراهایی از نورا جونز، Mount Eerie، L'Rain، Brad Mehldau، Mouse on Mars، Tyondai Braxton، Gillian Welch و David Rawlings از ایالات متحده خواهد داشت. دختران، عروسک‌های گوشتی، نیروستا استیل، یاسواکی شیمیزو، اندی استات، میدوری تاکادا، کال  بودند."}, {"source": "Pitchfork", "title": "Chief Keef Postpones First Chicago Show in Over a Decade", "link": "https://pitchfork.com/story/chief-keef-postpones-first-chicago-show-in-over-a-decade/", "summary": "Keef credited his travel woes to a “pilot who got very racist”", "date_str": "2026-09-13T22:20:29+00:00", "hash": "7d03ac93ab22a152", "title_fa": "Chief Keef اولین نمایش شیکاگو در بیش از یک دهه گذشته را به تعویق انداخت", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Chief Keef کنسرت شهر خود در شیکاگو را به تعویق انداخته است که قرار بود اولین کنسرت او در این شهر در 14 سال گذشته باشد. (اگرچه او امسال و در سال 2024 عنوان لیریکال لیموناد را عنوان کرد، که از نظر فنی در بریج ویو، ایلینوی بود.) این نمایش که قرار بود در 12 سپتامبر در پاویون بانک هانتینگتون برگزار شود، اکنون در 23 سپتامبر برگزار می شود. این مکان تقریباً نیم ساعت قبل از شروع آن تصمیم را از طریق رسانه های اجتماعی اعلام کرد. این تاریخ بخشی از تور Keef در پشت میکس جدید Skeletor است. بر اساس بیانیه ای از Live Nation، نمایش به دلیل تاخیر در سفر در انتهای کیف به تعویق افتاد، که او را از رسیدن به موقع برای اجرای یک نمایش کامل قبل از ممنوعیت تردد در غرفه باز داشت. در یک استوری اینستاگرام، کیف مشکلات سفر خود را به دلیل \"خلبانی که بسیار نژادپرستانه شد\" دانست و ظاهراً پرواز خود را لغو کرد و باعث شد رپر شیکاگو برای حمل و نقل تلاش کند. یکی از نمایندگان Chief Keef هیچ نظری در مورد تعویق نداشت. کیف در پست خود نوشت: \"نه خوشحال نیستم، بله ناراحت هستم.\" \"می دانم که همه شما مانند من این را پیش بینی می کردید... و من صمیمانه متاسفم که این اتفاق افتاد به من اعتماد کنید. تور کیف امشب در مینیاپولیس ادامه می یابد و در ماه های آینده در دیترویت، آستین، نیویورک، لس آنجلس و موارد دیگر توقف می کند. کیف از زمان کنار گذاشتن Skeletor در آوریل، همکاری یکباره کیتی پری را با نام «عشاق افسانه‌ای (من را نجات بده)» به اشتراک گذاشته است."}, {"source": "Pitchfork", "title": "The Raincoats, X-Ray Spex, and the Slits Members Form Supergroup", "link": "https://pitchfork.com/story/the-raincoats-x-ray-spex-and-the-slits-members-form-supergroup/", "summary": "Gina Birch, Hollie Cook, Lora Logic, and Paul Dean will perform together at a London punk festival next month", "date_str": "2026-09-13T17:07:29+00:00", "hash": "31424519d115c3cc", "title_fa": "اعضای Raincoats، X-Ray Spex و Slits سوپرگروه را تشکیل می دهند", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان اعضای گروه های پانک Seminal Raincoats، The Slits و X-Ray Spex ماه آینده به عنوان یک سوپرگروه در جشنواره لندن اجرا خواهند کرد. \"خداوند ملکه ها را نجات دهد\" که توسط Up Yours سازماندهی شده است! جمعی، پنجاهمین سالگرد پانک فمینیستی را جشن می گیرد و پیش از افتتاح نمایشگاه جدیدی در مورد جنبش در موزه فرهنگ جوانان در کامدن برگزار می شود. جینا برچ از The Raincoats و Hollie Cook از Slits تنها برای یک شب در 16 اکتبر در Electric Brixton با X-Ray Spek's Lora Logic و Paul Dean بازی خواهند کرد. مورخ پانک، ویوین گلدمن، نویسنده کتاب انتقام شی پانک‌ها، نیز در کنار آکیکو ماتسوورا، رودا داکار، هات وکس و سلست بل، دختر پلی استایرن، بازیگر پیشرو ایکس ری اسپکس، در جشنواره حضور خواهند داشت. بسیاری از اجراکنندگانی که در این لایحه حضور دارند نیز با مواد آرشیوی، آثار هنری و موارد دیگر به این نمایشگاه کمک کرده‌اند. گلدمن در بیانیه‌ای گفت: «زمانی که من Revenge of the She-Panks را نوشتم، درباره ترسیم تبار جهانی زنانی بود که از موسیقی برای از بین بردن کلیشه‌ها و ادعای فضای خود استفاده می‌کردند. این جشنواره و شب باورنکردنی که در الکتریک بریکستون برگزار می کنیم، همان کتابی است که روی صحنه زنده می شود. این ادامه حیاتی و زنده فرهنگ شورشی است و ثابت می کند که روایت زنانه در پانک یک تفکر بعدی نیست. این یک نیروی محرک و در حال تکامل است.» منطق اضافه کرد: \"شرکت آثار هنری دیده نشده قبلی در نمایشگاه و همچنین پا گذاشتن روی صحنه برای پخش دوباره این آهنگ های نمادین مانند تکمیل یک دایره کامل است و فوق العاده خاص است. برای من، بیان خلاقانه جنبش همیشه چند بعدی بود. این یک هنر تجسمی، لباس و سر و"}, {"source": "Pitchfork", "title": "Listen to Jeff Tweedy Cover Twisted Teens’ “Wild Connection”", "link": "https://pitchfork.com/story/jeff-tweedy-twisted-teens-cover/", "summary": "The Wilco frontman shared the cover of the Blame the Clown track to his Substack", "date_str": "2026-09-13T15:07:16+00:00", "hash": "8e900a7273e54192", "title_fa": "گوش دادن به جلد Twisted Teens \"Wild Connection\" جف تویدی", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان Jeff Tweedy اکنون عضوی با کارت در باشگاه هواداران Twisted Teens است. در 11 سپتامبر، خواننده ویلکو کاور آهنگ دو نفره نیواورلئان \"Wild Connection\" را به اشتراک گذاشت که در آلبوم فوریه آنها به نام Blame the Clown ظاهر می شود. آن را در Substack او گوش دهید. توییدی در یک مقاله کوتاه در مورد جلد، صدای کاسپین هالیول، رهبر گروه را تکمیل کرد و خاطرنشان کرد که او \"مشکل داشت که سعی کند مانند او آواز نخواند.\" او می‌نویسد: «یکی از دلایلی که من آهنگ‌های کاور زیادی می‌کنم این است که فکر می‌کنم شنیدن چیزی که دوست دارید و سپس ببینید چه حسی دارد، تقریباً شبیه لباس‌ها، خوب است. در این مورد، فکر می‌کنم هنوز شبیه خودم هستم. من در واقع به نوعی احساس می‌کنم که شاید شبیه یک نسخه جوان‌تر از خودم به نظر برسم.» تویدی قبلاً کاورهایی را در Substack خود به اشتراک گذاشته است: در ماه فوریه، او اجرای آهنگ کامرون وینتر \"Love Takes Miles\" را به عنوان هدیه روز ولنتاین به همسرش منتشر کرد. در اوایل سال جاری، او یک تور تیتراژ را در حمایت از آلبومش به نام Twilight Override به پایان رساند، جدول کلمات متقاطع نیویورک تایمز نوشت و دو بار در کیمل اجرا کرد. Twisted Teens در حال آماده شدن برای انتشار سومین آلبوم خود در سال 2026، The Holy Cross Tigers، در 6 نوامبر هستند. این رکورد پس از LP جولای آنها فلوریدا واتر بلوز است و اولین حضور گروه را در برچسب جدیدشان Sub Pop نشان می دهد. درباره Blame the Clown در بهترین موسیقی 2026 تاکنون بخوانید."}, {"source": "Rolling Stone", "title": "Kai Cenat’s Runway Show Felt Like 2016 New York in the Best Way", "link": "https://www.rollingstone.com/culture/culture-features/kai-cenat-runway-show-vivet-review-1235625918/", "summary": "With Vivet’s runway debut, the Twitch star brought his world to fash
