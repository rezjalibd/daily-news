ebuting her new bob which boyfriend Ricky Alvarez was head over heels for on Instagram in October. Now, she s gearing up to return to The Tonight Show Starring Jimmy Fallon alongside two other Focker-in-Law stars, Robert De Niro and Ben Stiller, the O.G. leads of the Meet the Parents franchise. As announced Monday, their joint guest appearance on the late night program will air at 11:35 p.m. ET on Sunday (Nov. 8) on NBC. The love fest also continues in a new The Hollywood Reporter interview with Gisondo, who said it was unbelievable working with Grande. I’ve grown up watching her become one of the most famous and talented performers in the world, he told the publication. She has an operatic vocal range, she’s an incredible performer and dancer and she’s effortlessly funny and charming in this movie. One day on set, after she played some of her unreleased music, I told her, Nobody should b", "date_str": "2026-11-03T18:50:54+00:00", "hash": "80f5199b26ac1fd5", "title_fa": "فیلم تصادف آریانا گرانده در مصاحبه ای با بازیگران «فاکر در قانون» را تماشا کنید", "summary_fa": "بالاخره ماه فاکر در قانون است! و با نزدیک شدن به اکران فیلم، یونیورسال پیکچرز ویدیوی شایان ستایش از بازیگرانی را که آریانا جی رنده سقوط کرد به اشتراک گذاشته است. مرتبط آریانا گرانده باب جدیدی را نشان می دهد که دوست پسرش ریکی آلوارز دوباره عاشق می شود آریانا گرانده از یک درخت کریسمس درخشان تر از یک درخت کریسمس در کمپین موسیقی دیدنی تعطیلات برند لوکس می درخشد. 2)، اسکایلر گیسوندو که نقش نامزد شخصیت گرانده، اولیویا را در فیلم فرانچایز ملاقات با والدین بازی می‌کند، با بینه فلدشتاین و ادواردو فرانکو، بار دیگر با بِنی فلدشتاین و ادواردو فرانکو ملاقات می‌کند، که هفت سال پس از کارگردانی منتقدانه اولیویا وایلد، هر سه آن‌ها را دوباره گرد هم آورد. در پایان، گرانده وارد کادر می‌شود و فلدشتاین را در آغوش می‌گیرد و به دوربین می‌گوید، می‌دانم که در Booksmart نبودم، اما آن‌ها را خیلی دوست دارم! ژیسوندو و فرانکو با خندیدن به صحنه‌ای غیرمنتظره او در دور هم جمعی، گفتند در حالی که R.E.M. بنیانگذار Beauty در Booksmart نبود، هیچ یک از آنها در دوولوژی عظیم Wicked حضور نداشتند، که باعث شد گرانده نامزدی اسکار را به همراه داشته باشد. فلدشتاین با کنایه گفت که اگر در فیلم Wicked همبازی می شد، او را می کشت و از سوپراستار پاپ می پرسد، من کی باید می بودم؟ یکی از میمون ها؟ نه! گرانده که هنوز در دم اسبی بلوند گلیندا بود، با خنده پاسخ داد. برنده گرمی از زمان پخش فیلم Focker-in-Law که برای اولین بار در آخر هفته شکرگزاری پخش می شود، به سبزه طبیعی خود بازگشته است. او همچنین اخیراً موهای خود را خرد کرد و باب جدید خود را که دوست پسرش ریکی آلوارز در ماه اکتبر در اینستاگرام سر به سر بود، معرفی کرد. اکنون، او آماده بازگشت به نمایش امشب با بازی جیمی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/ariana-grande-focker-in-law-cast-screenshot-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۲ آبان • ۲۲:۲۰"}, {"source": "Billboard", "title": "Michigan ‘Let’s Go Blue’ Composers Settle Lawsuit Over ‘College Football’ Video Game Synch", "link": "https://www.billboard.com/pro/michigan-lets-go-blue-lawsuit-settlement-college-football/", "summary": "The composers of the University of Michigan’s iconic “Let’s Go Blue” marching band fight song have settled legal claims over a synch placement in the College Football video game franchise. A Monday (Nov. 2) court filing, obtained and first reported by Billboard , says a settlement has been reached resolving “all issues” in the music licensing dispute that began this past March . Deal terms were not disclosed. Related What s at Stake in the Dismissal of Wixen s Lawsuit Against Meta — And Why It Refiled Its Complaint (Guest Column) Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania The lawsuit stemmed from a license inked by music publishers Theodore Presser and Carl Fischer with Electronic Arts (EA) in 2024 to feature “Let’s Go Blue” in the popular video game College Football , which returned that year from a long hiatus after the NCAA loosened player restrictions on name, image and likeness rights. Presser and Fischer claimed they’d had continuous rights to administer “Let’s Go Blue” since signing a publishing deal with co-writers Albert Ahronheim and Joe Carl in 1978. But Ahronheim and Carl, who composed the song as students at Michigan, said the composition rights actually reverted back to them years ago — and they weren’t happy to find out the publishers had unilaterally licensed out “Let’s Go Blue” for what they called a “shockingly low” synch fee of just $1,000. Ahronheim and Carl demanded that EA remove the synch from College Football , and the video game juggernaut complied. This led Presser and Fischer to file a contract interference lawsuit against the composers, who then countersued for copyright infringement . EA itself was not involved in the litigation or accused of any wrongdoing. Each side sought financial damages from the other, and both wanted a judge to step in and decide the rightful owner of “Let’s Go Blue.” The dispute turned on the termination right, a provision of copyright law that allows authors to claw back intellectual property decades after signing it away. Ahronheim and Carl said they successfully exercised their termination rights in 2013, while the publishers claimed the composers skipped a key technical step in this legal process and therefore did not get the composition reverted. Reached for comment on the settlement Monday, the publishers’ attorney Brian Caplan told Billboard his clients “are happy that they were able to", "date_str": "2026-11-03T18:47:31+00:00", "hash": "282ce88e57b94baa", "title_fa": "آهنگسازان \"Let's Go Blue\" در میشیگان شکایت خود را بر سر همگام سازی بازی های ویدئویی \"فوتبال دانشگاهی\" حل و فصل کردند.", "summary_fa": "آهنگسازان آهنگ مبارزات گروهی نمادین «Let’s Go Blue» دانشگاه میشیگان، ادعاهای حقوقی مربوط به قرار دادن همزمان در مجموعه بازی های ویدیویی College Football را حل و فصل کردند. یک پرونده دادگاه دوشنبه (2 نوامبر) که برای اولین بار توسط بیلبورد به دست آمد و گزارش شد، می گوید که توافقی برای حل \"تمام مسائل\" در مناقشه صدور مجوز موسیقی که در مارس گذشته آغاز شد، حاصل شده است. شرایط معامله فاش نشد. موارد مرتبط در رد دعوای Wixen علیه متا – و چرا دوباره شکایت خود را ثبت کرد (ستون مهمان) کنی مک فرسون، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در سن 71 سالگی درگذشت. توسط ناشران موسیقی تئودور پرسر و کارل فیشر با الکترونیک آرتز (EA) در سال 2024 برای نمایش \"Let's Go Blue\" در بازی ویدیویی محبوب College Football که در آن سال پس از کاهش محدودیت‌های بازیکنان در نام، تصویر و حق شباهت توسط NCAA از یک وقفه طولانی بازگشت. پرسر و فیشر ادعا کردند که از زمان امضای قرارداد انتشار با آلبرت آهرونهایم و جو کارل در سال 1978، از حقوق مستمری برای مدیریت \"Let's Go Blue\" برخوردار بودند. اما آهرونهایم و کارل که در دوران دانشجویی در میشیگان آهنگ را ساخته بودند، گفتند که حقوق آهنگسازی واقعاً به آنها بازگردانده شده است - و آنها از اینکه سالها پیش مجوز انتشار را دریافت کردند خوشحال بودند. \"Let's Go Blue\" برای چیزی که آنها آن را هزینه همگام \"شوک آور پایین\" فقط 1000 دلار می نامیدند. آهرونهایم و کارل از EA خواستند که همگام سازی را از کالج فوتبال حذف کند، و جوگرنات بازی ویدیویی موافقت کرد. این امر باعث شد تا پرسر و فیشر شکایتی را علیه آهنگسازان مطرح کنند، که سپس به دلیل نقض حق چاپ شکایت کردند. EA خود در این دعوی دخیل نبوده و یا متهم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2233257757-e1793730712613.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Meta", "موسیقی"], "datetime_fa": "۱۲ آبان • ۲۲:۱۷"}, {"source": "Billboard", "title": "Ariana Grande Gives Another Peek at Her New Bob & Shares PDA Moments With Ricky Alvarez", "link": "https://www.billboard.com/music/music-news/ariana-grande-bob-hairstyle-photos-ricky-alvarez-1236373062/", "summary": "Ariana Grande is giving fans another look at her new hairstyle. The 33-year-old pop superstar and actress took to social media on Monday (Nov. 2) to share a series of photos featuring PDA-filled moments with boyfriend Ricky Alvarez, along with another glimpse of her fresh bob hairstyle. Related Ariana Grande Shows Off New Bob That Has Boyfriend Ricky Alvarez Falling in Love All Over Again Ariana Grande Shines Brighter Than a Christmas Tree in Luxury Brand s Musical Holiday Spectacular Campaign Video Ariana Grande Mourns Coco, Her Beloved Dog of 17 Years: I Will Miss You Every Day The Instagram gallery opens with a photo of Grande embracing Alvarez and gazing into his eyes amid lush greenery. Another sweet snapshot shows the singer kissing her partner on the forehead. She captioned the gallery with a simple white heart emoji followed by three exclamation marks. Grande also offered another look at her new bob, which she first debuted in late October. One image shows a side view of the cut, featuring a playful swoop that falls just above her shoulders, while another captures a sideways selfie showcasing the sleek style, accessorized with a white ribbon choker. The singer also shared a behind-the-scenes glimpse of hairstylist Brandon Pietsch appearing to wash her hair. The bob is everything mommy, actress Rachel Zegler wrote in the comments. The singer s brother Frankie Grande added, Cute happy girlie pop! I love you so! Grande also shared a photo of herself holding Enthousiasmos , a culture magazine whose third issue features her Wicked co-star Jeff Goldblum. The pair became friends while filming the movies, and later collaborated on Goldblum s 2025 album, Still Blooming . Goldblum also joined the conversation in the comments, responding with a series of revolving heart emojis. Grande s Instagram post follows her appearance with Alvarez at the New York City Marathon on Sunday (Nov. 1), where the couple cheered on runners. Influencer Ella Schweiger approached the pair with a request to write an encouraging note for a stranger who had completed the 26.2-mile race, according to TMZ . Grande obliged, writing You did it! alongside a few hearts and signing the message, Ari + Ricky. Schweiger later shared video of the encounter on Instagram, including the moment she delivered the note to a runner, who was thrilled to discover it came from the pop star. Grande is currently preparing for the release of her upcoming film Focker-in-Law , which opens in theaters on Nov. ", "date_str": "2026-11-03T18:28:12+00:00", "hash": "84ba59d94e6a916b", "title_fa": "آریانا گرانده نگاهی دیگر به باب جدید خود می‌اندازد و لحظات PDA را با ریکی آلوارز به اشتراک می‌گذارد", "summary_fa": "آریانا گرانده نگاهی دیگر به مدل موی جدید خود به طرفداران می دهد. این سوپراستار و هنرپیشه 33 ساله پاپ روز دوشنبه (2 نوامبر) در شبکه های اجتماعی مجموعه ای از عکس ها را به اشتراک گذاشت که لحظات پر از PDA را با دوست پسر ریکی آلوارز همراه با نگاهی اجمالی دیگر به مدل موهای باب تازه اش نشان می دهد. مرتبط آریانا گرانده باب جدیدی را نشان می‌دهد که دوست پسرش ریکی آلوارز دوباره عاشق می‌شود آریانا گرانده در کمپین تعطیلات موزیکال برند لوکس درخشان‌تر از درخت کریسمس می‌درخشد ویدیوی تماشایی آریانا گرانده عزادار کوکو، سگ محبوبش است که در اینستاگرام 17 سال از شما باز می‌شود. آلوارز را در آغوش گرفته و در میان فضای سبز سرسبز به چشمان او خیره شده است. یکی دیگر از عکس های شیرین این خواننده را در حال بوسیدن پیشانی همسرش نشان می دهد. او گالری را با یک شکلک ساده قلب سفید که با سه علامت تعجب همراه بود، شرح داد. گرانده همچنین نگاهی دیگر به باب جدید خود ارائه کرد که اولین بار در اواخر اکتبر عرضه شد. یک تصویر نمای جانبی برش را نشان می‌دهد، که شامل یک سوهان بازیگوش است که دقیقاً بالای شانه‌های او می‌افتد، در حالی که تصویری دیگر سلفی به‌صورتی را به تصویر می‌کشد که استایل شیک را به نمایش می‌گذارد و با یک روبان سفید تزئین شده است. این خواننده همچنین تصویری از پشت صحنه از آرایشگر براندون پیچ که ظاهراً موهایش را می‌شوید به اشتراک گذاشت. راشل زگلر بازیگر زن در نظرات نوشت: باب همه چیز مامان است. برادر خواننده فرانکی گرانده افزود: پاپ دخترانه شاد و ناز! خیلی دوستت دارم! گرانده همچنین عکسی از خود در حالی که مجله فرهنگی Enthousiasmos را در دست دارد به اشتراک گذاشت که در شماره سوم آن، جف گلدبلوم، همبازی اش در Wicked، حضور دارد.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P103MADZ-e1791829126702.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۲ آبان • ۲۱:۵۸"}, {"source": "Billboard", "title": "‘Something To Lose’: Behind Stella Lefty’s Winning Duet With Vincent Mason: ‘I’m So Grateful That We’re Doing This Together’", "link": "https://www.billboard.com/music/country/something-to-lose-makin-tracks-1236373016/", "summary": "It was intended, according to Stella Lefty ’s lyrics, as a little “something to do.” But a meet-up with fellow country artist Vincent Mason turned into something much greater. Eight months later, they’re fully public about a relationship that developed from that original meeting, and her something to do is now “Something to Lose” on two fronts — it’s a way to describe the value they put on their romantic connection, but it’s also the title of their first duet. “Once we started dating,” she says, “it was just this inevitable thing, like, ‘There’s this song that’s so personal about our relationship and the way that things started and the way that I feel about you.’ It just made so much sense.” It was not an ideal time, career-wise, to start a new relationship. Mason had been hitting it hard as a new artist for several years, taking every promotional opportunity available and finally on his way to his first top 20 on Billboard ’s Country Airplay with “Wish You Well.” Lefty’s “Thinking ‘Bout You” was bringing her first real taste of commercial significance, leading to her February 2026 signing with Atlantic/Outpost, and the schedule she anticipated didn’t have room for someone new. “I felt like I was [just being] born into this,” she says, “like, entering for the first time, and so I felt like I was in a weird place. I was like, ‘Oh, my god, I need to accept being alone because I’m experiencing all these things for the first time, and I need to figure this out.’” Mason, after seeing her on TikTok, sent her a direct message. She responded, and they met up in early 2026 at Schulman’s, a neighborhood bar in East Nashville. Just to be safe, she brought along a few industry friends: songwriters Grace Enger (“Boston”) and Jacob “JKash” Hindlin (“Last Night,” “After All the Bars are Closed”) and writer-producer Joe Reeves (Thomas Rhett, Lil Durk). “Grace got a burger inside while [Lefty] was talking to Vincent outside,” Reeves recalls. “We were drinking chartreuse, and it was quite a funny night.” Monumental, as well, since the two singers hit it off immediately. Both had to leave town, but when their schedules lined up again, they saw each other for several days. Enger and Lefty were sharing quarters, so Enger witnessed the start of the relationship. The two women ended up writing with Jon Decious (“4x4xU,” “Phone, Keys, Wallet”) and Luke Dick (“Choosin’ Texas,” “Don’t Come Lookin’”) in Nashville on Feb. 18, spending six hours on another song, though Lefty was somew", "date_str": "2026-11-03T18:27:25+00:00", "hash": "1823b9c1654f382e", "title_fa": "\"چیزی برای از دست دادن\": پشت دوئت برنده استلا لفتی با وینسنت میسون: \"خیلی ممنونم که این کار را با هم انجام می دهیم\"", "summary_fa": "طبق اشعار استلا لفتی، به عنوان یک \"کاری برای انجام\" در نظر گرفته شده بود. اما ملاقات با هنرمند همشهری وینسنت میسون به چیزی بسیار بزرگتر تبدیل شد. هشت ماه بعد، آنها به طور کامل در مورد رابطه ای که از آن ملاقات اولیه ایجاد شده بود، صحبت می کنند، و کاری که او باید انجام دهد اکنون از دو جنبه \"چیزی برای از دست دادن\" است - این راهی است برای توصیف ارزشی که برای ارتباط عاشقانه خود قائل هستند، اما این عنوان اولین دوئت آنها نیز هست. او می‌گوید: «وقتی شروع به قرار گذاشتن کردیم، این فقط یک چیز اجتناب‌ناپذیر بود، مثلاً: «این آهنگ بسیار شخصی در مورد رابطه ما و نحوه شروع همه چیز و احساسی که من در مورد شما دارم.» بسیار منطقی بود. از نظر شغلی، زمان ایده آلی برای شروع یک رابطه جدید نبود. میسون چندین سال بود که به‌عنوان یک هنرمند جدید به سختی کار می‌کرد، از هر فرصت تبلیغاتی در دسترس استفاده می‌کرد و در نهایت با «Wish You Well» به سمت اولین 20 تای برتر خود در کانتری پخش بیلبورد می‌رفت. Lefty \"Thinking 'Bout You\" اولین طعم واقعی او را از اهمیت تجاری به ارمغان آورد، که منجر به قرارداد او در فوریه 2026 با Atlantic/Outpost شد و برنامه ای که او پیش بینی می کرد جایی برای شخص جدید نداشت. او می‌گوید: «احساس می‌کردم که در اینجا [به تازگی] به دنیا آمده‌ام، مثل این که برای اولین بار وارد شده‌ام، و بنابراین احساس می‌کردم در مکان عجیبی قرار گرفته‌ام. فکر می‌کردم، «اوه، خدای من، باید تنهایی را بپذیرم زیرا برای اولین بار است که همه این چیزها را تجربه می‌کنم، و باید این را بفهمم». او پاسخ داد، و آنها در اوایل سال 2026 در Schulman's، یک بار محله در شرق نشویل، ملاقات کردند. فقط برای ایمن بودن، او چند", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Stella-Lefty-CR-JACK-BALABAN-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۲ آبان • ۲۱:۵۷"}, {"source": "Billboard", "title": "Signed: Chris Young Joins UTA Roster; Rock Icon Lita Ford Finds New Frontiers", "link": "https://www.billboard.com/lists/chris-young-lita-ford-wiz-khalifa-music-artist-signings/", "summary": "Chris Young signed with UTA for global representation in all areas, spanning live touring, media, filmed entertainment, brand partnerships and more. Young released his 10th studio album, I Didn t Come Here To Leave , in 2025. The album marked his first with his new label home , Black River Entertainment. He is set to launch his An Acoustic Christmas Tour in December. Related Publishing Briefs: Peermusic Acquires 120 Publishing, Karen Hamilton to Lead New Division Ariel King , Jessica Nicholson I’m very excited to move into this new chapter at UTA. I really feel like there is a plan and a vision for growth and moving forward,” Young said in a statement. UTA agent Brian Hill added, “Chris is a world-class singer, songwriter, and live performer. We re excited to welcome him to the UTA family, and we look forward to building upon the incredible foundation he s already established. This is only the beginning!” — Jessica Nicholson Photo Credit: Teddy Allison Guitarist/vocalist Lita Ford signed with Frontiers Music Srl , which released her new single, Dracula, on Oct. 27. Ford began her career as a member of The Runaways in the 1970s, in which she played lead guitar. The band, which also included Joan Jett, released four studio albums that included such tracks as Cherry Bomb and Queens of Noise. Ford later embarked on a solo career and charted a total of four songs on the Billboard Hot 100, including Close My Eyes Forever with Ozzy Osbourne, which peaked at No. 8, and Kiss Me Deadly, which peaked at No. 12. Ford is a two-time Grammy nominee. It’s been a long journey to create this magical dark fairytale album for everyone to enjoy, said Ford in a statement. I needed the perfect team to make that happen and to help give this powerful record a life it deserves. I am so happy to say I have officially sealed the deal with Frontiers Music Srl, as we are thrilled, excited and ready to rise with the 1st new single on OCTOBER 27th, 2026. Good Night. Good Bye..Prepare To Die ‘DRACULA’!! Brace yourself. “We are incredibly proud to welcome LITA FORD to the Frontiers Label Group family, added Jeff Stevenson, GM of Frontiers Label Group. LITA is a true rock icon—an artist whose influence, musicianship, and unmistakable attitude have inspired generations of fans and musicians around the world. Beyond her extraordinary legacy, what excites us most is that LITA continues to look forward creatively. We’re honored that she has chosen Frontiers for this next chapter, and we can’t w", "date_str": "2026-11-03T18:22:29+00:00", "hash": "f1cec4acb04dc9b5", "title_fa": "امضا: کریس یانگ به فهرست UTA می پیوندد. نماد راک لیتا فورد مرزهای جدیدی پیدا می کند", "summary_fa": "کریس یانگ با UTA برای نمایندگی جهانی در همه زمینه‌ها، شامل تورهای زنده، رسانه‌ها، سرگرمی‌های فیلم‌برداری، مشارکت با برند و موارد دیگر قرارداد امضا کرد. یانگ دهمین آلبوم استودیویی خود را به نام I Didn t Come Here To Leave را در سال 2025 منتشر کرد. این آلبوم اولین آلبوم او را با لیبل جدیدش به نام Black River Entertainment رقم زد. او قرار است تور کریسمس آکوستیک خود را در ماه دسامبر راه اندازی کند. خلاصه انتشارات مرتبط: Peermusic Acquires 120 Publishing، کارن همیلتون برای رهبری بخش جدید Ariel King، Jessica Nicholson من بسیار هیجان زده هستم که وارد این فصل جدید در UTA شوم. یانگ در بیانیه‌ای گفت: واقعاً احساس می‌کنم که برنامه و چشم‌اندازی برای رشد و پیشرفت وجود دارد. مأمور UTA برایان هیل اضافه کرد: «کریس یک خواننده، ترانه‌سرا و اجرای زنده در سطح جهانی است. ما خوشحالیم که او را به خانواده UTA خوش آمد می‌گوییم، و مشتاقانه منتظریم تا بر اساس بنیادی باورنکردنی که او قبلاً ایجاد کرده است، بسازیم. این تنها آغاز است!» — جسیکا نیکلسون اعتبار عکس: تدی آلیسون گیتاریست/خواننده لیتا فورد با Frontiers Music Srl قراردادی امضا کرد که تک آهنگ جدید او به نام Dracula را در 27 اکتبر منتشر کرد. فورد کار خود را به عنوان عضوی از The Runaways در دهه 1970 آغاز کرد و در آن گیتار لید می نواخت. گروه، که جوآن جت نیز در آن حضور داشت، چهار آلبوم استودیویی منتشر کرد که شامل قطعاتی مانند بمب Cherry و Queens of Noise بود. فورد بعداً کار انفرادی را آغاز کرد و در مجموع چهار آهنگ را در بیلبورد Hot 100 چارت کرد، از جمله Close My Eyes Forever با Ozzy Osbourne که در رتبه 8 به اوج رسید و Kiss Me Deadly که در رتبه 12 قرار گرفت. فورد دو بار نامزد جایزه گرمی شده", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Chris-Young-CR-UTA-Billboard.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما", "موسیقی"], "datetime_fa": "۱۲ آبان • ۲۱:۵۲"}, {"source": "Billboard", "title": "Maren Morris Wants to Start a Film Club For Iconic Movies She’s Never Seen After Finally Watching This Absolute Holiday Classic", "link": "https://www.billboard.com/music/country/maren-morris-film-club-iconic-movies-never-seen-home-alone-1236373011/", "summary": "We all have that one friend who claims they ve never seen a single Star Wars movie, or just missed the boat on the whole Twilight thing. But Home Alone ? Surely there are only a handful of people out there who have not snuggled on the couch on a chilly December afternoon to screen the 1990 holiday classic about poor eight-year-old Kevin McCallister (Macaulay Culkin) accidentally getting left behind by his family at Christmas. Well, add Maren Morris to that list. In a TikTok posted on Monday (Nov. 2), Morris, 36, who was born the year the movie came out, did a call-out to anyone up for starting a movie club featuring iconic films they ve never seen. It took me until I was, like, 28-years-old to finally watch Home Alone , she said in the confessional-style video. And now I love it, she added. But that got her thinking about all the other classics she s never made time for, including Vietnam drama Full Metal Jacket and the classic John Candy comedy Uncle Buck (another great holiday standard, also written and produced by director John Hughes), which she said her friends are also mad at her for not having seen. Morris invited fans to join her in the project, encouraging them to list the movie classics they never got around to, or that their parents wouldn t show them. The suggestions in the comments featured a bunch of great suggestions of iconic films her fans have never seen, including Goonies , A Christmas Story , Pretty Woman , The Godfather , Jurassic Park , It s a Wonderful Life , Practical Magic and Casablanca . Morris released her fourth studio album, Dreamsicle , in May 2025.", "date_str": "2026-11-03T18:10:32+00:00", "hash": "91dec09d2a194950", "title_fa": "مارن موریس می خواهد یک باشگاه فیلم برای فیلم های نمادین راه اندازی کند که پس از تماشای این فیلم کلاسیک مطلق تعطیلات هرگز ندیده است", "summary_fa": "همه ما آن دوستی داریم که ادعا می کند هرگز حتی یک فیلم جنگ ستارگان را ندیده است یا فقط قایق را در کل فیلم Twilight از دست داده است. اما تنها در خانه؟ مطمئناً فقط تعداد انگشت شماری از مردم آنجا هستند که در یک بعدازظهر سرد دسامبر روی مبل نخوابیده اند تا فیلم کلاسیک تعطیلات سال 1990 را درباره کوین مک کالیستر (ماکالی کالکین) هشت ساله فقیر که به طور تصادفی توسط خانواده اش در کریسمس رها شده است، نمایش دهند. خب، مارن موریس را به این لیست اضافه کنید. در TikTok که در روز دوشنبه (2 نوامبر) منتشر شد، موریس، 36 ساله، که در سال اکران فیلم به دنیا آمد، از هر کسی که خواستار راه‌اندازی یک باشگاه سینمایی با فیلم‌های نمادینی بود که هرگز ندیده‌اند، دعوت کرد. او در این ویدئو به سبک اعتراف گفت: من تا 28 سالگی طول کشید تا بالاخره «تنها در خانه» را تماشا کنم. و حالا من آن را دوست دارم، او اضافه کرد. اما این باعث شد به تمام آثار کلاسیک دیگری فکر کند که هرگز برای آنها وقت نگذاشته است، از جمله درام ویتنامی ژاکت تمام فلزی و کمدی کلاسیک جان کندی عمو باک (یکی دیگر از استانداردهای عالی تعطیلات، که همچنین توسط کارگردان جان هیوز نوشته و تهیه شده است)، که به گفته او دوستانش نیز به خاطر ندیدن از او عصبانی هستند. موریس از طرفدارانش دعوت کرد تا در پروژه به او بپیوندند و آنها را تشویق کرد تا فیلم‌های کلاسیکی را که هرگز به آن‌ها نرسیده‌اند فهرست کنند، یا اینکه والدینشان به آنها نشان نمی‌دهند. پیشنهادات در نظرات مجموعه‌ای از پیشنهادات عالی از فیلم‌های نمادینی را که طرفداران او هرگز ندیده‌اند، نشان می‌دهد، از جمله Goonies، A Christmas Story، Pretty Woman، The Godfather، Jurassic Park، Its a Wonderful Life، Practical Magic و Casablanca. موریس چهارمین آلبوم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P103J4O6-e1793727724672.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۲ آبان • ۲۱:۴۰"}, {"source": "Deadline", "title": "Blumhouse & Atomic Monster Unveil New Name For Combined Studio", "link": "https://deadline.com/2026/11/blumhouse-atomic-new-name-jason-blum-james-wan-1237212295/", "summary": "Two years after merging, Jason Blum s Blumhouse and James Wan s Atomic Monster will now call their combined entity Blumhouse Atomic. The producers of Obsession, Backrooms and the Conjuring franchise will continue as distinct production labels with their own creative teams shepherding film and TV projects under each label. Since ط Trust Me, Im a Doctor: Kal Penn and Abbie Cornish Star in a Minor Sidebar to Anna Nicole Smith Story Chappell Roan کریستینا آگیلرا را برای قهوه دعوت می‌کند و انتظارات را به‌طور کامل مدیریت می‌کند، در اولین شب مزایا در L.A. عبادتگاه: بررسی کنسرت او بعداً صبح به «Fox Friends» زنگ زد تا درباره همه چیزهایی که در ذهنش بود، از جمله اینکه چرا جنگ در ایران موضوع مهمی نیست، صحبت های طولانی انجام دهد. ترامپ گفت: ایران تهدید به سلاح هسته ای داشت. \"ایران شماره 1 حامی ترور در جهان است. آنها پست ترین هستند. آنها بسیار سرسخت هستند. من می بینم که چرا خاورمیانه از آنها می ترسید. آنها بسیار سرسخت هستند اما سرشان قطع شده است. آنها نیروی دریایی ندارند.\" آنها 159 کشتی داشتند. او ادامه داد: \"هر کشتی در ته دریا است، هر هواپیما در قطعات کوچک، قطعات کوچک در سراسر باند فرود آمده است. ضد هوایی نیست، ما دیشب تعدادی را بیرون آوردیم.\" \"حمله کوچک، جنگ نبود. آنها یک تاسیسات ضد هوایی ساختند، حدود دو ماه طول کشید. ما ساخت آن را تماشا کردیم. ما دیشب به خوبی به آن", "image_url": "https://variety.com/wp-content/uploads/2026/11/Trump-Piker.jpg?crop=0px%2C0px%2C1000px%2C562px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۲ آبان • ۲۱:۵۸"}, {"source": "Billboard", "title": "Fontaines D.C. Earns Its First Radio Chart No. 1 With ‘Marianne’", "link": "https://www.billboard.com/music/chart-beat/fontaines-dc-marianne-number-1-adult-alternative-airplay-1236373024/", "summary": "Fontaines D.C. continues its momentum on Billboard ’s charts. One week after the band scored its first overall leader with new album Dopamine Chamber , it adds its first radio No. 1, as “Marianne” rises a spot on the Adult Alternative Airplay chart dated Nov. 7. The set’s lead single, released on County Love Train/XL Recordings/Beggars Group, reaches the top thanks to a 4% gain in plays in the Oct. 23-29-tracking week, according to Luminate. The coronation caps the group’s steady climb at the format. Each of Fontaines D.C.’s six Adult Alternative Airplay entries has peaked higher than the one before it, with the band having come close to leading with its previous two singles: “Jackie Down the Line,” No. 40, 2022 “Roman Holiday,” No. 35, 2022 “Starburster,” No. 18, 2024 “Favourite,” No. 3, 2024 “It’s Amazing to Be Young,” No. 2, 2025 “Marianne,” No. 1, 2026 “Marianne” also marks a return to No. 1 for XL Recordings. It earns the imprint its fourth leader at the format, following three from Adele (on XL/Columbia): “Rolling in the Deep” (for 14 weeks in 2011), “Rumour Has It” (one week, 2011) and “Hello” (four, 2015). “Marianne” is also gaining on Alternative Airplay, where it holds at its No. 16 high for a third straight week, with a 5% gain in spins. Dopamine Chamber debuted at No. 1 on the Oct. 31-dated Independent Albums, Indie Store Album Sales and Vinyl Albums charts. It also opened at No. 4 on Alternative Albums and No. 14 on the Billboard 200 .", "date_str": "2026-11-03T17:47:28+00:00", "hash": "1f332ef83d513c07", "title_fa": "Fontanes D.C اولین نمودار رادیویی شماره 1 خود را با \"ماریان\" به دست آورد.", "summary_fa": "Fontanes D.C به حرکت خود در نمودارهای بیلبورد ادامه می دهد. یک هفته پس از اینکه گروه با آلبوم جدید Dopamine Chamber اولین رهبر کلی خود را به دست آورد، اولین رادیوی خود را به شماره 1 اضافه کرد، زیرا «ماریان» در جدول پخش جایگزین بزرگسالان در تاریخ 7 نوامبر رتبه اول را کسب کرد. تک آهنگ اصلی مجموعه که در County Love Train/XL Recordings/Beggars Group منتشر شد، به لطف یک نواختن به رتبه اول O در %4 رسید. طبق گزارش Luminate، هفته پیگیری 23-29. تاج گذاری، صعود ثابت گروه را در قالب محدود می کند. هر یک از شش آهنگ ایرپلی جایگزین بزرگسالان Fontaines D.C به بالاترین حد خود نسبت به قبلی رسیده است، و گروه با دو تک آهنگ قبلی خود به پیشتاز نزدیک شده است: \"Jackie Down the Line\"، شماره 40، 2022 \"Roman Holiday\"، شماره 35، 2022، \"No.24،\" \"Starburster\" «مورد علاقه»، شماره 3، 2024، «جوان بودن شگفت‌انگیز است»، شماره 2، 2025 «ماریان»، شماره 1، 2026 «ماریان» همچنین نشان دهنده بازگشت به شماره 1 برای XL Recordings است. پس از سه اثر از آدل (در XL/Columbia): \"Rolling in the Deep\" (به مدت 14 هفته در سال 2011)، \"Rumour Has It\" (یک هفته، 2011) و \"Hello\" (چهار، 2015) چهارمین رهبر خود را در این فرمت به دست آورد. «ماریان» همچنین در Alternative Airplay سود می‌برد، جایی که برای سومین هفته متوالی در رتبه 16 قرار دارد و با 5 درصد افزایش در اسپین‌ها، در رتبه 16 قرار دارد. اتاق دوپامین در نمودارهای آلبوم های مستقل، فروش آلبوم فروشگاه مستقل و نمودار آلبوم های وینیل در تاریخ 31 اکتبر در رتبه اول قرار گرفت. همچنین در شماره افتتاح شد. 4 در آلبوم های جایگزین و شماره 14 در بیلبورد 200. طبق گزارش Luminate، تک‌آهنگ اصلی مجموعه، که در County Love Train/XL Recordings/Beggars Group منتشر شد، به لطف افزایش 4 درصدی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/fontaines-dc-2026-press-cr-ewen-spencer-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۲ آبان • ۲۱:۱۷"}, {"source": "Billboard", "title": "Fans Choose Grupo Cañaveral & Olivia Wald’s ‘La Rosita de mi Boca’ as Best New Latin Music of the Week", "link": "https://www.billboard.com/music/latin/grupo-canaveral-olivia-wald-best-new-latin-music-poll-results-1236372994/", "summary": "Grupo Cañaveral has topped Billboard’s new music Latin poll published on Oct. 30 with its new single, La Rosita de mi Boca in collaboration with Olivia Wald. Billboard readers voted for the new single as their favorite music release of the week after the New Music Latin poll and playlist was published; the song earned more than 53 percent of the vote. La Rosita de mi Boca — which loosely translates to the pink tint of my lips — is a romantic cumbia track powered by Wald s sugary vocals. In the pink-hued music video, the rising Argentine pop artist is dancing and having a cheeky time with Cañaveral s lead vocalist, Emir Pabón. “These kind of lyrics inspire you to keep going, with that positivity of spreading love to society, which is what we should all do as human beings, Pabón previously said at the 2026 Billboard Latin Music Week of the new music they re releasing. ”Understanding the roots of the genre, believing in what I’m doing … and when you step out of your comfort zone, wonderful things start to happen. You can create a song today and it won’t sound the same as in 1995, but it can’t be the same because everything is digital now, and it won’t sound the same.” Another fan favorite in this week’s New Music Latin poll — following Cañaveral s winning song — is Chuyin s Fuga Pa San Carlos with more than 42 percent of the vote. See the poll results below. Editor’s Note: The results of the weekly New Music Latin poll are posted if the poll generates more than 1,000 votes. Take Our Poll", "date_str": "2026-11-03T17:42:21+00:00", "hash": "ca5bf19cca2b93a1", "title_fa": "طرفداران «La Rosita de mi Boca» از گروه Grupo Canaveral و Olivia Wald را به عنوان بهترین موسیقی لاتین جدید هفته انتخاب کردند.", "summary_fa": "Grupo Canaveral در نظرسنجی لاتین موسیقی جدید بیلبورد که در 30 اکتبر منتشر شد، با آهنگ جدید خود، La Rosita de mi Boca با همکاری اولیویا والد، در صدر قرار گرفت. خوانندگان بیلبورد پس از انتشار نظرسنجی نیو موزیک لاتین و لیست پخش، به آهنگ جدید به عنوان انتشار موسیقی مورد علاقه خود در هفته رای دادند. این آهنگ بیش از 53 درصد آرا را به دست آورد. La Rosita de mi Boca - که به راحتی به رنگ صورتی لب های من ترجمه می شود - یک آهنگ رمانتیک کامبیا است که توسط آوازهای شیرین والد ساخته شده است. در موزیک ویدیو با رنگ صورتی، هنرمند پاپ آرژانتینی در حال رقصیدن و خوش گذرانی با خواننده اصلی کاناورال، امیر پابون است. پابون قبلاً در هفته موسیقی لاتین بیلبورد 2026 درباره موسیقی جدیدی که منتشر می‌کنند، گفت: «این نوع اشعار به شما الهام می‌بخشد که به راهتان ادامه دهید، با آن مثبت بودن گسترش عشق به جامعه، کاری که همه ما باید به عنوان انسان انجام دهیم. \"درک ریشه‌های این ژانر، باور به کاری که انجام می‌دهم... و وقتی از منطقه راحتی خود خارج می‌شوید، چیزهای شگفت‌انگیزی شروع می‌شود. امروز می‌توانید آهنگی بسازید و صدای آن مانند سال 1995 نخواهد بود، اما نمی‌تواند یکسان باشد، زیرا اکنون همه چیز دیجیتال است، و به نظر نمی‌رسد.\" یکی دیگر از طرفداران مورد علاقه در نظرسنجی نیو موزیک لاتین این هفته - به دنبال آهنگ برنده کاناورال - فوگا پا سن کارلوس چویین با بیش از 42 درصد آرا است. نتایج نظرسنجی را در زیر مشاهده کنید. توجه سردبیر: نتایج نظرسنجی هفتگی New Music Latin در صورتی ارسال می شود که نظرسنجی بیش از 1000 رای ایجاد کند. نظرسنجی ما را بگیرید Grupo Cañaveral در نظرسنجی لاتین موسیقی جدید بیلبورد که در 30 اکتبر منتشر شد با تک آهنگ جدیدش La Rosita de", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/grupo-canaveral-cr-pavel-anton-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۲ آبان • ۲۱:۱۲"}, {"source": "Billboard", "title": "Little Mix’s Jade Earns Her First Solo Hot 100 Hit With ‘Angel of My Dreams’", "link": "https://www.billboard.com/music/chart-beat/little-mix-jade-angel-of-my-dreams-solo-hot-100-1236372969/", "summary": "Jade earns her first solo hit on the Billboard Hot 100 as her single “Angel of My Dreams” debuts at No. 70 on the chart dated Nov. 7 — more than two years after its release. She becomes the first member of Little Mix to reach the chart as a soloist. The song debuts almost entirely on the strength of streaming. It drew 3.8 million official U.S. streams (up 65%) in the Oct. 23-29 tracking week, according to Luminate. The track’s resurgence can be traced to the Victoria’s Secret Fashion Show. During the Oct. 18 event in Los Angeles, which was streamed live, Kylie Jenner walked the runway to the song in a $50 million Fantasy Bra, a moment that quickly went viral across social media. Though Jade didn’t perform the song live, the synch resulted in a sizable streaming surge. As Billboard reported , “Angel of My Dreams” logged 18,000 official U.S. streams on the day of the show, then vaulted 1,434% to more than 284,000 the following day. The song’s Hot 100 arrival follows its No. 6 debut on the Hot Dance/Pop Songs chart (dated Oct. 31), where it climbs to No. 4 in its second week. Jade previously charted three songs on the Hot 100 as a member of Little Mix: “Wings” (No. 79 peak in 2013), “Black Magic” (No. 67, 2015) and “Shout Out to My Ex” (No. 69, 2016). Little Mix formed on the U.K.’s The X Factor in 2011 and became the first group to win the competition. The quartet, comprising Jade (Thirlwall), Perrie Edwards, Jesy Nelson and Leigh-Anne Pinnock, first appeared on a U.S. Billboard chart in March 2013 when “Wings” debuted at No. 40 on the Pop Airplay chart, later peaking at No. 26. The act has logged five songs on Pop Airplay, plus two on Dance Airplay, including the No. 1 “Heartbreak Anthem,” with Galantis and David Guetta, in 2021. Back home, the group was a much bigger force. Little Mix charted 25 songs on the U.K. s Official Singles Chart in 2011-21, including five No. 1s: “Cannonball” (2011), “Wings” (2012), “Black Magic” (2015), “Shout Out to My Ex” (2016) and “Sweet Melody” (2021). Nelson left in December 2020 and the remaining trio went on hiatus in 2022. “Angel of My Dreams,” released via RCA Records in July 2024, marked Jade s first solo release after the hiatus. It also became her first solo Billboard chart entry out of the gate, debuting and peaking at No. 175 on the Billboard Global Excl. U.S. chart that August. The song later served as the lead single from Jade s debut solo album, That’s Showbiz Baby! , which reached No. 6 on Top Dance Albums and ", "date_str": "2026-11-03T17:33:55+00:00", "hash": "189093382b79be9e", "title_fa": "جید از لیتل میکس اولین هیت 100 انفرادی خود را با «فرشته رویاهای من» به دست آورد.", "summary_fa": "جید اولین موفقیت انفرادی خود را در بیلبورد Hot 100 به‌عنوان تک‌آهنگ «Angel of My Dreams» به دست آورد که در تاریخ 7 نوامبر - بیش از دو سال پس از انتشار، در رتبه 70 جدول قرار گرفت. او اولین عضوی از Little Mix است که به عنوان سولیست به جدول می رسد. این آهنگ تقریباً به طور کامل با قدرت استریم شروع می شود. طبق گزارش Luminate، در هفته ردیابی 23 تا 29 اکتبر، 3.8 میلیون استریم رسمی ایالات متحده (افزایش 65 درصدی) را به خود اختصاص داد. احیای آهنگ را می توان در نمایش مد ویکتوریا سیکرت دنبال کرد. در جریان رویداد 18 اکتبر در لس آنجلس که به صورت زنده پخش شد، کایلی جنر با یک سوتین فانتزی 50 میلیون دلاری روی باند این آهنگ رفت، لحظه ای که به سرعت در رسانه های اجتماعی منتشر شد. اگرچه جید آهنگ را به صورت زنده اجرا نکرد، همگام سازی منجر به افزایش قابل توجهی در جریان شد. همانطور که بیلبورد گزارش داد، «فرشته رویاهای من» 18000 استریم رسمی ایالات متحده را در روز نمایش ثبت کرد، سپس با 1434 درصد به بیش از 284000 در روز بعد رسید. ورود 100 آهنگ داغ به دنبال شماره آن است. 6 اولین بار در جدول آهنگ های رقص داغ/پاپ (به تاریخ 31 اکتبر)، جایی که در دومین هفته خود به رتبه 4 صعود کرد. جید قبلاً سه آهنگ را در هات 100 به عنوان یکی از اعضای لیتل میکس به چارت کرده بود: \"Wings\" (نمره 79 اوج در سال 2013)، \"جادوی سیاه\" (شماره 67، 2015) و \"فرار کن به سابق من\" (شماره 69، 2016). Little Mix در سال 2011 در The X Factor بریتانیا شکل گرفت و اولین گروهی بود که برنده این رقابت شد. این کوارتت، متشکل از جید (Thirlwall)، پری ادواردز، جسی نلسون و لی-آن پینوک، اولین بار در", "image_url": "https://www.billboard.com/wp-content/uploads/2025/09/jade-2025-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۲ آبان • ۲۱:۰۳"}, {"source": "Billboard", "title": "Hilary Duff Takes Us Out and Laughs About Her ‘Spicy’ BFF Nights, Road Nerves & Finally Putting ‘The Math’ in Her Set", "link": "https://www.billboard.com/music/pop/hilary-duff-takes-us-out-spicy-bff-nights-road-nerves-video-1236372903/", "summary": "Hilary Duff has had a huge 2026. In addition to releasing her first new album in more than a decade , Luck or Something , she hit the road for her first tour in more than two decades, the aptly named cozy Small Rooms, Big Nerves swing through London, Brooklyn, Toronto, Los Angeles and Las Vegas, followed by the Lucky Me world tour , which was just extended into next year. Duff met Billboard s Delisa Shannon at Los Angeles Loose Cannon café for the latest edition of Takes Me Out, where the singer chatted up her Lucky Me Tour, talked about surprises in her setlist, what goes down her girls night out and revealed her secret pre-show rituals, including the all-important pink bubble. Watch the full interview above. Shannon and Duff, 39, started off with a game of truth or drink, with the singer demurring on naming her bffs, but hinting that some are definitely a wilder time out than others. I m spicy, so my spicy nights [are] kind of evil, she said, recalling an evening, pre-children, when a friend of hers who was getting played dirty by her boyfriend was on the receiving end of a drunk drive-by hot dogging of his house. That was pretty spicy, she said of the prank she pulled in her late teens that also involved dumping out cans of tuna on the bad boyfriend s lawn. After a nearly two-decade break from the road Duff also described getting back out there earlier this year on her four-show Small Rooms, Big Nerves outing , saying the title of the tour came about so earnestly. It was exactly the feeling. I felt so really scared, truly terrified, she said. It s this weird feeling of being on a bicycle and knowing what to do but you re like, I maybe have a broken leg, I don t know. if I can ride a bike right now.' On top of the nerves, Duff said she also had the stomach flu at the second date in Toronto on Jan. 24, but luckily she found a different gear and ended up having a great set. It was really cool to be faced with those challenges that just happen on tour and being like, OK, I can do this again. I m strong. I m powerful, I m capable. And then just to find myself slowly, she said. That confidence came from the super fans who showed loud and proud, decked out in their best show wear and constantly boosting the singer s confidence enough that she busted out the rarity The Math from her 2003 sophomore album, Metamorphosis . But when Shannon asked what song Duff would never add to the set list, instead of an answer the mother of four took a long swig of white wine, ", "date_str": "2026-11-03T17:23:36+00:00", "hash": "e46947f29271a239", "title_fa": "هیلاری داف ما را بیرون می‌برد و درباره شب‌های تند BFF، اعصاب جاده و در نهایت قرار دادن «ریاضی» در مجموعه‌اش می‌خندد.", "summary_fa": "هیلاری داف سال 2026 عظیمی را پشت سر گذاشته است. علاوه بر انتشار اولین آلبوم جدید خود در بیش از یک دهه، شانس یا چیزی، او اولین تور خود را در بیش از دو دهه به راه انداخت. به سال آینده داف با Delisa Shannon از بیلبورد در کافه Loose Cannon لس آنجلس برای آخرین نسخه Takes Me Out ملاقات کرد، جایی که خواننده در تور Lucky Me گپ زد، در مورد شگفتی‌های موجود در لیست مجموعه‌اش، چیزهایی که دخترانش در شب بیرون می‌آیند صحبت کرد و آداب و رسوم مخفیانه قبل از نمایش خود از جمله رنگ صورتی بسیار مهم را فاش کرد. مصاحبه کامل را در بالا ببینید. شانون و داف، 39 ساله، با یک بازی حقیقت یا نوشیدنی شروع کردند، در حالی که خواننده در مورد نام بردن از افراد خود ناامید بود، اما اشاره کرد که برخی از آنها قطعاً اوقات فراغت‌تری نسبت به دیگران دارند. او گفت: من تند هستم، بنابراین شب‌های تند من یک جورهایی شیطانی هستند، او گفت، به یاد یک غروب قبل از کودکی، زمانی که یکی از دوستانش که توسط دوست پسرش کثیف‌بازی می‌شد، در حال مستی در حال هات داگ کردن خانه‌اش بود. این بسیار تند بود، او درباره شوخی‌ای که در اواخر نوجوانی‌اش انجام داد و همچنین شامل ریختن قوطی‌های ماهی تن در چمن‌زار دوست پسر بد بود، گفت. پس از حدود دو دهه وقفه از جاده، داف همچنین گفت که در اوایل سال جاری در چهار نمایش خود در اتاق‌های کوچک، اعصاب بزرگ، بازگشت به آنجا را توضیح داد و گفت که عنوان تور بسیار جدی مطرح شده است. دقیقا همین حس بود او گفت که من واقعاً احساس ترس کردم، واقعاً وحشت کردم. این احساس عجیبی است که دوچرخه سواری می‌کنی و می‌دانی چه کار باید بکنم، اما دوست داری، شاید پای من شکسته است، نمی‌دانم. اگر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/hilary-duff-takes-us-out-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۲ آبان • ۲۰:۵۳"}, {"source": "Billboard", "title": "Sabrina Carpenter Channels Stevie Nicks & This ‘Hairspray’ Character in Dual Halloween Looks", "link": "https://www.billboard.com/music/music-news/sabrina-carpenter-stevie-nicks-hairspray-halloween-costumes-1236372937/", "summary": "Sabrina Carpenter opted for a witchy Halloween costume this year, but not in the classic pointy hat and broomstick sense of the word. A couple of days after the spooky holiday passed, the pop star showed off her Stevie Nicks -inspired getup, tambourine included. Related The Best 2026 Halloween Costumes, From Paris Hilton as Britney Spears to Kim Kardashian as North West Madonna Jokingly Calls Out Sabrina Carpenter for Taking 5 Days to Respond in Best Collab Speech at 2026 VMAs Sabrina Carpenter Margaret Qualley Join Fred Astaire Biopic Cast In photos shared to her Instagram on Monday (Nov. 2), Carpenter poses in a black dress with big, flowy sleeves and a black hat, which the Fleetwood Mac frontwoman has long established as her signature look. In one snap, she extends her arms with a nighttime city skyline in the background, holding Nicks’ go-to percussion instrument in one hand. Bev and a boy that’s fruity, Carpenter captioned the post, referencing a lyric from her Man s Best Friend track Go Go Juice. Stevie Nicks of Fleetwood Mac performs live at Yale Coliseum in New Haven, Conn., Nov. 20, 1975. Fin Costello/Redferns/Getty Images But that wasn’t Carpenter’s only Halloween getup this year. The Grammy winner also teamed up with her friends for a Hairspray group costume, teasing her hair and donning a 1960s-esque dress in a recreation of Amanda Bynes’ character Penny in the 2007 film adaptation of the musical of the same name. Fellow singer-songwriter Amber Mark coifed her hair and sported a suit to channel Penny’s love interest, Seaweed, while Carpenter’s bestie Paloma Sandoval channeled leading lady Tracy Turnblad. Carpenter s looks add to a long list of celebrity costumes that ruled Halloween this year. Paris Hilton turned heads in her fourth annual Britney Spears homage, Kim Kardashian transformed into daughter North West, and Keke Palmer s nod to Janet Jackson and Michael Jackson got the seal of approval from Miss Jackson herself. The Girl Meets World alum has always loved going all out for the end-of-October occasion, including last year, when she played a Short n Sweet Tour show at Madison Square Garden on Halloween in New York City and cycled through Wonder Woman, Barbie and Fred Flinstone costumes on stage. The trek supported her Billboard 200 -topping albums Short n Sweet and Man s Best Friend .", "date_str": "2026-11-03T17:16:25+00:00", "hash": "52ca0b513fcfe595", "title_fa": "سابرینا کارپنتر از استیوی نیکس و این شخصیت «اسپری مو» در ظاهر دوگانه هالووین پخش می‌کند.", "summary_fa": "سابرینا کارپنتر امسال لباس جادویی هالووین را انتخاب کرد، اما نه به مفهوم کلاه نوک تیز کلاسیک و چوب جارو کلمه. چند روز پس از سپری شدن تعطیلات ترسناک، این ستاره پاپ، لباس الهام گرفته از استیوی نیکس خود را به نمایش گذاشت. مرتبط بهترین لباس های هالووین 2026، از پاریس هیلتون در نقش بریتنی اسپیرز تا کیم کارداشیان در نقش نورث وست مدونا به شوخی از سابرینا کارپنتر برای 5 روز زمان برای پاسخگویی در بهترین سخنرانی در مراسم VMA 2026 دعوت می کند. 2)، کارپنتر با لباسی مشکی با آستین‌های بزرگ و روان و کلاهی مشکی ژست می‌گیرد، که از مدت‌ها پیش بازیگر اصلی مک فلیت‌وود آن را به‌عنوان ظاهر مشخص خود معرفی کرده بود. در یک عکس، او دستانش را با یک خط افق شهر در شب در پس‌زمینه دراز می‌کند و ساز کوبه‌ای نیکس را در یک دست نگه می‌دارد. بیو و پسری میوه‌دار، کارپنتر با اشاره به ترانه‌ای از آهنگ «بهترین دوست مرد» خود، «گو برو جویس»، پست را شرح داد. Stevie Nicks از Fleetwood Mac در 20 نوامبر 1975 در Yale Coliseum در New Haven، Conn. اجرا می‌کند. فین کاستلو/Redferns/Getty Images اما این تنها مراسم هالووین کارپنتر نبود. برنده گرمی همچنین با دوستانش برای یک لباس گروهی اسپری مو همکاری کرد، موهایش را اذیت کرد و لباسی به سبک دهه 1960 به تن کرد که در اقتباسی از فیلم موزیکال به همین نام در سال 2007، شخصیت آماندا باینز، پنی ساخته شد. امبر مارک، خواننده و ترانه سرای همکار، موهایش را بافت و کت و شلواری پوشید تا علاقه‌مندی پنی، جلبک دریایی را کانالیزه کند، در حالی که دوست‌داشتنی کارپنتر، پالوما سندووال، تریسی ترنبلاد، بانوی پیشرو را در اختیار داشت. ظاهر کارپنتر به لیست بلندی از لباس های افراد مشهوری که امسال در هالووین حکومت کردند اضافه می شود. پاریس هیلتون در چهارمین مراسم", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P108QR1B-e1793723116556.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۲ آبان • ۲۰:۴۶"}, {"source": "Billboard", "title": "Paris Jackson Wants $600M From Michael’s Estate Put in Family Trust, Rips Executor’s ‘Iron Grip’", "link": "https://www.billboard.com/pro/paris-jackson-demands-600m-in-trust-michael-jackson-estate/", "summary": "Michael Jackson ’s daughter Paris is now demanding that $600 million be released from her father’s estate to a family trust, accusing the estate’s executor of maintaining an “iron grip” over the late legend’s assets. One day after attorneys for Paris sharply criticized estate executor John Branca’s compensation, she filed a new petition in Los Angeles court arguing that he has “done nothing” to fund a trust intended to benefit her and her brothers, Prince, 29, and Bigi, 24. Related Paris Jackson Says Michael Estate Executor Failed to Justify $100M Fee: Particularly Offensive Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania “Michael intended for his children to become the caretakers of his legacy,” lawyers for Paris write in the Oct. 29 filing, reviewed by Billboard . “Instead, Executor continues to keep each beneficiary beholden to him with an iron grip over when and if monies are distributed to them.” The testy new filing, which says Paris is “uncowed by Executor’s intimidation tactics,” comes amid an ongoing feud with Branca, a prominent music attorney who has run the estate since Jackson’s sudden 2009 death. Branca has won plaudits for his well-documented financial success, but d appearing each day. I began to get scared,” he recalls. “I felt like I was living in a horror movie. We weren’t messy people, and we couldn’t find an apparent reason for their presence.” So, at his manager’s suggestion, he agreed to see a shaman. “The shaman told me that someone had done a spell on me, and that these types of witchcraft manifest as plagues,” he says. After a session with that man, Nsqk (pronounced like the chocolate powder brand) says he returned to his apartment, “and surprisingly, there were no flies anymore.” With the plague gone, the musician entered a period of reflection. He says he compared the process artists go through when achieving fame to the transformation experienced by Kafka’s protagonist, Gregor Samsa. “It’s a metamorphosis,” he notes. “If it’s not controlled, it can become grotesque and unrecognizable.” The changes Nsqk underwent during this time also led him to experience artistic evolution of new dimensions, making Mosca his most ambitious and accomplished album yet — one that promises to put him in the international spotlight by expanding his creative universe and challenging the boundaries of alternative music. “I’m trying to bring other sounds to the table, more daring lyrics, and that stems from the fear of not meeting expectations, but transformed,” he explains about his new LP, released on Oct. 15. “As an artist, and with my team, we wanted to create something completely new, with the aim of not settling for what’s sufficient but always delivering quality.” Musically, Mosca — which follows his 2024 album ATP — finds Nsqk exploring rock like never before in his repertoire, with guitars and distortion that evokes the arrogance, aggression and rejection ambition provokes in those unfamiliar with the pursuit. The 17-track album also delves into other genres, like electronic, urban, hip-hop and pop. This spirit of collaboration a", "date_str": "2026-11-03T17:03:18+00:00", "hash": "09b01d4e31a1845b", "title_fa": "Nsqk با آلبوم ج ", "title": "What’s a ‘Winyah’? Fans of This Edgy Folk-Rock Band Can Tell You", "link": "https://www.rollingstone.com/music/music-features/winyah-band-right-here-right-now-album-1235651857/", "summary": "The South Carolina five-piece is just the latest in a string of indie-rock bands infiltrating Americana", "date_str": "2026-11-03T17:57:56+00:00", "hash": "dd908b5efda1f5b3", "title_fa": "\"وینیاه\" چیست؟ طرفداران این گروه فولک-راک عصبی می توانند به شما بگویند", "summary_fa": "پنج قطعه کارولینای جنوبی تازه‌ترین مجموعه از گروه‌های مستقل راک است که به Americana نفوذ کرده‌اند. Winyah چیست؟ برای بسیاری، این یک خلیج در کارولینای جنوبی است. اما برای مخاطبان رو به رشدی از طرفداران ایندی راک، این نام گروه مورد علاقه جدیدشان است. این پنج قطعه که به خاطر همین حجم از آب - خلیج Winyah - در ایالت خود نامگذاری شده است، راک سخت جنوبی را با سبک‌های فولکلور جوان ترکیب می‌کند تا به موج جدید گروه‌هایی مانند دکستر و مون راکس، فاکس ان وید، و سیگار در غروب بپیوندد. وینیا برای اولین بار در سال 2023 به یک موجودیت تبدیل شد و در سال 2024 نقش Bonnaroo را بازی کرد، قبل از اینکه اولین آلبوم خود را با نام Lot to Learn در سال بعد منتشر کنند. این باعث شد که توری با ویترین لولاپالوزا و فروش پشت سر هم در سالن رقص بووری نیویورک برگزار شود. اکنون، چالش Winyah این است که با LP سال دوم خود، Right Here, Right Now، که در اواسط سپتامبر منتشر شد، از این شتاب استفاده کند. Right Here, Right Now دومین LP آنها در لیبل ایوان هانر's Cloverdale Records است و دارای 11 آهنگ است که تقریباً همه آنها در ایوان پشتی نوازنده باس استفان راسل در سپتامبر 2025 نوشته شده اند، زمانی که گروه بین تاریخ های تور فاصله داشتند. توماس رولند، خواننده اصلی فیلم، می‌گوید: «این اولین اثری است که ما با هم نوشتیم. «ما با چند آهنگ که واقعاً دوست داشتیم از آن بیرون آمدیم، اما دیوانه کننده بود. شما واقعاً تمام زندگی خود را برای نوشتن آلبوم اول و سپس زمان کوتاهی برای نوشتن آلبوم دوم دارید. این یک تجربه یادگیری بود. این ما بودیم که بفهمیم چگونه با هم بنویسیم، و هنوز در حال یادگیری هستیم.»", "image_url": "https://www.rollingstone.com/wp-content/u urges 8% Above Pre-Pandemic Average", "link": "https://variety.com/2026/film/global/la-bola-negra-spain-2026-box-office-surge-1236936640/", "summary": "Javier Calvo and Javier Ambrossi’s “La Bola Negra” has become the third highest-grossing Spanish film of all time at Spain’s domestic box office, earning an estimated €36.7 million ($41.0 million) through Nov. 1, according to Rentrak figures. Only Emilio Martínez-Lázaro’s blockbuster comedy “Ocho apellidos vascos” (“Spanish Affair,” $61.8 million) and J.A. Bayona’s disaster survival drama [ ]", "date_str": "2026-11-03T17:02:10+00:00", "hash": "2945cf049ea51108", "title_fa": "«La Bola Negra» سومین پرفروش‌ترین فیلم اسپانیایی اسپانیا شد که باکس آفیس آن 8 درصد بالاتر از میانگین پیش از همه‌گیری بود.", "summary_fa": "طبق آمار رنترک، «La Bola Negra» ساخته خاویر کالوو و خاویر آمبروسی با فروش 36.7 میلیون یورو (41.0 میلیون دلار) تا اول نوامبر، سومین فیلم پرفروش اسپانیایی تمام دوران در باکس آفیس داخلی اسپانیا شد. فقط کمدی پرفروش امیلیو مارتینز-لازارو «Ocho apellidos vascos» («رابطه اسپانیایی»، 61.8 میلیون دلار) و J.A. درام بقای فاجعه بایونا [ ] ارقام رنترک که در بازار مرسی وایادولید رونمایی شد، نشان می‌دهد که توزیع‌کنندگان مستقل با افزایش 29 درصدی استقبال از سینما تا سپتامبر، تنها کمدی پرفروش امیلیو مارتینز-لازارو «Ocho apellidos vascos» (8 میلیون دلار، Aff. درام زنده ماندن در فاجعه بایونا \"Lo imposible\" (غیر ممکن، 47.3 میلیون دلار) درآمد تئاتر بیشتری در میان تولیدات اسپانیایی ایجاد کرده است. داستان‌های مرتبط جیسون استاتهام و گای ریچی دوباره متحد می‌شوند - دوباره - برای فیلم اکشن انتقام نتفلیکس Dogfight چه باید دید در نتفلیکس در نوامبر 2026 توزیع شده توسط گروه مستقل Elastica Films، درام الهام‌گرفته از فدریکو گارسیا لورکا، با بازی پنه‌لوپه کلوزمر، میلیون‌ها نفر، و گلکسی 5 میلیون بلیت فروخته است. بزرگترین موفقیت داخلی اسپانیا در سال 2026. موفقیت آن در بحبوحه بهبود شدید بازار تئاتر اسپانیا به دست آمد. طبق آمار ارائه شده توسط رنترک در بازار فیلم مستقل وایادولید مرسی، درآمد باکس آفیس در 41 هفته اول سال 2026 نسبت به سال قبل 40 درصد  که تهدید می کند سلطنت ابدی او را برای همیشه پایان دهد. در Deadline تماشا کنید، ریس مایرز، ستاره Tudors and Vikings نقش مردی را بازی خواهد کرد که وی عاشق او می شود.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Jonathan-Rhys-Meyers-e1793723166570.jpg?w=683", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۲ آبان • ۱۹:۵۶"}, {"source": "Deadline", "title": "Brenton Thwaites & Erin Moriarty Join Nicolas Cage In Cyber-Thriller ‘C.L.A.Y.’, Filming Underway In London", "link": "https://deadline.com/2026/11/brenton-thwaites-erin-moriarty-join-clay-filming-london-1237212225/", "summary": "EXCLUSIVE: Brenton Thwaites (Pirates of the Caribbean: Dead Men Tell No Tales) and Erin Moriarty (The Boys) are rounding out the cast of C.L.A.Y., the psychological cyber-thriller written, directed and produced by Simon Afram. They will star alongside the cast we ve previously announced of Nicolas Cage, Michael Sheen, Jordi Mollà, Emilio Sakraya, Adrian Topol and [ ]", "date_str": "2026-11-03T16:10:00+00:00", "hash": "6e42ef5e0c15e339", "title_fa": "برنتون توایتز و ارین موریارتی به نیکلاس کیج در فیلم هیجان انگیز سایبری «C.L.A.Y.» ملحق می شوند که فیلمبرداری آن در لندن در حال انجام است.", "summary_fa": "اختصاصی: Brenton Thwaites (دزدان دریایی کارائیب: Dead Men Tell No Tales) و ارین موریارتی (The Boys) در حال تکمیل بازیگران C.L.A.Y، تریلر سایبری روانشناختی به نویسندگی، کارگردانی و تهیه کنندگی Simon Afram هستند. آن‌ها در کنار بازیگرانی که قبلاً اعلام کرده بودیم، نیکلاس کیج، مایکل شین، جوردی مولا، امیلیو ساکرایا، آدریان توپول و [ ] انحصاری: برنتون توایتز (دزدان دریایی کارائیب: مردگان قصه نمی‌گویند) و ارین موریارتی (The Boys theA) در حال بازی هستند. ، تریلر سایبری روانشناختی به نویسندگی، کارگردانی و تهیه کنندگی سایمون افرام. این فیلم اولین کارگردانی افرام را پس از فیلم جاسوسی جنگ جهانی دوم، Fortitude، که او برای کارگردان سیمون وست نوشت و تهیه کرد، نشان می‌دهد. اخبار مرتبط، ستاره ریچر، آگنز مو، به نیکلاس کیج مایکل شین در سایبر-تریلر C.L.A.Y می پیوندد. اخبار نیکلاس کیج، مایکل شین، جوردی مولا، امیلیو ساکرایا آدریان توپول پیشروترین تریلر سایبری C.L.A.Y. این فیلم یک اعجوبه کامپیوتری درخشان اما از نظر اجتماعی نامرئی را دنبال می‌کند که وقتی به C.L.A.Y کشیده می‌شود هدف و تعلق پیدا می‌کند. (دلقک ها به تو می خندند)، یک گروه هکر زیرزمینی که سوء استفاده های جسورانه آن تحریک دیجیتال را به عواقب واقعی تبدیل می کند. با افزایش شهرت این گروه، اقدامات آنها توجه سازمان های اطلاعاتی، سندیکاهای جنایی و هکرهای رقیب را به خود جلب می کند. در ددلاین تماشا کنید «برنتون و ارین دو تا از هیجان‌انگیزترین بازیگرانی هستند که امروز کار می‌کنند، و دقیقاً کاریزما و حقیقت احساسی مورد نیاز این داستان را به ارمغان می‌آورند. سایمون افرام، نویسنده و کارگردان، گفت: با آنها، بازیگران ما کامل هستند، و من نمی‌توانم خوشحالتر از این باشم که با هم در لندن در نوامبر امسال تولید می‌کنیم.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Brenton-Thwaites-Erin-Moriarty.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "سینما"], "datetime_fa": "۱۲ آبان • ۱۹:۴۰"}, {"source": "Deadline", "title": "Thomas Lennon, Emily Bett Rickards & Jolie Handler Among Cast Joining Angel Addiction Series ‘Quitters’", "link": "https://deadline.com/2026/11/thomas-lennon-emily-bett-rickards-jolie-handler-quitters-1237212213/", "summary": "EXCLUSIVE: Thomas Lennon (Reno 911!), Emily Bett Rickards (Arrow), and Jolie Handler (Nobody Wants This) have joined the cast of Angel dramedy series Quitters. Also new to cast are Lonzo Liggins (Yellowstone), comedian John Novosad and Denzel Papillon. The eight-episode half-hour addiction-themed dramedy is now in production in Utah starring Craig Ferguson and Megyn Price. [ ]", "date_str": "2026-11-03T16:05:00+00:00", "hash": "a78140b2cd58def6", "title_fa": "توماس لنون، ​​امیلی بت ریکاردز و جولی هندلر از جمله بازیگرانی هستند که به سریال اعتیاد فرشته ترک می کنند", "summary_fa": "انحصاری: توماس لنون (رینو 911!)، امیلی بت ریکاردز (پیکان) و جولی هندلر (هیچ کس این را نمی خواهد) به بازیگران سریال درامدی فرشته ترک ها پیو ks at No. 1 doesn’t include blockbuster soundtracks of previous eras, such as West Side Story, The Sound of Music, Doctor Zhivago, Saturday Night Fever and Purple Rain . Actually, it does include one – The Vince Guaraldi Trio ’s 1965 TV soundtrack, A Charlie Brown Christmas – but only because of its chart success since 2001. KPop Demon Hunters has been No. 1 for all but four of its 71 weeks on Top Soundtracks, having yielded for one week each to Wicked: For Good , the holiday perennial A Charlie Brown Christmas , Charli xcx ’s Wuthering Heights and the soundtrack to this year’s most-talked about TV miniseries, Heated Rivalry . Related Golden From KPop Demon Hunters Wins Best Original Song at 2026 Oscars, But Speech Is Cut Short Here are the 12 soundtracks that have logged the most weeks at No. 1 on Billboard ’s Soundtracks chart since the chart was introduced on June 30, 2001. The list includes two TV soundtracks and 10 film soundtracks. Notably, the five soundtracks with the most weeks at No. 1 are all from animated films. The number in each header is the number of weeks the album has spent at No. 1. They are listed in ascending order.", "date_str": "2026-11-03T15:30:00+00:00", "hash": "484ce893175239ba", "title_fa": "«KPop Demon Hunters» رکورد بیشترین هفته‌ها را در رتبه اول جدول موسیقی متن بیلبورد افزایش داد: فهرست کامل", "summary_fa": "KPop Demon Hunters در چارت موسیقی متن بیلبورد شکست خورده است و 67 هفته در رتبه اول قرار گرفته است - یک رکورد جدید و تمام دوران. بنابراین، ما فکر کردیم که زمان خوبی است که به 12 موسیقی متنی که به مدت 25 هفته یا بیشتر در جدول پیشرو بوده اند نگاه کنیم. این نمودار کمی بیش از 25 سال پیش - در 30 ژوئن 2001 - معرفی شد که به این معنی است که فهرست موسیقی‌های متن ما با بیشترین هفته در رتبه اول. 1 شامل موسیقی متن‌های پرفروش دوره‌های قبلی، مانند داستان وست ساید، صدای موسیقی، دکتر ژیواگو، تب شنبه شب و باران بنفش نیست. در واقع، شامل یکی - موسیقی متن فیلم تلویزیونی 1965 Vince Guaraldi Trio، A Charlie Brown Christmas - است، اما فقط به دلیل موفقیت در نمودار از سال 2001. KPop Demon Hunters رتبه اول را کسب کرده است. 1 برای همه به جز چهار هفته از 71 هفته‌اش در Top Soundtracks، که هر یک به مدت یک هفته به Wicked: For Good، کریسمس چند ساله تعطیلات A Charlie Brown Christmas، Charli xcx's Wuthering Heights و موسیقی متن فیلم کوتاه‌ترین سریال تلویزیونی امسال، Heated Rivalry، پرداخته است. طلایی مرتبط از KPop Demon Hunters برنده بهترین آهنگ اصلی در اسکار 2026 شد، اما Speech Is Cut Short در اینجا 12 موسیقی متن فیلم که بیشترین هفته ها را در رتبه اول ثبت کرده اند آورده شده است. از زمان معرفی نمودار در 30 ژوئن 2001، رتبه 1 در جدول موسیقی متن بیلبورد. این فهرست شامل دو موسیقی متن تلویزیون و 10 موسیقی متن فیلم است. قابل ذکر است، پنج موسیقی متن با بیشترین هفته در رتبه 1، همه از فیلم های انیمیشن هستند. تعداد در هر هدر تعداد هفته هایی است که آلبوم در شماره 1 سپری کرده است. آنها به ترتیب صعودی فهرست", "image_url": "https://www.billboard.com/wp-content/uploads/2025/08/02-kpop-demon-hunters-cr-netflix-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۲ آبان • ۱۹:۰۰"}, {"source": "Billboard", "title": "BTS’ Comeback Drives HYBE’s Quarterly Earnings to All-Time Highs", "link": "https://www.billboard.com/pro/hybe-q3-earnings-2026-bts-katseye/", "summary": "BTS ’ continuing world tour has delivered HYBE its best earnings report in the company s history, with the company reporting 1.52757 trillion Korean won ($1.135 billion) in revenue and 188.5 billion Korean won ($140.35 million) in operating profit for the third quarter of 2026. Revenue from recorded music, concerts, appearances and advertisements for HYBE’s artists accounted for 70% of this quarter’s revenue, totaling 1.0743 billion Korean won ($801.36 million). Indirect artist activities, which include merchandise, licensing, fan club memberships and content, had been 750.4 billion Korean won ($559.1 million). Related Q3 Music Earnings Roundup: Here s What Every Company Made (Updating) Kenny MacPherson, Veteran Music Publisher an rdt verdreven, besluit Joseph wraak te nemen. Tijdens zijn poging komt hij in contact met Shannon Christie (Nicole Kidman), de eigenzinnige dochter van een welgestelde familie. Shannon droomt ervan om aan haar streng gecontroleerde bestaan te ontsnappen en een nieuw leven in Amerika te beginnen. Wanneer ze besluit naar de Verenigde Staten te vertrekken, gaat Joseph met haar mee. Hoewel ze uit totaal verschillende sociale klassen komen en voortdurend ruzie maken, zijn ze onderweg op elkaar aangewezen. Eenmaal aangekomen in Boston ontdekken ze dat het Amerikaanse leven veel moeilijker is dan ze hadden verwacht. Ze raken hun geld kwijt en moeten onder erbarmelijke omstandigheden zien te overleven. Joseph verdient geld met bokswedstrijden, terwijl Shannon werk probeert te vinden. Ondertussen groeit hun onderlinge aantrekkingskracht, maar hun trots en verschillende achtergronden zorgen regelmatig voor conflicten. Wanneer hun omstandigheden steeds uitzichtlozer worden, raken Joseph en Shannon van elkaar gescheiden. Joseph blijft echter vasthouden aan zijn grote droom: een eigen stuk land bezitten. Die kans lijkt zich uiteindelijk voor te doen wanneer de Amerikaanse overheid in Oklahoma gratis grond beschikbaar stelt aan kolonisten die tijdens een spectaculaire landrace als eersten een perceel weten te bereiken. De zoektocht naar een eigen toekomst brengt Joseph en Shannon uiteindelijk opnieuw samen. Ze moeten beslissen of ze hun dromen afzonderlijk willen najagen of samen een nieuw bestaan willen opbouwen. Far and Away is een film van regisseur Ron Howard, bekend van onder meer A Beautiful Mind en How the Grinch Stole Christmas. Op IMDb scoort de film een 6,6 als rapportcijfer. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Historisch drama verrast met topnotering op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-11-03T15:56:24+00:00", "hash": "8758469edbb350d6", "title_fa": " .billboard.com/pro/wixen-music-meta-copyright-lawsuit-whats-at-stake/", "summary": "Our songwriting clients write the music that soundtracks many of Meta s Instagram and Facebook Reels. Meta licensed our clients music for seven years, from 2018 until 2025. Then it decided it would pay only a small fraction of what it had been paying for the same music. We said no. Meta kept using the music anyway. No license and no payment. It also started pulling our clients songs down while they were still under license, then told songwriters and their managers that we were the ones who took them down. That s why we filed suit , and it s why so much of our clients music is no longer up on Meta s platforms. Related Music Publisher Wixen Sues Meta, Says It Plans To Replace Human Songwriters With AI Music Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 Diddy Moved From New Jersey Prison to Similar Facility in Pennsylvania Nobody wanted that outcome, least of all songwriters whose fans live on Instagram. But to us, Meta s message was clear: It does not value the music that helped build its platforms. We do. Meta s first move in court: try to get the case thrown out before anyone has to answer for anything. Earlier this month, the judge ruled on that motion, and the headlines said he tossed our suit. He didn t. Here s what actually happened. Meta s motion never claimed it had a license. It never claimed it wasn t using the songs. It argued about whose name is on the paperwork, and on that, the judge asked us to spell out, song by song, whether Wixen owns each work or is its exclusive licensee, and which rights we hold. That s a pleading exercise. We did the same thing in our earlier 2020 case against Triller. That case went forward, and the judge cited it in his order. He gave us two weeks to refile, and we did. Our claims over Meta pulling songs down mid-license and blaming us for it were left alone. The trial date is still on the calendar. Discovery is underway, and we expect it to turn up even more of our clients music used without a license. Under a much-criticized Ninth Circuit rule from prior copyright infringement cases — a rule which now covers California — a publishing administrator must exclusively control 100% of a song to bring a claim. This is out of step with every other court that has looked at the question. We conceded that prior ruling in our briefs and kept those partially controlled songs in the case so we can take it up on appeal. Related Supreme Court Won t Overturn Landmark Music Copyright Termination", "date_str": "2026-11-03T15:00:00+00:00", "hash": "262bda1d46a3e32a", "title_fa": "چه چیزی در رد دعوی Wixen علیه متا در خطر است - و چرا دوباره شکایت خود را ثبت کرد (ستون مهمان)", "summary_fa": "مشتریان ترانه‌سرایی ما موسیقی‌هایی را می‌نویسند که موسیقی متن بسیاری از حلقه‌های اینستاگرام و فیسبوک متا را پخش می‌کند. متا به مدت هفت سال از سال 2018 تا 2025 مجوز موسیقی مشتریان ما را صادر کرد. سپس تصمیم گرفت که تنها بخش کوچکی از مبلغی را که برای همان موسیقی پرداخت کرده بود بپردازد. گفتیم نه. متا به هر حال به استفاده از موسیقی ادامه داد. بدون مجوز و بدون پرداخت. همچنین شروع به پایین کشیدن آهنگ های مشتریان ما در حالی که هنوز تحت مجوز بودند، کرد، سپس به ترانه سراها و مدیران آنها گفت که ما کسانی بودیم که آنها را حذف کردیم. به همین دلیل است که ما شکایت کردیم و به همین دلیل است که بسیاری از موسیقی های مشتریان ما دیگر روی پلتفرم های متا وجود ندارند. ناشر مرتبط موسیقی، Wixen از متا شکایت کرد و گفت که قصد دارد آهنگسازان انسانی را با موسیقی هوش مصنوعی جایگزین کند. اما پیام متا برای ما واضح بود: برای موسیقی‌ای که به ساخت پلتفرم‌هایش کمک کرده ارزشی قائل نیست. ما انجام می دهیم. اولین حرکت متا در دادگاه: سعی کنید قبل از اینکه کسی برای هر چیزی پاسخگو باشد، پرونده را کنار بگذارید. اوایل این ماه، قاضی در مورد این درخواست تصمیم گرفت و تیترها گفتند که او کت و شلوار ما را پرت کرد. او انجام نداد. این چیزی است که در واقع اتفاق افتاده است. متا موشن هرگز ادعا نکرد که مجوز دارد. هرگز ادعا نکرد که از آهنگ ها استفاده نمی کند.       const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);

      if (readArticles.has(hash)) {

        readArticles.add(hash);

      renderNews();

      const filtered = rawItems.filter(item => {

        const q = searchQuery.toLowerCase();

          unreadList.push(item);
        }
      });

        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
