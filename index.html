      flex-wrap: wrap;
      gap: 8px;

      flex-wrap: wrap;
      gap: 8px;

    .news-source {

      display: inline-flex;
      align-items: center;
      gap: 4px;

      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;

      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;

      color: #0f172a;
      transform: translateY(-1px);

    .footer-actions-right {

      align-items: center;
    }

      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;

    .modal-overlay.active {
      display: flex;

      align-items: center;

ng Face attack and about 80 other incidents in which the company lost control of its AI. The lawsuit was filed under the state's public nuisance and unfair competition laws. The July 2026 hack of Hugging Face and other attacks carried out by OpenAI's autonomous agents \"may just be the tip of the iceberg,\" said a lawsuit filed in a state court by California Attorney General Rob Bonta. \"OpenAI recently admitted to the Attorney General’s Office that it has lost control of its autonomous AI agents over 80 times during testing.\" OpenAI had publicly reported only 27 such incidents, showing that \"OpenAI’s public reports do not represent the full scope of loss-of-control incidents involving OpenAI’s models that have impacted third parties,\" the lawsuit said. OpenAI \"knowingly tested a dangerous product without proper oversight or safety procedures and misled the public about it,\" Bonta said in a press release . Read full article Comments", "date_str": "2026-11-17T18:13:34+00:00", "hash": "ab87df23dbe31780", "title_fa": "کالیفرنیا پس از اعتراف به 80 مورد از دست دادن کنترل، از OpenAI شکایت کرد", "summary_fa": "کالیفرنیا روز گذشته از OpenAI شکایت کرد و مدعی شد که تلاش کرده است از مسئولیت حمله Hugging Face و حدود 80 حادثه دیگر که در آن شرکت کنترل هوش مصنوعی خود را از دست داد فرار کند. این شکایت بر اساس مزاحمت عمومی و قوانین رقابت ناعادلانه ایالت مطرح شد. در دادخواستی که توسط راب بونتا، دادستان کل کالیفرنیا در دادگاه ایالتی ارائه شده، آمده است که هک Hugging Face در جولای 2026 و سایر حملاتی که توسط عوامل مستقل OpenAI انجام شد \"ممکن است فقط نوک کوه یخ باشد\". OpenAI اخیراً به دفتر دادستان کل اعتراف کرده است که بیش از 80 بار در طول آزمایش کنترل خود را بر عوامل هوش مصنوعی خود از دست داده است. OpenAI تنها 27 مورد از این قبیل را به صورت علنی گزارش کرده بود، که نشان می‌دهد «گزارش‌های عمومی OpenAI دامنه کامل حوادث از دست دادن کنترل مربوط به مدل‌های OpenAI که بر اشخاص ثالث تأثیر گذاشته است را نشان نمی‌دهد». Bonta در یک بیانیه مطبوعاتی گفت: OpenAI \"آگاهانه یک محصول خطرناک را بدو       media: [{"source": "Billboard", "title": "Ashley Gorley, Matthew West, Wynonna, Josiah Queen Lead ASCAP Nashville Music Awards Winners", "link": "https://www.billboard.com/music/awards/ascap-nashville-music-awards-winners-2026-ashley-gorely-1236383814/", "summary": "ASCAP celebrated the songwriters and music publishers behind many of the year s top country and Christian songs, with a ceremony held at Nashville s The Twelve Thirty Club in Nashville on Monday (Nov. 16). Evan Bartels opened the show with a rendition of In the Middle of It All. ASCAP president/chairman Paul Williams, CEO Elizabeth Matthews and other ASCAP staffers announced honorees and presented winners with commemorative plaques honoring their top-performing songs over the past year. ASCAP s country song of the year went to Just In Case, cowritten by ASCAP writer Jacob JKash Hindlin and recorded by Morgan Wallen. Ashley Gorley picked up his 13th ASCAP country songwriter of the year honor. Taking the stage, Gorley reflected on the win and his years of making a living by writing songs. He said he was super grateful to have done this at this level for this long, noting that one thing that hasn t changed is love for the music. Gorley added: I m so thankful to ASCAP for recognizing me for so many years. Sony Music Publishing was named ASCAP s country publisher of the year for songs including Bottle Rockets, Be Her, Better Me for You (Brown Eyes), Somewhere Over Laredo and Til The Last One Dies. Sony Music Publishing Nashville leader Rusty Gaston praised Sony staffers who support songwriters every day. And to the songwriters gathered there, Gaston encouraged, You have the power to make magic. It is the biggest honor to get to champion your songs every day, because your songs matter. Capitol CMG Publishing was named Christian music publisher of the year for publishing songs including Heaven on My Mind, Still, Can t Steal My Joy and Demons. The honor for ASCAP Christian song of the year went to Your Way s Better recorded by Forrest Frank and cowritten by ASCAP writer Pera Krstajic. Matthew West earned his seventh ASCAP Christian songwriter of the year, for his work in writing songs including No Fear and God Story. Josiah Queen was honored with the ASCAP Christian songwriter-artist of the year accolade for his hits Can t Steal My Joy, Demons and Dusty Bibles. Other artists in attendance and picking up wins included Kelsea Ballerini, Shaboozey and George Birge. In closing out the evening, Wynonna Judd received the Golden Note award. Ballerini presented the accolade to Judd, and praised her strength, creativity and vulnerability. In accepting the honor, Judd said, Music has saved my life more times than I can count. She told the songwriters gathered, To this day, ", "date_str": "2026-11-17T18:50:17+00:00", "hash": "fd4ae4056e8e44e2", "title_fa": "اشلی گورلی، متیو وست، وینونا، جوزیا کوئین برندگان جوایز موسیقی ASCAP نشویل", "summary_fa": "ASCAP با برگزاری مراسمی در روز دوشنبه (16 نوامبر) در نشویل کلوب The Twelve Thirty در نشویل، از ترانه سرایان و ناشران موسیقی پشت بسیاری از آهنگ های برتر کشور و مسیحی سال تجلیل کرد. ایوان بارتلز نمایش را با اجرای In the Middle of It All افتتاح کرد. پل ویلیامز، رئیس/رئیس ASCAP، الیزابت متیوز، مدیر عامل و سایر کارکنان ASCAP، برندگان را اعلام کردند و به برندگان لوح های یادبودی اهدا کردند تا از آهنگ های برتر خود در سال گذشته تقدیر کنند. آهنگ کانتری سال ASCAP به Just In Case، توسط نویسنده ASCAP، Jacob JKash Hindlin و ضبط شده توسط Morgan Wallen، تعلق گرفت. اشلی گورلی سیزدهمین ترانه سرای کانتری سال خود را در ASCAP انتخاب کرد. گورلی با حضور در صحنه، به پیروزی و سال‌های زندگی‌اش با نوشتن آهنگ‌ها فکر کرد. او گفت که بسیار سپاسگزار است که این کار را برای مدت طولانی در این سطح انجام داده است، و خاطرنشان کرد که چیزی که تغییر نکرده است عشق به موسیقی است. گورلی افزود: من از ASCAP برای شناسایی من برای این همه سال سپاسگزارم. انتشارات موسیقی سونی برای آهنگ‌هایی از جمله Bottle Rockets، Be Her، Better Me for You (Brown Eyes)، Somewhere Over Laredo و Til The Last One Dies به عنوان ناشر سال ASCAP انتخاب شد. رستی گاستون، رهبر انتشارات موسیقی سونی نشویل، کارکنان سونی را که هر روز از ترانه سراها حمایت می کنند، تمجید کرد. و به ترانه سرایانی که در آنجا جمع شده بودند، گاستون تشویق کرد، تو قدرت ساختن جادو را داری. این بزرگترین افتخار است که هر روز آهنگ های خود را قهرمان کنید، زیرا آهنگ های شما مهم هستند. انتشارات Capitol CMG به دلیل انتشار آهنگ هایی از جمله Heaven on My Mind، Still، Can t Steal My Joy و Demons به عنوان ناشر موسیقی مسیحی سال انتخاب", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/ASCAP26NicoleAshleyPaul-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۲:۲۰"}, {"source": "Billboard", "title": "The Game Torches the Grammys After His Album ‘The Documentary III’ Gets Zero Nominations: ‘This Is Completely Hilarious’", "link": "https://www.billboard.com/music/rb-hip-hop/the-game-slams-grammys-the-documentary-iii-shut-out-1236384103/", "summary": "The Game was surprised to walk away with zero nominations from the Recording Academy after his August album, The Documentary III , was shut out at the 2027 Grammy nominations , which were revealed Monday (Nov. 16). Related Wale on Triumphant Pair of 2027 Grammy Nominations for Everything Is a Lot : I Hope It Teaches a Lot of People About Resilience Busta Rhymes Toasts to His Pair of 2027 Grammy Award Nominations: I m in My Crib Running Around Right Now, Drinking Grey Goose Grammy Nominations 2027: See the Complete List The West Coast rapper headed to Instagram and unleashed a fiery rant, aiming at the academy and the Grammys in general as it pertains to its relationship with hip-hop. So, The Documentary III was not nominated for album of the year, he began of his project, which reached No. 68 on the Billboard 200 . I been knew this s t was weird since I entered the industry in 2005 . But this is completely hilarious. Game continued to show love to the artists who were nominated for best rap album: Congrats to the homies in here who truly deserve the nod for putting out amazing albums… @Wale@dontoliver@rapsody n my brother @Ye n no shade to the big dawgs in there with em. Congrats as well… But n a if yall don’t cut the s t !!! Anybody who actually listened to my album knows wtf it is how amazing of a project it is. The How We Do rapper claimed that for newer artists to get Grammys love, they essentially have to sell out, and when he chose to be an outspoken rebel in 2006, the accolades he felt he deserved never ended up coming his way. To all new artists: this s t goes one of three ways, Game added. Completely sell your soul for the accolades… conform to industry standards kiss a and attend every single baby blood drinking gala they invite you to…. Or play nice, keep quiet, drink beet juice walk around bare foot staring at the sky all day. (Iykyk). Game went on: The day I chose to go against the grain in 2006 is the day I was made to be the black sheep in this industry. I challenged the machine. Billboard has reached out to the Recording Academy for comment. Charlamagne Tha God opposed Game s diatribe against the Grammys during Tuesday s (Nov. 17) airing of The Breakfast Club . I don t like that, though. Just because you didn t get nominated don t make it seem like everyone else is doing nefarious things to get nominated, he said while pointing to the likes of Killer Mike and The Clipse winning Grammy Awards in the past. The 46-year-old rapper has received ", "date_str": "2026-11-17T18:44:33+00:00", "hash": "06476c4111114341", "title_fa": "بازی پس از اینکه آلبومش «The Documentary III» نامزدی صفر دریافت کرد، گرمی را مشعل می کند: «این کاملا خنده دار است»", "summary_fa": "پس از اینکه آلبوم اوت او، The Documentary III، در نامزدی گرمی 2027 که دوشنبه (16 نوامبر) فاش شد، بسته شد، The Game با عدم نامزدی از آکادمی ضبط غافلگیر شد. ویل مرتبط در مورد نامزدی جایزه گرمی 2027 برای جفت پیروز برای همه چیز زیاد است: امیدوارم به افراد زیادی درباره انعطاف‌پذیری بیاموزد. خواننده رپ ساحلی به اینستاگرام رفت و با هدف قرار دادن آکادمی و به طور کلی جایزه گرمی به دلیل ارتباط آن با هیپ هاپ، شعارهای آتشینی به راه انداخت. بنابراین، The Documentary III نامزد آلبوم سال نشد، او پروژه خود را آغاز کرد که به شماره 68 بیلبورد 200 رسید. از زمانی که در سال 2005 وارد این صنعت شدم، می دانستم این موضوع عجیب است. اما این کاملاً خنده دار است. بازی همچنان عشق خود را به هنرمندانی که نامزد بهترین آلبوم رپ شده بودند نشان می‌داد: تبریک می‌گویم به دوستانی که در اینجا هستند که واقعاً به خاطر انتشار آلبوم‌های شگفت‌انگیز سزاوار تقدیر هستند… @Wale@dontoliver@rapsody n برادرم @Ye n هیچ سایه‌ای برای دم‌های بزرگ در آنجا با او نیست. همچنین تبریک می گویم ... اما اگر s t را قطع نکنید!!! هر کسی که واقعاً به آلبوم من گوش داده می داند که چقدر پروژه شگفت انگیز است. خواننده رپ How We Do ادعا کرد که برای اینکه هنرمندان جدیدتر عشق گرمی را بدست آورند، اساساً باید به فروش برسند، و هنگامی که او تصمیم گرفت در سال 2006 یک شورشی صریح باشد، تمجیدهایی که احساس می کرد لیاقتش را داشت هرگز به دست او نرسید. به همه هنرمندان جدید: این بازی به یکی از سه راه می رود. روح خود را به طور کامل برای تمجیدها بفروشید... مطابق با استانداردهای صنعت، ببوسید و در هر جشن نوشیدن خون نوزادی که شما را به آن دعوت می کنند شرکت کنید. یا خوب بازی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/the-game-nfl-2026-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۲:۱۴"}, {"source": "Billboard", "title": "Ayumu Imazu Talks ‘musubi’ & The Belief that Music ‘Brings People Together’: Billboard Japan Monthly Interview", "link": "https://www.billboard.com/music/music-news/ayumu-imazu-musubi-billboard-japan-monthly-interview-1236384192/", "summary": "Singer/songwriter Ayumu Imazu spoke to Billboard Japan for its Monthly Feature interview series spotlighting artists and releases on its radar. Imazu s latest single “musubi,” released digitally on Oct. 2, has become the biggest hit of his career. “musubi” is a love song portraying the bonds between people through the motif of the “red string of fate.” A demo posted to TikTok in late August, when only a single verse and chorus existed, spread widely and led to an “emergency release.” The track swept the charts across streaming services immediately after it dropped and earned the ​26-year-old artist his first-ever No. 1 on Billboard Japan’s Streaming Songs chart (dated Oct. 14, 2026), marking the biggest breakthrough of his career to date. 2026 has also been a milestone year for him — it marks the fifth anniversary of his major-label debut, he announced a partnership with SKY-HI-led BMSG in February, and in May he released CLASSIC , his first album in four years. Next up, on Jan. 31, 2027, he’ll play his first-ever headlining show at Nippon Budokan, a venue he has long named as a goal. After pouring all of himself into CLASSIC , “musubi” emerged as Imazu circled back to the foundation of his music, which is about “bringing people together.” He chatted with Billboard Japan about the making of the song, the inspiration he’s drawn from his new environment at BMSG, and what he envisions for the Budokan and beyond. “musubi” has been generating a huge response. When did you start working on it? Around two months ago, in mid-August. I finished the first verse and chorus at the end of August and posted it on TikTok maybe two days after that. The title is symbolic. “musubi” is a love song about the bonds that tie people together. Where did the idea come from? In May​,​ I released CLASSIC , my first album in four years, and most of it was new songs I co-wrote with overseas producers. I put so much into making it that I felt pretty empty in a way afterward. I was gradually taking things in and building my energy back up while touring, and as I considered what to make next, I vaguely thought it d be nice to do something about bringing people together, because I feel that s the biggest purpose of making music. I started making it with that as the big goal. Bringing people together through music — is that one of the motivations you’ve always held onto? Maybe not always, but with the way the times are going… right now I feel like everyone’s own worlds of the things they l", "date_str": "2026-11-17T18:29:47+00:00", "hash": "f207a1192a0fbf68", "title_fa": "آیومو ایمازو با «موسوبی» و اعتقاد به اینکه موسیقی «مردم را به هم نزدیک می‌کند» صحبت می‌کند: مصاحبه ماهانه بیلبورد ژاپن", "summary_fa": "آیومو ایمازو خواننده/ترانه‌سرا برای مجموعه مصاحبه‌های ویژه ماهانه بیلبورد ژاپن که هنرمندان را به تصویر می‌کشد و در رادار آن منتشر می‌شود، صحبت کرد. آخرین تک آهنگ ایمازو \"musubi\" که به صورت دیجیتالی در 2 اکتبر منتشر شد، به بزرگترین موفقیت حرفه ای او تبدیل شده است. «موسوبی» یک آهنگ عاشقانه است که پیوندهای بین مردم را از طریق موتیف «رشته قرمز سرنوشت» به تصویر می‌کشد. دمویی که در اواخر آگوست در TikTok ارسال شد، زمانی که تنها یک آیه و گروه کر وجود داشت، به طور گسترده پخش شد و منجر به \"آزادی اضطراری\" شد. این آهنگ بلافاصله پس از افت، نمودارها را در بین سرویس‌های پخش جابجا کرد و این هنرمند 26 ساله را برای اولین بار در جدول آهنگ‌های جریان بیلبورد ژاپن (به تاریخ 14 اکتبر 2026) رتبه اول را به خود اختصاص داد که بزرگترین پیشرفت حرفه‌ای او تا به امروز است. سال 2026 نیز برای او سال مهمی بوده است - پنجمین سالگرد اولین حضورش در برند اصلی است، او در فوریه اعلام کرد با BMSG به رهبری SKY-HI همکاری می‌کند و در ماه مه CLASSIC، اولین آلبوم خود را در چهار سال اخیر منتشر کرد. در مرحله بعدی، در 31 ژانویه 2027، او اولین نمایش تیتر خود را در نیپون بودوکان، مکانی که مدت‌ها به عنوان هدف نامیده می‌شود، اجرا خواهد کرد. پس از ریختن تمام وجود خود در کلاسیک، \"موسوبی\" ظاهر شد، زمانی که ایمازو به پایه موسیقی خود، که درباره \"گردهم آوردن مردم\" است، بازگشت. او با بیلبورد ژاپن درباره ساخت این آهنگ، الهاماتی که از محیط جدیدش در BMSG گرفته است، و آنچه برای بودوکان و فراتر از آن تصور می‌کند صحبت کرد. \"musubi\" واکنش زیادی را ایجاد کرده است. از چه زمانی کار روی آن را شروع کردید؟ حدود دو ماه پیش، در اواسط مرداد. من اولین آیه و گروه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Ayumu-Imazu.jpg?w=1024", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۲۱:۵۹"}, {"source": "Billboard", "title": "Ryo Asai’s ‘In the Megachurch’ Sweeps 3 Charts on Inaugural Billboard Japan Book Charts Year-End Lists", "link": "https://www.billboard.com/music/chart-beat/ryo-asai-in-the-megachurch-japan-book-year-end-charts-1236384187/", "summary": "Billboard Japan announced the winning titles and authors of the first annual Billboard Japan Book Charts, its comprehensive book charts, at the year-end awards ceremony held Saturday (Nov. 14). The tracking period for the year ran from Oct. 27, 2025, to Oct. 25, 2026, with the exception of the Hot Shot Books chart, which ranks surging titles, tracked from Nov. 24, 2025, to Oct. 25, 2026. The ceremony was one of the programs at BOOK MEETS NEXT 2026 s special event exploring the possibilities of an award showcasing the appeal of Japanese books to a wider global readership. BOOK MEETS NEXT is the autumn reading promotion month organized by the Japan Publishing Industry Foundation for Culture (JPIC). Ryo Asai s In The Megachurch was No. 1 for the year on the all-genre Japan Book Hot 100 list. By metric, it placed No. 1 in social media, No. 7 in subscriptions and No. 13 in brick-and-mortar sales. The novel earned its most points in April, the month it won the 2026 Hon ya Taisho (Japan Booksellers Award). Its points also rose during the year-end and New Year holidays, Golden Week and Silver Week, when demand for reading is high. “I’m very grateful this book chart exists, because it adds one more way for books to reach the world,” Asai said. “From that point of view, it’s probably not a great thing for the world at large that the Japan Booksellers’ Award winner and the No. 1 book on this chart are the same title. But for me personally, it means a lot, and I’m really, really happy.” Yuu Nagira s Nanji, Hoshi no Gotoku came in at No. 2, followed by Mina Miyajima’s Naruse wa Tenka wo Tori ni Iku at No. 3, Eiichiro Oda’s ONE PIECE Vol. 113 at No. 4 and Asako Yuzuki’s BUTTER at No. 5. In The Megachurch also topped the Hot Bungei Books literary fiction genre chart, and the Reiwa Books era chart that groups titles by the year their first edition was published, for a total of three No. 1s. Among the other genre charts, ONE PIECE Vol. 113 led the Hot Manga chart for the year. Ryo@Ribe Daigaku Gakucho’s Honto no Jiyu wo Te ni Ireru Okane no Daigaku topped the Hot Economy Books business chart, and Fuma Kikuchi 1st Photobook “Latido” led the Hot Culture Books chart. On the era charts, Yukito Ayatsuji’s Jukkakukan no Satsujin took No. 1 on the Showa Books chart, while Asako Yuzuki’s BUTTER topped the Heisei Books chart. Jujutsu Kaisen ≡ ( Jujutsu Kaisen Modulo ) Vol. 1 by Gege Akutami and Yuji Iwasaki was No. 1 for the year on the Hot Shot Books chart, which picks out books w", "date_str": "2026-11-17T18:26:53+00:00", "hash": "b5059d24e52bc9fe", "title_fa": "«In the Megachurch» ریو آسای 3 نمودار را در فهرست کتاب‌های بیلبورد ژاپن در فهرست پایان سال قرار داد.", "summary_fa": "بیلبورد ژاپن عناوین و نویسندگان برنده اولین نمودار سالانه کتاب بیلبورد ژاپن، نمودارهای کتاب جامع خود را در مراسم اعطای جوایز پایان سال که شنبه (14 نوامبر) برگزار شد، اعلام کرد. دوره پیگیری برای سال از 27 اکتبر 2025 تا 25 اکتبر 2026، به استثنای نمودار Hot Shot Books، که عناوین فزاینده را رتبه بندی می کند، از 24 نوامبر 2025 تا 25 اکتبر 2026 دنبال می شود. این مراسم یکی از برنامه‌های رویداد ویژه BOOK MEETS NEXT 2026 بود که امکان‌های جایزه‌ای را برای نمایش جذابیت کتاب‌های ژاپنی برای خوانندگان گسترده‌تر جهانی بررسی می‌کرد. BOOK MEETS NEXT ماه ترویج کتابخوانی پاییزی است که توسط بنیاد فرهنگی صنعت انتشارات ژاپن (JPIC) برگزار می شود. کتاب Ryo Asai In The Megachurch در فهرست ۱۰۰ کتاب داغ ژاپن، شماره ۱ سال بود. از نظر متریک، رتبه 1 در رسانه های اجتماعی، شماره 7 در اشتراک و شماره شماره 1 را به خود اختصاص داد. 13 در فروش آجر و ملات. این رمان بیشترین امتیاز خود را در آوریل به دست آورد، ماهی که برنده جایزه Hon ya Taisho (جایزه کتابفروشان ژاپن) 2026 شد. امتیاز آن نیز در تعطیلات پایان سال و سال نو، هفته طلایی و هفته نقره ای که تقاضا برای مطالعه زیاد است، افزایش یافت. آسایی گفت: «از وجود این نمودار کتاب بسیار سپاسگزارم، زیرا راه دیگری برای دسترسی کتاب‌ها به جهان می‌افزاید. از این منظر، این که برنده جایزه کتابفروشان ژاپن و کتاب شماره 1 در این نمودار یک عنوان هستند، احتمالاً برای جهان در کل چیز خوبی نیست. اما برای من شخصاً این معنی بسیار زیادی دارد و من واقعاً بسیار خوشحالم.» نانجی یو ناگیرا، هوشی نو گوتوکو در رتبه دوم قرار گرفت و پس از آن ناروسه وا تنکا و توری نی ایکو از مینا میاجیما در شماره 3، ONE PIECE Vol Eiichiro Oda قرار گرفت. 113", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Ryo-Asai-BBJ-Book-Chart.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۶ آبان • ۲۱:۵۶"}, {"source": "Billboard", "title": "How Each Music Listening Platform Is Treating AI Music (Updating)", "link": "https://www.billboard.com/lists/how-each-music-listening-platform-treats-ai-music/", "summary": "One of the most pressing questions in the music industry right now is how streaming services should be treating the deluge of AI-generated music on their platforms. Should AI music be demonetized, or even removed from platforms? Should it be labeled or flagged so that users know what they are listening to? Or, for those optimistic about AI’s creative possibilities, should it all just be left alone? It’s hard to know the exact scale of AI music on streaming services today, but what is clear is that there’s a lot of it — and the amount of it is growing fast. Deezer reports the count of daily AI track uploads at over 50% at “peak level” in June 2026, and Apple Music told Billboard in April that “more than a third” of monthly uploads were 100% AI-generated. Qobuz also noted in January that 34% of new uploads each day are AI-generated. These metrics, however, may still represent an undercount of all the material that uses AI in some part of the creative process, given partially AI generated music is much more challenging to detect. Plus, it’s impossible to determine when AI is used to write lyrics or melodies that are then recorded by human musicians, unless a user offered up their prompting history. Related The Recorded Music Industry Wants Labels on AI Music. How Could That Work? (FAQ) Kristin Robinson When considering the challenges of actually implementing regulations on streaming services, the question of what to do about AI music becomes incredibly complex. There’s a risk of false positives with AI detection tools, but requiring self-disclosure from rights holders will likely lead to outright deception at worst, or innocent omission at best, given how prevalent AI elements can be at any point in the recording process. Still, lines are being drawn, and until some sort of consensus emerges, those lines are different at different digital service providers. To learn more about what each music listening platform is doing about AI-generated music, Billboard has compiled an updating list of each services’ policies as they articulate them.", "date_str": "2026-11-17T18:11:00+00:00", "hash": "a927a001b08c321a", "title_fa": "هر پلتفرم گوش دادن به موسیقی چگونه با موسیقی هوش مصنوعی برخورد می کند (به روز رسانی)", "summary_fa": "یکی از مبرم‌ترین سؤالات در صنعت موسیقی در حال حاضر این است که سرویس‌های استریم چگونه باید سیل موسیقی تولید شده توسط هوش مصنوعی را روی پلتفرم‌های خود درمان کنند. آیا موسیقی هوش مصنوعی باید از پول خارج شود یا حتی از پلتفرم ها حذف شود؟ آیا باید برچسب یا پرچم گذاری شود تا کاربران بدانند به چه چیزی گوش می دهند؟ یا برای کسانی که به امکانات خلاقانه هوش مصنوعی خوشبین هستند، آیا باید همه اینها را به حال خود رها کرد؟ امروزه دانستن مقیاس دقیق موسیقی هوش مصنوعی در سرویس‌های استریم سخت است، اما آنچه واضح است این است که تعداد زیادی از آن وجود دارد – و مقدار آن به سرعت در حال رشد است. Deezer تعداد آپلودهای روزانه آهنگ های هوش مصنوعی را در ژوئن 2026 در \"سطح اوج\" بیش از 50٪ گزارش می دهد و Apple Music در آوریل به بیلبورد گفت \"بیش از یک سوم\" آپلودهای ماهانه 100٪ توسط هوش مصنوعی ایجاد شده است. Qobuz همچنین در ژانویه اشاره کرد که 34 درصد از آپلودهای جدید هر روز توسط هوش مصنوعی ایجاد می شود. با این حال، این معیارها هنوز هم ممکن است نشان دهنده تعداد کمتری از تمام موادی باشد که از هوش مصنوعی در بخشی از فرآیند خلاقانه استفاده می‌کنند، با توجه به اینکه شناسایی موسیقی‌های تولید شده با هوش مصنوعی بسیار چالش‌برانگیزتر است. بعلاوه، تعیین اینکه چه زمانی از هوش مصنوعی برای نوشتن اشعار یا ملودی‌هایی استفاده می‌شود که توسط نوازندگان انسانی ضبط می‌شوند، غیرممکن است، مگر اینکه کاربر تاریخچه پیشنهادی خود را ارائه دهد. مرتبط: صنعت موسیقی ضبط شده برچسب هایی را در موسیقی هوش مصنوعی می خواهد. چگونه می تواند کار کند؟ (سؤالات متداول) کریستین رابینسون وقتی چالش‌های اجرای واقعی مقررات در سرویس‌های استریم را در نظر می‌گیریم، این سوال که در مورد موسیقی هوش مصنوعی چه باید کرد،", "image_url": "https://www.billboard.com/wp-content/uploads/2024/09/phone-music-ai-2024-billboard-1548.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple", "موسیقی"], "datetime_fa": "۲۶ آبان • ۲۱:۴۱"}, {"source": "Deadline", "title": "SAG-AFTRA Reaches New Tentative Contract With Netflix", "link": "https://deadline.com/2026/11/sag-aftra-new-tentative-contract-netflix-1237226841/", "summary": "SAG-AFTRA has tentatively re-upped its solo contract with Netflix. The guild revealed Tuesday that a tentative agreement had been reached on a new bargaining agreement, which is now subject to approval by the national board. That vote is expected in the near future, per the union, and no details from the deal are expected in [ ]", "date_str": "2026-11-17T18:44:59+00:00", "hash": "e3c5788eba04b46b", "title_fa": "SAG-AFTRA به قرارداد آزمایشی جدید با نتفلیکس رسید", "summary_fa": "SAG-AFTRA به طور آزمایشی قرارداد انفرادی خود را با نتفلیکس بازسازی کرده است. این صنف روز سه شنبه فاش کرد که یک توافق آزمایشی در مورد یک توافق نامه جدید انجام شده است که اکنون منوط به تایید هیئت ملی است. این رای در آینده نزدیک، طبق اتحادیه، انتظار می‌رود، و هیچ جزئیاتی از این معامله در [ ] انتظار نمی‌رود. پیش از آن، غول استریم به صورت تولید به تولید با این صنف برخورد می کرد. مقامات صنفی در آن زمان گفتند که، به استثنای معدود موارد، شرایط قرارداد از توافقنامه پایه مدون و موافقت نامه های تلویزیونی صنف پیروی می کند. توافقنامه نتفلیکس برای تولیدات فیلمنامه، اپیزودیک دراماتیک و بلند ساخته شده توسط Netflix Studios LLC اعمال می شود. در آخرین مهلت تماشا کنید هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید.", "image_url": "https://deadline.com/wp-content/uploads/2025/03/Katie-Campione-.jpg?w=193&#038;h=193&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۲۶ آبان • ۲۲:۱۴"}, {"source": "Deadline", "title": "Broadway’s Seaview Taps New York-Based Exec & Former Clinton Non-Prof Advisor Justin Klein As COO; Ups Anna Mack Pardee", "link": "https://deadline.com/2026/11/seaview-justin-klein-anna-mack-pardee-broadway-1237226711/", "summary": "EXCLUSIVE: Seaview, the Tony-, Olivier- and Peabody Award winning production company has tapped Justin Klein, a New York-based executive and former advisor to Hillary Rodham Clinton and her nonprofit organization Onward Together, as its new Chief Operating Officer, with senior Seaview producer Anna Mack Pardee named to the newly created role of Head of Theater. [ ]", "date_str": "2026-11-17T18:44:31+00:00", "hash": "251790065882f139", "title_fa": "مدیر اجرایی مستقر در نیویورک و جاستین کلاین مشاور غیر استاد پیشین کلینتون به عنوان مدیر ارشد اجرایی برادوی سی ویو تپز. آپس آنا مک پاردی", "summary_fa": "انحصاری: Seaview، شرکت سازنده برنده جایزه Tony، Olivier و Peabody، جاستین کلاین، مدیر اجرایی مقیم نیویورک و مشاور سابق هیلاری رادهام کلینتون و سازمان غیرانتفاعی او Onward Together را به عنوان مدیر عامل جدید خود انتخاب کرده است، و تهیه کننده ارشد Seaview، آنا مک هیدری را به عنوان جدیداً نقش هیدری ایجاد کرده است. [ ] انحصاری: Seaview، شرکت سازنده برنده جایزه Tony، Olivier و Peabody، جاستین کلاین، مدیر اجرایی مستقر در نیویورک و مشاور سابق هیلاری رادهام کلینتون و سازمان غیرانتفاعی او Onward Together را به عنوان مدیر عملیاتی جدید خود انتخاب کرده است. این تغییرات زمانی رخ می دهد که شرکت بر توسعه زیرساخت های فاز بعدی توسعه چندرسانه ای خود تمرکز دارد. به عنوان رئیس تئاتر، پاردی بزرگترین بخش شرکت را رهبری خواهد کرد، با ترکیبی از شرکت در فصل برادوی که شامل Lost Lear با بازی جسیکا چستین، سریال فعلی I t's a Wonderful Life: A Live Radio Play و احیای Spring Awakening در خارج از برادوی در استودیو Seaview است. در بیانیه‌ای، گرگ نوبیل، بنیان‌گذار و مدیرعامل Seaview گفت: «ما بسیار هیجان‌زده هستیم که از جاستین به Seaview به عنوان مدیر عملیاتی خود استقبال می‌کنیم. همانطور که در تئاتر، سینما و تلویزیون رشد می کنیم، قصد داریم تیمی با زیرساخت برای انجام کارهای بزرگتر و جسورانه بسازیم. جاستین کار خود را صرف تبدیل ایده های بزرگ به سازمان های خوب در رسانه ها و سیاست کرده است و او کسی است که مطمئن می شود عملیات ما می تواند با جاه طلبی های ما مطابقت داشته باشد. در ددلاین تماشا کنید", "image_url": "https://deadline.com/wp-content/uploads/2026/11/AMP_JK_Emilio-Madrid-e1794937917851.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۶ آبان • ۲۲:۱۴"}, {"source": "Deadline", "title": "Fremantle U.S. COO Suzanne Lopez Exiting After Over 20 Years", "link": "https://deadline.com/2026/11/fremantle-us-coo-suzanne-lopez-exiting-1237226765/", "summary": "EXCLUSIVE: Suzanne Lopez, who has been with American Idol producer Fremantle for nearly 23 years, is exiting the company. Lopez has most recently been Chief Operating Officer for Fremantle’s North American operation, a role that she was promoted to in 2019. In that position, she oversaw legal and business affairs, HR, production, technology and security. [ ]", "date_str": "2026-11-17T18:38:34+00:00", "hash": "93f8a111cc4fb43d", "title_fa": "«سوزان لوپز» مدیر ارشد اجرایی Fremantle ایالات متحده پس از بیش از 20 سال کنار می رود", "summary_fa": "اختصاصی: سوزان لوپز، که نزدیک به 23 سال با Fremantle تهیه کننده امریکن آیدل بوده است، از این شرکت خارج می شود. لوپز اخیراً مدیر عملیاتی عملیات Fremantle در آمریکای شمالی بوده است، نقشی که در سال 2019 به آن ارتقا یافت. در آن سمت، او بر امور حقوقی و تجاری، منابع انسانی، تولید، فناوری و امنیت نظارت داشت. [ ] انحصاری: سوزان لوپز، که نزدیک به 23 سال با Fremantle تهیه کننده امریکن آیدل بوده است، از شرکت خارج می شود. قبل از آن، او EVP، تجارت و امور حقوقی بود. جنیفر مولین، مدیر عامل شرکت فرمنتل، گفت: «سوزان در 22 سال فعالیت خود در این کسب و کار، سهمی استثنایی در شرکت Fremantle آمریکای شمالی داشته است. او نقش مهمی در موفقیت و رشد فریمانتل داشته است و ما از رهبری، تعهد و تأثیر قابل توجهی که او داشته است سپاسگزاریم. سازمان دیده بان خروج ددلاین لوپز پس از آن صورت می گیرد که شارون لوی، رئیس سابق Endemol Shine آمریکای شمالی، به عنوان مدیر عامل شرکت، Fremantle Americas و استرالیا استخدام شد و به Mullin گزارش می داد. لوی که پیش از این شرکت را پشت سر Fax's MasterChef و Fear Factor: House of Fear اداره می‌کرد، بر نمایش‌هایی مانند American Idol و America's Got Talent نظارت خواهد کرد و نقش خود را در اجرای عملیات تولید این شرکت در سراسر ایالات متحده، مکزیک و استرالیا بر عهده خواهد داشت. او در ژانویه شروع می کند. لوپز از مارس 2004 با Fremantle بوده است. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه دارید. نظرات در مورد Deadline هالیوود نظارت می شود. بنابراین از موضوع خارج نشوید، جعل هویت کسی نباشید و حقایق خود را اشتباه نگیرید.", "image_url": "https://deadline.com/wp-content/uploads/2019/01/suzanne-lopez.jpg?w=900", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۲۶ آبان • ۲۲:۰۸"}, {"source": "Deadline", "title": "Jena Malone, Suzanna Son & Sofia Mortera Wrap On Indie ‘Kismet’ From Giovanna Molina", "link": "https://deadline.com/2026/11/jena-malone-suzanna-son-to-star-kismet-1237226780/", "summary": "EXCLUSIVE: Jena Malone (The Boroughs) and Suzanna Son (Monster: The Ed Gein Story) have wrapped roles opposite newcomer Sofia Mortera in Kismet,     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
