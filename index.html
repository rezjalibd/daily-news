      media: [{"source": "Billboard", "title": "Chart Rewind: In 2006, Tracy Lawrence & ‘Friends’ Began Their Ride to No. 1", "link": "https://www.billboard.com/music/chart-beat/tracy-lawrence-find-out-who-your-friends-are-chart-rewind-2006-1236340930/", "summary": "“Time,” Tracy Lawrence contemplated in a No. 1 Hot Country Songs single, “marches on.” After that release rose to the top in 1996, time marched forward for more than a decade before Lawrence reached the summit again. That journey began when “Find Out Who Your Friends Are” debuted at No. 59 on the chart dated Sept. 16, 2006. Related Chart Rewind: In 1992, Tracy Lawrence s Sticks and Stones Skipped to No. 1 Chart Rewind: In 1986, Conway Twitty Turned Desperation Into a Country No. 1 Chart Rewind: In 2016, Jon Pardi’s ‘Boots’ Stepped to No. 1 on Country Airplay The first single on his self-owned Rocky Comfort label, “Friends” was written by Casey Beathard (Kenny Chesney’s “Don’t Blink,” “The Boys of Fall”) and Ed Hill (John Michael Montgomery’s “Be My Baby Tonight,” Luke Bryan’s “Most People are Good”), and produced by Lawrence with Julian King (Tyler Farr, Emerson Drive). “Friends” picked up some famous friends during a slow ride to No. 1. George Jones and his wife, Nancy Jones, joined Darryl Worley and Larry the Cable Guy for cameos in the video; and Chesney and Tim McGraw added their voices to an alternate version that counted toward Lawrence’s total play. Sony BMG warned country stations not to play the collaboration in a June 2007 letter; broadcasters ignored the edict, and Sony BMG sheepishly rescinded it the next day. When the song, still listed as a Lawrence solo effort, reached the top in the June 23, 2007, Billboard issue, it ended the singer’s 11-year dry spell between chart-topping numbers, completing a then-record 41-week climb to the peak. “Friends” received the Country Music Association’s musical event of the year award and the Academy of Country Music’s vocal event trophy. It remains the most recent of Lawrence’s eight career No. 1s.", "date_str": "2026-09-16T14:31:22+00:00", "hash": "952c6303769a2dc4", "title_fa": "نمودار عقب نشینی: در سال 2006، تریسی لارنس و «دوستان» به رتبه 1 رسیدند.", "summary_fa": "تریسی لارنس در آهنگ شماره 1 آهنگ های Hot Country Songs به «زمان» فکر کرد. پس از اینکه این نسخه در سال 1996 به اوج رسید، زمان بیش از یک دهه به جلو رفت تا اینکه لارنس دوباره به قله رسید. این سفر زمانی آغاز شد که «پیدا کن دوستانت چه کسانی هستند» در رتبه 59 جدول مورخ 16 سپتامبر 2006 قرار گرفت. نمودارهای مرتبط به عقب: در سال 1992، چوب ها و سنگ های تریسی لارنس به شماره 1 نمودار برگشت: در سال 1986، Conwaynto a Country Twitpers. 1 نمودار عقب نشینی: در سال 2016، «Boots» جان پردی به رتبه 1 در کانتری ایرپلی رسید اولین تک آهنگ از لیبل خود راکی کامفورت، «Friends» توسط کیسی بیتارد (کنی چسنی «Don’t Blink»، «The Boys of Fall»، «Babys of Fall»، «Johnight My Michael»، «Boys of Fall» از Kenny Chesney، «Johbe My Michael»، «Johnight») نوشته شد. «بیشتر مردم خوب هستند» لوک برایان، و توسط لارنس با جولیان کینگ (تایلر فار، امرسون درایو) تهیه شده است. \"دوستان\" چند دوست معروف را در طی یک سواری آهسته به شماره 1 انتخاب کرد. جورج جونز و همسرش، نانسی جونز، به دریل ورلی و لری مرد کابلی پیوستند تا در این ویدئو نقش آفرینی کنند. و چسنی و تیم مک‌گرو صداهای خود را به نسخه دیگری اضافه کردند که در کل بازی لارنس به حساب می‌آمد. سونی BMG در نامه ای در ژوئن 2007 به ایستگاه های کشور هشدار داد که این همکاری را پخش نکنند. پخش‌کننده‌ها این فرمان را نادیده گرفتند و سونی BMG با خجالت روز بعد آن را لغو کرد. هنگامی که این آهنگ که هنوز به عنوان یک تلاش انفرادی لارنس ذکر شده بود، در شماره بیلبورد در 23 ژوئن 2007 به اوج رسید، به طلسم خشک 11 ساله خواننده بین اعداد صدر جدول پایان داد و رکورد 41 هفته ای را"}, {"source": "Billboard", "title": "Backstreet Boys’ AJ McLean Drops Lusty ‘Into Your Heart’ Solo Single From Upcoming ‘Sex, Love & Music’ LP", "link": "https://www.billboard.com/music/pop/backstreet-boys-aj-mclean-into-your-heart-solo-single-listen-1236341430/", "summary": "Backstreet Boys member AJ McLean knows exactly which way he wants it on his lusty new solo single, Into Your Heart. While the title of the song that dropped on Wednesday morning (Sept. 16) has the kind of romantic vibe the group s longtime fans have come to expect from the boy-to-man band, McLean has some seriously adult considerations on his mind on the hip-hop-inspired tune. You walk in, whole room leaves/ Lip gloss shine, all eyes freeze/ You look once, I lose speech/ My boys laugh, Shoot your shot at least,' he sings over a spare, slinky beat. Heart racing like a spotlight/ Sparking like you know I/ If I get one chance tonight/ I m f king my way into your life. The chorus leaves even less to the imagination, as McLean promises, F k my way into your heart/ Say my name, we gon light this floor apart/ Tell your friends you ain t leaving yet/ Tell your ex you can feel this sweat/ F k my way into your heart. McLean, who goes by his full name as a solo act, Alexander James McLean, is gearing up to release his sophomore solo album on Nov. 27, Sex, Love Music , the follow-up to January s debut solo LP, My Name is Alexander James . The new single was accompanied by a dance-heavy video that pays homage to the classic 1979 gang drama The Warriors , with dance crews dubbed The Baseball Lockers, The AllStar Lizzies, The Lovers and The Hip-Hop Riffs facing off in a choreo battle on a city set at night. “This one just felt good from the second we made it,” said McLean in a statement about the song. “ There’s an energy to ‘Into Your Heart’ that I love. The visual is a total vibe, dance has always been such a huge part of who I am as a performer, I wanted to make a video where I could really lean into that. One of the best parts of this chapter is having the freedom to follow the music wherever it takes me. Right now, this is where I’m at.” After more than three decades with BSB — which also includes Nick Carter, Howie Dorough, Kevin Richardson and Brian Littrell — McLean broke out solo for the first time in November of 2025 with his Hi My Name is Alex EP . McLean will hit the road for his first-ever North American solo tour under his full given name on his The Better Man outing, slated to kick off on Oct. 19 at Brooklyn Bowl in New York and run through a Jan. 15 gig at the Craterian Theater in Medford, Ore. Watch the Into Your Heart video below.", "date_str": "2026-09-16T13:20:34+00:00", "hash": "a7f796c9aeb0b0ad", "title_fa": "AJ McLean از Backstreet Boys تک‌آهنگ Lusty «Into Your Heart» را از آلبوم جدید «Sex, Love & Music» منتشر کرد.", "summary_fa": "ای جی مک‌لین، عضو گروه پسران بک استریت، دقیقاً می‌داند که در تک‌آهنگ انفرادی جدید و جذاب خود، «Into Your Heart» از چه راهی می‌خواهد. در حالی که عنوان آهنگی که صبح چهارشنبه (16 سپتامبر) منتشر شد، حال و هوای عاشقانه‌ای دارد که طرفداران قدیمی گروه از گروه پسر به مرد انتظار داشتند، مک‌لین در مورد آهنگ الهام گرفته از هیپ‌هاپ برخی ملاحظات جدی بزرگسالان را در ذهن خود دارد. تو وارد می شوی، کل اتاق برگ می زند/ براق لب ها می درخشد، همه چشم ها یخ می زنند/ تو یک بار نگاه می کنی، حرفم را از دست می دهی/ پسرانم می خندند، حداقل به گلوله خود شلیک کن. قلب مثل نورافکن می تپد/ جرقه می زنم مثل اینکه می دانی من/ اگر امشب یک فرصت پیدا کنم/ من شاه راه خود را به زندگی شما خواهم رساند. همانطور که مک‌لین قول داده است، گروه کر حتی کمتر به تخیل می‌پردازد. مک‌لین، که نام کامل خود را به عنوان یک بازیگر انفرادی، الکساندر جیمز مک‌لین نامیده می‌شود، آماده می‌شود تا آلبوم انفرادی دوم خود را در 27 نوامبر منتشر کند، Sex, Love Music، دنباله‌ای از اولین LP انفرادی ژانویه، My Name is Alexander James. تک‌آهنگ جدید با یک ویدیوی رقص سنگین همراه بود که ادای احترام به درام دسته‌جمعی کلاسیک The Warriors در سال 1979 است، با گروه‌های رقص به نام‌های The Baseball Lockers، The AllStar Lizzies، The Lovers و The Hip-Hop Riffs که در یک نبرد رقص در شهری که در شب اتفاق می‌افتد، روبرو می‌شوند. مک‌لین در بیانیه‌ای درباره این آهنگ گفت: «این یکی از زمانی که آن را ساختیم احساس خوبی داشت. «در قلب تو انرژی وجود دارد که من آن را دوست دارم. بصری یک حال و هوای کامل است، رقص همیشه بخش بزرگی از شخصیت من به عنوان یک مجری بوده است، من"}, {"source": "Billboard", "title": "Edgar Barrera Leads 2026 Latin Grammy Nominations: Full List", "link": "https://www.billboard.com/lists/latin-grammys-2026-nominations-full-list/", "summary": "Edgar Barrera tops the list of nominees for the 2026 Latin Grammy Awards, announced Wednesday (Sept. 16). The acclaimed Mexican songwriter and producer received 10 nominations, in the general categories of record of the year, album of the year and song of the year mostly for his work on projects by Karol G and Carín León. Three of his nominations are in the best regional song category. He is also competing for the awards of songwriter and producer of the year, which he has won in the past. His 10 new nominations add to the 72 he has received throughout his career, of which he has won 29 so far. CA7RIEL Paco Amoroso, Jorge Drexler, Karol G and Rosalía follow with seven nominations each, while Silvana Estrada and Mon Laferte received six. All of them are vying for album of the year, alongside Anitta, Carín León, Milo J and Rawayana. Most also compete for song and record of the year. At just 19 years old, Argentine singer and rapper Milo J surprises with five nominations, including in the three main categories, with a folk album. Meanwhile, legendary Cuban singer Omara Portuondo earns a new nomination at 95 years old, in the category of best traditional tropical album. I love seeing this flexibility and incredible mobility of our artists, Manuel Abud, CEO of the Latin Recording Academy, tells Billboard Español , also highlighting the nominations of an urban singer like Karol G in a Mexican music category, a flamenco star like Niña Pastori in a tropical music category, and a young Argentine urban artist like Nathy Peluso in a salsa category. Rosalía s uber-eclectic LUX appears in fields including pop, alternative and Portuguese language, besides album of the year. The album of the year category, if you analyze it, is a wonderful list, he adds There’s such a great diversity — not just in genre. Interestingly, it’s half men, half women. But look at how amazing it is: We have Mexico, Argentina, Spain, Colombia, Brazil, Chile and Uruguay — seven countries represented. And that diversity also permeates the song and record categories. Other contenders with multiple nominations include Arath Herce, with four; and BRUSES, Feid, Héctor Mazzarri, Jennifer Mosello and Eden Muñoz with three each. Artists such as Rauw Alejandro, Anitta, Bad Gyal, Beéle, Bizarrap, Ryan Castro, Daddy Yankee, Kany García, Joaquina, Juanes and Carín León, among others, received two nods. The coveted Latin Grammy for best new artist will be between Delilah, Fabian, Loulu Gilberto, Arath Herce, ", "date_str": "2026-09-16T13:18:00+00:00", "hash": "bcf7a995d54881ba", "title_fa": "ادگار باررا پیشتاز نامزدهای گرمی لاتین 2026: فهرست کامل", "summary_fa": "ادگار باررا در صدر فهرست نامزدهای جوایز گرمی لاتین 2026 قرار دارد که چهارشنبه (16 سپتامبر) اعلام شد. ترانه‌سرا و تهیه‌کننده تحسین‌شده مکزیکی 10 نامزدی در بخش‌های عمومی رکورد سال، آلبوم سال و آهنگ سال بیشتر به خاطر کارش روی پروژه‌های کارول جی و کارین لئون دریافت کرد. سه مورد از نامزدهای او در رده بهترین آهنگ منطقه ای هستند. او همچنین برای دریافت جوایز ترانه سرا و تهیه کننده سال که در گذشته برنده شده است، رقابت می کند. 10 نامزدی جدید او به 72 نامزدی که در طول دوران حرفه‌ای‌اش دریافت کرده، اضافه می‌کند که تاکنون 29 مورد از آن‌ها را برنده شده است. CA7RIEL پاکو آموروسو، خورخه درکسلر، کارول جی و روزالیا هرکدام با هفت نامزدی، در حالی که سیلوانا استرادا و مون لافرته شش نامزد دریافت کردند. همه آنها در کنار Anitta، Carín León، Milo J و Rawayana برای آلبوم سال رقابت می کنند. بیشتر آنها نیز برای آهنگ و آهنگ سال رقابت می کنند. خواننده و خواننده رپ آرژانتینی، میلو جی، تنها در 19 سالگی، با یک آلبوم فولکلور، پنج نامزدی از جمله در سه رشته اصلی را شگفت زده کرد. در همین حال، اومارا پورتوندو، خواننده افسانه ای کوبایی، در 95 سالگی نامزدی جدیدی را در رده بهترین آلبوم سنتی گرمسیری به دست آورد. مانوئل ابود، مدیر عامل آکادمی ضبط لاتین، به Billboard Español می‌گوید، من عاشق دیدن این انعطاف‌پذیری و تحرک باورنکردنی هنرمندانمان هستم، و همچنین نامزدهای یک خواننده شهری مانند Karol G را در یک دسته موسیقی مکزیکی، یک ستاره فلامنکو مانند Niña Pastori در یک رده موسیقی گرمسیری، و یک هنرمند جوان در رده موسیقی شهری Nasolu را برجسته می‌کند. LUX روزالیا در زمینه‌هایی از جمله پاپ، آلترناتیو و زبان پرتغالی، علاوه بر آلبوم سال ظاهر می‌شود. دسته آلبوم سال، اگر آن را تحلیل کنید، فهرست فوق العاده ای است، او"}, {"source": "Billboard", "title": "Kennedy Center to Close For ‘Emergency’ Renovations After Judge Rejects Latest Attempt to Add Trump Name to Venue", "link": "https://www.billboard.com/culture/politics/kennedy-center-closing-emergency-renovations-1236341414/", "summary": "The battle over affixing Donald Trump s name to the John F. Kennedy Center for the Performing Arts in D.C. took its most dramatic turn on Tuesday (Sept. 15) when the Trump-aligned board for the beloved arts institution voted to close most of the campus for what has been described as badly-needed renovations. According to The Associated Press , the move by the board came just hours after a federal judge blocked the latest attempt to put Trump s name back on the building after previous court rulings barred such action. The abrupt closure came as Trump threatened to cancel a planned $257 million renovation to the building if he is not allowed to put his name on the façade. The threatened closure and name fight have been going on for months, with judges ruling against both actions repeatedly. The venue s board — which is packed with Trump-affiliated appointees — appeared to defy the judge s order to not close by declaring an emergency action on Tuesday to protect the public and staff from what it said were unsafe conditions in the 55-year-old arts center that was renamed as a living memorial in Kennedy s honor two months after his assassination in 1963. The New York Times reported that around 4:30 p.m. ET on Tuesday employees heard an unexpected message over the P.A. telling them to immediately vacate the premises. The Center is now closed to the public, it reportedly said. Please exit the Center by way of the Hall of States. By Tuesday night, the paper reported that security guards were stationed outside entrances to the main lobby to turn away visitors. The move, the third such attempt by the Trump-affiliated board to close the venue, came after the Center said in a statement that the temporary closure was necessary following a recent incident in which a five-foot-long section of ceiling plaster fell to the floor during a storm. The planned two-year closure is expected to begin once a court approves the move. Lawyers for Democratic ex-officio board member Rep. Joyce Beatty — whose lawsuit is key in the court battle — said that the closure would appear a direct violation of the court s order, adding that it was courting contempt, according to the Times . The move is in keeping with Trump s act first, litigate later renovation spree around Washington, which has included the unannounced demolishing of the historic East Wing of the White House in October of last year, as well as affixing his name to the Kennedy Center without necessary prior congressional approv", "date_str": "2026-09-16T12:44:08+00:00", "hash": "05431d3ae684c87e", "title_fa": "پس از اینکه قاضی آخرین تلاش برای افزودن نام ترامپ به محل برگزاری را رد کرد، مرکز کندی به دلیل بازسازی‌های «اضطراری» بسته می‌شود", "summary_fa": "نبرد بر سر چسباندن نام دونالد ترامپ به مرکز هنرهای نمایشی جان اف کندی در دی سی، دراماتیک ترین چرخش خود را در روز سه شنبه (15 سپتامبر) گرفت، زمانی که هیئت مدیره مؤسسه هنری محبوب با همسویی ترامپ رای به بستن بیشتر محوطه دانشگاه برای آنچه به عنوان بازسازی های بسیار ضروری توصیف شده بود، گرفت. به گزارش آسوشیتدپرس، این اقدام هیئت مدیره تنها چند ساعت پس از آن صورت گرفت که یک قاضی فدرال از آخرین تلاش برای بازگرداندن نام ترامپ به ساختمان پس از احکام قبلی دادگاه جلوگیری کرد. این تعطیلی ناگهانی در حالی رخ داد که ترامپ تهدید کرده بود در صورتی که اجازه نداشته باشد نام خود را بر روی نمای ساختمان بگذارد، بازسازی 257 میلیون دلاری ساختمان را لغو خواهد کرد. تهدید به تعطیلی و مبارزه با نام ماه‌هاست که ادامه دارد و قضات بارها علیه هر دو اقدام حکم می‌دهند. هیئت مدیره محل برگزاری - که مملو از منصوبان وابسته به ترامپ است - به نظر می رسد با اعلام یک اقدام اضطراری در روز سه شنبه برای محافظت از مردم و کارکنان از شرایط ناامن مرکز هنری 55 ساله که به عنوان یادبود زنده در نیویورک تغییر نام داده بود، دستور قاضی برای تعطیل نشدن را زیر پا گذاشت. ساعت 4:30 بعد از ظهر کارکنان ET روز سه شنبه پیامی غیرمنتظره را در مورد P.A شنیدند. به آنها گفت که فوراً محل را تخلیه کنند. بنا بر گزارش ها، مرکز اکنون به روی عموم بسته است. لطفا از طریق تالار ایالات از مرکز خارج شوید. سه شنبه شب، روزنامه گزارش داد که محافظان امنیتی در خارج از ورودی لابی اصلی مستقر شده اند تا بازدیدکنندگان را از خود دور کنند. این اقدام، سومین تلاش از این قبیل توسط هیئت وابسته به ترامپ برای بستن محل برگزاری، پس از آن صورت گرفت که"}, {"source": "Billboard", "title": "Country Music Association To Salute Dolly Parton With Live, 2-Hour TV Special", "link": "https://www.billboard.com/music/country/dolly-parton-salute-live-2-hour-tv-special-cma-producing-1236341363/", "summary": "The Country Music Association (CMA) announced today that it is producing CMA Presents I Will Always Love You: A Celebration of Dolly Parton , a two-hour television event in tribute to Dolly Parton , who died on Aug. 25 at age 80. The special will air live on Wednesday, Oct. 21 (9:00-11:00 p.m. ET) on ABC and Disney+ internationally, available next day on Hulu. That is a nearly a month before the 60th annual CMA Awards, which are set to air on Nov. 18. Related Radio Rallies Around Dolly Parton After Her Death, Led by ‘9 to 5’ See the Best Dolly Parton Musical Tributes, From Harry Styles, Katy Perry, John Mayer, Jack White More Dolly Parton Celebrates Her No. 1 Spot on Billboard s Greatest Country Artists of All Time List | Billboard The CMA promises that “the special will be a joyful, emotional celebration of the artist, songwriter, entertainer, humanitarian and entrepreneur whose music and generosity carried her from the mountains of east Tennessee into the hearts of generations around the world, told through performances, archival footage and personal stories…” Robert Deaton serves as executive producer of the special, which will be filmed live at the Fisher Center for the Performing Arts at Belmont University in Nashville. “Dolly gave Country Music its heart, and giving some of that heart back to her is an incredible honor,” Deaton said in a statement. “My hope is simply that we do right by her story, her music and the people who love her, so that this evening feels like the tribute my friend deserves.” “Dolly Parton belonged to the whole world, but she was born of this industry, and this industry owes her a debt of gratitude that words alone cannot repay,” Sarah Trahern, CMA CEO said in a statement. “As the organization built to serve and celebrate Country Music, honoring her legacy is not just an opportunity, it is our responsibility. This special is our way of saying thank you, on behalf of every artist, industry member and fan who found a piece of themselves in her music.” The CMA and Parton have a long history. In 1978, Parton became just the second woman (following Loretta Lynn ) to win entertainer of the year at the CMA Awards. In 1988, she became the first woman to solo-host that awards show. In 2016, she became the first woman to win the Willie Nelson Lifetime Achievement Award, which is presented on the telecast. There was very effective tribute to Parton on the Primetime Emmy Awards on Monday (Sept. 14), with her Steel Magnolias co-star Sally ", "date_str": "2026-09-16T12:37:56+00:00", "hash": "b281411c06275e50", "title_fa": "انجمن موسیقی کانتری برای ادای احترام به دالی پارتون با پخش زنده، ویژه تلویزیونی 2 ساعته", "summary_fa": "انجمن موسیقی کانتری (CMA) امروز اعلام کرد که CMA Presents I Will Always Love You: A Celebration of Dolly Parton را تولید می کند، یک رویداد تلویزیونی دو ساعته برای ادای احترام به دالی پارتون، که در 25 اوت در 80 سالگی درگذشت. این ویژه در روز چهارشنبه، 21 اکتبر تا 21 اکتبر در ساعت 9:00 ساعت قبل از میلاد به صورت زنده پخش خواهد شد. Disney+ در سطح بین المللی، روز بعد در Hulu در دسترس است. این تقریباً یک ماه قبل از شصتمین دوره جوایز سالانه CMA است که قرار است در 18 نوامبر پخش شود. تجمعات رادیویی مرتبط در اطراف دالی پارتون پس از مرگش، به رهبری «9 تا 5» بهترین ادای احترام به دالی پارتون را ببینید، از هری استایلز، کیتی پری، جان مایر، جک وایت بیشتر دالی پارتون شماره خود را جشن می‌گیرد. 1 نقطه در لیست بهترین هنرمندان کشور بیلبورد در تمام دوران | Billboard The CMA وعده می دهد که \"ویژه جشنی شاد و احساسی از هنرمند، ترانه سرا، سرگرم کننده، انسان دوست و کارآفرینی خواهد بود که موسیقی و سخاوت او را از کوه های شرق تنسی به قلب نسل های مختلف در سراسر جهان برد، از طریق اجراها، فیلم های آرشیوی و داستان های شخصی که رابرت دیون تهیه کننده فیلم است...\" مرکز هنرهای نمایشی فیشر در دانشگاه بلمونت در نشویل. دیتون در بیانیه‌ای گفت: «دالی قلب موسیقی کانتری را بخشید و بازگرداندن بخشی از آن قلب به او افتخاری باورنکردنی است. \"امید من به سادگی این است که با داستان او، موسیقی او و افرادی که او را دوست دارند، درست عمل کنیم تا این شب احساس شود که دوست من سزاوار آن است.\" سارا تراهرن، مدیرعامل CMA در بیانیه ای گفت: \"دالی پارتون متعلق به تمام دنیا بود، اما او از این صنعت متولد شد و این صنعت به"}, {"source": "Billboard", "title": "Jung Kook Hits the Dance Floor for New Calvin Klein Campaign: ‘There’s Something About the Fit & Attitude’", "link": "https://www.billboard.com/music/music-news/jung-kook-stars-new-calvin-klein-fall-2026-denim-campaign-1236341007/", "summary": "Jung Kook is getting into the groove for Calvin Klein s latest denim campaign. The BTS star is involved in the third chapter of Calvin Klein s Fall 2026 Feel the Fit campaign, which debuted Wednesday (Sept. 16), putting the spotlight on the split-second transformation that can happen when you find a pair of jeans that just feel right. Related Jung Kook of BTS Partners With Major Fashion Brand to Help Design His First-Ever Clothing Line Watch Jung Kook of BTS Cut Footloose in a Dance-Filled Denim Daydream for a Legacy Fashion Brand BTS Jung Kook Shows Off Washboard Abs in Smoldering Campaign for Iconic Brand: Good to Be Back Directed and photographed by Renell Medrano, the new campaign opens with Jung Kook pulling on his Calvin Klein jeans. From there, the sound of the zipper sets the rhythm in motion, with the singer breaking into movement and choreography as the energy of the spot amplifies. The campaign is soundtracked by Bobby Brown s My Prerogative (No. 1 on the Billboard Hot 100 in 1989) and Average White Band s Cut the Cake (a top 10 Hot 100 hit in 1975). Billboard also has an exclusive behind-the-scenes video of Jung Kook posing for the campaign, showing off his silky dance moves and applauding at the end of a successful shoot. For Jung Kook, the campaign was an opportunity to play with the idea of moving through music. After working with Calvin Klein for so many years, I ve come to appreciate how I feel every time I put on the brand s jeans, he said in a statement. There s something about the fit and attitude that really resonates with me. The new visuals also introduce two of Calvin Klein s Fall 2026 denim silhouettes: the 90s Straight Jean, offered in washes ranging from deep indigo to mid-blue, and the oversized Baggy Jean in a classic medium-blue wash. The campaign is just another project that emphasized Jung Kook s everlasting relationship with the fashion house, which also named him a global brand ambassador in 2023. The BTS member has also made his mark on the Billboard charts as a solo artist, with his Latto-assisted Seven debuting at No. 1 on the Hot 100 in July 2023. Jung Kook has fronted multiple Calvin Klein campaigns, frequently bringing his electric energy into the brand s visuals. The latest Feel the Fit phase is rolling out globally across Calvin Klein s stores, website, social platforms and out-of-home advertising. See Billboard s behind-the-scenes video of Jung Kook s Clavin Klein shoot below: View this post on Instagram", "date_str": "2026-09-16T12:31:45+00:00", "hash": "80d46dd29c9e7a37", "title_fa": "جونگ کوک برای کمپین جدید کالوین کلین وارد زمین رقص شد: «چیزی در مورد تناسب و نگرش وجود دارد»", "summary_fa": "جونگ کوک در حال وارد شدن به جدیدترین کمپین جین کالوین کلاین است. ستاره BTS در فصل سوم کمپین پاییز 2026 کالوین کلاین Feel the Fit که اولین بار در روز چهارشنبه (16 سپتامبر) آغاز شد، نقش دارد و در کانون توجه تحولی است که می‌تواند زمانی اتفاق بیفتد که یک شلوار جین را پیدا کنید که احساس خوبی دارد. جونگ کوک مرتبط با BTS شریک با برند اصلی مد برای کمک به طراحی اولین خط لباس خود. کمپین با پوشیدن شلوار جین کالوین کلین خود توسط جونگ کوک آغاز می شود. از آنجا، صدای زیپ ریتم را به حرکت در می آورد و خواننده با تقویت انرژی نقطه به حرکت و رقص وارد می شود. موسیقی متن این کمپین توسط بابی براون My Prerogative (شماره 1 در بیلبورد Hot 100 در سال 1989) و گروه متوسط ​​سفید، Cut the Cake (یک 10 آهنگ برتر از 100 آهنگ داغ در سال 1975) پخش می شود. بیلبورد همچنین یک ویدیوی انحصاری پشت صحنه از جونگ کوک دارد که برای کمپین ژست گرفته، حرکات رقص ابریشمی خود را به نمایش می گذارد و در پایان یک فیلمبرداری موفق کف می زند. برای جونگ کوک، این کمپین فرصتی برای بازی با ایده حرکت در موسیقی بود. او در بیانیه‌ای گفت: پس از سال‌ها کار با Calvin Klein، هر بار که شلوار جین این برند را می‌پوشم، احساس می‌کنم. چیزی در مورد تناسب و نگرش وجود دارد که واقعاً در من طنین انداز است. تصاویر جدید همچنین دو مدل جین پاییز 2026 کالوین کلاین را معرفی می‌کنند: جین راسته دهه 90، که در لباس‌هایی از نیلی عمیق تا آبی میانی ارائه می‌شود، و باگی جین بزرگ با لباس‌های کلاسیک آبی متوسط. این کمپین تنها پروژه دیگری است که بر رابطه همیشگی جونگ کوک با خانه مد تأکید می کند، خانه ای که او را"}, {"source": "Billboard", "title": "‘American Idol’ Production Leaving Los Angeles After 25 Years For Atlanta", "link": "https://www.billboard.com/culture/tv-film/american-idol-production-leaving-los-angeles-atlanta-1236341409/", "summary": "American Idol contenders will no longer hear the signature you re going to Hollywood! phrase. According to The Los Angeles Times , after 25 years in Los Angeles, the long-running reality singing competition is pulling up stakes and moving across the country to Atlanta for its next season, which will premiere in early 2027. Show producer Fremantle confirmed to the paper that Idol s upcoming 25th season will be filmed in the Atlanta area at a time when Los Angeles has seen the level of productions in the city long associated with everything showbiz dropping despite Gov. Gavin Newsom recently signing a major tax incentive bill aimed at keeping businesses in the state. Just this week, Newsom signed Senate Bill 180 , which extends the state s business incentive program, CalCompetes, through fiscal year 2032-33 after it was scheduled to sunset next year. According to the Governor s office, since 2019, more than $1.8 billion in tax credits have been awarded to 271 businesses through the CalCompetes Tax Credit Program. The Hollywood Reporter noted that the Idol flight came after Newsom signed a bill last year that increased the cap on film and TV tax credit incentives from $330 million to $750 million a year. Idol s first 15 seasons (2002-2016) on Fox were based in Los Angeles and when it returned to the air in 2018 on ABC it continued to film in the city until crowning its latest winner in May of this year. The continued exodus of production in L.A. has worried film workers and union leaders as the state struggles to compete with other states offering even more lucrative tax credits, the Times reported. In the meantime, TV production in the L.A. area was down 27% in the second quarter of this year compared with the same period last year, mainly because of fewer reality TV shoots. As an example, earlier this year Fox s The Masked Singer announced plans to leave its Fox lot in L.A. to travel across the country to New Jersey thanks to the Garden State s more attractive tax credits. In addition, long-running ABC competition series Shark Tank is also pulling up stakes to move to Atlanta from the Sony lot in Culver City, Calif. Idol has provided jobs for hundreds of workers each season for the past two decades, but the allure of Georgia s generous tax incentives — including up to a 30% tax credit for reality TV productions that spend at least $500,000 in the state — has drawn a number of productions there, in part because, unlike California, the Peach State s tax progr", "date_str": "2026-09-16T11:39:13+00:00", "hash": "46466f5c0a9f95ef", "title_fa": "ترک لس آنجلس پس از 25 سال به مقصد آتلانتا، تولید \"American Idol\".", "summary_fa": "مدعیان امریکن آیدل دیگر امضای شما را که به هالیوود می روید نمی شنوند! عبارت به گزارش لس آنجلس تایمز، پس از 25 سال در لس آنجلس، رقابت طولانی مدت خوانندگی واقعیت در حال افزایش است و در سراسر کشور برای فصل بعدی خود به آتلانتا می رود، که در اوایل سال 2027 نمایش داده می شود. Fremantle تهیه‌کننده نمایش به روزنامه تأیید کرد که فصل 25 آینده Idol در منطقه آتلانتا فیلمبرداری می‌شود، در زمانی که لس‌آنجلس شاهد بوده است که سطح تولیدات در این شهر مدت‌هاست که با همه چیزهای نمایشی کاهش می‌یابد، علی‌رغم اینکه فرماندار گاوین نیوسام اخیراً یک لایحه مشوق مالیاتی بزرگ را با هدف حفظ مشاغل در ایالت امضا کرده است. همین هفته، نیوسام لایحه 180 سنا را امضا کرد که برنامه تشویقی کسب و کار ایالت، CalCompetes، را تا سال مالی 2032-33 پس از برنامه ریزی برای غروب سال آینده تمدید می کند. به گفته دفتر فرماندار، از سال 2019، بیش از 1.8 میلیارد دلار اعتبار مالیاتی از طریق برنامه اعتبار مالیاتی CalCompetes به 271 کسب و کار اعطا شده است. هالیوود ریپورتر خاطرنشان کرد که پرواز Idol پس از امضای لایحه ای توسط نیوسام در سال گذشته صورت گرفت که سقف مشوق های مالیاتی فیلم و تلویزیون را از 330 میلیون دلار به 750 میلیون دلار در سال افزایش داد. 15 فصل اول Idol (2002-2016) در فاکس در لس آنجلس ساخته شد و هنگامی که در سال 2018 از شبکه ABC به روی آنتن رفت، به فیلمبرداری در این شهر ادامه داد تا اینکه آخرین برنده خود را در ماه مه امسال تاج گذاری کرد. ادامه مهاجرت تولید در L.A. به گزارش تایمز، در حالی که ایالت در تلاش برای رقابت با سایر ایالت هایی است که اعتبارات مالیاتی پرسودتری ارائه می دهند، کارگران سینما و رهبران اتحادیه ها را نگران کرده است."}, {"source": "Billboard", "title": "Taylor Hanson Glides With Quickstep Dance on Premiere of ‘DWTS’: Watch", "link": "https://www.billboard.com/culture/tv-film/taylor-hanson-quickstep-dance-premiere-dwts-watch-1236341401/", "summary": "Taylor Hanson. Chart-topping pop artist, dad, dancer. The Hanson bandmate checked off that third quest when he made his debut Tuesday night (Sept. 16) on ABC s Dancing With The Stars , performing a Quickstep to Billy Joel’s “Tell Her About It.” The 43-year-old looked well-rehearsed, confident and light on his feet as he and his pro dance partner Britt Stewart glided through their routine. Speaking ahead of the season 35 premiere, Stewart said that Hanson is committed to doing anything for the team. “Meeting Taylor was amazing. I was born in ’89, so I grew up in the ’90s, and that’s when Hanson was number one on the charts. I am a millennial so I can appreciate the significance of Taylor Hanson and how awesome it is for him to be on Dancing With the Stars ,” she told The Hollywood Reporter . “I kind of sighed in relief when he told me during our first meet, “I will do whatever you need me to do. If that means buying a cot and sleeping at the dance studio so we can rehearse all the time, that is what I will do.” I was like, Okay, he wants to work for this. He’s in it to win it . That commitment is so important.” Hanson made his fame as one of the three Hanson brothers — including Isaac and Zac — who ascended to pop stardom in the late ’90s. The Tulsa, Okla.-based trio topped the Billboard Hot 100 in 1997 with their smash hit “MMMBop,” which also scored Grammy nominations for record of the year and best pop performance by a duo or group with vocal. Hanson is the artist standout in this latest season of DWTS . “We have a lot of things in common,” Stewart said of her dance partner. “Our energy is very similar. It was only a few things that he said in our first meet, and I was like, Ah, we’re gonna get along just fine .” The Dancing With The Star s two-night season premiere began live Tuesday at 8/7c on ABC and Disney+. Next day on Hulu. Watch the opening night performance below.", "date_str": "2026-09-16T09:35:47+00:00", "hash": "e90bae6fdc9fbc9e", "title_fa": "تیلور هانسون با رقص Quickstep در اولین نمایش «DWTS» سر می‌زند: تماشا کنید", "summary_fa": "تیلور هانسون. هنرمند پاپ، پدر، رقصنده که در صدر جدول قرار دارد. هم‌گروه هنسون وقتی سه‌شنبه شب (۱۶ سپتامبر) برای اولین بار در رقص با ستاره‌ها در شبکه ABC شروع به کار کرد، تلاش سوم را انجام داد، و با اجرای سریع آهنگ «Tell Her About It» از بیلی جوئل. این مرد 43 ساله در حالی که او و شریک حرفه ای رقصش بریت استوارت در حال انجام کارهای روزمره خود بودند، تمرین شده، با اعتماد به نفس و سبک به نظر می رسید. استوارت قبل از پخش فصل 35 گفت که هانسون متعهد به انجام هر کاری برای تیم است. او به هالیوود ریپورتر گفت: \"ملاقات با تیلور شگفت انگیز بود. من در سال 89 به دنیا آمدم، بنابراین در دهه 90 بزرگ شدم، و این زمانی بود که هانسون شماره یک جدول بود. من یک هزاره هستم، بنابراین می توانم اهمیت تیلور هنسون و حضور او در Dancing With the Stars را درک کنم.\" زمانی که در اولین ملاقاتمان به من گفت: «هر کاری که شما بخواهید انجام خواهم داد، آهی از روی تسکین کشیدم. اگر این به معنای خرید تختخواب و خوابیدن در استودیو رقص است تا بتوانیم همیشه تمرین کنیم، این کاری است که انجام خواهم داد.» من می‌گفتم خوب، او می‌خواهد برای این کار کند. او در آن است تا آن را برنده شود. این تعهد بسیار مهم است.» هانسون به عنوان یکی از سه برادر هنسون - از جمله آیزاک و زک - که در اواخر دهه 90 به شهرت پاپ رسیدند، به شهرت رسید. گروه سه‌گانه ساکن تولسا، اوکلا، در سال 1997 با آهنگ فوق‌العاده‌شان «MMMBop» در صدر جدول بیلبورد Hot 100 قرار گرفتند، که همچنین نامزد جایزه گرمی برای رکورد سال و بهترین اجرای پاپ توسط یک دو یا گروه با آواز شد. هانسون هنرمند برجسته در این آخرین فصل از DWTS"}, {"source": "Billboard", "title": "‘The New Eminem’: Rapper Luke Taleno Lights It Up With Original Song For ‘AGT’ Semifinals", "link": "https://www.billboard.com/culture/tv-film/rapper-luke-taleno-original-song-agt-semifinals-1236341392/", "summary": "Luke Taleno is still living the dream. The American Dream , that is. Born in Cuba, and a cancer survivor, Taleno shone when he auditioned for NBC s America’s Got Talent back in June . Under the bright lights of the AGT stage, Taleno performed an original number, “From Seat to Stage,” a gift from his heart to the rest of us. It was a Golden Buzzer-worthy performance, earning that highest of praise from judge Howie Mandel. Taleno never had it easy. He relocated with his family to the United States at the age of just three. Before he could communicate in English, he understood the language of music and its power to connect people. At 13, he was diagnosed with leukemia. Now, aged 28, he’s in the semifinals of AGT season 21. And he’s there as a new U.S. citizen, having sworn his oath prior to his most recent performance. Taleno didn’t waste his chance. Strutting out to the stage under the stars and stripes of the Cuban flag, and wearing a patriotic jacket, Taleno performed another original song, “American Dream,” carrying the energy, swagger and confidence of a guy who could go the distance. “You are the American dream, you really are,” Mandel said of his protégé. “You have had to battle your whole life with your health. And then you’ve manifested yourself last year, backstage, telling Simon (Cowell) you were going to end up on that stage. You got the Golden Buzzer. You are making your dream come true.” For Mandel, Taleno is “the new Eminem.” Taleno wrote the song in the past week. “You sung it with so much passion, and heart. And you interpreted every single word,” remarked Spice Girls Mel B. “You’re going to go very far, you are.” Sofía Vergara reckons Taleno is a “superstar already,” an artist that is “so, so good.” As he finished his moment on stage, Taleno doubled down. “Most people chase one dream, he enthused. And I’m getting to live both dreams. Let’s keep the dream alive. Will Taleno score a place in the final? The result lies with America’s vote. Wednesday’s AGT results special will feature Season 20 runner-up Chris Turner, who returns to the talent show with his signature freestyle rap. Watch Taleno s semifinal performance below.", "date_str": "2026-09-16T08:50:55+00:00", "hash": "5845ff99fd8603c9", "title_fa": "\"The New Eminem\": رپر Luke Taleno آن را با آهنگ اصلی برای نیمه نهایی \"AGT\" روشن می کند", "summary_fa": "لوک تالنو هنوز در رویا زندگی می کند. رویای آمریکایی، یعنی. تالنو که در کوبا متولد شد و از سرطان جان سالم به در برد، زمانی که در ماه ژوئن برای سریال America’s Got Talent شبکه NBC تست داد، درخشید. زیر نورهای روشن صحنه AGT، تالنو یک شماره اصلی، \"از صندلی تا صحنه\" را اجرا کرد، هدیه ای از قلب او به بقیه. این یک اجرای ارزشمند برای زنگ طلایی بود که بیشترین تحسین را از داور هووی مندل به دست آورد. Taleno هرگز آن را آسان نداشت. او در سه سالگی به همراه خانواده اش به آمریکا نقل مکان کرد. قبل از اینکه بتواند به زبان انگلیسی ارتباط برقرار کند، زبان موسیقی و قدرت آن را در ارتباط با مردم درک می کرد. در 13 سالگی تشخیص داده شد که سرطان خون دارد. اکنون، در سن 28 سالگی، او در نیمه نهایی فصل 21 AGT است. و او به عنوان یک شهروند جدید ایالات متحده در آنجا حضور دارد و قبل از اجرای اخیرش سوگند یاد کرده است. تالنو شانس خود را از دست نداد. تالنو که زیر ستارگان و خطوط پرچم کوبا به صحنه آمد و ژاکتی میهنی پوشیده بود، آهنگ اصلی دیگری به نام «رویای آمریکایی» را اجرا کرد که حامل انرژی، فضولی و اعتماد به نفس مردی بود که می‌توانست مسافت‌ها را طی کند. مندل در مورد سرپرست خود گفت: «شما رویای آمریکایی هستید، واقعاً هستید. \"تو مجبور بودی تمام زندگیت را با سلامتی خود بجنگی. و سپس سال گذشته خودت را در پشت صحنه نشان دادی و به سایمون (کاول) گفتی که قرار است در آن صحنه بمانی. شما زنگ طلایی را گرفتید. شما رویای خود را محقق می کنید.» برای مندل، تالنو «امینم جدید» است. تالنو این آهنگ را در هفته گذشته نوشت. \"شما آن را با شور و اشتیاق بسیار و با دل"}, {"source": "Billboard", "title": "Everything We Learned From Drake’s ‘FOMO’ Short Film", "link": "https://www.billboard.com/lists/drake-short-film-fomo/", "summary": "When Drake announced plans for FOMO , plenty of theories were floated on social media by rap fans about what to expect. The 6 God s not so short film arrived on Tuesday night (Sept. 15), just four months after his May trifecta of albums. Lasting just over an hour, Fear of Missing Out is similar to Drizzy s ICEMAN livestream, which essentially saw him turn portions of the short film into a visual album for tracks from his HABIBTI and MAID OF HONOUR albums. But that wasn t it, as Drake completed side missions throughout the clip, which featured appearances from Sexyy Red ; Stunna Sandy; his mother, Sandra Graham; NBA star Kevin Durant; model Winnie Harlow; Lena the Plug; his goth baddie and more. He couldn t put together an event like FOMO without some new music, which saw him debut unreleased collaborations with Don Toliver, PartyNextDoor and Yeat. In all, there are nine new tracks sprinkled throughout the short film, including his anticipated interpolation of Ella Langley s Choosin Texas smash. Following a premiere of FOMO in Toronto, Drake revealed that he s set to hit the road again in 2027 for a world tour, which will include his first North American trek since 2023. Obviously, tour is coming and there s other things on the horizon, some big shows, he said. We ll be out 2027 to see everybody again across the world We ll see you on tour soon. Even after feeding fans three albums, The Boy is still clearly inspired creatively in the studio and has continued working on new ideas, but this feels like more of a care package he wanted to get out, rather than kicking off his next era. Unfortunately, Drake made FOMO private on his YouTube page after the short film s debut. Here s everything we learned from Drake s short film.", "date_str": "2026-09-16T08:12:55+00:00", "hash": "9763cad468b12968", "title_fa": "هر آنچه از فیلم کوتاه «FOMO» دریک آموختیم", "summary_fa": "زمانی که دریک برنامه‌های خود را برای FOMO اعلام کرد، تئوری‌های زیادی در رسانه‌های اجتماعی توسط طرفداران رپ مطرح شد در مورد اینکه چه انتظاری باید داشت. فیلم کوتاه 6 God s نه چندان کوتاه سه شنبه شب (15 سپتامبر)، تنها چهار ماه پس از سه آلبوم او در ماه مه وارد بازار شد. Fear of Missing Out که فقط بیش از یک ساعت طول می کشد، شبیه پخش زنده ICEMAN Drizzy است، که اساساً قسمت هایی از فیلم کوتاه را به آلبومی تصویری برای قطعات آلبوم های HABIBTI و MAID OF HONOR تبدیل کرد. اما اینطور نبود، زیرا دریک ماموریت های جانبی را در طول کلیپ انجام داد، که در آن ظاهری از Sexyy Red وجود داشت. استونا شنی; مادرش، ساندرا گراهام؛ کوین دورانت ستاره NBA; مدل وینی هارلو; لنا پلاگ؛ بدی گوت او و موارد دیگر. او نمی‌توانست رویدادی مانند FOMO را بدون موسیقی جدید ترتیب دهد، که اولین همکاری‌اش را با Don Toliver، PartyNextDoor و Yeat انجام داد. در مجموع، 9 آهنگ جدید در طول فیلم کوتاه پخش شده است، از جمله درون یابی پیش بینی شده او از الا لنگلی به نام Choosin Texas Smash. پس از اولین نمایش FOMO در تورنتو، دریک فاش کرد که در سال 2027 برای یک تور جهانی که شامل اولین سفر او در آمریکای شمالی از سال 2023 خواهد بود، دوباره راهی جاده خواهد شد. ما در سال 2027 بیرون خواهیم بود تا دوباره همه را در سراسر جهان ببینیم. به زودی شما را در تور خواهیم دید. حتی پس از دادن سه آلبوم به طرفداران، The Boy هنوز به وضوح در استودیو الهام‌بخش خلاقانه است و به کار بر روی ایده‌های جدید ادامه داده است، اما به نظر می‌رسد که بیشتر بسته مراقبتی است که او می‌خواست از آن خارج شود، نه شروع دوره بعدی خود. متأسفانه، دریک پس"}, {"source": "Deadline", "title": "Sam Worthington, Liam Hemsworth & Cara Delevingne Set For Paul Schrader’s Erotic Thriller ‘Non Compos Mentis’ With Filming Lined Up For Next Month", "link": "https://deadline.com/2026/09/sam-worthington-cara-delevingne-join-paul-schrader-film-1237105055/", "summary": "EXCLUSIVE: Sam Worthington (Avatar), Liam Hemsworth (The Hunger Games), and Cara Delevingne (Club Kid) are set to play the lead love triangle in Paul Schrader s upcoming erotic thriller Non Compos Mentis. Production is due to get underway next month in New York on the movie, which Oscar nominee Schrader has written and will direct. Additional [ ]", "date_str": "2026-09-16T14:30:00+00:00", "hash": "fa63b2651e6d92d3", "title_fa": "سم ورثینگتون، لیام همسورث و کارا دلوین برای فیلم هیجان انگیز وابسته به عشق شهوانی پل شریدر با نام «Non Compos Mentis» با فیلمبرداری برای ماه آینده آماده می شوند.", "summary_fa": "انحصاری: سم ورتینگتون (آواتار)، لیام همسورث (بازی‌های گرسنگی) و کارا دلوین (کودک باشگاه) قرار است نقش مثلث عشقی را در فیلم هیجان‌انگیز شهوانی آینده پل شریدر بازی کنند. تولید این فیلم که نامزد اسکار شریدر نوشته و کارگردانی خواهد شد، قرار است ماه آینده در نیویورک آغاز شود. اضافی [ ] انحصاری : سام ورتینگتون (آواتار)، لیام همسورث (بازی های گرسنگی) و کارا دلوین (کلوپ کید) قرار است نقش مثلث عشقی را در فیلم هیجان انگیز شهوانی آتی پل شریدر، Non Compos Mentis بازی کنند. Non Compos Mentis (به لاتین به معنای ذهن ناسالم) روی دو برادر ممتاز تمرکز دارد که با زوال عقل مادرشان روبرو می شوند: یکی وکیل مدافع نیویورکی و دیگری یک وارث شرکتی سرسخت. زمانی که وکیل با یک زن جوانتر وارد رابطه جنسی می شود، پویایی ناراحت کننده آنها دچار شکستگی می شود و مثلث عشقی ناپایدار را برمی انگیزد که وسواس، خیانت، و نبردی بی رحمانه برای کنترل ثروت خانواده را به راه می اندازد. داستان‌های مرتبط نقد بررسی اصول فلسفه: جک هیوستون از گذشته‌اش عذاب می‌دهد در مطالعه شخصیتی درون‌نگر پل شریدر - جشنواره‌های فیلم ونیز جک هیوستون درباره سؤالات سخت درباره آزار جنسی مطرح شده توسط فیلم پل شریدر. سالی که بازیگران کاملا متفاوتی از جمله کالب لندری جونز، سارا پیجون و دایان ویست داشت. Watch on Deadline Pic توسط دیوید گونزالس (مستر باغبان)، مدیر شریدر و شریک تولید تولید می شود. تهیه کننده اجرایی نادین د باروس از Fortitude International است که بر فروش بین المللی نظارت دارد."}, {"source": "Deadline", "title": "Los Angeles News Chopper Crash Victims Include TV Journalist And Pilot; Video Could Indicate Possible Rotor Problem", "link": "https://deadline.com/2026/09/los-angeles-news-helicopter-crash-victims-1237105103/", "summary": "A local Los Angeles TV news journalist and the pilot of an NBC L.A. news chopper are among the three people confirmed dead in last night s Los Angeles-area helicopter crash. Journalist Eliana Moreno and pilot George Marciniw were providing news coverage of an automobile accident in Chatsworth, CA, when their helicopter went down. The third [ ]", "date_str": "2026-09-16T14:28:29+00:00", "hash": "81434d428a6cfcfc", "title_fa": "قربانیان سقوط هلی کوپتر خبری لس آنجلس شامل روزنامه نگار تلویزیونی و خلبان می شود. ویدئو می تواند مشکل احتمالی روتور را نشان دهد", "summary_fa": "یک خبرنگار خبری تلویزیون محلی لس آنجلس و خلبان یک هلیکوپتر خبری NBC L.A از جمله سه نفری هستند که در سقوط هلیکوپتر شب گذشته در منطقه لس آنجلس کشته شدند. روزنامه نگار Eliana Moreno و خلبان جورج Marciniw در حال ارائه پوشش خبری از یک تصادف اتومبیل در Chatsworth، CA بودند که هلیکوپتر آنها سقوط کرد. سومین [ ] امروز صبح، CNN فیلم ویدئویی گرفته شده از هلیکوپتر در لحظات پایانی آن را پخش کرد. فیلم ابتدا به طور پیوسته بر روی تصادف وسیله نقلیه روی زمین متمرکز شده بود، اما سپس فیلم شروع به لرزیدن کرد و زنگ هشدار از داخل هلی کوپتر شنیده شد. سی‌ان‌ان گزارش داد که زنگ هشدار می‌تواند نشان‌دهنده یک RPM به‌طور خطرناکی کم روتور باشد. ان‌بی‌سی لس‌آنجلس/ گوینده خبری NBC 4، کالین ویلیامز، درست قبل از ساعت 9 شب در مورد هلیکوپتر خود ایستگاهش به صورت زنده در NBC 4 اعلام کرد. دیشب اکنون می‌توانیم تأیید کنیم که هلی‌کوپتر که امشب دو ساعت پیش در چتس‌ورث سقوط کرد، در واقع News Chopper 4 بود، ویلیامز که به وضوح تکان خورده بود. تماشا در Deadline سقوط هلی کوپتر اولین بار حدود ساعت 7 بعد از ظهر به مقامات گزارش شد. مقامات آتش نشانی لس آنجلس بعدا تایید کردند که هواپیما بین دو ساختمان تجاری در Chatsworth سقوط کرد و حداقل سه نفر کشته شدند. به گزارش NBC 4، مورنو و مارسینیو اغلب با هم کار می کردند، به ویژه در شیفت های خبری عصر. مورنو و مارسینیو که اغلب به عنوان چشم و گوش در آسمان برای NBC 4 و Telemundo 52 نامیده می‌شوند، صدها ساعت آسمان را از سال 2023 با هم ثبت کرده‌اند. از جمله داستان‌هایی که پوشش داده‌اند، آتش‌سوزی‌های لس‌آنجلس و تعقیب و گریز پلیس‌های متعدد بود. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورودی خود را راضی نگه"}, {"source": "Deadline", "title": "‘Conversation With The Sea’ Trailer: Muayad Alayan Explores Everyday Pressures For Palestinians In Jerusalem – TIFF", "link": "https://deadline.com/2026/09/conversation-sea-trailer-alayan-palestinian-jerusalem-1237105116/", "summary": "EXCLUSIVE: Palestinian director Muayad Alayan’s Jerusalem-set drama Conversation with the Sea makes its North American premiere in Toronto on Wednesday, following its Venice debut, and Deadline can unveil the trailer. Kamel El Basha, who won Venice’s Volpi Cup for Best Actor for his performance in The Insult in 2017, plays a 60-year-old Palestinian man, who [ ]", "date_str": "2026-09-16T14:21:47+00:00", "hash": "2d89cac47c41c164", "title_fa": "تریلر «مکالمه با دریا»: مؤیاد علایان فشارهای روزمره برای فلسطینیان در اورشلیم را بررسی می کند - TIFF", "summary_fa": "اختصاصی: درام «مکالمه با دریا» به کارگردانی «معایاد علایان» کارگردان فلسطینی در اورشلیم، روز چهارشنبه پس از اولین نمایش در ونیز در آمریکای شمالی در تورنتو به نمایش در می‌آید و «ددلاین» می‌تواند از تریلر آن رونمایی کند. کامل الباشا که برای بازی در فیلم توهین در سال 2017 برنده جام ولپی بهترین بازیگر مرد ونیز شد، نقش یک مرد فلسطینی 60 ساله را بازی می‌کند که [ ] هنگامی که قصد دارد مدرک مرگ پسرش را به مقامات اسرائیلی ارائه کند و بدهی را تسویه کند، متوجه می‌شود که هیچ سابقه رسمی از مرگ او وجود ندارد. اخبار مرتبط اخبار حمله رسانه‌های حکومتی جمهوری اسلامی به برنده جایزه ونیز، للا مرزبان به خاطر جشنواره‌های سخنرانی حقوق زنان، استعدادی برای قتل نقد: هلن میرن به عنوان نویسنده جنایتکار نابغه شکنجه‌شده مسحور است پاتریشیا هایسمیت - جشنواره فیلم تورنتو تلاش او برای رسیدن به اعماق موقعیت، تماشاگر را در سفری به زندگی نابغه می‌برد. شهر از طریق رویارویی او با بوروکرات ها، سربازان و شهرک نشینان مسلح اسرائیلی در پس زمینه اخراج خانه ها و ترس. فیلم‌های قبلی آلایان، کارگردان متولد اورشلیم، شامل اولین کا ‌المللی فیلم کامدن، که از پنجشنبه آغاز می‌شود، شرکت خواهند کرد. ارلون وودز و آنتوان ویلیامز در حالی که به زندان‌های سراسر جهان سفر می‌کنند و داستان‌هایی را که در درونشان به وجود آمده به اشتراک می‌گذارند. داستان‌های مرتبط فیلم مستند مووریا پولی به دست نمی‌آورد بدون عسل، مجموعه مستندی برای اولین نمایش قریب‌الوقوع در جشنواره بین‌المللی فیلم کامدن. میراث مادرش را به‌عنوان یک فعال و روزنامه‌نگار در جریان جنبش قدرت سرخ بازمی‌گرداند و 500 سال مقاومت تاینو را آشکار می‌کند و سفر احیای خود را شعله‌ور می‌کند. در ادامه در مورد هر فیلم بیشتر بخوانید. تماشا در آخرین مهلت افتتاحیه جایزه فیلم مستند بنیاد Ellis-Beauregard توسط هیئت داوری متشکل از چهار دست اندرکار مستند داوری شد: کلوئی والترز والاس، مدیر ابتکارات منطقه ای، فایر لایت رسانه. جف زلباخ، تهیه کننده؛ نل لارنز-وارهام، معاون مدیر، کاوش فیلم مینه سوتا؛ و ایان کیبه، تهیه کننده ارشد Kartemquin Films."}, {"source": "Deadline", "title": "Broadway’s ‘Two Strangers (Carry A Cake Across New York)’ Sets Closing Date", "link": "https://deadline.com/2026/09/two-strangers-carry-a-cake-across-new-york-broadway-closing-1237105074/", "summary": "Two Strangers (Carry a Cake Across New York), the modest, two-person musical that charmed critics last season and scored eight Tony Award nominations, will play its final performance on Sunday, November 29. At the time of its closing, Two Strangers will have played 21 previews and 428 performances at the Longacre Theatre. The First National [ ]", "date_str": "2026-09-16T13:55:37+00:00", "hash": "b1b7ea284f394f4e", "title_fa": "تاریخ اختتامیه «دو غریبه» برادوی (یک کیک در سراسر نیویورک حمل کنید)", "summary_fa": "Two Strangers (Carry a Cake Across New York)، موزیکال ساده و دو نفره ای که فصل گذشته منتقدان را مجذوب خود کرد و هشت نامزدی جایزه تونی را به دست آورد، آخرین اجرای خود را یکشنبه، 29 نوامبر اجرا می کند. در زمان پایان، Two Strangers 21 پیش نمایش و 428 اجرا را در Longacreatre اجرا خواهد کرد. The First National [ ] نوشته و آهنگسازی جیم بارن و کیت بوکان، و کارگردانی و طراحی رقص توسط تیم جکسون، بازیگ  en persoonlijkheid in essentie dezelfde. In zijn verschillende levens weet hij CJ telkens weer terug te vinden. Ondertussen zie je CJ opgroeien van een klein meisje tot een volwassen vrouw. Haar jeugd is niet gemakkelijk: haar relatie met haar moeder is gecompliceerd en ze krijgt te maken met de nodige tegenslagen. Ze droomt ervan om muzikant te worden, maar heeft moeite om haar eigen weg te vinden. Bailey probeert haar in zijn verschillende gedaantes te beschermen en brengt haar ook steeds opnieuw in contact met Trent, haar beste jeugdvriend. Extra tissues A Dog’s Journey krijgt een 7,5 op IMDb, met reviews als: Ik ben zo blij dat ik deze film heb gekeken! En ik ben ook blij dat ik extra tissues bij mijn popcorn had gepakt! Ik heb werkelijk alle prachtige emoties gevoeld en daarna heb ik ook A Dog’s Purpose gekeken. Deze familiefilm is nú te bekijken op Netflix! Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Hondenfilm op Netflix maakt je sowieso aan het huilen appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-16T12:34:20+00:00", "hash": "84a9eca352f0acbd", "title_fa": "فیلم های سگ در نتفلیکس قطعا شما را به گریه می اندازد", "summary_fa": "آیا شما هم به فیلم های حیوانات حساس هستید؟ در مورد، خوب، هر از گاهی اشک ریختن؟ خب، پس می‌توانیم بگوییم: سفر یک سگ کار را انجام می‌دهد! و این فیلم هم اکنون از طریق نتفلیکس قابل مشاهده است. بله، درست حدس زدید: یک فیلم خانوادگی احساسی درباره یک سگ، درباره بیلی، یک دوست چهارپای وفادار که بارها و بارها به دنیا می آید و سعی می کند از یک خانواده در زندگی سگ های مختلف محافظت کند. این دنباله ای برای یک سگ (2017) است، اما داستان را می توان به راحتی دنبال کرد. در ابتدا، بیلی در مزرعه ای با مالک محبوبش ایتان (دنیس کواید) و همسرش هانا زندگی می کند. در آنجا او به نوه جوانشان سی جی وابسته می شود. هنگامی که گلوریا مادر سی جی تصمیم می گیرد با دخترش ترک کند، سی جی از زندگی اتان ناپدید می شود. مدتی بعد، بیلی به شدت بیمار می شود. درست قبل از اینکه بمیرد، ایتان ی ness/business-news/lewis-hamilton-dawn-apollo-first-look-deal-skydance-sports-1236702336/", "summary": "The Formula 1 driver previously produced the Apple film 'F1.'", "date_str": "2026-09-16T14:30:00+00:00", "hash": "424c5de95997c4bc", "title_fa": "استودیوی سپیده دم آپولو لوئیس همیلتون با Skydance Sports قراردادی را امضا کرد (انحصاری)", "summary_fa": "راننده فرمول 1 قبلاً فیلم اپل \"F1\" را تولید کرده بود. لوئیس همیلتون به دنبال تقویت تجارت سرگرمی خود است. استودیو داون آپولو، ستاره فرمول 1، قراردادی چند ساله و ظاهری با Skydance Sports، بخش سرگرمی های ورزشی در پارامونت اسکای دنس امضا کرده است. طبق این قرارداد، Dawn Apollo محتوایی را در قالب فیلمنامه، بدون فیلمنامه و انیمیشن تولید و تولید می‌کند و همیلتون به عنوان EP در همه پروژه‌ها حضور خواهد داشت. قابل ذکر است که این معامله فراتر از Skydance Sports است و به طور بالقوه شامل سایر بخش‌های پارامونت، از جمله بازی‌های ویدیویی، محصولات مصرفی و سایر حوزه‌ها می‌شود. همیلتون داون آپولو را در سال 2022 راه اندازی کرد و سال گذشته موفق شد در فرمول 1 با بازی برد پیت به عنوان اولین پروژه آن دست یابد. همیلتون تهیه کننده فیلم اپل بود و همچنین به عنوان خودش در این پروژه ظاهر شد. این ستاره توسط جاش پیات در Win Artists نمایندگی می‌شود و اخیراً نائومی رایت، کهنه‌کار Fulwell Entertainment را به‌عنوان معاون ارشد توسعه استخدام کرده است تا به ساخت تخته سنگ کمک کند. البته همیلتون یکی از رانندگان برتر فرمول یک است که برای فراری مسابقه می دهد. من همیشه بر این باور بودم که داستان ها می توانند به مردم کمک کنند دنیا را متفاوت ببینند و گفتگوهای مهمی را ایجاد کنند. این چیزی است که من را در مورد استودیو Dawn Apollo هیجان زده می کند. همیلتون می‌گوید، این به ما این شانس را می‌دهد که از پروژه‌هایی حمایت کنیم که صادقانه، جسورانه و معنادار هستند و فضایی برای صداها و دیدگاه‌هایی ایجاد کنیم که همیشه چنین فرصتی را نداشته‌اند. Skydance Sports می‌داند که ورزش، فرهنگ و سرگرمی چقدر می‌تواند در حرکت مخاطبان قدرتمند باشد، و من هیجان‌زده هستم که با Jesse و تیم همکاری کنم تا آن داستان‌ها را زنده"}, {"source": "Hollywood Reporter", "title": "Unauthorized Book on Bob Iger’s Disney Power Struggle Gets Release Date (Exclusive)", "link": "https://www.hollywoodreporter.com/business/business-news/bob-iger-disney-power-struggle-book-1236702290/", "summary": "Robbie Whelan's 'The House of Mouse' will come out in December, promising the inside scoop on the \"Machiavellian power struggle\" within the company.", "date_str": "2026-09-16T14:00:00+00:00", "hash": "c24380cf9cb6a573", "title_fa": "تاریخ انتشار کتاب غیرمجاز درباره مبارزه با قدرت دیزنی باب ایگر (اختصاصی)", "summary_fa": "«خانه موش» ساخته رابی ویلان در ماه دسامبر اکران خواهد شد و نوید بخش داخلی «مبارزه قدرت ماکیاولیایی» در شرکت را می دهد. کتابی که در آینده و غیرمجاز در مورد باب ایگر و دوران تصدی او در شرکت والت دیزنی منتشر می‌شود، سر و صدای هالیوود دارد. این کتاب با عنوان The House of Mouse: Bob Iger and The War of Succession at Disney قرار است در دسامبر منتشر شود. هالیوود ریپورتر دریافته است که در 1، 2026، طرحی تحریک‌آمیز روی جلدی با تاج تزئین شده با میکی ماوس که روی بالش قرمزی نشسته است (با گاز گرفتن آشکار یکی از گوش‌ها) نشان می‌دهد. توسط رابی ویلان، خبرنگار وال استریت ژورنال، THR می شنود که یکی از موضوعاتی که قرار است پوشش داده شود، دوستی ایگر با آیک پرلموتر، رئیس سابق مارول است. البته ایگر قرارداد 4 میلیارد دلاری مارول را در سال 2009 تنظیم کرد و پرلموتر را به یکی از بزرگترین سهامداران شرکت تبدیل کرد. گفته می‌شود که آن‌ها به هم نزدیک بوده‌اند و ایگر یادداشت‌هایی درباره پروژه‌های مارول ارائه می‌دهد و در مورد مسائل مربوط به جبران خسارت به امپرساریو کتاب کمیک (انتظار می‌رود که هر دو موضوع در کتاب مورد بررسی قرار گیرند) می‌دیدند. در نهایت، البته، این دو در تضاد خواهند بود، به طوری که پرلموتر به دوستش نلسون پلتز کمک می کند تا یک کمپین فعال علیه دیزنی و ایگر را رهبری کند، در حالی که در سال 2023 از دیزنی به میلیاردر نشان داده شد. طبق توضیحات The House of Mouse از ناشر HarperCollins (برای کسانی که متعجب هستند متعلق به Rupert Murdochs Corp.)، کتاب Whelan بر صدها مصاحبه با چهره های کلیدی در مدار ایگر و هزاران صفحه شواهد مستند، از جمله ارتباطات حساس شرکتی و یادداشت های داخلی که قبلاً هر emiere (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/cute-danish-drama-film-san-sebastian-festival-lyngstad-1236703340/", "summary": "From Norwegian filmmaker Marlene Emilie Lyngstad, 'Cute' is set to screen in the New Directors section at the Spanish film festival.", "date_str": "2026-09-16T14:00:00+00:00", "hash": "54e065a116767280", "title_fa": "تریلر «Cute»: Danish Drama Tackling Sexual Taboos قبل از نمایش سن سباستین (اختصاصی)", "summary_fa": "از مارلین امیلی لینگستاد، فیلمساز نروژی، «ناز» قرار است در بخش کارگردانان جدید در جشنواره فیلم اسپانیا به نمایش درآید. هالیوود ریپورتر می تواند تریلر فیلم ناز اولین فیلم مارلین امیلی لینگستاد را که قرار است این هفته در جشنواره فیلم سن سباستین نمایش داده شود، رونمایی کند. فیلم دانمارکی، تقابلی جسورانه با تابوهای جنسی، فتیش و جذب بزرگسالان به کودکان، توسط لینگستاد و امیلی کوفوئد لارس نوشته شده است. داستان مردی به نام ریچارد (جان گونار آر ایسه) را دنبال می کند که از احساسات ممنوعه نسبت به دخترخوانده هفت ساله اش ناراحت است. او تصمیم می گیرد دوست دخترش را ترک کند و به خانه دوران کودکی خود عقب نشینی می کند تا قبل از فروش آن را بازسازی کند، اما تبعید خودخواسته او با حضور کودکانه پرستار مادرش، استلا، مختل می شود. داستان‌های مرتبط فیلم‌ها چرا جورج مک‌کی ستاره حس و احساس هنوز هم فیلم‌های کلاسیک برنده اسکار آنگ لی را تماشا نکرده است. واقعیت ساخته شده آنها زمانی آشکار می شود که دخترخوانده ای که او پشت سر گذاشته است، دست دراز می کند. The Nordisk Film Production که با Film i V st و Amarcord همکاری می‌کند، جینا ژاکلین، یک تأثیرگذار رسانه‌های اجتماعی و خالق OnlyFans که اولین فیلم بلند خود را تولید می‌کند، همبازی است. کارین برتلینگ، مولی کرک راسموسن و کیت مایکن مورتنسن نیز در این فیلم حضور دارند. لینگستاد فیلمساز نروژی گفت: من پذیرفته ام که نمی توانم چیزهایی را که مرا می ترساند و غمگین می کند نادیده بگیرم. به همین دلیل است که از طریق فیلم هایم سعی می کنم بی تفاوتی و مالیخولیا را به کنجکاوی تغییر دهم."}, {"source": "Hollywood Reporter", "title": "Latin Grammy Nominations 2026: Karol G, Rosalia, Jorge Drexler, Ca7riel & Paco Amoroso Lead with 7", "link": "https://www.hollywoodreporter.com/music/music-news/2026-latin-grammy-nominations-list-1236702995/", "summary": "Perennial hitmaker Edgar Barrera was the top nominee overall when including producers and songwriters, earning 10 nominations.", "date_str": "2026-09-16T13:31:00+00:00", "hash": "b59c7ba8de5ffb6c", "title_fa": "نامزدهای گرمی لاتین 2026: کارول جی، روزالیا، خورخه درکسلر، کا7ریل و پاکو آموروسو با 7 نفر پیشتاز هستند.", "summary_fa": "ادگار باررا، سازنده موسیقی چندساله، در مجموع از جمله تهیه‌کنندگان و ترانه‌سراها، با کسب 10 نامزدی، برترین نامزد دریافت جایزه بود. نامزدهای جوایز گرمی لاتین 2026 اینجا هستند، و این یک مساوی چهار طرفه برای پیشروی در میان هنرمندانی است، زیرا کارول جی، روزالیا، خورخه درکسلر و کا7ریل پاکو آموروسو همگی 7 کسب کردند. هر چهار بازیگر در سه رکورد اصلی سال، آلبوم سال و آهنگ سال نامزد دریافت کردند. کارول جی، که در اوایل امسال به عنوان اولین هنرمند لاتینی که عنوان Coachella را عنوان کرد، تاریخ را ثبت کرد، با Coleccionando Heridas برای آلبوم سال و آلبوم سال با Tropicoqueta نامزد شد. La Perla روزالیا برای ضبط و آهنگ آماده است، در حالی که لوکس تحسین شده او برای آلبوم آماده است. داستان‌های مرتبط موسیقی کارول جی با ویاژاندو پور ال موندو تروپیتور موسیقی روسالیا تور لوکس نفس‌گیر و سینمایی خود را به لس‌آنجلس می‌آورد هنگامی که شامل تهیه‌کنندگان و ترانه‌سراهای غیراجرای می‌شود، ادگار باررا، آهنگساز همیشگی، با 10 نامزد برتر در میان نامزدها قرار گرفت. Ca7riel Paco Amoroso، که 10 نامزدی برای جوایز سال گذشته به دست آورد، برای آلبوم سال با Free Spirts، رکورد سال برای Ha Ha و آهنگ سال با Hasta Jesus Tuvo Un Mal Dia نامزد شد. خورخه درکسلر، برنده 16 گرمی لاتین، برای آلبوم سال با Tarac، رکورد و پسر سال برای C mo se ama؟ خارج از چهار آلبوم برتر، بقیه آلبوم سال امسال شامل Anitta s Equilibrium، Silvana Estradas Vendr n Suaves Lluvias، Mon Lafertes Femme Fatale، Carin Leons Muda، Milo Js La Vida Era Ms Corta و Rawayana Afters?"}, {"source": "Hollywood Reporter", "title": "Korean Director Na Hong-jin on the Meaning Behind ‘Hope’ and His Sequel Plans: “Don’t Be Surprised If He Crosses Over to the North”", "link": "https://www.hollywoodreporter.com/movies/movie-features/na-hong-jin-interview-hope-sequel-plans-1236703204/", "summary": "The auteur discusses the unlikely real-life inspiration behind his cosmic action tragedy, the film’s divisive reception and why he may return to bloodier territory before shooting part two: “I can feel the darkness calling to me.”", "date_str": "2026-09-16T13:30:00+00:00", "hash": "33fd0537af417b04", "title_fa": "نا هونگ جین کارگردان کره ای درباره معنای پشت سر «امید» و برنامه های بعدی او: «اگر به شمال رفت تعجب نکنید»", "summary_fa": "نویسنده درباره الهام بعید از زندگی واقعی در پشت تراژدی اکشن کیهانی خود، استقبال تفرقه‌انگیز فیلم و اینکه چرا ممکن است قبل از فیلم‌برداری قسمت دوم به قلمرو خونین‌تر بازگردد، می‌گوید: «می‌توانم احساس کنم تاریکی مرا فرا می‌خواند». این یک خودپسندی غیرقابل مقاومت است: اگر فیلم فلان فرنچایز توسط یک نویسنده هنری که به خاطر دیدگاه منحصربه‌فرد و سازش ناپذیرش مشهور است کارگردانی می‌شد، چه شکلی به نظر می‌رسید؟ مثلاً بگویید که لارس فون تریر سکان هدایت فیلم بعدی انتقام جویان را بر عهده گرفت، دیوید کراننبرگ فیلم Jurassic World 5 را کارگردانی کرد، یا وس اندرسون به طور غیرقابل توضیحی برای فیلمبرداری مجدد Fast Furious 11 همراه شد. گربه ای برای مکالمه با علاقه به فیلم، اما به ندرت فیلمی از راه می رسد که پاسخی تقریبی داشته باشد. امیدوارم، پیشنهاد دادن به آن بی انصافی نیست، در واقع اینطور است. در نهایت، این آواتار است اگر توسط استاد کره جنوبی، ناهنگ جین، پرچمدار کنونی سنت غنی سینمای ژانر سرگرم‌کننده کشورش، مملو از رگه‌ای بیمارگونه و آسیب‌دیده، کارگردانی شود. داستان‌های مرتبط فیلم‌ها اسکار: اسپانیا La Bola Negra را برای بهترین فیلم بین‌المللی مسابقه تلویزیونی Pride و Prejudice انتخاب می‌کند تاریخ اکران در نتفلیکس، عکس‌های کامل بازیگران رونمایی شد. فیلم‌های هیجان‌انگیز The Chaser (2008) و The Yellow Sea (2010) و حس ترسناک فراطبیعی The Wailing (2016). Hope که در 9 سپتامبر در سینماهای آمریکای شمالی به‌خاطر نئون اکران شد، عناصر بسیاری را با آثار قبلی به الف، مدیر عامل Red Seat Ventures، گفت که کالب با پرداختن به موضوعی که می تواند با صداقت، شوخ طبعی و هدف واقعی، یک ارتباط فوق العاده با مخاطبان خود ایجاد کند. حسابرسی مالی بیش از یک نمایش است، بلکه یک امتیاز قابل اعتماد و بسیار جذاب است که ابزارهای عملی را برای بهبود زندگی به افراد می دهد. ما خوشحالیم که با کالب و تیمش همکاری می کنیم زیرا آنها برند را گسترش می دهند و حتی به افراد بیشتری دسترسی پیدا می کنند."}, {"source": "Hollywood Reporter", "title": "The Female Quotient Signs With CAA (Exclusive)", "link": "https://www.hollywoodreporter.com/business/business-news/the-female-quotient-caa-1236702447/", "summary": "The media company for businesswomen reaches 8 million people across 30 industries.", "date_str": "2026-09-16T13:00:00+00:00", "hash": "dc8bd764a1cbb07a", "title_fa": "نشانه های ضریب زن با CAA (انحصاری)", "summary_fa": "شرکت رسانه ای برای زنان تاجر به 8 میلیون نفر در 30 صنعت می رسد. The Female Quotient، یک شرکت رسانه ای برای زنان تاجر جاه طلب، با CAA برای نمایندگی قرارداد امضا کرده است. FQ به یک شرکت رسانه‌ای و تجربی تبدیل شده است که آژانس می‌گوید از طریق تعامل محتوایی و گسترش فرهنگی به بیش از 8 میلیون عضو با نفوذ در 30 صنعت دسترسی دارد. تیم CAA Entertainment Partnerships به دنبال گسترش مشارکت برند برای The FQ و گسترش روابط با برندهای برتر جهانی است. شرکای اصلی که The FQ قبلاً با آنها کار می کند عبارتند از Paramount، Amazon، New York Times، Hulu، National Geographic و Comic Relief. تمرکز بر اتصال The FQ به دسته‌های برند مانند خودرو، زیبایی، فناوری، خدمات مالی و خطوط هوایی خواهد بود. FQ که توسط پیشگام صنعت تحقیقات شلی زالیس تأسیس شد، تجربیات زنده ممتاز، محتوای اجتماعی و برنامه‌نویسی اصلی را ارائه می‌دهد. این شرکت رسانه‌ای علاوه بر سالن FQ و نشست‌های خود، برنامه‌نویسی تجربی، رسانه و مشاوره را در بر می‌گیرد زیرا برندهای برتر را با رهبران تجاری تأثیرگذار در سراسر جهان مرتبط می‌کند. به عنوان مثال، این شرکت رسانه ای FQ Lounge امضا شده خود را برای تشویق گفتگو در مورد زنان در تجارت به رویدادهای جهانی مانند داووس، Cannes Lions، CES و Super Bowl و رویدادهای ورزشی فرمول 1 آورده است. محتوای رسانه‌ای FQ شامل مجموعه‌های رسانه‌های اجتماعی اصلی، محتوای برند سفارشی، و سریال‌هایی مانند 5 Hour In که توسط سازنده‌ها هدایت می‌شود، با همکاری هتل‌ها دات کام که چهار سازنده دیجیتال را دنبال می‌کند، هر کدام پنج ساعت فرصت دارند تا در ونکوور، سانفرانسیسکو، لس‌آنجلس و شهر نیویورک بهترین استفاده را از زمان خود داشته باشند."}, {"source": "Hollywood Reporter", "title": "Jalen Brunson Gets Into the Brand Management Business With New Family Venture", "link": "https://www.hollywoodreporter.com/business/business-news/jalen-brunson-new-company-thirty-third-management-brand-1236703363/", "summary": "Thirty Third Management will work with athletes, entrepreneurs and executives, including Brunson's own off-court business.", "date_str": "2026-09-16T12:58:11+00:00", "hash": "e03d61a1cf526c1e", "title_fa": "جالن برانسون با سرمایه گذاری خانوادگی جدید وارد تجارت مدیریت برند می شود", "summary_fa": "مدیریت سی و سوم با ورزشکاران، کارآفرینان و مدیران اجرایی، از جمله تجارت خارج از زمین خود برانسون، کار خواهد کرد. جالن برانسون در حال ورود به تجارت مدیریت است. ستاره نیویورک نیکس در حال راه اندازی یک شرکت جدید با اعضای خانواده اش است که تجارت خارج از زمین او را مدیریت می کند و در عین حال مشتریان دیگری از دنیای ورزش و تجارت را نیز نمایندگی می کند. سرمایه گذاری جدید سی و سومین مدیریت (به افتخار انتخاب برانسون در درفت NBA 2018) نامیده می شود که مادر برانسون ساندرا برانسون به عنوان رئیس آن و خواهرش اریکا برانسون به عنوان مدیر خدمات مشتریان آن کار می کنند. هم تیمی و دوست برانسون در دبیرستان، کانر کشاو، مدیر توسعه تجارت خواهد بود. در حالی که مشخصاً Thirty Third برانسون را به عنوان مشتری اصلی خود خواهد داشت، این شرکت قصد دارد به طور تهاجمی برای نمایندگی ورزشکاران حرفه ای و آماتور (با بهره گیری از قوانین NIL)، و همچنین مدیران شرکت ها، کارآفرینان، و بنیادهای خیریه حرکت کند و به آنها در مشارکت و توسعه برند، مشارکت، بشردوستی و سایر زمینه ها کمک کند. شایان ذکر است که این شرکت می گوید که قصد دارد ورزش های حرفه ای زنان را در اولویت اولیه قرار دهد و اریکا برانسون این تلاش را رهبری می کند. ورزشکاران به طور فزاینده ای فراتر از میدان و دادگاه پیش می روند و از شهرت و شهرت خود برای راه اندازی سرمایه گذاری های تجاری جدید استفاده می کنند. بسیاری در حال راه‌اندازی استودیوها یا شرکت‌های تولید هستند و به دنبال ایجاد بخشی از رسانه و اکوسیستم سرگرمی هستند، اما تلاش برانسون نشان می‌دهد که چگونه در پشت صحنه فرصتی برای کمک به ورزشکاران و دیگران برای مدیریت برندهایشان وجود دارد. جالن برانسون گفت که خانواده من در تمام مراحل با"}, {"source": "Variety", "title": "‘The Wire’ and ‘It’ Actor James Ransone Was Excluded From Emmys and Oscars In Memoriam Tributes; His Wife Says ‘It’s Simply Not Right’", "link": "https://variety.com/2026/tv/news/james-ransone-excluded-emmys-oscars-in-memoriam-wife-1236864048/", "summary": "James Ransone s widow Jamie McPhee is calling out the Television Academy for excluding the late actor during the Emmys In Memoriam tribute, which marked the second time this year Ransone was snubbed by a major awards ceremony. The Oscars also excluded the actor from its own In Memoriam segment in March. Ransone broke out on [ ]", "date_str": "2026-09-16T14:25:17+00:00", "hash": "648371a3411b0ad1", "title_fa": "جیمز رانسون بازیگر «The Wire» و «It» از جوایز امی و اسکار در مراسم بزرگداشت یادبود حذف شد. همسرش می گوید \"به سادگی درست نیست\"", "summary_fa": "جیمی مک فی، بیوه جیمز رانسون، از آکادمی تلویزیون به دلیل کنار گذاشتن این بازیگر فقید در جریان مراسم ادای احترام به Emmys In Memoriam، که برای دومین بار در سال جاری بود، از آکادمی تلویزیون درخواست کرد. اسکار همچنین این بازیگر را از بخش In Memoriam خود در ماه مارس حذف کرد. مک فی در استوری اینستاگرام خود پس از امی (از طریق Entertainment Weekly) نوشت: رانسون در تاریخ [ ] درگیر شد. او همچنین در اوایل سال جاری در اسکار حضور نداشت. پی جی غیرممکن، دوست داشتنی، غیرقابل تحمل و باورنکردنی بود بستگی به این دارد که از چه کسی بپرسید. اما بدون شک او یک بازیگر بزرگ بود. اما خبر خوب این است که PJ اهمیتی نمی دهد. او در واقع فکر می کند خنده دار است. محبوب در Variety McPhee در یک پست بعدی اضافه کرد: من امی را تماشا نکردم، بنا     const archiveManifest = [{"date_key": "2026-09-16", "p_date": "۲۵ شهریور ۱۴۰۵", "g_date": "۱۶ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-16.html"}, {"date_key": "2026-09-15", "p_date": "۲۴ شهریور ۱۴۰۵", "g_date": "۱۵ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-15.html"}, {"date_key": "2026-09-14", "p_date": "۲۳ شهریور ۱۴۰۵", "g_date": "۱۴ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-14.html"}, {"date_key": "2026-09-13", "p_date": "۲۲ شهریور ۱۴۰۵", "g_date": "۱۳ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-13.html"}, {"date_key": "2026-09-12", "p_date": "۲۱ شهریور ۱۴۰۵", "g_date": "۱۲ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-12.html"}, {"date_key": "2026-09-11", "p_date": "۲۰ شهریور ۱۴۰۵", "g_date": "۱۱ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
