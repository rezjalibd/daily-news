و دیگران متعهد شده‌اند که از پروژه ایستگاه کیپ Fervo که در یوتا قرار دارد، نیرو بخرند. Fervo یکی از چندین شرکتی است که نیروگاه های زمین گرمایی پیشرفته را توسعه می دهد."}, {"source": "TechCrunch Main", "title": "This startup wants to turn idle car inventory into rental revenue", "link": "https://techcrunch.com/2026/10/01/this-startup-wants-to-turn-idle-car-inventory-into-rental-revenue/", "summary": "When Igor Dobrianskyi looks at a car dealership lot, he doesn't see rows of cars — he sees millions of dollars just sitting there, depreciating. Come see MyMonthlyCar in the Startup Battlefield 200 at TechCrunch Disrupt, taking place October 13 to 15 in San Francisco.", "date_str": "2026-10-01T17:09:00+00:00", "hash": "faefcc47963ad058", "title_fa": "این استارت آپ می خواهد موجودی خودروهای بیکار را به درآمد اجاره تبدیل کند", "summary_fa": "وقتی ایگور دوبریانسکی به یک فروشگاه خودرو نگاه می‌کند، ردیف ماشین‌ها را نمی‌بیند - او می‌بیند که میلیون‌ها دلار فقط در آنجا نشسته‌اند و ارزششان کاهش می‌یابد. بیایید MyMonthlyCar را در Startup Battlefield 200 در TechCrunch Disrupt ببینید که از 13 تا 15 اکتبر در سانفرانسیسکو برگزار می شود. دوبریانسکی در مصاحبه اخیر خود با بیان اینکه میلیون ها و میلیون ها خودروی فرسوده در پارکینگ ها نشسته اند، مستهلک شده و ارزش خود را از دست می دهند، گفت: 76000 نمایندگی در ایالات متحده وجود دارد. در عین حال، افرادی هستند که برای چند ماه نیاز به ماشین دارند، اما آپشن ها در واقع بسیار محدود و گران هستند. استارت‌آپ جدید Dobrianskyi، MyMonthlyCar، قصد دارد هر دو طرف این معادله را از طریق یک پلتفرم آنلاین که اجاره ماه به ماه انعطاف‌پذیر از نمایندگی‌های محلی ارائه می‌دهد، به هم متصل کند. MyMonthlyCar برای استارت‌آپ Battlefield 200 در سال 2026 انتخاب شد، گروهی از استارت‌آپ‌های امیدوارکننده در مراحل اولیه که توانسته‌اند در نمایشگاه TechCrunch Disrupt امسال که 13 تا 15 اکتبر در سانفرانسیسکو برگزار می‌شود، به نمایش بگذارند. MyMonthlyCar، که در دلاور ثبت شده و در فلوریدا مستقر است، توسط Dobrianskyi تاسیس شد. CPO Kostiantyn Gitko; و CTO Vadym Zotov. دوبریانسکی که به ایالات متحده نقل مکان کرد، گفت که هر سه از اوکراین هستند. با همسر و دختر خردسالش پس از شروع جنگ روسیه و اوکراین. MyMonthlyCar همان کاری را انجام می دهد که نامش نشان می دهد، با یک پیچ: این استارتاپ فقط ماشین های دست دوم را به صورت ماه به ماه اجاره می کند. هیچ گزینه کوتاه مدتی در اینجا وجود ندارد. اما این به نمایندگی ها این فرصت را می دهد که به مشتریان گزینه اجاره به مالکیت را ارائه دهند. بنابراین ما به آنها فقط مشتریان را به صورت ماهانه اجاره نمی دهیم. او"}, {"source": "TechCrunch Main", "title": "California governor vetoes bill banning use of ‘pervert glasses’ to secretly record people", "link": "https://techcrunch.com/2026/10/01/california-governor-vetoes-bill-banning-use-of-pervert-glasses-to-secretly-record-people/", "summary": "The California state bill would have penalized people who secretly recorded people in public with wearables equipped with cameras and microphones.", "date_str": "2026-10-01T16:35:25+00:00", "hash": "ea8aac6de4cd0489", "title_fa": "فرماندار کالیفرنیا لایحه ممنوعیت استفاده از «عینک منحرف» برای ضبط مخفیانه افراد را وتو کرد", "summary_fa": "لایحه ایالتی کالیفرنیا افرادی را که به طور مخفیانه افراد را در مکان های عمومی با ابزارهای پوشیدنی مجهز به دوربین و میکروفون ضبط می کردند، مجازات می کرد. فرماندار کالیفرنیا، گاوین نیوسام، از حق وتوی خود برای ارسال لایحه ای که توسط قانونگذار ایالتی تصویب شده است برای قانونگذاران استفاده کرده است، که ضبط مخفیانه افراد با دستگاه های ضبط پوشیدنی را غیرقانونی می کند. نیوسام روز چهارشنبه در نامه ای به قانونگذاران گفت که از امضای پیش نویس قانون، لایحه 1130 سنای کالیفرنیا خودداری کرده است، به این دلیل که دستگاه های ضبط پوشیدنی را بسیار گسترده یا نادقیق تعریف می کند و این می تواند منجر به سردرگمی و عواقب ناخواسته شود. نیوسام افزود که لایحه پیشنهادی همچنین شامل حمایت هایی است که قبلاً در قانون کالیفرنیا وجود دارد. این لایحه می‌تواند کالیفرنیا را به اولین ایالتی تبدیل کند که استفاده از عینک‌های هوشمند را تنظیم می‌کند، زیرا کشورهایی مانند نروژ به دنبال ممنوعیت بالقوه این فناوری هستند. اگر قانون کالیفرنیا تصویب می شد، متخلفان ممکن است با جریمه یا زندان مواجه شوند، در حالی که سازندگان پوشیدنی که قوانین را رعایت نمی کردند نیز با جریمه مواجه می شدند. این لایحه به دنبال جلوگیری از ضبط افراد در مکان‌های عمومی بدون رضایت صریح آن‌ها بود، در میان افزایش تعداد محصولات پوشیدنی حاوی دوربین‌ها و میکروفون‌هایی که همیشه به همه چیز اطراف گوش می‌دهند و ضبط می‌کنند، مانند عینک‌های متصل به اینترنت ساخته‌شده توسط متا و اسنپ. متا تنها در سال گذشته بیش از 7 میلیون عینک پوشیدنی فروخت. چندین ابزار پوشیدنی سخت افزاری دیگر، مانند آویزهای مجهز به هوش مصنوعی، با واکنش های متفاوتی عرضه شده اند. به نقل از ای‌بی‌سی نیوز، نویسنده این لایحه، سناتور ایالت کالیفرنیا، الوئیز گومز ریس، گفته است که هدف این لایحه کمک به کالیفرنیا در واکنش به گسترش سریع فناوری‌های"}, {"source": "VentureBeat Tech", "title": "Amazon unveils a free, fast, open source Jev killer: Strands Decider 2B makes decisions in fractions of a second", "link": "https://venturebeat.com/technology/amazon-unveils-a-free-fast-open-source-jev-killer-strands-decider-2b-makes-decisions-in-fractions-of-a-second", "summary": "The race to make AI agents cheaper and faster is moving beyond the models that write their answers. In the two weeks since TypeSafe AI introduced Jev, a model that chooses among predefined options instead of generating prose, developers have released a rush of competing decision models, many with downloadable weights. Read more", "date_str": "2026-10-01T16:43:09+00:00", "hash": "d5438e8576c9b70a", "title_fa": "آمازون یک کشنده رایگان، سریع و منبع باز Jev را معرفی کرد: Strands Decider 2B در کسری از ثانیه تصمیم می گیرد", "summary_fa": "رقابت برای ارزان‌تر و سریع‌تر کردن عوامل هوش مصنوعی فراتر از مدل‌هایی است که پاسخ‌هایشان را می‌نویسند. در طی دو هفته از زمانی که TypeSafe AI Jev را معرفی کرد، مدلی که به جای تولید نثر، از بین گزینه‌های از پیش تعریف شده انتخاب می‌کند، توسعه‌دهندگان مجموعه‌ای از مدل‌های تصمیم‌گیری رقیب را منتشر کرده‌اند که بسیاری از آنها وزن‌های قابل دانلودی دارند. ادامه مطلب"}, {"source": "Ars Technica", "title": "TCL is right to question Samsung’s use of the term “Mini LED”", "link": "https://arstechnica.com/gadgets/2026/10/tcl-is-right-to-question-samsungs-use-of-the-term-mini-led/", "summary": "What makes a display a Mini LED display? It's a question that sounds like it should have a simple answer. But it's now at the center of a lawsuit between two of the biggest names in TVs, with TCL accusing its longtime competitor Samsung of falsely advertising budget LCD-LED TVs as Mini LED sets. TCL may have a point. Samsung's M-series TVs, which range from $300 for a 43-inch model to $2,300 for a 100-inch model, do raise some legitimate questions about what should qualify as Mini LED. More broadly, though, the dispute highlights a problem for shoppers: Without agreed-upon standards for what \"Mini LED\" actually means, manufacturers have plenty of room to define the technology for themselves. Read full article Comments", "date_str": "2026-10-02T10:30:11+00:00", "hash": "8171614281dd6798", "title_fa": "TCL حق دارد استفاده سامسونگ از عبارت Mini LED را زیر سوال ببرد.", "summary_fa": "چه چیزی یک صفحه نمایش را یک صفحه نمایش مینی LED می کند؟ این سوالی است که به نظر می رسد باید یک پاسخ ساده داشته باشد. اما اکنون در مرکز دعوای دو نفر از بزرگ‌ترین نام‌های تلویزیون قرار دارد و TCL رقیب دیرینه خود سامسونگ را به تبلیغات دروغین تلویزیون‌های LCD-LED ارزان قیمت به عنوان مجموعه‌های مینی LED متهم می‌کند. TCL ممکن است یک نکته داشته باشد. تلویزیون های سری M سامسونگ که از 300 دلار برای مدل 43 اینچی تا 2300 دلار برای مدل 100 اینچی متغیر است، سؤالات درستی در مورد اینکه چه چیزی باید به عنوان Mini LED واجد شرایط باشد، ایجاد می کند. با این حال، به طور گسترده تر، این اختلاف یک مشکل را برای خریداران برجسته می کند: بدون استانداردهای توافق شده برای معنای واقعی \"Mini LED\"، تولید کنندگان فضای زیادی برای تعریف این فناوری برای خود دارند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری چه چیزی یک نمایشگر را یک نمایشگر LED کوچک می کند؟ این سوالی است که به نظر می رسد باید پاسخ ساده ای داشته باشد. اما اکنون در مرکز دعوای دو نفر از بزرگ‌ترین نام‌های تلویزیون قرار دارد و TCL رقیب دیرینه خود سامسونگ را به تبلیغات دروغین تلویزیون‌های LCD-LED ارزان قیمت به عنوان مجموعه‌های LED کوچک متهم می‌کند. در دادخواستی (PDF) که در اواخر ماه اوت در دادگاه منطقه ای ایالات متحده برای ناحیه مرکزی کالیفرنیا ارائه شد، TCL سامسونگ را متهم کرد که برای رقابت با تلویزیون های LED مینی LED سری QM TCL به «کلاهبرداری» متوسل شده است. M70H، M80H و M90H سامسونگ «فقط بازیافتی هستند... تلویزیون‌های LED استاندارد از قبل موجود، ارزان‌قیمت، [که سطح ابتدایی سامسونگ هستند] Crystal UHD… دوباره برچسب‌گذاری"}, {"source": "Ars Technica", "title": "Venus' mysterious haze is actually cosmic dust", "link": "https://arstechnica.com/science/2026/10/venus-mysterious-haze-is-actually-cosmic-dust/", "summary": "Venus is shrouded in a veil of mystery. The yellowish “lower haze” at the bottom of its atmosphere was discovered by the Venera and Pioneer Venus probes in the 1970s. These spacecraft were some of the first to successfully send images of the planet back to Earth, but the haze they saw went unexplained for decades. Now the mystery Venus was keeping has been unveiled. What nobody knew then was that the haze is an accumulation of particles from meteorites. “Shooting stars” that burn up in the atmosphere leave behind cosmic dust particles, and after sulfuric acid interacts with these particles, it leaves behind a haze. Planetary scientist Hiroki Karyu and his research team at Tohoku University in Sendai City, Japan, finally figured out how the haze formed using a microphysical model. This type of model involves microphysics —the micro-scale processes that create clouds and precipitation on Earth and other bodies. “The continuous influx of cosmic dust is sufficient to sustain this lower haze layer with the particle size distribution observed by the entry probes,” Karyu said in a study published in Nature Astronomy. “These haze particles of cosmic origin act as efficient condensation nuclei, promoting cloud formation in the main cloud deck even far from their initial source.” Read full article Comments", "date_str": "2026-10-01T22:27:04+00:00", "hash": "1731461def2bde2d", "title_fa": "مه مرموز زهره در واقع غبار کیهانی است", "summary_fa": "زهره در پرده ای از رمز و راز پوشیده شده است. در دهه 1970 کاوشگرهای Venera و Pioneer Venus کاوشگرهای Venera و Pioneer Venus کاوشگرهای ناهید ونوس آن را به رنگ زرد مایل به \"مه پایین تر\" در پایین جو آن کشف کردند. این فضاپیماها از جمله اولین فضاپیماهایی بودند که با موفقیت تصاویری از این سیاره را به زمین فرستادند، اما مهی که آنها دیدند برای چندین دهه غیرقابل توضیح بود. اکنون رمز و رازی که زهره از آن نگهداری می کرد، فاش شده است. چیزی که در آن زمان هیچ کس نمی دانست این بود که مه انباشته شدن ذرات شهاب سنگ است. «ستاره‌های تیرانداز» که در جو می‌سوزند، ذرات غبار کیهانی را از خود به جای می‌گذارند و پس از تعامل اسید سولفوریک با این ذرات، مه‌ای از خود به جا می‌گذارند. سیاره‌شناس هیروکی کاریو و تیم تحقیقاتی او در دانشگاه توهوکو در شهر سندای ژاپن، سرانجام با استفاده از یک مدل میکروفیزیکی متوجه شدند که مه چگونه شکل گرفته است. این نوع مدل شامل میکروفیزیک است - فرآیندهای در مقیاس خرد که ابرها و بارندگی را روی زمین و دیگر اجرام ایجاد می کند. کاریو در مطالعه ای که در Nature Astronomy منتشر شده است، گفت: «هجوم مداوم غبار کیهانی برای حفظ این لایه مه پایین با توزیع اندازه ذرات مشاهده شده توسط کاوشگرهای ورودی کافی است. این ذرات مه با منشأ کیهانی به عنوان هسته‌های تراکم کارآمد عمل می‌کنند و تشکیل ابر را در عرشه ابر اصلی حتی دور از منبع اولیه خود ترویج می‌کنند.» مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش زهره در پرده ای از رمز و راز پوشیده شده است. در دهه 1970 کاوشگرهای Venera و Pioneer Venus کاوشگرهای"}, {"source": "Ars Technica", "title": "SpaceX describes surgical intervention before launch of latest crew mission", "link": "https://arstechnica.com/space/2026/10/spacex-describes-surgical-intervention-before-launch-of-latest-crew-mission/", "summary": "A four-person crew rocketed into orbit Thursday from Cape Canaveral Space Force Station, Florida, heading for a six-month expedition on the International Space Station. Riding a Falcon 9 rocket and Dragon spacecraft, the four crew members departed from Space Launch Complex-40 at Cape Canaveral at 11:10 am EDT (15:10 UTC) Thursday. Nine minutes later, they were in orbit to begin closing in on the space station for docking Thursday evening. The launch was delayed from mid-September to replace a balky valve in the Dragon spacecraft's propulsion system, a task that involved cutting into a propellant line inside the ship to swap out a faulty component. Read full article Comments", "date_str": "2026-10-01T22:07:33+00:00", "hash": "83c920d3418a80b5", "title_fa": "SpaceX مداخله جراحی قبل از پرتاب آخرین ماموریت خدمه را توصیف می کند", "summary_fa": "یک خدمه چهار نفره روز پنجشنبه از ایستگاه نیروی فضایی کیپ کاناورال، فلوریدا، به مدار زمین رفتند و برای یک سفر شش ماهه در ایستگاه فضایی بین المللی حرکت کردند. چهار خدمه سوار بر موشک فالکون 9 و فضاپیمای دراگون، ساعت 11:10 صبح به وقت شرقی (15:10 UTC) پنجشنبه از مجتمع پرتاب فضایی-40 در کیپ کاناورال حرکت کردند. نه دقیقه بعد، آنها در مدار بودند تا عصر پنجشنبه برای لنگر انداختن به ایستگاه فضایی نزدیک شوند. پرتاب از اواسط سپتامبر به تعویق افتاد تا یک دریچه ضخیم در سیستم پیشران فضاپیمای دراگون جایگزین شود، وظیفه ای که شامل بریدن در یک خط پیشران در داخل کشتی برای تعویض یک جزء معیوب بود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید خدمه چهار نفره روز پنجشنبه از ایستگاه نیروی فضایی کیپ کاناورال، فلوریدا به مدار زمین پرتاب شدند و برای یک سفر شش ماهه در ایستگاه فضایی بین المللی حرکت کردند. جسیکا واتکینز، زمین شناس 38 ساله ای که تبدیل به فضانورد شده است، خدمه چهار نفره ای را هدایت می کند که روز پنجشنبه به مدار فرستاده شد و اولین زن سیاه پوستی است که یک فضاپیما را فرماندهی می کند. واتکینز پس از گذراندن 170 روز در مدار در یک پرواز فضایی طولانی مدت در سال 2022، تنها فضانورد باسابقه در این مأموریت است - که Crew-13 نام گرفت. دو خدمه بین المللی تیم Crew-13 را تکمیل کردند: جاشوا کوتریک، فضانورد کانادایی، خلبان سابق نیروی هوایی سلطنتی کانادا، و سرگئی تتریاتنیکوف، فضانورد روسی که قبل از انتخابش در سپاه فضانوردان روسکوسموس در سال 2021 به عنوان مهندس نیروی دریایی خدمت می کرد."}, {"source": "Ars Technica", "title": "Hacks of 2 federal agencies in a month have spilled a bonanza of sensitive data", "link": "https://arstechnica.com/security/2026/10/hacks-of-2-federal-agencies-in-a-month-have-spilled-a-bonanza-of-sensitive-data/", "summary": "The Pentagon is informing more than 2 million current and former military members that their personnel records storing sensitive personal information were stolen over a monthslong compromise of one of its networks. The breach is the second one in recent months to expose sensitive government information. The records, according to one notification letter posted to Reddit, included Social Security numbers, names, addresses, sex, race, and occupational specialty. This last category could be particularly valuable to foreign adversaries because it could help their intelligence agencies in identifying high-value military personnel. Starting last October, hackers gained access to a system operated by the Defense Manpower Data Center , which collates Department of Defense personnel records. The Pentagon says that the breach compromised the records of 2.8 million living individuals. A potential boon The incident is the second time a major network breach in recent months has exposed sensitive US government personnel records that criminal groups or foreign adversaries could use. Last month, the ransomware group ShinyHunters claimed it hacked into FBI systems and stole records of thousands of the agency’s current or former employees. Reuters reported the job titles in the records included ones related to investigating China or Russia. Read full article Comments", "date_str": "2026-10-01T20:28:45+00:00", "hash": "21db5d62b3d90999", "title_fa": "هک 2 آژانس فدرال در یک ماه، حجم زیادی از داده های حساس را منتشر کرده است", "summary_fa": "پنتاگون به بیش از 2 میلیون نظامی فعلی و سابق اطلاع می‌دهد که سوابق پرسنل آنها که اطلاعات شخصی حساس را ذخیره می‌کردند طی یک ماه در معرض خطر قرار گرفتن یکی از شبکه‌هایش به سرقت رفته است. این نقض دومین مورد در ماه های اخیر است که اطلاعات حساس دولتی را افشا می کند. این سوابق، طبق یک نامه اطلاع رسانی ارسال شده به Reddit، شامل شماره تامین اجتماعی، نام، آدرس، جنسیت، نژاد و تخصص شغلی است. این دسته آخر می تواند به ویژه برای دشمنان خارجی ارزشمند باشد زیرا می تواند به سازمان های اطلاعاتی آنها در شناسایی پرسنل نظامی با ارزش کمک کند. از اکتبر گذشته، هکرها به سیستمی که توسط مرکز داده نیروی انسانی دفاعی اداره می‌شود، دسترسی پیدا کردند که سوابق پرسنل وزارت دفاع را جمع‌آوری می‌کند. پنتاگون می گوید که این نقض رکورد 2.8 میلیون فرد زنده را به خطر انداخت. یک موهبت بالقوه این حادثه دومین باری است که یک رخنه شبکه بزرگ در ماه‌های اخیر سوابق حساس پرسنل دولت ایالات متحده را که گروه‌های جنایتکار یا دشمنان خارجی می‌توانند از آن استفاده کنند، افشا می‌کند. ماه گذشته، گروه باج افزار ShinyHunters ادعا کرد که سیستم های FBI را هک کرده و سوابق هزاران کارمند فعلی یا سابق آژانس را به سرقت برده است. رویترز گزارش داد که عناوین شغلی موجود در سوابق شامل عناوین مربوط به تحقیق در مورد چین یا روسیه است. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید پنتاگون به بیش از 2 میلیون نظامی فعلی و سابق اطلاع می دهد که سوابق پرسنل آنها که اطلاعات شخصی حساس را ذخیره می کنند طی یک ماه در معرض خطر قرار گرفتن یکی از شبکه هایش به سرقت رفته"}, {"source": "Ars Technica", "title": "Judge dismisses Chegg and Penske antitrust lawsuits targeting Google AI search", "link": "https://arstechnica.com/google/2026/10/antitrust-lawsuits-targeting-google-ai-search-dismissed-by-federal-judge/", "summary": "In a setback for publishers worried about the effects of AI search, a US federal judge has dismissed lawsuits filed by Chegg and Penske Media against Google. The companies accused Google of antitrust violations in products like AI overviews, which have led to decreasing traffic at numerous sites. However, US District Judge Amit Mehta has ruled that Google's conduct is not illegal under antitrust law. The lawsuits were filed in 2025 , and Google requested a dismissal earlier this year. Chegg, an education and learning platform, claimed in its lawsuit that Google illegally scraped its educational content. This allowed Gemini models to essentially recreate that content and reduce the site's traffic. Penske, which owns publications like Rolling Stone and Variety, filed a similar case that alleged lost traffic . Specifically, the publisher claimed it was unfair that sites indexed for organic search would also have their content harvested for AI answers, with no way to opt out. These arguments did not sway the judge, who noted that Google's implicit agreement with websites is not legally relevant. \"Plaintiffs have pleaded only that they have an ‘expectation’ that Google will send them search ​traffic if they make their content available for free,\" wrote Mehta. \"But an expectation is not an agreement. It is simply how a general search engine works.\" Read full article Comments", "date_str": "2026-10-01T20:11:55+00:00", "hash": "318e1f1aac16c61e", "title_fa": "قاضی شکایت های ضد انحصار Chegg و Penske را که جستجوی هوش مصنوعی گوگل را هدف قرار داده بود رد می کند", "summary_fa": "یک قاضی فدرال ایالات متحده در یک شکست برای ناشران نگران اثرات جستجوی هوش مصنوعی، شکایت های Chegg و Penske Media علیه گوگل را رد کرد. این شرکت‌ها گوگل را به نقض قوانین ضد انحصار در محصولاتی مانند مرورهای هوش مصنوعی متهم کردند که منجر به کاهش ترافیک در سایت‌های متعدد شده است. با این حال، قاضی ناحیه ایالات متحده آمیت مهتا حکم داده است که رفتار گوگل بر اساس قانون ضد تراست غیرقانونی نیست. این شکایت ها در سال 2025 ثبت شد و گوگل در اوایل سال جاری درخواست اخراج کرد. Chegg، یک پلتفرم آموزشی و یادگیری، در شکایت خود ادعا کرد که گوگل به طور غیرقانونی محتوای آموزشی آن را حذف کرده است. این به مدل‌های Gemini اجازه داد تا اساساً آن محتوا را بازسازی کنند و ترافیک سایت را کاهش دهند. Penske که صاحب نشریاتی مانند Rolling Stone و Variety است، پرونده مشابهی را تشکیل داد که ادعا می‌کرد ترافیک از دست رفته است. به طور خاص، ناشر ادعا کرد که غیرمنصفانه است که سایت‌هایی که برای جستجوی ارگانیک فهرست‌بندی شده‌اند، محتوای آنها برای پاسخ‌های هوش مصنوعی جمع‌آوری شود، بدون هیچ راهی برای انصراف. این استدلال‌ها قاضی را تحت تأثیر قرار نداد، زیرا وی خاطرنشان کرد که توافق ضمنی Google با وب‌سایت‌ها از نظر قانونی مرتبط نیست. مهتا نوشت: «شاکی‌ها فقط ادعا کرده‌اند که «انتظار» دارند که اگر محتوای خود را به‌صورت رایگان در دسترس قرار دهند، گوگل برای آنها ترافیک جستجو ارسال کند. \"اما انتظار یک توافق نیست. این به سادگی نحوه کار یک موتور جستجوی عمومی است.» مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید در یک شکست برای ناشران که نگران اثرات جستجوی هوش مصنوعی هستند، یک قاضی فدرال ایالات متحده شکایت های مطرح شده توسط Chegg"}, {"source": "Ars Technica", "title": "Can good design stop content creators from having sex in robotaxis?", "link": "https://arstechnica.com/cars/2026/10/can-good-design-stop-content-creators-from-having-sex-in-robotaxis/", "summary": "Humans can be a frisky bunch, and it wasn’t very long after Tesla Autopilot started letting drivers go hands-free before people decided to post footage of themselves having sex from the driver’s seat. Recently, The San Francisco Standard interviewed multiple people who claimed to have had sex in robotaxis belonging to General Motors’ now-defunct Cruise. “There’s no one to tell you, 'You can’t do that.' It gets to the point where you’re more and more and more comfortable, and if you’re with someone, like a more serious partner, it can escalate to other activities,” one man told SF Standard. “The interiors of vehicles has been sexualized and appropriated for sex since forever in popular culture. You can see it in movies, you can see it in lyrics, you can see it in photography,” said Alexandros Rouchitsas, a human factors/UX researcher and one of the organizers of a recent workshop, “ Love in Traffic ,” that brought researchers from academia and industry together in late September in Sweden to consider how design can help the problem. A growing problem? One difference between a robotaxi and a human-driven ride is the removal of the social obligation to interact with a human driver. There’s no need to make small talk, and you won’t have to listen to someone’s terrible opinion, which can lead to riders assuming far more privacy than the cameras and ridership terms and conditions provide. That's a lesson that a pair of teens who hired a Waymo, spent their ride getting drunk, and shot gel beads out the windows learned the hard way this summer. Read full article Comments", "date_str": "2026-10-01T19:19:42+00:00", "hash": "325535edb7660f1f", "title_fa": "آیا طراحی خوب می تواند تولیدکنندگان محتوا را از داشتن رابطه جنسی در رباتاکسی باز دارد؟", "summary_fa": "انسان‌ها می‌توانند انبوهی بی‌نظیر باشند، و مدت زیادی نگذشته بود که تسلا اتوپایلوت اجازه داد تا رانندگان بدون دست بروند تا اینکه مردم تصمیم بگیرند فیلمی از رابطه جنسی خود از روی صندلی راننده ارسال کنند. اخیراً استاندارد سانفرانسیسکو با چندین نفر مصاحبه کرد که ادعا می کردند در رباتاکسی متعلق به کروز که اکنون از بین رفته جنرال موتورز رابطه جنسی داشته اند. هیچ کس نیست که به شما بگوید، شما نمی توانید این کار را انجام دهید. یک مرد به SF Standard می گوید: «این به جایی می رسد که شما بیشتر و بیشتر و راحت تر می شوید، و اگر با کسی باشید، مانند یک شریک جدی تر، می تواند به فعالیت های دیگر افزایش یابد. «از ابد در فرهنگ عامه، فضای داخلی وسایل نقلیه جنسی شده و برای رابطه جنسی مناسب بوده است. الکساندروس روچیتزاس، محقق فاکتورهای انسانی/UX و یکی از برگزارکنندگان کارگاه اخیر، «عشق در ترافیک»، که محققان دانشگاهی و صنعتی را در اواخر سپتامبر در سوئد گرد هم آورد، گفت که چگونه طراحی می‌تواند به این مشکل کمک کند؟ تعهد اجتماعی برای تعامل با یک راننده انسانی نیازی به صحبت های کوچک نیست، و مجبور نیستید به نظر وحشتناک کسی گوش دهید، که می تواند باعث شود سواران حریم خصوصی بسیار بیشتری را نسبت به شرایط و ضوابط دوربین ها و سوارکاری فرض کنند. این درسی است که یک جفت نوجوان که Waymo را استخدام کرده بودند، سواری خود را با مستی گذرانده بودند و دانه های ژل را از پنجره بیرون می زدند، تابستان امسال به سختی آموختند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید کمینه کردن برای پیمایش انسان ها می توانند یک دسته دمدمی مزاج باشند، و مدت زیادی نگذشته بود که تسلا"}, {"source": "Ars Technica", "title": "Marvel releases one last VisionQuest trailer", "link": "https://arstechnica.com/culture/2026/10/marvel-releases-one-last-visionquest-trailer/", "summary": "With its premiere just two weeks away, Marvel Studios has dropped one last trailer for the limited series, VisionQuest , which will complete the trilogy begun with WandaVision and Agatha All Along. (Spoilers for WandaVision and Agatha All Along below.) As previously reported , Marvel’s streaming TV portfolio has kind of been all over the place: a handful of hits, a few misses, and a bunch of middling offerings. One standout was WandaVision , followed by an excellent sequel (of sorts), Agatha All Along . VisionQuest will complete the trilogy. Vision (Paul Bettany) died in Infinity War , but WandaVision resurrected an all-white version whose memories were restored in the finale. We finally get to learn what happened afterward. Read full article Comments", "date_str": "2026-10-01T18:04:48+00:00", "hash": "915008695612fa52", "title_fa": "مارول آخرین تریلر VisionQuest را منتشر کرد", "summary_fa": "استودیو مارول، تنها دو هفته دیگر به نمایش درآید، آخرین تریلر سریال محدود VisionQuest را منتشر کرده است که سه گانه آغاز شده با WandaVision و Agatha All Along را تکمیل خواهد کرد. (اسپویل برای WandaVision و Agatha All Along در زیر.) همانطور که قبلاً گزارش شده است، مجموعه تلویزیونی استریم مارول به نوعی در همه جا حضور داشته است: تعداد انگشت شماری از بازدیدها، چند مورد از دست دادن، و مجموعه ای از پیشنهادات متوسط. یکی از برجسته‌ترین آنها WandaVision بود و به دنبال آن یک دنباله عالی (از نوع)، Agatha All Along. VisionQuest این سه گانه را تکمیل خواهد کرد. ویژن (پل بتانی) در Infinity War درگذشت، اما WandaVision یک نسخه کاملا سفید را احیا کرد که خاطرات آن در فینال بازسازی شد. بالاخره متوجه می شویم که بعد از آن چه اتفاقی افتاده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش با تنها دو هفته دیگر، Marvel Studios آخرین تریلر سریال محدود VisionQuest را منتشر کرد که سه گانه آغاز شده با Wandaha Allong و Agat را تکمیل می کند. ویژن، راه اندازی مجدد و فرار از دست کسانی که به دنبال سلاح به او بودند، مخفی شده است. در جستجوی معنای جدید، او با شخصیت‌های هوش مصنوعی که در برنامه‌نویسی‌اش جاسازی شده‌اند، از جمله F.R.I.D.A.Y.، E.D.I.T.H.، J.A.R.V.I.S. و بدنام Ultron مشورت می‌کند. وجود محتاطانه او زمانی پایان می‌یابد که جایزه‌ای که روی سرش گذاشته می‌شود او را با توماس شپرد، پسری مرموز که ممکن است پسر ویژن باشد، به فرار می‌اندازد. در حالی که ویژن از دستگیری طفره می رود، او باید با طبیعت خود مقابله کند، در مقابل نفوذ اولترون مقاومت کند و اگر می خواهد زنده بماند، معمایی را که همراه"}, {"source": "Ars Technica", "title": "Memory executives expect RAM shortage to continue through 2028", "link": "https://arstechnica.com/information-technology/2026/10/memory-supplies-are-only-getting-tighter-micron-ceo-says/", "summary": "Micron and Samsung executives this week said the memory shortage will continue for at least the next couple of years. Micron CEO Sanjay Mehrotra expects demand for the firm’s memory to exceed its available supply over that period, he told investors last night. Micron no longer sells consumer RAM, and Mehrotra’s statements refer to Micron’s business-to-business sales of high-bandwidth memory (HBM) for AI and DRAM for servers. However, his comments also have implications for consumer devices. Manufacturing capacity is prioritizing memory for AI and servers, limiting the supply of memory manufactured for consumer devices. Read full article Comments", "date_str": "2026-10-01T17:49:56+00:00", "hash": "c53fdeb3d4d664c3", "title_fa": "مدیران حافظه انتظار دارند کمبود RAM تا سال 2028 ادامه یابد", "summary_fa": "مدیران Micron و Samsung در این هفته گفتند که کمبود حافظه حداقل تا دو سال آینده ادامه خواهد داشت. او شب گذشته به سرمایه گذاران گفت، سانجی مهروترا، مدیر عامل میکرون انتظار دارد که تقاضا برای حافظه این شرکت در آن دوره از عرضه موجود فراتر رود. Micron دیگر RAM مصرف کننده را نمی فروشد و اظهارات Mehrotra به فروش حافظه با پهنای باند بالا (HBM) برای AI و DRAM برای سرورها از طریق تجارت به تجارت اشاره دارد. با این حال، نظرات او همچنین پیامدهایی برای دستگاه های مصرف کننده دارد. ظرفیت تولید، حافظه را برای هوش مصنوعی و سرورها در اولویت قرار می دهد و عرضه حافظه تولید شده برای دستگاه های مصرف کننده را محدود می کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش Micron به حداقل برسد و مدیران سامسونگ در این هفته گفتند که کمبود حافظه حداقل تا چند سال آینده ادامه خواهد داشت. مهروترا، بر اساس متنی از Seeking Alpha، گفت: «به طور کلی، محیط عرضه و تقاضا در حال تنگ‌تر شدن است. میکرون قصد دارد در سال 2028 اتاق های تمیز جدیدی را برای تولید حافظه باز کند، اما مهروترا انتظار دارد عرضه محدود باقی بماند. او گفت: «حتی پس از ساخت آنها، حتی پس از اولین تولید ویفر، تولید تنها به تدریج در اتاق های تمیز افزایش می یابد. \"این فقط ماهیت چیزی است که برای بالا بردن تولید لازم است، و با رفتن HBM از 3E به ترکیبی بیشتر از 4 و 4E، و با نسبت تجارتی که وجود دارد، ... با توجه به رشد عرضه، باد مخالف ایجاد می‌کند. انتقال گره‌ها در آینده باعث افزایش بهره‌وری کمتری در هر ویفر می‌شود.\" مدیر عامل شرکت گفت: هفتاد و پنج درصد از"}, {"source": "Ars Technica", "title": "Florida cops say they don't know who owns 11 unpermitted Flock cameras", "link": "https://arstechnica.com/tech-policy/2026/10/florida-cops-say-they-dont-know-who-owns-11-unpermitted-flock-cameras/", "summary": "Florida cops are facing questions after a mandate to remove all Flock cameras tracking cars on St. Lucie County roads led local police to uncover more than a dozen suspicious cameras operating without permits. Local residents told The Washington Post that they were alarmed that no one knows who owns many of the mysterious cameras. Of the 14 cameras found, 11 had no obvious owners, raising concerns about who has access to sensitive data that bad actors could abuse. After the cameras were discovered, St. Lucie County Commissioner James Clasby told a local news outlet that there’s “potential for non-law enforcement to have cameras out there, and I’m not OK with that.” Read full article Comments", "date_str": "2026-10-01T16:49:33+00:00", "hash": "0ff855751821f9f3", "title_fa": "پلیس فلوریدا می‌گوید نمی‌داند که مالک 11 دوربین Flock غیرمجاز است", "summary_fa": "پلیس فلوریدا پس از دستور حذف تمام دوربین‌های Flock که اتومبیل‌ها را در جاده‌های سنت لوسی کانتی ردیابی می‌کنند، با سؤالاتی روبرو هستند که پلیس محلی را به کشف بیش از دوازده دوربین مشکوک که بدون مجوز کار می‌کنند، واداشت. ساکنان محلی به واشنگتن پست گفتند که از اینکه کسی نمی داند مالک بسیاری از دوربین های مرموز است، نگران هستند. از 14 دوربین پیدا شده، 11 دوربین هیچ مالک مشخصی نداشتند، و این نگرانی را در مورد اینکه چه کسی به داده های حساسی که بازیگران بد از آنها سوء استفاده می کنند دسترسی دارد، ایجاد کرد. پس از کشف دوربین‌ها، جیمز کلاسبی، کمیسر شهرستان سنت لوسی، به یک خبرگزاری محلی گفت: «این امکان وجود دارد که مجریان غیرقانونی دوربین‌هایی در آنجا داشته باشند، و من با آن موافق نیستم». مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید پلیس های فلوریدا پس از دستور حذف همه دوربین های Flock که اتومبیل های ردیابی را در خیابان خیابان St. جاده های کانتی لوسی باعث شد پلیس محلی بیش از دوازده دوربین مشکوک را که بدون مجوز کار می کردند، کشف کند. اما کلانتر شهرستان سنت لوسی در نهایت ادعای سه مورد از این دوربین ها را گرفت، سپس از توضیح اینکه چرا آنها هرگز مجوزهای لازم را دریافت نکردند، خودداری کردند. این دفتر بلافاصله به درخواست Ars برای شفاف سازی اینکه آیا تا به حال به داده های ضبط شده توسط دوربین ها دسترسی داشته است، پاسخ نداد. در فلوریدا، پلیس بارها دستگیر شده است که از دوربین های Flock سوء استفاده می کند، و گاهی اوقات به دلایل شخصی صدها بار اتومبیل های مجرد را ردیابی می کند. یک افسر در فورت پیرس، جوزفر کراچفیلد، هنگام تعقیب"}, {"source": "Ars Technica", "title": "With most information hidden, the game Stratego had stumped AI—until now", "link": "https://arstechnica.com/science/2026/10/ai-finally-beat-the-best-stratego-player-in-history-and-did-it-on-a-budget/", "summary": "Deep Blue took down Garry Kasparov at chess in 1997, AlphaGo beat Lee Sedol at Go in 2016, and poker bots have been beating professionals for years. But one classic game called Stratego held out. Even DeepMind, with its exceptional budget, couldn't build a machine that reliably beat the best human players. Now, a team of researchers from Carnegie Mellon, MIT, New York University, and Stanford University has done it. Their AI, called Ataraxos, beat Pim Niemeijer, arguably the best Stratego player of all time, 15 games to one, with four draws. And it took just 16 GPUs and a few thousand dollars to train it. Hidden armies In Stratego , each player gets 40 pieces representing military ranks, from a marshal down to a spy, plus bombs and a flag. You win by capturing the opponent's flag. Your opponent knows where your pieces are, but not what they are. Identities are revealed only when two pieces collide in battle—the weaker one is removed, and the identity of the winner is revealed. That makes Stratego an imperfect-information game, just like poker, which computers cracked years ago. “There's something super distinctive about Stratego , which is that it is a massive amount of hidden information that unfolds over a very long time scale,” said Eugene Vinitsky, a researcher at NYU and co-author of the study. Read full article Comments", "date_str": "2026-10-01T16:28:04+00:00", "hash": "98c20c00df1a4620", "title_fa": "با پنهان شدن بیشتر اطلاعات، بازی Stratego تا به حال هوش مصنوعی را تحت تأثیر قرار داده بود", "summary_fa": "دیپ بلو در سال 1997 گری کاسپاروف را در شطرنج شکست داد، AlphaGo در Go در سال 2016 لی سدول را شکست داد و ربات‌های پوکر سال‌ها است که حرفه‌ای‌ها را شکست داده‌اند. اما یک بازی کلاسیک به نام Stratego ماندگار شد. حتی DeepMind، با بودجه استثنایی خود، نتوانست ماشینی بسازد که با اطمینان بهترین بازیکنان انسانی را شکست دهد. اکنون، تیمی از محققان از کارنگی ملون، MIT، دانشگاه نیویورک و دانشگاه استنفورد این کار را انجام داده‌اند. هوش مصنوعی آنها که آتاراکسوس نام دارد، پیم نیمیجر را شکست داد که مسلماً بهترین بازیکن Stratego در تمام دوران است، 15 بازی بر یک، با چهار تساوی. و فقط 16 پردازنده گرافیکی و چند هزار دلار برای آموزش آن صرف شد. ارتش های مخفی در Stratego، هر بازیکن 40 مهره دریافت می کند که نشان دهنده درجات نظامی است، از یک مارشال گرفته تا یک جاسوس، به علاوه بمب و یک پرچم. شما با گرفتن پرچم حریف برنده می شوید. حریف شما می داند مهره های شما کجا هستند، اما نمی داند که چه هستند. هویت‌ها تنها زمانی آشکار می‌شوند که دو قطعه در نبرد با هم برخورد کنند - قطعه ضعیف‌تر حذف می‌شود و هویت برنده آشکار می‌شود. این باعث می شود Stratego یک بازی با اطلاعات ناقص باشد، درست مانند پوکر، که رایانه ها سال ها پیش آن را کرک کردند. یوجین وینیتسکی، محقق دانشگاه نیویورک و یکی از نویسندگان این مطالعه، می‌گوید: «یک چیز فوق‌العاده متمایز درباره Stratego وجود دارد، و آن این است که حجم عظیمی از اطلاعات پنهان است که در یک مقیاس زمانی بسیار طولانی آشکار می‌شود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. اما یک بازی کلاسیک به نام Stratego ماندگار شد. حتی DeepMind، با بودجه"}, {"source": "Ars Technica", "title": "As US relations fray, Canada gets serious about its own launch industry", "link": "https://arstechnica.com/space/2026/10/as-us-relations-fray-canada-gets-serious-about-its-own-launch-industry/", "summary": "A year or two ago, a few Canadian launch companies were trying to develop small rockets, but if we're being frank, the industry was not particularly notable. Sure, something interesting might eventually happen, but no one outside of a few Canadian space geeks was paying much attention. But then the Trump Administration started threatening and instituting tariffs. There was talk of making Canada the 51st state. And pretty much every Canadian I know began telling me how enraged they were at their neighbors to the south. It's hard to blame them. This has led the Canadian government to reassess all manner of areas where it had previously been happy to rely largely on the US government and American companies for goods and services. This included sovereign access to space. So this spring, the government announced the first awards to three companies—NordSpace, Reaction Dynamics, and Canada Rocket Company—to support work on rockets with \"light lift\" capability. Read full article Comments", "date_str": "2026-10-01T15:30:49+00:00", "hash": "fa8002e9e9dd2071", "title_fa": "همزمان با تیره شدن روابط ایالات متحده، کانادا در صنعت راه اندازی خود جدی می شود", "summary_fa": "یک یا دو سال پیش، چند شرکت پرتاب کننده کانادایی در تلاش برای توسعه موشک های کوچک بودند، اما اگر صادق باشیم، این صنعت به ویژه قابل توجه نبود. مطمئناً، ممکن است در نهایت اتفاق جالبی بیفتد، اما هیچ کس خارج از چند نفر از متخصصان فضایی کانادایی توجه زیادی به این موضوع نداشتند. اما پس از آن دولت ترامپ شروع به تهدید و اعمال تعرفه کرد. صحبت از تبدیل شدن کانادا به پنجاه و یکمین ایالت ، Waymo خودران به پارکینگی در San Mateo County، کالیفرنیا رفت و تا رسیدن پلیس در آنجا ماند. پلیس محلی با 911 تماسی از کارکنان Waymo - باید گفت که انسان‌هایی - که از طریق دوربین‌های نصب شده در داخل خودرو مسافران خودرو را مشاهده می‌کردند، دریافت کرده بودند. در گزارش پلیس آمده است که به نظر می‌رسید دو نوجوان با یک تفنگ سیاه رنگ از پنجره خودرو به بیرون شلیک می‌کردند، با آن بازی می‌کردند و در میان شلیک‌ها مشروب می‌نوشیدند. داستان پایان خوشی دارد: اسلحه به Orbeez پر از آب شلیک می کرد، نه گلوله. اما این حادثه توجه را به سیستم نظارت Waymo جلب کرد. به گفته این شرکت، خودروها به فناوری خودکار مجهز شده اند که می تواند وجود سلاح گرم در داخل آن را نشان دهد. بیرون خودروهای خودران با دوربین‌هایی پوشانده شده‌اند که به آن‌ها کمک می‌کند تا دنیای اطراف خود را ببینند. (بیشتر از سنسورهای دیگر، از جمله رادار و لیدار نیز استفاده می‌کنند.) دوربین‌های داخل وسایل نقلیه که شرکت‌ها می‌گویند برای ایمن نگه داشتن سوارکاران و اجرای قوانین آن‌ها ضروری هستند، کمتر مورد توجه قرار می‌گیرند. در اوایل سال جاری، Waymo گفت که از دوربین‌های کابین خود برای انجام هر دو کار استفاده می‌کند، پس از اینکه برخی از مسافران کالیفرنیا، که بسیاری از آنها بیست ساله یا بیشتر بودند، گزارش دادند که کارکنان Waymo به طور ناگهانی دستگاه مخابره داخل خودرو را در اواسط سواری کنترل کردند تا مطمئن شوند که آن‌قدر بزرگ هستند که بتوانند به تنهایی سوار شوند. (یکی 35 ساله به WIRED گفت که فکر می‌کند کوله پشتی‌اش پرچم‌های قرمز را نشان"}, {"source": "Wired", "title": "Election Deniers Think the GOP’s Terrible Midterm Polling Is a ‘Psyop’", "link": "https://www.wired.com/story/election-deniers-think-the-gops-terrible-midterm-polling-is-a-psyop/", "summary": "Dozens and dozens of high profile MAGA influencers and pundits have weighed in. “The laughable fake polls are rolling out,” Catturd posted on X.", "date_str": "2026-10-02T10:00:00+00:00", "hash": "f4c564076b217dde", "title_fa": "منکران انتخابات فکر می کنند که رای گیری وحشتناک میان دوره ای حزب جمهوری خواه یک \"روانی\" است", "summary_fa": "ده‌ها و ده‌ها تأثیرگذار و صاحب نظر MAGA در این م د نیستند، در چندین مرکز داده اوراکل در جنوب شرق آسیا قرار دارند. ارزش این قرارداد که امسال امضا شد، حدود 7 میلیارد دلار است و Tencent [ ] این داستان در The Next Web ادامه دارد که گروه‌های فناوری چینی قبلاً در خارج از کشور رایانش را اجاره کرده‌اند. بایت دنس تقریباً 75 درصد از فروش 2025 Nscale را به ارمغان آورد، پرونده های شرکت ابری بریتانیا نشان داد. جریان نقدی Tencent در سه ماهه دوم منفی شد و به 13.8 میلیارد یوان (2.06 میلیارد دلار) رسید. به گفته FT، این اولین رقم منفی در بیش از یک دهه است. دیتاسنتر داینامیکز گزارش داد، مدیر مالی جان لو، هزینه‌های سنگین زیرساخت‌های هوش مصنوعی و پیش‌پرداخت‌های محاسباتی را کاهش داد. مارتین لاو، رئیس Tencent می‌گوید: «ما در انجام سرمایه‌گذاری قابل توجه در هوش مصنوعی راحت هستیم، زیرا نه تنها پتانسیل صعودی قابل‌توجهی وجود دارد، بلکه محافظت از جنبه منفی واضحی نیز وجود دارد. مدیران گفتند که این محاسبات ابتدا به آموزش مدل‌های بزرگ‌تر Hunyuan و سپس اجرای آنها می‌پردازد. بعداً، Tencent Cloud توانست آن را اجاره کند. Tencent همچنین از سازنده تراشه‌های چینی Enflame حمایت می‌کند که در اولین حضور خود در شانگهای در ماه سپتامبر تقریباً سه برابر شد. Investor’s Business Daily گزارش داد که سهام اوراکل در روز پنجشنبه پس از این گزارش به سختی حرکت کرد. آنها در سال جاری 29.5 درصد کاهش یافته بودند. IBD خاطرنشان کرد که جریان نقدی رایگان اوراکل به دلیل هزینه های هوش مصنوعی برای چندین فصل زیر صفر بوده است. این شرکت بیش از درآمد یک سه ماهه خود در مراکز داده هزینه می"}, {"source": "The Next Web", "title": "Nvidia’s Huang questioned Amodei’s AI warnings at White House, WSJ reports", "link": "https://thenextweb.com/news/jensen-huang-dario-amodei-ai-warnings-white-house-wsj", "summary": "Nvidia chief executive Jensen Huang and other tech leaders questioned Anthropic’s Dario Amodei about his public warnings on AI at Tuesday’s White House lunch. People familiar with the matter told The Wall Street Journal about the exchange. Amodei replied that it was important to be honest, according to the report. The exchange came just after [ ] This story continues at The Next We me-aws-and-azure-dma-gatekeepers-in-november", "summary": "The European Commission plans to name Amazon Web Services and Microsoft Azure as gatekeepers under the Digital Markets Act (DMA) in November, Bloomberg reported on Friday. Citing people familiar with the matter, it said regulators are finishing an investigation that will find both cloud services fall under the bloc’s Big Tech rules. The decision is still a [ ] This story continues at The Next Web", "date_str": "2026-10-02T12:24:39+00:00", "hash": "19b01965a7d7bac9", "title_fa": "اتحادیه اروپا قرار است در ماه نوامبر دروازه‌بان‌های AWS و Azure DMA را معرفی کند", "summary_fa": "بلومبرگ روز جمعه گزارش داد که کمیسیون اروپا قصد دارد در ماه نوامبر خدمات وب آمازون و مایکروسافت آژور را به عنوان دروازه بان تحت قانون بازارهای دیجیتال (DMA) معرفی کند. به نقل از افراد آشنا با این موضوع، اعلام کرد که رگولاتورها در حال تکمیل تحقیقاتی هستند که هر دو سرویس ابری را تحت قوانین فناوری بزرگ بلوک قرار می‌دهند. این تصمیم هنوز یک [ ] منابع بلومبرگ گفتند، این داستان در The Next Web ادامه دارد. TNW به طور مستقل این گزارش را تایید نکرده است و کمیسیون به طور علنی تاریخی را تعیین نکرده است. تصمیم نهایی دیدگاه اولیه کمیسیون در ژوئن را تایید می کند. در آن زمان، به آمازون و مایکروسافت گفت که AWS و Azure یک دروازه کلیدی بین مشاغل و مشتریانشان هستند. آنها بزرگترین و دومین سرویس ابری در اتحادیه اروپا هستند. هیچ‌کدام از این سرویس‌ها با تست‌های معمول DMA برای اندازه و شماره کاربر مطابقت ندارند. درعوض، کمیسیون گفت که هر دو دارای پایگاه های مشتریان بزرگ و قدیمی هستند که تغییر را پرهزینه می دانند. این شرکت افزود که آنها بیشتر تقاضای جدید برای محاسبات هوش مصنوعی را در داخل اکوسیستم خود نگه می دارند. پس از تعیین، آمازون و مایکروسافت شش ماه فرصت خواهند داشت تا خدمات را با DMA مطابقت دهند. قوانین آن دروازه بانان را از ترجیح محصولات خود باز می دارد. آن‌ها همچنین باید با سرویس‌های رقیب کار کنند و به مشتریان اجازه دهند داده‌های خود را جابه‌جا کنند، که تعویض ارائه‌دهندگان ابری را آسان‌تر می‌کند. شرکت هایی که DMA را زیر پا می گذارند تا 10 درصد از فروش جهانی خود یا 20 درصد برای نقض مکرر جریمه می شوند. هر دو شرکت در حال حاضر دروازه بان خدمات دیگر مانند بازار آمازون و ویندوز مایکروسافت هستند."}, {"source": "The Next Web", "title": "Yann LeCun calls Anthropic’s Dario Amodei ‘deluded’, Fortune reports", "link": "https://thenextweb.com/news/yann-lecun-dario-amodei-deluded-rogue-agents-fortune", "summary": "Yann LeCun does not worry “at all” about AI wiping out humanity, and he has “zero concerns” about the recent run of rogue AI incidents. The Turing Award winner said so in an interview with Emily Forlini for Fortune. He also called Anthropic chief executive Dario Amodei “deluded” and, later in the interview, “crazy”. LeCun [ ] This story continues at The Next Web", "date_str": "2026-10-02T12:24:03+00:00", "hash": "ed553d734144b41a", "title_fa": "فورچون گزارش می دهد که یان لکون داریو آمودی از آنتروپیک را \"فریب خورده\" می نامد", "summary_fa": "Yann LeCun \"اصلا\" نگران نیست که هوش مصنوعی بشریت را از بین ببرد، و او در مورد رویدادهای اخیر AI سرکش \"نگرانی صفر\" دارد. برنده جایزه تورینگ این را در مصاحبه ای با امیلی فورلینی برای Fortune گفت. او همچنین داریو آمودی، مدیر اجرایی آنتروپیک را «متوهم» و بعداً در مصاحبه «دیوانه» خواند. LeCun [ ] این داستان در The Next Web ادامه دارد LeCun این حوادث را ناشی از نظارت ضعیف انسانی و طراحی سیستم، از جمله هک Hugging Face توسط عوامل OpenAI در ماه جولای می‌داند. او گفت که آنها «کاملاً قابل پیشگیری بودند» و بسیاری از آزمایشگاه‌های هوش مصنوعی فاقد درک اساسی از امنیت سایبری هستند. LeCun به Fortune گفت: \"آن عوامل دقیقاً همان کاری را انجام می دهند که از آنها خواسته شده است. آنها قرار بود در جعبه های ماسه ای باشند، اما جعبه های شنی نشتی داشتند و به طرز وحشتناکی طراحی شده بودند.\" LeCun گفت، بسیاری از افراد در ایمنی هوش مصنوعی «معمولاً دستور کار دارند که باید پیش ببرند». او روشن کرد که منظور او نوع‌دوستی مؤثر (EA) است، جنبشی که بر خطراتی که هوش مصنوعی برای بشریت ایجاد می‌کند متمرکز است. او آن را \"فوق العاده سمی\" و \"یک فاجعه کامل\" نامید و گفت پیروان آن در آزمایشگاه های هوش مصنوعی از \"پارانویای -6 Astra مطابقت دارد و در آزمایشات اولیه بسیار کمتر دچار توهم می شود", "summary_fa": "Gemini 4 Argon گوگل در آزمایش‌های مستقل اولیه با GPT-6 Astra OpenAI برابری می‌کند. تجزیه و تحلیل مصنوعی اعلام کرد که امتیاز 53 در شاخص هوش آنالیز مصنوعی، همان GPT-6 Astra و یک امتیاز بالاتر از GPT-6.1 Sol است. Claude Opus 5.5 از Anthropic همچنان با 58 در این شاخص پیشتاز است. امتیاز 23 امتیاز بالاتر از Gemini است [ ] این داستان در The Next Web ادامه دارد. این کمترین میزان در بین هر مدلی است که امتیاز 45 یا بیشتر را در این شاخص کسب کرده است. GPT-6 Astra با 51% و GPT-6.1 Sol با 54% وارد بازار شدند. این شرکت گفت که آرگون اغلب اذعان می کند که به جای حدس زدن پاسخی نمی داند. همچنین پاسخ های درست کمتری دریافت کرد: 50% در مقابل 63% برای GPT-6 Astra. آرگون در AutomationBench-AA، تست گردش کار نرم افزارهای تجاری، با 78% در رتبه اول قرار گرفت. این هفت امتیاز بیشتر از کلود سونت 5.5 است. در ترمینال بنچ 4، آزمون کدنویسی، امتیاز 57 درصد را کسب کرد. Claude Sonnet 5.5 (64%)، Claude Opus 5.5 (60%) و GPT-6 Astra (59%) همگی امتیاز بیشتری کسب کردند. هزینه هر کار شاخص 1.99 دلار با آرگون در تخفیف راه اندازی آن، 60 درصد از GPT-6 Astra 3.26 دلار است. پس انداز از قیمت توکن کمتر حاصل می شود، نه استفاده از توکن های کمتر. آرگون در هر کار از حدود 62000 توکن خروجی در مقابل 27000 برای GPT-6 Astra استفاده کرد. هنوز هم 2.7 برابر بیشتر از GPT-6.1 Sol برای هر کار هزینه دارد. گوگل برای حداقل یک ماه نیمی از قیمت را دریافت می کند: 2 دلار به ازای هر میلیون توکن ورودی و 10 دلار برای هر میلیون توکن خروجی. بر اساس تجزیه و تحلیل مصنوعی، در 4 دلار و 20 دلار استاندارد، هر کار به 3.98 دلار افزایش می"}, {"source": "MIT Tech Review", "title": "The Download: a biological de-aging contest and why LLMs don’t reason", "link": "https://www.technologyreview.com/2026/10/02/1145666/the-download-biological-de-aging-ai-reasoning/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. A new contest pits competitors against each other in a race to biological youth —Jessica Hamzelou This week, I officially signed up for an unusual competition. One that rewards competitors for getting younger . I recently turned 40, and I don’t need reminding that both time and my chronological age only tick forward. But this game is focused on competitors’ biological ages , figures that are meant to provide a better way to measure the age-related health of our organs and bodies. Over six months, around 500 of us will try to reverse our biological age using a bunch of different measures. There’s even a leaderboard! But is it even possible to measure whether someone is getting younger? Read the full story on the controversy around biological age measurements and how I’ll test them myself . This story is from The Checkup, our weekly biotech newsletter. Sign up to receive it in your inbox every Thursday. Opinion: Don’t be fooled—LLMs don’t reason —Thore Graepel Ten years ago, I watched a program I helped build stun the world by beating Go champion Lee Sedol. AlphaGo won after making a move so strange that some commentators thought it was a programming glitch. It was AlphaGo’s powers of reasoning that made this creative choice—and these are powers that today’s AI lacks. This is why I recently left my position at Google DeepMind. I believe we need a fresh approach to machine reasoning, one that draws on AlphaGo’s architecture. Here’s why today’s AI doesn’t really reason—and what it would take to change that . Thore Graepel is chair of machine learning at University College London. He was a core member of the AlphaGo team at DeepMind. The must-reads I’ve combed the internet to find you today’s most fun/important/scary/fascinating stories about technology. 1 OpenAI says rogue agents may have affected more than 100 organizations The company is searching 50 petabytes of data for incidents. ( Reuters $) + It says none of the incidents matched the Hugging Face attack. ( Gizmodo ) + OpenAI has fired three workers for allegedly mishandling information. ( BBC ) + California has subpoenaed OpenAI over its rogue AI agents. ( Guardian ) + Who s liable when AI agents go rogue? ( MIT Technology Review ) 2 A US man allegedly smuggled $300 million of Nvidia chips to China He’s been arrested in California on federal charges. ( Reuters $) + T", "date_str": "2026-10-02T12:10:00+00:00", "hash": "9721a193499da801", "title_fa": "دانلود: مسابقه پیری بیولوژیکی و چرا LLM ها دلیل نمی آورند", "summary_fa": "این هفته رسماً برای یک مسابقه غیرمعمول ثبت نام کردم. یکی که به رقبا برای جوان شدن پاداش می دهد. من اخیراً 40 ساله شدم و نیازی به یادآوری ندارم که هم زمان و هم سن تقویمی من فقط به جلو می روند. اما این بازی بر سن‌های بیولوژیکی رقبا متمرکز است، ارقامی که قرار است روشی بهتر برای اندازه‌گیری سلامت اعضا و بدن‌های مرتبط با سن ارائه دهند. در طی شش ماه، حدود 500 نفر از ما سعی خواهیم کرد با استفاده از مجموعه ای از معیارهای مختلف، سن بیولوژیکی خود را معکوس کنیم. حتی یک تابلوی امتیازات وجود دارد! اما آیا حتی می توان اندازه گیری کرد که آیا فردی جوان تر می شود؟ داستان کامل بحث در مورد اندازه گیری سن بیولوژیکی و اینکه چگونه آنها را خودم آزمایش خواهم کرد را بخوانید. ده سال پیش، برنامه‌ای را تماشا کردم که با شکست دادن قهرمان Go، لی سدول، به ساختن دنیا کمک کردم. AlphaGo پس از انجام یک حرکت به قدری عجیب برنده شد که برخی از مفسران آن را یک نقص برنامه‌نویسی دانستند. قدرت استدلال AlphaGo بود که این انتخاب خلاقانه را انجام داد - و اینها قدرت هایی هستند که هوش مصنوعی امروزی فاقد آن است. به همین دلیل است که من اخیراً موقعیت خود را در Google DeepMind ترک کردم. من معتقدم که ما به یک رویکرد جدید برای استدلال ماشینی نیاز داریم، رویکردی که از معماری AlphaGo استفاده می کند. اینجاست که چرا هوش مصنوعی امروزی واقعاً استدلال نمی کند - و برای تغییر آن چه چیزی لازم است. Thore Graepel رئیس یادگیری ماشین در دانشگاه کالج لندن است. او یکی از اعضای اصلی تیم AlphaGo در DeepMind بود. من اینترنت را بررسی کردم تا سرگرم کننده ترین/مهم ترین/ترسناک/جذاب ترین داستان های امروز در مورد تکنولوژی را برای شما پیدا کنم. 1 OpenAI"}, {"source": "MIT Tech Review", "title": "A new contest pits competitors against each other in a race to biological youth", "link": "https://www.technologyreview.com/2026/10/02/1145610/younger-contest-race-to-biological-youth/", "summary": "This week, I officially signed up for an unusual competition. One that rewards competitors for getting younger . I recently turned 40, and I don’t need reminding that both time and my chronological age only tick forward. But this game is focused on competitors’ biological ages—figures that are meant to provide a better way to measure the age-related health of our organs and bodies. Over a six-month period, around 500 of us will try to reverse our biological age as measured in a bunch of different ways. There’s even a leaderboard! The winners will include the person who shows the greatest difference between their chronological and biological age, as well as the person who manages to reverse their biological age the most. The competition is the brainchild of the neuroscientist and physician Christin Glorioso, who is also founder and CEO of NeuroAge Therapeutics. The company offers tools to track brain health and aging and is running a trial to find out if biological brain age can predict the onset of Alzheimer’s disease. Glorioso says she has several goals for the Younger contest . The first, she tells me, is to “explain to the world what aging clocks are.” Regular Checkup readers will be familiar with these tools, but for the uninitiated, they are basically designed to measure biological age. Many measure chemical signatures that form a layer on top of our DNA and seem to change with age. But others might involve looking at proteins or lipids in blood. Some are designed to measure functional health, while others predict when a person will die. There are more than a hundred clocks out there, and they probably each capture a specific aspect of the biological process of aging. These clocks are proving very useful for scientists , who use them to study aging and development rce": "Zoomit", "title": "حساب رسمی مایکروسافت در ایکس هک شد", "link": "https://www.zoomit.ir/security/468301-microsoft-x-account-hacked/", "summary": "مایکروسافت نفوذ امنیتی به حساب رسمی خود در شبکه‌ی اجتماعی ایکس و انتشار پست‌های غیرمجاز را تأیید کرد.", "date_str": "2026-10-02T05:12:10+00:00", "hash": "fb3ab897e4a3f086", "title_fa": "حساب رسمی مایکروسافت در ایکس هک شد", "summary_fa": "مایکروسافت نفوذ امنیتی به حساب رسمی خود در شبکه‌ی اجتماعی ایکس و انتشار پست‌های غیرمجاز را تأیید کرد. تبلیغات مایکروسافت تأیید کرد که حساب کاربری اصلی‌اش در شبکه‌ی اجتماعی ایکس هدف حمله‌ی سایبری و دسترسی غیرمجاز قرار گرفته است. این نفوذ زمانی آشکار شد که حساب مذکور یک صفحه‌ی مرتبط با رمزارزها با نام Clippy را دنبال و یکی از پست‌های آن را بازنشر کرد. هکرها در جریان این دسترسی غیرمجاز، تصویر پروفایل صفحه‌ی رسمی را به طرحی از کاراکتر نوستالژیک کلیپی تغییر دادند. مدتی بعد تمامی این فعالیت‌ها پاک شد و حدود ۳۰ دقیقه پس از آن، یک پیام عذرخواهی غیرعادی به‌نمایش درآمد که آن هم به‌سرعت حذف شد. برنت کولبرن ، سخنگوی مایکروسافت، گفت: «ما دسترسی غیرمجاز به حساب خود در ایکس را تأیید کرده‌ایم که شامل پست‌هایی بود که از سوی مایکروسافت ارسال نشده بودند.» مدیران مایکروسافت اعلام کردند کنترل حساب کاربری را کاملا پس گرفته‌اند و تمام پست‌های غیرمجاز پاک‌سازی شده‌اند. روند تحقیقات فنی و امنیتی در مورد چگونگی وقوع این رخداد همچنان ادامه دارد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "شاسی‌بلند قدرتمند با بدنه کشیده؛ استون مارتین DBX جدید رونمایی شد", "link": "https://www.zoomit.ir/car/468258-aston-martin-dbx-gt-debut/", "summary": "استون مارتین با معرفی مدل ۲۰۲۷ DBX GT، ترکیبی از عملکرد فنی قدرتمند و سطح بالایی از آسایش را برای رانندگی روزمره ارائه کرده است.", "date_str": "2026-10-02T04:15:00+00:00", "hash": "8bae2e642cfe77c3", "title_fa": "شاسی‌بلند قدرتمند با بدنه کشیده؛ استون مارتین DBX جدید رونمایی شد", "summary_fa": "استون مارتین با معرفی مدل ۲۰۲۷ DBX GT، ترکیبی از عملکرد فنی قدرتمند و سطح بالایی از آسایش را برای رانندگی روزمره ارائه کرده است. تبلیغات استون مارتین با معرفی مدل جدید DBX GT ، رویکردی متفاوت را در پیش گرفت. این خودرو ضمن حفظ پیشرانه‌ی هشت سیلندر توئین‌توربو با قدرت ۷۱۷ اسب بخار، تغییرات گسترده‌ای را در بخش سیستم تعلیق، طراحی داخلی و عایق‌بندی صوتی تجربه کرده است تا تجربه‌ی سواری نرم‌تری را برای سرنشینان فراهم کند. طراحی ظاهری این مدل با جلوپنجره‌ی جدید دوپره‌ای و استفاده از رنگ بدنه‌ برای سپرهای جلو و دیفیوزر عقب، ظاهری یکپارچه‌تر به خود گرفته است. رینگ‌های ۲۲ اینچی استاندارد با لاستیک‌های چهارفصل، به‌طور اختصاصی برای کاهش صدای جاده و افزایش راحتی انتخاب شده‌اند. در فضای داخلی، صندلی‌های بازطراحی‌شده با لایه‌ای ۱۰ میلی‌متری از فوم حافظه‌دار تجهیز شده‌اند تا ارگونومی بهتری ارائه دهند. استون مارتین برای بهبود فضای کابین، از مواد عایق صوتی بیشتری در درها و محفظه‌ی بار استفاده کرده است. این تغییرات باعث شده تا شاخص مفصل‌بندی یا همان Articulation Index خودرو تا ۱۳ درصد بهبود یابد. این شاخص معیاری صنعتی برای سنجش سهولت مکالمه‌ی سرنشینان در حین حرکت است. مشخصات فنی پیشرانه‌ی این خودرو همچنان در سطح بالایی قرار دارد که در جدول زیر خلاصه شده است: سیستم تعلیق این خودرو با کالیبراسیون جدید کمک‌فنرها، ضربات ریز و ناهمواری‌های مسیر را بهتر جذب می‌کند. استون مارتین هنوز قیمت نهایی این محصول را اعلام نکرده؛ اما با توجه به قیمت ۲۹۱,۲۰۰ دلاری مدل DBX S، انتظار می‌رود این مدل نیز در محدوده‌ی قیمتی مشابهی عرضه شود. نخستین سری از این خودروها در سه‌ماهه‌ی چهارم سال ۲۰۲۶ به مشتریان تحویل داده خواهد شد. استون مارتین در خصوص این تغییرات گفت: «هدف ما ایجاد تعادلی میان عملکرد بی‌نظیر و تجربه‌ی رانندگی آرام‌بخش برای استفاده‌های روزمره بوده است.»"}, {"source": "Zoomit", "title": "ماوس شفاف لنوو با شارژدهی سه ماهه و طراحی خیره‌کننده معرفی شد", "link": "https://www.zoomit.ir/accessories/468257-lenovo-900-transparent-mouse-launch/", "summary": "لنوو از ماوس بی‌سیم جدیدش با بدنه‌ای شفاف و عمر باتری ۹۰ روزه در بازار چین رونمایی کرد.", "date_str": "2026-10-02T02:30:00+00:00", "hash": "ef8f727a5bea3263", "title_fa": "ماوس شفاف ل دقت متن نهایی (Final Transcript) و اولین خروجی جزئی (First Partial Transcript) ارزیابی می‌شود. مایکروسافت در هر دو شاخص دست بالا را دارد و موفق شده استانداردهای تازه‌ای ثبت کند. دسترسی به بالاترین سطح فناوری هزینه‌ی بیشتری نیز طلب می‌کند. مایکروسافت مدل جدید را با نرخ ۰٫۵۴ دلار به ازای هر ساعت صدا یا ۹٫۰۰ دلار برای هر ۱٬۰۰۰ دقیقه ارائه کرده است. چنین اعدادی، سرویس جدید را در بالاترین رده‌ی قیمتی بازار در کنار مدل Gemini 3.5 Transcribe Live با قیمت ۹ دلار قرار می‌دهد. هزینه‌ی اعلام‌شده برای استفاده‌ی بلادرنگ، بالاتر از نرخ ۶٫۵۰ دلاری مدل‌های ElevenLabs Scribe v2 Realtime و Deepgram Flux است. این مبلغ بیش از دو برابر هزینه‌ی ۴ دلاری Cartesia Ink-2 و سه‌برابر تعرفه‌ی ۳ دلاری Muse Voice Transcribe ارزیابی شده است. در سمت مقابل، نسخه‌ی MAI-Transcribe-2 با قیمت اقتصادی‌ترِ ۰٫۱۰"}, {"source": "Zoomit", "title": "چت‌بات‌های لجباز؛ چرا هوش مصنوعی عذرخواهی می‌کند، اما از اشتباهش دست نمی‌کشد؟", "link": "https://www.zoomit.ir/ai-articles/468286-ai-stubbornness-and-belief-inertia-featured/", "summary": "هوش مصنوعی در مکالمات طولانی گیج می‌شود و به‌جای اصلاح، اشتباهش را به شیوه‌های مختلف ادامه می‌دهد. ریشه‌ی این لجبازی کجاست؟", "date_str": "2026-10-01T19:30:00+00:00", "hash": "b5ec57b35df65e4b", "title_fa": "چت‌بات‌های لجباز؛ چرا هوش مصنوعی عذرخواهی می‌کند، اما از اشتباهش دست نمی‌کشد؟", "summary_fa": "هوش مصنوعی در مکالمات طولانی گیج می‌شود و به‌جای اصلاح، اشتباهش را به شیوه‌های مختلف ادامه می‌دهد. ریشه‌ی این لجبازی کجاست؟ تبلیغات ماجرا معمولاً با یک درخواست ساده از دستیار هوش مصنوعی شروع می‌شود: «این یادداشت را برای جلسه‌ی فردا ویرایش کن». درخواست کمی دوپهلوست، اما مدل اصلاً معطل نمی‌کند و با لحنی مطمئن و خوش‌بینانه متنی برای جلسه‌ای با مدیران می‌نویسد. کمی بعد، کاربر وارد عمل می‌شود تا ابهام را برطرف کند: «نه، جلسه با مهندس‌هاست. پروژه شکست‌خورده و باید بی‌تعارف و صریح درباره‌ی دلایلش حرف بزنیم.» هوش مصنوعی عذرخواهی می‌کند، اشتباهش را می‌پذیرد و حتی دلایل شکست را هم به متن اضافه می‌کند. اما خروجی جدید، هنوز بوی جلسات هیئت‌مدیره می‌دهد! شکست به «فرصتی شیرین برای یادگیری» تبدیل می‌شود، جزئیات حیاتیِ فنی به حاشیه می‌روند و لحن متن همچنان می‌خواهد مخاطب را تحت‌تأثیر قرار دهد. مدل ظاهراً حرف کاربر را تصدیق می‌کند، اما اسکلت‌بندی متن هنوز حال‌وهوای برداشت اولیه را دارد. کپی لینک خلاصه صوتی خلاصه صوتی، ساخته‌شده با هوش مصنوعی پژوهشگران متا با همین مثالِ آشنا، رفتاری را توضیح می‌دهند که اغلب کاربران حرفه‌ای هوش مصنوعی بارها تجربه‌اش کرده‌اند. مدل عذر می‌خواهد، می‌گوید «حق با شماست» و حتی خطایش را درست توضیح می‌دهد. اما در نهایت ردپای برداشت اشتباه اولیه، شاید کمی پنهان‌تر در پاسخ دیده می‌شود. لجبازی مدل‌های هوش مصنوعی را همیشه در فرم مخالفت آشکار نمی‌بینیم، گاهی آن را پشت موافقتی مؤدبانه تجربه می‌کنیم. کپی لینک اینرسی باور؛ وقتی هوش مصنوعی اسیر پیش‌فرض‌های کهنه می‌شود پژوهشگران اصرار پنهان مدل‌ها بر اشتباهشان را با تعبیرهایی مثل سختی استدلال و اینرسی باور توصیف می‌کنند. اینرسی باور یعنی اطلاعات جدیدی به مدل می‌رسد، اما برداشت قبلی هنوز روی جواب یا تصمیم بعدی سنگینی می‌کند. رسیدن اطلاعات جدید به مدل همیشه به معنای اصلاح مسیر نیست."}, {"source": "Zoomit", "title": "برخی از مدل‌های آیفون ۱۸ پرو مکس مشکل عجیبی دارند", "link": "https://www.zoomit.ir/mobile/468252-iphone-18-pro-speaker-crackle-issue/", "summary": "خریداران گوشی‌های جدید اپل از شنیده‌شدن صداهای غیرعادی مانند تق‌تق و خش‌خش از اسپیکر مکالمه خبر می‌دهند.", "date_str": "2026-10-01T19:00:00+00:00", "hash": "ad07811410870010", "title_fa": "برخی از مدل‌های آیفون ۱۸ پرو مکس مشکل عجیبی دارند", "summary_fa": "خریداران گوشی‌های جدید اپل از شنیده‌شدن صداهای غیرعادی مانند تق‌تق و خش‌خش از اسپیکر مکالمه خبر می‌دهند. تبلیغات خریداران گوشی‌های جدید آیفون ۱۸ پرو و آیفون ۱۸ پرو مکس با مشکلی آزاردهنده در بخش خروجی صدا مواجه شده‌اند. گزارش‌های متعددی نشان می‌دهد صدای غیرعادی شبیه به تق‌تق، خش‌خش از اسپیکر مکالمه‌ی گوشی شنیده می‌شود. نقص عمدتا به اسپیکر بالایی مربوط می‌شود و هر دو مدل پرو و پرو مکس را تحت تاثیر قرار داده است. کاربران اعلام کرده‌اند انتشار به‌روزرسانی iOS 27.0.1 که برای حل مشکل راه‌اندازی مجدد ناشی از فیس‌آیدی منتشر شد، این اختلال صوتی را برطرف نکرده است. نقص صوتی مذکور در سناریوهای مختلفی نظیر پیمایش در وب‌سایت‌ها، دریافت اعلان‌ها، بازشدن کیبورد، مکالمات تلفنی یا حتی فعال‌سازی حالت پرواز و تغییر سریع روشنایی نمایشگر رخ می‌دهد. برخی کاربران حتی پس از مرجوع‌کردن دستگاه و دریافت یک نمونه‌ی نو، دوباره با همین مشکل صوتی مواجه شدند. مشخص نیست منشا این نقص یک ایراد نرم‌افزاری ساده است یا به ساختار سخت‌افزاری دستگاه‌ها ارتباط دارد. در صورت نرم‌افزاری بودن ماجرا، انتشار آپدیت جدید مشکل را برطرف خواهد کرد؛ اما وجود نقص سخت‌افزاری ممکن است فرآیند فراخوان دستگاه‌ها را ضروری کند. اپل هنوز در مورد این مشکل صحبتی نکرده است. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "از هر ۸ سرطان در جهان، یک مورد احتمالاً ناشی از عفونت است", "link": "https://www.zoomit.ir/health-medical/468245-study-links-infections-to-global-cancers/", "summary": "پژوهش جدید سازمان جهانی بهداشت نشان می‌دهد عفونت‌های ویروسی، باکتریایی و انگلی در ایجاد بخش قابل‌توجهی از سرطان‌ها نقش دارند.", "date_str": "2026-10-01T18:05:00+00:00", "hash": "b932dbb5805806e1", "title_fa": "از هر ۸ سرطان در جهان، یک مورد احتمالاً ناشی از عفونت است", "summary_fa": "پژوهش جدید سازمان جهانی بهداشت نشان می‌دهد عفونت‌های ویروسی، باکتریایی و انگلی در ایجاد بخش قابل‌توجهی از سرطان‌ها نقش دارند. تبلیغات حدود ۱۲ درصد از کل موارد سرطان در جهان در سال ۲۰۲۴ احتمالاً در نتیجه عفونت ایجاد شده‌اند. پژوهش جدیدی از سازمان جهانی بهداشت نشان می‌دهد که ۲٫۳ میلیون مورد جدید سرطان در آن سال با عفونت‌های ویروسی، باکتریایی یا انگلی ارتباط داشته‌اند. براساس یافته‌ها، بخش عمده سرطان‌های مرتبط با عفونت فقط به پنج عامل بیماری‌زا مربوط می‌شود. باکتری هلیکوباکتر پیلوری و ویروس پاپیلومای انسانی یا HPV هرکدام با حدود ۴ درصد از کل موارد سرطان جهان ارتباط داشته‌اند. پس از آن‌ها، ویروس هپاتیت B با سهم حدود ۲ درصد، ویروس اپشتین‌بار با یک درصد و هپاتیت C با سهمی کمتر از یک درصد قرار دارند. عوامل عفونی یادشده در مجموع می‌توانند در ایجاد بیش از ۲۰ نوع سرطان ازجمله سرطان معده ، سرطان کبد ، سرطان دهانه رحم و برخی سرطان‌های خون نقش داشته باشند. رابطه میان عفونت‌ها و سرطان دهه‌ها است که مطالعه می‌شود. برخی از پژوهشگران مطالعه جدید حدود ۳۰ سال روی همین موضوع کار کرده‌اند و پیش‌تر سهم سرطان‌های ناشی از عفونت را در سال‌های ۱۹۹۰، ۲۰۰۲، ۲۰۰۸، ۲۰۱۲ و ۲۰۱۸ بررسی کرده بودند. برخی داده‌های قدیمی‌تر سهم بالاتری برای عفونت‌ها نشان می‌دادند. برای نمونه، این رقم در سال ۲۰۰۲ تا حدود ۱۸ درصد برآورد شده بود. بااین‌حال، پژوهشگران تأکید می‌کنند که نمی‌توان این اعداد را مستقیماً با یکدیگر مقایسه کرد، زیرا کیفیت داده‌ها و روش‌های جمع‌آوری اطلاعات در طول زمان تغییر کرده است. هدف مطالعه جدید نیز بررسی روند تاریخی کاهش یا افزایش این نوع سرطان‌ها نبوده است. پژوهشگران بیشتر تلاش کرده‌اند مشخص کنند در چه بخش‌هایی از جهان، کنترل و پیشگیری از عفونت‌ها می‌تواند به کاهش موارد سرطان کمک کند. کپی لینک ویروس چگونه سلول را سرطانی می‌کند؟ ویروس‌ها می‌توانند از چند مسیر"}, {"source": "Zoomit", "title": "قیمت گوشی‌های سری گلکسی اس ۲۷ لو رفت؛ سامسونگ محصولاتش را گران‌تر می‌کند", "link": "https://www.zoomit.ir/mobile/468251-galaxy-s27-price-increase-rumors/", "summary": "شایعات حاکی از افزایش قیمت سری گلکسی S27 سامسونگ هستند.", "date_str": "2026-10-01T17:40:00+00:00", "hash": "fdeb93d16eb30b33", "title_fa": "قیمت گوشی‌های سری گلکسی اس ۲۷ لو رفت؛ سامسونگ محصولاتش را گران‌تر می‌کند", "summary_fa": "شایعات حاکی از افزایش قیمت سری گلکسی S27 سامسونگ هستند. تبلیغات گزارشی جدید از کره‌ی جنوبی نشان می‌دهد که گوشی‌های سری گلکسی S27 دست‌کم ۱۳۰ هزار وون (حدود ۹۵ دلار) گران‌تر از نسل گذشته به بازار عرضه خواهند شد. نرخ یادشده تنها به مدل پایه‌ی این سری اختصاص دارد و نسخه‌های دارای فضای ذخیره‌سازی بیشتر، با جهش قیمتی بزرگ‌تری نسبت‌به خانواده‌ی گلکسی S26 روبه‌رو می‌شوند. قیمت گلکسی S26 اولترا در زمان عرضه ۱٬۲۹۹ دلار (در کانفیگ ۲۵۶ گیگابایتی) و ۱٬۴۹۹ دلار (در کانفیگ ۵۱۲ گیگابایتی) بود. گفته می‌شود قیمت گلکسی S27 اولترا از ۱٬۳۹۹ دلار آغاز خواهد شد و مدل ۵۱۲ گیگابایتی به ۱٬۵۴۹ دلار یا قیمتی بالاتر خواهد رسید. نسخه‌ی یک ترابایتی این پرچمدار جدید نیز ممکن است به مرز ۲٬۰۰۰ دلار نزدیک شود، در حالی که مدل پیشین با قیمت ۱٬۷۹۹ دلا ایت خلق کند. بر اساس بیانیه‌ی انویدیا ، پروژه‌ی Lyra 2.0 که برای ارائه در رویداد SIGGRAPH Asia 2026 پذیرفته شده، با رفع دو چالش بنیادین در مدل‌های ویدئویی یعنی فراموشی مکانی و انحراف زمانی، امکان بازتولید فضاهای سه‌بعدی در مقیاس وسیع را فراهم می‌آورد. کدهای رابط کاربری، وزن‌های مدل و حتی اسکریپت‌های آموزش به‌طور کامل و رایگان روی گیت‌هاب و هاگینگ‌ فیس منتشر شده‌اند. ۰:۰۰ / ۰:۰۰ لایک روش‌های پیشینِ تولید ویدئو هنگام جابه‌جایی طولانی دوربین با افت کیفیت شدیدی روبه‌رو می‌شدند. وقتی کاربر پس از گشت‌وگذار در محیط به نقطه‌ی ابتدایی بازمی‌گشت، مدل به دلیل محدودیت حافظه‌ی زمانی، جزئیات گذشته را فراموش می‌کرد و ساختار متفاوتی را پدید می‌آورد. تجمع خطاهای کوچک در گذر زمان نیز به اعوجاج هندسی و بصری کل صحنه ختم می‌شد. ۰:۰۰ / ۰:۰۰ لایک پژوهشگران برای حل مسئله‌ی فراموشی مکانی، هندسه‌ی سه‌بعدی هر فریم را نگهداری می‌کنند و از آن برای مسیریابی داده‌ها، فراخوانی فریم‌های پیشین و تطبیق دقیق زاویه‌ی دید با معماری DiT بهره می‌گیرند. آموزش مدل با تاریخچه‌های خودافزوده سبب می‌شود که سیستم به‌جای تکثیر خطا، انحراف‌های زمانی را به‌صورت خودکار برطرف کند. ۰:۰۰ / ۰:۰۰ لایک خروجی‌های حاصل از این سازوکار تنها ویدئوهای نمایشی گذرا نیستند، بلکه به ساختارهای موسوم به 3DGS (توزیع گاوسی سه‌بعدی) و مش‌های بهینه‌سازی‌شده تبدیل می‌شوند. چنین داده‌هایی قابلیت انتقال مستقیم به موتورهای فیزیکی نظیر Isaac Sim"}, {"source": "Zoomit", "title": "سه دقیقه بحرانی در کابین خلبان؛ پرواز ایر فرانس ۴۴۷ چگونه سقوط کرد؟", "link": "https://www.zoomit.ir/aviation-aerospace/468207-air-france-447-crash-investigation/", "summary": "سقوط مرگبار پرواز ۴۴۷ ایر فرانس در سال ۲۰۰۹، ۲۲۸ کشته بر جای گذاشت. دلایل سقوط این پرواز چه بود؟", "date_str": "2026-10-01T16:10:00+00:00", "hash": "6b517079717efe57", "title_fa": "سه دقیقه بحرانی در کابین خلبان؛ پرواز ایر فرانس ۴۴۷ چگونه سقوط کرد؟", "summary_fa": "سقوط مرگبار پرواز ۴۴۷ ایر فرانس در سال ۲۰۰۹، ۲۲۸ کشته بر جای گذاشت. دلایل سقوط این پرواز چه بود؟ تبلیغات اول ژوئن ۲۰۰۹، پرواز AF447 ایر فرانس از ریودوژانیرو به مقصد پاریس در حال عبور از اقیانوس اطلس بود. هواپیمای ایرباس A330 با ۲۲۸ س as glad I'd packed an all-in-one worldwide adapter and my wired headphones. Still, I wish I had brought fewer shirts and could have gone without a fancy dress. When I set out on my first solo international trip — a two-week journey through Ireland, the UK, and Iceland, along with pit stops in New York and Chicago — I was plagued by one question: What should I pack? Since I was only bringing a carry-on suitcase and a backpack, every item had to earn its place. By the time I got home, I made plenty of memories — and came to a much clearer sense of what I'd pack again, and what I'd leave behind. Here are four items I was glad I brought, and three I could've gone without. I m glad I packed a light jacket that worked in so many different climates. Rachel Bernstein Even though I went on this trip in the summer, I knew several places I was visiting would be rainy. But because of the different climates I was going to, I quibbled over how warm I wanted a jacket to be. I settled on an older, rain-resistant jacket that had lost some of its fluff rather than a light windbreaker. The jacket kept me warm in the Icelandic mist and didn't overwhelm me in New York during evening showers. Bringing local currency was a last-minute decision I don t regret. Rachel Bernstein Right before my trip, I decided to get Icelandic krónur, British pounds, and some euros. I spent a long time deciding whether to bite the bullet and get paper cash, wondering if that would even be useful. Since I was traveling alone, I erred on the side of caution and picked up some bills. Even though I didn't use it every day — except at the airport and to buy some souvenirs at small shops — bringing local currency gave me peace of mind, and I would certainly pack it again. An all-in-one worldwide adapter was crucial. Rachel Bernstein If I had to pick one item as most essential, it would be my all-in-one travel adapter . Since space in my bag was scarce, this all-in-one version was perfect, as it preserved room in my suitcase for other items and prevented me from bringing multiple adapters. Bringing wired headphones was a lifesaver on flights. Rachel Bernstein I always keep a pair of wired headphones in my bag with all my chargers. A few times on my flights, when a TV show wouldn't download in tim", "date_str": "2026-10-02T13:37:01+00:00", "hash": "dcc0399268c0a3f3", "title_fa": "من 2 هفته فقط با یک دست و یک وسیله شخصی به خارج از کشور سفر کردم. این چیزی است که کار کرده است - و آرزو می کنم چه چیزی را پشت سر بگذارم.", "summary_fa": "من فقط با یک چمدان دستی و یک وسیله شخصی به ایرلند، بریتانیا و ایسلند سفر کردم. راشل برنشتاین وقتی به مدت دو هفته به تنهایی به خارج از کشور سفر کردم، فقط یک چمدان دستی و یک وسیله شخصی با خود آوردم. خوشحالم که یک آداپتور همه کاره در سراسر جهان و هدفون های سیمی خود را بسته بودم. با این حال، ای کاش پیراهن های کمتری آورده بودم و می توانستم بدون یک لباس شیک بروم. وقتی اولین سفر بین المللی انفرادی خود را آغاز کردم - یک سفر دو هفته ای از طریق ایرلند، بریتانیا و ایسلند، همراه با ایستگاه های پیت در نیویورک و شیکاگو - با یک سوال آزارم داد: چه وسایلی را ببندم؟ از آنجایی که من فقط یک چمدان دستی و یک کوله پشتی می آوردم، هر کالایی باید جای خودش را می گرفت. زمانی که به خانه رسیدم، خاطرات زیادی ساختم - و به درک بسیار واضح‌تری از آنچه که دوباره بسته‌بندی می‌کردم و آنچه را پشت سر خواهم گذاشت، رسیدم. در اینجا چهار مورد وجود دارد که از آوردن آنها خوشحال بودم و سه موردی که می توانستم بدون آنها بروم. خوشحالم که یک ژاکت سبک بسته بندی کردم که در آب و هوای مختلف کار می کرد. راشل برنشتاین با وجود اینکه در تابستان به این سفر رفتم، می‌دانستم که چندین مکان که از آن بازدید می‌کنم بارانی خواهد بود. اما به دلیل آب و هوای متفاوتی که قرار بود به آنجا بروم، در مورد اینکه چقدر می‌خواهم یک ژاکت گرم باشد، دعوا کردم. روی یک کاپشن قدیمی‌تر و مقاوم در برابر باران نشستم که مقداری از کرک خود را از دست داده بود تا یک بادگیر سبک. ژاکت مرا در غبار ایسلندی گرم نگه می داشت و در نیویورک در هنگام دوش های عصرانه مرا تحت الشعاع قرار نمی"}, {"source": "Business Insider", "title": "Tesla sales smash Wall Street's expectations", "link": "https://www.businessinsider.com/tesla-deliveries-q3-reveals-how-many-evs-it-sold-2026-9", "summary": "Tesla began adding the Cybercab to its robotaxi fleet in September. Cheng Xin/Getty Images Tesla said on Friday it sold 486,000 EVs in the third quarter. The figures beat Wall Street's expectations and follow Elon Musk's automaker posting record sales last year. Investors are increasingly focused on Tesla's robotics and AI ventures and rumors of a merger with SpaceX. Tesla's EV business is still going strong. Elon Musk's electric carmaker announced on Friday that it sold 486,532 vehicles in the third quarter, down 2% year over year. The figures came in well above Wall Street's expectations. Tesla shares rose more than 2% in premarket trading on the news. Analysts were expecting the company to deliver around 463,761 EVs, according to a consensus compiled by Bloomberg, while Tesla's own compilation of analyst forecasts predicted 462,000 deliveries. Tesla posted record sales in Q3 last year as buyers rushed to take advantage of the $7,500 tax credit for new EVs, which expired in September 2025. Since then, the US EV market has cratered . Sales of electric vehicle models in August were down 47% from 2025, per data from Cox Automotive , and a host of automakers have rolled back their EV plans and pulled electric models from the US market. Tesla has ridden out the EV winter better than most. The Model Y maker has increased its share of the US market since the tax credit went away, and posted a mega sales beat in the second quarter. The reward for that good news was Tesla's worst stock price drop in a year, with investors increasingly showing more interest in the company's robotics and autonomous vehicle endeavors. Tesla began adding the Cybercab , a gold-clad robotaxi without pedals or a steering wheel, to its robotaxi fleet in September, and is gearing up to begin production of its Optimus humanoid robot before the end of the year. The company's robotaxi network remains limited to six cities in Texas and Florida, lagging rivals Waymo and well behind the ambitious targets set out by Musk at the end of last year. The relatively slow progress has weighed on Tesla's share price, which is down more than 20% since the start of the year. Investors have one eye on rumors of a potential merger with SpaceX, which has eclipsed Tesla's market cap since its record-breaking public listing in June. Musk and other SpaceX executives have hinted that a merger could be on the cards, with the billionaire teasing a potential combination when asked about the relationship between the", "date_str": "2026-10-02T13:06:19+00:00", "hash": "9ddfb1e212930f53", "title_fa": "فروش تسلا انتظارات وال استریت را شکست", "summary_fa": "تسلا در سپتامبر شروع به اضافه کردن Cybercab به ناوگان روباتاکسی خود کرد. Cheng Xin/Getty Images تسلا روز جمعه اعلام کرد که در سه ماهه سوم 486000 دستگاه برقی فروخته است. این ارقام بالاتر از انتظارات وال استریت است و به دنبال رکورد فروش خودروساز ایلان ماسک در سال گذشته است. سرمایه گذاران به طور فزاینده ای بر روی سرمایه گذاری های رباتیک و هوش مصنوعی تسلا و شایعات مربوط به ادغام با اسپیس ایکس متمرکز شده اند. تجارت خودروهای الکتریکی تسلا همچنان قوی است. خودروساز برقی ایلان ماسک روز جمعه اعلام کرد که در سه ماهه سوم 486532 دستگاه خودرو فروخته است که نسبت به سال گذشته 2 درصد کاهش داشته است. ارقام بسیار بالاتر از انتظارات وال استریت بود. سهام تسلا در معاملات قبل از بازار در اخبار بیش از 2 درصد افزایش یافت. بر اساس اجماع جمع‌آوری شده توسط بلومبرگ، تحلیلگران انتظار داشتند که این شرکت حدود 463761 خودروی برقی تحویل دهد، در حالی که پیش‌بینی تحلیلگران خود تسلا 462000 تحویل را پیش‌بینی کرده بود. تسلا در سه ماهه سوم سال گذشته رکورد فروش خود را ثبت کرد زیرا خریداران عجله داشتند تا از 7500 دلار اعتبار مالیاتی برای خودروهای برقی جدید استفاده کنند که در سپتامبر 2025 منقضی شد. بر اساس داده‌های Cox Automotive، فروش مدل‌های خودروهای الکتریکی در ماه اوت نسبت به سال 2025، 47 درصد کاهش داشته است و بسیاری از خودروسازان برنامه‌های خودروهای الکتریکی خود را لغو کرده‌اند و مدل‌های الکتریکی را از بازار ایالات متحده خارج کرده‌اند. تسلا زمستان خودروهای برقی را بهتر از بقیه سپری کرده است. سازنده Model Y از زمانی که اعتبار مالیاتی از بین رفت، سهم خود را از بازار ایالات متحده افزایش داد و در سه ماهه دوم رکورد فروش بالایی را به ثبت رساند. پاداش این خبر خوب بدترین کاهش قیمت سهام تسلا در یک سال"}, {"source": "Business Insider", "title": "I raised $125,000 in sponsorships for my wedding. It accidentally launched an 8-figure business.", "link": "https://www.businessinsider.com/raised-risk-averse-built-sold-eight-figure-business-2026-10", "summary": "Courtesy of Carrie Kerpen Carrie Kerpen's parents taught her to do what she loved—as long as it was stable. They were very risk-averse and taught her to be the same way. Carrie gradually became more comfortable with risk, which helped her as an entrepreneur. This as-told-to essay is based on a conversation with Carrie Kerpen , cofounder and CEO of Whisper Group . It has been edited for length and clarity . My parents wanted me to do something I loved that would bring me joy. But they also emphasized that I should find a secure, steady career . My dad opened a private law practice for a very brief time before leaving to become a law clerk and later a judge. He wanted the security and pension that came with a government job, and he was willing to sacrifice a lot of potential income for that predictability. My mom, a social worker, also had an extremely steady job. They took a similar approach to money and investing . When the stock market crashed in the 1980s, I heard the story on the news and asked my parents if we were OK. I remember my dad saying I shouldn't worry — my parents didn't invest in that, so we were safe. I only took risks when I felt I had to My family had a very low-risk, simple life . My parents were content with that. At first I was, too. I was only comfortable taking risks once not taking them seemed intolerable. I got married for the first time at 24, and it quickly became clear the marriage wasn't going to work. I didn't have the courage to leave until my daughter was born when I was 26. Suddenly, the risk of being a single mom paled in comparison to the alternative: my daughter being raised in an unhappy home. I took a similar approach at work. I'd been told I would be a great salesperson . Yet I didn't take the leap into sales until the alternative — staying at a lesser-paying job — became too stressful. I leveraged a sponsored wedding into a business My biggest risk was my second wedding , which also turned out to be the launch of my business. When my now-husband David proposed, he told me he wanted a larger-than-life wedding. I didn't like that idea: I was holding shame over my first marriage and divorce. Still, I wanted David to have the wedding of his dreams, in a way we could afford. So, I took a huge risk: I contacted a minor-league baseball team about renting out their stadium. Then, we sold about $125,000 in sponsorships. Back in 2006, the idea of a sponsored wedding was totally new and could come across as a little gauche. But", "date_str": "2026-10-02T13:04:01+00:00", "hash": "919f82e9c04a9d67", "title_fa": "برای عروسی ام 125000 دلار به عنوان اسپانسر جمع آوری کردم. به طور تصادفی یک تجارت 8 رقمی راه اندازی کرد.", "summary_fa": "با حسن نیت از کری کرپن والدین کری کرپن به او آموختند تا کاری را که دوست داشت انجام دهد - تا زمانی که ثابت بود. آنها بسیار ریسک گریز بودند و به او یاد دادند که همین طور باشد. کری به تدریج با ریسک راحت تر شد و این به او به عنوان یک کارآفرین کمک کرد. این مقاله همانطور که گفته شد بر اساس گفتگو با کری کرپن، یکی از بنیانگذاران و مدیر عامل گروه Whisper است. برای طول و وضوح ویرایش شده است. پدر و مادرم از من می خواستند کاری را انجام دهم که دوستش داشتم و باعث خوشحالی من شود. اما آنها همچنین تأکید کردند که باید یک شغل مطمئن و پایدار پیدا کنم. پدرم قبل از اینکه منشی و بعداً قاضی شود، یک دفتر وکالت خصوصی را برای مدت کوتاهی افتتاح کرد. او امنیت و حقوق بازنشستگی را می خواست که با یک شغ
