ق در مراسم گلدن گلوب کرد شرکت کرد. جنا اورتگا در مراسم گلدن گلوب 2026. مونیکا شیپر/ گتی ایماژ دیلارا فیندیک اوغلو لباس مشکی گلدن گلوب خود را طراحی کرد که دارای یقه بلند، دامن بلند، بریدگی نیم تنه و حاشیه در شانه ها بود. در حالی که"}, {"source": "Business Insider", "title": "Reporters are being denied entry to the White House after Trump's ban", "link": "https://www.businessinsider.com/reporters-denied-white-house-trump-media-ban-cnn-msnow-politico-2026-9", "summary": "CNN and MS NOW said their reporters were denied access to White House grounds on Saturday. Jim WATSON / AFP via Getty Images CNN and MS NOW said their reporters were denied entry to White House grounds Saturday morning. Donald Trump said on Friday that he was banning the networks and Politico from the White House. The ban follows earlier restrictions on reporters covering the Pentagon. Reporters for CNN, MS NOW, and Politico were denied entry to White House grounds on Saturday morning, the outlets said, one day after President Donald Trump said he was banning them for their coverage of him. \"Early today, CNN journalists were denied access to the White House grounds,\" a CNN spokesperson said in a statement. \"We have a right under the U.S. Constitution to do our reporting without hindrance or interference from the government.\" \"This ban is an illegal assault on this fundamental right,\" the spokesperson added. A spokesperson for MS NOW said its journalists were also denied access. In a note to Politico's newsroom shared with Business Insider, Politico's Global editor in chief, Jonathan Greenberger, said a Politico reporter had her press pass taken by the Secret Service. \"We stand by her and all reporters here covering the White House,\" Greenberger said. \"As we said yesterday, we will vigorously defend our First Amendment rights.\" President Donald Trump said on Friday that he was banning MS NOW, CNN, and Politico from the White House for what he described as their \"fiction and lies.\" \"Media Outlets shouldn't be able to constantly write or report FICTION and LIES when they're covering the President of the United States,\" Trump said on Truth Social, his social media platform. In its statement on Saturday, MS NOW said it \"intends to take any and all steps necessary to defend our First Amendment rights and the essential role of independent journalism in our democracy.\" CNN said it \"will continue to report on the actions and processes of this administration without fear or favor.\" Akayla Gardner, a White House correspondent for MS NOW, said on air that an officer took her press badge after it didn't scan. \"There was a red beeping light, and so the officer asked me to hand over my badge,\" she said. \"He said that it was disabled.\" Trump arrived at Camp David late Friday night, according to a White House pool report. Politico and Business Insider are both owned by Axel Springer SE. This is a breaking news story. Check back for updates. Read the original article on Bus", "date_str": "2026-09-19T15:19:43+00:00", "hash": "8074f55410e8ac77", "title_fa": "پس از ممنوعیت ترامپ، خبرنگاران از ورود به کاخ سفید منع شدند", "summary_fa": "CNN و MS NOW گفتند که خبرنگاران آنها روز شنبه از دسترسی به محوطه کاخ سفید محروم شدند. جیم واتسون / خبرگزاری فرانسه از طریق Getty Images CNN و MS NOW گفتند که خبرنگاران آنها صبح شنبه از ورود به محوطه کاخ سفید منع شدند. دونالد ترامپ روز جمعه گفت که این شبکه ها و پولیتیکو را از کاخ سفید منع می کند. این ممنوعیت به دنبال محدودیت های قبلی برای خبرنگارانی است که پنتاگون را پوشش می دهند. یک روز پس از اینکه دونالد ترامپ، رئیس جمهور آمریکا گفت که آنها را به دلیل پوشش خبری او ممنوع کرده است، به خبرنگاران CNN، MS NOW و Politico صبح شنبه اجازه ورود به محوطه کاخ سفید داده نشد. سخنگوی سی‌ان‌ان در بیانیه‌ای گفت: «اوایل امروز، خبرنگاران CNN از دسترسی به محوطه کاخ سفید محروم شدند. ما حق داریم تحت آمریکا قانون اساسی گزارش‌های خود را بدون مانع یا مداخله دولت انجام دهیم.\" سخنگوی افزود: \"این ممنوعیت تجاوزی غیرقانونی به این حق اساسی است.\" سخنگوی MS NOW گفت که دسترسی خبرنگاران آن نیز ممنوع شده است. در یادداشتی به اتاق خبر پولیتیکو که با Business Insider به اشتراک گذاشته شده است، سردبیر Politico's Global، گفت که جاناتان سکرت‌برگر سردبیر نشریه Politico، یکی از گذرنامه‌های Greenberger سرویس مطبوعاتی او را گرفته است. گرین برگر گفت: \"ما در کنار او و همه خبرنگارانی که در اینجا کاخ سفید را پوشش می دهند، ایستاده ایم.\" همانطور که دیروز گفتیم، ما به شدت از حقوق متمم اول خود دفاع خواهیم کرد. دونالد ترامپ، رئیس‌جمهور آمریکا روز جمعه گفت که MS NOW، CNN و Politico را به دلیل آنچه که «تخیلی و دروغ» توصیف کرد، از کاخ سفید منع می‌کند. ترامپ در شبکه اجتماعی Truth Social، پلتفرم رسانه اجتماعی او، گفت: «رسانه‌ها نباید بتوانند مدام داستان‌های تخیلی و دروغ‌ها را زمانی که رئیس‌جمهور ایالات متحده را"}, {"source": "Business Insider", "title": "12 game-day foods you can make in a slow cooker or Crock-Pot", "link": "https://www.businessinsider.com/best-slow-cooker-crock-pot-recipes-super-bowl-game-day", "summary": "You don t have to spend every Sunday sweating over a hot stove to serve favorites like Buffalo Chicken dip, ribs, or hot wings. Sarah Olson/The Magical Slow Cooker A slow cooker or Crock-Pot can come in handy when prepping food for game day. They can help whip up game-day appetizers from dips to ribs and spicy wings. Chili is another easy, hearty slow-cooker recipe to make before watching the game. Football season is finally here — which means Sundays are once again all about touchdowns, trash talk, and a very serious spread of game-day snacks. Whether you're locked in on the game or mainly showing up for Buffalo Chicken dip , ribs, and hot wings, you don't have to spend the entire day hovering over a hot stove to feed a crowd. Business Insider spoke with cookbook authors Sarah Olson, who wrote \" The Magical Slow Cooker ,\" and Kim Laidlaw, author of \" Everyday Slow Cooking: Modern Recipes for Delicious Meals ,\" for ideas for easy game-day recipes . These recipes can all be made in a slow cooker, allowing you to throw everything into your Crock-Pot and get back to the game. Meatballs are a filling game-day appetizer you can make in a slow cooker. Grape jelly meatballs. Sarah Olson/The Magical Slow Cooker Olson recommends her slow-cooker meatballs recipe for game day. \"I love grape-jelly meatballs, which only have three ingredients,\" she said. \"They're so good, everyone will ask you for the recipe.\" Another recipe from Spend With Pennies suggests placing your seasoned, raw meatballs in the slow cooker, topping them with sauce, and letting it finish them off. Beer brats can also be made in a slow cooker. Beer and garlic brats. Sarah Olson/The Magical Slow Cooker Brats with onions, peppers, and garlic, simmered in the slow cooker with beer, are another of Olson's favorite game-day recipes. \"When the guests arrive, they get to choose when they want to eat since the slow cooker keeps these brats nice and warm during the game,\" she wrote on her website, The Magical Slow Cooker . Plus, you can even choose peppers to reflect the colors of your favorite team. Brisket is perfect for feeding a larger family. Ilia Nesolenyi/Getty Images/iStockphoto \"Brisket is a natural partner for the slow cooker, as a gentle braise renders it meltingly tender,\" Kim Laidlaw wrote in \"Everyday Slow Cooking: Modern Recipes for Delicious Meals.\" Laidlaw's recipe for slow-cooked braised brisket features garlic, onion, dry red wine, carrots, and either chicken or beef stock, accompanied by", "date_str": "2026-09-19T15:04:02+00:00", "hash": "4e087f2135d678b2", "title_fa": "12 غذای روز بازی که می توانید در اجاق گاز آهسته یا قابلمه درست کنید", "summary_fa": "لازم نیست هر یکشنبه را با عرق کردن روی اجاق داغ بگذرانید تا غذاهای مورد علاقه مانند دیپ مرغ بوفالو، دنده ها یا بال های داغ سرو کنید. سارا اولسون/آهسته پز جادویی یک اجاق گاز آهسته یا قابلمه می تواند هنگام تهیه غذا برای روز بازی مفید باشد. آنها می توانند به تهیه پیش غذای روز بازی از دیپ تا دنده و بال های تند کمک کنند. فلفل قرمز یکی دیگر از دستور العمل های آرام پز ساده و دلچسب است که قبل از تماشای بازی درست می شود. بالاخره فصل فوتبال فرا رسید - این بدان معناست که یکشنبه‌ها بار دیگر همه چیز درباره بازی‌ها، صحبت‌های مربوط به زباله‌ها و پخش بسیار جدی میان‌وعده‌های روز بازی است. فرقی نمی‌کند در بازی قفل شده باشید یا عمدتاً برای غذای بوفالو چیکن، دنده‌ها، و بال‌های داغ حاضر می‌شوید، لازم نیست تمام روز را روی یک اجاق گاز داغ بگذرانید تا غذای جمعیت را تغذیه کنید. Business Insider با نویسندگان کتاب آشپزی سارا اولسون، که «آهسته پز جادویی» را نوشت، و کیم لایدلاو، نویسنده «آشپزی روزمره: دستور العمل های مدرن برای غذاهای خوشمزه» صحبت کرد تا ایده هایی برای دستور العمل های آسان روز بازی ارائه دهد. این دستور العمل ها را می توان در یک اجاق آهسته درست کرد و به شما این امکان را می دهد که همه چیز را در ظرف غذای خود بیندازید و به بازی بازگردید. کوفته ها یک پیش غذای سیر کننده در روز بازی هستند که می توانید در آرام پز درست کنید. کوفته ژله انگور. سارا اولسون/آهسته پز جادویی اولسون دستور تهیه کوفته آرام پز خود را برای روز بازی توصیه می کند. او گفت: \"من عاشق کوفته ژله انگور هستم که فقط سه ماده دارد.\" آنها خیلی خوب هستند، همه از شما دستور غذا را خواهند پرسید. دستور دیگری از «Spend With Pennies»"}, {"source": "Business Insider", "title": "Exhausted from years of big-city hustle, I moved to an idyllic mountain town in Colorado. It wasn't so idyllic for me.", "link": "https://www.businessinsider.com/moved-to-small-town-from-new-york-city-downsides-colorado-2026-9", "summary": "After years of living in the mountains, I realized it wasn t the paradise I had hoped it would be. Courtesy of Allison Snyder After years of growing my career in New York City, I moved to a small mountain town in Colorado . I loved being surrounded by nature, but I struggled to put down roots and missed parts of city life. Spending time away from this town helped me realize I needed to leave. A few years later, I did. At 34, after years of climbing the ranks of a Wall Street law firm, I was burned out and deeply disconnected from the natural world. Unsure of where I wanted to live, after leaving my job, I spent a year camping in the American Wes t. During that trip, I visited Telluride, Colorado, and was immediately awed by the rose-emerald hues, toothy ridgelines, and elk herds roaming the valley. It was the sort of place I often fantasized about escaping to, and it was easy to see why it's routinely voted one of the best mountain towns in the US. In early 2017, ready to settle in one spot, I moved to a valley just south of Telluride, certain I'd find a simpler, more connected way of life. I enjoyed reconnecting to nature, but felt like something was missing I enjoyed being surrounded by nature while living in Colorado. wayneharney/Getty Images At first, I was awash in the alpine paradise . Outside my front door, there were countless trails and 13,000-foot peaks to explore. During winter, I admired magpies swooping in the snow, and savored the effort of chopping kindling and tending a fire. In spring, I was mesmerized by the aspen blooming green across the mountains and thrilled by the return of hibernating marmots. The long days of summer burst with wildflowers and adventures along lichen-splotched ridgelines. And by fall, the aspens enthralled again, goldening against the sun's low-hanging light. Living there, I couldn't help but feel connected to the Earth's natural cycles. But by the end of my first year, I also found myself longing for New York City. For me, this area's tight-knit community felt insular and hard to break into. Instead of being welcomed, I was often questioned about why I was there or how I'd found the place. I also craved other aspects of my city life , like interacting with a broad range of people from different backgrounds on a regular basis — in a town with fewer than 200 residents with an economy driven by real estate and tourism, it felt like there was little diversity in the area's population. For years, I tried to put down roo", "date_str": "2026-09-19T14:35:01+00:00", "hash": "97856c3aa273c73e", "title_fa": "خسته از سال ها شلوغی شهرهای بزرگ، به یک شهر کوهستانی ایده آل در کلرادو نقل مکان کردم. برای من آنقدرها هم جالب نبود.", "summary_fa": "پس از سالها زندگی در کوهستان، متوجه شدم که این بهشتی نبود که انتظارش را داشتم. با حسن نیت از آلیسون اسنایدر پس از سال ها رشد حرفه ای خود در شهر نیویورک، به یک شهر کوهستانی کوچک در کلرادو نقل مکان کردم. من عاشق محاصره شدن در طبیعت بودم، اما برای ریشه یابی تلاش کردم و بخش هایی از زندگی شهری را از دست دادم. گذراندن زمان دور از این شهر به من کمک کرد تا بفهمم باید ترک کنم. چند سال بعد این کار را کردم. در 34 سالگی، پس از سال‌ها صعود به رده‌های یک شرکت حقوقی وال استریت، دچار سوختگی شدم و عمیقاً ارتباطم با دنیای طبیعی قطع شد. مطمئن نبودم که کجا می‌خواهم زندگی کنم، پس از ترک شغلم، یک سال را در وس تی آمریکا کمپ زدم. در طول آن سفر، من از تلوراید، کلرادو بازدید کردم و بلافاصله با رنگ های رز زمردی، خطوط دندانه دار، و گله های گوزن که در دره پرسه می زنند، شگفت زده شدم. این جایی بود که من اغلب در مورد فرار از آن خیال پردازی می کردم، و به راحتی می توان فهمید که چرا به طور معمول به عنوان یکی از بهترین شهرهای کوهستانی در ایالات متحده انتخاب می شود. در اوایل سال 2017، آماده سکونت در یک نقطه، به دره ای در جنوب تلوراید نقل مکان کردم، مطمئناً راهی ساده تر و مرتبط تر برای زندگی پیدا خواهم کرد. من از برقراری ارتباط مجدد با طبیعت لذت بردم، اما احساس می کردم چیزی از دست رفته است، از محاصره شدن در طبیعت در کلرادو لذت می بردم. wayneharney/Getty Images ابتدا در بهشت ​​آلپ غرق بودم. بیرون درب ورودی من، مسیرهای بی شماری و قله های 13000 فوتی برای کاوش وجود داشت. در طول زمستان، من زاغی‌هایی را که در برف می‌چرخیدند، تحسین می‌کردم و"}],
      media: [{"source": "Billboard", "title": "John Farnham’s Family Reveals Health Decline Ahead of Tribute Show", "link": "https://www.billboard.com/music/music-news/john-farnham-health-update-1236344190/", "summary": "John Farnham will not be present at the sold-out concert built to honor his half-century career, his family confirmed the day before the Melbourne event, citing a decline in his health that has kept the details largely private until now. In a statement shared to social media by wife Jill and sons Robert and James, the family explained the decision to go public. Many people have been asking whether John will be involved in the concert or attending Sunday night to watch it all happen. Unfortunately, he will not be able to attend, and as a family, we feel it is important to provide an update on John s health to help explain why, they wrote. John s health has deteriorated in recent months. He now requires continuous oxygen support and uses a wheelchair for mobility. It has also become necessary for John to receive 24-hour nursing care at home. The family added that they d kept these matters private while our family has adjusted to John s changing needs, but felt it was time for fans to understand his circumstances. The decision to keep him home was framed as protective rather than reluctant. As a family, we have decided that it s best for John to remain at home, where he can be safe and comfortable, the statement continued, noting that Farnham was nonetheless deeply moved by the effort put into the show and had wanted, in another world, to thank everyone involved in person: He would undoubtedly have been a little overwhelmed by all the fuss, but he would also have wanted to thank everyone involved. The concert, The Songs of John Farnham: A Living Legend , sold out quickly ahead of Sunday s (Sept. 20) show at Rod Laver Arena and features 120 performers Farnham personally selected, including Jimmy Barnes, Tina Arena, Keith Urban, Jessica Mauboy and Kate Ceberano, with Celine Dion and Hugh Jackman appearing via satellite. Proceeds benefit Head and Neck Cancer Australia, the organization that supported Farnham through treatment following his 2022 oral cancer diagnosis, which required a 12-hour surgery involving 26 surgeons. He was declared cancer-free in 2023 but has made only rare public appearances since, and previously confirmed that singing again is just not possible.", "date_str": "2026-09-20T10:58:58+00:00", "hash": "41ae40f5a4bb1d9c", "title_fa": "خانواده جان فارنهام قبل از نمایش ادای احترام از کاهش سلامتی خود خبر می دهند", "summary_fa": "خانواده او یک روز قبل از رویداد ملبورن تأیید کردند که جان فارنهام در کنسرت فروخته‌شده‌ای که برای قدردانی از فعالیت حرفه‌ای نیم قرنش ساخته شده بود، حضور نخواهد داشت و به استناد به کاهش سلامتی او که جزئیات را تا حد زیادی تا به حال محرمانه نگه داشته است. در بیانیه ای که توسط همسر جیل و پسران رابرت و جیمز در رسانه های اجتماعی به اشتراک گذاشته شد، خانواده تصمیم خود را برای انتشار عمومی توضیح دادند. بسیاری از مردم پرسیده اند که آیا جان در کنسرت شرکت خواهد کرد یا یکشنبه شب برای تماشای همه این اتفاقات شرکت خواهد کرد. متأسفانه، او نمی‌تواند در این مراسم شرکت کند، و به عنوان یک خانواده، ما احساس می‌کنیم که ارائه به‌روزرسانی در مورد سلامت جان برای کمک به توضیح علت، مهم است. سلامت جان در ماه های اخیر بدتر شده است. او اکنون به حمایت مداوم اکسیژن نیاز دارد و از ویلچر برای حرکت استفاده می کند. همچنین دریافت مراقبت 24 ساعته پرستاری در منزل برای جان ضروری شده است. خانواده اضافه کردند که آنها این مسائل را خصوصی نگه داشته اند، در حالی که خانواده ما با نیازهای در حال تغییر جان سازگار شده اند، اما احساس کردند که زمان آن رسیده است که طرفداران شرایط او را درک کنند. تصمیم برای نگه داشتن او در خانه بیشتر به عنوان محافظه کار بود تا بی میلی. به عنوان یک خانواده، ما تصمیم گرفته‌ایم که بهترین کار برای جان در خانه بماند، جایی که بتواند امن و راحت باشد، این بیانیه ادامه داد، و خاطرنشان کرد که با این وجود، فرنهام عمیقاً تحت تأثیر تلاش‌های انجام‌شده برای نمایش قرار گرفته بود و می‌خواست در دنیایی دیگر شخصاً از همه کسانی که درگیر این برنامه بودند تشکر کند: بدون شک او کمی تحت تأثیر این همه هیاهو قرار می‌گرفت، اما"}, {"source": "Billboard", "title": "Ed Sheeran Addresses Controversy at First Show Since Openers, Backing Band Dropped Off Tour, Calls It ‘The Best Show of My Life’", "link": "https://www.billboard.com/music/music-news/ed-sheeran-show-recap-philadelphia-macklemore-controversy-1236344180/", "summary": "Ed Sheeran needed to address the situation before he could start playing guitar. It wasn’t how he wanted to start his show, and he’s made it abundantly clear that the last thing he wants around him is controversy or, in his words, to be an “activist musician.” But here he was, at the first show after his opener and friend Macklemore was kicked off the tour, following pressure by a group of venue owners led by Robert Kraft who took issue with Macklemore’s statement of support toward Palestine. That led to the rest of the tour’s openers and even Sheeran’s backing band for the tour dropping off the tour in solidarity with Macklemore — all of which became a huge news story and PR nightmare for the usually very un-controversial Sheeran. And though he had already made one highly scrutinized statement online while the news story was at its most potent, Sheeran felt the need to address the crowd at Philadelphia s Lincoln Financial Field on Saturday night (Sept. 19) in person, before the show really started. “I’m used to my music being criticized, and I’m always happy to take that because I’m lucky a lot of you like my stuff, and to be honest, I’m surprised,” Sheeran said. “I’m not surprised that other people don’t. It’s normal. But this week, the criticism was about something much more important, and I’ve had to take and make difficult decisions, and I am making mistakes, and I’m so, so sorry. View this post on Instagram What happened in Israel at the Nova music festival on October 7th was horrific and compounded centuries of Jewish pain. What is is happening in Gaza is catastrophic, unjustifiable, and disproportionate,” Sheeran continued. “My heart has been broken by the scale of devastation and loss of civilians lives, of children s lives. And the systemic injustice we re seeing unfold in the West Bank cannot be overlooked. I am already speaking to people across the spectrum to work out how to make a contribution that helps victims of these terrible times, and listening and learning because I do not know enough,” he concluded. “I honestly am so grateful that you re here tonight with me. This concert is still a place where everyone is welcome, and everyone here can stand beside people that have opposing views. Everyone here can stand by people that they don t agree with on everything, and they can all agree on singing these songs. And these songs are about love, hope and unity. The crowd in Philadelphia – a nearly full Lincoln Financial Field – enjoyed that, and ", "date_str": "2026-09-20T06:30:04+00:00", "hash": "be9ef2c97731f19a", "title_fa": "اد شیران در اولین نمایش از زمان افتتاحیه، به بحث و جدل پرداخت، گروه پشتیبان از تور خارج شد، آن را \"بهترین نمایش زندگی من\" می نامد", "summary_fa": "اد شیرن قبل از شروع نواختن گیتار نیاز داشت به این وضعیت رسیدگی کند. این طوری نبود که او می‌خواست برنامه‌اش را شروع کند، و به وفور به صراحت گفته بود که آخرین چیزی که در اطرافش می‌خواهد بحث و جدل است یا به قول او یک «موسیقی‌دان فعال» باشد. اما اینجا بود، در اولین نمایش پس از شروع تور و دوستش مکلمور، به دنبال فشار گروهی از صاحبان سالن به رهبری رابرت کرافت که با بیانیه حمایت مکلمور از فلسطین مخالفت کردند. این امر باعث شد تا بقیه آغاز کنندگان تور و حتی گروه پشتیبان شیرن برای همبستگی با مکلمور تور را کنار بگذارند - که همه اینها به یک خبر بزرگ و کابوس روابط عمومی برای شیران معمولاً بسیار غیرجنجالی تبدیل شد. و اگرچه او قبلاً یک بیانیه بسیار موشکافانه را به صورت آنلاین بیان کرده بود، در حالی که داستان خبری در قوی ترین حالت خود بود، شیران احساس کرد که باید در شنبه شب (سپتامبر) در فیلادلفیا در فیلد مالی لینکلن فیلادلفیا صحبت کند. 19) شخصاً، قبل از اینکه نمایش واقعاً شروع شود. شیران گفت: «من عادت کرده‌ام که موسیقی‌ام مورد انتقاد قرار بگیرد، و همیشه خوشحالم که آن را قبول می‌کنم، زیرا خوش شانس هستم که بسیاری از شما کارهای من را دوست دارید، و صادقانه بگویم، من شگفت‌زده هستم. من تعجب نمی کنم که دیگران این کار را نمی کنند. این طبیعی است. اما این هفته، انتقادها درباره چیز بسیار مهمتری بود و من مجبور شدم تصمیمات سختی بگیرم و تصمیمات سختی بگیرم، و اشتباه می کنم، و بسیار متاسفم. این پست را در اینستاگرام مشاهده کنید آنچه در اسرائیل در فستیوال موسیقی نوا در 7 اکتبر اتفاق افتاد وحشتناک بود و قرن ها درد یهودی را ترکیب کرد. شیران ادامه داد: آنچه در غزه اتفاق می‌افتد فاجعه‌بار، غیرقابل توجیه و نامتناسب است. و"}, {"source": "Billboard", "title": "aespa Open U.S. Leg of SYNK : COMPLæXITY World Tour at New York’s UBS Arena: 11 Best Moments", "link": "https://www.billboard.com/lists/aespa-synk-complaexity-tour-new-york-ubs-arena-best-moments/", "summary": "aespa brought its SYNK : COMPLæXITY tour to UBS Arena in Belmont Park, New York, for the first U.S. date of a live trek running through February 2027, with the quartet delivering a 23-song set focused on their biggest singles and material from their most recent releases. Karina , Winter, Giselle and Ningning opened the tour this past August with two nights at Seoul s Gocheok Sky Dome, drew more than 21,000 in São Paulo, and sold out dates in Santiago, Lima and Mexico City before crossing into the States. The excitement follows the group s second full-length album, LEMONADE , which debuted at No. 9 on the Billboard 200 in June and marked their best sales week since 2022. According to SM Entertainment, SYNK : COMPLæXITY is billed as a creative reset for aespa rather than a continuation of their past three SYNK tours — new performances, new stage design, new visual storytelling, all deliberately built to look nothing like the SYNK : æXIS LINE tour that wrapped at the Tokyo Dome this past April. The clearest evidence of the commitment to the four new solo tracks the members debuted at the tour s opening date in Seoul and released as digital singles earlier this month: Karina s 16 Bit, Winter s Saddle Up, Giselle s BYEB4HELLO and Ningning s I Love You But I Gotta Let You Go, each one showcasing a member stepping out of the group s shared mythology and soundscape to showcase more of their own identity, confidence and emotion on their own terms. From New York, aespa heads to Washington, D.C. (for a Sept. 22 show), Atlanta (Sept. 24), Miami (Sept. 26), Dallas (Sept. 29), Los Angeles (Oct. 3), Oakland (Oct. 6) before wrapping up in the States with an Oct. 9 show at Seattle s Climate Pledge Arena, with the UK and Europe set for January and February. Until we come back next time, you can wait for us, right? Karina asked the crowd during a finale chat, indicating this show was far from the last time the U.S. will see aespa in person. Giselle reaffirmed that sentiment, adding, We ll definitely be back, so don t worry, just wait for us. But before aespa returns with a new show, check out the best moments from the first U.S. show of the SYNK : COMPLæXITY World Tour at New York s UBS Arena.", "date_str": "2026-09-20T05:46:59+00:00", "hash": "e8b06f37a7ed458a", "title_fa": "تور جهانی aespa Open U.S. Leg of SYNK: COMPLæXITY در UBS Arena نیویورک: 11 بهترین لحظه", "summary_fa": "aespa تور SYNK: COMPLæXITY خود را به UBS Arena در بلمونت پارک، نیویورک، برای اولین بار در ایالات متحده از یک سفر زنده که تا فوریه 2027 ادامه می‌یابد، با گروه کوارتت ارائه یک مجموعه 23 آهنگی متمرکز بر بزرگترین تک‌آهنگ‌ها و مطالب منتشر شده اخیرشان ارائه کرد. کارینا، وینتر، ژیزل و نینگنینگ تور را در آگوست گذشته با دو شب در گنبد آسمانی گوچئوک سئول افتتاح کردند، بیش از 21000 نفر در سائوپائولو جذب کردند و قبل از ورود به ایالات متحده، در سانتیاگو، لیما و مکزیکو سیتی تاریخ‌های خود را به فروش رساندند. این هیجان پس از دومین آلبوم کامل گروه به نام LEMONADE اتفاق می‌افتد که در ماه ژوئن در رتبه 9 بیلبورد 200 قرار گرفت و بهترین هفته فروش آن‌ها از سال 2022 را رقم زد. طبق گفته SM Entertainment، SYNK : COMPLæXITY به عنوان یک بازنشانی خلاقانه برای aespa به جای ادامه سه تور SYNK گذشته آنها - اجراهای جدید، طراحی صحنه جدید، داستان سرایی بصری جدید، همه به عمد ساخته شده اند تا هیچ شباهتی به SYNK: æXIS LINE در این تور در آوریل گذشته نداشته باشند. واضح‌ترین شواهد از پایبندی به چهار آهنگ انفرادی جدید که اعضا در تاریخ افتتاحیه تور در سئول شروع به کار کردند و در اوایل این ماه به صورت تک‌آهنگ دیجیتال منتشر شدند: Karina s 16 Bit، Winter s Saddle Up، Giselles BYEB4HELLO و Ningning از I Love You But I Gotta Let You Go، که هر کدام صدایی از گروه را به نمایش می گذارند و صدایی از گروه را به نمایش می گذارند. بیشتر از هویت، اعتماد به نفس و احساسات خود با شرایط خاص خود. از نیویورک، aespa به واشنگتن دی سی (برای نمایش در 22 سپتامبر)، آتلانتا (24 سپتامبر)، میامی (26 سپتامبر)، دالاس (29 سپتامبر)، لس آنجلس (3 اکتبر)، اوکلند (6 اکتبر) قبل از"}, {"source": "Billboard", "title": "Papa Roach’s Louder Than Life Set Scrapped Amid Bassist’s ‘Unexpected’ Emergency", "link": "https://www.billboard.com/music/concerts/papa-roach-cancel-louder-than-life-1236344171/", "summary": "A medical emergency involving bassist Tobin Esperance has knocked Papa Roach out of its scheduled appearance at Louder Than Life, the band confirmed Friday (Sept. 19), just hours before they were due onstage in Louisville. The group framed the decision as guided by doctors rather than choice. After careful consideration and advice from medical professionals, Papa Roach bassist Tobin Esperance will be unable to perform this weekend due to an unexpected emergency, the band said in a statement via social media , adding that his health was their immediate concern and asking fans to respect his privacy. “Therefore, we will not be able to perform at this year’s Louder Than Life festival, and wish everyone the best. Right now, Tobin’s health is our immediate concern. We look forward to welcoming him back on stage in November and appreciate the continued support and respect for his privacy during this time.” No detail on what happened was disclosed. View this post on Instagram The cancellation costs the band its planned closing date of a U.S. run — the Sept. 19 Louder Than Life slot was set to be their final American show before crossing the Atlantic. That festival itself is no small affair: more than 200 acts are playing across the four-day event, including My Chemical Romance, Iron Maiden, Tool and Limp Bizkit. Esperance has been part of Papa Roach s rhythm section since the band formed in 1993, playing on every studio album and co-writing much of its catalog alongside frontman Jacoby Shaddix. That run has produced four Billboard Mainstream Rock Airplay No. 1s — Kill the Noise, No Apologies, Help and Born for Greatness — plus the band s breakthrough Last Resort, which spent time on the Billboard Hot 100 in 2000 and remains one of the era s defining nu-metal singles. Assuming Esperance recovers on schedule, the band picks back up Nov. 1 for its Rise of the Roach tour, opening at Glasgow s OVO Hydro and moving through Dublin, Birmingham, Manchester, London and Cardiff before a run of mainland European dates that wraps Dec. 6 in Lyon.", "date_str": "2026-09-20T05:08:39+00:00", "hash": "a7419e18dfd86903", "title_fa": "مجموعه بلندتر از زندگی پاپا روچ در میان اضطراری «غیر منتظره» نوازنده بیس کنار گذاشته شد", "summary_fa": "گروه تائید کرد روز جمعه (19 سپتامبر)، درست چند ساعت قبل از روی صحنه رفتن در لوئیزویل، یک اورژانس پزشکی شامل توبین اسپرنس، نوازنده باس، پاپا روچ را از حضور برنامه ریزی شده اش در Louder Than Life حذف کرد. این گروه تصمیم را به‌عنوان راهنمایی پزشکان به جای انتخاب تعیین کردند. گروه در بیانیه‌ای از طریق رسانه‌های اجتماعی اعلام کرد که پس از بررسی دقیق و توصیه‌های متخصصان پزشکی، توبین اسپرنس، نوازنده باس Papa Roach، به دلیل یک وضعیت اضطراری غیرمنتظره این آخر هفته قادر به اجرای برنامه نخواهد بود و افزود که سلامتی او نگرانی فوری آنها بوده و از طرفداران خواسته است به حریم خصوصی او احترام بگذارند. \"بنابراین، ما نمی‌توانیم در جشنواره Louder Than Life امسال اجرا کنیم و برای همه بهترین‌ها را آرزو می‌کنیم. در حال حاضر، سلامتی توبین نگرانی فوری ما است. ما مشتاقانه منتظر بازگشت او به صحنه در ماه نوامبر هستیم و از حمایت مستمر و احترام به حریم خصوصی او در این مدت قدردانی می کنیم.\" هیچ جزئیاتی از آنچه اتفاق افتاده است فاش نشده است. این پست را در اینستاگرام مشاهده کنید لغو به قیمت تاریخ بسته شدن برنامه‌ریزی شده‌ای برای گروه در ایالات متحده تمام می‌شود - محل برگزاری 19 سپتامبر Louder Than Life آخرین نمایش آمریکایی آنها قبل از عبور از اقیانوس اطلس است. این جشنواره به خودی خود موضوع کوچکی نیست: بیش از 200 اثر در این رویداد چهار روزه در حال پخش هستند، از جمله My Chemical Romance، Iron Maiden، Tool و Limp Bizkit. اسپرنس از زمان تشکیل گروه در سال 1993، بخشی از بخش ریتم پاپا روچ بوده است، و در هر آلبوم استودیویی می نوازد و در کنار جکوبی شادیکس، خواننده اصلی آن، بسیاری از کاتالوگ های آن را می نویسد. این اجرا چهار پخش اصلی راک بیلبورد را تولید کرد. 1s - Kill"}, {"source": "Billboard", "title": "A Timeline of the Ed Sheeran & Macklemore ‘Free Palestine’ Tour Controversy", "link": "https://www.billboard.com/lists/ed-sheeran-tour-drops-macklemore-timeline-controversy/", "summary": "Macklemore has been one of music s most vocal stars when it comes to supporting Palestinians amid the conflict in Gaza over the past three years, but his stance on the issue ended up sparking a major controversy surrounding the U.S. leg of Ed Sheeran s Loop Tour. Leading up to the debacle, the two musicians had been friends for more than a decade. The pair and Ryan Lewis released a song together in 2015 called Growing Up, and the year prior, Macklemore and the British pop A-lister had taken the stage together at the iHeartRadio Music Festival to perform the rapper s hit Same Love. Related Ed Sheeran Has No Tour Openers Left After Finneas Lukas Graham Drop Out Over Macklemore Free Palestine Controversy That s partially why it reverberated so intensely when Macklemore was bluntly dropped from his opening stint on Sheeran s trek, a decision that came after the former called for a free Palestine and performed Hind s Hall, a politically charged track in which Macklemore makes clear his stance that Israel has been committing genocide against Palestinians ever since the deadly Hamas terrorist attacks of 2023. (At the time of the performance, the Palestinian death count as a result of the violence had surpassed more than 73,000, according to Gaza’s Health Ministry. The United Nations has declared Israel s actions as genocidal, but the country and its allies, including the United States, deny this.) As both Macklemore and Sheeran have shared their sides of the story, more and more notable voices have also spoken out, including Gillette Stadium owner Robert Kraft and other Loop Tour opening acts such as Finneas and Lukas Graham. Below, find a timeline of everything that s unfolded since Macklemore declared his support of Palestinians while opening for Sheeran and check back for updates as new developments occur.", "date_str": "2026-09-20T02:42:45+00:00", "hash": "c85d2bf30066d54e", "title_fa": "جدول زمانی جنجال تور «فلسطین آزاد» اد شیران و مککلمور", "summary_fa": "مککلمور یکی از پر سر و صداترین ستارگان موسیقی در مورد حمایت از فلسطینی ها در بحبوحه درگیری ها در غزه در سه سال گذشته بوده است، اما موضع او در مورد این موضوع در نهایت باعث ایجاد یک جنجال بزرگ در مورد قسمت ایالات متحده از تور حلقه اد شیران شد. این دو نوازنده قبل از شکست، بیش از یک دهه با هم دوست بودند. این زوج و رایان لوئیس در سال 2015 آهنگی به نام Growing Up را با هم منتشر کردند و سال قبل، مککلمور و A-lister پاپ بریتانیایی با هم در جشنواره موسیقی iHeartRadio روی صحنه رفته بودند تا آهنگ رپر Same Love را اجرا کنند. مرتبط با اد شیران پس از ترک تور فینیاس لوکاس گراهام به دلیل جنجال‌های فلسطین آزاد مککلمور، هیچ تور افتتاحیه‌ای باقی نمانده است. موضع خود را مبنی بر اینکه اسرائیل از زمان حملات مرگبار تروریستی حماس در سال 2023 مرتکب نسل کشی علیه فلسطینی ها شده است، روشن می کند. (به گفته وزارت بهداشت غزه، در زمان اجرای این نمایش، شمار تلفات فلسطینی‌ها در نتیجه خشونت‌ها از بیش از 73000 نفر گذشت. سازمان ملل متحد اقدامات اسرائیل را نسل‌کشی اعلام کرده است، اما این کشور و متحدانش، از جمله ایالات متحده، این موضوع را رد می‌کنند.) همانطور که مککلمور و شیران هر دو طرف ماجرا را به اشتراک گذاشته‌اند، صداهای برجسته‌تری نیز از جمله مالک استادیوم ژیلت، رابرت کرافت و دیگر بازیگران افتتاحیه تور لوپ مانند فینیاس و لوکاس، مطرح شده‌اند."}, {"source": "Billboard", "title": "Ed Sheeran Says Situation in Gaza Is ‘Catastrophic and Unjustifiable’ at Philadelphia Tour Stop", "link": "https://www.billboard.com/music/music-news/ed-sheeran-gaza-speech-philadelphia-concert-tour-1236344137/", "summary": "Ed Sheeran opened a solo concert Saturday (Sept. 19) with comments about Gaza after controversy swirled around his tour as supporting acts withdrew in solidarity with opener Macklemore , who was dropped after making pro-Palestinian comments onstage. Related A Timeline of the Ed Sheeran Macklemore Free Palestine Tour Controversy How Has Ed Sheeran Tour Chaos Affected Streaming Numbers for Macklemore, Other Openers Ed Himself? Ed Sheeran Addresses Controversy at First Show Since Openers, Backing Band Dropped Off Tour, Calls It The Best Show of My Life Sheeran said he wants his music and shows to be about unity and humanity, not politics. He also addressed the question of where I stand in the situation in Israel and Palestine.” “What happened in Israel and at the Nova Music Festival on October 7th was horrific and compounded centuries of Jewish pain. What is happening in Gaza is catastrophic and unjustifiable, and disproportionate. My heart has been broken by the scale of devastation and loss of civilians’ lives, of children’s lives, and the systemic injustice we’re seeing unfold in the West Bank cannot be overlooked, Sheeran said from the stage at Lincoln Financial Field. “I am already speaking to people across the spectrum to work out how to make a contribution that helps victims of these terrible times, and listening and learning because I do not know enough, he added. Sheeran has performed much of his Loop Tour concerts solo, but he had been joined for several songs at each stop by the Irish folk band Beoga. Macklemore, Sheeran’s original U.S. opener, had been replaced by Danish band Lukas Graham and Irish singer Aaron Rowe before they backed out. Finneas, Billie Eilish’s brother and musical collaborator, was due to tour with Sheeran in South America later this year before he too dropped out earlier this week. Before the show, a small group of pro-Palestinian demonstrators congregated outside the stadium. Hillary Steinberg, 34, of Philadelphia, said she got tickets a year ago but wound up getting a refund and attended the demonstration instead, disappointed that Sheeran did not take a stand. “I was, until this week, a big Ed Sheeran fan,” Steinberg said. “I think all art is political, and all music is political, and so this choice — even though he was saying that he wasn’t complicit — is a political choice.” The show came after a tumultuous week that opened with Macklemore being dropped in response to exclaiming “Free Palestine” during a Sept. 5 show in N", "date_str": "2026-09-20T02:15:12+00:00", "hash": "d5579692918ed36d", "title_fa": "اد شیران می گوید وضعیت غزه در ایستگاه تور فیلادلفیا \"فاجعه بار و غیرقابل توجیه\" است", "summary_fa": "اد شیران شنبه (19 سپتامبر) یک کنسرت انفرادی را با نظراتی در مورد غزه افتتاح کرد، پس از آن که جنجال‌هایی در اطراف تور او به وجود آمد، در حالی که کنسرت‌های حمایتی در همبستگی با مکلمور بازکن، که پس از اظهارنظرهای طرفدار فلسطینی‌ها روی صحنه کنار گذاشته شد، کنار رفت. جدول زمانی مربوط به جنجال تور فلسطین رایگان اد شیران مکلمور چگونه آشوب تور اد شیران بر تعداد پخش جریانی مککلمور، خود بازکننده‌های دیگر اثر گذاشته است؟ اد شیران در اولین نمایش از زمان افتتاحیه به بحث و جدل پرداخت، گروه پشتیبان از تور خارج شد، آن را بهترین نمایش زندگی من می خواند شیران گفت که می خواهد موسیقی و نمایش هایش در مورد وحدت و انسانیت باشد، نه سیاست. وی همچنین به این سوال پرداخت که من در وضعیت اسرائیل و فلسطین در کجا قرار دارم. «آنچه در اسرائیل و در فستیوال موسیقی نوا در 7 اکتبر اتفاق افتاد، وحشتناک بود و قرن ها درد یهودی را ترکیب کرد. آنچه در غزه اتفاق می افتد فاجعه بار و غیرقابل توجیه و نامتناسب است. شیران از روی صحنه در فیلد مالی لینکلن گفت که قلب من از مقیاس ویرانی و تلفات جان غیرنظامیان و زندگی کودکان شکسته است و نمی توان بی عدالتی سیستماتیکی را که در کرانه باختری می بینیم نادیده گرفت. او افزود: \"من قبلاً با مردم در سراسر طیف صحبت می کنم تا چگونگی کمک به قربانیان این دوران وحشتناک را بیاموزم و گوش کنم و یاد بگیرم زیرا به اندازه کافی نمی دانم. شیران بسیاری از کنسرت های خود در تور Loop Tour را به صورت انفرادی اجرا کرده است، اما چندین آهنگ در هر ایستگاه توسط گروه موسیقی ایرلندی Beoga به او ملحق شده بود. لوکاس گراهام و آرون رو، خواننده ایرلندی، قبل از اینکه کنار بکشند. فینیاس، برادر و همکار موسیقی بیلی"}, {"source": "Billboard", "title": "Nailah Blackman Talks Co-Hosting with Majah Hype & Gives Update on ‘Born a Diamond’ | Caribbean Music Awards 2026", "link": "https://www.billboard.com/video/nailah-blackman-talks-co-hosting-with-majah-hype/", "summary": "Nailah Blackman caught up with Billboard’s Kyle Denis on the red carpet at the Caribbean Music Awards 2026.", "date_str": "2026-09-20T00:15:22+00:00", "hash": "2b801451500cb9c5", "title_fa": "نایلا بلکمن میزبانی مشترک با ماجاه هیپ و به‌روزرسانی «Born a Diamond» را ارائه می‌کند | جوایز موسیقی کارائیب 2026", "summary_fa": "نایلا بلکمن با کایل دنیس از بیلبورد روی فرش قرمز جوایز موسیقی کارائیب 2026 روبرو شد. Nailah Blackman Talks میزبانی مشترک با Majah Hype به‌روزرسانی «Born a Diamond» را ارائه می‌کند | جوایز موسیقی کارائیب 2026 اشتراک‌گذاری در فیس‌بوک اشتراک‌گذاری در X اشتراک‌گذاری ترجیحی Google در Flipboard + گزینه‌های اشتراک‌گذاری اضافی اضافه شد اشتراک‌گذاری در Pinterest اشتراک‌گذاری در Tumblr اشتراک‌گذاری در Reddit اشتراک‌گذاری در LinkedIn اشتراک‌گذاری در Whats App ارسال ایمیل چاپ این مقاله ارسال نظر ارسال نظر نایلا بلکمن با کایل دنیس بیلبورد روی فرش قرمز جوایز موسیقی Caribbean202. یک گزارش روزانه در مورد آنچه در صنعت موسیقی مهم است"}, {"source": "Billboard", "title": "Kes Talks S kedIn اشتراک‌گذاری در Whats App ارسال ایمیل چاپ این مقاله ارسال یک نظر."}, {"source": "Billboard", "title": "Céline Dion Hops Atop a Car to Sing With Crowd of Fans in Paris", "link": "https://www.billboard.com/music/music-news/celine-dion-sings-pour-que-tu-maimes-encore-fans-paris-1236344081/", "summary": "Céline Dion , barefoot and beaming, joined a fan sing-along of “Pour Que Tu M’aimes Encore” on the streets of Paris on Friday (Sept. 18). Related Céline Dion s Paris 2026 Setlist: Every Song Played at the First Show Ed Sheeran Addresses Controversy at First Show Since Openers, Backing Band Dropped Off Tour, Calls It The Best Show of My Life Papa Roach s Louder Than Life Set Scrapped Amid Bassist s Unexpected Emergency Fan-filmed footage on social media shows the pop icon climbing onto the hood of a car , taking in the crowd that gathered outside her hotel after the third show of the singer s 26-night concert residency at Plenitude Arena in Nanterre. Video captured Dion conducting the crowd . She waved her arms, rolled around dramatically, clapped to the beat, got up on her feet and gave heart hands while everyone sang the French-language track from her 1995 album D eux that translates to so that you ll love me again. Dion appeared to be surrounded by security, with onlookers close to her yet respectful of her space. Post-show, she was dressed in comfortable attire: loose trousers, a plain top and a bomber jacket. All the world s a stage as Dion makes her comeback. After stepping back for several years due to her health with a diagnosis of stiff-person syndrome the star made an emotional return to the spotlight a week ago, launching her Paris residency on Sept. 12. She cried tears of joy that night . “Ça y est, on est là. C’était une promesse. Je suis debout sur scène, dans cette ville que j’aime tant,” a teary-eyed Dion said on the arena stage opening night. “Vous entendez les battements de mon cœur?” (“That’s it, we’re here. It was a promise. I’m standing on stage, in this city I love so much,” she said. “Can you hear my heartbeat?”). Even more triumphant by night two, on Sept. 16, Dion held back the tears . Dion s residency continued with a performance Saturday night (Sept. 19) and will be back to the arena stage Wednesday (Sept. 23). Dates continue through mid-November, and then resume with a series of 10 shows in May.", "date_str": "2026-09-19T23:35:11+00:00", "hash": "82f38c2aa047b46e", "title_fa": "سلین دیون بر فراز ماشینی می‌رود تا با انبوهی از طرفداران در پاریس بخواند", "summary_fa": "سلین دیون، پابرهنه و پر نور، روز جمعه (18 سپتامبر) در خیابان های پاریس به هوادارانی پیوست که آهنگ «Pour Que Tu M’aimes Encore» را می خوانند. ست‌ست مربوط به پاریس 2026 از سلین دیون: هر آهنگی که در اولین نمایش پخش می‌شود، اد شیران به بحث و جدل در اولین نمایش از زمان افتتاحیه پرداخته است. روی کاپوت یک ماشین، جمعیتی را که بعد از سومین نمایش 26 شب اقامت کنسرت خواننده در Plenitude Arena در نانتر در بیرون هتل او جمع شده بودند، جذب کرد. ویدئویی که دیون را در حال هدایت جمعیت ضبط کرده است. او دستانش را تکان داد، به طور چشمگیری به اطراف چرخید، با ضربان دست زد، روی پاهایش بلند شد و دست های قلبی داد در حالی که همه آهنگ فرانسوی زبان آلبوم او در سال 1995 D eux را می خواندند که به این معنی است که دوباره مرا دوست خواهید داشت. به نظر می‌رسید که دیون توسط نیروهای امنیتی احاطه شده است، با تماشاچیان نزدیک به او اما به فضای او احترام می‌گذارند. پس از نمایش، او لباس راحتی پوشیده بود: شلوار گشاد، یک تاپ ساده و یک ژاکت بمب افکن. در حالی که دیون بازمی گردد، تمام دنیا یک صحنه است. پس از چند سال عقب نشینی به دلیل سلامتی اش با تشخیص سندرم فرد سفت، ستاره یک هفته پیش بازگشتی احساسی به کانون توجه داشت و اقامتگاه پاریس خود را در 12 سپتامبر راه اندازی کرد. او در آن شب اشک شوق گریست. دیون با چشمانی گریان در شب افتتاحیه صحنه گفت: \"Ça y est, on est là. C'était une promesse. Je suis debout sur scène, dans cette ville que j'aime tant.\" «آیا می‌خواهی از battements de mon cœur؟» (او گفت: \"همین است، ما اینجا هستیم. این یک قول بود. من روی صحنه ایستاده ام، در این شهر که"}, {"s et los te maken. Oppas from hell Not a Stranger is een Turkse psychologische dramaserie waarin de komst van een nieuwe oppas het leven van een gezin ingrijpend verandert. Het verhaal draait om Funda (in dezen geen platform waarop je op huizenjacht kunt gaan), een moeder die haar carrière als schilder opnieuw wil oppakken, maar merkt dat de hulp die ze daarvoor inschakelt onverwachte spanningen met zich meebrengt. Na de geboorte van haar dochter heeft Funda haar werk als kunstschilder tijdelijk opzijgezet. Ze wil graag weer aan de slag, maar vindt het lastig om de zorg voor haar kind uit handen te geven. Wanneer ze uiteindelijk Nazlı als oppas aanneemt, lijkt ze eindelijk de juiste balans tussen haar gezin en carrière te kunnen vinden. Not a Stranger Aanvankelijk lijkt Nazlı precies de hulp die Funda en haar man İlker nodig hebben. Ze krijgt een steeds belangrijkere plek binnen het gezin, maar haar gedrag begint langzaam de nodige vragen op te roepen. Vooral haar groeiende gehechtheid aan het kind wordt verontrustend. De trailer van de show (hieronder te zien) suggereert zelfs dat Nazlı niet alleen voor het meisje wil zorgen, maar mogelijk zelf de rol van moeder wil overnemen. Terwijl Funda en İlker proberen te achterhalen wie hun oppas werkelijk is en wat ze verborgen houdt, komen ook hun onderlinge vertrouwen en relatie onder druk te staan. Wat begint als een gewone afspraak over kinderopvang, ontwikkelt zich tot een heus psychologisch spel. Bekijk hieronder de trailer, de gehele serie staat nu op Netflix. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Nieuwe dramaserie weet te verrassen op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-09-20T10:25:58+00:00", "hash": "1ddc7761d79dcc03", "title_fa": "سریال های درام جدید سورپرایز در نتفلیکس", "summary_fa": "یک سریال غافلگیر کننده موفق می شود در صدر لیست نتفلیکس قرار بگیرد. رقابت در حال حاضر با De Eetclub، Fauda، Monster 4  تبدیل حفار را از شش ساعت به زیر یک کسب‌وکار کاهش داده است. پارامونت و کالیفرنیا AG بنا به گزارش‌ها نزدیک شدن به حل و فصل رافالو شامل پیوندی برای امضای طوماری در حمایت از مسدود شدن ادغام است. لطفاً برای ارسال پیام به AG و Paramount امضا کنید. معامله را رد کنید. مردم آن را نمی خواهند! او افزود. ستاره Task در مورد مخالفت خود با ادغام بسیار صریح بوده است. او در جلسه استماع سنا علیه این ادغام شهادت داد و نامه ای سرگشاده را در کنار بسیاری از بازیگران امضا کرد که همچنین علیه شرکت پارامونت بالقوه بروس وارنر. در یک پست اینستاگرامی در ماه اوت، او به پیوندهای اوراکل (که توسط لری الیسون، پدر دیوید الیسون تأسیس شد) با ارتش اسرائیل اشاره کرد و کلیپی از رئیس سابق اوراکل، صفرا کاتز، در مورد فناوری اوراکل در اجلاس ملی شورای اسرائیلی-آمریکایی در سال 2024"}, {"source": "Hollywood Reporter", "title": "Ruby Rose Remembers Hayden Panettiere: “We Had Everything in Common”", "link": "https://www.hollywoodreporter.com/tv/tv-news/ruby-rose-mourns-hayden-panettiere-tribute-1236706180/", "summary": "\"All that she ever wanted was to have her story told her way, on her terms,\" the 'Orange Is the New Black' star said of the 'Heroes' actress.", "date_str": "2026-09-20T02:02:05+00:00", "hash": "58233a0884558699", "title_fa": "روبی رز هیدن پانتی یر را به یاد می آورد: \"ما همه چیز مشترک داشتیم\"", "summary_fa": "ستاره «نارنجی سیاه جدید است» در مورد بازیگر «قهرمانان» گفت: «تمام چیزی که او همیشه می‌خواست این بود که داستانش طبق شرایط خودش تعریف شود. روبی رز در مورد دوستی خود با هایدن پانتییر صحبت می کند. پانتییر، بازیگر قهرمانان و نشویل، در 16 اوت در 36 سالگی درگذشت. ستاره The Orange Is the New Black وقتی Entertainment Tonight از او پرسید که چگونه امیدوار است که Panettiere در اولین نمایش نیروهای ویژه Fox به یاد بیاورد، خفه شد. او در مورد پانتییر گفت که بهترین دوست من بود. ما پنج سال هر روز صحبت می کردیم. رز گفت او حتی فکر نمی کرد ما با هم دوست باشیم. نمی‌دانستم می‌خواهم دوستان مشهوری داشته باشم، زیرا تجربه خوبی در این صنعت نداشته‌ام. با این حال، آنها به سرعت به آن ضربه زدند. داستان‌های مرتبط فیلم‌ها، روبی رز، نوئل کلارک را به شکارگری متهم می‌کند، پس از سیلی زدن به دکتری که بازیگری با U.K. اخبار اتهامات جنایی نماینده هیدن پانتییر کسانی را که در میان تحقیقات مرگ به شایعات و حدس و گمان دامن می زدند را محکوم می کند. و سپس او به هر حال دوید و گفت، هی، من هیدن هستم. میشه بریم یه جایی حرف بزنیم؟ ما اشتراکات زیادی داریم و من فقط خندیدم داشتم میگفتم چی؟ رز به یاد آورد. او می گوید من گفتم، فکر نمی کنم، اما فکر می کنم فقط خندیدم. و بعد رفتیم و صحبت کردیم و همه چیز مشترک بود. رز گفت که آنها پنج سال دوستی مشترک داشتند، هر روز پیامک می‌فرستادند و به یکدیگر رسیدگی می‌کردند. رز افزود، هیدن، تنها چیزی که همیشه می‌خواست این بود که داستانش را طبق شرایط خودش تعریف کند، در حالی که برای مصاحبه در کنار کالین گوسلین، پسر جان کیت پلاس 8 جان و کیت گوسلین ایستاده بود."}, {"source": "Hollywood Reporter", "title": "Ed Sheeran Addresses Macklemore Backlash During Philadelphia Tour Stop: “This Wasn’t The Easy Option”", "link": "https://www.hollywoodreporter.com/music/music-news/ed-sheeran-macklemore-controversy-palestine-protests-concert-1236706177/", "summary": "\"What happened in Israel and at the Nova Music Festival on October 7th was horrific and compounded centuries of Jewish pain. What is happening in Gaza is catastrophic and unjustifiable, and disproportionate,\" Sheeran said during the first concert he played following Macklemore’s removal as an opener for pro-Palestinian comments.", "date_str": "2026-09-20T00:57:25+00:00", "hash": "41f57fcac609ae80", "title_fa": "اد شیران در طول توقف تور فیلادلفیا به مخالفت مکلمور پرداخت: \"این گزینه آسان نبود\"", "summary_fa": "شیران در اولین کنسرتی که پس از برکناری مکلمور اجرا کرد، گفت: \"آنچه در اسرائیل و در فستیوال موسیقی نوا در 7 اکتبر اتفاق افتاد، وحشتناک بود و قرن ها درد یهودی را ترکیب کرد. آنچه در غزه اتفاق می افتد فاجعه آمیز، غیرقابل توجیه و نامتناسب است.\" اد شیران در جریان توقف شنبه در فیلادلفیا در استادیوم مالی لینکلن به بحث های جاری پیرامون حذف مکلمور از تور حلقه خود پرداخت. من معمولاً نمایش را اینگونه باز نمی‌کنم، اما قبل از اینکه امشب         return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
