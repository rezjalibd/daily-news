دلار صرفه جویی 150.00 دلار دریافت معامله دریافت معامله 647.99 دلار در آمازون 797.99 دلار صرفه جویی 150 دلاری این نسخه 2026 سامسونگ یک تلویزیون سطح ابتدایی 4K است که دارای تلویزیون هوشمند Mini LED Tizen است. از HDR10+ و Auto HDR Remastering پشتیبانی می‌کند که هدف آن ارتقای محتوای قدیمی‌تر است، در حالی که رنگ‌های خالص رنگ‌ها را طبیعی نگه می‌دارد. این پردازنده بر روی یک پردازنده NQ4 AI Gen2 اجرا می‌شود که ارتقاء مقیاس را انجام می‌دهد، بنابراین محتوای با وضوح پایین‌تر در پنل 4K تمیزتر به نظر می‌رسد. دارای نرخ تازه سازی 144 هرتز و هاب گیمینگ سامسونگ است که انتخاب خوبی برای گیمرها است. تلویزیون از HDMI 2.1 و نرخ نوسازی متغیر از جمله AMD FreeSync Premium پشتیبانی می کند. با این حال، صحنه‌های با حرکت سریع ممکن است کمی تاری نشان دهند، بنابراین اگرچه عملکرد بهتری نسبت به یک تلویزیون استاندارد 60 هرتزی دارد، اما ممکن است اولین انتخاب برای کسانی نباشد که عمدتاً تلویزیون بازی می‌خرند. M80H دارای پشتیبانی داخلی الکسا و ایرپلی به همراه کاتالوگ گسترده معمول برنامه های پخش جریانی تایزن است. علیرغم اینکه یک تلویزیون استارت ثابت"}, {"source": "Lifehacker", "title": "The Best Gifts to Give an E-Book Reader", "link": "https://lifehacker.com/tech/the-best-gifts-to-give-e-book-reader-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Unless you're shopping from a wishlist, buying a book for a big reader is always a fraught prospect. Have they read it? Will they like it? Will they be offended at the mere suggestion that you think it's the kind of book they might like? Will you be crushed when you give them a copy of your favorite book and they never get around to reading it? Buying a gift for someone who prefers to read e-books whether on a Kindle or one of the many excellent non-Kindle alternatives can be much less emotionally charged: Instead of risking everything by giving them a book, just get them a cute e-reader accessory (if not a new e-reader) that they will thank you for every time they dive into a good read. A truly pocketable travel e-reader: The Xteink X4 Pro Credit: Joel Cunningham Chances are good your giftee already owns a Kindle, but there's room for another e-reader in their life especially when it's as small as the Xteink X4 Pro ($99). TikTok and Reddit are obsessed with this tiny, quirky device from a Chinese tech startup that has taken the e-reading world by storm over the past year, and it's not hard to see why: For under $100, you can get a palm-sized, single-purpose e-ink device that will disappear into any pocket, so you can truly take your books with you wherever you go. (Promotional images even show it magnetically attached to the back of a smartphone.) While the first Xteink device could be clunky and cumbersome to use , the new X4 Pro has improved software and quality-of-life updates like a faster processor, more RAM, a touchscreen, and a front light. It isn't the ideal primary device for every reader, but as an ultra-portable alternative for reading on the go, it's hard to beat though competitors have popped up to give it a go . Learn more about the device (and its potential drawbacks) in my full Xteink X4 Pro review . Xteink X4 Pro 4.3-Inch E-Reader $99.00 at Amazon $109.00 Save $10.00 Shop Now Shop Now $99.00 at Amazon $109.00 Save $10.00 An e-reader that can curb any smartphone addiction: The Boox Palma 2 Pro If you've got more to spend and want to give a potentially transformative gift, consider the Boox Palma 2 Pro ($399.99), part of the family of phone-shaped devices that kicked off the small e-reader craze (and helped me kick my own doomscrolling habit). It has a 6.13-inch color e-ink screen and runs on an open Android operating system, which means it can connect to the Google Play Store and run any re", "date_str": "2026-09-18T19:00:00+00:00", "hash": "a3f317011db56be5", "title_fa": "بهترین هدایا برای دادن کتابخوان الکترونیکی", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. مگر اینکه از لیست علاقه مندی ها خرید کنید، خرید یک کتاب برای یک خواننده بزرگ همیشه یک چشم انداز دشوار است. آیا آن را خوانده اند؟ آیا آنها آن را دوست خواهند داشت؟ آیا آنها صرفاً به این پیشنهاد که شما فکر می کنید این کتابی است که آنها ممکن است دوست داشته باشند، آزرده خواهند شد؟ آیا وقتی یک نسخه از کتاب مورد علاقه خود را به آنها بدهید و آنها هرگز نتوانند آن را بخوانند، له خواهید شد؟ خرید یک هدیه برای کسی که ترجیح می‌دهد کتاب‌های الکترونیکی را با کیندل یا یکی از بسیاری از گزینه‌های غیرکیندل عالی بخواند، می‌تواند از نظر احساسی بسیار کم‌تر باشد: به جای اینکه همه چیز را با دادن کتاب به او به خطر بیندازید، فقط یک لوازم جانبی کتاب‌خوان الکترونیکی زیبا (اگر نه یک کتاب‌خوان الکترونیکی جدید) برای او تهیه کنید که برای هر باری که در یک کتاب خوب غوطه‌ور می‌شوند از شما تشکر کنند. کتاب خوان الکترونیکی سفری واقعاً جیبی: Xteink X4 Pro اعتبار: جوئل کانینگهام احتمال اینکه هدیه‌دهنده شما قبلاً Kindle داشته باشد، خوب است، اما جایی برای یک کتاب‌خوان الکترونیکی دیگر در زندگی او وجود دارد، مخصوصاً وقتی به کوچکی Xteink X4 Pro (۹۹ دلار) باشد. TikTok و Reddit به این دستگاه کوچک و عجیب و غریب از یک استارت‌آپ فناوری چینی که طوفانی در دنیای کتابخوانی الکترونیکی در سال گذشته به‌وجود آورده، وسواس دارند، و فهمیدن دلیل آن سخت نیست: با کمتر از 100 دلار، می‌توانید یک دستگاه جوهر الکترونیکی تک‌منظوره به اندازه کف دست تهیه کنید که در هر جایی که کتابتان را می‌برید ناپدید می‌شود. (تصاویر تبلیغاتی حتی نشان می‌دهند که به صورت مغناطیسی به پشت تلفن هوشمند متصل شده است.) در حالی که استفاده از اولین دستگاه Xteink ممکن است سخت"}, {"source": "Lifehacker", "title": "Do the Apple Watch Series 12's New Health Features Live Up to the Hype?", "link": "https://lifehacker.com/health/apple-watch-series-12-new-health-features?utm_medium=RSS", "summary": "We may earn a commission from links on this page. I now have the Apple Watch Series 12 in my hands or, rather, on my wrist and have spent the past 24 hours putting it through as many tests as I can manage. I'm pleased with the step counting and the availability of \"recovery HRV\" (as opposed to the cardiac-health-focused HRV that the Apple Watch previously used) but I'm not sure if the heart rate accuracy is living up to the hype. I'll be putting this device to more rigorous tests, but here are my first thoughts. Apple Watch Series 12 $389.99 at Amazon Learn More Learn More $389.99 at Amazon Apple redesigned the heart rate sensor on the back of the watch. Left: Apple Watch Series 11. Right: Apple Watch Series 12 Credit: Beth Skwarecki Step counting is everything I hoped it would be Apple waited forever to add step counting as an easily viewable metric on the watch, but it s finally here. I can open my smart stack (with a double pinch of my fingers, not even touching the watch screen) and see my steps right on top. I ve also added a step count complication to my watch face. You can find this complication under Activity . The option to see your rings as a complication is still there, but you can now also add steps or wheelchair pushes. Step counts work well. They update quickly, and seem to be accurate in my casual counting nine steps from my desk to the door registers as nine steps. I ll do more in-depth testing soon, to properly evaluate Apple s claim that it now has the most accurate step counting out there. What s disappointing is that it took so long and that step counting is not coming to the Series 11 or any earlier watch. Apple s step counting uses a special pedometer model that s built into its new processor. Older Apple watches don t have the hardware to calculate your steps as precisely, leading Apple to leave the feature off those watches. That is wild to me, considering that every other wearable has had step counts on the watch ever since the first cave dweller strapped a rock to their wrist. I m not sure I buy these most accurate heart rate claims Apple claims the Series 12 has the most accurate heart rate in a wearable, and I ve already mentioned that that's a bold claim given what I ve seen in the past from Apple and from other devices. Now that I have a Series 12 in my hands, I was able to do some preliminary testing. To be totally clear, these are not thorough tests, and I m not making a decisive conclusion based on just a few days testing. ", "date_str": "2026-09-18T18:30:00+00:00", "hash": "b7e1f2cc6db6ca76", "title_fa": "آیا ویژگی‌های سلامتی جدید اپل واچ سری 12 با هیاهوها سازگار است؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. من اکنون اپل واچ سری 12 را در دستانم یا بهتر است بگوییم روی مچ دستم دارم و 24 ساعت گذشته را صرف انجام تست های زیادی کرده ام که بتوانم آن را انجام دهم. من از شمارش گام‌ها و در دسترس بودن \"HRV بازیابی\" (برخلاف HRV متمرکز بر سلامت قلب که قبلاً اپل واچ استفاده می‌کرد) راضی هستم، اما مطمئن نیستم که آیا دقت ضربان قلب مطابق با تبلیغات بالا باشد یا خیر. من این دستگاه را در آزمایش های دقیق تری قرار خواهم داد، اما این اولین افکار من است. اپل واچ سری 12 389.99 دلار در آمازون بیشتر بدانید 389.99 دلار در آمازون اپل حسگر ضربان قلب در پشت ساعت را دوباره طراحی کرد. چپ: اپل واچ سری 11. راست: اپل واچ سری 12 اعتبار: Beth Skwarecki گام شماری همه چیزهایی است که من امیدوار بودم اپل برای همیشه منتظر باشد تا شمارش گام ها را به عنوان معیاری به راحتی قابل مشاهده در ساعت اضافه کند، اما بالاخره اینجا رسید. من می‌توانم پشته هوشمندم را باز کنم (با دوبار فشار دادن انگشتانم، حتی بدون لمس صفحه ساعت) و گام‌هایم را درست در بالا ببینم. من همچنین یک پیچ شمارش گام به صفحه ساعت خود اضافه کرده ام. می توانید این عارضه را در قسمت Activity پیدا کنید. گزینه دیدن حلقه های خود به عنوان یک عارضه هنوز وجود دارد، اما اکنون می توانید پله ها یا حرکت های ویلچر را نیز اضافه کنید. تعداد قدم ها به خوبی کار می کند. آنها به سرعت به روز می شوند، و به نظر می رسد که در شمارش گاه به گاه من نه قدم از میز تا ثبت درب به عنوان نه پله دقیق هستند. من به زودی آزمایشات عمیق تری را انجام خواهم داد تا ادعای"}, {"source": "Lifehacker", "title": "The Best Home Entertainment Gifts for Every Type of Person", "link": "https://lifehacker.com/tech/best-home-entertainment-gifts?utm_medium=RSS", "summary": "We may earn a commission from links on this page. If you're planning on giving home entertainment gear as a gift this holiday, forget about traditional benchmarks like \"biggest screen\" or \"most expensive speakers.\" Match the gear with the personality and needs of the person being entertained by that home entertainment system instead. Below are my best picks for everyone from college kids squeezed in a dorm room to legacy media snobs for whom streaming video isn't an option. Best overall home entertainment gift of 2026: Philips Hue Play HDMI Sync Box 8K You probably won't buy someone a new TV for the holidays, but you can give the media-hound on your list a gadget to make the TV they already own even better. Enhancing watching and gaming is the mission of the Philips Hue Play Sync Box . It s a middleman between TVs and HDMI gear like consoles or streaming boxes that analyzes video signals in real time and tells the connected smart light strip (as well as other compatible smart lights) to match what's on screen. This is great for gaming immersion, but it also improves just watching TV. Projecting colors behind the set that complement the visuals gives the illusion of a bigger screen, and it's just cool. Philips Hue Play HDMI Sync Box 8K + Gradient 65\" Smart TV Light Strip - Sync Your Video Games, Movies, and Music - Requires Hue Bridge - Supports Dolby Vision HDR10+ - Control with Hue App $459.99 at Amazon $544.99 Save $85.00 Get Deal Get Deal $459.99 at Amazon $544.99 Save $85.00 Best home entertainment gift for the legacy media snob: Magnetar UDP800 MKII The Magnetar UDP800 isn't for casual media consumers, but if you're giving a present to the type of person who sneers at streaming and demands picture and sound at the highest possible quality, consider a Magnetar. This thing is monster. Magnetar laughs at the compression of Netflix by reading 4K video at bitrates up to 100 Mbp. It humiliates Spotify with lossless audio in formats like Dolby TrueHD and DTS-HD Master Audio. It's also a true universal player, handling everything from 4K UHD Blu-rays and standard DVDs to Kodak Picture CDs. Like the best niche gear, it's expensive, but I'm sure your purist is worth the cost. Best home entertainment gift for the minimalist: Anker Nebula Cosmos 4K Most take it as a given that a huge, semi-matte black rectangle will dominate every living room like the monolith from 2001 , but some people don't buy into it. If there's someone like that on your list, the Anker Nebu", "date_str": "2026-09-18T18:00:32+00:00", "hash": "5e00f7543ca83a28", "title_fa": "بهترین هدایای سرگرمی خانگی برای هر نوع شخصی", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اگر در این تعطیلات قصد دارید وسایل سرگرمی خانگی را هدیه دهید، معیارهای سنتی مانند \"بزرگترین صفحه\" یا \"گران ترین بلندگوها\" را فراموش کنید. به جای آن، وسایل را با شخصیت و نیازهای فردی که توسط آن سیستم سرگرمی خانگی سرگرم می شود، مطابقت دهید. در زیر بهترین انتخاب‌های من برای همه، از بچه‌های دانشگاهی که در یک اتاق خوابگاه فشرده شده‌اند تا افراد اصیل رسانه‌ای که پخش ویدیو برایشان گزینه‌ای نیست، در زیر آمده است. بهترین هدیه کلی سرگرمی خانگی در سال 2026: Philips Hue Play HDMI Sync Box 8K احتمالاً برای تعطیلات برای کسی تلویزیون جدیدی نمی‌خرید، اما می‌توانید ابزاری را به سگ رسانه‌ای موجود در فهرست خود بدهید تا تلویزیونی را که قبلاً در اختیار دارد بهتر کنید. تقویت تماشا و بازی، ماموریت Philips Hue Play Sync Box است. این یک واسطه بین تلویزیون‌ها و تجهیزات HDMI مانند کنسول‌ها یا جعبه‌های جریان است که سیگنال‌های ویدیویی را در زمان واقعی تجزیه و تحلیل می‌کند و به نوار نور هوشمند متصل (و همچنین سایر چراغ‌های هوشمند سازگار) می‌گوید با آنچه روی صفحه است مطابقت داشته باشد. این برای غوطه وری در بازی عالی است، اما فقط تماشای تلویزیون را نیز بهبود می بخشد. نمایش رنگ‌ها در پشت مجموعه که تکمیل کننده جلوه‌های بصری هستند، توهم یک صفحه نمایش بزرگ‌تر را به وجود می‌آورند، و فقط جالب است. Philips Hue Play HDMI Sync Box 8K + Gradient 65 اینچ نوار نور تلویزیون هوشمند - بازی‌های ویدیویی، فیلم‌ها و موسیقی خود را همگام‌سازی کنید - به Hue Bridge نیاز دارد - از Dolby Vision HDR10+ پشتیبانی می‌کند - کنترل با برنامه Hue 459.99 دلار در آمازون. 544.99 دلار آمازون. 85.00 دلار بهترین هدیه سرگرمی خانگی برای رسانه‌های قدیمی: Magnetar UDP800 MKII Magnetar UDP800 برای مصرف‌کنندگان معمولی رسانه‌ها نیست، اما"}, {"source": "Lifehacker", "title": "If You Loved 'Outlander,' There's One Movie You Need to Watch Next", "link": "https://lifehacker.com/entertainment/one-movie-like-outlander?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Outlander filled a void no one suspected existed (probably). Based on the bestselling book series by Diana Gabaldon, this epic love story about a time-traveling woman who plunges into the messiest extramarital affair ever known was one of the most popular shows on TV screens, and inspired some intense fandom. If you were one of the show s superfans and you re not quite sure how to fill your time now that Claire and Jamie s story is done, there s some good news: The best movie for Outlander fans to watch was released decades ago, in 1980. Somewhere in Time is the best movie for fans of Outlander Based on the 1975 novel Bid Time Return by Richard Matheson, Somewhere in Time is one of those movies that people still talk about almost fifty years after its release and it s a spookily perfect companion to Outlander . Christopher Reeve, fresh off his star turn in Superman , plays playwright Richard Collier. While on a road trip, he stops at the Grand Hotel and sees a photo of Elise McKenna (Jane Seymour), who was a famous actress in the early 20 th century. He realizes that an elderly Elise had given him an antique pocket watch years earlier, and comes to believe that time travel is possible and begins planning for a trip back to 1912 succeeding after several tries. In the past, he meets Elise, and they fall madly in love but her manager sees Richard as a threat to her career, and does everything he can to thwart them. It s a story that parallels Outlander s in many ways, especially when Claire decides to return to the 18 th century to seek Jamie after she learns that he s still alive. Richard s determination to stay with Elise no matter what ends up in tragedy (something else fans of Outlander are familiar with), but the story asks a simple question: Isn t suffering worth it if it leads you to true love? Somewhere in Time doesn t get to dig as deeply into Richard and Elise s love story as Outlander does with Jamie and Claire, of course the series was able to linger on their story over more than 100 episodes. But the film captures the same powerful moment of connection as two people overcome the most fundamental obstacle in the universe time in order to be together. Fans of the show will love it. Stream Somewhere in Time on The Roku Channel , Tubi , or Plex , or rent it on Prime Video . Somewhere in Time (1980) $3.99 at Prime Video Learn More Learn More $3.99 at Prime Video More movies for fans of Outlander Iif yo", "date_str": "2026-09-18T17:30:00+00:00", "hash": "6098a72a0a868d1e", "title_fa": "اگر عاشق «Outlander» بودید، یک فیلم وجود دارد که باید در ادامه ببینید", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اوتلندر خلایی را پر کرد که هیچ کس به وجود آن مشکوک نبود (احتمالا). این داستان عاشقانه حماسی که بر اساس مجموعه کتاب های پرفروش دیانا گابالدون ساخته شده است، درباره زنی در سفر در زمان است که در آشفته ترین رابطه خارج از ازدواجی که تا به حال شناخته شده است فرو می رود، یکی از محبوب ترین برنامه های تلویزیونی بود و هواداران شدیدی را برانگیخت. اگر یکی از سوپر طرفداران سریال بودید و مطمئن نیستید که اکنون که داستان کلر و جیمی تمام شده است، چگونه وقت خود را پر کنید، یک خبر خوب وجود دارد: بهترین فیلم برای تماشای طرفداران اوتلندر دهه ها پیش، در سال 1980 اکران شد. Somewhere in Time بهترین فیلم برای طرفداران Outlander است که بر اساس رمان Bid Time Return در سال 1975 نوشته ریچارد متسون ساخته شده است، Somewhere in Time یکی از آن فیلم هایی است که مردم هنوز تقریباً پنجاه سال پس از اکرانش درباره آن صحبت می کنند و به طرز وحشتناکی همراه کامل اوتلندر است. کریستوفر ریو که در فیلم سوپرمن به ستاره‌ای تبدیل شده است، نقش نمایشنامه‌نویس ریچارد کولیر را بازی می‌کند. در حالی که در یک سفر جاده ای است، در هتل بزرگ توقف می کند و عکسی از الیز مک کنا (جین سیمور) را می بیند که بازیگر مشهور اوایل قرن بیستم بود. او متوجه می شود که الیز سالخورده سال ها قبل به او یک ساعت جیبی عتیقه داده است، و به این باور می رسد که سفر در زمان ممکن است و شروع به برنامه ریزی برای سفری به سال 1912 می کند که پس از چندین بار تلاش موفق می شود. در گذشته، او با الیز آشنا می شود و آنها دیوانه وار عاشق می شوند، اما مدیر او"}, {"source": "Lifehacker", "title": "How to Tell If an October Prime Day Deal Is Just Hype", "link": "https://lifehacker.com/how-to-tell-october-prime-day-2026-deal-is-actually-good?utm_medium=RSS", "summary": "We may earn a commission from links on this page. October Prime Day is nearly here . For those two days, you ll find promotions on products from companies both big and small, all vying for your clicks and the contents of your bank account. Many of these offers will claim to be great deals, implying that not buying the item during October Prime Day will mean missing out on massive savings. But not all October Prime Day deals are really all that great just because a product is discounted on October Prime Day doesn't mean it hasn't been cheaper before, nor that it won't be cheaper later. Fortunately, there are a few strategies you can use to quickly figure out whether that amazing deal really is all that. How to tell a good October Prime Day price from a bad one One of the best things you can do to tell if an October Prime Day deal is legit is to use a price tracker . These sites and tools keep tabs on the prices for any given product across the many different stores and vendors where it is sold, in order to give you the best possible price, as well as show you whether that current deal really is that much lower than the original price or other deals that are out there. A common technique to make deals look good is to pump up the price of the product : That way, when the company slashes the price for something like October Prime Day, it can claim a large discount, even if the overall price tag isn t much lower than the original price (if it's lower at all). If something originally costs $60, a company can raise the price to $75, then cut it back down to $60, claiming it took 20% off. It s accurate, but scummy, so watch out for it. You can use a browser extension like CamelCamelCamel to watch a product's price history on Amazon. But other trackers, like Capital One Shopping , can help you find prices and price histories for items across multiple stores. Their browser extensions are especially useful: If there s another store selling the same product you re looking at on Amazon for less, you ll get a pop-up letting you know, with a direct link to that store s product page. Knowing whether something is a good deal isn t all about getting the best price, though. You might see that an item isn t any cheaper elsewhere on the web, but there s more than just the general price tag to consider. Make sure you re not unknowingly buying an outdated piece of tech I m a big believer in old tech: I think we should all hold onto our devices for longer. However, I don t think ", "date_str": "2026-09-18T17:00:00+00:00", "hash": "9425fd142fc5911c", "title_fa": "چگونه بفهمیم که معاملات روز اول اکتبر فقط تبلیغاتی است؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. روز اول اکتبر نزدیک است. در این دو روز، تبلیغاتی را در مورد محصولات شرکت‌های بزرگ و کوچک پیدا خواهید کرد که همگی برای کلیک‌های شما و محتویات حساب بانکی شما رقابت می‌کنند. بسیاری از این پیشنهادات ادعا می‌کنند که معاملات فوق‌العاده‌ای هستند، به این معنی که خرید نکردن کالا در روز اول اکتبر به معنای از دست دادن پس‌انداز هنگفت است. اما همه تخفیف‌های اکتبر Prime Day واقعاً عالی نیستند، فقط به این دلیل که یک محصول در روز اول اکتبر تخفیف داده می‌شود، به این معنی نیست که قبلاً ارزان‌تر نبوده است، یا اینکه بعداً ارزان‌تر نخواهد بود. خوشبختانه، چند استراتژی وجود دارد که می توانید به سرعت دریابید که آیا این معامله شگفت انگیز واقعاً همه اینها است یا خیر. چگونه یک قیمت خوب در روز اکتبر را از یک قیمت بد تشخیص دهیم یکی از بهترین کارهایی که می توانید برای تشخیص قانونی بودن معامله در روز اول اکتبر انجام دهید، استفاده از ردیاب قیمت است. این سایت‌ها و ابزارها قیمت‌های هر محصول را در بسیاری از فروشگاه‌ها و فروشندگان مختلف که در آن فروخته می‌شود، بررسی می‌کنند تا بهترین قیمت ممکن را به شما ارائه دهند، و همچنین به شما نشان دهند که آیا آن معامله فعلی واقعاً بسیار پایین‌تر از قیمت اصلی یا سایر معاملات موجود است. یک تکنیک رایج برای خوب جلوه دادن معاملات این است که قیمت محصول را افزایش دهید: به این ترتیب، وقتی شرکت قیمت را برای چیزی مانند روز اول اکتبر کاهش می‌دهد، می‌تواند ادعای تخفیف زیادی داشته باشد، حتی اگر برچسب قیمت کلی خیلی کمتر از قیمت اصلی نباشد (اگر اصلاً کمتر باشد). اگر چیزی در اصل 60 دلار قیمت داشته باشد، یک شرکت می تواند قیمت را به 75 دلار افزایش دهد، سپس آن را به"}],
      media: [{"source": "Billboard", "title": "How Mariachi Found a Home in China & Earned Mexico’s Recognition, Plus More Uplifting Moments in Latin Music", "link": "https://www.billboard.com/music/latin/mariachi-dragon-china-fuerza-regida-youth-center-uplifting-1236343683/", "summary": "From career milestones to new music releases to major announcements and those little important moments, Billboard editors highlight uplifting moments in Latin music. Here’s what happened in the Latin music world this week. Mariachi Dragón s Emilio Conde Receives Mexico’s Distinguished Mexican Award After Building a Mariachi Bridge Across Continents For over a decade, Mariachi Dragón has carried the sound and spirit of Mexico across China — and now Mexico is recognizing the cultural impact of that work. Founded in Guangzhou in 2014 by Mexican singer-songwriter Emilio Conde, the group is described as the only authentic mariachi ensemble in China. As part of Mexico’s Independence Day celebrations, Conde received the national Distinguished Mexican award from the Institute for Mexicans Abroad on Wednesday (Sept. 16). “Our mission has always been to build a bridge between Mexican culture and Chinese audiences through our music,” Conde said in a statement. “We carry with us the energy, tradition, joy, passion, professionalism and unique pride that come with representing Mexican music abroad.” Mariachi Dragón also includes Rafael Castillo Legarreta (vihuela), Daniel Eduardo Romo (guitarrón), Haobang Esteban Tang and Tienan Gino Jin (violin); and Jingyu Toufu Wang and Huimin Hailey (trumpets). Since debuting at a Mexican National Day celebration organized by the Consulate General of Mexico in Guangzhou, Mariachi Dragón has performed at venues including Xinghai Concert Hall and Zhuhai Opera House, as well as cultural festivals, diplomatic events and international business gatherings. The group has also been featured in the Ugly Little Monkeys (2026) documentary, starring Linda Ronstadt, and in a VisitMexico.com campaign in Beijing. Mariachi Dragón s Emilio Conde receives Mexico’s “Distinguished Mexican” honor in China on Sept. 16, 2026. Credit: Courtesy of the artist Fuerza Regida Receives the Key to San Bernardino San Bernardino Mayor Helen Tran presented the ceremonial keys of San Bernardino to Fuerza Regida during a special hometown celebration on Thursday (Sept. 17) at the historic California Theatre of the Performing Arts, in front of a gathering of over 1,500 local school district students. During the ceremony, frontman Jesús Ortiz Paz and the group also surprised the audience by announcing plans to help fund and create a new youth-focused community center in San Bernardino for the arts, athletics, and music. Honored to receive the keys to the city from Mayor ", "date_str": "2026-09-19T14:00:00+00:00", "hash": "ef097e1ce78ea122", "title_fa": "چگونه ماریاچی خانه ای در چین پیدا کرد و مکزیک را به رسمیت شناخت، به علاوه لحظات نشاط آور بیشتری در موسیقی لاتین", "summary_fa": "ویراستاران بیلبورد از نقاط عطف شغلی گرفته تا انتشار موسیقی جدید تا اطلاعیه های مهم و آن لحظات مهم کوچک، لحظات نشاط آور در موسیقی لاتین را برجسته می کنند. این چیزی است که این هفته در دنیای موسیقی لاتین اتفاق افتاد. Emilio Conde اثر ماریاچی دراگون پس از ساخت پل ماریاچی در سراسر قاره ها جایزه ممتاز مکزیکی را دریافت کرد برای بیش از یک دهه، ماریاچی دراگون صدا و روح مکزیک را در سراسر چین منتقل کرده است - و اکنون مکزیک تاثیر فرهنگی آن کار را به رسمیت می شناسد. این گروه که در سال 2014 توسط خواننده و ترانه سرای مکزیکی امیلیو کوند در گوانگژو تأسیس شد، به عنوان تنها گروه ماریاچی معتبر در چین توصیف می شود. به عنوان بخشی از جشن روز استقلال مکزیک، کوند در روز چهارشنبه (16 سپتامبر) جایزه ملی ممتاز مکزیکی را از موسسه مکزیکی‌های خارج از کشور دریافت کرد. Conde در بیانیه ای گفت: \"مأموریت ما همیشه ایجاد پلی بین فرهنگ مکزیکی و مخاطبان چینی از طریق موسیقی خود بوده است.\" ما انرژی، سنت، شادی، اشتیاق، حرفه‌ای بودن و غرور منحصربه‌فردی را با خود حمل می‌کنیم که با ارائه موسیقی مکزیکی در خارج از کشور همراه است.» ماریاچی دراگون همچنین شامل Rafael Castillo Legarreta (vihuela)، دانیل ادواردو رومو (Gitarrón)، Haobang Esteban Tang و Tienan Gino Jin (ویولن) می شود. و Jingyu Toufu Wang و Huimin Hailey (ترومپت). ماریاچی دراگون از زمان آغاز به کار در جشن روز ملی مکزیک که توسط سرکنسولگری مکزیک در گوانگژو سازماندهی شده بود، در مکان هایی از جمله تالار کنسرت Xinghai و خانه اپرای Zhuhai، و همچنین جشنواره های فرهنگی، رویدادهای دیپلماتیک و گردهمایی های تجاری بین المللی اجرا داشته است. این گروه همچنین در مستند میمون‌های کوچک زشت (2026) با بازی لیندا رونشتات و در کمپین VisitMexico.com در پکن حضور داشته‌اند."}, {"source": "Billboard", "title": "‘Saturday Night Live U.K.’: Here’s Where to Watch the Season 2 Online", "link": "https://www.billboard.com/culture/product-recommendations/saturday-night-live-uk-season-2-watch-stream-online-1236338739/", "summary": "All products and services featured are independently chosen by editors. However, Billboard may receive a commission on orders placed through its retail links, and the retailer may receive certain auditable data for accounting purposes. Live from London, it s Saturday Night! Saturday Night Live U.K. season one was a big hit in the United Kingdom and United States, alike, when it first aired in late 2025. And now, for this weekend, the sketch comedy show features with English comedian and actor Jamie Demetriou to host, while rock band Royal Blood is booked to perform as musical guest . Although SNL U.K. season two broadcasts live on Saturday (Sept. 19) at 10 p.m. BST on British broadcaster Sky UK, it drops in the U.S. on the following day on Sunday (Sept. 20) at 9 p.m. ET/6 p.m. PT on Peacock . Peacock Get Peacock Want to watch SNL U.K. online for nearly free? Your easiest bet is a clever workaround to sign up a 30-day trial to Walmart+ , which goes for just $1 and features access to Peacock as one of its member s perks, to stream the sketch comedy show online without needing a pay for a subscription service. Learn more about Walmart+ ه (19 سپتامبر) ساعت 10 شب به صورت زنده پخش می شود. BST در پخش کننده انگلیسی Sky UK، روز بعد یکشنبه (20 سپتامبر) ساعت 9 شب در ایالات متحده کاهش می یابد. ET/6 بعد از ظهر PT در طاووس . موضوعات مرتبط فراموش کنید سه راهی اصلی کنسرت هنگامی که aespa s SYNK : تور پیچیده کالا مد است شما می خواهید فراتر از نمایش بپوشید اینجا کجا می توان JAŸ-Z در 8 را به صورت آنلاین به صورت آنلاین و رایگان تماشای JAŸ-Z در پاریس نمایش KATSEYE طرفدارانی داشت که کف را به صدا در می آورند: در اینجا می بینید چگونه با یک گروه به صورت آنلاین بازگشت به DN. تقریبا رایگان؟ ساده‌ترین راه‌حل شما برای ثبت نام آزمایشی 30 روزه در Walmart+ است، که فقط با 1 دلار هزینه دارد و دسترسی به Peacock را به عنوان یکی از امتیازات اعضای آن، برای پخش آنلاین نمایش کمدی طرح بدون نیاز به پرداخت هزینه برای سرویس اشتراک دارد. در اینجا درباره Walmart+ بیشتر بدانید. علاوه"}, {"source": "Billboard", "title": "Charlie Puth Cancels Australian and New Zealand Arena Dates", "link": "https://www.billboard.com/music/concerts/charlie-puth-cancels-2026-australian-new-zealand-tour-1236343893/", "summary": "Charlie Puth has cancelled his upcoming Australian and New Zealand tour, scrapping a number of November arena dates first announced in April. The six-date arena run was due to begin at Auckland’s Spark Arena in early November before heading to Australia for concerts in Melbourne, Sydney, Brisbane, Adelaide and Perth. According to an email sent to ticket holders, the shows will no longer proceed and all tickets will be automatically refunded to the original payment method. Fans do not need to take any action to receive their refunds. Ticketing outlets have also listed the concerts as canceled and removed tickets from sale. No reason for the cancellation has been announced, and Puth had not publicly addressed the decision at press time. It is not yet known whether replacement dates will be scheduled. Announced in April, the regional run was set to mark Puth’s first Australian visit since 2023. The singer had promised fans an “unforgettable live experience” featuring a “world-class band.” “I feel like I’ve worked and waited my entire career to put this sort of live show on for you all,” Puth said when announcing the dates. The canceled shows were scheduled in support of Puth’s fourth studio album, Whatever’s Clever!, which arrived in March. Produced by Puth alongside BloodPop, the project blends jazz, soft rock and yacht rock influences and includes guest appearances from Kenny G, Kenny Loggins and Jeff Goldblum. Puth first topped the Billboard Hot 100 as a featured artist on Wiz Khalifa’s “See You Again” in 2015. The Furious 7 soundtrack single spent 12 weeks at No. 1 and earned three Grammy nominations, including song of the year. His debut album, Nine Track Mind, followed in 2016 and included the singles “Marvin Gaye,” featuring Meghan Trainor, “One Call Away” and “We Don’t Talk Anymore,” featuring Selena Gomez. Puth’s representatives and the tour’s promoter have not publicly provided further details about the cancellation.", "date_str": "2026-09-19T06:00:30+00:00", "hash": "acfcd2acde87e3c0", "title_fa": "چارلی پوث تاریخ مسابقات آرنا استرالیا و نیوزلند را لغو کرد", "summary_fa": "چارلی پوث تور استرالیا و نیوزلند آینده خود را لغو کرد و تعدادی از تاریخ‌های مسابقات نوامبر که برای اولین بار در ماه آوریل اعلام شده بود را لغو کرد. قرار بود مسابقه شش مسابقه ای در اوکلند اسپارک آرنا در اوایل نوامبر آغاز شود و سپس برای کنسرت در ملبورن، سیدنی، بریزبن، آدلاید و پرث به استرالیا برود. طبق ایمیلی که برای دارندگان بلیت ارسال شده است، نمایش‌ها دیگر ادامه پیدا نمی‌کنند و همه بلیت‌ها به‌طور خودکار به روش پرداخت اصلی بازپرداخت می‌شوند. هواداران برای دریافت بازپرداخت خود نیازی به هیچ اقدامی ندارند. مراکز فروش بلیت نیز کنسرت ها را به عنوان کنسل شده و بلیت های فروش را حذف کرده اند. هیچ دلیلی برای لغو اعلام نشده است و پوث در زمان مطبوعات به طور علنی به این تصمیم اشاره نکرده بود. هنوز مشخص نیست که آیا تاریخ تعویض برنامه ریزی خواهد شد یا خیر. این مسابقه منطقه ای که در آوریل اعلام شد، قرار بود اولین بازدید پوث از استرالیا از سال 2023 را نشان دهد. این خواننده به طرفداران قول داده بود که یک \"تجربه زنده فراموش نشدنی\" با حضور یک \"گروه کلاس جهانی\" داشته باشد. پوث هنگام اعلام تاریخ‌ها گفت: «احساس می‌کنم در تمام دوران حرفه‌ام کار کرده‌ام و منتظر بودم تا این نوع برنامه زنده را برای همه شما اجرا کنم. برنامه های لغو شده برای حمایت از چهارمین آلبوم استودیویی پوث، Whatever’s Clever!، که در ماه مارس عرضه شد، برنامه ریزی شده بود. این پروژه که توسط Puth در کنار BloodPop تهیه شده است، تأثیرات جاز، سافت راک و قایق راک را در هم می آمیزد و شامل حضور مهمان از Kenny G، Kenny Loggins و Jeff Goldblum می شود. پوث اولین بار در سال 2015 به عنوان یک هنرمند برجسته در آهنگ \"See You Again\" از ویز خلیفه در صدر جدول 100"}, {"source": "Billboard", "title": "Former Ed Sheeran Opener Aaron Rowe Defends Singer Amid Macklemore Tour Fallout", "link": "https://www.billboard.com/music/pop/ed-sheeran-macklemore-fallout-aaron-rowe-defends-singer-1236343894/", "summary": "Aaron Rowe has defended Ed Sheeran amid the continuing fallout over Macklemore’s removal from the singer’s Loop Tour , arguing that public criticism is being directed at the wrong person. Rowe was among the artists who withdrew from Sheeran’s remaining tour dates after Macklemore was dropped from eight scheduled appearances. The decision followed Macklemore’s pro-Palestinian comments and performance of his 2024 protest song “Hind’s Hall” during Sheeran’s Sept. 4 and 5 concerts at MetLife Stadium in New Jersey. “I’m gonna be honest. I think you are all focusing on the wrong person here,” Rowe said in an Instagram video posted Friday (Sept. 18). “All I keep hearing is Ed Sheeran this, Ed Sheeran that — when you really should be focusing on the likes of Robert Kraft.” Kraft’s company, the Kraft Group, owns Gillette Stadium, where Macklemore had been scheduled to support Sheeran on Sept. 25 and 26. Macklemore previously alleged that Kraft pressured promoters to remove him from the tour. Messina Touring Group said venues had warned that upcoming concerts would not proceed while Macklemore remained on the bill. Sheeran has said the decision was made by the tour’s promoter rather than him. He said he spoke with venues, promoters and activists in an attempt to find a resolution but was unable to overrule the decision. Rowe said Sheeran’s response “could have been a lot better,” but argued that panic within the singer’s team contributed to the decision and that he believed Sheeran now considered it a mistake. “I haven’t had a chance to talk to Ed too much, but I fully believe he knows that was a mistake,” Rowe said. Rowe, Lukas Graham and FINNEAS subsequently withdrew from scheduled support appearances, while Irish band Beoga pulled out of its role in Sheeran’s touring band. Announcing his departure earlier in the week, Rowe said he could not “stand by and allow billionaires to use their position of power to silence” artists speaking about Palestinians. Macklemore has pledged to donate $1 million in net earnings from the tour to organizations supporting Palestinians and publicly challenged Kraft to match the contribution. Kraft later announced a $2 million commitment, saying it followed a similar request from Sheeran. Sheeran’s tour is scheduled to resume Saturday night at Lincoln Financial Field in Philadelphia. No opening acts are currently listed for the concert.", "date_str": "2026-09-19T05:45:25+00:00", "hash": "526fff20a79a012c", "title_fa": "آرون رو باز کننده سابق اد شیران از خواننده در میان فال اوت تور مککلمور دفاع می کند", "summary_fa": "آرون رو از اد شیران در بحبوحه‌ی ادامه‌ی اخراج مک‌کلمور از تور حلقه‌ی خواننده، دفاع کرده و استدلال می‌کند که انتقاد عمومی متوجه شخص اشتباهی می‌شود. رو از جمله هنرمندانی بود که پس از حذف مکلمور از هشت برنامه برنامه ریزی شده، از تاریخ باقی مانده تور شیران کناره گیری کرد. این تصمیم به دنبال اظهارات مکلمور طرفدار فلسطین و اجرای آهنگ اعتراضی سال 2024 او به نام «Hind’s Hall» در جریان جشن شیران در سپتامبر 2024 بود. 4 و 5 کنسرت در استادیوم MetLife در نیوجرسی. رو در ویدئویی در اینستاگرام که جمعه (18 سپتامبر) منتشر شد، گفت: \"راست خواهم بود. فکر می کنم همه شما در اینجا روی شخص اشتباهی تمرکز می کنید.\" تنها چیزی که مدام می‌شنوم این است که اد شیران، اد شیران این را می‌شنوم - وقتی واقعاً باید روی افرادی مانند رابرت کرافت تمرکز کنید. شرکت کرافت، گروه کرافت، مالک ورزشگاه ژیلت است، جایی که مککلمور قرار بود در 25 و 26 سپتامبر از شیران حمایت کند. مککلمور قبلاً ادعا کرده بود که کرافت به مروجین فشار آورده است تا او را از تور حذف کنند. گروه تورینگ مسینا گفت که مکان‌ها هشدار داده‌اند که کنسرت‌های آینده تا زمانی که مک‌لمور در صورت‌حساب باقی بماند، ادامه نخواهد یافت. شیران گفته است که این تصمیم به جای او توسط مجری تور گرفته شده است. او گفت که در تلاش برای یافتن راه‌حلی با مکان‌ها، مروجین و فعالان صحبت کرده است، اما نتوانست این تصمیم را رد کند. رو گفت که پاسخ شیرن «می‌توانست خیلی بهتر باشد»، اما استدلال کرد که وحشت در تیم خواننده به این تصمیم کمک کرده است و او معتقد است که شیران اکنون آن را یک اشتباه می‌داند. رو گفت: \"من فرصتی نداشتم که خیلی با اد صحبت کنم، اما کاملاً معتقدم که او می داند که این یک اشتباه بود.\""}, {"source": "Billboard", "title": "Madrid Howls With Shakira as She Kicks Off 12-Date Residency: ‘Tonight We Are One’", "link": "https://www.billboard.com/music/latin/shakira-madrid-concert-recap-residency-spain-1236343874/", "summary": "Eight years after her last concert in Spain, Shakira reunited with her Madrid audience on Friday (Sept. 18), kicking off a 12-date residency in front of 55,000 fans at the Shakira Stadium, a temporary venue built specifically for this event. Hours before the show, the vibrant atmosphere extended beyond the stage, with long lines at food stalls and interactive activity booths. Among the crowd, fans donned purple wigs, coin-adorned scarves tied around their waists, wolf ears and masks and elements inspired by Barranquilla’s Carnival. Related Inside Macondo Park, The City Created for Shakira’s Residency in Madrid Shakira and Maluma Reunite on Steamy New Merengue-Fueled Collaboration Agua : Stream It Now Goal! Shakira Burna Boy s Dai Dai Surpasses 1 Billion Views on YouTube “I can’t believe I’m here. It all feels like a dream,” the Colombian superstar said as she welcomed her fans. “Having you here again tonight, you don’t know how happy it makes me because it’s proof of the love and affection you’ve given me all these years.” She humorously summed up in one sentence how much has changed since her last visit to Spain. “Everyone tells me, ‘Shaki, look at the face you left with and the face you’ve come back with,’” she joked, laughing. “Things have happened in my life since the last time I saw you.” Behind the joke lies much of the personal history that has fueled her recent songs, which now brought her back to Madrid. The promise translated into a journey through more than three decades of music. Shakira danced almost nonstop for nearly two hours, transitioning from rock to reggaeton, showcasing her Lebanese roots, and transforming herself — and her wardrobe — multiple times as she connected the different eras of her catalog. Fans who’ve been with her since the beginning shared the space with a new generation that sang her most recent hits by heart. Songs like “Girl Like Me,” “Te felicito,” “TQG,” “Soltera” and “Hips Don’t Lie” had the crowd singing along in a stadium that rarely quieted down. With “Dai Dai,” the 2026 FIFA World Cup official song, the celebration took on a special meaning for the local audience. “Spain, World Champion!” Shakira shouted, unleashing one of the most electrifying moments of the night. Other special moments included “Acróstico,” dedicated to her children Milan and Sasha, which moved many in the audience to tears, and the much-anticipated “Te Dejo Madrid,” a new addition to the setlist compared to previous stops on the tour. Before p", "date_str": "2026-09-19T00:49:33+00:00", "hash": "bdb4244290d400b6", "title_fa": "مادرید با شکیرا زوزه می کشد و او رزیدنس 12 روزه را آغاز می کند: \"امشب ما یکی هستیم\"", "summary_fa": "هشت سال پس از آخرین کنسرت خود در اسپانیا، شکیرا در روز جمعه (18 سپتامبر) با تماشاگران مادریدی خود دیدار کرد و یک اقامتگاه 12 تاریخی را در حضور 55000 طرفدار در استادیوم شکیرا، یک مکان موقت که به طور خاص برای این رویداد ساخته شده است، آغاز کرد. ساعاتی قبل از نمایش، فضای پر جنب و جوش فراتر از صحنه، با صف های طولانی در غرفه های مواد غذایی و غرفه های فعالیت های تعاملی گسترش یافت. در میان جمعیت، طرفداران کلاه گیس‌های بنفش، روسری‌های سکه‌ای که به دور کمرشان بسته شده بود، گوش‌های گرگ و ماسک‌ها و عناصری الهام‌گرفته از کارناوال بارانکیلا بر سر کردند. مربوط به داخل پارک ماکوندو، شهر ایجاد شده برای اقامت شکیرا در مادرید. دای دای پسر شکیرا برنا از یک میلیارد بازدید در یوتیوب فراتر رفت: «باورم نمی‌شود که اینجا هستم. این سوپراستار کلمبیایی در حین خوشامدگویی به هوادارانش گفت: «این امشب دوباره اینجا هستم، نمی‌دانی چقدر خوشحالم می‌کند، زیرا این نشان از عشق و محبتی است که در تمام این سال‌ها به من داده‌ای.» او با طنز در یک جمله خلاصه کرد که از آخرین سفرش به اسپانیا چقدر تغییر کرده است. او با خنده به شوخی گفت: \"همه به من می گویند \"شکی، به چهره ای که با آن رفتی و چهره ای که با آن برگشتی نگاه کن.\" \"از آخرین باری که تو را دیدم، چیزهایی در زندگی من رخ داده است.\" پشت این شوخی بسیاری از تاریخچه شخصی نهفته است که به آهنگ های اخیر او دامن زده است و اکنون او را به مادرید بازگردانده است. این وعده به سفری در بیش از سه دهه موسیقی تبدیل شد. شکیرا تقریباً دو ساعت بدون وقفه رقصید، از راک به رگیتون تبدیل شد، ریشه‌های لبنانی‌اش را به نمایش گذاشت و خودش - و کمد لباس‌هایش - را چندین بار متحول"}, {"source": "Billboard", "title": "Madonna Leads 2026 MTV VMA Nominations: Full Updated List", "link": "https://www.billboard.com/lists/2026-mtv-vma-nominations-list-madonna-video-music-awards/", "summary": "UPDATE (Sept. 18): CBS and MTV announced nominations in four social categories on Friday (Sept. 18) – best long-form video, best group, best album and song of summer. All voting will be hosted on MTV’s Instagram Stories. Adding in those categories, the top nominees for the 2026 VMAs are Madonna (13), Taylor Swift (11), Sabrina Carpenter (nine), Ariana Grande (eight), Bruno Mars (six, making him the year’s top male nominee), PinkPantheress and Zara Larsson (five each), and Charli xcx, Ella Langley, GENER8ION, KATSEYE, LISA, Olivia Rodrigo and Yung Lean (four each). Related Madonna, BTS More Receive 2026 VMAs Nominations in Social Categories: Full List PREVIOUSLY (Aug. 18): Madonna , who stole the show at the first MTV Video Music Awards in 1984 with a jaw-dropping performance of “Like a Virgin,” is the leading nominee for the 2026 VMAs with 11 nods. It’s the first time Madonna has been the leading nominee since 1998, the year she won video of the year for the first time with “Ray of Light.” She was also the leading nominee in 1990, the year she was nominated for the top award with “Vogue.” In both of those years, she had nine nominations. This year s tally of 11 nods represents a personal best for the legendary star. Madonna’s 14-minute “Confessions II The Film” is nominated for video of the year. Two recent winners in that category were likewise longer-form pieces: Taylor Swift ’s 15-minute “All Too Well: The Short Film,” which won in 2022, and Ariana Grande ’s 26-minute “Brighter Days Ahead,” which won last year. Swift, who has won a record 30 Moon Persons, is second on the leaderboard with nine nominations. Other top contenders include Grande and Sabrina Carpenter (seven nods each); Bruno Mars , PinkPantheress and Zara Larsson (five each); and LISA (four). You’ll notice that seven of the eight artists with the most nominations this year are women. Related Who Should Win Video of the Year at the 2026 MTV Video Music Awards? Vote! Three past winners for video of the year are nominated in that marquee category again this year: Grande (“hate that i made you love me”), Madonna (“Confessions II – The Film”) and Swift (The Fate of Ophelia).” The three other nominees, vying for their first win in the category, are Mars (“I Just Might”), Carpenter (“Tears ) and GENER8ION (“Storm”), starring Yung Lean. The latter video may be the least known of this year’s video of the year nominees and thus stands to gain the most by the nomination. Gener8ion is an audiovisual co", "date_str": "2026-09-19T00:30:00+00:00", "hash": "0c19815c45689699", "title_fa": "مدونا پیشتاز نامزدهای MTV VMA 2026: فهرست کامل به روز شده", "summary_fa": "به روز رسانی (18 سپتامبر): CBS و MTV نامزدهای خود را در چهار بخش اجتماعی در روز جمعه (18 سپتامبر) اعلام کردند - بهترین ویدیوی بلند، بهترین گروه، بهترین آلبوم و آهنگ تابستان. همه رای‌گیری‌ها در استوری‌های اینستاگرام MTV میزبانی خواهد شد. با افزودن این دسته‌ها، نامزدهای برتر VMA 2026 عبارتند از: مدونا (13)، تیلور سویفت (11)، سابرینا کارپنتر (9)، آریانا گرانده (هشت)، برونو مارس (شش نفر، که او را به عنوان برترین نامزد مرد سال، PinkPantheress و Zara Larsson هر کدام)، و چارلافی (لافی xve). GENER8ION، KATSEYE، LISA، Olivia Rodrigo و Yung Lean (هر کدام چهار نفر). مربوطه مدونا، BTS بیشتر نامزدهای VMA 2026 را در دسته‌های اجتماعی دریافت کردند: فهرست کامل قبلاً (اوت. 18): مدونا، که در سال 1984 در اولین جوایز موسیقی ویدئویی MTV با اجرای شگفت انگیز \"Like a Virgin\" نمایش را ربود، با 11 سر زدن، نامزد اصلی جوایز VMA 2026 است. این اولین باری است که مدونا از سال 1998، سالی که برای اولین بار با «Ray of Light» برنده بهترین ویدیوی سال شد، نامزد پیشتاز شد. او همچنین در سال 1990، سالی که با «ووگ» نامزد جایزه برتر شد، نامزد اصلی این جایزه بود. در هر دو آن سال، او 9 نامزدی داشت. آمار 11 تکان دادن سر امسال نشان دهنده بهترین امتیاز شخصی برای ستاره افسانه ای است. فیلم ۱۴ دقیقه‌ای مدونا «اعترافات ۲ فیلم» نامزد بهترین ویدیوی سال شد. دو برنده اخیر در این بخش نیز قطعات بلندتری داشتند: تیلور سوئیفت 15 دقیقه ای «همه خیلی خوب: فیلم کوتاه» که در سال 2022 برنده شد و آریانا گرانده 26 دقیقه ای «روزهای روشن تر در پیش رو» که سال گذشته برنده شد. سوئیفت که رکورد 30 نفر ماه را برنده شده است، با 9 نامزدی در رتبه دوم جدول امتیازات قرار دارد. دیگر رقبای برتر عبارتند از گرانده و سابرینا کارپنتر"}, {"source": "Billboard", "title": "During ATEEZ’s Biggest Year, Leader Hongjoong Wanted to Share a Song About Having ‘Enough’", "link": "https://www.billboard.com/music/pop/ateez-hongjoong-enough-interview-1236343248/", "summary": "In April, Hongjoong returned to Coachella with nothing to do. Two years earlier, he had been on the Indio Valley stage when ATEEZ became the first K-pop boy band to perform at the festival. This time he was a guest, watching other people work. That day I got so many inspirations, he says of a trip where he linked up with Teddy Swims , PinkPantheress , Central Cee , Swae Lee and Daesung of BIGBANG . I really love to experience everywhere. He came back to Los Angeles, booked a session and crafted an atmospheric pop song that he specifies is not just chill but about a feeling he had been chasing his whole life. That song arrives Friday (Sept. 18) as ENOuGH, a collaboration with Bazzi , that is unhurried, openly emotional and, perhaps most notably, sounds nothing like the group he leads in the midst of their biggest season yet. On June 26, ATEEZ unleashed GOLDEN HOUR : Part.5 and made a headlining debut at London s BST Hyde Park in the U.K. just two days later. The EP gave the group its third No. 1 on the Billboard 200 , opening with a career-high 228,000 equivalent album units. At home in Korea, Part.5 s lead single BAD climbed the local charts thanks in part to a viral dance, helping ATEEZ secure their first entry on the Billboard Global 200 . Next month, a full day dedicated to ATEEZ and their fans at the inaugural 82WORLD: LA festival is already sold out. But none of that superstardom is visible when Hongjoong joins an afternoon video call in August from a sun-filled Los Angeles hotel room. He s dressed down in a plain white V-neck T-shirt with the collar cut off, a few silver rings stacked on different fingers, and a single fingernail painted black — a signature he rarely goes without to raise awareness for the Polished Man campaign, which aims to end violence against children. He looks less like the leader of one of K-pop s hardest-working groups than someone enjoying a rare stretch of good weather with nowhere urgent to be. We are so busy these days, he says, but finally I get to chill a little here. So, when the trending group of the moment s leader turns up with a subtle song of his own, it s important to note that it s not a full-fledged solo departure. If I give you a new solo debut, maybe I (will have) prepared more than one year, he says. But for this one, I made this song in April in L.A. A proper solo debut would require far more than the few months it took to deliver ENOuGH — a song made on a break, at a moment when, for the first time in a lon", "date_str": "2026-09-19T00:00:00+00:00", "hash": "413be9ba73e3b981", "title_fa": "در طول بزرگترین سال ATEEZ، رهبر Hongjoong می خواست آهنگی در مورد داشتن \"به اندازه کافی\" به اشتراک بگذارد.", "summary_fa": "در آوریل، هونگجونگ بدون هیچ کاری به کواچلا بازگشت. دو سال قبل از آن، زمانی که ATEEZ اولین گروه پسر کی پاپ بود که در جشنواره اجرا کرد، او روی صحنه Indio Valley بود. این بار او مهمان بود و کار دیگران را تماشا می کرد. آن روز من الهامات زیادی گرفتم، او از سفری می گوید که در آن با تدی سوئیمز، پینک پانترس، سنترال سی، سوئه لی و دسونگ از BIGBANG ارتباط برقرار کرد. من واقعا دوست دارم همه جا را تجربه کنم. او به لس آنجلس بازگشت، یک جلسه رزرو کرد و یک آهنگ پاپ اتمسفری ساخت که به گفته خودش نه تنها خنک است، بلکه درباره احساسی است که در تمام زندگی اش دنبالش بوده است. این آهنگ جمعه (18 سپتامبر) با نام ENOUGH منتشر می شود، همکاری با Bazzi، که بدون عجله، آشکارا احساسی است و، شاید مهمتر از همه، هیچ شباهتی به گروهی که او در بحبوحه بزرگترین فصلشان رهبری می کند، ندارد. در 26 ژوئن، ATEEZ GOLDEN HOUR: Part.5 را منتشر کرد و تنها دو روز بعد در BST Hyde Park لندن در بریتانیا اولین حضور خود را به نمایش گذاشت. EP سومین شماره 1 خود را در بیلبورد 200 به گروه داد و با 228000 واحد آلبوم معادل 228000 واحد شروع به کار کرد. در خانه در کره، تک‌آهنگ BAD قسمت 5 به لطف یک رقص ویروسی در چارت‌های محلی صعود کرد و به ATEEZ کمک کرد اولین ورود خود را در Billboard Global 200 حفظ کند. ماه آینده، یک روز کامل به ATEEZ و طرفدارانش در افتتاحیه جشنواره 82WORLD: LA در حال حاضر تمام شده است. اما وقتی هونگ جونگ در ماه آگوست از یک اتاق پر آفتاب در هتل لس آنجلس به یک تماس ویدیویی بعد از ظهر در ماه اوت می پیوندد، هیچ یک از این ستاره های فوق"}, {"source": "Billboard", "title": "KISS’ Gene Simmons to Receive Lifetime Achievement Award at IEBA’s 2026 Conference", "link": "https://www.billboard.com/pro/kiss-gene-simmons-award-ieba-2026-conference/", "summary": "KISS co-founder Gene Simmons will receive the International Entertainment Buyers Association’s lifetime achievement award during the IEBA 2026 Honors Awards ceremony on Tuesday, Oct. 6 at The Pinnacle Nashville. The ceremony will serve as the culmination of IEBA’s 56th annual conference, taking place Oct. 4-6, with daytime programming at Grand Hyatt Nashville and nighttime events at The Pinnacle. As co-founder, bassist and vocalist of KISS, Simmons helped transform the band into a global phenomenon. KISS was inducted into the Rock Roll Hall of Fame in 2014 and received the Kennedy Center Honors in 2025. Related Gene Simmons Is Touring Solo, Traveling Light and Making Lots of Money Billboard to Add Smart Media Albums As Chart-Eligible Sales Formats Duane Keffe D Davis Gives First Interview After Tupac Shakur Murder Conviction “Gene Simmons embodies the kind of lasting impact the IEBA Lifetime Achievement Award was created to recognize,” Brian Wagner , executive director of IEBA, said in a statement. “KISS didn’t simply build a catalog of iconic music; they changed the scale and possibilities of the live concert experience. Gene’s vision for connecting music, performance, spectacle and brand has influenced generations of artists and live entertainment professionals, and we are incredibly proud to celebrate that legacy at IEBA 2026.” The ceremony will also celebrate the 2026 IEBA Hall of Fame class, with inductions honoring legendary entertainer Chubby Checker and veteran talent buyer Gil Cunningham . Established in 2010, the IEBA Hall of Fame recognizes those whose lasting contributions have helped shape the live entertainment industry. Checker had two No. 1 hits on the Billboard Hot 100, “The Twist” and “Pony Time.” “The Twist” was the first single to hit No. 1 in two separate chart runs, in 1960 and 1962. It was voted into the Grammy Hall of Fame in 2000 and the National Recording Registry in 2012. Checker was voted into the Rock Roll Hall of Fame in 2025. “Chubby Checker represents something that every talent buyer understands, the extraordinary value of an artist who can connect with an audience generation after generation,” said Wagner. “His influence extends far beyond an iconic song or dance. He helped change the way audiences participate in live music, and more than six decades later, that connection remains at the heart of what makes live entertainment so powerful.” Related Alanis Morissette, Taylor Swift, Kenny Loggins More Are 2026 Songwriters Hal", "date_str": "2026-09-18T23:55:25+00:00", "hash": "b3816cc7f993faa5", "title_fa": "KISS's Gene Simmons جایزه یک عمر دستاورد را در کنفرانس IEBA 2026 دریافت می کند", "summary_fa": "جین سیمونز، بنیانگذار KISS، جایزه یک عمر دستاورد انجمن خریداران سرگرمی بین المللی را در طی مراسم جوایز افتخارات IEBA 2026 در روز سه شنبه، 6 اکتبر در The Pinnacle Nashville دریافت خواهد کرد. این مراسم به عنوان نقطه اوج پنجاه و ششمین کنفرانس سالانه IEBA، که در 4 تا 6 اکتبر برگزار می شود، با برنامه ریزی روزانه در Grand Hyatt Nashville و رویدادهای شبانه در The Pinnacle برگزار می شود. سیمونز به عنوان یکی از بنیانگذاران، نوازنده بیس و خواننده KISS، به تبدیل گروه به یک پدیده جهانی کمک کرد. KISS در سال 2014 وارد تالار مشاهیر راک رول شد و در سال 2025 افتخارات مرکز کندی را دریافت کرد. جین سیمونز مرتبط به تنهایی در حال گردش است، بیلبوردهای سبک سفر می‌کند و پول زیادی به دست می‌آورد تا آلبوم‌های رسانه‌های هوشمند را به عنوان فرمت‌های فروش واجد شرایط نمودار اضافه کند. IEBA در بیانیه ای اعلام کرد. KISS صرفاً یک کاتالوگ از موسیقی نمادین ایجاد نکرد؛ آنها مقیاس و امکانات تجربه کنسرت زنده را تغییر دادند. دیدگاه Gene برای اتصال موسیقی، اجرا، نمایش و برند بر نسل‌های هنرمندان و حرفه‌ای‌های سرگرمی زنده تأثیر گذاشته است، و ما فوق‌العاده مفتخریم که این میراث را در IEBA 2026 جشن می‌گیریم.» این مراسم همچنین کلاس تالار مشاهیر IEBA در سال 2026 را جشن می‌گیرد، با مراسمی که از سرگرمی افسانه‌ای چابی چکر و خریدار استعداد کهنه‌کار گیل کانینگهام تقدیر می‌شود."}, {"source": "Billboard", "title": "Rodrigo y Gabriela Add Lyrics & Vocals for the First Time in ‘OurHome,’ in Something ‘Very Powerful’", "link": "https://www.billboard.com/music/latin/rodrigo-y-gabriela-new-album-ourhome-lyrics-vocal-interview-1236343793/", "summary": "For the Mexican duo Rodrigo y Gabriela whose international career has been built over more than 20 years with an instrumental concept powered by two mighty acoustic guitars adding lyrics and vocals to a song for the first time opens the door to a previously unexplored side of their artistry. In their vocal and lyrical debut with the track Somos Como Tú (We Are Like You), included in their new album OurHome , the Grammy-winning guitar pair decided to address themes such as migration, displacement, dignity and shared humanity, from the perspective of those seeking a path and a place to belong. And they do so singing in Spanish, their native language. I wrote that song when I was living in Paris in 2015, and I ve always loved it, Rodrigo Sánchez tells Billboard Español . But for some reason, we could never find a version that sounded like us. Sánchez explains that despite their fondness for the piece included in their new LP released Friday (Sept. 18) by ATO Records it took them a decade to get to a recorded version that felt right for their style. We decided to try again for this album, and it ended up becoming something we felt was very powerful and honest, and even more relevant than it was ten years ago, he adds. The vocal arrangement of Somos Como Tú, with Sánchez taking the lead vocals and Quintero responding with a rapid cadence reminiscent of his heavy metal roots, is supported by hand percussion and a fan choir. This gives the song a special place within OurHome , an album shaped by the idea that home can be something internal and not necessarily a geographic location. For us, OurHome is about connecting with what you love and believing in it, putting your faith in it, says Gabriela Quintero, describing the album as a meditation on home, renewal and connection that emerged in Japan. We can all enter this world of OurHome and reconnect with that part of yourself that doesn t want to please, that doesn t want likes, that is enough just as it is. The 11-track set was recorded in Japan and produced by Sánchez and Quintero at NK Sound Tokyo. Sánchez and Quintero note that they have always been drawn to the Asian country because of its art, its aesthetics and its attention to beauty. The first single, Monster, was accompanied by a music video created by legendary manga artist Naoki Urasawa, whose work has inspired these guitarists from Mexico City. Quintero recalls that they were giving a concert in Japan when they dedicated Monster to Urasawa, a track ins", "date_str": "2026-09-18T22:10:53+00:00", "hash": "39b927b7d5286b6a", "title_fa": "رودریگو و گابریلا برای اولین بار در «OurHome»، در Something «Very Powerful» شعر و آواز اضافه کرد.", "summary_fa": "برای دو نفر مکزیکی رودریگو و گابریلا که بیش از 20 سال فعالیت بین‌المللی آن‌ها با یک مفهوم ساز با دو گیتار آکوستیک قدرتمند ساخته شده است که برای اولین بار شعر و آواز را به یک آهنگ اضافه می‌کنند، دری را به سمت جنبه‌ای از هنرشان باز می‌کند که قبلاً کشف نشده بود. این جفت گیتار برنده جایزه گرمی در اولین آهنگ آوازی و ترانه خود با قطعه Somos Como Tú (ما مثل شما هستیم) که در آلبوم جدید آنها HomeHome گنجانده شده است، تصمیم گرفتند به موضوعاتی مانند مهاجرت، جابجایی، کرامت و انسانیت مشترک، از دیدگاه کسانی که به دنبال مسیر و مکانی برای تعلق هستند، بپردازند. و آنها این کار را با آواز خواندن به زبان اسپانیایی، زبان مادری خود انجام می دهند. رودریگو سانچز به Billboard Español می گوید: زمانی که در سال 2015 در پاریس زندگی می کردم، آن آهنگ را نوشتم و همیشه آن را دوست داشتم. اما به دلایلی، ما هرگز نتوانستیم نسخه ای را پیدا کنیم که شبیه ما باشد. سانچز توضیح می دهد که علیرغم علاقه آنها به قطعه موجود در LP جدیدشان که جمعه (18 سپتامبر) توسط ATO Records منتشر شد، یک دهه طول کشید تا به نسخه ضبط شده ای برسند که برای سبک آنها مناسب است. او اضافه می‌کند که تصمیم گرفتیم دوباره برای این آلبوم تلاش کنیم، و در نهایت به چیزی تبدیل شد که احساس می‌کردیم بسیار قدرتمند و صادقانه است، و حتی مرتبط‌تر از ده سال پیش. تنظیم آوازی Somos Como Tú، با سانچز که وکال اصلی را بر عهده می‌گیرد و Quintero با آهنگی سریع که ریشه‌های هوی متال او را یادآوری می‌کند، پاسخ می‌دهد، با سازهای کوبه‌ای دستی و یک گروه کر طرفداران پشتیبانی می‌شود. این به آهنگ جایگاه ویژه‌ای در OurHome می‌دهد، آلبومی که با این ایده شکل گرفته است که خانه"}, {"source": "Deadline", "title": "CNN, MS NOW Journalists Denied White House Entry Following Donald Trump’s Announced Ban", "link": "https://deadline.com/2026/09/ms-now-journalists-denied-white-house-entry-following-donald-trumps-announced-ban-1237108359/", "summary": "President Donald Trump is following through on pledge to ban journalists he doesn t like from the White House: This morning, journalists from CNN and MS NOW, formerly MSNBC, announced that their journalists had been denied access to the White House grounds. Both networks announced this morning that their journalists were denied access and their White [ ]", "date_str": "2026-09-19T13:40:57+00:00", "hash": "1539eeb32620c48b", "title_fa": "پس از ممنوعیت اعلام شده دونالد ترامپ، خبرنگاران CNN، MS NOW از ورود به کاخ سفید خودداری کردند", "summary_fa": "پرزیدنت دونالد ترامپ به تعهد خود مبنی بر ممنوعیت حضور خبرنگارانی که دوست ندارد از کاخ سفید عمل می کند: امروز صبح، خبرنگاران CNN و MS NOW، که قبلا MSNBC بود، اعلام کردند که خبرنگاران آنها از دسترسی به محوطه کاخ سفید محروم شده اند. هر دو شبکه امروز صبح اعلام کردند که دسترسی به روزنامه نگاران آنها ممنوع شده است و سفید آنها [ ] در ساعت 10 صبح به وقت شرقی، سی ان ان اعلام کرد که مانند MS NOW قبلاً از دسترسی محروم شده است. بتسی کلاین خبرنگار شبکه کاخ سفید گفت که او و یک عکاس طبق معمول سعی کردند وارد محوطه شوند اما اجازه ورود به آنها داده نشد. CNN بیانیه زیر را منتشر کرد: اوایل امروز، خبرنگاران CNN از دسترسی به محوطه کاخ سفید محروم شدند. مأموریت سی‌ان‌ان برای گزارش‌دهی درباره دولت ایالات متحده بدون توجه به هرگونه تلاش برای محدود کردن دسترسی فیزیکی به کاخ سفید و سایر ساختمان‌های دولتی، یا هر تلاش دیگری برای ممانعت از روزنامه‌نگاری ما ادامه خواهد داشت. طبق قانون اساسی ایالات متحده، ما حق داریم گزارش خود را بدون مانع یا مداخله دولت انجام دهیم و این ممنوعیت تجاوزی غیرقانونی به این حق اساسی است. MS NOW در بیانیه‌ای که امروز در رسانه‌های اجتماعی منتشر شد، نوشت: اوایل صبح امروز، خبرنگاران MS NOW از دسترسی به محوطه کاخ سفید محروم شدند. کاخ سفید متعلق به مردم آمریکاست و تصمیمات اتخاذ شده در داخل از دلارهای مالیاتی ما تامین می شود. MS NOW قصد دارد تمام اقدامات لازم را برای دفاع از حقوق متمم اول و نقش اساسی روزنامه نگاری مستقل در دموکراسی ما انجام دهد. ما محکم پشت مجریان، خبرنگاران و اتاق خبرمان ایستاده ایم. ما به گزارش رئیس جمهور، دولت و مسائلی که بر مردم آمریکا تأثیر می گذارد ادامه خواهیم داد."}, {"source": "Deadline", "title": "Anthony Page Dies: Tony-Winning, Emmy-Nominated Director Of Stage & Screen Was 90", "link": "https://deadline.com/2026/09/anthony-page-dead-1237108346/", "summary": "Anthony Page, the prolific British stage, film and TV director who won a Tony Award for his 1997 Broadway production of A Doll s House and was twice Emmy-nominated for acclaimed TV movies in the 1970s, died September 11 at a London residential care home. He was 90. Page s death has been confirmed by press representative [ ]", "date_str": "2026-09-19T13:11:46+00:00", "hash": "16ae72951c06614f", "title_fa": "آنتونی پیج درگذشت: تونی برنده، کارگردان صحنه و فیلم نامزد امی 90 ساله بود", "summary_fa": "آنتونی پیج، کارگردان پرکار صحنه، سینما و تلویزیون بریتانیایی که در سال 1997 جایزه تونی را برای ساخت خانه عروسک در برادوی د lix NL", "title": "Verrassing: volgende Harlan Coben staat al klaar op Netflix", "link": "https://www.netflix-nederland.nl/verrassing-volgende-harlan-coben-staat-al-klaar-op-netflix/", "summary": "Verrassing, verrassing, verrassing! Het lijkt er sterk op dat de volgende Harlan Coben , de grootste tot nu met naar verwachting meerdere seizoenen, sneller dan verwacht naar Netflix komt. De opnames worden binnenkort namelijk afgerond. Opnames Myron Bolitar bijna afgerond Wie Harlan Coben ook kent van zijn boeken, weet wel over welke show we het hier hebben: Myron Bolitar natuurlijk: wanneer een blessure zijn droom van een carrière in de NBA abrupt beëindigt, besluit Myron Bolitar een andere richting in te slaan en aan de slag te gaan als sportmakelaar. Dankzij zijn charisma en scherpe mensenkennis probeert hij samen met zijn keiharde zakenpartner zijn weg te vinden in de competitieve en soms schimmige wereld van de topsport. Daarbij beperkt zijn werk zich lang niet altijd tot het onderhandelen over contracten: om zijn cliënten uit de problemen te helpen, belandt Myron regelmatig zelf in gevaarlijke situaties. Harlan Coben zelf noemde deze reeks onlangs nog de belangrijkste verfilming : Mijn hart ligt zeker bij Myron Bolitar. Ik heb 34 boeken geschreven, waarvan een derde over Myron Bolitar gaat. Hij is mijn dierbaarste creatie en ik ben erg blij dat hij nu bij Netflix ondergebracht is, zodat we er alles aan kunnen doen om de serie goed te maken. Het is een van de verhalen waar ik altijd extra zorgvuldig mee ben omgegaan. In juli 2026 werden de camera s aangezwengeld om al het beeldmateriaal voor Myron Bolitar te verzamelen, en op 10 oktober aanstaande vindt de laatste draaidag plaats. En dat betekent dat het niet lang meer duurt voordat deze serie op Netflix debuteert. Wanneer komt Myron Bolitar op Netflix? Interessant om te vermelden: ook de nieuwe versie van The Woods staat binnenkort helemaal op beeld. Daarom zou het zomaar eens zo kunnen zijn dat we in 2027 te maken e": "Pitchfork", "title": "Tune-Yards Line Up U.S. Tour", "link": "https://pitchfork.com/story/tune-yards-are-touring-the-score-of-boots-riley-film-i-love-boosters/", "summary": "The Oakland band is hitting Chicago, Cleveland, Boston, and more", "date_str": "2026-09-18T17:01:18+00:00", "hash": "aa555967ae1c7886", "title_fa": "Tune-Yards Line Up تور ایالات متحده", "summary_fa": "گروه اوکلند در حال بازدید از شیکاگو، کلیولند، بوستون و موارد دیگر است. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان Tune-Yards در حال شروع یک تور ایالات متحده با عنوان The Ones That Love You است. از 5 نوامبر در شیکاگو، گروه اوکلند در کلیولند، بوستون، سینسیناتی و غیره توقف خواهد کرد. دو پاپ Rituals of Mine هر تاریخ را باز خواهند کرد. برای برنامه کامل به پایین اسکرول کنید. بهار امسال، Tune-Yards موسیقی فیلم کمدی-جنایی بی‌نظیر Boots Riley، I Love Boosters را نوشت و منتشر کرد، که در ادامه کار آهنگسازی آنها برای اولین فیلم بلند رایلی، Sorry to Bother You در سال 2018 منتشر شد. Tune-Yards ششمین آلبوم استودیویی خود را با نام Better Dreaming در سال 2025 منتشر کرد. تصحیح: نسخه قبلی این داستان به اشتباه اشاره کرده بود که این تور فقط بر روی موسیقی Tune-Yards I Love Boosters متمرکز شده است. تیون یارد: 11-05 - شیکاگو، IL - شروع ^ 11-07 - لوئیزویل، KY - ببر چرخشی ^ 11-08 - سینسیناتی، OH - تئاتر وودوارد ^ 11-10 - گرند رپیدز، MI - طرح پیرامید ^ - Cleveland OH 11-room 11-14 - هومر، نیویورک - مرکز هنرهای هومر ^ 11-15 - Portsmouth, NH - 3S Artspace ^ 11-16 - Hamden, CT - Space Ballroom ^ 11-18 - Boston, MA - Paradise Rock Club ^"}, {"source": "Pitchfork", "title": "Duncan Sheik Dies at 56", "link": "https://pitchfork.com/story/duncan-sheik-dies-at-56/", "summary": "The musician was best known for his 1996 single “Barely Breathing” and his Tony-winning work on Broadway’s Spring Awakening", "date_str": "2026-09-18T14:40:14+00:00", "hash": "69660c079681647f", "title_fa": "دانکن شیک در 56 سالگی درگذشت", "summary_fa": "این نوازنده بیشتر برای تک‌آهنگ‌اش «Barely Breathing» در سال 1996 و اثر برنده تونی‌اش در Broadway's Spring Awakening Loader Save Story Save this Story Comment Loader Save Story Save this Story Duncan Sheik، آهنگساز برادوی برادوی برنده تونی Breathway's Spring Awakening و خواننده در پشت آهنگ «Breath Awakening» و «Breath99» در پشت آهنگ «1» شناخته شد. منهتن، نیویورک تایمز گزارش می دهد. او 56 سال داشت. به گفته مادر شیخ، علت مرگ ایست قلبی بوده است. در اوایل این هفته، وضعیت این نوازنده وخیم اما به دلیل یک مشکل سلامت نامشخص گزارش شد. دانکن اسکات شیک در 18 نوامبر 1969 در گلن ریج، نیوجرسی به دنیا آمد. اولین تک آهنگ او، آهنگ پاپ راک \"Barely Breathing\"، به موفقیت بزرگی برای خواننده و ترانه سرای جوان تبدیل شد و در رتبه 16 در Hot 100 قرار گرفت و به مدت 55 هفته در جدول باقی ماند. این آهنگ بعداً نامزد گرمی برای بهترین اجرای موسیقی پاپ مرد شد. شیخ پس از انتشار دو آلبوم استودیویی دیگر، موزیکال «بیداری بهار» را ساخت که در نهایت بهترین موسیقی اورجینال و بهترین ارکستراسیون را در جوایز تونی به همراه جایزه گرمی برای بهترین آلبوم نمایشی موزیکال به دست آورد. آخرین آلبوم او، Claptrap، در سال 2022 منتشر شد."}, {"source": "Rolling Stone", "title": "Gnarls Barkley Announce First Tour in 18 Years", "link": "https://www.rollingstone.com/music/music-news/gnarls-barkley-first-tour-18-years-atlanta-1235629188/", "summary": "Duo's To Whom It Still Concerns Tour, in support of their third and final album Atlanta , hits the road this November", "date_str": "2026-09-19T14:10:38+00:00", "hash": "88045fa8969f7ed4", "title_fa": "Gnarls Barkley اولین تور خود را پس از 18 سال اعلام کرد", "summary_fa": "تور Duo's To Whom It Still Concerns، در حمایت از سومین و آخرین آلبوم خود یعنی Atlanta، در نوامبر امسال به راه می‌افتد. CeeLo Green و Danger Mouse در ماه نوامبر در تور خود به Whom It Still Concerns، راهپیمایی 9 روزه در حمایت از آتلانتا، سومین و طبق گزارشات آخرین آلبوم این دو، وارد جاده خواهند شد. گرین در بیانیه‌ای گفت: تور Gnarls Barkley To Whom It Still Concerns مانند یک کتاب باز عمل می‌کند و در مورد مسائل جهانی زندگی، مرگ و همه چیز در این بین کاوش می‌کند. این آهنگ ها خط نقره ای برای یک داستان غم انگیز هستند. بیا و بیایید با هم دیوانگی زیبای آن را جشن بگیریم. این تور از 5 نوامبر در سانفرانسیسکو آغاز می شود و تا 28 نوامبر در شیکاگو ادامه دارد. تور در حمایت از اولین آلبوم آتلانتا گنارلز بارکلی از سال 2008، The Odd Couple البته در آتلانتا متوقف خواهد شد، با آن کنسرت بازگشت به خانه که برای 10 نوامبر برنامه ریزی شده است. Gnarls Barkley آخرین بار در 28 سپتامبر 2008 در آستین سیتی لیمیتز به صورت زنده اجرا کرد و سپس وارد جایی شد که قبل از 1 مارس به سال 1989 تبدیل شد. داستان‌های پرطرفدار هوش مصنوعی ساختگی ارتش «تقریباً جنگی را با چین آغاز کرد»: گزارش دراپ‌کیک مورفیس کن کیسی می‌گوید اد شیران «زانو گرفت» با مکلمور: «راست با من نمی‌نشیند» اد شیران بازکن آرون روو از خواننده دفاع می‌کند، می‌گوید فوکوس کرافتن‌کن‌اس، شفوکوس «دوکن‌آب» روی رابرت‌کِن‌واکنس آهنگساز و خواننده «Barely Breathing»، در 56 نوامبر 5 سانفرانسیسکو، کالیفرنیا The Masonic 7 نوامبر لس آنجلس، کالیفرنیا The Wiltern 10 نوامبر آتلانتا، GA کوکاکولا Roxy Nov. 13 دیترویت، MI The Fillmore دیترویت 15 نوامبر بوستون، MA Citizens House of Blues 19 نوامبر Silver Spring, MD The Fillmore Silver Spring 22 نوامبر تورنتو، در تاریخ 24"}, {"source": "Rolling Stone", "title": "Tinashe Is Feeling the Pressure. It’s Nothing ‘Popstar’ Can’t Handle", "link": "https://www.rollingstone.com/music/music-features/tinashe-album-popstar-creative-choices-feeling-pressure-1235626810/", "summary": "The rollout for her eighth studio album might be the most contentious of her career, but all that means is her plan is working", "date_str": "2026-09-19T14:00:00+00:00", "hash": "f3a53fdd02cadd4a", "title_fa": "تیناشه در حال احساس فشار است. چیزی نیست که «پاپ استار» از عهده آن برآید", "summary_fa": "انتشار هشتمین آلبوم استودیویی او ممکن است بحث برانگیزترین آلبوم حرفه ای او باشد، اما همه اینها به این معنی است که برنامه او کار می کند تیناش هنوز یک هفته تا انتشار هشتمین آلبوم استودیویی اش Popstar فاصله دارد و او می تواند فشار را احساس کند. در گذشته، رکوردهای او نه دقیقاً بی سر و صدا، بلکه اغلب زیر رادار می رسید. با این یکی چیز م ون متوجه شود سربازان در آستانه سوار شدن به یک کشتی چینی بودند. بر اساس گزارش CNN، ایالات متحده جت های اسکرامبل نظامی و سربازان مسلح برای سوار شدن به کشتی آماده شدند. اما درست قبل از انجام ماموریت، تحلیلگران وزارت دفاع در نهایت کار خود را بررسی کردند: منابع به CNN گفتند، این گزارش کاملاً نادرست بود. چت بات داخلی که یک تحلیلگر فرماندهی متخصص برای تهیه گزارش از آن استفاده کرده بود، به اشتباه محموله کشتی را شناسایی کرده بود. دارایی های نظامی متوقف شد. کسی سوار قایق نشد. اما این حادثه به حدی نزدیک شد که فاجعه ای را رقم زد که منابعی که با سی ان ان صحبت می کردند متعجب شدند و گفتند که گزارش جعلی هوش مصنوعی تقریباً شروع کننده یک جنگ بود. پیت هگزت، وزیر دفاع آمریکا، در مورد ادغام چت ربات‌های هوش مصنوعی و ابزارهای دیگر در ارتش بسیار پرخاشگر بوده است. ایالات متحده همچنان بر هوش مصنوعی مسلط خواهد بود! یک حساب کاربری متعلق به پنتاگون در اوایل این هفته در X منتشر شد. اما کاملاً مشخص نیست که دقیقاً چه معنایی دارد. در ماه ژانویه، پنتاگون استراتژی شتاب هوش مصنوعی خود را منتشر کرد، سندی مبهم که مشخص نمی کند ارتش دقیقاً برای چه هدفی از هوش مصنوعی استفاده خواهد کرد. به Swarm Forge و Agent Networks اشاره شده بود، اما به زبان انگلیسی ساده به توضیح اینکه چگونه مدل‌های زبان بزرگ و ابزارهای هوش مصنوعی در قابلیت‌های رزمی واقعی قرار می‌گیرند، کمی اشاره شد."}, {"source": "Hollywood Reporter", "title": "CNN, MS NOW Reporters Denied Access to White House as Trump Follows Through on Threat to Ban Outlets", "link": "https://www.hollywoodreporter.com/news/politics-news/ms-now-denied-access-white-house-trump-follows-through-ban-1236706029/", "summary": "Trump said Friday that CNN and Politico would also be denied access to the grounds.", "date_str": "2026-09-19T13:20:11+00:00", "hash": "576bfef33cdf5744", "title_fa": "خبرنگاران CNN و MS NOW از دسترسی به کاخ سفید محروم شدند زیرا ترامپ تهدید به ممنوعیت رسانه ها را دنبال می کند.", "summary_fa": "ترامپ روز جمعه گفت که سی ان ان و پولیتیکو نیز از دسترسی به این زمینه محروم خواهند شد. دونالد ترامپ، رئیس جمهور آمریکا، تهدید روز جمعه خود مبنی بر ممنوعیت خروج ر
