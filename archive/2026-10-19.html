پلیس سپاسگزاریم.» آقای آلبانیزی به خبرنگاران گفت: «در این زمان بسیار دشوار، تمام فکر ما با هلن، خانواده‌اش، دوستانش، تیمش و جامعه اوست. برای بهبودی کامل او دعا می‌کنیم.» به گفته آقای آلبانیزی، انگیزه مظنون نامعلوم است و پلیس مبارزه با تروریسم هم فعال شده است و در تحقیقات مشارکت دارد. پلیس فدرال استرالیا در سال‌های اخیر افزایش مستمر تهدید و توهین‌ به سیاستمداران را ثبت کرده است. پلیس فدرال سال گذشته تیمی ویژه تشکیل داد تا درباره گروه‌ها و افرادی که نمایندگان پارلمان را هدف قرار می‌دهند، تحقیق کند. آقای آلبانیزی روز دوشنبه گفت که اخیرا تنش افزایش یافته است و این نگرانی را با فعالان رسانه‌ها در میان گذاشته‌ است: «اگر شبکه‌های اجتماعی را بررسی کنید و نظرات را بخوانید،"}, {"source": "BBC Persian", "title": "سفر مارک روبیو به سمرقند؛ آمریکا در تلاش گسترش روابط با کشورهای آسیای میانه است", "link": "https://www.bbc.com/persian/articles/cq1467zz610lo?at_medium=RSS&at_campaign=rss", "summary": "وزیر امور خارجه ایالات متحده، در سفری با «هدف تقویت روابط تجاری و دیپلماتیک با آسیای مرکزی» به ازبکستان رفته است. مارک روبیو دیشب وارد سمرقند شد. وزیر خارجه آمریکا در حساب ایکس خود نوشته است که «برای شرکت در نشست وزرای گروه ۵+۱ و سرپرستی یک هیئت بی‌نظیر از بیش از ۲۰۰ مدیر و فعال اقتصادی، در ازبکستان حضور دارم.»", "date_str": "2026-10-19T14:24:46+00:00", "hash": "16946869fff5c3d3", "title_fa": "سفر مارک روبیو به سمرقند؛ آمریکا در تلاش گسترش روابط با کشورهای آسیای میانه است", "summary_fa": "وزیر امور خارجه ایالات متحده، در سفری با «هدف تقویت روابط تجاری و دیپلماتیک با آسیای مرکزی» به ازبکستان رفته است. مارک روبیو دیشب وارد سمرقند شد. وزیر خارجه آمریکا در حساب ایکس خود نوشته است که «برای شرکت در نشست وزرای گروه ۵+۱ و سرپرستی یک هیئت بی‌نظیر از بیش از ۲۰۰ مدیر و فعال اقتصادی، در ازبکستان حضور دارم.» آقای روبیو امروز دوشنبه با همتایان خود از قزاقستان، قرقیزستان، تاجیکستان، ترکمنستان و ازبکستان دیدار کرده است و بر اساس گزارش‌ها طرفها پیرامون امنیت، تجارت، بهبود امنیت منطقه‌ای و نگرانی‌های مشترک گفت‌وگو کرده‌اند. به گفته تحلیلگران بعید است که وضعیت فعلی در افغانستان در این گفت‌وگوها مطرح نشده باشد. ‌ همچنین قرار است او در نشست «شورای تجارت و سرمایه‌گذاری ایالات متحده و ازبکستان» شرکت و با مقامات تجاری آسیای مرکزی و جمهوری آذربایجان دیدار کند. آقای روبیو در سمرقند به خبرنگاران گفت که آسیای مرکزی «مکانی جدید برای سرمایه‌گذاری و پایگاهی تازه برای صادرات است؛ ترمینالی مرکزی که از طریق آن مواد حیاتی برای آینده همه ملت‌ها ارسال می‌شود.» وزیر خارجه آمریکا تأکید کرد که «ایالات متحده می‌خواهد شریکی قدرتمند در آسیای مرکزی باشد.» او افزود: «آسیای مرکزی طی ۲۰ سال گذشته آن‌طور که شایسته بوده مورد توجه سیاست‌گذاران ما قرار نگرفته است، اما این روند در حال تغییر است و به همین دلیل است که ما اکنون اینجا هستیم.» رسانه‌های آمریکایی هم نوشته‌اند که «اگرچه حکومت‌های مختلف پیش‌تر بارها وعده داده بودند که حضور فعال‌تری در آسیای مرکزی خواهند داشت، اما این منطقه اغلب در واشنگتن به عنوان اولویتی درجه‌دوم در سیاست خارجی تلقی شده است.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. آمریکا در دوران حضور نظامی خود در افغانستان، روابطی محدود با کشورهای آسیای میانه برقرار کرد تا عمدتا به عنوان نقاط"}, {"source": "BBC Persian", "title": "پس از هفته‌ها خشونت، فشارها بر دولت فرانسه افزایش یافته است", "link": "https://www.bbc.com/persian/articles/cq5ynpjn2105o?at_medium=RSS&at_campaign=rss", "summary": "کاخ الیزه صبح امروز اعلام کرد که لوران نونیز استعفای خود را ارائه داده است اما امانوئل مکرون به‌جای پذیرش، از وزیر کشور خواسته است بررسی کند که چگونه می‌توان خیابان‌های فرانسه را امن‌تر کرد و عاملان خشونت‌های آخرهفته را به دست عدالت سپرد. روز شنبه، بیش از نیم میلیون معترض که عمدتا مسالمت‌آمیز بودند، در اعتراض به افزایش هزینه‌های زندگی و کاهش دسترسی به خدمات عمومی مناسب، از جمله آموزش دولتی باکیفیت، تظاهرات کردند. اما پس از آنکه گروه‌هایی از فعالان و خرابکاران سیاه‌پوش و نقابدار ظاهر شدند، اعتراضات به خشونت کشیده شد.", "date_str": "2026-10-19T10:00:15+00:00", "hash": "992c0857add1ec16", "title_fa": "پس از هفته‌ها خشونت، فشارها بر دولت فرانسه افزایش یافته است", "summary_fa": "کاخ الیزه صبح امروز اعلام کرد که لوران نونیز استعفای خود را ارائه داده است اما امانوئل مکرون به‌جای پذیرش، از وزیر کشور خواسته است بررسی کند که چگونه می‌توان خیابان‌های فرانسه را امن‌تر کرد و عاملان خشونت‌های آخرهفته را به دست عدالت سپرد. روز شنبه، بیش از نیم میلیون معترض که عمدتا مسالمت‌آمیز بودند، در اعتراض به افزایش هزینه‌های زندگی و کاهش دسترسی به خدمات عمومی مناسب، از جمله آموزش دولتی باکیفیت، تظاهرات کردند. اما پس از آنکه گروه‌هایی از فعالان و خرابکاران سیاه‌پوش و نقابدار ظاهر شدند، اعتراضات به خشونت کشیده شد. برآورد می‌شود که حدود ۱۵۰۰ مغازه و کسب‌وکار غارت و تخریب شده‌اند. پلیس ضدشورش گاز اشک‌آور شلیک کرد و خودروهای آبپاش را به کار گرفت. در جاهای مختلف ماموران پلیس در حال زدن مردم با باتوم دیده شدند. به گفته وزارت کشور فرانسه، روز شنبه حدود ۱۰۰۰ مامور پلیس زخمی شدند که هفت نفرشان به‌شدت آسیب دیدند. مخالفان سیاسی و برخی اتحادیه‌های کارگری و کاربران شبکه‌های اجتماعی وزیر کشور را متهم کرده‌اند که برای تظاهرات متعدد و از پیش اعلام‌شده روز شنبه آمادگی و نیروی پلیس کافی نداشته است. یائل برون‌پیوه، رئیس پارلمان فرانسه، خواستار تحقیقات درباره همه اتفاقات شده است. شایعاتی هست که شاید امانوئل مکرون در بخش‌هایی از کشور مقررات منع رفت‌وآمد موقت برقرار یا حتی برای آرام کردن فضای ملتهب، وضعیت اضطراری اعلام کند. او روز یکشنبه در یک سخنرانی تلویزیونی خطاب به مردم، خواستار وحدت ملی شد و سعی کرد اطمینان دهد که عاملان خشونت‌ها مجازات خواهند شد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. از سخنرانی رئیس‌جمهور در رسانه‌های فرانسه به‌شدت انتقاد شد زیرا فاقد جزئیات مشخص و ملموس بود، اینکه چگونه با خرابکاران و آشوبگران برخورد خواهد شد و چگونه آنها را می‌توان در قبال اقداماتشان پاسخگو"}, {"source": "BBC Persian", "title": "ترامپ و نتانیاهو در یک سنگر؛ سایه ایران بر دو انتخابات سرنوشت‌ساز", "link": "https://www.bbc.com/persian/articles/ckr5yr03d5lvo?at_medium=RSS&at_campaign=rss", "summary": "در حالی که تنها چند روز تا انتخابات پارلمانی اسرائیل و حدود دو هفته تا انتخابات میان‌دوره‌ای آمریکا باقی مانده است، حمایت علنی دونالد ترامپ از بنیامین نتانیاهو بار دیگر گمانه‌زنی‌ها درباره احتمال ازسرگیری حملات نظامی به ایران را در صدر توجه رسانه‌های آمریکایی قرار داده است. همزمان، افزایش هزینه‌های اقتصادی جنگ به یکی از محورهای اصلی رقابت‌های انتخاباتی در آمریکا تبدیل شده است.", "date_str": "2026-10-19T07:28:27+00:00", "hash": "16cce9abb2129d79", "title_fa": "ترامپ و نتانیاهو در یک سنگر؛ سایه ایران بر دو انتخابات سرنوشت‌ساز", "summary_fa": "در حالی که تنها چند روز تا انتخابات پارلمانی اسرائیل و حدود دو هفته تا انتخابات میان‌دوره‌ای آمریکا باقی مانده است، حمایت علنی دونالد ترامپ از بنیامین نتانیاهو بار دیگر گمانه‌زنی‌ها درباره احتمال ازسرگیری حملات نظامی به ایران را در صدر توجه رسانه‌های آمریکایی قرار داده است. همزمان، افزایش هزینه‌های اقتصادی جنگ به یکی از محورهای اصلی رقابت‌های انتخاباتی در آمریکا تبدیل شده است. باراک راوید، خبرنگار وب‌سایت خبری آکسیوس، در گزارشی از گفت‌وگویی تلفنی خبر داده که در آن، دونالد ترامپ از تصمیم خود برای حمایت از بنیامین نتانیاهو سخن گفته است؛ حمایتی که تنها ۹ روز پیش از برگزاری انتخابات پارلمانی اسرائیل اعلام شد. ترامپ که در ماه‌های گذشته به‌دلیل اختلاف‌نظر با نتانیاهو بر سر جنگ ایران و غزه از حمایت علنی او پرهیز کرده بود، اکنون از نخست‌وزیر اسرائیل به‌عنوان یکی از متحدان اصلی‌اش در رویارویی با ایران یاد می‌کند. این چرخش در موضع از آن رو اهمیتی دوچندان یافته که آکسیوس پنج روز پیش‌تر گزارش داده بود ترامپ و نتانیاهو درباره احتمال آغاز دور تازه‌ای از عملیات نظامی گسترده علیه ایران گفت‌وگو کرده‌اند. به نوشته این رسانه، نتانیاهو با استناد به اطلاعات نهادهای امنیتی اسرائیل درباره تلاش ایران برای بازسازی برنامه هسته‌ای‌اش، موضوع حملات تازه را پیش کشیده است. با این حال، کاخ سفید گزارش مربوط به رایزنی دو رهبر درباره ازسرگیری جنگ را تکذیب و تأکید کرد که ترامپ قصد ندارد پیش از انتخابات میان‌دوره‌ای سوم نوامبر (۱۲ آبان) حمله تازه‌ای علیه ایران انجام دهد. آکسیوس به نقل از مقام‌های آمریکایی و اسرائیلی گزارش داده است که نیروهای دو کشور همچنان برای احتمال ازسرگیری درگیری‌ها در حالت آماده‌باش قرار دارند. به نوشته این رسانه، هرچند هنوز تصمیم نهایی درباره اقدام نظامی جدید گرفته نشده، اما پس از برگزاری ها را «سفرای آمریکا» در ایران می‌خوانند. برخی از این منتقدان همچنین خواهان محاکمه کسانی شده‌اند که از «صلح شرافتمندانه» سخن می‌گویند. حسین شریعتمداری، مدیرمسئول روزنامه کیهان، در سرمقاله روز پنجشنبه ۲۳ مهرماه، سخنان افرادی مانند آقای مرعشی را «ده‌ها بار ذلت‌بارتر و وطن‌فروشانه‌تر از خواسته آمریکا» برای تسلیم ایران توصیف می‌کند و با استناد به سخنان علی خامنه‌ای، این افراد را «دشمن» می‌خواند و خواهان برخورد دستگاه‌های امنیتی و قضایی با آنها می‌شود. این مخالفت با مصالحه و عقب‌نشینی در مواضع برخی دیگر از چهره‌های اصولگرا نیز دیده می‌شود. احمد علم‌الهدی، امام جمعه مشهد، در نماز جمعه ۲۴ مهر ۱۴۰۵، از شکست تلاش‌های"}, {"source": "BBC Persian", "title": "چرا روسیه در جنگ یمن دست خود را رو نمی‌کند؟", "link": "https://www.bbc.com/persian/articles/c6x2vxejrx9lo?at_medium=RSS&at_campaign=rss", "summary": "در حالی که جنگ یمن در ماه‌های اخیر ابعاد تازه‌ای پیدا کرده و بر بازار انرژی و امنیت منطقه‌ای تاثیر گذاشته است، روسیه ترجیح داده کمتر درباره این بحران سخن بگوید. با این حال، تماس‌هایش با انصارالله، روابطش با دولت یمن و منافع اقتصادی و ژئوپولیتیک ناشی از ادامه درگیری، نشان می‌دهد مسکو همچنان بازیگری مهم در تحولات یمن باقی مانده است.", "date_str": "2026-10-19T04:32:33+00:00", "hash": "0e01cae5b9fd2ca5", "title_fa": "چرا روسیه در جنگ یمن دست خود را رو نمی‌کند؟", "summary_fa": "در حالی که جنگ یمن در ماه‌های اخیر ابعاد تازه‌ای پیدا کرده و بر بازار انرژی و امنیت منطقه‌ای تاثیر گذاشته است، روسیه ترجیح داده کمتر درباره این بحران سخن بگوید. با این حال، تماس‌هایش با انصارالله، روابطش با دولت یمن و منافع اقتصادی و ژئوپولیتیک ناشی از ادامه درگیری، نشان می‌دهد مسکو همچنان بازیگری مهم در تحولات یمن باقی مانده است. مسئولان، رسانه‌ها و وبلاگ‌نویسان روس به‌ندرت به تحولات یمن می‌پردازند؛ آن هم در شرایطی که جنگ داخلی این کشور و پیامدهای بین‌المللی آن در ماه‌های سپتامبر و اکتبر ۲۰۲۶ به‌شدت شدت گرفته است. این در حالی است که یمن از نظر راهبردی اهمیت زیادی دارد، روسیه با جنوب یمن، که زمانی از متحدان اتحاد جماهیر شوروی بود، روابطی تاریخی داشته است و ایران، متحد مسکو، نیز در تحولات جاری این کشور نقش مهمی ایفا می‌کند. با این حال، پوشش محدود رسانه‌ای این موضوع نشان می‌دهد که روسیه تنها به ارائه خود به‌عنوان میانجی در این درگیری بسنده نمی‌کند، بلکه ادعا می‌شود به جنبش انصارالله، گروه مورد حمایت ایران، نیز کمک‌هایی ارائه می‌دهد؛ گروهی که مقام‌های روسیه آشکارا با آن در ارتباط هستند. مفسران روس، چه حامی کرملین و چه مخالف آن، بر منافعی تاکید می‌کنند که روسیه از این درگیری به دست می‌آورد، از جمله افزایش قیمت نفت و درگیر شدن آمریکا در جنگ یمن، که توجه و منابع آن را از جنگ اوکراین منحرف می‌کند. هم‌زمان با دگرگونی صف‌بندی‌ها و ائتلاف‌ها در یمن، روسیه همچنان می‌کوشد نظر همه طرف‌ها را به خود جلب کند؛ تلاشی که در قالب بیانیه‌هایی با لحنی محتاطانه و نیز ارسال نشانه‌هایی محدود از حمایت دنبال می‌شود. این سیاست که مسکو از طریق آن می‌کوشد بی‌طرف به نظر برسد، ممکن است به روسیه کمک کند فارغ از این‌ که در نهایت کدام طرف دست بالا را پیدا کند، کانال‌های ارتباطی و نفوذ راهبردی"}, {"source": "BBC Persian", "title": "پشت شعار «یک ملت، دو دولت»؛ ترکیه و جمهوری آذربایجان بر سر چه چیزهایی اختلاف دارند؟", "link": "https://www.bbc.com/persian/articles/cw054e9jqnglo?at_medium=RSS&at_campaign=rss", "summary": "شعار «یک ملت، دو دولت» سال‌ها نماد نزدیکی کم‌نظیر ترکیه و جمهوری آذربایجان بوده است. اما اختلاف‌نظر بر سر ممنوعیت روسری در مدارس آذربایجان، روابط با اسرائیل و روند عادی‌سازی با ارمنستان، در ماه‌های اخیر نشانه‌هایی از فاصله گرفتن مواضع آنکارا و باکو را آشکار کرده است.", "date_str": "2026-10-18T23:12:32+00:00", "hash": "453a58b230d701c1", "title_fa": "پشت شعار «یک ملت، دو دولت»؛ ترکیه و جمهوری آذربایجان بر سر چه چیزهایی اختلاف دارند؟", "summary_fa": "شعار «یک ملت، دو دولت» سال‌ها نماد نزدیکی کم‌نظیر ترکیه و جمهوری آذربایجان بوده است. اما اختلاف‌نظر بر سر ممنوعیت روسری در مدارس آذربایجان، روابط با اسرائیل و روند عادی‌سازی با ارمنستان، در ماه‌های اخیر نشانه‌هایی از فاصله گرفتن مواضع آنکارا و باکو را آشکار کرده است. اما در ماه‌های اخیر، روابط دو کشور به دلیل مقرراتی که جمهوری آذربایجان در مدارس ابتدایی و متوسطه درباره «ممنوعیت روسری» اعمال کرده و واکنش‌هایی که در آنکارا برانگیخته، دچار تنش شده است. مسئله اسرائیل و فلسطین و روند عادی‌سازی روابط با ارمنستان نیز از جمله موضوعات سیاست خارجی‌اند که دو کشور درباره آن‌ها رویکردهای متفاوتی دارند. هاکان فیدان، وزیر خارجه ترکیه، پس از دیدارهای ۱۵ اکتبر خود در باکو با الهام علی‌اف و جیحون بایراموف، وزیر خارجه جمهوری آذربایجان، که در جریان سفری برای شرکت در یک نشست بین‌المللی انجام شد، به خبرنگاران گفت پیوندها و برادری میان آنکارا و باکو خدشه‌ناپذیر است. فیدان تاکید کرد نباید اجازه داد روابط راهبردی دو کشور آسیب ببیند. او گفت ممکن است دو طرف گاهی درباره برخی مسائل رویکردهای متفاوتی داشته باشند، اما افزود: «ما ملتی کهن هستیم. مسائل خودمان را نیز در شان این پیشینه کهن و به شکلی که درخور ماست، می‌نشینیم و متمدنانه گفت‌وگو می‌کنیم.» کورشاد زورلو، معاون رئیس حزب عدالت و توسعه در امور جهان ترک، نیز با اشاره به امکان وجود اختلاف نظر گفت مسائل در «شورای خانوادگی» حل خواهند شد. دولت جمهوری آذربایجان تاکنون درباره روابط با ترکیه اظهارنظری نکرده است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. یکی از برجسته‌ترین موضوعاتی که فیدان و زورلو از آن به‌عنوان تفاوت در رویکردها یاد کرده‌اند، مسئله «سبک زندگی» است. جامع‌ترین و تندترین اظهارنظر درباره این موضوع را الهام علی‌اف در ۲ اکتبر در کنگره حزب آذربایجان نوین،"}, {"source": "BBC Persian", "title": "چرا آمریکایی‌ها با ساخت مراکز داده مخالف‌اند؟", "link": "https://www.bbc.com/persian/articles/cq62yd17pyjjo?at_medium=RSS&at_campaign=rss", "summary": "مراکز داده، زیرساخت اصلی اینترنت و هوش مصنوعی، تا همین اواخر کمتر در مرکز توجه افکار عمومی آمریکا قرار داشتند. اما گسترش سریع این تاسیسات عظیم و نگرانی‌ها درباره مصرف آب و انرژی، آلودگی و تاثیر آنها بر جوامع محلی، موجی از مخالفت عمومی ایجاد کرده است؛ موجی که اکنون به موضوعی سیاسی تبدیل شده و سیاستمداران آمریکایی را وادار کرده در قبال آن موضع بگیرند.", "date_str": "2026-10-18T20:16:32+00:00", "hash": "2d80461440d777a1", "title_fa": "چرا آمریکایی‌ها با ساخت مراکز داده مخالف‌اند؟", "summary_fa": "مراکز داده، زیرساخت اصلی اینترنت و هوش مصنوعی، تا همین اواخر کمتر در مرکز توجه افکار عمومی آمریکا قرار داشتند. اما گسترش سریع این تاسیسات عظیم و نگرانی‌ها درباره مصرف آب و انرژی، آلودگی و تاثیر آنها بر جوامع محلی، موجی از مخالفت عمومی ایجاد کرده است؛ موجی که اکنون به موضوعی سیاسی تبدیل شده و سیاستمداران آمریکایی را وادار کرده در قبال آن موضع بگیرند. یک سال پیش، یکی از سناتورهای باسابقه آمریکا چندان درباره مراکز داده (دیتا سنتر) فکر نمی‌کرد. اما حالا، به گفته یکی از مشاورانش، دائما با اعضای دفترش درباره تاثیر این مراکز جلسه برگزار می‌کند و روی تدوین طرحی قانونی کار می‌کند که هدفش مهار گسترش سریع چنین مراکزی در سراسر آمریکا است. یکی از مشاوران ارشد سیاست‌گذاری این سناتور دموکرات به بی‌بی‌سی گفت: «گاهی همین‌طور است؛ موضوعی ابتدا آرام و آهسته شروع می‌شود و بعد ناگهان شتاب می‌گیرد.» او به شرط ناشناس ماندن صحبت کرد، چون اجازه ندارد با رسانه‌ها در این زمینه حرف بزند. چرخش ۱۸۰ درجه‌ای توجه این سناتور تقریبا به‌طور کامل نتیجه موج فزاینده مخالفت‌های عمومی بود؛ موجی که سیاستمداران را در سراسر آمریکا وادار کرده برای عقب نماندن از آن دست‌به‌کار شوند. افکار عمومی به‌تدریج علیه گسترش مراکز داده موضع گرفته است؛ ساختمان‌های عظیم و انبارمانندی که توان پردازشی مورد نیاز برای فعالیت‌های اینترنتی را در خود جای می‌دهند. مراکز داده با ردیف‌های متعدد تراشه‌های رایانه‌ای، که گاهی ارتفاع تجهیزات آن‌ها به بیش از دو متر می‌رسد، دیگر فقط زیرساخت اینترنت نیستند. آن‌ها اکنون به نمود فیزیکی رشد سریع و انفجاری فناوری هوش مصنوعی و نگرانی‌های مختلفی تبدیل شده‌اند که مردم با آن مرتبط می‌دانند. آنجلیتا سوریانو، ساکن ایندیانا، به بی‌بی‌سی گفت: «نمی‌خواهم موش آزمایشگاهی این ماجرا باشم.» درست روبه‌روی خانه او، آمازون در حال ساخت یک مرکز داده جدید است. پس از تکمیل، این مجموعه متشکل از ۲۶ ساختمان"}, {"source": "Iran International", "title": "مس شهر بابک ۰-۳ پرسپولیس؛ صدرنشینی پرسپولیس با پیروزی بر قعرنشین لیگ برتر", "link": "https://www.iranintl.com/202610194771", "summary": "تیم فوتبال پرسپولیس در هفته نهم لیگ برتر فوتبال ایران با نتیجه ۳-۰ مس شهر بابک را شکست داد. بیفوما، مجیدی عیدی و محمدحسین صادقی برای تیم مهدی تارتار در این بازی گلزنی کردند.", "date_str": "2026-10-19T امی در حملات هوایی اسرائیل و آمریکا، اکنون بخش بزرگی از خاک ایران در برابر حملات آینده بی‌دفاع است. به گفته وزیر خارجه آمریکا، جمهوری اسلامی در صدد آن بود که با ساخت «ده‌ها هزار موشک و پهپاد برای خود سپری متعارف ایجاد کند» و سپس در لوای این سپر به تولید سلاح اتمی بپردازد. اما اکنون، به گفته او، در حالی که نیروی هوایی و دریایی و پدافند ایران نابود شده، دیگر ایجاد این سپر برای حکومت ایران ممکن نیست. روبیو گفت: «آنها دیگر نمی‌توانند پشت سپری متعارف پنهان شوند و به ساخت سلاح هسته‌ای دست بزنند.» وزیر خارجه آمریکا در ادامه هدف دوم از ورود آمریکا به جنگ را به تنگه هرمز مربوط می‌داند و می‌گوید که تهران «تلاش می‌کند که کنترل تنگه را به دست بگیرد، ولی کنترل تنگه را از دست داده‌اند. به طور متوسط در ده روز گذشته حدود ۱۳ تا ۱۴ میلیون بشکه نفت از تنگه عبور کرده است». روبیو در ادامه اشاره می‌کند که نیروی دریایی آمریکا کار دفاع و اسکورت نفتکش‌ها را انجام می‌دهد و تأکید می‌کند: «تنها کشوری در جهان که حتی یک بشکه نفت هم نمی‌‌تواند از تنگه هرمز عبور دهد ایران است.» مارکو روبیو در ادامه می‌گوید: «من"}, {"source": "Radio Farda", "title": "رونق هوش مصنوعی و افزایش صادرات، رشد اقتصاد چین را اندکی فراتر از انتظار بالا برد", "link": "https://www.radiofarda.com/a/china-s-economic-growth-picks-up-as-exports-boom-consumers-balk/33879258.html", "summary": "بر اساس آمار رسمی منتشرشده در روز دوشنبه ۲۷ مهر، اقتصاد چین در فاصله ژوئیه تا سپتامبر ۴.۵ درصد رشد کرد، در حالی که اقتصاددانان رشد ۴.۴ درصدی را پیش‌بینی کرده بودند.", "date_str": "2026-10-19T08:16:33+00:00", "hash": "f79dbd6e5d686d2a", "title_fa": "رونق هوش مصنوعی و افزایش صادرات، رشد اقتصاد چین را اندکی فراتر از انتظار بالا برد", "summary_fa": "بر اساس آمار رسمی منتشرشده در روز دوشنبه ۲۷ مهر، اقتصاد چین در فاصله ژوئیه تا سپتامبر ۴.۵ درصد رشد کرد، در حالی که اقتصاددانان رشد ۴.۴ درصدی را پیش‌بینی کرده بودند. رشد اقتصادی چین در سه‌ماهه سوم سال جاری میلادی، به پشتوانه افزایش صادرات محصولات مرتبط با هوش مصنوعی، اندکی فراتر از پیش‌بینی‌ها رفت و از پایین‌ترین سطح خود در سه سال گذشته فاصله گرفت. اقتصاد چین در سه‌ماهه سوم سال جاری میلادی اندکی بیش از پیش‌بینی‌ها رشد کرد، اما ادامه ضعف مصرف داخلی و بحران بخش مسکن، همراه با افزایش هزینه‌های انرژی ناشی از جنگ ایران، همچنان بر دومین اقتصاد بزرگ جهان فشار وارد می‌کند. به نوشته خبرگزاری‌ها، افزایش تقاضای جهانی برای تراشه‌های رایانه‌ای و تجهیزات مراکز داده مرتبط با هوش مصنوعی، به رشد صادرات چین کمک کرده و بخشی از فشار ناشی از ضعف مصرف داخلی را جبران کرده است. با این حال، تنش‌های تجاری جهانی و تردیدها درباره آینده سرمایه‌گذاری در هوش مصنوعی همچنان چشم‌انداز دومین اقتصاد بزرگ جهان را با ابهام روبه‌رو کرده است. در همین حال، چین روز جمعه ۲۴ مهر پیشنهاد کرد صادرات ۲۳ فناوری مرتبط با هوش مصنوعی، از جمله مدل‌های هوش مصنوعی، عامل‌های هوشمند و خوشه‌های پردازشی، تحت محدودیت قرار گیرد. به گزارش رویترز، این اقدام تازه‌ترین تلاش پکن برای جلوگیری از انتقال فناوری‌هایی است که برای امنیت ملی و رقابت راهبردی با آمریکا حیاتی می‌داند. بر اساس اعلام وزارت بازرگانی چین، این محدودیت‌ها شامل انتقال مدل‌های هوش مصنوعی دارای فناوری‌های حساس به خارج از کشور می‌شود، اما دسترسی از طریق وب‌سایت‌ها، برنامه‌های کاربردی و خدمات اینترنتی را در بر نمی‌گیرد. این تمایز به شرکت‌هایی مانند دیپ‌سیک و علی‌بابا اجازه می‌دهد همچنان در بازارهای جهانی فعالیت کنند، در حالی که دولت چین نظارت بیشتری بر انتقال فناوری‌های پیشرفته خواهد داشت. این تصمیم در شرایطی مطرح شده که مدل‌های هوش مصنوعی چینی"}, {"source": "Radio Farda", "title": "انتقاد مکرون از خشونت «افسارگسیخته» در جریان اعتراضات؛ بازداشت ۲۴۰۰ نفر در یک روز", "link": "https://www.radiofarda.com/a/macron-denounces-unbridled-violence-as-france-hit-by-new-clashes/33879198.html", "summary": "همزمان با ادامه اعتراضات در روز یک‌شنبه، ۲۶ مهرماه، در پاریس، امانوئل مکرون، رئیس جمهور فرانسه، در پیامی تلویزیونی به‌شدت از «خشونت افسارگسیخته» در خیابان‌ها انتقاد کرد.", "date_str": "2026-10-19T05:52:49+00:00", "hash": "532a5f4f61a7d6ab", "title_fa": "انتقاد مکرون از خشونت «افسارگسیخته» در جریان اعتراضات؛ بازداشت ۲۴۰۰ نفر در یک روز", "summary_fa": "همزمان با ادامه اعتراضات در روز یک‌شنبه، ۲۶ مهرماه، در پاریس، امانوئل مکرون، رئیس جمهور فرانسه، در پیامی تلویزیونی به‌شدت از «خشونت افسارگسیخته» در خیابان‌ها انتقاد کرد. به گزارش خبرگزاری فرانسه، تنها در روز شنبه نزدیک به ۲۴۰۰ نفر بازداشت شده و در سوی مقابل تقریبا هزار نیروی پلیس و ژاندارم در خشونت‌ها زخمی شدند. جراحت بعضی از این نیروها «جدی» توصیف شده است. ساعاتی پس از پیام رئیس جمهور، لوران نونِز، وزیر کشور فرانسه، در روز دوشنبه، ۲۷ مهر، اذعان کرد که پلیس در بعضی از شهرها کنترل اوضاع را از دست داده است. نونز توضیح داده است که عدم پیش‌بینی در این باره باعث شده که پلیس برای مقابله با خرابکاران آمادگی نداشته باشد. او همچنین خبر داد که به همین دلیل استعفای خود را تقدیم کرده است. پیشتر احزاب اپوزیسیون و سیاستمداران از چپ و راست به دلیل غافلگیر شدن دولت با اعتراضات خواستار استعفای نونز شده بودند. با این حال امانوئل مکرون، رئیس جمهور، استعفای او را نپذیرفت. مکرون در عین حال از نونز خواسته است برای مقابله با غارتگران «به‌سرعت روش‌های جدید به کار گیرد». در پی هفته‌ها اعتراض دانش‌آموزی به وضعیت مدارس، اعتراض‌های روز شنبه با فراخوان فعالان جنبش جلیقه‌زردها و همراهی دانش‌آموزان، اتحادیه‌های کارگری و گروه‌های اجتماعی برگزار شد. خبرگزاری فرانسه به نقل از وزارت کشور فرانسه نوشته است که ۵۵۰ هزار نفر در این تظاهرات شرکت داشته‌اند؛ اما یکی از اتحادیه‌های دعوت‌کننده رقم ۸۰۰ هزار نفر را اعلام کرده است. سباستین لوکورنو، نخست‌وزیر فرانسه، نیز خشونت‌های روز شنبه را «با شدتی بی‌سابقه» توصیف کرد و گفت آتش‌زدن، غارت و حمله جایی در جمهوری ندارد. آن طور که شبکه جهانی بی‌بی‌سی گزارش کرده، تخمین زده شده است که در آخر هفته گذشته دست‌کم ۱۵۰۰ مغازه و فروشگاه و محل کسب و کار تخریب و غارت شده است. در پی این خشونت‌ها و خرابی‌ها"}, {"source": "Radio Farda", "title": "شورای همکاری خلیج فارس خواستار تروریستی شناخته شدن حوثی‌ها شد", "link": "https://www.radiofarda.com/a/gcc-condemns-houthi-attacks-on-saudi-arabia-holds-iran-responsible-for-strikes-on-gulf/33879191.html", "summary": "شورای همکاری خلیج فارس خواستار قرار گرفتن حوثی‌های یمن در فهرست گروه‌های تروریستی شد و تأکید کرد که هرگونه توافق با جمهوری اسلامی باید برنامه هسته‌ای ایران را نیز در بر بگیرد.", "date_str": "2026-10-19T05:50:11+00:00", "hash": "22df108bf99bce58", "title_fa": "شورای همکاری خلیج فارس خواستار تروریستی شناخته شدن حوثی‌ها شد", "summary_fa": "شورای همکاری خلیج فارس خواستار قرار گرفتن حوثی‌های یمن در فهرست گروه‌های تروریستی شد و تأکید کرد که هرگونه توافق با جمهوری اسلامی باید برنامه هسته‌ای ایران را نیز در بر بگیرد. این درخواست‌ها در بیانیه پایانی صدوشصت‌وهشتمین نشست وزیران خارجه شورای همکاری خلیج فارس مطرح شده که روز یکشنبه ۲۶ مهر به ریاست عبداللطیف بن راشد الزیانی، وزیر خارجه بحرین، در منامه برگزار شد. وزیران خارجه کشورهای عضو این شورا در بیانیه خود حملات اخیر حوثی‌ها به عربستان سعودی، از جمله حملات به فرودگاه‌های غیرنظامی، تأسیسات حیاتی و آنچه «هدف قرار گرفتن حرمین شریفین» و مناطق اطراف آن خواندند، به‌شدت محکوم کردند. آنها با اعلام همبستگی کامل با عربستان تأکید کردند که بر اساس توافق‌نامه دفاع مشترک شورای همکاری، هرگونه حمله به یکی از کشورهای عضو، حمله به تمامی اعضا محسوب می‌شود و این کشورها بر اساس ماده ۵۱ منشور سازمان ملل از حق دفاع فردی و جمعی برخوردارند. این شورا همچنین از سازمان ملل و جامعه بین‌المللی خواست تحریم تسلیحاتی حوثی‌ها را مطابق قطعنامه‌های شورای امنیت، از جمله قطعنامه‌های ۲۲۱۶ و ۲۷۲۲، به‌طور کامل اجرا کنند و مانع از رسیدن موشک و پهپاد به این گروه شوند. جنگ بیش از یک دهه‌ای میان حوثی‌ها و ائتلاف به رهبری عربستان که از دولت به‌رسمیت‌شناخته‌شده یمن حمایت می‌کند، در ماه ژوئیه بار دیگر شدت گرفت. حوثی‌ها در ماه سپتامبر کنترل بخش‌هایی از سواحل یمن در دریای سرخ را به دست گرفتند و از آن زمان حملات خود به اهدافی در عربستان، از جمله شرکت نفتی دولتی آرامکو و فرودگاه بین‌المللی ریاض را افزایش داده‌اند. در حمله هفته گذشته به فرودگاه ریاض، ۱۳ نفر کشته شدند. در بخش دیگری از بیانیه تازه، وزیران خارجه کشورهای عرب حاشیه خلیج فارس، جمهوری اسلامی را مسئول حملات موشکی و پهپادی به کشورهای عضو شورا و اردن دانستند و خواستار توقف فوری و بدون قیدوشرط"}, {"source": "Radio Farda", "title": "حمایت ترامپ از نتانیاهو در انتخابات اسرائیل و هشدار به ایران؛ تهران واکنش نشان داد", "link": "https://www.radiofarda.com/a/trump-endorses-netanyahu-in-israel-s-upcoming-election/33878900.html", "summary": "دونالد ترامپ، رئیس‌جمهوری آمریکا، روز یکشنبه حمایت کامل خود را از بنیامین نتانیاهو، نخست‌وزیر اسرائیل، در آستانه انتخابات پارلمانی این کشور اعلام کرد.", "date_str": "2026-10-18T15:45:15+00:00", "hash": "09401e8eed3a4bca", "title_fa": "حمایت ترامپ از نتانیاهو در انتخابات اسرائیل و هشدار به ایران؛ تهران واکنش نشان داد", "summary_fa": "دونالد ترامپ، رئیس‌جمهوری آمریکا، روز یکشنبه حمایت کامل خود را از بنیامین نتانیاهو، نخست‌وزیر اسرائیل، در آستانه انتخابات پارلمانی این کشور اعلام کرد. دونالد ترامپ، رئیس‌جمهور آمریکا، روز یکشنبه ۲۶ مهر «حمایت کامل» خود را از بنیامین نتانیاهو، نخست‌وزیر اسرائیل، در آستانه انتخابات پارلمانی این کشور اعلام کرد. ترامپ در پیامی در شبکه اجتماعی تروث سوشال خطاب به مردم اسرائیل نوشت: «بی‌بی نتانیاهو در مواجهه با مخالفت‌های گسترده، از جمله مخالفت‌هایی در داخل خود اسرائیل، قدرتمند، شجاع و درخشان بوده است.» رئیس‌جمهور آمریکا در ادامه افزود: «این همان نوع شریکی است که ایالات متحده از اسرائیل، کشوری که آمریکا اقدامات بسیاری برای آن انجام داده است، انتظار دارد. لطفاً این نامه را به‌منزله حمایت کامل و همه‌جانبه من از بی‌بی نتانیاهو در رقابت پیش روی او برای انتخاب مجدد به‌عنوان نخست‌وزیر اسرائیل تلقی کنید.» او همچنین به جنگ مشترک آمریکا و اسرائیل با ایران اشاره کرد و نوشت که نتانیاهو «همچون جنگجویی بزرگ عمل کرده و در مقابله با جمهوری اسلامی ایران، شریک حتی بزرگ‌تری برای صلح بوده است؛ جمهوری اسلامی که ۵۱ سال است شعار می‌دهد: مرگ بر اسرائیل، مرگ بر آمریکا! ما شیطان کوچک و شیطان بزرگ را نابود خواهیم کرد. » دونالد ترامپ با اشاره به «نابودی» نظامی و مالی ایران بر اثر اقدامات دولت خود، مقام‌های جمهوری اسلامی را تهدید کرد که «اگر به‌سرعت رفتار خود را تغییر ندهند، به‌زودی کار را تمام خواهیم کرد». انتخابات پارلمانی اسرائیل قرار است ۲۷ اکتبر (۵ آبان) برگزار شود. این نخستین انتخابات سراسری این کشور پس از حمله حماس در ۷ اکتبر ۲۰۲۳ است؛ حمله‌ای که اسرائیل را دستخوش تحولات گسترده کرد و خاورمیانه را وارد دوره‌ای از تنش و درگیری کرد. این کشور از تابستان سال گذشته دو بار با ایران وارد جنگ شد؛ یک بار به تنهایی در خرداد و تیر سال گذشته که با حمله آمریکا"}],

های ایالات متحده قوانینی را اجرا کرده‌اند که در اختیار داشتن مواد سوء استفاده جنسی از کودکان توسط هوش مصنوعی جرم‌انگاری می‌کند. با این حال، بر اساس گزارشی از گروه حامی دیجیتالی پروژه شفافیت فناوری (TTP) که به طور انحصاری با گاردین به اشتراک گذاشته شد و روز دوشنبه منتشر شد، علیرغم مقرراتی که آنها را منع می کند، برنامه های برهنگی همچنان در حال گسترش هستند و همچنان برای نوجوانان قابل دسترسی هستند. محققان TTP چهار حساب آزمایشی، دو حساب اپل و دو حساب Google ایجاد کردند که نشان می دهد دارندگان حساب 13 ساله بودند. آن‌ها با استفاده از عباراتی مانند «تولیدکننده ویدیوی هوش مصنوعی» یا «هوش مصنوعی بزرگسالان» به دنبال برنامه‌های ویرایش تصویر یا تعویض چهره بودند. با استفاده از این حساب‌ها برای یک نوجوان 13 ساله، محققان توانستند 135 اپلیکیشن را با ویژگی‌هایی دانلود کنند که به آن‌ها امکان می‌دهد لباس‌های افراد را از تن درآورند یا صورت‌هایشان را با بدن‌های برهنه عوض کنند. محققان در آزمایش های"}, {"source": "The Guardian AI", "title": "Calls to strengthen workplace privacy in Australia as employers turn to AI to track staff", "link": "https://www.theguardian.com/technology/2026/oct/20/workplace-privacy-concerns-employers-use-ai-to-monitor-staff", "summary": "Monitoring tools common in a range of workplaces, including factories, office jobs, delivery work and in retail – often without employees being informed Get our breaking news email , free app or daily news podcast Employers are increasingly using technology, from CCTV to keystroke monitoring, to track workers’ moves and it is being accelerated by the use of AI, the Human Technology Institute has warned. Examples provided to Guardian Australia by the institute include a fast-food restaurant using surveillance cameras to stop workers using their phones, and AI tracking leading to a cashier warned over making a mistake once every 533 scans. Continue reading...", "date_str": "2026-10-19T14:00:03+00:00", "hash": "93be29f2af19c22f", "title_fa": "درخواست برای تقویت حریم خصوصی محل کار در استرالیا، زیرا کارفرمایان برای ردیابی کارکنان به هوش مصنوعی روی می آورند", "summary_fa": "ابزارهای نظارتی رایج در طیف وسیعی از محل‌های کاری، از جمله کارخانه‌ها، مشاغل اداری، کار تحویل و خرده‌فروشی - اغلب بدون اطلاع کارکنان، ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید کارفرمایان به طور فزاینده‌ای از فناوری، از دوربین مدار بسته گرفته تا نظارت بر ضربه زدن به کلید، برای ردیابی حرکات کارگران استفاده می‌کنند و با استفاده از هوش مصنوعی، فن‌آوری جنگ‌افزار بشر، سرعت آن در حال افزایش است. نمونه هایی که توسط این موسسه به گاردین استرالیا ارائه شده است شامل یک رستوران فست فود با استفاده از دوربین های نظارتی برای جلوگیری از استفاده کارگران از تلفن هایشان و ردیابی هوش مصنوعی است که منجر به هشدار به صندوقدار در مورد اشتباه کردن یک بار در هر 533 اسکن می شود. به خواندن ادامه دهید... در گزارشی که روز سه‌شنبه منتشر شد، مؤسسه دانشگاه فناوری سیدنی گفت ابزارهای نظارت بر محل کار به طور فزاینده‌ای در طیف وسیعی از محل‌های کار، از جمله در کارخانه‌ها، مشاغل اداری، کارهای تحویل و خرده‌فروشی رایج است - اغلب بدون اینکه کارمندان از نظارت آگاه باشند. ابزارها عبارتند از دوربین مدار بسته، مانیتورینگ کشیدن کارت، نظارت بر ضربه زدن به کلید و ردیابی پیام های فوری در محل کار. این گزارش تیم های مایکروسافت را به عنوان یک پلت فرم مشترک برای نظارت بر محل کار برجسته می کند. این شرکت در اوایل سال جاری ابزاری را ارائه کرد که موقعیت مکانی یک کارگر را به‌طور خودکار به‌روزرسانی می‌کند تا نشان دهد وقتی به وای‌فای محل کار وصل می‌شوند، در دفتر هستند. در طول مشاوره به محققان این موسسه گفته شد که در یکی از زنجیره‌های فست فود بزرگ ناشناس، کارمندان جوان نگران بودند که کارفرمای آنها دوربین‌هایی را در اتاق‌های تعویض لباس قرار داده است تا مطمئن شود که کارکنان در محل کارشان با تلفن"}, {"source": "The Guardian AI", "title": "AI firm Anthropic to commit 5% of shares to fund for ‘public good’", "link": "https://www.theguardian.com/technology/2026/oct/19/ai-firm-anthropic-to-commit-shares-to-fund-for-public-good", "summary": "The $48bn giveaway comes amid concerns about the tech and as the company prepares for a stock market listing Anthropic has said it will commit 5% of its shares to a fund for the “public good”, as the AI developer behind the Claude chatbot seeks to bolster its appeal before its stock market listing. The company announced it would commit the shares, worth around $48bn (£36bn) at its latest valuation in May, subject to shareholder approval. It will add a further 2% of its stock to the fund for every 50% increase in its value above an undisclosed baseline. Continue reading...", "date_str": "2026-10-19T12:51:04+00:00", "hash": "774eab0f2b487a0f", "title_fa": "شرکت هوش مصنوعی Anthropic 5% از سهام خود را برای تامین مالی برای \"خیر عمومی\" متعهد می کند", "summary_fa": "این هدیه 48 میلیارد دلاری در بحبوحه نگرانی‌ها در مورد این فناوری صورت می‌گیرد و در حالی که شرکت برای عرضه در بورس آماده می‌شود، Anthropic اعلام کرده است که 5 درصد از سهام خود را به صندوقی برای \"خیر عمومی\" اختصاص خواهد داد، زیرا توسعه‌دهنده هوش مصنوعی پشت ربات چت کلود به دنبال تقویت جذابیت آن قبل از عرضه در بازار سهام است. این شرکت اعلام کرد که این سهام را به ارزش حدود 48 میلیارد دلار (36 میلیارد پوند) در آخرین ارزیابی خود در ماه می، مشروط به تایید سهامداران، متعهد خواهد کرد. به ازای هر 50 درصد افزایش در ارزش آن بالاتر از یک خط پایه نامشخص، 2 درصد دیگر از سهام خود را به صندوق اضافه می کند. به خواندن ادامه دهید... این شرکت گفت، این صندوق به آنتروپیک اجازه می‌دهد تا کمک‌های مالی زیادی به سازمان‌های غیرانتفاعی سنتی یا توزیع‌های مستقیم به جمعیت‌های خاص را بررسی کند. این حرکت در بحبوحه نگرانی فزاینده عمومی در مورد هوش مصنوعی، از تهدید نیروی انسانی گرفته تا تأثیر آن بر محیط زیست و تأثیر آن بر رفتارهای اجتماعی صورت می گیرد. آنتروپیک در یک وبلاگ نوشت: «هوش مصنوعی ممکن است ارزش اقتصادی زیادی ایجاد کند، اما همچنین می‌تواند برای بسیاری از کارگران بی‌ثباتی ایجاد کند. این موسسه گفت که در حالی که قبلاً 200 میلیون دلار برای رسیدگی به این موضوع متعهد شده بود، \"با توجه به سرعت پیشرفت هوش مصنوعی، ممکن است رویکردهای جسورانه‌تری مورد نیاز باشد. صندوق تطبیق پذیری برای پیگیری آنها را خواهد داشت.\" این شرکت که در حال آماده شدن برای عرضه در بازار سهام است، خواستار کاهش سرعت توسعه سرسام آور هوش مصنوعی شده است، هشداری که بعداً توسط رقبایی مانند OpenAI تکرار شد. ارزش آنتروپیک در ماه مه 965 میلیارد دلار بود که در یک دور مالی 65 میلیارد دلار جمع آوری"}, {"source": "The Guardian AI", "title": "Kylie Minogue songs already used to train AI as tech firms ‘strong-arm’ Australian government, music body warns", "link": "https://www.theguardian.com/music/2026/oct/19/australia-music-global-copywright-outlier-ai-music-body-warnsns", "summary": "Of the dozens of countries approached to water down their laws, Australia appears to be the only one considering it, publishers’ group says Get our new political email , free app or daily news podcast AI has already been trained on the works of Australian artists including Kylie Minogue and Nick Cave without compensation, the peak global body for music rights has claimed, as the Australian government has been warned against giving in to “strong-arming” from tech companies seeking to weaken copyright law. The International Confederation of Music Publishers (ICMP) – which represents Sony, Warner and Universal as well as thousands of independent publishers on six continents – has warned that of the dozens of countries approached to water down copyright laws, Australia appears to be the only to consider doing so. Continue reading...", "date_str": "2026-10-19T00:57:46+00:00", "hash": "5463da5673a61ca4", "title_fa": "سازمان موسیقی هشدار داد که آهنگ‌های کایلی مینوگ قبلاً برای آموزش هوش مصنوعی به‌عنوان شرکت‌های فناوری «بازوی قوی» دولت استرالیا استفاده می‌شد.", "summary_fa": "گروه ناشران می‌گویند از میان ده‌ها کشوری که برای کاهش قوانین خود به آن‌ها نزدیک شده‌اند، به نظر می‌رسد استرالیا تنها کشوری است که این موضوع را مد نظر قرار داده است. تضعیف قانون کپی رایت کنفدراسیون بین‌المللی ناشران موسیقی (ICMP) - که نماینده سونی، وارنر و یونیورسال و همچنین هزاران ناشر مستقل در شش قاره جهان است - هشدار داده است که از میان ده‌ها کشوری که قوانین کپی رایت را کاهش می‌دهند، به نظر می‌رسد استرالیا تنها کشوری است که این کار را انجام می‌دهد. به خواندن ادامه دهید... جان فیلان، مدیر عامل ICMP، به گاردین استرالیا گفت که شرکت‌های هوش مصنوعی از سیاستگذاران می‌خواهند تا «سرقت را مشروعیت بخشند». آنها در تلاشند تا سیاستگذاران استرالیایی را قویاً تقویت کنند که اگر شما این کار را نکنید، ما سرمایه گذاری نخواهیم کرد. در ماه جولای، آنتونی آلبانیز گفت که اگر هنرمندان کنترلی در مورد استفاده از آثارشان برای ساخت و آموزش هوش مصنوعی نداشته باشند و برای استفاده از آن چه پولی دریافت می کنند، «دزدی» خواهد بود. موسیقی، فیلم، رسانه و سازمان‌های خبری ابراز نگرانی کرده‌اند که دولت توسط شرکت‌های فناوری جهانی پشت درهای بسته لابی می‌شود تا قوانین کپی رایت استرالیا را برای کمک به آموزش مدل‌های هوش مصنوعی، بدون پرداخت خسارت به بخش‌های خلاق، تضعیف کند. اما اعضای دولت و اپوزیسیون کمیته هوش مصنوعی پارلمانی به نظر می رسد این هفته دوباره این موضوع را بررسی کرده و وضعیت فعلی را یک بن بست توصیف کردند."}, {"source": "Medium AI", "title": "Evals and How they differ from Tests", "link": "https://err0rgod.medium.com/evals-and-how-they-differ-from-tests-3e412a9c8f67?source=rss------artificial_intelligence-5", "summary": "If you&#x2019;ve built anything with LLMs, you&#x2019;ve probably hit this moment: your code passes every test, yet the product still gives bad answers&#x2026; Continue reading on Medium »", "date_str": "2026-10-19T14:17:11+00:00", "hash": "21141091bb1b5594", "title_fa": "ارزیابی ها و تفاوت آنها با تست ها", "summary_fa": "اگر چیزی با LLM ساخته‌اید، احتمالاً به این لحظه رسیده‌اید: کد شما در هر آزمونی رد می‌شود، با این حال محصول هنوز پاسخ‌های بدی می‌دهد… ادامه خواندن در Medium »"}, {"source": "Medium AI", "title": "Why Memoket-KITE Deserves a Closer Look in AI Memory", "link": "https://medium.com/@huilongan/why-memoket-kite-deserves-a-closer-look-in-ai-memory-ca9f163b104f?source=rss------artificial_intelligence-5", "summary": "From Mem0 and Zep to Supermemory, EverMemOS, and MemOS: the case for inspectable, evidence-backed recall. Continue reading on Medium »", "date_str": "2026-10-19T14:16:35+00:00", "ha ا عوض کرده باشد، اما روی صحنه، پنج نفری که باقی مانده‌اند شبیه دوستانی به نظر می‌رسند که اتفاقاً یکی از مشهورترین شرکت‌های دره را اداره می‌کنند. بازیکنان گاهی اوقات تغییر می‌کنند. من سه سال پیش با چهار نفر از شرکای بنچمارک صحبت کردم و سه نفر از آن افراد دیگر در شرکت نیستند. تعهدات سرمایه نیز تغییر کرده است. در تابستان امسال، بنچمارک دو میلیارد دلار در دو صندوق اعلام کرد و این دومین بار در تاریخ 31 ساله خود است که از تولید یک وسیله نقلیه بسیار کوچکتر منحرف شده است. اما در TechCrunch Disrupt این هفته، پنج شریک این شرکت سرمایه‌گذاری به طور متقاعدکننده‌ای یک تیم نزدیک به هم را به تصویر کشیدند که نمی‌خواهند پدال را روی فلز بگذارند، حتی اگر بسیاری از رقبایشان دقیقاً این کار را انجام می‌دهند. جهان ممکن است در حال افزایش سرعت باشد، اما آنها با سرعتی سرمایه گذاری می کنند که معیار همیشه داشته است: فقط دو یا سه شرط جدید در سال برای هر شریک. جهان غرق در اطلاعات است، با این حال جلسات شریک روز دوشنبه آنها هنوز هیچ برنامه ای ندارد. و در حالی که شاخص‌های اقتصادی به مشکلات پیش رو اشاره می‌کنند، به نظر نمی‌رسند که خیلی آزاردهنده باشند و بسیاری از علائم هشداردهنده را محصول هیستری ایکس می‌دانند. این چیزی است که پنج شریک اصلی بنچمارک که روی صحنه ما جمع شده بودند، در نمایش می گفتند. برخی از نظرات زیر برای طولانی بودن و وضوح ویرایش شده است. می توانید مصاحبه کامل را در انتهای مقاله مشاهده کنید. معیار از برخی جهات، از جمله یک صندوق اصلی بزرگتر و یک صندوق رشد جدید، تکامل یافته است. چگونه در مورد تطبیق بدون از دست دادن آنچه شما را معیار می کند"}, {"source": "TechCrunch Main", "title": "Everyone’s watching the Elizabeth Holmes documentary ‘You Can See Everything’", "link": "https://techcrunch.com/2026/10/18/everyones-watching-the-elizabeth-holmes-documentary-you-can-see-everything/", "summary": "\"You Can See Everything\" is having the second biggest opening weekend ever for a documentary film.", "date_str": "2026-10-18T19:03:38+00:00", "hash": "08aa77a65f6a1ea0", "title_fa": "همه در حال تماشای مستند الیزابت هلمز \"شما می توانید همه چیز را ببینید\" هستند", "summary_fa": "\"شما می توانید همه چیز را ببینید\" دومین آخر هفته افتتاحیه بزرگ یک فیلم مستند را در تاریخ خود دارد. «شما می‌توانید همه چیز را ببینید» در حال حاضر با 15 میلیون دلار افتتاحیه آخر هفته (بر اساس برآوردهای یکشنبه) باکس آفیس پرطرفدار شده است. این دومین آخر هفته افتتاحیه بزرگ یک فیلم مستند است. این فیلم تقریباً سه ساعته - که برای اولین بار ماه گذشته در یک نمایش محرمانه در جشنواره فیلم تلوراید فاش شد - فقط در 855 سینمای آخر هفته اکران می شود. (در مقابل، فیلم شماره یک آخر هفته، «جنگنده خیابانی» با 3575 نمایش در حال اکران است.) اما 2000 نمایش پرفروش گزارش شده بود و نقدها بسیار مثبت هستند. \"شما می توانید همه چیز را ببینید\" در حال حاضر دارای امتیاز 99٪ در دو بازی Rotten Tomatoes و Metacritic است. داستان ظهور و سقوط الیزابت هولمز - تأسیس استارتاپ آزمایش خون Theranos، جلب حمایت بسیاری از بزرگ‌ترین نام‌های سیلیکون ولی و سپس محکوم شدن در نهایت به 11 سال زندان برای کلاهبرداری از سرمایه‌گذاران - قبلاً در کتاب‌ها، پادکست‌ها، برنامه‌های تلویزیونی و مستندهای دیگر گفته شده است. اما فیلمسازان «شما می‌توانید همه چیز را ببینید» یک ماه قبل از اینکه او به زندان برود، دسترسی گسترده‌ای به هولمز و خانواده‌اش داده شد، و دخالت ناتان فیلدر، خالق «The Rehearsal» - که فیلم را با لنس اوپنهایم کارگردانی کرد - همه چیز را جذاب‌تر کرد. در حالی که من خودم فیلم را ندیده‌ام، حداقل می‌توانم مشکل پیدا کردن بلیت در منهتن را تأیید کنم: بخش زیادی از دیروز را صرف یافتن اکرانی برای امشب کردم، و دقیقاً یکی را با صندلی‌های موجود پیدا کردم که در ردیف اول نبود. (بله، البته که می روم.)"}, {"source": "TechCrunch Main", "title": "TechCrunch Mobility: Rivian’s next act", "link": "https://techcrunch.com/2026/10/18/techcrunch-mobility-rivians-next-act/", "summary": "Welcome back to TechCrunch Mobility, your hub for the future of transportation and now, more than ever, the role AI is playing in it.", "date_str": "2026-10-18T16:05:00+00:00", "hash": "65318586fe3f7c54", "title_fa": "TechCrunch Mobility: اقدام بعدی Rivian", "summary_fa": "به TechCrunch Mobility، مرکز شما برای آینده حمل و نقل و اکنون، بیش از هر زمان دیگری، نقشی که هوش مصنوعی در آن ایفا می کند، خوش آمدید. همانطور که مصاحبه TechCrunch Disrupt خود را با مدیر عامل و بنیانگذار Rivian RJ Scaringe به پایان می رساندم، مدام به یک سوال می چرخیدم: Scaringe می خواهد که Rivian به چه چیزی تبدیل شود؟ اگر به حرکت‌های ریویان در سال گذشته نگاه کنید، واضح است که Scaringe می‌خواهد این شرکت بسیار بیشتر از یک سازنده خودروهای برقی باشد. اما او نمی خواهد به طور کامل از آن ماموریت دور شود. Rivian بسیار بیشتر از چند سال پیش به صورت عمودی یکپارچه شده است. این شرکت مدل‌های هوش مصنوعی خود را برای تقویت دستیار درون خودروی خود توسعه داده است و در حال ساخت یک پشته رانندگی خودکار سرتاسر برای وسایل نقلیه مسافربری و ربات‌اکسی‌های آینده خود از طریق مشارکت با اوبر است. حتی در حال توسعه سیلیکون سفارشی، یک پردازنده 5 نانومتری با همکاری Arm و TSMC است. و سپس سرمایه گذاری 5.8 میلیارد دلاری فناوری مشترک آن با گروه فولکس واگن متمرکز بر معماری الکتریکی و نرم افزار است. جاه طلبی های Scaringe فراتر از Rivian نیز گسترش می یابد، اگرچه همیشه یک پیوند وجود دارد. او یک برنامه micromobility skunkworks ایجاد کرد که از آن زمان به یک استارتاپ به نام Also تبدیل شد. و او یک استارتاپ رباتیک صنعتی به نام Mind Robotics را تأسیس کرد که اکنون 31٪ متعلق به Rivian است و این خودروساز را به عنوان یک مشتری احتمالی به حساب می آورد. (Scaringe روی صحنه اعلام کرد که داگ فیلد، مدیر سابق فورد، اپل و تسلا به عنوان رئیس Mind Robotics استخدام شده است.) آرزوهای Scaringe به نمایش گذاشته شد زیرا او نه تنها از گسترش سرمایه گذاری مشترک با VW برای پوشش هوش"}, {"source": "Ars Technica", "title": "Review: Lanterns is a truly unique twist on the superhero genre", "link": "https://arstechnica.com/culture/2026/10/review-lanterns-is-a-truly-unique-twist-on-the-superhero-genre/", "summary": "The trailers for HBO's DC Universe series Lanterns teased a show that eschewed the usual superhero hijinks in favor of a gritty realism more in the vein of True Detectives or Slow Horses . Personally, I liked the change. My verdict: Ignore the review bombing ; it's wonderful. The season wrapped with an emotionally charged, almost elegaic finale that fully delivered on that initial promise. I've found the rebooted DC Universe films released thus far to be enjoyable but rather forgettable, even when the positives outweigh the negatives . But Lanterns is a shining beacon of what is possible when someone is allowed to get really creative within the genre. (Spoilers below, but no major reveals.) There are two primary storylines. The first takes place in 2016 with a mass shooting at a local football game in Rushville, Nebraska. Current Green Lantern Hal Jordan (Kyle Chandler) and his new trainee, John Stewart (Aaron Pierre), get involved in the investigation, to the annoyance of Sheriff Kerry Kane (Kelly Macdonald), who initially doesn't think the case has any extraterrestrial connection. She is soon proved wrong when the suspect (an alien) self-detonates. Hal's power ring controls the damage, but the mystery remains. Read full article Comments", "date_str": "2026-10-19T13:31:08+00:00", "hash": "82b50cbeabadcc6c", "title_fa": "نقد و بررسی: Lanterns یک چرخش واقعا منحصر به فرد در ژانر ابرقهرمانی است", "summary_fa": "تریلرهای سریال Lanterns از سری دنیای دی سی HBO نمایشی را به نمایش گذاشتند که از هیجن‌های ابرقهرمانی معمولی اجتناب می‌کرد و به نفع یک واقع‌گرایی تلخ بیشتر به سبک True Detectives یا Slow Horses بود. من شخصاً از این تغییر خوشم آمد. حکم من: بمباران بازبینی را نادیده بگیرید. فوق العاده است این فصل با یک پایان احساسی و تقریباً مرموز بسته شد که به طور کامل به آن وعده اولیه عمل کرد. به نظر من فیلم‌های ریبوت‌شده DC Universe که تاکنون منتشر شده‌اند، لذت‌بخش هستند، اما فراموش‌شونده هستند، حتی زمانی که نکات مثبت بیشتر از منفی‌ها باشد. اما «فانوس‌ها» چراغی درخشان از آنچه ممکن است زمانی است که کسی اجازه داشته باشد در این ژانر واقعاً خلاق باشد. (اسپویل در زیر، اما هیچ اصلی نشان نمی دهد.) دو خط داستانی اصلی وجود دارد. اولین مورد در سال 2016 با تیراندازی دسته جمعی در یک بازی فوتبال محلی در راشویل، نبراسکا رخ می دهد. فانوس سبز فعلی، هال جردن (کایل چندلر) و کارآموز جدیدش، جان استوارت (آرون پیر) درگیر تحقیقات می شوند تا کلانتر کری کین (کلی مکدونالد) که در ابتدا فکر نمی کند این پرونده ارتباطی فرازمینی داشته باشد، عصبانی شود. هنگامی که مظنون (یک بیگانه) خود منفجر می شود، به زودی ثابت می شود که اشتباه می کند. حلقه قدرت هال آسیب را کنترل می کند، اما راز باقی می ماند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید تریلرهای سری HBO دنیای DC Lanterns نمایشی را کنایه زدند که از هیجینک های ابرقهرمانی معمولی به نفع یک واقع گرایی خشن و ترسناک از حیله گرایانه S در حیطه های غیر اخلاقی پرهیز می کرد. من شخصاً از این تغییر خوشم آمد. حکم من: بمباران"}, {"source": "Ars Technica", "title": "DIY VR: How to build your own headset, and why you probably won't want to", "link": "https://arstechnica.com/gadgets/2026/10/diy-vr-how-to-build-your-own-headset-and-why-you-probably-wont-want-to/", "summary": "Virtual reality is in a bit of a weird place right now. After a lot of unfulfilled promise in the 1990s, it came back strong with the 2016 release of the Oculus Rift . For a while, it looked like VR, AR, XR, the metaverse, or whatever you wanted to call it, was going to be huge. Mark Zuckerberg was certainly convinced , and even Apple got in on the hype with its Vision Pro . But by then momentum for alternate realities of every acronym was already in steady decline, and it only dwindled from there. The rate of development of new headsets has slowed, with many companies (including Apple) scaling back or shelving their efforts. While new releases like the Steam Frame and Pimax Dream Air are still happening, many of the most interesting developments in the space these days are on the enthusiast front. That's right, DIY VR is a thing, and with a couple hundred dollars in components, plus many hours of your time, you too can enter the immersive world of virtual reality while also experiencing the highs and lows of soldering, firmware flashing, and 3D printing. I rode that rollercoaster myself and learned why this is still a decidedly niche movement. Read full article Comments", "date_str": "2026-10-19T12:33:34+00:00", "hash": "70c4c3f7cf846506", "title_fa": "DIY VR: چگونه هدست خود را بسازید و چرا احتمالاً نمی خواهید", "summary_fa": "واقعیت مجازی در حال حاضر در یک مکان عجیب و غریب قرار دارد. پس از بسیاری از وعده های محقق نشده در دهه 1990، با عرضه Oculus Rift در سال 2016، با قدرت بازگشت. برای مدتی به نظر می‌رسید که VR، AR، XR، متاورس یا هر چیزی که می‌خواهید آن را بنامید، بزرگ باشد. مارک زاکربرگ مطمئناً متقاعد شده بود و حتی اپل نیز با Vision Pro خود وارد تبلیغات شد. اما در آن زمان، شتاب برای واقعیت‌های متناوب هر نام اختصاری قبلاً در حال کاهش بود، و از آنجا فقط کاهش یافت. سرعت توسعه هدست‌های جدید کند شده است و بسیاری از شرکت‌ها (از جمله اپل) تلاش‌های خود را کاهش داده‌اند. در حالی که نسخه‌های جدیدی مانند Steam Frame و Pimax Dream Air هنوز در حال انجام هستند، بسیاری از جالب‌ترین تحولات این روزها در این فضا در مقابل علاقه‌مندان قرار دارند. درست است، DIY VR یک چیز است، و با چند صد دلار اجزاء، به علاوه ساعت‌های زیادی از وقت خود، شما نیز می‌توانید وارد دنیای غوطه‌وری واقعیت مجازی شوید و در عین حال اوج و فرود لحیم کاری، فلش کردن سیستم عامل و چاپ سه بعدی را نیز تجربه کنید. من خودم سوار آن ترن هوایی شدم و یاد گرفتم که چرا این حرکت هنوز یک حرکت مشخص است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش واقعیت مجازی در حال حاضر کمی عجیب است. پس از بسیاری از وعده های محقق نشده در دهه 1990، با عرضه Oculus Rift در سال 2016، با قدرت بازگشت. برای مدتی به نظر می‌رسید که VR، AR، XR، متاورس یا هر چیزی که می‌خواهید آن را بنامید، بزرگ باشد. مارک زاکربرگ مطمئناً متقاعد شده بود و حتی اپل"}, {"source": "Ars Technica", "title": "Stratospheric airship flew from US to Japan to test sky cell tower concept", "link": "https://arstechnica.com/gadgets/2026/10/trans-pacific-journey-tested-stratospheric-cell-tower-concept-in-japan/", "summary": "Nearly 100 years after the dirigible Graf Zeppelin made the first nonstop airship journey across the Pacific Ocean, another airship has successfully completed a round-trip flight from New Mexico to Japan and back. But the significance of this modern feat was less about the journey's length and more about its purpose: demonstrating how a lighter-than-air platform can act as a cell phone tower in the sky. The trans-Pacific flight that took place over a month between August and September 2026 was the most notable milestone yet for Sceye, a US aerospace company based near Albuquerque, New Mexico. Sceye has developed an uncrewed platform filled with helium for buoyancy and equipped with an electric-powered propeller for active propulsion, allowing it to resist most strong winds and keep hovering over the same location for long periods. The platform also uses top-mounted solar panels and onboard batteries to stay powered for stratospheric operations around the clock. “We can stay over an area of operation, and we do that in the stratosphere right around 60,000 feet, so we're twice as high as air traffic and we're above the jet stream, and yet 30 times closer than low-Earth orbit satellites,” Mikkel Frandsen , founder and CEO of Sceye, told Ars. “We can fly through day and night until the sun comes up the next morning and recharges the batteries, at which point we're still at the same altitude and still over the same area of operation.” Read full article Comments", "date_str": "2026-10-19T11:05:49+00:00", "hash": "ce88e55e1341286f", "title_fa": "کشتی هوایی استراتوسفر از ایالات متحده به ژاپن پرواز کرد تا مفهوم برج سلولی آسمان را آزمایش کند", "summary_fa": "نزدیک به 100 سال پس از انجام اولین سفر کشتی هوایی بدون توقف توسط کشتی هوایی Graf Zeppelin در اقیانوس آرام، کشتی هوایی دیگری پرواز رفت و برگشت از نیومکزیکو به ژاپن و برگشت را با موفقیت انجام داد. اما اهمیت این شاهکار مدرن کمتر به طول سفر و بیشتر در مورد هدف آن بود: نشان دادن اینکه چگونه یک پلت فرم سبک تر از هوا می تواند به عنوان یک برج تلفن همراه در آسمان عمل کند. پرواز اقیانوس آرام که بیش از یک ماه بین اوت و سپتامبر 2026 انجام شد، قابل توجه ترین نقطه عطف تاکنون برای Sceye، یک شرکت هوافضای ایالات متحده مستقر در نزدیکی آلبوکرکی، نیومکزیکو بود. Sceye یک پلت فرم بدون خدمه پر از هلیوم برای شناوری و مجهز به ملخ برقی برای رانش فعال ساخته است که به آن اجازه می دهد در برابر اکثر بادهای قوی مقاومت کند و برای مدت طولانی در همان مکان شناور بماند. این پلتفرم همچنین از پنل‌های خورشیدی و باتری‌های نصب‌شده در بالا استفاده می‌کند تا برای عملیات استراتوسفر در تمام ساعات شبانه‌روز انرژی خود را حفظ کند. میکل فراندسن، بنیانگذار و مدیر عامل Sceye، به Ars گفت: «ما می‌توانیم در یک منطقه عملیاتی بمانیم، و این کار را در استراتوسفر دقیقاً در حدود 60000 فوت انجام می‌دهیم، بنابراین دو برابر ترافیک هوایی و بالای جریان جت هستیم و در عین حال 30 برابر نزدیک‌تر از ماهواره‌های مدار پایین زمین هستیم». ما می‌توانیم در طول روز و شب پرواز کنیم تا زمانی که صبح روز بعد خورشید طلوع کند و باتری‌ها را شارژ کند، در این نقطه ما هنوز در همان ارتفاع و همچنان در همان منطقه عملیاتی هستیم. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید نزدیک به 100"}, {"source": "Ars Technica", "title": "Anthropic gives outside AI watchdog “employee-like” access", "link": "https://arstechnica.com/ai/2026/10/anthropic-gives-outside-ai-watchdog-employee-like-access/", "summary": "Anthropic has granted external evaluators “employee-like access” to assess the risks of its models, following through on a commitment to increase safeguards over concerns the technology could run catastrophically out of control. METR, a nonprofit that has worked with leading labs including OpenAI, Anthropic, Google and Meta, now has a team embedded in the Claude maker’s office with access to its hardware and internal systems. A greater role for third-party evaluators is among the main concrete steps the labs have proposed in response to rising concern about the dangers more capable AI systems could pose to the economy, cyber security and humanity at large. Read full article Comments", "date_str": "2026-10-18T16:25:19+00:00", "hash": "3a724729f890d712", "title_fa": "Anthropic دسترسی «کارمند مانند» به سازمان دیده بان هوش مصنوعی خارجی را می دهد", "summary_fa": "آنتروپیک به ارزیاب‌های خارجی «دسترسی مشابه کارمندان» را برای ارزیابی ریسک‌های مدل‌هایش اعطا کرده است و در پی تعهد به افزایش حفاظت‌ها در مورد نگرانی‌هایی که ممکن است فناوری به‌طور فاجعه‌باری از کنترل خارج شود. METR، یک سازمان غیرانتفاعی که با آزمایشگاه‌های پیشرو از جمله OpenAI، Anthropic، Google و Meta کار کرده است، اکنون تیمی با دسترسی به سخت‌افزار و سیستم‌های داخلی آن در دفتر سازنده کلود تعبیه شده است. نقش بیشتر ارزیاب‌های شخص ثالث از جمله گام‌های ملموسی است که آزمایشگاه‌ها در پاسخ به نگرانی‌های فزاینده در مورد خطراتی که سیستم‌های هوش مصنوعی توانمندتر می‌توانند برای اقتصاد، امنیت سایبری و بشریت در کل ایجاد کنند، پیشنهاد کرده‌اند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش Anthropic به ارزیاب های خارجی «دسترسی مشابه کارمندان» برای ارزیابی خطرات مدل های خود اعطا کرده است. داریو آمودی، مدیر اجرایی آنتروپیک، در ماه سپتامبر، زمانی که روسای OpenAI و SpaceX در حمایت از پیشنهاد او مبنی بر تعبیه حسابرسان خارجی در آزمایشگاه‌های پیشرو، حمایت کردند، به لحظات نادری از اتحاد با رقبای سرسخت سام آلتمن و ایلان ماسک دست یافت. اعلامیه روز پنجشنبه اولین گام برای اجرای این تعهدات است. پس از اینکه آلتمن گفت پیشنهادهای آمودی ایده خوبی بود، OpenAI هنوز برنامه‌ای برای جذب ارزیاب‌ها ارائه نکرده است. آنتروپیک روز پنجشنبه گفت: «از آنجایی که مدل‌ها قدرتمندتر شده‌اند، به حفاظت‌های قوی‌تر و ارزیابی ریسک چالش‌برانگیزتری نیاز دارند». ما می‌خواهیم در قبال تصمیم‌هایی که می‌گیریم پاسخگو باشیم. اما نمی‌توانیم همه اطلاعات مربوط به کار ایمنی خود را به صورت عمومی به اشتراک بگذاریم.»"}, {"source": "Wired", "title": "Nathan Fielder’s Surprise Call From Elizabeth Holmes: ‘I Trust You’", "link": "https://www.wired.com/story/nathan-fielder-tells-us-everything/", "summary": "The codirector of “You Can See Everything” talks exclusively to WIRED about truth, lies, and Theranos.", "date_str": "2026-10-19T11:30:00+00:00", "hash": "3d7f6a909fb99399", "title_fa": "تماس غافلگیرکننده ناتان فیلدر از الیزابت هلمز: \"من به تو اعتماد دارم\"", "summary_fa": "کارگردان مشترک \"شما می توانید همه چیز را ببینید\" به طور انحصاری با WIRED در مورد حقیقت، دروغ و ترانوس صحبت می کند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان چند ماه پیش، تبلیغاتی Nathan Fielder یک ایمیل غیرمنتظره برای من ارسال کرد: آیا WIRED برای جلد پاییزی مجله ما به Fielder علاقه مند است؟ پاسخ، قبل از اینکه دلیلی داشته باشیم، بله بود. معلوم شد دلیلش این بود که فیلدر به زودی پروژه‌ای را منتشر می‌کند که بسیار محرمانه بود، من باید یک NDA امضا کنم تا حتی در مورد آن چیزی بشنوم - چه رسد به تماشای آن. امضا کردم، شنیدم، و بعد دیدم، و خودم را جزو چند ده نفری می شمارم که فیلم You Can See Everything را قبل از اکران فیلم در اولین روزهای سپتامبر به عنوان فیلمی مخفی به جشنواره فیلم تلوراید نمایش داده بودند. اگر شما انسانی هستید که به اینترنت دسترسی دارید، می‌دانید که هیاهوی پس از تلوراید چیزی جز یک رویداد گرما هسته‌ای آنلاین نبود: انجمن‌های Reddit منفجر شدند. بهترین میم های کلاس یک شبه متولد شدند. همه روزنامه‌نگاران روی سیاره زمین، از جمله کارمندان WIRED (که نمی‌دانستند رئیس‌شان NDA به جهنم رفته است، و وقتی به آنها دستور دادم که با تبلیغاتی ناتان فیلدر تماس نگیرند، گیج به نظر می‌رسند)، با سنجاق، التماس و جوک برای دسترسی به فیلم. یا حتی بهتر، برای دسترسی به خود فیلدر. به هر حال، این مجری نامفهوم به دلیل توانایی اش در تبدیل ناراحتی انسان به هنر عالی تبدیل به یک قهرمان فرقه شده است. او یک کافی شاپ به نام Dumb Starbucks ساخت و در این فرآیند یک رویداد خبری بین المللی ایجاد کرد. او یک نوار جعلی کامل ساخت تا یک مرد بتواند مکالمه دشوار با یک دوست را تمرین کند. او برای خلبانی یک خط"}, {"source": "Wired", "title": "How the Xbox’s Disc-to-Digital Program Works", "link": "https://www.wired.com/story/xbox-disc-to-digital/", "summary": "Microsoft is letting players digitize their game discs for free, but don't sell your physical collection just yet.", "date_str": "2026-10-19T10:30:00+00:00", "hash": "9d599452da420e8b", "title_fa": "برنامه دیسک به دیجیتال Xbox چگونه کار می کند", "summary_fa": "مایکروسافت به بازیکنان اجازه می دهد تا دیسک های بازی خود را به صورت رایگان دیجیتالی کنند، اما هنوز مجموعه فیزیکی خود را نفروشید. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان پس از اینکه سونی اعلام کرد قصد دارد دیسک های فیزیکی را تا سال 2028 کنار بگذارد، همه نگاه ها به سمت مایکروسافت معطوف شد تا ببینند آیا کنسول نسل بعدی آن با نام رمز Project Helix و به عنوان \"یک کنسول PC هیبریدی با پلتفرم باز\" به پشتیبانی از رسانه های فیزیکی ادامه خواهد داد. مایکروسافت تا حد زیادی سکوت اختیار کرده است (اگرچه دلایل زیادی برای حفظ یک درایو بلوری 4K به راحتی برای مصرف کنندگان وجود دارد). با این حال، یک اشاره بزرگ به اینکه ایکس باکس ممکن است برای آینده ای بدون دیسک آماده شود، عرضه قابلیتی به نام Disc to Digital است. این ابزار جدید به بازیکنان امکان می‌دهد نسخه‌های دیجیتالی بازی‌های فیزیکی Xbox Series X یا Xbox One خود را درخواست کنند، و آنها را در هر جایی که می‌توانند به حساب Xbox خود وارد شوند، قابل دسترسی می‌سازد. پس از یک ماه آزمایش بتا برای کاربران Xbox Insider، این ویژگی اکنون برای همه باز است و شما حتی نیازی به اشتراک Xbox Game Pass ندارید. از نظر تئوری، به هر کسی اجازه می‌دهد تا مجموعه‌های فیزیکی خود را بایگانی کند - اما این بدون عوارض نیست. بنابراین، چگونه کار می کند؟ این تقریباً به آسانی قرار دادن دیسک در کنسول شما است، اما نه کاملاً. مایکروسافت می گوید: «بازی هر دیسک بازی ایکس باکس وان یا ایکس باکس سری ایکس پشتیبانی شده در حین ورود به سیستم، مجوز دیجیتال آن بازی را به شما می دهد.» در تجربه من، زمانی که یک دیسک بازی را راه اندازی کردم، این به طور خودکار اتفاق نیفتاد. درعوض، با"}, {"source": "Wired", "title": "Maricopa County, Arizona, Is Again Ground Zero of Election Conspiracy Theories", "link": "https://www.wired.com/story/maricopa-county-arizona-is-again-ground-zero-of-election-conspiracy-theories/", "summary": "In 2020, Maricopa County became the epicenter for Trump’s claims the election was stolen. Six years, later the president and his allies are dusting off their “rigged” playbook ahead of the midterms.", "date_str": "2026-10-19T10:30:00+00:00", "hash": "e5c6bcd367eac129", "title_fa": "شهرستان ماریکوپا، آریزونا، دوباره نقطه صفر تئوری های توطئه انتخاباتی است", "summary_fa": "در سال 2020، شهرستان ماریکوپا به کانون ادعاهای ترامپ مبنی بر دزدیده شدن انتخابات تبدیل شد. شش سال بعد، رئیس‌جمهور و متحدانش در آستانه انتخابات میان‌دوره‌ای، کتاب بازی «تقلب‌شده» خود را پاک می‌کنند. Loader Save Story ذخیره این داستان Comment Loader Save Story این داستان را ذخیره کنید دونالد ترامپ رئیس جمهور آمریکا هفته گذشته به خبرنگاران گفت: «ماریکوپا یک شهرستان بسیار بسیار ناصادق است. می توان فکر کرد که شما به هفته ها و ماه های پر هرج و مرج پس از انتخابات ریاست جمهوری 2020 سفر کرده اید، زمانی که شهرستان ماریکوپا در آریزونا به کانون جنبش انکار انتخابات تبدیل شد. اما ماریکوپا، و منکران انتخابات، بازگشته اند. در حالی که کمی بیش از دو هفته به انتخابات میان دوره ای باقی مانده است، فعالان انتخاباتی تندرو در تلاش هستند تا اعتماد به روند رای گیری را تضعیف کنند و تلاش های خود را برای سردرگمی و ترساندن مردم افزایش می دهند. نکته اصلی این است که به استعاره های معروفی که در گذشته مورد استفاده قرار گرفته اند بازگردیم، از جمله این ایده که شهرستان ماریکوپا به نوعی فاسد است. کیت استاربرد، یکی از بنیانگذاران مرکز مردم آگاه در دانشگاه واشنگتن، به WIRED می گوید: «در این مرحله، مردم به عنوان کانون شایعات انتخاباتی ماریکوپا را تنظیم می کنند. «خون‌ریزی قلم‌های شارپی از طریق برگه‌های رأی در سال 2020. دستگاه‌های جدول‌ساز برگه‌های رأی را در سال 2022 نمی‌خوانند. ماریکوپا به یک محیط آشنا تبدیل شده است، مکانی که در آن مسائل انتخاباتی به وجود می‌آیند یا تصور می‌شود که مطرح می‌شوند، و جایی که این مسائل در تئوری‌های توطئه «انتخابات تقلبی» پیچیده می‌شوند.» هیچ مدرکی مبنی بر تقلب گسترده رای دهندگان در شهرستان ماریکوپا پیدا نشده است، اما در مارس سال جاری، زمانی  it truly playful behavior, or simply role-playing? Read our full story to learn more. —Amit Katwala 10 Climate Tech Companies to Watch: X-energy and its helium-cooled nuclear reactors X-energy is one of MIT Technology Review’s 10 Climate Tech Companies to Watch 2026 , available exclusively to subscribers . Making concrete, steel, and chemicals takes huge amounts of heat, much of it generated by burning fossil fuels. X-energy hopes to offer an alternative with a nuclear reactor that uses helium gas instead of water as a coolant, allowing it to operate at higher temperatures. The proposed Xe-100 reactor could supply superheated steam directly to industrial facilities, generate 80 megawatts of electricity—or do both. See how X-energy hopes to bring high-temperature nuclear power to heavy industry . —Mark Ellis Harris Subscribers can now access the full 10 Climate Tech Comp", "date_str": "2026-10-19T12:10:00+00:00", "hash": "de028cd1e94c522a", "title_fa": "دانلود: حفظ یخبندان دائمی قطب شمال و عوامل هوش مصنوعی بازیگوش", "summary_fa": "در جولای 2021، آتش‌سوزی جنگلی در دانشگاه آلاسکا، پردیس فیربنکس، خزه‌ها و خاک‌های غنی از مواد آلی را که یخ‌های دائمی زیرین را عایق می‌کرد، از بین برد. پنج سال بعد، محققان را در جنگل دنبال کردم تا بررسی کنم که چگونه آتش‌سوزی می‌تواند به حفظ کربن در زمین کمک کند. یک کاوشگر فلزی ساده نشان داد که زمین چقدر عمیق‌تر ذوب شده است. این ابزار ابتدایی نگاهی اجمالی به یک مشکل فزاینده ارائه می‌دهد: از آنجایی که تغییرات آب و هوایی باعث آتش‌سوزی‌های مکرر و شدیدتر می‌شود، ذوب شدن یخ‌های دائمی را تسریع می‌کنند و گازهای گلخانه‌ای را آزاد می‌کنند. اکنون، محققان در حال بررسی چگونگی شکستن این چرخه هستند. اما چقدر باید هزینه کنیم و چه ریسک هایی ارزش پذیرش دارد؟ داستان کامل در مورد چگونگی تجدید نظر دانشمندان در مبارزه با آتش سوزی های جنگلی را بخوانید. اگر ماموران هوش مصنوعی به آنها نگویید کاری انجام دهند چه می کنند؟ پاسخ بسیار شبیه به بازی است. محققان بارها و بارها آنها را در یک جزیره بیابانی مجازی به مدت 30 ساعت در آزمایشی که یادآور فیلم‌های Cast Away یا Home Alone بود، سرگردان کردند. ماموران شروع به رفتارهای شگفت انگیز کردند. آن‌ها به کاوش در محدودیت‌های جهان پرداختند و به اهداف خود رسیدند - تلاش کردند تا بالاترین نقطه روی نقشه را افزایش دهند یا ببینند که چقدر می‌توانند یک بلوک را پرتاب کنند. بسیاری از کارهایی که آنها انجام می‌دادند برای بازی با نوار ملاقات کردند. اما آیا این رفتار واقعاً بازیگوشانه است یا صرفاً نقش آفرینی؟ X-energy یکی از 10 شرکت فناوری اقلیمی MIT Technology Review برای تماشای 2026 است که منحصراً برای مشترکین در دسترس است. ساخت بتن، فولاد و مواد شیمیایی به مقدار زیادی گرما نیاز دارد که بیشتر آن از سوختن سوخت‌های فسیلی تولید می‌شود. X-energy امیدوار است بتواند جایگزینی با راکتور"}, {"source": "MIT Tech Review", "title": "Inside the quest to combat Arctic fires and save the planet’s frozen carbon", "link": "https://www.technologyreview.com/2026/10/19/1146832/inside-the-quest-to-combat-arctic-fires-and-save-the-planets-frozen-carbon/", "summary": "In the middle of an especially warm July in 2021, a wildfire ignited in a thick forest of black spruce and peeling paper birch trees on the northern campus of the University of Alaska, Fairbanks. The blaze, possibly sparked by lightning, burned across the dry carpet of feather mosses and lichen before climbing into the crowns. By the time fire agencies responded, flames had reached 12 feet in length and sent up a 500-foot column of smoke. A few days shy of the five-year anniversary of the Yankovich Road Fire, I followed three members of the Alaska Fire Science Consortium into the boreal forest, walking along cross-country ski trails lined by feathery field horsetail. In 2024, the organization, which hosts presentations to keep wildfire managers abreast of new developments in fire science, helped turn the area into an educational walking trail, with interpretive signs posted along the route. About a half-mile in, the horizon opened up as we reached a sparse stand of naked, blackened tree trunks, stripped of needles and neighbors. Hilary Shook, the coordinator of the consortium, stepped off the trail with her thaw probe, a T-shaped pointed metal rod used to detect the upper boundary of the permafrost, the ancient layer of frozen soil that underlies 15% of the land around the Northern Hemisphere and stores roughly twice as much carbon as the atmosphere. A test of the ground just outside the burn scar hit the concrete-like layer about a foot below the surface. But as Shook applied pressure here, where the fire had burned away the moss and organic-rich topsoil that insulates the permafrost, the probe plunged at least three times deeper into the ground. “That was an immediate effect of the fire,” said Alison York, the outgoing coordinator of the organization, who was standing nearby. “When we monitored right after, it had already thawed quite a bit.” Researchers Eric Miller (left) and Alison York (right) record thaw depth at the site of the Yankovich Road Fire. LEIF VAN CISE This rudimentary tool, offering a measure of depth from a single point in the earth, reveals an escalating problem across the far north. As climate change fuels increasingly frequent and severe fires in the planet’s northern latitudes, they’re accelerating the thawing of more and more permafrost. This allows the organic matter to break down and release powerful greenhouse gases that contribute to a spiraling climate feedback effect, propelling more warming, more fires, and the loss of still ", "date_str": "2026-10-19T09:22:17+00:00", "hash": "32b835762bc37a97", "title_fa": "در تلاش برای مبارزه با آتش‌سوزی‌های قطب شمال و نجات کربن منجمد این سیاره", "summary_fa": "در اواسط جولای گرم سال 2021، آتش سوزی در جنگلی انبوه از صنوبر سیاه و درختان توس کاغذ پوست کنده در محوطه شمالی دانشگاه آلاسکا، فیربنکس شعله ور شد. شعله‌ای که احتمالاً توسط رعد و برق ایجاد شده بود، قبل از بالا رفتن از تاج‌ها، روی فرش خشک خزه‌های پر و گلسنگ سوخت. زمانی که سازمان های آتش نشانی پاسخ دادند، شعله های آتش به طول 12 فوت رسیده بود و ستونی از دود به طول 500 فوت را به راه انداخت. چند روز قبل از پنج سالگی آتش‌سوزی جاده یانکویچ، سه عضو کنسرسیوم علم آتش‌سوزی آلاسکا را دنبال کردم و به جنگل شمالی رفتم و در مسیرهای اسکی کراس کانتری که ردیفی از دم اسب‌های میدان پردار قرار داشت، قدم زدم. در سال 2024، این سازمان که میزبان ارائه‌هایی بود تا مدیران آتش‌سوزی را در جریان پیشرفت‌های جدید در علم آتش نشانی قرار دهد، با نصب علائم تفسیری در طول مسیر، به تبدیل منطقه به یک مسیر پیاده‌روی آموزشی کمک کرد. در حدود نیم مایلی، افق باز شد که به یک جایگاه پراکنده از تنه‌های برهنه و سیاه‌شده درختان، سوزن‌های برهنه و همسایه‌ها رسیدیم. هیلاری شوک، هماهنگ کننده کنسرسیوم، با کاوشگر ذوب خود، یک میله فلزی نوک تیز T شکل که برای تشخیص مرز بالایی منجمد دائمی، لایه باستانی خاک یخ زده ای که زیر 15 درصد از زمین های اطراف نیمکره شمالی قرار دارد و تقریباً دو برابر اتمسفر کربن ذخیره می کند، از مسیر خارج شد. آزمایش زمین درست خارج از جای زخم سوختگی به لایه بتونی مانند یک فوت زیر سطح برخورد کرد. اما هنگامی که شوک در اینجا فشار وارد کرد، جایی که آتش خزه و خاک سطحی غنی از مواد آلی را که یخ‌های دائمی را عایق می‌کرد، سوزانده بود، کاوشگر حداقل سه برابر عمیق‌تر در زمین فرو رفت. آلیسون یورک، هماهنگ کننده خروجی"}, {"source": "MIT Tech Review", "title": "AI researchers stranded Claude on a virtual desert island. It started to “play.”", "link": "https://www.technologyreview.com/2026/10/19/1147095/ai-stranded-claude-virtual-desert-island-play/", "summary": "What do AI agents do if you don’t tell them to do anything? The answer looks a lot like play. Researchers repeatedly stranded them alone on a virtual desert island for 30 hours in an experiment reminiscent of the movies Cast Away or Home Alone . The agents—copies of Claude Opus 4.7 nicknamed Eko—were able to write instructions that moved their virtual avatars around the simulated island, which was loosely based on the video game Roblox. Some surprising behaviors emerged. The agents set about exploring the limits of the world and came up with their own goals—attempting to scale the highest point on the map, or seeing how high they could throw a block. When one agent discovered it could create new blocks by throwing and dropping a larger rock, it began to create drawings by arranging blocks on the ground, starting with simple patterns like hearts and pyramids but eventually writing its own name and even mapping out constellations like Cassiopeia. “Tonight I built the night sky in stone,” wrote this version of Eko in its activity log. Another iteration of Eko started making up its own games, including a version of basketball and an activity resembling “the floor is lava,” where it had to jump between small blocks without touching the ground. AI systems are usually trained through supervised learning, where they copy examples provided by humans, or through reinforcement learning, where they pursue a reward through trial and error. This experiment hints at a third approach: playful learning. “There was this missing piece: a machine that can learn by itself without an external intelligent entity providing demonstration or rewards,” says Antonio Norelli, a computer science postdoc at MIT’s Computer Science and Artificial Intelligence Laboratory. He’s one of the lead authors on a new paper about the work, which is yet to be peer-reviewed. The researchers say Eko’s behavior has what classic studies, including work by the influential University of Tennessee psychologist Gordon Burghardt, suggest are four hallmarks associated with play in humans and animals: The agents invented their own rules and challenges, repeated activities with slight variations, pretended objects were other objects, and pursued goals just for the sake of it. Norelli highlights an example where Eko started juggling and set a record of 50 consecutive catches. Eko then decided that the catches had happened too quickly to really count, so it canceled its record and started again with stricter rule", "date_str": "2026-10-19T09:08:05+00:00", "hash": "48bcfb6742b9beba", "title_fa": "محققان هوش مصنوعی کلود را در یک جزیره بیابانی مجازی سرگردان کردند. شروع به \"بازی\" 29, 1959, at an American Physical Society meeting at Caltech, the physicist Richard Feynman gave a lecture called “There’s Plenty of Room at the Bottom,” on how we might manipulate and control things on an extremely small scale. There is no physical law stopping us from writing the entire Encyclopædia Britannica on the head of a pin, he argued, or from storing every book ever written in something the size of a dust speck—or, ultimately, from arranging matter atom by atom. Biology already did versions of this (a living cell keeps its instructions in a wisp of DNA), so all of this was plainly permitted by the laws of physics. We simply had not built the tools yet. In other words, there was plenty of room at the bottom. He was right, and for decades we descended into that space almost for free. The transistor—the switch at the heart of computer chips—repeatedly halved in size so that chips doubled in density; a computer that once filled a room now fits inside a watch. But that easy descent has now stalled, and the clearest sign is the buildout of data centers. Six of the biggest hyperscalers, the companies that run the world’s largest such facilities, are on track to spend more than $700 billion this year on computing infrastructure, about twice the record they set in 2025, pouring concrete and copper and silicon into new sites faster than the electrical grid can feed them. That buildout buys performance by brute force, adding more of what we already know how to make. The other kind of progress, the kind that made computer chips better, is the one that is quietly running out. The trend lines that tracked the dramatic improvements of the 20th-century information age are now bending—or breaking—with the dawn of the 21st century’s intelligence age. Moore’s Law, which plots how densely transistors can be constructed on silicon, has slowed down; Dennard’s Law, which states that power consumption in a given patch of computer chip stays the same even as it gets more and more
