", "link": "https://www.technologyreview.com/2026/10/14/1146452/the-download-military-fake-blood-future-batteries/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. The US military’s race to make fake blood In February 2007, a US military helicopter carrying blood to a field hospital was shot down in Iraq, killing all seven crew members. The mission was a reminder of the risks of transporting blood, which has a limited shelf life and is often in short supply. Now, a $73 million DARPA effort aims to create shelf-stable versions of plasma, platelets, and red blood cells. The idea is to develop dried blood products that can be stored for long periods and deployed quickly on the battlefield. The project aims to have bags of dried blood products deployed in the field by 2029. But getting it all done will be tough, and researchers still have major questions about the safety and effectiveness of synthetic alternatives. Discover how the military hopes to make blood last longer . —Andrew Rosenblum This story is from the next issue of our print magazine. Subscribe now to get your hands on a copy as soon as it lands on Wednesday, October 21! 10 Climate Tech Companies to Watch: WeLion New Energy and its semi-solid-state batteries WeLion New Energy is one of MIT Technology Review’s 10 Climate Tech Companies to Watch 2026 , available exclusively to subscribers . WeLion New Energy is on a quest to make safer, better batteries. The Chinese company’s liquid-solid hybrid cells aim to pack more power into electric cars, boats and drones, potentially improving safety and offering greater energy density than lithium-ion batteries. In 2023, WeLion released a battery pack with EV-maker Nio that offered a range of over 1,000 kilometers. Now, the company is developing batteries with even higher energy density. But scaling up production and competing on cost remain major challenges. Explore WeLion’s push to make safer, higher-capacity batteries . —You Xiaoying Subscribers can now access the full 10 Climate Tech Companies to Watch , spanning everything from geothermal power plants to carbon dioxide batteries . MIT Technology Review Narrated: Weight-loss drugs show signs of slowing biological aging, say drugmakers Popular weight-loss drugs may do more than help people shed pounds. They might also slow the aging process. Drugmakers Eli Lilly and Novo Nordisk say patients taking their GLP-1 drugs age less quickly, according to molecular “aging clocks” that track changes in DNA or levels of key proteins. The fin", "date_str": "2026-10-14T12:10:00+00:00", "hash": "6b4c8b26f65f8d6a", "title_fa": "دانلود: خون جعلی و آینده باتری ها", "summary_fa": "در فوریه 2007، یک هلیکوپتر نظامی آمریکا که خون را به یک بیمارستان صحرایی حمل می کرد در عراق سرنگون شد و هر هفت خدمه آن کشته شدند. این ماموریت یادآور خطرات حمل و نقل خون بود که ماندگاری محدودی دارد و اغلب با کمبود مواجه است. اکنون، یک تلاش ۷۳ میلیون دلاری دارپا با هدف ایجاد نسخه‌های پایدار از پلاسما، پلاکت‌ها و گلبول‌های قرمز خون است. ایده این است که فرآورده های خونی خشک شده ای را توسعه دهیم که می توانند برای مدت طولانی ذخیره شوند و به سرعت در میدان نبرد مستقر شوند. هدف این پروژه این است که کیسه های فرآورده های خونی خشک شده را تا سال 2029 در این زمینه به کار گیرد. اما انجام همه این کارها دشوار خواهد بود و محققان هنوز سؤالات عمده ای در مورد ایمنی و اثربخشی جایگزین های مصنوعی دارند. کشف کنید که چگونه ارتش امیدوار است که خون را طولانی تر کند. این داستان از شماره بعدی مجله چاپی ما است. اکنون مشترک شوید تا به محض اینکه در روز چهارشنبه، 21 اکتبر به دستتان رسید، نسخه ای از آن را دریافت کنید! WeLion New Energy یکی از 10 شرکت فناوری اقلیمی MIT Technology Review برای تماشای 2026 است که منحصراً برای مشترکین در دسترس است. WeLion New Energy در تلاش برای ساخت باتری های ایمن تر و بهتر است. سلول‌های هیبریدی مایع-جامد این شرکت چینی با هدف قرار دادن نیروی بیشتر در خودروهای الکتریکی، قایق‌ها و پهپادها، به طور بالقوه ایمنی را بهبود می‌بخشد و چگالی انرژی بیشتری نسبت به باتری‌های لیتیوم یون ارائه می‌کند. در سال 2023، WeLion یک بسته باتری با سازنده EV Nio منتشر کرد که برد بیش از 1000 کیلومتر را ارائه می کرد. اکنون، این شرکت در حال توسعه باتری هایی با تراکم انرژی حتی بالاتر است. اما افزایش تولید و"}, {"source": "MIT Tech Review", "title": "The US military’s race to make fake blood", "link": "https://www.technologyreview.com/2026/10/14/1145807/us-military-race-to-make-fake-blood/", "summary": "Its call sign was Morphine 1-2. In February 2007, the hulking dual-­rotor casualty evacuation helicopter had just flown three wounded soldiers to a field hospital in Balad, north of Baghdad, when another call came: an emergency mission to fly through an insurgent-controlled area in broad daylight. Typically, helicopters would be in a spot like this only at night, and with all lights turned off. As it passed near the city of Karmah, in the eastern side of Al-Anbar province, an insurgent fired a portable missile launcher. The tail gunner, who likely saw the shot roaring in, yelled for the pilot to make an evasive move. But the missile had already locked on, and the ensuing blast started a fire on board. After the pilot battled the failing machine for 58 agonizing seconds, Morphine 1-2 plunged to the ground. All seven crew members were killed. Why was the helo there in daylight? “It was getting blood and bringing it back. It was [on] what we call a ‘blood run,’ and [it’s] the highest of priorities besides casualty evacuation,” explains Lieutenant Commander Robert Murray, a Navy officer and program manager at DARPA, the Defense Advanced Research Projects Agency, who studied this incident as an intelligence officer. Today, a chronic shortage of blood in both the military and civilian worlds is fueling a race to develop synthetic alternatives. About 90% of preventable battlefield deaths are due to hemorrhage—bleeding that happens when a blood vessel ruptures—and it’s the leading cause of maternal deaths worldwide. A study published in Transfusion in 2025 found that of 1.2 million trauma patients in the United States who potentially needed blood before reaching a hospital, just 1% received it. The shortage results in about 10,000 preventable deaths each year in the US, according to the American College of Surgeons. Globally, that figure is likely in the millions . One reason for the shortfall is that blood has a storage problem. Whole blood lasts only 35 days when refrigerated, so banks separate out components to stretch the timeline. But that’s an imperfect solution. The platelets that help wounds clot are typically stored at room temperature and last for a week or less. Hospitals and the military freeze the red blood cells that carry oxygen, as well as the protein-rich plasma that restores volume and aids coagulation. Once thawed, though, both will spoil within days. “What happens if I don’t know when I’m going to be attacked? Well, thaw it and you let it expir", "date_str": "2026-10-14T09:00:00+00:00", "hash": "5a7810ffcd7e34ea", "title_fa": "مسابقه ارتش آمریکا برای ساختن خون جعلی", "summary_fa": "علامت تماس آن مرفین 1-2 بود. در فوریه 2007، هلیکوپتر تخلیه مجروح دو روتور غول پیکر به تازگی سه سرباز مجروح را به بیمارستان صحرایی در بلد، در شمال بغداد منتقل کرده بود، زمانی که تماس دیگری شنیده شد: یک ماموریت اضطراری برای پرواز در یک منطقه تحت کنترل شورشیان در روز روشن. به طور معمول، هلیکوپترها فقط در شب در چنین نقطه ای قرار می گیرند و همه چراغ ها خاموش می شوند. هنگام عبور از نزدیکی شهر کرمه، در ضلع شرقی استان الانبار، یک شورشی یک موشک انداز قابل حمل شلیک کرد. توپچی دم، که احتمالاً تیراندازی را در حال غرش دید، از خلبان فریاد زد که یک حرکت فراری انجام دهد. اما موشک قبلاً قفل شده بود و انفجار بعدی باعث آتش سوزی در هواپیما شد. پس از اینکه خلبان به مدت 58 ثانیه دردناک با دستگاه از کار افتاده مبارزه کرد، مورفین 1-2 به زمین افتاد. هر هفت خدمه کشته شدند. چرا هلو در نور روز آنجا بود؟ ستوان فرمانده رابرت موری، افسر نیروی دریایی و مدیر برنامه در دارپا، آژانس پروژه های تحقیقاتی پیشرفته دفاعی، که این حادثه را به عنوان یک افسر اطلاعاتی مورد مطالعه قرار داد، توضیح می دهد: \"این در حال گرفتن خون و بازگرداندن آن بود. این [در] چیزی بود که ما \"جریان خون\" می نامیم، و [این] بالاترین اولویت علاوه بر تخلیه مجروحان است.\" امروزه، کمبود مزمن خون در هر دو جهان نظامی و غیرنظامی، مسابقه ای را برای توسعه جایگزین های مصنوعی دامن می زند. حدود 90 درصد از مرگ و میرهای قابل پیشگیری در میدان نبرد به دلیل خونریزی است - خونریزی که هنگام پاره شدن رگ خونی اتفاق می افتد - و این عامل اصلی مرگ و میر مادران در سراسر جهان است. مطالعه ای که در سال 2025 در Transfusion منتشر شد نشان داد که از"}, {"source": "Google AI Blog", "title": "Gemini 4 Argon: Built to solve your hardest problems", "link": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/", "summary": "We’re giving developers, enterprises, scientists, and consumers access to Gemini 4 Argon, our latest frontier model.", "date_str": "2026-10-13T16:00:00+00:00", "hash": "a5af6c1bf437ce9e", "title_fa": "Gemini 4 Argon: ساخته شده تا سخت ترین مشکلات شما را حل کند", "summary_fa": "ما به توسعه دهندگان، شرکت ها، دانشمندان و مصرف کنندگان اجازه دسترسی به Gemini 4 Argon، آخرین مدل مرزی ما را می دهیم. SVP، Google DeepMind و Chief AI Architect، Google Gemini 4 Argon اکنون از طریق API در استودیو AI و پلتفرم Gemini، برای مشترکین Google AI Ultra در Google Antigravity و مشترکین Google AI Ultra و Pro در برنامه Gemini و حالت AI در جستجو به صورت جهانی در دسترس است. آرگون در کارهای عمیق در کارهای پیچیده و دنیای واقعی در حوزه های مختلف از جمله کدنویسی، امور مالی، حقوقی، امنیت سایبری و علم برتری دارد. عمق و دقت آن در وظایف چند مرحله‌ای باعث می‌شود که آرگون از سایر مدل‌های مرزی در معیارها در دامنه‌ها بهتر عمل کند و در رتبه اول در شاخص Vals قرار بگیرد، که عملکرد مدل را در بخش‌های مهم اقتصادی مانند امور مالی، کدنویسی، حقوقی و مالیاتی اندازه‌گیری می‌کند. این مدل امروز با قیمت اولیه 1 از 2 دلار به ازای هر میلیون توکن ورودی و 10 دلار به ازای هر میلیون توکن خروجی (با نشانه های ورودی ذخیره شده با 95 درصد تخفیف) عرضه می شود. تیم‌هایی در Google، در سراسر شرکت‌ها و در جامعه تحقیقاتی قبلاً از آرگون برای ایجاد تأثیر قابل توجه در زمینه‌ها استفاده کرده‌اند: در Google، ما از آرگون برای سخت‌ترین مشکلات مهندسی خود استفاده می‌کنیم. در چند هفته گذشته، مهندسان نرم افزار کدهای با کیفیت بالا را سریعتر از همیشه ارسال کرده اند. آرگون در Antigravity به تیم ها کمک کرده است تا بیش از 35٪ کدهای ارسالی را افزایش دهند و در عین حال بازگشت کد را تقریباً یک سوم کاهش دهند. آرگون با استفاده از حلقه‌های نقد بصری چند عاملی در Antigravity، یک مدل بسیار دقیق از یک پاگودا ساخت. این مدل به طور مستقل یک مجموعه معبد چند ساختمانی با معماری فوتورئالیستی،"}, {"source": "Business Insider", "title": "I don't regret leaving New York City for a small Italian village — but I've had to adjust to some big lifestyle changes", "link": "https://www.businessinsider.com/moved-to-italian-village-surprises-challenges-lifestyle-changes-2026-10", "summary": "I ve found that in my Italian village, building relationships can help you get tasks done. Camellia Phillips About three years ago, I moved from New York City to a small Sicilian village . Grocery shopping and running errands are very different here. However, I've grown to appreciate many of the ways my lifestyle has changed. I recently walked into the macelleria in our Sicilian village — a combo butcher, deli, and corner store — and started babbling excitedly that my favorite cheese was back in stock. One of the owners joked in Italian that \"Camellia moved here just for the food.\" She wasn't completely wrong. After 20 years in New York City, my husband and I moved to a small town in Italy for some of the more classic reasons: quality food, a slower pace of life, and community-oriented culture. Now that we've lived here for nearly three years, though, we've also experienced the reality behind the tourism taglines. Our village has its own rhythm — one I've learned to appreciate, even when it's pushed me to change and adapt. The food system is hyper-local and seasonal I buy produce from a local food truck that frequently comes by my village. Camellia Phillips Buying food here looks very different from the way we shopped in the US. With no large grocery store within a 40-minute walk, we shop hyper-local. This includes the macelleria, weekly outdoor market, and vendors who drive our narrow streets selling fruit, vegetables, eggs, fish, fresh bread, and more. Each truck passes by only on certain days and times — and the schedule isn't written down. We had to learn it by living it. We've now gotten to know local vendors and farmers, and we message them in advance to find out what's available. We eat what's in season, like broccoli and citrus in winter, or melon with prosciutto in summer. Some specialties, like prickly pears, fresh figs, and wild asparagus, are only available for a few weeks each year. This hyper-local food delivery system can be a lifesaver, too, if you have limited mobility. Our older neighbors lean out their balconies to call down orders for eggs and artichokes. Everything closes for 3 hours in the afternoon Many businesses in our town tend to slow down in the afternoon. Camellia Phillips If you're trying to pack in an afternoon of errands on your own schedule, small-town Sicily is not the place to do it. Where we live, most businesses and public offices close for around three hours every afternoon. Especially in the hot summer months, the str", "date_str": "2026-10-14T13:14:01+00:00", "hash": "896c2c72f78a9837", "title_fa": "من از اینکه نیویورک را به مقصد یک دهکده کوچک ایتالیایی ترک کردم پشیمان نیستم - اما مجبور شدم خود را با تغییرات بزرگ سبک زندگی وفق دهم", "summary_fa": "من متوجه شدم که در دهکده ایتالیایی من، ایجاد روابط می تواند به شما در انجام وظایف کمک کند. کاملیا فیلیپس حدود سه سال پیش، از شهر نیویورک به یک روستای کوچک سیسیلی نقل مکان کردم. خرید مواد غذایی و انجام امور در اینجا بسیار متفاوت است. با این حال، من قدردان بسیاری از روش هایی هستم که سبک زندگی ام تغییر کرده است. من اخیراً به ماسلریا در دهکده سیسیلی مان - یک قصاب، اغذیه فروشی و گوشه فروشی - رفتم و با هیجان شروع کردم به غر زدن که پنیر مورد علاقه من دوباره موجود است. یکی از مالکان به زبان ایتالیایی به شوخی گفت: \"کاملیا فقط برای غذا به اینجا نقل مکان کرد.\" او کاملاً اشتباه نمی کرد. پس از 20 سال اقامت در شهر نیویورک، من و شوهرم به دلایلی کلاسیک تر به شهری کوچک در ایتالیا نقل مکان کردیم: غذای باکیفیت، سرعت پایین تر زندگی، و فرهنگ جامعه محور. با این حال، اکنون که نزدیک به سه سال است در اینجا زندگی کرده‌ایم، واقعیتی را که پشت برچسب‌های گردشگری است نیز تجربه کرده‌ایم. دهکده ما ریتم خاص خود را دارد - ریتمی که من یاد گرفته ام از آن قدردانی کنم، حتی زمانی که مرا وادار به تغییر و سازگاری کند. سیستم غذایی بیش از حد محلی و فصلی است. من محصولات را از یک کامیون مواد غذایی محلی خریداری می کنم که اغلب به روستای من می آید. Camellia Phillips خرید غذا در اینجا بسیار متفاوت از خرید ما در ایالات متحده است. بدون خواربارفروشی بزرگ در فاصله 40 دقیقه پیاده روی، ما به صورت فوق محلی خرید می کنیم. این شامل ماسلریا، بازار هفتگی در فضای باز، و فروشندگانی است که در خیابان‌های باریک ما میوه، سبزیجات، تخم‌مرغ، ماهی، نان تازه و غیره می‌فروشند. هر کامیون فقط در روزها و زمان‌های خاصی از"}, {"source": "Business Insider", "title": "I eat the same dietitian-approved lunch almost every day. It's got fiber and protein — and is a breeze to prep in advance", "link": "https://www.businessinsider.com/easy-lunch-grain-bowl-recipe-fiber-protein-dietitian-approved-2026-10", "summary": "My husband and I eat the same lunches nearly every single day during the week. Rachel Hosie I meal-prep the same protein- and fiber-rich lunch for my husband and me every single week. Because I mix up the ingredients, dressings, and seasonings for the grain bowls, they never get old. The nourishing bowls are Mediterranean diet-friendly and help me follow the 80/20 principle . When I lived in a big city, I used to love treating myself to lunches at trendy salad spots. Although these take-out meals were tasty, they were terrible for my wallet. I've since turned into an avid meal-prepper and frequently make my own lunch — almost always a fiber- and protein-packed grain bowl — for a fraction of the price. The recipe I use aligns with the 80/20 nutrition principle I follow, meaning I eat nutrient-dense foods 80% of the time and don't worry about nutrition for the other 20%. The grain bowls are so nourishing that I feel relaxed about occasionally going out for a slightly less nutrient-dense lunch, since I know I'm hitting my nutrition goals most of the time. Here's how to make the go-to lunch that helps me stay on track. These grain bowls are easy to prep and customize The grain bowls are nearly impossible to mess up and highly customizable. Rachel Hosie I play around with the ingredients I put in my grain bowls every week, but they always follow the same formula: My grain-bowl ingredient checklist: Grains, such as quinoa, wholegrain rice, or buckwheat Beans or legumes, such as chickpeas, edamame, or lentils A protein source, such as tofu or chicken Raw vegetables, such as chopped cucumber, tomatoes, beetroot, or scallions Roasted vegetables, such as butternut squash, bell peppers, cauliflower, broccoli, or zucchini A flavorful add-in, such as crumbled feta, avocado, or hummus Greens, such as lettuce or spinach Spices and herbs of choice Seeds and nuts of choice A dressing of choice The recipe is flexible, so there's no need to add ingredients in a specific order. It's truly hard to mess up. You can also adjust the quantity based on your needs. I typically make six portions — three for me, and three for my husband — because there's usually a day or two during the week when we eat with colleagues or friends. Plus, after three days of eating the same meal, I'm typically ready to mix it up. I drizzle a tahini mixture over my bowl for added flavor. Rachel Hosie To add variety to my days, I prep these with varying dressings and protein sources. My favorite dressing i", "date_str": "2026-10-14T13:10:26+00:00", "hash": "a1ce38161ba967d5", "title_fa": "من تقریبا هر روز همان ناهار مورد تایید متخصص تغذیه را می خورم. فیبر و پروتئین دارد - و آماده شدن از قبل بسیار آسان است", "summary_fa": "من و شوهرم تقریباً هر روز در طول هفته ناهارهای یکسانی می خوریم. راشل هوزی من هر هفته یک وعده ناهار سرشار از پروتئین و فیبر را برای من و همسرم آماده می کنم. از آنجایی که من مواد، سس ها و چاشنی های کاسه غلات را با هم مخلوط می کنم، هرگز کهنه نمی شوند. کاسه های مغذی مناسب رژیم مدیترانه ای هستند و به من کمک می کنند تا اصل 80/20 را رعایت کنم. زمانی که در یک شهر بزرگ زندگی می‌کردم، دوست داشتم خودم را با ناهار در مکان‌های شیک سالاد پذیرایی کنم. اگرچه این وعده های غذایی خوشمزه بودند، اما برای کیف پول من وحشتناک بودند. از آن زمان به یک غذای پرشور تبدیل شده ام و اغلب ناهار خود را درست می کنم - تقریباً همیشه یک کاسه غلات حاوی فیبر و پروتئین - با کسری از قیمت. دستور العملی که من استفاده می کنم با اصل تغذیه 80/20 من مطابقت دارد، به این معنی که 80٪ مواقع غذاهای غنی از مواد مغذی می خورم و برای 20٪ دیگر نگران تغذیه نیستم. کاسه‌های غلات آنقدر مغذی هستند که من احساس آرامش می‌کنم که گاهی اوقات برای یک ناهار با مواد مغذی کمتر بیرون می‌روم، زیرا می‌دانم که بیشتر اوقات به اهداف تغذیه‌ای خود می‌رسم. در اینجا نحوه درست کردن ناهار است که به من کمک می کند در مسیر درست بمانم. آماده سازی و سفارشی کردن این کاسه های غلات آسان است. راشل هوزی من هر هفته با موادی که در کاسه غلاتم می‌ریزم بازی می‌کنم، اما آنها همیشه از یک فرمول پیروی می‌کنند: فهرست مواد تشکیل دهنده کاسه غلات من: غلات، مانند کینوا، برنج سبوس‌دار، یا گندم سیاه لوبیا یا حبوبات، مانند نخود، ادامه، یا عدس، منبع پروتئینی مانند حبوبات، حبوبات گوجه فرنگی، چغندر یا پیازچه سبزیجات برشته مانند کدو حلوایی، فلفل دلمه ای،"}, {"source": "Business Insider", "title": "Redwood Materials has a new business: Helping AI data centers avoid America's backed-up electric grid", "link": "https://www.businessinsider.com/redwood-materials-recycled-ev-batteries-power-ai-data-centers-2026-10", "summary": "JB Straubel, co-founder and chief executive officer of Redwood Materials. Bloomberg/Getty Images Redwood Materials wants to help AI data centers get electricity faster. It plans to combine retired EV batteries with solar and other on-site power sources. Redwood is working with Rivian and has built a battery system for Crusoe in Nevada. Redwood Materials wants to help companies sidestep years-long waits for electricity by building on-site energy systems with recycled EV batteries, according to CEO JB Straubel . The battery recycling startup is expanding beyond collecting and processing old electric-vehicle batteries. It's increasingly pitching itself as a way for AI data centers to get power faster, without waiting for new connections to America's backed-up electric grid. \"Connecting to the grid can take years,\" Straubel wrote in a blog post on Wednesday. His solution is what the industry calls \" behind-the-meter \" energy systems, which operate without needing to connect to the grid. Redwood would combine second-life EV batteries with solar panels and other on-site power sources, allowing customers to generate and store electricity at their own facilities. A battery storage racking system from Redwood Materials Redwood Materials The company is already putting the idea into practice with Rivian. Redwood recycles used batteries from the EV maker and is installing energy storage systems at Rivian's manufacturing plants, building on a 10-megawatt-hour installation at the company's Illinois factory. Redwood is also packaging the batteries with its own power electronics and software, turning what began as a recycling business into a broader energy offering. The company launched its Redwood Energy division last year on the premise that EV batteries still have years of useful life after they're retired from cars. It has already built a large battery system for a Crusoe data center. Straubel's latest post makes clear where Redwood sees its biggest opportunity. \"The underlying problem is speed to power,\" he wrote, referring to the AI-fueled race to secure electricity. That marks another step in Redwood's evolution. Investors originally backed the company to recycle batteries. Today, it's increasingly selling something different: a faster way to bring power to energy-hungry AI data centers. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-10-14T13:00:01+00:00", "hash": "b1ccaca7f9dd471f", "title_fa": "Redwood Materials یک تجارت جدید دارد: کمک به مراکز داده هوش مصنوعی از شبکه برق پشتیبان‌گیری شده آمریکا جلوگیری می‌کند", "summary_fa": "JB Straubel، یکی از بنیانگذاران و مدیر اجرایی Redwood Materials. Bloomberg/Getty Images Redwood Materials می‌خواهد به مراکز داده هوش مصنوعی کمک کند تا برق را سریع‌تر دریافت کنند. این شرکت قصد دارد باتری‌های EV بازنشسته را با انرژی خورشیدی و دیگر منابع انرژی در محل ترکیب کند. Redwood با Rivian کار می کند و یک سیستم باتری برای Crusoe در نوادا ساخته است. به گفته جی بی استرابل، مدیرعامل شرکت Redwood Materials می‌خواهد به شرکت‌ها کمک کند تا با ساختن سیستم‌های انرژی در محل با باتری‌های EV بازیافتی، از انتظارات سال‌ها برای برق چشم پوشی کنند. راه اندازی بازیافت باتری فراتر از جمع آوری و پردازش باتری های قدیمی خودروهای الکتریکی است. این به طور فزاینده‌ای خود را به عنوان راهی برای مراکز داده هوش مصنوعی معرفی می‌کند تا بتوانند سریع‌تر انرژی دریافت کنند، بدون اینکه منتظر اتصالات جدید به شبکه برق پشتیبان‌گیری شده آمریکا باشند. استرابل روز چهارشنبه در یک پست وبلاگی نوشت: «اتصال به شبکه ممکن است سال ها طول بکشد. راه حل او چیزی است که صنعت آن را سیستم های انرژی «پشت متر» می نامد که بدون نیاز به اتصال به شبکه کار می کنند. ردوود باتری‌های برقی عمر دوم را با پنل‌های خورشیدی و دیگر منابع انرژی در محل ترکیب می‌کند و به مشتریان اجازه می‌دهد برق را در تاسیسات خود تولید و ذخیره کنند. یک سیستم قفسه بندی ذخیره سازی باتری از Redwood Materials Redwood Materials این شرکت در حال حاضر این ایده را با Rivian عملی می کند. Redwood باتری‌های مصرف‌شده سازنده خودروهای برقی را بازیافت می‌کند و در حال نصب سیستم‌های ذخیره‌سازی انرژی در کارخانه‌های تولیدی Rivian است که بر اساس نصب 10 مگاوات ساعت در کارخانه این شرکت در ایلینویز است. Redwood همچنین باتری‌ها را با تجهیزات الکترونیکی و نرم‌افزار قدرت خود بسته‌بندی می‌کند و آنچه را که به عنوان یک"}, {"source": "Business Insider", "title": "I moved from Texas to Europe 11 years ago. Here are my 5 biggest pros and cons of living abroad.", "link": "https://www.businessinsider.com/moving-to-europe-pros-cons-2026-10", "summary": "Leah Young. Courtesy of Leah Young Leah Young moved from Texas to Spain in 2015 to become a teaching assistant. What was meant to be a one-year stay has turned into a permanent life in Europe. Young, who now lives in France, said living abroad has come with its ups and downs. Leah Young always dreamed of moving to Europe , but when the opportunity finally came, taking the leap was terrifying. \"I had never lived abroad , and I didn't know anyone else who had,\" Young, 34, told Business Insider. \"I remember thinking, 'How practical is this, really?'\" It was 2015, and she was moving to Spain , a country worlds away from Texas, to work as a teaching assistant. It didn't matter that she had never been there or worked as a teacher before or that the $700 a month she would earn might not cover all her living expenses. For her, it was a chance to finally live abroad. What was meant to be only a year away from home turned into another year, then another, and more. During that time, she lived in Spain and traveled through Germany, Argentina, and Brazil. Last year, she moved to Lyon, France , a place she says finally \"feels like home.\" Young says she has become an expert at starting over after going through all its ups and downs. Here are five of the biggest pros and cons of living abroad, according to Young. Living abroad makes you a more well-rounded person… Young at the Eiffel Tower. Courtesy of Leah Young Growing up in Texas , Young's worldview was shaped by the people and places around her. But after 11 years of living abroad, she has a completely different understanding of how the world works and how people live in it. \"I didn't even realize how small my world was before,\" she said. \"We often see our own culture and hear our own language, and we have limited access to different ideas and perspectives.\" Being surrounded by new people has challenged the way Young thinks about planning her life, from earning money, building her career, and planning for retirement. \"That has been so valuable because you can't really get that just from reading or watching TV or movies,\" she said. \"I think it makes you a more well-rounded person.\" …but it takes time and effort to adapt to a new culture. The Basilica de Fourviere, a famous landmark in Lyon, France. Sergi Formoso/Getty Images Adapting to a new culture can take time — and a lot of trial and error. \"When you move outside your own country , you're entering a place with a different culture, language, and social norms,\" Youn", "date_str": "2026-10-14T12:57:01+00:00", "hash": "87a59f2838ed7f20", "title_fa": "11 سال پیش از تگزاس به اروپا نقل مکان کردم. در اینجا 5 بزرگترین مزایا و معایب زندگی در خارج از کشور آورده شده است.", "summary_fa": "لیا یانگ. با حسن نیت از لی یانگ لی یانگ در سال 2015 از تگزاس به اسپانیا نقل مکان کرد تا دستیار تدریس شود. چیزی که قرار بود اقامت یک ساله باشد، تبدیل به یک زندگی دائمی در اروپا شده است. یانگ که اکنون در فرانسه زندگی می کند، گفت که زندگی در خارج از کشور با فراز و نشیب هایی همراه بوده است. لی یانگ همیشه آرزوی مهاجرت به اروپا را داشت، اما زمانی که در نهایت فرصت پیش آمد، جهش وحشتناک بود. یانگ، 34 ساله، به بیزینس اینسایدر گفت: «من هرگز در خارج از کشور زندگی نکرده بودم و هیچ کس دیگری را نمی شناختم که چنین زندگی کرده باشد. یادم می‌آید فکر می‌کردم: «این واقعاً چقدر عملی است؟» در سال 2015 بود، و او در حال نقل مکان به اسپانیا، کشوری دور از تگزاس بود تا به عنوان دستیار تدریس کار کند. فرقی نمی‌کرد که او قبلاً هرگز آنجا نبوده یا به عنوان معلم کار نکرده است یا ۷۰۰ دلاری که در ماه به دست می‌آورد ممکن است تمام هزینه‌های زندگی‌اش را پوشش ندهد. برای او، این فرصتی بود تا در نهایت در خارج از کشور زندگی کند. چیزی که قرار بود فقط یک سال از خانه دور باشد به سالی دیگر تبدیل شد، سپس به سالی دیگر و بیشتر تبدیل شد. در آن زمان، او در اسپانیا زندگی می کرد و از طریق آلمان، آرژانتین و برزیل سفر کرد. سال گذشته، او به لیون، فرانسه نقل مکان کرد، جایی که او می گوید در نهایت \"احساس می کند خانه است.\" یانگ می‌گوید که پس از پشت سر گذاشتن تمام فراز و نشیب‌ها، در شروع دوباره به یک متخصص تبدیل شده است. به گزارش یانگ، در اینجا پنج مورد از بزرگترین مزایا و معایب زندگی در خارج از کشور آورده شده است. زندگی در خارج از کشور"}, {"source": "Business Insider", "title": "Billion Dollar Boy just made an acquisition that points to influencer marketing’s next hot opportunity", "link": "https://www.businessinsider.com/billion-dollar-boy-group-acquires-creator-authority-influencer-marketing-agency-2026-10", "summary": "Creator Authority is joining Billion Dollar Boy. Pictured: Creator Authority s Brendan Gahan and Cassie Jackson with Billion Dollar Boy Group CEO Ed East. Billion Dollar Boy Group A version of this post appears in the CMO Insider newsletter. Sign up for Business Insider's weekly marketing newsletter . A new M A deal signals that \"business-to-business\" could be the next hot growth area in the creator economy. The social and influencer marketing company Billion Dollar Boy Group exclusively told CMO Insider that it acquired the B2B influencer marketing agency Creator Authority. Creator Authority connects brands with content creators, providing services that include contracts, licensing, and campaign management. The companies declined to disclose the specific financial terms, beyond that it is an all-cash, \"multimillion-dollar\" deal with an earnout component. Following the acquisition, BDB Group said it forecasts its 2027 revenue will exceed $100 million. BDB Group said its global revenue has grown 24% in the past 12 months. The deal started with a LinkedIn DM. In 2023, BDB Group cofounders Edward East and Thomas Walters were lapping up Brendan Gahan's content on LinkedIn about how B2B creators were finding success on the platform. Gahan hadn't yet launched Creator Authority, but was increasingly becoming a B2B influencer himself. East got in touch to arrange an intro call, and they kept in touch for regular catch-ups before the conversation evolved into takeover talks. The LinkedIn message Billion Dollar Boy Group s Ed East sent to Creator Authority s Brendan Gahan that laid the early groundwork for the deal. Courtesy of Ed East \"I'm so excited about the B2B space,\" Gahan, who will take the role of senior vice president of B2B at Billion Dollar Boy, told me. \"It feels like YouTube in 2010; there's this moment when it just explodes, and I'm excited to grow with it.\" The creator economy gets a B2B infusion Dealmaking in the creator economy has been accelerating. There were 70 creator economy M A transactions in the first half of 2026, according to the advisory firm Quartermast Advisors . That was up 23% year-over-year, making it the busiest first half of creator deals on record, with agencies accounting for around a fifth (21.4%) of transactions, per Quartermast, which advised Creator Authority on the sale. Notable recent deals include Accenture Song's acquisition of the creator and social agency Whalar in July, Publicis Groupe picking up the French creator age", "date_str": "2026-10-14T12:00:02+00:00", "hash": "3fbfb14171d08aad", "title_fa": "Billion Dollar Boy به تازگی خریدی انجام داده است که به فرصت داغ بعدی اینفلوئنسر مارکتینگ اشاره دارد", "summary_fa": "Creator Authority به Billion Dollar Boy می پیوندد. در تصویر: برندان گاهان و کاسی جکسون از Creator Authority به همراه مدیر عامل Billion Dollar Boy Group Ed East. Billion Dollar Boy Group نسخه ای از این پست در خبرنامه CMO Insider ظاهر می شود. برای خبرنامه بازاریابی هفتگی Business Insider ثبت نام کنید. یک معامله جدید M A نشان می دهد که «تجارت به کسب و کار» می تواند حوزه رشد داغ بعدی در اقتصاد خالق باشد. شرکت بازاریابی اجتماعی و تأثیرگذار Billion Dollar Boy Group به طور انحصاری به CMO Insider گفت که آژانس بازاریابی تأثیرگذار B2B Creator Authority را خریداری کرده است. Creator Authority برندها را با سازندگان محتوا مرتبط می کند و خدماتی را ارائه می دهد که شامل قراردادها، مجوزها و مدیریت کمپین می شود. شرکت‌ها از افشای شرایط مالی خاص خودداری کردند، فراتر از این که این یک معامله کاملا نقدی و «میلیون دلاری» با یک جزء سود است. پس از خرید، گروه BDB گفت که پیش بینی می کند درآمد سال 2027 آن از 100 میلیون دلار فراتر رود. گروه BDB اعلام کرد درآمد جهانی آن در 12 ماه گذشته 24 درصد رشد داشته است. معامله با یک DM LinkedIn شروع شد. در سال 2023، ادوارد ایست و توماس والترز، بنیانگذاران گروه BDB، محتوای برندان گاهان را در لینکدین در مورد چگونگی موفقیت سازندگان B2B در این پلتفرم پخش می کردند. Gahan هنوز Creator Authority را راه‌اندازی نکرده بود، اما به طور فزاینده‌ای خودش به یک تأثیرگذار B2B تبدیل می‌شد. شرق برای ترتیب دادن یک تماس مقدماتی با هم تماس گرفت و قبل از اینکه گفتگو به مذاکرات تصاحب تبدیل شود، برای پیگیری منظم در تماس بودند. پیام LinkedIn Billion Dollar Boy Group توسط Ed East به برندان گاهان از Creator Authority ارسال شد که مقدمات اولیه این معامله را ایجاد کرد. گاهان، که"}, {"source": "Business Insider", "title": "Othello uses AI to tell salespeople what to say during calls. See the pitch deck that helped it raise $8 million.", "link": "https://www.businessinsider.com/othello-raises-millions-sales-reps-ai-realtime-recommendations-pitch-deck-2026-10", "summary": "Othello, cofounded by Jared Zelman and Raphael Assor, just raised an $8 million seed funding round. Othello Othello gives salespeople real-time, AI-powered recommendations to improve their sales calls. It uses reinforcement learning to coach reps in pitches modeled on their company's top performers. Othello just raised $8 million in a round led by A16z Speedrun and Owl Capital. Jared Zelman has been honing his sales pitch since college, when he spent his spare time cold-emailing billionaires and prominent investors , hoping to forge a connection. His extracurricular activities helped lay the groundwork for his current startup, Othello, a platform that uses AI to give salespeople real-time coaching tips to improve their sales calls. Othello exclusively told CMO Insider on Wednesday that it had raised an $8 million seed funding round, led by Andreessen Horowitz 's startup accelerator A16z Speedrun, and Owl Capital. Othello listens in on video calls and uses AI trained on a company's uploaded sales and product materials to suggest questions to ask, answer tricky queries, and flag missed opportunities in real time through an on-screen overlay. \"Too many good deals are killed by bad calls,\" said Zelman, who is now 24 and was using Othello to help respond to questions during our interview. Zelman said he evolved the idea for Othello at his second startup, Cicero, which created AI avatars for prominent authors and podcasters. Zelman said he struggled to sell the idea to enterprise prospects and used to have a friend stand behind his computer holding up cue cards to help steer him through his sales calls. \"I was like, 'Hey, I'm just going to build this for everybody,'\" Zelman said. \"In sales, you can outsource and use AI to do everything except for the one important part of the job, which is the sales call.\" Othello says its AI models are trained on 20 million hours of recorded sales calls and that its platform can be integrated with business software platforms such as Google Workspace, Salesforce, Slack, and ServiceNow. The company says customers' data is not used to train AI models shared with other businesses. Its customers include Microsoft and Capital One. Othello isn't the first company to use AI to help salespeople. It's a much smaller challenger to rivals such as Gong and Salesloft, which offer tools to analyze sales conversations, with Salesloft also providing real-time coaching. Gong and Salesloft have raised hundreds of millions of dollars and have mult", "date_str": "2026-10-14T12:00:01+00:00", "hash": "d3e2e3564ad6ac49", "title_fa": "اتللو از هوش مصنوعی استفاده می کند تا به فروشندگان بگوید در طول تماس چه چیزی بگویند. نگاهی به زمین بازی که به جمع آوری 8 میلیون دلار کمک کرد را ببینید.", "summary_fa": "اتلو، که توسط جرد زلمن و رافائل آسور موسس شد، به تازگی یک دور سرمایه اولیه 8 میلیون دلاری جمع آوری کرده است. Othello Othello به فروشندگان توصیه هایی را در زمان واقعی و مبتنی بر هوش مصنوعی برای بهبود تماس های فروش خود ارائه می دهد. از یادگیری تقویتی برای مربیگری تکرارها در زمین‌های با الگوبرداری از بهترین عملکردهای شرکتشان استفاده می‌کند. اتللو به تازگی 8 میلیون دلار در دوری به رهبری A16z Speedrun و Owl Capital جمع آوری کرد. جارد زلمن از زمان کالج، زمانی که اوقات فراغت خود را با ایمیل سرد به میلیاردرها و سرمایه گذاران برجسته سپری می کرد، به پیشرفت فروش خود پرداخته است، به این امید که ارتباط برقرار کند. فعالیت های فوق برنامه او به ایجاد زمینه برای استارتاپ فعلی او، Othello کمک کرد، پلتفرمی که از هوش مصنوعی برای ارائه نکات مربیگری در زمان واقعی به فروشندگان برای بهبود تماس های فروششان استفاده می کند. اتلو به طور انحصاری در روز چهارشنبه به CMO Insider گفت که یک دور سرمایه گذاری اولیه 8 میلیون دلاری به رهبری شتاب دهنده استارت آپی Andreessen Horowitz A16z Speedrun و Owl Capital جمع آوری کرده است. اتللو به تماس‌های ویدیویی گوش می‌دهد و از هوش مصنوعی آموزش‌دیده بر روی فروش‌های بارگذاری‌شده و مواد محصول یک شرکت استفاده می‌کند تا سؤالاتی را برای پرسیدن، پاسخ دادن به سؤالات پیچیده، و پرچم‌گذاری فرصت‌های از دست رفته در زمان واقعی از طریق یک پوشش روی صفحه نمایش دهد. زلمن که اکنون 24 ساله است و از اتللو برای کمک به پاسخگویی به سؤالات در طول مصاحبه ما استفاده می‌کند، گفت: «تعاملات بسیار خوب با تماس‌های بد از بین می‌روند.» زلمن گفت که ایده Othello را در دومین استارتاپ خود، Cicero که آواتارهای هوش مصنوعی برای نویسندگان و پادکست‌های برجسته ایجاد کرد، تکامل بخشید. زلمن گفت که برای فروش"}, {"source": "Business Insider", "title": "Bilt’s CMO is betting big on marketing that's hard to measure", "link": "https://www.businessinsider.com/bilts-marketing-strategy-to-become-generation-defining-brand-2026-10", "summary": "The launch of the Bilt Locals merch collection is part of a strategy to turn customers into willing brand ambassadors. Bilt A version of this post appears in the CMO Insider newsletter. Sign up for Business Insider's weekly marketing newsletter . Bilt CMO Zoe Oz thinks traditional advertising is losing its power. Her alternative? Turning customers into willing brand ambassadors. The fintech loyalty platform is investing heavily in entertainment, live experiences, and covetable merchandise — though Oz readily admits these tactics are more difficult to measure directly than paid ads. In September, Bilt launched its Locals Collection, a range of vintage-inspired apparel and accessories that members could purchase with Bilt Points , Bilt Cash, or a linked card. Bilt said an October pop-up event in New York City drew long lines, and most items sold out. The most popular included a motel keychain, diner mug, and $150 \"bodega crew\" sweater. Since launching the Bilt Collection in 2021, Bilt said members have redeemed more than 70 million points and spent over $800,000 across more than 60,000 orders. \"If you're making merch, it really should be something that someone chooses to wear, not just because it's affiliated with the brand, but actually because they want to wear it,\" Oz told me. The goal, she added, is to create \"a tiny moment that Bilt gets mentioned without it having to be Bilt mentioning it ourselves.\" Selling sweaters and keychains might seem like an unusual move for a company best known for rewarding people for paying their rent. But Oz sees the collection as part of a much bigger ambition: turning Bilt into a lifestyle brand. \"We want to be a generation-defining brand,\" Oz said. \"You don't get to do that if you're just providing a financial service and leaving it at that. You really have to spend time integrating yourself into what the member does every single day.\" 'Do they have the staying power?' Matt Powell, CEO of the mark
