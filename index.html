<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۷ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۷ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۸ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۰۶:۴۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۶۲</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۴۱</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۰۷</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

ی mRNA که مدرنا توسعه داده است روی ۲۲۴ داوطلب در اوگاندا آزمایش می‌شود، زیرا مقام‌های بهداشت در تلاش‌اند با شیوع مرگبار ابولا که هزاران نفر را در جمهوری دموکراتیک کنگو همسایه کشته است مقابله کنند.", "image_url": "https://images.euronews.com/articles/stories/10/01/20/75/1200x675_cmsv2_ebc7272b-ba5d-52f9-adb6-046ed2c09d1c-10012075.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۷ آذر • ۰۱:۱۷"}, {"source": "IranWire", "title": "لغو حکم «رای باز» یعقوب محمدی، معلم اخراجی اهل آبدانان", "link": "https://iranwire.com/fa/news-1/160856-%D9%84%D8%BA%D9%88-%D8%AD%DA%A9%D9%85-%D8%B1%D8%A7%DB%8C-%D8%A8%D8%A7%D8%B2-%DB%8C%D8%B9%D9%82%D9%88%D8%A8-%D9%85%D8%AD%D9%85%D8%AF%DB%8C-%D9%85%D8%B9%D9%84%D9%85-%D8%A7%D8%AE%D8%B1%D8%A7%D8%AC%DB%8C-%D8%A7%D9%87%D9%84-%D8%A2%D8%A8%D8%AF%D8%A7%D9%86%D8%A7%D9%86/", "summary": "بر اساس گزارش سازمان حقوق بشری «هه‌نگاو»، حکم رای باز حبس «یعقوب محمدی»، شهروند کرد معلم اخراجی، زندانی سیاسی سابق و از چهره‌های سرشناس ...", "date_str": "2026-11-27T21:05:32+00:00", "hash": "121a6b5665df74b2", "title_fa": "لغو حکم «رای باز» یعقوب محمدی، معلم اخراجی اهل آبدانان", "summary_fa": "بر اساس گزارش سازمان حقوق بشری «هه‌نگاو»، حکم رای باز حبس «یعقوب محمدی»، شهروند کرد معلم اخراجی، زندانی سیاسی سابق و از چهره‌های سرشناس ... روند قبلی اجرای حکم این معلم سابق، به‌صورت هفته‌ای یک شب حضور در زندان در حال اجرا بود. بر اساس این گزارش روز چهارشنبه ۴آذرماه۱۴۰۵ یعقوب محمدی، هنگامی که طبق روال مقرر برای سپری کردن یک شب حبس هفتگی و امضای حضور به زندان «ماهپاره» دره‌شهر مراجعه کرده بود، با دستور مسوولان زندان و نهادهای امنیتی مبنی بر لغو این شیوه اجرای حکم و الزام به سپری کردن کامل باقی‌مانده دوران حبس در داخل زندان مواجه و بازداشت شده است. به گفته منابع مطلع، این تصمیم به‌دلیل آنچه مسوولان سپاه پاسداران «وضعیت خاص آبدانان» توصیف کرده‌اند و به‌دلیل اعتراضات مردمی در واکنش به جان‌باختن ۱۳ تن از کارکنان شرکت پتروپالایش دهلران در سانحه رانندگی گرفته شده است. گفته شده که فشارها بر چهره‌های مدنی و فرهنگی آبدانان پس از سفر اخیر «محمدرضا نقدی»، از  در افراد مختلف متفاوت است.این موارد در حالی ثبت شده‌اند که موج تازه مسمومیت با مشروبات الکلی تقلبی در چند استان ایران، در روزهای اخیر به مرگ شماری از مصرف‌کنندگان منجر شده است. در نیشابور، شمار مراجعه‌کنندگان با علائم مسمومیت الکلی تا صبح جمعه ۶ آذر به ۲۴۰ نفر رسیده است. به گفته «سیدمیلاد تقدیسی»، معاون درمان دانشگاه علوم پزشکی نیشابور، تاکنون پنج نفر جان باخته‌اند، سه نفر دچار مرگ مغزی شده‌اند و ۲۹ نفر همچنان در بیمارستان بستری هستند. از میان مسمومان، ۱۴۳ نفر نیز به دیالیز نیاز پیدا کرده‌اند. در استان هرمزگان نیز شمار مسمومان تا صبح جمعه به ۱۲۶ نفر رسیده و ۱۰نفر جان خود را از دست داده‌اند. از این تعداد، ۹ نفر در بندرعباس و یک نفر در قشم فوت کرده‌اند. بندرعباس با ۱۱۰ مورد مسمومیت، بیشترین آمار را در این استان دارد. افزایش موارد مسمومیت در این استان‌ها در حالی ادامه دارد که گزارش‌های پیشین از مسمومیت با مشروبات الکلی تقلبی در فارس نیز به ثبت دست‌کم یک مورد مرگ در شیراز اشاره داشتند. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/42223321_803_RBoK__v1024x512__box_0%2C4%2C575%2C306.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آذر • ۲۲:۰۵"}, {"source": "Iran International", "title": "در پی تاکید تهران بر شکستن محاصره، سنتکام به یک کشتی تجاری پس از خروج از بندرعباس حمله کرد", "link": "https://www.iranintl.com/202611278540", "summary": "فرماندهی مرکزی ارتش آمریکا، سنتکام، اعلام کرد یک کشتی تجاری را که پس از خروج از بندرعباس تلاش کرده بود از محاصره دریایی آمریکا عبور کند، در دریای عمان هدف قرار داده و از حرکت بازداشته است.", "date_str": "2026-11-27T18:28:28+00:00", "hash": "4590f70756aa06fa", "title_fa": "در پی تاکید تهران بر شکستن محاصره، سنتکام به یک کشتی تجاری پس از خروج از بندرعباس حمله کرد", "summary_fa": "فرماندهی مرکزی ارتش آمریکا، سنتکام، اعلام کرد یک کشتی تجاری را که پس از خروج از بندرعباس تلاش کرده بود از محاصره دریایی آمریک یه روز جمعه ۶آذر۱۴۰۵ گزارش دادند که شرکت خدمات زمینی فرودگاهی «فوگو» در این کشور اعلام کرده که از تاریخ نهم آذرماه سال جاری ... بر اساس گزارش‌ها، شرکت فوگو به کارمندان و مشتریان خطوط هوایی خود اعلام کرده است که به دلیل تحریم‌های آمریکا قادر به ادامه فعالیت نخواهد بود. مدیر این شرکت بر اینکه فعالیت‌ها آن‌ها در چهارچوب قوانین ترکیه بوده است، این تحریم‌ها را «ناعادلانه» خواند و گفت که وضع تحریم‌ها، فعالیت فوگو را غیرممکن کرده است. وزارت دارایی آمریکا، در راستای عملیات «انزوای اقتصادی ایران» در ۱۳آبان۱۴۰۵، شرکت فوگو را تحریم کرد.این وزارتخانه در آن زمان اعلام کرد که شرکت فوگو با شش شرکت هواپیمایی ایرانی تحریم‌شده، از جمله ایران ایر تور، هواپیمایی ساها و هواپیمایی سپهران، قراردادهای خدماتی مستقیم داشته است. به گفته وزارت دارایی آمریکا، شرکت فوگو با چند شرکت هواپیمایی ایران، پس از آنکه از سوی آمریکا تحریم شدند قرارداد بسته است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/images_26_HLJQ__v1024x512__box_0%2C78%2C450%2C315.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۶ آذر • ۲۱:۴۱"}, {"source": "Iran International", "title": "نماینده پارلمان آلمان کفالت سیاسی وریشه مرادی، زندانی سیاسی محکوم به اعدام، را پذیرفت", "link": "https://www.iranintl.com/202611275484", "summary": "یورگن هارت، نماینده پارلمان فدرال آلمان و سخنگوی سیاست خارجی فراکسیون احزاب دموکرات مسیحی و سوسیال مسیحی، اعلام کرد کفالت سیاسی وریشه مرادی، زندانی سیاسی محکوم به اعدام را بر عهده گرفته است. او گفت هدفش از پذیرش این کفالت، جلب توجه افکار عمومی و افزایش فشار بر جمهوری اسلامی است.", "date_str": "2026-11-27T17:49:33+00:00", "hash": "ab3f96b12b2a9623", "title_fa": "نماینده پارلمان آلمان کفالت سیاسی وریشه مرادی، زندانی سیاسی محکوم به اعدام، را پذیرفت", "summary_fa": "یورگن هارت، نماینده پارلمان فدرال آلمان و سخنگوی سیاست خارجی فراکسیون احزاب دموکرات مسیحی و سوسیال مسیحی، اع الاتر از آستانه هشدار", "link": "https://iranwire.com/fa/news-1/160852-%D8%B4%DB%8C%D9%88%D8%B9-%D8%A2%D9%86%D9%81%D9%84%D9%88%D8%A2%D9%86%D8%B2%D8%A7-%D8%AF%D8%B1-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%B4%D8%AF%D8%AA-%DA%AF%D8%B1%D9%81%D8%AA-%DB%B2%DB%B6-%D8%A7%D8%B3%D8%AA%D8%A7%D9%86-%D8%A8%D8%A7%D9%84%D8%A7%D8%AA%D8%B1-%D8%A7%D8%B2-%D8%A2%D8%B3%D8%AA%D8%A7%D9%86%D9%87-%D9%87%D8%B4%D8%AF%D8%A7%D8%B1/", "summary": "هم‌زمان با افزایش موارد ابتلا به بیماری‌های تنفسی در ایران و گزارش‌هایی از مرگ دانش‌آموزان در پی ابتلا به بیماری‌های تنفسی، مرکز مدیریت ...", "date_str": "2026-11-27T16:23:28+00:00", "hash": "61fc7532d57aa9fc", "title_fa": "شیوع آنفلوآنزا در ایران شدت گرفت؛ ۲۶ استان بالاتر از آستانه هشدار", "summary_fa": "هم‌زمان با افزایش موارد ابتلا به بیماری‌های تنفسی در ایران و گزارش‌هایی از مرگ دانش‌آموزان در پی ابتلا به بیماری‌های تنفسی، مرکز مدیریت ... بر اساس تازه‌ترین آمار این مرکز، نسبت نمونه‌های مثبت آنفلوآنزا به ۳۰.۷ درصد رسیده و ۲۶ استان کشور از آستانه هشدار بالای این بیماری عبور کرده‌اند. در همین حال، گزارش‌های محلی از افزایش بیماری‌های تنفسی در مدارس ایران حکایت دارد.بر اساس گزارش روزنامه «صبح ساحل» که در هرمزگان منتشر می‌شود، پس از درگذشت دو دانش‌آموز پسر در سیرجان و افزایش نگرانی‌ها درباره بیماری‌های تنفسی در مدارس این شهرستان، آموزش‌وپرورش سیرجان اعلام کرد مدارس این شهرستان روز شنبه هفتم آذر۱۴۰۵ غیرحضوری خواهند بود. «مجید اسفندیارپور»، مدیر آموزش‌وپرورش سیرجان، گفته است تعدادی از دانش‌آموزان در برخی مدارس به سرماخوردگی شدید یا آنفلوآنزای حاد مبتلا شده‌اند و تصمیم‌گیری درباره تعطیلی چندروزه یا بازگشایی مدارس به بررسی وضعیت در روز شنبه موکول شده است. بر اساس گزارش مرکز مدیریت بیماری‌های واگیر وزارت بهداشت که روز دوم آذر ۱۴۰۵ منتشر شد، در هفته منتهی به ۲۹ آبان، ۸.۸ درصد از مراجعان سرپایی دارای علائم شبه‌آنفلوانزا و ۱۳.۸ درصد از مراجعان بستری دارای علائم عفونت تنفسی شدید بوده‌اند. این ارقام در هفته پیش از آن به ترتیب ۹.۴ و ۱۰.۶ درصد بود. به این ترتیب، با وجود کاهش نسبی علائم شبه‌آنفلوانزا در میان مراجعان سرپایی، سهم بیماران بستری با علائم شدید تنفسی افزایش یافته است. این گزارش همچنین نشان می‌دهد نسبت نمونه‌های مثبت آنفلوآنزا در نظام مراقبت دیده‌وری به ۳۰.۷ درصد رسیده است؛ رقمی که بیش از سه برابر آستانه هشدار بالا محسوب می‌شود. این میزان در هفته مشابه سال گذشته نیز ۳۰.۷ درصد گزارش شده بود. بر اساس داده‌های آزمایشگاهی وزارت بهداشت، از مجموع ۸ هزار و ۴۳۹ نمونه تنفسی بررسی‌شده در آزمایشگاه‌های مولکولی دانشگاه‌های علوم پزشکی کشور، یک‌هزار و ۵۱۱ نمونه، معادل ۱۷.۹ درصد، از نظر آنفلوآنزا مثبت بوده‌اند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/images_25_xnuS__v1024x512__box_62%2C0%2C678%2C324.jpeg", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آذر • ۱۹:۵۳"}, {"source": "Euronews Persian", "title": "راز ۷۹ اسکلت دست‌بسته در یونان؛ موزه‌ای برای قربانیان اعدام‌های مرموز آتن باستان افتتاح شد", "link": "https://parsi.euronews.com/2026/11/27/greece-athens-phaliron-captives-79-ancient-skeletons-museum-opens", "summary": "در آتن موزه‌ای برای ۷۹ قربانی مرموز دوران باستان افتتاح شد؛ مردانی که حدود ۲۷۰۰ سال پیش با دستان بسته کشته و در سه گور دسته‌جمعی دفن شدند. باستان‌شناسان احتمال می‌دهند اعدام آن‌ها انگیزه سیاسی داشته باشد، اما هویت و سرنوشت دقیقشان همچنان ناشناخته است.", "date_str": "2026-11-27T16:16:09+00:00", "hash": "33f5d4145826218b", "title_fa": "راز ۷۹ اسکلت دست‌بسته در یونان؛ موزه‌ای برای قربانیان اعدام‌های مرموز آتن باستان افتتاح شد", "summary_fa": "در آتن موزه‌ای برای ۷۹ قربانی مرموز دوران باستان افتتاح شد؛ مردانی که حدود ۲۷۰۰ سال پیش با دستان بسته کشته و در سه گور دسته‌جمعی دفن شدند. باستان‌شناسان احتمال می‌دهند اعدام آن‌ها انگیزه سیاسی داشته باشد، اما هویت و سرنوشت دقیقشان همچنان ناشناخته است.", "image_url": "https://images.euronews.com/articles/stories/10/00/91/00/1200x675_cmsv2_cdfc0cc7-fe33-52c8-b4fc-e7983192d67c-10009100.jpg", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آذر • ۱۹:۴۶"}, {"source": "Euronews Persian", "title": "گزارش تازه درباره سقوط هواپیمای رئیس‌جمهوری لهستان در روسیه؛ کارشناسان احتمال انفجار را رد کردند" ت: «محمد توتونچی، سفیر جمهوری اسلامی ایران در کویت، احضار و یادداشت اعتراض رسمی درباره حملات مستمر ایران به کویت، از جمله تازه‌ترین حمله پهپادی در روز پنج‌شنبه به یک تأسیسات حیاتی در این کشور که به کشته شدن دو شهروند ایتالیایی منجر شد، به او تسلیم شد.» ایران علاوه بر هدف قرار دادن کشتی‌های تجاری و نفتکش‌ها در تنگه هرمز، طی هفته گذشته حملات خود به کویت و بحرین را نیز افزایش داده است. با این حال، وزیر امور خارجه ایران و مقام‌های نظامی این کشور دخالت تهران در حمله‌ای را که به کشته شدن دو کارمند شرکت دفاعی آلمانی راین‌متال انجامید، رد کرده‌اند. این دو نفر هنگام کار روی یک سامانه پدافند هوایی هدف حمله قرار گرفتند. یک شهروند کویتی و یک تبعهٔ پاکستانی نیز در این حمله زخمی شدند. روز پنجشنبه عباس عراقچی، وزیر امور خارجه ایران، در تماس‌های تلفنی جداگانه با جراح جابر الاحمد الصباح، همتای کویتی خود، و آنتونیو تایانی، وزیر امور خارجه ایتالیا، هرگونه نقش تهران در این حمله را رد کرده است. وزارت امور خارجه ایران در بیانیه‌ای درباره تماس عراقچی با تایانی اعلام کرد: «عراقچی تصریح کرد که ایران به هیچ وجه در وقوع این حادثه نقشی نداشته و دخالتی نکرده است.» این وزارتخانه افزود که وزیر امور خارجه ایران آمادگی تهران را برای همکاری با کویت و ایتالیا به‌منظور «تعیین منشأ این حادثه» اعلام کرده است. ایتالیا می‌گوید دو شهروندش در حمله پهپادی ایران به کویت کشته شدند؛ ایران منکر حمله شد این در حالی است که اورسولا فون", "image_url": "https://gdb.rferl.org/C3D82E67-2B28-4C20-B7F4-2B68B555F6AE_w1200_h630.jpg", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آذر • ۱۹:۱۰"}, {"source": "Euronews Persian", "title": "خشکسالی بی‌سابقه در جنوب انگلیس؛ بریتانیا پس از ۳۰ سال ساخت مخزن بزرگ آب را آغاز کرد", "link": "https://parsi.euronews.com/2026/11/27/uk-southern-england-drought-first-new-reservoir-30-years-havant-thicket", "summary": "خشکسالی شدید و گرمای رکوردشکن در جنوب انگلیس، بریتانیا را پس از ۳۰ سال به ساخت مخزن بزرگ آب واداشت. پروژه ۸۰۰ میلیون پوندی هاونت تیکت تا سال ۲۰۳۲ تکمیل می‌شود. کارشناسان هشدار می‌دهند این کشور تا سال ۲۰۵۵ ممکن است روزانه با کمبود پنج میلیون مترم  Athletica Inc. in 1997 after selling his first apparel company. During his tenure, Wilson became known for his inappropriate remarks and mishandling of scandals. He's been vocal about his negative views of Lululemon's leadership and continues to draw attention. Lululemon's billionaire founder, Chip Wilson, hasn't been at the helm in over a decade, but still continues to draw controversy to the brand. Wilson, an American-born Canadian, started Lululemon in the 90s and has been at the forefront of the athleisure movement , which is estimated to reach $623 billion by 2030, according to a November 2025 report . Wilson doesn't run the company — and hasn't in years — but isn't shy about voicing his opinions on how the brand should be run. Wilson has previously critiqued the company and even attempted to put new leadership in place . But outside the controversy within the company, Wilson has brought attention to himself in other ways. While speaking at a leadership conference in November, Wilson made comments to the audience suggesting women in Canada are having too few children, potentially leading to men seeking wives outside the country. He's still linked to Lululemon as the largest individual shareholder, and is in the top 50 richest Canadians, according to Canadian magazine Maclean's . He spends part of his fortune on philanthropy and researching a cure for the rare muscular disease called facioscapulohumeral muscular dystrophy, which he was diagnosed with at 32 years old. Here's everything we know about Wilson's life and career as the founder and former CEO of Lululemon. Dennis “Chip” Wilson was born in California and raised in Canada. Chip Wilson, Lululemon founder. Reuters Wilson lived in California up until the age of five when his family moved to Calgary. He relocated to Edmonton for university in 1973 before moving back to the US for work two years later, according to his website. He worked on an oil pipeline and as an economist before venturing into entrepreneurship. Michael Buckner/Getty He lived in Alaska and worked on an oil pipeline in 1975. During this time, Wilson said he read the top 100 books of all time. \"By the age of 19, I might have been the wealthiest, most traveled and best-read boy in the world,\" Wilson wrote on his website. He went on to become an economist after receiving his degree in economics from the University of Calgary in 1979. He attr", "date_str": "2026-11-28T00:39:47+00:00", "hash": "7a40f9d804bcbbd6", "title_fa": "با چیپ ویلسون، بنیانگذار Lululemon آشنا شوید، کسی که حتی به دور از شرکت هم به ایجاد جنجال ادامه می دهد.", "summary_fa": "چیپ ویلسون بنیانگذار Lululemon در سال 2017. جیم بنت/گتی ایماژ چیپ ویلسون شرکت Lululemon Athletica را در سال 1997 پس از فروش اولین شرکت پوشاک خود تأسیس کرد. ویلسون در دوران تصدی خود به خاطر اظهارات نامناسب و سوء استفاده از رسوایی ها شهرت یافت. او درباره دیدگاه‌های منفی خود نسبت به رهبری لولولمون صحبت می‌کند و همچنان توجه‌ها را به خود جلب می‌کند. موسس میلیاردر Lululemon، چیپ ویلسون، بیش از یک دهه است که در راس این شرکت نبوده است، اما همچنان به ایجاد جنجال در این برند ادامه می دهد. ویلسون، یک کانادایی زاده آمریکایی، Lululemon را در دهه 90 راه اندازی کرد و در خط مقدم جنبش ورزشکاران قرار داشت که طبق گزارش نوامبر 2025، تخمین زده می شود تا سال 2030 به 623 میلیارد دلار برسد. ویلسون شرکت را اداره نمی‌کند - و سال‌ها است که این کار را نکرده است - اما از بیان نظرات خود در مورد نحوه اداره برند خجالتی نیست. ویلسون قبلاً این شرکت را مورد انتقاد قرار داده و حتی تلاش کرده است تا رهبری جدید را به کار گیرد. اما خارج از جنجال درون شرکت، ویلسون از راه های دیگری توجه خود را به خود جلب کرده است. ویلسون هنگام سخنرانی در کنفرانس رهبری در ماه نوامبر، نظراتی را برای حضار بیان کرد که نشان می‌دهد زنان در کانادا فرزندان بسیار کمی دارند، که به طور بالقوه باعث می‌شود مردان در خارج از کشور به دنبال همسر باشند. او همچنان با Lululemon به عنوان بزرگترین سهامدار فردی مرتبط است و طبق مجله کانادایی Maclean در 50 ثروتمندترین کانادایی قرار دارد. او بخشی از ثروت خود را صرف امور خیریه و تحقیق در مورد درما b0a07f4d6c5d341c9b4de57?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۷ آذر • ۰۲:۴۴"}, {"source": "Business Insider", "title": "Aaron Rodgers just gave a masterclass in how not to quit your job", "link": "https://www.businessinsider.com/aaron-rodgers-steelers-exit-mike-mccarthy-how-not-to-quit-2026-11", "summary": "Aaron Rodgers was released by the Pittsburgh Steelers after a fiery interview the day before Thanksgiving. Terence Lewis/Icon Sportswire via Getty Images Aaron Rodgers' exit this week became a very public workplace blowup. Career experts explain how to quit a job without burning bridges. Most workers should leave with a plan, gratitude, and a clear next step. Aaron Rodgers has given workers everywhere a masterclass in how not to quit a job . Unless, perhaps, you're a four-time NFL MVP with more than $400 million in career earnings. On Wednesday, Rodgers went on \"The Pat McAfee Show\" after the Pittsburgh Steelers benched him and proceeded to torch head coach Mike McCarthy. The two have a long history: They spent 13 seasons together in Green Bay and won a Super Bowl in 2011. McCarthy is now in his first season as the Steelers' coach. Rodgers said McCarthy had missed meetings, fallen asleep during others, and accidentally ended a halftime huddle during Sunday's loss to the Eagles with: \"One, two, three — Packers!\" It was a stunning interview that The Athletic likened to an attempted \"coup.\" The Steelers released the 42-year-old quarterback hours later. He is now a free agent. Rodger's dramatic exit is not exactly a model for how to leave a job . As Business Insider's Tim Paradis reported in 2025 , quitting the right way typically requires separating your emotions from your actions. Alan Stein, the CEO of career-coaching firm Kadima Careers, told BI that this is advice he had to learn himself, having held 31 jobs and given notice dozens of times. \"Disassociate your emotions from your actions,\" he said, ware of the ad until after it ran. The ad drew backlash from prominent Jewish groups and on social media. The person said the ad won't run again, but it wasn't clear if it had been slated to. Shown during a \"Saturday Night Live\" Thanksgiving special, the ad begins by depicting a girl who saves up $400 over the course of a year to buy a new bicycle. It then switches to a different girl who is missing one leg and standing on crutches in front of a pile of rubble, before zooming out to a scene of destroyed buildings. \"Every three seconds, our government sends $400 of taxpayer money to Israel to do this,\" the ad's narrator says. It then invites viewers to visit the campaign site NoMoreForIsrael.com. The ad, which aired on Wednesday, was placed by the Institute for Middle East Understanding Policy Project, a US nonprofit organization that states its mission is to advocate for US policies that advance Palestinian rights and freedom. NBCU's decision to run the ad drew criticism from Jewish and Israel-focused advocacy groups, which argued that the 30-second spot made misleading and unsubstantiated claims about US aid and the war in Gaza. 'Facts out of context' In response to the ad, the Israeli-American Council nonprofit published a petition titled \"NBC, Where are your standards?\" It calls on the Federal Communications Commission to investigate whether the ad complied with its rules and for NBCU to review its approval process, suspend broadcasting the ad, and publicly apologize if it was approved \"without adequate factual substantiation.\" \"We, the undersigned, express our profound disappointment and outrage at the decision of one of America's leading broadcast networks to provide a national platform for an advertisement that, in our view, takes facts out of context and uses selective information and unsubstantiated accusations to construct a misleading narrative about a complex and painful reality,\" the petition reads. The National Jewish Advocacy Center published ity – and its institutions – to understand, let alone regulate, AI’s advances. Last Friday Levent Alpöge , a mathematician at Anthropic, said that he, with the assistance of an unreleased version of the company’s Claude chatbot, had produced what many mathematicians see as the holy grail: a proof for the Riemann hypothesis . Mathematicians like Cornell University’s Steven Strogatz had already cried on podcasts, lamenting that students were asking: “What’s the point if the AI can do math better than any human being?” Computers can validate the Alpöge-Claude proof. But Prof Strogatz fears AI’s discoveries may soon defy human understanding. Asking AI to explain them, he said, would be like him trying to teach calculus to his own dog. Continue reading...", "date_str": "2026-11-27T18:07:43+00:00", "hash": "3fe26236a245c67d", "title_fa": "دیدگاه گاردین در مورد هوش مصنوعی و فرضیه ریمان: پیروزی هوش، آزمون دموکراسی | سرمقاله", "summary_fa": "ماشین‌ها مشکلاتی را حل می‌کنند که فراتر از توان بشر بوده است. قدرت رو به رشد آنها نباید تنها متعلق به میلیاردرها باشد برای افراد عادی، این خبر که هوش مصنوعی به حل مشکلی کمک کرده است که از سال 1859 ریاضیدانان را به چالش کشیده است، ممکن است باعث ترس لحظه ای شود. آنچه باید همه را نگران کند، کشف فی نفسه نیست، بلکه آنچه در مورد قدرت ماشین‌های سازنده آن می‌گوید است. به نظر می‌رسد سرعت اکتشافات علمی از توانایی بشریت - و نهادهایش - برای درک پیشرفت‌های هوش مصنوعی فراتر رفته است، چه رسد به تنظیم کردن. جمعه گذشته، Levent Alpöge، یک ریاضیدان در Anthropic، گفت که او با کمک یک نسخه منتشرنشده از چت ربات کلود این شرکت، چیزی را تولید کرده است که بسیاری از ریاضیدانان آن را جام مقدس می دانند: اثباتی برای فرضیه ریمان. ریاضیدانانی مانند استیون استروگاتز از دانشگاه کرنل قبلاً در پادکست ها گریه کرده بودند و از دانشجویان می پرسیدند: \"اگر هوش مصنوعی بتواند ریاضی را بهتر از هر انسانی انجام دهد چه فایده ای دارد؟\" رایانه ها می توانند اثبات Alpöge-Claude را تأیید کنند. اما پروفسور استروگاتز نگران است که اکتشافات هوش مصنوعی به زودی درک انسان را به چالش بکشد. او گفت y apologize if it was approved \"without adequate factual substantiation.\" \"We, the undersigned, express our profound disappointment and outrage at the decision of one of America's leading broadcast networks to provide a national platform for an advertisement that, in our view, takes facts out of context and uses selective information and unsubstantiated accusations to construct a misleading narrative about a complex and painful reality,\" the petition reads. The National Jewish Advocacy Center published a five-page letter addressed to Mark Marshall, NBCU's chairman of global advertising and partnerships, asking NBC to explain and document its decision to approve the ad. The group told Business Insider it would hand-deliver the letter to NBCU on Friday. Citing FCC rules req", "date_str": "2026-11-27T17:19:35+00:00", "hash": "852a302efd9d3611", "title_fa": "تبلیغ «دیگر برای اسرائیل نیست» در جریان ویژه «SNL» پخش شد و واکنش شدید گروه‌های یهودی را به دنبال داشت.", "summary_fa": "پروژه سیاست IMEU/YouTube تبلیغی برای یک گروه حامی فلسطین در مراسم ویژه روز شکرگزاری \"SNL\" پخش شد. گروه های مدافع یهودی از پخش کننده NBC به دلیل پخش این آگهی انتقاد کردند. شورای اسرائیلی-آمریکایی از FCC خواست تا نحوه مدیریت تبلیغات NBC را بررسی کند. NBCUniversal پس از پخش آگهی یک سازمان حامی فلسطین که خواستار پایان دادن به حمایت ایالات متحده از اسرائیل شده بود، با واکنش شدید گروه‌های برجسته یهودی مواجه شد. این تبلیغ که در یک برنامه ویژه جشن شکرگزاری \"شنبه شب زنده\" نمایش داده می شود، با نشان دادن دختری شروع می شود که در طول یک سال 400 دلار برای خرید یک دوچرخه جدید پس انداز می کند. سپس به دختر دیگری تبدیل می‌شود که یک پاش را از دست داده است و روی چوب زیر بغل در مقابل انبوهی از آوار ایستاده است، قبل از اینکه به صحنه ساختمان‌های ویران شده زوم کند. گوینده آگهی می گوید: «دولت ما هر سه ثانیه 400 دلار از پول مالیات دهندگان را به اسرائیل می فرستد تا این کار را انجام دهد. سپس از بینندگان دعوت می کند تا از سایت کمپین NoMoreForIsrael.com بازدید کنند. این آگهی که روز چهارشنبه پخش شد، توسط موسسه پروژه سی zing, pushing people further to the left and right. Jensen Huang's stunning return to Nvidia sent investors into raptures, but it has rankled many others and could have sweeping repercussions, veteran economist Steve Hanke says. \"Thanks to the likes of Jensen Huang, I think that we are entering an age of resentment that promises a great many problems in the sphere of economic policy,\" Hanke told Business Insider. Huang resigned as Nvidia's CEO on November 12 following reports that he had extramarital affairs with a suspected Chinese spy and a direct report. He was reinstated 11 days later, on November 23, after President Donald Trump urged the company's board to bring him back. The news sent Nvidia stock up 31% on the day, adding nearly $1 trillion to the AI chipmaker's market capitalization, but it has since given up some of those gains. The conduct of Silicon Valley types like Huang \"flouts the moral sentiments and rules that govern and control most people's behavior,\" fueling public bitterness toward \"this new class of big players,\" Hanke said. The professor of applied economics at Johns Hopkins University, who served on President Ronald Reagan's Council of Economic Advisers, said many onlookers are indignant because they feel they've been \"treated unfairly\" by comparison, and have been \"slighted, or abandoned, or humiliated.\" In other words, they see a lack of accountability for the likes of Huang and believe they can break the rules without any lasting consequences. A big reason for the push to bring back Huang was that he's widely considered the face of AI and integral to US success in the budding sector, given Nvidia's central role in powering and financing it. But as the industry's champion, he also represents all that's wrong with AI in skeptics' eyes. Their concerns span from the safety of the tech to its impact on jobs to the immense resource demands of the data-center buildout. Steve Hanke warned of an age of resentment. Steve Hanke Hanke warne om Musk. At the current share price, those would be worth nearly $2,500. The value could rise or fall depending on SpaceX's performance, but Musk has lofty ambitions. On Thursday, he said that if SpaceX succeeded in making life multiplanetary and harnessing a millionth of the sun's energy, it could be worth about a million times the current global economy — a figure equivalent to roughly $128 quintillion , based on International Monetary Fund estimates. He acknowledged those were \"absurdly difficult goals,\" but added: \"I recommend holding on to your shares.\" It appears likely the shares will be transferred to Trump Accounts. The Trump administration launched the initiative this summer, with those born between 2025 and 2028 receiving a $1,000 federal seed deposit. Several companies have agreed to contribute to them as well. Michael and Susan Dell contributed $250 to 25 million Trump Accounts last month. SpaceX President Gwynne Shotwell and her husband also pledged in July to give away 2 million SpaceX shares. Read the original article on Business Insider", "date_str": "2026-11-27T15:39:13+00:00", "hash": "8de2508de58b8244", "title_fa": "ایلان ماسک در اکانت ترامپ سهم خود در اسپیس ایکس را افزایش داد", "summary_fa": "دونالد ترامپ و ایلان ماسک بلومبرگ/گتی ایماژ ایلان ماسک شب قبل از عید شکرگزاری گفت که هر کودک آمریکایی دو سهم اسپیس ایکس خواهد داشت. کمتر از 24 ساعت پس از آن، او هر سال آن را به یک سهم افزایش داد. او در پست ایکس گفت: «این حیاتی است که کودکان در آینده سهمی داشته باشند. کمتر از 24 ساعت پس از اعلام برنامه‌های خود برای اعطای سهام اسپیس ایکس به همه کودکان در ایالات متحده، ایلان ماسک در اکانت ترامپ در هدایای تبلیغاتی خود را افزایش داد. او روز پنجشنبه گفت که هر سال یک سهم اسپیس ایکس را به هر کودک آمریکایی هدیه می دهد. ماسک در پستی در X اضافه کرد: «ضروری است که کودکان در آینده سهمی داشته باشند.» پس از اینکه ماسک روز چهارشنبه گفت هر کودک دو سهم اسپیس ایکس را دریافت خواهد کرد: یکی از شرکت و دیگری از خودش. او ابتدا در مهرماه قول داده بود که به هر بچه ای سهم بدهد. م مولد", "tags": ["Apple", "تراشه"], "datetime_fa": "۶ آذر • ۱۷:۲۷"}, {"source": "Business Insider", "title": "Norse Atlantic once offered $99 flights to Europe. Now it's fighting to avoid being the 2nd big airline casualty of 2026.", "link": "https://www.businessinsider.com/norse-atlantic-grounds-all-flights-in-its-fight-to-avoid-bankruptcy-2026-11", "summary": "A Norse Atlantic Airways Boeing 787. PATRICK T. FALLON/AFP via Getty Images Norse Atlantic's Norwegian operating unit filed for bankruptcy as it fights to stay in business. It also grounded its flights and received notices terminating the lease agreements for its fleet. Norse had been losing millions since fuel prices surged due to the Iran war. Cheap transatlantic flights are on the brink as Norse Atlantic filed for bankruptcy. The budget airline, which has previously offered one-way New York-to-London tickets for as little as $99, warned on Wednesday that its \"financial situation is critical.\" On Friday, it announced that its Norwegian operating unit had filed for bankruptcy. All Norse flights are canceled, and ticket sales have been discontinued, it added. \"We are deeply sorry for the impact this has on our passengers, employees and partners,\" said CEO Eivind Roald. He added that the board, management, and its advisors are \"working to find a solution for the remaining part of the business to continue operations.\" Earlier on Friday, Norse said that it received notices terminating the lease agreements for all 12 of its airplanes. It added that while it was contesting these and is still continuing discussions over short-term financing, \"there can be no assurance that a viable solution will be found.\" Shares in the airline, which trade on the Norwegian stock exchange, are trading at 1 cent, down 40% over the past five days, and 98.5% since the start of the year. The airline reported a net loss of $94.6 million for the first half of the year. It also noted that fuel prices had nearly doubled compared to last year. Before this week, Norse had already been looking for ways to shore up its finances. In May, it announced a cost-cutting plan aimed at saving $50 million a year, including the elimination of 75 jobs. And last August, it axed half of its US-to-Europe routes . Norse was founded in 2021 after fellow Scandinavian carrier Norwegian Air abandoned its transatlantic routes as it fought to survive the pandemic. Norse uses the familiar budget-airline model, relying on extra fees for baggage, seat selection, and onboard meals. However, the war in Iran has sent jet fuel prices skyrocketing. Unlike many European carriers, Norse does not hedge its fuel purchases, so it has been more exposed to the surge. The fuel surge has already brought down another budget carrier. Spirit Airlines shut down in May after filing for bankruptcy protection twice. Spirit CEO Dave Da", "date_str": "2026-11-27T13:51:13+00:00", "hash": "ab2639ac3adeaa7a", "title_fa": "نورس آتلانتیک یک بار پروازهای 99 دلاری به اروپا ارائه کرد. اکنون می‌جنگد تا دومین قربانی بزرگ هواپیمایی در سال 2026 نباشد.", "summary_fa": "یک بوئینگ 787 نورس آتلانتیک ایرویز. پاتریک تی. فالون/ خبرگزاری فرانسه از طریق گتی ایماژ واحد عملیاتی نروژی نورس آتلانتیک در حالی که برای ادامه فعالیت خود مبارزه می کند، اعلام ورشکستگی کرد. همچنین پروازهای خود را زمین گیر کرد و اخطاریه هایی مبنی بر فسخ قراردادهای اجاره ناوگان خود دریافت کرد. از زمان افزایش قیمت سوخت به دلیل جنگ ایران، نورس میلیون ها نفر را از دست داده است. پروازهای ارزان ترانس آتلانتیک در آستانه ورشکستگی Norse Atlantic هستند. این شرکت هواپیمایی مقرون به صرفه، که قبلا بلیط های یک طرفه نیویورک به لندن را با قیمتی کمتر از 99 دلار ارائه کرده بود، روز چهارشنبه هشدار داد که \"وضعیت مالی آن بحرانی است.\" روز جمعه اعلام کرد که واحد عملیاتی نروژی آن اعلام ورشکستگی کرده است. تمامی پروازهای نورس لغو شده و فروش بلیت نیز متوقف شده است. ایویند رولد، مدیرعامل این شرکت گفت: «ما عمیقاً از تأثیری که این امر بر مسافران، کارمندان و شرکای ما می‌گذارد متأسفیم. وی افزود که هیئت مدیره، مدیریت و مشاوران آن \"در تلاش برای یافتن راه حلی برای ادامه فعالیت بخش باقیمانده کسب و کار هستند.\" اوایل روز جمعه، نورس اعلام کرد که اخطاریه هایی مبنی بر فسخ قراردادهای اجاره برای همه 12 هواپیمای خود دریافت کرده است. این سازمان اضافه کرد که در حالی که در حال مخالفت با این موارد بود و همچنان به بحث در مورد تامین مالی کوتاه مدت ادامه می دهد، \"هیچ اطمینانی وجود ندارد که راه حلی قابل اجرا پیدا شود.\" سهام این شرکت هواپیمایی که در بورس نروژ معامله می‌شود، با 40 درصد کاهش طی پنج روز گذشته و 98.5 درصد از ابتدای سال به 1 سنت معامله می‌شود. این شرکت هواپیمایی در نیمه اول سال ۹۴.۶ میلیون دلار ضرر خالص اعلام کرد. همچنین اشاره کرد که قیمت سوخت نسبت به سال گذشته تقریباً", "image_url": "https://i.insider.com/6b0982510b69407d788a7189?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["بورس و طلا"], "datetime_fa": "۶ آذر • ۱۷:۲۱"}, {"source": "Business Insider", "title": "We couldn't agree on a vacation for 13 people. Then the 8-year-old twins suggested something unexpected.", "link": "https://www.businessinsider.com/multigenerational-family-vacation-idaho-dude-ranch-2026-11", "summary": "Horseback riding with the family on a dude ranch in Idaho. Courtesy of Bill Hallier We wanted to celebrate my parents' 80th birthdays with a vacation for all 13 family members. After struggling to agree on a destination, the youngest kids suggested an Idaho dude ranch. With activities for every age and meals included, everyone could relax and enjoy time together. Around a campfire in an Idaho horse pasture, our family of 13 hummed along with the jovial guitar-strumming folk singer. The kids licked marshmallow-covered fingers under a starry sky, seemingly mesmerized by the fire's shadows dancing on our faces. It's a memory that has stuck in my mind and made me laugh more than once over the past year. Grandma and Grandpa were celebrating their 80th birthday and wanted the entire family along for the ride. That night under the twinkling stars, for a little while, nobody needed to plan anything or wonder what tomorrow would bring. We could just sit together and sing. But getting us there was considerably less harmonious. We had ages ranging from 8 to 80 We all wanted to celebrate together, but agreeing on where to go nearly derailed the whole thing. Everyone had a say. Unfortunately, most of those opinions conflicted . From cruises to beaches and everything in between, we just couldn't decide where to go or what type of vacation would work best for our large group. The author went on a multigenerational trip with her family Courtesy of Bill Hallier With ages ranging from 8 to 80, we were asking a lot of one vacation. The kids needed adventures and time with the other young campers. The teenagers needed some freedom. The adults were hoping to relax, and we all wanted Grandma and Grandpa to enjoy their birthday without spending the trip keeping everyone else entertained. Then the youngest of the group, 8-year-old twins, suggested a dude ranch . It was the idea with the fewest complaints, and in our family, that counted as enthusiasm. What followed was an Idaho getaway reminiscent of the kind of family time I remember from childhood, when we were happy just sitting outside together under the stars. There was plenty to do, but it also allowed us to do very little. Getting there and staying together were manageable Before falling in love with a ranch, we looked at how everyone would get there. A beautiful setting loses some appeal if getting there requires an exhausting journey, especially with young children or older relatives. The author s family was celebrating ", "date_str": "2026-11-27T13:47:01+00:00", "hash": "28e65f207bda92c7", "title_fa": "ما نتوانستیم برای تعطیلات 13 نفر به توافق برسیم. سپس دوقلوهای 8 ساله چیزی غیرمنتظره را پیشنهاد کردند.", "summary_fa": "اسب سواری با خانواده در مزرعه ای در آیداهو. با حسن نیت از بیل هالیر ما می خواستیم تولد 80 سالگی والدینم را با تعطیلات برای تمام 13 عضو خانواده جشن بگیریم. پس از تلاش برای توافق بر سر یک مقصد، کوچک‌ترین  most. The island has beautiful mountains and greenery, plus many amazing outdoor experiences. The delicious cuisine and friendly locals I met made my trip memorable, and I can't wait to return. Over the past few years, I've traveled to several parts of Asia , including Thailand, Vietnam, Japan, South Korea, and Taiwan. Every trip to the continent has been dynamic and exciting. The unfamiliar languages, lively night markets, rich cuisines, and futuristic cities keep drawing me back again and again. Although every place offers something unique, my visit to Taiwan took me by surprise the most. My husband and I had booked our trip with no expectations, but we left impressed by every aspect of the visit. The island's rugged landscapes are striking, making it a paradise for outdoor enthusiasts. The food, from juicy dumplings to made-to-order scallion pancakes, is mouthwatering, and the locals we encountered seemed approachable and friendly. After spending two weeks in Taiwan, I can safely say it's one of my favorite places in the whole region. Here's why I can't wait to plan a return trip. Taiwan is small and populous, but it never felt too crowded Even Taiwan s capital, Taipei, didn t feel too crowded during our visit. Jenna DeLaurentis Taiwan is a fairly small island — it's smaller than most US states — and is very densely populated, with over 20 million residents. It also has a bustling tourism industry. Despite these factors, Taiwan never seemed too crowded during my visit, whether I was at the beach or in its capital city, Taipei. I didn't notice severe overcrowding in touristy areas , and prices for hotels, tours, and transportation were lower than I experienced in other Asian nations for equivalent services. Fewer tourists meant I could enjoy popular attractions, like the Ximending Night Market and Taipei 101 skyscraper, without navigating through swarms of other visitors. For context, Taiwan expects to receive just over 9 million foreign tourists this year. In 20 loads/2026/11/GettyImages-2306420865-1.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آذر • ۱۸:۰۳"}, {"source": "Variety", "title": "Thanksgiving Box Office: ‘Hunger Games: Sunrise on the Reaping’ Rules With $11.6 Million, ‘Focker-in-Law’ Follows With $7.7 Million", "link": "https://variety.com/2026/film/box-office/box-office-hunger-games-sunrise-reaping-thanksgiving-1236959537/", "summary": "As people traveled back home for Thanksgiving, a lot of moviegoers made a stop at Panem to return to the world of The Hunger Games. The new prequel, Sunrise on the Reaping, ruled the Thanksgiving box office with $11.6 million on Thursday. Lionsgate s latest entry in the YA action franchise will dominate the box office [ ]", "date_str": "2026-11-27T16:35:26+00:00", "hash": "b2968fe40a243138", "title_fa": "باکس آفیس شکرگزاری: «بازی‌های گرسنگی: طلوع آفتاب در درو» قوانین با 11.6 میلیون دلار، «Focker-in-Law» با 7.7 میلیون دلار دنبال می‌شود.", "summary_fa": "هنگامی که مردم برای روز شکرگزاری به خانه بازگشتند، بسیاری از تماشاگران سینما در پانم توقف کردند تا به دنیای بازی های گرسنگی بازگردند. پیش درآمد جدید، طلوع خورشید در درو، روز پنجشنبه با 11.6 میلیون دلار در باکس آفیس روز شکرگزاری حکمرانی کرد. جدیدترین اثر Lionsgate در فرنچایز اکشن YA بر باکس آفیس تسلط خواهد داشت [ ] یکی دیگر از آثار قدیمی یک فرنچایز قدیمی، کمدی یونیورسال Focker-in-Law، با 7.7 میلیون دلار در روز پنجشنبه در جایگاه دوم قرار گرفت. این انیمیشن جدید این هفته، انیمیشن اصلی دیزنی Hexed را شکست خواهد داد و فریم پنج روزه را با تخمینی 40 میلیون دلار به پایان می رساند. آریانا گرانده در فیلم جدید که بن استیلر، رابرت دنیرو، اوون ویلسون و بلیت دانر را باز می گرداند، به خانواده فاکر می پیوندد. Hexed با بازی هایلی استاینفلد، رشیدا جونز و جودی فاستر در جشن شکرگزاری 4.5 میلیون دلار به دست آورد و در جایگاه سوم قرار گرفت. پیش بینی می شود در آخر هفته پنج روزه 34.4 میلیون دلار درآمد داشته باشد. استاینفلد در نقش یک جادوگر نوجوان بازی می کند که قدرت های خود را کشف می کند و در جدیدتر . 18, paving the way for a huge box office event similar to Barbenheimer, with people already coining it Dunesday. It will likely be a great [ ]", "date_str": "2026-11-27T16:22:22+00:00", "hash": "400a2caa5d4fb88d", "title_fa": "دنیس ویلنوو زمانی که دیزنی «انتقام‌جویان: روز قیامت» را در همان تاریخ اکران «تلماسه ۳» قرار داد «عمیقاً ناامید شد»: «امیدوارم زنده بمانیم»", "summary_fa": "دنیس ویلنوو دقیقاً از اینکه Dune: Part Three با فیلم Avengers: Doomsday در گیشه رو به رو خواهد شد، هیجان زده نیست. هر دو بلاک باستر در تاریخ 18 دسامبر اکران خواهند شد و راه را برای یک رویداد بزرگ باکس آفیس شبیه باربنهایمر هموار می کنند و مردم از قبل آن را روز دوشنبه ساخته اند. به احتمال زیاد عالی خواهد بود [ ] گوش کنید، صادقانه می گویم. اولین Dune در پایان همه‌گیری منتشر شد. ما یک باکس آفیس عالی در یک محیط بسیار خشن ساختیم. کارگردان گفت، اما ما بادها را علیه خود داشتیم. سپس فیلم دوم، همان چیز. قرار بود در پاییز آزاد شویم و به دلیل دو اعتصاب هالیوود مجبور شدیم در پایان زمستان آزاد شویم. ما موفقیت داشتیم، اما آسان نبود. برای سومین و آخرین فیلم Dune، ویلنوو مشتاقانه منتظر بود تا نفس راحتی بکشد: در نهایت، هیچ بیماری همه گیر، هیچ حمله ای در چشم نیست. ما یک آزادی عادی خواهیم داشت، او فکر می کند. سپس دیزنی بزرگترین فرنچایز تمام دوران را علیه ما قرار داد. من احمقی نیستم آن فیلم ها ماموت هستند. The tentpole مارول در ابتدا قرار بود در 1 می 2026 اکران شود، اما سال گذشته تا 18 دسامبر، همان تاریخی که Dune 3 قبلا برگزار شده بود، به تعویق افتاد. آخرین فیلم انتقام جویان، پایان بازی 2019، همچنان با 2.94 میلیارد دلار در سرتاسر جهان به عنوان پرفروش ترین فیلم تاریخ در رده بندی قرار دارد. ویلنوو در مورد این تغییر گفت: من عمیقاً ناامید شدم. اما ما به این تاریخ یعنی به ایمکس متعهد بودیم. حرکت غیرممکن بود. پس سرنوشتم را پذیرفتم و با خدایان سینما دعا کردم. Dune مانند انتقام جویان ماموت نیست، اما یک حیوان کوچک سکسی است که قدرت آتش زیادی دارد و امیدوارم ما زنده بمانیم. دیزنی بلافاصله به درخواست Variety برای", "image_url": "https://variety.com/wp-content/uploads/2026/11/dune-doomsday.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۶ آذر • ۱۹:۵۲"}, {"source": "Rolling Stone", "title": "The Killers Dave Keuning Reveals He Suffered ‘Major Stroke’: ‘I Am Alive and Well’", "link": "https://www.rollingstone.com/music/music-news/the-killers-dave-keuning-major-stroke-recovery-1235665233/", "summary": "\"The doctors said I had a 40% chance or survival and I would have disabilities after, but by some miracle I am fine\"", "date_str": "2026-11-27T16:19:42+00:00", "hash": "4ccb6ac19cb2e200", "title_fa": "The Kills Dave Keuning فاش می کند که دچار \"سکته مغزی شدید\" شده است: \"من زنده و خوب هستم\"", "summary_fa": "\"پزشکان گفتند که من 40 درصد شانس یا زنده ماندن دارم و بعد از آن دچار معلولیت خواهم شد، اما به طور معجزه ای حالم خوب است.\" دیو کیونینگ، نوازنده باس گروه Killers فاش کرد که اخیراً پس از سکته مغزی شدید در بیمارستان بستری شده است. کیونینگ در پستی در اینستاگرام روز پنجشنبه عکسی از او به همراه دختر سه ماهه اش اودت به اشتراک گذاشت و فاش کرد که او پس از اورژانس پزشکی زنده و سالم است. کیونینگ نوشت، دو هفته پیش سکته مغزی شدیدی داشتم و به لطف عملکرد سریع همسرم، مستقیماً به بیمارستان رفتم و تحت عمل جراحی قرار گرفتم. اولین ساعت پس از سکته مغزی برای رسیدن به بیمارستان بسیار مهم است. من یک لخته خون در مغزم داشتم که جریان خون تمام سمت راست مغزم را قطع کرد. زمانی که به بیمارستان رسیدم، یک چشمم نابینا بود و عملکرد سمت چپم را از دست داده بودم، اما هنوز نمی توانستم متوجه سکته مغزی شوم. پزشکان گفتند که من 40 درصد شانس یا زنده ماندن دارم و بعد از آن دچار ناتوانی خواهم شد، اما از یک معجزه خوب هستم. او ادامه داد، و بله، من می توانم به همان خوبی گیتار بزنم. این اولین چیزی بود که وقتی از عمل جراحی بیدار شدم چک کردم. از اینکه زنده و سالم هستم و می توانم از دست و پاهایم استفاده کنم و مثل قبل حرف بزنم، بسیار خوش شانس هستم. من از همسرم، پسرم، دخترم و همه هم گروهی‌هایم که احساس می‌کنم بیشتر از همیشه به آنها نزدیک‌تر هستم، سپاسگزارم. کیونینگ در سال 2001 گروه Killers را با براندون فلاورز تشکیل داد. او در سال 2017 از جاده خارج شد تا زمان بیشتری را با خانواده‌ علائم مرتبط با اسکیزوفرنی را نشان داد، او این بیماری را ندارد و هرگز تشخیص داده نشده است. در ددلاین تماشا کنید یک سخنگوی نتفلیکس گفت که این صحنه از سند حذف شده است که امروز حذف شد. او اضافه کرد که به دنبال اطلاعات جدیدی که خانواده در رابطه با تشخیص رسمی سلامت روان تایسون به اشتراک گذاشته اند، ما در کنار آنها برای به روز رسانی مستند قبل از انتشار کار کرده ایم. به دنبال اظهارات مربوط به اسکیزوفرنی، که در یک بیانیه مطبوعاتی نتفلیکس در مورد این سند در روز دوشنبه نیز گنجانده شد، هیئت کنترل بوکس بریتانیا گفت که در حال بررسی است که آیا آنچه که تصور می‌شد تشخیص فیوری باشد مانع مبارزه طولانی مدت او با بوکسور بریتانیایی، جاشوا می‌شود یا خیر.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Tyson_Fury_n_00_57_11_23.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۶ آذر • ۱۸:۲۶"}, {"source": "Rolling Stone", "title": "Watch ‘Sesame Street’ Pay Homage to Mariah Carey’s ‘All I Want for Christmas Is You’", "link": "https://www.rollingstone.com/music/music-news/sesame-street-mariah-carey-christmas-song-homage-1235665152/", "summary": "This year the characters need the letter \"U\" to help the holidays stay festive and bright", "date_str": "2026-11-27T14:57:04+00:00", "hash": "9772e983cb0be016", "title_fa": "«خیابان کنجد» را تماشا کنید که به آهنگ «همه چیزی که برای کریسمس می‌خواهم تو هستی» ماریا کری", "summary_fa": "امسال کاراکترها به حرف \"U\" نیاز دارند تا به تعطیلات کمک کند تا در تعطیلات جشن و شادی داشته باشند. امسال، شخصیت‌های Sesame Street با نسخه عجیب و غریب خود، با عنوان All I Want for Christmas Is U به آهنگ تعطیلات ادای احترام کردند. در کلیپ که امروز به اشتراک گذاشته شد، Abby Cadabby، Grover، Elmo و Cookie Monster درباره حرف بسیار مهم U می خوانند، که آرزوی اصلی آنها در کریسمس است. ماپت های رنگارنگ می خوانند: \"اگر ما برای کریسمس U نداشتیم، هیچ کلمه ای وجود نداشت.\" «ما نمی‌توانیم هدایا را زیر درخت کریسمس باز کنیم/ بدون کلماتی که با U شروع می‌شوند، تعطیلات احساس درستی نمی‌کند/ ما حتی نمی‌توانیم روبان‌ها را باز کنیم/ یا چراغ‌های کریسمس را باز کنیم/ می‌خواهیم جعبه کریسمس را باز کنیم، اما نمی‌توانیم/ کمک نمی‌کنی بفهمیم/ نمی‌دانیم چه خواهیم کرد/ تنها چیزی که برای کریسمس نیاز داریم، U است!» موفقیت کری معمولاً هر سال به صدر جدول 100 بیلبورد برمی‌گردد. این آهنگ از زمانی که برای اولین بار در 19 دسامبر 2019 به این جایگاه رسید، به مدت 22 هفته در صدر جدول 100 قرار گرفته است. با این حال، امسال، کری شاهد رقابت هایی از الا لنگلی بود، که رکورد حضور در صدر جدول را در سپتامبر به دست آورد، زمانی که \"Choosin' Texas\" بیست و سومین هفته خود را در رتبه 1 در هات 10 به دست آورد. داستان های پرطرفدار دوران دوران گیتاریست اندی تیلور در سن 65 سالگی مرده تماشا کنید میراندا لمبرت در حال اجرای ترکیبی از هیت هایش در نمایش نیمه وقت دالاس کابوی ها ژرارد دوپاردیو برای محاکمه به دلیل تجاوز جنسی بازیگر زن شارلوت آرنولد دوران ویلد ویلد ترین ویلی از اندی تای.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/sesamestreet.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آذر • ۱۸:۲۷"}, {"source": "Rolling Stone", "title": "Justin Timberlake Says Making Upcoming Doc Series Was ‘Really Cathartic’", "link": "https://www.rollingstone.com/music/music-news/justin-timberlake-upcoming-doc-series-interview-fallon-1235665140/", "summary": "The pop star took over The Tonight Show on Thanksgiving with an interview, performances, and sketches", "date_str": "2026-11-27T14:33:39+00:00", "hash": "67e009ec0e317992", "title_fa": "جاستین تیمبرلیک می‌گوید ساخت سریال Doc آینده «واقعاً دلخراش» بود", "summary_fa": "این ستاره پاپ با مصاحبه، اجراها و طرح‌هایی، سریال The Tonight Show در روز شکرگزاری را بر عهده گرفت. امسال می‌توانید از جاستین تیمبرلیک تشکر کنید. این ستاره پاپ تعطیلات خود را در The Tonight Show گذراند، جایی که آواز خواند، رقصید، در طرح‌های مضحک ظاهر شد، بیستمین سالگرد آلبوم FutureSex/LoveSounds را جشن گرفت و به آنچه در مجموعه مستند آینده‌اش خواهد آمد اشاره کرد. تیمبرلیک در طول نمایش در اواخر شب، FutureSex / LoveSound، SexyBack، Summer Love و My Love را برای تماشاگران زنده در اتاق رنگین کمان در شهر نیویورک اجرا کرد. او همچنین LoveStoned، Until the End of Time، و What Goes Around…/…Comes Around را به نمایش گذاشت. تیمبرلیک با مجری برنامه، جیمی فالون، تاریخچه ای از آهنگ مهمانی را برای مخاطبان استودیو ارائه کرد. این اجرا شامل اجرای سریع آهنگ های Caron Wheeler و Soul II Soul Back to Life (هر جور که می خواهی)، Montell Jordan This Is How We Do It، و Daft Punk و Pharrell Get Lucky بود. آنها با یک برداشت از سرود در بک استریت Boys I Want It That Way به پایان رسیدند. تیمبرلیک در جای دیگر در برنامه The Tonight Show لباس بوقلمون پوشید و خاطرات اردوگاه دهه 1980 را زنده کرد. تیمبرلیک همچنین با فالون درباره سالگرد FutureSex/LoveSounds که در سال 2006 منتشر شد و مستند چهار قسمتی آینده‌اش، تیمبرلیک، گفتگو کرد. تیمبرلیک به فالون گفت: \"من واقعاً تمایلی به انجام آن نداشتم. من به نوعی خصوصی مشهور هستم. و با فیشر استیونز که کارگردانی فوق العاده و انسانی بزرگ است رابطه دارم. وقتی فیشر برای اولین بار به من نزدیک شد تا این کار را انجام دهم، من تمایلی نداشتم زیرا می‌گفتم: «نمی‌خواهم در مورد خودم صحبت کنم،» می‌دانی؟ اما هر چه بیشتر می‌نشستیم و صحبت می‌کردیم، بیشتر به دنبال چیزی می‌گشتم که کمی بیشتر در زیر", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/GettyImages-2306420865-1.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۶ آذر • ۱۸:۰۳"}]

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
