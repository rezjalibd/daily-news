t, humidity, and crowded attractions . However, the fall season tells a completely different story. The change of season often brings cooler weather, fewer tourists, and many fun activities and festivals. After living here for over 25 years, it's my favorite time of year to explore the Sunshine State. Here's why I always tell tourists to visit in the cooler months. Many major attractions feel less crowded this time of year. Veronica Croes One of my favorite things about Florida in the fall is how much calmer everything feels. Schools are back in session, so the huge summer crowds at theme parks , beaches, cities, and small towns have typically thinned out. This means visitors can take their time exploring attractions, it's easier to snag a prime spot on the sand, and reservations at popular restaurants feel more attainable without the stress of peak-season tourism. The temperatures start to feel more enjoyable. Veronica Croes By fall, temperatures start to cool down, and the humidity drops just enough to make the outdoors enjoyable again. Taking a stroll on the beach, exploring a national park , or sipping a coffee at a sidewalk café are much more enjoyable when you don't feel like you're melting. However, the Florida sun is still intense, so I recommend packing shorts, sunscreen, and a hat to stay protected during outdoor fun. I think fall is the perfect time to get out and experience nature. Steve Bower/Shutterstock If you love spending time outdoors like I do, the fall is the perfect time to experience the state's natural wonders. In addition to the cooler weather that makes spending time outside more enjoyable, Florida is full of fun activities that are best enjoyed in the fall months. For example, bioluminescent waters are still visible in places like Merritt Island, and many companies offer a glow-in-the-dark kayaking experience without the intense summer heat. Fall foliage even appears later in the season in the North and Central regions, where bald cypress trees along the rivers transform into shades of gold and red. Florida is home to a great variety of fall f", "date_str": "2026-09-18T14:01:54+00:00", "hash": "2b9fee969b36c264", "title_fa": "من 25 سال در فلوریدا زندگی کرده ام. به همین دلیل است که فکر می کنم پاییز بهترین زمان برای بازدید است.", "summary_fa": "دلایل زیادی برای سفر به فلوریدا در پاییز وجود دارد. استیو باور/شاتراستاک من 25 سال است که در فلوریدا زندگی کرده ام و معتقدم پاییز بهترین زمان سال برای بازدید است. دما و رطوبت در پاییز کاهش می‌یابد و باعث می‌شود فعالیت‌های خارج از منزل لذت‌بخش‌تر شوند. با اوج گرفتن تابستان، بسیاری از هتل ها یا پارک های موضوعی تخفیف های فصلی ارائه می دهند. تابستان در فلوریدا اغلب می تواند گرمای شدید، رطوبت و جاذبه های شلوغ را به همراه داشته باشد. با این حال، فصل پاییز داستان کاملاً متفاوتی را روایت می کند. تغییر فصل اغلب هوای خنک تر، گردشگران کمتر و بسیاری از فعالیت ها و جشنواره های سرگرم کننده را به همراه دارد. پس از بیش از 25 سال زندگی در اینجا، زمان مورد علاقه من از سال برای کاوش در ایالت آفتاب است. به همین دلیل است که من همیشه به گردشگران می‌گویم در ماه‌های سردتر از آن بازدید کنند. بسیاری از جاذبه های اصلی در این زمان از سال کمتر شلوغ می شوند. Veronica Croes یکی از چیزهای مورد علاقه من در مورد فلوریدا در پاییز این است که چقدر همه چیز آرام تر است. مدارس دوباره شروع به کار کرده‌اند، بنابراین جمعیت زیاد تابستانی در پارک‌های موضوعی، سواحل، شهرها و شهرهای کوچک معمولاً کاهش یافته است. این به این معنی است که بازدیدکنندگان می‌توانند وقت خود را به کاوش در جاذبه‌ها اختصاص دهند، گرفتن یک نقطه برجسته روی شن‌ها آسان‌تر است، و رزرو در رستوران‌های محبوب بدون استرس گردشگری در فصل اوج قابل دسترس‌تر است. دماها شروع به احساس لذت بخش تر می کنند. Veronica Croes تا پاییز، دما شروع به کاهش می‌کند و رطوبت به اندازه‌ای کاهش می‌یابد که فضای باز را دوباره لذت‌بخش کند. قدم زدن در ساحل، کاوش در پارک ملی، یا نوشیدن یک قهوه در یک کافه پیاده رو،"}, {"source": "Business Insider", "title": "I've lived in the Netherlands for 15 years. Skip Amsterdam and head to these charming, lesser-known places.", "link": "https://www.businessinsider.com/best-towns-to-visit-netherlands-lesser-known-from-local-2026-9", "summary": "Whenever I visit Warmond, I feel like I m traveling to a different era. Dana Marin I've lived in the Netherlands for 15 years and traveled all over the country. As much as I love Amsterdam, the smaller towns here have really stolen my heart. I love visiting the historic city of Medemblik, and Veere has some of my favorite views. After 15 years here, one of the things I love most about living in the Netherlands is how easy it is to travel around the country, and how day-trip (dagje weg) culture is ingrained in Dutch life. Have half a day free? Just jump on the train and go somewhere. I love exploring Amsterdam, but I also like taking myself somewhere new. For a weekend trip, I prefer heading to a cozier town, where the streets are quiet, I can chat with locals in the shops, and an older Dutch gentleman is likely to explain the town's entire history to me while munching on a traditional cookie in a restaurant. Here are four of my favorite small towns , villages, and lesser-known cities to visit. Warmond is surrounded by lakes and history. huys te warmont tk Dana Marin South Holland — in particular, the Bollenstreek — is known as the tulip region of the Netherlands. There's more than tulips to see here, though, and Warmond, an idyllic village on the Bollenstreek border, is proof. Warmond has a centuries-old history, evident in the few country estates that still stand. The grandest is Huys te Warmont, with a moat and an elegant forest park, where I love to walk around and pretend I'm in a different era. In the city center, you'll find the old school, now a modern restaurant appropriately named Old School Café, where everyone stops by for lunch right next to the old water pump. On the eastern edge of the village is the start of the Kagerplassen, a system of interconnected lakes. A wooden drawbridge brings you across the way to Koudenhoorn, an island park with everything from a petting zoo to a little beach. A vintage steam tram takes you to Medemblik s medieval castle. castle in medemblik Dana Marin For an exciting day trip chock-full of activities, I take the historic steam train from the city of Hoorn to Medemblik, the oldest town in the region of West Friesland. It's a magnificent ride, especially during tulip season when you rattle past the colorful fields. Medemblik is a town after my own heart, with multiple harbors, a long waterfront promenade along the IJsselmeer, and a medieval castle, Radboud, that you can visit. You can't go to Medemblik without stop", "date_str": "2026-09-18T13:35:01+00:00", "hash": "c520ae57c536c460", "title_fa": "من 15 سال است که در هلند زندگی می کنم. از آمستردام بگذرید و به این مکان های جذاب و کمتر شناخته شده بروید.", "summary_fa": "هر زمان که به وارموند می‌روم، احساس می‌کنم به دوران متفاوتی سفر می‌کنم. دانا مارین من 15 سال در هلند زندگی کردم و به سراسر کشور سفر کردم. به همان اندازه که آمستردام را دوست دارم، شهرهای کوچکتر اینجا واقعا قلبم را ربوده اند. من عاشق بازدید از شهر تاریخی Medemblik هستم و Veere برخی از مناظر مورد علاقه من را دارد. پس از 15 سال اینجا، یکی از چیزهایی که من در مورد زندگی در هلند دوست دارم این است که چقدر آسان است به سراسر کشور سفر کنید، و چگونه فرهنگ سفر یک روزه (dagje weg) در زندگی هلندی ریشه دوانده است. نصف روز رایگان دارید؟ فقط به قطار بپر و به جایی برو. من عاشق کاوش در آمستردام هستم، اما دوست دارم خودم را به جایی جدید ببرم. برای یک سفر آخر هفته، ترجیح می‌دهم به یک شهر دنج‌تر بروم، جایی که خیابان‌ها ساکت هستند، می‌توانم با مردم محلی در مغازه‌ها گپ بزنم، و یک آقای هلندی مسن‌تر احتمالاً کل تاریخ شهر را برای من توضیح می‌دهد در حالی که یک کلوچه سنتی در یک رستوران می‌خورد. در اینجا چهار شهر کوچک، روستاها و شهرهای کمتر شناخته شده مورد علاقه من برای بازدید وجود دارد. وارموند توسط دریاچه ها و تاریخ احاطه شده است. huys te warmont tk Dana Marin South Holland - به ویژه Bollenstreek - به عنوان منطقه لاله هلند شناخته می شود. در اینجا چیزی بیش از لاله برای دیدن وجود دارد، و وارموند، دهکده ای دوست داشتنی در مرز بولنستریک، گواه این امر است. وارموند تاریخچه ای چند صد ساله دارد که در تعداد کمی از املاک کشوری که هنوز پابرجا هستند مشهود است. بزرگ‌ترین آنها Huys te Warmont است، با یک خندق و یک پارک جنگلی زیبا، جایی که من دوست دارم در آن قدم بزنم و وانمود کنم که در دوره‌ای"}, {"source": "Business Insider", "title": "I tried easy weeknight pasta recipes by Ina Garten and Ree Drummond. One earned a spot in my dinner rotation.", "link": "https://www.businessinsider.com/review-ina-garten-renee-drummond-easy-pasta-recipes", "summary": "These pasta recipes from Ina Garten and Renee Drummond were unbelievably easy to make. Erin McDowell/Business Insider I tried easy pasta recipes from Ina Garten and Ree Drummond for a weeknight dinner. Garten's five-ingredient tomato pasta is practically no-cook. Drummond's creamy sausage pasta is a cheesy one-pan dinner ready in just 30 minutes. When temperatures start to drop, few things quite hit the spot like an easy pasta dinner, especially on busy workweek nights or during the back-to-school rush. Ree Drummond, better known as The Pioneer Woman , and Ina Garten are both beloved for their approachable, comforting dishes , making their recipes ideal for a cozy meal that doesn't require hours in the kitchen. I made one of each chef's simplest pasta recipes . Although they used different ingredients and ultimately created very different dishes, both came together with minimal effort, simple ingredients, and required very little cleanup. Here's how I made Ina Garten's and Ree Drummond's easy weeknight pasta recipes, and which one I'd make again. Ina Garten s recipe required just five main ingredients. Erin McDowell/Business Insider To make the recipe , you'll need: Ingredients ½ pound angel hair or similar Parmesan cheese 1 ½ pints cherry tomatoes 3 cloves minced garlic 9 basil leaves For seasoning, you'll need olive oil — and Garten, of course, specifies that it should be \"good\" — along with salt, freshly ground black pepper, and crushed red-pepper flakes. First, I halved the tomatoes. Erin McDowell/Business Insider Garten's recipe calls for 4 pints of cherry tomatoes to serve six people. Since I was making a much smaller portion, I used a pint and a half instead. After adding the tomatoes to a large mixing bowl, I added my julienned basil leaves and three cloves of minced garlic. I then seasoned everything with half a teaspoon of salt, a few dashes of red pepper flakes, and freshly ground black pepper. This was virtually the only prep the recipe required. To make it even more weeknight-friendly, you can use jarred minced garlic — because, as Garten famously says, \"store-bought is fine.\" To meld everything together, I soaked the tomato mixture in olive oil. Erin McDowell/Business Insider I used about half the olive oil Garten recommends. It was enough to cover the tomatoes and create a \"sauce\" base at the bottom of the bowl. I gave everything a good mix and then covered the bowl with plastic wrap. Erin McDowell/Business Insider Garten recommends leaving ", "date_str": "2026-09-18T13:28:01+00:00", "hash": "8820e8c2f8eb8cc6", "title_fa": "من دستور العمل های آسان ماکارونی شب هفته را توسط Ina Garten و Ree Drummond امتحان کردم. یکی در چرخش شام من جایگاهی به دست آورد.", "summary_fa": "این دستور العمل های پاستا از Ina Garten و Renee Drummond به طرز باورنکردنی آسان بود. Erin McDowell/Business Insider من دستور العمل های آسان ماکارونی از Ina Garten و Ree Drummond را برای یک شام شب هفته امتحان کردم. پاستا گوجه‌فرنگی پنج ماده‌ای گارتن عملاً پخته نمی‌شود. پاستا سوسیس خامه ای Drummond یک شام پنیری است که تنها در 30 دقیقه آماده می شود. هنگامی که دما شروع به کاهش می کند، چیزهای کمی مانند یک شام ماکارونی آسان، به ویژه در شب های شلوغ هفته یا در هنگام عجله بازگشت به مدرسه، به خوبی به چشم می خورد. ری دراموند، که بیشتر با نام زن پیشگام شناخته می‌شود، و اینا گارتن، هر دو به خاطر غذاهای راحت و راحت‌شان محبوب هستند، و دستور العمل‌هایشان را برای یک وعده غذایی دنج که به ساعت‌ها در آشپزخانه نیاز ندارد، ایده‌آل می‌کنند. من یکی از ساده ترین دستور العمل های ماکارونی هر سرآشپز را درست کردم. اگرچه آنها از مواد مختلفی استفاده کردند و در نهایت غذاهای بسیار متفاوتی ایجاد کردند، اما هر دو با کمترین تلاش، مواد ساده و نیاز به تمیز کردن بسیار کمی داشتند. در اینجا نحوه تهیه ماکارونی آسان اینا گارتن و ری دراموند در شب آمده است و کدام یک را دوباره درست می کنم. دستور پخت اینا گارتن فقط به پنج ماده اصلی نیاز داشت. Erin McDowell/Business Insider برای تهیه دستور غذا به این موارد نیاز دارید: مواد لازم ½ پوند موی فرشته یا پنیر پارمزان مشابه 1 ½ پیمانه گوجه فرنگی گیلاسی 3 حبه سیر خرد شده 9 برگ ریحان برای چاشنی به روغن زیتون نیاز دارید - و البته گارتن - البته باید به همراه فلفل سیاه و تازه به آن اضافه شود. تکه های فلفل قرمز خرد شده. اول گوجه ها رو نصف کردم. دستور ارین مک داول/Business Insider Garten خواستار 4 پیمانه"}, {"source": "Business Insider", "title": "Meet San Francisco's 'permanent underclass' — and the ones who think they still have a shot", "link": "https://www.businessinsider.com/san-francisco-permanent-underclass-ai-tech-boom-small-businesses-2026-9", "summary": "Getty Images; Tyler Le/BI Halfway through our interview with Kacie Barrett, a 26-year-old project manager in San Francisco, her screen froze. When she came back on 30 seconds later, she apologized for the choppy WiFi, a result of downsizing her Xfinity internet package from $120 to $40 a month, which she splits with her housemate. Though the slower internet package is a challenge when she works from home twice a week, Barrett said she's had to downsize much of her life over the past two years as the cost of living in San Francisco has skyrocketed due to the city's AI boom . She moved from a $2,000 studio apartment in Russian Hill to a $1,850 room in a shared apartment in Nob Hill. She cooks most of her meals, only goes out once a month, works out at the cheapest gym she could find, and Ubers everywhere instead of spending on a car. \"I definitely feel like I am living like a college student, not an adult,\" Barrett said. The term \" permanent underclass \" has floated around the internet for months, referring to the idea that techies who don't make it to frontier artificial intelligence labs will fall behind their peers financially and professionally, to the point where they become serfs to their AI-new-money overlords. It's been treated like a meme, with some leaders dismissing the phrase — OpenAI CEO Sam Altman called it \"so dumb\" in a July interview, and Andreessen Horowitz partner Anish Acharya said in September that it was a \"funny dark fantasy.\" However, another group of San Franciscans feels like they are already living this reality. It's not young techies or startup founders. It's small-business owners and workers outside the tech sphere who, like Barrett, have called San Francisco home for years but now feel that life in the city has become an exclusive party they can't afford to get into. The people left behind by the AI boom High salaries offered by AI companies like OpenAI, Anthropic, Thinking Machines Lab , Cognition, and Databricks are creating a concentration of wealth in San Francisco. That's set to intensify when the looming IPOs of Anthropic and OpenAI mint overnight millionaires and billionaires — and the rest of the city's residents who work in service, small business, and other white-collar roles are left to compete. Still, not everyone thinks the future is so grim. Tushar Kumar, the cofounder of Twin Peaks Wealth Advisors, who works with clients at OpenAI and Anthropic, said he doesn't see much merit in the idea of a permanent underclass ", "date_str": "2026-09-18T13:18:50+00:00", "hash": "37b256bdda4a2fbb", "title_fa": "با \"طبقه زیردست دائمی\" سانفرانسیسکو آشنا شوید - و آنهایی که فکر می کنند هنوز فرصت دارند", "summary_fa": "گتی ایماژ; تایلر لو/بی‌آی در نیمه‌ی راه مصاحبه ما با کیسی بارت، مدیر پروژه 26 ساله در سانفرانسیسکو، صفحه نمایش او یخ زد. وقتی 30 ثانیه بعد دوباره به کارش آمد، به خاطر خرابی وای فای که در نتیجه کاهش حجم بسته اینترنت Xfinity او از 120 دلار به 40 دلار در ماه بود، عذرخواهی کرد که او آن را با هم خانه اش تقسیم کرد. اگرچه بسته اینترنت کندتر زمانی که او هفته‌ای دو بار از خانه کار می‌کند، یک چالش است، بارت گفت که در دو سال گذشته مجبور شده بسیاری از عمر خود را کاهش دهد زیرا هزینه زندگی در سانفرانسیسکو به دلیل رونق هوش مصنوعی شهر افزایش یافته است. او از یک آپارتمان استودیویی 2000 دلاری در روسی هیل به یک اتاق 1850 دلاری در یک آپارتمان مشترک در نوب هیل نقل مکان کرد. او بیشتر وعده های غذایی خود را می پزد، فقط یک بار در ماه بیرون می رود، در ارزان ترین باشگاه ورزشی که می تواند پیدا کند ورزش می کند و Ubers در همه جا به جای خرج کردن برای ماشین. بارت گفت: \"من قطعاً احساس می کنم مانند یک دانشجو زندگی می کنم، نه یک بزرگسال.\" اصطلاح «طبقه زیردست دائمی» ماه‌ها در سراسر اینترنت پخش شده است و به این ایده اشاره می‌کند که فن‌آورانی که به آزمایشگاه‌های هوش مصنوعی مرزی راه نمی‌یابند، از نظر مالی و حرفه‌ای از همتایان خود عقب می‌افتند، تا جایی که به رعیت اربابان پول‌های جدید هوش مصنوعی خود تبدیل می‌شوند. با آن مانند یک میم رفتار می شود، برخی از رهبران این عبارت را رد می کنند - سام آلتمن، مدیر عامل OpenAI در مصاحبه ای در ماه ژوئیه آن را \"خیلی احمقانه\" خواند و آنیش آچاریا، شریک Andreessen Horowitz در سپتامبر گفت که این یک \"فانتزی تاریک خنده دار\" است. با این حال، گروه"}, {"source": "Business Insider", "title": "I loved raising little kids. Now that mine are 11 and 15, parenting is much more chill.", "link": "https://www.businessinsider.com/loved-having-little-kids-parenting-older-kids-more-chill-2026-9", "summary": "The author looks back fondly on her kids childhood but also likes parenting older kids. Courtesy of Lindsay Karp I look back fondly on the time when my kids were little. However, now that they're 11 and 15, motherhood has changed. I like this version of being a parent, too. \"I just want to hug you forever.\" As those words spilled from my 3-year-old's mouth, I wanted to stay in that moment for eternity. One day, he'll wake up and realize there's a whole world out there, I thought, and hugging me will be a memory from his childhood . Eight years later, I can still feel that hug. Every day, Apple rounds up featured photos of my past, throwing me back into the days of diaper changes and nighttime feeds. From tiny feet and chubby legs to park playdates and brotherly snuggles, I imagine a time and place that no longer exists. A world of picnic lunches outdoors, story time at the library, and endless superhero dress-up sessions returns to me in a foggy haze. So long ago — yet so near — I can almost feel his arms squeezing me on that spring afternoon as he said the words that melted my heart in an instant. I loved their childhood years And each morning, scrolling through photos of my little boys, a piece of me yearns to go back. For a split second, I want to hold my babies again and be the mother they rely on for their every need. But then I remember the tears, the sleepless nights , the frequent colds, and the fury resulting from a missed nap. And I return to reality. I adored the sweetness of their unwavering love. Receiving handpicked dandelions and doctoring scrapes and bruises with Band-Aids was magical. Being the person they ran to at preschool pickup made everything else seem trivial. And every night — not long ago — reading a bedtime story and singing our nighttime songs, it felt like then and there was the only place I'd ever want to be. But something has changed within me. I'm reveling in their newfound independence and savoring regaining mine. Leaving their wondrous early years behind feels right. I also like this version of motherhood Now, my boys are 15 and 11, and motherhood has never been so chill. The days of volunteering in their preschool and elementary classrooms are behind me, and I wouldn't go back if I could. My high schooler wakes up, makes his breakfast, and leaves for the bus without me. He completes his schoolwork independently, and his school projects haven't been mine for a few years. The silly elementary schooler who would have done an", "date_str": "2026-09-18T13:07:01+00:00", "hash": "fc89e2757ba14dff", "title_fa": "من عاشق بزرگ کردن بچه های کوچک بودم. اکنون که من 11 و 15 ساله شده‌اند، تربیت فرزند بسیار آرام‌تر است.", "summary_fa": "نویسنده با علاقه به دوران کودکی بچه هایش نگاه می کند، اما دوست دارد بچه های بزرگتر را نیز تربیت کند. با حسن نیت از لیندسی کارپ من با علاقه به زمانی که بچه هایم کوچک بودند نگاه می کنم. با این حال، اکنون که آنها 11 و 15 ساله هستند، مادری تغییر کرده است. من این نسخه از پدر و مادر بودن را نیز دوست دارم. \"من فقط می خواهم تو را برای همیشه در آغوش بگیرم.\" همانطور که آن کلمات از دهان کودک 3 ساله ام سرازیر شد، می خواستم تا ابد در آن لحظه بمانم. فکر کردم یک روز از خواب بیدار می‌شود و می‌فهمد که یک دنیای کامل آنجاست، و در آغوش گرفتن من خاطره‌ای از دوران کودکی او خواهد بود. هشت سال بعد، هنوز می توانم آن آغوش را حس کنم. اپل هر روز عکس‌های برجسته‌ای از گذشته من را جمع‌آوری می‌کند و من را به روزهای تعویض پوشک و تغذیه شبانه بازمی‌گرداند. از پاهای ریز و پاهای چاق گرفته تا میهمانی های پارکی و آهسته های برادرانه، زمان و مکانی را تصور می کنم که دیگر وجود ندارد. دنیایی از ناهارهای پیک نیک در فضای باز، زمان داستان در کتابخانه، و جلسات بی پایان لباس ابرقهرمانی در مه مه آلود به من بازمی گردد. خیلی وقت پیش - در عین حال خیلی نزدیک - تقریباً می توانم حس کنم که بازوانش در آن بعد از ظهر بهاری در حالی که کلماتی را که قلبم را در یک لحظه ذوب کردند، مرا می فشرد. سالهای کودکی آنها را دوست داشتم و هر روز صبح، با مرور عکسهای پسرهای کوچکم، تکه ای از من مشتاق بازگشت است. برای یک ثانیه، می‌خواهم دوباره بچه‌هایم را در آغوش بگیرم و مادری باشم که برای هر نیازی به او تکیه می‌کنند. اما بعد اشک‌ها، شب‌های بی‌خوابی، سرماخوردگی‌های مکرر و"}, {"source": "Business Insider", "title": "The 'Godfather of AI' backs a new watchdog plan to track OpenAI and Anthropic's AI risks from the inside", "link": "https://www.businessinsider.com/geoffrey-hinton-ai-watchdogs-openai-anthropic-safety-2026-9", "summary": "Computer science pioneer Geoffrey Hinton. Ramsey Cardy/Sportsfile for Collision via Getty Images AI leaders Sam Altman and Dario Amodei recently committed to bringing in third-party evaluators. A group of AI evaluation groups laid out the conditions they want OpenAI and Anthropic to meet. Computer science pioneers Geoffrey Hinton and Stuart Russell signed the letter. OpenAI and Anthropic have been calling for AI-risk watchdogs, and they just got their response. The AI Evaluator Forum, which includes several watchdog groups, released a letter on Friday outlining \"minimum conditions\" that they believe labs like Anthropic and OpenAI should meet to work more effectively with those evaluating the risks of their technology. Dozens of people from the AI ecosystem signed onto the letter, including the computer science pioneers Geoffrey Hinton , known as \"the Godfather of AI,\" and Stuart Russell. This letter comes in response to Anthropic CEO Dario Amodei and OpenAI CEO Sam Altman, who both committed to welcoming third-party evaluators into their companies to assess AI risk and give them employee-level access to information amid a wave of AI-related fear online this week. \"To be credible, embedded third-party evaluators must have scientific objectivity, transparency, independence, and robust protections against interference from the evaluated companies,\" the letter said. The Friday letter says that evaluators should be allowed to be transparent and have \"unfiltered communication with the companies' boards and other privileged oversight bodies.\" They could also release findings publicly. The group suggests that these evaluators be shielded from retaliation from the AI labs and granted access to \"the same relevant systems, data, tools, and physical spaces\" as company assessors would. The letter also says that each lab should bring in \"differing viewpoints and areas of expertise,\" including on different types of risk. Those could include risks in biological sciences and loss of control. The forum behind the letter includes METR , a nonprofit AI evaluation group that recently investigated OpenAI's security incident with Hugging Face, and the AI Verification and Evaluation Research Institute (AVERI), an organization led by former OpenAI employee Miles Brundage and other groups. Other tech leaders also weighed in on the debate earlier this week. Microsoft CEO Satya Nadella said his firm welcomes the \"embedded evaluators\" idea. Have a tip? Contact this reporter via email ", "date_str": "2026-09-18T13:00:01+00:00", "hash": "d5960be2abca9030", "title_fa": "«پدرخوانده هوش مصنوعی» از طرحی جدید برای ردیابی خطرات هوش مصنوعی OpenAI و Anthropic از درون حمایت می کند.", "summary_fa": "جفری هینتون، پیشگام علوم کامپیوتر. Ramsey Cardy/Sportsfile for Collision via Getty Images، رهبران هوش مصنوعی سام آلتمن و داریو آمودی اخیرا متعهد شده اند ارزیاب های شخص ثالث را وارد کنند. گروهی از گروه‌های ارزیابی هوش مصنوعی شرایطی را که می‌خواهند OpenAI و Anthropic رعایت کنند، ارائه کردند. جفری هینتون و استوارت راسل از پیشگامان علوم رایانه نامه را امضا کردند. OpenAI و Anthropic خواستار ناظران خطر هوش مصنوعی شده‌اند، و آنها به تازگی پاسخ خود را دریافت کرده‌اند. انجمن ارزیاب هوش مصنوعی، که شامل چندین گروه ناظر است، روز جمعه نامه‌ای منتشر کرد که در آن \"حداقل شرایط\" را که به اعتقاد آنها آزمایشگاه‌هایی مانند Anthropic و OpenAI باید رعایت کنند تا با کسانی که خطرات فناوری خود را ارزیابی می‌کنند کارآمدتر کار کنند، منتشر کرد. ده ها نفر از اکوسیستم هوش مصنوعی، از جمله پیشگامان علوم کامپیوتر جفری هینتون، معروف به \"پدرخوانده هوش مصنوعی\" و استوارت راسل، نامه را امضا کردند. این نامه در پاسخ به داریو آمودی، مدیرعامل آنتروپیک و سام آلتمن، مدیر عامل OpenAI آمده است، که هر دو متعهد شدند که از ارزیاب‌های شخص ثالث در شرکت‌های خود استقبال کنند تا ریسک هوش مصنوعی را ارزیابی کنند و در میان موجی از ترس‌های آنلاین مرتبط با هوش مصنوعی در این هفته به آنها دسترسی به اطلاعات در سطح کارمندان بدهند. در این نامه آمده است: «برای معتبر بودن، ارزیاب‌های شخص ثالث تعبیه‌شده باید از عینیت علمی، شفافیت، استقلال و محافظت قوی در برابر مداخله شرکت‌های ارزیابی‌شده برخوردار باشند». در نامه جمعه آمده است که ارزیابان باید اجازه داشته باشند شفاف باشند و \"ارتباطات بدون فیلتر با هیئت مدیره شرکت ها و سایر نهادهای نظارتی ممتاز\" داشته باشند. آنها همچنین می توانند یافته ها را به صورت عمومی منتشر کنند. این گروه پیشنهاد می‌کند که این ارزیابان در مقابل اقدامات تلافی‌جویانه آزمایشگاه‌های هوش مصنوعی محافظت شوند"}, {"source": "Business Insider", "title": "Who is Howard Buffett? Meet Warren Buffett’s farmer-philanthropist son and Berkshire Hathaway’s new chairman", "link": "https://www.businessinsider.com/howard-buffett-berkshire-hathaway-new-chairman-farmer-philanthropist-2026-9", "summary": "Stanislav Ivanov/Global Images Ukraine via Getty Images Howard Buffett is succeeding his father, Warren Buffett, as Berkshire's chairman. The farmer and philanthropist has served on Berkshire's board since 1993. Here's what to know about Howard Buffett's life, career, and role at Berkshire. Warren Buffett is handing the chairmanship of Berkshire Hathaway to his son Howard Graham Buffett, who has served on the company's board since 1993. Berkshire announced Friday that the younger Buffett would become chairman, while his father would assume the title of chairman emeritus and remain a director. Howard Buffett, 71, won't be running Berkshire's sprawling collection of businesses. Greg Abel , who succeeded Warren Buffett as CEO at the beginning of 2026, remains in charge of the company and its major decisions. Instead, Howard Buffett will serve as a guardian of the corporate culture his father spent more than 60 years building. \"Greg runs the company; Howard will guard its culture and values,\" Warren Buffett wrote in a letter to shareholders accompanying the announcement. Farmer, conservationist, sheriff Howard, sometimes called \"Howie,\" is Warren Buffett's middle child. He joined Berkshire's board in 1993, giving him 33 years of experience as a director before taking the chair. His career has taken a less conventional path than those of many corporate directors. A longtime farmer, conservationist, and photographer, Howard has also held senior roles at the agribusiness giant Archer Daniels Midland and the agricultural equipment company GSI Group, according to his official foundation biography . He previously sat on the boards of companies including Coca-Cola, ConAgra Foods, and ADM. Farming is more than a side interest for Howard. He manages a 1,500-acre family farm in central Illinois, operates a 400-acre farm in Nebraska, and oversees three foundation research farms in Arizona, Illinois, and Nebraska totaling about 9,500 acres, according to a 2024 profile by No-Till Farmer . He is a longtime advocate of no-till farming and other conservation-based agricultural practices. Since 1999, he has served as chairman and CEO of the Howard G. Buffett Foundation. The foundation focuses much of its giving on food security, conflict mitigation, and efforts to combat human trafficking. According to his foundation, Howard has traveled to more than 150 countries and served as a United Nations World Food Program goodwill ambassador against hunger. Howard is a Republican and h", "date_str": "2026-09-18T12:44:40+00:00", "hash": "50a44456e0df551b", "title_fa": "هوارد بافت کیست؟ با پسر کشاورز و بشردوست وارن بافت و رئیس جدید برکشایر هاتاوی آشنا شوید.", "summary_fa": "استانیسلاو ایوانوف/ تصاویر جهانی اوکراین از طریق گتی ایماژ هاوارد بافت جانشین پدرش، وارن بافت، به عنوان رئیس برکشایر می شود. این کشاورز و بشردوست از سال 1993 در هیئت مدیره برکشایر خدمت کرده است. در اینجا آنچه باید در مورد زندگی، حرفه و نقش هاوارد بافت در برکشایر بدانید آمده است. وارن بافت ریاست برکشایر هاتاوی را به پسرش هاوارد گراهام بافت که از سال 1993 در هیئت مدیره این شرکت خدمت کرده است، واگذار می کند. برکشایر روز جمعه اعلام کرد که بافت جوان‌تر رئیس خواهد شد، در حالی که پدرش عنوان رئیس ممتاز را به عهده خواهد گرفت و مدیر باقی خواهد ماند. هاوارد بافت، 71 ساله، مجموعه تجاری گسترده برکشایر را اداره نخواهد کرد. گرگ آبل که در ابتدای سال 2026 جانشین وارن بافت به عنوان مدیرعامل شد، همچنان مسئول شرکت و تصمیمات اصلی آن است. در عوض، هاوارد بافت به عنوان نگهبان فرهنگ شرکتی ایفای نقش خواهد کرد که پدرش بیش از 60 سال را صرف ساختن آن کرده است. وارن بافت در نامه ای خطاب به سهامداران نوشت: \"گرگ شرکت را اداره می کند؛ هاوارد از فرهنگ و ارزش های آن محافظت خواهد کرد.\" کشاورز، حافظ محیط زیست، کلانتر هوارد، که گاهی «هاوی» نامیده می شود، فرزند وسط وارن بافت است. او در سال 1993 به هیئت مدیره برکشایر ملحق شد و قبل از تصدی این صندلی، 33 سال تجربه به عنوان کارگردان به او داد. حرفه او نسبت به بسیاری از مدیران شرکت ها مسیری کمتر متعارف را طی کرده است. بر اساس بیوگرافی رسمی بنیاد او، هاوارد یک کشاورز، حافظ محیط زیست و عکاس قدیمی، همچنین نقش های ارشد در غول تجارت کشاورزی Archer Daniels Midland و شرکت تجهیزات کشاورزی GSI Group را بر عهده داشته است. او قبلاً در هیئت مدیره شرکت هایی از جمله کوکاکولا، ConAgra Foods و ADM حضور"}, {"source": "Business Insider", "title": "Meta's personal AI agent Muse soars to the top of the App Store", "link": "https://www.businessinsider.com/meta-muse-personal-ai-agent-top-app-store-charts-2026-9", "summary": "Meta s personal AI agent Muse reached No. 1 among free apps on Apple s US App Store. Samuel Boivin/NurPhoto via Getty Images Meta's Muse app tops Apple's US App Store, surpassing ChatGPT. Muse's AI capabilities include booking, shopping, and integrating with popular services. Users report successful cost-saving tasks, but some face challenges with Meta's Muse AI agent. Mark Zuckerberg's ambition to bring \"personal superintelligence\" to everyone may be taking shape, one download at a time. Muse from Meta, the company's new personal AI agent, has climbed to No. 1 among free apps on Apple's US App Store, ahead of ChatGPT. Muse's rise is the latest example of consumers embracing AI agents. Unlike chatbots that simply answer questions , agents are designed to act on a user's behalf. Meta says Muse can help users research , fill out forms, buy items online, book restaurant reservations, find a dog sitter, and connect with services such as email, calendars, Spotify, Instagram, and OpenTable. Muse can remember users' preferences and handle tasks on their behalf while seeking approval before taking sensitive actions, Meta says. The App Store ranking comes a week after Muse's launch and is an early sign that Meta's bet on personal AI assistants is starting to pay off, even as its frontier models have lagged behind OpenAI and Anthropic on some key benchmarks. a week after launch, muse is now the #1 app in the App Store! it’s been SO exciting to see how much y’all have done with muse. we can’t wait to do more together! pic.twitter.com/0lwhijlpj3 — Alexandr Wang (@alexandr_wang) September 18, 2026 Early users have shared striking examples of how Muse has helped them. Entrepreneur Joe Devoy wrote in an X post last week that he uploaded his auto insurance policy and asked Muse to find identical coverage at a lower cost. According to Devoy, it found a policy saving him $3,500 a year, bought it, and canceled his old one in about five minutes. Yesterday I uploaded my auto insurance policy to Meta @Muse and asked for a better rate with identical coverage. In ~5 minutes, it found a policy saving me $3,500 /year, bought it, and canceled my old one. I knew I was overpaying. I’d abandoned several attempts to switch because… pic.twitter.com/HlIweoWN2K — Joe Devoy (@JosephDevoy) September 10, 2026 Another X user wrote that Muse found a green puffer jacket, located live discount codes, applied them, and completed the purchase at the lowest price. They also said it could find a reci", "date_str": "2026-09-18T12:39:12+00:00", "hash": "ab4fa447b0e20232", "title_fa": "مامور هوش مصنوعی شخصی متا، Muse به بالای اپ استور می رسد", "summary_fa": "عامل هوش مصنوعی شخصی متا، Muse، به رتبه 1 در میان برنامه های رایگان در اپ استور اپل در ایالات متحده رسید. Samuel Boivin/NurPhoto از طریق Getty Images برنامه Muse متا در صدر فروشگاه App ایالات متحده اپل قرار گرفت و ChatGPT را پیشی گرفت. قابلیت‌های هوش مصنوعی Muse شامل رزرو، خرید و ادغام با خدمات محبوب است. کاربران گزارش موفقیت آمیز وظایف صرفه جویی در هزینه را دارند، اما برخی از آنها با عامل هوش مصنوعی Muse متا با چالش هایی روبرو هستند. جاه طلبی مارک زاکربرگ برای آوردن \"فوق هوش شخصی\" به همه ممکن است، یک بار دانلود، در حال شکل گیری باشد. Muse from Meta، عامل هوش مصنوعی شخصی جدید این شرکت، پیش از ChatGPT به رتبه 1 در میان برنامه های رایگان در فروشگاه App ایالات متحده اپل رسیده است. ظهور Muse آخرین نمونه از استقبال مشتریان از عوامل هوش مصنوعی است. برخلاف ربات‌های چت که به سادگی به سؤالات پاسخ می‌دهند، نمایندگان طوری طراحی شده‌اند که از طرف کاربر عمل کنند. متا می‌گوید Muse می‌تواند به کاربران در تحقیق، پر کردن فرم‌ها، خرید آنلاین اقلام، رزرو رزرو رستوران، یافتن یک پرستار سگ و ارتباط با سرویس‌هایی مانند ایمیل، تقویم، Spotify، Instagram و OpenTable کمک کند. متا می‌گوید Muse می‌تواند تنظیمات برگزیده کاربران را به خاطر بسپارد و از طرف آنها وظایف خود را انجام دهد، در حالی که به دنبال تاییدیه قبل از انجام اقدامات حساس است. رتبه بندی اپ استور یک هفته پس از راه اندازی Muse انجام می شود و نشانه اولیه این است که شرط بندی متا روی دستیارهای هوش مصنوعی شخصی شروع به نتیجه می دهد، حتی اگر مدل های مرزی آن در برخی از معیارهای کلیدی از OpenAI و Anthropic عقب مانده اند. یک هفته پس از راه اندازی، muse اکنون برنامه شماره 1 در اپ استور است! بسیار هیجان"}, {"source": "Business Insider", "title": "We're told Gen Z is redefining adulthood. Sometimes I think we just can't afford the old definition.", "link": "https://www.businessinsider.com/gen-z-adulthood-homeownership-marriage-kids-unaffordable-2026-9", "summary": "The author worries that adulthood will never come for her. Courtesy of the author I'm almost 26 and have built a career I'm proud of as a travel journalist. Many of my friends have good jobs but can't afford homes, weddings, or children. I worry my generation is growing older before getting the adulthood we expected. In the weeks that followed high school graduation , I recall the collective panic among some of my girl friends already worrying that their time was running out — since in their mind, the timer just started. They officially began counting the months they had remaining to complete enough internships to qualify for an entry-level position at a company that could prepare them to be accomplished in their career by the time they're ready to have children with the husband they'd successfully met and dated long enough to marry, buy a home and begin a family with. That was not me. I feel behind Even as a teenager, I had understood that 30 was the new 20 and that none of the graduates who'd walked that stage before me looked any better positioned to grow up than I did. But now, as I quickly age out of Leonardo DiCaprio's dating pool, I'm feeling more behind than ever before. The author feels left behind in terms of adulthood milestones. Courtesy of the author I mean, Gisele Bundchen had reached the absolute peak of her modeling career at 25, Blake Lively was already Serena van der Woodsen by her mid 20s and — to escape examples limited to Leo's romantic interests — if I were Valentina Tereshkova, I would be preparing to be shot into outer space right now. Instead, I don't know anybody my age nearing the purchase of a house. In fact, I know very few people in their 30s who managed to acquire real estate, let alone get married and have children. And I think that's why growing up is suddenly so terrifying. Not because in order to grow up, we must buy houses, get married and have children — people should be free to reject traditional milestones, but that's different from an entire generation feeling like they're simply out of reach. I feel like my generation can't reach adulthood milestones When culture shifted from defining success by a photo of the nuclear family led by a 26-year-old patriarch, what made it empowering was imagining what could replace it: teaching English abroad, spending afternoons painting, pursuing poetry, collecting degrees like Pokemon, dating before settling down for somebody good enough , discovering your wildest dreams before putt", "date_str": "2026-09-18T12:20:01+00:00", "hash": "8a829cfaaadca343", "title_fa": "به ما گفته شده است که ژنرال Z در حال تعریف مجدد بزرگسالی است. گاهی اوقات فکر می‌کنم ما نمی‌توانیم تعریف قدیمی را بپذیریم.", "summary_fa": "نویسنده نگران است که بزرگسالی هرگز برای او نیاید. با حسن نیت نویسنده من تقریباً 26 ساله هستم و شغلی را ایجاد کرده ام که به عنوان روزنامه نگار مسافرتی به آن افتخار می کنم. بسیاری از دوستان من شغل خوبی دارند اما نمی توانند خانه، عروسی یا بچه را بپردازند. من نگرانم که نسل من قبل از رسیدن به بزرگسالی که انتظارش را داشتیم بزرگتر شود. در هفته‌های پس از فارغ‌التحصیلی از دبیرستان، وحشت جمعی را در میان برخی از دوستان دخترم به یاد می‌آورم که قبلاً نگران این بودند که وقتشان تمام شود - زیرا در ذهن آنها، تایمر تازه شروع شده بود. آن‌ها رسماً شروع به شمارش ماه‌های باقی‌مانده برای تکمیل دوره‌های کارآموزی کافی برای واجد شرایط شدن برای یک موقعیت ابتدایی در شرکتی کردند که می‌توانست آن‌ها را آماده کند تا در حرفه‌شان تا زمانی که آماده بچه‌دار شدن با شوهری هستند که با موفقیت ملاقات کرده‌اند و به اندازه کافی برای ازدواج، خرید خانه و تشکیل خانواده با او بچه‌دار شوند. اون من نبودم من احساس می کنم عقب مانده ام حتی در دوران نوجوانی، فهمیده بودم که 30 سالگی 20 جدید است و هیچ یک از فارغ التحصیلانی که قبل از من آن مرحله را طی کرده بودند، برای بزرگ شدن موقعیت بهتری نسبت به من نداشتند. اما اکنون که به سرعت از مجموعه دوستیابی لئوناردو دی کاپریو خارج می شوم، بیش از هر زمان دیگری عقب مانده ام. نویسنده احساس می کند از نظر نقاط عطف بزرگسالی عقب مانده است. با حسن نیت نویسنده، منظورم این است که ژیزل بوندشن در 25 سالگی به اوج مطلق حرفه مدلینگ خود رسیده بود، بلیک لایولی در اواسط دهه 20 خود سرنا ون در وودسن بود و - برای فرار از نمونه هایی که محدود به علایق رمانتیک لئو بود - اگر من جای والنتینا ترشکووا"}, {"source": "Business Insider", "title": "The 20 best airlines in the world, ranked by passengers", "link": "https://www.businessinsider.com/best-airlines-in-the-world-ranking-passengers-skytrax-2026-9", "summary": "Singapore Airlines was named the best airline in the world in 2026. Kevin Carter/Getty Images The aviation rating company Skytrax announced its 2026 World Airline Awards on Friday. Flyers evaluated airlines on factors like cleanliness, lounges, and offerings in different classes. Singapore Airlines was named the world's best airline for the sixth time. And the Oscar for best airline goes to… The aviation rating company Skytrax announced the winners of its annual 2026 World Airline Awards, known as \"the Oscars of the aviation industry,\" on Friday. To determine the winners, Skytrax conducted the world's largest airline passenger satisfaction survey. From September 2025 to August 2026, customers from over 100 nationalities completed Skytrax's questionnaire in eight languages, evaluating airlines on their cleanliness, onboard WiFi, airport services and lounges, and offerings in economy, business, and first class , among other factors. Out of the more than 325 airlines included in the survey results, Singapore Airlines was named the world's best in 2026 — the sixth time the airline has won the top spot since the awards began in 1999. \"We congratulate Singapore Airlines on this major achievement of being named the World's Best Airline 2026 which highlights the level of product and service excellence they are providing to customers,\" Skytrax CEO Edward Plaisted said in a press release. Take a look at the 20 best airlines in the world, according to passengers. 20. Thai Airways A digital sign board for international departures on Thai Airways at Suvarnabhumi Airport, Bangkok s international transportation hub, in Samut Prakan, Thailand, on July 14, 2026. Thai authorities have increased outbound screening and security measures to intercept international drug trafficking networks and enhance the country s aviation safety protocols following the arrest of a Thai Airways flight attendant in Melbourne, Australia, who was found carrying 1 kilogram of heroin in their luggage. (Photo by Matt Hunt/NurPhoto via Getty Images) Matt Hunt/NurPhoto via Getty Images Thai Airways also placed 10th in Skytrax's World's Best Cabin Crew ranking. 19. Swiss International Air Lines A Swiss International Air Lines Airbus A330. Marcin Golba/NurPhoto via Getty Images Swiss International Air Lines, Switzerland's flag carrier, was previously ranked 11th in Skytrax's 2025 ranking and 10th in 2024. 18. Virgin Atlantic LONDON, ENGLAND - AUGUST 10: A Virgin Atlantic Boeing 787-9 Dreamliner with ta", "date_str": "2026-09-18T12:01:01+00:00", "hash": "fe056e513734b507", "title_fa": "20 بهترین خطوط هوایی جهان بر اساس رتبه بندی مسافران", "summary_fa": "خطوط هوایی سنگاپور به عنوان بهترین شرکت هواپیمایی جهان در سال 2026 انتخاب شد. کوین کارتر/ گتی ایماژ شرکت رتبه بندی هوانوردی Skytrax جوایز جهانی 2026 خود را در روز جمعه اعلام کرد. فلایرها خطوط هوایی را بر اساس فاکتورهایی مانند تمیزی، سالن‌ها و پیشنهادات در کلاس‌های مختلف ارزیابی کردند. شرکت هواپیمایی سنگاپور برای ششمین بار به عنوان بهترین ایرلاین جهان انتخاب شد. و اسکار بهترین خط هوایی به... شرکت رتبه بندی هوانوردی Skytrax روز جمعه برندگان جوایز جهانی ایرلاین 2026 خود را که به عنوان \"اسکار صنعت هوانوردی\" شناخته می شود، اعلام کرد. برای تعیین برندگان، Skytrax بزرگترین نظرسنجی رضایت مسافران خطوط هوایی جهان را انجام داد. از سپتامبر 2025 تا آگوست 2026، مشتریان از بیش از 100 ملیت، پرسشنامه Skytrax را به هشت زبان تکمیل کردند و خطوط هوایی را از نظر تمیزی، وای‌فای داخلی، خدمات فرودگاهی و سالن‌های استراحت، و پیشنهادات اقتصادی، تجاری و فرست کلاس و سایر عوامل ارزیابی می‌کردند. از میان بیش از 325 شرکت هواپیمایی که در نتایج نظرسنجی شرکت داشتند، خطوط هوایی سنگاپور در سال 2026 به عنوان بهترین شرکت هواپیمایی جهان معرفی شد - ششمین باری که این شرکت هواپیمایی از زمان شروع جوایز در سال 1999، مقام اول را به دست آورد. ادوارد پلیستد، مدیرعامل Skytrax در بیانیه‌ای مطبوعاتی گفت: «ما به شرکت هواپیمایی سنگاپور برای این موفقیت بزرگ در انتخاب بهترین خط هوایی جهان در سال 2026 تبریک می‌گوییم. نگاهی به 20 بهترین خطوط هوایی جهان از نظر مسافران بیندازید. 20. تای ایرویز تابلوی دیجیتالی برای پروازهای بین المللی در تای ایرویز در فرودگاه سووارنابومی، مرکز حمل و نقل بین المللی بانکوک، در ساموت پراکان، تایلند، در 14 ژوئیه 2026."}, {"source": "Business Insider", "title": "Wear the bright outfit. This shoe founder says standing out helped her succeed.", "link": "https://www.businessinsider.com/marina-larroude-founder-work-wardrobe-outfit-photos-2026-9", "summary": "Marina Larroudé wears a red Alaïa dress. Maegan Gindi for BI When Marina Larroudé isn't designing new shoes, she's scouring the internet for something old to wear. She might be the cofounder of her namesake footwear brand, Larroudé, but she's not interested in chasing the latest luxury drops. Ever been on TheRealReal ? She's a regular. She even gets notifications when new (old) Chanel blazers are listed at a discount. Larroudé's shopping habits are influenced by her life in fashion. She spent a decade in editor roles at Condé Nast, then served as fashion director of the luxury department store Barneys . Now, the 46-year-old runs the company she and her husband, Ricardo, founded in their dining room nearly six years ago. Since then, the brand has grown to more than 700 employees, opened a factory in Brazil, expanded into accessories and clothes, and gained celebrity fans like Taylor Swift . Marina Larroudé wears an Alaïa dress she bought at Barneys. Maegan Gindi for BI As Larroudé's career has evolved, her style has, too. \"When I was at Barneys and Condé Nast, I was meeting with designers every day or doing store appearances, so I'd dress up more during my day-to-day,\" she told Business Insider. \"Now, I don't tend to dress up for the office. I am wearing flats every single day, walking up and down our townhouse. Being a founder, I'm more practical.\" Larroudé shoes are only a piece of her personal wardrobe, though. Business Insider's series, The Dress Code , gives readers an inside look at what powerful people wear every day and the fashion pieces they swear by. Reach out to reporter Amanda Krause to have your weekly wardrobe highlighted. \"I love fashion, and I dress for myself,\" Larroudé said. \"It makes me so happy every day when I get to wear something fun and festive, so I tend to wear lots and lots of color. I only wear black a few times in a year.\" During a busy week of meetings, work dinners, and office days, Business Insider documented Larroudé's colorful daily wardrobe . She also shared the fashion formula that helps her get dressed, and some of her favorite pieces in her wardrobe. Her outfit formula: practical, but always special There's one thing Larroudé hopes to convey through her daily fashion: \"That I have a personality.\" \"I don't like to blend in,\" Larroudé said, noting that she wants to be practical and comfortable, but still stand out. If she's wearing a T-shirt and jeans , for example, she'll add a crystal-covered blazer on top and funky he", "date_str": "2026-09-18T11:42:01+00:00", "hash": "73521b8994447edd", "title_fa": "لباس روشن بپوشید این بنیانگذار کفش می گوید که برجسته بودن به او کمک کرد تا موفق شود.", "summary_fa": "مارینا لاروده لباس قرمز آلایا می پوشد. Maegan Gindi برای BI وقتی مارینا لاروده در حال طراحی کفش های جدید نیست، او در اینترنت به دنبال چیزی قدیمی برای پوشیدن است. او ممکن است بنیانگذار برند کفش همنام خود، Larroudé باشد، اما او علاقه ای به تعقیب جدیدترین محصولات لوکس ندارد. تا به حال در TheRealReal بوده اید؟ او معمولی است. او حتی زمانی که بلیزرهای Chanel جدید (قدیمی) با تخفیف فهرست می شوند، اعلان دریافت می کند. عادات خرید لاروده تحت تأثیر زندگی او در مد است. او یک دهه را در نقش سردبیر در Condé Nast گذراند، سپس به عنوان مدیر مد فروشگاه لوکس بارنیز خدمت کرد. اکنون، این زن 46 ساله، شرکتی را که او و همسرش، ریکاردو، نزدیک به شش سال پیش در اتاق غذاخوری خود تأسیس کردند، اداره می کند. از آن زمان، این نام تجاری به بیش از 700 کارمند افزایش یافته است، کارخانه ای در برزیل افتتاح کرده، لوازم جانبی و لباس را گسترش داده و طرفداران مشهوری مانند تیلور سویفت را به دست آورده است. مارینا لاروده لباس آلایا را می پوشد که از بارنیز خریده بود. Maegan Gindi برای BI همانطور که حرفه Larroudé تکامل یافته است، سبک او نیز تکامل یافته است. او به Business Insider گفت: «زمانی که در Barneys و Condé Nast بودم، هر روز با طراحان ملاقات می‌کردم یا در فروشگاه‌ها ظاهر می‌شد، بنابراین در طول روز بیشتر لباس می‌پوشیدم. \"الان، من تمایلی به لباس پوشیدن برای دفتر ندارم. من هر روز لباس های تخت می پوشم، خانه شهری خود را بالا و پایین می روم. به عنوان یک بنیانگذار، من عملی تر هستم.\" کفش های لاروده تنها بخشی از کمد لباس شخصی او هستند. مجموعه بیزینس اینسایدر، کد لباس، به خوانندگان نگاهی درونی می‌دهد که افراد قدرتمند هر روز چه می‌پوشند و مدهایی که به آن"}, {"source": "Business Insider", "title": "The US Army doesn't want its soldiers trying to figure out new tech right before heading into combat training", "link": "https://www.businessinsider.com/us-army-new-technology-combat-training-2026-9", "summary": "Army officials have said soldier feedback on how systems perform is the most important takeaway on whether a drone will be useful. US Army photo by Staff Sgt. John Bae The Army has new guidance for when soldiers get unfamiliar technology. Leaders say new drones and other tech shouldn't arrive just before major combat training. Soldiers will now get months to learn new technology before key exercises. US soldiers are experimenting with a growing number of new technologies, particularly drones, but Army leaders say that there is a limit to how much troops can take on at once and still keep their focus on training for war. The Army is pushing to deploy thousands of drones across its formations over the coming years, but officials caution that giving soldiers new systems too late in the training cycle distracts them. A 180-day requirement is designed to give them time to master the tech before trying it in warfighting exercises. \"We've established a temporal threshold 180 days out where we have to give them that equipment then, so that they have sufficient time at home station to integrate that,\" Lt. Gen. James Isenhower, commander of the Army's Combined Arms Command, told reporters last week. Isenhower said the rule came about after the realization that soldiers were feeling the exhausting push and pull of training and experimentation, with the service asking troops to learn unfamiliar technology while simultaneously preparing for a fight. \"We've had a couple of examples in the recent past where we've given new technology to units just as they were entering what we call the box, where they're conducting their force-on-force operations,\" he said. \"We've realized the reality is we, I think, owe them more time so they can integrate that equipment and focus on fighting the enemy as opposed to what, often times, is a focus on simply trying to understand the equipment.\" Part of the challenge with drones, in particular, has been getting them into soldiers' hands long enough for them to be adequately trained on them. Troops have begun working with uncrewed systems in basic training , part of a broader push to expose soldiers to drone warfare early on in their careers. \"At this point, you would be hard-pressed to find an Army squad who has not had a drone in their formation and trained with it,\" said Col. Gregory Merkl, the Army's director of drone dominance. \"The challenge is to take that equipment and turn it into real capability; it takes reps and sets. So we're tr", "date_str": "2026-09-18T11:30:01+00:00", "hash": "17e1d0057f274d8f", "title_fa": "ارتش ایالات متحده نمی‌خواهد سربازانش درست قبل از شروع آموزش رزمی، فناوری جدیدی را کشف کنند", "summary_fa": "مقامات ارتش گفته اند که بازخورد سربازان در مورد نحوه عملکرد سیستم ها مهم ترین نکته در مورد مفید بودن پهپاد است. عکس ارتش ایالات متحده توسط گروهبان ستاد. جان بای ارتش راهنمایی های جدیدی برای زمانی که سربازان به فناوری ناآشنا دست پیدا می کنند، دارد. رهبران می گویند هواپیماهای بدون سرنشین جدید و سایر فناوری ها نباید درست قبل از آموزش رزمی بزرگ وارد شوند. سربازان اکنون ماه ها فرصت خواهند داشت تا قبل از تمرینات کلیدی، فناوری جدید را بیاموزند. سربازان آمریکایی در حال آزمایش تعداد فزاینده‌ای از فناوری‌های جدید، به‌ویژه هواپیماهای بدون سرنشین هستند، اما رهبران ارتش می‌گویند که محدودیتی برای تعداد سربازان در یک زمان وجود دارد و همچنان تمرکز خود را بر آموزش برای جنگ حفظ می‌کنند. ارتش در حال تلاش برای استقرار هزاران پهپاد در سراسر تشکیلات خود در سال‌های آینده است، اما مقامات هشدار می‌دهند که دادن سیستم‌های جدید بسیار دیر در چرخه آموزشی به سربازان، حواس آنها را پرت می‌کند. یک نیاز 180 روزه طراحی شده است تا به آنها زمان بدهد تا قبل از امتحان آن در تمرینات جنگی، بر این فناوری تسلط پیدا کنند. ژنرال جیمز ایزنهاور، فرمانده فرماندهی تسلیحات ترکیبی ارتش، هفته گذشته به خبرنگاران گفت: \"ما یک آستانه زمانی 180 روزه تعیین کرده‌ایم که باید آن تجهیزات را به آنها بدهیم، به طوری که آنها زمان کافی در ایستگاه خانه برای ادغام آن داشته باشند.\" ایزنهاور گفت که این قانون پس از درک این موضوع به وجود آمد که سربازان فشار و کشش طاقت فرسای آموزش و آزمایش را احساس می‌کردند، به طوری که سرویس از سربازان می‌خواست تا فناوری ناآشنا را یاد بگیرند و همزمان برای جنگ آماده شوند. او گفت: «ما چند نمونه در گذشته نزدیک داشته‌ایم که در آن‌ها فناوری جدیدی را به واحدها ارائه کرده‌ایم، درست زمانی که آن‌ها وارد چیزی شده‌اند که"}, {"source": "Business Insider", "title": "NATO trainers say Ukraine's rapid wartime pace is spotlighting just how slowly the West moves in peacetime", "link": "https://www.businessinsider.com/nato-ukraine-trainers-see-challenge-hitting-wartime-speeds-in-peace-2026-9", "summary": "Ukrainian soldiers are working at speeds that allies can t match, and Western training led by allies at peacetime has had to adjust. Diego Herrera Carcedo/Anadolu via Getty Images NATO trainers say Ukraine's wartime pace is exposing Western bureaucracy. Operation Legio is reshaping how allies think about speed and innovation. Leaders say peacetime processes won't work in a future major war. Working with Ukraine's soldiers has shown NATO trainers how far Western peacetime processes often lag behind the pace of a military fighting for its survival. Norway runs Operation Legio, a multinational effort that trains Ukrainian troops at Camp Jomsborg in eastern Poland while feeding battlefield lessons back into NATO militaries. Maj. John, the S3 Operations Officer in charge of synchronizing the training operation, told Business Insider that there's \"a lot of learning to be done for European nations.\" Camp Jomsborg is trying to adapt to the \"operational tempo of a wartime nation,\" he said, but for much of Europe, more broadly, questions remain about fast, responsible procurement and quick training pipelines that preserve quality. Brigadier Atle Molde, the commander of Task Force Legio, told Business Insider that \"it's not difficult to see that the way we operate in peacetime West wouldn't work.\" \"I think that's something that frustrates us all the time,\" he said. Keeping pace with Ukraine John said that the operation is working within a \"challenging dynamic,\" with the Camp Jomsborg training sitting at \"the mental and geographical middle point between war in the east and peacetime mechanism in the West.\" Ukraine needs training and equipment fast, \"and our processes, our mechanisms are not that used to that tempo,\" he said. Ukrainian soldiers are training at Camp Jomsborg in eastern Poland. Synne Nilsson / Forsvaret The West, John said, is \"used to long planning horizons.\" Ukraine \"needs effects now.\" However, \"we are improving,\" he added. Trying to maintain the right pace has \"met some difficulties,\" John said, but the multinational effort has shown it can adapt when required. Such adaptation can be seen in how the camp was built . It was carved out of the forest and built in just a few months. The training also evolves constantly as Ukrainian instructors and returning soldiers share lessons from the front lines. Jomsborg's training teams have already overhauled the trench network several times. Learning from Ukraine's speed Molde said that peacetime regulations for", "date_str": "2026-09-18T11:15:01+00:00", "hash": "5ffc24ecefa42732", "title_fa": "مربیان ناتو می گویند سرعت سریع اوکراین در زمان جنگ نشان می دهد که غرب چقدر کند در زمان صلح حرکت می کند.", "summary_fa": "سربازان اوکراینی با سرعتی کار می‌کنند که متحدان نمی‌توانند با آن برابری کنند و آموزش‌های غربی به رهبری متحدان در زمان صلح باید تعدیل می‌شد. Diego Herrera Carcedo/Anadolu از طریق Getty Images مربیان ناتو می گویند سرعت اوکراین در زمان جنگ بوروکراسی غربی را افشا می کند. عملیات Legio در حال تغییر نحوه تفکر متحدان در مورد سرعت و نوآوری است. رهبران می گویند که فرآیندهای زمان صلح در یک جنگ بزرگ آینده کارساز نخواهد بود. کار با سربازان اوکراینی به مربیان ناتو نشان داده است که فرآیندهای زمان صلح غرب تا چه حد از سرعت نظامیانی که برای بقای خود می جنگند عقب مانده است. نروژ عملیات لژیو را اجرا می کند، یک تلاش چند ملیتی که به آموزش نیروهای اوکراینی در کمپ جومزبورگ در شرق لهستان می پردازد و در عین حال درس های میدان نبرد را به ارتش های ناتو بازمی گرداند. سرگرد جان، افسر عملیات S3 که مسئول هماهنگ سازی عملیات آموزشی است، به Business Insider گفت که \"آموزش های زیادی برای کشورهای اروپایی باید انجام شود.\" او گفت که کمپ جومزبورگ در تلاش است تا با \"سرعت عملیاتی یک کشور زمان جنگ\" سازگار شود، اما برای بسیاری از اروپا، به طور گسترده تر، سوالاتی در مورد تدارکات سریع، مسئولانه و خطوط لوله آموزشی سریع وجود دارد که کیفیت را حفظ می کند. سرتیپ Atle Molde، فرمانده گروه ضربت لژیو، به Business Insider گفت که \"مشکل نیست که ببینیم روشی که ما در زمان صلح غرب عمل می کنیم، کار نمی کند.\" او گفت: \"من فکر می کنم این چیزی است که همیشه ما را ناامید می کند.\" همگام با اوکراین، جان گفت که عملیات در یک \"پویایی چالش برانگیز\" کار می کند، به طوری که آموزش کمپ جومزبورگ در \"نقطه میانی ذهنی و جغرافیایی بین جنگ در شرق و مکانیسم زمان صلح در غرب\" قرار"}, {"source": "Business Insider", "title": "Don't call, do text: Gen Z has a lot of feelings about phone etiquette", "link": "https://www.businessinsider.com/gen-z-spontaneous-phone-calls-2026-9", "summary": "Getty Images; Tyler Le/BI Younger generations simply aren't picking up the phone. That's OK — they're not doing much calling, either. How, and when, did spontaneous phone calls become rude? For the younger generations raised with smartphones , there is one phone feature they often avoid at all costs: the call button. The ubiquity of smartphones means that ringing someone up has become just one option among many. Now, we can send a text, email, DM, or voice note, and actual calls have fallen out of favor. Somewhere along the way, making a phone call without warning became less a casual way to catch up and more of an annoyance — or even a sign there's been an emergency. However, spontaneous calls still have their fans, and etiquette experts told Business Insider that they can help foster connection and clarity in real time. What happened to the spontaneous phone call? Spontaneous phone calls used to be exactly that: spontaneous . You'd call a friend because you were thinking about them, had a recipe to share, or simply wanted to hear their voice — no appointment required. But are we missing something by leaving those unplanned conversations behind? Could bringing back the casual check-in call actually be good for our relationships, stress levels, and overall well-being? For Mary Jane Copps, a communication expert known as the Phone Lady, the shift isn't just about younger generations preferring text messages over phone calls . Instead, it's a combination of evolving technology, expectations, and the fact that our phones are now always with us. Unlike previous generations, today's phone calls can arrive anytime, anywhere — while someone is working, driving, running errands, or simply taking a break. \"That's the difference of the phone on the wall in the kitchen, you were always at home when you took a phone call,\" Copps said. \"Whereas now you can be anywhere; you can be sleeping, you can be in a meeting, you can be skateboarding.\" Still, it's not only that calls can come at inconvenient times. The way we communicate has also changed because we now have endless options with our technology. \"While we call this a phone, it's really a computer with a phone app ,\" Copps said, holding one up. \"With this, I have the choice to text you, to email you, to talk to you on LinkedIn. I don't have to phone you.\" The phone call didn't disappear — it simply became one option among many. With texts, DMs, emails, and video calls competing for attention, picking up the phone is ", "date_str": "2026-09-18T11:02:01+00:00", "hash": "f2690556ec382a0d", "title_fa": "تماس نگیرید، پیامک ارسال کنید: ژنرال Z احساسات زیادی در مورد آداب تلفن دارد", "summary_fa": "گتی ایماژ; Tyler Le/BI نسل های جوان به سادگی تلفن را بر نمی دارند. اشکالی ندارد - آنها هم زیاد تماس نمی گیرند. چگونه و چه زمانی تماس های تلفنی خودجوش بی ادبانه شد؟ برای نسل های جوانی که با گوشی های هوشمند بزرگ شده اند، یک ویژگی تلفن وجود دارد که اغلب به هر قیمتی از آن اجتناب می کنند: دکمه تماس. فراگیر بودن تلفن های هوشمند به این معنی است که زنگ زدن به یک نفر تنها به یکی از گزینه های بسیاری تبدیل شده است. اکنون، می‌توانیم پیامک، ایمیل، DM یا یادداشت صوتی ارسال کنیم و تماس‌های واقعی از بین رفته‌اند. در طول مسیر، برقراری تماس تلفنی بدون اخطار کمتر به یک راه معمولی برای پاسخگویی و بیشتر آزاردهنده تبدیل شد - یا حتی نشانه‌ای از اینکه یک موقعیت اضطراری وجود دارد. با این حال، تماس های خودجوش هنوز طرفداران خود را دارند و کارشناسان آداب معاشرت به Business Insider گفتند که می توانند به تقویت ارتباط و وضوح در زمان واقعی کمک کنند. تماس تلفنی خودجوش چه شد؟ تماس‌های تلفنی خود به خود قبلاً دقیقاً همین بود: خود به خود. شما با یک دوست تماس می گیرید زیرا در مورد آنها فکر می کنید، دستور پختی برای به اشتراک گذاشتن دارید، یا به سادگی می خواهید صدای آنها را بشنوید - بدون نیاز به قرار ملاقات. اما آیا با پشت سر گذاشتن آن گفتگوهای برنامه ریزی نشده چیزی را از دست می دهیم؟ آیا بازگرداندن تماس های غیررسمی می تواند برای روابط ما، سطح استرس و رفاه کلی ما مفید باشد؟ برای مری جین کپس، کارشناس ارتباطات معروف به بانوی تلفن، این تغییر فقط به این نیست که نسل‌های جوان پیام‌های متنی را به تماس‌های تلفنی ترجیح دهند. در عوض، این ترکیبی از تکنولوژی در حال تکامل، انتظارات و این واقعیت است که تلفن های ما"}, {"source": "Business Insider", "title": "A look at the remarkable career of Warren Buffett, who bought his first stock at 11 and built a $1 trillion company", "link": "https://www.businessinsider.com/warren-buffett-95-birthday-berkshire-hathaway-stock-investing-025-8", "summary": "Warren Buffett is the chairman and former CEO of Berkshire Hathaway. Daniel Zuchnik / Getty Images Warren Buffett is stepping down as chairman of Berkshire Hathaway. The legendary investor, who recently turned 96, bought his first stock at 11 and built a $1 trillion company. Buffett made billions by investing in stocks like Coca-Cola and buying businesses like Geico. It's the end of a legendary investing era. Berkshire Hathaway announced today that Warren Buffett is stepping down as chairman . Buffett, who recently turned 96, retired from his role as CEO at the turn of the year. \"Serving as your Chairman has been the privilege of a lifetime, and I have never taken your trust for granted,\" Buffett wrote in his parting words as chairman to shareholders. \"Father Time always wins.\" Over the course of his six-decade career, the legendary investor transformed a failing textile mill into a $1 trillion conglomerate. Here's a look back at Buffett's remarkable life so far. Born to do business A family heads to California during the Great Depression. Bettmann/Getty Images Buffett was born in Omaha, Nebraska, on August 30, 1930, at the height of the Great Depression. He was the second of three children and the only son of Howard, a stockbroker and later a congressman, and Leila, a homemaker. The investor started his business career at six, selling Juicy Fruit chewing gum door to door. He later resold individual bottles of Coca-Cola from a pack, delivered newspapers, and built up a pinball machine business, which he later sold. Buffett was 11 when he bought his first stock, Cities Service Preferred, and filed his first tax return at 13. He bought a farm at 14 and rented it to a tenant farmer. When he was 16, he had amassed $5,000, around $85,000 in today's money. Learning from the best Woodrow Wilson High School; Bill Pugliano/Getty Buffett majored in business at Wharton before transferring to the University of Nebraska-Lincoln and graduating in 1950, at the age of 19. Around that time, he read Benjamin Graham's \"The Intelligent Investor,\" which introduced him to the key tenets of value investing, such as buying stocks so cheap that they provide a \"margin of safety.\" Buffett enrolled at Columbia Business School after learning Graham taught there. After graduating, he worked for his father's company for a year before joining Graham's investment firm, where he received a masterclass in analyzing companies and identifying bargain stocks. In 1952, at age 22, he married a c", "date_str": "2026-09-18T11:01:33+00:00", "hash": "2c211f16c2d86007", "title_fa": "نگاهی به حرفه قابل توجه وارن بافت، که اولین سهام خود را در 11 سالگی خرید و یک شرکت 1 تریلیون دلاری ساخت.", "summary_fa": "وارن بافت رئیس هیئت مدیره و مدیر عامل سابق برکشایر هاتاوی است. دانیل زوشنیک/ گتی ایماژ وارن بافت از ریاست برکشایر هاتاوی کناره گیری می کند. این سرمایه گذار افسانه ای که اخیراً 96 ساله شده است، اولین سهام خود را در 11 سال خرید و یک شرکت 1 تریلیون دلاری ساخت. بافت با سرمایه گذاری در سهامی مانند کوکاکولا و خرید مشاغلی مانند Geico میلیاردها دلار به دست آورد. این پایان دوران سرمایه گذاری افسانه ای است. برکشایر هاتاوی امروز اعلام کرد که وارن بافت از سمت خود کناره گیری می کند. بافت که اخیراً 96 ساله شده بود، در ابتدای سال از سمت خود به عنوان مدیرعامل بازنشسته شد. بافت در سخنان جدایی خود به عنوان رئیس هیئت مدیره خطاب به سهامداران نوشت: \"خدمت به عنوان رئیس شما یک امتیاز یک عمر بوده است و من هرگز اعتماد شما را بدیهی ندانسته ام.\" \"پدر زمان همیشه برنده است.\" این سرمایه‌گذار افسانه‌ای در طول شش دهه فعالیت حرفه‌ای خود، یک کارخانه نساجی در حال شکست را به یک مجتمع تجاری 1 تریلیون دلاری تبدیل کرد. در اینجا نگاهی به زندگی قابل توجه بافت تا کنون داریم. متولد شده برای تجارت خانواده ای در طول رکود بزرگ به کالیفرنیا می روند. بتمن/ گتی ایماژ بافت در اوماها، نبراسکا، در 30 اوت 1930 در اوج رکود بزرگ به دنیا آمد. او دومین فرزند از سه فرزند و تنها پسر هاوارد، دلال بورس و بعدها نماینده مجلس، و لیلا، خانه دار بود. این سرمایه گذار کار تجاری خود را در شش سالگی شروع کرد و آدامس جویسی فروت را در خانه به خانه می فروخت. او بعداً بطری‌های جداگانه کوکاکولا را از یک بسته دوباره فروخت، روزنامه‌ها را تحویل داد و یک تجارت ماشین پین‌بال دایر کرد که بعداً آن را فروخت. بافت 11 ساله بود که اولین سهام خود، Cities Service"}, {"source": "Business Insider", "title": "Warren Buffett is stepping down as chairman of Berkshire Hathaway", "link": "https://www.businessinsider.com/warren-buffett-stepping-down-chairman-berkshire-hathaway-2026-9", "summary": "Warren Buffett built his fortune through long-term investing at his firm, Berkshire Hathaway. Johannes EISELE / AFP via Getty Images After more than five decades, Warren Buffett is stepping down as Berkshire Hathaway chairman. He will become chairman emeritus, while his son will become chairman. In a letter to shareholders, the legendary investor said that \"Father Time always wins.\" Legendary investor Warren Buffett is stepping down as chairman of Berkshire Hathaway after more than five decades, marking the end of an era for one of Wall Street's most storied companies. In a statement, Berkshire Hathaway said Buffett had been named chairman emeritus, effective immediately, and will remain a member of the board of directors. He will be replaced as chairman by his son, Howard Buffett, the release said. The elder Buffett gained control of Berkshire in 1965, when it was a New England textile manufacturer, and transformed it into a conglomerate that eventually became one of the world's largest public companies. Buffett, who turned 96 in August, became chairman and CEO in 1970 and has made billions by investing in stocks like Coca-Cola and buying businesses like Geico. Buffett specialized in long-term value investing rather than short-term speculation, and focused on businesses and industries he truly understood. He's gifted more than half of his Berkshire stock to good causes but still owns more than $140 billion worth, making him one of the world's wealthiest people. Read more about Warren Buffett's storied Berkshire career: • I flew 4,400 miles to Warren Buffett's big bash in Omaha. All signs pointed to his legacy living on. • Warren Buffett says he might be one of the 10 luckiest people on the planet • 6 highlights from Warren Buffett's final year as Berkshire Hathaway CEO Buffett officially stepped down as CEO of Berkshire on January 1, after revealing his resignation plans to Berkshire shareholders at an annual meeting in Omaha in May 2025. Berkshire released a parting letter from Buffett to shareholders, in which he wrote that \"Father Time always wins,\" but has \"been generous with me.\" Read the letter in full here: To My Fellow Shareholders: Berkshire has an extraordinary group of shareholders. From the beginning, Charlie and I looked for owners who thought in decades rather than quarters, and we were fortunate to find a great many of you. Recently, I celebrated my 96th birthday with family and friends, including one of my great-grandchildren, who had just", "date_str": "2026-09-18T10:22:22+00:00", "hash": "ee221fbe7a66d493", "title_fa": "وارن بافت از ریاست برکشایر هاتاوی کناره گیری می کند", "summary_fa": "وارن بافت ثروت خود را از طریق سرمایه گذاری طولانی مدت در شرکت خود، برکشایر هاتاوی، به دست آورد. یوهانس آیزل / خبرگزاری فرانسه از طریق گتی ایماژ پس از بیش از پنج دهه، وارن بافت از ریاست برکشایر هاتاوی کناره گیری می کند. او رئیس بازنشسته خواهد شد، در حالی که پسرش رئیس خواهد شد. این سرمایه گذار افسانه ای در نامه ای به سهامداران گفت که \"پدر زمان همیشه برنده است.\" وارن بافت، سرمایه‌گذار افسانه‌ای، پس از بیش از پنج دهه از ریاست برکشایر هاتاوی کناره‌گیری می‌کند و پایان دورانی برای یکی از مشهورترین شرکت‌های وال استریت است. برکشایر هاتاوی در بیانیه ای اعلام کرد بافت به عنوان رئیس بازنشسته معرفی شده است و بلافاصله اجرایی می شود و به عنوان عضو هیئت مدیره باقی خواهد ماند. در این بیانیه آمده است که پسرش هاوارد بافت جایگزین او به عنوان رئیس خواهد شد. بافت بزرگ در سال 1965، زمانی که برکشایر یک تولیدکننده پارچه در نیوانگلند بود، کنترل برکشایر را به دست آورد و آن را به یک شرکت بزرگ تبدیل کرد که در نهایت به یکی از بزرگترین شرکت های عمومی جهان تبدیل شد. بافت که در آگوست 96 ساله شد، در سال 1970 رئیس هیئت مدیره و مدیرعامل شد و با سرمایه گذاری در سهامی مانند کوکاکولا و خرید کسب و کارهایی مانند Geico، میلیاردها دلار درآمد کسب کرده است. بافت در سرمایه‌گذاری با ارزش بلندمدت به جای سفته‌بازی کوتاه‌مدت تخصص داشت و بر کسب‌وکارها و صنایعی که واقعاً می‌دانست تمرکز کرد. او بیش از نیمی از سهام برکشایر خود را به اهداف خیر اهدا کرده است، اما همچنان بیش از 140 میلیارد دلار ارزش دارد و او را به یکی از ثروتمندترین افراد جهان تبدیل می کند. در مورد حرفه وارن بافت در برکشایر بیشتر بخوانید: • من 4400 مایل پرواز کردم تا وارن بافت"}, {"source": "Business Insider", "title": "I love my 4 kids and my 4 dogs, but sometimes I just need to shut the door on all of them", "link": "https://www.businessinsider.com/closed-bedroom-door-means-leave-mom-alone-2026-9", "summary": "The author said her bedroom has become her necessary respite from her big, busy family. Ableimages/Getty Images I first started retreating to my room when I was recovering from surgery after breast cancer. Eight years have passed, but I still see my room as a place for peace and quiet. If my door is closed, my kids know to go to their dad if they need something, and not to disturb me. My bedroom has become my escape, my sanctuary, my necessary respite from the hustle and bustle of a big family, including four kids and four rescue dogs. When I'm in my room, and the door is closed, my family knows there are very few reasons why they would be allowed to disturb me. Now, before you say, you chose this life, I want to acknowledge that I absolutely adore my family, including our little furry friends . However, like many families, our home can be noisy, busy, and at times, downright chaotic. I deserve a break , and I refuse to feel bad about that. My diagnosis changed me I was never one to slip off to my room until I was diagnosed with breast cancer . Even as a type 1 diabetic, I would manage my highs and lows in the kitchen or living room, riding out the symptoms, no matter what was going on around me. Do you have a hot take on a common parenting belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. When breast cancer chose me, and I had a mastectomy, the six-week recovery meant that often, I would be laid up in my room, sipping water, napping, or watching a show. My chest incisions were fragile for weeks, and I still had young kids. I had to keep my surgical site protected. This is when I broke my own \"no TVs in the bedrooms\" rule. My arms were useless during my recovery, so I couldn't hit up my usual go-to for entertainment, reading books. Instead, I binged multiple shows . At first, I hated being holed up in my room. I could hear my kids crying or laughing, and the dryer and dishwasher humming. Real life was happening out there, while I was stuck in my room. My room stayed my retreat As I recovered and stepped back into our hectic family life, I realized that my room was the only space that was just mine. My cozy (white) bedding, my completely sun-blocking curtains, minimal decor and clutter, and lamps that cast soft light across the room in the evenings when it was usually quiet — were all things that made me feel at peace. I learned that this was a space that my mind and body needed 8 years ago. Toda", "date_str": "2026-09-18T10:10:01+00:00", "hash": "b730710b75e11bd2", "title_fa": "من 4 بچه و 4 سگم را دوست دارم، اما گاهی اوقات فقط لازم است در را روی همه آنها ببندم", "summary_fa": "نویسنده گفت اتاق خواب او به استراحت ضروری او از خانواده بزرگ و شلوغش تبدیل شده است. Ableimages/Getty Images اولین بار زمانی ک c and cooling features. Mellow Sleep melds affordability with truly innovative bedding products. They've also created quite a presence on social media, namely TikTok , where, after interacting with a single video, a Live or sponsored post seems to follow me every few swipes. Oh, and the brand is almost always advertising a sale with deep discounts of up to 50%. Perhaps Mellow Sleep is most famous for its CloudAlign pillow , an ergonomically shaped foam pillow, and MarshMellow comforter , a double-stuffed comforter that promises never to go flat. The pricing is affordable, and there almost always seems to be a sale. I was intrigued to try to see how these products fit in with the likes of the best pillows and comforters . After spending a month with five of Mellow's popular products, I've developed a few favorites and spotlight everything you should know about the brand before making a purchase. I read the fine print, so you don't have to. What is Mellow Sleep? Each Mellow product arrives in a white zipper pouch. Jaclyn Turner/Business Insider Mellow Sleep is a direct-to-consumer bedding brand founded in 2025 that combines affordability with innovative, cooling, and ergonomically designed sleep products. Fueled by a viral TikTok Shop presence (including targeted marketing, sponsored posts, and live streams), the company reported scaling to $110 million in revenue within its first nine months. Product design at Mellow is heavily driven by customer social media feedback and online reviews to address everyday sleep discomfort. Mellow also operates an Amazon storefront , but the prices are better when shopping directly. However, its digital storefront reflects that rapid growth: navigating the website feels unpolished, offering an endless scroll of products rather than clean, filterable categories. I'm a big proponent of user-experience, so I hope the brand will consider adding filters to its browsing experience. The site does a good job of marketing its bundles to offer er.com/doctor-5-step-cancer-prevention-routine-testing-toxin-removal-2026-9", "summary": "Dr. Kumar works with patients who have many types of cancer, and said he s built a well-rounded health routine to lower his risk. Courtesy of Dr. Avishek Kumar An oncologist said simple habits help him reduce the risk of developing cancer long-term. He focuses on diet, exercise, and health screenings while reducing stress and exposure to toxins. His best advice is to start small with consistent habits and build your healthy routine over time. Every day, you're making hundreds of small decisions that might be exposing you to a higher risk of cancer. A few simple tweaks to your routine can help give you the best chance of preventing cancer , according to Dr. Avishek Kumar, a board-certified community oncologist in Edison, New Jersey. \"You can't fully eliminate the risk of having any sort of cancer,\" he told Business Insider. \"But the key is reducing the odds, partaking in certain habits over the course of a lifetime, which can cut down the odds.\" Small day-to-day decisions can add up to significant protection against deadly cancers like colon cancer and lung cancer. He shared his own routine as an example, with five key components to reduce major cancer risks. \"Simple substitutions done over weeks and months and years can really pay off vast dividends in cancer prevention as time goes on,\" Kumar said. \"Every given moment, we have the opportunity to take the stairs or substitute something healthy.\" He eats more fiber and fewer processed foods Fruit and vegetables are great sources of fiber. Images By Tang Ming Tung/Getty Images When it comes to nutrition, Kumar said his approach is to imagine a farmer from a century ago, prioritizing foods they would have eaten that can be harvested, foraged, or prepared at home. \"They probably wouldn't be eating Cheetos,\" he said. Think berries, whole grains, lean meats, eggs, and dairy. The most nutrient-dense picks are often fresh foods you'd find on the periphery of the grocery store, rather than the shelf-stable, ultra-processed food in the center aisles. That said, it's not realistic to completely cut out processed food, and Kumar loves a convenient trip to McDonald's (for a Filet O' Fish) as much as the rest of us. For a balanced diet , he makes sure that at least one meal a day is as little-processed as possible, so he doesn't have to stress about enjoying a brownie at work or a fast-food lunch. \"Really, it's a long-term effect that matters. It's those cumulative habits substituting a healthy, unprocessed plate of ber", "date_str": "2026-09-18T10:00:01+00:00", "hash": "7df4f4ee6640bbcd", "title_fa": "یک پزشک برنامه 5 مرحله ای خود را برای پیشگیری از سرطان به اشتراک می گذارد", "summary_fa": "دکتر کومار با بیمارانی که انواع مختلفی از سرطان دارند کار می کند و گفت که یک روال سلامت کامل برای کاهش خطر ایجاد کرده است. با حسن نیت از دکتر آویشک کومار یک سرطان شناس گفت عادات ساده به او کمک می کند تا خطر ابتلا به سرطان را در درازمدت کاهش دهد. او روی رژیم غذایی، ورزش، و غربالگری سلامت تمرکز می کند و در عین حال استرس و قرار گرفتن در معرض سموم را کاهش می دهد. بهترین توصیه او این است که با عادات ثابت شروع کنید و روتین سالم خود را در طول زمان بسازید. هر روز صدها تصمیم کوچک می گیرید که ممکن است شما را در معرض خطر بالاتر ابتلا به سرطان قرار دهد. به گفته دکتر آویشک کومار، متخصص سرطان شناسی جامعه در ادیسون، نیوجرسی، چند ترفند ساده در روال شما می تواند به شما کمک کند تا بهترین شانس پیشگیری از سرطان را داشته باشید. او به Business Insider گفت: \"شما نمی توانید خطر ابتلا به هر نوع سرطان را به طور کامل از بین ببرید.\" اما نکته کلیدی این است که احتمالات را کاهش دهید، عادت‌های خاصی در طول زندگی داشته باشید که می‌تواند شانس را کاهش دهد.» تصمیمات کوچک روزانه می تواند محافظت قابل توجهی در برابر سرطان های کشنده مانند سرطان روده بزرگ و سرطان ریه ایجاد کند. او روال خود را به عنوان مثال با پنج مؤلفه کلیدی برای کاهش خطرات عمده سرطان به اشتراک گذاشت. کومار گفت: «جایگزینی‌های ساده که طی هفته‌ها، ماه‌ها و سال‌ها انجام می‌شود، و
