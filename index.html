انشگاه تهران، دوشنبه ۲۷ مهر اعلام کرد کارگروهی برای رسیدگی به پوشش دانشجویان از حدود پنج تا شش ماه پیش تشکیل شده است. به‌گفته او، این کارگروه با «دعوت محرمانه» و گفت‌وگو با دانشجویان، پیش از ارجاع موارد به شورای انضباطی، برای «حل‌وفصل موضوع» اقدام می‌کند."}, {"source": "IranWire", "title": "تداوم اعتصاب غذای زندانیان در ۶۶ زندان؛ هشدار درباره موج تازه اعدام‌ها", "link": "https://iranwire.com/fa/news-1/159103-%D8%AA%D8%AF%D8%A7%D9%88%D9%85-%D8%A7%D8%B9%D8%AA%D8%B5%D8%A7%D8%A8-%D8%BA%D8%B0%D8%A7%DB%8C-%D8%B2%D9%86%D8%AF%D8%A7%D9%86%DB%8C%D8%A7%D9%86-%D8%AF%D8%B1-%DB%B6%DB%B6-%D8%B2%D9%86%D8%AF%D8%A7%D9%86-%D9%87%D8%B4%D8%AF%D8%A7%D8%B1-%D8%AF%D8%B1%D8%A8%D8%A7%D8%B1%D9%87-%D9%85%D9%88%D8%AC-%D8%AA%D8%A7%D8%B2%D9%87-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85%D9%87%D8%A7/", "summary": "کارزار «سه‌شنبه‌های نه به اعدام» در صد و چهل‌وسومین هفته خود، روز سه‌شنبه ۲۸مهر۱۴۰۵، با اعتصاب غذای زندانیان در ۶۶ زندان ایران ادامه یاف ...", "date_str": "2026-10-20T12:27:19+00:00", "hash": "60dbc801d99227c0", "title_fa": "تداوم اعتصاب غذای زندانیان در ۶۶ زندان؛ هشدار درباره موج تازه اعدام‌ها", "summary_fa": "کارزار «سه‌شنبه‌های نه به اعدام» در صد و چهل‌وسومین هفته خود، روز سه‌شنبه ۲۸مهر۱۴۰۵، با اعتصاب غذای زندانیان در ۶۶ زندان ایران ادامه یاف ... اعضای این کارزار در بیانیه هفتگی خود اعلام کردند که از ابتدای مهرماه تاکنون دست‌کم ۷۲ نفر در ایران اعدام شده‌اند و شمار دیگری از زندانیان، به‌ویژه بازداشت‌شدگان اعتراضات دی۱۴۰۴، در معرض صدور یا اجرای احکام اعدام قرار دارند. به گفته اعضای کارزار، اعتصاب غذا در زندان‌هایی از جمله اوین، قزل‌حصار، تهران بزرگ، قرچک، شیبان اهواز، عادل‌آباد شیراز، زاهدان، ارومیه، سنندج، مشهد و رشت ادامه دارد. این کارزار همچنین به تایید دوباره حکم اعدام «وریشه مرادی»، زندانی سیاسی کُرد، اشاره کرده است؛ حکمی که پیش‌تر در دیوان عالی کشور نقض شده بود. این کمپین با استقبال بین‌المللی نهادهای حقوق بشری مواجه شده است. روز گذشته لئوپولدو مالدونادو گوتیرس، گزارشگر ویژه سازمان ملل در امور آزادی عقیده و بیان، در بیانیه‌ای اعلام کرد که از نیمه‌شب سه‌شنبه به وقت تهران، در همبستگی با زندانیان زمان همکاری اسلامی را مصوبه این سازمان تلقی نمی‌کند چون «آیین کار سازمان رعایت نشد.» این قطعنامه در پایان نشست وزرای خارجه این سازمان که یکشنبه در بغداد به پایان رسید به تصویب رسید. اسماعیل بقایی، سخنگوی وزارت خارجه ایران، گفت: «مهم‌ترین مصوبه شورای وزیران سازمان همکاری اسلامی در نشست بغداد، بیانیه پایانی است که معمولا با اجماع تصویب می‌شود. آنچه حدود یکی دو ساعت پیش از تصویب بیانیه مطرح شد، این بود که نباید مواردی در متن بیانیه درج شود که موجب تفرقه میان کشورهای اسلامی شود. مشخصا منظور، موضوع یمن بود.» یکی از قطعنامه‌های صادر شده در این نشست از ایران خواسته است که «به قواعد حقوق بین‌الملل، منشور ملل متحد و کنوانسیون‌های وین درباره روابط دیپلماتیک و کنسولی احترام بگذارد و با نماینده شبه‌نظامیان حوثی در تهران تعامل نکند.» بند دیگری از این قطعنامه «از همه کشورها می‌خواهد که با نماینده شبه‌نظامیان حوثی در تهران تعامل نکنند، هیچ‌گونه مکاتبه یا معامله‌ای را از جانب او نپذیرند» چون «چنین مکاتبات و معاملاتی باطل و فاقد هرگونه اثر حقوقی هستند.» این قطعنامه از دولت‌های عضو سازمان همکاری اسلامی خواسته است از تسهیل سفر نماینده حوثی‌ها در تهران خودداری کنند و «در صورت حضور در قلمروشان، او را به دولت جمهوری یمن تحویل دهند.» ایران از حوثی‌های یمن که در حال مبارزه با ائتلاف به رهبری عربستان سعودی هستند حمایت می‌کند. نشست وزیران خارجه این سازمان از ۲۵ مهر به مدت دو روز در پایتخت عراق برگزار شد و از ایران عباس عراقچی در آن شرکت کرد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. وزیر خارجه ایران زمانی که برای اجلاس در بغداد بود گفته بود که اگر در بیانیه نهایی اجلاس «انصاف و توازن» رعایت نشود ممکن است ایران آن را قبول"}, {"source": "BBC Persian", "title": "مهدی خان‌بابا تهرانی، از چهره‌های سرشناس جنبش چپ ایران، درگذشت", "link": "https://www.bbc.com/persian/articles/cmn4ew0xlpeno?at_medium=RSS&at_campaign=rss", "summary": "مهدی خان‌بابا تهرانی، از چهره‌های باسابقه جنبش چپ ایران و فعالان سیاسی و دانشجویی پیش از انقلاب ۱۳۵۷، شامگاه دوشنبه ۲۷ مهر در ۹۲سالگی در فرانکفورت آلمان درگذشت. او که سال‌ها در جریان‌های  امانوئل مکرون، رئیس‌جمهور، آن را نپذیرفت. مقامات فرانسه اعلام کردند که از زمان شروع ناآرامی‌ها، بیش از ۲۵۰۰ نفر بازداشت شده‌اند. به گزارش خبرگزاری فرانسه، دست یکی از معترضان با نارنجک کنترل جمعیت پلیس قطع شد. حدود ۱۰۰۰ مامور پلیس هم زخمی شدند. اعتراضات ابتدا ماه گذشته با درخواست دانش‌آموزان برای بهبود شرایط مدارس آغاز شد، اما با افزایش شمار شرکت‌کنندگان در تظاهرات و مشارکت اتحادیه‌های کارگری و گروه‌های مختلف اعتراضی، دامنه وسیع‌تری از درخواست‌ها را در بر گرفت."}, {"source": "BBC Persian", "title": "تصاویر ماهواره‌ای چه چیزهایی از اقامتگاه تابستانی کیم جونگ اون فاش می‌کنند؟", "link": "https://www.bbc.com/persian/articles/cw203rv65058o?at_medium=RSS&at_campaign=rss", "summary": "تصاویر ماهواره‌ای از سواحل وونسان، تصویری نادر از تعطیلات و سبک زندگی خانواده کیم جونگ اون ارائه می‌دهد. قایق‌های تفریحی لوکس، تفریحگاه‌های ساحلی و مجموعه‌های اختصاصی، در تضاد آشکار با زندگی روزمره بسیاری از شهروندان کره شمالی قرار دارند که همچنان با محدودیت‌های اقتصادی و کمبودهای گسترده مواجه‌اند.", "date_str": "2026-10-20T04:19:01+00:00", "hash": "bbff7d9f3cade5d6", "title_fa": "تصاویر ماهواره‌ای چه چیزهایی از اقامتگاه تابستانی کیم جونگ اون فاش می‌کنند؟", "summary_fa": "تصاویر ماهواره‌ای از سواحل وونسان، تصویری نادر از تعطیلات و سبک زندگی خانواده کیم جونگ اون ارائه می‌دهد. قایق‌های تفریحی لوکس، تفریحگاه‌های ساحلی و مجموعه‌های اختصاصی، در تضاد آشکار با زندگی روزمره بسیاری از شهروندان کره شمالی قرار دارند که همچنان با محدودیت‌های اقتصادی و کمبودهای گسترده مواجه‌اند. یک شناور تفریحی لوکس ۸۰ متری از ماه ژوئیه تا اواسط اکتبر امسال بارها در تصاویر ماهواره‌ای در آب‌های ساحلی وونسان در کره شمالی دیده شده است. آنچه بیش از همه جلب توجه می‌کند، استخر ۴ خطه ۵۰ متری در امتداد عرشه و مجموعه‌ای از سرسره‌های آبی در یک سوی آن است. این شناور پس از آن‌که ماه‌ها در یک مرکز تعمیر و نگهداری بدون استفاده مانده بود، اوایل ژوئیه به بخشی از ساحل شرقی موسوم به شبه‌جزیره کالما منتقل شد. این منطقه در نزدیکی ونسان قرار دارد، یک تفریحگاه ساحلی که ویلایی بزرگ در آن قرار دارد و کیم جونگ اون، رهبر کره شمالی، و خانواده‌اش از آن استفاده می‌کنند. این تنها شناور بزرگی نبود که جابه‌جا شد. چند شناور دیگر نیز در تصاویر ماهواره‌ای بررسی‌شده از سوی بی‌بی‌سی، بارها در نزدیکی ویلای کیم دیده شدند. به‌طور گسترده تصور می‌شود این شناورها مورد استفاده کیم و خانواده‌اش هستند. مقام‌های سابق کره شمالی، فراریان از این کشور و کارشناسان می‌گویند بعید است فردی که ارتباطی با رهبری حکومت نداشته باشد بتواند مالک شناورهایی در این ابعاد باشد یا آزادانه از آن‌ها استفاده کند. ری جونگ هو می‌گوید: «زمستان آن‌ها را در کشتی‌سازی نگه می‌داشتند. وقتی تابستان می‌رسید، بیرونشان می‌آوردند و به ویلای کیم جونگ اون یا سمت کالما می‌بردند و برای شنا و تفریح از آن‌ها استفاده می‌کردند.» ری زمانی از مقام‌های «دفتر ۳۹» حزب کارگران بود، نهادی که گفته می‌شود در تامین و مدیریت ارز خارجی برای رهبری کره شمالی نقش دارد. ثروت کسانی که در رأس دیکتاتوری بسته و محرمانه"}, {"source": "BBC Persian", "title": "آیا ایران می‌خواهد جنگ به پاشنه آشیل انتخاباتی ترامپ تبدیل شود؟", "link": "https://www.bbc.com/persian/articles/cx62yqvj7drjo?at_medium=RSS&at_campaign=rss", "summary": "تا چند هفته دیگر، انتخابات در اسرائیل و سپس در آمریکا برگزار می‌شود؛ دو انتخاباتی که نتیجه آنها ترکیب مجالس دو کشور را تعیین خواهد کرد. به نظر می‌رسد هر دو رقابت انتخاباتی تحت تاثیر جنگ با ایران قرار گرفته‌اند. جنگی که اسرائیل و آمریکا علیه ایران آغاز کردند، باعث افزایش بهای انرژی در بازارهای جهانی شده و نشانه‌ای از پایان قریب‌الوقوع آن نیز دیده نمی‌شود.", "date_str": "2026-10-20T07:50:39+00:00", "hash": "784b589c02b21cc9", "title_fa": "آیا ایران می‌خواهد جنگ به پاشنه آشیل انتخاباتی ترامپ تبدیل شود؟", "summary_fa": "تا چند هفته دیگر، انتخابات در اسرائیل و سپس در آمریکا برگزار می‌شود؛ دو انتخاباتی که نتیجه آنها ترکیب مجالس دو کشور را تعیین خواهد کرد. به نظر می‌رسد هر دو رقابت انتخاباتی تحت تاثیر جنگ با ایران قرار گرفته‌اند. جنگی که اسرائیل و آمریکا علیه ایران آغاز کردند، باعث افزایش بهای انرژی در بازارهای جهانی شده و نشانه‌ای از پایان قریب‌الوقوع آن نیز دیده نمی‌شود. در چنین شرایطی، وزیر دفاع دولت نخست دونالد ترامپ در گفت‌وگویی اعلام کرده است که بهترین سیاست آمریکا در قبال ایران، ادامه محاصره دریایی این کشور است. مارک اسپر در گفت‌وگو با شبکه فاکس‌نیوز گفت محاصره دریایی به‌مراتب بهتر از «حمله زمینی است که هیچ‌کس خواهان آن نیست.» او افزود یکی دیگر از مزیت‌های ادامه محاصره دریایی ایران این است که آمریکا را در منطقه نگه می‌دارد؛ چون از نظر او، خروج ایالات متحده از منطقه یک شکست راهبردی خواهد بود. آقای اسپر که خود سابقه خدمت در ارتش آمریکا و حضور در جنگ خلیج فارس را دارد، در این مصاحبه گفت محاصره دریایی برای اثرگذاری به زمان نیاز دارد، اما در نهایت بر اقتصاد و رهبران ایران تاثیر خواهد گذاشت. به گفته او، این راهبرد سرانجام ایران را به پای میز مذاکره بازخواهد گرداند. او با این حال تاکید کرد که برای موفقیت چنین سیاستی، آمریکا باید هم صبر داشته باشد و هم آن را با ثبات و انسجام دنبال کند. یکی از نکات قابل‌توجه در مصاحبه مارک اسپر این بود که در واکنش به اظهارات مقام‌های ایرانی و اسرائیلی، توجه مخاطبان را به این موضوع جلب کرد که هر دو طرف، هرچند به زبان انگلیسی و خطاب به افکار عمومی آمریکا سخن می‌گویند، در واقع مخاطب اصلی‌شان مردم کشورهای خودشان هستند. او گفت سخنان مقام‌های ایرانی، از جمله عباس عراقچی که در پیامی در شبکه ایکس نوشته بود ایران نیز «کار ناتمام»"}, {"source": "BBC Persian", "title": "روایت دنیای مخفی خرابکاری علیه پوتین در داخل روسیه", "link": "https://www.bbc.com/persian/articles/c615jlj0gjj7o?at_medium=RSS&at_campaign=rss", "summary": "دو مرد روس که مخفیانه برای سرویس‌های اطلاعاتی اوکراین کار می‌کنند، روایت‌های نادری از عملیات‌هایی ارائه کرده‌اند که می‌گویند در آن‌ها نقش داشته‌اند؛ عملیاتی که دارایی‌ها و نیروهای نظامی را در داخل روسیه هدف قرار داده است.", "date_str": "2026-10-19T20:35:56+00:00", "hash": "f695e863d238ebe9", "title_fa": "روایت دنیای مخفی خرابکاری علیه پوتین در داخل روسیه", "summary_fa": "دو مرد روس که مخفیانه برای سرویس‌های اطلاعاتی اوکراین کار می‌کنند، روایت‌های نادری از عملیات‌هایی ارائه کرده‌اند که می‌گویند در آن‌ها نقش داشته‌اند؛ عملیاتی که دارایی‌ها و نیروهای نظامی را در داخل روسیه هدف قرار داده است. یکی از این مردان که او را «ایوان» می‌نامیم، ادعا می‌کند از داخل روسیه در حملات پهپادی اوکراین به بمب‌افکن‌های راهبردی و کارخانه‌های مهمات در خاک کشور خودش نقش داشته است. او در مستندی از سرویس جهانی بی‌بی‌سی درباره دنیای پنهان خرابکاران روس حضور دارد. این مستند که مارسین مامون، روزنامه‌نگار مستقل لهستانی، آن را ساخته، مرد دیگری را نیز معرفی می‌کند که او را «فوما» می‌نامیم؛ یک روس ساکن تبعید در لهستان. فوما می‌گوید شبکه‌ای از داوطلبان مخفی در روسیه را اداره می‌کند که وظیفه آنها زیر نظر گرفتن افسران بلندپایه‌ای است که به گفته او، اداره اطلاعات نظامی اوکراین در حال بررسی احتمال هدف قرار دادنشان است. او تاکید می‌کند که این داوطلبان هرگز در خودِ حملات مشارکت ندارند. فوما همچنین درباره این‌که چه کسانی تحت نظر بوده‌اند سکوت می‌کند، اما پس از ترور سپهبد فانیل ساروواروف در دسامبر سال گذشته در مسکو، اذعان کرد که اطلاعاتی درباره او در اختیار اوکراینی‌ها گذاشته بود. پیش از این گزارش‌های رسانه‌ای درباره گروه‌های خرابکاری روس منتشر شده بود، اما دسترسی به کسی مانند ایوان که در داخل روسیه فعالیت می‌کند و درباره فعالیت‌های ادعایی خود توضیح می‌دهد، نادر است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. وقتی از افسر رابط ایوان پرسیده شد که آیا می‌توان به او اعتماد کرد یا نه، پاسخ داد: «من از هیچ‌کس مطمئن نیستم؛ جز خودم.» هم اداره اطلاعات نظامی اوکراین و هم این دو مرد درباره میزان اطلاعاتی که در اختیار دیگران می‌گذارند محتاط هستند و همین باعث می‌شود راستی‌آزمایی فعالیت‌هایی که ادعا می‌کنند"}, {"source": "BBC Persian", "title": "ماموریت فضایی تازه؛ آوردن نمونه‌ای از یکی از قمرهای مریخ به زمین", "link": "https://www.bbc.com/persian/articles/c8ly070eppd7o?at_medium=RSS&at_campaign=rss", "summary": "قرار است فضاپیمایی در قالب یک ماموریت بلندپروازانه پرتاب شود تا ۱۰ گرم غبار از یکی از قمرهای مریخ را به زمین بازگرداند.", "date_str": "2026-10-19T23:05:10+00:00", "hash": "4cdb3e0c526ba51d", "title_fa": "ماموریت فضایی تازه؛ آوردن نمونه‌ای از یکی از قمرهای مریخ به زمین", "summary_fa": "قرار است فضاپیمایی در قالب یک ماموریت بلندپروازانه پرتاب شود تا ۱۰ گرم غبار از یکی از قمرهای مریخ را به زمین بازگرداند. قرار است یک ماموریت فضایی پرتاب شود که تلاش خواهد کرد بخشی از قمر فوبوسِ مریخ را برداشته و به زمین بازگرداند. اگر این ماموریت موفقیت‌آمیز باشد، برای نخستین بار نمونه‌ای از مریخ یا قمرهای آن برای بررسی در آزمایشگاه‌های زمین منتقل خواهد شد. این فضاپیما از ژاپن پرتاب می‌شود و در اوت ۲۰۲۷ به فوبوس خواهد رسید. امید می‌رود ماموریت «کاوش قمرهای مریخ» (MMX) که تحت هدایت آژانس فضایی ژاپن انجام می‌شود، معمای چگونگی شکل‌گیری قمرهای مریخ را حل کند. پروفسور سارا راسل از موزه تاریخ طبیعی، که معاون بخش تحلیل نمونه‌ها در ماموریت MMX است، گفت: «هنوز هیچ مأموریت موفقی انجام نشده که به فوبوس برود و بخشی از آن را به زمین بازگرداند.» او افزود: «فکر می‌کنم این ماموریتی فوق‌العاده بلندپروازانه و هیجان‌انگیز است.» در بخش درونی منظومه شمسی تنها سه قمر وجود دارد: ماهِ زمین و دو قمر مریخ که فوبوس و دیموس نام دارند. هر دوی این قمرها بسیار کوچک‌اند. قطر فوبوس حدود ۲۰ کیلومتر و قطر دیموس حدود ۱۰ کیلومتر است. آنها همچنین شکلی نامنظم دارند و کمی شبیه سیب‌زمینی‌های فضایی به نظر می‌رسند. فضاپیمای ماموریت MMX هنگام رسیدن به مدار و محیط اطراف مریخ، دیموس را مطالعه خواهد کرد و سپس تمرکز خود را بر فوبوس می‌گذارد. این ماموریت قصد دارد یک مریخ‌نورد کوچک را برای بررسی سطح این قمر فرود آورد، هرچند انجام این کار آسان نخواهد بود. پروفسور سارا راسل می‌گوید تاکنون هیچ‌کس مریخ‌نوردی را روی چنین قمر کوچکی فرود نیاورده است. او توضیح داد: «خود این قمر گرانش چندانی ندارد و افزود: اما در کنار سیاره‌ای عظیم قرار گرفته که گرانش بسیار بیشتری دارد و همین موضوع فرود آوردن یک مریخ‌نورد روی سطح آن را بسیار دشوارتر"}, {"source": "BBC Persian", "title": "آرش سزاوار، عکاس، آهنگساز و ترانه‌سرای موسیقی پاپ ایران درگذشت", "link": "https://www.bbc.com/persian/articles/c5y43rlljvdlo?at_medium=RSS&at_campaign=rss", "summary": "آرش سزاوار، عکاس، ترانه‌سرا و آهنگساز دوران طلایی موسیقی پاپ ایران، یکشنبه ۲۶ مهر ۱۴۰۵ در ۸۳سالگی در تهران درگذشت. هنرمندی که ترانه‌هایش با خاطرات چند نسل پیوند خورده‌اند و اکنون با همرسانی آثار او در شبکه‌های اجتماعی، یادش را گرامی می‌دارند.", "date_str": "2026-10-19T16:42:49+00:00", "hash": "165a1dc6922614ec", "title_fa": "آرش سزاوار، عکاس، آهنگساز و ترانه‌سرای موسیقی پاپ ایران درگذشت", "summary_fa": "آرش سزاوار، عکاس، ترانه‌سرا و آهنگساز دوران طلایی موسیقی پاپ ایران، یکشنبه ۲۶ مهر ۱۴۰۵ در ۸۳سالگی در تهران درگذشت. هنرمندی که ترانه‌هایش با خاطرات چند نسل پیوند خورده‌اند و اکنون با همرسانی آثار او در شبکه‌های اجتماعی، یادش را گرامی می‌دارند. «نمیاد» با صدای گوگوش، «زندون دل» و «غم تنهایی» با صدای فریدون فروغی، «قصه قلب دورنگ» با صدای نلی و «کی صدا کرد منو» و «سکه ماه» با صدای مرجان، از جمله ترانه‌هایی هستند که نام آرش سزاوار با آنها گره خورده است؛ آثاری که در سال‌های شکوفایی موسیقی پاپ ساخته شدند و برخی از آنها پس از گذشت بیش از نیم قرن همچنان شنیده می‌شوند. آرش سزاوار با نام اصلی محمدحسن سزاوار خجلی، ۲۴ دی ۱۳۲۲ در شهرستان فریمان خراسان به دنیا آمد و دوران دبستان را در مدرسه غزالی مشهد گذراند. او از نوجوانی برای تأمین معاش به عکاسی روی آورد و در آتلیه‌های عکاسی و محافل هنری فعالیت می‌کرد. سزاوار که از همان سال‌ها به موسیقی و خوانندگی علاقه داشت، در پانزده‌سالگی با راهنمایی عطاالله خرم، آهنگساز و استاد موسیقی، نام «آرش» را برای فعالیت هنری خود انتخاب کرد. عکاسی از هنرمندان و حضور در مجالس موسیقی نیز زمینه آشنایی و همکاری او با چهره‌های شناخته‌شده آن دوران را فراهم کرد. آرش سزاوار سال‌ها بعد در صفحه اینستاگرامش خاطره‌ای از یک مراسم عروسی در سال ۱۳۴۴ نقل کرد؛ شبی که برای عکاسی به مجلس رفته بود، اما فرصتی پیدا کرد تا در حضور ویگن، خواننده سرشناس آن روزگار، آواز بخواند. او از پیش با خانواده عروس آشنا بود و گاهی در جشن‌های تولد او ترانه‌هایی از ویگن می‌خواند. آن شب که این خواننده اجرای موسیقی مراسم را بر عهده داشت، عروس از او خواست اجازه دهد عکاس مجلس نیز برای مهمانان ترانه‌ای بخواند. ویگن ابتدا با لحنی شوخ‌طبعانه اما سخت‌گیرانه پذیرفت و گفت اگر عکاس"}, {"source": "Iran International", "title": "ایران در دومین روز پاراآسیایی ناگویا؛ کسب ۳۰ مدال و صعود به رتبه پنجم جدول توزیع مدال‌ها", "link": "https://www.iranintl.com/202610201472", "summary": "در پایان دومین روز از بازی‌های پاراآسیایی ۲۰۲۶ ناگویا، ورزشکاران ایران با کسب ۳۰ مدال، شامل ۷ طلا، ۹ نقره و ۱۴ برنز، به رده پنجم جدول توزیع مدال‌ها صعود کرد. ز از اختلال در خدمات ارتباطات ماهواره‌ای مورد استفادهٔ نیروهای ارتش اوکراین انتقاد و تلویحاً اشاره کرد که این محدودیت از طرف دولت آمریکا اعمال شده است. او روز یک‌شنبه، ۲۶ مهرماه، در مصاحبه با شبکه آمریکایی ان‌بی‌سی خبر داد که روند مشارکت در اطلاعات و ارتباطات ماهواره‌ای از سر گرفته شده و به همین خاطر از دونالد ترامپ تشکر کرد. با این حال وزیر خارجه آمریکا در سفرش به ازبکستان به خبرنگاران گفت روند مشارکت در اطلاعات و ارتباطات ماهواره‌ای با اوکراین به‌هیچ عنوان حذف نشده و نمی‌داند که زلنسکی «این حرف‌ها را از کجا می‌آورد». حال به گفته زلنسکی در گفت‌وگو با اعضای سنای آمریکا که به گزارش خبرگزاری فرانسه روز دوشنبه انجام شده، پنتاگون «در تحویل موشک‌هایی که کشورهای اروپایی قبلا پولش را داده‌اند تأخیر می‌اندازد»."}, {"source": "Radio Farda", "title": "هگست در سفری «اعلام‌نشده» به اسرائیل با نتانیاهو دیدار کرد", "link": "https://www.radiofarda.com/a/hegseth-middle-east/33879980.html", "summary": "وب‌سایت اکسیوس در گزارشی به نقل از دو منبع آگاه، از دیدار پیت هگست، وزیر دفاع آمریکا، با بنیامین نتانیاهو، نخست‌وزیر اسرائیل، در روز دوشنبه ۲۷ مهر در اسرائیل خبر داد.", "date_str": "2026-10-20T06:57:51+00:00", "hash": "db5d408a95402c6b", "title_fa": "هگست در سفری «اعلام‌نشده» به اسرائیل با نتانیاهو دیدار کرد", "summary_fa": "وب‌سایت اکسیوس در گزارشی به نقل از دو منبع آگاه، از دیدار پیت هگست، وزیر دفاع آمریکا، با بنیامین نتانیاهو، نخست‌وزیر اسرائیل، در روز دوشنبه ۲۷ مهر در اسرائیل خبر داد. وب‌سایت اکسیوس به نقل از دو منبع آگاه گزارش داد پیت هگست، وزیر دفاع آمریکا، روز دوشنبه ۲۷ مهر در سفری اعلام‌نشده به اسرائیل با بنیامین نتانیاهو، نخست‌وزیر این کشور، دیدار کرده است. این سفر در حالی انجام شده که تنها هشت روز تا انتخابات پارلمانی اسرائیل باقی مانده و آمریکا و اسرائیل دربارهٔ احتمال ازسرگیری عملیات نظامی گسترده علیه ایران گفت‌وگو می‌کنند. به گفتهٔ منابع اکسیوس، این دیدار در پایگاه هوایی «عوودا» در جنوب اسرائیل برگزار شد؛ پایگاهی که هواپیماهای سوخت‌رسان و جنگنده‌های آمریکایی در آن مستقر هستند. رادیو ارتش اسرائیل نیز محل دیدار را یک پایگاه هوایی در صحرای جنوب این کشور اعلام کرد. آکسیوس گزارش داد هگست با نیروهای آمریکایی مستقر در این پایگاه نیز دیدار کرده است. پنتاگون و سفارت اسرائیل از اظهارنظر خودداری کردند و دفتر نخست‌وزیر اسرائیل نیز بلافاصله به درخواست اظهارنظر پاسخ نداد. هگست پس از انتشار این گزارش، تصاویری از دیدار خود با نیروهای آمریکایی منتشر کرد و گفت از نظامیان مستقر در حوزهٔ مسئولیت فرماندهی مرکزی ارتش آمریکا، سنتکام، بازدید کرده است. این حوزه خاورمیانه، شمال‌شرق آفریقا و بخش‌هایی از آسیا را در بر می‌گیرد. سفر او هم‌زمان با تشدید تنش میان واشینگتن و تهران بر سر تنگهٔ هرمز و افزایش حملات حوثی‌های مورد حمایت ایران به عربستان سعودی انجام شده است. این دیدار همچنین یک روز پس از آن صورت گرفت که دونالد ترامپ، رئیس‌جمهور آمریکا، از انتخاب مجدد نتانیاهو حمایت کرد. دو رهبر در پیام‌ها و گفت‌وگوی تلفنی خود بر «پایان کار ناتمام» در قبال جمهوری اسلامی تأکید کرده‌اند. با این حال، نتانیاهو در ماه جاری میلادی به رسانه‌های اسرائیلی گفته است که به‌دنبال حمله به ایران پیش"}, {"source": "Radio Farda", "title": "ناآرامی گسترده و غارت فروشگاه‌ها در میلان؛ ارتش برای «دفاع از شهر» مستقر می‌شود", "link": "https://www.radiofarda.com/a/milan-luxury-shops-close-for-fear-of-new-unrest-as-government-prepares-to-deploy-troops/33879937.html", "summary": "جورجا ملونی، نخست‌وزیر ایتالیا، که سال آینده با انتخابات سراسری روبه‌رو خواهد شد، خشونت‌ها را محکوم و نشستی با وزیران و مقام‌های ارشد امنیتی برای بررسی وضعیت برگزار کرد.", "date_str": "2026-10-20T05:48:04+00:00", "hash": "bea418d6b576eb29", "title_fa": "ناآرامی گسترده و غارت فروشگاه‌ها در میلان؛ ارتش برای «دفاع از شهر» مستقر می‌شود", "summary_fa": "جورجا ملونی، نخست‌وزیر ایتالیا، که سال آینده با انتخابات سراسری روبه‌رو خواهد شد، خشونت‌ها را محکوم و نشستی با وزیران و مقام‌های ارشد امنیتی برای بررسی وضعیت برگزار کرد. دولت ایتالیا پس از دو روز ناآرامی که طی آن معترضان با پلیس درگیر شدند، فروشگاه‌ها را غارت کردند و به اموال عمومی و خصوصی آسیب رساندند، ارتش را برای «دفاع از میلان» به این شهر اعزام خواهد کرد. خبر اعزام ۵۰۰ نیروی ارتش به میلان را ماتئو سالوینی، معاون نخست‌وزیر ایتالیا، روز دوشنبه ۲۷ مهر اعلام کرد. انتظار می‌رود اعزام این نیروها بخشی از بسته تدابیر امنیتی جدید دولت باشد که قرار است در نشست روز سه‌شنبه هیئت وزیران تصویب شود. فروشگاه‌های مرکز میلان، پایتخت اقتصادی ایتالیا، روز دوشنبه از بیم آغاز دور تازه‌ای از خشونت‌ها، زودتر از موعد تعطیل کردند و ویترین‌های خود را با تخته‌های چوبی پوشاندند. بیشتر فروشگاه‌های منطقه تجاری لوکس «ویا مونته‌ناپلئونه» در میلان، که برندهایی از جمله شنل، تیفانی و دیور در آن شعبه دارند، برای احتیاط کالاهای خود را از ویترین‌ها جمع‌آوری کردند. هم‌زمان، نیروهای پلیس در این خیابان گشت‌زنی می‌کردند و شمار اندکی از گردشگران نظاره‌گر اوضاع بودند. در جریان ناآرامی‌های آخر هفته، چند صد معترض نقاب‌دار که گمان می‌رود بسیاری از آن‌ها زیر سن قانونی بوده‌اند، سطل‌های زباله را به آتش کشیدند و فروشگاه‌های مرکز شهر را غارت کردند. این خشونت‌ها پس از تظاهراتی آغاز شد که روز شنبه در اعتراض به کیفیت پایین خدمات عمومی و افزایش هزینه‌های زندگی، ابتدا به‌شکلی مسالمت‌آمیز برگزار شده بود. تصاویر تلویزیونی نشان می‌دهد که فروشگاه‌های لوازم ورزشی دکاتلون و آرکتریکس و همچنین فروشگاه اپراتور تلفن همراه ودافون از جمله مراکزی بودند که غارت شدند. آنتونیو تایانی، وزیر خارجه و دیگر معاون نخست‌وزیر ایتالیا، در شبکه اجتماعی ایکس نوشت: «دولت به این حملات علیه حاکمیت قاطعانه پاسخ خواهد داد؛ از جمله با اتخاذ تدابیری برای مهار"}, {"source": "Radio Farda", "title": "تماس تلفنی رهبران آمریکا و اسرائیل؛ نتانیاهو خواستار «تکمیل کار ناتمام ایران» شد", "link": "https://www.radiofarda.com/a/trump-tells-netanyahu-he-ll-have-tremendous-election-win/33879678.html", "summary": "هشت روز پیش از انتخابات اسرائیل، دونالد ترامپ و بنیامین نتانیاهو از یکدیگر تمجید کردند. ترامپ دربارۀ پیروزی نتانیاهو ابراز امیدواری کرد و نتانیاهو هم خواهان ادامۀ جنگ با ایران شد.", "date_str": "2026-10-19T19:41:18+00:00", "hash": "4ff8da4dd4d747f8", "title_fa": "تماس تلفنی رهبران آمریکا و اسرائیل؛ نتانیاهو خواستار «تکمیل کار ناتمام ایران» شد", "summary_fa": "هشت روز پیش از انتخابات اسرائیل، دونالد ترامپ و بنیامین نتانیاهو از یکدیگر تمجید کردند. ترامپ دربارۀ پیروزی نتانیاهو ابراز امیدواری کرد و نتانیاهو هم خواهان ادامۀ جنگ با ایران شد. رئیس‌جمهور ایالات متحده روز دوشنبه ۲۷ مهرماه به نخست‌وزیر اسرائیل گفت انتظار دارد او در انتخابات پارلمانی هفتۀ آینده به یک پیروزی «فوق‌العاده» دست یابد. در جریان این گفت‌وگوی تلفنی، بنیامین نتانیاهو هم به احتمال حملۀ مجدد دو کشور به ایران اشاره کرد. این در حالی‌ است که جنگ ایران بر سیاست هر دو کشور، بخصوص انتخابات سراسری اسرائیل، که سه‌شنبۀ آینده برگزار می‌شود و انتخابات میان‌دوره‌ای کنگرۀ ایالات متحده، که برای دو هفتۀ دیگر برنامه‌ریزی شده، سایه انداخته است. دونالد ترامپ روز یکشنبه ۲۷ مهرماه، به‌شکلی علنی از بنیامین نتانیاهو در انتخابات پارلمانی هفتۀ آیندۀ اسرائیل حمایت کرده بود. یک روز بعد، نخست‌وزیر اسرائیل، ویدئویی از مکالمۀ تلفنی خود با ترامپ منتشر کرد، که در آن از یکدیگر تمجید می‌کنند. در این ویدئو، بنیامین نتانیاهو، گوشی تلفن همراه خود را روی بلندگو گذاشته و صدای دونالد ترامپ شنیده می‌شود که می‌گوید: «به‌ گمانم تو پیروزی فوق‌العاده‌ای خواهی داشت». رئیس‌جمهور آمریکا در ادامه می‌گوید: «بی‌بی، تو جنگجوی بزرگی هستی؛ مردی هستی که می‌خواهم در کنارم باشی». نخست‌وزیر اسرائیل هم در حالی‌که به دونالد ترامپ یادآوری می‌کند که صدایش پخش می‌شود، از او به‌خاطر پیوستن به اسرائیل در حمله به ایران تقدیر می‌کند. او سپس خطاب به رئیس‌جمهور آمریکا می‌گوید: «دونالد، ما هنوز کار نیمه‌تمامی داریم. آن را با هم تمام می‌کنیم، چون کار هیچ‌کس دیگر نیست». نتانیاهو بار دیگر حکومت جمهوری اسلامی، که نزدیک به هشت ماه پس از حملات مشترک آمریکا و اسرائیل، همچنان پابرجا است را «بزرگترین خطر» توصیف می‌کند و می‌گوید «هرگز اجازه نمی‌دهیم ایران به سلاح هسته‌ای دست یابد»."}, {"source": "Radio Farda", "title": "دادستانی آمریکا: مهندس بازداشت‌شدهٔ اوپن‌ای‌آی با خاندان سلطنتی سعودی ارتباط داشته است", "link": "https://www.radiofarda.com/a/us-prosecutors-say-arrested-openai-engineer-had-ties-to-saudi-royals/33879673.html", "summary": "دفتر دادستان ایالات متحده در سندی که روز یکشنبه ۲۶ مهرماه ثبت شد، گفته که الفوزان ارتباطات مکرری با یکی از اعضای ناشناس خانوادهٔ سلطنتی سعودی داشته است.", "date_str": "2026-10-19T19:16:41+00:00", "hash": "520ac4f1ca28f0f2", "title_fa": "دادستانی آمریکا: مهندس بازداشت‌شدهٔ اوپن‌ای‌آی با خاندان سلطنتی سعودی ارتباط داشته است", "summary_fa": "دفتر دادستان ایالات متحده در سندی که روز یکشنبه ۲۶ مهرماه ثبت شد، گفته که الفوزان ارتباطات مکرری با یکی از اعضای ناشناس خانوادهٔ سلطنتی سعودی داشته است. دادستان‌های آمریکایی می‌گویند یک مهندس سابق اوپن‌ای‌آی که متهم است دستگاه شنود غیرقانونی را در دفاتر این شرکت کار گذاشته، با خانوادهٔ سلطنتی عربستان سعودی ارتباط داشته است و باید در بازداشت بماند. عبدالرحمن الفوزان ۳۵ ساله، ۹ اکتبر [۱۷ مهر] به دنبال اتهاماتی مبنی بر کار گذاشتن یک میکروفون در یکی از اتاق‌های کنفرانس یکی از دفاتر اوپن‌ای‌آی در سان‌فرانسیسکو بازداشت شد. او به اتهام شنود مکالمات شفاهی با حداکثر پنج سال زندان روبه‌رو است. الفوزان که از سال ۲۰۲۵ در اوپن‌ای‌آی کار می‌کرده، قرار است روز دوشنبه در جلسهٔ رسیدگی به قرار بازداشت در یکی از دادگاه‌های سان‌فرانسیسکو حاضر شود. اگرچه شکایت علیه الفوزان به فعالیت‌های جاسوسی اشاره‌ای ندارد، جی کلیتون، مدیر اطلاعات ملی ایالات متحده، هفتهٔ گذشته در بیانیه‌ای به‌طور ضمنی اشاره کرد که این پرونده پیامدهای امنیت ملی دارد. در سند جدید دادگاه آمده است: «تحقیقات دولت ادامه دارد و ممکن است به اتهامات جدی دیگری منجر شود». در این سند همچنین آمده که این موضوع «برای امنیت ملی ایالات متحده نگران‌کننده است». در این سند آمده است: «چه متهم می‌خواسته جلسات اوپن‌ای‌آی را ضبط کند تا با بهبود چشم‌انداز کسب‌وکار خودش ثروت بیندوزد، چه برای کمک به یک دولت خارجی، و چه هر دو، رفتار او مجرمانه است». به گزارش خبرگزاری فرانسه، عضو ناشناس خانوادهٔ سلطنتی عربستان سعودی چندین بار تلاش کرده بود این مهندس را برای یک طرح هوش مصنوعی در عربستان سعودی جذب کند. بر اساس این سند، این فرد در یکی از گفت‌وگوهایشان در واتساپ نوشته بود: «عربستان سعودی بیشتر از آمریکا به تو نیاز دارد». به گفتهٔ سند، الفوزان در پاسخ نوشته بود «۱۰۰»، که روشی رایج برای ابراز موافقت است."}, {"source": "Radio Farda", "title": "پیش‌ به‌ سوی قمر «فوبوس»؛ فضاپیمای ژاپنی به‌دنبال راز شکل‌گیری مریخ و منظومۀ شمسی", "link": "https://www.radiofarda.com/a/japan-to-launch-world-first-mission-to-moon-of-mars/33879644.html", "summary": "فضاپیمای ژاپنی برای فرود روی قمر «فوبوس» م       tech: [{"source": "MIT AI", "title": "Why teaching AI about symmetry could make prenatal diagnosis more reliable", "link": "https://news.mit.edu/2026/teaching-ai-about-symmetry-could-make-prenatal-diagnosis-more-reliable-1019", "summary": "Despite millions of years of evolution, the development of the human fetus remains a complex process that is vulnerable to genetic, environmental, and metabolic disruptions. These disruptions could result in developmental abnormalities, starting with one of the first organs to begin developing in the fetus that continues to develop after birth: the brain. In a routine prenatal ultrasound, the sonographer will flag possible brain abnormalities for additional magnetic resonance imaging (MRI). But imperfect imaging can result in missed or incorrect diagnoses. To assist with the early detection and treatment of these abnormalities, researchers at MIT, Boston Children’s Hospital, and Inria have developed and trained a deep learning model called E(3)-Pose that helps image the fetus’s head while it’s in motion to capture a high-resolution image that the radiologist can examine. A paper about the work was presented at the 2026 European Conference on Computer Vision . “One of the problems with having the baby move is that the slices are all over the place,” says first author Ramya Muthukrishnan. Muthukrishnan is an MIT PhD student in the lab of Sunlin (1966) and Priscilla Chou Professor of Electrical Engineering and Computer Science Polina Golland, who is a principal investigator at the MIT Abdul Latif Jameel Clinic for Machine Learning in Health (Jameel Clinic) and the MIT Computer Science and Artificial Intelligence Laboratory (CSAIL). By slices, Muthukrishnan is referring to a series of 2D images taken during a fetal MRI scan. These 2D planes stacked together effectively make up one high-resolution, 3D image of the fetus’s head. But if the head shifts during imaging, each 2D image “slice” could end up being taken from a different angle, resulting in gaps in the final scan and unusual slice orientation. These problems may cause the physician reviewing the MRI to miss or incorrectly diagnose a pathology in the fetal brain. “There are very fine details that you need a very good volumetric picture of the brain to see,” explains Muthukrishnan. “If you have coverage gaps, you can’t see critical regions, and you need to be able to see well to detect abnormal development.” What makes E(3)-Pose particularly good at tracking fetal motion is its focus on physics. Rather than simply training the model to learn physics from the data, the very principles of physics are baked into the neural network: left-right symmetry of the fetal head is embedded in the model architecture, ", "date_str": "2026-10-19T18:20:00+00:00", "hash": "fd23300522ce5c27", "title_fa": "چرا آموزش هوش مصنوعی در مورد تقارن می تواند تشخیص قبل از تولد را قابل اعتمادتر کند", "summary_fa": "علیرغم میلیون ها سال تکامل، رشد جنین انسان همچنان یک فرآیند پیچیده است که در برابر اختلالات ژنتیکی، محیطی و متابولیکی آسیب پذیر است. این اختلالات می تواند منجر به ناهنجاری های رشدی شود که با یکی از اولین اندام هایی که در جنین شروع به رشد کرد و بعد از تولد نیز به رشد خود ادامه می دهد: مغز شروع می شود. در یک سونوگرافی معمول قبل از تولد، سونوگرافیک ناهنجاری های احتمالی مغز را برای تصویربرداری رزونانس مغناطیسی اضافی (MRI) علامت گذاری می کند. اما تصویربرداری ناقص می تواند منجر به تشخیص اشتباه یا نادرست شود. برای کمک به تشخیص و درمان زودهنگام این ناهنجاری‌ها، محققان MIT، بیمارستان کودکان بوستون، و اینریا یک مدل یادگیری عمیق به نام E(3)-Pose ایجاد و آموزش داده‌اند که به تصویربرداری از سر جنین در حالی که در حرکت است کمک می‌کند تا تصویری با وضوح بالا که رادیولوژیست می‌تواند بررسی کند، به تصویر بکشد. مقاله ای در مورد این کار در کنفرانس اروپایی چشم انداز کامپیوتری 2026 ارائه شد. رامیا موتوکریشنان، نویسنده اول، می‌گوید: «یکی از مشکلات حرکت کودک این است که برش‌ها در همه جا قرار دارند. موتوکریشنان دانشجوی دکترای MIT در آزمایشگاه Sunlin (1966) و پریسیلا چو استاد مهندسی برق و علوم کامپیوتر پولینا گولند است که محقق اصلی در کلینیک ام آی تی عبداللطیف جمیل برای یادگیری ماشینی در سلامت (Jameel Clinic) و Artific Computer Science (Computer Science) MIT است. Muthukrishnan با برش به مجموعه ای از تصاویر دو بعدی اشاره دارد که در طول اسکن MRI جنین گرفته شده است. این هواپیماهای دوبعدی که روی هم چیده شده اند، به طور موثری یک تصویر سه بعدی با وضوح بالا از سر جنین را می سازند. اما اگر سر در طول تصویربرداری جابه‌جا شود، هر «برش» تصویر دوبعدی می‌تواند از زاویه‌ای متفاوت گرفته شود و در نتیجه شکاف‌هایی در"}, {"source": "TechCrunch AI", "title": "Figma co-founder Dylan Field thinks MCP is not a perfect protocol", "link": "https://techcrunch.com/2026/10/20/figma-co-founder-dylan-field-thinks-mcp-is-not-a-perfect-protocol/", "summary": "Figma said it plans to support as many standards as possible without exposing all of its data", "date_str": "2026-10-20T14:13:32+00:00", "hash": "cc4ca37d70ed90e8", "title_fa": "دیلن فیلد، یکی از بنیانگذاران Figma معتقد است که MCP یک پروتکل کامل نیست", "summary_fa": "Figma گفت که قصد دارد تا حد امکان استانداردها را بدون افشای همه داده‌هایش پشتیبانی کند علی‌رغم نگرانی‌های دیلن فیلد، یکی از بنیان‌گذاران Figma در مورد MCP (پروتکل بافت مدل)، که نحوه اتصال عوامل هوش مصنوعی به منابع و ابزارهای داده خارجی را استاندارد می‌کند، این شرکت در حال گسترش پشتیبانی خود از استاندارد منبع باز است. در اولین کنفرانس Config شرکت طراحی که در هند برگزار شد، این شرکت 20 شریک جدید متن پروتکل مدل (MCP) از جمله Amp، ClickUp، Dia، Junie by JetBrains، Linear، Meta Muse، Mistral، Notion، OpenCode و Servam را معرفی کرد. فیلد قبلاً تردیدهای خود را در مورد MCP ابراز کرده است. چند روز قبل از این اعلامیه، یکی از همسازان MCP از عدم پشتیبانی Figma از ابزار منبع باز Pi شکایت کرد. فیلد به عنوان بخشی از پاسخ خود، نظری در مورد عدم دسترسی آنتروپیک به منابع مختلف خود از طریق MCP داد. به نظر من جالب است که Anthropic (سازندگان استاندارد MCP) مصنوعات / سایر منابع ابری ایجاد شده از طریق MCP را در معرض نمایش نمی‌گذارند، او در X نوشت. بحث به صورت باز در مقابل بسته تنظیم می‌شود. همه همیشه باز را ترجیح می دهند ... واضح است. و در عین حال مسائل مربوط به اشتراک متن نامتقارن نادیده گرفته می شود. (فیلد بعداً اضافه کرد که طرح‌های Figma از Pi پشتیبانی می‌کنند. ) در یک نشست خبری از فیلد در مورد این مناظره پرسیدم. یکی از بنیانگذاران توضیح داد که در حالی که Figma می خواهد باز باشد، او فکر نمی کند MCP یک پروتکل کامل باشد. من واقعاً در مورد کاری که در زمینه باز کردن اکوسیستم خود انجام می دهیم هیجان زده هستم. من همچنین فکر می کنم که MCP یک پروتکل کامل نیست. و من فکر می کنم که این چیزی است که فضای زیادی برای بهبود"}, {"source": "TechCrunch AI", "title": "US orders federal agencies to remove China’s DeepSeek AI from their systems", "link": "https://techcrunch.com/2026/10/20/us-orders-federal-agencies-to-remove-chinas-deepseek-ai-from-their-systems/", "summary": "The US has ordered federal civilian agencies to remove DeepSeek products and third-party services built using its technology, citing national security concerns.", "date_str": "2026-10-20T13:07:24+00:00", "hash": "ad3e2fc6f2d0b8b5", "title_fa": "ایالات متحده به آژانس های فدرال دستور می دهد تا هوش مصنوعی DeepSeek چین را از سیستم های خود حذف کنند", "summary_fa": "ایالات متحده به آژانس‌های غیرنظامی فدرال دستور داده است تا محصولات DeepSeek و خدمات شخص ثالث ساخته شده با استفاده از فناوری آن را حذف کنند و دلیل آن نگرانی‌های امنیت ملی است. به گفته وزارت امنیت داخلی، ایالات متحده به آژانس‌های غیرنظامی فدرال دستور داده است که خرید خدمات و محصولات توسعه‌یافته توسط استارت‌آپ هوش مصنوعی چینی DeepSeek را متوقف کرده و آن‌ها را از سیستم‌های فناوری اطلاعات دولتی به دلیل نگرانی‌های امنیت ملی مرتبط با عملیات استارت‌آپ هوش مصنوعی چینی در چین حذف کنند. این دستور فراتر از ممنوعیت محصول خود DeepSeek است، اما محصولات و خدمات شخص ثالث ساخته شده با استفاده از فناوری DeepSeek را نیز پوشش می‌دهد، اگرچه آژانس‌ها می‌توانند درخواست استثنا کنند. در این دستور آمده است که DHS نگرانی‌هایی را در مورد مدیریت DeepSeek با داده‌های کاربران ایجاد کرده و هشدار داده است که اطلاعات حساس کاربران دولت ایالات متحده به طور بالقوه می‌ت s://techcrunch.com/2026/10/19/embedded-ai-evaluators-wont-be-an-easy-solution-hugging-faces-policy-chief-says/", "summary": "The idea of embedded evaluators — in which supposedly \"neutral\" third-party observers are placed inside AI organizations — has been popularized over the last several months, as AI labs grapple with a rash of safety incidents that have spurred concerns over the potential harms of their technology.", "date_str": "2026-10-19T22:49:27+00:00", "hash": "b66008ee16675dc6", "title_fa": "مدیر سیاست Hugging Face می گوید ارزیاب های هوش مصنوعی جاسازی شده راه حل آسانی نخواهد بود.", "summary_fa": "ایده ارزیاب‌های تعبیه‌شده – که در آن ناظران شخص ثالث ظاهراً «خنثی» در سازمان‌های هوش مصنوعی قرار می‌گیرند – در چند ماه گذشته رایج شده است، زیرا آزمایشگاه‌های هوش مصنوعی با انبوهی از حوادث ایمنی دست و پنجه نرم می‌کنند که نگرانی‌ها را در مورد آسیب‌های احتمالی فناوری آنها برانگیخته است. آزمایشگاه‌های هوش مصنوعی شهرت خود را در مقایسه با مدل‌ها به خطر انداخته‌اند - سیستم ظاهراً خنثی و دقیق ارزیابی‌هایی که برای سنجش بهتر بودن یک محصول هوش مصنوعی از دیگری طراحی شده‌اند. ایرنه سلیمان، افسر ارشد خط‌مشی Hugging Face، هفته گذشته طی بحثی در TechCrunch Disrupt گفت، با این حال، روش‌های پشت این ارزیابی‌ها پیچیده هستند و هنوز در حال بلوغ هستند. اگر صنعت بخواهد در آینده به آن‌ها تکیه کند، آزمایش‌ها باید در یک علم سازگارتر گرد هم آیند. با در نظر گرفتن این موضوع، آیا می توانیم به آزمایش های فعلی که در حال انتشار هستند اعتماد کنیم؟ سلیمان گفت که اعتماد یک اصطلاح سنگین است. از نظر اینکه آیا می توانیم به نتایج اعتماد کنیم، یک بخش بزرگ [از آن] این است که آیا می توانید نتایج یک ارزیابی را بازتولید کنید؟ آیا سطح دسترسی مورد نیاز خود را به خود مدل دارید - او اضافه کرد که در اینجا وزنه‌های باز به طرز چشمگیری وارد می‌شوند. تکرارپذیری در ارزیابی مدل‌ها مدت‌هاست که یکی از جنبه‌های چسبنده‌تر معیارسنجی باقی مانده است - و همچنان موضوع بحث مهمی در صنعت است. خارج از اعتبار یک آزمون فردی، این سؤال نیز وجود دارد که چگونه آن آزمون با سایر ارزیابی ها مقایسه می شود. سلیمان گفت، آنها یک علم در حال تکامل هستند - جایی که ما نمی دانیم چگونه آنها را به طور معناداری با یکدیگر مقایسه کنیم. او افزود که آنها نسبتاً سریع شروع به بی اثر شدن می کنند و ما آنقدر که نیاز"}, {"source": "TechCrunch AI", "title": "Microsoft says AI agents are like insider threats as ‘frontier models can’t be trusted’", "link": "https://techcrunch.com/2026/10/19/microsoft-says-ai-agents-are-like-insider-threats-as-frontier-models-cant-be-trusted/", "summary": "Microsoft wants enterprises to closely watch the agents that employees use with systems not controlled by AI labs like OpenAI and Anthropic.", "date_str": "2026-10-19T22:04:28+00:00", "hash": "af60561dda5e4fe8", "title_fa": "مایکروسافت می گوید عوامل هوش مصنوعی مانند تهدیدهای داخلی هستند زیرا «مدل های مرزی قابل اعتماد نیستند»", "summary_fa": "مایکروسافت از شرکت‌ها می‌خواهد عواملی را که کارمندان با سیستم‌هایی که توسط آزمایشگاه‌های هوش مصنوعی مانند OpenAI و Anthropic کنترل نمی‌شوند، از نزدیک تماشا کنند. مایکروسافت روز دوشنبه ویژگی‌های امنیتی جدیدی را معرفی کرد که برای محافظت از شرکت‌ها در برابر تهدید فزاینده عوامل هوش مصنوعی طراحی شده‌اند. این راه اندازی در حالی انجام می شود که مایکروسافت همچنان به شرکت ها در مورد خطرات هوش مصنوعی و عوامل هشدار می دهد. شاید قابل‌توجه‌ترین افزونه Guardian Agents باشد، ویژگی جدیدی که برای نظارت بر عوامل هوش مصنوعی یک شرکت در نظر گرفته شده است. Guardian Agents بخشی از Project Perception است، محصولی که در ژوئن معرفی شد. Project Perception پاسخ مایکروسافت به مدل های قدرتمند هک مانند Anthropic s Mythos و Fable و سیستم اسکن آسیب پذیری امنیتی OpenAI Daybreak بود. Project Perception ابتدا سه دسته از عوامل را راه‌اندازی کرد: یک تیم قرمز که مانند هکرها عمل می‌کردند و حمله می‌کردند، یک تیم آبی که تیم قرمز را شناسایی می‌کرد و آسیب‌پذیری‌هایی را که پیدا می‌کردند ارزیابی می‌کرد، و یک تیم سبز که وظیفه رفع آنها را داشت. این محصول با این فرض طراحی شده بود که هکرهای هوش مصنوعی از خارج از شرکت می آیند. اما اخیراً، ساتیا نادلا، مدیرعامل مایکروسافت هشدار داده است که دشمن هوش مصنوعی ممکن است همان عواملی باشد که شرکت‌ها مستقر کرده‌اند وی می‌آورند تا bloatware را از بین ببرند و کنترل تلویزیون‌های خود را پس بگیرند. آخرین مورد استفاده برای هوش مصنوعی؟ برای خلاص شدن از شر نفخ، تلویزیون هوشمند خود را فریب دهید. تعدادی از توسعه‌دهندگان و برنامه‌نویس‌های vibe اخیراً راه‌حل‌هایی را برای کدنویسی تلویزیون شما به اشتراک گذاشته‌اند تا از شر تبلیغات حمایت‌شده خلاص شوند، سرعت راه‌انداز برنامه، طراحی مجدد صفحه اصلی، غیرفعال کردن ویژگی‌های ردیابی و موارد دیگر انجام شود. یکی از این راه حل ها، به نام dumbtv، ماموریت خود را در صفحه GitHub خود چنین توضیح می دهد: تلویزیون شما باید کاری را انجام دهد که برای آن هزینه کرده اید: برنامه های شما، ورودی های HDMI و هیچ چیز دیگری. بدون تبلیغات از خود تلویزیون، بدون ردیابی ساعت، بدون به روز رسانی که شما درخواست نکرده اید. دیگری، cleanyourtv، قول می‌دهد که bloatware را از هر تلویزیون Android یا Google TV از طریق Wi-Fi حذف کند، تا لانچر را با لانچری که شبیه Apple TV است جایگزین کند. در حالی که هک کردن دستگاه‌های الکترونیکی مصرفی برای به دست آوردن کنترل بیشتر بر سیستم‌های آن‌ها به سختی یک ایده جدید است، آخرین پیشرفت‌ها در فناوری هوش مصنوعی این تلاش‌ها را برای هر کسی بسیار قابل دسترس‌تر کرده است. مخصوصاً در مورد تلویزیون‌های هوشمند، هک‌ها در زمانی اتفاق می‌افتند که مردم از مجبور شدن به تماشای تبلیغات ناامید شده‌اند و دستگاه‌های خود را برای نظارت بر عادت‌های تماشای خود تحمل می‌کنند. تلویزیون‌های هوشمند مدرن با فناوری به نام تشخیص خودکار محتوا (ACR) عرضه می‌شوند که با استفاده از اسکرین‌شات، کلیپ‌های صوتی یا سایر اشکال انگشت نگاری دیجیتال، آنچه را که روی صفحه نمایش پخش می‌شود، شناسایی می‌کند. اگر این هک‌های گنگ تلویزیون در بین مصرف‌کنندگان روزمره محبوب‌تر شوند،"}, {"source": "TechCrunch AI", "title": "Nvidia launches new open models to run agents in the enterprise and on PCs", "link": "https://techcrunch.com/2026/10/19/nvidia-launches-new-open-models-to-run-agents-in-the-enterprise-and-on-pcs/", "summary": "Nvidia is leaning hard into the trend of enterprise companies wanting to run their own open models in their own data centers and also trying to make on-device, private AI agents a thing.", "date_str": "2026-10-19T15:37:09+00:00", "hash": "dcc9042d9598f31c", "title_fa": "انویدیا مدل‌های باز جدیدی را برای اجرای نمایندگی‌ها در شرکت و رایانه‌های شخصی راه‌اندازی می‌کند", "summary_fa": "انویدیا به شدت به روند شرکت‌های سازمانی متمایل شده است که می‌خواهند مدل‌های باز خود را در مراکز داده خود اجرا کنند و همچنین تلاش می‌کنند تا عوامل هوش مصنوعی خصوصی روی دستگاه را به یک چیز تبدیل کنند. انویدیا روز پنجشنبه مدل‌های وزن باز جدیدی را عرضه کرد که برای عوامل همیشه فعال و محاسبات لبه طراحی شده‌اند. Nemotron 3.5 Super VL یک مدل بزرگ با 120 میلیارد پارامتر است که برای عواملی که توسط شرکت مورد استفاده قرار می گیرند، طراحی شده است. در حالی که از پارامترهای کمتری نسبت به مدل Nemotron 3 Ultra استفاده می‌کند، انویدیا می‌گوید که می‌تواند دقت مشابهی را در وظایف دنبال کردن دستورالعمل و استفاده از ابزار ارائه دهد. در انتهای دیگر طیف، این شرکت همچنین دو مدل بولت سبک وزن را روانه بازار کرد. اینها برای اجرا به صورت محلی روی رایانه‌های شخصی هوش مصنوعی جدید (که دارای تراشه Nvidia RTX Spark هستند) و ایستگاه‌های کاری با DGX Spark اجرا می‌شوند. چنین رایانه‌های شخصی، با هدف مصرف‌کنندگان، برنامه‌نویسان و کارکنان دانش سازمانی، در حال حاضر از طریق شرکای مانند مایکروسافت و دل به بازار عرضه می‌شوند. کری بریسکی، معاون مدل‌های باز و نرم‌افزار انویدیا، در پست وبلاگی که این مدل‌ها را معرفی می‌کند، نوشت: «هر سازمانی که بخواهد نمایندگی‌ها را در زیرساخت‌های انویدیا اجرا کند، اکنون یک مدل باز و بهینه‌شده برای سطح خود بدون نیاز به انتخاب بین قابلیت و قابلیت استقرار دارد». انویدیا ادعا می‌کند که Super VL وظایف خود را سریع‌تر از مدل‌های رقیب Anthropic و OpenAI (Opus 5، GPT 6.1 Sol، Luna، Astra) انجام می‌دهد که پس از آموزش در وظایف نمایندگی خاص. این وظایف شامل اطلاعات اسنادی، حسابداری مالی، آزمایش های علمی، ادعاهای بیمه پزشکی و مقاومت در برابر حملات امنیتی است. در حالی که هر زمان که یک شرکت فناوری بزرگ مدل جدیدی را معرفی"}, {"source": "NYT Tech", "title": "Saudis Aided Family of Engineer Accused of Bugging OpenAI, Prosecutors Say", "link": "https://www.nytimes.com/2026/10/19/technology/saudis-aided-family-openai-engineer.html", "summary": "Saudi officials paid for his wife and son to fly out of the U.S. and offered to cover his bail, according to court filings. A judge ordered the engineer to remain in custody.", "date_str": "2026-10-20T02:27:47+00:00", "hash": "67e4f6ad8251dee2", "title_fa": "دادستان ها می گویند که سعودی ها به خانواده مهندس متهم به جعل OpenAI کمک کردند", "summary_fa": "بر اساس پرونده های دادگاه، مقامات سعودی هزینه خروج همسر و پسرش از آمریکا را پرداخت کردند و پیشنهاد کردند وثیقه او را پوشش دهند. قاضی دستور داد مهندس همچنان در بازداشت بماند."}, {"source": "NYT Tech", "title": "Elon Musk Says He Will Give a SpaceX Share to ‘Every Kid in America’", "link": "https://www.nytimes.com/2026/10/19/technology/elon-musk-spacex-stock-anthropic-giveaway.html", "summary": "Anthropic, an A.I. rival to SpaceX, earlier said it would form a “public benefit fund” and other tech moguls have contributed to savings accounts for children.", "date_str": "2026-10-19T22:12:02+00:00", "hash": "4d48ca3e0e39de7e", "title_fa": "ایلان ماسک می‌گوید به «هر بچه آمریکایی» سهمی از اسپیس ایکس می‌دهد", "summary_fa": "آنتروپیک، یک A.I. رقیب اسپیس ایکس، پیشتر گفته بود که یک \"صندوق عام المنفعه\" تشکیل می دهد و دیگر غول های فناوری در حساب های پس انداز کودکان مشارکت کرده اند."}, {"source": "NYT Tech", "title": "Google Reports Cloud Disruptions in Europe", "link": "https://www.nytimes.com/2026/10/20/technology/google-cloud-down-outage-europe.html", "summary": "The disruptions began around 7 a.m. in London after what the tech giant called a “power event.”", "date_str": "2026-10-20T13:04:12+00:00", "hash": "0e8f1020e752501a", "title_fa": "گوگل از اختلالات ابری در اروپا خبر می دهد", "summary_fa": "این اختلالات حدود ساعت 7 صبح در لندن پس از آنچه غول فناوری آن را \"رویداد قدرت\" نامید آغاز شد."}, {"source": "The Guardian AI", "title": "Labor and the Coalition are poised to take a reckless gamble on AI. Haven’t they realised community support has collapsed? | Edward Santow and Sarah Sacher", "link": "https://www.theguardian.com/technology/commentisfree/2026/oct/21/labor-coalition-poised-to-take-reckless-gamble-on-ai-joint-select-committee", "summary": "Australian workers expect the government to act to protect them from AI harms. There is a clear reform solution at hand Get our new political email , free app or daily news podcast Australia’s major political parties are edging towards rare consensus. Labor and the Coalition increasingly want to take a major bet on artificial intelligence. Yet, just as the parties are coming together, the Australian community is running the other way. Last year, only 30% of Australians believed the benefits of AI outweighed the risks. In 2026, community trust in AI appears to be falling even further. Continue reading...", "date_str": "2026-10-20T14:00:38+00:00", "hash": "7229fdb42e5b84e7", "title_fa": "حزب کارگر و ائتلاف آماده یک قمار بی پروا بر روی هوش مصنوعی هستند. آیا آنها متوجه نشده اند که حمایت جامعه از بین رفته است؟ | ادوارد سنتو و سارا ساچر", "summary_fa": "کارگران استرالیایی از دولت انتظار دارند که برای محافظت از آنها در برابر آسیب های هوش مصنوعی اقدام کند. راه حل اصلاحی روشنی در دست است. ایمیل سیاسی جدید، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید. حزب کارگر و ائتلاف به طور فزاینده ای می خواهند روی هوش مصنوعی شرط بندی کنند. با این حال، درست زمانی که احزاب دور هم جمع می‌شوند، جامعه استرالیا به سمت دیگری حرکت می‌کند. سال گذشته، تنها 30 درصد استرالیایی ها معتقد بودند که مزایای هوش مصنوعی بر خطرات آن بیشتر است. در سال 2026، به نظر می رسد که اعتماد جامعه به هوش مصنوعی حتی بیشتر از این کاهش پیدا کند. به خواندن ادامه دهید... احزاب سیاسی عمده استرالیا به سوی اجماع نادری پیش می روند. حزب کارگر و ائتلاف به طور فزاینده ای می خواهند روی هوش مصنوعی شرط بندی کنند. با این حال، درست زمانی که احزاب دور هم جمع می‌شوند، جامعه استرالیا به سمت دیگری حرکت می‌کند. تشکیل یک کمیته منتخب مشترک در زمینه هوش مصنوعی برای مجلس ما اقدامی غیرعادی بود. این نشان داد که تصمیماتی که اکنون در مورد مراکز داده و نحوه اتخاذ هوش مصنوعی اتخاذ می‌شود، می‌تواند اقتصاد، محیط و جامعه ما را برای نسل‌ها تعریف کند. از آنجایی که دور تازه ای از جلسات استماع این هفته آغاز می شود، اعضای کمیته باید با شکاف بین سیاست هوش مصنوعی و واقعیت تلخ روی زمین مقابله کنند. برخی از بخش‌های بخش کسب‌وکار از ما می‌خواهند که نوآوری و پذیرش هوش مصنوعی را در اولویت قرار دهیم، که اغلب راه دیگری برای گفتن است: «کار فروش مثبت هوش مصنوعی را بهتر انجام دهید». چه خوشبین باشید چه بدبین، این یک ایده وحشتناک است. سام آلتمن، داریو آمودی و دیگر غول‌های سیلیکون ولی یک مگافون طلایی دارند تا از مزایای فناوری خود بهره ببرند. استرالیایی‌ها"}, {"source": "The Guardian AI", "title": "US bans use of China’s DeepSeek AI tools by government agencies", "link": "https://www.theguardian.com/us-news/2026/oct/20/us-bans-china-deepseek-ai-tools-government-agencies", "summary": "Use of tools ‘may result in the transfer of sensitive data’ to China, defense department says The US government on Monday ordered its agencies to stop using artificial intelligence (AI) tools from the Chinese startup DeepSeek , as the countries race for dominance in the fast-moving sector. A notice from the Department of Homeland Security (DHS) announced the ban on products developed by DeepSeek – and tools created using DeepSeek by third parties – saying they must be removed from IT devices. Continue reading...", "date_str": "2026-10-20T12:33:27+00:00", "hash": "3f1153706c893e72", "title_fa": "ایالات متحده استفاده از ابزارهای هوش مصنوعی DeepSeek چین را توسط سازمان های دولتی ممنوع کرد", "summary_fa": "وزارت دفاع می‌گوید استفاده از ابزارها «ممکن است منجر به انتقال داده‌های حساس به چین شود»، دولت ایالات متحده روز دوشنبه به آژانس‌های خود دستور داد تا استفاده از ابزارهای هوش مصنوعی (AI) استارت‌آپ چینی DeepSeek را متوقف کنند، زیرا کشورها برای تسلط در بخش سریع در حال حرکت رقابت می‌کنند. در اطلاعیه ای از وزارت امنیت داخلی (DHS) ممنوعیت محصولات توسعه یافته توسط DeepSeek - و ابزارهای ایجاد شده با استفاده از DeepSeek توسط اشخاص ثالث - اعلام شد که آنها باید از دستگاه های IT حذف شوند. به خواندن ادامه دهید... DHS می تواند به سازمان های غیرنظامی دستور بدهد، اما نه ارتش یا سرویس های اطلاعاتی. وزارت دفاع آمریکا به درخواست خبرگزاری فرانسه برای اظهار نظر پاسخ نداد. در سند ضمیمه شده به اطلاعیه روز دوشنبه آمده است: «مدل های DeepSeek چندین بردار تهدید را ارائه می دهند. این وزارتخانه هشدار داد که استفاده از ابزارهای DeepSeek AI \"ممکن است در صورت استفاده توسط کارمندان یا فروشندگان دولت ایالات متحده منجر به انتقال داده های حساس به [چین] شود.\" سرورهای آن در چین واقع شده‌اند، جایی که سیستم قانونی به دولت اجازه می‌دهد تا به زیرساخت‌های شرکت خصوصی دسترسی داشته باشد. یکی از برترین آزمایشگاه‌های هوش مصنوعی چین، DeepSeek، صنعت را در ژانویه 2025 با یک چت بات کم‌هزینه و با کارایی بالا تکان داد و فرضیات تسلط ایالات متحده را به چالش کشید. این شرکت یک مدل جدید V4 را که مدت ها انتظارش را می کشید، در آوریل عرضه کرد و اوایل اکتبر یک نسخه سریعتر و سبک تر V4 را به روز کرد. ایالات متحده DeepSeek و دیگر شرکت‌های برتر هوش مصنوعی چینی را به سرقت سیستماتیک قابلیت‌های مدل‌های پیشرفته که توسط رقبای آمریکایی ساخته شده‌اند، متهم کرده است. علیرغم رقابت شدید آنها در این زمینه، زمانی که رهبران آنها شی جین پینگ و"}, {"source": "The Guardian AI", "title": "I’m a CTO. AI still needs your human expertise | Madhu Shashanka", "link": "https://www.theguardian.com/technology/2026/oct/20/ai-human-judgment", "summary": "AI is increasingly getting good at doing some tasks, but it can never replace human workers’ judgment Autonomous cars, which may be the safest we have built, keep getting easily avoidable parking tickets. While Waymos crash far less often than human drivers over tens of millions of miles, they’re still terrible at performing basic tasks – keeping out of disabled parking spots and tow-away zones, or steering clear of a church garage during Sunday service, according to the Wall Street Journal . That is the state of AI today: impressively capable at something complex, yet embarrassingly clumsy at something easy. And it has implications for what work will remain human and what will be automated by AI. Madhu Shashanka is co-founder, chief scientist and chief technology officer at Concentric AI, a data security software company Continue reading...", "date_str": "2026-10-20T12:30:35+00:00", "hash": "9715ad9e9a74d857", "title_fa": "من یک CTO هستم. هوش مصنوعی همچنان به تخصص انسانی شما نیاز دارد | مادو شاشانکا", "summary_fa": "هوش مصنوعی به طور فزاینده‌ای در انجام برخی کارها خوب می‌شود، اما هرگز نمی‌تواند جایگزین قضاوت کارگران انسانی شود. به گزارش وال استریت ژورنال، در حالی که Waymos بسیار کمتر از رانندگان انسانی بیش از ده‌ها میلیون مایل تصادف می‌کند، اما آنها هنوز در انجام وظایف اساسی وحشتناک هستند - دور ماندن از پارکینگ‌های معلولان و مناطق یدک‌کش، یا دور شدن از گاراژ کلیسا در طول خدمات یکشنبه. این وضعیت امروزی هوش مصنوعی است: به طرز چشمگیری در چیزهای پیچیده توانایی دارد، در عین حال به طرز شرم آور در چیزهای آسان دست و پا چلفتی است. و این پیامدهایی برای اینکه چه کاری در انسان باقی خواهد ماند و چه چیزی توسط هوش مصنوعی خودکار می شود، دارد. مادو شاشانکا یکی از بنیانگذاران، دانشمند ارشد و افسر ارشد فناوری در هوش مصنوعی Concentric، یک شرکت نرم‌افزار امنیت داده است. به خواندن ادامه دهید... خودروهای خودران، که ممکن است ایمن‌ترین خودروهایی باشند که ما ساخته‌ایم، همچنان بلیط‌های پارکینگ به راحتی قابل اجتناب دریافت می‌کنند. به گزارش وال استریت ژورنال، در حالی که Waymos بسیار کمتر از رانندگان انسانی بیش از ده‌ها میلیون مایل تصادف می‌کند، اما آنها هنوز در انجام وظایف اساسی وحشتناک هستند - دور ماندن از پارکینگ‌های معلولان و مناطق یدک‌کش، یا دور شدن از گاراژ کلیسا در طول خدمات یکشنبه. مردم انتظار دارند که هوش مصنوعی در 34 کشور از 37 کشور مورد بررسی توسط مرکز تحقیقاتی Pew به مشاغل کمتری منجر شود. در کشورهای ثروتمندی مانند ایالات متحده، استرالیا و کره جنوبی، از هر 10 نفر، هفت نفر انتظار از دست دادن شغل در 20 سال آینده را دارند. و در سراسر کشورها، نگرانی در میان جوانان در حال افزایش است. در حالی که ترس ها بر تعداد مشاغل تمرکز می کنند، تغییر بزرگتر این است که مشاغل چه می شوند."}, {"source": "The Guardian AI", "title": "‘These risks are real’: the threat of AI bioweapons - video", "link": "https://www.theguardian.com/science/video/2026/oct/20/these-risks-are-real-the-threat-of-ai-bioweapons-video", "summary": "In his annual speech on threats to the nation, Sir Ken McCallum, the head of the UK’s intelligence service, MI5 , warned that AI had the potential to ‘change the stakes’ on existing and even new bioweapons. To find out why, and how, Ian Sample speaks to Dr Tom Inglesby, director of the Johns Hopkins Center for Health Security and the Bloomberg School of Public Health. He explains what has governments so worried and what measures could be put in place to reduce the risks Continue reading...", "date_str": "2026-10-20T12:14:42+00:00", "hash": "4094f549980f6536", "title_fa": "\"این خطرات واقعی هستند\": تهدید سلاح های زیستی هوش مصنوعی - ویدئو", "summary_fa": "سر کن مک کالوم، رئیس سرویس اطلاعاتی بریتانیا، MI5، در سخنرانی سالانه خود درباره تهدیدات علیه ملت، هشدار داد که هوش مصنوعی پتانسیل «تغییر ریسک» در مورد سلاح‌های زیستی موجود و حتی جدید را دارد. برای اینکه بفهمید چرا و چگونه، ایان سمپل با دکتر تام اینگلزبی، مدیر مرکز امنیت سلامت جان هاپکینز و دانشکده بهداشت عمومی بلومبرگ صحبت می کند. او توضیح می‌دهد که دولت‌ها چه چیزی را تا این حد نگران کرده‌اند و چه تدابیری می‌تواند برای کاهش خطرات اتخاذ شود ادامه مطلب..."}, {"source": "The Guardian AI", "title": "Hollywood AI-listers: is the technology ready to rival flesh-and-blood film stars?", "link": "https://www.theguardian.com/film/2026/oct/20/ai-actors-val-kilmer-as-deep-as-the-grave-tilly-norwood", "summary": "As a freaky Val Kilmer doppelganger stars in a new western and faux starlet Tilly Norwood is set for her feature debut, experts are split on whether mainstream adoption is a long way down the line – or just around the corner ‘Don’t fear the dead – and don’t fear me.” An exact facsimile of a young Val Kilmer, not quite dead and not quite alive, utters that baiting line in the trailer for the new western As Deep as the Grave. Director Coerte Voorhees knows exactly what he is doing – th mmary_fa": "عضویت‌های پولی جدید Spotify به پادکست‌ها این امکان را می‌دهد که با حفظ 90 درصد درآمد، امتیازات انحصاری از جمله گوش دادن بدون آگهی، دسترسی زودهنگام و محتوای جایزه را به طرفداران ارائه دهند. Spotify در روز سه‌شنبه عضویت‌های پولی را راه‌اندازی کرد، روشی جدید برای پادکست‌ها برای کسب درآمد از بزرگترین طرفداران خود فراتر از قسمت‌های پاداش دارای دیوار پرداختی. سازندگان می‌توانند تصمیم بگیرند که چه امتیازهایی را به شنوندگان ارائه دهند، که می‌تواند صوتی یا ویدیوی جایزه، تبلیغات کمتر، دسترسی زودهنگام به نمایش‌ها یا ترکیبی از این موارد باشد. این سرویس استریم برای اولین بار این ایده را در روز سرمایه‌گذار خود در ماه مه پیش‌نمایش کرد، جایی که قابلیت‌های هوش مصنوعی را نیز معرفی کرد که به شنوندگان اجازه می‌دهد درباره آنچه که گوش می‌دهند یا تماشا می‌کنند سؤال بپرسند و ابزارهای جدیدی را برای مدیریت حمایت‌های سازنده ارائه کرد. همانطور که شرکت در آن زمان توضیح داد، عضویت ها به ایجاد یک مسیر طبیعی برای عمیق تر شدن، باز کردن تجربیات جدید و انحصاری برای طرفداران و فرصت های درآمدی جدید برای سازندگان کمک می کند. این ویژگی اکنون در 34 بازار در سراسر جهان از جمله ایالات متحده عرضه می شود. این راه اندازی آخرین نمونه از تلاش Spotify برای جذاب تر کردن پلتفرم خود برای سازندگان پادکست است، به خصوص که برای رقابت با YouTube به فضای ویدیویی بیشتر می رود. اگرچه پادکست‌ها مدت‌هاست که می‌توانند از طریق تبلیغات کسب درآمد کنند، عضویت‌های جدید می‌تواند با ارائه چیزی بیش از یک قسمت جایزه گاه به گاه، طرفداران بیشتری را برای حمایت از سازندگان ترغیب کند. سازندگان 90 درصد از درآمد عضویت را نگه می‌دارند و می‌توانند مزایای خود را در سطوح مختلف و گزینه‌های قیمتی بسته‌بندی کنند تا طرفداران در سطوح مختلف تعهد را جذب کنند. برای واجد شرایط بودن، پادکست‌ها باید برنامه‌های خود"}, {"source": "TechCrunch Main", "title": "Oura adds new fitness metrics to show how workouts impact your body", "link": "https://techcrunch.com/2026/10/20/oura-is-launching-two-new-ways-to-track-and-understand-activity/", "summary": "While Oura has largely dominated the smart ring market for years, rivals like RingConn and Ultrahuman ckwall quadruples valuation to $2.2B as websites wrangle an increasingly crowded internet", "link": "https://techcrunch.com/2026/10/20/blackwall-quadruples-valuation-to-2-2b-as-websites-wrangle-an-increasingly-crowded-internet/", "summary": "Blackwall has raised $100M at a $2.2B valuation to continue building security and filtering tools that help websites grapple with growing bot and AI traffic.", "date_str": "2026-10-20T07:01:00+00:00", "hash": "d823a608fbcd12c6", "title_fa": "Blackwall ارزش خود را چهار برابر کرده و به 2.2 میلیارد دلار رسانده است زیرا وب سایت ها با اینترنت شلوغ فزاینده درگیر هستند.", "summary_fa": "بلک وال 100 میلیون دلار با ارزش 2.2 میلیارد دلاری جمع آوری کرده است تا به ساخت ابزارهای امنیتی و فیلترینگ ادامه دهد که به وب سایت ها کمک می کند تا با ترافیک رو به رشد ربات و هوش مصنوعی دست و پنجه نرم کنند. Blackwall مستقر در استونی، که ابزارهای امنیتی ترافیک وب را برای ارائه دهندگان میزبانی می‌سازد، روز سه‌شنبه اعلام کرد که 100 میلیون دلار با ارزش 2.2 میلیارد دلار جمع‌آوری کرده است. محصولاتی ایجاد می کند که به وب سایت ها کمک می کند تا با حجم سرسام آور ترافیک ربات ها، به ویژه عوامل هوش مصنوعی دست و پنجه نرم کنند. سری C توسط AVP و با مشارکت سرمایه گذاران موجود داون کپیتال، MMC Ventures و Tera Ventures رهبری می شد. روی کارتی، رئیس اجرایی بلک وال، به TechCrunch گفت که این دور سرمایه گذاری، ارزش شرکت را نسبت به جمع آوری سرمایه قبلی در سال 2025، 4 برابر افزایش داد. در چند سال گذشته، شرکت‌های زیرساخت‌های وب مانند Cloudflare، Akamai، Imperva و Blackwall خود را در فضایی با ارزش اما دشوار یافتند: آنها در خط مقدم هستند، با حملات DDoS، خراش‌های بی‌رویه، مزارع بات‌نت، درخواست‌های مخرب، و این روزها، حتی انبوهی از عوامل هوش مصنوعی سرکشی می‌کنند. اما این فرصتی است که با کمک به ارائه دهندگان هاستینگ و وب سایت ها برای مقابله با تمام ترافیک ناخواسته بالقوه، یک قتل ایجاد کنید. بلک وال اما علاقه ای به رقابت با بزرگان در فضای خود ندارد. این شرکت به‌جای فروش مستقیم پلتفرم خود به وب‌سایت‌ها، از رویکرد کانال استفاده می‌کند و با میزبانی وب، سرویس‌های مدیریت شده و ارائه‌دهندگان ا
