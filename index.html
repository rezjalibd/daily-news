d bin, is 22 x 14 x 9. Frontier and Southwest are the most generous at 24 x 16 × 10. Either way, any carry-on that meets the airline's size requirements should fit through the new scanner. As a frequent traveler who flies several times a month, I have cleared security at numerous airports with these new scanners, including New York, Boston, Los Angeles, Atlanta, Denver, and Chicago. My Beis roller, which is slightly larger than standard and measures about 23 x 16 x 10, fit through the machine every time. The author s usual flying set-up: a Beis carry-on and a Fjallraven backpack. The Beis size has never been an issue for TSA. Taylor Rains/Business Insider Travelers who may have trouble getting their carry-ons through the new scanners are likely those who were bringing bags that were too big or bulky to begin with. For example, soft-shelled bags stuffed to the brim so they protrude may not fit. Expandable bags that cannot pack d", "date_str": "2026-09-25T10:49:01+00:00", "hash": "164463b02f4cd574", "title_fa": "اسکنرهای امنیتی جدید TSA کوچکتر می شوند. چمدان های دستی شما خوب خواهند شد.", "summary_fa": "کیف دستی شما باید در اسکنرهای جدید TSA قرار گیرد. Joe Raedle/Getty Images TSA یک اسکنر سه بعدی اشعه ایکس پیشرفته را برای حدود یک دهه راه اندازی کرده است. امنیت را افزایش می دهد، اما دهانه آن کوچکتر از ماشین هایی است که جایگزین شده است. برخی از افراد نگران هستند که کیف دستی آنها دیگر جا نشود. آنها نیازی به نگرانی ندارند. اسکنرهای جدید اشعه ایکس اداره امنیت حمل و نقل تقریباً از هر نظر برای مسافران بهتر هستند، به جز یکی: دهانه کوچکتر ممکن است برای برخی از کیف های دستی مناسب نباشد. دستگاه های جدید اشعه ایکس توموگرافی کامپیوتری سه بعدی (CT) یک دهه است که در دسترس هستند و در سال 2022 به طور جدی شروع به کار کردند. هدف این پروژه چند میلیارد دلاری این است که غربالگری امنیتی را موثرتر کند و با اجازه دادن به مسافران برای گذاشتن وسایلی مانند لپ تاپ و لوازم آرایش در کیف خود، سرعت خطوط را افزایش دهد. نکته مهم این است که دهانه آن حدود نیم اینچ کوچکتر از دستگاه هایی است که جایگزین شده است. برخی گزارش‌ها زنگ خطر را به صدا در می‌آورند که این تغییر می‌تواند مسافران را مجبور به پرداخت هزینه اضافی برای چک کردن یک چمدان پس از مجاز شدن از طریق TSA یا خرید یک چمدان جدید به اندازه کافی کوچک کند. این آژانس در وب سایت خود اشاره می کند که اسکنرهای پیشرفته ممکن است به این معنی باشد که برخی از کیف های دستی اکنون باید بررسی شوند. واقعیت آنقدرها هم وحشتناک نیست. چرا کیف دستی شما باید همچنان با اسکنرهای جدید TSA مطابقت داشته باشد - تقریباً 1200 مورد از آنها در تقریباً 300 فرودگاه در سراسر کشور مستقر شده اند - اندازه آن 24.5 اینچ عرض و 16.5 اینچ ارتفاع دارد. عمق روی تسمه پیوسته است."}, {"source": "Business Insider", "title": "I built my career by pushing through a painful chronic health issue. At 29, I'm adjusting my expectations.", "link": "https://www.businessinsider.com/painful-chronic-health-issue-endometriosis-redefine-success-2026-9", "summary": "The author had to redefine success after her second endometriosis surgery. Courtesy of Erica Williams At 27, I was building my PR business and in a doctoral program for business administration. Stage 4 endometriosis was making it hard to juggle both school and my clients. After my second surgery for endometriosis, I realized I needed to prioritize myself. In October 2025, Blackboard, the online platform through which I attend my doctoral program for business administration, displayed a grade I had never seen next to my name: an F. I had been working to run my new public relations business, maintain my 3.87 GPA, and manage ongoing health challenges . So, I couldn't hide my shock as I sat up in bed, looking at the unfamiliar score. I slid the laptop cursor over the grade repeatedly, as if it would magically change. I knew that it wouldn't. A daily 9-10 pain level and being bedridden due to stage 4 endometriosis made it nearly impossible to finish my dissertation course. While my instructors were kind and accommodating, I still felt the pressure of needing to turn in my outstanding assignments or risk failing the course. I was recovering from surgery and tried to push through It was bad timing to be worrying about school ; I had other, more urgent issues. I'd been battling with stage 4 endometriosis and already had one surgery before I learned I'd need another. Managing my pain while managing clients also proved to be an obstacle. I needed to develop media campaign strategies, but struggled to be there for myself. At an appointment in August, we'd scheduled my surgery for December. However, my symptoms had only worsened in the meantime, and the brain fog, inability to do most daily tasks, and high pain levels became so unbearable that waiting until December no longer felt like an option. We moved my surgery up. However, moving it up before the end of school also meant tapping my fingers across a keyboard from my bed the very next day, still groggy from the anesthesia, to salvage my grade . In the end, I passed, but at 28, I hadn't learned that pushing through wasn't a badge of honor. It was a habit I'd built because endurance made me feel in control. I realized pushing through wasn't a badge of honor, and changed my habits Pushing through was a lifelong pattern — one that endometriosis and uncertainty had amplified. I had accommodations at school, but they only provided more time to complete assignments; they did not give me the capacity to complete them. Whe", "date_str": "2026-09-25T10:37:01+00:00", "hash": "b86004f507888113", "title_fa": "من حرفه‌ام را با پشت سر گذاشتن یک مشکل مزمن سلامتی ایجاد کردم. در 29 سالگی، انتظاراتم را تعدیل می کنم.", "summary_fa": "نویسنده مجبور شد پس از دومین جراحی اندومتریوز موفقیت را دوباره تعریف کند. با حسن نیت از اریکا ویلیامز در 27 سالگی، در حال ایجاد کسب و کار روابط عمومی و در یک برنامه دکترا برای مدیریت بازرگانی بودم. مرحله 4 آندومتریوز کار را سخت می کرد که هم در مدرسه و هم با مشتریانم دستکاری کنم. بعد از جراحی دومم برای اندومتریوز، متوجه شدم که باید خودم را در اولویت قرار دهم. در اکتبر 2025، تخته سیاه، پلتفرم آنلاینی که از طریق آن در برنامه دکتری خود برای مدیریت بازرگانی شرکت می‌کنم، نمره‌ای را که هرگز ندیده بودم در کنار نامم نشان داد: یک F. من برای راه اندازی کسب و کار روابط عمومی جدیدم، حفظ معدل 3.87 و مدیریت چالش‌های بهداشتی مداوم کار می‌کردم. بنابراین، وقتی روی تخت نشستم و به نمره ناآشنا نگاه کردم، نتوانستم شوکم را پنهان کنم. نشانگر لپ‌تاپ را بارها روی درجه می‌کشیدم، گویی به طرز جادویی تغییر می‌کند. میدونستم که نمیشه سطح درد روزانه 9-10 و بستری بودن به دلیل مرحله 4 اندومتریوز، پایان دوره پایان نامه ام را تقریبا غیرممکن کرد. در حالی که مربیان من مهربان و همراه بودند، من هنوز این فشار را احساس می‌کردم که باید تکالیف برجسته‌ام را انجام دهم یا خطر شکست در دوره را داشتم. من در حال نقاهت بعد از عمل جراحی بودم و سعی کردم از آن عبور کنم. من مسائل فوری تر دیگری داشتم. من با مرحله 4 اندومتریوز دست و پنجه نرم می کردم و قبل از اینکه بفهمم به جراحی دیگری نیاز دارم، یک عمل جراحی انجام داده بودم. مدیریت درد من در حین مدیریت مشتریان نیز مانعی برای من بود. من نیاز داشتم که استراتژی‌های کمپین رسانه‌ای را توسعه دهم، اما تلاش کردم تا برای خودم باشم. در یک قرار ملاقات در ماه اوت، عمل جراحی من را برای دسامبر"}, {"source": "Business Insider", "title": "We want to hear how different generations are using AI agents", "link": "https://www.businessinsider.com/how-different-generations-use-ai-agents-poll-2026-9", "summary": "Business Insider wants to hear how different generations are using AI agents. Illustration by Cheng Xin/Getty Images Personal AI agents are attracting users of all stripes. Is it mainly a Gen Z thing? Or are millennials rushing to start using the tech? Fill out our poll below! Personal AI agents , the buzzy new thing in tech, are attracting users of all stripes. While agents were previously limited largely to more tech-oriented crowds, the release of Meta's Muse app earlier this month shot the tech squarely into the mainstream. Apptopia, a market intelligence platform, estimated that Muse received 1.8 million downloads on the App Store in the first 12 days after its release. Instinct , a personal AI agent released by an independent startup in August, has also become popular with users both in and outside the tech world. The agents work by accessing a user's emails, texts, calendar, bank account, and anything else you log into. With Instinct, users can \"text\" the agent in the iMessage app, and the agent responds almost immediately. Some might understandably worry about AI agents exercising so much unsupervised control over their lives. Many of those already using the tools, however, say they are excited to have a machine do tasks for them. Is your mother suddenly taken with her new agent? Does dad refuse to use the tech? Did your 14-year-old Zoomer kid give all his passwords to Mark Zuckerberg? Business Insider wants to hear from you. Take our survey below. Read the original article on Business Insider", "date_str": "2026-09-25T10:01:01+00:00", "hash": "9067ed1fcc6ff1da", "title_fa": "ما می خواهیم بشنویم که چگونه نسل های مختلف از عوامل هوش مصنوعی استفاده می کنند", "summary_fa": "Business Insider می خواهد بشنود که چگونه نسل های مختلف از عوامل هوش مصنوعی استفاده می کنند. تصویر توسط Cheng Xin/Getty Images عوامل هوش مصنوعی شخصی کاربران را از همه لحاظ جذب می کنند. آیا این عمدتاً یک چیز Gen Z است؟ یا هزاره ها برای شروع استفاده از فناوری عجله دارند؟ نظرسنجی ما را در زیر پر کنید عوامل هوش مصنوعی شخصی، چیز جدید پر سر و صدا در فناوری، کاربران از همه جهات را به خود جذب می کنند. در حالی که پیش از این کارگزاران تا حد زیادی به گروه‌های فناوری محور محدود می‌شدند، انتشار اپلیکیشن Meta's Muse در اوایل این ماه، این فناوری را کاملاً به جریان اصلی تبدیل کرد. Apptopia، یک پلتفرم اطلاعاتی بازار، تخمین زده است که Muse در 12 روز اول پس از انتشار، 1.8 میلیون دانلود در اپ استور دریافت کرده است. Instinct، یک عامل هوش مصنوعی شخصی که توسط یک استارت آپ مستقل در ماه آگوست منتشر شد، همچنین در بین کاربران در داخل و خارج از دنیای فناوری محبوب شده است. کارگزاران با دسترسی به ایمیل‌ها، متن‌ها، تقویم، حساب بانکی کاربر و هر چیز دیگری که وارد آن می‌شوید کار می‌کنند. با Instinct، کاربران می‌توانند در اپلیکیشن iMessage به نماینده پیامک ارسال کنند و نماینده تقریباً بلافاصله پاسخ می‌دهد. برخی ممکن است به طور قابل درک نگران باشند که عوامل هوش مصنوعی کنترل زیادی بر زندگی خود اعمال کنند. با این حال، بسیاری از کسانی که قبلاً از این ابزار استفاده می‌کردند، می‌گویند که از اینکه ماشینی وظایفی را برای آنها انجام دهد هیجان‌زده هستند. آیا مادرت به طور ناگهانی با نماینده جدیدش برده شده است؟ آیا پدر از استفاده از فناوری امتناع می کند؟ آیا فرزند زومر ۱۴ ساله شما همه رمزهای عبور خود را به مارک زاکربرگ داده است؟ Business Insider می خواهد از شما بشنود. در نظرسنجی"}, {"source": "Business Insider", "title": "A doctor shares her muscle-building routine for longevity, from quick weightlifting workouts to daily protein", "link": "https://www.businessinsider.com/longevity-doctor-shares-her-routine-to-build-muscle-protein-workouts-2026-9", "summary": "Longevity doctor Jennifer Timmons said she follows the same advice she gives to patients about lifting weights and eating plenty of protein to build lean muscle. Felicia Lasala Muscle mass is an investment in your future health, according to a longevity doctor. She keeps her fitness portfolio strong by lifting weights and eating enough protein throughout the day. For an extra edge, she uses supplements like creatine to support muscle building and brain health. For Dr. Jennifer Timmons, building muscle isn't just aesthetic; it's a prescription for a long, healthy life for both herself and her clients. Timmons, a board-certified longevity doctor in California, said muscle is essential for a healthy metabolism, protecting the bones and joints, and staving off illness and frailty as we age. \"The key to maintaining our independence is maintaining our muscle mass,\" she told Business Insider. \"Strong is the new goal. You could be skinny and still metabolically unhealthy.\" Timmons, 46, shared three pillars of her own routine for building lean muscle : time-efficient workouts, a high-protein and high-fiber diet, and supplements that are actually worth the money. \"I practice what I preach,\" Timmons said. \"I like that I can give personalized insights of what has worked for me and works for my patients. But I can also show women, 'Here's how much I'm training and here are the muscles you get.'\" Lifting weights on a busy schedule To maximize healthy years of life, Timmons encourages patients to \"take their MEDS,\" an acronym that stands for movement, emotional health, community connections, diet, and sleep. Movement should include strength training , whether with dumbbells or bodyweight. \"It doesn't have to be complicated, you don't have to use all the fancy gym equipment, you can do this at home,\" Timmons said. As a practicing physician and mom, she doesn't have much time to spare, but said 90 to 120 minutes a week of training is the sweet spot for longevity exercise, if you have a smart training plan. Timmons works out for about 45 minutes, two to three days a week, focusing on compound exercises that work multiple muscle groups at once to save time. For instance, she likes to grab a pair of 40-pound dumbbells for a set of squats that activate the whole lower body and core at once. Other compound exercises include push-ups, pull-downs, rowing variations, and lunges. Timmons said building muscle is crucial for healthy aging. Felicia Lasala It's also essential to hit th", "date_str": "2026-09-25T10:00:01+00:00", "hash": "b4d35d9db58824d1", "title_fa": "یک پزشک روال عضله سازی خود را برای طول عمر، از تمرینات وزنه برداری سریع تا پروتئین روزانه به اشتراک می گذارد.", "summary_fa": "دکتر جنیفر تیمونز گفت که او همان توصیه‌ای را که به بیماران در مورد وزنه‌برداری و خوردن مقدار زیادی پروتئین برای ساخت عضلات بدون چربی می‌دهد، دنبال می‌کند. به گفته یک پزشک طول عمر، توده عضلانی فلیسیا لاسالا سرمایه گذاری برای سلامت آینده شماست. او با وزنه زدن و خوردن پروتئین کافی در طول روز، مجموعه تناسب اندام خود را قوی نگه می دارد. برای مزیت بیشتر، او از مکمل هایی مانند کراتین برای حمایت از عضله سازی و سلامت مغز استفاده می کند. برای دکتر جنیفر تیمونز، عضله سازی فقط زیبایی شناختی نیست. این نسخه ای برای زندگی طولانی و سالم برای خود و مشتریانش است. تیمونز، یک پزشک تایید شده برای طول عمر در کالیفرنیا، گفت که عضلات برای متابولیسم سالم، محافظت از استخوان ها و مفاصل، و جلوگیری از بیماری و ضعف با افزایش سن ضروری است. او به Business Insider گفت: «کلید حفظ استقلال ما حفظ توده عضلانی ماست. \"قوی هدف جدید است. ممکن است لاغر باشید و همچنان از نظر متابولیسمی ناسالم باشید.\" تیمونز، 46 ساله، سه رکن از روال خود را برای ساخت عضلات بدون چربی به اشتراک گذاشت: تمرینات با زمان کارآمد، رژیم غذایی پر پروتئین و فیبر بالا، و مکمل هایی که واقعا ارزش پول را دارند. تیمونز گفت: \"من آنچه را که موعظه می کنم، تمرین می کنم.\" اما من همچنین می‌توانم به زنان نشان دهم که «اینجا چقدر تمرین می‌کنم و اینها ماهیچه‌هایی هستند که شما به دست می‌آورید.» وزنه‌برداری در یک برنامه شلوغ برای به حداکثر رساندن سال‌های سالم زندگی، تیمونز بیماران را تشویق می‌کند که «MEDS خود را مصرف کنند»، مخفف حرکات، سلامت عاطفی، ارتباطات اجتماعی، رژیم غذایی، و خواب. حرکات باید شامل تمرینات قدرتی باشد یا با بدن. تیمونز می‌گوید: «این کار لازم نیست پیچیده باشد، لازم نیست از تمام تجهیزات فانتزی باشگاه استفاده کنید، می‌توانید این"}, {"source": "Business Insider", "title": "A JPMorgan veteran left to work in Detroit's government. Now he's back to help the bank's $1.5 trillion security effort.", "link": "https://www.businessinsider.com/security-resiliency-initiative-jpmorgan-detroit-jamie-dimon-2026-9", "summary": "Marcus von Kapff returned to JPMorgan after working in the public sector. JPMorgan Marcus von Kapff spent 20 years at JPMorgan before working in Detroit's government. He's back at the bank, using his experience to help with its $1.5 trillion US security effort. Von Kapff said he can see problems from \"another angle,\" as his team forges deals with the government. Marcus von Kapff's knowledge of Detroit's formerly byzantine permitting process for opening a small business has come in surprisingly handy in his new role at JPMorgan. Von Kapff spent two decades at JPMorgan before becoming Detroit's chief operating officer in 2024, and is now back to work on the firm's Security Resilience Initiative , a $1.5 trillion effort to boost industries seen as strategically important to the US. Many of the SRI team's projects rely on coordination between the government and private industries, and von Kapff said his time in the public sector has positioned him uniquely well to do that work. He rejoined the firm this summer as head of advanced manufacturing, overseeing a team that supports companies building cutting-edge products, like specialized sensors or industrial equipment. \"I have a lot more empathy for understanding the roles that they play and how hard these jobs are,\" von Kapff said about government officials. He didn't expect to return to JPMorgan — when asked, von Kapff said no with a loud, halfway shocked laugh — but said he was compelled by SRI's mission and that \"timing is everything.\" Conversations with former colleagues, who assured him that the effort had the support of CEO Jamie Dimon , convinced him to join the roughly 30-person team. Von Kapff previously held a range of management positions at JPMorgan, including CFO of the commercial bank. In Detroit, he said he drew on the problem-solving and trust-building skills he developed at the firm to reform housing zoning laws, grow public transportation, and secure government funds for infrastructure investments. Now, he spends his days meeting with internal stakeholders and government officials to raise capital and address problems in the advanced manufacturing sector. It's an unexpected return to his roots: Von Kapff studied mechanical engineering in college and sold factory automation equipment in Pennsylvania and New Jersey after graduating. Solving the \"knotty problems\" Though von Kapff is a relative newcomer to SRI, the team has been in place for nearly a year. As of late September, it had financed more", "date_str": "2026-09-25T09:51:01+00:00", "hash": "6ceea89b075df600", "title_fa": "یک کهنه سرباز جی پی مورگان برای کار در دولت دیترویت رفت. اکنون او بازگشته است تا به تلاش امنیتی 1.5 تریلیون دلاری بانک کمک کند.", "summary_fa": "مارکوس فون کاپف پس از کار در بخش دولتی به جی پی مورگان بازگشت. جی پی مورگان مارکوس فون کاپ 20 سال در جی پی مورگان قبل از کار در دولت دیترویت گذراند. او به بانک بازگشته است و از تجربه خود برای کمک به تلاش های امنیتی 1.5 تریلیون دلاری خود در ایالات متحده استفاده می کند. فون کاف گفت که می تواند مشکلات را از \"زاویه ای دیگر\" ببیند، زیرا تیم او با دولت معامله می کند. دانش مارکوس فون کاپف از فرآیند صدور مجوز سابق بیزانسی دیترویت برای افتتاح یک کسب و کار کوچک به طرز شگفت انگیزی در نقش جدید او در جی پی مورگان مفید بوده است. فون کاپ قبل از اینکه در سال 2024 مدیر عملیاتی دیترویت شود، دو دهه را در JPMorgan گذراند و اکنون به کار بر روی ابتکار انعطاف پذیری امنیتی این شرکت بازگشته است، تلاشی 1.5 تریلیون دلاری برای تقویت صنایع که از نظر استراتژیک برای ایالات متحده مهم هستند. بسیاری از پروژه های تیم SRI به هماهنگی بین دولت و صنایع خصوصی متکی است و فون کاپ گفت که زمان او در بخش دولتی موقعیت منحصر به فردی را برای انجام این کار به او داده است. او تابستان امسال به عنوان رئیس بخش تولید پیشرفته به این شرکت ملحق شد و تیمی را که از شرکت‌هایی که محصولات پیشرفته‌ای مانند حسگرهای تخصصی یا تجهیزات صنعتی را تولید می‌کنند، پشتیبانی می‌کند. فون کاپ در مورد مقامات دولتی گفت: \"من برای درک نقش هایی که آنها ایفا می کنند و چقدر این مشاغل سخت هستند، همدلی بیشتری دارم.\" او انتظار نداشت که به JPMorgan بازگردد - وقتی از فون کاپ پرسیدند، فون کاپ با خنده ای بلند و شوکه شده جواب منفی داد - اما گفت که ماموریت SRI او را مجبور کرده است و \"زمان بندی همه چیز است.\""}, {"source": "Business Insider", "title": "Meta is no stranger to disrupting tech. But its agentic AI push feels different.", "link": "https://www.businessinsider.com/meta-muse-ai-agent-stock-volatility-agentic-ai-turning-point-2026-9", "summary": "Bloomberg/Getty Images The early success of Meta's new Muse agent has flipped the AI race on its head. Muse puts Meta at the forefront of the next wave of agentic AI, and investors are taking notice. Sign up for First Trade , Business Insider's daily markets newsletter. If you've been a Meta shareholder for the entirety of 2026, you've been on a wild ride. Investors have repeatedly flipped on a dime from AI optimism to concerns over spending. Earnings have usually brought a huge stock move — but the direction has been hard to predict. That's made the nearly $2 trillion Meta one of the market's most volatile mega-cap stocks, facing the kind of turbulence usually reserved for smaller companies. Meta's latest surge has been powered by the rapid uptake of Muse , its personal AI agent, since it was released on Sept. 8. The stock's response suggests investors see the app as the company's clearest shot yet at turning its enormous AI investment into a meaningful new business. The chart above shows the tug-of-war that has defined Meta's year, leaving shares up 18% year to date through Thursday. Wall Street repeatedly balked at the price of its AI ambitions, only to warm up when a potential payoff came into view. But Muse gives investors more than another promise about what AI might someday do for Meta. It offers a glimpse of the holy grail: a tangible example of what the company can build — and potentially sell — with all that spending. Why this time feels different The rise of agents could be a genuine inflection point for AI, marking a shift from simply answering prompts to carrying out tasks. Meta has an early opening to lead the consumer side of that next phase. Andrew Boone, an analyst who covers the stock for Citizens, sees Muse entering the grand pantheon of AI breakthroughs (emphasis mine): \"With Muse appearing to reach the next AI inflection point, the same way Claude Code did for enterprise AI last winter, and ChatGPT did originally with Chatbots , Meta is increasingly well positioned to grow share of consumer AI usage,\" he said in a Thursday report. His peers seem to agree. JPMorgan analysts raised their price target on Meta by $100, while Raymond James went one better and hiked by $210 — hefty moves for a stock already trading in triple digits. One advantage consistently cited by Meta bulls is the company's massive built-in audience. Its family of apps already reaches billions of people every day. If even a sliver of them become regular users of Muse or", "date_str": "2026-09-25T09:50:01+00:00", "hash": "833ec090a6e70d15", "title_fa": "متا با ایجاد اختلال در فناوری غریبه نیست. اما فشار هوش مصنوعی آن متفاوت است.", "summary_fa": "بلومبرگ/گتی ایماژ موفقیت اولیه مامور جدید میوز متا، رقابت هوش مصنوعی را بر سر آن تغییر داد. Muse متا را در خط مقدم موج بعدی هوش مصنوعی عامل قرار می دهد و سرمایه گذاران به آن توجه می کنند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. اگر در کل سال 2026 سهامدار متا بوده اید، در یک سفر وحشیانه بوده اید. سرمایه‌گذاران بارها و بارها از خوش‌بینی هوش مصنوعی به نگرانی‌ها در مورد هزینه‌ها دست می‌زنند. سود معمولاً حرکت سهام عظیمی را به همراه داشته است - اما پیش بینی جهت آن دشوار بوده است. این باعث شده است که متای تقریباً 2 تریلیون دلاری به یکی از بی‌ثبات‌ترین سهام بازار بزرگ تبدیل شود که معمولاً برای شرکت‌های کوچک‌تر با تلاطمی مواجه است. جدیدترین موج متا با جذب سریع Muse، عامل هوش مصنوعی شخصی آن، از زمانی که در 8 سپتامبر منتشر شد، ایجاد شده است. پاسخ سهام نشان می‌دهد که سرمایه‌گذاران این اپلیکیشن را به‌عنوان واضح‌ترین راه این شرکت در تبدیل سرمایه‌گذاری عظیم هوش مصنوعی به یک کسب‌وکار جدید معنادار می‌بینند. نمودار بالا طناب کشی را نشان می دهد که سال متا را تعریف کرده است و سهام را تا روز پنجشنبه 18 درصد افزایش داده است. وال استریت بارها و بارها از بهای جاه طلبی های هوش مصنوعی خود مخالفت کرد، تا زمانی که یک نتیجه بالقوه ظاهر شد. اما Muse به سرمایه گذاران بیش از وعده دیگری در مورد آنچه که AI ممکن است روزی برای Meta انجام دهد، می دهد. این یک نگاه اجمالی از جام مقدس را ارائه می دهد: یک نمونه ملموس از آنچه که شرکت می تواند بسازد - و به طور بالقوه بفروشد - با این همه هزینه. چرا این زمان احساس متفاوتی دارد ظهور عوامل می‌تواند نقطه عطف واقعی برای هوش مصنوعی باشد، که نشان‌دهنده تغییر از"}, {"source": "Business Insider", "title": "Billionaire David Rubenstein told us why he paid $1.7 billion for a baseball team, and shared his 2 biggest investing mistakes", "link": "https://www.businessinsider.com/david-rubenstein-sports-teams-investing-amazon-facebook-ai-stocks-billionaires-2026-9", "summary": "David Rubenstein is the principal owner of the Baltimore Orioles. Chris Bernacchi/Diamond Images via Getty Images David Rubenstein spoke to Business Insider about buying a sports team and his two big misses. He said the AI boom may still have steam, and selling in a crash can be a massive mistake. The private equity billionaire and author published a new book, \"Inside the Owner's Box,\" this week. David Rubenstein explained why he bought a baseball team, missed out on Amazon and Facebook, and would be careful betting on or against the AI boom. The billionaire cofounder of Carlyle Group , one of the world's biggest private equity firms, spoke to Business Insider ahead of the release of his new book \"Inside the Owner's Box: Conversations on Power and Leadership in Sports.\" In the book, Rubenstein tells the story of buying the Baltimore Orioles for around $1.7 billion in 2024, and shares his interviews with fellow team owners, including Robert Kraft of the New England Patriots. He told Business Insider that a few decades back, the ultrawealthy didn't want the scrutiny that comes with owning a team. But changing attitudes and soaring valuations mean they now believe \"not only can they have some fun, and kind of be a big deal in the sports world, but they can actually make money on it.\" Rubenstein said he bought the Orioles because he hadn't done much on the philanthropy front for his hometown of Baltimore, so he wanted to \"try to do something for the city.\" Early mistakes He also shared that his best investment was likely \"starting Carlyle with hardly any money,\" while his gravest investing error was \"walking away from Facebook and Amazon at the beginning .\" Rubenstein said that Amazon's founder Jeff Bezos, gave him and his partners at Carlyle a stake in the e-commerce startup \"at the very beginning.\" But they decided to sell it after Amazon stock collapsed during the dot-com bubble, meaning they dumped a position that would have been worth \"many billions of dollars today.\" He also recalled that his then-future son-in-law was a classmate of Mark Zuckerberg , and asked Rubenstein to invest when the Meta cofounder was seeking to raise $30,000 to launch his website. \"I didn't take it seriously,\" Rubenstein said. Eduardo Saverin provided the initial capital for Facebook instead, and now ranks among the world's 60 wealthiest people with a roughly $40 billion net worth, per the Bloomberg Billionaires Index. Navigating the AI race Rubenstein told Business Insider that", "date_str": "2026-09-25T09:45:15+00:00", "hash": "70a00fc88f21a44e", "title_fa": "میلیاردر دیوید روبنشتاین به ما گفت که چرا ۱.۷ میلیارد دلار برای یک تیم بیسبال پرداخت کرده است و ۲ اشتباه بزرگ سرمایه گذاری خود را به اشتراک گذاشته است.", "summary_fa": "دیوید روبنشتاین مالک اصلی بالتیمور اوریولز است. کریس برناکی/ تصاویر الماس از طریق گتی ایماژ دیوید روبنشتاین با Business Insider در مورد خرید یک تیم ورزشی و دو دلتنگی بزرگ خود صحبت کرد. او گفت که رونق هوش مصنوعی ممکن است همچنان بخار داشته باشد و فروش در هنگام سقوط می تواند یک اشتباه بزرگ باشد. این میلیاردر و نویسنده سهام خصوصی این هفته کتاب جدیدی به نام «درون جعبه مالک» منتشر کرد. دیوید روبنشتاین توضیح داد که چرا یک تیم بیسبال خرید، آمازون و فیس‌بوک را از دست داد و در شرط بندی روی یا علیه رونق هوش مصنوعی محتاط بود. بنیانگذار میلیاردر Carlyle Group، یکی از بزرگترین شرکت‌های سهام خصوصی جهان، پیش از انتشار کتاب جدید خود با عنوان «در جعبه مالک: گفتگوها درباره قدرت و رهبری در ورزش» با Business Insider صحبت کرد. در این کتاب، روبنشتاین داستان خرید بالتیمور اوریولز را به قیمت حدود 1.7 میلیارد دلار در سال 2024 بیان می‌کند و مصاحبه‌های خود را با صاحبان تیم از جمله رابرت کرافت از نیوانگلند پاتریوتز به اشتراک می‌گذارد. او به Business Insider گفت که چند دهه پیش، افراد فوق‌ثروتمند نمی‌خواستند که با داشتن یک تیم بررسی شود. اما تغییر نگرش ها و افزایش ارزش ها به این معنی است که آنها اکنون معتقدند \"نه تنها می توانند سرگرمی داشته باشند، و به نوعی در دنیای ورزش یک معامله بزرگ باشند، بلکه در واقع می توانند از این طریق پول به دست آورند.\" روبنشتاین گفت که او Orioles را خریداری کرده است زیرا او در جبهه بشردوستانه برای زادگاهش بالتیمور کار زیادی انجام نداده است، بنابراین می‌خواهد \"سعی کند کاری برای شهر انجام دهد.\" اشتباهات اولیه او همچنین به اشتراک گذاشت که بهترین سرمایه‌گذاری‌اش احتمالاً «شروع کارلایل با تقریباً هیچ پولی» بود، در حالی که بزرگ‌ترین اشتباه سرمایه‌گذاری‌اش این بود که «در ابتدا از فیس‌بوک و"}, {"source": "Business Insider", "title": "From gumball machines to AI stores: How an entrepreneur followed what's trending to build an 8-figure business", "link": "https://www.businessinsider.com/ai-stores-small-business-entrepreneur-secrets-to-longevity-vending-machines-2026-9", "summary": "Serial entrepreneur Mike Burnett is the cofounder and CEO of SmartMarket Solutions. Courtesy of Mike Burnett Mike Burnett, CEO of SmartMarket Solutions, has a 27-year entrepreneurial track record. He's found success by spotting trends to stay ahead of the curve. To spot trends, he says, listen to the people closest to the customer. For 27 years, Mike Burnett has built businesses by getting ahead of the curve. In 1999, while working in sales and supporting a growing family, he started a side hustle placing tabletop games in restaurants. He bought a few machines to earn extra income. Then, the manufacturer asked whether he would consider becoming a distributor, selling the same opportunity to other would-be operators. Burnett and his friend-turned-business partner, Jeff Marsh, built a bare-bones website and, with little savings, used credit cards to buy newspaper ads. In their first month, they sold $20,000 worth of equipment. \"Honestly, I thought it was a fluke,\" Burnett told Business Insider. \"Like, we just got lucky.\" The next month, however, sales reached $25,000. In month three, they hit $40,000, he said. At that point, Burnett rented a small office, hired his niece as a receptionist, and went all in on the business. Over the years, the company expanded from tabletop games to gumball and bulk-candy machines, then snack and soda vending. Around 2007, Burnett began moving into healthy vending with HealthyYOU , which evolved into an eight-figure revenue business, according to company financial statements reviewed by Business Insider. His latest bet is SmartMarket Solutions , which sells AI-powered micro-stores called SmartMarts that let customers unlock a cooler, browse its shelves, and pay automatically for the items they take. The products have changed over the decades, but Burnett's operating principle has not: Learn to distinguish a fad from a lasting trend, then validate the opportunity before making a bigger move. Know the difference between a fad and a trend — and jump on the latter Around 2007, Burnett began hearing a similar request from the people operating his machines: Could they stock healthier options, such as Clif Bars? The feedback matched what he was seeing elsewhere. Whole Foods and Trader Joe's were expanding, while more consumers were looking for convenient ways to eat better. Burnett and his team began testing healthier products rather than immediately abandoning traditional vending. Eventually, the evidence was hard to ignore. The shi", "date_str": "2026-09-25T09:45:01+00:00", "hash": "c27af4127b9efc98", "title_fa": "از ماشین‌های آدامس تا فروشگاه‌های هوش مصنوعی: چگونه یک کارآفرین برای ایجاد یک کسب‌وکار 8 رقمی از روندهای رایج پیروی کرد", "summary_fa": "مایک برنت، کارآفرین سریالی، بنیانگذار و مدیرعامل SmartMarket Solutions است. با حسن نیت مایک برنت مایک برنت، مدیر عامل SmartMarket Solutions، دارای سابقه 27 ساله کارآفرینی است. او با تشخیص روندها برای جلوتر ماندن از منحنی موفقیت به دست آورده است. او می‌گوید برای شناسایی روندها، به نزدیک‌ترین افراد به مشتری گوش دهید. به مدت 27 سال، مایک برنت با پیشی گرفتن از منحنی ها، کسب و کارهایی را ایجاد کرده است. در سال 1999، در حالی که در بخش فروش و حمایت از یک خانواده در حال رشد کار می‌کرد، با قرار دادن بازی‌های رومیزی در رستوران‌ها، کار خود را آغاز کرد. او برای کسب درآمد اضافی چند دستگاه خرید. سپس، سازنده پرسید که آیا او در نظر دارد که یک توزیع کننده شود و همین فرصت را به دیگر اپراتورهای احتمالی بفروشد. برنت و دوستش که شریک تجاری شده بود، جف مارش، یک وب‌سایت ساده ایجاد کردند و با صرفه‌جویی اندک، از کارت‌های اعتباری برای خرید آگهی‌های روزنامه استفاده کردند. آنها در ماه اول 20000 دلار تجهیزات فروختند. برنت به Business Insider گفت: «راستش را بخواهید، من فکر می‌کردم که این یک تصادف است. \"مثلا، ما فقط شانس آوردیم.\" ماه بعد اما فروش به 25000 دلار رسید. او گفت که در ماه سوم، آنها به 40000 دلار رسیدند. در آن زمان، برنت یک دفتر کوچک اجاره کرد، خواهرزاده‌اش را به‌عنوان مسئول پذیرش استخدام کرد و همه چیز را به کار گرفت. در طول سال‌ها، این شرکت از بازی‌های رومیزی به دستگاه‌های آدامس و آب نبات‌های فله و سپس فروش تنقلات و نوشابه گسترش یافت. بر اساس صورت‌های مالی شرکت بررسی شده توسط Business Insider، در حدود سال 2007، برنت شروع به حرکت به سمت فروش سالم با HealthyYOU کرد که به یک تجارت درآمد هشت رقمی تبدیل شد. آخرین شرط او SmartMarket Solutions است که فروشگاه‌های خرد مجهز"}, {"source": "Business Insider", "title": "AI can't take over your holiday shopping quite yet, a new study suggests.", "link": "https://www.businessinsider.com/study-shows-ai-errors-shopping-tools-struggle-accuracy-2026-9", "summary": "A study from Product.ai found that major LLMs had high error rates when used to find products while shopping online. Andriy Onufriyenko/Getty Images Don't rely on LLMs to do your holiday shopping this year, a new study says. A test of four AI engines found that they had issues providing accurate information about products. Problems ranged from giving the wrong price to not finding the latest model. AI isn't able to take over your holiday shopping yet, a new study suggests. AI-powered shopping assistants frequently give conflicting answers about prices, product specifications, and which items are current, according to a study published this week by Product.ai, a startup that checks product claims against evidence. The company tested the free and paid versions of ChatGPT, Claude, Gemini, and Perplexity using 220 shopping questions about products ranging from laptops and TVs to mattresses, sunscreen, and robot vacuums. It ran each question five times on each service, capturing 8,794 responses. Eighty-six percent of the questions produced a repeatable factual conflict, Product.ai found. The study defined a conflict as a checkable disagreement — such as a different price, product model, or specification — that appeared in multiple responses. \"In short, it says that these LLMs aren't there yet when it comes to this end-to-end experience,\" said Dakota Nunley, Product.ai's head of search product. AI has been creeping further into shopping, with both retailers and LLMs offering tools to find and buy things online. AI agents such as Meta's Muse or Instinct could do even more of the work for you. Product.ai's study points to a more fundamental issue: AI still struggles to provide accurate information that humans or AI agents need. \"Perplexity is the only AI company relentlessly focused on achieving 100% accuracy, and we lead the industry in every measure of it,\" a Perplexity spokesperson said. Representatives for the other three LLMs did not respond to requests for comment. The study found that 97% of head-to-head questions, such as asking the AI models to compare two products, produced a conflict. That was higher than the 75% conflict rate for straightforward factual or specification questions. The models also struggled to provide users with the correct product prices. Of the 913 answers that Product.ai could verify, 85% matched the current or listed price. There were differences between the LLMs. Gemini had the highest share of questions with what Product.ai classi", "date_str": "2026-09-25T09:37:02+00:00", "hash": "d5936837001feafb", "title_fa": "یک مطالعه جدید نشان می دهد که هوش مصنوعی هنوز نمی تواند خریدهای تعطیلات شما را کاملاً تحت کنترل درآورد.", "summary_fa": "مطالعه ای از Product.ai نشان داد که LLM های اصلی در هنگام خرید آنلاین، نرخ خطای بالایی دارند. آندری اونوفرینکو/گتی ایماژز برای انجام خریدهای تعطیلات امسال خود به LLM اعتماد نکنید. آزمایش چهار موتور هوش مصنوعی نشان داد که آنها در ارائه اطلاعات دقیق درباره محصولات با مشکل مواجه هستند. مشکلات از قیمت اشتباه تا پیدا نکردن آخرین مدل متغیر بود. یک مطالعه جدید نشان می دهد که هوش مصنوعی هنوز نمی تواند خریدهای تعطیلات شما را به دست بگیرد. بر اساس مطالعه‌ای که این هفته توسط Product.ai منتشر شد، دستیاران خرید مبتنی بر هوش مصنوعی اغلب پاسخ‌های متناقضی درباره قیمت‌ها، مشخصات محصول، و اینکه کدام اقلام فعلی هستند، می‌دهند. این شرکت نسخه های رایگان و پولی ChatGPT، Claude، Gemini و Perplexity را با استفاده از ۲۲۰ سوال خرید در مورد محصولات مختلف از لپ تاپ و تلویزیون گرفته تا تشک، ضد آفتاب و جاروبرقی روباتی آزمایش کرد. هر سوال را پنج بار در هر سرویس اجرا کرد و 8794 پاسخ گرفت. Product.ai دریافت که هشتاد و شش درصد از سؤالات یک تعارض واقعی قابل تکرار ایجاد کردند. این مطالعه تضاد را به عنوان یک اختلاف قابل بررسی - مانند قیمت، مدل محصول یا مشخصات متفاوت - که در پاسخ‌های متعدد ظاهر می‌شود، تعریف کرد. داکوتا نانلی، رئیس محصول جستجوی Product.ai گفت: «به طور خلاصه، می‌گوید که این LLM‌ها هنوز وجود ندارند، وقتی صحبت از این تجربه انتها به پایان می‌شود. هوش مصنوعی بیشتر به سمت خرید رفته است، هم خرده فروشان و هم LLM ها ابزارهایی را برای یافتن و خرید آنلاین چیزها ارائه می دهند. عوامل هوش مصنوعی مانند Meta's Muse یا Instinct می توانند کارهای بیشتری را برای شما انجام دهند. مطالعه Product.ai به یک مسئله اساسی‌تر اشاره می‌کند: هوش مصنوعی همچنان در تلاش برای ارائه اطلاعات دقیقی است که انسان‌ها یا عوامل هوش مصنوعی به آن"}, {"source": "Business Insider", "title": "'Soar' wars: Inside two AI startups' messy fight over the same name", "link": "https://www.businessinsider.com/soar-startup-name-ai-travel-fight-2026-9", "summary": "Getty Images; Tyler Le/BI Stanley Virgint and Henry Langmack's LinkedIn messages started politely enough. Virgint told Langmack to have a \"killer time at NYU\" on May 17. Langmack asked about Soar, Virgint's AI travel companion startup. \"When are you planning on launching?\" he asked. \"I'm on the waitlist.\" The following day, Virgint said that he was \"dying with fundraise\" — he was meeting with investors at the time — and sent his phone number. Langmack launched his own startup the following day — also called Soar. It also promised AI travel services (specifically, flight-booking). And it also had a small plane as its logo, shooting up and to the right. Virgint fired off a multi-paragraph LinkedIn message, calling Langmack's new startup a copycat. \"We're asking you to rebrand,\" he wrote. \"Super happy to resolve this quickly.\" It didn't resolve quickly. \"It was a nightmare,\" said Virgint, who is 26. \"To have someone willingly reach out to me, then launch a name and inject me into a war I didn't want to be in — it sucks.\" Companies have long fought over their similar names. Steve Jobs' Apple Computer fought against The Beatles' Apple Corp. Two WWFs duked it out for the acronym, leading one to become the WWE. The battle over the Soar name was about visibility as much as identity. While Virgint continued building his product, Langmack and his cofounder, Alex Slater, made theirs go viral. There was splashy spending on marketing, plastering X with their logo-painted Cybertruck and branded Lamborghini. Virgint found that he couldn't keep up, and that the rival startup was beginning to affect his own company's reputation. What were his options? In a crowded startup market, AI companies are finding it increasingly difficult to stand out . There are AI wrappers upon wrappers upon wrappers. Finding a unique niche is hard, and holding onto it is even harder. The Soar wars literalized this. Name against name. Capital against capital. \"Let the best Soar win,\" Langmack said. Langmack and Slater had money to spend. Both founders had viral startups under their belt. The 19-year-old Langmack helped sell Cal AI to MyFitnessPal; the 21-year-old Slater founded Quittr, an app to help users quit their porn addiction. (Both companies were reportedly subject to high-profile data breaches.) The duo said they have raised a $1 million seed round at a $10 million valuation, though they declined to name any investors, saying the information was \"confidential.\" Henry Langmack lives in the", "date_str": "2026-09-25T09:37:01+00:00", "hash": "24adc6e14b196de9", "title_fa": "جنگ‌های «بالابر»: در داخل دو استارت‌آپ هوش مصنوعی بر سر همین نام دعوا می‌کنند", "summary_fa": "گتی ایماژ; پیام های لینکدین تایلر لو/بی استنلی ویرجنت و هنری لانگمک به اندازه کافی مودبانه آغاز شد. ویرجینت به لانگمک گفت که در 17 مه یک \"زمان قاتل در نیویورک\" داشته باشد. \"چه زمانی قصد راه اندازی دارید؟\" او پرسید. \"من در لیست انتظار هستم.\" روز بعد، ویرجینت گفت که \"با جمع آوری سرمایه می میرد\" - در آن زمان با سرمایه گذاران ملاقات می کرد - و شماره تلفن خود را ارسال کرد. Langmack روز بعد استارت آپ خود را راه اندازی کرد - که Soar نیز نامیده می شود. همچنین خدمات سفر با هوش مصنوعی (به ویژه رزرو پرواز) را وعده داده است. و همچنین یک هواپیمای کوچک به عنوان نشان خود داشت که به سمت بالا و سمت راست شلیک می کرد. ویرجنت یک پیام لینکدین چند پاراگرافی منتشر کرد و راه‌اندازی جدید لانگمک را کپی‌کننده خواند. او نوشت: «از شما می‌خواهیم که برند خود را تغییر دهید. \"بسیار خوشحالم که این را به سرعت حل می کنم.\" سریع حل نشد ویرجین 26 ساله گفت: «این یک کابوس بود. \"اینکه کسی با میل و میل به من برسد، سپس نامی را مطرح کند و به من وارد جنگی کند که نمی‌خواستم در آن شرکت کنم - بد است.\" شرکت‌ها مدت‌هاست که بر سر نام‌های مشابه خود دعوا کرده‌اند. رایانه اپل استیو جابز با شرکت اپل بیتلز مبارزه کرد. دو WWF آن را برای نام اختصاری انتخاب کردند که منجر به تبدیل شدن یکی به WWE شد. نبرد بر سر نام Soar به همان اندازه که بر سر هویت بود، روی دید بود. در حالی که ویرجنت به ساخت محصول خود ادامه می داد، لنگمک و بنیانگذارش، الکس اسلیتر، محصول خود را در فضای مجازی منتشر کردند. هزینه های زیادی برای بازاریابی انجام شد و X را با Cybertruck با لوگو و لامبورگینی مارک پوشانده شدند. ویرجینت"}, {"source": "Business Insider", "title": "This startup added a new job app requirement for interns: handwritten cover letters", "link": "https://www.businessinsider.com/dumbco-startup-handwritten-cover-letters-ai-dumb-phones-i2026-9", "summary": "Dumb.co, a startup that makes customized flip phones, said it was inundated with AI slop. Then it required that cover letters be handwritten. iStock; Tyler Le/BI Dumb.co, a startup that makes modified \"dumb\" phones, said it was sick of AI slop in job apps. The company started requiring handwritten cover letters for its internship applications. \"It felt like someone actually was looking through what I had to say,\" said one candidate, who got hired. Even the companies promoting analog lifestyles are being inundated with AI job applications. Dumb.co, a startup selling modified flip phones , was looking for interns passionate about being more offline. There was just one glitch: A startling number of cover letters appeared to have been written by AI — or at least sounded like it. The letters weren't \"connecting with our mission and our greater goal,\" said Marlee Pelton-Fuentes, customer success manager at Dumb.co, who oversees the company's internship program. She discussed the problem with the company's CEO, Danny Hogenkamp, as well as other coworkers. To bypass the flood of cookie-cutter applications , they added an unusual requirement a few days after the listings went live: handwritten cover letters. Seeking those with an interest in 'dumb living' The company said that nearly 900 people applied to four internship roles — marketing, business and operations, customer success, and tech — through the job platform Handshake. About 70% of those applicants uploaded handwritten letters answering why they were interested in \"dumb living,\" why they wanted to work at the company, and whether they had a \"dumb\" phone . A letter from Jaylah Symonette, who was hired as a marketing intern by Dumb.co. Dumb.co Another 200 to 300 applicants physically mailed their apps, including handwritten letters, said Afreka Ebanks, Dumb.co director of brand and communications. After reviewing the notes and interviewing 60 people, the company hired 10 interns. The prompts meant the letters felt more like personal reflections than rote formalities, said Pelton-Fuentes. \"We were able to get a lot more about the person and the work that they want to do, their attitude, their passion.\" Signaling effort in the peak-app era A letter from Dumb.co software engineering intern Dhwani Upadhyay reflecting on the long-term effects of social media use. Dumb.co At a time when job seekers are burned out from mass-applying and hiring managers are equally overwhelmed by the flood of applications, AI become", "date_str": "2026-09-25T09:35:01+00:00", "hash": "06fac45b45e4f702", "title_fa": "این استارت‌آپ یک مورد نیاز اپلیکیشن شغلی جدید برای کارآموزان اضافه کرد: نامه‌های پوششی دست‌نویس", "summary_fa": "Dumb.co، استارتاپی که تلفن‌های تاشو سفارشی‌سازی می‌کند، گفت که غرق در هوش مصنوعی شده است. سپس لازم شد که نامه های پوششی دست نوشته شوند. آی استوک؛ Tyler Le/BI Dumb.co، استارتاپی که گوشی‌های «گنگ» اصلاح‌شده را تولید می‌کند، گفت که از هوش مصنوعی در اپلیکیشن‌های شغلی خسته شده است. این شرکت برای برنامه های کارآموزی خود نیاز به نامه های پوششی دست نویس را آغاز کرد. یکی از کاندیداها که استخدام شده است، گفت: «احساس می‌کردم که یک نفر واقعاً به آنچه می‌خواهم بگویم نگاه می‌کند. حتی شرکت‌هایی که سبک زندگی آنالوگ را ترویج می‌کنند، در حال غرق شدن در برنامه‌های شغلی هوش مصنوعی هستند. Dumb.co، استارت‌آپی که تلفن‌های تاشو تغییر یافته می‌فروشد، به دنبال کارآموزانی بود که علاقه‌مند به آفلاین بودن هستند. فقط یک اشکال وجود داشت: به نظر می‌رسید تعداد شگفت‌انگیزی از نامه‌های پوششی توسط هوش مصنوعی نوشته شده‌اند – یا حداقل شبیه آن هستند. مارلی پلتون فوئنتس، مدیر موفقیت مشتری در Dumb.co که بر برنامه کارآموزی شرکت نظارت می کند، گفت: نامه ها \"ارتباط با ماموریت و هدف بزرگ ما\" نبودند. او این مشکل را با مدیر عامل شرکت، دنی هوگنکمپ، و همچنین سایر همکاران در میان گذاشت. برای دور زدن سیل برنامه‌های برش کوکی، آنها چند روز پس از انتشار فهرست‌ها یک الزام غیرمعمول اضافه کردند: نامه‌های پوششی دست‌نویس. به دنبال افرادی که به «زندگی احمقانه» علاقه دارند، این شرکت گفت که نزدیک به 900 نفر برای چهار نقش کارآموزی - بازاریابی، کسب و کار و عملیات، موفقیت مشتری و فناوری - از طریق پلت فرم شغلی Handshake درخواست دادند. حدود 70 درصد از آن متقاضیان نامه‌های دست‌نویسی را بارگذاری کردند که در آن پاسخ می‌دادند چرا به «زندگی احمقانه» علاقه‌مند هستند، چرا می‌خواهند در شرکت کار کنند و آیا تلفن «گنگ» دارند یا خیر. نامه ای از Jaylah Symonette که به عنوان کارآموز بازاریابی توسط"}, {"source": "Business Insider", "title": "I was a super-volunteer when my kids were in elementary school. Once they reached high school, I turned that role over to my husband.", "link": "https://www.businessinsider.com/husband-stepped-up-to-volunteer-high-school-2026-9", "summary": "The author s husband (right) frequently volunteers his time now that their kids are in high school. Courtesy of Kate Loweth. After 12 years of volunteering frequently at my kids' school, I was ready to take a step back. When my youngest reached high school, my husband unexpectedly stepped up. His roles look different, proving that being involved doesn't have to mean showing up at school every day. When we moved to California at the start of my oldest child's kindergarten year, I figured volunteering at school would be an easy way to meet people and get to know our new school. I was right — and then some. Pretty much every year for the next 12 years, I was a room parent for one or more classes. I photographed the yearbook, was a Girl Scout leader, organized teacher appreciation events, and became the parent you could count on when someone needed to send an email, make a sign-up sheet, or figure out how to get 30 kids to participate in something. My husband rarely volunteered beyond grilling burgers at the annual carnival, which was more of a dad hangout than a traditional volunteer gig. I genuinely enjoyed my volunteer experiences. Volunteering gave me a community in a place where we were new, and it helped me feel connected to what my kids were doing at school. But by the time my youngest headed to high school, I was ready for a break . The author said she put in 12 years as a room parent, event organizer, and more when her kids were younger. Courtesy of Kate Loweth. After more than a decade of volunteering, I was ready to step back and reclaim some of my time . With all three kids in high school, I figured our days of volunteering at school were mostly behind us. I certainly didn't expect my husband to jump in and become the family volunteer. My husband found his own way to volunteer Instead of our family stepping back, my husband stepped up. And the funny thing is that I didn't ask him to. We never had a conversation where I handed him a list of volunteer responsibilities or suggested it was his turn. He simply found opportunities that interested him and started getting involved. The author said her husband found volunteer activities that were of interest to him, like helping their son with the FAA garden sale. Courtesy of Kate Loweth. He took over organizing the school's FFA garden project, including sales where students sold their tomato and pepper seedlings to community members. He also became even more involved with the 4-H poultry project my kids ha", "date_str": "2026-09-25T09:27:01+00:00", "hash": "a3f43e604a3d2fdc", "title_fa": "زمانی که بچه هایم در دبستان بودند، یک فوق داوطلب بودم. وقتی به دبیرستان رسیدند، آن نقش را به شوهرم سپردم.", "summary_fa": "شوهر نویسنده (راست) اغلب اوقات خود را به طور داوطلبانه در حال حاضر که بچه های آنها در دبیرستان هستند، اختصاص می دهد. با حسن نیت از کیت لوث. پس از 12 سال کار داوطلبانه مکرر در مدرسه بچه هایم، آماده بودم که یک قدم به عقب بردارم. وقتی کوچکترین من به دبیرستان رسید، شوهرم به طور غیرمنتظره ای پا به عرصه گذاشت. نقش‌های او متفاوت به نظر می‌رسد و ثابت می‌کند که درگیر بودن به معنای حضور هر روز در مدرسه نیست. وقتی در آغاز سال مهدکودک فرزند بزرگ‌ترم به کالیفرنیا نقل مکان کردیم، فکر کردم که داوطلب شدن در مدرسه راهی آسان برای ملاقات با مردم و آشنایی با مدرسه جدیدمان خواهد بود. من درست گفتم - و بعد مقداری. تقریباً هر سال در 12 سال بعد، من یک یا چند کلاس والدین اتاق بودم. من از سالنامه عکس گرفتم، یک رهبر پیشاهنگی دختر بودم، رویدادهای قدردانی از معلمان را سازماندهی کردم، و وقتی کسی نیاز داشت که یک ایمیل بفرستد، یک برگه ثبت نام تهیه کند یا بفهمد چگونه می توان 30 کودک را برای شرکت در کاری وادار کرد، روی آن حساب کنید. شوهرم به ندرت در کارناوال سالانه فراتر از کباب کردن همبرگر داوطلب می شد، که بیشتر یک پاتوق پدر بود تا یک کنسرت داوطلبانه سنتی. من واقعاً از تجربیات داوطلبانه خود لذت بردم. داوطلب شدن در جایی که تازه وارد بودیم، به من یک جامعه داد و به من کمک کرد تا با کارهایی که فرزندانم در مدرسه انجام می‌دادند، احساس ارتباط کنم. اما زمانی که فرزند کوچکترم به دبیرستان رفت، من برای استراحت آماده بودم. نویسنده می‌گوید که او ۱۲ سال را به عنوان سرپرست اتاق، برگزارکننده رویدادها و کارهای دیگر، زمانی که فرزندانش کوچکتر بودند، صرف کرده است. با احترام از کیت لوث. پس از بیش از یک دهه داوطلب شدن،"}, {"source": "Business Insider", "title": "I was laid off from Oracle in March and have been job hunting since. Getting a human to see my app is the hardest part.", "link": "https://www.businessinsider.com/oracle-layoff-unemployed-navigating-an-ai-ridden-job-market-2026-9", "summary": "Jerehmiah Jessee-Lantz is still looking for his next full-time role after being impacted by Oracle layoffs earlier this year. Courtesy of Jerehmiah Jessee-Lantz Jerehmiah Jessee-Lantz wasn't surprised Oracle performed layoffs — he just didn't expect to be cut. Since March, he's been searching for a new full-time role. He shares what feels most contradictory about the current AI-ridden job market. This as-told-to essay is based on conversations with Jerehmiah Jessee-Lantz, a 42-year-old based in Kansas City. He was an employee at Oracle up until March and is still looking for full-time work. His words have been edited for length and clarity. In March, I got an email at 5 a.m. saying I'd been laid off from Oracle . There had been layoffs at the company before, and as a manager and leader, I had been on the other side of those rounds. So, I wasn't surprised that the cuts happened, I just didn't expect to be included this time. I had been doing good work and didn't feel like a likely target. But if you live in the industry long enough, you know this could happen to anyone. Up until this point, I could afford to be very conservative in my job search and apply only to roles I was very passionate about. Now I'm casting a wider net because eventually my savings will run out. I tried not to take the layoff personally There's an emotional response to being put in a position like this, but at the same time, it's not a personal decision Oracle made. It's not a statement about my competence or how I align in the job market . I've had to lay off people who I know were very competent and very good at their jobs. So, people shouldn't ever let a situation like this make them feel like it's because they weren't good enough or weren't skilled. It's just that the company wanted to invest in different things. I live a pretty conservative life, and I had enough in savings to know I wasn't desperate, so I didn't immediately start applying for new roles. I knew I'd need money again, but I wasn't in a position where I had to take any offer right away. The first thing I did was start an LLC I had a periodic data-tracking app idea I'd been wanting to work on for a long time, but never had a chance to. After the first couple of weeks, I knew my passion-project app was probably not going to pay my bills, so I started looking for new roles. I would work on my project in the morning, then the second half of the day was dedicated to applying to jobs. The most surprising thing about being", "date_str": "2026-09-25T09:27:01+00:00", "hash": "f3502543cb805cfb", "title_fa": "من در ماه مارس از اوراکل اخراج شدم و از آن زمان به دنبال کار هستم. اینکه یک انسان برنامه من را ببیند سخت ترین قسمت است.", "summary_fa": "Jerehmiah Jessee-Lantz پس از اینکه اوایل امسال تحت تأثیر اخراج اوراکل قرار گرفت، همچنان به دنبال نقش تمام وقت بعدی خود است. با حسن نیت از Jerehmiah Jessee-Lantz Jerehmiah Jessee-Lantz تعجب نکرد که اوراکل از اخراج کارکنانش غافلگیر شد - او فقط انتظار نداشت که اخراج شود. از ماه مارس، او به دنبال یک نقش تمام وقت جدید است. او آنچه را که در مورد بازار کار فعلی مبتنی بر هوش مصنوعی بسیار متناقض است به اشتراک می گذارد. این مقاله گفته شده بر اساس مکالمات با Jerehmiah Jessee-Lantz، 42 ساله ساکن کانزاس سیتی است. او تا ماه مارس در اوراکل کارمند بود و همچنان به دنبال کار تمام وقت است. کلمات او برای طولانی و وضوح ویرایش شده است. در ماه مارس، ساعت 5 صبح ایمیلی دریافت کردم که می‌گفت از اوراکل اخراج شده‌ام. قبلاً در شرکت اخراج هایی صورت گرفته بود و من به عنوان یک مدیر و رهبر، طرف دیگر آن دوره ها بودم. بنابراین، من تعجب نکردم که این برش ها اتفاق افتاد، فقط انتظار نداشتم این بار شامل شود. من کار خوبی انجام می دادم و به نظر نمی رسید یک هدف احتمالی باشم. اما اگر به اندازه کافی در این صنعت زندگی می کنید، می دانید که ممکن است این اتفاق برای هر کسی بیفتد. تا این مرحله، می‌توانستم در جستجوی شغلم بسیار محافظه‌کار باشم و فقط برای نقش‌هایی که به آنها علاقه زیادی داشتم، استفاده کنم. اکنون من شبکه گسترده تری ایجاد می کنم زیرا در نهایت پس انداز من تمام می شود. من سعی کردم این اخراج را شخصاً نپذیرم، قرار گرفتن در موقعیتی مانند این واکنش احساسی دارد، اما در عین حال، این یک تصمیم شخصی اوراکل نیست. این بیانیه ای در مورد شایستگی من یا نحوه همسویی من در بازار کار نیست. من مجبور شدم افرادی را که می‌دانم بسیار"}, {"source": "Business Insider", "title": "KPMG is building a Silicon Valley-style incubator to help sidestep Big Four bureaucracy", "link": "https://www.businessinsider.com/kpmg-new-division-silicon-valley-ai-accelerate-innovation-big-four-2026-9", "summary": "KPMG wants to channel Silicon Valley in its new AI division. Bloomberg/Getty Images KPMG is forming a new division to bring Silicon Valley-like speed to some of its operations. The new Client Technology Innovation (CT I) group will serve as an incubator to boost innovation. KPMG is ready to \"go head-to-head\" with startups' disruptive spirit, the division's new boss told us. The Big Four consulting and accounting firms and Silicon Valley startups sit at opposite ends of the business spectrum. On one side are KPMG, Deloitte, PwC, and EY: century-old brands built on reputation, rigorous processes, and dependable, if unsexy, business services. On the other side are nimble and innovative startups that have made a virtue of moving fast and breaking things. In the age of AI, KPMG is trying to carve out more space for that Silicon Valley mentality. On Tuesday, it announced the formation of a new division, the Client Technology Innovation (CT I) group. The group will comprise several hundred staffers, and KPMG plans that it will operate separately from its three main business lines — audit, tax, and advisory. Its main remit is to accelerate innovation, both for client products and solutions and within the firm itself. It will look \"like a Silicon Valley incubator within the walls of KPMG,\" Todd Lohr, KPMG's vice chair and head of CT I, told Business Insider. The unit will bring together capabilities previously dispersed across the firm, including innovation, data and AI, product and platform development, commercial teams, and strategic partnerships with tech leaders such as OpenAI and Anthropic. Centralizing those capabilities will help KPMG move faster at a time when speed has become \"paramount\" to the firm, said Lohr. KPMG has roughly 276,000 employees globally and, like its fellow Big Four firms , is built on a structure that doesn't lend itself to speed. Rather than a small executive team calling the shots, the firms are topped by a partnership that typically votes on major changes. Underneath the partnership sit layers of consultants, accountants, and lawyers serving different industries and geographies. \"It's not that we hadn't focused on innovation,\" said Lohr. \"It's just we did it within the current course and speed of our business,\" where client service and the day job always come first. Have a tip or story to share about working in consulting? Contact this reporter via email at pthompson@businessinsider.com or Signal at Polly_Thompson.89. Use a personal e", "date_str": "2026-09-25T09:26:39+00:00", "hash": "74a0a25ecdf5cbd6", "title_fa": "KPMG در حال ساخت یک دستگاه جوجه کشی به سبک سیلیکون ولی برای کمک به دور زدن بوروکراسی چهار بزرگ است.", "summary_fa": "KPMG می‌خواهد Silicon Valley را در بخش هوش مصنوعی جدید خود هدایت کند. بلومبرگ/گتی ایماژ KPMG در حال تشکیل یک بخش جدید است تا سرعتی شبیه دره سیلیکون را به برخی از عملیات خود بیاورد. گروه جدید Client Technology Innovation (CT I) به عنوان یک انکوباتور برای تقویت نوآوری عمل خواهد کرد. رئیس جدید بخش به ما گفت که KPMG آماده است تا با روحیه مخرب استارت‌آپ‌ها رودررو شود. شرکت‌های مشاوره و حسابداری Big Four و استارت‌آپ‌های سیلیکون ولی در دو طرف طیف تجاری قرار دارند. در یک طرف KPMG، Deloitte، PwC و EY قرار دارند: برندهای قرن قدمتی که بر اساس شهرت، فرآیندهای دقیق، و خدمات تجاری قابل اعتماد، اگر غیرجنسی، ساخته شده اند. در طرف دیگر، استارت‌آپ‌های زیرک و نوآوری هستند که حرکت سریع و شکستن چیزها را به فضیلت تبدیل کرده‌اند. در عصر هوش مصنوعی، KPMG در تلاش است فضای بیشتری را برای ذهنیت دره سیلیکون ایجاد کند. روز سه شنبه، تشکیل یک بخش جدید، گروه نوآوری فناوری مشتری (CT I) را اعلام کرد. این گروه متشکل از صدها کارمند خواهد بود و KPMG قصد دارد به طور جداگانه از سه خط اصلی تجاری خود - حسابرسی، مالیات و مشاوره فعالیت کند. وظیفه اصلی آن تسریع نوآوری، هم برای محصولات و راه حل های مشتری و هم در خود شرکت است. تاد لور، معاون KPMG و رئیس CT I، به Business Insider گفت: این دستگاه مانند یک انکوباتور دره سیلیکون در دیوارهای KPMG به نظر می رسد. این واحد قابلیت هایی را که قبلاً در شرکت پراکنده شده بود، از جمله نوآوری، داده ها و هوش مصنوعی، توسعه محصول و پلت فرم، تیم های تجاری و مشارکت استراتژیک با رهبران فناوری مانند OpenAI و Anthropic را گرد هم می آورد. لوهر گفت، متمرکز کردن این قابلیت‌ها به KPMG کمک می‌کند در زمانی که سرعت برای شرکت \"مهمترین\""}, {"source": "Business Insider", "title": "3 reasons investors should be ready for the bond market sell-off to worsen", "link": "https://www.businessinsider.com/bond-market-sell-off-high-treasury-yields-interest-rates-fed-2026-9", "summary": "STAN HONDA/AFP via Getty Images Long-term bond yields will continue to surge, BNP Paribas warns. The bank predicts 30-year Treasury yields hitting 5.6% amid rate hikes and rising debt levels. 30-year Treasury yields touched their highest level since 2004 this week. Rising long-term bond yields are once again pestering stocks, and BNP Paribas says it's only going to get worse. In a client note published Tuesday, the bank said it sees yields on the 30-year Treasury bond rising to 5.6% in the months ahead. As of Thursday afternoon, yields sat at 5.43%, up from 4.83% at the start of the year. When yields rise, bond values fall. Higher long-term bond yields tend to weigh on stock performance as investors compare Treasurys' risk-free returns to long-term projected earnings yields. Yields have risen due to rising oil prices and associated inflation concerns, worries about ballooning government debt, and elevated borrowing demand from both the government and AI hyperscalers. BNP's call for rates to continue rising centers around rising debt concerns, and that three catalysts would soon inflame the market's misgivings, BNP said. First is the Federal Reserve's new rate-hike cycle. The central bank raised rates by 25 basis points in September , and is expected to hike possibly twice more in 2026, and again by April 2027. This will \"substantially\" boost the amount of interest the US government has to pay on what it borrows, BNP said, because the Treasury does most of its borrowing on the short end of the yield curve. \"If the Fed delivers the four hikes priced in by the market, the Treasury's interest burden will go up by USD116bn in the first year, and about USD168bn by year two,\" Guneet Dhingra, BNP's head of US rates strategy, wrote in the note. \"For context, a USD168bn increase in interest expense will erase all the incremental tariff revenues collected in 2025.\" Second , the government's budget deficit is beginning to widen again. This is due to tariff rollbacks and refunds, as well as rising long-term interest rates in recent months — creating a self-reinforcing feedback loop. Third , investors may be underestimating the government's fiscal spending appetite after the US midterm elections . With Democrats expected to take power back in the House of Representatives, or even the House and the Senate, BNP said that expectations may be for spending to decline given a lower level of collaboration between the executive branch and Congress. But that may not be the case.", "date_str": "2026-09-25T09:20:01+00:00", "hash": "9148a418cc669962", "title_fa": "3 دلیلی که سرمایه گذاران باید برای بدتر شدن فروش اوراق قرضه آماده باشند", "summary_fa": "STAN HONDA/AFP از طریق Getty Images، BNP Paribas هشدار داد که بازده اوراق قرضه بلندمدت به افزایش خود ادامه خواهد داد. این بانک پیش بینی می کند که بازدهی خزانه داری 30 ساله در بحبوحه افزایش نرخ بهره و افزایش سطح بدهی به 5.6 درصد برسد. بازدهی 30 ساله خزانه داری این هفته به بالاترین سطح خود از سال 2004 رسید. افزایش بازده اوراق قرضه بلندمدت بار دیگر سهام را آزار می دهد و BNP Paribas می گوید که این وضعیت بدتر خواهد شد. در یادداشت مشتری منتشر شده در روز سه شنبه، بانک اعلام کرد که بازده اوراق قرضه 30 ساله خزانه داری را در ماه های آینده به 5.6 درصد افزایش می دهد. از بعدازظهر پنجشنبه، بازدهی 5.43 درصد بود، نسبت به 4.83 درصد در ابتدای سال. هنگامی که بازده افزایش می یابد، ارزش اوراق قرضه کاهش می یابد. بازده اوراق بلندمدت بالاتر بر عملکرد سهام تاثیر می گذارد زیرا سرمایه گذاران بازده بدون ریسک خزانه داری را با بازده سود پیش بینی شده بلندمدت مقایسه می کنند. بازدهی به دلیل افزایش قیمت نفت و نگرانی‌های تورمی مرتبط، نگرانی در مورد بدهی دولت و افزایش تقاضای استقراض از سوی دولت و هیپرمقیاس‌گرهای هوش مصنوعی افزایش یافته است. BNP گفت که درخواست BNP برای ادامه افزایش نرخ ها حول نگرانی های فزاینده بدهی است و اینکه سه کاتالیزور به زودی تردید بازار را تشدید خواهد کرد. اول، چرخه جدید افزایش نرخ بهره فدرال رزرو است. بانک مرکزی در سپتامبر نرخ‌ها را 25 واحد افزایش داد و انتظار می‌رود که احتمالاً دو بار دیگر در سال 2026 و بار دیگر تا آوریل 2027 افزایش یابد. Guneet Dhingra، رئیس استراتژی نرخ بهره آمریکا در BNP در یادداشت نوشت: «اگر فدرال‌رزرو چهار افزایش قیمت‌شده توسط بازار را انجام دهد، بار سود خزانه‌داری در سال اول 116 میلیارد دلار و در سال دوم"}, {"source": "Business Insider", "title": "I started The Nitro Bar with $1,500 and wood from my basement. Here's how I grew it to a 7-figure business.", "link": "https://www.businessinsider.com/how-the-nitro-bar-grew-maxed-credit-card-five-locations-2026-9", "summary": "Audrey Finocchiaro at a Nitro Bar location. Audrey Finocchiaro Audrey Finocchiaro turned a coffee cart into The Nitro Bar, which will soon have five locations. The Nitro Bar's major growth was fueled by a $100,000 investment from a supportive local family. An engaging social media presence also helped The Nitro Bar grow, leading to more in-person business. This is an as-told-to essay based on a conversation with Audrey Finocchiaro, the 33-year-old cofounder of The Nitro Bar, based in Rhode Island. It has been edited for length and clarity. The summer I graduated from Marymount Manhattan College in 2016, I moved back home to Rhode Island and started working in restaurants with my boyfriend, Sam. I also took on a part-time job tracking a social-media account late at night. Sam and I had a limited budget and always talked about how restaurant jobs can come with unnecessary negative management. We always knew it was possible to run a business and be both kind and successful. Sick of being poorly treated in restaurants, we wanted to start something of our own. We kept our jobs, but in our off time, we decided to build a coffee cart. That coffee cart turned into The Nitro Bar, a coffee business that is soon expanding to five locations. We started with a maxed-out $1,500 credit card balance, made seven figures in revenue last year, and are on track to make eight figures this year. One of my first jobs was at a coffee shop When I moved to New York for school and experienced the coffee scene, it was hard to find coffee I liked when I came back to Rhode Island. My dad, Sam, and I sketched an idea on a piece of paper and used old wood I found in my basement to build a three-sided cart that folded down for transport in the back of my Subaru Outback. We threw on bicycle wheels, and it was barely functioning. We started selling coffee from the cart in 2017, using a maxed-out credit card to get us going. My uncle owned a diner, so he let us rent space and brew coffee there when the diner was closed, store it in the fridges, and bring it up to Providence. We taught ourselves a lot on YouTube and have learned so much as we've grown. We got a peddler's permit to bring the cart to the streets of Providence. We'd pick up Allie's Donuts on the way to sell alongside the coffee. Frequently, people would only get a doughnut, and we'd say, do you want anything else? In the beginning, the cart was super slow Finocchiaro and Sam. Courtesy of Audrey Finocchiaro One of us would preten", "date_str": "2026-09-25T09:05:01+00:00", "hash": "45cb7a9056008b02", "title_fa": "نوار نیترو را با 1500 دلار و چوب زیرزمینم شروع کردم. در اینجا آمده است که چگونه آن را به یک تجارت 7 رقمی تبدیل کردم.", "summary_fa": "آدری فینوکیارو در یک مکان نوار نیترو. آدری فینوکیارو آدری فینوکیارو یک سبد قهوه را به نوار نیترو تبدیل کرد که به زودی پنج مکان خواهد داشت. رشد عمده نوار نیترو بوسیله سرمایه گذاری 100000 دلاری از سوی یک خانواده محلی حامی انجام شد. حضور جذاب در رسانه های اجتماعی نیز به رشد نوار نیترو کمک کرد و منجر به کسب و کار حضوری بیشتر شد. این یک مقاله گفته شده بر اساس گفتگو با آدری فینوکیارو، بنیانگذار 33 ساله نوار نیترو، مستقر در رود آیلند است. برای طول و وضوح ویرایش شده است. تابستانی که در سال 2016 از کالج مریمونت منهتن فارغ التحصیل شدم، به خانه بازگشتم به رود آیلند و با دوست پسرم، سم، در رستوران ها شروع به کار کردم. من همچنین یک کار پاره وقت برای ردیابی یک حساب رسانه اجتماعی تا دیروقت شروع کردم. من و سام بودجه محدودی داشتیم و همیشه در مورد اینکه چگونه مشاغل رستوران با مدیریت منفی غیرضروری به وجود می آیند صحبت می کردیم. ما همیشه می دانستیم که می توان یک کسب و کار را اداره کرد و هم مهربان و هم موفق بود. از اینکه در رستوران‌ها بد رفتار می‌شدیم، می‌خواستیم کاری از خودمان شروع کنیم. ما شغلمان را حفظ کردیم، اما در زمان استراحت، تصمیم گرفتیم یک گاری قهوه بسازیم. آن سبد قهوه به نوار نیترو تبدیل شد، یک تجارت قهوه که به زودی به پنج مکان گسترش می یابد. ما با حداکثر موجودی کارت اعتباری 1500 دلاری شروع کردیم، در سال گذشته هفت رقم درآمد داشتیم و در مسیر رسیدن به هشت رقم در سال جاری هستیم. یکی از اولین کارهای من در یک کافی شاپ بود وقتی برای مدرسه به نیویورک رفتم و صحنه قهوه را تجربه کردم، وقتی به رود آیلند برگشتم پیدا کردن قهوه ای که دوست داشتم سخت بود. من و"}, {"source": "Business Insider", "title": "The head of one of the largest US endowments says OpenAI and Anthropic are in big trouble", "link": "https://www.businessinsider.com/wash-u-cio-says-openai-and-anthropic-are-in-trouble-2026-9", "summary": "OpenAI CEO Sam Altman this month in San Francisco. Benjamin Fanjoy/Getty Images Scott Wilson is the CIO of Washington University's endowment, who made a hugely profitable bet on SpaceX. Wilson is openly sharing what he admits is his \"unpopular opinion\" about frontier labs. Vinod Khosla, an early investor in OpenAI, told Business Insider he strongly disagrees with Wilson. Scott Wilson knows what it is like to make a contrarian bet that pays off big. His early investment in SpaceX helped create a multi-billion dollar windfall for Washington University's endowment. Now he's making another one: The trillion-dollar AI labs are in major trouble. Wilson argues that OpenAI and Anthropic have committed to enormous spending just as cheaper Chinese models are catching up. It's a view that puts him squarely at odds with AI bulls like Vinod Khosla, who believes those massive infrastructure investments are precisely what will make the frontier labs hard to beat. \"These trillion-dollar-plus frontier companies are not worth the liabilities that they signed up for,\" Wilson said. \"There's going to be a ton of free alternatives.\" OpenAI has returned huge markups for VC firms as well as schools such as the University of Michigan, whose early $20 million OpenAI investment is now worth over $2 billion. Wilson said he also had the chance to be an early investor in OpenAI but passed because he was not convinced the company would ever make money. Since then, his bearish view has hardened. \"When we looked at the original OpenAI deal that some of our peers participated in and made tons of money on paper, we were highly skeptical,\" Wilson said. \"I've gotten more skeptical over time.\" Wilson shared what he called his \"unpopular opinion\" onstage last week at Rock Yard Roundup, a Fort Worth gathering of roughly 100 asset managers, VCs, and tech founders. Between a honky-tonk crawl and a visit to the Stockyards Rodeo, he cast the frontier AI race as its own kind of Wild West: a frenzy of runaway spending and valuations that, in his view, is unlikely to end well. Wilson's warning comes as Chinese model makers such as DeepSeek, Alibaba's Qwen, Zhipu AI, and Tencent have narrowed the gap with U.S. frontier labs on performance while offering major cost savings. That has fueled a broader investor debate over whether OpenAI and Anthropic, which is expected to go public next month, can sustain the enormous spending required to stay ahead if customers can switch to cheaper alternatives that are ", "date_str": "2026-09-25T09:01:01+00:00", "hash": "7241ca3e9bce0494", "title_fa": "رئیس یکی از بزرگترین موقوفات ایالات متحده می گوید OpenAI و Anthropic با مشکل بزرگی روبرو هستند", "summary_fa": "سام آلتمن، مدیر عامل OpenAI این ماه در سانفرانسیسکو. بنجامین فانجوی/ گتی ایماژ اسکات ویلسون، مدیر ارشد فناوری سرمایه گذاری دانشگاه واشنگتن است که شرط بندی بسیار سودآوری را روی اسپیس ایکس انجام داد. ویلسون آشکارا آنچه را که اعتراف می کند «نظر نامطلوب» او در مورد آزمایشگاه های مرزی است به اشتراک می گذارد. Vinod Khosla، یک سرمایه‌گذار اولیه در OpenAI، به Business Insider گفت که به شدت با ویلسون مخالف است. اسکات ویلسون می‌داند که شرط‌بندی مخالفی که بازده زیادی دارد، چگونه است. سرمایه گذاری اولیه او در اسپیس ایکس به ایجاد یک درآمد بادآورده چند میلیارد دلاری برای موقوفه دانشگاه واشنگتن کمک کرد. اکنون او یکی دیگر را می سازد: آزمایشگاه های هوش مصنوعی تریلیون دلاری در مشکل بزرگی قرار دارند. ویلسون استدلال می‌کند که OpenAI و Anthropic متعهد به هزینه‌های هنگفتی هستند که مدل‌های ارزان‌تر چینی در حال افزایش هستند. این دیدگاهی است که او را کاملاً در تضاد با گاوهای AI مانند Vinod Khosla قرار می دهد، که معتقد است این سرمایه گذاری های عظیم زیرساختی دقیقا همان چیزی است که شکست دادن آزمایشگاه های مرزی را سخت می کند. ویلسون گفت: «این شرکت‌های مرزی بیش از تریلیون دلار ارزش بدهی‌هایی را ندارند که برای آنها ثبت‌نام کرده‌اند. \"جایگزین های رایگان زیادی وجود خواهد داشت.\" OpenAI نشانه گذاری های عظیمی را برای شرکت های VC و همچنین مدارسی مانند دانشگاه میشیگان که سرمایه گذاری اولیه 20 میلیون دلاری OpenAI آن اکنون بیش از 2 میلیارد دلار است، بازگردانده است. ویلسون گفت که او همچنین این شانس را داشت که یک سرمایه‌گذار اولیه در OpenAI باشد، اما قبول کرد زیرا متقاعد نشده بود که شرکت هرگز پولی به دست بیاورد. از آن زمان، دیدگاه نزولی او سخت تر شد. ویلسون گفت: «وقتی به معامله اولیه OpenAI که برخی از همتایان ما در آن شرکت کردند و"}, {"source": "Business Insider", "title": "OpenAI has a Mark Zuckerberg-shaped problem", "link": "https://www.businessinsider.com/meta-muse-rise-ai-poses-threat-to-chatgpt-dominance-2026-9", "summary": "Meta CEO Mark Zuckerberg. Bloomberg/Getty Images Muse's viral adoption is a threat to ChatGPT, long the face of consumer AI. Analysts expect OpenAI to respond with its own assistant offering. OpenAI has led in agentic AI, though it risks falling behind the simpler new offerings. OpenAI's ChatGPT is still the face of consumer AI. But it's no longer the hot new thing. Meta's Muse agent overtook ChatGPT on the free app charts this week, part of a new craze over personal AI assistants in Silicon Valley. Muse can browse, click, type, and chat across the internet, handling tasks you give it. Meta is adding Muse to its smart glasses and building a new Tamagotchi-esque gadget called Muse Charm , it announced at its Connect conference on Wednesday. The capabilities aren't new; ChatGPT can do many of the same things. At the same time, Muse's explosive growth is still a major headache for OpenAI CEO Sam Altman. Muse proves that an AI tool can handle work without relying on OpenAI's frontier models. It shows that Meta will pour huge amounts of money into keeping a ChatGPT competitor free. And it signals that OpenAI's longtime push into \"browser use\" — one of the capabilities that Muse rests on — isn't turning into a moat. OpenAI hasn't launched a direct answer to Muse, though it could easily do so at its DevDay conference on Tuesday. As early adopters suss out new AI assistant options, OpenAI risks getting left behind. There's Instinct , from a tiny startup run by a 23-year-old. There's SpaceXAI's Grok Bot and Google's Gemini Spark, with all the firepower of those giant companies. And then there's Muse, bolstered by Meta CEO Mark Zuckerberg 's aggressive growth tactics. The internet has begun rumbling about rumors of a competitor from OpenAI. And Thibault Sottiaux, an OpenAI product leader, teased a release. He replied to a post about agents, showing notifications from Muse, Instinct, and Grok Bot and saying \"it's enough,\" with a hand-wave emoji. \"Everyone is sort of circling around this,\" Techsponential analyst Avi Greengart told Business Insider. He said each assistant launch fits a general trend from the companies: they're \"all trying to arrive at a durable and monetizable way to use AI to, hopefully, improve people's lives.\" Meta's apps dominate for consumers OpenAI's chief rival has always been Anthropic, and all the while, OpenAI owned a major advantage: ChatGPT is way bigger than Claude. OpenAI's tool hit 1 billion weekly active users this year. Against Meta, t", "date_str": "2026-09-25T09:00:03+00:00", "hash": "a2eb5062e9ee6f01", "title_fa": "OpenAI مشکلی به شکل مارک زاکربرگ دارد", "summary_fa": "مارک زاکربرگ مدیر عامل متا. بلومبرگ/گتی ایمیجز پذیرش ویروسی Muse تهدیدی برای ChatGPT است که مدت ها چهره هوش مصنوعی مصرف کننده است. تحلیلگران انتظار دارند OpenAI با ارائه دستیار خود پاسخ دهد. OpenAI در هوش مصنوعی عامل پیشتاز است، اگرچه خطر عقب ماندن از ارائه‌های ساده‌تر جدید را دارد. ChatGPT OpenAI هنوز چهره هوش مصنوعی مصرف کننده است. اما این دیگر چیز جدید داغ نیست. عامل Meta's Muse در این هفته از ChatGPT در نمودار برنامه های رایگان پیشی گرفت، بخشی از شوق جدید دستیاران هوش مصنوعی شخصی در Silicon Valley. Muse می‌تواند در اینترنت مرور، کلیک، تایپ و چت کند و وظایفی را که شما به آن می‌دهید انجام دهد. متا در کنفرانس Connect خود در روز چهارشنبه اعلام کرد که Muse را به عینک هوشمند خود اضافه می کند و یک گجت جدید شبیه به Tamagotchi به نام Muse Charm می سازد. قابلیت ها جدید نیستند. ChatGPT می تواند بسیاری از کارهای مشابه را انجام دهد. در عین حال، رشد انفجاری Muse هنوز برای سم آلتمن، مدیر عامل OpenAI، دردسر بزرگی است. Muse ثابت می‌کند که یک ابزار هوش مصنوعی می‌تواند بدون تکیه بر مدل‌های مرزی OpenAI کار را انجام دهد. این نشان می دهد که متا مقدار زیادی پول برای رایگان نگه داشتن یک رقیب ChatGPT سرازیر خواهد کرد. و این نشان می دهد که تلاش طولانی مدت OpenAI برای \"استفاده از مرورگر\" - یکی از قابلیت هایی که Muse بر آن استوار است - به یک خندق تبدیل نمی شود. OpenAI پاسخ مستقیمی به Muse ارائه نکرده است، اگرچه می تواند به راحتی این کار را در کنفرانس DevDay خود در روز سه شنبه انجام دهد. از آنجایی که کاربران اولیه گزینه‌های دستیار هوش مصنوعی جدید را پیشنهاد می‌کنند، OpenAI در معرض خطر عقب ماندن است. Instinct وجود دارد، از یک استارتاپ کوچک که توسط"}, {"source": "Business Insider", "title": "Nvidia's historic stock boom is turning its golden handcuffs into a ticket out the door", "link": "https://www.businessinsider.com/nvidia-stock-boom-is-loosening-its-golden-handcuffs-2026-9", "summary": "Nvidia CEO Jensen Huang. Bloomberg/Getty Images Nvidia's stock boom has turned golden handcuffs into a potential exit ramp. Some longtime employees timed their departures around valuable stock vests. Others said age and the job's intensity shaped the decision to walk away. For some Nvidia employees, the golden handcuffs of the AI boom are coming loose. After nearly a decade at Nvidia working on chip design and AI models for biology, Ken Janik wanted to spend his time on something more personally meaningful. So the 56-year-old left the company in August to launch his own AI research outfit, Cairn Institute, where projects range from helping the visually impaired to studying humpback whale communication. Janik said that stock played a role in the timing of his departure, as he waited until after an especially valuable stock vest in June before leaving. He said his next vest in September wasn't significant. \"I don't need to work anymore,\" Janik said. \"Why wouldn't I try to do the best I can in the time I've got left?\" Tech giants use stock grants that vest over time as a strategy to retain employees. At Nvidia, this equity has exploded. Grants typically vest over four years, meaning some awarded in 2022 — before ChatGPT kicked off the AI boom that sent shares soaring — became incredibly valuable and have now fully vested. Nvidia shares have risen roughly 1,400% since the end of 2022. Grants awarded later, when Nvidia's share price
