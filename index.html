لال را مطرح کرد، در رای‌گیری حاضر نشد. گروه‌های حقوق بشری و گزارشگر ویژه سازمان ملل متحد در امور ایران هشدار داده‌اند مشکلات اقتصادی و اختلالات اجتماعی ناشی از جنگ‌های اخیر در ایران شرایط زندگی زنان و دختران این کشور را وخیم‌تر کرده است. در همین حال، لایحه‌ منع خشونت علیه زنان که از زمان ریاست جمهوری محمود احمدی نژاد مطرح است و هدف آن تقویت حمایت‌ها در برابر خشونت علیه زنان ایران بوده، همچنان بلاتکلیف مانده و دولت و مجلس یکدیگر را متهم می‌کنند که پیگیر سرنوشت آن نیستند. هم‌زمان با این رأی‌گیری، گزارش‌های منتشرشده از سوی نهادهای حقوق بشری از موارد متعددی از قتل زنان در ایران در هفته های اخیر حکایت دارد. این قتل‌ها در برخی موارد به مخالفت زنان با ازدواج اجباری، تلاش برای جدایی از همسر یا انتخاب شریک", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/f6b6/live/6fd8f920-e8f8-11f1-b8b0-a95064d74c5f.jpg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۴ آذر • ۲۱:۳۷"}, {"source": "IranWire", "title": "کوریره دلاسرا: کشتی ایرانی حامل تجهیزات الکترونیکی در لیبی هدف قرار گرفت", "link": "https://iranwire.com/fa/news-1/160761-%DA%A9%D9%88%D8%B1%DB%8C%D8%B1%D9%87-%D8%AF%D9%84%D8%A7%D8%B3%D8%B1%D8%A7-%DA%A9%D8%B4%D8%AA%DB%8C-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86%DB%8C-%D8%AD%D8%A7%D9%85%D9%84-%D8%AA%D8%AC%D9%87%DB%8C%D8%B2%D8%A7%D8%AA-%D8%A7%D9%84%DA%A9%D8%AA%D8%B1%D9%88%D9%86%DB%8C%DA%A9%DB%8C-%D8%AF%D8%B1-%D9%84%DB%8C%D8%A8%DB%8C-%D9%87%D8%AF%D9%81-%D9%82%D8%B1%D8%A7%D8%B1-%DA%AF%D8%B1%D9%81%D8%AA/", "summary": "روزنامه ایتالیایی کوریره دلاسرا، روز چهارشنبه ۴ آذر ۱۴۰۵، گزارش داد یک کشتی باری ایرانی حامل تجهیزات و قطعات پهپادی پس از عبور از محاصره ...", "date_str": "2026-11-25T17:54:15+00:00", "hash": "95641e92fac61773", "title_fa": "کوریره دلاسرا: کشتی ایرانی حامل تجهیزات الکترونیکی در لیبی هدف قرار گرفت", "summary_fa": "روزنامه ایتالیایی کوریره دلاسرا، روز چهارشنبه ۴ آذر ۱۴۰۵، گزارش داد یک کشتی باری ایرانی حامل تجهیزات و قطعات پهپادی پس از عبور از محاصره ... این کشتی با نام «الوان» (ALVAN) حامل تجهیزات الکترونیکی از چین و هند برای پهپادهای نظامی نیروهای حفتر بود. این کشتی ۱۶۸ متری، با خاموش کردن سامانه‌های ردیابی خود، از تنگه هرمز عبور کرده و به لیبی رسیده بود. کوریره دلاسرا گزارش داد تصاویر ماهواره‌ای نشان می‌دهد کشتی پس از حمله به‌شدت آسیب دیده، اما غرق نشده و خدمه آن تلاش کرده‌اند در نزدیکی بنغازی پهلو بگیرند. این کشتی که از سال ۲۰۲۰ تحت تحریم آمریکا قرار دارد، ۲۰ نوامبر در خلیج عمان شناسایی شده بود، اما پس از ناپدید شدن از سامانه‌های ردیابی، با نام دیگری، «احمدی»، در نزدیکی بنغازی ظاهر شد. شرکت ایتالیایی پلانتک که تصاویر ماهواره‌ای را بررسی کرده، هویت این کشتی را تایید کرده است. هیچ گروهی تاکنون مسوولیت حمله به کشتی ایرانی را برعهده نگرفته است، اما این روزنامه ایتالیایی احتمال داده نیروهای اوکراینی در حمله دست داشته و این عملیات در راستای منافع واشنگتن انجام شده باشد. کوریره دلا سرا این حمله را «عملیات اوکراینی در خدمت آمریکایی‌ها» توصیف کرده است. این حمله در ادامه عملیات نیروهای اوکراینی علیه دو کشتی روسی در بندر بنغازی انجام شد. ولودیمیر زلنسکی، رییس‌جمهوری اوکراین، دوشنبه مسوولیت حمله به کشتی‌های روسی را برعهده گرفت، اما درباره کشتی ایرانی هنوز هیچ طرفی مسوولیت حمله را اعلام نکرده است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/8_QhMH__v1024x512__box_0%2C0%2C1199%2C631.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۴ آذر • ۲۱:۲۴"}, {"source": "Radio Farda", "title": "احتمال اِعمال تعرفه‌های تازه از سوی آمریکا با واکنش منفی چین و بازار سهام مواجه شد", "link": "https://www.radiofarda.com/a/trump-unveils-new-tariffs-to-fight-excess-factory-capacity-undeterred-by-midterms-defeat/33905841.html", "summary": "نمایندۀ تجاری آمریکا مجموعه‌ای از تعرفه‌های تازه را برای واردات از کشورهای مختلف از جمله، چین، برزیل و اتحادیه اروپا اعلام کرد. موضوعی که با واکنش منفی پکن و بازار سهام روبرو شد.", "date_str": "2026-11-25T17:44:44+00:00", "hash": "09795b4c27879f89", "title_fa": "احتمال اِعمال تعرفه‌های تازه از سوی آمریکا با واکنش منفی چین و بازار سهام مواجه شد", "summary_fa": "نمایندۀ تجاری آمریکا مجموعه‌ای از تعرفه‌های تازه را برای واردات از کشورهای مختلف از جمله، چین، برزیل و اتحادیه اروپا اعلام کرد. موضوعی که با واکنش منفی پکن و بازار سهام روبرو شد. رئیس‌جمهور آمریکا، روز چهارشنبه چهارم آذرماه تعرفه‌های جدیدی را علیه ۱۴ شریک تجاری اصلی این کشور، از جمله چین، ژاپن و اتحادیه اروپا وضع کرد. دولت دونالد ترامپ سقف جدید نرخ‌های تعرفه را ۲۰ تا ۴۰ درصد پیشنهاد داد، اما تأکید کرد که این تعرفه‌ها در سطوح پایین‌تری که در مذاکرات تجاری قبلی مورد توافق قرار گرفته یا در آستانۀ توافق هستند، محدود خواهند شد. در تحولی دیگر، نمایندۀ تجاری ایالات متحده پیشنهاد اعمال تعرفه ۱۰ درصدی جدید بر واردات هواپیماهای امبرائر ساخت برزیل و همینطور افزایش عوارض بر واردات مازاد شکر از این کشور را به عنوان بخشی از تلاش برای وادار کردن برازیلیا به اصلاح رویه‌های تجاری «ناعادلانه» ارائه کرد. این محصولات قبلاً از تعرفه‌های ۲۵ درصدی ترامپ بر محصولات برزیلی که در ماه ژوئیه، تیرماه، اِعمال شده بود، معاف بودند. یک مقام آمریکایی تأکید کرد که با وجود مذاکرات، هنوز «اختلافات قابل توجهی» بین دو طرف وجود دارد. بر اساس تصمیم‌ تازه، چین با سقف نرخ تعرفۀ ۲۰ درصدی مواجه خواهد شد که به عوارض تقریباً ۲۵ درصدی اعمال شده در دوره اول ریاست جمهوری ترامپ اضافه می‌شود. این نرخ با توافق تجاری ایالات متحده و چین که در ۱۰ ژانویه، ۲۰ دی‌ماه، منقضی می‌شود، مطابقت دارد. اما اگر این توافق موقف تمدید نشود، نرخ تعرفه چین به ۴۰ درصد افزایش خواهد یافت. ویتنام هم در صورت دستیابی به توافق تجاری با واشینگتن با سقف نرخ تعرفۀ ۲۰ درصدی مواجه خواهد شد و در صورت شکست مذاکرات، خود را با تعرفۀ ۳۵ درصدی روبه‌رو خواهد دید. آمریکا با اشاره به «ممنوعیت کار اجباری»، بر ۶۰ شریک تجاری تعرفه وضع کرد به گفتۀ جیمیسون گری‌یِر،", "image_url": "https://gdb.rferl.org/fabd8c40-b787-4fbb-ba24-2313da029700_w1200_h630.jpg", "category": "استارتاپ و سرمایه‌گذاری", "tags": ["بورس و طلا", "روابط بین‌الملل"], "datetime_fa": "۴ آذر • ۲۱:۱۴"}, {"source": "Euronews Persian", "title": "اصابت پرتابه حوثی‌ها به بندر جازان عربستان؛ ائتلاف ب  است.", "date_str": "2026-11-25T16:23:45+00:00", "hash": "6230b6066e8d7552", "title_fa": "«توقف» حکم اعدام میلاد آرمون و نوید نجاران؛ قوه قضائیه: حکم لغو نشده است", "summary_fa": "قوه قضائیه ایران می‌گوید حکم اعدام نوید نجاران و میلاد آرمون لغو نشده است. پیشتر، محمدحسین آقاسی، وکیل میلاد آرمون هم نوشته بود که حکم او و نوید نجاران دیگر متهم پرونده متوقف شده است. میلاد آرمون و نوید نجاران از متهمان پرونده قتل آرمان علی‌وردی، طلبه بسیجی در اعتراضات سراسری ۱۴۰۱ هستند. این پرونده که چهار متهم دیگر نیز دارد به پرونده «اکباتان» معروف شده است. مهدی محمودیان، فعال سیاسی، در شبکه اجتماعی ایکس ابلاغیه اجرای احکام را منتشر کرده بود که زمان اجرای حکم میلاد آرمون در زندان قزل‌حصار سپیده‌دم چهارشنبه چهارم آذر اعلام شده بود. اما شامگاه سه‌شنبه سوم آذر محمدحسین آقاسی، وکیل میلاد آرمون، در شبکه ایکس نوشت که تنها چند ساعت پیش از اعدام موکلش تلفنی به او خبر داده‌اند که اجرای این حکم فعلا متوقف شده اما تاکید کرد که حکم اعدام موکلش تغییری نکرده است. آقای آقاسی می‌گوید خبر توقف اجرای حکم را به خانواده آقای آرمون اطلاع داده است. دادبان هم به نقل از یک منبع آگاه نوشت که نوید نجاران نیز در تماس با خانواده‌اش خبر داده که به بند عمومی زندان قزل‌حصار بازگشته است. پس از آن، دستگاه قضائی ایران با انتشار بیانیه‌ای نوشت «از ساعاتی پیش برخی رسانه‌ها و فعالین فضای مجازی با طرح شایعاتی مدعی شده‌اند حکم قطعی صادر شده از دادگاه انقلاب در مورد دو تن از محکومان پرونده لغو شده که بدین وسیله تکذیب می‌گردد.» در این بیانیه آمده است که «حکم قطعی هیچ یک از عوامل اصلی دخیل در شکنجه و شهادت شهید علی‌وردی لغو نشده و حکم دادگاه که طی تشریفات قانونی هم داشته به قوت خود باقی است.» گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. در چند روز گذشته رسانه‌های حقوق بشری گفته بودند که به وکلای میلاد آرمون و نوید نجاران اطلاع", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/ec2d/live/8c3f6e60-e8e8-11f1-8808-1d4222955d7e.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۴ آذر • ۱۹:۵۳"}, {"source": "Radio Farda", "title": شترک با دو فضانورد چینی وارد ایستگاه فضایی تیان‌گونگ شد. او همچنین اولین فضانورد غیر چینی است که وارد این ایستگاه می‌شود", "date_str": "2026-11-25T14:42:40+00:00", "hash": "ba113ac1c2956695", "title_fa": "نخستین فضانورد پاکستان با ورود به ایستگاه فضایی چین تاریخ‌ساز شد", "summary_fa": "محمد ذیشان علی به‌عنوان نخستین فضانورد پاکستان در مأموریتی مشترک با دو فضانورد چینی وارد ایستگاه فضایی تیان‌گونگ شد. او همچنین اولین فضانورد غیر چینی است که وارد این ایستگاه می‌شود محمد ذیشان علی، نخستین فضانورد پاکستان، روز چهارشنبه چهارم آذرماه، به نخستین فضانورد غیر چینی تبدیل شد که وارد ایستگاه فضایی «تیانگونگ» چین شده است؛ رویدادی که نه‌تنها لحظه‌ای تاریخی برای بلندپروازی‌های علمی پاکستان را رقم زد، بلکه نشانه‌ای از تلاش‌های پکن برای گسترش دیپلماسی فضایی‌اش هم به‌شمار می‌آید. این خلبان ۴۰ ساله که نخستین پاکستانیِ حاضر در مدار زمین است، به عنوان «متخصص محموله» فعالیت می‌کند و قرار است بین پنج تا ۱۰ روز در این ایستگاه اقامت داشته باشد. خدمۀ سه نفرۀ مأموریت فضایی «شنژو-۲۴»، حدود شش ساعت پس از پرتاب از «مرکز پرتاب ماهواره جیوچوان» در شمال غربی چین، با استفاده از موشک «لانگ مارچ-۲ اف»، در ساعت ۱۴:۳۵ به وقت محلی، مطابق با ۱۰:۰۵ به وقت تهران، وارد ایستگاه تیانگونگ شدند. اعضای جدید، شامل فرمانده چینی «تانگ هونگ‌بو» و مهندس پرواز «وو یی» به همراه محمد ذیشان علی با استقبال گرم سه فضانورد مأموریت «شنژو-۲۳» که از قبل در ایستگاه مستقر بودند، روبه‌رو شدند. محمد ذیشان علی برای آمادگی جهت این پرواز، هفت ماه در پکن تحت آموزش بود. او در این مدت در کلاس‌های فشرده زبان چینی شرکت و حتی روی فرهنگ عمومی چین هم مطالعه کرد؛ موضوعی که به‌گفتۀ خودش، گرچه بزرگترین چالش این دورۀ آموزشی بوده، اما برای ارتباط فعال با فضانوردان چینی و مرکز کنترل زمینیِ ایستگاه، ضروری است. ذیشان علی در طول حضورش در ایستگاه فضایی چین، در انجام آزمایش‌هایی هم مشارکت خواهد کرد؛ از جمله آزمایشی که بررسی می‌کند چگونه کامپوزیت‌های فیبر کربنیِ «خودترمیم‌شونده» می‌توانند ترک‌های کوچک در بدنه فضاپیما را به‌طور خودکار ترمیم کنند.", "image_url": "https://gdb.rferl.org/b5be94fc-2564-4f35-95fe-f061c0c2e289_cx0_cy3_cw0_w1200_h630.jpg", "categ s Black Friday Sale is live now with up to 30% off almost everything. That includes select Easy Totes, System Totes, satchels, and leather accessories, though the discount varies by style and color. When does Cuyana's Black Friday sale end? The Cuyana Black Friday Sale ends Sunday, November 29 at 11:59 p.m. PST. Do you need a promo code? No code is needed.", "date_str": "2026-11-25T18:53:25+00:00", "hash": "cd56ee75f4cf6006", "title_fa": "فروش جمعه سیاه Cuyana تا 30٪ تخفیف برای برخی از کیف های مورد علاقه ما در تمام دوران ها دارد", "summary_fa": "کیف مورد علاقه ما تا به حال، زیپ زیپ ایزی کویانا، یک کیف چرمی شیک و جادار است که ما سال‌ها از آن استفاده کرده‌ایم و بدون اینکه فلاپی به نظر برسند، حجم قابل توجهی را در خود نگه می‌دارد - اکنون با زیپ ایمن بسته می‌شود.", "image_url": "https://i.insider.com/6b07119f0b69407d788a6909?width=1200&format=jpeg", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آذر • ۲۲:۲۳"}, {"source": "Business Insider", "title": "8 ways to be a good houseguest, according to etiquette experts", "link": "https://www.businessinsider.com/how-to-be-good-guest-in-someones-home-etiquette-experts-2026-11", "summary": "Business Insider asked etiquette experts to share some ways to be a good houseguest. fizkes/Shutterstock Business insider asked etiquette experts about how to be a good guest in someone's home. The pros said tidying up the kitchen and your sleeping space are non-negotiables. Cooking, buying groceries, and giving a gift to your host are kind gestures of gratitude. Whether you're visiting for a night or planning an extended stay for the holidays, someone else's home is not the place to disregard manners. That's why Business Insider asked two etiquette experts for their best advice on being a great houseguest. Here's what they said. Make sure the host is aware of your expected arrival time. wichayada suwanachun/Shutterstock Pamela Eyring, owner of The Protocol School of Washington , told BI that being a great guest in someone's home starts with clear communication. \"Be clear and prompt about your arrival time and quickly communicate an updated schedule if you are running late,\" Eyring told BI. Your host is likely preparing for your arrival — cleaning, cooking, or adjusting their schedule. Keeping them informed on when they can expect you helps prevent stress and shows you value their hospitality. Show gratitude by bringing a gift for your host. BearFotos/Shutterstock Additionally, Eyring said it's always a nice gesture to bring a gift for your host. If you're not sure what they like, she suggests choosing something that appeals to all, like flowers, sweets, or a meal. Be mindful of the tone you set for the visit. Pixel-Shot/Shutterstock It's no secret that travel doesn't always go as planned. But according to business etiquette expert and leadership consultant Sheree Bryant Sekou , bringing a negative attitude and energy to your host's home can impact the duration of your stay. \"How you start a trip can affect how it ends, so to the best of your ability, shake off any bad vibes so you can be a fully present, enjoyable, and happy guest,\" she told BI. Come prepared with your own toiletries and anything else you need to feel comfortable. New Africa/Shutterstock When staying in someone else's home, Sekou said it's polite to come prepared with your own toiletries, personal hygiene products, and anything else you need to feel comfortable during your stay. This way, the host doesn't feel like they have to provide everything for you. For example, if you're particular about your sleep setup, Eyring suggests bringing your own pillow. If you're a light sleeper, bringing", "date_str": "2026-11-25T18:40:36+00:00", "hash": "3e4856ff9cd467aa", "title_fa": "به گفته کارشناسان آداب معاشرت 8 راه برای اینکه مهمان خانه خوبی باشید", "summary_fa": "Business Insider از کارشناسان آداب معاشرت خواست تا راه هایی را برای مهمان خانه خوب بودن به اشتراک بگذارند. fizkes/Shutterstock یکی از منابع داخلی کسب rt. Brett Comer/Houston Chronicle/Getty Images If your oven is full on Thanksgiving or simply out of commission, oven-free recipes can help. Salads, slow-cooker recipes, and pasta are all beloved dishes that don't require an oven. These 15 Thanksgiving dishes are completely oven-free. Whether your oven is crammed full of turkey or it's woefully small, sometimes baking and roasting aren't options on Thanksgiving. This week, people across the country will be making multiple dishes for Thanksgiving dinner , using every available cooking surface and spending an average of 9.6 hours preparing for their guests, according to WalletHub data . Thankfully, there are plenty of Thanksgiving staples or updated versions of the classics that don't require any oven space at all. Even the precious turkey can stay out of that fateful appliance on November 26. Here are the easiest foods you can whip up this Thanksgiving — no oven required. If you want to use your oven for other dishes, you could use a deep fryer for your turkey. Eric Thayer/Reuters Deep-frying a turkey is serious business, one that can end in a fiery disaster, as evidenced in annual police videos . Business Insider previously showed the best way to fry a turkey safely. You could also use a slow cooker for the turkey, freeing up oven space. Slow cooker. O2O Creative/Getty Images Kendra Bailey Morris, author of \"The Southern Slow Cooker,\" previously told Business Insider that a whole turkey likely won't fit in a slow cooker, but a 3- or 4-pound turkey breast can. \"The beauty of the slow cooker is that it is inherently self-basting,\" she said. \"Slow cookers create a very moist environment with the condensation from the cooking process often rising to the top of the slow cooker and then dripping back down onto the meat, which helps to keep things moist.\" She also suggested injecting some fat, such as a herb butter, back into the turkey breast, since the meat is lean. If your oven is full, you can leave soup simmering on the stove or in a slow cooker. Pumpkin soup. Cris Cantón/Getty Images As part of Business Insider's ongoing taste-test series, we've tried the best canned chicken noodle soups , which could be part of a Thanksgiving spread, especially on a budget. Soups or stews that use a slow cooker could be another option for a cold day. Business Insider's food reporter Erin McDowell recommends these three slow-cooker recipes from Martha Stewart . Mashed potatoes can b", "date_str": "2026-11-25T18:26:01+00:00", "hash": "59d611b11af7ef30", "title_fa": "15 غذای شکرگزاری که نیازی به فر ندارند", "summary_fa": "سرخ کردن بوقلمون برای افراد ضعیف نیست. Brett Comer/Houston Chronicle/Getty Images اگر فر شما در روز شکرگزاری پر است یا به سادگی از کار افتاده است، دستور العمل های بدون فر می توانند به شما کمک کنند. سالاد، دستور پخت آهسته پز و پاستا همه غذاهای دوست داشتنی هستند که نیازی به فر ندارند. این 15 غذای شکرگزاری کاملاً بدون فر هستند. خواه اجاق شما پر از بوقلمون باشد یا به طرز غم انگیزی کوچک، گاهی اوقات پخت و کباب کردن گزینه هایی در روز شکرگزاری نیستند. طبق داده‌های WalletHub، این هفته، مردم در سراسر کشور چندین غذا را برای شام شکرگزاری درست می‌کنند، از هر سطح آشپزی در دسترس استفاده می‌کنند و به طور متوسط ​​9.6 ساعت برای آماده‌سازی مهمانان خود وقت صرف می‌کنند. خوشبختانه، تعداد زیادی لوازم اصلی جشن شکرگزاری یا نسخه های به روز شده کلاسیک وجود دارد که اصلاً به فضای فر نیاز ندارند. حتی بوقلمون گرانبها می تواند در 26 نوامبر از آن وسیله سرنوشت ساز دور بماند. در اینجا ساده ترین غذاهایی است که می توانید در این روز شکرگزاری درست کنید - بدون نیاز به فر. اگر می خواهید از فر خود برای غذاهای دیگر استفاده کنید، می توانید از سرخ کن برای بوقلمون خود استفاده کنید. اریک تایر/ رویترز سرخ کردن بوقلمون کاری جدی است، کاری که می تواند به یک فاجعه آتشین ختم شود، همانطور که در ویدئوهای سالانه پلیس نشان می دهد. Business Insider قبلا بهترین روش برای سرخ کردن ایمن بوقلمون را نشان داده بود. همچنین می توانید از آرام پز برای بوقلمون استفاده کنید و فضای فر را آزاد کنید. آرام پز. O2O Creative/Getty Images کندرا بیلی nk": "https://arstechnica.com/information-technology/2026/11/backblaze-explains-why-its-sharing-customer-information-with-advertisers/", "summary": "Some customers have raised concerns about Backblaze's privacy policy taking effect next month, which says the backup and cloud storage company may sell certain personal information to advertisers. Backblaze’s current privacy policy says that in addition to the personal information that users may provide, such as their email address when creating an account, it may also “automatically” collect information, such as “your software, the operating system you use when accessing our service, your Internet Protocol address, and the date and time of each request you make to Backblaze.” The current policy adds: “Under no circumstances do we rent, trade, or share your address or e-mail address with any other company for their marketing purposes without your consent.” It also makes no mention of advertisers. Read full article Comments", "date_str": "2026-11-25T18:38:29+00:00", "hash": "8256c454c43c1bd2", "title_fa": "Backblaze توضیح می دهد که چرا اطلاعات مشتری را با تبلیغ کنندگان به اشتراک می گذارد", "summary_fa": "سیاست فعلی می‌افزاید: «ما تحت هیچ شرایطی بدون رضایت شما آدرس یا آدرس ایمیل شما را برای اهداف بازاریابی آن‌ها اجاره نمی‌دهیم، معامله نمی‌کنیم یا به اشتراک نمی‌گذاریم.» همچنین هیچ اشاره ای به تبلیغ کنندگان نمی کند. این موضوع باعث نگرانی برخی از کاربران شده است، اما سخنگوی Backblaze به Ars Technica گفت: «Backblaze داده‌های حسی یا نظارتی مانند ضبط تماس‌ها را برای تبلیغات هدفمند نمی‌فروشد یا به اشتراک نمی‌گذارد و ما آن را به شرکای تبلیغاتی یا بازاریابی فاش نمی‌کنیم.» آنها افزودند: به‌طور قابل‌توجهی، هیچ \"اطلاعات شخصی حساس\" مانند شماره تامین اجتماعی، شماره کارت اعتباری، یا \"موقعیت جغرافیایی دقیق\" با تبلیغ‌کنندگان به اشتراک گذاشته نمی‌شود. با این حال، شناسه‌ها، اطلاعات تجاری، «اینترنت یا سایر فعالیت‌های شبکه مشابه» و «داده‌های موقعیت جغرافیایی» ممکن است «برای تبلیغات هدفمند فروخته یا به اشتراک گذاشته شوند» این به این دلیل ا یمت بسته‌های اینترنت ثابت شرکت مخابرات ایران و اعتراض کاربران به تعرفه‌های جدید، کارزاری با هدف تجدیدنظر در قیمت‌گذاری خدمات این شرکت راه‌اندازی شده است. تعداد امضاهای این کارزار تاکنون به ۱۵ هزار رسیده است. امضاکنندگان کارزار « اعتراض به گرانی سه برابری اینترنت مخابرات » در نامه‌ای خطاب به وزیر ارتباطات و فناوری اطلاعات، رئیس سازمان تنظیم مقررات و ارتباطات رادیویی و مدیرعامل شرکت مخابرات ایران، نسبت به آنچه افزایش ناگهانی و سه‌برابری هزینه اینترنت خوانده‌اند، اعتراض کرده و خواستار بررسی فوری تعرفه‌های جدید شده‌اند. چرا اینترنت مخابرات سه برابر گران شد؟ پاسخ مخابرات به اعتراض کاربران درباره افزایش ناگهانی تعرفه‌ها مطالعه &#x27;8 مشترکان معترض معتقدند افزایش هزینه دسترسی به اینترنت در شرایطی که خانوارهای ایرانی با فشارهای اقتصادی مواجه‌اند، بار مالی مضاعفی به آن‌ها تحمیل می‌کند؛ به‌ویژه آن که به گفته آنان، کیفیت و سرعت خدمات متناسب با افزایش قیمت بهبود نیافته است. در بخشی از متن این کارزار آمده است: اینترنت امروز دیگر یک کالای لوکس نیست؛ بلکه یکی از نیازهای اساسی زندگی، آموزش، اشتغال و کسب‌وکار مردم محسوب می‌شود. - بخشی از متن کارزار «اعتراض به گرانی سه برابری اینترنت مخابرات» امضاکنندگان با اشاره به وابستگی دانش‌آموزان، دانشجویان، کارمندان، فریلنسرها و صاحبان کسب‌وکارهای اینترنتی به خدمات ارتباطی، این پرسش را مطرح کرده‌اند که چگونه می‌توان از مردم انتظار داشت هزینه‌ای تا سه برابر گذشته برای اینترنت پرداخت کنند، درحالی‌که درآمد بسیاری از آن‌ها متناسب با این افزایش رشد نکرده است. کپی لینک پنج مطالبه مشترکان معترض از وزارت ارتباطات و مخابرات کیفیت خدمات اینترنتی از دیگر محورهای اعتراض امضاکنندگان این کارزار است. مشترکان می‌گویند همچنان با مشکلاتی مانند افت سرعت، قطعی‌های مکرر و کیفیت نامناسب خدمات مواجه‌اند و افزایش چشمگیر", "image_url": "https://api2.zoomit.ir/media/internet-price-increase-telecom-6b06f0031f4c677d1df5a181?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آذر • ۲۲:۰۰"}, {"source": "Zoomit", "title": "کشف چوب ۴۳۰۰ ساله در آرارات؛ معمای کشتی نوح دوباره خبرساز شد", "link": "https://www.zoomit.ir/human-science/471 =1200", "category": "هوش مصنوعی مولد", "tags": ["تراشه"], "datetime_fa": "۴ آذر • ۲۱:۳۰"}, {"source": "Business Insider", "title": "I went to Miss Universe for the first time and found a fandom that won't quit, no matter the number of scandals", "link": "https://www.businessinsider.com/miss-universe-pageant-first-experience-2026-11", "summary": "Contestants at the Miss Universe 2026 pageant in San Juan, Puerto Rico, on Tuesday. Jaydee Lee/Getty Images After covering pageants since 2019, I finally went to my first Miss Universe pageant. I wanted to see what the atmosphere would be like after last year's scandal-plagued pageant. The fans — who lined up every morning and night to see the pageant queens — are as loyal as ever. It was just after midnight when the pain of my 4.5-inch high heels had become too much to bear. I was standing alongside hundreds of fans who had lined up just to catch a glimpse of the 116 women competing for the title of Miss Universe 2026 . Two hours had passed without a beauty queen in sight. I stole a glance at the shoes of the pageant bloggers next to me. Flat, sensible, arch support — these were veterans. The Miss Universe pageant has been consumed with controversy over the last few years, but its fandom's fierce devotion was still on full display in San Juan, Puerto Rico, where the 75th annual competition took place this month. I spoke to dozens of people while attending the pageant's three main competitions and found that many were unfazed by its scandals. And after the new winner made history by becoming the first mother to take the crown , it seems the organization is hoping to move on as well. Here's what my very first Miss Universe pageant was like. My Miss Universe journey began at the organization s official museum. Anneta Konstantinides/Business Insider After dropping my bags off following a red-eye flight, I dragged myself to Plaza Las Américas to pick up my press pass and check out the official Miss Universe Experience Museum. The museum wasn't in the mall's directory, and there weren't any signs advertising it. The shopkeepers I asked for help had no idea what I was talking about! After nearly an hour of searching — did I mention this is the largest mall in the Caribbean? — I finally found the pop-up museum. Standing at the entrance was the dress Fátima Bosch wore when she won Miss Universe 2025 after a scandal-plagued competition that included a viral shouting match, multiple judges dropping out, and rigging allegations. I was almost surprised the museum would want to remind people of last year's pageant. But after a few days in Puerto Rico, it was clear that Miss Universe's biggest fans were happy to forget about it. Then it was time for the national costume competition, my first Miss Universe event. I was shocked to see so many empty seats. Anneta Konstanti", "date_str": "2026-11-25T18:04:06+00:00", "hash": "9727724336178e8b", "title_fa": "من برای اولین بار به Miss Universe رفتم و یک طرفدار پیدا کردم که صرف نظر از تعداد رسوایی ها، دست از کار نمی کشد.", "summary_fa": "شرکت کنندگان در مسابقه Miss Universe 2026 در سن خوان، پورتوریکو، روز سه شنبه. Jaydee Lee/Getty Images پس از پوشش مسابقات از سال 2019، سرانجام به اولین مسابقه Miss Universe رفتم. می خواستم ببینم بعد از مراسم رسوایی سال گذشته چه جوی خواهد بود. هواداران - که هر روز صبح و شب برای دیدن ملکه های مسابقه صف می کردند - مثل همیشه وفادار هستند. درست بعد از نیمه شب بود که درد کفش های پاشنه بلند 4.5 اینچی من بیش از حد قابل تحمل شده بود. من در کنار صدها طرفدار ایستاده بودم که فقط برای تماشای نگاهی اجمالی به 116 زن که برای عنوان Miss Universe 2026 رقابت می کردند، صف کشیده بودند. دو ساعت بدون ملکه زیبایی می گذشت. نگاهی به کفش های وبلاگ نویسان مجلل کنارم انداختم. پشتیبان صاف، معقول و قوس دار - اینها کهنه سرباز بودند. مسابقه Miss Universe در چند سال گذشته با بحث و جدل همراه بوده است، اما ارادت شدید طرفداران آن هنوز در سن خوان، پورتوریکو، جایی که هفتاد و پنجمین مسابقه سالانه در این ماه برگزار شد، به نمایش گذاشته شد. من در حین شرکت در سه مسابقه اصلی مسابقه با ده ها نفر صحبت کردم و متوجه شدم که بسیاری از رسوایی های آن نگران نشده اند. و پس از اینکه برنده جدید با تبدیل شدن به اولین مادری که تاج را به دست می‌آورد تاریخ ساز شد، به نظر می‌رسد که سازمان نیز امیدوار است به کار خود ادامه دهد. اولین مسابقه دوشیزه من در اینجا چگونه بود. سفر Miss Universe من در موزه رسمی سازمان آغاز شد. Anneta Konstantinides/Business Insider پس از اینکه چمدان هایم را به دنبال یک پرواز با چشم قرمز انداختم، خودم را به Plaza Las Américas کشاندم تا کارت مطبوعاتی ام را بگیرم و موزه رسمی Miss Universe Experience را بررسی کنم.", "image_url": "https://i.insider.com/6b07055bd6c5d341c9b4d2fd?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آذر • ۲۱:۳۴"}, {"source": "Business Insider", "title": "Peter Thiel bought a historic Bel Air mansion at auction for nearly $100 million less than its original asking price. See inside.", "link": "https://www.businessinsider.com/casa-encantada-bel-air-mansion-owner-karen-winnick-cut-price-2024-11", "summary": "The mansion, nicknamed Casa Encantada, has 60 rooms over 40,000 square feet and overlooks the golf course at the Bel-Air Country Club. Nils Timm Peter Thiel bought the historic Bel Air mansion Casa Encantada at auction for a steep discount. Casa Encantada traded for record-breaking numbers multiple times to magnates like Conrad Hilton. The 40,000-square-foot home is now a part of Peter Thiel's intercontinental real estate portfolio. Billionaire Peter Thiel snapped up a 40,000-square-foot mansion in Bel Air for a steep discount at an auction, but he still paid nine figures for it. Casa Encantada, a mansion once owned by Hilton Hotels magnate Conrad Hilton, has been on the market since 2019; it first debuted with a hefty asking price of $225 million. At that price, it would have been one of the most expensive properties sold in the US — a record currently held by Ken Griffin . The home had suitors like Jeff Bezos , who ultimately bought a place elsewhere . The home's asking price has fluctuated over the years, reaching as high as $250 million in 2023, but the final ask was $170 million in April, according to the property's listing history. The former owner of the home was Karen Winnick, the widow of Gary Winnick, a financier who founded the telecommunications company Global Crossing and died in 2023. Gary used the Bel Air home, as well as a different home in Malibu, as collateral for loans he took out starting in 2020, according to The Wall Street Journal, which also first identified Thiel as the buyer. After the Winnicks defaulted on payments, the home eventually went to auction, where Thiel outbid others and purchased it for $130 million. Casa Encantada is one of many properties in Thiel's US real estate portfolio, which includes a compound in Miami , a mansion in Washington, DC , and a property in Maui. But Casa Encantada might be the most historic. See inside Thiel's latest purchase. Casa Encantada was built in 1938, according to Los Angeles County property records. Nils Timm Hilda Boldt Weber, the widow of a glass manufacturer, commissioned architect James E. Dolena to build the estate. Weber was a nurse who married a Midwestern glass bottle manufacturer after nursing him back to health. The death of her husband left her very wealthy, and she spared no expense in building this massive estate. Hotelier Conrad Hilton purchased the home from Weber for $225,000 in 1950. The Huntington Library Hilton lived in Casa Encantada until he died in 1979. The Hilton ", "date_str": "2026-11-25T17:49:01+00:00", "hash": "a24955f79b151758", "title_fa": "پیتر تیل یک عمارت تاریخی بل ایر را در حراجی به قیمت نزدیک به 100 میلیون دلار کمتر از قیمت اولیه آن خرید. داخل را ببینید.", "summary_fa": "این عمارت، با نام مستعار Casa Encantada، دارای 60 اتاق به مساحت بیش از 40000 فوت مربع است و مشرف به زمین گلف در باشگاه Bel-Air Country Club است. نیلز تیم پیتر تیل عمارت تاریخی بل ایر کاسا انکانتادا را در حراجی با تخفیفی زیاد خرید. کاسا ان ut with a less rosy tint. His view: Our current economy is filled with \"jobs that don't need to exist,\" including procurement workers generating paperwork \"that no one cares about or will ever read.\" ", "date_str": "2026-11-25T17:48:54+00:00", "hash": "9f4420f5e5ea5fc0", "title_fa": "مهندس سابق تسلا می‌گوید هوش مصنوعی «شغل‌های جعلی» بیشتری ایجاد می‌کند، نه بیکاری گسترده", "summary_fa": "کارمندان نگران هستند که هوش مصنوعی جایگزین شغل آنها شود. این بنیانگذار استارت آپ فکر می کند که موارد بیهوده بیشتری ایجاد خواهد کرد. متیو چتل/ انتشارات آینده از طریق گتی ایماژ یک بنیانگذار هوش مصنوعی و مهندس سابق تسلا می گوید که هوش مصنوعی کار اداری ما را بدتر می کند. تجاس باکتا گفت که بخش بزرگی از مشاغل اینترنت شکلی از درآمد پایه جهانی است. برداشت او از تأثیر هوش مصنوعی بر مشاغل با هشدارهای بالا و پایین سایر مدیران سیلیکون ولی متفاوت است. آیا نگران این هستید که هوش مصنوعی جایگزین شغل شما شود؟ تجاس باکتا می‌گوید که فکر می‌کند فناوری برعکس عمل می‌کند - و به انبوه کارهای بی‌فایده ما اضافه می‌کند. او طی مصاحبه ای با MTS Live گفت: \"برخی افراد این تصور را دارند که در نتیجه این امر بیکاری گسترده خواهیم داشت.\" من تقریباً برعکس را احساس می‌کنم. مثلاً، فکر می‌کنم ما کارهای مزخرف بیشتری خواهیم داشت. خیلی بیشتر.» باکتا، مهندس سابق یادگیری ماشین تسلا، اکنون بنیانگذار Morph است، یک استارت آپ زیرساخت هوش مصنوعی که در تابستان 2023 Y Combinator بود. اساساً اکثر مشاغل در حال حاضر UBI هستند. بنیانگذار Morph @tejasybhakta استدلال می کند که هوش مصنوعی به جای اینکه منجر به بیکاری انبوه شود، می تواند مشاغل مزخرف بیشتری ایجاد کند: \"بیشتر افراد در مشاغلی هستند که نیازی به وجود ندارند. این افسران تدارکاتی که برای امضای این سندی که هیچ کس به آن اهمیتی نمی دهد یا خواهد خواند، این اسناد را منتشر می کنند. \"Bas هستند. این به نوعی داغ‌ترین برداشت در آنجا است.» «برخی از مردم این تصور را دارند که در نتیجه این موضوع، بیکاری انبوه بیشتری خواهیم داشت. من تقریباً برعکس آن را احساس می کنم. من فکر می‌کنم که کارهای مزخرف بیشتری خواهیم داشت، فقط خیلی بیشتر.» «قبل از AGI، 40 درصد از مشاغل", "image_url": "https://i.insider.com/6b070b89d6c5d341c9b4d330?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic"], "datetime_fa": "۴ آذر • ۲۱:۱۸"}, {"source": "Business Insider", "title": "Student-loan borrowers are being notified they’re ineligible for their income-based payments", "link": "https://www.businessinsider.com/student-loan-borrowers-kicked-off-ibr-repayment-plan-new-notices-2026-11", "summary": "New notices are going out to student-loan borrowers telling them they re ineligible for their income-based repayment plan. Robyn Beck / AFP via Getty Images The Education Department said it \"discovered\" some student-loan borrowers are ineligible for an income-based repayment plan. Borrowers received a notice giving them 90 days to transition to a new plan or be placed in a standard plan. Some borrowers said they're concerned the switch could jeopardize their loan forgiveness progress. Some student-loan borrowers got a surprise notice days before Thanksgiving: they may no longer pay off their balances under a more generous version of the income-based repayment plan. An Education Department spokesperson confirmed to Business Insider that a group of student-loan borrowers was enrolled in its newer income-based repayment plan when they were only eligible for an older version. Borrowers with loans disbursed before July 2014 qualify for plans paying 15% of their discretionary income, with loan forgiveness after 25 years. The department said an error led to fewer than 0.1% of borrowers being mistakenly enrolled in a newer, more generous IBR plan, which carries payments of 10% of their discretionary income and forgiveness after 20 years. Only borrowers with loan disbursements on or after July 1, 2014, are eligible for that plan. The department did not comment on the cause of the error and said that affected borrowers can apply for an eligible plan at studentaid.gov. The notice, viewed by Business Insider, said that the Education Department \"has discovered tte display option that you can add to avoid glare, which brings the iPad Mini's price to a whopping $899 . I've tested various iPad Minis over the product's lifetime. Each one has felt slightly compromised. But now it finally feels like it has the right features and specs to be the best small tablet it can be. The problem is that this version is coming at a time when component costs, like RAM and storage, are skyrocketing. That's pushing products to start at higher prices, and the Mini is no exception. However, discounts are already popping up on certain configurations. As of writing, the base Mini is $100 off at Amazon, bringing it down to $599 . That's still high compared to many similarly sized tablets from other brands, but it's a step in the right direction. Ultimately, how much you prioritize the new Mini's premium specs and how often you plan to travel with your tablet will weigh heavily in deciding whether this iPad is right for you. Here's what the new iPad Mini excels at and where it falls short. Considering other Apple tablets? Check out our guide to all of the newest Apple iPads . The 2026 iPad Mini has a beautiful screen with one drawback The OLED screen offers excellent image quality for 4K movies. Tyler Hayes/Business Insider The 2026 iPad Mini is the second iPad to get an OLED screen, joining Apple's premium iPad Pro. This high-tech display lights up individual pixels, turning on only the ones it needs, rather than using a backlight to illuminate the screen. As a result, black levels are truly black. You'll no", "date_str": "2026-11-25T17:35:58+00:00", "hash": "df43c6418c566c45", "title_fa": "آیپد مینی جدید اپل یک ارتقاء بزرگ است، اما قیمت 699 دلاری آن پایین می آید", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید iPad Mini 2026 یک تبلت جمع و جور گران قیمت اما درجه یک است. Tyler Hayes/Business Insider جدیدترین آیپد مینی اپل ارتقای بزرگی را نسبت به نسل قبلی خود ارائه می دهد، ا an Gleeson) amid the slow revelation of many extremely dark secrets. If you want more of that flavor of trauma-driven drama with a tight focus on family bonds, there s one movie you should watch: 2015's Dark Places. Dark Places captures a similar female-centric vibe of trauma and secrets You want buried secrets? Dark Places has seriously buried secrets. Adapted from the Gillian Flynn novel, the film follows Libby Day (Charlize Theron), who survived the mass murder of her family in 1985. The crime is blamed on her brother Ben, a moody loner whose conviction was based in large part on Libby s own testimony. For a long time, Libby is financially sustained by donations from people who sympathize with her plight, but three decades after the murders, the money has dried up, and Libby is desperate so desperate, she agrees to help out a true crime club that believes her brother is innocent and is working toward his release. Like The Good Daughter , Dark Places is anchored by a sibling relationship reshaped by the impact of horrifying violence. Libby and Ben s experience mirrors Sam and Charlie s in many ways, including in the way both Libby and Ben carry secrets for years after the terrible events that took family from them. The stories are also both compelling mysteries, slowly revealing the shocking truths behind one horrific night, and ultimately allowing the characters to better understand one another. Dark Places also explores the insular, suffocating nature of small-town life, and how rumor and gossip become a poisonous presence in people s lives. Libby, Ben, Sam, and Charlie all have to deal with others' assumptions and revelations that they've been betrayed by those closest to them, leading to powerful resolutions. If you loved The Good Daughter , you ll love this movie. Stream Dark Places on The Roku Channel or Kanopy , or rent it on Prime Video . Dark Places (2015) $3.99 at Prime Video Learn More Learn More $3.99 at Prime Video More movies like The Good Daughter W ation read. Instead, Tao said mathematicians should focus on subjects that humans already excel at, like explaining what AI-generated solutions actually mean and extrapolating new problems from them. And getting work published in academic journals, once a prestigious accolade for mathematicians, is rapidly losing its value, he said. As submission inboxes become flooded with AI-generated research by less and less capable mathematicians, who in many cases don't even understand what they're submitting, Tao said journals need to rethink their values or lose their importance. \"We can't go by just how many papers you have in the top journals anymore,\" he said, adding that mathematicians should earn clout only if they can explain their research before human inquisitors. Tao laid out his vision to a room full of Harvard mathematicians shortly before the math community was once again rocked by a bombshell AI solution — this time for the most famous open question in all of mathematics. On Friday, a mathematician employed by Anthropic said he cracked the Riemann Hypothesis using Claude. Mathematicians told Business Insider that the breakthrough is a huge deal. Steven Strogatz, a professor at Cornell, called the problem the \"white whale\" of the field. In an interview on the \"Numberphile\" podcast last month, Tao said humans working with AI models wouldn't \"make progress\" on the", "date_str": "2026-11-25T16:57:47+00:00", "hash": "3cf767b79b1c96db", "title_fa": "ترنس تائو خواستار انتقال به \"ریاضی 2.0\" در پی بمب‌های هوش مصنوعی است.", "summary_fa": "ترنس تائو، استاد ریاضی دانشگاه UCLA، می گوید که ریاضیات باید یک مرحله گذار را طی کند. ریچارد هارتوگ / لس آنجلس تایمز از طریق گتی ایماژ ترنس تائو در حال سوختن است زیرا هوش مصنوعی ریاضیات را متزلزل می کند. استاد دانشگاه UCLA گفت ساختارهای انگیزشی و مجلات دانشگاهی باید - و به سرعت - تغییر کنند. تائو چشم انداز خود را قبل از اینکه یک محقق Anthropic معروف ترین مسئله ریاضی را با استفاده از هوش مصنوعی حل کند، بیان کرد. ترنس تائو خواستا ts to 10 . And as I wrote in a new story this week, data center developers are now looking beyond the grid and planning to build their own off-grid gas power plants . How did we get here? If you want to understand the future of the grid, one way to do it is by looking at interconnection queues—lists of power plants that have requested a connection to the system. In recent years these queues have been dominated by renewables like wind and solar power, which are generally the cheapest way to build new energy capacity today. But there’s been a shift in some places, particularly for PJM, the country’s largest power grid operator, which covers parts of 13 states in an area stretching from Illinois to Washington, DC. PJM has seen a major uptick in natural-gas proposals. In August, the operator announced that it had accepted proposals for 715 total projects with a capacity of over 200 gigawatts to join its queue. Nearly half that total capacity represented natural-gas plants. If all the projects in the queue were built, it would increase the fossil-fuel share on PJM’s grid from 61% to 67%, according to an analysis by Kevin Kircher , an energy modeler and assistant professor of mechanical engineering at Purdue. PJM’s queue is reflective of a bigger trend across the US. Natural gas is already the single biggest source of electricity in the country, and it has basically become the default to meet exploding power demand. This AI-driven rush is already affecting greenhouse-gas emissions for tech companies. Meta’s emissions are up 45% over last year’s, according to the company’s recently released 2026 Sustainability Report . That’s even higher than the jumps from fellow hyperscalers Google ( 18% ), Amazon ( 16% ), and Microsoft ( 25% ). The company is also “reevaluating” its 2030 goal to rea", "date_str": "2026-11-25T17:00:00+00:00", "hash": "5a916593d6520f52", "title_fa": "چگونه مراکز داده باعث رونق گاز طبیعی ایالات متحده می شوند", "summary_fa": "در ماه مه 2025، همکارم دیوید رو  Royal United Services Institute first talked about why public cloud data centers have increasingly become military targets during the 2026 Iran war and the ongoing full-scale Russian invasion of Ukraine: We see an increasing acknowledgement and fact of dual use in particularly the public cloud, but also just across the board in private cloud data centers as well. The dual use that I refer to is the utilization of compute functions within these data centers—within cloud services—by militaries, for example, to run battlefield management systems, to do their HR, to do their resource management. Once a military uses a piece of civilian infrastructure, at least under international law or in terms of the principles of targeting that are taken forward by militaries, it can sometimes become a military object and is therefore of interest to an adversary, and there's an incentive to target it. Jarnecki also highlighted the fact that relatively cheap kamikaze drones can inflict disproportionate economic costs and create widespread cloud disruptions when striking data centers: Read full article Comments", "date_str": "2026-11-25T16:47:14+00:00", "hash": "aeb82d6eb6c493ac", "title_fa": "خلاصه داستان Ars Live: انتظار نداشته باشید حملات نظامی به مراکز داده متوقف شود", "summary_fa": "حملات هواپیماهای بدون سرنشین به مراکز داده مراکز داده آمازون امسال برای اولین بار در خاورمیانه مورد حمله نظامی قرار گرفتند و روسیه و اوکراین حملات بی‌سابقه‌ای از پهپادها را به مراکز داده یکدیگر رد و بدل کردند. برای بررسی معنای چنین حملاتی به مراکز داده برای آینده خدمات ابری که همه جوامع مدرن به آن وابسته هستند، Ars میزبان یک بحث زنده بود. در گفتگو با جرمی هسو، خبرنگار Ars Technica Tech، جوزف جارنکی در موسسه Royal United Services ابتدا در مورد اینکه چرا مراکز داده عمومی ابری به طور فزاینده ای به اهداف نظامی در طول جنگ 2026 ایران و تهاجم روسیه در مقیاس کامل به اوکراین تبدیل شده اند، صحبت کرد: ما شاهد افزایش تصدیق و واقعیت استفاده دوگانه در مراکز ابری خصوصی و به ویژه در مراکز ابری عمومی هستیم. کاربرد دوگ uding bank fraud, conspiracy to defraud the US, money laundering conspiracy, and “substantive” violations of the International Emergency Economic Powers Act. Read full article Comments", "date_str": "2026-11-25T16:33:45+00:00", "hash": "b8f02f30d5284fae", "title_fa": "گناهکار: هوآوی به دلیل سرقت اسرار تجاری T-Mobile و Cisco با مجازات های سنگین روبرو می شود", "summary_fa": "روز سه‌شنبه، هیئت منصفه آمریکایی یکی از غول‌های کلیدی مخابراتی و هوش مصنوعی چین، Huawei Technologies را به سرقت اسرار تجاری از شرکت‌های فناوری آمریکایی و دور زدن تحریم‌ها علیه ایران محکوم کرد. اگرچه اتهامات طولانی مدت به سال 2018 بازمی گردد، اما حکم صادره اکنون تهدیدی برای شعله ور کردن تنش های آمریکا و چین در برهه ای حساس است، درست در زمانی که دونالد ترامپ در حال آماده شدن برای افزایش تعرفه ها بر چین است. با این حال، وزارت دادگستری ایالات متحده در یک بیانیه مطبوعاتی، نتیجه را برای حفاظت از سیستم مالی ایالات متحده، صنعت جهانی مخابرات و امنیت ملی ایالات متحده بسیار مهم ارزیابی کرد. هیئت منصفه هوآوی را به اتهاماتی از جمله کلاهبرداری بانکی، توطئه برای کلاهبرداری از ایالات متحده، توطئه پولشویی و نقض \"ماهوی\" قانون اختیارات اقتصادی اضطراری بین المللی محکوم کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید روز سه‌شنبه، هیئت منصفه آمریکایی یکی از غول‌های مخابراتی و هوش مصنوعی چین، Huawei Technologies را به سرقت اسرار تجاری از شرکت‌های فناوری آمریکا علیه ایران و فرار از تحریم‌ها محکوم کرد. در میان جرایم، هوآوی به دلیل دروغگویی «مکرر» به بانک‌ها درباره تجارت خود در ایران مجرم شناخته شد. وزارت دادگستری می‌گوید هوآوی همچنین مکرراً به دولت آمریکا دروغ گفته است که «به دولت، ارتش یا جامعه اطلاعاتی ایران کمکی نکرده است». در حقیقت، وزارت دادگستری در محاکمه ثابت کرد که هواوی در ایران تحت نام «اسکای کام» برای دور زدن تحریم‌ها فعالیت می‌کند و در عین حال «خدمات کلید در دست با توجه به ستون فقرات اینترنت و دسترسی گسترده‌تر برای شبکه‌های تلفن همراه» را به ایران ارائه می‌دهد. وزارت دادگستری گفت، علاوه بر این، هواوی به رژیم ایران", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/GettyImages-2306257922-1024x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری", "روابط بین‌الملل"], "datetime_fa": "۴ آذر • ۲۰:۰۳"}, {"source": "Zoomit", "title": "ادعای نگران‌کننده: تلویزیون‌های هایسنس، اطلاعات محتوای در حال پخش را به یک شرکت تبلیغاتی ارسال می‌کنند", "link": "https://www.zoomit.ir/tv/471865-hisense-vidaa-tv-alleged-audio-fingerprinting-nexxen-privacy/", "summary": "یکی از کاربران هایسنس مدعی است تلویزیونش هر چند ثانیه اطلاعات صوتی محتوای در حال پخش را برای یک شرکت تبلیغاتی ارسال می‌کند.", "date_str": "2026-11-25T16:43:00+00:00", "hash": "6a3d96b5f3c55c24", "title_fa": "ادعای نگران‌کننده: تلویزیون‌های هایسنس، اطلاعات محتوای در حال پخش را به یک شرکت تبلیغاتی ارسال می‌کنند", "summary_fa": "یکی از کاربران هایسنس مدعی است تلویزیونش هر چند ثانیه اطلاعات صوتی محتوای در حال پخش را برای یک شرکت تبلیغاتی ارسال می‌کند. تبلیغات بررسی فنی مستقل از سوی یک خریدار تلویزیون هایسنس ، پرسش‌های تازه‌ای درباره‌ی حریم خصوصی در تلویزیون‌های هوشمند مطرح کرد. این کاربر مدعی است تلویزیون او، حتی هنگام پخش محتوا از دستگاه‌های متصل به درگاه HDMI، اطلاعاتی درباره‌ی صدای در حال پخش را در فاصله‌های زمانی کوتاه برای یک شرکت تبلیغاتی ارسال می‌کند. گابریل ورنک نتایج بررسی خود را در مخزنی عمومی در گیت‌هاب منتشر کرده است . او می‌گوید با بررسی نرم‌افزار دستگاه و رمزگشایی ارتباطات شبکه، سازوکاری را شناسایی کرده که می‌تواند محتوای در حال تماشا را از روی ویژگی‌های صوتی آن تشخیص دهد. این آزمایش روی تلویزیون Hisense 55U65QEVS، نسخه‌ی عرضه‌شده در بریتانیا با سیستم‌عامل VIDAA U09.60، انجام شده است. کپی لینک ادعای ارسال اطلاعات صوتی هر ۲٫۷ ثانیه ورنک می‌گوید در جریان بررسی فرایندهای پس‌زمینه‌ی تلویزیون، سرویسی به نام HamService را شناسایی کرده که از فناوری «تشخیص خودکار محتوا» یا ACR استفاده می‌کند. این فناوری می‌تواند با تحلیل ویژگی‌های صوتی یا تصویری، برنامه‌ی تلویزیونی، فیلم، تبلیغ یا محتوای دیگری را که کاربر تماشا می‌کند، شناسایی کند. براساس یاف te multipliers\" — breakthroughs that allow its AI systems to accomplish more work using less computing power. Anthropic says these improvements are helping it deliver more value to customers and generate more revenue from its existing computing infrastructure. More AI from less compute That's great for Anthropic. But it has potentially enormous implications for the AI industry's spending plans . Investors have poured hundreds of billions of dollars into companies building data centers, making chips, and supplying electricity to power the AI revolution. Much of that investment is based on forecasts of how quickly AI revenue will grow, and how much computing power will be needed to support that growth. AI demand remains strong. But what if those compute forecasts are wrong? Charles Zvibleman, VP of strategic finance at AlphaSense, recently suggested on X that concerns about future AI infrastructure demand can potentially be traced to what Anthropic discussed with potential investors in the weeks leading up to its IPO. According to Zvibleman, Anthropic told investors it could generate four times as much revenue from a given amount of computing power as previously expected, with further efficiency gains anticipated. If AI companies can generate significantly more revenue from the same computing power, they could meet user demand and achieve their financial targets with less infrastructure than investors previously anticipated. Clues from the IPO filing Anthropic's IPO filing ", "date_str": "2026-11-25T16:38:43+00:00", "hash": "187c0aa7cdef8bc2", "title_fa": "«ضریب محاسباتی» آنتروپیک، سرمایه‌گذاران را به وحشت انداخته و تجارت هوش مصنوعی را تحت تأثیر قرار می‌دهد.", "summary_fa": "داریو آمودی (در مرکز) در IPO آنتروپیک. مایکل ناگل/ بلومبرگ از طریق گتی ایمیجز، نورافکن‌های ثبت IPO آنتروپیک، ضرب‌کننده‌هایی را محاسبه می‌کنند که هوش مصنوعی بیشتری را از محاسبات کمتر فشرده می‌کنند. سرمایه گذاران نگران هستند که مدل های کارآمد کلود ممکن است تقاضای آینده برای مراکز داده و تراشه ها را ary": "حالا کلاهبردارها برای دور زدن سیستم‌های امنیتی پیام‌رسان‌ها و فریب کاربران، تغییراتی در لینک عکس یادگاری و دعوت به عروسی ایجاد کرده‌اند.", "date_str": "2026-11-25T16:30:00+00:00", "hash": "e22686371b6765fa", "title_fa": "هکرها لینک‌های آلوده «کارت دعوت عروسی» و «عکس یادگاری» را به‌روز کردند: این بار فایل زیپ به‌جای اپلیکیشن", "summary_fa": "حالا کلاهبردارها برای دور زدن سیستم‌های امنیتی پیام‌رسان‌ها و فریب کاربران، تغییراتی در لینک عکس یادگاری و دعوت به عروسی ایجاد کرده‌اند. تبلیغات اگر تا دیروز هشدار اصلی این بود که فایل‌های APK ناشناس را در پیام‌رسان‌ها دانلود نکنید، حالا کلاهبردارها برای دور زدن سیستم‌های امنیتی پیام‌رسان‌ها و فریب کاربران، همان بدافزارها را در قالب zipارسال می‌کنند. این حرفی است که در روزهای گذشته متخصصان امنیت و هم‌چنین معاون فرهنگی و اجتماعی پلیس فتا به خبرنگار زومیت انتقال دادند. سرهنگ جواد مختار رضایی، معاون فرهنگی و اجتماعی پلیس فتا در این رابطه می‌گوید: «اخیرا مجرمان برای فریب مخاطبان و گمراه کردن سیستم‌های پالایشی پیام‌رسان‌ها در تشخیص مخرب بودن فایل، اغلب بدافزارها را در قالب فایل ZIP ارسال می‌کنند. با فشرده‌سازی (ZIP) فایل، پیام‌رسان دیگر متوجه آلوده بودن آن نمی‌شود؛ در حالی که اگر فایل با فرمت APK ارسال شود، پیام‌رسان‌های داخلی بر اساس ابلاغیه‌های صورت‌گرفته، به‌طور خودکار جلوی آن را می‌گرفتند و حذف می‌کردند.» کپی لینک چرا هکرها دیگر فایل زیپ می‌فرستند؟ حسین درواری، کارشناس شبکه و امنیت سایبری، در توضیح دلایل تغییر تاکتیک مجرمان و استفاده از فایل‌های فشرده (ZIP) به‌جای ارسال مستقیم فایل APK، به دو عامل اصلی اشاره می‌کند و به زومیت می‌گوید: پیش از این وقتی فایل APK ارسال می‌شد، دو مانع وجود داشت؛ اول این که خود پیام‌رسان‌ها و مرورگرها با باز کردن یک پنجره تایید (بله/خیر)، درباره خطرناک بودن فایل هشدار می‌دادند و دوم این که برخی آنتی‌ویروس‌ها آن را سریع شناسایی می‌کردند. - حسین درواری ، کارشناس شبکه و امنیت سایبری برخی آنتی‌ویروس‌ها محتوای درون فایل‌های ZIP را اسکن نمی‌کنند او می‌افزاید: «اما در حالت ZIP، فایل به‌راحتی از سد هشدار اولیه پیام‌رسان‌ها و مرورگرها عبور می‌کند و از سوی دیگر، برخی آنتی‌ویروس‌ها محتوای درون فایل‌های ZIP xtending arm with three joints to give you additional options. I haven't had a chance to use it to film anything for public consumption quite yet, but my testing has already given me some great ideas for how I can use it to show off, say, what it's really like to use a micro-reader in comparison to a full-sized Kindle , as I'll be able to wear it to give a more accurate user's point of view. And right now is a good time to pick one of them up, as many of Telesin's phone and camera accessories (including similar models built to handle an action camera like a GoPro ) are discounted for Black Friday; the one I tested is down to $17, or 15% off. Telesin Magnetic Neck Mount for Phones $16.96 at Amazon $19.95 Save $2.99 Get Deal Get Deal $16.96 at Amazon $19.95 Save $2.99 Telesin SE3 Base Action Camera Neck Mount $17.59 at Amazon $21.99 Save $4.40 Get Deal Get Deal $17.59 at Amazon $21.99 Save $4.40 Telesin Master Grip Kit $71.99 at Amazon $89.99 Save $18.00 Get Deal Get Deal $71.99 at Amazon $89.99 Save $18.00 SEE 0 MORE This won't be the right device for every filming scenario. Though MagSafe holds my iPhone fairly securely, I found that I would accidentally detach it every time I tried to adjust the shooting angle once even leading me to drop it. That's potentially bad news, as using it may require you to take the phone out of its case if it isn't MagSafe-compatible. ( Mine isn'", "date_str": "2026-11-25T16:30:00+00:00", "hash": "f86a45ba152b0d92", "title_fa": "این پایه گردن تلفن مغناطیسی راه حل فیلمبرداری آسانی بود که من به آن نیاز داشتم و برای جمعه سیاه به فروش می رسد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. من در مورد کتاب‌خوان‌های الکترونیکی و تبلت‌های جوهر الکترونیکی برای Lifehacker زیاد می‌نویسم، و یکی از مسائلی که دائماً با آن دست‌وپنجه نرم می‌کنم این است که چگونه می‌توانم به طور آموزنده درباره تعدادی از دستگاه‌هایی بنویسم که می‌توانند در برخی جزئیات کاملاً متفا ار حدود ۲۵ کیلومتر حرکت کرد و سرانجام ساعت ۸:۵۳ با قطار ایریو که روی همان خط متوقف مانده بود، برخورد کرد. بررسی‌ها نشان می‌دهد راننده‌ی قطار ایریو پیش از حادثه چند بار به مرکز کنترل اطلاع داده بود که قطارش همچنان متوقف است. بااین‌حال، ظاهراً دستور توقف یا کاهش سرعت به قطار رنفه ابلاغ نشد. سرعت این قطار هنگام برخورد هنوز به‌طور قطعی مشخص نشده، اما احتمال می‌رود به حدود ۲۰۰ کیلومتربرساعت رسیده باشد. اسکار پوئنته ، وزیر حمل‌ونقل اسپانیا، می‌گوید در چنین شرایطی قطار باید با سرعت محدود و به‌اندازه‌ای حرکت می‌کرد که راننده بتواند در صورت مشاهده‌ی مانع متوقف شود. او تأکید کرده که مسئولیت اولیه‌ی این تصمیم متوجه مرکز کنترل بوده و شواهد فعلی تقصیری را متوجه رانندگان نمی‌کند. کپی لینک دومین فاجعه‌ی بزرگ ریلی اسپانیا در سال ۲۰۲۶ براساس آمار اعلام‌شده در گزارش ای‌بی‌سی", "image_url": "https://api2.zoomit.ir/media/train-accident-europe-derailment-6b041b5b6c25894452117bb6?w=1920&q=75", "category": "سینما و سریال", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۴ آذر • ۱۹:۴۰"}, {"source": "Engadget", "title": "Nothing's Ear (note) is a pair of earbuds with built-in AI notetaking", "link": "https://www.engadget.com/2328122/nothings-ear-note-is-a-pair-of-earbuds-with-built-in-ai-notetaking/", "summary": "The company has promised to share more details on December 8.", "date_str": "2026-11-25T16:03:17+00:00", "hash": "ddb1de5f354f598d", "title_fa": "Nothing's Ear (توجه) یک جفت هدفون با یادداشت برداری هوش مصنوعی داخلی است.", "summary_fa": "این شرکت قول داده است که جزئیات بیشتری را در 8 دسامبر به اشتراک بگذارد. من برای آخرین دستگاه Nothing بیشتر هیجان زده بودم که فکر کردم یک قلم ویپ هوش مصنوعی است. هیچ چیز اضافه کردن Engadget به Google: منبع ترجیحی Google Discover قبل از 8 دسامبر و تعداد زیادی نشت هماهنگ شده برای شمارش، هیچ چیز به طور رسمی اولین دستگاه \"بومی هوش مصنوعی\" خود را معرفی نکرده است. تا حدودی ضد آب و هوا، Ear (یادداشت) یک جفت هدفون با یادداشت هوش مصنوعی داخلی است. همانطور که این شرکت به بلومبرگ گفت، این هدفون‌ها می‌توانند مکالمات حضوری، تماس‌ها، جلسات آنلاین و یادداشت‌های صوت tion type, and you re online in a few minutes. Once it s running, the hardware covers the basics, with a 2.5 Gbps port for a wired connection like a hotel s Ethernet jack, a 1 Gbps port for a wired device, and a USB 3.0 port for a storage drive or phone tethering. And since it draws power over USB-C (5V/3A), a basic power bank can keep it going through a long layover or a camping trip. As handy as it is on the road, though, it s not meant to replace a full-size home router even with its 5 GHz band and Wi-Fi 7 support which will generally offer better coverage and more consistent speeds. Real-world performance also depends heavily on your connection and setup. USB tethering, for example, can feel slower than using your phone directly. It also leaves out features like automatic band steering, so you may end up managing networks yourself. Still, if you travel often or need a portable network hub for multiple devices, you ll find it holds up pretty well. Our Best Editor-Vetted Early Black Friday Deals Right Now Apple AirPods Pro 3 Noise Cancelling Heart Rate Wireless Earbuds $149.00 (List Price $249.00) Apple iPad 11\" 128GB A16 WiFi Tablet (Blue, 2025) $379.00 (List Price $449.00) Apple Watch Series 12 (GPS, 42mm) $299.00 (List Price $399.00) Samsung Galaxy Tab A11+ 128GB 11\" 1920x1200 Android Tablet (", "date_str": "2026-11-25T15:47:53+00:00", "hash": "1f64f6faff91e47a", "title_fa": "روترهای مسافرتی وای فای عمومی را به شبکه خصوصی خود تبدیل می کنند و این TP-Link برای جمعه سیاه زیر 100 دلار است.", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. یک راه حل جدید برای اتصال به اینترنت در حال حرکت، روتر مسافرتی TP-Link Roam 7 اکنون از 119.99 دلار برای جمعه سیاه به 83.49 دلار کاهش یافته است که پایین ترین قیمت آن تا به امروز است. این یک روتر خانگی با اندازه کامل نیست، اما همانطور که از نامش پیداست، یک همراه مسافرتی جمع و جور است که تقریباً اندازه یک کتاب شومیز است، با آنتن‌های تاشو که Great Smoky Mountains National Park. Laura Grace Tarpley The tradition began in July 2018, when Heather wanted to take a long-weekend trip for her 26th birthday. Since I was in Baltimore for the summer while my husband was interning in Washington, DC , we decided she should come visit, and I could show her around both cities. When you live far away from a friend and finally reunite, it's easy to spend time just catching up on what's happening in the other person's life rather than making new memories together. But that wasn't the case this time. We had so much fun trying new things on this trip — from touring landmarks in DC to spending a rainy day in a brewery and tasting seafood dishes we never would've considered when we were kids — that we ended up making it an annual tradition to celebrate both of our birthdays. During our first trip, I showed Heather around Baltimore and DC. Laura Grace Tarpley Heather and I have each changed over the years, in big and small ways. We might be in different phases of life, and we may switch up our travel destinations, but one thing stays the same — we always find ways to spend time together in ways we both enjoy. And that ", "date_str": "2026-11-25T14:57:06+00:00", "hash": "4d12cef0dacc288f", "title_fa": "من و بهترین دوستم در دو طرف کشور زندگی می کنیم. ما با سفرهای مشترک تولد در ارتباط هستیم.", "summary_fa": "من و بهترین دوستم از طریق سفرهای سالانه در ارتباط هستیم. لورا گریس تارپلی بهترین دوستم، هدر، و من در دو طرف کشور زندگی می کنیم. برای اینکه در ارتباط باقی بمانیم، سفرهای مشترک سالانه تولد را با هم انجام می دهیم. سفرهای ما در طول سال ها تغییر کرده است و گاهی اوقات، همسر یا خانواده ما به ما می پیوندند. من بهترین دوستم هدر را زمانی که هر دو 6 ساله بودیم ملاقات کردم. ما از کلاس اول تا دبیرستان در همان مدرسه کوچک درس می‌خواندیم، و در دوران نوجوانی، تمایلی مشترک به دیدن جهان فراتر از حباب کوچکمان داشتیم. اولین سفر ما با هم یک تور اروپایی تحت حمایت مدرسه در تابستان قبل از سال آخر بود که در آن مراکز توریستی مهمی مانند لندن و پاریس ر  Ansari In 2020, my company gave me approval to work remotely from New York for five weeks, which was my first trial run. I found a long-term Airbnb , and once I got my monthly transit pass, some supplies, and two suitcases to hold everything, I was ready to experience the city. Immediately, my favorite part of New York was the energy. There was always an event to check out, a new restaurant to try, or a person to meet. I challenged myself to make the most of every day there because I knew it wouldn't be forever. Over the course of one month, I checked out dozens of restaurants, saw every person I knew who lived in the city, and made the most of free museum nights in hopes of seeing as much as possible during my visit. Over the next three years, I went back to New York for three different monthlong stints. Every time, I fell in love with the city's energy, the thriving creative community, and how easy it is to have once-in-a-lifetime experiences on a regular basis. I seriously thought about whether and when I'd move there. As much as I liked New York, living there full-time didn't feel like the right choice Somewhere along the way, though, I realized that I couldn't keep up w", "date_str": "2026-11-25T14:31:01+00:00", "hash": "7c4339db05636499", "title_fa": "ماه‌ها در شهر نیویورک زندگی و کار کردم تا ببینم آیا باید به آنجا نقل مکان کنم یا نه. بعد از 3 سفر جوابم را داشتم.", "summary_fa": "من چندین دوره را در شهر نیویورک زندگی و کاوش کردم. آلینا انصاری من در واشنگتن بزرگ شدم و زندگی بزرگسالی خود را در سیاتل آغاز کردم، اما در مورد نیویورک کنجکاو بودم. در طول چند سال، چندین دوره کوتاه را در آنجا گذراندم و عاشق شهر شدم. با این حال، اقامت های کوتاه نیز باعث شد که بفهمم اگر برای همیشه از سیاتل بروم چقدر دلم برای سیاتل تنگ خواهد شد. من تمام عمرم را در ایالت واشنگتن زندگی کرده ام و در 12 سال گذشته سیاتل را به خانه می خوانم. این شهر جایی است که به دانشگاه رفتم، با همسر فعلی ام آشنا شدم، کارم را شروع کردم و با صاحبان مشاغل و نویسندگان محلی با نوشتن درباره آنها ارتباط برقرار کرد ary": "“Luke-ing” back across the years, Luke Bryan didn’t have much country competition in branding his name. Hank Williams recorded a series of recitations under the pseudonym Luke the Drifter, and stretching the boundaries a bit, Waylon Jennings had a landmark hit with “Luckenbach, Texas (Back to the Basics of Love).” Bryan got used to being known in the genre by a single syllable until a “Hurricane” hit in 2016. “I thought I had the Luke name,” Bryan says. “I thought I had that solidly before Luke Combs. I mean, the disc jockeys could just say, ‘That was Luke.’ They didn’t have to verify last names.” Not that Bryan has a problem with the situation. In fact, he enlisted Combs as a feature voice on “Finders Keepers,” released by Row Crop/MCA Nashville to country radio via PlayMPE on Oct. 12. It lists on Billboard’s Country Airplay as “Luke Bryan Luke Combs,” though Bryan doesn’t particularly care how people refer to them. “Luke Squared,” he says, “whatever you want to call it.” The song’s writers were just happy they got the call. Bryan heard it — and recorded it — 15 days after its official date of creation when his manager, KP Entertainment founder/president Kerri Edwards, was going through unopened emails during Bryan’s session at Nashville’s Ocean Way on March 6. She played it for Bryan and his producers, Jeff and Jody Stevens, during their drive to Dicey’s Tavern on a lunch break, and they added it to that afternoon’s material. The musicians picked it up easily. “They ran through it one time, and ran through it another time, and that was it,” Jeff recalls. Songwriter Sam Ellis (“What If I Never Get Over You,” “More Hearts Than Mine”) hosted the writing session that spawned “Finders Keepers” on Feb. 19 at his East Nashville studio. When the initial song ideas fell flat for Ellis and his co-writers, Jimi Bell (“Backup Plan,” “Last Night Lonely”) and Beau Bailey (“Stay Country or Die Tryin’,” “Favorite Country Song”), Bailey apologetically mentioned a hook he’d concocted during a brainstorming exercise: “Finders keepers, losers drinkers.” No apology was necessary; his co-writers loved the wordplay. “They just went to town,” Bailey says, “They’re lyrical and musical assassins.” They had chatted up their passion for Dwight Yoakam at the start of the appointment, and they used the pace of Yoakam’s “Suspicious Minds” cover, from the 1992 Honeymoon in Vegas soundtrack, as a template for “Finders Keepers.” “I’m a huge Dwight Yoakam fan, so that was 100% channeled t", "date_str": "2026-11-25T19:36:44+00:00", "hash": "4c4fbb9d8208abd6", "title_fa": "لوک برایان و لوک کامبز از تأثیرات مدرسه قدیمی در «Finders Keepers» کانال می‌کنند: «من می‌خواهم آهنگ‌هایی را منتشر کنم که می‌توانند مستقیماً به فهرست مجموعه بروند»", "summary_fa": "«لوک برایان» در سال‌های گذشته، لوک برایان رقابت زیادی در برندسازی نام خود نداشت. هنک ویلیامز مجموعه‌ای از تلاوت‌ها را با نام مستعار Luke the Drifter ضبط کرد و با کمی گسترش مرزها، ویلون جنینگز با «لاکنباخ، تگزاس (بازگشت به اصول عشق)» موفقیت چشمگیری داشت. برایان عادت کرد که در این ژانر با یک هجا شناخته شود تا اینکه در سال 2016 یک طوفان به نمایش درآمد. برایان می‌گوید: «فکر می‌کردم نام لوک را دارم. فکر می‌کردم قبل از لوک کامبز کاملاً چنین چیزی را داشتم. منظورم این است که دیسک‌جوکی‌ها فقط می‌توانستند بگویند، «این لوک بود.» آنها مجبور نبودند نام خانوادگی را تأیید کنند.» نه اینکه برایان مشکلی با این وضعیت داشته باشد. در واقع، او Combs را به‌عنوان یک صدای بلند در «Finders Keepers» که توسط Row Crop/MCA Nashville برای رادیو کانتری از طریق PlayMPE در 12 اکتبر منتشر شد، نام‌گذاری کرد. این آهنگ در کانتری پخش بیلبورد به‌عنوان «Luke Bryan Luke Combs» فهرست می‌شود، اگرچه برایان به‌خصوص اهمیتی نمی‌دهد که مردم چگونه به آن‌ها اشاره می‌کنند. او می گوید: «لوک مربع، هر چه می خواهی اسمش را بگذار.» نویسندگان آهنگ از اینکه تماس گرفته اند خوشحال بودند. برایان آن را شنید - و آن را ضبط کرد - 15 روز پس از تاریخ رسمی ایجاد آن، زمانی که مدیرش، موسس و رئیس KP Entertainment، کری ادواردز، ایمیل‌های باز نشده را در طول جلسه برایان در Nashville's Ocean Way در 6 مارس بررسی می‌کرد. او آن را برای برایان و تهیه کنندگانش، جف و جودی استیونز، در حین رانندگی آنها به میخانه Dicey در یک استراحت ناهار، پخش کرد و آنها آن را به مواد بعد از ظهر اضافه کردند. نوازندگان به راحتی آن را برداشتند. جف به یاد می آورد: «آنها یک بار آن را دویدند و بار دیگر از آن عبور کردند و تمام شد. سام", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Luke-Combs-and-Luke-Bryan-Courtesy-Schmidt-PR.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آذر • ۲۳:۰۶"}, {"source": "Rolling Stone", "title": "New Doc Reveals How Andrew Tate’s ‘False Braggadocio’ Is Just Like His Dad’s: ‘It’s Spooky’", "link": "https://www.rollingstone.com/culture/culture-features/andrew-tate-toxic-empire-documentary-1235664410/", "summary": "Andrew Tate: Toxic Empire uses interview with former friends, associates, and even acquaintances of his father to chart the manosphere influencer's rise to fame", "date_str": "2026-11-25T19:33:16+00:00", "hash": "a887eb6ae85d8110", "title_fa": "Doc جدید نشان می دهد که چگونه \"False Braggadocio\" اندرو تیت دقیقاً مانند پدرش است: \"این شبح آور است\"", "summary_fa": "اندرو تیت: امپراتوری سمی از مصاحبه با دوستان، همکاران و حتی آشنایان سابق پدرش برای ترسیم افزایش شهرت اینفلوئنسر مانوسفر استفاده می‌کند. برادران بریتانیایی-آمریکایی اندرو و تریستان تیت در حال حاضر در انتظار استرداد به بریتانیا هستند، جایی که با ده‌ها اتهام از جمله تجاوز جنسی و قاچاق به منظور سوء استفاده جنسی روبرو هستند. عکس‌هایی که آنها در رسانه‌های اجتماعی منتشر کردند - از مردانی با شلوارهای تنگ، سیگارهای ضخیم در دندان‌هایشان، تکیه دادن به ماشین‌های اسپرت لوکس در کنار زنان بیکینی با سینه‌های درشت - به ایجاد مانوسفر کمک کرد و به خودی خود تبدیل به یک مانوسفر شد. سوء استفاده‌های آن‌ها - اداره امپراتوری دختر بادامک خارج از رومانی، که گفته می‌شود در قاچاق انسان دست داشته است - به طور گسترده مستند شده است، و همچنین انکار آنها مبنی بر اینکه آنها درگیر هر نوع فعالیت غیرقانونی هستند. اما آنها واقعاً چگونه این پول را به دست آوردند، و بازماندگانی که در پی خود باقی گذاشته اند چه کسانی هستند؟ مستند جدید، اندرو تیت: امپراتوری سمی، با استفاده از مصاحبه با اعضای سابق گروه شبکه انحصاری آنها، اتاق جنگ، تلاش می کند به این سؤالات پاسخ دهد. با زنانی که ادعا می کنند توسط برادران مورد تجاوز جنسی قرار گرفته اند، از جمله تحریک کننده سابق ضد زن، لورن ساترن. و کسانی که آنها را در دوران جوانی می‌شناختند، از جمله بازیگر همکار برادر بزرگ اندرو، که در طول اجرای کوتاه خود در نمایش واقعیت بریتانیا در سال 2016 آنجا بود. (مانند هر چیز دیگری، برادران ادعاهای تجاوز جنسی را انکار می‌کنند.) اگرچه بسیاری سعی کرده‌اند داستان خود را معنا کنند، امپراتوری سمی آن را با تسکین کامل بیان می‌کند: دوران کودکی آنها در آپارتمان‌های شورای شهر لوتون، انگلستان، بسیار دور از پدر استاد شطرنجشان که در ایالت‌ها بازگشته بود. دوره کوتاه مدت آنها به عنوان", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/andrew-tate-new-tate-doc.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۴ آذر • ۲۳:۰۳"}, {"source": "Billboard", "title": "Director Peter Berg Isn’t Giving Up on the Unreleased Rihanna Documentary: ‘Keep Hope Alive’", "link": "https://www.billboard.com/culture/tv-film/rihanna-documentary-director-keep-hope-alive-unreleased-film-1236389551/", "summary": "Remember the Peter Berg-directed Rihanna documentary that was announced way back in 2016 , and was reportedly sold to Amazon for $25 million in 2019? Related Rihanna and Baby Rocki Snuggle Up For Adorable Lady Dior 2027 Campaign Rihanna and Dua Lipa Scoop Up Armload of New Diamond Platinum Certifications for Where Have You Been, Levitating More A$AP Rocky Rihanna s Son Three-Year-Old Son Riot Rose Is Already a Fashion Magazine Cover Star Well, Berg is choosing to remain optimistic. During a conversation with Complex published on Wednesday (Nov. 25), Berg — who also directed the singer and business mogul in 2012 s Battleship — discussed the doc s current status. “There’s always hope. Keep hope alive,” he said of the ل 2012 این خواننده و غول تجارت را نیز کارگردانی کرد - وضعیت فعلی سند را مورد بحث قرار داد. او درباره این مستند منتشر نشده گفت: \"همیشه امید وجود دارد. امید را زنده نگه دارید.\" اگر و زمانی که [بیرون بیاید]، یک صدای بلند خواهد بود.» از او صحبت شد که چرا فکر می‌کند برنده 9 گرمی فیلم‌های بیشتری بازی نکرده است، و او از توانایی خواننده We Found Love برای همیشه تصمیم‌گیری درست قدردانی کرد. برگ به این نشریه گفت: \"ریحانا کاری را که می خواهد انجام می دهد. او از قلب خود پیروی می کند. او از غرایز خلاق خود پیروی می کند.\" \"زمانی که او Battleship را بازی کرد، واقعاً علاقه مند بود که ببیند حضور در یک فیلم اکشن بزرگ و وحشی هالیوود چگونه است. و سپس رفت و یکسری آلبوم عالی ساخت و اکنون خانواده زیبایی را تشکیل می دهد. من به شما تضمین می‌دهم که او دوباره به موسیقی بازخواهد گشت و این یک صدای بلند خواهد بود.» برگ و تیمش سال‌ها صرف ضبط و چیدن چیزها برای مستندی درباره این ستاره کردند، اما در نهایت به ریحانا بستگی دارد که آیا او می‌خواهد آن را در نهایت منتشر کند. او در سال 2023 هنگام صحبت با هالیوود ریپورتر همین را گفت. کارگردان در آن زمان به این نشریه گفت: این کار تمام شده و فروخته شده است و آمازون آماده است. \"او یک کمال گرا است،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/rihanna-peter-berg-2012-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۴ آذر • ۲۲:۵۸"}, {"source": "Billboard", "title": "Is Carly Rae Jepsen’s ‘Run Away With Me’ About to Hit the Hot 100 for the First Time After Its ‘GTA VI’ Bump?", "link": "https://www.billboard.com/music/chart-beat/carly-rae-jepsen-run-away-with-me-gta-vi-hot-100-first-time-1236389568/", "summary": "Welcome to Billboard Pro’s Trending Up newsletter, where we take a closer look at the songs, artists, curiosities and trends that have caught the music industry’s attention. Some have come out of nowhere, others have taken months to catch on, and all of them could become ubiquitous in the blink of a TikTok clip. This week, it s all GTA (with a little CMAs), as we look at revived favorites from Carly Rae Jepsen and The Cars, an ascendant hit from an all-star cast, and a best new artist winner at age 47 . Can Carly Rae Run Away to the Hot 100 — With Help From Jason and Lucia? It s one of the most beloved pop songs of the past 15 years — but never one of its biggest chart hits. Carly Rae Jepsen s Run Away With Me became a cult classic almost immediately upon its single release (from her enduring E • MO • TION album) in 2015, but Billboard Hot 100 success totally eluded it in its moment. (In 2023, Billboard named it the 21st greatest pop song of the Hot 100 era to never reach the chart.) But in 2026, a great pop song still has a chance to reach the Hot 100 no matter when it was originally released — and Run Away With Me now has the best opportunity it s had in a decade, thanks to the release of Grand Theft Auto VI . Run Away With Me plays in the record-breaking new game during a scene when its dual protagonists, Jason and Lucia, are enjoying the Vice City high life after the latter s release from prison. With its cinematic sax and propulsive synth-pop shuffle making it an ideal soundtrack for just about any action-packed sequence, the song has become one of the breakout musical moments from the game s heavily music-focused universe — and led many pop fans to wonder if it could result in the storied track finally reaching the Hot 100 for the first time. The answer? Maybe — but it still has a long way to go. The song s streaming breakout has unquestionably been real: It was pulling daily official on-demand streams in the low 20,000s in the days before the game s release, but that number had broken six digits by Sunday (Nov. 22, three days after GTA VI s release), and was all the way up to 281,000 by Monday, according to early data provided by Luminate. That s a gain of nearly 1,100% over the total the song posted last Wednesday, just before the game s release, but it s still a little low for a streaming-driven-song on the Hot 100. The ques  Gerran Howell dressed as their characters Mel, Santos, and Whitaker, respectively. The [ ]", "date_str": "2026-11-25T19:25:39+00:00", "hash": "10e375bf09200d9b", "title_fa": "تاریخ پخش فصل سوم سریال The Pitt", "summary_fa": "تعطیلات زود فرا رسیده است، زیرا HBO Max فاش کرده است که درام پزشکی تحسین شده آن، پیت، فصل سوم خود را در 7 ژانویه 2027 پخش خواهد کرد. این خبر امروز از طریق حساب اینستاگرام سریال منتشر شد و بازیگرانی چون تیلور دیردن، ایسا بریونز و جران هاول لباس شخصیت‌هایشان ملحی و سانتوکر را به تن کردند. [ ] The Pitt چالش های فوری ایالات متحده را شرح می دهد. متخصصان مراقبت های بهداشتی خط مقدم با دریچه بخش اورژانس مرکز پزشکی ترومای خیالی پیتسبورگ روبرو می شوند. این مجموعه با ارائه قالبی بی‌درنگ، ساعت به ساعت موارد پزشکی و بحران‌های شخصی را ردیابی می‌کند، زیرا پزشکان و پرستاران باید به دلیل فراوانی بیش از حد بیماران و کمبود منابع، آن را دنبال کنند. اخبار مرتبط اخبار پیشنهادات پخش جریانی جمعه سیاه توسط Disney+، HBO Max، Paramount+، Peacock اخبار بیشتر The Odyssey، Widow s Bay در میان نامزدهای برتر فیلم های AARP برای جوایز TV For Grownups بازیگران شامل نوآ وایل (Michael Robby. Labinavitch) و Patrickana Ballonsa (D) فیونا دوریف (دکتر مک کی)، تیلور دیردن (دکتر کینگ)، ایسا بریونز (دکتر سانتوس)، جران هاول (دکتر ویتاکر)، شبانه عزیز (جوادی)، عایشه هریس (دکتر الیس)، سپیده معافی (دکتر. الهاشمی) و شاون هاتوسی (دکتر ابوت). در Deadline افزوده‌های جدید فصل 3 را در نقش‌های تکرارشونده تماشا کنید: استفن چانگ، بری کلیفتون، کریس دیامانتوپولوس، لارنس کائو، برنت سکستون، جی‌بی تادنا و هانا ور. وایل در رابطه با طرح فصل 3 به ددلاین گفت: \"فصل 3 درباره پزشکان است که از بیمار بودن سود می برند. ما خواهیم دید که [رابی] راه درمانی را آغاز کرده است؛ این یک اثر مثبت داشته است. این شکننده است و بدون خطر و آسیب پذیری نیست، اما حداقل پیشرفت رو به جلو وجود دارد.»", "image_url": "https://deadline.com/wp-content/uploads/2026/08/the-pitt-season-3-photos-hbo-max.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۲۲:۵۵"}, {"source": "Pitchfork", "title": "Bradford Cox igger occasion, a gathering of a community they ve been part of from the outside that they can now be part of from the inside. That inside has gotten very big, very quickly. With Teletech now operating across Europe, South America, Australia and the U.S., Stevens and Shelton say the event is expected to sell close to 500,000 tickets in 2026 alone. The next few weeks will also be major, with Teletech throwing a party at Space Miami on Friday (Nov. 27) (the lineup includes Adrián Mills, Benwal, Danyelino and Hannah Laing) and a massive New Year s event called Fresh Start in San Francisco on Jan. 2. There, artists including Sara Landry , I Hate Models and Nico Moreno will play for a crowd of roughly 20,000 at The Warehouse on the city s Pier 80. This CV is particularly impressive given that Teletech is run by a team of five. The brand s origins go back to Stevens’ time at university, when he started his own club night, calling it Teletech. Around the same time, he began managing the booking calendar at the Manchester club Hidden. He eventually crossed paths with Shelton, who was finishing his studies and looking to book dance shows. The pair worked together at Hidden for years, cutting their teeth in clubland and making their names in the scene. The pandemic was a clarifying moment. With events on pause, Stevens and Shelton spent the downtime planning a run, Stevens says, of “larger than life techno shows.” The result was XXL, a large-forma", "date_str": "2026-11-25T19:18:30+00:00", "hash": "9e3b6f6adcffdea4", "title_fa": "تله‌تک برند سخت تکنو بریتانیا در مسیر فروش 500000 بلیت در سال جاری است. در اینجا نحوه نفوذ آن به آمریکا آمده است", "summary_fa": "آنتون استیونز نتوانست به عنوان دی جی در منچستر رزرو شود، بنابراین مهمانی خود را برگزار کرد. این رویداد اکنون در مسیر فروش 500000 بلیط در سال جاری است. تله‌تک، برند پارتی تکنو سخت که در منچستر توسط استیونز و تام شلتون تأسیس شد، پنج سال گذشته را صرف ساختن برندی کرده است که کمتر شبیه یک تبلیغ‌کننده و بیشتر شبیه صحنه‌هایی با پ : توکیو از نئون در اوایل 2027 انتشار یافت. بدون اینکه در واقع آنها را به این عنوان نام ببریم. یانگ در عذرخواهی خود از شنیدن این حرف واقعا شوکه شد. او در اینستاگرام نوشت: «من واقعاً می‌خواهم به خاطر استفاده از کلمه‌ای در پادکست بدون اطلاع از تاریخچه یهودی‌ستیز آن عذرخواهی کنم. \"به ویژه ناراحت کننده است که متوجه شدم زبانی را پذیرفتم که توسط جنبش های راست افراطی رایج شده است که ما باید نسبت به لفاظی های آنها محتاط باشیم و علیه آنها عمل کنیم.\"", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Bowen-Yang-and-Mark-Ruffalo-Split-Getty-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۲۲:۰۴"}, {"source": "Variety", "title": "Takashi Miike’s ‘Bad Lieutenant: Tokyo’ Sets March 2027 Release Date", "link": "https://variety.com/2026/film/news/takashi-miike-bad-lieutenant-tokyo-release-date-neon-1236957562/", "summary": "Neon has set the theatrical release date for Takashi Miike s gritty cop thriller Bad Lieutenant: Tokyo for March 5, 2027. The third installment in the cult classic series, which premiered at the Toronto International Film Festival, stars Shun Oguri, Lily James and WWE wrestler Liv Morgan. An official logline for Bad Lieutenant: Tokyo reads: Seasoned [ ]", "date_str": "2026-11-25T18:15:00+00:00", "hash": "07cd70166ce51ccf", "title_fa": "تاریخ اکران فیلم «ستوان بد: توکیو» تاکاشی میکه در مارس 2027 تعیین می‌شود.", "summary_fa": "نئون تاریخ اکران تریلر پلیسی مهیج تاکاشی میکه Bad Lieutenant: Tokyo را برای 5 مارس 2027 تعیین کرده است. سومین قسمت از این سری کلاسیک کالت که برای اولین بار در جشنواره بین المللی فیلم تورنتو به نمایش درآمد، شون اوگوری، لیلی جیمز و کشتی گیر دبلیو دبلیو ای لیو مورگان در آن حضور دارند. ورود رسمی برای Bad Lieutenant: توکیو می گوید: Seasoned [ ] Bad Lieutenant محصول مشترک ایالات متحده و ژاپن است. تهیه کنندگان عبارتند از جرمی توماس برای شرکت ضبط شده، سم پرسمن برای فیلم پرسمن، نائوکی کیتاجیما برای تلویزیون نیپون و میساکو ساکا برای OLM. تهیه کنندگان اجرایی
