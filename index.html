م گرفته و از ابزارهای اینترنتی، از جمله چت‌جی‌پی‌تی، برای جست‌وجو و جمع‌آوری اطلاعات استفاده کرده بودند. فرانک فرگوسن، رئیس بخش جرایم ویژه و مبارزه با تروریسم دادستانی سلطنتی بریتانیا، این پرونده را «عملیاتی حساب‌شده برای جاسوسی از منتقدان حکومت ایران» توصیف کرد. او گفت به متهمان وعده پاداش داده شده بود تا اطلاعات جمع‌آوری‌شده را برای رابط‌های خود در ایران ارسال کنند. به گفته فرگوسن، سپهوند آمادگی داشت از جمع‌آوری اطلاعات و نظارت فراتر برود و علیه اهداف مورد نظر دست به خشونت شدید بزند. او افزود: «خوشبختانه، پیش از آنکه حمله‌ای صورت گیرد، جلوی متهمان گرفته شد.» خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/7f79/live/9339e830-dea2-11f1-a701-fddedf244c16.png", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۲۰:۰۵"}, {"source": "Iran International", "title": "رای جدیدی برای کشاله؛ یاسر آسانی ۱+۱ جلسه و علیرضا ایلدروم دو ماه محروم شدند", "link": "https://www.iranintl.com/202611123101", "summary": "کمیته انضباطی فدراسیون فوتبال یاسر آسانی، وینگر استقلال را به دلیل «بدرفتاری نسبت به مقام رسمی مسابقه (داور) با رفتار غیرورزشی» در بازی با استقلال خوزستان در اهواز، دو جلسه محروم کرد که یک جلسه آن تا پایان فصل تعلیق شده است. آسانی همچنین ۵۰۰ میلیون تومان جریمه شده است.", "date_str": "2026-11-12T16:39:01+00:00", "hash": "20a65b438b6254dd", "title_fa": "رای جدیدی برای کشاله؛ یاسر آسانی ۱+۱ جلسه و علیرضا ایلدروم دو ماه محروم شدند", "summary_fa": "کمیته انضباطی فدراسیون فوتبال یاسر آسانی، وینگر استقلال را به دلیل «بدرفتاری نسبت به مقام رسمی مسابقه (داور) با رفتار غیرورزشی» در بازی با استقلال خوزستان در اهواز، دو جلسه محروم کرد که یک جلسه آن تا پایان فصل تعلیق شده است. آسانی همچنین ۵۰۰ میلیون تومان جریمه شده است.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/7e5d5042c77f427569d8d82f7c03c6ce20915aab-2048x1365.jpg?rect=0,146,2048,1075&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و  "گزارش"], "datetime_fa": "۲۱ آبان • ۱۸:۲۲"}, {"source": "Independent Persian", "title": "سپاه علیه سپاه؛ جنگ قدرت بر سر طرف مذاکره با آمریکا", "link": "https://www.independentpersian.com/node/423182/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D8%B3%D9%BE%D8%A7%D9%87-%D8%B9%D9%84%DB%8C%D9%87-%D8%B3%D9%BE%D8%A7%D9%87%D8%9B-%D8%AC%D9%86%DA%AF-%D9%82%D8%AF%D8%B1%D8%AA-%D8%A8%D8%B1-%D8%B3%D8%B1-%D8%B7%D8%B1%D9%81-%D9%85%D8%B0%D8%A7%DA%A9%D8%B1%D9%87-%D8%A8%D8%A7-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7", "summary": "محمدباقر قالیباف، رئیس مجلس جمهوری اسلامی، در گفت‌وگویی تلویزیونی تاکید کرد که همچنان مسئول اصلی مذاکرات با آمریکا است. پیش از آن رسانه‌های منطقه‌ای گزارش دادند که جی‌دی ونس، معاون اول رئیس‌جمهوری آمریکا، در تلاش برای دیدار مستقیم با محسن رضایی، دبیر شورای عالی امنیت ملی جمهوری اسلامی است. ونس که در مذاکرات اسلام‌آباد با هیئت تحت هدایت قالیباف روبه‌رو شده بود، این بار پیشنهاد ازسرگیری گفت‌وگوها را در نامه‌ای خطاب به رضایی مطرح کرده است. رضایی چند روز پیش از مصاحبه قالیباف، به نمایندگی از مجتبی خامنه‌ای به مسکو رفته بود و در دیدار با ولادیمیر پوتین، پیام رهبر جمهوری اسلامی را به او رساند. نامه ونس، سفر مهم رضایی و تاکید قالیباف بر ادامه مسئولیتش، رقابت دو فرمانده پیشین سپاه بر سر اختیار تصمیم‌گیری درباره جنگ و توافق با آمریکا را علنی‌تر کرده است. پس از کشته‌شدن علی خامنه‌ای، علی لاریجانی و شماری از فرماندهان ارشد سپاه، قالیباف با هدایت مذاکرات به یکی از بانفوذترین چهره‌های جمهوری اسلامی تبدیل شد. حالا در غیبت علنی مجتبی خامنه‌ای، رضایی با تکیه بر نزدیکی به حلقه رهبر جدید و دبیری شورای عالی امنیت ملی، در تعیین شرایط بازگشت به مذاکرات دست بالا را پیدا کرده است. از تفاهم اسلام‌آباد تا شلیک در هرمز اختلاف دو طیف در جریان اجرای تفاهم‌نامه اسلام‌آباد آشکار شد. این تفاهم که ماه خرداد با هدایت هیئت ایرانی به ریاست قالیباف به دست آمد، ازسرگیری تردد کشتی‌های تجاری در تنگه هرمز، کاهش تدریجی محاصره دریایی آمریکا، صدور معافیت برای فروش نفت ایران و فراهم کردن زمینه دسترسی تهران به دارایی‌های مسدودشده را پیش‌بینی می‌کرد. چارچوب اسلام‌آباد ه rtise about China today? I have a lot to ask you about Nvidia, about our relationship to China as a country, as an economy, and about national security. Let s start at the very beginning. From all the reporting we have today, it seems like the United States government has been very worried about a company called Megaspeed and Alice Huang, the alleged Chinese spy at the center of the swirling scandal around Jensen Huang, the CEO of Nvidia. What do we know about Alice Huang and Megaspeed? We have to be careful about what we know and what we don t know. So far, there are allegations that the US intelligence community believes that Alice Huang may be an asset of the Chinese intelligence services. Megaspeed itself is a customer of Nvi", "date_str": "2026-11-12T16:30:00+00:00", "hash": "30081327e3d8d954", "title_fa": "جنسن هوانگ بیرون است. چین از او چه می خواست؟", "summary_fa": "امروز، ما در مورد رسوایی Jensen Huang در Nvidia صحبت می کنیم، که به سرعت در حال توسعه است که ما مجبور شدیم چند دقیقه قبل از انتشار این قسمت، به روز رسانی اضطراری این مقدمه را انجام دهیم. هوانگ به تازگی از سمت خود به عنوان مدیر عامل انویدیا استعفا داد زیرا اخبار مربوط به روابط او، از جمله با یک جاسوس چینی، شرکت را تهدید می کرد. با پیشرفت همه چیز بیشتر در مورد آن داستان خواهیم داشت و یاد می‌گیریم که انویدیا چگونه خود را بعد از جنسن بازسازی می‌کند – بالاخره او چیزی حدود 60 گزارش مستقیم داشت و کل اکوسیستم مالی هوش مصنوعی در شرکت جریان دارد. این طعمه Decoder خالص است. اما همین دو روز پیش با کایل چان، یکی از همکاران سیاست خارجی در مرکز چین جان ال. تورنتون در موسسه بروکینگز، در مورد قلب واقعی این رسوایی صحبت کردم: چین حتی با داشتن یک جاسوس بسیار نزدیک به جنسن، به دنبال چه چیزی است؟ و وضعیت واقعی درگیری هوش مصنوعی آمریکا و چین، به ویژه از دیدگاه چین، واقعاً چگونه به نظر می رسد؟ پاسخ‌های کایل در مورد تراشه‌ها و اینکه چین چگونه به اصطلاح «مسابقه» هوش مصنوعی را درک می‌کند بسیار روشن‌کننده بود، اما شاید جالب‌تر این بود که مشاهده او درباره رابطه جنسن هوانگ با ترامپ مهم‌ترین چیز از همه چیز بود – زیرا شاید چیزی ed to the Netherlands in October 1997 to start a new life with the man who would eventually become my husband. I was 19 and, aside from my family and education, there wasn't much tying me down to the US. I was young, free, and fearless. Reality hit hard during those first months, though: Even the rosy glow of love couldn't have prepared me for the culture shock and loneliness. I wondered how I would ever learn the language, get an education, find a job, and feel at home. Undeterred, I immediately began learning Dutch. By the following May, I was studying journalism at a local university. Over the next five years, I married my partner, had a daughter, and enrolled in a graduate program, where I earned a degree in Dutch Studies. By 2008, I had become a Dutch citizen, launched a writing career, and bought a beautiful four-bedroom home with a glorious garden and dreamy kitchen in Almere, a city in the heart of the Netherlands. Three years later, I landed a dream remote job as a magazine editor. I was settled, happy, and doing well. And then, I started thinking about leaving. I fell head over heels for a small town in the French countryside Duras won me over the first time I visited. Hans Westbeek I still remember how I felt the first time I visited Duras, a village in southwest France surrounded by vineyards, prune orchards, and sunflower fields. It was 2009, and I was staying with my husband and 9-year-old daughter at a little cottage a stone's throw from the town center. I remember laying eyes on the Château de Duras — a majestic castle that has stood in the village since the 12th century — and feeling an immediate connection that I couldn't quite explain. In the years that followed, we spent at least two weeks there every summer, and each time we drove away, it felt like I was leaving a little piece of my heart behind. My husband was just as captivated, too. Before long, we started asking ourselves the obvious question: What about actually living there? By 2022, we'd started genuinely considering a move, but it felt daunting. Could I really start all", "date_str": "2026-11-12T16:27:01+00:00", "hash": "031974ae118d427a", "title_fa": "من دهه ها را صرف ساختن زندگی در هلند کردم. در اواخر دهه 40 زندگی ام، خانه ام را فروختم و به یک دهکده کوچک فرانسوی نقل مکان کردم.", "summary_fa": "در اواخر دهه 40، تصمیم گرفتم به دنبال قلبم بروم و زندگی جدیدی را در حومه فرانسه آغاز کنم. Hans Westbeek من 29 سال پیش به هلند نقل مکان کردم تا زندگی جدیدی را با همسر فعلی خود شروع کنم. من یک کار عالی پیدا کردم، یک خانه خریدم و یک دختر در آنجا داشتم، اما همیشه آرزو داشتم به فرانسه بروم. بالاخره من و شوهرم تصمیم گرفتیم ریسک کنیم و خانه ای در حومه فرانسه بخریم. من در نیوجرسی بزرگ شدم، اما در اکتبر 1997 به هلند نقل مکان کردم تا زندگی جدیدی را با مردی شروع کنم که در نهایت شوهر من خواهد شد. من 19 ساله بودم و جدای از خانواده و تحصیلاتم، چیز زیادی مرا به ایالات متحده مقید نمی کرد. من جوان، آزاد و نترس بودم. با این حال، واقعیت در آن ماه‌های اول به شدت ضربه خورد: حتی درخشش گلگون عشق هم نمی‌توانست مرا برای شوک فرهنگی و تنهایی آماده کند. فکر می کردم چگونه می توانم زبان یاد بگیرم، تحصیل کنم، شغلی پیدا کنم و احساس کنم که در خانه هستم. من که دلسرد نشدم، بلافاصله شروع به یادگیری زبان هلندی کردم. در ماه مه بعد، در یکی از دانشگاه های محلی روزنامه نگاری می خواندم. در طی پنج سال بعد، با شریکم ازدواج کردم، صاحب یک دختر شدم و در یک برنامه تحصیلات تکمیلی ثبت نام کردم و در آنجا مدرک مطالعات هلندی گرفتم. در سال 2008، من یک شهروند هلندی شدم، حرفه نویسندگی را شروع کردم و یک خانه چهار خوابه زیبا با باغی باشکوه و آشپزخانه رویایی در شهر آلمره، شهری در قلب هلند، خریدم. سه سال بعد، به عنوان سردبیر مجله، شغلی از راه دور پیدا کردم. من آرام بودم، خوشحال بودم و حالم خوب بود. و بعد، شروع کردم به فکر رفتن. من به خاطر شهر کوچکی در", "image_url": "https://i.insider.com/6af339a6a96052a81c349858?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۱ آبان • ۱۹:۵۷"}, {"source": "Business Insider", "title": "Wall Street analysts are turning on once-unassailable Nvidia stock as Jensen Huang departs", "link": "https://www.businessinsider.com/nvidia-stock-nvda-outlook-jensen-huang-departs-wall-street-downgrades-2026-11", "summary": "Jensen Huang officially resigned as Nvidia CEO on Thursday after reports circulated about his alleged affair with a company executive. Jose Sarmento Matos/Bloomberg via Getty Images The Jensen Huang scandal has shaken Wall Street's bullish views on Nvidia. The CEO resigned after the latest reports of an affair with a company insider. Bernstein analysts said they \"had enough,\" joining a wave of downgrades on the stock. Wall Street analysts have seen enough. The bullish tide is turning for Nvidia as banks issue a wave of downgrades on the stock amid the scandal roiling the chipmaker. Nvidia was once unassailable, with few analysts willing to even hold a neutral rating. That changed rapidly this week, beginning with a few tentatively downbeat views on the company in light of Huang's affairs, which gave way to a deluge of downgrades on Thursday shortly before Jensen Huang stepped down as CEO. CFO Colette Kress will take over as interim CEO. The situation has been a nightmare for investors, who had been fretting about Huang's tenure at the chipmaker amid revelations about an affair with a suspected Chinese spy and another relationship with Nvidia insider Kimberly Powell, the company's vice president of health care. Huang has been the face of the AI since the boom kicked off at the end of 2022, steering the company through an enormous growth cycle that's sent the stock soaring. Analysts hit the stock with a series of downgrades as the sell-off accelerated. Nvidia, once the world's most valuable company by market cap, plunged another 11%. The stock is down 27% from its peak in early October. Here's what analysts are saying about Huang's departure: Bernstein: \"Where did he find the time?\" In a note leading up to Huang's exit, Bernstein slashed its rating on Nvidia from \"Outperform\" to \"Market-Perform\" and lowered its price target from $400 to $200. In a separate note earlier this week, analysts pointed to the recent New York Times report that unveiled Huang's second publicly known affair with Kimberly Powell , Nvidia's vice president of healthcare. \"Where did he find the time? a team led by Stacy Rasgon, a senior analyst at the firm, wrote. \"We've had enough, and prefer to watch from the sidelines.\" Dan Ives: \"Dark moment\" for Nvidia Tech bull Dan Ives slashed his price target on Nvidia from $300 to $225 a share. Previously, he said that if Huang were to depart Nvidia, the stock could fall as much as 30%. Ives, who has relentlessly aired his bullish view of Nvidia", "date_str": "2026-11-12T16:15:25+00:00", "hash": "0930f7d769aa3d98", "title_fa": "با خروج جنسن هوانگ، تحلیلگران وال استریت در حال بررسی سهام غیرقابل انکار انویدیا هستند.", "summary_fa": "جنسن هوانگ روز پنجشنبه پس از انتشار گزارش هایی در مورد رابطه نامشروع وی با یکی از مدیران شرکت، رسماً از سمت مدیرعاملی انویدیا استعفا داد. خوزه سارمنتو ماتوس/ بلومبرگ از طریق گتی ایماژ رسوایی جنسن هوانگ دیدگاه های صعودی وال استریت در مورد انویدیا را متزلزل کرده است. مدیرعامل پس از آخرین گزارش ها مبنی بر رابطه نامشروع با یکی از اعضای شرکت از سمت خود استعفا داد. تحلیلگران برنشتاین گفتند که آنها \"به اندازه کافی داشتند\" و به موج کاهش ارزش سهام پیوستند. تحلیلگران وال استریت به اندازه کافی دیده اند. موج صعودی برای انویدیا تغییر می کند زیرا بانک ها موجی از کاهش ارزش سهام را در بحبوحه رسوایی که سازنده تراشه را آزار می دهد، صادر کردند. انویدیا زمانی غیرقابل نفوذ بود و تعداد کمی از تحلیلگران حاضر به کسب رتبه خنثی بودند. این وضعیت به سرعت در این هفته تغییر کرد و با چند دیدگاه احتمالی ضعیف در مورد شرکت در پرتو امور هوانگ شروع شد، که در روز پنج‌شنبه کمی قبل از کناره‌گیری جنسن هوانگ از سمت مدیرعاملی، جای خود را به سیل کاهش رتبه‌ها داد. کولت کرس، مدیر ارشد مالی، به عنوان مدیرعامل موقت این سمت را بر عهده خواهد گرفت. این وضعیت برای سرمایه‌گذارانی که در میان افشاگری‌ها در مورد رابطه با یک جاسوس چینی مظنون و رابطه memos obtained by Business Insider. Kress said leadership would host a company meeting on November 18 about Nvidia's future, while Jones said the company's board was searching for a permanent successor and considering both internal and external candidates. Read both memos in full below: Colette Kress: Dear NVIDIANs, I believe deeply in this company and in its future. More than anything, I believe in each of you, in our customers and partners and in the vital role we play every day in the global economy. The Board, Estaff and I recognize that this has been an extraordinarily difficult period and I want you to know how grateful we are for your resilience, professionalism and continued dedication. Thank you. This company has achieved so much because of the work that all of you bring to it every single day. You are our greatest strength. You will hear more from leadership in the coming days about our future together, and we will host a company meeting on November 18 at 9am PT. We play a vital role in building the technology that is powering the AI revolution, and we have important work ahead of us. So let's move forward together, with the same determination and commitment that have always defined this company. Thank you for all you do, Colette Harvey Jones: Dear NVIDIA Employees, I am writing to share an important update. Jensen has resigned as CEO and Board Member, and the Board has asked our Chief Financial Officer Colette Kress to serve as interim CEO while it conducts a search for a permanent successor looking at both internal and external candidates. I will serve as the first-ever Chair of the Board. As CFO for over 13 years, Colette has been a key architect of NVIDIA's growth and capital strategy. She possesses a deep understanding of this business and the markets in which we operate. Th", "date_str": "2026-11-12T15:54:22+00:00", "hash": "a979e13608cf3e39", "title_fa": "یادداشت های ارسال شده برای کارمندان انویدیا پس از استعفای جنسن هوانگ را بخوانید", "summary_fa":  Henao I'm in my 20s and moved into a 76-year-old stranger's spare bedroom in New York City . My roommate, Carmelina, and I are very close, and she's inspired me to step outside my comfort zone. Now, I see Carmelina as the grandmother I always wished I had. When I graduated from college in New York City, I had big dreams of kicking off my career in television. Instead, I found myself moving back in with my parents in the South Florida suburbs. I'd graduated amid the historic Writers Guild of America strike that lasted over 100 days and struggled to find a full-time gig in my field. Heading back home felt like the best option for me while I got my footing financially and figured out my next move. So, I found a job in Miami and took on a two-hour commute that left me exhausted and with an extensive list of excuses for not socializing with friends. Since I was living at home, I hardly left my comfort zone. After three years in Florida, I still found myself yearning for the life I'd left behind in NYC. So, I decided to move back — no job and no plan. Aware of the harsh housing market , I needed an affordable, flexible living arrangement. And just like magic, the perfect solution arose. A quick phone call led to a new beginning for me When discussing my move with a family friend, she mentioned she'd pursued her master's in NYC a few years back. During this time, she lived with a 76-year-old Colombian woman named Carmelina who rented out her spare bedroom in Queens. I decided to reach out to Carmelina — whose WhatsApp profile picture was a bushel of pink flowers — and the call lasted about four minutes. She told me her spare room was available for just a few months, and asked only for my move-in date and if I liked arepas — because she knew a guy who made them from scratch. When I asked how much the monthly rent would be, she told me $700 — a special price for being recommended by my family friend, who she adored. When I arrived in Queens that August, it hit me that I didn't even know what my new roommate looked like. I waited on the street outside the building until a petite woman with brown sunglasses and a bouncy blowout called out my name. Not long after, I sat in Carmelina's dining room while she heated up the Colombian dish she'd cooked to celebrate my arrival. It felt like a true homecoming, to be received in the city I loved by food from my own culture. As I ate, she told me she'd b", "date_str": "2026-11-12T15:51:33+00:00", "hash": "88701b50856a65d6", "title_fa": "در 20 سالگی به نیویورک نقل مکان کردم و با یک غریبه 76 ساله نقل مکان کردم.", "summary_fa": "من با یک غریبه 76 ساله در شهر نیویورک نقل مکان کردم. آندریا فرناندز هنائو من در 20 سالگی هستم و به اتاق خواب یدکی یک غریبه 76 ساله در شهر نیویورک نقل مکان کردم. من و هم اتاقی ام، کارملینا، بسیار صمیمی هستیم، و او به من الهام داد که از منطقه امن خود خارج شوم. اکنون، کارملینا را به عنوان مادربزرگی می بینم که همیشه آرزو داشتم داشته باشم. وقتی از کالج در شهر نیویورک فارغ التحصیل شدم، رویاهای بزرگی برای شروع کارم در تلویزیون داشتم. در عوض، متوجه شدم که با پدر و مادرم در حومه فلوریدا جنوبی نقل مکان کردم. من در بحبوحه اعتصاب تاریخی انجمن نویسندگان آمریکا که بیش از 100 روز به طول انجامید فارغ التحصیل شده بودم و در تلاش برای یافتن یک کنسرت تمام وقت در رشته خود بودم. بازگشت به خانه بهترین گزینه برای من بود در حالی که از نظر مالی شرایطم را پیدا کردم و حرکت بعدی ام را مشخص کردم. بنابراین، در میامی شغلی پیدا کردم و دو ساعت رفت و آمد کردم که باعث شد خسته‌ام و فهرست گسترده‌ای از بهانه‌هایی برای عدم معاشرت با دوستانم داشته باشم. از آنجایی که در خانه زندگی می کردم، به سختی از منطقه امن خود خارج شدم. پس از سه سال اقامت در فلوریدا، هنوز در آرزوی زندگی ای که در نیویورک به جا گذاشته بودم، بودم. بنابراین، تصمیم گرفتم به عقب برگردم - بدون کار و بدون برنامه. با آگاهی از بازار سخت مسکن، به یک ترتیب زندگی منعطف و مقرون به صرفه نیاز داشتم. و درست مانند جادو، راه حل عالی پدید آمد. یک تماس تلفنی سریع منجر به شروع جدیدی برای من شد وقتی در مورد نقل مکانم با یکی از دوستان خانوادگی صحبت می‌کردم، او گفت که چ s’s CEO, he became its executive chairman. He later co-founded Tensilica, which Cadence Design Systems acquired in 2013, according to Nvidia’s board biography. He has managed investment firm Square Wave Ventures since 2004. Nvidia's 2026 proxy statement described Jones as an independent director and financial expert serving on its audit, nominating, and corporate governance committees. \"Mr. Jones brings to the board an executive management background, an understanding of semiconductor technologies and complex system design,\" a biography of Jones in the proxy statement said. \"He provides valuable insight into innovation strategies, research and development efforts, as well as management and development of our technical employees. His significant financial community experience gives the Board an understanding of the methods by which companies can increase value for their stockholders.\" It reported that he beneficially owned about 7 million Nvidia shares as of March 23, including shares held in ", "date_str": "2026-11-12T15:47:32+00:00", "hash": "32fbffe726b6b6a6", "title_fa": "آنچه در مورد صندلی جدید انویدیا می دانیم، هاروی جونز، یک کهنه سرباز 73 ساله که به مدت 3 دهه در هیئت مدیره بوده است.", "summary_fa": "اطلاعات کمی در مورد صندلی جدید انویدیا، هاروی جونز وجود دارد. ژان چانگ/ بلومبرگ از طریق Getty Images هاروی جونز، مدیر اجرایی و سرمایه‌گذار کهنه کار فناوری، به عنوان اولین رئیس انویدیا انتخاب می‌شود. جونز که از سال 1993 در هیئت مدیره انویدیا بوده است، پس از استعفای جنسن هوانگ، مدیرعامل انویدیا، این نقش را بر عهده می گیرد. جونز درباره پیوستن به هیئت مدیره در مصاحبه ای در سال 2009 گفت: «در ابتدا این یک سرگرمی بود. با استعفای جنسن هوانگ، مدیرعامل انویدیا و جایگزینی آن توسط Colette Kress، مدیر ارشد اجرایی انویدیا، این غول تراشه نیز تغییر بزرگ دیگری ایجاد کرد. در اعلامیه خود مبنی بر استعفای هوانگ، انویدیا گفت که هاروی جونز، عضو قدیمی هیئت مدیره را به عنوان اولین رئیس خود معرفی کرده است. جونز، 73 ساله، نام آشنای نیست، و او به ندرت مصاحبه کرده است. اطلاعات کمی در مورد t a Strawberry Bearista cup was being released. I knew I'd have to get in line early so I wouldn't miss it like I had the original, so I arrived at the store at 4:30 am. There was a huge line for that one. But then, for the next drop — the Snoopy Bearista cup — the line was surprisingly pretty short. I really wanted the Snoopy cup because it just felt so nostalgic. For that one, I arrived at 4 a.m. I woke up in the middle of the night to go to Starbucks For the last couple of weeks, the Starbucks Facebook groups I'm in have been full of news that a mystery Bearista cup was going to be dropped next. I knew this would be a super popular one, just because of the mystery element. Yolanda Cole was fourth in line at her local Starbucks. Courtesy of Yolanda Cole On Tuesday morning, I woke up at 3:30 a.m., drove for six minutes to my closest Starbucks, and waited in line with about 20 other people for the store to open at 5 a.m. I was fourth in line. Everyone in line chit-chatted while waiting. I actually knew one of the people in line from the last drop, a little community of collectors developing. While lots of the people waiting were genuine collec", "date_str": "2026-11-12T15:20:49+00:00", "hash": "0d8456b75bfbcd92", "title_fa": "من 12 سال است که فنجان های استارباکس را جمع آوری کرده ام. من هرگز چیزی شبیه به دیوانگی Bearista ندیده ام.", "summary_fa": "یولاندا کول بیرون استارباکس اردو زد تا جام جدید Bearista را دریافت کند. با حسن نیت از یولاندا کول یولاندا کول، 45 ساله، در 12 سال گذشته کالاهای استارباکس را جمع آوری کرده است. او اخیراً در ساعت 3:30 صبح از خواب بیدار شد تا یک فنجان مرموز Bearista را از استارباکس محلی خود دریافت کند. او گفت جمع آوری فنجان ها فقط یک چیز کوچک است که او را خوشحال می کند. این مقاله همانطور که گفته شد بر اساس گفتگو با یولاندا کول است. برای طول و وضوح ویرایش شده است. من سالهاست که عاشق کالاهای استارباکس هستم. فنجان های گل میخی آنها اولین فنجان در مجموعه من بود - من تعداد زیادی از آنها را دارم که قدمت آنها به 12 سال پیش می رسد - اما هرگز نیازی نداش  months — laid out in a Substack post why he expected Nvidia to suffer without Huang in charge. Huang has \"orchestrated\" Nvidia's efforts to expand the AI ecosystem, Burry wrote. He pointed to its huge investments in AI stocks, and its use of special vehicles and hidden debt to finance customers' purchases of its chips, creating \"tremendous leverage in the system.\" He also claimed that Huang pushed customers to buy chips they didn't need yet by threatening to reduce their allocations in the future. Without Huang at Nvidia's helm, the \"cash may cease to flow, \" and investments could dry up or be written off, Burry wrote. Customers will be free to \"slow down deals, push back, renegotiate terms, or simply walk to a competitor without fear of offending\" the chip chief , he continued. \"Nvidia's business will not disappear, but its growth may slow and, critically, its margins may fall,\" Burry added. \"The terms of trade and the architecture of financing were the secret sauce that supercharged an already dominant technology,\" he wrote, adding that it will \"take time for this Byzantine web to untangle and unwind.\" \"Nvidia bulls will have another fluffy big chance to get out,\" Burry added. \"Get out.\" Nvidia stock plunged at the start of trading on Thursday and has seen a near-35% drop from its $ 243-per-share peak in early October. Burry, who shot to fame after his prescient bet against the mid-2000s housing bubble was featured in the book and movie \"The Big Short,\" pivoted from running a hedge fund to writing about his personal investments last year. He's one of several commentators who soured on Nvidia in recent days. Bernstein Research's Stacy Rasgon downgraded the stock to \"Market Perform\" and halved his price ta", "date_str": "2026-11-12T15:20:41+00:00", "hash": "91d697b37c873351", "title_fa": "مایکل بری می‌گوید: «از سهام انویدیا خارج شوید».", "summary_fa": "مایکل بری، سرمایه‌گذار مشهور The Big Short. بلومبرگ/گتی ایماژ، جنسن هوانگ، مدیرعامل انویدیا، روز پنجشنبه پس از ادعاهای تازه مبنی بر خیانت زناشویی از سمت خود استعفا داد. مایکل بری از \"The Big Short\" گفت که انویدیا بدون او لنگ خواهد زد و گاوها باید \"بیرون بروند\". بری هشدار داد که خروج هوانگ می تواند رشد انویدیا را کاهش دهد و حاشیه سود آن را کاهش دهد. مایکل بری می گوید خروج جنسن هوانگ ضربه سنگینی به انویدیا وارد می کند و سرمایه گذاران باید سهام خود را قبل از سقوط شرکت بفروشند. هوانگ صبح پنجشنبه به دنبال گزارش‌های تازه درباره دو رابطه خارج از ازدواج از سمت مدیرعاملی تراشه‌ساز هوش مصنوعی استعفا داد. پس از اینکه در روز چهارشنبه مشخص شد که هیئت مدیره انویدیا در حال بررسی برکناری هوانگ است، بری - که ماه‌ها است علناً علیه انویدیا شرط‌بندی می‌کرده است - در یک پست Substack توضیح داد که چرا انتظار داشت انویدیا بدون سرپرستی هوانگ آسیب ببیند. بری نوشت، هوانگ تلاش‌های انویدیا را برای گسترش اکوسیستم هوش مصنوعی «سازمان‌دهی» کرده است. او به سرمایه‌گذاری‌های عظیمش در سهام هوش مصنوعی و استفاده از وسایل نقلیه ویژه و بدهی‌های پنهان برای تأمین مالی خرید تراشه‌هایش توسط مشتریان اشاره کرد که «اهرمی فوق‌العاده در سیستم» ایجاد کرد. او همچنین ادعا کرد که هوانگ با تهدید به کاهش تخصیص آنها در آینده، مشتریان را به خرید تراشه‌هایی که هنوز به آن‌ها نیاز نداشتند، سوق داد. بری نوشت، بدون هوانگ در راس انویدیا، «جریان نقدینگی ممکن است متوقف شود» و سرمایه‌گذاری‌ها ممکن است خشک شوند یا از بین بروند. او ادامه داد که مشتریان آزاد خواهند بود تا \"معاملات را کاهش دهند، عقب نشینی کنند، در مورد شرایط مذاکره مجدد کنند، یا به سادگی به سراغ رقیب بروند بدون ترس از توهین\" رئیس تراشه. بری افزود: «کسب و کار انویدیا ناپدید نخواهد", "image_url": "https://i.insider.com/6af5b7550cc3ffba8779c4b2?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "تراشه", "سینما"], "datetime_fa": "۲۱ آبان • ۱۸:۵۰"}, {"source": "Business Insider", "title": "The biggest winner from Jensen Huang's downfall is China", "link": "https://www.businessinsider.com/nvidia-ceo-jensen-huang-downfall-benefits-china-ai-race-2026-11", "summary": "Nvidia s Jensen Huang speaking at a conference in San Francisco Alistair Barr/Business Insider Nvidia's market value drops more than $300 billion as Jensen Huang resigns. Analysts warn removing Huang weakens America's AI lead as China tries to catch up. Huang had a romantic relationship with a woman who may be a Chinese spy. How valuable is a CEO? Often, it's hard to say. Sometimes, though, a series of unusual events provides a crystal-clear answer. On Thursday morning, Nvidia CEO Jensen Huang resigned after a New York Times report alleged Huang had an affair with a subordinate. That followed revelations earlier this week that he also had a romantic relationship with a possible Chinese spy . Just the concern that Huang would be out knocked Nvidia shares down about 8% in after-hours trading on Wednesday, wiping more than $300 billion off the company's market value. The Chinese spy allegations were already known days ago. The new news today is that Jensen Huang has been ousted as CEO. So we have our answer: Huang is worth at least $300 billion. That's more than Morgan Stanley and Goldman Sachs, the world's most important investment banks. And quite right, too. Huang is \"the architect of the US AI trajectory,\" Stacy Rasgon, a top chip analyst from Bernstein Research, wrote in a note to investors earlier this week. This is the most powerful new technology to emerge since the dawn of the internet 30 years ago. And the US is in the lead — well ahead of China in second place. Now, with Huang out, America's AI lead looks shakier. \"We can't even begin to speculate as to who they might find to fill Jensen's shoes,\" Rasgon wrote in a note to investors Wednesday evening. He slashed Nvidia's price target to $200 from $400. On Thursday, Nvidia announced CFO Colette Kress would serve as interim CEO. Earlier in the week, Rasgon warned of the geopolitical risks if Huang was forced to step down. \"The primary beneficiary of Jensen's removal as Nvidia's CEO would clearly be China; we hope cooler heads prevail,\" he wrote. On Wednesday night, other analysts shared similar concerns. \"This would be a setback for the US, particularly as China continues aggressively investing in its own AI capabilities,\" Brad Gastwirth, global head of research at Circular Technology, told me. \"Removing Jensen would be a tremendous mistake,\" he added. \"Nvidia is central to America's AI leadership, and losing Jensen at this stage could create unnecessary disruption.\" Nvidia's board had serious questi", "date_str": "2026-11-12T15:20:21+00:00", "hash": "32888b1f7841b6ce", "title_fa": "بزرگترین برنده سقوط جنسن هوانگ چین است", "summary_fa": "جنسن هوانگ از Nvidia در کنفرانسی در سانفرانسیسکو Alistair Barr/Business Insider با استعفای جنسن هوانگ ارزش بازار انویدیا بیش از 300 میلیارد دلار کاهش یافت. تحلیلگران هشدار می دهند که حذف هوانگ باعث تضعیف قدرت هوش مصنوعی آمریکا در حالی که چین تلاش می کند عقب نشینی کند. هوانگ با زنی که ممکن است جاسوس چینی باشد رابطه عاشقانه داشت. یک مدیر عامل چقدر ارزش دارد؟ اغلب، گفتن آن سخت است. با این حال، گاهی اوقات، یک سری از رویدادهای غیرمعمول پاسخ روشنی را ارائه می دهد. صبح پنجشنبه، جنسن هوانگ، مدیرعامل انویدیا، پس از گزارش نیویورک تایمز مبنی بر اینکه هوانگ با یکی از زیردستان رابطه داشته است، استعفا داد. این به دنبال افشای اوایل این هفته مبنی بر اینکه او همچنین با یک جاسوس احتمالی چینی رابطه عاشقانه داشته است. تنها نگرانی از کنار رفتن هوانگ، سهام انویدیا را در معاملات پس از ساعت کاری روز چهارشنبه حدود 8 درصد کاهش داد و بیش از 300 میلیارد دلار از ارزش بازار شرکت را از بین برد. اتهامات جاسوسی چین از روزها قبل شناخته شده بود. خبر جدید امروز حاکی از برکناری جنسن هوانگ از سمت مدیرعاملی است. بنابراین ما پاسخ خود را داریم: هوانگ حداقل 300 میلیارد دلار ارزش دارد. این رقم بیشتر از مورگان استنلی و گلدمن ساکس، مهم ترین بانک های سرمایه گذاری جهان است. و کاملاً درست است. استیسی راسگون، تحلیلگر ارشد تراشه از Bernstein Research، در یادداشتی به سرمایه گذاران در اوایل این هفته نوشت، هوانگ «معمار مسیر هوش مصنوعی ایالات متحده» است. این قدرتمندترین فناوری جدیدی است که از زمان پیدایش اینترنت در 30 سال پیش ظهور کرد w this living situation would be challenging, especially since I work as a private tutor and was previously taking college classes online, I wanted to take advantage of this opportunity to see new places and travel with my husband. Typically, each of our hotel rooms consists of a bed, a full bathroom, a refrigerator, a microwave, and sometimes a stovetop and dishwasher. Whether it's a full bedroom or a studio setup, a majority of the rooms we've stayed in have a living room space with a pullout couch. Regardless of the room, we always bring pillows, blankets, a dehumidifier, our air fryer, gaming consoles , and a heavy-duty safe for personal items. Plus, despite the small space, we still try to make our hotel room feel like home, especially during the holidays. Last fall, my family visited and brought classroom-style paper turkeys my mom made to add some festivity, and we also taped decorations to the picture frames already hanging on the walls. Each room typically has a bed, bathroom, fridge, microwave, and a pullout couch. Lilli Holland Even though we're in a hotel, we still have a steady routine in place. My husband still goes to work. I still pr", "date_str": "2026-11-12T15:02:01+00:00", "hash": "23d23d13cb1a09e5", "title_fa": "ما هر بار ماه ها را با 2 سگ خود در هتل ها زندگی می کنیم. به نظر می رسد یک تعطیلات است، اما همیشه شبیه تعطیلات نیست.", "summary_fa": "زندگی در هتل ها در سراسر ایالات متحده در دو سال گذشته چالش برانگیز بوده است، اما ما آن را به کار انداختیم. لیلی هالند در دو سال گذشته، من با شوهرم و دو سگمان در هتل های سراسر کشور زندگی کرده ام. ما یک روال ثابت پیدا کرده ایم، اما زندگی در یک فضای کوچک، گاهی اوقات بدون آشپزخانه، آسان نیست. نداشتن خانه دائمی سخت است، اما سفر به نقاط مختلف ایالات متحده عالی بوده است. در اکثر دو سال گذشته، \"خانه\" به معنای زندگی در اتاق های مختلف هتل در سراسر کشور بوده است. شغل شوهرم مرتباً او را به شهرهای مختلف در سراسر ایالات متحده می فرستد و من با دو سگ 45 پوندی خود همراه او می روم. ما چهار نفر معمولاً به مدت سه ماه در یک ات ld name in the AI industry, and minted Huang as a billionaire and one of the wealthiest people in the world. All of it came crashing down in November 2026, when Nvidia's board of directors abruptly announced Huang's resignation following his disclosure that he had been unfailfull to his wife and after reports of multiple affairs, including an alleged relationship with a direct report. His resignation came as Wall Street and Washington were still processing a New York Times report that he had a close relationship with someone whom U.S. officials suspected of being a Chinese intelligence asset. Here's a look at Jensen Huang's career rise and background. Early life, education Huang was born in Taiwan in 1963. He spent some of his childhood there and in Thailand before his parents sent Huang and his brother to the US to live with an uncle in Tacoma, Washington. His uncle sent him to Oneida Baptist Institute in Kentucky, but after Huang's parents immigrated to the US, the family lived in Oregon. He graduated from high school at age 16 before going to college. Huang got his bachelor's degree in electrical engineering from Oregon State University and his master's degree in electrical engineering from Stanford University. Huang got his first job at 15. He washed dishes and bussed and waited tables at a Denny's in Portland. Before founding Nvidia, Huang worked at computer chip manufacturer LSI Logic from 1985 to 1993 and at semiconductor company AMD, or Advanced Micro Devices, from 1984 to 1985. Huang, Priem, and Malachowsky founded Nvidia in 1993. David Paul Morris/Bloomberg via Getty Images Founding Nvidia, leading company as CEO At a Denny'", "date_str": "2026-11-12T14:55:07+00:00", "hash": "61c78de5f5e51e76", "title_fa": "ظهور و سقوط شغلی جنسن هوانگ، بنیانگذار و مدیر عامل سابق انویدیا", "summary_fa": "جنسن هوانگ، مدیر عامل انویدیا، در لاس وگاس در لاس وگاس صحبت می کند. MANDEL NGAN/AFP از طریق Getty Images اگر در مورد هوش مصنوعی شنیده اید، احتمالاً با Nvidia نیز آشنایی دار انویدیا مدیر اجرایی جدیدی پیدا کرد که با یک جاسوس چینی رابطه عاشقانه داشته است. این شرکت روز پنجشنبه گفت جنسن هوانگ از سمت خود به عنوان رئیس و مدیر اجرایی انویدیا استعفا داده است، تنها چند روز پس از اعتراف وی به رابطه عاشقانه با یک جاسوس چینی که جرقه بحران امنیت ملی در ایالات متحده را برانگیخت. انویدیا در یک پرونده نظارتی گفت که هیئت مدیره آن استعفای هوانگ را در روز چهارشنبه پذیرفت. انویدیا اعلام کرد که مدیر مالی فعلی و معاون اجرایی آن، کولیت کرس، تا زمانی که شرکت جانشین دائمی پیدا کند، به عنوان مدیر عامل موقت این شرکت انتخاب خواهد شد. کرس به عنوان مدیر مالی شرکت به خدمت خود ادامه خواهد داد. سهام انویدیا در معاملات صبح روز پنجشنبه نزدیک به 12 درصد کاهش یافت. از روز جمعه، سهام این شرکت تا 19 درصد کاهش یافته است که منجر به از دست دادن ارزش بازار بیش از 855 میلیارد دلار شده است. هوانگ انویدیا را در سال 1993 تاسیس کرد و از آن زمان تاکنون به عنوان مدیرعامل آن را رهبری می کند. تحت رهبری او، انویدیا نقش مهمی در توسعه واحد پردازش گرافیکی (GPU) ایفا کرد، یک تراشه تخصصی که پردازش گرافیکی را برای رایانه های شخصی انجام می دهد، همانطور که امروز می شناسیم. تراشه‌ها فورا مورد استقبال قرار نگرفتند و روزهای اولیه Nvidia با مبارزه و اخراج مشخص می‌شد، اما در نهایت، طراحی گرافیکی آن به قدری خوب بود که به استانداردی برای پردازش گرافیکی تبدیل شد. این تراشه‌ها همچنین در انجام همزمان تعداد زیادی محاسبات بسیار خوب عمل می‌کنند، که باعث محبوبیت آن‌ها برای کارهای محاسباتی مانند استخراج رمزنگاری و اخیراً آموزش و اجرای شبکه‌های عصبی، که مدل‌های هوش مصنوعی در هسته آن‌ها هستند، شده است.", "image_url": "https://techcrunch.com/wp-content/uploads/2025/03/GettyImages-2205210966.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۲۱ آبان • ۱۷:۴۰"}, {"source": "Ars Technica", "title": "Google pushes privacy angle as Gemini-powered smartglasses debut starting at $395", "link": "https://arstechnica.com/google/2026/11/google-pushes-privacy-angle-as-gemini-powered-smartglasses-debut-starting-at-395/", "summary": "Smartglasses have always faced an uphill road to acceptance. Not only is propping a computer up on your nose an uncomfortable proposition, but the privacy aspect has been vexing people since the Google Glass days . Now, Google is ready to take another swing at \" intelligent eyewear \" for the Gemini era after previewing its plans a couple of times. The first glasses are up for preorder today from Gentle Monster and Warby Parker, but they're no impulse buy. These devices are a collaboration between Google, Samsung, and the aforementioned eyewear designers. Gentle Monster and Warby Parker have each designed a few different frames, with options for transparent and tinted lenses. Samsung is providing the computing hardware that fits inside them, and Google has the software covered. Warby Parker has designed three frames for Google eyewear, called Alden, Reid, and Wren (see above). They are available with both standard optical and sun lenses in Pine, Saddle, and Jet Black colors at $395 and higher. Warby Parker is only selling devices in the US. Gentle Monster has gone a bit further with six styles, but Google hasn't told us any names for those yet. They come in dark red, pink, gray, and yellow colors and are available with clear, tinted, blue, or brown lenses. The Gentle Monster styles start a little higher at $449, and they will be available in the US and South Korea. Read full article Comments", "date_str": "2026-11-12T14:50:17+00:00", "hash": "741f9d666d3854d8", "title_fa": "گوگل با شروع اولین عینک هوشمند مجهز به جمینی که از 395 دلار شروع می شود، زاویه حریم خصوصی را افزایش می دهد.", "summary_fa": "عینک‌های هوشمند همیشه با مسیری سربالایی برای پذیرش روبرو بوده‌اند. نه تنها قرار دادن رایانه روی بینی شما یک پیشنهاد ناراحت کننده است، بلکه جنبه حفظ حریم خصوصی افراد را از روزهای Google Glass آزار می دهد. اکنون، گوگل پس از چند بار پیش‌نمایش برنامه‌های خود، آماده است تا تغییر دیگری در «عینک‌های هوشمند» برای عصر جمینی انجام دهد. اولین عینک امروز از Gentle Monster و Warby Parker برای پیش‌سفارش آ ife alone, first grocery shopping for some Happy Crunch cereal then walking past an Expo Tech Fest that showcases the first Guardianbot, among other technological innovations. The clip s melancholy vibes are only driven home by Karen O s wistful vocals on the new song. Watch the clip below: Kid Koala (Eric San) is a Canadian DJ, producer and composer who also helmed the film s original score , which, in addition to Karen O, features Icelandic singer/songwriter Emilíana Torrini, Ladybug Mecca from Digable Planets, Belgian-American instrumentalist Trixie Whitley and Canadian musician/visual artist Meaghan Smith. Find tickets in a movie theater near you through Kid Koala s website here .", "date_str": "2026-11-12T17:00:00+00:00", "hash": "d5285403c44782fd", "title_fa": "قبل از اکران فیلم انیمیشنی در سینما، آهنگ اصلی کارن او به نام «Soft Machine» را در «Space Cadet» از Kid Koala بشنوید.", "summary_fa": "موسیقی یکی از محورهای فیلم کادت فضایی است، اقتباسی از رمان گرافیکی کید کوالا در سال 2011 با همین نام، به ویژه با توجه به اینکه هیچ دیالوگی در فیلم متحرک بصری قابل توجه وجود ندارد. پس از نمایش در جشنواره بین‌المللی فیلم برلین در سال گذشته، این فیلم به کارگردانی Kid Koala در روز جمعه وارد سینماهای منتخب می‌شود و بیلبورد یک کلیپ اختصاصی در زیر دارد که موسیقی‌تراک آن توسط آهنگ اصلی غم‌انگیز Soft Machine، نوشته و اجرای کارن او از Yeah Yeah Yeahs است. Kid Koala و Trixie Whitley به اشتراک گذاری بین ستاره ای همه چیز برای شما ویدیو: اولین نمایش آریانا گرانده ریکی آلوارز اولین حضور در فرش قرمز در Focker-in-Law NYC اولین نمایش: عکس های اسنوپ داگ را ببینید که شبی نه چندان ساکت را به خانه های تعطیل می آورد. داستان فضانورد سلست که در اولین ماموریت انفرادی خود به فضا می رود و ربات، ربات نگهبانی را که او را بزرگ کرده است، پشت سر می گذارد. کید کوالا در یک پست اینستاگرامی، این فیلم را لالایی فردا در مورد یافتن جایگاه خود در جهان است. در این کلیپ اختصاصی با عنوان Empty Nester، رباتی را می‌بینیم که در زندگی به تنهایی قدم می‌زند، ابتدا در خواربار فروشی مقداری غلات Happy Crunch می‌خرد و سپس از کنار جشنواره فناوری Expo که اولین Guardianbot را به نمایش می‌گذارد، در میان نوآوری‌های تکنولوژیکی دیگر قدم می‌زند. حال و هوای غم انگیز کلیپ فقط توسط آوازهای غمگین کارن او در آهنگ جدید به خانه هدایت می شود. کلیپ زیر را تماشا کنید: کید کوالا (اریک سان) یک دی جی، تهیه کننده و آهنگساز کانادایی است که موسیقی اصلی فیلم را نیز بر عهده داشته است، که علاوه بر کارن او، خواننده/ترانه سرای ایسلندی، امیلیانا تورینی، لیدی باگ مکه از Digable Planets، نوازنده بلژیکی-آمریکایی، تریکسیهان، هنرمند", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/space-cadet-2026-billboard-1800.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۱ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Domino, New 750-Cap Brooklyn Venue From Ben Lovett’s tvg Hospitality, to Open Next Year", "link": "https://www.billboard.com/pro/brooklyn-music-venue-ben-lovett-tvg-hospitality-open-2027/", "summary": "Domino, a new all-ages 750-capacity venue and creative hub in Brooklyn, is set to open in April 2027, it was announced Thursday (Nov. 12). The venue comes from tvg Hospitality, founded by Ben Lovett of Mumford Sons . Located on the Williamsburg waterfront at the old Domino Sugar Refinery (now known as The Refinery at Domino), Domino will host concerts, club nights, comedy shows, film screenings, live podcast tapings and fashion and art events. Additionally, the space will host artist rehearsals, recording sessions, educational programs and collaborations with local cultural organizations and nonprofits. The venue is being developed in partnership with Emerson Hospitality and Two Trees Management. Related Indie Venues Call for Changing the PROs Blanket Licensing Practice Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Agents Look Ahead as AI Keeps Advancing: We Have the Privilege of Being in a Human Industry “Williamsburg was my introduction to New York City, as it was for so many artists and musicians twenty years ago,” said Lovett in a statement. “The neighborhood has changed enormously since then, but for decades, people have sought and found community in places like the one we’re building. Domino is our chance to carry that on: somewhere artists can develop ideas, audiences can discover something new, and neighbors feel they belong. Neighborhoods change. The need for a place like this never does.” Notably, the venue has committed not to take a cut of artists merch sales — a topic that has become a point of controversy in recent years. It will also establish a cultural board to keep its programming well-rounded and rooted in community and cultural goals, according to a press release. The board will be composed of New Yorkers from diverse industries and backgrounds that will meet on a quarterly basis to review programming, champion emerging talent, point out opportunities to broaden the types of genres, scenes and audiences it caters to and offer impartial recommendations on behalf of the neighborhood. Domino is a member of the National Independent Venue Association (NIVA). It will use DICE for ticketing. “The Refinery was the heart of Williamsburg’s industrial waterfront for more than a century, and preserving that history while creating something new and relevant has been central to our vision for the site,” said Jed Walentas , CEO of Two Trees Management, in a statement. “Wi", "date_str": "2026-11-12T16:49:50+00:00", "hash": "6db83a32572cbad4", "title_fa": "دومینو، مکان جدید بروکلین با 750 سرپوش از مهمان‌نوازی tvg بن لاوت، سال آینده افتتاح می‌شود", "summary_fa": "پنجشنبه (12 نوامبر) اعلام شد دومینو، یک مکان جدید با ظرفیت 750 سن و مرکز خلاقانه در بروکلین، قرار است در آوریل 2027 افتتاح شود. محل برگزاری از tvg Hospitality، بنیانگذار بن لاوت از پسران مامفورد است. دومینو واقع در ساحل ویلیامزبورگ در پالایشگاه قند قدیمی دومینو (که اکنون به عنوان پالایشگاه در دومینو شناخته می شود)، میزبان کنسرت ها، شب های باشگاهی، نمایش های کمدی، نمایش فیلم، پخش زنده پادکست و رویدادهای مد و هنری خواهد بود. علاوه بر این، این فضا میزبان تمرین‌های هنرمندان، جلسات ضبط، برنامه‌های آموزشی و همکاری با سازمان‌های فرهنگی محلی و سازمان‌های غیرانتفاعی خواهد بود. این مکان با مشارکت Emerson Hospitality و Two Trees Management در حال توسعه است. مکان‌های مستقل مربوطه خواستار تغییر افراد حرفه‌ای هستند. تمرین مجوز عمومی شرایط آب و هوای سخت، بندهای شعاع و یافتن نسل بعدی سرفصل‌های جشنواره: این یک مبارزه سال به سال برای زنده ماندن است. معرفی شهر نیویورک، همانطور که برای بسیاری از هنرمندان و نوازندگان بیست سال پیش بود.» \"محله از آن زمان به شدت تغییر کرده است، اما برای دهه‌ها، مردم در مکان‌هایی مانند جایی که ما می‌سازیم به دنبال و یافتن جامعه بوده‌اند. دومینو شانس ما برای ادامه دادن آن است: جایی که هنرمندان می‌توانند ایده‌های خود را توسعه دهند، مخاطبان می‌توانند چیز جدیدی را کشف کنند، و همسایه‌ها احساس می‌کنند که به آنها تعلق دارند. محله‌ها تغییر می‌کنند. نیاز به مکانی مانند این هرگز انجام نمی‌شود.\" نکته قابل توجه، محل برگزاری متعهد شده است که فروش کالاهای هنرمندان را کاهش ندهد - موضوعی که در سال‌های اخیر به محل بحث و مناقشه تبدیل شده است. بر اساس بیانیه مطبوعاتی، این هیئت همچنین یک هیئت فرهنگی ایجاد خواهد کرد تا برنامه های خود را به خوبی و ریشه در اهداف اجتماعی و فرهنگی حفظ کند. این هیئت متشکل از نیویورکی‌هایی از صنایع و", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/domino-brooklyn-venue-rendering-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "سینما"], "datetime_fa": "۲۱ آبان • ۲۰:۱۹"}, {"source": "Billboard", "title": "KATSEYE’s Megan Is Back Performing on Her Feet a Day After Doing Show Sitting Due to Concussion", "link": "https://www.billboard.com/music/music-news/katseye-megan-performs-on-feet-after-seated-show-1236380203/", "summary": "Megan of KATSEYE is back to performing on her feet — choreography and all just one day after staying seated for the duration of a concert due to a recent concussion. Related KATSEYE s Megan Performs While Sitting Due to Concussion, Sparking Fan Concern: Are They Serious? KATSEYE Postpones Two More Shows Due to Illness Days After Delaying Detroit Concert KATSEYE s Megan Is Seeing Pink in Warby Parker Rare Beauty s New Eyewear Collection In clips captured by Billboard at the girl group s Wednesday (Nov. 11) concert in Dallas, the 20-year-old performer partakes in the rigorous choreography for Billboard Hot 100 hits such as Pinky Up and Animal alongside bandmates Lara, Daniela and Yoonchae. The only difference is that Megan wears dark sunglasses, presumably blocking out some of the bright, flashing lights. The day prior, the foursome had performed at the Moody Center in Austin, Texas, where Megan remained sitting in a raised chair that was situated off to the side of the stage, wearing sunglasses. Also at the Tuesday (Nov. 10) show, she d told fans that she was feeling so much better. The day prior, she d explained on Weverse that she would be performing with “reduced choreography, less intense movement and taking breaks as needed,” as her doctors had recommended that she not [go] full out just yet. She d also said before the Austin concert that she d need to be reassessed before returning to unrestricted performances. Billboard has reached out to KATSEYE s reps for comment on Megan s return to performing as normal and whether the doctor s reassessment has taken place. KATSEYE has garnered increased attention over the past week or so, having postponed three shows on its Wildworld Tour due to an illness that turned out to be Megan s concussion. Some fans were upset by the abrupt cancellations of the concerts in Detroit, Chicago and Minneapolis, but when the group took the stage in Austin with Megan limited to the chair, their disappointment was largely replaced by concern for her health. “This is a terrible environment for someone with a concussion, one person wrote on X at the time. This is inhumane. Even Kesha later chimed in, commenting on Billboard s Instagram post about Megan remaining /11/P108QS1Z-e1794496190589.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۲۱ آبان • ۲۰:۰۵"}, {"source": "Billboard", "title": "King Charles III Joining Elton John For ‘Rocket Hour With His Majesty The King’ Special on Apple Music", "link": "https://www.billboard.com/music/music-news/king-charles-elton-john-rocket-hour-special-apple-music-1236380210/", "summary": "Elton John will have an audience with Britain s King Charles III on Saturday (Nov. 14) when the two men sit down for a chat on the singer s Rocket Hour podcast. The special edition of the Apple Music show will celebrate the crucial role music has played in the work done by the King s Trust charity as it celebrates its 50th anniversary. Related Anyma Will Return to the Great Pyramids of Giza In 2027 Elton John Enlists CMAT For New Version of Festive Smash ‘Step Into Christmas’ Elton John s First Song to Enter YouTube Billions Club Might Surprise You “We are so proud of our 11-year-plus relationship with Sir Elton and his Rocket Hour show,” said Rachel Newman, co-head of Apple Music in a statement. “And the chance to build on our creative partnership with His Majesty King Charles III by hosting this extraordinary collaboration in our new Apple Music studios in Battersea . Especially as it helps mark such a landmark anniversary for The King’s Trust — a charity Apple continues to support in meaningful ways.” In early October, the king joined Sir Elton at the new Apple Radio studio in London before the launch of the Apple x King s Trust Creative Labs, a new series of specialized workshops to equip young people with the technology, resources and in-demand industry skills to help them move into the workplace. The hourlong episode includes King Charles and Sir Elton sharing their memories of iconic performances by some of music s biggest stars in support of The King s Trust, as well as the artists who ve received help from the Trust at the start of their careers. Among the most prominent acts is Muse, who got a grant from the then Prince s Trust to buy sound equipment early in their career; the band later returned the favor by playing a sold-out 2018 show in support of The Trust at Royal Albert Hall. Music has always been at the heart of The Prince’s, and now The King’s Trust, said the king in a statement about the program that will air on his 78th birthday. So when I was asked whether I would like to showcase a selection of music from among the many talented performers who have so generously supported us over the years, together with some of the newer artists The Trust has helped to launch, it was an opportunity too good to resist.” Among the songs John and King Charles listen to on the episode include Muse s Feeling Good, Skye Newman s Hairdresser, Nectar Woode s Wine Into Water, and others. John has a long connection to the Trust, including performing at a numb", "date_str": "2026-11-12T16:31:51+00:00", "hash": "11bd95a31239b8ed", "title_fa": "ملحق شدن پادشاه چارلز سوم به التون جان برای «ساعت موشکی با اعلیحضرت پادشاه» ویژه اپل موزیک", "summary_fa": "التون جان روز شنبه (14 نوامبر) هنگامی که این دو مرد در پادکست ساعت موشک خواننده به گفتگو می نشینند، با پادشاه بریتانیا، چارلز سوم مخاطب خواهد داشت. نسخه ویژه نمایش Apple Music نقش مهمی را که موسیقی در کار انجام شده توسط موسسه خیریه Kings Trust ایفا کرده است، در جشن پنجاهمین سالگرد خود جشن می گیرد. Anyma مرتبط در سال 2027 به اهرام بزرگ جیزه بازخواهد گشت. التون جان برای نسخه جدید فستیوال اسمش «Step Into Christmas» اولین آهنگ التون جان که وارد YouTube میلیاردها شد ممکن است شما را غافلگیر کند، از CMAT استفاده می کند. اپل موزیک در بیانیه ای. و این شانس را داریم که با میزبانی این همکاری خارق‌العاده در استودیوهای جدید اپل موزیک در Battersea، شراکت خلاق خود را با اعلیحضرت پادشاه چارلز سوم تقویت کنیم. به خصوص که به جشن گرفتن چنین سالگردی برای The King’s Trust کمک می کند - یک موسسه خیریه که اپل همچنان به روش های معناداری از آن حمایت می کند. در اوایل اکتبر، پادشاه قبل از راه‌اندازی Apple x Kings ARIA top 10 (at No. 10); their cover of The Cranberries’ “Linger” for SiriusXM entered the Billboard Hot 100 (at No. 94); and finished on the right note with a dominant night at the ARIA Awards, with four wins from a leading eight nominations , including the pointy trophy for best group. The following year, Royel Otis released their sophomore collection, Hickey, which opened its account at No. 5 on the ARIA Albums Chart, cracked the Billboard 200 (at No. 151) and the Official U.K. Albums Chart (No. 14), and birthed the single “Moody,” which became their first-ever No. 1 on a Billboard chart, summiting on the Adult Alternative Airplay tally in July of that year. In support of Hickey, the band landed slots at Glastonbury, Governors Ball, Lollapalooza and Fuji Rock, and played three nights at O2 Academy Brixton in South London. The journey has continued this year with spots on stage at Lollapalooza in Argentina, Chile and Brazil; then Estéreo Picnic and Tecate Pa’l Norte, plus their Coachella debut, stadium dates with Foo Fighters, and headline concerts at Prospect Park, Salt Sheds and the Greek Theatre. Currently, Royel Otis boasts 9.7 million followers on Spotify.", "date_str": "2026-11-12T16:15:00+00:00", "hash": "66a341e7d7aaef0e", "title_fa": "Royel Otis قرارداد خود را با WME برای نمایندگی در آمریکای شمالی و جنوبی گسترش داد", "summary_fa": "سیدنی، استرالیا Royel Otis روابط خود را با WME فراتر از نمایندگی در منطقه آسیا-اقیانوسیه گسترش داد و شامل آمریکای شمالی، آمریکای جنوبی و تمام مناطق خارج از اروپا شد. از طریق این ترتیب، که پنجشنبه (12 نوامبر) اعلام شد، رویل اوتیس، یک دوتایی راک مستقل استرالیایی با پیچ و تاب روانگردان، در آن مناطق جدید توسط تیمی به رهبری کرک سامر، رئیس جهانی موسیقی WME نمایندگی خواهد شد. برت موریهی، رئیس آسیا و اقیانوسیه برای WME، همچنان به نمایندگی از گروه در سرزمین مادری خود، آسیا و خاورمیانه ادامه می دهد. به رهبری رویل مادل و اوتیس پاولوویچ، فیلم سیدنی با قطعات اولیه «صدف در جیب من» (2022) و «شاه مبل» (2023) سر زبان ها افتاد و همه این وعده ها ars podcast, Billboard staff writer Kyle Denis — now also the solo host of the excellent new video podcast Billboard Up Coming — stops by to discuss his essential October essay about this very topic: The Future of Pop Music Is Approaching and Black Women Are Leading the Charge — Why Aren’t They Also Leading the Charts? We discuss the many factors that led us to this point in pop music history, and the forces that continue to press on Black female pop stars that their white counterparts never seem to have to worry about in the same way. Along the way, we also answer many of the most urgent questions in this discussion: Why do pop and hip-hop seem so much further apart in 2026 than at any other point this century? What happened to the wave of the early 2020s that elevated so many female rappers to pop superstardom? How did Ravyn Lenae go from having one of the biggest hits of the mid-2020s to not appearing anywhere on the Billboard charts? Why does Rachel Chinouriri still struggle to level up at the same rate as her fair-skinned counterparts? Does the level of success achieved by Tinashe s Popstar suggest a bigger breakthrough is on the way, or is she already bumping against a ceiling? And perhaps most importantly: What should we do as pop fans to help support these artists, and to make this discussion a little less fraught? Check it out above, and subscribe to the Greatest Pop Stars podcast on Apple Music or Spotify (or wherever you get your podcasts ) for weekly discussions every Thursday about all things related to pop stardom! Find Kyle s essay here , find all about his Up Coming podcast here , and watch the first episode (with Bella Kay) here . And as we say in every one of these GPS podcast posts — if you have the time and money to spare, please consider donating to any of these causes in the fight for trans rights: Transgender Law Center Trans Lifeline Destina", "date_str": "2026-11-12T16:03:42+00:00", "hash": "828b08fd0f167dd9", "title_fa": "ستاره‌های زن پاپ س le “Friends Again.” With the critically acclaimed album’s release came the invitation to open for Olivia Dean’s The Art of Loving arena tour this summer. Since then, Rose has logged two-night stints at both Blue Note clubs in Los Angeles and New York. And she’s already booked next year to support Harry Styles for two nights (Aug. 18 20) in Dublin on his Together Together tour. These career milestones are part of a steady climb that began in 2019 with the release of her debut album To Myself. After a couple of EPs, sophomore set Through and Through followed in 2023. Rose’s 2024 collaborative EP Slow Burn with Canadian band BADBADNOTGOOD further fostered co-signs from ", "date_str": "2026-11-12T16:00:25+00:00", "hash": "0892a5a1d1ec2f83", "title_fa": "ارتقاء سطح با R&B و بازیگر ماه بیبی رز: \"من عاشق این سفر عجیب و غریبی هستم که در آن هستم\"", "summary_fa": "دو روز پس از کنسرت یک شبه‌ای برای جشن بیستمین سالگرد آلبوم مهم امی واینهاوس بازگشت به سیاه در The Roundhouse لندن (۲۳ اکتبر) - و بیبی رز هنوز هم خودش را به هم می‌زند. رز بزرگوار در طول مصاحبه زوم با بیلبورد می گوید: «این شگفت انگیز بود. روشی که آنها آن را کنار هم گذاشتند دیوانه کننده بود... همه چیز از گروه اصلی گرفته تا تهیه کنندگان آلبوم اصلی [مارک رونسون، سلام رمی]. و محل برگزاری آخرین جایی بود که امی قبل از مرگش در آن اجرا کرد. فقط زیبا بود که با همه زنان [که اجرا می‌کردند] یکپارچه باشیم. ما ممکن است از همه جا باشیم، اما وجه مشترک ما این است که امی چقدر روی ما تأثیر گذاشته است.» بیبی رز در میان گروهی از خوانندگان انتخاب شده - از جمله کورین بیلی رائه، جسی ریز، فلو و جورجا اسمیت- بود که برای اجرا با آهنگی از آلبوم همراه شد. در همکاری با پل دافی، یکی دیگر از تهیه کنندگان آلبوم واینهاوس، از رز خواسته شد تا تصنیف ویرانگر \"Alone Wake Up Alone\" را بخواند. این تنها یکی از مجموعه‌ای از لحظات شکست در سالی بود که برای بیبی رز یک سال طوفانی برای صعود به سطح بود. این ستاره نوظهور که بین واشنگتن دی سی و فایت ویل، کارولینای شمالی بزرگ شد، اولین جایزه گرمی خود را برای همکاری در آهنگ \"I Used To\" دریافت کرد. این سهم او در آل ی گسترش خواهد داد. پاتریک کورکوران، شریک موسس گروه Fithian در بیانیه‌ای گفت: \"ما از همکاری با لیلیان در گسترش تئاتر هانی‌جون با شرکت Attend بسیار هیجان‌زده هستیم. او از آن نوع فیلم‌ساز رویایی جسوری است که می‌خواهیم پلتفرم خود را راه‌اندازی کنیم. ما نمی توانیم منتظر باشیم تا مخاطبان بیشتری این تجربه تئاتر فراموش نشدنی را به اشتراک بگذارند. این به دنبال برنده شدن جایزه 1 میلیون دلاری AT T Untold Stories توسط هانیجون پس از نمایش در ترایبکا در سال 2025 خواهد بود. این فیلم در حدود 50 جشنواره از جمله جشنواره Tribeca Lisboa در پرتغال یک سال پیش بازی کرد و بیش از 25 جایزه بینندگان و هیئت داوران را به خود", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/05/HJ-still-1-2.png?crop=70px%2C0px%2C3860px%2C2162px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۲۰:۳۰"}, {"source": "Hollywood Reporter", "title": "YouTuber Dami Lee Signs With CAA (Exclusive)", "link": "https://www.hollywoodreporter.com/business/business-news/youtuber-dami-lee-caa-1236753850/", "summary": "The architect-turned-digital storyteller founded Nollistudio with Raffaele di Nicola to use online videos to talk about buildings and cities, real and imagined, in Hollywood movies.", "date_str": "2026-11-12T17:00:00+00:00", "hash": "d62f5536f17a7ec2", "title_fa": "دیمی لی یوتیوبر با CAA امضا می کند (انحصاری)", "summary_fa": "معمار که تبدیل به داستان دیجیتال شده بود، Nollistudio را با رافائل دی نیکولا تأسیس کرد تا از ویدئوهای آنلاین برای صحبت در مورد ساختمان ها و شهرها، واقعی و خیالی، در فیلم های هالیوود استفاده کند. معمار دامی لی، که از تخصص خود برای ارائه مفاهیم طراحی خاص به مخاطبان گسترده تر از طریق داستان سرایی دیجیتال استفاده می کند، برای نمایندگی با CAA قرارداد امضا کرده است. با حدود 2.5 میلیون دنبال کننده برای کانال یوتیوب خود، ویدیوهای اخیر لی شامل آیا چونگ کینگ واقعا یک شهر سایبرپانک است؟ ، که بیش از 3 میلیون بازدید دارد و دو میلیون بازدید دیگر برای چرا معماری ارباب حلقه ها فقط فانتزی نیست ... این یک هشدار است. CAA همچنین نماینده annel-isaac-mizrahi-1236946151/", "summary": "The 4K restoration of the groundbreaking fashion documentary “Unzipped” will make its streaming debut Dec. 1 on the Criterion Channel. The 1995 film chronicles designer Isaac Mizrahi’s planning and execution of the show for his fall 1994 collection. The film, which Miramax bought after it was a Sundance hit in 1995, includes appearances by Cindy [ ]", "date_str": "2026-11-12T17:00:00+00:00", "hash": "735551884fb7abff", "title_fa": "بازیابی 4K «unzipped» برای شروع پخش جریانی در کانال معیار (انحصاری)", "summary_fa": "بازسازی 4K مستند مد پیشگامانه \"Unzipped\" اولین پخش جریانی خود را در 1 دسامبر در کانال Criterion انجام خواهد داد. فیلم سال 1995 به برنامه ریزی و اجرای نمایش توسط اسحاق میزراحی طراح برای مجموعه پاییز 1994 می پردازد. فیلمی که Miramax پس از موفقیت در ساندنس در سال 1995 آن را خرید، شامل حضور سیندی [ ] در اوج انتشار مجموعه همنام خود، میزراهی در لیست A، از جمله سارا جسیکا پارکر، نیکول کیدمن و ناتالی پورتمن قرار گرفت. پس از بسته شدن فروشگاه در سال 1998، او مجموعه های مختلفی را با نام های مختلف منتشر کرد یا به طور کلی برای برندهای دیگر طراحی کرد. او همچنین با یک بازیگر کاباره کار نمایشی را آغاز کرد. اخیراً او در «مارتی سوپریم» به عنوان نماینده مطبوعاتی گوئینت پالترو ظاهر شد. اولین پخش استریم «Unzipped» پس از انتشار محدودی از بازسازی 4K انجام می شود. این فیلم با قسمت جدیدی از سری اصلی Criterion «ماجراهای فیلمبرداری» همراه خواهد بود، که در آن میزراهی با پیتر بکر از Criterion می‌نشیند تا درباره فیلم‌هایی که احساسات منحصربه‌فرد او را شکل داده‌اند، بحث کنند. در ادامه می‌توانید کلیپی اختصاصی از حضور میزراهی در فیلم ماجراجویی در سینما را مشاهده کنید. مورد بعدی میزراهی می تواند کلاه یک تهیه کننده باشد. او در حال ساخت یک سریال تلویزیونی درباره زندگی عکاس افسانه ای و بسیار بحث برانگیز پاپاراتزی رون گاللا با تهیه کننده کریستین واچون است. او در سپتامبر به Variety گفت: «ما این کار را با املاک رون گاللا انجام می‌دهیم. \"خیلی هیجان انگیز است. ما در مرحله اول، اول، اول هستیم، بنابراین هنوز آن را یا هیچ چیز دیگری ارائه نکرده ایم. اما این واقعاً یک ایده عالی است، فقط به دلیل معنایی که از نظر فرهنگی برای کشور ما دارد.»", "image_url": "https://variety.com/wp-content/uploads/2026/09/Unzipped_image_01-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما"], "datetime_fa": "۲۱ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "We’re Dangerously Close to Another #OscarsSoWhite Year. Can Zendaya, Colman Domingo, Pedro Pascal and More Prevent It?", "link": "https://variety.com/2026/film/awards/scars-so-white-2027-predictions-actors-diversity-1236945645/", "summary": "Few people have noticed yet, but the Oscars could be barreling toward repeating some not-so-great history. In March, Michael B. Jordan walked onto the Dolby Theatre stage and collected the best actor Oscar for “Sinners,” one of four wins for a film that set the all-time record with 16 nominations. He is the sixth Black [ ]", "date_str": "2026-11-12T16:20:00+00:00", "hash": "d67c2d03a62b626a", "title_fa": "ما به طرز خطرناکی به یک سال #اسکار دیگر نزدیک شده ایم. آیا زندایا، کولمن دومینگو، پدرو پاسکال و سایرین می توانند از آن جلوگیری کنند؟", "summary_fa": "تعداد کمی از مردم هنوز متوجه این موضوع شده‌اند، اما اسکار ممکن است تکرار یک تاریخ نه چندان بزرگ را به زحمت بیندازد. در ماه مارس، مایکل بی. جردن به صحنه تئاتر دالبی رفت و اسکار بهترین بازیگر مرد را برای «گناهکاران»، یکی از چهار برنده برای فیلمی که با 16 نامزدی، رکورد تاریخ را از آن خود کرد، دریافت کرد. او ششمین ستون مدار جوایز سیاه [ ] است: آیا POC می تواند از مسابقات بازیگری (دوباره) بسته شود؟ در پیش‌بینی‌های جمع‌آوری شده Gold Derby در اواخر اکتبر، سه بازیگر رنگین‌پوست در جایگاه‌های نامزدی در چهار بخش بازیگری قرار گرفتند و حتی یک کارگردان رنگین‌پوست در این پنج رشته حضور نداشت. در مسابقات سرب، 9 مورد از 10 اسلات پیش بینی شده متعلق به بازیکنان سفیدپوست بود. شکست مکزیکی استرالیایی ایند ناوارت تنها استثنا بود. اگر تا صبح روز ژانویه تا پایان نامزدی ادامه پیدا کند. 21، ژانویه 2015 را دوباره زنده خواهیم کرد، زمانی که همه 20 نامزد بازیگری سفیدپوست بودند و آوریل رینگ به صنعت هشتگ بدنامی داد که هنوز تکان نداده است: #OscarsSoWhite. سال بعد دوباره این اتفاق افتاد. بعد از هر بار، آکادمی قول داد چیزی یاد گرفته و در حال ایجاد تغییرات است. اما آکادمی هرگز کل مشکل نبوده است. داده ها را دنبال کنید و در بالادست، در راهروهای خود هالیوود شروع می شود. در ماه اوت، USC Annenberg Inclusion Initiative «نابرابری در 1900 فیلم محبوب» را منتشر کرد که مطالعه سالانه 100 فیلم پرفروش است و این بار سال 2025 را به مجموعه داده‌های مربوط به سال 2007 اضافه کرد. در ظاهر، داده‌های نژادی و قومیتی مانند پیشرفت به نظر می‌رسند. در سال 2025، 41.5 درصد از تمام شخصیت‌های سخنگو یا نام‌گذاری شده از یک گروه نژادی یا قومی بودند که کمتر از آن نمایندگی می‌شدند، که برای چهارمین بار در 19", "image_url": "https://variety.com/wp-content/uploads/2026/11/zendaya-gemma-chan-mahershala-ali-pedro-pascal-colman-domingo.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۹:۵۰"}, {"source": "Variety", "title": "Gal Gadot Says Skydance Co-CEO Ynon Kreiz ‘Gives Me Hope’ Against Antisemitism: ‘I’m Frightened by How Quickly Hatred of Jews Is Spreading’", "link": "https://variety.com/2026/film/news/gal-gadot-ynon-kreiz-antisemitism-jewish-hatred-spreading-1236946059/", "summary": "Gal Gadot held back tears while honoring Skydance co-CEO Ynon Kreiz at the Simon Wiesenthal Center’s Humanitarian Award Dinner. The former Wonder Woman actor cited Kreiz as a leader she trusts amid the rise of antisemitism around the world. “I’m frightened by how quickly hatred of Jews is spreading — and how openly it is [ ]", "date_str": "2026-11-12T16:03:50+00:00", "hash": "7235c9ece1b1c14a", "title_fa": "گال گدوت می‌گوید ینون کریز، مدیر عامل Skydance، در برابر یهودستیزی به من امید می‌دهد: «من از سرعت گسترش نفرت از یهودیان می‌ترسم.»", "summary_fa": "گال گدوت هنگام قدردانی از ینون کریز، مدیر عامل Skydance در مراسم شام جایزه بشردوستانه مرکز Simon Wiesenthal، اشک‌هایش را مهار کرد. بازیگر سابق Wonder Woman از کریز به عنوان رهبر مورد اعتمادش در میان افزایش یهودی ستیزی در سراسر جهان یاد کرد. گادوت در نوامبر به حضار گفت: \"من از سرعت گسترش نفرت از یهودیان می ترسم - و چقدر آشکار است [ ] \"من از سرعت گسترش نفرت از یهودیان - و آشکارا ابراز و پذیرش آن می ترسم.\" 11 رویداد در بورلی ویلشر برگزار شد. از زمان کشتار 7 اکتبر و جنگی که پس از آن رخ داد، من از خودم می‌پرسم که این تا کجا می‌تواند پیش برود. اگر مردم به شنیدن و دیدن نفرت عادت کنند و به سمت دیگری نگاه کنند، پس به کجا ختم می‌شود؟ داستان های مرتبط UFC 333 Livestream: در اینجا نحوه تماشای آنلاین Volkanovski در مقابل Evloev به صورت رایگان آمده است. او همان کاری را انجام می دهد که همیشه انجام می داد. او محکم ایستاده است او احساس می کند که جامعه ما در چه شرایطی قرار دارد. او در برابر یهودستیزی ایستادگی می کند. او اعتقاد و قلب شدید خود را به این مبارزه می آورد. او رهبری می کند. آن رهبری مانند یک فانوس نور است و در یک ساعت تاریک چیزی بیش از یک پرتو نور برای همه ما شهامت ندارد. کریز که قبلاً به مدت هشت سال مدیرعامل متل بود، در اواخر سپتامبر توسط رئیس همکار دیوید الیسون به عنوان مدیرعامل Skydance (برادران وارنر و پارامونت ادغام شده) انتخاب شد. الیسون به عنوان رئیس هیئت مدیره و مدیر عامل، تمام وظایف استراتژی، خلاقانه و فناوری را رهبری می کند. کریز، به عنوان مدیرعامل، بر عملیات روزانه شرکت و ادغام مشاغل ترکیبی نظارت دارد.", "image_url": "https://variety.com/wp-content/uploads/2026/08/P105OUQS.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۱ آبان • ۱۹:۳۳"}, {"source": "Billboard", "title": "Leveling Up With R&B Up-And-Comer of the Month Baby Rose: ‘I Love This Whole Freaky Journey I’m On’", "link": "https://www.billboard.com/music/rb-hip-hop/baby-rose-rb-up-and-comer-month-november-interview-1236380169/", "summary": "It’s two days after the one-night-only concert celebrating the 20th anniversary of Amy Winehouse’s seminal album Back to Black at The Roundhouse in London (Oct. 23) — and Baby Rose is still pinching herself. “It was amazing,” says a reverent Rose during a Zoom interview with Billboard . “The way they put it together was just insane … everything from the original band to the original album producers [Mark Ronson, Salaam Remi]. And the venue was the last place Amy performed at before she passed. It was just beautiful to be on one accord with all the women [who performed]. We may be from all over, but the one thing we have in common is how much Amy affected us.” Baby Rose was among a handpicked group of singers — including Corinne Bailey Rae, Jessie Reyez, FLO and Jorja Smith — paired with a track from the album to perform. Working with Paul Duffy, another producer on the Winehouse album, Rose was asked to sing the devastating ballad “Wake Up Alone.” This was just one in a series of breakout moments in what’s been a whirlwind year of leveling up for Baby Rose. Raised between Washington D.C. and Fayetteville, North Carolina, the rising star won her first Grammy for her collaboration on the track “I Used To.” It was her contribution to Leon Thomas’ album MUTT that won the 2026 award for best R B album. From there, the July release of third studio album Yearnalism (via Secretly Canadian) found the singer-songwriter zeroing in on honesty, freedom, self-love and other desires after moving beyond a low period. Aiding in that transformation: the 12-track album’s alternative mélange of R B/soul, jazz, gospel and rock and other genres, a contemporary homage described in press materials as “infused with the spirits of Muscle Shoals.” Leading the charge for the project was a reunion with Thomas on first single “Friends Again.” With the critically acclaimed album’s release came the invitation to open for Olivia Dean’s The Art of Loving arena tour this summer. Since then, Rose has logged two-night stints at both Blue Note clubs in Los Angeles and New York. And she’s already booked next year to support Harry Styles for two nights (Aug. 18 20) in Dublin on his Together Together tour. These career milestones are part of a steady climb that began in 2019 with the release چبورگ، ویرجینیا متولد شد - همانطور که در لهجه قابل توجه او مشهود است - اما در صحنه کمدی بوستون در اوایل دهه نود به شهرت رسید. کلارک یکی از استعدادهای نوظهور استندآپ بود - مانند دیو چاپل، لوئیس سی کی و دیو آتل - که در سال 1995 در فیلم ویژه کمدین های جوان گری شیندلینگ حضور داشت.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/GettyImages-104539584.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۹:۰۰"}, {"source": "Rolling Stone", "title": "Lucasfilm and Disney Plan Year-Long Celebration for ‘Star Wars’ 50th Anniversary", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/star-wars-50th-anniversary-celebration-disney-lucasefilm-1235656423/", "summary": "The festivities include the release of Ryan Gosling's Starfighter and the return of Disney+ series Ahsoka", "date_str": "2026-11-12T15:15:00+00:00", "hash": "cd563e31d175dd5c", "title_fa": "جشن سالانه لوکاس فیلم و دیزنی برای پنجاهمین سالگرد «جنگ ستارگان»", "summary_fa": "این جشن‌ها شامل انتشار فیلم Starfighter اثر رایان گاسلینگ و بازگشت سریال دیزنی + Ahsoka Lucasfilm است و دیزنی جشنی یک ساله را به افتخار پنجاهمین سالگرد اکران فیلم اصلی جورج لوکاس جنگ ستارگان در سال 1977 اعلام کرده است. از ژانویه، جشن جهانی پنج دهه داستان سرایی را با اعلان‌های پروژه‌های جدید، کالاهای سالگرد، رویدادهای اختصاصی طرفداران، نسخه‌های بایگانی و پیشنهادهای بازسازی شده در پارک‌های دیزنی و کروز برگزار می‌کند. دیزنی همچنین از فصل دوم سریال +Disney Ahsoka و فیلم Star Wars: Starfighter رونمایی خواهد کرد. لینون برنان، یکی از رئیس‌های لوکاس‌فیلم در بیانیه‌ای گفت: «بسیار خاص است که پنجاهمین سالگرد را با بازگرداندن نسخه اصلی جنگ ستارگان به سینماها انجام دهیم تا مخاطبان بتوانند این بخش از تاریخ فیلم را روی پرده بزرگ تجربه کنند.» ما مشتاقانه منتظر جشن گرفتن با طرفداران خود در تمام طول سال هستیم - از انتشار Ahsoka و Star Wars: Starfighter گرفته تا کالاهای انحصاری، داستان های انتشارات جدید، تجربیات فراموش نشدنی و بازی های تعاملی. ما از انجمن شگفت انگیز خود بسیار سپاسگزاریم و امیدواریم این تجربیات برای طرفداران جنگ ستارگان در همه جا شادی ایجاد کند.\" Ahsoka، که روزاریو داوسون در نقش اصلی بازی می کند، در 20 ژانویه باز می گردد. جنگ ستارگان: جنگنده ستارگان، به کارگردانی شاون لوی، در تاریخ 28 می در سینماها به نمایش درخواهد آمد. این فیلم با بازی رایان گاسلینگ و در دوره ای کاملاً جدید از داستان سرایی جنگ ستارگان، با شخصیت ها و مکان های کاملاً جدید اتفاق می افتد. در بیانیه مطبوعاتی این فیلم توضیح داده شده است: هنگامی که یک یاغی بدبین با گذشته مرموز خود مواجه می شود، به یک ماجراجویی خطرناک در سراسر کهکشان پرتاب می شود که او را در مسیر تصادف با سرنوشت قرار می دهد.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Star-Wars-50-Years.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲۱ آبان • ۱۸:۴۵"}, {"source": "Rolling Stone", "title": "Steve Carell, John C. Reilly to Star in Neil Simon’s ‘The Odd Couple’ on Broadway", "link": "https://www.rollingstone.com/culture/culture-news/steve-carell-john-c-reilly-neil-simon-odd-couple-broadway-1235655112/", "summary": "The revival officially opens at Stephen Sondheim Theatre in March", "date_str": "2026-11-12T14:22:10+00:00", "hash": "c035386b7fae1592", "title_fa": "استیو کارل و جان سی ریلی در فیلم «زوج عجیب» نیل سایمون در برادوی بازی خواهند کرد.", "summary_fa": "استیو کارل رسماً در ماه مارس در تئاتر Stephen Sondheim افتتاح می شود و جان سی ریلی در احیای فیلم کلاسیک نیل سایمون به نام The Odd Couple در برادوی بازی خواهد کرد. کارگردانی برنده جایزه تونی توماس کیل (همیلتون)، احیای آن در 23 مارس در تئاتر استفان ساندهیم اکران می شود. به مناسبت صدمین سالگرد تولد سایمون، نمایشنامه نویس، نمایشنامه مهم او برای اولین بار در سال 1965 در برادوی اکران شد و والتر ماتائو و آرت کارنی در آن بازی کردند. محصول اصلی برنده چهار جایزه تونی، از جمله بهترین نمایشنامه شد. همچنین در سال 1968 فیلم و مجموعه تلویزیونی محبوب پنج فصلی با همین نام و همچنین تولیدات بعدی بی‌شماری در سراسر جهان تولید شد. کیل در بیانیه‌ای گفت: «نیل سایمون یکی از کمدی‌های
