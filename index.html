روی صحنه کنار گذاشته شده است. اکنون، خواننده رپ متعهد شده است که یک میلیون دلار از درآمد خالص خود را از این تور به شش سازمان حامی کمک‌های فلسطینی اهدا کند. مکلمور در اینستاگرام گفت: می‌خواهم گفتگو را به جایی که به آن تعلق دارد برگردانم: به مردم فلسطینی که هنوز کشته می‌شوند، هنوز تحت اشغال نظامی زندگی می‌کنند و هنوز برای آزادی خود می‌جنگند. هنرمند بن همچنین از نیوانگلند پاتریوتز و مالک استادیوم ژیلت، رابرت کرافت دعوت کرد تا با کمک مالی خود، که بین HEAL Palestine، آشپزخانه سوپ غزه، کمک به پناهندگان خاور نزدیک آمریکا، کمک پزشکی برای فلسطینیان، و کمیته ملی UNRWA USA تقسیم خواهد شد، دعوت کرد. مککلمور کرافت را متهم کرده است که شیران را تحت فشار قرار داده تا او را از تور حذف کند و تهدید کرده است که در غیر این صورت نمایش‌هایش را در ژیلت به پایان می‌رساند و سایر صاحبان سالن را به انجام همین کار تشویق می‌کند. کرافت در یک بیانیه قبلی برای NBC New s تایید کرد که در اخراج مککلمور از تور شرکت داشته است. «بر اساس اقدامات اخیر مکلمور، مطالبی که از روی صحنه در طول نمایش‌های اد شیران در نیوجرسی به اشتراک گذاشته شد، و تاریخچه وسیع‌تری از لفاظی‌ها و تصاویر یهودی‌ستیزانه که به اعتقاد ما برای جامعه یهودی بسیار آزاردهنده و آزاردهنده بوده است، تصمیم گرفتیم که شرکت او در کنسرت‌های 25 و 26 سپتامبر استادیوم، خط استادیوم Giette را تلاقی کند.»"}, {"source": "Pitchfork", "title": "Madonna Is Opening the VMAs for the First Time in 23 Years", "link": "https://pitchfork.com/story/madonna-is-opening-the-vmas-for-the-first-time-in-23-years/", "summary": "The Queen of Pop is the most-nominated artist of the night", "date_str": "2026-09-16T22:02:44+00:00", "hash": "cc7b544a289fc6ed", "title_fa": "مدونا برای اولین بار پس از 23 سال VMA را افتتاح می کند", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان مدونا Danceteria را به VMA ها بازمی گرداند. ملکه پاپ نمایش جوایز را برای اولین بار از سال 2003 افتتاح می کند و به عنوان برنده ترین هنرمند شب برای آلبوم دهه 80 خود با الهام از زندگی شبانه Confessions II اجرا می کند. او امسال شامل ویدیوی سال، هنرمند سال و آهنگ سال است. این سومین باری است که مدونا در سال 1998 موفق به کسب 9 نامزدی برای \"Ray of Light\" و \"Frozen\" و نه برای \"Vogue\" در سال 1990 شد. در سال 1990، او \"ووگ\" را در اجرای الهام گرفته از فرانسه قرن هجدهم خواند. در سال 1984، او اولین دوره VMA را تیتر کرد، جایی که با کمربندی که روی آن نوشته شده بود \"BOY TOY\" در حالی که \"Like a Virgin\" را می خواند، روی زمین پیچید. VMA ها یکشنبه، 27 سپتامبر ساعت 7:30 بعد از ظهر به وقت شرقی از شبکه CBS پخش می شود."}, {"source": "Pitchfork", "title": "Porridge Radio’s Dana Margolin Launches Debut Solo Single", "link": "https://pitchfork.com/story/porridge-radios-dana-margolin-launches-debut-solo-single/", "summary": "The Brighton four-piece announced their breakup last year", "date_str": "2026-09-16T17:53:23+00:00", "hash": "32c9e853c95ce11d", "title_fa": "دانا مارگولین از رادیو فرنی اولین تک‌آهنگ انفرادی را راه‌اندازی کرد", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان دانا مارگولین، پیشرو سابق گروه موسیقی راک برایتون Porridge Radio، اولین تک آهنگ خود را به عنوان یک هنرمند انفرادی به اشتراک گذاشته است. \"صدای زیبای بزرگ\" یک تصنیف آکوستیک یدکی است. بر اساس مطالب مطبوعاتی، مارگولین برای خود چالشی ایجاد کرد که همه عناصر آهنگ باید در یک رکورد 8 آهنگی جای می گرفتند. مایک میلز و جو نانکین این ویدیوی سیاه و سفید را به همان اندازه اسپارتانه کارگردانی کردند. آن را در زیر تماشا کنید. مارگولین در بیانیه مطبوعاتی درباره «صدای زیبای بزرگ» گفت: «ما تا آخر با هم پایین می‌رویم، از یک پلکان مارپیچ به مرکز زمین که تاریکی است و هیچ چیز نمی‌تواند رشد کند، پایین می‌رویم، و ما تصمیم گرفتیم به آنجا برویم، و آیا این سرگرم‌کننده نبود، و درست همان‌جا در عمیق‌ترین اعماق سفر، صدایی درخشان و زیبا و چیزی بزرگ است.» قبل از جدایی آنها در سال 2025، رادیو پوریج چهار آلبوم استودیویی را در طی نه سال منتشر کرد. آخرین LP آنها در سال 2024، Clouds in the Sky They Will Always Be There for Me بود، که آن را با یک EP - The Machine Starts to Sing - که از جلسات Clouds استخراج شده بود، دنبال کردند. در 30 بهترین آلبوم راک 2024 در رتبه 26 در مورد ابرها در آسمان، آنها همیشه آنجا برای من خواهند بود بخوانید."}, {"source": "Pitchfork", "title": "Listen to Dexter in the Newsagent’s New Song “Fantasy”", "link": "https://pitchfork.com/story/listen-to-dexter-in-the-newsagent-new-song-fantasy/", "summary": "The British singer-songwriter and producer’s first single of 2026", "date_str": "2026-09-16T17:22:22+00:00", "hash": "20bb63f222eb6a77", "title_fa": "در آهنگ جدید روزنامه فروشی \"فانتزی\" به دکستر گوش دهید", "summary_fa": "اولین تک آهنگ خواننده و ترانه سرا و تهیه کننده بریتانیایی در سال 2026 Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان تقریبا یک سال پس از اولین میکس نوار او، Time Flies, Dexter in the Newsagent بازگشته است. «فانتزی»، اولین آهنگ سال 2026 خواننده، ترانه‌سرا و تهیه‌کننده، دنباله‌ای از تبلیغات در پشت آلبوم شامل تاریخ جشنواره‌های اروپایی و ویدیویی برای «غریبه عشق» است. در ویدیوی زیر به کارگردانی آیریس لوز آهنگ جدید با یک جعبه تلفن نئونی به لندنی جنوبی بپیوندید. دکستر در یک بیانیه مطبوعاتی گفت: «این آهنگ را در اوایل امسال نوشتم، زمانی که پول زیادی از دست دادم و احساس می کردم کاملاً گم شده بودم. من در حال تماشای ویدیوهای تصادفی با ماشین از مناطق ثروتمند در یوتیوب بودم و می‌خواستم آهنگی درباره پول بنویسم از دیدگاهی که همه ما در دوران کودکی داریم و شما فقط تعجب می‌کنید که داشتن یک ماشین فانتزی بزرگ، قدم زدن در کمد لباس یا سرآشپز چگونه است. این آهنگ از آنجا آمد و من همه چیز را دوست دارم که چقدر فانتزی و رویایی دارد، مانند دنیای فانتزی خودم است که در آن میلیونر هستم.\""}, {"source": "Pitchfork", "title": "Aesop Rock and Blockhead Reveal Next Joint Album", "link": "https://pitchfork.com/story/aesop-rock-and-blockhead-reveal-next-joint-album/", "summary": "Trouble Mountain was inspired by the rapper’s childhood trips to the Poconos", "date_str": "2026-09-16T17:04:46+00:00", "hash": "45d20ae10ba9fa40", "title_fa": "Aesop Rock و Blockhead آلبوم مشترک بعدی را آشکار می کنند", "summary_fa": "Trouble Mountain از سفرهای دوران کودکی خواننده رپ به Poconos Loader الهام گرفته شده است ذخیره داستان ذخیره این داستان Comment Loader Save Story Save this story همکاران قدیمی Aesop Rock و Blockhead آلبوم دیگری در راه دارند. Trouble Mountain، ادامه‌ی Garbology سال 2021، شامل آیات مهمان از Open Mike Eagle، Hanni El Khatib و غیره است. لیست کامل آهنگ همراه با اولین تک آهنگ و موزیک ویدیوی متحرک مردی که در حال اسکی کردن در یک منظره جهنمی است در زیر آمده است. ازوپ در بیانیه‌ای توضیح می‌دهد که در حالی که او هرگز واقعاً اسکی نکرده است، به لطف اقوامش که در پوکونوس زندگی می‌کردند، در اطراف آن بزرگ شده بود. او می‌نویسد: «از کودکی آخر هفته‌ها را آنجا گذراندم، البته نه در یک مهمانی مریض. Trouble Mountain من و Blockhead (جعلی) Ski Lodge هستیم، جایی که ممکن است با همسر آینده خود ملاقات کنید یا ممکن است مجبور شوید با گروه‌های اسکی محلی بجنگید - (که فکر می‌کنم یک چیز است.) هر چیزی ممکن است اتفاق بیفتد. (این یک استعاره از زندگی است، بله!) وقتی آلبوم در 13 نوامبر در Rhymesayers منتشر شد، می‌توانید درباره آن گروه‌های اسکی محلی بیشتر بدانید. Trouble Mountain 01 سوئدی Death Cleaning 02 Coyote Summer (feat. Hanni El Khatib) 03 Church Key 04 Easter 05 Hound Selector 06 TM Tours (feat. Baby Dayliner) 07 Trouble Trouble 08 Mom One 09 One Thing (feat. Hani El Khatib) 11 Open مصاحبه ها 13 The Bag 14 Eat And Grow (feat. Cavalier and 4-IZE) 15 Ewok 16 High and Outside 17 Buffering"}, {"source": "Rolling Stone", "title": "Keith Richards Adds Grit to ‘Bright Lights, Big City’ for ‘Grand Theft Auto VI’ Album", "link": "https://www.rollingstone.com/music/music-news/keith-richards-bright-lights-big-city-grand-theft-auto-vi-1235628284/", "summary": "Cover of Jimmy Reed's blues classic is meant to evoke the \"electric energy\" of video game's Vice City", "date_str": "2026-09-17T16:31:16+00:00", "hash": "1566c1eb38a89658", "title_fa": "کیت ریچاردز برای آلبوم Grand Theft Auto VI Grit را به Bright Lights, Big City اضافه کرد.", "summary_fa": "کاور بلوز کلاسیک جیمی رید برای برانگیختن «انرژی الکتریکی» معاون شهر بازی‌های ویدیویی است. این یکی از 34 آهنگی است که برای به تصویر کشیدن انرژی الکتریکی د db2c6", "title_fa": "اقامت رولینگ استون با حضور وینس استیپلز در تئاتر Cherry Lane نیویورک ادامه دارد.", "summary_fa": "مکان تاریخی West Village امسال میزبان شش مصاحبه اختصاصی و اجرای صمیمی خواهد بود. آماده شوید رولینگ استون در حال معرفی رولینگ استون رزیدنسی است، مجموعه ای اختصاصی از مصاحبه ها و اجراهایی که در تئاتر نمادین Cherry Lane در وست ویلج در نیویورک برگزار می شود. به عنوان بخشی از تعهد مجله به ایجاد تجربیاتی منحصر به فرد که طرفداران را با موسیقی و هنری که دوست دارند پیوند دهد، این اقامتگاه شامل شش شب فراموش نشدنی گفتگوهای عمیق زنده و اجرای آکوستیک خواهد بود. اولین اجرا در 11 ژوئن با خواننده و ترانه سرا سارا باریلز آغاز شد و پس از آن جی بالوین در 9 جولای اجرا شد و اکنون وینس استیپلز در 10 اکتبر روی صحنه خواهد رفت. هر شب، در یکی از قدیمی‌ترین سالن‌های تئاتر خارج از برادوی نیویورک، یک سردبیر رولینگ استون مأموریت مجله را ادامه می‌دهد که تا به حال دیده نشده‌ای از درخشان‌ترین ستاره‌های جهان را با گفتگوهایی که داستان‌های پشت سر آنها هستند و هر آنچه را که به دست آورده‌اند را روشن می‌کند. داستان‌های پرطرفدار رابرت کرافت به دعوت مکلمور برای تطبیق یک میلیون دلاری با گروه‌های حمایتی فلسطینی پاسخ می‌دهد. جایزه یک عمر دستاورد در ویدیوی قلبی که قبل از مرگ او ضبط شده است اجرای اقامت در 10 اکتبر، 21 اکتبر و 1 دسامبر ادامه خواهد داشت. هنرمندان برجسته هفته‌ها قبل از هر نمایش معرفی می‌شوند، بنابراین مراقب پلتفرم‌های رولینگ استون باشید تا از لیست هیجان‌انگیز به‌روز باشید."}, {"source": "Rolling Stone", "title": "Queen Latifah, Riley Green, Kelly Clarkson, Adam Levine Perform ‘The Weight’ on ‘The Voice’", "link": "https://www.rollingstone.com/music/music-news/the-voice-coaches-perform-the-weight-by-the-band-1235626805/", "summary": "Premiering Sept. 21, Season 30 marks Latifah and Green’s first time in the coaches’ chairs, while Levine and Clarkson are back for their 19th and 11th seasons", "date_str": "2026-09-17T15:05:00+00:00", "hash": "c6bb85e12e0db1d1", "title_fa": "کوئین لطیفه، رایلی گرین، کلی کلارکسون، آدام لوین آهنگ The Weight را در سریال The Voice اجرا کردند.", "summary_fa": "پخش اول در 21 سپتامبر، فصل 30 نشان دهنده اولین باری است که لطیفه و گرین روی صندلی مربی نشسته اند، در حالی که لوین و کلارکسون برای فصل 19 و 11 خود بازگشته اند. قبل از پخش فصل 30، خواننده کفش‌هایش را درآورد و به کوئین لطیفه، ستاره کانتری، رایلی گرین، و قهرمان بازگشته آدام لوین برای اجرای تک آهنگ The Weight گروه 1968 ملحق شد. در حالی که کلارکسون با پای برهنه دور صحنه حرکت می کرد و اشعار را با لطیفه رد و بدل می کرد، لوین آن را در پشت کیت درام نگه داشت در حالی که گرین با گیتار می زد. اوایل این هفته، آدری موریسی، تهیه‌کننده اجرایی The Voice به TV Insider گفت که بخش پخش زنده سریال در این فصل با قدرت کامل باز خواهد گشت. او گفت که ما در حال بازگرداندن برنامه های زنده هستیم. شش هفته برنامه زنده خواهیم داشت. در طول فصل 29 هیچ برنامه زنده ای وجود نداشت، و فصل های قبلی که این بخش را به نمایش می گذاشتند فقط به چند روز محدود می شدند، بسیار کوتاه تر از مدت زمان شش هفته. داستان‌های پرطرفدار رابرت کرافت به دعوت مکلمور برای تطبیق یک میلیون دلاری با گروه‌های حمایتی فلسطینی پاسخ می‌دهد. جایزه یک عمر دستاورد در ویدیوی قلبی ضبط شده قبل از مرگ او اکنون، طرفداران می توانند نظر خود را بیان کنند و نتایج فوری را ببینند. موریسی گفت، با این حال، تفاوت در اینجا این است که ما رای یک شبه انجام نمی دهیم. این رای گیری در زمان واقعی است. بنابراین، همه اجرا می‌کنند، و ما در آن شب متوجه می‌شویم که چه کسی در حال حرکت است."}, {"source": "Rolling Stone", "title": "Timberland x Telfar’s Viral Bags and Footwear Collection Gets a Final Restock", "link": "https://www.rollingstone.com/product-recommendations/style/telfar-timberland-shoes-bags-where-to-buy-online-1235447766/", "summary": "Last year's collection sold out in minutes, but shoppers have one more chance to get their hands on this coveted collab", "date_str": "2026-09-17T14:45:50+00:00", "hash": "632f8b36b920970c", "title_fa": "مجموعه کیف‌ها و کفش‌های ویروسی Timberland x Telfar دوباره عرضه می‌شود", "summary_fa": "مجموعه سال گذشته در عرض چند دقیقه فروخته شد، اما خریداران یک فرصت دیگر برای دستیابی به این همکاری ارزشمند دارند. چه اتفاقی می‌افتد وقتی یک برند مد نمادین، پشت آنچه که با عشق به نام بوشویک برکین شناخته می‌شود، با برندی که از زمان ورود رسمی خود به صحنه در سال 1973 توانسته بود به طور یکسان بر کارگران یقه آبی و اسطوره‌های هیپ‌هاپ به پیروزی بپیوندد؟ ظاهراً یکسری اعلان‌های فروخته شده است. ما در مورد شرکت همنام Telfar Clemens صحبت می کنیم که نوعی مینیمالیسم بدون جنسیت و ساختارشکنی را تکرار می کند که توسط همه از سلنا گومز گرفته تا زو کراویتز و همکاری پر سر و صدای آن با کسی جز تیمبرلند در پاییز سال گذشته تأیید شده است. هنگامی که این دو برای اولین بار از ویرایش فشرده خود از قطعات با نام تجاری مشترک خود (شامل اندازه های مختلف کیف خرید معروف Telfar، که برای مناسبت در دست طراحی شده بودند، و سه تکرار از یک چکمه ضد آب جدید و بهبود یافته Timberland Premium 6 اینچی) رونمایی کردند، می توان گفت که طرفداران به طور کلی آن را در عرض چند دقیقه فروختند: اگر نتوانستید به موقع یکی از انتخاب‌های کلکسیونر را دریافت کنید، خوشحال خواهید شد که بدانید Telfar و Timberland به شانس‌های دوم اعتقاد دارند. در 18 سپتامبر، ساعت 11 صبح. ET، مجموعه تا کنون آخرین ذخیره خود را دریافت خواهد کرد. به‌ویژه در سایت timberland.com، خریداران این فرصت را خواهند داشت که یکی از محبوب‌ترین مدل‌های کفش را انتخاب کنند: چکمه‌های کشدار ممتاز Timberland x Telfar، که پیش‌بینی می‌شود در دو رنگ مجزا (نوباک مشکی و نوبوک گندمی) برای هر نوع کمد عرضه شود."}, {"source": "Rolling Stone", "title": "Anthrax Put Former Samhain Member London May Through Hell in ‘Cursum Perficio’ Video", "link": "https://www.rollingstone.com/music/music-news/anthrax-cursum-perficio-video-london-may-1235627267/", "summary": "Rhythm section ace literally tries to break the chains that bind him in clip for title song on thrashers’ new album", "date_str": "2026-09-17T14:30:00+00:00", "hash": "7582a7cc0f4e9d6e", "title_fa": "Anthrax در ویدیوی Cursum Perficio، عضو سابق Samhain لندن را در جهنم قرار داد", "summary_fa": "آس در بخش ریتم به معنای واقعی کلمه تلاش می‌کند زنجیره‌هایی را که او را در کلیپ آهنگ تیتراژ در آلبوم جدید تراشرها می‌بندد، Chains مردی را از میان مه، دود، آب و تونل‌های آجری می‌کش به اینستاگرام او بیان می کند که به احترام دانکن و خانواده ما، در حال حاضر جزئیات پزشکی بیشتری را به اشتراک نمی گذاریم. این بیانیه ادامه می‌دهد که ما با مهربانی از حریم خصوصی در این زمان فوق‌العاده دشوار درخواست می‌کنیم و در صورت لزوم به‌روزرسانی‌ها را ارائه می‌کنیم. از محبت و حمایت مداوم شما متشکرم. شیک، 56 ساله، همچنین برای اولین آهنگ خود در سال 1996 به سختی نفس می کشد، که منجر به نامزدی گرمی برای بهترین اجرای آواز پاپ مردانه در سال 1998 شد، شناخته می شود. او 9 آلبوم استودیویی منتشر کرده است. او موسیقی برای بهار بیداری را نوشت و استیون ساتر اشعار این موزیکال را که در برادوی در سال 2006 با بازی لی میشل و جاناتان گروف به نمایش درآمد، ارائه کرد. محصول برادوی برنده جوایز تونی برای بهترین ارکستراسیون، بهترین موسیقی متن و بهترین موسیقی، و همچنین جایزه گرمی برای بهترین آلبوم تئاتر موزیکال شد. موزیکال آلت راک و فولک بر اساس نمایشنامه آلمانی 1891 فرانک ویدکیند ساخته شده است که در آن نوجوانان در اواخر دهه 1800 تمایلات جنسی خود را کشف می کنند. یک مستند 2022 نشان می‌دهد که بازیگران اصلی دوباره برای یک کنسرت اتحاد دوباره گرد هم می‌آیند. احیای این موزیکال، به کارگردانی دانیا تیمور، برای آف برادوی در پاییز امسال در استودیو سی ویو برنامه ریزی شده است، پیش نمایش آن از 27 نوامبر آغاز می شود و افتتاحیه رسمی آن در 17 دسامبر تنظیم می شود."}, {"source": "Hollywood Reporter", "title": "Jimmy Kimmel Might Stick Around, But the End of Late Night TV Is Getting Closer", "link": "https://www.hollywoodreporter.com/tv/tv-news/end-of-late-night-tv-nears-kimmel-lorne-michaels-1236700515/", "summary": "Every show outside of 'SNL' has been canceled or had budgets slashed, teeing up an uncertain future for one of TV's defining formats ... even if it ultimately lives on online.", "date_str": "2026-09-17T16:14:15+00:00", "hash": "3ccce8960dbd439f", "title_fa": "جیمی کیمل ممکن است در اطراف بماند، اما پایان تلویزیون آخر شب نزدیک‌تر می‌شود", "summary_fa": "هر برنامه ای خارج از \"SNL\" لغو شده است یا بودجه آن کاهش یافته است و آینده نامعلومی را برای یکی از قالب های تعیین کننده تلویزیون رقم می زند ... حتی اگر در نهایت به صورت آنلاین ادامه یابد. در مستند جدید لورن، صحنه ای به یاد ماندنی مشاهده می شود که لورن مایکلز، خالق برنامه زنده شنبه شب و پادشاه کمدی به دوستش استیو مارتین برای صرف شام در Orso در منهتن می پیوندد. مارتین در حین صرف غذا که توسط مستندساز مورگان نویل و تیمش در دوربین گرفته شده است، به مایکلز فشار می‌آورد که آیا او واقعاً از SNL بازنشسته خواهد شد یا خیر. مایکلز پیشنهاد می‌کند که هر چه می‌خواهد، نمی‌تواند. برای محافظت از SNL و تمام استفاده بیهوده و بیهوده آن از منابع، او باید به آن بچسبد. البته مایکلز بر ترکیب شبانه NBC حاکم است. او هنوز SNL را اجرا می کند و بر هر دو نمایش امشب و آخر شب نظارت دارد. این سند مایکلز را در فرم اصلی نشان می‌دهد، که در تمام جنبه‌های نمایش نقش فعالی دارد و در طول مسیر پاپ کورن می‌خورد (این بودجه پاپ کورن ممکن است اولین چیزی باشد که باید انجام شود). او از بسیاری جهات آخرین مردی است که در اواخر شب تلویزیون ایستاده است: CBS از بازی خارج شد و پس از لغو هر دو سریال The Late Show و Late Late Show ساعت را به Comics Byron Allen Unleashed اجاره داد. استفان کولبرت این هفته جایزه امی را به خاطر فصل آخر سریالش دریافت کرد. جیمی کیمل هرچه زودتر در مراسم خداحافظی امی عکس بگیرد، حتی اگر بعید است که این اتفاق در سال آینده یا حتی سال بعد از آن رخ دهد. هفته گذشته، پیج سیکس نیویورک پست گزارش داد که نمایش کیمل سال آینده به پایان می رسد، زیرا قرارداد"}, {"source": "Hollywood Reporter", "title": "Lisa, Shaboozey and Raye Among 2026 MTV Video Music Awards Performers", "link": "https://www.hollywoodreporter.com/music/music-news/lisa-shaboozey-raye-2026-mtv-video-music-awards-performers-1236704163/", "summary": "Sienna Spiro, GENER8ION, Gunna and Yung Lean have also been added as performers at the music-centric awards show, set to take place in Los Angeles at the end of September.", "date_str": "2026-09-17T16:00:00+00:00", "hash": "e00d071a8919468c", "title_fa": "لیزا، شابوزی و ری در میان نوازندگان جوایز موسیقی ویدئویی MTV 2026", "summary_fa": "Sienna Spiro، GENER8ION، Gunna و Yung Lean نیز به عنوان نوازندگان در نمایش جوایز موسیقی محور که قرار است در پایان سپتامبر در لس آنجلس برگزار شود، اضافه شده اند. جوایز موسیقی ویدیویی ام تی وی از ترکیب هنرمندان خود رونمایی کرد. سی‌بی‌اس و ام‌تی‌وی روز پنجشنبه اعلام کردند لیزا، شابوزی، ری، سینا اسپیرو، GENER8ION، گانا و یونگ لین به مدونا، مجری برنامه، به‌عنوان مجری در نمایش جوایز موسیقی محور می‌پیوندند. لیزا با اولین پخش تلویزیونی تک‌آهنگ SaWaDiKa که اخیراً منتشر شده است، به صحنه VMA بازخواهد گشت که از EP آینده‌اش، Press Play، ستایش می‌کند. مستند این خواننده، Always Lalisa، در آخر هفته در تورنتو به نمایش درآمد و در حالی که خواننده از سیستم کی پاپ خارج شد، ظاهری نادر از پشت صحنه ارائه داد. داستان‌های مرتبط Music Bleachers Bring Out The Chicks to End Five Nights of Underplays در تروبادور موزیک مدونا قرار است جوایز موسیقی ویدیوی MTV را برای اولین بار در بیش از 20 سال باز کند، ری اولین اجرای خود را در VMA خواهد داشت. این خواننده بریتانیایی امسال دو بار نامزد شده است، از جمله در بخش آهنگ سال برای آهنگ فوق العاده اش Where Is My Husband! Shaboozey همچنین اولین اجرای VMA خود را با تک آهنگ موفق خود Cowgirl انجام خواهد داد. همچنین قرار است Gunna برای اولین اجرای پخش از همکاری High Noon به او بپیوندد. اسپیرو که برای اولین بار نامزد شد، به Shaboozey و Raye می‌پیوندد تا اولین اجرای خود در VMA را انجام دهد. این خواننده به دنبال بهترین هنرمند جدید است. مجموعه دیگری از اجراکنندگان برای اولین بار، GENER8ION و یونگ لین، اولین اجرای جهانی Storm II را اجرا خواهند کرد. نامزدهای اولین بار برای ویدیوی سال، بهترین کارگردانی و بهترین رقص هستند."}, {"source": "Hollywood Reporter", "title": "Hallmark Unveils Two-Month, 34-Movie ‘Countdown to Christmas’ Lineup for 2026", "link": "https://www.hollywoodreporter.com/tv/tv-news/2026-hallmark-countdown-to-christmas-lineup-1236704513/", "summary": "The annual programming event kicks off in mid-October, with the first weekend featuring the third film made in collaboration with the NFL.", "date_str": "2026-09-17T15:58:04+00:00", "hash": "80cdd404577cb0bd", "title_fa": "هالمارک از فهرست فیلم های دو ماهه و 34 «شمارش معکوس تا کریسمس» برای سال 2026 رونمایی کرد.", "summary_fa": "رویداد برنامه‌نویسی سالانه در اواسط اکتبر آغاز می‌شود و آخر هفته اول با سومین فیلم ساخته شده با همکاری NFL آغاز می‌شود. متن لوگو شانس این است که با خواندن این مطلب، بابانوئل غول‌پیکر بادی در نزدیکی ورودی یک فروشگاه سخت‌افزار جعبه بزرگ در نزدیکی خود ظاهر می‌شود. بنابراین هالمارک شروع برنامه‌نویسی سالانه شمارش معکوس تا کریسمس را با دو ماه بیشتر از روز واقعی تقریباً محدود کرده است. این شبکه کابلی و پخش جریانی، لیست کامل 34 فیلم اصلی خود را به اضافه سه قسمت جدید از سریال Mistletoe Murders برای این فصل در روز پنجشنبه اعلام کرد. لوح سنگ شامل چیزی است که هالمارک آن را سه رویداد سینمایی می نامد: تعطیلات تاچ داون: داستان عشق خرس ها (17 اکتبر)، سومین همکاری شرکت با NFL. تعطیلات همیشه بعد: آرزوی دنیای دیزنی به حقیقت می پیوندد (28 نوامبر)، که در محل در دنیای دیزنی فیلمبرداری شد. و کریسمس بزرگ بیلتمور (دسامبر. 5)، ادامه ای بر کریسمس بیلتمور در سال 2023 که در املاک معروف اشویل، کارولینای شمالی فیلمبرداری شد. داستان‌های مرتبط برنامه تعطیلات تلویزیونی: داستان عاشقانه خرس‌ها به شروع فیلم کریسمس Hallmark کمک خواهد کرد. مدیر ارشد برند هالمارک دنیاها و فرهنگ‌های NFL، Walt Disney World Resort و Biltmore فرصت‌های ویژه‌ای را برای ما به ارمغان می‌آورند تا داستان‌های منحصربه‌فردی از عاشقانه، خانواده و جامعه را برای طرفداران به ارمغان بیاوریم که مطمئناً از نکات برجسته این فصل تعطیلات هستند."}, {"source": "Hollywood Reporter", "title": "Rosalind Ashford, Original Martha and the Vandellas Singer, Dies at 83", "link": "https://www.hollywoodreporter.com/music/music-news/rosalind-ashford-dead-martha-and-vandellas-singer-1236704537/", "summary": "The soprano from Detroit performed on hits including “Dancing in the Street,” “Heat Wave,” “Jimmy Mack” and “Quicksand.”", "date_str": "2026-09-17T15:40:17+00:00", "hash": "a669b106bf1c5f91", "title_fa": "روزالیند اشفورد، خواننده اصلی مارتا و واندلاس، در ۸۳ سالگی درگذشت", "summary_fa": "این سوپرانو از دیترویت در آهنگ های موفقی از جمله «رقص در خیابان»، «موج گرما»، «جیمی مک» و «کویکس ساند» اجرا کرد. روزالیند اشفورد، یکی از سه عضو اصلی مارتا و واندلاها که در موسیقی کلاسیک موتاون مانند Dancing in the Street، Heat Wave و Jimmy Mack خوانده بودند، درگذشت. دیترویت فری پرس گزارش داد که او 83 ساله بود. اشفورد که اهل دیترویت بود، سه شنبه به دلایل طبیعی در حومه شهر ردفورد درگذشت. ریوز به روزنامه گفت: از شنیدن خبر درگذشت روزالیند اشفورد بسیار متأسفم. روزالیند نقش مهمی در روزهای اولیه مارتا و واندلا ایفا کرد. صدای او تا ابد با ما از طریق ضبط های عالی با هم خواهد بود و دلتنگ خواهد شد اما هرگز فراموش نخواهد شد. خانواده موتاون ما به تازگی کمی کوچکتر شده است. قلبم سنگین است. داستان های مرتبط شیوه زندگی پیتر مکس، هنرمند پاپ روانگردان، در تلویزیون 88 رادنی چارترز، فیلمبرداری که تقریباً در هر قسمت از 24 فیلمبرداری کرد، در 80 سالگی درگذشت این سوپرانو در نزدیک به دوجین تک آهنگ برتر 40 آهنگ بیلبورد در نمودار R B آواز خواند و به عنوان دومین فیلم راک 5 با ون رول در 19 به عنوان دومین آهنگ راک 5 رول معرفی شد. گروه تمام زنانه به این افتخار است. متولد شهریور 2، 1943، اشفورد در دبیرستان ویلبر رایت تحصیل می کرد که او، آنت بیرد و گلوریا ویلیامز به عضویت گروه دخترانه دلفیس درآمدند که بعداً ریوز به آنها پیوست. این کوارتت همچنین با نام The Vels ضبط کرد. در سال 1962، پس از خواندن نسخه پشتیبان برای ماروین گی و مری ولز، توسط بری گوردی، رئیس موتاون، به آنها پیشنهاد شد که یک قرارداد ضبط کنند و پس از جدایی ویلیامز، به عنوان سه نفر به نام مارتا و وندلاها پیش رفتند."}, {"source": "Hollywood Reporter", "title": "‘Gerbil’ Investigates the Richard Gere Rumor That Will Never Die — In 12 Deep-Dive Episodes", "link": "https://www.hollywoodreporter.com/business/digital/gerbil-podcast-about-richard-gere-rumor-wont-die-1236704503/", "summary": "The new Hollywood Reporter podcast series, led by veteran journalist Allen Salkin, explores the origin and spread of the tenacious urban legend, and what it says about our society.", "date_str": "2026-09-17T15:23:16+00:00", "hash": "e7a125bbb36c2fa8", "title_fa": "«گربیل» شایعه ریچارد گیر را بررسی می کند که هرگز نخواهد مرد - در 12 قسمت از غواصی عمیق", "summary_fa": "مجموعه جدید پادکست هالیوود ریپورتر، به رهبری آلن سالکین، روزنامه‌نگار کهنه‌کار، منشأ و گسترش افسانه شهری سرسخت و آنچه در مورد جامعه ما می‌گوید را بررسی می‌کند. با شنیدن کلمه جربیل اولین چیزی که به ذهنتان می رسد چیست؟ هالیوود مدت‌هاست که در طول تاریخ خود، شایعات ناخوشایند بوده است، و چندین داستان غیرقابل اثبات و غیر قابل اثبات درباره ستاره‌های سینما زندگی خود را به خود اختصاص داده است. (به عنوان مثال، اولین چیزی که با شنیدن اصطلاح هرمافرودیت به آن فکر می کنید چیست؟) اما هیچ کدام سرسخت تر از افسانه بدنام شهری که در اوایل دهه 80 در مورد یک تصادف احتمالی مربوط به ریچارد گیر و یک جونده از گونه های فوق الذکر به وجود آمد، سرسخت تر نبوده است. داستان های مرتبط کسب و کار هانا برنر و پیج دسوربو جوخه گیگلی در قرارداد چند ساله به SiriusXM نقل مکان می کنند (انحصاری) Business Seat Seat Ventures جوهر حسابرسی مالی کالب هامر برای فروش آگهی، قرارداد توزیع (انحصاری) در Gerbil، یک مجموعه جدید گزارشگر هالیوود با سرمایه گذاری 12 ساله ارائه شده است. شایعه، غواصی عمیق در ریشه ها و تکامل آن برای توضیح انعطاف پذیری آن و کشف گسترش اطلاعات نادرست قبل از عصر اینترنت. (داستان جربیل، همانطور که سالکین بیان کرده است، یکی از اولین میم های مدرن است.) همانطور که سالکین در ستون اخیر برای هالیوود ریپورتر نوشت، افسانه ژربیل ممکن است اساسی ترین شایعه در تاریخ هالیوود باشد زیرا کاملاً نشان می دهد که چگونه محصولات صنعت سرگرمی، عمدا و مهمتر از آن، تصادفی، ترس ها، آرزوهای ابدی، کابوس های مغزی و رویاهای ما را بیان می کنند."}, {"source": "Hollywood Reporter", "title": "Siobhan McGroarty, Sophia Reid-Gantzert and West Mulholland Join Prime Video’s ‘Rose Hill’ Adaptation", "link": "https://www.hollywoodreporter.com/tv/tv-news/rose-hill-adds-five-new-cast-members-prime-video-1236704121/", "summary": "Gigi Zumbado and Curtis Hamilton also join the romance adaptation as reoccurring guest stars.", "date_str": "2026-09-17T15:11:35+00:00", "hash": "a011dbce0529b645", "title_fa": "Siobhan McGroarty، Sophia Reid-Gantzert و West Mulholland به اقتباس \"Rose Hill\" Prime Video ملحق شدند", "summary_fa": "جیجی زومبادو و کرتیس همیلتون نیز به عنوان ستاره‌های مهمان که تکرار می‌شوند به این اقتباس عاشقانه می‌پیوندند. Prime Video پنج بازیگر جدید را به رز هیل اضافه کرده است که اقتباسی جدید از رمان‌های عاشقانه شهر کوچک السی سیلور است. سیوبهان مک گروتی، سوفیا رید گانتزرت، وست مولهالند، جیجی زومبادو و کرتیس همیلتون به این مجموعه پیوستند، استریمر روز پنجشنبه اعلام کرد. مک گروتی به عنوان کورا می پیوندد. Reid-Gantzert به عنوان Emmy Belmont می پیوندد. و Mulholland به عنوان Oliver Belmont می پیوندد. این سه نقش نقش ثابت سریال خواهند بود. زومبادو و هامیلون به ترتیب به عنوان تابیتا و بش روسو در یک مهمانی تکراری می‌پیوندند. رز هیل که در یک شهر کوهستانی در کانادا اتفاق می‌افتد، بر اساس کتاب‌های سیلور، عشق وحشی، چشم‌های وحشی، وایلد ساید و کارت وحشی، از اوج و فرودهای عاشقانه بهترین دوستان وست بلمونت و فورد گرانت پیروی می‌کند. جیک ویری قبلاً به عنوان دامدار وست معرفی شده بود، در حالی که شان او پرای تازه وارد برای ایفای نقش فورد مالک یک شرکت ضبط موسیقی انتخاب شده بود. هانا گالوی به عنوان خواهر وست و رز بلمونت علاقه مند فورد به او پیوست. سدی دیکرسون آخرین قطعه پازل بود که بازیگران اصلی را به عنوان ستاره پاپ کانتری اسکایلار استون تکمیل کرد. داستان‌های مرتبط ویدیوی تلویزیونی پرایم در گفتگوها برای تصاحب برنامه‌های ویدیوی تجاری پرایم برنامه‌های پخش تلویزیونی امی با پنج سرویس: Starz، AMC+، BritBox، MGM+ و PBS شاهکار نمایش لاگین لاگین نمایش خوانده می‌شود، بر اساس سریال پرفروش السی سیلور، رز هیل دنبال بهترین دوستان و همسایه‌هایش می‌رود. گرانت، معروف‌ترین میلیاردر جهان فوربس، که مدت‌ها مشعل را برای خواهر وست، رزی حمل می‌کرد. و وقتی اسکایلار استون، ستاره کانتری پاپ، به شهر کوهستانی ناهموارشان می‌وزد، گرما در این درام خانوادگی عاشقانه بالا می‌رود."}, {"source": "Hollywood Reporter", "title": "After Lakers Sale, Mark Walter Also Offloads Stake In Chelsea F.C.", "link": "https://www.hollywoodreporter.com/business/business-news/lakers-sale-mark-walter-chelsea-dodgers-1236704452/", "summary": "The Dodgers mogul's company TWG Global has said it's complying with Justice Dept. and SEC inquiries after claims of fraud at insurance firms in his empire.", "date_str": "2026-09-17T14:45:05+00:00", "hash": "81b63a2e67c13e1d", "title_fa": "پس از فروش لیکرز، مارک والتر نیز سهام باشگاه چلسی را حذف کرد.", "summary_fa": "شرکت غول داجرز، TWG Global، پس از ادعای کلاهبرداری در شرکت های بیمه در امپراتوری خود، اعلام کرده است که با تحقیقات بخش عدالت و SEC مطابقت دارد. مالک داجرز، مارک والتر، اکنون از دومین تیم ورزشی حرفه ای خود در کمتر از یک ماه گذشته خارج شده است. این غول که مجموعه شرکت های TWG Global او با درخواست های وزارت دادگستری و کمیسیون بورس و اوراق بهادار مواجه است، سهام خود را در لیگ برتر باشگاه چلسی F.C تخلیه کرده است. به عنوان بخشی از یک معامله بزرگتر والتر در سال 2022 بخشی از کنسرسیوم تحت رهبری تاد بوهلی بود که پس از تحریم وی توسط دولت بریتانیا به عنوان بخشی از اقدامات انجام شده در مورد جنگ در اوکراین، باشگاه فوتبال را از رومن آبراموویچ تاجر روسی خریداری کرد. این تیم روز چهارشنبه گفت که گروه سرمایه بهداد اقبالی و خوزه ای فلیسیانو به رهبری Clearlake Capital Group که با بوهلی و والتر در خرید چلسی شریک شده بودند، اکنون هر دو سهام خود را خریداری کرده اند. بوهلی گفت: من مطمئن هستم که چلسی برای ادامه موفقیت تحت رهبری کلیرلیک موقعیت خوبی دارد. بوهلی همچنین از طریق شرکت هلدینگ خود دارای سهام متعددی در شرکت های صنعت سرگرمی است. مدیر اجرایی سابق Guggenheim Partners، که شرکت خود به نام Eldridge Industries را در سال 2015 تأسیس کرد، سهامی در تولید کننده گلدن گلوب، دیک کلارک پروداکشنز، تهیه کننده House of Cards MRC، A24، Fulwell Entertainment، Sugar23 و Film Expo Group و بسیاری دیگر داشته است. (بوهلی همچنین کنترل مستقیم هالیوود ریپورتر را در دهه 2010 قبل از فروش مجله به PMC جی پنسک در سال 2020 در دست داشت.) یک سرمایه گذاری مشترک، Penske Media Eldridge، گلدن گلوب را اداره می کند و الدریج در هتل بورلی هیلتون، محل برگزاری گلوب، سهام دارد."}, {"source": "Variety", "title": "‘Onwards and Sideways’ Review: Laura Linney and Rhys Ifans Cut Through the Sweetness of a Gentle, Compassionate Parkinson’s Drama", "link": "https://variety.com/2026/film/reviews/onwards-and-sideways-review-1236865721/", "summary": "There’s nothing fun about Parkinson’s disease, and no film about it can engineer an uncompromised happy ending. But John Madden’s “Onwards and Sideways” finds more uplift than one might expect in a story of two people, both living with Parkinson’s, exploring the possibilities of living with it together. It s generally sunny and soft in outlook, [ ]", "date_str": "2026-09-17T16:40:43+00:00", "hash": "ee2a17af5db5abfc", "title_fa": "نقد و بررسی «به جلو و کناره‌ها»: لورا لینی و ریس ایفان از طریق شیرینی یک درام پارکینسون مهربان و مهربان", "summary_fa": "هیچ چیز سرگرم کننده ای در مورد بیماری پارکینسون وجود ندارد و هیچ فیلمی در مورد آن نمی تواند پایان خوشی را طراحی کند. اما «به جلو و پهلو» جان مدن در داستان دو نفر که هر دو با پارکینسون زندگی می‌کنند و احتمالات زندگی مشترک با آن را بررسی می‌کنند، بیشتر از چیزی که انتظار می‌رود، نشاط می‌یابد. عموماً از نظر چشم‌انداز آفتابی و نرم است، [ ] هر دو به عنوان غریبه‌هایی که رابطه‌شان از روزی شروع می‌شود که هر دو به بیماری مبتلا می‌شوند، عالی است، ستاره‌ها بالانس لازم را به فیلم نرم‌مرکز جان مدن می‌دهند. هیچ چیز سرگرم کننده ای در مورد بیماری پارکینسون وجود ندارد و هیچ فیلمی در مورد آن نمی تواند یک پایان خوش بدون سازش را مهندسی کند. اما جان مدن به بعد و کناره در داستانی از دو نفر که هر دو با پارکینسون زندگی می‌کنند و احتمالات زندگی مشترک با پارکینسون را بررسی می‌کنند، بیشتر از چیزی که انتظار می‌رود احساس می‌کند. عموماً از نظر چشم انداز آفتابی و نرم است، اگرچه به لطف بینش دست اول نویسنده کمدی تلویزیونی کهنه کار و فعال پارکینسون، پل میهو-آرچر (The Vicar of Dibley)، از تأثیرات ناتوان کننده بیماری بر بدن و ذهن کور نیست، که تجربه شخصی خود را از این بیماری به اولین فیلمنامه بلند خود آورده است. حتی زمانی که فیلم به قلمروی آنودین منحرف می‌شود، ستارگان لورا لینی و ریس ایفانس، هر دو به عنوان غریبه‌هایی فوق‌العاده در مناطق روستایی انگلستان که ابتدا چشم‌پوشی می‌کنند، و به تدریج با تشخیص مشترکشان به هم نزدیک می‌شوند، احساس واقعی و یکپارچگی به آن می‌دهند. داستان‌های مرتبط عکس‌های خارجی فیلم برنده جایزه کن رافیکی فاریالا در کنگو پسر (اختصاصی) فیلم خون‌آشام ایزابل هوپر «کنتس خون» خریداری شده برای آمریکای شمالی (اختصاصی) را به تصویر می‌کشد."}, {"source": "Variety", "title": "Zara Larsson Blasts Trump’s White House as ‘F—ing Losers’ for Using ‘Midnight Sun’ to Promote Deportations", "link": "https://variety.com/2026/music/news/zara-larsson-white-house-ice-video-trump-1236865792/", "summary": "Zara Larsson blasted the White House for using her song “Midnight Sun” in a TikTok post depicting ICE agents handcuffing and deporting people, captioned “Never ending deportations.” Larsson replied with a video on her personal TikTok, holding an “L” up to her forehead and saying, “I’m just sad. My heart is heavy seeing that, because [ ]", "date_str": "2026-09-17T16:36:47+00:00", "hash": "77182f717a53decc", "title_fa": "زارا لارسون کاخ سفید ترامپ را به دلیل استفاده از «آفتاب نیمه‌شب» برای ترویج اخراج‌ها به عنوان «بازنده‌ها» توصیف کرد.", "summary_fa": "زارا لارسون کاخ سفید را به دلیل استفاده از آهنگ خود \"Midnight Sun\" در پست TikTok که در آن ماموران ICE در حال دستبند زدن و اخراج مردم را به تصویر می‌کشد، با عنوان \"اخراج‌های بی پایان\" مورد انتقاد قرار داد. لارسون با ویدیویی در TikTok شخصی خود پاسخ داد، و یک \"L\" را روی پیشانی خود نگه داشت و گفت: \"من فقط ناراحت هستم. قلبم از دیدن آن سنگین است، زیرا [ ] او اضافه می کند، من خودم را در زندگی ای که با من برخورد کرده اند بسیار خوش شانس می دانم. این واقعیت که من در سوئد به دنیا آمده‌ام، تحصیل کرده‌ام و همه این فرصت‌ها به نوعی پیش روی من گذاشته شده است. من می توانم سفر کنم و همه این کارهای شگفت انگیز را انجام دهم. That s luck. افرادی هستند که خوش شانس نیستند و می خواهند زندگی بهتری برای خانواده خود داشته باشند. من فقط نمی دانم چگونه می تواند بدترین چیز در جهان باشد که یک مهاجر بدون مدرک باشد. این ویدیو بسیار غیرانسانی است. محبوب در Variety این خواننده در پایان گفت: این افراد در ویدیو افراد واقعی هستند. یه مرد لعنتی اونجا هست با لباس های ساختمانی اون داره کار میکنه این افرادی که فاقد مدارک هستند، افراد معمولی با شغل هستند و فقط سعی می کنند آینده ای بهتر داشته باشند. خیلی احمقانه است که چگونه همه چیز اینقدر ممیزی شده است، به خصوص خورشید نیمه شب، که در مورد احساس ارتباط با طبیعت، جهان و مردم است. و این فقط باعث ایجاد شکاف عظیم بین مردم می شود. خیلی بیحاله لعنتی شما بچه ها خیلی بازنده های لعنتی هستید در اوایل سال جاری، کاخ سفید از یکی دیگر از آهنگ‌های لارسون استفاده کرد و ویدیویی از دونالد ترامپ، رئیس‌جمهور آمریکا در حال رقصیدن با Lush Life با"}, {"source": "Variety", "title": "Variety’s 10 Animators to Watch 2026: Meet the Artists Behind ‘Wildwood,’ ‘Hexed,’ ‘Spider-Man: Beyond the Spider-Verse’ and More", "link": "https://variety.com/lists/animators-to-watch-class-of-2026/", "summary": "Over the past two decades, animated features have pushed the boundaries of art and storytelling while dominating the box office. Earlier this year, Netflix s “KPop Demon Hunters” made history by winning the animated feature Oscar. The triumph was powered in part by its chart-topping original song “Golden.” But behind every animated victory stands a group [ ]", "date_str": "2026-09-17T16:35:00+00:00", "hash": "56e47258dcd0ce60", "title_fa": "10 انیماتور Variety که باید در سال 2026 تماشا کنید: با هنرمندان پشت «Wildwood»، «Hexed»، «Spider-Man: Beyond the Spider-Verse» و موارد دیگر آشنا شوید.", "summary_fa": "در طول دو دهه گذشته، انیمیشن‌ها مرزهای هنر و داستان سرایی را جابجا کرده‌اند و در عین حال بر گیشه‌ها تسلط داشته‌اند. اوایل امسال، «KPop Demon Hunters» نتفلیکس با برنده شدن اسکار انیمیشن بلند تاریخ ساز شد. این پیروزی تا حدی با آهنگ اصلی آن \"طلایی\" که در صدر جدول قرار گرفت، تقویت شد. اما در پشت هر پیروزی انیمیشنی یک گروه ایستاده است [ ] همانطور که به یک سنت سالانه تبدیل شده است، ما از هر برگزیده درخواست کردیم که یک پرتره از خود بسازد تا در این ویژگی اجرا شود. قابل توجه تر، لیست امسال نیز نقطه عطف قابل توجهی است. این فرنچایز که برای اولین بار در سال 2015 راه اندازی شد، اولین نمایش خود را در SCAD AnimationFest خواهد داشت. کالج هنر و طراحی ساوانا، که جشنواره خود را در 23 تا 25 سپتامبر به پردیس SCAD آتلانتا در جورجیا بازمی گرداند، سه روز نمایش اولیه، نگاه های پنهانی و گفتگوهای صنعتی را در تئاتر SCADshow دانشگاه برگزار می     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
