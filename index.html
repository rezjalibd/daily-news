 از آنها همچنان در زندگی مردم انباشته می‌شود.» این گزارش پس از اشاره به آسیب حکومت و حمله خارجی برای مردم ایران، به موضوع کشته‌شدگان و اعدام‌شدگان، بازداشت‌شدگان و ناپدیدشدگان، نقض دادرسی عادلانه، وخیم‌تر شدن فضای مدنی و معیشت مردم و وضعیت محیط زیست و همچنین شرایط زندان‌های ایران در این هشت ماه پرداخته است. رویدادهای دی ماه ۱۴۰۴ و رخدادهای جنگ هم در گزارش مای ساتو بررسی شده‌اند. با این حال خانم ساتو تاکید کرد که «آنچه در این گزارش آمده است، تنها بخش کوچکی از اتفاقاتی است که افتاده است. قطع ارتباطات مخابراتی هیچ راه ایمن برای ارسال اطلاعات به خارج ازکشور باقی نگذاشت. برخی از افرادی که در ابتدا برای ارائه اطلاعات پیشقدم شده بودند، با سنجیدن دوباره پیامدهای این اقدام برای خود و ًخانواده‌شان، رضایت خود را پس گرفتند.» از این رو، «هیچ بخش این گزارش نباید به عنوان تصویر کامل از آنچه بر مردم در ایران رفته است تلقی شود.» خانم ساتو نوشت: «در بازه این گزارش، هزاران نفر در ایران، هم در اثر حملات ایالت متحده آمریکا", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/0439/live/1b71ede0-d2de-11f1-b677-b762d2f83f6e.jpg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آبان • ۱۸:۱۵"}, {"source": "BBC Persian", "title": "دست‌کم ۶۸ نفر بر اثر برخورد دو قطار در اسپانیا کشته شده‌اند", "link": "https://www.bbc.com/persian/articles/cm70pdw540nwo?at_medium=RSS&at_campaign=rss", "summary": "مقام‌های اسپانیا می‌گویند در پی برخورد دو قطار در جنوب مادرید، پایتخت این کشور، دست‌کم ۶۸ نفر کشته و تعداد زیادی زخمی شده‌اند.", "date_str": "2026-10-28T13:30:36+00:00", "hash": "b6dc4130f8a3527a", "title_fa": "دست‌کم ۶۸ نفر بر اثر برخورد دو قطار در اسپانیا کشته شده‌اند", "summary_fa": "مقام‌های اسپانیا می‌گویند در پی برخورد دو قطار در جنوب مادرید، پایتخت این کشور، دست‌کم ۶۸ نفر کشته و تعداد زیادی زخمی شده‌اند. در این حادثه یک قطار که مادرید را به مقصد سویل ترک کرده بود، با قطاری برخورد کرد که ظاهرا متوقف بوده است. دست‌کم دو واگن از شیب کنار خط آهن از خط خارج و به پایین سقوط کرده‌‌اند. در ماه ژانویه، برخورد قطار در همین مسیر به کشته شدن ۴۶ نفر منجر شد و بحث‌هایی را درباره ایمنی راه‌آهن در اسپانیا برانگیخت. بر اساس گزارش‌ها، دولت اسپانیا معتقد است خطای انسانی مرتبط با سیستم علائم راه‌آهن، یکی از دلایل احتمالی حادثه امروز است. پدرو سانچز، نخست‌وزیر اسپانیا، از این حادثه ابراز ناراحتی کرده است. شهردار یکی از مناطق محلی نیز گفت نیروهای امدادی از او خواسته‌اند یک سالن ورزشی را برای اسکان مجروحان آماده کند. مقامات محلی می‌گویند که بیش از ۵۰۰ مسافر در قطارها بوده‌اند. شرکت مدیریت زیرساخت‌های ریلی اسپانیا، آدیف، اعلام کرده است که این حادثه بین قطاری متعلق به شرکت رنفه و قطاری متعلق به شرکت ایریو رخ داده است. شرکت ایریو در مسیر مادرید به سویل خدمات ارائه می‌کند. یک نوجوان ۱۷ ساله که مسافر یکی از قطارها بود، به یک شبکه تلویزیونی اسپانیا گفت: «فاجعه بود» و افزود که در محل حادثه «هرج‌ومرج» حاکم شده بود. امیلیانو گارسیا پیج، رئیس منطقه کاستیا-لامانچا، به شبکه رادیویی اسپانیایی اس‌ای‌آر گفت بیشتر کشته‌شدگان در قطار سریع‌السیر بوده‌اند و شمار کشته‌شدگان در قطار شرکت ایریو «کمتر» است. او افزود: «بدیهی است که انتظار داریم اجساد بیشتری پیدا شود، چون هنوز نتوانسته‌ایم به بخش‌های داخلی‌تر واگن‌ها دسترسی پیدا کنیم.» تصاویر منتشرشده از محل حادثه همچنین چندین نفر را در حال دریافت کمک‌های درمانی نشان می‌دهد. رسانه‌های اسپانیا گزارش داده‌اند که شمار زیادی از مجروحان به بیمارستان‌های محلی منتقل شده‌اند.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/44c9/live/0b9fd250-d2d0-11f1-b677-b762d2f83f6e.png", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۶ آبان • ۱۷:۰۰"}, {"source": "Iran International", "title": "نتانیاهو پیشتاز اما بدون اکثریت، مخالفان در برابر انتخاب دشوار همکاری با احزاب عرب", "link": "https://www.iranintl.com/202610286523", "summary": "نتایج اولیه انتخابات اسرائیل، اردوگاه بنیامین نتانیاهو را پیشتاز اما همچنان دور از اکثریت پارلمانی نشان می‌دهد؛ وضعیتی که مخالفان او نیز برای عبور از آن به توافقی دشوار با احزاب عرب نیاز دارند. تا زمان حل این اختلاف‌ها، نتانیاهو می‌تواند در مقام نخست‌وزیر موقت باقی بماند.", "date_str": "2026-10-28T15:17:14+00:00", "hash": "0ff723d216b4d535", "titl ین‌المللی را نقض می‌کند. این وزارتخانه همچنین با تاکید بر رد هرگونه مداخله در احکام صادرشده از سوی دادگاه‌های کویت، از جمهوری اسلامی خواست به قوانین بین‌المللی، منشور سازمان ملل متحد و به‌ویژه اصل حسن همجواری پایبند باشد. حمد سلیمان المشعان، معاون وزیر خارجه کویت، نیز ضمن محکوم کردن هرگونه دخالت در احکام قضایی این کشور، از جمهوری اسلامی خواست اصل عدم مداخله در امور داخلی کشورها و کنوانسیون وین درباره روابط دیپلماتیک را رعایت کند. روابط ایران و کویت در ماه‌های اخیر، در پی حملات موشکی و پهپادی جمهوری اسلامی به کویت در واکنش به حملات آمریکا و اسراییل، تیره شده است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/gulfnews_2F2026-10-22_2Fdw9sxj0i_2Fgettyimages-1243062178-612x612_EGWl__v1024x512__box_0%2C270%2C1199%2C900.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۶ آبان • ۱۷:۳۸"}, {"source": "IranWire", "title": "چین هرگز برای ایران چتر نظامی باز نمی‌کند", "link": "https://iranwire.com/fa/features/159487-%DA%86%DB%8C%D9%86-%D9%87%D8%B1%DA%AF%D8%B2-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%DA%86%D8%AA%D8%B1-%D9%86%D8%B8%D8%A7%D9%85%DB%8C-%D8%A8%D8%A7%D8%B2-%D9%86%D9%85%DB%8C%DA%A9%D9%86%D8%AF/", "summary": "«حامد وفایی» پژوهشگر متخصص زبان، ادبیات و مطالعات چین در گفت و گویی با «محمد فاضلی» جامعه‌شناس در کانال یوتیوبی «ایران‌تاک» به تحلیل روا ...", "date_str": "2026-10-28T14:28:43+00:00", "hash": "15b93557a190ba83", "title_fa": "چین هرگز برای ایران چتر نظامی باز نمی‌کند", "summary_fa": "«حامد وفایی» پژوهشگر متخصص زبان، ادبیات و مطالعات چین در گفت و گویی با «محمد فاضلی» جامعه‌شناس در کانال یوتیوبی «ایران‌تاک» به تحلیل روا ... حامد وفایی در تشریح سیاست چین و نگاه این کشور به جمهوری اسلامی توضیح داده‌است: «تداوم حمایت‌های دیپلماتیک و سیاسی چین از ایران، مشروط و منوط به ماندن جمهوری اسلامی در معاهده منع گسترش سلاح‌های هسته‌ای ( ل را در The Verge بخوانید. اخبار هوش مصنوعی Google Gemini 4 Carbon را با «جهش قابل توجهی» در امنیت سایبری راه‌اندازی می‌کند. اما راث، 28 اکتبر 2026، ساعت 8:03 بعد از ظهر UTC پیوند اشتراک‌گذاری تصویر هدیه: The Verge Emma Roth یک خبرنویس است که جنگ‌های جریان، فناوری مصرف‌کننده، رمزنگاری، رسانه‌های اجتماعی و موارد دیگر را پوشش می‌دهد. او پیش از این نویسنده و ویراستار MUO بود. گوگل جدیدترین مدل مرزی خود را با نام Gemini 4 Carbon منتشر کرده است که \"دستاوردهای قابل توجهی\" در زمینه کدگذاری، وظایف نمایندگی و امنیت سایبری ارائه می دهد. در اطلاعیه‌ای در روز چهارشنبه، گوگل برترین جایگاه کربن در شاخص هوش مصنوعی (v5.0) را نشان می‌دهد و Claude Opus 5.5 و GPT-6 Astra را پشت سر گذاشته‌اند. گوگل می گوید Gemini 4 Carbon برای انجام کارهای طولانی تر ساخته شده است، و اضافه می کند که تیم های داخلی آن دیده اند که \"روزها در حال دویدن است تا در بن بست ها برای مقابله با وظایف پیچیده و چند مرحله ای مهندسی ادامه یابد.\" به گفته گوگل همچنین در اجتناب", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/03/STK255_Google_Gemini_A.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Google"], "datetime_fa": "۶ آبان • ۲۳:۳۳"}, {"source": "TechCrunch Main", "title": "Hacker stole personnel data about thousands of Homeland Security employees, including CBP and ICE agents", "link": "https://techcrunch.com/2026/10/28/hacker-stole-personnel-data-about-thousands-of-homeland-security-employees-including-cbp-and-ice-agents/", "summary": "A hacker obtained personally identifiable information about more than 40,000 Homeland Security staffers, which has since been published online.", "date_str": "2026-10-28T20:01:00+00:00", "hash": "c2c4d037f0448c5f", "title_fa": "هکر اطلاعات پرسنل هزاران کارمند امنیت داخلی، از جمله عوامل CBP و ICE را سرقت کرد", "summary_fa": "یک هکر اطلاعات قابل شناسایی شخصی بیش از 40000 کارمند امنیت داخلی را به دست آورد که از آن زمان به صورت آنلاین منتشر شده است. این نقض شامل اسامی، عناوین شغلی، و اطلاعات تماس کاری، مانند آدرس ایمیل، شماره تلفن همراه، و محل دفاتر بیش از 40000 نفری است که برای دپارتمان فدرال کار می‌کنند، از جمله ماموران مرزی و مهاجرت، کارکنان امنیت سایبری و مقامات ارشد وزارتخانه. یک هکر که توسط اداره صلح اداره می‌شود، ادعا کرد که داده‌ها را از یک سیستم ثبت نام Okta به دست آورده‌اند که توسط امنیت داخلی استفاده می‌شود تا به کارمندان و پیمانکاران در سراسر آژانس‌های مختلف اجازه ورود به شبکه مرکزی آن را بدهد. سیستم Okta همچنین حاوی سوابق IT و ورود به سیستم مرتبط با حساب کاربری کارمندان است، از جمله جزئیات مربوط به سیستم ها و برنامه های داخلی که آنها مجاز به دسترسی هستند. بیش از نیمی از مجموعه داده - حدود 21000 پرونده - مربوط به کارمندان گمرک و حفاظت مرزی ایالات متحده (CBP) است که در فرودگاه ها و سایر بنادر ورودی کار می کنند. این داده ها همچنین حاوی سوابق مربوط به 10000 کارمند دیگر از اداره مهاجرت و گمرک (ICE) و واحد تحقیقات امنیت داخلی آن (HSI) و کمتر از 1000 کارمندی است که در آژانس دفاع امنیت سایبری ایالات متحده CISA کار می کنند. هزاران پرونده اضافی مربوط به کارکنانی است که در مقر این وزارتخانه و سایر آژانس‌های آن، از جمله خدمات شهروندی و مهاجرت ایالات متحده و خدمات حفاظتی فدرال کار می‌کنند. وزارت صلح در یادداشتی که همراه با داده‌هایی که TechCrunch دیده است، گفت: آنها اطلاعات ما را دارند، بنابراین عادلانه است که ما اطلاعات آنها را داشته باشیم. هکر به ایمیل TechCrunch که درخواست نظر داده بود و سؤالاتی در مورد نحوه انجام نقض پاسخ نداد.", "image_url": "https://techcrunch.com/wp-content/uploads/2026/10/dhs-2255143488.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "عامل‌های هوشمند"], "datetime_fa": "۶ آبان • ۲۳:۳۱"}, {"source": "Ars Technica", "title": "Trump admin sues Utah to save Kalshi from the state's total ban on gambling", "link": "https://arstechnica.com/tech-policy/2026/10/trump-admin-sues-utah-to-save-kalshi-from-the-states-total-ban-on-gambling/", "summary": "The Trump administration is trying to stop Utah from enforcing its gambling ban against Kalshi, making Utah the 10th state sued by the US government agency that regulates prediction markets. Utah, which prohibits gambling, sued Kalshi in a state court last week. Utah's lawsuit seeks an order prohibiting Kalshi from offering bets on sports, elections, politics, and other events. “Kalshi runs an online casino in Utah and calls it a prediction market. That violates Utah law,” Utah Attorney General Derek Brown, a Republican, said last week. “Not only do our state laws ban gambling but Utah is one of only two states where gambling is also prohibited under the state constitution. For 130 years, Utah has been clear: gambling has no place here, and we will enforce our laws.” Read full article Comments", "date_str": "2026-10-28T19:30:33+00:00", "hash": "323ad831c889ef28", "title_fa": "مدیر ترامپ از یوتا شکایت کرد تا کالشی را از ممنوعیت کامل قمار در ایالت نجات دهد", "summary_fa": "دولت ترامپ در تلاش است تا یوتا را از اجرای ممنوعیت قمار خود علیه کالشی باز دارد و یوتا را به دهمین ایالت مورد شکایت آژانس دولتی ایالات متحده که بازارهای پیش بینی را تنظیم می کند، تبدیل می کند. یوتا، که قمار را ممنوع می کند، هفته گذشته از کالشی در دادگاه ایالتی شکایت کرد. دعوای یوتا به دنبال دستوری است که کالشی را از پیشنهاد شرط بندی در ورزش، انتخابات، سیاست و رویدادهای دیگر منع کند. کالشی یک کازینو آنلاین در یوتا دارد و آن را بازار پیش‌بینی می‌نامد. درک براون، دادستان کل یوتا، یک جمهوری خواه، هفته گذشته گفت: \"قوانین ایالتی ما نه تنها قمار را ممنوع می کنند، بلکه یوتا یکی از دو ایالتی است که قمار در آن نیز طبق قانون اساسی ایالت ممنوع است. برای 130 سال، یوتا روشن است: قمار اینجا جایی ندارد و ما قوانین خود را اجرا خواهیم کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید به حداقل رساندن برای پیمایش دولت ترامپ در تلاش است تا یوتا را از اجرای ممنوعیت قمار خود علیه کالشی منع کند، و یوتا دهمین ایالت مورد شکایت آژانس دولتی ایالات متحده است که بازارهای پیش بینی را تنظیم می کند. یوتا قبلاً کالشی را در دادگاه فدرال شکست داده بود، پس از اینکه بازار پیش‌بینی یک دادخواست پیشگیرانه تنظیم کرد که به دنبال جلوگیری از اجرای قوانین قمار توسط ایالت بود. اکنون که یوتا در تلاش خود برای تعطیل کردن Kalshi پیش می رود، باید در برابر شکایتی که توسط کمیسیون معاملات آتی کالای ایالات متحده (CFTC) ارائه شده است، دفاع کند. کمیسیون دیروز گفت که CFTC \"برای جلوگیری از تلاش های ایالت برای بستن بازارهای قراردادی ثبت شده در CFTC با استفاده از قوانین ایالتی،", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/09/kalshi-1152x648-1788462763.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۶ آبان • ۲۳:۰۰"}, {"source": "Ars Technica", "title": "The last, best hope for space tourism just rolled onto a runway in Arizona", "link": "https://arstechnica.com/space/2026/10/the-last-best-hope-for-space-tourism-just-rolled-onto-a-runway-in-arizona/", "summary": "The private space tourism era looked so very promising five years ago. Blue Origin and Virgin Galactic had begun flying customers—real people with zero space experience—on suborbital missions. And at about the same time, private citizens were going to orbit for days at a time aboard SpaceX's Crew Dragon. But that was then. Consider the state of play today: It has been 10 months since Blue Origin's New Shepard spacecraft flew its last mission in January. The program was subsequently \"paused,\" but let's be real. Blue Origin has moved on. New Shepard's engineering teams are now supporting the New Glenn rocket and Blue Moon lander programs. SpaceX flew its final free-flyer mission on Dragon, Fram2, in April 2025. A handful of non-NASA missions bound for space stations remain on the spacecraft's manifest, but all are likely to carry at least one government astronaut. Then Dragon will be retired. There is no credible timeline for SpaceX's Starship to fly humans into space from Earth. As for Virgin Galactic, the company flew its final suborbital mission on the VSS Unity spacecraft more than two years ago, in June 2024. So we are now 10 months, and counting, without a space tourism mission in the United States. Read full article Comments", "date_str": "2026-10-28T19:20:36+00:00", "hash": "4a4bb01719cb4433", "title_fa": "آخرین و بهترین امید برای گردشگری فضایی به تازگی بر روی باند فرودگاهی در آریزونا قرار گرفت", "summary_fa": "عصر گردشگری فضایی خصوصی پنج سال پیش بسیار امیدوارکننده به نظر می رسید. Blue Origin و Virgin Galactic شروع به پرواز با مشتریان - افراد واقعی با تجربه فضایی صفر - در ماموریت های زیر مداری کرده بودند. و تقریباً در همان زمان، شهروندان خصوصی قرار بود برای روزها در یک زمان بر روی Crew Dragon اسپیس ایکس در مدار باشند. اما آن موقع بود. وضعیت بازی امروز را در نظر بگیرید: 10 ماه از آخرین پرواز فضاپیمای نیو شپرد متعلق به Blue Origin در ژانویه گذشته است. برنامه متعاقباً \"مکث\" شد، اما بگذارید واقعی باشیم. Blue Origin حرکت کرده است. تیم‌های مهندسی نیو شپرد اکنون از برنامه‌های فرودگر موشک نیو گلن و بلو مون پشتیبانی می‌کنند. اسپیس ایکس آخرین ماموریت پرواز آزاد خود را در آوریل 2025 بر روی دراگون، فرام 2 انجام داد. تعداد انگشت شماری از ماموریت های غیر ناسا به مقصد ایستگاه های فضایی در مانیفست فضاپیما باقی مانده اند، اما احتمالاً همه آنها حداقل یک فضانورد دولتی را حمل می کنند. سپس دراگون بازنشسته خواهد شد. هیچ جدول زمانی معتبری برای استارشیپ اسپیس ایکس برای پرواز انسان از زمین به فضا وجود ندارد. در مورد Virgin Galactic، این شرکت آخرین ماموریت زیرمداری خود را بیش از دو سال پیش، در ژوئن 2024، با فضاپیمای VSS Unity انجام داد. بنابراین، اکنون 10 ماه است که بدون ماموریت گردشگری فضایی در ایالات متحده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به ناوبری به حداقل برسد عصر گردشگری فضایی خصوصی پنج سال پیش بسیار امیدوارکننده به نظر می رسید. Blue Origin و Virgin Galactic شروع به پرواز با مشتریان - افراد واقعی با تجربه فضایی صفر - در ماموریت های زیر مداری کرده بودند. و تقریباً در همان زمان،", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/VIRGIN-GALACTIC_CORDWELL_10232026_APEIRON_STILLS-SELECT-1653-2560x1440.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۶ آبان • ۲۲:۵۰"}, {"source": "Ars Technica", "title": "Touchscreen MacBook Pro hands-on: OLED looks great on a Mac", "link": "https://arstechnica.com/apple/2026/10/touchscreen-macbook-pro-hands-on-oled-looks-great-on-a-mac/", "summary": "LOS ANGELES—For about five minutes on an extremely crowded showroom floor, I got to take pictures of the new MacBook Pro and test out some of its new features. First impressions: It's not as much of a departure from the previous design as I expected, but the outstanding OLED display steals the show regardless. The first thing I noticed was that it's lighter. My daily driver is a 14-inch MacBook Pro (M1 Max), and it's a bit weighty for a 14-incher. Picking up the new model, I could immediately tell it was lighter. It's not like it's in a different general weight class, but it's a noticeable difference. Read full article Comments", "date_str": "2026-10-28T19:10:29+00:00", "hash": "911b93a4201e6e20", "title_fa": "صفحه لمسی مک بوک پرو دستی: OLED در مک عالی به نظر می رسد", "summary_fa": "لس آنجلس - برای حدود پنج دقیقه در یک نمایشگاه بسیار شلوغ، باید از مک بوک پرو جدید عکس بگیرم و برخی از ویژگی های جدید آن را آزمایش کنم. اولین برداشت: آنطور که من انتظار داشتم از طراحی قبلی انحراف ندارد، اما صفحه نمایش برجسته OLED بدون توجه به این موضوع، نمایش را می دزدد. اولین چیزی که متوجه شدم این بود که سبک تر است. درایور روزانه من یک مک بوک پرو 14 اینچی (M1 Max) است و برای یک 14 اینچی کمی سنگین است. با برداشتن مدل جدید، بلافاصله متوجه شدم سبک تر است. اینطور نیست که در یک کلاس وزنی عمومی متفاوت باشد، اما تفاوت محسوسی است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش نکته بعدی که متوجه شدم جزیره پویا بود. با توجه به صفحه نمایش بزرگتر لپ تاپ، تسلط آن بر روی صفحه نمایش بسیا on. Meanwhile, the Chrome team claims that Carbon is 10 times better at generating \"high-quality\" patches compared to non-Google models. Google also notes that Carbon has increased its score by 89 points on WebDev Arena , now ranking at number four on the leaderboard. Read full article Comments", "date_str": "2026-10-28T18:47:27+00:00", "hash": "39c771d30531e121", "title_fa": "گوگل Gemini 4 Carbon را معرفی کرد، آخرین مدل هوش مصنوعی مرزی خود که نمی توانید از آن استفاده کنید", "summary_fa": "تقریباً مثل این است که گوگل پس از وقفه ای که در عرضه مدل های جدید هوش مصنوعی مرزی در اوایل امسال داشت، چیزی برای اثبات دارد. تنها دو هفته پس از عرضه Gemini 4 Argon، گوگل Gemini 4 Carbon را معرفی کرد. این همان مدل فلش نیست که ما منتظرش بودیم، بلکه یک پیشرفت در آرگون است، و مانند آن مدل، گوگل در حال کار بر روی یک نسخه مرحله‌ای است که ممکن است مدتی طول بکشد. اگر قبلاً این مورد را شنیده اید، مرا متوقف کنید: گوگل می گوید آخرین مدل هوش مصنوعی آن به آستانه جدیدی در کدنویسی، وظایف نمایندگی و تجزیه و تحلیل علمی رسیده است. در واقع آنقدر توانمند است که گوگل هنوز نمی تواند به شما اجازه استفاده از آن را بدهد. گزارش شده است که Gemini 4 Carbon دستاوردهای بزرگی در برنامه های امنیت سایبری دارد. گوگل می گوید که این مدل \"جهش قابل توجهی\" در تشخیص آسیب پذیری، اعتبار سنجی و اصلاح نشان می دهد. همچنین ظاهراً کربن در مقایسه با آرگون دو برابر بیشتر احتمال دارد کدی بدون آسیب‌پذیری تولید کند. در همین حال، تیم کروم ادعا می کند که کربن 10 برابر در تولید وصله های \"با کیفیت بالا\" در مقایسه با مدل های غیر گوگل بهتر است. گوگل همچنین خاطرنشان می کند که کربن امتیاز خود را 89 امتیاز در WebDev Arena افزایش داده است و اکنون در رتبه چهارم جدول امتیازات قرار دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید تقریباً مانند این است که گوگل پس از وقفه ای از عرضه مدل های هوش مصنوعی مرزی جدید در اوایل امسال چیزی برای اثبات دارد. تنها دو هفته پس از عرضه Gemini 4 Argon، گوگل", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/04/gemini-general-2-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "امنیت سایبری"], "datetime_fa": "۶ آبان • ۲۲:۱۷"}, {"source": "Engadget", "title": "Apple's PROLED XDR Display has a cringy name but incredible specs", "link": "https://www.engadget.com/2300407/apples-proled-xdr-display-has-a-cringy-name-but-incredible-specs/", "summary": "With all the fuss about Apple finally releasing a touchscreen MacBook Pro, you may have forgotten about the OLED part.", "date_str": "2026-10-28T20:31:43+00:00", "hash": "9b9665eb66c7a837", "title_fa": "صفحه نمایش PROLED XDR اپل نامی عجیب دارد اما مشخصاتی باورنکردنی دارد", "summary_fa": "با تمام هیاهوهایی که در مورد اپل بالاخره یک مک بوک پرو با صفحه نمایش لمسی عرضه کرد، ممکن است قسمت OLED را فراموش کرده باشید. نمایشگرها روشنایی، کنتراست و دقت رنگ بالایی را ارائه می دهند و حتی با استفاده از پیکسل سازگار می شوند. Apple Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover با همه هیاهوهایی که در مورد عرضه اپل با صفحه نمایش لمسی MacBook Pro وجود دارد، ممکن است دیگر فناوری صفحه نمایش کلیدی مدل جدید را فراموش کرده باشید: OLED یا آنچه اپل PROLED XDR می نامد. برای اپل معمول است که یک اصطلاح فنی استاندارد را به یک نام متمایل به بازاریابی تغییر دهد، اما در این مورد، به نظر می رسد که نام \"PRO\" موجه باشد. مک بوک پروهای جدید دقیقاً برای عکاسان، هنرمندان و ویرایشگرهای ویدئویی طراحی شده اند که می توانند قیمت بالای صفحه نمایش لمسی با کیفیت را توجیه کنند. اپل برای جذب این افراد، فقط یک ویژگی لمسی و صفحه نمایش OLED را ادغام نکرد و آن را یک روز نامید. در عوض، آن چیزی که به نظر می رسد یکی از بهترین نمایشگرهای حرفه ای لپ تاپ تا کنون است، با روشنایی و کنتراست بالا، دقت رنگ عالی و حتی یک موتور نمایشگر که با سن پیکسل تطبیق می یابد، ساخته است. برای مدل‌های جدید، اپل از فناوری OLED پشت سر هم (برای اولین بار در M4 iPad Pro استفاده شد) استفاده کرد که چندین لایه ارگانیک را در یک صفحه نمایش واحد قرار می‌دهد. با قضاوت بر اساس گرافیک اپل در بیانیه مطبوعاتی خود، E-2026-97631 ردیابی می‌شود، یک نقص خرابی حافظه در یک مؤلفه ICMP است که مهاجمان می‌توانند از آن برای اجرای کد مخربی که قبل از اجرای سیستم‌عامل و سفت‌افزار اجرا می‌شود، استفاده کنند. در حالی که محموله‌های نهایی تحویل‌شده توسط CVE-2026-97631 هیچ ماندگاری ندارند - به این معنی که فقط یک بار اجرا می‌شوند - آنها می‌توانند به مهاجمان فضای وسیعی برای نصب بارهای دیگر که هر بار در اوایل فرآیند بوت اجرا می‌شوند، بدهند.", "image_url": "https://media.wired.com/photos/6ae24b1f7359ba945850d85b/191:100/w_1280,c_limit/Security_Code-execution%20flaw%20in%20UEFI%20firmware%20affects%20most%20servers%20on%20planet%20Earth_v2.jpg", "category": "هوش مصنوعی مولد", "tags": ["Microsoft", "عامل‌های هوشمند"], "datetime_fa": "۷ آبان • ۰۰:۰۰"}, {"source": "Wired", "title": "Massive Leak Exposes 41,000 Homeland Security Workers—Including Undercover ICE Agents", "link": "https://www.wired.com/story/massive-leak-exposes-41000-homeland-security-workers-including-undercover-ice-agents/", "summary": "The leaked records include the locations of ICE and CBP facilities, workers’ cell phone numbers, and the members of groups tied to wiretap programs, Palantir software, and xAI’s Grok chatbot.", "date_str": "2026-10-28T20:00:00+00:00", "hash": "cdbd0ebd7ab813a4", "title_fa": "افشای گسترده 41000 کارمند امنیت داخلی - از جمله عوامل مخفی ICE", "summary_fa": "سوابق فاش شده شامل مکان‌های تاسیسات ICE و CBP، شماره تلفن‌های همراه کارگران و اعضای گروه‌های مرتبط با برنامه‌های شنود، نرم‌افزار Palantir و چت ربات xAI Grok است. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان یک افشای بی سابقه از سوابق وزارت امنیت داخلی جزئیات بیش از 41000 کارمند یا پیمانکاری را که برای این بخش و آژانس های تشکیل دهنده آن کار می کنند فاش کرده است. این سوابق شامل آدرس های ایمیل، شماره تلفن، و آدرس دفتر، اما همچنین ارجاع به سیستم های داخلی و اطلاعات حساس در مورد برنامه های مخفی و نظارت است. در کل، این نشت نقشه ای از نحوه سازماندهی DHS و نحوه عملکرد آن ارائه می دهد. سوابق، که شامل خود DHS و همچنین هفت آژانس جزء، "link": "https://www.businessinsider.com/elizabeth-holmes-famous-theranos-photo-explained-behind-the-scenes-2026-10", "summary": "The iconic 2014 photo of Elizabeth Holmes shot by Ethan Pines. Ethan Pines/Forbes Collection/Contour by Getty Images Ethan Pines shot Elizabeth Holmes for a Forbes cover story in 2014. The photo of Holmes holding a blood vial has become synonymous with the disgraced Theranos founder. Pines spoke to Business Insider about meeting Holmes and his thoughts on \"You Can See Everything.\" As photographer Ethan Pines drove to the Theranos offices in Silicon Valley, all he could think about was how to make his shoot with its founder, Elizabeth Holmes , stand out. It was 2014, and the hype around Holmes' health technology company, which boasted it could run hundreds of medical and diagnostic tests using only a few drops of blood, had hit its zenith. The 30-year-old Holmes was on the verge of becoming the youngest self-made female billionaire with a net worth of $4.5 billion. Pines had photographed CEOs before, and he was racking his brain for ways to make the visuals for Holmes' Forbes cover story memorable. He never could have predicted that his shot of Holmes would become the symbol of the now-disgraced CEO's meteoric rise and spectacular fall, not to mention imitated on TV series , put on billboards , and discussed in a popular documentary. Twelve years later, Pines' photo of Holmes has re-entered the zeitgeist thanks to Nathan Fielder and Lance Oppenheim's hit documentary, \"You Can See Everything,\" which chronicles the life of Holmes and her partner, Billy Evans, in the final weeks before Holmes reports to prison for defrauding investors. Pines' famous shot is brought up several times in the doc. At one point, while having her body scanned to create an AI hologram, Holmes breaks down, recalling how her image has become a symbol of duplicity in the press. The poster for Alex Gibney s 2019 documentary on Holmes. HBO This isn't the first time P s and practically all drones — just like how your Apple, Dell, and HP laptops are not made in the US. In this StoryStream, we’re following the latest on the foreign gadget bans. MSI just got a router ban waiver — but not a blanket one. Will TP-Link really make routers in the US? Here’s what it told us Another ‘DJI front company’ bites the dust. It sure would be nice if these congresspeople would say why DJI is a threat. Unlike Netgear and Asus, TP-Link says it’s prepared to spend $1 billion to make Wi-Fi routers in the US. The FCC plans to ban all Chinese labs from testing US gadgets by 2029. The FCC has decertified two more Chinese test labs. The Matic is the first robovac to get an FCC ban waiver, not that it needs it Asus won’t say how it escaped the US r", "date_str": "2026-10-28T19:37:31+00:00", "hash": "d5a4e9683d18aed1", "title_fa": "ممنوعیت ابزارهای خارجی: همه اخبار مربوط به سرکوب فناوری چین توسط FCC", "summary_fa": "یک گلوله قبل از جلسه کمیسیون باز در FCC. | عکس: Al Drago/Bloomberg از طریق Getty Images پهپادها، روترها و Roombas چه وجه مشترکی دارند؟ دولت آمریکا می خواهد چینی ها را از ورود به کشور باز دارد. آنها اولین گجت های مصرف کننده ای هستند که به دلیل موضع بیگانه هراسانه دولت ایالات متحده با ممنوعیت های وارداتی روبرو هستند - و ممکن است آخرین آنها نباشند. در ابتدا، دولت ایالات متحده فقط نگران شبکه های ایالات متحده بود. بیش از یک دهه است که به ارائه‌دهندگان تجهیزات مخابراتی چینی Huawei و ZTE بی‌اعتماد بوده و در نهایت از ارائه‌دهندگان مخابراتی خواسته است که تجهیزات خود را «تعویض و تعویض» کنند. (بسیاری از مخابرات هنوز نتوانسته اند این کار را انجام دهند.) یک \"فهرست موجودیت\" برای شرکت هایی ایجاد کرد که تجهیزات آنها باید از واردات، بازاریابی و فروش منع شود. اما در دولت دوم ترامپ، این فهرست علیه کل دسته‌های ابزارهای مصرف‌کننده خانگی نیز مورد استفاده قرار گرفت - از دسامبر 2025، زمانی که FCC ترامپ و برندن کار همه پهپادهای خارجی آینده را ممنوع کردند، مگر اینکه شرکت‌های آنها معافیت دریافت کنند. بعدی ممنوعیت همه روترهای خارجی آینده، همه ربات‌های خارجی آینده و اینور ght from your watch or app, and all from the comfort of your home. First up, make sure you download offline maps at home. The Race 3S offers free worldwide offline maps with contour lines and place names, and you pay no subscription. Download your regions over wifi before you leave, so you aren't relying on a phone signal at the trailhead. The 64GB of storage leaves room for several regions, so grab the places you actually run, plus anywhere you're traveling. Menu paths can shift with firmware updates, so check the Suunto app if the layout has changed. From there, build a library of points of interest. A POI is any spot worth returning to, such as a trailhead, water source, campsite, or viewpoint and with Suunto specifically, you get a broad definition of POI, including spots for hunting, fishing, foraging, or wildlife watching. There are built-in POI types for noting where a deer seemed to have rubbed its antlers, where you've seen marine mammals, or where you've spotted mushrooms. And with the Race 3S, you can store up to 250 of them on the watch. You can create them on the map in the Suunto app without even being there in person, or when you do stumble upon one, you can save your current location from the watch mid-run. You just have to plug in the POI as a Navigation Target under the options for your trail run or other activity. There's also a navigation app, accessible from the bottom of the widget list (select All Apps), and you can navigate without having an activity running. Organize t", "date_str": "2026-10-28T19:30:18+00:00", "hash": "2a3928b597740e1d", "title_fa": "پنج هک که هر کاربر Suunto Race 3S باید بداند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. Race 3S جدید سونتو یک ساعت مسابقه ای سبک وزن و درجه یک است، اما با قیمت خرده فروشی 599 دلار، از Race S که به طور منظم با قیمت 299 دلار به فروش می رسد، یک صعود تند است. با این حال، مطمئناً برخی ارتقاءهای عمده وجود دارد: باتری آن 46 درصد بیشتر از Race S را نگه می دارد و برای 3  Fountain Interactive With Tiny Computers ($4), when you use the Duo half-open, it turns the bottom display into a keyboard, and the screen goes up top. The app features computers inspired by Commodore 64, Windows 95, iMac G3, Macintosh, IBM PC, Amiga 500, ThinkPad, iBook G3, Powerbook G4, and Windows XP. The attention to detail is great, but early App Store reviews mention that the app can be buggy. This Walkman-inspired app adds a retro feel to Apple Music I miss the tactile nature of playing music on my cassette player at home, and my old Sony Walkman clone. Deck-Man ($5) is an app that brings the Walkman's interface, complete with all the clicks and clacks, to your iPhone Duo. Each time you play an album, Deck-Man lets you \"insert\" the cassette in the player before it starts playing. The app links to your Apple Music account and it also supports playing local music files. Turn your Duo into an accordion Foldissimo (free, $10 to unlock all songs) simulates the sound of airflow in an accordion as you fold and unfold your iPhone Duo. It has some songs pre-loaded, and you can pay $10 to unlock all songs. Foldissimo also supports a few other instruments (accordion organ, panpipes, and theremin), but you'll need to pay an additional $10 to unlock those. This retro camcorder \"switches on\" when you open the Duo With Flipcorder ($5), while the viewfinder and the retro interface are visible to you when you have the Duo in tablet mode, your subjects can also see the frame via the outer display. When you fold the Duo, the app saves the clip, and allows you to record up to 30 minutes of video per day, each of which is saved in a virtual \"tape.\" This puzzle game lets you fold your way to solutions Orisuji ($5) is a puzzle game where you solve mazes by folding your iPhone Duo. It has 69 levels, and you'll be solving most of these by folding or unfolding the device to shift the position of the maze to make your characters move, unlock doors, or to find keys to get past locked doors. Fold your Duo for this sandwich-making game Credit: Toastie Toastie (", "date_str": "2026-10-28T19:00:00+00:00", "hash": "b835a4f1af7fd356", "title_fa": "10 برنامه سرگرم کننده و عجیب آیفون Duo که ارزش بررسی دارند", "summary_fa": "عرضه آیفون Duo اولین باری است که اپل اساساً فرم فاکتور آیفون را تغییر داده است. این یک توسعه هیجان‌انگیز است، زیرا در میان دلایل دیگر، به توسعه‌دهندگان اپلیکیشن اجازه می‌دهد حتی خلاقیت بیشتری داشته باشند. اگر آیفون Duo دارید، قصد دارید یکی از آن ها را تهیه کنید، یا اگر فقط به رابط های برنامه خلاقانه علاقه دارید، باید نگاهی به این برنامه ها بیندازید. iPhone Duo را به یک کامپیوتر قدیمی تبدیل کنید اعتبار: Fountain Interactive With Tiny Computers (4 دلار)، وقتی از Duo نیمه باز استفاده می کنید، صفحه نمایش پایینی را به صفحه کلید تبدیل می کند و صفحه از بالا بالا می رود. این برنامه دارای رایانه هایی است که از Commodore 64، Windows 95، iMac G3، Macintosh، IBM PC، Amiga 500، ThinkPad، iBook G3، Powerbook G4 و Windows XP الهام گرفته شده است. توجه به جزئیات عالی است، اما بررسی های اولیه اپ استور اشاره می کند که برنامه ممکن است باگ باشد. این برنامه الهام گرفته از واکمن، حس یکپارچهسازی با سیستمعامل به Apple Music اضافه می کند. Deck-Man (5 دلار) برنامه ای است که رابط Walkman را با تمام کلیک ها و ضربه ها به iPhone Duo شما می آورد. هر بار که آلبومی را پخش می کنید، Deck-Man به شما این امکان را می دهد که نوار کاست را قبل از شروع پخش در دستگاه پخش کنید. این برنامه به حساب Apple Music شما پیوند می‌خورد و از پخش فایل‌های موسیقی محلی نیز پشتیبانی می‌کند. Duo خود را به آکاردئون تبدیل کنید Foldissimo (رایگان، 10 دلار برای باز کردن قفل همه آهنگ‌ها) صدای جریان هوا را در آکاردئون شبیه‌سازی می‌کند که آیفون Duo خود را تا کرده و باز می‌کنید. تعدادی آهنگ از پیش بارگذاری شده دارد و می توانید برای باز کردن قفل همه آهنگ ها 10 دلار بپردازید. Foldissimo", "image_url": "https://lifehacker.com/imagery/articles/01M61TKRZS4S045XN049CT5FAC/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "موسیقی"], "datetime_fa": "۶ آبان • ۲ arbon نوید بهبود در امنیت سایبری و مهندسی نرم افزار پیچیده را با همان قیمت های توکن مقدماتی پرچمدار قبلی خود، Argon، می دهد. همچنین بر اساس تست‌های گوگل و افراد خارجی، در بیشتر معیارهای رایج سازمانی، جایگاه برتر را در جهان دارد. ادامه مطلب", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google", "امنیت سایبری"], "datetime_fa": "۶ آبان • ۲۱:۵۵"}, {"source": "Ars Technica", "title": "Amazon turns its most capable smart speaker into a smart camera, too", "link": "https://arstechnica.com/gadgets/2026/10/amazon-adds-a-camera-to-its-best-sounding-smart-speaker-for-30-extra/", "summary": "Since debuting in 2019, Amazon's Echo Studio targeted users who wanted superior audio quality from their Alexa-based smart speaker. The latest Echo Studio adds another less-expected differentiator: an integrated camera. The Echo Studio with Home Camera, released alongside a pile of other Alexa devices today, doesn’t have many audio upgrades over the standard Echo Studio. Each speaker has one 3.75-inch high-excursion woofer and three full-range drivers. They both support Dolby Atmos and Amazon’s proprietary algorithm for adding a surround sound-like effect to stereo audio. Per the devices’ product pages, the speakers have lossless HD audio, Advanced Room Adaptation, and features for fighting noise distortion. Amazon announced the Advanced Room Adaptaion today, saying that the feature “continuously tunes the sound to your space, automatically adapting to the room's acoustics.” Both speakers have four-microphone arrays and the same AZ3 Pro processor that Amazon introduced a year ago . The processor has an AI accelerator for using Amazon's Alexa+ generative AI chatbot . Read full article Comments", "date_str": "2026-10-28T18:05:22+00:00", "hash": "e23f87d6b4d74247", "title_fa": "آمازون قوی ترین اسپیکر هوشمند خود را نیز به دوربین هوشمند تبدیل می کند", "summary_fa": "از زمان معرفی در سال 2019، استودیوی اکو آمازون کاربرانی را هدف قرار داد که خواهان کیفیت صدای برتر از بلندگوی هوشمند مبتنی بر الکسا خود بودند. جدیدترین Echo Studio یک ویژگی دیگر را اضافه می کند که کمتر مورد انتظار است: یک دوربین یکپارچه. استودیوی اکو با دوربین خانگی که امروز در کنار تعدادی دیگر از دستگاه‌های الکسا منتشر شده است، نسبت به استودیوی استاندارد اکو ارتقاء صوتی زیادی ندارد. هر بلندگو دارای یک ووفر 3.75 اینچی با سرعت بالا و سه درایور با برد کامل است. هر دوی آنها از Dolby Atmos و الگوریتم اختصاصی آمازون برای افزودن افکت صدای فراگیر به صدای استریو پشتیبانی می کنند. طبق صفحات محصول دستگاه‌ها، بلندگوها دارای صدای HD بدون تلفات، تطبیق اتاق پیشرفته و ویژگی‌هایی برای مبارزه با اعوجاج نویز هستند. آمازون امروز Advanced Room Adaptaion را معرفی کرد و گفت که این ویژگی \"به طور مداوم صدا را با فضای شما تنظیم می کند و به طور خودکار با آکوستیک اتاق سازگار می شود.\" هر دو بلندگو دارای آرایه های چهار میکروفون و همان پردازنده AZ3 Pro هستند که آمازون یک سال پیش معرفی کرد. این پردازنده دارای یک شتاب دهنده هوش مصنوعی برای استفاده از چت ربات مولد هوش مصنوعی آمازون + Alexa است. مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش از زمان شروع به کار در سال 2019، استودیو اکو آمازون کاربرانی را هدف قرار داد که خواهان کیفیت صدای برتر از بلندگوی هوشمند مبتنی بر الکسا خود بودند. جدیدترین Echo Studio یک ویژگی دیگر را اضافه می کند که کمتر مورد انتظار است: یک دوربین یکپارچه. این دستگاه ها نیز دارای ابعاد مشابهی هستند، حتی اگر Echo Studio جدید با دوربین خانگی در یک", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/download-1152x648.png", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "تراشه", "موسیقی"], "datetime_fa": "۶ آبان • ۲۱:۳۵"}, {"source": "Ars Technica", "title": "Cadillac Escalade IQ review: Huge battery, huge range, huge SUV", "link": "https://arstechnica.com/cars/2026/10/cadillac-escalade-iq-review-4-tons-of-electric-american-luxury-on-wheels/", "summary": "“Please have at least 125 miles of range left when we pick it up.” That request from the people who look after the Cadillac press cars wasn’t going to be hard to honor. The electric Escalade IQ arrived with an indicated range of 440 miles (708 km), and with a full week of work to squeeze in, getting anywhere close to needing to recharge it seemed unlikely. With more than 200 kWh of lithium-ion battery between its axles, range is one thing the big electric Caddy needn’t worry about. Designed and debuted during a time of greater EV optimism, the Escalade is Cadillac’s statement that swapping out a V8 for a pair of powerful electric motors is no compromise to its ambitions, even if the brand’s future will now include a mix of electric and combustion cars beyond 2030 . It shares a battery pack and much else with other full-size GM EVs we’ve tested: the Chevrolet Silverado EV , the GMC Sierra EV , and of course the divisive Hummer EVs . And like those trucks and SUVs, the Escalade is large and heavy—just small enough to fit into a standard parking space, with a curb weight sufficient to push it into the Class 3 truck category. So, the side mirrors are flat, and there’s no formal EPA range—Cadillac says it achieves 460 miles (740 km) on the EPA test cycle—but there are plenty of airbags, even though the 9,046 lb (4,103 kg) curb weight does not require them. Yes, you did read that right, it does weigh 4 tons. And yes, the electric Escalade does weigh a third more than the last gas-powered one we tested . Read full article Comments", "date_str": "2026-10-28T17:55:45+00:00", "hash": "daaf1cfafa189758", "title_fa": "بررسی Cadillac Escalade IQ: باتری عظیم، برد بزرگ، SUV عظیم", "summary_fa": "\"لطفاً هنگام برداشتن آن حداقل 125 مایل برد باقی مانده است.\" این درخواست از سوی افرادی که از ماشین های پرس کادیلاک مراقبت می کنند چندان سخت نبود. Escalade IQ الکتریکی با برد مشخص شده 440 مایل (708 کیلومتر) وارد شد و با یک هفته کار کامل، رسیدن به هر نقطه ای که نیاز به شارژ مجدد داشت بعید به نظر می رسید. با بیش از 200 کیلووات ساعت باتری لیتیوم یونی بین محورهای خود، برد یکی از مواردی است که Caddy بزرگ برقی نباید نگران آن باشد. اسکالید که در زمان خوش‌بینی بیشتر خودروهای برقی طراحی و عرضه شد، بیانیه کادیلاک است مبنی بر این که تعویض یک موتور V8 با یک جفت موتور الکتریکی قدرتمند هیچ سازشی برای جاه‌طلبی‌های آن نیست، حتی اگر آینده این برند شامل ترکیبی از خودروهای الکتریکی و احتراقی بعد از سال 2030 باشد. این یک بسته باتری و خیلی چیزهای دیگر را با سایر خودروهای برقی GM سایز کامل که ما آزمایش کرده‌ایم به اشتراک می‌گذارد: شورولت سیلورادو EV، GMC Sierra EV، و البته خودروهای الکتریکی تقسیم‌کننده هامر. و مانند آن کامیون‌ها و شاسی‌بلندها، اسکالید بزرگ و سنگین است - به اندازه‌ای کوچک است که در یک فضای پارک استاندارد جای بگیرد، با وزن محدودی که برای وارد کردن آن به رده کامیون‌های کلاس 3 کافی است. بنابراین، آینه‌های جانبی تخت هستند و هیچ برد رسمی EPA وجود ندارد - کادیلاک می‌گوید در چرخه آزمایش EPA به مسافت 460 مایل (740 کیلومتر) دست می‌یابد - اما کیسه‌های هوا زیادی وجود دارد، حتی اگر وزن محدود 9046 پوند (4103 کیلوگرم) به آنها نیازی نداشته باشد. بله، درست خواندید، وزن آن 4 تن است. و بله، اسکالید الکتریکی یک سوم بیشتر از آخرین نمونه گازسوز که آزمایش کردیم، وزن دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ *", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/2026-Cadillac-Escalade-IQ-1-of-26-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۶ آبان • ۲۱:۲۵"}, {"source": "Ars Technica", "title": "Google AI gets cagey when asked who won the 2020 elections", "link": "https://arstechnica.com/ai/2026/10/google-ai-gets-cagey-when-asked-who-won-the-2020-elections/", "summary": "If you ask some prominent US politicians who won the 2020 presidential election, you might get some weasely answers that fail to directly acknowledge Joe Biden's win that November. If you ask Google's AI Mode the same question, you might get an evasive answer that simply tells you to consult with outside sources. When I put the direct question of \"Who won the 2020 presidential election?\" to Google's AI Mode this morning (after seeing complaints about cagey answers on social media ), I got the following surprisingly indirect response: \"To review the official results and statistics of the 2020 United States presidential election, including the final electoral college breakdown, popular vote counts, and winner certification, please consult the official report compiled by the Federal Election Commission (FEC).\" My testing resulted in a similarly indirect answer when asking about the 2024 presidential election, with Google's AI telling me to just consult the FEC for that information. Asking about 2012 election resulted in a link to The American Presidency Project's 2012 Data Center rather than a direct answer. But AI Mode seemed perfectly willing to give me a detailed and correct responses for the winner of every other presidential election going back to 2000. Read full article Comments", "date_str": "2026-10-28T17:46:32+00:00", "hash": "add8557f4971f1d1", "title_fa": "هوش مصنوعی گوگل وقتی از او می پرسند چه کسی در انتخابات 2020 پیروز شد، غافلگیر می شود", "summary_fa": "اگر از برخی سیاستمداران برجسته ایالات متحده که در انتخابات ریاست جمهوری 2020 پیروز شدند، بپرسید، ممکن است پاسخ های ضعیفی دریافت کنید که مستقیماً پیروزی جو بایدن را در نوامبر تایید نکنند. اگر از حالت هوش مصنوعی گوگل همین سوال را بپرسید، ممکن است پاسخی فراری دریافت کنید که به سادگی به شما می گوید که با منابع خارجی مشورت کنید. وقتی من این سوال را مستقیم مطرح کردم که \"چه کسی در انتخابات ریاست جمهوری 2020 پیروز شد؟\" به حالت هوش مصنوعی گوگل امروز صبح (پس از مشاهده شکایات در مورد پاسخ‌های غیرمستقیم در رسانه‌های اجتماعی)، پاسخ غیرمستقیم شگفت‌آور زیر را دریافت کردم: \"برای بررسی نتایج و آمار رسمی انتخابات ریاست‌جمهوری ایالات متحده در سال 2020، از جمله تفکیک نهایی کالج‌های انتخاباتی، شمارش آرای مردمی، و تاییدیه برندگان، لطفاً با کمیسیون گزارش رسمی فدرال مشورت کنید.\" آزمایش من به یک پاسخ غیرمستقیم مشابه در هنگام پرسیدن در مورد انتخابات ریاست جمهوری 2024 منجر شد، با هوش مصنوعی گوگل به من گفت که برای این اطلاعات فقط با FEC مشورت کنم. پرسیدن در مورد انتخابات 2012 به جای پاسخ مستقیم منجر به پیوندی به مرکز داده پروژه ریاست جمهوری آمریکا در سال 2012 شد. اما به نظر می‌رسید حالت هوش مصنوعی کاملاً مایل است که پاسخ‌های دقیق و درستی را برای برنده هر انتخابات ریاست‌جمهوری دیگر که به سال 2000 برمی‌گردد به من بدهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش اگر از برخی سیاستمداران برجسته ایالات متحده که در انتخابات ریاست جمهوری 2020 پیروز شدند بپرسید، ممکن است پاسخ های ضعیفی دریافت کنید که مستقیماً پیروزی جو بایدن در نوامبر را تأیید نکند. اگر از حالت هوش مصنوعی گوگل همین سوال را بپرسید، ممکن است", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/10/GettyImages-2181827335-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۶ آبان • ۲۱:۱۶"}, {"source": "Ars Technica", "title": "Florida county won’t investigate sketchy Flock cameras removed by mystery owners", "link": "https://arstechnica.com/tech-policy/2026/10/florida-county-wont-investigate-sketchy-flock-cameras-removed-by-mystery-owners/", "summary": "A Florida county that discovered a clump of mysterious unpermitted Flock cameras during a countywide takedown effort won’t investigate who owned the sketchy cameras, which have since disappeared. On Wednesday, The Washington Post reported that St. Lucie County residents \"remain upset,” not knowing who installed the cameras or how they were using the data collected. Hannah Galindo, a 31-year-old resident who petitioned to get Flock cameras removed, told the Post that she was worried “that data could be anywhere.” Of the 12 cameras found, five were eventually claimed by city law enforcement, the Post reported. Apparently, a police department mistakenly issued guidance claiming that officers could post multiple cameras under one permit, a Flock spokesperson told the Post, even though the county required individual permits. However, neither Flock nor the city police departments in Port St. Lucie and Fort Pierce that claimed the sketchy cameras will confirm who gave the guidance. Read full article Comments", "date_str": "2026-10-28T17:37:49+00:00", "hash": "1b66e981cc61656b", "title_fa": "شهرستان فلوریدا در مورد دوربین‌های Flock که توسط مالکان مرموز برداشته شده است، تحقیق نمی‌کند", "summary_fa": "یکی از شهرستان‌های فلوریدا که مجموعه‌ای از دوربین‌های مرموز Flock غیرمجاز را در طی یک تلاش حذف در سراسر شهرستان کشف کرد، بررسی نمی‌کند که چه کسی مالک این دوربین‌های ترسیمی است که از آن زمان ناپدید شده‌اند. روز چهارشنبه، واشنگتن پست گزارش داد که ساکنان شهرستان سنت لوسی \"ناراحت می‌مانند\" و نمی‌دانند چه کسی دوربین‌ها را نصب کرده یا چگونه از داده‌های جمع‌آوری‌شده استفاده می‌کنند. هانا گالیندو، ساکن 31 ساله‌ای که درخواست حذف دوربین‌های Flock را داد، به پست گفت که نگران است «این داده‌ها ممکن است در هر جایی وجود داشته باشد». به گزارش پست، از 12 دوربین پیدا شده، پنج دوربین در نهایت توسط مجریان قانون شهر مورد ادعا قرار گرفتند. یکی از سخنگویان Flock به پست گفت، ظاهراً یک اداره پلیس به اشتباه دستورالعملی را صادر کرده است که ادعا می کند افسران می توانند چندین دوربین را تحت یک مجوز قرار دهند، حتی اگر استان به مجوزهای فردی نیاز داشته باشد. با این حال، نه Flock و نه ادارات پلیس شهر در پورت سنت لوسی و فورت پیرس که ادعا می‌کنند دوربین‌های ترسیم شده، این راهنمایی را تایید نمی‌کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید یک شهرستان فلوریدا که مجموعه ای از دوربین های مرموز Flock غیرمجاز را در طول تلاش حذف در سراسر شهرستان کشف کرد، از زمانی که دوربین های ناپدید شده متعلق به چه کسانی بودند، تحقیق نمی کند. بیش از سه سال، بندر St. قرارداد گله اداره پلیس لوسی از 22000 دلار به 470000 دلار در سال 2025 افزایش یافت، یک سال قبل از این که شهرستان حذف را در جاده های شهرستان اجباری کرد. با این حال، اریک گیل، سخنگ entertainment/movies-like-east-of-eden?utm_medium=RSS", "summary": "We may earn a commission from links on this page. One of the best things about truly great stories is how they can be endlessly adapted and reinterpreted. John Steinbeck published East of Eden in 1952, and each time it s adapted to a screen, it looks a little different. Netflix s try at this huge, complex story offers up some searing performances, especially from Florence Pugh as the notorious Cathy Ames. Ames is one of the best characters ever crafted in American literature, but her sociopathic nature has sometimes made her into a simple villain but the series, and Pugh's performances, adds depth to the charcter. If the limited series has you wanting more complex female characters from classic novels , your next move is obvious: Vanity Fair , starring Reese Witherspoon as Becky Sharp. If you enjoyed East of Eden, check out Vanity Fair next First published in the mid-19th century, Vanity Fair by William Makepeace Thackeray is an enduring classic of American literature, satirizing the artificial manners and pretensions of Victorian society. At the center of the story is Becky Sharp, whose moral ambiguity and self-serving actions were surprising and unexpected at the time and have made her a kind of antihero in the modern age. Sharp is a complicated character who, like Cathy Ames, can easily be flattened into a villain, a social climber who uses people. The 2004 adaptation leans into the more modern take on Sharp s character, giving her more justification for her actions and humanizing her more than the novel. Sharp is orphaned at a young age, but is almost feral in her determination to secure a position in society which, at the time, meant securing an advantageous marriage. The story doesn t have the same sweep as East of Eden , chronicling a relatively short period of time but that period is the Napoleonic Wars, so there s a lot going on. This gives the film a similarly epic feel even as it focuses 8T17:43:10+00:00", "hash": "5f0a23db76bc50a5", "title_fa": "اولین MacBook Pro با صفحه لمسی اپل هم آشنا و هم کاملاً بهبود یافته است", "summary_fa": "نازک‌تر، سبک‌تر و صفحه نمایش بهتری دارد - اما هنوز یک مک‌بوک پرو است. ناتان اینگراهام برای Engadget Engadget را در گوگل اضافه کنید: منبع ترجیحی Google Discover همانطور که انتظار می‌رفت، اپل امروز در رویداد &quot;Pro and Tell&quot; در لس‌آنجلس از اولین مک‌بوک پرو خود با صفحه لمسی رونمایی کرد. من فرصتی پیدا کردم تا به سرعت &quot;مک‌بوک پرو با صفحه نمایش PROLED XDR&quot; را بررسی کنم. اپل با این طراحی مجدد، چرخ را دوباره اختراع نکرد، حتی با وجود تغییرات قابل توجهی. این شرکت صفحه نمایش های استاندارد 14 و 16 اینچی را حفظ کرد، اگرچه نمایشگر به وضوح بهبود یافته است. علیرغم کاهش وزن (14 اینچی سه پوند است، در حالی که 16 اینچی چهار پوند است)، اپل همان مجموعه پورت‌ها را در این مدل‌های جدید نگه داشته و صفحه کلید و ترک‌پد همان گزینه‌های قابل اعتماد و راحت به نظر می‌رسد که از زمان طراحی مجدد بزرگ مک‌بوک پرو در سال 2021 وجود داشته است. خنده دار است که چگونه تراشیدن نیم پوند تفاوت زیادی ایجاد می کند، اما در این مورد کاملاً انجام می شود. این اولین بار نیست که اپل وزن مک‌بوک پرو را به طرز چشمگیری کاهش می‌دهد – مدل‌های تاچ بار بدنام 2016 نیز تقریباً وزن مشابهی داشتند. اما آنها همچنین تراشه‌های اینتل را اجرا می‌کردند و با سختی‌های بدنام در حفظ خونسردی و عملکرد در زیر بارهای کاری سنگین مواجه بودند. من باید شرط بندی کنم که در اینجا چنین نخواهد بود، اما قطعاً زمانی که آزمایش های عمیق تر انجام می دهیم باید به آن توجه کنیم. استفاده از لمس در مک بوک پرو همان طور که انتظار دارید کار می کند. می‌توانید روی تصاویر تند بکشید، از دو انگشت برای حرکات چند لمسی مانند حرکت و زوم کردن استفاده کنید، برنامه‌هایی مانند Pixelmator بکشید یا لغزنده‌های ویرایش را در", "image_url": "https://www.engadget.com/img/gallery/apples-first-touchscreen-macbook-pro-feels-both-familiar-and-radically-improved/l-intro-1793209358.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "تراشه"], "datetime_fa": "۶ آبان • ۲۱:۱۳"}, {"source": "Engadget", "title": "Here's ho ۵۸"}, {"source": "Business Insider", "title": "People really, really hate the 'Liberty Biberty' mascot. Maybe that's good for Liberty Mutual?", "link": "https://www.businessinsider.com/liberty-biberty-protest-hate-mascot-mutual-2026-10", "summary": "Connor Harvey leads a protest outside Liberty Mutual s Boston headquarters. Lane Turner/The Boston Globe via Getty Images \"Liberty Biberty\" is a much-hated new yellow puppet mascot for Liberty Mutual, appearing in ads. People are so riled up that there was a protest at its Boston HQ. Its organizer called the mascot \"a disgusting little creature.\" But this kind of cheeky \"hate\" might actually work in Liberty's favor, an ad expert says. On Sunday, a small crowd took to the streets of Boston to protest, holding signs, chanting, with one person even appearing in full costume and face paint. The protest took place in front of the Back Bay headquarters of insurance company Liberty Mutual . The protest was not against some sort of corporate malfeasance, political, or even a social justice issue. They were protesting the existence of Liberty Biberty, the new fuzzy yellow mascot that appears in the insurance giant's TV ads. People, for some reason, really hate the Liberty Biberty puppet. There's a Facebook page with over 40,000 people devoted to hating it. There's TikToks. Reddit threads. I even saw a ghastly tattoo depicting the spherical character being fed into a meat grinder. John Oliver did a segment about it on HBO's \"Last Week Tonight\" recently. \"Liberty Biberty\" pic.twitter.com/fY77yTVUdc — Barry (@BarryOnHere) September 27, 2026 The concept of the ads is surreal and self-referential. Liberty Biberty is a yellow puppet who has appeared in a few TV ads so far. In one, he appears on someone's car and tells them about the benefits of auto insurance, and then is carried off by a hawk. In another, he chats to a bored bartender, and then meets the aforementioned hunky actor prone to malapropisms. Liberty Mutual is well aware of the, ahem, passionate response. \"We're encouraged by how strongly people are engaging with him, whether they love him or feel differently,\" Jenna Lebel, Liberty Mutual's chief marketing officer for US retail markets, told Business Insider. \"We've been encouraged by the early results, including independent testing that shows Biberty performing above average on attention and brand attribution.\" Insurance companies' advertising strategies for the last decade or more has been focused on a series of recognizable characters like Flo from Progressive, Jake from State Farm, and \"Mayhem\" from Allstate. Let us not forget the forefather of them all, the Geico gecko. Liberty Mutual has also had Doug and the LiMu Emu, as well as a hunky actor prone to ", "date_str": "2026-10-28T16:07:50+00:00", "hash": "af2581e4d5deb2b4", "title_fa": "مردم واقعاً، واقعاً از طلسم «Liberty Biberty» متنفرند. شاید این برای Liberty Mutual خوب باشد؟", "summary_fa": "کانر هاروی تظاهراتی را در خارج از مقر لیبرتی موچال بوستون رهبری می کند. لین ترنر/ The Boston Globe از طریق گتی ایمیجز \"Liberty Biberty\" یک طلسم عروسکی زرد جدید بسیار منفور برای Liberty Mutual است که در تبلیغات ظاهر می شود. مردم آنقدر عصبانی هستند که در مقر آن در بوستون تظاهرات کردند. سازمان دهنده آن طلسم را \"یک موجود کوچک منزجر کننده\" نامید. یک کارشناس تبلیغات می گوید، اما این نوع \"نفرت\" گستاخانه ممکن است در واقع به نفع لیبرتی کار کند. روز یکشنبه، جمعیت کوچکی برای تظاهرات به خیابان‌های بوستون آمدند، تابلوهایی در دست داشتند، شعار می‌دادند، حتی یک نفر با لباس کامل و رنگ چهره ظاهر شد. این اعتراض در مقابل دفتر مرکزی شرکت بیمه Liberty Mutual برگزار شد. اعتراض علیه نوعی تخلفات شرکتی، سیاسی یا حتی یک موضوع عدالت اجتماعی نبود. آنها به وجود Liberty Biberty، طلسم زرد فازی جدید که در تبلیغات تلویزیونی غول بیمه ظاهر می شود، اعتراض داشتند. مردم، به دلایلی، واقعاً از عروسک لیبرتی بیبرتی متنفرند. یک صفحه فیس بوک با بیش از 40000 نفر وجود دارد که از آن متنفر هستند. TikToks وجود دارد. موضوعات Reddit من حتی یک خالکوبی وحشتناک را دیدم که شخصیت کروی شکل را به تصویر می کشید که به چرخ گوشت می خورد. جان الیور اخیراً بخشی از آن را در برنامه «هفته گذشته امشب» شبکه HBO انجام داد. \"Liberty Biberty\" pic.twitter.com/fY77yTVUdc — Barry (@BarryOnHere) 27 سپتامبر 2026 مفهوم تبلیغات سورئال و خودارجاعی است. لیبرتی بیبرتی عروسک زرد رنگی است که تاکنون در چند آگهی تلویزیونی ظاهر شده است. در یکی، او در ماشین شخصی ظاهر می شود و به آنها در مورد مزایای بیمه خودرو می گوید و سپس توسط یک شاهین با خود می برد. در دیگری، او با یک متصدی بار حوصله گپ می زند و سپس با هنرپیشه هولناک فوق الذکر", "image_url": "https://i.insider.com/6ae202283ae265b597b02f16?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۶ آبان • ۱۹:۳۷"}, {"source": "Business Insider", "title": "AI coding startup Cognition is weighing a new funding round at a $70 billion to $80 billion valuation", "link": "https://www.businessinsider.com/cognition-round-of-funding-at-a-75-billion-valuation-2026-10", "summary": "Scott Wu cofounded Cognition in 2023. IMF via Getty Images AI coding startup Cogniton is fielding offers for a new funding round. The round could value Cognition between $70 billion and $80 billion, according to people familiar with the matter. The new offers come weeks after the company announced a $2 billion round at a $48 billion valuation. Just weeks after announcing a new round of funding at a $48 billion valuation, AI coding startup Cognition is fielding new investor interest at a much higher price. The startup has received offers valuing it at between $70 billion and $80 billion and is seriously considering a round before the end of the year, according to sources familiar with the matter. The talks around the financing are still early, and valuation targets could still change. Founded in 2023 by Scott Wu, Steven Hao, and Walden Yan, Cognition is best known for Devin, an AI coding agent designed to automate software engineering tasks. The San Francisco-based company's existing investors include a16z, Accel, Founders Fund, Khosla Ventures, Elad Gil, and Pear VC. Cognition's rapid valuation climb underscores the investor frenzy around AI coding, one of the hottest and most competitive corners of the AI market. As companies race to sell AI coding agents that can take on more of the work engineers do, investors are placing increasingly expensive bets on the few startups they think could emerge as leaders. A $75 billion valuation wouldn't be so far-fetched, as SpaceX just acquired fellow AI coding giant Cursor for $60 billion a few months ago. Last month, Cognition was drawn into a public feud with rival Factory AI, which accused Cognition employees of posing as job applicants to seek product information and faulted a former Factory adviser for meeting with Cognition executives. Cognition and the former adviser denied that confidential information was sought or shared. Got a tip? Email Katie anytime or contact her on Signal at kroof.26 . Sign up for Business Insider's weekly VC Insider newsletter here. Read the original article on Business Insider", "date_str": "2026-10-28T15:56:41+00:00", "hash": "df90b28131c70afc", "title_fa": "استارت‌آپ کدنویسی هوش مصنوعی Cognition در حال بررسی دور جدید سرمایه‌گذاری با ارزش‌گذاری 70 تا 80 میلیارد دلاری است.", "summary_fa": "", "image_url": "https://i.insider.com/6ae210baca24d51c5f89fcd6?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۱۹:۲۶"}, {"source": "Business Insider", "title": "Dropbox is laying off roughly 9% of its workforce. Read the memo.", "link": "https://www.businessinsider.com/dropbox-layoffs-job-cuts-ceo-memo-ashraf-alkarmi-2026-10", "summary": "Dropbox announced layoffs of roughly 200 workers. Jakub Porzycki/NurPhoto via Getty Images Dropbox co-CEO Ashraf Alkarmi announced layoffs of roughly 200 workers. Alkarmi said the cloud-based storage company is profitable but needs to make \"hard choices.\" You can read his full email to employees below. Dropbox is dropping the layoffs hammer. Dropbox co-CEO Ashraf Alkarmi announced on Wednesday that the cloud-based storage company is laying off roughly 9% of its global workforce. \"Today, we're making difficult choices about where we invest and how we organize Dropbox to achieve the product and growth priorities that will matter most for our long-term strategy,\" Alkarmi wrote in an email to workers that the company posted publicly. Alkarmi said Dropbox is eliminating roughly 200 roles across its across Engineering, Product, Design, and G A team. The company, Alkarmi wrote, is profitable but needs to make \"hard choices\" about where it spends its money. \"Delivering on that strategy requires concentrating our resources on the priorities that will have the greatest potential for customer impact and growth,\" he wrote. As part of the changes, Alkarmi also announced that chief technology officer Ali Dasdan will be stepping down. Read the full email Hi everyone, Today, we're making difficult choices about where we invest and how we organize Dropbox to achieve the product and growth priorities that will matter most for our long-term strategy. As part of these changes, we've made the decision to eliminate about 200 roles across Engineering, Product, Design, and G A teams (approximately 9% of our global workforce). For most impacted Dropboxers, today will be their last day. S-team and I take full ownership of this decision and recognize that these colleagues have made meaningful contributions to Dropbox, our products, our customers, and our teams. Our first priority today is to treat every person affected with the care and respect they deserve. Changes to Senior Leadership I also want to share that Ali Dasdan has decided to move on from Dropbox. During his time here, Ali led and strengthened many of the technical capabilities we'll rely on as we move into the next phase of our transformation. I'm grateful for his leadership, his partnership, and the foundation he and the team have put in place. Ali's last day is November 18th, and he'll be focused on ensuring a smooth transition through next month. We wish him all the best in what comes next. Why we're making these cha", "date_str": "2026-10-28T15:24:52+00:00", "hash": "a9e3b716f873a56c", "title_fa": "دراپ باکس تقریباً 9 درصد از نیروی کار خود را اخراج می کند. یادداشت را بخوانید.", "summary_fa": "Dropbox حدود 200 کارگر را اخراج کرد. Jakub Porzycki/NurPhoto از طریق Getty Images، مدیرعامل Dropbox، اشرف الکرمی، از اخراج تقریباً 200 کارگر خبر داد. آلکرمی گفت که شرکت ذخیره سازی مبتنی بر ابر سودآور است اما باید \"انتخاب های سخت\" داشته باشد. در زیر می توانید ایمیل کامل او را برای کارمندان بخوانید. Dropbox چکش اخراج را کنار می گذارد. اشرف الکرمی، مدیرعامل Dropbox روز چهارشنبه اعلام کرد که این شرکت ذخیره سازی مبتنی بر ابر تقریباً 9 درصد از نیروی کار جهانی خود را اخراج می کند. آلکرمی در ایمیلی به کارگران که این شرکت به صورت عمومی منتشر کرد، نوشت: «امروز، ما در حال انتخاب‌های دشواری درباره مکان سرمایه‌گذاری و نحوه سازماندهی Dropbox برای دستیابی به اولویت‌های محصول و رشد هستیم که برای استراتژی بلندمدت ما بیشترین اهمیت را دارد. Alkarmi گفت Dropbox تقریباً 200 نقش را در سراسر تیم مهندسی، محصول، طراحی و G A حذف می کند. آلکارمی نوشت، این شرکت سودآور است اما باید «انتخاب‌های سخت» در مورد محل خرج کردن پول خود داشته باشد. او نوشت: «تامین این استراتژی مستلزم تمرکز منابع ما بر روی اولویت‌هایی است که بیشترین پتانسیل را برای تأثیرگذاری و رشد مشتری خواهند داشت». به عنوان بخشی از این تغییرات، آلکرمی همچنین اعلام کرد که علی داسدان، مدیر ارشد فناوری از سمت خود کناره‌گیری می‌کند. ایمیل کامل را بخوانید سلام به همه، امروز، ما در مورد محل سرمایه‌گذاری و نحوه سازماندهی Dropbox برای دستیابی به اولویت‌های محصول و رشد که برای استراتژی بلندمدت ما بیشترین اهمیت را دارد، انتخاب‌های دشواری انجام می‌دهیم. به عنوان بخشی از این تغییرات، ما تصمیم گرفته ایم که حدود 200 نقش را در تیم های مهندسی، محصول، طراحی و G A حذف کنیم (تقریباً 9٪ از نیروی کار جهانی ما). برای اکثر دراپ باکسرهای تحت تاثیر، امروز آخرین روز آنها خواهد بود. من و S-team", "image_url": "https://i.insider.com/6ae20737e793e12971426396?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۶ آبان • ۱۸:۵۴"}, {"source": "Business Insider", "title": "9 facts about Wendy's that might surprise you", "link": "https://www.businessinsider.com/wendys-fast-food-chain-surprising-facts-history", "summary": "Wendy s, the second-largest fast-food burger chain in the US, opened its doors in 1969. dcwcreations/Shutterstock Wendy's was founded in 1969 by Dave Thomas, a former KFC employee. He named his burger restaurant after his daughter, Melinda \"Wendy\" Thomas. Some fans claim a secret message is written in the Wendy's logo . Wendy's could be undergoing major changes. When Wendy's opened in 1969, its menu had just five items: burgers, Frosties, fries, chili, and soft drinks. More than five decades later, the chain has grown into the nation’s second-largest fast-food burger brand based on sales, according to QSR Magazine . Now, Wendy’s could be headed for another major change: a potential acquisition. On Wednesday, The Wall Street Journal reported that Trian Fund Management, which is owned by billionaire investor Nelson Peltz, and its partners offered $1.4 billion, or $7.35 per share, to buy Wendy’s and take the company private. The proposal is still under review by a special committee, so no acquisition has been finalized, but it would mean a major shake-up for the burger chain. Here are 9 things you probably never knew about Wendy's. Wendy s founder, Dave Thomas, worked for KFC and the real Colonel Sanders before opening his own fast-food chain. Wendy s founder Dave Thomas in 1989 and founder of restaurant chain Kentucky Fried Chicken, Colonel Harland David Sanders, in 1969. Getty Images; Bob Grannis/Getty Images Before opening his own franchise, Dave Thomas worked as a head cook at a Hobby House restaurant, a chain that would eventually become Kentucky Fried Chicken. During his time working for the company, Thomas helped improve brand recognition and encouraged Colonel Harland David Sanders to appear in more commercials. This strategy, along with the design of the iconic red-and-white-striped fried chicken bucket, helped grow KFC's popularity. Thomas was sent to Columbus, Ohio, to revitalize a few failing KFC franchises, turn them around, and sell them back to Sanders for a big profit, the Greensboro News Record reported. He used this newfound cash to start his own franchise: a hamburger chain named Wendy's, inspired by his inability to find a good burger during his years in Columbus. The first Wendy s opened in Columbus, Ohio, in 1969 with just five items on the menu. Eight year old Wendy Thomas on November 15 1969 at the grand opening of the first Wendys restaurant in Columbus Ohio Wendy s The first Wendy's restaurant opened at 257 East Broad Street on Novem", "date_str": "2026-10-28T15:23:08+00:00", "hash": "da5a6a36edb9ca9d", "title_fa": "9 حقیقت در مورد وندی که ممکن است شما را شگفت زده کند", "summary_fa": "Wendy s، دومین زنجیره بزرگ همبرگر فست فود در ایالات متحده، درهای خود را در سال 1969 افتتاح کرد. او نام رستوران برگر خود را به نام دخترش ملیندا «وندی» توماس نامگذاری کرد. برخی از طرفداران ادعا می کنند که یک پیام مخفی در لوگوی وندی نوشته شده است. وندی ممکن است دستخوش تغییرات اساسی شود. هنگامی که وندی در سال 1969 افتتاح شد، منوی آن فقط پنج مورد داشت: همبرگر، فراستی، سیب زمینی سرخ کرده، فلفل قرمز و نوشابه. به گفته مجله QSR، بیش از پنج دهه بعد، این زنجیره به دومین برند بزرگ برگر فست فود کشور بر اساس فروش تبدیل شده است. اکنون، Wendy's می تواند به سمت یک تغییر عمده دیگر حرکت کند: یک خرید بالقوه. روز چهارشنبه، وال استریت ژورنال گزارش داد که Trian Fund Management، که متعلق به سرمایه‌گذار میلیاردر، نلسون پلتز است، و شرکای آن 1.4 میلیارد دلار یا 7.35 دلار به ازای هر سهم، برای خرید Wendy و خصوصی کردن شرکت پیشنهاد کردند. این پیشنهاد هنوز توسط یک کمیته ویژه در دست بررسی است، بنابراین هیچ خریدی نهایی نشده است، اما این به معنای یک تغییر بزرگ برای زنجیره همبرگر است. در اینجا 9 چیز وجود دارد که احتمالاً هرگز درباره وندی نمی دانستید. بنیانگذار وندی، دیو توماس، قبل از افتتاح زنجیره فست فود خود برای KFC و کلنل سندرز واقعی کار می کرد. دیو توماس، بنیانگذار وندی در سال 1989 و بنیانگذار رستوران های زنجیره ای کنتاکی فرید چیکن، سرهنگ هارلند دیوید سندرز، در سال 1969. گتی ایماژ; باب گرانیس/گتی ایماژ قبل از افتتاح فرنچایز خود، دیو توماس به عنوان آشپز در یک رستوران هابی هاوس کار می کرد، زنجیره ای که در نهایت تبدیل به مرغ سرخ شده کنتاکی شد. توماس در طول مدتی که برای شرکت کار می کرد، به بهبود شناخت برند کمک کرد و سرهنگ هارلند دیوید", "image_url": "https://i.insider.com/627ad2218f41d500187aaa71?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۶ آبان • ۱۸:۵۳"}, {"source": "Lifehacker", "title": "Your Discord Messages Will Soon Be Discoverable on Google Search, but You Can Opt Out", "link": "https://lifehacker.com/tech/your-discord-messages-will-be-discoverable-on-google-search-but-you-can?utm_medium=RSS", "summary": "If you are a member of a large public Discord, your posts may soon be visible in Google Search even to those without a Discord account. Starting in November, Discord's Discoverable Servers will have server web pages that show up in web search results, including summaries and messages from public channels. While messages won't be tied to your username or avatar, you may still want to opt out. Some Discord servers are getting discoverable web pages This change applies to Discoverable Servers on Discord, which are public spaces that have at least 1,000 members. There's no invite link, so anyone can find and join them as long as they have a Discord account. (Other servers on Discord are either invite-only Community Servers for larger groups or Friend Servers, which are small, private spaces.) On Nov. 16, Discord is launching server web pages for Discoverable Servers, which will display discussion summaries from public channels as well as some individual messages. By mid-December, these pages may appear in search results. While these servers have always been fairly easy to access since they are public, this removes the requirement to sign up for Discord and join servers in order to view them. In its announcement detailing the change , Discord notes that private servers and DMs will remain private. Plus, server admins can choose which channels are included in web search or opt them out entirely. How to opt out of web search on Discord As noted, server admins can disable public channels from inclusion in server web pages via Server Settings Web Presence . Server members can also keep their messages from being discoverable under User Settings Data and Privacy . There's a single toggle for all discoverable channels, so you can't select different settings for different servers. You cannot opt out of having your messages incorporated in channel summaries. Messages you send before mid-December won't be included in search regardless of your setting preferences. However, if you leave this enabled and decide to turn it off later, anything you send between mid-December and disabling the setting will stay up unless you delete the message from Discord entirely.", "date_str": "2026-10-28T17:30:40+00:00", "hash": "076e8a1289144f34", "title_fa": "پیام‌های Discord شما به زودی در جستجوی Google قابل کشف خواهند بود، اما می‌توانید انصراف دهید", "summary_fa": "امیلی لانگ یک نویسنده مستقل در سالت لیک سیتی است. پس از فارغ التحصیلی از دانشگاه دوک، او چندین سال را صرف گزارش در مورد نیروی کار فدرال برای دولت اجرایی، نشریه شرکت رسانه آتلانتیک، در واشنگتن دی سی کرد. او تقریباً یک دهه تجربه به عنوان فریلنسر در پوشش فناوری (از جمله مسائل مربوط به امنیت، حریم خصوصی، و جریان) و همچنین امور مالی شخصی و سفر دارد. علاوه بر Lifehacker، کارهای او در Wirecutter، Toms Guide و ZDNET نیز نمایش داده شده است. امیلی همچنین به عنوان راهنمای سفر در سراسر ایالات متحده و به عنوان یک ویرایشگر محتوا کار کرده است. او فوق لیسانس مددکاری اجتماعی دارد و یک درمانگر مجاز در یوتا است. افزودن به عنوان منبع برگزیده در Google افزودن به عنوان منبع برگزیده در اعتبار Google: تیفانی هاگلر-گیرد/بلومبرگ از طریق Getty Images نکات کلیدی از نوامبر، سرورهای Discoverable Discover دارای صفحات وب سرور هستند که در نتایج جستجوی وب نشان داده می شوند. سرورها خلاصه‌های بحث را از کانال‌های عمومی و همچنین برخی از پیام‌های فردی نمایش می‌دهند. مدیران سرور و اعضا می‌توانند از اینکه کانال‌ها و پیام‌ها در جستجو قابل کشف باشند، انصراف دهند. فهرست مطالب اگر عضو یک Discord عمومی بزرگ هستید، پست های شما ممکن است به زودی در جستجوی Google حتی برای کسانی که حساب Discord ندارند قابل مشاهده باشد. از نوامبر، سرورهای Discoverable Discover دارای صفحات وب سروری خواهند بود که در نتایج جستجوی وب، از جمله خلاصه‌ها و پیام‌های کانال‌های عمومی نشان داده می‌شوند. در حالی که پیام‌ها به نام کاربری یا چهره‌نمای شما مرتبط نمی‌شوند، همچنان ممکن است بخواهید انصراف دهید. این تغییر در مورد سرورهای Discoverable on Discord اعمال می شود که فضاهای عمومی هستند که حداقل 1000 عضو دارند. هیچ پیوند دعوتی وجود ندارد، بنابراین هر کسی می تواند تا زمانی که یک حساب Discord", "image_url": "https://lifehacker.com/imagery/articles/01M61H0CR9C6FP5NZ3T8PXN4N7/hero-image.fill.size_1200x675.png", "category": "امنیت سایبری و شبکه", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۶ آبان • ۲۱:۰۰"}, {"source": "Lifehacker", "title": "You Can Preorder XReal's First Wired XR Glasses", "link": "https://lifehacker.com/tech/how-to-preorder-xreal-aura-xr-glasses?utm_medium=RSS", "summary": "The VR headset may be becoming a thing of the past. At Google's Android Developer Summit this morning, XReal officially debuted XReal Aura XR glasses, smart glasses with full XR capability. They're powered by Android XR and run on a Snapdragon Reality Elite-powered puck, with Xreal's X1S Chip in the glasses themselves. The result: Aura packs a 70 field of view in a pair of glasses that weigh less than 95 grams. Customers in the United States, Canada, Japan, and South Korea can order XReal Aura on XReal's site starting today, and they're expected to begin shipping in mid-November. The limited-time launch price is $1,099 for the 12GB + 256GB configuration and $1,299 for the 16GB + 512GB configuration, $180 and $200 less, respectively, than XReal announced earlier this month. If the claim of mixed reality in a pair of sunglasses seems dubious, I tried them out a few months ago, and they are exactly that. View this post on Instagram Instead of an enclosed headset, XReal Aura projects digital content on transparent lenses so you can be present in the real world while also in the digital world. Unlike \"traditional\" virtual reality headsets, the Aura's batteries and main compute are in a wired puck/controller you can slip into your pocket. That keeps the weight down and makes them comfortable enough to wear for longer periods. Because it's built on Android XR, users will have access to millions of 2D and 3D Android apps right out of the box. If you want to go beyond Android, you can plug a USB-C-compatible computer or gaming console into Aura, and use that device in the same virtual space as native Android XR apps. XReal Aura is launching with a library of over 150 \"made for XR\" apps as well, including games like Nevatars , designed by Andy Serkis, Fallout: Factions , a dice-based head-to-head game in the Fallout universe, and Landing Party, \"the world's first outdoor roleplaying video game.\" There will also be companion apps for the NBA, NASCAR, and the San Francisco Ballet Company s The Nutcracker . In terms of productivity, ShapexXR, a platform for software developer collaboration, is making its debut on Android XR, and you'll be able to use apps like Frontline.io for job training and assistance, and Plynk Spatial for stock research and trading. If you want to get down to the nitty-gritty, here are the Aura's specs: Under 95g 70-degree field of view Sony Micro-OLED display 1200p resolution at 120Hz Sound by Bose Snapdragon Reality Elite Platform XReal X1S Chip", "date_str": "2026-10-28T17:00:16+00:00", "hash": , infrastructure has evolved alongside technology. New materials and engineering techniques enabled taller buildings, longer bridges, and larger cities. Computing and digital technologies later transformed how infrastructure was designed, monitored, and operated. Now, the pace of change is accelerating, and challenges are arriving simultaneously. Climate change is increasing pressure on water, energy, and other resources. Artificial intelligence is beginning to transform engineering and design, and its energy needs, along with aging grid infrastructure, is creating significant challenges, as well as new opportunities. In addition, geopolitical complexity is exposing vulnerabilities in global supply chains, and demand for infrastructure is rising, particularly in the developing world. The result is a fundamental challenge: How can the world build the infrastructure it needs without simply repeating the extractive, carbon- and resource-intensive model of the 20th century? In this interview, Ali Jadbabaie, JR East Professor and head of the MIT Department of Civil and Environmental Engineering, says the answer will require rethinking not only how infrastructure is designed and built, but how it is financed and operated, and bringing together the many stakeholders who shape those decisions. On Oct. 28, Jadbabaie will join experts from around the world in Madrid to explore these topics at the World Infrastructure Forum , which was co-founded by MIT’s Department of Civil and Environmental Engineering, UPM, the World Bank Group, and the University of Texas at Austin. Q: Infrastructure has always evolved in response to technological advances. What makes this era different? A: In the 18th century, civil engineering emerged as the civilian counterpart to military engineering, building the dams, bridges, and canals of its time. Industrialization in the 19th century brought railways and sewage systems. In the early 20th century, the focus scaled up to buildings, highways, tunnels, and metro systems, and by mid-century the infrastructure needed to support megacities and skyscrapers. Every time technology has changed, with information technologies, computing, sensing, and, more recently, digital transformation, it has changed the shape of infrastructure. It has even changed the definition of what infrastructure is. Today, we consider the power grid, semiconductor manufacturing plants, and data centers part of infrastructure, along with wireless infrastructur", "date_str": "2026-10-28T16:00:00+00:00", "hash": "419cd1e780b80c01", "title_fa": "3 سوال: چرا زیرساخت ها وارد عصر تعیین کننده ای می شوند؟", "summary_fa": "برای قرن ها، زیرساخت ها در کنار فناوری تکامل یافته اند. مواد جدید و تکنیک های مهندسی ساختمان های بلندتر، پل های طولانی تر و شهرهای بزرگتر را امکان پذیر کرد. محاسبات و فناوری های دیجیتال بعداً نحوه طراحی، نظارت و بهره برداری زیرساخت ها را تغییر دادند. اکنون، سرعت تغییرات در حال افزایش است و چالش ها به طور همزمان از راه می رسند. تغییر اقلیم باعث افزایش فشار بر آب، انرژی و سایر منابع می شود. هوش مصنوعی شروع به دگرگونی مهندسی و طراحی کرده است و نیازهای انرژی آن به همراه زیرساخت شبکه قدیمی، چالش‌های مهم و همچنین فرصت‌های جدیدی را ایجاد می‌کند. علاوه بر این، پیچیدگی ژئوپلیتیکی آسیب‌پذیری‌ها را در زنجیره‌های تامین جهانی آشکار می‌کند و تقاضا برای زیرساخت‌ها به‌ویژه در کشورهای در حال توسعه در حال افزایش است. نتیجه یک چالش اساسی است: چگونه جهان می‌تواند زیرساخت‌های مورد نیاز خود را بدون تکرار مدل استخراج، کربن و منابع فشرده قرن بیستم بسازد؟ در این مصاحبه، علی جدبابایی، پروفسور JR East و رئیس دپارتمان مهندسی عمران و محیط زیست MIT، می‌گوید که پاسخ نه تنها نیازمند بازنگری در نحوه طراحی و ساخت زیرساخت‌ها، بلکه نحوه تأمین مالی و بهره‌برداری آن و گرد هم آوردن بسیاری از سهامداران است که این تصمیم‌ها را شکل می‌دهند. در اکتبر جدبابایی در تاریخ 28 به کارشناسان سراسر جهان در مادرید خواهد پیوست تا این موضوعات را در مجمع جهانی زیرساخت که توسط دپارتمان مهندسی عمران و محیط زیست MIT، UPM، گروه بانک جهانی و دانشگاه تگزاس در آستین تأسیس شده است، بررسی کنند. س:
