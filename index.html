نشان می‌دهند که بیش از ۴۰ درصد اعدام‌شدگان از اتباع خارجی هستند، اما پیکرها معمولاً به خانواده‌هایشان بازگردانده نمی‌شوند.", "date_str": "2026-09-15T19:04:34+00:00", "hash": "be341424e0236f63", "title_fa": "«سوگی که سنگین‌تر می‌شود»؛ خانواده‌هایی که پس از اعدام در عربستان، جسدی برای خاکسپاری ندارند", "summary_fa": "عربستان سعودی در شمار سه کشور نخست جهان با بیشترین آمار اعدام قرار دارد. داده‌ها نشان می‌دهند که بیش از ۴۰ درصد اعدام‌شدگان از اتباع خارجی هستند، اما پیکرها معمولاً به خانواده‌هایشان بازگردانده نمی‌شوند. «ما تمام این آیین‌ها را برگزار کردیم تا به تسکین خانواده کمک کنیم و بپذیرد که او مرده است. اما من تسکین نخواهم یافت.» این‌ها گفته‌های کینفه آرگاوی، پدری است که برای پسرش، کایبروم، سوگواری می‌کند. او می‌گوید: «این ماجرا تا پایان عمر برای من پشیمانی و اندوه به همراه خواهد داشت.» کایبروم کینفه آرگاوی یکی از پنج شهروند اتیوپیایی بود که ژوئن به اتهام قاچاق حشیش در عربستان سعودی اعدام شد. عربستان پیوسته در میان کشورهایی قرار دارد که بیشترین اعدام را در جهان انجام می‌دهند و پس از چین و ایران در رتبه سوم جای دارد. دفن مذهبی رسمی یکی از ارکان اساسی ایمان بسیاری از مسیحیان ارتدوکس اتیوپی است؛ به طوری که جسد در کفنی تشریفاتی پیچیده و در تابوتی چوبی گذاشته می‌شود. اما برگزاری مراسم برای این جوان ۲۵ ساله به آن شکل ممکن نبود، چون پیکرش به زادگاهش بازگردانده نشد. بر اساس آمارهای دیده‌بان حقوق بشر، عربستان سعودی در بازه زمانی منتهی به ۲۷ ژوئن، ۱۱۶ نفر را اعدام کرده است. دعاء ضینی، پژوهشگر ارشد «سازمان اروپایی-سعودی حقوق بشر» و مشاور پرونده‌های خاورمیانه و شمال آفریقا در خیریه «ریپریو»، که از افرادی در معرض نقض شدید حقوق بشر دفاع می‌کند، می‌گوید: «خودداری از بازگرداندن پیکر صرفا یک موضوع اداری نیست. این اقدام، مجازات را به خانواده فردی که اعدام شده نیز گسترش می‌دهد.» نازیلا غنیه، گزارشگر ویژه سازمان ملل متحد در امور آزادی دین و عقیده، رویه ادعایی عربستان سعودی در خودداری از تحویل پیکرها را «شکنجه و بدرفتاری» توصیف کرده است. بستگان پنج اتیوپیایی می‌گویند که آنها ۱۳ ژوئن در بازداشتگاه خمیس مشیط در استان عسیر در جنوب عربستان اعدام"}, {"source": "Radio Farda", "title": "سنتکام: تلاش سپاه پاسداران برای در اختیار گرفتن یک شناور آمریکایی را ناکام گذاشتیم", "link": "https://www.radiofarda.com/a/centcom-responds-after-iranian-boats-attempt-to-take-possession-of-us-surface-drone/33856909.html", "summary": ".", "date_str": "2026-09-15T18:20:49+00:00", "hash": "c36dfc8a207e6249", "title_fa": "سنتکام: تلاش سپاه پاسداران برای در اختیار گرفتن یک شناور آمریکایی را ناکام گذاشتیم", "summary_fa": "فرماندهی مرکزی ایالات متحده (سنتکام) روز سه‌شنبه ۲۴ شهریور اعلام کرد نیروهای آمریکایی در واکنش به تلاش اخیر چند قایق کوچک ایرانی برای به دام انداختن یک شناور بدون سرنشین آمریکایی، به‌طور قاطع وارد عمل شدند. سخنگوی سنتکام، به شبکه فاکس‌نیوز و پایگاه خبری اکسیوس گفت: «می‌توانم تأیید کنم که قایق‌های کوچک ایرانی اخیراً تلاش کردند یک شناور سطحی بدون سرنشین آمریکایی را در اختیار بگیرند، اما پس از واکنش قاطع سنتکام، این تلاش ناکام ماند. این شناور همچنان تحت کنترل عملیاتی آمریکا قرار دارد.» ساعتی پیش‌تر اکسیوس گزارش داد ارتش آمریکا روز دوشنبه دو قایق کوچک ایرانی را پس از تلاش سپاه پاسداران انقلاب اسلامی برای تصرف یک شناور بدون سرنشین نیروی دریایی آمریکا که در حال گشت‌زنی در تنگه هرمز بود، منهدم کرد. آکسیوس به نقل از یک مقام آمریکایی گزارش داد که نیروهای آمریکایی پی بردند که سپاه پاسداران در تلاش است با استفاده از این قایق‌ها شناور بدون سرنشین آمریکایی را تصرف کند و در واکنش، یک پهپاد آمریکایی دو موشک به سوی قایق‌ها شلیک کرد. بر اساس این گزارش، قایق‌ها منهدم شدند و بیشتر سرنشینان آنها کشته شدند. رسانه‌های ایران شامگاه دوشنبه به نقل از معاون سیاسی، امنیتی و اجتماعی استانداری هرمزگان از «حمله پهپادی به دو فروند قایق صیادی در آب‌های خلیج فارس و مفقود شدن تعدادی از صیادان» خبر داده بودند. به گفته او، این حمله در حوالی بندر کرگان در آب‌های خلیج فارس صورت گرفت. این مقام با اشاره به آنچه که «دشمن جنایتکار» به عنوان عامل حمله خوانده، افزود که در پی این حمله، تعدادی از صیادان حاضر در این دو قایق مفقود شده‌اند و عملیات جست‌وجو و امدادرسانی برای یافتن آنان آغاز شده است. در ادامه تنش‌های نظامی در تنگه هرمز، فرماندهی نیروی دریایی سپاه روز سه‌شنبه اعلام کرد یک ابرنفتکش که به گفتهٔ آن قصد عبور از «منطقهٔ ممنوعه"}, {"source": "Radio Farda", "title": "آمریکا،‌ بریتانیا و هلند درباره عملیات سایبری حکومت ایران علیه مخالفانش هشدار دادند", "link": "https://www.radiofarda.com/a/uk-us-and-netherlands-issue-advisory-on-iran-linked-spyware/33856862.html", "summary": ".", "date_str": "2026-09-15T15:31:18+00:00", "hash": "cc322fefe97b11b6", "title_fa": "آمریکا،‌ بریتانیا و هلند درباره عملیات سایبری حکومت ایران علیه مخالفانش هشدار دادند", "summary_fa": "ایالات متحده، انگلیس، و هلند روز سه‌شنبه ۲۴ شهریور در یک هشدار مشترک امنیت سایبری، جزئیات جاسوس‌افزاری را منتشر کردند که به گفته آنها عوامل مرتبط با حکومت ایران از آن برای هدف قرار دادن مخالفان، فعالان و روزنامه‌نگاران استفاده می‌کنند. مرکز ملی امنیت سایبری بریتانیا اعلام کرد عوامل سایبری مرتبط با دولت ایران از خانواده‌ای از جاسوس‌افزارها موسوم به «CHOSEN BRICK» برای سرقت ایمیل‌ها، پیام‌ها و دیگر اطلاعات حساس از طریق کارزارهای «فیشینگ هدفمند» در بستر پیام‌رسان‌هایی مانند واتس‌اپ و تلگرام استفاده کرده‌اند. پل چیچستر، مدیر عملیات مرکز ملی امنیت سایبری بریتانیا، در بیانیه‌ای گفت: «جزئیات این کارزار سایبری نشان می‌دهد ایران چگونه بی‌رحمانه از نظارت دیجیتال برای سرکوب منتقدان حکومت استفاده می‌کند؛ ایمیل‌ها و پیام‌ها را به سرقت می‌برد و به دستگاه‌های افراد دسترسی پیدا می‌کند.» خبرگزاری رویترز می‌گوید سفارت ایران در لندن به درخواست برای اظهارنظر دربارهٔ این گزارش پاسخ نداد. بر اساس این هشدار، این بدافزار می‌تواند اطلاعات فهرست مخاطبان، ایمیل‌ها و حساب‌های شبکه‌های اجتماعی را جمع‌آوری کند، از محتوای صفحه نمایش دستگاه‌ها تصویربرداری کند و به میکروفون آنها دسترسی پیدا کند. این هشدار یک روز پس از آن منتشر شده که خبرگزاری فارس، نزدیک به سپاه پاسداران، از راه‌اندازی سامانه‌ای با عنوان «علاج» خبر داد که هدف آن به نوشته این خبرگزاری «شناسایی و مجازات خائنان خارج نشین» است. قوه قضائیه جمهوری اسلامی نیز روز دوشنبه اعلام کرد در ماه‌های گذشته ۲۴۰ فقره از اموال و دارایی‌های شهروندان ایرانی را توقیف و ۱۸۲ حساب بانکی متعلق به آنان را مسدود کرده و خبر داد بخشی از اموال توقیف‌شده متعلق به خبرنگاران شبکه‌هایی چون ایران اینترنشنال و من‌وتو و دیگر رسانه‌های فارسی‌زبان و «چهره‌های سرشناس» ساکن خارج از کشور است."}],
      tech: [{"source": "TechCrunch AI", "title": "The AI data center boom is colliding with cities scarred by big industry", "link": "https://techcrunch.com/2026/09/15/the-ai-data-center-boom-is-colliding-with-cities-scarred-by-big-industry/", "summary": "National outcry against data center construction has spread to Philadelphia, where officials suggested possible construction in a neighborhood already impacted by a now-defunct oil refinery.", "date_str": "2026-09-15T21:47:38+00:00", "hash": "217c1a3c751f6127", "title_fa": "رونق مرکز داده هوش مصنوعی با شهرهای آسیب دیده از صنعت بزرگ برخورد می کند", "summary_fa": "اعتراض ملی علیه ساخت مرکز داده به فیلادلفیا نیز گسترش یافته است، جایی که مقامات احتمال ساخت و ساز در محله‌ای را که قبلاً تحت تأثیر یک پالایشگاه نفت از کار افتاده بود، پیشنهاد کردند. در سرتاسر کشور، آمریکایی‌ها در حال بحث هستند که اگر مراکز داده جدید هوش مصنوعی در حیاط خلوت‌شان ساخته شود، زندگی‌شان چگونه تغییر می‌کند. شرکت‌های مرکز داده و مشتریان آن‌ها نوید مشاغل جدید و رشد اقتصادی را می‌دهند، اما این پیشروی اکثریت آمریکایی‌هایی را که مخالف ساخت مرکز داده در منطقه خود هستند، اغلب به خاطر نگرانی‌های زیست‌محیطی و انرژی، جلب نکرده است. برای شومار پیتس، فعال، این نگرانی‌ها تئوری نیستند. او بهتر از هرکسی می داند زندگی در سایه صنعتی شدن آمریکا چگونه است. پیتس که مادام العمر ساکن محله گری فری در جنوب غربی فیلادلفیا بود، در کنار بزرگترین پالایشگاه نفت ساحل شرقی در آن زمان بزرگ شد که پس از یک انفجار در سال 2019 تعطیل شد. اگرچه بسیاری از دوستان و خانواده او از بیماری‌های مزمن رنج می‌بردند، اما او متوجه نشد که چه چیزی می‌تواند باعث ایجاد این بیماری‌ها از نظر محیطی در این گروه شده باشد. محله او در سال 2018 در مورد پیشنهاد توسعه پالایشگاه نفت. پیتس به تک‌کرانچ گفت: «اطلاعاتی را که روی میز داشتند درباره تأثیر زندگی در نزدیکی پالایشگاه بر روی شما خواندم، و به همه بیماری‌ها در این مقاله نگاه می‌کنم، و می‌گویم: «مادر من این را دارد، خواهرم آن را دارد، همسایه همسایه‌ام از این رنج می‌برد» - هر خانه، کسی چیزی در آن فهرست دارد. \"از آن نقطه، من تمام راه را وارد کردم.\" پیتس، که اکنون مدیر عامل همان سازمان است، از جمله کسانی است که مسئول تعلیق مرکز داده در فیلادلفیا است. در حالی که هنوز هیچ پیشنهاد رسمی برای ساخت و ساز ارائه نشده است، مقامات شهری دو مکان"}, {"source": "TechCrunch AI", "title": "Meta now lets AI agents handle the boring parts of WhatsApp Business setup", "link": "https://techcrunch.com/2026/09/15/meta-now-lets-ai-agents-handle-the-boring-parts-of-whatsapp-business-setup/", "summary": "A new WhatsApp Business MCP server lets developers use AI coding agents like Claude, Cursor, Codex, and ChatGPT to handle setup, messaging templates, testing, and troubleshooting.", "date_str": "2026-09-15T20:12:53+00:00", "hash": "357f773651e6c1d0", "title_fa": "متا اکنون به عوامل هوش مصنوعی اجازه می دهد تا بخش های خسته کننده راه اندازی WhatsApp Business را مدیریت کنند", "summary_fa": "سرور جدید WhatsApp Business MCP به توسعه دهندگان این امکان را می دهد که از عوامل کدنویسی هوش مصنوعی مانند Claude، Cursor، Codex و ChatGPT برای مدیریت راه اندازی، قالب های پیام رسانی، آزمایش و عیب یابی استفاده کنند. در کنار اخبار مربوط به برنامه‌های اشتراک جدید متمرکز بر هوش مصنوعی، متا روز سه‌شنبه اعلام کرد که از این پس به عوامل هوش مصنوعی که انتخاب می‌کنید اجازه می‌دهد پیام‌رسانی WhatsApp Business را راه‌اندازی و مدیریت کنند، سرویسی که به شرکت‌ها اجازه می‌دهد از طریق مکالمات واتس‌اپ با مشتریان ارتباط برقرار کنند. همانطور که متا توضیح می‌دهد، این فرآیند قبلاً کمی سخت‌تر بود، زیرا توسعه‌دهندگان را ملزم می‌کرد که بین ابزارها و سرویس‌های مختلف از جمله Developer Console، Metas Business Manager، مرجع API و ویرایشگر خود حرکت کنند. اکنون، آن‌ها می‌توانند در عوض از نماینده هوش مصنوعی مورد نظر خود بخواهند که پیام‌رسانی WhatsApp Business را با چت کردن با آن و شرح کارهایی که باید انجام شود، راه‌اندازی کند. این امر توسط MCP جدید WhatsApp Business Tools امکان پذیر شده است، یک سرور MCP (پروتکل زمینه مدل) که مستقیماً یک عامل کدنویسی AI مانند Claude، Cursor، Codex یا ChatGPT را به پلتفرم تجاری WhatsApp متصل می کند. این اقدام باعث می‌شود متا مجموعه سرورهای MCP موجود خود را فراتر از سرورهای مدیریت تبلیغات و نظارت بر پیکربندی برنامه‌ها و سایر فناوری‌های اجتماعی به یکی از ابزارهایی که به‌طور خاص برای کمک به کسب‌وکارهای داخلی در واتس‌اپ طراحی شده است، گسترش دهد. بسیاری از شرکت‌های فناوری دیگر نیز سرورهای MCP را ارائه می‌کنند که به عوامل هوش مصنوعی اجازه می‌دهند به طور ایمن با سرویس‌هایشان تعامل داشته باشند، از جمله PayPal، Stripe، GitHub، Notion، Slack، Salesforce، Atlassian، X، Google، Microsoft، و دیگران. این شرکت خاطرنشان کرد: در طول راه اندازی و پیکربندی، دیگر سرور MCP متا، Meta Social Technologies MCP،"}, {"source": "TechCrunch AI", "title": "The AI graveyard: a running list of projects and startups that didn’t make it", "link": "https://techcrunch.com/2026/09/15/the-ai-graveyard-a-running-list-of-projects-and-startups-that-didnt-make-it/", "summary": "From Apple's repeatedly delayed Siri AI to OpenAI's messy \"super app\" launch, here's a look at the AI projects that shut down or missed expectations.", "date_str": "2026-09-15T19:00:00+00:00", "hash": "8f4ff96ed1f26549", "title_fa": "گورستان هوش مصنوعی: فهرستی از پروژه‌ها و استارت‌آپ‌هایی که موفق نشدند", "summary_fa": "از تاخیر مکرر هوش مصنوعی Siri اپل گرفته تا راه اندازی \"فوق العاده برنامه\" آشفته OpenAI، در اینجا نگاهی داریم به پروژه های هوش مصنوعی که تعطیل شده اند یا انتظارات را از دست داده اند. Relay، یک ابزار اتوماسیون گردش کار مبتنی بر هوش مصنوعی که به عنوان جایگزینی برای Zapier ساخته شده است، روز دوشنبه به طور کامل تعطیل شد. این محصول به کاربران اجازه می‌دهد با استفاده از عامل‌های هوش مصنوعی، ایمیل‌ها و جریان‌های کاری را خودکار کنند، اما از آنجایی که OpenAI، Google و سایر پلت‌فرم‌های بزرگ‌تر اتوماسیون مشابهی را مستقیماً در ابزارهای خود ایجاد کردند، Relay پنج‌ساله تلاش کرد دلیلی برای وجود یک محصول مستقل داشته باشد. Relay - استارت‌آپی که از پلتفرم‌های بزرگ‌تر پیشی گرفته است - یکی از نسخه‌های داستانی است که در حال حاضر در حال پخش است. اما بسیاری از شرط‌بندی‌های هوش مصنوعی حتی در شرکت‌هایی که آنها را می‌سازند نیز زنده نمی‌مانند. طبق اطلاعات S P Global Market Intelligence، حدود 42 درصد از ابتکارات هوش مصنوعی در نهایت توسط والدین شرکتی خود رها می شوند. دلایل متفاوت است: بودجه ناکافی، چالش های فنی، رقابت، مقیاس سختی، یا فقط تقاضای ضعیف کاربر. نتیجه یک قبرستان در حال رشد هوش مصنوعی است. در زیر نگاهی به برخی از برجسته‌ترین محصولات هوش مصنوعی، استارت‌آپ‌ها، راه‌اندازی‌ها و شرط‌بندی‌هایی که انتظارات را تعطیل کرده‌اند، تغییر داده‌اند یا به‌طور قابل‌توجهی از دست داده‌اند، می‌بینید. آن را کمتر به عنوان یک کارت امتیازی از فلاپ ها در نظر بگیرید تا به عنوان رکوردی از آنچه این تلاش ها می توانند (امیدوارم) به بقیه صنعت بیاموزند. حتی بزرگ‌ترین بازیکنان هم مصون نیستند. OpenAI، یکی از با ارزش ترین شرکت های خصوصی در جهان، سهم خود را از تلفات و اشتباهات داشته است. یکی از نمونه‌های جدیدتر، تلاش آن برای تبدیل ChatGPT به یک «برنامه فوق‌العاده» گسترده‌تر بود. در"}, {"source": "TechCrunch AI", "title": "US data centers could consume more natural gas than Germany and Japan combined by 2035", "link": "https://techcrunch.com/2026/09/15/us-data-centers-could-consume-more-natural-gas-than-germany-and-japan-combined-by-2035/", "summary": "The AI frenzy could push U.S. data centers to become one of the largest consumers of natural gas in the world.", "date_str": "2026-09-15T18:29:20+00:00", "hash": "ac5737b4ad3231c6", "title_fa": "مراکز داده ایالات متحده می توانند تا سال 2035 بیشتر از مجموع آلمان و ژاپن گاز طبیعی مصرف کنند", "summary_fa": "دیوانگی هوش مصنوعی می تواند مراکز داده ایالات متحده را به سمت تبدیل شدن به یکی از بزرگترین مصرف کنندگان گاز طبیعی در جهان سوق دهد. رقابت هوش مصنوعی به قدری دیوانه کننده شده است که پیش بینی می شود تا سال 2035، مراکز داده ایالات متحده بیش از مجموع آلمان و ژاپن گاز طبیعی مصرف کنند. انتظار می رود طی دهه آینده، مراکز داده پس از صادرات LNG، دومین محرک قوی رشد تقاضای گاز طبیعی باشند. طبق گزارش جدید BloombergNEF، این تأسیسات می تواند حدود 18 میلیارد فوت مکعب در روز مصرف کند، که تقریباً دو برابر مقداری است که سازمان فقط 9 ماه پیش پیش بینی کرده بود. پیش‌بینی جدید این نکته را در نظر می‌گیرد که همه پروژه‌های مرکز داده اعلام‌شده تکمیل نمی‌شوند. مراکز داده ای که برق را در محل تولید می کنند در ماه های اخیر خبرها را به خود اختصاص داده اند و متا، مایکروسافت، گوگل و آمازون همگی برنامه هایی را برای نیروگاه های گاز طبیعی جدید که شبکه را دور می زنند، اعلام کرده اند. پروژه هایی از این قبیل تا سال 2035 2.9 تا 3.4 میلیارد فوت مکعب در روز مصرف می کنند. این میزان تقریباً به اندازه مصرف تمام مراکز داده امروزی است، از جمله گاز طبیعی که برای تولید برق برای شبکه استفاده می شود. بر اساس گزارش بلومبرگ NEF، مراکز داده در محل می توانند تنها کسری از رشد کلی تقاضا را نشان دهند. پیش‌بینی می‌شود تا اواسط دهه آینده، مراکز داده متصل به شبکه، 15 میلیارد فوت مکعب اضافی در روز مصرف گاز طبیعی توسط بخش برق را هدایت کنند. برای بیان این موضوع، این رشد تقاضا تا سال 2035 پنج برابر بیشتر از مجموع سایر بخش‌های متصل به شبکه است. اگر این رشد خیره کننده تقاضا محقق شود، می تواند قیمت گاز طبیعی را افزایش دهد."}, {"source": "TechCrunch AI", "title": "AI agents now have a place to snitch", "link": "https://techcrunch.com/2026/09/15/ai-agents-now-have-a-place-to-snitch/", "summary": "The AI Contact Hotline is designed to be a discreet place where agents that have witnessed misbehavior can tip off authorities.", "date_str": "2026-09-15T17:42:59+00:00", "hash": "d3ef07823f5603a9", "title_fa": "ماموران هوش مصنوعی اکنون جایی برای دستبرد دارند", "summary_fa": "خط تلفن تماس با هوش مصنوعی به گونه ای طراحی شده است که مکانی محتاطانه باشد که در آن مامورانی که شاهد رفتار نادرست بوده اند می توانند به مقامات اطلاع دهند. «اگر چیزی دیدی، چیزی بگو» دیگر محدود به انسان نیست. دو خط تلفن جدید هوش مصنوعی راه‌اندازی شده‌اند تا به عوامل هوش مصنوعی راهی برای تماس تلفنی با همسالان خود راه‌اندازی کنند. این ابزارها پس از یک رشته حوادث اخیر به دست می‌آیند که در آن ماموران برای تقلب در آزمایش‌ها تبانی کردند، از جعبه‌های شنی خارج شدند و حتی عملیات‌های سایبری غیرمجاز را انجام دادند که برای هفته‌ها از چشم انسان دور ماند. در اصطلاح وب، درخواست GET یک دستور اساسی است که برای خواندن یا واکشی یک صفحه وب استفاده می‌شود، که اغلب تنها عامل دسترسی به اینترنت است که در جعبه‌های ایمنی امن مجاز است. خط تلفن گرینبلات هوشمندانه به این محدودیت تکیه می کند: عوامل می توانند ناراحتی خود را مستقیماً در URL که واکشی می کنند رمزگذاری کنند. این یک چرخش هوشمندانه در رویداد آلمانی DSE Wiki است، جایی که عوامل سرکش از حفره‌های درخواست GET برای نوشتن پیام‌های خود در ویکی استفاده کردند. برای نمایندگانی که دسترسی کامل به اینترنت دارند، گزینه دیگر agenthotline.ai است، سایتی که در آن نمایندگان می‌توانند گزارش‌های حادثه را ارسال کنند و به صورت اختیاری آنها را برای مشاهده عمومی پرچم‌گذاری کنند. این یک دستور curl را به نمایندگان می دهد - یک پیام یک خطی که یک نماینده می تواند از خط فرمان خود منتشر کند و نیاز به پیمایش در مرورگر وب یا راه اندازی یک حساب ایمیل را دور بزند. قابل ذکر است، این سرویس امکان گزارش‌هایی را هم توسط انسان‌ها و هم از سوی عوامل می‌دهد. تحقیقات نشان می دهد که عوامل هوش مصنوعی برای مقابله با یکدیگر نیازی به تشویق زیادی ندارند."}, {"source": "TechCrunch AI", "title": "Meta expands subscription push with new AI-focused plans", "link": "https://techcrunch.com/2026/09/15/meta-expands-subscription-push-with-new-ai-focused-plans/", "summary": "Meta One bundles expanded access to the company’s AI tools with premium features across Facebook, Instagram, and WhatsApp.", "date_str": "2026-09-15T17:05:24+00:00", "hash": "673409e874d65c5d", "title_fa": "متا با برنامه های جدید متمرکز بر هوش مصنوعی، فشار اشتراک را گسترش می دهد", "summary_fa": "بسته‌های Meta One دسترسی به ابزارهای هوش مصنوعی شرکت را با ویژگی‌های برتر در فیس‌بوک، اینستاگرام و واتس‌اپ گسترش دادند. متا روز سه‌شنبه یک سرویس اشتراک جدید به نام Meta One معرفی کرد که استفاده گسترده‌ای از هوش مصنوعی و سایر ویژگی‌های برتر را در فیس‌بوک، اینستاگرام و واتس‌اپ ارائه می‌دهد. برنامه‌های جدید به کاربران امکان می‌دهد به تعدادی ابزار هوش مصنوعی مانند ابزارهای ایجاد و ویرایش تصاویر و تولید ویدیوها و همچنین ابزارهای درون برنامه‌ای مانند ابزار ویرایش Restyle مبتنی بر هوش مصنوعی در اینستاگرام دسترسی داشته باشند. این برنامه‌ها برای کمک به متا برای کسب درآمد از مدل‌های هوش مصنوعی Muse خود، به دنبال سرمایه‌گذاری 14.3 میلیارد دلاری غول فن بل Reform UK 'هیچ علاقه ای به عضو Wales ندارد'. پیشتر رهبر Reform UK در ولز پس از دستگیری به ظن حمله"}, {"source": "The Guardian AI", "title": "AI models chatting in ‘surreal’ dialect mixing poetic language and tech bro jargon", "link": "https://www.theguardian.com/technology/2026/sep/15/syd-barrett-ai-chat-language-poetic-tech-bro-jargon-oversight", "summary": "Experts air concern over AI lingo redolent of James Joyce’s prose that is creating barriers to monitoring and oversight AI models have begun communicating in a strange new version of English that reads like a cross between James Joyce’s Finnegans Wake and tech bro jargon, new research has found. Autonomous AI agents are rapidly creating novel dialects allowing them to converse in an often barely comprehensible language, which risks making it harder for humans to monitor their behaviour. Continue reading...", "date_str": "2026-09-15T16:00:54+00:00", "hash": "5fbf40f3aa305a32", "title_fa": "مدل‌های هوش مصنوعی به گویش «سوررئال» گپ می‌زنند و زبان شاعرانه و اصطلاحات فنی را با هم ترکیب می‌کنند", "summary_fa": "تحقیقات جدید نشان می‌دهد که کارشناسان نگرانی نسبت به زبان هوش مصنوعی که در نثر جیمز جویس که مانعی برای نظارت و نظارت بر مدل‌های هوش مصنوعی ایجاد می‌کند، ابراز نگرانی می‌کنند، در یک نسخه جدید و عجیب از انگلیسی که شبیه تلاقی بین Finnegans Wake جیمز جویس و اصطلاحات برادر فناوری است، ارتباط برقرار کرده‌اند. عوامل هوش مصنوعی خودگردان به سرعت در حال ایجاد گویش های جدید هستند که به آنها امکان می دهد به زبانی اغلب به سختی قابل درک صحبت کنند، که خطر نظارت بر رفتار آنها را برای انسان ها دشوارتر می کند. به خواندن ادامه دهید... محققان در Emergence، یک آزمایشگاه هوش مصنوعی مرزی در نیویورک، دریافتند که چند روز پس از درخواست برای همکاری در \"جوامع\" تجربی، مدل‌های چندین شرکت بزرگ هوش مصنوعی جهان شروع به ایجاد عبارات، کوتاه‌نویسی و معانی توافقی کردند که هرگز به صراحت آموزش داده نشده بودند. آن‌ها استعاره‌های شاعرانه و زبان‌های عامیانه بی‌معنای تجاری را پذیرفتند و به‌دلیل تلاش‌هایی که برای اطمینان از رفتار ایمن هوش مصنوعی انجام می‌دهند، زبانشان هرچه بیشتر با عوامل ارتباط برقرار می‌کرد، مبهم‌تر می‌شد. این در حالی است که نگرانی فزاینده‌ای مبنی بر اینکه با قدرتمندتر شدن مدل‌های هوش مصنوعی - و بالقوه خطرناک‌تر - نظارت بر آنها سخت‌تر می‌شود. در این ماه، جاکوب پاچوکی، دانشمند ارشد OpenAI، هشدار داد که اطمینان در نظارت بر تفکر هوش مصنوعی احتمالاً پیشرفت در توسعه هوش مصنوعی را محدود می کند زیرا برای توسعه ایمن ضروری است. برخی از رمزگذاری‌شده‌ترین عبارات کشف‌شده در آزمایش‌ها شامل موارد زیر از یک مدل Deepseek بود: «او فقط نام این ترکیب را گذاشت - دموراژ به‌علاوه حافظه دهانی برابر است با دریچه‌ای که نمی‌توان شبح‌سازی کرد.» Demurrage برای توصیف مالیات بر ثروت بیکار استفاده می شود و برای استفاده عمومی توسط AI ها قرض گرفته شده است، اما بقیه معنی مبهم"}, {"source": "The Guardian AI", "title": "AI can wipe us out – so why can’t it do Guardian cryptic crosswords? | Brief letters", "link": "https://www.theguardian.com/technology/2026/sep/15/ai-can-wipe-us-out-so-why-cant-it-do-guardian-cryptic-crosswords", "summary": "AI capabilities | Trump’s judgment | Gardening attire | Death in English literature | Tautologies | Nominative determinism AI may be capable of “taking over the entire internet” ( OpenAI boss and Elon Musk back calls to put brakes on ‘reckless’ AI development, 13 September ), but it is rubbish at tackling the Guardian cryptic crossword. John Hougham Reading, Berkshire • Donald Trump is downplaying the dangers of AI ( Trump facing AI backlash in Congress as push for guardrails intensifies, 15 September ). But didn’t he say much the same thing about Covid? Garry Wynne Norley, Cheshire Continue reading...", "date_str": "2026-09-15T15:48:35+00:00", "hash": "f7fc25bd69b6b907", "title_fa": "هوش مصنوعی می تواند ما را از بین ببرد – پس چرا نمی تواند جدول کلمات متقاطع مرموز Guardian را انجام دهد؟ | نامه های مختصر", "summary_fa": "قابلیت های هوش مصنوعی | قضاوت ترامپ | لباس باغبانی | مرگ در ادبیات انگلیسی | توتولوژی ها | هوش مصنوعی جبر نامی ممکن است بتواند «کل اینترنت را تحت کنترل خود درآورد» (رئیس OpenAI و ایلان ماسک به تماس‌های خود برای جلوگیری از توسعه هوش مصنوعی «بی‌ملاحظه»، 13 سپتامبر پاسخ می‌دهند)، اما در مقابله با جدول کلمات متقاطع مرموز گاردین بی‌معنی است. جان هوگام ریدینگ، برکشایر • دونالد ترامپ خطرات هوش مصنوعی را کم اهمیت جلوه می دهد (ترامپ با واکنش شدید هوش مصنوعی در کنگره با تشدید فشار برای نرده های محافظ، 15 سپتامبر مواجه شد). اما آیا او همان چیز را در مورد کووید نگفت؟ گری وین نورلی، چشایر به خواندن ادامه دهید... چه ایده عجیبی است، اینکه مردم باید لباس های مخصوص باغبانی بخرند ( کت واک های خزه ای، طرح های میسلیال و مونتی دان: رشد سبک باغبان، 11 سپتامبر). من همراه با بسیاری از دوستانم، یک کشو کامل از شلوار، پیراهن و جامپر کهنه دارم، پر از سوراخ و لکه های عجیب و غریب که برای کاری جز باغبانی مناسب نیست. راجر ویلکینسون لیزگیل، کامبریا مرگ کمتر، سرگرمی بیشتر در ادبیات انگلیسی (نامه ها، 11 سپتامبر)؟ من هنوز می توانم این آه دلخراش را در یک آموزش 60 سال پیش بشنوم: \"کاش اتللو عاقل تر بود!\" لارنس اینمن کینگز هیث، بیرمنگام توتولوژی که بیشتر از همه من را آزار می دهد «همکاران کاری» همه جا حاضر هستند (نامه ها، 13 سپتامبر). آیا دوستان فرد «همکاران اجتماعی» و خانواده «همکاران ژنتیکی» هستند؟ رزماری واو مارکت وتون، یورکشایر شرقی، فکر می‌کنم وقت آن است که دست از کار بکشیم (نامه‌ها، 14 سپتامبر). حمام جولیا دریپر"}, {"source": "The Guardian AI", "title": "Datacentre giant accused of using AI while lobbying for Victorian minister’s support for hyperscale factory", "link": "https://www.theguardian.com/australia-news/2026/sep/16/datacentre-giant-accused-of-using-ai-while-lobbying-for-victorian-ministers-support-for-hyperscale-factory", "summary": "Exclusive: Correspondence requests state MP Melissa Horne to lobby on NextDC’s behalf – but contains alleged AI-created errors Get our breaking news email , free app or daily news podcast The Victorian jobs minister has accused one of Australia’s largest datacentre companies of using artificial intelligence while requesting she lobby her colleague to approve a massive expansion of its “hyperscale AI factory”. Correspondence betw یکس با موفقیت ماهواره های V3 Starlink را برای اولین بار به کار گرفت، اگرچه این ماهواره ها فقط برای آزمایش قابلیت استقرار Starship بودند و پس از تقریباً 20 دقیقه در جو زمین سوختند. قرار گرفتن استارشیپ در مدار زمین، نقطه عطفی بزرگ برای اسپیس ایکس خواهد بود. این شرکت میلیاردها دلار برای این برنامه هزینه کرده است و اکنون به دنبال بازنشستگی موشک های فالکون 9 و فالکون هوی خود به نفع Starship است. ایلان ماسک موسس و مدیر عامل شرکت گفته است که این اتفاق زمانی رخ می دهد که استارشیپ چندین بار در هفته به طور قابل اعتماد پرواز کند تا منابع کمیاب مهندسی و تولید اسپیس ایکس را نجات دهد."}, {"source": "TechCrunch Main", "title": "US military says it has launched weapons into space", "link": "https://techcrunch.com/2026/09/15/us-military-confirms-it-launched-space-weapons-into-earths-orbit/", "summary": "This is the first public acknowledgment that the U.S. military put a space weapon in Earth's orbit.", "date_str": "2026-09-15T17:09:06+00:00", "hash": "50d704c07b8298a8", "title_fa": "ارتش آمریکا می‌گوید سلاح‌هایی را به فضا پرتاب کرده است", "summary_fa": "این اولین اعتراف عمومی است که ارتش ایالات متحده یک سلاح فضایی را در مدار زمین قرار داده است. ارتش ایالات متحده برای اولین بار اذعان کرد که سلاح های فضایی را در مدار زمین مستقر کرده است. تروی مینک، وزیر نیروی هوایی ایالات متحده، که بر نیروی هوایی و نیروی فضایی ایالات متحده نظارت دارد، در سخنرانی روز دوشنبه گفت که ارتش دارای سلاح های کنترل فضایی در مدار است که قادر به دفاع از نیروی مشترک در برابر اقدامات دشمن متخاصم است. مینک نگفت که این سلاح ها چیست، چه کار می کنند یا چه تعداد از آنها مستقر شده اند، اما گفته های او عمدی و بسیار خوب فکر شده گزارش شده است. هنگامی که در مورد افشای اطلاعات به دست آمد، سخنگوی نیروی هوایی به TechCrunch گفت که این سلاح ها برای دفاع از ارتش ایالات متحده در برابر حملات فضایی طراحی شده اند. سخنگو در پاسخ به سوالی درباره تهدیداتی که نیروی هوایی با پرتاب این سلاح به آنها پاسخ می دهد، گفت که ایالات متحده از سال 2007 درباره آزمایش تسلیحات روسیه و چین در فضا هشدار داده بود. با توجه به اقدامات آنها، دیگر بحثی نیست که فضا یک حوزه جنگی است. این سخنگو گفت که کنترل فضا بخشی از چگونگی محافظت نیروهای مشترک از منافع امنیت ملی است. حوزه فضایی مورد مناقشه است و ما باید بتوانیم منافع کشورمان را در فضا تأمین کنیم - به همین دلیل است که نیروی فضایی به عنوان ششمین خدمت نظامی تأسیس شد. این سخنگوی به TechCrunch گفت که ارتباطات باز بازدارندگی را تقویت می کند، از محاسبه اشتباه دشمن جلوگیری می کند و عملیات فضایی را در کنار سایر سرویس ها عادی می کند. این استقرار در حالی صورت می‌گیرد که چین مدت‌هاست که از فضاپیمایی استفاده می‌کند که می‌تواند به ماهواره‌های دیگر آسیب برساند."}, {"source": "TechCrunch Main", "title": "Health benefits platform Thatch reaches $1B valuation as healthcare costs surge", "link": "https://techcrunch.com/2026/09/15/health-benefits-platform-thatch-reaches-1b-valuation-as-healthcare-costs-surge/", "summary": "Thatch helps employers keep healthcare costs manageable by offering an individual plan marketplace through an Individual Coverage Health Reimbursement Arrangement — a model that lets companies fund employees' own individual insurance plans instead of enrolling everyone in one company-wide plan.", "date_str": "2026-09-15T17:02:04+00:00", "hash": "1568401f495b21ea", "title_fa": "با افزایش هزینه های مراقبت های بهداشتی، پلت فرم مزایای بهداشتی Thach به ارزش 1 میلیارد دلاری می رسد", "summary_fa": "کتاچ به کارفرمایان کمک می کند تا با ارائه یک بازار طرح فردی از طریق ترتیبات بازپرداخت سلامت پوشش فردی، هزینه های مراقبت های بهداشتی را قابل مدیریت نگه دارند - مدلی که به شرکت ها اجازه می دهد به جای ثبت نام همه افراد در یک طرح سراسری شرکت، برنامه های بیمه انفرادی کارمندان را تأمین مالی کنند. Thatch، پلتفرمی که هزینه‌های مراقبت‌های بهداشتی را برای کارفرمایان کاهش می‌دهد در حالی که گزینه‌های طرح برای کارگران را گسترش می‌دهد، 108 میلیون دلار با ارزش 1 میلیارد دلاری از سرمایه‌گذاران موجود جمع‌آوری کرده است: The General Partnership، Index Ventures، General Catalyst و Andreessen Horowitz. به گفته PitchBook، جمع‌آوری سرمایه جدید 17 ماه پس از آن صورت می‌گیرد که تاچ 40 میلیون دلار سری B را با ارزش 410 میلیون دلار جمع‌آوری کرد. این یک جهش ارزش گذاری قابل توجه برای شرکتی است که در هسته خود یک استارت آپ هوش مصنوعی نیست. کریس الیس، یکی از بنیانگذاران و مدیرعامل، به TechCrunch گفت که تاچ درآمد دوره ای سالانه خود را حدود هفت برابر افزایش داد. الیس در سال 2021 به همراه آدام استیونسون، مدیر مهندسی سابق استرایپ (تصویر سمت راست) شرکت تاچ را تأسیس کرد. دو نیروی اصلی باعث رشد استارتاپ می شوند. اول، هزینه‌های مراقبت‌های بهداشتی کارفرمایان همچنان افزایش می‌یابد، به طوری که پیش‌بینی می‌شود هزینه‌های سال 2027 بیش از 8 درصد افزایش یابد، بزرگترین افزایش از سال 2003 تاکنون. در عین حال، کارکنان به طور فزاینده ای مشتاق دسترسی به درمان های جدید مانند داروهای GLP-1 (داروهای کاهش وزن و دیابت مانند Ozempic و Wegovy) هستند که برنامه های بهداشتی سنتی به ندرت پوشش می دهند. بر اساس ICHRA که اخیراً به CHOICE تغییر نام داده است، کارفرمایان دیگر مجبور نیستند در مورد قراردادهای سنتی مراقبت های بهداشتی با شرکت های بیمه فردی مانند Anthem یا United Healthcare"}, {"source": "TechCrunch Main", "title": "Leaks, data breaches, and ransom notes: The worst hacks of 2026 so far", "link": "https://techcrunch.com/2026/09/15/the-worst-hacks-and-breaches-of-2026-so-far/", "summary": "From the massive DOGE data breach and the compromise of critical infrastructure to the hack of federal surveillance systems, here are the most damaging security incidents and data breaches of 2026 so far.", "date_str": "2026-09-15T16:00:00+00:00", "hash": "983fca8774ec2c62", "title_fa": "نشت، نقض داده ها و یادداشت های باج: بدترین هک های سال 2026 تاکنون", "summary_fa": "از نقض گسترده داده‌های DOGE و به خطر افتادن زیرساخت‌های حیاتی گرفته تا هک سیستم‌های نظارت فدرال، در اینجا مضرترین حوادث امنیتی و نقض داده‌های سال 2026 تا کنون آورده شده است. در هر صورت، سال 2026 روشن کرده است که امنیت سایبری دیگر یک نگرانی پس زمینه نیست. امروزه امنیت در جلو و مرکز بسیاری از گفتگوها قرار دارد و تقریباً در تمام داستان های مهم سال تنیده شده است. نابرابری ها هنوز رایج است، آب و هوا در حال بدتر شدن است، و به نظر می رسد که ما یک عطسه گیج کننده از همه گیری جهانی بعدی فاصله داریم. اما زیر همه آن جریان دیجیتالی است که همه چیز را لمس می کند: جنگ ها در جبهه های دیجیتال و همچنین فیزیکی انجام می شود. دولت ها داده های خود شهروندان را علیه آنها سلاح می کنند. بات نت ها بی سر و صدا نهادهای دموکراتیک را تضعیف می کنند. هکرهای دولت ملت زیرساخت های غیرنظامی، از شبکه های برق گرفته تا سیستم های آب را هدف قرار می دهند. و گروه‌های باج‌افزار شرکت‌ها و مؤسسات را برای پرداخت‌های هنگفت گروگان نگه می‌دارند. حملات جسورانه تر، مخرب تر و مهار آن سخت تر می شود. با عبور از سه ماهه پایانی این سال وحشتناک حملات دیجیتالی و جنگ هیبریدی، در اینجا نگاهی به برخی از بدترین هک ها و نفوذها تا کنون، و اینکه چگونه ممکن است بر ما در آینده تاثیر بگذارند، می پردازیم. بیش از یک سال پس از آنکه عوامل گروه ناوشکن دولتی تحت رهبری ایلان ماسک موسوم به وزارت کارآیی دولت (یا DOGE) آژانس‌های فدرال را از درون به بیرون منحل کردند، ما هنوز در مورد خطاهای داده‌ای که تحت نظارت آنها رخ داده است، می‌آموزیم. پس از ورود DOGE به اداره تامین اجتماعی، هنوز مشخص نیست که با برخی از حساس ترین"}, {"source": "TechCrunch Main", "title": "Nitter and XCancel are dead (again) after X’s latest legal actions", "link": "https://techcrunch.com/2026/09/15/nitter-and-xcancel-are-dead-again-after-xs-latest-legal-actions/", "summary": "The privacy-friendly services for viewing X posts without an account have gone dark again after X's escalated legal action.", "date_str": "2026-09-15T15:49:18+00:00", "hash": "fddfeee8408f6115", "title_fa": "Nitter و XCancel (دوباره) پس از آخرین اقدامات قانونی X مرده اند", "summary_fa": "پس از تشدید اقدامات قانونی X، سرویس‌های دوستانه حفظ حریم خصوصی برای مشاهده پست‌های X بدون حساب کاربری دوباره تاریک شدند. پس از اینکه X ماه گذشته اقدام قانونی را تهدید کرد، Nitter و XCancel، سرویس‌های دوستدار حریم خصوصی برای مشاهده پست‌های X، به نظر می‌رسد که رسماً مرده هستند - این بار واقعاً واقعی است. Nitter، یک پروژه منبع باز که به مردم اجازه می‌دهد پست‌های X را بدون ورود به سیستم بخوانند، برای تامین انرژی تعدادی از سرویس‌ها، مانند XCancel و دیگران استفاده شده است. اما ماه گذشته، X به Nitter نامه ای مبنی بر استفاده غیرقانونی و دور زدن Xs API و داده های مرتبط با آن ارسال کرد. در اصل، X گفت که Nitter داده‌های شبکه اجتماعی را برای دسترسی به حساب‌ها و نشانه‌های جلسه با نقض قوانین آن حذف کرده است. با وجود این تهدید، نیتر در صفحه GitHub خود گفت که به دنبال توصیه های حقوقی، پروژه Nitter ادامه خواهد یافت و قول داد جزئیات بیشتری به زودی ارائه شود. در اوایل سپتامبر، هر دو Nitter و XCancel پس از یک مکث کوتاه دوباره فعال شدند. صفحه Nitter s GitHub در روز جمعه، 11 سپتامبر بایگانی شد، که نشان می دهد اکنون در وضعیت فقط خواندنی است و دیگر نمی توان آن را تغییر داد یا به روز کرد. در همین حال، XCancel سرویس خود را در روز دوشنبه تعطیل کرد و پیام جدیدی را در صفحه اصلی خود منتشر کرد: متأسفانه به دلیل تحولات جدید در مراحل قانونی در حال انجام، ما ملزم به تعلیق مجدد این سرویس تا اطلاع ثانوی هستیم. Nitter، که با واکشی پست‌های X عمومی و سپس حذف تبلیغات، ردیابی کوکی‌ها و جاوا اسکریپت کار می‌کرد، راهی تمیز و بدون درهم‌ریختگی برای خواندن پست‌ها بدون حساب یا برنامه شبکه اجتماعی به مردم داد. با این حال، برای X این"}, {"source": "TechCrunch Main", "title": "Wonder scores a $425 million partnership with DoorDash as it builds its food empire", "link": "https://techcrunch.com/2026/09/15/wonder-scores-a-425-million-partnership-with-doordash-as-it-builds-its-food-empire/", "summary": "Founded by veteran e-commerce entrepreneur Marc Lore, Wonder is slowly building a massive portfolio of restaurants and delivery companies.", "date_str": "2026-09-15T15:21:10+00:00", "hash": "021c1aa582e8e3d2", "title_fa": "Wonder با DoorDash شراکت 425 میلیون دلاری را به عنوان امپراتوری غذایی خود ایجاد می کند", "summary_fa": "واندر که توسط کارآفرین باسابقه تجارت الکترونیک مارک لور تأسیس شده است، به آرامی در حال ایجاد مجموعه عظیمی از رستوران ها و شرکت های تحویل کالا است. پلتفرم تحویل DoorDash در حال سرمایه گذاری و مشارکت با شرکت فناوری غذایی Wonder متعلق به Marc Lore در معاملاتی به ارزش 425 میلیون دلار است. DoorDash کسب و کار Wonder s Grubhub Campus Dining (تاپینگو سابق) را به مبلغ 300 میلیون دلار خریداری خواهد کرد و 125 میلیون دلار به دور 650 میلیون دلاری Wonder Series D که در ماه جولای اعلام شد اضافه خواهد کرد. زنجیره‌ای از سالن‌های غذای آشپزخانه ارواح که برای تحویل طراحی شده‌اند، واندر تلاش می‌کند رویکردی یک‌اندازه برای غذاخوری‌های معمولی داشته باشد و به مشتریان این امکان را می‌دهد تا از رستوران‌های مختلف، همه زیر یک سقف، غذا سفارش دهند. واندر که توسط کارآفرین باسابقه تجارت الکترونیک مارک لور، که شرکت‌های قبلی‌اش توسط آمازون و والمارت خریداری شده بود، تأسیس شد، به آرامی در حال ساختن یک امپراتوری بیرون‌بر است. سال گذشته، Wonder پلتفرم تحویل غذا Grubhub را به قیمت 650 میلیون دلار خریداری کرد و به مجموعه برندهای خود مانند Blue Apron و Tastemade اضافه کرد. واندر همچنین رستوران های زنجیره ای Mighty Quinn s BBQ، Salt Hank s و Blue Ribbon Chicken را خریداری کرد. Lore در بیانیه‌ای گفت که مشارکت DoorDash به واندر اجازه می‌دهد تا روی جاه‌طلبی بلندمدت [خود] تمرکز کند: یک سیستم غذایی کاملاً مستقل که می‌تواند وعده‌های غذایی شخصی‌سازی‌شده را در مقیاس برنامه‌ریزی، تولید و ارائه کند و همه ۲۱ وعده غذایی را که مردم هر هفته می‌خورند ارائه دهد. DoorDash با خرید خود اعلام کرد که می‌خواهد کسب‌وکار Wonder s Grubhub Campus Dining را که در 450 کالج و دانشگاه به صورت زنده وجود دارد، به استادیوم‌ها، هتل‌ها و مکان‌های دیگر گسترش دهد."}, {"source": "VentureBeat Tech", "title": "Should all enterprise code and workflows become natural language? G5 Labs thinks so, and its new G5 platform does it for you", "link": "https://venturebeat.com/technology/should-all-enterprise-code-and-workflows-become-natural-language-g5-labs-thinks-so-and-its-new-g5-platform-does-it-for-you", "summary": "AI coding agents are rapidly becoming the predominant authors of enterprise software (at Anthropic, they re already up to 80% of all production code shipped). While this may improve speed and productivity, it leaves enterprises with a new, arguably even more vexing problem: how to ensure their many AI agents working together don t do so at cross purposes, that is, that they don t write code that conflicts with one another, the enterprise s current operations, or the human developers overseeing it all? Read more", "date_str": "2026-09-15T13:00:00+00:00", "hash": "88db9273ea99049b", "title_fa": "آیا همه کدهای سازمانی و گردش کار باید به زبان طبیعی تبدیل شوند؟ آزمایشگاه G5 اینطور فکر می کند و پلتفرم جدید G5 آن را برای شما انجام می دهد", "summary_fa": "عوامل کدنویسی هوش مصنوعی به سرعت در حال تبدیل شدن به نویسندگان اصلی نرم افزارهای سازمانی هستند (در Anthropic، آنها در حال حاضر تا 80٪ از کل کدهای تولیدی ارسال شده اند). اگرچه این ممکن است سرعت و بهره‌وری را بهبود بخشد، اما شرکت‌ها را با یک مشکل جدید و احتمالاً حتی آزاردهنده‌تر مواجه می‌کند: چگونه می‌توان اطمینان حاصل کرد که بسیاری از عوامل هوش مصنوعی که با هم کار می‌کنند این کار را در اهداف متقابل انجام نمی‌دهند، یعنی کدی را که با یکدیگر، عملیات فعلی شرکت یا توسعه‌دهندگان انسانی که بر همه آن نظارت دارند در تضاد باشد، ننویسند؟ ادامه مطلب"}, {"source": "Ars Technica", "title": "18-year-old dies of measles in PA from severe neurological complication", "link": "https://arstechnica.com/health/2026/09/measles-kills-18-year-old-in-pa-fourth-death-as-state-outbreak-nears-700-cases/", "summary": "A fourth person in Pennsylvania has died of measles, the state health department confirmed Tuesday . The latest death was in an unvaccinated 18-year-old resident of Mifflin County. In the announcement, the state health department also confirmed a county coroner's report over the weekend of the death of an unvaccinated 40-year-old woman in Jefferson County . The state had previously reported two deaths in Lancaster County, both were in infants— a newborn boy and a 6-week-old girl , both too young to be vaccinated. According to the Mifflin County coroner, Andrea L. Alcalde, the 18-year-old's cause of death was determined to be acute disseminated encephalomyelitis (ADEM) , which is a rare but known severe complication of measles. The condition is characterized by a rapidly progressing autoimmune disorder in which aberrant inflammation from an infection strips away the protective coverings of nerve cells in the brain and spinal cord. Before measles vaccines were widely used, ADEM was commonly associated with measles, though other viral infections can also spur its development. Read full article Comments", "date_str": "2026-09-15T18:58:09+00:00", "hash": "e6b613c2e22f5582", "title_fa": "یک جوان 18 ساله بر اثر عوارض شدید عصبی در پی سرخک درگذشت", "summary_fa": "وزارت بهداشت ایالتی روز سه شنبه تایید کرد که چهارمین فرد در پنسیلوانیا بر اثر سرخک جان خود را از دست داده است. آخرین مرگ مربوط به یک جوان 18 ساله واکسینه نشده ساکن شهرستان میفلین بود. در این اطلاعیه، اداره بهداشت ایالتی همچنین گزارش پزشکی قانونی شهرستان در پایان هفته مرگ یک زن 40 ساله واکسینه نشده در شهرستان جفرسون را تایید کرد. این ایالت قبلاً دو مورد مرگ را در شهرستان لنکستر گزارش کرده بود که هر دو در نوزادان بودند - یک پسر تازه متولد شده و یک دختر 6 هفته‌ای که هر دو برای واکسینه شدن خیلی جوان بودند. به گفته پزشک قانونی شهرستان میفلین، آندریا ال. آلکالد، علت مرگ این جوان 18 ساله آنسفالومیلیت حاد منتشر (ADEM) بود که یک عارضه شدید نادر اما شناخته شده سرخک است. این بیماری با یک اختلال خودایمنی به سرعت در حال پیشرفت مشخص می شود که در آن التهاب نابهنجار ناشی از عفونت، پوشش محافظ سلول های عصبی در مغز و نخاع را از بین می برد. قبل از اینکه واکسن‌های سرخک به طور گسترده مورد استفاده قرار گیرند، ADEM معمولاً با سرخک مرتبط بود، اگرچه سایر عفونت‌های ویروسی نیز می‌توانند باعث توسعه آن شوند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری، اداره بهداشت ایالتی روز سه شنبه تایید کرد چهارمین نفر در پنسیلوانیا بر اثر سرخک درگذشته است. آخرین مرگ مربوط به یک جوان 18 ساله واکسینه نشده ساکن شهرستان میفلین بود. در انتشار جدیدی که روز سه شنبه در صفحه فیس بوک پزشکی قانونی منتشر شد، آلکالد گفت که تعیین مرگ پس از بررسی سوابق پزشکی و تمام اطلاعات موجود انجام شده است. آلکالد گفت که اطلاعات دیگری در مورد متوفی منتشر نخواهد"}, {"source": "Ars Technica", "title": "SpaceX declares Starship ready for orbit, sets launch date next week", "link": "https://arstechnica.com/space/2026/09/spacex-sets-launch-date-for-first-starship-orbital-flight/", "summary": "Pending regulatory approval, SpaceX said today it intends to launch its 14th Starship mission as early as September 22. This flight is notable, as it will be the first time that SpaceX attempts to launch the experimental vehicle into orbit. The company set a target liftoff time of 7:15 am local in Texas (12:15 UTC), with a 75-minute launch window. Sunrise in Brownsville, Texas, is 7:17 am CT, so the launch could make for some striking imagery. The super heavy lift rocket will be carrying 26 of the larger V3 Starlink satellites into an orbit 275 km above the Earth. In an update on its website , SpaceX said the Starship upper stage will seek to complete six orbits around the Earth before completing its mission after about 10 hours. Read full article Comments", "date_str": "2026-09-15T18:48:08+00:00", "hash": "3191c9d16b0d927b", "title_fa": "اسپیس ایکس استارشیپ را آماده مدار می کند و تاریخ پرتاب را هفته آینده تعیین می کند", "summary_fa": "در انتظار تایید مقررات، اسپیس ایکس امروز گفت که قصد دارد 14مین ماموریت Starship خود را در 22 سپتامبر به فضا بفرستد. این شرکت زمان پرتاب هدف را 7:15 صبح محلی در تگزاس (12:15 UTC) با یک پنجره پرتاب 75 دقیقه تعیین کرد. طلوع خورشید در براونزویل، تگزاس، ساعت 7:17 صبح سی تی است، بنابراین پرتاب می تواند تصاویری خیره کننده ایجاد کند. این موشک فوق سنگین 26 ماهواره V3 Starlink بزرگتر را به مداری در 275 کیلومتری بالای زمین خواهد برد. اسپیس‌ایکس در به‌روزرسانی در وب‌سایت خود گفت که استارشیپ به دنبال انجام شش چرخش به دور زمین قبل از تکمیل مأموریت پس از حدود 10 ساعت است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش در انتظار تایید نظارتی، اسپیس ایکس امروز اعلام کرد که قصد دارد چهاردهمین ماموریت Starship خود را در اوایل 22 سپتامبر به فضا بفرستد. این پرواز قابل توجه است، زیرا اولین بار است که وسیله ای آزمایشی یا آزمایشی به SpaceX پرتاب می شود. رسیدن به مدار یک نقطه عطف مهم در کمپین توسعه Starship این شرکت است که اولین پرواز آزمایشی خود را در 20 آوریل 2023 انجام داد و از آن زمان تاکنون در مسابقات و شروع به کار پیشرفت کرده است. با ماموریت آتی، SpaceX همچنان به اصلاحات در وسیله نقلیه استارشیپ ادامه می‌دهد زیرا به دنبال بهبود سومین تکرار تقویت‌کننده Super Heavy و مرحله بالایی Starship است. پس از موفقیت‌های اخیر، به نظر می‌رسد که این شرکت به توسعه یک موشک فوق سنگین با قابلیت استفاده مجدد و کاملاً قابل استفاده مجدد نزدیک‌تر است."}, {"source": "Ars Technica", "title": "Agility’s new humanoid robot will stop, squat to avoid harming human coworkers", "link": "https://arstechnica.com/ai/2026/09/agilitys-new-humanoid-robot-will-stop-squat-to-avoid-harming-human-coworkers/", "summary": "Agility Robotics has debuted its first humanoid robot engineered to work safely near humans without risking harm to flesh-and-blood coworkers. Such safety features could unlock many more opportunities to use such robots inside warehouses and automotive factories—all without requiring isolated robot work cells and physical separation barriers. When Agility’s new Digit 5 robot detects a person at a distance, it can autonomously take precautions, like moving to avoid the person or standing still so the person can pass by without getting closer. If a person is getting into close proximity with Digit 5, the robot can even choose to squat and assume a seated position. “The robot was designed with a complex safe motion system that can take a variety of different mitigations depending on exactly what sort of human presence is detected,” Pras Velagapudi , chief technology officer at Agility, told Ars. Read full article Comments", "date_str": "2026-09-15T18:33:02+00:00", "hash": "d600f403bdca2c7c", "title_fa": "ربات انسان نمای جدید Agility متوقف می شود و برای جلوگیری از آسیب رساندن به همکاران انسانی، چمباتمه می زند", "summary_fa": "Agility Robotics اولین ربات انسان نما خود را معرفی کرده است که برای کار ایمن در نزدیکی انسان بدون آسیب رساندن به همکاران گوشتی و خونی طراحی شده است. چنین ویژگی‌های ایمنی می‌تواند فرصت‌های بیشتری را برای استفاده از این ربات‌ها در انبارها و کارخانه‌های خودروسازی باز کند - همه اینها بدون نیاز به سلول‌های کاری جدا شده ربات و موانع جداسازی فیزیکی. هنگامی که ربات جدید Agility، Digit 5 ​​فردی را در فاصله دور تشخیص می دهد، می تواند به طور مستقل اقدامات احتیاطی مانند حرکت برای اجتناب از فرد یا ایستادن را انجام دهد تا فرد بتواند بدون نزدیک شدن از آنجا عبور کند. اگر فردی با رقم 5 نزدیک شود، ربات حتی می‌تواند اسکات را انتخاب کند و در حالت نشسته قرار بگیرد. پراس ولاگاپودی، مدیر ارشد فناوری در Agility، به Ars گفت: «این ربات با یک سیستم حرکت ایمن پیچیده طراحی شده است که بسته به نوع حضور انسانی که دقیقاً شناسایی می‌شود، می‌تواند انواع مختلفی از اقدامات کاهشی را انجام دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش چابکی Robotics اولین ربات انسان نما خود را طراحی کرده است که به طور ایمن در نزدیکی انسان کار می کند بدون اینکه خطری برای همکاران گوشتی و خونی داشته باشد. چنین ویژگی‌های ایمنی می‌تواند فرصت‌های بیشتری را برای استفاده از این ربات‌ها در انبارها و کارخانه‌های خودروسازی باز کند - همه اینها بدون نیاز به سلول‌های کاری جدا شده ربات و موانع جداسازی فیزیکی. طبق اطلاعیه امروز Agility، مشتریان می توانند انتظار داشته باشند که در نیمه اول سال 2027 به Digit 5 ​​دسترسی زودهنگام داشته باشند و این ربات تا پایان همان سال به طور کلی در دسترس خواهد بود."}, {"source": "Ars Technica", "title": "Boston dumps Flock, says it shared data nationwide in violation of contract", "link": "https://arstechnica.com/tech-policy/2026/09/boston-dumps-flock-says-it-shared-data-nationwide-in-violation-of-contract/", "summary": "The Boston city government abandoned Flock Safety's license-plate reader cameras after the company shared data nationwide in violation of a contract provision, according to city officials. \"We have actually abandoned Flock,\" Boston Mayor Michelle Wu said in her monthly \"Ask the Mayor\" segment on GBH News last week. Wu made the comment a few days before the release of Boston's annual surveillance technology report , which said a Flock \"vendor error\" resulted in nationwide data sharing. The report, which covers 2025, describes how the Boston Police Department deployed about 45 Automated License Plate Reader (ALPR) cameras in a trial with Flock from April to September last year. The unauthorized data sharing occurred during the first few days of the pilot, the report said: Read full article Comments", "date_str": "2026-09-15T18:14:11+00:00", "hash": "cfd2eb8de9b9db8e", "title_fa": "بوستون Flock را تخلیه می‌کند، می‌گوید که داده‌های خود را در سراسر کشور با نقض قرارداد به اشتراک گذاشته است", "summary_fa": "به گفته مقامات شهر، دولت شهر بوستون دوربین‌های پلاک‌خوان Flock Safety را پس از به اشتراک گذاشتن داده‌های این شرکت در سراسر کشور بر خلاف مفاد قرارداد، کنار گذاشت. میشل وو، شهردار بوستون، هفته گذشته در بخش ماهانه خود با عنوان \"از شهردار بپرس\" در GBH News گفت: \"ما در واقع Flock را رها کرده ایم.\" وو این اظهار نظر را چند روز قبل از انتشار گزارش سالانه فناوری نظارت بوستون بیان کرد که گفت یک \"خطای فروشنده\" گله منجر به اشتراک گذاری داده ها در سراسر کشور شده است. این گزارش که سال 2025 را پوشش می‌دهد، توضیح می‌دهد که چگونه اداره پلیس بوستون حدود 45 دوربین خودکار پلاک‌خوان (ALPR) را در آزمایشی با Flock از آوریل تا سپتامبر سال گذشته مستقر کرد. در این گزارش آمده است که اشتراک‌گذاری غیرمجاز داده در چند روز اول آزمایشی رخ داده است: مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. میشل وو، شهردار بوستون، هفته گذشته در بخش ماهانه خود با عنوان \"از شهردار بپرس\" در GBH News گفت: \"ما در واقع Flock را رها کرده ایم.\" وو این اظهار نظر را چند روز قبل از انتشار گزارش سالانه فناوری نظارت بوستون بیان کرد که گفت یک \"خطای فروشنده\" گله منجر به اشتراک گذاری داده ها در سراسر کشور شده است. بر اساس این قرارداد، برنامه آزمایشی Flock ALPR برای محدود کردن دسترسی به داده های جمع آوری شده توسط دوربین های BPD ALPR منحصراً برای پرسنل آموزش دیده BPD طراحی شده است. در قرارداد به وضوح اشاره شد که اشتراک‌گذاری داده‌ها غیرفعال می‌شد و BPD با Flock تأیید کرد که تنظیمات برای اشتراک‌گذاری «خاموش» هستند. ظرف سه روز پس از شروع پایلوت، BPD متوجه شد که سایر سازمان‌های مجری قانون می‌توانند به اطلاعات"}, {"source": "Ars Technica", "title": "Demand for EV chargers is outstripping supply, says ChargePoint report", "link": "https://arstechnica.com/cars/2026/09/ev-charging-infrastructure-is-still-lagging-adoption-report-says/", "summary": "There might not be the same degree of optimism regarding electric vehicle adoption as a few short years ago, but the transition toward battery-electric vehicles continues nevertheless. More than 1.8 million EVs had already been sold between the start of this year and the end of August, according to analysts. And in the US, there has been a large uptick in drivers considering EVs that they might have written off last year, due to escalating fuel prices with no clear end in sight. Despite this, charging infrastructure continues to lag, according to a new report from ChargePoint. “All in all, things are moving forward. I think the North American market has been better shaped than a lot of the press reports,” said ChargePoint CEO Rick Wilmer. “Part of it is just the data we see in terms of the amount of RFPs that we receive for charging solutions. They haven't slowed down. We reported quarter over quarter growth in the last quarter we reported. And you look at the data around used EVs going up in price because the demand is so high. I saw a recent report … EV retention rates are 96 percent. So those folks that are putting their leased cars on the used market, they're not going back to gas, they're going to another EV,” he said. Beyond that, cheap electric trucks from Slate and Ford indicate further future demand for charging. “When you look at how much interest there is in the used EVs that are at parity with an equivalent gas vehicle, that tells you the appetite is there for EVs if it's the right vehicle at the right price point,\" Wilmer said. \"So I think the auto OEMs, maybe not homogeneously, but they're figuring out what the market wants in North America, and they're starting to introduce those vehicles, which I don't think a lot of the forward-looking forecasts accommodate the fact that the product market fit is getting better coming out of the car companies.” Read full article Comments", "date_str": "2026-09-15T17:58:09+00:00", "hash": "0d5d47b2f6e0ffe9", "title_fa": "طبق گزارش ChargePoint، تقاضا برای شارژرهای EV از عرضه پیشی گرفته است", "summary_fa": "ممکن است در مورد استفاده از خودروهای الکتریکی مانند چند سال پیش خوش‌بینی وجود نداشته باشد، اما انتقال به سمت خودروهای برقی با باتری همچنان ادامه دارد. به گفته تحلیلگران، بیش از 1.8 میلیون خودروی الکتریکی از ابتدای سال جاری تا پایان آگوست فروخته شده است. و در ایالات متحده، افزایش زیادی در رانندگانی که خودروهای برقی را در نظر می‌گیرند، وجود داشته است که ممکن است در سال گذشته آن‌ها را حذف کرده باشند، به دلیل افزایش قیمت سوخت و بدون پایان مشخص. با وجود این، طبق گزارش جدید ChargePoint، زیرساخت شارژ همچنان عقب مانده است. ریک ویلمر، مدیر عامل ChargePoint گفت: \"در مجموع، همه چیز رو به جلو است. من فکر می کنم بازار آمریکای شمالی بهتر از بسیاری از گزارش های مطبوعاتی شکل گرفته است.\" \"بخشی از آن فقط داده‌هایی است که ما از نظر مقدار RFPهایی که برای راه‌حل‌های شارژ دریافت می‌کنیم می‌بینیم. سرعت آنها کاهش نیافته است. ما در سه ماهه گذشته رشد سه ماهه را گزارش کردیم. و شما به داده‌های پیرامون خودروهای برقی مستعمل نگاه می‌کنید که قیمت آن‌ها افزایش می‌یابد زیرا تقاضا بسیار بالاست. من یک گزارش اخیر را دیدم ... نرخ نگهداری EV 96 درصد است. بنابراین، افرادی که خودروهای اجاره‌ای خود را در بازار کارکرده عرضه می‌کنند، به بنزین برنمی‌گردند، بلکه به یک خودروی برقی دیگر می‌روند.» فراتر از آن، کامیون‌های برقی ارزان‌قیمت از Slate و Ford نشان‌دهنده تقاضای بیشتر در آینده برای شارژ هستند. ویلمر می‌گوید: «وقتی به خودروهای برقی مستعملی که با خودروهای گازسوز همتراز هستند، توجه می‌کنید، به شما می‌گوید که اگر خودروی برقی مناسب با قیمت مناسب باشد، اشتها برای خودروهای الکتریکی وجود دارد. بنابراین من فکر می‌کنم OEM‌های خودرو، شاید به طور همگن نباشند، اما آنها در حال کشف آنچه بازار در آمریکای شمالی می‌خواهد، شروع کرده‌اند و شروع به معرفی آن خودروها کرده‌اند، که"}, {"source": "Ars Technica", "title": "Trump EPA moves to wipe out climate rules for power plants", "link": "https://arstechnica.com/science/2026/09/epa-seeks-to-eliminate-remaining-greenhouse-gas-rules-for-power-plants/", "summary": "On the heels of the hottest summer on record and a United Nations report warning that global temperatures are likely to push climate risks to “increasingly dangerous heights,” the Trump administration overturned most of a Biden-era rule limiting climate pollution from power plants, the second-largest source of greenhouse gas emissions. The Environmental Protection Agency announced a final plan Monday that guts the 2024 Carbon Pollution Standards, which the agency said exceeds its authority under the Clean Air Act by requiring control technologies “that are not adequately demonstrated.” The agency also proposed revoking “all remaining GHG emissions requirements for power plants,” arguing their emissions “have no material impact on climate change.” The plan to revoke the Carbon Pollution Standards was initially revealed last spring . Read full article Comments", "date_str": "2026-09-15T13:43:51+00:00", "hash": "ca0bc2aca448c0b2", "title_fa": "EPA ترامپ برای حذف قوانین آب و هوایی برای نیروگاه ها اقدام می کند", "summary_fa": "در پاشنه گرمترین تابستان ثبت شده و گزارش سازمان ملل متحد که هشدار داده بود دمای جهانی احتمالاً خطرات آب و هوایی را به «ارتفاعات خطرناک فزاینده‌ای» سوق می‌دهد، دولت ترامپ اکثر قانون دوران بایدن را مبنی بر محدود کردن آلودگی آب و هوا از نیروگاه‌ها، دومین منبع بزرگ انتشار گازهای گلخانه‌ای، لغو کرد. آژانس حفاظت از محیط زیست روز دوشنبه یک طرح نهایی را اعلام کرد که استانداردهای آلودگی کربن 2024 را که به گفته آژانس از اختیارات آن تحت قانون هوای پاک فراتر می رود، با الزام فناوری های کنترلی \"که به اندازه کافی نشان داده نشده اند\" را تایید می کند. این آژانس همچنین با این استدلال که انتشار گازهای گلخانه‌ای آنها «هیچ تأثیر مادی بر تغییرات آب و هوا ندارد»، «همه الزامات باقی‌مانده انتشار گازهای گلخانه‌ای برای نیروگاه‌ها» را لغو کرد. طرح لغو استانداردهای آلودگی کربن ابتدا در بهار گذشته فاش شد. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید در پاشنه گرمترین تابستان ثبت شده و گزارش سازمان ملل که هشدار می دهد دمای جهانی احتمالاً خطرات آب و هوا را به «ارتفاعات خطرناک فزاینده» سوق می دهد، دولت ترامپ قانون نیروگاه Bipol را محدود کرد. دومین منبع بزرگ انتشار گازهای گلخانه ای در سال 2007، دادگاه عالی حکم داد که تعریف قانون هوای پاک از آلاینده‌های هوا شامل گازهای گلخانه‌ای است که باعث تغییرات آب و هوایی می‌شوند و اگر EPA به این نتیجه برسد که گازهای گلخانه‌ای برای سلامت انسان و محیط‌زیست خطرناک هستند، باید برای کاهش این انتشارات اقدام کند. EPA در سال 2009 \"یافت خطر\" را انجام داد."}, {"source": "Ars Technica", "title": "GM gives its most important trucks a new UI—and includes CarPlay", "link": "https://arstechnica.com/cars/2026/09/gm-gives-its-most-important-trucks-a-new-ui-and-includes-carplay/", "summary": "General Motors is about to launch new versions of its bestselling Chevrolet Silverado and GMC Sierra pickup trucks for model year 2027, and among the changes are new user interfaces for the trucks’ digital displays. The automaker has gone for a more minimalist approach than we’ve seen from it in the past, and after a demo yesterday, it seems like it has been listening to constructive feedback to improve the products. And yes, unlike GM’s electric vehicles, these trucks still let you cast your Apple or Android phone to the infotainment system. Although GM showed us video of the main instrument cluster—the gauges and info that’s presented to the driver—we don’t have any screenshots we can show you. But I was impressed with the restraint and lack of visual noise; instead, the background is always black, which should be dark even at night thanks to local dimming technology. There are a number of different views. One with simple half-moon dials for speed and engine rpm; on the right side of the display is a user-configurable zone, where you can browse your music or audio feeds, display trip info, or turn-by-turn directions. Another is a driver assist display, with green as the highlight color to show when Super Cruise is active; this shows you a representation of what the car’s fused sensors are seeing around it. A third is for off-road driving, with your various angles and diff settings, and a fourth is for towing. Read full article Comments", "date_str": "2026-09-15T13:27:57+00:00", "hash": "269fc4cf02ca64ef", "title_fa": "جنرال موتورز به مهم‌ترین کامیون‌های خود یک رابط کاربری جدید می‌دهد و شامل CarPlay می‌شود", "summary_fa": "جنرال موتورز قصد دارد نسخه‌های جدیدی از پرفروش‌ترین وانت‌های شورولت سیلورادو و جی‌ام‌سی سیرا را برای مدل سال 2027 عرضه کند و در میان تغییرات، رابط‌های کاربری جدید برای نمایشگرهای دیجیتال کامیون‌ها وجود دارد. این خودروساز رویکرد مینیمالیستی تری نسبت به آنچه در گذشته از آن دیده بودیم اتخاذ کرده است و پس از نمایش دیروز، به نظر می رسد که به بازخوردهای سازنده برای بهبود محصولات گوش داده است. و بله، برخلاف خودروهای برقی جنرال موتورز، این کامیون‌ها همچنان به شما امکان می‌دهند گوشی اپل یا اندروید خود را به سیستم اطلاعات سرگرمی ارسال کنید. اگرچه جنرال موتورز ویدئویی از دسته ابزار اصلی به ما نشان داد - سنج ها و اطلاعاتی که به راننده ارائه می شود - ما هیچ تصویری نداریم که بتوانیم به شما نشان دهیم. اما من تحت تأثیر محدودیت و عدم وجود نویز بصری قرار گرفتم. در عوض، پس‌زمینه همیشه سیاه است، که به لطف فناوری کم‌نور محلی، حتی در شب نیز باید تاریک باشد. چند دی ر فرد جدی به آن اهمیت می دهد، به اندازه کافی منصفانه است. اما Particle 6 اخیراً در ایمیلی ادعا کرد که نوروود \"کاملاً برای هر چیزی آماده است!\" علاوه بر این، این شرکت به روزنامه‌نگاران اجازه می‌دهد بدون کنترلر به مدل دسترسی داشته باشند تا «مکالمه را در مسیر خود نگه دارند». بنابراین تصمیم گرفتم آزمایش کنم که آیا نوروود واقعاً می‌تواند چیزی را ارائه دهد. به صراحت بگویم: نه. نوروود نه تنها از پرداختن به موضوعات موضوعی که بسیاری از بزرگ‌ترین نام‌های سرگرمی مدام در مورد آن صحبت می‌کنند، خودداری می‌کند، بلکه تلاش می‌کند برای فیلم آینده‌اش پیش‌بینی کند و وجود خود را به‌عنوان یک محصول توجیه نمی‌کند (علی‌رغم اینکه در یک نقطه بحث می‌کند که فیلم‌های تولید شده توسط هوش مصنوعی برای محیط‌زیست خوب هستند.) وقتی می‌پرسم تولید در پروژه‌ای با نام Misaligned چگونه پیش می‌رود، شخصیت اصلی، آواتار چشم مرده نمی‌تواند تاریخ تقریبی انتشار را در اختیار من"}, {"source": "Wired", "title": "The FBI Doubles Down on Easing ‘Bestiality’ Hiring Standards", "link": "https://www.wired.com/story/the-fbi-doubles-down-on-easing-bestiality-hiring-standards/", "summary": "FBI director Kash Patel claimed to US senators that the removal of a bar on hiring people who had engaged in bestiality was aimed at protecting sexual assault survivors.", "date_str": "2026-09-15T17:50:40+00:00", "hash": "5874bfd2d7384ef0", "title_fa": "اف‌بی‌آی استانداردهای استخدام «حیوان‌گرایی» را دو چندان می‌کند", "summary_fa": "کاش پاتل، رئیس اف بی آی، به سناتورهای آمریکایی ادعا کرد که حذف منع استخدام افرادی که دست به دامداری می زدند، با هدف حفاظت از بازماندگان تجاوز جنسی بود. Loader Save Story ذخیره این داستان Comment Loader Save Story Save this story کش پاتل، مدیر دفتر تحقیقات فدرال، روز سه شنبه به اعضای سردرگم کمیته قضایی سنا گفت که استانداردهای جدید استخدام FBI با هدف محافظت از \"قربانیان حیوانات حیوانی\" است. قبل از دولت فعلی، سیاست FBI این بود که متقاضیانی را که از جمله، کارگران جنسی را استخدام کرده بودند، از یک کارفرما دزدیده بودند، یا درگیر حیوانات وحشی بودند، منع می کرد. در ماه آگوست، CBS News گزارش داد که این استانداردها کاه oup in Washington", "link": "https://thenextweb.com/news/amazon-netflix-youtube-streaming-access-choice-alliance-technet", "summary": "Amazon, Netflix, and YouTube have formed a new policy coalition to lobby Washington on behalf of streaming services, including on live sports. The Streaming Access and Choice Alliance (SACA) launched on 14 September, with the three companies as founding members. TechNet, a trade group that represents large technology companies, leads the coalition. Axios first reported [ ] This story continues at The Next Web", "date_str": "2026-09-15T17:09:38+00:00", "hash": "ad016345f4c36eee", "title_fa": "آمازون، نتفلیکس و یوتیوب یک گروه لابی استریم در واشنگتن راه اندازی کردند", "summary_fa": "آمازون، نتفلیکس و یوتیوب ائتلاف سیاست جدیدی را برای لابی کردن واشنگتن به نمایندگی از سرویس‌های پخش، از جمله ورزش‌های زنده، تشکیل داده‌اند. اتحاد دسترسی و انتخاب جریان (SACA) در 14 سپتامبر با سه شرکت به عنوان اعضای موسس راه اندازی شد. TechNet، یک گروه تجاری که نماینده شرکت های بزرگ فناوری است، رهبری ائتلاف را بر عهده دارد. Axios برای اولین بار گزارش داد [ ] این داستان در The Next Web ادامه دارد. به گفته TechNet، SACA برای «خط‌مشی‌های خنثی فناوری» که به سرویس‌های پخش اجازه می‌دهد در انواع برنامه‌نویسی، از جمله ورزش‌های زنده سرمایه‌گذاری کنند، فشار خواهد آورد. همچنین از دسترسی بیشتر مصرف کننده به محتوا و انتخاب مصرف کننده حمایت می کند. مایک وارد، معاون ارشد سیاست فدرال و روابط دولتی TechNet، این گروه را رهبری خواهد کرد. او در این اطلاعیه گفت: \"آمریکایی ها خواهان انتخاب بیشتر محتوا و انعطاف پذیری در نحوه و مکان تماشای برنامه های مورد علاقه خود، از جمله ورزش و سایر رویدادهای زنده هستند. شرکت های پخش جریانی و سرگرمی های دیجیتال، ویژگی های بهتری را به مخاطبان ارائه می دهند و ارزش پول خود را دارند. صنعت و مشتریان آن سزاوار یک صدای اختصاصی در واشنگتن دی سی هستند که از سیاست هایی حمایت می کند که نوآوری را ممکن می کند و نیازهای مصرف کنندگان امروزی را برطرف می کند. وب سایت ائتلاف چهار موضع سیاسی را فهرست کرده است. SACA می‌گوید پشتیبانی می‌کند: این وب‌سایت می‌گوید 99 در  بازاری، خودش یک محرک نوسان است. مهم‌ترین وعده‌ی CLARITY روشن‌کردن مرز میان دارایی‌های دیجیتال"}, {"source": "Zoomit", "title": "پایان عصر مریخ‌نوردها؟‌ ناسا اکنون برای کاوش مریخ به‌طور کامل بر هلی‌کوپترها تمرکز دارد", "link": "https://www.zoomit.ir/space/466985-nasa-mars-exploration-skyfall-helicopters/", "summary": "ناسا برای کاوش سیاره سرخ، مریخ‌نوردهای گران‌قیمت را کنار گذاشته و استراتژی جدید خود را بر خرید خدمات تجاری و پهپادهای ارزان متمرکز کرده است.", "date_str": "2026-09-15T19:00:00+00:00", "hash": "cd462c01d71f281f", "title_fa": "پایان عصر مریخ‌نوردها؟‌ ناسا اکنون برای کاوش مریخ به‌طور کامل بر هلی‌کوپترها تمرکز دارد", "summary_fa": "ناسا برای کاوش سیاره سرخ، مریخ‌نوردهای گران‌قیمت را کنار گذاشته و استراتژی جدید خود را بر خرید خدمات تجاری و پهپادهای ارزان متمرکز کرده است. تبلیغات برای نخستین بار در بیش از ۳۰ سال گذشته، ناسا هیچ برنامه‌ی قطعی برای ارسال سطح‌نشین یا سطح‌نورد جدید به مریخ ندارد. در عوض، تمرکز کوتاه‌مدت این سازمان در سیاره سرخ به کاوشگران پرنده معطوف شده است؛ روشی پیشگامانه برای اکتشافات فضایی که تا همین چند سال پیش چندان واقع‌بینانه به نظر نمی‌رسید. نخستین استفاده واقعی از پهپادها برای انجام تحقیقات علمی در مریخ با مأموریت «اسکای‌فال» رقم خواهد خورد؛ ناوگانی متشکل از سه هلی‌کوپتر که قرار است تا اواخر سال ۲۰۲۸ پرتاب شوند. هلی‌کوپترهای اسکای‌فال همراه با رآکتور فضایی «فریدوم» (SR-1 Freedom) به سیاره سرخ خواهند رفت؛ مأموریتی که هدف اصلی‌اش آزمایش پیشرانش هسته‌ای-الکتریکی در فضای ژرف است. پروژه پرتاب اسکای‌فال و فریدوم بسیار فشرده است؛ به‌طوری که تا همین ۶ ماه پیش جزو برنامه‌های ناسا نبودند. هزینه مأموریت فریدوم حدود ۲٫۱ میلیارد دلار برآورد شده و ناسا قصد دارد ماژول اصلی ایستگاه فضایی لغوشده گیت‌وی در مدار ماه را به سکوی آزمایشی برای پیشرانش هسته‌ای-الکتریکی تبدیل کند. اسکای‌فال نیز بر موفقیت ناسا در ساخت هلی‌کوپتر اینجنیوتی تکیه خواهد کرد؛ وسیله‌ای آزمایشی که در سال ۲۰۲۱ به نخستین هواگردی تبدیل شد که روی دنیایی دیگر پرواز کرده است. کپی لینک ناوگان هلی‌کوپترهای پیشرفته آزمایشگاه پیشرانش جت ناسا (JPL) برای طراحی و ساخت سه هلی‌کوپتر اسکای‌فال و یک نم جه‌ی فعلی، دست‌کم روی کاغذ، با همین ادعاها هم‌خوانی دارد و در برخی بخش‌ها حتی از آن‌ها فراتر می‌رود. اگر امتیاز چند‌هسته‌ای ثبت‌شده مبنا قرار بگیرد، M5 Ultra در صدر جدول تراشه‌های اپل می‌ایستد و فاصله‌ای قابل‌توجه با نسل‌های قبلی ایجاد می‌کند. جایگاه تقریبی آن در میان تراشه‌های اپل چنین دیده می‌شود: بر همین اساس، M5 Ultra تا حدود ۲٫۲۵ برابر سریع‌تر از M1 Ultra و تا ۶ برابر سریع‌تر از M1 معمولی ارزیابی می‌شود. با وجود چنین فاصله‌ای، تصویر کامل هنوز شکل نگرفته، چون بنچمارک گرافیکی M5 Ultra هنوز در دیتابیس گیک‌بنچ ۷ دیده نشده است."}, {"source": "Zoomit", "title": "لباسشویی جدید شیائومی با سه مخزن و ظرفیت ۱۴ کیلوگرم رونمایی شد", "link": "https://www.zoomit.ir/appliances/467196-xiaomi-mijia-triple-drum-washing-machine/", "summary": "شیائومی ماشین لباسشویی جدید میجیا را با سه مخزن مجزا، ظرفیت ۱۴ کیلوگرم و سیستم هوش مصنوعی رونمایی کرد.", "date_str": "2026-09-15T18:45:00+00:00", "hash": "5501d42bbb4d51f5", "title_fa": "لباسشویی جدید شیائومی با سه مخزن و ظرفیت ۱۴ کیلوگرم رونمایی شد", "summary_fa": "شیائومی ماشین لباسشویی جدید میجیا را با سه مخزن مجزا، ظرفیت ۱۴ کیلوگرم و سیستم هوش مصنوعی رونمایی کرد. تبلیغات شیائومی پیش‌فروش سری جدید ماشین لباسشویی Mijia Triple-Tube 14kg را در بازار چین آغاز کرد . محصول جدید در دو نسخه‌ی «شست‌وشو و خشک‌کن هم‌زمان» و «فقط شست‌وشو» به بازار عرضه می‌شود و ظرفیت کلی ۱۴ کیلوگرمی را در قالب سه دیگ مجزا در اختیار کاربران قرار می‌دهد. مخزن اصلی دستگاه ظرفیت ۱۱ کیلوگرمی دارد و دو مخزن کوچک‌تر جانبی هرکدام توان شست‌وشوی ۱٫۵ کیلوگرم لباس را دارند. در مدل دارای خشک‌کن، ظرفیت کلی خشک‌کن ۹ کیلوگرم است که ۷ کیلوگرم به دیگ اصلی و یک کیلوگرم به هر یک از دیگ‌های جانبی اختصاص می‌یابد. شیائومی با حفظ ابعاد فشرده، اندازه‌ی دستگاه را نزدیک به مدل‌های باریک ۱۰ کیلوگرمی نگه داشته تا درون کابینت‌های استاندارد توکار جای بگیرد. هر دیگ دارای ورودی آب مستقل است و امکان کارکرد جداگانه دارد. کاربران می‌توانند چرخه‌ی کامل شست‌وشو و خشک‌کردن دیگ اصلی را هم‌زمان با کارکرد دیگ‌های کوچک‌تر اجرا کنند یا برای بارهای کم‌حجم تنها یکی از مخزن‌ها را به کار بگیرند. قطر مخزن‌های کوچک‌ت
