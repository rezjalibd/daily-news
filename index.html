m", "link": "https://pitchfork.com/story/quavo-announces-pharrell-williams-produced-album-qromelife/", "summary": "The long-teased Qrömelife now has a release date", "date_str": "2026-09-11T18:06:20+00:00", "hash": "560592ea4323bcf4", "title_fa": "Quavo آلبوم تولید شده توسط فارل ویلیامز را اعلام کرد", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان ما ماه هاست که به لطف دو تک آهنگ منتشر شده قبلی و یک جریان ثابت از کلیپ های ضبط رپر Migos در قایق بادبانی با فارل، در مورد آلبوم استودیویی بعدی Quavo می شنویم. اکنون می دانیم که کی کامل می رسد. Qrömelife که توسط یکی از بنیانگذاران Neptunes تهیه شده است، در تاریخ 2 اکتبر در Quality Control/Motown منتشر می شود. این خبر همراه با سومین پیش نمایش LP، \"Backwards\" با T.I است که می توانید در زیر گوش دهید. علاوه بر Qrömelife، Quavo اخیراً آخرین آلبوم Migos را پس از مرگ Takeoff در سال 2022 تیز کرد. تاریخ انتشار هنوز اعلام نشده است. مروری بر آخرین تلاش انفرادی Quavo، Rocket Power 2023 ما را دوباره مرور کنید."}, {"source": "Pitchfork", "title": "Brent Hinds Estate Sues Mastodon", "link": "https://pitchfork.com/story/brent-hinds-estate-sues-mastodon/", "summary": "The estate disputes whether an $80,000 check from the band covers Hinds’ share in Mastodon’s interests", "date_str": "2026-09-11T18:04:57+00:00", "hash": "b7506573cfac6453", "title_fa": "املاک برنت هیندز از ماستودون شکایت می کند", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان، بنا به گزارش The Atlanta Jounal-Constitution، دارایی برنت هیندز فقید از ماستودون به دلیل پرداخت غرامت بسیار ناچیز برای شباهت خواننده و سهم او از شرکت های گروه شکایت کرده است. املاک Hinds ادعا می کند که چکی به مبلغ 80000 دلار از گروه دریافت کرده است که ظاهراً نشان دهنده مجموع منافع خواننده-گیتاریست است. طبق دادخواست، املاک از نقد کردن چک خودداری کرده است، زیرا این رقم توسط محاسبات تأیید نشده است. ماستودون در بیانیه ای اتهامات سوء نیت را به شدت رد کرد و گفت که گروه \"به شدت از خود\" در برابر طرح \"بی ارزش\" دفاع خواهد کرد. ما قصد نداریم در این مورد به طور علنی صحبت کنیم، زیرا احساس می کنیم این امر به یاد برنت یا میراث هدایای موسیقی او احترام نمی گذارد. این شکایت که هفته گذشته در دادگاه شهرستان فولتون ثبت شد، پس از انتشار ماه گذشته مارو دیپ، اولین آلبوم گروه متال آتلانتا از زمان مرگ هیندز در یک تصادف موتورسیکلت در تابستان گذشته صورت گرفت. این رکورد که هم به هیندس و هم به مادر فقید بران دیلور درامر اختصاص داده شده است، دارای جلدی است که سه چهره بر اساس سرنوشت اساطیر یونان را به تصویر می کشد. یک پیکر دارای نیم تنه ای است که از جمجمه ساخته شده است که یکی از آنها شبیه هندز است. املاک استدلال می‌کند که گروه «این جلد را برای تبلیغ، بازاریابی، توزیع و فروش» موسیقی و کالاهای خود منتشر کرد. اساس اختلافات هندز و جدایی گروه در مارس 2025، پنج ماه قبل از مرگ او است. پیام های صمیمانه بقیه اعضای گروه (\"ما برای او چیزی جز موفقیت و خوشبختی آرزو نمی کنیم\") با انتشار نارضایتی های هندز در رسانه های اجتماعی در تضاد بود، در اظهارنظرهای خصمانه"}, {"source": "Pitchfork", "title": "Dolly Parton Is Getting Her Own Airport", "link": "https://pitchfork.com/story/dolly-parton-is-getting-her-own-airport/", "summary": "Nashville International Airport is being renamed in honor of the late country icon", "date_str": "2026-09-11T17:50:03+00:00", "hash": "4f672d0ecb015f03", "title_fa": "دالی پارتون در حال گرفتن فرودگاه خودش است", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان فرودگاه بین المللی نشویل به افتخار مرحوم دالی پارتون تغییر نام داده است، کانال 5 خبری شهر گزارش می دهد. بیل لی فرماندار تنسی اواخر ماه گذشته اعلام رسمی کرد و اکنون هیئت مدیره فرودگاه شهر به اتفاق آرا به تغییر نام رای داده است. این نقطه اوج کمپینی است که پیش از درگذشت اخیر پارتون در سن 80 سالگی در جریان بود. نام فرودگاه جدید هنوز اعلام نشده است. برای انجام این تغییر، ظاهراً اداره فرودگاه نشویل مجبور شد یک خط‌مشی واقعی را به‌روزرسانی کند که می‌گوید یک نفر باید دو سال قبل از اینکه فرودگاهی به نام آن‌ها نامگذاری شود، مرده باشد. (چه کسی می دانست!) نشویل اینترنشنال کد سه حرفی خود، BNA را که از یکی از سازندگان اصلی فرودگاه، سرهنگ هری اس. بری می آید، حفظ خواهد کرد. هفته آینده، پارتون همچنین یک افتخار پس از مرگ از اتاق بازرگانی منطقه نشویل دریافت خواهد کرد. نقد آهنگ شنبه لیلی گلدبرگ از دالی پارتون \"من همیشه تو را دوست خواهم داشت\" را بخوانید."}, {"source": "Pitchfork", "title": "Charli XCX Announces 2027 European Tour Dates", "link": "https://pitchfork.com/story/charli-xcx-2027-europe-tour-dates-music-fashion-film/", "summary": "Music, Fashion, Film gets a six-date run next February", "date_str": "2026-09-11T15:47:47+00:00", "hash": "e75a6e67776bf9da", "title_fa": "Charli XCX تاریخ تور اروپا 2027 را اعلام کرد", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان چارلی XCX راه اندازی تور موسیقی، مد و فیلم امشب را با تورهای بیشتر جشن می گیرد. او پس از دوره کنونی خود در آمریکای شمالی، در ماه فوریه برای سفری شش روزه در اروپا با اجراهایی در دوبلین، گلاسکو، منچستر، لندن، آمستردام و پاریس به خارج از کشور خواهد رفت. آدری هوبرت افتتاح خواهد شد. توقف‌های تازه اضافه‌شده را می‌توانید در زیر به صورت پررنگ پیدا کنید. برای کسانی که نمی‌دانند چرا تاریخ‌های بیشتری برای این اجرا وجود ندارد، چارلی در مصاحبه آگوست ما به Shaad D’Souza گفت که چرا رویکرد کوتاه‌تری را ترجیح می‌دهد. او گفت: \"من همیشه برای افرادی که برای مدت طولانی به تور می روند، چنین تحسین می کنم.\" «استقامتی که لازم است چیزی نیست که من به آن اهمیت بدهم. و یکنواختی- انجام دادن یک کار مکرر برای من به اندازه کافی زنده نیست.» Charli XCX: 09-11 Philadelphia, PA - Xfinity Mobile Arena ^ 09-14 Brooklyn, NY - Barclays Center ^ 09-15 Brooklyn, NY - Barclays Center ^ 09-21 Toronto, Ontario - Scotiabank Arena ^ BoD9, 09- واشنگتن دی سی - Capital One Arena ^ 10-02 Austin, TX - Austin City Limits Music Festival ^ 10-06 Atlanta, GA - State Farm Arena ^ 10-09 Austin, TX - Austin City Limits Music Festival ^ 10-14 San Diego, CA - CA-Anges, CA - CA - Vie Kia Forum ^ 10-18 Los Angeles, CA - The Kia Forum ^ 10-21 Glendale, AZ - Desert Diamond Arena ^ 10-23 Las Vegas, NV - MGM Grand Garden Arena ^ 02-13 Dublin, Ireland - 3 Arena* Glendale 02-17 O. منچستر، انگلستان - Co-Op Live* 02-19 لندن، انگلستان - The O2* 02-22 آمستردام، هلند - Ziggo Dome* 02-24 پاریس، فرانسه - Accor Arena*"}, {"source": "Pitchfork", "title": "10 New Albums You Should Listen to Now: This Is Lorelei, Alex G, and More", "link": "https://pitchfork.com/story/10-new-albums-you-should-listen-to-now-this-is-lorelei-alex-g-and-more/", "summary": "Stream new releases from This Is Lorelei, Alex G, Haruomi Hosono, and Sylvan Esso", "date_str": "2026-09-11T14:43:19+00:00", "hash": "e9206aae69d9ef8a", "title_fa": "10 آلبوم جدیدی که اکنون باید به آنها گوش دهید: This Is Lorelei، Alex G و بیشتر", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان با توجه به اینکه موسیقی بسیار خوبی که دائماً منتشر می شود، تعیین اینکه ابتدا به چه چیزی گوش دهید دشوار است. هر هفته، Pitchfork مجموعه‌ای از کاهش‌های قابل توجه جدید را در سرویس‌های پخش ارائه می‌کند. گروه این هفته شامل آلبوم‌های جدیدی از This Is Lorelei، Alex G، Haruomi Hosono و غیره است. برای دریافت توصیه های ما هر هفته در صندوق پستی خود، در خبرنامه جمعه موسیقی جدید Pitchfork مشترک شوید. (همه نسخه‌های ارائه‌شده در اینجا به‌طور مستقل توسط ویراستاران ما انتخاب می‌شوند. با این حال، وقتی چیزی را از طریق پیوندهای وابسته ما خریداری می‌کنید، Pitchfork یک کمیسیون وابسته به دست می‌آورد.) اگر با This is Lorelei و Water from Your Eyes ’ Nate Amos به عنوان تهیه‌کننده آشنا هستید، نگران نباشید – برای سال‌ها او نیز همینطور بود. او اخیراً به Fader گفت: «من به نوعی به این ترانه‌سرا به عقب‌ترین حالت رسیدم. بدون در نظر گرفتن اینکه چگونه او به اینجا رسید، خواننده در گروه من، آموس را که از نظر تاریخی تند و تیز بود، به عنوان یک بارد ماهر با مهارت و مهارت در ارزیابی جدی تثبیت می کند. پدرش حتی یک بانجو انفرادی دارد. خواننده در گروه من که پر از شخصیت‌های پیکارسک و مشایی است که در داخل و خارج از قاب قرار می‌گیرند، نگاه دقیقی به برکت‌های واقعی و معنوی دارد که پس از سفرهای کافی به دور خورشید جمع‌آوری می‌کنید. اما جالب‌ترین چهره‌ای که در اینجا به نمایش گذاشته می‌شود، خود آموس است که مطمئناً پا به ناشناخته گذاشته است. در Apple Music گوش دادن در Spotify گوش دادن در Tidal Listen در آمازون موسیقی گوش دادن/خرید در Bandcamp خرید در Rough Trade روش‌های بی‌شماری که بشر برای مدیریت درد ایجاد کرده است می‌تواند به آسانی"}, {"source": "Rolling Stone", "title": "How the World Learned to Embrace Tupac Shakur", "link": "https://www.rollingstone.com/music/music-features/tupac-shakur-death-30-years-later-1235625052/", "summary": "Three decades after his death, he remains a magnetic presence in absentia — perhaps more than ever", "date_str": "2026-09-12T14:00:00+00:00", "hash": "2de0eb6463b69e3f", "title_fa": "چگونه جهان یاد گرفت که توپاک شکور را در آغوش بگیرد", "summary_fa": "هنگامی که توپاک شکور در شب 7 سپتامبر 1996 در لاس وگاس در حالی که در کنار مدیر عامل Death Row، ماریون سوج نایت سوار می شد، مورد اصابت گلوله مهاجمان قرار گرفت و شش روز بعد کشته شد، واکنش جمعی از رسانه ها بین نگرانی پدرانه و تمسخر آشکار در نوسان بود. چیزی که دور می‌زند مقاله‌ای در مجله تایم منتشر کرد. Blood on the Record Biz، تیتر مشابهی را در نیوزویک بخوانید. مجله People نام آن را Living Dangerously گذاشته است. شاید ناخوشایندترین، روزنامه محافظه کار The American Spectator شکور را به عنوان یک Bozo in the Hood خلاصه کرد. همانطور که کارشناسان اخلاقی می‌دانند، عکس‌های یک نقاشی دیواری در نیویورک که توسط آندره پی چارلز کشیده شده بود، با عنوان Live by the Gun، Die by the Gun برای ماه‌ها در رسانه‌ها سوسو می‌زد. سه دهه از مرگ شکور در سن غم انگیز 25 سالگی می گذرد. ​​با این حال، علیرغم اینکه بیشتر از زندگی کوتاه و پرتلاطم خود مرده است، او غایب حضور مغناطیسی دارد. این موضوع زمانی مشخص شد که محاکمه و محکومیت دوئن کفه دی دیویس به‌خاطر سازمان‌دهی قتل شکور، بحث بین‌المللی درباره میراث او را دوباره برانگیخت. امروز، او یک نماد رپ شناخته شده جهانی است و از سال 2017، یک عضو تالار مشاهیر راک رول است. بر این اساس، لحن پوشش این بار نسبت به دهه‌های پیش بسیار کمتر نادیده‌انگیز بود. هنگامی که عکس‌های جسد او در جریان محاکمه نمایش داده شد (که به صورت زنده پخش می‌شد)، به سختی می‌توان تئوری توطئه دهه نود را به خاطر آورد که شکور هنوز زنده است و مخفیانه در جایی مانند کوبا پیروزمندانه رشد می‌کند، تنها برای مواجهه با منظره اجتناب‌ناپذیر جسد سیاه شکسته دیگری که توسط خشونت بریده شده است. توپاک شکور وقتی کشته شد در اوج فرهنگی خود بود، تیتر اوت 2026"}, {"source": "Rolling Stone", "title": "Here’s Where You Can Find Tickets to Stevie Wonder’s ‘Songs in the Key of Life’ Tour", "link": "https://www.rollingstone.com/product-recommendations/tickets/where-to-buy-stevie-wonder-tickets-songs-in-the-key-of-life-1235625534/", "summary": "Wonder will perform his classic album in full this fall, with U.S. tour dates starting in November", "date_str": "2026-09-12T14:00:00+00:00", "hash": "f6beea35dd0f75ab", "title_fa": "اینجا جایی است که می‌توانید بلیط‌های تور «Songs in the Key of Life» استیوی واندر را پیدا کنید.", "summary_fa": "اگر محصول یا خدماتی را که به طور مستقل بررسی شده را از طریق پیوندی در وب سایت ما خریداری کنید، رولینگ استون ممکن است کمیسیون وابسته دریافت کند. استیوی واندر در پاییز امسال تور Songs in the Key of Life را برگزار می‌کند و آلبوم را به طور کامل با برنامه‌هایی از اکتبر تا دسامبر اجرا می‌کند. امسال پنجاهمین سالگرد رکورد کلاسیک است که به طور گسترده یکی از بهترین های تمام دوران در نظر گرفته می شود. این تور در 13 اکتبر در بیرمنگام، انگلستان، با U.S. بازی از نوامبر در نیویورک شروع می شود و در دسامبر در لس آنجلس به پایان می رسد. واندر هر شب یک شب در شیکاگو و واشنگتن دی سی اجرا خواهد کرد و دو شب در دیترویت (محل Motown/Tamla Records، لیبلی که این بومی میشیگان تمام دوران ضبط خود را در آن گذراند) اجرا خواهد کرد. این اولین باری نیست که آیکون R B در تورهای Songs in the Key of Life تورهای گسترده ای برای ضبط در سال های 2014 و 2015 داشت، جایی که او آلبوم را به طور کامل اجرا کرد. این یک آلبوم کوتاه هم نیست. از جمله EP اضافی A Something، این آلبوم دوتایی بیش از 100 دقیقه طول می کشد و دارای آثار کلاسیک مانند Sir Duke، I Wish، و As است. جای تعجب نیست که وقتی بلیت ها به فروش رفت، به سرعت در بازار اصلی Ticketmaster خریداری شدند (نمایش های دیترویت در 15 سپتامبر به فروش عمومی رسیدند). اگر به دنبال گرفتن استیوی واندر در تور هستید، اما فروش عمومی را از دست داده اید، در اینجا آنچه باید در مورد یافتن بلیط و اینکه چقدر می توانید انتظار پرداخت داشته باشید، آورده شده است."}, {"source": "Rolling Stone", "title": "Fear and Delusion in Dallas: Inside Trump’s Midterm Convention Flop", "link": "https://www.rollingstone.com/politics/politics-features/republican-midterm-convention-delusional-trump-1235625553/", "summary": "Republicans spent two days celebrating the president in Texas. It's unlikely to have helped the party's chances in November", "date_str": "2026-09-12T13:30:00+00:00", "hash": "0399e457d4562f12", "title_fa": "ترس و توهم در دالاس: درون شکست کنوانسیون میان دوره ای ترامپ", "summary_fa": "ساعت 3:42 در قلب داغ تگزاس، و کف مرکز خطوط هوایی آمریکا در دالاس، میاسما قرمز خونی از فیل‌های رقصنده است. زیر نورهای سرمه‌ای بداخلاقی که در اولین کنوانسیون ملی جمهوری‌خواهان (میان‌دوره‌ای) روی جمعیت می‌شورند، بلوندهای میانسال پراکسید با کلاه‌های کابوی درخشان پرچم آمریکا به سمت کمربند خشمگین بانی تایلر در Holding Out for a Hero حرکت می‌کنند. مردانی با کت و شلوار و سگک های کمربند نقره ای و چکمه های چرمی، تابلوهای KEEP THE MORITY را که توسط سازمان دهندگان توزیع شده است، با خجالت بالا می برند. صحنه در حال حاضر خالی است. تصاویر بزرگ و تهدیدآمیز جو بایدن، نانسی پلوسی و کامالا هریس بر روی جمعیت دیده می شود. هیچ کدام از آنها این چرخه را اجرا نمی کنند. اگر مستقیماً به آن طرف زمین نگاه کنم، به سمت ورودی‌های صندلی‌های جعبه‌ای که هنوز عمدتاً خالی هستند و خون دماغ می‌شود، درهای سفید روشن که نور روز مرکز شهر دالاس را به خود جلب می‌کنند خشن و کور می‌شوند. در خارج از محوطه مجهز به تهویه هوا، دعوا در جریان است. حزب جمهوری خواه با خود و رای دهندگانش در حال جنگ است. تلفات این چرخه سیاسی که حول دوران جنگ ویران شده و فاجعه‌بار اقتصادی دونالد ترامپ در دو سال پیش روی کار آمد، احتمالاً هر هیئت ایالتی جمهوری‌خواه را تحت تأثیر قرار خواهد داد. اما رئیس جمهور یک مهمانی می خواهد و شما نمی توانید با چراغ روشن برقصید. هجده ماه پیش دالاس مکان مناسبی برای این رویداد بود. ترامپ، سخنران اصلی اولین شب کنفرانس دو روزه، در سال 2024 دستاوردهای نسلی در میان اسپانیایی‌ها به دست آورد. فرماندار گرگ ابوت قول داد که پنج کرسی جدید مجلس نمایندگان جمهوری‌خواهان را در نقشه انتخاباتی ایالت ایجاد کند. ایالت Lone Star به مکه جنوبی انقلاب تکنو محافظه کار تبدیل شده بود که به دنبال یافتن"}, {"source": "Rolling Stone", "title": "A Kansas Cold Case Was a True-Crime Hit. Did True-Crime Media Change Its Ending ?", "link": "https://www.rollingstone.com/culture/culture-features/killer-story-dana-chandler-true-crime-hbo-docuseries-1235619040/", "summary": "HBO's new three-part docuseries 'A Killer Story' unpacks one of the state's most notorious cold cases and the woman serving time for a murder she says she didn't commit", "date_str": "2026-09-12T13:00:00+00:00", "hash": "8100e73cbd426900", "title_fa": "یک مورد سرد کانزاس یک موفقیت واقعی بود. آیا رسانه‌های True-Crime پایان خود را تغییر دادند؟", "summary_fa": "جو سکستون، روزنامه نگاری با بیش از سه دهه فعالیت در تجارت و سردبیر چندین تیم تحقیقاتی برنده جایزه پولیتزر، با این تماس بیگانه نیست. بنابراین وقتی یک روز در سال 2017 ایمیل خود را باز کرد و ایمیلی از ساکن کانزاس و متعصب واقعی جنایت، آیلین آمبر را دید که از او می‌خواست به یک قتل مرموز در توپکا، کانزاس بپردازد، تعجب نکرد. او نوشت که او و همسرش کین آمبر متقاعد شده بودند که دولت یک فرد بی گناه را محاکمه کرده و محکوم کرده است. نکات هر روز به صندوق ورودی او سرازیر می شد، بنابراین در ابتدا او آن را نادیده گرفت. اما آیلین اصرار کرد. او با ارسال ایمیل‌هایی از او خواست که در مورد پرونده تحقیق کند، از چند پیام در هفته تا 25 ایمیل در یک دوره 24 ساعته، اغلب با ده‌ها پیوست، رونوشت، سوابق دادگاه و شواهد. او این را برای بیش از دو سال حفظ کرد. [نکات] بیشتر از آن چیزی که باید باشد، یک خرافات است. من می خواهم به شما بگویم که ما هر مرده ای را جدی می گیریم. سکستون به رولینگ استون می گوید، اما اگر در مکانی مانند نیویورک تایمز کار می کنید، حجم چیزهایی که می توانید وارد کنید، هرگز به آن نمی رسید. این خبرنگار بیهوده و اغلب بد دهان بیش از 25 سال در نیویورک تایمز کار کرد، ابتدا به پوشش ورزش و سپس شهر پرداخت و سپس سردبیر شد و در نهایت به اتاق خبر مستقل ProPublica رفت. او شغلی را برای رسیدن به ته داستان‌هایی بنا کرد که کشف یکی از دلایل متعددی که آیلین متقاعد شد می‌تواند کمک کند، غیرممکن به نظر می‌رسد. سکستون می گوید، در این مورد، هنگامی که آیلین در کانزاس ایمیل من را داشت، هیچ مانعی برای او وجود نداشت. مقامات این پرونده را بسته تلقی"}, {"source": "Rolling Stone", "title": "‘The Uprising’ Follows a 14th Century Populist Revolution. It Couldn’t Feel More Relevant", "link": "https://www.rollingstone.com/tv-movies/tv-movie-reviews/the-uprising-review-andrew-garfield-1235623035/", "summary": "Paul Greengrass revisit a moment when the poor were mad as hell, could not take it any more, and fought the powers that be. It will seem eerily familiar", "date_str": "2026-09-12T13:00:00+00:00", "hash": "024f10e40eeec0fa", "title_fa": "\"قیام\" انقلاب پوپولیستی قرن چهاردهم را دنبال می کند. نمی تواند مرتبط تر احساس شود", "summary_fa": "شورش ها با انباشته شدن طولانی و آهسته آتش شروع می شوند و به دنبال آن جرقه ای می آید. در مورد شورش دهقانان انگلستان در سال 1381، هیزم ترکیبی از یک بیماری همه گیر معروف به مرگ سیاه بود که نیمی از جمعیت اروپا را از بین برد، اما به ویژه برای شهروندانی که در فقر زندگی می کردند کشنده بود. یک نایب السلطنه، پادشاه ریچارد دوم، که بی تجربگی و اتکای بیش از حد او به مشاوران بد بازیگر منجر به فساد در سراسر رژیم شد. و نرخ های مالیات سنگین (که طبیعتاً به نفع اشراف بود) برای پرداخت هزینه جنگ غیرمحبوب با یک کشور خارجی لازم بود. جرقه یک حادثه در شهر روستایی برنت‌وود، درست خارج از اسکس بود، زمانی که یک مقام سلطنتی که تلاش می‌کرد به زور مالیات جمع‌آوری کند، به شدت مورد حمله قرار گرفت. خشم پوپولیستی به تعدادی از شهرستان‌های مختلف در سراسر بریتانیا سرایت کرد و منجر به راهپیمایی گسترده در لندن شد. هشدار اسپویلر برای کسانی که کتاب های تاریخ قرون وسطی را در دست ندارند: پایان خوبی ندارد. همه سیاست‌ها شخصی هستند، و «قیام»، فیلم‌ساز پل گرین گراس، پریشان، تجسم مجدد درونی آن چیزی که در نهایت به عنوان قیام بزرگ شناخته می‌شود، بر دیدگاه یک مرد خاص زوم می‌کند. او یک کشاورز است که هنوز در غم از دست دادن خانواده اش در اثر طاعون عزادار است و نام حرفه اش: گاوآهن است. همانطور که اندرو گارفیلد نقش آن را بازی می‌کند، که همیشه در ارائه چهره غم‌انگیز عالی بوده است، او یک روح خالی از سکنه است که به سختی از درآمدهای نه چندان ناچیزش می‌گذرد. پلومن در صحنه ای حضور دارد که از فقرا سود بیشتری طلب می شود و بدجنس های تحت تحریم دولت با نمایش های مبتذل قدرت شادی می کنند. این اوست که گریه"}, {"source": "Rolling Stone", "title": "I’m a Princeton Student. The Story of Its Ties to Slavery and Exploitation Must Be Remembered", "link": "https://www.rollingstone.com/culture/culture-features/princeton-slavery-ties-firestone-exploitation-liberia-1235623888/", "summary": "A journalism class opened my eyes to the school’s complicated history with slave owners and plantation labor. Now, I want to spread the truth and find a path to reconciliation", "date_str": "2026-09-12T12:00:00+00:00", "hash": "70de10dffb69633a", "title_fa": "من دانشجوی پرینستون هستم داستان پیوندهای آن با برده داری و استثمار را باید به خاطر آورد", "summary_fa": "یادداشت سردبیر: این داستان بخشی از مجموعه ویژه دانشجویان روزنامه نگاری دانشگاه پرینستون است که در مورد کشف یک گورستان آفریقایی در کی وست فلوریدا گزارش می دهد و اینکه چگونه میراث برده داری هنوز در آنجا و فراتر از آن بازتاب دارد. من این داستان پیچیده را در اتاق نشیمن خود در خانه در پنسیلوانیا در پاییز سال 2023 شروع کردم و به سر ببر غول پیکر روی صفحه کامپیوترم خیره شدم و اجازه دادم در جایی که تازه وارد پرینستون شده بودم غرق شود. احساسات زیادی در وجودم جاری بود، عمدتاً ناباوری. مطمئناً، این بدان معنا بود که کاری که در دوران دبیرستان انجام داده بودم نتیجه داده بود، اما این کار من نبود که بیشترین اهمیت را برای من داشت. مهم‌تر از آن، پذیرش من نشان‌دهنده این بود که تلاش والدینم تا حدودی ثمره‌اش را نشان می‌داد. خانواده من در طول درگیری های دهه 1990 لیبریا به شدت متحمل رنج شده بودند. می‌دانستم که می‌خواهم از تحصیلاتم برای کمک به لیبریا و کشورهای در حال مبارزه مانند آن استفاده کنم، و از منابعی که پرینستون برای انجام این کار به من پیشنهاد می‌کرد، خوشحال ب یگان است. اوکلاهاما vs. بازی میشیگان امروز شنبه 12 سپتامبر برگزار خواهد شد. شروع بازی در ظهر ET است و بازی از FOX پخش خواهد شد."}, {"source": "Rolling Stone", "title": "Pink Responds to Fallout After Sharing Post Criticizing Macklemore’s Speech on Palestine", "link": "https://www.rollingstone.com/music/music-news/pink-responds-backlash-macklemore-palestine-post-1235625662/", "summary": "Pink addressed the backlash she received after reposting a call for Macklemore to apologize following his statements on stage", "date_str": "2026-09-12T02:03:10+00:00", "hash": "a8edbd0208f5cc91", "title_fa": "پاسخ پینک به Fallout پس از به اشتراک گذاشتن پست در انتقاد از سخنرانی مکلمور در مورد فلسطین", "summary_fa": "پینک پس از به اشتراک گذاشتن پستی در اینستاگرام که در آن از فراخوان های مکلمور برای آزادی فلسطین در جریان اجرای افتتاحیه تور آمریکای شمالی اد شیران انتقاد می کرد، به واکنش هایی پرداخت. هفته گذشته، مکلمور در استادیوم MetLife در شرق رادرفورد، نیوجرسی روی صحنه رفت. این خواننده رپ هزاران نفر را خطاب قرار داد. مککلمور گفت: بخش بزرگی از دلیلی که من می خواستم این تور را در وهله اول انجام دهم این بود که می توانستم در استادیوم هایی مانند این بایستم و دو کلمه را بگویم که برای من بسیار نزدیک و عزیز است: فلسطین آزاد. من می خواهم این سخنان بلند و واضح باشد تا مردم از غزه تا کرانه باختری اشغالی بدانند که ما آنها را فراموش نکرده ایم. سخنان او با تشویق جمعیت روبرو شد در حالی که گزارش شده است که دیگران در حین اجرای او از آنجا خارج شدند. مککلمور با تماس های سریعی مواجه شد تا او را از تور حذف کنند. در یکی از پست‌هایی که پینک آن را مجدداً در اینستاگرام به اشتراک گذاشت، حساب کاربری StopAntisemitism مککلمور را به کمین کردن طرفداران در کنسرت شیران با تبلیغات ضد اسرائیلی متهم کرد و گفت این هنرمند اسرائیل را به یک نسل‌کشی دروغین متهم کرده است. طبق Stereogum، این پست خواستار عذرخواهی مککلمور و بازپرداخت وجه به دارندگان بلیط بود. به نوبه خود، پینک پس از ارسال مجدد خود با واکنش های منفی مواجه شد. پینک روز جمعه (11 سپتامبر) با توضیحی طولانی در رسانه های اجتماعی به این انتقاد پاسخ داد که چرا احساس می کرد مجبور به اشتراک گذاری پستی است که از مکلمور خواسته بود عذرخواهی کند و چرا اقدامات هفته گذشته او باعث نگرانی او شد. یکشنبه گذشته من پست شخص دیگری را در مورد مجموعه مکلمور در نمایش اد شیران بازنشر کردم. چیزهایی"}, {"source": "Hollywood Reporter", "title": "‘Smudge the Blades’ Isn’t Your ‘Heated Rivalry’-Style Canadian Hockey Drama", "link": "https://www.hollywoodreporter.com/movies/movie-news/toronto-smudge-the-blades-1236683760/", "summary": "Cody Lightning’s feature film is all business on the ice — an underdog dramedy about a struggling Indigenous team fighting racism outside the rink.", "date_str": "2026-09-12T14:15:00+00:00", "hash": "a9db32b1716e53ae", "title_fa": "«Smudge the Blades» درام هاکی کانادایی به سبک «رقابت شدید» شما نیست", "summary_fa": "S mudge the Blades، اشتباه نکنید، رقابت داغ نیست. برخلاف درام تلویزیونی موفق کانادایی و عاشقانه‌های خارج از یخ آن، درام تیم هاکی بومی ضعیف کودی لایتنینگ عمدتاً بازی روی یخ پر انرژی است. و هیچ بازیگری نیازی به آموزش در مورد نحوه اسکیت زدن قبل از اینکه دوربین‌های مستقل روی صحنه بیایند، نداشت. لایتنینگ می‌گوید که من ترجیح می‌دهم بازیکنان هاکی را انتخاب کنم و آنها را در بازیگری مربیگری کنم تا اینکه به یک بازیگر نحوه بازی هاکی را بیاموزم. داستان‌های مرتبط فیلم‌های باشگاه بچه، تهیه‌کننده حصیری در فروش کن و هنگامی که ایکیا وارد تریلر شما می‌شود: گاهی اینترنت فقط کارش را انجام می‌دهد فیلم‌های تورنتو: کارگردان برزخ با والدین متخاصم و قدرت دختر در کمدی طلاق تاریک حرکت می‌کند البته، فیلم Smudge the Blades Lightning برای اولین بار به عنوان اولین جشنواره فیلم سینمایی پیش از جشنواره T. آینه، در قسمت‌هایی، کمدی هاکی اردک‌های توانا محصول 1992 دیزنی. اما کوچ ویلی در ایندی کانادایی، مانند امیلیو استیوز در نقش گوردون بمبئی، به هیچ وجه یک وکیل برنده نیست و به مربی تبدیل شده است. مربی قوی در Smudge the Blades ابتدا توسط اد هلمز بازی می شود تا زمانی که Blades از لیگ اخراج شود. این یک فیلم تیم هاکی بومی است، به لایتنینگ به عنوان راننده زامبونی در عرصه محلی واگذار شده است تا مربیگری تیم بازنده بلیدز را بر عهده بگیرد. به طور قابل توجهی، مربی ویلی هیچ سخنرانی انگیزشی به سبک استیوز ندارد تا کاری انجام ندهد تا از محدودیت های خود برای کسب افتخار قهرمانی عبور کند."}, {"source": "Hollywood Reporter", "title": "‘Club Kid’, ‘Wicker’ Producer on Cannes Sales and When Ikea Gets In on Your Trailer Launch: “Sometimes the Internet Just Does Its Job”", "link": "https://www.hollywoodreporter.com/movies/movie-features/club-kid-wicker-producer-on-cannes-sales-and-when-ikea-gets-in-on-your-trailer-launch-sometimes-the-internet-just-does-its-job-1236698203/", "summary": "With both 'Club Kid‘ and ‘The Debut‘ set to screen at TIFF, Ryan Heller talks Topic Studios’ big year, including 'Wicker’s unexpected Internet virality.", "date_str": "2026-09-12T14:00:00+00:00", "hash": "8cff53f203fe41be", "title_fa": "«بچه باشگاه»، تهیه‌کننده «حصیره» در فروش کن و هنگامی که ایکیا وارد تریلر شما شد: «گاهی اوقات اینترنت کار خود را انجام می‌دهد»", "summary_fa": "این یک رویا برای هر تهیه‌کننده‌ای است که تریلر نمایشی برای ویژگی هنرمند محورشان که به‌طور مستقل ساخته شده‌اند (به روشی خوب) آنلاین شود. وقتی یک فروشگاه با جعبه بزرگ سرگرم می شود، کاملاً سطح دیگری است. این مورد برای رایان هلر و استودیوی تاپیک بود، جایی که هلر به عنوان رئیس فیلم و مستند فعالیت می‌کند، زمانی که در ماه جولای، نقطه پرتحرک Wicker، درام فانتزی مورد تایید ساندنس آنها با بازی اولیویا کولمن و الکساندر اسکارسگارد، توجه TikTok را به خود جلب کرد. این فیلم که در مورد یک زن ماهیگیر است که یک سبدساز محلی را استخدام می کند تا شوهرش را ببافد، در بین مخاطبان عاشقانه در BookTok بینندگانی پیدا کرد و میلیون ها بازدید به دست آورد. سپس، Ikea در رسانه های اجتماعی پست کرد که خط مبلمان حصیری آن از مواد شوهر ساخته شده است، که دور جدیدی از سر و صدا را برانگیخت. داستان‌های مرتبط فیلم تورنتو: کارگردان برزخ در فیلم‌های کمدی طلاق تاریک با والدین متخاصم و قدرت دختر حرکت می‌کند. هلر در مورد توجه غیرمنتظره اما خوش‌آمد می‌گوید، این به ایجاد فوریت تئاتری تبدیل شده است. حتی قبل از شهرت آنلاین، سال 2026 یک سال تبلیغاتی برای تاپیک بود، که اولین فیلم «کلاب بچه» جردن Firstman را به A24 از جشنواره فیلم کن فروخت و در 5 سپتامبر اولین فیلم جسی آیزنبرگ را با نقدهای تحسین برانگیز و سر و صدای اسکار فراوان به نمایش گذاشت. قبل از TIFF، جایی که هم Club Kid و هم The Debut در حال نمایش هستند، هلر با THR درباره سال بزرگ تاپیک صحبت کرد. در اواخر، به نظر می رسد که توزیع کنندگان جدید هر روز ظاهر می شوند."}, {"source": "Hollywood Reporter", "title": "Toronto: ‘Purgatory’ Director Navigates Warring Parents and Girl Power in Dark Divorce Comedy", "link": "https://www.hollywoodreporter.com/movies/movie-news/toronto-2026-purgatory-film-director-interview-1236690774/", "summary": "Lindsey Lanzillotta's coming-of-age dramedy and debut feature stars J.K. Simmons, Ruby McGurrin, Abby Elliot and John Reynolds and is set for a world premiere at TIFF.", "date_str": "2026-09-12T13:00:00+00:00", "hash": "4143528143b5d6c0", "title_fa": "تورنتو: کارگردان «برزخ» در کمدی تاریک طلاق از والدین متخاصم و قدرت دختر می‌گذرد.", "summary_fa": "وقتی پدر و مادرت از هم جدا می شوند و خانه و زندگی مدرسه و خانه پناهگاه و حومه شهر و مدرسه را ویران می کنند، یک دختر باید چه کند؟ این مقدمه برای اولین فیلم برزخ مجموعه دهه 1980، لیندسی لانزیلوتا است که جی.کی. سیمونز، ابی الیوت خرس، جان رینولدز و روبی مک گورین در اولین نقش سینمایی خود در نقش بئاتریس گراول. مک گورین به عنوان MVP فیلم برای بازی در نقش یک چپ چپ 13 ساله ظاهر می شود که خانواده و ایمان او را اساساً همه و همه چیز اطرافش را زیر سوال می برد، پس از اینکه مادرش تصمیم می گیرد برای خودشکوفایی از خانواده اش وقت بگذارد. این باعث می‌شود که پدرش، جو گراول (جان رینولدز)، تکه‌های خانواده‌ای از هم پاشیده را که از بئاتریس و خواهرش، کلویی، با بازی لورن مک‌ری مراقبت می‌کند، بردارد. داستان‌های مرتبط فیلم‌ها کارلا وودکاک به کیت بکینسیل و کاترین مک‌نامارا در فیلم‌های سفید (اختصاصی) ملحق می‌شود، نویسنده کانادایی متیو رنکین رویای تبی درباره تاریخ کانادا دیده بود لانزیلوتا برزخ را بر اساس فیلمنامه‌ای از کریستین اسپیر کارگردانی کرد و به نظر می‌رسید که به عنوان یک بئاتریس در حال آمدن به سمت بی‌تریس قرار بگیرد. همچنین بیش از حد آگاه و از زندگی مختل شده در خانه و مدرسه او آسیب دیده است. کارگردان توضیح می‌دهد که وقتی احساسات روی پوست شما قرار دارند، همه در اطراف شما احساس دروغی می‌کنند و احساسی که شما دارید را احساس نمی‌کنند و شما تعجب می‌کنید که آیا کسی احساس من را می‌بیند؟ اما در شهر کوچکی که همدلی عملاً ناپدید شده و جای خود را به بی مهری و حتی وحشیگری در میان دوستان دبیرستانی بئاتریس و والدینشان داده است، استثنا و دریچه حیاتی برای مهربانی در برزخ با جی.کی. سیمونز در نقش پدر مالون شخصیت کشیش کاتولیک او، همانطور"}, {"source": "Hollywood Reporter", "title": "Carla Woodcock Joins Kate Beckinsale, Katherine McNamara in ‘White’ (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/carla-woodcock-joins-kate-beckinsale-shark-movie-white-1236698229/", "summary": "Highland Film racked up multiple pre-sales for Jake West's shark survival thriller at TIFF.", "date_str": "2026-09-12T12:00:00+00:00", "hash": "0038a264e8fc28fc", "title_fa": "کارلا وودکاک به کیت بکینسیل و کاترین مک نامارا در «سفید» پیوست (اختصاصی)", "summary_fa": "هالیوود ریپورتر به طور انحصاری دریافته است که کارلا وودکاک (استارز اوتلندر) برای بازی در نقش اصلی فیلم سفید، تریلر آینده بقای کوسه از کارگردان ترسناک جیک وست (بیگانگان شیطانی) قرارداد امضا کرده است. وست کارگردانی وایت را بر اساس فیلمنامه ای از دن شافر، نویسنده و تصویرگر مجموعه کتاب های مصور کالت Dogwitch بر عهده دارد. گروه فیلم هایلند، که با مشارکت مالی White و مدیریت فروش جهانی این عنوان در TIFF، چندین منطقه بین المللی از جمله به Splendid Film در آلمان، IIF در ایتالیا، Three Lines Pictures برای Benelux، Cinemundo برای پرتغال، Falcon Films برای خاورمیانه، آمریکای لاتین به California Filmes و Rialto Distribution برای استرالیا / New Zeland در میان سایرین پیش فروش کرده است. White توسط Yariv Lerner، Dominic Burns، Crawford Anderson-Dillon و Sky Morfopoulos تولید می شود. کیت بکینسیل به همراه آریان فریزر و دلفین پریر از گروه فیلم هایلند، پاتریک وینترزگیل، کوین گلین، پائوریک دافی و هانا لیدر تهیه کنندگی اجرایی را بر عهده دارد. فهرست فعلی گروه فیلم هایلند شامل فیلم اکشن علمی تخیلی نمر د آنتال، بلوفلای با راسل کرو و پریانکا چوپرا جوناس است. فیلم اکشن نیل برگر باراکودا با بازی آنتونی مکی و دفنه کین. و اکشن مهیج پیر مورل سامری خوب با بازی دیزی ریدلی، جاش دوهامل و شارلتو کوپلی. وودکاک توسط سارا کملت در گروه استعدادهای مستقل اجرا می شود."}, {"source": "Hollywood Reporter", "title": "Canadian Auteur Matthew Rankin Had a Fever Dream About Canadian History", "link": "https://www.hollywoodreporter.com/movies/movie-news/matthew-rankin-film-ladies-and-gentlemen-brian-mulroney-chat-1236683600/", "summary": "In the Toronto-premiering 'Ladies and Gentlemen, Brian Mulroney,' the 'Universal Language' director turns former Canadian PM Brian Mulroney’s rise to power into a surreal collage of archival footage, animation and TV propaganda.", "date_str": "2026-09-12T11:00:00+00:00", "hash": "27e2af92027d7ea9", "title_fa": "نویسنده کانادایی متیو رنکین رویای تب در مورد تاریخ کانادا دید", "summary_fa": "فیلم‌های متیو رنکین در مورد کانادا معمولا تماشاگران تئاتر را وادار به مالیدن چشمان خود می‌کنند. در فیلم سینمایی «زبان جهانی» در سال 2024، تماشاگران شگفت‌انگیز به سختی می‌توانستند کانادایی را باور کنند که در آن فارسی و فرانسوی دو زبان رسمی هستند و تیم هورتونز محلی به یک سالن چای عربی تبدیل می‌شود. همراه با خانم ها و آقایان، برایان مولرونی برای اولین بار در سپتامبر اکران جهانی خود را آغاز کرد. 15 به عنوان بخشی از برنامه Midnight Madness در تئاتر رویال الکساندرا در تورنتو، کلاژ ژانر رنکین از فیلم‌های آرشیوی، جلوه‌های ویژه و انیمیشن به یک مستند دیجیتالی از سیاست و فرهنگ پاپ تبدیل می‌شود که سفر به قدرت را برای هجدهمین نخست‌وزیر کانادا، برایان مولرونی نشان می‌دهد. داستان‌های مرتبط فیلم‌ها متأسفم، کالب هرون دلقک شما در زباله‌دان نیست فیلم‌های درامدی غم کوهستانی کورتنی کاکس می‌گوید که تصمیم گرفت نابغه شیطانی را کارگردانی کند پس از برخورد شانسی در هتل بورلی هیلز: آنجا معاملات زیادی انجام دادم رانکین به هالیوود ریپورتر می‌گوید که فیلم انگلیسی و فرانسوی‌زبانش به نظر می‌رسد که فیلم انگلیسی و فرانسوی‌زبان او را با هم ترکیب می‌کند. بهترین: مستند و انیمیشن نتیجه یک دستکاری کالیدوسکوپیک تصاویر متحرک است که با زبان انتزاعی , "title_fa": "کورتنی کاکس می‌گوید که تصمیم گرفت فیلم «نابغه شیطانی» را بعد از برخورد تصادفی در هتل بورلی هیلز کارگردانی کند: «من در آنجا معاملات زیادی انجام دادم»", "summary_fa": "طرفداران ممکن است هتل بورلی هیلز را برای تشکر از جدیدترین پروژه کورتنی کاکس داشته باشند. آلوم دوستان فاش کرد که پس از برخورد تصادفی با باربارا شرودر، کارگردان مستند نتفلیکس به همین نام، در هتلی نمادین در بورلی هیلز، برای کارگردانی Evil Genius، اولین فیلم بلند او به عنوان کارگردان در 12 سال، با او تماس گرفته شد. من در هتل بورلی هیلز بودم و پشت پیشخوان نشسته بودم. نقطه مورد علاقه من در گوشه من [شرودر] را دیدم، و فکر کردم، خدای من، من عاشق نابغه شیطانی هستم. کاکس در استودیوی هالیوود ریپورتر در هتل 1 در خلال TIFF که توسط حامی مالی Canada Goose ارائه شد، گفت: شما کار بسیار خوبی انجام دادید. او گفت، برای کارگردانی در دسترس است. او می رود، شما باید با آن بدوید. ما قبلا رابطه خوبی داشتیم. من در آنجا [در هتل بورلی هیلز] معاملات زیادی انجام دادم و در آنجا پول زیادی به دست آوردم. فقط جالبه داستان های مرتبط تلویزیون جاش هارتنت فاش می کند که قبل از پیوستن به فیلم های زیر فعالانه به دنبال اجرای یک برنامه تلویزیونی نبوده است سباستین استن می گوید دعوت به منفی بودن در جامعه از بالا شروع می شود: خیلی تنبل است کاکس به شوخی اضافه کرد که این معاملات همیشه در پیشخوان بوده است: من نمی توانم وارد اتاق پوکر شوم. برخورد تصادفی کاکس باعث شد تا ایده کارگردانی مطرح شود، اما سال ها طول کشید تا Evil Genius از صحنه خارج شود. ستاره Scream به THR گفت که فیلم به مدت هشت سال از طریق قرنطینه COVID-19 و اعتصابات WGA و SAG-AFTRA در سال 2023 قبل از تولید در سال 2025 در حال ساخت بود. علیرغم اینکه با موانع مهمی روبرو بود، کاکس نمی توانست [داستان] را رها کند زیرا من آن را دوست داشتم."}, {"source": "Hollywood Reporter", "title": "Sydney Sweeney Faces Backlash for Sexualized Novig Ad: “Exactly Why Women in Sports Aren’t Taken Seriously”", "link": "https://www.hollywoodreporter.com/business/digital/sydney-sweeney-sports-ad-backlash-sexualization-women-1236698224/", "summary": "Many online users, including women who work in the sports industry, have shared their frustration with the actress' campaign for the sports trading app, which features multiple shots of her mostly naked body covered with different sports balls and uniforms.", "date_str": "2026-09-12T01:50:46+00:00", "hash": "c53b687d8f80324b", "title_fa": "سیدنی سوینی برای تبلیغ جنسی نوویگ با واکنش شدید روبرو شد: \"دقیقا چرا زنان در ورزش جدی گرفته نمی شوند\"", "summary_fa": "بیش از یک سال پس از جنجال تبلیغاتی عقاب آمریکایی، سیدنی سوینی برای کمپین دیگری با واکنش شدید روبرو شد: تبلیغ جنسی او برای اپلیکیشن تجارت ورزشی Novig. بازیگر Euphoria روز چهارشنبه برای حمایت از پلتفرم جدید که ماه گذشته راه اندازی شد، با Novig همکاری کرد. او نه تنها در این آگهی بازی کرد، بلکه به عنوان یک شریک استراتژیک و صاحب سهام به نوویگ پیوست. پلتفرم Novig مکانیک مبادلات مالی مدرن را با یک تجربه ورزشی ترکیب می‌کند و راهی کارآمدتر و شفاف‌تر را برای طرفداران ایجاد می‌کند تا بر اساس نتایج ورزشی در هر نسخه معامله کنند. همچنین به عنوان تنها بازار پیش‌بینی برای حفظ شرط سنی 21+ شناخته می‌شود، که این برند استدلال می‌کند که با ادامه رشد این دسته، استاندارد بالاتری برای مشارکت مسئولانه تعیین می‌کند. داستان‌های مرتبط THR + Sportico: Game Recognize Game Belmont Cameli و NHL Phenom Macklin Celebrini Talk Off Campus، Olympic Heartbreak و Handling the Hype Lifestyle Stars Sydney در کمپین تبلیغاتی تحریک‌آمیز برای Novig Sports Trading برخی از کاربران استدلال می‌کنند که پلتفرم Sweeney می‌تواند به خوبی از رتبه‌بندی Sweeney R استفاده کرده باشد. وقتی آن تبلیغ روی تلویزیون آمد، نمی توانستم باور کنم. من 2 فرزندم را در اتاق نشیمن داشتم، مجبور شدم سر آنها فریاد بزنم تا از تلویزیون نگاه کنند. یکی از کاربران TikTok در مورد پستی که توسط Marissa Womack، مدیر تبلیغات روز بازی و برنامه‌نویسی تیم بیسبال در لیگ کوچک، سناتورهای هریسبورگ، ارسال شده است، نمی‌دانم چرا باید چنین تبلیغی [مبتذل] ایجاد کنند. دیگران از نظرات سوئینی در اینستاگرام استفاده کردند، از جمله کاربری که ناسازگاری اینستاگرام با حذف محتوای جنسی بالقوه را مطرح کرد. دوست دارم که اینستاگرام @ اجازه چنین چیزهایی را می‌دهد، اما لحظه‌ای که من چیزی را با لباس بیکینی پست می‌کنم، آن‌ها نوشته‌اند پست حذف می‌شود، در حالی که پست"}, {"source": "Variety", "title": "‘Family Stone 2’ Gets Official Title ‘The Families Stone’ and Sets Cast: Rachel McAdams, Sarah Jessica Parker and More Returning", "link": "https://variety.com/2026/film/news/family-stone-2-title-cast-rachel-mcadams-sarah-jessica-parker-1236856900/", "summary": "Searchlight has officially announced The Family Stone 2, a sequel to the 2005 holiday classic from returning writer and director Tom Bezucha. The follow-up is officially titled The Families Stones and will feature the returns of many of the original s main cast members, including Rachel McAdams as Amy Stone and Sarah Jessica Parker as Meredith [ ]", "date_str": "2026-09-12T14:00:00+00:00", "hash": "bd647b7284b1658a", "title_fa": "«سنگ خانواده 2» عنوان رسمی «سنگ خانواده» را دریافت کرد و بازیگران: ریچل مک‌آدامز، سارا جسیکا پارکر و سایر بازیگران بازگشته", "summary_fa": "سرچ لایت رسما The Family Stone 2 را معرفی کرد که دنباله ای بر کلاسیک تعطیلات سال 2005 از نویسنده و کارگردان بازگشته تام بزوچا است. عنوان بعدی به طور رسمی The Families Stones است و بسیاری از بازیگران اصلی بازی از جمله ریچل مک آدامز در نقش امی استون و سارا جسیکا پارکر در نقش مردیت مورتون بازخواهند گشت. بازیگران تایید شده نیز شامل موارد زیر هستند: کلر دینز (جولی مورتون)، درموت مولرونی (اورت استون)، کریگ تی. نلسون (کلی استون)، لوک ویلسون (بن استون)، تایرون جوردانو (تاد استون)، الیزابت ریزر (سوزانا استون)، پل اشنایدر (برد استیونسون) و برایان وایت (پاتریک توماس). داستان‌های مرتبط دنباله «چگونه مردی را در 10 روز از دست بدهیم» در پارامونت تنظیم می‌شود. تهیه کنندگی کیت هادسون (اختصاصی) در خلاصه داستان The Families Stone از سرچ لایت آمده است: بیست سال پس از مرگ مادرشان، خانواده استون برای کریسمس دوباره گرد هم می آیند تا با بزرگترین غافلگیری فصل روبرو شوند: پدرشان به طور غیرمنتظره ای زنی را که عاشقش شده دعوت کرده است تا با خانواده ملاقات کند. محبوب در Variety این پروژه برای اولین بار در نوامبر 2025 توسط Bezucha فاش شد. این اعلامیه مدت کوتا rican Horror Story: Apocalypse. هنرپیشه پرهیجان استرالیایی که نقش دجال را به تصویر می‌کشید، با تجسم سه شخصیت متمایز پائولسون در مجموعه‌های رایان مورفی به قدری شگفت‌زده شد که مشغول نوشتن بخشی شد که به تماشاگران فیلم نشان می‌دهد که او واقعاً چه توانایی‌هایی دارد. نتیجه شب پایانی است که اولین نمایش جهانی خود را در جشنواره بین المللی فیلم تورنتو خواهد داشت. محبوب ترین اولین فیلم سازی ورایتی فرن به دنبال ساندرا ویل (پالسون)، یک ستاره سینمای پر زرق و برق است که خواهر جدا شده اش (نائومی واتس)، برادرزاده (توبی والاس) و دوست دخترش (اودسا آ زیون) را به شب افتتاحیه نمایش خود در برادوی دعوت می کند، اما روی صحنه سقوط می کنند. این حادثه، و تشخیص بعدی ساندرا، جرقه‌ای برمی‌انگیزد که کینه‌های طولانی مدت به سطح می‌آیند و منجر به درگیری‌های آتشین یکی پس از دیگری می‌شود. در Closing Night اجراهای قدرتمندی وجود دارد، از جمله دایان ویست در نقش مادرسالار خانواده، اما این بیش از هر چیز ویترینی برای پالسون است که در حالی که با اسکلت"}, {"source": "Variety", "title": "Taiwan Strengthens Global Co-Production Presence at Toronto Film Festival With ‘Happily Ever After,’ ‘The Age of Goodbyes’ and ‘Arrested Memory‘", "link": "https://variety.com/2026/film/focus/taiwan-co-production-tiff-1236844426/", "summary": "A strong lineup from Taiwan hits the Toronto Intl. Film Festival, with two world premieres in the special presentations strand, a Taiwan-Japan genre title in Midnight Madness, virtual reality, market projects and an international Oscar contender. Feng-I Fiona Roan’s “Happily Ever After” will make its world premiere in special presentations. The film is Roan’s sophomore [ ]", "date_str": "2026-09-12T13:45:00+00:00", "hash": "595e3212e76bb12b", "title_fa": "تایوان حضور تولید مشترک جهانی را در جشنواره فیلم تورنتو با «خوشبختانه همیشه»، «عصر خداحافظی» و «حافظه دستگیر شده» تقویت کرد.", "summary_fa": "ترکیب قدرتمندی از تایوان به تورنتو بین المللی رسید. جشنواره فیلم، با دو نمایش جهانی در بخش ارائه های ویژه، عنوان ژانر تایوان-ژاپنی در جنون نیمه شب، واقعیت مجازی، پروژه های بازار و مدعی بین المللی اس     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';

    document.getElementById('searchInput').addEventListener('input', (e) => {
