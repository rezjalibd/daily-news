 مظلومان سخن می‌گویند ساکت شوند، و افزود که من در کنار فلسطین و مردم آن ایستاده‌ام. گراهام نوشت که پول به شما حق مالکیت مکالمه را نمی دهد. موجودی بانکی هیچ کس نباید تصمیم بگیرد که چه کسی صحبت کند یا چه رنجی را که ما مجاز به اعتراف هستیم. داستان‌های مرتبط موسیقی اد شیران در مورد رها کردن مکلمور از تور فلسطین اظهارات: تصمیم مروج، تلویزیون من نیست، نوح کاهان در طول سال 2026 Bridge over Water Troubled را اجرا می‌کند. که تغییر نکرده است بیانیه گراهام ادامه داد، اما من نمی‌توانم این کلمات را در دنیا بیان کنم و به این تور ادامه دهم، بیانیه گراهام ادامه داد و افزود: متاسفم که آنجا نخواهیم بود. این تصمیم دشواری است، اما تصمیمی است که باید کنار آن بایستم. رو در پستی در اینستاگرام نوشت: من تصمیم گرفته ام که به عنوان حمایت از تور آمریکای شمالی The Loop اد شیران کنار بکشم. من تصمیم را ساده نمی گیرم اد برای من دوست بود و زندگی من را تغییر داد، من هرگز نتوانستم به اندازه کافی از او برای این کار تشکر کنم. او نوشت، اما به عنوان مردم ایرلندی، ما به خوبی درباره نسل کشی، قحطی اجباری و اشغال خشونت آمیز می دانیم. من نمی توانم کنار بایستم و اجازه بدهم میلیاردرها از موقعیت قدرت خود برای"}, {"source": "Variety", "title": "Viola Davis to Receive San Diego International Film Fest’s Gregory Peck Award for Cinematic Excellence – Film News in Brief", "link": "https://variety.com/2026/film/news/film-news-in-brief-sept-15-2026-1236862951/", "summary": "Viola Davis will be this year’s recipient of the Gregory Peck Award for Cinematic Excellence at the San Diego International Film Festival. Davis, an EGOT winner, is being honored for her work as an artist, activist, producer, philanthropist and New York Times bestselling author. “Viola Davis is one of the most extraordinary artists of our [ ]", "date_str": "2026-09-15T21:33:32+00:00", "hash": "79d52822f459ca9e", "title_fa": "ویولا دیویس جایزه برتر سینمایی گرگوری پک جشنواره بین المللی فیلم سن دیگو را دریافت می کند - اخبار فیلم به طور خلاصه", "summary_fa": "ویولا دیویس امسال برنده جایزه گریگوری پک برای برتری سینمایی در جشنواره بین المللی فیلم سن دیگو itle_fa": "دنی بویل دوج سوال هوش مصنوعی درباره «جوهر» در TIFF: «فکر نمی‌کنم نیازی به آن داشته باشیم».", "summary_fa": "بعدازظهر سه‌شنبه، فیلم «جوهر» دنی بویل، درباره ظهور روزنامه بریتانیایی The Sun با مالکیت روپرت مرداک (یک گای پیرس گستاخ) و تدوینگر لری لمب (جک اوکانل، تندرو)، اولین نمایش خود را در کانادا در جشنواره بین‌المللی فیلم تورنتو انجام داد. همانطور که منتقد ما نوشت، این یک «روایت محرک و غیرقابل چشم پوشی» از ظهور بیشتر بریتانیا است [ ] در طول نمایش QA پس از نمایش فیلم در تئاتر شاهزاده خانم ولز، بویل و بازیگران درباره چند موضوع از جمله استفاده فیلم از هوش مصنوعی سوالاتی از مخاطبان مطرح کردند. بویل قبلاً در جشنواره فیلم Telluride که در آن چند عکس قدیمی را متحرک می‌کنیم، از حدود سی ثانیه هوش مصنوعی استفاده کرد. او افزود که در Variety Oh پرطرفدار است و تعدادی موش نیز وجود دارد. برای حیوانات بسیار خوب است و ما چند موش داشتیم که در اتاق خبر The Sun می دویدند. وقتی یکی از تماشاگران در بالکن تئاتر از بویل در مورد استفاده او از هوش مصنوعی در فیلم و تهدیدی که هوش مصنوعی به طور گسترده‌تری برای صنعت فیلم و جهان ایجاد می‌کند، پرسید، فیلم‌ساز برنده اسکار پشت پرده فیلم میلیونر زاغه‌نشین در TIFF گفت: ما از مقدار کمی از آن استفاده کردیم. در دنیای ما بسیار با VFX مرتبط است. این یکی از ابزارهایی است که آنها در VFX استفاده می کنند. ما سعی می‌کنیم خیلی مسئولیت‌پذیر باشیم و مطمئن شویم که هیچ بازیگری به این دلیل بیکار نمی‌شود، بنابراین اگر قرار بود کمی از آن استفاده کنیم همیشه بازیگران را استخدام می‌کنیم. حدود سی ثانیه از آن بود. در مورد پیامدهای گسترده تر هوش مصنوعی، او آن را برای یک روز دیگر مطرح کرد. او پیشنهاد کرد که چرا این موضوع بسیار پیچیده است، که فکر نمی کنم نیازی به بررسی آن در اینجا داشته باشیم. اما همه ما باید وارد آن"}, {"source": "Variety", "title": "Chuck Norris’ ‘Walker, Texas Ranger’ Co-Star Calls Emmys In Memoriam Snub a ‘Tragic’ and ‘Terrible Mistake’: ‘It Hurt My Feelings’", "link": "https://variety.com/2026/tv/news/chuck-norris-emmys-in-memoriam-snub-walker-texas-ranger-actor-1236863358/", "summary": "Chuck Norris Walker, Texas Ranger co-star Judson Mills is speaking out about the Emmys decision to snub Norris from its In Memoriam tribute. Norris, who died in March at 86 years old, was a television icon in the 1990s as the star of the CBS procedural, which ran for nine seasons and 203 episodes between [ ]", "date_str": "2026-09-15T21:01:08+00:00", "hash": "6ad32bb3210cbe54", "title_fa": "همبازی چاک نوریس در «واکر، تگزاس رنجر»، امی را در یادبود «اشتباهی وحشتناک» و «تراژیک» خطاب می‌کند: «این به احساسات من آسیب زد»", "summary_fa": "جادسون میلز، بازیگر همبازی چاک نوریس واکر، تگزاس رنجر، در مورد تصمیم امی برای رد کردن نوریس از ادای احترام خود به نام In Memoriam صحبت می کند. نوریس، که در ماه مارس در 86 سالگی درگذشت، در دهه 1990 به عنوان ستاره سریال CBS، که 9 فصل و 203 قسمت بین [ ] پخش شد، یک نماد تلویزیونی بود. میلز در دو فصل آخر Walker, Texas Ranger و The Trial by Fire در کنار نوریس نقش فرانسیس گیج را بازی کرد. محبوب در داستان های مرتبط با تنوع، اسم حیوان دست اموز بد برای نمایش نیمه وقت Super Bowl برنده امی شد. و من باید فرض کنم که این فقط یک اشتباه وحشتناک بود. میلز با اشاره به گنا او کلی، بیوه نوریس، گفت، اما اولین فکر من جنا و خانواده و طرفدارانش بود. من مطمئن هستم که چاک بخشش را تشویق می کند. میلز ادامه داد: او مردی بود که همه چیز درباره من نیست. اما برای نمادی با قد و قامت او که نه تنها هالیوود، بلکه کل جهان را تحت تأثیر قرار داد، دیدن اینکه او اصلاً مورد شناسایی قرار نمی‌گیرد و خانواده‌ای که این تقدیر را دریافت نمی‌کنند، ناامیدکننده بود، مطمئناً احساسات من را جریحه دار کرد. او یک اسطوره به خاطر خدا بود. نوریس در طول بخش Emmys In Memoriam به دور از تنها مخالفت قابل توجه بود. نام نیکلاس برندون، ستاره قاتل خون آشام، بافی در طول مراسم ادای احترام روی پرده نمایش داده نشد، علیرغم این مراسم که در اوایل نمایش بافی بین سارا میشل گلار و دیوید بوریناز برگزار شد. همچنین پاتریک مولدون، بازیگر Days of Our Lives و Starship Troopers، جی پی مورگان، عضو هیئت مدیره The Gong Show، دیوی چیس بازیگر The Ring و گریز چپمن، نوازنده 30 Rock، و دیگران حذف شدند."}, {"source": "Variety", "title": "‘Ace Combat 8’ Live-Action Prequel Star Josh Holloway on Revealing Four-Episode ‘Hour Zero’ Story Behind Bandai Namco Franchise’s New Game", "link": "https://variety.com/2026/gaming/news/ace-combat-8-live-action-prequel-hour-zero-episodes-josh-holloway-1236863389/", "summary": "Before “Ace Combat 8: Wings of Theve” releases next month, fans of Bandai Namco Entertainment s classic fighter-pilot video game franchise have a few weeks of backstory to brush up on via live-action prequel project “Hour Zero.” Launching its first episode Tuesday, the four-installment short film is a first-of-its-kind project for the video game studio, which [ ]", "date_str": "2026-09-15T21:00:00+00:00", "hash": "9ada7a3ef311b609", "title_fa": "ستاره پیش درآمد زنده اکشن «Ace Combat 8» جاش هالووی در مورد فاش کردن داستان چهار قسمتی «Hour Zero» پشت بازی جدید Bandai Namco Franchise", "summary_fa": "قبل از عرضه «Ace Combat 8: Wings of Theve» در ماه آینده، طرفداران سری بازی‌های ویدیویی کلاسیک جنگنده-خلبانی Bandai Namco Entertainment چند هفته پیش داستان دارند تا از طریق پروژه پیش درآمد لایو اکشن «Hour Zero» به آن بپردازند. این فیلم کوتاه چهار قسمتی که اولین قسمت خود را از سه شنبه عرضه می کند، اولین پروژه در نوع خود برای استودیوی بازی های ویدیویی است، که [ ] قبل از انتشار بازی Ace Combat 8: Wings of Theve در ماه آینده، طرفداران سری بازی های ویدیویی کلاسیک جنگنده-خلبان Zee Namco Entertainment چند هفته پیش داستانی را برای پیشبرد پروژه زنده دارند. توضیحات شرکت باندای نامکو اینترتینمنت آمریکا برای ساعت صفر: سه غریبه در روزهای آغازین تهاجم جمهوری سوتوآ به فدراسیون مرکزی یوسا جان سالم به در می برند. جاش هالووی در نقش خلبانی که جایی برای فرود ندارد، براندون روث در نقش دکتری که دشمنش را نجات داد و تاملین تومیتا در نقش یک مجری خبری که به دلیل گفتن حقیقت ساکت شده است، بازی می کند. داستان آنها به صورت معکوس و مبتنی بر زندگی خانوادگی سه سرگروه آن، شمارش معکوس دارد تا لحظه ای که زندگی عادی آنها از هم پاشیده شود و جنگ آغاز شود. داستان آنها زمینه را برای بازیکنان روایی فراهم می کند که در حالت کمپین عمیق و جذاب در Ace Combat 8: Wings of Theve تجربه خواهند کرد. محبوب در Variety این پروژه زمانی تولید شد که Ace Combat 8 ​​در حال حاضر نسبتاً در مراحل توسعه بازی قرار داشت و هالووی قبل از اینکه بپیوندد سؤالاتی داشت. تا آن زمان، تنها تجربه او از کار با یک استودیوی بازی‌های ویدیویی، بیان یک شخصیت در بازی استراتژی بی‌درنگ Command Conquer 3: Tiberium Wars در سال 2007 بود و این یک فیلم سینمایی برای خود بازی بود، نه یک پروژه لایو اکشن."}, {"source": "Variety", "title": "Cinelease Buys Up Grip and Lighting Gear From Quixote", "link": "https://variety.com/2026/film/news/cinelease-quixote-lighting-grip-gear-1236861520/", "summary": "Cinelease, the film equipment rental house, announced Tuesday that it is acquiring grip and lighting equipment from Quixote, which continues to shrink its footprint amid a production slump. Quixote announced in April that it was winding down its soundstage business, and is now getting out of the ancillary equipment business as well. The latest news [ ]", "date_str": "2026-09-15T20:53:06+00:00", "hash": "40b6013cef108a8c", "title_fa": "Cinelease لوازم دستگیره و روشنایی را از کیشوت خریداری می کند", "summary_fa": "Cinelease، خانه اجاره تجهیزات فیلم، روز سه‌شنبه اعلام کرد که در حال خرید تجهیزات گیره و نورپردازی از کیشوت است که در بحبوحه رکود تولید همچنان به کاهش ردپای خود ادامه می‌دهد. کیشوت در ماه آوریل اعلام کرد که در حال پایان دادن به کسب و کار خود در زمینه موسیقی است و اکنون از تجارت تجهیزات جانبی نیز خارج می شود. آخرین اخبار [ ] Cinelease، خانه اجاره تجهیزات فیلم، روز سه شنبه اعلام کرد که در حال خرید تجهیزات گیره و نورپردازی از کیشوت است، که در بحبوحه رکود تولید همچنان به کاهش ردپای خود ادامه می دهد. در همین حال، Cinelease به دنبال گسترش فعالیت‌های ورزشی و رویدادهای زنده است، زیرا فراتر از پایگاه خدماتی خود در زمینه تولید فیلم و تلویزیون رشد می‌کند. این شرکت همچنین در حال خرید دارایی‌های تامین تولید کیشوت است که اکنون با نام Cinelease Pro Supplies شناخته می‌شود و همچنین سرویس‌های بهداشتی قابل حمل و تجهیزات ارتباطی آن را خریداری کرده است. محبوب در Variety، لوئیس دارگنزیو، رئیس شرکت، در بیانیه‌ای گفت: ما یک فرصت قابل توجه برای ایجاد Cinelease به یک پلتفرم زیرساخت سرگرمی پیشرو می‌بینیم. استراتژی ما ساده است: سرمایه گذاری روی افراد عالی و قابلیت های مکمل که کار مشتریان ما را آسان تر می کند. با گسترش رویدادهای زنده، ورزش و پروژه های بزرگ، فیلم و تلویزیون پایه و اساس ما باقی خواهند ماند. ما به سرمایه گذاری در قابلیت هایی که به ما امکان می دهد به همه این بازارها در مقیاس بزرگتری خدمت کنیم، ادامه خواهیم داد. Hudson Pacific Properties در سال 2022 در اوج تولید فیلم و تلویزیون داخلی استودیو Quixote را به مبلغ 360 میلیون دلار خریداری کرد و از آن زمان مجبور شد کل سرمایه گذاری را حذف کند. این شرکت در اوایل سال جاری 70 نفر را اخراج کرد و از"}, {"source": "Variety", "title": "Why the Emmys Moving to Amazon Prime Video Won’t Fix What’s Broken With Award Shows", "link": "https://variety.com/2026/tv/awards/emmys-amazon-prime-video-wont-fix-award-shows-1236863243/", "summary": "Spoiler alert: Moving to streaming isn’t enough to fix award show problems. Mariska Hargitay closed the 78th Emmys on Monday night from the Peacock Theater, and the ceremony she sent off may be the last of its kind. Since 1949, the Emmys have belonged to broadcast television. Future editions may not. As Variety exclusively reported, [ ]", "date_str": "2026-09-15T20:41:25+00:00", "hash": "554088938eb1367a", "title_fa": "چرا جابجایی امی ها به آمازون پرایم ویدیو، آنچه را که در نمایش های جوایز شکسته شده است برطرف نمی کند", "summary_fa": "هشدار اسپویلر: انتقال به جریان برای رفع مشکلات نمایش جایزه کافی نیست. ماریسکا هارگیتای هفتاد و هشتمین دوره امی را دوشنبه شب از سالن تئاتر طاووس بست و مراسمی که او فرستاد شاید آخرین مراسم در نوع خود باشد. از سال 1949، جوایز امی متعلق به پخش تلویزیونی است. نسخه های آینده ممکن است اینطور نباشد. همانطور که Variety به طور انحصاری گزارش داد، [ ] ستون مدار جوایز: آمازون می تواند به امی ها خانه جدیدی ببخشد، اما نمی تواند درام دسته بندی را برطرف کند یا مشکلات مدفون در روند رای گیری را حل کند. طبق آخرین قرارداد هشت ساله، که در سال 2018 منعقد شد، این شبکه ها سالانه بیش از 8 میلیون دلار برای حق میزبانی امی پرداخت می کردند. سال گذشته، CBS یک چک هشت رقمی را برای اجرای شبی که متعلق به رقبای استریم خود بود، قطع کرد. پخش تلویزیونی 2025 7.59 میلیون بیننده داشت که بهترین شماره امی از سال 2021 است. HBO Max، Apple TV و Netflix در این شب غالب بودند، در حالی که CBS یک نفر را برای نمایش اخیراً لغو شده The Late Show With Stephen Colbert به خانه برد. سنتی که بر اساس برابری در میان شبکه‌های تلویزیونی بنا شده است می‌تواند به یک مراسم گران‌قیمت تبدیل شود که به نفع رقبای پلتفرم است و نشان می‌دهد که چگونه محتوای یک توزیع‌کننده منفرد نتوانسته طنین‌انداز شود. محبوب در تنوع بر روی کاغذ، مورد آکادمی برای یک مالک واحد قوی است. اگر جوایز امی را به پلتفرمی بسپارید که می‌داند سال به سال آن‌ها را خواهد داشت، آن پلتفرم دلایل زیادی برای سرمایه‌گذاری در نمایش، تبلیغ آن و کشف اینکه واقعاً چه چیزی کار می‌کند دارد. تحت سیستم چرخ، یک شبکه می‌توانست پولی را برای پخش تلویزیونی عالی بریزد و سپس در پاییز بعدی، مخاطبی را که ساخته بود"}, {"source": "Variety", "title": "‘The Gentlemen’ Season 2 Sees Viewership Increase 48% in Second Week While Season 1 Also Climbs the Charts", "link": "https://variety.com/2026/tv/global/the-gentlemen-netflix-season-2-viewing-figures-1236849172/", "summary": "“The Gentlemen” Season 2 has seen a 48% jump in viewership in its second week of release on Netflix. The Guy Ritchie show, which features Theo James and Kaya Scodelario as the managers of a blossoming criminal empire, has seen its second season jump to the top of the streamer’s English language global TV chart [ ]", "date_str": "2026-09-15T20:33:41+00:00", "hash": "a0b013656411a348", "title_fa": "«آقایان» فصل 2 شاهد افزایش 48 درصدی بینندگان در هفته دوم است در حالی که فصل 1 نیز به نمودارها صعود می کند", "summary_fa": "«آقایان» فصل دوم در دومین هفته اکرانش در نتفلیکس شاهد افزایش 48 درصدی بینندگان بوده است. سریال گای ریچی، که تئو جیمز و کایا اسکودلاریو را به عنوان مدیران یک امپراتوری جنایتکار در حال شکوفایی نشان می‌دهد، فصل دوم خود را به صدر جدول تلویزیونی انگلیسی زبان استریمر جهانی رساند [] فصل 2 جنتلمن در دومین هفته اکران خود در نتفلیکس شاهد جهش 48 درصدی بینندگان بوده است. فصل 2 برای اولین بار در سپتامبر پخش شد. 3، با جمع آوری 6.7 میلیون بازدید در سه روز و قرار دادن آن در رتبه 3 نمودار هفته قبل. داستان های مرتبط کیت فلین برنده امی برای بازیگر نقش مکمل زن در کمدی برای Widows Bay: This Role of a Lifetime Emmys Live Updates 2026 در حالی که ارقام هنوز با فصل 1 که 12.2 میلیون بازدید در 3 روز به دست آورد مطابقت ندارد، اما بینندگان پیشنهاد می کنند که در 2 مارس بازگردانده شود. محبوبیت در Variety شاید جای تعجب نباشد که انتشار فصل دوم همچنین باعث شده است که فصل 1 دوباره به جدول صعود کند زیرا مخاطبان برای اولین بار سریال را دوباره تماشا می کنند یا قبل از اینکه احتمالاً به فصل دوم شیرجه بزنند. علیرغم انتشار دو سال و نیم پیش، فصل 1 در همان چارت رتبه 3 را کسب کرد و بین 7 تا 15 سپتامبر بیش از 8 میلیون بازدید داشت. با در نظر گرفتن هر دو فصل با هم، به این معنی است که تقریباً 18 میلیون نفر در طول هفته گذشته The Gentlemen را تماشا کرده اند. جالب است که ببینیم چه تعداد از مخاطبان فصل 1 فعلی در هفته های آینده به فصل 2 نقل مکان می کنند. آرامید تینوبو، منتقد ورایتی، آخرین اجرای برنامه را جذاب، ویرانگر و کاملاً سرگرم کننده خواند و افزود: واضح است که با فصل دوم"}, {"source": "Variety", "title": "‘60 Minutes’ Season Debut Sees 21% Drop in Ratings: Is NFL or CBS News to Blame?", "link": "https://variety.com/2026/tv/news/60-minutes-season-debut-tv-ratings-drop-cbs-news-nfl-blame-1236863080/", "summary": "Was it football, or the overhaul? Ratings for the critical first episode of the new season of 60 Minutes appear to have been tackled by a weaker-than-expected lead-in from an NFL game on CBS, leaving open the question of whether sweeping changes made to the newsmagazine by CBS News management in recent months have [ ]", "date_str": "2026-09-15T20:30:50+00:00", "hash": "ce4c63525cd52447", "title_fa": "اولین فصل «60 دقیقه» با افت 21 درصدی رتبه‌بندی: آیا اخبار NFL یا CBS مقصر هستند؟", "summary_fa": "فوتبال بود یا بازسازی؟ به نظر می‌رسد رتبه‌بندی قسمت اول بحرانی فصل جدید 60 Minutes توسط یک امتیاز ضعیف‌تر از ح     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';

    document.getElementById('searchInput').addEventListener('input', (e) => {
