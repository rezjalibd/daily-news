یاری از کشورهای دیگر چنین برنامه‌ای داشته باشند. ما برای تغییر مواضع آنها آمادگی داریم.» روبیو درباره وضعیت تردد کشتی‌ها در تنگه هرمز نیز گفت نفت همچنان از این آبراه عبور می‌کند و در برخی شب‌ها میزان صادرات نفت به ۸۰ تا ۸۵ درصد سطح پیش از جنگ می‌رسد. به گفته او، دلیل نرسیدن حجم صادرات به سطح کامل پیش از جنگ، جلوگیری از خروج نفت ایران است و نفت جمهوری اسلامی تنها محموله‌ای است که به‌طور مستمر از تنگه هرمز عبور نمی‌کند. وزیر امور خارجه آمریکا همچنین سپاه پاسداران را به تلاش برای هدف قرار دادن کشتی‌های تجاری متهم کرد و گفت نیروهای جمهوری اسلامی هر شب چند پهپاد برای غرق کردن این کشتی‌ها پرتاب", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/-1x-1_uaTX__v1024x512__box_0%2C281%2C1998%2C1333.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۹ آبان • ۱۸:۳۴"}, {"source": "IranWire", "title": "تشکیل پرونده قضایی برای ۳۲ شهروند به‌دلیل حضور در خاکسپاری خسرو علیکردی", "link": "https://iranwire.com/fa/news-1/160061-%D8%AA%D8%B4%DA%A9%DB%8C%D9%84-%D9%BE%D8%B1%D9%88%D9%86%D8%AF%D9%87-%D9%82%D8%B6%D8%A7%DB%8C%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%DB%B3%DB%B2-%D8%B4%D9%87%D8%B1%D9%88%D9%86%D8%AF-%D8%A8%D9%87%D8%AF%D9%84%DB%8C%D9%84-%D8%AD%D8%B6%D9%88%D8%B1-%D8%AF%D8%B1-%D8%AE%D8%A7%DA%A9%D8%B3%D9%BE%D8%A7%D8%B1%DB%8C-%D8%AE%D8%B3%D8%B1%D9%88-%D8%B9%D9%84%DB%8C%DA%A9%D8%B1%D8%AF%DB%8C/", "summary": "خبرگزاری هرانا، روز سه‌شنبه ۱۹ آبان ۱۴۰۵، گزارش داد برای ۳۲ شهروند به‌دلیل حضور در مراسم خاکسپاری خسرو علیکردی، وکیل دادگستری و مدافع حق ...", "date_str": "2026-11-10T15:36:15+00:00", "hash": "aa7dd014cc2bf43e", "title_fa": "تشکیل پرونده قضایی برای ۳۲ شهروند به‌دلیل حضور در خاکسپاری خسرو علیکردی", "summary_fa": "خبرگزاری هرانا، روز سه‌شنبه ۱۹ آبان ۱۴۰۵، گزارش داد برای ۳۲ شهروند به‌دلیل حضور در مراسم خاکسپاری خسرو علیکردی، وکیل دادگستری و مدافع حق ... بر اساس گزارش هرانا، هویت این ۳۲ شهروند احراز شده است: احمد گل‌میشی، جواد قره‌قلی، سعید علی‌آبادی، سامان خیرآبادی، محمدرضا علیکردی، جواد علیکردی، محمدحسین محبی‌زاده، مجتبی نجفی، محمد س ت به ابزاری روزمره برای مسافران و افراد کم‌شنوا هستند، چرا که سازندگانشان امیدوارند آن‌ها روزی جایگزین گوشی‌های هوشمند شوند.", "image_url": "https://images.euronews.com/articles/stories/09/95/86/39/1200x675_cmsv2_07d0a06f-f455-53cf-998c-fb2ee901a9e8-9958639.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۹ آبان • ۱۷:۳۰"}, {"source": "BBC Persian", "title": "همراه داشتن موبایل در مدرسه در انگلستان ممنوع شد", "link": "https://www.bbc.com/persian/articles/cw98z8v1z82jo?at_medium=RSS&at_campaign=rss", "summary": "بر اساس دستورالعمل سخت‌گیرانه‌تر دولت، دانش‌آموزان در انگلستان به هیچ وجه اجازه نخواهند داشت تلفن همراهشان را در مدرسه با خود داشته باشند.", "date_str": "2026-11-10T15:42:24+00:00", "hash": "b598a94b735d352e", "title_fa": "همراه داشتن موبایل در مدرسه در انگلستان ممنوع شد", "summary_fa": "بر اساس دستورالعمل سخت‌گیرانه‌تر دولت، دانش‌آموزان در انگلستان به هیچ وجه اجازه نخواهند داشت تلفن همراهشان را در مدرسه با خود داشته باشند. یک دستورالعمل قانونی که از ژوئن اجرایی شد، مدارس و بنیادهای آموزشی را ملزم می‌کند که در تمام طول روز مدرسه را عاری از تلفن همراه نگه دارند. حالا مسئولان می‌گویند تغییراتی که در این دستورالعمل داده می‌شود و از سپتامبر ۲۰۲۷ اجرایی خواهد شد، از سیاست‌های فعلی «دیده نشود، شنیده نشود» فراتر می‌رود؛ سیاستی که در برخی مدارس اجرا می‌شود و به دانش‌آموزان اجازه می‌دهد تا زمانی که تلفنشان دیده یا شنیده نشود، می‌توانند آن را در کیفشان با خود نگه دارند. این در حالی است که اتحادیه‌های مدیران مدارس می‌گویند که مدارس بدون بودجه اضافی از سوی دولت، برای اجرای سیاست‌های جدید و سخت‌گیرانه‌تر به مشکل می‌خورند. لوسی پاول، وزیر آموزش بریتانیا، گفت که «پیام روشن» دولت به والدین و دانش‌آموزان این است که «مدرسه جای یادگیری و دوستی است، نه اسکرول کردن». به گفته دولت، دسترسی به تلفن همراه «ممکن است بچه‌ها را از یادگیری و از همدیگر دور کند.» مدارس می‌توانند خودشان تصمیم بگیرند چطور این دستورالعمل را اجرا کنند. برخی مدارس برای کیسه‌های دربسته یا کمدهای قفل‌دار هزینه کرده‌اند. برخی دیگر تلفن‌ها را اول روز جمع می‌کنند یا آوردن آنها به مدرسه را ینی خود دیدار کرده بود، مذاکرات را «بسیار سازنده» توصیف کرد. او گفت: «ما معتقدیم که قالب سه‌جانبه مذاکرات در نهایت باید شرکای اروپایی ما را نیز دربر بگیرد، زیرا آنها هم بخشی از راه‌حل بلندمدت این مسئله هستند.» پیش از آغاز مذاکرات، مقام‌های آمریکایی نسبت به دستیابی به پیشرفتی اساسی ابراز خوش‌بینی کرده بودند. استیو ویتکاف، فرستاده ارشد کاخ سفید، گفته بود که احتمالاً در این گفت‌وگوها موضوع بهره‌گیری از «نهادهای امنیتی موجود اروپا» نیز مطرح خواهد شد. جرد کوشنر، داماد دونالد ترامپ، رئیس‌جمهوری آمریکا، و دیگر فرستاده اصلی واشینگتن در این روند، نیز در آغاز نشست گفت که آمریکا برای دستیابی به «راه‌حلی که امیدواریم به جنگ پایان دهد»، اختلاف‌ها را محدودتر کرده است. او جزئیات بیشتری در این زمینه ارائه نکرد. جرد کوشنر از رویکرد کاخ سفید برای ایجاد یک چارچوب امنیتی جدید با اروپا خبر داد با این حال، مقام‌های روسیه تاکنون هیچ نشانه‌ای از آمادگی برای عقب‌نشینی از مطالبات سرسختانه‌ای که از پیش از آغاز تهاجم تمام‌عیار کرملین به اوکراین در فوریه ۲۰۲۲ مطرح بوده‌اند، نشان نداده‌اند.", "image_url": "https://gdb.rferl.org/2e986cd9-d285-4809-be13-dacc2a100f44_cx0_cy4_cw0_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۹ آبان • ۱۹:۱۴"}, {"source": "IranWire", "title": "سه‌شنبه‌های نه به اعدام؛ هشدار درباره موج تازه اعدام‌ها", "link": "https://iranwire.com/fa/news-1/160056-%D8%B3%D9%87%D8%B4%D9%86%D8%A8%D9%87%D9%87%D8%A7%DB%8C-%D9%86%D9%87-%D8%A8%D9%87-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85-%D9%87%D8%B4%D8%AF%D8%A7%D8%B1-%D8%AF%D8%B1%D8%A8%D8%A7%D8%B1%D9%87-%D9%85%D9%88%D8%AC-%D8%AA%D8%A7%D8%B2%D9%87-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85%D9%87%D8%A7/", "summary": "کارزار «سه‌شنبه‌های نه به اعدام» در صد و چهل‌وششمین هفته فعالیت خود اعلام کرد که زندانیان عضو این کارزار، سه‌شنبه ۱۹ آبان۱۴۰۵، در ۶۶ زند ...", "date_str": "2026-11-10T14:31:21+00:00", "hash": "42954c720533ed58", "title_fa": "سه‌شنبه‌های نه به اعدام؛ هشدار درباره موج تازه اعدام‌ها", "summary_fa": "کارزار «سه‌شنبه‌های نه به اعدام» در صد و چهل‌وششمین هفته فعالیت خود اعلام کرد که زندانیان عضو این کارزار، سه‌شنبه ۱۹ آبان۱۴۰۵، در ۶۶ زند ... اعضای این کارزار در بیانیه تازه خود اعلام کرده‌اند که از سه‌شنبه گذشته تاکنون دست‌کم ۱۵ زندانی در ایران اعدام شده‌اند که شش نفر از آن‌ها زندانی سیاسی بوده‌اند. بر اساس آمار ارائه‌شده در این بیانیه، شمار اعدام‌شدگان از ابتدای آبان‌ماه نیز از ۴۰ نفر گذشته است. در این بیانیه آمده است که جمهوری اسلامی سه‌شنبه ۱۲ آبان، هم‌زمان با اعتصاب غذای اعضای کارزار، «امیرحسین ملکی» و «امیرحسین ابراهیمی»، دو زندانی مرتبط با اعتراضات دی‌ماه، را در اصفهان اعدام کرده است. همچنین از اعدام «محمد‌عارف شه‌بخش»، زندانی بلوچ، در روز شنبه و «حسن دیوبند»، «حمید کاظمی» و «رضا زنگنه» در روز یکشنبه در کرج خبر داده شده است. به گفته اعضای کارزار، گزارش‌هایی درباره شکنجه و اجرای اعدام مصنوعی علیه حسن دیوبند و حمید کاظمی، چند روز پیش از اجرای احکام آن‌ها منتشر شده بود. در بخش دیگری از بیانیه، ادعا شده است که «هدایت للری‌زاده» در بازداشتگاه امنیتی اهواز زیر شکنجه جان باخته و پیکر او در بیابان‌های خوزستان رها شده است. ایران‌وایر مستقلاً قادر به تایید جزئیات این ادعا نیست. اعضای کارزار همچنین از صدور احکام اعدام برای شمار دیگری از زندانیان سیاسی طی هفته گذشته خبر داده‌اند. «امیرحسین موسوی»، «امیررضا رضایی»، «وحید قهرمانی»، «مهدی جلالی»، «همایون شبانکاره» و «وحید خدری‌خواه» از جمله افرادی هستند که نامشان در این بیانیه آمده است. این کارزار همچنین نسبت به وضعیت «مهدی زنگنه»، زندانی ۲۰ ساله محبوس در زندان شیبان اهواز، هشدار داده و اعلام کرده است حکم اعدام به او ابلاغ شده، اما وضعیت پرونده‌اش بازتاب رسانه‌ای محدودی داشته است. اعتصاب غذای این هفته در زندان‌هایی از جمله اوین، قزل‌حصار، تهران بزرگ، شیبان اهواز، سپیدار، دستگرد اصفهان، عادل‌آباد شیراز، زاهدان، ارومیه، سنندج، دیزل‌آباد کرمانشاه", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/1_PLVe__v1024x512__box_0%2C210%2C1280%2C882.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۹ آبان • ۱۸:۰۱"}, {"source": "Iran International", "title": "قلعه‌نویی: بازیکنان قدیمی در برنامه ما حضور دارند، سن ملاک اصلی نیست", "link": "https://www.iranintl.com/202611104878", es stacked up — and whether the budget-friendly menu felt worth it. The 12-item list was available on the Aldi app and website. Savannah Born To make things easy, I took a screenshot of the list before shopping. It was also available on Aldi's website and app. The list featured mostly ingredients, a few ready-to-prepare items, and one ready-to-serve food, all inspired by the American Farm Bureau Federation's Thanksgiving Dinner Cost Survey. Aldi's under-$39 Thanksgiving shopping list: 16-pound turkey 3 pounds of sweet potatoes 12-ounce bag of Season's Choice steamable frozen peas (x2) Chef's Cupboard stuffing mix (x3) L'oven Fresh Hawaiian sweet rolls Baby peeled carrots Celery 12 ounces of cranberries Bake House Creations premade pie crusts Friendly Farms whole milk Friendly Farms heavy whipping cream Baker's Corner pumpkin-pie mix A few essentials seemed to be missing from the list, which surprised me. Savannah Born I'd never eaten a Thanksgiving meal without mashed potatoes , so I was surprised potatoes weren't on this year's list. For reference, last year's list had 21 different products, including russet potatoes, green beans, gravy mix, marshmallows, and boxed mac and cheese for a $40 price tag. Comparatively, the 2026 lineup, with 12 products, felt a little meager — even if it was $1 less. I'd have to get creative to spruce up my sweet potatoes without marshmallows, find another way to make gravy, and ski", "date_str": "2026-11-10T17:44:01+00:00", "hash": "3d0e867c00fee69b", "title_fa": "سعی کردم شام شکرگزاری کمتر از 39 دلار آلدی را درست کنم که 10 نفر را سرو می کند", "summary_fa": "من سعی کردم شام 39 دلاری Aldi را برای 10 نفر برای روز شکرگزاری آماده کنم. به نظر ارزش خوبی داشت، و ما غذای زیادی داشتیم، اگرچه برای من هزینه ساخت آن بیش از 39 دلار بود. Savannah Born من سعی کردم از شام زیر 39 دلاری Aldi در روز شکرگزاری برای 10 لیست و برنامه خرید پیروی کنم. از اینکه پوره سیب زمینی گم شده بود و بسیاری از اقلام ضروری در لیست نبودند، ناامید شدم. با این حال، وعده غذایی : "Xbox Cloud Gaming support means you'll be able to stream GTA6 on Xbox One.", "date_str": "2026-11-10T16:12:44+00:00", "hash": "2deb7df0a367626a", "title_fa": "GTA 6 سرعت 30 فریم در ثانیه را هدف قرار می دهد و از ردیابی پرتو در PS5 Pro پشتیبانی می کند", "summary_fa": "پشتیبانی از بازی Xbox Cloud به این معنی است که می‌توانید GTA6 را در ایکس باکس وان استریم کنید. Rockstar Games افزودن Engadget به Google: منبع برگزیده Google Discover همراه با در دسترس قرار دادن Grand Theft Auto 6 برای پیش‌بارگذاری روی Xbox Series X/S و PlayStation 5، Rockstar Games فاش کرده است که طرفداران از نظر عملکرد چه انتظاراتی دارند که بازی در 19 نوامبر منتشر شود. این استودیو گفت که 30 فریم در ثانیه را هدف قرار داده است \"در حالی که هر دو پلتفرم را به حد مطلق خود می رساند تا دنیای وسیع و غنی لئونیدا را زنده کند - در حالی که تراکم و وفاداری بصری تمام محیط ها و ساکنان آن را حفظ می کند.\" در پست وبلاگ Rockstar هیچ اشاره ای به پشتیبانی از 40 فریم در ثانیه یا 60 فریم در ثانیه در PS5 Pro نشده است، اما شاید این موضوع کاهش یابد. با این حال، این بازی در کنسول رده بالاتر سونی چند تقویت خواهد داشت. این فناوری ارتقاء مقیاس سونی پلی استیشن Spectral Super Resolution را پشتیبانی خواهد کرد. در آینده‌ای قابل پیش‌بینی، PS5 Pro تنها راه برای اجرای بازی با سایه‌های ردیابی پرتو خواهد بود، اما مطمئناً زمانی که GTA 6 به ناچار روی رایانه شخصی فرود آمد، تغییر خواهد کرد. Rockstar اضافه کرد که \"بازخورد لمسی با کیفیت بالا به طور کامل در سراسر بازی یکپارچه شده است\" برای کنترلرهای DualSense، به همراه \"صدای فضایی بهبود یافته\" برای استفاده کامل از Tempest 3D Audio در PS5. علاوه بر این، استودیو گفت که زمان بارگذاری بهتری روی کنسول‌های سونی نیز وجود دارد. همانطور که انتظار می رفت، پشتیبانی از بازی از راه دور برای پلی استیشن و ایکس باکس وجود دارد. شما می‌توانید GTA 6 را از طریق Xbox Cloud Gaming روی کنسول‌ها (از جمله Xbox One) نیز بازی", "image_url": "https://www.engadget.com/img/gallery/gta-6-is-targeting-30-fps-and-has-ray-tracing-support-on-ps5-pro/l-intro-1794327030.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], امه Apple TV بروید تا ویژگی زبان اشاره را روشن کنید. پس از آن، هنگامی که در حال مرور یا جستجوی چیزی برای تماشا هستید، باید آن را به عنوان یک گزینه در عناوین پشتیبانی شده ببینید. برای مثال، نماد زبان اشاره، که شبیه دست کمی مایل یا تکان دهنده است، در کنار سایر نمادها مانند AD برای توضیحات صوتی ظاهر می شود.", "image_url": "https://www.engadget.com/img/gallery/apple-brings-sign-language-interpretation-to-a-selection-of-original-apple-tv-titles/l-intro-1794283507.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "سینما"], "datetime_fa": "۱۹ آبان • ۱۹:۳۰"}, {"source": "Wired", "title": "‘We Have to Take Over’: Far-Right Extremists Want to Seize Control of the GOP", "link": "https://www.wired.com/story/we-have-to-take-over-far-right-extremists-want-to-seize-control-of-the-gop/", "summary": "MAGA failed because it didn't go far enough, right-wing extremists say—and following devastating midterm losses, they see an opportunity to take over.", "date_str": "2026-11-10T16:40:19+00:00", "hash": "ec65e97b2d5974ec", "title_fa": "\"ما باید کنترل کنیم\": افراط گرایان راست افراطی می خواهند کنترل جمهوری خواهان را در دست بگیرند", "summary_fa": "افراط گرایان راست می گویند MAGA شکست خورد زیرا به اندازه کافی پیش نرفت - و پس از شکست های ویرانگر میان دوره ای، آنها فرصتی را برای تصاحب آن می بینند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان در روز انتخابات هفته گذشته، نیک فوئنتس ملی‌گرای سفیدپوست از حامیان خود در X خواست که «امروز بیرون بروید و به دموکرات رأی دهید». این پست بیش از 12 میلیون بازدید داشت. ساعاتی بعد، در پی پیروزی دموکرات ها، فوئنتس اعتبار این پیروزی را بر عهده گرفت. او در تلگرام نوشت: «دوباره این کار را انجام دادیم» و بعداً این پدیده را «اثر گرایپر» نامید که اشاره‌ای به لقبی است که به دنبال‌کنندگانش داده‌اند. فوئنتس در روزهای اخیر مدعی شده است که نتایج انتخابات فرصتی برای او و متحدانش در راست افراطی است. فوئنتس در جریان پخش زنده هفته گذشته گفت: «اجازه دهید دموکرات ها حکومت کنند، ببینید چطور پیش می رود. زمانی فرا می رسد که چپ های ی خودرو را خلاص می‌کنید، ارتباط موتور با چرخ‌ها قطع می‌شود و موتور برای روشن‌ماندن باید همچنان در دور آرام کار کند. در این وضعیت، واحد کنترل الکترونیکی موتور (ECU) سوخت تزریق می‌کند تا موتور خاموش نشود. اما وقتی خودرو در دنده قرار دارد و پای راننده از روی گاز برداشته می‌شود، چرخ‌ها از طریق گیربکس همچنان موتور را می‌چرخانند. در خودروهای انژکتوری مجهز به این قابلیت، ECU در شرایط مشخصی تزریق سوخت را متوقف می‌کند و موتور بدون مصرف سوخت به چرخش ادامه می‌دهد. کپی لینک سیستم قطع سوخت هنگام کاهش سرعت چگونه کار می‌کند؟ این سیستم معمولاً زمانی فعال می‌شود که چند شرط هم‌زمان برقرار باشند: موتور به دمای کاری رسیده باشد، پدال گاز رها شده باشد و دور موتور از محدوده‌ی دور آرام بالاتر باشد. در چنین شرایطی، ECU دستور قطع پاشش سوخت را به انژکتورها می‌دهد. به‌محض اینکه راننده دوباره پدال گاز را فشار دهد یا دور موتور به محدوده‌ی نزدیک دور آرام برسد، تزریق سوخت از سر گرفته می‌شود. به این ترتیب، موتور هم در کاهش سرعت سوخت مصرف نمی‌کند و هم هنگام نیاز دوباره آماده‌ی شتاب‌گیری است. البته این قابلیت در همه‌ی خودروها دقیقاً با شرایط یکسانی فعال نمی‌شود و آستانه‌ی دور موتور و دمای", "image_url": "https://api2.zoomit.ir/media/car-fuel-consumption-downhill-6af3264c1e22a6ae5bd3e93f?w=1920&q=75", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۲۰:۰۰"}, {"source": "Zoomit", "title": "گوشت‌خواری برخلاف باور رایج موجب افزایش تستوسترون نمی‌شود", "link": "https://www.zoomit.ir/health-medical/470836-meat-diet-testosterone-protein-study/", "summary": "برخلاف باور رایج، مصرف بیشتر گوشت و پروتئین حیوانی لزوماً تستوسترون را افزایش نمی‌دهد و حتی ممکن است با کاهش آن مرتبط باشد.", "date_str": "2026-11-10T16:20:00+00:00", "hash": "d1950089422d06c7", "title_fa": "گوشت‌خواری برخلاف باور رایج موجب افزایش تستوسترون نمی‌شود", "summary_fa": "برخلاف باور رایج، مصرف بیشتر گوشت و پروتئین حیوانی لزوماً تستوسترون را افزایش نمی‌دهد و حتی ممکن است با کاهش آن مرتبط باشد. تبلیغات در سال‌های اخیر، برخی اینفلوئنسرهای شبکه‌های اجتماعی رژیم گوشت‌خواری را راهکاری برای افزایش تستوسترون معرفی کرده‌اند. در این رژیم، افراد عمدتاً گوشت و سایر محصولات حیوانی مصرف می‌کنند و بسیاری از مواد غذایی گیاهی را کنار می‌گذارند. بااین‌حال، شواهد علمی معتبری وجود ندارد که نشان دهد مصرف بیشتر گوشت به افزایش تستوسترون منجر می‌شود. به‌گزارش ساینس‌آلرت ، پژوهشگران دانشگاه فنلاند شرقی با بررسی رژیم غذایی و سطح هورمون‌های ۲۵۴۶ مرد ۴۲ تا ۶۰ ساله دریافتند افرادی که نسبت بیشتری از پروتئین موردنیاز خود را از منابع حیوانی دریافت می‌کردند، سطح تستوسترون پایین‌تری داشتند. تستوسترون یکی از هورمون‌های اصلی جنسی مردانه است که در حفظ توده‌ی عضلانی، سلامت استخوان‌ها و عملکرد جنسی نقش دارد. با وجود ارتباط پروتئین حیوانی با رشد عضلات، یافته‌های جدید نشان می‌دهد که این ارتباط لزوماً به معنای افزایش تستوسترون نیست. در مطالعه‌ی جدید، شرکت‌کنندگان خوراکی‌های مصرف‌شده‌ی خود را در طول چهار روز ثبت کردند. پژوهشگران سپس ارتباط میان منابع مختلف پروتئین و سطح تستوسترون خون آن‌ها را بررسی کردند. مردانی که پروتئین گیاهی بیشتری از منابعی مانند حبوبات، سبزیجات و مغزها دریافت می‌کردند، سطح تستوسترون آزاد بالاتری داشتند نتایج نشان داد مردانی که نسبت پروتئین حیوانی به گیاهی در رژیم غذایی‌شان بالاتر بود، سطح تستوسترون کل پایین‌تری داشتند. همچنین بیشترین نسبت مصرف پروتئین حیوانی به گیاهی با پایین‌ترین سطح تستوسترون آزاد همراه بود. در مقابل، مصرف بیشتر پروتئین گیاهی از منابعی غیر از غلات، مانند حبوبات، سبزیجات و مغزها، با سطح بالاتر تستوسترون آزاد ارتباط داشت. تستوسترون آزاد بخشی از این هورمون است که به پروتئین‌های خون متصل نیست و برای استفاده‌ی بافت‌های بدن در دسترس قرار دارد. اندازه‌گیری آن می‌تواند اطلاعات تکمیلی درباره‌ی وضعیت هورمونی فرد ارائه دهد.", "image_url": "https://api2.zoomit.ir/media/man-grilling-meat-outdoor-6af296c01e22a6ae5bd3e728?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۱۹:۵۰"}, {"source": "Zoomit", "title": "چرا تابلو جاده در تاریکی می‌درخشد؟", "link": "https://www.zoomit.ir/zoomplus/470751-how-road-signs-glow-night/", "summary": "تابلوهای جاده با بهره‌گیری از یک فناوری ساده اما کاربردی، در تاریکی هم می‌درخشند و به لامپ نیاز ند , {"source": "Business Insider", "title": "Almost nobody uses AI agents to order food or rides on apps like Uber", "link": "https://www.businessinsider.com/ai-agents-drive-few-uber-doordash-orders-despite-hype-2026-11", "summary": "AI agents were the source of four ride-hailing trips during one of the company s busiest weeks. David Paul Morris/Bloomberg via Getty Images AI agents aren't taking off on apps like Uber and DoorDash. The AI tools have generated hundreds of food and ride-hailing orders, the companies said. Shoppers have said that agents can make mistakes and need guardrails to be useful. AI agents aren't getting much love from restaurant patrons or ride-hailing passengers. Despite predictions that agents will revolutionize ordering stuff online, both Uber and DoorDash mentioned on their latest earnings calls that they've received hundreds of orders through AI agents like Meta's Muse or Instinct. Those are tiny numbers compared to the millions of rides and deliveries that the companies complete each day. For example, Uber provided 320 million ride-hailing and delivery trips during the last week of October, CFO Balaji Krishnamurthy said on Uber's third-quarter earnings call on Wednesday. It was \"one of our largest weeks\" thanks to Halloween orders , Krishnamurthy said. Only about 500 of those Uber Eats orders came from AI agents, he said. And agents were the source of four ride-hailing trips during the week. \"It is very, very early, and very limited traction that we have seen so far,\" Krishnamurthy said. The comments came a week after DoorDash CEO Tony Xu said that his company had received \"several hundred orders in total\" from AI agents. That's a sliver of the billions of orders that DoorDash delivers annually. Some AI users have put agents in charge of buying everything from plane tickets to groceries for them. Shoppers have also said the tools are useful for monitoring prices. Ordering errors and fears about the agents going rogue with credit card . و ماموران منبع چهار سفر سواری در طول هفته بودند. کریشنامورتی گفت: «کشش بسیار بسیار زود و بسیار محدودی است که تاکنون دیده‌ایم. این اظهارات یک هفته پس از آن بیان شد که مدیر عامل DoorDash تونی زو گفت که شرکت او \"در مجموع چند صد سفارش\" از عوامل هوش مصنوعی دریافت کرده است. این برشی از میلیاردها سفارشی است که DoorDash سالانه تحویل می دهد. برخی از کاربران هوش مصنوعی ماموران را مسئول خرید همه چیز از بلیط هواپیما گرفته تا مواد", "image_url": "https://i.insider.com/6af32b098f37e8e0b5babbf6?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "عامل‌های هوشمند"], "datetime_fa": "۱۹ آبان • ۱۹:۳۹"}, {"source": "Business Insider", "title": "The most iconic Italian restaurant in every US state", "link": "https://www.businessinsider.com/most-iconic-famous-italian-restaurant-every-state", "summary": "From historic pizza joints to elevated pasta spots, these are the most iconic Italian restaurants in every state. OlyaSolodenko/Getty Images Italian restaurants nationwide are often rich in history and beloved by their local communities. Fior d'Italia in San Francisco is widely recognized as the oldest Italian restaurant in the country. We found iconic Italian restaurants based on customer reviews, their reputations, and local history. Few meals feel more suited to a cozy autumn night out than dinner at a beloved local Italian restaurant. From red-sauce institutions to hole-in-the-wall pizza joints, Italian restaurants remain some of the most enduring gathering places in communities across the US. We identified an iconic Italian restaurant in every state, weighing local legacy, longtime popularity, cultural impact, customer feedback, and the signature dishes that have earned each spot a devoted following. The list includes historic institutions like Fior d'Italia in San Francisco — widely believed to be the oldest Italian restaurant in the country, dating back to 1886 — and beloved neighborhood staples like Mystic Pizza in Connecticut. Here are the most iconic and enduring Italian restaurants in every state. ALABAMA: Gianmarco s Restaurant in Birmingham Gianmarco s Restaurant. Destiny R./Yelp Gianmarco's Restaurant is a Birmingham staple founded by a father-and-sons trio who have brought generations of Italian family recipes to the city for nearly 20 years. The upscale yet welcoming spot is known for handmade pastas, fresh seafood, and signature dishes, such as veal Parmesan and house-made gnocchi, all served in an intimate, old-world setting. ALASKA: In Bocca Al Lupo in Juneau In Bocca Al Lupo. King L./Yelp In Bocca Al Lupo is led by six-time James Beard award-nominated chef Beau Schooler and brings a modern, handmade approach to Italian cooking in downtown Juneau. The restaurant has earned a loyal following for its fresh, house-made pastas, creative small plates, and seasonal ingredients, offering a refined take on Italian cuisine in Alaska's capital. ARIZONA: Marcellino Ristorante in Scottsdale Marcellino Ristorante Marcellino Ristorante/Yelp Marcellino Ristorante is led by Italian-born chef Marcellino Verzino, who brings decades of culinary experience to his Scottsdale establishment. The intimate restaurant is known for fresh pasta, seafood, and rotating regional dishes that showcase authentic Italian cooking methods. ARKANSAS: Bruno s Little Italy in ", "date_str": "2026-11-10T16:06:38+00:00", "hash": "166ad8a1f44ed93b", "title_fa": "نمادین ترین رستوران ایتالیایی در هر ایالت آمریکا", "summary_fa": "از رستوران‌های تاریخی پیتزا گرفته تا مکان‌های مرتفع پاستا، اینها نمادین‌ترین رستوران‌های ایتالیایی در هر ایالت هستند. OlyaSolodenko/Getty Images رستوران های ایتالیایی در سرتاسر کشور اغلب از نظر تاریخی غنی هستند و جوامع محلی خود را دوست دارند. Fior d'Italia در سانفرانسیسکو به طور گسترده ای به عنوان قدیمی ترین رستوران ایتالیایی در این کشور شناخته می شود. ما رستوران‌های ایتالیایی نمادین را بر اساس نظرات مشتریان، شهرت آن‌ها و تاریخ محلی پیدا کردیم. تعداد کمی از وعده های غذایی برای یک شب دنج پاییزی مناسب تر از شام در یک رستوران محلی محبوب ایتالیایی هستند. از موسسات سس قرمز گرفته تا محل اتصال پیتزاهای سوراخ‌دار، رستوران‌های ایتالیایی برخی از ماندگارترین مکان‌های تجمع در جوامع سراسر ایالات متحده هستند. ما یک رستوران ایتالیایی نمادین را در هر ایالت شناسایی کردیم که میراث محلی، محبوبیت طولانی مدت، تأثیر فرهنگی، بازخورد مشتریان و غذاهایی که هر یک از آن‌ها طرفداران اختصاصی را به خود اختصاص داده‌اند را می‌سنجید. این فهرست شامل موسسات تاریخی مانند Fior d'Italia در سانفرانسیسکو است - که به طور گسترده ای به عنوان قدیمی ترین رستوران ایتالیایی در کشور شناخته می شود و قدمت آن به سال 1886 باز می گردد - و محصولات اصلی محله محبوب مانند Mystic Pizza در کانکتیکات. در اینجا نمادین ترین و ماندگارترین رستوران های ایتالیایی در هر ایالت وجود دارد. آلاباما: رستوران جیانمارکو در بیرمنگام رستوران جیانمارکو. رستوران Destiny R./Yelp Gianmarco یک غذای اصلی در بیرمنگام است که توسط سه پدر و پسری تأسیس شده است که برای نزدیک به 20 سال است که چندین نسل از دستور العمل های خانوادگی ایتالیایی را به این شهر آورده اند. این مکان مجلل و در عین حال دلپذیر به‌خاطر پاستاهای دست‌ساز، غذاهای دریایی تازه، و غذاهای خاص، مانند پارمزان گوشت گوساله و گنوکی‌های خانگی، که همگی در محیطی صمیمی و قدیمی سرو می‌شوند، شناخته", "image_url": "https://i.insider.com/6af23673eaa5e46dca228716?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۱۹:۳۶"}, {"source": "Business Insider", "title": "This startup says AI agents suffer from 'amnesia.' It raised $35 million to solve that with this pitch deck.", "link": "https://www.businessinsider.com/graphon-pitch-deck-funding-ai-agents-amnesia-2026-10", "summary": "Graphon has raised $35 million. Graphon Labs Graphon has raised $35 million to enhance AI data mapping for businesses and developers. Graphon says it creates a “fabric” of information, rather than retrieving data in individual pieces. Check out the pitch deck it used to secure the new funding: AI agents can write code, search databases, and carry out multistep tasks. But they can still lose track of past conversations and struggle to make sense of huge, changing troves of company information. San Francisco-based Graphon is trying to solve that problem with software that lets agents store and retrieve information over time. Now, it has raised $35 million to further build and sell its technology. The company’s name comes from “graphons,” a mathematical framework founder and CEO Arbaaz Khan used during his Ph.D. research into coordinating swarms of robots . Rather than treating a company’s documents, videos, and images as isolated snippets, Graphon maps the connections among them — including where information came from and when it changed. Khan compared common AI search systems to tearing pages out of a book, crumpling them up, and tossing them into a bin. “Now when you go searching that trash can, you’re just trying to find the pieces to answer,” he told Business Insider. “You’ve basically lost all that information because each piece is living on its own.” Graphon, he said, instead creates a connected “fabric” of information. The company says it has two groups of customers in mind: individual developers and companies with enormous stores of technical and operational data like industrial businesses, financial services, and healthcare companies. “You can basically point your Claude or GPT or whatever to Graphon,” Khan said about the product being compatible with any off-the-shelf agents. “You can push in any amount of data in this, and we literally mean any.” Graphon says its software is already used by the San Francisco 49ers and HP. The company's $35 million Series A round was led by RRE Ventures, with participation from Energy Impact Partners, Hitachi Ventures, Gaia VC, and HP. The company closed a roughly $8 million seed round earlier this year. Graphon, which has 20 employees, plans to use the cash injection primarily to hire engineers and researchers, as well as some sales and go-to-market staff. Khan said the company expects to remain focused on enterprise customers before moving further into personal devices and consumer products. Check out the pitch d", "date_str": "2026-11-10T16:01:01+00:00", "hash": "9e29b6fc50b28299", "title_fa": "این استارت‌آپ می‌گوید عوامل هوش مصنوعی از «فراموشی» رنج می‌برند. 35 میلیون دلار برای حل این مشکل با این بازی جمع آوری کرد.", "summary_fa": "Graphon 35 میلیون دلار جمع آوری کرده است. Graphon Labs Graphon 35 میلیون دلار برای بهبود نقشه برداری داده های هوش مصنوعی برای مشاغل و توسعه دهندگان جمع آوری کرده است. Graphon می‌گوید به جای بازیابی داده‌ها در تکه‌های جداگانه، یک «پارچه» از اطلاعات ایجاد می‌کند. عرشه زمینی را که برای تأمین بودجه جدید استفاده کرده است، بررسی کنید: عوامل هوش مصنوعی می‌توانند کد بنویسند، پایگاه‌های داده جستجو کنند و وظایف چند مرحله‌ای را انجام دهند. اما آنها هنوز هم می توانند مسیر مکالمات گذشته را از دست بدهند و تلاش کنند تا حجم عظیم و متغیر اطلاعات شرکت را درک کنند. Graphon مستقر در سانفرانسیسکو در حال تلاش برای حل این مشکل با نرم افزاری است که به عوامل اجازه می دهد اطلاعات را در طول زمان ذخیره و بازیابی کنند. اکنون 35 میلیون دلار برای ساخت و فروش بیشتر فناوری خود جمع آوری کرده است. نام این شرکت از «گرافون» گرفته شده است، بنیانگذار چارچوب ریاضی و مدیرعامل ارباز خان که در دوره دکترای خود از آن استفاده کرد. تحقیق در مورد هماهنگ کردن دسته ای از روبات ها Graphon به جای اینکه اسناد، ویدئوها و تصاویر یک شرکت را به‌عنوان تکه‌های مجزا تلقی کند، ارتباط بین آنها را نقشه‌برداری می‌کند - از جمله اینکه اطلاعات از کجا آمده و چه زمانی تغییر کرده است. خان سیستم‌های جستجوی متداول هوش مصنوعی را با پاره کردن صفحات یک کتاب، مچاله کردن و انداختن آنها به سطل زباله مقایسه کرد. او به Business Insider گفت: «اکنون وقتی آن سطل زباله را جستجو می‌کنید، فقط سعی می‌کنید تکه‌هایی را برای پاسخ پیدا کنید. \"شما اساساً همه این اطلاعات را از دست داده اید زیرا هر قطعه به تنهایی زندگی می کند.\" او گفت که Graphon در عوض یک \"پارچه\" متصل از اطلاعات ایجاد می کند. این شرکت می‌گوید دو گروه مشتری", "image_url": "https://i.insider.com/6af26b30eaa5e46dca22892e?width=1200&format=jpeg", "categor  evaluated across more than 200 activities, including serving food with tongs and using a pipette, as you would see in a laboratory. Google also showed that Apptronik’s Apollo 2 humanoid robot with Gemini Robotics 2.5 can now tie a bow with its five-fingered hands, a notable feat, because deformable objects (like ribbon) are notoriously difficult for robots to manipulate. Read full article Comments", "date_str": "2026-11-10T15:00:39+00:00", "hash": "93a37857bde4969a", "title_fa": "DeepMind از Gemini Robotics 2.5 و معیار ایمنی باز \"ASIMOV-jailbreak\" رونمایی کرد.", "summary_fa": "Google DeepMind نسل جدیدی از پلتفرم Gemini Robotics مجهز به هوش مصنوعی را معرفی کرده است. در نسخه 2.5، گوگل می گوید که هوش مصنوعی رباتیک آن به طرز وسوسه انگیزی به انجام وظایف دنیای واقعی و همچنین انسان ها نزدیک شده است. در واقع، برخی از ربات‌های جمینی توانستند کار واقعی را در کارخانه‌های مرسدس بنز انجام دهند و تیم در حال آماده شدن برای روزی است که روبات‌ها در کنار انسان‌ها با معیار ایمنی منبع باز کار کنند. پلتفرم هوش مصنوعی فیزیکی DeepMind دارای چندین لایه محاسباتی بین ورودی کاربر و عملکرد روباتیک است. قطعه مدل زبان بینایی وجود دارد که جمینی تجسم یافته است. اساساً، دستورالعمل‌های شما را می‌گیرد و از ویدیوی زنده برای برنامه‌ریزی چگونگی انجام این کار توسط ربات استفاده می‌کند. مؤلفه اصلی دیگر، زبان بینایی-عملی (VLA) است که در واقع اقدامات ربات را ایجاد می کند، مانند حرکت دادن یک محرک - این Gemini Robotics است که به نسخه 2.5 رسیده است. DeepMind می گوید که Gemini Robotics 2.5 در کارهایی که نیاز به مهارت بالایی دارند، بسیار بهتر است. این مدل در بیش از 200 فعالیت مورد ارزیابی قرار گرفت، از جمله سرو غذا با انبر و استفاده از پیپت، همانطور که در آزمایشگاه می بینید. گوگل همچنین نشان داد که ربات انسان نمای آپترونیک آپولو 2 با Gemini Robotics 2.5 اکنون می تواند با دستان پنج انگشت خود کمان ببندد، این یک شاهکار قابل توجه است، زیرا دستکاری اشیاء تغییر شکل پذیر (مانند روبان) برای روبات ها بسیار دشوار است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش Google DeepMind نسل جدیدی از پلتفرم Gemini Robotics مجهز به هوش مصنوعی را معرفی کرده است. در نسخه 2.5، گوگل می گوید", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/Credit_-Apptronik_-Mercedes-Benz-Apollo-2-using-Gemini-Robotics-2.5-to-autonomously-perform-automotive-kitting-at-a-Mercedes-Benz-factory-2560x1440.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Google"], "datetime_fa": "۱۹ آبان • ۱۸:۳۰"}, {"source": "Ars Technica", "title": "Nvidia has a Jensen Huang problem—and no obvious successor", "link": "https://arstechnica.com/gadgets/2026/11/nvidia-has-a-jensen-huang-problem-and-no-obvious-successor/", "summary": "The investigation of Jensen Huang by Nvidia’s board threatens the future of one of Silicon Valley’s longest-serving executives and a key enabler of the AI boom, who has no obvious successor as leader of the world’s second-most-valuable company. Huang is fighting for survival after admitting to an extramarital affair, believed to be with an executive at a large Nvidia customer whom US officials also allege was working as a Chinese spy. The prospect that Huang could be forced out as chief executive of the US chipmaker he co-founded more than 30 years ago has alarmed investors and allies in the tech industry. Shares in Nvidia, which late last month ceded its position as the world’s most valuable to Apple amid a broader sell-off in AI stocks, had fallen more than 5 percent by midday trading on Monday. Read full article Comments", "date_str": "2026-11-10T14:53:05+00:00", "hash": "61cd548ca881f6cd", "title_fa": "انویدیا یک مشکل جنسن هوانگ دارد و جانشین مشخصی ندارد", "summary_fa": "تحقیقات جنسن هوانگ توسط هیئت مدیره انویدیا، آینده یکی از باسابقه‌ترین مدیران سیلیکون ولی و یکی از عوامل کلیدی رونق هوش مصنوعی را تهدید می‌کند، کسی که جانشین آشکاری به عنوان رهبر دومین شرکت ارزشمند جهان ندارد. هوانگ پس از اعتراف به رابطه خارج از ازدواج با یکی از مدیران اجرایی یکی از مشتریان بزرگ انویدیا که مقامات آمریکایی همچنین ادعا می کنند به عنوان جاسوس چینی کار می کرد، برای زنده ماندن می جنگد. دورنمای اخراج هوانگ به عنوان مدیر اجرایی تراشه‌ساز آمریکایی که بیش از 30 سال پیش تأسیس کرد، سرمایه‌گذاران و متحدان صنعت فناوری را نگران کرده است. سهام انویدیا که اواخر ماه گذشته در بحبوحه فروش گسترده سهام هوش مصنوعی جایگاه خود را به عنوان با ارزش ترین سهام جهان به اپل واگذار کرد، تا معاملات ظهر روز دوشنبه بیش از 5 درصد کاهش یافت. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید تحقیق درباره جنسن هوانگ توسط هیئت مدیره انویدیا، آینده یکی از باسابقه‌ترین مدیران سیلیکون ولی و یک عامل کلیدی برای دومین شرکت بی‌نظیر هوش مصنوعی، که دومین شرکت بدون موفقیت در جهان است، تهدید می‌کند. شان مگوایر، شریک سرمایه گذار اولیه انویدیا Sequoia Capital، در یک پست رسانه اجتماعی گفت: \"جنسن برای رهبری هوش مصنوعی آمریکا غیرقابل جایگزین است.\" تراشه های انویدیا در ایجاد ابزارهای مولد هوش مصنوعی مانند ChatGPT نقش مهمی داشتند و اکنون در مرکز دیوانگی زیرساخت های هوش مصنوعی یک تریلیون دلاری Big Tech قرار دارند. هوانگ شخصا پشت سرمایه‌گذاری‌ها و تضمین‌های صدها میلیارد دلاری برای ده‌ها استارت‌آپ و ارائه‌دهنده مراکز داده هوش مصنوعی ایستاده است، و همچنین از دونالد ترامپ رئیس‌جمهور ایالات متحده برای مقررات ضعیف‌تر هوش مصنوعی لابی کرده است.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2024/11/jensen_huang-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Nvidia", "Apple"], "datetime_fa": "۱۹ آبان • ۱۸:۲۳"}, {"source": "Ars Technica", "title": "FDA warns GLP-1 drugs may pose risk of rare condition that causes vision loss", "link": "https://arstechnica.com/health/2026/11/glp-1-drugs-may-increase-risk-of-vision-loss-from-rare-condition-fda-warns/", "summary": "The Food and Drug Administration is warning that popular obesity drugs—including Ozempic, Wegovy, Zepbound, and Mounjaro—may carry a \"potential increased risk\" of a rare eye condition that can lead to permanent vision loss. In a drug safety communication Monday , the FDA said it will now require makers of GLP-1 receptor agonist drugs to add a warning about that risk on their drug labels. The specific eye condition it warns of is called non-arteritic anterior ischemic optic neuropathy or NAION . The condition is caused by restricted blood flow to the optic nerve, which leads to swelling and cell death and ultimately damages the nerve, causing abrupt vision loss that can often be permanent. It's unknown how GLP-1 drugs may cause NAION. The condition is rare overall, occurring in somewhere between two and 10 people in 100,000 in the general population, according to the American Academy of Ophthalmologists. These small numbers have made it more difficult to determine with certainty if there is a connection. Further complicating the potential link is the fact that the risk factors for developing NAION are common among patients taking GLP-1 drugs. The risk factors include diabetes, cardiovascular disease, high blood pressure, high cholesterol, metabolic syndrome, and obstructive sleep apnea. Read full article Comments", "date_str": "2026-11-10T14:43:49+00:00", "hash": "5b1365dc95bcfd1f", "title_fa": "FDA هشدار می دهد که داروهای GLP-1 ممکن است خطر بیماری نادری را ایجاد کنند که باعث از دست دادن بینایی می شود", "summary_fa": "سازمان غذا و دارو هشدار می دهد که داروهای رایج چاقی - از جمله Ozempic، Wegovy، Zepbound و Mounjaro - ممکن است \"خطر افزایش بالقوه\" یک بیماری نادر چشمی را داشته باشند که می تواند منجر به از دست دادن دائمی بینایی شود. در یک ارتباط ایمنی دارو در روز دوشنبه، FDA گفت که اکنون از سازندگان داروهای آگونیست گیرنده GLP-1 می خواهد تا هشداری در مورد این خطر روی برچسب دارویی خود اضافه کنند. بیماری خاص چشمی که هشدار می دهد نوروپاتی ایسکمیک اپتیک غیر شریانی یا NAION نامیده می شود. این عارضه به دلیل محدود شدن جریان خون به عصب بینایی ایجاد می شود که منجر به تورم و مرگ سلولی می شود و در نهایت به عصب آسیب می رساند و باعث از دست دادن ناگهانی بینایی می شود که اغلب می تواند دائمی باشد. ناشناخته است که چگونه داروهای GLP-1 ممکن است باعث NAION شوند. به گفته آکادمی چشم پزشکان آمریکا، این وضعیت به طور کلی نادر است و در بین دو تا 10 نفر از 100000 نفر در جمعیت عمومی رخ می دهد. این اعداد کوچک تشخیص قطعی در مورد وجود ارتباط را دشوارتر کرده است. پیچیدگی بیشتر پیوند بالقوه این واقعیت است که عوامل خطر برای ایجاد NAION در بین بیمارانی که داروهای GLP-1 مصرف می کنند رایج است. عوامل خطر عبارتند از دیابت، بیماری های قلبی عروقی، فشار خون بالا، کلسترول بالا، سندرم متابولیک و آپنه انسدادی خواب. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید سازمان غذا و دارو هشدار می‌دهد که داروهای رایج چاقی - از جمله Ozempic، Wegovy، Zepbound و Mounjaro - ممکن است منجر به \"از دست دادن چشم بالقوه\" شود.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/02/GettyImages-1716643505-2560x1440.jpg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۱۸:۱۳"}, {"source": "Ars Technica", "title": "Polestar has a new look with its Formula 2030 concept", "link": "https://arstechnica.com/cars/2026/11/polestar-has-a-new-look-with-its-formula-2030-concept/", "summary": "Perhaps only a small percentage of Ars readers will care about the Polestar 2030 concept, debuted today by the electric automaker. Spun out of Volvo—once upon a time, Polestar was a racing team—the brand has leveraged the resources of parent-automaker Geely to create electric vehicles that marry a modern minimalist style with rewarding driving dynamics . But you now can’t buy any Polestars in the US , since Geely is Chinese, and banning Chinese-owned car brands enjoys remarkable bipartisan support in Congress. The Formula 2030 is about the same length as a Polestar 2 but with a very low roofline. If anything, the two-box shape reminds me of the Saab Aero-X, one ovies.\" One thing he realized was that he would have to speak up for himself. He'd find his voice on the set of the indie crime drama \"Five Corners\" (1988). \"For me, that was the first time that I really asserted myself, speaking out and saying I'm not going to do certain things,\" Turturro recalled. \"That was the first time, at that stage in my life, that I gave a full performance that really landed the way I wanted it to.\" The performance would also grab the attention of Spike Lee, who would go on to cast Turturro in \"Do the Right Thing.\" The duo have collaborated on eight other movies since. Decades after his early foray ", "date_str": "2026-11-10T15:10:28+00:00", "hash": "fad873ed5485b110", "title_fa": "جان تورتورو می‌گوید که در اوایل کارش با کارگردان‌های «سوءاستفاده‌کننده» کار کرده است", "summary_fa": "جان تورتورو. دیا دیپاسوپیل/ گتی جان تورتورو به آغاز کار خود در دهه 1980 نگاه کرد. او کار با کارگردانانی را به یاد می آورد که او آنها را \"مرز فراتر از سوء استفاده\" توصیف کرد. او به بیزینس اینسایدر گفت: «خشونت زیادی به بازیگران آن فیلم‌ها شد. بازیگر افسانه ای جان تورتورو بیشتر به خاطر خلق شخصیت های به یاد ماندنی از طریق همکاری با کارگردانانی مانند اسپایک لی و برادران کوئن شناخته می شود. اما در اوایل کارش، کار تورتورو با برخی کارگردانان باعث شد که او کمتر شبیه یک همکار و بیشتر شبیه کیسه بوکس باشد. تورتورو کار خود را در فیلم‌های سینمایی در دوران پرشتاب دهه 1980 آغاز کرد و نقش‌هایی را در فیلم‌های ساخته‌شده توسط نام‌های معتبری مانند ویلیام فریدکین (\"زندگی و مردن در لس آنجلس\")، وودی آلن (\"هانا و خواهرانش\")، مارتین اسکورسیزی (\"رنگ پول\") و \"مایکل سیمینو\" سیسیلی آغاز کرد. اما تمام خاطرات او از این دوران مثبت نیست. تورتورو به Business Insider گفت: «تعدادی از افرادی که نام بردید - نه مارتی - واقعاً خشن بودند. آنها گاهی اوقات فراتر از توهین آمیز بودند. خشونت زیادی در مورد بازیگران آن فیلم ها انجام می شد. جان تورتورو. گرت کاترمول/ گتی ایماژ او هنوز فیلمبرداری یک صحنه را به طور خاص به یاد دارد. در فیلم هیجان انگیز نئو نوآر فریدکین در سال 1985، \"زندگی و مردن د ymity, said that the Malloy drones can be used instead of helicopters for logistics and for intelligence, surveillance, and reconnaissance, and that their use will only become more prominent over time. They won't completely replace crewed aircraft for these missions, though. The $4 billion Prince of Wales was commissioned into the Royal Navy in 2019; however, it wasn't until 2025 that the UK first used a Malloy T-150 quadcopter to deliver supplies from the aircraft carrier to a nearby warship. The graveyard, to the right of the ski-jump ramp, is where drones are launched. Jake Epstein/Business Insider The Royal Navy said at the time that the goal of the trial was to find a \"cheap and efficient alternative\" to helicopter and boat deliveries. The T-150 flew just over a mile, but it has a maximum range of roughly 23 miles, according to Malloy. The helicopter squadrons aboard the Prince of Wales are equipped to take on a variety of missions. The Merlin Mk4 Commando, for instance, can move troops from ship to shore and transport heavy cargo, while the Merlin Mk2 variant and the Wildcat offer advanced anti-submarine warfare capabilities . But there are new opportunities in uncrewed systems. Britain is pushing to integrate drones into its two Queen Elizabeth-class carriers as part of broader efforts to make the military — at sea,", "date_str": "2026-11-10T14:56:20+00:00", "hash": "54b65ca1a48f9eb5", "title_fa": "جدیدترین ناو هواپیمابر بریتانیا به پهپادهای کوچک اجازه می‌دهد تا برخی از ماموریت‌ها را که زمانی توسط هلیکوپتر انجام می‌شد، انجام دهند.", "summary_fa": "جدیدترین ناو هواپیمابر بریتانیا از پهپادهای کوچک برای تدارکات و نقش های دیگر استفاده می کند. نیروی دریایی سلطنتی جدیدترین ناو هواپیمابر بریتانیا از پهپادهای کوچک برای نقش‌های تدارکاتی و نظارتی استفاده می‌کند. یک افسر عرشه پرواز در HMS Prince of Wales گفت که می توان از آنها به جای هلیکوپتر استفاده کرد. بریتانیا در حال تلاش برای ادغام پهپادهای هوایی در دو ناو خود در کلاس ملکه الیزابت است. سوار بر HMS PRINCE OF WALES ut when I found myself single, without the commitments I'd expected to have at this age, I started thinking about what I could do with the freedom. I'd always wanted to see more of the world, and with my 4-year-old dog Maple beside me, I decided to stop waiting. Up until then, I'd worked as a financial advisor, spending my days in the corporate world, helping people plan for their futures. It made me think about all the things I wanted to do before I retired. I wanted to travel while I was fit and healthy enough to climb mountains and enjoy the places I'd dreamed of visiting. So, I sold my belongings, packed up my car, and set off with Maple in April 2025. We spent three months traveling between Greece and my native UK. I was nervous about going alone, but that experience showed me I could manage more than I'd given myself credit for. By the time we got back, I wanted to keep exploring. A trial trip convinced me to buy a van, but our early days were tough I'd seen people on social media post about van life , and I knew that was the freedom I was looking for. Two months after our first trip, before committing fully, I rented a van for two weeks and traveled around the Welsh coast. I really enjoyed living in a van ; traveling with Maple was much easier when we had somewhere familiar to sleep, cook, and retreat to at the end of the day. I decided to bite the bullet and buy our very own. I ended up spending more than I intended, but comfort mattered if this van was going to be our home. I picked it up in September 2025 and drove straight to Scotland, excited about what was ahead. The first few days weren't what I imagined. The electrics failed, the boiler broke, and the skylights leaked, all while I was dealing with Scottish storms alone. I kept driving back and forth from remote parts of the Highlands, trying to find someone trustworthy who could help. Instead of enjoying our new home (and the beautiful sights of Scotland ), I worried about what might go wrong next. Th s": ["فناوری", "نوآوری"], "datetime_fa": "۱۹ آبان • ۱۷:۳۰"}, {"source": "Engadget", "title": "A Chinese team made a big splash with a drone swarm world record", "link": "https://www.engadget.com/2307769/116-underwater-drone-swarm-world-record-china/", "summary": "The performance of these underwater drones is much more than a gimmick. It signals serous geopolitical swagger that s turning heads across global sectors.", "date_str": "2026-11-10T14:45:00+00:00", "hash": "6d6622bc804dd0dd", "title_fa": "یک تیم چینی با ثبت رکورد جهانی ازدحام پهپاد سروصدای زیادی به پا کرد", "summary_fa": "عملکرد این پهپادهای زیر آب بسیار بیشتر از یک حقه است. این نشان دهنده یک بی‌اعتنایی جدی ژئوپلیتیکی است که سرها را در بخش‌های جهانی برمی‌گرداند. دانشگاه پلی‌تکنیک نورث وسترن افزودن Engadget به Google: منبع ترجیحی Google Discover محققان رکوردی را برای بزرگترین گروه پهپادهای زیر آب در تاریخ ثبت کرده‌اند. این آزمایش که به طور رسمی توسط رکوردهای جهانی گینس به رسمیت شناخته شد، شاهد 116 پهپاد TH-618 بود که در استخری به ابعاد 164 فوت در 65 فوت مستقر شدند، جایی که آنها به طور مستقل مجموعه‌ای از آرایش‌ها و مانورها را اجرا کردند. (برای مقایسه، استخر شنا در اندازه المپیک تقریباً 164 فوت در 82 فوت است.) آزمایش اوت 2026 پیوندهای قوی با خط لوله نظامی جمهوری خلق چین دارد. این توسط محققان دانشگاه پلی تکنیک نورث وسترن، موسسه ای که توسط دولت ایالات متحده به عنوان توسعه دهنده فناوری برای ارتش آزادیبخش خلق (PLA) تعیین شده است، انجام شد. این دانشگاه این آزمایش را در ارتباط با Xi'an Tianhe Maritime Technologies، یکی از شرکت های تابعه پیمانکار دفاعی Xian Tianhe Defense Technology، انجام داد. به گزارش ساوت چاینا مورنینگ پست، این دانشگاه گفت که توسعه ازدحام پهپادهای زیردریایی «همیشه یک چالش اصلی در زمینه جهانی تجهیزات هوشمند زیر آب بوده است. این بار، ناوبری پایدار مجموعه‌ای متشکل از صدها وسیله نقلیه نشان‌دهنده پیشرفتی در ناوبری هماهنگ در مقیاس بزرگ سامانه‌های بدون سرنشین زیر آب است.» این روز رکورد می‌تواند نقطه عطفی بزرگ در توسعه انبوه پهپادهای خودران توسط PLA باشد - نقطه‌ای حیاتی و حیاتی برای تقویت نظامی قدرت شرقی.", "image_url": "https://www.engadget.com/img/gallery/a-chinese-team-made-a-big-splash-with-a-drone-swarm-world-record/l-intro-1793653335.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۹ آبان • ۱۸:۱۵"}, {"source": "Engadget", "title": "The HDMI port settings you should change for the best picture quality", "link": "https://www.engadget.com/2307766/hdmi-port-settings-should-change-best-picture-quality/", "summary": "To ensure your TV and connected devices are providing the best picture quality possible, turn on these HDMI port settings.", "date_str": "2026-11-10T14:15:00+00:00", "hash": "d491218084764a5f", "title_fa": "تنظیمات پورت HDMI را برای بهترین کیفیت تصویر باید تغییر دهید", "summary_fa": "برای اطمینان از اینکه تلویزیون و دستگاه های متصل شما بهترین کیفیت تصویر ممکن را ارائه می دهند، این تنظیمات پورت HDMI را روشن کنید. فقط تنظیمات تلویزیون خود را تنظیم نکنید. تنظیمات پورت HDMI شما نیز باید اصلاح شود. Wongsakorn 2468/Shutterstock Engadget را به Google اضافه کنید: منبع ترجیحی Google Discover اکثر تلویزیون‌های هوشمند برای مشاهده خارج از خانه بهینه‌سازی نشده‌اند. با توجه به اینکه مخاطبان خانگی معمولاً هدف اصلی هستند، ممکن است عجیب به نظر برسد. با این حال، اغلب به تلویزیون‌ها تنظیمات پیش‌فرض بیش از حد محافظه‌کارانه داده می‌شود، یا در حالت‌هایی تنظیم می‌شوند که ممکن است در فروشگاه توجه شما را جلب کند اما به طور فعال کیفیت تصویر را خراب می‌کند. دلیلی وجود دارد که چرا باید حالت فیلمساز اختراع شود. این به درگاه های HDMI گسترش می یابد. فکر می‌کنید پورت‌ها اصلاً نیازی به تنظیمات ندارند، چه با مفهوم plug-and-play. اما آنها وجود دارند و حقیقت این است که اگر هرگز آنها را تغییر نداده‌اید، تلویزیون شما و دستگاه‌های متصل به آن احتمالاً با پتانسیل کامل خود کار نکرده‌اند. به طور معمول، شما فقط باید تنظیماتی به نام Enhanced را برای هر یک از ورودی های خود روشن کنید. با این حال، سازندگان تلویزیون روی مسائل تمرکز می کنند، بنابراین چشمان خود را باز نگه دارید. در واقع، شاید ارزش آن را داشته باشد که 15 دقیقه را صرف بررسی تمام گزینه های منو برای بهبود کیفیت تصویر تلویزیون 4k خود اختصاص دهید. ورودی‌های HDMI s880/Shutterstock اغلب روی حالت «استاندارد» پیش‌فرض قرار می‌گیرند که برای به حداکثر رساندن سازگاری با هر چیزی که ممکن است وصل کنید. در تئوری، این ایده عالی به نظر می‌رسد. با این حال، من هرگز یک بار با مشکل سازگاری مواجه نشده ام، و این مبادله یک گلوگاه بر روی پیشرفته ترین سخت افزار شما، مانند کنسول های بازی", "image_url": "https://www.engadget.com/img/gallery/the-hdmi-port-settings-you-should-change-for-the-best-picture-quality/l-intro-1793646448.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۹ آبان • ۱۷:۴۵"}, {"source": "Engadget", "title": "BT won't launch Starlink deal until people forget about Ukraine", "link": "https://www.engadget.com/2311922/bt-wont-launch-starlink-deal-until-people-forget-about-ukraine/", "summary": "The UK's largest telecom company is courageously waiting for people to forget about Musk before launching its tie-up with Starlink.", "date_str": "2026-11-10T14:01:44+00:00", "hash": "16c00f21afb4c5d2", "title_fa": "BT تا زمانی که مردم اوکراین را فراموش نکنند، معامله Starlink را راه اندازی نمی کند", "summary_fa": "بزرگترین شرکت مخابراتی بریتانیا شجاعانه منتظر است تا مردم ماسک را قبل از راه اندازی ارتباط خود با Starlink فراموش کنند. مدیر عامل شرکت آلیسون کرکبی منتظر است تا نویز خاموش شود. Shcherbak Volodymyr/Getty Images افزودن Engadget به Google: منبع ترجیحی Google Discover بزرگترین شرکت مخابراتی بریتانیا راه اندازی اتصال Starlink خود را متوقف کرده است، اما نه به دلیلی که ممکن است انتظارش را داشته باشید. آلیسون کرکبی، مدیر عامل BT در صحبت با فایننشال تایمز گفت که به دلیل مداخله شخصی ایلان ماسک در اوکراین، پرتاب تا زمانی که \"سر و صدا خاموش شود\" صبر خواهد کرد. کرکبی گفت که BT \"با توجه به اتفاقاتی که چند هفته پیش در اوکراین رخ داد، در مورد نحوه مشاهده Starlink در حال حاضر محتاط است.\" استارلینک، بازوی اینترنتی ماهواره ای اسپیس ایکس ایلان ماسک، پشتیبانی زیرساختی را برای اوکراین فراهم کرده است در حالی که این کشور از خود در برابر تهاجم روسیه دفاع می کند. گزارش ها حاکی از آن است که ماسک در ماه اکتبر به استارلینک دستور داد تا سرویس مورد استفاده ارتش اوکراین را کاهش دهد و خشم بین المللی را برانگیخت. این اقدام هم در نشان دادن قدرت ماسک و هم سوالاتی در مورد قابلیت اطمینان او به عنوان یک شریک تجاری ایجاد نگرانی کرد. با وجود این، BT از راه‌اندازی این معامله دلسرد نیست و می‌گوید که یک \"جهش بزرگ\" برای اتصال روستایی در بریتانیا ارائه می‌کند. فایننشال تایمز همچنین در بیانیه ای به نقل از کرکبی اشاره کرد که افزود: «ارائه بهترین محصولات برای مشتریانمان به معنای همکاری با بهترین شرکا است» و Starlink «در ماه های آینده» راه اندازی خواهد شد. چه کسی می‌دانست که \"بهترین شرکا\" شامل کسی می‌شود که سابقه ثابتی در به هم ریختن کیفیت خدمات بر اساس چیزی جز هوس خود دارد؟", "image_url": "https://www.engadget.com/img/gallery/bt-wont-launch-starlink-deal-until-people-forget-about-ukraine/l-intro-1794319228.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۹ آبان • ۱۷:۳۱"}, {"source": "Engadget", "title": "Spotify adds new voices for its AI DJ", "link": "https://www.engadget.com/2311665/spotify-adds-new-voices-for-its-ai-dj/", "summary": "You can also now listen to a DJ mix without the commentary.", "date_str": "2026-11-10T14:00:00+00:00", "hash": "9d14e62e3b255d6c", "title_fa": "اسپاتیفای صداهای جدیدی را به دی‌جی هوش مصنوعی خود اضافه می‌کند", "summary_fa": "همچنین اکنون می توانید به یک میکس دی جی بدون تفسیر گوش دهید. Spotify افزودن Engadget به Google: منبع برگزیده Google Discover Spotify راه‌های بیشتری برای سفارشی‌سازی تجربه استفاده از دی‌جی تولید شده توسط هوش مصنوعی خود اضافه می‌کند. این ویژگی در سال 2023 به عنوان راهی برای به دست آوردن تجربه شنیداری شبیه به رادیو، متناسب با سلیقه هر شنونده با صدای AI که زمینه یا گپ زدن در مورد انتخاب ها را ارائه می دهد، شروع به کار کرد. DJ از آن زمان به درخواست ها و پشتیبانی از زبان های اضافی گسترش یافته است. شنوندگان اکنون همچنین می توانند شخصیتی را برای صدایی که با آنها صحبت می کند از طریق انتخاب آهنگ انتخاب کنند. Spotify هفت شخصیت را به زبان انگلیسی و دو شخصیت را به زبان اسپانیایی منتشر می کند. هر کدام ی
