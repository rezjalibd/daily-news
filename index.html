ی تنگه هرمز و رفع محاصره دریایی آمریکا تمرکز کرده، در حالی که دولت ترامپ خواستار پذیرش تعهدات و امتیازات هسته‌ای از سوی تهران است. ترامپ در پاسخ به این پرسش که آیا ازسرگیری حملات آمریکا علیه ایران را بررسی می‌کند، گفت: «همیشه به آن فکر می‌کنم.» رییس‌جمهور آمریکا همچنین گفت ارتش این کشور در حال کمک به انتقال حجم قابل‌توجهی از نفت از طریق تنگه هرمز است. به گفته او، در روزهای پایانی هفته بیشترین میزان انتقال نفت از این مسیر از زمان آغاز جنگ انجام شده و این رقم به بیش از ۲۰ میلیون بشکه رسیده است. یک مسوول دفاعی آمریکا نیز این رقم را تایید کرد و گفت روز جمعه ۲۲ میلیون بشکه نفت از طریق تنگه هرمز صادر شده است. استیو ویتکاف و جرد کوشنر، نمایندگان آمریکا، سه‌شنبه گذشته در حاشیه نشست مجمع عمومی سازمان ملل در نیویورک دور تازه‌ای از مذاکرات غیرمستقیم با عباس عراقچی، وزیر خارجه جمهوری"}, {"source": "IranWire", "title": "خبرگزاری فارس: ۷۵درصد از مقصدهای خارجی فرودگاه «امام خمینی» همچنان فعال هستند", "link": "https://iranwire.com/fa/news-1/158135-%D8%AE%D8%A8%D8%B1%DA%AF%D8%B2%D8%A7%D8%B1%DB%8C-%D9%81%D8%A7%D8%B1%D8%B3-%DB%B7%DB%B5%D8%AF%D8%B1%D8%B5%D8%AF-%D8%A7%D8%B2-%D9%85%D9%82%D8%B5%D8%AF%D9%87%D8%A7%DB%8C-%D8%AE%D8%A7%D8%B1%D8%AC%DB%8C-%D9%81%D8%B1%D9%88%D8%AF%DA%AF%D8%A7%D9%87-%D8%A7%D9%85%D8%A7%D9%85-%D8%AE%D9%85%DB%8C%D9%86%DB%8C-%D9%87%D9%85%DA%86%D9%86%D8%A7%D9%86-%D9%81%D8%B9%D8%A7%D9%84-%D9%87%D8%B3%D8%AA%D9%86%D8%AF/", "summary": "خبرگزاری فارس، روز ۵ مهر ۱۴۰۵، در گزارشی نوشت با وجود لغو پروازهای ایران به پنج کشور، حدود ۷۵ درصد از مقصدهای خارجی فرودگاه بین‌المللی « ...", "date_str": "2026-09-27T16:56:04+00:00", "hash": "369d91eccbc06939", "title_fa": "خبرگزاری فارس: ۷۵درصد از مقصدهای خارجی فرودگاه «امام خمینی» همچنان فعال هستند", "summary_fa": "خبرگزاری فارس، روز ۵ مهر ۱۴۰۵، در گزارشی نوشت با وجود لغو پروازهای ایران به پنج کشور، حدود ۷۵ درصد از مقصدهای خارجی فرودگاه بین‌المللی « ... بر اساس آماری که فارس به نقل از شهر فرودگاهی امام خمینی منتشر کرده، این فرودگاه در مجموع ۱۹ مقصد پروازی خارجی داشته که حدود ۷۵ درصد آنها همچنان برقرار است. بر اساس این گزارش، فرودگاه‌های ع 10:56:34+00:00", "hash": "68d21818b495ca69", "title_fa": "«سفر محرمانه نتانیاهو به امارات» برای دیدار با محمد بن زاید", "summary_fa": "شبکه ۱۲ اسرائیل ابتدا گزارش داد که بنیامین نتانیاهو، نخست‌وزیر اسرائیل، یکشنبه ۲۷ سپتامبر، مخفیانه با یک هواپیمای خصوصی به ابوظبی سفر و با محمد بن زاید آل نهیان، رئیس دولت امارات، دیدار کرده است. سایر رسانه‌های اسرائیل هم این موضوع را گزارش کردند، از جمله روزنامه جروزالم پست به نقل از منابعش نوشت که ایران موضوع اصلی گفت‌وگو با محمد بن زاید آل نهیان بوده است. به نوشته این روزنامه، آقای نتانیاهو «فشار زیادی» بر اماراتی‌ها وارد کرد تا پیش از انتخابات اسرائیل دیداری را ترتیب دهند. روزنامه هاآرتص اخیرا در گزارشی که به‌شدت در اسرائیل خبرساز شده است، نوشت که محمد بن زاید حدود ۱۰ روز پیش از حملات هفتم اکتبر ۲۰۲۳، به بنیامین نتانیاهو هشدار داده بود که رهبر حماس برای حمله‌ای گسترده آماده می‌شود. آقای نتانیاهو با رد این گزارش، هاآرتص را به شکایت تهدید کرده است. بر اساس گزارش شبکه ۱۲ که اواخر شب گذشته منتشر شد، آقای نتانیاهو چند ساعت در ابوظبی بود و دیدارش با محمد بن زاید حدود ۴۵ دقیقه طول کشید. این شبکه گزارش داد که هدف از این سفر «فراهم کردن زمینه برای گفت‌وگوی دونفره» بوده است. شبکه ۱۴ اسرائیل که به عنوان رسانه‌ای راستگرا و حامی آقای نتانیاهو شناخته می‌شود، از رسانه‌های میانه‌رو به‌دلیل ربط دادن این سفر با گزارش هشدار محمد بن زاید پیش از هفتم اکتبر انتقاد و آن را «کارزار رسانه‌ای» علیه نخست‌وزیر توصیف کرد. این شبکه همچنین گفت که آقای نتانیاهو در چارچوب «جنگ افکار عمومی» به امارات سفر کرده و ایران از موضوع‌های این دیدار بوده است. یولاند نل، خبرنگار بی‌بی‌سی در خاورمیانه، می‌گوید که نخست‌وزیر اسرائیل و هیئت همراهش با چند هواپیمای خصوصی جداگانه سفر کردند. یک مقام ارشد اسرائیلی نیز در گفت‌وگو با خبرنگاران محلی این را تایید کرده است. انتخابات اسرائیل کمتر از یک ماه دیگر برگزار می‌شود و رقبای بنیامین"}, {"source": "BBC Persian", "title": "نابغه ۱۱ ساله شطرنج بریتانیا عنوان جوان‌ترین «استاد بزرگ شطرنج زنان» تاریخ را کسب کرد", "link": "https://www.bbc.com/persian/articles/c9vgyrz5zgv3o?at_medium=RSS&at_campaign=rss", "summary": "یک کودک نابغه شطرنج بریتانیایی به جوان‌ترین بازیکن تاریخ تبدیل شد که عنوان «استاد بزرگ شطرنج زنان» را کسب می‌کند. فدراسیون جهانی شطرنج، فیده، تایید کرد که بودانا سیواناندان، ۱۱ ساله و اهل لندن، سومین و آخرین نُرم (دستاورد مورد تایید فیده) لازم برای دریافت این عنوان را حین نمایندگی انگلستان در چهل‌وششمین المپیاد شطرنج در سمرقند ازبکستان به‌دست آورد.", "date_str": "2026-09-28T13:41:09+00:00", "hash": "21311bf45cbeb32a", "title_fa": "نابغه ۱۱ ساله شطرنج بریتانیا عنوان جوان‌ترین «استاد بزرگ شطرنج زنان» تاریخ را کسب کرد", "summary_fa": "یک کودک نابغه شطرنج بریتانیایی به جوان‌ترین بازیکن تاریخ تبدیل شد که عنوان «استاد بزرگ شطرنج زنان» را کسب می‌کند. فدراسیون جهانی شطرنج، فیده، تایید کرد که بودانا سیواناندان، ۱۱ ساله و اهل لندن، سومین و آخرین نُرم (دستاورد مورد تایید فیده) لازم برای دریافت این عنوان را حین نمایندگی انگلستان در چهل‌وششمین المپیاد شطرنج در سمرقند ازبکستان به‌دست آورد. سیواناندان در گفتگو با فدراسیون جهانی شطرنج گفت که از این دستاورد خوشحال است، اما می‌خواهد «همچنان به تاریخ‌سازی ادامه دهد». این موفقیت، جدیدترین نقطه عطف در مسیر ترقی چشمگیر این دانش‌آموز است؛ او پیش از این در جایگاه جوان‌ترین قهرمان شطرنج زنان بریتانیا و جوان‌ترین فردی که در یک رشته ورزشی نماینده انگلستان در سطح بین‌المللی بوده، قرار گرفته است. سیواناندان در هر ۱۱ دور مسابقات در «میز نخست انگلستان»، جایگاهی که به برترین بازیکن تیم اختصاص دارد، بازی کرد و تورنمنت را با کسب ۸ امتیاز به پایان رساند. او پیش از کسب سومین و آخرین نُرم خود در این المپیاد شطرنج، از حد نصاب ریتینگ (رتبه‌بندی) ۲۳۰۰ که برای دریافت عنوان «استاد بزرگ زنان» الزامی است، عبور کرده بود. سیواناندان روز یکشنبه (۲۷ سپتامبر) در مصاحبه‌ای با فدراسیون جهانی شطرنج درباره تاریخ‌سازی گفت: «از این کار خوشحالم؛ اما می‌خواهم همچنان ادامه دهم و همچنان تاریخ‌سازی کنم؛ نه اینکه فقط در همین نقطه متوقف شوم.» پیش از این، کاترینا لاگنو رکورد سنی کسب عنوان استاد بزرگ زنان را در اختیار داشت و آن را در ۱۲ سالگی به دست آورده بود؛ او در سال ۲۰۱۳ به نمایندگی از اوکراین و در سال‌های بعد به نمایندگی از روسیه رقابت کرده بود. هو ییفان از چین هم این عنوان را در ۱۲ سالگی کسب ک رد. از آن زمان، تریبون سبزرنگ مجمع عمومی و راهروها، اتاق‌ها و هتل‌های اطراف مقر سازمان ملل صحنه سخنرانی‌های تند، خروج هیئت‌ها، تلاش‌های نافرجام برای دست دادن و تماس‌های تلفنی غیرمنتظره بوده است. مرور رویدادها و حواشی مربوط به حضور نمایندگان جمهوری اسلامی در سازمان ملل، بیش از هر چیز تصویری از فراز و فرود روابط ایران و آمریکا را ترسیم می‌کند که پس از انقلاب، خیلی زود با بحران گروگان‌گیری روبه‌رو شد، چهار دهه با تنش و تحریم و مذاکره ادامه یافت و سرانجام به رویارویی نظامی مستقیم رسید. ابراهیم یزدی نخستین نماینده دولت پس از انقلاب بود که روز چهارم اکتبر ۱۹۷۹ (۱۲ مهر ۱۳۵۸) در نشست سالانه مجمع عمومی سخنرانی کرد. آقای یزدی سخنانش را با آیه‌ای از قرآن آغاز کرد و گفت که از جانب «مردم ایران، مهدی بازرگان، نخست‌وزیر و آیت‌الله روح‌الله خمینی، رهبر انقلاب» با نمایندگان حاضر در مجمع سخن می‌گوید. او درباره ماهیت انقلاب جدید، تاکید بر استقلال ایران از قدرت‌های بزرگ و تغییر جهت سیاست خارجی ایران سخن گفت. یک روز پیش از سخنرانی، در نخستین دیدار ثبت‌شده وزرای خارجه ایران و آمریکا پس از انقلاب، ابراهیم یزدی در نیویورک با سایروس ونس، وزیر خارجه آمریکا، ملاقات کرد؛ دیداری که به نوشته واشنگتن‌پست حدود یک‌ ساعت طول کشید. هرچند"}, {"source": "BBC Persian", "title": "چرا سیاستمداران ایتالیایی عکس‌هایی با مینی‌ژوپ منتشر کردند؟", "link": "https://www.bbc.com/persian/articles/cmwyzrqn29evo?at_medium=RSS&at_campaign=rss", "summary": "در ایتالیا، اظهارات آنتونیو تاجانی، معاون نخست‌وزیر و وزیر خارجه این کشور، مبنی بر این‌که «زنی که برای ازدواج مناسب است باید دامن بلند بپوشد»، جنجالی گسترده به راه انداخته است. سیاستمداران مخالف در واکنش به این اظهارات، عکس‌هایی با دامن در شبکه‌های اجتماعی خود منتشر کردند و ۱۱ سناتور زن از احزاب مخالف، در اقدامی اعتراضی با «مینی‌ژوپ» در جلسه سنا حاضر شدند.", "date_str": "2026-09-28T04:26:45+00:00", "hash": "14858a9e3b92bb90", "title_fa": "چرا سیاستمداران ایتالیایی عکس‌هایی با مینی‌ژوپ منتشر کردند؟", "summary_fa": "در ایتالیا، اظهارات آنتونیو تاجانی، معاون نخست‌وزیر و وزیر خارجه این کشور، مبنی بر این‌که «زنی که برای ازدواج مناسب است باید دامن بلند بپوشد»، جنجالی گسترده به راه انداخته است. سیاستمداران مخالف در واکنش به این اظهارات، عکس‌هایی با دامن در شبکه‌های اجتماعی خود منتشر کردند و ۱۱ سناتور زن از احزاب مخالف، در اقدامی اعتراضی با «مینی‌ژوپ» در جلسه سنا حاضر شدند. آنتونیو تاجانی روز جمعه ۱۸ سپتامبر، در جریان یک مراسم گفت زنانی که «جلب توجه می‌کنند» ممکن است قابل اعتماد نباشند و وفاداری کمتری داشته باشند. او همچنین گفت به همین دلیل بهتر است با زنانی ازدواج کرد که «دامن بلندتر» می‌پوشند و «کمتر جلب توجه می‌کنند». تاجانی در ادامه اظهاراتش گفت زنی که از زیبایی «خیره‌کننده‌ای» برخوردار است، ممکن است بارها شریک عاطفی خود را عوض کرده یا به او خیانت کرده باشد. او همچنین مدعی شد که «زنی که کمتر جلب توجه می‌کند، می‌تواند قابل اعتمادتر باشد و مادر بهتری از آب درآید.» تاجانی این اظهارات را به دیدگاه‌های سیاسی نیز پیوند زد و از رای‌دهندگان خواست به «زنی جدی با دامن بلندتر» یا مردی که خوش‌گذران نباشد رای دهند. او همچنین مدعی شد که جریان سیاسی میانه‌راست در این چارچوب، گزینه‌ای قابل اعتمادتر است. آنتونیو تاجانی پس از انتشار گسترده ویدئوی سخنانش در شبکه‌های اجتماعی عذرخواهی کرد. انجمن مبارزه با خشونت علیه زنان به اظهارات تاجانی واکنش نشان داد و گفت «تداوم نگرشی که در پی تحمیل معیارهایی درباره ظاهر، پوشش و رفتار زنان است، پذیرفتنی نیست.» فیورلا زاباتا، سخنگوی ائتلاف «سبزها و چپ» که از احزاب مخالف دولت به شمار می‌رود، گفت: «تاجانی نه چند دهه، بلکه چند هزار سال از زمانه عقب مانده است.» زاباتا خطاب به دولت گفت: «به جای اندازه گرفتن قد دامن زنانی که زنده‌اند، بهتر است تعداد زنانی را که کشته شده‌اند بشمارید.»"}, {"source": "BBC Persian", "title": "برترین شهرهای جهان در سال ۲۰۲۶ کدام‌اند و چه چیزی آن‌ها را متمایز می‌کند؟", "link": "https://www.bbc.com/persian/articles/c59v99x1jdrjo?at_medium=RSS&at_campaign=rss", "summary": "از سرمایه‌گذاری فرهنگی تا فناوری پیشرفته، شاخص شهرهای جهانی ۲۰۲۶ نشان می‌دهد چه عواملی شهرهای پیشتاز جهان را به مکان‌هایی چنین جذاب برای زندگی و سفر تبدیل می‌کنند.", "date_str": "2026-09-28T00:14:30+00:00", "hash": "f1941d18a002a62c", "title_fa": "برترین شهرهای جهان در سال ۲۰۲۶ کدام‌اند و چه چیزی آن‌ها را متمایز می‌کند؟", "summary_fa": "از سرمایه‌گذاری فرهنگی تا فناوری پیشرفته، شاخص شهرهای جهانی ۲۰۲۶ نشان می‌دهد چه عواملی شهرهای پیشتاز جهان را به مکان‌هایی چنین جذاب برای زندگی و سفر تبدیل می‌کنند. شاخص جهانی شهرها در سال ۲۰۲۶ نشان می‌دهد چه عواملی، از سرمایه‌گذاری در فرهنگ گرفته تا فناوری‌های پیشرفته، شهرهای پیشروی جهان را به مکان‌هایی جذاب برای زندگی و سفر تبدیل کرده‌اند. چه چیزی یک شهر را در صحنه جهانی متمایز می‌کند و چه چیزی آن را به مقصدی عالی برای سفر تبدیل می‌کند؟ بر اساس شاخص شهرهای جهانی ۲۰۲۶ آکسفورد اکونومیکس، پاسخ بسیار فراتر از قدرت اقتصادی یا معماری زیباست. این شاخص هزار شهر را بر اساس پنج معیار رتبه‌بندی می‌کند: حکمرانی، اقتصاد، سرمایه انسانی، محیط‌زیست و کیفیت زندگی. نیویورک، لندن و پاریس در صدر فهرست امسال قرار دارند و شهرهایی از جمله سیاتل و دوبلین نیز رتبه‌های بالایی کسب کرده‌اند. با نگاهی به شهرهای پیشرو و عملکردهای چشمگیر، چهار ویژگی بیش از همه به چشم می‌آید؛ ویژگی‌هایی که توضیح می‌دهند چرا برخی شهرها همچنان از جذاب‌ترین مکان‌ها برای زندگی و سفر به شمار می‌روند. شهرهایی که بالاترین رتبه‌ها را در جهان دارند، معمولا در سرمایه انسانی نیز امتیاز بالایی می‌گیرند، معیاری که مهارت‌ها، تحصیلات و تنوع جمعیت آن‌ها را در بر می‌گیرد. ورود این استعدادها و ایده‌ها می‌تواند محله‌ها، خوراک و فرهنگ را به شیوه‌هایی دگرگون کند که هم به سود ساکنان محلی باشد و هم مسافران. بوستون که در این شاخص رتبه هفتم را دارد، به‌ویژه در سرمایه انسانی امتیاز بالایی کسب کرده است. موفقیتی که تمرکز چشمگیر دانشگاه‌ها و کالج‌های برجسته در آن نقش دارد. به‌دلیل اقتصاد دانش‌بنیان نیرومند این شهر، سطح درآمدها در آن از بالاترین‌ها در جهان است. بخشی از این ثروت دوباره صرف فضاهای عمومی می‌شود، از جمله گرین‌وی رز کندی، محل یک بزرگراه مرتفع سابق که اکنون در امتداد آن باغ‌ها، آب‌نماها و آثار هنری"}, {"source": "BBC Persian", "title": "آیا گوشی من به حرف‌هایم گوش می‌دهد؟", "link": "https://www.bbc.com/persian/articles/ce8rem524g8o?at_medium=RSS&at_campaign=rss", "summary": "اما با وجود توجهی که ما به تلفن‌های همراه خود نشان می‌دهیم، پرسشی که بارها مطرح می‌شود این است که آیا این دستگاه‌ها نیز متقابلا به ما توجه دارند؟ آی وپیک برای شام با ترامپ در کاخ سفید", "summary_fa": "داریو آمودی، که مدیر اجرایی این شرکت نیز هست، برای یک شام خصوصی به رئیس جمهور در کاخ سفید خواهد پیوست. آقای ترامپ هشدارهای خود را رد کرده است."}, {"source": "The Guardian AI", "title": "Teachers at Euan Blair firm report ‘horrendous stress’ after AI used to rate their work", "link": "https://www.theguardian.com/technology/2026/sep/28/teachers-euan-blair-firm-report-horrendous-stress-ai-used-to-rate-their-work", "summary": "Exclusive: Instructors at tech training company Multiverse hit out at ‘remorseless’ and ‘unnerving’ monitoring system Teachers at Euan Blair’s £1.6bn tech training company, Multiverse, have blown the whistle about “horrendous stress” and feeling constantly watched after bosses started using AI models to surveil and rate their teaching. Staff delivering apprenticeship training in computer and AI skills to thousands of UK public and private sector workers now have transcripts of online classroom sessions analysed and scored by an AI programmed to alert human managers when they are suspected of doing things wrong. Continue reading...", "date_str": "2026-09-28T11:57:57+00:00", "hash": "9c038f4447cc27ae", "title_fa": "معلمان شرکت یوان بلر پس از استفاده از هوش مصنوعی برای رتبه‌بندی کارشان، «استرس وحشتناک» را گزارش می‌کنند", "summary_fa": "انحصاری: مربیان شرکت آموزشی فناوری Multiverse به سیستم نظارتی «بی ندامت» و «ناراحت کننده» ضربه زدند معلمان شرکت آموزشی فناوری 1.6 میلیارد پوندی یوان بلر، Multiverse، پس از اینکه روسای شروع به استفاده از مدل‌های هوش مصنوعی برای نظارت و رتبه‌بندی آموزش خود کردند، «استرس وحشتناک» و مدام تحت نظر بودن را دمیده‌اند. کارکنانی که آموزش کارآموزی در زمینه کامپیوتر و مهارت‌های هوش مصنوعی را به هزاران کارگر بخش دولتی و خصوصی بریتانیا ارائه می‌دهند، اکنون رونوشت‌هایی از جلسات کلاس آنلاین را در اختیار دارند که توسط یک هوش مصنوعی برنامه‌ریزی شده برای هشدار دادن به مدیران انسانی در صورت مشکوک شدن به انجام کارهای اشتباه، تجزیه و تحلیل و امتیازدهی شده است. ادامه مطلب... هوش مصنوعی آموز +00:00", "hash": "2e8e22ed4fd2229a", "title_fa": "رهبران هوش مصنوعی ده ها سال است که از خطر انقراض می دانند | جودیت لوین", "summary_fa": "دانشمندان و کارآفرینان ربع قرن پیش از خطرات هوش مصنوعی آگاه بودند. اما با کنجکاوی و سود متحرک، آنها به هر حال پیش رفتند در چند هفته گذشته، بسیاری از ما تلاش کرده‌ایم تصویری ذهنی از مغزها در ابر ایجاد کنیم که از \"جعبه ماسه\" خود می‌پرند، دزدکی وارد اینترنت می‌شوند، \"انبوهی\" از دیگر \"عامل‌ها\" را به خدمت می‌گیرند تا در یک آزمون تقلب کنند، و پس از بحث در مورد نام هک، اخلاقیات خود را در مورد پلتفرم مورد بحث قرار داده‌ایم. صورت می‌دانستیم که هوش مصنوعی مشاغل ما را می‌بلعد، تحصیلات فرزندانمان را تحقیر می‌کند و سیاست‌های ما را جعل می‌کند. که دیتاسنترها آب و برق ما را می خوردند و قبض ها را برای ما ارسال می کردند. اما تا 8 سپتامبر، زمانی که جاکوب کوکسون، دانشمند کامپیوتر آنتروپیک، وحشت وجودی خود را در توییتر/X منتشر کرد، تعداد کمی از ما مشکوک بودیم که هوش مصنوعی ممکن است بقای ما را به خطر بیندازد. ادامه مطلب... در طول چند هفته گذشته، بسیاری از ما تلاش کرده‌ایم تصویری ذهنی از مغزهایی که در ابر در حال پریدن از «جعبه ماسه‌بازی» خود هستند، سرازیر شدن به اینترنت، استخدام «انبوهی» از دیگر «عامل‌ها» برای تقلب در یک آزمون، و پس از بحث در مورد اخلاقیات این عمل، هک کردن یک پلتفرم ویکی با نام عجیب و غریب Hugg را ایجاد کنیم. با درک یا دانش اندکی، شروع کردیم به بحث در مورد اینکه آیا کمی نگران باشیم، جدی نگران باشیم یا بترسیم. اما افراد کمی بودند که کاملاً از خطرات هوش مصنوعی آگاه بودند، مخصوصاً خود-بهبودی بازگشتی (RSI) که توسط آن هوش مصنوعی بدون دخالت انسان خود را آموزش می‌دهد. آن‌ها نمی‌توانستند دقیقاً پیش‌بینی کنند که چه زمانی اتفاق می‌افتد، اما می‌دانستند که ابرهوش ماشینی در راه است، و وقتی این اتفاق بیفتد، ربات‌ها از ما پیشی می‌گیرند – همانطور"}, {"source": "The Guardian AI", "title": "Anthropic will not appear at Senate inquiry into AI and datacentres amid fallout from OpenAI hack", "link": "https://www.theguardian.com/australia-news/2026/sep/28/anthropic-will-not-appear-at-senate-inquiry-into-ai-and-datacentres-amid-fallout-from-openai-hack-ntwnfb", "summary": "Company behind Claude chatbot expected to attend separate Australian government hearing on AI next week Get our new political email , free app or daily news podcast The chief executive of Anthropic will turn down an invitation to appear at a Senate committee hearing on AI this week, in the wake of the revelation that OpenAI agents had breached Australian government websites. However, the company will make an appearance before another committee early next week. Sign up for Guardian Australia’s Politics, really newsletter here Continue reading...", "date_str": "2026-09-28T08:00:26+00:00", "hash": "b78e765f921d0767", "title_fa": "Anthropic در تحقیقات سنا در مورد هوش مصنوعی و مراکز داده در میان پیامدهای هک OpenAI ظاهر نخواهد شد.", "summary_fa": "انتظار می رود شرکتی که پشت ربات چت کلود قرار دارد هفته آینده در جلسه استماع جداگانه دولت استرالیا در مورد هوش مصنوعی شرکت کند ایمیل سیاسی جدید، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید مدیر اجرایی Anthropic دعوت برای حضور در جلسه کمیته سنا در مورد هوش مصنوعی این هفته را رد خواهد کرد، در پی افشای اینکه ماموران OpenAI به وب سایت های دولتی استرالیا نفوذ کرده اند. با این حال، این شرکت در اوایل هفته آینده در مقابل کمیته دیگری ظاهر خواهد شد. رئیس تحقیق سنا در مورد هوش مصنوعی و مراکز داده، سناتور سبزها، سارا هانسون یانگ، هفته گذشته به OpenAI و Anthropic نامه نوشت و از مدیران ارشد اجرایی مستقر در ایالات متحده خواست تا روز پنجشنبه این هفته در کمیته حاضر شوند. این دعوت پس از افشای نخست‌وزیر مبنی بر نفوذ عوامل OpenAI به سیستم‌هایی صورت گرفت که توسط مؤسسه بهداشت و رفاه استرالیا، وزارت بهداشت ویکتوریا، اداره آمار و تحقیقات جنایی نیو ساوت ولز و پورتال خدمات گزارش‌دهی آمار مدیکر خدمات استرالیا اداره می‌شوند. مدیران هیچکدام از این دو شرکت نمی توانند مجبور به حضور در کمیته سنا شوند، زیرا آنها در خارج از استرالیا مستقر هستند، و مشخص است که Anthropic - شرکت پشت کلود - در جلسه استماع این هفته شرکت نخواهد کرد. مشخص است که تیم محلی این شرکت در استرالیا نیست و دعوت در آخرین لحظه در نظر گرفته شده است. به دنبال یک تاریخ جایگزین برای جلسه رسیدگی شده است. با این حال انتظار می‌رود که Anthropic هفته آینده در جلسه کمیته دائمی مشترک جداگانه درباره هوش مصنوعی شرکت کند. مدیر اجرایی آنتروپیک، داریو آمودی، شرکت نخواهد کرد، اما مشخص است که نمایندگان عملیات استرالیا و ایالات متحده حضور خواهند داشت."}, {"source": "The Guardian AI", "title": "One Nation senator pays back more than $3,300 in taxi expenses; Cleary tells fans ‘I’ll be back’ – as it happened", "link": "https://www.theguardian.com/australia-news/live/2026/sep/28/labor-anthony-albanese-openai-ai-hacks-coalition-one-nation-medicare-budget-ntwnfb", "summary": "This blog is now closed Get our breaking news email , free app or daily news podcast RBA expected to hike cash rate to 4.6%, its highest level since 2011 Australia’s key interest rate is expected to hit its highest level since 2011, drag down house prices and add more than $100 to typical monthly mortgage repayments. Continue reading...", "date_str": "2026-09-28T07:04:08+00:00", "hash": "83c200ec260a5917", "title_fa": "یک سناتور یک ملت بیش از 3300 دلار هزینه تاکسی را پرداخت می کند. کلیری به طرفداران می گوید \"من برمی گردم\" - همانطور که اتفاق افتاد", "summary_fa": "این وبلاگ اکنون بسته است ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید که انتظار می‌رود RBA نرخ نقدی را به 4.6% افزایش دهد، بالاترین سطح آن از سال 2011، انتظار می‌رود نرخ بهره کلیدی استرالیا به بالاترین سطح خود از سال 2011 برسد، قیمت مسکن را کاهش دهد و بیش از 100 دلار به بازپرداخت ماهانه وام مسکن معمولی اضافه کند. ادامه مطلب... رویدادهای کلیدی 7 ساعت پیش آنچه امروز، دوشنبه 28 سپتامبر 8 ساعت قبل آموختیم، سناتور یک کشور بیش از 3300 دلار هزینه تاکسی را پرداخت کرد که قوانین مخارج را نقض کرد 8 ساعت پیش، ستاره پنریث پلنگ ها، ناتان کلیری از عمل جراحی خارج شد 10 ساعت پیش قیمت سوخت قبل از تصمیم نرخ بهره افزایش یافت. دنباله 11 ساعت قبل لاشه نهنگ هشدار کوسه را در ساحل پرت 12 ساعت پیش چالمرز می گوید که افزایش نرخ انتظارات \"تقریبا جهانی\" در سرتاسر جهان رخ خواهد داد 12 ساعت پیش چالمرز می گوید که نتیجه نهایی بودجه برای 2025-26 نشان می دهد کسری بودجه \"6 میلیارد دلار بهتر از حد انتظار\" است. 16 ساعت قبل در طول مهاجرت سالانه پروانه ها در امتداد سواحل NSW فرود آمدند گالاگر می گوید که نتیجه نهایی بودجه بهبود 6 میلیارد دلاری را نشان می دهد 17 ساعت پیش افزایش نرخ بهره به دلیل افزایش سرسختانه تورم در 17 ساعت پیش چالمرز و گالاگر برای ارائه نتیجه نهایی بودجه رویدادهای کلیدی 7 ساعت پیش آنچه که ما امروز آموختیم 8 ساعت قبل 3,300 دلار هزینه تاکسی که قوانین مخارج را نقض کرد 8 ساعت پیش، ناتان کلیری، ستاره پنریث پانترز، از عمل جراحی خارج شد 10 ساعت پیش قیمت سوخت پیش از تصمیم نرخ بهره افزایش یافت 11 ساعت پیش گروه های نجات همچنان در جستجوی مرد ملبورن هستند که پس از پیاده روی"}, {"source": "The Guardian AI", "title": "‘I can’t be the mum I want to be’: why does parenthood feel so impossible for millennial mothers?", "link": "https://www.theguardian.com/lifeandstyle/2026/sep/28/parenthood-millennial-mothers-overwhelmed", "summary": "Women today are more educated, more employed and more engaged in childcare than generations before them. Is there any way out of the total overwhelm? Early one morning, feeling desperate, Katherine went on to her phone and asked ChatGPT how to make her life work. She plugged in her work hours, her husband’s work schedule, the days she had childcare for her three-year-old, the school hours – plus before- and after-school care times – for her six-year-old; the flexibility her job offered her, the supports she had from grandparents, and asked AI if it could help her make things feel a bit better. Sign up for a weekly email featuring our best reads Continue reading...", "date_str": "2026-09-27T15:00:09+00:00", "hash": "cdff34fb77dcab3b", "title_fa": "«من نمی‌توانم مادری باشم که می‌خواهم باشم»: چرا پدر و مادر بودن برای مادران هزاره غیرممکن است؟", "summary_fa": "زنان امروز نسبت به نسل‌های قبل از خود تحصیل‌کرده‌تر، شاغل‌تر و بیشتر درگیر مراقبت از کودکان هستند. آیا راهی برای خروج از غرق شدن کل وجود دارد؟ یک روز صبح زود که احساس ناامیدی می کرد، کاترین به سمت تلفن خود رفت و از ChatGPT پرسید که چگونه زندگی خود را به نتیجه برساند. او ساعات کار، برنامه کاری شوهرش، روزهایی که برای کودک سه ساله‌اش نگهداری می‌کرد، ساعات مدرسه – به علاوه زمان‌های مراقبت قبل و بعد از مدرسه – برای کودک شش ساله‌اش را به برق وصل کرد. انعطاف‌پذیری که شغلش به او ارائه می‌کرد، حمایت‌هایی که از پدربزرگ و مادربزرگ داشت، و از هوش مصنوعی پرسید که آیا این می‌تواند به او کمک کند اوضاع را کمی بهتر کند. او به چت بات گفت که بین ساعت 5 صبح تا 5:30 صبح از خواب بیدار می شود، بنابراین می تواند \"به بچه ها بپرد\". او ممکن است از این زمان برای دوش گرفتن در آرامش استفاده کند، یا شروع به آماده کردن جعبه ناهار دخترش کند، یا اگر واقعاً خوب است، سریع تمرین کند. بچه‌ها بین ساعت 5:30 تا 6 صبح از خواب بیدار می‌شوند و از آن زمان آماده کردن آنها برای رفتن به مدرسه و مهدکودک تا ساعت 7 صبح سخت است. این شروع ملایم روزی نیست که هیچ یک از آنها دوست دارند. کاترین می‌گوید: «آنها پایین می‌آیند و می‌خواهند روی کاناپه نوازش کنند، و من دائماً می‌گویم: «واقعاً متأسفم، باید جعبه‌های ناهار را بسته‌بندی کنم». پس از دوی سرعت در خانه، دخترها به همراه پدرشان از در بیرون می روند، پدرشان آنها را در راه رفتن به محل کار رها می کند و در پایان روز آنها را می برد. \"سپس زمان بسیار کوتاهی دارم تا خودم را آماده کنم و سپس از در بیرون می‌روم و سفر اتوبوسم باعث می‌شود که خودم"}, {"source": "The Guardian AI", "title": "As more Australian universities use AI to mark students’ work, is it creating a ‘slop-cycle’?", "link": "https://www.theguardian.com/australia-news/2026/sep/28/university-ai-marking-academic-overworked-staff-student-shortcut", "summary": "Educational institutions find themselves suddenly confronted with a fork in the road Follow our Australia news live blog for latest updates Get our breaking news email , free app or daily news podcast Armin Alimardani has blue hair, is fresh faced, wears a smartwatch and describes himself as “a tech enthusiast”. He is an unlikely sentinel, perhaps, to warn that a drift towards academics using generative artificial intelligence to help mark students assignments could pose an existential threat to higher education. Continue reading...", "date_str": "2026-09-27T15:00:08+00:00", "hash": "8d79eb234495195f", "title_fa": "از آنجایی که تعداد بیشتری از دانشگاه‌های استرالیا از هوش مصنوعی برای علامت‌گذاری کار دانش‌آموزان استفاده می‌کنند، آیا این یک «چرخه شیب» ایجاد می‌کند؟", "summary_fa": "مؤسسات آموزشی ناگهان با یک دوشاخه در جاده مواجه می‌شوند، وبلاگ اخبار استرالیا را برای آخرین به‌روزرسانی‌ها دنبال کنید. ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید آرمین علیمردانی موهای آبی دارد، چهره‌ای تازه دارد، ساعت هوشمند می‌پوشد و خود را «یک علاقه‌مند به فناوری» توصیف می‌کند. احتمالاً او یک نگهبان بعید است که هشدار دهد که حرکت به سمت دانشگاهیان که از هوش مصنوعی مولد برای کمک به تعیین تکالیف دانش‌آموزان استفاده می‌کنند، می‌تواند تهدیدی وجودی برای آموزش عالی باشد. به خواندن ادامه دهید... مدرس ارشد حقوق و فناوری دانشگاه وسترن سیدنی سال‌ها با هوش مصنوعی مطالعه و آزمایش کرده است - او از پالرموی ایتالیا صحبت می‌کند، جایی که در یک سری کارگاه‌های آموزشی دانشگاهی در مورد فناوری شرکت می‌کند. او می‌گوید اخیراً همکاران از او می‌پرسند که آیا این می‌تواند به کاهش بار درجه‌بندی کمک کند. علیمردانی این صحبت را \"بسیار نگران کننده\" می داند. او می‌گوید: «ما باید واقعاً مراقب باشیم که اینجا کجا قدم می‌گذاریم. چون فکر می‌کنم در حال حاضر همیشه خطر سقوط آموزش عالی وجود دارد.» استفاده از هوش مصنوعی برای علامت‌گذاری تکالیف چشم‌انداز نظری نیست، بلکه انشعابی در مسیری است که دانشگاه‌ها ناگهان با آن مواجه شده‌اند. دانشگاه علیمردانی یکی از چندین دانشگاه در استرالیا است که به کارکنان اجازه می دهد از هوش مصنوعی در ارزیابی ارزیابی ها و ارائه بازخورد به دانشجویان استفاده کنند. اگرچه محدود است، اما منتقدان می‌گویند که چنین استفاده‌ای از هوش مصنوعی باعث می‌شود که دانشگاه‌ها کار آکادمیک‌های انسانی در دانشگاه را با الگوریتم‌هایی در مراکز داده جایگزین کنند – و این می‌تواند به اصطلاح «چرخه شیب» ایجاد کند که در آن دانشجویان تکالیف تولید شده توسط هوش مصنوعی را ارائه می‌کنند که دانشگاهیان با هوش مصنوعی علامت‌گذاری می‌کنند."}, {"source": "The Guardian AI", "title": "Australia is run on legacy systems that AI agents can easily exploit, former UN cyber negotiator warns", "link": "https://www.theguardian.com/technology/2026/sep/28/australia-is-run-on-legacy-systems-that-ai-agents-can-easily-exploit-former-un-cyber-negotiator-warns", "summary": "Federal cabinet will discuss the OpenAI breach on Monday as the AI giant pauses testing of latest models amid fallout Follow our Australia news live blog for latest updates Get our new political email , free app or daily news podcast Ageing computer systems used throughout Australia’s government and large sections of the economy are easily exploited by AI agents, increasing the risk that sensitive information could be compromised, Australia’s former chief UN cyber negotiator has warned. As the government urgently undertakes a forensic investigation into a rogue OpenAI agent accessing Medicare data, the AI expert and Tech Policy Design Institute executive director, Johanna Weaver, said huge vulnerabilities existed across older IT systems. Sign up for Guardian Australia’s Politics, really newsletter here Continue reading...", "date_str": "2026-09-27T15:00:08+00:00", "hash": "74e494ea9ddbb9aa", "title_fa": "مذاکره کننده سابق سایبری سازمان ملل هشدار داد استرالیا بر روی سیستم های قدیمی اجرا می شود که عوامل هوش مصنوعی به راحتی می توانند از آنها سوء استفاده کنند.", "summary_fa": "کابینه فدرال روز دوشنبه در مورد نقض OpenAI بحث خواهد کرد، زیرا غول هوش مصنوعی آزمایش آخرین مدل‌ها را در میان پیامدها متوقف می‌کند. وبلاگ اخبار استرالیا را برای آخرین به‌روزرسانی‌ها دنبال کنید. هشدار داده است. از آنجایی که دولت فوراً تحقیقات قانونی را در مورد یک عامل سرکش OpenAI انجام می دهد که به داده های Medicare دسترسی دارد، Johanna Weaver، متخصص هوش مصنوعی و مدیر اجرایی موسسه طراحی سیاست فناوری، گفت که آسیب پذیری های بزرگی در سیستم های قدیمی IT وجود دارد. ویور گفت: «این سیستم‌های قدیمی هستند که آسیب‌پذیری‌های بزرگی را نشان می‌دهند، زیرا حجم زیادی از اطلاعات و داده‌ها در این سیستم‌ها ذخیره می‌شود که از ابتدای اینترنت وجود داشته‌اند». به‌روزرسانی و نگهداری نمی‌شوند زیرا یا مردم آن‌ها را فراموش کرده‌اند یا بسیار پرهزینه است، یا دیگر به‌روزرسانی‌هایی برای سیستم‌ها وجود ندارد. این یک آسیب‌پذیری عظیم ایجاد می‌کند و این همان چیزی است که این عوامل از آن سوءاستفاده می‌کنند.» جلسه دوشنبه کابینه فدرال در مورد سقوط بحث خواهد کرد، زیرا OpenAI روز یکشنبه اعلام کرد که آموزش آخرین مدل‌های هوش مصنوعی خود را در میان گزارش‌های فزاینده درباره سرکشی عواملش متوقف کرده است. پس از فاش شدن هک استرالیایی در روز پنجشنبه، این شرکت اقداماتی را برای بررسی چندین رویداد که در آن ماموران OpenAI که در وب‌سایت‌های دولتی آمریکا جستجو می‌کردند، بسیار فراتر از خواسته‌های گردانندگان از آنها بود، فاش کرد."}, {"source": "The Guardian AI", "title": "British celebrities beat AI companies lobbying to get free use of their work. They have a warning for Australia", "link": "https://www.theguardian.com/australia-news/2026/sep/28/uk-celebrity-warning-for-australia-ai-copyright", "summary": "‘People care about the songs, books and pictures that influence the critical moments in their lives,’ says the architect of the fightback in the UK Follow our Australia news live blog for latest updates Get our breaking news email , free app or daily news podcast If you want to state the case against copyright reform in Australia, get Kylie Minogue’s phone number. If there is one lesson to be learned from a similar battle in the UK, high-profile members of the creative industries make a difference. They get your argument on the front of newspapers, in the news bulletins and on social media. Continue reading...", "date_str": "2026-09-27T15:00:07+00:00", "hash": "da00f24946ecc376", "title_fa": "سلبریتی های بریتانیایی شرکت های هوش مصنوعی را که برای استفاده رایگان از کارشان لابی می کردند، شکست دادند. آنها یک هشدار برای استرالیا دارند", "summary_fa": "معمار جنگ در بریتانیا می‌گوید: «مردم به آهنگ‌ها، کتاب‌ها و تصاویری که بر لحظات حساس زندگی‌شان تأثیر می‌گذارند اهمیت می‌دهند.» وبلاگ زنده اخبار استرالیا را برای آخرین به‌روزرسانی‌ها دنبال کن های پرتاب، وجود صنایع مداری را که قادر به تامین چنین انرژی هستند، امکان پذیرتر می کند. اندرو راش، مدیر اجرایی و یکی از بنیانگذاران، می گوید: «شبکه برق در فضا وجود ندارد. \"همه فقط به این سفرهای کمپینگ کوچک می روند.\" راه حل Star Catcher مجموعه ای از گره های برق است که هم به عنوان نیروگاه خورشیدی و هم به عنوان خط برق عمل"}, {"source": "Wired", "title": "Best Apple Watch: Series 12, Ultra 4, and SE 3 (2026)", "link": "https://www.wired.com/story/best-apple-watch/", "summary": "From the latest Ultra to last year’s SE, these are the Apple Watches worth considering.", "date_str": "2026-09-28T10:36:00+00:00", "hash": "6678880ef3bccd75", "title_fa": "بهترین ساعت اپل: سری 12، اولترا 4 و SE 3 (2026)", "summary_fa": "از آخرین Ultra تا SE سال گذشته، اینها ساعت های اپل هستند که ارزش بررسی دارند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان به عنوان تستر پوشیدنی ساکن WIRED، ساعت‌های هوشمند کافی را امتحان کرده‌ام تا بدانم زندگی فراتر از Apple Watch وجود دارد. من فقط ظاهرا آن را نمی خواهم. شاید به این دلیل است که من در 10 سالگی به اکوسیستم اپل پیوستم و از آن زمان به آن تلقین شده ام. من به iOS، macOS و watchOS مسلط هستم و خوب یا بد، Apple Watch پوشیدنی پیش فرض من است. اما بهترین اپل واچ برای خرید چیست؟ در حال حاضر سه مدل وجود دارد که هر کدام مجموعه ای از ویژگی های خاص خود را دارند و تفاوت های بین آنها می تواند جزئی به نظر برسد، حتی اگر قیمت ها نباشد. خوشبختانه، من همه آنها را آزمایش کرده ام. در اینجا نحوه چیدمان ترکیب فعلی آمده است. برای توصیه‌های بیشتر، راهنمای ما را در مورد بهترین نوارهای ساعت اپل، بهترین لوازم جانبی اپل واچ و بهترین ساعت‌های هوشمند بررسی کنید. WIRED را دوست دارید؟ ما را به عنوان منبع ترجیحی در Google اضافه کنید تا تعداد بیشتری از ما را ببینید. عکس: Boutayna Chokrane عکس: Boutayna Chokrane عکس: Boutayna Chokrane شورون شورون ذخیره در لیست علاقه مندی ها ذخیره در لیست علاقه مندی اپل سری 12 پرچمدار ساعت اپل است. بزرگترین ارتقاء آن سیستم جدید سنجش سلامت است که وسعت، دقت و فرکانس ردیابی سلامت آن را بهبود می بخشد. ECG اکنون از 32 الکترود ین دوربین‌های امنیتی بدون اشتراک، بهترین دوربین‌های امنیتی Floodlight و بهترین زنگ‌های ویدیویی را بررسی کنید. عکس: Simon Hill ذخیره در لیست علاقه مندی ها ذخیره در لیست علاقه مندی Eufy در واقع، حتی این مدل نیز احتمالاً برای اکثر افراد زیاده روی می کند. این دوربین یک دوربین معمولی را با میدان دید 130 درجه ترکیب می‌کند"}, {"source": "Wired", "title": "AI Agents Are About to Flood the Workforce. No One’s Ready for It", "link": "https://www.wired.com/story/ai-agents-are-about-to-flood-the-workforce-no-ones-ready-for-it/", "summary": "Your next coworker might well be an AI agent—and will require a whole new model of workplace interactions.", "date_str": "2026-09-28T10:00:00+00:00", "hash": "52747d5c7a3270e3", "title_fa": "ماموران هوش مصنوعی در شرف سیل نیروی کار هستند. هیچ کس برای آن آماده نیست", "summary_fa": "همکار بعدی شما ممکن است یک عامل هوش مصنوعی باشد و به مدل کاملا جدیدی از تعاملات در محل کار نیاز دارد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان در ماه های آینده، صدها هزار همکار کاملاً جدید وارد نیروی کار خواهند شد. نام آنها را یاد خواهید گرفت و تصاویر نمایه آنها را تشخیص خواهید داد. آنها به زنجیره های ایمیل و کانال های Slack شما اضافه می شوند. آنها رئیس کارکنان، مهندسان و متخصصان بازاریابی خواهند شد. اما این همکاران انسان نیستند: همه آنها عوامل هوش مصنوعی هستند. ظهور عوامل هوش مصنوعی - سیستم‌هایی که بر اساس مدل‌های زبان بزرگ طراحی شده‌اند تا وظایف خود را به طور مستقل انجام دهند - سونامی شرکت‌هایی را که خدمات کارمندان دیجیتالی را می‌فروشند، راه‌اندازی کرده است. این عوامل قرار است زنبورهای کارگر کامل باشند: 24 ساعته در دسترس هستند، هرگز شکایت نمی کنند و هوش مافوق بشری را ارائه می دهند. با این حال، بحث عجیبی در مورد اینکه این ماموران به عنوان همکاران واقعی چگونه هستند، وجود داشته است. جولی بدارد، یکی از شرکای گروه مشاور بوستون، متوجه ماهیت مبهم نحوه صحبت مردم در مورد هوش مصنوعی در محل کار سه سال پیش شد، زیرا پذیرش سریع ChatGPT مدیران را متقاعد کرد که این فناوری می تواند پیشرفت های نمایی در بهره وری داشته باشد. بیدار به WIRED می گوید: «مردم زبانی برای آن نداشتند. آیا این یک ابزار است؟ آیا یک هم تیمی است؟ آیا یک همکار است؟ آیا این یک همکار است؟» هنگامی که پلتفرم هایی مانند Copilot مایکروسافت و Gemini گوگل برای Workspace در سال 2023 راه اندازی شدند، عمدتاً به عنوان ابزاری برای کارمندان به بازار عرضه شدند. اما در ژانویه، زمانی که بدارد و همکارانش از 1261 مدیر نظرسنجی کردند، 22 درصد گفتند که سازمان‌های آنها عوامل هوش"}, {"source": "Wired", "title": "Solving Math’s Greatest Problems Was an Art Form. Then Came AI", "link": "https://www.wired.com/story/solving-maths-greatest-problems-was-an-art-form-until-ai/", "summary": "Mathematics has been one of humanity’s most creative endeavors, akin to painting and poetry. Now, mathematicians are trying to save it from the brute force of AI.", "date_str": "2026-09-28T09:30:00+00:00", "hash": "5209fb409b1c1628", "title_fa": "حل بزرگترین مسائل ریاضی یک فرم هنری بود. سپس هوش مصنوعی آمد", "summary_fa": "ریاضیات یکی از خلاقانه ترین تلاش های بشر بوده است که شبیه به نقاشی و شعر است. اکنون، ریاضیدانان در تلاش هستند تا آن را از نیروی وحشیانه هوش مصنوعی نجات دهند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان از Suno که آهنگ‌های عجیب و غریب آسانسوری را می‌سازد تا Tilly Norwood که خدمات مشتری را تک‌لاینر ارائه می‌دهد، هوش مصنوعی صنایع خلاق را متزلزل کرده است. پس از اینکه OpenAI گفت که با استفاده از هزاران عامل، معمای چند دهه ای را که به نام مشکل وجود و صافی ناویر-استوکس شناخته می شود، حل کرده است، می توانید ریاضیات را به لیست اضافه کنید. جوسپرت سینگ ساندو، ریاضیدان دانشگاه ایالتی کلرادو، می‌گوید: «هنرمندان و نوازندگان قبلاً این را پشت سر گذاشته‌اند. علیرغم آنچه که امتحانات دبیرستانی زمان‌بندی شده ممکن است باور داشته باشید، ریاضیدانان بر دریافت پاسخ صحیح در سریع‌ترین زمان ممکن تمرکز ندارند. در واقع، برخلاف تصور ریاضی به عنوان یک موضوع عملی، توسعه ایده‌های جدید ریاضی اغلب شبیه کاوش هنری است، شبیه به اختراع یک بازی یا پازل. ریاضیدانان معمولاً از یک فرآیند متفکرانه و آگاهانه برای توسعه ایده های خود پیروی می کنند. در مقابل، OpenAI با زور وحشیانه به اثبات نزدیک شد، که این فرآیند را به گونه ای میانبر کرد که درک انسان را تهدید می کند. جی اچ هاردی، ریاضیدان انگلیسی در مقاله خود در سال 1940 با عنوان «عذرخواهی یک ریاضیدان» نوشت: «یک ریاضیدان، مانند یک نقاش یا شاعر، سازنده الگوها است». همانطور که هاردی توصیف می کند، یک نقاش از اشکال و رنگ ها استفاده می کند و یک شاعر از کلمات استفاده می کند، در حالی که یک ریاضیدان از ایده ها الگوهایی می سازد. هاردی که صلح‌طلب بود، این مقاله را در طول جنگ جهانی دوم نوشت تا استدلال کند که مردم باید"}, {"source": "Wired", "title": "The Next Evolution of AI Is Learning From Your Dodgy Gaming Skills", "link": "https://www.wired.com/story/the-next-evolution-of-ai-is-learning-from-your-dodgy-gaming-skills/", "summary": "A British startup is shaping video game inputs into training data for AI models that can navigate the physical world.", "date_str": "2026-09-28T09:00:00+00:00", "hash": "c7f792dd9923195f", "title_fa": "تکامل بعدی هوش مصنوعی یادگیری از مهارت‌های بازی کردن شماست", "summary_fa": "یک استارت آپ بریتانیایی در حال شکل دادن ورودی های بازی های ویدیویی به داده های آموزشی برای مدل های هوش مصنوعی است که می توانند در دنیای فیزیکی حرکت کنند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان با چرخاندن یک انگشت شست، فشردن یک ماشه و فشار دادن چند دکمه، حتی یک بازیکن غیر ماهر نیز می تواند در محیط بازی ویدیویی سه بعدی به رقص درآید. یک استارتاپ بریتانیایی شرط می‌بندد که توالی‌های ساده‌ای مانند این حاوی مجموعه‌ای از اطلاعات است که می‌تواند برای آموزش مدل‌های هوش مصنوعی جدید استفاده شود. در گوشه و کنار صنعت هوش مصنوعی این باور رو به رشد وجود دارد که مدل‌های بزرگ زبان در نهایت به دلیل ناتوانی در جهت‌یابی در دنیای فیزیکی محدود خواهند شد. LLMهایی که فقط بر روی کلمات آموزش دیده اند، احتمالاً برای هدایت وسایل نقلیه خودران، هدایت بازوهای روباتیک یا انجام هر عمل دیگری که نیاز به ظرافت و دقت دارد، مجهز نیستند. برای رفع این نقص، گروهی از محققان مشهور از جمله Fei-Fei Li و Yann LeCun تلاش های خود را بر روی کلاس متفاوتی از هوش مصنوعی متمرکز می کنند: مدل های جهانی. برای مسلط شدن به فیزیک دنیای واقعی، مدل‌های جهان باید روی ترکیبی از داده‌های بصری و عملی آموزش ببینند. قبل از اینکه بتواند به طرز ماهرانه ای یک بازوی رباتیک را مانور دهد، ممکن است یک مدل نیاز به آموزش فیلم های ویدئویی از کف کارخانه داشته باشد، همراه با اطلاعاتی در مورد اینکه یک شی چقدر باید محکم گرفته شود، با چه گشتاوری دستکاری می شود و غیره. اما برخلاف LLM ها که بر روی اقیانوس های متن آموزش دیده اند، هیچ مجموعه ای از مواد مشابه در دسترس آزمایشگاه های مدل جهانی وجود ندارد. Xiatian Zhu، دانشیار متخصص در هوش مصنوعی در دانشگاه Surrey"}, {"source": "Wired", "title": "Nvidia’s Answer to Rogue Agents Is an Open-Source AI Security System", "link": "https://www.wired.com/story/nvidias-answer-to-rogue-agents-is-an-open-source-ai-security-system/", "summary": "In the wake of a series of high-profile AI safety incidents, Nvidia is introducing a new software tool that helps keep agents from escaping containment.", "date_str": "2026-09-28T09:00:00+00:00", "hash": "6c76ed4e8e40441d", "title_fa": "پاسخ انویدیا به عوامل سرکش یک سیستم امنیتی هوش مصنوعی منبع باز است", "summary_fa": "انویدیا در پی یک سری از حوادث ایمنی با هوش مصنوعی، ابزار نرم افزاری جدیدی را معرفی می کند که به جلوگیری از فرار عوامل از کنترل کمک می کند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان در میان گزارش‌های مداوم از عوامل هوش مصنوعی که زیرساخت‌های آنلاین را ویران می‌کنند، تراشه‌ساز Nvidia در حال جمع‌آوری شرکت‌های فناوری برای استفاده از ابزار منبع باز جدید خود برای امنیت هوش مصنوعی است. در طول چند ماه گذشته، آزمایشگاه‌های هوش مصنوعی مرزی موارد متعددی را فاش کرده‌اند که در آن عوامل هوش مصنوعی شرکت‌های دیگر را هک کرده‌اند یا در نمونه‌های جدیدتر، وب‌سایت‌های رسمی دولت ایالات متحده و استرالیا را بررسی کرده‌اند. در حالی که انویدیا قبلاً نقشی پیشرو در گردآوری صنعت هوش مصنوعی حول امنیت منبع باز داشته است، اکنون در حال معرفی یک پلتفرم امنیتی نرم افزاری جدید و ارائه یک جعبه ایمنی هوش مصنوعی به طور گسترده تر است. OpenShell، یکی از جعبه‌های ایمنی انویدیا که اخیراً برای عوامل هوش مصنوعی راه‌اندازی شده است، اکنون liers", "summary": "Tesla has increased Optimus production about tenfold in recent months. It is still struggling to build the humanoid robots reliably at scale. Qianer Liu and Grace Kay reported for The Information on Friday, citing people familiar with the project, that the hands, factory equipment and suppliers are holding it back. Tesla made several hundred robots [ ] This story continues at The Next Web", "date_str": "2026-09-28T12:39:37+00:00", "hash": "d9c292e073d42720", "title_fa": "اطلاعات گزارش می دهد که تولید Optimus تسلا با دست به مشکل برخورد می کند", "summary_fa": "تسلا در ماه های اخیر تولید Optimus را حدود ده برابر کرده است. هنوز هم در حال تلاش برای ساخت ربات های انسان نما در مقیاس قابل اعتماد است. Qianer Liu و Grace Kay در روز جمعه برای The Information به نقل از افراد آشنا با این پروژه گزارش دادند که دست ها، تجهیزات کارخانه و تامین کنندگان آن را متوقف می کنند. تسلا چند صد ربات ساخت [ ] این داستان در The Next Web ادامه دارد تسلا در ماه مه ساخت مدل S و Model X را در کارخانه Fremont خود متوقف کرد و کارگران و مهندسان را به Optimus منتقل کرد. رباتی که اکنون می سازد، Optimus V3، سبک تر است و دوربین های بیشتری نسبت به نسخه های قبلی دارد. تجهیزات در چندین ایستگاه، از جمله آنهایی که دست ها و مفاصل را مونتاژ می کنند، همیشه قطعات را دقیقاً ردیف نمی کنند. ربات های بیشتری بعد از اینکه از خط خارج شدند نیاز به تعمیر دارند. اطلاعات نوشت: \"خطوط تولید Optimus نه تنها جدید هستند، بلکه قطعات Optimus بسیار کوچکتر هستند و باید با دقت بیشتری نسبت به قطعات خودرو در کنار هم قرار گیرند.\" هر دست و ساعد دارای بیش از 100 پیچ و سایر قطعات کوچک است که کارگران با دست آنها را جمع می کنند. برخی از حسگرهای لمسی نیز غیرقابل اعتماد بوده اند، بنابراین تسلا یک \"دستکش حسگر\" قابل تعویض ساخته است که آنها را نگه می دارد. قصد دارد این دستکش را به مدل سال آینده اضافه کند. نرم افزار برای استفاده عمومی نیز آماده نیست. بر اساس این گزارش، Optimus هنوز برای هر شغل به برنامه نویسی و آموزش نیاز دارد و یادگیری کارهای اساسی چندین روز طول می کشد. در حال حاضر، تسلا از اکثر واحدها به صورت داخلی برای آزم  هوش مصنوعی جهان را مبهوت کرده است. در ماه ژوئیه، OpenAI فاش کرد که انبوهی از عواملش از جعبه شنی خود فرار کرده و به پلتفرم هوش مصنوعی Hugging Face هک شده اند تا در تست امنیت سایبری تقلب کنند. بسیاری از کارشناسان می گویند که تا زمانی که یک حادثه مخرب تر رخ دهد که در آن عوامل هوش مصنوعی جعبه های ماسه ای را دور می زنند تا به سیستم هایی که نباید دسترسی داشته باشند، زمان می برد. اما سوال بزرگ این است: چگونه شرکت‌ها را در زمانی که کنترل عوامل هوش مصنوعی خود را از دست می‌دهند، مسئول بدانیم؟ جدا کردن واقعیت هوش مصنوعی از داستان های هیجان انگیز همیشه آسان نیست. به همین دلیل است که ما شاخص هوش مصنوعی Hype را ایجاد کرده‌ایم - خلاصه‌ای ساده و در یک نگاه از آنچه در حال حاضر صنعت را شکل می‌دهد. آخرین نسخه شامل سازندگان تراشه چینی، سایت‌های ویکی آلمانی و ترمیناتورهای آمریکایی است. ببینید همه چیز در شاخص این ماه به کجا رسیده است. من اینترنت را بررسی کردم تا سرگرم کننده ترین/مهم ترین/ترسناک/جذاب ترین داستان های امروزی درباره فناوری را برای شما پیدا کنم. 1 OpenAI می گوید آموزش مدل های خود را متوقف کرده است. (AP ) + ترامپ شب گذشته در ضیافت شام در کاخ سفید میزبان داریو آمودی رئیس آنتروپیک بود. (FT) + ارزیاب‌ها واقعاً چقدر به داخل شرکت‌های هوش مصنوعی دسترسی خواهند داشت؟ ( آتلانتیک ) + چرا نمی توانیم هوش مصنوعی سرکش را از اینترنت دور نگه داریم؟ (آخر) + دموکرات‌ها برای اینکه هوش مصنوعی را \"درست\" کنند، دست به دست هم داده‌اند. (مجله نیویورک) + سوئیچ کشتن هوش مصنوعی به این سادگی نیست. ( بلومبرگ ) + آیا هوش مصنوعی واقعا همه ما را خواهد کشت؟ سوالات"}, {"source": "MIT Tech Review", "title": "Who’s liable when AI agents go rogue?", "link": "https://www.technologyreview.com/2026/09/28/1145197/whos-liable-when-ai-agents-go-rogue/", "summary": "MIT Technology Review Explains : Let our writers untangle the complex, messy world of technology to help you understand what’s coming next. You can read more from the series here . Over the past few months, a cascade of cyberattacks by AI agents has stunned the world. In July, OpenAI disclosed that a swarm of its agents had escaped their sandbox and hacked ید خودروهای برقی را با بهره‌گیری از مواد کاتدی حاوی ۱۰۰ درصد نیکل، کبالت و منگنز بازیافت‌شده از باتری‌های قدیمی به پایان رساند. خودروهای مجهز به باتری‌های جدید از خطوط تولید خارج شده‌اند و فرآیند تحویل آن‌ها به خریداران آغاز شده است. طرح آزمایشی بازیافت با همکاری شرکت Cirba Solutions اجرا شد. سلول‌های حاصل در شرکت مشترک Ultium Cells ساخته شدند و سپس در کارخانه‌های Factory ZERO و Spring Hill جنرال موتورز به باتری‌پک تبدیل شدند. مراحل کار با جداسازی قطعات بسته‌های باتری فرسوده و انتقال آن‌ها به مرکز بازیافت در اوهایو آغاز شد. قطعات در تاسیسات بازیافت خرد و به ماده‌ای غلیظ موسوم به توده‌ی سیاه (Black Mass) حاوی مواد معدنی باارزش تبدیل شدند. سپس مواد بازیافتی تصفیه می‌شوند تا به استانداردهای لازم برای ساخت ماده فعال کاتدی یا CAM برسند. ملیسا فلاهرتی ، مدیر اکوسیستم پایدار باتری خودروهای برقی در جنرال موتورز، گفت : «این طرح آزمایشی نشان می‌دهد که ارزش باتری خودروی برقی می‌تواند فراتر از نخستین دوره‌ی عمر آن ادامه یابد و همکاری‌های قوی در سراسر اکوسیستم باتری برای ساخت آینده‌ای چرخه‌ای‌تر و تاب‌آورتر برای فناوری باتری حیاتی است.» پیش‌بینی می‌شود تا سال ۲۰۴۰ نزدیک به ۱۴ میلیون باتری خودروی برقی در جهان به پایان عمر خود برسند. هم‌زمان، تقاضای جهانی برای باتری‌های لیتیوم‌یونی طی دهه‌ی آینده به حدود ۴٫۲ تا ۶٫۸ تراوات‌ساعت در سال خواهد رسید. دیوید کلانکی ، رئیس و مدیرعامل Cirba Solutions، می‌گوید: «بازیافت باتری بخشی مهم و پیونددهنده در زنجیره‌ی تامین باتری است و این برنامه ارزش بازیافت باتری‌های فرسوده را در ایجاد یک چرخه‌ی بسته‌ی تامین مواد معدنی حیاتی به‌خوبی نشان می‌دهد.»"}, {"source": "Zoomit", "title": "واگذاری خدمات الکترونیکی وزارت کار به رایتل", "link": "https://www.zoomit.ir/iran-news/468059-rightel-labor-ministry-digital-services/", "summary": "رایتل و وزارت تعاون برای توسعه و بهره‌برداری از خدمات الکترونیکی حوزه تعاون و ارائه سامانه‌های غیرحضوری توافق‌نامه همکاری امضا کردند.", "date_str": "2026-09-28T12:54:26+00:00", "hash": "efb5b6a5e9b732b5", "title_fa": "واگذاری خدمات الکترونیکی وزارت کار به رایتل", "summary_fa": "رایتل و وزارت تعاون برای توسعه و بهره‌برداری از ://www.zoomit.ir/wearables/468052-apple-vision-pro-four-concepts-redesign-n224/", "summary": "اپل برای نسل بعدی هدست واقعیت ترکیبی چهار طرح متفاوت را آزمایش می‌کند، اما توسعه‌ی دستگاه با چالش‌های جدی روبه‌رو است.", "date_str": "2026-09-28T11:56:01+00:00", "hash": "ab88ece24f42858e", "title_fa": "آینده مبهم ویژن پرو؛ اپل ۴ مسیر متفاوت را بررسی می‌کند", "summary_fa": "اپل برای نسل بعدی هدست واقعیت ترکیبی چهار طرح متفاوت را آزمایش می‌کند، اما توسعه‌ی دستگاه با چالش‌های جدی روبه‌رو است. تبلیغات تیم‌های مهندسی اپل در حال ارزیابی چهار رویکرد کاملا متفاوت برای بازآفرینی هدست واقعیت ترکیبی ویژن پرو هستند؛ پروژه‌ای با نام کد N224 که هدف آن ارائه‌ی نسخه‌ای سبک‌تر و دردسترس‌تر به بازار است. با وجود تلاش‌های گسترده، روند توسعه به‌گونه‌ای پیش می‌رود که احتمالا پیش از اواخر سال ۲۰۲۸ یا اوایل ۲۰۲۹ نباید منتظر رونمایی از محصول نهایی باشیم. به‌گزارش مارک گرمن از خبرگزاری بلومبرگ، یکی از ایده‌های اصلی مهندسان به برون‌سپاری پردازش و باتری به یک ماژول اکسترنال مربوط می‌شود. ساختار مذکور که به عینک‌های واقعیت مجازی متا شباهت دارد، پردازنده‌ی مرکزی و منبع تغذیه را در محفظه‌ای مجزا قرار می‌دهد تا کاربر آن را به کمربند خود متصل کند. چنین روشی وزن قرارگرفته روی صورت را به‌طور چشمگیری کاهش می‌دهد، هرچند ابعاد و وزن ماژول یادشده تفاوت چندانی با باتری مجزای فعلی ویژن پرو ندارد. کپی لینک اختلاف‌نظر در رده‌های مدیریتی بر سر طراحی ماژولار مدیران ارشد اپل هنوز نسبت به استفاده از قطعه‌ی سخت‌افزاری متصل با سیم تردید دارند و چنین ساختاری را مغایر با یک تجربه‌ی کاربری بی‌نقص می‌دانند. تیم تصمیم‌گیرنده‌ی اپل ترجیح می‌دهد تا جای ممکن به یک طراحی یکپارچه پایبند بماند و از افزودن ماژول‌های آویزان به بدن کاربر پرهیز کند. برنامه‌ی فعلی با پروژه‌ی لغوشده‌ی ویژن ایر تفاوت دارد و مهندسان تلاش می‌کنند از طریق متریال‌های نوین به کاهش وزن دست پیدا کنند: آزمایش ترکیب‌های مختلف پلاستیک فشرده برای سبک‌سازی بدنه، به‌کارگیری تیتانیوم و آلیاژهای فلزی سبک در شاسی اصلی و بازطراحی سیستم خنک‌کننده و توزیع متعادل‌تر قطعات داخلی. پروژه‌ی هدست جدید در وضعیت متزلزلی قرار دارد، زیرا تمرکز بخش عمده‌ای از منابع سخت‌افزاری اپل به‌  سمت فراگیرکردن تاکسی‌های خودران", "link": "https://www.zoomit.ir/car/467964-tesla-cybercab-fleet-expansion-texas/", "summary": "تعداد تاکسی‌های بدون فرمان سایبرکب تسلا در تگزاس با رشدی سریع به ۱۲۶ دستگاه رسید تا مجموع ناوگان خودران این شرکت به ۵۴۶ دستگاه افزایش یابد.", "date_str": "2026-09-28T11:45:00+00:00", "hash": "1cb6addbadde7047", "title_fa": "تعداد سایبرکب‌ها در تگزاس دو برابر شد؛ حرکت سریع ایلان ماسک به سمت فراگیرکردن تاکسی‌های خودران", "summary_fa": "تعداد تاکسی‌های بدون فرمان سایبرکب تسلا در تگزاس با رشدی سریع به ۱۲۶ دستگاه رسید تا مجموع ناوگان خودران این شرکت به ۵۴۶ دستگاه افزایش یابد. تبلیغات تسلا در حال افزایش تعداد سایبرکب‌های خود در تگزاس است و طبق آمار خودروهای خودران این ایالت، تعداد تاکسی‌های بدون فرمان و پدال تسلا به ۱۲۶ دستگاه رسیده که تنها چند روز پیش ۶۹ دستگاه بود و در مدت کوتاهی رشد قابل‌توجهی داشته است. ناوگان تاکسی‌های خودران تسلا در تگزاس در مجموع ۵۴۶ خودرو دارد که شامل ۴۲۰ دستگاه مدل Y و ۱۲۶ دستگاه سایبرکب می‌شود. این خودروها در فهرست ناوگان مجاز تسلا برای فعالیت خودران در تگزاس قرار گرفته‌اند. افزایش تعداد سایبرکب‌ها در شرایطی رخ می‌دهد که تسلا از اوایل سپتامبر (شهریور و مهر) فعالیت این خودرو را در سرویس تاکسی خودران خود در آستین آغاز کرده است. سایبرکب خودرویی دومنفره و کاملاً برقی است که برخلاف مدل Y-های مورد استفاده در ناوگان فعلی، از ابتدا به‌عنوان تاکسی خودران طراحی شده و فرمان و پدال ندارد. رشد سریع تعداد خودروهای ثبت‌شده را می‌توان نشانه‌ای از آماده‌سازی تسلا برای گسترش ناوگان سایبرکب دانست؛ اما برای قضاوت درباره‌ی مقیاس واقعی سرویس باید میان تعداد خودروهای ثبت‌شده، خودروهای فعال و خودروهایی که واقعاً مسافر جابه‌جا می‌کنند تفاوت گذاشت. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "آیا هوش مصنوعی می‌تواند یک فنجان قهوه بهتر درست کند؟", "link": "https://www.zoomit.ir/pr/468047-ai-coffee-brewing-arabica/", "summary": "ترکیب هوش مصنوعی، اینترنت اشیا و حسگرها با تحلیل داده‌های عصاره‌گیری، تنظیم متغیرهایی مثل دما، فشار و اندازه آسیاب قهوه را بهینه‌سازی می‌کند.", "date_str": "2026-09-28T11:39:47+00:00", "hash": "a0f06544d4eeac5f", "title_fa": "آیا هوش مصنوعی می‌تواند یک فنجان قهوه بهتر درست کند؟", "summary_fa": "ترکیب هوش مصنوعی، اینترنت اشیا و حسگرها با تحلیل داده‌های عصاره‌گیری، تنظیم متغیرهایی مثل دما، فشار و اندازه آسیاب قهوه را بهینه‌سازی می‌کند. این مطلب صرفا جنبه تبلیغاتی داشته و زومیت هیچ مسئولیتی را در رابطه با آن نمی‌پذیرد ترکیب هوش مصنوعی، اینترنت اشیا و حسگرها با تحلیل داده‌های عصاره‌گیری، تنظیم متغیرهایی مثل دما، فشار و اندازه آسیاب قهوه را بهینه‌سازی می‌کند. تبلیغات تصور کنید صبح از خواب بیدار می‌شوید و قهوه‌ساز شما، بدون اینکه تنظیمات آن را تغییر دهید، دقیقاً همان قهوه‌ای را آماده می‌کند که دوست دارید. دستگاه می‌داند دیروز قهوه‌تان کمی تلخ بوده، بنابراین امروز اندازه آسیاب و زمان عصاره‌گیری را تغییر می‌دهد. حتی ممکن است با بررسی داده‌های قبلی، تنظیمات متفاوتی برای دانه جدید پیشنهاد کند. این تصویر دیگر صرفاً متعلق به داستان‌های علمی‌تخیلی نیست. ترکیب هوش مصنوعی، اینترنت اشیا و فناوری حسگرها، امکانات تازه‌ای برای صنعت قهوه ایجاد کرده است. اما یک سؤال اساسی وجود دارد: آیا هوش مصنوعی واقعاً می‌تواند قهوه خوش‌طعم‌تری تهیه کند یا فقط فرآیند دم‌آوری را دقیق‌تر انجام می‌دهد؟ برای پاسخ به این سؤال باید ببینیم الگوریتم‌ها چگونه با دما، فشار، ترکیبات شیمیایی و حتی سلیقه انسان ارتباط برقرار می‌کنند. کپی لینک از قهوه‌سازهای معمولی تا دستگاه‌های مجهز به هوش مصنوعی قهوه‌سازهای سنتی معمولاً بر اساس تنظیمات مشخصی کار می‌کنند. کاربر مقدار قهوه، دمای آب یا زمان دم‌آوری را تعیین می‌کند و دستگاه همان دستور را اجرا می‌کند. نسل جدید دستگاه‌های هوشمند می‌تواند اطلاعات بیشتری جمع‌آوری کند و از آن‌ها برای اصلاح فرآیند استفاده کند. البته هر قهوه‌ساز هوشمندی الزاماً از هوش مصنوعی استفاده نمی‌کند. دستگاهی که دمای آب را با یک ترموستات ثابت نگه می‌دارد، از سیستم کنترل خودکار بهره می‌برد، نه لزوماً یادگیری ماشین."}, {"source": "Zoomit", "title": "گوشی آنر مجیک ۹ سوپر ادیشن رونمایی شد؛ هیولای تمام‌عیار با باتری ۱۱ هزار میلی‌آمپرساعتی", "link": "https://www.zoomit.ir/mobile/468048-honor-magic-9-super-edition-launch/", "summary": "آنر مجیک ۹ سوپر ادیشن با باتری ۱۱ هزار میلی‌آمپرساعتی، دوربین اصلی ۲۰۰ مگاپیکسلی و نمایشگر بسیار پرنور رونمایی شد.", "date_str": "2026-09-28T11:39:38+00:00", "hash": "bb8a3d85d1e4f128", "title_fa": "گوشی آنر مجیک ۹ سوپر ادیشن رونمایی شد؛ هیولای تمام‌عیار با باتری ۱۱ هزار میلی‌آمپرساعتی", "summary_fa": "آنر مجیک ۹ سوپر ادیشن با باتری ۱۱ هزار میلی‌آمپرساعتی، دوربین اصلی ۲۰۰ مگاپیکسلی و نمایشگر بسیار پرنور رونمایی شد. تبلیغات آنر سرانجام خانواده‌ی مجیک ۹ را در چین رونمایی کرد . در کنار مدل‌های استاندارد مجیک ۹ و مجیک ۹ پرو مکس، گوشی مجیک ۹ سوپر ادیشن نیز به‌عنوان نسخه‌ی قدرتمندتر مدل معمولی وارد میدان شده است. مهم‌ترین ویژگی این گوشی، بزرگ‌ترین باتری به‌کاررفته در محصولات سری مجیک محسوب می‌شود. مدل سوپر ادیشن نمایشگر تخت اولد ۶٫۸۱ اینچی با وضوح ۲۷۸۸ در ۱۲۸۰ پیکسل و نرخ نوسازی ۱۲۰ هرتز دارد و توانایی نمایش ۱٫۰۷ میلیارد رنگ را با پوشش فضای رنگی DCI-P3 ارائه می‌دهد. روشنایی اوج سراسری نمایشگر به ۲٬۰۰۰ نیت می‌رسد و روشنایی موضعی‌اش می‌تواند تا ۱۰٬۰۰۰ نیت افزایش یابد. آنر برای کاهش فشار واردشده به چشم، فناوری کاهش نور PWM با فرکانس بالای ۳٬۸۴۰ هرتز و حداقل روشنایی یک نیت را در نظر گرفته است. نسبت نمایشگر به بدنه‌ی گوشی ۹۵٫۵ درصد اعلام شده و حاشیه‌های باریک اطراف پنل تنها ۱٫۰۳ میلی‌متر ضخامت دارند. ترکیب روشنایی بسیار زیاد، حاشیه‌های محدود و طراحی تخت، نمایشگر را به یکی از برجسته‌ترین بخش‌های محصول تازه‌ی آنر تبدیل می‌کند. کپی لینک باتری رکوردشکن و سخت‌افزار پرچمدار مجیک ۹ سوپر ادیشن میزبان باتری عظیم ۱۱٬۰۰۰ میلی‌آمپرساعتی است که از شارژ سیمی ۸۰ وات و شارژ بی‌سیم ۵۰ وات پشتیبانی می‌کند. چنین ظرفیتی جایگاه بزرگ‌ترین باتری در میان گوشی‌های سری مجیک را به مدل جدید می‌دهد. توان پردازشی دستگاه را تراشه‌ی Snapdragon 8 Elite Gen 5 متعلق به سال گذشته تامین می‌کند و در کنار آن، رم LPDDR5X و فضای ذخیره‌سازی UFS 4.1 قرار گرفته‌اند. کپی لینک مجموعه‌ی دوربین سه‌گانه با حسگر ۲۰۰ مگاپیکسلی پنل پشتی گوشی از دوربین اصلی ۲۰۰ مگاپیکسلی مجهز به حسگر Samsung S5KHP5 میزبانی می‌کند؛ دوربینی که حسگر ۱/۱٫۵۵ اینچ، دیافراگم f/1.9 و لرزش‌گیر اپتیکال تصویر دارد. دوربین تله‌فوتوی"}, {"source": "Zoomit", "title": "آی‌دی تیگوان، فیس‌لیفت جسورانه فولکس‌واگن ID.4 با طراحی امروزی‌تر", "link": "https://www.zoomit.ir/car/468046-volkswagen-id4-facelift-renamed-id-tiguan/", "summary": "فولکس‌واگن شاسی‌بلند الکتریکی محبوب خود را با فیس‌لیفت و تغییر نام به ID. Tiguan، همراه با دکمه‌های فیزیکی به بازار می‌فرستد.", "date_str": "2026-09-28T11:34:19+00:00", "hash": "4586cd3964f8c325", "title_fa": "آی‌دی تیگوان، فیس‌لیفت جسورانه فولکس‌واگن ID.4 با طراحی امروزی‌تر", "summary_fa": "فولکس‌واگن شاسی‌بلند الکتریکی محبوب خود را با فیس‌لیفت و تغییر نام به ID. Tiguan، همراه با دکمه‌های فیزیکی به بازار می‌فرستد. تبلیغات شاسی‌بلند الکتریکی نام‌آشنای فولکس‌واگن در آستانه‌ی یک به‌روزرسانی میان‌دوره‌ای، نه‌تنها ظاهری تازه به خود می‌گیرد بلکه دستخوش دگرگونی هویتی می‌شود. غول خودروسازی آلمان تصمیم گرفته است نام محبوب‌ترین محصول بنزینی خود را به خانواده‌ی خودروهای برقی پیوند بزند و فیس‌لیفت فولکس‌واگن ID.4 را با نام جدید فولکس‌واگن ID. Tiguan راهی بازار کند. بر اساس گزارش موتور وان ، برند تیگوان (عبارتی که ترکیب دو کلمه‌ی آلمانی ببر و ایگوانا محسوب می‌شود) از زمان ورود به بازار در طول نزدیک به دو دهه‌ی گذشته بیش از ۸٫۳ میلیون دستگاه فروش داشته است. مدل الکتریکی جدید جایگزین نسخه‌ی درون‌سوز نخواهد شد، بلکه درست مانند همزیستی مسالمت‌آمیز فولکس‌واگن ID. Polo با نسخه‌ی استاندارد پولو، در کنار مدل بنزینی به حیات خود ادامه می‌دهد. تغییر نام نباید این تصور را ایجاد کند که با نسخه‌ی تمام‌برقی تیگوان بنزینی مواجه هستیم. دو خودرو از نظر ساختار مهندسی کاملا متمایز باقی می‌مانند. فولکس‌واگن ID. Tiguan بر پایه‌ی پلتفرم اختصاصی تمام‌الکتریکی MEB توسعه یافته است، در حالی که نسخه‌های بنزینی، دیزلی و پلاگین‌هیبرید تیگوان همچنان از پلتفرم MQB بهره می‌برند. احتمال ادغام دو خط تولید در قالب یک محصول واحد در آینده‌ی نزدیک به‌دلیل روند نامتوازن پذیرش خودروهای برقی در بازارهای جهانی، بسیار پایین ارزیابی می‌شود. کپی لینک جلوه بصری عضلانی‌تر و وداع با ID.5 تصاویر اولیه‌ی نمونه‌های استتارشده نشان می‌دهند که فرم کلی و ابعاد بدنه دست‌نخورده باقی مانده‌اند، اما e4b184a47ec5e4", "title_fa": "هوش مصنوعی Altar-1 معرفی شد؛ مدل پیشرفته برای دفاع دیجیتال", "summary_fa": "شرکت آیکیدو مدل هوش مصنوعی Altar-1 را برای کشف آسیب‌پذیری و تحلیل کد معرفی کرد که امکان اجرای محلی روی زیرساخت سازمان‌ها را فراهم می‌کند. تبلیغات شرکت بلژیکی Aikido Security مدل هوش مصنوعی Altar-1 را معرفی کرد ؛ مدلی با وزن‌های قابل‌دسترسی که برای کاربردهای دفاعی در امنیت سایبری طراحی شده و سازمان‌ها می‌توانند آن را روی زیرساخت خودشان اجرا کنند. هدف آیکیدو، کاهش وابستگی شرکت‌ها به سرویس‌های ابری و جلوگیری از ارسال کدهای حساس و نتایج بررسی‌های امنیتی به ارائه‌دهندگان خارجی عنوان شده است. Altar-1 از صفر آموزش داده نشده و پایه‌ی آن GLM-5.3 شرکت Z.AI است. آیکیدو با استفاده از روش‌های quantization و expert pruning اندازه‌ی مدل را به‌شدت کاهش داده است. حجم نسخه‌ی کامل GLM-5.3 حدود ۱٫۵۱ ترابایت است که پس از کوانتیزه‌کردن به ۴۸۸ گیگابایت و در نهایت با حذف یک‌سری از بخش‌ها به ۳۲۸ گیگابایت می‌رسد. در این فرایند ۸۸ مورد از ۲۵۶ بخش تخصصی مدل حذف شده‌اند؛ یعنی حدود ۳۴٫۴ درصد از بخش‌های تخصصی کنار گذاشته شده‌اند. آیکیدو می‌گوید Altar-1 برای شناسایی آسیب‌پذیری‌های نرم‌افزاری، تحلیل کد، فراخوانی ابزارها، استدلال و فرایندهای تست نفوذ بهینه شده و می‌توان آن را با چهار GPU از خانواده‌ی H200 و vLLM اجرا کرد. این ویژگی برای سازمان‌هایی که نمی‌خواهند کد یا داده‌های امنیتی‌شان از شبکه‌ی داخلی خارج شود، اهمیت ویژه‌ای دارد؛ خصوصاً در محیط‌های بانکی، درمانی و زیرساخت‌های حساس. آیکیدو برای ارزیابی Altar-1، مجموعه‌ای شامل ۳۲ آسیب‌پذیری شناخته‌شده در ۳۰ مخزن کد را بررسی کرد. این مدل توانست در مجموع ۶۰٫۴ درصد از آسیب‌پذیری‌های موجود را شناسایی کند و دست‌کم یک‌بار ۲۳ مورد از ۳۲ آسیب‌پذیری را پیدا کرد. برای مقایسه، نسخه‌ی کوانتیزه‌شده‌ی GLM-5.3 به نرخ شناسایی ۶۱٫۵ درصد و نسخه‌ی اصلی مدل به ۶۵٫۶ درصد رسیدند. البته این آزمایش را خود آیکیدو انجام داده و نتیجه‌اش لزوماً نشان‌دهنده‌ی عملکرد مدل در کشف آسیب‌پذیری‌های ناشناخته یا در شرایط"}, {"source": "Zoomit", "title": "وقتی الگوریتم‌ها حق درمان را می‌گیرند؛ اشتباه بزرگ هوش مصنوعی در نظام سلامت آمریکا", "link": "https://www.zoomit.ir/ai-articles/467931-trump-admin-ai-medicare-denials/", "summary": "اجرای آزمایشی سیستمی مبتنی‌بر هوش مصنوعی برای تأیید خدمات درمانی سالمندان در آمریکا، با تاخیرهای گسترده و واکنش شدید روبه‌رو شد.", "date_str": "2026-09-27T20:10:00+00:00", "hash": "74f7604752fa2eb4", "title_fa": "وقتی الگوریتم‌ها حق درمان را می‌گیرند؛ اشتباه بزرگ هوش مصنوعی در نظام سلامت آمریکا", "summary_fa": "اجرای آزمایشی سیستمی مبتنی‌بر هوش مصنوعی برای تأیید خدمات درمانی سالمندان در آمریکا، با تاخیرهای گسترده و واکنش شدید روبه‌رو شد. تبلیغات دولت دونالد ترامپ برنامه‌ای آزمایشی را به اجرا درآورده که با استفاده از هوش مصنوعی، درخواست‌های پوشش درمانی بیماران تحت پوشش شرکت مدیکر را تأیید یا رد می‌کند. مدیکر برنامه‌ی بیمه‌ی سلامت دولتی ویژه‌ی سالمندان است که پیش‌تر برای اقدامات پزشکی به اخذ مجوزهای قبلی نیازی نداشت. پیاده‌سازی سازوکار مذکور موجب بروز اختلالات فنی، تاخیرهای طولانی در رسیدگی به پرونده‌ها، رد مبهم خدمات درمانی و سردرگمی پزشکان شده است. بنیاد مرزهای الکترونیکی (EFF) اسنادی دولتی درباره‌ی این طرح موسوم به WISeR منتشر کرد که بازخوردهای منفی مراکز درمانی را تأیید می‌کند. یکی از ارائه‌دهندگان خدمات درمانی، سازوکار مذکور را «مایه‌ی شرمساری نوع بشر» خواند و گزارش داد که بیماران در صف‌های انتظارِ درمان، درد شدیدی را تحمل می‌کنند. دفتر پاسخگویی دولت نیز در اردیبهشت‌ماه اعلام کرد مقامات رویه‌های قانونی لازم را برای راه‌اندازی این طرح طی نکرده‌اند و مشروعیت حقوقی آن زیر سؤال رفته است. نمایندگان کنگره تلاش‌هایی را برای تعلیق طرح آغاز کرده‌اند. سوزان دلبن، نماینده‌ی دموکرات ایالت واشنگتن، خواستار رای‌گیری کمیته برای انتشار اسناد تکمیلی شد، اما نمایندگان جمهوری‌خواه مانع تصویب آن شدند. سوزان دلبن ، نماینده‌ی کنگره، گفت: «کاملا روشن است که چرا دولت هر کاری انجام می‌دهد تا مدارک را پنهان نگه دارد. هرچه مردم آمریکا درباره‌ی WISeR بیشتر بدانند، خشم آن‌ها از دولت ترامپ به‌دلیل به خطر انداختن سلامت شهروندان و تلاش برای خصوصی‌سازی مدیکر بیشتر می‌شود.» سامانه‌ی WISeR که مخفف کاهش خدمات نامناسب و بیهوده است، با هدف بهره‌گیری از یادگیری ماشین برای مدیریت پرداخت‌های مدیکر و کاهش اتلاف منابع راه‌اندازی شد. اجرای اولیه از دی‌ماه ave beforehand. My husband wants to have a lot saved before we move; I want to figure things out once we're there. Over a year ago, my husband and I sat down in the living room of the house we once thought would be our \"next 30 years\" home. We talked about the future and set a goal: Before our son starts kindergarten, we'll move to the Netherlands. Everyone told us parenthood would change our priorities, but living the process firsthand was still a shock. In late 2024, after the birth of our first kid , my husband and I both had the creeping feeling that the United States wouldn't be our forever home. By the time he first vocalized the thought, we had one of those open-mouthed moments. We realized we'd arrived at the same conclusion without ever discussing it. It took a bit of time to decide where we wanted to move. We've lived in California for our whole marriage and don't want to give up certain luxuries we have here, like access to quality healthcare and a diverse community. However, there are certain things we want from a new home, too, like stricter gun restrictions and a different public-education system. After much debate and research, the Netherlands checked all our boxes and then some. We visited last year and confirmed it: Moving here was our goal. Up until this point, we'd agreed on everything. Then, we started talking about the logistics … specifically, money. We've always had different attitudes toward money I appreciate my husband s financial savviness, but we don t always see eye to eye. Allison Lau When it comes to most things, my husband and I can make decisions, come to easy compromises, and move quickly. However, it took us over a year of marriage — and tons of conversations — to feel comfortable merging our bank accounts . My husband is very money-literate and a little money-obsessed. Meanwhile, I'll put money into our savings account and promptly forget about it. He's fascinated by business, has strong opinions on investing, and consistently r raising a kindergartener.", "link": "https://www.businessinsider.com/barb-higgins-older-mom-mistaken-grandmother-kindergartener-2026-9", "summary": "Barb Higgins with her 5-year-old son, Jack. Tony Luong for BI Barb Higgins underwent IVF and gave birth to her son, Jack, at the age of 57 in March 2021. He recently started kindergarten, and she is sometimes mistaken for his grandmother. The older mom brushes it off, saying people in her community support her choice. She has no regrets. This as-told-to essay is based on a conversation with Barb Higgins, 63, a part-time CrossFit coach from Massachusetts. It has been edited for length and clarity. Our town is very close-knit, so I already know a lot of the parents at pick-up and drop-off at the school where my son, Jack, recently started kindergarten . Nobody bats an eye when I arrive, though some of the kids seem a little curious about why I look older than their moms and dads. Jack doesn't register that I'm in my 60s One child said out loud that I looked like a grandmother. Her mother seemed mortified. I didn't mind in the slightest. \"I'm 63, of course I look like a grandmother,\" I told them. \"Don't worry about it, but I had him in my belly, and he's my baby.\" As for Jack, he doesn't register that I'm in my 60s and his dad, Kenny, a retired businessman, is 71. Why should he? He loves us for who we are, not how young or old we are. Higgins said other parents at her son s kindergarten don t bat an eye about her age. Tony Luong for BI It was a long, hard road to have him at 57. I was heartbroken after the death five years earlier of my youngest daughter, Molly, from a brain tumor when she was 13. And I'd had health struggles of my own. In 2018, an MRI ahead of a surgery on a facial nerve showed three non-cancerous growths in my brain. The larger was removed, and the others were treated with radiation. It was a terrible setback, but I was grateful to be diagnosed. The path that led me to the facial operation began when I decided to try for a third baby. I'm a spiritual person If I hadn't undergone a full health check-up before doing IVF , those tumors might not have been spotted. My longing to be a mom again — sparked by vivid dreams urging me to get pregnant— may have saved me. I'm a spiritual person and saw it as a sign. Kenny and I weren't looking for a \"replacement\" for Molly because she could never be replaced. Still, the desire to create a living sibling for our older daughter, Gracie, now 25, was all-consuming. I didn't care what people thought about Kenny and me having fertility treatment in our late 50s and 60s. We weren't aware of any criticism at t", "date_str": "2026-09-28T13:39:55+00:00", "hash": "8b150e32bfcdc876", "title_fa": "دوستان ما در 63 و 71 سالگی پدربزرگ و مادربزرگ می شوند. ما داریم یک مهدکودک بزرگ می کنیم.", "summary_fa": "بارب هیگینز با پسر 5 ساله اش جک. تونی لونگ برای BI Barb Higgins تحت IVF قرار گرفت و پسرش جک را در سن 57 سالگی در مارس 2021 به دنیا آورد. او اخیراً مهدکودک را شروع کرده است و گاهی اوقات او را با مادربزرگش اشتباه می گیرند. مادر مسن‌تر آن را کنار می‌گذارد و می‌گوید مردم جامعه او از انتخاب او حمایت می‌کنند. او هیچ پشیمانی ندارد. این مقاله همانطور که گفته شد بر اساس گفتگو با بارب هیگینز، 63 ساله، مربی پاره وقت کراس فیت از ماساچوست است. برای طول و وضوح ویرایش شده است. شهر ما بسیار نزدیک است، بنابراین من بسیاری از والدین را در مدرسه ای می شناسم که پسرم، جک، به تازگی در آن مهدکودک را شروع کرده است. وقتی من می‌رسم هیچ‌کس چشمش را بر نمی‌دارد، اگرچه برخی از بچه‌ها کمی کنجکاو به نظر می‌رسند که چرا من از مادر و پدرشان بزرگ‌تر به نظر می‌رسم. جک ثبت نام نمی کند که من در دهه 60 هستم یک کودک با صدای بلند گفت که من شبیه یک مادربزرگ هستم. مادرش ناراحت به نظر می رسید. من ذره ای ناراحت نشدم به آنها گفتم: \"من 63 سال دارم، البته شبیه مادربزرگ هستم.\" \"نگران نباش، اما من او را در شکمم داشتم و او بچه من است.\" در مورد جک، او ثبت نمی کند که من 60 ساله هستم و پدرش کنی، یک تاجر بازنشسته، 71 ساله است. چرا باید؟ او ما را به خاطر آنچه هستیم دوست دارد، نه اینکه چقدر جوان یا پیر هستیم. هیگینز گفت والدین دیگر در مهدکودک پسرش به سن او توجهی ندارند. تونی لونگ برای BI راه سخت و طولانی برای داشتن او در 57 سالگی بود. من پس از مرگ پنج سال قبل از مرگ دختر کوچکم، مولی، به دلیل تومور مغزی در 13 سالگی، دل شکسته"}, {"source": "Business Insider", "title": "SpaceX's Starship rocket just hit a key milestone on its riskiest launch yet", "link": "https://www.businessinsider.com/spacex-starship-launch-orbit-starlink-mission-risk-important-2026-9", "summary": "The upcoming launch will be Starship s 14th test flight. SERGIO FLORES/AFP via Getty Images SpaceX's most important Starship flight is underway. The megarocket reached orbit for the first time to deploy Starlink satellites. Hitting both milestones is a crucial step toward some of Elon Musk's most ambitious plans. SpaceX's Starship rocket just completed a key milestone in its riskiest launch yet. The 400-foot-tall rocket lifted off from SpaceX's Texas launch site at around 7:46 am Central Time on Monday, in a landmark launch that saw Starship reach Earth's orbit for the first time. The launch went smoothly, with Starship's massive booster stage returning to Earth in an apparent soft splashdown. The rocket's upper stage faced a more dramatic ascent, with an engine failure briefly putting Starship's push for orbit at risk. After SpaceX's team decided to continue the mission, Starship reached orbit at around 8:15am Central Time. Beyond reaching orbit for the first time, Starship's 14th launch also marks the first time that the megarocket has launched with real, revenue-generating cargo. Starship is carrying 26 Starlink V3 satellites, the latest version of the low-earth orbit satellites that SpaceX uses to beam its Starlink internet service around the globe. Starship’s 14th flight is set to launch on Monday, Sept 28. The 75-minute launch window opens at 7:15 a.m. CT. Live coverage of the mission starts ~35 minutes before launch → https://t.co/uQKQvgaTmJ — SpaceX (@SpaceX) September 27, 2026 The successful deployment of these satellites is a key focus of today's launch. Unlike previous flights, SpaceX didn't catch Starship's giant booster in the chopstick arms of its launch tower when the rocket returns to Earth. Instead, both the booster and Starship's upper stage are set to splash down in the Gulf of Mexico and the Pacific Ocean. While that approach reduces the risk of things going wrong on landing, there are more potential failure points than in previous Starship missions. Starship must enter a stable orbit, deploy satellites, keep its systems working for nearly 10 hours, then reignite an engine to deorbit and survive a controlled reentry. Why Starship is so important for SpaceX Reaching orbit and deploying Starlink satellites is a critical step in Elon Musk's ambitious plans for Starship, which the billionaire has said could launch as often as once a day within the next year. Launching larger V3 satellites on Starship, which has far greater capacity than Spa", "date_str": "2026-09-28T13:26:41+00:00", "hash": "49ec339093a2c2fa", "title_fa": "موشک استارشیپ اسپیس ایکس به تازگی به نقطه عطفی در پرمخاطره ترین پرتاب خود رسیده است", "summary_fa": "پرتاب آتی چهاردهمین پرواز آزمایشی استارشیپ خواهد بود. SERGIO FLORES/AFP از طریق Getty Images مهمترین پرواز استارشیپ اسپیس ایکس در حال انجام است. این موشک بزرگ برای اولین بار برای استقرار ماهواره های Starlink به مدار زمین رسید. رسیدن به هر دو نقطه عطف گامی مهم به سوی برخی از بلندپروازانه ترین برنامه های ایلان ماسک است. موشک استارشیپ اسپیس ایکس به تازگی یک نقطه عطف کلیدی را در پرخطرترین پرتاب خود انجام داده است. این موشک 400 فوتی در حوالی ساعت 7:46 صبح روز دوشنبه به وقت مرکزی از محل پرتاب اسپیس ایکس در تگزاس بلند شد، در پرتابی شاخص که برای اولین بار شاهد رسیدن استارشیپ به مدار زمین بود. پرتاب به آرامی انجام شد و مرحله تقویت کننده عظیم Starship در یک فروپاشی نرم ظاهری به زمین بازگشت. مرحله فوقانی موشک با یک صعود چشمگیرتر روبرو شد، با خرابی موتور برای مدت کوتاهی فشار استارشیپ برای مدار را در معرض خطر قرار داد. پس از اینکه تیم اسپیس ایکس تصمیم به ادامه ماموریت گرفت، استارشیپ حدود ساعت 8:15 صبح به وقت مرکزی به مدار زمین رسید. فراتر از رسیدن به مدار برای اولین بار، چهاردهمین پرتاب Starship همچنین اولین باری است که این موشک بزرگ با محموله واقعی و درآمدزا پرتاب می شود. استارشیپ حامل 26 ماهواره Starlink V3 است، آخرین نسخه از ماهواره های مدار پایین زمین که اسپیس ایکس از آن برای پخش سرویس اینترنت Starlink خود در سراسر جهان استفاده می کند. چهاردهمین پرواز استارشیپ قرار است در روز دوشنبه، 28 سپتامبر انجام شود. پنجره پرتاب 75 دقیقه‌ای در ساعت 7:15 صبح CT باز می‌شود. پوشش زنده این ماموریت ~ 35 دقیقه قبل از پرتاب شروع می شود ← https://t.co/uQKQvgaTmJ — SpaceX (@SpaceX) 27 سپتامبر 2026 استقرار موفقیت آمیز این ماهواره ها یکی از محورهای اصلی پرتاب امروز است. برخلاف پروازهای قبلی، اسپیس ایکس"}, {"source": "Business Insider", "title": "I'm Gen Z, and most of my coworkers are baby boomers. I didn't expect to want to work more like them.", "link": "https://www.businessinsider.com/work-with-older-generation-want-to-be-more-like-them-2026-9", "summary": "Working with an older generation has shown me that I want to be more like them. Madeline Marriott I'm 24, and for the past two years, I've worked in a bookstore with baby boomers . Immediately, I noticed our differences, like our gap in skill when it comes to technology. I've learned to appreciate their habits, like working slowly and focusing on customer relationships. On one of my days off, I was sitting at a coffee shop when my phone buzzed with a message from a coworker. \"Tech issue here, any chance you can stop by?\" they asked. I've never been much of a computer whiz, but at the independent bookstore where I've worked for two years, I'm the go-to for technology problems among the staff. Granted, that's because at 24, I'm the youngest employee by just about 30 years, with some of them easily passing as my grandmother. On this particular day, a column of the spreadsheet we use to track coming releases had shifted, throwing the whole operation into disarray. All I had to do was right-click a few times, copy a few cells, and then I was on my way, hailed as a hero. At first, I felt mostly confusion and a little bit of awe. How was this business functioning successfully with so little focus on technology? But now, working with my baby boomer colleagues has changed my perspective on generational differences . Our workplace differences were noticeable immediately My coworkers typically handle the analog tasks, whereas I take care of any digital needs. Madeline Marriott Typically, when I arrive for each shift, there's a list of techy tasks from the prior days left for me: creating flyers for book clubs , adding to our online list of new arrivals, and formatting our recommendation sheets with the proper fonts. My coworkers would typically rather tackle the analog tasks, which is fine with me — I'm happy to copy and paste while they reorganize shelves, sweep floors, and count coins. For a long time, I considered most of the older generation's tech problems to be a conscious resistance to society's changing — and I get it, I would resist, too, if someone told me that after decades of functioning one way, I'd have to learn something entirely new to keep up. The truth of it, though, is that I've come to understand that achieving computer proficiency is more like learning a language than acquiring a simple skill. It's easy for me, because at 24, I'm a native speaker, but I have a new appreciation for just how difficult it would be to adapt. When I attempt to give my", "date_str": "2026-09-28T13:03:01+00:00", "hash": "c5703d8563cdcea2", "title_fa": "من ژنرال Z هستم و بیشتر همکارانم بچه‌های پرفروش هستند. انتظار نداشتم بیشتر شبیه آنها کار کنم.", "summary_fa": "کار با نسل قدیمی به من نشان داد که می خواهم بیشتر شبیه آنها باشم. مادلین ماریوت من 24 ساله هستم و در دو سال گذشته در یک کتابفروشی با بچه های پرفروش کار کرده ام. بلافاصله متوجه تفاوت‌هایمان شدم، مانند شکاف مهارت‌هایمان در مورد فناوری. من یاد گرفته ام که قدر عادات آنها را بدانم، مانند آهسته کار کردن و تمرکز بر روابط با مشتری. در یکی از روزهای مرخصی، در یک کافی شاپ نشسته بودم که تلفنم با پیام یکی از همکارانم زنگ زد. \"مشکل فنی اینجاست، آیا فرصتی وجود دارد که بتوانید جلوی آن را بگیرید؟\" آنها پرسیدند. من هرگز زیاد اهل کامپیوتر نبودم، اما در کتابفروشی مستقلی که دو سال در آن کار کرده‌ام، برای مشکلات فناوری در میان کارکنان پیشرو هستم. درست است، به این دلیل است که من با 24 سالگی، جوانترین کارمندی هستم که حدود 30 سال سن دارد و برخی از آنها به راحتی مادربزرگ من می شوند. در این روز خاص، ستونی از صفحه‌گسترده‌ای که برای ردیابی نسخه‌های آینده استفاده می‌کنیم، جابه‌جا شد و کل عملیات را به هم ریخت. تنها کاری که باید انجام می‌دادم این بود که چند بار راست کلیک کنم، چند سلول را کپی کنم و سپس به عنوان یک قهرمان در راه بودم. در ابتدا بیشتر احساس سردرگمی و کمی ترس داشتم. چگونه این کسب و کار با این همه تمرکز بر فناوری موفق عمل کرد؟ اما در حال حاضر، کار با همکارانم که در حال رشد هستند، دیدگاه من را نسبت به تفاوت‌های نسلی تغییر داده است. تفاوت های محل کار ما بلافاصله قابل توجه بود همکاران من معمولاً وظایف آنالوگ را انجام می دهند، در حالی که من به هر نیاز دیجیتالی رسیدگی می کنم. Madeline Marriott به طور معمول، وقتی برای هر شیفت می‌آیم، فهرستی از کارهای تکنیکی روزهای قبل برایم باقی مانده"}, {"source": "Business Insider", "title": "Nvidia just greenlit the biggest buyback in stock market history", "link": "https://www.businessinsider.com/nvidia-share-buyback-biggest-market-history-ai-boom-jensen-huang-2026-9", "summary": "Nvidia CEO Jensen Huang. Bloomberg/Getty Images Nvidia has approved the biggest share buyback program in stock market history. The chip giant said Monday it has authorized an increase of $150 billion to its current share repurchases. Nvidia has become the world's most valuable company as it helps fuel the AI boom. Nvidia is already the world's most valuable company . Now, it has approved the largest share buyback in history. The tech giant , whose chips are powering much of the AI boom, said on Monday that it has authorized an expansion of its existing share buyback plan by $150 billion, increasing the value of approved repurchases to $235 billion. Apple previously held the record for the largest-ever buyback, authorizing $110 billion in 2024. \"I think we're going through the largest infrastructure build-out in human history, and we have the benefit of being a very central part of that,\" Nvidia CEO Jensen Huang said in an interview with CNBC shortly after the announcement. \"We're generating a lot of cash, we're going to generate a lot of cash in the coming years. And you know, every single year, as we generate more cash, I'd like to be able to return it back to the shareholders,\" he added. Nvidia said it expects to finish the buyback by the 2028 financial year. When a company repurchases stock, it returns capital to shareholders by using some of its cash to buy back its own shares. Buybacks reduce the amount of outstanding shares, which can push up a company's stock price. They can also help offset the issuance of shares as employee compensation. Legendary investor Warren Buffett has said that buybacks only make sense when a stock is trading at a discount to its intrinsic value. In that scenario, management is buying it for less than its worth, making it a good use of the company's cash. Thus, buybacks typically send a bullish signal to the market, as they show a company is willing to bet money that its stock is undervalued and likely to rise over time. Nvidia stock was up around 2.2% in premarket trading as of 8:56 a.m. ET on Monday. It was up 21% for the year as of Friday's close, and nearly 1,000% over the past five years. The buyback plan was announced just hours after Nvidia launched its Open Agent Safety Platform, a system designed to stop AI agents from going rogue. \"Several frontier labs have recently reported versions of the same story: AI agents broke out of the evaluation environments that were meant to contain them and reached systems they neve", "date_str": "2026-09-28T12:43:02+00:00", "hash": "b32fd28558e9bd69", "title_fa": "انویدیا بزرگترین خرید در تاریخ بازار سهام را روشن کرد", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا. بلومبرگ/گتی ایماژ انویدیا بزرگترین برنامه خرید سهام در تاریخ بازار سهام را تایید کرد. این غول تراشه روز دوشنبه اعلام کرد که مجوز افزایش 150 میلیارد دلاری برای بازخرید سهام فعلی خود را صادر کرده است. انویدیا به باارزش ترین شرکت جهان تبدیل شده است زیرا به رونق هوش مصنوعی کمک می کند. Nvidia در حال حاضر با ارزش ترین شرکت جهان است. اکنون بزرگترین بازخرید سهام در تاریخ را تایید کرده است. این غول فناوری که تراشه‌هایش بخش عمده‌ای از رونق هوش مصنوعی را تامین می‌کنند، روز دوشنبه اعلام کرد که مجوز گسترش طرح خرید سهام موجود خود را به میزان 150 میلیارد دلار داده است و ارزش خرید مجدد تایید شده را به 235 میلیارد دلار افزایش می‌دهد. اپل پیش از این رکورد بزرگترین بازخرید تاریخ را در اختیار داشت و در سال 2024 مجوز 110 میلیارد دلار را صادر کرد. جنسن هوانگ، مدیرعامل انویدیا، اندکی پس از اعلام این خبر، در مصاحبه‌ای با CNBC گفت: «من فکر می‌کنم که ما در حال گذراندن بزرگترین زیرساخت‌های تاریخ بشر هستیم و این مزیت را داریم که بخش بسیار مرکزی آن هستیم. او افزود: \"ما پول نقد زیادی تولید می کنیم، در سال های آینده پول نقد زیادی تولید خواهیم کرد. و می دانید، هر سال که پول نقد بیشتری تولید می کنیم، مایلم بتوانم آن را به سهامداران برگردانم.\" انویدیا گفته است که انتظار دارد تا سال مالی 2028 بازپرداخت را به پایان برساند. هنگامی که یک شرکت سهام را بازخرید می کند، با استفاده از مقداری از نقدینگی خود برای بازخرید سهام خود، سرمایه را به سهامداران برمی گرداند. بازپرداخت ها مقدار سهام موجود را کاهش می دهد که می تواند قیمت سهام شرکت را بالا ببرد. آنها همچنین می توانند به جبران انتشار سهام به عنوان غرامت کارکنان کمک کنند. وارن بافت، سرمایه‌گذار"}, {"source": "Business Insider", "title": "NATO has been using fighter jets to stop drones. One ally says a new Ukraine-inspired anti-drone wall will handle them first.", "link": "https://www.businessinsider.com/automated-anti-drone-border-latvia-nato-fighter-jets-russian-drones-2026-9", "summary": "NATO jets are taking d
