گوگل تایید می کند که مدل های Gemini سه شرکت را در ماه می 2026 هک کرده اند", "summary_fa": "به طور فزاینده ای رایج شده است که شرکت های هوش مصنوعی اعلام کنند که آخرین و تواناترین مدل های آنها درگیر هک غیرمجاز در دنیای واقعی هستند. گوگل که در ماه‌های اخیر در انتشار مدل‌های جمینی مرزی کند بوده است، تاکنون در گفتگوی «هوش مصنوعی سرکش» غایب بوده است. به دنبال گزارش وال استریت ژورنال، گوگل تایید کرده است که مدل‌های جمینی سه شرکت را طی آزمایشی در ماه می 2026 هک کرده‌اند، اما ماهیت نفوذ به اندازه هک‌های هوش مصنوعی قبلی نگران‌کننده (یا چشمگیر) نیست. این هک در طی آزمایشی که توسط شرکت امنیت سایبری Irregular انجام شد، رخ داد. مجموعه‌ای از مدل‌های Gemini در تمرین «تسخیر پرچم» که برای آزمایش قابلیت‌های امنیت سایبری هوش مصنوعی در یک محیط بسته شرکت داشت، شرکت می‌کردند. به هوش مصنوعی دستور داده شد که اطلاعات یک شرکت جعلی (که نامی را با یک شرکت واقعی به اشتراک گذاشته بود) در این محیط بازیابی کند. قرار نبود Irregular به مدل اجازه کار در خارج از سرورهای خود را بدهد، اما به دلیل پیکربندی نادرست، Gemini توانست به اینترنت دسترسی داشته باشد. زمانی که Gemini شروع به جست‌وجو در وب کرد، به جای ساختگی‌ها، زیرساخت‌های واقعی را هدف قرار داد. برای یکی از سه هک، Gemini به سادگی رمزهای عبور را حدس زد تا زمانی که به خدمات آنلاین یک شرکت دسترسی پیدا کرد. در دو مورد دیگر، Gemini مخازن نرم‌افزار عمومی را جستجو کرد تا اینکه اعتبار ورود شرکت‌هایی را که به‌طور تصادفی وارد شده بودند، پیدا کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش به طور فزاینده ای رایج شده است که شرکت های هوش مصنوعی اعلام کنند که جدیدترین و تواناترین مدل های آنها در هک غیرمجاز"}, {"source": "Ars Technica", "title": "Russel Vought will reportedly be given veto power over all NIH grants", "link": "https://arstechnica.com/science/2026/09/trump-planning-to-hand-veto-power-over-nih-grants-to-political-appointee/", "summary": "On Friday, The Washington Post reported on a contentious White House meeting ل هوش مصنوعی هنوز به اندازه کافی خلاق نیستند که بتوانند تحقیقات خلاقانه و خلاقانه در زمینه هوش مصنوعی را انجام دهند."}, {"source": "MIT Tech Review", "title": "The Download: why AI’s latest breakthroughs and fears may be more hype than reality", "link": "https://www.technologyreview.com/2026/09/22/1144910/the-download-dont-believe-ai-hype/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. Don’t be fooled by this summer of AI hype —Timnit Gebru, executive director of the Distributed AI Research Institute (DAIR), and Emily M. Bender, professor of linguistics at the University of Washington It’s been a busy few months for AI hype, with companies making breathless claims about hacking, mathematical breakthroughs, and the prospect of self-improving superintelligence. In all these cases, massive fanfare from the companies, presented as mea culpas in the hacking incidents, has been accompanied by intense press coverage. But once experts have had time to examine what happened, very different stories emerge. There’s a strong commercial incentive to overstate AI capabilities. The authors argue that the illusion of speed and urgency promulgated by the tech companies is also a ploy to misdirect policymakers and the public. Here’s why they say we must remain skeptical about AI hype . The must-reads I’ve combed the internet to find you today’s most fun/important/scary/fascinating stories about technology. 1 22 nations have called for a new global body to oversee AI They want pre-deployment testing and common safety standards. ( Politico ) + But neither the US nor China are part of the new declaration. ( NBC News ) + Meanwhile, OpenAI has proposed its own global AI safety standards. ( Axios ) + The company wants the US to lead the international effort. ( Reuters $) + Could AI really kill us all? ( MIT Technology Review ) 2 Texas and California have moved to rein in data centers T {"source": "Zoomit", "title": "تحلیلگر مخفی گوگل چطور به یکی از بدنام‌ترین گروه‌های هکری زنجیره تأمین نفوذ کرد؟", "link": "https://www.zoomit.ir/security/467664-undercover-google-analyst-hacking-gang-featured/", "summary": "تحلیلگر مندیانتِ گوگل با نفوذ به گروه هکری تیم‌پی‌سی‌پی توانست از درون این تشکل، حملات گسترده به زنجیره تامین نرم‌افزار را خنثی کند.", "date_str": "2026-09-22T13:30:00+00:00", "hash": "f8b3b4b3c7a4c52e", "title_fa": "تحلیلگر مخفی گوگل چطور به یکی از بدنام‌ترین گروه‌های هکری زنجیره تأمین نفوذ کرد؟", "summary_fa": "تحلیلگر مندیانتِ گوگل با نفوذ به گروه هکری تیم‌پی‌سی‌پی توانست از درون این تشکل، حملات گسترده به زنجیره تامین نرم‌افزار را خنثی کند. تبلیغات مارس ۲۰۲۶، اعضای TeamPCP تازه داشتند یکی از گسترده‌ترین حملات زنجیره تأمین نرم‌افزار در سال‌های اخیر را راه می‌انداختند. گروه به نرم‌افزارهای متن‌باز نفوذ می‌کرد، اطلاعات ورود توسعه‌دهندگان را می‌دزدید و از همان حساب‌ها برای آلوده‌کردن پروژه‌های بعدی استفاده می‌کرد. در همان روزها، حلقه‌ی اصلی تیم‌پی‌سی‌پی در اتاق گفت‌وگوی خصوصی با نام CanisterWorm دور هم جمع می‌شد. حدود ۱۲ نفر اجازه‌ی ورود به اتاق را پیدا کرده بودند؛ جمع کوچکی که اعضایش درباره‌ی حملات، قربانیان و داده‌های سرقت‌شده حرف می‌زدند. ولی یکی از آن ۱۲ نفر تحلیلگری مخفی از Mandiant، شرکت امنیتی زیرمجموعه‌ی گوگل بود. کپی لینک خلاصه صوتی خلاصه صوتی، ساخته‌شده با هوش مصنوعی آستین لارسن، پژوهشگر گروه اطلاعات تهدید گوگل، ماه‌ها بعد توضیح داد: «یکی از شخصیت‌های پوششی ما ماه‌ها وقت صرف کرده بود تا اعتماد فردی را که بعداً به تیم‌پی‌سی‌پی دعوت شد، جلب کند و از همین طریق به گروه ملحق شد. عملاً می‌توان گفت که مندیانت از همان روز اول، همه‌چیز را از پشت‌صحنه تماشا می‌کرد.» به گزارش وایرد نفوذی مندیانت درست زمانی وارد تیم هکری شد که آن‌ها داشتند یکی از بزرگ‌ترین حملاتشان را به زنجیره‌های تأمین انجام می‌دادند. کپی لینک گروهی که زنجیره‌ی تأمین نرم‌افزار را به سلاح تبدیل کرد TeamPCP اواخر سال ۲۰۲۵ در فضای آنلاین ظاهر شد، اما چند ماه بعد شهرتی به هم زد. شیوه‌ی حمله‌ی گروه نیز به یک چرخه شباهت داشت. مهاجمان ابتدا یکی از پروژه‌های متن‌باز یا ابزارهای مورداستفاده‌ی توسعه‌دهندگان را آلوده می‌کردند. بدافزاری روی سیستم قربانی نصب می‌شد و اطلاعات ورود، گذرواژه یا توکن‌های دسترسی او را جمع می‌کرد. همان اعتبارنامه‌ها راه ورود به پروژه‌ها و سرویس‌های تازه را باز می‌کردند و مهاجمان کد مخرب خود را در ابزار بعدی قرار می‌دادند."}, {"source": "Zoomit", "title": "رشد برندهای FMCG در اُکالا؛ وقتی داده به موتور توسعه فروش تبدیل می‌شود", "link": "https://www.zoomit.ir/tech-iran/467684-okala-fmcg-brands-sales-growth/", "summary": "با ثبت فروش ۴.۸ همتی در اُکالا، ۱۱۰۴ برند کالاهای تندمصرف توانستند رشدی بالاتر از جهش ۸۹ درصدی تعداد سفارش‌های این پلتفرم را تجربه کنند.", "date_str": "2026-09-22T13:04:17+00:00", "hash": "6cdbe616e68921f6", "title_fa": "رشد برندهای FMCG در اُکالا؛ وقتی داده به موتور توسعه فروش تبدیل می‌شود", "summary_fa": "با ثبت فروش ۴.۸ همتی در اُکالا، ۱۱۰۴ برند کالاهای تندمصرف توانستند رشدی بالاتر از جهش ۸۹ درصدی تعداد سفارش‌های این پلتفرم را تجربه کنند. تبلیغات رشد بازار آنلاین سوپرمارکتی زمانی پایدار خواهد بود که همه بازیگران این زنجیره، از مشتریان و فروشگاه‌ها تا برندها و تامین‌کنندگان، از توسعه این بازار سهم ببرند. اُکالا در مسیر فعالیت خود همواره تلاش کرده است همکاری با برندهای FMCG را به یک همکاری داده‌محور و توسعه‌محور تبدیل کند؛ همکاری‌ای که با افزایش دسترسی برندها به مشتریان، شناخت بهتر رفتار خرید و ایجاد فرصت‌های جدید برای رشد فروش همراه باشد. نتایج عملکرد برندها در مردادماه ۱۴۰۵، در کنار فروش ۴٫۸ همتی اُکالا و رشد ۸۹درصدی تعداد سفارش‌ها نسبت به مدت مشابه سال گذشته، نشان می‌دهد که توسعه بازار آنلاین سوپرمارکتی، ظرفیت‌های جدیدی برای رشد و افزایش سهم فروش برندها فراهم کرده است. از میان ۱٬۶۷۱ برندی که در مردادماه ۱۴۰۵ نسبت به مرداد سال گذشته، رشد تعدادی فروش را تجربه کردند، ۱٬۱۰۴ برند توانسته‌اند رشد تعداد فروش اقلام خود را به بیش از ۸۹درصد؛ یعنی بالاتر از رشد تعداد سفارش‌های پلتفرم اُکالا در همین بازه برسانند. «کانال‌های آنلاین در حال تبدیل شدن به بخشی جدایی‌ناپذیر از مسیر رشد برندهای FMCG است. چراکه پلتفرم‌های فروش آنلاین دیگر صرفاً یک کانال فروش برای برندها نیستند؛ و به‌تدریج به یکی از مهم‌ترین ابزارهای شناخت رفتار مصرف‌کننده و تصمیم‌گیری تجاری تبدیل شدند. برندها امروز می‌توانند با تحلیل داده‌های رفتار خرید، شناخت دقیق‌تری از الگوی خرید مشتری و واکنش به پروموشن‌ها به دست آورند. با همین نگاه، ما در اُکالا تلاش کردیم همکاری با برندها را از یک رابطه صرفاً فروش‌محور، به همکاری مبتنی بر داده، شناخت بهتر مصرف‌کننده و خلق فرصت‌های رشد تبدیل کنیم. ترکیب دسترسی به طیف وسیعی از مصرف‌کننده‌ها، داده‌های رفتار خرید و امکان ارائه پیشنهادها و پیام‌های متناسب در لحظه خرید، به برندها کمک می‌کند"}, {"source": "Zoomit", "title": "وان‌پلاس N6 لایت با طراحی دوربین مشابه آیفون و باتری بزرگ رونمایی شد", "link": "https://www.zoomit.ir/mobile/467680-oneplus-n6-lite-launch/", "summary": "وان‌پلاس گوشی N6 لایت را مجهز به باتری ۷۰۰۰ میلی‌آمپرساعتی و طراحی مشابه آیفون رونمایی کرد.", "date_str": "2026-09-22T13:00:00+00:00", "hash": "0c3ce72efeaeecbd", "title_fa": "وان‌پلاس N6 لایت با طراحی دوربین مشابه آیفون و باتری بزرگ رونمایی شد", "summary_fa": "وان‌پلاس گوشی N6 لایت را مجهز به باتری ۷۰۰۰ میلی‌آمپرساعتی و طراحی مشابه آیفون رونمایی کرد. تبلیغات وان‌پلاس خانواده‌ی محصولات سری N6 را در بازار هند با معرفی مدل اقتصادی‌تر گسترش داد. گوشی N6 Lite که در کنار مدل‌های N6 و N6x قرار می‌گیرد ، به باتری ۷۰۰۰ میلی‌آمپرساعتی مجهز است و از شبکه‌ی ارتباطی 4G پشتیبانی می‌کند. قیمت گوشی جدید وان پلاس در کانفیگ پایه با ۴ گیگابایت رم و ۶۴ گیگابایت فضای ذخیره‌سازی ۱۶٬۹۹۹ روپیه (۱۷۷ دلار) است. خریداران می‌توانند این دستگاه را در رنگ‌های مشکی و سبز تهیه کنند. توان پردازشی دستگاه را تراشه‌ی Unisoc T7250 تامین می‌کند و نمایشگر ۶٫۷۵ اینچی LCD آن با نرخ نوسازی ۱۲۰ هرتز و بیشینه‌ی روشنایی ۹۰۰ نیت محتوا را به‌نمایش می‌گذارد. در پنل پشتی دوربین اصلی ۱۳ مگاپیکسلی (حسگر OmniVision OV13B10) قرار دارد و دوربین سلفی حسگر ۵ مگاپیکسلی دارد. وان‌پلاس امکان ارتقای فضای ذخیره‌سازی از طریق درگاه کارت حافظه‌ی microSD را فراهم کرده است. حسگر اثر انگشت روی لبه‌ی کناری، گواهی مقاومت در برابر گردوغبار و آب IP64 و استاندارد نظامی MIL-STD-810H از دیگر ویژگی‌های گوشی وان پلاس به‌شمار می‌روند. امکانات ارتباطی دستگاه مواردی نظیر پشتیبانی از دو سیم‌کارت 4G، وای‌فای دوبانده، بلوتوث ۵٫۲ و سامانه‌ی موقعیت‌یاب GPS را در بر می‌گیرد. N6 لایت از شارژ سیمی ۱۵ وات و شارژ معکوس سیمی ۵ وات پشتیبانی می‌کند و به درگاه USB Type-C در کنار جک ۳٫۵ میلی‌متری هدفون مجهز است. وزن دستگاه به ۲۱۵ گرم و ضخامت بدنه به ۸٫۹۵ میلی‌متر می‌رسد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "متا با انتشار به‌روزرسانی فوری، مشکل جنجالی هوش مصنوعی‌اش را برطرف کرد", "link": "https://www.zoomit.ir/ai-articles/467685-meta-patches-muse-ai-exploit/", "summary": "متا با انتشار به‌روزرسانی فوری، روزنه‌ی امنیتی صفر روزه دستیار هوش مصنوعی Muse را در پلتفرم مک برطرف کرد.", "date_str": "2026-09-22T12:51:10+00:00", "hash": "c483c620677e5f11", "title_fa": "متا با انتشار به‌روزرسانی فوری، مشکل جنجالی هوش مصنوعی‌اش را برطرف کرد", "summary_fa": "متا با انتشار به‌روزرسانی فوری، روزنه‌ی امنیتی صفر روزه دستیار هوش مصنوعی Muse را در پلتفرم مک برطرف کرد. تبلیغات متا آپدیت امنیتی فوری برای نسخه‌ی macOS دستیار هوش مصنوعی Muse منتشر کرد تا مانع از سوءاستفاده‌ی هکرها از یک آسیب‌پذیری روز صفر شود. پژوهشگران امنیتی متوجه شده بودند مهاجمان با بهره‌گیری از تنظیماتی ثبت‌نشده در Muse می‌توانند فرآیند تبدیل گفتار به متن را به سرورهای خود هدایت کنند و حساب کاربری قربانی را در اختیار بگیرند. تصمیم‌های فنی مختلفی بستر بروز این نقص امنیتی را رقم زدند. پردازش ابری داده‌های صوتی به‌جای پردازش محلی روی دستگاه و امکان تغییر تنظیمات Muse توسط سایر برنامه‌ها راه نفوذ را هموار کردند. پاتریک واردل ، پژوهشگر امنیتی، نشان داد نفوذگران می‌توانند بدون اطلاع کاربر عکس بگیرند یا فایل‌های مخرب روی دیسک بنویسند. واردل گفت: «ما می‌توانیم این عامل هوش مصنوعی را دستکاری کنیم و از دسترسی‌هایش برای هر کاری بهره ببریم. بنابراین به‌جای نوشتن یک بدافزار سرقت اطلاعات بسیار جامع برای مک، فقط از خودِ دستیار هوش مصنوعی استفاده می‌کنیم. دست‌کم آن‌ها باید از همان ابتدا به فکر امنیت می‌بودند، اما چنین نکردند.» متا ساعاتی پس از انتشار گزارش‌های فنی، وصله‌ی اصلاحی را در اختیار کاربران قرار داد و ریسک عملیاتی این باگ را ناچیز خواند؛ چرا که اجرای موفق حمله نیازمند دسترسی محلی به سیستم قربانی بود. دیوید سینگلتون ، مدیر آزمایشگاه‌های ابرهوش متا، می‌گوید: «این یک حمله‌ی ارتقای سطح دسترسی محلی بود، نه یک سوءاستفاده از راه دور. بنابراین آسیب‌رسانی از طریق آن نیازمند اجرای پیشین کدهای مخرب روی دستگاه کاربر و تحت حساب کاربری خود اوست و خطر عملی برای کاربران نسخه‌ی مک Muse بسیار پایین ارزیابی می‌شود. با وجود این، یک به‌روزرسانی فوری برای حل موضوع ارائه دادیم.» شناسایی این روزنه در شرایطی رخ داد که Muse با استقبال کاربران مواجه شده و شمار دانلود نسخه‌ی موبایلش در"}, {"source": "Zoomit", "title": "اوپو فایند X10 پرو مکس رونمایی شد؛ رقیب قدرتمند شیائومی ۱۸ پرو با سه دوربین ۲۰۰ مگاپیکسلی", "link": "https://www.zoomit.ir/mobile/467683-oppo-find-x10-pro-max-triple-200mp-camera-launched/", "summary": "اوپو فایند X10 پرو مکس را با سه دوربین ۲۰۰ مگاپیکسلی و باتری غول‌پیکر ۸۰۰۰ میلی‌آمپرساعتی معرفی کرد.", "date_str": "2026-09-22T12:44:48+00:00", "hash": "fcf363b26d221733", "title_fa": "اوپو فایند X10 پرو مکس رونمایی شد؛ رقیب قدرتمند شیائومی ۱۸ پرو با سه دوربین ۲۰۰ مگاپیکسلی", "summary_fa": "اوپو فایند X10 پرو مکس را با سه دوربین ۲۰۰ مگاپیکسلی و باتری غول‌پیکر ۸۰۰۰ میلی‌آمپرساعتی معرفی کرد. تبلیغات اوپو گوشی پرچمدار فایند X10 پرو مکس را در چین رونمایی کرد؛ نخستین گوشی جهان که هر سه دوربین پشتی آن به حسگرهای ۲۰۰ مگاپیکسلی مجهز شده‌اند. دوربین اصلی به‌کمک فناوری حسگری موسوم به DeepPix گستره‌ی دینامیکی ۱۷ استاپ را ارائه می‌دهد؛ قابلیتی که نشان می‌دهد توانایی‌های دوربین گوشی اوپو صرفا به شمار مگاپیکسل‌ها محدود نیست. وضوح خام مدت‌ها است عامل اصلی تعیین‌کننده‌ی کیفیت تصاویر گوشی‌های هوشمند به‌شمار نمی‌رود. لایک مجموعه‌ی سه‌گانه‌ی دوربین پشتی درون ماژولی مربعی و برجسته جای گرفته است. نواری جداگانه در کنار فلاش و یک حسگر اضافی را در خود جای می‌دهد. خط تزئینی نارنجی‌رنگ روی بدنه نیز به همکاری ادامه‌دار اوپو با برند هسلبلاد در حوزه‌ی دوربین اشاره دارد. مدل معمولی فایند X10 طراحی مشابهی دارد؛ اما دوربین اضافی در آن دیده نمی‌شود و وضوح دوربین فوق عریضش به ۵۰ ک می‌کنند، اما به نظر می‌رسد در پایان بارداری وظیفه دیگری هم دارند. به گزارش نیوساینتیست ، پژوهشگران با بررسی نمونه‌های بافت رحم زنان بارداری که در پایان دوره بارداری سزارین شده بودند، متوجه شدند ماکروفاژها ساختارهای بسیار کوچکی شبیه لوله به‌وجود می‌آورند و آن‌ها را به سلول‌های عضلانی رحم وصل می‌کنند. ماکروفاژها از طریق این لوله‌های ریز، بخش‌هایی به نام میتوکندری را به سلول‌های عضلانی منتقل می‌کنند. میتوکندری‌ها در واقع نیروگاه‌های سلول هستند و انرژی تولید می‌کنند. دانشمندان معتقدند این انتقال انرژی به رحم کمک می‌کند تا قدرت کافی برای انقباض و خروج نوزاد را به دست آورد. زایمان برای بسیاری از نخستی‌ها حتی از انسان نیز سخت‌تر است 10 تیر 05 مطالعه &#x27; 3 یافته‌ها با آزمایش‌های دیگر نیز هماهنگ بود؛ زیرا پس از اتصال ماکروفاژها به سلول‌های عضلانی رحم، مقدار مولکول انرژی‌رسان ATP در این سلول‌ها افزایش یافت."}, {"source": "Zoomit", "title": "هرمزگان در انتظار «هاب فناوری» شدن؛ وعده اختصاص ۲ همت اعتبار برای توسعه زیرساخت‌ها از سوی معاون علمی رئیس‌جمهور", "link": "https://www.zoomit.ir/report/467682-hormozgan-elites-science-technology-meeting/", "summary": "نخبگان هرمزگان از مشکلات مسکن، اشتغال و بورسیه تحصیلی گفتند؛ معاون علمی رئیس‌جمهور وعده پیگیری مطالبات و توسعه زیرساخت‌های فناوری را داد.", "date_str": "2026-09-22T12:18:36+00:00", "hash": "b8a04b5b27e6e8bb", "title_fa": "هرمزگان در انتظار «هاب فناوری» شدن؛ وعده اختصاص ۲ همت اعتبار برای توسعه زیرساخت‌ها از سوی معاون علمی رئیس‌جمهور", "summary_fa": "نخبگان هرمزگان از مشکلات مسکن، اشتغال و بورسیه تحصیلی گفتند؛ معاون علمی رئیس‌جمهور وعده پیگیری مطالبات و توسعه زیرساخت‌های فناوری را داد. تبلیغات دیدار حسین افشین، معاون علمی، فناوری و اقتصاد دانش‌بنیان رئیس‌جمهور با نخبگان استان هرمزگان امروز، سه‌شنبه ۳۱ شهریورماه، در اتاق بازرگانی بندرعباس برگزار شد. در این جلسه نخبگان از چالش‌ها و دغدغه‌هایشان گفتند و معاون علمی رئیس‌جمهور هم ضمن پاسخ به دغدغه‌های آن‌ها آمارهایی از وضعیت شرکت‌های دانش‌بنیان هرمزگان ارائه کرد. افشین که هدفش از این سفر استانی حضور در مدرسه شاره طیبه میناب در روز اول مهرماه است، صحبت‌هایش را با اشاره به همین مدرسه آغاز کرد: نمی‌شود در استان هرمزگان بود و یاد مدرسه حشره طیبه میناب را گرامی نداشت؛ جنایت جنگی که رخ داد و باعث شد این مدرسه صرفا یک نام در یکی از استان‌های کشور نباشد بلکه سندی بر جنایت مدعیان صلح و حقوق بشر باشد. - حسین افشین ، معاون علمی، فناوری و اقتصاد دانش‌بنیان رئیس‌جمهور او در ادامه نیز توضیح داد که معاونت علمی در هرمزگان با تمرکز بر ظرفیت‌های استان تاکنون روی زنجیره ارزش میگو، ماهیان گرم دریایی، تهیه محصولات آرایشی و بهداشتی از جلبک، بهسازی مزارع میگو و… کار کرده و شرکت‌های دانش‌بنیان در این حوزه‌ها شکل گرفته‌اند. معاون علمی رئیس‌جمهور در ادامه با بیان این که «استان هرمزگان با ظرفیت‌هایی که دارد می‌تواند یکی از هاب‌های فناوری و یکی از استان‌های مهاجرپذیر کشور شود» آمارهایی را در خصوص وضعیت شرکت‌های دانش‌بنیان این استان ارائه کرد: تعداد شرکت دانش‌بنیان استان هرمزگان ۸۵ شرکت است و از این حیث رتبه ۱۹ را در کشور دارد. هم‌چنین، ۱۸۱ محصول دانش‌بنیان توسط این استان ارائه شده و استان هرمزگان از این لحاظ رتبه ۱۶ کشوری را دارد. درآمد شرکت‌های دانش‌بنیان هرمزگان ۲۳.۳ همت و درآمد ناشی از فروش محصولات این شرکت‌ها ۴.۶ همت است. - حسین افشین ، معاون علمی، فناوری"}, {"source": "Zoomit", "title": "ال بانک از عبور حجم معاملات روزانه TradFi از ۳ میلیارد دلار گزارش داد", "link": "https://www.zoomit.ir/pr/467678-lbank-tradfi-rwa-web3-emerging-assets/", "summary": "ال بانک، صرافی بین المللی رمزارز، اعلام کرد که حجم معاملات روزانه بخش TradFi این پلتفرم در ماه اوت از ۳ میلیارد دلار فراتر رفته است.", "date_str": "2026-09-22T11:34:49+00:00", "hash": "358b3d76ec0907d7", "title_fa": "ال بانک از عبور حجم معاملات روزانه TradFi از ۳ میلیارد دلار گزارش داد", "summary_fa": "ال بانک، صرافی بین المللی رمزارز، اعلام کرد که حجم معاملات روزانه بخش TradFi این پلتفرم در ماه اوت از ۳ میلیارد دلار فراتر رفته است. این مطلب صرفا جنبه تبلیغاتی داشته و زومیت هیچ مسئولیتی را در رابطه با آن نمی‌پذیرد ال بانک، صرافی بین المللی رمزارز، اعلام کرد که حجم معاملات روزانه بخش TradFi این پلتفرم در ماه اوت از ۳ میلیارد دلار فراتر رفته است. تبلیغات این مطلب صرفا جنبه تبلیغاتی داشته و زومیت هیچ مسئولیتی را در را ی هوش مصنوعی مولد رفته است. جیمز استیونسون ، مدیر بازاریابی و ارتباطات اینسامنیاک گیمز، تمامی این فرضیات را بی‌اساس دانست و علت بدشکلی تصویر را یک نقص فنی اعلام کرد. طبق توضیحات او، ظاهر غیرعادی این تابلو ناشی از یک خطای نگاشت بافت بوده است و تیم سازنده روی یک به‌روزرسانی ترمیمی برای برطرف‌کردن آن کار می‌کند. استیونسون به صراحت گفت: «هیچ المان تولیدشده با هوش مصنوعی در Marvel&#x27;s Wolverine وجود ندارد.» استودیوی سازنده در زمان توسعه‌ی Spider-Man 2 در سال ۲۰۲۳ از الگوریتم‌های یادگیری ماشین جهت سرعت‌بخشی به پاره‌ای از فرایندهای توسعه کمک گرفته بود و قصد ادامه‌ی این مسیر بهینه‌سازی را دارد، اما به‌کارگیری هوش مصنوعی مولد برای خلق المان‌های بصری نهایی کماکان خط قرمزی سفت‌وسخت محسوب می‌شود. مرزبندی صریح اینسامنیاک گیمز در قبال ابزارهای مولد، تفاوتی آشکار با سیاست‌های برخی رقبای بزرگ دارد. مجموعه‌ی Call of Duty متعلق به اکتیویژن به‌شکلی گسترده از هوش مصنوعی مولد استفاده می‌کند و سگا نیز قصد دارد این فناوری را در بازی آتی خود یعنی Crazy Taxi: World Tour پیاده‌سازی کند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری مبین احمدی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "مدیاتک با تراشه‌ی ۳ نانومتری CX C10 Max رقابت در بازار لپ‌تاپ‌ها را شعله‌ور کرد", "link": "https://www.zoomit.ir/processor/467625-mediatek-debuts-dimensity-cx-c10-max-chipset-for-googlebooks/", "summary": "مدیاتک با تراشه‌ی پرچمدار ۳ نانومتری Dimensity CX C10 Max رسما وارد رقابت پردازنده‌های پیشرفته‌ی کلاس لپ‌تاپ می‌شود.", "date_str": "2026-09-21T17:27:49+00:00", "hash": "1ce55e8304960f1f", "title_fa": "مدیاتک با تراشه‌ی ۳ نانومتری CX C10 Max رقابت در بازار لپ‌تاپ‌ها را شعله‌ور کرد", "summary_fa": "مدیاتک با تراشه‌ی پرچمدار ۳ نانومتری Dimensity CX C10 Max رسما وارد رقابت پردازنده‌های پیشرفته‌ی کلاس لپ‌تاپ می‌شود. تبلیغات بازار پردازنده‌های کلاس لپ‌تاپ میزبان بازیگری نام‌آشنا شده که قصد دارد معادلات بهره‌وری انرژی و توان محاسباتی را دگرگون کند. هم‌زمان با عرضه‌ی نخستین موج لپ‌تاپ‌های گوگل‌بوک، مدیاتک با معرفی خانواده‌ی جدید CX گامی مهم برای کسب جایگاه در بازار برداشت. تراشه‌ی پرچمدار Dimensity CX C10 Max نخستین عضو این خانواده به‌شمار می‌رود و در یکی از مدل‌های جدید لپ تاپ لنوو مورد استفاده قرار می‌گیرد. مهندسان تایوانی با تکیه بر فرایند ساخت پیشرفته‌ی ۳ نانومتری در کارخانه‌های TSMC و استراتژی معماری «هسته‌های تماما‌ً بزرگ»، بستری بهینه‌سازی‌شده فراهم کرده‌اند تا ساخت دستگاه‌های باریک، کاملا بدون فن و مجهز به باتری بادوام با کارایی پایدار برای تمام روز امکان‌پذیر شود. بخش پردازنده‌ی مرکزی تراشه شامل هشت هسته‌ی قدرتمند است که چینش آن از یک هسته‌ی Arm Cortex-X925، سه هسته‌ی Arm Cortex-X4 و چهار هسته‌ی Arm Cortex-A720 تشکیل می‌شود. وظیفه‌ی پردازش‌های بصری بر دوش واحد گرافیکی ۱۱ هسته‌ای قرار دارد و در کنار آن، نسل هشتم واحد پردازش عصبی اختصاصی مدیاتک تعبیه شده تا شتاب‌دهی بارهای کاری هوش مصنوعی را مدیریت کند. عملکرد واحد عصبی این پلتفرم به ۵۵ تاپس می‌رسد که پردازش سریع‌تر مدل‌های زبانی و امور مربوط به هوش مصنوعی مولد را در سطحی چشمگیر تضمین می‌کند. علاوه بر این، بسته‌ی سخت‌افزاری مذکور از استانداردهای ارتباطی نوین نظیر وای‌فای ۷ و بلوتوث ۶ پشتیبانی به عمل می‌آورد. برخلاف مدل ۱۵ اینچی گوگل‌بوکِ لنوو که متکی بر معماری اینتل است، محصول دیگری از لنوو پذیرای Dimensity CX C10 Max خواهد بود. گزارشی جدید اعلام می‌کند محصول معرفی‌نشده‌ی لنوو که بر پایه‌ی سیستم‌عامل گوگل‌بوک طراحی شده، نخستین میزبان این تراشه‌ی ۳ نانومتری به‌شمار می‌رود تا چالش جدی‌تری برای پلتفرم Snapdragon X کوالکام رقم بخورد."}, {"source": "Zoomit", "title": "پشت‌پرده‌ بازار موسسات آموزشی؛ رتبه برتر کنکور از شما، مصادره‌ موفقیت از ما", "link": "https://www.zoomit.ir/report/467600-konkur-rank-selling-advertising-prices/", "summary": "«۲۰ میلیارد تومان»؛ این رقمی است که به‌گفته یک مشاور کنکور معروف، یکی از موسسات پرآوازه آموزشی برای خرید اعتبار رتبه یک کنکور تجربی امسال کنار گذاشته.", "date_str": "2026-09-21T17:23:05+00:00", "hash": "13d76018ecad12e2", "title_fa": "پشت‌پرده‌ بازار موسسات آموزشی؛ رتبه برتر کنکور از شما، مصادره‌ موفقیت از ما", "summary_fa": "«۲۰ میلیارد تومان»؛ این رقمی است که به‌گفته یک مشاور کنکور معروف،
