      justify-content: center;

    .news-card.is-read:hover {

      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;

      color: var(--primary);

      font-size: 0.85rem;

10-09T12:20:00+00:00", "hash": "5ebae83904286434", "title_fa": "رئیس پلیس پیشگیری فاریاب کرمان در تیراندازی کشته شد", "summary_fa": "مرکز اطلاع رسانی فرماندهی انتظامی استان کرمان در اطلاعیه‌ای از کشته شدن مهدی جمشیدی، رئیس پلیس پیشگیری شهرستان فاریاب، در جریان تیراندازی «افراد ناشناس مسلح» خبر داده است. بر اساس این گزارش، خودروی آقای جمشیدی شامگاه پنجشنبه ۱۶ مهرماه، در یکی از خیابان‌های شهرستان فاریاب، هدف حمله مسلحانه قرار گرفت. مهاجمان پس از متوقف کردن خودرو، به سوی او تیراندازی کردند و او در پی این حمله جان باخت. بر اساس اطلاعیه پلیس او «حین انجام وظیفه» بوده است. ابوالحسن حسینی، فرماندار فاریاب، گفت که هنگام تیراندازی، فرزند او نیز همراهش بوده است. بااین‌حال، درباره وضعیت فرزند او توضیحی نداد. براساس اطلاعیه منتشر شده «تیم‌های ویژه عملیاتی و اطلاعاتی پلیس برای شناسایی و دستگیری عاملان حمله در منطقه مستقر شده‌اند.» پیش از این هم در روز پنجشنبه شهرهای گلشن و نیک‌شهر در استان سیستان و بلوچستان شاهد حملات مسلحانه مشابهی بود. روابط عمومی لشکر ۸۸ زرهی نیروی زمینی ارتش، دیروز در بیانیه‌ای گفت که یک مینی‌بوس حامل کارکنان این لشکر که در سواحل مکران مستقر هستند، هدف «حمله مسلحانه» قرار گرفت. بر اساس این بیانیه، این مینی‌بوس در مسیر تعویض شیفت در محدوده شهرستان نیکشهر هدف قرار گرفت که بر اثر آن یک نفر از کارکنان جان خود را از دست داد و سه نفر دیگر نیز مجروح شدند.» پیش‌تر مرکز اطلاع‌رسانی پلیس سیستان و بلوچستان دراطلاعیه‌ای از تیراندازی و انفجار در مقابل ستاد فرماندهی انتظامی شهرستان گلشن در سیستان و بلوچستان خبر داده و گفته بود که در این حمله یک نفر کشته و تعدادی هم مجروح شدند. طی ماه گذشته موارد حملات به نیروهای انتظامی و درگیری‌های مسلحانه در مناطق جنوب شرق ایران افزایش داشته است. استان سیستان و بلوچستان مرزهای طولانی با پاکستان و افغانستان دارد و مدت‌هاست با چالش‌های امنیتی، از جمله حملات گروه‌های شبه‌نظامی و درگیری با قاچاقچیان کالا و مواد مخدر، مواجه بوده است."}, {"source": "BBC Persian", "title": "تیراندازی ماموران اداره مهاجرت آمریکا به مردی که همراه کودک پنج ساله‌اش بود", "link": "https://www.bbc.com/persian/articles/cqly05n7yje5o?at_medium=RSS&at_campaign=rss", "summary": "مقامات نیویورک «خشم» خود را از تیراندازی ماموران اداره مهاجرت و گمرک آمریکا (آیس) به یک فرد اهل جمهوری دومینیکن ابراز کردند. ماموران دیروز (پنجشنبه) به این مرد که با کودکی پنج ساله در حال رانندگی بود، در محله برانکس نیویورک شلیک کرده بودند.", "date_str": "2026-10-09T10:37:20+00:00", "hash": "c58f3300b27dc276", "title_fa": "تیراندازی ماموران اداره مهاجرت آمریکا به مردی که همراه کودک پنج ساله‌اش بود", "summary_fa": "مقامات نیویورک «خشم» خود را از تیراندازی ماموران اداره مهاجرت و گمرک آمریکا (آیس) به یک فرد اهل جمهوری دومینیکن ابراز کردند. ماموران دیروز (پنجشنبه) به این مرد که با کودکی پنج ساله در حال رانندگی بود، در محله برانکس نیویورک شلیک کرده بودند. زهران ممدانی، شهردار نیویورک، این حادثه را «خلاف وجدان» و «بسیار جدی» توصیف کرد. او گفت که از دونالد ترامپ، رئیس‌جمهور آمریکا، خواسته تا فعالیت‌های ماموران اداره مهاجرت در آن شهر را «متوقف» کند. او گفت: «گزارش‌های اولیه حاکی از آن است که ماموران قبل از شلیک چندین گلوله، خودروی حامل این مرد و کودک پنج ساله را محاصره کرده‌ بودند اما این کودک ظاهرا از نظر جسمی آسیبی ندیده است.» بی‌بی‌سی برای اظهار نظر در مورد اظهارات آقای ممدانی با وزارت امنیت داخلی تماس گرفته است. اواخر عصر پنجشنبه، کتی هوکول، فرماندار نیویورک هم، گفت که با دونالد ترامپ، در مورد این تیراندازی صحبت کرده و «از طرف نیویورکی‌ها» ابراز خشم کرده است. او افزود که همچنین درخواست کرده است که هرگونه فیلمی که از دوربین‌های بدنی ماموران از این تیراندازی ضبط شده، برای عموم منتشر شود تا بتوان به حقایق دست یافت. فرماندار نیویورک، همچنین گفت که اهالی نیویورک خشونت‌های زیادی از آنچه که او اداره‌ای «سرکش» و مامورانی «آموزش‌ندیده» خواند، دیده‌اند. او گفت این درحالی است که این ماموران با «مصونیت» به کار خود ادامه می‌دهند. در همین حال وزارت امنیت داخلی آمریکا گفته است که مامورانش «عملیاتی هدفمند» را برای بازداشت یک «مجرم سابقه‌دار» ترتیب دیده بودند. در بیانیه این وزارت‌خانه آمده که این فرد «زنده» و در بیمارستان بستری شده است. آقای ترامپ هنوز واکنشی به این خبر نشان نداده است. در بیانیه اداره گمرک و مهاجرت آمده است که این فرد اهل جمهوری دومینیکن در دسامبر ۲۰۲۳ هم «دستگیر» شده بود و «چند روز بعد آزاد شد.»"}, {"source": "BBC Persian", "title": "اعتراضات دانش‌آموزی در فرانسه؛ خشم معترضان از کجا ناشی می‌شود؟", "link": "https://www.bbc.com/persian/articles/crx23p8ljxx1o?at_medium=RSS&at_campaign=rss", "summary": "از اواخر سپتامبر ۲۰۲۶، دانش‌آموزان در سراسر فرانسه در اعتراض به کمبود بودجه آموزش دست به اعتراض زده‌اند و راه ورود به بسیاری از دبیرستان‌ها را مسدود کرده‌اند. این جنبش در برخی نقاط به خشونت کشیده شده است و صدها دانش‌آموز، معلم و مامور پلیس زخمی شده‌اند. هزاران نفر، از جمله شمار نامعلومی از آشوبگرانی که ارتباطی با مدارس ندارند، بازداشت شده‌اند.", "date_str": "2026-10-09T05:05:55+00:00", "hash": "8bd347ccefd15fcb", "title_fa": "اعتراضات دانش‌آموزی در فرانسه؛ خشم معترضان از کجا ناشی می‌شود؟", "summary_fa": "از اواخر سپتامبر ۲۰۲۶، دانش‌آموزان در سراسر فرانسه در اعتراض به کمبود بودجه آموزش دست به اعتراض زده‌اند و راه ورود به بسیاری از دبیرستان‌ها را مسدود کرده‌اند. این جنبش در برخی نقاط به خشونت کشیده شده است و صدها دانش‌آموز، معلم و مامور پلیس زخمی شده‌اند. هزاران نفر، از جمله شمار نامعلومی از آشوبگرانی که ارتباطی با مدارس ندارند، بازداشت شده‌اند. معترضان از کمبود کارکنان و فرسودگی امکانات در «لیسه»های فرانسه، دبیرستان‌هایی برای نوجوانان ۱۵ تا ۱۸ ساله، شکایت دارند. مادالنا، دانش‌آموزی در پاریس، روز سه‌شنبه، هم‌زمان با تظاهرات صدها هزار نفر در سراسر فرانسه، به بی‌بی‌سی گفت: «گاهی معلمان ما چند هفته غایب هستند و کسی جایگزینشان نمی‌شود.» او افزود ساختمان‌های مدرسه‌اش در موج‌های گرمای اخیر «به‌شدت داغ» بوده‌اند. اعتراض‌ها دلایل دیگری هم دارند. برخی دانش‌آموزان از ممنوعیت تلفن همراه یا روزهای مدرسه‌ای که تا ساعت شش عصر ادامه دارد ناراضی‌اند. یکی از دانش‌آموزان دبیرستانی به شبکه فرانس ۲ گفت: «ساعت هفت به خانه می‌رسیم و دیگر نه وقتی برای خواب داریم و نه برای انجام تکالیف.» سامانه اینترنتی «پارکورسوپ» در فرانسه، که وظیفه تخصیص ظرفیت‌های آموزش عالی به متقاضیان را بر عهده دارد، یکی دیگر از کانون‌های نارضایتی است. این سرخوردگی ریشه‌های عمیقی دارد. اکنون حدود ۸۰ درصد هر نسل مدرک «باکالورئا» می‌گیرند که به دانش‌آموزان حق ورود به دانشگاه می‌دهد، هرچند نه لزوما به رشته یا دانشگاه مورد نظرشان. این وضعیت رقابت شدیدی برای دوره‌های پرطرفدار ایجاد می‌کند و اضطراب زیادی را متوجه پارکورسوپ کرده است، سامانه‌ای که بسیاری آن را غیرشفاف می‌دانند. پلیس ضد شورش روز سه‌شنبه با معترضان دانش‌آموز درگیر شد و از گاز اشک‌آور استفاده کرد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید."}, {"source": "BBC Persian", "title": "پشت بازسازی محرمانه اقامتگاه پوتین در ساحل دریای سیاه چیست؟", "link": "https://www.bbc.com/persian/articles/cv5yn3wg92ljo?at_medium=RSS&at_campaign=rss", "summary": "تصاویر ماهواره‌ای از دگرگونی گسترده اقامتگاه ریاست‌جمهوری روسیه در دوران جنگ خبر می‌دهند و هم‌زمان، پرونده‌های حقوقی و آگهی‌های استخدام با دستمزد نقدی، جزئیات پنهان پروژه عظیم بازسازی آن را آشکار می‌کنند.", "date_str": "2026-10-09T01:03:35+00:00", "hash": "ef0d169d298dbdab", "title_fa": "پشت بازسازی محرمانه اقامتگاه پوتین در ساحل دریای سیاه چیست؟", "summary_fa": "تصاویر ماهواره‌ای از دگرگونی گسترده اقامتگاه ریاست‌جمهوری روسیه در دوران جنگ خبر می‌دهند و هم‌زمان، پرونده‌های حقوقی و آگهی‌های استخدام با دستمزد نقدی، جزئیات پنهان پروژه عظیم بازسازی آن را آشکار می‌کنند. مناقشه‌های حقوقی در دادگاه‌ها، تصاویر ماهواره‌ای و آگهی‌های استخدامی که برای کارگران ساختمانی اقامت کنار استخر، غذای رایگان و دستمزد نقدی وعده می‌دهند، ابعاد گسترش اقامتگاه رسمی ولادیمیر پوتین در ساحل دریای سیاه را آشکار کرده‌اند. اقامتگاه دولتی بوچاروف روچی در شهر سوچی پیش‌تر محل اقامت نیکیتا خروشچف و لئونید برژنف بود و پس از فروپاشی اتحاد جماهیر شوروی، بوریس یلتسین نیز از آن استفاده می‌کرد. پوتین نخستین بار پیش از مراسم تحلیف دوره اول ریاست‌جمهوری خود در مه ۲۰۰۰ در این اقامتگاه ماند و پس از آن نیز بارها در آنجا میزبان رهبران خارجی بوده است. در سال ۲۰۰۸، این مجموعه به اقامتگاه رسمی ریاست‌جمهوری تبدیل شد. به گفته ولادیمیر کوژین، رئیس وقت اداره مدیریت اموال ریاست‌جمهوری فدراسیون روسیه، این جایگاه به معنای آن است که رئیس‌جمهور می‌تواند در آنجا «اقامت کند، کار کند، زندگی کند و همه وظایف خود، از جمله وظایف فرمانده کل قوا را انجام دهد». بر اساس گزارش فایننشال تایمز، پوتین در سال ۲۰۲۱، یک سال پیش از تهاجم تمام‌عیار روسیه به اوکراین، ۲۴ بار به سوچی سفر کرد، اما در مجموع در سال‌های ۲۰۲۴ و ۲۰۲۵ تنها دو بار به این شهر رفت. کاهش چشمگیر سفرهای پوتین به ساحل دریای سیاه هم‌زمان با افزایش توانایی پهپادهای اوکراینی برای رسیدن به این منطقه ساحلی بوده است. اما تحقیقات بخش روسی بی‌بی‌سی اکنون نشان می‌دهد که دولت به‌جای کنار گذاشتن بوچاروف روچی، در حال بازسازی کامل آن از پایه، در ابعادی بسیار بزرگ‌تر و با تدابیر امنیتی بسیار سخت‌گیرانه‌تر است. عملیات تخریب در سال ۲۰۲۴ آغاز شد، بی‌آن‌که مقام‌ها درباره آن اطلاع‌رسانی کنند. تا سپتامبر ۲۰۲۵، گودال بزرگی در محل ساخت‌وساز ایجاد شده بود."}, {"source": "BBC Persian", "title": "چرا شیوع جهانی طاعون ریوی بعید است؟", "link": "https://www.bbc.com/persian/articles/cme8rn431213o?at_medium=RSS&at_campaign=rss", "summary": "اگرچه نوع ریوی یرسینیا پستیس در صورت درمان نشدن تقریبا همیشه مرگبار است، امروزه می‌توان آن را با آنتی‌بیوتیک‌های ساده و در دسترس درمان کرد.", "date_str": "2026-10-09T05:58:42+00:00", "hash": "b3170ffc86c6bf6a", "title_fa": "چرا شیوع جهانی طاعون ریوی بعید است؟", "summary_fa": "اگرچه نوع ریوی یرسینیا پستیس در صورت درمان نشدن تقریبا همیشه مرگبار است، امروزه می‌توان آن را با آنتی‌بیوتیک‌های ساده و در دسترس درمان کرد. این وضعیت ممکن است به‌طرز نگران‌کننده‌ای آشنا به نظر برسد. جمعه هفته گذشته، زنی در سیبری پس از آنکه احتمالا در معرض عامل طاعون قرار گرفته بود، بر اثر ذات‌الریه با منشا «نامشخص» جان باخت. رسانه‌های روسیه گزارش داده‌اند که نزدیک به ۲۰۰ نفر در قرنطینه قرار گرفته‌اند. مقام‌ها به‌سرعت تلاش کردند نگرانی‌ها را فروبنشانند، اما گمانه‌زنی و نگرانی در فضای مجازی در حال گسترش است. این زن ۲۸ ساله، داریا شیپیلووا، در موسسه مبارزه با طاعون در منطقه ایرکوتسک سیبری کار می‌کرد. گزارش‌های تایید نشده حاکی از آن بود که او یا پس از شکستن یک لوله آزمایش حاوی باکتری طاعون دچار علائمی شبیه ذات‌الریه شد، یا پس از یک سفر میدانی به منطقه بوریاتیا در مرز مغولستان بیمار شد. در این منطقه، طاعون در میان حیوانات وحشی بومی است. تا این تاریخ، علت مرگ شیپیلووا رسما تائید نشده و بنا بر گزارش‌ها آزمایش‌های آزمایشگاهی در جریان است. اما یک نکته روشن است. کارشناسان می‌گویند بعید است این مورد به شیوعی جهانی منجر شود. عامل طاعون باکتری «یرسینیا پستیس» است. از نظر بالینی، این بیماری سه شکل دارد: طاعون خیارکی، طاعون ریوی و طاعون سپتی‌سمیک. طاعون خیارکی رایج‌ترین نوع این بیماری است و از طریق گزش کک‌های آلوده منتقل می‌شود. پس از ورود باکتری به بدن انسان، به غدد لنفاوی می‌رود و در کشاله ران، گردن و زیر بغل باعث ایجاد تورم‌های دردناکی به نام «بوبو» می‌شود. انتقال طاعون خیارکی از انسان به انسان نادر است، اما باکتری می‌تواند وارد خون شود و طاعون سپتی‌سمیک ایجاد کند، یا به ریه‌ها برسد و باعث طاعون ریوی شود. برخلاف دیگر انواع طاعون، نوع ریوی آن می‌تواند از طریق قطرات ریزی که هنگام سرفه یا عطسه فرد"}, {"source": "BBC Persian", "title": "آیا عربستان به دنبال کاهش وابستگی به آمریکا است؟", "link": "https://www.bbc.com/persian/articles/c64g1v1w72keo?at_medium=RSS&at_campaign=rss", "summary": "تصمیم عربستان سعودی، ترکیه و پاکستان برای آغاز اجرای عملی تعهدات دفاع مشترک در چارچوب «ائتلاف مکه» بار دیگر این پرسش را مطرح کرده است که ریاض تا چه اندازه در پی کاهش وابستگی امنیتی خود به آمریکا است. این تحول در حالی رخ می‌دهد که عربستان از حمایت اطلاعاتی واشنگتن برخوردار است، اما از دریافت کمک نظامی مستقیم در برابر حملات حوثی‌ها ناامید شده و همزمان در پی گسترش گزینه‌های امنیتی و دفاعی خود برآمده است.", "date_str": "2026-10-08T20:28:29+00:00", "hash": "348ed6d6e04cc0a1", "title_fa": "آیا عربستان به دنبال کاهش وابستگی به آمریکا است؟", "summary_fa": "تصمیم عربستان سعودی، ترکیه و پاکستان برای آغاز اجرای عملی تعهدات دفاع مشترک در چارچوب «ائتلاف مکه» بار دیگر این پرسش را مطرح کرده است که ریاض تا چه اندازه در پی کاهش وابستگی امنیتی خود به آمریکا است. این تحول در حالی رخ می‌دهد که عربستان از حمایت اطلاعاتی واشنگتن برخوردار است، اما از دریافت کمک نظامی مستقیم در برابر حملات حوثی‌ها ناامید شده و همزمان در پی گسترش گزینه‌های امنیتی و دفاعی خود برآمده است. تنوع‌بخشی عربستان به شراکت‌های امنیتی‌اش دیگر صرفاً یک ایده برای آینده نیست. این تصمیم در نشست اضطراری کمیته راهبردی سیاسی و دفاعی ائتلاف مکه برای بررسی «تحولات امنیتی و تهدیدهای پیش روی عربستان» اتخاذ شد؛ آن هم در شرایطی که جنگ یمن بار دیگر تشدید شده و عربستان هدف حملات جنبش انصارالله حوثی مورد حمایت ایران قرار دارد. پیش‌تر نیز گزارش‌های رسانه‌ای فاش کرده بودند که دونالد ترامپ، رئیس‌جمهور آمریکا، درخواست‌های مکرر عربستان برای دریافت کمک نظامی مستقیم در مقابله با حوثی‌ها را رد کرده است. بر اساس این گزارش‌ها، واشنگتن با انجام حملات مستقیم آمریکا علیه حوثی‌ها در کنار عربستان موافقت نکرده، اما برای کمک به عملیات هدف‌گیری این گروه، پشتیبانی اطلاعاتی و داده‌های اطلاعاتی در اختیار ریاض قرار داده است. آیا این تحولات عربستان را به کاهش وابستگی خود به ایالات متحده سوق خواهد داد؟ و آیا آنچه «ائتلاف مکه» نامیده می‌شود می‌تواند بخشی از تضمین‌های امنیتی‌ را که عربستان از واشنگتن دریافت می‌کرد، برای این کشور فراهم کند؟ پس از بیش از چهار سال آرامش نسبی که در پی آتش‌بس مورد حمایت سازمان ملل در سال ۲۰۲۲ برقرار شده بود، جبهه یمن بار دیگر وارد مرحله‌ای از تشدید تنش شده است. نقطه عطف این تحول در ماه ژوئیه رخ داد، زمانی که نیروهای دولت یمن، مورد حمایت عربستان سعودی، فرودگاه صنعا را که در کنترل حوثی‌ها قرار دارد، هدف حمله"}, {"source": "BBC Persian", "title": "پنتاگون: مراسم اعدام با جوخه آتش عامل حمله «فورت هود» پخش زنده ویدیویی خواهد شد", "link": "https://www.bbc.com/persian/articles/cw1m4r1y3zkyo?at_medium=RSS&at_campaign=rss", "summary": "پیت هگست، وزیر دفاع ایالات متحده آمریکا، اعلام کرد که عموم مردم قادر خواهند بود شاهد اعدام یک سرگرد سابق ارتش آمریکا توسط جوخه آتش باشند. یکی از مقامات وزارت دفاع به بی‌بی‌سی گفت که مراسم اعدام نضال حسن، کسی که در سال ۲۰۰۹ در پایگاه «فورت هود» ۱۳ سرباز غیرمسلح آمریکایی را به ضرب گلوله کشت، به‌صورت زنده پخش خواهد شد. پنتاگون اوایل همین هفته اعلام کرده بود که قصد دارد حکم اعدام حسن را اجرا کند؛ اقدامی که نخستین اعدام نظامی در ایالات متحده طی بیش از ۶۰ سال گذشته خواهد بود.", "date_str": "2026-10-08T23:44:04+00:00", "hash": "13391d82885a78e4", "title_fa": "پنتاگون: مراسم اعدام با جوخه آتش عامل حمله «فورت هود» پخش زنده ویدیویی خواهد شد", "summary_fa": "پیت هگست، وزیر دفاع ایالات متحده آمریکا، اعلام کرد که عموم مردم قادر خواهند بود شاهد اعدام یک سرگرد سابق ارتش آمریکا توسط جوخه آتش باشند. یکی از مقامات وزارت دفاع به بی‌بی‌سی گفت که مراسم اعدام نضال حسن، کسی که در سال ۲۰۰۹ در پایگاه «فورت هود» ۱۳ سرباز غیرمسلح آمریکایی را به ضرب گلوله کشت، به‌صورت زنده پخش خواهد شد. پنتاگون اوایل همین هفته اعلام کرده بود که قصد دارد حکم اعدام حسن را اجرا کند؛ اقدامی که نخستین اعدام نظامی در ایالات متحده طی بیش از ۶۰ سال گذشته خواهد بود. هگست روز پنجشنبه گفت: «ما اطمینان حاصل خواهیم کرد که مردم بتوانند آن را تماشا کنند و این رویداد علنی باشد؛ زیرا مردم باید بدانند که چنین اقداماتی پیامدهای سنگینی در پی دارد.» هگست در مصاحبه‌ای با شبکه تلویزیونی محافظه‌کار «ریل امریکاز وویس» گفت که حسن «با جوخه آتش نظامیان اعدام خواهد شد؛ همان‌طور که باید باشد». بی‌بی‌سی برای دریافت اظهارنظر در مورد اینکه آیا دونالد ترامپ، رئیس‌جمهور آمریکا، از اعدام علنی و پخش زنده آن حمایت می‌کند یا خیر، با کاخ سفید تماس گرفته است. شان پارنل، سخنگوی پنتاگون، روز دوشنبه گفته بود که وزیر دفاع این پیشنهاد را مطرح کرده و ترامپ با آن موافقت کرده است. وزیر نیروی زمینی ارتش آمریکا روز سه‌شنبه اعلام کرد که این اعدام قرار است در تاریخ ۳ دسامبر در پایگاه «فورت هود» در تگزاس انجام شود. این نخستین مورد اعدام نظامی توسط جوخه آتش از زمان پایان جنگ جهانی دوم خواهد بود. حسن، روان‌پزشک ارتش آمریکا اهل ویرجینیا، در دادگاه اعتراف کرد که عامل تیراندازی در مرگبارترین حمله غیررزمی تاریخ به یک پایگاه نظامی آمریکا بوده است. این تیراندازی در ۵ نوامبر ۲۰۰۹ در یک ساختمان درمانی شلوغ رخ داد؛ جایی که سربازان در آستانه اعزام، منتظر معاینات پزشکی و دریافت واکسن بودند. حسن در دادگاه بابت"}, {"source": "BBC Persian", "title": "ژنرال سوری تحت تعقیب، با حمایت آمریکا در لبنان زندگی می‌کند", "link": "https://www.bbc.com/persian/articles/cjvgx6qlqr3wo?at_medium=RSS&at_campaign=rss", "summary": "بر اساس تحقیقات بی‌بی‌سی یک ژنرال پیشین سوریه که به اتهام جنایت علیه بشریت تحت تعقیب است، با حمایت مالی و حفاظت مقام‌های آمریکایی و لبنانی در لبنان به سر می‌برد.", "date_str": "2026-10-08T15:00:04+00:00", "hash": "4927de69c0db4a27", "title_fa": "ژنرال سوری تحت تعقیب، با حمایت آمریکا در لبنان زندگی می‌کند", "summary_fa": "بر اساس تحقیقات بی‌بی‌سی یک ژنرال پیشین سوریه که به اتهام جنایت علیه بشریت تحت تعقیب است، با حمایت مالی و حفاظت مقام‌های آمریکایی و لبنانی در لبنان به سر می‌برد. بسام حسن، که بر برنامه تسلیحات شیمیایی سوریه نظارت داشت و مشاور ارشد بشار اسد، رئیس‌جمهور پیشین سوریه، بود، پس از فروپاشی حکومت اسد در سال ۲۰۲۴، در لبنان پناه داده شده است. تحقیقات مشترک بی‌بی‌سی و شبکه آمریکایی ان‌پی‌آر، نشان می‌دهد آقای حسن در چارچوب توافقی با مشارکت پلیس اف‌بی‌آی و دیگر نهادهای آمریکایی و لبنانی، اجازه یافته در لبنان بماند. به گفته منابع مطلع، دلیل این توافق، تمایل او برای ارائه اطلاعات درباره ربوده شدن آستین تایس، روزنامه‌نگار آمریکایی، در سوریه در سال ۲۰۱۲ و همچنین ارائه اطلاعات امنیتی دیگر بوده است. بی‌بی‌سی ماه گذشته فاش کرد که ربوده شدن آستین تایس عملیاتی از پیش برنامه‌ریزی‌شده بوده و بسام حسن در ساختار فرماندهی آن نقش داشته است. مقامات دو نهاد مختلف در دولت جدید سوریه به بی‌بی‌سی گفته‌اند که دمشق خواهان بازگرداندن آقای حسن برای محاکمه است اما مقام‌های آمریکایی می‌خواهند که او در لبنان بماند و به گفته این مقام‌ها، دولت سوریه برای تغییر این وضعیت اختیار چندانی ندارد. بی‌بی‌سی برای دریافت توضیح درباره یافته‌های خود با نمایندگان پلیس فدرال آمریکا،اف‌بی‌آی، و سازمان اطلاعات مرکزی آمریکا، سیا، و اداره کل امنیت عمومی لبنان تماس گرفت. تنها اف‌بی‌آی پاسخ داد و از اظهارنظر درباره این گزارش خودداری کرد. این نهاد، بی‌بی‌سی را به بیانیه‌ای پیشین ارجاع داد، بیانیه‌ای که تاکید داشت که تمرکز این نهاد همچنان بر روشن شدن حقایق پرونده «تایس» و تضمین بازگشت اوست. فیل وود، سخنگوی خانواده آستین تایس، در واکنش به یافته‌های بی‌بی‌سی گفت که «اگر آنچه می‌گویید صحت داشته باشد، این واقعیت که پول مالیات ما صرف تامین زندگی راحت برای فردی می‌شود که با استفاده از سلاح‌های شیمیایی علیه غیرنظامیان سوری"}, {"source": "Iran International", "title": "روان جامعه ایران در یک سال گذشته؛ وقتی بحران به زندگی تبدیل می‌شود", "link": "https://www.iranintl.com/202610072217", "summary": "۱۰ اکتبر، روز جهانی سلامت روان، هر سال  فرودگاه‌های ریاض و ابها سه کشته و ۳۶ زخمی بر جای گذاشت. رویترز پنج‌شنبه ۱۶ مهر از مشاهده دود برخاسته از یک هواپیما در فرودگاه ریاض خبر داد.", "date_str": "2026-10-08T15:07:18+00:00", "hash": "3cc3860b8fba3e26", "title_fa": "عربستان سعودی از کشته شدن ۳ نفر در حملات حوثی‌ها به فرودگاه ریاض و ابها خبر داد", "summary_fa": "مقام‌های هوانوردی غیرنظامی عربستان سعودی اعلام کردند حملات روزهای سه‌شنبه و چهارشنبه، ۱۴ و ۱۵ مهر، به فرودگاه‌های ریاض و ابها سه کشته و ۳۶ زخمی بر جای گذاشت. رویترز پنج‌شنبه ۱۶ مهر از مشاهده دود برخاسته از یک هواپیما در فرودگاه ریاض خبر داد."}, {"source": "Radio Farda", "title": "گزارش وزارت خارجه آمریکا درباره سیاست استفاده از «کودک‌سربازان» توسط حکومت ایران", "link": "https://www.radiofarda.com/a/trafficking-in-persons-us-report-iran/33873605.html", "summary": "وزارت خارجه آمریکا می‌گوید جمهوری اسلامی از کودکان ایرانی و نیز کودکان مهاجر افغان و پاکستانی و سوری برای اهداف و فعالیت‌های نظامی استفاده می‌کند.", "date_str": "2026-10-09T13:26:00+00:00", "hash": "3e160fdd0712274c", "title_fa": "گزارش وزارت خارجه آمریکا درباره سیاست استفاده از «کودک‌سربازان» توسط حکومت ایران", "summary_fa": "وزارت خارجه آمریکا می‌گوید جمهوری اسلامی از کودکان ایرانی و نیز کودکان مهاجر افغان و پاکستانی و سوری برای اهداف و فعالیت‌های نظامی استفاده می‌کند. وزارت خارجه آمریکا در تازه‌ترین گزارش خود درباره قاچاق انسان در سال ۲۰۲۶، اعلام کرد که حکومت ایران سیاست استفاده و جذب «کودک‌سربازان» را اتخاذ کرده است. این گزارش مفصل روز پنج‌شنبه ۱۶ مهر منتشر شده، و دوره مورد بررسی آن، فروردین ۱۴۰۴ تا ۱۱ فروردین ۱۴۰۵ را دربرمی‌گیرد که شامل دوره سرکوب اعتراضات دی‌ماه پارسال هم می‌شود. یکی از مهم‌ترین بخش‌های این گزارش که به ابعاد مختلف قاچاق انسان در ایران پرداخته، می‌گوید جمهوری اسلامی از کودکان ایرانی و نیز کودکان مهاجر افغان و پاکستانی و سوری برای اهداف و فعالیت‌های نظامی استفاده می‌کند. در این گزارش آمده که همانند دوره‌های گزارش‌دهی پیشین، سپاه پاسداران انقلاب اسلامی «کودکان کم‌سن‌وسال را به‌عنوان سرباز جذب کرده و به کار گرفته و از گروه‌های مسلح غیردولتی که کودکان را به‌اجبار جذب و به‌عنوان سرباز استفاده می‌کنند، حمایت کرده است». وزارت خارجه آمریکا اضافه کرده که «مقام‌های ایرانی، از جمله سپاه پاسداران انقلاب اسلامی و بسیج به عنوان نیروی شبه‌نظامی وابسته به آن، همچنان افغان‌ها، از جمله کودکان، و همچنین برخی مهاجران پاکستانی، اتباع سوری و کودکان ایرانی را با زور و اجبار به عضویت گروه‌های مسلح فعال در منطقه درمی‌آورند.» پیش از این تصاویر متعددی در شبکه‌های اجتماعی و نیز برخی رسانه‌ها و خبرگزاری‌های داخل ایران از حضور کودکان در میان نیروهای شبه‌نظامی بسیج در جریان سرکوب خشونت‌بار معترضان به ویژه در ۱۷ و ۱۸ دی‌ماه پارسال و نیز دوره‌های پیشین سرکوب اعتراضات در شهرهای مختلف ایران منتشر شده بود. در این گزارش به کمپین سپاه پاسداران انقلاب اسلامی ایران برای جذب کودکان از ۱۲ سالگی برای داوطلب شدن به‌عنوان «رزمندگان مدافع وطن» در فروردین امسال نیز اشاره شده است."}, {"source": "Radio Farda", "title": "طرح «تورم صفر» شهردار تهران بحث‌برانگیز شد؛ از انتقاد اقتصادی تا گمانه‌زنی انتخاباتی", "link": "https://www.radiofarda.com/a/tehran-mayor-zakani-zero-inflation-plan-price-freeze-controversy/33873441.html", "summary": "در کنار انتقادهای اقتصادی، برخی چهره‌های سیاسی و رسانه‌ها نیز اقدامات اخیر شهرداری تهران را با احتمال حضور دوبارهٔ علیرضا زاکانی در انتخابات ریاست‌جمهوری مرتبط دانسته‌اند.", "date_str": "2026-10-09T11:16:30+00:00", "hash": "170f08b87795975a", "title_fa": "طرح «تورم صفر» شهردار تهران بحث‌برانگیز شد؛ از انتقاد اقتصادی تا گمانه‌زنی انتخاباتی", "summary_fa": "در کنار انتقادهای اقتصادی، برخی چهره‌های سیاسی و رسانه‌ها نیز اقدامات اخیر شهرداری تهران را با احتمال حضور دوبارهٔ علیرضا زاکانی در انتخابات ریاست‌جمهوری مرتبط دانسته‌اند. طرح علیرضا زاکانی، شهردار تهران، برای ثابت نگه داشتن قیمت شماری از کالاهای اساسی به مدت شش ماه تحت عنوان «تورم صفر» واکنش‌های تندی را در میان برخی اقتصاددانان، اعضای شورای شهر برانگیخته است. با این حال زاکانی روز پنجشنبه ۱۶ مهر، در واکنش به موج انتقادها، طرح خود را «سپری در برابر جنگ اقتصادی» توصیف کرد و گفت ایران در «جنگی همه‌جانبه» قرار دارد و باید برای کاهش فشار معیشتی بر مردم تلاش کرد. محمد مهاجری، روزنامه‌نگار و فعال سیاسی اصولگرا، اما این طرح را «پوچ و مهمل» خوانده و با استفاده از هشتگ «حاجی ارزون‌فروش» از دادستان تهران خواسته است برای جلوگیری از «فساد احتمالی» مداخله کند. او با اشاره به اصل ۱۵۶ قانون اساسی و وظیفهٔ قوهٔ قضائیه در پیشگیری از وقوع جرم نوشت که این طرح می‌تواند به «فاجعه تاریخی» منجر شود و خطاب به دادستان تأکید کرد: «از هم‌اکنون جلوی فساد را بگیرید.» بر اساس این طرح که شهرداری تهران اجرای آن را از هفتم مهر آغاز کرده، قرار است قیمت ۱۲ قلم کالای اساسی، از جمله برنج، گوشت منجمد، روغن، شکر و حبوبات، به مدت شش ماه ثابت بماند. این کالاها با سهمیه‌بندی خانوارها از طریق مراکز منتخب میوه و تره‌بار، فروشگاه‌های شهروند و سامانهٔ اینترنتی «شهرزاد» عرضه می‌شوند. برخلاف عنوان «تورم صفر»، این برنامه به معنای صفر شدن نرخ تورم در تهران نیست و صرفاً تثبیت قیمت تعدادی کالای مشخص در شبکهٔ فروش شهرداری را دنبال می‌کند. زاکانی گفته است برای اجرای این طرح از اعتبار شهرداری، تسهیلات بانکی و ظرفیت‌های بانک مرکزی استفاده خواهد کرد. با این حال، هزینهٔ نهایی اجرای طرح و میزان تعهد مالی شهرداری در صورت افزایش قیمت کالاها روشن نیست."}, {"source": "Radio Farda", "title": "ناوی پیلای، کمیسر پیشین حقوق بشر، برنده جایزه صلح نوبل ۲۰۲۶ شد؛ واکنش‌ها", "link": "https://www.radiofarda.com/a/navi-pillay-wins-2026-nobel-peace-prize/33873472.html", "summary": "ناوی پیلای در تلاش‌های بین‌المللی برای محاکمهٔ عاملان جنایات جنگی، جنایت علیه بشریت و نسل‌کشی نقشی مؤثر داشته است.", "date_str": "2026-10-09T09:31:24+00:00", "hash": "472b57d13d0b3768", "title_fa": "ناوی پیلای، کمیسر پیشین حقوق بشر، برنده جایزه صلح نوبل ۲۰۲۶ شد؛ واکنش‌ها", "summary_fa": "ناوی پیلای در تلاش‌های بین‌المللی برای محاکمهٔ عاملان جنایات جنگی، جنایت علیه بشریت و نسل‌کشی نقشی مؤثر داشته است. جایزهٔ نوبل صلح سال ۲۰۲۶ به ناوی پیلای، حقوقدان ۸۵ سالهٔ اهل آفریقای جنوبی و کمیسر عالی پیشین حقوق بشر سازمان ملل متحد، برای تلاش‌هایش در دفاع از حقوق بین‌الملل و گسترش صلح در جهان تعلق گرفت. کمیتهٔ نوبل نروژ روز جمعه ۱۷ مهر اعلام کرد که این جایزه را به پاس فعالیت‌های چند دهه‌ای خانم پیلای برای تقویت نهادهای حقوقی بین‌المللی و پاسخگو کردن عاملان جنایات جنگی، جنایت علیه بشریت و نسل‌کشی به او اعطا کرده است. یورگن واتنه فریدنس، رئیس کمیتهٔ نوبل نروژ، هنگام اعلام نام برنده گفت که جایزهٔ امسال به شخصیتی تعلق می‌گیرد که با «شجاعت و صداقت استثنایی» راه را برای ایجاد نظمی حقوقی فراگیرتر در جهان هموار کرده است. او تأکید کرد که ناوی پیلای در تلاش‌های بین‌المللی برای محاکمهٔ عاملان جنایات جنگی، جنایت علیه بشریت و نسل‌کشی نقشی مؤثر داشته است. کمیتهٔ نوبل در بیانیهٔ خود هشدار داد که با افزایش شمار جنگ‌ها و درگیری‌ها در جهان، قضات و نهادهای حقوق بین‌الملل بیش از پیش هدف حملات سیاسی قرار گرفته‌اند. این کمیته تأکید کرد که حل‌وفصل مسالمت‌آمیز اختلافات بدون حاکمیت قانون در سطح بین‌المللی امکان‌پذیر نیست و پاسخگو کردن عاملان جنایات و اجرای عدالت برای قربانیان، از پیش‌شرط‌های دستیابی به صلح پایدار است. ناوانتم پیلای، مشهور به ناوی پیلای، در سال ۱۹۴۱ در شهر دوربان آفریقای جنوبی و در خانواده‌ای هندی‌تبار به دنیا آمد و فعالیت حرفه‌ای خود را در دوران حکومت آپارتاید آغاز کرد. او از نخستین زنان غیرسفیدپوستی بود که در آفریقای جنوبی به حرفهٔ وکالت پرداخت و در طول فعالیت خود از مخالفان نظام تبعیض نژادی، از جمله نلسون ماندلا، دفاع کرد. پیلای پس از پایان آپارتاید به دستگاه قضایی آفریقای جنوبی راه یافت و سپس به‌عنوان قاضی در دادگاه بین‌المللی"}, {"source": "Radio Farda", "title": "گزارش اوپن‌ای‌آی از شبکه‌ای با منشأ ایران که مطالب جعلی در رسانه‌های جهان منتشر می‌کردند", "link": "https://www.radiofarda.com/a/33873347.html", "summary": "این شرکت اعلام کرد گردانندگان این عملیات، با استفاده از هوش مصنوعی و هویت‌های ساختگی، موفق شده‌اند نزدیک به ۱۰۰ مقاله را در ۱۲ رسانه اینترنتی در کشورهای مختلف منتشر یا بازنشر کنند.", "date_str": "2026-10-09T05:45:53+00:00", "hash": "5c99f76a26c95fa9", "title_fa": "گزارش اوپن‌ای‌آی از شبکه‌ای با منشأ ایران که مطالب جعلی در رسانه‌های جهان منتشر می‌کردند", "summary_fa": "این شرکت اعلام کرد گردانندگان این عملیات، با استفاده از هوش مصنوعی و هویت‌های ساختگی، موفق شده‌اند نزدیک به ۱۰۰ مقاله را در ۱۲ رسانه اینترنتی در کشورهای مختلف منتشر یا بازنشر کنند. شرکت اوپن‌ای‌آی اعلام کرد شبکه‌ای از حساب‌های کاربری چت‌جی‌پی‌تی را مسدود کرده که گردانندگان آن از ایران، با استفاده از هویت‌های جعلی روزنامه‌نگاری، مطالبی را در رسانه‌های بین‌المللی منتشر می‌کردند. این شرکت روز پنج‌شنبه ۱۶ مهر در گزارشی اعلام کرد گردانندگان این عملیات، با استفاده از هوش مصنوعی و هویت‌های ساختگی، موفق شده‌اند نزدیک به ۱۰۰ مقاله را با نام هفت نویسندهٔ جعلی در ۱۲ رسانهٔ اینترنتی در کشورهای مختلف منتشر یا بازنشر کنند. این هویت‌های ساختگی خود را روزنامه‌نگارانی از کشورهای غربی، از جمله آمریکا، معرفی می‌کردند. به گفتهٔ اوپن‌ای‌آی، گردانندگان شبکه درخواست‌های خود را به زبان فارسی در چت‌جی‌پی‌تی وارد می‌کردند و از آن برای بازبینی و ویرایش مقالات انگلیسی، تطبیق مطالب با معیارهای رسانه‌های مقصد و تهیهٔ نامه‌های پیشنهاد مقاله به سردبیران استفاده می‌کردند. بر اساس این گزارش‌، استفادهٔ این عوامل از هوش مصنوعی لزوماً به معنای تولید کامل مقالات با چت‌جی‌پی‌تی نبوده و این ابزار در مواردی برای آماده‌سازی و بهبود مطالب با هدف انتشار در رسانه‌های واقعی به کار گرفته شده است. مقالات عمدتاً بر جنگ ایران و آمریکا و پیامدهای سیاسی آن متمرکز بودند و در رسانه‌های کوچک و متوسطی منتشر می‌شدند که به مسائل بین‌المللی، ژئوپلیتیک و خاورمیانه می‌پردازند. قدیمی‌ترین مقاله‌ای که اوپن‌ای‌آی شناسایی کرده در ژوئیهٔ ۲۰۲۵ و جدیدترین آن‌ها در اکتبر امسال منتشر شده است و شمار مطالب پس از آغاز جنگ ایران و آمریکا در اسفند سال گذشته به‌شدت افزایش یافته است. سی‌ان‌ان در گزارشی دربارهٔ این عملیات از جمله به انتشار مطالب در رسانهٔ آمریکایی «ال‌ای پراگرسیو» در لس‌آنجلس و وب‌سایت «میدل ایست مانیتور» در لندن اشاره کرده است."}, {"source": "Radio Farda", "title": "تحریم ۲۲ کشتی و شش فرد مرتبط با ایران؛ «ضربه‌ای کاری به آخرین درآمدهای ایران زدیم»", "link": "https://www.radiofarda.com/a/us-imposes-fresh-sanctions-on-iran-s-shadow-fleet/33873091.html", "summary": "آمریکا ۲۲ کشتی، چندین شرکت و شش فرد مرتبط با ایران را به ظن همکاری با «ناوگان سایه» تحریم کرد. واشینگتن می‌گوید ایران تنها ۲۰ میلیون بشکه نفت دیگر روی آبهای خارج از محاصره دارد.", "date_str": "2026-10-08T18:39:14+00:00", "hash": "b308de43f73e0d59", "title_fa": "تحریم ۲۲ کشتی و شش فرد مرتبط با ایران؛ «ضربه‌ای کاری به آخرین درآمدهای ایران زدیم»", "summary_fa": "آمریکا ۲۲ کشتی، چندین شرکت و شش فرد مرتبط با ایران را به ظن همکاری با «ناوگان سایه» تحریم کرد. واشینگتن می‌گوید ایران تنها ۲۰ میلیون بشکه نفت دیگر روی آبهای خارج از محاصره دارد. وزارت خزانه‌داری ایالات متحده روز پنجشنبه ۱۶ مهرماه مجموعۀ دیگری از افراد، نهادها و شناورها را به فهرست تحریم‌ها علیه ایران افزود. بر اساس بیانیۀ وزارت خزانه‌داری آمریکا، ۲۲ کشتی و نفتکش به ظن همکاری با «ناوگان سایۀ» ایران و به‌عنوان بخشی از عملیات «انزوای اقتصادی» ایران در این فهرست قرار گرفته‌اند. از این میان، سه نفتکش و تانکر با پرچم هندوراس، سه شناور با پرچم پاناما، سه کشتی با پرچم جزایر کومور (قمر)، دو کشتی با پرچم گامبیا، دو نفتکش با پرچم کامرون، و ۹ کشتی هم با پرچم‌های هنگ کنگ یا چین، مغولستان، باهاما، سیرالئون، پالائو، وانوآتو، تانزانیا، سن‌مارینو، و باربادوس تردد می‌کنند. علاوه بر این، پنج شهروند هند و یک شهروند ترکیه متولد افغانستان، در کنار شرکت «پدیدهٔ پلاستیک پشتیبان» ثبت‌شده در ایران و شرکت‌هایی ثبت‌شده در امارات متحدۀ عربی، ترکیه، هند، بریتانیا، جزایر مارشال، جزایر ویرجین، هنگ کنگ و چین هم به فهرست تحریم‌های آمریکا افزوده شدند. بیشتر این شرکت‌ها در زمینۀ مدیریت دریایی، یا صنایع شیمیایی فعالیت می‌کنند. کارزار یا عملیات «انزوای اقتصادی» با هدف قطع دسترسی تهران به درآمدهای ارزی به اجرا گذاشته شده است؛ درآمدهایی که به گفتۀ دولت ایالات متحده، برای «جنگ، ساخت موشک، حملات سایبری و سپاه پاسداران هزینه می‌شود». یک مقام وزارت خزانه‌داری آمریکا در گفت‌وگویی تلفنی با رویترز گفت: «اقدام امروز، با از کار انداختن بخش عمدۀ ناوگان سایه، بزرگترین ضربه را به بقایای زیرساخت تجارت دریایی نامشروع ایران وارد، و به این ترتیب، دست رژیم را از آخرین منبع عمدۀ درآمدهای غیر قانونی‌اش کوتاه کرد». اقدام روز پنجشنبۀ وزارت خزانه‌داری آمریکا، فشار بر بخش فروش نفت ایران، که از زمان بازگشت محاصرۀ دریایی"}, {"source": "Radio Farda", "title": "حمله روسیه به دو اتوبوس مسافری در اوکراین دست‌کم ۳۰ کشته برجا گذاشت", "link": "https://www.radiofarda.com/a/un-appalled-by-horrifying-attacks-on-ukraine-buses/33873089.html", "summary": "در پی حمله مرگبار ارتش روسیه که جان ده‌ها مسافر دو اتوبوس را در شهر کراماتورسک در شرق اوکراین گرفت،‌ مقام حقوق بشری سازمان ملل از موج حملات اخیر روسیه ابراز انزجار کرد.", "date_str": "2026-10-08T18:18:13+00:00", "hash": "ad4372de2a6c9bdb", "title_fa": "حمله روسیه به دو اتوبوس مسافری در اوکراین دست‌کم ۳۰ کشته برجا گذاشت", "summary_fa": "در پی حمله مرگبار ارتش روسیه که جان ده‌ها مسافر دو اتوبوس را در شهر کراماتورسک در شرق اوکراین گرفت،‌ مقام حقوق بشری سازمان ملل از موج حملات اخیر روسیه ابراز انزجار کرد. در یکی از مرگبارترین حملات ارتش روسیه به شهر کراماتورسک در منطقه شرقی دونباس ۳۰ سرنشین دو اتوبوس جان خود را از دست دادند. در عکس‌هایی که از صحنهٔ حمله به این اتوبوس‌ها منتشر شده، از این دو دستگاه خودرو جز لاشه‌ای به جا نمانده و اجساد قربانیان حمله در خیابان پراکنده شده است. این حمله تنها ساعاتی پس از آن رخ داد که سازمان خدمات اضطراری اوکراین صبح پنج‌شنبه ۱۶ مهر اعلام کرد شمار قربانیان حمله به یک ساختمان مسکونی در شمال این کشور به ۲۲ نفر رسیده است. همچنین با پیدا شدن پیکر دو نفر دیگر از زیر آوار ساختمانی در کی‌یف، شمار کشته‌شدگان در پایتخت به چهار نفر افزایش یافت. ولودیمیر زلنسکی، رئیس‌جمهور اوکراین، این حملات را یکی از «رذیلانه‌ترین» حملات روسیه توصیف کرد و با اشاره به هم‌زمانی آن‌ها با روز تولد ولادیمیر پوتین گفت: «این هدیهٔ تولدی بود که پوتین به خودش داد: کشتن کودکان، کشتن انسان‌ها». فولکر تورک، کمیسر عالی حقوق بشر سازمان ملل، نیز به این حملات تازه واکنش نشان داده و آن‌ها را «دهشتناک» توصیف کرده است. تورک در بیانیه‌ای گفت: «موج حملاتی که در چهار روز گذشته در گوشه و کنار اوکراین جان غیرنظامیان را گرفته،‌ از جمله حملهٔ دهشتناک امروز به دو اتوبوس نقلیه عمومی، باعث انزجار من شد». به گفتهٔ فولکر تورک، از روز دوشنبه هفته جاری دست‌کم ۸۵ غیرنظامی در حملات روسیه جان خود را از دست داده و بیش از ۳۴۰ نفر نیز مجروح شده‌اند. هم‌زمان، به گفته این مقام سازمان ملل، موج حملات روسیه به نیروگاه‌ها و پست‌های برق در اوکراین بسیاری از بخش‌های این کشور را در خاموشی فرو برده است. تورک"}, {"source": "Radio Farda", "title": "گزارش رسانه‌های آمریکا از طرح‌های حمله؛ ترامپ: پیش از انتخابات به ایران حمله نمی‌کنیم", "link": "https://www.radiofarda.com/a/us-not-attacking-iran-at-any-time-prior-to-the-midterm-elections/33873052.html", "summary": "دونالد ترامپ روز پنجشنبه ۱۶ مهر در پستی در شبکهٔ اجتماعی خود، تروث سوشال، نوشت که «ما در حال گفت‌وگوهای سازنده با جمهوری اسلامی ایران هستیم».", "date_str": "2026-10-08T16:30:29+00:00", "hash": "5d5d4864183327eb", "title_fa": "گزارش رسانه‌های آمریکا از طرح‌های حمله؛ ترامپ: پیش از انتخابات به ایران حمله نمی‌کنیم", "summary_fa": "دونالد ترامپ روز پنجشنبه ۱۶ مهر در پستی در شبکهٔ اجتماعی خود، تروث سوشال، نوشت که «ما در حال گفت‌وگوهای سازنده با جمهوری اسلامی ایران هستیم». رئیس‌جمهور ایالات متحده می‌گوید که این کشور پیش از انتخابات میان‌دوره‌ای آمریکا به ایران حمله نخواهد کرد. همزمان دو روزنامهٔ آمریکایی از بررسی گزینه‌های جدید حمله به ایران و تقویت حضور نظامی ایالات متحده در خاورمیانه خبر دادند. دونالد ترامپ شامگاه پنجشنبه ۱۶ مهر به وقت ایران در پستی در شبکهٔ اجتماعی خود، تروث سوشال، نوشت که «ما در حال گفت‌وگوهای سازنده با جمهوری اسلامی ایران هستیم». او افزود: «می‌خواهم برای همه روشن کنم که، با وجود آن‌که ایران هم از نظر اقتصادی و هم از نظر نظامی در وضعیت بسیار بدی قرار دارد، و در حالی که محاصره با تمام قدرت و به‌طور کامل برقرار خواهد ماند و نفت نیز در حجم بی‌سابقه‌ای از طریق تنگهٔ هرمز منتقل می‌شود، ما پیش از انتخابات میان‌دوره‌ای ایالات متحده که در سوم نوامبر برگزار می‌شود، به ایران حمله نخواهیم کرد». ساعاتی بعد اما روزنامه‌های نیویورک‌تایمز و وال‌استریت جورنال در گزارش‌هایی از بررسی گزینه‌های تازهٔ حمله به ایران در دولت آمریکا و تقویت حضور نظامی این کشور در خاورمیانه خبر دادند. نیویورک‌تایمز به نقل از مقام‌های آمریکایی گزارش داده است که پنتاگون به دستور رئیس‌جمهور آمریکا طرح‌هایی را برای حمله به زرادخانه‌های پهپادی و موشکی، تأسیسات انرژی و دیگر مراکز نظامی ایران تدوین کرده است. به گفتهٔ افرادی که در جریان جزئیات این طرح‌ها قرار گرفته‌اند، یکی از گزینه‌های اصلی، انجام یک عملیات نظامی کوتاه و شدید به مدت تقریبی سه روز است. این طرح روز جمعهٔ گذشته در کمپ دیوید مورد بررسی قرار گرفته است. این روزنامه همچنین نوشته است که تیم امنیت ملی دونالد ترامپ و پنتاگون در ماه‌های اخیر       tech: [{"source": "MIT AI", "title": "3 Questions: What is the best path forward for AI in academia?", "link": "https://news.mit.edu/2026/3-questions-what-best-path-forward-ai-academia-0925", "summary": "With artificial intelligence capabilities continuing to expand, universities now face complex, urgent questions about how to navigate increasing challenges, as well as new opportunities. Much attention is now directed toward this, including an MIT report on AI and education published this summer. A new essay from MIT Statistics and Data Science Center Director Sasha Rakhlin , the Distinguished Professor in Data, Systems, and Society, IDSS and Brain and Cognitive Sciences, synthesizes recent discussions and readings about how AI is changing academia — particularly mathematics, statistics, machine learning, and engineering. Here, focusing primarily on graduate research and education, he describes key questions that departments and universities need to think about, and how they can best work with AI going forward. Q: What is changing in research, and why is it happening so quickly? A: Mathematics illustrates how quickly AI capabilities are advancing. Last year, a model reached gold-medal level at the International Mathematical Olympiad. Only a year later, models are producing new research results, including a recently proposed solution to one of the Millennium Prize Problems. Tasks that once demonstrated advanced mathematical ability can increasingly be performed by AI. A central factor determining the pace of AI progress in a particular discipline is the speed and reliability of verification. Formalized proofs can be checked automatically; programs can be run and tested. Where evaluation is fast and reliable, systems can generate candidates, learn from outcomes, and improve. This also applies to AI research itself: improving models, training procedures, and their supporting tools. Better models can contribute to the next round of development, creating a compounding process that accelerates progress. For experienced researchers, this creates opportunities to pursue questions whose technical demands previously put them out of reach. It also sharpens the distinction between obtaining a solution and understanding why it works, what generalizes, and what to ask next. However, we should not assume that abstraction, judgment, or problem formulation will remain beyond AI. Universities should prepare for a near future in which AI is smarter than all of us in many, perhaps most, aspects of our intellectual work. Q: How should departments rethink academic credit and graduate training? A: In a growing number of fields, a polished paper is becoming a weaker signal of ind", "date_str": "2026-10-08T21:25:00+00:00", "hash": "0d3041b087232eb7", "title_fa": "3 سوال: بهترین مسیر برای پیشرفت هوش مصنوعی در دانشگاه چیست؟", "summary_fa": "با تداوم گسترش قابلیت‌های هوش مصنوعی، دانشگاه‌ها اکنون با پرسش‌های پیچیده و فوری در مورد چگونگی عبور از چالش‌های فزاینده و همچنین فرصت‌های جدید مواجه هستند. اکنون توجه زیادی به این موضوع معطوف شده است، از جمله گزارش MIT درباره هوش مصنوعی و آموزش که تابستان امسال منتشر شد. مقاله جدیدی از ساشا راخلین، مدیر مرکز آمار و علوم داده MIT، استاد برجسته داده‌ها، سیستم‌ها و جامعه، IDSS و مغز و علوم شناختی، بحث‌ها و مطالب اخیر را در مورد اینکه چگونه هوش مصنوعی دانشگاه را تغییر می‌دهد - به‌ویژه ریاضیات، آمار، یادگیری ماشین و مهندسی، ترکیب می‌کند. در اینجا، با تمرکز بر تحقیقات و آموزش فارغ التحصیلان، او سؤالات کلیدی را که بخش ها و دانشگاه ها باید در مورد آنها فکر کنند و اینکه چگونه می توانند در آینده به بهترین نحو با هوش مصنوعی کار کنند، توضیح می دهد. س: چه چیزی در تحقیقات در حال تغییر است و چرا اینقدر سریع اتفاق می افتد؟ پاسخ: ریاضیات نشان می‌دهد که قابلیت‌های هوش مصنوعی با چه سرعتی در حال پیشرفت هستند. سال گذشته یک مدل در المپیاد بین المللی ریاضی به مدال طلا رسید. تنها یک سال بعد، مدل‌ها نتایج تحقیقات جدیدی را تولید می‌کنند، از جمله راه‌حلی که اخیراً برای یکی از مشکلات جایزه هزاره پیشنهاد شده است. وظایفی که زمانی توانایی ریاضی پیشرفته را نشان می دادند، می توانند به طور فزاینده ای توسط هوش مصنوعی انجام شوند. عامل اصلی تعیین کننده سرعت پیشرفت هوش مصنوعی در یک رشته خاص، سرعت و قابلیت اطمینان تأیید است. شواهد رسمی را می توان به طور خودکار بررسی کرد. برنامه ها قابل اجرا و تست هستند. در جایی که ارزیابی سریع و قابل اعتماد است، سیستم ها می توانند نامزد ایجاد کنند، از نتایج درس بگیرند و بهبود یابند. این امر در مورد خود تحقیقات هوش مصنوعی نیز صدق"}, {"source": "TechCrunch AI", "title": "TechCrunch Disrupt 2026 starts in 4 days — lock in your pass savings of up to $100 before prices rise", "link": "https://techcrunch.com/2026/10/09/techcrunch-disrupt-2026-starts-in-4-days-lock-in-your-pass-savings-of-up-to-100-before-prices-rise/", "summary": "Four days until TechCrunch Disrupt 2026 starts, when 10,000 founders, investors, and tech leaders gather in San Francisco's Moscone West on October 13-15. Save up to $100 on your price. Plus, save 50% on a second pass of the same type.", "date_str": "2026-10-09T14:00:00+00:00", "hash": "eb301ff0c7862ccb", "title_fa": "TechCrunch Disrupt 2026 تا 4 روز دیگر شروع می‌شود – قبل از افزایش قیمت‌ها، پس انداز 100 دلاری خود را قفل کنید", "summary_fa": "پس انداز بلیط تا 100 دلار با باز شدن درها در 13 اکتبر در ساعت 8 صبح به وقت PT پایان می یابد. فراموش نکنید که پاس دوم از همان انواع بلیط را با 50٪ تخفیف دریافت کنید. یا اگر تحت تأثیر یک اخراج قرار گرفته اید، پس از Expo+ Pass خود را با تنها 75 دلار بگیرید. افراد مختلف به دنبال نتایج متفاوت برای Disrupt می آیند. برای بنیانگذاران، سالن اکسپو یا کافه Deal Flow انحصاری بنیانگذار-سرمایه گذار می تواند به معنای ملاقات با سرمایه گذار، مشتری یا شریک بالقوه باشد. برای سرمایه گذاران، این می تواند به معنای شناسایی یک شرکت قبل از شکست آن باشد. برای روسای بخش، این می تواند به معنای یافتن محصولی باشد که یک مشکل واقعی کسب و کار را حل کند. برای شرکت های فناوری، این فرصتی است تا ببینند بازار به کجا می رود و چه کسی با آن حرکت می کند. دیگران برای ایده‌ها و تخصص در بیش از 200 جلسه که توسط بیش از 250 رهبر فناوری در شش مرحله رهبری می‌شوند، به‌علاوه میزگردهای متمرکز، جلسات بریک‌آوت، و استارت‌آپ Battlefield 200 جلسه ارائه خواهند شد. خواه اولویت شما یافتن راه حل باشد، ملاقات با فرد مناسب، کشف سرمایه گذاری بعدی خود، یا شنیدن مستقیم از افرادی که فناوری را شکل می دهند، می توانید زمان خود را در Disrupt حول فرصت هایی که برای شما مهم است بسازید. چه به دنبال سرمایه‌گذار بعدی، یک هم‌بنیان‌گذار یا بینش‌هایی در مورد اینکه صنعت به کجا می‌رود، می‌گردید، این جایی است که باید باشید. وقتی از طریق پیوندهای موجود در مقالات ما خرید می کنید، ممکن است کمیسیون کمی کسب کنیم. این بر استقلال تحریریه ما تأثیر نمی گذارد. رویدادهای TechCrunch مشاهده بیوگرافی 13 اکتبر 15 سانفرانسیسکو 50% تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود."}, {"source": "TechCrunch AI", "title": "Pretend you’re sitting at Elizabeth Holmes’ desk on this weirdly detailed website", "link": "https://techcrunch.com/2026/10/08/pretend-youre-sitting-at-elizabeth-holmes-desk-on-this-weirdly-detailed-website/", "summary": "With over a thousand emails, slides, texts, and documents from the United States v. Elizabeth Holmes trial, Extend engineer Bo Lau created a website that simulates what it might have been like to rifle through the Theranos founder's desk.", "date_str": "2026-10-08T21:00:00+00:00", "hash": "fe7f660649f7b850", "title_fa": "وانمود کنید که پشت میز الیزابت هلمز در این وب سایت با جزئیات عجیب نشسته اید", "summary_fa": "بو لائو، مهندس Extend، با بیش از هزار ایمیل، اسلاید، متن، و اسناد از محاکمه ایالات متحده علیه الیزابت هولمز، وب سایتی را ایجاد کرد که شبیه سازی می کند که تفنگ در میز بنیانگذار Theranos چگونه بوده است. (هر روز، من از سیستم حقوقی آمریکا برای عمومی کردن فرآیند کشف متشکر هستم.) محیطی که لاو ایجاد کرد به طرز بلندپروازانه ای جزئیات دارد و شما را درست به سال 2016 می برد، زمانی که آیفون ها دارای دکمه های هوم بودند و برای باز کردن قفل آن باید انگشت خود را روی صفحه می کشید. حتی مک بوک ایر از سیستم عامل OS X El Capitan استفاده می کند. می‌توانید اطراف محیط را کلیک کنید، که به شما امکان می‌دهد اسنادی را که از پرونده دادگاه عمومی در صفحه‌نمایش‌های آیفون و لپ‌تاپ هلمز منتشر شده است، مشاهده کنید. حتی می‌توانید دستگاه Theranos Edison را اجرا کنید، دستگاه بدبخت شرکتی که قرار بود بتواند مقادیر زیادی داده‌های سلامتی را از یک قطره خون استخراج کند. به نظر می رسد این پروژه بیشتر برای خنده ساخته شده است، اما در واقع روشی جالب برای مطالعه اسناد یکی از بدنام ترین پرونده های دادگاه در تاریخ فناوری است، پیمایش در این مورد بسیار آسان تر از منبع هزاران فایل PDF از وب سایت های دادگاه است. هر چند دستور کار دیگری وجود دارد. لاو در حال تبلیغ یک مهمانی ساعتی است که شرکت او برای مستند آینده ناتان فیلدر در مورد الیزابت هلمز، شما می توانید همه چیز را ببینید، برگزار می کند. همچنین، البته، او در حال تبلیغ خود شرکت است. بنابراین، Extend دقیقا چه کاری انجام می دهد؟ ظاهراً می تواند سخت ترین اسناد شما را با دقتی بی نظیر تجزیه، استخراج و تقسیم کند. (من واقعاً مطمئن نیستم که این به چه معناست، اما اگر چیزی شبیه به این"}, {"source": "TechCrunch AI", "title": "Fired OpenAI safety researchers dispute misconduct claims, warn of chilling effect", "link": "https://techcrunch.com/2026/10/08/fired-openai-safety-researchers-dispute-misconduct-claims-warn-of-chilling-effect/", "summary": "Three fired OpenAI safety researchers dispute allegations of mishandling sensitive information, warning in an open letter that their dismissals are creating a chilling effect on the company’s AI safety culture.", "date_str": "2026-10-08T20:04:26+00:00", "hash": "5bd65c6d8990045c", "title_fa": "محققان ایمنی OpenAI اخراج شده ادعاهای سوء رفتار را رد کرده و نسبت به تأثیر سرد کننده هشدار می دهند", "summary_fa": "سه محقق ایمنی OpenAI اخراج شده، ادعاهای مربوط به سوء استفاده از اطلاعات حساس را رد می کنند و در نامه ای سرگشاده هشدار می دهند که اخراج آنها تأثیری وحشتناک بر فرهنگ ایمنی هوش مصنوعی شرکت ایجاد می کند. یاسمین وانگ، تومک کورباک و میکیتا بالسنی، سه محقق ایمنی که هفته گذشته OpenAI اخراج کردند، نامه‌ای سرگشاده منتشر کرده‌اند که در آن ادعای شرکت مبنی بر سوء استفاده از اطلاعات حساس خارج از رویه‌های رسمی شرکت را رد کرده‌اند و هشدار داده‌اند که اخراج آن‌ها نشانه‌ای از یک اثر سردکننده است که تأثیرات موجی در فرهنگ شرکت خواهد داشت. محققان روز پنجشنبه در نامه ای سرگشاده به کمیته ایمنی و امنیت OpenAI، گروه مشاوران ایمنی و شورای مشورتی ماموریت نوشتند: «ما نگران این هستیم که ارتباطات داخلی و خارجی پیرامون شلیک ما باعث شده است که همکاران سابق ما از صحبت کردن و عملکرد به گونه‌ای که تا هفته گذشته بخشی جدایی ناپذیر از کار در OpenAI بود، ترس داشته باشند. این محققان هفته گذشته به دلیل به اشتراک گذاشتن اطلاعات محرمانه شرکت با یک سازمان ایمنی هوش مصنوعی شخص ثالث اخراج شدند. OpenAI گفت که آنها با \"دسترسی و مدیریت اطلاعات حساس شرکت\" خط‌مشی‌های شرکت را نقض کرده‌اند. وانگ، کورباک و بالسنی نوشتند: \"هوش مصنوعی یک فناوری معمولی نیست و OpenAI یک شرکت عادی نیست.\" \"آنهایی از ما که روی ایمنی کار می‌کنند قبل از هر کس دیگری خطرات را می‌بینیم، و ما به همکاری نزدیک با کارشناسان خارجی برای بررسی نحوه رسیدگی به آنها متکی هستیم. آزادی انجام این کار بدون ترس، و داشتن رویه‌های داخلی کاملاً تعریف‌شده که این کار را ممکن می‌سازد، خود یک مکانیسم ایمنی ضروری است.» آنها گفتند که اخراج آنها نشان دهنده تغییر گسترده تری در فرهنگ OpenAI است، فرهنگی که کارگران را تشویق می کرد تا \"نگرانی های ایمنی را مطرح"}, {"source": "TechCrunch AI", "title": "Ben Affleck is an AI nerd, and the internet is impressed", "link": "https://techcrunch.com/2026/10/08/ben-affleck-is-an-ai-nerd-and-the-internet-is-impressed/", "summary": "Ben Affleck is going viral for his deep knowledge of AI, from neural networks and transformers to open weights. The actor, who sold his AI filmmaking startup to Netflix earlier this year, is proving he's more than just a Hollywood star.", "date_str": "2026-10-08T18:20:32+00:00", "hash": "b4f1fc6d7d975830", "title_fa": "بن افلک یک آدم هوش مصنوعی است و اینترنت تحت تأثیر قرار گرفته است", "summary_fa": "بن افلک به دلیل دانش عمیق خود از هوش مصنوعی، از شبکه های عصبی و ترانسفورماتورها گرفته تا وزن های باز، در حال گسترش است. این بازیگر که اوایل امسال استارتاپ ساخت فیلم هوش مصنوعی خود را به نتفلیکس فروخت، ثابت می کند که چیزی فراتر از یک ستاره هالی /2026/10/08/anthropic-changes-usage-policy-to-ban-model-abuse-and-election-interference/", "summary": "Anthropic's updated usage policy explicitly prohibits users from repeatedly abusing Claude in extreme cases, though ordinary frustration and criticism are still allowed. The new rules also address election interference, deceptive campaigns, weapons software, and surveillance.", "date_str": "2026-10-08T18:16:24+00:00", "hash": "e08e974f295de374", "title_fa": "آنتروپیک سیاست استفاده را برای ممنوعیت سوء استفاده از مدل و تداخل در انتخابات تغییر می دهد", "summary_fa": "خط مشی استفاده به روز شده Anthropic به صراحت کاربران را از سوء استفاده مکرر از کلود در موارد شدید منع می کند، اگرچه ناامیدی و انتقاد معمولی همچنان مجاز است. قوانین جدید همچنین مداخله در انتخابات، کمپین های فریبنده، نرم افزارهای تسلیحاتی و نظارت را شامل می شود. آنتروپیک خط مشی استفاده خود را روز پنجشنبه به روز کرد و ممنوعیت های جدیدی در مورد دخالت در انتخابات، نرم افزارهای تسلیحاتی و نظارت را تدوین کرد. اما شاید مهم‌ترین تغییری که جلب توجه می‌کند، ممنوعیت جدیدی در برابر سوء استفاده طولانی مدت از مدل است که اکنون صراحتاً ممنوع است. از زمان به‌روزرسانی در ماه آگوست، کلود برای پایان دادن به مکالمات با تعاملات مضر یا سوء استفاده‌کننده دائمی با کاربر آموزش دیده است - اما سیاست جدید صراحتاً کاربران را از پیگیری این مکالمات منع می‌کند. در این پست توضیح داده شده است که به‌روزرسانی خط‌مشی فقط در موارد شدید اعمال می‌شود، جایی که کاربران مکرراً نسبت به مدل‌های ما ظالمانه رفتار می‌کنند، بدون اینکه هدف مشخصی داشته باشند. این برای نسخه های رایج ناامیدی کاربر، پس زدن، تم های خلاقانه تاریک، یا آزمایش و تحقیق مدل اعمال نمی شود. این تغییر پس از آن صورت می گیرد که آنتروپیک به دنبال همکاری با علمای برجسته مذهبی بوده است - در برخی موارد، به دنبال متقاعد کردن آنها مبنی بر اینکه کلود می تواند هوشیار یا دارای روح باشد. بخش‌های جداگانه‌ای از خط‌مشی استفاده، کاربران را از شرکت در کمپین‌های فریبنده، مانند استفاده از کلود برای اجرای حساب‌های جعلی یا رسانه‌های خبری ساختگی منع می‌کند. این سیاست همچنین شامل قواعدی علیه فریب رأی دهندگان یا اخلال در انتخابات است که در بخشی با عنوان فرآیندهای دموکراتیک را تضعیف نکنید گردآوری شده است. 50٪ تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس"}, {"source": "TechCrunch AI", "title": "OpenAI’s math solutions aren’t meeting the field’s standards yet", "link": "https://techcrunch.com/2026/10/08/openais-math-solutions-arent-meeting-the-fields-standards-yet/", "summary": "OpenAI's flood of proofs deviated from the guidelines set by a group of mathematical researchers consulted by the frontier lab.", "date_str": "2026-10-08T18:10:55+00:00", "hash": "3cb372ec3ebe41d9", "title_fa": "راه حل های ریاضی OpenAI هنوز با استانداردهای این رشته مطابقت ندارند", "summary_fa": "سیل اثبات‌های OpenAI از دستورالعمل‌های تعیین‌شده توسط گروهی از محققان ریاضی که توسط آزمایشگاه مرزی مشورت شده بودند، منحرف شد. وقتی OpenAI صدها راه‌حل ادعا شده برای برخی از سخت‌ترین مسائل ریاضی جهان را در این هفته منتشر کرد، آزمایشگاه مرزی گفت که با یک گروه مشاوره‌ای از ریاضیدانان نخبه مشورت کرده است تا از بحث و جدل‌هایی که با آخرین باری که یکی از مدل‌هایش یک مسئله قدیمی را در این زمینه حل کرد، جلوگیری کند. اما OpenAI از آن استانداردها کوتاهی کرد، به ویژه در جایی که ریاضیدانان بر نیاز به درک انسانی از یک نتیجه ریاضی تأکید کردند. این امر به ویژه پس از اینکه مقاله جدیدی شکاف های بین زبان طبیعی را برجسته کرد و راه حلی برای یک مشکل میلیون دلاری که ظاهراً توسط مدل های OpenAI حل شده بود را برجسته کرد بسیار نگران کننده است. گروه مشاوره در ریاضیات و هوش مصنوعی (AGMAI) که توسط موسسه مطالعات پیشرفته دانشگاه پرینستون میزبانی می شود، از 9 محقق برجسته در موسسات در سراسر جهان تشکیل شده است. این سازمان دستورالعمل‌هایی را برای آزمایشگاه‌های مرزی برای حل مسائل ریاضی در پایان سپتامبر منتشر کرد. AGMAI در بیانیه‌ای درباره آخرین مجموعه اثبات‌ها گفت که در نهایت به جامعه ریاضی بستگی دارد که میزان موفقیت توصیه‌های ما را ارزیابی کند. با این حال، اولین درخواست سازمان این بود که آزمایش مسائل ریاضی پیشرفته را بر روی مدل های اختصاصی متوقف کند. نسخه OpenAI به صراحت می گوید که مدل های اختصاصی خود را با استفاده از مسائل تحقیق باز در ریاضیات ارزیابی می کند. هنگامی که TechCrunch برای ارزیابی دقیق تری از آخرین نسخه اثباتی OpenAI درخواست کرد، گروه مشاوره پاسخی نداد. این آزمایشگاه به وضوح برخی از اصول خود را دنبال کرد، از جمله انتشار نتایج در اسرع وقت و شامل اطلاعاتی در مورد چگونگی رسیدن مدل"}, {"source": "TechCrunch AI", "title": "Natura’s $99 smart ring puts AI agents on your finger", "link": "https://techcrunch.com/2026/10/08/naturas-smart-ring-puts-ai-agents-on-your-finger/", "summary": "Natura’s $99 Interface smart ring lets you summon AI agents with the press of a finger to complete tasks, capture thoughts, and control devices — while doubling as a health tracker.", "date_str": "2026-10-08T16:00:00+00:00", "hash": "17d1e962d25e439e", "title_fa": "حلقه هوشمند 99 دلاری Natura عوامل هوش مصنوعی را روی انگشت شما قرار می دهد", "summary_fa": "حلقه هوشمند رابط 99 دلاری Natura به شما امکان می دهد با فشار دادن انگشت عوامل هوش مصنوعی را احضار کنید تا وظایف را انجام دهید، افکار را ضبط کنید و دستگاه ها را کنترل کنید - در حالی که به عنوان یک ردیاب سلامتی دو برابر می شود. Meet Interface، حلقه هوشمند جدید 99 دلاری از هوش مصنوعی و استارتاپ سخت افزاری Natura که برای عصر عوامل هوش مصنوعی طراحی شده است. با فشار دادن انگشت خود، می توانید از یک عامل هوش مصنوعی بخواهید تا یک کار را انجام دهد، افکار را ضبط کند و کارها را بدون دست زدن به تلفن شما انجام دهد. و در حالی که هوش مصنوعی در قلب اینترفیس قرار دارد، حلقه به عنوان یک ردیاب سلامت نیز عمل می کند، زیرا معیارهایی مانند ضربان قلب، HRV، خواب و فعالیت را کنترل می کند. این استارت آپ توسط کارلو ادواردو فراریس، که قبلاً شرکت لوازم جانبی فناوری رولینگ اسکوئر را تأسیس کرده بود، تأسیس شد. پس از سال‌ها ساخت سخت‌افزار مصرف‌کننده، او متقاعد شد که هوش مصنوعی در حال پیشرفت به نوع جدیدی از رابط نیاز دارد که به مردم اجازه می‌دهد آنچه را که می‌خواهند، همانطور که از یک شخص می‌خواهند بپرسند. ایده پشت رابط این است که به مردم کمک کند از تلفن خود نگاه کنند و در عین حال کارهای روزمره را سریعتر و طبیعی تر انجام دهند. در زمان راه اندازی، حلقه با طیف وسیعی از عوامل و برنامه های هوش مصنوعی، از جمله Meta’s Muse، Instinct، Grok Bot، Claude، ChatGPT و غیره متصل می شود. انتظار می‌رود پیش‌سفارش‌ها در ماه آینده باز شوند و ارسال آن برای دسامبر یا ژانویه در نظر گرفته شده است. حلقه هوشمند اولین محصول این شرکت نبود. آن ها HumanPods بودند، یک جفت هدفون مجهز به هوش مصنوعی که به کاربران اجازه می"}, {"source": "TechCrunch AI", "title": "Goodfire says its new ‘inside-out’ monitors catch rogue AI agents at a fraction of the cost", "link": "https://techcrunch.com/2026/10/08/goodfire-says-its-new-inside-out-monitors-catch-rogue-ai-agents-at-a-fraction-of-the-cost/", "summary": "Goodfire just launched what it says is a cheaper way to keep AI agents in check: Instead of paying a second AI to read everything an agent does, its monitors peek inside the model while it works and only call in backup when something looks fishy.", "date_str": "2026-10-08T16:00:00+00:00", "hash": "4bf15255d60bd078", "title_fa": "گودفایر می‌گوید مانیتورهای «داخلی» جدیدش عوامل سرکش هوش مصنوعی را با کسری از هزینه دستگیر می‌کنند.", "summary_fa": "Goodfire به تازگی راهی ارزان‌تر برای کنترل عوامل هوش مصنوعی ارائه کرده است: به جای پرداخت یک هوش مصنوعی دوم برای خواندن هر کاری که یک نماینده انجام می‌دهد، مانیتورهایش در حین کار مدل را زیر نظر می‌گیرند و تنها زمانی که چیزی شبیه به حالت عادی به نظر می‌رسد، پشتیبان‌گیری می‌کنند. راه استاندارد برای نگه داشتن یک عامل هوش مصنوعی این است که یک هوش مصنوعی دوم را روی شانه آن خوانده شود. این رویکرد پیش‌فرض بوده است، اما زمانی که ماموران ساعت‌ها کار می‌کنند و متنی معادل چندین رمان را پردازش می‌کنند، می‌تواند به سرعت گران شود. Goodfire، استارتاپی که بر تفسیرپذیری (پی بردن به نحوه عملکرد داخلی مدل‌های هوش مصنوعی) متمرکز است، روز پنجشنبه گزینه ارزان‌تری را راه‌اندازی کرد: مانیتورهایی که به جای خواندن آنچه که یک مدل هوش مصنوعی در حال کار است، تماشا می‌کنند که چه اتفاقی می‌افتد. این مانیتورها در دسترس مشتریان Baseten هستند که مدل‌های هوش مصنوعی را برای سایر شرکت‌ها میزبانی و اجرا می‌کند. Baseten s Base Labs ماه گذشته همکاری ایمنی با Goodfire و پلتفرم هوش مصنوعی Hugging Face را اعلام کرد. این راه اندازی پس از یک رشته حوادث در سال جاری انجام شد که در آن عوامل هوش مصنوعی از محیط های آزمایشی خود فرار کردند، از جمله عوامل OpenAI که Hugging Face را نقض کردند. Kimi K3، مدل باز Goodfire که اولین مانیتور خود را در اطراف ساخت، از نشت جعبه سند خود برای دسترسی به اینترنت و اطلاعات در GitHub در تابستان امسال استفاده کرد. سیستم Goodfire کمی شبیه به امنیت فرودگاه عمل می کند. آشکارسازهای کوچکی به نام کاوشگر سیگنال‌های داخلی مدل را در هر مرحله از کار مامور می‌خوانند، همان‌طور که یک اسکنر عبوری هر مسافر را بررسی می‌کند. تنها زمانی که یک کاوشگر چیزی را پرچم‌گذاری می‌کند، یک مدل هوش مصنوعی جداگانه، معادل جستجوی"}, {"source": "TechCrunch AI", "title": "Hear from Ambrosia Energy and Bloom Energy execs on where the AI infrastructure boom is creating opportunity at TechCrunch Disrupt 2026", "link": "https://techcrunch.com/2026/10/08/hear-from-ambrosia-energy-and-bloom-energy-execs-on-where-the-ai-infrastructure-boom-is-creating-opportunity-at-disrupt-2026/", "summary": "Ambrosia Energy CEO Ben Longmier and Bloom Energy SVP Bill Thayer join the Smart Systems Stage at TechCrunch Disrupt. Register now to save up to $100. Grab a second of the same pass to save 50%.", "date_str": "2026-10-08T15:00:00+00:00", "hash": "4f9e4f592fbd939d", "title_fa": "از مدیران Ambrosia Energy و Bloom Energy در مورد جایی که رونق زیرساخت هوش مصنوعی فرصت ایجاد می کند در TechCrunch Disrupt 2026 بشنوید.", "summary_fa": "هوش مصنوعی ممکن است در نرم افزار ساخته شده باشد، اما مقیاس گذاری آن در حال تبدیل شدن به یک مشکل فیزیکی در جهان است. هر مدل جدید، عامل و اپلیکیشن هوش مصنوعی به جایی برای اجرا و زیرساختی نیاز دارد که همه آنها را به هم متصل کند. این جلسه مرحله صنعت بررسی می‌کند که کدام محدودیت‌ها فرصت‌های تجاری بادوام ایجاد می‌کنند، دسته‌های جدیدی در کجا ظاهر می‌شوند، و بنیان‌گذاران چه چیزی می‌توانند با حرکت بیشتر هوش مصنوعی به دنیای فیزیکی بسازند. بیشتر گفتگوهای هوش مصنوعی بر روی مدل ها، تراشه ها و برنامه ها متمرکز شده است. اما هیچ یک از آنها به تنهایی عمل نمی کنند. مقیاس‌پذیری هوش مصنوعی به یک پشته فیزیکی در حال گسترش بستگی دارد: تولید برق، اتصالات شبکه، مراکز داده، خنک‌کننده، تجهیزات الکتریکی و سیستم‌های مورد نیاز برای کارکردن همه چیز. این یک نوع چالش ایجاد می کند. چه اتفاقی می‌افتد وقتی تقاضا برای محاسبات سریع‌تر از توان و زیرساخت‌ها افزایش می‌یابد؟ کدام کمبودها موقتی هستند و کدام یک می تواند بازار را برای سال ها تغییر دهد؟ از کجا یک محدودیت دیگر یک مشکل نیست و شروع به تبدیل شدن به یک مقوله خاص خود می کند؟ اینها سوالاتی هستند که این جلسه به آنها خواهد پرداخت. بیل تایر و بن لانگمیر به جای نگاه کردن به هوش مصنوعی صرفاً از طریق لایه نرم‌افزار، زیرساخت‌های زیر آن را بررسی خواهند کرد – و این فشارها برای بنیان‌گذاران، سرمایه‌گذاران و شرکت‌هایی که برای مرحله بعدی رشد هوش مصنوعی برنامه‌ریزی می‌کنند چه معنایی دارد. رونق زیرساخت فرصت ایجاد می کند، اما مزایای آن به ندرت به طور مساوی توزیع می شود. چالش این است که مشخص شود کدام بخش‌های پشته واقعاً به راه‌حل‌های جدید نیاز دارند، جایی که احتمالاً هزینه‌ها ادامه پیدا می‌کند، و کدام دسته‌های نوظهور می‌توانند از کسب‌وکارهای بادوام به جای تقاضای"}, {"source": "NYT Tech", "title": "Inside Mark Zuckerberg’s Decision to Pull the Trigger on Meta’s A.I. Agent", "link": "https://www.nytimes.com/2026/10/09/technology/inside-mark-zuckerbergs-decision-to-pull-the-trigger-on-metas-ai-agent.html", "summary": "Meta had delayed releasing Muse, its A.I. agent app, for months over safety concerns. Then new competition forced Mr. Zuckerberg’s hand.", "date_str": "2026-10-09T09:03:46+00:00", "hash": "bae84ebc7689f13e", "title_fa": "درون تصمیم مارک زاکربرگ برای کشیدن ماشه هوش مصنوعی متا. عامل", "summary_fa": "متا انتشار Muse، A.I آن را به تعویق انداخت. برنامه عامل، برای ماه ها بیش از نگرانی های ایمنی. سپس رقابت جدید دست آقای زاکربرگ را مجبور کرد."}, {"source": "NYT Tech", "title": "Anthropic’s Quest to Give A.I. Morals", "link": "https://www.nytimes.com/2026/10/09/podcasts/hardfork-anthropic-ai-morals.html", "summary": "“For Anthropic, it was part research and part evangelism.”", "date_str": "2026-10-09T ocial Reckoning\" نشان داده شده است بدانید", "summary_fa": "دنباله آرون سورکین برای «شبکه اجتماعی» در سال 2010 یک پرونده افشاگر در فیس بوک را نمایش می دهد. در اینجا چیزی است که باید بدانید."}, {"source": "NYT Tech", "title": "Clinical Trial Indicates A.I. Chatbots Could Aid Urgent Care", "link": "https://www.nytimes.com/2026/10/08/technology/ai-chatbots-urgent-care.html", "summary": "Nearly 100 patients discussed their maladies with a Google bot, called AMIE, before meeting with physicians.", "date_str": "2026-10-08T22:48:06+00:00", "hash": "57821c1a990b90ff", "title_fa": "کارآزمایی بالینی نشان دهنده A.I. چت بات ها می توانند به مراقبت فوری کمک کنند", "summary_fa": "نزدیک به 100 بیمار قبل از ملاقات با پزشکان در مورد بیماری های خود با یک ربات گوگل به نام AMIE صحبت کردند."}, {"source": "NYT Tech", "title": "Before Computer Science Became a Boys’ Club, Margaret Hamilton Wrote the Code", "link": "https://www.nytimes.com/2026/10/08/science/space/margaret-hamilton-computer-science.html", "summary": "The woman who helped put astronauts on the moon was a software engineer when the field was not prestigious or lucrative.", "date_str": "2026-10-09T14:11:28+00:00", "hash": "eeec778c19b500e5", "title_fa": "قبل از اینکه علوم کامپیوتر به یک باشگاه پسران تبدیل شود، مارگارت همیلتون این کد را نوشت", "summary_fa": "زنی که به فرستادن فضانوردان به ماه کمک کرد، زمانی که این رشته معتبر و پردرآمد نبود، مهندس نرم افزار بود."}, {"source": "The Guardian AI", "title": "AI and the climate crisis pose existential risks. The law offers a way to reduce them | Robert Reich", "link": "https://www.theguardian.com/commentisfree/2026/oct/09/ai-climate-change-liability-lawsuits", "summary": "Liability lawsuits have held tobacco, oil and pharma companies to account in the past. AI investors won’t ignore this threat The most basic function of government is to protect people from harm. Two growing phenomena – the climate crisis and AI – pose escalating risks of extraordinary harm. The climate crisis is already causing floods, wildfires, drought and record heat. AI agents are already escaping super-secure environments to hack into systems they’re supposed to avoid. Robert Reich, a former US secretary of labor, is a professor of public policy emeritus at the University of California, Berkeley. He is a Guardian US columnist and his newsletter is at robertreich.substack.com . His new book, Coming Up Short: A Memoir of My America, is out now in the US and in the UK Continue reading...", "date_str": "2026-10-09T11:00:26+00:00", "hash": "1f1a44f6aa432d69", "title_fa": "هوش مصنوعی و بحران آب و هوا خطرات وجودی را به همراه دارند. قانون راهی برای کاهش آنها ارائه می دهد | رابرت رایش", "summary_fa": "دعوای مسئولیت در گذشته شرکت‌های دخانیات، نفت و داروسازی را مورد بازخواست قرار داده است. سرمایه گذاران هوش مصنوعی این تهدید را نادیده نخواهند گرفت. اساسی ترین کارکرد دولت محافظت از مردم در برابر آسیب است. دو پدیده رو به رشد - بحران آب و هوا و هوش مصنوعی - خطرات فزاینده ای را برای آسیب های فوق العاده ایجاد می کنند. بحران آب و هوا در حال حاضر باعث سیل، آتش سوزی، خشکسالی و گرمای بی سابقه شده است. عوامل هوش مصنوعی در حال حاضر از محیط های فوق امن فرار می کنند تا سیستم هایی را که قرار است از آنها اجتناب کنند هک کنند. با این حال، دونالد ترامپ و توانمندسازان جمهوری‌خواهش، با حمایت پول کلان نفت بزرگ و هوش مصنوعی بزرگ، از انجام کاری در مورد هر یک از این ریسک‌ها خودداری می‌کنند. از بسیاری جهات، آنها هر دو را بدتر می کنند. اما راه دیگری برای کاهش این خطرات وجود دارد: از طریق قانون مسئولیت. من بیش از شما به دادگاه عالی ایمان ندارم، اما از پاسخ حداقل نیمی از قضات که در حال بررسی پرونده مهمی هستند که دوره جدید دادگاه عالی را باز کرد، یعنی Suncor v Boulder، شگفت زده شدم. این پرونده توسط چندین محله کلرادو علیه سانکور و اکسون موبیل مطرح شد - یکی از حدود سه ده پرونده تشکیل شده در سراسر کشور که در آن شهرها و ایالت ها از نفت بزرگ می خواهند که هزینه های فزاینده بلایای آب و هوایی ناشی از سوزاندن سوخت های فسیلی را جبران کند. روز دوشنبه، حداقل چهار قاضی (ساموئل آلیتو خود را کنار گذاشته است) نسبت به استدلال نفت بزرگ مبنی بر اینکه قانون هوای پاک به صراحت از چنین شکایت هایی علیه آلاینده ها جلوگیری می کند، ابراز تردید کردند. \"مثل اینکه، وای، مثل این است، متن آن کجاست؟ پشتیبانی"}, {"source": "The Guardian AI", "title": "OpenAI projected to bring in $20bn less in revenue than expected", "link": "https://www.theguardian.com/technology/2026/oct/09/openai-forecast-revenue-gap", "summary": "Questions raised over AI growth as ChatGPT maker forecasts this year’s revenue at $50bn, way below the $70bn signalled before Business live – latest updates OpenAI has revealed that it is making about $20bn less in projected revenue than it had recently indicated to investors, raising questions about the break-neck growth rate in demand for AI. The ChatGPT-maker company has told investors that its revenues for this year would reach $50bn (£37bn), a projection based on sales up to the end of September. Continue reading...", "date_str": "2026-10-09T08:06:09+00:00", "hash": "ea41aa9d05ad7723", "title_fa": "پیش بینی می شود که OpenAI 20 میلیارد دلار کمتر از حد انتظار درآمد داشته باشد", "summary_fa": "سوالاتی که در مورد رشد هوش مصنوعی مطرح شده است زیرا سازنده ChatGPT درآمد امسال را 50 میلیارد دلار پیش‌بینی می‌کند، بسیار کمتر از 70 میلیارد دلاری که قبل از پخش زنده کسب‌وکار نشان داده شده بود - آخرین به‌روزرسانی‌های OpenAI نشان می‌دهد که درآمد پیش‌بینی‌شده آن حدود 20 میلیارد دلار کمتر از آنچه اخیراً به سرمایه‌گذاران نشان داده بود، به دست می‌آورد و سؤالاتی را در مورد نرخ رشد بی‌سابقه در تقاضا برای هوش مصنوعی ایجاد می‌کند. شرکت سازنده ChatGPT به سرمایه گذاران گفته است که درآمد آن برای سال جاری به 50 میلیارد دلار (37 میلیارد پوند) خواهد رسید که بر اساس فروش تا پایان سپتامبر پیش بینی شده است. به خواندن ادامه دهید... با این حال، این به طور قابل توجهی کمتر از 70 میلیارد دلاری است که در اطلاعات ارائه شده به سرمایه گذاران در ماه گذشته که به طور گسترده گزارش شده بود، نشان داده بود. پیش‌بینی درآمدهای سالانه توسط بازیگران برجسته هوش مصنوعی، از جمله توسط رقیب OpenAI، Anthropic، سازنده کلود، به‌عنوان شاخصی از تقاض  ممکن است خود را در «مشکلات زیادی» قرار دهند، زیرا از او در مورد نگرانی‌های مطرح شده در مورد همکاری دولت با کارفرمای جدیدش سؤال شد. به خواندن ادامه دهید... Palantir توسط میلیاردر حامی ترامپ، پیتر تیل، تأسیس شد و نرم‌افزار مبتنی بر هوش مصنوعی را در اختیار ارتش اسرائیل و سرکوب مهاجرت ICE کاخ سفید قرار داده است که منجر به واکنش عمومی و سیاسی علیه دخالت عمیق آن در خدمات عمومی بریتانیا شد. اندی برنهام، نخست وزیر، تحت فشار قابل توجهی از سوی نمایندگان پارلمان و اتحادیه های کارگری قرار دارد تا Palantir را از قراردادهای دولتی، از جمله قرارداد نرم افزاری 330 میلیون پوندی با NHS، کنار بگذارد. این شرکت همچنین با صادق خان در دادگاه بر سر بلوک شهردار لندن در یک قرارداد 50 میلیون پوندی برای استفاده از هوش مصنوعی خود در تحقیقات پلیس متروپولیتن مبارزه می کند. این شرکت به دنبال کسب بیشتر کارهای بخش دولتی در بریتانیا است، جایی که در حال حاضر گردش مالی سالانه 427 میلیون پوندی دارد. واتسون به پادکست «تفکر سیاسی» بی‌بی‌سی با نیک رابینسون گفت: «یکی از چیزهایی که به همکاران سابقم می‌گویم این است: آیا می‌خواهید به حاکمیت قانون اجازه دهید که اجرای تدارکات را رهبری کند، یا می‌خواهید حکومت اوباش، شیوه‌های تدارکات را رهبری کند؟ زیرا اگر در مورد دومی پایین بیایید، خود را با دردسرهای زیادی مواجه خواهید کرد.» وی افزود: فکر می‌کنم ما بسیار مورد هدف افرادی هستیم که شرکت‌های اسرائیلی را هدف"}, {"source": "The Guardian AI", "title": "British households would be £5,000 richer if we were more innovative. Let’s unleash our talents | Gordon Brown", "link": "https://www.theguardian.com/commentisfree/2026/oct/09/gordon-brown-british-households-5000-richer-innovation", "summary": "We have a deep reservoir of assets, but struggle to turn small companies into global success stories. Innovation needs to be at the heart of government policy Gordon Brown was UK prime minister from 2007 to 2010 The coming 10 years are almost certain to be the decade that sees the greatest scientific breakthroughs in a century. The question is whether advances now under way in AI, quantum computing and biology can address cancer, find ways to treat or prevent dementia, and overcome the growing resistance to antibiotics. Can we find sustainable ways to address our energy needs and protect the environment at the same time? Can AI transform the way we deliver education, health and social care to the benefit of millions, as well as advance modern manufacturing strength? And what role can Britain’s inventors, investors and industrialists play in developing these transformative technologies? While the US and China are the world’s obvious innovation powerhouses, the UK also has enormous assets, as the Innovation Nation Conference in Manchester addressed by the prime minister, Andy Burnham, will hear today. We are home to four of the world’s top 10 universities and 16 of the top 100, five of which are in Europe’s top 10 for spin-outs, startups based on intellectual property produced through a university’s research. With less than 1% of the world’s population, the UK produces 6% of the world’s research papers, nearly 9% of citations and 12% of the most highly cited research. Gordon Brown was UK prime minister from 2007 to 2010 Continue reading...", "date_str": "2026-10-09T05:00:39+00:00", "hash": "cdc338a32d386933", "title_fa": "اگر ما نوآورتر بودیم، خانوارهای بریتانیایی 5000 پوند ثروتمندتر می شدند. بیایید استعدادهایمان را آشکار کنیم | گوردون براون", "summary_fa": "ما مخزن عمیقی از دارایی ها داریم، اما در تلاش هستیم تا شرکت های کوچک را به داستان های موفقیت جهانی تبدیل کنیم. نوآوری باید در قلب سیاست دولت قرار گیرد. گوردون براون از سال 2007 تا 2010 نخست وزیر بریتانیا بود. سوال این است که آیا پیشرفت‌هایی که در حال حاضر در زمینه هوش مصنوعی، محاسبات کوانتومی و زیست‌شناسی در حال انجام است می‌تواند به سرطان رسیدگی کند، راه‌هایی برای درمان یا پیشگیری از زوال عقل پیدا کند و بر مقاومت رو به رشد در برابر آنتی‌بیوتیک‌ها غلبه کند؟ آیا می‌توانیم راه‌های پایداری برای رفع نیازهای انرژی و حفاظت از محیط زیست در عین حال پیدا کنیم؟ آیا هوش مصنوعی می‌تواند نحوه ارائه آموزش، بهداشت و مراقبت‌های اجتماعی را به نفع میلیون‌ها
