": "2026-09-16T21:46:01+00:00", "hash": "a45e13aefb8459ff", "title_fa": "بهترین کدهای کوپن Madewell که در سپتامبر 2026 آزمایش کرده ایم", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید Madewell Madewell یک توقف مطمئن برای لوازم اصلی کمد لباس‌های ساده است که هنوز هم ظاهری جلا دارند، از معروف‌ترین لباس‌های جین و تی‌هایش گرفته تا لباس‌ها، ژاکت‌ها، کفش‌ها، کیف‌ها و اکسسوری‌ها. این برند به قطعاتی متمایل است که سبک ساده و پوشیدن آن آسان است، که آن را برای ساختن کمدهای روزمره مورد علاقه قرار می دهد. قبل از بررسی، ارزش آن را دارد که به دنبال آخرین کدهای تبلیغاتی Madewell، کوپن‌ها و فروش باشید تا ببینید آیا می‌توانید مجموع را کاهش دهید. تیم سبک ما Madewell را در چندین راهنمای خرید ما توصیه کرده است، به ویژه برای خریدارانی که به دنبال اصول اولیه قابل اعتماد با کمی جلا بیشتر هستند. قطعات آن در پوشش ما از بهترین تی‌شرت‌های سفید، لباس کار زنانه، لباس‌های کوچک، و مد سایز بزرگ ظاهر شده‌اند و به این برند سابقه خوبی در طیف وسیعی از نیازهای کمد لباس می‌دهند. قیمت‌های Madewell نسبت به خرده‌فروشی‌های فست‌مشن ممکن است کج‌تر باشد، اما این برند تبلیغات مکرری را در مورد لباس، جین، کفش و لوازم جانبی در طول سال انجام می‌دهد. ما جدیدترین کدهای کوپن و معاملات Madewell را در زیر گردآوری کرده‌ایم تا بتوانید به سرعت ببینید چه چیزی ارزش امتحان کردن را قبل از سفارش شما دارد. بهترین کوپن‌های Madewell امروزی Madewell در حال حاضر هیچ کد تبلیغاتی برای سفارش شما ارائه نمی‌کند. بازگشت به سبد خرید شما کوپن های قبلی Madewell این کدها برای تبلیغات قبلی Madewell هستند که از آن زمان منقضی شده اند، اما ممکن است در آینده دوباره فعال شوند. تخفیف 70 درصدی در اجناس فروش با کد تبلیغاتی: LASTCHANCE دریافت 25 درصد تخفیف برای استایل های مردانه و زنانه با کد: SUNNY طلاهای جواهرات انتخابی را به قیمت 6"}, {"source": "Business Insider", "title": "What people at SF's largest tech conference are actually worried about (Hint: Not an AI takeover)", "link": "https://www.businessinsider.com/dreamforce-attendees-dismiss-ai-doomsday-fears-2026-9", "summary": "Attendees arrive at Salesforce s Dreamforce conference in San Francisco on September 15, 2026. Benjamin Fanjoy/Getty Images Fears about AI's catastrophic risks exploded into the mainstream online this week. On the ground at the Dreamforce 2026 conference, attendees weren't at all concerned. People have other worries about AI beyond the hypothetical of existential danger. I decided to hit the pavement at Salesforce's gigantic Dreamforce conference to ask tech-minded people about AI's catastrophic risk. Turns out, it's not all AI gloom and doom — that's only if you're looking online. Last week, Anthropic researcher Jacob Coxon announced he was resigning from the company, saying that AI labs are \"gambling with our lives.\" Debates about an AI-led apocalypse proliferated across the internet, and the leaders of Anthropic and OpenAI posted at length about new safety measures. Around two-thirds of Americans now think there's at least a moderate chance that AI will destroy humanity, a Politico poll taken this week found. It can be hard to tell, though. On Tuesday at Dreamforce, I asked some attendees about their so-called \"p(doom),\" or where they place the probability that AI will cause a major catastrophe. As I navigated a flood of attendees in suits and lanyards, people told me they were worried about AI but not about an apocalypse. Instead, they're concerned about other issues, such as impacts on labor, mental health, and the environment. Dean Levita, a local tech worker attending the conference, said he was mostly unconcerned about an AI-driven extinction. Being aware about catastrophic risks isn't the same as thinking they're right around the corner, he said, likening earthquake warnings from his lifetime in the Bay Area to the discussion about AI risk. \"It's cautionary, it's not imminent,\" he said. Dreamforce attendees brought up data centers Henry Sandles and Sara Jamison had come to learn more about Salesforce since they regularly use the software at their nonprofit, which preserves a historic railroad. When I asked about the fears of extinction, Sandles cracked a grin and said, \"We've been here before.\" He said he trusts that smart people will shut down any AI before it wreaks real-world havoc . \"I just can't see computers being smarter than humans,\" Sandles told me. Jamison said she is far more concerned about the environmental impacts of data centers . She's happy to see AI automating boring work, she said, though she doesn't want to see it used for art.", "date_str": "2026-09-16T21:38:52+00:00", "hash": "af64ff79516e4bd3", "title_fa": "مردم در بزرگترین کنفرانس فناوری SF واقعاً نگران چه چیزی هستند (نکته: نه تصاحب هوش مصنوعی)", "summary_fa": "شرکت‌کنندگان در 15 سپتامبر 2026 به کنفرانس دریم فورس Salesforce در سانفرانسیسکو می‌رسند. بنجامین فانجوی/گتی ایماژ ترس از خطرات فاجعه‌بار هوش مصنوعی این هفته به جریان اصلی آنلاین منفجر شد. در کنفرانس Dreamforce 2026، شرکت کنندگان اصلاً نگران نبودند. مردم نگرانی های دیگری در مورد هوش مصنوعی فراتر از خطر فرضی وجود دارند. تصمیم گرفتم در کنفرانس غول‌پیکر دریم‌فورس Salesforce به پیاده‌روی بروم تا از افراد فن‌آور درباره خطر فاجعه‌بار هوش مصنوعی بپرسم. به نظر می رسد، این همه غم و اندوه و عذاب هوش مصنوعی نیست - این فقط در صورتی است که به دنبال آنلاین باشید. هفته گذشته Jacob Coxon محقق Anthropic اعلام کرد که از این شرکت استعفا می دهد و گفت که آزمایشگاه های هوش مصنوعی \"با زندگی ما قمار می کنند.\" بحث ها در مورد آخرالزمان به رهبری هوش مصنوعی در سراسر اینترنت گسترش یافت و رهبران Anthropic و OpenAI به طور طولانی در مورد اقدامات ایمنی جدید پست کردند. طبق نظرسنجی پولیتیکو که این هفته انجام شد، حدود دو سوم آمریکایی‌ها اکنون فکر می‌کنند که حداقل احتمال متوسطی وجود دارد که هوش مصنوعی بشریت را نابود کند. با این حال، تشخیص آن ممکن است سخت باشد. روز سه‌شنبه در Dreamforce، از برخی از شرکت‌کنندگان در مورد اصطلاح \"p(doom)\" یا احتمال اینکه هوش مصنوعی باعث یک فاجعه بزرگ شود، پرسیدم. وقتی در میان سیل شرکت کنندگان با کت و شلوار و بند بند حرکت می کردم، مردم به من گفتند که نگران هوش مصنوعی هستند اما نگران آخرالزمان نیستند. در عوض، آنها نگران مسائل دیگری مانند تأثیرات بر کار، سلامت روان و محیط زیست هستند. دین لویتا، یک کارمند فناوری محلی که در کنفرانس حضور داشت، گفت که او بیشتر نگران یک انقراض مبتنی بر هوش مصنوعی نیست. او گفت که آگاه بودن از خطرات فاجعه آمیز مانند این نیست که فکر کنیم این خطرات"}, {"source": "Business Insider", "title": "Our London house swap saved us money. The bigger payoff was watching my teenager grow up.", "link": "https://www.businessinsider.com/teen-explore-london-alone-family-vacation-independence-2026-9", "summary": "The author s daughter embraced her newfound independence in London. Courtesy of the author We did a house swap. My friend's family came to the suburbs of NY, and we went to London. Our 15-year-old daughter immediately took to inner-city life. She negotiated the Underground and browsed street markets alone, embracing her independence. I was enjoying lunch with a friend during my summer vacation in London when she asked about the whereabouts of the rest of the family. My husband and tween son were at a museum , I told her. I said I wasn't sure about my daughter, then 15. I explained that we'd parted ways earlier that morning, and she was exploring the city alone. She'd already spent time going to places on her own, partly because she no longer shared the same interests as us. Have you got a story about childhood independence? Please email Jane Ridley at jridley@businessinsider.com if you'd like to be interviewed by Business Insider. We did a house swap Her idea of fun was shopping in clothing stores and browsing street markets like those in Camden and on Portobello Road. We were more into seeing the sights. It was good to see her so happy. We live in suburban New York, which can be cloistered, and she could spread her wings in the British capital. The trip came about via a house swap with a former colleague who lived in the Haringey area of London. Her family moved into our house for two weeks, and we stayed in theirs for seven days before visiting my parents in the north east of England. The author and her family stayed at her former colleague s London home as part of a house swap. Courtesy of the author It was a win-win: we got a taste of inner-city living, and they experienced New York. The accommodation was free for both parties, and they fed our three cats while we were gone. I never imagined the added bonus of my teenager gaining independence during the exchange. She was already pretty street-savvy in Manhattan , since we live about 50 minutes away by train, and she would go with friends. This felt different. She was in a foreign city, albeit a relatively safe one, where people spoke English. She was unsure of the Underground and bus systems. She asked strangers for directions Then there were the cultural differences, such as standing in line for almost everything. Or something as simple as being understood when she asked for half-and-half. However, she handled it well. She never got lost on public transport or stumbled into an unfriendly neighborhood.", "date_str": "2026-09-16T21:36:26+00:00", "hash": "43d583540bb8b05c", "title_fa": "معاوضه خانه ما در لندن باعث صرفه جویی در پول ما شد. سود بزرگتر تماشای بزرگ شدن نوجوانم بود.", "summary_fa": "دختر نویسنده استقلال تازه یافته خود را در لندن پذیرفت. با حسن نیت از نویسنده ما یک خانه عوض کردیم. خانواده دوستم به حومه نیویورک آمدند و ما به لندن رفتیم. دختر 15 ساله ما بلافاصله وارد زندگی درون شهری شد. او در زیرزمین مذاکره کرد و به تنهایی در بازارهای خیابانی گشت و گذار کرد و استقلال خود را پذیرفت. در تعطیلات تابستانی در لندن با یکی از دوستانم در حال صرف ناهار بودم که او در مورد محل اقامت بقیه اعضای خانواده پرسید. به او گفتم شوهر و پسرم در موزه بودند. گفتم در مورد دخترم که آن موقع 15 ساله بود مطمئن نیستم. توضیح دادم که همان روز صبح زودتر از هم جدا شده بودیم و او به تنهایی مشغول کاوش در شهر بود. او قبلاً وقت خود را صرف رفتن به مکان‌ها کرده بود، تا حدی به این دلیل که او دیگر علایق مشابهی با ما نداشت. آیا داستانی در مورد استقلال دوران کودکی دارید؟ اگر می خواهید با Business Insider مصاحبه کنید، لطفاً به جین ریدلی به آدرس jridley@businessinsider.com ایمیل بزنید. ما یک خانه عوض کردیم ایده او از سرگرمی خرید در فروشگاه های لباس و گشت و گذار در بازارهای خیابانی مانند بازارهای کامدن و جاده پورتوبلو بود. ما بیشتر دنبال دیدن مناظر بودیم. خیلی خوب بود که او را خیلی خوشحال می دیدم. ما در حومه نیویورک زندگی می کنیم، جایی که می توان در آن پناه گرفت، و او می تواند بال های خود را در پایتخت بریتانیا باز کند. این سفر از طریق مبادله خانه با همکار سابقش که در منطقه هرینگی لندن زندگی می کرد، انجام شد. خانواده او به مدت دو هفته به خانه ما نقل مکان کردند و ما هفت روز قبل از دیدن والدینم در شمال شرقی انگلیس در خانه آنها ماندیم. نویسنده و خانواده اش در"}, {"source": "Business Insider", "title": "Trump calls for slashing interest rates to '1% or less' after the Fed's first hike in 3 years", "link": "https://www.businessinsider.com/trump-tells-warsh-to-lower-interest-rates-to-1-fomc-2026-9", "summary": "President Donald Trump said he wants lower interest rates. Aaron Schwartz / AFP via Getty Images The Fed hiked interest rates by a quarter point on September 16. President Donald Trump wants to cut, writing on Truth Social that rates should be 1% or less. Chair Kevin Warsh might face more political pressure from the White House. The Fed hiked interest rates for the first time in three years — and President Donald Trump isn't thrilled. \"Interest Rates in the United States should be 1%, or less, because we are the Best Credit in the World — BY FAR,\" he wrote on Truth Social. \"Our Country is BOOMING with new Investment!\" While Trump didn't mention him by name in the post, Chair Kevin Warsh faced a massive test of Fed independence Wednesday. The Federal Open Market Committee voted unanimously to raise rates by a quarter point to foster stable prices. Inflation is stubbornly outpacing wage growth in the US and remains above the Fed's 2% goal, largely due to supply shocks from the Iran War and flip-flopping White House tariff policies. In quarterly economic projections, the committee also expects GDP growth to remain relatively strong, unemployment to hold steady, and inflation to stay above 2% through the rest of the year. A slew of members see another rate hike on the horizon. Trump — who nominated Warsh to the chairmanship — has been vocal about wanting lower interest rates, a monetary policy route that would likely result in higher inflation and a climbing cost of living for Americans. Congressional leaders, economists, and members of the FOMC have worried about how Trump's policy pressure will shape a long nonpartisan central bank. With a hike, Warsh could see more flak from the White House. Trump repeatedly pushed former Chair Jerome Powell to lower rates in the latter part of his term. Political pressure on the central bank culminated in a Department of Justice probe into Powell's handling of construction at the Fed's Washington DC buildings and a mortgage fraud case against Governor Lisa Cook that reached the Supreme Court. Warsh declined to answer any questions about Trump during the September 16 press conference. He said Fed independence is \"a two-way street.\" The central bank will stay in its lane, Warsh said, and lawmakers should stay in theirs. Read the original article on Business Insider", "date_str": "2026-09-16T21:09:45+00:00", "hash": "8eb19e7085e16c72", "title_fa": "ترامپ خواستار کاهش نرخ بهره به «1 درصد یا کمتر» پس از اولین افزایش فدرال رزرو در 3 سال گذشته شد.", "summary_fa": "دونالد ترامپ، رئیس جمهور آمریکا گفته است که خواهان کاهش نرخ بهره است. آرون شوارتز / خبرگزاری فرانسه از طریق گتی ایماژ فدرال رزرو در 16 سپتامبر نرخ بهره را یک چهارم افزایش داد. رئیس جمهور دونالد ترامپ می خواهد کاهش دهد و در Truth Social نوشت که نرخ ها باید 1٪ یا کمتر باشد. رئیس کوین وارش ممکن است با فشار سیاسی بیشتری از سوی کاخ سفید مواجه شود. فدرال رزرو برای اولین بار در سه سال گذشته نرخ بهره را افزایش داد - و رئیس جمهور دونالد ترامپ هیجان زده نیست. او در Truth Social نوشت: «نرخ‌های بهره در ایالات متحده باید 1٪ یا کمتر باشد، زیرا ما بهترین اعتبار در جهان هستیم - با فاصله زیاد. \"کشور ما با سرمایه گذاری جدید در حال رونق است!\" در حالی که ترامپ نامی از او در این پست ذکر نکرد، رئیس کوین وارش روز چهارشنبه با آزمون بزرگ استقلال فدرال رزرو روبرو شد. کمیته بازار آزاد فدرال به اتفاق آرا به افزایش یک چهارم واحد نرخ بهره برای تقویت قیمت ها رای داد. تورم سرسختانه از رشد دستمزدها در ایالات متحده پیشی می‌گیرد و بالاتر از هدف ۲ درصدی فدرال رزرو باقی می‌ماند که عمدتاً به دلیل شوک‌های عرضه ناشی از جنگ ایران و سیاست‌های تعرفه‌ای کاخ سفید است. در پیش بینی های اقتصادی سه ماهه، کمیته همچنین انتظار دارد که رشد تولید ناخالص داخلی نسبتاً قوی باقی بماند، بیکاری ثابت بماند و تورم در بقیه سال بالای 2 درصد باقی بماند. تعداد زیادی از اعضا شاهد افزایش نرخ دیگری در افق هستند. ترامپ - که وارش را به عنوان نامزد ریاست جمهوری انتخاب کرد - در مورد کاهش نرخ بهره، یک مسیر سیاست پولی که احتمالاً منجر به تورم بالاتر و افزایش هزینه زندگی برای آمریکایی‌ها می‌شود، سخن گفت. رهبران کنگره، اقتصاددانان و اعضای FOMC نگران این هستند"}, {"source": "Business Insider", "title": "Students and teachers can save 71% with this Adobe Creative Cloud Pro deal", "link": "https://www.businessinsider.com/guides/deals/adobe-student-teacher-deal-2026", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The Adobe Creative Cloud Pro offer can help students and teachers save over 70%. Illustration by Timon Schneider/SOPA Images/LightRocket via Getty Images It's no secret that Adobe Creative Cloud Pro can get pricey, but an education deal can help eligible students and teachers save big time. The Adobe deal discounts a year of Creative Cloud Pro by 71%. The Adobe Creative Cloud Pro annual deal is available in two forms. Eligible customers can elect to pay for a year of service in monthly installments ($20 a month instead of $70 a month for 12 months) or a full year up-front ($240 instead of $780). Either way, you'll be paying the same amount year-over-year. Just keep in mind that these are one-year contracts exclusively for teachers and students over the age of 13. After the introductory year, subscriptions will renew at $40 a month for 12 months or $480 for a year (still discounted rates) for those eligible, unless you change or cancel your plan before then. Students and teachers can remain on the plan as long as they're still eligible. This is a stellar deal on an expensive but often necessary service. You can learn more about the full suite of offerings in Adobe Creative Cloud Pro below. FAQ What's included in Adobe Creative Cloud Pro? Adobe Creative Cloud Pro subscriptions offer access to over 20 apps, including Photoshop, InDesign, Premiere, Illustrator, Audition, Character Animator, After Effects, and Acrobat Reader. Subscriptions also unlock access to Adobe Firefly creative AI features for images, video, and audio. Subscribers will get 4000 monthly generative credits. Who is eligible for this deal? The deal is available for eligible students 13 and older, as well as teachers. Customers will need to verify their eligibility (using a school-issued email address, school ID card, report card, transcript, or other proof ). What if I'm not a student or teacher? Even if you're not a student or teacher, there's still a chance to save on Adobe Creative Cloud Pro (although the deal isn't quite as sweet). New subscribers can save 50% on their first three months of Adobe Creative Cloud Pro . The deal, which is an annual subscription billed in monthly installments, knocks the first three months down to $35 a month. After that, subscriptions will cost $70 a month. To explore all Adobe offerings, you can head to the Adobe website . If you're trying to unsubscribe from Adobe", "date_str": "2026-09-16T21:08:49+00:00", "hash": "89701e8e015e07c8", "title_fa": "دانش‌آموزان و معلمان می‌توانند با این معامله Adobe Creative Cloud Pro 71% پس انداز کنند", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید پیشنهاد Adobe Creative Cloud Pro می‌تواند به دانش‌آموزان و معلمان کمک کند تا بیش از 70% صرفه‌جویی کنند. تصویرسازی توسط تیمون اشنایدر/SOPA Images/LightRocket از طریق Getty Images بر کسی پوشیده نیست که Adobe Creative Cloud Pro می‌تواند گران‌قیمت باشد، اما یک قرارداد آموزشی می‌تواند به دانش‌آموزان و معلمان واجد شرایط در صرفه‌جویی در وقت کمک کند. قرارداد Adobe یک سال از Creative Cloud Pro را 71 درصد تخفیف می دهد. قرارداد سالانه Adobe Creative Cloud Pro به دو صورت در دسترس است. مشتریان واجد شرایط می توانند انتخاب کنند که برای یک سال خدمت به صورت اقساط ماهانه (20 دلار در ماه به جای 70 دلار در ماه برای 12 ماه) یا یک سال کامل (240 دلار به جای 780 دلار) پرداخت کنند. در هر صورت، شما همان مبلغ را سال به سال پرداخت خواهید کرد. فقط به خاطر داشته باشید که این قراردادهای یک ساله منحصرا برای معلمان و دانش آموزان بالای 13 سال است. پس از سال مقدماتی، اشتراک ها با 40 دلار در ماه برای 12 ماه یا 480 دلار برای یک سال (هنوز نرخ های تخفیف) برای واجدین شرایط تمدید می شود، مگر اینکه قبل از آن برنامه خود را تغییر دهید یا لغو کنید. دانش‌آموزان و معلمان می‌توانند تا زمانی که واجد شرایط هستند، در برنامه باقی بمانند. این یک معامله خیره کننده برای یک سرویس گران قیمت اما اغلب ضروری است. در زیر می‌توانید درباره مجموعه کامل پیشنهادات در Adobe Creative Cloud Pro اطلاعات بیشتری کسب کنید. سؤالات متداول در Adobe Creative Cloud Pro چه مواردی وجود دارد؟ اشتراک‌های Adobe Creative Cloud Pro به بیش از 20 برنامه از جمله Photoshop، InDesign، Premiere، Illustrator، Audition، Character Animator، After Effects و Acrobat Reader دسترسی دارند. اشتراک‌ها"}, {"source": "Business Insider", "title": "Meta is learning a lesson about camera glasses that Google learned more than 10 years ago", "link": "https://www.businessinsider.com/meta-ai-glasses-no-camera-tradeoffs-google-glass-2026-9", "summary": "Meta s Ray-Ban AI glasses have been controversial. Christoph Schmidt/picture alliance via Getty Images Wearing a camera is controversial. Google figured this out the hard way with its infamous Google Glass. Over 10 years later, Meta is learning the same lesson. Meta is now reportedly working on camera-free AI glasses. It's a good idea, but it's hard to put the genie back in the bottle. Meta is cooking up camera-free glasses, according to a new report . And why shouldn't they? After all, wearing a camera on your face has always been a tough sell — just ask Google. Remember when Sergey Brin jumped out of a plane wearing Google Glass, recording grainy video of his sky dive? That was way back in 2012, and the bizarre-looking camera glasses flopped soon after. Google cofounder Sergey Brin wearing a Google Glass headset in 2012 for a demo. Google The public did not take kindly to the idea of being filmed (even though, yes, smartphones with cameras had long existed). A former colleague of mine was even assaulted in a San Francisco bar while wearing them. Meta has been re-testing the waters with its AI smart glasses. Meta's have proved far more popular than Google Glass thanks to AI, their more traditional look, and list of genuinely useful features. (Meta's ad that aired during the US Open — where a woman records the back-and-forth of a tennis rally by moving her head, while the crowd around her films on their phones — was particularly effective at pointing out how they can help you stay in the moment.) But Meta is still hitting the same wall of uneasiness that Google experienced more than a decade ago. Now, there are signs that Meta is cooking up a simpler, but likely less controversial product. The Information reported this week that Meta is working on a camera-free variant of its AI glasses, though there's no sign that the company is throwing in the towel on camera glasses. The idea is that customers would just have more choices. (Meta declined to comment on the report when contacted by Business Insider.) I think it's a good idea, and one I'm sure Meta considered years ago, back when they were first mapping out what their smart glasses would look like, and which tech to include. Mark Zuckerberg was no stranger to the Google Glass debacle. But Meta decided to roll the dice with cameras when its glasses first went to market, and in many ways that's paid off. Sales have boomed in recent years, but so has the backlash , both of which Business Insider has reported ", "date_str": "2026-09-16T21:06:41+00:00", "hash": "bd00bce23bb41226", "title_fa": "متا درسی در مورد عینک دوربین می آموزد که گوگل بیش از 10 سال پیش آموخت", "summary_fa": "عینک های هوش مصنوعی متا Ray-Ban بحث برانگیز بوده اند. کریستوف اشمیت/ اتحاد تصویر از طریق گتی ایماژ پوشیدن دوربین بحث برانگیز است. گوگل با گوگل گلس بدنام خود به این راه سخت پی برد. بیش از 10 سال بعد، متا در حال یادگیری همان درس است. متا اکنون در حال کار بر روی عینک های هوش مصنوعی بدون دوربین است. ایده خوبی است، اما بازگرداندن جن در بطری سخت است. بر اساس یک گزارش جدید، متا در حال پختن عینک های بدون دوربین است. و چرا نباید این کار را بکنند؟ به هر حال، پوشیدن دوربین روی صورت همیشه کار سختی بوده است - فقط از گوگل بپرسید. زمانی را به یاد دارید که سرگئی برین با عینک گوگل از هواپیما بیرون پرید و فیلمی از غواصی خود در آسمان ضبط کرد؟ این در سال 2012 بود، و عینک دوربین که ظاهر عجیبی داشت، بلافاصله بعد از آن شکست. سرگئی برین، یکی از بنیانگذاران گوگل، در سال 2012 یک هدست عینک گوگل را برای یک دمو به سر داشت. Google عموم مردم ایده فیلمبرداری را با مهربانی نپذیرفتند (اگرچه، بله، گوشی های هوشمند با دوربین از مدت ها قبل وجود داشتند). یکی از همکاران سابق من حتی در یک بار در سانفرانسیسکو در حالی که آنها را پوشیده بود مورد تعرض قرار گرفت. متا با عینک هوشمند هوش مصنوعی خود آب ها را دوباره آزمایش کرده است. متا به لطف هوش مصنوعی، ظاهر سنتی‌تر و فهرستی از ویژگی‌های واقعاً مفید، محبوب‌تر از Google Glass شده‌اند. (تبلیغ متا که در طول مسابقات آزاد آمریکا پخش شد - جایی که زنی با حرکت دادن سرش حرکت رفت و برگشت یک رالی تنیس را ضبط می‌کند، در حالی که جمعیت اطراف فیلم‌های او را روی تلفن‌هایشان جمع می‌کنند - به‌ویژه در اشاره به اینکه چگونه می‌توانند به شما کمک کنند در آن"}, {"source": "Business Insider", "title": "Elon Musk's companies ordered to explain why they dropped antitrust claims against Apple", "link": "https://www.businessinsider.com/elon-musk-companies-ordered-explain-dropped-apple-antitrust-claims-2026-09", "summary": "Illustration by Nikolas Kokovlis/NurPhoto via Getty Images A judge ordered Musk's firms to disclose any Apple settlement in its antitrust case, POLITICO reported. X Corp dropped its Apple claims but is still pursuing an antitrust case against OpenAI. The lawsuit alleges Apple and OpenAI colluded to dominate the AI market, affecting app store rankings. The federal judge overseeing an antitrust case by Elon Musk 's companies against Apple and OpenAI is demanding to see any settlement agreements that may have led X Corp and SpaceXAI on Tuesday to drop their claims against Apple, POLITICO reported. Judge Mark Pittman , a conservative Trump appointee based in Fort Worth, Texas, ordered the Musk-owned businesses on Wednesday to produce for his review any agreements with Apple related to the decision to dismiss its claims against the company. Pittman's ruling comes after OpenAI moved to compel X to disclose information about its resolution with Apple in the dispute over dominance of the potentially trillion-dollar artificial intelligence market. The motion to voluntarily dismiss the claims was filed without any explanation, and noted that X and SpaceXAI will continue to pursue antitrust claims against OpenAI. The lawsuit alleges that Apple and OpenAI are \"two monopolists joining forces to ensure their continued dominance\" in the AI market, including via alleged manipulation of Apple's app store rankings. The complaint also points to an exclusive 2024 deal to integrate OpenAI's ChatGPT into Apple's popular iPhone. Apple has reportedly signed a new agreement this year to integrate Google's AI services into its products. This story originally appeared on POLITICO and is courtesy of the Axel Springer Global Reporters Network, which harnesses the resources of the company's newsrooms to publish ambitious scoops, investigations, interviews, opinion pieces, and analysis. It allows journalists — including those from POLITICO, Business Insider, WELT, BILD, Onet, and Fakt — to collaborate on major stories for an international audience of hundreds of millions across platforms. Read the original article on Business Insider", "date_str": "2026-09-16T20:52:42+00:00", "hash": "d98c143bce106232", "title_fa": "شرکت های ایلان ماسک دستور دادند توضیح دهند که چرا ادعاهای ضد انحصار علیه اپل را کنار گذاشتند", "summary_fa": "تصویر توسط Nikolas Kokovlis/NurPhoto از طریق Getty Images، POLITICO گزارش داد که یک قاضی به شرکت‌های ماسک دستور داد تا هرگونه توافق اپل در پرونده ضدانحصار خود را افشا کنند. X Corp ادعاهای اپل را کنار گذاشت اما همچنان در حال پیگیری یک پرونده ضد تراست علیه OpenAI است. این شکایت ادعا می کند که اپل و OpenAI برای تسلط بر بازار هوش مصنوعی تبانی کرده اند که بر رتبه بندی فروشگاه های اپلیکیشن تاثیر گذاشته است. به گزارش POLITICO، قاضی فدرال که بر پرونده ضدانحصار شرکت‌های ایلان ماسک علیه اپل و OpenAI نظارت می‌کند، خواستار مشاهده هرگونه توافق‌نامه‌ای است که ممکن است باعث شود X Corp و SpaceXAI در روز سه‌شنبه از ادعاهای خود علیه اپل صرف‌نظر کنند. قاضی مارک پیتمن، منصوب محافظه‌کار ترامپ مستقر در فورت ورث، تگزاس، روز چهارشنبه به شرکت‌های تحت مالکیت ماسک دستور داد تا هرگونه توافقی با اپل در رابطه با تصمیم به رد ادعاهای این شرکت علیه این شرکت را برای بررسی او ارائه کنند. حکم پیتمن پس از آن صادر شد که OpenAI برای وادار کردن X به افشای اطلاعات مربوط به راه حل خود با اپل در مناقشه بر سر تسلط بر بازار بالقوه تریلیون دلاری هوش مصنوعی صادر شد. درخواست رد داوطلبانه این ادعاها بدون هیچ توضیحی ارائه شد و اشاره شد که X و SpaceXAI به پیگیری ادعاهای ضد تراست علیه OpenAI ادامه خواهند داد. در این دادخواست ادعا شده است که اپل و OpenAI \"دو انحصاری هستند که برای تضمین تداوم تسلط خود در بازار هوش مصنوعی، از جمله از طریق ادعای دستکاری در رتبه‌بندی فروشگاه اپلیکیشن اپل، نیروهای خود را به هم می‌پیوندند. این شکایت همچنین به قرارداد انحصاری 2024 برای ادغام ChatGPT OpenAI در آیفون محبوب اپل اشاره دارد. طبق گزارش ها، اپل امسال قرارداد جدیدی را برای ادغام خدمات هوش مصنوعی گوگل در محصولات خود"}, {"source": "Business Insider", "title": "Sony WH-1000XM6 headphones review: The brand's best noise cancellation yet", "link": "https://www.businessinsider.com/guides/tech/sony-wh-1000xm6-headphones-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The WH-1000XM6 are a worthy successor to the highly rated XM5 headphones. Tyler Hayes/Business Insider Sony's 1000X series consistently ranks among the best headphones you can buy. The first-generation model launched back in 2016, and the brand's latest flagship pair, the WH-1000XM6 (XM6), was released in May of 2025. Compared to older models, the XM6 over-ear headphones deliver subtle enhancements to audio quality and a welcome design update. They sound great and feel much sturdier than the previous XM5. The highlight of the XM6, however, is the headphones' notable bump in active noise canceling (ANC) performance. They go toe-to-toe with top competitors from Bose and Apple. On the downside, the XM6 headphones come at a steep price, with an MSRP of $460. That's $60 more than the XM5 cost when they debuted. Though I don't love the higher price point, it's in line with direct rivals from other brands. After various tests, I've been thoroughly impressed by the XM6. They're better than the XM5 in every way. That said, the WH-1000XM5 are still available and often sold at a nice discount. Given their lower cost, the older model has an edge in overall value. But if the price bump doesn't deter you, the WH-1000XM6 are a tempting treat for enthusiasts. Small tweaks in design and comfort make a big difference The XM6 headphones (right) have a wider headband than the XM5 (left), which helps them feel more natural on your head. Tyler Hayes/Business Insider Right out of the box, I was struck by the XM6 headphones' sturdiness. Comparatively, they make the XM5 feel flimsy. The hinges on the new model don't bend or flop around in the same way. That's a meaningful change because there had been user complaints about the XM5's long-term durability, primarily regarding the hinges and how the ear cups connect to the headband. Though time will tell just how well these hold up, the XM6 feel sturdy for a plastic product. The XM6's top headband doesn't look dramatically different than the XM5's, but you can sense its increased width on your head. It feels great and seems to disappear more than the XM5's band. While I didn't mind the previous model, the XM6's headband is better. Not only is the XM6's band wider, improving comfort, but it also tapers off at the sides, serving as a visual indicator of which direction to put them on. The exterior of the ear cups is also angled to complement t", "date_str": "2026-09-16T20:42:45+00:00", "hash": "eaf3abb1cd400a58", "title_fa": "بررسی هدفون WH-1000XM6 سونی: بهترین حذف نویز این برند تاکنون", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید WH-1000XM6 جانشین شایسته ای برای هدفون XM5 با رتبه بالا است. Tyler Hayes/Business Insider سری 1000X سونی همواره در بین بهترین هدفون هایی قرار می گیرد که می توانید بخرید. نسل اول مدل در سال 2016 عرضه شد و آخرین جفت پرچمدار این برند، WH-1000XM6 (XM6) در ماه می سال 2025 عرضه شد. در مقایسه با مدل‌های قدیمی‌تر، هدفون‌های روگوشی XM6 پیشرفت‌های ظریفی را در کیفیت صدا و به‌روزرسانی طراحی خوش‌آمد ارائه می‌کنند. آنها صدایی عالی دارند و نسبت به XM5 قبلی بسیار محکم تر هستند. با این حال، ویژگی برجسته XM6، ضربه قابل توجه هدفون در عملکرد حذف نویز فعال (ANC) است. آنها پا به پای رقبای برتر از Bose و Apple پیش می روند. از جنبه منفی، هدفون XM6 با قیمت گزاف، با MSRP 460 دلار عرضه می شود. این 60 دلار بیشتر از هزینه XM5 در هنگام عرضه است. اگرچه قیمت بالاتر را دوست ندارم، اما با رقبای مستقیم برندهای دیگر همخوانی دارد. پس از آزمایش های مختلف، من کاملاً تحت تأثیر XM6 قرار گرفتم. آنها از هر نظر بهتر از XM5 ه اج کرده است آشنا شوید.", "summary_fa": "دونالد ترامپ جونیور و بتینا ترامپ در ماه می عروسی خود را در باهاما برگزار کردند. کوین لامارک/رویترز دونالد ترامپ جونیور 48 ساله و بتینا ترامپ 39 ساله عروسی خود را در ماه می در باهاما جشن گرفتند. بتینا ترامپ، یک فرد اجتماعی، مدل و تأثیرگذار، از یک خانواده برجسته پالم بیچ است. او در سپتامبر 2024 با ترامپ جونیور مرتبط بود و آنها در دسامبر 2025 نامزدی خود را اعلام کردند. بتینا اندرسون قبلاً در پالم بیچ فلوریدا به دلیل مدلینگ مد، علاقه اش به حفظ محیط زیست و کارهای خیریه و خانواده بانکی برجسته اش شناخته شده بود. سپس خانم ترامپ شد. این زوج اولین حضور رسمی خود را به عنوان یک زوج در مراسم تحلیف رئیس جمهور دونالد ترامپ انجام دادند، جایی که از آنها در حالی که دست در دست هم گرفته بودند، دست در دست هم راه می رفتند و در چندین رویداد با هم می رقصیدند، عکس گرفتند. در دسامبر 2025، آنها پس از یک سال آشنایی، نامزدی خود را اعلام کردند. این زوج پس از ازدواج بی سر و صدا در یک مراسم قانونی در فلوریدا، مراسم ازدواج خود را در 22 می در باهاما برگزار کردند. رئیس جمهور در مراسم عروسی شرکت نکرد. ترامپ در سایت Truth Social نوشت: «در حالی که من خیلی دوست داشتم با پسرم، دون جونیور، و جدیدترین عضو خانواده ترامپ باشم، بتینا همسرش که به زودی همسرش می شود، شرایط مربوط به دولت و عشق من به ایالات متحده آمریکا، اجازه این کار را به من نمی دهد. در اینجا آنچه باید در مورد تربیت، حرفه و ارتباط بتینا ترامپ با خانواده ترامپ بدانید آمده است. بتینا ترامپ، خواهرزاده اندرسون، در پالم بیچ فلوریدا بزرگ شد و از خانواده ای سرشناس می آید. (L-R) ژاکلین کیمبرلی، هری لوی اندرسون جونیور، و اینگر اندرسون در 10 ژانویه 1972"}, {"source": "Business Insider", "title": "10 best silk pajamas, according to extensive testing", "link": "https://www.businessinsider.com/guides/style/best-silk-pajamas", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more On the left, I m wearing the LilySilk Aries Pajamas; on the left, Style Editor Gabrielle Chase is wearing the Negative Underwear Eclipse Washable Silk set. Samantha Crozier, Gabrielle Chase/Business Insider A great pair of silk pajamas can make your whole nighttime routine feel more elevated — but not every set is worth the splurge. After testing silk pajama sets and nightgowns from brands like Eberjey, Quince, Lunya, and Clementine, I found that the best silk pajamas for women aren't just beautiful; they also need to feel comfortable, hold up well, and justify their price. I narrowed my favorites down based on comfort, fit, fabric quality, washability, and value. The picks below include the silk pajamas I'd actually recommend buying, whether you're looking for a classic set, a machine-washable option, or something more luxurious. I also learned lots of tips — like how to get rid of wrinkles by putting silk in the dryer for a few minutes or how to remove small oil stains with talcum powder — that helped make the process of caring for silk less daunting. For more of our sleepwear coverage, see our articles on the best pajamas , the best nightgowns , the best cooling pajamas , and more. Editor-favorite silk pajamas What to look for in silk pajamas Silk is classified according to two units of measurement: momme and grade. While some brands don't publicize the grade of their silk, others — like Eberjey or Clementine — tout the superior momme and grade of their fabrics. Momme: Pronounced \"mommy,\" momme has to do with how thick and tightly woven the silk is. They get this number by calculating the weight in pounds of a standard roll of silk, which is 45-inches by 100 yards. If this roll weighs 15-pounds, then the silk is classified as as 15 momme. Quality tends to go up with momme. Grade : This fiber measurement has to do with how pure the fabric is. Most of the silk pajamas on this list are grades 4A, 5A, or 6A. 6A is the highest, with long strands, very few impurities, and a shine that lower grades don't have. How I tested silk pajamas Fabric quality: I considered momme weight and silk grade where brands disclosed those details, along with the overall feel
