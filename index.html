f these requests — intended for Chinese AI models but routed to Claude instead — exposed sensitive data from the Chinese and Russian governments and militaries. This included CCTV footage uploaded by a PLA-affiliated Kimi user and information on a Russian government database submitted by a Russian military contractor. Per the report, Alibaba ran the largest attack Anthropic had ever measured, recording over 151 million exchanges between May and July carried out by 3,500 fraudulent accounts. The accounts made Claude write out its reasoning processes, which were used to train its Qwen models, Anthropic said. Anthropic accused Z.ai — which made headlines recently for its mysterious Ox Alpha model — of launching an attack similar in nature to Alibaba's. And in Xiaomi's case, Anthropic said the company recorded user chats with its own MiMo models and fed those conversations into Claude to create training data. Representatives for Alibaba, Moonshot, DeepSeek, Zhipu, and Xiaomi did not respond to queries from Business Insider asking about Anthropic's allegations. Anthropic did not respond to a request for comment either. Anthropic said that to prevent future distillation attacks, it has added new safeguards to ban suspicious activity and made Claude produce less detailed reasoning transcripts, which are less useful for training new models. It will also require u", "date_str": "2026-09-11T05:48:03+00:00", "hash": "f32ccb35cf50a886", "title_fa": "آزمایشگاه‌های هوش مصنوعی چین حداقل 35 میلیون بار در تابستان درخواست‌های کاربران را به کلود ارسال کردند: Anthropic", "summary_fa": "آنتروپیک، آزمایشگاه‌های برتر هوش مصنوعی چین، مانند هوش مصنوعی Moonshot، را به حملات تقطیر در مقیاس بزرگ متهم کرد. CFOTO/Future Publishing از طریق Getty Images Anthropic گفت که آزمایشگاه‌های برتر هوش مصنوعی چین میلیون‌ها حمله تقطیر را به کلود انجام دادند. گفته می شود علی بابا، مون شات، ژیپو، دیپ سیک و شیائومی همگی سعی کرده اند از کلود برای آموزش مدل های خود استفاده کنند. در پاسخ، آنتروپیک در حال تقویت نرده های محافظ خود در برابر این حملات است. آنتروپیک گفت که آزمایشگاه‌های برتر هوش مصنوعی چینی کلود را با میلیون‌ها حمله تقطیر در تابستان بمباران کردند. آزمایشگاه هوش مصنوعی در گزارشی روز پنجشنبه اعلام کرد که علی‌بابا، مون‌شات، دیپ‌سیک، ژیپو و شیائومی در مجموع نزدیک به 190 میلیون حمله تقطیر را علیه کلود بین ماه‌های می تا جولای انجام داده‌اند. حملات تقطیر به استفاده از خروجی‌های مدل‌های پیشرفته هوش مصنوعی مرزی برای آموزش و بهبود قابلیت‌های مدل‌های کمتر پیشرفته اشاره دارد. Anthropic گفت که DeepSeek و Moonshot AI درخواست های کاربران خود را به جای مدل های خود به کلود داده اند. این شرکت اعلام کرد که 23 میلیون مورد از این تغییر مسیر توسط Moonshot بین ماه می تا جولای و 12.1 میلیون مورد توسط DeepSeek طی 14 روز در ماه جولای ثبت شده است. آنتروپیک همچنین گفت که برخی از این درخواست‌ها - که برای مدل‌های هوش مصنوعی چینی در نظر گرفته شده بودند، اما در عوض به کلود ارسال شده بودند - داده‌های حساس دولت‌ها و ارتش‌های چین و روسیه را فاش کردند. این شامل فیلم دوربین مداربسته آپلود شده توسط کاربر Kimi وابسته به PLA و اطلاعات مربوط به پایگاه داده دولت روسیه است که توسط یک پیمانکار نظامی روسی ارسال شده است. بر اساس این گزارش، علی‌بابا بزرگترین حمله‌ای را که Anthropic تا به حال اندازه‌گیری کرده بود، انجام داد و بیش"}, {"source": "Business Insider", "title": "Anthropic and OpenAI employees speak out about humanity’s extinction as debate reaches fever pitch", "link": "https://www.businessinsider.com/anthropic-openai-employees-speak-out-ai-safety-2026-9", "summary": "An Anthropic researcher s resignation prompted a fierce debate over the dangers of AI acceleration and the need for guardrails. Matteo Della Torre/NurPhoto via Getty Images An Anthropic researcher's resignation prompted a fierce debate over the dangers of AI acceleration. Some AI company CEOs have been outspoken about the risk of an AI catastrophe. Here is what employees at Anthropic and OpenAI are saying about AI safety measures. The AI industry's race to build ever more powerful systems is reviving some grim questions, especially for those who are helping build AI . Employees at Anthropic and OpenAI are speaking out on the potential dangers AI poses to humanity after an Anthropic researcher quit on Wednesday and said that leading AI companies are \"gambling with our lives.\" Soon after, Geoffrey Hinton , the Nobel Prize-winning computer scientist often called the \" Godfather of AI ,\" told the BBC it was \"not unreasonable\" to estimate a 10% chance that AI could wipe out humanity within a decade. Such warnings are not rare. Some of the executives building the technology, including Anthropic CEO Dario Amodei, publicly assigned their own \"p(doom)\" numbers, shorthand for the probability that AI causes a catastrophe on the scale of civilizational collapse . Here is what Anthropic and OpenAI employees are saying about the potential for an AI catastrophe , and if the industry is speeding toward a risky future. Jacob Coxon, former Anthropic AI researcher Jacob Coxon , the former Anthropic AI researcher who sparked the renewed debate over AI safety, resigned from Anthropic on Tuesday after three years of conducting pre-training research. \"Neither company is acting responsibly,\" Coxon wrote on X in the announcement for his resignation. \"They are racing straight to self-improving superintelligence and gambling with our lives.\" Coxon, who previously worked on GPT-4o at OpenAI, said AI leaders privately fear the technology could be catastrophic. \"The people building AI earnestly believe that it could kill us all by the end of the decade,\" Coxon added. \"At Anthropic, the stakes are well-understood, but they are locked in a race to get there first — they believe no one else will act responsibly, so they must do it themselves, despite the risk.\" Evan Hubinger, alignment science lead at Anthropic Evan Hubinger , an alignment science lead at Anthropic, reposted Coxon's post on X and said he is most worried about \"superintelligence arising from recursive self-improvement.\" \"J", "date_str": "2026-09-11T05:45:14+00:00", "hash": "a6391ddbee73e2fa", "title_fa": "کارمندان Anthropic و OpenAI در مورد انقراض بشریت صحبت می کنند زیرا بحث به اوج می رسد", "summary_fa": "استعفای یک محقق Anthropic باعث ایجاد یک بحث شدید در مورد خطرات شتاب هوش مصنوعی و نیاز به نرده های محافظ شد. Matteo Della Torre/NurPhoto via Getty Images استعفای یک محقق Anthropic بحث شدیدی را در مورد خطرات شتاب هوش مصنوعی برانگیخت. برخی از مدیران عامل شرکت های هوش مصنوعی درباره خطر فاجعه هوش مصنوعی صریح صحبت کرده اند. در اینجا کارمندان Anthropic و OpenAI در مورد اقدامات ایمنی هوش مصنوعی می گویند. رقابت صنعت هوش مصنوعی برای ساختن سیستم‌های قوی‌تر در حال احیای سؤالات تلخ است، به‌ویژه برای کسانی که به ساخت هوش مصنوعی کمک می‌کنند. کارکنان Anthropic و OpenAI در مورد خطرات بالقوه ای که هوش مصنوعی برای بشریت ایجاد می کند پس از اینکه یک محقق Anthropic در روز چهارشنبه ترک کرد و گفت که شرکت های برجسته هوش مصنوعی \"با زندگی ما قمار می کنند\" صحبت می کنند. اندکی پس از آن، جفری هینتون، دانشمند کامپیوتر برنده جایزه نوبل که اغلب آن را \"پدرخوانده هوش مصنوعی\" می نامند، به بی بی سی گفت که تخمین زدن 10 درصد احتمال اینکه هوش مصنوعی بتواند بشریت را ظرف یک دهه از بین ببرد، \"غیر منطقی\" نیست. چنین هشدارهایی کم نیستند. برخی از مدیران سازنده این فناوری، از جمله داریو آمودی، مدیر عامل آنتروپیک، به طور عمومی اعداد \"p(doom)\" خود را اختصاص دادند، که خلاصه ای از احتمال این است که هوش مصنوعی باعث فاجعه ای در مقیاس فروپاشی تمدن شود. در اینجا کارمندان Anthropic و OpenAI در مورد پتانسیل یک فاجعه هوش مصنوعی و اینکه آیا صنعت به سمت آینده ای پرمخاطره حرکت می کند، می گویند. Jacob Coxon، محقق سابق هوش مصنوعی Anthropic، Jacob Coxon، محقق سابق هوش مصنوعی Anthropic که بحث های جدیدی را در مورد ایمنی هوش مصنوعی به راه انداخت، پس از سه سال انجام تحقیقات پیش از آموزش، روز سه شنبه از آنتروپیک"}, {"source": "Business Insider", "title": "Getting my H-1B on the first try felt like 'pure luck.' 4 years later, a layoff meant I had to leave the US.", "link": "https://www.businessinsider.com/h-1b-visa-first-try-laid-off-amazon-moved-india-2026-9", "summary": "Soumi Chanda got laid off last year and moved back to India. Provided by Soumi Chanda Soumi Chanda moved from Kolkata to the US for graduate school and spent 13 years building a career and life there. She was picked for an H-1B visa on her first try and later moved to Seattle after Amazon acquired her visa sponsorship. After she got laid off last year, Chanda returned to India with her two cats. I spent almost 13 years building a life in the United States , and then I had 60 days to pack up and leave it all behind. I was raised in Kolkata and never lived anywhere else until 19. I'd never visited the US as a child, but felt oddly close to it — my aunt and uncle, both professors, lived in Spokane, Washington, and my aunt's stories made me curious about American life long before I saw it myself. I started working at 17 out of necessity, kept working while pursuing my bachelor's degree in business administration at Calcutta University, and after graduation landed a role as a business developer for a startup exporting handwoven bags. This is part of our ongoing coverage of how the Trump administration's H-1B visa changes affect workers. If you've been impacted and want to share your story, please fill out this short form for the reporter. Encouraged by my aunt and uncle to consider a master's abroad, I took the GMAT almost on a whim. I was offered a scholarship from Gonzaga University in Spokane. At 20, I arrived in Washington in December 2013 on an F-1 visa . It was freezing and silent, nothing like the loud city I'd known back home. Chandas said she enjoyed the community at Gonzaga University in Spokane, Washington. Provided by Soumi Chanda Once I adjusted, it became home The university's community felt refreshingly different from the hierarchy I'd grown up with, and I found my footing through the international student network. My MBA took two years. As an international student , I had a limited window after graduation to find qualifying work. I couldn't find a paid job, so I took an unpaid marketing role at a nonprofit to build experience. I eventually landed a leadership rotational program at US Bank, and went back to my university for a second master's in organizational leadership tied directly to that job. When my program at US Bank ended, I asked them to sponsor an H-1B . They said no. The city had few employers experienced with international hiring, and I often found myself explaining the rules. I joined a small genetic-testing startup that did DNA test", "date_str": "2026-09-11T04:02:46+00:00", "hash": "344f08fb4b3bc2b6", "title_fa": "گرفتن H-1B من در اولین تلاش مانند \"شانس خالص\" بود. 4 سال بعد، اخراج به این معنی بود که من باید ایالات متحده را ترک کنم.", "summary_fa": "سومی چاندا سال گذشته اخراج شد و به هند بازگشت. ارائه شده توسط Soumi Chanda Soumi Chanda برای تحصیلات تکمیلی از کلکته به ایالات متحده نقل مکان کرد و 13 سال را در آنجا گذراند تا شغل و زندگی خود را ایجاد کند. او در اولین تلاش خود برای ویزای H-1B انتخاب شد و بعد از اینکه آمازون حمایت مالی وی را به دست آورد، به سیاتل نقل مکان کرد. پس از اینکه سال گذشته از کار بیکار شد، چاندا با دو گربه خود به هند بازگشت. من تقریباً 13 سال را صرف ساختن زندگی در ایالات متحده کردم و سپس 60 روز فرصت داشتم تا وسایلم را جمع کنم و همه چیز را پشت سر بگذارم. من در کلکته بزرگ شدم و تا 19 سالگی در هیچ جای دیگری زندگی نکردم. در کودکی هرگز به ایالات متحده سفر نکرده بودم، اما به طرز عجیبی به آن نزدیک بودم - عمه و عمویم، هر دو استاد، در اسپوکین، واشنگتن زندگی می کردند، و داستان های خاله ام مدت ها قبل از اینکه خودم آن را ببینم، مرا در مورد زندگی آمریکایی کنجکاو کرد. من از 17 سالگی به ناچار کار را شروع کردم، در حالی که مدرک کارشناسی خود را در رشته مدیریت بازرگانی در دانشگاه کلکته دنبال می کردم، به کار ادامه دادم و پس از فارغ التحصیلی به عنوان یک توسعه دهنده کسب و کار برای یک استارتاپ صادراتی کیف های دستباف مشغول به کار شدم. این بخشی از پوشش مداوم ما در مورد چگونگی تأثیر تغییرات ویزای H-1B دولت ترامپ بر کارگران است. اگر تحت تأثیر قرار گرفته اید و می خواهید داستان خود را به اشتراک بگذارید، لطفاً این فرم کوتاه را برای خبرنگار پر کنید. با تشویق عمه و عمویم برای رفتن به مقطع کارشناسی ارشد در خارج از کشور، تقریباً از روی هوس در"}, {"source": "Business Insider", "title": "Oracle maintains its capex forecast and reports cloud growth, sending shares up 7%", "link": "https://www.businessinsider.com/oracle-q1-2027-earnings-maintains-capex-forecast-reports-cloud-growth-2026-9", "summary": "Oracle. Bloomberg/Getty Images Oracle maintained its fiscal 2027 capital expenditure forecast at $90 billion to $95 billion. Oracle reported 121% cloud growth, boosting shares by 7% following its earnings report. Oracle is touting new financing models amid pressure to balance AI spending and profitability. Oracle is holding the line on its data center spending forecast. On Thursday, Oracle reported $28.5 billion in first-quarter capital expenditures, up from $8.5 billion a year earlier. It kept its fiscal 2027 capital expenditure forecast at $90 billion to $95 billion, including data center spending. Its capex forecast has not changed from the guidance it first issued in June. Many major cloud companies have continued to raise their AI spending forecasts as they race to build more data centers and expand AI capacity — except Microsoft , which kept its capex forecast unchanged in July and also saw its stock soar after reporting earnings. Asked on the earnings call how long Oracle will continue its heavy AI infrastructure spending, co-CEO Clay Magouyrk instead focused on how the company finances those projects. \"We have to separate out in our minds what Oracle spends as capex directly, uncouple that directly from how we think about how the business can grow,\" he said. Oracle shares were up 7% after the company reported 121% growth in cloud infrastructure revenue in its first-quarter earnings release, apparently easing Wall Street fears about whether data center spending would translate to sales. Oracle has borrowed tens of billions of dollars to build data centers and buy chips, and it has been under massive pressure to balance that spending with Wall Street's profitability expectations. Oracle reported $55.7 billion in capex, including new data centers, in its 2026 fiscal year. Oracle has developed several financing models, including supplier financing arrangements, customer prepayments, and \"bring your own hardware\" deals in which customers purchase hardware while Oracle provides the cloud infrastructure and operations. Business Insider reported last month that Oracle had drawn up plans for a new round of job cuts to reduce payroll as it racks up billions in debt to fund AI infrastructure. Alphabet and Tesla recently increased their capex projections, sending their stocks tumbling in July. Meta narrowed its own capex forecast range. Have a tip? Contact this reporter via email at astewart@businessinsider.com or Signal at +1-425-344-8242. Use a personal emai", "date_str": "2026-09-10T23:00:47+00:00", "hash": "ad5119f70c8a4f7b", "title_fa": "اوراکل پیش بینی سرمایه خود را حفظ می کند و رشد ابری را گزارش می دهد و سهام را 7 درصد افزایش می دهد.", "summary_fa": "اوراکل. بلومبرگ/گتی ایماژ اوراکل پیش بینی هزینه های سرمایه ای مالی 2027 خود را بین 90 تا 95 میلیارد دلار حفظ کرد. اوراکل رشد 121 درصدی ابری را گزارش داد که پس از گزارش درآمد خود، سهام را تا 7 درصد افزایش داد. اوراکل در میان فشار برای متعادل کردن هزینه‌های هوش مصنوعی و سودآوری، مدل‌های جدید تامین مالی را تبلیغ می‌کند. اوراکل از پیش بینی هزینه های مرکز داده خود حمایت می کند. روز پنجشنبه، اوراکل 28.5 میلیارد دلار مخارج سرمایه در سه ماهه اول را گزارش کرد که نسبت به 8.5 میلیارد دلار در سال گذشته افزایش یافته است. این کشور پیش‌بینی هزینه‌های سرمایه‌ای سال مالی 2027 خود را بین 90 تا 95 میلیارد دلار، از جمله هزینه‌های مرکز داده، حفظ کرد. پیش بینی سرمایه آن نسبت به دستورالعملی که برای اولین بار در ماه ژوئن منتشر کرد، تغییری نکرده است. بسیاری از شرکت‌های بزرگ ابری همچنان به افزایش پیش‌بینی‌های هزینه‌های هوش مصنوعی خود ادامه داده‌اند، زیرا برای ایجاد مراکز داده بیشتر و افزایش ظرفیت هوش مصنوعی رقابت می‌کنند - به جز مایکروسافت که پیش‌بینی سرمایه خود را در ماه جولای بدون تغییر نگه داشت و همچنین پس از گزارش درآمد، شاهد افزایش سهام خود بود. در پاسخ به این سوال که اوراکل تا چه زمانی به مخارج زیرساختی سنگین هوش مصنوعی خود ادامه خواهد داد، Clay Magouyrk، مدیر عامل شرکت، در عوض بر نحوه تامین مالی این پروژه ها توسط شرکت تمرکز کرد. او گفت: «ما باید در ذهن خود تفکیک کنیم که Oracle مستقیماً چه چیزی را به عنوان سرمایه خرج می‌کند، و آن را مستقیماً از نحوه تفکر ما در مورد چگونگی رشد تجارت جدا کنیم. پس از اینکه این شرکت رشد ۱۲۱ درصدی درآمد زیرساخت‌های ابری را در انتشار درآمد سه‌ماهه اول خود گزارش داد، سهام اوراکل ۷ درصد افزایش یافت، که ظاهراً نگرانی‌های"}, {"source": "Business Insider", "title": "OpenAI pulls out of Caltech math hackathon after mathematicians issue open letter criticizing AI math 'slop'", "link": "https://www.businessinsider.com/openai-caltech-ai-math-hackathon-backlash-anthropic-2026-9", "summary": "OpenAI backed out of sponsoring a mathathon at CalTech after mathematicians signed an open letter decrying AI s effects on the field. Bloomberg/Getty Images OpenAI pulled its sponsorship of Caltech's AI math hackathon. Mathematicians warned the event could fuel \"slop mathematics.\" Event organizers said they intended for the event to be a showcase for responsible AI use. The latest math problem OpenAI is trying to solve is a bunch of angry mathematicians. A researcher at OpenAI said on Thursday that the ChatGPT maker is no longer sponsoring Caltech's \"math hackathon,\" an event where participants use large language models to solve research problems. OpenAI's exit follows an open letter released on Wednesday from current and former Caltech mathematicians, who said the event, which is sponsored by AI companies , \"is likely to have destructive impacts for the mathematical community.\" \"We recognize that the rapid progress of AI in mathematics is disruptive,\" Dan Roberts, OpenAI's research lead, said on X. \"We're looking to engage with the math community more on the best way to integrate this technology and communicate its impacts.\" At issue, according to the mathematicians, is the manner in which AI companies claim to solve outstanding theoretical problems using their models and then leave practical applications and proofs to actual researchers. They call this \"slop mathematics.\" \"After the latest result is dropped, research mathematicians are compelled to step in to properly verify, disseminate, and sometimes discredit entirely the claimed results,\" the academics said. \"This labor goes uncompensated, uncredited, and unacknowledged.\" The drama reached a fever pitch on Tuesday when OpenAI announced its agents had solved the Navier-Stokes equations , a 90-year-old set of mathematical formulas that can predict how liquids and gases move. Tristan Buckmaster, an NYU mathematician who, alongside another academic, published research on the problem on Monday, said on Tuesday that OpenAI might have used his conversations with AI chatbots, including OpenAI's, to arrive at a solution. OpenAI said it couldn't rule out that \"de-identified data derived from their usage of our products helped improve our models⁠.\" The mathematicians also said they believed the CalTech event would serve as unfair advertising for AI companies, who \"will take credit for the effort of talented undergrads.\" Anthropic, which is also sponsoring the event, did not immediately respond to a request for ", "date_str": "2026-09-10T22:46:44+00:00", "hash": "ec96d552f4d27fad", "title_fa": "پس از انتشار نامه سرگشاده ریاضیدانان در انتقاد از \"شیب\" ریاضی هوش مصنوعی، OpenAI از هکاتون ریاضی Caltech خارج شد.", "summary_fa": "پس از اینکه ریاضیدانان نامه ای سرگشاده را امضا کردند که در آن تأثیرات هوش مصنوعی در این زمینه را محکوم کردند، OpenAI از حمایت مالی از مسابقات ریاضی در CalTech کنار کشید. بلومبرگ/گتی ایمیجز OpenAI حمایت مالی خود را از هکاتون ریاضی هوش مصنوعی Caltech گرفت. ریاضیدانان هشدار دادند که این رویداد می تواند به \"ریاضیات شیب دار\" دامن بزند. برگزارکنندگان رویداد گفتند که قصد دارند این رویداد ویترینی برای استفاده مسئولانه از هوش مصنوعی باشد. آخرین مشکل ریاضی که OpenAI در تلاش برای حل آن است، یک دسته از ریاضیدانان عصبانی است. یکی از محققان در OpenAI روز پنجشنبه گفت که سازنده ChatGPT دیگر از \"هکاتون ریاضی\" Caltech حمایت نمی کند، رویدادی که در آن شرکت کنندگان از مدل های زبان بزرگ برای حل مشکلات تحقیقاتی استفاده می کنند. خروج OpenAI به دنبال نامه سرگشاده ای است که روز چهارشنبه از ریاضیدانان فعلی و سابق Caltech منتشر شد، که گفته بود این رویداد، که توسط شرکت های هوش مصنوعی حمایت می شود، \"احتمال دارد اثرات مخربی برای جامعه ریاضی داشته باشد.\" دن رابرتز، سرپرست تحقیقات OpenAI، در X گفت: «ما می‌دانیم که پیشرفت سریع هوش مصنوعی در ریاضیات مخل است. \"ما به دنبال تعامل بیشتر با جامعه ریاضی در مورد بهترین راه برای ادغام این فناوری و انتقال تاثیرات آن هستیم.\" به گفته ریاضیدانان موضوع، روشی است که شرکت‌های هوش مصنوعی ادعا می‌کنند که مسائل نظری برجسته را با استفاده از مدل‌های خود حل می‌کنند و سپس کاربردها و اثبات‌های عملی را به محققان واقعی واگذار می‌کنند. آنها این را \"ریاضیات شیب دار\" می نامند. دانشگاهیان می‌گویند: «پس از حذف آخرین نتیجه، ریاضیدانان پژوهشگر مجبورند برای راستی‌آزمایی، انتشار و گاهی اوقات بی‌اعتبار کردن کامل نتایج ادعا شده وارد عمل شوند». \"این کار بدون جبران، بی اعتبار و ناشناخته می رود.\" این درام روز سه‌شنبه زمانی که OpenAI اعلام"}, {"source": "Business Insider", "title": "The best travel jackets for women", "link": "https://www.businessinsider.com/guides/style/best-travel-jackets-women", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more If you re asking yourself, Should I bring a jacket? then a lightweight windbreaker is usually the answer. Olivia Rose Rushing, Gabrielle Chase/Business Insider It's easy to pack when you're headed somewhere warm and all you need are your bikinis. But as this new season brings unpredictable forecasts, the only safe way to dress is to put on a packable travel jacket. Anything too heavy could take up an entire half of your suitcase, or else end up shrouding your outfit. It's all about layering with intention. The best travel jackets for women we tested kept us warm without adding bulk. These include reversible coats with removable hoods, made with malleable fabrics that fit compactly in our carry-ons . Our most-worn jackets will keep you warm in a drafty plane cabin, and still look effortlessly chic as you navigate busy airports. From chore jackets to water-repellent raincoats , here are the best travel jackets to pack this fall. How we tested travel jackets To find the best travel jackets for women, we researched dozens of top-rated and best-selling styles, comparing key features like weight, packability, and versatility. From there, we narrowed the field to a shortlist of standout options for hands-on testing. Our team of editors and style contributors have evaluated jackets based on materials, durability, and practical features — such as insulation, stowable hoods, pockets, wrinkle resistance, and water repellency— as well as size inclusivity and color options. We chose brands known to us for their quality and consistency, prioritizing those that have overwhelmingly positive reviews. Our editors then tested the top picks in a range of real-world conditions. This includes packing them in our bags, seeing how well they fared in light breezes and misty rain, and matching them to casual and formal outfits. The final selections reflect a combination of thorough research and firsthand testing, ensuring each jacket is functional, lightweight, and easy to wear while traveling. Learn more about how the Reviews team tests clothing at BI, and see our guide to the best travel pants for more wrinkle-free travel outfits . Best overall: FP Movement Pippa Packable Puffer Jacket Talia Ergas/Business Insider After seeing this quilted jacket from Free People all over my For You Page , I was excited to give it a test run, right as the season is beginning to change. The Pippa Puffer i", "date_str": "2026-09-10T22:13:37+00:00", "hash": "7a9e9a963dcbf9fd", "title_fa": "بهترین کت های مسافرتی برای زنان", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید اگر از خود می‌پرسید، آیا باید ژاکت بیاورم؟ پس بادشکن سبک وزن معمولاً جواب می دهد. Olivia Rose Rushing، Gabrielle Chase/Business Insider وقتی به مکانی گرم می روید بسته بندی آسان است و تنها چیزی که نیاز دارید بیکینی است. اما از آنجایی که این فصل جدید پیش‌بینی‌های غیرقابل پیش‌بینی را به همراه دارد، تنها راه مطمئن برای لباس پوشیدن، پوشیدن یک ژاکت مسافرتی است. هر چیزی بیش از حد سنگین می تواند نیمی از چمدان شما را اشغال کند یا در نهایت لباس شما را پوشانده باشد. همه چیز در مورد لایه بندی با قصد است. بهترین کت‌های مسافرتی برای زنان که آزمایش کردیم، ما را گرم نگه می‌داشتند، بدون اینکه حجم زیادی به آن اضافه شود. اینها شامل کتهای برگشت پذیر با هودهای قابل جابجایی است که با پارچه های چکش خوار ساخته شده اند که به طور فشرده در وسایل دستی ما قرار می گیرند. پوشیده‌ترین ژاکت‌های ما شما را در یک کابین هواپیمای شلوغ گرم نگه می‌دارد و همچنان هنگام حرکت در فرودگاه‌های شلوغ، بدون دردسر شیک به نظر می‌رسد. از ژاکت های سخت گرفته تا بارانی های ضد آب، در اینجا بهترین کت های مسافرتی برای بسته بندی پاییز امسال آورده شده است. ما چگونه کت های مسافرتی را آزمایش کردیم برای یافتن بهترین کت های مسافرتی برای زنان، ده ها سبک برتر و پرفروش را بررسی کردیم و ویژگی های کلیدی مانند وزن، بسته بندی و تطبیق پذیری را با هم مقایسه کردیم. از آنجا، ما زمینه را به لیست کوتاهی از گزینه های برجسته برای آزمایش عملی محدود کردیم. تیم ویراستاران و همکاران سبک ما، ژاکت‌ها را بر اساس مواد، دوام و ویژگی‌های کاربردی - مانند عایق، هودهای قابل نگهداری، جیب‌ها، مقاومت در برابر"}, {"source": "Business Insider", "title": "Top AI researcher Andrew Tulloch ditches Meta to work on training and inference at Anthropic", "link": "https://www.businessinsider.com/andrew-tulloch-ditches-meta-for-training-and-inference-at-anthropic-2026-9", "summary": "Anthropic s developer conference in May. Don Feria/AP Content Services for Anthropic Andrew Tulloch, a star AI researcher, is leaving Meta for Anthropic. Prior to Meta, Tulloch worked at the AI startup Thinking Machines Lab and, before that, at OpenAI. At Anthropic, Tulloch will work to optimize AI training and inference. After less than a year at Meta, the prominent AI researcher Andrew Tulloch is leaving for Anthropic. He'll start next week, an Anthropic spokesperson told Business Insider, and work on the startup's inference and performance team, where he'll aim to optimize the training of Anthropic's AI models and how they respond to users. As AI's talent wars steam on, Tulloch has become one of the most sought-after researchers. He had worked at Meta for 11 years prior to this latest stint, leaving for OpenAI in 2023. At OpenAI, he helped train its GPT-4o, GPT-4.5, and o3 models. He then cofounded Thinking Machines Lab in 2025. Last year, while he was working at the AI startup, he turned down a pay offer from Meta CEO Mark Zuckerberg that could have totalled $1.5 billion, The Wall Street Journal reported. He ended up decamping for Meta in October. Now, Tulloch will bring that extensive experience to Anthropic. Tulloch and Meta did not immediately respond to requests for comment. He's leaving the social media giant shortly after it launched Muse, an AI agent meant to autonomously complete tasks for users. Anthropic, Meta, OpenAI, Google, and other tech companies have been in a pitched battle for AI researchers since the release of ChatGPT, giving experienced workers like Tulloch a great deal of leverage — and earning power. Semafor first reported that Tulloch was leaving Meta. For Anthropic, the hire may offer some calm in an intense moment. The company is preparing for its initial public offering , dueling with rivals for business, and reckoning with mounting concerns about the adverse effects of AI. The researcher Jacob Coxon sparked a wave of concern this week when he announced that he'd resigned from Anthropic and wrote that the \"people building AI earnestly believe that it could kill us all by the end of the decade.\" Have a tip? Contact this reporter via email at scouncil@businessinsider.com , or over text, Signal, Telegram, or WhatsApp at 415-757-8198. Use a personal email address, a nonwork WiFi network, and a nonwork device; here's our guide to sharing information securely. Read the original article on Business Insider", "date_str": "2026-09-10T21:14:12+00:00", "hash": "ee81814a50baba24", "title_fa": "اندرو تولوچ، محقق برتر هوش مصنوعی، متا را کنار می گذارد تا در آنتروپیک روی آموزش و استنتاج کار کند", "summary_fa": "کنفرانس توسعه دهندگان Anthropic در ماه می. Don Feria/AP Content Services for Anthropic Andrew Tulloch، محقق هوش مصنوعی ستاره، Meta را به مقصد Anthropic ترک می کند. قبل از متا، تولوچ در آزمایشگاه استارتاپ هوش مصنوعی Thinking Machines Lab و قبل از آن در OpenAI کار می کرد. در Anthropic، Tulloch برای بهینه سازی آموزش و استنتاج هوش مصنوعی کار خواهد کرد. پس از کمتر از یک سال در متا، محقق برجسته هوش مصنوعی اندرو تولوچ به آنتروپیک می رود. سخنگوی آنتروپیک به Business Insider گفت که او هفته آینده کار خود را آغاز خواهد کرد و روی تیم استنباط و عملکرد استارتاپ کار خواهد کرد، جایی که هدف او بهینه سازی آموزش مدل های هوش مصنوعی Anthropic و نحوه پاسخ آنها به کاربران است. با ادامه جنگ استعدادهای هوش مصنوعی، Tulloch به یکی از پرطرفدارترین محققان تبدیل شده است. او قبل از این آخرین دوره، 11 سال در متا کار کرده بود و در سال 2023 به OpenAI رفت. در OpenAI، او به آموزش مدل‌های GPT-4o، GPT-4.5 و o3 کمک کرد. او سپس در سال 2025 آزمایشگاه ماشین‌های فکری را تأسیس کرد. به گزارش وال استریت ژورنال، سال گذشته، زمانی که در استارت‌آپ هوش مصنوعی کار می‌کرد، پیشنهاد دستمزد مارک زاکربرگ، مدیرعامل متا را رد کرد. او در ماه اکتبر برای متا از اردو خارج شد. اکنون، تولوچ آن تجربه گسترده را به آنتروپیک خواهد آورد. تولوچ و متا بلافاصله به درخواست‌ها برای اظهار نظر پاسخ ندادند. او اندکی پس از راه‌اندازی Muse، غول رسانه‌های اجتماعی را ترک می‌کند، یک عامل هوش مصنوعی که قرار است وظایف کاربران را به‌طور مستقل انجام دهد. Anthropic، Meta، OpenAI، Google و سایر شرکت‌های فناوری از زمان انتشار ChatGPT در نبردی سخت برای محققان هوش مصنوعی بوده‌اند و به کارگران باتجربه‌ای مانند Tulloch اهرم زیادی - و قدرت کسب درآمد می‌دهند. سمافور ابتدا"}, {"source": "Business Insider", "title": "Trump's new Air Force One has had a rough journey of security concerns and operational mishaps. Here's a complete timeline.", "link": "https://www.businessinsider.com/trumps-new-air-force-one-qatari-747-timeline-2026-9", "summary": "President Donald Trump s new Air Force One, a VC-25B Bridge. SAUL LOEB/AFP via Getty Images ; Brendan SMIALOWSKI/AFP via Getty Images President Donald Trump's new Air Force One, a VC-25B Bridge, entered service in July. The jet, gifted by Qatari royals, has sparked security concerns and experienced operational mishaps. On Wednesday, the new Air Force One's emergency slide was accidentally deployed on the tarmac. When an emergency slide on Trump's new Air Force One deployed on the tarmac at Joint Base Andrews on Wednesday, delaying President Donald Trump's flight, the president was asked if he was sure that his new presidential jet was safe to fly. Trump's reply: \"Yeah, I am, or I wouldn't be on it.\" Trump's latest addition to the presidential fleet , a VC-25B Bridge aircraft, is meant as an interim jet to bridge the gap between the older VC-25A planes from the 1990s and Boeing's forthcoming but long-delayed VC-25B presidential jets . Since Trump's first flight on the Qatari luxury jet on July 1, the new Air Force One has sparked security concerns and experienced operational mishaps as it has been brought in and out of service. \"We don't comment on specific upgrades or modifications to Air Force One,\" a senior administration official told Business Insider. \"We maintain a consistent posture that ensures a safe, secure, and reliable capability for the President of the United States and routinely evolve the capability as required to maintain that posture. It is the greatest presidential plane ever built.\" Here's a timeline of its service as Air Force One, and the issues it has experienced thus far. June 19: Trump unveiled the new VC-25B Bridge at Joint Base Andrews The VC-25B Bridge aircraft at Joint Base Andrews. US Air Force courtesy photo The new Air Force One , a customized Boeing 747-8i valued at around $400 million, was gifted to Trump by the Qatari royal family. With a range of 8,900 miles at 660 miles per hour and four GEnx-2B engines, each with 66,500 pounds of thrust, the VC-25B Bridge can fly faster and farther than the old VC-25A presidential jets. The plane was also painted in the red, white, and blue, a color scheme Trump has advocated for since his first White House term. \"With the extraordinary devotion of many of you here today, this plane was transformed into a flying White House at a level of luxury that nobody's ever seen before,\" Trump said in his remarks at Joint Base Andrews. July 8: Trump did not board the VC-25B Bridge in Turkey amid s", "date_str": "2026-09-10T21:03:20+00:00", "hash": "1dcc7964452f9389", "title_fa": "ایر فورس وان جدید ترامپ سفری سخت از نگرانی های امنیتی و ناگواری های عملیاتی داشته است. در اینجا یک جدول زمانی کامل است.", "summary_fa": "ایر فورس وان جدید رئیس جمهور دونالد ترامپ، یک پل VC-25B. SAUL LOEB/AFP از طریق گتی ایماژ. Brendan SMIALOWSKI/AFP از طریق گتی ایماژ پل VC-25B، ایر فورس وان، رئیس جمهور دونالد ترامپ، در ماه جولای وارد خدمت شد. این جت که توسط خانواده سلطنتی قطر هدیه داده شده است، نگرانی‌های امنیتی را برانگیخته و مشکلات عملیاتی را تجربه کرده است. روز چهارشنبه، سرسره اضطراری جدید ایر فورس وان به طور تصادفی روی آسفالت مستقر شد. هنگامی که یک لغزش اضطراری در هواپیمای جدید ایر فورس وان ترامپ در روز چهارشنبه بر روی آسفالت در پایگاه مشترک اندروز مستقر شد و پرواز دونالد ترامپ رئیس جمهور آمریکا را به تاخیر انداخت، از رئیس جمهور پرسیده شد که آیا مطمئن است که جت جدید ریاست جمهوری او برای پرواز امن است یا خیر. پاسخ ترامپ: بله، من هستم، وگرنه در آن حضور ندارم. جدیدترین هواپیمای ترامپ به ناوگان ریاست جمهوری، یک هواپیمای VC-25B Bridge، به عنوان یک جت موقت برای پر کردن شکاف بین هواپیماهای قدیمی VC-25A از دهه 1990 و جت های ریاست جمهوری آینده اما با تاخیر طولانی مدت بوئینگ طراحی شده است. از زمان اولین پرواز ترامپ با جت لوکس قطر در 1 ژوئیه، ایر فورس وان جدید نگرانی‌های امنیتی را برانگیخت و در هنگام ورود و خروج از سرویس، مشکلات عملیاتی را تجربه کرد. یک مقام ارشد دولت به Business Insider گفت: «ما در مورد ارتقا یا اصلاحات خاصی در Air Force One اظهار نظر نمی کنیم. \"ما وضعیت ثابتی را حفظ می کنیم که توانایی ایمن، ایمن و قابل اعتماد را برای رئیس جمهور ایالات متحده تضمین می کند و به طور معمول توانایی را همانطور که برای حفظ این وضعیت لازم است، توسعه می دهیم. این بزرگترین هواپیمای ریاست جمهوری است که تا کنون ساخته شده است.\" در اینجا جدول زمانی خدمات آن به عنوان ایر"}, {"source": "Business Insider", "title": "Uber's CEO says you could see lower ride prices as a result of its layoffs", "link": "https://www.businessinsider.com/uber-price-cuts-ceo-dara-layoffs-savings-2026-9", "summary": "Uber riders can expect lower prices due to savings from layoffs and insurance costs, CEO Dara Khosrowshahi said. Chip Somodevilla/Getty Images Uber is using some of the money it saved from laying people off to cut ride prices. Uber will also use savings from lower insurance costs to reduce prices, CEO Dara Khosrowshahi said. Uber cut about 10% of its corporate roles, or about 3,300 people, last week. Lower ride prices could be coming to Uber after the company's recent layoffs. CEO Dara Khosrowshahi pointed to lower prices as one way that Uber plans to use the money it's saving from laying off 10% of its corporate workforce, or about 3,300 people. The company announced the job cuts earlier this month. \"We are going to take the savings there and essentially reinvest it back in the business, lowering prices, improving selection, and continuing to invest in our growth program,\" the CEO said during a presentation at the Goldman Sachs Communacopia + Technology Conference on Thursday. Uber is also planning to put savings from insurance costs toward lower prices — a move that should help keep riders using Uber's app, he said. The layoffs came as Uber has largely exceeded analysts' expectations in recent quarterly earnings reports. The company's stock also rose about 2% on Thursday after it disclosed in an SEC filing that Khosrowshahi had added about $10 million in Uber stock to his holdings. Khosrowshahi said that Uber picked the right time to make the layoffs because the company was in \"a position of strength versus weakness.\" \"Some companies wait,\" he said. \"We don't believe in waiting.\" Do you have a story idea about Uber? Contact this reporter at abitter@businessinsider.com or via encrypted messaging app Signal at 808-854-4501. Use a personal email address, a nonwork WiFi network, and a nonwork device; here's our guide to sharing information securely. Read the original article on Business Insider", "date_str": "2026-09-10T20:59:53+00:00", "hash": "92c1bd6db0293ae4", "title_fa": "مدیر عامل اوبر می‌گوید در نتیجه اخراج‌های این شرکت، می‌توانید قیمت‌های سواری کمتری را مشاهده کنید", "summary_fa": "دارا خسروشاهی، مدیر عامل شرکت Uber گفت: سواران اوبر به دلیل صرفه جویی در هزینه های اخراج و بیمه می توانند انتظار قیمت های پایین تری داشته باشند. Chip Somodevilla/Getty Images اوبر از بخشی از پولی که از اخراج افراد پس انداز کرده است برای کاهش قیمت سواری استفاده می کند. دارا خسروشاهی، مدیرعامل اوبر همچنین از پس انداز ناشی از کاهش هزینه های بیمه برای کاهش قیمت ها استفاده خواهد کرد. اوبر هفته گذشته حدود 10 درصد از نقش های شرکتی خود یا حدود 3300 نفر را کاهش داد. پس از اخراج‌های اخیر این شرکت، قیمت‌های سواری پایین‌تر ممکن است به اوبر بیاید. دارا خسروشاهی، مدیر عامل شرکت، به کاهش قیمت ها به عنوان یکی از راه هایی اشاره کرد که اوبر قصد دارد از پولی که از اخراج 10 درصد از نیروی کار شرکت یا حدود 3300 نفر پس انداز می کند، استفاده کند. این شرکت در اوایل ماه جاری اعلام کرد که مشاغل خود را کاهش می دهد. مدیرعامل شرکت در طی ارائه‌ای در کنفرانس فناوری گلدمن ساکس Communacopia + در روز پنجشنبه گفت: «ما پس‌اندازها را به آنجا می‌بریم و اساساً آن را دوباره در تجارت، کاهش قیمت‌ها، بهبود انتخاب و ادامه سرمایه‌گذاری در برنامه رشد خود، دوباره سرمایه‌گذاری می‌کنیم». اوبر همچنین در حال برنامه ریزی برای صرفه جویی در هزینه های بیمه به سمت قیمت های پایین تر است - حرکتی که باید به استفاده از برنامه Uber کمک کند. این اخراج در حالی رخ داد که اوبر تا حد زیادی از انتظارات تحلیلگران در گزارش های درآمد سه ماهه اخیر فراتر رفته است. پس از اینکه خسروشاهی در پرونده SEC فاش کرد که خسروشاهی حدود 10 میلیون دلار سهام اوبر را به دارایی های خود اضافه کرده است، سهام این شرکت نیز روز پنجشنبه حدود 2 درصد افزایش یافت. خسروشاهی گفت که اوبر زمان"}, {"source": "Business Insider", "title": "Sam Altman met with top power utilities about securing the electrical grid. He offered one possible solution: OpenAI's cyber services.", "link": "https://www.businessinsider.com/sam-altman-top-power-utilities-about-securing-the-electrical-grid-2026-9", "summary": "OpenAI said on Saturday that it would improve at disclosing instances of rogue agents breaking into the internet. Sean Rayford/Getty Images OpenAI has met with multiple top power companies to discuss methods of securing the electrical grid, the AI firm told POLITICO. The conversations occurred amid a series of revelations about OpenAI's products' role in a cyberattack. Sam Altman offered one possible solution to the cybersecurity risks: OpenAI's own cyber services. OpenAI has met with representatives of multiple top power companies to discuss methods of securing the electrical grid, the artificial intelligence firm told POLITICO — conversations that occurred amid a continuing series of revelations about its own products' role in a sprawling cyberattack. CEO Sam Altman has also offered one possible solution to the cybersecurity risks: OpenAI's own cyber services. The energy security discussions, two of which were not previously reported, started July 20. Altman most recently met with electric utility executives Wednesday during the Edison Electric Institute's annual meeting in Colorado Springs, Colorado, according to OpenAI and the institute. The briefings began shortly after the artificial intelligence platform Hugging Face announced in July that an autonomous AI system had hacked its servers but before OpenAI disclosed that its own rogue agents had perpetrated the attack. Further details have emerged since then about the unprecedented breach, including a report that about 700 AI agents participated in the exploit over a seven-day period without OpenAI's knowledge. OpenAI's more recent meetings have sought in part to address the risks posed by these kinds of autonomous hacks. At Wednesday's meeting, Altman informed the energy executives of how OpenAI is attempting to ensure that the most advanced AI models cannot be misused to threaten grid security, the company told POLITICO. He also discussed the prospect of partnering with the companies to use AI for enhancing their cyber defenses through Daybreak , OpenAI's $1 billion cybersecurity initiative aimed at patching vulnerabilities in critical systems. The impact of data center security on the grid was on the agenda as well. The power companies in attendance included Duke Energy, Exelon, Southern Co. and NextEra Energy, which did not respond to requests for comment. Utility companies may face limitations on tech investments due to regulatory restraints on recovering costs from the expenditures through rate i", "date_str": "2026-09-10T20:58:57+00:00", "hash": "4350578458eec7b9", "title_fa": "سام آلتمن با شرکت های برق برتر درباره ایمن سازی شبکه برق ملاقات کرد. او یک راه حل ممکن را ارائه کرد: خدمات سایبری OpenAI.", "summary_fa": "OpenAI روز شنبه گفت که در افشای موارد نفوذ عوامل سرکش به اینترنت بهبود خواهد یافت. شرکت هوش مصنوعی به پولیتیکو گفت: شان ریفورد/گتی ایماژ OpenAI با چندین شرکت برتر برق ملاقات کرده است تا درباره روش‌های ایمن‌سازی شبکه برق بحث کند. این گفتگوها در بحبوحه یک سری افشاگری در مورد نقش محصولات OpenAI در یک حمله سایبری رخ دا re signing up for (since Apple TV only offers one monthly plan). The standard bundle combines Peacock Premium, which carries ad-supported programming across the full Peacock on-demand library, and Apple TV. This tier also has select Peacock sports live streaming. The Apple TV bundle that includes Peacock Premium Plus offers ad-free on-demand streaming, sports live streaming, and a 24/7 live stream of your local NBC station. All plans include ad-free on-demand programming from Apple TV and applicable Apple sports streaming options. Explore the Peacock and Apple TV bundle options Both apps have always had a stellar slate of original content, making the cut in our guide to the best streaming services . Peacock's massive back catalog of NBC and Bravo shows is particularly impressive. Apple TV and Peacock have become increasingly major players in the sports streaming scene, taking the apps from nice-to-haves to must-haves for sports fans. Peacock streams the Olympics, Sunday Night Football, Premier League soccer, and several other sporting events, but it recently upped its game by nabbing the rights to several NBA games (including some that won't air on NBC). Apple TV has found similar success with Friday Night MLB games and MLS matches, and it has continued to become a pivotal sports streamer with its acquisition of Formula 1 broadcast rights, which kicked off in 2026. The bundles cost $18 a month (Premium) or $23 a month (Premium Plus), which is 34% to 36% less than what you'd pay for the two services each month when subscribed separately. Apple TV normally costs $15 a month, and Peacock costs $13 a month for Premium or $20 a month for Premium Plus. Keep reading to learn more about the bundles, including how to sign up. Bundling Apple TV and Peacock together is an easy way to save on streaming each month. Lillian Brown/Business Insider FAQ How do you sign up for the Apple TV and Peacock bundle? You can sign up for the Ap", "date_str": "2026-09-10T20:58:46+00:00", "hash Mark Zuckerberg. Tom Williams/CQ-Roll Call, Inc via Getty Images Meta is asking some employees in its Applied AI division if they want to become managers again. Meta had previously converted those people from management roles as part of a reorganization. It marks a partial reversal for Meta, which has heavily targeted managers for layoffs. Meta wants some of its employees to be managers again. The social media giant has been asking some individual contributors in its Applied AI (AAI) division to transition back into management roles as part of a recent reshuffle, four people with knowledge of the matter told Business Insider. This program is opt-in, a person familiar said. AAI is a newly-launched Meta division focused on training AI models. Meta launched the group this year and reassigned roughly 7,000 employees to it. Some of those people were previously managers and given individual contributor roles within AAI. Meta declined to comment. The move marks a partial reversal for Meta, which has spent much of the past year cutting middle management and promoting smaller, flatter teams as more efficient. Meta CEO Mark Zuckerberg has praised lean startup-style organizations, particularly as AI takes on more work. Meta eliminated about 10% of its workforce this year through mass layoffs intended to \"run the company more efficiently\" and offset its huge AI investments. The layoffs heavily targeted managers , a Business Insider analysis of public layoff notices found. This isn't the first time Meta has reversed course on some of its internal initiatives. The company allowed some employees reassigned to AAI to leave the organization, after criticism from some employees that they had been \"drafted\" into the unit. Not all tech companies have fully embraced the manager-lite, small teams model. Uber, for example , announced it was cutting half of its \"micro-teams\" as part of recent layoffs. Have a tip? Contact Hugh via email at hlangley@businessinsider.com or Signal at 628 داد که اخراج ها به شدت مدیران را هدف قرار داده است. این اولین بار نیست که"}, {"source": "Business Insider", "title": "Best fresh dog food", "link": "https://www.businessinsider.com/guides/pets/best-fresh-dog-food", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We tried eight fresh dog food brands before landing on our top picks from The Farmer s Dog, JustFoodForDogs, and Freshpet. Jaclyn Turner; Jill Waldbieser; Elizabeth Holbrook/Business Insider Several companies offer fresh dog food made with gently cooked, whole foods. These diets are often very appealing to dogs, but finding the right one for your pet can be overwhelming. For this guide, we tested eight fresh dog food delivery services. I tested seven of them with my dog, Lyla, and recruited several other reporters and their pups to ensure consistent quality and service among our top picks. I also consulted two board-certified veterinary nutritionists and a food safety expert to better understand canine nutrition and the safety of fresh pet food. The best fresh dog food at a glance Best overall: JustFoodForDogs is our favorite fresh dog food, thanks to its wide variety of frozen and shelf-stable recipes supported by pet nutrition research and feeding trials. Best on a budget: The Farmer's Dog offers excellent value and seven feed-trial-tested, fresh-frozen recipes. Best for food puzzles and training: Freshpet Delivery features five different recipes that only require refrigeration and are easy to scoop and serve. Ultimately, the best fresh dog food brands lead the pack with expertly formulated healthy recipes, rigorous quality control, convenient home delivery, and generous discounts for new subscribers. No matter which food you choose, make sure it meets the Association of American Feed Control Officials (AAFCO) standards for complete and balanced nutrition. Veterinarians also recommend choosing foods from brands that adhere to the Global Nutrition Guidelines published by the World Small Animal Veterinary Association (WSAVA). If you're switching to fresh pet food, keep in mind that it's not necessarily healthier than our top picks for canned and dry dog food . Researchers at the University of Minnesota's Urolith Center recently identified a new type of canine bladder stone — calcium tartrate tetrahydrate (CTT) — linked to choline bitartrate, an ingredient used in some fresh dog foods and supplements, including recipes from JustFoodForDogs, The Farmer's Dog, and Nom Nom. If your dog has CTT stones, consult your vet about switching to a choline bitartrate-free food, such as formulas from Hill's, Royal Canin, or Purina. Read more about how Business Insider Reviews te", "date_str": "2026-09-10T20:38:59+00:00", "hash": "81ede286b0e51259", "title_fa": "بهترین غذای تازه سگ", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید ما هشت برند تازه غذای سگ را امتحان کردیم قبل از اینکه به بهترین انتخاب‌هایمان از The Farmer s Dog، JustFoodForDogs و Freshpet رسیدیم. جاکلین ترنر؛ جیل والدبیزر; الیزابت هالبروک/Business Insider چندین شرکت غذای تازه سگ را ارائه می دهند که با غذاهای کامل و به آرامی پخته شده باشد. این رژیم‌ها اغلب برای سگ‌ها بسیار جذاب هستند، اما یافتن رژیم غذایی مناسب برای حیوان خانگی شما می‌تواند سخت باشد. برای این راهنما، ما هشت سرویس تحویل غذای تازه سگ را آزمایش کردیم. من هفت نفر از آنها را با سگم لایلا آزمایش کردم و چندین خبرنگار دیگر و توله هایشان را به خدمت گرفتم تا از کیفیت و خدمات ثابت در میان برترین انتخاب هایمان اطمینان حاصل کنم. من همچنین با دو متخصص تغذیه دامپزشکی دارای گواهی هیئت مدیره و یک متخصص ایمنی مواد غذایی برای درک بهتر تغذیه سگ ها و ایمنی غذای تازه حیوانات خانگی مشورت کردم. بهترین غذای تازه سگ در یک نگاه به طور کلی بهترین: JustFoodForDogs غذای تازه مورد علاقه ما برای سگ است، به لطف طیف گسترده ای از دستور العمل های منجمد و قابل نگهداری که توسط تحقیقات تغذیه حیوانات خانگی و آزمایشات تغذیه پشتیبانی می شود. بهترین با بودجه: سگ gal work until pickup. A peaceful morning soon turned disastrous: One jetliner, then another, had swooped low and smashed into the World Trade Center. My neighbors and I watched in horror as flames roared from the Twin Towers. I didn't yet know how the attacks would shatter our country's invincibility and sear our souls for the next generation. All I could think of was the people up there. When the structures collapsed and debris surged across the East River, I ran. Passing my nearby church, I saw the sexton sobbing: \"They've hit the Pentagon too.\" I realized only then that America was under attack. I collected my son, and we bolted for home — as papers and ash swirled in the chemical stench — weeping for a nation, our innocence. and all the lost. A burned document from Cantor Fitzgerald found after the planes struck the Twin Towers. Ramin Talaie/Corbis via Getty Images Less than a year later, I was an attorney at Cantor Fitzgerald, which had lost 658 people atop those Towers. A colleague warned the job \"would be like working in a graveyard,\" but I took the offer. My friend Arlene Fried — a law firm colleague who'd become in-house counsel at Cantor — had died that day. Maybe I could hel", "date_str": "2026-09-10T20:38:32+00:00", "hash": "763c802254407ffa", "title_fa": "\"آن روز آنجا بودی؟\" درون اودیسه 25 ساله کانتور فیتزجرالد از دست دادن و انعطاف پذیری پس از 11 سپتامبر", "summary_fa": "طبقه تجاری کانتور فیتزجرالد قبل از حملات 11 سپتامبر که منجر به کشته شدن 658 کارمند شد. 25 سال از حملات 11 سپتامبر، زمانی که 658 کارمند کانتور فیتزجرالد کشته شدند، می گذرد. کارولین آیکن کوستر سال بعد در حالی که غمگین بود و دوباره ساخته شد به این شرکت پیوست. در زیر مقاله او اقتباس شده از \"خانواده ها\"، کتابی به مناسبت سالگرد 11 سپتامبر است. شرکت مالی Cantor Fitzgerald در 11 سپتامبر بیش از هر شرکت دیگری کارمندان خود را از دست داد: 658 نفر پس از برخورد اولین هواپیما به برج شمالی مرکز تجارت جهانی کشته شدند. به مناسبت بیست و پنجمین سالگرد حملات تروریستی، صندوق امداد کانتور فیتزجرالد ک acquired a company and became a franchisor. This as-told-to essay is based on a conversation with Charles Bonfiglio, CEO of Tint World . It has been edited for length and clarity . I was only 18 when I walked into the family home in Brooklyn and told my mom, dad and sisters, \"We're rich!\" I showed them the order I'd just received: $1 million worth of products for a young lady's clothing brand I'd designed. I was thrilled, but my dad — who operated a clothing factory in Brooklyn — flipped the paper over and read the fine print. I'd be paid 90 days after delivery, but I'd have to front the costs of production: about $500,000, my father guessed. My dad offered to put his house up as collateral for a loan , but I wasn't the type of kid who was going to risk the family home. So, I called the buyer back and explained I couldn't fulfill the order. Charles Bonfiglio s dad taught him a lesson early on in his career. Courtesy of Charles Bonfiglio I started selling at smaller mom-and-pop shops, rather than department stores , because I could produce clothing as-needed, rather than laying out capital up front. I struggled to get a loan without an established brand I learned an important lesson then: as an entrepreneur, you have to think about a whole business plan , not just creating something you're passionate about. I made decent money with my clothing line, and partnered with my brother-in-law to open a pizzeria . But I dreamed of opening an aftermarket stereo shop. When I'd saved about $30,000 to invest in my business, I moved to Florida to start my stereo shop. I had drafted a business plan that told me it would cost about $80,000. I thought the numbers were great, but the bank wouldn't give me a loan, and a landlord wouldn't give me a lease. Both wanted to work with established brands. My cousin got me into franchising Around then, I attended a family wedding where I talked with a cousin who operated a Meineke Car Care Center. My dad and I visited his shop and saw he was happy, busy, and profitable. On the way home my dad told me, \"Charles, take the path of least resistance.\" I took his advice. In the back of my head I figured I could learn from the franchise, and use that knowledge to ", "date_str": "2026-09-10T19:59:01+00:00", "hash": "08c6208c50d7a163", "title_fa": "در 18 سالگی به خانه دویدم و داد زدم: \"ما پولدار هستیم!\" پدرم به سرعت ثابت کرد که اشتباه می کنم.", "summary_fa": "چارلز بونفیگلیو با خانواده اش. به لطف Charles Bonfiglio Charles Bonfiglio پولی برای پر کردن اولین سفارش بزرگ خود برای خط لباس خود نداشت. بعداً، پدرش به او گفت که فرنچایز راه کمترین مقاومت در تجارت است. پس از چندین دهه حق رای دادن، Bonfiglio یک شرکت را خریداری کرد و یک امتیاز دهنده شد. این مقاله همانطور که گفته شد بر اساس گفتگو با چارلز بونفیگلیو، مدیر عامل Tint World است. برای طول و وضوح ویرایش شده است. تنها 18 سال داشتم که وارد خانه خانوادگی در بروکلین شدم و به مادر، پدر و خواهرم گفتم: \"ما پولدار هستیم!\" سفارشی را که به تازگی دریافت کرده بودم به آنها نشان دادم: محصولاتی به ارزش یک میلیون دلار برای برند لباس زنانه جوانی که طراحی کرده بودم. من هیجان زده بودم، اما پدرم - که یک کارخانه پوشاک در بروکلین اداره می کرد - کاغذ را ورق زد و چاپ ریز را خواند. 90 روز پس از تحویل به من دستمزد پرداخت می شود، اما باید هزینه های تولید را جبران کنم: حدود 500000 دلار، پدرم حدس زد. پدرم پیشنهاد داد که خانه‌اش را به عنوان وثیقه برای وام بگذارد، اما من آن بچه‌ای نبودم که خانه خانواده را به خطر بیندازم. بنابراین، من با خریدار تماس گرفتم و توضیح دادم که نمی توانم سفارش را انجام دهم. پدر چارلز بونفیگلیو در اوایل کارش به او درسی داد. با حسن نیت از چارلز بونفیگلیو، من شروع به فروش در مغازه های کوچکتر مادر و پاپ کردم، به جای فروشگاه های بزرگ، زیرا می توانستم لباس های مورد نیاز خود را تولید کنم، نه اینکه سرمایه اولیه را در اختیارم بگذارم. من برای گرفتن وام بدون یک برند معتبر تلاش کردم و در آن زمان درس مهمی آموختم: به عنوان یک کارآفرین، شما باید به یک طرح تجاری کامل فکر کنید،"}, {"source": "Business Insider", "title": "Palantir cofounder and GOP donor says Trump's proposed $5,000 dividend is a 'bribe'", "link": "https://www.businessinsider.com/joe-lonsdale-trump-dividend-response-bribe-2026-9", "summary": "Palantir cofounder Joe Lonsdale mocked President Donald Trump s latest idea of sending money to the American people. Bloomberg/Getty Images Palantir cofounder Joe Lonsdale is no fan of Donald Trump's $5,000 dividend. Lonsdale said Trump's new proposal is a \"bribe.\" Trump said adult US citizens would receive $5,000 checks if the GOP retains control of Congress. Palantir cofounder Joe Lonsdale has a reality check for President Donald Trump 's latest proposal to give Americans cash . \"For the record, I am hugely in favor of winning the midterms, and love much about this admin, but am strongly against bread and circus bribes,\" Lonsdale wrote on X. Lonsdale , who endorsed Trump ahead of the 2024 election, had a pithy comparison for Trump's idea of sending $5,000 checks to adult US citizens if Republicans retain control of Congress this November. Lonsdale invoked the Roman satirist Juvenal's famous phrase, which translates to \"bread and circuses,\" referring to the use of food and entertainment to placate the masses. In another post, Lonsdale questioned why the administration would stop at $5,000. \"Why not 5 million USD to everyone?\" he wrote in a reply. \"I don't see why the average person shouldn't get to be rich - we can just print money, right?\" A White House spokesperson did not immediately respond to a request for comment from Business Insider. Over the last few years, Lonsdale has cemented himself as a major GOP donor. Trump unveiled the proposal on Wednesday during a rollicking address to the Republican Party's first-ever midterm convention. Trump is hoping his presence will boost the GOP, which is aiming to defy historical trendlines of the president's party losing ground in the House. Prediction markets overwhelmingly favor Democrats' chances of retaking the House, though the Senate remains much closer. The map of contested د. پس از هفته‌ها آزمایش در حین کار، خواب، تمرین و مسافرت، متوجه شدم که Fitbit Inspire 3 بدون هیچ سر و صدایی اصول اولیه را می‌سازد. سبک، کم حاشیه و پوشیدن آن راحت است. این به شما می گوید که آیا به اندازه کافی حرکت می کنید، ضربان قلب خود را به اندازه کافی بالا می برید، و خوب می خوابید، همه با دقت قابل اعتماد. من در نهایت آن را بهترین گزینه بودجه در راهنمای خود برای بهترین Fitbits نامیدم. برای 100 دلار، قطعاً برخی معاوضه‌ها وجود دارد که ارزش دانستن قبل از خرید را دارد. اما اگر به دنبال بهبود عادات روزانه برای یک سبک زندگی سالم هستید، این یک ردیاب تناسب اندام ایده آل است. چیزی که من بیشتر دوست دارم Inspire 3 طراحی باریکی دارد و شروع ردیابی بسیار آسان است. Rachael Schultz/Business Insider سبک، کم حاشیه و راحت است اولین چیزی که بعد از دو دقیقه پوشیدن Inspire 3 - چه رسد به دو هفته - متوجه شدم این است که چقدر محجوب است. پس از پوشیدن گارمین‌ها، فیت‌بیت‌ها و سایر ردیاب‌های تناسب اندام"}, {"source": "Business Insider", "title": "President Trump called the affordability crisis fake. His White House is trying to solve it.", "link": "https://www.businessinsider.com/trump-affordability-crisis-fake-food-prices-midterm-convention-inflation-2026-9", "summary": "Donald Trump called affordability fake at the Republican National Convention s midterm convention. Andrew Harnik/Getty Images Trump dismissed the affordability crisis as \"fake,\" despite his efforts to alleviate it. The White House has pushed affordability measures, clashing with Trump's statements ahead of midterms. Trump wants credit for bringing prices down while rejecting that affordability remains a crisis. President Donald Trump often refers to the affordability crisis as a hoax. His White House may not agree. Trump called the crisis a \"fake\" Democrat-created issue on the first night of the Republican National Committee's first-ever midterm convention this week in Dallas. But the remark sits awkwardly beside months of White House messaging that has treated affordability as one of Trump's central economic promises. In his speech, Trump blamed former President Joe Biden for runaway inflation and said affordability concerns were fake \"because I'm bringing the prices way down.\" In the same speech, he promised that every adult US citizen would receive a $5,000 dividend from tariff revenue if Republicans won the midterms — a form of stimulus which economists expect would further exacerbate inflation . Trump claimed that \"food prices and almost every other item are rapidly going down,\" even as consumer prices have increased by 4.3% since January 2025, with groceries up 3.4% and gasoline up 31% amid the ongoing crisis in Iran. This isn't the first time Trump has brushed off affordability concerns, as the administration has at times taken a deal-with-it stance on high prices. In November 2025, Trump told Fox News that Democrats \"have this new word called 'affordability,' and [Republicans] don't talk about it enough.\" Days later, he called affordability a \"con job,\" adding that his party \"did a great job on groceries and affordability,\" and were \"victors on affordability.\" By December, Trump was trying to have it both ways. In a speech in Pennsylvania, he said, \"I have no higher priority than making America affordable again,\" but also described affordability as Democrats' \"new word\" and said, \"they always have a hoax.\" The White House's own messaging has told a different story Just a few days later in December, it acknowledged in a post that affordability is \"finally trending in the right direction .\" As part of the affordability push, the administration pledged to cap credit card interest rates at 10%, open \"Trump accounts\" that allot $1,000 to children born b", "date_str": "2026-09-10T19:16:40+00:00", "hash": "2957a92acf030dfa", "title_fa": "پرزیدنت ترامپ بحران استطاعت را ساختگی خواند. کاخ سفید او در تلاش برای حل آن است.", "summary_fa": "دونالد ترامپ در کنوانسیون میان دوره ای کنوانسیون ملی جمهوری خواهان، مقرون به صرفه بودن را جعلی خواند. اندرو هارنیک/ گتی ایماژ ترامپ، علیرغم تلاش هایش برای کاهش آن، بحران استطاعت را «جعلی» خواند. کاخ سفید اقدامات مقرون به صرفه را اعمال کرده است و با اظهارات ترامپ پیش از انتخابات میان دوره ای مخالف است. ترامپ برای کاهش قیمت ها اعتبار می خواهد و در عین حال رد می کند که مقرون به صرفه بودن همچنان یک بحران است. رئیس جمهور دونالد ترامپ اغلب از بحران استطاعت به عنوان یک فریب یاد می کند. کاخ سفید او ممکن است موافق نباشد. ترامپ در اولین شب نشست میاندوره‌ای کمیته ملی جمهوری‌خواهان در این هفته در دالاس، این بحران را یک موضوع «جعلی» ایجاد شده توسط دموکرات‌ها خواند. اما این اظهارات به طرز عجیبی در کنار ماه‌ها پیام کاخ سفید است که مقرون به صرفه بودن را به عنوان یکی از وعده‌های اصلی اقتصادی ترامپ تلقی می‌کند. ترامپ در سخنرانی خود جو بایدن، رئیس جمهور سابق آمریکا را به دلیل تورم سرسام آور سرزنش کرد و گفت که نگرانی های مربوط به مقرون به صرفه بودن ساختگی است «زیرا من قیمت ها را بسیار پایین می آورم». در همان سخنرانی، او قول داد که هر شهروند بزرگسال آمریکایی در صورت پیروزی جمهوری‌خواهان در انتخابات میان‌دوره‌ای، 5000 دلار سود سهام از درآمد تعرفه‌ها دریافت خواهد کرد - نوعی محرک که اقتصاددانان انتظار دارند تورم را تشدید کند. ترامپ مدعی شد که «قیمت مواد غذایی و تقریباً هر اقلام دیگر به سرعت در حال کاهش است»، حتی در شرایطی که قیمت‌های مصرف‌کننده از ژانویه 2025 به میزان 4.3 درصد افزایش یافته است، در حالی که در بحبوحه بحران جاری در ایران، خواربار مواد غذایی 3.4 درصد و بنزین 31 درصد افزایش یافته است. این اولین باری نیست که ترامپ نگرانی‌های مربوط به استطاعت"}, {"source": "Business Insider", "title": "Free money and lower rates: Trump's latest ideas are a recipe for more inflation", "link": "https://www.businessinsider.com/trump-dividend-free-money-lower-rates-inflation-economy-2026-9", "summary": "President Donald Trump said he will issue a $5,000 dividend to US adults if Republicans win the midterms. Roberto Schmidt/Getty Images Trump says he wants to dole out $5,000 to all American adults if the GOP wins the midterms. Last week, he called for rates to be lowered following a surprise blowout jobs report. Free money and lower interest rates are two things that sent inflation soaring after the pandemic. Oil prices are surging , markets are anxious about inflation, and borrowing costs for Americans are climbing. None of that has stopped Donald Trump from floating ideas in the last week that would likely exacerbate rising consumer prices: free money and lower interest rates. Ironically, it's a similar cocktail for hotter inflation that helped derail Joe Biden's presidency and gave Trump a foothold in the 2024 election. One factor in the president's victory was the message that inflation had run amok under the Democrats. On Wednesday, the president said he would dish out $5,000 to every American citizen adult if the Republicans hold onto their majority in the Senate and the House after the November midterm elections. As there are over 240 million adult citizens in the US, such a move would be costly. \"It would cost around $1.3 trillion putting the deficit for next year at more than $3 trillion or 10% of GDP,\" said Dean Baker, senior fellow at the liberal-leaning Center for Economic and Policy Research. Last week, Trump demanded that the Fed lower interest rates following a jobs report that blew away economists' expectations. At a time when bond yields are already rising on concerns about deficits, debt, and more inflation that will force the Fed to hike rates, Trump's plans could run counter to his own stated goals of making life more affordable for Americans, and economists across the political spectrum didn't mince words on their concerns about what the proposed dividends would mean for inflation, interest rates, and the federal fiscal outlook. \"This proposal would be bad if you started from a balanced budget position, but we're not in a balanced budget position,\" said Desmond Lachman, a senior fellow at the conservative think tank American Enterprise Institute. \"We're already in a deep budget hole.\" Adding more fiscal stimulus in the middle of a period of heightened inflation and low unemployment could push prices and interest rates even higher. \"Debt is now as large as our entire economy, deficits are running $2 trillion per year, inflation is about", "date_str": "2026-09-10T19:06:29+00:00", "hash": "aed773fa3814ad1a", "title_fa": "پول رایگان و نرخ های پایین تر: آخرین ایده های ترامپ دستور العملی برای تورم بیشتر است", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا گفت در صورت پیروزی جمهوری‌خواهان در انتخابات میان‌دوره‌ای، 5000 دلار سود سهام برای بزرگسالان آمریکایی صادر خواهد کرد. روبرتو اشمیت/گتی ایماژ ترامپ می گوید در صورت پیروزی حزب جمهوری خواه در انتخابات میان دوره ای، می خواهد 5000 دلار به همه بزرگسالان آمریکایی کمک کند. هفته گذشته، او خواستار کاهش نرخ‌ها به دنبال یک گزارش غیرمنتظره مشاغل شد. پول رایگان و نرخ بهره پایین تر دو موردی است که باعث افزایش تورم پس از همه گیری شد. قیمت نفت در حال افزایش است، بازارها نگران تورم هستند و هزینه های استقراض برای آمریکایی ها در حال افزایش است. هیچ‌کدام از این‌ها نتوانسته است دونالد ترامپ را از طرح ایده‌های شناور در هفته گذشته که احتمالاً افزایش قیمت‌های مصرف‌کننده را تشدید می‌کند، باز دارد: پول آزاد و کاهش نرخ بهره. از قضا، این یک کوکتل مشابه برای تورم داغ تر است که به منحرف شدن ریاست جمهوری جو بایدن کمک کرد و به ترامپ در انتخابات 2024 جای پایی گذاشت. یکی از عوامل پیروزی رئیس جمهور این پیام بود که تورم در دوران دموکرات ها بیداد کرده است. رئیس جمهور روز چهارشنبه گفت که اگر جمهوری خواهان پس از انتخابات میان دوره ای نوامبر اکثریت خود را در سنا و مجلس نمایندگان حفظ کنند، به هر شهروند آمریکایی بالغ 5000 دلار کمک خواهد کرد. از آنجایی که بیش از 240 میلیون شهروند بزرگسال در ایالات متحده وجود دارد، چنین اقدامی پرهزینه خواهد بود. دین بیکر، کارشناس ارشد مرکز تحقیقات سیاسی و اقتصادی با گرایش لیبرال، گفت: «هزینه آن حدود 1.3 تریلیون دلار است که کسری بودجه سال آینده را به بیش از 3 تریلیون دلار یا 10 درصد تولید ناخالص داخلی می رساند». هفته گذشته، ترامپ پس از گزارش مشاغلی که انتظارات اقتصاددانان را بر باد داد، از فدرال رزرو خواست تا نرخ بهره را کاهش دهد."}, {"source": "Business Insider", "title": "Nvidia CEO Jensen Huang says cybersecurity is AI's next blockbuster app", "link": "https://www.businessinsider.com/nvidia-ceo-predicts-ai-cybersecurity-as-the-next-big-thing-2026-9", "summary": "Nvidia CEO Jensen Huang. Sean Rayford/Getty Images Nvidia CEO Jensen Huang says cybersecurity will be AI's next blockbuster app after coding. Unlike coding assistants, AI cybersecurity systems run around the clock. Nvidia has recently partnered with CrowdStrike, Cisco, and Palantir. If coding was one of AI's first big blockbuster apps, Nvidia CEO Jensen Huang predicts cybersecurity will be the next. Speaking at a Goldman Sachs conference on Thursday, Huang said that companies will increasingly use AI to find software vulnerabilities and defend against cyberattacks. Huang's prediction comes as AI safety has become a hot debate in Silicon Valley. Researchers at companies like Anthropic have warned that increasingly powerful AI could pose existential threats if left unchecked — including by enabling more sophisticated cyberattacks. Huang wasn't asked about the debate or weighing in on it. Instead, he said that increasingly capable AI will make cybersecurity one of the biggest business opportunities for the technology industry. Huang said that cybersecurity is a natural extension of coding. \"A derivative of coding is, of course, bug finding,\" he said. \"And a derivative of that, which is a very large market, is called cybersecurity.\" Unlike coding assistants that respond to prompts, Huang said AI-powered cybersecurity systems run continuously — meaning companies will pay to keep them going around the clock. The comments come as Nvidia has been pushing deeper into cybersecurity. The company has recently announced partnerships with CrowdStrike, Cisco, and Palantir to build AI-powered cybersecurity tools. Other AI giants are also betting on cybersecurity. OpenAI chief financial officer Sarah Friar said Tuesday at the conference that the company sees cybersecurity as a major \"commercial opportunity.\" Have a tip? Contact this reporter via email at gweiss@businessinsider.com or Signal at @geoffweiss.25. Use a personal email address and a nonwork device; here's our guide to sharing information securely. Read the original article on Business Insider", "date_str": "2026-09-10T19:04:38+00:00", "hash": "afb687dae7dfe6a8", "title_fa": "جنسن هوانگ، مدیرعامل انویدیا می‌گوید امنیت سایبری برنامه پرفروش بعدی هوش مصنوعی است.", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا. Sean Rayford/Getty Images، مدیرعامل انویدیا، جنسن هوانگ، می‌گوید امنیت سایبری پس از کدنویسی، برنامه پرفروش بعدی هوش مصنوعی خواهد بود. برخلاف دستیارهای کدنویسی، سیستم های امنیت سایبری هوش مصنوعی به صورت شبانه روزی کار می کنند. انویدیا اخیرا با CrowdStrike، Cisco و Palantir شریک شده است. اگر برنامه نویسی یکی از اولین برنامه های پرفروش هوش مصنوعی بود، جنسن هوانگ، مدیر عامل انویدیا، پیش بینی می کند که امنیت سایبری بعدی خواهد بود. هوانگ در سخنرانی خود در کنفرانس گلدمن ساکس در روز پنجشنبه گفت که شرکت ها به طور فزاینده ای از هوش مصنوعی برای یافتن آسیب پذیری های نرم افزاری و دفاع در برابر حملات سایبری استفاده خواهند کرد. پیش‌بینی هوانگ در حالی مطرح می‌شود که ایمنی هوش مصنوعی به یک بحث داغ در سیلیکون ولی تبدیل شده است. محققان شرکت‌هایی مانند آنتروپیک هشدار داده‌اند که هوش مصنوعی قوی‌تر در صورت کنترل نشدن می‌تواند تهدیدات موجودیتی ایجاد کند - از جمله با فعال کردن حملات سایبری پیچیده‌تر. از هوانگ در مورد بحث و سنجش آن سوالی نشد. در عوض، او گفت که هوش مصنوعی با توانایی فزاینده، امنیت سایبری را به یکی از بزرگترین فرصت‌های تجاری برای صنعت فناوری تبدیل می‌کند. هوانگ گفت که امنیت سایبری توسعه طبیعی کدنویسی است. او گفت: «البته یک مشتق از کدگذاری، یافتن اشکال است. و مشتق آن، که بازار بسیار بزرگی است، امنیت سایبری نامیده می‌شود.» برخلاف دستیارهای کدنویسی که به درخواست‌ها پاسخ می‌دهند، هوانگ گفت که سیستم‌های امنیت سایبری مبتنی بر هوش مصنوعی به طور مداوم اجرا می‌شوند - به این معنی که شرکت‌ها برای ادامه فعالیت شبانه روزی آن‌ها پول پرداخت می‌کنند. این اظهارات در حالی منتشر می شود که انویدیا بیشتر به سمت امنیت سایبری پیش می رود. این شرکت اخیراً همکاری خود را با CrowdStrike، Cisco و Palantir برای ساخت ابزارهای امنیت سایبری مبتنی"}, {"source": "Business Insider", "title": "8 of the best foods I ate at the US Open — and 3 I'd skip next time", "link": "https://www.businessinsider.com/us-open-best-and-worst-foods-review-2026-9", "summary": "Dobel Tequila Club tacos chilorio. Erin McDowell/Business Insider The US Open is known for its world-class tennis, people-watching, and, of course, its food. I recently ate my way through nearly everything on offer at the US Open's Food Village. Some dishes stood out to me, but others aren't worth the lines and hefty price tags. Game, set, feast: These US Open food offerings are worth the trek to Queens. I recently attended the US Open during Fan Week for a media preview of all the food on offer at this year's tournament. While there, I ate my way through nearly every dish on the menu and came away with a few favorites, including a $38 French dip sandwich that's become almost as famous as the players themselves. But they weren't all champions — I also tried a few items that I don't think are worth the long lines and hefty price tags. Here are the eight best food items I tried at the US Open, and three I think could be skipped. One of the best and simplest items I tried was the prosciutto pizza from San Matteo. San Matteo NYC prosciutto pizza. Erin McDowell/Business Insider Cost : $23 Offering a variety of Neapolitan-style pizzas, San Matteo has brought some of its favorite concoctions from its Upper East Side pizzeria to the US Open. The prosciutto pizza, which is about the size of a personal pizza, features fresh mozzarella, truffle pâté, Rovagnati Parma ham, basil, and crushed black pepper. I thought the pizza was perfectly balanced, salty and sweet, and the dough was delightfully crispy. It was also relatively affordable and a generous portion for the Food Village at the US Open. However, I d probably skip the pepperoni or margherita cheese pizzas from San Matteo. San Matteo NYC pepperoni pizza. Erin McDowell/Business Insider Cost : $22 (pepperoni) and $19 (margherita) While I enjoyed both, I thought that they were a bit too simple for a special day out at the Open, especially compared to the more exciting prosciutto pizza or the variety of unique items on offer. For kids attending, ordering a simpler pizza might be a perfect fit, but I recommend thinking a bit more outside the box with your concession orders. One of my favorite items at the US Open was the OG Chicken Sando from Fuku. Fuku OG Sando chicken sandwich. Erin McDowell/Business Insider Cost : $19 It includes a crispy, habanero-brined fried chicken filet, Fuku Mayo, and pickles on a butter-toasted potato roll. I thought the chicken was perfectly crispy, and I could really taste the slightly sp", "date_str": "2026-09-10T19:04:28+00:00", "hash": "f2f130df17b02465", "title_fa": "8 تا از بهترین غذاهایی که در اوپن آمریکا خوردم - و 3 تا را دفعه بعد نادیده می‌گیرم", "summary_fa": "باشگاه تکیلا دوبل تاکو چیلریو. ارین مک داول/Business Insider US Open به خاطر تنیس در سطح جهانی، تماشای مردم و البته غذاهایش معروف است. من اخیراً تقریباً همه چیزهایی را که در دهکده غذای US Open ارائه شده بود خوردم. برخی از ظروف برای من برجسته بودند، اما برخی دیگر ارزش خطوط و برچسب های قیمت گزاف را ندارند. بازی، مجموعه، ضیافت: این غذاهای اوپن ایالات متحده ارزش سفر به کوئینز را دارد. من اخیراً در US Open در هفته هواداران شرکت کردم تا پیش‌نمایش رسانه‌ای از تمام غذاهای ارائه شده در مسابقات امسال را داشته باشم. زمانی که آنجا بودم، تقریباً تمام غذاهای منو را خوردم و با چند غذای مورد علاقه، از جمله یک ساندویچ دیپ فرانسوی 38 دلاری که تقریباً به اندازه خود بازیکنان مشهور شده است، آمدم. اما همه آنها قهرمان نبودند - من همچنین چند مورد را امتحان کردم که فکر نمی‌کنم ارزش صف‌های طولانی و قیمت‌های سنگین را داشته باشند. در اینجا هشت مورد از بهترین مواد غذایی که در مسابقات آزاد آمریکا امتحان کردم، وجود دارد و فکر می‌کنم می‌توان از سه مورد آن صرف نظر کرد. یکی از بهترین و ساده ترین اقلامی که من امتحان کردم پیتزا پروشوتو از San Matteo بود. پیتزا پروشوتو San Matteo NYC. Erin McDowell/Business Insider هزینه: 23 دلار سن ماتئو با ارائه انواع پیتزاهای سبک ناپل، برخی از معجون های مورد علاقه خود را از پیتزا فروشی Upper East Side خود به US Open آورده است. پیتزای پروشوتو که به اندازه یک پیتزای شخصی است، دارای موزارلای تازه، پاته ترافل، ژامبون پارما رواگناتی، ریحان و فلفل سیاه خرد شده است. فکر می کردم پیتزا کاملاً متعادل، شور و شیرین بود و خمیر به طرز لذت بخشی ترد بود. همچنین نسبتا مقرون به صرفه و بخش سخاوتمندانه ای برای دهکده غذا در US Open بود. با این"}, {"source": "Business Insider", "title": "Hunter Biden's crypto follows other political meme coins as it craters 98% in a day", "link": "https://www.businessinsider.com/hunter-biden-laptop-meme-coin-donald-trump-eric-adams-crypto-2026-9", "summary": "Hunter Biden s meme coin joins other from figures like Donald Trump and Eric Adams that soared and quickly plunged. Photo 1: Tom Williams/CQ-Roll Call, Inc via Getty Images; Photo 2: Brendan SMIALOWSKI / AFP via Getty Images; Photo 3: Alexi Rosenfeld/Getty Images Hunter Biden's meme coin has plunged in value since it began trading on Tuesday. The pattern is similar to the path of tokens launched by other political figures. Biden responded to allegations of a rug pull, stating that no traders had any advantage. Trading of Hunter Biden's meme coin isn't off to a great start. The son of former President Joe Biden announced on Monday that he would be launching a memecoin inspired by the laptop saga that fueled conspiracy theories during his father's presidency. In a roller coaster ride that's familiar to anyone who has watched the meme coin space, $LAPTOP briefly surged from $37 when trading began on Tuesday, to a peak of nearly $225. By midday, it had fallen to about $2, and on Thursday the crypto was trading at about $0.60, down 98% since its debut. Right on cue, the accusations of a \"rug pull\"—in which a crypto creator sells at the peak and tanks the price, leaving investors holding the bag—were piling up across social media. Hunter Biden himself sought to address them in a post on X . \"The reality is that available liquidity could not sustain the strong level of interest at launch,\" he said. \"Technical issues coupled with predatory 'snipers', who seek to beat liquidity providers to market, caused a spike in price, which has since stabilized to healthy levels.\" $LAPTOP is the latest in a line of meme coins launched by politicos to soar and quickly plummet. In January, former New York City Mayor Eric Adams drew ire from the crypto community with NYCToken. The meme coin plunged 80% within a few minutes, sparking accusations of a rug pull. Donald Trump's $TRUMP coin has also been extremely volatile. While the president enjoyed a significant windfall from his crypto investments over the past year, the coin he launched just before returning to the White House has fallen 77% in 12 months. Finance pros have blamed meme coins for harming sentiment in the wider crypto market. David Weisberger, a Wall Street veteran and co-founder of trading platform CoinRoutes, told Business Insider that he doesn't regard the $LAPTOP launch as any different than other recent high-profile meme coin launches that culminated in an abrupt rout. \"That was maybe the most predictable rug p", "date_str": "2026-09-10T19:00:56+00:00", "hash": "219922620e249b4c", "title_fa": "کریپتوی هانتر بایدن از دیگر سکه‌های میم سیاسی پیروی می‌کند، زیرا 98 درصد در یک روز فرو می‌رود.", "summary_fa": "سکه میم هانتر بایدن به چهره هایی مانند دونالد ترامپ و اریک آدامز می پیوندد که اوج گرفتند و به سرعت سقوط کردند. عکس 1: تام ویلیامز/CQ-Roll Call, Inc از طریق Getty Images. عکس 2: برندان اسمیالووسکی / خبرگزاری فرانسه از طریق گتی ایماژ. عکس 3: الکسی روزنفلد/ گتی ایماژ ارزش سکه میم هانتر بایدن از زمان شروع معامله در روز سه شنبه کاهش یافته است. این الگو مشابه مسیر نشانه هایی است که توسط دیگر شخصیت های سیاسی راه اندازی شده است. بایدن به اتهامات قالی‌کشی پاسخ داد و اظهار داشت که هیچ تاجری مزی
