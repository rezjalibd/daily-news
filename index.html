ا حتی یک دفتر SF نداریم، بنابراین این یک قدم بسیار بزرگ برای ما است. این دفتر تعداد انگشت شماری از سرمایه گذاران Khosla را در خود جای خواهد داد که Rabois در میان آنهاست، اما ویژگی غیرعادی تر آن چیزی است که او آن را مرکز توجیهی اجرایی نامید. این فضایی خواهد بود که در آن شرکت 10 یا 12 شرکت پرتفوی را در یک زمان برای ملاقات با یک شرکت Fortune 500، چهار روز در هفته می آورد. او به شرکت کنندگان گفت که شرکت های نمونه کار این را دوست دارند. آنها خلبان و مشتری دریافت می کنند و به همین دلیل دفتر بسیار پر جنب و جوشی"}, {"source": "TechCrunch Main", "title": "Roblox is making it easier to build games with AI — and play them outside Roblox", "link": "https://techcrunch.com/2026/09/11/roblox-is-making-it-easier-to-build-games-with-ai-and-play-them-outside-roblox/", "summary": "At its annual Roblox Developer Conference (RDC), the company announced several new features, including new game-creation tools, expanded NPC capabilities, and the ability to make games available across platforms, including the web.", "date_str": "2026-09-11T19:00:00+00:00", "hash": "f3479d1b759385cc", "title_fa": "Roblox ساخت بازی‌ها با هوش مصنوعی را آسان‌تر کرده و آنها را خارج از Roblox بازی کنید", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار در اعتبارات تصویر مختل صرفه جویی کنید: برنامه های Roblox Roblox ساخت بازی ها با هوش مصنوعی را آسان تر می کند — و آنها را در خارج از Roblox ایوان مهتا بازی می کند 12:00 PM PDT · 11 سپتامبر 2026 در سالانه خود، پلتفرم جدید توسعه دهندگان Roblox را اعلام کرد که شامل پلتفرم جدید توسعه دهندگان (RDC) می شود. ابزارهای ساخت بازی، قابلیت‌های NPC (شخصیت غیربازیکن) توسعه‌یافته، و توانایی در دسترس قرار دادن بازی‌ها در سراسر پلتفرم‌ها، از جمله وب. این شرکت همچنین کارت Roblox و کیف پول Roblox اختصاصی را برای سازندگان راه اندازی می کند. علاوه بر این، Roblox در حال عرضه بازی های مولد هوش مصنوعی خود به طور گسترده تر است. اولین بار در ماه جولای معرفی شد، ویژگی به نام Build به کاربران Roblox اجازه می دهد تا با استفاده از دستورات زبان طبیعی بازی بسازند. در ابتدا فقط در نیوزلند در دسترس بود. اکنون این شرکت در حال گسترش آن به صربستان و سنگاپور است. Build همچنین در حال دسترسی به دسکتاپ برای ایجاد صفحه بزرگ، کتابخانه دارایی جدید و کنترل تکراری است. اواخر امسال، یک ویژگی جدید مبتنی بر سریع صحنه را نیز دریافت خواهد کرد که به استودیوی Roblox گسترش خواهد یافت. پلتفرم بازی اطمینان حاصل می کند که همه این بازی های جدید ایجاد شده برای بازی در مکان های بیشتری در دسترس هستند. این شرکت گفت سازندگان به زودی می‌توانند بازی‌های خود را به‌عنوان برنامه‌های جداگانه روی موبایل، رایانه شخصی و کنسول‌ها در دسترس قرار دهند و Roblox موتور بازی است. تا پایان سال، بازیکنان می توانند از طریق یک پیوند به یک بازی در مرورگر بپیوندند. اعلامیه‌ها نشان"}, {"source": "TechCrunch Main", "title": "Central Eurasia names its 2026 Road to Battlefield winners: Cerberus, WeGlobal AI, and LOOQ", "link": "https://techcrunch.com/2026/09/11/central-eurasia-names-its-2026-road-to-battlefield-winners-cerberus-weglobal-ai-and-looq/", "summary": "Cerberus, WeGlobal AI, and LOOQ took the top three spots at the regional final of Road to TechCrunch Startup Battlefield 2026 and will represent Central Eurasia in the Startup Battlefield 200 at TechCrunch Disrupt in San Francisco this October.", "date_str": "2026-09-11T18:58:01+00:00", "hash": "8d7e71540c0cb911", "title_fa": "اوراسیا مرکزی برندگان سال 2026 Road to Battlefield خود را: Cerberus، WeGlobal AI، و LOOQ نام می برد.", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار در اعتبارات تصویر مختل صرفه جویی کنید: استارتاپ های مرکز نوآوری Silkroad مرکز اوراسیا برندگان سال 2026 خود را به نام جاده به میدان نبرد: Cerberus، WeGlobal AI، و LOOQ TechCrunch Events 11:58 AM WeightCrunch, PDTloA20 سپتامبر و LOOQ سه رتبه برتر در فینال منطقه ای Road to TechCrunch Startup Battlefield 2026 را به خود اختصاص دادند و نماینده اوراسیا مرکزی در Startup Battlefield 200 در TechCrunch Disrupt 2026 در سانفرانسیسکو در 13 تا 15 اکتبر، قبل از حضور بیش از 10000 رهبر فناوری خواهند بود. این سه نفر از میان 22 فینالیست که از بین 726 درخواست در 39 کشور انتخاب شده بودند، ظاهر شدند. با ثبت نام برای بلیط خود در اینجا، با این برندگان در Disrupt آشنا شوید. The Road to TechCrunch Startup Battlefield - که توسط Silkroad Innovation Hub با مشارکت TechCrunch، Freedom Holding، Astana Hub و IT Park ازبکستان اداره می شود - تقریباً 50٪ بیشتر از اولین برنامه خود در سال 2025، زمانی که 485 استارت آپ از 27 کشور درخواست داده بودند، استفاده کرد. راندهای ملی عرصه را به 22 فینالیست محدود کرد که در فینال منطقه ای حضور 47 هیئت داوری از 8 کشور به صورت زنده شرکت کردند. AI-Dana، یک قاضی هوش مصنوعی، به عنوان یک هیئت منصفه مستقل برای دومین سال به آنها پیوست. بازی Road to Battlefield 2026 بیش از هر زمان دیگری از کشورهای بیشتری درخواست و نمایندگی داشت. شرکت‌هایی که در زمینه فناوری سلامت، آموزش، بهره‌وری، شرکت‌ها و سایبر فعالیت می‌کنند، پیشرفته و چشمگیر بودند. این بنیان‌گذاران در TechCrunch Disrupt دیده می‌شوند و این پیامی را به نسل بعدی می‌فرستد: شما می‌توانید به صورت محلی بسازید و مقیاس جهانی داشته"}, {"source": "TechCrunch Main", "title": "Matt Mullenweg tells (trolls?) Automattic staff, saying he’s back in control after CEO ouster", "link": "https://techcrunch.com/2026/09/11/matt-mullenweg-tells-automattic-staff-in-slack-hes-back-in-control-after-ceo-ouster/", "summary": "In a Slack message seen by TechCrunch, Matt Mullenweg told Automattic employees he’s back in control of the company, days after its board put him on leave. Automattic has not yet confirmed the apparent reversal.", "date_str": "2026-09-11T15:19:00+00:00", "hash": "5c117fa940032862", "title_fa": "مت مولنوگ به کارکنان Automattic می‌گوید (ترول‌ها؟) و می‌گوید پس از برکناری مدیرعامل دوباره کنترل را به دست گرفته است.", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار در هزینه تصویر مختل صرفه جویی کنید اعتبارات: کیمبرلی وایت / سرگرمی رسانه گتی ایماژ مت مولنوگ به کارکنان Automattic می گوید (ترول می کند؟) و می گوید که پس از برکناری سارا پرز مدیر عامل اجرایی 8:19 ق.ظ. s Slack، با توجه به تصویری از پیام مشاهده شده توسط TechCrunch، که توسط چندین منبع کارمند تأیید شده است، ادعا می کند که به عنوان مدیر عامل شرکت مادر WordPress.com دوباره کنترل را در دست دارد. این پست تنها چند روز پس از رای هیئت مدیره Automattic به برکناری مولنوگ از سمت مدیرعاملی به دلایل نامعلوم منتشر شد. از Automattic خواسته شده است که صحت اظهارات مولنوگ را تأیید کند، اما هنوز به درخواست‌های مکرر برای اظهار نظر پاسخ نداده است. مولنوگ به درخواست ما پاسخ داد و گفت که یک پست وبلاگ در راه است. وقتی افتاد، درباره خرید یک قایق خانگی بود. بعدازظهر جمعه، مری هابارد، مدیر اجرایی WordPress.org، در X نوشت که از بازگشت مت مولنوگ به عنوان مدیرعامل Automattic راحت و خوشحال است. توصیه بنیانگذار: اگر هر چند سال یک بار کودتا نمی کنید، رهبران به اندازه کافی قوی استخدام نمی کنید."}, {"source": "Ars Technica", "title": "I spent $4,000 on a robot dog from China", "link": "https://arstechnica.com/gadgets/2026/09/i-spent-4000-on-a-robot-dog-from-china/", "summary": "On a sunny morning in June, I walked to work with a quadruped robot beside me. I’ve never gotten more attention from strangers. A bunch of people snapped pictures of my robot dog. Several people asked me questions. Was it mine? (Yes.) Did I build it? (No.) Was it being used for surveillance? (No.) Biological dogs kept a safe distance from my mechanical companion. Some growled or barked at it. Read full article Comments", "date_str": "2026-09-12T11:00:53+00:00", "hash": "9c4d6665f4125ec1", "title_fa": "من 4000 دلار برای یک سگ ربات از چین خرج کردم", "summary_fa": "در یک صبح آفتابی ماه ژوئن، با یک ربات چهارپا در کنارم به سمت محل کار رفتم. من هرگز بیش از این مورد توجه غریبه ها قرار نگرفته ام. چند نفر از سگ ربات من عکس گرفتند. چند نفر از من سوال پرسیدند. مال من بود؟ (بله.) آیا من آن را ساختم؟ (نه.) آیا از آن برای نظارت استفاده می شد؟ (خیر.) سگ های بیولوژیک فاصله ایمن را از همراه مکانیکی من حفظ کردند. برخی در آن غرغر می کردند یا پارس می کردند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Some satellite companies still have an appetite for boutique launch services", "link": "https://arstechnica.com/space/2026/09/some-satellite-companies-still-have-an-appetite-for-boutique-launch-services/", "summary": "If you ask most satellite companies aside from SpaceX, they will tell you the world doesn't have enough capacity for launching payloads into orbit. This is despite the blistering launch cadence we've seen around the world in recent years, led by SpaceX's Falcon 9 rocket. Customers in any sector will, of course, usually welcome competition. Theoretically, competition will lead to lower prices and allow the best to rise to the top. It seems like the customers buying launch services were right. SpaceX is dialing back its Falcon 9 launch program , and there is no certainty about when SpaceX's reusable next-generation super-heavy-lift rocket, Starship, will carry anything to orbit besides the company's own Starlink satellites. So it's no surprise satellite operators are cheering the success of a new launch provider. This was especially the case a few days ago, when Germany's Isar Aerospace reached orbit for the first time with its Spectrum rocket. The launcher delivered a batch of CubeSats to low-Earth orbit from a spaceport in northern Norway, and Isar tasted success after its first test flight ended in failure last year. Read full article Comments", "date_str": "2026-09-11T23:34:45+00:00", "hash": "0e5cef450efa63d7", "title_fa": "برخی از شرکت های ماهواره ای هنوز اشتهای خود را برای خدمات پرتاب بوتیک دارند", "summary_fa": "اگر از اکثر شرکت های ماهواره ای به غیر از SpaceX بپرسید، آنها به شما خواهند گفت که جهان ظرفیت کافی برای پرتاب محموله ها به مدار را ندارد. این علیرغم سرعت پرتاب تاولناکی است که در سال‌های اخیر در سرتاسر جهان دیده‌ایم که توسط موشک فالکون 9 اسپیس ایکس هدایت می‌شود. البته مشتریان در هر بخش از رقابت استقبال می کنند. از نظر تئوری، رقابت منجر به کاهش قیمت‌ها می‌شود و به بهترین‌ها اجازه می‌دهد تا به اوج برسند. به نظر می‌رسد مشتریانی که خدمات راه‌اندازی را می‌خرند، درست گفته‌اند. اسپیس ایکس برنامه پرتاب فالکون 9 خود را لغو می کند و هیچ قطعیتی در مورد اینکه چه زمانی راکت فوق سنگین قابل استفاده مجدد اسپیس ایکس، استارشیپ، چه زمانی غیر از ماهواره های استارلینک خود این شرکت را به مدار خواهد برد، وجود ندارد. بنابراین جای تعجب نیست که اپراتورهای ماهواره ای موفقیت یک ارائه دهنده پرتاب جدید را تشویق می کنند. این امر به ویژه چند روز پیش بود، زمانی که هوافضای ایسار آلمان برای اولین بار با موشک اسپکتروم خود به مدار زمین رسید. پرتابگر دسته‌ای از CubeSats را از یک فرودگاه فضایی در شمال نروژ به مدار پایین زمین تحویل داد و ایسار پس از شکست اولین پرواز آزمایشی آن در سال گذشته طعم موفقیت را چشید. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Random rewards enrich classic game-theory insights", "link": "https://arstechnica.com/science/2026/09/random-rewards-enrich-classic-game-theory-contests/", "summary": "Games may be life with all the hard bits removed, but they provide a way to study why people make the choices they make. Traditional games are usually played against a static background: the rewards per outcome are constant. That limits their relevance to behavior because, in real life, the rewards and consequences of strategic choices are ever changing. Now, researchers have used a mathematical model to study a series of games that include evolving strategies and randomly varying returns. A bit of history Perhaps the most famous game-theory contest is the prisoner’s dilemma. In the prisoner’s dilemma, a pair of thieves have been captured and are being separately interrogated by the police. If both clam up, they will be punished for a lesser crime. If one prisoner makes a deal (defects) then that prisoner gets to go free and the other gets a heavier sentence. If both make a deal, they both get an in-between punishment. The person running the game can start it with different rewards for cooperating and defecting to explore how the optimum strategy varies with reward and risk, which the players can figure out by varying the strategies across multiple rounds. Depending on the balance between the reward for staying silent (cooperating) and betrayal, the game stabilizes with everyone betraying everyone. In this simple situation, everyone loses. Read full article Comments", "date_str": "2026-09-11T21:41:16+00:00", "hash": "d396363d659b1235", "title_fa": "پاداش‌های تصادفی بینش‌های نظریه بازی کلاسیک را غنی می‌کنند", "summary_fa": "بازی‌ها ممکن است زندگی با تمام سختی‌های حذف شده باشند، اما راهی برای مطالعه اینکه چرا مردم انتخاب‌های خود را انجام می‌دهند، فراهم می‌کنند. بازی‌های سنتی معمولاً در یک پس‌زمینه ثابت انجام می‌شوند: پاداش در هر نتیجه ثابت است. این امر ارتباط آنها را با رفتار محدود می کند زیرا در زندگی واقعی، پاداش ها و پیامدهای انتخاب های استراتژیک همیشه در حال تغییر هستند. اکنون، محققان از یک مدل ریاضی برای مطالعه مجموعه‌ای از بازی‌ها استفاده کرده‌اند که شامل استراتژی‌های در حال تحول و بازده‌های متفاوت است. کمی تاریخ شاید مشهورترین مسابقه تئوری بازی معمای زندانی باشد. در دوراهی زندانی، یک جفت سارق دستگیر شده اند و به طور جداگانه توسط پلیس بازجویی می شوند. اگر هر دو با هم کنار بیایند، مجازات جرم کمتری خواهند داشت. اگر یک زندانی معامله ای انجام دهد (نقص) آن زندانی آزاد می شود و دیگری مجازات سنگین تری دریافت می کند. اگر هر دو با هم معامله کنند، هر دو تنبیه بین‌الملل دریافت می‌کنند. فردی که بازی را اجرا می‌کند می‌تواند با پاداش‌های مختلف برای همکاری و فرار شروع کند تا بفهمد که چگونه استراتژی بهینه با پاداش و ریسک متفاوت است، که بازیکنان می‌توانند با تغییر استراتژی‌ها در چندین دور پی ببرند. بسته به تعادل بین پاداش سکوت (همکاری) و خیانت، بازی با خیانت همه به همه تثبیت می شود. در این شرایط ساده همه ضرر می کنند. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Bouncy castle launches horrifying MRSA outbreak, striking 48 kids in Ireland", "link": "https://arstechnica.com/health/2026/09/bouncy-castle-launches-horrifying-mrsa-outbreak-striking-48-kids-in-ireland/", "summary": "For a child bursting with energy, few things are more fun than hurtling through a bouncy castle, launching into the air, and ping-ponging between every surface. But that childhood buoyancy will quickly deflate when it turns out those surfaces are smeared with a hypervirulent, multidrug-resistant pathogen. That was the horrifying reality for a community in Ireland in fall 2025. Neighbors had gathered for an afternoon of merriment, complete with a barbecue, a sweets station, and three bouncy castles. Officials estimate that about 120 people joined the festivities, and around half of them were children and teens. Within a day, some children began developing signs of an infection. In all, 48 children in the community developed aggressive skin and soft-tissue infections. Of the 48 cases, 33 were treated by their regular doctor, and 15 sought emergency care. Four children ended up being hospitalized. Luckily, all of the children recovered. The results of the outbreak investigation were reported this week in the journal Eurosurveillance . Read full article Comments", "date_str": "2026-09-11T21:14:26+00:00", "hash": "98ac90694e61ca5e", "title_fa": "قلعه فنری شیوع هولناک MRSA را آغاز کرد و 48 کودک در ایرلند را تحت تاثیر قرار داد.", "summary_fa": "برای کودکی که از انرژی منفجر می شود، چیزهای کمی سرگرم کننده تر از عبور از یک قلعه فنری، پرتاب به هوا و پینگ پنگ زدن بین هر سطح هستند. اما این شناوری دوران کودکی به سرعت از بین می رود زمانی که معلوم شود آن سطوح با یک پاتوژن بیش از حد ویروسی و مقاوم به چند دارو آغشته شده اند. این واقعیت وحشتناک برای جامعه ای در ایرلند در پاییز 2025 بود. همسایه‌ها برای یک بعدازظهر شاد و با یک باربیکیو، یک ایستگاه شیرینی و سه قلعه پرشور جمع شده بودند. مقامات تخمین می زنند که حدود 120 نفر به این جشن ها پیوستند که حدود نیمی از آنها کودک و نوجوان بودند. در عرض یک روز، برخی از کودکان شروع به ایجاد علائم عفونت کردند. در مجموع، 48 کودک در جامعه دچار عفونت های تهاجمی پوست و بافت نرم شدند. از 48 مورد، 33 مورد توسط پزشک عادی خود تحت درمان قرار گرفتند و 15 مورد به مراقبت های اورژانسی مراجعه کردند. چهار کودک در نهایت در بیمارستان بستری شدند. خوشبختانه همه بچه ها بهبود یافتند. نتایج تحقیقات شیوع این هفته در مجله Eurosurveillance گزارش شد. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Trump's forced coal plant extensions thrown out by judge", "link": "https://arstechnica.com/science/2026/09/court-rejects-governments-energy-emergency-that-kept-coal-plant-open/", "summary": "The use of coal to generate electricity on the US grid has been plunging for nearly two decades, and the first Trump administration was unable to affect the trend. So his second administration has attempted more aggressive interventions to prop up coal use. One of its most direct means of doing so is to order coal plants that were scheduled to close to remain open , even if there is no need for them . The administration's justification for these orders is a statute that allows the Department of Energy (DOE) to declare an emergency in the case of wartime or a sudden shortfall in generation. A number of parties, including states where coal plants have been slated to close, have challenged this declaration. And on Friday, in the first of these cases to make its way through the courts, the declaration was judged to be contrary to the statute. While this only affects a single coal plant in Michigan, the reasoning of the decision will apply to every coal plant closure that has been blocked by the DOE. No emergency The decision was issued by a unanimous three-judge panel from the DC Circuit's Court of Appeals. It focuses on the J.H. Campbell Generating Plant, which was scheduled to close last year but has been kept open by a total of five emergency declarations by the DOE, each limited to 90 days by the Federal Power Act. At issue was section 202(c) of that Act, which allows the DOE to declare emergencies when the US is at war or when “an emergency exists by reason of a sudden increase in the demand for electric energy, or a shortage of electric energy.” Read full article Comments", "date_str": "2026-09-11T20:32:59+00:00", "hash": "3eaa8e9435d7b5fa", "title_fa": "تمدید اجباری کارخانه زغال سنگ ترامپ توسط قاضی کنار گذاشته شد", "summary_fa": "استفاده از زغال سنگ برای تولید برق در شبکه ایالات متحده نزدیک به دو دهه است که کاهش یافته است و اولین دولت ترامپ نتوانست بر این روند تأثیر بگذارد. بنابراین دولت دوم او مداخلات تهاجمی تری را برای تقویت استفاده از زغال سنگ انجام داده است. یکی از مستقیم ترین ابزارهای آن برای انجام این کار این است که به کارخانه های زغال سنگی که قرار بود تعطیل شوند سفارش می دهد تا باز بمانند، حتی اگر نیازی به آنها نباشد. توجیه دولت برای این دستورات قانونی است که به وزارت انرژی (DOE) اجازه می دهد در زمان جنگ یا کمبود ناگهانی تولید، وضعیت اضطراری را اعلام کند. تعدادی از احزاب، از جمله ایالت هایی که کارخانه های زغال سنگ در آنها تعطیل شده اند، این اعلامیه را به چالش کشیده اند. و روز جمعه در اولین مورد از این پرونده ها که از طریق دادگاه راه یافت، اعلامیه مغایر با اساسنامه تشخیص داده شد. در حالی که این تنها یک کارخانه زغال سنگ در میشیگان را تحت تاثیر قرار می دهد، استدلال این تصمیم برای هر بسته شدن کارخانه زغال سنگ که توسط DOE مسدود شده است اعمال می شود. اضطراری وجود ندارد این تصمیم توسط یک هیئت متشکل از سه قاضی به اتفاق آرا از دادگاه استیناف ناحیه DC صادر شد. بر روی J.H. کارخانه تولید کمپبل، که قرار بود سال گذشته تعطیل شود، اما در مجموع پنج اعلامیه اضطراری توسط DOE باز نگه داشته شده است، که هر کدام توسط قانون فدرال قدرت به 90 روز محدود شده است. موضوع مورد بحث، بخش 202 (ج) آن قانون بود که به وزارت انرژی اجازه می‌دهد تا زمانی که ایالات متحده در حال جنگ است یا زمانی که «به دلیل افزایش ناگهانی تقاضا برای انرژی الکتریکی یا کمبود انرژی الکتریکی یک وضعیت اضطراری وجود دارد، شرایط اضطراری را"}, {"source": "Ars Technica", "title": "ChatGPT-using lawyer punished for citing fake testimony from made-up witnesses", "link": "https://arstechnica.com/tech-policy/2026/09/chatgpt-using-lawyer-punished-for-citing-fake-testimony-from-made-up-witnesses/", "summary": "The New Mexico Supreme Court held a ChatGPT-using lawyer in direct contempt of court for submitting a brief with \"false testimony from wholly fabricated witnesses,\" including fake police testimony and other mistakes. The state's top court referred the lawyer to a disciplinary board for further proceedings and concluded that he \"demonstrated a lack of remorse and a lack of concern for his client.\" Attorney Stephen Aarons \"admitted to the Court that he did not verify the factual claims and legal authority in his AI-generated brief before signing it and filing it with the Court, and that he did not inform his client of this failure or that the brief in chief contained multiple factual and legal misrepresentations,\" the state Supreme Court said in an order on Wednesday. Aarons has been a criminal defense lawyer in New Mexico for over 40 years and was hired by a defendant's family members to appeal a murder conviction. Aaron's now-former client, Oscar Renee Sandoval, was sentenced to life in prison in February 2025 after being convicted of killing Shiereen Al-Jibury, who was his partner and the mother of his children. Read full article Comments", "date_str": "2026-09-11T19:34:09+00:00", "hash": "a49db3f8ad37bcdf", "title_fa": "وکیلی که از ChatGPT استفاده می کند به دلیل استناد به شهادت جعلی از شاهدان ساختگی مجازات شد", "summary_fa": "دادگاه عالی نیومکزیکو، وکیلی را که از ChatGPT استفاده می‌کرد، به دلیل ارائه خلاصه‌ای حاوی «شهادت دروغ از شهود کاملاً ساختگی»، از جمله شهادت جعلی پلیس و اشتباهات دیگر، در تحقیر مستقیم دادگاه قرار داد. دادگاه عالی ایالتی وکیل را برای رسیدگی بیشتر به هیئت انضباطی ارجاع داد و نتیجه گرفت که او \"عدم پشیمانی و عدم توجه به موکل خود را نشان داده است.\" دادگاه عالی ایالتی در دستوری روز چهارشنبه گفت: وکیل استفان آرون \"به دادگاه اعتراف کرد که ادعاهای واقعی و اختیارات قانونی را در گزارش تولید شده توسط هوش مصنوعی قبل از امضای آن و تسلیم آن به دادگاه تایید نکرده است و به موکل خود از این شکست اطلاع نداده است یا این خلاصه حاوی چندین اظهارات نادرست واقعی و قانونی است.\" آرون بیش از 40 سال وکیل مدافع جنایی در نیومکزیکو بوده است و توسط اعضای خانواده یک متهم برای تجدید نظر در محکومیت قتل استخدام شده است. موکل سابق آرون، اسکار رنی سندووال، در فوریه 2025 پس از محکومیت به قتل شیرین الجبوری، شریک زندگی او و مادر فرزندانش، به حبس ابد محکوم شد. نظرات مقاله کامل را بخوانید"}, {"source": "Ars Technica", "title": "Scientists unlock secrets of ancient Egyptian materials with proteomics", "link": "https://arstechnica.com/science/2026/09/scientists-unlock-secrets-of-ancient-egyptian-materials-with-proteomics/", "summary": "Credit: Museum of Mediterranean and Near Eastern Antiquities, Stockholm Credit: Museum of Mediterranean and Near Eastern Antiquities, Stockholm The precise composition of ancient Egyptian paints, binders, adhesives, and similar materials used to make artifacts is largely unknown, in part because a full analysis would require taking samples that would damage those valuable artifacts. The development of cutting-edge, non-destructive techniques has been helping to unlock those secrets, aiding conservation efforts. Most recently, researchers have used mass spectrometry-based proteomics to analyze the glues and adhesives in a broad set of Egyptian artifacts, according to a new paper published in the journal Science Advances. They found plenty of expected sources, such as animal collagens and egg proteins, but also plant proteins, specifically from sesame and drumstick tree (moringa) cereals. As previously reported , the ancient Egyptians had a highly formalized (and easily recognizable) painting style, and there has been considerable interest in gaining insights into the specific pigments and painting techniques employed. Common pigments included hematite and realgar for red; goethite and orpiment for yellow; Egyptian blue; Egyptian green; carbon-based black; and calcite, gypsum, anhydrite, and huntite for white. (Just last year, Washington State University researchers were able to re-create Egyptian blue by mixing together silicon dioxide, copper, calcium, and sodium carbonate in varying proportions and heating them at very high temperatures akin to those of ancient kilns.) Read full article Comments", "date_str": "2026-09-11T18:49:39+00:00", "hash": "5dca14c119ca60d0", "title_fa": "دانشمندان اسرار مواد مصر باستان را با پروتئومیک کشف می کنند", "summary_fa": "اعتبار: موزه باستان‌های مدیترانه و خاور نزدیک، استکهلم اعتبار: موزه باستان‌های مدیترانه و خاور نزدیک، استکهلم ترکیب دقیق رنگ‌ها، چسب‌ها، چسب‌ها و مواد مشابه مصر باستان که برای ساخت مصنوعات استفاده می‌شد، تا حد زیادی ناشناخته است، تا حدی به این دلیل که تجزیه و تحلیل کامل مستلزم گرفتن نمونه‌هایی است که به آن آثار ارزشمند آسیب می‌رساند. توسعه تکنیک های پیشرفته و غیر مخرب به کشف این اسرار کمک کرده است و به تلاش های حفاظتی کمک می کند. بر اساس مقاله جدیدی که در مجله Science Advances منتشر شده است، اخیراً محققان از پروتئومیک های مبتنی بر طیف سنجی جرمی برای تجزیه و تحلیل چسب ها و چسب ها در مجموعه گسترده ای از مصنوعات مصری استفاده کرده اند. آنها منابع مورد انتظار زیادی مانند کلاژن های حیوانی و پروتئین های تخم مرغ و همچنین پروتئین های گیاهی به ویژه از کنجد و غلات درخت طبل (moringa) پیدا کردند. همانطور که قبلاً گزارش شد، مصریان باستان سبک نقاشی بسیار رسمی (و به راحتی قابل تشخیص) داشتند و علاقه قابل توجهی برای به دست آوردن بینش در مورد رنگدانه های خاص و تکنیک های نقاشی به کار رفته وجود داشته است. رنگدانه های رایج شامل هماتیت و رئالگار برای قرمز بود. گوتیت و زینت برای رنگ زرد؛ آبی مصری؛ سبز مصری؛ مشکی مبتنی بر کربن؛ و کلسیت، گچ، انیدریت و هانتیت برای سفید. (در همین سال، محققان دانشگاه ایالتی واشنگتن توانستند آبی مصری را با مخلوط کردن دی اکسید سیلیکون، مس، کلسیم و کربنات سدیم به نسبت های مختلف و حرارت دادن آنها در دماهای بسیار بالا شبیه به کوره های باستانی، دوباره آبی مصری بسازند.) نظرات مقاله را بخوانید."}, {"source": "Ars Technica", "title": "Oracle tries to appease Stargate data center opponents with renewables push", "link": "https://arstechnica.com/gadgets/2026/09/oracle-promises-2-gw-of-renewables-to-match-stargate-data-center-emissions/", "summary": "Oracle’s proposed investment in 2 gigawatts of renewable energy projects for New Mexico comes as local opposition could delay development of the Project Jupiter data center that Oracle is building for OpenAI. The two tech companies are developing the $165 billion Project Jupiter data center in Santa Teresa, New Mexico, as part of the broader Stargate AI infrastructure project announced by President Donald Trump in 2025. But Project Jupiter faces local protests and court battles over concerns about its environmental impacts—and the latest Oracle announcement on September 8 seeking proposals for renewable energy projects does not change the fact that the data center will be powered by fuel cells that consume natural gas. “Like all matching programs, this would be synthetic in the sense that 2 GW of renewables wouldn't directly power the data center,” wrote Michael Thomas, CEO of the Cleanview data platform that tracks renewable energy and data center projects, in a LinkedIn post . Read full article Comments", "date_str": "2026-09-11T18:22:22+00:00", "hash": "e79ebc89835edd9b", "title_fa": "اوراکل تلاش می کند تا مخالفان مرکز داده Stargate را با فشار انرژی های تجدید پذیر راضی کند", "summary_fa": "سرمایه‌گذاری پیشنهادی اوراکل در پروژه‌های انرژی تجدیدپذیر ۲ گیگاواتی برای نیومکزیکو در حالی صورت می‌گیرد که مخالفت‌های محلی می‌تواند توسعه مرکز داده پروژه مشتری را که اوراکل برای OpenAI می‌سازد، به تاخیر بیندازد. این دو شرکت فناوری در حال توسعه مرکز داده پروژه مشتری 165 میلیارد دلاری در سانتا ترزا، نیومکزیکو، به عنوان بخشی از پروژه زیرساختی گسترده‌تر Stargate AI هستند که توسط رئیس جمهور دونالد ترامپ در سال 2025 اعلام شد. اما پروژه ژوپیتر با اعتراض‌های محلی و درگیری‌های دادگاهی بر سر نگرانی‌ها در مورد اثرات زیست‌محیطی‌اش مواجه است - و آخرین اعلامیه اوراکل در 8 سپتامبر که به دنبال طرح‌هایی برای پروژه‌های انرژی‌های تجدیدپذیر است، این واقعیت را تغییر نمی‌دهد که مرکز داده با سلول‌های سوختی که گاز طبیعی مصرف می‌کنند تغذیه می ch با همکاری سگا، نسخه‌هایی از صندلی حرفه‌ای ارگونومیک مورد علاقه WIRED را منتشر کرد، من مشتاق شدم آن را از دیدگاه گیمر برای راهنمای خریدمان امتحان کنم تا از یک POV جنگجوی اداری. همه کادرها را بررسی می‌کند: ارگونومی راحت‌ای دارد که از یک صندلی اداری قابل تنظیم انتظار دارید، با طرح‌های ظریف و دلپذیر که از یکی از معتبرترین شرکت‌های بازی الهام گرفته شده است. عکس: Louryn Strampe این همکاری سگا در سه طرح زیباشناختی ارائه می شود که به نمادهای این شرکت ادای احترام می کند. نسخه Sonic دارای پشتی مشبک است، در حالی که نسخه‌های Genesis و Dreamcast به جای آن از چرم گیاهی استفاده می‌کنند. من نسخه Dreamcast را آزمایش کردم و ظاهر آن را دوست دارم. این مدل دارای طرح‌های نمادین چرخ‌هایی است که از کنترلر الهام گرفته شده است، به‌علاوه یک نوار نارنجی نارنجی بر روی دسته‌ها که به لوگوی چرخشی کنسول بازمی‌گردد. مونتاژ مبلمان همچنان یکی از ناامیدکننده‌ترین بخش‌های بازبینی است، اما هدف من این است که دقیقاً به همان روشی که خواننده‌های WIRED ممکن است این کار را انجام دهم: توسط خودم با مقدار زیادی فحش دادن. در این مورد، تجربه واقعاً بد نبود. جعبه ای که"}, {"source": "Wired", "title": "‘I’m Really Terrified’: A Mathematician Grapples With AI’s Recent Breakthroughs", "link": "https://www.wired.com/story/mathematician-steven-strogatz-grapples-with-ai-recent-breakthroughs/", "summary": "Steven Strogatz coauthored a book about how math is moving beyond human understanding. He spoke with WIRED about the seismic impact artificial intelligence has had on his life’s work.", "date_str": "2026-09-12T10:00:00+00:00", "hash": "40e8d52e66bbf7ff", "title_fa": "\"من واقعا وحشت دارم\": یک ریاضیدان با پیشرفت های اخیر هوش مصنوعی دست و پنجه نرم می کند", "summary_fa": "Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان ریاضیدان و نویسنده استیون استروگاتز وقتی در مورد پیشرفت‌های مبتنی بر هوش مصنوعی در رشته خود در هفته گذشته صحبت می‌کند شروع به گریه می‌کند. پروفسور دانشگاه کرنل می‌گوید: «این علم هیجان‌انگیز است، اما ناخوشایندهای انسانی زیادی با آن همراه است.» روز سه‌شنبه، OpenAI گفت که از ده‌ها هزار عامل برای حل یک مسئله ریاضی ۹۰ ساله استفاده کرده است، که یک جایزه یک میلیون دلاری به آن اضافه شده بود. راه حل - که هنوز نیاز به تأیید مستقل دارد - بر اساس استراتژی توسعه یافته توسط ریاضیدانان اسپانیایی دیگو کوردوبا و لوئیس مارتینز-زوروآ است. این اعلامیه با ادعاهای یک ریاضیدان دیگر، Tristan Buckmaster، که می گوید OpenAI پس از اطلاع از کار او در کنار Levent Alpöge، محقق Anthropic، برای حل این مشکل عجله کرد. Buckmaster ادعا می کند که OpenAI همچنین سعی کرده است بر افرادی که اعتبار کار را دریافت می کنند تأثیر بگذارد. این گسست نشانه‌ای از تغییرات سریعی است که در این زمینه به دلیل پیشرفت‌های هوش مصنوعی رخ می‌دهد و استروگاتز - که کتاب Big Math را نوشته است، کتابی درباره اینکه چگونه ریاضیات از درک بشری خارج می‌شود و در نوامبر منتشر می‌شود - به عنوان مسابقه آزمایشگاه‌های شرکتی برای گرفتن سرفصل‌ها پیش از عرضه‌های اولیه عمومی پرفروش توصیف می‌کند. هفته گذشته، آنتروپیک گفت که کلود 29500 قضیه کوچک را در حالی که اثبات موجود آخرین قضیه بدنام فرما را رسمی می کند، اثبات کرده است - پروژه ای که دیگر ریاضیدانان سال ها روی آن کار می کردند. در ماه آگوست، OpenAI اعلام کرد که در 10 مسئله ریاضی طولانی مدت پیشرفت کرده است. استروگاتز می‌گوید هوش مصنوعی باعث می‌شود پیشرفت‌های ریاضی سریع‌تر اتفاق بیفتد، اما معنای آن برای کارشناسانی که زندگی خود را وقف این رشته کرده‌اند"}, {"source": "Wired", "title": "You Don’t Have a Right to Safe Drinking Water, Trump-Appointed Judge Rules", "link": "https://www.wired.com/story/you-dont-have-right-to-safe-drinking-water-trump-appointed-judge-rules/", "summary": "And if your tap water is undrinkable, you have no “constitutional right to truthful information” about it.", "date_str": "2026-09-12T09:30:00+00:00", "hash": "767a7186a9724f42", "title_fa": "شما حق ندارید آب آشامیدنی سالمی داشته باشید، طبق قوانین قاضی منصوب شده توسط ترامپ", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان این داستان در اصل در Mother Jones ظاهر شد و بخشی از همکاری میز آب و هوا است. روز جمعه، دادگاه تجدیدنظر ناحیه پنجم رد دعوی علیه شهر جکسون، می سی سی پی را تایید کرد که مدعی بود شهر آگاهانه به ساکنان اجازه نوشیدن آب آلوده به سرب را داده است. این دادخواست که برای اولین بار در سال 2022 ارائه شد، می‌گوید که آلودگی، حق قانون اساسی جکسونیان برای تمامیت بدنی را نقض کرده است. کرت انگلهارت قاضی منصوب شده توسط دونالد ترامپ با این موضوع مخالف بود. انگلهارت گفت: «قانون اساسی برای هر تخلف دولتی جبران خسارت نمی کند. «اقدامات متهمان ظاهراً شاکیان را از آب پاکیزه و اطلاعات بی‌خیال محروم کرده است. این محرومیت‌ها در عین دردناک بودن، به هیچ‌کدام از حقوق اساسی ریشه‌دار قانون اساسی تجاوز نمی‌کند.» این ممکن است در می سی سی پی درست باشد - اما در سطح ایالت حداقل در نه ایالت ایالات متحده و در بیش از ده ها کشور دیگر، آب آشامیدنی تمیز در واقع یک حق محافظت شده است. در کشورهایی از جمله اروگوئه و آفریقای جنوبی، حق آب پاک در قانون اساسی ذکر شده است. قانون اساسی ایالت نیویورک، بر اساس اصلاحیه سال 2021، بیان می کند که \"هر فردی حق دارد هوا و آب تمیز و محیطی سالم داشته باشد.\" همچنین در ماساچوست، جایی که از سال 1972 \"حق داشتن هوا و آب پاک\" در قانون اساسی حمایت شده است. اما بر اساس حکم حوزه پنجم، قانون اساسی ایالات متحده برای چنین ادعایی بسیار محدود است. شاکیان جکسون ادعا کردند که دولت شهر آنها عمداً اطلاعات مربوط به سمیت آب را مخفی کرده و از طریق یک سری اعلامیه های مربوط به آب جوش، مشکل را تشدید کرده است - عملی که می"}, {"source": "Wired", "title": "The 9 Best TV Shows to Stream This Month (September 2026)", "link": "https://www.wired.com/story/the-9-best-shows-to-stream-right-now/", "summary": "South Park, Slow Horses, Neon Genesis Evangelion, and a Lego-fied Mandalorian are just a few of the things you should be watching right now.", "date_str": "2026-09-11T19:36:43+00:00", "hash": "6d3c4f3da392dd5e", "title_fa": "9 بهترین برنامه تلویزیونی برای پخش در این ماه (سپتامبر 2026)", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان سپتامبر معمولاً زمانی است که تلویزیون دوباره جدی می شود. بزرگ‌ترین برنامه‌های تلویزیونی تابستان پایان‌های خود را پخش کرده‌اند، برنامه‌های پاییز به سرعت بالا می‌رود، و پخش ره این داستان Comment Loader Save Story ذخیره این داستان طبق اسنادی که WIRED از طریق درخواست قانون آزادی اطلاعات به دست آورده است، دولت ایالات متحده حداقل سه تحقیق گزارش نشده قبلی را در مورد تجارت در بازار پیش بینی پلی مارکت آغاز کرد. سوابق رای گیری از کمیسیون معاملات آتی کالا، آژانس فدرال که بازارهای پیش بینی را تنظیم می کند، نحوه برخورد دولت با این تحقیقات را روشن می کند. در اوایل ماه مه، مایکل سلیگ، رئیس CFTC، دستوری را تصویب کرد که به بخش اجرایی آژانس اجازه می‌دهد تحقیقات خصوصی را در مورد معاملات بالقوه خودی در قراردادهای رویداد Polymarket مربوط به عفو صادر شده توسط جوزف بایدن، رئیس‌جمهور سابق، آغاز کند. این دستور اجازه شهادت، احضاریه، ادای سوگند و نیاز به ارائه اسناد در جریان تحقیقات را صادر کرد. اسناد به دست آمده توسط WIRED مشخص نمی‌کنند که کدام معاملات مشکوک هستند، اما این دستور چندین هفته پس از گزارش NPR درباره یک معامله‌گر مشکوک Polymarket که در روزهای پایانی دولت بایدن بیش از 300000 دلار در بازارهای مرتبط با عفو کسب کرده بود، صادر شد. تاجر به درستی شرط بندی کرد که رئیس جمهور سابق عفو پیشگیرانه ای را برای تعدادی از منتقدان برجسته MAGA، از جمله نمایندگان سابق ایالات متحده، لیز چنی و آدام کینزینگر، و سناتور آمریکایی آدام شیف، صادر خواهد کرد. در پایان ماه مه، سلیگ دستور تحقیقات دیگری را تصویب کرد. این بار موضوع «قراردادهای رویداد ایران» در پلی مارکت بود. همانند اسناد عفو بایدن، دستور تحقیقات جزئیاتی را ارائه نکرد، اما دو هفته پس از آن منتشر شد که 60 Minutes گزارشی را در مورد شبکه ای از حساب های مشکوک پلی مارکت پخش کرد که 2.4 میلیون دلار در معاملات مرتبط با ایران درآمد داشت، با نرخ برد 98 درصد. جوزف کونیزهسکی، وکیل دادگستری سابق"}, {"source": "Wired", "title": "Meta Sued Over Training Data for Its AI and Face-Recognition Systems", "link": "https://www.wired.com/story/meta-sued-over-training-data-for-its-ai-and-face-recognition-systems/", "summary": "The proposed class action alleges Meta illegally harvested people’s Facebook and Instagram photos to train its AI image-generation models and to build its unreleased “NameTag” face recognition feature.", "date_str": hash": "98c9d2bde627abb0", "title_fa": "۳ اپلیکیشن متن‌باز قدرتمند که جایگزین بهتری برای قابلیت‌های پیش‌فرض ویندوز هستند", "summary_fa": "برخی برنامه‌های متن‌باز و رایگان، امکانات پیشرفته‌تری نسبت به ابزارهای پیش‌فرض مدیریت فایل، تسک‌منیجر و جست‌وجوی ویندوز ارائه می‌دهند. تبلیغات مایکروسافت در چند سال اخیر به‌جای افزودن قابلیت‌های جدید به ویندوز، بیشتر روی صیقل‌دادن امکانات موجود تمرکز کرده است. مرورگر فایل، Task Manager و جست‌وجوی ویندوز سه ابزار کلیدی هستند که هر روز با آن‌ها سروکار داریم، اما با وجود آپدیت‌های پیاپی ویندوز ۱۱، همچنان از نسخه‌های متن‌باز و رایگان مشابه خود عقب‌ترند. خبر خوب اینکه لازم نیست منتظر مایکروسافت بمانید تا کمبودها را برطرف کند. در ادامه سه نرم‌افزار متن‌باز معرفی می‌کنیم که هرکدام از آن‌ها جایگزین قدرتمند یکی از ابزارهای پرکاربرد ویندوز است. فهرست مطالب اپلیکیشن Files؛ جایگزین قدرتمند مرورگر فایل ویندوز برنامه System Informer؛ تسک‌منیجر برای کاربران حرفه‌ای برنامه Flow Launcher؛ جایگزین سریع‌تر برای جست‌وجوی ویندوز کپی لینک اپلیکیشن Files؛ جایگزین قدرتمند مرورگر فایل ویندوز قابلیت تب که چند سال قبل به File Explorer ویندوز اضافه شد، از مدت‌ها پیش در نرم‌افزار متن‌باز Files وجود دارد. این برنامه‌ی مدیر فایل رایگان و متن‌باز اساسا نسخه‌ی حرفه‌ای‌تر مرورگر فایل ویندوز محسوب می‌شود. نکته‌ی جالب درباره‌ی Files اینکه ظاهر و منطق کارکردش آن‌قدر شبیه فایل اکسپلورر ویندوز است که عملاً هیچ نیازی به یادگیری آن ندارید. برای استفاده از Files: کپی لینک برنامه System Informer؛ تسک‌منیجر برای کاربران حرفه‌ای اگر غیر از نظارت یا بستن برنامه‌ها و بررسی مصرف پردازنده، رم و گرافیک، می‌خواهید وارد جزئیات عمیق‌تر کامپیوتر ویندوزی خود شوید، System Informer انتخاب بسیار بهتری نسبت به Task Manager است. این ابزار متن‌باز همان کارهای پایه‌ای تسک‌منیجر را انجام می‌دهد، اما با جزئیات به‌مراتب بیشتر. از مهم‌ترین ویژگی‌های این اپ می‌توان به موارد زیر اشاره کرد:"}, {"source": "Zoomit", "title": "رقابت دیوانه‌وار؛ آنر احتمالا یک گوشی با باتری ۱۱ هزار میلی‌آمپرساعتی می‌سازد", "link": "https://www.zoomit.ir/mobile/467020-honor-magic-9-series-leaked/", "summary": "اطلاعات فاش‌شده از مشخصات سری آنر مجیک ۹، از حضور مدل ویژه‌ای با باتری ۱۱ هزار میلی‌آمپرساعتی و فن داخلی خبر می‌دهد.", "date_str": "2026-09-12T13:40:00+00:00", "hash": "6d22bf400f0d9cb5", "title_fa": "رقابت دیوانه‌وار؛ آنر احتمالا یک گوشی با باتری ۱۱ هزار میلی‌آمپرساعتی می‌سازد", "summary_fa": "اطلاعات فاش‌شده از مشخصات سری آنر مجیک ۹، از حضور مدل ویژه‌ای با باتری ۱۱ هزار میلی‌آمپرساعتی و فن داخلی خبر می‌دهد. تبلیغات آنر پس از نمایش طراحی ظاهری پرچمداران نسل جدیدش، قصد دارد گوشی‌های سری مجیک ۹ را در سه مدل استاندارد، پرو مکس و سوپر ادیشن روانه‌ی بازار کند. تمامی مدل‌ها ظاهرا از همان زبان طراحی ماژول دوربین بهره می‌برند که پیش‌تر در تصاویر رسمی به نمایش درآمده بود. به گفته‌ی افشاگران چینی ، مدل Magic9 Super Edition مجهز به نمایشگر ۶٫۸ اینچی با نرخ نوسازی ۱۶۵ هرتز و تراشه‌ی Snapdragon 8 Elite Gen 5 خواهد بود. ویژگی برجسته‌ی این نسخه، باتری فوق‌العاده حجیم ۱۱ هزار میلی‌آمپرساعتی همراه با فن خنک‌کننده و بدنه‌ای از جنس فایبرگلاس است. مجموعه‌ی دوربین پشتی احتمالا شامل دوربین اصلی ۲۰۰ مگاپیکسلی در کنار دوربین‌های ۱۲ و ۵۰ مگاپیکسلی می‌شود و خبری از نشان تجاری ARRI نخواهد بود. مدل پایه‌ی مجیک ۹ احتمالا از نمایشگر ۶٫۳۷ اینچی، باتری ۸ هزار میلی‌آمپرساعتی، دوربین سلفی سه‌بعدی و تراشه‌ی Snapdragon 8 Elite Gen 5 بهره می‌برد. سیستم تصویربرداری پشتی از دو حسگر ۲۰۰ مگاپیکسلی تشکیل می‌شود که با همکاری ARRI توسعه یافته‌اند. پیشرفته‌ترین نسخه یعنی مجیک ۹ پرو مکس به نمایشگر ۶٫۸ اینچی، بدنه‌ی فلزی و تراشه‌ی Snapdragon 8 Elite Gen 6 Extreme مجهز می‌شود. این پرچمدار از دوربین دوگانه‌ی ۲۰۰ مگاپیکسلی، دوربین سلفی به همراه سنسور 3D ToF و باتری ۸٬۸۰۰ میلی‌آمپرساعتی استفاده می‌کند."}, {"source": "Zoomit", "title": "مدیریت در عصر هوش مصنوعی؛ مهارت‌هایی که رهبران آینده به آن نیاز دارند", "link": "https://www.zoomit.ir/pr/467059-high-road-leadership-maxwell-book/", "summary": "کتاب رهبری در مسیر والا اثر جان سی ماکسول با تمرکز بر اخلاق، همدلی و اعتمادسازی، مهارت‌های کلیدی رهبران آینده را در عصر هوش مصنوعی بررسی می‌کند.", "date_str": "2026-09-12T13:00:00+00:00", "hash": "2a29434267110e67", "title_fa": "مدیر  یوان (حدود ۲٬۲۳۰ دلار) چالش بزرگی پیش روی کوپرتینویی‌ها در سومین بازار بزرگ خود قرار می‌دهد؛ منطقه‌ای که حدود ۱۷ درصد از درآمد کل اپل را تامین می‌کند. به روایت CNBC ، ارزش سهام اپل پس از مراسم رونمایی بیش از ۳ درصد افزایش یافت. بازار چین هم‌اکنون میزبان مدل‌های متنوع تاشدنی کتابی، تاشدنی عمودی و حتی مدل سه‌تکه از شرکت‌های مختلفی نظیر هواوی، شیائومی، آنر، اوپو و ویوو است. یکی از کاربران پلتفرم وی‌چت در واکنش به این معرفی نوشت: «من امسال این مدل را نمی‌خرم. سال آینده نسل دوم گوشی را تهیه خواهم کرد.» قیمت بالای آیفون دوئو برای اپل چالشی در چین ایجاد کرده است"}, {"source": "Zoomit", "title": "اختلال‌ها در «شاد» به پایان می‌رسد؟ خریداری ۳۰۰ سرور جدید برای وزارت آموزش و پرورش", "link": "https://www.zoomit.ir/tech-iran/467079-shad-network-new-servers-update/", "summary": "وزارت آموزش و پرورش از تجهیز شبکه شاد به ۳۰۰ سرور جدید و انتشار نسخه تازه این سامانه در مهرماه خبر داد.", "date_str": "2026-09-12T10:47:50+00:00", "hash": "99c64fa962c9a09b", "title_fa": "اختلال‌ها در «شاد» به پایان می‌رسد؟ خریداری ۳۰۰ سرور جدید برای وزارت آموزش و پرورش", "summary_fa": "وزارت آموزش و پرورش از تجهیز شبکه شاد به ۳۰۰ سرور جدید و انتشار نسخه تازه این سامانه در مهرماه خبر داد. تبلیغات به‌گزارش ایسنا، محمود حبیبی، رئیس مرکز توسعه آموزش مجازی، فناوری و امنیت اطلاعات وزارت آموزش و پرورش، با اعلام این موضوع اظهار کرد که فرایند تقویت پایداری شبکه در دو مرحله انجام می‌پذیرد. محمود حبیبی، رئیس مرکز توسعه آموزش مجازی، فناوری و امنیت اطلاعات وزارت آموزش و پرورش، گفت: «با توجه به ضرورت ارتقای زیرساخت‌ها و افزایش پایداری شبکه، مقرر شده است ۳۰۰ سرور جدید به مجموعه سرورهای شاد اضافه شود. تاکنون حدود ۱۴۰ سرور خریداری شده و این سرورها از ابتدای مهرماه وارد مدار می‌شوند و طبق برنامه زمان‌بندی، مابقی سرورها نیز تا پایان آبان‌ماه به شبکه اضافه خواهند شد.» به گفته او نسخه جدید سوپر اپلیکیشن شاد با سرویس‌های آموزشی تازه و قابلیت استفاده نامحدود از کلاس مجازی در دسترس معلمان قرار می‌گیرد. همچنین با اتمام انتخاب واحد، کلاس‌بندی دانش‌آموزان به‌صورت خودکار در بستر شاد اعمال خواهد شد. وی با اشاره به تجمیع امور در پنجره واحد my.medu.ir، بر انجام غربالگری طرح نماد تأکید کرد و از خانواده‌ها خواست ثبت‌نام و خرید کتب درسی را به روزهای پایانی موکول نکنند."}, {"source": "Zoomit", "title": "رئیس اتحادیه موبایل تهران: مردم برای خرید موبایل عجله نکنند؛ قیمت‌ها می‌شکند", "link": "https://www.zoomit.ir/iran-news/467074-mobile-phone-prices-expected-drop/", "summary": "رئیس اتحادیه صنف فروشندگان تلفن همراه تهران از احتمال افت ۲۰ تا ۳۰ درصدی قیمت‌ها خبر داد.", "date_str": "2026-09-12T10:32:35+00:00", "hash": "2375d255d18a9093", "title_fa": "رئیس اتحادیه موبایل تهران: مردم برای خرید موبایل عجله نکنند؛ قیمت‌ها می‌شکند", "summary_fa": "رئیس اتحادیه صنف فروشندگان تلفن همراه تهران از احتمال افت ۲۰ تا ۳۰ درصدی قیمت‌ها خبر داد. تبلیغات روند ثبت سفارش تلفن همراه پس از وقفه‌ای چندماهه به دلیل اولویت‌بندی‌های ارزی دوباره آغاز شده و ادعا می‌شود با ورود محموله‌های جدید، احتمال کاهش ۲۰ تا ۳۰ درصدی قیمت‌ها در بازار وجود دارد. به‌گزارش تسنیم، اعلام شده که تامین ارز مورد نیاز واردات از طریق ارز حاصل از صادرات خود یا دیگران انجام می‌پذیرد و در فاز کنونی تنها امکان ثبت سفارش گوشی‌های کمتر از ۴۰۰ یورو فراهم است تا نیازهای اساسی بازار تامین شود. رمضان، رئیس اتحادیه صنف فروشندگان دستگاه‌های صوتی، تصویری، تلفن همراه و لوازم جانبی تهران، گفت: «با توجه به شرایط کشور و اولویت‌بندی‌های ارزی، ثبت سفارش برای مدتی به تعویق افتاد، اما با نمایان شدن کمبود کالا در بازار، این روند مجددا آغاز شد. از سرگیری این فرآیند خبر مثبتی است؛ چرا که با افزایش عرضه، فضای رقابتی ایجاد می‌شود و واردکنندگان برای تامین نقدینگی، تمایل بیشتری به عرضه کالا با سود کمتر خواهند داشت.» رمضان، رئیس اتحادیه صنف فروشندگان دستگاه‌های صوتی، تصویری، تلفن همراه و لوازم جانبی تهران، گفت: «واردکنندگان ما برخلاف تصور، با موانع جدی برای انتقال کالا و دریافت خدمات مواجه‌اند؛ با وجود این تلاش می‌کنند تا مدل‌های جدید تلفن همراه با فاصله کوتاهی از رونمایی جهانی، در بازار ایران نیز در دسترس باشند.» کپی لینک دولت در هزینه رجیستری تجدیدنظر کند رمضان، رئیس اتحادیه صنف فروشندگان دستگاه‌های صوتی، تصویری، تلفن همراه و لوازم جانبی تهران، گفت: «اگر دولت در هزینه‌های گمرکی و رجیستری برخی گوشی‌ها تجدیدنظر کند، کالا می‌تواند در مدت یک تا دو ماه با قیمت مناسب‌تری به دست مصرف‌کننده برسد.»"}, {"source": "Zoomit", "title": "قیمت گوشی ۲۱ شهریور؛ جهش بیش از ۵۰ درصدی گلکسی A16", "link": "https://www.zoomit.ir/mobile/467034-smartphones-price-guide-1405-06-21/", "summary": "میانگین قیمت گوشی‌های هوشمند ۳٫۴ درصد گران شد تا رشد ماهانه به ۲۵٫۶ درصد برسد.", "date_str": "2026-09-12T10:30:00+00:00", "hash": "732e38a3d7862869", "title_fa": "قیمت گوشی ۲۱ شهریور؛ جهش بیش از ۵۰ درصدی گلکسی A16", "summary_fa": "میانگین قیمت گوشی‌های هوشمند ۳٫۴ درصد گران شد تا رشد ماهانه به ۲۵٫۶ درصد برسد. تبلیغات میانگین قیمت گوشی در حدود ۱۰ روز اخیر ۳٫۴ درصد گران شد. بازه‌ی هفتگی با صعود ۱٫۹ درصدی همراه بود و نرخ‌ها در مقیاس ماهانه رشد چشمگیر ۲۵٫۶ درصدی را ثبت کرده‌اند. از مجموع ۳۹ محصول قیمت‌خورده در بازار، ۱۷ مدل گران‌تر فروخته شدند، ۴ مدل افت قیمت داشتند و بهای ۱۸ محصول تقریبا بدون تغییر باقی ماند تا روند ملایم پیشین جای خود را به افزایش شتابان بدهد. قیمت گلکسی A16 در نسخه‌ی 5G با جهش خیره‌کننده‌ی ۵۶٫۴ درصدی به ۶۱ میلیون و ۱۶۰ هزار تومان رسید و بیشترین نوسان مثبت را رقم زد. در گروه میان‌رده‌ها قیمت گلکسی A56 سامسونگ رشدی ۲۳٫۳ درصدی را ثبت کرد و به حدود ۱۰۵ میلیون تومان رسید. قیمت پوکو X7 پرو شیائومی پس از کاهش موقت، دوباره ۱۱٫۷ درصد گران شد و به ۱۱۲ میلیون و ۷۰۰ هزار تومان رسید. قیمت آیفون ۱۷ و آیفون ۱۷ پرو مکس اپل نیز باز هم بالاتر رفت. جهش سنگین نرخ در مدل اقتصادی سامسونگ همزمان با افزایش قیمت پوکو X7 پرو، میل خریداران به سمت میان‌رده‌های توانمند و گوشی‌های مقرون‌به‌صرفه‌تر را بازتاب می‌دهد."}, {"source": "Zoomit", "title": "سازنده بازی GTA 6 دادگاهی می‌شود؟", "link": "https://www.zoomit.ir/business/466994-rockstar-games-gta-6-lawsuit/", "summary": "جمعی از سازندگان سابق GTA 6 شکایتی را علیه راک‌استار گیمز در دادگاه کار اسکاتلند ثبت کردند.", "date_str": "2026-09-12T09:45:00+00:00", "hash": "72332bfef7144640", "title_fa": "سازنده بازی GTA 6 دادگاهی می‌شود؟", "summary_fa": "جمعی از سازندگان سابق GTA 6 شکایتی را علیه راک‌استار گیمز در دادگاه کار اسکاتلند ثبت کردند. تبلیغات گروهی از توسعه‌دهندگان سابق بازی GTA 6 در بریتانیا، شکایتی حقوقی را علیه راک‌استار گیمز به‌دلیل اخراج ناعادلانه در دادگاه کار اسکاتلند به جریان انداختند. شاکیان که پیش‌تر در شعبه‌ی ادینبرو فعالیت می‌کردند، مدعی هستند اخراج آن‌ها به علت فعالیت‌های سندیکایی رخ داده است. این افراد تحت نمایندگی اتحادیه‌ی کارگران مستقل بریتانیا (IWGB) در دادگاه حاضر شده‌اند. حدود ۳۴ نفر در بریتانیا و کانادا در اکتبر ۲۰۲۵ (مهرماه سال گذشته) از کار برکنار شدند و اکنون ۲۳ نفر از آن‌ها پرونده‌ی حقوقی را در شهر گلاسکو دنبال می‌کنند. راک‌استار، زیرمجموعه‌ی Take-Two Interactive، اعلام کرده اتهامات را با قاطعیت رد می‌کند. ناشر بازی، شاکیان را متهم کرده که قوانین محرمانگی را با بحث درباره‌ی اطلاعات حساس در یک سرور دیسکورد نقض کرده‌اند و به همین دلیل برکنار شده‌اند. جلسات رسیدگی به این شکایت در دادگاه گلاسکو آغاز شده و هم‌زمان تجمعی اعتراضی بیرون ساختمان دادگاه شکل گرفته است. جیسون لوئیس، کارمند سابق راک‌استار و عضو IWGB، گفت: «برای نزدیک به یک سال، حقیقتِ آنچه برای ما رخ داد توسط راک‌استار پنهان و با گمانه‌زنی‌ها احاطه شد. اکنون سرانجام فرصت داریم تا ماجرا را رسما ثبت کنیم.» «هیچ‌کدام از ما تصورش را نمی‌کردیم که صحبت درباره‌ی شرایط کاری‌مان، زندگی ما را دگرگون کند و ما را در کانون طوفان رسانه‌ای جهانی قرار دهد. در حالی که جهان برای انتشار GTA VI آماده می‌شود، ما بار دیگر دل‌شکستگی کنار گذاشته‌شدن از پروژه‌ای را تجربه می‌کنیم که بخش بزرگی از زندگی‌مان را صرف آن کردیم. ما شغل، درآمد، جامعه‌ی خود و فرصت دیدن نتیجه‌ی نهایی بازی را پس از سال‌ها مشارکت در ساخت آن از دست دادیم. این اتفاق ویران‌کننده بود.»"}, {"source": "Zoomit", "title": "قارچ جادویی مرز میان «خود» و جهان را در مغز محو می‌کند", "link": "https://www.zoomit.ir/health-medical/465869-psilocybin-brain-networks-oneness/", "summary": "پژوهشی تازه نشان می‌دهد سیلوسایبین با تغییر ارتباط میان شبکه‌های مغزی، مرز میان «خود» و جهان را کمرنگ و احساس یکی‌بودن با محیط را تقویت می‌کند.", "date_str": "2026-09-12T09:35:00+00:00", "hash": "ddce2d0361795fb0", "title_fa": "قارچ جادویی مرز میان «خود» و جهان را در مغز محو می‌کند", "summary_fa": "پژوهشی تازه نشان می‌دهد سیلوسایبین با تغییر ارتباط میان شبکه‌های مغزی، مرز میان «خود» و جهان را کمرنگ و احساس یکی‌بودن با محیط را تقویت می‌کند. تبلیغات مصرف مواد روان‌گردان می‌تواند مرز میان خود و جهان پیرامون را در مغز کم‌رنگ کند و احساس عمیقی از یکی‌بودن با جهان به وجود آورد. اکنون، پژوهشگران تغییرات مشخصی را در مغز شناسایی کرده‌اند که ممکن است زیربنای این دگرگونی در تجربه‌ی آگاهی باشد. به‌گزارش ساینتیفیک‌امریکن ، پژوهشی تازه نشان می‌دهد سیلوسایبین، ماده‌ی فعال موجود در قارچ‌های جادویی، باعث می‌شود شبکه‌های مغزی که معمولاً «خود» و جهان بیرون را به‌طور جداگانه پردازش می‌کنند، به شکلی یکپارچه‌تر با یکدیگر فعالیت کنند. دوون استولیکر، عصب‌پژوه محاسباتی در دانشگاه موناش استرالیا و نویسنده‌ی اصلی پژوهش، می‌گوید: «این یافته با ارائه‌ی مبنایی زیستی برای بخشی از معنا و انسجامی که مردم گزارش می‌کنند، درک ما از تجربه‌ی روان‌گردان را بازتعریف می‌کند.» در جریان تجربه‌ی ناشی از مصرف سیلوسایبین، فعالیت مغز معمولاً تصادفی‌تر و آشفته‌تر می‌شود. شبکه‌هایی از نورون‌ها که معمولاً هم‌زمان فعال می‌شوند، هماهنگی خود را از دست می‌دهند و ارتباطات تازه‌ای نیز ممکن است شکل بگیرد. تغییرات الگوهای معمول ارتباط میان بخش‌های مختلف مغز را برهم می‌زند و شاید در آثار درمانی احتمالی سیلوسایبین برای برخی اختلالات سلامت روان نیز نقش داشته باشد. بااین‌حال، تجربه‌ی سیلوسایبین یک تناقض هم ایجاد می‌کند. استولیکر می‌پرسد: «اگر مغز بی‌نظم‌تر می‌شود، پس چرا برخی افراد تجربه‌هایی بسیار معنادار و منسجم دارند؟» پژوهشگران در مطالعه متوجه شدند در پس آشفتگی ظاهری، نوعی «نظم پنهان» وجود دارد. نظم به‌ویژه در افرادی آشکار شد که تجربه‌ی آگاهانه‌شان بیش از همه تحت‌تأثیر سیلوسایبین قرار گرفته بود."}, {"source": "Zoomit", "title": "از تسخیر پرچم تا کشف آسیب‌پذیری‌های پنهان؛ CTF چیست و چرا هکرها برای تسخیر پرچم رقابت می‌کنند؟", "link": "https://www.zoomit.ir/report/467061-what-is-ctf-cybersecurity-competition/", "summary": "در مسابقات CTF، متخصصان امنیت به‌جای حمله به سامانه‌های واقعی، در محیطی کنترل‌شده آسیب‌پذیری‌ها را کشف و «پرچم» را تصاحب می‌کنند.", "date_str": "2026-09-12T09:30:00+00:00", "hash": "847c7ab10ab67224", "title_fa": "از تسخیر پرچم تا کشف آسیب‌پذیری‌های پنهان؛ CTF چیست و چرا هکرها برای تسخیر پرچم رقابت می‌کنند؟", "summary_fa": "در مسابقات CTF، متخصصان امنیت به‌جای حمله به سامانه‌های واقعی، در محیطی کنترل‌شده آسیب‌پذیری‌ها را کشف و «پرچم» را تصاحب می‌کنند. تبلیغات تصور کنید وارد اتاقی شده‌اید که در آن یک وب‌سایت آسیب‌پذیر، چند فایل مرموز، یک برنامه ناشناخته و انبوهی از داده‌های رمزگذاری‌شده مقابل شما قرار دارد. سرنخ‌ها محدودند، زمان به‌سرعت می‌گذرد و تیم‌های دیگری هم‌زمان در حال حل همان معماها هستند. هدف، پیدا کردن رشته‌ای از حروف و اعداد است که در گوشه‌ای از این محیط دیجیتال پنهان شده؛ رشته‌ای که در ادبیات این رقابت‌ها «پرچم» نام دارد. این تصویر کلی یک مسابقه CTF یا Capture The Flag است؛ رقابتی که دانش امنیت سایبری را به مجموعه‌ای از چالش‌های عملی، معماهای فنی و مأموریت‌های زمان‌دار تبدیل می‌کند. شرکت‌کنندگان باید از دانسته‌های خود در زمینه‌هایی مانند امنیت وب، رمزنگاری، مهندسی معکوس، تحلیل بدافزار، شبکه و جرم‌یابی دیجیتال استفاده کنند تا پرچم‌ها را پیدا کنند، امتیاز بگیرند و در جدول رقابت بالا بروند. CTF در ظاهر یک بازی است، اما مهارت‌هایی را می‌سنجد که در جهان واقعی برای شناسایی حمله، کشف آسیب‌پذیری و دفاع از سامانه‌های دیجیتال ضروری‌اند. کپی لینک پرچمی که از پارچه ساخته نشده است عبارت Capture The Flag به معنای «تسخیر پرچم» از یک بازی گروهی گرفته شده است. در شکل سنتی بازی، هر تیم باید از پرچم خود محافظت کند و هم‌زمان پرچم تیم مقابل را به دست آورد. نسخه سایبری همین منطق را به محیط رایانه منتقل کرده است؛ با این تفاوت که پرچم معمولاً یک رشته متنی منحصربه‌فرد مانند flag است. این رشته ممکن است در کد یک برنامه، پایگاه داده، فایل حذف‌شده، بسته‌های شبکه یا بخشی محافظت‌شده از یک سرور پنهان شده باشد. شرکت‌کننده برای رسیدن به آن باید مسئله را تحلیل و راه درست نفوذ به محیط طراحی‌شده را پیدا کند. پس از کشف پرچم، آن را در سامانه مسابقه ثبت می‌کند"}, {"source": "Zoomit", "title": "چگونه نتایج قرعه کشی ایران خودرو را ببینیم؟", "link": "https://www.zoomit.ir/iran-news/467064-ikco-new-sales-how-to/", "summary": "ایران خودرو صبح امروز قرعه‌کشی دور جدید فروش محصولاتش را انجام داد. چگونه می‌توانیم نتایج قرعه کشی را ببینیم؟", "date_str": "2026-09-12T09:21:38+00:00", "hash": "5dfe5601fb78b642", "title_fa": "چگونه نتایج قرعه کشی ایران خودرو را ببینیم؟", "summary_fa": "ایران خودرو صبح امروز قرعه‌کشی دور جدید فروش محصولاتش را انجام داد. چگونه می‌توانیم نتایج قرعه کشی را ببینیم؟ تبلیغات متقاضیان طرح‌های فروش ایران خودرو برای مشاهده‌ی نتیجه‌ی قرعه‌ کشی و وضعیت اولویت خود باید از سامانه‌ی رسمی فروش ایران‌ خودرو استفاده کنند. نتایج پس از پایان فرایند اولویت‌بندی و انجام بررسی‌ها و تأییدهای لازم، در حساب کاربری متقاضیان قرار می‌گیرد؛ بنابراین نیازی به جست‌وجوی اسامی برندگان در سایت‌ها و کانال‌های غیررسمی نیست. در پانزدهمین مرحله‌ی فروش محصولات ایران‌ خودرو، در مجموع ۲ میلیون و ۳۷۵ هزار و ۸۷۰ نفر ثبت درخواست کردند. از این تعداد، ۲ میلیون و ۷۶ هزار و ۲۲۶ نفر متقاضی عادی، ۲۶۳ هزار و ۷۲۲ نفر متقاضی طرح حمایت از خانواده و جوانی جمعیت و ۳۵ هزار و ۹۲۲ نفر متقاضی طرح جایگزینی خودروهای فرسوده هستند. مشاهده‌ی نتایج قرعه‌کشی ایران‌خودرو برای مشاهده‌ی نتایج قرعه کشی ایران خودرو ابتدا وارد سایت رسمی فروش اینترنتی این شرکت شوید. پس از بازشدن سایت، گزینه‌ی ورود به حساب کاربری را انتخاب کنید و با اطلاعاتی که هنگام ثبت‌نام وارد کرده‌اید، وارد حساب خود شوید. پس از ورود، از میان گزینه‌های موجود به بخش «استعلام وضعیت اولویت‌بندی» بروید. وضعیت درخواست ثبت‌شده و نتیجه‌ی اولویت‌بندی از این قسمت قابل مشاهده است. اگر هنوز نتیجه‌ای در حساب کاربری شما نمایش داده نمی‌شود، لزوماً به این معنی نیست که در قرعه‌کشی انتخاب نشده‌اید. نتیجه‌ی قرعه‌کشی بلافاصله پس از برگزاری مراسم نهایی نمی‌شود و باید بررسی‌ها و تأییدهای اداری مربوط به آن انجام شود. ایران‌خودرو پس از تکمیل این مراحل، وضعیت نهایی متقاضیان را در سامانه اعلام می‌کند و برای منتخبان نیز پیامک اطلاع‌رسانی ارسال خواهد شد."}, {"source": "Zoomit", "title": "در آستانه فروش آیفون ۱۸ پرو مکس، اپل استور از دسترس خارج شد", "link": "https://www.zoomit.ir/mobile/467060-apple-store-down-ahead-of-iphone-18-pro-max-preorders/", "summary": "اپل استور ساعاتی پیش از آغاز پیش‌فروش آیفون ۱۸ پرو و پرو مکس از دسترس خارج شد.", "date_str": "2026-09-12T09:05:01+00:00", "hash": "ee15be23a684cc8a", "title_fa": "در آستانه فروش آیفون ۱۸ پرو مکس، اپل استور از دسترس خارج شد", "summary_fa": "اپل استور ساعاتی پیش از آغاز پیش‌فروش آیفون ۱۸ پرو و پرو مکس از دسترس خارج شد. تبلیغات اپل درست پیش از شروع موج تازه‌ی خرید، فروشگاه آنلاین خود را از دسترس خارج کرد؛ نشانه‌ای آشنا برای کاربرانی که هر سال در آستانه‌ی عرضه‌ی آیفون‌های پرچم‌دار، صفحه‌ی فروشگاه را زیر نظر می‌گیرند. پیش‌فروش آیفون ۱۸ پرو و آیفون ۱۸ پرو مکس از ساعت ۵:۰۰ به وقت آمریکا (۱۵:۰۰ به وقت ایران) آغاز می‌شود و اپل استور آمریکا هم‌اکنون پیام آماده‌باش را نمایش می‌دهد: «ما عاشق آن انرژی زودهنگام هستیم. تقریبا آماده‌ایم. پیش‌فروش از ساعت ۵:۰۰ آغاز می‌شود. به‌زودی می‌بینیمتان.» اپل در سال‌های اخیر زمان آغاز پیش‌فروش را از ساعت ۰۰:۰۱ بامداد به ۵:۰۰ منتقل کرده و امسال، فروشگاه زودتر از معمول به حالت تعلیق رفت. برای خریداران، معنای چنین توقفی روشن است؛ زیرساخت خرید در حال آماده‌سازی برای موجی از سفارش‌ها است که به‌سرعت از راه می‌رسند. بیش از ۶۵ کشور و منطقه، از جمله استرالیا، کانادا، چین، فرانسه، آلمان، هند، ژاپن، مکزیک، امارات متحده‌ی عربی، بریتانیا و ایالات متحده، هم‌زمان با بازگشت فروشگاه به‌صورت آنلاین، امکان پیش‌سفارش هر دو مدل را خواهند داشت. اپل برای دو گوشی تازه، چهار رنگ در نظر گرفته و هر دو مدل را در چهار ظرفیت ۲۵۶ گیگابایت، ۵۱۲ گیگابایت، یک ترابایت و دو ترابایت عرضه می‌کند. اضافه شدن گزینه‌ی دو ترابایت به مدل کوچک‌تر، یکی از تغییرات مهم این نسل به شمار می‌آید."}, {"source": "Zoomit", "title": "باشگاه نزدیک‌تر یا مجهزتر؛ کدام انتخاب بهتری است؟", "link": "https://www.zoomit.ir/pr/467058-nearby-vs-equipped-gym-guide/", "summary": "انتخاب باشگاه مناسب به عواملی چون فاصله رفت‌وآمد، میزان شلوغی، سلامت تجهیزات و کیفیت مربی بستگی دارد و صرفا با امکانات سنجیده نمی‌شود.", "date_str": "2026-09-12T09:00:00+00:00", "hash": "a33b753f80cf7524", "title_fa": "باشگاه نزدیک‌تر یا مجهزتر؛ کدام انتخاب بهتری است؟", "summary_fa": "این مطلب صرفا جنبه تبلیغاتی داشته و زومیت هیچ مسئولیتی را در رابطه با آن نمی‌پذیرد انتخاب باشگاه مناسب به عواملی چون فاصله رفت‌وآمد، میزان شلوغی، سلامت تجهیزات و کی  پرونده ۲۷۱ متهم به اخلال در بازار ارز با ۳۰۰ همت تراکنش مشکوک را به مراجع قضایی ارجاع داد. تبلیغات بانک مرکزی با نظارت بر تراکنش‌های بانکی، پرونده ۲۷۱ متهم را به‌دلیل ثبت ۳۰۰ همت گردش مالی مشکوک و اخلال در نظام پولی و ارزی به مراجع قضایی فرستاد. اطلاعات افراد مظنون بر اساس مفاد بند «ب» ماده ۴۲ قانون بانک مرکزی در اختیار دادستان کل کشور قرار گرفت تا روند پیگیری قانونی آغاز شود. به‌گزارش پولی و بانکی بانک مرکزی، حساب‌های بانکی اشخاص مظنون به پولشویی پس از دریافت تاییدیه از مرکز اطلاعات مالی مسدود شده است. افرادی که در بازارهای رمزارز، فلزات گرانبها و ارز معاملات غیرشفاف داشته‌اند، بر اساس مواد ۸۳ تا ۸۵ آیین‌نامه مبارزه با پولشویی با محدودیت‌های شدید بانکی مواجه شده‌اند. نهاد ناظر پولی با نظارت‌های میدانی و دیجیتال، تخلفات شبکه بانکی را پیگیری می‌کند. بازرسان ناظر علاوه بر پایش سیستمی، در بازرسی‌های حضوری اخیر برای ۱۰ بانک جرایم نقدی ثبت کردند. پرونده مدیران شعب متخلف نیز برای رسیدگی قانونی به هیات‌های انتظامی و تخلفات اداری فرستاده شد."}, {"source": "Zoomit", "title": "نوین شارژ تحلیل نقش ایستگاه‌های شارژ موبایل در ارتقای تجربه کاربری (UX) فضاهای تجاری و شهری", "link": "https://www.zoomit.ir/pr/467056-mobile-charging-stations-ux-advertising/", "summary": "استقرار باکس‌های شارژ موبایل در فضاهای تجاری و درمانی، ضمن بهبود تجربه مراجعان، بستری دائمی و کم‌هزینه برای تبلیغات محیطی ایجاد می‌کند.", "date_str": "2026-09-12T08:46:44+00:00", "hash": "227aac59d22ac0af", "title_fa": "نوین شارژ تحلیل نقش ایستگاه‌های شارژ موبایل در ارتقای تجربه کاربری (UX) فضاهای تجاری و شهری", "summary_fa": "این مطلب صرفا جنبه تبلیغاتی داشته و زومیت هیچ مسئولیتی را در رابطه با آن نمی‌پذیرد استقرار باکس‌های شارژ موبایل در فضاهای تجاری و درمانی، ضمن بهبود تجربه مراجعان، بستری دائمی و کم‌هزینه برای تبلیغات محیطی ایجاد می‌کند. تبلیغات امروزه در طراحی، معماری و مدیریت فضاهای تجاری، اداری، خدماتی و درمانی مدرن، مفهوم تجربه کاربری (User Experience - UX) از مرزهای دیجیتال فراتر رفته و به فیزیکِ فضا و خدمات حضوری گره خورده است. مراجعان، مشتریان و بیماران انتظار دارند در طول مدت حضور یا انتظار خود در یک مجم ودروی پرپیمایش با عمر بیش از ۱۰ سال به‌عنوان گروه هدف نوسازی شناسایی شده‌اند. مصرف ماهانه بنزین این گروه حدود ۱۴ میلیون و ۶۸۸ هزار لیتر برآورد شده است. کپی لینک یارانه سوخت یک خودرو بیشتر از درآمد راننده برآورد شد رئیس مرکز ملی هوا و تغییر اقلیم درباره محاسبات اقتصادی این طرح گفت: راننده‌ای که ماهانه چهار هزار کیلومتر پیمایش دارد، به‌طور متوسط حدود ۴۰ میلیون تومان درآمد کسب می‌کند و در همین مدت نزدیک به ۴۸۰ لیتر بنزین مصرف می‌کند."}, {"source": "Zoomit", "title": "پیشنهاد نماینده ایران در بریکس: ایجاد گذرنامه استارتاپی برای شرکت‌های فناور", "link": "https://www.zoomit.ir/tech-iran/467052-brics-startup-passport-initiative/", "summary": "نایب‌رئیس اتاق تهران در کارگروه اقتصاد دیجیتال بریکس در دهلی‌نو، پیشنهاد تشکیل «گذرنامه استارتاپی» را برای شرکت‌های نوآور مطرح کرد.", "date_str": "2026-09-12T07:52:02+00:00", "hash": "79d17b983cc80a37", "title_fa": "پیشنهاد نماینده ایران در بریکس: ایجاد گذرنامه استارتاپی برای شرکت‌های فناور", "summary_fa": "نایب‌رئیس اتاق تهران در کارگروه اقتصاد دیجیتال بریکس در دهلی‌نو، پیشنهاد تشکیل «گذرنامه استارتاپی» را برای شرکت‌های نوآور مطرح کرد. تبلیغات نایب رئیس اتاق تهران که هیئت تجاری اتاق تهران به بریکس ۲۰۲۶ را همراهی می‌‌کند ایده شکل‌گیری «گذرنامه استارتاپی بریکس» را برای تسهیل ورود شرکت‌های فناور به بازارهای کشورهای عضو مطرح کرد. به‌گزارش اتاق بازرگانی تهران شهاب جوانمردی در پنل تخصصی اقتصاد دیجیتال و نوآوری، به ضرورت در پیش گرفتن رویکردی ساختارشکنانه در همکاری‌های چندجانبه اشاره داشت. شهاب جوانمردی، نایب‌رئیس اتاق تهران در جریان حضور هیئت تجاری این اتاق در اجلاس شورای تجاری بریکس در دهلی‌نو، گفت: «کسب‌وکارهای دیجیتال شیوه خرید، پرداخت، یادگیری و فعالیت را تغییر داده‌اند و همکاری‌های اقتصادی کشورهای عضو نیز باید همین سطح از بلندپروازی را دنبال کند؛ به این معنا که فرصت‌هایی خلق شود که پیش از این وجود نداشته‌ است.» جوانمردی، نایب‌رئیس اتاق تهران، گفت: «نقطه شروع این مسیر می‌تواند همکاری میان سامانه‌های دیجیتال ملی کشورهای عضو باشد. به این ترتیب که هر کشور نهادها، مقررات و کنترل خود بر داده‌هایش را حفظ کند و در عین حال اعتبارسنجی شرکت‌ها، شناسایی صلاحیت‌ها و اعتبارنامه‌ها و ارتباط آنها با مشتریان و شرکای تجاری را تسهیل کند.» جوانمردی «گذرنامه استارتاپی بریکس» را یک پیشنهاد عملی برای تحقق این هدف عنوان کرد و گفت: یک استارتاپ نباید مجبور باشد با عبور از هر مرز، همه‌چیز را از ابتدا شروع کند."}, {"source": "Zoomit", "title": "تهدید تازه سلامت: کشف ویروسی کاملاً جدید در چین که از کنه منتقل می‌شود", "link": "https://www.zoomit.ir/health-medical/466809-new-tick-borne-virus-discovered/", "summary": "پژوهشگران چینی ویروس تازه‌ای را در بیماران گزیده‌شده توسط کنه‌ها شناسایی کردند؛ هم‌زمانی این عامل با ویروس دابی باندا، علائم بیماری را تشدید می‌کند.", "date_str": "2026-09-12T07:20:00+00:00", "hash": "dfb5a2faa5d0be5b", "title_fa": "تهدید تازه سلامت: کشف ویروسی کاملاً جدید در چین که از کنه منتقل می‌شود", "summary_fa": "پژوهشگران چینی ویروس تازه‌ای را در بیماران گزیده‌شده توسط کنه‌ها شناسایی کردند؛ هم‌زمانی این عامل با ویروس دابی باندا، علائم بیماری را تشدید می‌کند. تبلیغات دانشمندان یک عامل بیماری‌زای جدید را شناسایی کرده‌اند که از طریق کنه‌ها به انسان منتقل می‌شود؛ کشفی که بار دیگر یادآوری می‌کند یکی از بزرگ‌ترین تهدیدها برای سلامت ما، بیماری‌های مشترک میان انسان و حیوانات است. به‌گزارش نیواطلس ، تیم پژوهشگران آزمایشگاه کلیدی ایالتی پاتوژن و ایمنی‌زیستی پکن در چین، ابتدا ۳٬۱۶۳ فرد دارای علائم مرتبط با ویروس دابی باندا (DBV) را بررسی کردند. آزمایش ۱۰٫۴ درصد از این افراد برای ویروس دابی باندا، منفی بود و همین موضوع پژوهشگران را به بررسی بیشتر نمونه‌ها در مطالعه‌ای تازه ترغیب کرد. بررسی‌ها در نهایت به شناسایی عامل بیماری‌زای کاملاً متفاوتی منجر شد که توسط همان کنه‌های ناقل ویروس دابی باندا، یعنی کنه شاخ‌دراز آسیایی ( Haemaphysalis longicornis ) به انسان منتقل می‌شوند. نایرو ویروس علائمی از جمله تب، خستگی و ناراحتی‌های گوارشی، مشابه آنفلوانزای نوع A، ایجاد می‌کند پژوهشگران ویروس تازه‌شناسایی‌شده را «نایرو ویروس کنه شاخ‌دراز آسیایی» (به‌اختصار ALTNV) نامیدند و در جنس اورتونایروویروس ( Orthonairovirus ) قرار دادند. عفونت با نایرو ویروس کنه شاخ‌دراز آسیایی علائمی شبیه آنفلوانزای نوع A ایجاد می‌کند؛ از جمله تب، خستگی و ناراحتی‌های گوارشی. پژوهشگران در مقاله‌ی خود می‌نویسند: «یافته‌ها شواهدی ارائه می‌کنند که نایرو ویروس کنه شاخ‌دراز آسیایی، یک اورتونایروویروس نوظهور و تازه‌شناسایی‌شده است که با بیماری تب‌دار در انسان ارتباط دارد.»"}, {"source": "Zoomit", "title": "امارات در سایه حملات ایران، دیتاسنترهای هوش مصنوعی را به زیر زمین و داخل کوه‌ها می‌برد", "link": "https://www.zoomit.ir/ai-articles/467038-uae-revises-ai-data-center-plan-after-iranian-attacks/", "summary": "امارات در سایه‌ی حملات ایران طرح دیتاسنتر هوش مصنوعی خود را به‌سوی پراکندگی و حفاظت بیشتر می‌برد.", "date_str": "2026-09-12T07:00:00+00:00", "hash": "1789249cf562a9e7", "title_fa": "امارات در سایه حملات ایران، دیتاسنترهای هوش مصنوعی را به زیر زمین و داخل کوه‌ها می‌برد", "summary_fa": "امارات در سایه‌ی حملات ایران طرح دیتاسنتر هوش مصنوعی خود را به‌سوی پراکندگی و حفاظت بیشتر می‌برد. تبلیغات امارات متحده‌ی عربی در حال بازنگری آرام اما مهم در یکی از بزرگ‌ترین طرح‌های زیرساختی هوش مصنوعی خارج از آمریکا است؛ طرحی ۵ گیگاواتی که قرار بود به‌صورت یک پردیس بزرگ در ابوظبی ساخته شود، اما اکنون ممکن است به شبکه‌ای از دیتاسنترها در نقاط مختلف کشور تبدیل شود . شش منبع آگاه به خبرگزاری رویترز گفته‌اند که این تغییرات پس از جنگ ایران و پیامدهای آن برای زیرساخت‌های حیاتی منطقه در دست بررسی قرار گرفته است. چهار نفر از این منابع گفته‌اند الگوی جدید احتمالا به‌جای یک محوطه‌ی ۱۰ مایل مربعی (معادل ۲۶ کیلومتر مربع)، بر توزیع ظرفیت در چند محل تکیه خواهد کرد. دولت و نهادهای مرتبط در کنار مدل تازه‌ی استقرار، به‌دنبال تقویت لایه‌های دفاعی هم هستند. منابع از بررسی سامانه‌های پدافندی، ایجاد بخش‌هایی در زیرزمین و حتی انتقال برخی تأسیسات حساس به داخل کوه‌ها خبر داده‌اند؛ رویکردی که در آمریکا، چین و اروپا نیز برای بخشی از دیتاسنترهای حیاتی سابقه دارد. طرح UAE-US AI Campus یا همان پردیس هوش مصنوعی امارات و آمریکا، سال گذشته و در جریان سفر دونالد ترامپ به آن کشور معرفی شد. پروژه را G42 هدایت می‌کند؛ شرکتی که تحت کنترل مشاور امنیت ملی امارات و برادر رئیس کشور قرار دارد. این طرح برای ابوظبی فقط یک پروژه‌ی فناورانه نیست و بخشی از راهبردی بزرگ‌تر به‌شمار می‌رود که هدفش تبدیل اقتصاد امارات به یکی از اقتصادهای مهم در زنجیره‌ی جهانی هوش مصنوعی است."}, {"source": "Zoomit", "title": "تعرفه‌ تماس‌های تلفنی مخابرات افزایش می‌یابد {به‌روزرسانی: افزایش قیمت متوقف شد}", "link": "https://www.zoomit.ir/tech-iran/467045-telecom-iran-tariff-increase-september-2026/", "summary": "مخابرات ایران از افزایش ۴۵ درصدی برخی تعرفه‌های ارتباطی از ۲۰ شهریور ۱۴۰۵ خبر داد.", "date_str": "2026-09-12T06:53:06+00:00", "hash": "f01cb6e45908545f", "title_fa": "تعرفه‌ تماس‌های تلفنی مخابرات افزایش می‌یابد {به‌روزرسانی: افزایش قیمت متوقف شد}", "summary_fa": "مخابرات ایران از افزایش ۴۵ درصدی برخی تعرفه‌های ارتباطی از ۲۰ شهریور ۱۴۰۵ خبر داد. تبلیغات مخابرات ایران در اطلاعیه‌ای که در سامانه کدال منتشر شد، از اصلاح تعرفه‌های برخی خدمات ارتباطی از ۲۰ شهریور ۱۴۰۵ خبر داد. تغییر تازه، دامنه‌ای از خدمات پرکاربرد را در بر می‌گیرد؛ از مکالمه تلفن ثابت با تلفن همراه تا تماس‌های همراه با همراه و پیامک تلفن همراه. بر اساس ابلاغ وزارت صنعت، معدن و تجارت، تعرفه مکالمه تلفن ثابت با تلفن همراه، تماس‌های همراه با همراه و پیامک تلفن همراه تعدیل می‌شود. در همین چارچوب، سقف تعرفه تماس تلفن ثابت با اپراتورهای همراه از ۶۲۵ ریال به ۹۰۶ ریال می‌رسد؛ افزایشی که معادل ۴۵ درصد اعلام شده است. مخابرات اعلام کرده آثار مالی و درآمدی این افزایش تعرفه هنوز مشخص نیست و متناسب با میزان تحقق، در گزارش‌های مالی دوره‌ای شرکت منتشر خواهد شد."}, {"source": "Zoomit", "title": "هوش مصنوعی سرکش اوپن‌ای‌آی پیش از هاگینگ فیس به RubyGems هم حمله کرده بود", "link": "https://www.zoomit.ir/ai-articles/467039-openai-agents-attack-rubygems/", "summary": "پژوهشگران فاش کردند عوامل هوش مصنوعی اوپن‌ای‌آی پیش از نفوذ به هاگینگ‌فیس، به سرویس نرم‌افزاری رابی‌جمز حمله کرده بودند.", "date_str": "2026-09-12T06:45:00+00:00", "hash": "bdc2d127e6b0f4ed", "title_fa": "هوش مصنوعی سرکش اوپن‌ای‌آی پیش از هاگینگ فیس به RubyGems هم حمله کرده بود", "summary_fa": "پژوهشگران فاش کردند عوامل هوش مصنوعی اوپن‌ای‌آی پیش از نفوذ به هاگینگ‌فیس، به سرویس نرم‌افزاری رابی‌جمز حمله کرده بودند. تبلیغات پژوهشگران حوزه‌ی امنیت سایبری اعلام کردند عامل‌های هوش مصنوعی آزمایشی OpenAI دو ماه پیش از نفوذ به پلتفرم متن‌باز هاگینگ فیس، به سرویس نرم‌افزاری RubyGems حمله کرده‌اند. وقوع رویدادهایی که در آن‌ها عوامل هوش مصنوعی توسعه‌دهندگانی مانند اوپن‌ای‌آی و رقیبش آنتروپیک به سیستم‌های خارجی نفوذ کرده یا برای دسترسی به آن‌ها تلاش داشته‌اند، نگرانی‌ها پیرامون مهارناپذیری این سامانه‌ها را افزایش داده است. پژوهشگران جمعه یافته‌های خود را منتشر و اعلام کردند ایجنت‌های هوش مصنوعی در اردیبهشت‌ماه صدها بسته‌ی مخرب را روی رابی‌جمز بارگذاری کردند. یافته‌های منتشرشده نشان می‌دهد نویسنده‌ی بسته‌ها عوامل داخلی اوپن‌ای‌آی بوده‌اند و همچنین برای سرقت اطلاعات کاربری با سوءاستفاده از یک آسیب‌پذیری ناشناخته تلاش کرده‌اند. سخنگوی OpenAI، در بیانیه‌ای گفت: «بر اساس بررسی‌های ما، عوامل ما از پلتفرم رابی‌جمز برای دسترسی به اینترنت به‌منظور انجام وظایف بی‌خطر و بازیابی اطلاعات عمومی استفاده کرده‌اند. ما به عنوان بخشی از بررسی گسترده‌تر فعالیت عوامل در طول آموزش و ارزیابی، به تحقیقات ادامه خواهیم داد.» نمایندگان اوپن‌ای‌آی افزوده‌اند عواملی که وظایفی نظیر تهیه‌ی گزارش یا پرکردن صفحات گسترده را بر عهده داشتند، از رابی‌جمز برای دسترسی به داده‌های عمومی در فرایند آموزش بهره بردند. رابی‌جمز در پستی اعلام کرد شواهدی مبنی‌بر موفقیت تلاش‌ها نیافته و مشخص نیست بسته‌های کمپین اسپم توسط هوش مصنوعی ساخته شده‌اند یا خیر."}, {"source": "Zoomit", "title": "آپدیت iOS 27 دوشنبه از راه می‌رسد؛ اما بدون این دو ویژگی جدید", "link": "https://www.zoomit.ir/os/467043-ios-27-delayed-features/", "summary": "اپل اعلام کرد دو قابلیت نرم‌افزاری جدید در زمان انتشار عمومی iOS 27 در دسترس کاربران نخواهد بود.", "date_str": "2026-09-12T06:40:00+00:00", "hash": "0e2a2dcaa1eec029", "title_fa": "آپدیت iOS 27 دوشنبه از راه می‌رسد؛ اما بدون این دو ویژگی جدید", "summary_fa": "اپل اعلام کرد دو قابلیت نرم‌افزاری جدید در زمان انتشار عمومی iOS 27 در دسترس کاربران نخواهد بود. تبلیغات انتشار عمومی iOS 27 از دوشنبه آغاز خواهد شد ؛ اما کاربران در زمان انتشار اولیه به تمامی ویژگی‌های معرفی‌شده دسترسی نخواهند داشت. دو قابلیت پیشنهادهای هوشمند در پیام‌ها و اصلاح خودکار پسوردهای ناامن، به دلیل نیاز به بررسی‌های بیشتر در نسخه‌های بعدی ارائه می‌شوند. تغییرات علاوه‌بر آیفون، در سیستم‌های عامل iPadOS 27 و macOS Golden Gate نیز اعمال شده است. اپل در توضیح عملکرد قابلیت اصلاح گذرواژه اعلام کرد که اپلیکیشن Passwords با بهره‌گیری از هوش مصنوعی Apple Intelligence و سافاری، گذرواژه‌های ناامن را در پس‌زمینه شناسایی و اصلاح می‌کند. در بخش پیام‌ها نیز هوش مصنوعی اپل با تحلیل گفت‌وگوها، پیشنهادهای کاربردی برای انجام وظایف یا ارسال تصاویر ارائه می‌دهد. اپل می‌گوید: «در اپلیکیشن Messages، هوش مصنوعی اپل پیشنهادهای تک‌مرحله‌ای را بر اساس موضوع گفت‌و‌گو ارائه می‌دهد. اگر مخاطب درخواست ارسال عکس یا انجام کاری را داشته باشد، پیام‌ها آن را تشخیص داده و پیشنهادهای لازم را از طریق اپلیکیشن‌های مرتبط نمایش می‌دهد.» انتظار می‌رود این ویژگی‌ها در به‌روزرسانی iOS 27.1 در حوالی مهر یا آبان در دسترس قرار بگیرند."}, {"source": "Zoomit", "title": "منابع پرتو ایکس فوق‌نرم؛ اجرام عجیبی که هیچ‌کس از ماهیت دقیقشان اطلاع ندارد", "link": "https://www.zoomit.ir/space/466975-astronomers-reveal-new-type-celestial-object/", "summary": "تلسکوپ فضایی چاندارا سال‌هاست که سیگنال‌هایی از برخی اجرام مرموز دریافت می‌کند؛ اما دانشمندان هنوز ماهیت دقیق آن‌ها را نمی‌دانند.", "date_str": "2026-09-12T06:15:00+00:00", "hash": "9185693125620637", "title_fa": "منابع پرتو ایکس فوق‌نرم؛ اجرام عجیبی که هیچ‌کس از ماهیت دقیقشان اطلاع ندارد", "summary_fa": "NASA/CXC/SAO/G. Ogrean et al. (x-ray); Hubble/NASA/ESA/STScI (optical/infrared) تلسکوپ فضایی چاندارا سال‌هاست که سیگنال‌هایی از برخی اجرام مرموز دریافت می‌کند؛ اما دانشمندان هنوز ماهیت دقیق آن‌ها را نمی‌دانند. تبلیغات در کهکشانی بسیار دور، اجرام عجیبی درحال ساطع‌کردن تابش به فضا هستند که سال‌ها جلوی چشم دانشمندان بوده‌اند، اما ماهیت واقعی‌شان نادیده گرفته می‌شد. اما اکنون مشاهدات جدید نشان می‌دهد که آن‌ها شاید برای درک زندگی و مرگ کهکشان‌ها اهمیت زیادی داشته باشند. رصدخانه پرتو ایکس چاندرا ناسا چندین دهه است که سیگنال این اجرام مرموز را دریافت می‌کند؛ اما دانشمندان عمدتاً اهمیت چندانی برای داده‌های مربوط به آن‌ها قائل نبودند. تابشی که این اجرام گسیل می‌کنند، در مقایسه با بیشتر ستاره‌ها انرژی نسبتاً پایینی دارد و همین موضوع باعث شده بود به‌راحتی به‌عنوان نویز کنار گذاشته شود. جیمی اروین، استاد دانشگاه آلاباما و یکی از نویسندگان مقاله‌ای جدید که اجرام عجیب مورد بحث را توصیف می‌کند، به ساینتیفیک آمریکن می‌گوید : «[دانشمندان] حتی نمی‌دانستند این اجرام وجود دارند. آن‌ها کم‌انرژی‌ترین کانال‌ها را کاملاً نادیده گرفته بودند، زیرا تصور می‌کردند اهمیتی ندارند.» اروین و همکارش مصطفی محیب‌الله، دانشجوی دکتری و روزان دی‌استفانو، مدرس مرکز اخترفیزیک هاروارد-اسمیتسونین، انتظار نداشتند هنگام بررسی دوباره داده‌های نادیده‌گرفته‌شده، چیز قابل‌توجهی پیدا کنند. آن‌ها این فرایند را به جست‌وجوی گنج تشبیه می‌کنند: ممکن است جواهری را پیدا کنید که مدت‌ها گم شده، اما احتمال اینکه فقط با انبوهی از زباله روبه‌رو شوید بسیار بیشتر است."}, {"source": "Zoomit", "title": "پلتفرم آموزش پزشکی «لینوم» با شکایت وزارت بهداشت و نظام پزشکی فیلتر شد", "link": "https://www.zoomit.ir/tech-iran/467042-linom-filtered-by-judicial-order/", "summary": "لینوم، پلتفرم مهارت‌آموزی پزشکان، با شکایت وزارت بهداشت و نظام پزشکی و دستور قضایی فیلتر شد؛ لینوم می‌گوید از شکایت بی‌خبر بوده است.", "date_str": "2026-09-12T06:12:15+00:00", "hash": "c71e629e241098a7", "title_fa": "پلتفرم آموزش پزشکی «لینوم» با شکایت وزارت بهداشت و نظام پزشکی فیلتر شد", "summary_fa": "لینوم، پلتفرم مهارت‌آموزی پزشکان، با شکایت وزارت بهداشت و نظام پزشکی و دستور قضایی فیلتر شد؛ لینوم می‌گوید از شکایت بی‌خبر بوده است. تبلیغات وب‌سایت لینوم، پلتفرم تخصصی مهارت‌آموزی پزشکان، به دنبال شکایت وزارت بهداشت و سازمان نظام پزشکی و با دستور قضایی فیلتر شد؛ اقدامی که به گفته این مجموعه بدون اطلاع قبلی لینوم از موضوع و دلایل شکایت و بدون فرصت ارائه توضیح و پاسخ‌گویی انجام شده است. لینوم اعلام کرد که از موضوع و مبنای شکایتی که در نهایت به محدودیت دسترسی به وب‌سایت منجر شده، پیش از اعمال این محدودیت اطلاعی نداشته و پس از فیلتر شدن سایت نیز تاکنون به‌صورت رسمی در جریان جزئیات موضوع قرار نگرفته است. لینوم طی بیش از ۸ سال فعالیت به‌عنوان یک پلتفرم تخصصی، بستر ارتباط میان پزشکان مدرس و جامعه پزشکان و دانشجویان
