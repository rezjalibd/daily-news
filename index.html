      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;

      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;

    :root[data-theme="light"] {

      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;

      --primary: #0284c7;

      margin: 0;

      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;

      color: var(--text);

      left: 18px;
      display: flex;

      color: var(--text);

      border-radius: 12px;

    .search-box {
      margin-bottom: 18px;
    }

      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;

    .search-input:focus {

    }

      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {

      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {

      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {

      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);

    .news-category-badge {

      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;

    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;

    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);

      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;

    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;

    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);

      padding: 12px 16px;

      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }

      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۰ آبان • ۱۶:۴۹"}],
      tech: [{"source": "The Guardian AI", "title": "National Grid to site biggest substation on Teesside, near planned AI datacentre", "link": "https://www.theguardian.com/business/2026/nov/01/national-grid-to-site-biggest-substation-on-teesside-near-planned-ai-datacentre", "summary": "New electricity generating capacity would enable north-east to attract investment for major datacentre projects National Grid has taken a step towards building Britain’s biggest electricity substation on Teesside, which could supply power to a vast neighbouring datacentre as the UK races to expand its AI infrastructure. Last week the company agreed to purchase 29.5 hectares (73 acres) of land at Dorman Point on a site owned by Teesworks, a local private-public partnership. The deal was first reported by Sky News. Continue reading...", "date_str": "2026-11-01T17:10:52+00:00", "hash": "b7283f3ce17624ed", "title_fa": "شبکه ملی برای قرار دادن بزرگترین ایستگاه فرعی در Teesside، در نزدیکی مرکز داده برنامه ریزی شده هوش مصنوعی", "summary_fa": "ظرفیت جدید تولید الکتریسیته شمال شرق را قادر می‌سازد تا برای پروژه‌های مرکز داده بزرگ سرمایه‌گذاری را جذب کند. شبکه ملی گامی در جهت ساختن بزرگترین پست برق بریتانیا در Teesside برداشته است، که می‌تواند برق یک مرکز داده وسیع همسایه را تامین کند، زیرا بریتانیا برای توسعه زیرساخت‌های هوش مصنوعی خود رقابت می‌کند. هفته گذشته این شرکت با خرید 29.5 هکتار (73 هکتار) زمین در Dorman Point در سایتی که متعلق به Teesworks است، موافقت کرد. این معامله ابتدا توسط اسکای نیوز گزارش شد. به خواندن ادامه دهید... این قرارداد به دنبال گزارش‌هایی در سال گذشته صورت گرفت که نشان می‌داد دولت بریتانیا Teesworks را به‌عنوان سایتی برای مرکز داده هوش مصنوعی جدید انتخاب کرده است و برنامه‌های کاربردی برنامه‌ریزی برای پروژه‌ای که نزدیک به 500000 متر مربع وسعت دارد ارسال شده است. مت پیرس، رئیس زمین در National Grid، گفت: این قرارداد \"منعکس کننده کار سازنده بین همه کسانی است که برای فعال کردن این زیرساخت حیاتی ... و از رشد هوش مصنوعی و فناوری های دیجیتال حمایت می کند و فاز بعدی توسعه صنعتی و اقتصادی منطقه را قادر می سازد.\" وی افزود: \"ما متعهد هستیم که با شرکای خود همکاری نزدیک داشته باشیم تا توسعه را در سریع ترین زمان ممکن پیش ببریم.\" بن هوچن، شهردار دره تیس، به اسکای نیوز گفت: «همه کسانی که تلاش کرده‌اند یک مرکز داده در این کشور بسازند، می‌دانند که بزرگترین مشکل این است که به سرعت نیروی کافی به سایت برسد. داشتن حداکثر 3.2 گیگاوات ظرفیت در اینجا به این معنی است که ما در نهایت می توانیم برای آن پروژه ها رقابت کنیم.", "image_url": "https://i.guim.co.uk/img/media/6454f44555fa48a5f38d1d066c370cb6e7376a80/0_0_6827_5464/master/6827.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=f3344baddc279d10a63ba366fdf49d2d", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سرمایه‌گذاری"], "datetime_fa": "۱۰ آبان • ۲۰:۴۰"}, {"source": "The Verge", "title": "Apple’s HomeView could add security camera features", "link": "https://www.theverge.com/tech/1024219/apples-homeview-could-add-security-camera-features", "summary": "Reddit user pdfu found hints hidden in the HomeView 27.2 code that Apple could be adding security camera features to its smart home hub. The strings describe a security camera mode with motion detection, live streaming, and recording options, as well as privacy functions. According to pdfu, there is a setup page that even explicitly reads: \"Your HomeView can be used as a security camera with HomeKit Secure Video.\" Supposedly, the video feeds will only be visible to members of the home, and will both show an indicator light and play a sound when either someone is watching the camera feed or when it starts to record. Home members will also ge … Read the full story at The Verge.", "date_str": "2026-11-01T17:16:07+00:00", "hash": "796d253acba71982", "title_fa": "HomeView اپل می تواند ویژگی های دوربین امنیتی را اضافه کند", "summary_fa": "pdfu کاربر Reddit نکاتی را در کد HomeView 27.2 پنهان کرده است که نشان می دهد اپل می تواند ویژگی های دوربین امنیتی را به هاب خانه هوشمند خود اضافه کند. رشته‌ها حالت دوربین امنیتی را با گزینه‌های تشخیص حرکت، پخش زنده و ضبط و همچنین عملکردهای حفظ حریم خصوصی توصیف می‌کنند. به گفته pdfu، صفحه راه اندازی وجود دارد که حتی به صراحت می گوید: \"HomeView شما می تواند به عنوان یک دوربین امنیتی با HomeKit Secure Video استفاده شود.\" ظاهراً، فیدهای ویدئویی فقط برای اعضای خانه قابل مشاهده خواهند بود، و هم یک چراغ نشانگر را نشان می‌دهند و هم زمانی که کسی در حال تماشای فید دوربین است یا زمانی که شروع به ضبط می‌کند، صدا پخش می‌شود. اعضای خانه نیز دریافت خواهند کرد… داستان کامل را در The Verge بخوانید. اخبار فنی اپل HomeView می‌تواند ویژگی‌های دوربین امنیتی را اضافه کند. Terrence O'Brien 1 نوامبر 2026، 5:16 بعد از ظهر UTC پیوند اشتراک گذاری عکس هدیه توسط Jennifer Pattison Tuohy / The Verge Terrence O'Brien ویرایشگر آخر هفته Verge است. او بیش از 18 سال است که صنعت فناوری را تحت پوشش قرار داده است و یک یا دو چیز در مورد مصنوعی می داند. pdfu کاربر Reddit نکاتی را در کد HomeView 27.2 پنهان کرده است که نشان می دهد اپل می تواند ویژگی های دوربین امنیتی را به هاب خانه هوشمند خود اضافه کند. رشته‌ها حالت دوربین امنیتی را با گزینه‌های تشخیص حرکت، پخش زنده و ضبط و همچنین عملکردهای حفظ حریم خصوصی توصیف می‌کنند. طبق pdfu، صفحه راه اندازی وجود دارد که حتی به صراحت می گوید: «HomeView شما می تواند به عنوان یک دوربین امنیتی با HomeKit Secure Video استفاده شود». برخی تعجب کردند که چرا اپل اجازه نداد HomeView به عنوان دوربین امنیتی در زمان راه اندازی دو برابر شود، و", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/10/LR6B6101.jpeg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["Apple", "امنیت سایبری"], "datetime_fa": "۱۰ آبان • ۲۰:۴۶"}, {"source": "TechCrunch Main", "title": "TechCrunch Mobility: A new, bigger AV boom is here", "link": "https://techcrunch.com/2026/11/01/techcrunch-mobility-a-new-bigger-av-boom-is-here/", "summary": "Welcome back to TechCrunch Mobility, your hub for the future of transportation and now, more than ever, the role AI is playing in it.", "date_str": "2026-11-01T17:04:00+00:00", "hash": "a63ac5e61a639d5f", "title_fa": "TechCrunch Mobility: یک رونق جدید و بزرگتر AV در اینجا است", "summary_fa": "به TechCrunch Mobility، مرکز شما برای آینده حمل و نقل و اکنون، بیش از هر زمان دیگری، نقشی که هوش مصنوعی در آن ایفا می کند، خوش آمدید. من در اینجا و در پادکست‌های Equity و Autonocast به شوخی گفتم که صنعت خودروهای خودران بسیار شبیه سال 2016 است، حداقل از نظر سر و صدایی که در این بخش وجود دارد. اما مکالمه اخیر با شریک Trucks VC Puneeth Meruva باعث شد که در این مقایسه تجدید نظر کنم. شواهدی وجود دارد که نشان می‌دهد سال 2026 - حداقل با معیارهای معین - حتی از روزهای کف‌آلود 2016 و 2017 گرم‌تر است. Trucks VC، که در سرمایه‌گذاری در مراحل اولیه تخصص دارد، از 81 استارت‌آپ خودروی خودمختار جدید تا کنون در سال 2026 - دو سوم از سال گذشته و بیش از یک سال گذشته به اندازه کافی رونق گرفته است. شرکت VC در یک پست وبلاگ جدید استدلال می کند که ما در میانه یک موج AV ثانویه و حتی بزرگتر هستیم که توسط پیشرفت های تکنولوژیکی تقویت شده است. بله، من در مورد هوش مصنوعی صحبت می کنم. مرووا به من گفت: «برای مدت طولانی شرکت‌های AV تلاش می‌کردند از آنچه که AV 1.0 بود به AV 2.0 بروند، که نوعی معماری سرتاسر جام مقدس برای AV است. و من فکر می‌کنم که مدل‌های پایه اکنون یک معماری فنی ارائه می‌دهند که این سیستم‌های سرتاسر را ممکن می‌سازد. این مدل‌های پایه به‌ویژه در تعمیم در محیط‌ها و سناریوهای مختلف خوب هستند و به طور بالقوه باعث ارزان‌تر و سریع‌تر استقرار AVها می‌شوند. ورود مدل‌های متن‌باز قدرتمند مانند Alpamayo انویدیا و مدل‌های زبان بینایی-عملی همه‌منظوره Qwen، کار استارت‌آپ‌ها را آسان‌تر کرده است. مانع ورود کمتر از همیشه است. Meruva گفت Trucks به طور مداوم شاهد استقرار استارت آپ ها در عرض چند ماه و با کمتر از 1 میلیون", "image_url": "https://techcrunch.com/wp-content/uploads/2026/10/robotaxi-illustration.jpg?resize=1200,1058", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "سرمایه‌گذاری"], "datetime_fa": "۱۰ آبان • ۲۰:۳۴"}, {"source": "Engadget", "title": "All the leaks for the Portal prequel F-Stop have been compiled into a playable game", "link": "https://www.engadget.com/2303446/all-the-leaks-for-the-portal-prequel-f-stop-have-been-compiled-into-a-playable-game/", "summary": "This rough version is the closest thing to a release we'll see.", "date_str": "2026-11-01T17:54:34+00:00", "hash": "00566a91a537d359", "title_fa": "تمام اطلاعات فاش شده برای پیش درآمد پورتال F-Stop در یک بازی قابل بازی گردآوری شده است", "summary_fa": "این نسخه خشن نزدیک‌ترین چیزی است که به انتشاری خواهیم دید. Gabe Follower/X افزودن Engadget در Google: منبع برگزیده Google Discover ممکن است هیچ امیدی به عرضه رسمی پیش درآمد لغو شده Valve برای سری Portal وجود نداشته باشد، اما هنوز هم می‌توانیم از راه‌های غیررسمی آن را بشناسیم. پس از یک افشای بزرگ دیگر، F-Stop اکنون به لطف تلاش‌های جامعه که تمام داده‌های لو رفته را جمع‌آوری کرده‌اند، کاملاً قابل پخش است. این نسخه قابل پخش، اگرچه کامل نشده است، پس از نشت گسترده بیش از 12 ترابایت داده Steam در ماه آگوست منتشر شد. این نشت حاوی دارایی‌هایی برای F-Stop به همراه داده‌هایی از نسخه‌های اولیه Left 4 Dead، Portal 2، Half-Life و موارد دیگر بود. اخیراً، کد منبع و داده‌های نقشه بازی به سرور Discord پروژه Valve Cut Content فاش شد، که سپس با دارایی‌های نشت قبلی به نسخه تقریباً کامل بازی ترکیب شد. همانطور که در برخی از بازی‌های یوتیوب دیده می‌شود، بازی همچنان فاقد بافت و دیالوگ است، اما تا حد زیادی پایدار است. شما می توانید با گرفتن عکس از آنها و سپس تغییر یا جابجایی جسم گرفته شده، حس واقعی مکانیک دوربین را دریافت کنید که اشیاء فیزیکی را از دنیای واقعی ذخیره می کند. این مجموعه لو رفته ممکن است نزدیک‌ترین چیزی باشد که ما به یک نسخه واقعی می‌بینیم، زیرا به نظر نمی‌رسد نشانه‌ای از انتشار رسمی Valve وجود داشته باشد.", "image_url": "https://www.engadget.com/img/gallery/all-the-leaks-for-the-portal-prequel-f-stop-have-been-compiled-into-a-playable-game/l-intro-1793554498.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۱۰ آبان • ۲۱:۲۴"}, {"source": "Engadget", "title": "The reason why your Xbox controller still uses AA batteries", "link": "https://www.engadget.com/2300298/reason-xbox-controller-uses-aa-batteries/", "summary": "Xbox controllers use AA batteries, which may seem like an outdated way of powering a device, but there are reasons for this intentional choice.", "date_str": "2026-11-01T17:45:00+00:00", "hash": "0a42d7d80b40a8a2", "title_fa": "دلیل اینکه چرا کنترلر Xbox شما هنوز از باتری های AA استفاده می کند", "summary_fa": "کنترلرهای ایکس باکس از باتری های AA استفاده می کنند که ممکن است روشی قدیمی برای تامین انرژی دستگاه به نظر برسد، اما دلایلی برای این انتخاب عمدی وجود دارد. ممکن است کنترل‌کننده‌های شارژی انتخابی مدرن به نظر برسند، اما جامعه بازی‌ها از هم گسیخته شده است. SolidMaks/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover در 12 دسامبر 2019، در جریان جوایز بازی، مایکروسافت از کنسول بازی جدید براق خود، Xbox Series X رونمایی کرد. این درایو حالت جامد برای زمان بارگذاری بسیار کوتاه‌تر و یک کنترلر کاملاً جدید داشت که هنوز برای کار کردن به یک جفت باتری AA نیاز داشت. در آن زمان، هر دو رقیب مایکروسافت مدت‌ها باتری‌های قابل تعویض را کنار گذاشته بودند و کنترل‌کننده‌های آن‌ها با باتری‌های قابل شارژ داخلی عرضه می‌شدند. خب، چه اتفاقی افتاد؟ چرا مایکروسافت انتظار داشت مشتریانش باتری های قلمی خود را در سال 2019 بیاورند و چرا تا به امروز این کار را انجام می دهد؟ اگر گیمر نیستید یا هرگز صاحب ایکس باکس نشده اید، ممکن است ندانید که کنسول اصلی ایکس باکس با یک کنترلر سیمی عرضه شده است. و هنگامی که ایکس باکس 360 وارد شد، واحدهای پریمیوم را با یک بی سیم که با یک جفت باتری AA کار می کرد، ارسال کرد. کنترلر می‌توانست مدت زیادی روی آن دو سلول ساده دوام بیاورد، اما در نهایت آب آنها تمام شد و باید تعویض شوند. در آن زمان، Nintendo Wii به یک جفت باتری AA نیز نیاز داشت، در حالی که سونی از یک کنترلر سیمی در پلی استیشن 2 مستقیماً به یک کنترلر بی سیم در پلی استیشن 3 که یک باتری قابل شارژ داخلی داشت، تبدیل شد. در نهایت نینتندو در سال 2012 با Wii U به سراغ باتری‌های قابل شارژ رفت، اما مایکروسافت برای نسخه‌های L' fired shots at startup culture in its latest episode. Comedian Ben Marshall played Pennywise the clown pitching a new AI company to trap kids. In another segment, a Sprite exec admits its new flavor tastes bad because \"we used AI to make it.\" \"Saturday Night Live\" took aim at startup culture and AI across multiple sketches in its Halloween broadcast, including a spoof of the stereotypical big-talking startup dude, channeled through Stephen King's Pennywise. \"We started a company — it's called WeAllFloat.ai,\" comedian Ben Marshall, playing the malevolent clown, said in the segment. \"Instead of trapping one kid with one balloon, what if you had hundreds of AI agents, each with their own digital balloons?\" Before Pennywise came on, \"Weekend Update\" host Michael Che got a joke in about the floundering stock price of Google's parent company, Alphabet. \"Today's Google Doodle hung itself,\" Che said, referring to the animations Google sometimes uses on its homepage. And in another spoof of advertising execs trying to plug a new Sprite flavor on a Latin telenovela, a Sprite rep admits the drink tastes bad because \"we used AI to make it.\" \"For the first time in history, AI screwed up,\" she says sarcastically. Though \"SNL\" hasn't shied away from lampooning AI and the buzzy startup culture associated with it before, Saturday's broadcast honed in on the Lone Star State as a place where soulless, profit-driven techies are flocking to start new companies. Indeed, since 2020, more than 200 companies have relocated their headquarters to Texas. Many cite comparatively lax regulatory laws and a business-friendly atmosphere. Of course, though, moving down south doesn't guarantee profitability. Pennywise, for instance, might have some trouble getting his AI startup off the ground. \"Got a little crew together of cool, like-minded, sober, predatory tech guys,\" Marshall says in the segment. \"I live in a loft in Austin with three other motivated young Christians.\" R et work hours might take that away. Around the same time, I was scrolling through my phone and came across videos showing how to make, bake, and decorate cake pops . They looked so much easier — and more manageable — than creating huge, elaborate cakes. I thought I could do that. I got the encouragement I needed After a bit of experimenting, I made a batch of cake pops for a Halloween party. Everyone loved them, and that gave me the encouragement I needed to try selling them. Jessica Redford made her first pop cakes for a Halloween party. Courtesy of Jessica Redford I started posting about my cake pops on Instagram, taking small orders, and attending vendor events. Then, in November, I had some cake pops left over after a vendor event. The kids and I decided to sit outside on the corner of our neighborhood and sell them to people passing by. My neighbors loved them! I only had a few left after that, so I took them to my chiropractor as a gift. She posted about them on her social media, and that's when everything really took off. Suddenly, I was getting what felt like endless orders for Thanksgiving and Christmas cake pops. I was burning out Those months were crazy. I was in the kitchen constantly. It was exciting, but it was also ov", "date_str": "2026-11-01T16:52:01+00:00", "hash": "e3da275e94948423", "title_fa": "من یک کار نیمه وقت می خواستم در حالی که 3 فرزندم را در خانه درس می دادم. سپس شلوغی جانبی کیک پاپ من بلند شد.", "summary_fa": "جسیکا ردفورد سه فرزندش را در خانه آموزش می دهد و کسب و کارش را اداره می کند. با حسن نیت از جسیکا ردفورد جسیکا ردفورد به سه کودک در خانه می‌آموزد و می‌خواهد یک خروجی خلاقانه برای او داشته باشد. او شروع به ساخت کیک پاپ و فروش آنها در رویدادهای محلی قبل از شروع سفارش کرد. او اکنون هر جمعه از یک چرخ دستی کیک در خارج از خانه اش می فروشد و در عین حال انعطاف پذیری خانواده را حفظ می کند. این مقاله گفته شده بر اساس گفتگو با جسیکا ردفورد است. برای طول و وضوح ویرایش شده است. سپتامبر گذشته، یک مرکز خرید در خیابان از من باز شد. یک خواربار فروشی  period. RentCafe defines a \"millionaire renter\" as a household earning at least $1 million a year that rents an apartment or house. The company found that nearly half of millionaire renters are millennials, though the number of Gen Z millionaire renters has grown the fastest since 2020. And while New York, San Francisco, and Los Angeles remain the biggest hubs for millionaire renters, Southern metros are seeing the fastest growth. Doug Ressler, manager of business intelligence at Yardi Matrix, the firm behind RentCafe's report, told Business Insider that while Western metros such as Riverside and Santa Cruz, California, and Northeastern metros such as Utica and Syracuse, New York, are losing millionaire renters, Southern metros are gaining them, largely thanks to their growing job markets. \"These declines are at the intersection of migration, wealth creation, lifestyle choices, and renting as a transitional or capital strategy,\" Ressler said. \"As corporate headquarters relocate to the South , more senior-level executives are moving there. Many rent before they buy, helping drive the region's growth in high-income households and millionaires.\" Over the past few years, many companies, including Tesla, Oracle, Charles Schwab, and Palantir, have relocated their headquarters or opened new offices in Texas and Florida , bringing their workers with them. It's no surprise, then, that several of the fastest-growing metros for millionaire renters are in these two states. Below, the top 10 cities for millionaire renters. 10. Phoenix Kruck20/Getty Images Number of millionaire renter households in 2020: 20 Number of millionaire renter households in 2024: 91 Percentage increase: 355% 9. Boston Boston, Massachusetts", "date_str": "2026-11-01T16:24:01+00:00", "hash": "863274e6005c4ef2", "title_fa": "حتی میلیونرها هم اجاره می دهند. در اینجا 10 شهری که آنها در حال هجوم به آنها هستند آورده شده است.", "summary_fa": "ساختمانی لوکس در بریکل، محله ای ثروتمند در میامی با بسیاری از مشاغل و ساختمان های مسکونی. داده های سرشماری ajansen/Getty Images نشان می دهد که تعداد خانوارهای میلیونر اجاره نشین از سال 2020 تا 2024 229 درصد افزایش یافته است. وب سایت جستجوی آپارتمان RentCafe شهرهایی را با سریع ترین رشد در اجاره کنندگان میلیونر رتبه بندی کرده است. اجاره‌کنندگان میلیونر همچنان از نیویورک و لس‌آنجلس حمایت می‌کنند، اما شهرهای جنوبی سریع‌ترین آنها را به دست می‌آورند. حتی میلیونرها نیز در بازار املاک و مستغلات گران امروزی اجاره می کنند. وب‌سایت جستجوی آپارتمان RentCafe نشان داد که تعداد خانوارهای میلیونر اجاره‌کننده در مقایسه با تخمین‌های اداره سرشماری ایالات متحده برای سال‌های 2020 تا 2024 با برآوردهای سال‌های 2016 تا 2020، 229 درصد افزایش یافته است. RentCafe یک «میلیونر اجاره‌دهنده» را خانواده‌ای تعریف می‌کند که حداقل یک میلیون دلار در سال درآمد داشته باشد و یک آپارتمان یا خانه اجاره کند. این شرکت دریافت که تقریباً نیمی از میلیونرهای اجاره‌دهنده هزاره هستند، اگرچه تعداد اجاره‌کنندگان میلیونر Gen Z سریع‌ترین رشد را از سال 2020 داشته است. و در حالی که نیویورک، سانفرانسیسکو و لس‌آنجلس همچنان بزرگترین مرکز اجاره‌کنندگان میلیونر هستند، متروهای جنوبی سریع‌ترین رشد را دارند. داگ رسلر، مدیر هوش تجاری در یاردی ماتریکس، شرکتی که گزارش RentCafe را پشت سر می گذارد، به Business Insider گفت که در حالی که متروهای غربی مانند ریورساید و سانتا کروز، کالیفرنیا، و متروهای شمال شرقی مانند یوتیکا و سیراکوز، نیویورک، اجاره دهندگان میلیونر را از دست می دهند، متروهای جنوبی بازار شغلی آنها را افزایش می دهند. رسلر گفت: «این کاهش ها در تقاطع مهاجرت، خلق ثروت، انتخاب سبک زندگی و اجاره به عنوان یک استراتژی انتقالی یا سرمایه است. با انتقال دفتر مرکزی شرکت به جنوب، مدیران ارشد بیشتری به آنجا نقل مکان می کنند.", "image_url": "https://i.insider.com/6ae36ebf9bdea7d1607d2bec?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۰ آبان • ۱۹:۵۴"}, {"source": "Business Insider", "title": "Best Vivaia coupon codes in November 2026: Black Friday deals and 10% off", "link": "https://www.businessinsider.com/guides/deals/best-vivaia-coupon-code o checkout. On the checkout page, you can apply a coupon by pasting a promo code into the \"Input coupon code here\" text box and clicking \"Apply.\" Some coupons may already be automatically populated on the checkout page; you can view them by clicking the arrow next to \"Coupon.\" Once the code you want to use is added, continue the checkout process by entering your shipping and billing information. A coupon field will appear on the checkout page before you place your order. Vivaia Can you stack Vivaia coupon codes? ", "date_str": "2026-11-01T16:00:01+00:00", "hash": "b42f5b66d26a5e27", "title_fa": "بهترین کدهای کوپن Vivaia در نوامبر 2026: معاملات جمعه سیاه و 10٪ تخفیف", "summary_fa": "", "image_url": "https://i.insider.com/6ae516b48bd5d6547af3450b?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۰ آبان • ۱۹:۳۰"}, {"source": "Business Insider", "title": "I hadn't seen my grandfather in 22 years. When I finally returned to the Dominican Republic, his first question broke me.", "link": "https://www.businessinsider.com/couldnt-afford-visit-grandfather-dominican-republic-2026-11", "summary": "It took the author 22 years to be able to afford to visit his grandfather again. Courtesy of the author At 12, I spent three months working on my grandfather's farm in the Dominican Republic. I promised to return soon, but years of financial struggles kept me away for 22 years. When I finally saved enough to visit, my grandfather had dementia and had lost his farm. When I was 12, my mother sent my brother, Pedro, and me to the Dominican Republic for three months to stay at my grandfather's home. I think she needed a break from raising two boys in the Bronx alone and wanted us to spend time with her father. Pedro and I were thrilled to share the Spanish language we'd inherited from our family. My grandfather was waiting for us in his beat-up 91 Nissan pickup truck. Every bump felt like the wheels would fly off. It took me 22 years to go back to visit, and everything had changed. He had us working the land The green pasture and mountains of Santiago were a world apart from the 6-floor walk in New York. Here we slept in a bed with a mosquito net and heard the rooster and hens all night. In the morning, we were woken up by our abuelo's words, \"Vamos a trabjar,\" which meant: time to work.\" We went with him to the farm to be his ranch hands. It was exhausting. In the evening, with mud on our boots, my brother and I scrambled onto his truck. He drove us back to his place, where a bowl of sancocho was waiting. He'd been farming for 60 years. At the end of our 90 days, I promised to return soon. I had no idea it would be 22 years until I could afford to take a vacation on my own dime. I was broke At home, I was broke, working odd jobs to afford clothes and sneakers. Mom worked 50 hours a week and moved us to Bergen County, New Jersey. Watching \" The Lord of the Rings ,\" I decided I wanted to be an actor. Against my mother's wishes, I devised a plan to drop out of school to get exciting roles in the movie industry . She thought a secure position as a policeman, fireman, or teacher was a better route. But I blindly followed my movie dreams with no backup plan. Moving to Manhattan, I paid $800 a month for a 60-square-foot apartment. I found a manager who helped me score an audition for a small theatre play. I played \"suitor 1\" and then landed a lead role in a web series. I won the role of an assassin navigating a dysfunctional family while executing hits for clients. It was chaotic, deeply unserious at times, and entirely thrilling. But I could barely cover bills. Eve", "date_str": "2026-11-01T15:58:01+00:00", "hash": "8a0f96865f94926b", "title_fa": "22 سال بود که پدربزرگم را ندیده بودم. وقتی بالاخره به جمهوری دومینیکن برگشتم، اولین سوال او مرا شکست.", "summary_fa": "نویسنده 22 سال طول کشید تا بتواند از پس هزینه های زندگی دوباره پدربزرگش برود. با حسن نیت نویسنده در 12 سالگی، سه ماه را در مزرعه پدربزرگم در جمهوری دومینیکن کار کردم. قول دادم به زودی برگردم، اما سال‌ها مشکلات مالی مرا 22 سال دور نگه داشت. وقتی بالاخره به اندازه کافی پس انداز کردم تا بتوانم ملاقات کنم، پدربزرگم زوال عقل داشت و مزرعه خود را از دست داده بود. وقتی 12 ساله بودم، مادرم من و برادرم پدرو را به مدت سه ماه به جمهوری دومینیکن فرستاد تا در خانه پدربزرگم بمانیم. فکر می‌کنم او به تنهایی از بزرگ کردن دو پسر در برانکس نیاز داشت و می‌خواست ما با پدرش وقت بگذرانیم. پدرو و من بسیار هیجان زده بودیم که زبان اسپانیایی را که از خانواده خود به ارث برده بودیم به اشتراک بگذاریم. پدربزرگم با وانت نیسان 91 خود منتظر ما بود. هر ضربه ای احساس می کرد که چرخ ها از بین می روند. 22 سال طول کشید تا به آنجا برگردم و همه چیز تغییر کرده بود. او ما را مجبور به کار در زمین کرد مرتع سرسبز و کوه های سانتیاگو دنیایی جدا از پیاده روی 6 طبقه در نیویورک بود. اینجا توی تختی با پشه بند خوابیدیم و تمام شب صدای خروس و مرغ را شنیدیم. صبح با سخنان ابولو خود بیدار شدیم، \"Vamos a trabjar\" که به معنای: وقت کار است. ما با او به مزرعه رفتیم تا دستان دامداری او باشیم. خسته کننده بود. عصر، با گلی روی چکمه هایمان، من و برادرم سوار کامیونش شدیم. او ما را به محل خود برگرداند، جایی که یک کاسه سانکوچو منتظر بود. او 60 سال کشاورزی می کرد. در پایان 90 روزمان، قول دادم به زودی برگردم. نمی‌دانستم 22 سال طول می‌کشد تا بتوانم با پول خودم به تعطیلات بپردازم. من", "image_url": "https://i.insider.com/6ada21d42a1b5bc156b1af72?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۰ آبان • ۱۹:۲۸"}, {"source": "The Verge", "title": "A fully playable version of Portal prequel F-Stop leaked", "link": "https://www.theverge.com/games/1024206/playable-portal-prequel-f-stop-leak", "summary": "Leakers have pieced together a playable version of the canceled Portal prequel F-Stop . Most of the assets came from the massive 12-terabyte leak that dropped this August. That didn't include the game's source code or map data, but those final pieces apparently hit the Valve Cut Content Discord this week, allowing a nearly com  valued at retail prices, now exceeds its employee pay", "link": "https://www.businessinsider.com/anthropic-claude-internal-ai-use-exceeds-employee-pay-tokens-2026-11", "summary": "Anthropic CEO Dario Amodei. Aaron Schwartz/Bloomberg via Getty Images A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . Here's a remarkable milestone in the AI revolution: Anthropic now spends more on internal AI usage than it does paying employees. The company revealed this in its IPO filing . In April, the value of Claude AI used internally, calculated at prices Anthropic charges customers, exceeded its monthly employee compensation costs, excluding stock awards. By September, that internal AI usage had surged more than 250-fold since January. There's an important distinction here. Anthropic isn't actually spending more cash on AI than salaries. It's valuing its internal AI consumption at retail prices. Still, this feels like a watershed moment for the tech industry. In March, I wrote about a new trend : Tech companies are starting to treat AI tokens (the main way to measure usage) as a fourth component of employee compensation, alongside salary, bonuses, and stock awards. Anthropic's numbers show why. More than 90% of the code added to its software in September was written by Claude. Meanwhile, revenue has grown vastly faster than headcount. For decades, talented humans were the most valuable resource in Silicon Valley. Now AI is challenging that assumption. Sign up for the AI Insider newsletter here . Reach out to me via email at abarr@businessinsider.com Read the original article on Business Insider", "date_str": "2026-11-01T15:00:01+00:00", "hash": "3ecd246f8dc7457a", "title_fa": "استفاده داخلی آنتروپیک از هوش مصنوعی، که با قیمت های خرده فروشی ارزش گذاری می شود، اکنون از دستمزد کارکنان آن فراتر رفته است", "summary_fa": "", "image_url": "https://i.insider.com/6ae5023ed8cc18cf7950fbe3?width=1200       return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);

      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
