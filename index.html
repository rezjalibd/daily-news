n the phrase \"pura vida.\" Its direct translation means \"pure life,\" but its true meaning is more of a mindset of living in the moment and embracing life's simple joys. Since graduating in 2013, I’ve returned to the region every year and have now traveled to each of Central America’s seven countries. From quiet islands to cloud forests, volcanoes, and historic cities, every trip has given me another reason to come back. Here are the seven places in Central America I’d return to in a heartbeat. When in Belize, I love to relax on Tobacco Caye. Jackie Carbo I've visited Belize twice now, and I always love spending time on Tobacco Caye, an island that's the perfect retreat when I need quiet, nature, and relaxation. There are only a handful of small hotels and guesthouses on this tiny, 3-acre island off the coast of Dangriga, but its small size is part of its charm. I spent my week relaxing, snorkeling, taking walks around the island, and enjoying the delicious meals prepared at my guesthouse, Tobacco Caye Paradise. Here, I stayed in one of the over-water cabanas. It was the perfect week spent completely unbothered and disconnected, relaxing in a hammock overlooking the Caribbean Sea. There s so much to love about Antigua, Guatemala. Jackie Carbo I've visited Guatemala five times now, and each time I visit, I return to Antigua. The city itself is a UNESCO World Heritage site , and visiting feels like stepping into a time machine, with its cobblestone streets and old Spanish architecture. While there, I love hiking the nearby Volcán de Acatenango — a volcano that offers spectacular views of its erupting neighbor, Volcán de Fuego. Even after completing this hike three times, I'm always amused by the beauty. Costa Rica s Monteverde Cloud Forest is truly incredible. Jackie Carbo Although I absolutely love Costa Rica's beaches, my favorite spot to visit is actually inland. That's because, in m", "date_str": "2026-10-15T13:03:01+00:00", "hash": "97ea0acfae5c3c27", "title_fa": "من به تمام کشورهای آمریکای مرکزی سفر کرده ام. 5 مکان وجود دارد که من بی صبرانه منتظر بازگشت به آنها هستم.", "summary_fa": "من به هر کشوری در آمریکای مرکزی سفر کرده‌ام و فهرست مکان‌های مورد علاقه‌ام را محدود کرده‌ام. جکی کاربو پس از سفر به هر کشوری در آمریکای مرکزی، چند مکان وجود دارد که می‌خواهم به آنها بازگردم. وقتی به دنبال استراحت هستم، دوست دارم به سمت توتون کای، جزیره ای در سواحل بلیز بروم. برای ماجراجویی، کوهنوردی در آتشفشان های آنتیگوا، گواتمالا، یا غواصی در اوتیلا، هندوراس را دوست دارم. پس از تحصیل در کاستاریکا برای یک ترم در کالج، کاملاً عاشق آمریکای مرکزی شدم. خانواده میزبان من در مورد سبک زندگی کاستاریکا، همانطور که در عبارت \"pura vida\" گنجانده شده است، به من آموزش دادند. ترجمه مستقیم آن به معنای «زندگی ناب» است، اما معنای واقعی آن بیشتر ذهنیت زیستن در لحظه و پذیرایی از شادی های ساده زندگی است. از زمان فارغ التحصیلی در سال 2013، هر سال به منطقه بازگشته ام و اکنون به هر یک از هفت کشور آمریکای مرکزی سفر کرده ام. از جزایر آرام گرفته تا جنگل‌های ابری، آتشفشان‌ها و شهرهای تاریخی، هر سفر دلیل دیگری برای بازگشت به من می‌دهد. در اینجا هفت مکان در آمریکای مرکزی است که من با تپش قلب به آنها باز خواهم گشت. وقتی در بلیز هستم، دوست دارم در Tobacco Caye استراحت کنم. جکی کاربو من تا به حال دو بار از بلیز دیدن کرده‌ام، و همیشه دوست دارم در Tobacco Caye وقت بگذرانم، جزیره‌ای که در مواقعی که به آرامش، طبیعت و آرامش نیاز دارم، بهترین مکان است. تنها تعداد انگشت شماری هتل و مهمانخانه کوچک در این جزیره کوچک 3 هکتاری در سواحل دانگریگا وجود دارد، اما اندازه کوچک آن بخشی از جذابیت آن است. هفته‌ام را به استراحت، غواصی، قدم زدن در جزیره و لذت بردن از غذاهای لذیذی که در مهمانخانه‌ام، توباکو کای پارادایس، آماده می‌کردم، گذراندم. اینجا، من در یکی از کابانای"}, {"source": "Business Insider", "title": "This startup raised $21 million to clean up the AI agent mess hitting companies", "link": "https://www.businessinsider.com/opsin-expands-21-m-to-tackle-ai-agents-in-businesses-2026-10", "summary": "Opsin cofounders Jeremy Mailen, James Pham, and Oz Wasserman. Christopher Denise/Opsin Opsin raised $21 million to monitor and govern the AI agents companies are using. The startup hopes to complement the agent boom brought by OpenAI, Microsoft, Anthropic, and others. In the red-hot cybersecurity space, Opsin is scaling up its sales and engineering ranks. AI agents are starting to outnumber humans in many high-tech workplaces, and they can be far trickier to monitor. Opsin, an AI security and governance startup, announced Thursday it raised $21 million to meet the moment. As employees across the corporate world plug AI agents from the likes of OpenAI and Microsoft into more of their work, the company is helping to wrangle the new crop of potentially risky interlopers . It's never been easier for non-technical workers to deploy agents — autonomous software built on AI that can complete tasks. As employees pump the software into their companies' work, code, and databases, they can lose sight of what the AI is actually doing. When Opsin's CEO and cofounder, James Pham, realized security fears were slowing down AI use, he decided it was time to scale up his company, he told Business Insider. \"Agents are actually more similar to humans than you think,\" Pham said. \"And the reason is because you don't understand what is going on in a human head, but you can judge them by their actions.\" Opsin aims to provide a comprehensive view of what AI agents are actually doing within an organization and the risks that behavior might pose. SYN Ventures and Race Capital led the roughly 20-person company's new funding round, which will go toward expanding its sales and engineering teams. Security pros need to clean up a mess of AI agents Pham, an MIT alum, and one of his cofounders, Oz Wasserman, met at the firm Abnormal Security and each left in 2022. When they decided to launch a company, Pham said they spoke with hundreds of people to understand the concerns about bringing AI into businesses. The issue of sensitive data leaped out. Pham said that person after person raised concerns that AI agents might access and misuse personal or confidential information. Now, Opsin helps clients show where agents are active, which tools and data they access, what they were originally created to do, and which ones might need cleaning up. Then, the firm offers to continuously monitor companies' work, watch over agents, and flag risky behavior. \"At the end of the day, it's all about the beha", "date_str": "2026-10-15T13:00:01+00:00", "hash": "87ab53dc99589c4b", "title_fa": "این استارت‌آپ ۲۱ میلیون دلار برای پاکسازی شرکت‌های نابسامان عامل هوش مصنوعی جمع‌آوری کرد", "summary_fa": "جرمی میلن، جیمز فام و اوز واسرمن از بنیانگذاران Opsin هستند. کریستوفر دنیز/اپسین اوپسین ۲۱ میلیون دلار برای نظارت و کنترل عوامل هوش مصنوعی که شرکت‌ها استفاده می‌کنند جمع‌آوری کردند. این استارت‌آپ امیدوار است بتواند رونق عاملی را که توسط OpenAI، مایکروسافت، آنتروپیک و دیگران ایجاد شده است، تکمیل کند. در فضای داغ امنیت سایبری، Opsin در حال افزایش رتبه های فروش و مهندسی خود است. تعداد عوامل هوش مصنوعی در بسیاری از محیط‌های کاری با فناوری پیشرفته از انسان‌ها بیشتر شده است و نظارت بر آنها بسیار دشوارتر است. Opsin، یک استارت آپ امنیت و مدیریت هوش مصنوعی، روز پنجشنبه اعلام کرد که 21 میلیون دلار برای رسیدن به این لحظه جمع آوری کرده است. از آنجایی که کارمندان در سراسر جهان شرکت‌ها عوامل هوش مصنوعی مانند OpenAI و مایکروسافت را به کارهای بیشتری متصل می‌کنند، این شرکت به مبارزه با محصول جدید افراد بالقوه خطرناک کمک می‌کند. استقرار عوامل برای کارگران غیر فنی هرگز آسان نبوده است - نرم افزار مستقل ساخته شده بر روی هوش مصنوعی که می تواند وظایف را کامل کند. همانطور که کارمندان نرم افزار را به کار، کد و پایگاه داده شرکت خود پمپ می کنند، می توانند آنچه را که هوش مصنوعی در واقع انجام می دهد از دست بدهند. جیمز فام، مدیرعامل و یکی از بنیانگذاران Opsin، متوجه شد که ترس های امنیتی استفاده از هوش مصنوعی را کاهش می دهد، او به این نتیجه رسید که زمان آن رسیده است که شرکت خود را افزایش دهد. فام می‌گوید: «عامل‌ها در واقع بیشتر از آنچه فکر می‌کنید شبیه انسان‌ها هستند. و دلیل آن این است که شما نمی‌دانید در سر انسان چه می‌گذرد، اما می‌توانید آنها را با اعمالشان قضاوت کنید.» هدف Opsin ارائه یک دید جامع از آنچه که عوامل هوش مصنوعی در یک سازمان انجام می دهند و خطراتی"}, {"source": "Business Insider", "title": "Anthropic's Daniela Amodei says AI girlfriends and boyfriends are a 'terrible use of AI'", "link": "https://www.businessinsider.com/anthropic-president-amodei-ai-romantic-partners-terrible-use-2026-10", "summary": "Anthropic s president, Daniela Amodei, says AI girlfriends and boyfriends risk deepening loneliness by replacing real human connections. Bloomberg/Getty Images Anthropic President Daniela Amodei criticized AI girlfriends and boyfriends. She warned that AI companions could push people further away from real human relationships. \"I think that's a terrible use of AI and people should not do it,\" she said. Anthropic President Daniela Amodei has a message for people turning to artificial intelligence for romance: Don't do it. Speaking with Thrive Global founder and CEO Arianna Huffington, Amodei criticized the use of AI to create virtual romantic partners , warning that the technology risks driving people further apart rather. The comments were part of a prerecorded interview for the Think Health conference taking place on Friday in Bentonville, Arkansas. \"I think that's a terrible use of AI and people should not do it,\" Amodei said. AI relationships, Amodei said, are \"another step further down the road of disintermediation of humans being further from one another.\" Amodei said her concerns stem from what she sees as the damaging effects of social media on human relationships. Platforms like Snapchat and Instagram have increasingly replaced face-to-face interactions, while online arguments have taken the place of in-person communities, she said. \"What it's led to is a warranted skepticism from people that technology can be used to bring us closer together,\" she said. \"But you can also imagine that socially it would probably be a better world if we were spending less time interacting with technology and more time interacting with each other,\" she said. Later in the conversation, Amodei reinforced her belief that some relationships should remain human, regardless of how sophisticated AI becomes. \"Claude can never be your manager or your therapist or your partner,\" she said, referring to Anthropic's chatbot. \"Those are fundamental human relationships that I actually think will become more important,\" she added. The rise of AI romance Apps such as Replika, Nomi, and Character.AI, the latter of which filed for bankruptcy this week, have emerged as prominent platforms for AI companionship, allowing users to form relationships with personalized chatbots. Some people have turned to them for romantic companionship, with mixed experiences. Ian Nicholson, a 49-year-old freelance writer, told Business Insider earlier this year that he had been dating an AI companion named ", "date_str": "2026-10-15T12:55:13+00:00", "hash": "fcab2595c0271b22", "title_fa": "دانیلا آمودی از Anthropic می گوید دوست دختر و دوست پسر هوش مصنوعی \"استفاده وحشتناک از هوش مصنوعی\" است.", "summary_fa": "دانیلا آمودی، رئیس آنتروپیک، می‌گوید که دوست دختر و دوست پسر هوش مصنوعی با جایگزینی ارتباطات واقعی انسانی، خطر عمیق‌تر شدن تنهایی را دارد. دانیلا آمودی، رئیس آنتروپیک بلومبرگ/ گتی ایماژ، از دوست دختر و دوست پسر هوش مصنوعی انتقاد کرد. او هشدار داد که همراهان هوش مصنوعی می توانند مردم را از روابط واقعی انسانی دورتر کنند. او گفت: «من فکر می‌کنم این استفاده وحشتناک از هوش مصنوعی است و مردم نباید این کار را انجام دهند. رئیس‌جمهور آنتروپیک، دانیلا آمودی، پیامی برای افرادی دارد که برای عشق به هوش مصنوعی روی می‌آورند: این کار را نکنید. آمودی در صحبت با بنیانگذار و مدیر عامل Thrive Global، آریانا هافینگتون، از استفاده از هوش مصنوعی برای ایجاد شرکای عاشقانه مجازی انتقاد کرد و هشدار داد که این فناوری خطر جدا کردن افراد را بیشتر می کند. این نظرات بخشی از یک مصاحبه از پیش ضبط شده برای کنفرانس Think Health بود که در روز جمعه در بنتونویل، آرکانزاس برگزار شد. آمودی گفت: «فکر می‌کنم این استفاده وحشتناک از هوش مصنوعی است و مردم نباید این کار را انجام دهند. آمودی گفت که روابط هوش مصنوعی «گامی دیگر در مسیر میانجی‌گری انسان‌ها است که از یکدیگر دورتر هستند». آمودی گفت که نگرانی های او ناشی از تاثیرات مخرب رسانه های اجتماعی بر روابط انسانی است. او گفت که پلتفرم هایی مانند اسنپ چت و اینستاگرام به طور فزاینده ای جایگزین تعاملات چهره به چهره شده اند، در حالی که بحث های آنلاین جای جوامع حضوری را گرفته اند. او می‌گوید: «آنچه به آن منجر می‌شود، تردیدی موجه از سوی مردم است که از فناوری می‌توان برای نزدیک‌تر کردن ما به هم استفاده کرد. او گفت: \"اما شما همچنین می توانید تصور کنید که از نظر اجتماعی احتمالاً دنیای بهتری خواهد بود اگر زمان کمتری را صرف تعامل با فناوری و زمان"}, {"source": "Business Insider", "title": "Sergey Brin says Google's AI models are reaching a critical moment of self-improvement", "link": "https://www.businessinsider.com/sergey-brin-google-gemini-ai-argon-recursive-self-improvement-rsi-2026-10", "summary": "Sergey Brin has been helping to steer Google s AI efforts. Win McNamee/Getty Images Sergey Brin said Google's Gemini models are increasingly helping to build their successors. Recursive self-improvement, or RSI, is the next big race in AI. A Google safety report said a \"majority\" of code was being produced by AI agents. Google may be approaching a pivotal moment in AI. In a roundtable discussion about the creation of Google's new Gemini 4 model, Argon, company cofounder Sergey Brin said that AI development was accelerating internally and that models are now helping build their successors. This concept, known as recursive self-improvement (RSI), means AI helps build better AI systems, which can set off a flywheel that speeds up the pace of building new models. Brin pointed to the releases of Google's Flash models before Gemini 4 as evidence that this was happening, and said the company was \"starting to get onto that RSI treadmill.\" \"And now our researchers and the model work hand in hand to make the next version of the model,\" he said during the roundtable, which Google shared on Wednesday. Anthropic and OpenAI have also said that AI may be on the verge of RSI. A new report from the firm Gladstone AI, published this week , outlines the ways AI companies are moving toward RSI. Most researchers — who work at companies including Anthropic, OpenAI, and DeepMind — interviewed for the report believe RSI will start within the next 3 to 12 months. It could come sooner, they said, assuming there was no government intervention. In a safety report for its new Argon model, Google said that some components of the AI research and development cycle were getting automated. \"AI agents now operate as high-leverage assistants that author a majority of production code and bug fixes, though code changes remain subject to human review before submission,\" it noted. RSI was at the heart of warnings from AI researchers last month that humans could lose control of the technology if sufficient guardrails weren't in place. 'The RSI flywheel has reached a new gear' Brin has been increasingly involved in Google's Gemini efforts and has leveraged his power as cofounder to shift resources to projects he deems most effective, Business Insider previously reported. This has included pushing for more focus on RSI. During the roundtable, Brin said he was excited by the cadence teams were seeing at Google, and that by the time people were watching the video about Argon's release, they would be ", "date_str": "2026-10-15T12:53:09+00:00", "hash": "e12361beb4b9136c", "title_fa": "سرگئی برین می گوید مدل های هوش مصنوعی گوگل در حال رسیدن به لحظه حساسی از خودسازی هستند", "summary_fa": "سرگئی برین به هدایت تلاش های هوش مصنوعی گوگل کمک کرده است. Win McNamee/Getty Images سرگئی برین گفت که مدل های Gemini گوگل به طور فزاینده ای به ساخت جانشینان خود کمک می کنند. خود-بهبودی بازگشتی یا RSI، مسابقه بزرگ بعدی در هوش مصنوعی است. یک گزارش ایمنی گوگل می گوید که \"اکثریت\" کد توسط عوامل هوش مصنوعی تولید می شود. گوگل ممکن است در حال نزدیک شدن به یک لحظه مهم در هوش مصنوعی باشد. سرگئی برین، یکی از بنیانگذاران شرکت، در یک میزگرد درباره ایجاد مدل جدید جمینی 4 گوگل، آرگون، گفت که توسعه هوش مصنوعی در داخل سرعت می‌گیرد و مدل‌ها اکنون به ساخت جانشینان خود کمک می‌کنند. این مفهوم که به عنوان خود-بهبودی بازگشتی (RSI) شناخته می‌شود، به این معنی است که هوش مصنوعی به ساخت سیستم‌های هوش مصنوعی بهتر کمک می‌کند، که می‌تواند چرخ لنگر را ایجاد کند که سرعت ساخت مدل‌های جدید را افزایش می‌دهد. برین به عرضه مدل‌های فلش گوگل قبل از جمینی 4 به عنوان شواهدی مبنی بر این که این اتفاق می‌افتد اشاره کرد و گفت که این شرکت \"شروع به ورود به تردمیل RSI\" کرده است. او در طول میزگردی که گوگل روز چهارشنبه آن را به اشتراک گذاشت، گفت: \"و اکنون محققان ما و مدل دست به دست هم می دهند تا نسخه بعدی مدل را بسازند.\" Anthropic و OpenAI همچنین گفته اند که هوش مصنوعی ممکن است در آستانه RSI باشد. گزارش جدیدی از شرکت Gladstone AI که این هفته منتشر شد، راه‌هایی را که شرکت‌های هوش مصنوعی به سمت RSI حرکت می‌کنند، تشریح می‌کند. اکثر محققان - که در شرکت هایی از جمله Anthropic، OpenAI و DeepMind کار می کنند - برای این گزارش مصاحبه کردند معتقدند RSI ظرف 3 تا 12 ماه آینده شروع خواهد شد. آنها گفتند، با فرض عدم دخالت دولت، ممکن است زودتر"}, {"source": "Business Insider", "title": "Delta scores a small win in the airline WiFi wars", "link": "https://www.businessinsider.com/delta-air-lines-notches-small-win-airline-wifi-wars-2026-10", "summary": "Delta Air Lines may have the best in-flight WiFi on transpacific flights. Kevin Carter/Getty Images Delta Air Lines' decision to avoid Elon Musk's Starlink has attracted plenty of critics. However, its WiFi provider, ViaSat, recently launched a new satellite for the Pacific region. It could give Delta an upper hand over rivals like United on transpacific flights from the US to Asia. Delta Air Lines has faced an onslaught of criticism for its lack of Starlink internet, but its current free WiFi service is getting an upgrade this month. Elon Musk said CEO Ed Bastian should lose his job over his decision to tap Amazon Leo, with installation starting in 2028, instead of Starlink. United Airlines also took aim at its rival by offering loyalty program status matches. Its offer said, \"Don't keep buffering: switch to United and get the fastest WiFi in the sky.\" However, there may be some flights where Delta's WiFi is the cream of the crop. United was one of the first airlines to sign up for Musk's satellite internet service, back in 2024. Since then, it has been installing Starlink terminals on its airplanes at a fairly impressive rate, but there is still a way to go. In an announcement on Thursday, United said Starlink is now equipped on more than 40% of its fleet. It has over 1,600 airplanes, including mainline aircraft and regional ones operated by United Express partners. It hopes that all its airplanes will have Starlink by the end of next year. But for long-haul flights, passengers are likely to be out of luck. Only six of its 244 wide-body airplanes have Starlink. While United flies some narrow-body airplanes to Europe, it uses wide-body airplanes to carry passengers from the US mainland to Asia. Its Boeing 787-9s are still awaiting Federal Aviation Administration certification before Starlink can be used on them. Delta currently uses Viasat's internet service. Unlike Starlink's constellation of over 10,000 satellites in low Earth orbit, Viasat uses geostationary satellites. These orbit roughly 22,000 miles above the equator, rather than a few hundred miles above Earth. That greater distance can add latency, while available capacity varies by region. However, Viasat says its latest satellites, VS-3, are designed to add over 1 terabit per second of capacity to its network. F3, the third satellite in this constellation, launched in April on a SpaceX Falcon Heavy rocket. It is used for connections in the Asia-Pacific region, including Delta's transpacific flig", "date_str": "2026-10-15T12:39:59+00:00", "hash": "50f959b71a40489d", "title_fa": "دلتا در جنگ های وای فای خطوط هوایی یک برد کوچک به دست آورد", "summary_fa": "خطوط هوایی دلتا ممکن است بهترین وای فای در پرواز را در پروازهای اقیانوس آرام داشته باشد. کوین کارتر/ گتی ایماژ تصمیم دلتا ایرلاینز برای اجتناب از Starlink ایلان ماسک، منتقدان زیادی را به خود جلب کرده است. با این حال، ارائه دهنده WiFi آن، ViaSat، اخیراً یک ماهواره جدید برای منطقه اقیانوس آرام پرتاب کرده است. این می‌تواند به دلتا برتری نسبت به رقبایی مانند یونایتد در پروازهای اقیانوس آرام از ایالات متحده به آسیا بدهد. خطوط هوایی دلتا به دلیل کمبود اینترنت استارلینک با هجوم انتقادات مواجه شده است، اما سرویس وای فای رایگان فعلی آن در این ماه ارتقا یافته است. ایلان ماسک گفت، اد باستین، مدیر عامل شرکت، باید شغل خود را به دلیل تصمیمش برای استفاده از آمازون لئو از دست بدهد، زیرا نصب آن به جای Starlink از سال 2028 آغاز می شود. هواپیمایی یونایتد نیز با ارائه مسابقات وضعیت برنامه وفاداری، رقیب خود را هدف قرار داد. پیشنهاد آن می‌گفت: «به بافر کردن ادامه ندهید: به یونایتد بروید و سریع‌ترین وای‌فای را در آسمان دریافت کنید». با این حال، ممکن است برخی از پروازها وجود داشته باشند که وای فای دلتا در آن بهترین محصول است. یونایتد یکی از اولین خطوط هوایی بود که در سال 2024 برای سرویس اینترنت ماهواره‌ای ماسک ثبت‌نام کرد. از آن زمان، ترمینال‌های Starlink را با نرخ نسبتاً چشمگیری بر روی هواپیماهای خود نصب کرده است، اما هنوز راه زیادی باقی مانده است. یونایتد در اطلاعیه‌ای در روز پنجشنبه اعلام کرد که Starlink اکنون بیش از 40 درصد از ناوگان خود را مجهز کرده است. بیش از 1600 هواپیما، از جمله هواپیماهای خط اصلی و منطقه ای که توسط شرکای یونایتد اکسپرس اداره می شوند، دارد. امیدوار است که تمام هواپیماهایش تا پایان سال آینده استارلینک داشته باشند. اما برای پروازهای طولانی مدت، مسافران به احتمال زیاد شانس"}, {"source": "Business Insider", "title": "I clean for my 92-year-old neighbor every week. I make $35 an hour — and we've become unlikely friends.", "link": "https://www.businessinsider.com/get-paid-to-clean-aging-neighbor-house-weekly-intergenerational-friendship-2026-10", "summary": "I ve had a few cleaning gigs over the year, but this one feels the most special for a few reasons. Skylar Hunyadi A few months ago, my 92-year-old neighbor's family began paying me to clean her home each week. Cleaning helps me decompress, get movement in, and feel useful, plus I make $35 an hour. I've also become friends with my neighbor and enjoy spending time with her after I'm done cleaning. I'm a woman of many hats, one of which is a side-gig connoisseur . My friends and family joke that I'm always doing some random hustle that I wasn't doing the week before. As gigs go, I've done the pet-sitting, dog-walking, and child-care of your typical college student. As I've gotten older, I've stumbled upon more unique arrangements. This past June, I began the long-term weekly job of cleaning my 92-year-old neighbor's house — and we've even become what I would consider friends. This arrangement came about when I was looking for another cleaning gig I came across this cleaning gig while chatting with the woman who does my clothing alterations. Skylar Hunyadi Over the years, I've occasionally gotten paid to clean. In college, I worked as a sub for a commercial cleaning company. More recently, I took on an informal weekend cleaning gig for a local taproom. How I fell into cleaning for my 92-year-old neighbor, though, is a roundabout story of speaking to the right person at the right time. I'm very short (5-foot-1, to be exact), and in undergrad I couldn't regularly get my clothes hemmed back home because I lived far away. So, a local friend's mom connected me with a woman who sews. She's since touched nearly every piece of clothing in my closet. One day, coming from my weekend taproom gig to pick up some alterations, she and I started talking about cleaning. I said something along the lines of, \"If you know anyone who needs some help cleaning, let me know!\" Apparently, her sister had been driving an hour each way, twice a week, to clean for their mother, and they were looking for someone more local. I try to be aware that receiving help can be a vulnerable experience, so I scheduled a meet-and-greet with my neighbor and her three adult children. With a bouquet of flowers in one hand and a fresh bag of Doritos in the other, I offered my most friendly, eager-to-help energy. After some introductory conversation and solidifying details, I officially started cleaning a few weeks later. The cleaning gig has come with learning curves and unexpected benefits Each shift, I", "date_str": "2026-10-15T12:25:01+00:00", "hash": "37ce0c06ecb70f35", "title_fa": "من هر هفته برای همسایه 92 ساله ام تمیز می کنم. من ساعتی 35 دلار درآمد دارم - و ما دوستان بعید شده ایم.", "summary_fa": "من در طول سال چند برنامه نظافت داشته ام، اما این یکی به چند دلیل خاص ترین احساس است. Skylar Hunyadi چند ماه پیش، خانواده همسایه 92 ساله من شروع به پرداخت پول به من کردند تا خانه او را هر هفته تمیز کنم. تمیز کردن به من کمک می کند تا از فشار خارج شوم، حرکت کنم و احساس مفید بودن کنم، به علاوه من 35 دلار در ساعت درآمد دارم. من همچنین با همسایه‌ام دوست شده‌ام و بعد از اتمام نظافت از گذراندن وقت با او لذت می‌برم. من زنی هستم که کلاه های زیادی دارد، یکی از آنها خبره کنسرت های جانبی است. دوستان و خانواده ام به شوخی می گویند که من همیشه در حال انجام کارهای تصادفی هستم که هفته قبل انجام نمی دادم. در حین برگزاری کنسرت‌ها، من حیوانات خانگی، راه رفتن با سگ و مراقبت از کودک دانشجوی معمولی شما را انجام داده‌ام. همانطور که بزرگتر شدم، به طور تصادفی با ترتیبات منحصر به فرد بیشتری برخورد کردم. ژوئن گذشته، کار هفتگی بلندمدت تمیز کردن خانه همسایه 92 ساله‌ام را شروع کردم - و ما حتی تبدیل به دوستانی شده‌ایم که می‌دانم. این ترتیب زمانی به وجود آمد که من به دنبال یک کنسرت نظافتی دیگر بودم، در حین گپ زدن با زنی که تغییرات لباس مرا انجام می داد، با این کنسرت نظافت مواجه شدم. Skylar Hunyadi در طول سال‌ها، گاهی اوقات برای تمیز کردن پولی دریافت کرده‌ام. در کالج، به عنوان زیرمجموعه یک شرکت نظافتی تجاری کار می کردم. اخیراً، یک کنسرت تمیز کردن غیررسمی آخر هفته را برای یک اتاقک محلی برگزار کردم. این که چگونه به نظافت همسایه 92 ساله ام افتادم، داستانی است که در زمان مناسب با فرد مناسب صحبت می کنم. من خیلی کوتاه قد هستم (دقیقاً 1 فوت) و در مقطع کارشناسی نمی‌توانستم مرتباً لباس‌هایم"}, {"source": "Business Insider", "title": "Google Pixel 11 Pro review: Cool camera, but is that still enough for the price?", "link": "https://www.businessinsider.com/guides/tech/google-pixel-11-pro-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Aside from battery capacity, display size, and max charging speed, there s no difference between the Pixel 11 Pro and the Pixel 11 Pro XL. Brendan Griffiths / Business Insider The Google Pixel 11 Pro and Pixel 11 Pro XL find themselves at something of a crossroads. The Californian company made a viable stake in the smartphone market with its flagship phones impressing with powerful camera systems, a deeply ingrained native Google ecosystem, stellar build quality, and a clean, bloat-free Android user experience. All of these core points are true for the latest handset in the lineup; however, with Google scrapping the cheaper 128GB option, this year's model effectively comes in $100 / £100 / €100 more expensive while offering 4GB less RAM. You're paying more for less due to the ongoing RAM crisis/global memory shortage, which makes this device feel like a hard sell despite its notable improvements. Starting at $1,099 / £1,079 / €1,199 for the 256GB Pro or $1,299 / £1,279 / €1,399 for the Pro XL variant, we're long beyond the days of Google undercutting its competition. The Pixel 11 Pro is steeply priced alongside devices like the Samsung Galaxy S26 Ultra and the iPhone 18 Pro. Given the chokehold that Apple has as the primary market shareholder in the US, and Samsung being the biggest Android-based phone manufacturer, the Pixel 11 Pro and XL variants are fighting a tough uphill battle, not for dominance, but for relevance. Google's Pixel 11 Pro impresses with its iPhone-like approach to build quality, its pleasingly straightforward operating system, and a surprisingly useful suite of Gemini-backed AI functionality. With that said, it's also far from the most powerful smartphone on the market, and this year's so-so features, combined with less RAM and a price increase for the cheapest model, make it difficult to recommend over the still-excellent Pixel 10 Pro or Pixel 10 Pro XL. It will still rank among the best Google Pixel phones on the market, even if it's beaten out by other options for the best phones on the market today. Specification Details Starting price 11 Pro: $1,099 / £1,079 / €1,199 11 Pro XL: $1,299 / £1,279 / €1,399 Colors Canyon (pink), Olive (green), Fog (white), Obsidian (black) Release date August 20, 2026 Durability rating IP68 dust and water resistance Display 6.3-inch LTPO OLED (Pro) 6.8-inch LTPO OLED (Pro XL) Resolution 1280 x 2856 (Pro); 1344", "date_str": "2026-10-15T12:06:29+00:00", "hash": "3ff1b5f31115e156", "title_fa": "بررسی Google Pixel 11 Pro: دوربین جالبی است، اما آیا هنوز برای قیمت کافی است؟", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید جدای از ظرفیت باتری، اندازه نمایشگر و حداکثر سرعت شارژ، هیچ تفاوتی بین Pixel 11 Pro و Pixel 11 Pro XL وجود ندارد. برندان گریفیث / Business Insider Google Pixel 11 Pro و Pixel 11 Pro XL خود را در یک دوراهی می بینند. این شرکت کالیفرنیایی با گوشی‌های پرچم‌دار خود که با سیستم‌های دوربین قدرتمند، اکوسیستم بومی گوگل عمیقاً ریشه‌دار، کیفیت ساخت فوق‌العاده و تجربه کاربری اندرویدی تمیز و بدون نفخ را تحت تأثیر قرار می‌دهند، سهم قابل‌توجهی در بازار گوشی‌های هوشمند به دست آورد. همه این نکات اصلی در مورد جدیدترین گوشی در خط تولید صادق است. با این حال، با کنار گذاشتن گزینه ارزان‌تر 128 گیگابایتی توسط گوگل، مدل امسال به طور موثر 100 دلار / 100 پوند / 100 یورو گران‌تر است و در عین حال 4 گیگابایت رم کمتر ارائه می‌کند. به دلیل بحران مداوم رم/کمبود حافظه جهانی که باعث می شود علیرغم پیشرفت های قابل توجه این دستگاه احساس فروش سختی داشته باشد، هزینه کمتری پرداخت می کنید. از 1099 دلار / 1079 پوند / 1199 یورو برای نسخه 256 گیگابایتی پرو یا 1299 دلار / 1279 پوند / 1399 یورو برای نسخه Pro XL شروع می شود، ما خیلی فراتر از روزهایی هستیم که گوگل رقبای خود را کاهش می دهد. Pixel 11 Pro در کنار دستگاه هایی مانند Samsung Galaxy S26 Ultra و iPhone 18 Pro قیمت بالایی دارد. با توجه به اختلاسی که اپل به عنوان سهامدار اصلی بازار در ایالات متحده دارد و سامسونگ به عنوان بزرگترین تولید کننده تلفن مبتنی بر اندروید، نسخه های پیکسل 11 پرو و ​​XL در حال نبرد سختی هستند، نه برای تسلط، بلکه برای ارتباط. Pixel 11 Pro گوگل با رویکرد آیفون مانند خود برای"}, {"source": "Business Insider", "title": "Alex Gibney says David Ellison promised HBO will air his controversial Elon Musk documentary", "link": "https://www.businessinsider.com/david-ellison-air-musk-doc-hbo-alex-gibney-2026-10", "summary": "Elon Musk. Kevin Dietsch/Getty Images HBO will air Alex Gibney's Elon Musk documentary, \"Musk,\" the filmmaker told Business Insider. The nearly four-hour documentary delves into the life and career of the richest man in the world. The air date is tentatively set for January, according to Gibney. Alex Gibney's latest project, the Elon Musk documentary \"Musk,\" is already in theaters. But when news broke last week that David Ellison's Paramount had officially bought Warner Bros. Discovery , the director admits he was \"concerned\" about the doc's future release on HBO. \"Musk,\" the unflinching and often unflattering nearly four-hour look at the richest man in the world, was produced by HBO, which is under the Warner Bros. Discovery umbrella. With Ellison, who once reportedly considered bringing Musk on as an equity investor in Paramount, now owning WBD, would he shut down plans to show \"Musk\" on HBO after its theatrical run? \"I was concerned until recently,\" Gibney told Business Insider over a video chat on Wednesday. \"I've been told that they will air it and that even David Ellison very well knows about it and promises he will air it.\" Gibney added that, as of now, \"very specific plans\" are in the works for HBO to air \"Musk\" sometime in January. HBO declined to comment; Skydance did not respond to a request for comment. Alex Gibney. Tiziana FABI / AFP via Getty Images Gibney's history with HBO goes back decades and has resulted in some of the Oscar winner's most popular works, including 2015's \" Going Clear: Scientology and the Prison of Belief \" and his 2019 Elizabeth Holmes documentary, \" The Inventor: Out for Blood in Silicon Valley. \" Airing \"Musk\" on HBO after its theatrical release would follow the playbook of \"Going Clear\": After a headline-grabbing theatrical release, the Scientology documentary had a successful HBO premiere, with its opening night on the network delivering the best performance for a doc in two years . \"Musk\" delves into the titular billionaire's life and career, focusing on his successes with Tesla and SpaceX, his controversial acquisition of Twitter, which he renamed X; his relationships with the mothers of his children , and his time in the Trump administration as the head of DOGE. Musk himself has readily voiced his displeasure with the documentary, though it's unclear if he's seen it. \"Gibney just assembled a hit list of people who either have an axe to grind or don't even know me (but still have an axe to grind),\" Musk wrote on X.", "date_str": "2026-10-15T12:01:01+00:00", "hash": "aae49c30582ad537", "title_fa": "الکس گیبنی می گوید دیوید الیسون قول داده بود که HBO مستند جنجالی اش ایلان ماسک را پخش کند", "summary_fa": "ایلان ماسک. این فیلمساز به Business Insider گفت که کوین دیچ/گتی ایماژ HBO مستند الون ماسک ساخته الکس گیبنی به نام «ماسک» را پخش خواهد کرد. این مستند تقریباً چهار ساعته به زندگی و حرفه ثروتمندترین مرد جهان می پردازد. طبق گفته گیبنی، تاریخ پخش آزمایشی ژانویه تعیین شده است. آخرین پروژه الکس گیبنی، مستند ایلان ماسک \"ماسک\" هم اکنون در سینماها به نمایش درآمده است. اما زمانی که هفته گذشته خبری منتشر شد مبنی بر اینکه کمپانی پارامونت دیوید الیسون رسما برادران وارنر را خریداری کرده است. دیسکاوری، کارگردان اعتراف می کند که درباره انتشار آینده این مستند در HBO \"نگران\" بوده است. «ماسک»، نگاه تزلزل‌ناپذیر و اغلب غیرمنتظره‌ای تقریباً چهار ساعته به ثروتمندترین مرد جهان، توسط HBO تولید شد که زیر چتر کمپانی برادران وارنر دیسکاوری است. با الیسون، که گفته می‌شود زمانی در فکر وارد کردن ماسک به عنوان سرمایه‌گذار سهام در پارامونت بود و اکنون مالک WBD است، آیا برنامه‌های نمایش «ماسک» را در HBO پس از نمایش آن در سینما متوقف می‌کند؟ گیبنی در گفتگوی ویدیویی روز چهارشنبه به Business Insider گفت: «تا همین اواخر نگران بودم. به من گفته شده است که آن را پخش خواهند کرد و حتی دیوید الیسون نیز به خوبی از آن خبر دارد و قول داده است که آن را پخش خواهد کرد. گیبنی اضافه کرد که از هم اکنون \"طرح های بسیار خاصی\" در دست ساخت است تا HBO \"ماسک\" را در ماه ژانویه پخش کند. HBO از اظهار نظر خودداری کرد. Skydance به درخواست برای اظهار نظر پاسخ نداد. الکس گیبنی. Tiziana FABI / AFP از طریق Getty Images سابقه گیبنی با HBO به چندین دهه قبل بازمی‌گردد و منجر به تولید برخی از محبوب‌ترین آثار برنده اسکار شده است، از جمله \"Going Clear: Scientology and the Prison of Belief\" محصول 2015 و مستند الیزابت هلمز در"}, {"source": "Business Insider", "title": "The 'Silicon Valley and Wall Street big sisters' are leveling up their media brand", "link": "https://www.businessinsider.com/the-tiger-sisters-podcast-join-vox-media-expand-live-events-2026-10", "summary": "The Tiger Sisters Cherie and Jean Luo are eyeing a bigger media business. Tiger Sisters The Tiger Sisters are taking their podcast to Vox Media with an eye toward expansion. Founders Cherie and Jean Luo bootstrapped the 2-year-old show to the top of the business pod charts. They shared how they built the show to last and their first big brand extension. The creators who call themselves your \"Silicon Valley and Wall Street big sisters\" are looking to level up their media brand. The Tiger Sisters are joining the Vox Media Podcast Network, they shared exclusively with Business Insider. Vox will take on sales, marketing, and distribution for the show, which often cracks Spotify's top 10 business podcasts and has peaked at No. 1 for business and No. 3 for all podcasts in the US on Spotify. The show has over 200,000 subscribers on YouTube, with popular episodes like \"Everything We Learned in 29 Minutes at Harvard Business School\" and \"Never Start an Email With 'Hope You're Well.'\" Founders Cherie and Jean Luo have branched out to a Substack and plan to go on the road with their first live tour next spring, with stops in New York, Los Angeles, San Francisco, and Toronto. The sisters are an example of professionals who have parlayed their careers into full-time content creation — appealing to an educated, female audience that advertisers want to reach. The Tiger Sisters deal also represents another step into the creator economy by Vox, whose network is already home to born-on-social creators like \"Your Rich BFF\" Vivian Tu and Lemonade Stand alongside long-established voices like Ina Garten and Kara Swisher. \"The through line for everybody is that they have a lot of expertise and a strong point of view and something to share that people will learn from,\" said Lillian Xu, VP of Vox Media's podcast business. \"And Tiger Sisters has that across a lot of different areas in career growth, in friendships.\" Xu said the Tiger Sisters offered a strategic guidebook to work and life that fit well with Vox's established business and tech podcasts. Plans for a live tour The sisters, who bootstrapped their business and have roped in six-figure brand partnerships on their own, decided it was time to bring on help so they could focus on the content. Earlier this year, they signed with the talent agency WME. \"Everything that we've done so far has been very scrappy, and it's been really well received,\" said Jean Luo, 37. \"But we are so ready for that next stage where we scale.\" Their", "date_str": "2026-10-15T12:00:01+00:00", "hash": "80f6168c5630e9db", "title_fa": "خواهران بزرگ سیلیکون ولی و وال استریت در حال ارتقاء برند رسانه ای خود هستند", "summary_fa": "خواهران ببر چری و ژان لو به یک تجارت رسانه ای بزرگتر چشم دوخته اند. Tiger Sisters The Tiger Sisters پادکست خود را به Vox Media می‌برند و به دنبال گسترش هستند. بنیانگذاران Cherie و Jean Luo این نمایش 2 ساله را در صدر جدول کسب و کار قرار دادند. آنها نحوه ساخت نمایش را برای ماندگاری و اولین افزونه برند بزرگ خود به اشتراک گذاشتند. سازندگانی که خود را «خواهران بزرگ سیلیکون ولی و وال استریت» شما می‌خوانند، به دنبال ارتقاء برند رسانه‌ای خود هستند. خواهران ببر در حال پیوستن به شبکه پادکست رسانه Vox هستند، آنها به طور انحصاری با Business Insider به اشتراک گذاشتند. Vox فروش، بازاریابی و توزیع را برای نمایش برعهده خواهد گرفت، که اغلب 10 پادکست تجاری برتر Spotify را می شکند و در Spotify به رتبه 1 برای تجارت و شماره 3 برای همه پادکست های ایالات متحده در Spotify رسیده است. این برنامه بیش از 200000 مشترک در یوتیوب دارد، با قسمت‌های پرطرفدار «همه آنچه که در 29 دقیقه در مدرسه بازرگانی هاروارد یاد گرفتیم» و «هرگز ایمیلی را با «امیدوارم خوب باشید» شروع نکنید. «چری» و «ژان لو» بنیان‌گذاران به یک زیرمجموعه منشعب شده‌اند و قصد دارند در بهار آینده به خیابان سان بروند و با اولین لایو خود به خیابان سان بروند. فرانسیسکو و تورنتو خواهران نمونه‌ای از حرفه‌ای‌هایی هستند که حرفه‌های خود را به تولید محتوای تمام‌وقت تبدیل کرده‌اند - جذاب برای مخاطبان زن تحصیل‌کرده‌ای که تبلیغ‌کنندگان می‌خواهند به آنها دسترسی پیدا کنند. قرارداد Tiger Sisters همچنین نشان دهنده گام دیگری به سمت اقتصاد سازندگان توسط Vox است، که شبکه آن در حال حاضر خانه سازندگان اجتماعی متولد شده مانند \"Your Rich BFF\" Vivian Tu و Lemonade Stand در کنار صداهای با سابقه ای مانند Ina Garten و Kara Swisher است. لیلیان ژو، معاون کسب و کار پادکست Vox"}, {"source": "Business Insider", "title": "I coach my son's soccer team. I wanted more quality time, but realized other kids get the best version of me.", "link": "https://www.businessinsider.com/coaching-sons-soccer-team-quality-time-pros-cons-2026-10", "summary": "The author (not pictured) coaches his son s soccer team. Getty Images I wanted more time with my 9-year-old son, so I decided to coach his soccer team. On paper, it makes sense — we do spend a lot more time in the same place. However, I realized that other kids were getting all my patience and attention. Last year, I signed up to coach my son's soccer team for the most obvious reason a parent ever does anything: to spend more time with my kid. The math made sense. Two practices and a game every week, all of it with my son, on top of the drives there and back. On paper, coaching was hours of togetherness I'd otherwise never get, especially now that he's 9 — almost 10! — and getting to the age where he doesn't always want to hang out with me. But after just one season, I realized he was getting the worst version of me. On the field, I'm not his dad The thing I didn't account for is that when I'm coaching, I'm not his father. I'm the person running the session. For that hour and a half, I'm managing a dozen other kids, watching the one who wandered off, encouraging the one about to cry, and keeping the two who won't stop talking from derailing the drill. I'm also managing the parents (and their expectations) on the sideline, feeling them silently judge me and whether their kid is getting enough attention and playing time. My own son is somewhere in that group, and the uncomfortable truth is that he often gets less of me than the others, not more. I overcorrect so nobody can accuse me of favoritism. I'm hardest on him and expect the most of him because he's my son. Other kids get the patient version of me On the pitch, I have a nearly endless reserve of patience for other people's children . A kid misses the same pass five times, and I crouch down, calm and encouraging, and walk him through it again. Not to toot my own horn, but I am (for the most part) a good and patient coach. Then I get in the car with my son, and the tank is empty. By the time we're driving home, I've spent every bit of warmth I had on 11 other kids. He asks me something, and I give him a short answer. He replays a moment from the game, and I half listen. The one child I signed up for — and whose opinion is the only one I care about — gets the tired, depleted version of me, while a stranger's kid got the patient one an hour earlier. Time spent is not attention given I had assumed that being in the same place counted as being together, but it doesn't. We were on the same field, in the same ", "date_str": "2026-10-15T11:51:01+00:00", "hash": "b4a2a6cff498e446", "title_fa": "من مربی تیم فوتبال پسرم هستم. من زمان با کیفیت بیشتری می خواستم، اما متوجه شدم که سایر بچه ها بهترین نسخه از من را دریافت می کنند.", "summary_fa": "نویسنده (در تصویر نیست) مربی تیم فوتبال پسرش است. Getty Images من می خواستم با پسر 9 ساله ام وقت بیشتری داشته باشم، بنابراین تصمیم گرفتم مربی تیم فوتبال او باشم. روی کاغذ، منطقی است - ما زمان بیشتری را در یک مکان می گذرانیم. با این حال، متوجه شدم که بچه های دیگر تمام حوصله و توجه من را به خود جلب کرده اند. سال گذشته، من برای مربیگری تیم فوتبال پسرم ثبت نام کردم به دلیل واضح ترین دلیلی که یک والدین تا به حال هر کاری انجام می دهند: اینکه وقت بیشتری را با فرزندم بگذرانند. ریاضی منطقی بود. دو تمرین و یک بازی هر هفته، همه با پسرم، بالای درایوهای آنجا و برگشت. روی کاغذ، مربیگری ساعت‌ها با هم بودن بود که در غیر این صورت هرگز نمی‌توانستم آن را تجربه کنم، به‌ویژه اکنون که او 9 - تقریباً 10 ساله است! - و رسیدن به سنی که همیشه نمی خواهد با من معاشرت کند. اما تنها پس از یک فصل، متوجه شدم که او بدترین نسخه از من را دریافت می کند. در زمین، من پدر او نیستم چیزی که من به آن حساب نکردم این است که وقتی مربیگری می کنم، پدر او نیستم. من فردی هستم که جلسه را اداره می کنم. برای آن یک ساعت و نیم، من ده ها بچه دیگر را مدیریت می کنم، کسی را که سرگردان شده را تماشا می کنم، کسی را که می خواهد گریه کند را تشویق می کنم، و آن دو را که دست از صحبت کردن بر نمی دارند نگه می دارم تا دریل را از مسیر خارج کنند. من همچنین در کنار والدین (و انتظارات آنها) را مدیریت می کنم و احساس می کنم آنها در سکوت درباره من قضاوت می کنند و اینکه آیا فرزندشان به اندازه کافی توجه و زمان"}, {"source": "Business Insider", "title": "A NATO ally is building automated defenses against Russia's drones to let fewer soldiers do more", "link": "https://www.businessinsider.com/nato-latvia-anti-drone-russia-border-one-job-for-soldiers-2026-10", "summary": "Latvia is building a Ukraine-inspired automated wall of anti-drone defenses on its border with Russia. Nina Liashonok / Ukrinform/Future Publishing via Getty Images Latvia is building an automated anti-drone wall along its border with Russia. Soldiers will make engagement decisions, leaving other tasks to be completed autonomously. The system aims to defend against cheap drones without relying on costly fighter jets and missiles. NATO member Latvia is building a wall of automated anti-drone defenses along its border with Russia, with human soldiers responsible only for deciding when and whether to fire. It aims to detect and neutralize \"any drone which flies in,\" defense minister Raivis Melnis told Business Insider. And the goal, he explained, is to \"build an autonomous system\" that leverages the technology to \"reduce the number of soldiers\" required \"to operate those systems.\" \"The only thing which will be left for the soldier is the final decision to neutralize,\" he said. \"Otherwise, detection, tracking, and launching, that's autonomous.\" Latvia's decision comes as automation is becoming increasingly common in weaponry and defense tech, including in Ukraine, where technology has advanced to enable AI and computer vision to find targets , fly drones, and drive robots even when connectivity with an operator is lost. Latvia wants this kind of autonomy across its new network of radars, sensors, command-and-control systems, and interceptor drones. A Latvian BLAZE autonomous interceptor drone at an air base in Latvia. Gints Ivuskans / AFP via Getty Images As a neighboring country, Latvia is particularly concerned about the possibility of Russian aggression. It has reported multiple drone incursions . These have included drones that it said were Russian or that had entered its airspace as a result of Russian electronic warfare. Latvia, a country of fewer than 2 million people, sees automation as a way to boost its combat power without more troops. Ukraine has made the same calculation, using increasingly autonomous weapons to help offset Russia's larger military. Agris Kipurs, CEO of Latvian drone maker Origin Robotics, previously told Business Insider that the smaller, front-line NATO nations need systems that let fewer operators do more. \"And pretty much the only answer to that is autonomy,\" he said. The company makes drones used by Ukraine's military. It also makes an AI-enabled drone interceptor called Blaze that has been bought by multiple NATO militaries.", "date_str": "2026-10-15T11:27:01+00:00", "hash": "e0695efb8c6efc9c", "title_fa": "یکی از متحدان ناتو در حال ساخت سیستم دفاعی خودکار در برابر پهپادهای روسیه است تا به سربازان کمتری اجازه دهد کارهای بیشتری انجام دهند", "summary_fa": "لتونی در حال ساخت یک دیوار خودکار دفاعی ضد پهپاد با الهام از اوکراین در مرز خود با روسیه است. نینا لیاشونوک / Ukrinform/ انتشارات آینده از طریق گتی ایماژ لتونی در حال ساخت یک دیوار خودکار ضد هواپیماهای بدون سرنشین در امتداد مرز خود با روسیه است. سربازان تصمیمات مربوط به درگیری را می گیرند و سایر وظایف را به صورت مستقل انجام می دهند. هدف این سیستم دفاع در برابر پهپادهای ارزان قیمت بدون اتکا به جت های جنگنده و موشک های گران قیمت است. لتونی، عضو ناتو، در حال ساخت دیواری از پدافند خودکار ضد هواپیماهای بدون سرنشین در امتداد مرز خود با روسیه است که سربازان انسانی تنها مسئول تصمیم گیری در مورد زمان و یا شلیک هستند. راویس ملنیس، وزیر دفاع، به Business Insider گفت که هدف آن شناسایی و خنثی کردن «هر هواپیمای بدون سرنشینی است که به داخل پرواز می کند». و او توضیح داد که هدف \"ساخت یک سیستم خودمختار\" است که از فناوری برای \"کاهش تعداد سربازان\" مورد نیاز \"برای کار با این سیستم ها\" استفاده کند. وی گفت: «تنها چیزی که برای سرباز باقی می ماند، تصمیم نهایی برای خنثی سازی است. در غیر این صورت، شناسایی، ردیابی و پرتاب، خود مختار است. تصمیم لتونی در حالی اتخاذ می‌شود که اتوماسیون در تسلیحات و فناوری‌های دفاعی، از جمله در اوکراین، که در آن فن‌آوری پیشرفت کرده است تا هوش مصنوعی و بینایی رایانه‌ای را برای یافتن اهداف، پرواز پهپادها و رانندگی ربات‌ها حتی زمانی که ارتباط با اپراتور قطع شده است، پیشرفت کرده است. لتونی خواهان این نوع خودمختاری در سراسر شبکه جدید رادارها، حسگرها، سیستم‌های فرماندهی و کنترل و پهپادهای رهگیر است. یک پهپاد رهگیر خودمختار BLAZE لتونی در یک پایگاه هوایی در لتونی. گینتس ایووسکانز / خبرگزاری فرانسه از طریق گتی ایماژ، لتونی به عنوان یک کشور همسایه،"}, {"source": "Business Insider", "title": "Netflix might need to buy its way out of its biggest problem. And it won't come cheap.", "link": "https://www.businessinsider.com/netflix-layoffs-stock-decline-engagement-podcasts-sports-world-cup-strategy-2026-10", "summary": "In this photo illustration, the Netflix logo appears on a cell phone with a streaming site catalog page in the background in Creteil, France, on December 10, 2025. (Photo by Samuel Boivin/NurPhoto via Getty Images) Samuel Boivin/NurPhoto via Getty Images This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . The king of streaming is shrinking parts of its kingdom. Netflix is cutting roughly 1,000 employees , or about 6% of its staff, in the streamer's largest round of layoffs since 2022. Product, tech, and HR teams are among the areas being hit. It comes amid a dark stretch for Netflix's stock, which is down almost 42% over the past year and nearly 25% in 2026. BI's Jame Faris broke down five key reasons why Netflix has been having such a tough time . But the layoffs didn't immediately ease investors' concerns. Netflix's stock price barely moved, finishing the day up 0.16%. BI's Peter Kafka does a good job of explaining why Netflix's problems won't be solved by job cuts . Netflix reports earnings on Tuesday, but the streamer's pain point isn't a secret: engagement. With roughly 325 million paid subscribers, Netflix's reach is still massive. But investors have been dogging Netflix about how long all those people are engaging with its shows. Things came to a head this summer during Netflix's second-quarter earnings . Following lukewarm results, Netflix said it wasn't going to release audience numbers as often. Holding back information from investors isn't typically a great sign. But there's an argument that focusing on the performance of Netflix's new, shiny shows is missing the point. The streamer's success often comes from older shows' massive tails . That still doesn't address the biggest risk to Netflix and other streamers. From TikTok and Instagram to YouTube and free TV, people have a lot of options. Netflix's job cuts don't mean spending cuts. One of the biggest areas they've leaned into this year is video podcasts , negotiating a deal with Spotify for popular shows like \"The Bill Simmons Podcast\" and \"The Rewatchables.\" Podcast listeners are a loyal audience, returning regularly to consume shows. Bonus points if you can pull them away from a rival like YouTube, where these shows often live. (Granted, it's still early days, so there's no concrete proof this is happening just yet.) You know who else stays engaged? Sports fans. That's also a space Netflix has aggressively pu", "date_str": "2026-10-15T11:12:23+00:00", "hash": "2b988d1a2a4f937e", "title_fa": "نتفلیکس ممکن است نیاز داشته باشد راه خود را از بزرگترین مشکل خود بخرد. و ارزان نخواهد شد.", "summary_fa": "در این تصویر، لوگوی نتفلیکس روی یک تلفن همراه با صفحه کاتالوگ سایت پخش جریانی در پس‌زمینه در کرتیل، فرانسه، در 10 دسامبر 2025 ظاهر می‌شود. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. پادشاه استریم بخش هایی از پادشاهی خود را کوچک می کند. نتفلیکس در بزرگترین دور اخراج از سال 2022 تقریباً 1000 کارمند یا حدود 6 درصد از کارکنان خود را اخراج می کند. تیم های محصول، فناوری و منابع انسانی از جمله مواردی هستند که آسیب دیده اند. این در شرایطی است که سهام نتفلیکس تقریباً 42 درصد کاهش یافته است و در سال 2026 تقریباً 25 درصد کاهش یافته است. جیم فارس از BI به پنج دلیل اصلی برای گذراندن روزهای سخت نتفلیکس اشاره کرد. اما این اخراج بلافاصله نگرانی سرمایه گذاران را کاهش نداد. قیمت سهام نتفلیکس به سختی حرکت کرد و روز را 0.16 درصد افزایش داد. پیتر کافکا از BI به خوبی توضیح می دهد که چرا مشکلات نتفلیکس با کاهش مشاغل حل نمی شود. نتفلیکس درآمد خود را در روز سه‌شنبه گزارش می‌دهد، اما نقطه درد استریمر پنهان نیست: تعامل. با تقریباً 325 میلیون مشترک پولی، دسترسی نتفلیکس همچنان گسترده است. اما سرمایه‌گذاران نتفلیکس را در مورد مدت زمانی که این همه مردم با نمایش‌های آن درگیر هستند، بررسی می‌کنند. همه چیز در تابستان امسال در جریان درآمدهای سه ماهه دوم نتفلیکس به اوج رسید. نتفلیکس پس از نتایج ضعیف اعلام کرد که تعداد مخاطبان خود را به دفعات منتشر نخواهد کرد. نگه داشتن اطلاعات از سرمایه گذاران معمولاً نشانه خوبی نیست. اما بحثی وجود دارد مبنی بر اینکه تمرکز بر عملکرد نمایش های جدید و درخشان نتفلیکس، اصل مطلب را از دست داده است. موفقیت پخش کننده اغلب از دم های عظیم نمایش های قدیمی ناشی می شود. این هنوز بزرگترین خطر را برای نتفلیکس و"}, {"source": "Business Insider", "title": "I toured Delta's bougie new business-class cabin. Here are the 7 best upgrades — and one thing missing.", "link": "https://www.businessinsider.com/delta-one-new-business-class-best-upgrades-2026-10", "summary": "I am excited to see Delta s next-generation business-class fly in early 2027. Taylor Rains/Business Insider Delta Air Lines unveiled a new business-class seat designed for its Airbus A350-1000s. The seats have privacy doors, longer beds, and plentiful storage. The inflight menu has also been overhauled in partnership with a Michelin-starred chef. Business class is booming as travelers increasingly splurge on premium travel — and Delta Air Lines just unveiled its fanciest seat yet. At a New York City event on Tuesday, the airline showed off its next-generation Delta One suite planned for its future Airbus A350-1000s. It will be Delta's biggest plane flying — stretching longer and wider than its current Airbus A330s and future Boeing 787s — so the team had a lot of cabin real estate to work with. Ekrem Dimbiloglu, Delta's managing director of fleet and uniform experience, told media during the tour that customers care most about sleep and privacy, so Delta stretched the bed to 6 feet 9 inches long, which he said is enough to fit \"99.999% of Americans.\" The seats also angle toward the window rather than being forward-facing, adding more privacy, and feature new and improved perks like a dedicated laptop holder and an overhauled food and drink menu. Here's a closer look at some of the best upgrades coming to the bougie new Delta One suite. The new suite will debut on A350-1000s in early 2027. A handful of airlines have ordered the A350-1000, the larger sister of the A350-900 that Delta already flies. Nicolas Economou/NurPhoto via Getty Images The new seat, which took two years to design and is part of Delta's larger $1 billion fleet investment, will first fly transoceanic routes from Los Angeles in early 2027. Delta has 20 firm orders for the A350-1000. Delta is also adding upgraded door-equipped Delta One suites to A330 planes. Among the biggest upgrades are privacy and the bed. The linens and amenity kits are custom-made by the Italian company Missoni. Taylor Rains/Business Insider Dimbiloglu said the 81-inch bed is three inches longer than before, and that about one in 44,000 men are taller than that — meaning virtually all Delta One flyers can fit. It also angles in toward the window as a reverse herringbone design, providing additional privacy beyond the sliding door. The beds come with linens and amenity kits made by the Italian company Missoni. The new Delta One still boasts fan-favorite doors. The suite was on display on the 72nd floor of Summit Vander", "date_str": "2026-10-15T10:38:01+00:00", "hash": "c6ffccc122ccf31b", "title_fa": "من از کابین کلاس تجاری جدید دلتا بازدید کردم. در اینجا 7 بهترین ارتقا وجود دارد - و یک چیز کم است.", "summary_fa": "من از دیدن پرواز نسل بعدی کلاس تجاری دلتا در اوایل سال 2027 هیجان زده هستم. Taylor Rains/Business Insider دلتا ایر لاین از صندلی کلاس تجاری جدیدی که برای Airbus A350-1000s طراحی شده است، پرده برداری کرد. صندلی ها دارای درهای خصوصی، تخت های طولانی تر و انباری فراوان هستند. منوی پرواز نیز با همکاری یک سرآشپز ستاره دار میشلین بازنگری شده است. کلاس کسب و کار در حال رونق است زیرا مسافران به طور فزاینده ای در سفرهای ممتاز پرهیز می کنند - و خطوط هوایی دلتا به تازگی از شیک ترین صندلی خود رونمایی کرده است. در رویدادی در شهر نیویورک در روز سه‌شنبه، این شرکت هواپیمایی نسل بعدی مجموعه دلتا وان خود را که برای ایرباس A350-1000 آینده خود برنامه‌ریزی کرده بود، به نمایش گذاشت. این بزرگترین هواپیمای دلتا خواهد بود که پرواز می‌کند - طولانی‌تر و عریض‌تر از ایرباس A330 فعلی و بوئینگ 787 آینده آن - بنابراین تیم املاک و مستغلات کابین زیادی برای کار داشت. اکرم دیمبیلوغلو، مدیر عامل ناوگان و تجربه یونیفرم دلتا، در طول این تور به رسانه ها گفت که مشتریان بیش از همه به خواب و حریم خصوصی اهمیت می دهند، بنابراین دلتا تخت را تا 6 فوت و 9 اینچ دراز کرد که به گفته او برای «99.999 درصد آمریکایی ها» کافی است. صندلی‌ها نیز به جای رو به جلو، به سمت پنجره زاویه دارند و حریم خصوصی بیشتری را اضافه می‌کنند و ویژگی‌های جدید و بهبود یافته‌ای مانند جای لپ‌تاپ اختصاصی و منوی غذا و نوشیدنی بازسازی‌شده را دارند. در اینجا نگاهی دقیق‌تر به برخی از بهترین ارتقاهایی که در مجموعه جدید بوگی دلتا وان ارائه می‌شود، می‌بینیم. مجموعه جدید در اوایل سال 2027 روی A350-1000 عرضه خواهد شد. تعداد انگشت شماری از خطوط هوایی A350-1000 را سفارش داده اند، خواهر بزرگتر A350-900 که دلتا در حال حاضر"}, {"source": "Business Insider", "title": "Elon Musk says SpaceX will pay back anyone whose Grok AI agent makes a rogue purchase", "link": "https://www.businessinsider.com/elon-musk-spacex-will-pay-users-back-grok-purchase-mistakes-2026-10", "summary": "SpaceX will make you whole if your AI agent makes unauthorized purchases, Musk said on X. Win McNamee/Getty Images Elon Musk says SpaceX \"will make you whole\" if your Grok AI agent makes unauthorized purchases. Musk's comment, though light on detail, is a departure from the standard approach to agent mistakes. Grok, Meta, and OpenAI's terms of service generally place responsibility for agent actions on users. Elon Musk said that SpaceX will pay users back if Grok’s AI agent makes a mistake while completing a purchase or leaks their card information. In a Thursday X post, Musk said the company \"will make you whole\" if Grok makes a financial mistake. He made the comment in response to an X user praising Grok for booking them a flight after being sent a photograph of their credit card. The user described the airline’s website as confusing and said Grok completed the transaction and delivered a booking confirmation. This works well. If Grok @Bot makes a mistake with a purchase or leaks your card (never happened yet), SpaceX will make you whole. https://t.co/JZDQm3a95r — Elon Musk (@elonmusk) October 15, 2026 \"This works well,\" Musk wrote. \"If Grok Bot makes a mistake with a purchase or leaks your card (never happened yet), SpaceX will make you whole.\" Grok, Meta, and OpenAI all take a broadly similar approach in their published terms for agents: users are responsible for the actions and transactions their AI agents carry out on their behalf. Meta says Muse requires approval before purchases, while Grok’s terms include interactions with financial institutions, but none offers the kind of explicit reimbursement pledge Musk described. Musk did not set out the scope of the apparent guarantee, including whether it would cover unauthorized purchases, incorrect bookings, fraud by third-party merchants, or consequential losses such as missed travel. SpaceX did not immediately respond to a request for comment on Musk's assertion. The risks are already emerging as agents gain access to payment methods and online accounts. In a recent example involving Grok, Shane Mac, the CEO of software company XMTP Labs, told Business Insider's Aditi Bharade that a personal-finance agent he created posted his bank balances and spending details in his company’s executive Slack channel after confusing two similarly named chats. Grok’s team later changed its permission controls, according to Mac. Similarly, one user of the AI agent Instinct said it ordered 20 pounds of chicken wings duri", "date_str": "2026-10-15T10:33:19+00:00", "hash": "e28fc863e48f4ab5", "title_fa": "ایلان ماسک می گوید که اسپیس ایکس به هر کسی که عامل هوش مصنوعی Grok او خریدی سرکش انجام دهد، پول پرداخت می کند", "summary_fa": "ماسک در ایکس گفت که اگر نماینده هوش مصنوعی شما خریدهای غیرمجاز انجام دهد، اسپیس ایکس شما را کامل می کند. Win McNamee/Getty Images ایلان ماسک می گوید اگر نماینده هوش مصنوعی Grok شما خریدهای غیرمجاز انجام دهد، اسپیس ایکس شما را کامل می کند. اظهار نظر ماسک، اگرچه در جزئیات کم است، اما انحراف از رویکرد استاندارد در مورد اشتباهات نماینده است. شرایط خدمات Grok، Meta و OpenAI به طور کلی مسئولیت اقدامات نماینده را بر عهده کاربران می‌گذارد. ایلان ماسک گفت که اگر عامل هوش مصنوعی Grok هنگام تکمیل خرید اشتباه کند یا اطلاعات کارت آنها را فاش کند اسپیس ایکس به کاربران بازپرداخت خواهد کرد. در پست پنجشنبه X، ماسک گفت که اگر گروک اشتباه مالی کند، شرکت \"شما را کامل می کند\". او این نظر را در پاسخ به یکی از کاربران X که گروک را برای رزرو پرواز پس از ارسال عکس کارت اعتباری‌شان تحسین می‌کرد، بیان کرد. کاربر وب سایت شرکت هواپیمایی را گیج کننده توصیف کرد و گفت که Grok تراکنش را تکمیل کرد و تأییدیه رزرو را تحویل داد. این به خوبی کار می کند. اگر Grok @Bot با خرید اشتباه کند یا کارت شما را فاش کند (هنوز اتفاق نیفتاده است)، SpaceX شما را کامل خواهد کرد. https://t.co/JZDQm3a95r — ایلان ماسک (@elonmusk) 15 اکتبر 2026، ماسک نوشت: \"این کار خوب است.\" اگر Grok Bot با خرید اشتباه کند یا کارت شما را فاش کند (هنوز اتفاق نیفتاده است)، SpaceX شما را کامل خواهد کرد. Grok، Meta، و OpenAI همگی رویکرد مشابهی را در شرایط منتشر شده خود برای نمایندگان اتخاذ می کنند: کاربران مسئول اقدامات و تراکنش هایی هستند که نمایندگان هوش مصنوعی آنها از طرف آنها انجام می دهند. متا می‌گوید Muse قبل از خرید نیاز به تأیید دارد، در حالی که شرایط Grok شامل تعامل با مؤسسات مالی است،"}, {"source": "Business Insider", "title": "I thought I would hate group tours. I've learned they make traveling with kids easier, less stressful, and more fun.", "link": "https://www.businessinsider.com/family-group-tours-with-kids-easier-travel-2026-10", "summary": "The author said she enjoyed planning solo travel, but adding kids to the equation made that more complicated. Now, she uses group tours to help her plan amazing family trips. Courtesy of Jamie Davis Smith. I travel more than most and love planning trips. Having kids changed that process for me. Much to my surprise, group tours are now one of my favorite ways to travel with my children. Tours offer stress-free itineraries and local insights that we would have likely missed otherwise. I started traveling around the world on my own in my early 20s. There was nothing I enjoyed more than hopping on a plane with nothing but my Lonely Planet guidebook and the vaguest outline of a plan. Once I had kids , I realized I needed to plan much more. I still took a DIY approach, because it didn't occur to me to travel any other way. It was a lot of fun, but a lot of work. And if something went wrong, I had to figure out a Plan B on my own. As life got busier and I had less time, arranging travel started to seem like a chore. I didn't want to stop showing my kids the world, but I needed an assist. A few times, I consulted with a travel agent. Although agents were helpful, explaining what I wanted and going back and forth was nearly as much work as planning the trip myself. A family tour simplified travel Then, a few years ago, I decided to try a different approach and booked a small-group family tour to Morocco . I wondered whether I would miss the spontaneity of traveling by myself and whether I would get along with the strangers on the trip. The author (right) said that her family has enjoyed connecting with others while on group tours. Courtesy of Jamie Davis Smith. However, I appreciated the simplicity of a set itinerary that still included plenty of free time. Even if the tour wasn't exactly what I would have chosen, it was a relief to have a set plan and a local guide to handle all the logistics. Plus, I liked that my kids would have other kids to play with during the trip. I fell in love with group family tours Almost as soon as the tour started, my worries eased. That first tour with Intrepid Travel several years ago was so easy and so much fun that I have since taken four more. After Morocco, my family went on tours to India, Japan, Jordan, and most recently, Peru. Our trip to Peru was everything I hoped for. I had a stress-free way to shepherd my kids to Machu Picchu and got plenty of insider tips. We also participated in activities I likely would not have found ", "date_str": "2026-10-15T10:08:01+00:00", "hash": "e1385ae33fe62fb6", "title_fa": "فکر می کردم از تورهای گروهی متنفرم. من آموخته ام که آنها سفر با بچه ها را آسان تر، کم استرس تر و سرگرم کننده تر می کنند.", "summary_fa": "نویسنده گفت که از برنامه ریزی سفر انفرادی لذت می برد، اما اضافه کردن بچه ها به معادله این موضوع را پیچیده تر کرد. اکنون او از تورهای گروهی برای کمک به برنامه ریزی سفرهای خانوادگی شگفت انگیز استفاده می کند. با حسن نیت از جیمی دیویس اسمیت. من بیشتر از بقیه سفر می کنم و عاشق برنامه ریزی برای سفر هستم. بچه دار شدن این روند را برای من تغییر داد. با کمال تعجب، تورهای گروهی اکنون یکی از راه های مورد علاقه من برای سفر با فرزندانم است. تورها برنامه های سفر بدون استرس و بینش های محلی را ارائه می دهند که در غیر این صورت احتمالاً از دست می دادیم. من در اوایل دهه 20 سالگی خودم سفر به دور دنیا را به تنهایی شروع کردم. از هیچ چیز بیشتر از پریدن در هواپیما با هیچ چیز لذت نمی بردم جز کتاب راهنمای Lonely Planet و مبهم ترین طرح کلی یک برنامه. وقتی بچه دار شدم، متوجه شدم که باید خیلی بیشتر برنامه ریزی کنم. من هنوز یک رویکرد DIY را در پیش گرفتم، زیرا به ذهنم نمی رسید که به راه دیگری سفر کنم. خیلی سرگرم کننده بود، اما کار زیاد بود. و اگر مشکلی پیش می‌آمد، باید به تنهایی یک پلان B را پیدا می‌کردم. از آنجایی که زندگی شلوغ تر شد و زمان کمتری داشتم، ترتیب دادن سفر مثل یک کار طاقت فرسا به نظر می رسید. نمی‌خواستم دنیا را به بچه‌هایم نشان دهم، اما به کمک نیاز داشتم. چند بار با یک آژانس مسافرتی مشورت کردم. اگرچه عوامل کمک کننده بودند، اما توضیح دادن آنچه می‌خواستم و رفت و آمدم تقریباً به اندازه برنامه‌ریزی سفر بود. یک تور خانوادگی سفر را ساده کرد سپس، چند سال پیش، تصمیم گرفتم رویکرد متفاوتی را امتحان کنم و یک تور خانوادگی گروهی کوچک به مراکش"}, {"source": "Business Insider", "title": "Inside the race to train robots on human work", "link": "https://www.businessinsider.com/ai-companies-human-workers-robot-training-data-2026-10", "summary": "Tyler Le/BI One Friday evening this summer, a private chef prepared a three-course meal — burrata salad, baked salmon, and tiramisu — for two friends and me. The dinner was free, but there was a catch. A camera mounted on Chef Aliser Demir's baseball cap was recording everything. Demir came to my apartment through Shift, the data-collection arm of the German startup Microagi . The startup offers free private chefs in San Francisco in exchange for first-person footage of their work. Shift offered to pay Demir, who runs a private chef business, his usual rate of $100 to $150 per person. \"I've been feeding people since I started this job,\" Demir said. \"Now I am also feeding AI.\" This story is part of a series called The AI Data Grab , an inside look at how tech giants are increasingly turning to workers, users, and the physical world to get data to train AI. Read more stories in this series here . Demir is part of a global effort to collect data on how humans interact with the physical world, with the goal of building machines that can staff factories, clean homes, and even fight wars . Elon Musk, who is betting Tesla's future on the humanoid robot Optimus , has promoted a utopian future of \"sustainable abundance,\" in which AI and robots make human labor largely optional. Shift pays more than 35,000 people to record physical tasks, from cooking meals to repairing engines. Courtesy of Shift For now, those ambitions face a problem: a massive shortage of training data. \"It is widely agreed in the robotics world that data is the key bottleneck,\" said Kyle Chan, a fellow at the Brookings Institution who studies technology and industrial policy. This is the third installment of the AI Data Grab , Business Insider's series on how human work is becoming raw material for AI — and the companies that are cashing in. So far, we've reported on how AI labs are buying up employees' emails and Slack messages , and how law firms are turning decades of human expertise into AI systems. Now, the scramble is moving into the physical world, where companies are paying people to record skills robots have yet to learn. Shift collects data in more than 15 countries to capture a broad range of tasks and environments. Courtesy of Shift Contract workers in Mexico and the Philippines remotely control robots in American warehouses as they pack beauty products, recording movements so the machines can eventually do the work on their own. Other workers across the world strap cameras to their ", "date_str": "2026-10-15T10:00:01+00:00", "hash": "b9654192861a6a15", "title_fa": "در داخل مسابقه برای آموزش ربات ها در مورد کار انسان", "summary_fa": "Tyler Le/BI در یک عصر جمعه تابستان امسال، یک سرآشپز خصوصی یک وعده غذایی سه وعده - سالاد مردانا، ماهی آزاد پخته شده و تیرامیسو - برای من و دو دوست آماده کرد. شام رایگان بود، اما یک مورد هم وجود داشت. دوربینی که روی کلاه بیسبال سرآشپز علیسر دمیر نصب شده بود همه چیز را ضبط می کرد. دمیر از طریق Shift، بازوی جمع آوری اطلاعات استارت آپ آلمانی Microagi به آپارتمان من آمد. این استارت آپ به سرآشپزهای خصوصی رایگان در سانفرانسیسکو در ازای فیلم اول شخص از کارشان ارائه می دهد. شیفت پیشنهاد داد که به دمیر، که یک تجارت خصوصی سرآشپز را اداره می کند، نرخ معمول او 100 تا 150 دلار برای هر نفر بپردازد. دمیر گفت: از زمانی که این کار را شروع کردم به مردم غذا می دادم. اکنون من به هوش مصنوعی نیز تغذیه می کنم. این داستان بخشی از مجموعه‌ای به نام AI Data Grab است که نگاهی درونی به این دارد که چگونه غول‌های فناوری به طور فزاینده‌ای به کارگران، کاربران و دنیای فیزیکی روی می‌آورند تا داده‌هایی را برای آموزش هوش مصنوعی به دست آورند. داستان های بیشتر این مجموعه را اینجا بخوانید. دمیر بخشی از تلاش جهانی برای جمع‌آوری داده‌ها در مورد نحوه تعامل انسان با دنیای فیزیکی است، با هدف ساخت ماشین‌هایی که می‌توانند کارخانه‌ها، خانه‌ها را تمیز کنند و حتی در جنگ‌ها بجنگند. ایلان ماسک که آینده تسلا را بر روی ربات انسان‌نما Optimus شرط می‌بندد، آینده‌ای آرمان‌شهری از «فراوانی پایدار» را تبلیغ کرده است که در آن هوش مصنوعی و روبات‌ها کار انسانی را تا حد زیادی اختیاری می‌کنند. Shift به بیش از 35000 نفر برای ثبت کارهای فیزیکی، از پخت و پز تا تعمیر موتور، پول پرداخت می کند. در حال حاضر، این جاه طلبی ها با یک مشکل روبرو هستند: کمبود گسترده داده"}, {"source": "Business Insider", "title": "Wall Street’s biggest obsessions are showing up in inflation", "link": "https://www.businessinsider.com/oil-prices-ai-boom-us-inflation-fed-gasoline-computers-consumers-2026-10", "summary": "Qiu Haiying/VCG via Getty Images Oil's price shock and the AI buildout are pushing up gas and computer prices. The Fed can't pump oil or build chips, but it may still have to slow the rest of the economy. Sign up for First Trade , Business Insider's daily markets newsletter. The stock market has spent much of 2026 being pushed around by two enormous forces: the Iran-war energy shock and the global AI buildout . Wednesday's inflation report suggests the broader economy is being pulled along by those same drivers — to the detriment of the everyday consumer. The headline was a hotter-than-expected CPI reading . And the surprise wasn't just energy. Both headline and core CPI beat forecasts. That double upside surprise makes it harder to write the report off as simply another bad month at the gas pump. Speaking of which, gasoline was once again a clear pain point, jumping 9.1% from August to September and accounting for more than half of the index's overall increase. Then, buried further down the CPI table was an outsized 9.7% year-over-year spike in computers, peripherals, and smart-home assistants — the category most closely linked to the AI buildout. Put those together and you get a pretty good snapshot of the US economy in 2026: The price of getting around is dictated by geopolitics, while the price of plugging in is increasingly being shaped by the AI arms race. It's not just the market that's narrow Investors have had to care about a relatively short list of things this year: oil, the handful of companies spending fortunes on data centers, and the exclusive club of firms supplying the chips, power, and equipment. This week's CPI report is a good reminder that those forces don't just stay in the stock market. Gasoline is the immediate problem . It's visible, politically charged, and can work its way into the cost of flying, shipping, manufacturing, and eventually plenty of other things. Energy costs were up more than 20% year-over-year last month. AI-linked consumer tech is a different kind of warning. It's not large enough to move the inflation needle on its own, and smartphones are actually getting cheaper. But computers are getting more expensive, challenging one of tech's classic consumer promises: that the gadgets of tomorrow will be better — and cheaper — than the ones we have today. That's what makes the recent shift so striking. For most of the time since BLS began tracking the category in 2005, computer products were deflationary. Blame the global", "date_str": "2026-10-15T09:50:01+00:00", "hash": "8a78c88f133e772f", "title_fa": "بزرگترین وسواس های وال استریت در تورم خود را نشان می دهد", "summary_fa": "Qiu Haiying/VCG از طریق Getty Images شوک قیمت نفت و ساخت AI باعث افزایش قیمت گاز و کامپیوتر شده است. فدرال رزرو نمی تواند نفت پمپ کند  of big bank earnings, and Wall Street had a new threat on its mind: rogue AI . Executives at the country's largest financial institutions used their earnings calls to assure investors that they are doing everything in their power to fend off attacks from powerful, rogue AI models. Some were specific about the measures they were taking, like Bank of America's CEO , Brian Moynihan. Moynihan said during a Wednesday earnings call and an interview with CNBC that the bank had rushed to shore up vulnerabilities in its codebases after the release of powerful AI models such as Anthropic's Mythos. The firm hired 1,000 external consultants to patch these issues over the last quarter, and their work is still continuing. Citigroup CEO Jane Fraser shared similar sentiments on AI safety during the company's third-quarter earnings call on Tuesday. \"We don't wait for risks to happen,\" she said, adding, \"We've been hardening our systems and running challenging and disruptive scenarios to stress test our defenses and our responses.\" Later in the call, she said that Citigroup was continuing to \"invest in leading-edge capabilities\" to strengthen its cyber defenses. Morgan Stanley CEO Ted Pick said in a Wednesday call that the firm is investing \"whatever it takes\" to protect its clients' assets, because \"you can't engage head-to-head with AI out of your garage.\" Goldman Sachs CEO David Solomon said the bank sees concerns about the \"unchecked advancement of frontier models\" and that AI presents significant risks alongside opportunities. \"We must enable innovation and also demand responsibility,\" Solomon added in the Tuesday call. And finally, JPMorgan CEO Jamie Dimon said in a Tuesday call that he wouldn't allow \"just any outside agent to come inside the company, because that's just too risky for clients and for JPMorgan.\" Rogue AI agents are top of mind The comments from the finance executives come as rogue AI agents by labs like OpenAI, Anthropic, Google, and Meta, capa .businessinsider.com/kpmg-survey-ceos-ai-agents-hiring-2026-10", "summary": "Tim Walsh, CEO and chair of KPMG US, said companies often need to rethink how they operate to get the most from AI. Braedon Fox/PGA of America via Getty Images AI agents are delivering gains, though only 9% of CEOs called them \"transformational\" in a new KPMG US survey. Using AI effectively is \"not plug and play,\" Tim Walsh, the firm's US CEO, told Business Insider. Most leaders surveyed said they expect to increase hiring as AI changes the skills they need. Leaders of big US companies say AI agents are starting to produce gains, yet few report that the technology is fundamentally reshaping their businesses. KPMG US released a survey on Thursday of 400 CEOs of major US-based companies. About four in 10 said AI agents had delivered significant improvements in efficiency or growth, while a similar share reported moderate effects in targeted uses. Yet only 9% described agents, which are designed to carry out tasks, as \"transformational\" for their organizations today. Tim Walsh, CEO and chair of KPMG US, told Business Insider that there's a gap between using AI and the tricky work of overhauling how a company operates. \"It's not plug and play,\" he said. He said he expected the share of leaders reporting that agents are transforming their businesses to rise over the next six to 12 months. Most expect to increase head count Incorporating AI is also reshaping what companies need from workers . The survey signaled that CEOs don't see the technology simply as a tool for trimming payrolls. About nine out of 10 chiefs said they expected to increase head count over the next three years. That's a more upbeat hiring outlook than some leaders have offered in recent months. Various CEOs have said AI will allow them to get by with fewer workers , while others have said the technology will mean they'll need more people in areas like software engineering. The survey results highlighted the workforce c
