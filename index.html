<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <title>مجله خبری روزانه — ۳۰ آبان ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');

  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>

        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">

    <main id="newsContainer" class="news-grid"></main>

      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

  <script>

, "datetime_fa": "۲۹ آبان • ۱۵:۳۱"}, {"source": "BBC Persian", "title": "ده‌ها هزار یخچال در بریتانیا در عملیاتی محرمانه در برابر حمله سایبری ایمن شد", "link": "https://www.bbc.com/persian/articles/c6jreyzjw5jno?at_medium=RSS&at_campaign=rss", "summary": "بی‌بی‌سی دریافته که یک عملیات امنیت سایبری مخفیانه برای ایمن‌سازی ده‌ها هزار یخچال و فریزر فروشگاهی و سردخانه‌ای در بریتانیا در برابر حمله احتمالی هکرها انجام شده است.", "date_str": "2026-11-20T14:23:42+00:00", "hash": "dfd254f52c58a153", "title_fa": "ده‌ها هزار یخچال در بریتانیا در عملیاتی محرمانه در برابر حمله سایبری ایمن شد", "summary_fa": "بی‌بی‌سی دریافته که یک عملیات امنیت سایبری مخفیانه برای ایمن‌سازی ده‌ها هزار یخچال و فریزر فروشگاهی و سردخانه‌ای در بریتانیا در برابر حمله احتمالی هکرها انجام شده است. این عملیات پس از حمله سایبری در چند کشور اروپایی، برای ایمن‌سازی یخچال‌های سوپرمارکت‌ها، انبارها، رستوران‌ها، پمپ بنزین‌ها و استادیوم‌های بزرگ در بریتانیا صورت گرفته است. موج‌ اخیر حملات سایبری در اروپا موجب نابودی ده‌ها تن مواد غذایی در صدها فروشگاه شد و میلیون‌ها دلار خسارت به بار آورد. فرانسه ایران را مسئول حمله به سوپرمارکت‌های این کشور دانسته است؛ ادعایی که تهران آن را رد می‌کند. پس از هک یخچال‌ها در اروپا، گمان می‌رفت که بریتانیا به این دلیل تا حد زیادی از چنین حملات سایبری در امان مانده باشد که صنعت سرمایش این کشور از تجهیزاتی متفاوت با اروپا استفاده می‌کند. اما بررسی‌ها از وجود یک آسیب‌پذیری بالقوه در این زیرساخت‌ها حکایت داشت؛ حفره‌ای امنیتی که پیش از آنکه مورد سوءاستفاده هکرها قرار گیرد، به‌سرعت شناسایی و برطرف شد. در اواخر ماه اکتبر، پژوهشگران امنیت سایبری یک نقص جدی را شناسایی کردند که اگر پیشتر هکرها آن را کشف می‌کردند، می‌توانست خسارات گسترده‌ای به بریتانیا وارد کند. از آن زمان تاکنون، پژوهشگران امنیتی، تیم‌های فناوری اطلاعات و مرکز ملی امنیت سایبری بریتانیا بی‌وقفه مشغول کار بوده‌اند تا به ده‌ها شرکت درباره این آسیب‌پذیری هشدار بدهند و برای رفع آن اقدامات پیشگیرانه‌ای انجام داده‌اند. بی‌بی‌سی تا کنون درباره این عملیات گسترده و محرمانه گزارش نداده بود تا احتمال سوءاستفاده هکرها از این آسیب‌پذیری و ay morning, falling below $1.6 trillion, or roughly $1.1 trillion on an undiluted basis. Anthropic's IPO was hyped for months. It was then also landed with hopes of reviving the wider tech market after mounting concerns over the scale of AI investment and Nvidia's leadership crisis. However, it looks like even a record-breaking IPO hasn't assuaged those jitters. As of 8:30 a.m., S P 500 futures had dipped 1%, and Nasdaq 100 futures dropped nearly 2%. Read the original article on Business Insider", "date_str": "2026-11-20T13:55:44+00:00", "hash": "a1680409e7a06d06", "title_fa": "سهام آنتروپیک با افزایشی به زمین بازگشت و نزدیک به قیمت روز افتتاحیه خود کاهش یافت", "summary_fa": "داریو آمودی، مدیرعامل آنتروپیک روز پنجشنبه وارد نزدک می شود. آدام گری/بلومبرگ از طریق Getty Images سهام Anthropic با افزایشی در روز جمعه به زمین بازگشت. از ساعت 8:45 صبح به وقت شرقی، سهام در معاملات قبل از بازار حدود 12 درصد کاهش داشت. پس از جهش 17 درصدی در روز اول، سهام قرار است در 85 دلار در روز جمعه باز شود که فقط 2 دلار بالاتر از قیمت اول خود است. سهام آنتروپیک قرار است یک روز پس از عرضه اولیه عمومی پرفروش خود با کاهش شدیدی باز شود. از ساعت 8:45 صبح ET، سهام در معاملات قبل از بازار به 84.84 دلار رسید - تقریباً قیمت IPO آن 83 دلار را لمس کرد. نسبت به قیمت بسته شدن روز پنجشنبه 97.17 دلار تقریباً 12.5 درصد کاهش داشت. این امر بیش از 200 میلیارد دلار از ارزش گذاری آنتروپیک را از بین می برد. کریس بوچمپ، تحلیلگر ارشد بازار در IG، یک پلتفرم سرمایه‌گذاری و معاملات، می‌گوید: «در حالی که همه روی قیمتی که آنتروپیک برای سهام خود به دست آورد تمرکز کردند، مشکل بزرگ‌تر آشکار می‌شود. خودی‌ها می‌توانند 10 درصد از دارایی‌های خود را از روز اول بفروشند، موج بزرگی از سهام به بازار وارد می‌شود، و از شرکتی که هنوز ضرر می‌کند.» آنتروپیک درآمد سه ماهه سوم را 17 میلیارد دلار گزارش کرد اما ضرر خالص آن 23.3 میلیارد دلار بود. با این حال، سرمایه‌گذاران نسبت به پتانسیل انقلابی هوش مصنوعی خوش‌بین هستند. و به‌عنوان اولین آزمایشگاه هوش مصنوعی که عمومی شد، آنتروپیک به‌طور گسترده‌ای به‌عنوان ابزاری برای صنعت گسترده‌تر دیده می‌ one easy. Black Friday FAQs Are Black Friday deals worth it? In short, yes, Black Friday still offers discounts that can be rare throughout the rest of the year. If there s something you want to buy, or you re shopping for gifts, it s a good time to look for discounts on what you need", "date_str": "2026-11-20T14:30:00+00:00", "hash": "e0c46e4aabba1249", "title_fa": "Soundbar Sonos Arc Ultra قبل از جمعه سیاه 250 دلار تخفیف دارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. قیمت معامله و در دسترس بودن ممکن است پس از زمان انتشار تغییر کند. فروش جمعه سیاه آمازون در سال 2026، Sonos Arc Ultra را از 1099 دلار معمول خود به 849 دلار کاهش داد، یک تخفیف 250 دلاری که پایین ترین قیمت آن را تا کنون نشان می دهد. PCMag آن را بهترین نوار صوتی سال 2024 معرفی کرد و در بررسی خود امتیاز برجسته ای به آن داد. با این حال، 849 دلار برای صرف یک نوار صوتی بسیار زیاد است، و هرکسی که با بودجه کمتری خرید کند، گزینه های مقرون به صرفه تری را در مجموعه نوار صوتی Fire TV ما پیدا می کند. برای معاملات فنی بیشتر مورد تأیید سردبیر، پوشش جامع جمعه سیاه ما را بررسی کنید. Sonos Arc Ultra $849.00 در آمازون $1,099.00 صرفه جویی در $250.00 دریافت معامله دریافت معامله $849.00 در Amazon $1,099.00 پس انداز $250.00 برای کسانی که می توانند در بودجه خود جای خالی داشته باشند، چیز بعدی که باید برای آن برنامه ریزی کرد فضا است، زیرا Arc Ultra6 در حدود 3 برابر است. مطابقت طبیعی برای یک تلویزیون بزرگتر. علیرغم این همه عرض، ارتفاع آن کمتر از سه اینچ است، بنابراین می‌تواند زیر اکثر صفحه‌نمایش‌ها بدون مسدود کردن تصویر قرار بگیرد، یا اگر ترجیح می‌دهید پایه تلویزیون خود را شفاف نگه دارید، می‌توانید آن را به دیوار نصب کنید. تمام این اندازه فضا را برای طرح‌بندی 9.1.4 کانالی (گامی بزرگتر از Arc اصلی) ایجاد می‌کند که به جلوه‌های Dolby Atmos فضای بیشتری برای پخش در اطراف و بالای شما می‌دهد. Sonos همچنین یک درایور Sound Motion جدید اضافه کرده است که می‌گوید باس اصلی Arc را دو برابر می‌کند و به صحنه‌های اکشن وزن واقعی بدون ساب ووفر مجزا می‌دهد، اگرچه می‌توانید بعداً یک Sub 4", "image_url": "https://lif     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
