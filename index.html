2026-11-04T17:23:01+00:00", "hash": "cd0d0eda6481b5d1", "title_fa": "تینتو براس، کارگردان هیجان‌انگیز «کالیگولا» که می‌خواست نامش از فیلم حذف شود، در ۹۳ سالگی درگذشت.", "summary_fa": "فیلمساز در سال 2010 دچار خونریزی مغزی شده بود، تینتو براس، فیلمسازی که مشهورترین اثرش کالیگولای جنجالی بود، درگذشت. به گزارش ورایتی، خانواده وی روز چهارشنبه به رسانه های ایتالیایی درگذشت او را اعلام کردند. او 93 بود. اگرچه این کارگردان بیش از دوجین فیلم از جمله تعطیلات (1971) ساخت که برنده بهترین فیلم ایتالیایی در جشنواره فیلم ونیز در آن سال شد، او را بیشتر با کالیگولا به یاد می‌آورند، فیلمی که نیویورک تایمز آن را گران‌ترین فیلم پورنوگرافیک ساخته شده تاکنون می‌نامد. براس بیشتر فیلم درباره امپراتور فاسد روم را کارگردانی کرد که بازیگرانش مالکوم مک داول، هلن میرن و پیتر او تول بودند، اما یکی از تهیه کنندگان آن، بنیانگذار پنت هاوس، باب گوچیونه، و فیلمساز جیانکارلو لوی، در طول پس از تولید وارد صحنه شدند تا صحنه هایی از سکس هاردکور را به آن اضافه کنند. هم تینتو که در سینمای استثماری با فیلمی درباره فاحشه خانه نازی به نام سالون کیتی (1976) نامی برای خود دست و پا کرد و هم فیلمنامه نویس گور ویدال خواستار حذف نام خود شدند. هنگامی که او در 26 مارس 1933، جیووانی براس در میلان به دنیا آمد، خانواده برس در دنیای هنر به خوبی تثبیت شده بود. پدربزرگ او، ایتالیاکو براس، نقاش و دلال آثار هنری در ونیز بود و به برس تینتورتو جوان ملقب بود که اعضای خانواده بعداً آن را مخفف کردند. او قبل از ورود به سینما در سینماتک فرانسه، حقوق خواند و در آنجا به عنوان دستیار کارگردان فیلمساز هلندی یوریس ایونز کار کرد. او در سینما با کمک فدریکو فلینی و روبرتو روسلینی پیش از اولین کارگردانی خود با Chi Lavora è Perduto که برنده بهترین اثر اول جشنواره ونیز شد، به موفقیت رسید. چند سال بعد، فیلم او، من همان هستم که هستم، برنده شیر طلایی جشنواره شد.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Tinto-Brass-obit.jpg?crop=0px%2C0px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۳ آبان • ۲۰:۵۳"}, {"source": "Rolling Stone", "title": "Robin Finck Is Selling His Nine Inch Nails and GN’R Guitars", "link": "https://www.rollingstone.com/music/music-news/robin-finck-nine-inch-nails-guns-n-roses-guitars-1235651930/", "summary": "Musician selling guitar he played at Woodstock '94 and on Twin Peaks: The Return", "date_str": "2026-11-04T17:02:09+00:00", "hash": "348b71c3641066b4", "title_fa": "رابین فینک میخ های نه اینچی و گیتارهای GN'R خود را می فروشد", "summary_fa": "نوازنده فروش گیتار که در Woodstock 94 و در Twin Peaks نواخت: The Return Robin Finck، که چندین دهه گیتار را در Nine Inch Nails و Guns N Roses نواخته است، هفته آینده فروش برخی از این گیتارها را در Reverb آغاز خواهد کرد. فروشگاه رسمی Robin Finck Reverb درهای مجازی خود را برای تخلیه حدود 200 کالا در 11 نوامبر باز خواهد کرد. یکی از قابل توجه ترین اقلامی که او می فروشد گیتار گیتار Gibson Les Paul 60 Reissue Goldtop است که به او لقب طلای قدیمی داده است. فینک در سال 1994 به Nine Inch Nails پیوست و در اجرای به یاد ماندنی گروه در Woodstock 94، در موزیک ویدیوی گروه برای March of the Pigs و در تور Self Destruct، گیتار زد. او این ساز را در هر تور Nine Inch Nails که تا سال 2014 در آن شرکت می‌کرد می‌نواخت. فینک در بیانیه‌ای گفت، روزی که ما ویدیوی March of the Pigs را فیلمبرداری کردیم، آن نسخه از Nine Inch Nails هرگز نمایشی را در مقابل تماشاچیان اجرا نکرده بود. تمام دنیای من داشت کج می شد. این تنها گیتاری است که از سال 1994 دست نخورده ساخته شده است. نمی‌دانم چرا یا چگونه، زیرا این گیتاری است که بیش از هر گیتاری می‌نواختم. او همچنین یک Gibson Les Paul Custom 1990 سفید شفاف می فروشد که برای او ارزشی احساسی دارد. او گفت، این تنها گیتاری بود که وقتی در Nine Inch Nails فرود آمدم، داشتم. من بیش از 35 سال آن را بازی کردم. همیشه مورد پسند بوده است. به نظر می رسد که فینک ممکن است تمام این سازها را بفروشد تا در هر جایی که آنها را ذخیره می کند کمی فضای ذخیره کند. او گفت: من واقعاً از همه این قطعات استفاده کردم و از آنها لذت بردم، به طوری", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Robin-Finck_photo-by-Danny-Lohner.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۳ آبان • ۲۰:۳۲"}, {"source": "Hollywood Reporter", "title": "‘Beef’ Creator Lee Sung Jin Launches Production Company, Plans Ali Wong Limited Series", "link": "https://www.hollywoodreporter.com/tv/tv-news/lee-sung-jin-production-company-1236747638/", "summary": "Hyunji Ward will run Lee's Lila Pictures, which also has a Gene Hong drama series in development.", "date_str": "2026-11-04T18:00:00+00:00", "hash": "368297bfbf379d0a", "title_fa": "خالق «بیف»، لی سونگ جین، شرکت تولیدی را راه‌اندازی می‌کند، سری محدود علی ونگ را برنامه‌ریزی می‌کند.", "summary_fa": "هیونجی وارد، لیلا پیکچرز لی را اجرا خواهد کرد که یک سریال درام Gene Hong نیز در دست ساخت دارد. خالق بیف لی سونگ جین و نتفلیکس همچنان هیچ گوشت گاو ندارند. روز چهارشنبه، لی راه‌اندازی شرکت تولید جدیدش Lila Pictures را فاش کرد که برای تسهیل ساخت سریال‌های فیلم‌نامه‌نویسی و فیلم‌های داستانی تحت پیمان نتفلیکس لی تشکیل شده است. هیونجی وارد (دادیو)، که کار خود را در UTA آغاز کرد و چهار سال گذشته را در داکوتا جانسون TeaTime Pictures گذراند، معاون ارشد فیلم و تلویزیون لیلا خواهد بود. لیلا (تلفظ لی لاه) پیکچرز نام خود را از کلمه سانسکریت به معنای بازی الهی گرفته است. بنابراین بسیار هوشمندانه است. لی از این بنر برای خلق، تولید اجرایی، نویسندگی و کارگردانی سریال‌ها و فیلم‌ها استفاده خواهد کرد و در عین حال بر روی نسل بعدی صداهای خلاق سرمایه‌گذاری خواهد کرد. داستان‌های مرتبط فیلم‌ها کارگردان Street Fighter، کیتائو ساکورای، با استقبال از تلویزیون مضحک، حرفه‌ای ساخت. لی شخصاً هم برای نویسندگی و هم برای کارگردانی نامزد شد و اولین خالق آسیایی شد که چندین نامزدی امی را در بخش های نویسندگی، کارگردانی و تهیه کنندگی یک سریال کسب کرد. لی تا حدی گفت: \"من برای راه اندازی Lila Pictures با حمایت خانه خلاقم در نتفلیکس و کمک هیونجی وارد هیجان زده هستم. این تازه شروع کار است. کالاهایی نیز وجود خواهد داشت.\" لی اخیرا یک فیلم مردان ایکس با جوآنا کالو (خرس) برای مارول نوشته است. او همچنین تهیه کننده اجرایی فیلم Lurker ساخته الکس راسل است.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Lee-Sung-Jin-PC_-Sela-Shiloni-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس", "سرمایه‌گذاری"], "datetime_fa": "۱۳ آبان • ۲۱:۳۰"}, {"source": "Hollywood Reporter", "title": "Joel Kim Booster to Host Jackson Wild and Hollywood Climate Summit Media Awards", "link": "https://www.hollywoodreporter.com/lifestyle/lifestyle-news/joel-kim-booster-jackson-wild-hollywood-climate-summit-1236743824/", "summary": "The Nov. 10 event will honor nature and climate storytelling across film, TV, games and digital media.", "date_str": "2026-11-04T18:00:00+00:00", "hash": "cc6d761ec2c0a381", "title_fa": "جوئل کیم بوستر میزبان جوایز رسانه ای جکسون وایلد و اجلاس آب و هوای هالیوود خواهد بود", "summary_fa": "رویداد 10 نوامبر به داستان سرایی طبیعت و آب و هوا در سراسر فیلم، تلویزیون، بازی ها و رسانه های دیجیتال احترام می گذارد. جوئل کیم بوستر برای میزبانی اولین جوایز مشترک رسانه های جکسون وایلد و هالیوود در لس آنجلس روی صحنه خواهد رفت. این رویداد به داستان سرایی طبیعت و آب و هوا در سراسر فیلم، تلویزیون، بازی ها و رسانه های دیجیتال افتخار می کند و Nature Media Exchange، یک نشست دو روزه را که در 9 و 10 نوامبر در Solotech در L.A.A.A. متیو لارنس بازیگر به عنوان مجری مهمان حضور دارد، در حالی که جکسون وایلد جوایز میراث 2026 خود را به دو برگزیده اهدا می کند: لویی پسیهویوس مستندساز برنده اسکار (The Cove) و جولی پاکارد، یکی از بنیانگذاران آکواریوم مونتری بی. خبرهای مرتبط اخبار ال گور 20 سال پس از یک حقیقت ناخوشایند را منعکس می کند و توضیح می دهد که چرا در میان بحران آب و هوا هنوز امیدهای زیادی وجود دارد. کریستی کوئین، مدیر اجرایی جکسون وایلد، در بیانیه‌ای گفت: فیلم‌های او فقط چالش‌های پیش روی سیاره ما را مستند نمی‌کنند، بلکه مخاطبان را به سمت بازیگری سوق می‌دهند، و شیوه‌ای را که صنعت ما در مورد تأثیر فکر می‌کند، بازتعریف کرده‌اند. ما مفتخریم که میراث لویی را به رسمیت بشناسیم، و مسیری که او همچنان برای ما که معتقدیم داستان ها می توانند دنیا را تغییر دهند، ادامه می دهد.\" تعداد کمی از مردم بیشتر از جولی پاکارد برای ارتباط مردم با اقیانوس انجام داده‌اند.» کوین افزود: «دیدگاه او برای آکواریوم خلیج مونتری، آکواریوم را دوباره تعریف کرد: مکانی شگفت‌انگیز، مرکزی برای علم، و صدایی قدرتمند برای محافظت از جانداران دریایی.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/10/GettyImages-2263223062.jpg?crop=0px%2C420px%2C3631px%2C2031px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۳ آبان • ۲۱:۳۰"}, {"source": "Variety", "title": "‘Beef’ Creator Lee Sung Jin Sets Netflix Projects With Ali Wong, Gene Hong Under New Banner Lila Pictures", "link": "https://variety.com/2026/tv/news/beef-lee-sung-jin-netflix-shows-ali-wong-gene-hong-1236939410/", "summary": "Beef creator Lee Sung Jin has set up two new TV projects for development at Netflix under his newly launched production company. Lee has established Lila Pictures under his recently-renewed overall deal with the streamer. In addition, he has hired Hyunji Ward to serve as senior VP of Film Television for Lila Pictures. Ward [ ]", "date_str": "2026-11-04T18:00:00+00:00", "hash": "38a74d7e4276f2bc", "title_fa": "لی سونگ جین، خالق «بیف»، پروژه‌های نتفلیکس را با علی ونگ، جین هونگ زیر پرچم جدید لیلا پیکچرز تنظیم می‌کند.", "summary_fa": "لی سونگ جین، خالق بیف، دو پروژه تلویزیونی جدید را برای توسعه در نتفلیکس زیر نظر شرکت تولیدی تازه راه اندازی خود راه اندازی کرده است. لی لیلا پیکچرز را تحت قرارداد کلی خود که اخیراً با این استریمر تمدید شده تأسیس کرده است. علاوه بر این، او هیونجی وارد را برای خدمت به عنوان معاون ارشد تلویزیون فیلم برای لیلا پیکچرز استخدام کرده است. بخش [ ] اولین پروژه جدید درام محدود The Only Child است که در آن علی ونگ که با لی در فصل اول موفق Beef کار کرده است، بازی خواهد کرد. آوا وونگ دیویس نویسندگی را بر عهده خواهد داشت و وانگ علاوه بر بازیگری، تهیه کنندگی را نیز بر عهده خواهد داشت. وونگ در نقش مادر یک کماندار حرفه ای که برای اولین مدال طلای خود آماده می شود، بازی خواهد کرد. پروژه دیگر سریال درام دستگیری شهروند است که توسط Gene Hong که نویسنده و تهیه کننده فصل 2 بیف بود، ساخته شد. طبق لاگ لاین، سریال دو دوست و همسایه قدیمی را دنبال می کند که وسواسشان برای حل یک جنایت محلی تبدیل به فراری از بحران های خصوصی می شود که هیچ کدام آماده رویارویی با آنها نیستند. لی گفت: \"من از راه اندازی لیلا پیکچرز با حمایت خانه خلاقم در نتفلیکس و کمک هیونجی وارد، معاون جدید فیلم و تلویزیون، هیجان زده هستم. در سانسکریت، لیلا را می توان به عنوان \"بازی الهی\" تعبیر کرد و من سپاسگزارم که در کنار دوستان نزدیک و همکارانی مانند هو وانگ، آغازگر این است. بیف در ابتدا در سال 2023 شروع به کار کرد و ثابت کرد که یکی از مشهورترین نمایش های سال است. طبق گفته نتفلیکس، به مدت پنج هفته در بین 10 برتر جهانی قرار داشت و در 87 کشور به رتبه 10 برتر رسید. این سریال 13 نامزدی امی", "image_url": "https://variety.com/wp-content/uploads/2026/11/Lee-Sung-Jin-Netflix-Lila.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۱۳ آبان • ۲۱:۳۰"}, {"source": "Variety", "title": "Suno Seeks to Dismiss Jason Isbell Lawsuit, Argues There’s ‘Nothing Unlawful’ About Invoking Artist Names to Describe Genres", "link": "https://variety.com/2026/biz/news/suno-pushes-to-dismiss-jason-isbell-identity-lawsuit-1236939425/", "summary": "Suno pushed back aggressively in its first response Americana singer Jason Isbell s class-action lawsuit against the AI music generator, arguing his claims that the service allows users to produce tracks based on musicians’ identities amounted to “nothing unlawful” as it moved to dismiss the lawsuit. Isbell joined musicians David Lowery, Guy Forsyth and Eduardo Calle in [ ]", "date_str": "2026-11-04T17:44:55+00:00", "hash": "02ac0027cdb04044", "title_fa": "سونو به دنبال رد شکایت جیسون ایزبل است، استدلال می کند که \"هیچ چیز غیرقانونی\" در مورد استناد به نام هنرمندان برای توصیف ژانر وجود ندارد", "summary_fa": "سونو در اولین پاسخ خود، شکایت دسته جمعی جیسون ایزبل، خواننده آمریکایی، علیه تولیدکننده موسیقی هوش مصنوعی را به شدت عقب نشینی کرد، با این استدلال که ادعاهای او مبنی بر اینکه این سرویس به کاربران اجازه می دهد آهنگ هایی را بر اساس هویت نوازندگان تولید کنند، \"هیچ چیز غیرقانونی\" محسوب نمی شود، زیرا اقدام به رد شکایت کرد. ایزبل به نوازندگان دیوید لوری، گای فورسایت و ادواردو کال در [ ] پیوست، اما سونو در اولین پاسخ خود به این پرونده در روز سه‌شنبه، استدلال کرد که قوانین نمی‌توانند قوانین تبلیغاتی را به این شکل کنترل کنند و این انگیزه را با زمانی مقایسه کرد که نوازندگان از تولیدکنندگان انسانی‌شان آهنگ‌هایی برای تقلید از لحن هنرمند دیگری می‌خواهند. زمانی که مردم سبک‌های موسیقی را توصیف می‌کنند، اغلب از نام هنرمندان به‌عنوان خلاصه‌نویسی برای ژانری که در آن اجرا می‌کنند استفاده می‌کنند. گس افزود: \"شکایت در این مورد بر این فرض استوار است که قانون به نحوی آن رویه جهانی را محکوم می کند. \"گاس افزود: \"کنگره انتخاب خط مشی در نظر گرفته شده را مبنی بر عدم حمایت از مالکیت معنوی در مورد سبک هنری انجام داد، دقیقاً تا به سازندگان بعدی اجازه دهد آثار قبلی یک ژانر را بنا کنند.\" «نظریه این شکایت می‌تواند یک رژیم IP قانون سایه‌ای ایجاد کند که در راس آن قرار دارد و اساساً با رژیم فدرال که بیش از دو قرن است در تضاد است.» وکیل شاکیان به درخواست فوری برای اظهار نظر پاسخ نداد. پرونده گروه Isbell با دیگر تلاش‌های دعوی حقوقی علیه Suno تفاوت داشت، زیرا تمرکز آن بر مسائل حق نسخه‌برداری نبود، که باعث شکایت‌های متعدد علیه شرکت - و توافق‌نامه‌ها با آن‌ها شد، بلکه در عوض بر روی عنصر هویت، که شاکیان ادعا کردند معمولاً توسط یک موسیقی‌دان حفظ می‌شود، صرف‌نظر از قرارداد تسویه حساب یا اینکه", "image_url": "https://variety.com/wp-content/uploads/2026/01/GettyImages-2258006896.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۱۳ آبان • ۲۱:۱۴"}, {"source": "Variety", "title": "The American French Film Festival Screens the Best From Gaul for an Enthusiastic U.S. Crowd", "link": "https://variety.com/2026/film/focus/the-american-french-film-festival-1236939454/", "summary": "America’s friendship with France goes back 250 years — the country’s money, military and navy helped the U.S. win the Revolutionary War. And American and French  با فیلم‌های آسمان تاریک فرصتی باورنکردنی برای به اشتراک گذاشتن این کابوس سواری با طرفداران ترسناک در سراسر آمریکای شمالی است. گرگ نیومن، معاون اجرایی Dark Sky Films، در مورد قرارداد ایالات متحده با مایک چپمن، بازیگر Blue Finch مذاکره کرد.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/AMERICANDOLLHOUSE_16x9.png?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۳ آبان • ۲۰:۳۰"}, {"source": "Hollywood Reporter", "title": "Tinto Brass, Director of the X-Rated ‘Caligula,’ Dies at 93", "link": "https://www.hollywoodreporter.com/news/general-news/tinto-brass-dead-caligula-malcolm-mcdowell-1236747742/", "summary": "The Italian filmmaker clashed with screenwriter Gore Vidal during the making of the epic that starred Malcolm McDowell.", "date_str": "2026-11-04T16:38:42+00:00", "hash": "1ec3b8a6c985079d", "title_fa": "تینتو براس، کارگردان فیلم «کالیگولا» با رتبه ایکس در ۹۳ سالگی درگذشت", "summary_fa": "این فیلمساز ایتالیایی در حین ساخت حماسه ای که مالکوم مک داول در آن نقش آفرینی کرد، با گور ویدال فیلمنامه نویس درگیر شد. خانواده‌اش اعلام کردند که تینتو براس، کارگردان ایتالیایی که بیشتر برای کارگردانی فیلم حماسی امپراتوری روم با رتبه ایکس کالیگولا با بازی مالکوم مک‌داول شناخته می‌شود، چهارشنبه در رم درگذشت. او 93 بود. برس در دهه 1960 با فیلم‌های آوانگارد شروع به کار کرد و قبل از اینکه به سینمای اروتیک بپردازد، با ویژگی‌های دیگرش در این ژانر از جمله Salon Kitty (1976)، The Key (1983)، پاپریکا (1991)، همه خانم‌ها این کار را می‌کنند (1992)، لولا بی‌اهمیت (1998) و Cheeky (1990) مک داول در نقش امپراتور دچار آشفتگی جنسی در فیلم کالیگولا (1979) که توسط گور ویدال نوشته شده و توسط بنیانگذار مجله پنت هاوس باب گوچیونه تهیه شده است، بازی کرد. این فیلم با حضور هلن میرن، پیتر اوتول، جان گیلگود و عیاشی‌های فراوان، پس از اکران اولیه‌اش مورد انتقاد منتقدان و تماشاگران قرار گرفت. داستان‌های مرتبط اسکار 2027: فیلم‌های بین‌المللی در کانون اولیا کارگردان اولیا وارد سومین نامزد اسکار لتونیایی خود می‌شود که در آن بازیگری در حال ظهور به عنوان یک اسطوره بسکتبال زن بازی می‌کند و به یک فیلم پرفروش تبدیل شده است. و این ویژگی را انکار می کرد - کارگردان از تدوین ناراضی بود (پس از اخراج او انجام شد)، فیلمنامه نویس از اینکه براس چگونه فیلمنامه خود را بازنویسی کرد. با این حال، کالیگولا طی دهه‌ها طرفدارانی پیدا کرد و نسخه 178 دقیقه‌ای «برش نهایی» در سال 2023 در جشنواره کن به نمایش درآمد. جووانی براس در 26 مارس 1933 در میلان به دنیا آمد و در ونیز بزرگ شد. به روبرتو روسلینی و آلبرتو کاوالکانتی.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Tinto-Bras-Obit-Template-Headshot-Getty-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۳ آبان • ۲۰:۰۸"}, {"source": "Hollywood Reporter", "title": "NBCUniversal Invests in India Microdrama Producer in $80 Million Fundraising Round", "link": "https://www.hollywoodreporter.com/business/business-news/nbcuniversal-indian-microdrama-producer-1236747724/", "summary": "EloElo Group said it raised new equity funding, including from the Hollywood studio, to help its Story TV platform launch phone-focused mini-series internationally, including in the U.S. market.", "date_str": "2026-11-04T16:21:20+00:00", "hash": "a3b978c472dbdfbe", "title_fa": "سرمایه گذاری NBCUniversal در هند تهیه کننده میکرودرام در دور جمع آوری سرمایه 80 میلیون دلاری", "summary_fa": "گروه EloElo اعلام کرد که برای کمک به پلتفرم Story TV خود برای راه‌اندازی مینی‌سریال‌های متمرکز بر تلفن در سطح بین‌المللی، از جمله در بازار ایالات متحده، سرمایه جدیدی از جمله از استودیوی هالیوود جمع‌آوری کرده است. NBCUniversal و Hornbill Capital دور جمع‌آوری سرمایه 80 میلیون دلاری سری C را برای گروه EloElo تهیه‌کننده میکرودرام هندی، که توسط مدیر سابق Flipkart، Saurabh Pandey تأسیس شده، رهبری کرده‌اند. سرمایه جدید به اپراتور پلتفرم استوری تی وی اجازه می دهد تا درام های عمودی جدیدی را برای صادرات در سطح بین المللی از جمله به بازار ایالات متحده تولید کند. سرمایه‌گذاری سری C، که معمولاً برای اجازه دادن به استارت‌آپ‌ها انجام می‌شود، ب 4, this batch [ ]", "date_str": "2026-11-04T17:00:00+00:00", "hash": "c0aeddb62d63deb6", "title_fa": "مجموعه‌های Funko جدید «A Court of Thorns and Roses»، «Mist and Fury» اکران شد. \"ACOTAR\" IP برتر در بین مشتریان بار اول است (انحصاری)", "summary_fa": "همان چیزی است که طرفداران دادگاه خار و رز به دنبال آن بودند: موج بعدی Funko Pop! مجسمه‌هایی بر اساس مجموعه رمان‌های فانتزی بسیار محبوب سارا جی ماس، از جمله اولین شخصیت‌های Cassian، Azriel، Morrigan، و Amren. از امروز، 4 نوامبر، این دسته [ ] Per Funko، The Bitty POP در Target در فروشگاه ها و آنلاین موجود است! مجموعه Books A Court of Thorns and Roses شامل Bitty POP است! مانور تاون اسپرینگ کورت، بیتی پاپ! کلکسیون های Feyre - Solstice، Rhysand with Wings، Tamlin و Lucien. در حالی که بیتی POP! مجموعه Books A Court of Mist and Fury شامل Bitty POP است! قصر مون استون شهر، بیتی پاپ! کلکسیونی از Cassian، Azriel، Morrigan، و Amren. هر مجموعه همچنین در یک جعبه کلکسیونی با مضمون کتاب بسته بندی شده و شامل یک نشانک فیگولار به شکل پریتی است. راه‌اندازی جدید Funko پس از موفقیت عظیم برای اولین دور محصولات ACOTAR، که در ماه سپتامبر و پیش از انتشار کتاب ششم Maas در 27 اکتبر از این مجموعه، A Court of Splintered Harmony، در 27 اکتبر عرضه شد. همانطور که قبلا توسط Variety گزارش شده بود، این کتاب در 24 ساعت اول انتشار خود 1.7 میلیون نسخه فروخت. جاش سایمون، مدیر عامل Funko به Variety می‌گوید تا کنون ما واقعاً در مورد نتایج فروش کلی هیجان‌زده بوده‌ایم. از زمانی که در ابتدای سپتامبر راه اندازی شد، مجوز شماره یک در خریدهای اولیه مشتری در سایت DTC ما بوده است. بنابراین، اگر به دنیای محصولاتی که ما می‌فروشیم و مشتریان و طرفداران جدیدی به ارمغان می‌آورد نگاه کنید، محصول شماره یک که طرفداران جدیدی را به ارمغان می‌آورد از ACOTAR است. به گفته سایمون، از هر چهار مشتری که از خط ACOTAR Funko خرید می کنند، سه نفر زن هستند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Pop-Feyre-Under-the-Mountain-FWlifestyle1.jpeg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۳ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "Music Industry Moves: Jackson Wang Inks With WME; Position Music Signs Arkai to JV With Lindsey Stirling’s Label", "link": "https://variety.com/2026/music/news/jackson-wang-signs-with-wme-1236939377/", "summary": "Singer-songwriter Jackson Wang, currently starring in an Apple campaign tied to his new single and music video, “Thank You,” has signed with WME for representation. Wang’s 2019 debut album, “Mirrors,” became the first album by a solo Chinese artist to hit the Billboard Top 200 and over the years he has collaborated with Ciara, Swae [ ]", "date_str": "2026-11-04T16:23:04+00:00", "hash": "aab26b5d44dd57d4", "title_fa": "حرکت صنعت موسیقی: جکسون وانگ جوهر با WME; موسیقی آرکای را به JV با لیبل استرلینگ امضا می کند", "summary_fa": "جکسون وانگ، خواننده و ترانه‌سرا، که در حال حاضر در کمپین اپل مرتبط با تک‌آهنگ و موزیک ویدیوی جدیدش، \"Thank You\" بازی می‌کند، برای نمایندگی با WME قرارداد امضا کرده است. اولین آلبوم وانگ در سال 2019، \"Mirrors\" اولین آلبوم یک هنرمند انفرادی چینی شد که در بین 200 آلبوم برتر بیلبورد قرار گرفت و در طول سال ها او با Ciara، Swae همکاری کرده است. سوئه لی، میجر لازر، گوچی مان، و دیگران، و تیتر اصلی انجمن کیا لس آنجلس و مرکز بارکلیز بروکلین بوده است. در سال 2022 او اولین هنرمند انفرادی چینی بود که روی صحنه اصلی کواچلا اجرا کرد. علاوه بر WME، او همچنان توسط تیم Wang Records و Roc Nation نمایندگی می کند. داستان های مرتبط الن دی جنرس نمایش EP متیو رایت در سن 52 سالگی در تراژدی نامفهوم درگذشت. دی جنرس ویدیوی اشک‌آور را به اشتراک می‌گذارد که او را چسبنده به خانواده ما می‌خواند + پوزیشن موزیک با گروه برنده گرمی Arkai با لیبل استرلینگ، لیندسی استومپ، از طریق Position Music A R، Jake Versluis قراردادی با لیبل JV امضا کرد. فارغ‌التحصیلان جویلیارد که به عنوان «هانس زیمر با 2 سلوس ملاقات می‌کند» توصیف می‌شود، به طور گسترده در سینما و تلویزیون، از جمله جوایز امی، موزه گرمی، فینال‌های NBA و موارد دیگر کار کرده‌اند. استرلینگ می‌گوید: «آرکای هر چیزی را نشان می‌دهد که من امیدوار بودم این اثر برچسب بتواند نشان‌دهنده آن باشد: هنری جسورانه، خلاقیت نترس، و تمایل به فراتر رفتن از مرزهای ژانر. جاناتان و فیلیپ نوازندگان خارق‌العاده‌ای هستند، اما چیزی که من را بیشتر هیجان زده می‌کند، قلب و تخیلی است که آنها برای هر چیزی که خلق می‌کنند به کار می‌برند. نمی‌توانستم شرکای بهتر از Position Music را تصور کنم که به ما کمک کنند خانه‌ای بسازیم که در آن هنرمندان رویایی بتوانند نوسانات خلاقانه بزرگی را", "image_url": "https://variety.com/wp-content/uploads/2026/11/Jackson-Wang-e1793809258478.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "سینما", "موسیقی"], "datetime_fa": "۱۳ آبان • ۱۹:۵۳"}, {"source": "Variety", "title": "These Coffee Table Books Make the Perfect Gift This Holiday Season", "link": "https://variety.com/shop/best-coffee-table-books-for-movie-lovers-1234729999/", "summary": "Holiday gifting can be stressful but a great coffee table book is the rare crowd-pleaser &#x2014; equal parts decor, conversation starter and pop-culture deep dive. This year&#x2019;s standout releases span film, music, Broadway and beyond, offering glossy behind-the-scenes worlds for every kind of fan. From Andrew Durham&#x2019;s behind-the-scenes look at Sofia Coppola&#x2019;s making of &#x201C;Marie [ ]", "date_str": "2026-11-04T16:06:12+00:00", "hash": "82460296168bd342", "title_fa": "این کتاب‌های میز قهوه، هدیه‌ای عالی را در این فصل تعطیلات می‌سازند", "summary_fa": "هدایای تعطیلات می تواند استرس زا باشد، اما یک کتاب میز قهوه خوری عالی همان چیز کمیاب است که مردم را خشنود می کند - دکورهای مساوی، شروع مکالمه و غواصی عمیق با فرهنگ پاپ. فیلم‌های برجسته امسال شامل فیلم، موسیقی، برادوی و فراتر از آن می‌شود و پشت صحنه‌های درخشانی را برای هر نوع طرفداری ارائه می‌کند. از پشت صحنه اندرو دورهام به ساخت سوفیا کاپولا از «ماری [ ] بهترین کتاب‌های عکس میز قهوه را برای هر نوع دوستدار فرهنگ پاپ بخرید در زیر: یکی از هدیه‌ترین نسخه‌های سال. اندرو دورهام عکاس فیلم سوفیا کاپولا در سال 2006 را مستند کرد، فیلمی را به ثبت رساند که می‌تواند بهترین لحظات را به تصویر بکشد. بین می گیرد. این کتاب ۱۷۶ صفحه‌ای همچنین شامل تاریخ شفاهی و گفت‌وگوی جدیدی با کاپولا است که به مناسبت بیستمین سالگرد فیلم برگزار می‌شود. این کتاب 600 صفحه‌ای به‌عنوان نسخه توسعه‌یافته راهنمای مستند تخیلی سال 1975 است که توسط مجموعه کمدی IFC ارجاع شده است. این شامل عکس ها، پوسترها، مطالب آرشیوی، نمرات و مشارکت های هلن میرن، ست مایرز و دیگران است. یک غواصی عمیق بصری ۲۷۰ صفحه‌ای در فیلم علمی تخیلی کالت لوک بسون، با عکاسی از لباس، طرح‌های اولیه، وسایل، هنر مفهومی کمیاب و فیلمنامه اصلی. جدیدترین قسمت از مجموعه کلکسیونی آبرامز وس اندرسون ساخت فیلم 2025 او با بازی بنیسیو دل تورو و مایکل سرا را بررسی می کند. شامل مواد تولیدی که قبلا دیده نشده بود، عکاسی صحنه، مصاحبه و تصاویر مکس دالتون. این نسخه جدید که همراه با مستند سوفیا کاپولا درباره مارک جیکوبز است، صدها عکس شخصی، مطالب پشت صحنه و مکالمات بین فیلمساز و طراح را در خود دارد.", "image_url": "https://variety.com/wp-content/uploads/2025/11/coffee-table-books_.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۳ آبان • ۱۹:۳۶"}, {"source": "Variety", "title": "Thomasin McKenzie, Finn Cole and Antony Starr to Lead ‘The Lie of Sherwood Forest,’ Logical and Protagonist Launching at AFM (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/thomasin-mckenzie-finn-cole-starr-lie-of-sherwood-forest-1236939229/", "summary": "The legend of Robin Hood is set to be given a new retelling in The Lie of Sherwood Forest, launching at the upcoming AFM with Logical Pictures International and Protagonist Pictures handling sales. The film — coming from German production company augenschein and beginning production on Nov. 9 — is being directed by Patrick Vollrath ( 7500, Subversion ) [ ]", "date_str": "2026-11-04T15:30:00+00:00", "hash": "c426f6f5f2341b91", "title_fa": "توماسین مک کنزی، فین کول و آنتونی استار برای رهبری «دروغ جنگل شروود»، منطقی و قهرمان داستان در AFM (اختصاصی)", "summary_fa": "افسانه رابین هود قرار است بازخوانی جدیدی در The Lie of Sherwood Forest ارائه شود که در AFM آتی با فروش Logical Pictures International و Protagonist Pictures عرضه خواهد شد. این فیلم - که از شرکت تولید آلمانی augenschein می‌آید و تولید آن در 9 نوامبر آغاز می‌شود - توسط پاتریک وولراث (7500، براندازی) کارگردانی می‌شود. 9 — توسط پاتریک ولراث (7500، براندازی) کارگردانی می‌شود و توماسین مک‌کنزی (عهد آن لی)، فین کول (پیکی بلایندرز، آخرین نفس) و آنتونی استار (پسران، عهد) بازی خواهند کرد. داستان های مرتبط الن دی جنرس نمایش EP متیو رایت در سن 52 سالگی در تراژدی نامفهوم درگذشت. دی جنرس ویدیوی اشک‌آور را به اشتراک می‌گذارد که او را چسب خانواده‌مان می‌خواند اسمایلی بردول (ایمان، همنت)، برایان ورنل (اودیسه، اسب‌های کند) و ریچارد دوردن (جنگ ستارگان: قسمت نهم - ظهور اسکای‌واکر) نیز از جمله بازیگران این فیلم هستند. هریس کافمن فیلمنامه را بر اساس داستانی از یواخیم هدن و پاتریک ولراث نوشته است. با توجه به توضیحات، The Lie of Sherwood Forest، فرهنگ عامه آشنا را به یک مبارزه محکم و سخت برای بقا، وفاداری و عدالت تبدیل می‌کند و یکی از ماندگارترین چهره‌های داستان‌سرایی را به برتری معاصر تبدیل می‌کند. داستان رابین هود و همراهانش را می بیند که توسط یک زن جوان فریب خورده و ماموریتی جسورانه برای نجات برادر اسیر شده اش انجام می دهند، عملیاتی که به یک سرقت خطرناک تبدیل می شود. همانطور که وفاداری ها شکسته می شوند و انگیزه های پنهان ظاهر می شوند، قانون شکنان باید با هزینه واقعی انتخاب های خود - و بهای به چالش کشیدن صاحبان قدرت مقابله کنند. در خلاصه داستان آمده است: اما آنچه به عنوان یک دروغ ناامیدانه شروع می شود، به طور ناخواسته مسیر افسانه را برای همیشه تغییر می دهد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/McKenzie-Cole-Starr.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۳ آبان • ۱۹:۰۰"}, {"source": "Billboard", "title": "Josiah Queen’s ‘Damascus Road’ Debuts at No. 1 on Top Christian Albums", "link": "https://www.billboard.com/music/chart-beat/josiah-queen-damascus-road-number-1-top-christian-albums-1236373907/", "summary": "Josiah Queen logs his third No. 1 on Billboard ’s Top Christian Albums chart with Damascus Road . The set debuts with 27,000 equivalent album units earned in its first week (Oct. 23-29), according to Luminate. It concurrently opens at No. 4 on Americana/Folk Albums and No. 16 on the Billboard 200 (with all lists dated Nov. 7). Related Josiah Queen s Demons Dominates Top Gabb Music Songs Chart for March Josiah Queen Commands Hot Christian Songs Chart for First Time With ‘Demons’ Josiah Queen Has 3 of Top 10 on Latest Top Gabb Music Songs Chart The launch marks the best Top Christian Albums debut, by units, since Brandon Lake’s King of Hearts opened with 37,000 in June 2025. It’s the top debut for a Christian album on the Billboard 200 this year. Damascus Road is Queen’s third studio album in three years, following 2025’s Mt. Zion (15,000 first-week units) and 2024’s The Prodigal ( 4,000). All three debuted at No. 1 on Top Christian Albums, making the 23-year-old the first act to post chart-topping starts in three consecutive years since the chart adopted its current methodology in February 2017. Queen also reaches three No. 1 debuts faster — over less than two-and-a-half years — than any other act since the formula transitioned from measuring solely sales. Including collaborative albums, only four others have scored at least three No. 1 entrances in that span: Elevation Worship (six), Lecrae, NeedToBreathe and TobyMac (three each). Eight of the new set’s 14 tracks debut on Hot Christian Songs, where Queen has placed eight career top 10s, including the album’s lead release and former two-week No. 1, “Demons.” The track holds at No. 2 with 2.6 million official streams and 3.2 million in radio audience. The project’s “Amazing,” with Elevation Rhythm, “Sundays” and Make Heaven Crowded” rank at Nos. 5, 11 and 20, respectively, while “Out of Breath” is the set’s top debut at No. 9. Queen’s growing profile also includes “Dusty Bibles,” from Mt. Zion , which became his first Billboard Hot 100 entry last November and won song of the year at the 2026 GMA Dove Awards in October. Queen lette To Star In TV Adaptation Of Norwegian Dramedy ‘Pernille’ For Apple", "link": "https://deadline.com/2026/11/toni-collette-lenni-norwegian-dramedy-pernille-apple-1237212642/", "summary": "Toni Collette is to star in Apple’s latest dramedy. The Hereditary star is fronting Lenni, a comedy drama based on Norwegian series Pernille, also known locally as Pørni. The streamer has greenlit the series from Nine Perfect Strangers producer Made Up Stories and Homeland producer Keshet International. Lenni follows a divorced social worker who, after [ ]", "date_str": "2026-11-04T16:00:00+00:00", "hash": "4019e7bf2355e897", "title_fa": "تونی کولت در اقتباس تلویزیونی از درامدی نروژی «Pernille» برای اپل بازی خواهد کرد", "summary_fa": "تونی کولت قرار است در جدیدترین درام اپل بازی کند. ستاره ارثی در نقش لنی، یک درام کمدی بر اساس سریال نروژی پرنیل، که در محلی با نام پورنی نیز شناخته می‌شود، بازی می‌کند. پخش‌کننده، سریال را از تهیه‌کننده Nine Perfect Strangers، Made Up Stories و تهیه‌کننده Homeland، Keshet International، روشن کرده است. لنی یک مددکار اجتماعی مطلقه را دنبال می‌کند که پس از [ ] همچنین بازیگرانی چون سیاران هیندز، دن ویلی، جاش مک‌کنزی، سلست باربر، ژنویو هگنی، آرکا داس و وین بلر بازی می‌کنند. Watch on Deadline Lenni بر اساس Pernille ساخته شده است که توسط Henriette Steenstrup ساخته شده است. نسخه اصلی به مدت سه فصل در Viaplay پخش شد و دو فصل آخر آن از نتفلیکس پخش شد. Lenni توسط Dearbhla Walsh از Bad Sisters کارگردانی شده و سارا شلر (Strife) آن را اقتباس کرده است. این فیلم در حال حاضر در سیدنی، استرالیا با حمایت صندوق ساخته شده در NSW از Screen NSW در حال فیلمبرداری است. تولیدکنندگان اجرایی عبارتند از Collette، Scheller، Walsh، Steenstrup، Bruna Papandrea، Steve Hutensky، Katie Amos، Avi Nir، Keren Shahar، Bård Fjulsrud و Tanya Badendyck. Collette توسط CAA، United Management، Finley Management و Jackoway Austen Tyerman Wertheimer Mandelbaum Morris Bernstein Trattner Auerbach Hynick Jaime LeVine Sample Klein نمایندگی می شود. هشدارهای اخبار فوری ما را دریافت کنید و صندوق ورود ry": "“Rendez-vous avec toi” arrives alongside an English counterpart, “Rendez-vous in your arms”", "date_str": "2026-11-04T15:07:21+00:00", "hash": "58ca1862691973dc", "title_fa": "بازگشت کریستین و کوئینز با دو آهنگ جدید", "summary_fa": "\"Rendez-vous avec toi\" در کنار یک همتای انگلیسی می آید، \"Rendez-vous in your arms\" Loader Save Story ذخیره این داستان Comment Loader Save Story Save this Story سه سال از انتشار آخرین آلبوم انفرادی مناسب کریستین و کوئینز می گذرد، یک آلبوم 20 آهنگی در آمریکا با الهام از فرشتگان. اکنون، او با آهنگ جدیدی بازگشته است که به دو روش ساخته شده است: به زبان فرانسوی (\"Rendez-vous avec toi\") و انگلیسی (\"Rendez-vous in your arms\"). هر دوی آنها با یک موزیک ویدیو به کارگردانی مشترک کریس و رافائل دی آلبوکرک و با طراحی رقص الکساندر اکمن همراه هستند. هر دو نسخه را در زیر بررسی کنید. «Rendez-vous avec toi» و «Rendez-vous in your arms» اولین پیش نمایش آلبوم جدید هنوز بدون عنوان از کریستین و کوئینز هستند که قرار است در بهار امسال منتشر شود. این به دنبال EP او در سال 2025 Catching Feelings با اسطوره دیسکوی Italo، Cerrone، و آلبوم او در سال 2024 Hopecore است که با نام رحیم ردکار منتشر شد. کریس در دسامبر امسال از آهنگ جدید دوگانه با چهار نمایش فول باند در اروپا و بریتانیا پشتیبانی خواهد کرد. او در بروکسل، لندن، و آمستردام اجرا خواهد کرد قبل از اینکه با یک مجموعه در الحمرا در پاریس به پایان برسد. کریس در مطالب مطبوعاتی گفت: \"ما رپرتواری را که باعث شد با هم رشد کنیم، دوباره مرور خواهیم کرد و اولین بار به آهنگ های منتشر نشده آلبوم بعدی گوش خواهیم داد.\" ما بازنگری می‌کنیم، دوباره تفسیر می‌کنیم، به یاد می‌آوریم و فراتر می‌رویم.» کریستین و کوئینز: 12-01 بروکسل، بلژیک - بوتانیک 12-07 لندن، انگلیس - اسکالا 12-08 آمستردام، هلند - تولهویستون 12-10 پاریس، فرانسه - الحمرا", "image_url": "https://media.pitchfork.com/photos/6aea184db34ec953af995591/16:9/w_1280,c_limit/CHRISTINE%20AND%20THE%20QUEENS%20-%20plc%20cr%20-%20Errol%20Rainey.jpg", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۳ آبان • ۱۸:۳۷"}, {"source": "Rolling Stone", "title" The Flying Burrito Brothers , as well as through his short solo career, Parsons bridged the then-divide between country music and rock, bringing the raw emotionalism of country into rock’s bravado. For his enduring musical contributions, Parsons will be inducted into the Rock Roll Hall of Fame in Los Angeles on Nov. 14 in the early influence category. Related Emmylou Harris, Elvis Costello, Black Crowes to Pay Tribute to Gram Parsons Ahead of Posthumous Rock Roll Hall of Fame Induction Rock Roll Hall of Fame Reveals Class of 2026: See Who Made It In This Year Five Takeaways From 2026 Rock Roll Hall of Fame Inductions But first, Parsons will be honored Nov. 11 at a sold-out, star-filled salute, A Song for Gram , at vaunted Los Angeles club The Troubadour. The celebration, headlined by Emmylou Harris Parson’s muse who sang on his two solo albums, including 1974’s seminal, posthumous Grievous Angel occurs less than a week after what would have been his 80th birthday on Nov. 5. Gram as an artist was way ahead of his time and I think he will continue to inspire those who come after him to follow their own vision, just as Gram did, Harris tells Billboard ahead of the tribute. Gram of course turned me on to country music and showed me the joy of playing with a band. Parsons’ daughter, Polly Parsons ; Vector Management’s Ken Levitan and Nicki Loranger ; the Rock Roll Hall of Fame s Rick Krim ; and Rolling Stone co-editor Shirley Halperin are producing the evening in partnership with the Gram Parsons estate and the Rock Roll Hall of Fame. Rolling Stone s Shirley Halperin, Polly Parsons and Vector Management’s Nicki Loranger Michael Buckner/Penske Media Polly says the Gram Parsons estate already hoped to do a tribute show for her father’s 80th birthday, and “when he got the induction, it made sense to combine the two. What better way to celebrate this moment?” Joel Peresman , Rock Roll Hall of Fame Foundation president/CEO, agrees. “Gram s story is so tied to Los Angeles,” he says of Parsons, who moved to Los Angeles in 1967 with his first group, the International Submarine Band. “The Troubadour is such a meaningful room in [his] history that it felt like the natural place to give him his own night as he is inducted under music’s highes", "date_str": "2026-11-04T15:00:00+00:00", "hash": "aee5cc262e057151", "title_fa": "چگونه Gram Parsons Tribute با بازی امیلو هریس، الویس کاستلو و The Black Crowes با هم آمدند", "summary_fa": "گرام پارسونز تنها 26 سال داشت که در سال 1973 بر اثر مصرف بیش از حد تصادفی در نزدیکی جاشوا تری، کالیفرنیا درگذشت، اما در 50 سال بعد، تأثیر این نوازنده پیشگام تنها افزایش یافته است. پارسونز به‌عنوان یکی از اعضای اصلی گروه بیردز و یکی از بنیان‌گذاران The Flying Burrito Brothers، و همچنین از طریق فعالیت کوتاه انفرادی خود، شکاف بین موسیقی کانتری و راک را از بین برد و عاطفه‌گرایی خام کانتری را به جسارت راک تبدیل کرد. پارسونز به خاطر مشارکت‌های ماندگارش در موسیقی، در 14 نوامبر در تالار مشاهیر راک رول در لس‌آنجلس در رده‌های تاثیر اولیه قرار می‌گیرد. مرتبط: Emmylou Harris، Elvis Costello، Black Crowes برای ادای احترام به Gram Parsons قبل از القای تالار مشاهیر راک رول پس از مرگ، تالار مشاهیر راک رول کلاس 2026 را نشان می دهد: ببینید چه کسی در این سال ساخته شده است. 11 در یک سلام پرفروش و پر ستاره، آهنگی برای گرم، در کلوب پر افتخار لس آنجلس The Troubadour. جشنی که با تیتر یکی از موسیقی‌های امیلو هریس پارسون، که در دو آلبوم انفرادی او، از جمله در سال 1974، اولین و پس از مرگ فرشته گریووس، خوانده شد، کمتر از یک هفته پس از تولد 80 سالگی او در 5 نوامبر برگزار می‌شود. هریس قبل از ادای احترام به بیلبورد می گوید که گرام به عنوان یک هنرمند بسیار جلوتر از زمان خود بود و من فکر می کنم او همچنان به کسانی که بعد از او می آیند الهام می بخشد تا دیدگاه خود را دنبال کنند، همانطور که گرام انجام داد. البته گرام مرا به موسیقی کانتری تبدیل کرد و لذت بازی با یک گروه را به من نشان داد. پولی پارسونز، دختر پارسونز؛ کن لویتان و نیکی لورنجر از مدیریت بردار؛ تالار مشاهیر راک رول ریک کریم ; و شرلی هالپرین،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/gram-parsons-1969-billboard-1800.jpg?w=1024", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۱۳ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Juanes Marks 25 Years in Music With First Greatest Hits Album ’25 Aniversario’: Here’s the Tracklist & Release Date", "link": "https://www.billboard.com/music/latin/juanes-greatest-hits-album-25-aniversario-release-date-tracks-1236373861/", "summary": "Celebrating the soon concluding first quarter century anniversary of his solo career, Colombian rock star Juanes will release his first greatest hit collection, titled 25 Aniversario , Billboard can report exclusively Wednesday (Nov. 4). Related 25 Questions With Juanes on the 25th Anniversary of His Solo Career: I’ve Found a Clarity That I Had Lost Long Ago Fonseca, Camilo, Juanes Carlos Vives Talk World Cup, Fatherhood and More Juanes Kicks Off His Most Extensive North American Tour: Full Setlist The 25-track career-spanning retrospective which includes Billboard Hot Latin Songs No. 1s such as La Camisa Negra, Nada Valgo Sin Tu Amor and Me Enamora comes out this Friday (Nov. 6) via Universal Music Latino. In addition to the global release across all major digital platforms, the set will be available in CD and vinyl formats as well. It has been 25 years of music — and counting, Juanes said in a statement. Thank you for so much joy and for accompanying me every step of the way. My heartfelt thanks to all my fans for ensuring that my songs continue to travel through time. You always breathe life into my music. “Over the past 25 years, Juanes, through his guitar and songwriting, has broken down borders, bringing the essence of Colombia to the world while redefining rock and Latin roots, added Angel Kaminsky, president, A R and artist relations at Universal Latin America Iberian Peninsula. This album is more than just a greatest hits collection it is a journey through the evolution of our cultural identity.” A winner of accolades including 25 Latin Grammys, four Grammys and more than 10 Billboard Latin Music Awards, Juanes born and raised in Medellín, Colombia is one of the most established and revered Latin artists of his generation, with Billboard chart-topping tracks also including Volverte a Ver Fotografía with Nelly Furtado and Gotas de Agua Dulce. In 2007, “Me Enamora” led Hot Latin Songs for 20 weeks and spent 38 weeks on the ranking. This year, Juanes also appeared on the June cover of Billboard Español along with fellow Colombian artists Camilo, Carlos Vives and Fonseca to talk about the FIFA World Cup, fatherhood and their country s spirit. 25 Aniversario , appropriately, begins with the title track to his 2000 landmark debut album, Fíjate Bien , which spoke to Colombia’s social hardships and went on to garner seven Latin Grammy nominations, with Juanes earning best new artist of the year. Also on the album are Yerbatero, Fuego and La Luz, songs fro", "date_str": "2026-11-04T15:00:00+00:00", "hash": "4d8c6e2561c46f2e", "title_fa": "خوان 25 سال موسیقی را با اولین آلبوم برتر «25 Aniversario» جشن گرفت: لیست آهنگ و تاریخ انتشار در اینجا آمده است", "summary_fa": "خوانس، ستاره راک کلمبیایی، با جشن گرفتن اولین سالگرد پایانی ربع قرن فعالیت انفرادی خود، اولین مجموعه موفق خود را با عنوان 25 Aniversario منتشر خواهد کرد که بیلبورد می تواند به طور انحصاری در چهارشنبه (4 نوامبر) گزارش دهد. 25 سوال مرتبط با خوانس در بیست و پنجمین سالگرد حرفه انفرادی او: وضوحی پیدا کردم که مدت ها پیش از دست داده بودم فونسکا، کامیلو، خوانس کارلوس ویوز درباره جام جهانی صحبت می کنند، پدر و مادر و موارد دیگر. آهنگ های داغ لاتین شماره 1 مانند La Camisa Negra، Nada Valgo Sin Tu Amor و Me Enamora این جمعه (6 نوامبر) از طریق Universal Music Latino منتشر می شود. این مجموعه علاوه بر عرضه جهانی در تمامی پلتفرم های دیجیتال اصلی، در قالب های سی دی و وینیل نیز در دسترس خواهد بود. خوانز در بیانیه ای گفت: 25 سال از موسیقی گذشته است - و همچنان در حال افزایش است. از این همه خوشحالی و همراهی من در تمام مراحل سپاسگزارم. از همه طرفدارانم صمیمانه تشکر می کنم که مطمئن شدند آهنگ های من همچنان در زمان سفر می کنند. تو همیشه به موسیقی من جان می دهی. آنجل کامینسکی، رئیس A R و روابط هنرمندان در شبه جزیره ایبری یونیورسال آمریکای لاتین، افزود: «در 25 سال گذشته، خوانس، از طریق گیتار و ترانه سرایی خود، مرزها را شکسته است، و جوهر کلمبیا را به جهان آورده و در عین حال ریشه های راک و لاتین را بازتعریف کرده است. این آلبوم بیش از یک مجموعه برترین آثار است، بلکه سفری است در مسیر تکامل هویت فرهنگی ما. برنده جوایز 25 گرمی لاتین، چهار جایزه گرمی و بیش از 10 جایزه موسیقی لاتین بیلبورد، خوانز متولد و بزرگ شده در مدلین، کلمبیا، یکی از معتبرترین و معتبرترین هنرمندان لاتین نسل خود است، با آهنگ های برتر جدول", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Juanes-cr-Mario-Alzate-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۳ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "The Cure’s Robert Smith Teases 2027 Tour Dates Will Be ‘Bursting With New Songs’", "link": "https://www.billboard.com/music/rock/the-cure-robert-smith-2027-tour-dates-bursting-new-songs-1236373864/", "summary": "After a very busy 2026, The Cure frontman Robert Smith made a bold prediction for his veteran band s 2027 tour. In a voicemail sent to Nick Grimshaw s BBC Radio 6 show this week, Smith, 67, teased more Cure shows next year, where he said fans may also get a preview of new music. The Cure were on the road this summer in support of the band s 2024 LP Songs of a Lost World , playing more than a dozen European festivals, culminating on Aug. 30 with an appearance at the Rock en Seine fest in Saint-Cloud, France. That swing also included the debut of his collaboration on Olivia Rodrigo s What s Wrong With Me, which they performed live together for the first time at the Primavera Sound festival in Barcelona, Spain in June, all highlights that Smith alluded to in his voicemail. But the real headline grabber was his hint about new music. I’m looking forward to more Cure concerts in 2027. Of course, I’m not allowed to say where or when yet, but I’m confident they will be bursting with new songs, Smith said. Watch this space…” The Cure broke a 16-year studio album drought in 2024 with the emotionally roiling Songs of a Lost World , their first LP of new music since 2008 s 4:13 Dream . A month after its release, Smith and company dropped The Show of a Lost World concert film, as well the Songs of a Live World: Troxy London MMXXIV live album, followed by the June 2025 Mixes of a Lost World remix album. Then, in a teaser in December 2024, Smith revealed that he had two more albums in the chamber, including another album which is pretty much ready to go. It s sort of a companion piece, as well as a third one that is completely different. It s really kind of random stuff, it s like late-night studio stuff. But some of it is really, really good actually, it s just very, very different. At press time no additional information was available on those two untitled, unreleased albums.", "date_str": "2026-11-04T14:13:13+00:00", "hash": "8c7ef85e60b7fd89", "title_fa": "The Cure's Robert Smith Teases تاریخ های تور 2027 با آهنگ های جدید همراه خواهد بود", "summary_fa": "پس از یک سال بسیار شلوغ در سال 2026، رابرت اسمیت، رهبر گروه The Cure، پیش بینی جسورانه ای را برای تور 2027 گروه کهنه کار خود انجام داد. اسمیت 67 ساله در یک پیام صوتی که این هفته برای برنامه رادیو 6 بی بی سی نیک گریمشاو ارسال شد، برنامه های Cure بیشتری را در سال آینده به اشتراک گذاشت و گفت که طرفداران ممکن است پیش نمایشی از موسیقی جدید را نیز دریافت کنند. The Cure در تابستان امسال برای حمایت از گروه LP Songs of a Lost 2024 در راه بود و بیش از ده ها جشنواره اروپایی را اجرا کرد که در آگوست به اوج خود رسید. 30 با حضور در جشنواره Rock en Seine در Saint-Cloud، فرانسه. این نوسان همچنین شامل اولین همکاری او در فیلم Whats Wrong With Me به کارگردانی اولیویا رودریگو بود، که آنها برای اولین بار با هم به صورت زنده در جشنواره Primavera Sound در بارسلون، اسپانیا در ژوئن اجرا کردند، همه نکات برجسته ای که اسمیت در پیام صوتی خود به آنها اشاره کرد. اما غافلگیر کننده واقعی تیتر، اشاره او به موسیقی جدید بود. من مشتاقانه منتظر کنسرت های بیشتر Cure در سال 2027 هستم. Of course, I’m not allowed to say where or when yet, but I’m confident they will be bursting with new songs, Smith said. این فضا را تماشا کنید...» The Cure در سال 2024 خشکسالی 16 ساله آلبوم استودیویی را با آهنگ‌های هیجان‌انگیز Songs of a Lost World شکست داد، اولین LP موسیقی جدید آنها از سال 2008، 4:13 Dream. یک ماه پس از انتشار، اسمیت و شرکت فیلم کنسرت نمایش یک دنیای گمشده و همچنین آلبوم زنده Songs of a Live World: Troxy London MMXXIV را کنار گذاشتند و پس از آن آلبوم ریمیکس Mixes of a Lost World در ژوئن 2025 منتشر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/1159279057-e1793799792969.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۳ آبان • ۱۷:۴۳"}, {"source": "Deadline", "title": "Midterm Elections: Amid The Blue Tsunami, A Night Of Many Firsts", "link": "https://deadline.com/2026/11/midterm-elections-firsts-1237213084/", "summary": "Democrats won up and down the ballot in the midterms, and votes are still being counted on what could ultimately be a 75-seat House majority and 54 or more seats in the Senate. There also were many firsts, reflecting the party s diverse coalition that helped them score victories even in deeply red states. Among them: [ ]", "date_str": "2026-11-04T14:50:01+00:00", "hash": "bec898ba068dc01c", "title_fa": "انتخابات میان دوره ای: در بحبوحه سونامی آبی، شبی با اولین ها", "summary_fa": "دموکرات‌ها در انتخابات میاندوره‌ای برنده شدند و آرا همچنان بر روی اکثریت ۷۵ کرسی مجلس نمایندگان و ۵۴ کرسی یا بیشتر در سنا شمارش می‌شود. همچنین اولین‌های زیادی وجود داشت که منعکس‌کننده ائتلاف متنوع حزب بود که به آن‌ها کمک کرد حتی در ایالت‌های به شدت قرمز پیروز شوند. از جمله: [ ] اولین فرماندار زن سیاه پوست: کیشا لنس باتمز، شهردار سابق آتلانتا، پیروزی قابل توجهی بر ریک جکسون جمهوری خواه بود. او در سخنرانی پیروزی خود به یاد آورد که از قبر مادربزرگ خود که در سال 18 rezjalibd.github.io/daily-news/archive/2026-09-14.html"}, {"date_key": "2026-09-13", "p_date": "۲۲ شهریور ۱۴۰۵", "g_date": "۱۳ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-13.html"}, {"date_key": "2026-09-12", "p_date": "۲۱ شهریور ۱۴۰۵", "g_date": "۱۲ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-12.html"}, {"date_key": "2026-09-11", "p_date": "۲۰ شهریور ۱۴۰۵", "g_date": "۱۱ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
