را برای کودکان زیر ۱۵ سال ممنوع می‌کند", "summary_fa": "پارلمان یونان با تصویب قانونی تازه، استفاده از پلتفرم‌های شبکه‌های اجتماعی را برای کودکان زیر ۱۵ سال ممنوع کرد. تبلیغات پارلمان یونان لایحه‌ای را به تصویب رساند که بر اساس آن استفاده از پلتفرم‌های شبکه‌های اجتماعی برای افراد زیر ۱۵ سال ممنوع می‌شود. قانون‌گذاران آتن هدف اصلی اجرای مصوبه را حفاظت از سلامت جسمی و روانی کودکان و نوجوانان در برابر آسیب‌های فضای آنلاین اعلام کرده‌اند. اجرای رسمی مصوبه از تاریخ ۱ ژانویه ۲۰۲۷ آغاز خواهد شد. دولت یونان اعلام کرده در کنار والدین ایستاده است تا پدیده‌ی پیمایش یا همان اسکرول بی‌پایان را که خواب، تمرکز و زمان تعامل کودکان با دوستانشان را سلب می‌کند، مهار کند. یونان همچنین جزو هفت کشور عضو اتحادیه‌ی اروپا به‌شمار می‌رود که همراه با کمیسیون اروپا در پی یافتن راهکاری کارآمد برای سازوکار احراز سن کاربران هستند. پیش از یونان، استرالیا نخستین کشوری نام گرفت که سال گذشته قوانینی را برای محدود کردن حضور افراد کم‌سن‌وسال در پلتفرم‌های اجتماعی وضع کرد. تلاشی مشابه نیز در فرانسه شکل گرفت، اما شورای قانون اساسی آن کشور مصوبه را در ماه اوت رد کرد. بر اساس اعلام مقامات آتن، شرکت‌های فناوری باید سازوکارهای فنی لازم را برای تطبیق با قانون جدید پیاده‌سازی کنند. نخست‌وزیر یونان می‌گوید: «شبکه‌های اجتماعی دو ماه و نیم فرصت دارند راهکاری برای احراز سن کاربران و حفظ حریم خصوصی آنان تدوین کنند.» لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۶:۴۵"}, {"source": "Zoomit", "title": "جداشدن اکسل فونیکس FX در وسط خیابان؛ چری رسما عذرخواهی کرد", "link": "https://www.zoomit.ir/car/469683-chery-apologises-omoda-5-failure/", "summary": "رئیس چری پس از جداشدن اکسل عقب فونیکس FX و تعلیق شماره‌گذاری در مالزی، به‌طور رسمی عذرخواهی کرد.", "date_str": "2026-10-23T12:40:00+00:00", "hash": "3efe7b970688c001", "title_fa": "جداشدن اکسل فونیکس FX در وسط خیابان؛ چری رسما عذرخواهی کرد", "summary_fa": "رئیس چری پس از جداشدن اکسل عقب فونیکس FX و تعلیق شماره‌گذاری در مالزی، به‌طور رسمی عذرخواهی کرد. تبلیغات یین تونگیو ، رئیس هیئت‌مدیره و مدیرعامل چری ، در پی بروز نگرانی‌های کیفی پیرامون جداشدن مجموعه‌ی اکسل عقب چری اومودا ۵ (فونیکس FX) در مالزی رسما عذرخواهی کرد. این رخداد به تحقیقات نهادهای نظارتی و صدور فراخوان برای ۸٬۸۷۸ دستگاه خودرو انجامید. تونگیو در جریان کنفرانس جهانی وسایل نقلیه هوشمند متصل (WICV)، به دغدغه‌های فنی پیش‌آمده اذعان داشت و اعلام کرد شخصا از وزیر سرمایه‌گذاری، تجارت و صنعت مالزی پوزش خواسته است. یین تونگیو، مدیرعامل چری، گفت : «ما برای کسب سودهای سریع و کوتاه‌مدت به بازارهای خارجی نمی‌رویم، بلکه هدفمان ریشه‌دواندن و توسعه‌ی پایدار این بازارها در درازمدت است.» ماجرا اوایل مهرماه در شهر جوهور بهرو رخ داد. مجموعه‌ی تعلیق عقب و چرخ‌ها به‌طور کامل از بدنه‌ی خودرو جدا شد. در پی این اتفاق، اداره‌ی حمل‌ونقل جاده‌ای مالزی مجوز تأیید نوع خودرو را برای فونیکس FX به‌شکل موقت تعلیق کرد تا فرایند شماره‌گذاری مدل‌های جدید متوقف شود. بازرسی فنی این نهاد نظارتی شامل خطوط تولید، سیستم‌های کنترل کیفیت، بررسی اتصالات جوش و ارزیابی تامین‌کنندگان قطعات اکسل می‌شود. چری مالزی در ۱۴ اکتبر اعلام کرد دامنه‌ی این فراخوان ۸٬۸۷۸ دستگاه از تیپ‌های C و H را در بر می‌گیرد تا در صورت نیاز، قطعات مربوطه به‌رایگان تعویض شوند. چری در تابستان ۲۰۲۵ خودروی O5 را با سیستم تعلیق عقب چنداتصالی (مولتی‌لینک) جایگزین مدل پیشین مجهز به محور پیچشی کرد. بررسی‌ها نشان می‌دهد مدل جدید مشمول نقص فنی یادشده نیست؛ هرچند این پرونده پس از ماجرای مشابه سال ۲۰۲۴ و بازبینی ۶۰۰ دستگاه خودرو به دلیل خطای کالیبراسیون تجهیزات تامین‌کننده، نظارت‌ها را بر زنجیره‌ی تامین خودروسازان چینی دوچندان کرده است. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۱ آبان • ۱۶:۱۰"}, {"source": "Business Insider", "title": "The CEO of Europe's most valuable company says he is tying his pay to employee satisfaction", "link": "https://www.businessinsider.com/asml-ceo-exec-pay-linked-employee-satisfaction-survey-2026-10", "summary": "ASML CEO Christophe Fouquet told employees it had been a disruptive and emotional year. Chesnot/Getty Images The CEO of ASML is tying his compensation to a personal mission to boost employee morale. Christophe Fouquet told employees in a memo seen by BI that ASML would link exec pay to employee satisfaction. It comes amid a major reorg at Europe's most valuable firm, which supplies chipmaking equipment to TSMC and Intel. The CEO of Europe's most valuable company is linking his pay to a personal mission to boost employee morale. Christophe Fouquet, the CEO of Dutch tech firm ASML, said last week that the company will incorporate employee satisfaction into its compensation strategy for top executives in an effort to quell discontent over a major reorganization, per a memo to employees obtained exclusively by Business Insider. Fouquet was responding to the results of an annual survey that polled more than 38,000 of ASML's roughly 44,000 employees. The survey results, seen by Business Insider, show that ASML's employee engagement index — a measure of worker satisfaction — fell from 78% last year to 73.5% this year. In the memo, Fouquet said that the declining employee engagement scores \"reflect a period of significant change\" and acknowledged that it had been a \"disruptive and emotional year\" for the company. He added that ASML's executive team had highlighted six questions in the survey and combined them into a new Workplace Experience Index, which would be incorporated into the company's Long-Term Incentive plan for executive compensation. \"In the coming years, it will directly influence the remuneration of senior leaders, including the Board of Management,\" Fouquet wrote, adding that strengthening the company's culture and reinforcing its values would be a personal priority in the coming year. ASML declined to comment. ASML s lithography machines are a critical part of the semiconductor supply chain. Bloomberg/Getty Images The six questions include whether employees feel they can share their opinions without fear of retaliation and if they have confidence in ASML's senior leadership team. Employees will also be polled on whether they have a clear understanding of their role, whether they think their teams are operating efficiently and are well organized, and whether they feel their direct manager shows they care about them as an individual. It comes as ASML, the only firm on the planet capable of building the advanced EUV lithography machines critical for c", "date_str": "2026-10-23T13:02:27+00:00", "hash": "7b7a792442a1582e", "title_fa": "مدیرعامل ارزشمندترین شرکت اروپایی می گوید که حقوق خود را با رضایت کارکنان گره می زند", "summary_fa": "کریستف فوکه، مدیرعامل ASML به کارکنان گفت که سالی پر از اختلال و احساسی بود. Chesnot/Getty Images مدیر عامل ASML غرامت خود را به یک ماموریت شخصی برای تقویت روحیه کارکنان گره می زند. کریستف فوکه در یادداشتی که توسط BI مشاهده شد به کارمندان گفت که ASML حقوق مدیران را به رضایت کارکنان مرتبط می کند. این در بحبوحه یک سازماندهی بزرگ در با ارزش ترین شرکت اروپایی که تجهیزات تولید تراشه را برای TSMC و اینتل تامین می کند، رخ می دهد. مدیر عامل ارزشمندترین شرکت اروپایی حقوق خود را به یک ماموریت شخصی برای تقویت روحیه کارکنان مرتبط می کند. کریستف فوکه، مدیر عامل شرکت فناوری هلندی ASML، هفته گذشته گفت که این شرکت رضایت کارکنان را در استراتژی جبران خسارات مدیران ارشد خود در تلاش برای فرونشاندن نارضایتی از یک سازماندهی مجدد بزرگ، در یادداشتی برای کارکنان که منحصراً توسط Business Insider دریافت می‌کند، وارد می‌کند. فوکه به نتایج یک نظرسنجی سالانه پاسخ داد که بیش از 38000 نفر از تقریباً 44000 کارمند ASML را مورد نظرسنجی قرار داد. نتایج نظرسنجی که توسط Business Insider مشاهده شد، نشان می‌دهد که شاخص مشارکت کارکنان ASML - معیاری برای رضایت کارگران - از 78٪ در سال گذشته به 73.5٪ در سال جاری کاهش یافته است. فوکه در این یادداشت گفت که کاهش نمرات مشارکت کارکنان \"منعکس کننده دوره ای از تغییرات قابل توجه\" است و اذعان کرد که این سال یک \"سال مختل کننده و احساسی\" برای شرکت بوده است. وی افزود که تیم اجرایی ASML شش سوال را در این نظرسنجی برجسته کرده و آنها را در یک شاخص جدید تجربه در محل کار ترکیب کرده است که در برنامه انگیزشی بلند مدت شرکت برای پاداش مدیران گنجانده می شود. فوکه نوشت: «در سال‌های آینده، این امر مستقیماً بر پاداش‌های رهبران ارشد از جمله هیئت مدیره تأثیر", "category": "هوش مصنوعی مولد", "tags": ["تراشه"], "datetime_fa": "۱ آبان • ۱۶:۳۲"}, {"source": "Business Insider", "title": "I stayed at a 5-star Four Seasons hotel in Jackson Hole, Wyoming. My $1,000-a-night room felt like a skier's sanctuary.", "link": "https://www.businessinsider.com/four-seasons-jackson-hole-ski-resort-guest-room-review-tour", "summary": "The author s guest room at the Four Seasons Jackson Hole resort starts at about $1,000 during the winter ski season. Joey Hadden/Business Insider I've never been skiing. But if I ever decide to learn, I'll do it at the Four Seasons in Jackson Hole, Wyoming. My 550-square-foot room felt like a luxury cabin on the slopes. When I arrived at the Four Seasons Jackson Hole on a muggy day in early September, I imagined it covered in snow. This was in 2024, when I visited Jackson Hole, Wyoming , for the first time. I spent one night at the five-star ski-in, ski-out resort . If I ever take a ski trip , I imagine that my room at this Four Seasons would be a peaceful place to rest after an active day of gliding through powder. Step inside the 550-square-foot room with a starting rate of nearly $1,000 a night during the winter ski season. Welcome to the Four Seasons Jackson Hole, a five-star, slopeside ski resort. Courtesy of Four Seasons Jackson Hole The 65-year-old hotel chain has a luxurious reputation and over 130 locations worldwide, each designed to reflect its destination. Kim Cole, the director of public relations for the Four Seasons, told Business Insider that the company describes the Jackson Hole location's aesthetic as \"modern mountain chic,\" catering to hikers, bicyclists, and skiers in the winter. After checking in, I explored the room with the typical peak-season guest in mind. Joey Hadden/Business Insider The hotel has 106 guest rooms and 18 suites. The starting rate is $525 in the offseason and $995 in the peak winter season. Business Insider received a media rate for a one-night stay. There are also 31 Resort Residences on-site, built to serve large groups. These residences have kitchens and up to five bedrooms. Starting prices range from $4,200 to $11,000, depending on the season. Cole told Business Insider that in the winter, guest rooms are typically booked with active guests who participate in winter sports, so I imagined how the room would feel as a skier. I thought my 550-square-foot room blended traditional cabin nostalgia with midcentury modern luxury. Joey Hadden/Business Insider My room had a king-sized bed, a full bathroom, and a private balcony. Renovated by Wimberly Interiors in 2022, the guest rooms were designed to bring the outside in, with metal accents, stone finishings, and a soft, earth-toned color palette. This nature-inspired trend, known as biophilic design, gained traction in 2024. The bed was plush with warm, fluffy bedding ", "date_str": "2026-10-23T12:53:01+00:00", "hash": "16f376aff707a38e", "title_fa": "من در یک هتل 5 ستاره Four Seasons در جکسون هول، وایومینگ اقامت کردم. اتاق شبی 1000 دلاری من شبیه پناهگاه اسکی بازان بود.", "summary_fa": "اتاق مهمان نویسنده در استراحتگاه Four Seasons Jackson Hole در فصل زمستان اسکی از حدود 1000 دلار شروع می شود. Joey Hadden/Business Insider من هرگز اسکی نکرده ام. اما اگر تصمیم بگیرم یاد بگیرم، این کار را در چهار فصل در جکسون هول، وایومینگ انجام خواهم داد. اتاق 550 فوت مربعی من شبیه یک کابین لوکس در سراشیبی بود. وقتی در اوایل سپتامبر در روزی پر از گل و لای به چهارفصل جکسون هول رسیدم، تصور کردم که پوشیده از برف است. این در سال 2024 بود، زمانی که من برای اولین بار از جکسون هول، وایومینگ بازدید کردم. یک شب را در پیست اسکی پنج ستاره گذراندم. اگر روزی به یک سفر اسکی بروم، تصور می‌کنم که اتاق من در این چهار فصل مکانی آرام برای استراحت پس از یک روز فعال با سر خوردن در میان پودر خواهد بود. در طول فصل اسکی زمستانی، وارد اتاقی به مساحت 550 فوت مربع با نرخ شروع تقریباً 1000 دلار در شبانه روز شوید. به چهار فصل جکسون هول، یک پیست اسکی پنج ستاره در کنار شیب خوش آمدید. با حسن نیت از Four Seasons Jackson Hole هتل های زنجیره ای 65 ساله دارای شهرت مجلل و بیش از 130 مکان در سراسر جهان است که هر کدام به گونه ای طراحی شده اند که مقصد خود را نشان دهند. کیم کول، مدیر روابط عمومی Four Seasons، به Business Insider گفت که این شرکت زیبایی‌شناسی مکان جکسون هول را به‌عنوان «شیک کوهستانی مدرن» توصیف می‌کند، که برای کوهنوردان، دوچرخه‌سواران و اسکی‌بازان در زمستان پذیرایی می‌کند. پس از ورود، اتاق را با در نظر گرفتن مهمان معمولی فصل اوج بررسی کردم. Joey Hadden/Business Insider این هتل دارای 106 اتاق مهمان و 18 سوئیت است. نرخ شروع 525 دلار در خارج از فصل و 995 دلار در فصل اوج زمستان است. Business Insider", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۶:۲۳"}, {"source": "Business Insider", "title": "I'm a professional declutterer and don't declutter my entire house at once. I get rid of 5 things a day instead.", "link": "https://www.businessinsider.com/decluttering-home-without-feeling-overwhelmed-2026-10", "summary": "The author suggests getting rid of 5 things a day. Natalia Lebedinskaia/Getty Images Getting rid of just five things a day can make decluttering feel much more manageable. Small daily efforts add up, helping clear crowded drawers and surfaces over time. The key is consistency, not trying to organize your entire home in one weekend. The holidays are around the corner, and soon the chaos of hosting and travel will start. If tidying the house and reducing your clutter are things you thought you'd get to this year, let's take the pressure off and do it as gently as possible, before it ends. I help my clients get rid of clutter year-round . Here are a few strategies to make a tough task easier. Be realistic One thing that can derail your decluttering project is false optimism. Have you ever said, \"We'll clear out the garage on Saturday and w'll do something fun Sunday!\"? Taking care of stuff that has resisted management for years won't be done in an afternoon. There are so many choices to make when you're trying to get rid of things, and that's where confusion and exhaustion make a seemingly simple process into one that's hard to face. But don't despair — you can make progress and get things tidied up before next year. Imagine not having this task on your list when spring's optimism returns. Slow and steady is key You remember the tortoise and the hare? Slow and steady wins the race, and it will also get your home feeling more spacious and tidy. Try the five-a-day (or three-a-day, or two-a-day) method. Put a cardboard box in your back hall, garage, or other staging area. Choose five (or three or two) things every day and toss them in the box — or the trash. These items can be anything; on a challenging day, you might get rid of an old dried-up glue stick, a charging cord that doesn't match your current phone, and a stack of expired coupons. When you wake up one day feeling motivated, you might look for five pairs of unworn shoes and also choose five books you don't want anymore. It might feel like these small movements won't make a dent in the problem, but they will. After a couple of months, you'll find that drawers are less crowded and you can start to see surfaces again. Just keep at it. Do not fear the garbage can. Recycling is important , but at a certain point, things do become trash. Holding on to them because you feel guilty about the landfill isn't helping the planet. If you want to make a difference, try buying less. Schedule the hard stuff Maybe you'", "date_str": "2026-10-23T12:49:01+00:00", "hash": "350718294b5f57a3", "title_fa": "من یک تمیز کننده حرفه ای هستم و کل خانه ام را یکباره خراب نکنید. به جای آن روزی 5 چیز را از بین می برم.", "summary_fa": "نویسنده پیشنهاد می کند روزانه از شر 5 چیز خلاص شوید. Natalia Lebedinskaia/Getty Images خلاص شدن از شر تنها پنج چیز در روز می‌تواند باعث شود که بی‌نظمی‌تر احساس شود. تلاش‌های کوچک روزانه اضافه می‌شوند و به پاک کردن کشوها و سطوح شلوغ در طول زمان کمک می‌کنند. نکته کلیدی ثبات است، نه تلاش برای سازماندهی کل خانه خود در یک آخر هفته. تعطیلات نزدیک است و به زودی هرج و مرج میزبانی و سفر آغاز خواهد شد. اگر فکر می‌کردید امسال به آن‌ها برسید، مرتب کردن خانه و کاهش شلوغی‌هایتان است، بیایید فشار را از بین ببریم و قبل از پایان آن، تا حد امکان به آرامی این کار را انجام دهیم. من به مشتریانم کمک می کنم تا در تمام طول سال از شر بهم ریختگی خلاص شوند. در اینجا چند استراتژی برای آسان کردن یک کار سخت وجود دارد. واقع بین باشید یکی از چیزهایی که می تواند پروژه بی نظم شما را از مسیر خارج کند، خوش بینی کاذب است. آیا تا به حال گفته اید، \"ما روز شنبه گاراژ را پاکسازی می کنیم و یکشنبه یک کار سرگرم کننده انجام خواهیم داد!\"؟ مراقبت از چیزهایی که سال ها در برابر مدیریت مقاومت کرده اند، یک بعد از ظهر انجام نمی شود. وقتی می‌خواهید از شر چیزها خلاص شوید، انتخاب‌های زیادی وجود دارد، و اینجاست که سردرگمی و فرسودگی فرآیندی به ظاهر ساده را به فرآیندی تبدیل می‌کند که مواجهه با آن سخت است. اما ناامید نشوید - می توانید پیشرفت کنید و تا قبل از سال آینده همه چیز را مرتب کنید. تصور کنید وقتی خوش بینی بهار برگشت، این وظیفه را در لیست خود ندارید. آهسته و پیوسته کلید است لاک پشت و خرگوش را به خاطر دارید؟ آهسته و پیوسته برنده مسابقه است و همچنین باعث می شود خانه شما جادارتر و مرتب", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱ آبان • ۱۶:۱۹"}, {"source": "Business Insider", "title": "Here's what's behind the vibe shift that's rattling the AI trade", "link": "https://www.businessinsider.com/ai-stocks-down-coreweave-nvidia-meta-capex-spending-jensen-huang-2026-10", "summary": "Photographer: Michael Nagle/Bloomberg via Getty Images Bloomberg/Getty Images The AI trade has been pummeled in the last couple of weeks. Thursday's rout extended a turbulent stretch that kicked off with last week's panic about CoreWeave. The vibes in the AI trade are shifting day-by-day as traders digest rates, spending concerns, and macro turmoil. The AI trade feels like it's at an inflection point . Shares of neoclouds like CoreWeave and Nebius have taken a beating over the last couple of weeks, while hyperscalers and chip stocks have been pummeled even as some tech giant report solid earnings and top execs rush to publicly calm markets . Things had been going swimmingly for the trade as late as the back half of September, thanks in part to excitement about Meta's Muse AI agent . The market touched its latest all-time high just two weeks ago. So what's behind the sudden vibe shift? Several factors have piled up to fuel the latest sell-off: CoreWeave saw some of its bonds drop to distressed prices , sparking fears about its financing costs that spilled over and pummeled the stock. Shares are down 28% since October 12. Inflation and oil prices are fueling fears of higher long-end rates, and prompting the Fed to hike short-term rates. Demand for capital is extremely high, pushing up interest rates. Higher rates translate to less borrowing, which means less spending on the AI buildout. Less spending on AI infrastructure means lower earnings than investors had expected for capex beneficiaries — like chip producers and the web of ancillary firms that build and provide systems for data centers. A slower AI buildout means a potentially longer path to monetization. Earnings still aren't delivering the goods the market wants to see. Investors are more concerned than ever that the AI hyperscalers are spending enormous sums with too little to show for it. Meta stock dropped after earnings this week, despite upbeat results and guidance. In other words, it's a big mess that's come to a head in the last week. The jitters around CoreWeave and the neocloud companies even prompted Nvidia CEO Jensen Huang to try and reassure investors about the health of the sector. \"The demand for the neoclouds is off the charts,\" Huang told CNBC on Thursday. Nvidia own a stake in CoreWeave. Nvidia CEO Jensen Huang hyped up the demand for the neocloud companies as investors fled CoreWeave stock in the last week. Sean Gallup/Getty Images For CoreWeave and other neoclouds, a shorter runway", "date_str": "2026-10-23T12:06:39+00:00", "hash": "cb733b1e0b1f7bf9", "title_fa": "در اینجا چیزی است که در پس تغییر فضایی وجود دارد که تجارت هوش مصنوعی را متلاطم می کند", "summary_fa": "عکاس: Michael Nagle/Bloomberg از طریق Getty Images بلومبرگ/Getty Images تجارت هوش مصنوعی در چند هفته گذشته تحت تاثیر قرار گرفته است. شکست روز پنجشنبه یک کشش آشفته را گسترش داد که با وحشت هفته گذشته در مورد CoreWeave آغاز شد. با هضم معامله‌گران نرخ‌ها، نگرانی‌های مربوط به هزینه‌ها و آشفتگی‌های کلان، هیجانات در تجارت هوش مصنوعی روز به روز در حال تغییر است. تجارت هوش مصنوعی به نظر می رسد که در یک نقطه عطف است. سهام نئوکلادهایی مانند CoreWeave و Nebius طی چند هفته گذشته شکست خورده اند، در حالی که ارزش های ابر مقیاس و سهام تراشه ها تحت تاثیر قرار گرفته اند، حتی در حالی که برخی از غول های فناوری گزارش درآمدهای خوبی داشته اند و مدیران ارشد هجوم به بازارهای آرام عمومی دارند. تا نیمه پایانی ماه سپتامبر، تا حدودی به لطف هیجان در مورد عامل هوش مصنوعی متا، Muse، همه چیز به خوبی پیش می رفت. این بازار تنها دو هفته پیش به آخرین رکورد تاریخی خود رسید. پس چه چیزی در پس تغییر فضای ناگهانی وجود دارد؟ عوامل متعددی برای تقویت آخرین فروش انباشته شده اند: CoreWeave شاهد کاهش برخی از اوراق قرضه خود به قیمت های ناامید بود که باعث ایجاد ترس در مورد هزینه های تامین مالی آن شد که سرریز و سهام را به هم ریخت. سهام از 12 اکتبر 28 درصد کاهش یافته است. تورم و قیمت نفت به ترس از افزایش نرخ های بلندمدت دامن می زند و فدرال رزرو را وادار به افزایش نرخ های کوتاه مدت می کند. تقاضا برای سرمایه بسیار بالاست و نرخ بهره را بالا می برد. نرخ‌های بالاتر به معنای استقراض کمتر است، که به معنای هزینه کمتر برای ساخت هوش مصنوعی است. هزینه کمتر در زیرساخت های هوش مصنوعی به معنای درآمد کمتری نسبت به انتظار سرمایه گذاران برای ذینفعان سرمایه", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "Meta", "تراشه"], "datetime_fa": "۱ آبان • ۱۵:۳۶"}, {"source": "Business Insider", "title": "I’m a comedian whose joke was stolen by an AI creator. I blame Meta and feel powerless.", "link": "https://www.businessinsider.com/comedian-ai-creator-stole-my-joke-i-blame-meta-2026-10", "summary": "George Brett Olson (right) said his joke was taken by an AI account (left). George Brett Olson via Instagram George Brett Olson is one of a set of comedians who've called out AI accounts for ripping off their work. Olson said he was upset with Meta for allowing the situation to persist on its platforms. Instagram's top exec said the platform is invested in promoting original content and would look into the issue. This as-told-to essay is based on an interview with George Brett Olson, one of several comedians who have lately called out AI accounts for ripping off their jokes. It's been edited for length and clarity. Instagram head Adam Mosseri said he would look into what could be done about the issue and that the platform was invested in driving traffic to original content. I started doing stand-up in 2021 after getting burned out from being a winemaker. I'd been doing live shows, and this joke I made about, ironically, AI stealing jobs went viral. The whole joke was about AI stealing jobs and people still blaming immigrants, which is very silly when the most powerful people were saying, \"We're literally coming to take all your jobs.\" Then a friend sent me the video of this lady doing the joke. He's like, \"AI is for real, for real, stealing your jokes.\" It was basically me, in my clothes, but it's a 42-inch butt. It's just the pornification of women online. It was very strange. I'd been doing that joke for a year. I thought of it after working out with my buddy, and we were talking, walking. It takes a lot of work to get a joke stage-ready. It's a lot of repetition, tweaking, driving from place to place to perform. Comedy's not easy. So it's pretty sad to see it happen, especially when the AI comedians who are stealing jokes have more followers than the people they're stealing from. I asked the account behind the joke if she was real. She said yes. Then I asked, \"Did someone help you do this?\" And she just left me on read. She also left a comment saying, \"Sorry, won't happen again,\" and removed a bunch of videos. I've had a bunch of followers try to report it. Adam Mosseri, the head of Instagram , replied and basically said, \"Not all AI's bad. We don't know how we're going to stop it, but people shouldn't be able to steal. Seems like we should do something about that.\" [This was Mosseri's exact comment: \"I don't think it's practical for us to try and ban AI content from the platform. It's gonna be harder and harder to identify, and it's not all bad content", "date_str": "2026-10-23T12:00:01+00:00", "hash": "a30af7901d44d6aa", "title_fa": "من یک کمدین هستم که شوخی او توسط یک خالق هوش مصنوعی دزدیده شده است. من متا را مقصر می دانم و احساس ناتوانی می کنم.", "summary_fa": "جورج برت اولسون (راست) گفت که شوخی او توسط یک حساب هوش مصنوعی (چپ) گرفته شده است. جورج برت اولسون از طریق اینستاگرام جورج برت اولسون یکی از مجموعه‌ای از کمدین‌هایی است که حساب‌های هوش مصنوعی را به دلیل پاره کردن کارشان فراخوانده‌اند. اولسون گفت که از متا ناراحت است که اجازه داده است این وضعیت روی پلتفرم‌هایش ادامه پیدا کند. مدیر ارشد اینستاگرام گفت این پلتفرم روی تبلیغ محتوای اصلی سرمایه گذاری کرده است و این موضوع را بررسی خواهد کرد. این مقاله گفته شده بر اساس مصاحبه ای با جورج برت اولسون، یکی از چندین کمدین است که اخیراً حساب های هوش مصنوعی را به دلیل پاره کردن شوخی های خود فاش کرده اند. برای طول و وضوح ویرایش شده است. آدام موسری، رئیس اینستاگرام گفت که بررسی خواهد کرد که در مورد این مشکل چه کاری می توان انجام داد و این پلتفرم برای هدایت ترافیک به محتوای اصلی سرمایه گذاری شده است. من در سال 2021 بعد از اینکه از شراب‌سازی خسته شدم شروع به استندآپ کردم. من برنامه‌های زنده اجرا می‌کردم، و این شوخی که درباره آن انجام دادم، از قضا، کارهای سرقت هوش مصنوعی در فضای مجازی پخش شد. تمام شوخی درباره هوش مصنوعی بود که مشاغل را می دزدد و مردم همچنان مهاجران را سرزنش می کردند، که بسیار احمقانه است وقتی قدرتمندترین افراد می گفتند: \"ما به معنای واقعی کلمه می آییم تا همه مشاغل شما را بگیریم.\" سپس یکی از دوستان فیلم شوخی این خانم را برای من فرستاد. او می گوید: \"هوش مصنوعی واقعی است، در واقع شوخی های شما را می دزدد.\" در اصل من بودم، در لباسم، اما باسن 42 اینچی است. این فقط پورن سازی زنان آنلاین است. خیلی عجیب بود. من یک سال بود که این شوخی را انجام می دادم. بعد از تمرین با دوستم", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta", "سینما"], "datetime_fa": "۱ آبان • ۱۵:۳۰"}, {"source": "Business Insider", "title": "How a 24-year-old turned advice from the rich and successful into a $37 million business", "link": "https://www.businessinsider.com/school-of-hard-knocks-business-lessons-empire-2026-10", "summary": "School of Hard Knocks founders, from left, Jack Dumoulin, James Dumoulin, and Josh Smith, want to be the Barstool Sports of business. School of Hard Knocks James Dumoulin has turned street interviews with moguls into a business on track for $37 million in revenue this year. School of Hard Knocks uses staged drama to hook viewers and sells consulting services and memberships. Dumoulin and his partners aim to expand and become the \"Barstool Sports of business content.\" As James Dumoulin approaches a private equity investor in Lagos, Nigeria, there's an ominous moment when a bodyguard holding a rifle puts his hand up and demands the content creator stop. \"I have a channel with 24 million followers,\" the School of Hard Knocks cofounder responds, and then asks if he can interview the investor, Adesuwa Rhodes, for one minute about how she got rich. Rhodes steps forward, dressed in a vibrantly patterned suit, and begins answering Dumoulin's questions, explaining how she broke into the business, the importance of persistence, and her faith in God. The video's formula — mixing a high-drama street interview with advice from tes use, prompting companies to race to roll out a fix or risk being hacked. The incident has illustrated how AI is creating a new level of risk for businesses and consumers online, in a week when multiple other cyber threats caused headaches for security workers. Here's what executives and analysts are saying about the biggest cyber threat of the moment — and how AI could make things even worse. Jason Clinton, Anthropic s deputy chief information security officer Anthropic's deputy security chief, Jason Clinton, warns that a \"vulnerability tsunami\" is coming — and says critical infrastructure hasn't caught up. Clinton posted on X on Wednesday about the need to \"patch critical infrastructure\" before core network vulnerabilities get exploited. On Thursday, he issued another warning to companies. \"As bad as things have gotten in the past 4 days, they are going to get a lot worse before they get better,\" he wrote. \"Security leaders, never let a crisis go to waste: please go to your boards and ask for help right now. not for ai, for the basics. (we need to hold on for ~18 months.),\" he added. Andrew Curran, AI analyst Andrew Curran, a prominent AI analyst, weighed in on several cybersecurity threats from Wednesday to Thursday. \"Regarding potential attacks on energy, food, and water infrastructure, the threat is quite real. Someone is currently probing infra and feeling it out, it is an active threat. Even a little preparation can be helpful, just in case,\" Curran wrote on Wednesday in response to an NSA cybersecurity advisory about threat actors. On Thursday, Curran also highlighted a hack of Quest Diagnostics, which he said serves \"roughly half\" of the US's hospitals and physicians. Matt Shumer, AI investor In February, Matt Shumer, the former CEO of Hyperwrite, published a viral essay on his website titled \"Something Big Is Happening,\" in which he warned of large-scale disru", "date_str": "2026-10-23T10:29:53+00:00", "hash": "46fed3a7c077cc61", "title_fa st is credited to the band as well as Gosling s wife, actress Eva Mendes, who has been quietly hyping the comeback on her own feed, including earlier this week when she posted old horror movie footage cued to Dead Man s Bones haunted rock tune In the Room Where You Sleep. Mendes followed that up with a video in which she walks slowly through a grove of trees, cued to Gosling s spectral voice singing down, under the ground/ There s a town there/ I ve been down there in a ghostly voice with the caption, Trying to summon new music from DEAD MAN S BONES. I can feel it in the air After the teaser trailer dropped, Mendes reposted it on her feed and gushed , He came through on this promise to me. 🖤. Former All New Mickey Mouse Club star Gosling has frequently leaned into his singing chops in his films, including Lars and the Real Girl , Blue Valentine , La La Land , Song to Song , and, most memorably, in Barbie , where his pop anthem I m Just Ken earned an Oscar nomination. Gosling dropped his 10-track debut solo album, Angel With Tatooed Wings , in 2000 and then teamed up with Shields to form Dead Man s Bones, whose self-titled debut was recorded with the Silverlake Conservatory s Children s Choir. In addition to singing lead vocals on chilling rock tracks such as Buried in Water, Gosling plays piano, guitar, synthesizer, percussion, cello and bass on songs including the swaying, jazzy My Body", "date_str": "2026-10-23T13:16:01+00:00", "hash": "24eaf063d9ff8651", "title_fa": "درست در زمان هالووین، رایان گاسلینگ در حال احیای گروه راک ترسناک خود Dead Man’s Bones است.", "summary_fa": "رایان گاسلینگ در حال احیای یکی از کنسرت‌های جانبی طولانی مدت خود در زمان هالووین است. ستاره Project Hail Mary روز پنجشنبه (22 اکتبر) اعلام کرد که پس از نزدیک به 20 سال خواب، موسیقی جدیدی از پروژه جانبی راک او، Dead Mans Bones، در راه است. در یک ویدیوی اینستاگرامی، این دو با حضور گاسلینگ و فیلمنامه‌نویس/تهیه‌کننده زک شیلدز (کرامپوس، گودزیلا در برابر کونگ)، اولین موسیقی جدید خود را پس از 17 سال، که قرار است در 27 اکتبر منتشر شود، نمایش دادند. در تطابق با حال و هوای ترسناک اولین LP خود در سال 2009، تیزر مختصر ویدیویی کاملاً مناسب هالووین است. سر مردی را نشان می دهد که در یک مارپیچ شوم شناور است همانطور که او هشدار می دهد، جایی که بادها مانند نفس نیمه شب سیاه هستند. جایی که دست‌ها نمی‌توانند نوری را برای گشایش پیدا کنند، زنجیری که مرا از تو دور می‌کند، با شومی می‌گوید. پس استخوان‌های مرده باید منتظر بمانند تا از خانه‌ای که سایه‌ها گریه می‌کنند بلند شوند. او اضافه می کند که همه اینها باید تغییر کند، با صدای دختر جوانی که برای فریاد زدن 27 اکتبر قطع می شود! وقتی ارواح ما باید برای این کار دنیای ما را ترک کنند، تا هنگام گرگ و میش با ما برقصند و دست تو را در دست من بیاورند، او ادامه می دهد. این پست به گروه و همچنین همسر گاسلینگ، ایوا مندز، بازیگر، نسبت داده می‌شود که بی‌سر و صدا در فید خودش از این بازگشت خبر می‌کرد، از جمله در اوایل این هفته که او فیلم‌های ترسناک قدیمی را به همراه آهنگ راک تسخیرشده استخوان مرده در اتاقی که می‌خوابید، پست کرد. مندز آن را با ویدیویی دنبال کرد که در آن به آرامی در میان بیشه‌ای از درختان قدم می‌زند، با صدای طیفی گاسلینگ که در زیر زمین", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱ آبان • ۱۶:۴۶"}, {"source": "Billboard", "title": "Most Played Track, Biggest Artist & More Key Takeaways From WARM’s 2026 Dance Insights Report", "link": "https://www.billboard.com/lists/most-played-song-biggest-artist-warm-2026-dance-insights-report/", "summary": "The World Airplay Radio Monitor has released its 2026 Dance Insights report, which compares the first half of 2026 to the first half of 2025 across artist performance, label share, collaborations, gender, genre and geography. For the report, WARM ranked the Global Top 100 dance tracks over the first six months of 2026 using airplay data from 218 dedicated dance radio stations in 39 countries. The panel of stations includes BBC Radio 1 and NTS Radio in the United Kingdom, SiriusXM’s BPM and Diplo’s Revolution and Ibiza Global Radio in Spain. ANOTR’s “Talk to You,” featuring 54 Ultra, was the most played track of the half of 2026 with 15,087 plays. The song, which spent 17 weeks at No. 1 on the weekly WARM Global Dance Airplay chart, edges out Sonny Fodera, D.O.D and Poppy Baskcomb’s “Think About Us” (No. 2; 12,908 plays) and HUGEL and SOLTO’s “Jamaican (Bam Bam)” (No. 3; 11,791). Artists from 26 countries across six continents are represented in the top 100, though the U.K. and U.S. are the anchors, as U.K. artists account for 25.6% of artist appearances and U.S. artists account for 20.7%. Still, the rest of the world makes up the majority, with 53.7% of appearances. France (9.4%), Germany and the Netherlands (6.9% each) head up that group, while acts from countries including South Korea, Brazil, Nigeria and Zimbabwe also earn spots. On the genre side, dance pop leads with 40 tracks, or 38.8% of the chart. House (17 songs) and tech house (12) follow, and together the top three genres make up two-thirds of the list. In all, the top 100 spans 17 genres, with Afro house (10 titles) close behind the leaders. Here are our five key takeaways from the report.", "date_str": "2026-10-23T13:00:00+00:00", "hash": "4f5c550d20f2bdf2", "title_fa": "بیشترین آهنگ پخش شده، بزرگترین هنرمند و نکات کلیدی دیگر از گزارش 2026 Dance Insights WARM", "summary_fa": "World Airplay Radio Monitor گزارش 2026 Dance Insights خود را منتشر کرده است که نیمه اول سال 2026 را با نیمه اول سال 2025 از نظر عملکرد هنرمندان، سهم برچسب ها، همکاری ها، جنسیت، ژانر و جغرافیا مقایسه می کند. برای این گزارش، WARM با استفاده از داده‌های پخش از 218 ایستگاه رادیویی اختصاصی رقص در 39 کشور، 100 آهنگ برتر جهانی رقص را در شش ماه اول سال 2026 رتبه‌بندی کرد. پانل ایستگاه‌ها شامل رادیو بی‌بی‌سی ۱ و رادیو NTS در بریتانیا، SiriusXM’s BPM و Diplo’s Revolution و Ibiza Global Radio در اسپانیا است. آهنگ \"Talk to You\" از ANOTR با 54 Ultra، با 15087 پخش، پربازی‌ترین آهنگ نیمه سال 2026 بود. این آهنگ که 17 هفته در رتبه اول جدول هفتگی WARM Global Dance Airplay قرار گرفت، بالاتر از سانی فودرا، D.O.D و Poppy Baskcomb \"Think About Us\" (شماره 2؛ 12908 نمایش) و HUGEL و SOLTO \"Bam3;1,1\" (No. هنرمندانی از 26 کشور در 6 قاره در میان 100 نفر برتر حضور دارند، اگرچه بریتانیا و ایالات متحده مجریان آن هستند، زیرا هنرمندان بریتانیایی 25.6 درصد از حضور هنرمندان و هنرمندان آمریکایی 20.7 درصد را تشکیل می دهند. با این حال، بقیه جهان با 53.7 درصد از حضور اکثریت را تشکیل می دهند. فرانسه (9.4 درصد)، آلمان و هلند (هر کدام 6.9 درصد) در صدر این گروه قرار دارند، در حالی که اقدامات کشورهایی مانند کره جنوبی، برزیل، نیجریه و زیمبابوه نیز امتیاز کسب می کنند. در سمت ژانر، رقص پاپ با 40 آهنگ یا 38.8 درصد از نمودار پیشتاز است. هاوس (17 آهنگ) و خانه فناوری (12 آهنگ) دنبال می شوند و سه ژانر برتر با هم دو سوم لیست را تشکیل می دهند. در مجموع، 100 برتر شامل 17 ژانر است که خانه Afro (10 عنوان) پشت سر رهبران قرار دارد. در اینجا پنج نکته کلیدی ما", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱ آبان • ۱۶:۳۰"}, {"source": "Deadline", "title": "Jonathan Groff Returning To Broadway In Solo Play ‘The Amish Project’", "link": "https://deadline.com/2026/10/jonathan-groff-broadway-amish-project-1237171598/", "summary": "Tony Award winner Jonathan Groff will return to Broadway this winter in The Amish Project, a solo play written by Jessica Dickey and directed by Sarna Lapine. Performances begin Wednesday, February 10, 2027, at the Broadhurst Theatre. Producers Robert Ahrens and Tom Kirdahy announced the show and its star today. An official opening night is [ ]", "date_str": "2026-10-23T13:21:58+00:00", "hash": "cc02269c0b5e825c", "title_fa": "بازگشت جاناتان گروف به برادوی در نمایش انفرادی «پروژه آمیش»", "summary_fa": "جاناتان گروف، برنده جایزه تونی، زمستان امسال در پروژه آمیش، یک نمایشنامه انفرادی به نویسندگی جسیکا دیکی و کارگردانی سارنا لاپین، به برادوی بازخواهد گشت. اجراها از چهارشنبه 10 فوریه 2027 در تئاتر Broadhurst آغاز می شود. رابرت آرنز و تام کرداهی تهیه‌کنندگان این سریال و ستاره آن را امروز اعلام کردند. یک شب افتتاحیه رسمی است [ ] دو پروژه بسیار موفق برادوی با بازیگران     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
