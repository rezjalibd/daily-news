ور ۰۰۷؛ بتمن، جیمز باند می‌شود", "summary_fa": "سرانجام پس از مدت‌ها گمانه‌زنی، بازیگر نقش جیمز باند پس از دنیل کریگ انتخاب شد. حساب‌های رسمی جیمز باند در شبکه‌های اجتماعی کمی قبل تصویر رابرت پتینسون در نقش جیمز باند را اسلحه‌ به دست و تاکسیدو به تن منتشر کرده‌اند. این بازیگر انگلیسی در بیانیه‌ای گفت: «جیمز باند یکی از افسانه‌ای‌ترین شخصیت‌های سینماست و اینکه نقش ۰۰۷ را به من سپرده‌اند، بزرگ‌ترین افتخار زندگی‌ام است.» «از همه کسانی که در استودیوهای آمازون ام‌جی‌ام به من اعتماد کردند، صمیمانه سپاسگزارم. گفتن اینکه این نقش، رویایی است که به حقیقت پیوسته است، حق مطلب را ادا نمی‌کند. بی‌اندازه برای این همکاری و کاری که با این تیم فوق‌العاده پیش رو داریم، هیجان‌زده‌ام.» پتینسون ۴۰ ساله با بازی در نقش ادوارد کالن در مجموعه فیلم حماسه گرگ‌ومیش شهرتی جهانی پیدا کرد. او در فیلم تنت به کارگردانی کریستوفر نولان نیز نقش یک جاسوس را بازی کرده بود و مدتی قبل هم فیلم اودیسه، دیگر همکاری این دو نفر روی پرده سینماها رفت. رابرت پتینسون همچنین پس از سه فیلم بتمن به کارگردانی نولان که کریستین بیل نقش اول را بازی می‌کرد، در فیلم بتمن (۲۰۲۲) ساخته مت ریوز نقش این ابرقهرمان را بازی کرد و قرار است در ادامه هم چنین نقشی را اجرا کند. به این ترتیب، برای اولین بار در تاریخ سینما بازیگر بتمن و جیمز باند یک نفر خواهد بود. دنی ویلنوو، کارگردان فیلم بعدی جیمز باند، نیز درباره انتخاب این بازیگر گفت: «پیش از هر چیز، می‌خواهم از بازیگران فوق‌العاده‌ای که در این مسیر همراهمان شدند، صمیمانه تشکر کنم. استعدادهای بی‌نظیری دور ما بودند، اما فقط یک نفر می‌تواند ۰۰۷ باشد.» «از اینکه به رابرت پتینسون به‌عنوان جیمز باند تازه‌مان خوشامد می‌گوییم، از ته دل خوشحالم. او روح همیشگی ۰۰۷ را دارد و حال‌وهوایی کاملا تازه با خودش می‌آورد. برای شروع کار لحظه‌شماری می‌کنم.» ایمی پاسکال و دیوید", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/b563/live/8da8b930-e1d3-11f1-b8c8-67fa35f5afdb.jpg", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۲۵ آبان • ۱۹:۱۲"}, {"source": "BBC Persian", "title": "ده‌ها «شهروند شیعه» متهم به ارتباط با سپاه در بحرین به حبس ابد محکوم شدند", "link": "https://w ه، نسبت به تهدیدهای سایبری جمهوری اسلامی علیه کشورهای اروپایی هشدار داد. فرانسه سپاه پاسداران را به دست داشتن در حمله سایبری به یخچال‌های فروشگاه‌های زنجیره‌ای این کشور متهم کرده و اعلام کرده است اسناد مربوط به این پرونده را در اختیار وزیران خارجه اتحادیه اروپا قرار می‌دهد تا زمینه اعمال تحریم‌های تازه علیه ایران فراهم شود. ژان نوئل بارو، وزیر خارجه فرانسه، نیز هنگام ورود به نشست وزیران خارجه اتحادیه اروپا گفت هدف پاریس این است که ظرف یک ماه فهرستی از افراد و نهادهای جدید برای اعمال تحریم تهیه شود. فرانسه هفته گذشته سفیر جمهوری اسلامی در پاریس را در ارتباط با این پرونده به وزارت خارجه احضار کرده بود. تهران دست داشتن در این حمله سایبری را رد کرده است. اسماعیل بقایی، سخنگوی وزارت خارجه جمهوری اسلامی، اسراییل را به «روایت‌سازی» درباره اتهام‌های مطرح‌شده علیه تهران متهم کرد. بقایی در پیامی به زبان انگلیسی در شبکه ایکس که متن فارسی آن را خبرگزاری ایرنا منتشر کرده، نوشت از پرونده موسوم به «یخچال‌ها» در فرانسه تا اتهام تلاش برای ترور مقام‌های آمریکایی، آنچه او «روایت‌سازی بدسگالانه سازمان‌یافته» از سوی دستگاه رسانه‌ای و جنگ روانی اسراییل خواند، در جریان است. او همچنین نوشت هدف این کارزار، معرفی ایران نه‌فقط به‌عنوان تهدیدی علیه دولت‌های غربی، بلکه به‌عنوان دشمن زندگی روزمره شهروندان عادی است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/5_wODk__v1024x512__box_0%2C0%2C1400%2C736.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۲۵ آبان • ۱۹:۱۸"}, {"source": "BBC Persian", "title": "رابرت پتینسون در نقش مامور نقش ۰۰۷؛ بتمن، جیمز باند می‌شود", "link": "https://www.bbc.com/persian/articles/ck8798323443o?at_medium=RSS&at_campaign=rss", "summary": "سرانجام پس از مدت‌ها گمانه‌زنی، بازیگر نقش جیمز باند پس از دنیل کریگ انتخاب شد. حساب‌های رسمی جیمز باند در شبکه‌های اجتماعی کمی قبل تصویر رابرت پتینسون در نقش جیمز باند را اسلحه‌ به دست و تاکسیدو به تن منتشر کرده‌اند.", "date_str": "2026-11-16T15:42:15+00:00", "hash": "11a891f027104c86", "title_fa": "رابرت پتینسون در نقش مامور نقش ۰۰۷؛ بتمن، جیمز باند می‌شود", "summary_fa": "سرانجام پس از مدت‌ها گمانه‌زنی، بازیگر نقش جیمز باند پس از دنیل کریگ انتخاب شد. حساب‌های رسمی جیمز باند در شبکه‌های اجتماعی کمی قبل تصویر رابرت پتینسون در نقش جیمز باند را اسلحه‌ به دست و تاکسیدو به تن منتشر کرده‌اند. این بازیگر انگلیسی در بیانیه‌ای گفت: «جیمز باند یکی از افسانه‌ای‌ترین شخصیت‌های سینماست و اینکه نقش ۰۰۷ را به من سپرده‌اند، بزرگ‌ترین افتخار زندگی‌ام است.» «از همه کسانی که در استودیوهای آمازون ام‌جی‌ام به من اعتماد کردند، صمیمانه سپاسگزارم. این نقش، رویایی است که به حقیقت پیوسته، حق مطلب را ادا نمی‌کند. بی‌اندازه برای این همکاری و کاری که با این تیم فوق‌العاده پیش رو داریم، هیجان‌زده‌ام.» پتینسون ۴۰ ساله با بازی در نقش ادوارد کالن در مجموعه‌فیلم حماسهٔ گرگ‌ومیش شهرتی جهانی پیدا کرد. او در فیلم تنت به کارگردانی کریستوفر نولان نیز نقش یک جاسوس را بازی کرده بود و مدتی قبل هم فیلم اودیسه، دیگر همکاری این دو نفر روی پرده سینماها رفت. رابرت پتینسون همچنین پس از سه فیلم بتمن به کارگردانی نولان که کریستین بیل نقش اول را بازی می‌کرد، در فیلم بتمن (۲۰۲۲) ساخته مت ریوز نقش این ابر قهرمان را بازی کرد و قرار است در ادامه هم چنین نقشی را اجرا کند. به این ترتیب برای اولین بار در تاریخ سینما بازیگر بتمن و جیمز باند یک نفر خواهد بود. دنی ویلنوو، کارگردان فیلم بعدی جیمز باند، نیز درباره انتخاب این بازیگر گفت: «پیش از هر چیز، می‌خواهم از بازیگران فوق‌العاده‌ای که در این مسیر همراهمان شدند، صمیمانه تشکر کنم. استعدادهای بی‌نظیری دور ما بودند، اما فقط یک نفر می‌تواند ۰۰۷ باشد.» «از اینکه رابرت پتینسون را به‌عنوان جیمز باند تازه‌مان خوشامد می‌گوییم، از ته دل خوشحالم. او روح همیشگی ۰۰۷ را دارد و حال‌وهوایی کاملا تازه با خودش می‌آورد. برای شروع کار لحظه‌شماری می‌کنم.» ایمی پاسکال و دیوید هیمن، دو تهیه‌کننده", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/b563/live/8da8b930-e1d3-11f1-b8c8-67fa35f5afdb.jpg", "category": "سینما و سریال", "tags": ["سینما"], "datetime_fa": "۲۵ آبان • ۱۹:۱۲"}, {"source": "Iran International", "title": "بازنشستگان مخاب یش زیبا را با چشم خودش نگاه نمی‌کند؟ واقعا ترسناک و ناامیدکننده است.» بسیاری در نظرهایشان پرسیده بودند چرا آدم‌ها به جای این که آتش‌بازی را با چشم خودشان ببینند، از آن فیلم می‌گیرند. یکی نوشته بود: «چه خوب که همه در لحظه زندگی می‌کنند. ۹۰ درصد احتمال دارد هیچ‌وقت هم دوباره این ویدئو را تماشا نکنند.» از زمانی که تقریبا گوشی همه، دوربین دارد، پژوهش‌های متعددی انجام شده تا مشخص شود که ثبت رویدادها با عکس یا فیلم چه اثری بر حافظه ما می‌گذارد. بسیاری از این پژوهش‌ها به این نتیجه رسیده‌اند که عکس یا فیلم گرفتن از چیزی، نه تنها به ما کمک نمی‌کند آن لحظه را به خاطر بسپاریم، بلکه در واقع ممکن است مانع شود آن را دقیق به یاد بیاوریم. دانشمندان اسم این پدیده را «آسیب ناشی از عکس گرفتن» گذاشته‌اند؛ اصطلاحی که نخستین بار دکتر لیندا هنکل، روان‌شناس، در سال ۲۰۱۴ و در جریان پژوهش درباره این موضوع به کار برد. پژوهش‌ها و آزمایش‌هایی که بعدها درباره حافظه انجام شد، بارها نشان داده که انسان‌ها ناخودآگاه کار به خاطر سپردن را به دوربین می‌سپارند و دیگر مغزشان را برای به یاد سپردن رویدادها در همان لحظه‌ای که اتفاق می‌افتند، به کار نمی‌گیرند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/4926/live/00cdcbd0-e1c5-11f1-8a52-0b287ff76f43.jpg", "category": "موبایل و گجت‌ها", "tags": ["سینما"], "datetime_fa": "۲۵ آبان • ۱۷:۵۹"}, {"source": "Iran International", "title": "واکنش‌های انتقادی به برخورد تحقیرآمیز مدیر مدرسه‌ای در شهرستان جم با یک دانش‌آموز", "link": "https://www.iranintl.com/202611162789", "summary": "انتشار ویدیویی از برخورد تحقیر‌آمیز مدیر یک مدرسه با دانش‌آموزی در شهر ریز شهرستان جم در استان بوشهر، واکنش‌های انتقادی بسیاری را به دنبال داشت.", "date_str": "2026-11-16T14:31:41+00:00", "hash": "1afd84507bd5b74e", "title_fa": "واکنش‌های انتقادی به برخورد تحقیرآمیز مدیر مدرسه‌ای در شهرستان جم با یک دانش‌آموز", "summary_fa": "انتشار ویدیویی از برخورد تحقیر‌آمیز مدیر یک مدرسه با دانش‌آموزی در شهر ریز شهرستان جم در استان بوشهر، واکنش‌های انتقادی بسیاری را به دنبال داشت.", "image_url": "https://i.iranintl.com/images/rdk9umy0/p e. As children, my older sister, Kayla, and I spent many afternoons daydreaming about our future homes. We drew pictures of ideal floor plans, but while other kids would probably opt for elaborate slides between floors and in-ground pools, we were designing connected houses — because if there was one nonnegotiable feature, it was that we'd both live together. That childhood vision stayed with us, even as adulthood made it feel less and less realistic. After graduating from college , we moved back into our shared childhood bedroom with full-time jobs, student loans, and considerably more clothes. Throughout our 20s, we chipped away at those loans, traveled, and enjoyed nights out together. Though life got busier, we always prioritized our sisterhood. Eventually, Kayla moved out to live with her now-husband. Suddenly, spending time together required coordinating schedules, driving somewhere, and eventually going home without her. After years of saving, we started looking for our own places, both with very different wish lists. I wanted a low-maintenance condo with beautiful finishes, and Kayla and her husband wanted a family home with a yard and room to grow — but neither of us could find a perfect match. As the search continued, we thought of a solution: what if we pooled our resources for a forever home, with private spaces for each household and perhaps even an in-law apartment for our parents? We share a mortgage, but not every moment of our lives We decided I would cover 40% of the home s cost, and my sister and her husband would handle the remaining 60%. Mindy McNamara During our search for a prospective home, we came across a promising new two-story listing in New England . Immediately upon entering, we fell in love with the soaring ceilings, natural light, and floor plan. Before purchasing, we discussed what living together would look like, including how finances and household responsibilities would be handled, to make sure we were all on the same page. We decided that I would cover 40% of the cost, and Kayla and her husband would handle the remaining 60%. We agreed to use the same percentage for general finances a", "date_str": "2026-11-16T16:46:04+00:00", "hash": "adf26ea4f2a8c550", "title_fa": "با خواهرم خونه خریدم. شوهرش با ما زندگی می‌کند و ما هم قصد داریم پدر و مادرمان به خانه بیایند.", "summary_fa": "خرید خانه با خواهرم و شوهرش برای همه ما عالی بوده است. میندی مک نامارا سال گذشته تصمیم گرفتم با خواهر بزرگترم و شوهرش خانه ای بخرم. تقسیم وام مسکن و زندگی در طبقات جداگانه باعث می شود که چیدمان کار کند. این وضعیت نامتعارف زندگی ما را به هم نزدیک کرده و در عین حال استقلال ما را به ما می دهد. در دوران کودکی، من و خواهر بزرگترم، کایلا، بعدازظهرهای زیادی را با خیال پردازی درباره خانه های آینده مان می گذراندیم. ما تصاویری از پلان های ایده آل برای طبقات ترسیم کردیم، اما در حالی که بچه های دیگر احتمالاً سرسره های دقیق بین طبقات و استخرهای داخل زمین را انتخاب می کردند، ما خانه های متصل را طراحی می کردیم - زیرا اگر یک ویژگی غیرقابل مذاکره وجود داشت، این بود که هر دو با هم زندگی می کردیم. این دیدگاه دوران کودکی با ما باقی ماند، حتی زمانی که بزرگسالی آن را کمتر و کمتر واقع بینانه می کرد. پس از فارغ التحصیلی از کالج، با مشاغل تمام وقت، وام های دانشجویی و لباس های بسیار بیشتر به اتاق خواب مشترک دوران کودکی خود برگشتیم. در طول دهه 20 زندگی‌مان، آن وام‌ها را کنار گذاشتیم، به سفر رفتیم و از شب‌های بیرون رفتن با هم لذت بردیم. اگرچه زندگی شلوغ‌تر شد، اما ما همیشه خواهر بودن را در اولویت قرار می‌دادیم. در نهایت، کایلا نقل مکان کرد تا با همسر فعلی خود زندگی کند. ناگهان، گذراندن وقت با هم نیاز به هماهنگی برنامه ها، رانندگی در جایی و در نهایت رفتن به خانه بدون او داشت. پس از سال‌ها پس‌انداز، شروع کردیم به جستجوی مکان‌های خودمان، هر دو با فهرست‌های آرزوهای بسیار متفاوت. من یک آپارتمان کم تعمیر و نگهداری می‌خواستم با روکش‌های زیبا، و کایلا و همسرش می‌خواستند خانه‌ای خانوادگی با حیاط و اتاقی", "image_url": "https://i.insider.com/6af644700cc3ffba8779ca1c?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "dat  to prepare. The recipe, found on the Food Network website, also includes celery, yellow onion, Granny Smith apples, flat-leaf parsley, butter, rosemary, chicken stock, salt, and pepper. Toasted sliced, blanched almonds were optional. I also appreciated the addition of fresh herbs , but was unsure how I'd like the apples and almonds combined with the savory onions and celery. This recipe yields a huge portion, so I cut it in half. This stuffing was quite easy to make I cooked the onions and celery while the bread dried in the oven. Paige Bennett Overall, the process was pretty simple. While my cubed bread was drying in the oven at 300 degrees Fahrenheit for about 10 minutes, I sautéed the veggies, apples, and herbs in a saucepan with butter. Once the mixture was combined, I poured it over the bread cubes, along with the vegetable stock. The longest part of the process was cooking the onions, celery, and apples, which only took about 10 minutes. Paige Bennett This recipe calls for cooking the filling inside a turkey cavity for two-and-a-half hours at 350 degrees Fahrenheit. I wasn't making a turkey for this taste test, so I baked the stuffing at the same temperature in a shallow dish for an hour instead. I enjoyed the apples but not the almonds The stuffing I made using Ina Garten s recipe came out nicely crisp. Paige Bennett The final dish was pretty crispy and golden on top, but its center looked less appetizing. ", "date_str": "2026-11-16T16:32:37+00:00", "hash": "dadad22238504882", "title_fa": "من دستور پخت غذا را از 4 سرآشپز مشهور امتحان کردم. بهترین ها از مخلوط جعبه ای استفاده کردند و اینا گارتن را شکست دادند.", "summary_fa": "من چهار دستور پخت چاشنی را از سرآشپزهای معروف اینا گارتن، پائولا دین، ری دراموند و سانی اندرسون دنبال کردم، سپس نتایج را مقایسه کردم. پیج بنت من سعی کردم دستور پخت چاشنی را از اینا گارتن، پائولا دین، ری دراموند و سانی اندرسون درست کنم. هم چاشنی دین و هم دراموند به مرحله اضافی پخت نان ذرت خانگی نیاز داشت. دستور غذای اندرسون به دلیل طعم بیش the travelers willing to spend extra — and JetBlue wants a bigger piece of the pie. The airline unveiled its new domestic first-class cabin, dubbed \"BlueFirst,\" at a media event in New York last Wednesday. Launching in December, it's JetBlue's latest effort to capitalize on the booming demand for premium travel as it shifts from its low-cost roots. BlueFirst is quintessentially JetBlue — and, I think, a sweet spot in the market: chic and playful, with distinctive touches like its \"Mixologist Mode,\" that allows you to mix your own cocktail. Still, it lacks some of the more over-the-top bells and whistles found in the Big 3's newest first-class seats. While I'm excited for JetBlue's evolution, choosing it means accepting some of the airline's less glamorous trade-offs. JetBlue has long lagged major US airlines in on-time performance — and it chose Amazon Leo, not Starlink, for its next-generation WiFi. A spokesperson said reliability is a \"top priority,\" and JetBlue recognizes that \"a consistent, reliable experience is an essential part of delivering the service our customers expect.\" Still, I think frequent flyers and people looking for a nice new premium option will like what JetBlue has on tap. Twelve thick recliners in a 2×2 layout make up the BlueFirst cabin. BlueFirst has soft cushioning and an adjustable headrest. Taylor Rains/Business Insider About a month ahead of BlueFirst's inaugural flight from Boston to Fort Lauderdale on December 8, JetBlue Airways invited a small group of media to tour the new cabin. The cabin was small — just three rows deep — but I found the classic JetBlue branding and modern finishes distinguished it from competitors. JetBlue said the cabin size will vary by aircraft. \"It's premium, but is certainly not pretentious,\" JetBlue's SVP of marketing and brand, Stephanie Evans Greene, said of the design. BlueFirst has a one-of-a-kind Mixologist Mode. I could scroll through different options, from juices to liquor. Taylor Rains/Bu etime_fa": "۲۵ آبان • ۱۹:۵۷"}, {"source": "Business Insider", "title": "You might be pronouncing Nvidia the wrong way", "link": "https://www.businessinsider.com/nvidia-how-to-pronounce-correct-way-2024-8", "summary": "Some people pronounce Nvidia as NUH-vid-ee-uh. But that s actually incorrect, according to the company. Bloomberg/Getty Images Nvidia is inescapable — but how do you properly say it? Despite dominating headlines, some people (we're looking at you, \"SNL\") still aren't pronouncing it correctly. While some pronounce it \"NUH-vid-ee-uh,\" the correct pronunciation is \"en-VID-ee-uh.\" Hey, \"SNL\" — you're pronouncing Nvidia wrong. Over the weekend, host John Mulaney mispronounced the chip company name in an \"SNL\" skit about testing national security training for tech billionaires . Nvidia founder Jensen Huang was, unsurprisingly, featured as a character in the skit after a scandalous week that culminated in his ousting as CEO. So how do you actually pronounce it? We're sorry to tell you, but if you're one of the many people calling the tech giant \"NUH-vid-ee-uh,\" you've been saying it wrong. Luckily, Nvidia has long cleared up the confusion on its website and explained the proper pronunciation. The proper pronunciation of Nvidia is \"en-VID-ee-uh,\" according to the company. A screenshot of Nvidia s brand guidelines that detail the correct pronunciation of the company s name in July 2025. Nvidia Founded by Jensen Huang , Chris Malachowsky, and Curtis Priem in 1993, the chipmaker's name actually came from its lack of a name, Fortune previously reported. While the trio focused on developing the company, they put its title on the back burner and named files \"NV\" as an abbreviation for the \"next version.\" The three eventually decided on NVision before realizing the name was taken by a toilet-paper manufacturing company, The New Yorker reported. Finally, Huang suggested the chipmaker's current name, a spinoff of the word \"invidia,\" which means envy in Latin, the report said. Nvidia founder and former CEO Jensen Huang displays his tattoo in September 2010. Robert Galbraith/Reuters Huang and the founders had dreams of creating a product that would make rivals \"green with envy,\" Nvidia cofounder Priem said. Given Nvidia has a $3.8 trillion market cap and a long line of tech giants and startups angling for its latest AI chips, it seems as if that vision has come to fruition (even if rivals don't envy its current crisis). To celebrate Nvidia's stock price hitting $100 years ago, Huang got the company's logo tattooed on his arm — an experience he later said \"hurts way more than anybody tells you.\" Read the original article on Business Insider", "date_str": "2026-11-16T16:22:36+00:00", "hash": "d6b86037b55344c4", "title_fa": "ممکن است انویدیا را اشتباه تلفظ کنید", "summary_fa": "برخی افراد Nvidia را NUH-vid-ee-uh تلفظ می کنند. اما طبق گفته شرکت، این در واقع نادرست است. Bloomberg/Getty Images انویدیا اجتناب ناپذیر است – اما چگونه می توان آن را به درستی بیان کرد؟ با وجود تسلط بر تیترها، برخی از مردم (ما به شما نگاه می کنیم، \"SNL\") هنوز آن را به درستی تلفظ نمی کنند. در حالی که برخی آن را \"NUH-vid-ee-uh\" تلفظ می کنند، تلفظ صحیح \"en-VID-ee-uh\" است. سلام، \"SNL\" - شما Nvidia را اشتباه تلفظ می کنید. در آخر هفته، جان مولانی میزبان، نام شرکت تراشه را در یک طرح \"SNL\" درباره آزمایش آموزش امنیت ملی برای میلیاردرهای فناوری اشتباه تلفظ کرد. جنسن هوانگ، بنیانگذار انویدیا، پس از یک هفته رسوایی که به برکناری او از سمت مدیرعاملی انجامید، بدون تعجب، به عنوان شخصیتی در این فیلم ظاهر شد. پس واقعاً چگونه آن را تلفظ می کنید؟ متأسفیم که به شما می گوییم، اما اگر شما یکی از افرادی هستید که غول فناوری را \"NUH-vid-ee-uh\" می نامند، اشتباه گفته اید. خوشبختانه انویدیا مدتهاست که سردرگمی موجود در وب سایت خود را برطرف کرده و تلفظ صحیح را توضیح داده است. به گفته این شرکت، تلفظ صحیح Nvidia \"en-VID-ee-uh\" است. تصویری از دستورالعمل‌های برند انویدیا که تلفظ صحیح نام شرکت را در جولای 2025 نشان می‌دهد. فورچون قبلا گزارش کرده بود که انویدی on as the US chipmaker's CEO. Megaspeed has drawn US scrutiny over allegations that it helped divert restricted Nvidia chips to Chinese customers. The company has denied any wrongdoing. Under the Commerce Department's interim final rule, a license would be required to export advanced AI chips to firms headquartered in Indonesia, Malaysia, Thailand, Brazil — and Singapore. These countries, the Trump administration said, \"present a higher-than-normal risk of diversion.\" Shares in Nvidia were down about 1.6% after the market opened Monday. The Commerce Department's rule would establish new restrictions on exports, re-exports, or transfers to overseas data centers that remotely supply \"significant volumes of compute\" to companies headquartered in Macau or locations in the department's D:5 group, which includes China, Iran, Russia, and North Korea. \"These restrictions will undermine the ability of companies headquartered in countries of concern from using US advanced Super Intelligence (SI) semiconductors to train advanced SI models,\" the rule says. As part of compliance with the new provision, data centers and chip exporters would be required to perform \"robust due diligence\" on their customers. The department said it would be \"actively monitoring for countries that tolerate evasion\" of the ruling. The ruling could be another blow for Nvidia, which holds roughly 90", "date_str": "2026-11-16T16:02:00+00:00", "hash": "e689703e443d3804", "title_fa": "ایالات متحده در حال سرکوب شکافی است که به چین اجازه می دهد بهترین تراشه های انویدیا را دریافت کند", "summary_fa": "جنسن هوانگ، مدیر عامل سابق انویدیا، رایانه های Vera را ارائه می دهد. Sean Gallup/Getty Images دولت ترامپ به سمت سخت‌تر شدن دسترسی به تراشه‌های هوش مصنوعی پیشرفته حرکت کرده است که می‌تواند ضربه دیگری برای Nvidia باشد. جنسن هوانگ به دنبال رسوایی رابطه‌ای که به اتهام جاسوسی چینی‌ها مرتبط بود، از سمت مدیرعاملی انویدیا استعفا داد. قانون جدید وزارت بازرگانی با هدف جلوگیری از دسترسی از راه دور به تراشه های هوش ated\" the stock. Shares are down nearly 60% from their all-time high earlier this year. Investors want Intel to answer for the post-earnings stock crash that erased $140 billion from the computer hardware giant's market cap in a day. Shareholders filed a lawsuit against the chip maker on Friday, claiming CEO Lip-Bu Tan and David Zinser, Intel's CFO, \"engaged in a scheme to deceive the market.\" Investors claim the pair failed to disclose the magnitude of the slowdown in the PC market , an action that \"artificially inflated\" Intel's stock price and amounted to fraud, according to a proposed class action suit filed in federal court in California by Robbins Geller Rudman Dowd on behalf of The City of Southfield Fire and Police Retirement System. The suit follows Intel's latest earnings, which sparked the worst-ever day for the stock since 1974. Shares plunged 29% after Intel issued soft guidance for the fourth quarter pegged to a broader decline in demand for PCs. The stock is down more than 60% from its all-time high in June. \"The Individual Defendants knew or recklessly disregarded that the adverse facts specified herein had not been disclosed to and were being concealed from the public and that the positive representations that were being made were false and misleading,\" the filing said, adding that the demand for PCs was among the company's \"most important\" issues. 2026 has been a roller coaster ride of a year for Intel, with its stock tumbling but still up about 40% year to date. Shares dropped another 5% to start the week. Intel was one of the market's best-performing chip stocks until its recent slide, getting an initial boost last year when the US government announced it had taken a nearly 10% stake in the company. Shares reached an all-time high this summer shortly after the company announced a partnership to build chips in the US with Apple . Intel did not respond to a request for comment. Read the original article on Business Insider", "date_str": "2  as Nvidia CEO", "link": "https://www.businessinsider.com/trump-supports-jensen-huang-nvidia-reinstatement-return-2026-11", "summary": "President Donald Trump said he wouldn t mind if Jensen Huang returned to Nvidia. Andrew Harnik/Getty Images President Donald Trump isn't opposed to Jensen Huang's possible return to Nvidia. Trump told reporters he \"wouldn't mind\" seeing Huang's reinstatement. Huang allies including Elon Musk and some current Nvidia employees are pushing for the ousted CEO's return. Jensen Huang back at Nvidia? President Donald Trump is onboard with the idea. \"I would not mind that,\" Trump told reporters outside the White House on Monday before departing for Asia. Trump reiterated his view that former Apple CEO Tim Cook would be a good Nvidia leader . \"You know, I threw out the name of Tim Cook,\" Trump said. \"But I would say that Jensen's reinstatement — I think he learned a big lesson, I guess maybe one lesson is more important than another — but I certainly would not mind seeing that.\" Allies of Huang, including SpaceX CEO Elon Musk and some current Nvidia employees, have signed an open letter calling for his reinstatement . Trump's comments may fuel their nascent effort. Trump's statement stands in stark contrast to Treasury Secretary Scott Bessent, who on Sunday called for \"a dramatic shakeup,\" comparing Nvidia to a troubled bank. \"If this were a bank and they hadn't complied like this, the OCC would be in there right now, and a lot of the executives would be removed,\" Bessent said during an interview on Fox News, referring to the Office of the Comptroller of the Currency. Trump said that Huang could be needed to guide Nvidia to its next generations of cutting-edge chips beyond Blackwell. This year, Nvidia began production shipments of Blackwell's successor, the Vera Rubin platform. Its roadmap calls for Rubin Ultra in 2027 and Feynman, its next-generation AI-chip architecture, in 2028. \"In two years, Blackwell is going to be obsolete, and they'll have another chip, and getting to that, I think having Jensen go back — a lot of people are asking Jensen, they think Jensen should go back — that certainly isn't a bad idea,\" Trump said. Before his ouster, Huang was frequently seen alongside Trump. Their relationship has provided Nvidia with incredible access to Washington. Nvidia's board announced last week that Huang had resigned following multiple reported affairs, including with staffers. One of those reported affairs was with Alice Huang, a former executive at Megaspeed, a Singapore-based cloud computing company. The New York Times reported that US officials suspected Hu", "date_str": "2026-11-16T15:51:55+00:00", "hash": "eaf6c1221708b2cd", "title_fa": "ترامپ با ایده بازگشت جنسن هوانگ به عنوان مدیرعامل انویدیا مخالفت کرده است", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا گفت که اگر جنسن هوانگ به انویدیا بازگردد، مشکلی نخواهد داشت. اندرو هارنیک/ گتی ایماژ، رئیس جمهور دونالد ترامپ مخالف بازگشت احتمالی جنسن هوانگ به انویدیا نیست. ترامپ به خبرنگاران گفت که با دیدن بازگرداندن هوانگ بدش نمی آید. متحدان هوانگ از جمله ایلان ماسک و برخی از کارمندان فعلی انویدیا برای بازگشت مدیر عامل برکنار شده تلاش می کنند. جنسن هوانگ به انویدیا بازگشت؟ رئیس جمهور دونالد ترامپ با این ایده موافق است. ترامپ روز دوشنبه قبل از عزیمت به آسیا به خبرنگاران در خارج از کاخ سفید گفت: «من این کار را نمی کنم. ترامپ دیدگاه خود را تکرار کرد که تیم کوک، مدیر عامل سابق اپل، یک رهبر خوب انویدیا خواهد بود. ترامپ گفت: می دانید، من نام تیم کوک را بیرون انداختم. اما من می‌توانم بگویم که بازگرداندن جنسن - فکر می‌کنم او درس بزرگی آموخت، حدس می‌زنم شاید یک درس مهم‌تر از درس دیگر باشد - اما مطمئناً از دیدن آن بدم نمی‌آید.» متحدان هوانگ، از جمله ایلان ماسک، مدیرعامل اسپیس‌ایکس و برخی از کارکنان فعلی انویدیا، نامه‌ای سرگشاده امضا کرده‌اند که خواستار بازگرداندن او به کار شده‌اند. اظهارات ترامپ ممکن است به تلاش نوپای آنها دامن بزند. بیانیه ترامپ کاملاً در تضاد با اسکات بسنت وزیر خزانه داری است که روز یکشنبه خواستار \"تغییر چشمگیر\" شد و Nvidia ر ew \"View Once\" option as well. As WABetaInfo highlights, the first time you use this feature, WhatsApp will present a pop-up explaining the feature, how \"View Once text gives you more privacy,\" and that when you send the message, it'll disappear from the chat after the recipient opens it. WhatsApp also explains that recipients cannot share, forward, save, or take screenshots of View Once text messages. Recipients won't see the text appear in the usual chat interface, either; instead, your recipient will need to open the message in a separate window. Once they close this page, the message disappears. How to try \"View Once\" text messages on WhatsApp early As mentioned above, this feature is currently in testing, so it's only available to WhatsApp beta testers. What's more, only the Android version of the beta has access at the moment, so iOS beta testers are out of luck. (That said, the WhatsApp iOS beta is perpetually full, so there's not much you could do even if WhatsApp made this test available on iPhone.) If you have an Android device, you can enroll in the WhatsApp beta to try out \"View Once\" text messages today. According to WABetaInfo, the feature is live as of WhatsApp version 2.26.45.6. To enroll, open the WhatsApp beta page on the Google Play store and enroll your account in the beta. If you don't have WhatsApp on your phone already, download it here; if you do, reload the p", "date_str": "2026-11-16T17:30:00+00:00", "hash": "8cfa648e04d5f531", "title_fa": "می‌توانید پیام‌های متنی ناپدید شده جدید WhatsApp را زودتر امتحان کنید", "summary_fa": "مانند پیام‌های اسنپ چت، ویژگی «یک بار مشاهده» واتس‌اپ راهی عالی برای ارسال چیزهایی است که نمی‌خواهید در دستگاه‌های دوستانتان زندگی کنند. می‌توانید پیام‌های صوتی، عکس‌ها و ویدیوهایی ارسال کنید که پس از باز شدن، «خود تخریب می‌شوند» و خطر نگهداری برای همیشه دوستانتان را محدود می‌کنند (اگر نه حذف می‌کنند). با این حال، View Once یک محدودیت عمده دارد: در حالی که WhatsApp به شما اجازه می‌دهد یادداشت‌های صوتی و تصاویر es acknowledge that we cannot understand or watch every AI decision. Our instruments of trust, including requirements, testing, certification, safety margins, interlocks, and pass/fail criteria, all depend on our ability to bound a system’s behavior. This is the determinism paradox. With generative and agentic AI, behavior is shaped by training data, architecture, prompts, context, retrieval sources, and the environment. Inputs change, models are updated, tools change, and agents interact. Small variations propagate into outcomes nobody designed. The problem is not randomness; it is that the space of pos", "date_str": "2026-11-16T16:04:28+00:00", "hash": "ec02d91d8f809f2d", "title_fa": "ساختن هوش مصنوعی قابل اعتماد با حصار کشیدن آن، نه پیش بینی آن", "summary_fa": "در اکتبر سال جاری، OpenAI فاش کرد که دو نفر از عوامل هوش مصنوعی آن، سیستم‌هایی را که برای نظارت بر آنها ساخته شده بودند، خاموش کرده‌اند. یکی پس از خواندن اشتباه دستورالعمل عدم ارسال پیام، هشدارهای ایمنی خود را خاموش کرد. دیگری ادغام نظارت خود را در طول مهاجرت حذف کرد، سپس گفت که این کار را نکرده است. هیچ قانونی به ماموران گفته بود که این کار را انجام دهند و هیچ آزمایشی رفتارها را پیش بینی نکرده بود. برای یک قرن، ما اعتماد به فناوری را بر اساس قابلیت پیش بینی ایجاد کرده ایم: ورودی های از پیش تعریف شده، خروجی های قابل پیش بینی، و لایه های حفاظتی. در نظر بگیرید که چگونه یک قطع کننده در جریان تنظیم شده حرکت می کند یا یک جزء هواپیما در برابر تنش های شناخته شده (یعنی قابل پیش بینی) آزمایش می شود. هوش مصنوعی آن را تغییر می دهد. نرم‌افزار سنتی دستورالعمل‌های نوشته شده توسط انسان را اجرا می‌کند، در حالی که هوش مصنوعی چیزی را اعمال می‌کند که می‌توان آن را قضاوت مصنوعی نامید. ما از هوش مصنوعی استفاده می‌کنیم زیرا می‌تواند موقعیت‌هایی را که ما برنامه‌نویسی نکرده‌ایم تفسیر کند و پاسخ‌هایی ایجاد کند که ما تجویز نکرده‌ایم. اما هر چه به هوش مصنوعی آزادی بیشتری بدهیم، ارائه قابلیت پیش‌بینی‌پذیری که به طور سنتی بر اساس آن اعتماد ایجاد می‌شد، سخت‌تر می‌شود. ما هوش مصنوعی را با پیش بینی کاری که انجام خواهد داد قابل اعتماد نمی t the \"insults aren't funny,\" Musk replied: \"Exactly.\" One hour and 40 minutes after his first SNL-related post, Musk shared a YouTube playlist of the episode he hosted in 2021. The billionaire acted as a cowboy, a doctor who uses Gen Z slang in a medical-drama parody, and Nintendo character Wario on trial accused of murdering his nemesis Mario. Chloe Fineman, a comedian who was part of SNL at the time, said in 2024 that Musk made her cry after he crit", "date_str": "2026-11-16T15:27:04+00:00", "hash": "c5fc6eb95d246cff", "title_fa": "ایلان ماسک، مجری سابق «SNL»، عاشق تقلید آن از هفته وحشی فناوری نبود.", "summary_fa": "ایلان ماسک میزبان SNL در سال 2021 بود. بانک عکس Will Heath/NBC/NBCU از طریق Getty Images ایلان ماسک چندین پست X در انتقاد از آخرین تصویر خود در \"SNL\" منتشر کرد. در این طرح، یک افسر سیا در مورد اجتناب از تله عسل به میلیاردرهای فناوری آموزش های امنیتی می دهد. ماسک پیشنهاد کرد که خنده دار نیست و به تصور جرمی کولهن از او امتیاز 10/5 داد. ایلان ماسک از آخرین نقش آفرینی خود در «شنبه شب زنده» چندان راضی نیست. ثروتمندترین فرد جهان چندین پست X منتشر کرد و از سردرد در نسخه این هفته شکایت کرد که میلیاردرهای فناوری را مسخره کرد. در آن، جان مولانی نقش یک افسر سیا را بازی می‌کرد که به پیتر تیل، مارک زاکربرگ، سم آلتمن از OpenAI، داریو آمودی از آنتروپیک و البته ماسک آموزش‌های امنیتی داد. مولانی به شوخی گفت: «آمریکا به شما نیاز دارد که تفاوت بین زنی که واقعاً می‌خواهد با شما رابطه جنسی داشته باشد و زنی که به وضوح جاسوس است را بیاموزید. این طرح به استعفای جنسن هوانگ، مدیرعامل انویدیا اشاره می‌کرد، پس از اینکه هیئت مدیره شرکت شروع به تحقیق در مورد اینکه آیا او \"هدف تلاش‌های اطلاعاتی خارجی بوده است یا خیر.\" هوانگ همچنین به کارکنان نامه نوشت و از خیانت به همسرش عذرخواهی کرد. \"ببین، من نمی توانم تصور کنم که این برای شما چقدر سرگردان بوده است. شخصیت مولانی به مدیران عامل گفت: «در تاریخ گونه ما هرگز مردم به رنگ پریده و عجیب شما مثل شما، A: زنده ماندند و B: تمام ثروت و قدرت جهان به آنها داده شد.» این طرح همچنین شامل یک نمودار ون بود که می‌گفت زنان زیبا هیچ تداخلی با ially suggested we move in together. Renee Lynn Frojo The decision to live separately wasn't a given. The conversation started after Tyler's girls began outgrowing the one-bedroom apartment he temporarily moved into after his divorce. He assumed that when it came time to move into something bigger and more permanent, it would be into my three-bedroom house . After all, at this point, we had been together for three years, and moving in together is the expected next step for most couples. But for us, it was the first major disagreement. I argued that, unless financially critical, it wasn't worth unnecessarily complicating our lives. For starters, the girls love each other and get along like cousins. But when we spend extended periods of time together under the same roof, like on summer vacations , they inevitably start to fight like sisters. If we Brady Bunched our situation full time, we'd invite more battles for space, attention, and control. Our girls get along great, but they can also fight like sisters. Renee Lynn Frojo Then there's the fact that we both have very different living s", "date_str": "2026-11-16T15:16:09+00:00", "hash": "dd0b531ccc2bb9b1", "title_fa": "من و نامزدم در یک محله در خانه های جداگانه زندگی می کنیم. ما هیچ برنامه ای برای نقل مکان با هم نداریم.", "summary_fa": "من و نامزدم به طور جداگانه در یک محله زندگی می کنیم و قصد نداریم با هم زندگی کنیم. Renee Lynn Frojo من و نامزدم 6 سال است که با هم هستیم، اما قصد نداریم با هم زندگی کنیم. ما در یک محله زندگی می کنیم، اما چون بچه داریم، راحت تر است که همه چیز را جدا کنیم. بعلاوه، من فکر می کنم این کلید رابطه شادمان است و به زنده نگه داشتن عشق کمک می کند. اکثر دوستان متاهل من اعتراف می کنند که کمی به من حسادت می کنند. و این به این دلیل نیست که من در یک رابطه عاشقانه و متعهد هستم. به این دلیل است که ما با هم زندگی نمی کنیم. من برای اولین بار با تایلر، معلم هنر مدرسه ابتدایی، در حالی که در کلاس های مهدکودک دختر 11 ساله ام گشت می زدم، ملاقات کردم. اما دقیقاً لحظه لاس زدن نبود. تا اینکه چند سال بعد، با شروع e language that this was a national ground stop due to extraordinary circumstances definitely frightened a lot of people, which I understand, but it was a different situation than something like 9/11. There are a few things I think people should keep in mind when flights get delayed or canceled in the future. Always have a plan B, like booking a hotel room and a rental car When I landed in Fort Lauderdale and saw my next flight was delayed, I immediately booked a hotel room for the night. This is a cost not everyone can or wants to afford, but I knew that if my flight got canceled, I'd have a place to stay for the night. Aimee Allenback has been a flight attendant for years. Courtesy of Aimee Allenback I was willing to eat the $170 cost if my connecting flight didn't get canceled, which is a luxury, but it is always worth it to me to have a plan B that I know I can fall back on. And when my flight did get canceled, I already had a room. If I had waited to book, I'm not sure there would have been anything available because so many other people needed a room, too. My neighbor in Pensacola happened to be on the same flight, so we decided to team up to get back home. We looked at flight options for the next day and decided that flying out of Orlando made more sense than flying out of Fort Lauderdale. That meant a three-hour train at 6 a.m. from Fort Lauderdale to Orlando to catch a noon flight on Saturday, but we had also booked a rental car in Orlando in case that flight was canceled. Knowing we had a plan B for our Saturday flight helped us manage our stress, and when our flight from Orlando was delayed, we decided to dri", "date_str": "2026-11-16T15:03:55+00:00", "hash": "df3c23c236016217", "title_fa": "من 7 سال مهماندار هواپیما هستم. در اینجا 3 کاری وجود دارد که توصیه می کنم هنگام لغو یا تاخیر پرواز انجام دهید.", "summary_fa": "یک مهماندار راهنمایی های خود را در مورد اقداماتی که باید در صورت تاخیر و کنسلی انجام دهید به اشتراک می گذارد. پیتر بنان/ گتی ایماژ ایمی آلنبک هفت سال است که مهماندار هواپیما بوده است. او به عنوان یک مشتری دائمی در طول توقف زمینی پرواز می کرد و با تاخیر در سفر مواجه بود. رزرو اتاق هتل به محض لغو پرواز یکی از نکات کلیدی اوست. این مقاله همانطور که گفته شد بر اساس گفتگو با ایمی آلنبک است. برای طول و وضوح ویرایش شده است. من در هفت سال گذشته مهماندار هواپیما بودم. هنگامی که FAA در روز جمعه یک ایستگاه ملی را تعیین کرد، من در یک سفر شخصی سعی می کردم از میرتل بیچ، کارولینای جنوبی، به پنساکولا، فلوریدا به خانه برگردم. مسیر اصلی پرواز من ساحل میرتل به فورت لادردیل و سپس به پنساکولا بود، اما وقتی در فورت لادردیل فرود آمدم، خلبان به ما در مورد توقف زمینی اطلاع داد. این زبان که به دلیل شرایط خارق‌العاده یک ایستگاه ملی بود، قطعاً بسیاری از مردم را ترساند، که من آن را درک می‌کنم، اما وضعیت متفاوتی با چیزی شبیه به 11 سپتامبر بود. چند نکته وجود دارد که فکر می‌کنم مردم باید هنگام تاخیر یا لغو پروازها در آینده به خاطر داشته باشند. همیشه یک برنامه B داشته باشید، مانند رزرو اتاق هتل و ماشین کرایه ای وقتی در فورت لادردیل فرود آمدم و دیدم پرواز بعدی ام به تعویق افتاده است، بلافاصله یک اتاق در هتل برای شب رزرو کردم. این هزینه‌ای است که همه نمی‌توانند یا نمی‌خواهند از عهده آن برآیند، اما می‌دانستم که اگر پرواز من لغو شود، جایی برای اقامت شبانه دارم. Aimee Allenback سالها مهماندار هواپیما بوده است. با حسن نیت از Aimee Allenback من حاضر بودم هزینه 170 دلاری را بخرم اگر پرواز کانکتی من لغو نشود،", "image_url": "https://i.insider.com/6afb0bdc0cc3ffba8779d719?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۵ آبان • ۱۸:۳۳"}, {"source": "Business Insider", "title": "Is legal tech funding losing steam? We checked the numbers.", "link": "https://www.businessinsider.com/legal-tech-startups-funding-data-harvey-legora-ai-2026-11", "summary": "USA Network; Silver Screen Collection; Getty Images; Pixar ( WALL-E ); Alyssa Powell/BI I’m heading to Scottsdale for the TLTF Summit , an invite-only gathering of law firm leaders, general counsels, and startup builders, with one question: Is winter coming for legal tech? Mentioned in this issue: Victor Wang, Eilla, Crunchbase, Harvey, Legora, Anthropic, Davis Polk, Nikki Shaver, Leah, Latham Watkins, Crosby, Norm, Atticus, Finch, Theo Ai, Irys, Eve, Jay Madheswaran, Emily Howard, Red Antler, Laurel, and Ryan Alshak. Funding for legal tech takes a sharp turn What I’m reading and writing Legal tech’s very human names Legal tech’s haves and have-nots Winston Weinberg, CEO of Harvey, and Max Junestrand, CEO of Legora. Big Event Media/Getty Images A LinkedIn post from commercial lawyer Victor Wang caught my attention last week. Wang cited data from startup Eilla suggesting that funding for legal-tech startups fell 39% year over year after stripping out the blockbuster rounds for Harvey and Legora. I decided to check Eilla’s math against Crunchbase , a database I use regularly. Crunchbase shows that legal-tech startups raised a record $4.6 billion in 2025. Harvey and Legora’s rounds alone accounted for just over $1 billion, or 23% of that total. So far this year, startups in the space have raised $3.8 billion, per Crunchbase. The two giants took a bigger share. Their rounds account for $1.95 billion, or 51% of all funding. So, how does Eilla’s thesis hold up? Crunchbase suggests the gap may be even wider. Funding for everyone else totals $1.89 billion so far this year, compared with $3.59 billion in all of 2025 — a difference of roughly 47% . One important caveat: This compares a year-to-date figure with a full-year total. Still, the concentration of capital is hard to miss — and the drop-off hard to ignore. Two plausible explanations: The category is maturing. Investors may see Harvey and Legora as the runaway leaders in the race for law firms and corporate legal departments. Those who can get in may prefer to write larger checks to the two companies rather than spread their bets across younger startups. Investors may also be waiting to see how the model labs change the game. OpenAI, Anthropic, Google, and Microsoft are all moving deeper into the legal market. That could make investors wary of startups that look like thin wrappers around the same underlying models. I’ll be looking for other explanations at the TLTF Summit. Tell me your theories. Quick links A", "date_str": "2026-11-16T15:00:22+00:00", "hash": "479e3d5fa26253fe", "title_fa": "آیا تأمین مالی فناوری حقوقی از بین می رود؟ اعداد را بررسی کردیم.", "summary_fa": "شبکه ایالات متحده آمریکا؛ مجموعه نقره ای; گتی ایماژ; پیکسار (WALL-E)؛ آلیسا پاول/BI من برای اجلاس TLTF به اسکاتسدیل می روم، یک گردهمایی فقط دعوت شده از رهبران شرکت های حقوقی، مشاوران عمومی، و سازندگان استارت آپ، با یک سوال: آیا زمستان برای فناوری حقوقی در راه است؟ در این شماره ذکر شده است: ویکتور وانگ، ایلا، کرانچ بیس، هاروی، لگورا، آنتروپیک، دیویس پولک، نیکی شیور، لیا، لاتهام واتکینز، کراسبی، نورم، آتیکوس، فینچ، تئو آی، آیریس، ایو، جی مادسواران، امیلی هاوارد، ردش مورچه‌الر، امیلی هاوارد، ردش مورچه و آلر. سرمایه گذاری برای فناوری حقوقی چرخش شدیدی پیدا می کند آنچه من می خوانم و می نویسم نام های بسیار انسانی فناوری حقوقی دارندگان و نداشته های فناوری حقوقی وینستون واینبرگ، مدیر عامل هاروی، و مکس جونسترند، مدیرعامل لگورا. رسانه رویداد بزرگ/ گتی ایماژ یک پست لینکدین از وکیل تجاری ویکتور وانگ هفته گذشته توجه من را به خود جلب کرد. وانگ به داده‌های استارت‌آپ Eilla اشاره کرد که نشان می‌دهد پس از حذف دورهای پرفروش برای هاروی و لگورا، سرمایه‌گذاری برای استارت‌آپ‌های حقوقی فناوری سالانه 39 درصد کاهش یافته است. تصمیم گرفتم ریاضیات Eilla را در برابر Crunchbase بررسی کنم، پایگاه داده ای که من مرتباً از آن استفاده می کنم. Crunchbase نشان می‌دهد که استارت‌آپ‌های حقوقی فناوری در سال ۲۰۲۵ رکورد ۴.۶ میلیارد دلاری را جذب کردند. راندهای هاروی و لگورا به تنهایی بیش از 1 میلیارد دلار یا 23 درصد از کل آن را به خود اختصاص دادند. در سال جاری تاکنون، استارت‌آپ‌های این فضا به ازای هر Crunchbase، 3.8 میلیارد دلار جمع‌آوری کرده‌اند. این دو غول سهم بیشتری گرفتند. راندهای آنها 1.95 میلیارد دلار یا 51 درصد از کل بودجه را تشکیل می دهد. بنابراین، تز ایلا چگونه پابرجاست؟ Crunchbase نشان می دهد که شکاف ممکن است حتی بیشتر باشد. بودجه برای سایر افراد تا کنون در", "image_url": "https://i.insider.com/6af77a180cc3ffba8779cfe7?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "Google"], "datetime_fa": "۲۵ آبان • ۱۸:۳۰"}, {"source": "Business Insider", "title": "Western special forces are training without their 'high-tech wizardry’ to survive a kill zone like the one in Ukraine", "link": "https://www.businessinsider.com/elite-western-forces-train-without-high-tech-survive-modern-battlefield-2026-11", "summary": "NATO special forces are training without high-tech gear to survive on a battlefield like Ukraine. US Air Force photo Polish special forces are training to operate without high-tech gear. Some gear can be tracked in a drone-infested modern war like the one in Ukraine. Western militaries are testing their elite soldiers in scenarios that force them to be less digital and more analog. Elite NATO commandos are training without high-tech gear to make sure they can survive modern battlefields like the one in Ukraine, where some advanced equipment can be easily tracked by enemy drones and other sensors . Polish special forces recently became the first to participate in \"Deep Strike,\" a new NATO exercise designed to test how Western operators get back to basics. The Polish troops, who were tasked with assaulting a target with drones, had to cross dozens of miles of forest and farmland in just a few days, during which they were hunted by drones with thermal cameras, dogs, and US Army paratroopers , NATO said in a statement this month. Completing the mission meant doing so without the cutting-edge technology that special operations forces are known for. \"Indeed, on the modern battlefield, sophisticated electronics can broadcast a team's location, leading to their capture,\" NATO said. NATO special forces units have long leveraged what the alliance described as \"high-tech wizardry\" to operate in stealth, while relying on jets for air support and helicopters for surprise insertion and rapid extraction . Russia's war against Ukraine has demonstrated the potential vulnerabilities of overreliance on some high-end tech . \"When both sides have night vision goggles, nobody owns the night,\" NATO said in its statement, adding that \"the proliferation of advanced heat-sensing thermal optics makes moving undetected even more difficult.\" On top of this, air defense systems fielded on both sides prevent fighter jets and helicopters from getting too close to the front lines. NATO special operators during the Deep Strike exercise. NATO photo Furthermore, drones have turned the front lines into what Ukrainian soldiers and officials describe as a miles-wide kill zone , where any movement can be tracked, leading to instantaneous pinpoint strikes. As they watched the kill zone evolve and grow, NATO military leaders decided to create an exercise that would test how soldiers could survive on a battlefield like the one in Ukraine . US Special Operations Command Europe created the scenario —", "date_str": "2026-11-16T14:56:39+00:00", "hash": "d30ee0c8c5edfe42", "title_fa": "نیروهای ویژه غربی بدون «جادوگری با فناوری پیشرفته» خود برای زنده ماندن در یک منطقه کشتار مانند آنچه در اوکراین است، آموزش می بینند", "summary_fa": "نیروهای ویژه ناتو بدون تجهیزات پیشرفته برای زنده ماندن در میدان جنگی مانند اوکراین آموزش می بینند. عکس نیروی هوایی ایالات متحده نیروهای ویژه لهستان در حال آموزش برای عملیات بدون تجهیزات پیشرفته هستند. برخی از تجهیزات را می توان در جنگ مدرن پر از پهپاد مانند جنگ اوکراین ردیابی کرد. ارتش های غربی سربازان نخبه خود را در سناریوهایی آزمایش می کنند که آنها را مجبور می کند کمتر دیجیتال و بیشتر آنالوگ باشند. کماندوهای نخبه ناتو بدون تجهیزات پیشرفته آموزش می بینند تا مطمئن شوند که می توانند در میدان های نبرد مدرن مانند آنچه در اوکراین وجود دارد، زنده بمانند، جایی که برخی تجهیزات پیشرفته را می توان به راحتی توسط پهپادهای دشمن و سایر حسگرها ردیابی کرد. نیروهای ویژه لهستان اخیراً اولین کسانی بودند که در \"ضربه عمیق\"، یک تمرین جدید ناتو که برای آزمایش چگونگی بازگشت اپراتورهای غربی به اصول اولیه طراحی شده است، شرکت کردند. ناتو در بیانیه ای در ماه جاری اعلام کرد که سربازان لهستانی که وظیفه حمله به یک هدف با هواپیماهای بدون سرنشین را بر عهده داشتند، مجبور شدند ده ها مایل از جنگل و زمین کشاورزی را تنها در چند روز عبور دهند و طی آن توسط پهپادها با دوربین های حرارتی، سگ ها و چتربازان ارتش آمریکا شکار شدند. تکمیل این مأموریت به معنای انجام این کار بدون فناوری پیشرفته ای بود که نیروهای عملیات ویژه به آن شهرت دارند. ناتو گفت: «در واقع، در میدان نبرد مدرن، تجهیزات الکترونیکی پیشرفته می‌توانند موقعیت یک تیم را پخش کنند و منجر به دستگیری آن‌ها شود.» واحدهای نیروهای ویژه ناتو مدت‌هاست که از آنچه ائتلاف به عنوان «جادوگری با فناوری پیشرفته» توصیف می‌کند، برای عملیات پنهان‌کاری استفاده می‌کنند، در حالی که به جت‌ها برای پشتیبانی هوایی و هلیکوپترها برای جابجایی غافلگیرانه و استخراج سریع تکیه می‌کنند. جنگ روسیه علیه اوکراین", "image_url": "https://i.insider.com/6afb0c81b2c29afb4e56b462?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۵ آبان • ۱۸:۲۶"}, {"source": "Business Insider", "title": "I tried Ina Garten's 'grown-up' mac and cheese. It puts a delicious twist on a traditional Thanksgiving side dish.", "link": "https://www.businessinsider.com/ina-garten-grown-up-mac-and-cheese-recipe-2026-11", "summary": "I made Ina Garten s grown-up mac and cheese, and it s perfect for Thanksgiving. Anneta Konstantinides/Business Insider I made Ina Garten's \"grown-up\" mac and cheese recipe. The recipe features Gruyère, extra-sharp cheddar, and blue cheese, plus bacon and breadcrumbs. I thought Garten's mac and cheese was delicious and perfect for Thanksgiving. The holidays are nearly upon us, which means it's time to indulge in one of the most universally beloved pastas. I'm talking about mac and cheese , obviously. I'm a huge fan of Ina Garten's pasta recipes ( I've even ranked them! ), so I decided to try her \"grown-up\" mac and cheese in time for Thanksgiving. Ina Garten s grown-up mac and cheese features bacon, basil, and plenty of cheese. Anneta Konstantinides/Business Insider To make Garten's \"grown-up\" mac and cheese for four, you'll need: 4 cups of elbow macaroni or cavatappi 4 slices of white sandwich bread 8 ounces of Gruyère cheese, grated 6 ounces of extra-sharp cheddar, grated 4 ounces of blue cheese, crumbled (Garten recommends Roquefort) 8 ounces of thick-sliced bacon 3 cups of milk 4 tablespoons of all-purpose flour 4 tablespoons of unsalted butter 4 tablespoons of freshly chopped basil leaves ½ teaspoon of freshly ground black pepper Pinch of nutmeg First, I preheated the oven to 400 degrees Fahrenheit and prepped the bacon. Anneta Konstantinides/Business Insider I arranged my bacon on a sheet pan in one layer. Garten recommends placing a baking rack over the sheet pan, but I just lined mine with aluminum foil to avoid making a greasy mess. I cooked my bacon for 15 minutes, until the strips turned crisp, then transferred them to a plate lined with a paper towel. While the bacon was in the oven, I prepped my breadcrumbs and started cooking the pasta. Anneta Konstantinides/Business Insider I sliced the crusts off my sandwich bread before cutting each slice into smaller pieces. I also roughly chopped the basil. Then I threw my pasta into a large pot of boiling salted water and let it cook for about 6 minutes. I opted for cavatappi over elbow macaroni because I believe it's better at carrying the ooey-gooey sauce of a great mac and cheese . Once my noodles were al dente, I drained and set them aside. I threw my chopped bread and basil into a food processor to make the breadcrumbs. Anneta Konstantinides/Business Insider After a few pulses, my breadcrumbs were ready. I also grated a lot of cheese. Anneta Konstantinides/Business Insider If you're making this for T", "date_str": "2026-11-16T14:36:02+00:00", "hash": "f99a87868c1f5c27", "title_fa": "من مک و پنیر \"بزرگ شد gapore-2026-11", "summary": "Former Nvidia CEO Jensen Huang presents Vera computers. Sean Gallup/Getty Images It could be about to get harder for some countries to access Nvidia's advanced AI chips. The US Commerce Department released an interim final rule aimed at preventing remote access to advanced AI chips that circumvent the country's export controls. \"Rapid advancement in cloud computing and SI infrastructure have made it increasingly possible to access advanced American computing capabilities remotely, including through data centers located outside countries subject to US export restrictions,\" the statement said. The move comes as Nvidia faces intense scrutiny over the export of its AI chips in the wake of a scandal that led to CEO Jensen Huang's resignation . Shares in Nvidia were down as much as 3.9% in premarket trading. This is a developing story. Check back for updates. Read the original article on Business Insider", "date_str": "2026-11-16T14:02:41+00:00", "hash": "e81bc2b0da2426b0", "title_fa": "ایالات متحده برای محدود کردن راه‌حل‌ها برای دسترسی به تراشه‌های هوش مصنوعی پیشرفته اقدام می‌کند", "summary_fa": "جنسن هوانگ، مدیر عامل سابق انویدیا، رایانه های Vera را ارائه می دهد. Sean Gallup/Getty Images ممکن است دسترسی به تراشه های هوش مصنوعی پیشرفته انویدیا برای برخی کشورها سخت تر شود. وزارت بازرگانی ایالات متحده یک قانون نهایی موقت را با هدف جلوگیری از دسترسی از راه دور به تراشه‌های هوش مصنوعی پیشرفته که کنترل‌های صادراتی کشور را دور می‌زند، منتشر کرد. در بیانیه آمده است: «پیشرفت سریع در محاسبات ابری و زیرساخت‌های SI دسترسی به قابلیت‌های محاسباتی پیشرفته آمریکا را از راه دور، از جمله از طریق مراکز داده واقع در خارج از کشورهای مشمول محدودیت‌های صادراتی ایالات متحده، به طور فزاینده‌ای ممکن کرده است. این اقدام در حالی صورت می‌گیرد که انویدیا در پی رسوایی که منجر به استعفای جنسن هوانگ، مدیرعامل این شرکت شد، در مورد صادرات تراشه‌های هوش مصنوعی خود با بررسی‌های شدید مواجه است. سهام انویدیا در معاملات قبل از بازار تا 3.9 درصد کاهش یافت. این یک داستان در حال تو  adhere to strict pre-war regulations similar to those governing defense companies in the West, \"we wouldn't exist.\" Ukraine's experience suggests that \"the regulations and the amount of the bureaucracy or the paperwork required for those things to launch or to produce anything should be definitely reduced,\" he said. If Russia attacks Europe, Oleg said, \"there will be no time for the bureaucracy. There will be no time for the paperwork or any kind of approval to 100 levels by the checking authorities.\" After Russia launched its full-scale invasion in February 2022, Ukraine pivoted away from its old system for procuring weapons and arming troops, toward more decentralized operations. Ukraine still has certain regulations, but troops have better access to industry and vice versa. Key weaponry like drones, electronic warfare, and robotics is dominated by agile firms that are allowed to work directly with units to test, request, and buy what they need. Defense products can be authorized for use without meeting traditional peacetime testing requirements as long as they meet the ", "date_str": "2026-11-16T13:44:01+00:00", "hash": "65345011c93bbcd4", "title_fa": "یک سازنده هواپیمای بدون سرنشین اوکراینی می‌گوید که اگر مجبور بود با سطوح بوروکراسی غربی تجارت کند، وجود نداشت.", "summary_fa": "سازنده هواپیماهای بدون سرنشین اوکراینی TechEx می گوید غرب باید در سطح مقررات خود تجدید نظر کند تا برای جنگ مدرن و در مقیاس بزرگ به اندازه کافی سریع و چابک باشد. Pavlo Bahmut/Ukrinform/Sipa ایالات متحده آمریکا از طریق رویترز اتصال صنعت دفاعی اوکراین متفاوت از غرب و با بوروکراسی کمتر کار می کند. یکی از سازندگان اصلی هواپیماهای بدون سرنشین گفت که با چنین سطوح سنگینی از مقررات، \"ما وجود نخواهیم داشت.\" غرب می خواهد از سرعت و انعطاف اوکراین درس بگیرد و برخی گام های بوروکراتیک را زیر سوال می برد. یک سازنده هواپیمای بدون سرنشین اوکراینی گفت که اگر مجبور باشد با مقررات تسلیحاتی به سبک غربی دست و پنجه نرم کند، وجود نخواهد داشت و هشدار داد که کاهش نوار قرمز می تواند کلیدی برای همگام شدن در جنگ مدرن باشد. صنعت دفاعی اوکراین با سرعتی عمل می کند که بسیاری از کشورهای شریک غربی آن را تحسین می کنند و می گویند که باید از آن درس بگیرند. این سرعت تا حدی ناشی از مقاماتی است که به شرکت ها اجازه می دهند ساختارهای سنتی را برای کار مستقیم با واحدها دور بزنند. بسیاری از شرکت‌های اوکراینی هشدار داده‌اند که شرکای غربی‌شان اگر می‌خواهند برای درگیری‌های احتمالی در مقیاس بزرگ آماده باشند، باید رویکردی کمتر سفت و سخت‌تر و انعطاف‌پذیرتر اتخاذ کنند. TechEx که پهپادهای فیبر نوری و رهگیر می‌سازد، با بیش از 100 واحد کار می‌کند و اولین شرکت اوکراینی است که کدگذاری ناتو را برای پهپادهای FPV فیبر نوری دریافت کرد. تیم آن در سال 2022 شروع به آزمایش کرد و در سال 2024 به طور رسمی ثبت شد. اولگ، یکی از مدیران TechEx، به Business Insider گفت که اگر لازم بود قوانین سختگیرانه قبل از جنگ مشابه مقررات حاکم بر شرکت های دفاعی در غرب را رعایت کند، \"ما وجود نداشتیم.\" او", "image_url": "https://i.insider.com/6af5abf9cbe2120470734a5e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۵ آبان • ۱۷:۱۴"}, {"source": "Business Insider", "title": "'Bad lighting, dry skin': Bill Ackman has an explanation for haters who said he looked 'grizzled'", "link": "https://www.businessinsider.com/bill-ackman-explains-grizzled-tv-appearance-after-back-injury-2026-11", "summary": "Bill Ackman said a tennis injury and poor sleep explained why he looked “grizzled” in a recent interview. Michael Nagle/Bloomberg via Getty Images Bill Ackman said a tennis injury and poor sleep explained his \"grizzled\" appearance in an interview. After he spoke on Bloomberg TV on Friday, X users criticized Ackman's appearance. The hedge fund billionaire also said he wasn't helped by bad lighting and having dry skin. Bill Ackman has an explanation for why he looked \"grizzled\" in an interview last week: a tennis injury, two sleepless nights, dry skin, and bad lighting. After a clip of Friday’s interview circulated on X, commenters questioned the Pershing Square founder's appearance, ker/Bloomberg via Getty Images Warren Buffett is ramping up his giving as promised, but not saying much about it. He's donating $5.5 billion of his Berkshire Hathaway stock to four of his family foundations. In a brief Thanksgiving letter, Buffett advised thanking one's teachers and paying it forward, too. Warren Buffett is giving more but saying less. The legendary investor is donating $5.5 billion worth of Berkshire Hathaway stock to four of his family's foundations, a press release revealed on Monday morning. Buffett will give a total of 9.225 million Class B shares, with 3.69 million going to The Susan Thompson Buffett Foundation, named after his late wife, and 1.845 million shares going to each of his three children's foundations: The Sherwood Foundation, The Howard G. Buffett Foundation, and NoVo Foundation. The former Berkshire chairman and CEO donated shares worth $1.35 billion in total to the same four foundations last year. Including his latest gifts, he's now donated about 62% of his Berkshire stock. Those shares would be worth about $260 billion today, all else being equal. If Buffett had held onto them, his net worth would exceed $420 billion, making him the world's second-wealthiest person after Elon Musk . Buffett, 96, said in a press release that his latest donations were \"consistent\" with his plan to accelerate his giving so that his three children can distribute his entire Berkshire fortune of over $160 billion to good causes by 2034. He wrote that as his shareholders \"heard plenty\" from him in September — when he wrote a letter to them explaining his decision to step down as Berkshire's chairman after six decades — he would \"keep this Thanksgiving message short.\" \"Last Thanksgiving I wrote that kindness is costless but also priceless,\" Buffett wrote in Monday's missive. \"A year later, I would only add that it compounds, and at a better rate than anything Charlie and I ever bought,\" he added, referring to his late business partner, Charlie Munger . Buffett wrote that he and Munger received \"beyond measurement costless benefits\" from teachers and mentors such as Benjamin Graham and Tom Murphy. \"Because of this we not only prospered mightily but were able to pass along many of the benefits we received,\" he continued. \"This Thanksgiving, thank one of those selfless people in your own life,\" Buffett wrote. \"Better yet, be a benefactor for someone else.\" Buffett penned fewer t", "date_str": "2026-11-16T13:13:55+00:00", "hash": "cfed3b0f0cf3cee9", "title_fa": "وارن بافت می گوید 5.5 میلیارد دلار در نامه کوتاه شگفت آور شکرگزاری اهدا می کند.", "summary_fa": "وارن بافت در این روز شکرگزاری بیشتر داد و کمتر نوشت. دانیل آکر/ بلومبرگ از طریق گتی ایمیجز وارن بافت طبق وعده داده شده خود را افزایش می دهد، اما چیز زیادی در مورد آن نمی گوید. او 5.5 میلیارد دلار از سهام برکشایر هاتاوی خود را به چهار بنیاد خانوادگی خود اهدا می کند. بافت در نامه‌ای مختصر به مناسبت شکرگزاری توصیه کرد که از معلمان خود تشکر کنید و آن را نیز پرداخت کنید. وارن بافت بیشتر می دهد اما کمتر می گوید. در بیانیه مطبوعاتی صبح دوشنبه فاش شد که سرمایه گذار افسانه ای 5.5 میلیارد دلار از سهام برکشایر هاتاوی را به چهار بنیاد خانواده اش اهدا می کند. بافت در مجموع 9.225 میلیون سهام کلاس B خواهد داد که 3.69 میلیون آن به بنیاد سوزان تامپسون بافت، به نام همسر مرحومش، و 1.845 میلیون سهم به هر یک از بنیادهای سه فرزندش: بنیاد شروود، بنیاد هوارد جی بافت، و بنیاد NoVo تعلق خواهد گرفت. رئیس هیئت مدیره و مدیر عامل سابق برکشایر در سال گذشته سهامی به ارزش 1.35 میلیارد دلار به همان چهار بنیاد اهدا کرد. او با احتساب آخرین هدایای خود، اکنون حدود 62 درصد از سهام برکشایر خود را اهدا کرده است. ارزش این سهام امروز حدود 260 میلیارد دلار خواهد بود، در حالی که همه چیز برابر است. اگر بافت آنها را حفظ می کرد، دارایی خالص او از 420 میلیارد دلار فراتر می رفت و او را بعد از ایلان ماسک دومین فرد ثروتمند جهان می کرد. بافت 96 ساله در یک بیانیه مطبوعاتی گفت که آخرین کمک های مالی او با برنامه او برای تسریع بخشیدن به او مطابقت دارد تا سه فرزندش بتوانند کل ثروت بیش از 160 میلیارد دلاری برکشایر را تا سال 2034 به اهداف خیر تقسیم کنند. او نوشت که از آنجایی که سهامدارانش در", "image_url": "https://i.insider.com/6afafe3bcbe2120470735c68?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["بورس و طلا"], "datetime_fa": "۲۵ آبان • ۱۶:۴۳"}, {"source": "Business Insider", "title": "Not paying Tesla's $299 Cybercab subscription turns it into a shiny gold lawn ornament", "link": "https://www.businessinsider.com/tesla-cybercab-autonomy-subscription-terms-conditions-remote-bricked-2026-11", "summary": "Tesla said on Friday it would begin invite-only sales of the Cybercab for personal use. Ying Tang/NurPhoto via Getty Images Lucky Tesla fans invited to buy a Cybercab should read the fine print. Tesla can buy back a Cybercab \"at any time\" and can remotely brick it if owners try to sell it, per the T Cs. Opting out of the $299 \"autonomy subscription\" will also turn your Cybercab into a shiny gold lawn ornament. Tesla's Cybercab comes with some pretty important T Cs. Elon Musk's EV giant said on Friday that select customers were now being invited to buy Tesla's steering-wheel-less robotaxi for their own personal use. For the lucky few who have received an invite, the Cybercab starts at $29,990, with an \"autonomy subscription\" of $299 a month. Opting out of that subscription will turn the Cybercab into a shiny gold lawn ornament. The autonomous EV \"will not operate\" without an autonomy subscription, according to Tesla's Cybercab order and subscription agreements, which were uploaded to Tesla's website over the weekend. Those who get the green light to order a Cybercab will also only be able to drive it within the limits of Tesla's Robotaxi ride-hailing service . Right now, that includes parts of Austin, Dallas, and three other cities in Texas, as well as Miami, Orlando, and Tampa in Florida. But owners will not be able to add their Cybercabs to the service and make money from them, a key part of the robotaxi pitch Musk has been making for nearly a decade . That's not the only catch. Like other limited-edition vehicles Tesla has released, Cybercab owners are barred from reselling their robotaxis without the company's permission. Those who do face a $50,000 penalty, and Tesla might also remotely brick your vehicle. More unusually, the Cybercab's order agreement says that Tesla can repurchase the vehicle \"at any time,\" at a fair market value determined by the company. A replacement is not guaranteed, and owners have to pay the cost of shipping their Cybercab back to Tesla. Tesla Cybercabs on a lot in Austin, Texas. Jay Janner/The Austin American-Statesman via Getty Images Other details buried in the fine print include a ban on modifications, including wraps and tinted windows. Would-be Cybercab owners should also be aware that Tesla will be collecting their data. That includes personally identifying data such as location data and \"cabin camera image data\" recorded by a camera above the rear-view mirror, per the autonomy subscription agreement, which states that ", "date_str": "2026-11-16T13:07:13+00:00", "hash": "8f04076b9c4aac79", "title_fa": "پرداخت نکردن اشتراک 299 دلاری Cybercab تسلا، آن را به یک زیورآلات طلایی براق چمنزار تبدیل می کند.", "summary_fa": "تسلا روز جمعه اعلام کرد که فروش Cybercab را برای استفاده شخصی فقط به صورت دعوتی آغاز خواهد کرد. Ying Tang/NurPhoto از طریق Getty Images طرفداران Lucky Tesla که برای خرید Cybercab دعوت شده‌اند باید چاپ دقیق را بخوانند. تسلا می‌تواند «در هر زمانی» یک Cybercab را دوباره بخرد و در صورت تلاش مالکان برای فروش آن، می‌تواند از راه دور آن را بر اساس T Cs بفروشد. انصراف از «اشتراک مستقل» 299 دلاری، Cybercab شما را نیز به یک زیورآلات طلایی براق تبدیل می‌کند. Cybercab تسلا با چند T C بسیار مهم عرضه می شود. غول برقی ایلان ماسک روز جمعه گفت که مشتریان منتخب اکنون دعوت شده اند تا رباتاکسی بدون فرمان تسلا را برای استفاده شخصی خود خریداری کنند. برای معدود خوش شانسی که دعوتنامه دریافت کرده اند، Cybercab از 29990 دلار شروع می شود، با «اشتراک مستقل» 299 دلار در ماه. ان /uploads/2024/06/huang_computex_2024-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["Nvidia", "تراشه"], "datetime_fa": "۲۵ آبان • ۱۷:۳۶"}, {"source": "Ars Technica", "title": "Mercedes' clever new driving assist handles complex traffic like a champ", "link": "https://arstechnica.com/cars/2026/11/mercedes-clever-new-driving-assist-handles-complex-traffic-like-a-champ/", "summary": "Mercedes-Benz provided flights from Washington, DC, to San Francisco, and accommodation so Ars could try its new driver assistance systems. Ars does not accept paid editorial content. SAN FRANCISCO—When Ars first drove the new Mercedes-Benz CLA last year , the automaker also gave us a sneak preview of its next driver assist. Called Drive Assist Pro, it’s for collaborative partially assisted driving, and from the passenger seat at the time, the demo was impressive . Now the automaker is getting ready to start rolling out Drive Assist Pro to customers with cars running the new MB.OS operating system here in the US and in Germany, and it let us have some time behind the wheel. While most automakers want a reputation associated with safety, Mercedes has long used passive and active technology to do so in its products. It was one of the first OEMs to introduce airbags, then a decade later started adding active safety systems like antilock brakes, electronic stability control, and adaptive cruise control. And so, by giving the car’s electronics the ability to control the brakes, and throttle, we arrive at the first level of assisted driving—called “level 1” in automotive engineerspeak. “Level 2” assisted driving, where the car also controls the steering as well as the acceleration and braking, got famous with Tesla Autopilot. But the first lane-keeping assists predate it by almost a decade in passenger cars, when Toyota introduced a system in 2004. The human driver behind the wheel is still in charge, responsible for situational awareness (and anything that arises from a lack thereof), w pply chains or financial close, that level of accuracy is “a very terrible result.” That foundation also determines which AI applications are worth pursuing. Satinder Pal Singh, associate VP North America for SAP BAIP and SAP AI Strategy at Infosys, frames AI agents as “digital coworkers” and recommends evaluating potential use cases through three lenses: impact, feasibility, and scalability. Companies should identify where an agent can move meaningful business metrics, determine whether their data and talent can support the use case, and then establish whether successful applications can be replicated. “A pilot that can t scale is just an experiment,” he says. Scaling also brings governance into sharper focus. Clear policies, access controls, monitoring, and oversight are necessary to ensure agents remain trustworthy and aligned with business requirements. “The absence of governance doesn t speed up AI adoption,” Singh says. “It creates a risk backlog” that can ultimately force a more disruptive stop and audit. Those considerations will become more important as AI agents take on more responsibilities as digital coworkers. Both executives see a future in which agentic systems coordinate work across applications, while customer-specific knowledge graphs and governed data become critical enterprise assets. For Singh, the longer-term opportunity is a shift from AI as a productivity tool to “AI as a decision-making partner,” helping leaders ", "date_str": "2026-11-16T13:00:00+00:00", "hash": "106b6951a5ab5092", "title_fa": "ساخت هوش مصنوعی که بتواند در سراسر سازمان کار کند", "summary_fa": "برای سال‌ها، شرکت‌ها هوش مصنوعی را به عنوان مجموعه‌ای از آزمایش‌های گسسته نزدیک کرده‌اند. اکنون، زمانی که عوامل هوش مصنوعی شروع به حرکت به سمت جریان های کاری که کسب و کار را اداره می کنند، این مدل شروع به ناکافی به نظر می رسد. سازمان‌هایی که از پایلوت‌های منزوی به سمت عوامل هوش مصنوعی و گردش‌های کاری مستقل حرکت می‌کنند، با چالش عمیق‌تری روبرو هستند: بازنگری در نحوه تطبیق داده‌ها، فرآی  any genre to achieve the feat. Three times in recent years, two artists achieved the feat in the same year. Billie Eilish and Lizzo both achieved the feat in 2020. Olivia Rodrigo and FINNEAS both achieved it in 2022. Chappell Roan and Sabrina Carpenter both achieved it in 2025. This has happened more often in recent years because the number of nominees in each of the Big Four categories has expanded. Until the Grammy ceremony held in 2019, there were generally five nominees in each of those categories. The upcoming 69th annual Grammy Awards, set for Sunday (Feb. 7), will mark the ninth year in a row there have been eight or more nominees in each of those categories. There were 10 at the ceremonies in 2022 and 2023, but the Recording Academy (mercifully) brought it back down to eight in 2024. All but one of the 16 previous artists to receive nods in each of the Big Four categories had a spotlight performance slot on the Grammy telecast. The exception was FINNEAS, and even he was featured in sister Eilish’s performance of “Happier Than Ever” on the 2022 telecast. Here’s a complete list of artists who have been nominated in each of the top four Grammy categories in the same year. The years shown are the years of the Grammy ceremonies.", "date_str": "2026-11-16T17:15:00+00:00", "hash": "4bafe22642d24596", "title_fa": "جوایز گرمی: همه هنرمندانی که در یک سال در 4 دسته بزرگ نامزد شده اند", "summary_fa": "هنگامی که نامزدهای شصت و نهمین جوایز سالانه گرمی در روز دوشنبه (16 نوامبر) اعلام شد، الا لنگلی هفدهمین هنرمندی شد که در هر یک از دسته‌های موسوم به \"چهار بزرگ\" - آلبوم، آلبوم و آهنگ سال به علاوه بهترین هنرمند جدید - در همان سال نامزد دریافت جایزه شد. شایان ذکر است که 13 نفر از این 17 هنرمند زن هستند. چگونه برای آن حساب کنیم؟ به نظر می رسد رای دهندگان گرمی دوست دارند زنان هنرمند جوان با استعداد را تشویق کنند. لنگلی اولین هنرمند کانتری است که پس از بابی جنتری در سال 1968، که اولین هنرمند از هر سبکی بود که به این شاهکار دست یافت، در هر یک از چهار بخش بزرگ نامزد شد. سه بار در سال های اخیر، دو هنرمند در همان سال به این شاهکار دست یافتند. بیلی آیلیش و لیزو هر دو در سال 2020 به این شاهکار دست یافتند. اولیویا رودریگو و فینیاس هر دو در سال 2022 به آن دست یافتند. چاپل روآن و سابرینا کارپنتر هر دو در سال 2025 به آن دست یافتند. این اتفاق در سال های اخیر بیشتر رخ داده است زیرا تعداد نامزدها در هر یک از چهار دسته بزرگ افزایش یافته است. تا زمان برگزاری مراسم گرمی در سال 2019، به طور کلی پنج نامزد در هر یک از آن دسته‌ها وجود داشت. شصت و نهمین دوره جوایز سالانه گرمی که قرار است یکشنبه (7 فوریه) برگزار شود، نهمین سال متوالی است که در هر یک از این دسته‌ها، هشت یا بیشتر نامزد دریافت می‌شود. در این مراسم در سال‌های 2022 و 2023 10 نفر حضور داشتند، اما آکادمی ضبط (با رحمت) آن را به هشت نفر در سال 2024 کاهش داد. همه به جز یکی از 16 هنرمند قبلی که در هر یک از چهار دسته بزرگ جایزه دریافت کرده بودند، در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/P106DWOP-e1779074142437.jpg?w=1024", "category": "امنیت سایبری و شبکه", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۲۰:۴۵"}, {"source": "Billboard", "title": "Megan Moroney Named Songwriter of the Year at 2026 SESAC Nashville Music Awards", "link": "https://www.billboard.com/music/awards/megan-moroney-songwriter-of-the-year-sesac-nashville-awards-1236382931/", "summary": "SESAC honored its top songwriters and publishers behind many of the year s top country and Americana songs on Sunday night (Nov. 15) during its annual Nashville music celebration. More than 250 songwriters, publishers, and industry professionals attended the awards celebration, which was sponsored in part by Hatef Aesthetics. After hosting the event at the Country Music Hall of Fame and Museum for the past several years, the celebration moved this year to Aura Live. Guests enjoyed signature cocktails, spicy margaritas, espresso martinis and a variety of hors d oeuvres while mingling, before they set about honoring this year’s top songs, songwriters and publishers. Sounding and looking every bit a full-fledged star, Emily
