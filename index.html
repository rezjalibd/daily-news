ه، از آن نقطه شیرین بین رهایی در رقص و کاتارسیس رویایی پاپ لذت می برد و به همان اندازه از دوشیزه کیتین و مازی استار استفاده می کند. شای با همکاری مجدد با کارما کید، یکی از تهیه کنندگان کلاب خجالتی و آوردن کیسی ام کیو، دست راست اوکلو، رکورد تمیزی را باز می کند که به", "image_url": "https://media.pitchfork.com/photos/6aeb9e29a66e1f90616234f2/16:9/w_1280,c_limit/TwistedTeens_2026_promo_04_MartinCrudo_2250x1500_300%20(2).jpg", "category": "موبایل و گجت‌ها", "tags": ["Apple", "موسیقی"], "datetime_fa": "۱۵ آبان • ۱۸:۰۷"}, {"source": "Rolling Stone", "title": "The Midterms Could Unleash a New Era of Clean Energy in These States", "link": "https://www.rollingstone.com/politics/politics-features/midterms-boost-clean-energy-wisconsin-pennsylvania-arizona-1235653500/", "summary": "Democrats won long-sought “trifectas” in Wisconsin, Pennsylvania, and Arizona. They have big plans for climate action", "date_str": "2026-11-06T15:00:00+00:00", "hash": "b7d6550cb4b8c756", "title_fa": "دوره های میان دوره ای می تواند عصر جدیدی از انرژی پاک را در این ایالت ها آغاز کند", "summary_fa": "دموکرات‌ها در ویسکانسین، پنسیلوانیا و آریزونا برنده «trifectas» شدند. آن‌ها برنامه‌های بزرگی برای اقدام اقلیمی دارند هنگامی که ترامپ در سال‌های 2016 و 2024 انتخاب شد و وعده داد که دولت فدرال را با اقدامات اقلیمی دشمنی کند، بسیاری از حامیان آب و هوا اصرار داشتند که دولت‌های ایالتی و محلی لباس فشار آوردن برای انرژی پاک را بر عهده بگیرند. این تز ائتلاف «آمریکا همه‌جانبه است» است که شهرها و ایالت‌هایی را گرد هم می‌آورد که متعهد شده‌اند از «تعهدات اقلیمی آمریکا... در غیاب رهبری فدرال» حمایت کنند. اخطار ناگفته در این ادعاها این است که ایالت های پیشرو در سیاست آب و هوا در چند بخش لیبرال کشور مانند نیوانگلند و ساحل غربی متمرکز شده اند. پیروزی تاریخی حزب دموکرات در انتخابات میان دوره ای این هفته می تواند آن را تغییر دهد. دموکرات‌ها کنترل اتاق‌های قانونگذاری ایالتی و عمارت فرماندار - که به عنوان \"تریفکتا\" نیز شناخته می‌شود - در آریزونا، پنسیلوانیا و ویسکانسین، سه ایالت که سال‌ها یا دهه‌ها را تحت کنترل جمهوری‌خواهان یا تقسیم‌شده سپری کرده‌اند، تضمین کرده‌اند. سه ایالت نیز در حمایت از انرژی پاک عقب مانده اند. دموکرات‌ها این هفته همچنین trifectas را در مینه‌سوتا، میشیگان و نوادا احیا کردند، اما این ایالت‌ها ایالت‌هایی هستند که آخرین بار در اوایل این دهه کنترل یکپارچه را داشتند. دیوید ویسکوپف، مدیر ارشد سیاست در Climate Cabinet، یک سازمان غیرانتفاعی که برای انتخاب نامزدهای متمرکز بر آب و هوا و تصویب سیاست آب و هوای ایالتی کار می کند، گفت: «غالغه کردن اینکه چقدر این نتایج چشمگیر هستند، غیرممکن است. او گفت که شش ایالتی که دموکرات‌ها در آن‌ها از trifectas محافظت کرده‌اند، اگر کشور خود را تشکیل دهند، یکی از بزرگترین تولیدکنندگان گازهای گلخانه‌ای در جهان خواهند بود و رقیب کانادا و عربستان سعودی هستند. \"این فقط یک فرصت بزرگ برای پیشرفت است.\"", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/midterms-climate-action.jpg?crop=0px%2C0px%2C1800px%2C1014px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۵ آبان • ۱۸:۳۰"}, {"source": "Rolling Stone", "title": "What’s Next for Tom Petty’s Heartbreakers? Benmont Tench and Ron Blair Get Candid", "link": "https://www.rollingstone.com/music/music-features/tom-petty-heartbreakers-reunion-benmont-tench-ron-blair-1235651489/", "summary": "Two of the Heartbreakers dissect the new Origins 1971-1978 box set and open up about their recent onstage reunion in Nashville. \"I wanted to do that forever,\" Tench says", "date_str": "2026-11-06T14:50:17+00:00", "hash": "4c9a97c3e3b17ac1", "title_fa": "بعدی برای تام پتی's Heartbreakers چیست؟ بنمونت تنچ و ران بلر صریح می شوند", "summary_fa": "دو نفر از Heartbreakers مجموعه باکس جدید Origins 1971-1978 را تشریح کردند و درباره دیدار مجددشان روی صحنه در نشویل صحبت کردند. تنچ می‌گوید: «من می‌خواستم این کار را برای همیشه انجام دهم.» وقتی تاریخ تام پتی و قلب‌شکن‌ها گفته می‌شود، سومین ال‌پی آن‌ها، لعنت به اژدرها در سال 1979، اغلب به‌عنوان موفقیتی توصیف می‌شود که برای همیشه شانس آن‌ها را تغییر داد. و در حالی که کمی حقیقت در این مورد وجود دارد، این ws/elsinore-starring-andrew-scott-to-close-camerimage-festival-1236749370/", "summary": "Simon Stone’s true-life drama, shot by Mike Eley, stars Andrew Scott as British actor Ian Charleson, who, succumbing to AIDS, throws himself into a final performance of 'Hamlet.'", "date_str": "2026-11-06T14:24:07+00:00", "hash": "b85964166c742520", "title_fa": "«السینور» به جشنواره دوربین نزدیک", "summary_fa": "درام واقعی سایمون استون که توسط مایک الی فیلمبرداری شده است، اندرو اسکات را در نقش ایان چارلسون بازیگر بریتانیایی ایفا می کند که پس از تسلیم شدن به ایدز، خود را وارد اجرای نهایی \"هملت\" می کند. السینور، مدعی فصل جایزه سیمون استون با بازی اندرو اسکات، سی و چهارمین نسخه Camerimage را می بندد. در این درام واقعی که توسط مایک الی فیلمبرداری شده است، اسکات در نقش ایان چارلسون، بازیگر اسکاتلندی که بیشتر برای ارابه‌های آتش شناخته می‌شود، بازی می‌کند، که در آخرین روزهای زندگی‌اش قبل از تسلیم شدن به ایدز، خود را به صحنه آخر نمایش هملت انداخت. اولیویا کولمن، جو لاک و جانی فلین همبازی هستند. این فیلم به نویسندگی استفان برسفورد در تلوراید به نمایش درآمد و جشنواره فیلم لندن را در اکتبر افتتاح کرد. داستان‌های مرتبط فیلم‌ها بزرگ‌ترین نقش زندگی من -- تا کنون: رجی ابسولوم ستاره‌ای که در فیلم‌های بچه باشگاهی قرار می‌گیرد برای خانه پدری، اعضای سابق فرقه و بازیگران تحسین‌شده برای بررسی مکانیسم‌های کنترل در یک آزمایش سینمایی با یکدیگر همکاری کردند. بازی‌های شب پایانی این سال تعدادی از جوایز را به دنبال دارد. از جمله عناوین رقابت شده برای جایزه قورباغه طلایی جشنواره می توان به پروژه درود مری به کارگردانی فیل لرد و کریستوفر میلر و فیلمبرداری توسط گریگ فریزر اشاره کرد. روز افشای استیون اسپیلبرگ با فیلمبرداری یانوش کامینسکی؛ و مارتین مک‌دوناگ وحشی Horse Nine، فیلمبرداری شده توسط بن دیویس. این مسابقه همچنین شامل Behemoth از Tony Gilroy است! عکس گرفته شده توسط دامیان گارسیا; مینوتور، کارگردان روسی آندری زویاگینتسف و فیلمبرداری همکار قدیمی میخائیل کریچمن. و برنده جشنواره فیلم ونیز May el-Tokhy's Woman Unknown، فیلمبرداری توسط جاسپر جی. اسپنینگ.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/07/FotoJet-2026-07-29T113407.702.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۵ آبان • ۱۷:۵۴"}, {"source": "Hollywood Reporter", "title": "Fox Closes Roku Deal, Creating New Streaming Power Player", "link": "https://www.hollywoodreporter.com/business/digital/fox-closes-roku-deal-creating-new-streaming-power-player-1236749375/", "summary": "The $22 billion deal closed in less than five months. Roku CEO Anthony Wood will join Fox's board and serve as co-chair of the company's digital division.", "date_str": "2026-11-06T14:23:10+00:00", "hash": "6488bcb2c6be7426", "title_fa": "فاکس قرارداد Roku را می بندد، پخش کننده جدید استریمینگ پاور ایجاد می کند", "summary_fa": "قرارداد 22 میلیارد دلاری در کمتر از پنج ماه بسته شد. آنتونی وود، مدیرعامل Roku به هیئت مدیره فاکس خواهد پیوست و به عنوان رئیس مشترک بخش دیجیتال این شرکت خدمت خواهد کرد. شرکت فاکس خرید 22 میلیارد دلاری Roku را تکمیل کرده است و یک بازیکن قدرتمند جدید در رسانه و استریم ایجاد کرده است. بنیانگذار Roku آنتونی وود به هیئت مدیره فاکس می‌پیوندد و همچنین به‌عنوان رئیس مشترک پلتفرم‌های دیجیتال فاکس، بخشی که Roku، Tubi، Fox One و Red Seat Ventures را در اختیار خواهد داشت، خدمت خواهد کرد. لاچلان مورداک، مدیرعامل فاکس در بیانیه‌ای گفت: «بسته شدن این خرید، استراتژی بلندمدت فاکس را پیش می‌برد. از امروز، اولویت اصلی ما برای شرکت ترکیبی این است که به خدمات بی‌امان به مخاطبان و شرکا ادامه دهیم، در حالی که گشودگی و انتخاب را که جوهره پلتفرم Roku است، تقویت کنیم. اشتیاق کارآفرینی مشترک و اعتقاد روشن ما به ساختن آینده همراه با همکاران جدید Roku به ما اعتماد زیادی به فرصت های پیش رو می دهد. وود افزود: ما Roku را بیش از دو دهه پیش شروع کردیم تا راه بهتری برای تماشای تلویزیون به مردم بدهیم و این ماموریت امروز تغییر نمی کند. چیزی که تغییر می کند دسترسی و منابع ماست. فاکس برای فرهنگ Roku احترام عمیقی قائل است و کاملاً تعهد ما را برای باز ماندن برای هر شریک محتوایی به اشتراک می‌گذارد. تیم‌های ما با پشتیبانی و قابلیت‌های فاکس مانند همیشه به ساخت و نوآوری ادامه خواهند داد. من به آنچه کارمندان Roku ساخته‌اند افتخار می‌کنم و از آنچه در آینده می‌آید هیجان‌زده هستم.» این قرارداد، فاکس را به یک بازیگر اصلی در جریان تبدیل می‌کند، با دو تا از بزرگترین پلت‌فرم‌های پخش ویدیوی رایگان در بازار در Tubi و Roku Channel، یک سرویس استریم ممتاز در Fox One، و شاید مهم‌تر از همه،", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Blank-2000-x-1127.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۱۵ آبان • ۱۷:۵۳"}, {"source": "Hollywood Reporter", "title": "Netflix Orders ‘Stranger Things’ Spinoff Series ‘Other Worlds’ Set in the 1950s", "link": "https://www.hollywoodreporter.com/tv/tv-news/netflix-stranger-things-spinoff-other-worlds-1236748971/", "summary": "The live-action prequel series will have a different showrunner and all-new characters and story.", "date_str": "2026-11-06T14:00:00+00:00", "hash": "55a5844529d82635", "title_fa": "نت‌فلیکس سفارش می‌دهد سری اسپین‌آف «چیزهای عجیب» و «دنیای دیگر» که در دهه 1950 اتفاق می‌افتد.", "summary_fa": "سریال پیش درآمد لایو اکشن دارای یک برنامه نمایش متفاوت و شخصیت ها و داستان کاملاً جدید خواهد بود. متن لوگو Stranger Things به نتفلیکس باز می گردد. این استریمر رسما یک سریال پیش درآمد لایو اکشن برای موفقیت عظیم علمی تخیلی خود سفارش داده است. سری جدید با عنوان Other Worlds: A Stranger Things Adventure، در دهه 1950 و تولید آن در نیومکزیکو اتفاق می‌افتد. خالقان و گردانندگان سریال اصلی، برادران دافر به عنوان یکی از سازندگان کار خواهند کرد، اما در غیر این صورت وظایف خلاقانه را به نویسنده قدیمی Stranger Things، کیت ترفری، که همچنین نمایشنامه صحنه ای Stranger Things: The First Shadow و کارگردان برنده گلدن گلوب، جو رایت (Aonement) را بر عهده دارد، واگذار کرده اند که سه قسمت اول را بر عهده خواهد داشت. داستان‌های مرتبط کسب و کار نتفلیکس به روبرتو استانیچی از Mattel ضربه می‌زند تا محصولات و تجربیات مصرف‌کننده را رهبری کند. جزئیات مخفی نگه داشته می شوند، اما عنوان، محیط دهه 1950 نیومکزیکو، و یک اشاره توسط دافرها در بیانیه خود (آسمان را تماشا کنید) مطمئناً نشان می دهد که این نمایش دارای تم یوفو/بیگانگان/فضای بیرونی است. مت و راس دافر در بیانیه‌ای گفتند: ما سال‌هاست که رویای Worlds: A Stranger Things Adventure را در سر می‌پرورانیم، و دیدن آن به واقعیت سورئال و هیجان‌انگیز است. ما از تیم خارق‌العاده‌ی همکارانمان بسیار سپاسگزاریم: کیت ترفری، مجری برنامه، که از فصل دوم در کنار ما بوده و Stranger Things: The First Shadow را نوشته است. و کارگردان ما، جو رایت، هنرمندی درخشان که مدت‌ها کار او را تحسین می‌کردیم. ما نمی توانیم منتظر باشیم تا ببینیم آنها در حال پختن چه چیزی هستند. It's Stranger Things است، اما به طرز هیجان انگیزی تازه است، با یک محیط جدید، قهرمانان و شروران جدید، و جدید... در واقع، ما اجازه نداریم چیز بیشتری", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2025/12/StrangerThings_S5_0697_R.jpg?crop=206px%2C0px%2C3428px%2C1916px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۱۵ آبان • ۱۷:۳۰"}, {"source": "Variety", "title": "‘Avatar: Fire and Ash’ Sets Collectors Edition Featuring Miley Cyrus Q&A and Deleted Scenes", "link": "https://variety.com/2026/shopping/news/avatar-fire-and-ash-collectors-edition-deleted-scenes-1236941277/", "summary": "James Cameron is inviting audiences back to Pandora with a new collector’s edition of “Avatar: Fire and Ash,” arriving on digital platforms and 4K Ultra HD on Dec. 8. The special release, available on Prime Video, will feature more than nine hours of bonus material, including deleted and extended scenes, behind-the-scenes footage and an awards-season [ ]", "date_str": "2026-11-06T15:00:00+00:00", "hash": "e701e65b769a44be", "title_fa": "«آواتار: آتش و خاکستر» مجموعه‌های نسخه مجموعه‌ای با پرسش و پاسخ مایلی سایرس و صحنه‌های حذف شده", "summary_fa": "جیمز کامرون با نسخه کلکسیونی «آواتار: آتش و خاکستر» که در 8 دسامبر روی پلتفرم‌های دیجیتال و کیفیت 4K Ultra HD عرضه می‌شود، مخاطبان را به پاندورا دعوت می‌کند. محصول یا خدمات از طریق پیوند در وب سایت ما، Variety ممکن است کمیسیون وابسته د لمین سالگرد ارتقاء سونیک و نسخه دلوکس قدرتمندی دریافت کرد: نقد آلبوم", "summary_fa": "بهترین گروه‌های راک بزرگ‌ترین آثار خود را با پشت به دیوار خلق می‌کنند - شاهد رولینگ استونز هستند - و موتورهد، نیروگاه افسانه‌ای هارد راک بریتانیایی نیز از این قاعده مستثنی نبود. چهل سال پیش، گروه شاهد انحلال ترکیب کلاسیک خود «No Sleep ‘Til Hammersmith» همراه با یک جفت آلبوم استودیویی پایین‌تر از همتا بود. و همچنین آلبوم آتشین Public Image Ltd.، که لیدون را با گروه وسیعی از جمله استیو وای جادوگر گیتار، جینجر بیکر درامر سابق Cream و برنی وورل از Funkadelic متحد کرد. نتیجه این اتحاد بعید \"Orgasmatron\" بود، مطمئناً تجربی ترین آلبوم موتورهد و آلبومی که واکنش قطبی بسیاری از طرفداران و خود گروه را برانگیخت - در مواد مطبوعاتی این انتشار مجدد به طور مبهمی آمده است: \"تولید آلبوم موضوع بحث های زیادی در بین گروه و طرفداران آنها بود\" - که می گفتند ترکیب آن بیش از حد درهم و برهم بود و از گروه فاصله داشت. اما به شخصه، من آن را دوست داشتم و دارم. در دورانی که طرفداران موسیقی بسیار قبیله‌تر از امروز بودند، Motorhead یکی از گروه‌های کمیاب بود که هم در محافل پانک و هم در محافل هوی متال مورد احترام بود. مانند AC/DC، موسیقی قبلی آن‌ها راک اند رول بدون عضله و استخوان بود - گیتارهای سوزان، درام‌های انباشته‌شده و صدای غرش لمی - مانند نسخه ترمیناتور چاک بری. و در \"Orgasmatron\"، ما همه اینها را در یک محیط صوتی ماجراجویانه تر دریافت کردیم: آهنگ ها موتورهد کلاسیک هستند، اما آوازهای مه آلود گیتار، سازهای کوبه ای و جلوه ها به داخل و خارج از میکس وارد می شوند، به خصوص در آهنگ پایانی، دیگ گیتارهای خروشان، رانندگی درام ها و صدای لمی با افکت هایی شبیه به لمی. با هم", "image_url": "https://variety.com/wp-content/uploads/2026/11/albumcovertreatment-15-1.jpg?w=1000&#038;h=562&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۵ آبان • ۱۸:۳۰"}, {"source": "Variety", "title": "Jim Cramer Leads CNBC Into Creator-Media Era", "link": "https://variety.com/2026/tv/news/jim-cramer-cnbc-creator-media-tv-news-contract-1236941224/", "summary": "CNBC is investing more heavily in Jim Cramer. Th     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
