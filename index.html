 default way to solve theoretical problems in economics, high-energy physics, and other fields, MIT researchers tell WIRED.", "date_str": "2026-10-14T18:15:00+00:00", "hash": "2b8366c8bf6b3599", "title_fa": "هوش مصنوعی برای ریاضی آمد. اکنون در حال تعقیب بقیه علم است", "summary_fa": "محققان MIT به WIRED می گویند که هوش مصنوعی ممکن است به زودی راه پیش فرض برای حل مسائل نظری در اقتصاد، فیزیک انرژی بالا و سایر زمینه ها باشد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان هفته گذشته، من در یک سخنرانی در MIT توسط نیل تامپسون شرکت کردم که پیشرفت در محاسبات و هوش مصنوعی را مطالعه می کند. در طول تنها نیم ساعت، تامپسون یک مورد قانع کننده ارائه کرد که چندین زمینه علمی در شرف تغییر توسط هوش مصنوعی است. در حالی که ریاضیدانان از روشی که هوش مصنوعی رشته خود را خودکار می کند، غرق می شوند، آخرین مطالعه تامپسون نشان می دهد که احتمال، نظریه آمار، نظریه اقتصادی، نظریه انرژی بالا، گرانش و کیهان شناسی، و فیزیک کوانتوم ممکن است به لطف قابلیت های به سرعت در حال تکامل مدل های مرزی در رتبه های بعدی قرار گیرند. این مطالعه نشان می دهد که بین اواسط سال 2024 و اواسط سال 2026، بهترین مدل های هوش مصنوعی از توانایی حل صحیح حدود 2 درصد از مسائل نظری در این زمینه ها به حدود 35 درصد از چنین مسائلی رسیده است. و هیچ نشانه ای مبنی بر کند شدن این پیشرفت وجود ندارد. تامپسون می‌گوید: «در عرض چند سال، ما انتظار داریم که بسیاری از سؤالات تئوری از نظر توانایی هوش مصنوعی در انجام آنها کاملاً تغییر کنند. به طور کلی، آزمایشگاه تامپسون به این موضوع می پردازد که چگونه پیشرفت های علم کامپیوتر بر جامعه تأثیر می گذارد و بر نوآوری تأثیر می گذارد. این مطالعه - که تامپسون در کنار گابریل مانسو، دانشجوی دکترا، و کلودیو مایرینک وردون، دانشمند پژوهشی انجام داد، مشکلاتی را که در مقالات تحقیقاتی که بین دسامبر 2025 تا مه 2026 به صورت آنلاین ارسال شده بود، بررسی کرد و سپس آزمایش کرد"}, {"source": "MIT Tech Review", "title": "The Download: reviving frozen pig kidneys and boosting nuclear power", "link": "https://www.technologyreview.com/2026/10/15/1146755/the-download-reviving-frozen-pig-kidneys-boosting-nuclear-power/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. Pig kidneys that were “frozen” for a year have been brought back to life Pig kidneys that were cooled to -150 °C and stored in a freezer for months have been successfully rewarmed and shown to work again for the first time, say scientists. The kidneys, which are similar in size to human ones, were left in a glass-like state, in one case for over a year. Once they had been rewarmed, tested in machines, and transplanted into pigs, the kidneys regained their color and made urine—key signs they were working. The results are a big milestone. But the team still needs to establish whether the approach could work for humans. Dissect what the breakthrough means for organ transplantation . —Jessica Hamzelou How much more can nuclear power plants give? In this age of rising electricity demand, people are trying to squeeze every last bit of power out of every power plant. Over the past few weeks, there’s been big news about the nuclear industry trying to do just that. Constellation, the largest nuclear operator in the US, announced plans to add nearly a gigawatt of new capacity across 11 existing nuclear reactors at six plants. On October 5, the Department of Energy awarded Vistra a $4.2 billion loan to upgrade three plants. Pushing existing reactors to produce more could quickly provide more clean power for data centers. But just how much additional power can we count on? Read the full story to find out . —Casey Crownhart This story is from The Checkup, our weekly climate and energy tech newsletter. Sign up to receive it in your inbox every Thursday. 10 Climate Tech Companies to Watch: BasiGo and its fleet of electric buses BasiGo is one of MIT Technology Review’s 10 Climate Tech Companies to Watch 2026 , available exclusively to subscribers . BasiGo aims to replace the tens of thousands of diesel-powered buses on sub-Saharan African roads with electric ones that generate far fewer emissions. Its pay-as-you-drive business model helps make EVs more attainable for private bus operators, while the company provides leasing, maintenance, insurance and charging infrastructure. The company has more than 150 electric buses on the road in Kenya and Rwanda, with a reservation list of 1,200 customers. Now it’s targeting another major source of pollution on the roads: trucks. Here’s how BasiGo is working to electrify public transport in Afric", "date_str": "2026-10-15T12:10:00+00:00", "hash": "3e6dcbe757903e0d", "title_fa": "دانلود: احیای کلیه های منجمد خوک و تقویت انرژی هسته ای", "summary_fa": "به گفته دانشمندان، کلیه های خوک که تا 150- درجه سانتیگراد سرد شده و برای ماه ها در فریزر نگهداری می شدند، با موفقیت دوباره گرم شده و برای اولین بار نشان داده شد که دوباره کار می کنند. کلیه‌ها که از نظر اندازه شبیه به کلیه‌های انسان هستند، در یک مورد بیش از یک سال در حالت شیشه‌ای باقی ماندند. پس از گرم شدن مجدد، آزمایش در ماشین‌ها و پیوند به خوک‌ها، کلیه‌ها رنگ خود را به دست آوردند و ادرار ساختند - نشانه‌های کلیدی که کار می‌کنند. نتایج یک نقطه عطف بزرگ است. اما این تیم هنوز باید مشخص کند که آیا این رویکرد می‌تواند برای انسان‌ها کارساز باشد یا خیر. معنی این پیشرفت برای پیوند اعضا را تشریح کنید. در عصر افزایش تقاضای برق، مردم در تلاشند تا آخرین ذره برق را از هر نیروگاهی خارج کنند. طی چند هفته گذشته، اخبار مهمی در مورد تلاش صنعت هسته ای برای انجام این کار منتشر شده است. Constellation، بزرگترین اپراتور هسته ای در ایالات متحده، اعلام کرد که قصد دارد تقریباً یک گیگاوات ظرفیت جدید را در 11 رآکتور هسته ای موجود در شش نیروگاه اضافه کند. در 5 اکتبر، وزارت انرژی به Vistra وام 4.2 میلیارد دلاری برای ارتقاء سه نیروگاه اعطا کرد. تحت فشار قرار دادن راکتورهای موجود برای تولید بیشتر می تواند به سرعت نیروی پاک بیشتری را برای مراکز داده فراهم کند. اما فقط روی چه مقدار نیروی اضافی می توانیم حساب کنیم؟ BasiGo یکی از 10 شرکت فناوری اقلیمی MIT Technology Review برای تماشای 2026 است که به طور انحصاری برای مشترکین در دسترس است. BasiGo قصد دارد ده‌ها هزار اتوبوس دیزلی را در جاده‌های جنوب صحرای آفریقا با اتوبوس‌های برقی جایگزین کند که آلایندگی بسیار کمتری دارند. مدل کسب‌وکار «پرداخت به‌اندازه شما» کمک می‌کند تا خودروهای برقی برای اپراتورهای اتوبوس خصوصی قابل"}, {"source": "MIT Tech Review", "title": "How much more can nuclear power plants give?", "link": "https://www.technologyreview.com/2026/10/15/1146577/nuclear-power-upgrade/", "summary": "In this age of rising electricity demand, people are trying to squeeze every last bit of power out of every power plant possible. Over the past few weeks, there’s been big news about nuclear power plants trying to do just that. Constellation, the largest nuclear operator in the US, announced plans to add nearly a gigawatt of new capacity across 11 existing nuclear reactors at six plants. And on October 5, the Department of Energy awarded a $4.2 billion loan to Vistra for previously announced upgrades at three plants. Pushing existing reactors to produce more could help provide more clean power for data centers, quickly. But just how much additional power can we count on? Upgrading equipment at existing nuclear power plants can allow them to reach a higher capacity; the process is called a power uprate. Operators have been doing this since the 1970s in the US, but it’s been less common in recent years as demand for electricity plateaued and cheap natural gas put financial pressure on nuclear power plants. Some plants closed, and putting in more money to produce more electricity didn’t make much sense at others. Between 2001 and 2010, the US Nuclear Regulatory Commission approved over 80 uprates. Between 2011 and 2020, the number was 33. But with the rise of AI and the related boom in electricity demand, there’s been a shift. We’re seeing shuttered plants like Palisades and Three Mile Island race to reopen. And existing plants are looking to uprate again. Some uprates are minor, involving changes to instrument setpoints or calculations at the plant. But more major overhauls, which can boost reactor power by as much as 20%, require replacing plant equipment. Generally, uprates involve using fuel that’s more highly enriched, or a higher volume of fresh fuel, in the nuclear reactor. That helps produce more steam, which is used to turn a turbine and generate electricity. To handle that additional energy, the main turbines and equipment such as pumps, motors, generators, and transformers are upgraded. The most recent major uprate approved in the US was for three reactors at the Browns Ferry nuclear power plant in Alabama. A $475 million project saw that plant expand its power capacity by 14% between 2018 and 2019. Things could pick up soon, though. Constellation announced plans this week to spend more than $4.3 billion on uprates to 11 reactors. The additional electricity will be enough to power roughly 700,000 US homes. Behind it all? Big Tech money. Google agre", "date_str": "2026-10-15T10:00:00+00:00", "hash": "431a5e9eb9e91446", "title_fa": "نیروگاه های هسته ای چقدر بیشتر می توانند بدهند؟", "summary_fa": "در این عصر افزایش تقاضای برق، مردم در تلاش هستند تا آخرین ذره برق را از هر نیروگاه ممکن خارج کنند. در چند هفته گذشته، اخبار مهمی در مورد نیروگاه‌های هسته‌ای منتشر شده است که تلاش می‌کنند این کار را انجام دهند. Constellation، بزرگترین اپراتور هسته ای در ایالات متحده، اعلام کرد که قصد دارد تقریباً یک گیگاوات ظرفیت جدید را در 11 رآکتور هسته ای موجود در شش نیروگاه اضافه کند. و در 5 اکتبر، وزارت انرژی یک وام 4.2 میلیارد دلاری به Vistra برای ارتقاءهای قبلی اعلام شده در سه نیروگاه اعطا کرد. تحت فشار قرار دادن رآکتورهای موجود برای تولید بیشتر می‌تواند به تامین سریع انرژی پاک‌تر برای مراکز داده کمک کند. اما فقط روی چه مقدار نیروی اضافی می توانیم حساب کنیم؟ ارتقاء تجهیزات در نیروگاه های هسته ای موجود می تواند به آنها اجازه دهد تا به ظرفیت بالاتری دست یابند. این فرآیند افزایش قدرت نامیده می شود. اپراتورها از دهه 1970 در ایالات متحده این کار را انجام می دهند، اما در سال های اخیر کمتر رایج شده است زیرا تقاضا برای برق کاهش یافته و گاز طبیعی ارزان قیمت باعث فشار مالی بر نیروگاه های هسته ای شده است. برخی از نیروگاه‌ها تعطیل شدند و سرمایه‌گذاری بیشتر برای تولید برق بیشتر در برخی دیگر منطقی نبود. بین سال های 2001 تا 2010، کمیسیون تنظیم مقررات هسته ای ایالات متحده بیش از 80 افزایش را تصویب کرد. بین سال های 2011 تا 2020، این تعداد 33 بود. اما با افزایش هوش مصنوعی و رونق ناشی از آن در تقاضای برق، تغییری ایجاد شده است. ما شاهد رقابت گیاهان بسته شده مانند Palisades و Three Mile Island برای بازگشایی هستیم. و کارخانه های موجود به دنبال افزایش مجدد هستند. برخی از افزایش ها جزئی هستند و شامل تغییرات در نقاط تنظیم ابزار یا محاسبات در"}, {"source": "MIT Tech Review", "title": "Six wild ideas for perpetuating your mind", "link": "https://www.technologyreview.com/2026/10/15/1145819/six-wild-ideas-perpetuating-your-mind-cognitive-immortality/", "summary": "Have you ever thought about what makes you you ? Science assures us it has everything to do with the three-pound organ between our ears, with its billions of neurons and trillions of delicate connections. But it’s a lot trickier to explain why we have a sense of self-awareness or to pin down precisely where that first memory of Mommy actually resides. As we age, we forget most of what we’ve experienced, yet there’s still undeniable continuity: At 30, or 50, or 70, you will still be you. To preserve that elusive continuity of self, some far-thinking technologists are working on ways to keep your brain going—even beyond death. Let’s call them the “mind savers.” They’re exploring everything from freezing brains in liquid nitrogen to augmenting living ones to uploading our memories to the cloud. Here, we look at six possible paths for keeping your mind going, how feasible they’d be, and what benefits the ­present-day research might bring—even if cognitive immortality doesn’t pan out. EDDIE GUY Head transplant White’s experiments have been a source of grim fascination ever since. But to a few neuroscientists they’re inspiration, suggesting that one day a human head transplant—or, as some call it, a body transplant—could succeed. The idea’s main proponent is Sergio Canavero, a controversial Italian surgeon who, 10 years ago, even claimed he’d found a volunteer in Valery Spiridinov, a computer programmer suffering from a degenerative muscle disease. Spiridinov initially agreed to have his head transferred to the body of a brain-dead donor in China, but he later bowed out of the plan and instead got married. And that might be just as well. Critics say the procedure would be more like murder than medicine. Or, best-case scenario: Volunteers would be left paralyzed and in need of a ventilator for life. Canavero says that’s not necessarily true. He claims people’s views on the operation will change once they accept that reconnecting severed spinal cords is already possible. He pointed MIT Technology Review to a research article from this past summer that he coauthored with surgeons at Moscow’s Sklifosovsky Research and Clinical Institute for Emergency Medicine. The team cut through the spinal cords of three pigs at a point midway along their backs and then tested whether the severed nerve bodies could be fused back together using a surgical sealant. According to that paper, which appeared in the journal PLOS One , all the pigs regained the ability to stand and even w", "date_str": "2026-10-15T09:00:00+00:00", "hash": "04b6c79dcff976de", "title_fa": "شش ایده وحشیانه برای تداوم ذهن شما", "summary_fa": "آیا تا به حال به این فکر کرده اید که چه چیزی باعث شما می شود؟ علم به ما اطمینان می دهد که همه چیز با اندام سه پوندی بین گوش های ما، با میلیاردها نورون و تریلیون ها اتصال ظریف آن، ارتباط دارد. اما توضیح اینکه چرا ما احساس خودآگاهی داریم یا اینکه دقیقاً جایی که اولین خاطره مامان واقعاً در آن وجود دارد، بسیار دشوارتر است. با بالا رفتن سن، بیشتر چیزهایی را که تجربه کرده‌ایم فراموش می‌کنیم، اما همچنان تداوم غیرقابل انکاری وجود دارد: در 30، یا 50، یا 70 سالگی، شما همچنان خودتان خواهید بود. برای حفظ این تداوم گریزان از خود، برخی از تکنولوژیست های دوراندیش در حال کار بر روی راه هایی هستند که مغز شما را حتی فراتر از مرگ حفظ کنند. بیایید آنها را «صرفه‌جویان ذهن» بنامیم. آنها در حال بررسی همه چیز هستند، از انجماد مغزها در نیتروژن مایع گرفته تا تقویت مغزهای زنده و بارگذاری خاطرات ما در ابر. در اینجا، ما به شش راه ممکن برای حفظ ذهن شما نگاه می‌کنیم، این که چقدر امکان‌پذیر خواهند بود، و اینکه تحقیقات امروزی چه مزایایی می‌تواند داشته باشد - حتی اگر جاودانگی شناختی به نتیجه نرسد. EDDIE GUY پیوند سر، آزمایش‌های وایت از آن زمان تاکنون منبع جذابیت بدی بوده است. اما برای تعدادی از دانشمندان علوم اعصاب، آنها الهام بخش هستند و پیشنهاد می کنند که روزی پیوند سر انسان - یا به قول برخی پیوند بدن - می تواند موفقیت آمیز باشد. طرفدار اصلی این ایده، سرجیو کاناورو، جراح جنجالی ایتالیایی است که 10 سال پیش حتی ادعا کرد که داوطلبی را در والری اسپیریدینوف، برنامه نویس رایانه ای که از یک بیماری تخریبی عضلانی رنج می برد، پیدا کرده است. اسپیریدینوف در ابتدا موافقت کرد که سرش را به جسد یک اهداکننده مرگ مغزی در چین منتقل کنند،"}, {"source": "MIT Tech Review", "title": "Pig kidneys that were “frozen” for a year have been brought back to life", "link": "https://www.technologyreview.com/2026/10/15/1146091/pig-kidneys-that-were-frozen-for-a-year-have-been-brought-back-to-life/", "summary": "Pig kidneys that were cooled to -150 °C and stored in a freezer for months have been successfully rewarmed and shown to work again for the first time, say scientists. They hope to replicate the findings with human organs. The kidneys—which are similar in size to human ones—were left in a glass-like state, in one case for over a year. Once they had been rewarmed, tested in machines, and transplanted into pigs, the kidneys regained their color and made urine—key signs they were working. “Ten years ago … I wouldn’t say I had high hopes it was actually going to work,” says Erik Finger, a transplant surgeon at the University of Minnesota who co-led the work. “After we did the last transplant, I walked out of the room and said, ‘This is a big deal.’” The research was shared at the preprint server bioRxiv and has not yet been peer-reviewed. The kidneys aren’t perfect, and the researchers have yet to demonstrate that they can sustain life over the long term. But the results represent a milestone achievement, say others in the field. “Thank God that someone’s actually managed to do it in one organ and prove that it works,” says Peter Kilbride, a cryobiologist and cofounder of Kyros Kairos, a company focused on improving funding for cryopreservation research, who was not involved in the research. “For years, people have been trying and failing to get to this step. Finally, we’ve got this breakthrough.” “Their work is amazing and will enable us to truly, indefinitely bank organs,” says Korkut Uygun, a biomedical engineer and professor of surgery at Harvard Medical School, who was also not involved in the research. “It is a revolutionary time for transplantation.” Buying time Every year, tens of thousands of organ transplants take place in the US alone. These procedures are thought to have saved 2 million years of life in the last 25 years . But there’s plenty of room for improvement. One major challenge is the lack of available organs. Even when an organ becomes available, it can be difficult to get it to the right recipient within 24 to 36 hours, which is the current limit for preserving human organs. People who receive organ transplants must also take drugs that suppress their immune systems for the rest of their lives. These drugs are meant to stop their bodies from rejecting the new organs. But they come with side effects and increase the risk of infections and cancer. The ability to bank organs for long periods of time holds the promise to address all these chal", "date_str": "2026-10-15T08:43:24+00:00", "hash": "090796ea2fd423cc", "title_fa": "کلیه های خوک که به مدت یک سال \"یخ زده\" بودند دوباره زنده شدند", "summary_fa": "به گفته دانشمندان، کلیه های خوک که تا 150- درجه سانتیگراد سرد شده و برای ماه ها در فریزر نگهداری می شدند، با موفقیت دوباره گرم شده و برای اولین بار نشان داده شد که دوباره کار می کنند. آنها امیدوارند که این یافته ها را با اعضای بدن انسان تکرار کنند. کلیه‌ها - که از نظر اندازه شبیه به کلیه‌های انسان هستند - در یک مورد بیش از یک سال در حالت شیشه‌ای باقی ماندند. پس از گرم شدن مجدد، آزمایش در ماشین‌ها و پیوند به خوک‌ها، کلیه‌ها رنگ خود را به دست آوردند و ادرار ساختند - نشانه‌های کلیدی که کار می‌کنند. اریک فینگر، جراح پیوند در دانشگاه مینه‌سوتا که این کار را رهبری می‌کرد، می‌گوید: «ده سال پیش... نمی‌توانم بگویم امید زیادی داشتم که واقعاً کار کند. «بعد از اینکه آخرین پیوند را انجام دادیم، از اتاق بیرون رفتم و گفتم: «این کار بزرگی است.» این تحقیق در سرور پیش‌چاپ bioRxiv به اشتراک گذاشته شد و هنوز توسط همتایان مورد بررسی قرار نگرفته است. کلیه ها کامل نیستند و محققان هنوز نشان نداده اند که می توانند زندگی را در دراز مدت حفظ کنند. اما دیگران در این زمینه می گویند که نتایج نشان دهنده یک دستاورد مهم است. پیتر کیلبرید، کریوبیولوژیست و یکی از بنیانگذاران Kyros Kairos، شرکتی که بر بهبود بودجه تحقیقاتی در زمینه انجماد متمرکز است و در این تحقیق دخالتی نداشت، می گوید: «خدا را شکر که واقعاً کسی توانسته این کار را در یک اندام انجام دهد و ثابت کند که کار می کند. سال‌هاست که مردم تلاش کرده‌اند و نتوانسته‌اند به این مرحله برسند. در نهایت، ما به این پیشرفت دست یافتیم.» کورکوت اویگون، مهندس زیست پزشکی و پروفسور جراحی در دانشکده پزشکی هاروارد، که او نیز در این تحقیق شرکت نداشت، می‌گوید: «کار آن‌ها شگفت‌انگیز است و ما را قادر"}, {"source": "Business Insider", "title": "United finally made it easier to see if your flight has Starlink", "link": "https://www.businessinsider.com/united-airlines-starlink-check-if-flight-has-wifi-2026-10", "summary": "United Airlines tracker shows it has Starlink on less than 3% of its wide-body airplanes. Massimo Insabato/Archivio Massimo Insabato/Mondadori Portfolio via Getty Images United Airlines released a tool to track which airplanes have Starlink. You can enter your flight number up to 3 days before departure and check for last-minute changes. It also shows that about 43% of United's fleet is equipped with the service. If you're flying with United Airlines to capitalize on Starlink, it's now much easier to know whether your flight will include the fast, free internet service. The airline released a tool on Thursday called the Starlink WiFi Tracker . You can enter your flight number up to 3 days before departure to check its Starlink availability . This isn't infallible, though, as the airline might switch which plane it uses for your flight. However, United says the tool includes updates made in real time for such last-minute changes. United already used texts, emails, and its app to notify passengers if their flight was scheduled to have Starlink, but the new tool lets you check for last-minute changes. It also tracks the progress of Starlink installation across the fleet. As of Thursday morning, 639 aircraft, or about 43% of United's fleet, are equipped with the service. That includes all of its regional airplanes, operated under the United Express brand, and about a third of its other narrow-body airplanes — like the Airbus A321 and Boeing 737. However, Starlink is only on six of its 248 wide-body airplanes, which operate long-haul flights. United said it is installing Starlink on about 20 aircraft a week and plans to complete installations by the end of 2027. Its tool also shows the percentage of daily flights departing from each of its seven hubs that are equipped with Starlink. Chicago O'Hare leads the way at 54%, with San Francisco's 36% at the bottom. Nearly half the airline's daily departures are equipped with Starlink, United said. Starlink has become a notable advantage for United since its main rivals don't have it. American Airlines plans to install Starlink starting next year, while Delta Air Lines has tapped Amazon Leo. United is trying to win over new customers by launching an offer that matches travelers' loyalty status on Delta or American. The offer said, \"Don't keep buffering: switch to United and get the fastest WiFi in the sky.\" Thousands of customers have signed up within two weeks, United said. It added that status match applications are ", "date_str": "2026-10-15T13:56:08+00:00", "hash": "1630c04b3e28bbe4", "title_fa": "یونایتد بالاخره تشخیص اینکه آیا پرواز شما Starlink دارد یا خیر را آسان‌تر کرد", "summary_fa": "ردیاب United Airlines نشان می دهد که Starlink در کمتر از 3 درصد از هواپیماهای پهن پیکر خود دارد. Massimo Insabato/Archivio Massimo Insabato/Mondadori Portfolio از طریق Getty Images United Airlines ابزاری برای ردیابی هواپیماهایی که Starlink دارند منتشر کرد. می توانید شماره پرواز خود را تا 3 روز قبل از حرکت وارد کنید و تغییرات لحظه آخری را بررسی کنید. همچنین نشان می دهد که حدود 43 درصد از ناوگان یونایتد به این سرویس مجهز است. اگر با United Airlines پرواز می کنید تا از Starlink استفاده کنید، اکنون بسیار آسان تر است که بدانید آیا پرواز شما شامل سرویس اینترنت سریع و رایگان است یا خیر. این شرکت هواپیمایی روز پنجشنبه ابزاری به نام Starlink WiFi Tracker منتشر کرد. می توانید شماره پرواز خود را حداکثر تا 3 روز قبل از حرکت وارد کنید تا در دسترس بودن Starlink آن را بررسی کنید. اگرچه این اشتباه نیست، زیرا ممکن است شرکت هواپیمایی از کدام هواپیما برای پرواز شما استفاده کند. با این حال، یونایتد می گوید که این ابزار شامل به روز رسانی هایی است که در زمان واقعی برای چنین تغییرات لحظه آخری ایجاد شده اند. یونایتد قبلاً از پیام‌های متنی، ایمیل‌ها و برنامه‌اش استفاده می‌کرد تا به مسافران اطلاع دهد که آیا پروازشان برنامه‌ریزی شده بود Starlink داشته باشد، اما ابزار جدید به شما امکان می‌دهد تغییرات لحظه آخری را بررسی کنید. همچنین پیشرفت نصب Starlink را در ناوگان ردیابی می کند. از صبح پنجشنبه، 639 هواپیما، یا حدود 43 درصد از ناوگان یونایتد، به این سرویس مجهز شده اند. این شامل تمام هواپیماهای منطقه‌ای آن است که تحت نام تجاری United Express پرواز می‌کنند، و حدود یک سوم دیگر هواپیماهای باریک بدنش - مانند ایرباس A321 و بوئینگ 737. با این حال، Starlink تنها در 6 هواپیما از 248 هواپیمای پهن پیکر خود که پروازهای طولانی"}, {"source": "Business Insider", "title": "I grew up in Paris. Here are 12 of the biggest mistakes I see tourists make when they visit.", "link": "https://www.businessinsider.com/paris-things-you-should-never-do-local-tips-mistakes-2026-10", "summary": "I grew up in Paris, and I always urge visitors to stop into a local boulangerie. Kyra Alessandrini I grew up in Paris and often see tourists miss out on my favorite parts of the city. The famous landmarks are worth visiting, but so are the French capital's quieter neighborhoods. I wish more tourists embraced café culture and were open to trying authentic French dishes. I grew up in Paris , one of the most popular places in the world for people to visit. Over the years, I've watched countless tourists make mistakes, skip out on incredible experiences, and miss opportunities to improve their trip. Here are a few things I wish people knew before visiting my city. Check the major tourist spots off your bucket list, but venture to Paris quieter neighborhoods too. The Paris skyline at sunset. Getty Images Paris is one of the most popular tourist destinations in the world. Many people dream of snapping photos of the Eiffel Tower, wandering through the Louvre, and strolling down the Champs Elysées. These historic sites and cultural attractions are prerequisites on most first-timers' itineraries for good reason. However, if you're seeking an authentic glimpse of everyday Parisian life, I urge you to explore the city beyond its most famous landmarks. Walk along Canal Saint-Martin and check out the surrounding area's art stores, trendy restaurants, and local shops. The quaint streets are quiet and peaceful during the day, but they become more lively at night as locals grab drinks and mingle. The weather is gray and rainy for most of the year, so make sure to carry around an umbrella. In Paris, the weather is often gloomy and gray. Kyra Alessandrini Many movies and TV shows portray Paris as a city that's sunny and warm all year round. Unfortunately, that's far from reality. The weather in the fall, winter, and spring can be overcast and humid, and I've seen a lot of tourists pack the wrong attire or scramble to find rain gear during their trip. Don't let the weather deter you, though. If you're planning on walking a lot, just carry a small umbrella with you. To explore Paris in the sunshine, your best bet is to visit in the summer . Don t expect Parisian cafés to be like your local coffee shop — they re about more than getting a caffeine fix. In Paris, you can sit at a café and relax for hours. Kyra Alessandrini Cafés are an essential aspect of Parisian culture , and there are few better places to romanticize your life. So when you're in the French capital, sit down a", "date_str": "2026-10-15T13:50:53+00:00", "hash": "fdd0f075eb8ae0cc", "title_fa": "من در پاریس بزرگ شدم. در اینجا 12 تا از بزرگترین اشتباهاتی که من می بینم گردشگران هنگام بازدید مرتکب می شوند، آورده شده است.", "summary_fa": "من در پاریس بزرگ شدم و همیشه از بازدیدکنندگان می‌خواهم که در یک بولنجری محلی توقف کنند. کایرا الساندرینی من در پاریس بزرگ شدم و اغلب می بینم که گردشگران بخش های مورد علاقه من در شهر را از دست می دهند. مکان های دیدنی معروف ارزش دیدن دارند، اما محله های آرام تر پایتخت فرانسه نیز ارزش دیدن دارند. ای کاش گردشگران بیشتری از فرهنگ کافه‌داری استقبال می‌کردند و می‌خواستند غذاهای اصیل فرانسوی را امتحان کنند. من در پاریس بزرگ شدم، یکی از محبوب ترین مکان های جهان برای بازدید مردم. در طول سال‌ها، تعداد بیشماری از گردشگران را مشاهده کرده‌ام که اشتباه می‌کنند، از تجربیات باورنکردنی چشم پوشی می‌کنند و فرصت‌هایی را برای بهبود سفر خود از دست می‌دهند. در اینجا چند چیز وجود دارد که آرزو می کنم مردم قبل از بازدید از شهر من بدانند. نقاط مهم توریستی را در لیست خود بررسی کنید، اما به محله‌های ساکت‌تر پاریس نیز سفر کنید. خط افق پاریس در غروب خورشید. گتی ایماژ پاریس یکی از محبوب ترین مقاصد گردشگری در جهان است. بسیاری از مردم رویای گرفتن عکس از برج ایفل، پرسه زدن در موزه لوور و قدم زدن در شانزه لیزه را در سر می پرورانند. این مکان‌های تاریخی و جاذبه‌های فرهنگی به دلایل خوبی پیش‌نیاز برنامه‌های سفر اغلب افرادی هستند که برای اولین‌بار سفر می‌کنند. با این حال، اگر به دنبال یک نگاه اجمالی واقعی از زندگی روزمره پاریسی هستید، از شما می‌خواهم که شهر را فراتر از معروف‌ترین نشانه‌های آن کشف کنید. در امتداد کانال سنت مارتین قدم بزنید و فروشگاه‌های هنری، رستوران‌های مد روز، و فروشگاه‌های محلی اطراف را بررسی کنید. خیابان‌های عجیب و غریب در طول روز ساکت و آرام هستند، اما در شب با نوشیدن نوشیدنی‌ها و معاشرت مردم محلی، سرزنده‌تر می‌شوند. هوا در اکثر فصول سال خاکستری و بارانی است، پس"}, {"source": "Business Insider", "title": "My parents raised 6 kids on one salary. My husband and I can't afford one baby on 2.", "link": "https://www.businessinsider.com/millennial-couple-cant-afford-kids-student-loans-childcare-2026-10", "summary": "The author and her husband can t afford to have a child. Courtesy of the author My husband works as a physical therapist and has $100,000 in student loans. I teach college courses through part-time jobs without maternity leave or benefits. Our monthly expenses leave little room for the costs of having a child. I always assumed I would have a big family , whether I wanted to or not. My mother was one of 12, my father was one of seven, and I was the oldest of six. I grew up stepping between bodies at crowded holiday gatherings and playing gigantic games of capture the flag with my aunts, uncles, and cousins. It was fun growing up with a lot of playmates, but more importantly, childbearing was framed as an essential part of our conservative Catholic identity. Motherhood was a sacrificial duty that would ensure my place in Heaven. I never considered whether this was what I wanted because I was supposed to live according to God's plan rather than my own. When I left the church, I thought I had gained the freedom to choose As I got older, that rhetoric made me feel trapped. I married at 22 but put off childbearing in favor of graduate school and chasing my dream career, though it felt like I was on borrowed time. When I finally left the Catholic Church in my late 20s, I suddenly had the freedom to ask myself what I wanted life to look like. For the first time, I pictured my life childfree, imagining international vacations , friendships, and hobbies. I also pictured life as a parent, with bedtime stories, birthdays, and soccer games. The author and her husband bought a home with an extra room. Courtesy of the author For years, my husband and I weighed the merits of these two life paths. I finished grad school, and we bought a house in Minneapolis with an extra bedroom just in case. Now, at 32, it theoretically feels like the ideal time to get serious about the question of children. But with our mortgage, home repairs, and other bills, it feels like another outside force has made the decision for us. We have student loans My husband is a physical therapist, which pays a living wage, but he also has about $100,000 in student loans . I'm a college instructor, and the academic job market has forced me to work multiple part-time jobs that don't provide benefits or maternity leave. We're on a strict monthly budget . Our income goes to our mortgage, loans, health insurance, gas, groceries, and Roth IRAs. We set a little aside to rebuild our emergency savings. While we ", "date_str": "2026-10-15T13:45:01+00:00", "hash": "521e13f7d6c4b316", "title_fa": "پدر و مادرم 6 بچه را با یک حقوق بزرگ کردند. من و شوهرم نمی توانیم در ۲ سالگی یک بچه بخریم.", "summary_fa": "نویسنده و همسرش توان مالی داشتن فرزند را ندارند. با حسن نیت از نویسنده شوهر من به عنوان یک فیزیوتراپ کار می کند و 100000 دلار وام دانشجویی دارد. من دوره های کالج را از طریق مشاغل پاره وقت بدون مرخصی زایمان یا مزایا تدریس می کنم. هزینه های ماهانه ما جای کمی برای هزینه های بچه دار شدن باقی می گذارد. من همیشه تصور می کردم که خانواده بزرگی خواهم داشت، چه بخواهم و چه نخواهم. مادرم یکی از 12 سال بود، پدرم یکی از هفت نفر بود و من از شش سال بزرگتر بودم. من بزرگ شدم و در مجالس تعطیلات شلوغ قدم گذاشتم بین بدن ها و با خاله ها، عموها و عمه هایم بازی های غول پیکر تسخیر پرچم را انجام دادم. بزرگ شدن با تعداد زیادی همبازی سرگرم کننده بود، اما مهمتر از آن، فرزندآوری به عنوان بخشی اساسی از هویت محافظه کار کاتولیک ما در نظر گرفته شد. مادری وظیفه ای فداکارانه بود که جایگاه من را در بهشت ​​تضمین می کرد. هرگز به این فکر نکردم که آیا این همان چیزی است که می‌خواهم، زیرا قرار بود بر اساس نقشه‌ی خدا زندگی کنم و نه برنامه‌ی خودم. وقتی کلیسا را ​​ترک کردم، فکر می‌کردم که با بزرگتر شدن آزادی انتخاب به دست آورده‌ام، این لفاظی باعث شد احساس کنم در دام افتاده‌ام. من در 22 سالگی ازدواج کردم، اما فرزندآوری را به نفع تحصیلات تکمیلی و تعقیب شغل رویایی ام به تعویق انداختم، اگرچه احساس می کردم در زمان قرضی هستم. وقتی بالاخره در اواخر دهه 20م کلیسای کاتولیک را ترک کردم، ناگهان این آزادی را پیدا کردم که از خودم بپرسم می خواهم زندگی چگونه باشد. برای اولین بار، زندگی خود را بدون فرزند، تصور تعطیلات بین المللی، دوستی ها و سرگرمی ها به تصویر کشیدم. من همچنین زندگی را به عنوان"}, {"source": "Business Insider", "title": "Ray Dalio warns the market is heading for a $4.4 trillion fight for capital that could send borrowing costs surging", "link": "https://www.businessinsider.com/ray-dalio-bond-market-ai-tech-treasury-yields-2026-10", "summary": "Taylor Hill/Getty Images Ray Dalio is worried about the explosion of debt issued by countries and companies. The legendary investor says high supply of bonds and uncertain demand will drive yields higher. \"This market should be viewed as the canary in the coal mine,\" he said of corporate debt. This year's surge in interest rates has rattled Wall Street, but Ray Dalio thinks there's more than just the fate of the bull market at stake. The billionaire founder of Bridgewater Associates hedge fund said this week that he's increasingly nervous about the direction of bond yields and borrowing costs. His bearish thesis centers on the idea that AI hyperscalers and governments are becoming locked in a running battle for investor capital. \"The way I would think about the 2027 challenge is that the supply of debt will likely rise from about $3.5 trillion annual net debt supply in 2025 to about $4.4 trillion in 2027, which is an incremental ~$0.5 trillion per year, not including debt rollovers,\" Dalio wrote on X. \"That produces lower prices and higher yields on financial assets when demand isn't strong, which is the current case,\" Dalio later added of the effect of heightened supply. Dalio's concerns echo a warning sounded this week by the International Monetary Fund, which said in a report that problems could arise as tech companies compete with sovereign debt issuers, driving up government bond yields. Dalio this year has said that he sees a debt crisis coming for the US, mostly recently eyeing the next two years for one to materialize. His primary focus has been on soaring government debt levels, but his expanded thesis now includes the explosion of AI-linked debt issuance that's flooded the fixed-income market. \"This market is now beginning to tighten as investors are beginning to require larger concessions to absorb the supply,\" Dalio stated. \"Net corporate debt issuance was about $700 billion in 2025 and is expected to be about $1.1 trillion in 2026 and about $1.4 trillion in 2027. This market should be viewed as the canary in the coal mine.\" While these factors have pushed both credit spreads and funding costs higher, the overall impact so far has been fairly modest. Dalio added, though, that tech companies have increased their bond issuance significantly this year, to roughly $220 billion in early 2026, from $108 billion in all of 2025. This is will likely be a major source of pressure for markets, Dalio said, particularly if the funding shortfall that he sees", "date_str": "2026-10-15T13:43:40+00:00", "hash": "58821536fb8014af", "title_fa": "ری دالیو هشدار می دهد که بازار به سمت یک جنگ 4.4 تریلیون دلاری برای سرمایه پیش می رود که می تواند هزینه های استقراض را افزایش دهد.", "summary_fa": "تیلور هیل/ گتی ایماژ ری دالیو از انفجار بدهی صادر شده توسط کشورها و شرکت ها نگران است. این سرمایه گذار افسانه ای می گوید عرضه بالای اوراق قرضه و تقاضای نامطمئن باعث افزایش بازدهی می شود. وی در مورد بدهی شرکت ها گفت: باید به این بازار به عنوان قناری در معدن زغال سنگ نگاه کرد. افزایش نرخ بهره در سال جاری وال استریت را تحت تأثیر قرار داده است، اما ری دالیو فکر می کند چیزی بیش از سرنوشت بازار صعودی در خطر است. بنیانگذار میلیاردر صندوق تامینی Bridgewater Associates این هفته گفت که به طور فزاینده ای در مورد جهت بازده اوراق قرضه و هزینه های استقراض عصبی است. پایان‌نامه نزولی او بر این ایده متمرکز است که مقیاس‌کننده‌های هوش مصنوعی و دولت‌ها درگیر نبردی برای سرمایه‌گذاری سرمایه‌گذاران هستند. زمانی که تقاضای مالی Thatnsy در X پایین‌تر و بالاتر می‌رود، نوشت: «شیوه‌ای که من در مورد چالش 2027 فکر می‌کنم این است که عرضه بدهی احتمالاً از حدود 3.5 تریلیون دلار عرضه خالص بدهی سالانه در سال 2025 به حدود 4.4 تریلیون دلار در سال 2027 افزایش می‌یابد، که افزایشی حدود 0.5 تریلیون دلار در سال است، بدون احتساب کاهش بدهی». دالیو بعداً در مورد تأثیر افزایش عرضه افزود. نگرانی های دالیو بازتاب هشداری است که این هفته توسط صندوق بین المللی پول به صدا درآمد که در گزارشی اعلام کرد که ممکن است مشکلاتی در رقابت شرکت های فناوری با ناشران بدهی های دولتی ایجاد شود و بازده اوراق قرضه دولتی را افزایش دهد. دالیو امسال گفته است که می بیند یک بحران بدهی برای ایالات متحده در راه است و عمدتاً اخیراً چشم دو سال آینده برای تحقق آن دارد. تمرکز اصلی او بر افزایش سطح بدهی های دولتی بوده است، اما تز گسترش یافته او اکنون شامل انفجار صدور بدهی های مرتبط با هوش"}, {"source": "Business Insider", "title": "Best Zenni promo codes we've tested in October 2026", "link": "https://www.businessinsider.com/guides/deals/best-zenni-coupon-promo-discount-codes", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The best Zenni promo codes can save you 15% on your next eyewear purchase. Zenni It's no secret that shopping for a new pair of glasses can be an expensive hassle, but Zenni helps make things a bit simpler (and cheaper). The online eye re ital access to military-grade Starlink services is coming back after a sudden disruption, sources say", "link": "https://www.businessinsider.com/ukraine-starlink-speed-starshield-service-coming-back-2026-10", "summary": "Starlink equipment is a common sight on the front lines in Ukraine. Maxym Marusenko via Reuters Connect Ukraine's access to military-grade Starlink services is returning, sources told Business Insider. Defense ministry and parliamentary sources said on Thursday that Starshield operations had been at least partially restored. On Wednesday, Ukraine was caught off guard by sudden speed restrictions, affecting drone missions. Ukraine's access to military-grade Starlink services appears to have been at least partially restored on Thursday, a day after Kyiv was stunned by sudden speed limits that it said hamstrung some drone operations . Ukrainian defense ministry sources told Business Insider that Starshield services remained functional while in motion as of roughly 11:45 a.m. local time on Thursday, according to reports that they had received from military units. The sources said the defense ministry is working to understand how and why there was a disruption to the operation of Starshield , SpaceX's dedicated satellite network for military services. Yehor Cherniev, the deputy chairman of the Ukrainian parliament's national security, defense, and intelligence committee, told Business Insider that Starshield services had been restored to their pre-disruption capacity. Ukrainian officials and service members were caught off guard on Wednesday by the unexpected Starshield disruption, which they said restricted speeds above 100 miles per hour. Some units experienced a loss of connection at speeds as low as 45 miles per hour. The full extent of the service limitation remains unclear. Yuriy, an officer with Ukraine's National Guard, told Business Insider that his units use Starshield to support drone operations and that speeds were back above 100 miles per hour as of Thursday morning. He asked to be identified only by his first name for security purposes. However, Yuriy said that several operations were disrupted during the earlier restrictions. Defense ministry sources said the disruption complicated mid-range strikes , air defense intercepts, and front-line logistics. Starlink does not work inside Russia, so the issue was limited to missions in Ukrainian territory or Russian-occupied territory. Starlink has been a game changer for Ukrainian operations, especially by ensuring connectivity for drone warfare. Andriy Dubchak/Frontliner/Getty Images The sudden Starlink disruption caused widespread confusion and raised questions about the source of the decision and whet", "date_str": "2026-10-15T13:10:24+00:00", "hash": "7c11f95a84a3e1af", "title_fa": "منابع می گویند که دسترسی حیاتی اوکراین به خدمات نظامی Starlink پس از یک اختلال ناگهانی بازمی گردد.", "summary_fa": "تجهیزات Starlink یک منظره رایج در خطوط مقدم در اوکراین است. منابع به Business Insider گفتند که Maxym Marusenko از طریق رویترز Connect، دسترسی اوکراین به خدمات نظامی Starlink در حال بازگشت است. وزارت دفاع و منابع پارلمانی روز پنجشنبه گفتند که عملیات استارشیلد حداقل تا حدی بازسازی شده است. روز چهارشنبه، اوکراین با محدودیت‌های سرعت ناگهانی که بر ماموریت‌های هواپیماهای بدون سرنشین تأثیر گذاشت، غافلگیر شد. به نظر می‌رسد دسترسی اوکراین به خدمات نظامی استارلینک حداقل تا حدی در روز پنج‌شنبه، یک روز پس از اینکه کیف با محدودیت‌های سرعت ناگهانی مبهوت شده بود، بازگردانده شده است. منابع وزارت دفاع اوکراین به Business Insider گفتند که سرویس‌های Starshield تا ساعت 11:45 صبح روز پنجشنبه به وقت محلی، طبق گزارش‌هایی که از یگان‌های نظامی دریافت کرده‌اند، همچنان فعال هستند. این منابع گفتند که وزارت دفاع در تلاش است تا بفهمد چگونه و چرا در عملکرد Starshield، شبکه ماهواره‌ای اختصاصی SpaceX برای خدمات نظامی اختلال ایجاد شده است. یئور چرنیف، معاون کمیته امنیت ملی، دفاع و اطلاعات پارلمان اوکراین به بیزینس اینسایدر گفت که سرویس‌های استارشیلد به ظرفیت قبل از اختلال بازگردانده شده است. مقامات و اعضای خدمات اوکراینی روز چهارشنبه با اختلال غیرمنتظره استارشیلد غافلگیر شدند که به گفته آنها سرعت بیش از 100 مایل در ساعت را محدود کرد. برخی از واحدها با سرعت کمتر از 45 مایل در ساعت قطع اتصال را تجربه کردند. میزان کامل محدودیت خدمات نامشخص است. یوری، یکی از افسران گارد ملی اوکراین، به Business Insider گفت که واحدهای او از Starshield برای پشتیبانی از عملیات پهپاد استفاده می‌کنند و از صبح روز پنجشنبه سرعت‌ها به بیش از 100 مایل در ساعت بازگشته است. او برای اهداف امنیتی فقط با نام کوچکش خواستار شناسایی او شد. با این حال، یوری گفت که چندین عملیات در طول محدودیت های قبلی مختل شده است. منابع وزارت"}, {"source": "Business Insider", "title": "A US Navy carrier strike group just deployed with a big drone ship for the first time", "link": "https://www.businessinsider.com/us-navy-strike-group-deployed-big-drone-ship-first-time-2026-10", "summary": "The Theodore Roosevelt Carrier Strike Group deployed with a drone ship, a first for the US Navy. US Navy photo A US Navy aircraft carrier strike group has deployed with a big drone ship for the first time. Hung Cao, the acting Navy secretary, said on Wednesday that the drone ship \"is a force multiplier.\" The Theodore Roosevelt Carrier Strike Group is expected to sail to the Middle East. A US Navy aircraft carrier strike group has deployed with a big drone ship for the first time in the service's history. Acting Navy Secretary Hung Cao said on Wednesday that the Theodore Roosevelt Carrier Strike Group , which recently deployed from its homeport in San Diego, did so with an \"unmanned surface vessel,\" or USV. \"This is the first carrier strike group to ever deploy with a large-size unmanned surface vessel — and this is a force multiplier,\" Cao said at the Association of the United States Army annual meeting and exposition in Washington, DC. The US is increasingly integrating naval drones and other autonomous vessels, including larger driverless ships, into its maritime operations as the military looks to pair multibillion-dollar warships with cheaper, attritable systems. Some NATO allies are doing the same. Small, speedboat-style sea drones in particular have played a crucial role in conflicts around the world in recent years. Ukraine, for instance, has used explosive-packed sea drones to devastate Russia's fleet in the Black Sea. It has also innovated with its sea drones, arming them with other drones, guns, and missiles. In the Middle East, the US has long used naval drones for intelligence-gathering purposes. However, during the war against Iran, American forces used the drones to rescue the crew of a helicopter that was shot down and to strike Iranian ports , as Ukraine has done to Russia. These smaller sea drones are less suitable for operations with heavily armed carrier strike groups compared to medium and larger naval drones because they can't maneuver with the traditional warships or carry the necessary payloads, Austin Gray, the cofounder of Blue Water Autonomy, a US startup making USVs for the Navy , told Business Insider. Larger USVs can be equipped with missiles, drones, and non-kinetic systems like sensors or electronic jamming equipment, Gray said, allowing them to support and protect the strike group. Advancements in the field mean there could be many missions available for autonomous ships, such as logistics, refueling, and submarine-hunting, ", "date_str": "2026-10-15T13:08:01+00:00", "hash": "663d1df598f4975a", "title_fa": "یک گروه ضربتی ناو نیروی دریایی ایالات متحده برای اولین بار با یک کشتی بدون سرنشین بزرگ مستقر شد", "summary_fa": "گروه ضربتی حامل تئودور روزولت با یک کشتی بدون سرنشین برای اولین بار برای نیروی دریایی ایالات متحده مستقر شد. عکس نیروی دریایی ایالات متحده یک گروه ضربتی ناو هواپیمابر نیروی دریایی ایالات متحده برای اولین بار با یک کشتی بدون سرنشین بزرگ مستقر شده است. هانگ کائو، سرپرست وزیر نیروی دریایی، روز چهارشنبه گفت که کشتی بدون سرنشین \"یک افزایش دهنده نیرو است.\" انتظار می رود گروه ضربتی حامل تئودور روزولت به خاورمیانه سفر کند. یک گروه تهاجمی ناو
