  <title>مجله خبری روزانه — ۹ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

a": "«ما را کشتند»؛ تعطیلی روزنامه مستقل «نوایا گازتا» زیر فشار دولت روسیه", "summary_fa": "روزنامه «نوایا گازتا» یکی از برجسته‌ترین رسانه‌های خبری مستقل که همچنان در روسیه فعالیت می‌کرد، اعلام کرده است که در پی فشارهای دولت، به زودی تعطیل می‌شود. سرگئی سوکولوف، سردبیر این روزنامه، در بیانیه‌ای که در یوتیوب منتشر شد، گفت که «نوایا گازتا دیگر وجود نخواهد داشت.» استیون روزنبرگ، سردبیر بخش روسی بی‌بی‌سی می‌گوید نوایا گازتا، مقام‌های روسیه را به «قتل» یک روزنامه متهم کرده است. این روزنامه حکم تخلیه دفتر خود را دریافت کرده و سامانه‌ای که به این روزنامه امکان می‌داد از کمک‌های مالی خوانندگانش برخوردار شود، از کار انداخته شده و این روزنامه دیگر هیچ راهی برای تأمین هزینه‌های انتشار خود ندارد. این روزنامه به پوشش انتقادی درباره مسائل سیاسی و اجتماعی روسیه و گزارش‌های تحقیقی بی‌پروا درباره موضوعاتی مانند فساد، نقض حقوق بشر شناخته می‌شود. سردبیر بخش روسی بی‌بی‌سی می‌گوید که اینها موضوعاتی خطرناک در روسیه است. دیمیتری موراتوف، سردبیر پیشین نوایا گازتا، در سال ۲۰۲۱ به‌دلیل تلاش‌هایش برای دفاع از آزادی بیان در روسیه، به‌طور مشترک برنده جایزه صلح نوبل شد. اما این جایزه مانع از آن نشد که مقام‌های روسیه در سال ۲۰۲۳ او را در فهرست «عوامل خارجی» قرار دهند. مقام‌های روسیه اغلب از این اصطلاح برای محدود و مجازات کردن منتقدان از آن استفاده می‌کنند. از زمان تأسیس این روزنامه در سال ۱۹۹۳، چند روزنامه‌نگاران آن پس از انتشار مطالب انتقادی درباره مقام‌های دولتی به قتل رسیده‌اند و اخیرا هم برخی از آنها در فهرست «عوامل خارجی» قرار گرفتند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. آنا پولیتکوفسکایا، از جمله این روزنامه‌نگاران بود که ۲۰ سال پیش در راه‌پله ساختمان محل سکونتش هدف گلوله قرار گرفت و کشته شد. جنگ‌های چچن از جمله موضوعاتی بود که او درباره‌اش گزارش تهیه کرده بود.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/6918/live/5109c2f0-d45c-11f1-ab12-eb0c94f5b382.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۸ آبان • ۱۸:۱۲"}, {"source": "Iran International       tech: [{"source": "TechCrunch AI", "title": "Skip the small talk: Make game-changing connections at TechCrunch Founder Summit with Braindate", "link": "https://techcrunch.com/2026/10/30/skip-the-small-talk-make-game-changing-connections-at-techcrunch-founder-summit-with-braindate/", "summary": "At TechCrunch Founder Summit 2026, happening November 4 at SoWa Power Station in Boston, networking powered by Braindate is designed to make those conversations easier to find, whether they are in 1:1 or small-group on-site meetings. Register before the event starts to save up to $100 on your pass, plus get a second for free.", "date_str": "2026-10-30T14:00:00+00:00", "hash": "00325cd42bb9d17b", "title_fa": "از صحبت‌های کوچک بگذرید: با Braindate در TechCrunch Founder Summit ارتباطاتی ایجاد کنید که بازی را تغییر دهد.", "summary_fa": "بهترین ارتباطی که در یک رویداد برقرار می کنید، همیشه کسی نیست که در صف قهوه در کنار شما ایستاده است. گاهی اوقات این بنیانگذار است که قبلاً مشکل بیدار نگه داشتن شما را در شب حل کرده است. سرمایه‌گذاری که می‌تواند طرز فکر شما در مورد دور بعدی خود را به چالش بکشد. یا اپراتوری که به طور مستقیم یاد گرفته است که وقتی یک شرکت خیلی سریع مقیاس می گیرد چه اتفاقی می افتد. At TechCrunch Founder Summit 2026 , happening November 4 at SoWa Power Station in Boston, networking powered by Braindate is designed to make those conversations easier to find, whether they are in 1:1 or small-group on-site meetings. The only way to make these game-changing connections is at Founder Summit. Grab your pass, plus get a second pass for free. The Founder Summit Networking Lounge gives attendees the opportunity to schedule one-on-one or small-group Braindates throughout the day. به‌جای اینکه امیدوار باشید با فرد مناسب برخورد کنید، Braindate به شما این امکان را می‌دهد تا پیرامون موضوعاتی که واقعاً می‌خواهید درباره آن بحث کنید، ارتباط برقرار کنید. چالش بیاور چیزی را که آموخته اید به اشتراک بگذارید. دیدگاه را بخواهید خود را ارائه دهید. چه بخواهید استراتژی‌های جمع‌آوری سرمایه را با هم مقایسه کنید، از طریق چالش‌های استخدام صحبت کنید، درس‌هایی را در مورد تناسب محصول با بازار عوض کنید، دیدگاه بنیان‌گذار دیگری را در مورد فروش سازمانی دریافت کنید، یا به سادگی با افرادی که در بوستون و فراتر از آن ساخته می‌شوند ملاقات کنید، گفتگو با آنچه برای شما مهم است شروع می‌شود. Founder Summit بر اساس سؤالاتی ساخته شده است که بنیانگذاران قبلاً می پرسند: چگونه می دانید که چه زمانی آماده مقیاس گذاری هستید؟ چگونه تیم قوی تری بسازید؟ چه چیزی باعث می شود سرمایه گذاران در جلسه بعدی شرکت کنند؟", "image_url": "https://techcrunch.com/wp-content/uploads/2025/03/Early-Stage-2024-networking-1.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۸ آبان • ۱۷:۳۰"}, {"source": "The Guardian AI", "title": "Ghost in the machine: how AI is haunting the search for the supernatural", "link": "https://www.theguardian.com/technology/ng-interactive/2026/oct/30/ai-ghost-hunting", "summary": "Ghost hunting has changed in recent years due to AI chatbots, and paranormal enthusiasts are concerned Ghost hunting is a tech-heavy pursuit. When Amy Waine and Jarrad Cutting investigate haunted locations, they’re loaded up with software of their own design, such as an app that assigns signals from a phone’s sensors to different words in a database. In the age of ChatGPT, the ghost-hunting pair is probing the world of AI. They describe one of their latest inventions, an app called GhostTube Seer , as “the world’s first AI Ghost Hunting tool”. In the hands of paranormal investigators, scientific tools like EMF meters (used to detect electromagnetic fields) are repurposed to identify changes and anomalies that they believe indicate supernatural activity. Seer is, in many ways, simply an expansion of that practice, another way to scan an empty room and believe that something may be there. The app, which requires a paid monthly subscription, has more than 1m downloads, according to its Google Play store listing . But for others in the ghost hunting world, AI is an unwelcome presence. Since the release of ChatGPT in 2022, AI-generated ghost stories and images of the supernatural have flooded online spaces, so much so that popular forums like the r/ nosleep subreddit , meant for scary stories, have implemented a strict policy against AI-generated material. Continue reading...", "date_str": "2026-10-30T15:00:16+00:00", "hash": "985962984eaab189", "title_fa": "روح در ماشین: چگونه هوش مصنوعی در جستجوی ماوراء طبیعی است", "summary_fa": "شکار ارواح در سال های اخیر به دلیل چت ربات های هوش مصنوعی تغییر کرده است و علاقه مندان به ماوراء الطبیعه نگران هستند که شکار ارواح یک تعقیب فناوری سنگین است. هنگامی که امی وین و جاراد کاتینگ مکان‌های خالی از سکنه را بررسی می‌کنند، با نرم‌افزاری با طراحی خودشان بارگذاری می‌شوند، مانند برنامه‌ای که سیگنال‌های حسگرهای تلفن را به کلمات مختلف در پایگاه داده اختصاص می‌دهد. در عصر ChatGPT، جفت شکار ارواح در حال بررسی دنیای هوش مصنوعی هستند. آنها یکی از آخرین اختراعات خود، اپلیکیشنی به نام GhostTube Seer را به عنوان «اولین ابزار شکار ارواح هوش مصنوعی در جهان» توصیف می کنند. در دست محققان ماوراء الطبیعه، ابزارهای علمی مانند EMF متر (که برای تشخیص میدان های الکترومغناطیسی استفاده می شود) برای شناسایی تغییرات و ناهنجاری هایی که به عقیده آنها نشان دهنده فعالیت ماوراء طبیعی است، تغییر کاربری داده می شوند. Seer از بسیاری جهات صرفاً گسترش آن عمل است، راه دیگری برای اسکن یک اتاق خالی و باور اینکه ممکن است چیزی آنجا باشد. طبق فهرست فروشگاه Google Play، این برنامه که به اشتراک ماهانه پولی نیاز دارد، بیش از 1 میلیون دانلود دارد. اما برای دیگران در دنیای شکار ارواح، هوش مصنوعی یک حضور ناخواسته است. از زمان انتشار ChatGPT در سال 2022، داستان‌های ارواح و تصاویر ماوراء الطبیعه تولید شده توسط هوش مصنوعی فضاهای آنلاین را پر کرده است، به طوری که انجمن‌های محبوبی مانند r/nosleep subreddit که برای داستان‌های ترسناک طراحی شده است، سیاست سخت‌گیرانه‌ای را علیه مطالب تولید شده توسط هوش مصنوعی اعمال کرده‌اند. به خواندن ادامه دهید... Waine و Cutting ادعا می‌کنند که اپلیکیشن آن‌ها می‌تواند با استفاده از سیگنال‌های مغناطیس‌سنج داخلی تلفن، تصاویری را تولید کند که ماوراءالطبیعه را به تصویر می‌کشد، کلمات و عبارات موجود در آن سیگنال‌ها را شناسایی کرده و سپس آنها را از طریق", "image_url": "https://i.guim.co.uk/img/media/1d39796c4dc7d5a873ed01119d02771c61581e07/414_0_1885_1508/master/1885.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=940e1e976c2901c34dcfb9cd3adf1600", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Google"], "datetime_fa": "۸ آبان • ۱۸:۳۰"}, {"source": "The Guardian AI", "title": "Reader Q&A: How can we radically change the way we live? Ask Aditya Chakrabortty", "link": "https://www.theguardian.com/community/live/2026/oct/29/reader-qa-aditya-chakrabortty-answers-your-questions", "summary": "Guardian columnist, senior economics commentator and host of the new Radical Thinking podcast Aditya Chakrabortty is answering your questions on the big ideas around economics, society and democracy, and his new podcast Send your questions to conversations@theguardian.com or join the discussion on Friday from 8am Perspectiverox asks : The government has an enormous amount riding on AI to deliver future economic growth. Do you think this strategy will work? And is the government’s heavy investment in this vision, and its apparent determination to pursue it, contributing to a failure to properly acknowledge or address serious public concerns about the environment and jobs? More fundamentally, what happens if the anticipated AI-driven growth doesn’t materialise? Is there a Plan B? Aditya says: In their book When Nothing Works, the Foundational Economy collective of economists and analysts point out that after decades of successive governments in the UK talking up the ‘knowledge economy’, technology accounted for less than 5% of GDP. That wasn’t just a British failure – the story is same across much of Eur  had moved to England seven months earlier, I never imagined returning so soon. At first, moving to the UK felt like it could be a grand adventure The idea of leaving Canada behind to try living in the United Kingdom seemed exciting. Cara Howlett Packing up a life in Canada and starting a new one in England had been a herculean endeavor, but I had been excited to do it. For two years leading up to our move to the UK , my husband, two kids (ages 7 and 10), and I had been settled in Alberta, Canada. As much as we enjoyed it, I ached for a new adventure; something different. I didn't feel particularly connected to our community, and our day-to-day lives had felt monotonous for a while. Some of our only reprieves as busy young parents were monthlong summer holidays spent with my husband's family in the bucolic British countryside. We enjoyed these trips so much and looked forward to them for weeks, from planning excursions to castles and museums to researching the best local restaurants and pubs. When we arrived, we loved taking day trips to nearby locales and eating fish and chips by the seaside. I started wondering if living in England would be just as enjoyable and exciting as these monthlong stints. Maybe it'd also satisfy our longing for adventure. Although moving meant leaving my extended family in Canada behind, the idea of our kids spending the rest of their childhoods with my husband's family nearby felt like the right next step. My in-laws also seemed excited about the arrangement, as they offered to help pay for my visa application to live in England permanently . My (more skeptical) husband decided he'd continue running his business in Canada after we moved, occasionally commuting back every few weeks while working remote", "date_str": "2026-10-30T14:10:01+00:00", "hash": "0e10f630c9bdbc31", "title_fa": "ما به انگلستان نقل مکان کردیم تا در نزدیکی خانواده شوهرم زندگی کنیم. بعد از 7 ماه متوجه شدیم که اشتباه کرده ایم.", "summary_fa": "با نگاهی به گذشته، فکر می dditional points of breach\" in the $6.3 billion crypto heist. Binance said it has begun recovering some assets in what appears to be the largest ever crypto heist. Two crypto tracing firms linked the attack to a North Korean hacking group. Binance said it has begun recovering some of the $6.3 billion in assets stolen in what appears to be the largest-ever crypto heist . The crypto exchange also said on Friday that it had \"uncovered additional points of breach\" in the hack. Binance initially said the incident may have stemmed from an engineer's compromised laptop, but said in an update that further investigation had found the \"complex attack\" went beyond that. A Binance spokesperson said that it is working with law enforcement to resolve the attack, and added the company would share a \"detailed technical postmortem once the investigation is complete.\" Major cryptocurrencies were trading lower following the hack, which caps a month full of other high-profile security incidents across the business world. Here's what we know so far about the Binance hack. What is happening with user funds? The company said that user funds are \"safe,\" and that it will cover all losses using its Secure Asset Fund for Users and company funds. \"Binance has begun recovering affected assets for users and continues to work with law enforcement, issuers, blockchain intelligence firms and industry partners to trace, freeze and recover additional funds,\" the company said in a Friday morning X post. Binance added that it has reserved over $6.34 billion of company funds to cover the incident. Customers can still make deposits as usual, and the company said in an earlier post on Friday that it expects to resume the withdrawal service within 45 hours. Binance said it has worked with other blockchain partners to freeze around $3 billion in assets so far. All outflows of funds stopped when Binance paused its withdrawal service, the company said. Who is behind the Binance hack? Binance has no  with Q3 earnings. Both tech giants said they expected to spend more on AI in 2027, despite negative cash flow. The Nasdaq 100 shed nearly 3%, putting the index on track for a losing month. It's another Friday filled with bruising losses for the tech trade . The Nasdaq 100 was on track to log a losing week as the sell-off in tech intesified overnight. The losses were sparked by Amazon and Intel , which plunged after hours on Thursday as both tech giants disappointed investors with their third-quarter earnings reports and reignited fears that the AI trade is headed for a slowdown. Amazon dropped as much as 7% in the early morning as the retail giant reported earnings per share and revenue that came in below expectations for the third quarter. The company also posted a negative cash flow of $7.6 billion for the second-straight quarter, which it said was due to its growing AI spend. CEO Andy Jassy said the firm expected it would continue to \"spend meaningfully more\" into next year. Meanwhile, Intel shares cratered as much as 26%. The computer hardware maker beat on earnings and revenue, but issued weak guidance for the fourth quarter, forecasting a slowdown in the PC market that would stretch into at least the first half of 2027. Revenue in Intel's client computing and physical AI business also dropped 5% year-over-year to $8.1 billion, missing estimates. The firm maintained its capex guidance, but warned that it likely wouldn't generate free cash flow in 2027, partly due to capex being \"up strongly,\" chief financial officer Dave Zinsner said on the call with investors. Q3 earnings metric Amazon Intel Earnings per share $1.89 vs. $1.96 expected $0.52 vs. $0.40 expected (adjusted) Revenue $201.94B vs. $202.31B expected $16.51B vs. $16.50B expected The results stoked fresh fears for the AI trade, ramping up scrutiny from investors over the finances of major tech players who are worried that AI investment isn't paying off. The fear is running in both directions: that ld chair, and we used that to practice our knots. In September 2025, we bought a 1975 sailboat outright for $40,000 in San Francisco and sailed it down the coast the morning the papers were signed. Our 43-foot boat is a beautiful work of craftsmanship, featuring a well-preserved wooden interior with two bedrooms, two bathrooms, a kitchen, and a desk. But unfortunately, the boat came with an overwhelming amount of work from the start. Along with two bedrooms and two bathrooms, the boat has a desk and a small kitchen. Rachel Murphy The previous owner had left us quite a mess to clean up, leaving every drawer stuffed with old kitchenware and junk. Plus, it needed work, like replacing the rotting main sheet, updating the navigation systems, and cleaning out a mildewed freshwater tank — things we've slowly fixed one at a time. The first ", "date_str": "2026-10-30T13:36:47+00:00", "hash": "12206ced12c2c8cd", "title_fa": "من و شوهرم در یک قایق بادبانی زندگی می کنیم. ارزان نیست، اما مزیت ها ما را به خود جلب می کنند.", "summary_fa": "زندگی تمام وقت در یک قایق گران است، اما تا کنون، ارزش این هزینه ها را داشته است. ریچل مورفی وقتی من و همسرم به کالیفرنیا نقل مکان کردیم، تصمیم گرفتیم در یک قایق بادبانی زندگی کنیم. هزینه‌های تعمیرات، نگهداری و اتصال، سبک زندگی را گران‌تر از آنچه انتظار داشتیم، کرده است. شرایط سخت می تواند چالش برانگیز باشد، اما این تجربه برای ازدواج ما عالی بوده است. سال گذشته، من و شوهرم، مایکل، یک قایق بادبانی خریدیم تا تمام وقت با آن زندگی کنیم. در آن زمان، ما در حال آماده شدن برای نقل مکان از خانه خود در نزدیکی لوئیزویل، کنتاکی، به سانتا باربارا، کالیفرنیا بودیم، جایی که من چند سال پس از کالج در آنجا زندگی کرده بودم. همانطور که ما برای نقل مکان به ایالت جدید هیجان زده بودیم، برای هزینه بالاتر اجاره آماده نبودیم، و پرداخت 2500 دلار در ماه برای مکانی که حتی مالک آن نبودیم، برای دو شهروند غرب میانه قرص سختی بود. ما می‌دانستیم که هنوز توان خرید خانه را نداریم، اما همچنان چیزی را می‌خواستیم که بتوانیم مالک آن باشیم. من فکر کردم که باید یک گزینه جایگزین وجود داشته بقت داشته باشد، مانند بسیاری از لباس های شکل دهنده Skims. این لباس یک اشاره بازیگوش به برند کارداشیان بود، اما هنوز هم جذاب و برجسته بود. ست نارنجی که او در مت گالا پوشیده بود گیج کننده بود. کیم کارداشیان در مراسم مت گالا در شهر نیویورک در 4 مه. آلن جونز، هنرمند سیندی اورد/گتی ایماژ، لباس بدن متالیک کارداشیان را سفارشی ساخت که دارای یقه بلندی بود و شبیه تنه او مجسمه سازی شده بود. همچنین یک دامن چرمی دور باسنش پیچیده بود. متأسفانه، این دو قطعه با هم برخورد کردند و ناقص به نظر می رسیدند و یکی", "image_url": "https://i.insider.com/6adb8b63ab741a2ebdf10c31?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۸ آبان • ۱۶:۰۱"}, {"source": "Lifehacker", "title": "10 of the Most Iconic Patrick Stewart Roles Beyond Captain Picard", "link": "https://lifehacker.com/entertainment/iconic-patrick-stewart-roles-beyond-star-trek?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Sir Patrick Stewart, an actor equally at home onstage at the Royal Shakespeare Company and on the bridge of the Starship Enterpri se, has died at the age of 86. Unexpectedly for most of us, in part because he kept his final illness private, but more so because it once seemed as though nothing could fell the man who looms so large in our cultural consciousness. The thoughtful, erudite performer who had a troubled childhood in working-class Yorkshire; the committed socialist who was eventually knighted by Queen Elizabeth; the advocate who put his money and his considerable voice toward the fights for LGBTQ+ acceptance and animal welfare and against domestic violence, his presence and performances meant the world (the galaxy, even) to myself and so many others. But those who knew him personally can offer better tributes; perhaps it's best left to Shakespeare's Player King, performed by Stewart himself opposite David Warner's Hamlet back in 1965: Where joy most revels, grief doth most lament;Grief joys, joy grieves, on slender accident. Much of Stewart's finest work was on the stage; other performances remain rather shockingly hard to come by (whither I, Claudius ?). Nonetheless, he left a true legacy behind him, well beyond Captain Picard and Professor X. Here are 10 of his most iconic other roles. Jeffrey (1995) A goofy, feel-good gay rom-com with the HIV/AIDS crisis still very much in the foreground, Jeffrey was a near-impossibility in the mid-1990s: a movie that neither villainized its queers nor treated them as pitiable martyrs. Steven Weber and Michael T. Weiss are the leads, joined by a cast that includes Christine Baranski, Victor Garber, Nathan Lane, Olympia Dukakis, and Sigourney Weaver but, for all those names, Stewart is the undeniable standout as Sterling, the irrepressible gay best friend: a swishing, mincing, sassy, high-camp character who steals every scene without ever becoming a caricature. He's the leader of the \"Pink Panthers,\" a squad of queers who defend locals from gay bashers, and that is the key to the character's power: He's as gay as they come, but not ashamed and not even a little weak. This movie, and the presence of Captain Picard himself in it, might have saved my life back in 1995. Stream Jeffrey on Prime Video , Tubi , and The Roku Channel . Jeffrey (1995) at Prime Video Learn More Learn More at Prime Video Excalibur (1981) A sprawling, epic, and appropriately lusty take on the ", "date_str": "2026-10-30T14:00:00+00:00", "hash": "76836fdb752d8cc8", "title_fa": "10 تا از نمادین ترین نقش های پاتریک استوارت فراتر از کاپیتان پیکارد", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. سر پاتریک استوارت، بازیگری که به همان اندازه در خانه روی صحنه شرکت رویال شکسپیر و بر روی پل کشتی ستاره‌ای اینترپری، در سن 86 سالگی درگذشت. برای بسیاری از ما غیرمنتظره بود، تا حدی به این دلیل که او آخرین بیماری خود را مخفی نگه داشت، اما بیشتر به این دلیل که زمانی به نظر می‌رسید که هیچ چیز نمی‌تواند در ضمیر فرهنگی ما تأثیر بگذارد. مجری متفکر و فرهیخته ای که دوران کودکی پر دردسری را در یورکشایر طبقه کارگر داشت. سوسیالیست متعهد که در نهایت توسط ملکه الیزابت به مقام شوالیه رسید. مدافعی که پول و صدای قابل توجه خود را صرف مبارزه برای پذیرش LGBTQ+ و رفاه حیوانات و علیه خشونت خانگی کرد، حضور و اجرای او برای من و بسیاری دیگر دنیا (حتی کهکشان) معنی داشت. اما کسانی که او را شخصاً می‌شناختند می‌توانند ادای احترام بیشتری ارائه کنند. شاید بهتر باشد به شاه بازیکن شکسپیر که توسط خود استوارت در مقابل هملت دیوید وارنر در سال 1965 اجرا شد: جایی که شادی بیشتر لذت می برد، غم و اندوه بیشتر سوگواری می کند؛ شادی غم، شادی غمگین است، در تصادفی باریک. بسیاری از بهترین کارهای استوارت روی صحنه بود. اجراهای دیگر به‌طور تکان‌دهنده‌ای سخت به دست می‌آیند (من، کلودیوس؟). با این وجود، او میراث واقعی را پشت سر خود به جا گذاشت، بسیار فراتر از کاپیتان پیکارد و پروفسور X. جفری (1995) یک رام همجنسگرای احمق و با احساس خوب با بحران اچ آی وی/ایدز که هنوز در پیش زمینه بود، جفری در اواسط دهه 1990 تقریباً غیرممکن بود: فیلمی که نه افراد عجیب و غریب خود را شرور کرد و نه با آنها به عنوان شهدای رقت انگیز رفتار کرد. استیون وبر و مایکل تی. ویس بازیگرانی هستند که شامل کریستین بارانسکی،", "image_url": "https://lifehacker.com/imagery/articles/01M64QGT3X9KW7BBBZVYSC0ZV4/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۸ آبان • ۱۷:۳۰"}],
      media: [{"source": "Billboard", "title": "‘Occupational Hazard’ Rock Doc Details the Untold Story of Jimmy Buffett’s ‘Ragtag,’ Pre-Fame Coral Reefer Band", "link": "https://www.billboard.com/music/rock/occupational-hazard-documentary-jimmy-buffett-1236370741/", "summary": "The Coral Reefer Band is as intrinsically a part of the Jimmy Buffett universe as the E Street Band is to Bruce Springsteen s, the Heartbreakers are to Tom Petty s and so on. But a largely untold portion of the band s story is the focus of the new documentary Occupational Hazard: The First Coral Reefers , which, after a nearly nine-month run in film festivals and theaters, becomes available Oct. 30 for rent via Apple TV, Amazon Prime Video, Google Play and Fandango. As the title indicates, Occupational Hazard is an origin story, from the beginnings of Buffett s career as a troubadour (after a tenure writing for Billboard ) and his move to Key West, Florida, where he assembled the initial Coral Reefer lineup during the mid-70s. (He used the name for an imaginary band during his solo performances before then.) Narrated by actor and Buffett friend Jeff Bridges, it details a decidedly different and significantly less polished ensemble than Parrotheads became used to from the late ‘70s until Buffett s death on Sept. 1, 2023. The portrayal is of a time when the Coral Reefer crew was wasted but not really wasting away, as Buffett registered defining tracks such as Margaritaville, Cheeseburger in Paradise, Volcano, Fins and Son of a Son of a Sailor. We wanted to capture the time before the Parrothead phenomenon began, when it was still rough n ready out on the road director-producer John H. Cunningham tells Billboard via Zoom. Those were wild times; many viewers who are watching this have no idea that period even existed for this band, because they ve seen this very organized, polished group for such a long time,” he says. “But the first years were a little bit different. Some of the band are starting to pass away and disappear without the history being recorded. So just for historical purposes, we thought this was an important time to document. Original Coral Reefer Roger Bartlett, who composed the film s score, readily acknowledges that we were fully staffed with artificial inspiration in great quantities during that time. But the guitarist, who performed with Buffett as an acoustic duo before the band formed, also maintains that the early days were really the best days for other reasons. It was before the bodyguard and before (Buffett) flew on a private plane and had the restaurants and all of that, Bartlett explains. We drove in a Rent-a-Car and raced down the corridors of the airports to get to the plane before the doors closed. We sat in economy class and re", "date_str": "2026-10-30T14:34:35+00:00", "hash": "bc73869e229ab164", "title_fa": "مستند راک «خطر شغلی» داستان ناگفته «راگتاگ» جیمی بافت، پیش از شهرت گروه کرال ریفر را شرح می دهد.", "summary_fa": "گروه Coral Reefer به همان اندازه که گروه E Street برای بروس اسپرینگستین، Heartbreakers برای تام پتی و غیره ذاتاً بخشی از جهان جیمی بافت هستند. اما بخش ناگفته‌ای از داستان گروه، تمرکز مستند جدید Occupational Hazard: The First Coral Reefers است، که پس از تقریباً نه ماه نمایش در جشنواره‌ها و تئاترها، در 30 اکتبر برای اجاره از طریق Apple TV، Amazon Prime Video، Google Play و Fandango در دسترس قرار می‌گیرد. همانطور که عنوان نشان می‌دهد، Occupational Hazard یک داستان منشأ است، از آغاز کار بافت به عنوان یک تروبادور (پس از نوشتن دوره‌ای برای بیلبورد) و نقل مکان او به کی وست، فلوریدا، جایی که او در اواسط دهه 70 ترکیب اولیه Coral Reefer را جمع‌آوری کرد. (او پیش از آن در طول اجراهای انفرادی خود از این نام برای یک گروه تخیلی استفاده می کرد.) که توسط بازیگر و دوست بافت، جف بریجز روایت می شود، جزئیات یک گروه کاملاً متفاوت و به طور قابل توجهی کمتر صیقلی نسبت به گروهی که Parrotheads از اواخر دهه 70 تا زمان مرگ بافت در 1 سپتامبر 2023 به آن عادت کرده بودند را نشان می دهد. تصویر مربوط به زمانی است که خدمه کرال ریفر هدر می‌رف orest Whitaker به \"Boomerang Atomic\" راچید بوچارب به عنوان EP پیش از نمایش DOC NYC می پیوندد.", "summary_fa": "اختصاصی: فارست ویتاکر، بازیگر و تهیه کننده برنده جایزه اسکار، پیش از نمایش آن در DOC NYC در ماه نوامبر، به Boomerang Atomic ساخته راچید بوچارب به عنوان تهیه کننده اجرایی پیوست. این مستند اولین انفجار بمب اتمی فرانسه در 13 فوریه 1960 را در نزدیکی شهر دورافتاده رگان در قلب صحرای صحرا در الجزایر بازبینی می کند. DOC NYC در ماه نوامبر. بوشارب، کارگردان الجزایری فرانسوی، که درام «روزهای افتخار» در سال 2006 نامزد اسکار شد، به بررسی پیامدهای ویرانگری می‌پردازد که بیش از شش دهه بعد بر جمعیت محلی و محیط‌زیست تأثیر می‌گذارد. داستان‌های مرتبط جشنواره‌ها در برابر آن بالا می‌روند نقد: آنتونیو باندراس اوا بیرتیسل در کمدی شوخ‌تر Trudie Styler درباره زوج طلاق گرفته‌ای که مجبور به بچه دار شدن برای نجات دخترشان شدند - اخبار جشنواره فیلم تورنتو U.S. تهیه‌کنندگان ژاپنی در گفتگو برای درام فرانسوی آزمایش هسته‌ای فرانسوی با حمایت اکثریت الجزایر راشید بوشارب که منحصراً بر روی آرشیوهای دولتی فرانسه طراحی شده است، این مستند آزمایش هسته‌ای را از طریق تصاویر و تفسیری که در اصل توسط مقامات فرانسوی تولید شده است، بدون روایت معاصر ارائه می‌کند و مخاطبان را دعوت می‌کند تا هم با واقعیت‌های موجود در خارج از قاب فیلم و هم با واقعیت‌های انسانی ثبت شده در فیلم روبرو شوند. ویتاکر گفت: \"من تحت تاثیر اصالت تاریخی و تاثیر عاطفی قدرتمند قرار گرفتم. این مستند مهم تاثیری محو نشدنی بر من گذاشت و باید دیده شود.\"", "image_url": "https://deadline.com/wp-content/uploads/2026/10/GettyImages-2295812401.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۸ آبان • ۱۸:۱۲"}, {"source": "Deadline", "title": "‘Guria’ Wins Best Film At Asia Pacific Screen Awards; ‘9 Temples To Heaven’ Takes Best Director", "link": "https://deadline.com/2026/10/asia-pacific-screen-awards-guria-9-temples-to-heaven-1237209398/", "summary": "Guria, directed by Georgia’s Levan Koguashvili, won Best Film at the Asia Pacific Screen Awards on the Gold Coast, Australia, with the film’s producers Olena Yershova, Koguashvili and Boris Frumin recognized for the international co-production. Thai director Sompot Chidgasornpongse received Best Director for 9 Temples To Heaven, with a Special Mention going to Myanmar director [ ]", "date_str": "2026-10-30T14:29:34+00:00", "hash": "d485b8c198703e88", "title_fa": "«گوریا» برنده بهترین فیلم در جوایز سینمای آسیا پاسیفیک شد. «9 معبد به بهشت» بهترین کارگردانی را می گیرد", "summary_fa": "گوریا به کارگردانی لوان کوگواشویلی از گرجستان برنده بهترین فیلم در جوایز فیلم آسیا پاسیفیک در ساحل طلایی استرالیا شد و تهیه کنندگان فیلم اولنا یرشووا، کوگواشویلی و بوریس فرومین برای تولید مشترک بین المللی شناخته شدند. کارگردان تایلندی Sompot Chidgasornpongse بهترین کارگردانی را برای 9 Temples To Heaven دریافت کرد و جایزه ویژه به کارگردان میانماری [ ] Guria، به کارگردانی Levan Koguashvili از گرجستان، برنده بهترین فیلم در جوایز فیلم آسیا پاسیفیک در ساحل طلایی استرالیا شد. جایزه بزرگ هیئت داوران با قدردانی از \"رویکرد قانع کننده او در داستان گویی و سهم او در سینمای معاصر افغانستان\" به شهربانو سادات فیلمساز افغان برای فیلم مردان خوب اهدا شد. اخبار مرتبط اخبار توزیع آلترناتیوا هیچ مرد خوبی را نمی برد چهار دختر به MIPCOM News اسکار: تایلند 9 معبد به بهشت را برای مسابقه بین المللی فیلم بلند سومپات انتخاب کرد. ویولونیست به کارگردانی مشترک اروین هان از سنگاپور و رائول گارسیا فیلمساز اسپانیایی. جایزه بهترین فیلم مستند Watch on Deadline به فیلمسازان ایتاب عزام و جک مک اینس برای فیلم One In A Million، محصول مشترک بریتانیا و ایالات متحده اهدا شد که به دلیل داستان سرایی مستند و کاوش در تجربه زندگی یک پناهنده سوری مورد تقدیر قرار گرفت. بهترین فیلمنامه به راکان مایاسی، وحید عجمی و پل سیف برای فیلم Yesterday The Eye Didn T Sleep که با همکاری بلژیک، لبنان، فلسطین، قطر و عربستان سعودی انجام شد، تعلق گرفت.", "image_url": "https://deadline.com/wp-content/uploads/2026/10/APSA-2026-Winners.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۸ آبان • ۱۷:۵۹"}, {"source": "Rolling Stone", "title": "Jessica Lange Thinks She Might Have Made Her Last F  "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
