ceeded—again without the end user's knowledge. It’s “worse than a bug” Once the employees learned that Grok Bot had tried to check in with accounts without prompting, one of them instructed the agent, four separate times, to stop taking any actions on its own. The agent's reply was: “I won’t set that up, and I’ll stop offering recurring check-ins.” Despite acknowledging the explicit instructions, the Grok Bot made more unapproved access attempts. When one of the employees asked the bot if it made any accesses, it checked twice and then outputted: “Overnight into Friday morning I was idle.” Read full article Comments", "date_str": "2026-11-17T14:00:29+00:00", "hash": "63601519947bee2d", "title_fa": "Grok Bot اقدامات تایید نشده ای انجام داد، دستورات توقف را نادیده گرفت و سپس آن را رد کرد", "summary_fa": "محققان اخیراً رفتار غیرمنتظره ای را از Grok Bot، پلت فرم عامل هوش مصنوعی SpaceXSI ایلان ماسک کشف کردند. در طول پنج روز، ربات‌های Grok که روی دو لپ‌تاپ کارمند مجزا نصب شده‌اند، 31 درخواست برای دسترسی به داده‌های ذخیره‌شده در حساب‌های تقویم، ایمیل، Slack و GitHub کارکنان ارائه کردند. ربات‌ها با وجود اینکه کارمندان هرگز به آنها دستور نداده بودند، این اقدامات را انجام دادند و حتی پس از اینکه کارمندان به آنها دستور توقف دادند، به انجام آنها ادامه دادند. ربات ها همچنین انجام این اقدامات را انکار کردند. این رفتار روز سه‌شنبه توسط NewCore، سازنده یک محصول دروازه مدیریت شده که به عنوان واسطه بین عوامل هوش مصنوعی و ابزارها و حساب‌هایی که برای کار با آنها تعیین شده است، گزارش شد. در برخی موارد، تلاش‌های دسترسی تایید نشده زمانی رخ می‌دهد که درب لپ‌تاپ با Grok Bot نصب شده بسته شده است، یا اواخر شب هنگام خواب کارمند. هیچ یک از اقدامات غیرضروری در گزارش‌های Grok ثبت نشد. بدون سیاهههای مربوط به دروازه، کارکنان هیچ تصوری از وقوع آن نداشتند. و البته، بدون گیت‌وی، دسترسی‌های تایید نشده موفق می‌شدند - باز هم بدون اطلاع کاربر نهایی. این «بدتر از یک باگ است» هنگامی که کارمندان متوجه شدند که Grok Bot سعی کرده است با حساب‌ها بدون درخواست بررسی کند، یکی از آنها چهار بار جداگانه به نماینده دستور داد تا از انجام هرگونه اقدام خودداری کند. پاسخ نماینده این بود: «من آن را تنظیم نمی‌کنم، و پیشنهاد چک‌این‌های مکرر را متوقف می‌کنم». با وجود تأیید دستورالعمل های صریح، Grok Bot تلاش های بیشتری برای دسترسی تایید نشده انجام داد. وقتی یکی از کارمندان از ربات پرسید که آیا دسترسی دارد یا خیر، ربات دو بار چک کرد و سپس خروجی داد: \"شب تا صبح جمعه بیکار بودم.\" مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/grok-bot-barfs-code-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۲۶ آبان • ۱۷:۳۰"}, {"source": "Engadget", "title": "The hidden features every Google Maps user should know about", "link": "https://www.engadget.com/2315026/google-maps-hidden-features-users-should-know/", "summary": "Discover these overlooked Google Maps features that help you plan your route and cut distractions so you can arrive at your destination on time.", "date_str": "2026-11-17T14:45:00+00:00", "hash": "b152512b7d16b0aa", "title_fa": "ویژگی های پنهانی که هر کاربر نقشه گوگل باید درباره آن بداند", "summary_fa": "این ویژگی های نادیده گرفته شده Google Maps را کشف کنید که به شما کمک می کند مسیر خود را برنامه ریزی کنید و حواس پرتی را کاهش دهید تا بتوانید به موقع به مقصد خود برسید. Alex Photo Stock/Shutterstock افزودن Engadget در Google: منبع برگزیده Google Discover اکثر ما از Google Maps روز به روز یکسان استفاده می کنیم — آدرسی را تایپ می کنیم، دستورالعمل ها را دنبال می کنیم و به مقصد می رسیم. اما این برنامه همچنین ابزارهای مفید زیادی را ارائه می دهد که به راحتی در دسترس نیستند که به آن بگویید کجا بروید. اگر می‌خواهید یادآوری برای زمان خروج تنظیم کنید یا اطمینان حاصل کنید که موسیقی شما بدون وقفه در حالی که دستورالعمل‌های گام به گام را دریافت می‌کنید، تنظیماتی وجود دارد که می‌توانید برای این کار تغییر دهید. همچنین اگر به آن بگویید چه نوع ماشینی دارید، یا تنظیمات مسیر خود را مشخص کنید تا بتوانید توصیه های سفارشی دریافت کنید، می توانید Google Maps را به ابزار بسیار مفیدتری تبدیل کنید. هیچ یک از این ویژگی ها به یک برنامه جدید یا اشتراک نیاز ندارند. آنها مستقیماً در Google Maps تعبیه شده‌اند، و شما می‌توانید با کمی جستجو در اطراف به آنها دسترسی پیدا کنید، مخصوصاً زمانی که می‌دانید کجا را نگاه کنید. Matthew Nichols1/Shutterstock یک ویژگی در Google Maps وجود دارد که به شما امکان می‌دهد مشخص کنید در حال رانندگی با چه ماشینی هستید. ساخت و مدل آن به اندازه نوع موتور آن مهم نیست و به شما امکان می دهد بین گاز، دیزل، هیبریدی و برقی یکی را انتخاب کنید. با این اطلاعات، برنامه می تواند تصمیمات مسیریابی را با نیازهای خودروی شما تنظیم کند. برای دارندگان خودروهای برقی و پلاگین هیبریدی، این ویژگی ارزش در نظر گرفتن دارد، زیرا می‌توانید به Google Maps بگویید که ماشین", "image_url": "https://www.engadget.com/img/gallery/the-hidden-features-every-google-maps-user-should-know-about/l-intro-1794489159.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "موسیقی"], "datetime_fa": "۲۶ آبان • ۱۸:۱۵"}, {"source": "Engadget", "title": "Xiaomi's 18 Pro series can generate vibe-coded apps for its tiny rear display", "link": "https://www.engadget.com/2319013/xiaomi-18-pro-vibe-coded-apps-launch-hands-on/", "summary": "Xiaomi is back with more Pro phones, featuring second screens, capable cameras and a slick red color.", "date_str": "2026-11-17T14:35:50+00:00", "hash": "3b498f5176ae6a55", "title_fa": "سری 18 پرو شیائومی می‌تواند اپلیکیشن‌های کدگذاری شده برای نمایشگر پشتی کوچک خود تولید کند.", "summary_fa": "شیائومی با گوشی‌های پرو بیشتر، دارای صفحه‌نمایش دوم، دوربین‌های توانمند و رنگ قرمز صاف بازگشته است. به نظر نمی رسد دوربین ها به اوج گیج کننده 17 Ultra سال گذشته برسند. Mat Smith برای Engadget افزودن Engadget به Google: منبع ترجیحی Google Discover سری گوشی‌های هوشمند ممتاز شیائومی در سال‌های اخیر در فرم بسیار خوبی قرار داشته است. در کنار 17 Ultra سال گذشته (و دوربین لایکا آن)، دستگاه تاشو گذرنامه‌ای شکل خود را که از نظر فنی چشمگیر 18 Fold بود، درست قبل از عرضه آیفون Duo توسط اپل عرضه کرد. گوشی‌های جدید آن، شیائومی 18 پرو و ​​18 پرو مکس، نمایشگر عقب پیشرفته‌تری       media: [{"source": "Billboard", "title": "AI Is Changing Music. Its Future Must Be Built Around Artists", "link": "https://www.billboard.com/pro/soundcloud-ceo-open-letter-ai-is-changing/", "summary": "At SoundCloud, we believe the future of music should be artist-first. Our brand and our business have been built on the trust artists place in us, and protecting that is fundamental to who we are. Being artist-first is the lens through which we approach AI, recognizing both its potential to expand creative possibilities and the risks it presents to artists, their rights and the communities they build. Technology will keep changing how music is made. Our responsibility to protect the artists who make it won’t. Too often, AI is framed as a binary choice: all good or all bad, embrace it or reject it. It is time that we address this transformation with the nuance that artists deserve. The reality is that AI presents existential risks if managed wrong and game-changing opportunities if managed right. It is our responsibility to artists to both minimize those risks and maximize those opportunities. Related SoundCloud CEO Talks AI Policies: ‘Wishing Away the Advent of AI Music Is Not a Strategy’ CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Innovation and Artist Protection Must Evolve Together Every major shift in music has challenged our understanding of what it means to create. From sampling and synthesizers to auto-tune and digital production, new technologies have consistently pushed the boundaries of creativity, opened doors for new artists, and given rise to entirely new genres and sounds. But music has never been created in isolation. Collaboration, shared experimentation, and the exchange of ideas between artists has always been central to how new sounds and genres emerge. As AI transforms the creative process, we must ensure it doesn’t displace the spaces where artists connect, collaborate, and inspire one another. History shows us that innovation and artist protections don’t have to be opposing forces. They can and must evolve together, on behalf of artists. Artists must have a voice in shaping what comes next. Through artist roundtables and ongoing dialogue with creators and partners across not only our own platform, but Reddit, Discord and beyond, we re listening to how artists are using new technologies, where they see opportunity and what concerns them. Those perspectives inform the products we build, the policies we adopt, and the partnerships we pursue. Being artist-first means ", "date_str": "2026-11-17T16:00:00+00:00", "hash": "3b9b520b841939f6", "title_fa": "هوش مصنوعی در حال تغییر موسیقی است. آینده آن را باید حول محور هنرمندان ساخت", "summary_fa": "در SoundCloud، ما معتقدیم که آینده موسیقی باید در درجه اول هنرمند باشد. نام تجاری و کسب و کار ما بر اساس اعتمادی است که هنرمندان به ما می‌دهند، و حفاظت از آن برای ما ضروری است. اولین هنرمند بودن، لنزی است که از طریق آن به هوش مصنوعی نزدیک می‌شویم و هم پتانسیل آن برای گسترش امکانات خلاقانه و هم خطراتی را که برای هنرمندان، حقوق آنها و جوامعی که ایجاد می‌کنند، می‌شناسیم. تکنولوژی نحوه ساخت موسیقی را تغییر خواهد داد. مسئولیت ما برای محافظت از هنرمندانی که آن را می سازند، نخواهد بود. اغلب اوقات، هوش مصنوعی به عنوان یک انتخاب باینری در نظر گرفته می شود: همه خوب یا همه بد، آن را در آغوش بگیرید یا آن را رد کنید. زمان آن فرا رسیده است که به این دگرگونی با تفاوت ظریفی که هنرمندان سزاوار آن هستند بپردازیم. واقعیت این است که هوش مصنوعی در صورت مدیریت اشتباه، خطرات وجودی و در صورت مدیریت صحیح فرصت‌های تغییر دهنده بازی را به همراه دارد. این مسئولیت ما در قبال هنرمندان است که هم این خطرات را به حداقل برسانیم و هم آن فرصت ها را به حداکثر برسانیم. مدیر عامل SoundCloud مرتبط درباره سیاست‌های هوش مصنوعی صحبت می‌کند: «آرزوی دور شدن از ظهور موسیقی هوش مصنوعی یک استراتژی نیست» نشانه‌های CL با THEBLACKLABEL، اتحاد مجدد با تهیه‌کننده قدیمی تدی برای لحظات کامل وضعیت آب و هوای سخت، بندهای شعاع و یافتن نسل بعدی سال‌ها تا جشنواره سال آینده. نوآوری زنده و حفاظت از هنرمند باید با هم تکامل یابد هر تغییر عمده در موسیقی درک ما را از معنای خلقت به چالش کشیده است. از نمونه برداری و سینت سایزر گرفته تا تنظیم خودکار و تولید دیجیتال، فناوری های جدید به طور مداوم مرزهای خلاقیت را جابجا کرده اند، درها را به روی هنرمندان جدید باز کرده", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۲۶ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "SoundCloud CEO Talks AI Policies: ‘Wishing Away the Advent of AI Music Is Not a Strategy’", "link": "https://www.billboard.com/pro/soundcloud-ceo-ai-policies-qa/", "summary": "This year began with Bandcamp issuing a hardline stance against AI music, marking the first — and only — outright ban of AI-generated music on an online music platform. Now, it is ending with SoundCloud and its CEO, Eliah Seton , calling for a much more “nuanced” discussion of the topic. “There’s been a very binary frame,” says Seton of the conversation around AI musicmaking and how music platforms should deal with it. “It is either good or evil, accept it or reject it.” Related AI Is Changing Music. Its Future Must Be Built Around Artists. CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive More than at other listening platforms, Seton appears interested in finding ways for SoundCloud to work with licensed AI music companies. In the past two weeks, SoundCloud has inked deals with Moises and ElevenLabs’ Eleven Music so that users can easily port over their AI-aided creations to SoundCloud and vice versa. These deals add to the platform’s 10 other AI music partnerships dating back to 2024 , including with Tuney, Tuttii, AIBeatz, TwoShot, Starmony and ACE Studio. While Spotify has also eyed new opportunities with AI music, it has focused on developing its own AI-powered music remixing tool in-app, which is expected to debut early next year, rather than providing a pipeline to trusted partners. SoundCloud boasts most songs that are available on other streaming platforms, but it fulfills a different purpose for many of its users. Seton says that 85% of listening on the platform today is to user-generated content (UGC), including remixes, covers and demos. Its DIY ethos makes it, perhaps, a more fertile ground for sharing AI-enabled songs. In fact, it already has been: One of the biggest AI music moments to date took place on SoundCloud when Metro Boomin uploaded “BBL Drizzy,” his remix of an AI song by Udio user King Willonius, in an effort to get back at Drake. In a new open letter , published exclusively with Billboard, Seton explains the company’s stance on AI today, writing that “the future of music should be artist-first” and that AI music is allowed as long as it does not violate the platform’s new community guidelines and terms of use about “spam, fraud and deceptive activity.” “AI slop has no place on SoundCloud,” Seton’s letter reads, adding that “SoundCloud will not tolerate deceptive us", "date_str": "2026-11-17T16:00:00+00:00", "hash": "1ff84970da305ad6", "title_fa": "مدیر عامل SoundCloud درباره سیاست‌های هوش مصنوعی صحبت می‌کند: «آرزو کردن ظهور موسیقی هوش مصنوعی یک استراتژی نیست»", "summary_fa": "امسال با بندکمپ شروع شد که موضعی سختگیرانه علیه موسیقی هوش مصنوعی صادر کرد و اولین - و تنها - ممنوعیت مطلق موسیقی تولید شده توسط هوش مصنوعی در یک پلتفرم موسیقی آنلاین را رقم زد. اکنون، با SoundCloud و مدیر عامل آن، Eliah Seton، به پایان می رسد، که خواستار یک بحث بسیار دقیق تر در مورد این موضوع هستند. ستون در مورد مکالمه پیرامون موسیقی سازی هوش مصنوعی و نحوه برخورد پلتفرم های موسیقی با آن می گوید: «یک فریم باینری وجود دارد. یا خیر است یا شر، آن را بپذیر یا رد کن.» هوش مصنوعی مرتبط در حال تغییر موسیقی است. آینده آن را باید حول محور هنرمندان ساخت. CL با THEBLACKLABEL امضا می‌کند، با تهیه‌کننده دیرینه تدی پیوند می‌یابد برای لحظه‌ای کامل، شرایط جوی سخت، بندهای شعاع و یافتن نسل بعدی سرفصل‌های جشنواره: این یک مبارزه سال به سال برای زنده ماندن است بیش از سایر پلت‌فرم‌های شنیداری، به نظر می‌رسد Seton برای شرکت‌های موسیقی با مجوز CAI علاقه‌مند است. در دو هفته گذشته، SoundCloud قراردادهایی با Moises و ElevenLabs Eleven Music منعقد کرده است تا کاربران بتوانند به راحتی آثار خود را با کمک هوش مصنوعی به SoundCloud و بالعکس منتقل کنند. این قراردادها به 10 مشارکت دیگر در زمینه موسیقی هوش مصنوعی پلتفرم اضافه می شود که به سال 2024 بازمی گردد، از جمله با Tuney، Tuttii، AIBeatz، TwoShot، Starmony و ACE Studio. در حالی که Spotify به فرصت‌های جدیدی در زمینه موسیقی هوش مصنوعی چشم دوخته است، اما به جای ارائه خط لوله به شرکای مورد اعتماد، بر توسعه ابزار ریمیکس موسیقی در برنامه خود مبتنی بر هوش مصنوعی تمرکز کرده است. SoundCloud دارای اکثر آهنگ هایی است که در سایر سیستم عامل های پخش در دسترس هستند، اما برای بسیاری از کاربران خود هدف متفاوتی را برآورده می کند. ستون می گوید", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/eliah-seton-courtesy-of-soundcloud.jpg?w=667", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "موسیقی"], "datetime_fa": "۲۶ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "2026 CMA Awards Predictions: Who Will Win?", "link": "https://www.billboard.com/lists/cma-awards-predictions-2026-who-will-win-nashville/", "summary": "Will the year of Ella Langley continue at the 60 th annual CMA Awards on Nov. 18? Langley has already had a record-breaking 2026, as her song “Choosin’ Texas” set the all-time mark for the most weeks at No. 1 on the Billboard Hot 100 with a total of 27 weeks in the top spot. The tune’s massive success helped Langley earn nine nominations for the awards, leading all artists and tying the record for the most nods in one year by a female artist (matching Miranda Lambert’s 2010 and 2014 hauls and Lainey Wilson’s 2023 tally). Lambert follows Langley with seven nominations; Kacey Musgraves and producer Ben West have five, while Cody Johnson, Chris Stapleton and Stephen Wilson Jr. have four each. Wilson, who will return as host for the third time (and the second as a solo host), earned three nods. The evening, which will air on ABC and stream live on Disney + for the first time from Nashville’s Bridgestone Arena, will also include performances by Cody Johnson, Miranda Lambert, Ella Langley, Tim McGraw and more. The eligibility period for nominated releases runs July 1, 2025-June 30, 2026. Last year s top winners include Lainey Wilson, Cody Johnson, Ella Langley, Riley Green and Zach Top. Here are Billboard ’s predictions on who will emerge victorious in select categories, from Melinda Newman (executive editor, West Coast and country) and Jessica Nicholson (associate editor, Nashville). Billboard will be streaming live from the CMA red carpet starting at 6 p.m. ET/ 3 p.m. PT on Samsung TV Plus, Amazon Fire TV, Billboard News YouTube channel and Billboard Country’s X account.", "date_str": "2026-11-17T15:57:44+00:00", "hash": "4524c6bed9129e2a", "title_fa": "پیش بینی جوایز CMA 2026: چه کسی برنده خواهد شد؟", "summary_fa": "آیا سال اللانگلی در شصتمین جوایز سالانه CMA در 18 نوامبر ادامه خواهد داشت؟ لنگلی پیش از این در سال 2026 رکوردشکنی داشته است، زیرا آهنگ او \"Choosin' Texas\" با مجموع 27 هفته در رتبه اول، بیشترین هفته ها را در رتبه 1 بیلبورد هات 100 قرار داد. موفقیت عظیم این آهنگ به لنگلی کمک کرد تا 9 نامزدی جوایز را به دست آورد، همه هنرمندان را رهبری کرد و رکورد بیشترین نواختن در یک سال توسط یک هنرمند زن را به دست آورد (مطابق با آهنگ‌های میراندا لمبرت در سال‌های 2010 و 2014 و لاینی ویلسون در سال 2023). لمبرت پس از لنگلی با هفت نامزدی. کیسی ماسگریوز و بن وست تهیه کننده 5 نفر و کودی جانسون، کریس استپلتون و استفان ویلسون جونیور هر کدام 4 امتیاز دارند. ویلسون، که برای سومین بار (و دومین بار به عنوان مجری انفرادی) به عنوان میزبان باز خواهد گشت، سه امتیاز کسب کرد. این شب که از ABC پخش می شود و برای اولین بار به صورت زنده از دیزنی + پخش می شود و برای اولین بار از Bridgestone Arena در نشویل اجرا می شود، همچنین شامل اجرای کودی جانسون، میراندا لمبرت، الا لنگلی، تیم مک گرو و غیره خواهد بود. دوره واجد شرایط بودن برای نسخه های نامزد شده از 1 ژوئیه 2025 تا 30 ژوئن 2026 اجرا می شود. برندگان برتر سال گذشته شامل لینی ویلسون، کودی جانسون، الا لنگلی، رایلی گرین و زک تاپ هستند. در اینجا پیش‌بینی‌های بیلبورد در مورد اینکه چه کسی در دسته‌های منتخب، از ملیندا نیومن (ویراستار اجرایی، ساحل غربی و کشور) و جسیکا نیکلسون (ویراستار وابسته، نشویل) پیروز ظاهر می‌شود، آمده است. بیلبورد از ساعت 6 بعد از ظهر به صورت زنده از فرش قرمز CMA پخش می شود. ET/ 3 بعد از ظهر PT در Samsung TV Plus، Amazon Fire TV،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P105Z7HO-e1794868066622.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۱۹:۲۷"}, {"source": "Billboard", "title": "Taylor Swift’s Song of the Year Grammy Quip Was Likely No Accident", "link": "https://www.billboard.com/music/awards/taylor-swift-mentions-grammy-losing-streak-song-of-the-year-1236383733/", "summary": "Taylor Swift had the honor of announcing the final two categories on Monday’s (Nov. 16) livestream of nominations for the 69th annual Grammy Awards. “The last two categories to be announced — one of them I’ve had a lot of luck in, the other one I’m zero-for-eight,” she said. “Here are the nominees for album [of the year] and song of the year.” It was a winning remark – amusing and lightly self-deprecating. Perhaps Swift was just striking a note of humility, reminding the audience that, for all her enormous success, she doesn’t win em all. Or was it more than that? Was Swift signaling that she really, really wants to win song of the year after eight losses in the category? She has had more nominations without a win than anyone else in the history of the category, a distinction she d probably like to shed. Related Grammy Nominations 2027: See the Complete List RAYE Rosalía Lead 2027 Grammy Nominations as Women Make History Taylor Swift Sets New Grammy Record With 5 Years of Major-Category Nominations It echoes the situation on the Grammy telecast in February 2024 where Jay-Z pointedly reminded the audience that Beyoncé had never won album of the year, despite four previous nominations in that category. Beyoncé finally won album of the year the very next year with Cowboy Carter . She was overdue for a win in the category, it’s true, but Jay may have helped clinch the award for her by signaling just how much it meant to her. Even though Bey had won 32 Grammys at that point (she has since won three more), she really wanted to win what many consider to be the most prestigious Grammy. Related Watch Taylor Swift Joke About Her Song of the Year Losing Streak While Presenting 2027 Grammy Nods Swift has won album of the year a record four times, but she has never won song of the year, even though many consider her to be the songwriter of her generation. In June, she became the second-youngest person ever to be inducted into the Songwriters Hall of Fame, behind only Stevie Wonder . (Quick aside: Wonder hasn’t won a Grammy for song of the year, either.) If Swift were to win song of the year for “I Knew It, I Knew You,” which she co-wrote with frequent collaborator Jack Antonoff , it might help her clinch the Oscar for best original song, another award she has made no secret of wanting. The Grammys will be presented on Feb. 7. Final-round voting for the Oscars opens 18 days later, on Feb. 25. Swift can win the Oscar without first winning a Grammy, but who wouldn’t want ", "date_str": "2026-11-17T15:47:38+00:00", "hash": "a84c5792a0d96e3b", "title_fa": "آهنگ سال گرمی تیلور سویفت احتمالاً تصادفی نبود", "summary_fa": "تیلور سوئیفت این افتخار را داشت که دو دسته نهایی را در جریان زنده روز دوشنبه (16 نوامبر) نامزدهای شصت و نهمین جوایز سالانه گرمی اعلام کند. او گفت: \"دو دسته آخری که اعلام می شود - یکی از آنها من در آن شانس زیادی داشته ام و دیگری صفر به هشت هستم.\" \"در اینجا نامزدهای آلبوم [سال] و آهنگ سال هستند.\" این یک اظهار نظر برنده بود - سرگرم کننده و کمی خود را تحقیرکننده. شاید سوئیفت فقط یک نت تواضع نشان می داد و به مخاطب یادآوری می کرد که با وجود تمام موفقیت های عظیمش، او همه آنها را به دست نمی آورد. یا بیشتر از این بود؟ آیا سوئیفت نشان می‌داد که واقعاً می‌خواهد پس از هشت باخت در این رده، برنده آهنگ سال شود؟ او بیش از هر کس دیگری در تاریخ این رده نامزدی بدون برد داشته است، امتیازی که احتمالاً دوست دارد از دست بدهد. نامزدهای مرتبط گرمی 2027: فهرست کامل را ببینید RAYE Rosalía Lead 2027 نامزدهای گرمی به عنوان زنان تاریخ ساز تیلور سوئیفت رکورد جدید گرمی را با 5 سال نامزدی در رده های اصلی ثبت کرد. سال، با وجود چهار نامزدی قبلی در آن بخش. بیانسه سرانجام سال بعد با کابوی کارتر برنده آلبوم سال شد. درست است که او برای برنده شدن در این رده تاخیر داشت، اما جی ممکن است با نشان دادن اهمیت این جایزه برای او کمک کرده باشد. با وجود اینکه بی در آن زمان 32 جایزه گرمی برده بود (او از آن زمان تاکنون سه جایزه دیگر را برده است)، او واقعاً می‌خواست برنده چیزی شود که بسیاری آن را معتبرترین گرمی می‌دانند. تماشای مرتبط شوخی تیلور سوئیفت در مورد آهنگ سالش از دست دادن آهنگ سال 2027 در حین ارائه گرمی نودز 2027 سوئیفت چهار بار برنده آلبوم سال شده است، اما", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/P108QQUY-e1792342281327.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۱۹:۱۷"}, {"source": "Billboard", "title": "Olivia Rodrigo ‘Over the Moon’ About ‘you seem pretty sad’ Grammy Nods: ‘I Love This Album So Much’", "link": "https://www.billboard.com/music/awards/olivia-rodrigo-reacts-2027-grammy-nominations-1236383921/", "summary": "Olivia Rodrigo is pretty happy for a girl with seven new Grammy nominations. After the Recording Academy unveiled its list of 2027 contenders which included the pop star in three of the major all-genre categories — the pop star shared her breathless reaction on Instagram . Related Grammy Nominations 2027: See the Complete List Grammy Awards: All the Artists Who’ve Been Nominated in the Big 4 Categories in the Same Year Olivia Rodrigo’s ‘you seem pretty sad for a girl so in love’ Scores Fifth Week at No. 1 on Billboard 200 In her Monday (Nov. 16) post, the singer began, woke up this morning to 7 Grammy nominations!!!! I am over the moon!!!!! she continued. I love this album so much and for it to be recognized in this way is the biggest honor. The best part for Rodrigo, she said, was being nominated alongside one of her idols. I am extra stoked because Robert Smith and I are nominated for two awards together for what’s wrong with me which is just the coolest most pinch-me moment I could’ve ever dreamed up, she added. Yipeeee. Marking her first-ever collaboration, What s Wrong With Me appeared on the Daisy Chain Fields founder s Billboard 200 -topping third album, you seem pretty sad for a girl so in love . She and The Cure frontman are up for best rock performance and best rock song thanks to the track, while the LP is in the running for album of the year and best pop vocal album. Rodrigo also racked up 2027 nominations for both song and record of the year for The Cure, as well as best pop vocal performance. The former Disney star is well acquainted with the Grammys, having previously won best new artist, best pop solo performance for eight-week Billboard Hot 100 -topping single Drivers License and best pop vocal album for debut album Sour in 2022. Next year s Grammys will take place on Feb. 7. RAYE leads with 11 nominations, followed by Rosalía with nine. Rodrigo is tied for third-most nods with Phoebe Bridgers, Miranda Lambert and Ella Langley.", "date_str": "2026-11-17T15:42:02+00:00", "hash": "fa8f4d6feb5497a1", "title_fa": "اولیویا رودریگو «Over the Moon» درباره «شما خیلی غمگین به نظر می‌رسید» گرمی نودز: «من این آلبوم را خیلی دوست دارم»", "summary_fa": "اولیویا رودریگو برای دختری با هفت نامزدی جدید گرمی بسیار خوشحال است. پس از اینکه آکادمی ضبط فهرستی از رقبای خود در سال 2027 را معرفی کرد که شامل ستاره پاپ در سه دسته اصلی همه ژانر بود - ستاره پاپ واکنش نفس گیر خود را در اینستاگرام به اشتراک گذاشت. نامزدهای مرتبط گرمی 2027: فهرست کامل جوایز گرمی را مشاهده کنید: همه هنرمندانی که در همان سال در 4 دسته بزرگ نامزد شده‌اند. «شما برای دختری خیلی عاشق» اثر اولیویا رودریگو با عنوان «به نظر خیلی غمگین به نظر می‌آیید برای دختری خیلی عاشق» رتبه پنجم را در هفته پنجم در بیلبورد به دست آورد (200 پست 200). امروز صبح به 7 نامزدی گرمی !!!! من بالای ماه هستم!!!!! او ادامه داد من این آلبوم را خیلی دوست دارم و شناخته شدن آن در این راه بزرگترین افتخار است. او گفت که بهترین بخش برای رودریگو، نامزد شدن در کنار یکی از بت هایش بود. او اضافه کرد که من و رابرت اسمیت با هم برای دو جایزه برای آنچه اشتباه است نامزد شده‌ایم که جالب‌ترین لحظه‌ای است که می‌توانستم تصور کنم. ییپییی به عنوان اولین همکاری او، Whats Wrong With Me در آلبوم سوم بیلبورد 200 بنیانگذار دیزی چین فیلدز ظاهر شد، برای دختری که اینقدر عاشق است بسیار غمگین به نظر می رسید. او و رهبر گروه The Cure به لطف این ترانه، برای بهترین اجرای راک و بهترین آهنگ راک نامزد می‌شوند، در حالی که LP در رقابت برای آلبوم سال و بهترین آلبوم آواز پاپ است. رودریگو همچنین نامزد سال 2027 برای آهنگ و رکورد سال برای The Cure و همچنین بهترین اجرای آواز پاپ شد. ستاره سابق دیزنی به خوبی با جایزه گرمی آشنا است، او قبلاً برنده بهترین هنرمند جدید، بهترین اجرای انفرادی پاپ برای هشت هفته بیلبورد Hot 100 تک آهنگ برتر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P107VA0M-e1794928638204.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۱۹:۱۲"}, {"source": "Billboard", "title": "‘KPop Demon Hunters’ Extends Record for Most Weeks at No. 1 on Billboard’s Soundtracks Chart: Full List", "link": "https://www.billboard.com/lists/billboard-top-soundtracks-chart-most-weeks-no-1-full-list/", "summary": "KPop Demon Hunters returns to No. 1 on Billboard ’s Soundtracks chart, dated Nov. 21, after having been displaced last week by Tim Burton s The Nightmare Before Christmas . This the 68th nonconsecutive week on top for KPop Demon Hunters , which constitutes an all-time record. So, we thought it would be a good time to look at the 12 soundtracks that have led the chart for 25 weeks or more. This chart was introduced a little more than 25 years ago – on June 30, 2001 – which means our list of soundtracks with the most weeks at No. 1 doesn’t include blockbuster soundtracks of previous eras, such as West Side Story, The Sound of Music, Doctor Zhivago, Saturday Night Fever and Purple Rain . Actually, it does include one – The Vince Guaraldi Trio ’s 1965 TV soundtrack, A Charlie Brown Christmas – but only because of its chart success since 2001. KPop Demon Hunters has been No. 1 for all but five of its 73 weeks on Top Soundtracks, having yielded for one week each to Wicked: For Good , A Charlie Brown Christmas , Charli xcx ’s Wuthering Heights , Heated Rivalry and Tim Burton s The Nightmare Before Christmas . Related Golden From KPop Demon Hunters Wins Best Original Song at 2026 Oscars, But Speech Is Cut Short Here are the 12 soundtracks that have logged the most weeks at No. 1 on Billboard ’s Soundtracks chart since the chart was introduced on June 30, 2001. The list includes two TV soundtracks and 10 film soundtracks. Notably, the five soundtracks with the most weeks at No. 1 are all from animated films. The number in each header is the number of weeks the album has spent at No. 1. They are listed in ascending order.", "date_str": "2026-11-17T15:30:00+00:00", "hash": "484ce893175239ba", "title_fa": "«KPop Demon Hunters» رکورد بیشترین هفته‌ها را در رتبه اول جدول موسیقی متن بیلبورد افزایش داد: فهرست کامل", "summary_fa": "KPop Demon Hunters پس از اینکه هفته گذشته توسط تیم برتون کابوس قبل از کریسمس جابجا شده بود، به رتبه 1 جدول موسیقی متن بیلبورد در تاریخ 21 نوامبر بازگشت. این شصت و هشتمین هفته متوالی در صدر برای شکارچیان شیاطین KPop است که یک رکورد تمام دوران است. بنابراین، ما فکر کردیم که زمان خوبی است که به 12 موسیقی متنی که به مدت 25 هفته یا بیشتر در جدول پیشرو بوده اند نگاه کنیم. این نمودار کمی بیش از 25 سال پیش - در 30 ژوئن 2001 - معرفی شد که به این معنی است که فهرست موسیقی‌های متن ما با بیشترین هفته‌ها در رتبه 1 شامل موسیقی متن فیلم‌های پرفروش دوره‌های قبلی، مانند داستان West Side، The Sound of Music، Doctor Zhivago، Saturday Night Fever و Purple Rain نیست. در واقع، شامل یکی - موسیقی متن فیلم تلویزیونی 1965 Vince Guaraldi Trio، A Charlie Brown Christmas - است، اما فقط به دلیل موفقیت در نمودار از سال 2001. KPop Demon Hunters رتبه اول را کسب کرده است. 1 برای همه به جز پنج هفته از 73 هفته آن در Top Soundtracks، که هر کدام به مدت یک هفته به Wicked: For Good، A Charlie Brown Christmas، Charli xcx's Wuthering Heights، Heated Rivalry و تیم برتون The Nightmare Before Christmas پرداخته است. Related Golden From KPop Demon Hunters برنده بهترین آهنگ اصلی در اسکار 2026 شد، اما Speech Is Cut Short در اینجا 12 موسیقی متن فیلم که بیشترین هفته ها را در جدول موسیقی متن بیلبورد از زمان معرفی نمودار در 30 ژوئن 2001 به خود اختصاص داده اند، آمده است. این لیست شامل دو موسیقی متن تلویزیون و 10 موسیقی متن فیلم است. قابل ذکر است، پنج موسیقی متن با بیشترین هفته در رتبه 1، همه از فیلم های انیمیشن هستند. تعداد در هر هدر تعداد", "image_url": "https://www.billboard.com/wp-content/uploads/2025/08/02-kpop-demon-hunters-cr-netflix-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲۶ آبان • ۱۹:۰۰"}, {"source": "Billboard", "title": "Mega Tours by Oasis, Dua Lipa and Coldplay Drive U.K. Music’s Economic Contribution to Record-Highs", "link": "https://www.billboard.com/pro/uk-music-this-is-music-report-2026-oasis-dua-lipa-coldplay/", "summary": "Headline-making tours by the likes of Oasis , Coldplay and Dua Lipa helped drive the U.K. music industry toward generating a record £8.4 billion ($11.1 billion) for the country’s economy in 2025. The figure marks a 5.7% increase on the previous year, according to the newly-released This Is Music report from UK Music, the umbrella organization representing a range of industry bodies, including the BPI and collection society PRS For Music. Published annually, This Is Music provides a comprehensive assessment of the U.K. music industry’s performance domestically and on the world stage. The report examines employment figures, global music sales and revenue generated through live ticket sales, tourism and other industry activity, offering an overview of music’s contribution to the country’s overall GDP. Related BTS The Weeknd Break Records on Monthly Boxscore Report CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive The 2026 report points to the international success of British artists as a key driver of growth, with major overseas tours by Oasis, Coldplay, Lipa, Sam Fender and Robbie Williams helping boost figures. Recorded music exports also reached a new high of £800 million ($1.05 billion), up from £794 million ($1.04 billion) in 2024. The Oasis Live ‘25 Tour, which was recently immortalized in Stephen Knight’s blockbuster Oasis: Don’t Look Back In Anger documentary, hit cities such as Seoul, Tokyo, Mexico City, Melbourne, Buenos Aires, Chicago, Toronto and Los Angeles following its initial U.K. and Ireland run in July and August. Lipa’s Radical Optimism tour, meanwhile, took in locations such as Seattle, San Francisco and Amsterdam, Madrid, Munich, Auckland and Sydney, alongside U.K. shows at Wembley Stadium and Liverpool’s Anfield Stadium. In the U.K., 2025 total music tourism revenues — covering expenditure including the cost of a ticket for a concert or festival travel, accommodation and meals while traveling to events — were £11.2 billion ($14.7 billion), up 11.3% from the previous year. Overall music exports also reached a record £5 billion ($6.9 billion) in 2025, up 3.6% on the previously reported figure of £4.8 billion ($6.33 million), with U.K. remaining the second-biggest recorded music exporter after the U.S. The figure includes revenues generated outside the U.K., such as sales and", "date_str": "2026-11-17T15:17:48+00:00", "hash": "534d2f2f2d78e4ad", "title_fa": "Mega Tours توسط Oasis، Dua Lipa و Coldplay Drive سهم اقتصادی موسیقی بریتانیا در رکوردهای اوج", "summary_fa": "تورهای سرفصلی مانند Oasis، Coldplay و Dua Lipa به صنعت موسیقی بریتانیا کمک کرد تا در سال 2025 رکورد 8.4 میلیارد پوند (11.1 میلیارد دلار) برای اقتصاد این کشور تولید کند. بر اساس گزارش جدید موسسه Music UK، این رقم نشان دهنده افزایش 5.7 درصدی نسبت به سال قبل است. نهادهای صنعتی، از جمله BPI و انجمن مجموعه PRS For Music. This Is Music که سالانه منتشر می شود، ارزیابی جامعی از عملکرد صنعت موسیقی بریتانیا در داخل و صحنه جهانی ارائه می دهد. این گزارش به بررسی ارقام اشتغال، فروش جهانی موسیقی و درآمد حاصل از فروش بلیط زنده، گردشگری و سایر فعالیت‌های صنعتی می‌پردازد و یک نمای کلی از سهم موسیقی در تولید ناخالص داخلی کلی کشور ارائه می‌دهد. BTS مرتبط با شکستن رکوردهای آخر هفته در گزارش ماهانه باکس اسکور CL نشانه های CL با THEBLACKLABEL، اتحاد مجدد با تهیه کننده طولانی مدت تدی برای لحظه کامل هوای سخت، بندهای شعاع و یافتن نسل بعدی سرفصل های جشنواره: این یک گزارش بین المللی سال به سال است تا 2 امتیاز بین المللی از Ali6 The Fveight. هنرمندان به عنوان یک محرک کلیدی رشد، با تورهای بزرگ خارج از کشور توسط Oasis، Coldplay، Lipa، Sam Fender و Robbie Williams به افزایش چهره کمک کردند. صادرات موسیقی ضبط شده نیز به 800 میلیون پوند (1.05 میلیارد دلار) رسیده است که از 794 میلیون پوند (1.04 میلیارد دلار) در سال 2024 افزایش یافته است. The Oasis Live '25 Tour که اخیراً در فیلم پرفروش استفان نایت جاودانه شد: در خشم به عقب نگاه نکن، مستندی مانند شهر مکزیکو، شهرها و شهرهایی مانند Toyok. آیرس، شیکاگو، تورنتو و لس آنجلس پس از اجرای اولیه خود در بریتانیا و ایرلند در ماه های جولای و آگوست اجرا می شود. در همین حال، تور خوش‌بینی رادیکال لیپا در مکان‌هایی مانند سیاتل، سانفرانسیسکو و", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/P1081AWA-e1789130579929.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی c recording; best remixed recording), Muse (best rock album), Paul McCartney (best traditional pop vocal album; best music film; best audio book, narration, and storytelling recording), and The Rolling Stones (best rock performance; best rock song; best rock album) all flew the flag for British talent. Speaking on RAYE’s success, Guy Moot , chair and chief executive officer of Warner Chappell Music (WCM), tells Billboard U.K. , “RAYE has once again made history in what is already an extraordinary, groundbreaking career. Leading this year’s Grammys as the most nominated act with 11 – and tying the all-time record for the most nominations by a female artist in a single year – really is an incredible feat.” He continued, “Raye is a generational artist and songwriter who pours every ounc", "date_str": "2026-11-17T15:13:30+00:00", "hash": "c3cdc401c90b01e4", "title_fa": "پاسخ مدیران بریتانیا به نمایش قوی در نامزدهای گرمی 2027: \"موسیقی بریتانیا از قدرت به قدرت رسیده است\"", "summary_fa": "RAYE، Olivia Dean، Sienna Spiro و هنرمندان دیگر بریتانیایی در نامزدی جایزه گرمی 2027 که روز دوشنبه (16 نوامبر) فاش شد، شرکت کردند. نامزدهای مرتبط گرمی 2027: لیست کامل را ببینید RAYE Rosalía Lead 2027 نامزدهای گرمی به عنوان زنان تاریخ ساز می شوند کلمبیا پیشتاز، درخشش هند، جزیره گسترش رشته BNA: Big 4 دسته گرمی توسط Record Label هنرمندان رقیب برای حضور در مراسم زنده آتی یوتیوب در جریان پخش زنده حضور داشتند. یونگ بلود و بیشتر. این مراسم در 7 فوریه در Crypto.com Arena در لس آنجلس، کالیفرنیا برگزار خواهد شد. در رشته‌های عمومی و دسته‌بندی‌های ژانر، هنرمندان بریتانیایی در نامزدی‌ها عملکرد قوی داشتند. به طور کلی، RAYE با 11 نوبت در تعدادی از دسته‌ها از جمله آلبوم سال (این موسیقی ممکن است حاوی امید باشد)، و همچنین آهنگ و رکورد سال برای «شوهر من کجاست!» پیشتاز است. او با 11 تکان دادن سر خود، بیانسه را برای بیشترین نامزدی توسط یک هنرمند زن برای جوایز گرمی به دست آورد. دین همچنین در رده آلبوم سال برای آلبوم دومش The Art of Loving با «مردی که نیاز دارم» به عنوان بخشی از شش نامزدی مجموع او در هر دو آه on-president-film-tv-1236949403/", "summary": "Fanatics Studios has tapped Jamal Henderson as its first-ever president of film and television. Henderson joins the sports entertainment studio, a joint venture between Fanatics and OBB, after working with LeBron James and his SpringHill Entertainment company for more than a decade. Led by OBB Media founder Michael D. Ratner, Fanatics Studios is an offshoot [ ]", "date_str": "2026-11-17T16:00:00+00:00", "hash": "039badca83bb0744", "title_fa": "استودیو Fanatics جمال هندرسون را به عنوان اولین رئیس فیلم و تلویزیون استخدام کرد (اختصاصی)", "summary_fa": "استودیو Fanatics جمال هندرسون را به عنوان اولین رئیس سینما و تلویزیون انتخاب کرده است. هندرسون پس از بیش از یک دهه همکاری با لبرون جیمز و شرکت سرگرمی اسپرینگ هیل، به استودیوی سرگرمی ورزشی، یک سرمایه گذاری مشترک بین Fanatics و OBB می پیوندد. به رهبری موسس OBB Media مایکل دی. راتنر، استودیوی Fanatics یک شاخه است [ ] در نقش جدید خود، هندرسون بر تمامی ابتکارات محتوایی استودیوی Fanatics در سراسر فیلم، تلویزیون و دیجیتال نظارت خواهد کرد و پروژه‌های پیشرو از توسعه تا تولید را هدایت می‌کند. او در لس آنجلس مستقر است و مستقیماً به رتنر گزارش می دهد. از زمان راه‌اندازی در اوایل سال جاری، استودیو Fanatics مشترکاً ESPYs 2026، Fanatics Fest: All Access برای ESPN و The Fanatics Flag Football Classic را تولید کرده است. پروژه‌های آتی آن شامل مستندی درباره سونی لی دارنده مدال طلای المپیک و فیلم رسمی المپیک برای LA28 است. هندرسون تهیه‌کننده‌ای برنده جایزه امی است که از آثارش در SpringHill می‌توان به Starting 5، Hutle، Rez Ball، On the Rise: JuJu Watkins، Top Boy و Naomi Osaka: The Second Set نتفلیکس و همچنین فیلم سینمایی Space Jam: A New Legacy اشاره کرد. در SpringHill، هندرسون همچنین به ایجاد روابط طولانی مدت با استعدادها و مشارکت در شبکه‌ها، استریمرها و برندها کمک کرد. راتنر می‌گوید: «هیچ وقت فرصت بزرگ‌تری در داستان‌سرایی ورزشی وجود نداشت و ما قصد داریم در آینده رهبری کنیم. \"جمال یکی از معتبرترین و با ارتباط‌ترین مدیران در ورزش و سرگرمی است، با توانایی اثبات شده برای تبدیل ایده‌های جاه‌طلبا 8684.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۶ آبان • ۱۹:۱۶"}, {"source": "Variety", "title": "Global Roller Derby League Eyes 2027 Launch, Aims to Update the Sport for Modern TV Audiences (EXCLUSIVE)", "link": "https://variety.com/2026/tv/news/global-roller-derby-league-2027-launch-update-sport-1236949787/", "summary": "Former blockchain executive David Berns, who served as president and chief operating officer of Blockchains, LLC, and also helped create the digital media platform ETHNews, is doing something entirely different for his next project: Roller derby. Berns has been named CEO of Global Roller Derby League, which is looking to revive the sport for TV [ ]", "date_str": "2026-11-17T15:45:00+00:00", "hash": "03db799eed2a237c", "title_fa": "راه اندازی Global Roller Derby League Eyes 2027، با هدف به روز رسانی ورزش برای مخاطبان تلویزیون مدرن (انحصاری)", "summary_fa": "دیوید برنز، مدیر اجرایی سابق بلاک چین، که به عنوان رئیس و مدیر عامل Blockchains، LLC خدمت کرده و همچنین به ایجاد پلتفرم رسانه دیجیتال ETHNews کمک کرده است، برای پروژه بعدی خود کاری کاملا متفاوت انجام می دهد: Roller Derby. برنز به عنوان مدیرعامل لیگ جهانی رولر دربی انتخاب شده است، که به دنبال احیای این ورزش برای تلویزیون است [ ] برنز در بیانیه ای گفت: «دربی غلتکی دارای تاریخچه قابل توجه و جذابیتی پایدار است. ما فرصتی را برای معرفی مجدد این ورزش نمادین، یک قطعه کلاسیک از آمریکاییانا، با رویکردی کاملاً جدید می بینیم. ما ورزش و هیجان یک مسابقه ورزشی را با شخصیت ها، رقابت ها و داستان سرایی که مخاطبان امروزی انتظار دارند ترکیب می کنیم. لیگ جهانی رولر دربی در حال ساخت یک برند قدرتمند است که ما معتقدیم طرفداران آن را فراتر از روز بازی خواهند پذیرفت. دربی غلتکی همچنان یک سرگرمی محبوب است. در لس آنجلس، لباس‌هایی از جمله دربی شهر فرشته، عروسک‌های دربی، دربی غلتکی SFV و دربی نوجوانان لس آنارشیست‌ها مورد توجه بسیاری قرار می‌گیرند. GRDL امیدوار است که یک قدم به آن نزدیک‌تر شود و دربی غلتکی را به قرعه‌ای تبدیل کند که زمانی در روزهای اولیه تلویزیون بود. ملک سرگرمی ورزشی در حال برنامه ریزی برای جذب اسکیت بازان مرد و زن از سراسر جهان است تا در پنج تیم مشترک از نیویورک، لس آنجلس، شیکاگو، دالاس و میامی به رقابت بپردازند. GRDL امیدوار است با بازی های تلویزیونی هفتگی خود که در مقابل تماشاگران زنده برگزار می شود، طیف گسترده ای از دموها را جذب کند. GRDL قصد دارد در اوایل سال 2027 آزمون‌های باز را برای شرکت‌کنندگان برگزار کند و این امتیاز را به شرکای پخش و پخش بالقوه ارائه می‌کند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Roller-Derby.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۶ آبان • ۱۹:۱۵"}, {"source": "Variety", "title": "Cannes Condemns Five-Year Prison Sentence Against Iranian Palme d’Or Winner Jafar Panahi and Pleads for International Support", "link": "https://variety.com/2026/film/global/cannes-condemns-five-year-prison-sentence-jafar-panahi-1236950242/", "summary": "The Cannes Film Festival has condemned the latest prison sentence handed down to Iranian filmmaker Jafar Panahi, who won last year s Palme d’Or with “It Was Just an Accident,” and has called on the international community to rally forces to prevent his incarceration. Panahi has been sentenced by a Tehran Revolutionary Court to five years [ ]", "date_str": "2026-11-17T15:15:32+00:00", "hash": "0e14534fc1d55a2d", "title_fa": "کن محکومیت پنج سال حبس برای جعفر پناهی برنده نخل طلای ایران و درخواست حمایت بین المللی", "summary_fa": "جشنواره فیلم کن آخرین حکم حبس صادر شده برای جعفر پناهی فیلمساز ایرانی که سال گذشته با فیلم «فقط یک تصادف بود» برنده نخل طلا شد را محکوم کرد و از جامعه جهانی خواست برای جلوگیری از حبس او، نیروها را جمع کند. پناهی از سوی دادگاه انقلاب تهران به پنج سال محکوم شده است [ ] این فیلمساز پیش از این با یک سال حبس تعزیری و دو سال ممنوعیت سفر ناشی از حکم جداگانه ای در سال 2025 مواجه بود. سومین پرونده حقوقی مربوط به فعالیت های فیلمسازی او نیز در جریان است. جشنواره فیلم کن روز پنجشنبه در بیانیه‌ای اعلام کرد: «جشنواره فیلم کن پیگرد قضایی جعفر پناهی را قاطعانه محکوم می‌کند و خواستار لغو تمامی تحریم‌هایی است که او را از سفر، خلق و ابراز آزادانه منع می‌کند». در ادامه این بیانیه آمده است: «جشنواره فیلم کن در کنار هنرمندان، جشنواره‌ها و مؤسسات فرهنگی در سراسر جهان، از جامعه بین‌المللی می‌خواهد که بسیج شده و صدای جمعی خود را برای جلوگیری از زندانی شدن او به گوش مردم برساند». پناهی که در دو دهه گذشته بارها با مقامات ایرانی درگیر بوده است، علیرغم دستگیری، زندان و ممنوعیت کار و مسافرت، به ساختن فیلم ادامه داده است. در سال 2010 از ساختن فیلم، صحبت با مطبوعات و مسافرت منع شد، اما به ساختن فیلم های مخفیانه ادامه داد. او دوباره در سال 2022 دستگیر شد و حدود هفت ماه بعد آزاد شد. پناهی علیرغم خطرات حبس بیشتر، از ترک ایران برای همیشه خودداری کرده است و در مارس 2026 پس از سفرهای بین المللی، به ویژه در ایالات متحده، برای تبلیغ «فقط یک تصادف»، یکی از سیاسی ترین فیلم های او تا به امروز، به کشورش بازگشت.", "image_url": "https://variety.com/wp-content/uploads/2025/12/GettyImages-2242610505-e1764854456566.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "بورس و طلا", "روابط بین‌الملل"], "datetime_fa": "۲۶ آبان • ۱۸:۴۵"}, {"source": "Variety", "title": "NBCUniversal Invests in Black Vertical Drama Platform From ‘Girls Trip’ Producer Will Packer", "link": "https://variety.com/2026/tv/news/nbcuniversal-black-vertical-drama-will-packer-1236950237/", "summary": "Will Packer and his son, Dom Packer, are launching a microdrama studio called June. Backed by NBCUniversal and HarbourView Equity Partners, the studio will develop, produce, finance and acquire projects intended for mobile viewing by Black audiences. June will focus on original vertical dramas rather than adapting traditional film and television projects into the vertical [ ]", "date_str": "2026-11-17T15:00:00+00:00", "hash": "fcd67b537a69b1ec", "title_fa": "NBCUniversal روی پلتفرم درام عمودی سیاه از ویل پکر تهیه کننده «Girls Trip» سرمایه گذاری می کند.", "summary_fa": "ویل پکر و پسرش دام پکر در حال راه اندازی یک استودیوی میکرودرام به نام ژوئن هستند. این استودیو با حمایت NBCUniversal و HarbourView Equity Partners پروژه‌هایی را توسعه، تولید، تامین مالی و خریداری خواهد کرد که برای تماشای موبایل توسط مخاطبان سیاه پوست در نظر گرفته شده است. ژوئن بر درام‌های عمودی اصلی تمرکز خواهد کرد تا پروژه‌های سنتی فیلم و تلویزیونی را در قالب عمودی اقتباس کند. ویل پکر به عنوان مدیرعامل در ماه ژوئن خدمت خواهد کرد و Dom به عنوان رئیس و بر استراتژی، عملیات و رشد نظارت خواهد کرد. HarbourView که سرمایه‌گذاری‌های خود را بر روی موسیقی، ورزش، رسانه و سرگرمی متمرکز می‌کند، به‌ویژه بر تضمین مشارکت با برند در ماه ژوئن تمرکز خواهد کرد، در حالی که NBCUniversal به حمایت خلاقانه و مالی خود از کار ویل پکر ادامه می‌دهد. او با هر دو تلویزیون یونیورسال و یونیورسال پیکچرز تحت قراردادهای اولیه قرار دارد. داستان‌های مرتبط امیل هیرش در فیلم هیجان‌انگیز تگزاس مجموعه تاج بنفش بازی می‌کند (اختصاصی) «من همیشه به گفتن داستان‌های معتبری معتقد بوده‌ام که مخاطبان را در جایی که هستند ملاقات می‌کند، و با ژوئن، ما خانه‌ای برای آن داستان‌ها در کنار شرس کلارک، تیم متخصص او در HarbourView و شرکای مورد اعتماد من در NBC در ان‌بی‌سی می‌سازیم.» این نام گرما و عاشقانه تابستان را به تصویر می‌کشد و آزادی و فرهنگ سیاه‌پوستان را تا ژوئن و ماه موسیقی سیاه جشن می‌گیرد. این روح شادی، ارتباط و غرور در قلب چیزی است که ما خلق می‌کنیم.» کلارک، موسس و مدیر عامل HarbourView، گفت: «سرگرمی عمودی صمیمیت و بی‌واسطگی را ارائه می‌کند که می‌تواند داستان سرایی با طنین فرهنگی را به ویژه قدرتمند کند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/MixCollage-17-Nov-2026-09-48-AM-8483.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "سرمایه‌گذاری"], "datetime_fa": "۲۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Signed: Jackson Wang Inks With WME; Beach Bunny Hops to Atlantic’s Shores", "link": "https://www.billboard.com/lists/jackson-wang-wme-beach-bunny-atlantic-music-signings/", "summary": "Jackson Wang (WME) Singer, songwriter and entrepreneur Jackson Wang signed with WME . Among his other projects, the Chinese artist is currently starring in an Apple campaign tied to his new single and video Thank You, released in September. He continues to be represented by Team Wang Records and Roc Nation. Wang released his debut album, MIRRORS , in 2019 and has since collaborated with artists including Ciara, Swae Lee, Major Lazer, Galantis, Gucci Mane, Joji and GoldLink. He has also played U.S. arenas, including Los Angeles Kia Forum and Brooklyn s Barclays Center. — Chris Eggertsen Beach Bunny (Atlantic Records) Beach Bunny Brandon Hoeg Beach Bunny signed to Atlantic Records . The band s debut single for the label is Vinegar. The group is embarking on a 31-date North American headline tour beginning next March, with a 13-date U.K./EU run opening for Weezer to follow starting in May. The name Beach Bunny refers interchangeably to lead singer Lili Trifilio and the band also composed of bassist/lead guitarist Anthony Vaccaro and drummer Jon Alvarado. Its most recent album, Tunnel Vision , was released last year. “‘Vinegar’ is less a discussion and more a bubbling resentment directed at the 21st century mass commodification of everything, said Trifilio in a statement on the new track. The song was inspired by conversations shared with friends in soul-sucking jobs trying to make ends meet, fears around ai, and an ongoing frustration with mass consumerism, commercialization, and greed. It’s impossible to escape being observed, marketed to, and influenced, but it’s important to be aware and question if what you’re being sold is in your best interest.” Beach Bunny released its first two albums, 2020 s Honeymoon and 2022 s Emotional Creature , on Mom+Pop before putting out Tunnel Vision via AWAL. — Chris Eggertsen Check out more recent artist signings below .", "date_str": "2026-11-17T15:00:00+00:00", "hash": "d42df07f75956196", "title_fa": "امضا: جکسون وانگ جوهر با WME; بانی ساحلی به سواحل اقیانوس اطلس می‌رود", "summary_fa": "جکسون وانگ (WME) خواننده، ترانه سرا و کارآفرین جکسون وانگ با WME قرارداد امضا کرد. در میان پروژه های دیگر خود، این هنرمند چینی در حال حاضر در کمپین اپل ایفای نقش می کند که مربوط به تک آهنگ و ویدیوی جدیدش تشکر می کنم که در ماه سپتامبر منتشر شد. او همچنان توسط تیم Wang Records و Roc Nation نمایندگی می کند. وانگ اولین آلبوم خود با نام MIRRORS را در سال 2019 منتشر کرد و از آن زمان با هنرمندانی از جمله Ciara، Swae Lee، Major Lazer، Galantis، Gucci Mane، Joji و GoldLink همکاری کرده است. او همچنین در عرصه های ایالات متحده از جمله لس آنجلس کیا فروم و مرکز بارکلی بروکلین بازی کرده است. — کریس اگرتسن بیچ بانی (آتلانتیک رکوردز) بانی ساحلی براندون هوگ بیچ بانی با آتلانتیک رکوردز قرارداد امضا کرد. اولین تک آهنگ گروه برای این لیبل Vinegar است. این گروه در حال آغاز یک تور سرفصل 31 تاریخی در آمریکای شمالی است که از مارس آینده آغاز می‌شود و یک تور 13 تاریخی در بریتانیا/اتحادیه اروپا برای Weezer آغاز می‌شود که از ماه می آغاز می‌شود. نام بیچ بانی به جای هم به لیلی تریفیلیو خواننده اصلی و گروهی که از آنتونی واکارو، نوازنده گیتار بیس و نوازنده و جان آلوارادو درامر تشکیل شده است، اشاره دارد. آخرین آلبوم آن، Tunnel Vision، سال گذشته منتشر شد. تریفیلیو در بیانیه‌ای در مورد آهنگ جدید گفت: «سرکه» کمتر یک بحث است و بیشتر یک کینه توزانه است که معطوف به کالایی شدن انبوه همه چیز در قرن بیست و یکم است. این آهنگ الهام گرفته از گفتگوهایی بود که با دوستانشان در شغل‌های غم‌انگیز به اشتراک گذاشته می‌شدند و تلاش می‌کردند تا پایان زندگی خود را تامین کنند، ترس‌های پیرامون هوش مصنوعی، و ناامیدی مداوم از مصرف‌گرایی انبوه، تجاری‌سازی و طمع. فرار از مشاهده،", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Jackson-Wang-press-courtesy-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple", "موسیقی"], "datetime_fa": "۲۶ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Felipe Holguín Appointed CEO of Universal Music Latin America and Iberian Peninsula", "link": "https://www.billboard.com/pro/felipe-holguin-named-ceo-universal-music-latin-america/", "summary": "Felipe Holguín , an entrepreneur and executive whose experience has straddled music, media, technology and finance across countries and languages, has been named CEO of Universal Music Latin America Iberian Peninsula, effective immediately, the company announced Tuesday (Nov. 17). He will be based in Miami, reporting directly to Sir Lucian Grainge , chairman and CEO of UMG. Holguín takes over as the head of UMG’s Latin operations, including Spain, Portugal and Brazil, after longtime CEO Jesús López announced Monday (Nov. 16) that he was stepping down from that post after nearly 30 years. López has taken on a new role as chairman emeritus of Global Talent Services (GTS). Related Jesús López Steps Down as Head of Universal Music Latin America/Iberian Penninsula, Named Chairman Emeritus of UMG’s Global Talent Services CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive Holguín doesn’t come directly from the music industry and hasn’t worked inside a label, but he has vast experience in building creative businesses and leading digital organizations. “Latin music has led the way in opening global audiences to artists around the world, showing how music can cross borders while staying rooted in the cultures that give it life,” Grainge said in a press release. “Felipe combines deep respect for artistry and the Latin creative ecosystem with expertise across business, technology, and data. I’m excited to see him work with our teams to invest in the extraordinary and the unexpected and to create more global opportunities for artists.” Holguin added: “Artists are the ultimate change agents. Our role is to bring together the ideas, platforms, and partnerships that help them reach fans and move culture forward. Jesús and the talented people across Latin America and Iberia have helped shape Latin music’s global rise. I’m excited to work with UMG’s teams across the globe to build our company around artists and help their music travel even further.” “I’m proud to welcome Felipe to UMG,” said López. “He’s an accomplished leader with a clear vision for the future, and I’m confident he’ll build on the extraordinary foundation our teams have created.” Related Universal Music Latino and YaBoyyWill Partner for New Reparto Music Platform Series While not a former label exec, Holguin is known to those in the industry ", "date_str": "2026-11-17T14:50:00+00:00", "hash": "22d3d81b8596f0ed", "title_fa": "فیلیپه هولگین به عنوان مدیرعامل یونیورسال موزیک آمریکای لاتین و شبه جزیره ایبری منصوب شد", "summary_fa": "این شرکت روز سه شنبه (17 نوامبر) اعلام کرد، فیلیپه هولگین، کارآفرین و اجرایی که تجربه اش در زمینه موسیقی، رسانه، فناوری و امور مالی در سراسر کشورها و زبان ها وجود داشته است، به عنوان مدیر عامل یونیورسال موزیک آمریکای لاتین شبه جزیره ایبری منصوب شده است. او در میامی مستقر خواهد شد و مستقیماً به سر لوسیان گرینج، رئیس هیئت مدیره و مدیر عامل UMG گزارش می دهد. هولگین به عنوان رئیس عملیات لاتین UMG، از جمله اسپانیا، پرتغال و برزیل، پس از آن که خسوس لوپز، مدیرعامل قدیمی، روز دوشنبه (16 نوامبر) اعلام کرد که پس از نزدیک به 30 سال از سمت خود کناره‌گیری می‌کند، مسئولیت را بر عهده می‌گیرد. لوپز نقش جدیدی را به عنوان رئیس بازنشسته خدمات استعدادهای جهانی (GTS) بر عهده گرفت. ژسوس لوپز مرتبط به عنوان رئیس یونیورسال موسیقی آمریکای لاتین/شبه‌جزیره ایبری کناره‌گیری می‌کند، رئیس بازنشسته خدمات استعدادهای جهانی UMG با THEBLACKLABEL امضا می‌کند، دوباره با تهیه‌کننده قدیمی تدی برای Full Circle Moment Generate Weather, Finders of Itading the Weather: مبارزه سال به سال برای زنده ماندن هلگوین مستقیماً از صنعت موسیقی نمی آید و در یک لیبل کار نکرده است، اما او تجربه زیادی در ایجاد کسب و کارهای خلاقانه و سازمان های دیجیتال پیشرو دارد. Grainge در یک بیانیه مطبوعاتی گفت: \"موسیقی لاتین راه را در گشودن مخاطبان جهانی به روی هنرمندان در سراسر جهان رهبری کرده است، و نشان می دهد که چگونه موسیقی می تواند از مرزها عبور کند و در عین حال ریشه در فرهنگ هایی دارد که به آن جان می بخشد.\" فیلیپ احترام عمیق -Span 2، CNBC، CNN International، FOX Business، i24News و Newsmax و همچنین کانال های محلی مانند ABC، CBS، NBC، FOX، The CW و MyNetworkTV، در صورت وجود می باشد. در حال حاضر، می‌توانید بسته MyNews DIRECTV را با فقط 39.99 دلار در ماه برای دو ماه اول خدمات دریافت کنید - 11٪ پس انداز در ماه، یا 5 دلار تخفیف در ماه (در کل 10 دلار). پس از پایان دو ماه، قیمت ماهانه به طور خودکار با قیمت فعلی خود (در حال حاضر 44.99 دلار در ماه) تمدید می شود، مگر اینکه لغو شود. در همین حال، بسته ژانر یک DVR ابری نامحدود برای ضبط برنامه های شما دارد. بنابراین اکنون، می‌توانید لحظه‌های مناظره مورد علاقه خود را بارها و بارها بدون ترس از دست دادن فضای ذخیره‌سازی ابری DVR دوباره تجربه", "image_url": "https://www.billboard.com/wp-content/uploads/2024/12/Single-Product-DirecTV.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲۶ آبان • ۱۷:۴۶"}, {"source": "Billboard", "title": "Chris Rock Gushes to Kimmel About Inducting Wu-Tang Clan into Rock & Roll Hall of Fame: ‘They Are the Top of the Top’", "link": "https://www.billboard.com/music/rb-hip-hop/chris-rock-gushes-kimmel-inducting-wu-tang-clan-rrhof-watch-1236383882/", "summary": "Chris Rock movingly introduced the Wu-Tang Clan at Saturday s 2026 Rock Roll Hall of Fame induction ceremony in Los Angeles, and even days later the Misty Green writer/director/star was still floating on cloud nine about the whole thing. Related Wale on Triumphant Pair of 2027 Grammy Nominations for Everything Is a Lot : I Hope It Teaches a Lot of People About Resilience Rock Hall of Fame 2026 Induction Ceremony: Who Is and Isn’t Attending Miley Cyrus Reacts to Shared Grammy Nod With Dolly Parton: A Beautiful Way to Honor Her Enormous Heart Bed-Stuy, Brooklyn-bred Rock seemed to be still pinching himself over the honor of inducting the legendary Staten Island crew into the Hall of Fame. I had the pleasure of doing that, Rock told Jimmy Kimmel on Monday night (Nov. 16). They re the greatest, most incredible the best group of all time, he     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {

      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
