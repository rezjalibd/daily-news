      font-weight: 600;

    .modal-overlay {

      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);

      align-items: center;
      justify-content: center;

    .modal-overlay.active {

    .modal-card {

    @media (max-width: 640px) {

      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

ear , the automaker also gave us a sneak preview of its next driver assist. Called Drive Assist Pro, it’s for collaborative partially assisted driving, and from the passenger seat at the time, the demo was impressive . Now the automaker is getting ready to start rolling out Drive Assist Pro to customers with cars running the new MB.OS operating system here in the US and in Germany, and it let us have some time behind the wheel. While most automakers want a reputation associated with safety, Mercedes has long used passive and active technology to do so in its products. It was one of the first OEMs to introduce airbags, then a decade later started adding active safety systems like antilock brakes, electronic stability control, and adaptive cruise control. And so, by giving the car’s electronics the ability to control the brakes, and throttle, we arrive at the first level of assisted driving—called “level 1” in automotive engineerspeak. “Level 2” assisted driving, where the car also controls the steering as well as the acceleration and braking, got famous with Tesla Autopilot. But the first lane-keeping assists predate it by almost a decade in passenger cars, when Toyota introduced a system in 2004. The human driver behind the wheel is still in charge, responsible for situational awareness (and anything that arises from a lack thereof), with the idea that long drives become less tiring and a little more effortless when the car does the boring job of keeping a constant speed or a constant distance to the car ahead and between the white lines. Read full article Comments", "date_str": "2026-11-16T14:00:05+00:00", "hash": "c2280420a2b42f1e", "title_fa": "دستیار رانندگی هوشمندانه جدید مرسدس، ترافیک پیچیده را مانند یک قهرمان مدیریت می کند", "summary_fa": "مرسدس بنز پروازهایی از واشنگتن دی سی به سانفرانسیسکو و محل اقامت ارائه کرد تا Ars بتواند سیستم های جدید کمک راننده خود را امتحان کند. Ars محتوای تحریریه پولی را نمی پذیرد. سان فرانسیسکو—زمانی که Ars سال گذشته برای اولین بار -1794586242.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۲۵ آبان • ۱۷:۳۰"}, {"source": "MIT Tech Review", "title": "Building AI that can work across the enterprise", "link": "https://www.technologyreview.com/2026/11/16/1146070/building-ai-that-can-work-across-the-enterprise/", "summary": "For years, enterprises have approached AI as a series of discrete experiments. Now, as AI agents begin to move into the workflows that run the business, that model is starting to look inadequate. Organizations moving from isolated pilots toward AI agents and autonomous workflows are confronting a deeper challenge: rethinking how data, business processes, governance, and people fit together, turning AI from a collection of tools into part of the enterprise operating model. For Thorsten Leiduck, SVP and global head of SAP Business AI Platform Ecosystem, that shift begins with treating AI as an enterprise platform rather than a collection of disconnected projects. “AI is absolutely dependent on the data foundation,” he says, arguing that companies need a connected, semantically rich layer that reflects their business before they can reliably deploy AI across processes. The stakes also change as AI moves into mission-critical workflows. For some everyday applications, “80% might be good enough,” he says, but in areas such as supply chains or financial close, that level of accuracy is “a very terrible result.” That foundation also determines which AI applications are worth pursuing. Satinder Pal Singh, associate VP North America for SAP BAIP and SAP AI Strategy at Infosys, frames AI agents as “digital coworkers” and recommends evaluating potential use cases through three lenses: impact, feasibility, and scalability. Companies should identify where an agent can move meaningful business metrics, determine whether their data and talent can support the use case, and then establish whether successful applications can be replicated. “A pilot that can t scale is just an experiment,” he says. Scaling also brings governance into sharper focus. Clear policies, access controls, monitoring, and oversight are necessary to ensure agents remain trustworthy and aligned with business requirements. “The absence of governance doesn t speed up AI adoption,” Singh says. “It creates a risk backlog” that can ultimately force a more disruptive stop and audit. Those considerations will become more important as AI agents take on more responsibilities as digital coworkers. Both executives see a future in which agentic systems coordinate work across applications, while customer-specific knowledge graphs and governed data become critical enterprise assets. For Singh, the longer-term opportunity is a shift from AI as a productivity tool to “AI as a decision-making partner,” helping leaders ", "date_str": "2026-11-16T13:00:00+00:00", "hash": "106b6951a5ab5092", "title_fa": "ساخت هوش مصنوعی که بتواند در سراسر سازمان کار کند", "summary_fa": "برای سال‌ها، شرکت‌ها هوش مصنوعی را به عنوان مجموعه‌ای از آزمایش‌های گسسته نزدیک کرده‌اند. اکنون، زمانی که عوامل هوش مصنوعی شروع به حرکت به سمت جریان های کاری که کسب و کار را اداره می کنند، این مدل شروع به ناکافی به نظر می رسد. سازمان‌هایی که از پایلوت‌های منزوی به سمت عوامل هوش مصنوعی و گردش‌های کاری مستقل حرکت می‌کنند، با چالش عمیق‌تری روبرو هستند: بازنگری در نحوه تطبیق داده‌ها، فرآیندهای تجاری، حاکمیت و افراد، تبدیل هوش مصنوعی از مجموعه‌ای از ابزارها به بخشی از مدل عملیاتی سازمانی. برای Thorsten Leiduck، SVP و رئیس جهانی SAP Business AI Platform Ecosystem، این تغییر با تلقی از هوش مصنوعی به عنوان یک پلتفرم سازمانی و نه مجموعه‌ای از پروژه‌های قطع شده آغاز می‌شود. او می‌گوید: «هوش مصنوعی کاملاً به پایه داده‌ها وابسته است. با حرکت هوش مصنوعی به سمت گردش‌های کاری حیاتی، ریسک‌ها نیز تغییر می‌کنند. او می‌گوید برای برخی از کاربردهای روزمره، «۸۰ درصد ممکن است به اندازه کافی خوب باشد»، اما در حوزه‌هایی مانند زنجیره تأمین یا بسته شدن مالی، این سطح از دقت «نتیجه بسیار وحشتناکی است». این بنیاد همچنین تعیین می کند که کدام برن       media: [{"source": "Billboard", "title": "Jesús López Steps Down as Head of Universal Music Latin America/Iberian Penninsula, Named Chairman Emeritus of UMG’s Global Talent Services", "link": "https://www.billboard.com/pro/jesus-lopez-leaves-universal-music-latin-shifts-to-gts/", "summary": "Jesús López , the longtime head of Universal Music’s entire Latin music business and one of the most iconic and influential executives in Latin music, will step down from his longtime position as chairman/CEO of Universal Music Latin America/Iberian Penninsula, Billboard can officially announce. López will take on a new role as chairman emeritus for Global Talent Services (GTS), the UMG artist management, booking, promotion and services company that he launched in 2007 and which today has offices in eight countries. In his new capacity, he will continue to provide his longtime expertise and knowledge of the Spanish-language music market and its artists. Narcis Rebollo will remain as president/CEO of GTS. Related Universal Music Latin America Unveils Executive Appointments for its Next Phase of Evolution’ CL Signs With THEBLACKLABEL, Reuniting With Longtime Producer Teddy For Full Circle Moment Severe Weather, Radius Clauses and Finding the Next Generation of Festival Headliners: It s a Year-by-Year Fight to Stay Alive On the label side, López has been working with Sir Lucian Grainge , chairman and CEO of UMG, to put in place a succession plan, “with details to be announced in due course,” according to a Universal release. No further information about a successor was available at press time. “Jesús is an industry icon who has helped change the course of Latin music on the world stage,” said Grainge in a statement. “Throughout our industry’s evolution he has been a tireless advocate for the creative community, building a team that has advanced the careers of countless superstars. I’m grateful for the care he’s taken to prepare the business for the future and delighted that he’ll help shape the future of GTS, a company born of his own vision for serving artists. I look forward to continuing our work together.” López added: “As I begin this next chapter within UMG, I’m incredibly proud of what we’ve built together: a company that believes in artists early, stays with them and helps their music travel further than anyone imagined. I look forward to welcoming my successor and supporting our teams as they build on that success. As Chairman of GTS, I will continue pursuing a passion that has guided my entire career: helping artists realize the full scope of their ambitions. I’m grateful to Lucian for his trust and support over so many years, and excited to continue working with him and our teams to create new opportunities for artists.” Related Universal Music Lat", "date_str": "2026-11-16T15:00:00+00:00", "hash": "290c84d0c456529a", "title_fa": "ژسوس لوپز به عنوان رئیس یونیورسال موسیقی آمریکای لاتین/شبه‌جزیره ایبری کناره‌گیری کرد و به عنوان رئیس بازنشسته خدمات استعدادهای جهانی UMG معرفی شد.", "summary_fa": "بیلبورد می‌تواند رسماً اعلام کند، ژسوس لوپز، رئیس قدیمی کل تجارت موسیقی لاتین یونیورسال موزیک و یکی از نمادین‌ترین و تأثیرگذارترین مدیران در موسیقی لاتین، از سمت طولانی‌مدت خود به‌عنوان رئیس/مدیرعامل یونیورسال موزیک آمریکای لاتین/شبه‌جزیره ایبری کناره‌گیری می‌کند. لوپز نقش جدیدی را به عنوان رئیس بازنشسته برای خدمات استعدادهای جهانی (GTS)، شرکت مدیریت، رزرو، ارتقاء و خدمات هنرمندان UMG که در سال 2007 راه‌اندازی کرد و امروز در هشت کشور دفاتر دارد، برعهده خواهد گرفت. در سمت جدید، او به ارائه تخصص و دانش دیرینه خود در مورد بازار موسیقی اسپانیایی زبان و هنرمندان آن ادامه خواهد داد. نارسیس ربولو به عنوان رئیس/مدیرعامل GTS باقی خواهد ماند. موسیقی یونیورسال مرتبط آمریکای لاتین از قرارهای اجرایی برای فاز بعدی تکامل خود رونمایی می‌کند. نشانه‌های CL با THEBLACKLABEL، اتحاد مجدد با تدی، تهیه‌کننده قدیمی، برای لحظه‌ای کامل، شرایط جوی شدید، بندهای شعاع و یافتن نسل بعدی از عناوین جشنواره: لوپز با سر Lucian Grainge، رئیس و مدیر عامل UMG همکاری کرده است تا یک طرح جانشینی را اجرا کند، \"با جزئیات که در زمان مناسب اعلام خواهد شد\"، طبق یک نسخه یونیورسال. هیچ اطلاعات بیشتری در مورد جانشین در زمان انتشار در دسترس نبود. Grainge در بیانیه ای گفت: «Jesús یک نماد صنعتی است که به تغییر مسیر موسیقی لاتین در صحنه جهانی کمک کرده است. \"در طول تکامل صنعت ما، او یک مدافع خستگی ناپذیر برای جامعه خلاق بوده است، و تیمی را ایجاد می کند که مشاغل فوق ستاره های بی شماری را ارتقا داده است. من از مراقبتی که او برای آماده کردن کسب و کار برای آینده انجام داد سپاسگزارم و خوشحالم که او به شکل دادن به آینده GTS کمک خواهد کرد، شرکتی که برگرفته از دیدگاه خودش برای خدمت به هنرمندان است. من مشتاقانه منتظر ادامه کار مشترکمان هستم.» لوپز اضافه کرد: «همانطور که فصل بعدی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Jesus-Lopez-cr-Universal-Music-Group-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Greeicy Talks About Her No. 1 Hit ‘YAPAQUE,’ Karol G and Motherhood | Cafecito Con", "link": "https://www.billboard.com/video/greeicy-talks-about-no-1-hit-yapaque-karol-g-motherhood/", "summary": "Greeicy brings laughs and a very special surprise guest to “Cafecito Con,” and shares how acting alongside Karol G inspired her to “dream bigger.” In a warm, candid conversation, she talks about her life, career, and the people who inspire her. She also looks back on her first No. 1 on the Billboard charts with “YAPAQUE,” alongside Farruko and Steve Aoki. The singer and actress discusses how her relationship with social media has changed and what it means to share personal moments with her fans, including her experience as a mom. She also reflects on her childhood dreams and the creative journey that led her to music and acting, and explains why she loves connecting with fans while traveling and performing. Plus, she shares what makes creating music with Mike Bahía so special. Jessica Roiz: Hey, Greeicy. Oh, welcome to Cafecito Con. So happy to have you here. Greeicy: It’s been a while. Jessica Roiz: Yes, it’s true, it’s true. It’s been a while, like a few days. Well, Greeicy, we’re here at Macondo Coffee Roasters in Downtown. Barista: Well, welcome, welcome. Greeicy: Thank you so much. Barista: This is your home. Are you a café con leche person? Greeicy: Bitter. Jessica Roiz: Yes. And you don’t add sugar? Greeicy: No. I added sugar for many years, but they taught me that coffee is drunk without sugar. Barista: Whoever taught you that, I think it’s very good. Jessica Roiz: So, I’m going to get the seasonal one, which is the banana milk pumpkin pie latte. Barista: That’s my favorite. Divine. Greeicy: And that one has milk? Barista: Banana. Greeicy: Oh, banana milk? From which banana? Barista: They squeeze the milk from the banana. Greeicy: From which banana? Barista: Banana milk. I wish it were like that. Greeicy: That coffee is… I want it. Barista: Oh, my goodness. Perfect. So we have the order ready. Enjoy your super coffee. Greeicy: Thank you. Jessica Roiz: Well, actually, I heard somewhere that you’re bringing us a little surprise today, but… Greeicy: Oh, yes, a little surprise. Jessica Roiz: Yes? Greeicy: And I’ve had it by my side all day. Jessica Roiz: Oh. Ooh, okay, let’s see what it is, but later, while we wait for the coffee. And I want you to tell me a bit about what was happening in these posts. They’re… Okay? Keep watching for more!", "date_str": "2026-11-16T15:00:00+00:00", "hash": "a79aa6ab08fbc6f9", "title_fa": "Greeicy درباره آهنگ شماره 1 خود 'YAPAQUE'، Karol G و Motherhood صحبت می کند | Cafecito Con", "summary_fa": "Greeicy خنده و یک مهمان غافلگیرکننده بسیار ویژه را برای Cafecito Con به ارمغان می‌آورد و به اشتراک می‌گذارد که چگونه بازی در کنار کارول جی الهام بخش او برای «رویاهای بزرگ‌تر» شده است. در یک گفتگوی صمیمانه و گرم، او در مورد زندگی، حرفه و افرادی که به او الهام می‌دهند صحبت می‌کند. او همچنین با «YAPAQUE» در کنار Farruko و Steve Aoki به اولین شماره 1 خود در نمودارهای بیلبورد نگاه می کند. این خواننده و بازیگر درباره چگونگی تغییر رابطه اش با رسانه های اجتماعی و به اشتراک گذاشتن لحظات شخصی با طرفدارانش، از جمله تجربه خود به عنوان مادر، صحبت می کند. او همچنین در مورد رویاهای دوران کودکی خود و سفر خلاقانه ای که او را به سمت موسیقی و بازیگری سوق داد منعکس می کند و توضیح می دهد که چرا دوست دارد در سفر و اجرا با طرفداران ارتباط برقرار کند. به علاوه، او آنچه را که خلق موسیقی را با مایک باهیا بسیار خاص می‌کند، به اشتراک می‌گذارد. جسیکا رویز: هی، گریسی. اوه، به Cafecito Con خوش آمدید. خیلی خوشحالم که اینجا هستید گریسی: مدتی گذشت. جسیکا رویز: بله، درست است، درست است. مدتی گذشت، مثل چند روز. خوب، گریسی، ما اینجا در Macondo Coffee Roasters در مرکز شهر هستیم. باریستا: خوب، خوش آمدید، خوش آمدید. گریسی: خیلی ممنون. باریستا: اینجا خانه شماست. آیا شما یک آدم کافه دار هستید؟ گریسی: تلخ. جسیکا رویز: بله. و شکر اضافه نمیکنید؟ گریسی: نه. من سالها شکر اضافه کردم، اما به من یاد دادند که قهوه بدون شکر نوشیده می شود. باریستا: هر کسی که این را به شما آموخت، فکر می کنم خیلی خوب است. جسیکا رویز: بنابراین، من می‌خواهم آن فصلی را تهیه کنم، که لاته پای کدو حلوایی شیر موز است. باریستا: این مورد علاقه من است. الهی. گریسی: و اون یکی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Artboard-1-copy-9.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Madonna & Slayyyter Lead 2027 Dance/Electronic Grammy Nominations", "link": "https://www.billboard.com/music/awards/2027-grammy-nominees-dance-electronic-madonna-slayyyter-1236382910/", "summary": "Madonna , Slayyyter , Tame Impala and Tinashe lead the nominees in the dance/electronic categories at the 2027 Grammy Awards. Related Grammy Nominations 2027: See the Complete List RAYE Rosalía Lead 2027 Grammy Nominations as Women Make History Snubs Surprises In the 2027 Grammy Nominations Nominees were announced early on Monday (Nov. 16), setting up the race for the awards ceremony happening Feb. 7 in Los Angeles. As widely predicted, Madonna leads the pack, with nominations in all four of the dance electronic categories. Her July album Confessions II generated nods for best dance/electronic album, best dance/electronic recording, best dance pop recording and best remixed recording. Meanwhile, Slayyyter comes in second on the list, with her March album Wor$t Girl In America getting nods in the best dance/electronic album category along with best dance/electronic recording and best dance pop recording. Tame Impala and Tinashe follow, each getting a pair of nominations in the dance fields. See the complete list of nominees across the dance/electronic categories below. Best Dance/Electronic Album Madonna, Confessions II Robyn, Sexistential Skrillex, Soma Slayyyter, Wor$t Girl In America Tame Impala, Deadbeat Best Dance/Electronic Recording Fred again.., Lights Burn Dimmer Madonna, I Feel So Free Slayyyter, Crank Tame Impala, My Old Ways Tinashe, Melatonin Underscores, Music Best Dance Pop Recording Zara Larsson, Blue Moon Madonna, Danceteria Raye, Life Boat. Slayyyter, Dance Tinashe, Too Easy Best Remixed Recording Fred again.., Ca7riel Paco Amoroso, Beto s Horns (Fred remix) Bruno Mars, I Just Might (Austin Millz Remix) Madonna, Love Sensation (Stuart Price Remix with Madonna Kylie Minogue) Taylor Swift, Opalite (Chris Lake Remix) Nine Inch Nails Boys Noize, A Question of Trust (Boys Noize Remix) Raye, Where Is My Husband! (David Guetta Remix)", "date_str": "2026-11-16T14:46:40+00:00", "hash": "edcac19c030eb87c", "title_fa": "مدونا و اسلایتر، نامزدهای رقص/الکترونیک گرمی 2027", "summary_fa": "مدونا، اسلایتر، تم ایمپالا و تیناشه نامزدهای بخش رقص/الکترونیک در جوایز گرمی 2027 هستند. نامزدهای مربوط به گرمی 2027: فهرست کامل را ببینید نامزدهای گرمی 2027 RAYE Rosalía پیشتاز به عنوان زنان تاریخ ساز را غافلگیر می کند نامزدهای گرمی 2027 در اوایل روز دوشنبه (16 نوامبر) معرفی شدند و مسابقه برای مراسم اهدای جوایز در Lob برگزار شد. همانطور که به طور گسترده پیش بینی شده بود، مدونا با نامزدی در هر چهار دسته الکترونیکی رقص، رهبری گروه را بر عهده دارد. آلبوم ژوئیه او Confessions II برای بهترین آلبوم رقص/الکترونیک، بهترین رقص/ضبط الکترونیکی، بهترین ضبط پاپ رقص و بهترین ضبط ریمیکس تمجید کرد. در همین حال، Slayyyter با آلبوم مارس Wor$t Girl In America در رتبه دوم لیست قرار می گیرد و در رده بهترین آلبوم رقص/الکترونیک به همراه بهترین رقص/ضبط الکترونیکی و بهترین ضبط پاپ رقص رتبه اول را کسب کرد. Tame Impala و Tinashe دنبال می‌شوند و هر کدام یک جفت نامزدی در زمینه رقص دریافت می‌کنند. فهرست کامل نامزدها در دسته‌های رقص/الکترونیک را در زیر ببینید. بهترین آلبوم رقص/الکترونیک مدونا، Confessions II Robyn، Sexistential Skrillex، Soma Slayyyter، Wor$t Girl In America Tame Impala، Deadbeat بهترین رقص/ضبط الکترونیکی Fred..، Lights Burn Dimmer Madonna، I Feel So Free Old Slayyyter، Cranslatin موسیقی بهترین رقص پاپ ضبط شده زارا لارسون، مدونا ماه آبی، دانستریا ری، قایق نجات. Slayyyter, Dance Tinashe, Too Easy Best Remixed Remixed Fred again.., Ca7riel Paco Amoroso, Beto s Horns (Remix Fred) Bruno Mars, I Just Might ( Austin Millz Remix) Madonna, Love Sensation ( استوارت پرایس ریمیکس با مدونا تالیور مینویکس ) نه اینچ میخ پسران نویز، سوال اعتماد (ریمیکس پسران نویز) ری، شوهرم کجاست! (ریمیکس دیوید گتا)", "image_url": "https://www.billboard.com/wp-content/uploads/2026/06/madonna-press-2026-credit-Rafael-Pavarotti-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲۵ آبان • ۱۸:۱۶"}, {"source": "Billboard", "title": "LCD Soundsystem to Headline First of Manchester’s New Platt Fields Park Concerts in 2027", "link": "https://www.billboard.com/music/music-news/lcd-soundsystem-manchester-platt-fields-park-show-2027-1236382887/", "summary": "LCD Soundsystem will headline Manchester’s Platt Fields Park next summer, marking the return of live music at the venue for the first time in more than 15 years. The show, announced on Monday (Nov. 16) will take place on July 30 and be the first of a new series of 25,000-capacity outdoor gigs planned at the venue next year, with further headline acts set to be revealed in the coming weeks. The legendary New York band, led by James Murphy, will be joined by a slate of support acts including Mercury Prize-winning Scottish group Young Fathers, rising duo Cowboy Hunters and DJs Erol Alkan and Luke Una. Tickets will go live at 10 a.m. GMT on Nov. 20 and will be available via Plattform , where further information can be found. The park s last major shows took place in 2011, when the Parklife Weekender brought a host of acts to Platt Fields, including Chase Status, Kelis, Two Door Cinema Club, Mark Ronson, Jamie xx and Skrillex, among others. The festival later moved to Heaton Park, its current home, in 2013 as it expanded. Sam Kandel, event director and founder of promoters The Warehouse Project, said in a statement: We re so proud to be part of the team delivering the return of live music events to Platt Fields Park. Everyone in the city knows Platt Fields has its own unique character, shaped by its fantastic location and the diverse communities who live alongside it, and we re planning to create some truly special moments and memories there for everyone. He added: The return of LCD Soundsystem to Manchester, performing in the beautiful surrounds of Platt Fields Park, after nearly a decade away is, we think, the perfect place to start! The event will run as a collaboration between The Warehouse Project, Live Nation and SJM Concerts. Councilor Shazia Butt, executive member for culture, leisure and libraries for Manchester City Council, added: “With 2027 already set to be yet another massive year of live music in the city bringing with it huge benefits for the city’s economy, local businesses and our residents we’re looking forward to adding to this next summer with the return once more of live music to our amazing Platt Fields Park, and to welcoming even more visitors to our fantastic city. We ll be working closely with concert organizers to ensure maximum benefit for Platt Fields and for the local community from the gigs, both in the run-up to, during and after they ve taken place, and we look forward to sharing more information on this in the coming months. LC", "date_str": "2026-11-16T14:36:06+00:00", "hash": "314788e0919b0abf", "title_fa": "ال سی دی ساوندسیستم به عنوان اولین کنسرت جدید پارک پلات فیلدز منچستر در سال 2027 سرلوحه قرار خواهد گرفت.", "summary_fa": "ال سی دی ساوندسیستم تابستان آینده در پارک پلات فیلدز منچستر قرار خواهد گرفت و برای اولین بار در بیش از 15 سال، بازگشت موسیقی زنده به این مکان را رقم خواهد زد. این نمایش که در روز دوشنبه (16 نوامبر) اعلام شد در 30 جولای برگزار می شود و اولین سری از کنسرت های فضای باز با ظرفیت 25000 نفر خواهد بود که در سال آینده در محل برنامه ریزی شده است، با تیترهای بعدی که قرار است در هفته های آینده فاش شوند. گروه افسانه‌ای نیویورکی به رهبری جیمز مورفی به گروهی از حامیان از جمله گروه اسکاتلندی Young Fathers برنده جایزه مرکوری، دوتای نوظهور Cowboy Hunters و دی‌جی‌های Erol Alkan و Luke Una ملحق خواهند شد. بلیت‌ها در ساعت 10 صبح به وقت گرینویچ در 20 نوامبر پخش می‌شوند و از طریق Plattform در دسترس خواهند بود، جایی که اطلاعات بیشتر را می‌توانید پیدا کنید. آخرین نمایش های مهم پارک در سال 2011 برگزار شد، زمانی که Parklife Weekender مجموعه ای از نمایش ها را به Platt Fields آورد، از جمله Chase Status، Kelis، Two Door Cinema Club، Mark Ronson، Jamie xx و Skrillex و غیره. این جشنواره بعداً در سال 2013 با گسترش آن به پارک هیتون، خانه فعلی آن منتقل شد. سام کندل، مدیر رویداد و موسس پروموترهای The Warehouse Project، در بیانیه‌ای گفت: ما بسیار مفتخریم که بخشی از تیمی هستیم که رویدادهای موسیقی زنده را به پارک پلات فیلدز ارائه می‌دهد. همه در شهر می‌دانند که پلات فیلدز شخصیت منحصربه‌فرد خود را دارد که با موقعیت فوق‌العاده و جوامع متنوعی که در کنار آن زندگی می‌کنند شکل گرفته است، و ما در حال برنامه‌ریزی برای ایجاد لحظات و خاطرات واقعاً ویژه در آنجا برای همه هستیم. وی افزود: بازگشت LCD Soundsystem به منچستر، اجرا در محیط های زیبای پارک پلات فیلدز، پس از", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P10EUSH-e17     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
