ن انداختم. من می گفتم، \"فکر می کردم این یک تست است. نمی‌دانستم این نوع فیلم است.» در نهایت، او نقشی را به عنوان دوست پسر خیالی‌اش دریافت نکرد - او در عوض نقش مدیر کلوپ کمیک ری را بازی کرد - اما او ادعا کرد که علاقه او به او تا مدت‌ها بعد از تست بازیگری آنها ادامه داشت، اما او ترجیح می‌داد که", "image_url": "https://variety.com/wp-content/uploads/2026/10/JOHN-TURTURRO-Primoz-Korosec-1-1-1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۸ آبان • ۲۰:۴۵"}, {"source": "Variety", "title": "DC Shocker: James Gunn, Peter Safran Out as Co-Chairmen, Marvel Veteran Jeremy Latcham to Lead Comic Book Studio", "link": "https://variety.com/2026/film/news/james-gunn-peter-safran-fired-dc-jeremy-latcham-1236943091/", "summary": "In a surprise executive shuffle, James Gunn and Peter Safran are stepping down as CEOs and chairmen of DC Studios. They will be replaced by Jeremy Latcham, who will serve as president and chief creative officer. Gunn and Safran s exit is unexpected because they were named as part of David Ellison s business leadership team at [ ]", "date_str": "2026-11-09T17:15:00+00:00", "hash": "e9e7590facb02577", "title_fa": "دی سی شوکر: جیمز گان، پیتر سافران به عنوان رئیس مشترک، کهنه سرباز مارول جرمی لاتچم برای رهبری استودیو کتاب های مصور", "summary_fa": "جیمز گان و پیتر سافران در یک جابجایی غیرمنتظره از سمت مدیران اجرایی و رئیس استودیو دی سی کنار می‌روند. جرمی لاتچام جایگزین آنها خواهد شد که به عنوان رئیس جمهور و مدیر ارشد خلاقیت خدمت خواهد کرد. خروج گان و سافران غیرمنتظره است زیرا آنها به عنوان بخشی از تیم رهبری تجاری دیوید الیسون در [] نام‌گذاری شدند. تحت هدایت آنها، این دو نفر در تابستان گذشته با فیلم سوپرمن، دنیای بی‌حال DC را دوباره راه‌اندازی کردند، موفقیتی نسبی با 618 میلیون دلار در سطح جهانی، و سپس با Supergirl جولای، بمبی عظیم با 126 میلیون دلار با بودجه 170 میلیون دلاری، تصادف کردند. Clayface، یک تریلر ترسناک بدنی تیره‌تر و با درجه R، در پاییز امسال با 109 میلیون دلار با بودجه 44 میلیون دلاری، عملکرد متوسطی داشت. در همین حال، آنها امپراتوری کتاب های مصور را با نمایش های \"صلح ساز\" و \"فانوس ها\" برای HBO Max گسترش دادند. تلاش‌های آینده دی‌سی روی پرده بزرگ شامل «سوپرمن: مرد فردا» به نویسندگی و کارگردانی گان در تابستان آینده و «بتمن: قسمت دوم» در سال ۲۰۲۸ با بازی رابرت پتینسون است. در بخش تلویزیونی، سریال 2027 مردم در برابر گوریلا گرود وجود دارد که توسط اسکایلر گیسوندو در نقش شخصیت سوپرمن جیمی اولسن و جیمی تاترو در نقش گوریلا گرود ارائه شده است. گان و سافران گفتند: \"چهار سال پیش، ما تصمیم گرفتیم تا DC را تحت یک چشم انداز خلاق متحد کنیم. در آن زمان، ما به بازگرداندن سوپرمن به قلب DC کمک کردیم، در حالی که درهای جدیدی را باز کردیم و داستان های جدیدی را در فیلم و تلویزیون با Peacemaker، Creature Commandos، Lanterns و Clayface بیان کردیم.\" ما بسیار به تیمی که این جاه طلبی را به چیزی واقعی تبدیل کرد، از جمله بازیگران، خدمه و مدیرانی که فرصت همکاری با آنها را داشتیم، افتخار", "image_url": "https://variety.com/wp-content/uploads/2026/11/GettyImages-2300099084.jpg?crop=327px%2C54px%2C4385px%2C2466px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۸ آبان • ۲۰:۴۵"}, {"source": "Variety", "title": "Jonathan Bailey to Star in Gay Romance Film ‘Insomniac City’ for ‘Elsinore’ Producer", "link": "https://variety.com/2026/film/global/jonathan-bailey-gay-romance-film-insomniac-city-1236943109/", "summary": "Jonathan Bailey has booked another lead role, and is set to star alongside Bill Nighy in Dominic Cooke s Insomniac City. The love story is based on the real-life romance between writer and writer and photographer Bill Hayes and celebrated neurologist Oliver Sacks. Altitude is handling worldwide sales and will introduce the project to buyers at [ ]", "date_str": "2026-11-09T17:07:19+00:00", "hash": "3a8644d5ac21fd5d", "title_fa": "جاناتان بیلی در فیلم عاشقانه همجنس گرایان «شهر بی خواب» برای تهیه کننده «السینور» بازی می کند", "summary_fa": "جاناتان بیلی نقش اصلی دیگری را انتخاب کرده است و قرار است در کنار بیل نای در فیلم Dominic Cooke's Insomniac City بازی کند. داستان عشق بر اساس عشق واقعی بین نویسنده و نویسنده و عکاس، بیل هیز و الیور ساکس، متخصص مغز و اعصاب است. Altitude فروش جهانی را مدیریت می کند و پروژه را به خریداران در [ ] معرفی می کند که از خاطرات هیز در سال 2017 اقتباس شده است، Insomniac City به دنبال هیز در حالی که از سانفرانسیسکو به شهر نیویورک می رسد در پی یک ضرر ویرانگر می آید. همانطور که او شروع به بازسازی زندگی خود می کند، به طور غیرمنتظره ای عاشق شهر و الیور ساکس می شود، که نویسندگی و کارهای پیشگامانه اش در عصب شناسی او را به یکی از متمایزترین صداها در پزشکی مدرن تبدیل کرده است. طبق توضیحات: در مقابل پس‌زمینه‌ی بی‌قرار و پر جنب و جوش نیویورک، شهر بی‌خوابی پرتره‌ای صمیمی و نشاط‌آور از غم، امید، اجتماع و فرصت‌های دوم، و امکان قابل‌توجه یافتن عشق در زمانی است که کمتر انتظار می‌رود. بیلی نقش هیز را در مقابل نیگی در نقش ساکس بازی می‌کند و رابطه‌ای را به نمایش می‌گذارد که زندگی هر دو مرد را در سال‌های آخر ساکس متحول کرد. ساکس که توسط نیویورک تایمز به عنوان \"شاعر برنده جایزه پزشکی معاصر\" توصیف می شود، به دلیل انسانیت و کنجکاویی که برای کار خود به ارمغان آورد مورد تجلیل قرار گرفت. او نویسنده مردی که همسرش را با کلاه اشتباه گرفت و بیداری ها بود که در فیلم نامزد اسکار با بازی رابین ویلیامز و رابرت دنیرو اقتباس شد. فیلم Insomniac City که توسط هیز و کوک برای نمایش بزرگ نوشته شده و اقتباس شده است، توسط تروی لوم و اندرو میسون برای گروه بریتانیایی-استرالیایی Brouhaha Entertainment، بیلی، مایک گودریج و گابریل تانا (\"السینور\")", "image_url": "https://variety.com/wp-content/uploads/2025/11/GettyImages-2244240431.jpg?crop=0px%2C246px%2C6000px%2C3375px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۸ آبان • ۲۰:۳۷"}, {"source": "Billboard", "title": "YouTube Streaming Data to Return to Billboard Charts", "link": "https://www.billboard.com/pro/youtube-streaming-data-return-billboard-charts/", "summary": "YouTube s global head of music Lyor Cohen said in a blog post Monday (Nov. 9) that the company s streaming data will return to Billboard ’s charts, resuming in 2027. The blog post follows Billboard ’s announcement earlier on Monday that the chart methodology will change to narrow the ratio between paid/subscription streams and ad-supported streams to 1:1.5 after previously having been at a 1:2.5 ratio. Related Billboard to Update Chart Methodology in 2027 Following Annual Industry Revenue Review Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City Michael Jackson s Thriller Scares Up Highest Rank on Billboard 200 Albums Chart in More Than 40 Years We are returning to the Billboard charts starting in 2027, Cohen wrote, in a two-line update to YouTube s original announcement from December 2025 that it was pulling out of the charts. Billboard ’s new methodology better reflects how fans engage with music today across both subscription and ad-supported services. Effective Jan. 16 (reflecting data from Jan. 1-7), each album consumption unit on the Billboard 200 will equal 1,500 ad-supported or 1,000 paid-subscription on-demand official audio and video streams generated by songs from an album. Currently, the Billboard 200 considers each album consumption unit as equal to 2,500 ad-supported streams or 1,000 paid/subscription on-demand official audio and video streams generated by songs on an album. Each album consumption unit equals one album sale or 10 individual tracks sold from an album. YouTube withdrew its streaming data from the Billboard charts earlier this year, beginning with the charts dated Jan. 31, in response to Billboard ’s announcement that paid/subscription streams would be weighed against ad-supported streams at a 1:2.5 ratio. YouTube was first included as part of the Billboard charts in 2013, when its streaming data was incorporated into Billboard ’s song charts, including the Hot 100 . Billboard was the first to include YouTube’s streaming data in charts. In 2019, Billboard began incorporating YouTube streaming data into the Billboard 200 . Paid/subscription streams were first weighted higher than ad-supported streams on the Billboard charts in 2019, and international organizations including the IFPI also began to incorporate weighted systems. At the time, Billboard wrote, “It is Billboard ’s belief that assigning values to the levels of consumer engagement and access — along with the compensation derived from those opt", "date_str": "2026-11-09T16:31:26+00:00", "hash": "fca96477c7a28d10", "title_fa": "داده‌های جریانی YouTube برای بازگشت به نمودارهای بیلبورد", "summary_fa": "لیور کوهن، رئیس جهانی موسیقی YouTube، دوشنبه (9 نوامبر) در یک پست وبلاگی گفت که داده‌های پخش جریانی شرکت به نمودارهای بیلبورد بازخواهد گشت و در سال 2027 از سر گرفته می‌شود. این پست وبلاگ به دنبال اعلام بیلبورد در اوایل روز دوشنبه است مبنی بر اینکه روش نمودار تغییر می‌کند تا نسبت بین جریان‌های پولی/اشتراک‌ها را کاهش دهد: جریان‌هایی که قبلاً در جریان‌های 51 پشتیبانی می‌شدند. نسبت 1:2.5 بیلبورد مرتبط برای به‌روزرسانی متدولوژی نمودار در سال 2027 پس از بررسی درآمد صنعت سالانه تیلور سویفت و کارلی کلوس در بازی تراویس کلس در کانزاس سیتی شرکت کردند. از سال 2027، کوهن در یک به روز رسانی دو خطی به اطلاعیه اصلی یوتیوب از دسامبر 2025 نوشت که از چارت ها خارج می شود. روش جدید بیلبورد نحوه تعامل طرفداران با موسیقی امروزی را در هر دو سرویس اشتراکی و تبلیغاتی بهتر منعکس می کند. از 16 ژانویه (منعکس کننده داده‌های 1-7 ژانویه)، هر واحد مصرف آلبوم در Billboard 200 برابر با 1500 پخش صوتی و تصویری رسمی با پشتیبانی آگهی یا 1000 پخش صوتی و تصویری رسمی درخواستی با اشتراک پولی خواهد بود که توسط آهنگ‌های یک آلبوم تولید می‌شود. در حال حاضر، بیلبورد 200 هر واحد مصرف آلبوم را برابر با 2500 جریان تبلیغاتی یا 1000 جریان صوتی و تصویری رسمی بر اساس تقاضای پولی/اشتراک تولید شده توسط آهنگ های یک آلبوم در نظر می گیرد. هر واحد مصرف آلبوم برابر است با فروش یک آلبوم یا 10 قطعه منفرد از یک آلبوم. یوتیوب در اوایل سال جاری، داده‌های استریم خود را از نمودارهای بیلبورد خارج کرد و از نمودارهای تاریخ ژانویه آغاز شد. در 31، در پاسخ به اعلام بیلبورد مبنی بر اینکه جریان‌های پولی/اشتراک با نسبت 1:2.5 در مقابل جریان‌های پشتیبانی‌شده از آگهی سنجیده می‌شوند. یوتیوب برای اولین بار در سال 2013 به عنوان بخشی از", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۲۰:۰۱"}, {"source": "Billboard", "title": "Anuel AA Reveals Plans for Real Hasta la Muerte Festival in 2027: ‘Every Year It’ll Be In a Different Country’", "link": "https://www.billboard.com/music/latin/anuel-aa-real-hasta-la-muerte-festival-2027-plans-1236377903/", "summary": "Anuel AA is expanding the Real Hasta la Muerte franchise into live events. In a conversation with Billboard ’s co-chief content officer Leila Cobo, the Puerto Rican superstar revealed plans for a music festival beginning in 2027. Related Anuel AA Talks Corridos Era, Fuerza Regida Collab Posts About Ex Karol G: Maybe She’ll Unblock Me Anuel AA Reveals He’s Dropping an All-Corridos Album Along With ‘RHLM 2’: Everything We Know Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City “I’m starting now with the Real Hasta la Muerte Festival,” said Anuel. “My festival [will feature] lots of artists. I’ll announce the date soon, he added. The artist mentioned that he plans to launch the fest in the summer of 2027, and Europe may be its first stop. But the location is not settled. The first year, I think [we will host it in] Spain,” he said, while noting he was still “going back and forth between Chile or Spain right now.” He also did not share a date, city, venue or lineup, but said the event would bring together “lots of artists.” Every year it ll be in a different country, said Anuel, stating that the international festival is also considering Puerto Rico, Mexico and Colombia as host possibilities. The live music announcement came amid a broader conversation about Anuel’s next moves. He told Cobo that Real Hasta la Muerte 2 is due Nov. 19 and that he could release his corridos album, Cartel Real Hasta la Muerte , on the same day. Exploring the genre, he said, has made him “fall in love with music all over again — with something new, not the same old thing.” The interview also touches on his relationship with Colombian megastar Karol G, his decision to get sober and how he’s rethinking his life and music. Watch the full conversation below.", "date_str": "2026-11-09T16:18:00+00:00", "hash": "1458f802615af68f", "title_fa": "Anuel AA برنامه های خود را برای جشنواره واقعی Hasta la Muerte در سال 2027 فاش می کند: \"هر سال در کشوری متفاوت خواهد بود\"", "summary_fa": "Anuel AA در حال گسترش امتیاز Real Hasta la Muerte به رویدادهای زنده است. در گفتگو با لیلا کوبو، مدیر ارشد محتوای بیلبورد، سوپراستار پورتوریکویی برنامه های خود را برای جشنواره موسیقی که از سال 2027 آغاز می شود، فاش کرد. پست‌های مرتبط Anuel AA Talks Corridos Era, Fuerza Regida Collab درباره سابق کارول جی: شاید او من را رفع انسداد کند Anuel AA فاش می‌کند که آلبوم All-Corridos را همراه با «RHLM 2» منتشر می‌کند: همه چیزهایی که می‌دانیم تیلور سویفت و کارلی کلوس در بازی Kanssaefvis در حال حاضر شرکت می‌کنند. با جشنواره Real Hasta la Muerte، گفت: Anuel. او افزود: \"در جشنواره من هنرمندان زیادی حضور خواهند داشت. به زودی تاریخ آن را اعلام خواهم کرد.\" این هنرمند اشاره کرد که قصد دارد جشنواره را در تابستان 2027 راه اندازی کند و اروپا ممکن است اولین ایستگاه آن باشد. اما مکان حل نشده است. سال اول، فکر می‌کنم [ما در اسپانیا میزبان آن خواهیم بود»، در حالی که اشاره کرد که «در حال حاضر بین شیلی یا اسپانیا رفت و آمد می‌کند». او همچنین تاریخ، شهر، مکان یا ترکیبی را به اشتراک نمی گذارد، اما گفت که این رویداد \"هنرمندان زیادی\" را گرد هم می آورد. آنوئل با بیان اینکه جشنواره بین المللی پورتوریکو، مکزیک و کلمبیا را نیز به عنوان میزبان در نظر می گیرد، گفت: هر سال در کشور دیگری برگزار خواهد شد. اعلام موسیقی زنده در میان گفتگوی گسترده تر در مورد حرکات بعدی آنوئل منتشر شد. او به کوبو گفت که Real Hasta la Muerte 2 قرار است در 19 نوامبر برگزار شود و او می تواند آلبوم کوریدوس خود، Cartel Real Hasta la Muerte را در همان روز منتشر کند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/anuelqa.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۹:۴۸"}, {"source": "Billboard", "title": "Del Casher, Inventor of Guitar Wah-Wah Pedal Dies at 88", "link": "https://www.billboard.com/music/music-news/del-casher-death-inventor-guitar-wah-wah-pedal-dies-obituary-1236377908/", "summary": "Del Casher, a session musicians and the inventor of one of rock guitarist s most beloved effects, the wah-wah pedal, has died at 88. The news came as part of a GoFundMe campaign to help support his wife, Eiko, revealing that Casher passed on Oct. 1 following a battle with cancer. Related Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City Gone But Not Forgotten: Musicians We Lost in 2026 Michael Jackson s Thriller Scares Up Highest Rank on Billboard 200 Albums Chart in More Than 40 Years The GoFundMe started by neighbor and good friend Al Burg, noted that in addition to fighting cancer, Casher s sound studio business had been devastated by the COVID-19 pandemic, forcing him to sell valuable guitars and equipment to pay the bills, in addition to taking out a reverse mortgage on the couple s home. Casher, born Delton Edward Kacher in Hammond, Ind. on Dec. 28, 1937, is best known for the wah-wah pedal, an effects device for electric guitar that mimics the sound of a human voice reciting the onomatopoetic phrase wah-wah when stepped on or pushed with the foot. He got his start after college performing guitar and banjo on The Lawrence Welk Show in 1959, as well as sitting in with singing cowboy Gene Autry and the instrumental group Three Suns while tinkering with technologies that could make his playing more distinctive. According to Guitar Player magazine, Casher hit upon his signature invention while working with Vox amplifier and its American parent company, Thomas Organ, where he turned a tone-control circuit into a foot-operated effect that allowed guitarists to cycle through a sequence of frequencies that gave the pedal its distinctive name. While working as a Vox consultant in 1966, Casher noticed that a variable tone control on one of the company s amps produced the wah-wah effect when it was adjusted a certain way, realizing that he could change the way an electric guitar sounded and bend it to sound like a trumpet or a harmonica player cupping his hands around the mic and his instrument. Casher convinced the company s engineers to adapt his idea into a foot-operated pedal that was initially called a Cry Baby, then recorded a demo album for music stores to demonstrate his device, though neither the pedal nor the album gained much traction when they were released in 1967. “They thought I was a crackpot, but they humored me,” Casher told The New York Times in 2011 about idea to record the demo album. Casher got his big break, h", "date_str": "2026-11-09T16:13:22+00:00", "hash": "5b9bc13e30e6bebf", "title_fa": "دل کشر، مخترع پدال گیتار Wah-Wah در ۸۸ سالگی درگذشت", "summary_fa": "دل کشر، یک نوازنده جلسه و مخترع یکی از محبوب ترین افکت های گیتاریست راک، پدال wah-wah، در 88 سالگی درگذشت. این خبر به عنوان بخشی از یک کمپین GoFundMe برای کمک به حمایت از همسرش، ایکو، منتشر شد و فاش کرد که کشر در 1 اکتبر در پی نبرد با سرطان درگذشت. تیلور سوئیفت و کارلی کلوس در بازی Chiefs Travis Kelce در کانزاس سیتی شرکت کردند Gone But Not Forgotten: Musicians We Lost in 2026 Thriller مایکل جکسون می ترساند بالاترین رتبه در جدول آلبوم های بیلبورد 200 در بیش از 40 سال توسط The GoFundMe با سرطان شروع شد. کسب و کار استودیوی صدای کشر در اثر همه گیری کووید-19 ویران شده بود و او را مجبور کرد تا گیتارها و تجهیزات ارزشمندی را برای پرداخت قبوض بفروشد، علاوه بر آن وام مسکن معکوس برای خانه این زوج دریافت کند. کشر، با نام دلتون ادوارد کاچر در هاموند، هند در 28 دسامبر 1937، بیشتر به خاطر پدال wah-wah شناخته می شود، یک وسیله افکت برای گیتار الکتریک که صدای انسان را تقلید می کند که عبارت انوماتوپوزیک wah-wah را هنگام پا گذاشتن یا فشار دادن با پا، تقلید می کند. او شروع خود را پس از اجرای گیتار و بانجو در کالج در نمایش لارنس ولک در سال 1959 آغاز n rolls out with an eye-popping video spot as well as a batch of photos, all shot by Alasdair McLellan. In the minute-long visual, Jung Kook hams it up for the camera while dancing and striking silly poses in the outfits he picked out, doing cartwheels, playing with bouncy balls and miming driving away on an invisible motorbike. The singer has been a global ambassador for Calvin Klein for years, but in 2026, he s definitely stepped up his work with the company. In May, he designed his first-ever clothing line with the help of the brand, creating pieces that featured hidden secrets created just for ARMY. His holiday campaign comes at a time when BTS is busier than ever, with the band currently embarked on its massive world tour supporting three-week Billboard 200 -topping album ARIRANG . Label HYBE also recently announced that there are additional dates in store for the trek while teasing new music from both the band as a whole and from solo members meaning fans might just get a follow-up to Jung Kook s 2023 LP, Golden , in the near future. Check out Jung Kook s latest campaign with Calvin Klein below. View this post on Instagram View this post on Instagram", "date_str": "2026-11-09T16:10:52+00:00", "hash": "9decc0551f071d61", "title_fa": "جونگ کوک هام آن را در کمپین مد جشن برای «سبک هایی که همیشه به آن برمی گردم» تماشا کنید", "summary_fa": "او در یک کمپین تعطیلات جدید با خانه مد فاش کرد که دوستان و خانواده جونگ کوک در جستجوی یک هدیه کریسمس عالی برای عضو BTS با کمی کالوین کلاین به خصوص جین اشتباه نمی کنند. مرتبط، جونگ کوک راز کوچک بین من را فاش می‌کند ARMY Hidden در اولین خط لباس خود. (9 نوامبر)، شامل مجموعه‌ای از لباس‌ها که توسط جونگ کوک بر اساس قطعات مورد علاقه‌اش تنظیم شده است. این شامل شلوار جین با رنگ‌های مختلف، پیراهن‌هایی با آرم برند و لوازم جانبی مانند کمربند و جواهرات است که جونگ کوک در نسخه‌ای می‌گوید: برای این ویرایش تعطیلات، از گرفتن برخی از نمادین‌ترین لباس‌ها لذت بردم و آنها را به روش‌های جدیدی برای این فصل طراحی کردم. او اضافه کرد که سبک‌های کالوین کلی رنده جایزه امی بود، خدمت کرد. او همچنین به‌عنوان تهیه‌کننده اجرایی انیمیشن سینمایی «اما کوچولو» در سال ۲۰۲۴ فعالیت کرد. معرفی او در صنعت انیمیشن پس از فیلم کوتاه او به نام «Soar» که نویسندگی و کارگردانی آن بود و جایزه اسکار دانشجویی را از آکادمی علوم و هنرهای تصاویر متحرک دریافت کرد، انجام شد. در سال 2016، تزو به عنوان یکی از 10 انیماتور قابل تماشا در Variety انتخاب شد. او به‌عنوان بخشی از نمایه‌اش، درباره الهام‌بخشش برای کوتاه‌مدت کوتاه گفت: «از زمان کودکی، یکی از اولین چیزهایی که به آن اشاره کردم، یا درباره اش سوال پرسیدم، چیزهایی بود که حرکت می‌کردند و چیزهایی که در آسمان بودند. تزو قبل از گرفتن مدرک MFA در انیمیشن سه بعدی در آکادمی هنر در سانفرانسیسکو، معماری را در پرینستون خواند. Tzue همچنان توسط The Gotham Group و Bloch Law LLP نمایندگی می کند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/MixCollage-05-Nov-2026-03-20-PM-2344_b6ecc5.jpg?crop=0px%2C0px%2C1200px%2C675px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۱۸ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "Gary Gulman Sets HBO Comedy Special ‘Grandiloquent’ (EXCLUSIVE)", "link": "https://variety.com/2026/tv/news/gary-gulman-hbo-comedy-special-grandiloquent-1236943032/", "summary": "Gary Gulman s one-man show Grandiloquent is coming to HBO in the form of a comedy special. The show will debut sometime in December and will also be available to stream on HBO Max. With theatrical flair, Grandiloquent sees the Massachusetts-born 56-year-old telling stories of his childhood and formative experiences. Gulman reflects on how our earliest [ ]", "date_str": "2026-11-09T17:00:00+00:00", "hash": "78e7f42db6670726", "title_fa": "گری گلمن مجموعه کمدی ویژه HBO «Grandiloquent» (انحصاری)", "summary_fa": "سریال تک نفره گری گولمن Grandiloquent در قالب یک کمدی ویژه به شبکه HBO می آید. این سریال در ماه دسامبر آغاز به کار خواهد کرد و همچنین برای پخش از HBO Max در دسترس خواهد بود. Grandiloquent با استعدادی تئاتری، مرد 56 ساله متولد ماساچوست را می بیند که داستان هایی از دوران کودکی و تجربیات شکل دهنده خود تعریف می کند. گلمن به این موضوع می پردازد که چگونه اولین [ ] ما گلمن، Grandiloquent را به عنوان یک تولید خارج از برادوی در اوایل سال 2025 آغاز کرد و در تئاتر لوسیل لورتل در نیویورک اقامت گرفت. او همچنین این نمایش را تور کرد و آن را به لس آنجلس، فیلادلفیا، تورنتو، لندن و دیگر شهرهای بزرگ آورد. Grandiloquent سومین پروژه گلمن زیر چتر HBO است، پس از The Great Depresh در سال 2019 که از HBO پخش شد، و 2023s Born on 3rd Base که اولین بار در استریمری که آن زمان به عنوان مکس شناخته می شد، پخش شد. این پنجمین ویژه او در مجموع است. اولین او، مرد پسرانه، در سال 2006 به نمایش درآمد. این ویژه توسط گلمن نوشته و اجرا شده و مایکل بونفیگلیو کارگردانی آن را بر عهده دارد. جیسون واندرمر مدیر فیلمبرداری است و جود آپاتو، برایان استرن، مارک لیبرمن، امیلی کوهن، جاش چرچ، بونفیگلیو، گلمن، کارلی بریگلیا، مایکل لاووی و موریتز فون استولپناگل تهیه‌کنندگی اجرایی آن را بر عهده دارند. گلمن سه دهه را به عنوان یک کمدین استندآپ گذرانده است و در برنامه های شبانه دیوید لترمن، استیون کولبرت، جیمی کیمل، کانن او برین، جی لنو، ست مایرز، کریگ فرگوسن و غیره اجرا کرده است. او همچنین در فیلم پرفروش جوکر ظاهر شد و در سریال Hulu زندگی بث به کارگردانی امی شومر همبازی شد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Grandiloquent_10262026_GE_00234_V2.jpg?crop=354px%2C146px%2C2520px%2C1416px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۸ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "Media City Qatar Supports Regional Productions All the Way to the Big Screen", "link": "https://variety.com/2026/biz/news/media-city-qatar-supports-regional-productions-all-the-way-to-big-screen-1236921546/", "summary": "A year after Media City Qatar announced its support at MIPCOM Cannes 2025, Arabic drama series “Lamma Shefet” and “Kawalees,” developed by licensed company ImagiQ Productions with The Big Picture Studios, have moved from development into production and are now complete. The same journey takes shape across three films: “First to Fly” by Alaqat, “Jodari [ ]", "date_str": "2026-11-09T17:00:00+00:00", "hash": "21e0a3286068fe29", "title_fa": "مدیا سیتی قطر از تولیدات منطقه ای تا حد امکان در صفحه نمایش بزرگ پشتیبانی می کند", "summary_fa": "یک سال پس از اعلام پشتیبانی مدیا سیتی قطر در MIPCOM Cannes 2025، سریال‌های درام عربی \"Lamma Shefet\" و \"Kawalees\" که توسط شرکت دارای مجوز ImagiQ Productions با استودیوی بیگ پیکچر ساخته شده‌اند، از توسعه به مرحله تولید منتقل شده‌اند و اکنون کامل شده‌اند. همین سفر در سه فیلم شکل می‌گیرد: «اولین پرواز» ساخته علاقات، «جوداری [ ] شرکت‌ها می‌توانند در قطر بسازند و تولید کنند و با پشتیبانی مدیا سیتی قطر به خدمات و زیرساخت‌ها متصل شوند. این پنج محصول جهان‌های مختلف، از سرگرمی‌های معاصر گرفته تا ورزش، هویت و جاه‌طلبی شخصی را بررسی می‌کنند. «لما شفت» به کارگردانی دیوید اوریان، فیلمساز برنده جایزه و تهیه کنندگی رونی جازار و مازن فیاد، یک فیلم درام-هیجان‌انگیز 10 قسمتی از ساندرین زینون است که با بازی بازیگران منطقه‌ای تحسین‌شده ایمه سیاح و محمد آل احمد به شهرت رسید. \"Kawalees\" نوشته نادین جابر فیلمنامه نویس برنده جایزه و کارگردانی امیل اسلیاتی، دیما کندلافت در نقش یک روزنامه نگار تحقیقی سابق که پادکست شده بود، یک آلبوم عکس را کشف می کند که به خواننده ای که در دهه 1990 ناپدید شده بود، مرتبط است. همچنین توسط زینون و تهیه کنندگی جزار و فیاد، این فیلم به دنبال کشف او در دنیایی از استثمار و رسوایی در صنعت سرگرمی است. این سه فیلم این محدوده را گسترش می دهند. «اولین پرواز»، فیلمی از رودریگو وازکز سالسی، دو ژیمناست جوان را دنبال می‌کند که در مسابقات قهرمانی جهان با هم در قطر، بلغارستان و ماداگاسکار رقابت می‌کنند. فیلم مستند «جوداری منو» نیزه‌ماهی‌گیر و کارگردان قطری جمال الخنجی را دنبال می‌کند که در تلاش برای فرود آوردن یک ماهی تن دندان سگ رکورددار جهانی است، در سفری عمیقاً شخصی به کاوش در وسواس، مرگ‌ومیر و جستجوی معنا.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Media-City-Qatar.webp?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۸ آبان • ۲۰:۳۰"}, {"source": "Variety", "title": "Adobe Unveils 10 Filmmakers Receiving Total of $1 Million in Direct Grants, Forms Film & TV Advisory Board With Lena Waithe, Reggie Hudlin, Kerstin Emhoff and More", "link": "https://variety.com/2026/film/news/adobe-film-tv-fund-filmmakers-direct-grants-advisory-board-1236941355/", "summary": "Adobe is stepping up its efforts to fuel creative work from independent voices in the entertainment biz including directly giving money to creators. In 2024, the digital creative tools and services giant launched the Adobe Film TV Fund, aimed at expanding opportunities for emerging and mid-career filmmakers to get their projects made. Now [ ]", "date_str": "2026-11-09T17:00:00+00:00", "hash": "dbce21157cdf2231", "title_fa": "ادوبی از 10 فیلمساز که مجموعاً 1 میلیون دلار کمک مالی دریافت کرده اند، هیئت مشاوران فیلم و تلویزیون با لنا وایت، رجی هادلین، کرستین امهوف و غیره را تشکیل می دهد.", "summary_fa": "ادوبی تلاش های خود را برای تقویت کار خلاقانه از صداهای مستقل در حوزه سرگرمی از جمله پول دادن مستقیم به سازندگان افزایش می دهد. در سال 2024، غول خدمات و ابزارهای خلاق دیجیتال، صندوق تلویزیونی Adobe Film را با هدف گسترش فرصت‌ها برای فیلمسازان نوظهور و میان دوره‌ای برای انجام پروژه‌های خود راه‌اندازی کرد. اکنون [ ] علاوه بر این، ادوبی تشکیل هیئت مشاوره صندوق تلویزیونی فیلم جدید را با حضور رهبران سرگرمی از جمله لنا وایت، رجی هادلین و کرستین امهوف اعلام کرد. این خبر پیش از کنفرانس Adobe MAX 2026 این شرکت که از 10 تا 12 نوامبر در میامی برگزار می شود، منتشر می شود. ما به هالیوود اعتقاد داریم. لارا بالاز، مدیر ارشد بازاریابی ادوبی، به ورایتی گفت: ما برای دهه ها شریک قابل اعتماد هالیوود بوده ایم. ما می خواهیم فیلمسازانی را که به این جامعه اهمیت می دهیم توانمند کنیم. ما همچنین می‌دانیم که تامین مالی سخت است و می‌توانیم در آن نقش داشته باشیم. او گفت که بودجه مستقیم این شرکت برای سازندگان هیچ محدودیتی ندارد. از زمان راه اندازی، صندوق تلویزیونی Adobe Film بیش از 1000 سازنده را از طریق کمک هزینه تحصیلی، حمایت مالی، راهنمایی و دسترسی به ابزارهای خلاقانه حرفه ای Adobe حمایت کرده است. این شر rio Martínez, Delilah & More", "link": "https://www.billboard.com/lists/meet-latin-grammys-2026-best-new-artists-nominees-category/", "summary": "Best New Artist is one of the Latin Grammys’ four General Field categories, placing a newcomer conversation alongside Record, Album and Song of the Year. It is also the category that asks voters to make a bet: not about who had a breakthrough year, but whose voice, point of view or musical world feels like the beginning of something. The award has a history of recognizing artists before they became fixtures. Juanes won in 2001, Calle 13 took the honor in 2006 before becoming one of the most audacious and decorated acts in Latin music, and Karol G won in 2018, years before her global stadium era. Those names are not a forecast for any one nominee, of course, but they underline the category’s particular thrill: sometimes the “new” artist is the next artist who changes the conversation. For 2026, the Latin Recording Academy has assembled 11 nominees across a striking range of geographies and approaches: Mexican indie folk, coastal Colombian rhythms, Brazilian R B, dream-pop, singer-songwriter confessionals and more. The spread is part of the story. Macario Martínez’s roots-minded songs and viral rise sit in a very different lane from maye’s hazy, finely layered pop. Arath Herce’s songwriter craft shares the ballot with ARIA VEGA’s Caribbean-facing pop, while three Brazilian nominees bring distinct perspectives from one of Latin America’s most influential music cultures. Two of those artists, Loulu Gilberto and Zeca Veloso, are also the children of bossa nova and tropicalia icons João Gilberto and Caetano Veloso, respectively — a notable family footnote, but not a substitute for hearing what they make on their own. Here’s a closer introduction to all 11 nominees — what they sound like, the moments that brought them here, and where Billboard readers may already have encountered them — in alphabetical order.", "date_str": "2026- dy Center Honorees Who Were Teenagers When They First Hit the Billboard Hot 100 (Full List)", "link": "https://www.billboard.com/lists/kennedy-center-honorees-teenagers-when-first-hit-full-list/", "summary": "Paul Anka was just 15 – two weeks away from turning 16 – when he first made Billboard ’s pop chart in July 1957 with the smash “Diana.” (This was more than a year before Billboard introduced the Hot 100.) Last week, Anka was announced as a 2026 recipient of the Kennedy Center Honors, one of the most prestigious career cappers in the entertainment field. Anka is the 11th artist who later received the Kennedy Center Honors who first hit the Hot 100 as a teenager. Anka was a bona-fide teen idol when he started out, with such teen-targeted hits as “Put Your Head on My Shoulder” and “Puppy Love,” but most of the artists on this list weren’t teen idols, as such. They simply knew what they wanted to do from an early age and got off to a fast start. Related Paul Anka, David Foster Barbara Mandrell Are Among 2026 Kennedy Center Honorees: Complete List In addition to these 11 artists who received Kennedy Center Honors as individuals, two artists who received the Honors as part of a group first made the Hot 100 as teenagers. Pete Townshend was 19 when The Who first made the Hot 100 with “I Can’t Explain” in March 1965. The Who received the Kennedy Center Honors in 2008. Verdine White was 19 when Earth, Wind Fire first made the Hot 100 with “Love Is Life” in July 1971. EWF received the Kennedy Center Honors in 2019. This year’s other Kennedy Center Honorees are songwriter/producer David Foster , actor/director Andy Garcia, playwright David Mamet, and country star Barbara Mandrell . The awards will be presented on Dec. 7 at Capitol One Arena in Washington, D.C. Here’s a complete list of artists who went on to receive the Kennedy Center Honors who first hit the Hot 100 as teenagers. They are listed in chronological order by the year they received the Kennedy Center Honors.", "date_str": "2026-11-09T15:37:02+00:00", "hash": "58629c302f368c88", "title_fa": "پل آنکا، استیوی واندر، شر و دیگر برگزیدگان مرکز کندی که برای اولین بار در بیلبورد هات 100 نوجوان بودند (فهرست کامل)", "summary_fa": "پل آنکا تنها 15 سال داشت - دو هفته تا 16 سالگی - وقتی برای اولین بار در ژوئیه 1957 با آهنگ فوق العاده \"دیانا\" در جدول پاپ بیلبورد قرار گرفت. (این بیش از یک سال قبل از معرفی Billboard Hot 100 بود.) هفته گذشته، Anka به عنوان دریافت کننده افتخارات مرکز کندی در سال 2026 معرفی شد، یکی از معتبرترین بازیگران حرفه ای در زمینه سرگرمی. آنکا یازدهمین هنرمندی است که بعداً افتخارات مرکز کندی را دریافت کرد و اولین بار در نوجوانی موفق به کسب رتبه 100 شد. آنکا زمانی که شروع به کار کرد، یک بت نوجوان خوب بود، با آثاری مانند «سرت را روی شانه من بگذار» و «عشق توله سگ»، اما اکثر هنرمندان این فهرست به این ترتیب بت های نوجوان نبودند. آنها به سادگی می دانستند که چه کاری می خواهند انجام دهند و به سرعت شروع کردند. مرتبط پل آنکا، دیوید فاستر باربارا ماندرل در میان برگزیدگان سال 2026 مرکز کندی هستند: فهرست کامل علاوه بر این 11 هنرمندی که به صورت انفرادی جوایز مرکز کندی را دریافت کردند، دو هنرمندی که به عنوان بخشی از یک گروه این افتخارات را دریافت کردند، ابتدا در نوجوانی موفق به کسب جایزه Hot 100 شدند. پیت تاونشند ۱۹ ساله بود که اولین بار The Who با «I Can't Explain» در مارس 1965، Hot 100 را ساخت. The Who در سال 2008 افتخارات مرکز کندی را دریافت کرد. وردین وایت 19 ساله بود که Earth, Wind Fire برای اولین بار با «Love Is Life» در ژوئیه 1971 به فیلم Hot 100 رسید. EWF در سال 2019 جوایز افتخاری مرکز کندی را دریافت کرد. دیگر افتخارآفرینان مرکز کندی امسال دیوید فاستر، ترانه‌سرا/تهیه‌کننده، بازیگر/کارگردان اندی گارسیا، و رایت گارسیا کانتری، بازیگر و کارگردان، اندی گارسیا، پلی‌و هستند. جوایز در 7 دسامبر در Capitol One Arena در واشنگتن دی", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2153366021-e1794190647291.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۸ آبان • ۱۹:۰۷"}, {"source": "Deadline", "title": "WETA And DC/DOX Part لعید. ورلن از بارها و کلوب ها متنفر بود. لوید از رفتن متنفر بود. همانطور که او در خاطراتش به یاد می آورد، \"در آن زمان خودم را یک تلاش جنسی می نامیدم، زیرا هر کاری را چند بار امتحان می کردم تا ببینم آن را دوست دارم یا نه. برای مدتی از خودم به عنوان یک فاحشه مرد حمایت می کردم، درست مانند", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/richard-lloyd-sheff-tribute.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۸:۵۶"}, {"source": "Rolling Stone", "title": "Russell Brand Sentenced to More Than 10 Years in Prison After Rape Conviction", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/russell-brand-sentenced-prison-rape-conviction-1235653829/", "summary": "Actor was also found guilty of three counts of sexual assault at his trial", "date_str": "2026-11-09T14:30:33+00:00", "hash": "1cf7c83851345a8e", "title_fa": "راسل برند پس از محکومیت به تجاوز جنسی به بیش از 10 سال زندان محکوم شد", "summary_fa": "این بازیگر همچنین در دادگاه خود در سه مورد تجاوز جنسی مجرم شناخته شد. هیئت منصفه در لندن، برند را در چهار مورد از هفت اتهام وارده به او، از جمله یک مورد تجاوز جنسی و سه مورد تجاوز جنسی، مجرم شناخت. او در دو مورد دیگر تجاوز جنسی، و همچنین یک مورد تلاش برای حمله ناشایست بی گناه شناخته شد. اتهامات علیه او به ادعاهای شش زن بین سال‌های 1999 و 2009 مرتبط بود. بخش عمده‌ای از محکومیت برند به اتهام تجاوز جنسی مرتبط بود که قاضی او را به 9 سال زندان محکوم کرد. در همین حال، هر یک از سه اتهام ضرب و شتم مجازات خاص خود را داشتند: نه ماه، 18 ماه و هشت ماه. احکام ضرب و جرح همزمان، اما متوالی با حکم اتهام تجاوز جنسی اجرا می شود. برند در نهایت واجد شرایط آزادی مشروط خواهد بود، اما تنها پس از گذراندن دو سوم دوران محکومیت خود. این بدان معناست که او حداقل هفت سال را پشت میله های زندان سپری خواهد کرد و در صورت آزادی مشروط، باید باقیمانده دوران محکومیت خود را تحت نظارت و با رعایت قوانین خاص بگذراند. قبل از صدور حکم زندان برای برند، قاضی جوئل بناتان توضیح داد که چگونه به مجازات محکوم می شود و بسیاری از شهادت زنانی را که ادعاهایشان منجر به محکومیت برند شده است، بازگو کرد. در بسیاری از موارد، بناتان در امان نبود. او بارها برند را یک شکارچی جنسی نامید، از \"غرور خیره کننده\" کمدین انتقاد کرد و او را مورد انتقاد قرار داد \"با این باور که شهرت به این معنی است که می توانی هر زمان که دوست داری هر طور که دوست داری رفتار کنی، بدون اینکه قوانینی که افراد شایسته زندگی می کنند\" (از طریق The Guardian).", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/GettyImages-2303156520.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۸ آبان • ۱۸:۰۰"}, {"source": "Hollywood Reporter", "title": "Emily Watson Cast in British Drama From Dominic Cooke ‘John Daniel’", "link": "https://www.hollywoodreporter.com/movies/movie-news/emily-watson-john-daniel-gorilla-film-dominic-cooke-1236750796/", "summary": "Based on a true story, the film stars the 'Hamnet' actress as an Englishwoman who befriends a baby gorilla in 1918.", "date_str": "2026-11-09T16:00:00+00:00", "hash": "022d9c61023892c8", "title_fa": "امیلی واتسون بازیگران درام بریتانیایی از دومینیک کوک «جان دانیل»", "summary_fa": "این فیلم که بر اساس یک داستان واقعی ساخته شده است، بازیگر زن «همنت» در نقش یک زن انگلیسی است که در سال 1918 با یک بچه گوریل دوست می شود. امیلی واتسون رهبری درام بریتانیایی آینده دومینیک کوک را بر عهده خواهد داشت. نامزد دوبار آکادمی و بفتا که بیشتر به خاطر بازی در فیلم های Breaking the Waves، Hamnet و Chernobyl شناخته می شود، در این فیلم نقش آلیس کانینگهام را بازی خواهد کرد. جان دانیل بر اساس داستان واقعی غیرمعمول دوستی غیرمحتمل بین یک زن انگلیسی مستقل و یک بچه گوریل در عواقب جنگ جهانی اول است. الکسی کی کمپبل (زن طلایی)، با الهام از فیلم‌های اصلی فیلم خانگی و عکس‌های ثبت‌شده توسط مردم محلی در اولی، گلاسسترشر از سال 1918 تا 1922، فیلمنامه را می‌نویسد. داستان‌های مرتبط TV The Other Elliot Sister Greenlit در BritBox با راه‌اندازی Austen Anthology Franchise (اختصاصی) TV Prime Video رونمایی از تریلر فصل آخر Maxton Hall در سال 1918، دهکده Cotswolds Uley هنوز به دلیل تلفات جنگ جهانی اول خام است، و آلیس در پشت یک زندگی پر از غم و اندوه است. این موضوع زمانی تغییر می کند که برادرزاده بی پروا او به طور ناگهانی یک بچه گوریل را از ویترین یک فروشگاه بزرگ لندن نجات می دهد و با نادیده گرفتن اعتراضات او، چاره ای جز پذیرش او باقی نمی گذارد، خلاصه داستان را می خواند. جان دانیل شیطون و بی‌نهایت کنجکاو، همانطور که با اکراه نامش را می‌برد، به آرامی او را جذب می‌کند و با تبدیل شدنش به بخشی از زندگی روستا، از کلاس درس مدرسه تا میخانه روستا، شادی را به جامعه عزادار بازمی‌گرداند. وقتی ترس و سوء ظن او را تهدید می کند که او را بیرون می کند، آلیس باید تصمیم بگیرد که برای محافظت از حیوانی که قلبش را باز کرده است", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/08/FotoJet-2026-08-19T112731.260.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۸ آبان • ۱۹:۳۰"}, {"source": "Hollywood Reporter", "title": "‘The Other Elliot Sister’ Greenlit at BritBox With Launch of Austen Anthology Franchise (Exclusive)", "link": "https://www.hollywoodreporter.com/tv/tv-news/the-other-elliot-sister-bennet-britbox-anthology-series-tv-1236750743/", "summary": "Elizabeth Elliot of 'Persuasion' will receive 'The Other Bennet Sister' treatment in a 10-part series as Mary Bennet's record-breaking popularity spawns an entire franchise dedicated to Jane Austen's forgotten heroines.", "date_str": "2026-11-09T16:00:00+00:00", "hash": "f36fff580a1d218c", "title_fa": "\"The Other Elliot Sister\" Greenlit در BritBox با راه اندازی امتیاز Austen Anthology (انحصاری)", "summary_fa": "الیزابت الیوت از «اقناع» در یک سریال 10 قسمتی با «خواهر دیگر بنت» رفتار خواهد کرد، زیرا محبوبیت رکوردشکنی مری بنت باعث ایجاد یک فرنچایز کامل به قهرمانان فراموش شده جین آستن می شود. متن لوگو به همه گل‌های دیواری جین آستن فرصت شکوفایی داده می‌شود، زیرا BritBox یک مجموعه گلچینی را از پشت موفقیت The Other Bennet Sister راه‌اندازی می‌کند. استریمر متعلق به استودیوی بی‌بی‌سی سریالی با عنوان ناگفته‌های آستن را برا ful album by another classy English pop-soul singer, Olivia Dean . Both albums could make it, of course, but with many strong albums vying for just eight slots on the final ballot, something’s gotta give. Related Categories With the Most Fewest Entries for 2027 Grammys Paul McCartney and Taylor Swift are both going for history. If McCartney is nominated for The Boys of Dungeon Lane , it will be his record-extending 10th career nomination in this category. If Swift is nominated for The Life of a Showgirl , it will be her eighth nod in this category — more than anyone else in Grammy history for strictly solo albums. Swift is a better bet: She has been nominated in this category with each of her last four regular studio albums. McCartney was last nominated here in 2006. We show the deluxe editions of hit albums by Noah Kahan and Rosalía because those are the ones that were entered in the Grammy competition. A total of 683 albums were on the eligibility list in this category. Here are our best ", "date_str": "2026-11-09T15:00:00+00:00", "hash": "fc9b46bdc978d0e1", "title_fa": "پیش بینی های نهایی نامزدهای گرمی 2027: آلبوم سال", "summary_fa": "زمانی که نامزدهای شصت و نهمین جوایز سالانه گرمی در روز دوشنبه (16 نوامبر) اعلام شود، احتمالاً سال رویایی الا لنگلی به اوج خود می رسد. به لطف تغییر قانون در رده بهترین هنرمند جدید که در ماه ژوئن اعلام شد، که به یک هنرمند اجازه می‌دهد به جای سه بار، چهار بار وارد شود، لنگلی می‌تواند در چهار مورد از شش دسته کلی رشته - آلبوم، ضبط و آهنگ سال به علاوه بهترین هنرمند جدید نامزد شود. اگر این اتفاق بیفتد، لنگلی اولین هنرمند متقاطع کانتری خواهد بود که پس از بابی جنتری در سال 1968 به این شاهکار دست یافته است. ما برای اولین بار در ماه جولای پیش نمایش نامزدهای گرمی را در این دسته های خیمه شب بازی مشاهده کردیم. از امروز، در صورت لزوم، آن پیش‌بینی‌ها را به‌روزرسانی می‌کنیم. اول، آلبوم سال، احتمالاً معتبرترین و مورد علاقه‌ترین آلبوم در بین 100 جایزه گرمی. روز سه‌شنبه، آهنگ و آهنگ سال را بررسی خواهیم کرد. روز چهارشنبه، بهترین هنرمند جدید را بازی خواهیم کرد. موارد مرتبط اینجاست که آلبوم‌های ژانرآمیز از Rosalía، Noah Kahan، Charli xcx بیشتر در رای گیری گرمی 2027 فرود آمدند برای چهارمین سال متوالی، هشت نامزد در هر یک از این دسته‌ها وجود خواهد داشت. دوره صلاحیت برای شصت و نهمین دوره جوایز سالانه گرمی از 31 اوت 2025 تا 28 اوت 2026 ادامه داشت. زمینه رقبای احتمالی آلبوم سال از زمانی که برای اولین بار در جولای پیش نمایش آنها را مشاهده کردیم، تغییر چندانی نکرده است. من اکتان Don Toliver را از \"Within Reach\" به بالاترین سطح رساندم و جای آلبوم RAYE's This Music May Contain Hope را گرفتم، که با آلبوم موفق‌تر تجاری‌تر از خواننده باکلاس پاپ سول انگلیسی، اولیویا دین رقابت می‌کند. البته هر دو آلبوم می‌توانند به آن برسند، اما با وجود بسیاری از آلبوم‌های قوی که فقط", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2293220773-e1793989817474.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "Justin Timberlake Makes Rare Public Appearance With Sons and Niece on Runway at Down Syndrome Foundation Fashion Show", "link": "https://www.billboard.com/music/pop/justin-timberlake-sons-niece-down-syndrome-foundation-show-1236377886/", "summary": "Justin Timberlake made a rare public appearance with his two young sons, 11-year-old Silas and 6-year-old Phineas, as the family gathered in Denver on Saturday (Nov.7) to help celebrate the Global Down Syndrome Foundation s 19th annual fashion show. Related Taylor Swift and Karlie Kloss Attend Travis Kelce s Chiefs Game in Kansas City Justin Timberlake Crowns This FutureSex/LoveSounds Hit as the Best Song He s Ever Made: Written in Damn Near 20 Minutes Michael Jackson s Thriller Scares Up Highest Rank on Billboard 200 Albums Chart in More Than 40 Years According to People magazine, Timberlake walked the runway with his 7-year-old niece, Zaya, while attending the nonprofit s Be Beautiful Be Yourself fashion show in the Mile High city in support of brother-in-law Justin Biel and his wife Rose s daughter, who has Down syndrome. “Jessica and I adore Zaya, and we couldn’t be prouder of the remarkable difference she is making in the world,” Timberlake said in a statement shared with the organization, the magazine reported. “Every person with Down syndrome deserves the opportunity to reach their full potential, and that’s why GLOBAL’s work means so much to our family.” In an Instagram Story featuring a picture of the singer, his sons and Zaya, he wrote , We walked my beautiful niece Zaya down the @globaldownsyndrome runway last night ❤️. He followed that with a slide in which he held a smiling Zaya in his arms on the red carpet, with the caption Proud uncle! In photos from the night, Zaya held her uncle and cousin Silas hands as she walked down the catwalk with a big smile. The Timberlake men came dressed to impress, with Justin rocking a roomy black suit, while Phineas matched his dad s energy in all black and Silas opted for black pants with a black leather jacket over a white shirt and black tie, accented by sunglasses. Zaya made her own statement in a black-and-white polka dot cress and fringe boots. In a video from the event , JT and Silas bust some moves as Zaya gets a boost up onto the singer s hip as they wave to the crowd. She has some moves. Maybe her uncle Justin has taught her some moves and her auntie Jessica, says the show s announcer to cheers from the audience. The organization teased the appearance last week, posting a pic of Timberlake and wife Jessica Biel with her brother and his wife, writing, 🎉 BIG NEWS! Grammy and Emmy Award-winning superstar @justintimberlake will rock the runway with his beautiful niece, #GLOBALAmbassador alum Zaya Biel @", "date_str": "2026-11-09T14:21:20+00:00", "hash": "b5c07c1ca0a26513", "title_fa": "حضور نادر جاستین تیمبرلیک با پسران و خواهرزاده‌اش در ران وی در فشن شوی بنیاد سندروم داون", "summary_fa": "جاستین تیمبرلیک با دو پسر خردسال خود، سیلاس 11 ساله و فینیاس 6 ساله، در حالی که خانواده در روز شنبه (7 نوامبر) در دنو قی است، انجمنی که نماینده ناشران موسیقی آمریکایی و شرکای ترانه سرایی آنهاست. تنوع از نظرات مسئولانه استقبال می کند، لطفا ایده های خود را به music@variety.com ارسال کنید. موج جزر و مد سیاسی که سراسر آمریکا را فرا گرفت، پیامدهایی فراتر از واشنگتن خواهد داشت. برای صنعت موسیقی، و به ویژه برای [ ] دموکرات ها کنترل مجلس و سنا را به دست گرفته اند. نسل جدید و جوانتری از قانونگذاران به واشنگتن می آیند. این نسل احساسات فزاینده‌ای داشتند که نسبت به فناوری بزرگ از هوش مصنوعی گرفته تا الیگارشی‌هایی که در واشنگتن پایگاهی مستحکم داشته‌اند، بدبین هستند. کمیته های قضایی رهبری جدید خواهند داشت. و شرکت های فناوری که به طور فزاینده ای بر صنعت ما تسلط یافته اند، با چشم انداز سیاسی بسیار متفاوتی روبرو خواهند شد. برای ترانه سرایان، این تغییرات فرصت های قابل توجهی را ارائه می دهد. برای روشن بودن، مسائل ترانه سرا به نفع هیچ حزب سیاسی نیست. ترانه سراها حق دارند برای کارشان دستمزد منصفانه دریافت کنند. این همیشه یک دلیل دو حزبی بوده است. قوی ترین قهرمانان ما هم جمهوری خواهان و هم دموکرات ها بوده اند. به یاد داشته باشید، قانون نوسازی موسیقی توسط نماینده کنگره، Hakeem Jeffries (D-NY) رئیس بالقوه بعدی مجلس و داگ کالینز (R-GA) معرفی شد. و دقیقاً به همین دلیل است که این انتخابات چنین فرصت جالبی را ایجاد می کند. هیچ کمیته‌ای در کنگره برای صنعت موسیقی مهم‌تر از کمیته‌های قضایی مجلس نمایندگان و سنا و کمیته‌های فرعی مالکیت معنوی آنها نیست. این قانونگذاران بر قانون کپی رایت نظارت می‌کنند، قوانینی را در نظر می‌گیرند که بر صدور مجوز موسیقی تأثیر می‌گذارد، و به تعیین نحوه سازگاری سیستم مالکیت معنوی ما با فناوری جدید کمک می‌کنند.", "image_url": "https://variety.com/wp-content/uploads/2021/10/thumbnail_image0-1.jpg?w=1000&#038;h=562&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "موسیقی"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "Variety", "title": "David Schwimmer Reunites With His Famous Red Sweater From ‘Friends’ in Nostalgic Quince Campaign", "link": "https://variety.com/2026/shopping/news/david-schwimmer-red-sweater-quince-campaign-watch-1236941992/", "summa     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
