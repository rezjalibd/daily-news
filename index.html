اند؛ لغو برخی پروازها قرار است تا روز دوشنبه ادامه یابد. در پی گزارش‌ها درباره حمله تازه، سفارت آمریکا در ریاض از شهروندان این کشور خواست از فرودگاه بین‌المللی ملک خالد و مناطق اطراف آن دور بمانند. این سفارت روز شنبه ۱۸ مهر در اطلاعیه‌ای در شبکه اجتماعی ایکس اعلام کرد از گزارش‌های مربوط به حملات به فرودگاه مطلع است و به شهروندان آمریکایی هشدار داد احتمال لغو پروازها، بسته‌شدن حریم هوایی و اختلال در سفرها را در نظر بگیرند. این سفارت همچنین از مسافران خواست وضعیت پروازهای خود"}, {"source": "IranWire", "title": "اعتراف به شکست سرکوب، هراس از جامعه معترض؛ بازخوانی اظهارات محمدرضا باهنر", "link": "https://iranwire.com/fa/features/158713-%D8%A7%D8%B9%D8%AA%D8%B1%D8%A7%D9%81-%D8%A8%D9%87-%D8%B4%DA%A9%D8%B3%D8%AA-%D8%B3%D8%B1%DA%A9%D9%88%D8%A8-%D9%87%D8%B1%D8%A7%D8%B3-%D8%A7%D8%B2-%D8%AC%D8%A7%D9%85%D8%B9%D9%87-%D9%85%D8%B9%D8%AA%D8%B1%D8%B6-%D8%A8%D8%A7%D8%B2%D8%AE%D9%88%D8%A7%D9%86%DB%8C-%D8%A7%D8%B8%D9%87%D8%A7%D8%B1%D8%A7%D8%AA-%D9%85%D8%AD%D9%85%D8%AF%D8%B1%D8%B6%D8%A7-%D8%A8%D8%A7%D9%87%D9%86%D8%B1/", "summary": "«محمدرضا باهنر»، نایب‌رئیس ادوار مجلس شورای اسلامی و از چهره‌های باسابقه جریان محافظه‌کار در جمهوری اسلامی، در میزگردی که «خبرآنلاین ...", "date_str": "2026-10-10T16:40:20+00:00", "hash": "cb6aea297a784c8c", "title_fa": "اعتراف به شکست سرکوب، هراس از جامعه معترض؛ بازخوانی اظهارات محمدرضا باهنر", "summary_fa": "«محمدرضا باهنر»، نایب‌رئیس ادوار مجلس شورای اسلامی و از چهره‌های باسابقه جریان محافظه‌کار در جمهوری اسلامی، در میزگردی که «خبرآنلاین ... او اخیرا این جمله خود درباره حزب‌اللهی‌ها که قرار نیست سبک زندگی همه ایران نظیر حزب‌اللهی‌ها باشد را در برنامه‌ای تلویزیونی مطرح کرده بود و بار دیگر در این میزگرد نیز به آن پرداخته‌است. باهنر که دبیرکل جامعه اسلامی مهندسین و عضو حقیقی مجمع تشخیص مصلحت نظام است جامعه ایران را به ۵ گروه «معاند»، «مخالف»، «بی‌تفاوت»، «طرفدار» و «جان‌نثار» تقسیم‌بندی کرده‌ و از شیوه برخورد با مردم انتقاد کرده‌است. او همچنین ساختار حاکم در مواجهه با نافرمانی مدنی زنان، مطالبات نسل جوان و گسست اجتماعی، را به نقد کشیده‌است. خلاصه‌ای از گفته‌ها و نظرات او را در ادامه می‌خوانید: در شرایطی که دستگاه‌های سرکوب همچنان بر تحمیل حجاب اجباری از طریق گشت‌های پلیسی و محرومیت‌های شهروندی اصرار دارند، باهنر علناً به خصلت اعتراضی برداشتن حجاب از سوی زنان اعتراف کرده گفته‌است:«من در همین جریانات اخیر واقعاً اعتقاد دارم بخشی از بی‌حجابی‌ها یک مقدار اعتراضات اجتماعی است؛ یعنی واقعاً سراغ دارم لجبازی و واکنش است... از موقعی که فشار زیاد شد، آن روسری را هم انداخته بیرون... به زور نمی‌شود حجاب را بر سر خانم‌ها کرد.» ] او با زیر سوال بردن کارایی ابزارهای قهرآمیز پلیسی و قضایی تاکید کرده‌: «من گفتم با جریمه نقدی، با ون و با بازداشت نمی‌توانیم خانم‌های کشور را عفیف بار بیاوریم؛ دستگیر کردن و محاصره کردن با جذب کردن فرق می‌کند... در امر به معروف آدم مأمور به نتیجه است؛ یعنی اگر احساس کردم اثر عکس دارد، نه‌تنها نباید انجام بدهم بلکه حرام می‌شود.» اقلیت ۱۰ درصدی علیه اکثریت ۸۰ میلیونی؛ مقایسه با «شاه» و «حزب بعث» یکی از محوری‌ترین اعترافات این چهره محافظه‌کار در میزگرد که اعضای سردبیری خبرآنلاین در آن حضور دارند، اقلیت‌بودن پایگاه ایدئولوژیک حاکمیت و زیاده‌خواهی آن برای کنترل"}, {"source": "IranWire", "title": "سپاه مدعی برخورد یک سوپر نفتکش با مین دریایی در تنگه هرمز شد", "link": "https://iranwire.com/fa/news-1/158714-%D8%B3%D9%BE%D8%A7%D9%87-%D9%85%D8%AF%D8%B9%DB%8C-%D8%A8%D8%B1%D8%AE%D9%88%D8%B1%D8%AF-%DB%8C%DA%A9-%D8%B3%D9%88%D9%BE%D8%B1-%D9%86%D9%81%D8%AA%DA%A9%D8%B4-%D8%A8%D8%A7-%D9%85%DB%8C%D9%86-%D8%AF%D8%B1%DB%8C%D8%A7%DB%8C%DB%8C-%D8%AF%D8%B1-%D8%AA%D9%86%DA%AF%D9%87-%D9%87%D8%B1%D9%85%D8%B2-%D8%B4%D8%AF/", "summary": "روابط عمومی نیروی دریایی سپاه پاسداران مدعی شد یک سوپرنفتکش حامل نفت خام در پی برخورد با مین دریایی در تنگه هرمز منفجر شده و هم‌اکنون در ...", "date_str": "2026-10-10T17:16:28+00:00", "hash": "703b48264bf6a3f1", "title_fa": "سپاه مدعی برخورد یک سوپر نفتکش با مین دریایی در تنگه هرمز شد", "summary_fa": "روابط عمومی نیروی دریایی سپاه پاسداران مدعی شد یک سوپرنفتکش حامل نفت خام در پی برخورد با مین دریایی در تنگه هرمز منفجر شده و هم‌اکنون در ... این نهاد نظامی روز شنبه ۱۸ مهر اعلام کرد این نفتکش قصد داشت از م  خبرنگاری که درباره مسدود سازی سیم‌کارت‌ها گزارش نوشته بود، مسدود شد", "link": "https://iranwire.com/fa/news-1/158737-%D8%B3%DB%8C%D9%85%DA%A9%D8%A7%D8%B1%D8%AA-%D8%AE%D8%A8%D8%B1%D9%86%DA%AF%D8%A7%D8%B1%DB%8C-%DA%A9%D9%87-%D8%AF%D8%B1%D8%A8%D8%A7%D8%B1%D9%87-%D9%85%D8%B3%D8%AF%D9%88%D8%AF-%D8%B3%D8%A7%D8%B2%DB%8C-%D8%B3%DB%8C%D9%85%DA%A9%D8%A7%D8%B1%D8%AA%D9%87%D8%A7-%DA%AF%D8%B2%D8%A7%D8%B1%D8%B4-%D9%86%D9%88%D8%B4%D8%AA%D9%87-%D8%A8%D9%88%D8%AF-%D9%85%D8%B3%D8%AF%D9%88%D8%AF-%D8%B4%D8%AF/", "summary": "«نگین باقری»، روزنامه‌نگاری که درباره قطع سیم‌کارت و خطوط تلفن صاحبان کسب‌وکارهای اینترنتی به دلیل انتشار تصاویر مغایر با ضوابط پوشش جمه ...", "date_str": "2026-10-11T12:45:21+00:00", "hash": "cf041e4494c6f817", "title_fa": "سیم‌کارت خبرنگاری که درباره مسدود سازی سیم‌کارت‌ها گزارش نوشته بود، مسدود شد", "summary_fa": "«نگین باقری»، روزنامه‌نگاری که درباره قطع سیم‌کارت و خطوط تلفن صاحبان کسب‌وکارهای اینترنتی به دلیل انتشار تصاویر مغایر با ضوابط پوشش جمه ... باقری با انتشار تصویری از پیام دریافتی خود در تلگرام نوشت : «به دنبال نوشتن این گزارش درباره روند قطع سیم‌کارت‌ها، هفته پیش سیم‌کارت خودم را هم قطع کردند.» در تصویر منتشر شده، حسابی با عنوان «مسدودی» به این روزنامه‌نگار اطلاع داده است که به دلیل فعالیت در فضای مجازی که «مغایر با قوانین و مقررات کشور جمهوری اسلامی ایران» تشخیص داده شده، سیم‌کارت او مسدود شده است. در این پیام از باقری خواسته شده پس از گذشت دو هفته، برای پیگیری رفع مسدودی با شماره ۱۱۴ تماس بگیرد. همچنین هشدار داده شده که روند رفع مسدودی، بسته به «میزان فعالیت و نوع جرم»، دست‌کم یک ماه طول خواهد کشید. باقری پیش‌تر در گزارشی برای وب‌سایت «زومیت»، از روند قطع خطوط تلفن و مسدودسازی حساب‌های بانکی صاحبان کسب‌وکارهای اینترنتی به دلیل محتوای صفحات اینستاگرامی آن‌ها پرده برداشته بود. براساس این گزارش، صاحبان کسب‌وکارها پس از مراجعه به مخابرات و پیگیری از کمیته تعیین مصادیق محتوای مجرمانه، به «کارگروه ساماندهی مد و لباس»، زیرمجموعه شورای فرهنگ عمومی کشور، ارجاع داده می‌شوند. کارشناسان این کارگروه تصاویر صفحات اینستاگرامی را بررسی می‌کنند و صاحبان صفحات موظف‌ا نها می‌گویند که آقای روبیو سعی داشت تا بمباران ایران را توجیه کند.", "date_str": "2026-10-11T09:10:03+00:00", "hash": "0892524c8c688774", "title_fa": "چرا مارکو روبیو پای هخامنشیان را به جنگ آمریکا و ایران کشاند؟", "summary_fa": "سخنرانی مارکو روبیو، وزیر خارجه آمریکا، در مقابل بنای آکروپولیس در آتن و این که سپاه هخامنشیان و خشایارشا آنجا را به آتش کشیدند و معابدش را ویران کردند، اعتراض و خشم تاریخ‌دانان و ایرانشناسان سرشناس تا مقام‌های حکومتی و کاربران شبکه‌های اجتماعی را در پی داشت؛ آنها می‌گویند که آقای روبیو سعی داشت تا بمباران ایران را توجیه کند. وزیر خارجه آمریکا که درجریان سفر به سه کشور عضو ناتو به یونان رفته بود، همچنین هشدار داد که «تمدن غرب در معرض خطر افول است» و از کشورهای اروپایی خواست که به «ارزش‌های یونان باستان» بازگردند و به آمریکا کمک کنند. این نخستین بار نیست که اظهارات مقام‌های دولت آمریکا در باره «تهدید تمدن ایران» واکنش برانگیز شده است. دونالد ترامپ، رئیس‌جمهور آمریکا نیز بارها از محو کردن تمدن ایران صحبت کرده است. تورج دریایی، تاریخ‌نگار و ایرانشناس برجسته ایرانی آمریکایی به بی‌بی‌سی فارسی می‌گوید کاری که آقای روبیو سعی در انجام آن دارد توجیه اقدامات آمریکاست و اینکه بمباران ایران به خاطر این است که خشایارشا، ۴۸۰ سال پیش از میلاد آتن را به آتش کشیده است. او افزود که «این یعنی اینها [ایرانی‌ها] هنوز هم می‌خواهند این کار را بکنند و به غرب حمله کنند. در صورتی‌که اگر نگاه کنید این غرب و آمریکاست که همه جا پایگاه دارد و به خاورمیانه و کشورهای دیگر حمله می‌کند.» ولی‌رضا نصر، استاد دانشگاه در آمریکا و از صاحبنظران برجسته مسائل خاورمیانه در آمریکا هم در شبکه ایکس نوشت:‌ «به نظر می‌رسد روبیو در حال ترویج نسخهٔ دوم نظریهٔ &#x27;برخورد تمدن‌ها&#x27;ی ساموئل هانتینگتون است. با این تفاوت که به‌جای برخورد اسلام و غرب، او تقابل تمدنی میان ایران و غرب را مطرح می‌کند. به این ترتیب، عصر اسلام‌هراسی جای خود را به &#x27;ایران‌هراسی&#x27; می‌دهد.» مارکو روبیو در بخشی از سخنرانی خود در آتن گفت: «۴۸۰ سال پیش از میلاد، سپاهیان"}, {"source": "BBC Persian", "title": "وزارت دادگستری آمریکا عملکرد پنج شبکه تلویزیونی را به‌دلیل نحوه پوشش مشترک اخبار ترامپ بررسی می‌کند", "link": "https://www.bbc.com/persian/articles/c6n9rvvv0q0vo?at_medium=RSS&at_campaign=rss", "summary": "وزارت دادگستری ایالات متحده اعلام کرد که در حال بررسی چندین شبکه تلویزیونی است تا ببیند آیا آنها قوانین رقابت فدرال را هنگام بایکوت و تعلیق پوشش خبری مشترک از دونالد ترامپ، رئیس‌جمهور آمریکا، نقض کرده‌اند یا خیر. ماه گذشته، پنج شبکه در واکنش به لغو مجوز خبرنگاران سه شبکه سی‌ان‌ان و ام‌اس ناو و پولیتیکو از سوی دولت دونالد ترامپ، پوشش خبری مربوط به فعالیت‌های رئیس‌جمهور را برای چند روز متوقف کردند.", "date_str": "2026-10-11T11:27:20+00:00", "hash": "c3dc2a0076c37a37", "title_fa": "وزارت دادگستری آمریکا عملکرد پنج شبکه تلویزیونی را به‌دلیل نحوه پوشش مشترک اخبار ترامپ بررسی می‌کند", "summary_fa": "وزارت دادگستری ایالات متحده اعلام کرد که در حال بررسی چندین شبکه تلویزیونی است تا ببیند آیا آنها قوانین رقابت فدرال را هنگام بایکوت و تعلیق پوشش خبری مشترک از دونالد ترامپ، رئیس‌جمهور آمریکا، نقض کرده‌اند یا خیر. ماه گذشته، پنج شبکه در واکنش به لغو مجوز خبرنگاران سه شبکه سی‌ان‌ان و ام‌اس ناو و پولیتیکو از سوی دولت دونالد ترامپ، پوشش خبری مربوط به فعالیت‌های رئیس‌جمهور را برای چند روز متوقف کردند. وزارت دادگستری آمریکا از پنج شبکه سی‌ان‌ان، ای‌بی‌سی، سی‌بی‌اس، فاکس‌نیوز و ان‌بی‌سی خواست تا مکاتبات و مخابرات مربوط به گروه پوشش مشترک را تحویل دهند و گفت که بایکوت و تعلیق آنها می‌تواند «قانون شرمن» را نقض کرده باشد؛ اشاره به قانون «ضدانحصار» است که شرکت‌ها ازجمله رسانه‌ها را از اقدامات تجاری انحصاری منع می‌کند؛ این قانون به‌عنوان شالوده «قوانین ضدانحصار (ضد تراست) و رقابت» ایالات متحده عمل می‌کند. این پنج شبکه سال‌هاست که در چارچوب گروه پوشش تلویزیونی مشترک، کار تصویربرداری و فیلمبرداری از برنامه‌های رئیس‌جمهور آمریکا را میان خود تقسیم می‌کنند، سپس تصاویر آن را در اختیار دیگر رسانه‌ها در سراسر جهان هم قرار می‌دهند. سخنگوی وزارت دادگستری آمریکا گفت: «بخش ضدانحصار صرفا در حال بررسی این است که آیا این سازمان‌های خبری قوانین ضدانحصار را نقض کرده‌اند یا خیر.» این شبکه‌های تلویزیونی هنوز در این مورد اظهارنظری نکرده‌اند. ماه گذشته، دونالد ترامپ سه شبکه سی‌ان‌ان، ام‌اس ناو و پولیتیکو را به نوشتن «جعل و کذب» در مورد تیمش متهم کرد و دسترسی آنها به کاخ سفید را محدود کرد. کاخ سفید بعدتر، پس از حکم قاضی، دسترسی این سه شبکه را دوباره برقرار کرد. این سه رسانه از دولت دونالد ترامپ شکایت کرده بودند و استدلال کردند که دسترسی محدود، حقوق متمم اول قانون اساسی آنها را نقض می‌کند. متمم اول قانون اساسی آمریکا، دولت را از «محدود کردن» آزادی مطبوعات منع می‌کند؛ عنوانی"}, {"source": "BBC Persian", "title": "ترامپ می‌گوید وقت آن رسیده که اوکراین رئیس‌جمهور جدیدی داشته باشد", "link": "https://www.bbc.com/persian/articles/cw1l3pv687q0o?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ، رئیس‌جمهور آمریکا، در واکنش به انتقاد ولودیمیر زلنسکی از توافق آمریکا و روسیه بر سر گازوئیل، اظهار داشت که به نظر او «زمان آن رسیده است که اوکراین رئیس‌جمهور جدیدی داشته باشد.»", "date_str": "2026-10-11T09:47:57+00:00", "hash": "81f8ca2d89e9ccfa", "title_fa": "ترامپ می‌گوید وقت آن رسیده که اوکراین رئیس‌جمهور جدیدی داشته باشد", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا، در واکنش به انتقاد ولودیمیر زلنسکی از توافق آمریکا و روسیه بر سر گازوئیل، اظهار داشت که به نظر او «زمان آن رسیده است که اوکراین رئیس‌جمهور جدیدی داشته باشد.» رئیس‌جمهور اوکراین هشدار داده بود که توافق جدید برای ورود میلیون‌ها تن گازوئیل روسیه به بازار آمریکا، منابع مالی لازم را برای ادامه جنگ علیه کشورش در اختیار مسکو قرار می‌دهد و آن را هدیه‌ای به ولادیمیر پوتین، رئیس‌جمهور روسیه، توصیف کرده بود. آقای ترامپ روز شنبه در مقابل کاخ سفید گفت که زلنسکی با ادامه صدور مجوز برای حمله به پالایشگاه‌های روسیه، «می‌خواهد برای جهان مشکل‌ساز شود.» رئیس‌جمهور آمریکا در ادامه هم گفت که «بهتر است که او دست از این کار بردارد» و سپس پیشنهاد کرد که اوکراین باید «رهبر جدیدی پیدا کند که بتواند توافق کند.» از زمان تهاجم روسیه به اوکراین در سال ۲۰۲۲، این کشور تحت حکومت نظامی بوده و برگزاری انتخابات در آن به حالت تعلیق درآمده است. عرضه جهانی سوخت، از جمله گازوئیل، با آغاز جنگ آمریکا و اسرائیل علیه ایران که منجر به بسته شدن تنگه هرمز شد، به‌شدت محدود شده است. معمولا حدود یک‌ پنجم فرآورده‌های نفتی جهان از تنگه‌ هرمز عبور می‌کند. روسیه از تولیدکنندگان عمده نفت جهان است و اوکراین اخیرا حملات خود به زیرساخت‌های انرژی این کشور را تشدید کرده و روسیه نیز تاسیسات حمل‌ونقل اوکراین را هدف قرار داده که این امر فشار بر بازارهای انرژی را افزایش داده است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. آقای ترامپ در ادامه گفته است: «ما به او گفتیم: هر کاری می‌خواهی با روسیه بکن، اما به پالایشگاه‌ها حمله نکن ، چون این کار مشکلی جهانی ایجاد می‌کند.» رئیس‌جمهور آمریکا سپس ولودیمیر زلنسکی را متهم کرد که نمی‌خواهد با روسیه به توافق"}, {"source": "BBC Persian", "title": "چرا آمریکا پس از نزدیک به یک قرن به اعدام علنی بازمی‌گردد؟", "link": "https://www.bbc.com/persian/articles/c5djvd71e20zo?at_medium=RSS&at_campaign=rss", "summary": "پیت هگست، وزیر دفاع آمریکا، اعلام کرد ارتش نضال حسن را به‌طور علنی اعدام خواهد کرد؛ مردی که در سال‌ ۲۰۰۹ در پایگاه نظامی فورت هود در تگزاس ۱۳ نظامی غیرمسلح همکار خود را کشت.", "date_str": "2026-10-11T04:24:57+00:00", "hash": "80e0557b68d280b8", "title_fa": "چرا آمریکا پس از نزدیک به یک قرن به اعدام علنی بازمی‌گردد؟", "summary_fa": "پیت هگست، وزیر دفاع آمریکا، اعلام کرد ارتش نضال حسن را به‌طور علنی اعدام خواهد کرد؛ مردی که در سال‌ ۲۰۰۹ در پایگاه نظامی فورت هود در تگزاس ۱۳ نظامی غیرمسلح همکار خود را کشت. هزاران نفر از دور و نزدیک آمده بودند. مردان، زنان و کودکان در ساحل رودخانه‌ای در کنتاکی صف کشیده بودند تا اعدام علنی مردی سیاه‌پوست را تماشا کنند که به تجاوز و قتل یک زن بیوه سالمند سفیدپوست محکوم شده بود. ۱۴ اوت ۱۹۳۶ بود، جمعه‌ای بسیار گرم در اوونزبورو، کنتاکی، در میانه یکی از موج‌های گرمای تاریخی آن دوره. بعضی‌ها شب را در نزدیکی چوبه دار گذرانده بودند تا جای خود را از دست ندهند. عده‌ای دیگر شب قبل در مهمانی‌هایی موسوم به «مهمانی کراوات» شرکت کرده بودند؛ اصطلاحی کنایه‌آمیز برای گردهمایی پیش از تماشای اعدام با طناب دار. آن‌ها صبح با خماری ناشی از نوشیدن الکل به محل اعدام آمدند، در حالی که نوجوانان به تماشاگران پاپ‌کورن و نوشابه می‌فروختند. تا ساعت ۵ صبح، زمان اجرای حکم، جمعیت به حدود ۲۰ هزار نفر رسیده بود. در همان زمان، رینی بتیا، یتیمی که در دهه سوم زندگی‌اش بود، به سوی چوبه دار رفت. او پس از آنکه گفته شد به سرقت، تجاوز و قتل لیشیا ادواردز ۷۰ ساله اعتراف کرده است، به اعدام محکوم شده بود. بعدازظهر روز پیش، آخرین غذایش را خورده بود: مرغ سرخ‌شده، گوشت خوک، پوره سیب‌زمینی، خیارشور، نان ذرت، پای لیمو و بستنی. بسیاری از کسانی که آنجا جمع شده بودند، از جمله خبرنگارانی که از شهرهایی به دوری شیکاگو و نیویورک آمده بودند، برای دیدن «جلاد زن» آمده بودند که شایعات زیادی درباره‌اش وجود داشت. کلانتر محلی چهار ماه پیش درگذشته بود و بیوه او به شکلی غیرمنتظره جانشینش شده بود. با این حال، او حاضر نشد خودش اهرم چوبه دار را بکشد و در نهایت جلادان استخدام‌ شده"}, {"source": "BBC Persian", "title": "«سیاره‌ای که در آن متولد شدیم دیگر وجود ندارد»؛ هشدار یک اقلیم‌شناس درباره موج فزاینده پدیده‌های شدید آب‌وهوایی", "link": "https://www.bbc.com/persian/articles/cdj0kj93e27o?at_medium=RSS&at_campaign=rss", "summary": "رائول کوردرو، اقلیم‌شناس اکوادوری، می‌گوید اقلیم و شرایط جوی‌ای که در آن به دنیا آمده‌ایم دیگر وجود ندارند و در آینده‌ای که بتوان تصورش کرد نیز باز نخواهند گشت. او هشدار می‌دهد که جهان با افزایش موج‌های گرما، آتش‌سوزی‌ها، سیل‌ها و دیگر پدیده‌های شدید آب‌وهوایی روبه‌رو است، اما در عین حال معتقد است هنوز می‌توان از وخیم‌تر شدن بحران اقلیمی جلوگیری کرد.", "date_str": "2026-10-11T06:47:01+00:00", "hash": "68888effe09a1d8a", "title_fa": "«سیاره‌ای که در آن متولد شدیم دیگر وجود ندارد»؛ هشدار یک اقلیم‌شناس درباره موج فزاینده پدیده‌های شدید آب‌وهوایی", "summary_fa": "رائول کوردرو، اقلیم‌شناس اکوادوری، می‌گوید اقلیم و شرایط جوی‌ای که در آن به دنیا آمده‌ایم دیگر وجود ندارند و در آینده‌ای که بتوان تصورش کرد نیز باز نخواهند گشت. او هشدار می‌دهد که جهان با افزایش موج‌های گرما، آتش‌سوزی‌ها، سیل‌ها و دیگر پدیده‌های شدید آب‌وهوایی روبه‌رو است، اما در عین حال معتقد است هنوز می‌توان از وخیم‌تر شدن بحران اقلیمی جلوگیری کرد. کوردرو که سال‌ها در شیلی فعالیت کرده و پژوهش‌های متعددی در جنوبگان انجام داده است، می‌گوید از موج‌های گرما و آتش‌سوزی گرفته تا سیل‌های ویرانگر، جهان با افزایش رویدادهای حدی آب‌وهوایی م رک، برگزار شده بود، گفت که در کنار جنگ روسیه و اوکراین، موضوع ایران نیز از پرونده‌هایی است که قصد دارد آن را «حل‌وفصل کند یا ببرد.» رئیس جمهور آمریکا با اشاره به برنامه هسته‌ای ایران گفت که آمریکا ناچار شده است «مسیرش را تغییر دهد تا توان هسته‌ای را از یک کشور دیوانه بگیرد.» او افزود: «آن‌ها یک کشور دیوانه‌اند. خودشان هم این را می‌دانند. من همیشه به خودشان می‌گویم؛ می‌گویم شما واقعاً دیوانه‌اید.» رئیس‌جمهور آمریکا در بخش دیگری از سخنانش ایران را «کشور شماره یک تروریسم» خواند و گفت: «نمی‌شود به آنها سلاح هسته‌ای داد. بدون تردید از آن استفاده خواهند کرد.» ایران همواره تلاش برای ساخت سلاح هسته‌ای را رد کرده و می‌گوید که برنامه هسته‌ای‌اش اهداف صلح‌آمیز دارد. آقای ترامپ همچنین مدعی شد که مقام‌های ایران پیشتر با لحنی تهدیدآمیز از «کشتن همه» سخن می‌گفتند و گروهی نیز در پس‌زمینه شعارهای مذهبی سر می‌دادند. او گفت: «البته دیگر این‌طور حرف نمی‌زنند.» او افزود ممکن است ایران پیش از انتخابات میان‌دوره‌ای آمریکا «چند اقدام اضافی» انجام دهد، چون به گفته او تصور می‌کند چنین اقداماتی به جمهوری‌خواهان آسیب خواهد زد. آقای ترامپ سپس گفت: «ما می‌توانیم خیلی سریع به این ماجرا پایان بدهیم.» او همچنین دو بار تأکید کرد که مقام‌های ایران نمی‌دانند او تا چه اندازه با آنها «مدارا» کرده است. دونالد ترامپ همچنین بار دیگر گفت که در فکر تغییر نام تنگه هرمز به «تنگه ترامپ» است؛ ایده‌ای که پیشتر نیز در اظهاراتش درباره ایران و این آبراه راهبردی مطرح کرده بود."}, {"source": "BBC Persian", "title": "استقرار هزاران نیروی امنیتی در دهلی‌نو، رهبر «حزب مردمی سوسک» آزاد شد", "link": "https://www.bbc.com/persian/articles/cwp9gxm21r1ko?at_medium=RSS&at_campaign=rss", "summary": "به دنبال دعوت حزب بانفوذ «سوسک» در هند برای تظاهراتی گسترده، بخش‌هایی از دهلی‌نو با حضور نیروهای دولتی، چهره امنیتی به خود گرفته است. وکیل آبجیت دیپکه، رهبر این حزب از آزادی او و دو نفر از رهبران ارشد این جنبش خبر داد.", "date_str": "2026-10-11T04:49:15+00:00", "hash": "c85abd1d93c74ad1", "title_fa": "استقرار هزاران نیروی امنیتی در دهلی‌نو، رهبر «حزب مردمی سوسک» آزاد شد", "summary_fa": "به دنبال دعوت حزب بانفوذ «سوسک» در هند برای تظاهراتی گسترده، بخش‌هایی از دهلی‌نو با حضور نیروهای دولتی، چهره امنیتی به خود گرفته است. وکیل آبجیت دیپکه، رهبر این حزب از آزادی او و دو نفر از رهبران ارشد این جنبش خبر داد. وکیل آبجیت دیپکه، رهبر و بنیانگذار حزب «سوسک» صبح یکشنبه در پستی در شبکه اجتماعی ایکس، از آزادی او و دو تن دیگر از رهبران ارشد این جنبش خبر داد. پیشتر پلیس آبجیت دیپکه را که برای شرکت در راهپیمایی با هواپیما وارد پایتخت هند شدند بازداشت کرده است. ده‌ها هزار نیروی امنیتی و پلیس در دهلی‌نو مستقر شده‌اند و رفت‌وآمد در پایتخت تحت تاثیر قرار گرفته است. «سوسک» جنبشی است که که نسل زد، بیکاران و فقرا را نمایندگی می‌کند و رهبرش گفته بود راهپیمایی امروز «به هر قیمتی که شده» انجام می‌شود. او همچنین در پیامی در ایکس خطاب به نارندرا مودی، نخست‌وزیر هند، نوشته بود: «اگر می‌خواهید ما را زندانی کنید یا حتی به ما شلیک کنید، ما آماده‌ایم.» پلیس و نیروهای امنیتی سعی دارند مانع از تجمع معترضان در نقاط خاصی از دهلی شوند. برخی قطارها به مقصد دهلی‌نو لغو، ده‌ها ایستگاه مترو تعطیل و موبایل و اینترنت مختل شده‌اند. معترضان خواستار اصلاحات انتخابات و استعفای گیانش کومار، کمیسر ارشد انتخابات هند، هستند. آنها کمیسیون انتخابات را به دستکاری در فهرست رأی‌دهندگان متهم می‌کنند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. این تظاهرات چند ماه پس از آن برگزار می‌شود که این جنبش در اوایل تابستان هزاران جوان را به خیابان‌های دهلی کشاند که به درگیری‌های خشونت‌آمیز با پلیس انجامید و وزیر آموزش هند را وادار به استعفا کرد. پلیس می‌گوید با برگزاری تجمع امروز موافقت نکرده است. تمام جاده‌های مسیرهای منتهی به محل اصلی برگزاری اعتراض‌ها، با موانع فلزی"}, {"source": "BBC Persian", "title": "گروهی که با یک نظام مالی چند صد ساله، صدها میلیون یورو برای مجرمان پول‌شویی می‌کرد", "link": "https://www.bbc.com/persian/articles/c6n8md511lvpo?at_medium=RSS&at_campaign=rss", "summary": "تحقیقات مشترک چند رسانه اروپایی نشان می‌دهد یک گروه چت در واتس‌اپ برای پول‌شویی صدها میلیون یورو پول نقد در سراسر جهان به کار گرفته شده و بدون برجا گذاشتن ردپایی مکتوب، منابع مالی جرایم سازما /persian/articles/cxnv0q9vvj64o?at_medium=RSS&at_campaign=rss", "summary": "دونالد ترامپ در حالی که با پیامدهای سیاسی جنگ ایران و افزایش قیمت سوخت در آستانه انتخابات میان‌دوره‌ای روبه‌روست، از توافقی با ولادیمیر پوتین برای عرضه صدها هزار تن دیزل روسیه به بازار آمریکا خبر داده؛ توافقی که منتقدان آن را چرخشی چشمگیر در سیاست واشنگتن در قبال مسکو توصیف می‌کنند.", "date_str": "2026-10-10T18:00:45+00:00", "hash": "577767832e82281f", "title_fa": "توافق غافلگیرکننده ترامپ با روسیه، نشانه فشار فزاینده برای مهار قیمت سوخت است", "summary_fa": "دونالد ترامپ در حالی که با پیامدهای سیاسی جنگ ایران و افزایش قیمت سوخت در آستانه انتخابات میان‌دوره‌ای روبه‌روست، از توافقی با ولادیمیر پوتین برای عرضه صدها هزار تن دیزل روسیه به بازار آمریکا خبر داده؛ توافقی که منتقدان آن را چرخشی چشمگیر در سیاست واشنگتن در قبال مسکو توصیف می‌کنند. تصمیم دونالد ترامپ برای واردات سوخت روسیه به آمریکا، چرخشی چشمگیر در موضع رئیس‌جمهور به شمار می‌رود. تنها سه هفته پیش، ترامپ قانونی را امضا کرد که اجازه می‌داد آمریکا تحریم‌ها و تعرفه‌های تازه‌ای علیه کشورهایی اعمال کند که نفت و گاز روسیه وارد می‌کنند. اکنون ترامپ می‌گوید ولادیمیر پوتین، رئیس‌جمهور روسیه، موافقت کرده است در ماه‌های آینده صدها هزار تن سوخت دیزل به آمریکا و بازارهای جهانی عرضه کند. این توافق در حالی صورت گرفته که ترامپ همچنان با پیامدهای سیاسی جنگ ایران و تاثیر آن بر قیمت جهانی انرژی دست‌وپنجه نرم می‌کند؛ آن هم تنها چند هفته پیش از آن‌که رای‌دهندگان آمریکایی برای انتخابات میان‌دوره‌ای پای صندوق‌های رای بروند. با جهش شدید قیمت سوخت در آمریکا، مقبولیت ترامپ در میان افکار عمومی کاهش یافته است؛ مردمی که هم از افزایش قیمت در پمپ‌بنزین‌ها آسیب دیده‌اند و هم از پیامدهای آن که به تورم گسترده در سراسر اقتصاد منجر شده است. فشار ناشی از جنگ به‌ویژه در ایالت‌های کشاورزی آمریکا به‌شدت احساس شده است؛ ایالت‌هایی که برای به کار انداختن ماشین‌آلات کشاورزی و انتقال محصولات به بازار وابستگی زیادی به سوخت دیزل دارند. همین ایالت‌ها، از جمله آیووا، کانزاس، تگزاس و اوهایو، به میدان‌های سیاسی غیرمنتظره‌ای در انتخابات پیش رو تبدیل شده‌اند؛ انتخاباتی که مشخص خواهد کرد آیا جمهوری‌خواهان کنترل کنگره را حفظ می‌کنند یا نه ۱۴ مهر ۱۴۰۵ - ۶ اکتبر ۲۰۲۶ چرا توافق با ایران می‌تواند به سود ترامپ باشد؟ ۷ مهر ۱۴۰۵ - ۲۹ سپتامبر ۲۰۲۶ چرا جمهوری‌خواهان آمریکا از جنگ ترامپ با ایران فاصله"}, {"source": "BBC Persian", "title": "راست و چپ آمریکای لاتین، انتخابات برزیل را شاخصی برای آینده سیاسی منطقه می‌دانند", "link": "https://www.bbc.com/persian/articles/cqj34emgmnlyo?at_medium=RSS&at_campaign=rss", "summary": "رهبران و دولت‌های راست‌گرای آمریکای لاتین از عملکرد قدرتمند فلاویو بولسونارو در انتخابات ریاست‌جمهوری برزیل در ۴ اکتبر ۲۰۲۶ استقبال کردند. برخی مفسران این نتیجه را عاملی برای تقویت موج راست‌گرایی و نزدیکی بیشتر کشورهای منطقه به آمریکا دانستند.", "date_str": "2026-10-10T23:04:01+00:00", "hash": "ae13cb76b17de747", "title_fa": "راست و چپ آمریکای لاتین، انتخابات برزیل را شاخصی برای آینده سیاسی منطقه می‌دانند", "summary_fa": "رهبران و دولت‌های راست‌گرای آمریکای لاتین از عملکرد قدرتمند فلاویو بولسونارو در انتخابات ریاست‌جمهوری برزیل در ۴ اکتبر ۲۰۲۶ استقبال کردند. برخی مفسران این نتیجه را عاملی برای تقویت موج راست‌گرایی و نزدیکی بیشتر کشورهای منطقه به آمریکا دانستند. همزمان، تحلیلگران پیامدهای این چرخش سیاسی را برای کشورهایی مانند مکزیک و اروگوئه، که همچنان دولت‌های چپ‌گرای منتخب بر سر کار دارند، بررسی کردند. خاویر میلی، رئیس‌جمهور راست‌گرای آرژانتین، از نخستین رهبرانی بود که از موفقیت بولسونارو در دور نخست استقبال کرد و در شبکه‌های اجتماعی نوشت: «آزادی در برزیل به پیش می‌رود.» یک تحلیلگر آرژانتینی نیز گفت آمریکای لاتین «هرگز تا این اندازه با واشنگتن همسو نبوده است». مفسران رسانه‌ای در منطقه این نتیجه را عاملی می‌دانند که می‌تواند به چرخش سیاسی محافظه‌کارانه در منطقه، که از اتحاد با دولت دونالد ترامپ در آمریکا حمایت می‌کند، شتاب بیشتری بدهد. هم‌زمان، تحلیلگران پیامدهای چرخش محسوس منطقه به راست را برای کشورهایی مانند مکزیک و اروگوئه بررسی کردند که همچنان دولت‌های منتخب دموکراتیک چپ‌گرا دارند. رهبران این کشورها، مانند لوئیس ایناسیو لولا دا سیلوا، رئیس‌جمهور مستقر برزیل، در درجات مختلف علنا با «دکترین دونرو» ترامپ، که بر «برتری» آمریکا در نیمکره غربی ن، جذب هدف، و تایپ کردن آن با دانش سازمانی یک گام"}, {"source": "TechCrunch AI", "title": "Microsoft’s Satya Nadella says AI models need an ‘emergency brake’", "link": "https://techcrunch.com/2026/10/10/microsofts-satya-nadella-says-ai-models-need-an-emergency-brake/", "summary": "In a Saturday morning post, Microsoft's CEO wrote that it’s time “to step back and assess the trust architecture” of AI.", "date_str": "2026-10-10T21:47:51+00:00", "hash": "b4092ba9bd5f28b2", "title_fa": "ساتیا نادلا از مایکروسافت می گوید مدل های هوش مصنوعی به ترمز اضطراری نیاز دارند", "summary_fa": "مدیر عامل مایکروسافت در یک پست صبح شنبه نوشت که زمان آن فرا رسیده است که «به عقب برگردیم و معماری اعتماد» هوش مصنوعی را ارزیابی کنیم. ساتیا نادلا، مدیر عامل مایکروسافت، آخرین مدیر فنی است که افکار طولانی در مورد چگونگی بهبود ایمنی هوش مصنوعی ارائه کرده است. نادلا با استفاده از اصطلاح ترجیحی دولت ترامپ برای هوش مصنوعی نوشت: «ما نمی‌توانیم ابر هوش را به عنوان مجموعه‌ای از جعبه‌های سیاه تودرتو در نظر بگیریم و به سادگی توصیه‌ها، پاسخ‌ها و اقدامات آن را بپذیریم یا رد کنیم. همانطور که توسط نادلا بیان شد، این رویکرد \"به معنای جدا کردن مدل از مهاری است که کار آن را هماهنگ می کند\" و همچنین \"برونی سازی کنترل ها و پادمان ها\". او همچنین خواستار این شد که «هر اقدام مدل معنادار» با «شواهد قابل خواندن انسان ضد دستکاری» مستند شود، و برای سیستم‌هایی که «یک فرد مجاز» همیشه توانایی «مکث کردن یا خاموش کردن یک مدل در میان کار» را دارد. او گفت: «ما باید فرض کنیم که یک مدل به خطر افتاده است و از همان ابتدا آن را مهار کنیم. \"به آن مانند یک ترمز اضطراری فکر کنید.\" اظهارات نادلا در حالی بیان می شود که شرکت های پیشرو هوش مصنوعی به اتفاقات بیشتری اذعان می کنند که به نظر می رسید کنترل مدل های خود را از دست می دهند، و پس از آن که داریو آمودی، مدیر عامل آنتروپیک، طرحی را برای توسعه هوش مصنوعی محتاطانه تر منتشر کرد. 50% تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس خود را دریافت کنید و یک همکار، شریک یا همتای خود را با 50 درصد تخفیف بیاورید. با ایجاد ارتباطات، ایجاد شتاب و کشف آنچه در  "title": "US’s Reagan-era economic promises return as Trump’s AI-fueled growth fantasy", "link": "https://www.theguardian.com/business/2026/oct/11/trump-ai-economy-reagan", "summary": "‘Even if AI supercharged the economy, its impact on the government’s finances would be muted’ Back through political history to the age of Ronald Reagan , Republicans have repeatedly promised the US public that tax cuts would pay for themselves, firing up economic growth and filling the government’s coffers. The promise never really panned out. From the Gipper’s day on, the Republicans’ tax cuts inevitably increased the budget deficit. Despite its failure, though, the promise is back, coated in a fine new layer of artificial intelligence pixie dust. It will fail again. Continue reading...", "date_str": "2026-10-11T11:00:25+00:00", "hash": "f9e4eea09c2aca23", "title_fa": "وعده های اقتصادی دوران ریگان ایالات متحده به عنوان فانتزی رشد ترامپ با هوش مصنوعی بازمی گردد", "summary_fa": "«حتی اگر هوش مصنوعی اقتصاد را تقویت کند، تأثیر آن بر امور مالی دولت خاموش می‌شود» جمهوری‌خواهان در تاریخ سیاسی تا عصر رونالد ریگان بارها به مردم ایالات متحده قول داده‌اند که کاهش مالیات هزینه‌های خود را جبران می‌کند، رشد اقتصادی را افزایش می‌دهد و خزانه‌های دولت را پر می‌کند. این وعده هرگز عملی نشد. از روز جیپر به بعد، کاهش مالیات جمهوری خواهان به ناچار کسری بودجه را افزایش داد. با وجود شکست، وعده بازگشته است، با لایه جدیدی از گرد و غبار هوش مصنوعی پوشیده شده است. دوباره شکست خواهد خورد. به خواندن ادامه دهید... وزیر خزانه داری، اسکات بسنت، زمانی که قول می دهد رشد اقتصادی سالانه 3 درصد را به ارمغان بیاورد، بر اقتصاد مبتنی بر هوش مصنوعی تکیه می کند - نرخی که به جز بازگشت از همه گیری کووید، تنها دو بار در این قرن به دست آمده است. رویاهای هوش مصنوعی فانتزی دونالد ترامپ را تحت تأثیر قرار می‌دهد که «ما با سرعتی سریع‌تر از قبل رشد می‌کنیم»، که به دولت این امکان را می‌دهد تا «در یک دوره زمانی از ۴۰ تریلیون» بدهی فدرال مراقبت کند. با این حال، بازارهای مالی خرید نمی کنند. هفته گذشته، بازدهی اوراق قرضه خزانه داری 10 ساله به بالاترین حد خود در یک ربع قرن گذشته رسید، بیش از یک درصد کامل بیشتر از زمانی که ترامپ جنگ نادرست خود را علیه ایران آغاز کرد. تاثیر تورمی جنگ، فوری ترین علت افزایش بازده اوراق قرضه است. قبلاً فدرال رزرو را متقاعد کرده بود که نرخ بهره کوتاه مدت را افزایش دهد. اما بازار خزانه داری نیز به دلیل نامتوازن مالی ایالات متحده در حال محاصره است. هیچ مسیر واقعی برای رشد اقتصادی برای ایجاد درآمدهای مالیاتی مورد نیاز برای رفع کسری بودجه عظیم و رو به رشد ایالات متحده وجود ندارد. سرمایه گذاران برای پوشش شکاف"}, {"source": "The Guardian AI", "title": "Fixated on AI, the world has forgotten what is staring it in the face: nuclear annihilation | Simon Tisdall", "link": "https://www.theguardian.com/commentisfree/2026/oct/11/ai-annihilation-advanced-nuclear-weapons", "summary": "This is no scoffing matter. The accelerating proliferation of advanced nuclear weapons is bringing ‘end times’ closer by the day Humankind has fearfully and sometimes joyfully anticipated the end of the world ever since it began. The Bible’s Book of Revelation speaks of “end times”, a period of tribulation, war, famine, plague, floods and environmental catastrophe that may seem a less absurd prospect today than perhaps it once did. Islam, too, posits a fateful day of judgment or day of reckoning. Christian evangelicals believe that, in the final rapture, a chosen few – the righteous or the “elect” – will be saved while sinners burn. It’s a minority view. Matthew’s gospel predicts most people will defy, ignore or ridicule warnings of imminent Armageddon. Peter, another of Jesus’s disciples, agreed: “In the last days, scoffers will come, scoffing and following their own evil desires.” Yet such worldly scepticism does not mean a universal cataclysm is less likely. It may make it more probable. Donald Trump’s blanket denials of the dangers ostensibly posed by artificial intelligence, whose uncontrolled development is seen by some as the latest harbinger of apocalypse , could be interpreted as fulfilling Peter’s prophecy. This US president, the nearest thing the world has to a one-man doomsday machine, is a great one for scoffing and evil desires. In Robert Harris’s 2019 novel, The Second Sleep, a worried scientist lists half a dozen ways the world might end. They include devastating climate change, pandemic disease, a giant asteroid collision with Earth, or some other overwhelming calamity. Few heed the fictional scientist’s fears. In the event, what destroys him and almost everybody else is a disturbingly plausible cyber crash – a global digital and internet meltdown. Simon Tisdall is a Guardian foreign affairs commentator Continue reading...", "date_str": "2026-10-11T09:00:22+00:00", "hash": "22dd70c7316ea563", "title_fa": "با تثبیت هوش مصنوعی، جهان فراموش کرده است که چه چیزی به آن خیره شده است: نابودی هسته ای | سیمون تیسدال", "summary_fa": "این موضوع تمسخر نیست گسترش روزافزون تسلیحات هسته‌ای پیشرفته روز به روز «آخرین زمان» را نزدیک‌تر می‌کند، روزی که بشریت از زمان آغاز جهان با ترس و گاهی اوقات با شادی پایان جهان را پیش‌بینی کرده است. کتاب مکاشفه کتاب مقدس از «آخرین زمان» صحبت می‌کند، دوره‌ای از مصیبت، جنگ، قحطی، طاعون، سیل و فاجعه زیست‌محیطی که ممکن است امروز دورنمای کمتری پوچ به نظر برسد. اسلام نیز روزی سرنوشت ساز برای قیامت یا روز حساب قرار داده است. انجیلیان مسیحی بر این باورند که در رستاخیز نهایی، تعداد معدودی برگزیده - صالحان یا \"برگزیدگان\" - نجات خواهند یافت در حالی که گناهکاران می سوزند. این یک دیدگاه اقلیت است. انجیل متی پیش‌بینی می‌کند که بیشتر مردم هشدارهای هارماگدون قریب‌الوقوع را نادیده می‌گیرند یا به تمسخر می‌گیرند. پطرس، یکی دیگر از شاگردان عیسی، موافقت کرد: «در روزهای آخر، استهزاگرانی خواهند آمد که تمسخر می‌کنند و از امیال شیطانی خود پیروی می‌کنند.» با این حال، چنین بدبینی دنیوی به این معنا نیست که احتمال وقوع یک فاجعه جهانی کمتر است. ممکن است احتمال آن را بیشتر کند. انکار آشکار خطرات ظاهراً هوش مصنوعی توسط دونالد ترامپ، که توسعه کنترل نشده آن از نظر برخی به عنوان آخرین منادی آخرالزمان است، می تواند به عنوان تحقق پیشگویی پیتر تعبیر شود. این رئیس‌جمهور ود استفاده خواهد کرد که به مشتریان اجازه می‌دهد نرم‌افزاری را در شبکه Cloudflare بسازند و اجرا کنند. (Varda مهندس اصلی برای Cloudflare Workers است.) Deno - که توسط برت بلدر و خالق Node.js Ryan Dahl تأسیس شد - اخیراً celld را راه‌اندازی کرد که یک پیاده‌سازی متن باز از Workers است که واردا نوشت که تیم Cloudflare را \"خوشحال\" کرد. واردا استدلال کرد که برخلاف «یک تئوری رایج» که شرکت «کارگران Cloudflare را با سایر پلتفرم‌های ابری متفاوت از سایر پلتفرم‌های ابری کار می‌کنند تا «قفل کردن» ایجاد کنند، این شرکت معتقد است «متن‌باز بودن و دادن یک دریچه فرار به مردم کار خوبی است». در همین حال، دال نوشت که تیم او به Cloudflare می‌پیوندد تا مدل برنامه‌نویسی Workers را به یک روش اصلی برای ساخت سرور تبدیل کند. شرایط مالی خرید فاش نشده است. دنو در مجموع 26 میلیون دلار از جمله سری A به رهبری سکویا جمع آوری کرده بود. 50% تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس خود را دریافت کنید و یک همکار، شریک یا همتای خود را با 50 درصد تخفیف بیاورید. با ایجاد ارتباطات، ایجاد شتاب و کشف آنچه در اکوسیستم استارتاپی در آینده وجود دارد، زمینه بیشتری را پوشش دهید. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است."}, {"source": "Wired", "title": "I Made Terrible Games With Google’s AI Playground", "link": "https://www.wired.com/story/i-made-terrible-games-with-googles-ai-playground/", "summary": "A long day’s haul in the video game slop mines.", "date_str": "2026-10-11T11:30:00+00:00", "hash": "84cc14e10d443d4f", "title_fa": "من بازی های وحشتناکی را با زمین بازی هوش مصنوعی گوگل ساختم", "summary_fa": "Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان نئون دان واقعاً از دست وکیل همسر سابقش عصبانی است. او هر فرصتی را که به دست بیاورد به شما خواهد گفت، در حالی که او در حال تیراندازی به خطوطی از افراد بد پیکسلی است. او همچنین واقعی نیست - شباهت او فقط برای چند دقیقه در یک بازی تیراندازی به سبک سایبرپانک از بالا وجود داشته ا
