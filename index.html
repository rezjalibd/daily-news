<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۵ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۵ آذر ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۲۶ November ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۸:۴۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">

      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۱۸</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۱۷</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

      media: [{"source": "Billboard", "title": "The Chicks & Willie Colón Join AI Music Lawsuit Against Suno: ‘Misappropriated Identities’", "link": "https://www.billboard.com/pro/the-chicks-willie-colon-join-ai-music-lawsuit-against-suno/", "summary": "The Chicks , Willie Colón and Sam Moore are joining the legal fight against AI music. The trio of acts and their estates were among a slew of artists added Tuesday (Nov. 24) to a case filed this summer against Suno, accusing the AI song generator of breaking the law by allowing users to “conjure up a beloved musician’s identity” when they enter a name as a prompt. Related Suno, Anthropic Face $1B Copyright Lawsuits From Round Hill Music Over AI Training Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Rod Wave Indicted on Drug Gun Charges for Items Allegedly Found in Car After Speeding Stop The case, filed by Jason Isbell , was a novel action centered on artists’ likeness rights, unlike earlier lawsuits over AI labs using copyrighted music to train models. Now, that case is backed by the star power of a huge country trio, a Latin music titan and an R B legend. “Suno built and trained a model to index musicians by name,” lawyers for the artists write. “It encoded musicians’ identities into its AI model to create its commercial product without consent, and now exploits those identities by publicly using musicians’ names to Suno’s considerable commercial benefit.” In addition to the members of the Chicks (Natalie Maines, Martie Maguire and Emily Strayer) and the estates of the late Colón and Moore, the lawsuit was also joined by 10 more artists, including David Longstreth of the indie rock band Dirty Projectors; Carl Craig, a pioneering DJ of Detroit techno; Franz Nicolay of rock band The Hold Steady; and Kealiʻi Reichel, a top Hawaiian music artist. Artists as big as Madonna and SZA have spoken out against AI music , and dozens of stars like Billie Eilish, Katy Perry, Luis Fonsi and the estates of Bob Marley and Frank Sinatra joined an open letter in 2024 calling unlicensed music AI an “assault on human creativity” that “must be stopped.” But few have taken actual legal action. An indie country singer named Tony Justice is litigating a class action against Suno, and Isbell’s case was joined by Camper Van Beethoven frontman David Lowery and a handful of others. The biggest case yet came from the owners of Elvis Presley’s intellectual property, who launched landmark cases against Suno and Anthropic this fall. The Chicks, who have a long history of outspoken advocacy , represent by far the biggest living musical act to yet sue over AI. More artists could be added to the case in the future, and since the case was filed a", "date_str": "2026-11-25T15:07:33+00:00", "hash": "eadeb591fbc8b28a", "title_fa": "The Chicks & Willie Colón به شکایت موسیقی هوش مصنوعی علیه Suno می پیوندند: «هویت های اختلاس شده»", "summary_fa": "The Chicks، Willie Colón و Sam Moore در حال پیوستن به مبارزه قانونی علیه موسیقی هوش مصنوعی هستند. این سه بازیگر و دارایی‌های آن‌ها از جمله هنرمندانی بودند که سه شنبه (24 نوامبر) به پرونده‌ای که تابستان امسال علیه سونو تشکیل شده بود، اضافه شدند و تولیدکننده آهنگ هوش مصنوعی را متهم به نقض قانون می‌کند و به کاربران اجازه می‌دهد «هویت یک موسیقیدان محبوب را تداعی کنند» وقتی نامی را به عنوان درخواست وارد می‌کنند. Suno مرتبط، صورت Anthropic $ 1B شکایت حق نسخه برداری از موسیقی Round Hill به دلیل آموزش هوش مصنوعی کریس براون موافقت کرد که در حال حاضر حمایت از کودکان را افزایش دهد تا Diamond در Bitter Custdy Fight Rod Wave متهم به اتهامات اسلحه مواد مخدر برای اقلامی که گفته می شود در ماشین پیدا شده است پس از توقف سرعت، هنرمند در مرکز رسیدگی قرار گرفت. حق تشبیه، بر خلاف دعاوی قبلی در مورد آزمایشگاه های هوش مصنوعی که از موسیقی دارای حق چاپ برای آموزش مدل ها استفاده می کردند. اکنون، این مورد توسط قدرت ستاره یک سه کانتری بزرگ، یک تایتان موسیقی لاتین و یک افسانه RB پشتیبانی می شود. وکلای هنرمندان می نویسند: «سونو مدلی ساخت و آموزش داد تا نوازندگان را با نام فهرست کند. این شرکت هویت نوازندگان را در مدل هوش مصنوعی خود کدگذاری کرد تا محصول تجاری خود را بدون رضایت ایجاد کند، و اکنون از این هویت ها با استفاده عمومی از نام نوازندگان به نفع تجاری قابل توجه سونو سوء استفاده می کند. علاوه بر اعضای چیکس (ناتالی مینز، مارتی مگوایر و امیلی استریر) و املاک کولون و مور فقید، 10 هنرمند دیگر نیز به این دعوی پیوستند، از جمله دیوید لانگسترث از گروه راک مستقل Dirty Projectors. کارل کریگ، دی جی پیشگام تکنو دیترویت؛ فرانتس نیکولای از گروه راک The Hold Steady.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/P1071SQD-e1790825148246.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "موسیقی"], "datetime_fa": "۴ آذر • ۱۸:۳۷"}, {"source": "Rolling Stone", "title": "Thank You, Jensen Huang", "link": "https://www.rollingstone.com/politics/political-commentary/trump-jensen-huang-why-congress-should-investigate-1235664112/", "summary": "Trump’s reinstatement of the Nvidia chairman after a spy-sex scandal may finally force Congress to do the unexpected: its job", "date_str": "2026-11-25T15:04:37+00:00", "hash": "73f279c2fea3df06", "title_fa": "متشکرم جنسن هوانگ", "summary_fa": "بازگرداندن رئیس انویدیا توسط ترامپ پس از یک رسوایی جنسی-جاسوسی ممکن است در نهایت کنگره را مجبور به انجام کارهای غیرمنتظره کند: وظیفه اش حتی اگر فردی زندگی طولانی و متهورانه ای پر از ماجراجویی و اشتیاق داشته باشد، بعید است که فعالیت های جنسی او به پیوند یک بحران ژئوپلیتیک تبدیل شود، چه برسد به نقطه عطف دموکراسی آمریکا در انجام یک ترفند. یکی از آزاردهنده‌ترین ویژگی‌های زندگی مدرن، طنین آن با دوره قبلی آمریکاست، عصر طلایی که در آن زندگی کثیف سرمایه‌داران و دلالان قدرت صرفاً خوراک روزنامه‌نگاری نبود، بلکه دلایل دائمی نگرانی برای امنیت ملی بود. در 12 نوامبر، جنسن هوانگ، بنیانگذار میلیاردر سازنده نیمه هادی انویدیا، پس از اعتراف به چندین رابطه خارج از ازدواج - از جمله یکی از آنها با یک تبعه چینی مظنون به همکاری با مقامات اطلاعاتی در کشورش، از سمت مدیرعاملی شرکتی که خود ایجاد کرده بود، استعفا داد. این ماجرا به ویژه برای مقا زی تلویزیون جردن تلویزیون افلک خود مکرراً فیلم‌های تجاری را از Artists Equity کارگردانی می‌کند. VPand CMO Garth Knutson. \"هر سال، میلیون ها آمریکایی به نمایندگان Aflac و متخصصان منابع انسانی مراجعه می کنند تا به آنها کمک کنند تا مزایای آنها را درک کنند و تصمیمات آگاهانه ای در مورد پوشش آنها بگیرند. در این تبلیغات، بن این کار را به مدت 60 ثانیه انجام می دهد. آنها هر روز این کار را انجام می دهند.» براندون پیرس، رئیس مشترک و ECD استودیوی برند Artists Equity اضافه کرد، همانطور که ما پیوند بین Aflac Duck و Affleck Human را بررسی کردیم، مشخص شد که باید به مخاطبان نشان دهیم که بن در حال به دست آوردن درک عمیق تری از Aflac و نماد برند آن است. و چه راه بهتری برای اثبات آن از طریق یک", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Ben-Negotiation-Team.jpg?crop=0px%2C240px%2C8192px%2C4584px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "سینما", "بورس و طلا"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Hollywood Reporter", "title": "Mindy Kaling Will Be Honored With The Hollywood Reporter’s Equity in Entertainment Award at Women in Entertainment Gala", "link": "https://www.hollywoodreporter.com/business/business-news/mindy-kaling-hollywood-reporter-equity-entertainment-award-1236762197/", "summary": "Maitreyi Ramakrishnan is set to present Kaling with the award at the Los Angeles event, which is presented by founding sponsor Lifetime and title sponsor Lilly. Mary Beth Barone will open the program.", "date_str": "2026-11-25T15:00:00+00:00", "hash": "45348e64e444e1e1", "title_fa": "میندی کالینگ با جایزه حقوقی هالیوود ریپورتر در نمایشگاه زنان در اینترتینمنت گالا مفتخر خواهد شد.", "summary_fa": "Maitreyi Ramakrishnan قرار است این جایزه را در رویداد لس آنجلس به کالینگ اهدا کند، جایزه ای که توسط موسس لایف تایم و حامی عنوان لیلی اهدا می شود. مری بث بارون برنامه را باز خواهد کرد. هالیوود ریپورتر روز چهارشنبه اعلام کرد که میندی کالینگ نویسنده، کارگردان، بازیگر و تهیه کننده برنده جایزه جایزه Equity in Entertainment امسال را در مراسم جشن صبحانه سالانه زنان در سرگرمی در لس آنجلس دریافت خواهد کرد. بازیگر Maitreyi Ramakrishnan که در سریال پرطرفدار نتفلیکس Never Have Iver به کالینگ بازی کرد، این جایزه را به کالینگ اهدا خواهد کرد. کالینگ به تیلور سویفت می‌پیوندد که هالیوود ریپورتر قبلاً اعلام کرده بود که جایزه رهبری شری لنسینگ را به عنوان مفتخر در مراسم جشن امسال دریافت می‌کند. خبرهای مرتبط اخبار عمومی تیلور سوئیفت با جایزه رهبری شری لنسینگ هالیوود ریپورتر در مراسم زنان در سرگرمی تجلیل خواهد شد. لیلی لینا پولیمی، مدیر ارشد بازاریابی – مصرف کننده در Eli Lilly and Company، نکاتی را در مورد تقاطع مهم سلامت و سرگرمی به اشتراک خواهد گذاشت. جایزه Equity in Entertainment به افرادی می پردازد که صدای جوامعی را که کمتر در صنعت سرگرمی حضور دارند تقویت می کنند. این جایزه در سال 2016 ایجاد شد و جنیفر لوپز، سلنا گومز، کری واشنگتن، عیسی رای، رایان مورفی، امی پاسکال و نینا جاکوبسون از جمله برگزیدگان قبلی بودند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Mindy-Kaling-Photo-by-Ari-Michelson-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Hollywood Reporter", "title": "Gotham Film & Media Institute Names 2026 Winners of Focus Features Student Short Film Showcase (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/2026-gotham-film-media-institute-focus-student-short-films-1236762790/", "summary": "The five winners will each receive a cash grant and have the opportunity for their short to be shown on Focus Features' digital streaming platform.", "date_str": "2026-11-25T15:00:00+00:00", "hash": "a0f25074eb0dd9a1", "title_fa": "موسسه فیلم و رسانه گاتهام برندگان 2026 نمایشگاه فیلم کوتاه دانشجویی Focus Features را نام برد (اختصاصی)", "summary_fa": "پنج برنده هر کدام یک کمک هزینه نقدی دریافت خواهند کرد و فرصتی برای نمایش کوتاه خود در پلتفرم پخش دیجیتالی Focus Features خواهند داشت. موسسه رسانه فیلم گاتهام برندگان نمایشگاه فیلم کوتاه دانشجویی فوکوس فیچرز ۲۰۲۶ خود را انتخاب کرده است. پنج برنده این برنامه که با مشارکت Decentralized Pictures ارائه شده‌اند، آنا آلپیزار از دانشگاه نیویورک، شیله لیو از CalArts، نیکلاس پالاسیو از کالج شهر نیویورک، راویا رسول از کالج کلمبیا شیکاگو و کینتینگ وانگ از کلمبیا هستند. فیلمسازان برنده که در مراسم جوایز گاتهام 2026 در روز دوشنبه، نوامبر 2026 تجلیل خواهند شد. 30، هر کدام کمک نقدی دریافت خواهند کرد و این فرصت را خواهند داشت که فیلمشان در پلتفرم استریم دیجیتال Focus Features و پلتفرم استریم غیرمتمرکز DCP+ Pictures نمایش داده شود. داستان‌های مرتبط فیلم‌ها کارگردان مارپیچ پائولو استریپولی با تصویر ترسناک اسکار صحبت می‌کند: من سعی می‌کنم انتظارات را پایین بیاورم تلویزیون چرا مایک فلانگان فقط نمی‌توانست کری وایت را بکشد «یکی از هیجان‌انگیزترین بخش‌های کاری که ما در Focus انجام می‌دهیم، کشف استعدادهای جدید است. جیسون کسیدی، نایب رئیس Focus Features، در بیانیه‌ای گفت: «فیلمسازان امسال این روحیه را تجسم می‌دهند و داستان‌های جسورانه، شخصی و دیدگاه‌های تازه‌ای را از سرتاسر جهان به نمایش می‌گذارند.» ما مفتخریم که به همکاری خود با تیم بزرگ The Gotham ادامه می دهیم و این گروه استثنایی از فیلمسازان در حال رشد را جشن می گیریم.\" این نمایشگاه که برای دانشجویان MFA که یک فیلم کوتاه را در سه سال تحصیلی گذشته به پایان رساندند باز است، به دنبال دسترسی گروهی متنوع از فیلمسازان نوظهور به صنعت فیلم و حمایت از توزیع چند پلتفرمی آثارشان است.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/gotham_focus.jpg?crop=116px%2C0px%2C1179px%2C660px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Variety", "title": "Danny McBride Stars in Another Kalshi Ad as Annoying Uncle at Thanksgiving (EXCLUSIVE)", "link": "https://variety.com/2026/tv/news/danny-mcbride-kalshi-ad-thanksgiving-1236957541/", "summary": "Danny McBride has teamed up with Kalshi again, writing and starring in another ad for the prediction market platform. In the one-minute spot, McBride plays a know-it-all uncle at the Thanksgiving dinner table, spewing predictions ": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Variety", "title": "Vatican-Produced Doc ‘Green Lava’ Drops Trailer Featuring Justin Bieber’s ‘Everything Hallelujah’ (EXCLUSIVE)", "link": "https://variety.com/2026/awards/global/vatican-doc-trailer-justin-bieber-everything-hallelujah-1236957800/", "summary": "“Green Lava,” an inspirational Vatican-produced documentary short in the running for the Oscars, has unveiled its new global trailer which features Justin Bieber’s song “Everything Hallelujah.” The doc follows a 22-year-old Italian man named Giacomo Mattivi, who lives with Duchenne Muscular Dystrophy. Use of Bieber’s “Everything Hallelujah” was secured through a licensing agreement with Universal [ ]", "date_str": "2026-11-25T15:00:00+00:00", "hash": "f135da6d0dcfa3ec", "title_fa": "تریلر Doc «Green Lava» تولید شده توسط واتیکان با نمایش «همه چیز هاللویا» جاستین بیبر (اختصاصی)", "summary_fa": "«گدازه سبز»، یک مستند کوتاه الهام‌بخش محصول واتیکان که در حال رقابت برای اسکار است، تریلر جهانی جدید خود را با آهنگ «همه چیز هاللویا» جاستین بیبر رونمایی کرد. این مستند درباره یک مرد ۲۲ ساله ایتالیایی به نام جاکومو ماتیوی است که با دیستروفی عضلانی دوشن زندگی می کند. استفاده از \"همه چیز هاللویا\" بیبر از طریق توافق نامه مجوز با یونیورسال تضمین شد. تریلر جهانی جدید خود را که آهنگ جاستین بیبر به نام «Everything Hallelujah» را به نمایش می گذارد، رونمایی کرد. این مستند درباره یک مرد ۲۲ ساله ایتالیایی به نام جاکومو ماتیوی است که با دیستروفی عضلانی دوشن زندگی می کند. بر اساس بیانیه ای، استفاده از \"همه چیز هاللویا\" بیبر از طریق توافق نامه مجوز با Universal Music Enterprises، بخشی از UMG Recordings, Inc. پس از معرفی توسط مدیر موسیقی دانیل وایزمن، تضمین شد. در بیانیه آمده است که مضامین ایمان و قدردانی این آهنگ بازتاب دیدگاه جاکومو به زندگی و کاوش مستند خانواده، استقامت و امید است. شرایط مالی فاش نشد. داستان‌های مرتبط مستند برند راسل از جیمی ساویل: یک داستان ترسناک بریتانیایی تهیه‌کنندگان در نتفلیکس چند روز پس از تجاوز، محکومیت آنتون     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
