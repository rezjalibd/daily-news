<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <title>مجله خبری روزانه — ۲۳ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

نز مدتی است با نمایندگان کارکنان برای یافتن راه‌هایی جهت کاهش هزینه‌ها مذاکره می‌کنند، اما با توجه به پیشرفت اندک این مذاکرات، شرکت اکنون موضع سخت‌گیرانه‌تری اتخاذ کرده است. میشائیل شیبه، عضو هیئت‌مدیره مرسدس بنز، در مصاحبه‌ای که در شبکه داخلی شرکت منتشر و برای خبرگزاری فرانسه ارسال شد، گفت: «هیئت‌مدیره به‌طور مشترک تصمیم گرفته است تمامی سرمایه‌گذاری‌های جدید در تأسیسات آلمان را متوقف کند.» او افزود که مدیریت شرکت، «با وجود مذاکرات فشرده و متعدد»، هیچ راهی برای دستیابی به توافق با اتحادیه‌های کارگری نمی‌بیند. شیبه تأکید کرد: «اکنون ناچاریم به‌دقت بررسی کنیم که اگر نتوانیم ساختار هزینه‌ها را تغییر دهیم، کدام‌یک از تأسیسات را باید تعطیل کنیم.» شیبه در عین حال هشدار داد که این احتمال وجود دارد که «محصولات جدید ما فقط در خارج از کشور تولید شوند». اتحادیه قدرتمند کارگری ای‌گِ متال (IG Metall) در مذاکرات جاری با شرکت مرسدس بنز، خواستار افزایش پنج‌درصدی دستمزدها شده است. بریتا زیگر، دیگر عضو هیئت‌مدیره مرسدس بنز، در همان سند منتشرشده در روز پنج‌شنبه، این درخواست اتحادیه را «کاملاً زیاده‌خواهانه» توصیف کرد. او گفت: «چنین افزایشی هزینه‌های نیروی کار را که هم‌اکنون در آلمان بالاست، باز هم بیشتر خواهد کرد؛ درحالی‌که این هزینه‌ها در مقایسه بین‌المللی از پیش بسیار بالاتر از حد قابل‌قبول هستند.»", "image_url": "https://gdb.rferl.org/18dfe3e2-2c9a-4de2-a0e2-c246771c5cf2_cx0_cy3_cw0_w1200_h630.jpg", "category": "استارتاپ و سرمایه‌گذاری", "tags": ["عامل‌های هوشمند", "سرمایه‌گذاری", "روابط بین‌الملل"], "datetime_fa": "۲۲ آبان • ۱۹:۱۴"}, {"source": "Radio Farda", "title": "از خمیرِ نان در گلستان تا هشدار قطع گاز؛ ایران چگونه به استقبال زمستان می‌رود؟", "link": "https://www.radiofarda.com/a/iran-shortage-gas-war-consequences/33898122.html", "summary": ".", "date_str": "2026-11-13T15:24:10+00:00", "hash": "56146c3108174d27", "title_fa": "از خمیرِ نان در گلستان تا هشدار قطع گاز؛ ایران چگونه به استقبال زمستان می‌رود؟", "summary_fa": "در روستای قولاق‌بورته، در استان گلستان، اهالی می‌گویند از نانوایی نان نمی‌برند، خمیر می‌برند. پول نان را همان‌جا می‌دهند و پختنش می‌ماند برای خانه. یک رسانهٔ       tech: [{"source": "TechCrunch AI", "title": "Export-banned Nvidia chips are behind China’s most powerful AI models — uh oh, Jensen!", "link": "https://techcrunch.com/2026/11/13/export-banned-nvidia-chips-are-behind-chinas-most-powerful-ai-models-uh-oh-jensen/", "summary": "New research shows the most advanced AI models from China were trained on banned Nvidia chips.", "date_str": "2026-11-13T18:40:30+00:00", "hash": "da55d4325ca58a94", "title_fa": "تراشه‌های ممنوعه صادراتی Nvidia پشت قدرتمندترین مدل‌های هوش مصنوعی چین قرار دارند - اوه اوه جنسن!", "summary_fa": "تحقیقات جدید نشان می‌دهد که پیشرفته‌ترین مدل‌های هوش مصنوعی چین بر روی تراشه‌های ممنوعه Nvidia آموزش دیده‌اند. یک تلاش تحقیقاتی جدید ادعا می‌کند که مدل‌های وزن باز پیشرو که توسط شرکت‌های چینی توسعه داده شده‌اند، بر روی تراشه‌های Nvidia آموزش دیده‌اند که دولت ایالات متحده از ارسال آنها به بزرگترین رقیب ژئوپلیتیکی خود محدود کرده است. دسترسی گسترده به پردازنده‌های گرافیکی Blackwell در میان آزمایشگاه‌های مرزی چین، بزرگی مشکل پیش روی طراح تراشه را نشان می‌دهد. جنسن هوانگ، مدیرعامل انویدیا، این هفته پس از اعتراف به رابطه‌اش با آلیس هوانگ، مدیر اجرایی Megaspeed، شرکتی که در قاچاق چیپ‌های انویدیا به چین دست دارد، شرکت را ترک کرد. آلیس هوانگ نیز به عنوان مامور سرویس اطلاعاتی چین ادعا شده است. در حالی که روابط جنسن هوانگ با یک مشتری و دو کارمند بیشترین علاقه عمومی را به خود جلب کرده است، مسئولیت شرکتی بالقوه انویدیا برای نقض کنترل صادرات احتمالاً در تصمیم آن برای جدایی از هوانگ نقش داشته است. هدف از کنترل صادرات ایالات متحده محافظت از رهبری این کشور در قابلیت های هوش مصنوعی در برابر چین است، اما هوانگ مدت هاست به دنبال باز کردن این بازار بوده است. صادرات پردازنده‌های گرافیکی بلک‌ول به چین یا شرکت‌های متعلق به چین ممنوع است، در حالی که دولت ترامپ به انویدیا اجازه می‌دهد تا H200 را صادر کند، یک تراشه کم‌قدرت‌تر، مشروط بر اینکه محموله‌ها از مسیر حمل و نقل مداری استفاده کنند که به ایالات متحده اجازه می‌دهد تا تعرفه ۲۵ درصدی را درخواست کند. Will DePue، محقق سابق OpenAI که گروه تحقیقاتی غیرانتفاعی Unemployment Labs را رهبری می‌کند، وزن - ساختار منحصر به فرد - مدل‌های زبان بزرگ را که آشکارا توسط DeepSeek، Moonshot AI، MiniMax و Ant Group منتشر شده است، تجزیه و تحلیل کرد. وزنه‌ها همچنان پیکربندی تراشه‌های مورد استفاده برای آموزش آن‌ها را منعکس می‌کنند", "image_url": "https://techcrunch.com/wp-content/uploads/2026/11/GettyImages-2301327883.jpg?resize=1200,795", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Nvidia", "تراشه"], "datetime_fa": "۲۲ آبان • ۲۲:۱۰"}, {"source": "The Guardian AI", "title": "Nvidia scandal: US treasury chief blames Lutnick’s commerce department over alleged lack of action", "link": "https://www.theguardian.com/technology/2026/nov/13/nvidia-scandal-sparks-us-national-security-concerns-china", "summary": "US commerce secretary faces sack as questions emerge over senior Trump officials’ knowledge of alleged Chinese spy’s ties to Jensen Huang US politics – live updates The US commerce secretary, Howard Lutnick, is facing growing pressure over his apparent lack of action over the Nvidia spying scandal as other Trump administration officials publicly raise questions over his decisions. Scott Bessent, the US treasury secretary, blamed Lutnick’s commerce department for the fact the US had not imposed export restrictions on certain Nvidia chips to China. Continue reading...", "date_str": "2026-11-13T19:51:28+00:00", "hash": "d3ba1695bb112d20", "title_fa": "رسوایی Nvidia: رئیس خزانه داری ایالات متحده، وزارت بازرگانی Lutnick را به دلیل عدم اقدام ادعایی مقصر می داند", "summary_fa": "وزیر بازرگانی ایالات متحده برکنار شد زیرا سوالاتی در مورد اطلاعات مقامات ارشد ترامپ از روابط جاسوسی چینی با جنسن هوانگ سیاست ایالات متحده مطرح شد - به روز رسانی زنده هوارد لوتنیک وزیر بازرگانی ایالات متحده به دلیل عدم اقدام آشکار خود در مورد رسوایی جاسوسی انویدیا با فشار فزاینده ای روبرو است زیرا سایر مقامات دولت ترامپ علناً سوالاتی را در مورد تصمیمات وی مطرح می کنند. اسکات بسنت، وزیر خزانه داری ایالات متحده، وزارت بازرگانی Lutnick را مقصر این واقعیت دانست که ایالات متحده محدودیتی برای صادرات برخی از تراشه های Nvidia به چین اعمال نکرده است. به خواندن ادامه دهید... جنسن هوانگ روز پنجشنبه از انویدیا استعفا داد و پس از انتشار گزارش‌هایی مبنی بر روابط متعدد او، مهم‌تر از همه با آلیس هوانگ (بدون رابطه)، که مظنون به جاسوسی چینی است، به طور موقت توسط مدیر مالی شرکت، کولت کرس، جایگزین او شد. به گزارش آسوشیتدپرس، مقامات کاخ سفید در حال بحث در مورد اینکه آیا لوتنیک باید اخراج شود یا خیر، پس از اینکه مشخص شد یک گزارش اطلاعاتی ایالات متحده در مورد رابطه هوانگ با جاسوس ادعا شده در میان شخصیت های ارشد دولت ترامپ پخش شده است. لوتنیک اکنون قرار است در ماه آینده در مقابل کنگره شهادت دهد، درست چند روز پس از اینکه رئیس برکنار شده انویدیا به سوالات قانونگذاران در کنگره پاسخ داد. Lutnick همچنین به دلیل تاخیر وزارت بازرگانی در اضافه کردن Megaspeed در سنگاپور که با آلیس هوانگ مرتبط است و میلیاردها دلار تراشه‌های Nvidia در سال‌های اخیر خریداری کرده است، به لیست سیاه واشنگتن از شرکت‌هایی که ایالات متحده آن‌ها را با وجود نگرانی‌های گزارش شده در داخل دولت، خطری برای امنیت ملی می‌داند، مواجه است.", "image_url": "https://i.guim.co.uk/img/media/5534caea091e39afe776168281e50dd327c8be8e/563_0_3334_2668/master/3334.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=5cfc91551ec81a92db228675af0c6ab1", "category": "هوش مصنوعی مولد", "tags": ["Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۲۲ آبان • ۲۳:۲۱"}, {"source": "The Guardian AI", "title": "Why the Nvidia scandal is far from over - The Latest", "link": "https://www.theguardian.com/news/video/2026/nov/13/why-the-nvidia-scandal-is-far-from-over-the-latest", "summary": "Jensen Huang’s resignation from the AI chipmaker Nvidia has sent shockwaves through the global economy. Huang resigned after reported affairs with an Nvidia executive and a woman alleged to be a Chinese spy. The fallout is not over yet, with criticism mounting over the apparent lac قی و بدون کج‌شدن به زیر آب برود. غرق‌کردن کشتی بدین روش هم دلایل عملی داشت و هم الزامات قانونی. برنامه‌ریزان می‌خواستند کشتی بدون خطر متلاشی‌شدن، به‌صورت قائم روی بستر دریا بنشیند. از سوی دیگر، مقررات زیست‌محیطی استفاده از مواد منفجره برای غرق‌کردن کشتی را ممنوع کرده بود. عملیات غرق‌کردن کشتی که ساعت ۰۶:۳۲ صبح ۲۱ آبان به وقت ایران به پایان رسید، در ابتدا برای ۱۲ نوامبر برنامه‌ریزی شده و قرار بود مراسم ویژه‌ای نیز به مناسبت این رویداد برگزار شود. بااین‌حال، بدترشدن شرایط جوی باعث شد عملیات ۲۴ ساعت زودتر انجام شود؛ درنتیجه، غرق‌کردن کشتی و آخرین مراحل آماده‌سازی آن باید به‌طور هم‌زمان پیش می‌رفت. کپی لینک باشکوه‌ترین کشتی مسافربری آمریکا وقتی کشتی در سال ۱۹۵۲ فعالیت خود را آغاز کرد، از همان ابتدا رکوردشکن شد ناپدیدشدن اس‌اس یونایتد استیتس در زیر امواج، پایان کارنامه درخشان یکی از آخرین کشتی‌های بزرگ مسافربری اقیانوس‌پیما را رقم می‌زند؛ کشتی‌هایی که در شش دهه نخست قرن بیستم بر اقیانوس‌ها سلطه داشتند، اما سرانجام با گسترش سفرهای هوایی جایگاه خود را از دست دادند.", "image_url": "https://api2.zoomit.ir/media/ss-united-states-florida-sinking-6af75b542314debea39c00f2?w=1920&q=75", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۲ آبان • ۲۲:۴۰"}, {"source": "Zoomit", "title": "اگر هوش مصنوعی نیمی از مشاغل را حذف کند، جهان وارد بحران می‌شود؛ هشدار مدیرعامل ANZ", "link": "https://www.zoomit.ir/ai-articles/471006-anz-ceo-ai-crisis-warning/", "summary": "مدیرعامل گروه بانکی ANZ هشدار داد که گسترش کنترل‌نشده هوش مصنوعی می‌تواند به تعدیل گسترده نیروها و بحرانی بین‌المللی منجر شود.", "date_str": "2026-11-13T19:00:00+00:00", "hash": "eec9caf90b050bd9", "title_fa": "اگر هوش مصنوعی نیمی از مشاغل را حذف کند، جهان وارد بحران می‌شود؛ هشدار مدیرعامل ANZ", "summary_fa": "مدیرعامل گروه بانکی ANZ هشدار داد که گسترش کنترل‌نشده هوش مصنوعی می‌تواند به تعدیل گسترده نیروها و بحرانی بین‌المللی منجر شود. تبلیغات مدیرعامل گروه بانکی ANZ خواستار وضع مقررات جهانی برای مدیریت اثرات هوش مصنوعی بر بازار کار شد و هشدار داد که پیامدهای شغلی این فناوری ممکن است بحرانی بین‌المللی رقم بزند. نونو ماتوس ، مدیرعامل گروه بانکی ANZ، در جلسه‌ی استماع پارلمان در کانبرا گفت: «اگر تعدیل نیروی گسترده تا ۵۰ درصد رخ دهد، ما با یک بحران روبه‌رو خواهیم شد؛ بحرانی که به استرالیا محدود نخواهد ماند و ابعادی جهانی پیدا می‌کند. هوش مصنوعی از معدود حوزه‌هایی به‌شمار می‌رود که معتقدم برای جلوگیری از ورود جامعه به بحران، نیازمند مقررات‌گذاری در سطح بین‌المللی است.» پذیرش ابزارهای هوش مصنوعی میان بانک‌های استرالیا در سال‌های اخیر با موجی از تعدیل نیرو در شرایط دشوار اقتصادی همراه شده و اتحادیه بخش مالی استرالیا بانک‌ها را به جایگزینی کارمندان با سیستم‌های خودکار متهم کرده است. شرکت‌های بزرگ فناوری نیز مسیر مشابهی در پیش گرفته‌اند؛ به‌طوری‌که کانوا تعدیل ۲۲ درصد از کارکنانش را اعلام کرده و مایکروسافت طرح بازخرید خدمت را برای حدود یک‌چهارم از ۲۲۳ هزار کارمند خود با هدف بازسازی نیروی کار جهت سازگاری با عصر جدید ارائه داده است. ماتوس معتقد است نیروهای کار باید مهارت‌های مرتبط را فرا بگیرند تا خطر از دست دادن موقعیت شغلی در برابر افراد مسلط‌تر کاهش یابد. گروه بانکی ANZ در کنار تلاش برای ارتقای مهارت کارکنان خود، روی ساخت یک پلتفرم نظارتی متمرکز شده است تا خطرات امنیتی را مهار کند. او می‌گوید: «هوش مصنوعی وجه تاریکی دارد. استفاده گسترده از این فناوری بدون تدابیر حفاظتی کافی معضلی بزرگ خواهد بود. هیچ بانکی نباید بدون ایجاد کنترل‌های مناسب به توسعه آن بپردازد.» گروه بانکی ANZ هم‌اکنون از ابزارهای هوشمند برای جلوگیری از تقلب و شناسایی نقاط ضعف سایبری استفاده می‌کند تا زیرساخت‌های", "image_url": "https://api2.zoomit.ir/media/anz-ceo-artificial-intelligence-warning-6af566d71e22a6ae5bd3ef05?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Microsoft"], "datetime_fa": "۲۲ آبان • ۲۲:۳۰"}, {"source": "Lifehacker", "title": "If Your Google Pixel's Camera Is Suddenly Broken, Here's the Fix", "link": "https://lifehacker.com/tech/if-your-google-pixels-camera-is-suddenly-broken-theres-a-fix?utm_medium=RSS", "summary": "Updates are generally good for your devices. The latest Chrome update, for example, patches an actively exploited security vulnerability , while Apple's latest updates stop people from seeing iMessages they shouldn't have access to. In most cases, it's beneficial to update your tech to the latest software version whenever possible. Sadly, updates aren't all perfect, as Google Pixel users are discovering this week. As reported by Android Authority , Google's November update apparently shipped with a bug that breaks some Pixel 10 and Pixel 11 cameras. Seeing as Pixels are rather famous for their shooters, this is a decidedly unfortunate glitch. What's going on with the Pixel's camera? Here's the situation: Following the November update, some users are opening their Pixel Camera apps to find an error that reads, \"Something went wrong. Close and open the Camera app again,\" with a \"Learn More\" link to, well, learn more. Others aren't receiving the error, but are instead running into a blank Camera viewfinder, as if the lens is totally covered. What's more, some users are reportedly saying that the issue is present on third-party camera apps, not just the Pixel Camera app. That would imply this is an issue with the camera system-wide, not just the Pixel Camera app itself. To be clear, it doesn't seem like this is a universal issue. It's not like all Pixel users are now running with broken cameras. But based on the forum complaints Android Authority discovered, it seems reasonable to assume that this glitch isn't limited to just a handful of unlucky Pixel owners. There's a fix for this Pixel camera bug Luckily, there is an apparent workaround here, though it's not totally obvious. Some users are having no luck restarting their Pixels, while others report that a factory reset wasn't enough to restore camera functionality. What does appear to work, however, is shutting your Pixel down and waiting five minutes or so. It's not clear why, but giving your Pixel a chance to \"breathe\" seems to shake the glitch and bring back your camera. As Android Authority reports, that fix comes from \"Diamond and Gold product experts\" on Google's Support forum. If your Pixel's camera is giving you grief following the November update, this workaround is definitely worth a try especially since more drastic measures don't actually seem to do anything. As the issue does seem to be rather widespread, I wouldn't be surprised to see Google issue a patch in the coming days. But until then, tu", "date_str": "2026-11-13T19:30:00+00:00", "hash": "a320247ea77e97d9", "title_fa": "اگر دوربین Google Pixel شما به طور ناگهانی خراب شد، راه حل اینجاست", "summary_fa": "به‌روزرسانی‌ها معمولاً برای دستگاه‌های شما خوب هستند. برای مثال، آخرین به‌روزرسانی کروم، یک آسیب‌پذیری امنیتی را که به‌طور فعال مورد سوء استفاده قرار می‌گیرد، اصلاح می‌کند، در حالی که آخرین به‌روزرسانی‌های اپل مانع از دیدن iMessهایی می‌شوند که نباید به آن‌ها دسترسی داشته باشند. در بیشتر موارد، در صورت امکان، به روز رسانی فناوری خود به آخرین نسخه نرم افزار مفید است. متأسفانه، همانطور که کاربران Google Pixel در این هفته کشف کردند، به‌روزرسانی‌ها همگی کامل نیستند. همانطور که توسط Android Authority گزارش شده است، ظاهراً به‌روزرسانی ماه نوامبر گوگل با مشکلی عرضه شده است که برخی از دوربین‌های پیکسل 10 و پیکسل 11 را خراب می‌کند. با توجه به اینکه پیکسل‌ها به خاطر تیراندازهایشان مشهور هستند، این یک نقص کاملاً ناگوار است. در مورد دوربین پیکسل چه خبر است؟ وضعیت به این صورت است: پس از به‌روزرسانی نوامبر، برخی از کاربران برنامه‌های دوربین پیکسل خود را باز می‌کنند تا خطایی پیدا کنند که می‌خواند: «مشکلی پیش آمده است. برنامه دوربین را دوباره ببندید و باز کنید،\" با پیوند \"بیشتر بدانید\"، خوب، بیشتر بدانید. دیگران خطا را دریافت نمی‌کنند، اما در عوض وارد منظره‌یاب دوربین خالی می‌شوند، گویی لنز کاملاً پوشانده شده است. علاوه بر این، برخی از کاربران گزارش می‌دهند که این مشکل در برنامه‌های دوربین شخص ثالث وجود دارد، نه فقط مشکل سیستم Pixelly Camera که این مشکل با این برنامه دوربین نیست. خود برنامه Pixel Camera. برای روشن شدن، به نظر نمی رسد که این یک موضوع جهانی باشد. اینطور نیست که همه کاربران پیکسل اکنون با دوربین های خراب کار می کنند. اما بر اساس شکایات فروم که Android Authority کشف کرده است، منطقی به نظر می رسد که فرض کنیم این نقص فقط به تعداد انگشت شماری از دارندگان بدشانس پیکسل محدود نمی شود. راه حلی برای این اشکال دوربین پیکسل وجود دارد خوشبختانه، یک", "image_url": "https://lifehacker.com/imagery/articles/01M7B60DR2JF1QCHBKH9Z7YE0M/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "امنیت سایبری"], "datetime_fa": "۲۲ آبان • ۲۳:۰۰"}, {"source": "Lifehacker", "title": "10 Privacy Hacks Every Mac User Should Know", "link": "https://lifehacker.com/tech/privacy-hacks-every-mac-user-should-know?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Apple has a pretty good track record on privacy. The company bakes a number of protections into its OSes to keep your data from being shared or stolen. That said, you can make your Apple devices even more secure. There are plenty of opt-in settings that make it even harder for anyone to snoop on your device and activity. These are the best privacy hacks for your Mac. MacBook Air $1,299.00 at Apple Shop Now Shop Now $1,299.00 at Apple MacBook Neo $699.00 at Apple Shop Now Shop Now $699.00 at Apple MacBook Pro $1,999.00 at Apple Shop Now Shop Now $1,999.00 at Apple SEE 0 MORE Enable advanced protection for all browsing in Safari to prevent device fingerprinting Private Browsing in Safari offers some protection against tracking of your device and activity. For example, Safari won't remember searches or save information from form fields, and it will strip link tracking and hide your IP address from known trackers. (Note that Private Browsing does not make you completely anonymous online.) However, these protections don't need to be limited to just Private Browsing. You can also enable advanced tracking and fingerprint protection for regular browsing sessions, which will minimize tracking while keeping other features active. That includes maintaining browsing and search history, allowing autofill, and keeping you logged in to sites that use cookies. You can turn this on by going to Safari Settings Advanced and selecting \"in all browsing\" from the dropdown next to \"Use advanced tracking and fingerprint protection.\" Turn on Firewall with stealth mode to make your device invisible to network scans Enabling the macOS Firewall (which is off by default) adds a layer of protection against external devices on your wifi network, as well as unauthorized apps from initiating a connection to your device. Turning on Stealth Mode prevents your Mac from even responding to these requests, essentially making it invisible to anything that's scanning a network you're connected to. This makes it more difficult for hackers and malware to know your device exists, much less attack it. This can interfere with certain essential activity when you're on your home network, but it's a valuable security setting when on public wifi. You can leave Firewall on all the time and enable Stealth Mode only as needed. Go to Settings Network Firewall , flip the toggle, then hit Options to manage Stealth Mode. Enable rotating MAC addresses to prevent a", "date_str": "2026-11-13T19:30:00+00:00", "hash": "02675b8acf6a46d6", "title_fa": "10 هک حریم خصوصی که هر کاربر مک باید بداند", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. اپل سابقه بسیار خوبی در حفظ حریم خصوصی دارد. این شرکت تعدادی محافظت در سیستم عامل خود ایجاد می کند تا از به اشتراک گذاری یا سرقت داده های شما جلوگیری کند. با این اوصاف، می توانید دستگاه های اپل خود را حتی ایمن تر کنید. بسیاری از تنظیمات انتخابی وجود دارد که ردیابی دستگاه و فعالیت شما را برای هر کسی سخت‌تر می‌کند. اینها بهترین هک های حریم خصوصی برای مک شما هستند. MacBook Air 1,299.00 دلار در Apple Shop اکنون خرید کنید 1,299.00 دلار در Apple MacBook Neo 699.00 دلار در Apple Shop Now اکنون 699.00 دلار در Apple MacBook Pro بخرید 1,999.00 دلار در Apple Shop Now اکنون خرید کنید 1,999.00 دلار برای جلوگیری از پیشرفت دستگاه های Apple MORE به SEE. اثر انگشت مرور خصوصی در سافاری محافظت در برابر ردیابی دستگاه و فعالیت شما را ارائه می دهد. به عنوان مثال، سافاری جستجوها را به خاطر نمی‌آورد یا اطلاعات مربوط به فیلدهای فرم را ذخیره نمی‌کند، و ردیابی پیوند را حذف می‌کند و آدرس IP شما را از ردیاب‌های شناخته شده پنهان می‌کند. (توجه داشته باشید که مرور خصوصی شما را کاملاً ناشناس آنلاین نمی کند.) با این حال، لازم نیست این حفاظت ها فقط به مرور خصوصی محدود شوند. همچنین می‌توانید ردیابی پیشرفته و حفاظت از اثر انگشت را برای جلسات مرور منظم فعال کنید، که ردیابی را به حداقل می‌رساند در حالی که سایر ویژگی‌ها را فعال نگه می‌دارد. این شامل حفظ سابقه مرور و جستجو، اجازه تکمیل خودکار، و ورود شما به سایت‌هایی است که از کوکی‌ها استفاده می‌کنند. می‌توانید با رفتن به Safari Settings Advanced و انتخاب «in all browsing» از منوی کشویی کنار «استفاده از ردیابی پیشرفته و محافظت از اثر انگشت» این مورد را فعال کنید. فایروال را", "image_url": "https://lifehacker.com/imagery/articles/01M73JCMQ70ZVXZVNSWQ0T40GP/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Apple", "امنیت سایبری"], "datetime_fa": "۲۲ آبان • ۲۳:۰۰"}, {"source": "Lifehacker", "title": "These Are the Best Ways to Encrypt Your Email", "link": "https://lifehacker.com/tech/these-are-the-best-ways-to-encrypt-your-email?utm_medium=RSS", "summary": "You probably already know that your email isn't actually all that private, especially if you have a free account with a major service provider like Gmail (Google) or Outlook (Microsoft). But if you are sending sensitive information via email, you can minimize what can be snooped on and by whom using end-to-end encryption, which generally ensures that only the recipient can read your message. Here's what you need to know about email encryption and how to set up an extra layer of privacy. How email encryption works As this in-depth explainer from Adaptive Security describes, most emails are encrypted in transit via Transport Layer Security (TLS), which prevents anyone from reading your message as it travels from server to server. However, encryption is temporarily stripped at each server: content is received and processed in plaintext and then re-encrypted when it leaves, meaning it could be read, logged, and distributed by the server provider. Emails are also typically encrypted at rest for example, while sitting on Google's servers and in a Gmail recipient's inbox. But this only prevents someone with physical access to the server hardware from reading messages, as Google still holds the encryption key and can access stored data. And, as PCMag points out , Google is scanning your messages to a degree, and it (along with other email providers) can and will hand emails over to law enforcement and government agencies in some cases. By contrast, with end-to-end encryption (E2EE), emails are readable only on the sender's and recipient's devices, and can be decrypted only with the recipient's private key. They're never translated into plaintext as they pass between and through servers to their destination, meaning that no one including server providers, hackers, or law enforcement can view the content. It's worth noting, though, that E2EE is not impenetrable nor a total guarantee of privacy. For example, metadata like subject lines and email addresses may remain in plaintext, and encrypted messages are still susceptible to phishing. Plus, forwarding an encrypted message breaks the encryption. Still, end-to-end encryption is especially useful when sending sensitive information that may be valuable to bad actors, though if security and privacy are a high priority, you may want to consider it for all of your emails. How you deploy encryption depends on whether you are adding it to your current email or switching to a dedicated provider. Add third-party encryption to", "date_str": "2026-11-13T19:00:06+00:00", "hash": "347425e90a5f8f32", "title_fa": "اینها بهترین راه ها برای رمزگذاری ایمیل شما هستند", "summary_fa": "احتمالاً قبلاً می‌دانید که ایمیل شما واقعاً خصوصی نیست، به خصوص اگر یک حساب کاربری رایگان با ارائه‌دهنده خدمات اصلی مانند Gmail (Google) یا Outlook (مایکروسافت) داشته باشید. اما اگر اطلاعات حساسی را از طریق ایمیل ارسال می‌کنید، می‌توانید با استفاده از رمزگذاری انتها به انتها، مواردی را که می‌توان از آنها ردیابی کرد و توسط چه کسی، به حداقل رساند، که به طور کلی تضمین می‌کند که فقط گیرنده می‌تواند پیام شما را بخواند. در اینجا آنچه شما باید در مورد رمزگذاری ایمیل و نحوه تنظیم یک لایه اضافی از حریم خصوصی بدانید آورده شده است. رمزگذاری ایمیل چگونه کار می کند همانطور که این توضیح عمیق از Adaptive Security توضیح می دهد، اکثر ایمیل ها در حین انتقال از طریق امنیت لایه حمل و نقل (TLS) رمزگذاری می شوند، که از خواندن پیام شما در حین انتقال از سروری به سرور دیگر جلوگیری می کند. با این حال، رمزگذاری به طور موقت در هر سرور حذف می‌شود: محتوا در متن ساده دریافت و پردازش می‌شود و پس از خروج دوباره رمزگذاری می‌شود، به این معنی که می‌توان آن را خواند، ثبت کرد و توسط ارائه‌دهنده سرور توزیع کرد. ایمیل‌ها نیز معمولاً در حالت استراحت رمزگذاری می‌شوند، به‌عنوان مثال، در هنگام نشستن در سرورهای Google و در صندوق ورودی گیرنده جی‌میل. اما این فقط از خواندن پیام‌ها توسط شخصی که دسترسی فیزیکی به سخت‌افزار سرور دارد، جلوگیری می‌کند، زیرا Google همچنان کلید رمزگذاری را در اختیار دارد و می‌تواند به داده‌های ذخیره‌شده دسترسی داشته باشد. و همانطور که PCMag اشاره می کند، گوگل پیام های شما را تا حدی اسکن می کند و (همراه با سایر ارائه دهندگان ایمیل) می تواند و در برخی موارد ایمیل ها را به مجریان قانون و سازمان های دولتی تحویل می دهد. در مقابل، با رمزگذاری end-to-end (E2EE)، ایمیل‌ها فقط در دستگاه‌های فرستنده", "image_url": "https://lifehacker.com/imagery/articles/01M6YH851H0ZH9V0PSGH8527MH/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Microsoft", "امنیت سایبری"], "datetime_fa": "۲۲ آبان • ۲۲:۳۰"}, {"source": "TechCrunch AI", "title": "Export-banned Nvidia chips are behind China’s most powerful AI models—uh oh, Jensen!", "link": "https://techcrunch.com/2026/11/13/export-banned-nvidia-chips-are-behind-chinas-most-powerful-ai-models-uh-oh-jensen/", "summary": "New res  the Miss USA pageant in September 2023. She became the first woman to relinquish her crown when she resigned in May 2024. Voigt has returned to the Miss USA organization since Thom Brodeur replaced Laylah Rose as CEO. Noelia Voigt spent seven years working to become Miss USA . She won first runner-up three times at state pageants before making it to the national stage, where she took the crown in 2023. That made it even more shocking when Voigt became the first Miss USA in the pageant's history to relinquish her title, giving up the crown just months before her reign was set to end in 2024. This is her story. Noelia Voigt began watching pageants at an early age, but her mother didn t allow her to compete as a child. Noelia Voigt of Utah. Courtesy of Miss USA Voigt was born and raised in Sarasota, Florida. Her mother, Jackeline Voigt, is from Venezuela, and her father, Jack Voigt, is an American former Major League Baseball player. He played for the Baltimore Orioles, Oakland A's, Texas Rangers, and Milwaukee Brewers during his 14-year career, according to his website . After winning Miss USA in September 2023, Voigt told Business Insider that she grew up watching pageants with her mother. \"My mom is from Venezuela, and over there, pageants are their Super Bowl and Olympics — it's a huge deal,\" Voigt said. \"So I had always wanted to do pageants from a really young age.\" Voigt said she began asking to compete in pageants before she was 10, but her mother was \"really protective\" and made her wait. \"Depending on the pageant that you're entering at that age, it can be potentially damaging to a young girl if they don't end up winning,\" Voigt said. \"Then they have this negative association with it, and they think that it has something to do with them.\" \"My mom didn't want that for me,\" she added. \"So she waited until I was old enough to understand that, if I didn't win, it's not a reflection of me or who I am.\" Voigt won her first pageant when she was 16 years old. Vogit volunteering with Smile Train as Miss USA 2023. Courtesy of Miss USA Voigt was named Miss Sarasota Teen USA in 2017. She went on to compete at Miss Florida Teen USA that year and placed first runner-up. Although she found early success in the world of pageants, Voigt said her friends made fun of her newfound passion . \"I was really hurt and confused as to why people I thought were my friends we", "date_str": "2026-11-13T18:42:20+00:00", "hash": "5c8f86d279326152", "title_fa": "نولیا ووگت اولین دوشیزه ایالات متحده بود که تاج خود را واگذار کرد. در اینجا چیزی است که باید در مورد ملکه مسابقات بدانید.", "summary_fa": "نوئلیا ووگت اولین دوشیزه ایالات متحده بود که تاج و تخت خود را رها کرد. با حسن نیت از خانم ایالات متحده، نولیا ووگت در مسابقه دوشیزه ایالات متحده آمریکا در سپتامبر 2023 برنده شد. او اولین زنی بود که با استعفای خود در ماه مه 2024 تاج و تخت خود را رها کرد. از زمانی که تام برودور جایگزین لیلا رز به عنوان مدیرعامل شد، وویگت به سازمان دوشیزه ایالات متحده بازگشت. نولیا ووگت هفت سال کار کرد تا دوشیزه آمریکا شود. او سه بار در مسابقات ایالتی نایب قهرمان اول شد و سپس به مرحله ملی رسید، جایی که در سال 2023 تاج را از آن خود کرد. وقتی وویگت اولین دوشیزه ایالات متحده در تاریخ مسابقات شد که عنوان خود را رها کرد و تاج را تنها چند ماه قبل از پایان سلطنتش در سال 2024 رها کرد، شوکه کننده تر شد. نولیا ووگت از سنین پایین شروع به تماشای مسابقات کرد، اما مادرش در کودکی به او اجازه شرکت در مسابقات را نداد. نولیا وویگت از یوتا. با حسن نیت خانم USA Voigt در ساراسوتا، فلوریدا به دنیا آمد و بزرگ شد. مادرش جکلین وویگت اهل ونزوئلا است و پدرش جک وویگت بازیکن سابق لیگ برتر بیسبال آمریکایی است. او در طول 14 سال دوران حرفه ای خود برای تیم های بالتیمور اوریولز، اوکلند آ، تگزاس رنجرز و میلواکی برورز بازی کرد. پس از برنده شدن در دوشیزه ایالات متحده آمریکا در سپتامبر 2023، وویگ به Business Insider گفت که با تماشای مسابقات با مادرش بزرگ شده است. وویگت گفت: \"مادر من اهل ونزوئلا است و در آنجا مسابقات سوپربول و المپیک آنهاست - این یک معامله بزرگ است.\" بنابراین من همیشه از سنین جوانی  set in our routines … like sharing a bathroom. My daughter was used to taking as long as she liked to get ready, but with an extra person, she had to account for three people's schedules instead of two. Meanwhile, my partner was clearly used to leaving his things lying around when he lived alone, but now, he was with two women who liked things to be tidy. If he were moving in with just me, the two of us might have tried to compromise, but he definitely felt some pressure to fit into our world, rather than asking me and my daughter adjusting to suit him. For me, the biggest compromise I've had to make is with my time. My attention was only required by my daughter when I was at home, but now I had to split my time with the two of them, which could be tiring at times. I felt constantly conscious of not leaving either of them out. Take cooking, as one example. My daughter and I always enjoyed cooking together, so I made sure we kept doing it — to th", "date_str": "2026-11-13T17:40:01+00:00", "hash": "eabfc3324bd8af9c", "title_fa": "شریک زندگی من با من - و دختر 30 ساله ام - نقل مکان کرد. همیشه آسان نبوده است، اما برای 9 سال کار کرده است.", "summary_fa": "زندگی با هم همیشه برای ما سه نفر آسان نبوده است، اما ما روتین های بسیار خوبی ساخته ایم. سامانتا پریستلی در سال 2017، شریک زندگی من با من و دختر بالغم نقل مکان کرد. در ابتدا، همه ما مجبور بودیم سازش کنیم و خود را با برخی دردهای رو به رشد سازگار کنیم. نگاه کردن به همدیگر به عنوان هم اتاقی های بالغ کمک کرد و ما سه نفر هنوز با هم زندگی می کنیم. من چند سالی بود که با شریکم قرار داشتم قبل از اینکه تصمیم بگیریم با هم زندگی کنیم. او اغلب در آنجا می ماند، ابتدا فقط یک شب در هر زمان، و سپس برای چند روز. یک بار او با کیف دستی در دست داشت از خانه من راهی محل کار می شد و من گفتم: \"این احمقانه است. چرا شما فقط به خانه نمی روید؟\" و همینطور شد، اما فقط با من نقل مکان نکرد. دختر بالغ من در خانه زندگی می کند، بنابراین \"کوچ کردن\" به معنای پیوستن به هر دوی ما بود. چالش‌هایی وجود داشته است، اما نه سال بعد - با دخترم که اکنون 30 سال دارد ports Thursday afternoon, signaling a major issue somewhere in Microsoft's pipeline. The reports did \"slow down\" throughout the day, but Downdetector still showed over 50,000 reports coming in every 15 minutes when I checked Thursday afternoon. What caused these Microsoft outages? While the root cause of the issue was a mystery throughout Thursday's outage, Microsoft confirmed the problem in an apology on Friday . According to the company, \"This was a technical issue not related to cyber or AI [or] agents. The incident was introduced by an issue during an earlier network capacity upgrade that surfaced following a recent network change. We have addressed the underlying issue and continue to restore service to remaining customers and regions.\" Microsoft says it is \"deeply sorry\" for the disruption to its customers and partners. The company says the fix rolled out slower than some might expect, since it wanted to restore service gradually to evaluate stability at each stage. It also says it will release a full post-incident report once it ", "date_str": "2026-11-13T17:55:20+00:00", "hash": "320fa93f3c0debeb", "title_fa": "مایکروسافت رسما بابت قطعی های دیروز عذرخواهی کرد", "summary_fa": "اگر در دسترسی به خدمات خاصی مانند Microsoft Teams یا Outlook مشکل داشتید، تنها نبودید. اوایل بعدازظهر پنجشنبه، بسیاری از بزرگترین برنامه‌ها و سرویس‌های مایکروسافت در حال از کار افتادن بودند. با توجه به Downdetector که گزارش‌های کاربران را در مورد مشکلات وب‌سایت‌ها و پلتفرم‌ها ردیابی می‌کند، Microsoft 365، Teams، Copilot، Teams و OneDrive همگی با مشکلاتی مواجه بودند. از بعدازظهر جمعه، مایکروسافت سرویس را به بسیاری از کاربران بازگرداند و رسماً بابت قطعی‌ها عذرخواهی کرد. کدام سرویس های مایکروسافت تحت تأثیر این قطعی ها قرار گرفتند؟ وقتی برای اولین بار این مقاله را در روز پنجشنبه منتشر کردم، حتی نتوانستم صفحه وضعیت Microsoft 365 را بارگیری کنم. (من در مورد قطعی سرویس‌های زیادی گزارش داده‌ام، اما نمی‌توانم زمانی را به یاد بیاورم که صفحه وضعیت یک سرویس نیز از کار افتاده باشد.) حتی از بعد  درباره خطر پیش‌گویی فجایع به ما می‌دهند. تبلیغات هاینتس فون فورستر، دانشمند فقید استرالیایی-آمریکایی باور داشت که جمعه ۱۳ نوامبر ۲۰۲۶ (۲۲ آبان ۱۴۰۵)، روز پایان جهان است. پروفسور فون فورستر و دو تن از همکارانش در دانشگاه ایلینوی این پیش‌بینی را در سال ۱۹۶۰ در مجله معتبر ساینس منتشر کردند. این مقاله از آن زمان تاکنون بارها مورد بحث قرار گرفته است. تصور پژوهشگران از پایان جهان با آنچه معمولاً از این مفهوم در ذهن داریم متفاوت بود. به باور آن‌ها، رشد شتابان جمعیت دنیا سرانجام به جایی می‌رسید که تعداد انسان‌ها به بی‌نهایت می‌رسید؛ دست‌کم مقاله آن‌ها به معنای واقعی کلمه چنین چیزی را پیش‌بینی می‌کرد. فون فورستر این وضعیت را چنین توصیف کرده بود که نوادگانش بر اثر ازدحام جمعیت «زیر فشار جمعیت جان خواهند داد». فون فورستر عمداً تحلیل خود را به‌گونه‌ای طراحی کرده بود که رسیدن به این نتیجه اجتناب‌ناپذیر به نظر برسد. او معادله‌ای ریاضی ابداع کرد که از ابتدا برای رسیدن به نتیجه‌ای مشخص تنظیم شده بود. سپس این معادله را با داده‌های جمعیت انسانی در دو هزار سال گذشته تطبیق داد تا تاریخ دقیقی برای وقوع فاجعه به دست آورد. ۱۳ نوامبر ۲۰۲۶ همچنین مصادف با صد و پانزدهمین سالروز تولد او است. هدف فون فورستر از انتشار مقاله‌ی پیش‌بینی پایان دنیا، نشان‌دادن ناپایدار بودن نرخ رشد جمعیت انسان در سال ۱۹۶۰ بود. البته این نتیجه‌گیری تازگی نداشت و ریشه آن به کتاب « رساله‌ای درباره اصل جمعیت » اثر توماس مالتوس در قرن هجدهم بازمی‌گشت. مشکل اصلی، راهکاری بود که فون فورستر برای مقابله با این مسئله پیشنهاد می‌کرد: کنترل گسترده زاد و ولد. کپی لینک وقتی پیش‌بینی‌ها اشتباه از آب درآمدند در اواسط قرن بیستم، افراد دیگری نیز به نتایج مشابه فون فورستر رسیده", "image_url": "https://api2.zoomit.ir/media/the-infinity-prediction-collage-6af7427e1e22a6ae5bd3f42f?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۲۲ آبان • ۲۰:۴۰"}, {"source": "Business Insider", "title": "Wall Street forecasters see tumbling corporate earnings hobbling the stock market in 2027", "link": "https://www.businessinsider.com/stock-market-earnings-slowdown-2027-wall-street-outlook-2026-11", "summary": "Wall Street forecasters warn that earnings growth is poised to slow sharply heading into 2027, posing a risk to stock valuations. ANGELA WEISS / AFP via Getty Images A sharp slowdown in corporate earnings may spoil the outlook for stocks in 2027. More analysts expect S P 500 earnings growth to slow amid a pullback in AI capex. The trend could result in a hit to valuations or increased volatility in markets sometime next year. The market has plenty on its mind: the Iran war , hotter inflation , and the scandal around Nvidia CEO Jensen Huang , to name a few. But there's one risk quietly looming heading into 2027: A sharp earnings slowdown. Earnings are the engine of the stock market's four-year-old bull market, but growth could soon come down, some analysts say, pointing to an expected drop in corporate earnings momentum as AI investment slows. The result could be a volatile 2027 for stocks, with valuations already beginning to come down as the market prices in a slower pace of earnings expansion . Earnings growth has been stellar this year, which has sparked concern that the market is in the midst of an earnings bubble . For the third quarter, the S P 500 is on track to post a blended annual earnings growth rate of 31.4%, per the latest FactSet update. That's above the average annual earnings growth rate of 14.8%, according to Multpl data from 1989 through the end of 2024. Goldman Sachs says it expects earnings growth to fall considerably over the next year, from a 36% annual pace in 2026 to 11% in 2027. The bank said earnings look poised to decelerate largely due to hyperscaler capex slowing, while costs associated with the AI boom, such as interest expenses, rise. Amazon, Alphabet, Meta, Microsoft, and SpaceX are expected to spend more than $800 billion on capex in 2026, a record high. Stock valuations have also dropped sharply, Goldman noted, pointing to how expectations for slower economic and earnings growth were already starting to be priced in. \"2026 was the year of strong earnings,\" a team led by the bank's Peter Oppenheimer said. \"As we enter 2027, earnings growth is on course to slow sharply across all major regions, growth in AI capex spending is likely to peak and the cost of capital remains elevated.\" \"We expect equities to continue to rise, but with volatility,\" the bank added. Raymond James said it was expecting earnings growth to normalize in the next year, pointing to the expected slowdown in AI spend. The firm said earnings per share growt", "date_str": "2026-11-13T17:32:14+00:00", "hash": "ae81cdf07691ad7a", "title_fa": "پیش‌بینی‌کنندگان وال استریت می‌بینند که درآمد شرکت‌های بزرگ در سال 2027 بازار سهام را با مشکل مواجه کرده است", "summary_fa": "پیش‌بینی‌کنندگان وال‌استریت هشدار می‌دهند که رشد درآمد تا سال 2027 به‌شدت کاهش می‌یابد و ریسکی را برای ارزش‌گذاری سهام ایجاد می‌کند. ANGELA WEISS / AFP از طریق Getty Images کاهش شدید درآمد شرکت ها ممکن است چشم انداز سهام در سال 2027 را خراب کند. تحلیلگران بیشتری انتظار دارند که رشد درآمد S P 500 در بحبوحه کاهش سرمایه هوش مصنوعی کند شود. این روند می تواند منجر به ضربه زدن به ارزش ها یا افزایش نوسانات در بازارها در سال آینده شود. بازار چیزهای زیادی در ذهن خود دارد: جنگ ایران، تورم داغتر، و رسوایی پیرامون جنسن هوانگ، مدیر عامل انویدیا، چند مورد. اما یک خطر بی سر و صدا در راه رسیدن به سال 2027 وجود دارد: کاهش شدید درآمد. سود موتور بازار صعودی چهار ساله بازار سهام است، اما برخی تحلیلگران می گویند که رشد به زودی کاهش می یابد و به کاهش انتظاری در شتاب درآمد شرکت ها با کاهش سرمایه گذاری در هوش مصنوعی اشاره می کند. نتیجه می‌تواند سال 2027 بی‌ثباتی برای سهام باشد، در حالی که ارزش‌گذاری‌ها از قبل شروع به کاهش کرده‌اند، زیرا قیمت‌های بازار با سرعت پایین‌تری از گسترش سود شروع به کاهش می‌کنند. رشد سود در سال جاری خیره کننده بوده است، که این نگرانی را برانگیخته است که بازار در میان حباب درآمد قرار دارد. طبق آخرین به روز رسانی FactSet، S P 500 برای سه ماهه سوم در مسیر ثبت نرخ رشد درآمد سالانه ترکیبی 31.4 درصدی قرار دارد. طبق داده‌های Multpl از سال 1989 تا پایان سال 2024، این بالاتر از میانگین نرخ رشد درآمد سالانه 14.8 درصدی است. گلدمن ساکس می‌گوید انتظار دارد رشد درآمد به میزان قابل توجهی در سال آینده کاهش یابد، از سرعت سالانه 36 درصد در سال 2026 به 11 درصد در سال 2027. با رونق هوش مصنوعی، مانند هزینه های بهره،", "image_url": "https://i.insider.com/6af7182bb2c29afb4e56a955?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "Meta", "Microsoft"], "datetime_fa": "۲۲ آبان • ۲۱:۰۲"}, {"source": "Business Insider", "title": "At 40, I moved my family of 4 to Spain. We spent that first year abroad learning from our mistakes.", "link": "https://www.businessinsider.com/american-family-moved-to-spain-mistakes-lessons-2026-11", "summary": "Moving from the US to Spain has meant embracing culture shocks and making a few mistakes. Courtesy of Brian Hodge About a year and a half ago, my family of four left the US and moved to Spain . We've adapted in many ways but still sometimes struggle with late mealtimes and limited store hours. Locals take their time at cafés and restaurants, and it's pushed us to embrace a laid-back attitude. I should've known that we were too early when we had to duck under the partially closed metal awning. We'd arrived after the restaurant's posted opening hours, but my suspicions were confirmed when we were greeted by a hostess who was still taking off her motorcycle helmet. Definitely too early. She suggested we come back later, with a reservation. Welcome to the struggle of finding dinner in Spain before 8 p.m. About a year and a half ago, my family and I made the bold decision to leave the US, sell most of our belongings — including our home — and move our lives to Spain . Although it's absolutely been a dream come true, there are still some cold-water-on-the-face moments that snap us awake and remind us how far we've come. We've gradually adjusted to new business hours and norms Restaurants are a little different in Spain than they are in the US. Courtesy of Brian Hodge Even simple  hackers System rights", "link": "https://arstechnica.com/security/2026/11/windows-0-day-dropped-by-disgruntled-researcher-hands-hackers-system-rights/", "summary": "Nightmare Eclipse, the pseudonym of a researcher with an ongoing, very public beef with Microsoft, has dropped yet another Windows zero-day. On Tuesday, Nightmare Eclipse disclosed SignDrop, a vulnerability that gives local users full System rights on some versions of Windows. The vulnerability resides in the Common Log File System , which Microsoft describes as a “general-purpose logging service used by software clients running in user-mode or kernel-mode.” By forcing a privileged process such as Windows Defender to open a crafted CLFS container, an attacker with ordinary user rights can abuse the privileged file creation to elevate privileges to System. Turning a Windows defense against itself The attack exploits the interaction of CLFS, Windows Defender, and Windows file permissions. The exploit uses Windows Defender to open a log file created by a standard user by calling ServerMpUpdateEngineSignature, a legitimate Defender function for processing antivirus signature updates. Read full article Comments", "date_str": "2026-11-13T16:26:32+00:00", "hash": "52d25986d950a2c6", "title_fa": "Windows 0-day توسط محقق ناراضی دست هکرها حقوق سیستم حذف شد", "summary_fa": "Nightmare Eclipse، نام مستعار محققی که با مایکروسافت مشغول به کار است، یک روز دیگر ویندوز صفر را حذف کرده است. روز سه‌شنبه، Nightmare Eclipse SignDrop را فاش کرد، آسیب‌پذیری که به کاربران محلی حقوق کامل سیستم را در برخی از نسخه‌های ویندوز می‌دهد. این آسیب‌پذیری در Common Log File System قرار دارد، که مایکروسافت آن را به‌عنوان «سرویس گزارش‌گیری همه‌منظوره مورد استفاده توسط کلاینت‌های نرم‌افزاری که در حالت کاربر یا حالت هسته اجرا می‌شوند» توصیف می‌کند. با وادار کردن یک فرآیند ممتاز مانند Windows Defender برای باز کردن یک کانتینر دستکاری شده CLFS، یک مهاجم با حقوق کاربر معمولی می تواند از ایجاد فایل ممتاز برای ارتقای امتیازات به سیستم سوء استفاده  بیاموزید به حداقل رساندن برای پیمایش قطعی جهانی که طیف وسیعی از خدمات مایکروسافت 365 را از بین می برد صبح جمعه ادامه دارد. سیاران مارتین، رئیس سابق مرکز امنیت سایبری ملی بریتانیا، به NBC News گفت، مانند قطعی‌های اخیر فناوری‌های پرکاربردی مانند خدمات وب آمازون و CrowdStrike که اخیراً دنیا را تکان داد، اختلال مایکروسافت به نظر \"یکی از بزرگترین قطعی‌های تمام دوران‌ها\" است. او پیشنهاد کرد که احتمالاً حتی \"بدتر\" است. شرکت‌ها، بیمارستان‌ها، ادارات پلیس و مدارس از جمله کسانی بودند که برای رفع قطعی تلاش می‌کردند. به گفته ماسانائو اوزاکی، معاون دبیر کابینه، در ژاپن، زیرساخت های فناوری اطلاعات دولت را مختل کرد. گزارش ان‌بی‌سی آسیب‌های مختلف را مستند کرد و اشاره کرد که «تعداد کمی از ارگان‌های عمومی از این قطعی مصون بودند». در برخی موارد، پزشکان نمی‌توانند به‌روزرسانی‌های «مهم» در مورد تغییرات دارو یا مراقبت‌های بعدی را برای بیماران ارسال کنند. بخش مالی نیز متضرر شد، زیرا مردم از انجام نقل و انتقالات بانکی مسدود شدند زیرا نمی توانستند کدهای", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/GettyImages-2191081646-1024x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Microsoft", "امنیت سایبری"], "datetime_fa": "۲۲ آبان • ۱۸:۵۶"}, {"source": "Ars Technica", "title": "It's the end of the world as we know it, per a physicist's 1960 prediction", "link": "https://arstechnica.com/science/2026/11/its-the-end-of-the-world-as-we-know-it-per-a-physicists-1960-prediction/", "summary": "As of this morning, Microsoft is still scrambling to restore service following yesterday's global outage, with millions of users unable to access Outlook and other vital tools. It's not the end of the world, but it does seem fitting that this should happen on the day a physicist predicted would be the end of humanity: November 13, 2026. And it falls on a Friday, too. The physicist in question is Heinz von Foerster, who published a 1960 paper in the journal Science predicting that by today, overpopulation would reach the breaking point. It's not a new fear. English economist Thomas Malthus —one of the early pioneers in modeling population dynamics—made a similar prediction in 1798, claiming that a rapidly growing population would eventually exhaust the available food supply, and humanity would starve to death. His model rested on the assumption of exponential growth, but the equation is only applicable under specific conditions, such as scientists growing bacteria in a lab in a perfectly controlled environment. Even then, while growth occurs exponentially for a time, it does not continue forever. Population dynamics are notoriously tricky to calculate because there are so many variables to consider and so much unpredictability in the system. In his 1960 analysis, Von Foerster accurately measured past trends in population growth, but like Malthus, he assumed those trends would carry into the future largely unchanged. So he projected that human population growth would march inexorably toward infinity. We wouldn't starve to death; von Foerster thought we would be ingenious enough to solve the food supply problem. Instead, \"they will be squeezed to death,\" he wrote. Read full article Comments", "date_str": "2026-11-13T15:09:39+00:00", "hash": "10050be0643ae536", "title_fa": "طبق پیش بینی یک فیزیکدان در سال 1960، این پایان جهان است که ما می شناسیم", "summary_fa": "از صبح امروز، مایکروسافت همچنان در تلاش است تا خدمات را پس از قطعی جهانی دیروز بازیابی کند، زیرا میلیون‌ها کاربر قادر به دسترسی به Outlook و سایر ابزارهای حیاتی نیستند. این پایان جهان نیست، اما به نظر می رسد مناسب است که این اتفاق باید در روزی رخ دهد که یک فیزیکدان پیش بینی کرد پایان بشریت خواهد بود: 13 نوامبر 2026. و همچنین در روز جمعه است. فیزیکدان مورد بحث Heinz von Foerster است که مقاله ای در سال 1960 در مجله Science منتشر کرد و پیش بینی کرد که تا امروز، جمعیت بیش از حد به نقطه شکست خواهد رسید. ترس جدیدی نیست. توماس مالتوس، اقتصاددان انگلیسی - یکی از پیشگامان اولیه در مدل‌سازی پویایی جمعیت - پیش‌بینی مشابهی را در سال 1798 انجام داد و مدعی شد که جمعیتی که به سرعت در حال https://www.businessinsider.com/moved-india-seattle-changed-health-career-2026-11", "summary": "Neha Shah. Diaspora Nutrition After moving from India to Seattle, Neha Shah was most shocked by the immediate toll on her body. Instead of looking for another engineering job, she pivoted and founded a nutrition business. She said one of the most unexpected parts of moving was the urban loneliness she experienced. This as-told-to essay is based on a conversation with Neha Shah, the 38-year-old founder of Ayurvedic Intelligence , who is based in the Seattle metropolitan area. It's been edited for length and clarity. I expected my transition of moving from India to the US to revolve around adjusting to the weather, learning a new corporate culture, and building a routine. Instead, I ended up rebuilding my entire identity, starting with my health. When my family and I were living in India , I saw the move to Seattle for my husband's job as an exciting next step. My plan was straightforward: settle into our new home, navigate the job market, and pick back up with my software engineering career in one of America's biggest tech hubs. The biggest shock after arriving in the US wasn't cultural; it was physical. Within months of moving, my body began reacting intensely to my environment. I developed chronic bloating, persistent fatigue, systemic inflammation, and stubborn weight gain. What made it so baffling was that my diet hadn't changed: I was still cooking the same traditional meals from scratch that I'd eaten every day in India. This derailed my return to software engineering and sparked the foundation for Ayurvedic Intelligence, my business as an integrative nutrition and health coach. As an engineer, I couldn't accept vague answers to my health issues I started digging into the biological reality of migration and discovered dietary acculturation: how shifting to a new food environment alters the microbiome, and how differences in agricultural processing, soil quality, water, and food infrastructure in the West affect the human body. That's when I saw a massive, unaddressed gap in the wellness industry. Realizing that many South Asian immigrants might've been silently suffering from the exact same \"environmental bug\" without a culturally intelligent framework to fix it, I knew I had to build the solution myself. I worked as an engineer in India from 2010 to 2012 and then took a five-year break to immerse myself in motherhood and family life. After I moved to the US and experienced health challenges, I became a Certified Holistic Health Coach through the Inst", "date_str": "2026-11-13T15:40:16+00:00", "hash": "a63d1f95c9ac964a", "title_fa": "من برای کار شوهرم از هند به سیاتل نقل مکان کردم. تنهایی، هزینه های زندگی و عوارضی که بر بدنم وارد شده بود مرا شوکه کرد.", "summary_fa": "نها شاه. تغذیه دیاسپورا پس از نقل مکان از هند به سیاتل، نها شاه از تلفات فوری بدنش بسیار شوکه شد. او به جای اینکه به دنبال شغل مهندسی دیگری باشد، یک تجارت تغذیه را راه اندازی کرد. او می‌گوید یکی از غیرمنتظره‌ترین قسمت‌های جابجایی، تنهایی شهری بود که تجربه کرد. این مقاله گفته شده بر اساس گفتگو با نها شاه، بنیانگذار 38 ساله هوش آیورودا، که در منطقه شهری سیاتل مستقر است، است. برای طول و وضوح ویرایش شده است. انتظار داشتم که انتقال من از هند به ایالات متحده حول محور سازگاری با آب و هوا، یادگیری یک فرهنگ جدید شرکتی و ایجاد یک روال باشد. در عوض، من تمام هویت خود را بازسازی کردم، از سلامتی‌ام شروع شد. زمانی که من و خانواده‌ام در هند زندگی می‌کردیم، نقل مکان به سیاتل برای شغل شوهرم را به‌عنوان گام بعدی هیجان‌انگیز دیدم. برنامه من ساده بود: در خانه جدیدمان مستقر شوم، در بازار کار بگردیم و حرفه مهندسی نرم افزار خود را در یکی از بزرگترین مراکز فناوری آمریکا ادامه دهم. بزرگترین شوک پس از ورود به ایالات متحده، فرهنگی نبود. فیزیکی بود در عرض چند ماه پس از حرکت، بدنم به شدت نسبت به محیط اطرافم واکنش نشان داد. من دچار نفخ مزمن، خستگی مداوم، التهاب سیستمیک و افزایش وزن شدید شدم. چیزی که آن را بسیار گیج کننده کرد این بود که رژیم غذایی من تغییر نکرده بود: من هنوز همان غذاهای سنتی ر home for years while my husband spent several nights a week traveling. When he began working remotely, I became his only daily companion outside video calls. We had to create boundaries between our professional lives and our marriage. In the tenuous months after COVID, my husband, Mark, got laid off when a larger corporation bought out his company. He found another job quickly — hours away, in Northern New Jersey — and rather than move, he commuted, spending two or three nights a week in hotels and working from home on Fridays. As an artist and writer, I was already working from home full-time, and I liked the new rhythm of his workweek. While Mark was away, I took over every surface of the house: the dining room table for painting, a second craft table when I had multiple pieces going. The author took over the dining table with her art. Courtesy of the author On Thursdays I'd clear my projects off the table and cook something better than the salads I had been eating in his absence — chili or a tray of baked penne — while the dogs waited at the door for the sound of his car in the driveway. On his Fridays, when Mark worked from home, I'd take my laptop to the coffee shop to write proposals and plan my social media posts, giving him the run of our small house. Then, at the end of last year, his latest company was bought out, too. Bracing for the worst, we waited to see what this sale would mean for us. Would the new company keep the guy who'd racked up all those hotel bills? Mark updated his résumé and waited. A couple of months in, word came back: no more commuting . He could work from home full-time. We celebrated with a bottle of Barolo. We were empty nesters The timing felt advantageous: our son had just moved out. Mark moved his desk out of our bedroom and into the now spare room of our little two-bedroom Cape Cod. It afforded him a door he could close behind him. Then reality set in. Plenty of couples have had to figure out working from home together, but most ts drone operations. Russia has already launched 30 satellites this year for Rassvet, a low-Earth-orbit satellite internet constellation that it has billed as comparable to SpaceX's Starlink, which is widely used by Ukrainian forces. Rassvet's deployment has faced setbacks , including difficulties with launch and dependencies on foreign components, Ukraine's GUR military intelligence agency said in a statement. Two of the 30 Russian satellites launched this year have already \"deorbited,\" and while 26 have reached a stable position at an altitude of roughly 320 miles, none have reached the planned 500-mile altitude — though they are maneuvering toward it, the GUR said. Russia plans to expand the constellation to up to 48 satellites by the end of the year and launch another 240 next year to cover 94% of Russian territory with speeds of up to 150 Mbps, the GUR said. Moscow plans to bring the constellation up to 408 satellites by 2031 and 924 by 2035. The Rassvet satellites, each weighing little more than 600 pounds, rely on laser communication instead of ground stations to transfer data. Russia uses the Soyuz-2.1b three-stage rocket to launch its satellites into orbit. Ukraine has attacked production facilities that manufacture this family of rockets in an attempt to disrupt Moscow's space industry. Ukrainian forces are facing another round of Starlink service disruptions this week. Stringer/REUTERS Rassvet's main control center is in Moscow, but the GUR said Russia plans to build a network of ground stations across the country. Neither Russia's defense ministry nor its US embassy responded to a request for comment on the GUR's assessment. Rassvet is considered to be Russia's alternative to Starlink, SpaceX's commercial satellite internet se", "date_str": "2026-11-13T14:06:45+00:00", "hash": "cbbe87afc0e0d6e2", "title_fa": "اوکراین می گوید روسیه قصد دارد صدها ماهواره دیگر را برای جایگزین Starlink خود در سال 2027 پرتاب کند", "summary_fa": "روسیه قصد دارد صدها ماهواره  screened over 300 of his TikToks on the big screen at Cherry Lane Theatre. Michelle Paradis I spent my Wednesday afternoon bingeing one creator's TikToks in a movie theater. Max Zavidow, a New York-based comedian and content creator, screened over 300 of his TikToks. Zavidow wanted people \"to feel the agony\" of re-watching all his videos — and see his career arc. One hour, 100 TikToks, one big screen. That's how I spent my lunch break on Wednesday. Max Zavidow , a New York-based content creator with 1.4 million TikTok followers, booked the historic Cherry Lane Theatre to screen more than 300 of his TikToks. Perched in the front row with a camera livestreaming his reactions, Zavidow watched (almost) every single video he's made in the past five years flash before his eyes. He cringed, laughed, and reflected on his career. Zavidow s live reactions to his own TikToks: cringing and laughing. Max Zavidow \"It is hard to watch your old work,\" he told me. The screening was, in part, a parody of Shia LaBeouf's \"#ALLMYMOVIES,\" in which the actor livestreamed himself for 72 hours watching his films in 2015. Zavidow, who started posting TikToks at the end of 2021, wanted the screening to \"paint a complete picture\" of what it means to have a career as a content creator and \"evolve on the internet.\" \"I wanted people to feel the agony of me having to look back,\" he said. The whole ordeal took four hours. I stayed for one. Meanwhile, TikTokers and creator-economy peers popped in and out of the dark theater. The event was free and invitation-only, done in partnership with the theater, which is owned by A24, and produced by Love Letter. \"I had six days to pull it together,\" Zavidow said. Zavidow sat front row at the screening of his TikToks. Michelle Paradis My viewing experience may not have been as groundbreaking as sitting through Nathan Fielder's \" You Can See Everything .\" Still, I walked out of the theater with more thoughts about TikTok, entertainment, and the creator's career arc. Here are three lingering takeaways. 1. TikTok and Instagram on the TV may not be a bad idea after all I'll be honest, I've been skeptical about social media coming to TV. That's partly because I don't use a TV to watch TV. I usually watch HBO and Netflix on my iPhone . Watching Zavidow's TikToks on the screen, however, was great. Who would have thought watching TikToks while sitting at a 90-degree angle would be pleasant? Zavidow s #ALLMYTIKTOKS is a parody of S", "date_str": "2026-11-13T13:15:01+00:00", "hash": "c3e206a2a9913c61", "title_fa": "من 100 TikToks را در یک ساعت در یک سالن سینما مصرف کردم - و احساسات عمیق شگفت انگیزی در مورد آن داشتم.", "summary_fa": "مکس زاویدو، خالق محتوا، بیش از 300 تیک تاک خود را در نمایش بزرگ تئاتر Cherry Lane نمایش داد. میشل پارادیس بعدازظهر چهارشنبه‌ام را با پرخوری TikToks یکی از خالقان در یک سینما گذراندم. مکس زاویدو، کمدین و سازنده محتوا ساکن نیویورک، بیش از 300 تیک تاک خود را نمایش داد. زاویدو از مردم می خواست که \"عذاب\" تماشای مجدد همه ویدیوهای او را احساس کنند - و مسیر حرفه ای او را ببینند. یک ساعت، 100 TikToks، یک صفحه نمایش بزرگ. تعطیلات ناهار روز چهارشنبه را اینگونه گذراندم. مکس زاویدو، یک سازنده محتوا در نیویورک با 1.4 میلیون دنبال کننده TikTok، تئاتر تاریخی Cherry Lane را برای نمایش بیش از 300 TikToks خود رزرو کرد. زاویدو که در ردیف اول با دوربینی که واکنش‌هایش را به‌طور زنده پخش می‌کند، قرار گرفته بود، تقریباً تمام ویدیوهایی را که در پنج سال گذشته ساخته بود از جلوی چشمانش تماشا کرد. او بغض کرد، خندید و در مورد حرفه خود فکر کرد. واکنش‌های زنده Zavidow به TikToks خودش: هق هق و خنده. مکس زاویدو به من گفت: «مشاهده کارهای قدیمی شما سخت است. این نمایش تا حدی تقلیدی از فیلم «#ALLMYMOVIES» شیعه لابوف بود که در آن این بازیگر در سال 2015 به مدت 72 ساعت در حال تماشای فیلم‌هایش بود. زاویدو که پست TikToks را در پایان سال 2021 آغاز کرد، می‌خواست این نمایش «تصویر کاملی از محتوای حرفه‌ای به‌عنوان یک محتوا در اینترنت ترسیم کند». او گفت: «می‌خواستم مردم عذابی را که من باید به گذشته نگاه کنم، احساس کنند. کل آزمایش چ ency to Accenture Song earlier this year. The creator economy has seen explosive growth. Ad spending in the category has grown four times as fast as media overall and is set to hit $44 billion this year in the US, according to the Interactive Advertising Bureau . H.I.G. Capital's entrance into the sector reflects financial giants' increasing recognition of the creator economy's potential. It also shows how financial buyers are taking a roll-up approach to fuel the industry's expansion, rather than waiting for it to reach scale. Eric Tencer, managing director of H.I.G. Growth, said factors like the IAB stats, along with his personal experience, forged his conviction in the space. \"I've got a 10th grader and a 7th grader at home, and I've been fighting a losing battle around, 'Why don't you just watch normal TV or movies,' and they go straight to TikTok and Instagram,\" he said. H.I.G. Capital's view is that the ecosystem of businesses serving brands and creators is fragmented, while creators are building increasingly complex companies that require more expertise. Tencer said H.I.G. Capital chose a talent management agency for its first acquisition because it believed that putting creators at the core would", "date_str": "2026-11-13T13:00:01+00:00", "hash": "10405fad271e4bd2", "title_fa": "یک غول سهام خصوصی به تازگی یک شرکت سازنده را خریداری کرده است و به مرحله بعدی سرمایه گذاری در این بخش اشاره می کند.", "summary_fa": "اریک تنسر، مدیر عامل H.I.G. رشد، و جیک روزن، بنیانگذار Jake Rosen Entertainment، در جستجوی معاملات اقتصاد سازندگان هستند. H.I.G. رشد H.I.G. سرمایه با خرید Jake Rosen Entertainment شروع به شرط بندی روی اقتصاد سازنده است. غول PE در نظر دارد یک شرکت به سبک Whalar Group ایجاد کند که در خدمت برندها و استعدادها باشد. PE نقش کوچک اما رو به رشدی را در اقتصاد خالق ایفا می کند که نشانه بلوغ این بخش است. اقتصاد خالق در حال جلب توجه سهام خصوصی است. H.I.G. کپیتال، یک غول سرمایه‌گذاری با سرمایه 76 میلیارد دلاری تحت مدیریت، پلتفرمی به نام Waveborn را برای به دست آور
