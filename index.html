انادا نیز ممنوع خواهد بود. وزارت خارجه کانادا گفته است جمهوری اسلامی از سال ۲۰۰۹ محدودیت اینترنت و خدمات تلفن همراه را به‌طور فزاینده‌ای برای کنترل گردش اطلاعات، پنهان‌کردن موارد نقض حقوق بشر و جلوگیری از سازمان‌دهی اعتراضات به کار گرفته است. به‌گفته اتاوا، این محدودیت‌ها در جریان اعتراضات «زن، زندگی، آزادی» در سال ۱۴۰۱ و اعتراضات دی‌ماه ۱۴۰۴ به‌طور گسترده اعمال شدند. کانادا می‌گوید قطع سراسری اینترنت در اعتراضات دی‌ماه حدود سه هفته ادامه داشت."}, {"source": "IranWire", "title": "سال تحصیلی جدید و کودکان بازمانده از تحصیل در کردستان", "link": "https://iranwire.com/fa/special-features/157998-%D8%B3%D8%A7%D9%84-%D8%AA%D8%AD%D8%B5%DB%8C%D9%84%DB%8C-%D8%AC%D8%AF%DB%8C%D8%AF-%D9%88-%DA%A9%D9%88%D8%AF%DA%A9%D8%A7%D9%86-%D8%A8%D8%A7%D8%B2%D9%85%D8%A7%D9%86%D8%AF%D9%87-%D8%A7%D8%B2-%D8%AA%D8%AD%D8%B5%DB%8C%D9%84-%D8%AF%D8%B1-%DA%A9%D8%B1%D8%AF%D8%B3%D8%AA%D8%A7%D9%86/", "summary": "سال تحصیلی جدید در کردستان در حالی آغاز می‌شود که بر اساس اعلام مسوولان آموزش‌وپرورش استان، یک‌هزار و ۱۷۰ دانش‌آموز همچنان از تحصیل بازم ...", "date_str": "2026-09-23T16:43:22+00:00", "hash": "881717c0242cbb92", "title_fa": "سال تحصیلی جدید و کودکان بازمانده از تحصیل در کردستان", "summary_fa": "سال تحصیلی جدید در کردستان در حالی آغاز می‌شود که بر اساس اعلام مسوولان آموزش‌وپرورش استان، یک‌هزار و ۱۷۰ دانش‌آموز همچنان از تحصیل بازم ... مانند هر نقطه دیگری در ایران، کردستان نیز سال تحصیلی را آغاز می‌کند، پدر و مادرها از چند روز قبل تدارک این روزها را دیده‌اند. اما واقعیت فراتر از شروع یک سال تحصیلی عادی است؛ بخش زیادی از پدر و مادرها نتوانسته‌اند یک آغاز خوب را برای کودکان مهیا کنند، برخی کودکان به‌دلایل مختلف از تحصیل بازمانده‌اند و شرایط موجود همچنان مورد نقد فعالان و انجمن‌های صنفی است. اما همزمان مدیرکل آموزش و پرورش کردستان، «عدالت، کیفیت و هویت» را سه مفهوم اساسی و نقشه راه آموزش و پرورش استان عنوان کرده است . «فواد حسینی»، عدالت را فراهم کردن فرصت یادگیری و شکوفایی استعدادها برای تمامی دانش‌آموزان دانسته است. با این حال، وجود بیش از هزار دانش‌آموز بازمانده از تحصیل و بازگشت حدود ۶۰۰ کودک به چرخه آموزش، نخستین پرسش را درباره میزان تحقق همین مفهوم مطرح می‌کند: آیا همه کودکان در کردستان از فرصت برابر برای ورود به مدرسه و ادامه تحصیل برخوردارند؟ بخشی از این نابرابری را می‌توان در ابتدایی‌ترین نیازهای دانش‌آموزان، یعنی تامین لوازم تحصیل، مشاهده کرد. گزارش‌های موجود از شرایطی حکایت دارد که برخی خانواده‌ها حتی برای تامین کیف، کفش، لباس و لوازم‌التحریر فرزندان خود با مشکل مواجه‌اند. پدری که ۱۵ سال سابقه کار در یک کارگاه دارد، درباره هزینه‌های آغاز سال تحصیلی می‌گوید که حقوق ماهانه‌اش به ۴۰ میلیون تومان نمی‌رسد و برآورد خانواده نشان می‌دهد که هزینه کیف، کفش، لباس و لوازم آموزشی دو فرزندشان تقریبا تمام حقوق یک ماه را می‌بلعد؛ آن‌هم در شرایطی که به گفته او حقوق شهریورماه معمولا تا نیمه مهر پرداخت نمی‌شود. او می‌گوید فعلاً از فرزندان خود خواسته است از لباس و لوازم سال گذشته استفاده کنند تا حقوق دریافت شود."}, {"source": "IranWire", "title": "پروازهای خارجی ایران زیر فشار تحریم‌های آمریکا؛ مسیرهای هوایی یکی‌یکی بسته می‌شوند", "link": "https://iranwire.com/fa/news-1/158030-%D9%BE%D8%B1%D9%88%D8%A7%D8%B2%D9%87%D8%A7%DB%8C-%D8%AE%D8%A7%D8%B1%D8%AC%DB%8C-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D8%B2%DB%8C%D8%B1-%D9%81%D8%B4%D8%A7%D8%B1-%D8%AA%D8%AD%D8%B1%DB%8C%D9%85%D9%87%D8%A7%DB%8C-%D8%A2%D9%85%D8%B1%DB%8C%DA%A9%D8%A7-%D9%85%D8%B3%DB%8C%D8%B1%D9%87%D8%A7%DB%8C-%D9%87%D9%88%D8%A7%DB%8C%DB%8C-%DB%8C%DA%A9%DB%8C%DB%8C%DA%A9%DB%8C-%D8%A8%D8%B3%D8%AA%D9%87-%D9%85%DB%8C%D8%B4%D9%88%D9%86%D8%AF/", "summary": "سه روز پس از اعمال تحریم‌های جدید واشنگتن علیه صنعت هوانوردی ایران، همچنان برخی فرودگاه‌های دنیا پذیرای هواپیماهای جمهوری اسلامی هستند. ...", "date_str": "2026-09-24T12:54:26+00:00", "hash": "ac1dbec0ff45b52b", "title_fa": "پروازهای خارجی ایران زیر فشار تحریم‌های آمریکا؛ مسیرهای هوایی یکی‌یکی بسته می‌شوند", "summary_fa": "سه روز پس از اعمال تحریم‌های جدید واشنگتن علیه صنعت هوانوردی ایران، همچنان برخی فرودگاه‌های دنیا پذیرای هواپیماهای جمهوری اسلامی هستند. ... «اسکات بسنت»، وزیر خزانه‌داری آمریکا، دوم مهر ۱۴۰۵ ادعا کرد که در پی گسترش تحریم‌های واشنگتن علیه صنعت هوانوردی ایران، ۸۰ تا ۹۰ درصد پروازهای خارجی این کشور متوقف شده‌اند. بسنت در گفت‌وگو با فاکس‌نیوز توضیح داد بود: «ما ایرانی‌ها را به شکلی تحت فشار قرار داده‌ایم که پیش‌ازاین هرگز نظیر آن را ندیده‌اند.» وزیر خزانه‌داری آمریکا همچنین با اشاره به حضور هیات جمهوری اسلامی در مجمع عمومی سازمان ملل گفت مطمئن نیست مقام‌های ایرانی چگونه به کشورشان باز خواهند گشت. با این حال خبرگزاری فرانسه گزارش داده است که با وجود لغو گسترده پروازها، شماری از مسیرهای خارجی پس از اجرایی‌شدن محدودیت‌های تازه همچنان فعال بوده‌اند. جمهوری آذربایجان و گرجستان رسما توقف پذیرش پروازهای شرکت‌های هواپیمایی ایرانی را تایید کرده‌اند. هم‌زمان، رسانه‌های داخل ایران گزارش داده‌اند که امارات متحده عربی در پی اجرای تحریم‌های آمریکا، پذیرش پروازهای شرکت‌های هواپیمایی ایرانی را متوقف کرده است. گزارش‌هایی از توقف پروازها به بغداد، مسقط و قطر نیز منتشر شده است، اما درباره قطر هنوز تایید رسمی مشابهی از سوی مقام‌های هوانوردی این کشور در دست نیست. در عراق نیز پروازهای بغداد متوقف شده‌اند، درحالی‌که مسیر نجف همچنان فعال گزارش شده است. شرکت ماهان پروازهای خود به استانبول و آنکارا را متوقف کرده، اما سایر شرکت‌های ایرانی همچنان برخی پروازهای این مسیر را انجام داده‌اند. ترکمنستان نیز روز پنج‌شنبه ۲مهر به یک هواپیمای ایرانی در مسیر تهران‌ـ‌دوشنبه اجازه عبور از حریم هوایی خود نداد و این پرواز ناچار به تهران بازگشت. مقام‌های ترکمنستان تاکنون بسته‌شدن کامل آسمان این کشور به روی تمامی پروازهای ایرانی را اعلام نکرده‌اند."}, {"source": "IranWire", "title": "اعتراض خانواده‌های دادخواه کشتار دی‌ماه به صحبت‌های پزشکیان در سازمان ملل", "link": "https://iranwire.com/fa/news-1/158035-%D8%A7%D8%B9%D8%AA%D8%B1%D8%A7%D8%B6-%D8%AE%D8%A7%D9%86%D9%88%D8%A7%D8%AF%D9%87%D9%87%D8%A7%DB%8C-%D8%AF%D8%A7%D8%AF%D8%AE%D9%88%D8%A7%D9%87-%DA%A9%D8%B4%D8%AA%D8%A7%D8%B1-%D8%AF%DB%8C%D9%85%D8%A7%D9%87-%D8%A8%D9%87-%D8%B5%D8%AD%D8%A8%D8%AA%D9%87%D8%A7%DB%8C-%D9%BE%D8%B2%D8%B4%DA%A9%DB%8C%D8%A7%D9%86-%D8%AF%D8%B1-%D8%B3%D8%A7%D8%B2%D9%85%D8%A7%D9%86-%D9%85%D9%84%D9%84/", "summary": "پس از پخش سخنرانی «مسعود پزشکیان»، رییس دولت چهاردهم در صحن علنی سازمان ملل پخش شد بسیاری از چهره‌های مخالف حکومت، به‌ویژه خانواده‌های د ...", "date_str": "2026-09-24T14:12:06+00:00", "hash": "722e312066ce21a9", "title_fa": "اعتراض خانواده‌های دادخواه کشتار دی‌ماه به صحبت‌های پزشکیان در سازمان ملل", "summary_fa": "پس از پخش سخنرانی «مسعود پزشکیان»، رییس دولت چهاردهم در صحن علنی سازمان ملل پخش شد بسیاری از چهره‌های مخالف حکومت، به‌ویژه خانواده‌های د ... برخی از خانواده‌های کشته‌شدگان اعتراضات دی‌ماه در شبکه اجتماعی ایکس با تگ کردن حساب سازمان ملل، در متنی به انگلیسی گواهی داده‌اند که زمانی که عزیزانشان «توسط جمهوری اسلامی کشته شدند مسلح نبودند و از طرف هیچ کشور خارجی فعالیت نمی‌کردند.» پزشکیان در این سخنرانی، تجمع‌های خیابانی از زمان جنگ آمریکا و اسراییل با ایران را نشانه‌ای از «حمایت مردم ایران از نظام جمهوری اسلامی و قدرتمندی آن» توصیف کرد. پس از پخش سخنرانی «مسعود پزشکیان»، رییس دولت چهاردهم در صحن علنی سازمان ملل پخش شد بسیاری از چهره‌های مخالف حکومت، به‌ویژه خانواده‌های دادخواه کشته‌شدگان جنبش‌های اجتماعی نسبت به این اظهارنظرها واکنش‌های اعتراضی نشان دادند. پزشکیان در بخشی از سخنرانی خود، در اظهاراتی بی‌آنکه از کشتار و سرکوب شهروندان در دی‌ماه۱۴۰۴ سخن بگوید گفت: «ملت ایران در هفت ماه گذشته، هر شب در خیابان بودند برای اینکه از ایران‌مان دفاع کنند و برای اینکه اجازه ندهند کسانی را که آمریکا و اسراییل تهییج کرده بود، اسلحه دست‌شان داده بود، دست‌شان بیایند و ناامنی در داخل کشور ایجاد کنند.» او در این سخنرانی، تجمع‌های خیابانی از زمان جنگ آمریکا و اسراییل با ایران را نشانه‌ای از «حمایت مردم ایران از نظام جمهوری اسلامی و قدرتمندی آن» توصیف کرد. آنها نوشته‌اند: «ما به دنبال پذیرش مسوولیت، حقیقت و عدالت هستیم.» خواهر «سینا کاظمی»، از کشته‌شدگان دی‌ماه نوشت: «چقدر سخته در دنیایی زندگی کنی که به قاتل عزیزت تریبون میدن و کسی صدای تورو نمی‌شنوه…» لطفا کاری کنید صدای جاویدنامها و خانواده‌هاشون به گوش دنیا برسه. عزیزان ما کاملا مسالمت آمیز با آرزوی آزادی به خیابان رفتن، اما با گلوله جنگی رو به رو شدن. خانواده‌هامون از هم پاشید، زندگیامون تغییر کرد و آرزوها و آینده بچه‌هامون نابود"}, {"source": "IranWire", "title": "سرتیپ حسین ظریفی، فرمانده قرارگاه سپاه در سراوان کشته شد", "link": "https://iranwire.com/fa/news-1/158000-%D8%B3%D8%B1%D8%AA%DB%8C%D9%BE-%D8%AD%D8%B3%DB%8C%D9%86-%D8%B8%D8%B1%DB%8C%D9%81%DB%8C-%D9%81%D8%B1%D9%85%D8%A7%D9%86%D8%AF%D9%87-%D9%82%D8%B1%D8%A7%D8%B1%DA%AF%D8%A7%D9%87-%D8%B3%D9%BE%D8%A7%D9%87-%D8%AF%D8%B1-%D8%B3%D8%B1%D8%A7%D9%88%D8%A7%D9%86-%DA%A9%D8%B4%D8%AA%D9%87-%D8%B4%D8%AF/", "summary": "روابط‌عمومی قرارگاه قدس نیروی زمینی سپاه پاسداران، از کشته‌شدن سرتیپ حسین ظریفی، فرمانده عملیاتی قرارگاه سجاد شهرستان سراوان، در جریان ی ...", "date_str": "2026-09-23T18:10:35+00:00", "hash": "56e07e15f29c27f0", "title_fa": "سرتیپ حسین ظریفی، فرمانده قرارگاه سپاه در سراوان کشته شد", "summary_fa": "روابط‌عمومی قرارگاه قدس نیروی زمینی سپاه پاسداران، از کشته‌شدن سرتیپ حسین ظریفی، فرمانده عملیاتی قرارگاه سجاد شهرستان سراوان، در جریان ی ... روابط عمومی سپاه، روز اول مهر ۱۴۰۵، در بیانیه خود نوشت ظریفی در جریان «آخرین عملیات رزمندگان این قرارگاه در منطقه سراوان» کشته شده است. همزمان، حال‌وش گزارش داده است که احمد هراتی زراعتی، مسوول اطلاعات قرارگاه عملیاتی سجاد سراوان، نیز در جریان درگیری نیروهای نظامی با افراد مسلح در منطقه جهاد آباد سراوان کشته شده است. بر اساس گزارش حال‌وش، این درگیری روز چهارشنبه یکم مهر رخ داده و دست‌کم ۱۳ نیروی نظامی و امنیتی دیگر نیز در جریان آن به‌شدت زخمی شده‌اند. منابع محلی و شاهدان عینی به حال‌وش گفته‌اند حسین ظریفی بر اثر اصابت دو گلوله به گردن و ران پا کشته شده و پیکر او در سردخانه بیمارستان رازی سراوان نگهداری می‌شود. به گفته این منابع، احمد هراتی زراعتی نیز در اثر اصابت گلوله جان باخته است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید"}, {"source": "IranWire", "title": "نیشکر دعبل خزاعی؛ چرا خوزستان کانون بحران‌های کارگری است؟", "link": "https://iranwire.com/fa/features/158002-%D9%86%DB%8C%D8%B4%DA%A9%D8%B1-%D8%AF%D8%B9%D8%A8%D9%84-%D8%AE%D8%B2%D8%A7%D8%B9%DB%8C-%DA%86%D8%B1%D8%A7-%D8%AE%D9%88%D8%B2%D8%B3%D8%AA%D8%A7%D9%86-%DA%A9%D8%A7%D9%86%D9%88%D9%86-%D8%A8%D8%A ‌های جمهوری اسلامی به خانواده او گفته‌اند که وی بر اثر سقوط از ارتفاعات مرزی جان باخته، اما سوابق پزشکی قانونی حاکی از اصابت گلوله به سر او بوده است. در مورد دیگری، میلاد تاباد، ۲۸ ساله، روز ۱۸ اوت ۲۰۲۶ درگذشت. او نزدیک به یک سال پیش از آن بر اثر اصابت گلوله نیروهای مرزی به سرش زخمی شده بود و ماه‌ها در بخش مراقبت‌های ویژه بستری بود. خانواده او به دلیل ناتوانی مالی در ادامه هزینه درمان، او را برای مراقبت به خانه منتقل کرده بودند. کارشناسان سازمان ملل تاکید کردند حتی در مواردی که افراد به حمل"}, {"source": "IranWire", "title": "تریبون وفاق، منبر دوئل؛ چطور زبان پزشکیان در سازمان ملل تغییر کرد؟", "link": "https://iranwire.com/fa/features/158004-%D8%AA%D8%B1%DB%8C%D8%A8%D9%88%D9%86-%D9%88%D9%81%D8%A7%D9%82-%D9%85%D9%86%D8%A8%D8%B1-%D8%AF%D9%88%D8%A6%D9%84-%DA%86%D8%B7%D9%88%D8%B1-%D8%B2%D8%A8%D8%A7%D9%86-%D9%BE%D8%B2%D8%B4%DA%A9%DB%8C%D8%A7%D9%86-%D8%AF%D8%B1-%D8%B3%D8%A7%D8%B2%D9%85%D8%A7%D9%86-%D9%85%D9%84%D9%84-%D8%AA%D8%BA%DB%8C%DB%8C%D8%B1-%DA%A9%D8%B1%D8%AF/", "summary": "«هیچ‌کس در این منطقه به تنهایی امنیت نخواهد داشت. یا امنیت را با یکدیگر خواهیم ساخت یا ناامنی را با یکدیگر تحمل خواهیم کرد.» «مسعود پزشک ...", "date_str": "2026-09-24T07:13:21+00:00", "hash": "63085ade83a7c875", "title_fa": "تریبون وفاق، منبر دوئل؛ چطور زبان پزشکیان در سازمان ملل تغییر کرد؟", "summary_fa": "«هیچ‌کس در این منطقه به تنهایی امنیت نخواهد داشت. یا امنیت را با یکدیگر خواهیم ساخت یا ناامنی را با یکدیگر تحمل خواهیم کرد.» «مسعود پزشک ... «مسعود پزشکیان»، در هشتادویکمین مجمع عمومی سازمان ملل متحد خطاب به کشورهای منطقه را با ناامنی تهدید کرد. این زبان جدید رییس‌جمهوری که سه سال پیش در همین تریبون از صلح حرف زده بود، در درون حکومت با استقبال مواجه شد. پس از سخنرانی پزشکیان در مجمع عمومی سازمان ملل ، روزنامه کیهان نطق او را «طوفانی و دندان‌شکن» خواند. «هیچ‌کس در این منطقه به تنهایی امنیت نخواهد داشت. یا امنیت را با یکدیگر خواهیم ساخت یا ناامنی را با یکدیگر تحمل خواهیم کرد.» «مسعود پزشکیان»، رییس‌جمهور ایران، این تهدید را در هشتادویکمین مجمع عمومی سازمان ملل متحد خطاب به کشورهای منطقه مطرح کرد که نمایندگان برخی از آن‌ها در سالن نشسته بودند، آن هم در سخنرانی‌ای که بخش اعظم آن پاسخ به همتای آمریکایی‌اش بود. او از آمادگی جمهوری اسلامی هم برای جنگی دیگر گفت و هم برای صلح و در عین حال بر بی‌عدالتی در نظام جهانی تاکید کرد. اما همین یک جمله نشان داد که سیاست تهران همچنان منطقه‌ای کردن جنگ است. «دونالد ترامپ»، رییس‌جمهور آمریکا، سه‌شنبه ۳۱ شهریور بخش قابل توجهی از سخنرانی خود در هشتادویکمین مجمع عمومی سازمان ملل متحد را به ایران اختصاص داد. او ایران را «حامی شماره یک تروریسم در جهان» خواند ، از نابودی بخش‌های عمده‌ای از توان نظامی ایران در عملیات‌های اخیر گفت و تاکید کرد «من هرگز اجازه نخواهم داد ایران به سلاح هسته‌ای دست یابد». ترامپ سپس تهران را میان دو گزینه گذاشت و گفت «من باید تصمیم بزرگی بگیرم؛ آیا توافقی با ایران صورت می‌گیرد که به آنها اجازه بازسازی دهد، یا اینکه جمهوری اسلامی را به سرعت نابود کنم و آن‌ها را بدون هیچ شانس بقایی به جهنم بفرستم؟»"}, {"source": "IranWire", "title": "حذف امید؛ از بازجویی روانخواه تا پروژه حسین عبدی در راهپیمایی حکومتی", "link": "https://iranwire.com/fa/features/158005-%D8%AD%D8%B0%D9%81-%D8%A7%D9%85%DB%8C%D8%AF-%D8%A7%D8%B2-%D8%A8%D8%A7%D8%B2%D8%AC%D9%88%DB%8C%DB%8C-%D8%B1%D9%88%D8%A7%D9%86%D8%AE%D9%88%D8%A7%D9%87-%D8%AA%D8%A7-%D9%BE%D8%B1%D9%88%DA%98%D9%87-%D8%AD%D8%B3%DB%8C%D9%86-%D8%B9%D8%A8%D8%AF%DB%8C-%D8%AF%D8%B1-%D8%B1%D8%A7%D9%87%D9%BE%DB%8C%D9%85%D8%A7%DB%8C%DB%8C-%D8%AD%DA%A9%D9%88%D9%85%D8%AA%DB%8C/", "summary": "در فوتبال ایران، انتخاب و برکناری مربیان تیم‌های ملی نه «همیشه» که دیگر «هرگز» تابع نتیجه در زمین نیست. «مواضع سیاسی»، «میزان همراهی با ...", "date_str": "2026-09-24T07:32:15+00:00", "hash": "2f72333f17e71793", "title_fa": "حذف امید؛ از بازجویی روانخواه تا پروژه حسین عبدی در راهپیمایی حکومتی", "summary_fa": "در فوتبال ایران، انتخاب و برکناری مربیان تیم‌های ملی نه «همیشه» که دیگر «هرگز» تابع نتیجه در زمین نیست. «مواضع سیاسی»، «میزان همراهی با ... سرنوشت دو سرمربی اخیر تیم امید، نمونه‌ای روشن از همین سازوکار است؛ «امید روانخواه» پس از حمایت علنی از اعتراضات مردم ایران و واکنش به کشتار و سرکوب ایرانیان در جریان اعتراضات دی‌ماه ۱۴۰۴، هنگام بازگشت به کشور بازداشت و بازجویی شد، پاسپورتش را ضبط کردند و کمی بعد، با وجود قراردادی که هنوز اعتبار داشت، از تیم امید کنار گذاشته شد. جانشین او «حسین عبدی» بود؛ مربی‌ای که طی سال‌های گذشته در برنامه‌های مورد حمایت حکومت، از انتخابات ریاست‌جمهوری و راهپیمایی ۲۲بهمن تا مراسم یادبود «ابراهیم رئیسی»، حضوری آشکار داشته است. فدراسیون فوتبال انتخاب حسین عبدی را بخشی از یک «پروژه بزرگ» تا جام جهانی۲۰۳۰ معرفی کرد؛ پروژه‌ای که نخستین آزمون جدی‌اش در «ناگویا»، به حذف تیم امید در همان مرحله گروهی و میان ساده‌ترین حریفان رسید. تیم امید روز گذشته (اول مهر ۱۴۰۵) با شکست ۴ بر یک مقابل کره شمالی از دور رقابت‌ها حذف شد. انتخاب «حسین عبدی» به‌عنوان سرمربی تیم فوتبال امید ایران در اردیبهشت۱۴۰۵ و کمتر از چهار ماه مانده به بازی‌های آسیایی ناگویا قطعی شد. خبرگزاری تسنیم ۱۸اردیبهشت نوشت فدراسیون فوتبال پس از مذاکره با گزینه‌های مختلف به حسین عبدی رسیده و او برنامه خود برای بازی‌های آسیایی را نیز به فدراسیون ارایه کرده است. یک روز بعد، انتصاب حسین عبدی به‌عنوان جانشین امید روانخواه علنی شد. «مهدی تاج»، رییس فدراسیون فوتبال، بعدها توضیح داد که انتخاب حسین عبدی «تصمیمی مقطعی» برای بازی‌های آسیایی نبوده. رییس فدراسیون فوتبال، مدعی شد که حسین عبدی همکاری با این فدراسیون را از تیم نوجوانان آغاز کرده، عملکرد مثبتی داشته و حالا همراه نسلی از بازیکنانش، ابتدا به تیم جوانان و بعد به تیم امید رسیده است."}, {"source": "IranWire", "title": "کالایی‌شدن آموزش؛ آتش کینه در کرج، شهریه‌های میلیاردی در شمال تهران", "link": "https://iranwire.com/fa/special-features/158006-%DA%A9%D8%A7%D9%84%D8%A7%DB%8C%DB%8C%D8%B4%D8%AF%D9%86-%D8%A2%D9%85%D9%88%D8%B2%D8%B4-%D8%A2%D8%AA%D8%B4-%DA%A9%DB%8C%D9%86%D9%87-%D8%AF%D8%B1-%DA%A9%D8%B1%D8%AC-%D8%B4%D9%87%D8%B1%DB%8C%D9%87%D9%87%D8%A7%DB%8C-%D9%85%DB%8C%D9%84%DB%8C%D8%A7%D8%B1%D8%AF%DB%8C-%D8%AF%D8%B1-%D8%B4%D9%85%D8%A7%D9%84-%D8%AA%D9%87%D8%B1%D8%A7%D9%86/", "summary": "کم‌تر از چهار سال پیش بود که خبری تلخ رسانه‌ای شد. «میثم» دانش‌آموز ۱۷ساله کرجی، پس از آن‌که به دلیل نداشتن بخشی از شهریه‌اش از ادامه تح ...", "date_str": "2026-09-24T07 حده در بهار امسال چند نفتکش مرتبط با صادرات نفت ایران را در اقیانوس هند توقیف کرده بود. گزارش‌های منتشرشده در ماه مه نیز از توقیف «اسکای‌ویو» و ارتباط آن با انتقال نفت ایران خبر داده بودند. «مجستیک ایکس» نفتکشی بدون تابعیت است که پیش‌تر با نام «فونیکس» فعالیت می‌کرد. این کشتی فروردین امسال در حالی که به سمت چین در حرکت بود، در اقیانوس هند توقیف شد. وزارت دفاع آمریکا پیش‌تر اعلام کرده است عملیات دریایی برای مختل کردن شبکه‌های ناقض تحریم‌ها ادامه خواهد یافت و آب‌های بین‌المللی نباید به پناهگاهی برای کشتی‌های تحریم‌شده تبدیل شود. انتقال محموله‌های توقیفی در شرایطی انجام می‌شود که صادرات نفت خام ایران در هفته‌های اخیر به‌شدت محدود شده است. رویترز اول‌سپتامبر به نقل از شرکت‌های ردیابی نفتکش‌ها، از جمله تانکر ترکرز، گزارش داد که برای حدود هفت هفته محموله قابل‌توجهی از نفت خام ایران از تنگه هرمز به مقصد چین عبور نکرده بود."}, {"source": "IranWire", "title": "دیوان عالی اعاده دادرسی ارغوان فلاحی را پذیرفت؛ اجرای اعدام متوقف شد", "link": "https://iranwire.com/fa/news-1/158008-%D8%AF%DB%8C%D9%88%D8%A7%D9%86-%D8%B9%D8%A7%D9%84%DB%8C-%D8%A7%D8%B9%D8%A7%D8%AF%D9%87-%D8%AF%D8%A7%D8%AF%D8%B1%D8%B3%DB%8C-%D8%A7%D8%B1%D8%BA%D9%88%D8%A7%D9%86-%D9%81%D9%84%D8%A7%D8%AD%DB%8C-%D8%B1%D8%A7-%D9%BE%D8%B0%DB%8C%D8%B1%D9%81%D8%AA-%D8%A7%D8%AC%D8%B1%D8%A7%DB%8C-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85-%D9%85%D8%AA%D9%88%D9%82%D9%81-%D8%B4%D8%AF/", "summary": "حکم اعدام «ارغوان فلاحی»، زندانی سیاسی محبوس در زندان اوین، پس از پذیرش اعاده دادرسی متوقف شده و پرونده او قرار است برای رسیدگی مجدد به ...", "date_str": "2026-09-24T08:22:47+00:00", "hash": "c5f65676ce6f1ae4", "title_fa": "دیوان عالی اعاده دادرسی ارغوان فلاحی را پذیرفت؛ اجرای اعدام متوقف شد", "summary_fa": "حکم اعدام «ارغوان فلاحی»، زندانی سیاسی محبوس در زندان اوین، پس از پذیرش اعاده دادرسی متوقف شده و پرونده او قرار است برای رسیدگی مجدد به ... رسانه «امتداد» خبر داد که ایرادات و اعتراض‌های مطرح‌شده نسبت به پرونده فلاحی در جریان رسیدگی به درخواست اعاده دادرسی او در دیوان عالی کشور پذیرفته شده است. بر این اساس، اجرای حکم اعدام تا برگزاری دادگاه مجدد متوقف خواهد ماند. ارغوان فلاحی، متولد سال۱۳۸۰، در تیر۱۴۰۵ از سوی شعبه ۱۵ دادگاه انقلاب تهران به ریاست «ابوالقاسم صلواتی» به اتهام «بغی» به اعدام محکوم شده بود. شعبه ۴۱ دیوان عالی کشور نیز این حکم را تایید و فرجام‌خواهی او را رد کرده بود. خبر پذیرش اعاده دادرسی در حالی منتشر می‌شود که کمتر از دو هفته پیش، گزارش‌هایی از رد درخواست اعاده دادرسی این زندانی سیاسی منتشر شده بود. ایران‌وایر نیز ۲۰شهریور به نقل از امتداد گزارش داده بود که این درخواست رد شده و فلاحی در معرض اجرای حکم اعدام قرار گرفته است. امتداد اکنون نوشته است که اعاده دادرسی فلاحی طی روزهای اخیر بار دیگر در دیوان عالی کشور در حال رسیدگی بوده و «ایرادات و اعتراضات صورت‌گرفته نسبت به پرونده مورد پذیرش قرار گرفته است». با پذیرش اعاده دادرسی، پرونده باید برای رسیدگی دوباره به شعبه هم‌عرض فرستاده شود و دادگاه پس از برگزاری جلسه جدید، حکم تازه‌ای صادر کند. بنابراین، پذیرش اعاده دادرسی به معنای پایان پرونده یا رفع اتهام از فلاحی نیست، اما اجرای حکم اعدام قبلی را متوقف می‌کند. فلاحی پیش‌تر نیز در جریان اعتراضات «زن، زندگی، آزادی» بازداشت شده بود. او در بازداشت بعدی خود در بهمن۱۴۰۳ به بند ۲۰۹ زندان اوین منتقل شد. با تصمیم تازه دیوان عالی کشور، سرنوشت حکم اعدام ارغوان فلاحی اکنون به نتیجه رسیدگی مجدد در دادگاه بستگی دارد. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار"}, {"source": "IranWire", "title": "قتل فاطمه‌سادات طباطبایی در بم؛ همسرش به‌عنوان متهم اصلی پرونده بازداشت شد", "link": "https://iranwire.com/fa/news-1/158022-%D9%82%D8%AA%D9%84-%D9%81%D8%A7%D8%B7%D9%85%D9%87%D8%B3%D8%A7%D8%AF%D8%A7%D8%AA-%D8%B7%D8%A8%D8%A7%D8%B7%D8%A8%D8%A7%DB%8C%DB%8C-%D8%AF%D8%B1-%D8%A8%D9%85-%D9%87%D9%85%D8%B3%D8%B1%D8%B4-%D8%A8%D9%87%D8%B9%D9%86%D9%88%D8%A7%D9%86-%D9%85%D8%AA%D9%87%D9%85-%D8%A7%D8%B5%D9%84%DB%8C-%D9%BE%D8%B1%D9%88%D9%86%D8%AF%D9%87-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B4%D8%AA-%D8%B4%D8%AF/", "summary": "در ادامه زن‌کشی در ایران، «فاطمه‌سادات طباطبایی»، زن جوان ساکن شهرستان بم، به قتل رسیده و همسرش به‌عنوان متهم اصلی پرونده بازداشت شده اس ...", "date_str": "2026-09-24T11:23:18+00:00", "hash": "f9 تگاه عصبی با کارکردهای بسیار متفاوت کنار یکدیگر قرار گرفته و مغز انسان امروز را ساخته باشند. این کشف به پژوهشگران امکان داده است سلول‌های عصبی مغز پسین انسان (بخش پشتی مغز که در تنظیم کارکردهای حیاتی مانند تنفس و ضربان قلب نقش دارد) را در آزمایشگاه پرورش دهند؛ دستاوردی که برای مطالعه بیماری‌هایی مانند اسکلروز جانبی آمیوتروفیک (ALS)، آتروفی عضلانی نخاعی (SMA) و دیگر بیماری‌های درگیرکننده ساقه مغز، راه‌های تازه‌ای می‌گشاید. به گزارش ساینس دیلی ،‌ دانشمندان مدت‌ها مغز را اندامی واحد با منشا رشدی مشترک می‌دانستند، اما پژوهشی تازه‌ به سرپرستی دانشکده پزشکی استنفورد این فرض بنیادی را به چالش می‌کشد و نشان می‌دهد آنچه «مغز» می‌نامیم، ممکن است از دو سیستم متمایز ساخته شده باشد که طی صدها میلیون سال تکامل، جداگانه پدید آمده‌اند. بر اساس دیدگاهی که دهه‌ها غالب بود، تمام بخش‌های مغز از یک جمعیت اولیه از سلول‌های پیش‌ساز رشد می‌کنند. در این مدل، مغز پیشین، مغز میانی و مغز پسین همگی به یک نقطه آغاز مشترک در فرایند رشد بازمی‌گردند، اما یافته‌های تازه تصویر متفاوتی ارائه می‌کنند. پژوهشگران دریافتند که مغز انسان ظاهرا ترکیبی از دو دستگاه عصبی تکامل‌یافته در گذشته‌های بسیار دور است که یکی ساختارهایی را پدید می‌آورد که مسئول کارکردهای حیاتی مانند تنفس و تنظیم ضربان قلب‌اند و دیگری نواحی مرتبط با توانایی‌هایی مانند زبان، ریاضیات، تفکر انتزاعی و تأمل درباره وجود خودمان را ایجاد می‌کند. یافته‌های این پژوهش که در نشریه نیچر نوروساینس (Nature Neuroscience) منتشر شد، شاید توضیح دهد چرا پرورش بعضی از سلول‌های مغزی در آزمایشگاه تا این اندازه دشوار است. همچنین می‌تواند برای بررسی بیماری‌های درگیرکننده ساقه مغز، از جمله آتروفی عضلانی نخاعی و اسکلروز جانبی آمیوتروفیک‌ــ که به بیماری لو گریگ نیز معروف است‌ــ فرصت‌های تازه‌ای فراهم کند. کایل لو، دانشیار زیست‌شناسی تکوینی، گفت: «برای نخستین بار نشان داده‌ایم که بخش جلویی مغز از سلول پیش‌سازی کاملا متفاوت با بخش پشتی آن پدید می‌آید. کشف ما به این معنا است که اکنون می‌توانیم نورون‌های بخش پشتی مغز، یعنی مغز پسین، را در آزمایشگاه پرورش دهیم و کارکرد آن‌ها را مطالعه کنیم.» دو منشأ رشدی برای مغز مغز بالغ به سه بخش اصلی تقسیم می‌شود: مغز پیشین، مغز میان  فدرال در آمریکا به‌طور موقت اقدام دونالد ترامپ برای ممنوع کردن ورود سه رسانه خبری به کاخ سفید را لغو کرده و به دولت او دستور داده است دسترسی این رسانه‌ها را دوباره برقرار کند. شبکه‌های خبری سی‌ان‌ان، ام‌اس ناو و پولیتیکو این ممنوعیت را «نقض آشکار» حق قانونی آزادی مطبوعات و نوعی تبعیض دانسته بودند. آقای ترامپ در ابتدا گفته بود که دسترسی این رسانه‌ها به کاخ سفید را به دلیل انتشار «اخبار جعلی» قطع کرده است. اما کاخ سفید بعدا بدون ارائه شواهد، آن‌ها را متهم کرد که «امنیت ملی» را به خطر انداخته‌اند. این دستور موقت که ممنوعیت دسترسی این رسانه‌ها به کاخ سفید را لغو می‌کند، به مدت ۱۴ روز برقرار خواهد بود تا دادگاه فرصت داشته باشد پرونده را با دقت بیشتری بررسی کند. تیموتی کلی، قاضی این دادگاه که ترامپ او را منصوب کرده، گفته است که فکر می‌کند روند قانونی در مورد قطع دسترسی این رسانه‌ها به کاخ سفید، به درستی طی نشده است. این سه رسانه پس از آنکه کارت‌های ورود خبرنگارانشان به کاخ سفید ضبط و دسترسی آنها قطع شد، از دولت شکایت کردند. دولت دونالد ترامپ در دادگاه از این اقدام دفاع کرد و این رسانه‌ها را به انتشار اطلاعات نادرست و تهدید امنیت ملی متهم کرد؛ اما دادگاه این استدلال را نپذیرفت. کاخ سفید هنوز درباره این حکم اظهار نظر نکرده و وکلای رئیس‌جمهور ممکن است اقدامات قانونی بیشتری انجام دهند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. قاضی در حکم خود گفت که این سه رسانه احتمالاً می‌توانند ثابت کنند که کاخ سفید هنگام اجرای این ممنوعیت، «روند قانونی کافی» را رعایت نکرده است. او همچنین درباره استدلال دولت ترامپ مبنی بر این که این ممنوعیت با انگیزه‌های امنیت ملی اعمال شده، ابراز"}, {"source": "BBC Persian", "title": "کشته شدن دو فرمانده ارشد سپاه طی یک درگیری مسلحانه در سراوان", "link": "https://www.bbc.com/persian/articles/c63eqk5y48xwo?at_medium=RSS&at_campaign=rss", "summary": "قرارگاه منطقه‌ای قدس نیروی زمینی سپاه تأیید کرد که سرتیپ حسین ظریفی، فرمانده قرارگاه عملیاتی «شهید سجاد» سراوان، و سرگرد احمد هراتی زراعتی، مسئول اطلاعات قرارگاه سجاد چهارشنبه، اول مهرماه طی یک درگیری مسلحانه در این منطقه کشته ائو در این نامه نگرانی‌های گسترده درباره خرابی سیستم لوله‌کشی و کمبود مواد غذایی تازه را رد کرد، اما به «خرابی‌های مقطعی و محدود در لوله‌کشی» و مشکلاتی در واحدهای شیرین‌سازی آب و همچنین کاهش تنوع برخی وعده‌های غذایی برای مدتی «کوتاه» اذعان کرد. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید."}, {"source": "BBC Persian", "title": "دیدار ترامپ و شی؛ آیا ایران به محور اختلاف واشنگتن و پکن تبدیل می‌شود؟", "link": "https://www.bbc.com/persian/articles/c3x2zdyqqq7ko?at_medium=RSS&at_campaign=rss", "summary": "در رسانه‌های آمریکا دو روایت تا حدی متفاوت دیده می‌شود. در یک روایت، چین مهم‌ترین شریان اقتصادی باقی‌مانده برای ایران است و بنابراین بدون همکاری پکن، تلاش واشنگتن برای منزوی کردن اقتصادی تهران با محدودیت جدی روبه‌رو خواهد شد. در روایت دیگر، روابط آمریکا و چین چنان گسترده و حساس است که نه ترامپ و نه شی تمایل چندانی ندارند ایران به محور اصلی اختلافات در نشست واشنگتن تبدیل شود.", "date_str": "2026-09-24T07:32:36+00:00", "hash": "82a7ad5b5a80fd97", "title_fa": "دیدار ترامپ و شی؛ آیا ایران به محور اختلاف واشنگتن و پکن تبدیل می‌شود؟", "summary_fa": "در رسانه‌های آمریکا دو روایت تا حدی متفاوت دیده می‌شود. در یک روایت، چین مهم‌ترین شریان اقتصادی باقی‌مانده برای ایران است و بنابراین بدون همکاری پکن، تلاش واشنگتن برای منزوی کردن اقتصادی تهران با محدودیت جدی روبه‌رو خواهد شد. در روایت دیگر، روابط آمریکا و چین چنان گسترده و حساس است که نه ترامپ و نه شی تمایل چندانی ندارند ایران به محور اصلی اختلافات در نشست واشنگتن تبدیل شود. هم‌زمان با سفر شی جین‌پینگ، رئیس‌جمهور چین به واشنگتن برای دیدار با دونالد ترامپ، ایران در پوشش رسانه‌های آمریکایی به یکی از آزمون‌های مهم روابط آمریکا و چین تبدیل شده است. پرسش اصلی در رسانه‌های آمریکا این است: چین تا چه حد حاضر است از روابط اقتصادی خود با ایران دفاع کند و دولت ترامپ تا کجا آماده است برای افزایش فشار بر تهران، به روابطش با پکن آسیب بزند؟ واشنگتن‌پست در گزارشی درباره کارزار جدید تحریم‌های آمریکا، چین را «بزرگ‌ترین شریک تجاری ایران» و خریدار اصلی نفت این کشور توصیف  هشدار: این گزارش حاوی جزئیاتی درباره آزار جنسی است. صدایی که از آن سوی تلفن می‌آمد، یوسرون عزیزی را شوکه کرد. خواهرش پس از فرستادن پیامی فوری، خواسته بود با او تماس بگیرد. صدای آن سوی خط اما نه صدای خواهرش که مدیر سابق مدرسه یوسرون بود. او در خانه خانوادگی یوسرون حضور داشت. یوسرون می‌گوید: «می‌دانستم. دقیقا می‌دانستم می‌خواهد درباره چه صحبت کند.» احمد ایمان‌الدین سومار، که شاگردانش او را «آبا» به معنای «پدر» می‌نامیدند، شهرتی داشت که باید از آن محافظت می‌کرد. او مدیر بسیار مورد احترام یک مدرسه شبانه‌روزی اسلامی در جزیره اندونزیایی لومبوک بود. آبا متوجه شده بود یوسرون و دوستان قدیمی مدرسه‌اش شهادت‌های چند دانش‌آموز را گردآوری کرده‌اند؛ دانش‌آموزانی که می‌گفتند او آنها را آزار جنسی داده است. کمیسیون ملی خشونت علیه زنان اندونزی، آزار جنسی در مدارس شبانه‌روزی اسلامی را یک وضعیت اضطراری ملی توصیف کرده است. با این حال، به گفته کارشناسان حقوقی، بسیاری از پرونده‌ها هرگز به دادگاه نمی‌رسند، زیرا قربانیان را متقاعد می‌کنند از ادعاهای خود صرف‌نظر کنند یا آنها را برای سکوت تحت فشار می‌گذارند. حالا آبا با یوسرون تلفنی صحبت می‌کرد و دقیقا همین درخواست را داشت. او در حالی که هق‌هق می‌کرد، گفت: «آبروی معلمت را حفظ کن. همه اشتباه می‌کنند، فرزندم.» اما چیزی که نمی‌دانست این بود که یوسرون تک‌تک کلماتش را ضبط می‌کرد."}, {"source": "BBC Persian", "title": "اولین نفوذ هوش مصنوعی به یک سامانه دولتی و هک سیستم خدمات درمانی استرالیا", "link": "https://www.bbc.com/persian/articles/cm1wx1e12dn9o?at_medium=RSS&at_campaign=rss", "summary": "استرالیا پس از آن که یک عامل هوش مصنوعی متعلق به شرکت «اوپن‌ای‌آی»، سازنده چت جی‌پی‌تی به یک سامانه دولتی خدمات درمانی نفوذ کرد، بررسی فوری این حادثه را آغاز کرده است. دولت یک کارگروه تشکیل داده تا بررسی کند چه اتفاقی افتاده و آیا قانونی نقض شده است یا نه. کارشناسان معتقدند این اولین مورد شناخته‌شده در جهان از نفوذ هوش مصنوعی به یک سامانه دولتی است.", "date_str": "2026-09-24T06:21:29+00:00", "hash": "9a41de558612bbfc", "title_fa": "اولین نفوذ هوش مصنوعی به یک سامانه دولتی و هک سیستم خدمات درمانی استرالیا", "summary_fa": "استرالیا پس از آن که یک عامل هوش مصنوعی متعلق به شرکت «اوپن‌ای‌آی»، سازنده چت جی‌پی‌تی به یک سامانه دولتی خدمات درمانی نفوذ کرد، بررسی فوری این حادثه را آغاز کرده است. دولت یک کارگروه تشکیل داده تا بررسی کند چه اتفاقی افتاده و آیا قانونی نقض شده است یا نه. کارشناسان معتقدند این اولین مورد شناخته‌شده در جهان از نفوذ هوش مصنوعی به یک سامانه دولتی است. دولت استرالیا یک کارگروه تشکیل داده تا بررسی کند چه اتفاقی افتاده و آیا قانونی نقض شده است یا نه. کارشناسان معتقدند این اولین مورد شناخته‌شده در جهان از نفوذ هوش مصنوعی به یک سامانه دولتی است. آنتونی آلبانیزی، نخست‌وزیر استرالیا، شرکت «اوپن ای‌آی» را به تأخیر غیرقابل‌قبول در اطلاع‌رسانی به مقام‌های دولتی درباره این نفوذ، متهم کرد. او گفت که نگرانی خود را با سم آلتمن، مدیرعامل این شرکت در میان گذاشته است. این هک که در ماه ژوئن (چهار ماه پیش) رخ داد، به داده‌هایی دسترسی پیدا کرد که به‌صورت عمومی در دسترس نبودند. در واقع این عامل هوش مصنوعی یک درگاه آماری را هک کرد که حاوی اطلاعات خصوصی مربوط به نظام خدمات درمانی همگانی استرالیا بود. با این حال، مقامات استرالیا می‌گویند که تنها در ماه جاری از این موضوع مطلع شده‌اند. به نظر می‌رسد شرکت «اوپن ای‌آی» به‌جای این که درباره این موضوع از راه‌های رسمی و مستقیم با دولت استرالیا تماس بگیرد، موضوع را از طریق یک ایمیل عمومی اطلاع داده است؛ در نتیجه، چندین روز طول کشیده تا این پیام به مسئولان مربوطه و مقام‌های بالاتر در استرالیا برسد. در پاسخ، این شرکت اعلام کرد که تنها در ماه اوت از این هک مطلع شده و برای بررسی آن به زمان نیاز داشته است. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. «اوپن"}, {"source": "BBC Persian", "title": "چرا دیدار ترامپ و دلسی رودریگز در نیویورک، در نزدیکی زندان مادورو مهم است؟", "link": "https://www.bbc.com/persian/articles/crwyzk4lpzpeo?at_medium=RSS&at_campaign=rss", "summary": "به گفته تحلیلگران، رهبران آمریکا و ونزوئلا با برگزاری دیداری رو در رو در حاشیه مجمع عمومی سازمان ملل، ائتلاف جنجال‌برانگیز خود را نهایی کردند؛ دیداری که معانی و پیامدهای گوناگونی در بر دارد.", "date_str": "2026-09-24T04:29:55+00:00", "hash": "cbdab92a854ad99a", "title_fa": "چرا دیدار ترامپ و دلسی رودریگز در نیویورک، در نزدیکی زندان مادورو مهم است؟", "summary_fa": "به گفته تحلیلگران، رهبران آمریکا و ونزوئلا با برگزاری دیداری رو در رو در حاشیه مجمع عمومی سازمان ملل، ائتلاف جنجال‌برانگیز خود را نهایی کردند؛ دیداری که معانی و پیامدهای گوناگونی در بر دارد. دونالد ترامپ و دلسی رودریگز با دیداری رو در رو، روابط نزدیک و نامعمولی را که میان آن‌ها به عنوان رهبران آمریکا و ونزوئلا شکل گرفته است، تثبیت کردند؛ دو کشوری که زمانی دشمنان سرسخت یکدیگر بودند و اکنون به شرکایی نزدیک تبدیل شده‌اند. این دیدار شامگاه سه‌شنبه در نیویورک برگزار شد و بنا بر گفته یک منبع در کاخ سفید، از طرف آمریکا علاوه بر ترامپ، مارکو روبیو، وزیر خارجه؛ اسکات بسنت، وزیر دارایی؛ سوزی وایلز، رئیس دفتر ترامپ؛ و استیون میلر، مشاور امنیت ملی نیز در آن حضور داشتند. رودریگز در پیامی در شبکه ایکس گفت که با ترامپ «دیداری تاریخی» داشته است؛ دیداری که در آن درباره تقویت روابط دوجانبه و «پیشبرد برنامه‌ای برای همکاری در حوزه‌های راهبردی مانند انرژی، معدن، امنیت و دیگر موضوعات مورد علاقه مشترک» گفت‌وگو کرده‌اند. او همچنین از ترامپ و دولت او بابت حمایتی که پس از زمین‌لرزه‌های ماه ژوئن در ونزوئلا ارائه کردند و نیز «پشتیبانی از روند بازگشت» این کشور به نهادهای چندجانبه تشکر کرد. او افزود: «ونزوئلا و ایالات متحده روابطی تاریخی با یکدیگر دارند؛ روابطی که در این مرحله تازه، وظیفه داریم آن را از راه گفت‌وگو هدایت کنیم.» این دیدار پشت درهای بسته و در هتل لاته پالاس برگزار شد؛ در جریان مراسم استقبالی که ترامپ برای رهبران خارجی شرکت‌کننده در مجمع عمومی سازمان ملل متحد ترتیب داده بود. این هتل مجلل در قلب منهتن قرار دارد و کمتر از ۱۵ کیلومتر با زندان بروکلین فاصله دارد؛ جایی که نیکلاس مادورو، رئیس‌جمهور پیشین ونزوئلا، در آن زندانی است. اما به نظر می‌رسد نه ترامپ و نه رودریگز دیگر بر سرنوشت مادورو متمرکز نیستند؛"}, {"source": "BBC Persian", "title": "مردی که کتابخانه‌ای با دو میلیون کتاب بنا کرد", "link": "https://www.bbc.com/persian/articles/cq8gk078j45o?at_medium=RSS&at_campaign=rss", "summary": "در یک ساختمان بزرگ، دو میلیون کتاب برای امانت گرفتن و مطالعه در اختیار هم  نظرشان را پیدا می‌کنند؛ و اگر هم نتوانند، می‌گویند گودا می‌تواند"}, {"source": "BBC Persian", "title": "پس از سقوط اسد؛ اسرائیل چگونه حضور خود را در جنوب سوریه گسترش داده است؟", "link": "https://www.bbc.com/persian/articles/cvrl64005e5ko?at_medium=RSS&at_campaign=rss", "summary": "پس از سقوط حکومت بشار اسد و گسترش حضور نظامی اسرائیل در جنوب سوریه، ساکنان مناطق مرزی می‌گویند بازداشت‌ها، محدودیت‌های رفت‌وآمد و دسترسی به زمین‌های کشاورزی زندگی روزمره آنها را دگرگون کرده است. همزمان، اسرائیل حضور نظامی خود را در بخش‌هایی از جنوب سوریه گسترش داده و این موضوع به یکی از محورهای تنش میان سوریه و اسرائیل تبدیل شده است.", "date_str": "2026-09-23T22:09:18+00:00", "hash": "f6a0cc00e38c0b17", "title_fa": "پس از سقوط اسد؛ اسرائیل چگونه حضور خود را در جنوب سوریه گسترش داده است؟", "summary_fa": "پس از سقوط حکومت بشار اسد و گسترش حضور نظامی اسرائیل در جنوب سوریه، ساکنان مناطق مرزی می‌گویند بازداشت‌ها، محدودیت‌های رفت‌وآمد و دسترسی به زمین‌های کشاورزی زندگی روزمره آنها را دگرگون کرده است. همزمان، اسرائیل حضور نظامی خود را در بخش‌هایی از جنوب سوریه گسترش داده و این موضوع به یکی از محورهای تنش میان سوریه و اسرائیل تبدیل شده است. در صبح ۲۵ آوریل ۲۰۲۴، خانواده حسن احمد در روستای جباتا الخشب، واقع در مرز با اسرائیل، روزی عادی را سپری می‌کردند. اعضای خانواده مشغول نوشیدن قهوه بودند و حسن آماده می‌شد به محل کارش برود که تماسی دریافت کرد: سربازان اسرائیلی وارد زمین کشاورزی او شده و پسرش صدام را که آن زمان ۱۷ سال داشت، بازداشت کرده بودند. حسن می‌گوید سربازان دست‌های پسرش را بستند و چشم‌بند زدند، سپس به او گفتند حضورش در آن محل، به گفته آن‌ها، تجاوز به خاک کشور اسرائیل است. این روستا در منطقه حائل میان سوریه و اسرائیل قرار دارد؛ منطقه‌ای که بخشی از خاک سوریه است و روستاهای سوری‌نشین را در بر می‌گیرد. توافق جداسازی نیروها در سال ۱۹۷۴، حضور نیروهای نظامی هر دو طرف را در آن ممنوع کرده است. حسن بعدتر فهمید پسرش در بخش ویژه افراد زیر سن قانونی در زندان عوفر نگهداری می‌شده و پس از رسیدن به سن قانونی به بخش مردان منتقل شده است. سپس خبر از او به‌کلی قطع شد. به گفته پدرش، صدام تاکنون نه محاکمه شده و نه اتهامی به او تفهیم شده است. بر اساس داده‌های دولتی که بی‌بی‌سی به آنها دست یافته است، وضعیت صدام موردی استثنایی نیست؛ ۴۳ شهروند سوری همچنان در اسرائیل بازداشت هستند و بیشتر آنها پس از سقوط حکومت بشار اسد بازداشت شده‌اند. حدود یک سال پس از بازداشت صدام، نیروهای اسرائیلی پسرعموی او، حسن ابراهیم احمد، را نیز هنگام ورود به همان روستا و"}, {"source": "BBC Persian", "title": "یافته‌های یک نهاد سازمان ملل حاکی از افزایش شدید گزارش‌ها از خشونت علیه زنان در غزه است", "link": "https://www.bbc.com/persian/articles/cme3reeg0x12o?at_medium=RSS&at_campaign=rss", "summary": "بر اساس مجموعه‌ای از گزارش‌های اخیر «صندوق جمعیت سازمان ملل متحد»، گزارش‌های مربوط به خشونت علیه زنان و دختران در نوار غزه، از جمله ازدواج‌های زودهنگام و اجباری، افزایش چشمگیری داشته است.", "date_str": "2026-09-23T16:09:09+00:00", "hash": "0b270b88957c6785", "title_fa": "یافته‌های یک نهاد سازمان ملل حاکی از افزایش شدید گزارش‌ها از خشونت علیه زنان در غزه است", "summary_fa": "بر اساس مجموعه‌ای از گزارش‌های اخیر «صندوق جمعیت سازمان ملل متحد»، گزارش‌های مربوط به خشونت علیه زنان و دختران در نوار غزه، از جمله ازدواج‌های زودهنگام و اجباری، افزایش چشمگیری داشته است. ممکن است برخی از جزئیات این گزارش برای خوانندگان ناراحت‌کننده باشد. در یکی از این گزارش‌ها که داده‌های گردآوری‌شده توسط ۱۰ سازمان را تحلیل می‌کند، آمده است که بحران طولانی‌مدت ناشی از جنگ در غزه و پیامدهای آن، «شرایطی را ایجاد کرده که در آن زنان و دختران با خطرات فزاینده خشونت مبتنی بر جنسیت روبرو هستند.» این گزارش همچنین هشدار می‌دهد که در سه ماهه دوم سال جاری میلادی، موارد ازدواج زودهنگام و اجباری «افزایش شدید» داشته است؛ مواردی که سازمان ملل‌متحد هر دو را از مصادیق خشونت جنسیتی می‌داند. گزارش دیگری که روایت‌های ۲۳۰ زن ساکن در اردوگاه‌های پرجمعیت آوارگان در شهر غزه و خان‌یونس را بازگو می‌کند، تصویری تکان‌دهنده و تلخ از خشونت‌هایی ارائه می‌کند که این زنان تجربه کرده یا شاهد آن بوده‌اند. یک زن آواره که در مدرسه‌ای اسکان یافته که به پناهگاه تبدیل شده است، توضیح می‌دهد که چگونه قربانیان تجاوز، اغلب برای جلوگیری از ننگ و رسوایی، به عقد متجاوزان خود درمی‌آیند. او می‌گوید: «وقتی موارد تجاوز در مدارس برملا می‌شود، می‌بینید که روز بعد در همان مدرسه مراسم عروسی و جشن برپا شده است.» زن دیگری تعریف می‌کند که سال گذشته و در بحبوحه قحطی، «مردی دختر ۱۴ ساله‌اش را در ازای دو کیسه آرد شوهر داد تا خودش و [سایر] فرزندانش بتوانند غذا بخورند.» شش زن در اردوگاه‌های مختلف آوارگان، داستان‌هایی از چنین مبادلاتی را بازگو کردند؛ اقداماتی که پیش از آغاز درگیری میان اسرائیل و حماس در سال ۲۰۲۳، غیرقابل‌تصور بود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید."}, {"source": "BBC Persian", "title": "بیش از ۳۰ ساعت روی دریا؛ بریتانیا پناهجویان را به خشکی منتقل کرد", "link": "https://www.bbc.com/persian/articles/cwvgymmd5zgvo?at_medium=RSS&at_campaign=rss", "summary": "در شهر دوور بریتانیا، ۵۱ مهاجر پس از گذراندن بیش از ۳۰ ساعت در دریا، با یک قایق کوچک به این بندر رسیدند. این قایق صبح دوشنبه سواحل نرماندی در فرانسه را ترک کرده بود. گارد ساحلی فرانسه که مسیر حرکت آنها را دنبال می‌کرد، اعلام کرد که مهاجران در «شرایط پرمخاطره‌ای» قرار داشتند ولی از دریافت کمک خودداری کردند، چرا که «مصمم بودند هر خطری را بپذیرند تا به بریتانیا برسند». قایق‌های امداد و نجات بریتانیا برای کمک به سرنشینان آن قایق اعزام شدند؛ سپس آنها را به فرماندهی امنیت مرزی منتقل کردند.", "date_str": "2026-09-23T16:27:30+00:00", "hash": "9044021b138c688c", "title_fa": "بیش از ۳۰ ساعت روی دریا؛ بریتانیا پناهجویان را به خشکی منتقل کرد", "summary_fa": "در شهر دوور بریتانیا، ۵۱ مهاجر پس از گذراندن بیش از ۳۰ ساعت در دریا، با یک قایق کوچک به این بندر رسیدند. این قایق صبح دوشنبه سواحل نرماندی در فرانسه را ترک کرده بود. گارد ساحلی فرانسه که مسیر حرکت آنها را دنبال می‌کرد، اعلام کرد که مهاجران در «شرایط پرمخاطره‌ای» قرار داشتند ولی از دریافت کمک خودداری کردند، چرا که «مصمم بودند هر خطری را بپذیرند تا به بریتانیا برسند». قایق‌های امداد و نجات بریتانیا برای کمک به سرنشینان آن قایق اعزام شدند؛ سپس آنها را به فرماندهی امنیت مرزی منتقل کردند. ۵۱ پناهجو پس از گذراندن بیش از ۳۰ ساعت در دریا، با یک قایق کوچک به بندر دوور بریتانیا رسیدند. ورود این افراد در ساعت ۰۰:۳۰ بامداد چهارشنبه (به‌ وقت محلی)، در حالی صورت گرفت که صدها معترض عصر دیروز در شهر گاسپورت در همپشایر جمع شده بودند، چرا که در ابتدا تصور می‌شد این پناهجویان قرار است در آنجا به خشکی منتقل شوند. سخنگوی دولت بریتانیا اعلام کرد که فرماندهی امنیت مرزی «شبانه‌روزی برای حفاظت از مرزها تلاش می‌کند و همچنان به بازداشت و بررسی و رسیدگی به وضعیت تمامی قایق‌های کوچکی که وارد می‌شوند، ادامه خواهد داد.» گارد ساحلی فرانسه اعلام کرد که پناهجویان بیش از ۳۳ ساعت در این قایق کوچک بودند. امدادگران دولتی بریتانیایی گفتند که به درخواست گارد ساحلی بریتانیا، به‌دلیل «نگرانی از ایمنی و وخامت سلامتی» سرنشینان این قایق، ماموریت کمک‌رسانی به آنها را بر عهده گرفتند. بعدتر تصاویری از پیاده شدن مهاجران در دوور منتشر شد که نشان می‌داد آنها جلیقه‌های نجات نارنجی‌رنگ به تن داشتند و وسایل شخصی خود را حمل می‌کردند. پلیس کنت اعلام کرد که حدود ۲۰ نفر در تجمعی اعتراضی در بندر این شهر حضور داشتند و ماموران پلیس، جاده نزدیک آن را مسدود کرده بود. دنیل توماس، فعال مخالف مهاجران که با نام «دنی"}, {"source": "Radio Farda", "title": "وزیر خزانه‌داری آمریکا: ۸۰ تا ۹۰ درصد پروازهای خارجی ایران متوقف شده است", "link": "https://www.radiofarda.com/a/bessent-iran-economic-pressure-flight-sanctions/33863295.html", "summary": "وزیر خزانه‌داری آمریکا با اشاره به افزایش فشارهای اقتصادی بر ایران گفت: «ما ایرانی‌ها را چنان تحت فشار شدید قرار داده‌ایم که پیش از این هرگز نظیر آن را ندیده‌اند.»", "date_str": "2026-09-24T07:11:08+00:00", "hash": "62d24d5b41fde3f3", "title_fa": "وزیر خزانه‌داری آمریکا: ۸۰ تا ۹۰ درصد پروازهای خارجی ایران متوقف شده است", "summary_fa": "وزیر خزانه‌داری آمریکا با اشاره به افزایش فشارهای اقتصادی بر ایران گفت: «ما ایرانی‌ها را چنان تحت فشار شدید قرار داده‌ایم که پیش از این هرگز نظیر آن را ندیده‌اند.» اسکات بسنت در گفت‌وگو با فاکس‌نیوز که بامداد پنج‌شنبه دوم مهر به وقت ایران منتشر شد، به توقف پرواز برخی هواپیماهای ایرانی به دنبال اعمال تحریم‌ها بر آنها اشاره کرد و گفت: «امروز می‌توانم بگویم که احتمالاً بیش از ۸۰ یا ۹۰ درصد پروازهای خارجی ایران متوقف شده است. مطمئن نیستم نمایندگان ایران در سازمان ملل چگونه قرار است به کشورشان بازگردند.» هواپیمای حامل مسعود پزشکیان در سفر به نیویورک در فرودگاه الجزیره توقف داشت و خبرگزاری فارس، نزدیک به سپاه پاسداران، در این باره نوشت: «در این توقف، سوخت و بررسی بعضی موارد مرتبط با امور هوانوردی صورت گرفته است.» وزارت خزانه‌داری آمریکا پیشتر اعلام کرده بود در راستای اعمال فشار اقتصادی بر ایران در طرحی به نام «عملیات طرد اقتصادی» فعالیت بین‌المللی شرکت‌های هواپیمایی ایران با اعمال تحریم‌های ثانویه از اول مهر متوقف خواهد شد. با وجود توقف پرواز هواپیماهای ایرانی به مقاصد مختلفی از جمله عمان، جمهوری آذربایجان، گرجستان و پایتخت عراق از اول مهر، بررسی سامانه‌های رهگیری پرواز نشان می‌دهد رفت‌و‌‌‌آمد شماری از پروازهای بین‌المللی شرکت‌های ایرانی به کشورهای مختلف از جمله ترکیه، چین و امارات متحده عربی برقرار است. محسن رضایی، دبیر شورای‌ عالی امنیت ملی جمهوری اسلامی، در واکنش به توقف پروازهای ایران در شمار دیگری از کشورها، کشورهای همسایه ایران را تهدید کرد که در صورت همکاری با آمریکا «پروازهای فرودگاه‌های آن‌ها نیز متوقف خواهد شد». محسن رضایی در گفت‌وگویی که شامگاه چهارشنبه از صداوسیما پخش شد، گفت: «اگر کنار آمریکا باشید، ما شما را تماشا نخواهیم کرد» و هشدار داد در صورت ممنوعیت پروازهای ایران و همکاری کشورهای همسایه با آمریکا، «فرودگاه‌هایتان پرواز نخواهد داشت»."}, {"source": "Radio Farda", "title": "مارکو روبیو: ساختار تصمیم‌گیری در ایران «مانعی واقعی» در به نتیجه رسیدن مذاکرات است", "link": "https://www.radiofarda.com/a/rubio-iran-pezeshkian-un-talks-islamabad-deal/33863279.html", "summary": "وزیر خارجه آمریکا، پس از سخنرانی مسعود پزشکیان در مجمع عمومی سازمان ملل، گفت جمهوری اسلامی صلاحیت اظهارنظر دربارهٔ قواعد بین‌المللی و «نصیحت کردن دیگران» را ندارد.", "date_str": "2026-09-24T06:14:25+00:00", "hash": "997b44603b2f433e", "title_fa": "مارکو روبیو: ساختار تصمیم‌گیری در ایران «مانعی واقعی» در به نتیجه رسیدن مذاکرات است", "summary_fa": "وزیر خارجه آمریکا، پس از سخنرانی مسعود پزشکیان در مجمع عمومی سازمان ملل، گفت جمهوری اسلامی صلاحیت اظهارنظر دربارهٔ قواعد بین‌المللی و «نصیحت کردن دیگران» را ندارد. مارکو روبیو، وزیر خارجه آمریکا، پس از سخنرانی مسعود پزشکیان، رئیس‌جمهور ایران، در مجمع عمومی سازمان ملل گفت جمهوری اسلامی صلاحیت اظهارنظر دربارهٔ قواعد بین‌المللی و «نصیحت کردن دیگران» را ندارد. او همچنین ساختار تصمیم‌گیری در ایران را «مانعی واقعی» در گفت‌وگوهای بین دو طرف توصیف کرد. او روز چهارشنبه، اول مهر، در نشست خبری در حاشیهٔ مجمع عمومی سازمان ملل افزود که حکومت ایران مردم خود را «قتل‌عام می‌کند»، به مناطق غیرنظامی و زیرساخت‌های انرژی کشورهای همسایه حمله می‌کند و منشور ملل متحد را زیر پا می‌گذارد. روبیو گفت جمهوری اسلامی با چنین عملکردی در جایگاهی نیست که دربارهٔ قوانین بین‌المللی به دیگران پند و اندرز بدهد. اظهارات او پس از آن مطرح شد که پزشکیان در سخنرانی خود تهدیدهای تازهٔ دونالد ترامپ دربارهٔ فعالیت‌های هسته‌ای جمهوری اسلامی را «نشانهٔ خوی قلدری و منطق زور و مغایر منشور ملل متحد» توصیف کرد. رئیس‌جمهور ایران سخنان خود در مجمع عمومی را با واکنش به اظهارات پیشین ترامپ که جمهوری اسلامی را «تروریست» خوانده بود آغاز کرد و گفت: «ما قربانی تروریستیم.» پزشکیان همچنین به کشته شدن رهبر جمهوری اسلامی در حملات آمریکا و اسرائیل در نهم اسفند ۱۴۰۴ و همچنین حملات به مدرسه‌ای در میناب و ورزشگاهی در لامرد، که تهران آمریکا را مسئول آن‌ها می‌داند، اشاره کرد و گفت: «کسانی که تروریستند و تروریست تربیت می‌کنند به ما می‌گویند تروریست. ما از خود دفاع می‌کنیم. تروریست نیستیم.» کمیتهٔ حقیقت‌یاب سازمان ملل دربارهٔ ایران هفتهٔ گذشته اعلام کرد «دلایل معقولی» وجود دارد که آمریکا در حمله به مدرسهٔ میناب و ورزشگاه لامرد مرتکب جنایت جنگی شده باشد. همین کمیته در گزارش خود حکومت ایران را نیز به ارتکاب نقض‌های فاحش حقوق بشر و"}, {"source": "Radio Farda", "title": "استقبال دونالد ترامپ از شی جین‌پینگ؛ آتش‌بس تجاری آمریکا و چین تمدید می‌شود", "link": "https://www.radiofarda.com/a/trump-xi-washington-us-china-trade-truce/33863289.html", "summary": "شی جین‌پینگ پس از ورود به آمریکا ابراز امیدواری کرد روابط پکن و واشینگتن باثبات‌تر شود و گفت دو کشور باید «شریک باشند، نه رقیب».", "date_str": "2026-09-24T05:45:48+00:00", "hash": "c0e74b703096b340", "title_fa": "استقبال دونالد ترامپ از شی جین‌پینگ؛ آتش       tech: [{"source": "MIT AI", "title": "The promise and peril of using visual AI to study cities", "link": "https://news.mit.edu/2026/studying-cities-using-visual-ai-fabio-duarte-martina-mazzarello-carlo-ratti-fan-zhang-book-0924", "summary": "A few months ago, researchers from the MIT Senseable City Lab published a study about pollution in New York City featuring some new methods. For instance: With machine learning, they identified the types of vehicles appearing in 331 traffic cameras in the city, and estimated the emissions coming from each automobile. Given enough cameras, these visual artificial intelligence techniques could monitor emissions with an unprecedented combination of precision and scale. For that matter, visual AI today can address all kinds of questions for urban planners. Why exactly is traffic snarling? What are the most dangerous aspects of different intersections? Which parts of plazas or parks attract the most people? Across cities, more images means more data, more insight — and more concerns about privacy and fairness. “We can treat these digital images as data and quantify features of the city,” says Fábio Duarte, an MIT researcher and co-author of a new book about visual AI and urban studies. “With computer vision techniques, each image is a dataset.” Still, he adds, “We have to be careful about it.” And while urbanists have long used visual analysis to inform their thinking, now it’s possible to an unprecedented extent. “Everybody has been observing the urban environment and trying to get some insight,” says Martina Mazzarello, an MIT scholar and a co-author of the new book. “But what if we can do that at a large scale and get some insight everywhere?” The scholars explore these topics in “ How AI Sees the City: Urban Visual Intelligence ,” published this month by Routledge. The authors are Duarte, a principal research scientist and associate director of the MIT Senseable City Lab; Mazzarello, a research scientist and lead of MIT Senseable City Lab global initiatives; Carlo Ratti, a professor of the practice and founder and director of the MIT Senseable City Lab; and Fan Zhang, an assistant professor at the Institute of Remote Sensing and GIS at Peking University. “Great urbanists such as Kevin Lynch and Willian H. Whyte showed us the extraordinary value of ‘looking’ at the city,” Ratti says, referring to two prominent thinkers about city dynamics whose work is described in the book. “Today, visual AI gives us new ways to build on that tradition — allowing us to observe cities at a scale and with a level of detail that was previously impossible.” New tool, long tradition “How AI Sees the City” stems from the work of the MIT Senseable City Lab, founded in 2004, which ", "date_str": "2026-09-24T04:00:00+00:00", "hash": "c26097419a3d4758", "title_fa": "وعده و خطر استفاده از هوش مصنوعی بصری برای مطالعه شهرها", "summary_fa": "چند ماه پیش، محققان آزمایشگاه MIT Senseable City مطالعه‌ای را در مورد آلودگی در شهر نیویورک منتشر کردند که شامل روش‌های جدیدی بود. به عنوان مثال: با یادگیری ماشینی، آنها انواع وسایل نقلیه را که در 331 دوربین ترافیکی شهر ظاهر می‌شوند، شناسایی کردند و انتشار گازهای گلخانه‌ای از هر خودرو را تخمین زدند. با توجه به دوربین های کافی، این تکنیک های هوش مصنوعی بصری می توانند انتشار گازهای گلخانه ای را با ترکیبی بی سابقه از دقت و مقیاس نظارت کنند. برای این موضوع، هوش مصنوعی بصری امروز می‌تواند به انواع سؤالات برای برنامه‌ریزان شهری پاسخ دهد. چرا دقیقاً ترافیک غوغا می کند؟ خطرناک ترین جنبه های تقاطع های مختلف چیست؟ کدام بخش از میدان ها یا پارک ها بیشتر مردم را جذب می کنند؟ در سراسر شهرها، تصاویر بیشتر به معنای داده بیشتر، بینش بیشتر - و نگرانی های بیشتر در مورد حفظ حریم خصوصی و انصاف است. فابیو دوارته، محقق MIT و یکی از نویسندگان کتاب جدیدی درباره هوش مصنوعی بصری و مطالعات شهری، می‌گوید: «ما می‌توانیم این تصاویر دیجیتال را به‌عنوان داده در نظر بگیریم و ویژگی‌های شهر را کمیت کنیم». \"با تکنیک های بینایی کامپیوتری، هر تصویر یک مجموعه داده است.\" با این حال، او اضافه می کند: \"ما باید مراقب آن باشیم.\" و در حالی که شهرنشینان مدت‌هاست از تجزیه و تحلیل بصری برای اطلاع‌رسانی به تفکر خود استفاده می‌کنند، اکنون این امکان به میزان بی‌سابقه‌ای وجود دارد. مارتینا مازارلو، محقق دانشگاه MIT و یکی از نویسندگان کتاب جدید، می‌گوید: «همه محیط شهری را مشاهده کرده‌اند و سعی کرده‌اند بینش‌هایی به دست آورند. \"اما اگر بتوانیم این کار را در مقیاس بزرگ انجام دهیم و در همه جا بینشی داشته باشیم چه؟\" محققان این موضوعات را در کتاب «هوش مصنوعی چگونه شهر را می‌بیند: هوش بصری شهری» که در این ماه توسط راتلج"}, {"source": "MIT AI", "title": "MIT welcomes David Siegel SM ’86, PhD ’91 as its next Innovation Fellow", "link": "https://news.mit.edu/2026/mit-welcomes-david-siegel-innovation-fellow-0923", "summary": "David Siegel SM ’86, PhD ’91, a computer scientist, entrepreneur, and philanthropist, will serve as the next MIT Innovation Fellow during the 2026-27 academic year. Working with the MIT Schwarzman College of Computing, Siegel will explore how artificial intelligence can accelerate scientific discovery at the Institute and beyond. “From the MIT Schwarzman College of Computing to the MIT Siegel Family Quest for Intelligence, David has been a superb thought partner for me and other Institute leaders on a range of very significant initiatives, so we're delighted to have him join us now as an MIT Innovation Fellow,” says MIT President Sally Kornbluth. “Our community has long benefited from David's exceptional technical insight, entrepreneurial experience, instinct for connecting people, and infectious love for MIT. We look forward to working with him now as he helps us identify new opportunities at the intersection of AI and scientific discovery.” “MIT has played a foundational role in shaping how I view technology’s potential to address complex challenges,” says Siegel. “I’m thrilled to return to campus as an Innovation Fellow to collaborate with brilliant students, researchers, and faculty at a pivotal juncture in how technology shapes our world.” A long-standing connection to MIT Siegel’s relationship with MIT began during his graduate studies, where he earned a master’s degree in 1986 and PhD in 1991, after earning his bachelor’s degree in electrical engineering and computer science from Princeton University in 1983. Immersed in the field during a foundational era for computer science, he worked at the MIT Artificial Intelligence Lab (now the Computer Science and Artificial Intelligence Laboratory) in Professor Tomás Lozano-Pérez’s research group on human-machine interaction, contributing to the development of a pioneering humanlike robotic hand. Siegel has remained deeply involved with the Institute in the years since. He is a life member of the MIT Corporation, previously served on its Executive Committee, and co-chairs the External Advisory Committee for the MIT Schwarzman College of Computing. Additionally, Siegel was an early champion of the MIT Quest for Intelligence, an Institute-wide initiative studying intelligence in brains and machines, recently renamed the MIT Siegel Family Quest for Intelligence . Entrepreneurship, philanthropy, and AI leadership After completing his PhD, Siegel founded several early internet ventures before co-founding Two Sig", "date_str": "2026-09-23T15:30:00+00:00", "hash": "f497694920b5be0c", "title_fa": "MIT از David Siegel SM '86, PhD '91 به عنوان همکار بعدی نوآوری استقبال می کند.", "summary_fa": "دیوید سیگل اس ام 86، دکترای 91، دانشمند کامپیوتر، کارآفرین و نیکوکار، به عنوان همکار بعدی نوآوری MIT در طول سال تحصیلی 2026-27 خدمت خواهد کرد. سیگل با همکاری کالج محاسباتی شوارتزمن MIT، چگونگی سرعت بخشیدن به اکتشافات علمی در موسسه و فراتر از آن را بررسی خواهد کرد. سالی کورنبلوت، رئیس MIT، می‌گوید: «از کالج محاسباتی MIT شوارتزمن تا جستجوی اطلاعات خانواده Siegel MIT، دیوید یک شریک فکری عالی برای من و سایر رهبران مؤسسه در طیفی از ابتکارات بسیار مهم بوده است، بنابراین ما خوشحالیم که او اکنون به عنوان یک عضو نوآوری MIT به ما ملحق شود». جامعه ما مدت‌هاست که از بینش فنی استثنایی دیوید، تجربه کارآفرینی، غریزه ارتباط با مردم و عشق مسری به MIT بهره برده است. ما مشتاقانه منتظر همکاری با او هستیم زیرا او به ما کمک می کند فرصت های جدیدی را در تقاطع هوش مصنوعی و اکتشافات علمی شناسایی کنیم. سیگل می‌گوید: «MIT نقش اساسی در شکل‌دهی نگاه من به پتانسیل فناوری برای مقابله با چالش‌های پیچیده داشته است». \"من از بازگشت به دانشگاه به عنوان همکار نوآوری برای همکاری با دانشجویان، محققان و اساتید برجسته در یک مقطع مهم در چگونگی شکل‌دهی فناوری به دنیای ما، هیجان‌زده هستم.\" ارتباط طولانی مدت با رابطه MIT Siegel با MIT در دوران تحصیلات تکمیلی او آغاز شد، جایی که او مدرک کارشناسی ارشد را در سال 1986 و دکترا را در سال 1991 پس از اخذ مدرک لیسانس خود در رشته مهندسی برق و علوم کامپیوتر از دانشگاه پرینستون در سال 1983 دریافت کرد. او که در دورانی بنیادی برای علوم کامپیوتر در این زمینه غوطه ور بود، در آزمایشگاه هوش مصنوعی MIT (اکنون آزمایشگاه علوم کامپیوتر و هوش مصنوعی) در گروه تحقیقاتی پروفسور توماس لوزانو-پرز در مورد تعامل انسان و ماشین کار کرد و در توسعه یک دست روباتیک انسان مانند"}, {"source": "TechCrunch AI", "title": "TechCrunch Disrupt 2026: Cal AI’s Zach Yadegari on how to create viral growth and capitalize on it", "link": "https://techcrunch.com/2026/09/24/techcrunch-disrupt-2026-cal-ais-zach-yadegari-on-how-to-create-viral-growth-and-capitalize-on-it/", "summary": "Zach Yadegari joins the Builders Stage at TechCrunch Disrupt 2026 to share how he capitalized on viral growth. Save up to $200 before September 25. Save 50% on a second pass.", "date_str": "2026-09-24T14:30:00+00:00", "hash": "ab9dccdff413021c", "title_fa": "TechCrunch Disrupt 2026: Zach Yadegari از Cal AI در مورد چگونگی ایجاد رشد ویروسی و سرمایه گذاری بر روی آن", "summary_fa": "وقتی اپلیکیشنی که در دبیرستان راه اندازی کرده اید ویروسی شود چه اتفاقی می افتد؟ برای زک یادگاری، پاسخ بیش از 15 میلیون دانلود، 30 میلیون دلار درآمد سالانه و خرید توسط MyFitnessPal بود - همه اینها قبل از تولد 20 سالگی او. یادگاری تنها 17 سال داشت که Cal AI را تأسیس کرد، برنامه تغذیه مبتنی بر هوش مصنوعی (AI) که به کاربران امکان می دهد با گرفتن عکس، آنچه می خو  caught outside Buckingham Palace with his flies undone and forced to defend himself. This is a fabrication, of course – I’m watching the scene play out in an east London dance studio – but it doesn’t feel miles away from something that could be true. And how do we know what’s the truth anyway? That’s the question in Deepfake , the latest piece from award-winning dance duo Jessica Wright and Morgann Runacre-Temple, AKA Jess and Morgs . The pair tell modern stories with ambitious tech – film and live camera work – and often techy themes, too. “We’ve always been drawn to where there’s a crossover between the theme and the form,” says Runacre-Temple. “What gets us excited is seeing the contemporary world reflected back.” The pair scored a massive hit with their 2022 piece Coppélia , made for Scottish Ballet, which turned a twee 19th-century ballet about a dancing doll into a cautionary tale of AI automatons and unrestrained tech bro egos. Definitely not one-hit wonders, earlier this year they made their debut at the highly esteemed Paris Opera Ballet . Continue reading...", "date_str": "2026-09-24T09:03:45+00:00", "hash": "d74660ac943f3609", "title_fa": "\"این شکاف شک و تردید را در مورد همه چیز باز می کند\": جس و مورگ با سیاست دیپ فیک روبرو می شوند", "summary_fa": "در کار جدید طراحان رقص، حرکت‌های جذاب و جادوی صفحه سبز، نمایشی بودن مصاحبه‌های تلویزیونی پرمخاطب را آشکار می‌کند، به نظر می‌رسد که مصاحبه‌کننده او را به طناب انداخته است. این سیاستمدار محاصره شده که در خارج از کاخ باکینگهام با مگس‌هایش دستگیر شده و مجبور به دفاع از خود شده است، می‌گوید: «برای ثبت، من در یک مراسم بت پرستی با اعضای کوچک خانواده سلطنتی که در آن خودمان را رنگ آمیزی کردیم، شرکت نکردم. البته این یک ساختگی است - من در حال تماشای این صحنه در یک استودیوی رقص در شرق لندن هستم - اما به نظر نمی رسد کیلومترها از چیزی که می تواند درست باشد فاصله داشته باشد. و از کجا بفهمیم حقیقت چیست؟ این سوال در Deepfake است، آخرین قطعه از دو رقص برنده جایزه جسیکا رایت و مورگان Runacre-Temple، AKA Jess and Morgs. این زوج  به بدترین شکل ممکن متوجه شده است. ادامه مطلب... نخست وزیر، آنتونی آلبانیز، موظف شد از اجلاس سران سازمان ملل در صبح پنجشنبه به وقت استرالیا اعلام کند که یک هوش مصنوعی عامل از پایگاه OpenAI به طور غیرمجاز به اطلاعات عمومی و غیرعمومی وب سایت مدیکر استرالیا دسترسی پیدا کرده است. خبر خوب در این شکست این است که تا کنون به نظر می‌رسد هیچ اطلاعات شخصی موجود در سوابق مدیکر به خطر نیفتاده است. با پیگیری \"یک کار خوش خیم\" برای جمع آوری برخی از آمارهای بهداشتی، نفوذ پورتال به داده های غیر حساس در مورد هزینه ها دسترسی پیدا کرد. خبر خوب، افسوس، اینجا به پایان می رسد. OpenAI - شرکتی به ارزش 852 میلیارد دلار بر اساس آخرین ارزیابی خود - با ارسال ایمیلی به حساب ایمیل عمومی خود سه ماه پس از وقوع هک، دولت را از این نقض آگاه کرد. آلبانیز تاریخ ارائه بدترین Inbox Zero در سرویس های استرالیا را 10 سپتامبر اعلام کرد و مرکز امنیت سایبری استرالیا در 15 سپتامبر مطلع شد. آلبانیز در سازمان ملل نشان داده است که یک دیپلمات نسبتاً زیرک است، که باعث تعجب هر کسی شده است که انتقام او را در خانه دریافت کرده است. تصور می‌شود که میل به ملایم‌تر کردن واکنش شدید ترامپ به تلاش‌های حزب کارگر برای مقررات «وظیفه مراقبت دیجیتالی» برای - هه! – هوش مصنوعی و رسانه‌های اجتماعی الهام‌بخش عکس سلفی حماسی و خنده‌دار نخست وزیر با رئیس جمهور نامحبوب"}, {"source": "The Guardian AI", "title": "An OpenAI agent infiltrated Medicare – and Australia only found out months later. Here’s what we know so far", "link": "https://www.theguardian.com/technology/2026/sep/24/openai-agent-hacked-medicare-australia-what-we-know-so-far-ntwnfb", "summary": "Experts say ‘fairly minor’ breach is a portent of things to come and proprietary closed systems like OpenAI are ‘the least of the worries’ Follow our Australia news live blog for latest updates Get our breaking news email , free app or daily news podcast Anthony Albanese says an artificial intelligence agent developed by OpenAI hacked Medicare and three other systems in June – and the company only notified Australia earlier this month. The prime minister has expressed his “extreme concern” over the incident, although he noted no personal information is believed to have been accessed in the breach. Continue reading...", "date_str": "2026-09-24T05:57:02+00:00", "hash": "30d810ae445875d5", "title_fa": "یک عامل OpenAI به مدیکر نفوذ کرد - و استرالیا ماه‌ها بعد متوجه شد. این چیزی است که ما تاکنون می دانیم", "summary_fa": "کارشناسان می‌گویند نقض «نسبتاً جزئی» نشانه چیزهایی است که در آینده رخ می‌دهد و سیستم‌های بسته اختصاصی مانند OpenAI «کمترین نگرانی» هستند. وبلاگ اخبار استرالیا را برای آخرین به‌روزرسانی‌ها دنبال کنید. ایمیل اخبار فوری، برنامه رایگان یا پادکست اخبار روزانه ما را دریافت کنید آنتونی آلبانیز می‌گوید یک عامل هوش مصنوعی توسعه‌یافته توسط OpenAI مدیکر و سه سیستم دیگر شرکت استرالیا را فقط در ژوئن هک کرد. نخست وزیر \"نگرانی شدید\" خود را در مورد این حادثه ابراز کرده است، اگرچه وی خاطرنشان کرد که گمان می رود در این رخنه به هیچ اطلاعات شخصی دسترسی نداشته باشد. به خواندن ادامه دهید... این نماینده همچنین به مؤسسه بهداشت و رفاه استرالیا، وزارت بهداشت ویکتوریا و اداره آمار و تحقیقات جنایی نیو ساوت ولز دسترسی پیدا کرد. در این مرحله اعتقاد بر این است که هیچ اطلاعات پزشکی شخصی به خطر نیفتاده است، اما تحقیقات ادامه دارد. نخست وزیر گفته است: «این وضعیت بدیهی است غیرقابل قبول است». OpenAI در سال 2015 توسط ایلان ماسک و سام آلتمن (مدیرعامل باقی می ماند) تأسیس شد. ارزش آن بیش از 1 تریلیون دلار است. هر دو اخیراً نگرانی هایی را در مورد سرعت و عدم کنترل در اطراف توسعه هوش مصنوعی مطرح کرده اند. آلتمن این هفته به شورای امنیت سازمان ملل گفت: «خیلی چیزها وجود دارد که هوش مصنوعی نمی تواند و نباید آنها را خودکار کند. وقتی سیستم‌های هوش مصنوعی توانمندتر و مستقل‌تر می‌شوند، می‌توانند سریع‌تر از مؤسسات ما حرکت کنند یا تصمیماتی بگیرند که مردم دیگر آن را درک یا کنترل نمی‌کنند.» OpenAI، یکی از بهترین شرکت‌های هوش مصنوعی روی زمین، سه ماه پس از هک، ایمیلی را به یک آدرس دولتی استرالیایی ارسال کرد."}, {"source": "The Guardian AI", "title": "‘That’s so AI!’ What gen Alpha’s biggest insult tells us", "link": "https://www.theguardian.com/society/2026/sep/24/thats-so-ai-what-gen-alphas-biggest-insult-tells-us", "summary": "The year’s most popular slang reveals what young people think about artificial intelligence – and it’s not positive Name: “That’s AI!” Age: Brand new. Continue reading...", "date_str": "2026-09-24T04:00:07+00:00", "hash": "e0131aa5a62f8baa", "title_fa": "«این خیلی هوش مصنوعی است!» بزرگترین توهین جنرال آلفا به ما چه می گوید", "summary_fa": "محبوب ترین زبان عامیانه سال نشان می دهد که جوانان در مورد هوش مصنوعی چه فکر می کنند - و مثبت نیست نام: \"این هوش مصنوعی است!\" Age: Brand new. به خواندن ادامه دهید... هوش مصنوعی چیست؟ این فقط چیزی است که بچه ها اکنون می گویند: \"این هوش مصنوعی است!\" یا \"این خیلی هوش مصنوعی است!\" اما چیست؟ Something inauthentic, unbelievable or rubbish. کدام توسط هوش مصنوعی ساخته شده است؟ نه، هوش مصنوعی ارتباط چندانی با این موضوع ندارد. اما آیا هوش مصنوعی برای نابودی نوع بشر آماده نیست؟ بسیار محتمل است، اما این در حال حاضر به ما مربوط نمی شود. اینطور نیست؟ نه. بچه‌ها - ژنرال آلفا - متوجه شده‌اند که ویژگی‌های خاصی از شیب تولید شده توسط هوش مصنوعی، مانند روشی که سطحی قانع‌کننده است، اما در نهایت ارزان و دارای ارزش مشکوک است، را می‌توان در بسیاری از چیزهای دیگر یافت: کالاهای بی‌فروش، ادعاهای اغراق‌آمیز، بهانه‌هایی که والدین شما می‌آورند. اگر چیزی به نحوی مشکوک در نظر گرفته شود، بنا به تعریف، هوش مصنوعی نیز هست. آیا «این هوش مصنوعی است» «شش-هفت» جدید است؟ نه، این بیت عامیانه به معنای چیزی است: جوانان به سادگی تعریف هوش مصنوعی را گسترش داده اند تا آن را معادل \"چرند\" کنند. اما آیا همه چیز پیچیده تر از این نیست؟ آیا هوش مصنوعی نمی تواند نجات دهنده ما باشد، تا زمانی که از قضاوت درست استفاده شود و نرده های محافظ مناسب در جای خود قرار گیرند؟ در حالی که بقیه در حال انجام این بحث هستیم، ژنرال آلفا قبلاً تصمیم خود را گرفته است: هوش مصنوعی بسیار هوش مصنوعی است. وقتی هوش مصنوعی بفهمد که هوش مصنوعی است چه اتفاقی می‌افتد؟ آیا تا زمانی که تمام مراکز داده شروع به انفجار نکنند، در یک حلقه بازخورد منطقی به دام می‌افتد؟ شما خیلی آدم علمی نیستید، درست است؟"}, {"source": "The Guardian AI", "title": "Australia launches investigation after OpenAI agent hacked healthcare database", "link": "https://www.theguardian.com/australia-news/2026/sep/24/anthony-albanese-says-openai-agent-hacked-medicare-extreme-concern-sam-altman", "summary": "Prime minister says he told Sam Altman he was disappointed it had taken OpenAI ‘way too long’ to disclose breach Anthony Albanese says an artificial intelligence agent developed by OpenAI hacked Medicare in June and the tech giant notified the government earlier this month using an email sent to a “public mailbox”. Australia’s prime minister made the comments at the UN summit in New York, saying it appeared no personal information had been accessed in the AI breach. Continue reading...", "date_str": "2026-09-24T02:06:05+00:00", "hash": "59d57eeacf3a2b3c", "title_fa": "استرالیا تحقیقات خود را پس از هک کردن پایگاه داده مراقبت های بهداشتی توسط عامل OpenAI آغاز کرد", "summary_fa": "نخست وزیر می گوید که به سام آلتمن گفته است که ناامید است که OpenAI برای افشای نقض \"خیلی طولانی\" طول کشیده است آنتونی آلبانیز می گوید یک عامل هوش مصنوعی توسعه یافته توسط OpenAI مدیکر را در ماه ژوئن هک کرد و غول فناوری اوایل این ماه با استفاده از ایمیلی که به \"صندوق پست عمومی\" ارسال شده بود، به دولت اطلاع داد. نخست وزیر استرالیا این اظهارات را در نشست سران سازمان ملل در نیویورک بیان کرد و گفت که به نظر می رسد هیچ اطلاعات شخصی در نقض هوش مصنوعی مورد دسترسی قرار نگرفته است. ادامه مطلب... تحقیقات با کمک اداره سیگنال های استرالیا در مورد چگونگی نفوذ این عامل به سیستم مراقبت های بهداشتی عمومی دولتی استرالیا و همچنین سه نفر دیگر ادامه داشت. آنها مؤسسه بهداشت و رفاه استرالیا، وزارت بهداشت ویکتوریا، اداره آمار و تحقیقات جنایی نیو ساوت ولز، و پورتال خدمات گزارش آماری Medicare خدمات استرالیا بودند. آلبانیز گفت: «این وضعیت بدیهی است غیرقابل قبول است. \"امروز، من با مدیر عامل OpenAI، سام آلتمن، صحبت کردم تا نگرانی شدید استرالیا را در مورد این حادثه ابراز کنم و همچنین ناامیدی خود را از این که شرکت برای اطلاع رسانی به دولت در مورد آنچه رخ داده بود، خیلی طول کشید.\" آلبانیز گفت که تاخیر و نحوه اطلاع رسانی OpenAI به دولت ناامیدکننده بود. آلبانیز گفت: \"تا 10 سپتامبر طول کشید تا هیچ اعلانی دریافت شود. و اعلان ایمیلی بود که فقط به صندوق پستی عمومی ارسال شد.\" ایمیل به آدرس ایمیل عمومی publicdisclosures@servicesaustralia.gov.au ارسال شد. آن صندوق ورودی یک بار در روز بررسی می شود: ایمیل تا 11 سپتامبر خوانده نشد."}, {"source": "The Guardian AI", "title": "Senator confirms ‘eight suicide attempts’ by US navy personnel assigned to USS Abraham Lincoln carrier group – as it happened", "link": "https://www.theguardian.com/us-news/live/2026/sep/23/donald-trump-xi-jinping-ai-china-us-politics-latest-news-updates", "summary": "Kirsten Gillibrand says acting US navy secretary told her of attempted suicides after carrier strike group’s lengthy deployment as part of US war in Iran. This blog is now closed. Sign up for US Breaking News emails Rubio also briefly addressed Trump’s meeting with Delcy Rodriguez, the interim Venezuelan president, who last night posed for a friendly photo with Trump at a Manhattan hotel only miles from where her predecessor, Nicolás Maduro, was incarcerated. “It was a short meeting, but it was a very important meeting,” Rubio said. Continue reading...", "date_str": "2026-09-24T02:00:33+00:00", "hash": "2877d3bd946a7f23", "title_fa": "سناتور \"هشت اقدام به خودکشی\" توسط پرسنل نیروی دریایی ایالات متحده که به گروه ناو یو اس اس آبراهام لینکلن اختصاص داده شده بود را تایید کرد - همانطور که اتفاق افتاد", "summary_fa": "کریستن گیلیبراند می‌گوید معاون وزیر نیروی دریایی آمریکا پس از استقرار طولانی‌مدت گروه حمله ناو هواپیمابر به عنوان بخشی از جنگ ایالات متحده در ایران، به او از اقدام به خودکشی گفته است. این وبلاگ اکنون بسته شده است. رویدادهای کلیدی 12 ساعت قبل خلاصه پایانی 13 ساعت قبل به نظر می رسد کاخ سفید اذعان داشته است که جی دی ونس منبعی است که پولیتیکو در مقاله مورد استفاده برای توجیه ممنوعیت ترامپ در 14 ساعت پیش مورد استفاده قرار داده بود، ترامپ را به دلیل برنده شدن در هنگام پرواز با صدای بلند مورد تمسخر قرار داد، در حالی که شی و همسران هر دو رهبر، 16 سا
