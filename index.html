<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۱۷ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>

        <button class="btn-action" onclick="toggleArchiveModal(true)">

    <main id="newsContainer" class="news-grid"></main>

      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

Wire", "title": "گادی آیزنکوت مامور تشکیل دولت جدید اسراییل شد", "link": "https://iranwire.com/fa/news-1/159927-%DA%AF%D8%A7%D8%AF%DB%8C-%D8%A2%DB%8C%D8%B2%D9%86%DA%A9%D9%88%D8%AA-%D9%85%D8%A7%D9%85%D9%88%D8%B1-%D8%AA%D8%B4%DA%A9%DB%8C%D9%84-%D8%AF%D9%88%D9%84%D8%AA-%D8%AC%D8%AF%DB%8C%D8%AF-%D8%A7%D8%B3%D8%B1%D8%A7%DB%8C%DB%8C%D9%84-%D8%B4%D8%AF/", "summary": "اسحاق هرتزوگ، رییس‌جمهور اسراییل، اعلام کرد گادی آیزنکوت، رییس حزب «یاشار»، را مامور تشکیل دولت آینده این کشور خواهد کرد. آیزنکوت که حما ...", "date_str": "2026-11-07T19:54:45+00:00", "hash": "485a49a331f5c391", "title_fa": "گادی آیزنکوت مامور تشکیل دولت جدید اسراییل شد", "summary_fa": "اسحاق هرتزوگ، رییس‌جمهور اسراییل، اعلام کرد گادی آیزنکوت، رییس حزب «یاشار»، را مامور تشکیل دولت آینده این کشور خواهد کرد. آیزنکوت که حما ... دفتر ریاست‌جمهوری اسراییل اعلام کرد مراسم رسمی واگذاری ماموریت تشکیل دولت به آیزنکوت، روز یکشنبه ساعت پنج بعدازظهر در اقامتگاه ریاست‌جمهوری در اورشلیم برگزار خواهد شد. هرتزوگ روز شنبه ۱۶ آبان، پس از گفت‌وگوهای جداگانه با آیزنکوت و بنیامین نتانیاهو و رایزنی با چهره‌های مختلف سیاسی، تصمیم خود را به آیزنکوت اطلاع داد. در جریان مشورت‌های هفته گذشته رییس‌جمهور با نمایندگان احزاب، آیزنکوت حمایت ۶۷ عضو کنست را برای نخست‌وزیری به دست آورد، در حالی که ۴۶ نماینده از نتانیاهو حمایت کرده بودند. آیزنکوت پس از دریافت رسمی ماموریت، ۲۸ روز برای تشکیل دولت فرصت خواهد داشت. در صورتی که نتواند در این مدت دولت را تشکیل دهد، می‌تواند از هرتزوگ درخواست کند حداکثر ۱۴ روز دیگر به این مهلت اضافه کند. هم‌زمان با این تحولات، نتانیاهو از احزاب بلوک موسوم به «تغییر» خواسته است با احزاب ائتلاف کنونی او برای تشکیل یک دولت وحدت ملی همکاری کنند. نتانیاهو در اظهاراتی با هشدار درباره تشکیل دولت با مشارکت احزاب عرب، آن‌ها را «حامی تروریسم» خواند و گفت چنین دولتی کشور را نابود خواهد کرد. او در عین حال تاکید کرد دولت وحدت ملی باید شامل تمام متحدان ائتلاف پیشین او، از جمله حزب لیکود، احزاب راست افراطی «صهیونیسم مذهبی» و «قدرت یهودی» و همچنین احزاب مذهبی ارتدوکس باشد. نتانیاهو در اظهارات خود مشخص نکرد که رهبری چنین دولتی را چه کسی بر عهده خواهد داشت. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B8%DB%B8%DB%B8%DB%B8_Kzli__v1024x512__box_0%2C70%2C1600%2C911.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۶ آبان • ۲۳:۲۴"}, {"source": "Independent Persian", "title": "پایان جنگ؛ آغاز چالش اصلی جمهوری اسلامی با جامعهٔ ایران", "link": "https://www.independentpersian.com/node/423088/%D8%AF%DB%8C%D8%AF%DA%AF%D8%A7%D9%87/%D8%B3%D8%B1%D8%AF%D8%A8%DB%8C%D8%B1/%D9%BE%D8%A7%DB%8C%D8%A7%D9%86-%D8%AC%D9%86%DA%AF%D8%9B-%D8%A2%D8%BA%D8%A7%D8%B2-%DA%86%D8%A7%D9%84%D8%B4-%D8%A7%D8%B5%D9%84%DB%8C-%D8%AC%D9%85%D9%87%D9%88%D8%B1%DB%8C-%D8%A7%D8%B3%D9%84%D8%A7%D9%85%DB%8C-%D8%A8%D8%A7-%D8%AC%D8%A7%D9%85%D8%B9%D9%87%D9%94-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86", "summary": "در حالی که تلاش‌های دیپلماتیک برای یافتن راهی برای خاتمهٔ جنگ و جلوگیری از دور تازه‌ای از درگیری میان ایران و ایالات متحده ادامه دارد، تحولات منطقه نشان می‌دهد که بحران ایران دیگر صرفاً به پروندهٔ هسته‌ای، تحریم‌ها یا موازنهٔ نظامی محدود نیست. مسئلهٔ اصلی آیندهٔ نظام سیاسی ایران و توانایی آن برای عبور از مجموعه بحران‌هایی است که در داخل و خارج کشور با آن روبه‌روست. تصمیم‌های نظامی و امنیتی اخیر ایالات متحده، از جمله توجه بیشتر فرماندهی مرکزی ارتش آمریکا (سنتکام) به مرزهای شمالی ایران و تحرکات پیرامون مرزهای همجوار، باید در چارچوب همین تحولات ارزیابی شود. واشنگتن ظاهراً در حال تکمیل ابزارهای فشار بیشتر است تا در صورت شکست مذاکرات و بازگشت به رویارویی نظامی، امکان دسترسی ایران به مسیرهای پشتیبانی و دریافت تجهیزات نظامی از خارج کشور محدودتر شود. اهمیت این تحولات به‌ویژه از آن جهت است که روسیه همواره یکی از مسیرهای مهم همکاری نظامی و راهبردی حکومت ایران بوده است. کنترل و نظارت بیشتر بر مرزهای شمالی ایران می‌تواند در محاسبات امنیتی تهران تأثیرگذار باشد. با این حال، نباید هر اقدام نظامی یا امنیتی آمریکا را به منزلهٔ تص ست که از دوستی و اتحاد با این کشور استقبال می‌کند، اما دخالت در امور داخلی عراق را نمی‌پذیرد. وزیر خارجه عراق همچنین گفت بغداد اطلاعاتی در اختیار دارد که نشان می‌دهد برخی طرف‌های خارجی از خاک عراق برای حمله به کشورهای همسایه استفاده می‌کنند. او درباره روابط با عربستان سعودی نیز گفت عراق تلاش می‌کند اختلافات خود با ریاض را از طریق گفت‌وگوی صریح حل‌وفصل کند. فواد حسین در بخش دیگری از این گفت‌وگو به موضوع گروه‌های مسلح نزدیک به جمهوری اسلامی پرداخت و گفت انتقال سلاح‌ها به کنترل دولت باید از مسیر گفت‌وگو و نه درگیری مسلحانه انجام شود. به گفته او، نخست‌وزیر عراق با چهار گروه مسلح درباره موضوع سلاح به تفاهم رسیده است. عصائب اهل‌الحق و کتائب سیدالشهدا با قرار گرفتن سلاح‌هایشان تحت کنترل دولت موافقت کرده‌اند، اما مذاکرات با دو گروه حرکت النجباء و کتائب حزب‌الله همچنان ادامه دارد. او افزود دولت عراق در موضوع سلاح گروه‌های مسلح با ایران نیز رایزنی می‌کند. این اظهارات در ادامه هشدارهای اخیر مقام‌های عراقی درباره احتمال ازسرگیری جنگ میان آمریکا و جمهوری اسلامی مطرح شده است. فواد حسین روز پنج‌شنبه در گفت‌وگو با شبکه تلویزیونی دجله نیز احتمال حملات دوباره آمریکا به ایران را موضوعی پنهان‌نشدنی توصیف کرده و به گروه‌های مسلح عراقی هشدار داده بود که در صورت هرگونه واکنش نظامی جمهوری اسلامی مشارکت نکنند. او گفته بود جنگ دوباره برای عراق یک «فاجعه» خواهد بود.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B1_aoGI__v1024x512__box_0%2C3%2C1200%2C634.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۶ آبان • ۲۰:۵۸"}, {"source": "Euronews Persian", "title": "مجله خبری| ۱۶ آبان ۱۴۰۵ (۷ نوامبر ۲۰۲۶) - شامگاهی", "link": "https://parsi.euronews.com/video/2026/11/07/mglh-khbri-aban-noambr-shamgahi", "summary": "آخرین تحولات اروپا و جهان را دنبال کنید ۱۶ آبان ۱۴۰۵ (۷ نوامبر ۲۰۲۶). با یورونیوز در جریان آخرین اخبار و رویدادهای سیاسی، اقتصادی، فرهنگی و سرگرمی قرار بگیرید.", "date_str": "2026-11-07T17:00:30+00:00", "hash": "8094a4ed57641dda", "title_fa": "مجله خبری| ۱۶ آبان ۱۴۰۵ (۷ نوامبر ۲۰۲۶) - شامگاهی", "summary_fa": "آخرین تحو _str": "2026-11-07T15:58:55+00:00", "hash": "cd3cec4f570cde02", "title_fa": "محسن رضایی آمریکا را به «پاسخ ویرانگر» در صورت آغاز جنگ تهدید کرد", "summary_fa": "محسن رضایی، دبیر شورای عالی امنیت ملی جمهوری اسلامی و دریافت‌کننده نامه جی‌دی ونس، معاون رییس‌جمهور آمریکا، روز شنبه ۱۶ آبان به مقام‌های ... رضایی در پیامی در شبکه اجتماعی ایکس، با اشاره به جی‌دی ونس، مارکو روبیو، وزیر خارجه آمریکا، پیت هگست، وزیر جنگ و فرمانده سنتکام، درباره وضعیت مقام‌های دولت آمریکا نوشت: «ونس شکست را پذیرفته، روبیو در آستانه کناره‌گیری است، هگست به‌زودی برکنار خواهد شد و فرمانده سنتکام اکنون پادکست اجرا می‌کند.» او در ادامه خطاب به مقام‌های آمریکایی پرسید: «دقیقا در واشنگتن باید این پیام را به چه کسی برسانیم؟ جنگی را آغاز کنید، با پاسخی ویرانگر روبه‌رو خواهید شد.» این تهدیدها در حالی مطرح می‌شود که حسین محبی، سخنگوی سپاه پاسداران، نیز روز شنبه در گفت‌وگو با خبرگزاری فارس، وابسته به سپاه، گفت همه دارایی‌های مادی و غیرمادی کشورهای متخاصم، حتی خارج از مرزهای جغرافیایی آن‌ها، در دسترس جمهوری اسلامی قرار دارد. محبی همچنین با اشاره به برنامه موشکی جمهوری اسلامی گفت: «ما همیشه در حال ارتقای برد موشک‌هایمان هستیم و توقفی در این زمینه نداریم.» سخنگوی سپاه درباره احتمال تغییر دکترین هسته‌ای جمهوری اسلامی نیز گفت: «اگر نظام به این نتیجه برسد که به آن سمت حرکت کند، آمادگی لازم را ایجاد خواهیم کرد.» در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/k8pXh_hfbo__v1024x512__box_0%2C13%2C912%2C492.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱۶ آبان • ۱۹:۲۸"}, {"source": "IranWire", "title": "اقتصاد در آیینه‌ شبکه‌های اجتماعی؛ آینده دلار", "link": "https://iranwire.com/fa/features/159922-%D8%A7%D9%82%D8%AA%D8%B5%D8%A7%D8%AF-%D8%AF%D8%B1-%D8%A2%DB%8C%DB%8C%D9%86%D9%87-%D8%B4%D8%A8%DA%A9%D9%87%D9%87%D8%A7%DB%8C-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C-%D8%A2%DB%8C%D9%86%D8%  این شهر رخ داده است. سخنگوی آتش‌نشانی محلی به شبکه خبری پولست نیوز گفت که عامل تیراندازی از داخل یک خودروی در حال حرکت اقدام به شلیک کرده است", "date_str": "2026-11-07T16:15:45+00:00", "hash": "a9bebbf2b4cb8bba", "title_fa": "پلیس لهستان: دست‌کم پنج نفر در تیراندازی در شهر کراکوف کشته شدند", "summary_fa": "به گفته شهرداری کراکوف، تیراندازی در میدان اصلی این شهر رخ داده است. سخنگوی آتش‌نشانی محلی به شبکه خبری پولست نیوز گفت که عامل تیراندازی از داخل یک خودروی در حال حرکت اقدام به شلیک کرده است", "image_url": "https://images.euronews.com/articles/stories/09/98/39/87/1200x675_cmsv2_5d8a68d7-4e24-5e15-a922-635fd7c4f55b-9983987.jpg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۶ آبان • ۱۹:۴۵"}, {"source": "BBC Persian", "title": "در تیراندازی مرگبار در میدان اصلی کراکوف در لهستان تعدادی کشته و مجروح شدند", "link": "https://www.bbc.com/persian/articles/cmn06dx9yn2zo?at_medium=RSS&at_campaign=rss", "summary": "‌پلیس اعلام کرده است که در پی وقوع تیراندازی در میدان اصلی شهر کراکوف لهستان، پنج نفر کشته و دستکم ۱۲ نفر دیگر، از جمله شماری از مأموران پلیس، زخمی شده‌اند. به گفته مقامات حال یکی از مجروحان پلیس «وخیم» گزارش شده است.", "date_str": "2026-11-07T16:53:04+00:00", "hash": "214caec0fb2d22f5", "title_fa": "در تیراندازی مرگبار در میدان اصلی کراکوف در لهستان تعدادی کشته و مجروح شدند", "summary_fa": "‌پلیس اعلام کرده است که در پی وقوع تیراندازی در میدان اصلی شهر کراکوف لهستان، پنج نفر کشته و دستکم ۱۲ نفر دیگر، از جمله شماری از مأموران پلیس، زخمی شده‌اند. به گفته مقامات حال یکی از مجروحان پلیس «وخیم» گزارش شده است. پلیس منطقه مالوپولسکا در بیانیه‌ای در شبکه اجتماعی ایکس اعلام کرد که حدود ساعت ۳ بعد از ظهر به وقت محلی، مردی که با خودروی وارد میدان شده بود، از «داخل خودرو به سوی مردم تیراندازی کرد.» در بیانیه دیگری آمده است که ضارب هدف گلوله پلیس قرار گرفته و به بیمارستان منتقل شده است. گزارش شده است که ضارب «لباس نظامی» برتن داشته است. وزارت کشور لهستان گفت که ضارب شهروند این کشور است. دونالد توسک، نخست‌وزیر لهستان، اعلام کرد که وزیر کشور او را در جریان آخرین تحولات مربوط به تیراندازی مرگبار در شهر کراکوف قرار داده است. او افزود: « پلیس در حال بررسی انگیزه‌ها و تمامی ابعاد و جزئیات این حمله است.» کارول ناوروکی، رئیس‌جمهور لهستان، هم گفته است که از گزارش‌ها درباره «حوادث تلخ» در کراکوف عمیقا نگران است و به قربانیان، مجروحان و خانواده‌هایشان فکر می‌کند. گزارش‌ها حاکیست که وزیر کشور لهستان به کراکوف رفته است. اکنون در مرکز شهر کراکوف، حضور نیروهای پلیس بسیار پررنگ است. میدان اصلی در مرکز کراکوف در میان گردشگران بسیار محبوب است. هرچند در مقایسه با تابستان تعداد گردشگران کمتری اکنون در شهر حضور دارند، اما به گفته شاهدان حوالی زمان تیراندازی میدان پر از جمعیت بود. دور تا دور این میدان میدان کافه‌، بار و رستوران‌ قرار دارند و چون امروز شنبه است، معمولا افراد زیادی در این مکان‌ها حضور دارند. تام رز، سفیر آمریکا در لهستان، در اظهاراتی این حادثه را «حمله‌ای وحشیانه و مرگبار توصیف کرده که آرامش لهستان را در هم شکسته است.»", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/6fe2/live/c961fd80-dac9-11f1-bda8-29fb69dbc026.png", "category": "موسیقی و هنر", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۶ آبان • ۲۰:۲۳"}, {"source": "BBC Persian", "title": "سازمان ملل متحد می‌گوید که انتظار می‌رود تا پایان امسال «۷۰۰ مرکز درمانی» در افغانستان بسته شود", "link": "https://www.bbc.com/persian/articles/c9e8l5xx3jdgo?at_medium=RSS&at_campaign=rss", "summary": "رونو لمارکی، معاون نماینده ویژه ملل متحد در افغانستان، می‌گوید که با کاهش کمک‌های بشردوستانه در یک سال اخیر انتظار می‌رود تا «۷۰۰ مرکز صحی» تا پایان سال ۲۰۲۶ در این کشور تعطیل شوند. به باور او بسته شدن این مراکز منجر به فروپاشی خدمات صحی و درمانی در این کشور می‌شوند.", "date_str": "2026-11-07T16:18:30+00:00", "hash": "bede442c7e263c2e", "title_fa": "سازمان ملل متحد می‌گوید که انتظار می‌رود تا پایان امسال «۷۰۰ مرکز درمانی» در افغانستان بسته شود", "summary_fa": "رونو لمارکی، معاون نماینده ویژه ملل متحد در افغانستان، می‌گوید که با کاهش کمک‌های بشردوستانه در یک سال اخیر انتظار می‌رود تا «۷۰۰ مرکز صحی» تا پایان سال ۲۰۲۶ در این کشور تعطیل شوند. به باور او بسته شدن این مراکز منجر به فروپاشی خدمات صحی و درمانی در این کشور می‌شوند. کاهش کمک‌های بشردوستانه به افغانستان از اوت ۲۰۲۱ به اینسو بحران انسانی را در این کشور تشدید کرده است. از سویی هم بازگشت ۶ تا ۸ میلیون مهاجر از کشورهای همسایه به افغانستان بار سنگین‌تری به وضعیت شکننده افغانستان تحمیل کرده است. شماری از افغان‌ها می‌گویند که نبود خدمات بهداشتی و درمانی آنها را مجبور می‌کند به شهرهای بزرگتر پناه ببرند. افزایش تقاضا برای خدمات صحی، رسیدگی به بیماران را حتی در بیمارستان‌های شهرهای بزرگ مانند کابل، پایتخت، دشوار می‌کند. رونو لمارکی که پس از بازدید از هشت ولایت افغانستان به ایالات متحده آمریکا بازگشته است می‌گوید که کاهش کمک‌های انسانی رسیدگی به خدمات را دشوارتر کرده و نیازهای اولیه را در این کشور تشدید می‌بخشد. او هشدار داد که کاهش بودجه و قطع کمک‌ها پیامدهای جدی بر وضعیت بهداشتی و سلامتی مردم افغانستان خواهد داشت: «من بخش صحت و درمان را مثال می‌زنم. این بخش در حال فروپاشی است. انتظار می‌رود از ۲۰۲۵ تا ۲۰۲۶ چهل درصد مراکز ارائه خدمات اولیه بهداشتی و درمانی در تعطیل شوند. این به معنی ۷۰۰ بخش ارائه خدمات اولیه صحی از مجموع ۱۹۰۰ بخش در سراسر کشور است.» او تأکید کرد که پیامد‌ها « بسیار جدی» خواهند بود. کمبود کمک‌های بشردوستانه در ارائه خدمات بهداشتی و درمانی به وضوح مشاهده می‌شود که بر اثر آن افراد آسیب‌پذیر از جمله زنان باردار و کودکان را بیش از همه متأثر می‌کند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. مریم (نام", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/1a04/live/1ccf61f0-daa8-11f1-93e1-3b657b665bcf.jpg", "category": "موسیقی و هنر", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۶ آبان • ۱۹:۴۸"}, {"source": "Iran International", "title": "یک شرکت هواپیمایی به احترام رونالدو صندلی 7C را از پروازهای مادیرا حذف کرد", "link": "https://www.iranintl.com/202611073773", "summary": "ترانساویا، شرکت هواپیمایی فرانسوی، اعلام کرد که در اقدامی برای ادای احترام به کریستیانو رونالدو، پس از خداحافظی او از تیم ملی بزرگسالان پرتغال، صندلی 7C را از تمام پروازهای خود به مقصد فونشال در ج  بیش از ۲۵ میلیارد دلار نفت خام ایران جلوگیری کرده است. این ستاد نظامی همچنین تاکید کرده که محدودیت‌های دریایی علیه تمامی کشتی‌هایی که وارد بنادر ایران می‌شوند یا از آن‌ها خارج می‌شوند، همچنان با سخت‌گیری اجرا خواهد شد. تشکیل کارگروه «دروازه آهنین» نشان‌دهنده گسترش دامنه اقدامات آمریکا از کنترل مسیرهای دریایی به مقابله با انتقال تسلیحات و محموله‌های مشمول تحریم از طریق مرزهای زمینی ایران و دریای خزر است.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%D8%B3%D9%86%D8%AA%DA%A9%D8%A7%D9%85_qSVM__v1024x512__box_0%2C0%2C1488%2C782.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۶ آبان • ۱۷:۳۴"}, {"source": "Independent Persian", "title": "تهدید و مذاکره؛ سپاه: شهر زیرزمینی داریم و محدودیت برد موشک را برداشته‌ایم", "link": "https://www.independentpersian.com/node/423086/%D8%B3%DB%8C%D8%A7%D8%B3%DB%8C-%D9%88-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/%D8%AA%D9%87%D8%AF%DB%8C%D8%AF-%D9%88-%D9%85%D8%B0%D8%A7%DA%A9%D8%B1%D9%87%D8%9B-%D8%B3%D9%BE%D8%A7%D9%87-%D8%B4%D9%87%D8%B1-%D8%B2%DB%8C%D8%B1%D8%B2%D9%85%DB%8C%D9%86%DB%8C-%D8%AF%D8%A7%D8%B1%DB%8C%D9%85-%D9%88-%D9%85%D8%AD%D8%AF%D9%88%D8%AF%DB%8C%D8%AA-%D8%A8%D8%B1%D8%AF-%D9%85%D9%88%D8%B4%DA%A9-%D8%B1%D8%A7-%D8%A8%D8%B1%D8%AF%D8%A7%D8%B4%D8%AA%D9%87", "summary": "همزمان با آن که تلاش میانجی‌ها برای رساندن تهران و واشنگتن به نقطه توافق ادامه دارد و گزارش‌ها حاکی از رد و بدل شدن پیام‌هایی میان دو طرف است، مقام‌های سپاه پاسداران و ارتش جمهوری اسلامی همچنان تهدیدهایشان علیه آمریکا و کشورهای منطقه را تکرار می‌کنند. روز شنبه حسین محبی، سخنگوی سپاه پاسداران انقلاب اسلامی، در نشست خبری به مناسبت هفته هوافضای سپاه مدعی شد که طی یک تا دو هفته گذشته موفق شده‌اند هفت پهپاد شناسایی آمریکایی از نوع MQM-170 را به‌صورت سالم به زمین بنشانند. او این موضوع را نشانه برتری فناوری ایران بر فناوری نظامی آمریکا دانست. با این حال این ادعا تاکنون به‌طور مستقل تأیید نشده و مقام‌های نظامی آمریکا پیش‌تر ادعاهای مشابه ایران درباره رهگیری و تصرف این نوع پهپادها را رد کرده بودند. محبی همچ ه اتفاقی مربوط می‌شود که در فاصله بسیار کوچک میان چرخ و ریل رخ می‌دهد؛ جایی که لایه‌ای نازک از مواد گیاهی می‌تواند رفتار یک دستگاه عظیم را تغییر دهد. نتورک ریل، نهاد مسئول زیرساخت راه‌آهن بریتانیا، ماجرای قطار اکتبر ۲۰۲۲ را به‌عنوان نمونه‌ای از پیامدهای کاهش چسبندگی ثبت کرد. این دردسر هر پاییز در شبکه‌های ریلی تکرار می‌شود و برای مقابله با آن قطارهای ویژه به راه می‌افتند تا با آب‌پاش‌های پرفشار و مواد اصطکاک‌افزا مشکل را حل کنند. اما در کنار این نبرد سنگین، پژوهشگران به راه‌حلی رسیده‌اند که با تمام شهود و منطق روزمره ما تضاد دارد، گاهی برای مهار ریلی که به‌خاطر رطوبت و برگ لیز شده، تنها باید کمی آب بیشتر روی آن بریزیم! کپی لینک برگ پاییزی چگونه به «تفلون سیاه» تبدیل می‌شود؟ برگ‌ها همیشه مستقیماً از شاخه درختان روی ریل نمی‌افتند، گاهی هم وقتی قطاری با سرعت عبور می‌کند، جریان هوای اطرافش برگ‌های ریخته‌شده در حاشیه مسیر را به هوا بلند می‌کند و روی", "image_url": "https://api2.zoomit.ir/media/passenger-train-autumn-forest-6aef57fd354e588119e483a6?w=1920&q=75", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۲۲:۰۰"}, {"source": "Business Insider", "title": "I live in the Hamptons, where a smoothie can be $30. I'm teaching my kids that that isn't normal.", "link": "https://www.businessinsider.com/raising-kids-hamptons-not-rich-teaching-money-values-2026-11", "summary": "The author is raising her kids in the Hamptons. Courtesy of the author I'm raising two kids in the Hamptons, where luxury homes and expensive cars are everywhere. We're not wealthy, so I teach them about money and why we can't always buy what they want. I want them to value practical skills, hard work, and experiences over expensive possessions. I live in the Hamptons year-round, and my children are growing up in a place often associated with wealth, status, and luxury. They see beautiful homes, boats in the harbor, expensive cars, and designer shops lining the streets. My children have many luxuries surrounding them, but our family is not rich . As a parent, I'm very conscious of teaching them that happiness does not come from expensive things , exclusive places, or what other families may have. I want them to know how to live with comparison without feeling ashamed of what they do not have or entitled to have. Everything is expensive Every day prices can make that lesson difficult. At Candy Kitchen in Bridgehampton, two eggs currently cost $10.95, and pancakes are $12.95. Elsewhere, a smoothie can cost more than $30 (including my favorite spot for that Mint Chip Smoothie in Sag Harbor). Even taking two children for ice cream adds up quickly once everyone chooses a cone and toppings (on average, it costs $28 for two frozen yogurt sundaes). I don't want my children to think these prices are standard, or that every trip outside the house should include an ice cream or a visit to the card shop. I will tell them in advance, \"If you want candy or cards today, bring money from your piggy bank.\" This gives them a choice while helping them understand that money is finite. At the same time, I don't believe that raising grounded children means never going out or enjoying what is around us. Alongside the designer stores are nostalgic places such as Kites of the Harbor and The Wharf Shop, where casually browsing the toy collection , sterling silver jewelry, and handmade home decor can feel like a part of childhood. It is important to experience these places and find a balance. We talk openly about finances We openly discuss savings and finances to a degree they can understand. I don't burden them with adult worries, but I don't pretend that everything is affordable. When they spend their own money, they look at prices differently. They weigh how much they want something and whether it is worth giving up something else later. I try to show them that some of the best e", "date_str": "2026-11-07T19:45:01+00:00", "hash": "62b6b86217b1de8d", "title_fa": "من در همپتونز زندگی می کنم، جایی که اسموتی می تواند 30 دلار باشد. من به بچه هایم یاد می دهم که این طبیعی نیست.", "summary_fa": "نویسنده بچه هایش را در همپتون ها بزرگ می کند. با حسن نیت نویسنده من دو بچه را در همپتون بزرگ می کنم، جایی که خانه های لوکس و ماشین های گران قیمت همه جا هستند. ما ثروتمند نیستیم، بنابراین به آنها در مورد پول و اینکه چرا همیشه نمی‌توانیم چیزی را که آنها می‌خواهند بخریم، یاد می‌دهم. می‌خواهم مهارت‌های عملی، سخت‌کوشی و تجربیات را بیش از دارایی‌های گران قیمت بدانند. من در تمام طول سال در همپتونز زندگی می کنم و فرزندانم در مکانی بزرگ می شوند که اغلب با ثروت، موقعیت و تجمل همراه است. آن‌ها خانه‌های زیبا، قایق‌ها در بندر، ماشین‌های گران‌قیمت و مغازه‌های طراحان را می‌بینند که در خیابان‌ها قرار دارند. فرزندان من تجملات زیادی در اطراف آنها دارند، اما خانواده ما ثروتمند نیستند. به عنوان یک پدر و مادر، بسیار آگاهم که به آنها یاد بدهم که خوشبختی از چیزهای گران قیمت، مکان‌های منحصر به فرد یا چیزهایی که سایر خانواده‌ها ممکن است داشته باشند به دست نمی‌آید. من می خواهم آنها بدانند که چگونه با مقایسه زندگی کنند بدون اینکه از چیزی که ندارند یا حق داشتن آن را دارند شرمنده شوند. همه چیز گران است هر روز قیمت ها می توانند این درس را دشوار کنند. در Candy Kitchen در بریجهمپتون، دو عدد تخم مرغ در حال حاضر 10.95 دلار و پنکیک 12.95 دلار قیمت دارند. در جاهای دیگر، یک اسموتی می تواند بیش از 30 دلار قیمت داشته باشد (از جمله محل مورد علاقه من برای اسموتی نعناع چیپ در Sag Harbor). حتی بردن دو کودک برای بستنی هم زمانی که همه یک مخروط و رویه انتخاب می‌کنند به سرعت افزایش می‌یابد (به طور متوسط ​​برای دو عدد ماست منجمد 28 دلار هزینه دارد). من نمی‌خواهم فرزندانم فکر کنند این قیمت‌ها استاندارد هستند، یا اینکه هر سفر خارج از خانه باید شامل", "image_url": "https://i.insider.com/6ae386cdfdfd5d46e952ab1f?width=1046&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["تراشه"], "datetime_fa": "۱۶ آبان • ۲۳:۱۵"}, {"source": "Business Insider", "title": "Trump says he offered 'violent fighter' Dana White the role of press secretary: 'Dana, please take the job!'", "link": "https://www.businessinsider.com/trump-dana-white-house-press-secretary-job-2026-11", "summary": "Dana nassian I live in California and love visiting new towns and cities off the Amtrak Pacific Surfliner route . One of my favorite places to visit is Ventura, a coastal city with great food and thrift shopping. I love how easy it is to get around Ventura without a car, and an Amtrak ticket from LA is just $22. Given the opportunity, I'd happily travel everywhere by train. Luckily, I live in Southern California , where I can easily explore neighborhoods up and down the coast via the Amtrak Pacific Surfliner. This beautiful coastal train runs all the way from San Diego to San Luis Obispo, and I've discovered tons of cool towns and cities simply by exploring the stops along the route. One of my favorites is the city of Ventura: It's an easy, $22 day trip from my nearest train station in Los Angeles. Ventura is a historic beach town north of LA with a wealth of attractions, from relaxing, surfer-laden beaches to eclectic shopping and delicious food. The train ride to Ventura is short and affordable I ll often eat a quick breakfast on the Amtrak. Liana Minassian A one-way ticket from the Hollywood Burbank Airport station costs just $22 and gets me to Ventura within an hour and a half. One of the perks of traveling by Amtrak , instead of by car or bus, is the café car experience. If I don't have time for Starbucks in the morning, I'll grab a coffee and a vegetarian breakfast burrito with cheese, eggs, and potatoes (and then douse it in hot sauce or ketchup). I also love that Ventura's beach is just a block from the train station. This means I don't have to pay for parking or fight for a good beachside spot. The beach is typically the first place I go upon arriving. I walk south toward the pier, down the paved promenade that runs along Surfers Point. Sometimes, I'll roam the pier and get a fish taco or elote from Beach House Tacos. But usually, I just sit in the sand with a good book and lounge for an hour or so, relaxing in the sun. Before I leave the beach, I like to indulg h": "3c739512bc243d44", "title_fa": "آن حروف ناخوانای اعصاب‌خردکن بی‌دلیل نبودند؛ ماجرای عجیب کپچاهای قدیمی اینترنت", "summary_fa": "سیستم ری‌کپچا سال‌ها با مقایسه پاسخ کاربران، کلمات ناخوانای اسناد فرسوده را شناسایی می‌کرد و بیش از ۴۴۰ میلیون واژه تاریخی را نجات داد. تبلیغات سال‌ها پیش، وقتی کاربران اینترنت برای اثبات اینکه ربات نیستند کلمات ناخوانای روی صفحه را تایپ می‌کردند، ناخواسته در پروژه‌ای بزرگ برای دیجیتالی‌کردن کتاب‌ها و روزنامه‌های قدیمی مشارکت داشتند. این ایده پشت سرویس reCAPTCHA بود که گوگل در سال ۲۰۰۹ آن را خرید. اگر از کاربران قدیمی اینترنت باشید، احتمالاً تصویرهایی با حروف کج‌ومعوج و کلمات محوشده را به یاد دارید که برای ورود به سایت‌ها یا ثبت‌نام در سرویس‌های آنلاین باید آن‌ها را می‌خواندید و تایپ می‌کردید. این آزمون‌ها که کپچا (CAPTCHA) نام دارند، برای تشخیص انسان از ربات طراحی شده بودند. اما نسخه‌ای از این فناوری به نام reCAPTCHA کاربرد جالب دیگری هم داشت: کمک به خواندن متن کتاب‌ها و روزنامه‌هایی که کامپیوتر از تشخیص کلمات آن‌ها ناتوان بود. کپی لینک چطور یک کپچا به دیجیتالی‌شدن کتاب‌ها کمک می‌کرد؟ هنگام اسکن کتاب‌های قدیمی، نرم‌افزارهای تشخیص متن یا OCR تلاش می‌کنند نوشته‌های داخل تصاویر را به متن قابل‌جست‌وجو تبدیل کنند؛ اما کاغذهای فرسوده، لکه‌های جوهر و حروف محوشده باعث می‌شوند بعضی کلمات به‌درستی تشخیص داده نشوند. کاری که برای هر کاربر فقط چند ثانیه طول می‌کشید، در مقیاس میلیونی به فرایندی گسترده برای بازخوانی اسناد تاریخی تبدیل شد اینجا بود که ایده‌ی reCAPTCHA به کار می‌آمد. کاربران معمولاً دو کلمه می‌دیدند: یکی با پاسخ از پیش مشخص برای تأیید انسان‌بودن کاربر و دیگری کلمه‌ای از یک سند اسکن‌شده که نرم‌افزار نتوانسته بود آن را بخواند. کاربر با تایپ این دو کلمه، هم ثابت می‌کرد انسان است و هم به خواندن یک کلمه‌ی ناخوانا از کتابی قدیمی کمک می‌کرد. برای جلوگیری از ثبت پاسخ اشتباه، سیستم پاسخ چندین کاربر را با یکدیگر مقایسه می‌کرد. وقتی افراد مختلف به نتیجه‌ی مشابهی می‌رسیدند، سامانه می‌توانست با اطمینان", "image_url": "https://api2.zoomit.ir/media/captcha-solving-old-books-digitization-6aeadef2b001528ef859d571?w=1920&q=75", "category": "فناوری و نو g belief? Email Jennifer Beck Goldblatt at jgoldblatt@insider.com to share your experience with Business Insider. In practice, we've made a few exceptions for screens. Our son is allowed to have video calls with his grandparents. He can watch television with us if it's an educational or news program in Dutch or a cooking show. We made temporary exceptions during the World Cup and the Olympics. But, when it's adult programming, my son tends to lose interest after a few minutes and then prefers to play with his toys. We understand the temptation of letting a screen entertain a toddler Our son has been on the move since he started crawling at 6 months old, and walking at a year old. Since he started crawling, he never stays in one place unless he's sleeping. For most day-to-day activities, we don't mind that our son is a busy, active toddler, but the one time we would really like a break is when we go out to eat. Occasionally my son will stay seated for a whole meal, but more often than not my husband and I take turns walking him around the restaurant. There have been meals when we didn't even ge", "date_str": "2026-11-07T16:29:01+00:00", "hash": "375709a416d7e085", "title_fa": "من به کودک نوپایم اجازه نمی‌دهم روی صفحه نمایش بگذارد. گاهی به پدر و مادری که این کار را می کنند حسادت می کنم.", "summary_fa": "نویسنده گفت که او و همسرش بسیار تلاش کرده اند تا کودک 2 ساله خود را از نمایشگرها دور نگه دارند. او اعتراف می کند که گاهی اوقات سخت تر از حد انتظار است. با حسن نیت از Renate Flanagan. قبل از بچه دار شدن، من و شوهرم می‌دانستیم که می‌خواهیم تا آنجایی که ممکن است صفحه نمایش را دور نگه داریم. حالا که بچه داریم، بیشتر به آن برنامه پایبند بوده ایم، اما همیشه آسان نیست. گاهی اوقات من کمی به کسانی که اجازه نمایش صفحه نمایش را می دهند حسادت می کنم، اما هنوز از این تصمیم راضی هستم. حتی قبل از بچه دار شدن، من و شوهرم در مورد ارزش های فرزندپروری خود بحث کردیم. ما می دانستیم که می خواهیم فرزند آینده ما با زبان انگلیسی و زبان مادری شوهرم هلندی بزرگ شود. به جای سفرهای پرهزینه به دنیای دیزنی، توافق کردیم که فرزندمان را به دیدن قلعه های واقعی در اروپا ببریم. ما همچنین برای به تاخیر انداختن زمان نمایش تا زمانی که ممکن است هماهنگ بودیم. برای ما، این بدان معنا بود که فرزندمان از تلفن همراه، تبلت یا تماشای تلویزیون استفاده نمی‌کند. اکنون که ما یک بچه داریم، فلسفه های نظری فرزندپروری ما در برابر یک کودک نوپا در دنیای واقعی آزمایش شده است. ما به اسلحه‌هایمان چسبیده‌ایم، اما گاهی اوقات می‌پرسیم که اگر به پسرمان اجازه دهیم از صفحه نمایش استفاده کند، فرزندپروری برایمان آسان‌تر خواهد بود. ما به ارزش‌های بدون صفحه خود پایبند بوده‌ایم، به استثنای چند مورد، پسر ما تقریباً 3 ساله است، و در بیشتر موارد، دوران کودکی‌ای مشابه دارد و به جای فناوری با بلوک‌ها، ماشین‌ها و کتاب‌های رنگ‌آمیزی بازی می‌کند. آیا در مورد یک باور مشترک والدینی نظر گرمی دارید؟ به جنیفر بک گلدبلات به آدرس jgoldblatt@insider.com ایمیل بزنید تا تجربه خود را با Business Insider به", "image_url": "https://i.insider.com/6ad8eb6a510d67c758d856a2?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۱۹:۵۹"}, {"source": "Business Insider", "title": "AI is changing what it takes to get hired as a mathematician", "link": "https://www.businessinsider.com/ai-math-hiring-academia-papers-journals-phd-charisma-communication-2026-11", "summary": "A math professor at the University of Chicago says AI is changing hiring processes in academia. Jacek Boczarski/Anadolu via Getty Images Mathematicians are struggling as AI upends their field. One professor says that mathematicians need to develop better communication skills to stay relevant. Charisma can help scholars set themselves apart, he said. AI is lowering the barriers to mathematical discovery . One prominent math professor says that means hiring practices in academia need to get a whole lot more personal, and mathematicians need to get a whole lot more eloquent at communicating their ideas. \"I am looking for a narrative of where you want mathematics to go, the technical ability to explain why this may be possible,\" Frank Calegari, a math phenom at the University of Chicago, wrote in a recent essay about what he's looking for in a researcher. At issue for Calegari is the distinct possibility that low-level researcher positions across academia will be filled by students who only got there by churning out AI-generated proofs . A 30-minute discussion, though, would differentiate those slop-producers from promising candidates with a clear vision and a talent for communication. \"The hiring process is going to have to be much more about personal interactions than a paper file,\" Calegari said in his essay, which was posted on Terence Tao's blog. Calegari slammed what he described as \"lazy committees\" that hired students based on a single paper or academic publication, which could now be sired by AI. \"Once we take this approach, we then have the responsibility to train our own graduate students to be better able to communicate mathematics, something that we should take much more seriously,\" he said. Last month, Cornell professor Steven Strogatz remarked that mathematicians with \"rizz,\" a slang term for charisma, had newfound stock because they could explain AI-generated results and turn them into new questions. The brusque push by AI companies into mathematics has caused consternation and head-scratching among many a math geek, as the field ponders how to stay relevant while OpenAI floods the field with hundreds of proposed solutions to the world's most complex problems. Some professors have sworn off AI altogether. Most, however, are trying to find ways to incorporate the technology into their work. Students across the country are also struggling to adapt, demanding that their professors publish clear guidance on how to use AI, if at all. \"We are lacking", "date_str": "2026-11-07T16:17:17+00:00", "hash": "518175f45d76a0b7", "title_fa": "هوش مصنوعی آنچه را که برای استخدام به عنوان یک ریاضیدان لازم است تغییر می دهد", "summary_fa": "یک استاد ریاضی در دانشگاه ش 026-11", "summary": "I was curious which chain offered better value and flavors, so I decided to settle the Chipotle versus Qdoba debate for myself. Savannah Born I ordered a burrito bowl, chips, and spicy salsa at Chipotle and Qdoba to compare the chains. My meal was cheaper at Qdoba, mostly because the chain didn't charge extra for queso or guacamole. Both chains served hefty portions and OK salsa, but Chipotle was my winner for its burrito bowl. Whether for guacamole, queso, or burritos, few things are more polarizing than Chipotle and Qdoba, two of the largest Mexican-inspired restaurant chains in the United States. Compared to Chipotle, a massive publicly traded company with more than 4,000 locations worldwide, Qdoba is modest in size, operating 893 total locations across the United States, Canada, and Japan. Qdoba is a privately owned chain that relies heavily on franchising, which makes up the majority of its locations. The chain reportedly had nearly $1.3 billion in systemwide sales in the US in 2025, according to Technomic data . By comparison, Chipotle generated over $11 billion in systemwide sales in 2025, earning it a spot among the highest-grossing fast-food chains in the US. Another key distinction: the company owns and operates nearly all of its locations. Even so, the chains have a few similarities. Both famously serve customizable cuisine and were founded in Denver in the 1990s. Business aside, as a customer, I was curious which chain offered a better value and more flavorful options. So, I visited both and ordered a similar burrito bowl topped with seven key ingredients, plus a side of chips and spicy salsa. Here's how my meals stacked up in taste, price, and value. I started at Chipotle, where I d eaten many times. Savannah Born Chipotle was my lifeline in college, and I've been pretty loyal to it in recent years during the rare occasions I opt for fast-casual dining . The chain is known for its made-to-order format, allowing customers to customize bowls, tacos, salads, and burritos. It also offers family meal deals , which are discounted bundles for four to six people. Many fans also rave about its six-ingredient guacamole , which is said to be mashed up fresh every day. Then I went to Qdoba, a chain I d never tried. Savannah Born I'd never visited a Qdoba before, but I was open to seeing if the underdog could become my new go-to. Like Chipotle, Qdoba is recognized for its personalized fare. However, I find variety sets it apart. Beyond the basics, Qdoba of", "date_str": "2026-11-07T16:08:01+00:00", "hash": "c84a68f0fbcd95fd", "title_fa": "من همان غذا را در Chipotle و Qdoba سفارش دادم. یک زنجیره برنده آشکار بود.", "summary_fa": "کنجکاو بودم که کدام زنجیره ارزش و طعم بهتری دارد، بنابراین تصمیم گرفتم بحث Chipotle و Qdoba را برای خودم حل کنم. Savannah Born در Chipotle و Qdoba یک کاسه بوریتو، چیپس و سالسا تند سفارش دادم تا زنجیره‌ها را با هم مقایسه کنم. وعده غذایی من در Qdoba ارزان تر بود، بیشتر به این دلیل که زنجیره هزینه اضافی برای queso یا guacamole دریافت نمی کرد. هر دو زنجیره غذاهای سنگین و سالسا خوب سرو می کردند، اما چیپوتل برنده من برای کاسه بوریتو بود. چه برای گواکاموله، چه کیسو، یا بوریتو، چیزهای کمی از چیپوتل و قدوبا، دو تا از بزرگترین رستوران‌های زنجیره‌ای با الهام از مکزیک در ایالات متحده، قطبی‌تر هستند. در مقایسه با Chipotle، یک شرکت سهامی عام با بیش از 4000 شعبه در سراسر جهان، Qdoba از نظر اندازه متوسط ​​است و در مجموع 893 مکان در سراسر ایالات متحده، کانادا و ژاپن فعالیت می کند. Qdoba یک زنجیره خصوصی است که به شدت بر فرانچایز متکی است، که اکثر مکان‌های آن را تشکیل می‌دهد. طبق داده های تکنومیک، طبق گزارشات، این زنجیره در سال 2025 تقریباً 1.3 میلیارد دلار فروش در سراسر سیستم در ایالات متحده داشته است. در مقایسه، Chipotle بیش از 11 میلیارد دلار فروش در سراسر سیستم در سال 2025 به دست آورد و در میان پردرآمدترین زنجیره های فست فود در ایالات متحده قرار گرفت. تمایز کلیدی دیگر: این شرکت تقریباً همه مکان های خود را در اختیار دارد و اداره می کند. با این حال، زنجیره ها شباهت های کمی دارند. هر دو به طرز معروفی غذاهای قابل تنظیم سرو می کنند و در دهه 1990 در دنور تأسیس شدند. جدا از تجارت، به عنوان یک مشتری، کنجکاو بودم که کدام زنجیره ارزش بهتر و گزینه‌های خوش طعم‌تری را ارائه می‌دهد. بنابراین، من از هر دو بازدید کردم و", "image_url": "https://i.insider.com/6ada551a510d67c758d85e0f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۱۹:۳۸"}, {"source": "Business Insider", "title": "I'm a 41-year-old single mom with 2 teens. Six months ago, I asked my friend to move in with us.", "link": "https://www.businessinsider.com/friend-shares-home-with-me-my-kids-saving-money-benefits-2026-11", "summary": "Having a friend live with me and my kids has allowed us both to save money. Sarah Gallucci To save some money, I asked my friend Jennifer if she wanted to live with me and my two kids. We share household expenses , and she also contributes to my monthly mortgage payment. Not only has it been financially beneficial, but Jennifer has also become part of our family. As a single mom , I always loved the idea of living with friends later in life. I pictured something like \"The Golden Girls\" — gray hair, grown children, and long days laughing with my closest companions. I never expected that lifestyle to happen at 41, while I was still raising my kids on my own and figuring out what came next. But that all changed this past summer, when I texted my friend Jennifer and asked if she'd consider moving in with us. Jennifer and I weren't very close before this. Sure, we checked in on each other from time to time, and would go to dinner or a movie together every few months, but that was it. Even though we weren't best friends , I still thought she and I would be ideal roommates because we're both clean, organized, and responsible. Plus, we were both looking for a financial reset. I'd been planning a move to Paris and had put my side hustles on the back burner, but when the move fell through, I was stretched thin as a single mom covering a mortgage alone. Similarly, at 49, Jennifer was burned out from leading a media network and a mental-health nonprofit. She was also single, living alone in an apartment — since her kids are all grown — and shouldering all her expenses. We realized that sharing a home could help us both save some money while we figured out our next steps. Because we weren't super close friends to begin with, we didn't have to worry about the arrangement infringing upon our relationship. And as long as my two teenage kids were fine with it, I felt good about the decision. So, after two weeks of discussion, Jennifer moved in. Sharing expenses made room for small joys again It never felt awkward bringing a new person into our home. Sarah Gallucci The first weekend we lived together, I was surprised there wasn't any awkwardness. She fit right in, asking about our shower schedules, what time we woke up and went to bed, and the WiFi password. Thankfully, our two-story home gave everyone enough privacy, with my room on the first floor and Jennifer's and my kids' rooms on the second, so we never felt like we were stepping on each other's toes. Our two-story ho", "date_str": "2026-11-07T16:07:01+00:00", "hash": "025e729d24bf8cd8", "title_fa": "من یک مادر مجرد 41 ساله با 2 نوجوان هستم. شش ماه پیش از دوستم خواستم که با ما نقل مکان کند.", "summary_fa": "زندگی دوستی با من و فرزندانم به هر دوی ما امکان پس انداز پول را داده است. سارا گالوچی برای صرفه جویی در پول، از دوستم جنیفر پرسیدم که آیا او می خواهد با من و دو فرزندم زندگی کند. ما مخارج خانه را با هم تقسیم می کنیم، و او نیز در پرداخت ماهانه وام مسکن من مشارکت می کند. نه تنها از نظر مالی مفید بوده است، بلکه جنیفر نیز بخشی از خانواده ما شده است. به عنوان یک مادر مجرد، همیشه این ایده را دوست داشتم که در آینده با دوستان زندگی کنم. چیزی شبیه «دختران طلایی» را به تصویر کشیدم - موهای خاکستری، کودکان بالغ و روزهای طولانی خندیدن با نزدیکترین همراهانم. من هرگز انتظار نداشتم که این سبک زندگی در 41 سالگی اتفاق بیفتد، در حالی که من هنوز بچه هایم را به تنهایی بزرگ می کردم و می فهمیدم چه اتفاقی می افتد. اما همه چیز در تابستان گذشته تغییر کرد، زمانی که به دوستم جنیفر پیام دادم و از او پرسیدم که آیا او قصد دارد با ما زندگی کند. من و جنیفر قبل از این خیلی صمیمی نبودیم. مطمئناً، ما هر از چند گاهی با هم چک می‌کردیم و هر چند ماه یک بار با هم به شام ​​یا سینما می‌رفتیم، اما تمام شد. با وجود اینکه ما بهترین دوستان نبودیم، هنوز فکر می‌کردم من و او هم اتاقی ایده‌آلی خواهیم بود، زیرا هر دو تمیز، منظم و مسئولیت‌پذیر هستیم. به علاوه، هر دوی ما به دنبال تنظیم مجدد مالی بودیم. من در حال برنامه ریزی برای نقل مکان به پاریس بودم و هوس های جانبی خود را در پشت مشعل قرار داده بودم، اما وقتی این حرکت به پایان رسید، به عنوان یک مادر مجرد که به تنهایی وام مسکن را پوشش می دهد، لاغر شدم. به همین ترتیب، در 49", "image_url": "https://i.insider.com/6aeba742308912814ed7103c?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۶ آبان • ۱۹:۳۷"}, {"source": "Business Insider", "title": "My 15-year-old dog was struggling to walk, so I taught him Pilates. His recovery inspired me to start a business.", "link": "https://www.businessinsider.com/senior-golden-retriever-pilates-inspired-business-2026-11", "summary": "Jillian Loustaunau and her dog, Weasel, at her Pilates studio. Courtesy of Jillian Loustanau Jillian Loustaunau was concerned when her beloved dog, Weasel, began to lose strength in his legs. The fitness instructor introduced him to Pilates moves to build muscle and improve his alignment. His improvement inspired her to launch \"Pawlates 101,\" training other pets in the practice online. This story is based on an interview with Jillian Loustaunau, 36, the owner of a Pilates studio in Kailua, O'ahu. It has been edited for length and clarity. I never imagined that my efforts to help my beloved dog, Weasel, regain his mobility would a) be so successful and b) lead to the launch of my new business. But here I am with a much healthier companion and an enterprise that encourages other animal lovers to help their pets in a similar way. My dog couldn't walk in a straight line Weasel, who turns 16 next month, has always been an active, energetic golden retriever. Before his red coat turned gray six years ago, people would ask me how old he was. \"Ten,\" I'd reply. They nearly always took it to mean 10 months because he looked and behaved like a puppy . One day in May, however, he seemed really off. We were walking home from lunch, just around the block, and he couldn't walk in a straight line. It was almost as if he were drunk, and I wasn't sure if I needed to carry him. Loustanau and Weasel during one of their workouts. Courtesy of Jillian Loustanau It was hard to get a formal diagnosis at the vet. A client at my Pilates studio, a surgical vet, took a look, as well. She did a test where she flipped Weasel's back paw under, and he kept it like that. She said that a dog without neurological issues would want to flip the paw back and encouraged me to start acupuncture and physiotherapy. It was the best way to preserve the mobility he hadn't lost. We got a little wagon for his back legs, but soon realized he needed to move on his own as much as possible. The PT made me laugh because he said he was going to show Weasel what a plank was. I had the idea that we could use some of the Pilates equipment to help him He didn't know that Weasel was already familiar with the move. He'd often do them alongside my clients, and I'd occasionally let him hop onto one of the machines, too. The physiotherapy involved planking, turning sideways, and backward walking. At one point, I had the idea that we could use some of the Pilates equipment to help him. It took a while for him to get use", "date_str": "2026-11-07T16:02:01+00:00", "hash": "57cd610fbf6716ec", "title_fa": "سگ 15 ساله من برای راه رفتن مشکل داشت، بنابراین من به او پیلاتس یاد دادم. بهبودی او به من انگیزه داد تا کسب و کاری را شروع کنم.", "summary_fa": "جیلیان لوستونو و سگش، ویزل، در استودیوی پیلاتس. با حسن نیت از Jillian Loustana ", "date_str": "2026-11-07T14:00:00+00:00", "hash": "5fcee362572aaad8", "title_fa": "اختاپوس‌ها چطور از سوراخ‌هایی کوچک‌تر از بدنشان عبور می‌کنند؟", "summary_fa": "دانشمندان با ساخت اتاق فرار برای اختاپوس‌ها، به رازی شگفت‌انگیز درباره‌ی توانایی این جانوران در عبور از باریک‌ترین شکاف‌ها پی بردند. تبلیغات اختاپوس‌ها می‌توانند بدن نرم و انعطاف‌پذیر خود را از سوراخ‌هایی عبور دهند که بسیار کوچک‌تر از اندازه‌ی بدنشان هستند. این توانایی شگفت‌انگیز مدت‌ها توجه دانشمندان را جلب کرده بود، اما چگونگی انجام آن به‌طور دقیق مشخص نبود. اکنون پژوهشگران با طراحی آزمایشی تازه دریافته‌اند که اختاپوس‌ها برای عبور از فضاهای تنگ، بسته به اندازه‌ی سوراخ از دو روش متفاوت استفاده می‌کنند. به‌گزارش آی‌اف‌ال‌ساینس ، گروهی از پژوهشگران برای بررسی نحوه‌ی عبور اختاپوس‌ها از فضاهای محدود، مجموعه‌ای از محفظه‌های شفاف پلکسی‌گلاس ساختند. این محفظه‌ها مانند اتاق فرار عمل می‌کردند و اختاپوس‌ها برای خروج از آن‌ها باید از سوراخ‌هایی با اندازه‌های مختلف عبور می‌کردند. در آزمایش‌ها دو گونه، شامل اختاپوس معمولی ( Octopus vulgaris ) و اختاپوس مایایی ( Octopus maya )، شرکت داشتند. پژوهشگران ابتدا فاصله‌ی میان چشم‌های هر اختاپوس را اندازه گرفتند تا بتوانند سوراخ‌هایی متناسب با ساختار بدن جانور طراحی کنند. بدن اختاپوس‌ها برخلاف بسیاری از جانوران، فاقد اسکلت سخت داخلی است و بیشتر قسمت‌های آن می‌توانند به‌شدت تغییر شکل دهند. بااین‌حال، همه‌ی بخش‌های بدن این جانور به یک اندازه انعطاف‌پذیر نیستند. ساختار سختی که از بخشی از دستگاه عصبی مرکزی محافظت می‌کند، در کنار منقار ساخته‌شده از کیتین، از قسمت‌هایی است که نمی‌تواند مانند بافت‌های نرم اطراف فشرده شود. به همین دلیل، فاصله‌ی میان چشم‌ها یکی از معیارهای مهم برای تعیین اندازه‌ی سوراخ‌هایی بود که اختاپوس‌ها می‌توانستند از آن‌ها عبور کنند. پژوهشگران سوراخ‌هایی اندکی بزرگ‌تر و اندکی کوچک‌تر از این فاصله طراحی کردند تا رفتار جانوران را در شرایط متفاوت بررسی کنند.", "image_url": "https://api2.zoomit.ir/media/octopus-passing-through-small-hole-6aeee530b001528ef859db89?w=1920&q=75", "category": "فناوری و نوآوری", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "How much more money you need to make to afford a home in every US state", "link": "https://www.businessinsider.com/how-much-more-money-needed-to-buy-home-every-us-state-2026-11", "summary": "Salaries increased in nearly every state, but still not enough to afford the typical home. Grace Cary/Getty Images Incomes have increased in nearly every state, but buying a home hasn't gotten any easier. The national median income is still $31,136 short of affording the median-priced home. Realtor.com data shows that the additional income needed to buy a home ranges from $2,287 to $98,469. Nearly every state in the US experienced a bump in household income last year, yet it's still not enough to afford the typical home . States like Rhode Island and Virginia saw fairly large increases in income from 2024 to 2025 — 9.02% and 7.85%, respectively — but an additional five figures is needed to afford a median-priced home in each state, according to data from the US Census and Realtor.com. Realtor.com senior economist Hannah Jones said that even though households are bringing in more money, an increase in mortgage rates since last year isn't helping. \"Mortgage rates are more than one percentage point higher than a year ago, which cuts into buyer budgets and offsets the affordability gains from softening home prices and rising incomes,\" Jones said. \"Nationally, the median household income is not enough to afford the median-priced home in any state.\" The national median household income was $84,780 in 2025 — a roughly 3.8% increase from the previous year. However, with the national median listing price at $419,250 in September 2026, that's $31,136 short of the recommended income to buy, assuming a mortgage rate of 7.32% and a 10% down payment, according to Realtor. Realtor calculated the additional amount needed above the median income to afford the typical home in each state, and found that some require a couple thousand dollars, while others require nearly six figures. See how much more money you need to afford an average home in each state. States in ascending order of the additional household income needed to afford the median-priced home. Iowa Iowa. DenisTangneyJr/Getty Images Median household income: $76,483 2024-2025 change in income: 1.30% Additional household income needed to afford the median-priced home: $2,287 Illinois Illinois. Jeremy Poland/Getty Images Median household income: $86,676 2024-2025 change in income: 4.16% Additional household income needed to afford the median-priced home: $3,168 Ohio Cleveland. Ultima_Gaina/Getty Images Median household income: $74,804 2024-2025 change in income: 3.59% Additional household income needed to afford the ", "date_str": "2026-11-07T14:23:01+00:00", "hash": "98c82c1f30d3de3e", "title_fa": "چقدر پول بیشتری برای تهیه خانه در هر ایالت ایالات متحده نیاز دارید", "summary_fa": "دستمزدها تقریباً در هر ایالت افزایش یافت، اما هنوز به اندازه ای نیست که بتواند خانه معمولی را بپردازد. Grace Cary/Getty Images درآمد تقریباً در هر ایالت افزایش یافته است، اما خرید خانه آسان‌تر نشده است. درآمد متوسط ​​ملی هنوز 31136 دلار کمتر از هزینه خانه با قیمت متوسط ​​است. داده های Realtor.com نشان می دهد که درآمد اضافی مورد نیاز برای خرید خانه از 2287 تا 98469 دلار متغیر است. تقریباً همه ایالت‌های ایالات متحده در سال گذشته با افزایش درآمد خانوار مواجه شدند، با این حال هنوز برای خرید خانه‌های معمولی کافی نیست. ایالت هایی مانند رود آیلند و ویرجینیا شاهد افزایش نسبتاً زیادی در درآمد از سال 2024 تا 2025 بوده اند - به ترتیب 9.02٪ و 7.85٪ - اما طبق داده های سرشماری ایالات متحده و Realtor.com، پنج رقم اضافی برای استطاعت یک خانه با قیمت متوسط ​​در هر ایالت مورد نیاز است. هانا جونز، اقتصاددان ارشد Realtor.com گفت که اگرچه خانوارها پول بیشتری به دست می آورند، افزایش نرخ وام مسکن از سال گذشته کمکی نمی کند. جونز گفت: «نرخ وام مسکن بیش از یک درصد بیشتر از یک سال گذشته است، که بودجه خریداران را کاهش می‌دهد و سود حاصل از کاهش قیمت مسکن و افزایش درآمد را جبران می‌کند». در سطح ملی، متوسط ​​درآمد خانوار برای خرید خانه با قیمت متوسط ​​در هیچ ایالتی کافی نیست.» متوسط ​​درآمد ملی خانوار در سال 2025 84780 دلار بود که تقریباً 3.8 درصد نسبت به سال قبل افزایش داشت. با این حال، با در نظر گرفتن نرخ وام مسکن 7.32٪ و 10٪ پیش پرداخت، با فرض اینکه نرخ وام مسکن 7.32٪ و پیش پرداخت 10٪ در سپتامبر 2026 باشد، با متوسط ​​قیمت فهرست 419,250 دلار در سپتامبر 2026، این مبلغ 31,136 دلار کمتر از درآمد توصیه شده برای خرید است. Realtor مقدار اضافی مورد نیاز بالاتر", "image_url": "https://i.insider.com/6aedef8880d4b24f18346e47?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۱۷:۵۳"}, {"source": "Business Insider", "title": "Warren Buffett isn't running Berkshire anymore. You wouldn't know it.", "link": "https://www.businessinsider.com/warren-buffett-berkshire-hathaway-earnings-stocks-portfolio-cash-buybacks-abel-2026-11", "summary": "Warren Buffett is the former CEO and chairman of Berkshire Hathaway. Daniel Zuchnik/WireImage Warren Buffett is no longer at the helm of Berkshire Hathaway, but you might not know it. Berkshire bought and sold few stocks last quarter, echoing Buffett's final years in charge. New CEO Greg Abel did ramp up stock buybacks to $9.6 billion worth, the highest figure in years. Warren Buffett is no longer running Berkshire Hathaway, but you almost wouldn't know it. The famed investor's conglomerate reported third-quarter earnings on Saturday, showing minimal stock buying and selling. That was typical during the final years of Buffett's six decades in charge, as the bargain hunter struggled to find deals on stocks and businesses during a historic stock-market boom. He stepped down as Berkshire's CEO at the end of 2025, and as chairman this September. Under new CEO Greg Abel , Berkshire was a net seller of stocks last quarter, buying $2.4 billion and selling $2.8 billion. That's a striking slowdown from the second quarter, when it bought a net $20 billion of stocks. Berkshire's cash pile shrank by around $8 billion, to $357 billion, after subtracting $20.5 billion in Treasury payables. It has still more than doubled in size since the end of 2023, reflecting Buffett's prolonged struggle to find value . One of Abel's key changes, in consultation with Buffett, has been to accelerate buybacks. He repurchased $9.6 billion of Berkshire stock last quarter, marking the busiest period for buybacks in years. That looks to have been a good call, as Berkshire stock has surged from below $500 at the end of September to a record high above $570 this week. Berkshire reported $12.7 billion of operating income, a 6% drop from the same quarter last year. That was fueled by a sharp decline in insurance underwriting income and lower insurance investment income, which offset higher profits from BNSF Railway , Berkshire Hathaway Energy, and the manufacturing, service, and retailing businesses. The conglomerate owns scores of businesses, including Geico, See's Candies, and Duracell, and also holds multibillion-dollar stakes in public companies such as Apple, Coca-Cola, and American Express. Berkshire shareholders will have to wait until next week, when it files its third-quarter portfolio disclosure, to learn what stocks it bought and sold last quarter. Abel has hewed closely to Buffett's approach during his first year as CEO, appearing to follow some classic advice for successors: \"If it", "date_str": "2026-11-07T14:18:18+00:00", "hash": "6067b923c78fa8d3", "title_fa": "وارن بافت دیگر برکشایر را اداره نمی کند. شما آن را نمی دانید.", "summary_fa": "وارن بافت، مدیرعامل و رئیس سابق برکشایر هاتاوی است. دانیل زوشنیک/WireImage وارن بافت دیگر در راس برکشایر هاتاوی نیست، اما ممکن است آن را ندانید. برکشایر در سه ماهه گذشته سهام کمی خرید و فروخت که بازتاب آخرین سال‌های مدیریت بافت است. گرگ آبل، مدیرعامل جدید، بازخرید سهام را به 9.6 میلیارد دلار افزایش داد که بالاترین رقم در سال‌های اخیر است. وارن بافت دیگر برکشایر هاتاوی را اداره نمی کند، اما تقریباً نمی دانید. شرکت سهامی سرمایه گذار مشهور روز شنبه درآمد سه ماهه سوم را گزارش کرد که حداقل خرید و فروش سهام را نشان می دهد. این امر در سالهای پایانی شش دهه ریاست بافت معمولی بود، زیرا شکارچی معامله برای یافتن معاملات سهام و مشاغل در طول رونق تاریخی بازار سهام تلاش می کرد. او در پایان سال 2025 از سمت مدیرعاملی برکشایر کناره‌گیری کرد و در سپتامبر امسال به‌عنوان رئیس هیئت مدیره این شرکت کنار رفت. برکشایر تحت مدیریت جدید، گرگ آبل، یک فروشنده خالص سهام در سه ماهه گذشته بود و 2.4 میلیارد دلار خرید و 2.8 میلیارد دلار فروخت. این کاهش قابل توجهی نسبت به سه ماهه دوم است، زمانی که 20 میلیارد دلار خالص سهام خرید. انباشت نقدی برکشایر پس از کسر 20.5 میلیارد دلار از بدهی های خزانه داری، حدود 8 میلیارد دلار کاهش یافت و به 357 میلیارد دلار رسید. اندازه آن از پایان سال 2023 تاکنون بیش از دو برابر شده است که نشان دهنده تلاش طولانی بافت برای یافتن ارزش است. یکی از تغییرات کلیدی آبل، با مشورت بافت، تسریع بازخرید بوده است. او 9.6 میلیارد دلار از سهام برکشایر را در سه ماهه گذشته بازخرید کرد که شلوغ ترین دوره بازخرید در سال های اخیر است. به نظر می رسد که این درخواست خوبی بوده است، زیرا سهام برکشایر از زیر 500 دلار در پایان سپتامبر به", "image_url": "https://i.insider.com/6aef2e7d8f37e8e0b5bab048?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["Apple", "بورس و طلا"], "datetime_fa": "۱۶ آبان • ۱۷:۴۸"}, {"source": "Business Insider", "title": "I made Dolly Parton's sweet potato casserole for Friendsgiving. It disappeared within minutes.", "link": "https://www.businessinsider.com/dolly-parton-sweet-potato-casserole-recipe-2026-11", "summary": "Dolly Parton s sweet potato casserole was a hit at my Friendsgiving. Sebastian Smith Dolly Parton and her sister released a cookbook called \"Good Lookin' Cookin'\" in September 2024. It has an entire section with Thanksgiving recipes, including sweet potato casserole. I made the dish for Friendsgiving, and it was a huge hit. Dolly Parton always loved whipping up feasts of Southern comfort food for her loved ones, including her goddaughter, Miley Cyrus . The late country icon loved it so much that she even wrote a cookbook with her sister, Rachel Parton George, which came out in 2024. My favorite section of \" Good Lookin' Cookin': A Year of Meals \" is dedicated entirely to Thanksgiving dishes . And the best recipe of the bunch is Parton's sweet potato casserole. Here's how to make it. Dolly Parton s sweet potato casserole has a nutty twist. Anneta Konstantinides/Business Insider To make the sweet potato casserole at home, you'll need: 5 large sweet potatoes, peeled and quartered 2 cups of miniature marshmallows ½ cup of chopped raw pecans ½ cup of light brown sugar, packed ½ cup (1 stick) of butter at room temperature, plus more for greasing 1 teaspoon of vanilla extract 1 teaspoon of salt 1 teaspoon of ground cinnamon First, I preheated the oven and prepped my potatoes and baking pan. Anneta Konstantinides/Business Insider I set the oven to 350 degrees Fahrenheit and buttered a 9-inch-by-13-inch pan. I also washed, peeled, and quartered my sweet potatoes. I placed my sweet potatoes in a large pot and covered them with cold water. Anneta Konstantinides/Business Insider I brought the pot to a boil over high heat, then lowered the heat to maintain a low boil for 20 minutes while the potatoes cooked. You'll know they're ready when the potatoes are fork-tender. I drained the potatoes, placed them in a large bowl, and added the butter and seasonings. Anneta Konstantinides/Business Insider I threw in the brown sugar, vanilla, salt, cinnamon, and butter, adding the latter in knobs so it'd be easy to mix. Then it was time to mash. Anneta Konstantinides/Business Insider The recipe recommends using a potato masher to mix the ingredients until they're \"well combined.\" I don't own one, so I simply used a big wooden serving fork — it worked like a charm! I transferred my mashed sweet potatoes to the baking pan, smoothing the top. Anneta Konstantinides/Business Insider I sprinkled the pecans on top, then evenly covered the casserole with my miniature marshmallows. I cover", "date_str": "2026-11-07T14:18:02+00:00", "hash": "0a0e13273c6a8891", "title_fa": "من کاسه سیب زمینی شیرین دالی پارتون را برای Friendsgiving درست کردم. در عرض چند دقیقه ناپدید شد.", "summary_fa": "دیگ سیب زمینی شیرین دالی پارتون در Friendsgiving من مورد استقبال قرار گرفت. سباستین اسمیت دالی پارتون و خواهرش در سپتامبر 2024 کتاب آشپزی به نام \"Good Lookin' Cookin'\" منتشر کردند. این کتاب دارای یک بخش کامل با دستور العمل های شکرگزاری، از جمله کاسه سیب زمینی شیرین است. من این غذا را برای Friendsgiving درست کردم، و موفقیت بزرگی بود. دالی پارتون همیشه دوست داشت برای عزیزانش، از جمله دخترخوانده‌اش، مایلی سایرس، مهمانی‌هایی با غذاهای راحتی جنوبی ترتیب دهد. نماد کشور فقید آنقدر آن را دوست داشت که حتی با خواهرش راشل پارتون جورج یک کتاب آشپزی نوشت که در سال 2024 منتشر شد. و بهترین دستور این دسته، کاسرول سیب زمینی شیرین پارتون است. در اینجا نحوه ساخت آن آمده است. کاسه سیب زمینی شیرین دالی پارتون دارای پیچ و تاب است. Anneta Konstantinides/Business Insider برای تهیه کاسرول سیب زمینی شیرین در خانه، به: 5 عدد سیب زمینی شیرین بزرگ، پوست کنده و ربع شده 2 فنجان مارشمالو مینیاتوری ½ فنجان گردوی خام خرد شده ½ فنجان شکر قهوه ای روشن، بسته بندی شده ½ فنجان بیشتر (1 قاشق چای خوری به اندازه 1 قاشق چای خوری) عصاره وانیل 1 قاشق چایخوری نمک 1 قاشق چایخوری دارچین آسیاب شده ابتدا فر را از قبل گرم کردم و سیب زمینی ها و ماهیتابه را آماده کردم. Anneta Konstantinides/Business Insider فر را روی 350 درجه فارنهایت تنظیم کردم و یک تابه 9 اینچ در 13 اینچ را کره زدم. من هم سیب زمینی های شیرینم را شستم، پوست گرفتم و چهار قسمت کردم. سیب زمینی های شیرینم را در یک قابلمه بزرگ گذاشتم و روی آنها را با آب سرد پوشاندم. Anneta Konstantinides/Business Insider من قابلمه را روی حرارت زیاد به جوش آوردم، سپس حرارت را کم کردم تا زمانی که سیب زمینی ها پخته می شدند، به مدت 20", "image_url": "https://i.insider.com/6aee05888f37e8e0b5baabc9?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۶ آبان • ۱۷:۴۸"}, {"source": "Business Insider", "titl shes and support over the last few days, it means the world. I had a medical problem whilst in Leipzig which required urgent attention at the hospital,” the singer wrote . “I was hoping that I would get the all clear to hang on until the end of the tour, but there are very serious risks involved in me doing so,” he continued. “As a result, and on the advice of my medical team and management we have made the decision to postpone the rest of the European/UK tour until further notice. I’m very sorry about any inconvenience this may cause, but it’s in the best interest all round.” Deep Purple has been on the road for its SPLAT! world tour since late summer, with the postponed U.K. and European dates originally set to run through late November. At press time, the band’s Latin American leg was still scheduled to launch Dec. 5 in São Paulo, Brazil, with a final stop in Mexico City on Dec. 19. Gillan has fronted Deep Purple during multiple stints since first joining the band in 1969. He is the voice behind some ", "date_str": "2026-11-07T20:43:32+00:00", "hash": "4f9e4e3a71de9557", "title_fa": "ایان گیلان، عضو دیپ پرپل، پس از انجام عمل جراحی، خبرهای دلگرم کننده ای را به اشتراک می گذارد", "summary_fa": "ایان گیلان، گروه دیپ پرپل، پس از یک اورژانس پزشکی که گروه راک افسانه ای را مجبور به تعویق تور اروپایی خود کرد، در حال بهبودی است. روز شنبه (7 نوامبر)، این خواننده 81 ساله به روز رسانی سلامتی خود را با طرفداران به اشتراک گذاشت و فاش کرد که یک عمل موفقیت آمیز انجام داده است و قبل از بهبودی کامل به زمان نیاز دارد تا استراحت کند. ایان گیلان، بازیگر مرتبط Deep Purple، به‌روزرسانی‌هایی در مورد اورژانس پزشکی ارائه می‌دهد که تور یورو را به تعویق انداخت: من امیدوار بودم که یان گیلان از Deep Purple به دنبال اورژانس پزشکی در بیمارستان بستری شود، دو نمایش به تعویق افتاد. دیروز که موفقیت آمیز بود، گیلان در فیس بوک نوشت. من اکنون باید استراحت کنم تا بهبودی کامل پیدا کنم و مطمئن شوم که قبل از بازگشت به سر کار، تا آنجا که می‌توانم تناسب اندام دارم، از همه برای صبر و درک شما متشکرم. من واقعاً ], "datetime_fa": "۱۶ آبان • ۲۳:۵۷"}, {"source": "Billboard", "title": "Richard Lloyd, Television Guitarist, Dies at 75", "link": "https://www.billboard.com/music/music-news/richard-lloyd-death-television-guitarist-dies-obituary-1236376953/", "summary": "Richard Lloyd, a founding member and guitarist of influential New York rock band Television , has died. He was 75. Lloyd died Saturday morning (Nov. 7) at his home in Chattanooga, Tennessee, according to to Rolling Stone . Related Gone But Not Forgotten: Musicians We Lost in 2026 Television Frontman Tom Verlaine Mourned by Patti Smith, Michael Stipe, Flea More: I ve Lost a Hero Television s Richard Lloyd, Staple of Downtown New York City Music Scene, Is Moving to Tennessee “His loving wife Sheila and his dog Willie Mays were with him at the end,” his family told the publication. His cause of death was cholangiocarcinoma, a cancer of the bile ducts. Lloyd was diagnosed with the disease in March 2026, and a GoFundMe campaign was later launched to help cover his medical expenses and other bills. Born in Pittsburgh in 1951, Lloyd moved with his family to New York City at age 6 and grew up in Greenwich Village. He initially studied drums before turning to guitar. After spending time in Boston and Los Angeles, he returned to New York in 1973. That year, he joined forces with Tom Verlaine, Richard Hell and drummer Billy Ficca to form Television. The band became a regular at CBGB, the Lower Manhattan club that helped launch the careers of fellow New York acts including the Ramones, the New York Dolls, Talking Heads, and Blondie. Television released its debut album, Marquee Moon , in 1977. The album earned widespread critical acclaim for its intricate arrangements and the distinctive interplay between Lloyd s and Verlaine s guitars. Although it achieved limited commercial success, the album went on to become one of the most influential releases of its era. The group followed it with Adventure in 1978 before breaking up later that year. Lloyd launched his solo career with the 1979 release of Alchemy , but struggles with substance abuse derailed his career in the years that followed. After getting sober, he returned with his second solo album, Field of Fire , in 1985. He continued releasing music over the following decades, with his final solo studio album, The Countdown , arriving in 2018. He also worked as a session guitarist, contributing to recordings by artists including Matthew Sweet and John Doe of X, while continuing to tour and teach guitar. In 2017, he published his memoir, Everything Is Combustible: Television, CBGB s and Five Decades of Rock and Roll . Television reunited to record its self-titled third album, released in 1992, and continued performing pe", "date_str": "2026-11-07T19:09:13+00:00", "hash": "78c60b0c30fc19d5", "title_fa": "ریچارد لوید، نوازنده گیتار تلویزیون، در ۷۵ سالگی درگذشت", "summary_fa": "ریچارد لوید، یکی از اعضای موسس و نوازنده گیتاریست گروه راک تلویزیونی نیویورکی درگذشت. به گزارش رولینگ استون، لوید 75 ساله بود. لوید صبح روز شنبه (7 نوامبر) در خانه اش در چاتانوگا، تنسی درگذشت. مطالب مرتبط رفته اما فراموش نشده است: نوازندگانی که در سال 2026 از دست دادیم، تام ورلین، فرستنده تلویزیونی، سوگوار پتی اسمیت، مایکل استیپ، کک بیشتر: من یک قهرمان تلویزیونی را از دست دادم، ریچارد لوید، قطعه اصلی صحنه موسیقی مرکز شهر نیویورک، در حال نقل مکان به تنسی است. نشریه علت مرگ او کلانژیوکارسینوم، سرطان مجاری صفراوی بود. لوید در مارس 2026 به این بیماری مبتلا شد و بعداً یک کمپین GoFundMe برای کمک به پوشش هزینه های پزشکی و سایر قبوض او راه اندازی شد. لوید در سال 1951 در پیتسبورگ به دنیا آمد و در سن 6 سالگی به همراه خانواده خود به شهر نیویورک نقل مکان کرد و در روستای گرینویچ بزرگ شد. او ابتدا قبل از اینکه به گیتار روی آورد، درام را مطالعه کرد. پس از گذراندن مدتی در بوستون و لس آنجلس، او در سال 1973 به نیویورک بازگشت. در آن سال، او به نیروهای تام ورلین، ریچارد هل و درامر بیلی فیکا پیوست تا تلویزیون را تشکیل دهند. گروه به طور منظم در CBGB، کلوپ Lower Manhattan که به راه اندازی حرفه
