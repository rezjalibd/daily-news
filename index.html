ی نجات شما از شب‌های بی‌خوابی آینده، ساعت‌ها صرف بررسی صفحات تخفیف‌های بزرگ‌ترین تخفیف‌ها برای بهترین تشک‌های برندهای معتبر کردم. قوی‌ترین معاملات تشک‌هایی که من پیدا کردم در آمازون هستند، از جمله تشک Casper Element (Queen) به قیمت 426 دلار (معمولاً 645 دلار)، یک معامله نادر زیر 500 دلار از این برند، و تشک بنفش به قیمت 1279 دلار، که قیمت روز اول ژوئن را 320 دلار شکست می‌دهد. بهترین تخفیف تشک های پرایم روز کاسپر: تا 34 درصد در ویترین فروشگاه آمازون کاسپر صرفه جویی کنید Tuft Needle: تا 35 درصد تخفیف تشک های اصلی هیبریدی سرتا 5 ستاره: تا 35 درصد تخفیف در آمازون بنفش: تا 30 درصد تخفیف را مشاهده کنید همه معاملات تشک پرایم دی را در فروشگاه پرایم دی در فروشگاه آمازون مشاهده کنید. بهترین معاملات تشک پرایم دی تشک Leesa Sapira Hybrid تخفیف معمولی اکتبر: 25% تخفیف | ژوئن 2026 قیمت روز نخست: 30 درصد تخفیف چرا ما این معامله را دوست داریم: Leesa در حال"}, {"source": "Business Insider", "title": "Best Prime Day TV deals on our expert's favorite Samsung, TCL, Roku, Sony, LG, and Hisense displays", "link": "https://www.businessinsider.com/guides/deals/prime-day-tv-deals-2026-10", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more We re tracking the best Prime Day TV deals, including big savings on some of our reviewer s top-rated sets, like the TCL QM8L. Steven Cohen/Business Insider Prime Day deals are now live across every product category, including TVs from all the major players. But just because a TV is on sale doesn't mean it's automatically worth buying. I've spent the last decade reviewing TVs, and I stay up to date on pricing throughout the year, so I know which discounts are truly worth your time. The best Prime Day TV deals feature record-low prices on some of the best TVs my team and I have tested. For instance, the Samsung 65-inch Frame TV is available for just $898 with a free bezel . That's the lowest it's ever been. Though a 2025 model, it remains the best art-style TV for most people, thanks to its canvas-like display, slim wall mount, and separate box for inputs. But if you prioritize a massive screen, I suggest checking out the 98-inch TCL QM8L, which is down to an all-time low of $2,998 . This 2026 model uses TCL's new SQD tech to deliver an exceptionally wide range of colors. Top Prime Day TV deals will likely come and go throughout Amazon's two-day sale as stock fluctuates. I'll be keeping this roundup updated over the next 48 hours to highlight the best of the best. And for more savings beyond TVs, be sure to browse all of our Prime Day coverage across tech, home, kitchen, and style. Top 5 TV deals Samsung 65-inch Frame 4K TV w/ free bezel - $1,698 $898 at Amazon TCL 98-inch QM8L SQD 4K TV - $6,000 $2,998 at Amazon Roku 65-inch Pro Series OLED 4K TV - $1,200 $800 at Amazon Roku 55-inch Plus Series QLED 4K TV - $500 $350 at Amazon LG 77-inch C6H OLED 4K TV - $3,700 $2,300 at Amazon The best Prime Day Samsung TV deals Some of the best Samsung TVs are on sale for Prime Big Deal Days. This deal on the 65-inch Frame TV is especially exciting. Not only is it at an all-time low price, but you can also select a free bezel on Amazon's listing page. But if image quality is your main concern, Samsung's S90H OLED is also getting its biggest discount ever . Though a bit pricier than the older S90F, this 2026 model has a new anti-glare screen that does a much better job of fighting reflections. And like all OLEDs, it offers impressive pixel-level contrast and wide viewing angles. You can learn more in our Samsung S90H review . Samsung 42-inch S90H OLED 4K TV - $1,397 $998 at Amazo", "date_str": "2026-10-06T12:33:24+00:00", "hash": "d3142f9da12edc8f", "title_fa": "بهترین تخفیف‌های تلویزیون پرایم دی برای نمایشگرهای مورد علاقه متخصص ما سامسونگ، TCL، Roku، سونی، ال‌جی، و هایسنس", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید ما بهترین معاملات تلویزیون پرایم دی را دنبال می‌کنیم، از جمله صرفه‌جویی‌های کلان در برخی از مجموعه‌های دارای رتبه برتر بازبین ما، مانند TCL QM8L. تخفیف‌های استیون کوهن/Business Insider Prime Day اکنون در همه دسته‌بندی محصولات، از جمله تلویزیون‌های همه بازیگران اصلی، فعال است. اما فقط به این دلیل که یک تلویزیون در حال فروش است به این معنی نیست که به طور خودکار ارزش خرید دارد. من دهه گذشته را صرف بررسی تلویزیون‌ها کرده‌ام، و در طول سال در مورد قیمت‌ها به‌روز می‌مانم، بنابراین می‌دانم کدام تخفیف واقعا ارزش وقت شما را دارد. بهترین معاملات تلویزیون پرایم دی دارای قیمت‌های کم سابقه در برخی از بهترین تلویزیون‌هایی است که من و تیمم آزمایش کرده‌ایم. به عنوان مثال، تلویزیون قاب 65 اینچی سامسونگ تنها با قیمت 898 دلار با قاب رایگان در دسترس است. این کمترین چیزی است که تا به حال بوده است. اگرچه یک مدل 2025 است، اما به دلیل نمایشگر بوم مانند، پایه دیواری باریک و جعبه مجزا برای ورودی، بهترین تلویزیون سبک هنری برای اکثر افراد باقی می ماند. اما اگر صفحه‌نمایش بزرگ را در اولویت قرار می‌دهید، پیشنهاد می‌کنم TCL QM8L 98 اینچی را بررسی کنید که به کمترین قیمت 2998 دلاری رسیده است. این مدل 2026 از فناوری جدید SQD TCL برای ارائه طیف گسترده ای از رنگ ها استفاده می کند. معاملات برتر Prime Day TV احتمالاً در طول فروش دو روزه آمازون با نوسانات سهام عرضه می شود و از بین می رود. من این جمع بندی را در 48 ساعت آینده به روز خواهم کرد تا بهترین ها را برجسته کنم. و برای صرفه جویی بیشتر فراتر از تلویزیون ها، مطمئن شوید که همه پوشش های Prime Day ما را در زمینه"}, {"source": "Business Insider", "title": "My husband used ChatGPT to become a better husband. I hate to admit it, but it helped.", "link": "https://www.businessinsider.com/chatgpt-marriage-relationship-advice-husband-wife-2026-10", "summary": "The author s husband turned to ChatGPT for advice. Courtesy of the author I initially disliked that my husband had turned to AI after one of our arguments. The response connected his triggers with patterns I'd seen in our relationship. It also made me consider my own role in some of our conflicts. My husband is always trying to grow — as a husband, dad, entrepreneur, and overall good person. Our marriage is by no means perfect, but we're both always willing to hear each other out, work through challenges together, and troubleshoot solutions . But when he recently texted me following an argument with his \"thoughts and plan\" via a ChatGPT thread, I didn't know how to respond. His prompt was brief, but honest and straightforward — I'm sometimes short-tempered and end up saying something I shouldn't. I've recognized these six different scenarios as triggers... What are some tips and tricks I can use to not be so short? I've read tons of articles about the \" ChatGPT doctor \" and, through my PR work supporting both tech companies and behavioral health organizations, have discussed at length the concerns about using AI for things like medical advice or therapy. But that wasn't what triggered me — it was that he was being given an answer, cutting corners to avoid analyzing personal missteps or thinking about what comes next. Instead, he hit enter and received a 30-day \"tone reset plan.\" It just irked me. The transcript changed my mind Then I read through the conversation and, once I got past the boosted ego fluff giving him \"respect for even asking, as most men just justify it,\" I started to see things a bit differently. The author s husband asked ChatGPT for relationship advice. Courtesy of the author First was the psychological breakdown of why he reacts the way he does. Because my husband uses AI for all facets of his life — from personal branding to strategy help for his business to tracking calories— it knows him quite well on a personal level. It first responded by touching on the fact that because he has overcome heart surgeries , fights as a young adult, and chaos, his nervous system is \"wired for intensity,\" so his body flips into threat mode, and when that happens, he goes from \"thoughtful husband/father to protector/defender in 0.2 seconds.\" The feeling I had while reading that back was reminiscent of those triumphant 'aha' lightbulb moments I often get when our therapist goes deep and pulls something from the depths of our history, making a connection ", "date_str": "2026-10-06T12:05:01+00:00", "hash": "f3128a928121215d", "title_fa": "شوهرم از ChatGPT استفاده کرد تا شوهر بهتری شود. من از اعتراف متنفرم، اما کمک کرد.", "summary_fa": "شوهر نویسنده برای مشاوره به ChatGPT مراجعه کرد. با حسن نیت نویسنده من در ابتدا دوست نداشتم که شوهرم پس از یکی از مشاجرات ما به هوش مصنوعی روی آورد. پاسخ، محرک های او را با الگوهایی که در رابطه مان دیده بودم، مرتبط کرد. همچنین باعث شد نقش خودم را در برخی از درگیری‌هایمان در نظر بگیرم. شوهر من همیشه در تلاش برای رشد است - به عنوان یک شوهر، پدر، کارآفرین و در کل یک فرد خوب. ازدواج ما به هیچ وجه کامل نیست، اما هر دوی ما همیشه می‌خواهیم حرف همدیگر را بشنویم، چالش‌ها را با هم کار کنیم، و راه‌حل‌هایی را حل کنیم. اما وقتی اخیراً به دنبال بحثی با \"افکار و برنامه\" خود از طریق یک موضوع ChatGPT به من پیام داد، نمی دانستم چگونه پاسخ دهم. تذکر او کوتاه، اما صادقانه و صریح بود - من گاهی اوقات دمدمی مزاج می شوم و در نهایت چیزی را می گویم که نباید. من این شش سناریو مختلف را به عنوان محرک تشخیص داده ام... چند نکته و ترفند وجود دارد که می توانم از آن استفاده کنم تا آنقدر کوتاه نباشم؟ من تعداد زیادی مقاله در مورد «پزشک ChatGPT» خوانده‌ام و از طریق کار روابط عمومی خود که از شرکت‌های فناوری و سازمان‌های بهداشت رفتاری حمایت می‌کنم، نگرانی‌های مربوط به استفاده از هوش مصنوعی را برای مواردی مانند توصیه‌های پزشکی یا درمان به طور طولانی مورد بحث قرار داده‌ام. اما این چیزی نبود که من را برانگیخت - بلکه این بود که به او پاسخ داده می شد، برای اجتناب از تجزیه و تحلیل اشتباهات شخصی یا فکر کردن به آنچه بعداً می آید، گوشه ها را کوتاه می کرد. در عوض، او اینتر را زد و یک \"طرح تنظیم مجدد آهنگ\" 30 روزه دریافت کرد. فقط من را عصبانی کرد متن نظرم را تغییر"}, {"source": "Business Insider", "title": "AI agents don't always understand how companies work. This startup raised $5.2 million to solve that.", "link": "https://www.businessinsider.com/zeroset-startup-funding-ai-agents-gradient-ventures-enterprise-2026-10", "summary": "Zeroset s founders started the company earlier this year. Zeroset Zeroset raised $5.2 million from a Google VC arm to enhance AI for company operations. Zeroset's product integrates with enterprise applications to provide better context to AI agents. Check out the pitch deck the company used to secure the funding. AI agents are getting better at completing tasks. But one startup says the digital assistants don't actually understand how the companies they're working for operate. Now, Zeroset has come out of stealth and raised $5.2 million to build models that give AI agents a constantly updated picture of a company's operations. Zeroset's cofounder and CEO, Akshat Kannan, said today's AI models have little knowledge of the inner workings of an individual business because that information can be scattered across customer relationship management systems, ticketing, and internal docs. Nor are AI models typically trained on a company's proprietary data. \"Models off the shelf have no understanding of the dynamics of how an enterprise actually works,\" Kannan told Business Insider. \"They have no understanding of how the work gets done.\" Zeroset's first product, Nebula, connects to software a company already uses, including Microsoft 365, SharePoint, Outlook, Teams, GitHub, and workplace messaging tools. It then tracks how information and activity across those systems change over time. The idea is to give AI agents more than a pile of company documents to search through. Instead, it wants them to understand the sequence of events and decisions that make up a workflow so that it knows how similar cases were handled previously. It can then do that work autonomously. Zeroset was founded in January by Kannan, 18, who dropped out of Stanford this year, and William Zhang, 21, who dropped out of the University of Texas last year to work on the startup . The company is still in a closed research preview and will progressively expand access to customers rather than do a single broad launch. The company plans to combine a license component with usage-based pricing that scales with the amount of data and agent activity running through Nebula. Zeroset said its initial focus is on enterprises and AI-native companies that deploy long-running agents in industries like manufacturing, supply-chain operations, and financial research. It indirectly competes with companies like Mem0 and Zep, which are building memory infrastructure for AI agents. Its $5.2 million pre-seed round was co", "date_str": "2026-10-06T12:01:01+00:00", "hash": "ad7e80acfb9c1622", "title_fa": "عوامل هوش مصنوعی همیشه نمی دانند که شرکت ها چگونه کار می کنند. این استارتاپ برای حل این مشکل 5.2 میلیون دلار جمع آوری کرد.", "summary_fa": "بنیانگذاران Zeroset این شرکت را در اوایل سال جاری راه اندازی کردند. Zeroset Zeroset 5.2 میلیون دلار از یک بازوی Google VC برای تقویت هوش مصنوعی برای عملیات شرکت جمع آوری کرد. محصول Zeroset با برنامه های سازمانی ادغام می شود تا زمینه بهتری را برای عوامل هوش مصنوعی فراهم کند. عرشه زمینی را که شرکت برای تأمین بودجه استفاده کرده است، بررسی کنید. عوامل هوش مصنوعی در تکمیل وظایف بهتر می شوند. اما یک استارت‌آپ می‌گوید دستیارهای دیجیتال در واقع نمی‌دانند شرکت‌هایی که برای آن کار می‌کنند چگونه کار می‌کنند. اکنون Zeroset از مخفی کاری خارج شده و 5.2 میلیون دلار برای ساخت مدل هایی جمع آوری کرده است که به عوامل هوش مصنوعی تصویری دائماً به روز شده از عملیات یک شرکت ارائه می دهد. آکشات کانان، موسس و مدیرعامل Zeroset، گفت که مدل‌های هوش مصنوعی امروزی دانش کمی از عملکرد درونی یک کسب‌وکار دارند، زیرا این اطلاعات می‌توانند در سیستم‌های مدیریت ارتباط با مشتری، خرید بلیط و اسناد داخلی پراکنده شوند. همچنین مدل های هوش مصنوعی معمولاً بر اساس داده های اختصاصی یک شرکت آموزش نمی بینند. کانان به Business Insider گفت: «مدل‌های موجود در قفسه هیچ درکی از پویایی نحوه عملکرد یک شرکت ندارند. آنها درکی از نحوه انجام کار ندارند.\" اولین محصول Zeroset، Nebula، به نرم‌افزارهایی که یک شرکت قبلاً از آن استفاده می‌کرد، از جمله Microsoft 365، SharePoint، Outlook، Teams، GitHub و ابزارهای پیام‌رسانی محل کار متصل می‌شود. سپس نحوه تغییر اطلاعات و فعالیت در آن سیستم ها را در طول زمان ردیابی می کند. ایده این است که عوامل هوش مصنوعی بیش از انبوهی از اسناد شرکت را برای جستجو در اختیار آنها قرار دهیم. درعوض، از آنها می‌خواهد توالی رویدادها و تصمیم‌هایی را که یک گردش کار را تشکیل می‌دهند، درک کنند تا بداند موارد مشابه قبلاً چگونه رسیدگی شده است. سپس"}, {"source": "Business Insider", "title": "Ray Dalio predicts a debt crisis within 3 years as we're 'approaching our limits'", "link": "https://www.businessinsider.com/ray-dalio-debt-crisis-government-spending-borrowing-ai-wealth-interest-2026-10", "summary": "Ray Dalio is bracing for a debt crisis. Jemal Countess/Getty Images for TIME Ray Dalio expects the US to face a debt crisis \"within the next three years.\" The hedge-fund billionaire said the cost of servicing the national debt is squeezing other spending. Dalio flagged the AI boom's growing reliance on debt and the danger of overinvestment. Ray Dalio says the US is careening toward a debt crisis before the end of this decade. The billionaire investor said in a Bloomberg Television interview on Tuesday that he anticipates a debt crisis \"within the next three years,\" or by the fall of 2029. The author of \"How Countries Go Broke\" and founder of hedge-fund behemoth Bridgewater Associates said the scale of the national debt and the rate at which it's growing mean we're \"approaching our limits.\" US debt breached the $40 trillion mark in August, representing an inflation-adjusted increase of more than $10 trillion, or over 33%, since 2019. Dalio said that this trajectory is unsustainable because of the soaring cost of servicing the debt. Those interest payments exceed $1 trillion a year or almost one-fifth of the federal budget, leaving less money for Social Security, healthcare, defense, education, and other priorities. \"When debts accumulate faster than they're paid back, then debt service costs grow,\" he said. \"That becomes a higher and higher percentage of one's cash flow. And when that happens, it starts to squeeze out spending . And so then you have a problem.\" Dalio also underscored that geopolitical tensions have tempered other countries' demand for US debt. Moreover, the AI boom has become \" heavily debt-financed ,\" which threatens to tighten credit in riskier categories such as auto loans, he said. The Wall Street veteran warned that trend could feed tensions over the wealth gap, as \"the people who have less get squeezed the most in that part of the cycle.\" Dalio said he's seeing even AI hyperscalers \"begin to encounter issues \" with accessing credit, and he's \"starting to see those limits being hit.\" He suggested that AI companies are overinvesting to ensure they're competitive in an uncertain future market, potentially inflating a tech bubble. He added that bubbles burst when people need cash, for example, if they need to repay loans or pay a wealth tax , and that's a phenomenon to \"keep an eye on.\" Dalio has been sounding the alarm on a debt crisis for years. He's described rising debt as an \"aggressive cancer,\" and said it \"accumulates like plaque\" ", "date_str": "2026-10-06T12:00:31+00:00", "hash": "4288247da866ade2", "title_fa": "ری دالیو بحران بدهی را ظرف 3 سال پیش‌بینی می‌کند، زیرا ما به محدودیت‌های خود نزدیک می‌شویم.", "summary_fa": "ری دالیو برای یک بحران بدهی آماده می شود. جمال کنتس/ گتی ایماژ برای تایم ری دالیو انتظار دارد که ایالات متحده «طی سه سال آینده» با بحران بدهی مواجه شود. میلیاردر صندوق تامینی گفت که هزینه خدمات بدهی ملی دیگر هزینه ها را تحت فشار قرار می دهد. دالیو اتکای فزاینده هوش مصنوعی به بدهی و خطر سرمایه گذاری بیش از حد را برجسته کرد. ری دالیو می گوید که ایالات متحده به سمت یک بحران بدهی پیش از پایان این دهه تلاش می کند. این سرمایه‌گذار میلیاردر در مصاحبه‌ای با تلویزیون بلومبرگ در روز سه‌شنبه گفت که او پیش‌بینی می‌کند که یک بحران بدهی «طی سه سال آینده» یا تا پاییز 2029 رخ دهد. نویسنده کتاب «کشورها چگونه شکست می‌خورند» و بنیان‌گذار غول سرمایه‌گذاری تامینی بریج واتر اسوشیتس گفت که مقیاس بدهی ملی و نرخ رشد آن به این معناست که ما به محدودیت‌های خود نزدیک می‌شویم. بدهی ایالات متحده در ماه اوت از مرز 40 تریلیون دلار عبور کرد که نشان دهنده افزایش تعدیل شده بر اساس تورم بیش از 10 تریلیون دلار یا بیش از 33 درصد از سال 2019 است. دالیو گفت که این مسیر به دلیل هزینه های سرسام آور خدمات بدهی ناپایدار است. این پرداخت‌های بهره بیش از یک تریلیون دلار در سال یا تقریباً یک پنجم بودجه فدرال است و پول کمتری برای تأمین اجتماعی، مراقبت‌های بهداشتی، دفاع، آموزش و سایر اولویت‌ها باقی می‌گذارد. او گفت: «وقتی بدهی‌ها سریع‌تر از بازپرداخت انباشته می‌شوند، هزینه‌های خدمات بدهی افزایش می‌یابد. \"این درصد بالاتر و بالاتری از جریان نقدی فرد می شود. و زمانی که این اتفاق می افتد، شروع به کاهش هزینه ها می کند. و بنابراین شما با مشکل مواجه خواهید شد.\" دالیو همچنین تاکید کرد که تنش های ژئوپلیتیکی تقاضای سایر کشورها برای بدهی ایالات متحده را کاهش داده است. علاوه بر"}, {"source": "Business Insider", "title": "This robotics startup raised $75 million to automate drug manufacturing. See the pitch deck.", "link": "https://www.businessinsider.com/see-the-pitch-deck-drug-manufacturing-startup-used-raise-75m-2026-10", "summary": "Multiply Labs CEO Fred Parietti Multiply Labs Multiply Labs raised $75 million to automate drug manufacturing. Its robots make complex drugs like gene therapies and mRNA treatments. Its pitch deck shows how it pitched investors, including Founders Fund and AstraZeneca. AI can help discover new medicines , but making them is another story. Multiply Labs, a robotics startup based in San Francisco, wants to solve that. The company, which builds robots for manufacturing complex drugs, announced on Tuesday that it raised $75 million in a Series B funding round, bringing its total funding to more than $100 million since its founding in 2016. The round was led by NantWorks, a holding company founded by billionaire Patrick Soon-Shiong . Other investors include AstraZeneca , a Multiply customer, Lux Capital , and Founders Fund . \"Someone has to make the drugs,\" Multiply CEO Fred Parietti told Business Insider. The company's office, which I visited this summer, is a large warehouse in the Dogpatch neighborhood of San Francisco. Its robot is a large, long box packed with test tubes and robotic arms. The round comes as investors pour money into \"physical AI\" — AI systems that act in the real world. Multiply has deployed its machines with a small group of customers. That means the company is still early, and its next test is whether it can turn a small number of expensive, highly specialized machines into a scalable manufacturing business. Today, each robot costs several million dollars to build and relies on a supply chain spread across Europe. Multiply automates the production of gene therapies and mRNA treatments, which are still largely made manually in laboratories. Production is slow, difficult to scale, and vulnerable to human error and contamination. Manufacturing some gene therapies can cost more than $1 million per dose, according to a 2025 research paper. \"The only way to hit throughput, cost, and quality is with robotics,\" said Parietti. \"It must cost not like a house, but like a car. So from millions [of dollars] to tens of thousands.\" Drugmakers such as AstraZeneca and Legend Biotech purchase Multiply's robots and operate them at their own facilities. Multiply also makes money from cartridges used in the machines and from service and support. Parietti wouldn't say exactly how many machines Multiply has deployed, but said it's a \"high single-digit number.\" See the pitch deck Multiply used to raise $75 million below. Multiply Labs Multiply Labs Multiply Lab", "date_str": "2026-10-06T12:00:01+00:00", "hash": "75c79ede4175d6e6", "title_fa": "این استارت آپ رباتیک ۷۵ میلیون دلار برای خودکارسازی تولید دارو جمع آوری کرد. عرشه زمین را ببینید.", "summary_fa": "مدیر عامل Multiply Labs، Fred Parietti Multiply Labs، Multiply Labs 75 میلیون دلار برای خودکارسازی تولید دارو جمع آوری کرد. ربات های آن داروهای پیچیده ای مانند ژن درمانی و درمان های mRNA می سازند. صفحه اصلی آن نشان می دهد که چگونه سرمایه گذاران، از جمله Founders Fund و AstraZeneca را جذب کرده است. هوش مصنوعی می تواند به کشف داروهای جدید کمک کند، اما ساخت آنها داستان دیگری است. Multiply Labs، یک استارت آپ رباتیک مستقر در سانفرانسیسکو، می خواهد این مشکل را حل کند. این شرکت که ربات‌هایی برای تولید داروهای پیچیده می‌سازد، روز سه‌شنبه اعلام کرد که ۷۵ میلیون دلار در دور سرمایه‌گذاری سری B جمع‌آوری کرده است و مجموع بودجه‌اش را از زمان تأسیس آن در سال ۲۰۱۶ به بیش از ۱۰۰ میلیون دلار رسانده است. این دور توسط NantWorks، یک شرکت هلدینگ که توسط میلیاردر پاتریک سون-شیونگ تأسیس شده بود، رهبری شد. سایر سرمایه گذاران عبارتند از AstraZeneca، مشتری Multiply، Lux Capital و Founders Fund. فرد پاریتی، مدیر عامل Multiply به Business Insider گفت: \"یکی باید داروها را بسازد.\" دفتر این شرکت که تابستان امسال از آن بازدید کردم، یک انبار بزرگ در محله داگ پچ سانفرانسیسکو است. ربات آن یک جعبه بزرگ و بلند است که با لوله های آزمایش و بازوهای رباتیک بسته بندی شده است. این دور زمانی انجام می شود که سرمایه گذاران پول را به \"هوش مصنوعی فیزیکی\" می ریزند - سیستم های هوش مصنوعی که در دنیای واقعی عمل می کنند. Multiply ماشین های خود را با گروه کوچکی از مشتریان مستقر کرده است. این بدان معناست که شرکت هنوز زود است و آزمایش بعدی آن این است که آیا می تواند تعداد کمی از ماشین های گران قیمت و بسیار تخصصی را به یک تجارت تولیدی مقیاس پذیر تبدیل کند یا خیر. امروزه ساخت هر ربات چندین"}, {"source": "Business Insider", "title": "Russia’s drones are getting faster and deadlier. The West is racing to catch up.", "link": "https://www.businessinsider.com/russian-drones-faster-deadlier-west-racing-catch-up-with-interceptors-2026-10", "summary": "Ukrainian and Western defense firms are making their interceptor drones faster. Ints Kalnins/REUTERS Russia is increasingly using deadly jet-powered drones to attack Ukrainian cities. US and European defense firms are rushing to develop new interceptor drones to counter the threat. Business Insider spoke with manufacturers about their push to build a new class of interceptors. The Russian weapon looks kind of like a cheap cruise missile. It has a thin fuselage, outstretched wings, and a mini turbojet engine that propels it across the sky. But Russia's Geran-5 isn't a missile. It's the newest and fastest weapon in a family of jet-powered drones that Moscow is using in rising numbers against Ukraine. The unrelenting attacks have intensified since the start of the summer, further straining Kyiv's already stretched air defenses. Ukrainian interceptor drones , initially designed to counter Russia's slower, propeller-powered drones, are being rapidly upgraded to combat newer, faster models and have already downed several Geran-5s. The race is no longer just to build interceptor weapons. It's to build ones with the speed to catch Russia's latest weapons . American and European defense companies are rushing to develop similar capabilities to counter new Russian threats. Business Insider spoke with Western and Ukrainian military officers, officials, and defense companies about the push to develop next-generation interceptors . \"The percentage of jet-powered threats is rising,\" said Lt. Col. Matt Keogh, who is tasked with procuring drone technology for the British Army. \"And there is a commensurate level of interest being presented on the interceptors to defeat them.\" A worsening threat The Geran-5 is Russia s newest and fastest jet-powered drone. Wild Hornets/Screengrab via X Interceptor drones emerged in 2025 as one of Ukraine's top defense priorities. They quickly proved highly effective against nightly bombardments by armed Geran-2 drones, piston-powered aircraft with a maximum speed of about 115 mph. Russia responded by developing faster variants equipped with small turbojet engines. The Geran-3 exceeds 200 mph, while the Geran-4 can reach 310 mph. The Geran-5, the newest variant, can fly at speeds up to 375 mph. Unlike its delta-wing predecessors, it more closely resembles a cruise missile. These drones, which are faster, deadlier, and harder to stop, are playing a growing role in Russian strike tactics. Ukraine's air force said Russia launched 2,800 jet-power", "date_str": "2026-10-06T11:07:01+00:00", "hash": "2e0f4d9d0b53b2e0", "title_fa": "پهپادهای روسیه سریعتر و مرگبارتر می شوند. غرب در حال مسابقه دادن برای رسیدن به عقب است.", "summary_fa": "شرکت های دفاعی اوکراینی و غربی در حال ساخت پهپادهای رهگیر خود با سرعت بیشتری هستند. Ints Kalnins/REUTERS روسیه به طور فزاینده ای از پهپادهای مرگبار با موتور جت برای حمله به شهرهای اوکراین استفاده می کند. شرکت‌های دفاعی ایالات متحده و اروپا برای مقابله با این تهدید، در حال توسعه پهپادهای رهگیر جدید هستند. Business Insider با سازندگان درباره تلاش آنها برای ساخت کلاس جدیدی از رهگیرها صحبت کرد. این سلاح روسی به نوعی شبیه یک موشک کروز ارزان به نظر می رسد. این هواپیما دارای یک بدنه نازک، بال های کشیده و یک موتور توربوجت کوچک است که آن را در سراسر آسمان به حرکت در می آورد. اما Geran-5 روسیه یک موشک نیست. این جدیدترین و سریعترین سلاح در خانواده پهپادهای جت است که مسکو در حال استفاده از آن علیه اوکراین است. حملات بی امان از آغاز تابستان تشدید شده است و دفاع هوایی کیف را بیشتر تحت فشار قرار داده است. پهپادهای رهگیر اوکراینی که در ابتدا برای مقابله با هواپیماهای بدون سرنشین کندتر و ملخ‌دار روسیه طراحی شده بودند، به سرعت برای مقابله با مدل‌های جدیدتر و سریع‌تر به‌روزرسانی می‌شوند و تاکنون چندین هواپیمای Geran-5 را سرنگون کرده‌اند. مسابقه دیگر فقط ساختن سلاح های رهگیر نیست. ساخت سلاح هایی با سرعت برای گرفتن جدیدترین سلاح های روسیه است. شرکت‌های دفاعی آمریکایی و اروپایی برای مقابله با تهدیدات جدید روسیه برای توسعه قابلیت‌های مشابه عجله دارند. Business Insider با افسران نظامی، مقامات و شرکت های دفاعی غربی و اوکراینی در مورد تلاش برای توسعه نسل بعدی رهگیرها صحبت کرد. سرهنگ دوم مت کیو، که وظیفه تهیه فناوری هواپیماهای بدون سرنشین برای ارتش بریتانیا را بر عهده دارد، گفت: «درصد تهدیدات با موتور جت در حال افزایش است. \"و سطح متناسبی از علاقه به رهگیرها برای شکست دادن آنها وجود دارد.\" یک تهدید بدتر Geran-5 جدیدترین"}, {"source": "Business Insider", "title": "Best Prime Day air fryer deals: Up to 40% off Breville, Cosori, Ninja", "link": "https://www.businessinsider.com/guides/deals/best-prime-day-air-fryer-deals-2026-10", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Many of the best air fryers we ve tested this year are on sale during Prime Day. Jennifer Zyman/Business Insider It may feel like summer just ended, but October Prime Day is here again. We're using this time to upgrade our kitchen essentials and start thinking about holiday gifting. It's the ideal time to upgrade kitchen essentials and jumpstart holiday gifting—and air fryers are near the top of our shopping list. Beyond crisping frozen fries, they roast vegetables, reheat leftovers to perfection, and handle family dinners with minimal cleanup. Some of the best air fryers we tested this year are heavily discounted today, including our best overall pick, the Cosori TurboBlaze, and Breville's Smart Oven Air Fryer Pro, which is 20% off. This splurge-worthy pick for anyone who wants one appliance that can air fry, toast, roast, bake, and more — it could essentially replace your oven. While there are quite literally hundreds of air fryers for sale, we kept this list tight by focusing on the top-performing models from our testing or similar models from the brands and breaking down which one is best for your cooking needs, kitchen setup, and lifestyle. The top Prime Day air fryer deals Our best overall pick: Cosori TurboBlaze - $119.99 $89.99 The best air fryer toaster oven: Breville Smart Oven Air Fryer Pro - was $399.95 , now $319.95 The viral glass air fryer: Ninja Crispi Pro - $299.99 $249.99 A family-sized double-basket design: Ninja Foodi DualZone - $229.99 $149.99 Under $100 air fryer toaster oven: Instant Instant Pot Omni 19QT/18L Toaster Oven Air Fryer - $200 $97 Shopping for more Amazon Prime discounts? Check out all of our coverage of esy of Lorraine Duffy Merkl Many of my cousins are starting to care for their aging parents and relatives. I'm walking them through the process, as I went through it with my mom. It's given me a new perspective and I'm finally giving myself credit for my time as a caregiver. Sometimes it feels like I'm working an eldercare hotline. My younger cousins are now where I was several years ago, caring for parents and relatives who can no longer care for themselves. Make no mistake, I love them, and I'm happy to walk them through it all. The mind-numbing healthcare calls that turn into a literal game of telephone. Setting up joint bank accounts because your loved one can no longer see or write well enough to deal with bills (and, of course, doesn't trust automatic bill pay, either). Dealing with lawyers about power of attorney. The hits just keep on coming, with ER visits and the challenge of navigating \"sundowning.\" But beyond giving them step-by-steps, I'm also cheerleading. I tell them in all sincerity how selfless they are; what a good son or daughter or niece or nephew they are. I remind them they are doing a hard thing and to take a breath, get fresh air, and take care of themselves, too. I often find myself using a tired yet true analogy: If you're on a plane and the oxygen masks drop, put yours on first, then assist your loved ones. You can't help others if you're struggling. I give them credit for taking on the responsibility of caring for an aging adult — credit I never gave myself. I've decided it's time. Helping my cousins has given me a new perspective on my own time as a caregiver My mother, Angelina, died at 100 years and four months in late winter of 2023. I began caregiving 10 years earlier, in 2013. Before that, she had her own large studio apartment across the street from me in Manhattan. In 2001, my mother had moved from the Bronx, where I grew up, to help me care for my two children, Luke, then age 5, and Meg, who was 2. They already had their granny as their nanny , but the commute had become a grind. Mom was a very independent person who did all her own cooking and cleaning and, as an NYC native born and raised in Italian Harlem, enjoyed her city. That began to shift when she turned 90. The author was her mother s caregiver for years. Courtesy of Lorraine Duffy Merkl My caregiving started with bringing over meals because using the stove became unsaf", "date_str": "2026-10-06T10:41:01+00:00", "hash": "543097f30c619d87", "title_fa": "کمک به پسرعموهایم از طریق مراقبت به من دیدگاه جدیدی می دهد. بالاخره به خودم اعتبار می دهم که از مادرم مراقبت می کنم.", "summary_fa": "نویسنده خانواده بزرگی دارد و اکنون با برخی از عموزاده هایش از طریق مراقبت صحبت می کند. با حسن نیت از لورین دافی مرکل بسیاری از پسرعموهای من شروع به مراقبت از والدین و بستگان سالخورده خود کرده اند. همانطور که با مادرم آن را طی کردم، آنها را در طول این فرآیند راهنمایی می کنم. این به من دیدگاه جدیدی داد و در نهایت به خودم اعتباری برای وقتم به عنوان یک مراقب می‌دهم. گاهی اوقات به نظر می رسد که در حال کار در یک خط تلفن ویژه مراقبت از سالمندان هستم. پسرعموهای کوچکترم اکنون در جایی هستند که من چندین سال پیش بودم و از والدین و اقوام مراقبت می کنند که دیگر نمی توانند از خودشان مراقبت کنند. اشتباه نکنید، من آنها را دوست دارم، و خوشحالم که آنها را از طریق همه اینها راهنمایی می کنم. تماس‌های بی‌حس‌کننده مراقبت‌های بهداشتی که به یک بازی واقعی تلفنی تبدیل می‌شوند. راه‌اندازی حساب‌های بانکی مشترک به این دلیل که فرد مورد علاقه‌تان دیگر نمی‌تواند به اندازه کافی خوب ببیند یا بنویسد تا با صورت‌حساب‌ها مقابله کند (و البته به پرداخت خودکار صورت‌حساب نیز اعتماد ندارد). برخورد با وکلا در مورد وکالتنامه بازدیدها از اورژانس و چالش پیمایش \"غروب آفتاب\" همچنان ادامه دارد. اما فراتر از ارائه گام به گام آنها، من همچنین تشویق می کنم. من با تمام صداقت به آنها می گویم که چقدر فداکار هستند. چه پسر یا دختر یا خواهرزاده یا برادرزاده خوبی هستند. به آن‌ها یادآوری می‌کنم که دارند کار سختی انجام می‌دهند و نفس بکشند، هوای تازه بگیرند و مراقب خودشان هم باشند. من اغلب متوجه می شوم که از یک
