<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۱ آذر ۱۴۰۵</title>
  <style>
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dastkhat';
      src: url('../fonts/DastkhatFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
  </style>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Dastkhat', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

    <main id="newsContainer" class="news-grid"></main>

    </div>
  </div>

fa": "خرید فناوری دست دوم می تواند در هزینه شما صرفه جویی کند، اما برخی از ابزارها ارزش ریسک کردن را ندارند. در اینجا چیزی است که شما باید از خرید دست دوم خودداری کنید مگر اینکه تعمیر شده باشد. برای برخی از دسته ها، پس انداز به سادگی ارزش مبادله را ندارد. DAMRONG RATTANAPONG/Shutterstock افزودن Engadget به Google: منبع ترجیحی Google Discover انتخاب فناوری استفاده شده راهی عالی برای کاهش هزینه‌ها است، و در بسیاری از موارد، کنار گذاشتن فاکتور \"wow\" باز کردن یک دستگاه کاملاً جدید می‌تواند ارزش صرفه‌جویی را داشته باشد. اگر مدلی بخرید که خیلی قدیمی نیست و به صاحب قبلی اعتماد کنید، ممکن است سال‌ها استفاده از تلفن، تبلت یا لپ‌تاپ دست دوم باقی بماند. در مورد کنسول های بازی، مانیتورها و سایر دستگاه هایی که می توانند عمر زیادی در آنها باقی بماند نیز همین گونه است. با این حال، حتی با وجود تخفیف‌های وسوسه‌انگیز، برخی از دسته‌بندی‌های محصولات فناوری وجود دارد که باید از آنها صرفنظر کنید و جدید (یا شاید بازسازی شده) خریداری کنید. به‌علاوه، برخی از این دستگاه‌ها نگرانی‌های بهداشتی را افزایش می‌دهند، مانند هدفون‌ها و سایر پوشیدنی‌ها، در حالی که برخی از دسته‌های دستگاه‌ها مانند هارد دیسک‌ها و بانک‌های باتری با افزایش سن یا استفاده، قابلیت اطمینان خود را از دست می‌دهند. بنابراین دفعه بعد که در یک فروشگاه ساده خرید می‌کنید یا در یک صفحه آگهی‌های محلی به صورت آنلاین مرور می‌کنید، سراغ هیچ یک از این محصولات نروید. همچنین ارزش این را دارد که قبل از اینکه خودتان هر فناوری مورد استفاده را برای فروش فهرست کنید، این نکات را در نظر داشته باشید. Gorodenkoff/Getty Images این احتمالاً اولین دسته ای است که وقتی به چیزی فکر می کنید که نمی خواهید بعد از شخص دیگری از آن استفاده کنید، به ذهنتان خطور می کند. هدفون ها تا حد", "image_url": "https://www.engadget.com/img/gallery/5-gadgets-you-should-never-buy-used/l-intro-1794851054.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google"], "datetime_fa": "۳۰ آبان • ۱۸:۱۵"}, {"source": "Business Insider", "title": "I'm a real estate developer selling a $30 million mansion, and here’s why I’d accept Anthropic shares instead of cash", "link": "https://www.businessinsider.com/thirty-million-la-mansion-accepts-anthropic-shares-as-payment-2026-11", "summary": "Phillip Braunstein, a developer in LA, is willing to trade his $29,995,000 mansion for shares of OpenAI or Anthropic. Courtesy of Carolwood Estates Phillip Braunstein is willing to trade his $29,995,000 mansion for shares of OpenAI or Anthropic. The LA developer says a sluggish LA luxury market and his AI optimism prompted the offer. Braunstein says he believes that AI shares could multiply in value over time. This as-told-to essay is based on a conversation with Phillip Braunstein, president of Colossal Properties and owner of the home at 1210 Chickory Lane in the Brentwood neighborhood of Los Angeles. The property is listed for $29,995,000 and accepts shares from OpenAI and Anthropic as payment. The conversation has been edited for length and clarity. I've been in construction and real estate development for almost 15 years, and I've also become increasingly involved in tech investing . I started building this house in Brentwood in 2021. It's an architectural modern residence with almost four stories, including a basement and a rooftop deck with views of the Pacific Ocean, downtown Los Angeles, and the Getty Museum. I've put a lot into the property. But when I put it on the market, I also started thinking about what else I might accept as payment. I'm a big believer in AI, and I thought: If somebody has a significant amount of equity in OpenAI or Anthropic, why not consider trading the house for that? Why I'm open to AI shares The Los Angeles luxury property market has been sluggish, as many who could afford such properties are deterred by the mansion tax. Courtesy of Carolwood Estates I started using AI heavily in 2023, initially for personal applications. Then I got deeper into it and started building an actual stock-trading algorithm with a friend and neighbor who was formerly the director of Applied AI at Google. At the same time, my friends and I were talking about getting investment stakes in AI companies . Meanwhile, the Los Angeles real estate market was very soft. The mansion tax had been introduced, and there was also uncertainty around a proposed billionaire tax in California. There were a lot of questions about whether people with the net worth to buy a property at this price point would want to remain in Los Angeles. So I thought, you know what? If someone has a lot of equity in OpenAI or Anthropic , I'd be happy to take it. As someone who uses AI heavily, I really believe in the technology. I wanted to let the marketplace know that if someo", "date_str": "2026-11-21T14:00:01+00:00", "hash": "64c02ecf6f4db362", "title_fa": "من یک توسعه دهنده املاک و مستغلات هستم که یک عمارت 30 میلیون دلاری می فروشم، و به همین دلیل است که به جای پول نقد، سهام آنتروپیک را می پذیرم.", "summary_fa": "فیلیپ براونشتاین، یک توسعه دهنده در لس آنجلس، مایل است عمارت 29,995,000 دلاری خود را با سهام OpenAI یا Anthropic معامله کند. فیلیپ براونشتاین با حسن نیت از Carolwood Estates مایل است عمارت 29,995,000 دلاری خود را با سهام OpenAI یا Anthropic معامله کند. توسعه‌دهنده لس‌آنجلس می‌گوید که بازار لوکس LA و خوش‌بینی هوش مصنوعی او باعث این پیشنهاد شده است. براونشتاین می گوید که او معتقد است که ارزش سهام هوش مصنوعی در طول زمان می تواند چند برابر شود. این مقاله گفته شده بر اساس گفتگو با فیلیپ براونشتاین، رئیس کلوسال پرپرتیز و صاحب خانه در 1210 Chickory Lane در محله برنت وود لس آنجلس است. این دارایی به قیمت 29,995,000 دلار فهرست شده است و سهام OpenAI و Anthropic را به عنوان پرداخت می پذیرد. گفتگو برای طولانی بودن و وضوح ویرایش شده است. من تقریباً 15 سال است که در ساخت و ساز و توسعه املاک و مستغلات بوده ام و همچنین به طور فزاینده ای درگیر سرمایه گذاری در فناوری شده ام. ساختن این خانه را در برنت‌وود در سال 2021 آغاز کردم. این یک اقامتگاه مدرن با معماری تقریباً چهار طبقه است، شامل یک زیرزمین و یک عرشه روی پشت بام با چشم‌اندازی از اقیانوس آرام، مرکز شهر لس‌آنجلس، و موزه گتی. من مقدار زیادی برای ملک گذاشته ام. اما وقتی آن را به بازار عرضه کردم، به این ost more than $200 round-trip if I purchased individual train tickets. Flights were similarly priced as well, so I opted to use a Rail Pass and tack on a few extra stops along the way. During the trip, I traveled to Holland, Michigan, for the annual Tulip Time festival, rerouted through Washington, DC, just in time to make the peak blooms of cherry blossom season , and spent 24 hours in Savannah visiting with a friend. The stops really added to the experience and were things I wouldn't have experienced had I flown or bought a single Amtrak ticket. When my train has a Sightseer Lounge, I take full advantage of the views. Malia Yoshioka It's not available on every train, but when it is, I love spending time in the Sightseer Lounge , a spacious public car with panoramic windows to take in the views. There's nothing better than starting my mornings there with a cup of coffee and the sunrise. I've seen passengers writing postcards, knitting, drawing, reading, or (like me) just sitting and taking in the changing scenery out the window. It's the perfect place to slow down. However, when I m using the pass, delays can throw off my entire itinerary. Malia Yoshioka For me, the biggest downside of the USA Rail Pass is managing unexpected delays and cancellations. Although many of my trains have arrived promptly (occasionally even early), I've also ", "date_str": "2026-11-21T13:57:01+00:00", "hash": "3bd8a2b06a5609fd", "title_fa": "من 4 بار پاس قطار آمتراک آمریکا را خریده ام. استفاده از گذرنامه 499 دلاری مزایای بسیار زیادی دارد و چند ناامیدی نیز به همراه دارد.", "summary_fa": "من چهار بار گذرنامه راه آهن آمتراک ایالات متحده را خریده ام. Malia Yoshioka در طول یک سال و نیم گذشته، چهار بار گذرنامه راه آهن آمتراک 499 دلاری آمریکا را خریداری کرده ام. این پاس که به من اجازه می دهد 10 بلیط قطار را در 30 روز رزرو کنم، راهی عالی برای دیدن کشور است. با این حال، تأخیر می‌تواند کل برنامه سفر من را از بین ببرد و من نمی‌توانم با استفاده از گذرنامه اتاقی رزرو کنم. در طول یک سال و نیم گذشته، م , with streaming on Peacock. The lineup also includes Baha Men, Natasha Bedingfield, Blues Traveler, DEVO, Wyclef Jean, Queen Latifah, Keke Palmer, RIIZE and Smash Mouth, with a special Dolly Parton tribute led by Megan Hilty and a featured performance by EJAE. At Herald Square, Megan Moroney and Teddy Swims will perform, while Broadway shows will join in a special celebration. The parade will feature a record 100 inflatables, six new floats and more than 11,000 volunteers and participants for its milestone march. Erika Ender Celebrates 35-Year Career in Panama Panamanian singer-songwriter Erika Ender celebrated her 35-year musical career in Panama with the premiere of a musical based on her life and the presentation of her book, AprEnder El Éxito , which is currently available for pre-order. The musical Erika Ender — written and directed by Venezuelan playwright Benjamín Cohen and featuring a cast of approximately 80 performers — held its grand international premiere on Thursday (Nov. 19) at the National Theater in Panama City. In addition to Ender and her family, the event was attended by prominent figures from the music and entertainment industries, including Desmond Child, Elena Rose, Elvis Crespo, Aymée Nuviola and Diana Reyes, as well as Panamanian boxing legend Roberto Durán. Also in attendance was Randy Cuevas, of the band Rabanes, who was responsible for the musical arrangements for the production. Before the show began, Ender was presented with a medal in recognition of merit and an exceptional artistic career by Panama’s Minister of Culture, Maruja Herrera. The award is a new annual honor designed to celebrate individuals who, through their personal example and artistic work, make an extraordinary contribution to Panama’s cultural enrichment and international profile. The following morning, at the same venue, the book was presented during an event moderated by media personality Ismael Cala. SIGAL RATNER", "date_str": "2026-11-21T15:00:00+00:00", "hash": "     let currentTab = 'persian';

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {

        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {

        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">

                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
