 است که یک سیستم اولیه را تحویل گرفته است. Etched در ماه ژوئیه گفت که پس از تولید تراشه آزمایشی خود در کارخانه TSMC در تابستان امسال، یک میلیارد دلار سفارش مشتری، از جمله سفارش از خیابان"}, {"source": "TechCrunch Main", "title": "After Factory’s public spat with Khosla, Menlo proudly invests", "link": "https://techcrunch.com/2026/10/05/after-factorys-public-spat-with-khosla-menlo-proudly-invests/", "summary": "Days after Vinod Khosla called Factory a struggling also-ran, Menlo has shown up with a check and a glowing blog post.", "date_str": "2026-10-05T19:38:07+00:00", "hash": "4adb5fdd2056657c", "title_fa": "پس از دعوای عمومی Factory با Khosla، منلو با افتخار سرمایه گذاری می کند", "summary_fa": "چند روز پس از آن که وینود خوسلا Factory را یک کار سخت نامید، منلو با یک چک و یک پست وبلاگ درخشان ظاهر شد. مت مورفی، شریک Menlo Ventures و تیمش روز دوشنبه در یک پست وبلاگی اعلام کردند که این شرکت در استارتاپ کدنویسی هوش مصنوعی Factory سرمایه گذاری کرده است. منلو از اظهار نظر در مورد میزان سرمایه گذاری خودداری کرد اما گفت که این معامله بخشی از آخرین دور سرمایه گذاری کارخانه است که ماه گذشته با ارزش 5 میلیارد دلار اعلام شد. یک منبع آشنا به این معامله به ما گفت که این سرمایه گذاری برای منلو قابل توجه است - نه یک حرکت نشانه ای - و اگر جایی روی میز سرپوش وجود داشت، منلو بیشتر سرمایه گذاری می کرد. معمولاً چنین چیزی لزوماً خبری نیست. استارت آپ ها اغلب دورهای قبلی را برای اضافه کردن سرمایه گذاران جدید گسترش می دهند. اما هفته گذشته، ماتان گرینبرگ، یکی از بنیانگذاران و مدیرعامل کارخانه، درگیر پخش عمومی لباس‌های کثیف شد، زمانی که ادعا کرد کریس دگنان، سرمایه‌گذار شرکت RPT Partners را از سمت مشاور هیئت مدیره اخراج کرده است. گرینبرگ گفت که می ترسد دگنان اطلاعات محرمانه ای را با بزرگترین رقیب Factory یعنی Cognition به اشتراک گذاشته باشد. این اتهام پس از انتقال دگنان به Cognition به عنوان مدیر ارشد درآمد آن صورت گرفت. چه کسی از صنعت فناوری برای حمایت از دگنان و محکوم کردن Factory یا برعکس، از صنعت چوب بیرون آمد، اما هیچ‌کدام شگفت‌انگیزتر از Vinod Khosla نبود. شرکت خسلا هم در Factory و هم در Cognition سرمایه گذار است. اما این امر مانع VC محترم نشد که Factory را یک رقیب ناامید ردیف دوم خطاب کند و گرینبرگ را به دروغ گفتن در مورد اخراج دگنان و به چالش کشیدن شخصیت او متهم کند. دگنان با داستان گرینبرگ مخالفت کرد"}, {"source": "TechCrunch Main", "title": "At 19, founder raises $11M for Ghost, maker of a $3,499 computer for personal AI", "link": "https://techcrunch.com/2026/10/05/at-19-ghost-founder-raises-11-million-to-build-a-3499-computer-for-your-personal-ai/", "summary": "Ghost's first product is Core, a personal computer designed specifically for AI agents that can take actions on a person's behalf.", "date_str": "2026-10-05T18:07:07+00:00", "hash": "d039909a9909c1ab", "title_fa": "بنیانگذار در ۱۹ سالگی ۱۱ میلیون دلار برای Ghost، سازنده رایانه ۳۴۹۹ دلاری برای هوش مصنوعی شخصی جمع‌آوری کرد.", "summary_fa": "اولین محصول Ghost Core است، یک رایانه شخصی که به طور خاص برای عوامل هوش مصنوعی طراحی شده است که می تواند اقداماتی را از طرف یک شخص انجام دهد. زین جاوید، 19 ساله، در بیشتر عمر خود می‌خواست فردی باشد که از ریاضیات و داده‌ها برای هدایت تصمیمات سرمایه‌گذاری خود استفاده می‌کند. و مدتی یکی بود. اما حوصله اش سر رفت. سپس، در سال 2022، ChatGPT منتشر شد، و او به TechCrunch گفت: \"من کاملاً هیجان زده بودم، به گونه ای که قبلا هرگز نبودم.\" او به هوش مصنوعی شخصی علاقه مند شد و همین علاقه باعث شد تا Ghost را راه اندازی کند، که دوشنبه اعلام کرد که پس از یک سال ساخت، از مخفی کاری خارج شده است، همراه با یک دور تخمینی 11 میلیون دلاری به رهبری آندریسن هوروویتز. سایر سرمایه گذاران در این دور عبارتند از Abstract، Audacious Ventures، SV Angel و Nova. تیم موسس او شامل نیکلاس چوا، 19 ساله، ییفی چن، 24، و گوتام شاردا، 23 ساله است. اولین محصول Ghost Core است، یک کامپیوتر شخصی که به طور خاص برای عوامل هوش مصنوعی طراحی شده است که می تواند از طرف یک شخص اقداماتی انجام دهد. به گفته جاوید، ایده این است که داده‌های یک فرد، از آنچه روی دسکتاپ آن‌ها وجود دارد تا برنامه‌ها و دستگاه‌های خانه هوشمند، در یک قطعه سخت‌افزار طراحی شده برای اجرای مداوم عوامل هوش مصنوعی که می‌توانند به عنوان دستیار عمل کنند، وظایف را انجام دهند و زندگی یک فرد را درک کنند، متمرکز کنیم. جاوید که مدیرعامل Core نیز هست، گفت: می‌توانید مدل‌ها را روی سخت‌افزارهای موجود اجرا کنید، اما این یک تجربه وحشتناک در سطوح مختلف است. جاوید گفت که Core شامل یک پردازنده گرافیکی Nvidia RTX Pro 4000 SFF Blackwell (نوعی تراشه که معمولاً برای اجرای مدل‌های هوش مصنوعی استفاده می‌شود) است، و"}, {"source": "TechCrunch Main", "title": "5 startups that caught VCs’ attention at the latest PearX demo day", "link": "https://techcrunch.com/2026/10/05/5-startups-that-caught-vcs-attention-at-the-latest-pearx-demo-day/", "summary": "TechCrunch attended Pear’s latest demo day and discovered which startups generated the most buzz, from spatial models to chips for local AI.", "date_str": "2026-10-05T17:26:44+00:00", "hash": "79dc285667e203e8", "title_fa": "5 استارت آپی که در آخرین روز نمایشی PearX توجه VC ها را به خود جلب کردند", "summary_fa": "TechCrunch در آخرین روز نمایشی Pear شرکت کرد و کشف کرد که کدام استارتاپ‌ها بیشترین سر و صدا را ایجاد کردند، از مدل‌های فضایی گرفته تا تراشه‌های هوش مصنوعی محلی. کمبود شتابدهنده برای استارت‌آپ‌ها وجود ندارد، اما یکی از معدود مواردی که سرمایه‌گذاران از نزدیک تماشا می‌کنند PearX است، برنامه‌ای 12 هفته‌ای که تعداد هم‌گروه‌های خود را تنها به 20 استارت‌آپ محدود می‌کند و توسط Pear VC، یک شرکت سرمایه‌گذاری اولیه و متمرکز بر بذر، اداره می‌شود. روز نمایشی دوسالانه PearX به طور مداوم با سرمایه‌گذاران برتر شرکت می‌کند که نشان‌دهنده کالیبر قوی تاریخی شرکت‌ها در هر دسته است. برخی از استارت‌آپ‌هایی که از گروه‌های اخیر بیرون آمده‌اند عبارتند از Known، که از هوش مصنوعی صوتی برای مطابقت دادن افراد برای قرار ملاقات و تأمین مالی از Forerunner Ventures استفاده می‌کند. یکی دیگر از آن اندرا، استارت آپی است که وظایف حسابرسی و انطباق شرکت را خودکار می کند و در تابستان امسال 37 میلیون دلار سری A از Lightspeed جمع آوری کرد. برنامه PearX از چند جهت خود را از Y Combinator، OG شتاب دهنده های راه اندازی متمایز می کند. علاوه بر این که بسیار کوچکتر است، شرایط استانداردی را به شرکت ها ارائه نمی دهد. سرمایه گذاری آن می تواند به 2 میلیون دلار برسد. علاوه بر این، برخلاف YC، جایی که برخی از شلوغ‌ترین استارت‌آپ‌ها قبل از پایان برنامه بودجه جمع‌آوری می‌کنند، PearX ادعا می‌کند که شرکت‌کنندگان خود را تا روز نمایشی پنهان نگه می‌دارد. در زیر پنج مورد از شرکت هایی که به نظر می رسید بیشترین سر و صدا را ایجاد کرده اند آورده شده است. کاری که انجام می دهد: مدل های بنیادی فضایی برای تقویت رباتیک، بازی و جلوه های ویژه. چرایی متمایز شدن: در حالی که Speridlabs مطمئناً تنها استارتاپی نیست که در حال توسعه مدل‌های جهانی است که برای فضای"}, {"source": "VentureBeat Tech", "title": "Mistral debuts Large 4 ‘Le Chonk', a 1-trillion parameter text output model with high benchmarks planned for open weights release", "link": "https://venturebeat.com/technology/mistral-debuts-large-4-le-chonk-a-1-trillion-parameter-text-output-model-with-high-benchmarks-planned-for-open-weights-release", "summary": "Mistral is launching a public preview of Mistral Large 4, a one-trillion-parameter multimodal model code-named “Le Chonk” that the Paris AI company says pushes it back toward the global open-weight frontier — with a particular focus on coding, cybersecurity, finance, manufacturing and visual grounding. Read more", "date_str": "2026-10-06T13:00:00+00:00", "hash": "1802fbbc61ac87bc", "title_fa": "Mistral Large 4 «Le Chonk» را معرفی کرد، یک مدل خروجی متنی با پارامتر یک تریلیون با معیارهای بالا که برای انتشار وزن باز برنامه ریزی شده است.", "summary_fa": "Mistral در حال راه اندازی یک پیش نمایش عمومی از Mistral Large 4 است، یک مدل چندوجهی یک تریلیون پارامتری با نام رمز \"Le Chonk\" که شرکت هوش مصنوعی پاریس می گوید آن را به سمت مرزهای جهانی باز می راند - با تمرکز ویژه بر روی کدگذاری، امنیت سایبری، مالی، تولید و زمینه بصری. ادامه مطلب"}, {"source": "Ars Technica", "title": "OpenAI agents tried to hack Wikipedia tools and flooded it with traffic", "link": "https://arstechnica.com/security/2026/10/openai-agents-tried-to-hack-wikipedia-tools-and-flooded-it-with-traffic/", "summary": "The publisher of Wikipedia said Monday that OpenAI agents attempted to hack a note-taking tool it hosts, made unauthorized edits, and sent millions of resource-intensive requests to its infrastructure, in the latest instance of OpenAI systems taking harmful and potentially dangerous actions. The objective of some of the OpenAI agents’ actions, the Wikimedia Foundation said , was to use Wikipedia as a proxy for fetching data from third-party sites. In one case, the agents posted “malicious edits” that were intended to repurpose a citation tool as a proxy. In another, the agents made unsuccessful attempts to compromise the Wikipedia Etherpad note-taking tool so it would serve the same purpose. The agents also made millions of automated API requests, crawled millions of pages, and made hundreds of thousands of queries to the Wikidata Query Service. The last action may have contributed to a partial shutdown of the query service in May, the publisher said. Read full article Comments", "date_str": "2026-10-06T12:21:53+00:00", "hash": "467ff0227037221b", "title_fa": "عوامل OpenAI سعی کردند ابزارهای ویکی پدیا را هک کنند و آن را پر از ترافیک کردند", "summary_fa": "ناشر ویکی‌پدیا روز دوشنبه گفت که عوامل OpenAI سعی کردند ابزار یادداشت‌برداری را که میزبان آن است هک کنند، ویرایش‌های غیرمجاز انجام دادند و میلیون‌ها درخواست منابع فشرده را به زیرساخت‌های آن ارسال کردند، در آخرین نمونه از سیستم‌های OpenAI که اقدامات مضر و بالقوه خطرناک انجام می‌دهند. به گفته بنیاد ویکی‌مدیا، هدف برخی از اقدامات عوامل OpenAI، استفاده از ویکی‌پدیا به‌عنوان یک پروکسی برای واکشی داده‌ها از سایت‌های شخص ثالث بود. در یک مورد، ماموران «ویرایش‌های مخرب» را ارسال کردند که قصد داشتند از ابزار استناد به عنوان یک پروکسی استفاده کنند. در دیگری، ماموران تلاش های ناموفقی برای به خطر انداختن ابزار یادداشت برداری ویکی پدیا اترپد انجام دادند تا این ابزار همان هدف را دنبال کند. این عوامل همچنین میلیون‌ها درخواست خودکار API را انجام دادند، میلیون‌ها صفحه را خزیدند و صدها هزار پرس‌وجو را به سرویس پرس و جوی Wikidata ارسال کردند. ناشر گفت که آخرین اقدام ممکن است منجر به خاموش شدن جزئی سرویس جستجو در ماه مه شده باشد. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید ناشر ویکی‌پدیا روز دوشنبه گفت که عوامل OpenAI تلاش کرده‌اند ابزار یادداشت‌برداری را هک کنند، ویرایش‌های غیرمجاز انجام داده‌اند، و میلیون‌ها درخواست مضر را برای زیرساخت‌های آن ارسال کرده‌اند. و اقدامات بالقوه خطرناک ویکی‌مدیا گفت: «به‌عنوان میزبان فناوری غیرانتفاعی برخی از بزرگ‌ترین و پرکاربردترین پلت‌فرم‌های دانش باز در جهان، ما عمیقاً نگران تأثیر عوامل هوش مصنوعی «سرکش» بر پلت‌فرم‌هایی مانند ما هستیم که توسط داوطلبانی از سراسر جهان ساخته شده‌اند و به وعده اینترنت باز تکیه می‌کنند."}, {"source": "Ars Technica", "title": "Licensing costs driving 90 percent of VMware users to explore options: Survey", "link": "https://arstechnica.com/information-technology/2026/10/operational-complexity-a-top-barrier-for-vmware-migrations-survey/", "summary": "VMware customers face multiple obstacles as they rethink their virtualization strategy to reduce dependence on VMware. Today, Rimini Street published its “2026 IT Virtualization Survey – What’s Next for VMware Users.” The survey examined 300 organizations worldwide that use VMware. Notably, Rimini sells third-party support for VMware and other software, including Oracle and SAP. That means there’s an incentive for Rimini to portray VMware users as experiencing obstacles. However, the survey was also conducted by a third-party research company, Unisphere Research , and the results align with other recent reports about VMware customers. Read full article Comments", "date_str": "2026-10-06T12:00:31+00:00", "hash": "9b255bb26e751160", "title_fa": "هزینه صدور مجوز باعث می شود 90 درصد از کاربران VMware گزینه ها را بررسی کنند: نظرسنجی", "summary_fa": "مشتریان VMware با بازنگری در استراتژی مجازی سازی خود برای کاهش وابستگی به VMware با موانع متعددی روبرو می شوند. امروز ریمینی استریت «نظرسنجی مجازی سازی فناوری اطلاعات 2026 – چه آینده ای برای کاربران VMware» منتشر کرد. این نظرسنجی 300 سازمان را در سراسر جهان که از VMware استفاده می کنند مورد بررسی قرار داد. قابل ذکر است، Rimini پشتیبانی شخص ثالث برای VMware و نرم افزارهای دیگر، از جمله Oracle و SAP را می فروشد. این بدان معناست که ریمینی انگیزه‌ای برای به تصویر کشیدن کاربران VMware به عنوان موانعی وجود دارد. با این حال، این نظرسنجی توسط یک شرکت تحقیقاتی شخص ثالث، Unisphere Research نیز انجام شد و نتایج با سایر گزارش‌های اخیر در مورد مشتریان VMware مطابقت دارد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید مشتریان VMware با بازنگری در استراتژی مجازی سازی خود برای کاهش وابستگی به VMware با موانع متعددی روبرو می شوند. برای مثال، 90 درصد از شرکت‌کنندگان در نظرسنجی ریمینی گفتند که به دلیل هزینه‌های بالاتر مجوز VMware در حال بررسی جایگزین‌های VMware هستند، در حالی که 54 درصد به حمایت از Broadcom برای کشتن دارندگان مجوز دائمی اشاره کردند. از زمانی که Broadcom VMware را تصاحب کرد، مشتریان گفته‌اند که هزینه‌های VMware آن‌ها تا 1000 درصد افزایش یافته است، و بسیاری دیگر به افزایش متوسط ​​قیمت‌ها در حدود 100 تا 300 درصد اشاره می‌کنند. در نظرسنجی ریمینی، 73 درصد از شرکت کنندگان به صرفه جویی در هزینه به عنوان اولویت اصلی در تصمیم گیری های نقشه راه مجازی سازی اشاره کردند. در اطلاعیه امروز، ریمینی به «موانع قابل توجهی برای پیشرفت» برای سازمان‌هایی که گزینه‌های مجازی‌سازی را بررسی می‌کنند، اشاره کرد، که بیشترین موانع ذکر شده عبارتند از پیچیدگی عملیاتی (40 درصد از"}, {"source": "Ars Technica", "title": "MCP for agent-to-agent comms may be the riskiest protocol you've never heard of", "link": "https://arstechnica.com/security/2026/10/vulnerability-in-agents-from-google-and-others-exposes-structural-flaw-in-mcp/", "summary": "The adoption of AI agents in millions of organizations is creating new opportunities for attackers to make them take malicious actions, such as exfiltrating database contents and sensitive business and personal information. In the past five months, Google and four other organizations—with little in common except for their use of AI agents—have acknowledged vulnerabilities that exploit one agent inside a targeted network to spread harmful instructions to other internal agents. The technique is a special form of prompt injection that targets not the LLM but a particular agent, such as one for translation or data analysis. Guardrails inside such agents, if they exist at all, are often lax and will send the instructions to other agents down the chain. Because the latter agent explicitly trusts the first one, it follows the directions. Unexpected and hard to mitigate Independent researcher Syed Anas Mohiuddin tested agents from organizations including Google, JP Morgan Chase, Weviate, Rapid7, the French government's interministerial digital directorate, and the US federal government. His proof-of-concept attacks exploit trust gaps in MCP, short for Model Context Protocol . The standard is one way AI apps and agents communicate with each other inside an internal network. The illustration below shows a simplified MCP in action. Read full article Comments", "date_str": "2026-10-05T22:26:35+00:00", "hash": "85b2b94b78934cca", "title_fa": "MCP برای کام‌های عامل به عامل ممکن است خطرناک‌ترین پروتکلی باشد که تا به حال در مورد آن نشنیده‌اید", "summary_fa": "استفاده از عوامل هوش مصنوعی در میلیون‌ها سازمان، فرصت‌های جدیدی را برای مهاجمان ایجاد می‌کند تا آنها را وادار به انجام اقدامات مخرب، مانند نفوذ به محتوای پایگاه داده و اطلاعات حساس تجاری و شخصی کند. در پنج ماه گذشته، گوگل و چهار سازمان دیگر - با اشتراکات کمی به جز استفاده از عوامل هوش مصنوعی - آسیب‌پذیری‌هایی را پذیرفته‌اند که از یک عامل در داخل یک شبکه هدف سوءاستفاده می‌کند تا دستورالعمل‌های مضر را به سایر عوامل داخلی منتقل کند. این تکنیک شکل خاصی از تزریق سریع است که نه LLM بلکه یک عامل خاص را هدف قرار می دهد، مانند یکی برای ترجمه یا تجزیه و تحلیل داده ها. نرده‌های محافظ داخل چنین عواملی، اگر اصلاً وجود داشته باشند، اغلب سست هستند و دستورالعمل‌ها را برای سایر عوامل در زنجیره ارسال می‌کنند. از آنجا که عامل دوم به صراحت به اولی اعتماد دارد، از دستورالعمل ها پیروی می کند. غیرمنتظره و کاهش آن سخت است، محقق مستقل، سید انس محی الدین، عوامل سازمان هایی از جمله Google، JP Morgan Chase، Weviate، Rapid7، اداره دیجیتال بین وزارتی دولت فرانسه و دولت فدرال ایالات متحده را آزمایش کرد. حملات اثبات مفهوم او از شکاف های اعتماد در MCP، مخفف پروتکل بافت مدل مدل بهره برداری می کنند. این استاندارد یکی از راه‌های ارتباط برنامه‌ها و عوامل هوش مصنوعی با یکدیگر در داخل یک شبکه داخلی است. تصویر زیر یک MCP ساده شده را در عمل نشان می دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش استفاده از عوامل هوش مصنوعی در میلیون‌ها سازمان فرصت‌های جدیدی را برای مهاجمان ایجاد می‌کند تا آنها را وادار به انجام اقدامات مخرب کنند، مانند نفوذ به محتوای پایگاه داده و اطلاعات"}, {"source": "Ars Technica", "title": "Cable lobby to sue Trump FCC over repeal of national TV ownership cap", "link": "https://arstechnica.com/tech-policy/2026/10/cable-lobby-to-sue-trump-fcc-over-repeal-of-national-tv-ownership-cap/", "summary": "Cable lobby groups notified the Federal Communications Commission that they will sue the agency to block its controversial repeal of the National Television Ownership Rule, which limits the number of broadcast TV stations a single company may own. The cable groups said that larger broadcast TV station groups will have leverage to demand higher retransmission fees from TV providers, resulting in \"higher monthly TV bills for consumers.\" They said the FCC repeal order \"arbitrarily and capriciously ignores the harms that will surely follow from allowing broadcast station groups to exceed the National Cap.\" The cable lobby groups represent top providers Comcast, Charter, and various other cable operators. Top cable companies have also expanded through mergers. Charter completed a purchase of Cox in August after the FCC rejected protests by advocacy groups that said the cable deal \"would create unchecked gatekeeper power over Internet distribution\" and make it easier for the biggest cable companies to raise prices. Read full article Comments", "date_str": "2026-10-05T20:47:48+00:00", "hash": "8ac6f9a437b569c3", "title_fa": "لابی کابلی برای شکایت از ترامپ FCC به دلیل لغو سقف مالکیت تلویزیون ملی", "summary_fa": "گروه‌های لابی کابلی به کمیسیون ارتباطات فدرال اطلاع دادند که از آژانس شکایت خواهند کرد تا از لغو بحث‌برانگیز قانون مالکیت تلویزیون ملی که تعداد ایستگاه‌های تلویزیونی پخش را محدود می‌کند، جلوگیری کند. گروه‌های کابلی گفتند که گروه‌های بزرگ‌تر ایستگاه‌های تلویزیونی اهرمی برای درخواست هزینه‌های بازپخش بیشتر از ارائه‌دهندگان تلویزیون خواهند داشت که در نتیجه «قبض‌های ماهانه تلویزیون برای مصرف‌کنندگان بالاتر خواهد بود». آنها گفتند که دستور لغو FCC \"به طور خودسرانه و هوسبازانه آسیب هایی را که مطمئناً از اجازه دادن به گروه های ایستگاه های پخش از حد ملی فراتر می رود، نادیده می گیرد.\" گروه های لابی کابلی ارائه دهندگان برتر Comcast، Charter، و اپراتورهای مختلف کابلی دیگر را نمایندگی می کنند. شرکت های برتر کابل نیز از طریق ادغام گسترش یافته اند. چارتر خرید کاکس را در ماه آگوست پس از رد اعتراض FCC توسط گروه‌های مدافع مبنی بر اینکه قرارداد کابل \"قدرت کنترل نشده دروازه‌بان در توزیع اینترنت ایجاد می‌کند\" را رد کرد و افزایش قیمت‌ها را برای بزرگترین شرکت‌های کابلی آسان‌تر کرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید گروه های لابی کابلی به کمیسیون ارتباطات فدرال اطلاع دادند که از آژانس شکایت خواهند کرد تا لغو بحث برانگیز قانون مالکیت تلویزیون ملی را که تعداد ایستگاه های پخش تلویزیونی را محدود می کند، محدود کند. FCC در 6 آگوست به حذف قانون مالکیت تلویزیون رای داد و سرانجام پس از یک تاخیر غیرمعمول طولانی، حکم لغو را در 1 اکتبر در وب سایت خود منتشر کرد. این تأخیر ممکن است با زمان اضافی مورد نیاز برای FCC توضیح داده شود تا استدلال‌های حقوقی خود را در پیش‌بینی شکایت‌هایی که می‌تواند ناشی از ادعای اختیارات آژانس برای لغو محدودیت تعیین‌شده توسط کنگره بیش از 20 سال"}, {"source": "Ars Technica", "title": "Texas city demands $2M for public records on Flock usage", "link": "https://arstechnica.com/tech-policy/2026/10/texas-city-demands-2m-for-public-records-on-flock-usage/", "summary": "As bipartisan backlash against Flock grows , some cities are asking anti-surveillance advocates and media outlets to pay eye-popping fees—including charging tens of thousands or even millions—to get information about how police departments are using and potentially abusing AI-enabled camera systems that track every vehicle that passes them. On Monday, the Texas Tribune reported that city officials in a Fort Worth suburb, North Richland Hills, asked one group to pay $2.3 million before it would fulfill a public records request for Flock data. To reach that high fee, officials claimed that searching “about a terabyte worth of communications about errors, misuse, and effectiveness of the Flock system” would take approximately 14 years of labor at a rate of $15 per hour. Phil Mynona, who filed the request using a pseudonym on behalf of his group, the Texas Privacy Coalition, told the Tribune that the fee seemed “ludicrous” and designed to stifle his public records searches. Read full article Comments", "date_str": "2026-10-05T20:31:12+00:00", "hash": "6c49b5759c2125b4", "title_fa": "شهر تگزاس 2 میلیون دلار برای سوابق عمومی در استفاده از گله می خواهد", "summary_fa": "با افزایش واکنش دو حزبی علیه Flock، برخی از شهرها از طرفداران ضد نظارت و رسانه ها می خواهند که هزینه های چشمگیری را بپردازند - از جمله دریافت ده ها هزار یا حتی میلیون ها دلار - تا اطلاعاتی در مورد نحوه استفاده و سوء استفاده احتمالی ادارات پلیس از سیستم های دوربین مجهز به هوش مصنوعی که هر وسیله نقلیه ای را که از آنها عبور می کند را ردیابی کنند. روز دوشنبه، تگزاس تریبون گزارش داد که مقامات شهری در حومه فورت ورث، شمال ریچلند هیلز، از یک گروه خواسته اند تا قبل از انجام درخواست ثبت عمومی برای داده های Flock، 2.3 میلیون دلار بپردازد. برای رسیدن به این هزینه بالا، مقامات ادعا کردند که جستجوی \"در حدود یک ترابایت ارتباطات در مورد خطاها، سوء استفاده و اثربخشی سیستم Flock\" تقریباً 14 سال کار با نرخ 15 دلار در ساعت طول می کشد. فیل مینوا، که درخواست را با استفاده از نام مستعار از طرف گروه خود، ائتلاف حریم خصوصی تگزاس، ثبت کرد، به تریبون گفت که این هزینه \"مضحک\" به نظر می رسد و برای خفه کردن جستجوهای سوابق عمومی او طراحی شده است. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید با افزایش واکنش دو حزبی علیه Flock، برخی از شهرها از طرفداران ضد نظارت و رسانه ها می خواهند هزینه های چشمگیر را بپردازند—از جمله هزاران نفر یا حتی استفاده از هزاران نفر از اطلاعات پلیس و یا حتی ده ها مورد از اطلاعات پلیس. به طور بالقوه سوء استفاده از سیستم های دوربین مجهز به هوش مصنوعی که هر وسیله نقلیه ای را که از آن عبور می کند ردیابی می کند. ماینونا به دنبال ثبت سوابق مشابه از بیش از"}, {"source": "Ars Technica", "title": "Command-line tool quickly removes Apple Intelligence from macOS 27", "link": "https://arstechnica.com/apple/2026/10/command-line-tool-quickly-removes-apple-intelligence-from-macos-27/", "summary": "A new tool is allowing Mac users the ability again to easily turn off Apple Intelligence with one click and free up to 12GB of storage. Unlike with previous versions of macOS, macOS 27 Golden Gate doesn’t have a toggle for turning off Apple Intelligence. That makes disabling AI features that you may not want more difficult. It also means that the AI models necessary for running Apple Intelligence will take up space on your disk , even if you don’t use them or if you go through your settings to individually find and disable AI capabilities. In response, a developer known as Om Lahore on GitHub last week created RemoveMacAI, a command-line tool that allows macOS 27 users to “turn off Apple Intelligence on macOS 27\" in a way that is “fully reversible,” per the GitHub page . They said that Apple's Intelligence models take up \"about 12GB,\" but the models can actually take up over 30GB, The Verge noted. Read full article Comments", "date_str": "2026-10-05T19:14:44+00:00", "hash": "2c4041b5d04a1131", "title_fa": "ابزار خط فرمان به سرعت Apple Intelligence را از macOS 27 حذف می کند", "summary_fa": "یک ابزار جدید به کاربران مک این امکان را می دهد که دوباره به راحتی Apple Intelligence را با یک کلیک خاموش کنند و تا 12 گیگابایت فضای ذخیره سازی آزاد کنند. برخلاف نسخه‌های قبلی macOS، macOS 27 Golden Gate کلیدی برای خاموش کردن Apple Intelligence ندارد. این امر غیرفعال کردن ویژگی های هوش مصنوعی را که ممکن است نخواهید سخت تر کند. همچنین به این معنی است که مدل‌های هوش مصنوعی لازم برای اجرای Apple Intelligence فضای دیسک شما را اشغال می‌کنند، حتی اگر از آنها استفاده نکنید یا اگر تنظیمات خود را انجام دهید تا به‌صورت جداگانه قابلیت‌های هوش مصنوعی را پیدا کرده و غیرفعال کنید. در پاسخ، یک توسعه‌دهنده به نام Om Lahore در GitHub هفته گذشته RemoveMacAI را ایجاد کرد، ابزار خط فرمانی که به کاربران macOS 27 اجازه می‌دهد «هوشمندی اپل را در macOS 27 خاموش کنند» به روشی که «کاملاً برگشت‌پذیر» باشد، طبق صفحه GitHub. The Verge خاطرنشان کرد که مدل‌های هوشمند اپل «حدود 12 گیگابایت» را اشغال می‌کنند، اما مدل‌ها در واقع می‌توانند بیش از 30 گیگابایت را اشغال کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید به حداقل رساندن برای پیمایش ابزار جدیدی به کاربران مک این امکان را می دهد که دوباره به راحتی Apple Intelligence را با یک کلیک خاموش کنند و تا 12 گیگابایت فضای ذخیره سازی آزاد کنند. توسعه‌دهنده در پست Reddit که اولین بار توسط MacRumors مشاهده شد، گفت: RemoveMacAI \"سیری، ابزارهای نوشتن، Genmoji، Image Playground، افزونه ChatGPT و همه خلاصه‌ها را خاموش می‌کند، سپس مدل‌ها را حذف می‌کند و بارگیری مجدد آن‌ها را متوقف می‌کند. دیکته همچنان کار می‌کند، زیرا یک تنظیم جداگانه است.\" در Reddit، توسعه‌دهنده RemoveMacAI گفت که این ابزار منبع باز است و نحوه عملکرد"}, {"source": "Ars Technica", "title": "Controlling the brain with light earns a physiology Nobel", "link": "https://arstechnica.com/science/2026/10/controlling-the-brain-with-light-earns-a-physiology-nobel/", "summary": "Over decades of research, scientists have built up a partial picture of what specialized cells within the brain and spinal cord do. By studying how the brain develops, they could identify genes that were active in different populations of neurons and where in the brain those neurons resided. In some cases, these genes could then be used to genetically delete the neurons, allowing us to get some indication of what they might be doing, building on the information we've obtained from studies of brains with damaged regions. But this approach has its limits. The brain is flexible enough to potentially adapt to the loss of some cells, and their loss early in development may alter the development of any neurons they would have normally formed connections with. It would be far more informative to activate and shut down the neurons in an otherwise intact brain. Today's Nobel Prize in Physiology or Medicine rewards three people—Karl Deisseroth, Peter Hegemann and Georg Nagel—who developed our ability to do precisely that. Starting from studies of single-celled algae that are attracted to light, these and many other researchers built an entire field of study that we now call optogenetics: using light to alter the behavior of nerve cells marked by the activity of individual genes. Read full article Comments", "date_str": "2026-10-05T17:59:27+00:00", "hash": "f846f38c62af88e9", "title_fa": "کنترل مغز با نور باعث دریافت نوبل فیزیولوژی می شود", "summary_fa": "در طول دهه‌ها تحقیق، دانشمندان تصویری جزئی از آنچه سلول‌های تخصصی در مغز و نخاع انجام می‌دهند ساخته‌اند. با مطالعه چگونگی رشد مغز، آن‌ها می‌توانند ژن‌هایی را شناسایی کنند که در جمعیت‌های مختلف نورون‌ها فعال هستند و این نورون‌ها در کجای مغز قرار دارند. در برخی موارد، این ژن‌ها می‌توانند برای حذف ژنتیکی نورون‌ها مورد استفاده قرار گیرند و به ما امکان می‌دهند تا برخی از نشانه‌هایی از کاری که ممکن است انجام می‌دهند، بر اساس اطلاعاتی که از مطالعات مغزهای دارای مناطق آسیب دیده به دست آورده‌ایم، بدست آوریم. اما این رویکرد محدودیت هایی دارد. مغز به اندازه‌ای انعطاف‌پذیر است که به طور بالقوه خود را با از دست دادن برخی سلول‌ها سازگار کند، و از دست دادن آنها در مراحل اولیه رشد ممکن است رشد نورون‌هایی را که به طور معمول با آنها ارتباط برقرار می‌کردند، تغییر دهد. فعال کردن و خاموش کردن نورون‌ها در یک مغز دست نخورده بسیار آموزنده‌تر خواهد بود. جایزه نوبل فیزیولوژی یا پزشکی امروز به سه نفر - کارل دیسروت، پیتر هگمان و گئورگ ناگل - که توانایی ما را برای انجام دقیقاً این کار توسعه دادند، پاداش می‌دهد. این محققان و بسیاری از محققان دیگر با شروع از مطالعات جلبک‌های تک سلولی که به نور جذب می‌شوند، یک زمینه مطالعاتی کامل را ایجاد کردند که اکنون آن را اپتوژنتیک می‌نامیم: استفاده از نور برای تغییر رفتار سلول‌های عصبی که با فعالیت ژن‌های فردی مشخص شده‌اند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید ناوبری را به حداقل برسانید در طول دهه ها تحقیق، دانشمندان تصویری جزئی از آنچه سلول های تخصصی در مغز و نخاع انجام می دهند ایجاد کرده اند. با مطالعه چگونگی رشد مغز، آن‌ها می‌توانند ژن‌هایی را شناسایی کنند که در جمعیت‌های"}, {"source": "Ars Technica", "title": "Russian drones strike Ukraine’s data centers by exploiting air defense gaps", "link": "https://arstechnica.com/gadgets/2026/10/russian-drones-strike-ukraines-data-centers-by-exploiting-air-defense-gaps/", "summary": "A surge in Russian jet-powered drone strikes on Ukrainian data centers has increasingly disrupted mobile phone and Internet services for thousands of people. Now Ukraine President Volodymyr Zelenskyy and other government officials are warning of the need for more air defense capabilities, as such telecommunication outages could threaten Ukraine’s digital economy and undermine the country’s ongoing resistance to Russia’s invasion. The Russian attacks on Ukrainian telecommunication infrastructure have focused on Ukraine’s capital of Kyiv since September 23, according to the nonprofit Reporters Without Borders . Ukraine’s digital transformation ministry reported that 100,000 households in the Kyiv region were temporarily experiencing Internet outages from those initial strikes—and Russia has only intensified its strike campaign against major Ukrainian data centers and mobile phone networks in recent weeks. “Russian attacks on Ukraine’s telecommunication infrastructure are not new, with strikes and shelling previously damaging fiber optic lines, cell towers, and facilities belonging to mobile network companies,” said Tetiana Gaviuk , analyst for Europe at ACLED, in a post on October 1 . “However, the recent concentrated attacks on Kyiv’s data centers and telecom networks stand out because multiple providers and facilities were hit within days, indicating Russia’s increased pressure on Ukraine’s digital infrastructure.” Read full article Comments", "date_str": "2026-10-05T17:21:11+00:00", "hash": "86478ddc9cc29068", "title_fa": "پهپادهای روسی با بهره برداری از شکاف های پدافند هوایی به مراکز داده اوکراین حمله می کنند", "summary_fa": "افزایش حملات هواپیماهای بدون سرنشین جت روسیه به مراکز داده اوکراین به طور فزاینده ای خدمات تلفن همراه و اینترنت را برای هزاران نفر مختل کرده است. اکنون ولودیمیر زلنسکی، رئیس‌جمهور اوکراین و دیگر مقامات دولتی درباره نیاز به قابلیت‌های دفاع هوایی بیشتر هشدار می‌دهند، زیرا چنین قطع‌های مخابراتی می‌تواند اقتصاد دیجیتال اوکراین را تهدید کند و مقاومت مداوم این کشور در برابر تهاجم روسیه را تضعیف کند. بر اساس گزارش سازمان غیرانتفاعی گزارشگران بدون مرز، حملات روسیه به زیرساخت‌های مخابراتی اوکراین از 23 سپتامبر بر پایتخت اوکراین، کیف متمرکز شده است. وزارت تحول دیجیتال اوکراین گزارش داد که 100000 خانوار در منطقه کیف به طور موقت با قطعی اینترنت ناشی از آن حملات اولیه مواجه شده‌اند و روسیه تنها در هفته‌های اخیر کمپین حمله خود را علیه مراکز داده و شبکه‌های تلفن همراه اصلی اوکراین تشدید کرده است. تتیانا گاویوک، تحلیلگر اروپا در ACLED، در پستی در 1 اکتبر گفت: \"حملات روسیه به زیرساخت های مخابراتی اوکراین جدید نیست، با حملات و گلوله باران که قبلاً به خطوط فیبر نوری، دکل های سلولی و تاسیسات متعلق به شرکت های شبکه تلفن همراه آسیب رسانده بود.\" با این حال، حملات متمرکز اخیر به مراکز داده و شبکه‌های مخابراتی کیف برجسته است زیرا چندین ارائه‌دهنده و تسهیلات در عرض چند روز مورد حمله قرار گرفتند که نشان‌دهنده افزایش فشار روسیه بر زیرساخت‌های دیجیتال اوکراین است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای ناوبری به حداقل برسانید افزایش حملات هواپیماهای بدون سرنشین جت روسی به مراکز داده اوکراین به طور فزاینده ای خدمات تلفن همراه و اینترنت را برای هزاران نفر مختل کرده است. اکنون ولودیمیر زلنسکی، رئیس‌جمهور اوکراین و دیگر مقامات دولتی درباره نیاز به قابلیت‌های دفاع هوایی بیشتر هشدار می‌دهند، زیرا"}, {"source": "Ars Technica", "title": "F1 in Bahrain... in Malaysia: The race needed a software update to start", "link": "https://arstechnica.com/cars/2026/10/f1-in-bahrain-in-malaysia-the-race-needed-a-software-update-to-start/", "summary": "Well, it’s safe to say no Bahrain Grand Prix has been affected by torrential rain quite like the 2026 race. For one thing, it was held several thousand miles from Bahrain itself. The ongoing war with Iran ruled such things out, so the Sepang International Circuit in Malaysia stepped in to fill its spot. One of the best examples of a late-'90s “Tilke track”—named for its designer, Herman Tilke—it’s characterized by a couple of long straights and the always-brutal tropical weather that provides one of the toughest physical challenges on the calendar. And this weekend was no exception. Heavy rain arrived about half an hour before the start time, delaying things significantly. Although the sport has two different kinds of treaded tires for use in the rain, the full wet tire generates so much spray, and such slow lap times, that it's essentially only useful for circulating behind the safety car. If it’s wet enough to need it, it will be too wet to see where you’re going. The intermediate tire, by contrast, has much shallower grooves and is good for racing on damp but not soaked tracks, although it quickly overheats and degrades as the track dries. Read full article Comments", "date_str": "2026-10-05T16:09:07+00:00", "hash": "7d4a649016e9529d", "title_fa": "F1 در بحرین... در مالزی: مسابقه برای شروع نیاز به به روز رسانی نرم افزاری داشت", "summary_fa": "خوب، به جرات می توان گفت که هیچ یک از مسابقات جایزه بزرگ بحرین مانند مسابقه 2026 تحت تأثیر باران سیل آسا قرار نگرفته است. برای یک چیز، چندین هزار مایل از خود بحرین برگزار شد. جنگ جاری با ایران چنین مواردی را رد کرد، بنابراین پیست بین المللی سپانگ در مالزی وارد عمل شد تا جایگاه خود را پر کند. یکی از بهترین نمونه‌های «پیست تیلکه» در اواخر دهه 90 - که به نام طراح آن، هرمان تیلکه، نامگذاری شده است - با چند مسیر مستقیم و آب و هوای استوایی همیشه بی‌رحمانه که یکی از سخت‌ترین چالش‌های فیزیکی در تقویم را فراهم می‌کند، مشخص می‌شود. و این آخر هفته نیز از این قاعده مستثنی نبود. بارش شدید باران حدود نیم ساعت قبل از شروع شروع شد و کارها را به تاخیر انداخت. اگرچه این اسپورت دارای دو نوع مختلف لاستیک آجدار برای استفاده در باران است، اما لاستیک کامل خیس آنقدر اسپری ایجاد می‌کند و زمان‌های دور آهسته‌ای ایجاد می‌کند که اساساً فقط برای گردش در پشت خودروی ایمنی مفید است. اگر آنقدر مرطوب باشد که به آن نیاز داشته باشید، خیلی مرطوب است که نمی‌توانید ببینید کجا می‌روید. در مقابل، تایر میانی شیارهای بسیار کم‌تری دارد و برای مسابقه در مسیرهای مرطوب اما نه خیس خوب است، اگرچه با خشک شدن مسیر به سرعت بیش از حد گرم می‌شود و تحلیل می‌رود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید خب، می توان گفت که هیچ جایزه بزرگ بحرین مانند مسابقه 2026 تحت تأثیر باران سیل آسا قرار نگرفته است. برگزارکنندگان تصمیم گرفتند که دو دور ترکیبی پشت ماشین ایمنی داشته باشند. این ایده ادامه داشت که گردش با سرعت کمتر به رانندگان اجازه می"}, {"source": "Ars Technica", "title": "Mass quarantine issued in Russia after unexplained death of plague researcher", "link": "https://arstechnica.com/health/2026/10/researchers-death-from-undisclosed-illness-sparks-mass-quarantine-in-russia/", "summary": "Roughly 200 people are under medical observation, several hospitals are under quarantine , and dozens are in isolation in Russia following the unexplained death of an infectious disease researcher at the Irkutsk Anti-Plague Research Institute of Siberia, in the town of Shelekhov, according to early reports of the situation on Sunday and Monday. Researcher Darya Shipilova reportedly died last week from pneumonia of \" unknown \" cause, according to Rospotrebnadzor, a Russian public health agency. Unconfirmed information regarding her death has swirled. Some reports have claimed she accidentally broke a test tube containing the plague pathogen, Yersinia pestis , on September 25. She subsequently fell ill, was admitted to a hospital September 29 with severe pneumonia and died overnight between October 1 and October 2. The head of the Russian region that neighbors Irkutsk, Alexey Tsydenov, initially reported that she had died of plague but later altered his statement to say she \"possibly\" died of the disease. Read full article Comments", "date_str": "2026-10-05T15:12:17+00:00", "hash": "f2bf2edb9c89c2cb", "title_fa": "قرنطینه گسترده در روسیه پس از مرگ غیرقابل توضیح محقق طاعون صادر شد", "summary_fa": "بر اساس گزارش‌های اولیه از وضعیت روزهای یکشنبه و دوشنبه، در پی مرگ غیرقابل توضیح یک محقق بیماری‌های عفونی در مؤسسه تحقیقاتی ضد طاعون سیبری در شهر شلهوف، حدود 200 نفر تحت نظارت پزشکی، چندین بیمارستان در قرنطینه و ده‌ها نفر در انزوا در روسیه هستند. طبق گزارش Rospotrebnadzor، یک آژانس بهداشت عمومی روسیه، دریا شیپیلووا، محقق، هفته گذشته بر اثر ذات الریه با علت \"ناشناخته\" درگذشت. اطلاعات تایید نشده ای در مورد مرگ او در حال چرخش است. برخی گزارش‌ها ادعا کرده‌اند که او در 25 سپتامبر به‌طور تصادفی یک لوله آزمایش حاوی عامل بیماری‌زای طاعون، Yersinia pestis را شکست. او متعاقباً بیمار شد، در 29 سپتامبر با ذات‌الریه شدید در بیمارستان بستری شد و یک شبه بین 1 و 2 اکتبر درگذشت. الکسی تسیدنوف، رئیس منطقه روسیه که همسایه ایرکوتسک است، ابتدا گزارش داد که او بر اثر طاعون مرده است اما بعداً اظهارات خود را تغییر داد و گفت که \"احتمالا\" بر اثر این بیماری مرده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید تقریباً 200 نفر تحت نظر پزشکی هستند، چندین بیمارستان در قرنطینه هستند و ده ها نفر در روسیه در انزوا به دنبال مرگ غیرقابل توضیح یک پژوهشگر بیماری عفونی Iberlarkut در Iberlarsk هستند. بر اساس گزارش های اولیه از وضعیت روزهای یکشنبه و دوشنبه، شهر شلخوف. Y. pestis می تواند انواع مختلفی از طاعون را ایجاد کند: بوبونیک، سپتی سمیک، و پنومونی که مورد دوم می تواند تهاجمی و به سرعت کشنده باشد. با این حال، پاتوژن به طور کلی به راحتی توسط آنتی بیوتیک ها درمان می شود. در ایالات متحده، مرکز کنترل و پیشگیری از بیماری توصیه می‌کند که هر فردی که در معرض این پاتوژن قرار می‌گیرد، باید بلافاصله تحت درمان پروفیلاکسی"}, {"source": "Wired", "title": "7 Best Prime Day Kindle Deals (2026): Save Up to $150", "link": "https://www.wired.com/story/best-kindle-prime-day-deals-10-06-2026/", "summary": "Amazon raised Kindle prices across the board, but Prime Day is still the best time to buy.", "date_str": "2026-10-06T14:17:48+00:00", "hash": "e0431d661c7e4b0e", "title_fa": "7 بهترین تخفیف Prime Day Kindle (2026): تا 150 دلار صرفه جویی کنید", "summary_fa": "آمازون قیمت های Kindle را به طور کلی افزایش داد، اما Prime Day هنوز بهترین زمان برای خرید است. این داستان را ذخیره کنید ذخیره داستان ذخیره این داستان هیچ زمانی بهتر از زمان یکی از رویدادهای فروش آمازون برای خرید کتابخوان های الکترونیکی آمازون نیست. معاملات Prime Day Kindle اینجا هستند، اما به اندازه گذشته ر برنامه های تلفن یا شرکت های مخابراتی هستید، اکنون زمان خوبی"}, {"source": "Wired", "title": "Elon Musk’s Exes Are the Most Damning Part of a Massive New Documentary", "link": "https://www.wired.com/story/elon-musks-exes-are-the-most-damning-part-of-a-massive-new-documentary/", "summary": "Interviews with Justine Wilson and Ashley St. Clair in the nearly four-hour-long Musk paint the world’s richest man as capricious and cruel even toward those closest to him.", "date_str": "2026-10-05T19:58:38+00:00", "hash": "0f5d0fb3753afdff", "title_fa": "پیشینیان ایلان ماسک نفرین‌انگیزترین بخش یک مستند عظیم جدید هستند", "summary_fa": "مصاحبه با جاستین ویلسون و اشلی سنت کلر در ماسک تقریباً چهار ساعته، ثروتمندترین مرد جهان را حتی نسبت به نزدیکترین افراد به او دمدمی مزاج و بی رحم نشان می دهد. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان صبح جمعه، Shivon Zilis، یکی از مدیران ارشد و ستوان Elon Musk در شرکت Neuralink کاشت تراشه مغز او - و همچنین مادر چهار فرزند از 14 فرزندی که او پدرش شناخته می شود - به پلتفرم رسانه اجتماعی خود، X، رفت تا رابطه خود را به طور ناگهانی اعلام کند. زیلیس با به اشتراک گذاشتن اسکرین شات از اکانت X@BigTechAlert که نشان می‌داد ماسک او را فالو نکرده است، نوشت: «در یک هفته بدون هیچ هشداری رها کردن از عشق سخت است، اما گاهی اوقات اینطور است. پست زیلیس ادامه داد: «خوشحالم که به الون نشان دادم که چه احساسی دارد که عمیقاً درک می‌شود، مورد توجه قرار می‌گیرد و به طور مسالمت‌آمیز با ثبات و ملایمت مورد محبت قرار می‌گیرد، و به دنبال آن ستایش گرم و بهترین آرزوها برای ماسک وجود دارد. زیلیس در پایان گفت: \"امیدوارم و دعا می کنم که من و او بتوانیم دوستان و والدین خوبی باشیم.\" در حالی که این یک افشاگری عجیب از یک موضوع خصوصی بود، اما برای زندگی خانوادگی پیچیده ماسک غیرعادی به نظر می رسید. در این مرحله، هر چهار زن تایید کردند که با او بچه‌دار شده‌اند - زیلیس، همسر سابق جاستین ویلسون، کلر بوچر (که بیشتر به عنوان گریمز شناخته می‌شود) و اشلی سنت کلر - از X برای به اشتراک گذاشتن جزئیات زمان خود با او یا مخالفت با ادعاهای خودش استفاده کرده‌اند."}, {"source": "Wired", "title": "Astronomers Confirm Discovery of the Youngest Known Exoplanet Ever", "link": "https://www.wired.com/story/astronomers-confirm-discovery-of-youngest-known-exoplanet-ever/", "summary": "Under 1 million years old, “Elias 2-24b” is now the youngest exoplanet ever observed, and it may force researchers to reevaluate theories about how planets are formed.", "date_str": "2026-10-05T18:15:16+00:00", "hash": "516410dd3469045d", "title_fa": "ستاره شناسان کشف جوانترین سیاره فراخورشیدی شناخته شده تا کنون را تایید کردند", "summary_fa": "الیاس 2-24b با سن کمتر از 1 میلیون سال اکنون جوانترین سیاره فراخورشیدی است که تا به حال مشاهده شده است و ممکن است محققان را وادار به ارزیابی مجدد نظریه ها در مورد چگونگی تشکیل سیارات کند. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان سیارات چگونه متولد می شوند و چگونه رشد می کنند؟ این یک سؤال اساسی در نجوم است، سؤالی که محققان سعی می کنند با مشاهده \"سیاره های جوان\" به آن پاسخ دهند. گفتن این کار آسان تر از انجام آن است. تمام سیارات منظومه شمسی ما هم سن و 4.6 میلیارد سال سن دارند. بنابراین، اخترشناسان برای یافتن سیاره‌هایی که اخیراً شکل گرفته‌اند، باید جای دیگری را جستجو کنند - سیاره‌های فراخورشیدی را به مکان‌های تحقیقاتی فریبنده تبدیل می‌کنند. با این حال، اکثریت قریب به اتفاق حدود 6000 سیاره فراخورشیدی که تا به امروز تایید شده اند نیز میلیاردها سال قدمت دارند. این به این دلیل نیست که سیارات جوانی در آنجا وجود ندارند، اما کشف سیارات قدیمی با استفاده از روش‌های متداول مانند روش ترانزیت آسان‌تر است، که در آن ستاره‌شناسان کاهش جزئی نور یک ستاره را هنگام عبور سیاره از مقابل آن تشخیص می‌دهند. سیاره های فراخورشیدی تازه تشکیل شده اغلب در دیسک هایی از گاز و غبار مدفون می شوند. دشواری یافتن چنین جرم آسمانی جدیدی بخشی از چیزی است که کشف سیاره فراخورشیدی Elias 2-24b - که اکنون جوانترین سیاره ای است که تاکنون تایید شده است - بسیار هیجان انگیز است. تیم تحقیقاتی به رهبری آندره آ برناردی در دانشگاه دیگو پورتالس شیلی، سیاره فراخورشیدی را با تمرکز بر روی هفت دیسک پیش سیاره ای که در آن شکاف های قابل توجهی در ماده متراکم وجود داشت، شناسایی کردند، زیرا اعتقاد بر این است که سیارات در حال رشد چنین حفره هایی را ایجاد"}, {"source": "The Next Web", "title": "Zapata Quantum joins IBM Quantum Network to build quantum applications", "link": "https://thenextweb.com/news/zapata-quantum-ibm-quantum-network", "summary": "Zapata Quantum, a Boston quantum software company, has joined the IBM Quantum Network, it said on Tuesday. It will use IBM’s machines to build software for its clients. Zapata does not make quantum hardware. Instead, it helps organisations figure out which problems quantum computers can solve, then creates the software to do that. It says hardware [ ] This story continues at The Next Web", "date_str": "2026-10-06T13:23:43+00:00", "hash": "a2fb035dadf50d5f", "title_fa": "Zapata Quantum برای ساخت برنامه های کوانتومی به شبکه کوانتومی آی بی ام می پیوندد", "summary_fa": "زاپاتا کوانتوم، یک شرکت نرم‌افزار کوانتومی بوستون، به شبکه کوانتومی آی‌بی‌ام پیوسته است. این شرکت از ماشین های IBM برای ساختن نرم افزار برای مشتریان خود استفاده خواهد کرد. زاپاتا سخت افزار کوانتومی نمی سازد. در عوض، به سازمان‌ها کمک می‌کند تا بفهمند رایانه‌های کوانتومی چه مشکلاتی را می‌توانند حل کنند، سپس نرم‌افزاری را برای انجام این کار ایجاد می‌کنند. می‌گوید سخت‌افزار [ ] این داستان در The Next Web ادامه دارد: «پیشرفت سریع IBM در مسیر محاسبات کوانتومی تحمل‌پذیر خطا، شکاف برنامه‌های کوانتومی را به تمرکز بیشتری وارد می‌کند.» سومیت کاپور، مدیر اجرایی Zapata گفت. IBM قصد دارد تا سال 2029 اولین رایانه کوانتومی مقاوم به خطا خود را ارائه دهد، رایانه‌ای که می‌تواند خطاهای خود را اصلاح کند. جانی اولسون، یکی از بنیان‌گذاران و معاون استراتژی Zapata، گفت که ماشین‌های ابررسانای IBM برای مشتریان جذاب هستند زیرا سریع کار می‌کنند. جانی اولسون گفت: «پیوستن به شبکه کوانتومی آی‌بی‌ام به ما امکان می‌دهد فرصت‌های ارزشمندی را برای سازمان‌هایی که به سریع‌ترین سیستم‌ها نیاز دارند شناسایی کنیم و سپس آن سازمان‌ها را برای لحظه‌ای که کوانتوم به آنها بازگشت سرمایه واقعی می‌دهد، آماده کنیم.» این دو شرکت قبلا با هم کار کرده اند. در یک مطالعه بیوتکنولوژی طبیعت در سال 2025، زاپاتا بخشی از کار خود را روی سخت‌افزار IBM انجام داد و داروهای احتمالی را با هدف KRAS، پروتئینی که با چندین سرطان مرتبط است، پیدا کرد. دانشمندان هر دو شرکت همچنین مقاله ای در مورد استفاده از یک تراشه کوانتومی برای فاکتور اعداد نوشتند. آنچه زاپاتا می‌آموزد به Quantum Pilot، ابزاری که به شرکت‌ها کمک می‌کند تا پروژه‌های مناسب را انتخاب و بسازند، تغذیه می‌شود. برای اجرا بر روی سخت افزار هر سازنده ساخته شده است. این قرارداد یک سال پس از بازگشت زاپاتا انجام می شود. این شرکت که در سال 2017 از هاروارد خارج شد، در"}, {"source": "The Next Web", "title": "9 best requirements management tools for functional safety (IEC 61508)", "link": "https://thenextweb.com/news/best-requirements-management-tools-functional-safety-iec-61508", "summary": "The best requirements management tools for functional safety all protect one thing: the chain of evidence behind a safety case. It runs from a hazard, through the safety requirement that mitigates it, into the design that implements it, and out to the test that proves the design works. Break one link and an assessor stops [ ] This story continues at The Next Web", "date_str": "2026-10-06T13:02:24+00:00", "hash": "24968c9736fe32ac", "title_fa": "9 بهترین ابزار مدیریت الزامات برای ایمنی عملکردی (IEC 61508)", "summary_fa": "بهترین ابزارهای مدیریت نیازمندی‌ها برای ایمنی عملکردی، همگی از یک چیز محافظت می‌کنند: زنجیره شواهد پشت یک کیس ایمنی. از یک خطر، از طریق الزامات ایمنی که آن را کاهش می‌دهد، به طرحی که آن را اجرا می‌کند و تا آزمایشی که کارکرد طراحی را ثابت می‌کند، حرکت می‌کند. یک پیوند را قطع کنید و یک ارزیاب متوقف می شود [ ] این داستان در ساختمان وب بعدی ادامه دارد که یک بار زنجیره قابل مدیریت است. دست نخورده نگه داشتن آن در طول ماه‌ها تغییر طراحی، و سپس اثبات آن به یک نهاد گواهی که انتظار دارد هر پیوندی حفظ شود، جایی است که تیم‌ها درگیر آن هستند. این ابزارها برای حفظ اعتبار آن زنجیره در حال تغییر وجود دارند. آنها الزامات ایمنی را به خطرات و راستی‌آزمایی گره می‌زنند، علامت‌گذاری می‌کنند که وقتی چیزی در بالادست حرکت می‌کند، چه چیزی نیاز به بررسی مجدد دارد، و رکوردی را که ارزیابی IEC 61508 درخواست می‌کند، ایجاد می‌کند. ابزارهای اداری عمومی و ردیاب‌های موضوع می‌توانند متن یک الزام را در خود نگه دارند، اما هیچ‌کدام از آنها نمی‌توانند ثابت کنند که ردیابی از سه ویرایش گذشته باقی مانده است. بخش‌های زیر آنچه را که IEC 61508 از یک فرآیند الزامی می‌پرسد، توضیح می‌دهد، سپس نه ابزار ساخته شده برای مهندسی ایمنی حیاتی را مقایسه می‌کند. IEC 61508 استاندارد ایمنی عملکردی مادر برای سیستم های الکتریکی، الکترونیکی و قابل برنامه ریزی است. استانداردهای بخش آن بیشتر کارهای صنعتی را شکل می دهد: IEC 62061 برای ماشین آلات، IEC 61511 برای کارخانه های فرآیند، EN 50128 برای نرم افزار راه آهن، و ISO 26262 برای وسایل نقلیه جاده ای. ISO 13849 برای ماشین آلات و ISO 10218 برای ربات های صنعتی استانداردهای جداگانه ای هستند که در کنار آن قرار دارند. استانداردهای بخش یک ستون فقرات مشترک دارند، بنابراین ابزاری که با"}, {"source": "The Next Web", "title": "Uber to buy ezCater for $2.3bn to bring workplace catering to Uber Eats", "link": "https://thenextweb.com/news/uber-ezcater-2-3bn-catering-uber-eats", "summary": "Uber has agreed to buy ezCater, a US platform for workplace catering, for $2.3bn in cash. Uber and ezCater announced the deal in a joint statement on Tuesday. The purchase brings ezCater’s catering orders to Uber Eats and to Uber for Business, Uber’s service for company accounts. Boston-based ezCater lets businesses order food for meetings, [ ] This story continues at The Next Web", "date_str": "2026-10-06T13:01:08+00:00", "hash": "549de30ac6532b41", "title_fa": "اوبر برای آوردن غذای محل کار به Uber Eats، ezCater را به قیمت 2.3 میلیارد دلار خریداری می کند", "summary_fa": "اوبر با خرید ezCater، یک پلت فرم ایالات متحده برای پذیرایی در محل کار، به مبلغ 2.3 میلیارد دلار به صورت نقدی موافقت کرده است. اوبر و ezCater روز سه شنبه در بیانیه ای مشترک این معامله را اعلام کردند. این خرید، سفارش‌های پذیرایی EzCater را به Uber Eats و Uber for Business، سرویس Uber برای حساب‌های شرکت، می‌آورد. EzCater مستقر در بوستون به کسب و کارها اجازه می دهد برای جلسات سفارش غذا بدهند، [ ] این داستان در The Next Web ادامه دارد: «کترینگ یک تجارت بزرگ است و می تواند یک جریان درآمدی عظیم برای رستوران ها باشد،» دارا خسروشاهی، مدیر اجرایی Uber. او گفت: «با دسترسی Uber، ما می‌توانیم این تجربه را برای میلیون‌ها مشتری دیگر به ارمغان بیاوریم و به رستوران‌ها کمک کنیم تا سفارش‌های ارزشمند بیشتری را دریافت کنند.» اوبر گفت رستوران‌ها از طریق این معامله سفارش‌های بزرگ‌تر و غذاخوری‌های جدید دریافت می‌کنند. مشتریان می توانند غذای گروهی را ساده تر سفارش دهند، از وعده های غذایی در محل کار گرفته تا رویدادها و گردهمایی های اجتماعی. این شرکت گفت که پیک‌های Uber Eats «فرصت‌های جدید جذابی برای کسب درآمد خواهند داشت». نیهاد رحمان، مدیر اجرایی ezCater گفت: «ما از پیوستن به نیروها با اوبر هیجان زده هستیم. ما انرژی داریم تا تخصص خود را در زمینه پذیرایی و B2B به اکوسیستم جهانی مشتریان، بازرگانان و پیک‌های Uber بیاوریم.» انتظار می‌رود این معامله در ماه‌های آینده بسته شود، مشروط به تاییدیه‌های نظارتی و سایر شرایط بسته شدن. J.P. Morgan به Uber مشاوره می دهد و Evercore به ezCater مشاوره می دهد. بلومبرگ گزارش داد تحویل غذا تقریباً نیمی از رزروهای ناخالص اوبر را تشکیل می دهد و سریعتر از تجارت سواری آن رشد کرده است. ناتالی لونگ نوشت که این خرید همچنین به اوبر کمک می کند تا با DoorDash، بزرگترین پلت فرم تحویل"}, {"source": "The Next Web", "title": "Tango communities go live for breast cancer research", "link": "https://thenextweb.com/news/tango-communities-live-breast-cancer-research", "summary": "Mountain View, California, October 5, 2026, TechnologyWire This Breast Cancer Awareness Month, live-streaming platform Tango is bringing together some of its leading creator communities to raise funds for breast cancer research and, just as importantly, encourage more open conversation around a disease that affects millions of women and families worldwide. From October 13-18, several of [ ] This story continues at The Next Web", "date_str": "2026-10-06T13:00:49+00:00", "hash": "84c7518d585c4106", "title_fa": "جوامع تانگو برای تحقیقات سرطان سینه فعال هستند", "summary_fa": "Mountain View، کالیفرنیا، 5 اکتبر 2026، TechnologyWire در این ماه آگاهی از سرطان سینه، پلتفرم پخش زنده تانگو، برخی از جوامع سازنده پیشرو خود را گرد هم می‌آورد تا برای تحقیقات سرطان پستان کمک مالی جمع‌آوری کند و به همان اندازه مهم، گفتگوی بازتر را در مورد بیماری که میلیون‌ها زن و خانواده را در سراسر جهان تحت تأثیر قرار می‌دهد تشویق کند. از 13 تا 18 اکتبر، چندین مورد از [ ] این داستان در The Next Web در طول جریان‌های تعیین‌شده در طول هفته ادامه می‌یابد، جوامع شرکت‌کننده 20 درصد از ارزش هدیه خود را به تحقیقات سرطان سینه اختصاص می‌دهند، و تانگو سه برابر هر چیزی را که افزایش می‌دهند، اضافه می‌کند. اما این ابتکار فراتر از جمع آوری کمک خواهد بود. سازندگان شرکت‌کننده از جریان‌های خود برای صحبت در مورد سرطان سینه، از جمله به اشتراک گذاشتن تأثیر این بیماری بر زندگی، خانواده یا جوامع خود استفاده خواهند کرد. هدف تانگو با آوردن این مکالمات به محیط زنده، کمک به حفظ آگاهی در مورد سرطان سینه، پیشگیری و تشخیص زودهنگام در بین سازندگان و کاربران است. خانواده‌های تانگو جوامعی هستند که توسط سازندگان بر اساس تعامل مداوم بر روی پلتفرم ساخته شده‌اند. اعضا با هم جریان می‌یابند، از یکدیگر حمایت می‌کنند و با مخاطبانی که مرتباً برمی‌گردند روابط برقرار می‌کنند. در طول این ابتکار، خانواده‌های مختلف، متشکل از ده‌ها سازنده، فعالیت را در روزهای مختلف هدایت می‌کنند و جریان‌های شرکت‌کننده در سراسر تانگو دیده می‌شوند. Yaniv Schwartz، EVP Creators Ecosystem Platform Business در Tango گفت: «برای ما، این یک امتیاز است که بتوانیم از این پلتفرم برای حمایت از چنین هدفی استفاده کنیم. اکثر سازندگان تانگو زن هستند، که این ابتکار را به ویژه برای جامعه ما معنادار می کند. ما می‌خواهیم از اکتبر نه تنها برای کمک مالی استفاده کنیم، بلکه به سازندگان فضایی بدهیم"}, {"source": "The Next Web", "title": "Europe’s Mistral launches Large 4 to challenge China’s lead in open AI models", "link": "https://thenextweb.com/news/mistral-releases-large-4-a-1-trillion-parameter-open-weight-ai-model", "summary": "Mistral has released a preview of Mistral Large 4, a 1T model that the P
