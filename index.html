<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجله خبری روزانه — ۹ آبان ۱۴۰۵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
    }
    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {
      color: var(--text-muted);
      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    .news-category-badge {
      display: inline-flex;
      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-category-badge:hover {
      background: var(--primary);
      color: #0f172a;
      transform: translateY(-1px);
    }
    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .news-tag-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 1px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);
    }
    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;
    }
    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-actions">
        <button class="btn-action" id="themeBtn" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span>
          <span id="themeText">حالت روشن</span>
        </button>
        <button class="btn-action" onclick="toggleArchiveModal(true)">
          <span>📚</span>
          <span>آرشیو شماره‌ها</span>
        </button>
      </div>

      <h1>📰 مجله خبری روزانه</h1>
      <div class="meta-bar">
        <span class="meta-tag">📅 ۹ آبان ۱۴۰۵</span>
        <span class="meta-tag">🌍 ۳۱ October ۲۰۲۶</span>
        <span class="meta-tag">⏰ ساعت انتشار: ۱۹:۳۰</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جست‌وجو در تمام اخبار امروز...">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('persian', this)">
        🇮🇷 عمومی
        <span class="badge" id="badge-persian">۲۰</span>
      </button>
      <button class="tab-btn" onclick="switchTab('tech', this)">
        🤖 تکنولوژی
        <span class="badge" id="badge-tech">۳۷</span>
      </button>
      <button class="tab-btn" onclick="switchTab('media', this)">
        🎬 مدیا
        <span class="badge" id="badge-media">۴۳</span>
      </button>
    </div>

    <main id="newsContainer" class="news-grid"></main>
  </div>

  <div class="modal-overlay" id="archiveModal" onclick="if(event.target===this) toggleArchiveModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 آرشیو شماره‌های قبلی مجله</div>
        <button class="btn-close" onclick="toggleArchiveModal(false)">&times;</button>
      </div>
      <div class="modal-body" id="archiveListContainer"></div>
    </div>
  </div>

ز آن نشد که مقام‌های روسیه در سال ۲۰۲۳ او را در فهرست «عوامل خارجی» قرار دهند. مقام‌های روسیه اغلب از این اصطلاح برای محدود و مجازات کردن منتقدان از آن استفاده می‌کنند. از زمان تأسیس این روزنامه در سال ۱۹۹۳، چند روزنامه‌نگاران آن پس از انتشار مطالب انتقادی درباره مقام‌های دولتی به قتل رسیده‌اند و اخیرا هم برخی از آنها در فهرست «عوامل خارجی» قرار گرفتند. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. آنا پولیتکوفسکایا، از جمله این روزنامه‌نگاران بود که ۲۰ سال پیش در راه‌پله ساختمان محل سکونتش هدف گلوله قرار گرفت و کشته شد. جنگ‌های چچن از جمله موضوعاتی بود که او درباره‌اش گزارش تهیه کرده بود.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/6918/live/5109c2f0-d45c-11f1-ab12-eb0c94f5b382.jpg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۸ آبان • ۱۸:۱۲"}, {"source": "Iran International", "title": "ابهام در چشم‌انداز سیاسی اسرائیل؛ دولت وحدت ملی، ائتلاف با احزاب عرب یا انتخابات دوباره؟", "link": "https://www.iranintl.com/202610304933", "summary": "با روشن شدن نتایج انتخابات اسرائیل، مسیر تشکیل دولت همچنان مبهم است و در حالی که هیچ‌یک از دو اردوگاه اصلی اکثریت لازم را ندارند، گمانه‌زنی‌ها درباره گزینه‌هایی چون تشکیل دولت وحدت ملی، ائتلاف با مشارکت احزاب عرب و برگزاری انتخابات مجدد بالا گرفته است.", "date_str": "2026-10-30T14:17:02+00:00", "hash": "4f934c5899357246", "title_fa": "ابهام در چشم‌انداز سیاسی اسرائیل؛ دولت وحدت ملی، ائتلاف با احزاب عرب یا انتخابات دوباره؟", "summary_fa": "با روشن شدن نتایج انتخابات اسرائیل، مسیر تشکیل دولت همچنان مبهم است و در حالی که هیچ‌یک از دو اردوگاه اصلی اکثریت لازم را ندارند، گمانه‌زنی‌ها درباره گزینه‌هایی چون تشکیل دولت وحدت ملی، ائتلاف با مشارکت احزاب عرب و برگزاری انتخابات مجدد بالا گرفته است.", "image_url": "", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۸ آبان • ۱۷:۴۷"}],

ای خود را به راحتی از آیفون پاک کنید. iOS در بالای لیست مخاطبین به شما درخواستی را نشان می دهد که به شما امکان می دهد مخاطبین تکراری را به راحتی حذف کنید. همین ویژگی در نسخه مک مخاطبین پنهان است. برای امتحان کردن آن، Contacts را در Mac باز کنید و منوی Card را در بالای صفحه انتخاب کنید. سپس، روی جستجوی موارد تکراری کلیک کنید. با این کار مخاطبین تکراری برای شما شناسایی می شوند و می توانید به سرعت آنها را ادغام یا حذف کنید. ژست کشیدن دو انگشت را برای انتخاب چندین مخاطب امتحان کنید. وقتی از برنامه", "image_url": "https://lifehacker.com/imagery/articles/01M618B9KBGHVJH2XCGVBT4GGX/hero-image.fill.size_1200x675.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "امنیت سایبری", "تراشه"], "datetime_fa": "۸ آبان • ۱۹:۰۰"}, {"source": "TechCrunch AI", "title": "Skip the small talk: Make game-changing connections at TechCrunch Founder Summit with Braindate", "link": "https://techcrunch.com/2026/10/30/skip-the-small-talk-make-game-changing-connections-at-techcrunch-founder-summit-with-braindate/", "summary": "At TechCrunch Founder Summit 2026, happening November 4 at SoWa Power Station in Boston, networking powered by Braindate is designed to make those conversations easier to find, whether they are in 1:1 or small-group on-site meetings. Register before the event starts to save up to $100 on your pass, plus get a second for free.", "date_str": "2026-10-30T14:00:00+00:00", "hash": "00325cd42bb9d17b", "title_fa": "از صحبت‌های کوچک بگذرید: با Braindate در TechCrunch Founder Summit ارتباطاتی ایجاد کنید که بازی را تغییر دهد.", "summary_fa": "بهترین ارتباطی که در یک رویداد برقرار می کنید، همیشه کسی نیست که در صف قهوه در کنار شما ایستاده است. گاهی اوقات این بنیانگذار است که قبلاً مشکل بیدار نگه داشتن شما را در شب حل کرده است. سرمایه‌گذاری که می‌تواند طرز فکر شما در مورد دور بعدی خود را به چالش بکشد. یا اپراتوری که به طور مستقیم یاد گرفته است که وقتی یک شرکت خیلی سریع مقیاس می گیرد چه اتفاقی می افتد. At TechCrunch Founder Summit 2026 , happening November 4 at SoWa Power Station in Boston, networking powered by Braindate is designed to make those conversations easier to find, whether they are in 1:1 or small-group on-site meetings. The only way to make these game-changing connections is at Founder Summit. Grab your pass, plus get a second pass for free. The Founder Summit Networking Lounge gives attendees the opportunity to schedule one-on-one or small-group Braindates throughout the day. به‌جای اینکه امیدوار باشید با فرد مناسب برخورد کنید، Braindate به شما این امکان را می‌دهد تا پیرامون موضوعاتی که واقعاً می‌خواهید درباره آن بحث کنید، ارتباط برقرار کنید. چالش بیاور چیزی را که آموخته اید به اشتراک بگذارید. دیدگاه را بخواهید خود را ارائه دهید. چه بخواهید استراتژی‌های جمع‌آوری سرمایه را با هم مقایسه کنید، از طریق چالش‌های استخدام صحبت کنید، درس‌هایی را در مورد تناسب محصول با بازار عوض کنید، دیدگاه بنیان‌گذار دیگری را در مورد فروش سازمانی دریافت کنید، یا به سادگی با افرادی که در بوستون و فراتر از آن ساخته می‌شوند ملاقات کنید، گفتگو با آنچه برای شما مهم است شروع می‌شود. Founder Summit بر اساس سؤالاتی ساخته شده است که بنیانگذاران قبلاً می پرسند: چگونه می دانید که چه زمانی آماده مقیاس گذاری هستید؟ چگونه تیم قوی تری بسازید؟ چه چیزی باعث می شود سرمایه گذاران در جلسه بعدی شرکت کنند؟", "image_url": "https://techcrunch.com/wp-content/uploads/2025/03/Early-Stage-2024-networking-1.jpg?resize=1200,800", "category": "هوش مصنوعی مولد", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۸ آبان • ۱۷:۳۰"}, {"source": "The Guardian AI", "title": "Ghost in the machine: how AI is haunting the search for the supernatural", "link": "https://www.theguardian.com/technology/ng-interactive/2026/oct/30/ai-ghost-hunting", "summary": "Ghost hunting has changed in recent years due to AI chatbots, and paranormal enthusiasts are concerned Ghost hunting is a tech-heavy pursuit. When Amy Waine and Jarrad Cutting investigate haunted locations, they’re loaded up with software of their own design, such as an app that assigns signals from a phone’s sensors to different words in a database. In the age of ChatGPT, the ghost-hunting pair is probing the world of AI. They describe one of their latest inventions, an app called GhostTube Seer , as “the world’s first AI Ghost Hunting tool”. In the hands of paranormal investigators, scientific tools like EMF meters (used to detect electromagnetic fields) are repurposed to identify changes and anomalies that they believe indicate supernatural activity. Seer is, in many ways, simply an expansion of that practice, another way to scan an empty room and believe that something may be there. The app, which requires a paid monthly subscription, has more than 1m downloads, according to its Google Play store listing . But for others in the ghost hunting world, AI is an unwelcome presence. Since the release of ChatGPT in 2022, AI-generated ghost stories and images of the supernatural have flooded online spaces, so much so that popular forums like the r/ nosleep subreddit , meant for scary stories, have implemented a strict policy against AI-generated material. Continue reading...", "date_str": "2026-10-30T15:00:16+00:00", "hash": "985962984eaab189", "title_fa": "روح در ماشین: چگونه هوش مصنوعی در جستجوی ماوراء طبیعی است", "summary_fa": "شکار ارواح در سال های اخیر به دلیل چت ربات های هوش مصنوعی تغییر کرده است و علاقه مندان به ماوراء الطبیعه نگران هستند که شکار ارواح یک تعقیب فناوری سنگین است. هنگامی که امی وین و جاراد کاتینگ مکان‌های خالی از سکنه را بررسی می‌کنند، با نرم‌افزاری با طراحی خودشان بارگذاری می‌شوند، مانند برنامه‌ای که سیگنال‌های حسگرهای تلفن را به کلمات مختلف در پایگاه داده اختصاص می‌دهد. در عصر ChatGPT، جفت شکار ارواح در حال بررسی دنیای هوش مصنوعی هستند. آنها یکی از آخرین اختراعات خود، اپلیکیشنی به نام GhostTube Seer را به عنوان «اولین ابزار شکار ارواح هوش مصنوعی در جهان» توصیف می کنند. در دست محققان ماوراء الطبیعه، ابزارهای علمی مانند EMF متر (که برای تشخیص میدان های الکترومغناطیسی استفاده می شود) برای شناسایی تغییرات و ناهنجاری هایی که به عقیده آنها نشان دهنده فعالیت ماوراء طبیعی است، تغییر کاربری داده می شوند. Seer از بسیاری جهات صرفاً گسترش آن عمل است، راه دیگری برای اسکن یک اتاق خالی و باور اینکه ممکن است چیزی آنجا باشد. طبق فهرست فروشگاه Google Play، این برنامه که به اشتراک ماهانه پولی نیاز دارد، بیش از 1 میلیون دانلود دارد. اما برای دیگران در دنیای شکار ارواح، هوش مصنوعی یک حضور ناخواسته است. از زمان انتشار ChatGPT در سال 2022، داستان‌های ارواح و تصاویر ماوراء الطبیعه تولید شده توسط هوش مصنوعی فضاهای آنلاین را پر کرده است، به طوری که انجمن‌های محبوبی مانند r/nosleep subreddit که برای داستان‌های ترسناک طراحی شده است، سیاست سخت‌گیرانه‌ای را علیه مطالب تولید شده توسط هوش مصنوعی اعمال کرده‌اند. به خواندن ادامه دهید... Waine و Cutting ادعا می‌کنند که اپلیکیشن آن‌ها می‌تواند با استفاده از سیگنال‌های مغناطیس‌سنج داخلی تلفن، تصاویری را تولید کند که ماوراءالطبیعه را به تصویر می‌کشد، کلمات و عبارات موجود در آن سیگنال‌ها را شناسایی کرده و سپس آنها را از طریق", "image_url": "https://i.guim.co.uk/img/media/1d39796c4dc7d5a873ed01119d02771c61581e07/414_0_1885_1508/master/1885.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctZGVmYXVsdC5wbmc&enable=upscale&s=940e1e976c2901c34dcfb9cd3adf1600", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Google"], "datetime_fa": "۸ آبان • ۱۸:۳۰"}, {"source": "The Guardian AI", "title": "Reader Q&A: How can we radically change the way we live? Ask Aditya Chakrabortty", "link": "https://www.theguardian.com/community/live/2026/oct/29/reader-qa-aditya-chakrabortty-answers-your-questions", "summary": "Guardian columnist, senior economics commentator and host of the new Radical Thinking podcast Aditya Chakrabortty is answering your questions on the big ideas around economics, society and democracy, and his new podcast Send your questions to conversations@theguardian.com or join the discussion on Friday from 8am Perspectiverox asks : The government has an enormous amount riding on AI to deliver future economic growth. Do you think this strategy will work? And is the government’s heavy investment in this vision, and its apparent determination to pursue it, contributing to a failure to properly acknowledge or address serious public concerns about the environment and jobs? More fundamentally, what happens if the anticipated AI-driven growth doesn’t materialise? Is there a Plan B? Aditya says: In their book When Nothing Works, the Foundational Economy collective of economists and analysts point out that after decades of successive governments in the UK talking up the ‘knowledge economy’, technology accounted for less than 5% of GDP. That wasn’t just a British failure – the story is same across much of Europe. This is before we get intot who benefits from AI. I find the slavering of the UK’s politicians and press before America’s AI oligarchy vulgar and idiotic, especially when all the indications are that these trade deals work against the interest of Britons. Continue reading...", "date_str": "2026-10-30T14:58:26+00:00", "hash": "57563ab5127d3157", "title_fa": "پرسش و پاسخ خواننده: چگونه می توانیم شیوه زندگی خود را به طور اساسی تغییر دهیم؟ از آدیتیا چاکرابورتی بپرسید", "summary_fa": "ستون نویس گاردین، مفسر ارشد اقتصاد و مجری پادکست جدید تفکر رادیکال، آدیتیا چاکرابورتی به سؤالات شما در مورد ایده های بزرگ پیرامون اقتصاد، جامعه و دموکراسی پاسخ می دهد، و پادکست جدید او سؤالات خود را به گفتگوی@theguardian.com ارسال کنید یا در روز جمعه از ساعت 8 صبح به بحث بپیوندید. به نظر شما این استراتژی جواب می دهد؟ و آیا سرمایه گذاری سنگین دولت در این چشم انداز، و عزم ظاهری آن برای پیگیری آن، به عدم شناخت صحیح یا رسیدگی به نگرانی های جدی عمومی در مورد محیط زیست و مشاغل کمک می کند؟ به طور اساسی‌تر، اگر رشد پیش‌بینی‌شده مبتنی بر هوش مصنوعی محقق نشود، چه اتفاقی می‌افتد؟ آیا طرح B وجود دارد؟ آدیتیا می‌گوید: گروه اقتصاد بنیادی متشکل از اقتصاددانان و تحلیل‌گران در کتاب خود وقتی هیچ کار نمی‌کند اشاره می‌کند که پس از دهه‌ها صحبت از «اقتصاد دانش» توسط دولت‌های متوالی در بریتانیا، فن ‌ی علمی در درک دستاوردهای جدید، جریان ارائه‌ی نتایج ریاضی حاصل از هوش مصنوعی متوقف نخواهد شد. سم آلتمن با ابراز هم‌دردی با ریاضیدانان، تأکید کرد کشفیات بسیار بیشتری در مخزن دستاوردهای این مجموعه وجود دارد که در آینده منتشر خواهند شد. اظهارات تازه در یکی از قسمت‌های پادکست Cheeky Pint مطرح شده است. مدیرعامل اوپن‌ای‌آی می‌گوید: «فکر می‌کنم در مجموع، جهان شایسته‌ی درک چگونگی کارکرد کیهان است؛ اما من با شیوه‌ی کار هم‌دردی می‌کنم.» آلتمن معتقد است حق جامعه برای دستیابی به دانش بنیادی جدید بر آشفتگی‌های ایجادشده ارجحیت دارد، هرچند شیوه‌ی ارتباطی مجموعه متبوعش نیازمند بازنگری و بهبود است. آلتمن می‌گوید «من در این زمینه کاملا صریح هستم: بشریت سزاوار دانش بنیادین است و نباید روی یک کشف بزرگ در علوم پایه دست نگاه داریم. جهان شایسته‌ی آن است.» جامعه‌ی ریاضیات انتقادات شدیدی را نسبت‌به نحوه‌ی اعلان یافته‌ها، ارجاع ناکافی و عدم اعتبارسنجی دقیق مطرح کرده‌اند. در یک ماه اخیر، صدها نتیجه‌ی ریاضی بدون توضیحات کافی عرضه شده و بار راستی‌آزمایی را به دوش پژوهشگران انداخته است. در عین حال، انتشار نیافتن جزئیات مربوط به دستاورد نظریه‌ی Yang-Mills، انتقاداتی درباره‌ی دسترسی انحصاری و خودداری از انتشار عمومی اطلاعات مهم ایجاد کرده است. سم آلتمن در پاسخ به این پرسش که آیا کشفیات فراتر از موارد منتشرشده است، تأیید کرد ذخایر بسیار بیشتری از اثبات‌های ریاضی در اختیار دارند. او اذعان کرد فرایند بررسی مسائل برای مدتی از کنترل خارج شد اما این رویکرد برای آزمودن مرزهای توانمندی مدل‌ها ضرورت داشت. به گفته‌ی آلتمن، صدها میلیون دلار برای حل مسائل علمی صرف شده است که حدود ۱۰ میلیون دلار از این عدد مشخصا به مسئله‌ی مشهور ناویر استوکس", "image_url": "https://api2.zoomit.ir/media/sam-altman-portrait-6ad85151022505c8417e3845?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۸ آبان • ۱۸:۰۵"}, {"source": "Business Insider", "title": "We moved to England to live near my husband's family. After 7 months, we realized we'd made a mistake.", "link": "https://www.businessinsider.com/moved-to-live-near-husbands-family-bad-idea-uk-relocation-2026-10", "summary": "Looking back, I think our move to the United Kingdom may have been overly optimistic. Cara Howlett When we left Canada and moved closer to my husband's family in the UK, I pictured a fun adventure. Our move caused a lot of financial strain, and living near family didn't go the way I expected. After seven months, we returned to Canada. Looking back, I should've been more realistic. I pulled down the extendable ladder covered in cobwebs and dust and watched dead woodlice roll down the steps onto the new carpet in our bedroom. With a deep breath, I willed myself to go up into the attic — a place I hated to go — to retrieve our family's suitcases and duffel bags. We were heading back to Canada, and it was time to start packing. When we had moved to England seven months earlier, I never imagined returning so soon. At first, moving to the UK felt like it could be a grand adventure The idea of leaving Canada behind to try living in the United Kingdom seemed exciting. Cara Howlett Packing up a life in Canada and starting a new one in England had been a herculean endeavor, but I had been excited to do it. For two years leading up to our move to the UK , my husband, two kids (ages 7 and 10), and I had been settled in Alberta, Canada. As much as we enjoyed it, I ached for a new adventure; something different. I didn't feel particularly connected to our community, and our day-to-day lives had felt monotonous for a while. Some of our only reprieves as busy young parents were monthlong summer holidays spent with my husband's family in the bucolic British countryside. We enjoyed these trips so much and looked forward to them for weeks, from planning excursions to castles and museums to researching the best local restaurants and pubs. When we arrived, we loved taking day trips to nearby locales and eating fish and chips by the seaside. I started wondering if living in England would be just as enjoyable and exciting as these monthlong stints. Maybe it'd also satisfy our longing for adventure. Althou neration \" in 1987 through three seasons of \" Star Trek: Picard, \" which concluded in 2023. Of course, that's not the only character Stewart will be remembered for. In 2000, Stewart was cast as Professor Charles Xavier, aka Professor X, the kind, yet complicated, telepathic leader of the X-Men . He went on to play Xavier eight more times in the X-Men series. He reprised the role for what will now be the final time in \"Avengers: Doomsday,\" which is set for release in December. In addition to Picard and Xavier, Stewart was a prolific theater actor and was knighted by the Queen in 2010 for his services to drama. He was a Shakespeare devotee, as a member of the Royal Shakespeare Company from 1966 to 1982. He also kept many of us sane during the pandemic by reading one of Shakespeare's 154 sonnets a day and posting them on Instagram. Here's a look back at his 60-year career, onstage and on screen. Before Patrick Stewart was on TV or in movies, he was a stage actor. Patrick Stewart, who is starring as Launce in The Royal Shakespeare Company s production of The Two Gentlemen of Verona, with Blackie, a dog rescued in Leamington Spa by the Avon Dog Rescue Service, Blackie was immediately cast for the role of Crab, who has an important relationship in the play with Launce, 21st December 1970. Malcolm McNeill/Mirrorpix/Getty Images Stewart's first professional acting credit was in 1959 in the play \"Cyrano de Bergerac.\" He then became a member of the Royal Shakespeare Company in 1966. He made his Broadway debut in 1971 in \"A Midsummer Night's Dream.\" He was nominated for five Olivier Awards, winning three. He was also nominated for a Tony and three Drama Desk Awards, winning one. Patrick Stewart poses with his award for best supporting role at the Laurence", "date_str": "2026-10-30T14:04:39+00:00", "hash": "f99957cecf371f9e", "title_fa": "عکس ها حرفه افسانه ای پاتریک استوارت، از شکسپیر تا \"پیشتازان فضا\" را نشان می دهد.", "summary_fa": "پاتریک استوارت در سال 2018. جک n October 30, 2026 in Nanjing, Jiangsu Province of China. VCG/VCG via Getty Images Binance said it was hacked on Friday, impacting $6.3 billion of assets on the exchange. The impact has rippled across crypto and crypto-linked stocks. Binance said it would cover all losses and that users' funds are safe. A massive hack of Binance is sending shockwaves through digital assets and crypto-linked stocks on Friday. Binance, the world's largest crypto exchange, said on Friday that a compromised engineer's laptop may have allowed hackers to gain access to the platform. It said that $6.3 billion of assets were impacted. The news sent crypto prices down across the board, with Bitcoin , Ethereum , Solana all falling at least 4% Friday morning while and BNB, the native crypto of the Binance ecosystem, fell 6.5%. Crypto-linked stocks were also pulled down. Bitcoin's drop to around $76,700 puts it at its lowest level in a month. \"The market is currently undergoing a crucial test of buyer sentiment,\" said Alex Kuptsikevich, chief market analyst at FxPro. \"In theory, we could see a wave of sell-offs due to a reassessment of risks facing the sector.\" As of Friday morning, more than $3 billion in crypto assets are currently frozen on-chain as the company maneuvers quickly to cover the damage caused by the hack. The largest crypto theft to date, it is already viewed as one of the most significant financial heists on record. The most recent similarly sized hack occurred in February 2025, when North Korean hackers made off with $1.5 billion in crypto assets from Dubai exchange platform Bybit. The immediate market impact of Friday's cyber attack has been a quick risk-off wave washing over the space. Here are some of the crypto-linked stocks that were impacted by news of the hack: Coinbase : -11.5% Circle Internet Group : -9% Strategy : -10% Riot Platforms : -8.5% Galaxy Digital : -7% Many of the stock losses outpace the declines in bitcoin and other cryptos. Digital security pros also say that more attacks of this magnitude are possible, which could compel investors to move assets off of exchanges or simply exit crypto markets altogether. \"A cyber attack of this level is a matter of if, not when, particularly alongside the rise of AI,\" said Andy Ward, SVP International at Absolute Security. \"Cyber threats are becoming more sophisticated and widespread as ever, and it", "date_str": "2026-10-30T13:58:02+00:00", "hash": "6d339466feb5030c", "title_fa": "چگونه هک بایننس در بازارها از سهام گرفته تا ارزهای دیجیتال موج می زند", "summary_fa": "نانجینگ، چین - 30 اکتبر: در این تصویر تصویری، لوگوی Binance در 30 اکتبر 2026 در نانجینگ، استان جیانگ سو چین بر روی صفحه نمایش گوشی هوشمند نمایش داده می شود. VCG/VCG از طریق Getty Images Binance اعلام کرد که روز جمعه هک شد و بر دارایی‌های 6.3 میلیارد دلاری این صرافی تأثیر گذاشت. این تأثیر در سهام کریپتو و کریپتو پیوند خورده است. بایننس گفت که تمام ضررها را پوشش می دهد و وجوه کاربران امن است. یک هک گسترده بایننس در روز جمعه موج شوک را از طریق دارایی های دیجیتال و سهام مرتبط با رمزارز وارد می کند. بایننس، بزرگترین صرافی رمزارز جهان، روز جمعه گفت که لپ‌تاپ مهندس در معرض خطر ممکن است به هکرها اجازه دسترسی به این پلتفرم را داده باشد. گفته می شود 6.3 میلیارد دلار دارایی تحت تأثیر قرار گرفته است. این خبر قیمت کریپتوها را در سراسر جهان پایین آورد، به طوری که بیت کوین، اتریوم، سولانا همگی حداقل 4 درصد سقوط کردند در حالی که BNB، رمزارز بومی اکوسیستم بایننس، 6.5 درصد سقوط کرد. سهام مرتبط با رمزارز نیز کاهش یافت. کاهش قیمت بیت کوین به حدود 76700 دلار، آن را به پایین ترین سطح خود در یک ماه گذشته می رساند. الکس کوپتسیکویچ، تحلیلگر ارشد بازار در FxPro گفت: «بازار در حال حاضر در حال گذراندن یک آزمون حیاتی از احساسات خریداران است. در تئوری، به دلیل ارزیابی مجدد ریسک‌های پیش روی این بخش، می‌توانیم موجی از فروش را شاهد باشیم.» از صبح جمعه، بیش از 3 میلیارد دلار از دارایی های رمزنگاری شده در حال حاضر در زنجیره مسدود شده است زیرا شرکت به سرعت برای پوشش آسیب های ناشی از هک مانور می دهد. بزرگترین سرقت رمزارز تا به امروز، در حال حاضر به omputing and physical AI business also dropped 5% year-over-year to $8.1 billion, missing estimates. The firm maintained its capex guidance, but warned that it likely wouldn't generate free cash flow in 2027, partly due to capex being \"up strongly,\" chief financial officer Dave Zinsner said on the call with investors. Q3 earnings metric Amazon Intel Earnings per share $1.89 vs. $1.96 expected $0.52 vs. $0.40 expected (adjusted) Revenue $201.94B vs. $202.31B expected $16.51B vs. $16.50B expected The results stoked fresh fears for the AI trade, ramping up scrutiny from investors over the finances of major tech players who are worried that AI investment isn't paying off. The fear is running in both directions: that Big Tech firms are spending too much on AI when the profit potential remains unclear, and that AI investment could soon start to slow, which could spark a series of downstream consequences that will crush suppliers in the industry. \"The AI trade has clearly run into a wall", "date_str": "2026-10-30T13:36:54+00:00", "hash": "d220abb1fef2789b", "title_fa": "نزدک پس از درآمد ناامید آمازون و اینتل سقوط کرد", "summary_fa": "آمازون و اینتل در سه ماهه سوم سود خود را از دست دادند و این نگرانی سرمایه گذاران را در مورد کند شدن تجارت هوش مصنوعی افزایش داد. ANGELA WEISS / AFP از طریق Getty Images آمازون و اینتل پس از ناامید کردن سرمایه‌گذاران با درآمد سه ماهه سوم، دوباره فروش فناوری را آغاز کردند. هر دو غول فناوری گفتند که با وجود جریان نقدی منفی، انتظار دارند در سال 2027 بیشتر روی هوش مصنوعی هزینه کنند. نزدک 100 نزدیک به 3 درصد سقوط کرد و این شاخص را برای یک ماه زیان در مسیر قرار داد. این جمعه دیگری پر از ضررهای کبودی برای تجارت فناوری است. Nasdaq 100 در مسیر ثبت یک هفته بازنده بود زیرا فروش فناوری یک شبه تشدید شد. این ضررها توسط آمازون و اینتل ایجاد شد که پس از ساعت‌ها در روز پنجشنبه سقوط کردند زیرا هر دو غول فناوری سرمایه‌گذاران را با گزارش‌های درآمدی سه‌ماهه سوم خود ناامید کردند و نگرانی‌ها مبنی بر اینکه تجارت هوش مصنوعی به سمت کندی پیش می‌رود، دوباره شعله‌ور شد. آمازون در اوایل صبح تا 7 درصد کاهش یافت زیرا این غول خرده فروشی درآمد هر سهم و درآمدی را که کمتر از انتظارات برای سه ماهه سوم بود گزارش داد. این شرکت همچنین یک جریان نقدی منفی 7.6 میلیارد دلاری را برای سه ماهه دوم متوالی ثبت کرد که به گفته او به دلیل افزایش هزینه های هوش مصنوعی است. اندی جاسی، مدیر عامل شرکت، گفت که این شرکت انتظار دارد تا سال آینده به \"هزینه معنادار بیشتری\" ادامه دهد. در همین حال، سهام اینتل تا 26 درصد کاهش یافت. این سازنده سخت‌افزار رایانه‌ای بر درآمد و درآمد غلبه کرد، اما دستورالعمل‌های ضعیفی را برای سه ماهه چهارم منتشر کرد و پیش‌بینی کرد که بازار رایانه‌های شخصی کاهش یابد که حداقل تا نیمه اول سال 2027 ادامه", "image_url": "https://i.insider.com/6ae48390911659c36c01b82a?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "بورس و طلا"], "datetime_fa": "۸ آبان • ۱۷:۰۶"}, {"source": "Business Insider", "title": "My husband and I live on a sailboat. It isn't cheap, but the perks keep winning us over.", "link": "https://www.businessinsider.com/we-live-on-a-boat-not-as-cheap-as-expected-2026-10", "summary": "Living on a boat full-time is expensive, but so far, it s been worth the costs. Rachel Murphy When my husband and I moved to California, we decided to live on a sailboat . Repairs, maintenance, and docking fees have made the lifestyle more expensive than we expected. The tight quarters can be challenging, but the experience has been great for our marriage. Last year, my husband, Michael, and I bought a sailboat to live on full-time. At the time, we were preparing to move from our home near Louisville, Kentucky, to Santa Barbara , California, where I'd lived for a few years after college. As excited as we were to move to a new state, we weren't prepared for the higher cost of rent, and paying $2,500 a month for a place we wouldn't even own was a hard pill to swallow for two Midwesterners. We knew we couldn't afford to buy a house yet, but still wanted a something we could own outright. I figured there had to be an alternative option. After some thought, I remembered I had previously met a number of people in Santa Barbara who lived aboard boats, and wondered if that would be feasible for us. My husband and I had each been on a handful of sailing trips , and as lifelong outdoorspeople, exploring by ocean was appealing, even though we knew almost nothing about the logistics. Once the idea was planted, we couldn't imagine doing anything else. So far, the experience has been full of ups and downs Our 1975 43-foot sailboat is a beauty, but it needed a lot of repairs. Rachel Murphy After deciding to take this leap, we saved up and consumed every book and YouTube channel about sailing. We even fastened a sailing cleat to the arm of an old chair, and we used that to practice our knots. In September 2025, we bought a 1975 sailboat outright for $40,000 in San Francisco and sailed it down the coast the morning the papers were signed. Our 43-foot boat is a beautiful work of craftsmanship, featuring a well-preserved wooden interior with two bedrooms, two bathrooms, a kitchen, and a desk. But unfortunately, the boat came with an overwhelming amount of work from the start. Along with two bedrooms and two bathrooms, the boat has a desk and a small kitchen. Rachel Murphy The previous owner had left us quite a mess to clean up, leaving every drawer stuffed with old kitchenware and junk. Plus, it needed work, like replacing the rotting main sheet, updating the navigation systems, and cleaning out a mildewed freshwater tank — things we've slowly fixed one at a time. The first ", "date_str": "2026-10-30T13:36:47+00:00", "hash": "12206ced12c2c8cd", "title_fa": "من و شوهرم در یک قایق بادبانی زندگی می کنیم. ارزان نیست، اما مزیت ها ما را به خود جلب می کنند.", "summary_fa": "زندگی تمام وقت در یک قایق گران است، اما تا کنون، ارزش این هزینه ها را داشته است. ریچل مورفی وقتی من و همسرم به کالیفرنیا نقل مکان کردیم، تصمیم گرفتیم در یک قایق بادبانی زندگی کنیم. هزینه‌های تعمیرات، نگهداری و اتصال، سبک زندگی را گران‌ https://www.businessinsider.com/alzheimers-cancer-caregiving-uber-cost-transportation-2026-10", "summary": "Carol Colborn and her husband, William, pay $3 a ride for a paratransit service. Courtesy of Carol Colborn Carol Colborn is a full-time carer to her husband, William, who has Alzheimer's disease. She struggled, especially after being diagnosed with cancer, and the pair was confined to the house. A Medicare benefit designed to help carers and keep their loved ones at home changed all that. This story is based on an interview with Carol Colborn, 77, a retired academic from Mesa, Arizona . It has been edited for length and clarity. My husband, William, and I married in 2008 when I was 60, and he was 65. We both retired and went on an amazing adventure together: RV-ing full time across North America for eight years. We drove to every state in the US, every state in Mexico, and every province in Canada. Then we traveled the world, visiting 29 countries in total. The trips stopped after William was diagnosed with Alzheimer's disease in 2018, so we're glad we built so many happy memories on the road. What is your situation regarding long-term care for yourself or your loved ones? To share your story with a Business Insider reporter, please fill out this quick form . He'd shown symptoms of the illness, mostly forgetfulness. I gave him a shopping list of three items written in large print, and he'd come back with two. We had a ritual: he'd bring me a mug of herbal tea while we watched TV in the evening. It made me calm and serene and helped me sleep better. He'd done it every day since our wedding and, when he forgot the first time, I was distraught. The Colborns didn t want to leave their home and go into assisted living. Courtesy of Carol Colborn William had mild cognitive impairment for the first four years, which progressed into moderately severe Alzheimer's. He needed 24/7 support, and I was his full-time caregiver. He stayed in bed a lot of the time, but I gave him his medication, three meals a day, and baths. I had chemotherapy for lung cancer His mobility was limited, but we still did our evening walks past four houses. It was his main exercise. Things were relatively manageable until July 2025, when I was diagnosed with lung cancer . I had surgery in September and was in the hospital for four days. My daughter and William's daughter stepped up to care for him, but it was a temporary arrangement because they lived in other states. I began chemotherapy and had to juggle my husband's health needs with my own. It was incredibly stressful. Colborn, after comple", "date_str": "2026-10-30T13:35:39+00:00", "hash": "db3e694a92b20d38", "title_fa": "شوهرم آلزایمر دارد و من سرطان دارم. ما 500 دلار در ماه برای سواری های Uber خرج کردیم تا اینکه جایگزین 3 دلاری پیدا کردیم.", "summary_fa": "کارول کولبرن و همسرش، ویلیام، برای یک سرویس ترانزیت سواری 3 دلار می پردازند. با حسن نیت از کارول کولبرن کارول کولبرن یک مراقب تمام وقت از همسرش ویلیام است که به بیماری آلزایمر مبتلا است. او به ویژه پس از تشخیص سرطان، دست و پنجه نرم کرد و این زوج در خانه محبوس شدند. مزایای Medicare که برای کمک به مراقبین و نگه داشتن عزیزانشان در خانه طراحی شده بود، همه اینها را تغییر داد. این داستان بر اساس مصاحبه ای با کارول کولبرن، 77 ساله، دانشگاهی بازنشسته از مسا، آریزونا است. برای طول و وضوح ویرایش شده است. من و شوهرم ویلیام در سال 2008 زمانی که 60 ساله بودم ازدواج کردیم و او 65 ساله بود. ما به هر ایالت در ایالات متحده، هر ایالت در مکزیک و هر استانی در کانادا رانندگی کردیم. سپس به سراسر جهان سفر کردیم و در مجموع از 29 کشور دیدن کردیم. این سفرها پس از تشخیص بیماری آلزایمر ویلیام در سال 2018 متوقف شد، بنابراین ما خوشحالیم که خاطرات خوش بسیاری را در جاده ساختیم. وضعیت شما در مورد مراقبت طولانی مدت از خود یا عزیزانتان چگونه است؟ برای به اشتراک گذاشتن داستان خود با خبرنگار Business Insider، لطفاً این فرم سریع را پر کنید. او علائم بیماری را نشان داده بود، بیشتر فراموشی. من به او یک لیست خرید از سه کالا دادم که با حروف بزرگ نوشته شده بود، و او با دو مورد بازگشت. ما یک م ed-chicago-hotel-review-2025-9", "summary": "Chicago s Palmer House serves the original 1893 brownie recipe it invented for the World s Fair. Kristine Villarroel/Business Insider The original brownie recipe was invented at Chicago's Palmer House hotel in 1893. It was designed to be transported easily in lunchboxes for the Chicago World's Fair. I visited the hotel to try the original brownie, which was rich in both chocolate and history. When you think of vintage desserts , various ingredients suspended in Jell-O might come to mind. But a Chicago hotel serves one 1893 recipe that will be a lot more familiar to today's tastes: the brownie. The Palmer House hotel , which is still open today, developed the first-ever brownie in its kitchen as part of the preparations for the World's Columbian Exposition, or Chicago's 1893 World's Fair. The decadent dessert was inspired by a Gilded Age socialite 's quest for a treat that could be easily transported. As a brownie enthusiast, I wanted to try this legendary recipe on a visit to the hotel last year — and I discovered the dessert was rich in both history and chocolate. The Palmer House Hotel became a symbol of the city s resilience after the Great Chicago Fire. Chicago History Museum/Getty Images When the Great Chicago Fire of 1871 decimated the city's downtown, the Palmer House hotel had been open for less than a year. Its swift reopening in 1873, when Gilded Age wealth rushed to rebuild the city, became a symbol for a city rising from the ashes. Today, it operates as a Hilton hotel. The World s Fair came to the city in 1893 to celebrate its grand rebuilding. Chicago History Museum/Getty Images Beyond boosting the local economy, Chicago leaders hoped the event would show the world that the growing city had fully recovered from the 1871 fire. The fair, which was held from May until October 1893, showcased international developments in technology, art, and transportation on the 400th anniversary of Christopher Columbus's arriv so large in our cultural consciousness. The thoughtful, erudite performer who had a troubled childhood in working-class Yorkshire; the committed socialist who was eventually knighted by Queen Elizabeth; the advocate who put his money and his considerable voice toward the fights for LGBTQ+ acceptance and animal welfare and against domestic violence, his presence and performances meant the world (the galaxy, even) to myself and so many others. But those who knew him personally can offer better tributes; perhaps it's best left to Shakespeare's Player King, performed by Stewart himself opposite David Warner's Hamlet back in 1965: Where joy most revels, grief doth most lament;Grief joys, joy grieves, on slender accident. Much of Stewart's finest work was on the stage; other performances remain rather shockingly hard to come by (whither I, Claudius ?). Nonetheless, he left a true legacy behind him, well beyond Captain Picard and Professor X. Here are 10 of his most iconic other roles. Jeffrey (1995) A goofy, feel-good gay rom-com with the HIV/AIDS crisis still very much in the foreground, Jeffrey was a near-impossibility in the mid-1990s: a movie that neither villainized its queers nor treated them as pitiable martyrs. Steven Weber and Michael T. Weiss are the leads, joined by a cast that includes Christine Baranski, Victor Garber, Nathan Lane, Olympia Dukakis, and Sigourney Weaver but, for all those names, Stewart is the undeniable standout as Sterling, the irrepressible gay best friend: a swishing, mincing, sassy, high-camp character who steals every scene without ever becoming a caricature. He's the leader of the \"Pink Panthers,\" a squad of queers who defend locals from gay bashers, and that is the key to the character's power: He's as gay as they come, but not ashamed and not even a little weak. This movie, and the presence of Captain Picard himself in it, might have saved my life back in 1995. Stream Jeffrey on Prime Video , Tubi , and The Roku Channel . Jeffrey (1       media: [{"source": "Billboard", "title": "Yami Safdie and Maluma’s ‘Felicidades,’ & More: Vote for the Best New Latin Music Release This Week", "link": "https://www.billboard.com/music/latin/best-new-latin-music-poll-yami-safdie-maluma-daddy-yankee-1236371009/", "summary": "This week, Billboard’s New Music Latin poll — curated with key recommendations by Billboard Latin and Billboard Español editors — features new music including albums by Daddy Yankee (La Postal) and Wow Popy (Mundial) . It also spotlights fiery collaborations such as Los Dos de Tamaulipas and Frontera on Piquito ; Santana and Natalia Lafourcade on Hermano ; and new Latin couple La Joaqui and Tiago PZK on Obsesión,” produced by Ovy on the Drums. Most notably Yami Safdie and Maluma teamed up for the first time on “Felicidades” — a cumbia-pop fusion that celebrates a person who walked out of a toxic relationship. On the catchy collab, both the Argentina songstress and Colombian superstar encourage those who are back on the market to embrace their self-worth and new, single life. “Congratulations on having made the best decision of your life […] because it truly is better to be alone than to live a fake love,” goes the empowering chorus. Daddy Yankee surprised fans with the release of his new studio album La Postal, a 15-track set that includes collaborations with Cardi B, Myke Towers, and Danny Ocean, among others. From pop to bachata to reggaetón, the Puerto Rican artist — who is The Latin Recording Academy’s 2026 Person of the Year — delivers feel-good and romantic songs. “I wanted to tell the real story of love: what we experience, what we feel, and what we often don’t know how to express. A love that isn’t always perfect or fake. A love that is raw and real, with its moments of happiness, its contradictions, its wounds, its goodbyes, and its healing,” the artist said in a press statement. “This album comes from the real experiences we go through in a relationship: true love and true heartbreak, without filters and without pretending. It talks also about the love of family, the discipline of loving yourself and the love that comes from having faith. These are stories I have lived, witnessed and carried with me.” Also dropping new music this week are Emilia and Codiciado. Which release this week do you think is best? Give these new albums a spin and vote for your favorite new Latin music release below. Editor’s Note: The results of the weekly New Music Latin poll will be posted if the poll generates more than 1,000 votes. This poll closes at 11 a.m. ET on Monday (Nov. 2). Take Our Poll Take Our Poll", "date_str": "2026-10-30T16:00:02+00:00", "hash": "26a3f4d513d915b9", "title_fa": "\"Felicidades\" و بیشتر از Yami Safdie و Maluma: برای بهترین نسخه جدید موسیقی لاتین رای دهید این هفته", "summary_fa": "این هفته، نظرسنجی لاتین New Music Billboard - که با توصیه‌های کلیدی توسط ویراستاران Billboard Latin و Billboard Español انجام شده است - دارای موسیقی جدیدی از جمله آلبوم‌های Daddy Yankee (La Postal) و Wow Popy (Mundial) است. همچنین همکاری های آتشینی مانند Los Dos de Tamaulipas و Frontera در Piquito را برجسته می کند. سانتانا و ناتالیا لافورکید در هرمانو. و زوج لاتین جدید La Joaqui و Tiago PZK در Obsesión، تولید شده توسط Ovy on the Drums. مهم‌تر از همه، یامی سافدی و مالوما برای اولین بار در «Felicidades» با یکدیگر همکاری کردند - یک تلفیقی کامبیا-پاپ که فردی را تجلیل می‌کند که از یک رابطه سمی خارج شده است. در این همکاری جذاب، هم خواننده آرژانتینی و هم سوپراستار کلمبیایی، کسانی را که به بازار بازگشته‌اند تشویق می‌کنند تا ارزش خود و زندگی مجردی جدید خود را در آغوش بگیرند. گروه کر قدرتمند می‌گوید: «تبریک می‌گویم که بهترین تصمیم زندگی‌تان را گرفتید […] زیرا واقعاً تنها بودن بهتر از زندگی کردن یک عشق ساختگی است. Daddy Yankee با انتشار آلبوم استودیویی جدید خود La Postal، یک مجموعه 15 آهنگی که شامل همکاری با Cardi B، Myke Towers و Danny Ocean و دیگران است، طرفداران را شگفت زده کرد. از پاپ گرفته تا باچاتا و رگیتون، هنرمند پورتوریکویی - که شخصیت سال 2026 آکادمی ضبط لاتین است - آهنگ‌هایی با احساس خوب و عاشقانه ارائه می‌کند. می‌خواستم داستان واقعی عشق را بگویم: آنچه را که تجربه می‌کنیم، آنچه را که احساس می‌کنیم، و آنچه اغلب نمی‌دانیم چگونه بیان کنیم. عشقی که همیشه کامل یا ساختگی نیست. عشقی خام و واقعی، با لحظات شادی، تناقضات، زخم‌ها، خداحافظی‌ها و التیام‌بخش‌هایش.» این هنرمند در بیانیه‌ای گفت: «این آلبوم برگرفته از تجربیات واقعی است که ما در یک رابطه تجربه می‌کنیم: عشق واقعی و دلشکستگی واقعی، بدون فیلتر و بدون تظاهر. همچنین", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/maluma-yami-safdie-cr-padox-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Olivia Rodrigo Wears Concert Shirt Supporting Dr. Amy Acton for Ohio Governor Amid Ramaswamy Ad Controversy", "link": "https://www.billboard.com/music/music-news/olivia-rodrigo-dr-amy-acton-governor-shirt-ohio-concert-1236370955/", "summary": "Olivia Rodrigo got involved in the Ohio gubernatorial race while stopping in the state s capital Columbus on her Unraveled Tour on Thursday (Oct. 29). Related Olivia Rodrigo Checks Out My Chemical Romance Show as Both Acts Aim High on Billboard 200 Olivia Rodrigo Slams Donald Trump Administration for Picking Fights With Pop Stars Olivia Rodrigo Slams ICE for Using Her Song to Promote Racist, Hateful Propaganda During her set at the Schottenstein Center supporting the Billboard 200 -topping 2026 album You Seem Pretty Sad for a Girl So in Love , the singer donned a white T-shirt that read: Dr. Amy Acton for Governor. As captured in footage from the show, Rodrigo made a point of highlighting the top and giving a thumbs-up to the camera beaming images to the arena s big screens. Acton also took note of the gesture, sharing a photo of Rodrigo s political fashion choice on Instagram and writing, Ohio loves you, @oliviarodrigo ! The pop star s show of support comes with just a few days left until Tuesday s (Nov. 3) midterm election, whic ose to No. 16 on Jan. 8, 1977, launching a string of 41 Gosdin solo entries. Nineteen of them ascended to the top 10 – beginning with the “Hangin’ On” flip side, “Yesterday’s Gone” – and three of those titles reached No. 1: 1984’s “I Can Tell by the Way You Dance (You’re Gonna Love Me Tonight),” 1988’s “Set ‘Em Up Joe” and 1989’s “I’m Still Crazy.” An Alabama native, Gosdin shared the Country Music Association’s song of the year award with Max D. Barnes for the grief-stricken 1989 ballad “Chiseled in Stone,” and saw his top 10 1982 single “Today My World Slipped Away,” co-written with Mark Wright, rise to No. 3 in 1997 after it was covered by George Strait. Gosdin died at age 74 on April 28, 2009.", "date_str": "2026-10-30T15:12:39+00:00", "hash": "de181e0c0867a334", "title_fa": "بازگشت نمودار: در سال 1976، ورن گوسدین اولین آهنگ خود را با نام «On» Hot Country Songs انجام داد.", "summary_fa": "لحن تنها و لحن متمایز ورن گوسدین او را به یکی از هنرمندان بی‌نظیر موسیقی کانتری تبدیل کرد و لقب «صدا» را به خود اختصاص داد. حضور او در نمودارهای بیلبورد زمانی آغاز شد که تک‌آهنگ Elektra او، \"Hangin' On\" در فهرست آهنگ‌های Hot Country در تاریخ 30 اکتبر 1976 قرار گرفت. مربوط به ورن گوسدین، موسیقی کانتری، The Voice، در 74 تالار مشاهیر ترانه سرایان نشویل می میرد. افتخاری ورن گوسدین به عنوان یکی از بهترین های تمام دوران ها یاد می شود. عقب نشینی نمودار: در سال 2011، اولین آلبوم اسکاتی مک کری، او را به عنوان Clear Country Favourite ساخته بود. در سال 1967 به عنوان نیمی از برادران گوسدین، از جمله خواهر و برادر کوچکتر رکس گوسدین. گروه استودیویی آن نسخه شامل دو عضو آینده بیردز، کلارنس وایت و جین پارسونز بود. «Hangin’ On» که توسط بادی مایز و ایرا آلن نوشته شده بود، توسط تهیه‌کننده گری اس. پکستون زنده شد - که همچنین فیلم جدید هالووین بابی «بوریس» پیکت «Monster Mash» را تهیه کرد - و در استیج صدا در نشویل در آوریل 1976 ضبط شد. 1977، راه اندازی رشته ای از 41 مدخل انفرادی Gosdin. 19 نفر از آنها به 10 تای برتر صعود کردند - که با \"Hangin' On\" شروع شد، \"Yesterday's Gone\" - و سه تا از این عناوین به رتبه اول رسیدند. 1: «I Can Tell By Way You Dance» محصول 1984 (امشب دوستم خواهی داشت)، «Set ‘Em Up Joe» محصول 1988 و «I'm Still Crazy» محصول 1989. گوسدین که اهل آلاباما است، جایزه آهنگ سال انجمن موسیقی کانتری را با مکس دی. بارنز برای تصنیف غم‌انگیز «Chiseled in Stone» در سال 1989 به اشتراک گذاشت و 10 تک آهنگ برتر خود در سال 1982 «Today My World Slipped Away» را دید که با همکاری مارک رایت نوشته شده بود و", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Vern-Gosdin-1977-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۸ آبان • ۱۸:۴۲"}, {"source": "Billboard", "title": "Queens of the Stone Age Finds Healing in New Album ‘Perfecth’: ‘What Has Been Shattered is Made More Beautiful by the Act of Repair’", "link": "https://www.billboard.com/music/rock/queens-of-the-stone-new-album-perfecth-interview-1236370959/", "summary": "Queens of The Stone Age turned to kintsugi, the delicate Japanese art of repairing broken pottery by filling the cracks with molten gold, to create its new album, Perfecth . By embracing this Eastern technique, the California band reflects in their new LP on the process they faced following the recent health issues and personal struggles of vocalist Josh Homme, seeking transformation through the act of repair. “What has been shattered is made more beautiful, not less, by the act of repair,” Homme tells Billboard Español in a video interview. “That is why the songs on this album speak about different forms of love — for family, for friends and for other people, whether significant or insignificant. There are bonds that sustain us, and others that end up breaking us. Homme is excited about this new work, the band s ninth album, which led him and his bandmates (also including Troy Van Leeuwen (guitar), Dean Fertita (guitar and keyboards) and Jon Theodore (drums)) to work in different studios, cities and moments, even revisiting songs from previous sessions. Such is the case with fourth single “Run Away From the Mob,” originally recorded in 2013 with close collaborator Dave Grohl on the drums. Or “Sunday,” a track originally co-written by Homme for Iggy Pop’s 2016 album Post Pop Depression , in which the Queens frontman actively participated. Produced by Homme and bassist Michael Shuman, this nine-track LP, released Friday (Oct. 30) through Matador Records, was born from sessions recorded in places from New Orleans to Los Angeles, achieving a production that Homme describes as “very raw, very natural sounding.” I think a lot of these things were played all in a room together with all the band members together, explains the 53-year-old frontman. And so, you want things to sound as if you are sitting in the middle of the room with us. And so, it s very much like the 70s, where it feels like you re sitting in the room. And, so that s kind of the overall sound of this record. The result is a dark, emotional album that goes beyond the band s relentless stoner rock. In just 36 minutes — Queens shortest album to date — tracks such as powerful second single “Insignificant Other,” as well as “Where The Goth Girls At?,” “Mono,” “From The Cliff,” “Easy Street” and “Phantom Limb,” masterfully flirt with genres like art rock, jazz, folk and country blues. Following the surreal experience Homme and his bandmates had in 2024 when they entered the Catacombs of Paris to record", "date_str": "2026-10-30T15:02:48+00:00", "hash": "3ac505017a1356d0", "title_fa": "Queens of the Stone Age در آلبوم جدید «Perfecth» شفا می یابد: «آنچه شکسته شده است با عمل تعمیر زیباتر شده است»", "summary_fa": "Queens of The Stone Age برای ایجاد آلبوم جدید خود، Perfecth، به کینتسوگی، هنر ظریف ژاپنی برای تعمیر سفال های شکسته با پر کردن شکاف ها با طلای مذاب روی آورد. با پذیرش این تکنیک شرقی، گروه کالیفرنیا در LP جدید خود روندی را که به دنبال مشکلات اخیر سلامتی و مبارزات شخصی خواننده جاش هوم، به دنبال دگرگونی از طریق عمل ترمیم با آن مواجه شدند، منعکس می کند. هوم در یک مصاحبه ویدیویی به Billboard Español می‌گوید: «آنچه که شکسته است با تعمیر زیباتر می‌شود، نه کمتر. به همین دلیل است که آهنگ‌های این آلبوم در مورد اشکال مختلف عشق صحبت می‌کنند - برای خانواده، دوستان و برای افراد دیگر، چه مهم یا بی‌اهمیت. هوم در مورد این کار جدید، نهمین آلبوم گروه، هیجان‌زده است، که باعث شد او و هم گروه‌هایش (همچنین از جمله تروی ون لیوون (گیتار)، دین فرتیتا (گیتار و کیبورد) و جان تئودور (درامز)) در استودیوها، شهرها و لحظات مختلف کار کنند، حتی آهنگ‌های جلسات قبلی را مرور کنند. این مورد در مورد چهارمین تک‌آهنگ Run Away From the Mob است که در ابتدا در سال 2013 با همکار نزدیک دیو گرول در درام ضبط شد. یا \"Sunday\"، آهنگی که در اصل توسط هوم برای آلبوم Post Pop Depression ایگی پاپ در سال 2016 نوشته شده بود، که خواننده اصلی کوئینز به طور فعال در آن شرکت داشت. این ال‌پی 9 آهنگی که توسط هوم و نوازنده بیس مایکل شومان تهیه شده است، جمعه (اکتبر) منتشر شد. 30) از طریق Matador Records، از جلسات ضبط شده در مکان هایی از نیواورلئان تا لس آنجلس متولد شد و به تولیدی دست یافت که هوم آن را به عنوان \"صدای بسیار خام و بسیار طبیعی\" توصیف کرد. این خواننده 53 ساله توضیح می دهد که من فکر می کنم بسیاری از این چیزها همه در یک", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/Queens-of-The-Stone-Age-cr-Andreas-Neumann-billboard.1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۸ آبان • ۱۸:۳۲"}, {"source": "Deadline", "title": "Oscar Contender ‘To Hold A Mountain’ To Open In Theaters In December Ahead Of HBO Debut", "link": "https://deadline.com/2026/10/to-hold-a-mountain-theatrical-release-hbo-debut-1237209359/", "summary": "EXCLUSIVE: To Hold a Mountain, the Sundance award-winning documentary that’s a strong contender for Oscar recognition, will soon reach U.S. theaters. Submarine Deluxe announced it will open the film directed by Biljana Tutorov and Petar Glomazić on December 16 at Film Forum in New York, with a national rollout to follow. The documentary – chosen [ ]", "date_str": "2026-10-30T16:00:00+00:00", "hash": "4e31760aa0220174", "ti  از او امضا خواستم و گفتم: «من واقعاً تو را در SNL دوست دارم. و او می‌گوید: «این‌قدر دیر چه کار می‌کنی؟» و من گفتم: «می‌توانم امضای تو را داشته باشم؟» وایل به یاد می‌آورد: «فراموش کن، مرد». من همیشه یک امضا امضا می کنم. هر زمان که یک کودک 9 ساله از من نیاز به امضا داشته باشد، خیلی سریع آن را امضا می کنم. داستان‌های مرتبط، ایین آرمیتاژ، ستاره «شلدون جوان» می‌گوید که از پایان سریال «خوشحال‌ترین» بود: من «به خانه می‌رفتم و تمام روز گریه می‌کردم» ستاره «شلدون جوان» ایین آرمیتاژ می‌گوید که نمایش یک «تعهد بزرگ» بود به‌عنوان هم‌ستاره، تصدیق می‌کند که «کارش را با چه کسی تأیید می‌کند» امی ماه گذشته برای بازی Dr. رابی در سریال The Pitt شبکه HBO، هرگز در کارنامه تلویزیونی طولانی خود مجری SNL نبوده است، اما در یک قسمت در سال 2000 که توسط همبازی اش در ER، جولیانا مارگولیس میزبانی می شد، ظاهر شد. ملاقات با مورفی به وضوح به او چسبید و به یک شوخی درونی با بچه های وایل تبدیل شد. «بنابراین، من این داستان را در خانه‌ام تعریف کرده‌ام و سال گذشته برای تولدم، دخترم نمی‌دانست چه چیزی برایم بیاورد. دختر 10 ساله من عکس ادی مورفی را چاپ کرد و سپس روی آن نوشت: \"نوح عزیز، تو بچه بزرگی هستی، ادی مورفی.\" وایل گفت: \"و من آن را در دفترم قاب کرده ام. این بزرگ‌ترین هدیه‌ای است که دختر 10", "image_url": "https://variety.com/wp-content/uploads/2026/10/World-Premiere-Of-Amazon-MGM-Studios-The-Pickup-Arrivals-Cedars-Sinai-Board-of-Governors-Sunset-Soire-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۸ آبان • ۱۸:۵۱"}, {"source": "Variety", "title": "‘Blindspot Berlin,’ a Beta Film TIFF Standout With ‘All Quiet’ Star Albrecht Schuch, Seals Deal for Spain with Filmin (EXCLUSIVE)", "link": "https://variety.com/2026/tv/global/blindspot-berlin-albrecht-schuch-jeanne-goursaud-filmin-1236935142/", "summary": "“Blindspot Berlin,” a buzzy counter-terror police unit thriller led by “All Quiet on the Western Front” star Albrecht Schuch has been licensed by Beta Film to Spain’s upscale SVOD platform Filmin. Backed by Germany’s ARD, Europe’s biggest public broadcaster as well as rbb, NDR, and HR, “Blindspot Berlin’s” Spanish deal was announced Friday on the [ ]", "date_str": "2026-10-30T15:21:13+00:00", "hash": "3207ab98ae33bb07", "title_fa": "«نقطه کور برلین»، یک فیلم بتا برجسته در TIFF با ستاره «همه آرام» آلبرشت شوخ، قراردادی را برای اسپانیا با فیلمین امضا کرد (انحصاری)", "summary_fa": "«نقطه کور برلین»، یک تریلر پرهیاهو واحد پلیس ضد ترور به رهبری آلبرشت شوخ، ستاره «همه آرام در جبهه غربی» توسط بتا فیلم مجوز پلتفرم SVOD اسپانیایی فیلمین را دریافت کرده است. با حمایت ARD آلمان، بزرگترین پخش کننده عمومی اروپا و همچنین rbb، NDR، و HR، قرارداد اسپانیایی \"Blindspot Berlin\" در روز جمعه در [ ] اعلام شد. در جبهه غربی» ستاره آلبرشت شوخ توسط بتا فیلم مجوز پلتفرم مجلل SVOD فیلمین اسپانیا را دریافت کرده است. با حمایت ARD آلمان، بزرگترین پخش کننده عمومی اروپا و همچنین rbb، NDR، و HR، قرارداد اسپانیایی \"Blindspot Berlin\" روز جمعه در آستانه نمایش سری شش قسمتی در رقابت اصلی در جشنواره بین المللی سریال های جنوبی کادیز اعلام شد. داستان‌های مرتبط، ایین آرمیتاژ، ستاره «شلدون جوان» می‌گوید «خوشحال‌ترین» از پایان سریال بود: «به خانه نمی‌رفتم و تمام روز گریه می‌کردم» ستاره «شلدون جوان» ایین آرمیتاژ می‌گوید که نمایش یک «تعهد بزرگ» بود، زیرا هم‌استار به «خبر می‌رسد» Berlin» در تاریخ 30 اکتبر در سرویس استریم ARD با پخش خطی در 1 و 6 نوامبر راه اندازی می شود. این مجموعه در اوایل سال 2027 در Filmin در دسترس خواهد بود. یک تریلر جنایی واقعی، \"Blindspot Berlin\" که به شدت مورد تحقیق قرار گرفته است، تلاش های پلیس آلمان برای جلوگیری از حمله تروریستی بازار کریسمس در 19 دسامبر 2016 برلین را نشان می دهد که 13 کشته و ده ها زخمی برجای گذاشت.", "image_url": "https://variety.com/wp-content/uploads/2026/09/MixCollage-07-Sep-2026-05-30-PM-8452.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۸ آبان • ۱۸:۵۱"}, {"source": "Billboard", "title": "‘Occupational Hazard’ Rock Doc Details the Untold Story of Jimmy Buffett’s ‘Ragtag,’ Pre-Fame Coral Reefer Band", "link": "https://www.billboard.com/music/rock/occupational-hazard-documentary-jimmy-buffett-1236370741/", "summary": "The Coral Reefer Band is as intrinsically a part of the Jimmy Buffett universe as the E Street Band is to Bruce Springsteen s, the Heartbreakers are to Tom Petty s and so on. But a largely untold portion of the band s story is the focus of the new documentary Occupational Hazard: The First Coral Reefers , which, after a nearly nine-month run in film festivals and theaters, becomes available Oct. 30 for rent via Apple TV, Amazon Prime Video, Google Play and Fandango. As the title indicates, Occupational Hazard is an origin story, from the beginnings of Buffett s career as a troubadour (after a tenure writing for Billboard ) and his move to Key West, Florida, where he assembled the initial Coral Reefer lineup during the mid-70s. (He used the name for an imaginary band during his solo performances before then.) Narrated by actor and Buffett friend Jeff Bridges, it details a decidedly different and significantly less polished ensemble than Parrotheads became used to from the late ‘70s until Buffett s death on Sept. 1, 2023. The portrayal is of a time when the Coral Reefer crew was wasted but not really wasting away, as Buffett registered defining tracks such as Margaritaville, Cheeseburger in Paradise, Volcano, Fins and Son of a Son of a Sailor. We wanted to capture the time before the Parrothead phenomenon began, when it was still rough n ready out on the road director-producer John H. Cunningham tells Billboard via Zoom. Those were wild times; many viewers who are watching this have no idea that period even existed for this band, because they ve seen this very organized, polished group for such a long time,” he says. “But the first years were a little bit different. Some of the band are starting to pass away and disappear without the history being recorded. So just for historical purposes, we thought this was an important time to document. Original Coral Reefer Roger Bartlett, who composed the film s score, readily acknowledges that we were fully staffed with artificial inspiration in great quantities during that time. But the guitarist, who performed with Buffett as an acoustic duo before the band formed, also maintains that the early days were really the best days for other reasons. It was before the bodyguard and before (Buffett) flew on a private plane and had the restaurants and all of that, Bartlett explains. We drove in a Rent-a-Car and raced down the corridors of the airports to get to the plane before the doors closed. We sat in economy class and re", "date_str": "2026-10-30T14:34:35+00:00", "hash": "bc73869e229ab164", "title_fa": "مستند راک «خطر شغلی» داستان ناگفته «راگتاگ» جیمی بافت، پیش از شهرت گروه کرال ریفر را شرح می دهد.", "summary_fa": "گروه Coral Reefer به همان اندازه که گروه E Street برای بروس اسپرینگستین، Heartbreakers برای تام پتی و غیره ذاتاً بخشی از جهان جیمی بافت هستند. اما بخش ناگفته‌ای از داستان گروه، تمرکز مستند جدید Occupational Hazard: The First Coral Reefers است، که پس از تقریباً نه ماه نمایش در جشنواره‌ها و تئاترها، در 30 اکتبر برای اجاره از طریق Apple TV، Amazon Prime Video، Google Play و Fandango در دسترس قرار می‌گیرد. همانطور که عنوان نشان می‌دهد، Occupational Hazard یک داستان منشأ است، از آغاز کار بافت به عنوان یک تروبادور (پس از نوشتن دوره‌ای برای بیلبورد) و نقل مکان او به کی وست، فلوریدا، جایی که او در اواسط دهه 70 ترکیب اولیه Coral Reefer را جمع‌آوری کرد. (او پیش از آن در طول اجراهای انفرادی خود از این نام برای یک گروه تخیلی استفاده می کرد.) که توسط بازیگر و دوست بافت، جف بریجز روایت می شود، جزئیات یک گروه کاملاً متفاوت و به طور قابل توجهی کمتر صیقلی نسبت به گروهی که Parrotheads از اواخر دهه 70 تا زمان مرگ بافت در 1 سپتامبر 2023 به آن عادت کرده بودند را نشان می دهد. تصویر مربوط به زمانی است که خدمه کرال ریفر هدر می‌رفتند اما واقعاً هدر نمی‌رفتند، زیرا بافت آهنگ‌های تعیین‌کننده‌ای مانند Margaritaville، Cheeseburger in Paradise، Volcano، Fins و Son of a Son of a Sailor را ثبت کرد. ما می‌خواستیم زمان قبل از شروع پدیده Parrothead را به تصویر بکشیم، زمانی که هنوز در جاده‌ها آماده بودیم. جان اچ. آن دوران وحشی بود. بسیاری از بینندگانی که این را تماشا می‌کنند نمی‌دانند که دوره‌ای برای این گروه وجود داشته است، زیرا آنها این گروه بسیار منظم و شیک را برای مدت طولانی دیده‌اند.» او می‌گوید: «اما سال‌های اول کمی متفاوت بود. برخی از گروه بدون ثبت تاریخچه شروع به از بین رفتن و", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/jimmy-buffett-press-michael-ochs-billboard.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple", "سینما", "موسیقی"], "datetime_fa": "۸ آبان • ۱۸:۰۴"}, {"source": "Deadline", "title": "HBO’s Harry Potter Casts Its Ghosts, Sorting Hat & Fat Lady On Halloween Eve", "link": "https://deadline.com/2026/10/harry-potter-ghosts-sorting-hat-fat-lady-david-threlfall-1237209330/", "summary": "David Threlfall, who played Frank Gallagher in the UK s original Shameless, is voicing the sorting hat in HBO’s Harry Potter, which has revealed cast for the ghosts and fat lady on Halloween eve. BAFTA-winner Threlfall led the successful British series that spawned a hit Showtime version led by William H. Macy. He will voice the [ ]", "date_str": "2026-10-30T15:00:00+00:00", "hash": "1a6e2e892386c1ad", "title_fa": "هری پاتر شبکه HBO در شب هالووین، ارواح، کلاه طبقه بندی و بانوی چاق را بازیگر می کند.", "summary_fa": "دیوید ترلفال، بازیگر نقش فرانک گالاگر در سریال اصلی بریتانیایی Shameless، صداپیشگی کلاه دسته بندی در هری پاتر شبکه HBO را بر عهده دارد، که بازیگران ارواح و بانوی چاق را در شب هالووین فاش کرده است. ترلفال، برنده بفتا، سریال موفق بریتانیایی را رهبری کرد که یک نسخه موفق شوتایم به رهبری ویلیام اچ میسی را تولید کرد. او صداپیشگی [ ] دیوید ترلفال، بازیگر نقش فرانک گالاگر در فیلم اصلی بریتانیایی Shameless را بر عهده خواهد داشت، در حال صداپیشگی کلاه دسته بندی در هری پاتر شبکه HBO است که بازیگران ارواح و بانوی چاق را در شب هالووین فاش کرده است. در همین حال، لئو بیل نقش تقریباً بدون سر نیک، اندرو بروک بارون خونین و دانیل فرن نقش برادر چاق را بازی خواهد کرد. در ماه نوامبر، به Boomerang Atomic ساخته راچید بوچارب به عنوان تهیه کننده اجرایی پیوست. این مستند اولین انفجار بمب اتمی فرانسه در 13 فوریه 1960 را در نزدیکی شهر دورافتاده رگان در قلب صحرای صحرا در الجزایر بازبینی می کند. DOC NYC در ماه نوامبر. بوشارب، کارگردان الجزایری فرانسوی، که درام «روزهای افتخار» در سال 2006 نامزد اسکار شد، به بررسی پیامدهای ویرانگری می‌پردازد که بیش از شش دهه بعد بر جمعیت محلی و محیط‌زیست تأثیر می‌گذارد. داستان‌های مرتبط جشنواره‌ها در برابر آن بالا می‌روند نقد: آنتونیو باندراس اوا بیرتیسل در کمدی شوخ‌تر Trudie Styler درباره زوج طلاق گرفته‌ای که مجبور به بچه دار شدن برای نجات دخترشان شدند - اخبار جشنواره فیلم تورنتو U.S. تهیه‌کنندگان ژاپنی در گفتگو برای درام فرانسوی آزمایش هسته‌ای فرانسوی با حمایت اکثریت الجزایر راشید بوشارب که منحصراً بر روی آرشیوهای دولتی فرانسه طراحی شده است، این مستند آزمایش هسته‌ای را از طریق تصاویر و تفسیری که در اصل توسط مقامات فرانسوی تولید شده است، بدون روایت معاصر ارائه می‌کند و مخاطبان را دعوت می‌کند تا هم با واقعیت‌های موجود در خارج از قاب فیلم و هم با واقعیت‌های انسانی ثبت شده در فیلم روبرو شوند. ویتاکر گفت: \"من تحت تاثیر اصالت تاریخی و تاثیر عاطفی قدرتمند قرار گرفتم. این مستند مهم تاثیری محو نشدنی بر من گذاشت و باید دیده شود.\"", "image_url": "https://deadline.com/wp-content/uploads/2026/10/GettyImages-2295812401.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۸ آبان • ۱۸:۱۲"}, {"source": "Deadline", "title": "‘Guria’ Wins Best Film At Asia Pacific Screen Awards; ‘9 Temples To Heaven’ Takes Best Director", "link": "https://deadline.com/2026/10/asia-pacific-screen-awards-guria-9-temples-to-heaven-1237209398/", "summary": "Guria, directed by Georgia’s Levan Koguashvili, won Best Film at the Asia Pacific Screen Awards on the Gold Coast, Australia, with the film’s producers Olena Yershova, Koguashvili and Boris Frumin recognized for the international co-production. Thai director Sompot Chidgasornpongse received Best Director for 9 Temples To Heaven, with a Special Mention going to Myanm
