نسان یافت می شوند، که این شرکت معتقد است که آنها را به مدلی مرتبط با انسان برای آزمایش داروها و سایر ترکیبات تبدیل می کند. ایکن گفت که اکثر داروها در آزمایشات بالینی شکست می خورند، و من فکر می کنم درک این موضوع بسیار آسان است که ما نه موش هستیم و نه لایه های صافی از سلول ها. محصول شاخص این استارت آپ، GastroScreen، یک مدل ارگانوئیدی روده انسان است که برای آزمایش داروها و سایر ترکیبات به شرکت های دارویی، بیوتکنولوژی، مواد غذایی و شیمیایی می فروشد. چارلی چایلدز، یکی از بنیانگذاران و"}, {"source": "TechCrunch Main", "title": "CedarDB wants one database to handle both transactions and analytics, as AI agents raise the stakes", "link": "https://techcrunch.com/2026/10/14/cedardb-wants-one-database-to-handle-both-transactions-and-analytics-as-ai-agents-raise-the-stakes/", "summary": "Databases have traditionally been designed either for analytical data or for operational data. But database engine CedarDB supports both, and its approach has gained relevance with the rise of agentic AI.", "date_str": "2026-10-14T22:00:00+00:00", "hash": "bc736dc680379221", "title_fa": "CedarDB یک پایگاه داده می خواهد که هم تراکنش ها و هم تجزیه و تحلیل ها را مدیریت کند، زیرا عوامل هوش مصنوعی ریسک را افزایش می دهند.", "summary_fa": "پایگاه های داده به طور سنتی یا برای داده های تحلیلی یا برای داده های عملیاتی طراحی شده اند. اما موتور پایگاه داده CedarDB از هر دو پشتیبانی می کند و رویکرد آن با ظهور هوش مصنوعی عامل ارتباط پیدا کرده است. CedarDB در دهه گذشته در حال ساخت بوده است، اما شتاب فعلی آن از شرکت‌های سازمانی نشات می‌گیرد که پشته‌های داده موجود آنها ممکن است برای ذخیره سال‌ها تراکنش مناسب بوده باشد، اما برای پاسخگویی سریع به سؤالات تحلیلی که به زبان طبیعی در مورد آن داده‌ها پرسیده می‌شود، کمتر مناسب است. سوال CedarDB از شکاف بین پرس و جوهای تحلیلی و عملیاتی محصول جانبی تمرکز آن بر کارایی است. این شرکت یکی از دانشگاه‌های فنی مونیخ است که بر اساس Umbra، یک پروژه تحقیقاتی ساخته شده است که از ابتدا ساخته شده است تا موتورهای پایگاه داده قدیمی را با سرعت پردازش با حداکثر استفاده از سخت‌افزار مدرن شکست دهد. CedarDB با پنج محقق Umbra به عنوان یکی از بنیانگذاران آن، این رویکرد را حفظ کرد و نوید عملکرد سریع‌تر را بدون نیاز به CPU یا قدرت پردازش و حافظه بیشتر داد - و نیاز به تغییرات کمی از سوی مشتریان داشت. به ویژه، تیم آن اطمینان حاصل کرد که CedarDB با PostgreSQL، یک سیستم پایگاه داده منبع باز سازگار است. به گفته سیچرت، این سازگاری با پایگاه داده محبوب به پایین نگه داشتن هزینه های سوئیچینگ کمک می کند، زیرا کاربران نیازی به بازسازی برنامه های خود ندارند. همچنین یک مزیت اضافی دارد: CedarDB از منطقی پیروی می کند که LLM ها در نتیجه آموزش خود با آن آشنا هستند. سیچرت گفت که این تصمیم یکی از بسیاری از انتخاب‌هایی است که در نگاهی به گذشته خوش شانس بود. اما این همه شانس نبود. کریستین وینتر، یکی از بنیان‌گذاران، در یک پست وبلاگ، اولویت‌های کلیدی را"}, {"source": "TechCrunch Main", "title": "Ambani’s Jio seeks to raise $3.2B in what could be India’s biggest IPO", "link": "https://techcrunch.com/2026/10/14/ambanis-jio-seeks-to-raise-3-2b-in-what-could-be-indias-biggest-ipo/", "summary": "Jio plans to use most of its IPO proceeds to repay debt as it expands beyond telecom.", "date_str": "2026-10-14T21:48:20+00:00", "hash": "68311777682895cd", "title_fa": "Ambani's Jio به دنبال افزایش 3.2 میلیارد دلاری است که می تواند بزرگترین IPO هند باشد.", "summary_fa": "جیو قصد دارد از بیشتر درآمدهای IPO خود برای بازپرداخت بدهی استفاده کند زیرا فراتر از مخابرات گسترش می یابد. Jio Platforms، بازوی دیجیتالی میلیاردر هندی Mukesh Ambani's Reliance Industries، به دنبال جذب 3.2 میلیارد دلاری است که می تواند بزرگترین عرضه اولیه عمومی هند باشد. این فهرست اشتهای بازار عمومی را برای شرکتی که بیش از 20 میلیارد دلار از سرمایه گذاران جهانی از جمله گوگل و متا در سال 2020 جذب کرد، آزمایش خواهد کرد. روز چهارشنبه، Reliance Industries در یک پرونده بورس اوراق بهادار (PDF) گفت که Jio باند قیمتی 1065 روپیه تا 1119 روپیه (حدود 11.19 دلار تا 11.76 دلار) برای هر سهم برای عرضه حداکثر 270 میلیون سهم جدید (PDF) تعیین کرده است. IPO برای اشتراک در 21 اکتبر باز می شود و در 23 اکتبر بسته می شود و مناقصه برای سرمایه گذاران لنگر برای 19 اکتبر برنامه ریزی شده است. در انتهای بالای باند قیمت پیشنهادی، IPO بر اساس تعداد سهامی که انتظار می‌رود پس از عرضه موجود باشد، ارزش جیو را در حدود 10.3 تریلیون روپیه (حدود 108.3 میلیارد دلار) خواهد داشت. در سال 2020، جیو تا 4.91 تریلیون روپیه (حدود 65 میلیارد دلار در آن زمان) ارزش داشت. متا که در آن زمان با نام فیسبوک شناخته می شد، 5.7 میلیارد دلار سرمایه گذاری کرد، در حالی که گوگل 4.5 میلیارد دلار متعهد شد. عرضه اولیه سهام جیو قرار است در سال 2024 از عرضه 278.7 میلیارد روپیه هیوندای موتور هند (3.3 میلیارد دلار در آن زمان) پیشی بگیرد، حتی اگر سهام آن در پایین ترین حد قیمت باشد. از زمان راه اندازی در سال 2016، Jio به بزرگترین اپراتور مخابراتی هند تبدیل شده است، با بیش از 524 میلیون مشترک تا 31 مارس، پیش از Bharti Airtel، Vodafone Idea و BSNL دولتی. در ابتدا مشتریان را با داده های رایگان"}, {"source": "TechCrunch Main", "title": "Colossal Biosciences announces new AI platform to help accelerate de-extinction efforts", "link": "https://techcrunch.com/2026/10/14/colossal-biosciences-announces-new-ai-platform-to-help-accelerate-de-extinction-efforts/", "summary": "Colossal announced a new AI platform to help accelerate its de-extinction efforts and Peter Diamandis has launched a new fund to back startups who use it.", "date_str": "2026-10-14T21:00:00+00:00", "hash": "61929e351c0f57e7", "title_fa": "Colossal Biosciences پلتفرم جدید هوش مصنوعی را برای کمک به تسریع تلاش‌های انقراض معرفی می‌کند.", "summary_fa": "Colossal یک پلت فرم جدید هوش مصنوعی را برای کمک به تسریع تلاش‌های انقراض خود اعلام کرد و پیتر دیاماندیس صندوق جدیدی را برای حمایت از استارت‌آپ‌هایی که از آن استفاده می‌کنند راه‌اندازی کرده است. TechCrunch می تواند به طور انحصاری گزارش دهد. این پلتفرم که GenoMorph نام دارد، از مورفولوژی پیشرفته سه بعدی، ژنومیک مقایسه‌ای و زیست‌شناسی رشدی برای شناسایی ژن‌هایی استفاده می‌کند که می‌توانند در پروژه‌های انقراض با داده‌های ژنی محدود ویرایش شوند. این شرکت از آن به عنوان بخشی از تلاش خود برای بازگرداندن پرنده دودو استفاده می کند که ژنوم های محدودی برای کار با آن وجود دارد. به عنوان مثال، این شرکت تنها با یک ژنوم دودو در مقایسه با 100 ژنومی که توانسته به عنوان بخشی از پروژه انقراض ماموت های پشمالوی خود به دست آورد، کار می کند. به گفته این شرکت، DNA ماموت پشمالو فراوان‌تر است، زیرا آب و هوای سردتری که حیوان در آن زندگی می‌کرد، DNA را بهتر از مناطق استوایی که دودو در آن زندگی می‌کرد، حفظ می‌کرد. بن لام، مدیرعامل و یکی از بنیانگذاران شرکت Colossal به TechCrunch گفت: «به طور معمول، دانشمندان می توانند بسیاری از ژنوم ها را با هم مقایسه کنند تا بفهمند کدام تفاوت های ژنتیکی مسئول ویژگی های خاص است. ما با DNA باستانی گونه های منقرض شده ای که DNA آنها به شدت محدود است، آن تجملات را نداریم و فقط می توانیم تعداد کمی از ژنوم های کامل را بدست آوریم. برای ساخت GenoMorph، لام گفت که این شرکت مجموعه‌ای از داده‌های رشدی را از «مرغ، بلدرچین، اردک و کبوتر» جمع‌آوری کرده و آن را با «اطلاعات ژنتیکی و اندازه‌گیری‌های جمجمه سه بعدی از بیش از ۷۰ گونه پرنده» ترکیب کرده است. او گفت که بیش از یک سال کار برای ساخت این پلت فرم طول کشیده است، که این پلتفرم"}, {"source": "TechCrunch Main", "title": "Flock CEO: We haven’t ‘fired’ any police departments as customers", "link": "https://techcrunch.com/2026/10/14/flock-ceo-we-havent-fired-any-police-departments-as-customers/", "summary": "Flock CEO Garrett Langley said that the surveillance company has not canceled contracts of any police department or law enforcement agency, despite reports of abuse.", "date_str": "2026-10-14T20:26:25+00:00", "hash": "d915893fad7b465d", "title_fa": "مدیر عامل Flock: ما هیچ بخش پلیسی را به عنوان مشتری «اخراج» نکرده‌ایم", "summary_fa": "گرت لنگلی، مدیر عامل Flock گفت که شرکت نظارتی علیرغم گزارش‌هایی مبنی بر سوء استفاده، قراردادهای هیچ اداره پلیس یا سازمان مجری قانون را لغو نکرده است. لنگلی به Loizos گفت که این شرکت به رابطه با مشتری که در آن سوء استفاده گسترده از سیستم هایش وجود داشته باشد، پایان خواهد داد. اما، مدیر عامل شرکت گفت، تا به امروز مشتری را اخراج نکرده است، همانطور که او گفت، مانند اداره پلیس یا سازمان اجرای قانون. لنگلی گفت که Flock این بحث را در داخل داشت، اما استدلال کرد که این شرکت نباید محصول خود را از جامعه‌ای که ممکن است در تلاش‌هایش برای مبارزه با جرم به آن نیاز داشته باشد، بگیرد. اگر مشتری آگاهانه قانون را زیر پا بگذارد، بلافاصله او را اخراج می کنیم. لنگلی گفت که این خیلی آسان است. بیشتر بحث به این موضوع مربوط می شود که اگر دو افسر از پنجاه افسر دستگیر شوند چه می شود؟ لنگلی افزود، امروز، ما هیچ مشتری را اخراج نکرده‌ایم، اما در مورد برخی از مسائل کاملاً شدید قانون‌مدار، این موضوع از روی میز خارج نیست. سوء استفاده از سیستم‌های Flock و داده‌هایی که آن جمع‌آوری می‌کند آخرین مورد از مجادله‌هایی است که سازنده دوربین‌های پلاک‌خوان مستقر در آتلانتا در جورجیا است. Flock بیش از 100000 دوربین در سراسر ایالات متحده دارد که به ادارات پلیس محلی و آژانس‌های فدرال اجازه می‌دهد تا مکان پلاک خودروها و افراد را در حین عبور ردیابی کنند. برخی ادارات پلیس با اجازه دادن به مشتریان مجری قانون برای ردیابی پلاک خودروها در خارج از حوزه قضایی خود، می توانند خودروها را در سراسر کشور از طریق پایگاه داده مرکزی ملی Flock ردیابی کنند. Flock به نقطه عطفی در بحث نظارت تبدیل شده است و شهرها، شهرها و جوامع را وادار می کند تا دوربین های شرکت را با لغو"}, {"source": "TechCrunch Main", "title": "Electric vehicle sales in the US are showing signs of life", "link": "https://techcrunch.com/2026/10/14/electric-vehicle-sales-in-the-u-s-are-showing-signs-of-life/", "summary": "The electric vehicle market in the U.S. has been growing for the last three consecutive quarters.", "date_str": "2026-10-14T20:12:07+00:00", "hash": "4527d556bcea75b6", "title_fa": "فروش خودروهای الکتریکی در ایالات متحده نشانه های حیات را نشان می دهد", "summary_fa": "بازار خودروهای الکتریکی در ایالات متحده در سه فصل اخیر متوالی در حال رشد بوده است. هنوز برای وسیله نقلیه برقی ایالات متحده ننویسید. بر اساس گزارش جدید Cox Automotive، پس از اینکه فروش پس از لغو اعتبارات مالیاتی در سال گذشته کاهش یافت، در سه فصل اخیر متوالی رشد داشته است. خودروهای الکتریکی 6.1 درصد از بازار ایالات متحده را به خود اختصاص دادند که بهترین نمایش آنها از سه ماهه سوم سال 2025 است. استفانی والدز استریتی، مدیر بینش صنعت در شرکت خودروسازی کاکس، در تحلیلی که همراه با گزارش جدید بود، گفت: داده‌ها نشان می‌دهند که بازار خودروهای برقی «دوباره جای خود را پیدا می‌کند». او افزود که قیمت خودروهای برقی رقابتی تر شده است و قیمت بالای بنزین باعث جلب توجه مجدد مصرف کنندگان شده است. تویوتا، ریویان و سوبارو رهبری گروه را بر عهده داشتند. فروش تویوتا bZ و لکسوس RZ پس از یک به‌روزرسانی که اواخر سال گذشته در نمایندگی‌ها ظاهر شد، تقریباً دو برابر شد. مدل‌های به‌روزرسانی شده از پورت‌های شارژ به سبک تسلا استفاده کردند و باتری‌های بزرگ‌تر، موتورهای قدرتمندتر و زمان‌های شارژ سریع‌تر دریافت کردند. در همین حال، فروش تسلا نسبت به سال گذشته 20 درصد کاهش یافت. تسلا همچنان مزیت حرکت اول را حفظ کرده است، اگرچه بیش از نیمی از تمام خودروهای برقی را در سه ماهه سوم فروخته است. بهبود در ایالات متحده شبیه اتفاقاتی است که در آلمان پس از توقف مشوق های دولت برای خرید خودروهای الکتریکی در نوامبر 2023 رخ داد، یک سال زودتر از حد انتظار. ماه بعد، فروش بیش از نصف کاهش یافت. اما پس از رسیدن به آن پایین، بازار به طور پیوسته بهبود یافت. فروش خودروهای برقی آلمان در ماه آگوست، آخرین ماهی که داده‌های آن در دسترس است، دومین ماه بالاترین رکورد بود. 50% تخفیف برای پاس دوم دریافت کنید"}, {"source": "TechCrunch Main", "title": "TimeTeller puts our internal clocks at the center of personalized medicine", "link": "https://techcrunch.com/2026/10/14/timeteller-puts-our-internal-clocks-at-the-center-of-personalized-medicine/", "summary": "German startup TimeTeller has developed a saliva test kit to help anyone understand their circadian rhythm; it aims to reduce side effects from cancer treatments.", "date_str": "2026-10-14T20:00:00+00:00", "hash": "354d9002dc835828", "title_fa": "TimeTeller ساعت های داخلی ما را در مرکز پزشکی شخصی قرار می دهد", "summary_fa": "استارت‌آپ آلمانی TimeTeller یک کیت تست بزاق ایجاد کرده است تا به هر کسی کمک کند ریتم شبانه روزی خود را درک کند. هدف آن کاهش عوارض جانبی درمان های سرطان است. آزمایشات بهداشتی در خانه درگیر ادعاهای بیش از حد و تقلب آشکار شده است. اما استارت‌آپ آلمانی TimeTeller که یک کیت تست بزاق ایجاد کرده است تا به هر کسی کمک کند ریتم شبانه روزی خود را درک کند، توسط مدیر عامل آنجلا رلوجیو هدایت می‌شود که مخالف قطبی با الیزابت هولمز، بنیانگذار شرم‌زده ترانوس است. Relógio یک فیزیکدان-مهندس و زیست‌شناس مولکولی است که قبل از ترک دانشگاه برای ساخت TimeTeller، سال‌ها روی انکولوژی، زیست‌شناسی شبانه‌روزی و پزشکی سیستمی در آلمان تحقیق کرد. او مراقب است که آزمایش امروز چه کاری را می تواند انجام دهد و چه کاری را نمی تواند انجام دهد. فروش بیش از حد آن آسان است: نام خانوادگی Relógio در زبان پرتغالی مادری او به معنای «ساعت» است، و TimeTeller این پتانسیل را دارد که عوارض جانبی ناشی از درمان سرطان را کاهش دهد و با زمان‌بندی درمان با ساعت داخلی هر بیمار، نتایج را بهبود بخشد. همچنین به همین دلیل است که او مراقب است هشدار دهد که TimeTeller خود در دو خط زمانی عمل می کند. هدف بلندمدت این است که تعیین کنیم چه زمانی درمان‌های سرطان بهتر تحمل می‌شوند و موثرتر هستند، و این کار بسیار دقیق‌تر از این است که بگوییم فردی صبح‌گاهی است یا جغد شب. اما کیت مستقیم به مصرف کننده آن به بیماران کمک نمی کند تا به تنهایی آن را بفهمند. Relógio هشدار داد: \"این چیزی است که ما باید برای هر دارویی محاسبه کنیم؛ ما این کار را در چارچوب مطالعات بالینی انجام می دهیم.\" به گزارش Relógio، TimeTeller به دلیل تقاضای کلینیک‌های طول عمر، که بر پیری سالم تمرکز می‌کنند و درک می‌کنند"}, {"source": "TechCrunch Main", "title": "Ambrosia Energy will build a 10 GWh factory in Texas to make batteries for off-grid data centers", "link": "https://techcrunch.com/2026/10/14/ambrosia-energy-will-build-a-10-gwh-factory-in-texas-to-make-batteries-for-off-grid-data-centers/", "summary": "Startup Ambrosia Energy will build a massive factory to crank out batteries to augment solar panels, creating a round-the-clock clean power plant.", "date_str": "2026-10-14T19:51:34+00:00", "hash": "7de22bb21e837258", "title_fa": "آمبروزیا انرژی یک کارخانه 10 گیگاوات ساعتی در تگزاس برای ساخت باتری برای مراکز داده خارج از شبکه خواهد ساخت.", "summary_fa": "استارت‌آپ Ambrosia Energy کارخانه عظیمی برای تولید باتری‌ها برای تقویت پنل‌های خورشیدی خواهد ساخت و یک نیروگاه برق تمیز شبانه‌روزی ایجاد خواهد کرد. بن لانگمیر، یکی از بنیانگذاران و مدیر عامل شرکت بن لانگمیر، سه شنبه در TechCrunch Disrupt در سانفرانسیسکو اعلام کرد که Ambrosia Energy کار بر روی یک کارخانه باتری عظیم با ظرفیت 10 گیگاوات ساعت در نزدیکی آستین، تگزاس را آغاز کرده است. این به ما این امکان را می دهد که سالانه حدود 300 مگاوات نیروگاه در سایت های میدانی خود بسازیم. این کارخانه 150000 فوت مربع را اشغال خواهد کرد و لانگمیر گفت که آمبروزیا قصد دارد طی دو تا سه سال به تولید کامل برسد. این استارت‌آپ در ماه ژوئن از مخفی کاری پدید آمد و نیروگاه‌هایی را برای مراکز داده با هزینه 100 دلار در هر مگاوات ساعت ساخت. لانگمیر و هم بنیانگذارش، سارا اسپانجلو، روی باتری‌های خورشیدی پلاس به عنوان ارزان‌ترین گزینه که سریع‌ترین راه‌اندازی است، تصمیم گرفتند. پنل‌های خورشیدی بار را در طول روز نیرو می‌دهند و باتری‌ها را شارژ می‌کنند، که در شب و در روزهای ابری تخلیه می‌شوند تا مرکز داده در تمام ساعات شبانه روز کار کند. لانگمیر و اسپانجلو قبلاً استارت‌آپ صورت فلکی ماهواره‌ای Swarm را تأسیس کردند که آن را به SpaceX فروختند. لانگمیر گفت که آمبروزیا همچنین در اواخر امسال کار بر روی اولین نیروگاه تجاری خود در غرب تگزاس را آغاز می کند. این تاسیسات 300 مگاوات پنل های خورشیدی را با باتری های 660 مگاوات ساعتی جفت می کند تا 30 مگاوات برق مداوم را با هدف 99.3٪ زمان کارآیی تحویل دهد. لانگمیر گفت که حتی با «ساخت بیش از حد» انرژی خورشیدی و باتری‌ها برای ارائه زمان کار مداوم، این شرکت می‌تواند با 100 دلار در هر مگاوات ساعت سودآوری داشته باشد و آن را با توربین‌های گاز طبیعی که بسیاری از"}, {"source": "TechCrunch Main", "title": "Hiyd is a health tracker that attaches to the watch you already wear", "link": "https://techcrunch.com/2026/10/14/hiyd-is-a-health-tracker-that-attaches-to-the-watch-you-already-wear/", "summary": "Former Apple engineers figured out how to get a biometric sensor to attach to your watch without any magnets or adhesives.", "date_str": "2026-10-14T19:00:00+00:00", "hash": "a1328cf4855cf399", "title_fa": "Hiyd یک ردیاب سلامتی است که به ساعتی که قبلا می پوشید وصل می شود", "summary_fa": "مهندسان سابق اپل متوجه شدند که چگونه یک حسگر بیومتریک را بدون آهنربا یا چسب به ساعت خود متصل کنند. اگر از علاقه مندان به ساعت مچی هستید، احتمالاً نمی خواهید ساعت ارزشمند خود را با یک ردیاب تناسب اندام حجیم تعویض کنید. اما صلاح باتروخ، بنیانگذار Hiyd فکر نمی کند که مردم باید مد را فدای عملکرد کنند. باتروخ به TechCrunch گفت: ما فکر نمی کنیم که ردیابی سلامت باید این تصمیم بیش از حد آگاهانه باشد که در آن شما باید چیزی را در ظاهر خود تغییر دهید. این اخلاق کل شرکت است. برنامه ما ایجاد این اکوسیستم محصول با ردیابی سلامت نامرئی است. اولین دستگاه Hiyd که ردیابی سلامتی را خنک‌تر نشان می‌دهد، یک دیسک کوچک و باریک است که از طریق میکرومکش به پشت ساعت شما متصل می‌شود، یک فناوری مواد که به سنسور اجازه می‌دهد بدون آهن‌ربا یا چسب در زیر ساعت شما قرار بگیرد. به این ترتیب، هیچ باقیمانده یا آشفتگی در مکانیک ساعت هایی که زمان را با استفاده از آهنربا نگه می دارند، باقی نمی گذارد. میکرو ساکشن اساساً یک سیلیکون بافت دار است که صدها جیب کوچک در هر اینچ مربع در یک صفحه انعطاف پذیر قالب گیری شده است. باتروخ توضیح داد که وقتی روی آن فشار می‌دهید، هوا را از تمام آن جیب‌ها بیرون می‌کشد و در نهایت با یک خلاء مواجه می‌شوید - درست مانند فنجان‌های مکنده سنتی، اما به‌طور باورنکردنی کاهش یافته است. در متوقف کردن نیروهای برشی فوق‌العاده عمل می‌کند، اما کمی کنجکاوی به آن اجازه می‌دهد تا درست از بین برود، که برای ما ایده‌آل است. همچنین با فرآیندهای تولید ما بسیار نازک و تنها 0.3 میلی متر است. به گزارش باتروخ، این سنسور با ضخامت 2.7 میلی‌متر و وزن 7 گرم، بیومتریک‌های مشابه با ابزارهای پوشیدنی پیشرو را جمع‌آوری می‌کند، از جمله ضربان قلب،"}, {"source": "Ars Technica", "title": "Fridge hack costing millions and sparking fires stemmed from poor security", "link": "https://arstechnica.com/security/2026/10/fridge-hack-costing-millions-and-sparking-fires-stemmed-from-poor-security/", "summary": "Earlier this week, a mass hack of refrigeration systems at an estimated 700 supermarkets throughout France caused them to suddenly malfunction, causing spoilage of untold tons of perishables and, in some cases, fires. As is now the norm, basic cybersecurity would have prevented it. French authorities say the systems, made up of entire fleets of refrigerators and freezers throughout a store, were hacked. More specifically, Internet-connected controllers that allow technicians to remotely administer the store-wide systems were compromised. The unknown attackers responsible then activated defrosters long enough for the fridges to reach temperatures as high as 50° Celsius (122° Fahrenheit). By the time the mass compromise was discovered, food was spoiled, and in some cases their electrical systems caught fire. The hacks that didn't have to happen Multiple security advisories and public research reports show that all three of the controller models reportedly hacked in the incident—sold by Danfoss of Denmark and Dixell and its parent company Copeland in the US—contained critical vulnerabilities that allow attackers to remotely log in to the devices with the same system rights as administrators. Until recently, Danfoss controllers, for instance, used a credential that changes each day. The password is generated by the publicly available firmware based on the date. A hacker who takes the time to analyze the code can do the same thing on any device that hasn’t received a recent update. Daily passwords are identical across models located in hundreds or thousands of stores. Read full article Comments", "date_str": "2026-10-14T21:35:09+00:00", "hash": "ec22978bd93f605c", "title_fa": "هک یخچال که میلیون ها هزینه در بر داشت و جرقه های آتش سوزی ناشی از امنیت ضعیف بود", "summary_fa": "در اوایل این هفته، هک دسته جمعی سیستم های تبرید در حدود 700 سوپرمارکت در سراسر فرانسه باعث شد که به طور ناگهانی عملکرد آنها خراب شود و باعث از بین رفتن هزاران تن از مواد فاسدشدنی و در برخی موارد آتش سوزی شود. همانطور که در حال حاضر معمول است، امنیت سایبری اولیه از آن جلوگیری می کرد. مقامات فرانسوی می گویند این سیستم ها که از کل ناوگان یخچال و فریزر در سراسر یک فروشگاه تشکیل شده بودند، هک شدند. به طور خاص، کنترل‌کننده‌های متصل به اینترنت که به تکنسین‌ها اجازه می‌دهد از راه دور سیستم‌های فروشگاه را مدیریت کنند، در معرض خطر قرار گرفتند. مهاجمان ناشناس مسئول سپس یخ‌سازها را به اندازه‌ای فعال کردند که دمای یخچال‌ها به 50 درجه سانتیگراد (122 درجه فارنهایت) برسد. تا زمانی که مصالحه توده ای کشف شد، مواد غذایی فاسد شدند و در برخی موارد سیستم های الکتریکی آنها آتش گرفت. هک‌هایی که لازم نبود انجام می‌شدند مشاوره‌های امنیتی متعدد و گزارش‌های تحقیقاتی عمومی نشان می‌دهند که هر سه مدل کنترل‌کننده که طبق گزارش‌ها در این حادثه هک شده‌اند - که توسط Danfoss دانمارکی و دیکسل و شرکت مادر آن Copeland در ایالات متحده فروخته شده‌اند - دارای آسیب‌پذیری‌های مهمی هستند که به مهاجمان اجازه می‌دهد از راه دور به دستگاه‌هایی با حقوق یکسان وارد شوند. به عنوان مثال، تا همین اواخر، کنترلرهای Danfoss از اعتباری استفاده می کردند که هر روز تغییر می کند. رمز عبور توسط سیستم عامل در دسترس عموم بر اساس تاریخ ایجاد می شود. هکری که برای تجزیه و تحلیل کد وقت می گذارد، می تواند همین کار را در هر دستگاهی که به روز رسانی اخیر دریافت نکرده است انجام دهد. گذرواژه‌های روزانه در مدل‌های موجود در صدها یا هزاران فروشگاه یکسان هستند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد"}, {"source": "Ars Technica", "title": "Epic says its new vibe-coded Epic Games Launcher is faster than Steam", "link": "https://arstechnica.com/gaming/2026/10/programming-is-hard-epic-games-leans-on-vibe-coding-for-its-new-launcher-app/", "summary": "Nearly eight years after Epic took on Steam with its own Game Store and launcher, the Fortnite maker is deploying a new tool to give it an edge over Valve: vibe coding. In announcing the new publicly available \"Preview\" build of its Epic Games Launcher, Epic writes that \"programming is hard. So, instead of doing that, we vibe coded a new Epic Games Launcher that’s way faster and more responsive than the current one, and has a new look.\" And while that might sound a little tongue-in-cheek, Epic Games Store General Manager and VP Martin Keely told PC Gamer that the team \"started from scratch\" and used AI as \"a tool to write and review new features and new capabilities from the ground up in a different tech stack than what we had previously.\" The goal, Keely said, was to \"look at functionality that existed [in the current Epic Games Launcher] and [say] we want to replicate that, but not the code itself.\" Speaking to IGN , Keely clarified that using AI to code the new Launcher \"made us more efficient and allowed a small team to rewrite the code base and be able to launch it faster across platforms, support Windows and Mac, and we're going to have a Linux version as well.\" Read full article Comments", "date_str": "2026-10-14T21:15:56+00:00", "hash": "64dc8993f0c4633c", "title_fa": "Epic می‌گوید لانچر جدید Epic Games با کد vibe آن سریعتر از Steam است", "summary_fa": "تقریباً هشت سال پس از اینکه Epic با فروشگاه و لانچر مخصوص بازی خود در استیم قرار گرفت، سازنده Fortnite در حال استفاده از ابزار جدیدی است تا به آن برتری نسبت به Valve بدهد: vibe coding. اپیک در معرفی ساخت جدید «Preview» در دسترس عموم لانچر Epic Games خود می نویسد که «برنامه نویسی سخت است. بنابراین، به جای انجام این کار، ما یک لانچر جدید Epic Games را کدگذاری کردیم که بسیار سریعتر و پاسخگوتر از لانچر فعلی است و ظاهری جدید دارد.\" کیلی گفت، هدف این بود که «به عملکردی که [در راه‌انداز فعلی Epic Games] وجود داشت نگاه کنیم و [گفتیم] می‌خواهیم آن را تکرار کنیم، اما نه خود کد». و Mac، و ما یک نسخه لینوکس نیز خواهیم داشت.» مقاله کامل را بخوانید نظرات تنظیمات متن اندازه متن داستان کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید تقریباً هشت سال پس از اینکه Epic با فروشگاه بازی و لانچر خود استیم را شروع کرد، سازنده Fortnite در حال توسعه ابزار جدیدی است که به آن کمک می کند: ما لانچر Epic Games را کدگذاری کردیم تا سریع‌تر از سایر افراد باشد. ما را باور نمی کنید؟ خودتان آن را در پیش نمایش آزمایش کنید: https://t.co/pdtAeEIri4 https://t.co/aMxojUUVPV"}, {"source": "Ars Technica", "title": "NATO may redeploy anti-drone defenses as attacks sink more Black Sea shipping", "link": "https://arstechnica.com/gadgets/2026/10/nato-may-redeploy-anti-drone-defenses-as-attacks-sink-more-black-sea-shipping/", "summary": "Suspected Russian drone attacks sank a cargo ship and forced the evacuation of another vessel within two dozen miles of the coast of Bulgaria in the Black Sea on October 13. The latest attacks mean that five ships have been attacked in the exclusive economic zones of NATO member countries—spurring requests for NATO to redeploy counter-drone systems to provide more protection. Although there is no hard proof that the drone attacks originated from Russia, one of the ships that came under attack was the Ukrainian-operated coastal freighter Chelsea 3 , registered under the flag of Malta. Bulgarian Prime Minister Rumen Radev told the Russian ambassador in Sofia that “it makes no sense for Ukraine to destroy its own ships in the Black Sea, and the results of these strikes favor Russia’s interests,” according to The Associated Press . All 15 members of the Ukrainian-owned Chelsea 3 were safely evacuated by Bulgarian rescue operations after the ship was reportedly struck by three aerial drones. Read full article Comments", "date_str": "2026-10-14T21:03:11+00:00", "hash": "9456c3896061e574", "title_fa": "ناتو ممکن است سیستم های دفاعی ضد پهپادها را مجدداً مستقر کند زیرا حملات کشتی های بیشتری را در دریای سیاه غرق می کند", "summary_fa": "حملات مشکوک هواپیماهای بدون سرنشین روسیه یک کشتی باری را غرق کرد و کشتی دیگری را در فاصله 22 مایلی سواحل بلغارستان در دریای سیاه در 13 اکتبر تخلیه کرد. آخرین حملات به این معنی است که پنج کشتی در مناطق انحصاری اقتصادی کشورهای عضو ناتو مورد حمله قرار گرفته‌اند - که درخواست‌ها از ناتو برای استقرار مجدد سیستم‌های پهپاد ضد پهپاد برای ارائه حفاظت بیشتر را افزایش داده است. اگرچه هیچ دلیل محکمی وجود ندارد که نشان دهد حملات پهپادها از روسیه سرچشمه گرفته است، یکی از کشتی هایی که مورد حمله قرار گرفت، کشتی باری ساحلی چلسی 3 اوکراینی بود که تحت پرچم مالت ثبت شده بود. به گزارش آسوشیتدپرس، رومن رادف، نخست وزیر بلغارستان به سفیر روسیه در صوفیه گفت: «منهدم کردن کشتی‌های خود در دریای سیاه برای اوکراین معنی ندارد و نتایج این حملات به نفع روسیه است». همه 15 عضو چلسی 3 متعلق به اوکراین پس از اصابت سه هواپیمای بدون سرنشین به کشتی توسط عملیات نجات بلغارستان به سلامت تخلیه شدند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید حملات مشکوک هواپیماهای بدون سرنشین روسیه یک کشتی باری را غرق کرد و کشتی دیگری را در فاصله دوجین مایلی سواحل بلغارستان در دریای سیاه در 13 اکتبر تخلیه کرد. آخرین حملات به این معنی است که پنج کشتی در مناطق انحصاری اقتصادی کشورهای عضو ناتو مورد حمله قرار گرفته‌اند و درخواست‌ها از ناتو برای استقرار مجدد سامانه‌های پهپادهای ضد پهپاد برای ارائه حفاظت بیشتر را برانگیخته است. به گزارش آسوشیتدپرس، اما مقامات همچنان در جستجوی 11 خدمه ناپدید شده کشتی باری دیگنیتی با پرچم گینه بیسائو هستند که پس از حمله غرق شد. پنج دریانورد در ابتدا از آن کشتی نجات یافتند."}, {"source": "Ars Technica", "title": "Things are finally looking up for NASA's first missions to Venus in a generation", "link": "https://arstechnica.com/space/2026/10/nasas-embattled-venus-missions-are-back-on-track-after-cancellation-threat/", "summary": "Most planetary scientists will tell you the heyday of Venus exploration was more than a generation ago. That is about to change. Two NASA missions are on track to launch to Venus in the early 2030s. The first, known as the Deep Atmosphere Venus Investigation of Noble gases, Chemistry, and Imaging (DAVINCI), is now scheduled for launch in December 2030, a year earlier than previously planned. DAVINCI will send a parachute-assisted descent probe through the atmosphere of Venus, returning the first direct images of the planet's surface since 1982. A second mission, Venus Emissivity, Radio science, InSAR, Topography, And Spectroscopy (VERITAS), will follow with a launch in November 2032 to map the Venusian surface by radar from orbit. The European Space Agency is building another orbiter, Envision, for launch to Venus in 2032. The Venus armada might get started as soon as next year, when Rocket Lab aims to launch a privately funded probe to search for signs of organic material in the planet's clouds. Read full article Comments", "date_str": "2026-10-14T20:48:07+00:00", "hash": "7539cba94d811f51", "title_fa": "در نهایت همه چیز برای اولین ماموریت ناسا به زهره در یک نسل بررسی می شود", "summary_fa": "اکثر دانشمندان سیاره‌شناسی به شما خواهند گفت که اوج اکتشاف زهره بیش از یک نسل پیش بوده است. که در شرف تغییر است. دو ماموریت ناسا در مسیر پرتاب به زهره در اوایل دهه 2030 هستند. اولین مورد که به عنوان بررسی گازهای نجیب، شیمی و تصویربرداری زهره اعماق جو (DAVINCI) شناخته می شود، اکنون برای پرتاب در دسامبر 2030 برنامه ریزی شده است، یک سال زودتر از برنامه ریزی قبلی. داوینچی یک کاوشگر فرود به کمک چتر نجات را از طریق جو زهره ارسال خواهد کرد و اولین تصاویر مستقیم از سطح سیاره را از سال 1982 به دست خواهد آورد. ماموریت دوم با نام انتشار زهره، علوم رادیویی، InSAR، توپوگرافی، و طیف سنجی (VERITAS)، با پرتاب در نوامبر 2032 با نقشه برداری از سطح سیاره زهره انجام خواهد شد. آژانس فضایی اروپا در حال ساخت مدارگرد دیگری به نام Envision برای پرتاب به زهره در سال 2032 است. ناهید زهره ممکن است در سال آینده آغاز شود، زمانی که آزمایشگاه راکت قصد دارد یک کاوشگر با بودجه خصوصی برای جستجوی نشانه‌هایی از مواد آلی در ابرهای سیاره راه‌اندازی کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش بیشتر دانشمندان سیاره‌شناسی به شما خواهند گفت که اوج اکتشاف زهره بیش از یک نسل پیش بوده است. که در شرف تغییر است. این به روز رسانی هفته گذشته در جلسه گروه تحلیل اکتشاف زهره (VEXAG) بود، که گروهی از دانشمندان است که علایق تحقیقاتی آن ها بر روی جهان سوزان که درست از زمین به سمت خورشید است، متمرکز است. مدارگرد اروپایی انویژن نیز در سال 2032 به سمت زهره پرتاب خواهد شد. ناوگان ناهید ممکن است در اواخر سال 2027 آغاز شود، زمانی که آزمایشگاه راکت قصد"}, {"source": "Ars Technica", "title": "Schools across US protest FCC plan that could disconnect kids from Internet", "link": "https://arstechnica.com/tech-policy/2026/10/schools-libraries-plead-with-fcc-to-scrap-idea-of-killing-2b-broadband-program/", "summary": "Schools and libraries from around the US pleaded with the Federal Communications Commission to drop the idea of ending E-Rate, a $2 billion-a-year program that connects students and library visitors to the Internet. FCC Chairman Brendan Carr has criticized school districts for having \"experimented with a massive increase in screen time for students,\" and said E-Rate expanded too far beyond its original purpose of \"supporting basic Internet access to schools and libraries for educational purposes.\" In June, Carr led a 2-1 vote to issue a Notice of Proposed Rulemaking (NPRM) seeking public comment on whether E-Rate should be \"limited or sunset to reflect today’s extensive connectivity rates.\" Carr's proposal could result in E-Rate cutting the discounts that schools and libraries receive for telecom services and equipment, and imposing more restrictions on how E-Rate money can be used. The FCC seeking comment on whether to sunset the program also raises the possibility that Carr might choose to axe E-Rate entirely. Read full article Comments", "date_str": "2026-10-14T20:15:56+00:00", "hash": "13e00802463943fb", "title_fa": "اعتراض مدارس سراسر ایالات متحده به طرح FCC که می تواند ارتباط کودکان را از اینترنت قطع کند", "summary_fa": "مدارس و کتابخانه ها از سراسر ایالات متحده از کمیسیون ارتباطات فدرال درخواست کردند که ایده پایان دادن به E-Rate را که یک برنامه 2 میلیارد دلاری در سال است که دانش آموزان و بازدیدکنندگان کتابخانه را به اینترنت متصل می کند، کنار بگذارد. برندن کار، رئیس FCC، از مناطق مدرسه به دلیل \"آزمایش افزایش گسترده زمان نمایش برای دانش آموزان\" انتقاد کرده و گفت که E-Rate بسیار فراتر از هدف اصلی خود یعنی \"حمایت از دسترسی اولیه به اینترنت به مدارس و کتابخانه ها برای اهداف آموزشی\" گسترش یافته است. در ماه ژوئن، Carr با رای 2-1 برای صدور یک اعلامیه قوانین پیشنهادی (NPRM) به دنبال نظر عمومی در مورد اینکه آیا E-Rate باید \"محدود باشد یا غروب آفتاب برای منعکس کننده نرخ های اتصال گسترده امروزی\" باشد، رای داد. پیشنهاد کار می‌تواند منجر به کاهش تخفیف‌هایی شود که مدارس و کتابخانه‌ها برای خدمات و تجهیزات مخابراتی دریافت می‌کنند و محدودیت‌های بیشتری در مورد نحوه استفاده از پول E-Rate اعمال می‌کند. FCC به دنبال اظهار نظر در مورد غروب شدن این برنامه همچنین این احتمال را افزایش می دهد که Carr ممکن است به طور کامل از E-Rate استفاده کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید مدارس و کتابخانه های سراسر ایالات متحده از کمیسیون ارتباطات فدرال درخواست کردند که ایده پایان دادن به E-Rate را که یک برنامه 2 میلیارد دلاری در سال است که دانش آموزان و بازدیدکنندگان اینترنت را به کتابخانه متصل می کند، کنار بگذارد. پیشنهاد کار می‌تواند منجر به کاهش تخفیف‌هایی شود که مدارس و کتابخانه‌ها برای خدمات و تجهیزات مخابراتی دریافت می‌کنند و محدودیت‌های بیشتری در مورد نحوه استفاده از پول E-Rate اعمال می‌کند. FCC به دنبال اظهار نظر"}, {"source": "Ars Technica", "title": "Georgia man sues Flock, sheriff's office over alleged ALPR-fueled retaliation", "link": "https://arstechnica.com/tech-policy/2026/10/georgia-man-sues-flock-sheriffs-office-over-alleged-alpr-fueled-retaliation/", "summary": "A small-business owner in Georgia has sued Flock and the Coweta County Sheriff’s Office over alleged retaliation using license plate cameras. “[The lawsuit] alleges illegal [license plate tracking] searches over many months without probable cause and unrelated to any specific investigation,” Hall Lampros, attorneys for plaintiff Tyler Murkerson, wrote in a press release . “The lawsuit alleges that Flock also failed to put safeguards in place to prevent illegal surveillance by officers by accepting free-text-field entries instead of specific case numbers or investigations.” Murkerson’s saga began in February 2023, when he was arrested by sheriff’s deputies over an alleged seatbelt violation; those charges were dropped months later. In September 2024, Murkerson sued the department , accusing them of excessive force. The case was only recently settled. Read full article Comments", "date_str": "2026-10-14T19:53:01+00:00", "hash": "6866f3b69e339496", "title_fa": "شکایت مرد جورجیا از کلانتر و کلانتر به دلیل انتقام‌جویی ادعایی ناشی از ALPR", "summary_fa": "یک صاحب کسب و کار کوچک در جورجیا از فلاک و کلانتر شهرستان کویتا به دلیل انتقام گیری با استفاده از دوربین های پلاک خودرو شکایت کرده است. هال لامپروس، وکلای شاکی تایلر مورکرسون، در بیانیه‌ای مطبوعاتی نوشت: «[دعوی قضایی] به جستجوهای غیرقانونی [ردیابی پلاک گواهینامه] طی ماه‌ها بدون دلیل احتمالی و غیرمرتبط با تحقیقات خاصی اشاره می‌کند. در این دادخواست ادعا شده است که Flock همچنین نتوانسته تدابیری را برای جلوگیری از نظارت غیرقانونی توسط افسران با پذیرش ورودی‌های متن آزاد به جای شماره پرونده یا تحقیقات خاص ایجاد کند. حماسه مورکرسون در فوریه 2023 آغاز شد، زمانی که او توسط معاونان کلانتر به دلیل نقض ادعای کمربند ایمنی دستگیر شد. این اتهامات ماه ها بعد کنار گذاشته شد. در سپتامبر 2024، مورکرسون از وزارتخانه شکایت کرد و آنها را به زور بیش از حد متهم کرد. این پرونده به تازگی حل و فصل شده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید به حداقل رساندن برای پیمایش یک مالک کسب و کار کوچک در جورجیا از Flock و کلانتر شهرستان Coweta به دلیل ادعای تلافی جویانه با استفاده از دوربین های پلاک خودرو شکایت کرده است. در حالی که این شکایت در حال بررسی بود، مورکرسون می‌گوید پلاک خودروی او چندین بار در سیستم Flock جستجو شده است. علاوه بر این، او ادعا می‌کند که نمایندگان هنگام رانندگی به خانه‌اش او را تعقیب یا تحت نظر داشتند. وکلای او ادعا می کنند که هنگام جستجوی وسیله نقلیه مورکرسون، معاونان کلانتر استدلال های مزخرفی را وارد کردند. این یک ضعف گسترده در سیستم Flock گزارش شده است. در شکایت 8 اکتبر آمده است: «در طول دوره مربوطه، پلتفرم فلاک فقط نیاز داشت که متنی در یک فیلد آزاد وارد شود، و"}, {"source": "Ars Technica", "title": "Software development and rules stability: Prototype racing in 2030", "link": "https://arstechnica.com/cars/2026/10/software-development-and-rules-stability-prototype-racing-in-2030/", "summary": "IMSA provided accommodation so Ars could attend the Petit Le Mans. Ars does not accept paid editorial content. The rising tide that has been the Drive to Survive effect has lifted more boats in motorsport than simply Formula 1’s. Sportscar racing is enjoying its own surge in popularity internationally at races like Le Mans in France, but also in North America in IMSA’s WeatherTech Sportscar Championship. For one thing, multi-hour, multi-class racing lends itself better to the age of streaming and second screens than it did linear broadcast TV, and fans are taking advantage of that: IMSA’s audience grew by more than a third domestically and almost a quarter internationally last year. Having some of the coolest-looking cars racing today certainly helps, whether that’s the (mostly) hybrid prototypes or the GTs, racing versions of road-going cars from Porsche, Ferrari, and others. And it definitely helps that fan access at the races is virtually unmatched, with open paddocks and grid walks that now see huge crowds get up close to the cars just before the start of each race. “I think we're just scratching the surface,” said IMSA President John Doonan. “I think besides the people that are here on the ground, the people watching, people engaging with us on social media, I'm seeing the passion come out more. Just on the grid walk, these fans coming up and being so excited to be here.” The series has certainly been making an effort, among other things getting local high school students exposed to the industry and starting a partnership to train more mechanics with ASE. Read full article Comments", "date_str": "2026-10-14T19:44:26+00:00", "hash": "69aba614554c3006", "title_fa": "توسعه نرم افزار و ثبات قوانین: مسابقه نمونه اولیه در سال 2030", "summary_fa": "IMSA محل اقامتی را فراهم کرد تا Ars بتواند در Petit Le Mans شرکت کند. Ars محتوای تحریریه پولی را نمی پذیرد. جزر و مد بالا که اثر Drive to Survive بوده است، قایق های بیشتری را در ورزش موتوری به جای قایق های ساده فرمول 1 بالا برده است. مسابقات اتومبیل‌رانی ورزشی در مسابقاتی مانند Le Mans در فرانسه و همچنین در آمریکای شمالی در مسابقات قهرمانی WeatherTech Sportscar IMSA از محبوبیت بین‌المللی خود برخوردار است. برای یک چیز، مسابقات چند ساعته و چند کلاسه نسبت به پخش تلویزیونی خطی، خود را به عصر پخش و صفحه دوم بهتر می‌رساند، و طرفداران از آن بهره می‌برند: مخاطبان IMSA در سال گذشته بیش از یک سوم در داخل و تقریباً یک چهارم در سطح بین‌المللی افزایش یافتند. داشتن برخی از جذاب‌ترین ماشین‌های مسابقه‌ای امروزی قطعا کمک می‌کند، چه نمونه‌های اولیه هیبریدی یا GT‌ها، نسخه‌های مسابقه‌ای ماشین‌های جاده‌ای پورشه، فراری و دیگران. و قطعاً به این کمک می‌کند که دسترسی هواداران در مسابقات تقریباً بی‌نظیر باشد، با پدوک‌های باز و پیاده‌روی‌های شبکه‌ای که اکنون جمعیت عظیمی را می‌بینید که درست قبل از شروع هر مسابقه به ماشین‌ها نزدیک می‌شوند. جان دونان، رئیس IMSA گفت: \"من فکر می کنم که ما فقط سطح را می خراشیم.\" من فکر می‌کنم علاوه بر افرادی که اینجا روی زمین هستند، افرادی که تماشا می‌کنند، افرادی که در رسانه‌های اجتماعی با ما در ارتباط هستند، من می‌بینم که شور و شوق بیشتری ظاهر می‌شود. درست در راه رفتن، این طرفداران بالا می آیند و از حضور در اینجا بسیار هیجان زده هستند. این مجموعه مطمئناً تلاش کرده است، از جمله موارد دیگر، دانش‌آموزان دبیرستانی محلی را در معرض صنعت قرار داده و مشارکتی را برای آموزش مکانیک‌های بیشتری با ASE آغاز کرده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای"}, {"source": "Ars Technica", "title": "Greta Gerwig channels Bowie in psychedelic The Magician's Nephew trailer", "link": "https://arstechnica.com/culture/2026/10/greta-gerwig-channels-bowie-in-psychedelic-the-magicians-nephew-trailer/", "summary": "Director Greta Gerwig could have made pretty much any movie she wanted after 2023's Barbie racked up nearly $1.5 billion at the box office. She chose to make Narnia: The Magician's Nephew for Netflix, an adaptation of C.S. Lewis' sixth novel in The Chronicles of Narnia series. Gerwig has said little publicly about the film, other than that she was inspired by 1960s-era David Bowie, although she said it would not be a musical. Netflix just released the trailer, set to \"Stairway to Heaven,\" and it's quite the psychedelic ride. The first book in the series, The Lion, the Witch, and the Wardrobe , was published in 1950, and Lewis did not initially intend to write any more Narnia adventures. But then an acquaintance asked how the London lamppost ended up in the middle of Narnia's woodland, and Lewis was intrigued enough by the question to start a prequel, The Magician's Nephew, in order to find an answer. Lewis found it difficult to finish the book, however, writing four other Narnia books first before completing The Magician's Nephew in 1955. There have been several adaptations, in various media, of The Chronicles of Narnia , most recently the early 2000s film franchise adapting the first three novels in the series. Those films showed diminishing returns, however, and by 2011 the film rights had expired. There were initial plans to adapt the fourth novel, The Silver Chair . Read full article Comments", "date_str": "2026-10-14T19:10:58+00:00", "hash": "54195a0292c2686a", "title_fa": "گرتا گرویگ بووی را در تریلر روانگردان برادرزاده شعبده باز پخش می کند", "summary_fa": "گرتا گرویگ کارگردان می‌توانست تقریباً هر فیلمی را که می‌خواست بسازد، بعد از اینکه باربی در سال ۲۰۲۳ نزدیک به ۱.۵ میلیارد دلار در باکس آفیس به دست آورد. او تصمیم گرفت نارنیا: برادرزاده شعبده باز را برای نتفلیکس بسازد که اقتباسی از ششمین رمان سی.اس. لوئیس در مجموعه The Chronicles of Narnia است. گرویگ علناً در مورد این فیلم چیزی نگفته است، به جز اینکه از دیوید بووی دوران دهه 1960 الهام گرفته شده است، اگرچه او گفت که این فیلم موزیکال نخواهد بود. نتفلیکس به تازگی این تریلر را منتشر کرده است که برای «پلکانی به سوی بهشت» تنظیم شده است، و کاملاً روانگردان است. اولین کتاب از این مجموعه، شیر، جادوگر و کمد لباس، در سال 1950 منتشر شد و لوئیس در ابتدا قصد نداشت دیگر ماجراهای نارنیا را بنویسد. اما سپس یکی از آشنایان پرسید که چگونه تیر چراغ لندن در وسط جنگل نارنیا قرار گرفت و لوئیس به اندازه کافی مجذوب این سوال شد که برای یافتن پاسخ، پیش درآمدی به نام برادرزاده جادوگر را شروع کند. لوئیس به سختی کتاب را به پایان رساند، با این حال، ابتدا چهار کتاب دیگر نارنیا را قبل از تکمیل برادرزاده شعبده باز در سال 1955 نوشت. چندین اقتباس از The Chronicles of Narnia در رسانه های مختلف انجام شده است، آخرین فرانچایز فیلم اوایل دهه 2000 که اقتباس از سه رمان اول این مجموعه بود. با این حال، این فیلم‌ها بازدهی رو به کاهشی داشتند و تا سال 2011 حقوق فیلم منقضی شده بود. برنامه های اولیه برای اقتباس از رمان چهارم، صندلی نقره ای وجود داشت. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش کارگردان گرتا گرویگ می‌توانست تقریباً هر فیلمی را که می‌خواست"}, {"source": "Ars Technica", "title": "Researchers use AI to design proteins that cut up other proteins", "link": "https://arstechnica.com/science/2026/10/researchers-use-ai-to-design-proteins-that-cut-up-other-proteins/", "summary": "A protein is a chain of amino acids held together by what are called peptide bonds. On their own, those bonds are extremely stable; they're estimated to have a half-life of several hundred years. But in Earth's environment, most proteins don't last nearly that long. That's because organisms have evolved a handful of ways to catalyze the break-up of peptide bonds, which have diversified into countless specialized protein-digesting enzymes. Proteases are everywhere and generally make short work of any proteins that find their way into the environment. Now, researchers have basically short-circuited the diversification process, using AI-based protein design tools to take the catalytic core of two types of protease and replace the entire rest of the protein. The resulting enzymes could be tuned to cut specific proteins in half, and the researchers demonstrated their effectiveness by using them to cut proteins associated with neurological diseases. Cutting proteins The basic peptide bond isn't especially interesting-looking—it's what you get when you link an amino group to an acid, releasing a water molecule in the process. As their name implies, amino acids have both an amino and an acid group, allowing them to form peptide bonds on two sides of the amino acid. This is critical for building up the long chains found in proteins. (The amino acids also have side chains with distinctive chemistry, which gives a backbone specific properties.) Read full article Comments", "date_str": "2026-10-14T17:10:15+00:00", "hash": "0a2daaeac0c534eb", "title_fa": "محققان از هوش مصنوعی برای طراحی پروتئین هایی استفاده می کنند که پروتئین های دیگر را قطع می کند", "summary_fa": "پروتئین زنجیره ای از اسیدهای آمینه است که توسط پیوندهای پپتیدی به هم متصل می شوند. این اوراق به خودی خود بسیار پایدار هستند. تخمین زده می شود که نیمه عمر آنها چند صد سال است. اما در محیط زمین، بیشتر پروتئین ها به این اندازه دوام نمی آورند. به این دلیل که ارگانیسم‌ها روش‌های انگشت شماری را برای کاتالیز کردن شکستن پیوندهای پپتیدی که به آنزیم‌های تخصصی هضم پروتئین بی‌شماری متنوع شده‌اند، تکامل داده‌اند. پروتئازها در همه جا وجود دارند و به طور کلی پروتئین هایی را که به محیط زیست راه پیدا می کنند، کوتاه می کنند. اکنون، محققان اساساً فرآیند تنوع را با استفاده از ابزارهای طراحی پروتئین مبتنی بر هوش مصنوعی برای برداشتن هسته کاتالیزوری دو نوع پروتئاز و جایگزینی کل بقیه پروتئین، کوتاه کرده‌اند. آنزیم‌های به‌دست‌آمده را می‌توان تنظیم کرد تا پروتئین‌های خاص را به نصف برش دهند و محققان با استفاده از آن‌ها برای کاهش پروتئین‌های مرتبط با بیماری‌های عصبی، اثربخشی خود را نشان دادند. برش پروتئین ها پیوند پپتیدی پایه به خصوص ظاهر جالبی ندارد - این همان چیزی است که وقتی یک گروه آمینه را به یک اسید پیوند می دهید و یک مولکول آب را در این فرآیند آزاد می کنید، بدست می آورید. همانطور که از نام آنها پیداست، اسیدهای آمینه دارای هر دو گروه آمینو و اسیدی هستند که به آنها اجازه می دهد پیوندهای پپتیدی در دو طرف اسید آمینه تشکیل دهند. این برای ایجاد زنجیره های بلند موجود در پروتئین ها حیاتی است. (اسیدهای آمینه همچنین دارای زنجیره‌های جانبی با شیمی متمایز هستند که به ستون فقرات خاصیت خاصی می‌دهد.) مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن به ناو یک پروتئین زنجیره‌ای از اسیدهای آمینه است"}, {"source": "Ars Technica", "title": "Recording device hidden in toilet paper found in top-secret OpenAI meeting room", "link": "https://arstechnica.com/tech-policy/2026/10/fbi-arrests-openai-engineer-suspected-of-planting-bug-in-conference-room/", "summary": "It took OpenAI two days to notice that a recording device was hidden in a restricted executive conference room where leadership met to discuss highly confidential information, including technical progress, government engagements, and commercial partnerships. Only those with special clearance are supposed to access that room. But the FBI believes the recording device was planted by Abdulrahman Alfozan, a 35-year-old engineer from Saudi Arabia, who became a permanent US legal resident in 2020. In a press release Tuesday announcing his arrest, the FBI alleged that chatbot logs and CCTV footage suggested that Alfozan—who worked as an OpenAI engineer for more than a year—sought to use the device to spy on OpenAI and risked leaking trade secrets in a way that threatened national security. To conceal the USB device, Alfozan allegedly wrapped it in toilet paper, then plugged it into the back of a conference room television. The device was likely planted on September 28, and OpenAI found it on September 30 and quickly determined that its contents were encrypted, the FBI said. Days later, on October 5, OpenAI installed a camera in that conference room, and the CCTV footage allegedly showed Alfozan attempting to retrieve the recording device that same day. Read full article Comments", "date_str": "2026-10-14T16:41:49+00:00", "hash": "c24ab9efe631af1c", "title_fa": "دستگاه ضبط پنهان شده در دستمال توالت در اتاق جلسه فوق سری OpenAI پیدا شد", "summary_fa": "دو روز طول کشید تا OpenAI متوجه شود که یک دستگاه ضبط در یک اتاق کنفرانس اجرایی محدود پنهان شده است، جایی که رهبری برای بحث در مورد اطلاعات بسیار محرمانه، از جمله پیشرفت فنی، تعهدات دولتی، و مشارکت های تجاری تشکیل جلسه داده است. فقط کسانی که مجوز ویژه دارند باید به آن اتاق دسترسی داشته باشند. اما اف‌بی‌آی بر این باور است که دستگاه ضبط توسط عبدالرحمن الفوزان، مهندس 35 ساله از عربستان سعودی که در سال 2020 اقامت دائم قانونی آمریکا را دریافت کرده بود، کار گذاشته شده است. اف‌بی‌آی در بیانیه‌ای مطبوعاتی که روز سه‌شنبه دستگیری وی را اعلام کرد، ادعا کرد که گزارش‌های چت بات و فیلم‌های دوربین‌های مداربسته نشان می‌دهند که آلفوزان - که بیش از یک سال به عنوان مهندس OpenAI کار می‌کرد - به دنبال استفاده از این دستگاه برای جاسوسی از OpenAI بوده و خطر افشای اسرار تجاری را به‌گونه‌ای که امنیت ملی را تهدید می‌کند، داشته است. ظاهراً آلفوزان برای پنهان کردن دستگاه USB، آن را در دستمال توالت پیچیده و سپس آن را به پشت تلویزیون اتاق کنفرانس وصل کرده است. FBI گفت که این دستگاه احتمالاً در 28 سپتامبر کاشته شده بود و OpenAI آن را در 30 سپتامبر پیدا کرد و به سرعت تشخیص داد که محتویات آن رمزگذاری شده است. چند روز بعد، در 5 اکتبر، OpenAI دوربینی را در آن اتاق کنفرانس نصب کرد و ظاهراً فیلم‌های دوربین مداربسته نشان می‌دهد که آلفوزان در همان روز تلاش می‌کند دستگاه ضبط را بازیابی کند. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسد دو روز طول کشید تا OpenAI متوجه شود که یک دستگاه ضبط در یک اتاق کنفرانس اجرایی محدود پنهان شده است، جایی که"}, {"source": "Ars Technica", "title": "Legendary FPS level designer Richard \"Levelord\" Gray dies at 68", "link": "https://arstechnica.com/gaming/2026/10/legendary-fps-level-designer-richard-levelord-gray-passes-away-at-68/", "summary": "Prolific first-person shooter level designer Richard \"Levelord\" Gray died Monday at the age of 68, based on reports shared on social media by Apogee Entertainment yesterday. He had \"dealt with cancer on and off for a while now,\" according to former colleague Joe Siegler . After studying computer engineering in the '80s and tinkering on some early games in COBOL, Gray broke into the industry at the age of 35 in 1994 with the launch of GrayDoom , a set of four maps for the then-new Doom that were widely shared on CompuServe and beyond. The work attracted the attention of Q Studios' Nick Newhard, who contracted Gray to work on level design for the late '90s cult classic Blood . Gray was subsequently hired by 3D Realms, where he said he was given free rein in designing \"half the levels\" for Duke Nukem 3D . There, he was also responsible for the famous, signed \"You're Not Supposed to Be Here\" easter egg , which players could find only by using cheats to explore outside of the usual confines of the map. Read full article Comments", "date_str": "2026-10-14T16:02:08+00:00", "hash": "8483fde55e45dbfb", "title_fa": "طراح افسانه‌ای سطح FPS ریچارد \"Levelord\" گری در 68 سالگی درگذشت", "summary_fa": "بر اساس گزارش‌هایی که روز گذشته توسط Apogee Entertainment در رسانه‌های اجتماعی به اشتراک گذاشته شد، ریچارد \"Levelord\" گری، طراح پرکار سطح تیراندازی اول شخص، روز دوشنبه در سن 68 سالگی درگذشت. به گفته همکار سابق جو سیگلر، او مدتی بود که با سرطان دست و پنجه نرم می کرد. پس از تحصیل در رشته مهندسی کامپیوتر در دهه 80 و بررسی برخی از بازی‌های اولیه در COBOL، گری در سال 1994 با راه‌اندازی GrayDoom در سن 35 سالگی وارد صنعت شد، مجموعه‌ای از چهار نقشه برای Doom در آن زمان جدید که به طور گسترده در CompuServe و فراتر از آن به اشتراک گذا  Story ذخیره این داستان روز پنجشنبه، محققان آزمایشگاه Citizen در دانشگاه تورنتو بدترین سناریوی موجود در طبیعت را فاش کردند: جاسوس‌افزارهایی که اهداف را در بی‌صدا هنگام مرور تبلیغات گذشته در زندگی دیجیتالی روزانه خود آلوده می‌کنند. محققان با لقب «AdFection» به این حملات، کمپینی را مستند کردند که در آن یک شرکت تبلیغاتی ثبت شده در اسرائیل ظاهراً به سرورهای مرتبط با یک شرکت جاسوس‌افزار متصل شده و ده‌ها دستگاه را با بدافزار تهاجمی خود آلوده کرده است. Citizen Lab بر این باور است که این اولین شواهد فنی دقیقی است که از طریق تبلیغات دیجیتالی دستگاه های آلوده کننده نرم افزارهای جاسوسی پیچیده در دسترس عموم قرار گرفته است. هک‌های صفر کلیک یک جام مقدس برای مهاجمان و فاجعه‌بار برای قربانیان هستند، زیرا می‌توانند به طور خودکار بدافزار را روی دستگاه‌ها نصب کنند، بدون اینکه نیازی به تعامل یا اشتباه از هدف داشته باشند. زمانی که هکرهای پیشرفته در سال‌های اخیر حملات نادری را با کلیک صفر انجام داده‌اند، اغلب از آسیب‌پذیری‌های موجود در برنامه‌های پیام‌رسانی و ارتباطی موبایل برای آلوده کردن قربانیان سوءاستفاده کرده‌اند. اما مهاجمان همچنین از زیرساخت گسترده اکوسیستم تبلیغات آنلاین برای توزیع بدافزار سوء استفاده کرده‌اند، که گاهی اوقات بدون نیاز به تعامل با قربانیان است. شواهدی از کمپین نرم‌افزار جاسوسی صفر کلیک که محققان آزمایشگاه Citizen کشف کردند، ادغام دو تهدید را نشان می‌دهد و بر گستردگی و فوریت خطر تأکید می‌کند. Bill Marczak، محقق ارشد در Citizen Lab می گوید: «AdFection به اپراتورها اجازه می دهد تا به طور خودکار افراد خاصی را با استفاده از نرم افزارهای جاسوسی مزدور هنگام استفاده از برنامه ها یا مرور اینترنت هک کنند."}, {"source": "Wired", "title": "The Best Permanent Outdoor Lights (2026): Govee, Eufy, Cync", "link": "https://www.wired.com/story/should-you-get-permanent-outdoor-lights/", "summary": "Permanent eave lights that attach to the exterior of your home are becoming more popular. But are they worth the effort and cost?", "date_str": "2026-10-15T09:36:00+00:00", "hash": "8d9431a3a2539bda", "title_fa": "بهترین چراغ‌های دائمی فضای باز (2026): Govee، Eufy، Cync", "summary_fa": "چر
