تشر کرد که با نزدیک‌ترین ششم پینت اندازه‌گیری می‌شد. ایلان ماسک، ثروتمندترین مرد جهان، در حال حاضر پس از نوشیدن سه پینت کامل در طول حضورش در برنامه Collison، در صدر جدول قرار دارد. معرفی The Cheeky Pint Benchmark. ما کارآموزمان را وادار کردیم که هر قسمت از Cheeky Pint را تماشا کند تا این تفکیک پینت‌هایی را که مهمانان می‌نوشند تا ششم به شما برساند. تبریک به @elonmusk که در حال حاضر با سه پینت کامل گینس پیشتاز است. pic.twitter.com/YTTP4P6BSA — etn. (@etnshow) 13 اکتبر 2026 نمودار واکنش‌های رقابتی مشخصی را از دنیای فناوری برانگیخت. آنتونیو گارسیا مارتینز، کارگردان بیس، گفت که معیار \"به طور کلی سس ضعیف\" است. 1. ثروتمندترین مرد جهان بیش از همه نوشید. 2. این سس به طور کلی بسیار ضعیف است، اگرچه برای افرادی که در یک پادکست عمومی با شهرت در خط 3 هستند بد نیست. یک جورهایی"}, {"source": "Business Insider", "title": "How top brands are hunting for the next breakout influencer", "link": "https://www.businessinsider.com/platforms-and-techniques-marketers-are-using-to-discover-creators-2026-10", "summary": "Marketers at CMO Insider s The AI Marketer: Creator and Influencer Edition roundtable held during Advertising Week New York shared their strategies for discovering the next breakout influencer talent. Derek French A version of this post appears in the CMO Insider newsletter. Sign up for Business Insider's weekly marketing newsletter . Marketers are getting smarter about finding their next influencer partners . At a CMO Insider roundtable during Advertising Week New York, top marketers told us how they're using AI-powered platforms , social listening tools, and some surprisingly old-fashioned tactics to discover new creators and niche communities. Meredith Diehn, SVP of marketing at Goodwipes, said her company recently adopted the influencer discovery tool Modash, which has significantly reduced manual work in identifying potential partners, freeing up the team to review creators' previous content and determine whether they're a good fit. Goodwipes' searches using Modash are remarkably granular, Diehn said. \"I'm going to find a creator who is a girl with IBS who lives in Nashville,\" she said. Diehn's team is also using a social listening tool called Nectar to uncover microcommunities already talking about the brand that might not have been obvious targets. Diehn said Goodwipes is exploring opportunities to reach communities like postpartum mothers, whose needs can make flushable wipes particularly useful. Alicia Latoya Richardson, head of community and partnerships at the creator membership community FiveTwoNine, said brands are finding success using a tool called Companion, from its parent company Billion Dollar Boy Group, to search for creators across different geographies and demographics and assess their potential value. For its client Adobe, for example, FiveTwoNine has used Companion to analyze posts created by attendees at its events and estimate the resulting earned media value . (EMV is a measure of what the same reach or engagement would have cost if bought through paid ads.) \"AI has definitely elevated the way we report to clients on value,\" Richardson said. Mars Pet Nutrition is also using AI-powered creator-discovery tools to help it cast a wider net when searching for creators and narrow the pool to candidates most likely to deliver reach and engagement. But there are still some areas where the tech falls short, said Paolo Narag, creative excellence lead at Mars Pet Nutrition. Earlier this year, while he was working on its Sheba brand, Narag's", "date_str": "2026-10-14T11:00:01+00:00", "hash": "8b822c2e5afe743e", "title_fa": "چگونه برندهای برتر به دنبال اینفلوئنسر بعدی هستند", "summary_fa": "بازاریابان در میزگرد CMO Insiders The AI ​​Marketer: Creator and Influencer Edition که در هفته تبلیغات نیویورک برگزار شد، استراتژی‌های خود را برای کشف استعدادهای اینفلوئنسر بعدی به اشتراک گذاشتند. درک فرانسوی نسخه ای از این پست در خبرنامه CMO Insider ظاهر می شود. برای خبرنامه بازاریابی هفتگی Business Insider ثبت نام کنید. بازاریابان در مورد یافتن شرکای تأثیرگذار بعدی خود هوشمندتر می شوند. در میزگرد CMO Insider در هفته تبلیغات نیویورک، بازاریابان برتر به ما گفتند که چگونه از پلتفرم‌های مبتنی بر هوش مصنوعی، ابزارهای شنیداری اجتماعی و برخی تاکتیک‌های قدیمی و شگفت‌آور برای کشف سازندگان جدید و جوامع خاص استفاده می‌کنند. مردیث دیهن، معاون بازاریابی در Goodwipes، گفت که شرکت او اخیراً ابزار کشف تأثیرگذار Modash را به کار گرفته است که کار دستی را در شناسایی شرکای بالقوه به میزان قابل توجهی کاهش داده است و تیم را آزاد می کند تا محتوای قبلی سازندگان را بررسی کند و مشخص کند که آیا آنها مناسب هستند یا خیر. دیهن گفت که جستجوهای Goodwipes با استفاده از Modash به طور قابل توجهی دقیق هستند. او گفت: \"من می خواهم خالقی پیدا کنم که دختری مبتلا به IBS است که در نشویل زندگی می کند.\" تیم Diehn همچنین از یک ابزار شنیداری اجتماعی به نام Nectar برای کشف جوامع کوچکی که قبلاً در مورد نام تجاری صحبت می‌کردند استفاده می‌کنند که ممکن است اهداف واضحی نبوده باشند. دیهن گفت Goodwipes در حال بررسی فرصت‌هایی برای دسترسی به جوامعی مانند مادران پس از زایمان است که نیازهای آن‌ها می‌تواند دستمال‌های قابل شستشو را بسیار مفید کند. آلیسیا لاتویا ریچاردسون، رئیس انجمن و مشارکت در انجمن عضویت خالقان FiveTwoNine، گفت که برندها با استفاده از ابزاری به نام Companion، از شرکت مادر Billion Dollar Boy Group، برای جستجوی سازندگان در مناطق جغرافیایی و جمعیتی مختلف و ارزیابی ارزش بالقوه‌شان، به موفقیت"}, {"source": "Business Insider", "title": "I moved from the US to Spain and lost over 15 pounds without dieting. I still eat bread and pastries and drink beer.", "link": "https://www.businessinsider.com/moved-us-spain-lost-weight-without-dieting-2026-10", "summary": "The author moved her family from Connecticut to Spain. Courtesy of the author I moved my family from Connecticut to Spain and lost over 15 pounds without trying. I still eat bread and pastries and drink beer, but I walk much more than I did in the US. The lifestyle change has improved my physical health and helped me feel less anxious. I moved my family of four from Connecticut to Spain in August 2025. Since then, I've lost more than 15 pounds. I didn't go on a diet. I didn't start a workout plan . I didn't give up bread, beer, or pastries. I simply changed where I lived. I drove almost everywhere in the US Before we moved, my husband, our boys, and I lived in a town where you needed a car to get almost anywhere. I worked from home as a copywriter, and on a typical day, I averaged about 3,000 steps. For years, I tried to change that. Every few months, I'd start a new fitness plan or decide to eat differently. I bought a Peloton. I even got an under-the-desk walking pad so I could get steps in while I worked. At one point, I added a weighted vest. I was constantly trying to fit healthy habits into a life that left little room. I'd stick with something for a while, fall off track, and then get frustrated with myself for not being disciplined enough. The author walks more now that she has moved to Spain. Courtesy of the author It wasn't just exercise. Most days, I felt like I was racing something. There was always another email, deadline, or thing I should have been doing. I was running a business, taking care of kids, managing a household, and trying to squeeze my own health somewhere into the margins. I was also taking medication for anxiety . I'd been on it for a couple of years, and questioned if it was helping at all. I constantly felt on edge. Like I was never doing enough, I couldn't relax. Then we moved to Las Rozas de Madrid. I walk 12,000 steps in Madrid For the first time in my adult life, I don't have a car. Our boys' school is in another town, so we walk to the train, then switch to a bus, for drop-off and pickup. Our neighborhood is walkable — the grocery store, pharmacy, library, and hair salon are all within about 10 minutes of our flat. These days, I average around 12,000 steps a day without even trying. That's four times what I was doing back in Connecticut. We live at the top of a hill, so I walk up it sometimes several times a day. I carry groceries home. I walk to appointments. I walk because I need to get somewhere, not because I schedul", "date_str": "2026-10-14T10:51:01+00:00", "hash": "1fe9d8483ea00dcd", "title_fa": "من از ایالات متحده به اسپانیا نقل مکان کردم و بدون رژیم بیش از 15 پوند وزن کم کردم. من هنوز نان و شیرینی می خورم و آبجو می نوشم.", "summary_fa": "نویسنده خانواده خود را از کانکتیکات به اسپانیا نقل مکان کرد. با حسن نیت نویسنده، خانواده ام را از کانکتیکات به اسپانیا نقل مکان کردم و بدون تلاش بیش از 15 پوند وزن کم کردم. من هنوز نان و شیرینی می‌خورم و آبجو می‌نوشم، اما خیلی بیشتر از ایالات متحده پیاده روی می‌کنم. تغییر سبک زندگی سلامت جسمی من را بهبود بخشیده و به من کمک کرده تا کمتر احساس اضطراب کنم. من خانواده چهار نفره ام را در آگوست 2025 از کانکتیکات به اسپانیا نقل مکان کردم. از آن زمان تاکنون، بیش از 15 پوند وزن کم کرده ام. من رژیم نگرفتم من برنامه تمرینی را شروع نکردم. من نان، آبجو یا شیرینی را رها نکردم. من به سادگی محل زندگی خود را تغییر دادم. من تقریباً در همه جا در ایالات متحده رانندگی کردم قبل از نقل مکان، من و شوهرم، پسرانمان، و من در شهری زندگی می کردیم که تقریباً برای رسیدن به هر جایی به ماشین نیاز داشتید. من در خانه به عنوان یک کپی رایتر کار می کردم و در یک روز معمولی، به طور متوسط ​​حدود 3000 قدم را طی می کردم. سال‌ها سعی کردم آن را تغییر دهم. هر چند ماه یکبار برنامه تناسب اندام جدیدی را شروع می کردم یا تصمیم می گرفتم متفاوت غذا بخورم. من یک پلتون خریدم. حتی یک پد پیاده‌روی زیر میز گرفتم تا بتوانم در حین کار از پله‌ها بروم. در یک نقطه، من یک جلیقه وزنی اضافه کردم. من دائماً در تلاش بودم تا عادات سالم را در زندگی جا بیندازم که جای کمی باقی می گذاشت. مدتی به چیزی پایبند می‌شوم، از مسیر خارج می‌شدم و بعد از اینکه به اندازه کافی نظم و انضباط نداشتم از خودم ناامید می‌شدم. نویسنده اکنون که به اسپانیا نقل مکان کرده است، بیشتر راه می رود. لطف نویسنده"}, {"source": "Business Insider", "title": "My wife and I have a 30-year age gap and run a dating site together. I've been divorced 3 times — there won't be a fourth.", "link": "https://www.businessinsider.com/married-age-gap-run-dating-site-together-2026-10", "summary": "Brandon Wade and his wife, Dana. Courtesy of Seeking Brandon Wade met his wife on the site he founded, formerly known as Seeking Arrangements. A self-professed nerdy guy, he wanted a dating site that let him highlight his ability to provide. He was a multimillionaire when they met, but the couple doesn't have a pre-nuptial. This as-told-to essay is based on a conversation with Brandon Wade, co-CEO of Seeking . It has been edited for length and clarity . When I met my wife, Dana, back in 2020, I wasn't in a good place. I had just celebrated my 50th birthday alone. I'd already been married and divorced three times , which was quite painful. I no longer believed in love. I was immediately attracted to Dana — with online dating , attraction is very important. The day after she messaged me, we talked on the phone for four hours. A few days later, I flew from my home in Vegas to Florida to meet her. We discovered that — despite our 30-year age gap — we have similar values and upbringings. Dana is hugely ambitious and wasn't afraid to ask me hard questions, like \"What's your biggest fear?\" Loneliness is my greatest fear. But when I met Dana, I realized it didn't need to be my fate. I felt left behind by dating sites When I was a younger man, I felt left behind by the dating industry . I was successful and nerdy — an MIT grad. I'd focused so much on academics and success that my social skills suffered. Picking up women wasn't something that came naturally to me. I wanted to design a dating site that let men like me flex what we really have to offer: our competency, capability, success, and ambition. I launched Seeking Arrangements in 2006. We were clear about our intention to match younger women with successful men. A lot of people thought this idea had a negative connotation. Most of the judgment was directed at the women. But women shouldn't be judged for wanting more from life, and from who they're dating. Wanting a generous, successful, ambitious partner isn't a moral or ethical failing. My parents have been married for nearly 60 years In 2019, my company rebranded as Seeking and banned transactional dating. To me, transactional dating means setting concrete parameters, such as \"If you give me X, I'll do Y.\" All relationships are transactional in some ways, but there shouldn't be scorekeeping. As Seeking, the company still aims to connect successful, ambitious people. Most of the women on our site are ages 18-35, while the men are ages 30-60. An age gap as big", "date_str": "2026-10-14T10:23:01+00:00", "hash": "e158eb7561695505", "title_fa": "من و همسرم 30 سال فاصله سنی داریم و با هم یک سایت دوستیابی راه اندازی می کنیم. من 3 بار طلاق گرفته ام - چهارمی وجود نخواهد داشت.", "summary_fa": "براندون وید و همسرش دانا. با حسن نیت از Seeking Brandon Wade با همسرش در سایتی که او تأسیس کرده بود ملاقات کرد، که قبلاً به عنوان Seeking Arrangements شناخته می شد. او که یک مرد عصبی خود را می‌داند، یک سایت دوستیابی می‌خواست که به او اجازه دهد توانایی‌هایش را در ارائه خدمات برجسته کند. او یک مولتی میلیونر بود که آنها با هم آشنا شدند، اما این زوج قبل از ازدواج ندارند. این مقاله همانطور که گفته شد بر اساس گفتگو با براندون وید، یکی از مدیران اجرایی Seking است. برای طول و وضوح ویرایش شده است. وقتی در سال 2020 با همسرم دانا آشنا شدم، در جای خوبی نبودم. من تازه تولد 50 سالگی ام را به تنهایی جشن گرفته بودم. من قبلاً سه بار ازدواج کرده بودم و طلاق گرفته بودم که بسیار دردناک بود. من دیگر به عشق اعتقاد نداشتم. من بلافاصله جذب دانا شدم - با قرار آنلاین، جذابیت بسیار مهم است. فردای آن روز که او به من پیام داد، چهار ساعت تلفنی صحبت کردیم. چند روز بعد، از خانه ام در وگاس به فلوریدا پرواز کردم تا او را ملاقات کنم. ما متوجه شدیم که - با وجود فاصله سنی 30 ساله - ما ارزش ها و تربیت های مشابهی داریم. دانا بسیار جاه طلب است و از پرسیدن سوالات سخت از من نمی ترسید، مانند \"بزرگترین ترس شما چیست؟\" تنهایی بزرگترین ترس منه اما وقتی با دانا آشنا شدم، متوجه شدم که این سرنوشت من نیست. من احساس می کردم که از سایت های دوستیابی عقب مانده ام. من موفق و عصبی بودم - فارغ التحصیل MIT. آنقدر روی تحصیلات و موفقیت تمرکز کرده بودم که مهارت های اجتماعی ام آسیب دید. جمع کردن زنان چیزی نبود که به طور طبیعی برای من اتفاق بیفتد. من می‌خواستم یک سایت دوستیابی طراحی"}, {"source": "Business Insider", "title": "WFH helped create the AI revolution. RTO could pose its biggest problem.", "link": "https://www.businessinsider.com/remote-work-impact-ai-fertility-air-quality-rto-wfh-2026-10", "summary": "Maskot/Getty Images This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . A baby boom, cleaner air, and AI. The work-from-home revolution might be over, but its impact is still being felt. Many of us have settled into some type of hybrid setup, balancing our days in the office with at least one spent at home. But even if you're in the cubicles every day — God bless — the WFH revolution has still affected you. Nick Bloom, a Stanford economist who's a leading expert on remote work, spoke to BI's Aki Ito about six ways the WFH era fundamentally changed things for us all . Some are a bit … personal. Remote work led to a 5% increase in fertility in the US and Northern Europe, according to Bloom's estimates. He summed it up with a line from a friend: \"My wife and I discovered she can't get pregnant by email.\" Other effects were more widespread, such as a reduction in nitrogen dioxide in major cities thanks to the new hybrid world. But the biggest residual from the WFH era is what's dominating our current workplace convos: artificial intelligence. Bloom makes a strong case for why WFH crawled so AI could walk. Digital communications surged when we abandoned our offices, creating a treasure trove of data for models to learn on. The casual water-cooler conversation became a documented Slack thread that could be fed into an LLM. Now that most of us are in the office at least part of the time, that raises questions about how companies will source more training data. Having picked the internet to pieces, AI companies are getting desperate for training data . They've gone so far as to create virtual workplaces . Granted, people still Slack each other in the office. (I've fired off messages to colleagues sitting a few feet away. Sometimes you've got to see if you can actually make them \"lol\" IRL.) There's still a level of communication that goes undocumented, though. The quick coffee chat to brainstorm an idea. The impromptu deskside conversation. That's why executives were pushing us back to the office in the first place. For the organic collaboration and innovation that can only occur when rubbing elbows with colleagues. That RTO push could now pose real problems for AI's development. Companies could bug their own offices, making sure they pick up every little conversation, however benign, between workers. But that comes with plenty of legal and regulatory issues. And at a time when worke", "date_str": "2026-10-14T10:20:13+00:00", "hash": "6006707a7e4eab47", "title_fa": "WFH به ایجاد انقلاب هوش مصنوعی کمک کرد. RTO می تواند بزرگترین مشکل آن باشد.", "summary_fa": "Maskot/Getty Images این پست در اصل در خبرنامه Business Insider Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. کودک بوم، هوای پاک‌تر و هوش مصنوعی. انقلاب کار از خانه ممکن است به پایان رسیده باشد، اما تاثیر آن هنوز محسوس است. بسیاری از ما به نوعی از تنظیمات هیبریدی مستقر شده‌ایم و روزهای خود را در دفتر با حداقل یک مورد در خانه متعادل می‌کنیم. اما حتی اگر هر روز در اتاقک باشید - خدا رحمت کند - انقلاب WFH هنوز بر شما تأثیر گذاشته است. نیک بلوم، اقتصاددان استنفورد که یک متخصص برجسته در کار از راه دور است، با آکی ایتو از BI در مورد شش راه صحبت کرد که دوران WFH اساساً همه چیز را برای همه ما تغییر داد. برخی از آنها کمی … شخصی هستند. بر اساس تخمین بلوم، کار از راه دور منجر به افزایش 5 درصدی باروری در ایالات متحده و شمال اروپا شد. او آن را با جمله ای از یکی از دوستان خلاصه کرد: \"من و همسرم متوجه شدیم که او نمی تواند با ایمیل باردار شود.\" اثرات دیگر گسترده تر بود، مانند کاهش دی اکسید نیتروژن در شهرهای بزرگ به لطف دنیای هیبریدی جدید. اما بزرگترین باقیمانده از دوران WFH چیزی است که بر مجامع فعلی محل کار ما تسلط دارد: هوش مصنوعی. بلوم دلیل محکمی برای اینکه چرا WFH خزیده تا هوش مصنوعی بتواند راه برود، ارائه می دهد. ارتباطات دیجیتال زمانی افزایش یافت که ما دفاتر خود را رها کردیم و گنجینه ای از داده ها را برای مدل ها به وجود آوردند تا بتوانند با آن ها یاد بگیرند. مکالمه معمولی آبسردکن تبدیل به یک رشته Slack مستند شد که می‌توانست به یک LLM وارد شود. اکنون که اکثر ما حداقل در بخشی از زمان در دفتر هستیم، این سؤالاتی"}, {"source": "Business Insider", "title": "Caregivers are facing a \"generosity paradox\": Paying for loved ones but not wanting their kids to do so for them", "link": "https://www.businessinsider.com/caregiving-long-term-care-eldercare-financial-security-generosity-paradox-2026-10", "summary": "Barbara Marcanti, Carla Bacon, and Kathleen Korpela have all navigated caring for their aging loved ones. Barbara Marcanti/Carla Bacon/Danielle Barnum Photography Caregivers risk financial security to support older loved ones, creating a \"generosity paradox.\" An Edward Jones report reveals caregivers spend $8,700 yearly, sacrificing savings for loved ones. Long-term care costs strain families, with many spending six figures on nursing facilities annually. Many caregivers for older loved ones are stuck in a painful dilemma: They're willing to put their financial security at stake to care for loved ones today, but that leaves them at risk of being a burden on their families later on as they age. This \"generosity paradox\" is at the heart of \"The Financial Impact of Caregiving\" report by Edward Jones, Age Wave, and The Harris Poll, which was shared exclusively with Business Insider. The report found 87% of caregivers providing financial assistance agreed that they didn't want to feel like a burden, while 81% said they were willing to put themselves in a less secure financial position to support their loved ones. These results are based on over 5,000 adults in the US and Canada who are financial caregivers of people aged 65 and over or aged 18 to 64 with disabilities. It's a contrast that, according to dozens of caregivers who have spoken with Business Insider, has weighed on them emotionally. Many told reporters that reducing their financial security puts them at greater risk of needing support as their health declines , making them feel like a burden. They hope their children won't need to support them to the same extent that they supported their parents. We are inviting readers to share their stories with Business Insider reporters to help us assemble a comprehensive look at long-term care costs. We want to know how much caring for an older loved one has cost you and your family. Please fill out this form to participate. The costs of caregiving have increasingly fallen on family and friends, both financially and personally. As the population ages, people are battling health conditions for longer, while support for long-term care has been more strained. Medicare doesn't support most long-term care costs, while Medicaid eligibility varies by state and is at risk in some pockets of the US. Long-term care costs have skyrocketed, and some families told Business Insider they're spending six figures annually on nursing facilities or home health aides. \"An overwhelm", "date_str": "2026-10-14T10:01:01+00:00", "hash": "eff53abfcc051335", "title_fa": "مراقبان با یک \"پارادوکس سخاوتمندی\" روبرو هستند: پرداخت هزینه برای عزیزانشان اما نمی خواهند فرزندانشان این کار را برای آنها انجام دهند.", "summary_fa": "باربارا مارکانتی، کارلا بیکن و کاتلین کورپلا همگی در مراقبت از عزیزان سالخورده خود تلاش کرده اند. باربارا مارکانتی/کارلا بیکن/دانیل بارنوم عکاسی مراقبین برای حمایت از عزیزان مسن‌تر امنیت مالی را به خطر می‌اندازند و «پارادوکس سخاوت» را ایجاد می‌کنند. گزارش ادوارد جونز نشان می دهد که مراقبان سالانه 8700 دلار خرج می کنند و پس انداز خود را فدای عزیزان خود می کنند. هزینه‌های مراقبت طولانی‌مدت خانواده‌ها را تحت فشار قرار می‌دهد و بسیاری از آنها سالانه شش رقم را برای تسهیلات پرستاری هزینه می‌کنند. بسیاری از مراقبان عزیزان بزرگتر در یک دوراهی دردناک گیر کرده اند: آنها امروز مایلند امنیت مالی خود را برای مراقبت از عزیزانشان به خطر بیندازند، اما این خطر باعث می شود که بعداً با بالا رفتن سن، بار سنگینی بر دوش خانواده خود بگذارند. این \"پارادوکس سخاوتمندی\" در قلب گزارش \"تأثیر مالی مراقبت\" توسط ادوارد جونز، ایج ویو و نظرسنجی هریس قرار دارد که به طور انحصاری با Business Insider به اشتراک گذاشته شده است. این گزارش نشان می‌دهد که 87 درصد از مراقبانی که کمک مالی می‌کنند موافق بودند که نمی‌خواهند احساس بار سنگینی کنند، در حالی که 81 درصد گفتند که مایلند خود را در موقعیت مالی کمتر امنی برای حمایت از عزیزانشان قرار دهند. این نتایج بر اساس بیش از 5000 بزرگسال در ایالات متحده و کانادا است که مراقب مالی افراد 65 سال و بالاتر یا 18 تا 64 سال دارای معلولیت هستند. این تضادی است که به گفته ده‌ها مراقبی که با Business Insider صحبت کرده‌اند، از نظر احساسی بر آنها سنگینی کرده است. بسیاری به خبرنگاران گفتند که کاهش امنیت مالی آنها را در معرض خطر بیشتری برای نیاز به حمایت قرار می دهد، زیرا سلامتی آنها کاهش می یابد و باعث می شود که آنها احساس سنگینی کنند. آنها امیدوارند که فرزندانشان به اندازه ای که"}, {"source": "Business Insider", "title": "You bailed on TV. But politicians are still spending all their money there.", "link": "https://www.businessinsider.com/political-campaign-2026-spending-internet-digital-tv-rob-flaherty-kafka-2026-10", "summary": "Elijah Nouvelage/Bloomberg via Getty Images; Sebastián Vivallo Oñate/Agencia Makro/Getty Images; Gary Miller/Getty Images; Adam Gray/Bloomberg via Getty Images; BI Audiences have been leaving TV for the internet for a very long time. Most advertisers have figured that out some time ago. But not political advertisers: They still spend the majority of their money on TV. Political consultant Rob Flaherty explains why. If you ask pundits, 2024 was the Podcast Election (which also means it was the YouTube Election ). And maybe 2026 is the Influencer Election . One thing the chattering class won't call it is the Television Election — because everyone knows everyone has stopped watching TV. Except that's not how political campaigns are run, at all. Even in 2026, more than 60% of the estimated $11.6 billion spent in this election cycle will go to good ol' fashioned broadcast and cable TV. Another 20% will be spent on streaming TV. If you think that doesn't leave a lot of room for things where you and most people you know spend a ton of time — YouTube, Reels, TikTok, etc. — you're right. Political pros know it, too. So why isn't that changing? I asked Rob Flaherty , who has spent most of his life doing digital politics for Democrats, including Hillary Clinton, Joe Biden, and, most recently, Kamala Harris . Flaherty offered up a bunch of reasons why TV remains so dominant in political spending, even as it gets less relevant to voters. But a base reason is simply that political operatives spent money on TV because other political operatives spend money there: Flaherty even admits that in his current work — co-running an anti-AI super PAC — he has been buying some TV time just so other people in politics will take him seriously. You can hear our entire conversation about how campaigns work in the TikTok era — and how they ought to work — on my Channels podcast. The following is an edited excerpt of our chat. Peter Kafka: You said that when you were working on the Harris campaign, you spent roughly 50-50 between TV and digital — but that most campaigns still spend 70% of their budget on TV. Make the best case for why a campaign should still spend half or more of its money on TV. Rob Flaherty: Well, I would not advocate for that. But I think the steelman case that you would hear is: Digital political ad inventory is actually quite limited. There are only so many places you can spend. Social media is not a mind-changing surface; it's a base-building surface. Meanwhile,", "date_str": "2026-10-14T10:00:01+00:00", "hash": "b326e011f992578e", "title_fa": "تو تلویزیون وثیقه گذاشتی اما سیاستمداران هنوز تمام پول خود را در آنجا خرج می کنند.", "summary_fa": "الیجا نوولاژ/ بلومبرگ از طریق گتی ایماژ. Sebastián Vivallo Oñate/Agencia Makro/Getty Images; گری میلر/گتی ایماژ; آدام گری/بلومبرگ از طریق گتی ایماژ. مدت‌هاست که مخاطبان BI تلویزیون را برای اینترنت ترک کرده‌اند. بیشتر تبلیغ کنندگان مدتی پیش متوجه این موضوع شده اند. اما نه تبلیغ‌کنندگان سیاسی: آنها هنوز اکثریت پول خود را در تلویزیون خرج می‌کنند. راب فلاهرتی مشاور سیاسی دلیل آن را توضیح می دهد. اگر از کارشناسان بپرسید، سال 2024 انتخابات پادکست بود (که همچنین به این معنی است که انتخابات YouTube بود). و شاید سال 2026 انتخابات اینفلوئنسر باشد. چیزی که طبقه ی پرحرف آن را انتخابات تلویزیونی نمی نامند – زیرا همه می دانند که همه تماشای تلویزیون را متوقف کرده اند. با این تفاوت که کارزارهای سیاسی اصلاً اینگونه نیست. حتی در سال 2026، بیش از 60 درصد از 11.6 میلیارد دلار تخمین زده شده در این چرخه انتخاباتی صرف پخش تلویزیونی خوب و کابلی خواهد شد. 20 درصد دیگر برای پخش تلویزیون هزینه خواهد شد. اگر فکر می‌کنید که فضای زیادی برای چیزهایی که شما و اکثر افرادی که می‌شناسید - YouTube، Reels، TikTok و غیره در آن‌ها وقت زیادی صرف می‌کنید، باقی نمی‌گذارد - درست می‌گویید. طرفداران سیاسی نیز آن را می دانند. پس چرا این تغییر نمی کند؟ از راب فلاهرتی پرسیدم که بیشتر عمر خود را صرف انجام سیاست دیجیتال برای دموکرات‌ها از جمله هیلاری کلینتون، جو بایدن و اخیراً کامالا هریس کرده است. فلاهرتی دلایل زیادی را ارائه کرد که چرا تلویزیون در مخارج سیاسی تا این حد مسلط باقی می ماند، حتی اگر کمتر به رای دهندگان مربوط شود. اما یک دلیل اصلی صرفاً این است که عوامل سیاسی در تلویزیون پول خرج می‌کنند زیرا سایر فعالان سیاسی در آنجا پول خرج می‌کنند: فلاهرتی حتی اعتراف می‌کند که در کار فعلی‌اش - که در یک ابر PAC ضد هوش مصنوعی"}, {"source": "Business Insider", "title": "How Anthropic's IPO could turn Leopold Aschenbrenner's best asset into his biggest risk", "link": "https://www.businessinsider.com/anthropic-ipo-situational-awareness-leopold-aschenbrenner-2026-10", "summary": "Leopold Aschenbrenner, founder of Situational Awareness. Fortune via Reuters Connect Leopold Aschenbrenner has become one of the world's best-known AI investors. His firm, Situational Awareness, primarily trades public equities, but holds a stake in Anthropic. When Anthropic goes public, his personal connections will add an additional layer of complexity. Leopold Aschenbrenner's pitch for why he — a college-aged German with no prior finance experience — was the best choice for an investor hoping to nail the artificial intelligence wave revolved around his network. \"Right now, there are perhaps a few hundred people, most of them in San Francisco and the AI labs, that have situational awareness,\" the former OpenAI employee wrote in his 2024 viral essay \"Situational Awareness: The Decade Ahead.\" \"Through whatever peculiar forces of fate, I have found myself amongst them.\" Now those same connections — chief among them, his wife, Avital Balwit, the chief of staff to Anthropic founder Dario Amodei — are set to add an additional layer of complexity and risk to his hedge fund, which dealt with a near-death experience due to poor risk management this summer. Anthropic and OpenAI are readying themselves for an IPO, and there will be a regulatory microscope on how Aschenbrenner's hedge fund, also named Situational Awareness, invests in the publicly traded versions of these companies. The fund owns a private stake in Anthropic. Investing in private companies can often be an exercise in how strong one's personal connections are; public-market investing is different. Having inside information because of a tie to an executive at a publicly traded company isn't an investing edge — it's a potential federal crime. Restrictions on trades using material non-public information, or MNPI, are meant to level the playing field for all who invest in stocks. \"This is a very sensitive matter,\" said Tito Pombra, the former chief compliance officer for asset manager Matthews Asia and founder of Adviser Compliance Consulting. He called Aschenbrenner's unique situation \"low-hanging fruit\" for regulators. How Situational Awareness can make it work The hedge fund industry has seen firsthand how aggressive federal prosecutors can be about these regulations. The popular show \"Billions\" was loosely based on billionaire Point72 founder and New York Mets owner Steve Cohen's early-2010s fight with the government around the possible use of inside information at his former firm, SAC Capital. Cohen", "date_str": "2026-10-14T09:58:01+00:00", "hash": "82e285bca10898f2", "title_fa": "چگونه عرضه اولیه سهام آنتروپیک می تواند بهترین دارایی لئوپولد اشنبرنر را به بزرگترین ریسک او تبدیل کند", "summary_fa": "لئوپولد اشنبرنر، بنیانگذار آگاهی موقعیتی. Fortune از طریق رویترز Connect Leopold Aschenbrenner به یکی از مشهورترین سرمایه گذاران هوش مصنوعی در جهان تبدیل شده است. شرکت او، Situational Awareness، عمدتاً سهام عمومی را معامله می کند، اما سهامی در Anthropic دارد. وقتی آنتروپیک عمومی می شود، ارتباطات شخصی او لایه دیگری از پیچیدگی را اضافه می کند. پیشنهاد لئوپولد اشنبرنر برای اینکه چرا او – یک آلمانی کالج و بدون تجربه قبلی در امور مالی – بهترین انتخاب برای سرمایه‌گذاری بود که امیدوار بود موج هوش مصنوعی را که حول شبکه‌اش می‌چرخید، مهار کند. کارمند سابق OpenAI در مقاله ویروسی خود در سال 2024 با عنوان \"آگاهی موقعیتی: دهه پیش رو\" نوشت: \"در حال حاضر، شاید چند صد نفر، بیشتر آنها در سانفرانسیسکو و آزمایشگاه های هوش مصنوعی وجود داشته باشند که آگاهی موقعیتی دارند.\" \"از طریق هر نیروی عجیب و غریب سرنوشت، من خود را در میان آنها یافته ام.\" اکنون همان ارتباطات - رئیس در میان آنها، همسرش، آویتال بالویت، رئیس کارکنان داریو آمودی، بنیانگذار آنتروپیک - قرار است لایه‌ای از پیچیدگی و ریسک را به صندوق تامینی او اضافه کند، که به دلیل مدیریت ضعیف ریسک در تابستان امسال با تجربه نزدیک به مرگ روبرو شد. Anthropic و OpenAI خود را برای IPO آماده می‌کنند، و یک میکروسکوپ نظارتی در مورد نحوه سرمایه‌گذاری صندوق تامینی Aschenbrenner، که همچنین Situational Awareness نامیده می‌شود، در نسخه‌های تجاری این شرکت‌ها سرمایه‌گذاری می‌کند. این صندوق دارای سهام خصوصی در آنتروپیک است. سرمایه‌گذاری در شرکت‌های خصوصی اغلب می‌تواند تمرینی برای تقویت روابط شخصی افراد باشد. سرمایه گذاری در بازار عمومی متفاوت است. داشتن اطلاعات داخلی به دلیل ارتباط با یک مدیر اجرایی در یک شرکت سهامی عام یک مزیت سرمایه گذاری نیست - این یک جرم بالقوه فدرال است. محدودیت‌های معاملاتی با استفاده از اطلاعات غیر عمومی یا MNPI، به منظور یکسان"}, {"source": "Business Insider", "title": "I'm a CEO and a mom. I built AI agents to help run my household — and save hours every week.", "link": "https://www.businessinsider.com/mom-ai-agents-school-sports-schedules-ceo-2026-10", "summary": "CEO Carrol Chang built AI agents to help run her family life and said they save her hours every week. Courtesy of Andela Carrol Chang, CEO of Andela, uses AI to manage her family's hectic schedules in New York City. An AI agent creates her kids' sports calendars and accounts for commuting times. Chang used to spend about five to eight hours a week on parenting admin. Now it's about two. Carrol Chang is the CEO of Andela, which helps companies implement AI by connecting them with technical talent. The wife and mother of three, who lives in New York City, built AI agents using several models to help coordinate her family's schedules and manage school emails. The following has been edited for brevity and clarity. That first year of my second child's life was joyous in so many ways, but it was also the hardest of my life. It almost broke me, and I have a wonderful husband. I was privileged to be in a stable, senior job at a supportive workplace, and it didn't matter because the weight of the calendar management , the sick pickups, being the person that the school or the day care would call, trying to organize holiday gifts for the family, and booking family travel was crushing to me. A lot of this mental load has been lifted , so I'm grateful. I now have three kids and agents for their sports and school, and for meal planning. With their sports, the games are always on different days and in different boroughs. In the past, I would have had to look them up on Google Maps and map out the commute. Is it subway? Is it bus? Is it walking? Is it taking an Uber ? I'd put that commute time on the calendar with enough of a buffer to get there before the game. Then I'd do the same thing on the way home. If there's a conflict with the kids' schedules, you have to reconcile which parent is going to go to which game. Now the agent does it for me, and it saves me so much time. The agent set up everything I'm not an engineer, so I said to AI, \"Talk to me like I'm a seventh grader and teach me step-by-step what I should do in order to accomplish this task.\" Then I had two open browsers, and I followed the instructions. Then, it magically runs. The agent set up everything and sent me around 60 calendar invites for my kids' soccer games and back, and it was all expertly done. One says, \"Uber to game, 23 minutes.\" I think a lot of parents are finding the time in late nights and early mornings to do this kind of admin stuff, and that's not really what we want to do. What we want ", "date_str": "2026-10-14T09:56:01+00:00", "hash": "3fcfc0ca3b0b5bb9", "title_fa": "من یک مدیرعامل و یک مادر هستم. من عوامل هوش مصنوعی ساختم تا به اداره خانه ام کمک کنند - و هر هفته در ساعات کاری صرفه جویی کنند.", "summary_fa": "مدیر عامل شرکت کارول چانگ برای کمک به اداره زندگی خانوادگی او عوامل هوش مصنوعی ساخت و گفت که آنها هر هفته در ساعات کاری او صرفه جویی می کنند. با حسن نیت از آندلا، کارول چانگ، مدیر عامل آندلا، از هوش مصنوعی برای مدیریت برنامه های شلوغ خانواده اش در شهر نیویورک استفاده می کند. یک عامل هوش مصنوعی تقویم ورزشی بچه هایش را ایجاد می کند و زمان رفت و آمد را حساب می کند. چانگ حدود پنج تا هشت ساعت در هفته را برای سرپرستی والدین می‌گذراند. حالا حدود دو تا است. کارول چانگ، مدیرعامل آندلا است که به شرکت‌ها کمک می‌کند تا با اتصال آنها به استعدادهای فنی، هوش مصنوعی را پیاده‌سازی کنند. همسر و مادر سه فرزند، که در شهر نیویورک زندگی می کند، با استفاده از چندین مدل، عوامل هوش مصنوعی را برای کمک به هماهنگ کردن برنامه های خانواده و مدیریت ایمیل های مدرسه ایجاد کردند. موارد زیر برای اختصار و وضوح ویرایش شده است. آن سال اول زندگی فرزند دوم من از بسیاری جهات شادی بخش بود، اما همچنین سخت ترین سال زندگی من بود. تقریباً من را شکست، و من یک شوهر فوق العاده دارم. من این افتخار را داشتم که در یک شغل ثابت و ارشد در یک محل کار حمایتی باشم، و این مهم نبود، زیرا سنگینی مدیریت تقویم، وانت های بیمار، شخصی بودن که مدرسه یا مهدکودک با آن تماس می گرفت، تلاش برای سازماندهی هدایای تعطیلات برای خانواده، و رزرو سفر خانوادگی برایم سخت بود. بسیاری از این بار ذهنی برداشته شده است، بنابراین سپاسگزارم. من الان سه بچه و مامور برای ورزش و مدرسه و برنامه ریزی غذا دارم. با ورزش آنها، بازی ها همیشه در روزهای مختلف و در مناطق مختلف است. در گذشته، مجبور بودم آنها را در Google Maps جستجو کنم و مسیر"}, {"source": "Business Insider", "title": "Here's how much Uber pays drivers in 16 different cities, according to a new study", "link": "https://www.businessinsider.com/uber-pay-varies-falls-below-minimum-wage-in-us-cities-2026-10", "summary": "Uber driver pay per active hour varied between major US cities, a new study found. Myung J. Chun / Los Angeles Times via Getty Images Uber says that its drivers make more than $30 an hour on average. That rate varies between major US cities, a new study shows. With expenses, Uber's pay rate in some cities is below the federal minimum wage, per the study. How much you make as an Uber driver might depend on where you are. Pay rates working for the ride-hailing app vary widely between different US cities, according to a data analysis by Len Sherman, an executive in residence and adjunct professor at Columbia Business School . In Orlando, for example, Uber offered drivers a median of 72 cents a mile, or $19.30 per hour spent on a ride, Sherman's analysis showed. Those figures do not include any driving costs, such as gas. On the other end of the spectrum, Uber offered drivers in Los Angeles a median pay of $2.15 per mile, or $46 per hour. Sherman estimated pay per mile and per hour while on an active ride. In most cases, the driver won't be paid for the time they spend waiting for their next ride. For example, A rate of $40 per active hour could mean a driver gets paid $10 for a 15-minute trip, with no pay for time spent waiting. Accounting for driving costs as well as the number and distance of average ride-hailing trips, drivers in six of the 16 cities made less than the federal minimum wage of $7.25 an hour, Sherman estimated. Uber has previously said that its drivers earn more than $30 per hour, which they spend while on their way to pick up a passenger or while driving them. Sherman's data shows a more complicated picture: Drivers may earn significantly more or less than that depending on which city they're working in. GigU, a third-party app that helps drivers evaluate potential trips, collected the data, which included about 1.8 million trip offers between March 2025 and March 2026. The data includes both jobs drivers accepted and offers they declined, which are often lower-paying. An Uber spokesperson said that the analysis \"is riddled with flaws.\" Sherman's calculations likely overrepresented lower-paying offers that drivers rejected and excluded tips, promotional payments, and minimum wage adjustment payments that drivers receive in states like California and Massachusetts. Uber also said it disagreed with Sherman's calculations, including the average trip length and trips-per-hour figure that he used in the analysis. The spokesperson declined to pro", "date_str": "2026-10-14T09:53:01+00:00", "hash": "97bfc17e2e0cf2b7", "title_fa": "بر اساس یک مطالعه جدید، اوبر در 16 شهر مختلف چقدر به رانندگان پرداخت می کند", "summary_fa": "یک مطالعه جدید نشان داد که دستمزد راننده Uber در هر ساعت فعال بین شهرهای بزرگ ایالات متحده متفاوت است. Myung J. Chun / لس آنجلس تایمز از طریق Getty Images Uber می گوید که رانندگان آن به طور متوسط ​​بیش از 30 دلار در ساعت درآمد دارند. یک مطالعه جدید نشان می دهد که این نرخ بین شهرهای بزرگ ایالات متحده متفاوت است. با توجه به هزینه‌ها، نرخ پرداخت اوبر در برخی شهرها کمتر از حداقل دستمزد فدرال است. میزان درآمد شما به عنوان راننده Uber ممکن است به جایی که هستید بستگی دارد. بر اساس تجزیه و تحلیل داده های لن شرمن، مدیر اجرایی محل سکونت و استاد کمکی در مدرسه کسب و کار کلمبیا، نرخ های پرداختی که برای اپلیکیشن سواری-تگرگ کار می کنند، بین شهرهای مختلف ایالات متحده بسیار متفاوت است. تجزیه و تحلیل شرمن نشان داد، برای مثال، در اورلاندو، اوبر به رانندگان میانگین 72 سنت در هر مایل یا 19.30 دلار در ساعت را که برای یک سواری خرج می‌شود، پیشنهاد می‌دهد. این ارقام شامل هیچ گونه هزینه های رانندگی مانند بنزین نمی شود. از سوی دیگر، اوبر به رانندگان در لس آنجلس دستمزد متوسط ​​2.15 دلار در هر مایل یا 46 دلار در ساعت پیشنهاد داد. شرمن در حالی که در یک سواری فعال بود، دستمزد در هر مایل و ساعت را تخمین زد. در بیشتر موارد، راننده برای زمانی که در انتظار سواری بعدی خود صرف می کند، پولی دریافت نمی کند. برای مثال، نرخ 40 دلار در هر ساعت فعال می‌تواند به این معنا باشد که راننده برای یک سفر 15 دقیقه‌ای، 10 دلار دستمزد دریافت می‌کند، بدون پرداخت هزینه برای مدت زمان انتظار. شرمن تخمین زد که با محاسبه هزینه های رانندگی و همچنین تعداد و مسافت متوسط ​​سفرهای سواری، رانندگان در شش شهر از 16 شهر کمتر از حداقل"}, {"source": "Business Insider", "title": "The AI chip boom has a new fear: too much competition", "link": "https://www.businessinsider.com/ai-memory-chip-boom-competition-pricing-power-scarcity-investors-chipmakers-2026-10", "summary": "CFOTO/Future Publishing via Getty Images A Chinese chipmaker rattled the AI-memory trade — and exposed its dependence on scarcity. Investors are asking whether today's chip kingpins can keep margins when the club gets crowded. Sign up for First Trade , Business Insider's daily markets newsletter. Another day, another market tantrum — this time over fears that the tiny club dominating AI memory chips could get less exclusive . The culprit was Chinese chipmaker CXMT, which said it had made progress on a denser DRAM design and plans to introduce server-memory products by year-end. If it can turn that technology into reliable, large-scale production, it could eventually threaten the pricing power enjoyed by memory giants like Micron , SK Hynix , and Samsung — three of the AI trade's biggest winners in recent months. That remains a huge \"if.\" But it didn't stop investors from reacting swiftly. The Roundhill Memory ETF ( DRAM ) slipped more than 3%, while the major memory names also sold off sharply. The AI trade has seen this movie before. A new product announcement triggers a brutal sell-off in the companies supposedly in its crosshairs , only for investors to later take a breath and reassess . Is this time different? It depends on how credible CXMT's claim is. The company hasn't yet proven it can match the quality of the incumbents, nor reach the same scale. More than anything, the stocks that sold off on Tuesday are stand-ins for what investors fear most: the AI-memory trade losing its scarcity premium. Investors are suddenly having to consider the fact that the industry's competitive landscape could change. The party isn't cool anymore once everyone shows up, and some investors are eyeing the exit. The AI trade is terrified of commoditization While this instance of (alleged) AI disruption may feel reminiscent of past wipeouts at the hands of OpenAI and Anthropic , it fits into its own category. Those announcements raised questions about whether a company's product or workflow would eventually be disrupted, and possibly even rendered obsolete. The CXMT development is less existential, and more centered around the question of whether the pool of major memory-chip makers could grow. The real question is whether new supply could eventually pressure memory-chip prices and margins, forcing industry leaders to spend even more to protect their edge. That doesn't sound like good news for companies nursing year-to-date returns in the triple digits. A divide within ch", "date_str": "2026-10-14T09:50:01+00:00", "hash": "98aa894aa8014966", "title_fa": "رونق تراشه های هوش مصنوعی ترس جدیدی دارد: رقابت بیش از حد", "summary_fa": "CFOTO/ انتشارات آینده از طریق Getty Images یک سازنده تراشه چینی تجارت حافظه هوش مصنوعی را به هم زد - و وابستگی آن به کمبود را آشکار کرد. سرمایه گذاران می پرسند که آیا کینگ پین های تراشه های امروزی می توانند در زمانی که باشگاه شلوغ می شود، حاشیه ها را حفظ کنند؟ برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. یک روز دیگر، یک آشفتگی دیگر در بازار - این بار به دلیل ترس از اینکه باشگاه کوچکی که چیپ‌های حافظه هوش مصنوعی را تحت سلطه خود دارد، کمتر انحصاری شود. مقصر تراشه‌ساز چینی CXMT بود که گفت در طراحی DRAM متراکم‌تر پیشرفت کرده و قصد دارد محصولات حافظه سرور را تا پایان سال معرفی کند. اگر بتواند آن فناوری را به تولید قابل اعتماد و در مقیاس بزرگ تبدیل کند، در نهایت می‌تواند قدرت قیمت‌گذاری غول‌های حافظه مانند Micron، SK Hynix و Samsung - سه تا از بزرگترین برندگان تجارت هوش مصنوعی در ماه‌های اخیر را تهدید کند. این یک \"اگر\" بزرگ باقی می ماند. اما مانع از واکنش سریع سرمایه گذاران نشد. Roundhill Memory ETF (DRAM) بیش از 3 درصد کاهش یافت، در حالی که نام‌های اصلی حافظه نیز به شدت فروخته شدند. تجارت هوش مصنوعی قبلاً این فیلم را دیده است. اعلامیه محصول جدید باعث فروش بی‌رحمانه شرکت‌هایی می‌شود که ظاهراً در تیررس آن قرار دارند، فقط برای سرمایه‌گذاران که بعداً نفس بکشند و دوباره ارزیابی کنند. آیا این بار متفاوت است؟ بستگی به این دارد که ادعای CXMT چقدر معتبر باشد. این شرکت هنوز ثابت نکرده است که می تواند با کیفیت شرکت های فعلی مطابقت داشته باشد و یا به همان مقیاس برسد. بیش از هر چیز، سهامی که در روز سه‌شنبه فروخته شد، برای چیزی که سرمایه‌گذاران بیشتر از همه از آن می‌ترسند، ایستاده‌اند: تجارت حافظه هوش مصنوعی از"}, {"source": "Business Insider", "title": "Nestlé’s CEO shares his advice for building teams that can weather a crisis", "link": "https://www.businessinsider.com/nestle-ceo-advice-building-teams-handle-crisis-2026-10", "summary": "Philipp Navratil is the CEO of Nestlé, a company that employs over 270,000 workers globally. Nespresso Nestlé CEO Philipp Navratil said resilient teams have two things in common. He said they work well together and they have one purpose. The CEO said that those teams are built on trust both from leaders and workers. As CEO of Nestlé, Philipp Navratil leads a workforce of more than 270,000 people and oversees a portfolio of more than 30 billion-dollar brands. So he's encountered his fair share of crises. \"There's always something happening somewhere,\" Navratil told Business Insider. \"Natural disasters, conflicts.\" Navratil said resilient teams tend to share two traits: They work well together and have a shared purpose. While leaders can't plan for every challenge, Navratil said, they can build team structures that help people pull in the same direction when challenges come up. He pointed to Nestlé employees in the Middle East and Ukraine, who have rallied around a common goal during difficult moments. This is part of a series of stories from Business Insider's conversation with Nestlé CEO Philipp Navratil. To be alerted when the next piece publishes, follow reporter Ana Altchek here. The 3 qualities Nestlé's CEO says will get you a promotion Nestlé's CEO says this is the most important skill for workers in the AI era Nestlé's CEO shares the feedback he got that changed how he leads Creating those teams While Navratil's advice may sound simple, teams don't become resilient simply by deciding to be focused and collaborative. Leaders need to create an environment where people trust one another and understand who they're working alongside, he said. \"It's really about transparency, trust,\" Navratil said, adding that, \"you want to have a leadership that you can trust, especially in a crisis situation.\" Additionally, leaders also need people they can count on, the CEO said. That means building strong teams of people that can make sound decisions in the company's best interest. \"It's not easy,\" Navratil said. \"It's a journey.\" Navratil said teams that operate that way can be \"amazingly powerful,\" and they don't need to wait for a crisis for \"that beauty to unfold.\" When employees make a habit of working with trust, purpose, and sound judgment every day, they're in a better position to continue moving forward, no matter what comes at them, he said. Those kinds of teams may look like they were built for crisis response, the CEO said, but that's not the case. \"No, it'", "date_str": "2026-10-14T09:44:01+00:00", "hash": "f4907271d243a0b1", "title_fa": "مدیر عامل نستله توصیه های خود را برای ایجاد تیم هایی که می توانند از بحران عبور کنند به اشتراک می گذارد", "summary_fa": "فیلیپ ناوراتیل مدیر عامل شرکت نستله است که بیش از 270000 کارگر در سراسر جهان استخدام می کند. فیلیپ ناوراتیل، مدیرعامل نسپرسو نستله، گفت که تیم‌های انعطاف‌پذیر دو چیز مشترک دارند. او گفت که آنها به خوبی با هم کار می کنند و یک هدف دارند. مدیرعامل گفت که این تیم ها بر اساس اعتماد رهبران و کارگران ساخته شده اند. فیلیپ ناوراتیل به عنوان مدیرعامل نستله، نیروی کاری بیش از 270000 نفر را رهبری می‌کند و بر مجموعه‌ای از برندهای بیش از 30 میلیارد دلاری نظارت دارد. بنابراین او با سهم عادلانه خود از بحران روبرو شده است. ناوراتیل به Business Insider گفت: «همیشه چیزی در جایی اتفاق می افتد. بلایای طبیعی، درگیری ها. ناوراتیل گفت که تیم های تاب آور تمایل دارند دو ویژگی مشترک داشته باشند: آنها به خوبی با هم کار می کنند و هدف مشترکی دارند. ناوراتیل گفت، در حالی که رهبران نمی‌توانند برای هر چالشی برنامه‌ریزی کنند، می‌توانند ساختارهای تیمی بسازند که به افراد کمک می‌کند در هنگام بروز چالش‌ها در همان جهت حرکت کنند. او به کارمندان نستله در خاورمیانه و اوکراین اشاره کرد که در لحظات سخت حول یک هدف مشترک گرد آمده اند. این بخشی از یک سری داستان از گفتگوی Business Insider با فیلیپ ناوراتیل، مدیرعامل نستله است. برای اطلاع از انتشار قطعه بعدی، خبرنگار آنا آلچک را اینجا دنبال کنید. 3 ویژگی که مدیر عامل نستله می گوید باعث ارتقای شما می شود مدیرعامل نستله می گوید این مهم ترین مهارت برای کارگران در عصر هوش مصنوعی است. او گفت که رهبران باید محیطی ایجاد کنند که مردم به یکدیگر اعتماد کنند و درک کنند که در کنار چه کسانی کار می کنند. ناوراتیل گفت: «این واقعاً در مورد شفافیت، اعتماد است. مدیرعامل گفت: علاوه بر این، رهبران به افرادی نیاز دارند که بتوانند روی آنها حساب کنند. این"}, {"source": "Business Insider", "title": "Why 3 days at work is the big AI promise that Bezos, Dimon, and Gates can't stop talking about", "link": "https://www.businessinsider.com/bezos-dimon-gates-musk-cuban-ai-working-days-jobs-unemployment-2026-10", "summary": "Amazon founder Jeff Bezos is the latest business leader to predict a shorter workweek. Stefano Guidi/Getty Images Jeff Bezos, Jamie Dimon, and Bill Gates have all said that AI could shorten the workweek. Elon Musk has said work will become \"optional,\" while Sam Altman has said people will keep hustling. A top economist told Business Insider that past innovations have led to people working much less. Thursdays and Fridays off — forever? Business leaders can't stop talking about AI shortening the workweek, and there are good reasons why. Jeff Bezos joined the chorus last week when he told Fox News that AI will boost workers' productivity, enabling them to do in three days what previously took them five. \"Some people will decide: 'I can support my family working three days a week,'\" Amazon's founder and chairman said , adding that two-earner households might also become a choice instead of a necessity. Similarly, Jamie Dimon has repeatedly predicted in recent years that the next generation will work only three and a half days a week. The JPMorgan CEO said this spring that those future workers will be able to \"hike more\" and \"do all the things\" that their predecessors didn't have the time to do. Eric Yuan made the same case to The New York Times last fall, when he said AI will shoulder more of the workload in the future. \"Every company will support three days, four days a week,\" the Zoom CEO said. \"I think this
