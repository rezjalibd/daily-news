roducing", "link": "https://deadline.com/2026/11/lily-james-hunting-party-movie-adaptation-universal-1237232787/", "summary": "EXCLUSIVE: Lily James is attached to star in and produce a feature adaptation of Lucy Foley’s bestselling novel The Hunting Party for Universal Pictures. James will produce and Gala Gordon will co-produce for Parodos Productions. Molly Sims is also producing along with Gaby McCormick for Something Happy Productions. No writer is currently attached. A Sunday [ ]", "date_str": "2026-11-25T17:30:00+00:00", "hash": "99d6a2f12281c7f1", "title_fa": "لیلی جیمز بازیگر و تهیه کننده اقتباس «The Hunting Party» در یونیورسال. مولی سیمز نیز در حال تولید است", "summary_fa": "انحصاری: لیلی جیمز برای ایفای نقش و تولید اقتباسی از رمان پرفروش لوسی فولی، مهمانی شکار برای یونیورسال پیکچرز، پیوسته است. جیمز تهیه کنندگی و گالا گوردون هم تهیه کنندگی پارودوس پروداکشنز را بر عهده خواهند داشت. مولی سیمز نیز به همراه گبی مک کورمیک برای Something Happy Productions تهیه کنندگی را بر عهده دارد. هیچ نویسنده ای در حال حاضر پیوست نشده است. یک یکشنبه [ ] پرفروش‌ترین ساندی تایمز و نیویورک تایمز، مهمانی شکار گروهی از دوستان قدیمی آکسفورد را دنبال می‌کند که دیدار مجددشان برای تعطیلات در یک کلبه شکار دورافتاده زمانی مرگبار می‌شود که کولاک آنها را در برف رها می‌کند و یکی از آنها به قتل رسیده است. این رمان فولی را به عنوان صدای پیشرو در فیلم‌های هیجان‌انگیز تجاری معرفی کرد و در فهرست کوتاه کتاب سال جنایی در جوایز کتاب بریتانیا قرار گرفت. نباید با درام رویه‌ای NBC به همین نام که توسط J.J. بیلی که بین سال‌های 2025 و 2026 به مدت دو فصل پخش شد، پارتی شکار اثر فولی در دسامبر 2018 منتشر شد. فولی تهیه کننده اجرایی خواهد بود. فولی بیش از 12 میلیون نسخه در سراسر جهان فروخته است و نویسنده شماره 1 پرفروش نیویورک تایمز و ساندی تایمز است. از دیگر رمان‌های او که برای توسعه انتخاب شده‌اند، می‌توان به آپارتمان پاریس و جشن نیمه‌شب اشاره کرد، اگرچه هیچ کدام از آنها اقتباسی ساخته نشده‌اند. مدیر توسعه تولید، کریستین سان، بر پروژه استودیو نظارت خواهد کرد. Watch on Deadline James اخیرا در Swiped با الها ers", "link": "https://deadline.com/2026/11/blackstar-luminary-gala-mahershala-ali-mara-brock-akil-2026-1237233236/", "summary": "Mahershala Ali and Mara Brock Akil were among the honorary award winners at the BlackStar Projects Luminary Gala, which returned for its fourth edition on November 20 at The Bellevue Hotel in Philadelphia. Cinematographer John Simmons and Stanley Nelson and Marcia Smith’s Firelight Media were also among those honored with career awards on the evening. [ ]", "date_str": "2026-11-25T18:18:46+00:00", "hash": "b60b3d0d178f7f8c", "title_fa": "BlackStar’s Luminary Gala برای نسخه چهارم بازمی گردد. ماهرشالا علی و مارا براک آکیل در میان برندگان جوایز افتخاری", "summary_fa": "ماهرشالا علی و مارا براک آکیل از جمله برندگان جوایز افتخاری گالا لومیناری پروژه های بلک استار بودند که برای چهارمین دوره خود در 20 نوامبر در هتل بلیو در فیلادلفیا بازگشتند. جان سیمونز، فیلمبردار و استنلی نلسون و فایر لایت رسانه مارسیا اسمیت نیز از جمله افرادی بودند که در این شب با جوایز حرفه ای تجلیل شدند. [ ] BlackStar Projects، سازمان مادر جشنواره فیلم بلک استار، میزبان این جشن است که به عنوان جمع آوری کمک مالی برای جشنواره فیلم نیز عمل می کند. جشنواره فیلم بلک استار پانزدهمین سالگرد خود را در ماه اوت جشن گرفت. از افتخارات قبلی می توان به میرا نیر، منلیک شباز، آوا دوورنی، جولی دش، پاییز دورالد آرکاپاو و وو تانگ RZA اشاره کرد. خبرهای مرتبط اخبار کارون کریتون در مورد گرفتن مبارزه برای نجات بزرگترین اردوگاه بی خانمان ها در کالیفرنیای شمالی با اولین فیلمش Wood Street News Haile Gerima مستند 10 ساعته خود را تشریح می کند - شیرهای سیاه - روم گرگ ها پروژه بعدی خود را در مورد Americans Black Maroons کنایه می زند. پانزدهمین سال جشنواره فیلم بلک استار، مائوری کارمیل هلمز، بنیانگذار، مدیر اجرایی و مدیر هنری پروژه های بلک استار، هنگام افتتاح جشن های شب گفت. در ددلاین تماشا کنید «در سال 2012، همه ما داوطلبانی بودیم که سعی می‌کردیم رویدادی یک‌باره برای جشن گرفتن بهترین سینمای سیاه‌پوست از سرتاسر جهان برگزار کنیم. نمی‌توانستم تصور کنم در سال 2026 اینجا باشم، در مقابل چنین مهمان‌های برجسته‌ای، با بلک استار که نه تنها جشنواره، بلکه همچنین مجله چاپی ما را تهیه می‌کند. کارکنان درخشان.”", "image_url": "https://deadline.com/wp-content/uploads/2026/11/LuminaryGala2026-849-Mahershala-Ali.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۲۱:۴۸"}, {"source": "Rolling Stone", "title": "Dude Wipes’ New ‘Dingle Bells’ Scent Brings Holiday Cheer and a Cleaner Rear", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/dude-wipes-new-scent-brand-review-where-to-buy-online-1235663733/", "summary": "These festive wipes aren’t your average holiday purchase, but they might be your favorite", "date_str": "2026-11-25T18:18:04+00:00", "hash": "a5598baf36722b19", "title_fa": "رایحه جدید Dude Wipes 'Dingle Bells' شادی تعطیلات و پشت تمیزتر را به ارمغان می آورد", "summary_fa": "این دستمال‌های مخصوص جشن خرید متوسط ​​شما در تعطیلات نیستند، اما ممکن است مورد علاقه شما باشند. چیزی به نام شادی بیش از حد تعطیلات وجود ندارد. از تزیینات حیاط و ژاکت های زشت گرفته تا نوشیدنی های خاص و موسیقی کریسمس، تقریباً در همه جای خانه مان وسایلی با تم تعطیلات دوست داریم. با این حال، یکی از مکان هایی که روحیه جشن به شدت وجود ندارد، حمام است. Dude Wipes اینجاست تا این مشکل را برطرف کند. برند بهداشت شخصی به تازگی دستمال‌های مرطوب شست‌و‌شوی پرفروش خود را با رایحه کریسمس «Dingle Bells» منتشر کرده است تا از شادی تعطیلات برای پشت شما اطمینان حاصل کند. دستمال‌های مخصوص بزرگسالان با رایحه‌های میخک، بلسان و سایر رایحه‌های شادی‌آور ساخته شده‌اند، به این معنی که بوی بهتری نسبت به زمانی که در راه بودید، از کمود باقی می‌ماند. نظرات کاربران برای محصول جدید Dude Wipes خیره کننده است: دستمال مرطوب Dingle Bells با بیش از 350 بررسی، امتیاز تقریباً عالی 4.8/5 ستاره را در آمازون دارد. یکی از منتقدان می نویسد: «رودولف برو. \"یک قهرمان تعطیلات جدید در شهر وجود دارد، و او اینجاست تا تخته سنگ را به جشن ترین شکل ممکن پاک کند!\" یک بسته 144 دستمال مرطوب Dude (برای تمام سیاهههای مربوط به جشن جشن خود، در این تعطیلات و فراتر از آن) در Walmart با تنها 13 دلار انتخاب کنید. ا f doing so, plenty of fans are willing to travel to see their favorite star. This year, Vaccarello was selected as Billboard s touring executive of the year and to celebrate that honor, she joined a special live edition of music business podcast On the Record w/ Kristin Robinson at Billboard s Live Music Summit on Nov. 10 in Los Angeles. To watch this episode of the podcast, check out the YouTube video below or click here for more viewing and listening options. An edited and condensed excerpt of the conversation can also be found below. Sphere, owned by MSG Entertainment, has obviously been part of that larger trend toward more immersive and experiential live experiences. ABBA Voyage is another great example. From your vantage point, why do you think people are searching for these experiential moments in live music now? I don t know the answer to the now of it, but I do feel like people want to be a participant rather than a spectator. I do think that s what is happening now, and that s what everyone is looking to change. We w", "date_str": "2026-11-25T17:03:31+00:00", "hash": "27a7cb31546df757", "title_fa": "داخل اقامتگاه MSG هری استایلز و چرا طرفداران کنسرت های تجربی می خواهند", "summary_fa": "برای اجرای برخی از نمادین ترین مکان های آمریکا چه چیزی لازم است؟ Josephine Vaccarello، رئیس MSG Entertainment، یکی دو چیز در مورد آن می داند. در طول 20 سال گذشته، Vaccarello در این شرکت بزرگ شده است - مالک مدیسون اسکوئر گاردن، رادیو سیتی موزیک هال، Sphere، Beacon Theater و موارد دیگر - از یک دستیار اداری به سمت دست راست مدیر اجرایی جیمز دولان، مدیرعامل، ارتقا یافته است. به گفته Vaccarello، تابستان 2026 شلوغ ترین تابستانی بوده است که باغ تا به حال دیده است و میزبان همه از اولیویا دین، بون جووی و بوش بوده است. در پایان فصل، باغ همچنین با هری استایلز، که 30 قرار ملاقات را در محل برگزاری یک اقامتگاه افسانه ای قفل کرد، خبرساز شد. موارد مرتبط ملاقات با مدیر اجرایی \"غیرقابل\" که سوپراستارها را به مدیسون اسکوئر گاردن و کره می آورد کریس براون با افزایش حمایت از کودک در حال حاضر موافقت می کند تا در حال حاضر دیاموند سابق را در مبارزه تلخ حضانت متهم کند. این نه تنها به نفع هنرمند است، که به جای گذراندن روزهای خود در اتوبوس یا هواپیما، در یک مکان می ماند، بلکه به ارزش تولید نمایش نیز سود می رساند و برای همه دست اندرکاران سر و صدایی ایجاد می کند. در حالی که همه طرفداران از رشد مدل اقامتی که توسط افرادی مانند بیانسه، استایلز، بیلی جوئل، خرگوش بد و غیره به وجود آمده هیجان زده نمی شوند، واضح است که علیرغم هزینه های زیاد و دشواری انجام این کار، بسیاری از طرفداران مایل به سفر برای دیدن ستاره مورد علاقه خود هستند. امسال، Vaccarello به عنوان مدیر اجرایی سال بیلبورد در تور بیلبورد انتخاب شد و برای جشن گرفتن این افتخار، به نسخه زنده ویژه پادکست تجارت موسیقی On the Record با کریستین رابینسون در اجلاس موسیقی زنده بیلبورد در", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/harry-styles-msg-billboard-2026-bb12-cr-anthony-pham-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آذر • ۲۰:۳۳"}, {"source": "Billboard", "title": "Ariana Grande Says ‘Insane’ Backlash to ‘Petal’ Music Video Felt Like ‘Black Mirror’", "link": "https://www.billboard.com/music/music-news/ariana-grande-petal-music-video-backlash-black-mirror-1236389456/", "summary": "Ariana Grande never predicted that the response to her Petal music video earlier this year would directly mirror what she was trying to speak out against in the song in the first place. Related Ariana Grande Announces Eternal Sunshine Tour Concert Film Behind-the-Scenes Documentary Ariana Grande Over the Moon About Her Four Grammy Nominations: Such a Sweet and Unexpected Honor Ariana Grande Ricky Alvarez Make Red-Carpet Debut at Focker-in-Law NYC Premiere: See Photos While guesting on the Wednesday (Nov. 25) episode of Las Culturistas , the pop star opened up for the first time about the backlash she received following the visual s release in August. The video found her in and out of auditions for a panel of overly critical men, changing things about her appearance and personality each time in futile attempts to please them. By the end of the video, Grande realizes that none of those things should matter, and that the focus should have always been on her art. So when the public s response to the Petal video ended up having nothing to do with the song or visual design, with people instead overwhelmingly commenting on the Grammy winner s slender appearance, it felt like an episode of Black Mirror , Grande recalled. It was a fun thing that that video — with the intention of really spelling it out — had its own meta insane perception, she told podcast hosts Bowen Yang and Matt Rogers. It s Black Mirror . I really thought it was going to be, like, a reveal, me sharing a vulnerable [part of myself]. Shortly after the Petal video dropped, Grande s rep announced that she d be taking a break from the spotlight due to endless, ongoing public scrutiny. Even so, she stands by the visual. I d put it out again today. I wouldn t change a thing, she said, noting how healing it was to bond with the dancers who played her fellow auditioners in the video over the song s message. We ve all been told some kind of interesting thing about ourselves that has nothing to do with the art or our talent or our work. It was a very beautiful day on set. It has always in the past hurt me a lot, she added of having her intentions distorted by the public, something she explored heavily on her Billboard 200 -topping album petal . Now I really just feel like as long as I m creating from an authentic place let the chips fall where they may. The singer s appearance on the pod comes the day after she announced her Eternal Sunshine Tour documentary and concert film, coming Dec. 11 and 12, respec", "date_str": "2026-11-25T17:01:36+00:00", "hash": "e9faeb5f573a2560", "title_fa": "آریانا گرانده می گوید واکنش دیوانه کننده به موزیک ویدیوی «گلبرگ» مانند «آینه سیاه» بود", "summary_fa": "آریانا گرانده هرگز پیش‌بینی نکرد که پاسخ به موزیک ویدیوی گلبرگ او در اوایل سال جاری، مستقیماً  روحیه‌ای است که ما می‌خواهیم روی آن بسازیم و انرژی و جاه‌طلبی تازه‌ای برای خلق چیزی واقعاً هیجان‌انگیز برای نسل کاملاً جدیدی از مخاطبان به ارمغان بیاوریم. این یک فرصت فوق‌العاده هیجان‌انگیز است، و من واقعاً نمی‌توانم برای شروع صبر کنم!» این سریال از سال 1977 تا 2022 پخش شد، زمانی که پس از آن که اندرو فلینتوف، مجری همکار سابق کریکت، در یک تصادف در مسیر آزمایشی برنامه به شدت مجروح شد، پخش شد. وی پس از واژگونی خودروی سه چرخ روبازش دچار جراحات جانی شد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/gordon-ramsay-top-gear.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۴ آذر • ۲۰:۲۹"}, {"source": "Billboard", "title": "2027 ACM Awards Changes Include New Criteria for New Artist & Song of the Year", "link": "https://www.billboard.com/music/awards/2027-acm-awards-new-criteria-new-artist-song-1236389300/", "summary": "The Academy of Country Music Awards have amended criteria for a number of categories for both its artist and industry awards. Additionally, the ACM has finalized the submission and voting timeline for the 62nd ACM Awards, which will take place May 16 in Las Vegas. For the artist awards, the changes include broadening the criteria for the new artist of the year awards, which are presented in new male, new female and new duo or group categories. The wording has been altered to “presented to a country music individual artist, duo, or group who gains initial notoriety and demonstrates significant creative growth and development in overall consumption or chart activity, live performance, and/or national media recognition during the eligibility period,” according to the official description of the award. Related Here s the Date of the 2027 ACM Awards – And How to Get Tickets Here Are the 2026 ACM Awards Winners: Full List Every 2026 ACMs Performance, Ranked Previously, a more restrictive definition noted that the recognition occurred “during the promotion of a debut or sophomore album within the eligibility period,” and specifically defined chart activity as “must have released a single that reached the top 50 on Billboard’s Hot Country Songs or the Mediabase Country charts.” Significantly, the new definition removes the album requirement in a nod to how release patterns have changed to focus on consumption. A qualifier that any albums self-released through an independent label operated by the artist would not be counted as a debut or sophomore album unless it produced a top 50 single has also been removed. For song of the year, eligibility is now “limited to newly created compositions recognized as distinct copyrighted works, including those that incorporate elements of existing songs while contributing to substantial original songwriting.” The “newly created compositions” language is new. For songwriter of the year, whose nominees are selected by a professional panel of judges composed of songwriters, publishers, producers and performing rights organization representatives, the panel will now submit 10 nominees, up from the five nominees in years past. The ACM has also amended some of the criteria for its industry awards, most significantly, adding a new category, international event of the year. According to the award language, “This award is presented to an outstanding country music festival, fair, or rodeo held outside the United States.” The event must spa", "date_str": "2026-11-25T17:00:00+00:00", "hash": "ff53dd03b72f7021", "title_fa": "تغییرات جوایز ACM 2027 شامل معیارهای جدید برای هنرمند جدید و آهنگ سال می شود", "summary_fa": "آکادمی جوایز موسیقی کشور معیارهای تعدادی از دسته‌ها را برای جوایز هنرمند و صنعت خود اصلاح کرده است. علاوه بر این، ACM جدول زمانی ارسال و رأی گیری برای شصت و دومین دوره جوایز ACM را که در 16 می در لاس وگاس برگزار می شود، نهایی کرده است. برای جوایز هنرمند، تغییرات شامل گسترش معیارهای جوایز هنرمند جدید سال است که در دسته‌های جدید مرد، زن و گروه جدید دو نفره یا گروهی ارائه می‌شوند. بر اساس توضیحات رسمی جایزه، عبارت به «ارائه شده به یک هنرمند، دو یا گروه موسیقی کانتری که شهرت اولیه پیدا کرده و رشد و توسعه خلاقانه قابل توجهی در مصرف کلی یا فعالیت نمودار، اجرای زنده و/یا به رسمیت شناختن رسانه ملی در طول دوره واجد شرایط بودن نشان می‌دهد» تغییر یافته است. موارد مرتبط در اینجا تاریخ جوایز ACM 2027 است – و نحوه دریافت بلیت در اینجا برندگان جوایز ACM 2026 آمده است: فهرست کامل هر عملکرد ACM در سال 2026، رتبه‌بندی شده قبلی، تعریف محدودتر نشان می‌دهد که این شناخت «در طول تبلیغ یک آلبوم به‌عنوان فعالیت‌هایی که به‌طور خاص به‌عنوان فعالیت‌هایی که به‌طور epholig بیشتر تعریف شده‌اند» رخ داده است. باید آهنگی منتشر کرده باشد که به 50 آهنگ برتر بیلبورد در آهنگ های Hot Country یا چارت Mediabase Country رسیده باشد. به طور قابل توجهی، تعریف جدید الزامات آلبوم را با اشاره به نحوه تغییر الگوهای انتشار برای تمرکز بر مصرف حذف می کند. این شرط که هر آلبومی که توسط یک برچسب مستقل توسط هنرمند منتشر شود به عنوان اولین آلبوم یا آلبوم دوم محسوب نمی شود مگر اینکه 50 تک آهنگ برتر را تولید کند نیز حذف شده باشد. برای آهنگ سال، واجد شرایط بودن اکنون «محدود به آهنگ‌هایی است که به تازگی ایجاد شده‌اند که به‌عنوان آثار متمایز دارای حق چاپ شناخته می‌شوند، از جمله", "image_url": "https://www.billboard.com/wp-content/uploads/2026/05/ella-langley-acm-awards-2026-billbaord-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آذر • ۲۰:۳۰"}, {"source": "Billboard", "title": "Rock The Country Fest Organizer Peachtree Entertainment Reportedly Shuts Down", "link": "https://www.billboard.com/pro/rock-the-country-peachtree-entertainment-shuts-down/", "summary": "Nashville-based music promoter Peachtree Entertainment, the organizer behind the Rock The Country festivals, has reportedly shut down and laid off staffers. The news was first reported by Decibel . A statement released Friday (Nov. 20) to Loudwire from the city of Decatur, Ala., which hosted Rock The South, noted that the city had received word that Peachtree Entertainment has decided to cease operations and close its business. This was a significant and unexpected development for City leadership. Related Universal Music Shakeup: Def Jam, Polydor, Interscope Execs to Exit as Company Completes 2024 Restructure Plan Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Rod Wave Indicted on Drug Gun Charges for Items Allegedly Found in Car After Speeding Stop In the statement, the City of Decatur also noted it is reviewing its five-year agreement with Peachtree Entertainment and assessing what this decision means for Decatur and the future of Rock the South. The statement added, Because the review is ongoing, the City cannot confirm 2027 festival or event dates at this time. We can say that no city funds have been exchanged for the 2027 contract year. We understand that residents, local businesses, festival fans and community partners will have questions. The City will share additional information once we have verified facts and a clearer understanding of the available next steps.” Representatives for Peachtree Entertainment have not responded to Billboard s request for comment. In January, Peachtree announced this year s eight-city run of Rock the Country festivals, with stops in states including Florida, Georgia, Texas and Michigan. Rock the Country’s lineup initially listed performers at various shows including Kid Rock, Jason Aldean, Blake Shelton, Jelly Roll, Brooks Dunn, Hank Williams Jr., Lynyrd Skynyrd, Brantley Gilbert and more. Rock the Country came under fire earlier this year after backlash due to the festival s perceived political ties. Some artists, including Carter Faith, Shinedown and Morgan Wade, exited the fest s lineup, while a July 25-26 show in South Carolina was ultimately canceled. Peachtree Entertainment was founded in 2013 by Bradley Jordan . The company s event portfolio expanded to include Rock the South, Rock The Country, Furnace Fest, Bulls, Bands and Barrels and more. Jordan now co-manages Ella Langley with Megan Hinde through Painted Rock En 0:00+00:00", "hash": "4fdaa14744e546a6", "title_fa": "\"Hold Onto Me\": اولین فیلم میرسینی آریستیدو قدرت اتصال مجدد را از طریق پیوند پیچیده و قدرتمند پدر و دختر اثبات می کند", "summary_fa": "\"خوشبختی که پدر نداری.\" این را دانای 16 ساله به آیریس 11 ساله می‌گوید، در حالی که دختر بزرگ‌تر به خانه می‌رود تا با پدر سخت‌گیر و قابل اعتمادش عصبانی شود، روز تابستانی دوستان در جزیره مدیترانه‌ای قبرس در حال توقف است. با این حال، برای آیریس، غیبت والدین چیزی شبیه به [ ] نیست، «Hold Onto Me» اولین ارسال رسمی قبرس برای بهترین فیلم بلند بین‌المللی «خوشبختی که پدر نداری» است. در «بر من نگه دار»، اولین فیلم درخشان از نویسنده و کارگردان میرسینی آریستیدو، پدری که آیریس هرگز نمی دانست سایه ای در پشت چشم ها و زخمی در قلب ماریا پترووا با بیان شگفت انگیز است، تازه وارد فوق العاده با استعدادی که نقش این جوان را بازی می کند. پس جای تعجب نیست که وقتی آریس (کریستوس پاسالیس) - نه مرده، فقط بیگانه و بی جنس - به شهر باز می گردد، آیریس نمی تواند به سمت او کشیده شود. حتی زمانی که پدرش چهره واقعی خود را به‌عنوان مردی آشکار می‌کند که ترجیح می‌دهد از دخترش در کلاهبرداری‌هایش استفاده کند تا عشق خانوادگی، آیریس سعی می‌کند او را نگه دارد - که برای هر دو نتیجه خطرناکی دارد. آریستیدو نیز تعهدی پرشور و سرسختانه به فیلمش نشان داد. این فیلمساز قبرسی برای نمایش فیلم «Hold Onto Me» را پشت سر گذاشت، هفت سال توسعه فیلمنامه، چالش‌های مالی، تأخیرهای ناشی از کووید و فشارهای موجود در ارج نهادن به داستان و خانه جزیره‌اش با استخدام غیربازیگران متعدد، به ویژه برای ایفای نقش شخصیت‌های اصلی فرزندش. آریستیدو توضیح می‌دهد: «از قبرس یا یونان، پیدا کردن بچه‌هایی که بازیگر باشند سخت است. ما صنایع بزرگ نداریم. بنابراین می‌دانستم که غیربازیگرانی هستند که نقش آیریس و دانایی [جنی سالو] را بازی می‌کنند.» این فیلمساز در دو فیلم کوتاه «سمله» در سال 2015 و «آریا» در سال 2017 با این", "image_url": "https://variety.com/wp-content/uploads/2026/01/Hold-Onto-Me.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۲۰:۳۰"}, {"source": "Variety", "title": "Hallmark’s New Podcast Push Kicks Off With Interview Series Hosted by Melissa Peterman That ‘Breaks the Fourth Wall,’ With More Shows to Come", "link": "https://variety.com/2026/tv/news/hallmark-podcast-melissa-peterman-1236956991/", "summary": "Hallmark Media is gearing up for new expansion into podcasting aiming to add another vector for connecting with its fanbase. The media company in recent years has stepped up its brand extensions, from cruises and live tours to movies and series centered on heartwarming storylines and holiday themes. Now it wants to engage with [ ]", "date_str": "2026-11-25T17:00:00+00:00", "hash": "47ba1eb5577602fc", "title_fa": "پادکست جدید Hallmark با مجموعه مصاحبه با میزبانی ملیسا پیترمن که \"دیوار چهارم را می شکند\" با برنامه های بیشتر آغاز می شود", "summary_fa": "Hallmark Media در حال آماده شدن برای گسترش جدیدی در پادکست است که هدف آن افزودن وکتور دیگری برای اتصال به پایگاه هواداران خود است. این شرکت رسانه‌ای در سال‌های اخیر توسعه‌های برند خود را افزایش داده است، از سفرهای دریایی و تورهای زنده گرفته تا فیلم‌ها و سریال‌هایی با محوریت داستان‌های دلچسب و مضامین تعطیلات. این شرکت گفت که اکنون می‌خواهد با [] هالمارک تعامل داشته باشد، هفته آینده Hallmark Moments With Melissa Peterman را نمایش می‌دهد، یک پادکست ویدیویی که شامل مکالمات معتبر بین شخصیت تلویزیونی و ستاره‌های خانواده Hallmark و فراتر از آن شکستن دیوار چهارم است. نسخه ویدیویی پادکست در یوتیوب و نسخه صوتی آن در Spotify، Apple Podcasts و دیگر پلتفرم‌های پادکست در دسترس خواهد بود. داستان‌های مرتبط چگونه تیم آرایش «السینور» ستاره‌های اندرو اسکات و اولیویا کولمن را برای زنده کردن داستان ایان چارلسون متحول کرد پترمن در سریال Haul Out the Holly از هالمارک و کمدی کمدی NBC Happy Place بازی کرده است. اولین قسمت از پادکست او که دوشنبه، 30 نوامبر منتشر می شود، گفتگوی او با مهمان Lacey Chabert، یکی دیگر از ستاره های برجسته تولیدات Hallmark را نشان می دهد. قسمت‌های جدید هر دوشنبه تا ۸ فوریه ۲۰۲۷ پخش خواهند شد. قرار است مهمانان دیگری در پادکست شامل شارون لارنس (2025 A Grand Ole Opry Christmas) در 7 دسامبر باشند. جاناتان بنت (تاریخ را برای کریسمس ذخیره کنید) در 14 دسامبر; و B.J. Britt (Hearts All Aglow) و اندرو واکر (کریسمس در Blue Dog Valley) در 21 دسامبر، برای فیلمبرداری در محل در طول جشن کریسمس Hallmark این آخر هفته. یکی از نمایندگان Hallmark Media می گوید که پادکست های اصلی بیشتری در دست ساخت هستند، زیرا نمایش پیترمن سیگنال ورود مجدد شرکت به فضای پادکست را می دهد.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Melissa-Peterman.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["Apple", "عامل‌های هوشمند", "سینما"], "datetime_fa": "۴ آذر • ۲۰:۳۰"}, {"source": "Variety", "title": "Rei Ami to Host Music Competition Series ‘Who’s In the Band?’", "link": "https://variety.com/2026/music/news/rei-ami-host-music-competition-series-whos-in-the-band-1236958056/", "summary": "Rei Ami is set to host the new music competition series “Who s In the Band?” Ami, who was the singing voice of Zoey in “KPop Demon Hunters,” will host the show, which is set to air on ABC, Disney+ and Hulu in summer 2027. The show is described as a fast-paced competition built for the [ ]", "date_str": "2026-11-25T16:58:28+00:00", "hash": "e7d15f69c02ea4f2", "title_fa": "ری امی مجری سریال مسابقه موسیقی \"چه کسی در گروه است؟\"", "summary_fa": "ری امی قرار است میزبان سری جدید مسابقه موسیقی \"Whos In the Band?\" باشد. آمی، که صدای خوانندگی زویی در «شکارچیان شیاطین KPop» بود، میزبان این برنامه خواهد بود که قرار است در تابستان 2027 در ABC، Disney+ و Hulu پخش شود. این برنامه به عنوان یک رقابت سریع ساخته شده برای [ ] توصیف می شود. \"چه کسی در گروه است؟\" ریچارد بیکن، ساوان کوتچا و سایمون کاول تهیه کنندگی آن را بر عهده دارند. داوران این سریال متعاقبا اعلام خواهند شد. Yes Yes Media ریچارد بیکن این مجموعه را با حمایت گروه SISTER در تولید مشترک Syco Entertainment و Savan Kotecha و Publicis Media Content Innovation در همکاری با Walt Disney Television Alternative تولید می کند. الیزابت مرداک نیز به عنوان تهیه کننده اجرایی در هیئت مدیره حضور دارد و مت بنکس و اشلی ادنز به عنوان مجری برنامه و تهیه مه‌ریزی، به نمایندگی از جشنواره با اشاره به پلانت [ ] ابراز همدردی کردند: «ما از دست دادن همکار عزیزمان و کهنه‌کار ۲۵ ساله مؤسسه ساندنس، مایک پلانت، که صبح امروز پس از بیانیه‌ای کوتاه درگذشت، عمیقاً متأسفیم.» مایک گنجینه ای برای موسسه، جشنواره و جامعه مستقل فیلم ما بود. حس شگفتی و شوخ طبعی او با اشتیاق بی حد و حصر و تعالی سرپرستی مطابقت داشت. برنامه فیلم کوتاه جشنواره ما و تور فیلم کوتاه جشنواره فیلم ساندنس با انرژی و ذوق فوق العاده مایک در فیلم شکل گرفت. امی ردفورد، دختر رابرت ردفورد، بنیانگذار ساندنس و یکی از اعضای هیئت مدیره جشنواره، همدردی خود را با پلانته به اشتراک گذاشت و او را \"روشنگر\" خواند. ردفورد در بیانیه‌ای نوشت: «او از طریق استعداد خارق‌العاده‌اش در کیوریتوری، داستان‌سرایان بی‌شماری را از طریق رسانه‌ی حیاتی فیلم کوتاه راه‌اندازی کرد که بسیاری از آن‌ها به برخی از ماندگارترین هنرمندان جهان تبدیل شدند. مایک اخلاق ساندنس را تجسم بخشید و نقش مهمی در حفظ تداوم ارزش‌های آن داشت. او با زمان و راهنمایی‌هایش سخاوتمندانه بود و در نوع خود خالق با استعدادی بود. اما ماندگارترین میراث مایک مهربانی اوست. این اولین چیزی بود که مردم در مورد او می‌گویند نه تنها صدماتی که مردم به او می‌دهند. به اندازه کافی خوش شانس بودم که او را می شناختم و او را دوست داشتم.»", "image_url": "https://variety.com/wp-content/uploads/2026/11/2023_short_film_party_jen_fairchild_0229_1024-1.jpg?crop=129px%2C87px%2C673px%2C378px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۲۰:۲۲"}, {"source": "Deadline", "title": "Netflix Releases New Peter Berg-Directed Spot Inspired By ‘Friday Night Lights’ Highlighting Thanksgiving Eve Game", "link": "https://deadline.com/2026/11/netflix-peter-berg-directed-friday-night-lights-thanksgiving-eve-game-1237233333/", "summary": "Netflix is streaming its first Thanksgiving Eve Game and has dropped a spot directed by Peter Berg, which was inspired by Friday Night Lights. The new spot titled Thankful for Football is narrated by Kyle Chandler and highlights the game between the Los Angeles Rams and the Green Bay P oll out on the KShopDemonHunters Instagram channel. Your precious KShop merch awaits at the online stores of Kayou , Mattel , Hasbro , Vans and LEGO . The pairing of Megan Thee Stallion with KPop Demon Hunters should be a winning combination. Megan is a star in her game with three career No. 1s on the Billboard Hot 100, and 45 total tracks on the singles chart. Her collection of accolades include four American Music Awards, four MTV Video Music Awards, three Grammy Awards, a Billboard Women in Music Award, and, in 2019, the Powerhouse Award at the 2019 Billboard Women in Music ceremony. The Houston Hottie has been heating up ahead of her Act III album. She’s dropped a trio of Tina Tuesday Freestyles, including the standout “Thin Ice,” which reached a new peak of No. 64 on the Billboard Hot 100 in its second week on the chart. And keep an eye out for her return as Denise for the season 2 finale of The Fall and Rise of Reggie Dinkins on NBC, which will beam out sometime in early 2027. Since it premiered on Netflix in June 2025, KPop Demon Hunters has crushed records for fun . Following the fictional girl group HUNTR/X as its members Rumi, Mira and Zoey bring the fight to the evil demons of this world, the animated film and its official soundtrack has been a monster hit. Just two months after it premiered, KPop Demon Hunters became Netflix’s most-watched film of all time, surpassing 236 million total views. Its standout song “Golden” spent eight weeks at No. 1 on the Billboard Hot 100 , and is one of four original songs from the film t", "date_str": "2026-11-25T16:30:00+00:00", "hash": "a75317fc86e58757", "title_fa": "مگان تی استالیون رئیس بزرگ KShop نتفلیکس در کمپین جدید است: نگاه اول انحصاری", "summary_fa": "مگان تی استالیون برای انعطاف‌پذیری بعدی خود، رجیستر را کار می‌کند و همه عکس‌های موجود در KShop را فراخوانی می‌کند. ستاره برتر هیپ هاپ تگزاس در یک تبلیغ سفارشی برای KPop Demon Hunters، که امشب (25 نوامبر) در جریان بازی شب شکرگزاری NFL در نتفلیکس پخش خواهد شد، بازیگری را به رخ می کشد. مگان مغازه دار معمولی شما نیست. او یک نیروی غیرقابل تحرک است، یک قهرمان سنگین وزن در سبک بازی که به سادگی نمی توان او را فریب داد، زیرا جریانی از مشتریان سعی می کنند بر روی موجودی او معامله کنند. چارلز ملتون، بازیگر شیطانی BEEF و مایکل اروین تالار مشاهیر NFL، از جمله افرادی هستند که شانس خود را روی چیزهای این هوادار امتحان می‌کنند، که شامل کارت‌های معاملاتی Kayou، عروسک‌های آوازخوان متل، هاسبرو لایت استیکز، مجموعه LEGO Derpy Tiger و Sussie Bird است. سوپر طرفداران گنجینه های دیگری را در قفسه ها مشاهده می کنند. این فروشگاه معمولی شما نیست و اینها خریداران معمولی شما نیستند. ساخته شده از استودیوی خلاق برند نتفلیکس، مینی اپیزود و موارد دیگر در کانال اینستاگرام KShopDemonHunters منتشر خواهد شد. کالای ارزشمند KShop شما در فروشگاه‌های آنلاین Kayou، Mattel، Hasbro، Vans و LEGO منتظر می‌ماند. جفت شدن Megan Thee Stallion با KPop Demon Hunters باید یک ترکیب برنده باشد. مگان یک ستاره در بازی خود با سه نفر شماره 1 در بیلبورد هات 100 و مجموع 45 آهنگ در جدول تک آهنگ است. مجموعه افتخارات او شامل چهار جایزه موسیقی آمریکا، چهار جایزه موسیقی ویدئوی MTV، سه جایزه گرمی، یک جایزه زنان بیلبورد در موسیقی، و در سال 2019، جایزه پاورهاوس در مراسم بیلبورد زنان در موسیقی 2019 است. Houston Hottie قبل از آلبوم Act III خود داغ شده است. او سه سبک آزاد تینا سه‌شنبه را حذف کرده است، از جمله «یخ نازک» برجسته، که در دومین هفته‌اش", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/megan-thee-stallion-1800-2026-netflix-kshop.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۴ آذر • ۲۰:۰۰"}, {"source": "Billboard", "title": "Horacio Palencia Celebrates Historic Billboard Chart Achievements: ‘I Like Making Music That Transcends’", "link": "https://www.billboard.com/music/latin/horacio-palencia-historic-chart-achievements-interview-1236389484/", "summary": "Nearly 20 years ago, Horacio Palencia reached the top of Billboard s Regional Mexican Airplay chart as a songwriter for the first time. Today, the acclaimed Mexican musician has amassed 45 No. 1s on that chart, the most recent being Pa Él by Los Ángeles Azules and Tini, which topped the ranking dated Nov. 14. Palencia s charts journey began on June 16, 2007, with De Ti Exclusivo by La Arrolladora Banda El Limón de René Camacho, which marked the beginning of a golden era for the Sinaloan band and gave a significant boost to the regional Mexican genre. Palencia went on to pen hits for La Arrolladora and other groups, including Banda El Recodo de Cruz Lizárraga ( Me Gusta Todo de Ti ), Banda MS (“Hermosa Experiencia,” “No Me Pidas Perdón”), La Adictiva ( Nada Iguales, El Amor de Mi Vida ) and others. At 44, Palencia — born in El Rosario, a small town near Mazatlán, Sinaloa — boasts one of the most significant repertoires in the regional Mexican genre, with accolades including six Latin Grammy nominations, multiple BMI Latin Awards for songwriter of the year, the 2024 BMI Presidential Award and numerous Billboard Latin Music Awards. I like making music that transcends, that lasts for many years and that people continue to sing for generations, he tells Billboard Español from his studio in Mazatlán, which opened its doors on Nov. 16 the same day his name was added to the Walk of Stars in the Mexican city. Palencia s career has evolved alongside the music industry over two decades. With more than 3,000 songs written, the singer-songwriter s work has also been performed by major artists such as Christian Nodal, Grupo Firme, Calibre 50, Fuerza Regida and, more recently, Ricardo Montaner. (The latter reached the top of Regional Mexican Airplay for the first time in September with Para Que Seas Feliz, co-written by Palencia). About those experiences and others to come, he talks to Billboard . Did you ever think your songs would change the direction of a music genre? There s always the hope of doing great things. Since the beginning of my career, I ve aimed to create songs that endure over time, and fortunately, that s been the case. I m from the old school of regional Mexican music, the traditional style, and for me, it s a blessing to have been part of the boom of banda music from Sinaloa when albums started selling millions of copies. You ve reached No. 1 on the Regional Mexican Airplay chart 45 times with your songs. Was this your expectation as a songwriter? Whe", "date_str": "2026-11-25T16:29:33+00:00", "hash": "9e7b8adc50ae1173", "title_fa": "هوراسیو پالنسیا دستاوردهای نمودار بیلبورد تاریخی را جشن می گیرد: \"من دوست دارم موسیقی فراتر از آن بسازم\"", "summary_fa": "نزدیک به 20 سال پیش، هوراسیو پالنسیا به عنوان آهنگساز برای اولین بار به صدر جدول پخش منطقه ای مکزیکی بیلبورد رسید. امروز، این نوازنده تحسین شده مکزیکی 45 رتبه اول را در آن چارت به دست آورده است که جدیدترین آنها Pa Él توسط Los Ángeles Azules و Tini است که در رده بندی تاریخ 14 نوامبر در صدر قرار گرفت. سفر Palencia در نمودار در 16 ژوئن 2007 با De Ti Exclusivo توسط La Arrolladora Banda El Limón de René Camacho آغاز شد که آغاز یک دوره طلایی برای گروه Sinaloan بود و رونق قابل توجهی به ژانر منطقه ای مکزیکی داد. پالنسیا برای La Arrolladora و سایر گروه‌ها، از جمله Banda El Recodo de Cruz Lizárraga (Me Gusta Todo de Ti)، Banda MS (\"Hermosaexperience\"، \"No Me Pidas Perdón\")، La Adictiva (Nothing Iguales، El Amor de Mi Vida) و دیگران، آهنگ‌های آهنگسازی کرد. پالنسیا در 44 سالگی - متولد ال روزاریو، شهر کوچکی در نزدیکی مازاتلان، سینالوآ - یکی از مهم‌ترین رپرتوارها در ژانر منطقه‌ای مکزیک را به خود اختصاص داده است که شامل شش نامزدی لاتین گرمی، چندین جوایز لاتین BMI برای ترانه‌سرا سال، جوایز متعدد ریاست جمهوری BMI در سال 2024، جایزه لاتین موسیقی هیئت مدیره بی‌ام‌آل است. او از استودیوی خود در Mazatlán به Billboard Español می گوید که در 16 نوامبر در همان روزی که نامش به Walk of Stars در شهر مکزیک اضافه شد، به بیلبورد اسپانیایی می گوید که من موسیقی فراتر از آن را دوست دارم که سال ها طول بکشد و مردم به آواز خواندن نسل ها ادامه دهند. حرفه Palencia در طول دو دهه در کنار صنعت موسیقی تکامل یافته است. با بیش از 3000 آهنگ نوشته شده، آثار این خواننده و ترانه سرا توسط هنرمندان بزرگی مانند کریستین نودال، گروپو فیرم، کالیبر 50، فوئرزا رگیدا و اخیراً ریکاردو", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Horacio-Palencia-cr-Eder-Leos-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آذر • ۱۹:۵۹"}, {"source": "Billboard", "title": "Will Smith Surprises Former ‘Fresh Prince’ Co-Star With ‘DWTS’ Season 35 Finale Cameo: I Am In Awe. I Am Inspired’", "link": "https://www.billboard.com/culture/tv-film/will-smith-surprises-tatyana-ali-dwts-season-35-finale-video-1236389432/", "summary": "Will Smith had nothing but superlatives for his former The Fresh Prince of Bel-Air co-star Tatyana Ali on Tuesday night s (Nov. 24) season 35 finale of Dancing With the Stars . Ali and her professional dance partner, Jan Ravnik, performed three times, earning high marks for their salsa to Hugel Solto s Jamaican (Bam Bam), jive to Wilson Pickett s Land of 1000 Dances and freestyle to Cab Calloway s Minnie the Moocher and Judy Garland s Over the Rainbow. Related AEW Dynamite Collision Thanksgiving Eve Livestream: Where to Watch the Wrestling Event Online Free Colman Domingo Reveals He Will Smith Went to High School Together: He Was the Cool Kid I Was the Nerd These K-Beauty Products Loved by K-Pop Stars Are Up to 43% Off During Black Friday Sales I am amazed , a smiling Smith told Ali in a surprise video that aired before the season s winner was revealed. I am in awe, I am inspired. Keep doing what you re doing. I love you, he added as he blew a kiss to the camera. Ali and Ravnik ended up in fourth place at the end of the night, with Paralympic athlete Ezra Frech and his professional partner Daniella Karagach taking home the mirror ball trophy. After the crowning, Ali and Ravnik spoke to ABC 30 and the professional dancer said he was still blown away by the A-list support the pair got. Elmo? I mean, Will Smith, yes, but Elmo? Ravnik joked after the fuzzy star dropped in to say he act نشان می دهد که \"کاهش قابل توجهی\" در شکستن توافق نامه های برگشتی در مورد تولیدات فیلمنامه ای بریتانیا وجود دارد. برای تولیدات گروه 1، [ ] برای تولیدات گروه 1، که تا 1.25 میلیون پوند (1.5 میلیون دلار) در هر ساعت پخش هزینه دارند، چرخش های شکسته از 107 ساعت در سال 2024 به 71 ساعت در سال 2025 کاهش یافته است، قبل از اینکه در طول چهار ماه اول سال 2026 به ساعت صفر کاهش یابد. چرخش از 158 ساعت در سال 2024 به 106 ساعت در سال 2025 و سپس به 48 ساعت در چهار ماه اول سال 2026 کاهش یافت. ارقام برای تولیدات گروه 3 (3 تا 8 میلیون پوند در هر ساعت پخش) یا گروه 4 (بیش از 8 میلیون پوند) ثبت نشده است. در اوایل سال جاری، Bectu اعتراضاتی را در خارج از مقر استودیوهای لندن از جمله دیزنی، نتفلیکس و آمازون رهبری کرد تا این موضوع را برجسته کند. اتحادیه همچنین با اعضا درگیر بوده و آگاهی را با کارفرمایان افزایش داده است تا برای اعمال زمان‌بندی بهتر تلاش کنند. Bectu اکنون از Pact می‌خواهد که به اندازه‌گیری ارقام شکست خورده ادامه دهد و گزارش‌ها را به گروه‌های 3 و 4، از جمله ویژگی‌های کم‌هزینه و تولیدات فیلم بزرگ، گسترش دهد. اتحادیه همچنین خواهان ارقامی برای تولیدات بدون فیلمنامه و همچنین برای همه تولیدات سینمایی و تلویزیونی در بریتانیا است تا متعهد شود که به زمان‌های چرخش پایبند باشند.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Bectu.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۹:۳۸"}, {"source": "Hollywood Reporter", "title": "All 17 Quentin Tarantino Movies, Ranked From Worst to Best", "link": "https://www.hollywoodreporter.com/lists/quentin-tarantino-movies-ranked-worst-best/", "summary": "As ‘The Further Mis-Adventures of Cliff Booth’ brings back Brad Pitt’s legendary stuntman, we look back on the ‘Once Upon a Time in Hollywood’ creator’s career of unchained pulp fiction, inglorious grindhouse flicks, natural born Bill-killers and the occasional true romance.", "date_str": "2026-11-25T16:03:19+00:00", "hash": "9d6916b363ee5277", "title_fa": "همه 17 فیلم کوئنتین تارانتینو، از بدترین تا بهترین رتبه بندی شده اند", "summary_fa": "از آنجایی که «ماجراهای اشتباه بعدی کلیف غرفه» بدلکار افسانه‌ای برد پیت را بازمی‌گرداند، به کارنامه خالق «روزی روزگاری در هالیوود» با داستان‌های تخیلی رها شده، فیلم‌های بی‌شکوه، قاتلان طبیعی بیل و گاه عاشقانه‌های واقعی نگاه می‌کنیم. ژوئن 1977. کلیف بوث پروژکتور را در سینمای نیو بورلی اجرا می‌کند، چند میله را نگه می‌دارد، و یک کامیون یدک‌کش را به سمت دربی تخریب می‌راند. اینها تنها کارهای روزانه او نیستند و همه آنها در شب هستند. بدلکار سابق در اوقات فراغت خود، باج گیران را با یک پاداش یا یک گلوله ناپدید می کند. چیزی به نام «جنگ ستارگان» سینماها را در برگرفته است و نیم قرن سرگرمی خانوادگی پرفروش را تهدید می کند. کلیف در دنیایی قدیمی‌تر زندگی می‌کند، در عین حال نجیب‌آلود، ترسناک و شیک. او با ماک‌های بداخلاقی، همسران مالیبوی کسل‌شده، قاتلان دنیای اموات، منتقد سابق سوپرفود روزنامه و هر کس دیگری که در صندوق عقب بود، می‌دوید. اینها افراد کلیف بوث - و کوئنتین تارانتینو نیز هستند. روزی روزگاری در دهه 1990، تارانتینو پسر بد فیلم مستقل بود که سوار بر یک سونامی جوانان موج سواری می کرد. اکنون او تاریخ‌نگار-سرگرم‌کننده حاکم ماست و احساسات سخت‌آرایی را با داستان‌های سینمایی پر می‌کند. او صاحب نیو بورلی واقعی در لس آنجلس واقعی است. بنابراین، وقتی نتفلیکس موافقت کرد که فیلم «روزی روزگاری در هالیوود» را بسازد، برای تبلیغ تئاترش مبلغ زیادی به او پرداخت کردند. فرنچایزها از زمان جنگ ستارگان بی‌معنا بوده‌اند. اما دنباله روی استریمر برای تارانتینو چیز جدیدی است. و The Further Mis-Adventures of Cliff Booth اولین بار در 30 سال گذشته است که شخصی غیر از او یکی از فیلمنامه های او را کارگردانی می کند. بیایید سر و صدا کنیم تا بفهمیم در فیلم‌شناسی او در چه جایگاهی قرار می‌گیرد.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/NEW-Quentin-Tarantino-Ranking-MAIN-Everett-SPLASH-2026.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۹:۳۳"}, {"source": "Variety", "title": "Salma Hayek Pinault and Saúl ‘Canelo’ Álvarez Board Cannes Palme d’Or Winner ‘For the Opponents,’ Igniting Its Oscar Campaign (EXCLUSIVE)", "link": "https://variety.com/2026/film/global/salma-hayek-pinault-saul-canelo-alvarez-for-the-opponents-1236957909/", "summary": "Salma Hayek Pinault and boxing world champion Saúl “Canelo” Álvarez two of Mexico’s greatest contemporary icons, have boarded Cannes 2026 Palme d’Or winner “For the Opponents” as executive producers galvanizing Mexico’s push for the film’s contention in the Academy Award Live Action Short Film race. “For the Opponents” (“Para los Contrincantes”) has already grabbed a [ ]", "date_str": "2026-11-25T16:03:12+00:00", "hash": "0c8f0fbc186bbceb", "title_fa": "سلما هایک پینو و ساول «کانلو» آلوارز برنده نخل طلای کن «برای مخالفان» که کمپین اسکار خود را روشن می‌کند (اختصاصی)", "summary_fa": "سلما هایک پینو و قهرمان بوکس جهان، سائل «کانلو» آلوارز، دو تن از بزرگ‌ترین نمادهای معاصر مکزیک، برنده نخل طلای کن 2026 به نام «برای مخالفان» به عنوان تهیه‌کنندگان اجرایی تلاش مکزیک برای رقابت این فیلم در رقابت‌های کوتاه رادیویی اسکار را بر عهده گرفتند. \"برای مخالفان\" (\"Para los Contrincantes\") قبلاً [ ] به عنوان تهیه کننده اجرایی به فیلم ملحق شده است، حمایت دو نماد مکزیکی کمپین فیلم را برای به رسمیت شناختن فیلم کوتاه اکشن زنده اسکار تقویت خواهد کرد. ادامه فیلم «سیمون کوهستان» نویسنده و کارگردان آرژانتینی فدریکو لوئیس، اولین فیلم انفرادی او و جایزه بزرگ هفته منتقدان کن در سال 2024. داستان‌های مرتبط توطئه هیجان‌انگیز بیداری، با بازی کوین اسپیسی، در ایالات متحده اکران می‌شود (اختصاصی) با شروع محکومیت 10 ساله راسل برند، چرا سلبریتی‌ها از قدرت افشاگری می‌ترسند، با این حال، حمایت هایک و کانلو از رسانه‌ها و آکادمی به سطح دیگری خواهد رسید. «برای حریفان» با بازی دامیان لوپز جوان و فیلمبرداری 16 میلی‌متری و با فرمت 4:3 ​​به دنبال دامیان، پسر جوانی است که توسط مربی پدرش برای مسابقه بوکس کودک ثبت‌نام شده است. سپس چهار دور مبارزه طول می‌کشد، با دستورات پدر که خارج از صفحه نمایش شنیده می‌شود – اگر دهانتان را باز کنید ممکن است فکتان بشکند، «دست‌هایتان را بالا بگیرید»، «دو مشت به سینه بیاندازید، سپس ضربه‌ای به سرش بزنید» در حالی که او دام کوتاه‌تر از اعتصاب حمایت کردند. میزان مشارکت 75.03 درصد بود. اخبار مرتبط جدیدترین ایده بی بی سی برای صرفه جویی 500 میلیون پوندی: اخبار مشاوران را بیاورید بی بی سی برای راه اندازی CBeebies Hub در نتفلیکس. آخرین مهلت متوجه شد که نمایندگان NUJ تلاش های هماهنگی برای رای گیری در مورد اقدامات صنعتی انجام داده اند. ماموریت اقدام به مدت یک سال طول می کشد و قدرت مذاکره اتحادیه در برابر بی بی سی را تقویت می کند. NUJ گفت: این آخرین راه حل است و هنوز تصمیمی برای اقدام اتخاذ نشده است. بی بی سی برای اظهار نظر تماس گرفته است. هدف صرفه جویی 51 میلیون پوندی BBC News کمکی به هدف کلی پخش کننده برای صرفه جویی 500 میلیون پوندی در سال های آینده است. بی‌بی‌سی حدود 200 میلیون پوند از این پس‌انداز را پرده‌برداری کرده است، که به دلیل خونریزی بیش از دو میلیون نفر از پرداخت‌کنندگان هزینه مجوز از سال 2020، مورد نیاز است. هنگامی که NUJ رای گیری ماه گذشته را اعلام کرد، بی بی سی گفت که این یک \"تحول ناامید کننده\" بود. رودری تالفان دیویس، معاون مدیر کل بی‌بی‌سی، گفت: در ماه‌های اخیر، بحث‌های سازنده و گسترده‌ای با NUJ داشته‌ایم و واضح بوده‌ایم که هر کاری ممکن است برای به حداقل رساندن اخراج‌های اجباری انجام خواهیم داد.", "image_url": "https://deadline.com/wp-content/uploads/2025/06/bbc-news-at-six-in-studio-d-202408-001-01.webp?w=1024", "category": "هوش مصنوعی مولد", "tags": ["عامل‌های هوشمند", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۹:۲۲"}, {"source": "Variety", "title": "Peacock Is $2.99 a Month With This Black Friday Deal", "link": "https://variety.com/2026/shopping/news/peacock-black-friday-deal-sign-up-online-1236958024/", "summary": "After sitting out Black Friday last year, Peacock is back with a deal that brings down the price of a subscription to $2.99 a month. From now through Cyber Monday, Nov. 30, new and eligible returning subscribers can sign up for Peacock Select for $2.99 a month for three months (normally $8.99 a month) or [ ]", "date_str": "2026-11-25T15:59:28+00:00", "hash": "a78e8f70af1e3e31", "title_fa": "با این معامله جمعه سیاه، Peacock 2.99 دلار در ماه است", "summary_fa": "اگ s,” Coachella’s lawyers write. “Plaintiffs’ requests have been of minimal benefit; Walmart typically stops for a period of time, but then resumes.” The case claims Walmart is targeting festivalgoers at nearby stores, citing knockoff merch at locations in La Quinta, Calif., and North Indio, Calif., both of which are a short drive away. It cites the La Quinta Walmart selling coolers and folding chairs under a direct copy of the festival’s logo, as well as an in-store display featuring a miniature version of the Ferris wheel that had been created by Coachella sponsor Absolut Vodka. Coachella’s lawyers say fans and others have clearly taken notice. In an Instagram post cited in the lawsuit, the local Palm Springs newspaper The Desert Sun posted a video of knockoff Coachella tumblers and tank tops with the caption “Who needs the merch tent when you have the North Indio Walmart?” Goldenvoice is no stranger to trademark litigation. It sued Urban Outfitters in 2017 for using “Coachella” in apparel names and ecommerce metadata, and a Los Angeles festival called “Hoodchella” before that. In 2022, it filed another case against concert giant Live Nation for promoting a nearby event called “Coachella Day One 22.” And in 2024, it sued a local craft beer company called Coachella Valley Brewing Co. for using the Ferris wheel in branding. Neither side immediately returned requests for comment on Wednesday (Nov. 25).", "date_str": "2026-11-25T15:26:31+00:00", "hash": "572c3f1f1cf11495", "title_fa": "کواچلا از والمارت به دلیل فروش ناک آف در فروشگاه های نزدیک جشنواره شکایت کرد: \"چه کسی به چادر کالا نیاز دارد؟\"", "summary_fa": "کواچلا از والمارت به دلیل اتهاماتی مبنی بر اینکه این غول خرده فروشی سال ها کالاهای تقلبی جشنواره را به رغم درخواست های مکرر برای توقف، فروخته است، شکایت کرده است. در شکایتی در روز سه شنبه (24 نوامبر)، صاحبان جشنواره والمارت را به نقض علائم تجاری کواچلا با چسباندن نام و لوگو روی پیراهن‌ها، لیوان‌ها و سایر اقلام، اغلب در فروشگاه‌های واقع در نزدیکی محوطه باشگاه امپایر پولو که جشنواره سالانه در آن برگزار می‌شود، متهم می‌کنند. دیزنی مرتبط به اتهام استفاده از موسیقی غیرمجاز در تبلیغات رسانه‌های اجتماعی: هرگز یک دلار پرداخت نکرده است. که جشنواره را اداره می‌کند، می‌گویند که از سال 2017 از والمارت خواسته‌اند که متوقف شود، بی‌فایده است و جشنواره را «هیچ گزینه‌ای جز طرح دعوای فعلی» باقی نمی‌گذارد. وکلای کواچلا می‌نویسند: «شاکی‌ها درخواست‌ها و درخواست‌های مکرر از والمارت را برای توقف فروش و تبلیغات کالاهای متخلف ارائه کرده‌اند. درخواست‌های شاکیان سود کمتری داشته است؛ والمارت معمولاً برای مدتی متوقف می‌شود، اما سپس از سر می‌گیرد. این پرونده ادعا می‌کند که Walmart علاقه‌مندان به جشنواره‌ها را در فروشگاه‌های اطراف هدف قرار می‌دهد، با استناد به کالاهای غیرفعال در مکان‌هایی در لا کوئینتا، کالیفرنیا، و شمال ایندیو، کالیفرنیا، که هر دو در فاصله کوتاهی با ماشین هستند. این خودرو به La Quinta Walmart که کولرها و صندلی‌های تاشو را زیر یک کپی مستقیم از لوگوی جشنواره می‌فروشد، و همچنین نمایشگری در فروشگاه با نسخه مینیاتوری چرخ و فلک که توسط حامی کواچلا Absolut Vodka ساخته شده است، اشاره می‌کند. وکلای کوچلا می گویند که طرفداران و دیگران به وضوح متوجه این موضوع شده اند. روزنامه محلی پالم اسپرینگز The Desert Sun در یک پست اینستاگرامی که در این شکایت ذکر شده است، ویدیویی از لیوان‌های کوچلا و تاپ‌های مخزن را با عنوان «چه کسی به چادر تجاری نیاز دارد وقتی که والمارت شمالی ایندیو دارید»", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2272033055-e1795617846140.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۴ آذر • ۱۸:۵۶"}, {"source": "Rolling Stone", "title": "50 Years Ago Today: Neil Young Played a 1 A.M. Concert the Morning of the Last Waltz", "link": "https://www.rollingstone.com/music/music-features/50-years-neil-young-the-last-waltz-late-night-show-1235663524/", "summary": "In an extraordinary feat that required some chemical assistance, Neil Young played two shows in Atlanta on Nov. 24, 1976, and then flew across the country to play with the Band in San Francisco", "date_str": "2026-11-25T15:25:19+00:00", "hash": "1c57ebb7dea8f5d1", "title_fa": "50 سال پیش امروز: نیل یانگ ساعت 1 بامداد بازی کرد. کنسرت صبح آخرین والس", "summary_fa": "در یک شاهکار خارق‌العاده که نیاز به کمک شیمیایی داشت، نیل یانگ در 24 نوامبر 1976 دو نمایش را در آتلانتا اجرا کرد و سپس در سراسر کشور پرواز کرد تا با گروه در سانفرانسیسکو بازی کند. آنها شامل تصمیم او برای رفتن به یک خندق موزیکال پس از به ثمر رساندن یک ضربه در میانه راه با Heart of Gold هستند. او \"آبخانه بیشتر!\" فرمان به اعضای خدمه که یک مجموعه بلندگو را به خانه او و دیگری را به انباری متصل کردند در حالی که او در یک قایق پارویی که بین آن دو شناور بود به هاروست گوش می داد. و سنگ کوکائین در حین آخرین والس در سوراخ بینی او نشسته بود که تیم تدوین مارتین اسکورسیزی با هزینه هنگفت فریم به فریم آن را حذف کرد. همه اینها درست است، اما اجازه دهید روی مورد دوم تمرکز کنیم، زیرا کنسرت آخرین والتز 50 سال پیش امروز برگزار شد، و حادثه کوکائین نیاز به زمینه ای دارد. اول از همه، یانگ به سختی تنها کسی بود که در جریان The Last Waltz یا تقریباً هر کنسرت بزرگ راک دیگری در آن زمان از کوکائین استفاده کرد. در آن زمان این دارو در همه جا وجود داشت و بیشتر مردم خطرات آن را کاملاً درک نمی کردند. ثانیاً، کوکائین احتمالاً یکی از تنها مواد روی زمین بود که می‌توانست یانگ را به صحنه آخرین والتز برساند، با توجه به برنامه روان‌پریشی‌اش در چند هفته قبل، و تنها در آن روز، که با کنسرتی در ساعت 1 بامداد در بیش از 2000 مایل دورتر در آتلانتا شروع کرد و قبل از پرواز به سراسر قاره برای بازی با گروه در آخرین نمایش رابرتسون با گروه روبی. The Last Waltz نقطه اوج دیوانه کننده ترین سال تور حرفه ای یانگ بود. با یک سری قرار در ژاپن و اروپا", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Neil-Young-50-Years-Ago-Today.jpg?crop=0px%2C54px%2C1800px%2C1015px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۴ آذر • ۱۸:۵۵"}, {"source": "Variety", "title": "Miley Cyrus to Accept CNN Heroes Legacy Award to Dolly Parton", "link": "https://variety.com/2026/tv/news/miley-cyrus-cnn-heroes-legacy-award-dolly-parton-12369 awsuits over AI labs using copyrighted music to train models. Now, that case is backed by the star power of a huge country trio, a Latin music titan and an R B legend. “Suno built and trained a model to index musicians by name,” lawyers for the artists write. “It encoded musicians’ identities into its AI model to create its commercial product without consent, and now exploits those identities by publicly using musicians’ names to Suno’s considerable commercial benefit.” In addition to the members of the Chicks (Natalie Maines, Martie Maguire and Emily Strayer) and the estates of the late Colón and Moore, the lawsuit was also joined by 10 more artists, including David Longstreth of the indie rock band Dirty Projectors; Carl Craig, a pioneering DJ of Detroit techno; Franz Nicolay of rock band The Hold Steady; and Kealiʻi Reichel, a top Hawaiian music artist. Artists as big as Madonna and SZA have spoken out against AI music , and dozens of stars like Billie Eilish, Katy Perry, Luis Fonsi and the estates of Bob Marley and Frank Sinatra joined an open letter in 2024 calling unlicensed music AI an “assault on human creativity” that “must be stopped.” But few have taken actual legal action. An indie country singer named Tony Justice is litigating a class action against Suno, and Isbell’s case was joined by Camper Van Beethoven frontman David Lowery and a handful of others. The biggest case yet came from the owners of Elvis Presley’s intellectual property, who launched landmark cases against Suno and Anthropic this fall. The Chicks, who have a long history of outspoken advocacy , represent by far the biggest living musical act to yet sue over AI. More artists could be added to the case in the future, and since the case was filed a", "date_str": "2026-11-25T15:07:33+00:00", "hash": "eadeb591fbc8b28a", "title_fa": "The Chicks & Willie Colón به شکایت موسیقی هوش مصنوعی علیه Suno می پیوندند: «هویت های اختلاس شده»", "summary_fa": "The Chicks، Willie Colón و Sam Moore در حال پیوس : "Mindy Kaling Will Be Honored With The Hollywood Reporter’s Equity in Entertainment Award at Women in Entertainment Gala", "link": "https://www.hollywoodreporter.com/business/business-news/mindy-kaling-hollywood-reporter-equity-entertainment-award-1236762197/", "summary": "Maitreyi Ramakrishnan is set to present Kaling with the award at the Los Angeles event, which is presented by founding sponsor Lifetime and title sponsor Lilly. Mary Beth Barone will open the program.", "date_str": "2026-11-25T15:00:00+00:00", "hash": "45348e64e444e1e1", "title_fa": "میندی کالینگ با جایزه حقوقی هالیوود ریپورتر در نمایشگاه زنان در اینترتینمنت گالا مفتخر خواهد شد.", "summary_fa": "Maitreyi Ramakrishnan قرار است این جایزه را در رویداد لس آنجلس به کالینگ اهدا کند، جایزه ای که توسط موسس لایف تایم و حامی عنوان لیلی اهدا می شود. مری بث بارون برنامه را باز خواهد کرد. هالیوود ریپورتر روز چهارشنبه اعلام کرد که میندی کالینگ نویسنده، کارگردان، بازیگر و تهیه کننده برنده جایزه جایزه Equity in Entertainment امسال را در مراسم جشن صبحانه سالانه زنان در سرگرمی در لس آنجلس دریافت خواهد کرد. بازیگر Maitreyi Ramakrishnan که در سریال پرطرفدار نتفلیکس Never Have Iver به کالینگ بازی کرد، این جایزه را به کالینگ اهدا خواهد کرد. کالینگ به تیلور سویفت می‌پیوندد که هالیوود ریپورتر قبلاً اعلام کرده بود که جایزه رهبری شری لنسینگ را به عنوان مفتخر در مراسم جشن امسال دریافت می‌کند. خبرهای مرتبط اخبار عمومی تیلور سوئیفت با جایزه رهبری شری لنسینگ هالیوود ریپورتر در مراسم زنان در سرگرمی تجلیل خواهد شد. لیلی لینا پولیمی، مدیر ارشد بازاریابی – مصرف کننده در Eli Lilly and Company، نکاتی را در مورد تقاطع مهم سلامت و سرگرمی به اشتراک خواهد گذاشت. جایزه Equity in Entertainment به افرادی می پردازد که صدای جوامعی را که کمتر در صنعت سرگرمی حضور دارند تقویت می کنند. این جایزه در سال 2016 ایجاد شد و جنیفر لوپز، سلنا گومز، کری واشنگتن، عیسی رای، رایان مورفی، امی پاسکال و نینا جاکوبسون از جمله برگزیدگان قبلی بودند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Mindy-Kaling-Photo-by-Ari-Michelson-H-2026.jpg?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Hollywood Reporter", "title": "Gotham Film & Media Institute Names 2026 Winners of Focus Features Student Short Film Showcase (Exclusive)", "link": "https://www.hollywoodreporter.com/movies/movie-news/2026-gotham-film-media-institute-focus-student-short-films-1236762790/", "summary": "The five winners will each receive a cash grant and have the opportunity for their short to be shown on Focus Features' digital streaming platform.", "date_str": "2026-11-25T15:00:00+00:00", "hash": "a0f25074eb0dd9a1", "title_fa": "موسسه فیلم و رسانه گاتهام برندگان 2026 نمایشگاه فیلم کوتاه دانشجویی Focus Features را نام برد (اختصاصی)", "summary_fa": "پنج برنده هر کدام یک کمک هزینه نقدی دریافت خواهند کرد و فرصتی برای نمایش کوتاه خود در پلتفرم پخش دیجیتالی Focus Features خواهند داشت. موسسه رسانه فیلم گاتهام برندگان نمایشگاه فیلم کوتاه دانشجویی فوکوس فیچرز ۲۰۲۶ خود را انتخاب کرده است. پنج برنده این برنامه که با مشارکت Decentralized Pictures ارائه شده‌اند، آنا آلپیزار از دانشگاه نیویورک، شیله لیو از CalArts، نیکلاس پالاسیو از کالج شهر نیویورک، راویا رسول از کالج کلمبیا شیکاگو و کینتینگ وانگ از کلمبیا هستند. فیلمسازان برنده که در مراسم جوایز گاتهام 2026 در روز دوشنبه، نوامبر 2026 تجلیل خواهند شد. 30، هر کدام کمک نقدی دریافت خواهند کرد و این فرصت را خواهند داشت که فیلمشان در پلتفرم استریم دیجیتال Focus Features و پلتفرم استریم غیرمتمرکز DCP+ Pictures نمایش داده شود. داستان‌های مرتبط فیلم‌ها کارگردان مارپیچ پائولو استریپولی با تصویر ترسناک اسکار صحبت می‌کند: من سعی می‌کنم انتظارات را پایین بیاورم تلویزیون چرا مایک فلانگان فقط نمی‌توانست کری وایت را بکشد «یکی از هیجان‌انگیزترین بخش‌های کاری که ما در Focus انجام می‌دهیم، کشف استعدادهای جدید است. جیسون کسیدی، نایب رئیس Focus Features، در بیانیه‌ای گفت: «فیلمسازان امسال این روحیه را تجسم می‌دهند و داستان‌های جسورانه، شخصی و دیدگاه‌های تازه‌ای را از سرتاسر جهان به نمایش می‌گذارند.» ما مفتخریم که به همکاری خود با تیم بزرگ The Gotham ادامه می دهیم و این گروه استثنایی از فیلمسازان در حال رشد را جشن می گیریم.\" این نمایشگاه که برای دانشجویان MFA که یک فیلم کوتاه را در سه سال تحصیلی گذشته به پایان رساندند باز است، به دنبال دسترسی گروهی متنوع از فیلمسازان نوظهور به صنعت فیلم و حمایت از توزیع چند پلتفرمی آثارشان است.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/gotham_focus.jpg?crop=116px%2C0px%2C1179px%2C660px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Variety", "title": "Danny McBride Stars in Another Kalshi Ad as Annoying Uncle at Thanksgiving (EXCLUSIVE)", "link": "https://variety.com/2026/tv/news/danny-mcbride-kalshi-ad-thanksgiving-1236957541/", "summary": "Danny McBride has teamed up with Kalshi again, writing and starring in another ad for the prediction market platform. In the one-minute spot, McBride plays a know-it-all uncle at the Thanksgiving dinner table, spewing predictions while his niece fact-checks him with odds on Kalshi. Charlie and the Chocolate Factory star Deep Roy stars as McBride s [ ]", "date_str": "2026-11-25T15:00:00+00:00", "hash": "0c3646dab1581767", "title_fa": "دنی مک براید در یک تبلیغ کالشی دیگر در نقش عموی مزاحم در روز شکرگزاری (اختصاصی)", "summary_fa": "دنی مک براید دوباره با کالشی همکاری کرده و در آگهی دیگری برای پلتفرم بازار پیش‌بینی می‌نویسد و در آن بازی می‌کند. در این فیلم یک دقیقه‌ای، مک براید در نقش یک عمو که همه چیز را می‌داند در میز شام شکرگزاری بازی می‌کند، در حالی که خواهرزاده‌اش حقایق او را بررسی می‌کند و در مورد کالشی شانس دارد. دیپ روی، ستاره Charlie and the Chocolate Factory در نقش McBride [ ] خانواده من باحال هستند، اما می توانند آزاردهنده هم باشند. مک براید در ماشین به او می گوید فقط لبخند بزنید، از غذا لذت ببرید و تشکر کنید. به زودی، او در مورد نرخ بهره، تورم و صورت حساب های بوفالو بحث می کند. داستان‌های مرتبط مجموعه‌های تور جهانی طلایی KPop Demon Hunters در سال 2027 قرارهای آرنا کوین کلاین با مریل استریپ در سریال اصلاحات در نتفلیکس اوه، بازارها دوباره متحد می‌شود. وای بزرگ! او می گوید. من می توانم تئوری های خود را بدون استفاده از داده های کوچک احمقانه فرموله کنم. کارگردانی این تبلیغ بر عهده رندی کرالمن است که آخرین تبلیغ کالشی مک براید را بر عهده داشت که ستاره Eastbound Down را در مقابل شین گیلیس به عنوان هواشناسان متخاصم نشان می داد. روی همچنین در آن تبلیغ به عنوان نوعی پیشگوی هواشناسی ظاهر شد که واقعاً اطلاعات خود را از کالشی دریافت می کرد. مک براید در بیانیه‌ای گفت: «هر روز شکرگزاری با نظرات زیاد و مقدار زیادی شراب در جعبه حاضر می‌شوم، بنابراین وقتی کالشی از من خواست که نقش عمویی را بازی کنم که توسط خواهرزاده‌اش و کالشی بررسی می‌شود، مجبور نبودم کلی بازیگری انجام دهم. بازگشت به صحنه فیلم‌برداری با دیپ روی همیشه هیجان‌انگیز است. ما احساس می‌کنیم که با دادن سلاح مخفی به همه میزهای شام در آمریکا برای بستن دهان همه اعضای خانواده، خدمات عمومی انجام می‌دهیم.»", "image_url": "https://variety.com/wp-content/uploads/2026/11/Screenshot-2026-11-24-at-4.16.02-PM.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Variety", "title": "Vatican-Produced Doc ‘Green Lava’ Drops Trailer Featuring Justin Bieber’s ‘Everything Hallelujah’ (EXCLUSIVE)", "link": "https://variety.com/2026/awards/global/vatican-doc-trailer-justin-bieber-everything-hallelujah-1236957800/", "summary": "“Green Lava,” an inspirational Vatican-produced documentary short in the running for the Oscars, has unveiled its new global trailer which features Justin Bieber’s song “Everything Hallelujah.” The doc follows a 22-year-old Italian man named Giacomo Mattivi, who lives with Duchenne Muscular Dystrophy. Use of Bieber’s “Everything Hallelujah” was secured through a licensing agreement with Universal [ ]", "date_str": "2026-11-25T15:00:00+00:00", "hash": "f135da6d0dcfa3ec", "title_fa": "تریلر Doc «Green Lava» تولید شده توسط واتیکان با نمایش «همه چیز هاللویا» جاستین بیبر (اختصاصی)", "summary_fa": "«گدازه سبز»، یک مستند کوتاه الهام‌بخش محصول واتیکان که در حال رقابت برای اسکار است، تریلر جهانی جدید خود را با آهنگ «همه چیز هاللویا» جاستین بیبر رونمایی کرد. این مستند درباره یک مرد ۲۲ ساله ایتالیایی به نام جاکومو ماتیوی است که با دیستروفی عضلانی دوشن زندگی می کند. استفاده از \"همه چیز هاللویا\" بیبر از طریق توافق نامه مجوز با یونیورسال تضمین شد. تریلر جهانی جدید خود را که آهنگ جاستین بیبر به نام «Everything Hallelujah» را به نمایش می گذارد، رونمایی کرد. این مستند درباره یک مرد ۲۲ ساله ایتالیایی به نام جاکومو ماتیوی است که با دیستروفی عضلانی دوشن زندگی می کند. بر اساس بیانیه ای، استفاده از \"همه چیز هاللویا\" بیبر از طریق توافق نامه مجوز با Universal Music Enterprises، بخشی از UMG Recordings, Inc. پس از معرفی توسط مدیر موسیقی دانیل وایزمن، تضمین شد. در بیانیه آمده است که مضامین ایمان و قدردانی این آهنگ بازتاب دیدگاه جاکومو به زندگی و کاوش مستند خانواده، استقامت و امید است. شرایط مالی فاش نشد. داستان‌های مرتبط مستند برند راسل از جیمی ساویل: یک داستان ترسناک بریتانیایی تهیه‌کنندگان در نتفلیکس چند روز پس از تجاوز، محکومیت آنتونی بویل برای تبدیل شدن به سم بنکمن-فرید برای «نودوست‌ها» و یافتن خاکستری در فیلم‌های شرور تاریخ: «من آدم‌های واقعی بیشتری بازی نکرده‌ام».", "image_url": "https://variety.com/wp-content/uploads/2026/09/VaticanOscar.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی", "نتفلیکس"], "datetime_fa": "۴ آذر • ۱۸:۳۰"}, {"source": "Variety", "title": "Gilles Villeneuve Biopic ‘The Rise of a Legend’ Gives Racing Genre a Grungier Spin: It’s the ‘Anti-“F1”’", "link": "https://variety.com/2026/film/festivals/gilles-villeneuve-biopic-the-rise-of-a-legend-1236957807/", "summary": "“Villeneuve: The Rise of a Legend” director Yan Lanouette Turgeon doesn’t mince his words, saying his 1970s-set biopic of Formula 1 racer Gilles Villeneuve is the antithesis of Joseph Kosinski’s “F1,” starring Brad Pitt. His film closes Torino Film Festival next week before a wider international rollout. We re the anti- F1,' he says. We re so far [ ]", "date_str": "2026-11-25T14:46:56+ t.ir/archive/2026-09-15.html"}, {"date_key": "2026-09-14", "p_date": "۲۳ شهریور ۱۴۰۵", "g_date": "۱۴ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-14.html"}, {"date_key": "2026-09-13", "p_date": "۲۲ شهریور ۱۴۰۵", "g_date": "۱۳ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-13.html"}, {"date_key": "2026-09-12", "p_date": "۲۱ شهریور ۱۴۰۵", "g_date": "۱۲ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-12.html"}, {"date_key": "2026-09-11", "p_date": "۲۰ شهریور ۱۴۰۵", "g_date": "۱۱ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
