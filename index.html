n the news. The decision comes just days after the board said it had no intention of reinstating Huang, who resigned as Nvidia CEO earlier this month following an extramarital affair scandal and a board investigation into concerns he might have been the subject of a foreign intelligence effort. \"I am honored to return to NVIDIA and lead one of the most consequential technology companies in the world at the beginning of a new industrial revolution,\" said Huang in a statement. \"I take this responsibility with the greatest humility and renewed commitment. I want to thank the Nvidia Board for its confidence and deliberation through this process. The board said it investigated reports that Huang had been targeted in a foreign intelligence effort, forming a committee \"solely of independent directors.\" It said the committee's investigation \"will proceed to conclusion.\" The resignation of Huang from Nvidia, which had become the backbone of the AI economy, sent shockwaves through the industry and threw the future of Nvidia's customers and own engineers into question. So central was Huang to the AI boom that Nvidia lost $1 trillion in market value after Huang's exit. President Donald Trump welcomed Huang's reinstatement, calling it the \"correct and proper decision.\" \"The Country needs Jensen's leadership at NVIDIA in order to e", "date_str": "2026-11-23T14:03:16+00:00", "hash": "319719952130e6fb", "title_fa": "انویدیا در یک تغییر تکان دهنده، جنسن هوانگ را به عنوان مدیرعامل بازگرداند", "summary_fa": "جنسن هوانگ بار دیگر مدیرعامل انویدیا شد. بلومبرگ/گتی ایماژ جنسن هوانگ به عنوان مدیرعامل و رئیس انویدیا بازگردانده شد. بنیانگذار انویدیا پس از اینکه هیئت مدیره به اتفاق آرا به بازگرداندن او رای داد، بازگردانده شد. این تغییر خیره کننده چند روز پس از آن صورت می گیرد که هیئت مدیره اعلام کرد قصد ندارد هوانگ را دوباره منصوب کند. جنسن هوانگ برگشت. هیئت مدیره انویدیا روز دوشنبه گفت که کمتر از دو هفته پس از استعفای چشمگیر او از شرکتی که ساخته بود، هوانگ را به عنوان مدیرعامل و رئیس بازگرداند. هیئت مدیره در بیانیه ای اعلام کرد که پس از یک سری جلسات با هوانگ به اتفاق آرا به این تصمیم رای داده است و پس از آن \"از صراحت آقای هوانگ و توانایی او برای رهبری انویدیا راضی است.\" هیئت مدیره گفت که در طول این فرآیند از سطوح ارشد دولت ایالات متحده نظرات دریافت کرده است و بر اساس آن نظرات اطمینان دارد که بازگرداندن هوانگ هیچ خطری برای امنیت ملی ایجاد نخواهد کرد. هاروی سی جونز، رئیس هیئت مدیره، در بیانیه ای گفت: «هیئت مدیره معتقد است که جنسن فرد مناسبی برای رهبری انویدیا است و بازگرداندن او به نفع سهامداران، کارمندان، شرکا و مشتریان ما است. سهام انویدیا با انتشار اخبار حدود 30 درصد افزایش یافت. این تصمیم تنها چند روز پس از آن اتخاذ شد که هیئت مدیره اعلام کرد که قصد ندارد هوانگ را که در اوایل ماه جاری به دنبال رسوایی روابط خارج از ازدواج و تحقیقات هیئت مدیره درباره نگرانی‌هایی که ممکن است موضوع تلاش‌های اطلاعاتی خارجی باشد، از سمت مدیرعامل انویدیا استعفا دهد، به سمت خود بازگرداند. هوانگ در بیانیه‌ای گفت: «من مفتخرم که به NVIDIA بازگردم و در آغاز یک انقلاب صنعتی جدید رهبری یکی از مهم‌ترین شرکت‌های فناوری در جهان را بر عهده بگیرم. \"من این مسئولیت", "image_url": "https://i.insider.com/6b0447f973f126f9eccb96d2?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "بورس و طلا"], "datetime_fa": "۲ آذر • ۱۷:۳۳"}, {"source": "Lifehacker", "title": "'Wifi Motion Sensing' Can Track Everything You Do Through Your Router", "link": "https://lifehacker.com/tech/wifi-motion-sensing-can-track-everything-you-do-through-your-router?utm_medium=RSS", "summary": "A simple wifi feature could let ISPs track your location and movement patterns within your home. \"Wifi motion sensing\" turns your ISP s router into a motion detector, letting providers know exactly how many people are in the house, where they are situated, individual movement patterns, and, in some cases, even body shapes that could approximate a person s identity. While the technology isn t universally implemented just yet and is typically opt-in only (smart home users might want the movement tracking feature for lights and heating), it presents quite a few privacy risks. So here s how wifi routers sense motion, what they can do with it, who has access to the data, and how you can disable it. What is wifi motion sensing? Wifi routers rely on radio signals to connect wirelessly to your devices and appliances. Those same radio signals are also absorbed and reflected by the human body as they travel in all directions from the router. With the right software, ISPs can track how those wifi signals travel around your room, which can be studied to detect presence and sense motion patterns. As long as your ISP s router model supports this feature natively, it doesn t require any additional hardware to be installed in your home. For example, Xfinity s version of the feature pairs your router with five other connected appliances in your room to create oval-shaped sensing zones that can track your presence and movement within those spaces. It isn t a new feature, either companies like Cognitive Systems and Origin Wireless that supply networking hardware to ISPs have been offering wifi motion sensing for years now, while early research prototypes from the MIT date back at least as far as 2015 . In 2025, IEEE updated its Wi-Fi 802.11 standard to include motion sensing and lay out the architectural guidelines for it, which makes it likely that even more routers will now ship with the feature. What can wifi motion sensing do? In its current consumer form, wifi motion sensing can help you control smart home apparatus like lights or thermostats, get pet safety notifications on your phone, set up a fall alert system for elderly users, and trigger appliances remotely based on human presence. But enabling it carries risks. Most providers, including Cognitive Systems , claim that the technology isn t sensitive to identity and can t be used to track specific individuals. But even if true, that s more likely to be a product decision rather than a 11", "summary": "Sarel Eldor, Amit Pilowsky, and Danny Akerman spent years as executives at Goldman Sachs before founding Key1 Capital. Key1 Capital Three former Goldman Sachs executives, including the CEO of its Israel office, left to found a VC firm. They raised $320 million for their second fund, focusing on late-growth Israeli tech companies. The founders drew on their experience at — and relationships at — the bank for the raise. Three former Goldman Sachs executives have secured $320 million for their VC firm's second fund — and they've been using their relationships at the bank to help raise the capital. Sarel Eldor, Amit Pilowsky, and Danny Akerman founded Key1 Capital, a late-growth venture capital firm, in 2022, after spending years at Goldman in Israel. Key1 said most of the capital for its second fund comes from institutional investors and family offices, along with nearly 10 limited partners who are current or former Goldman executives . Former clients are also involved in the fund — among the 25 LPs who are current or former founders, 20 of them worked with the Key1 team during their time at the bank. Some of their old clients are mentors to the founders Key1 is now backing. The Tel Aviv-based firm invests in Israeli and Israeli-related tech companies, focusing on late-stage companies. Two of Key1's biggest exits from its first $300 million fund include gaming company Superplay's sale to entertainment company Playtika in 2024, and Dustphonics' sale to Credo Tech in the semiconductor industry earlier this year. Investors see a growing opportunity in the country's startup ecosystem, which has a high concentration of AI companies. Israeli tech companies raised around $4.1 billion in the third quarter of this year compared to $2.4 billion in the third quarter of last year, according to a report from the IVC Research Center. The founders told Business Insider they're particularly excited about the opportunities in AI infrastructure and cyber in Israel . \"The opportunity is as good, and probably even better, than we had in fund one,\" Pilowsky said. \"One, more founders want to build bigger businesses, and two, AI is such a massive propeller for every good founder.\" At Goldman, Key1's cofounders generally worked with well-established companies considering an M A deal or going public, which they say has informed their strategy today. \"Through essentially a tremendous amount of repetition, you know how to actually select those that you feel comfortable taking public, s", "date_str": "2026-11-23T14:00:01+00:00", "hash": "dedafe6a804123cb", "title_fa": "آنها گلدمن را ترک کردند تا یک شرکت VC تأسیس کنند - و فقط 320 میلیون دلار برای صندوق دوم خود تضمین کردند", "summary_fa": "سارل الدور، آمیت پیلوفسکی و دنی آکرمن قبل از تاسیس Key1 Capital سال‌ها را به عنوان مدیران در گلدمن ساکس سپری کردند. Key1 Capital سه نفر از مدیران سابق گلدمن ساکس، از جمله مدیرعامل دفتر اسرائیلی آن، برای تأسیس یک شرکت VC ترک کردند. آنها 320 میلیون دلار برای صندوق دوم خود با تمرکز بر شرکت های فناوری اسرائیلی که در اواخر رشد بودند، جمع آوری کردند. بنیانگذاران از تجربه و روابط خود در بانک برای افزایش حقوق استفاده کردند. سه مدیر سابق گلدمن ساکس 320 میلیون دلار برای صندوق دوم شرکت VC خود تضمین کرده اند - و آنها از روابط خود در بانک برای کمک به افزایش سرمایه استفاده می کنند. سارل الدور، آمیت پیلووسکی و دنی آکرمن پس از گذراندن سال‌ها در گلدمن در اسرائیل، Key1 Capital، یک شرکت سرمایه‌گذاری خطرپذیر با رشد دیرینه را در سال 2022 تأسیس کردند. Key1 گفت که بیشتر سرمایه برای صندوق دوم آن از سوی سرمایه گذاران نهادی و دفاتر خانوادگی، همراه با نزدیک به 10 شریک محدود که مدیران فعلی یا سابق گلدمن هستند، تامین می شود. مشتریان سابق نیز در این صندوق مشارکت دارند - در میان 25 LP که بنیانگذار فعلی یا سابق هستند، 20 نفر از آنها در طول مدتی که در بانک بودند با تیم Key1 کار می کردند. برخی از مشتریان قدیمی آنها مربیان بنیانگذارانی هستند که Key1 اکنون از آنها حمایت می کند. این شرکت مستقر در تل آویو در شرکت‌های فناوری اسرائیل و مرتبط با اسرائیل سرمایه‌گذاری می‌کند و بر شرکت‌های آخرین ish Army's officer training course there in 2022, before returning to the front . Now he's back helping instructors and cadets rethink how they ready officers for combat. \"It's just really useful having an individual who's been through Sandhurst, who's spent four years on the front line in Ukraine,\" Brigadier Nick Wight-Boycott, the commander of the Royal Military Academy Sandhurst, said, explaining that it's valuable to be able to ask, \"What from Sandhurst worked for you?\" The 44-week commissioning course at the Royal Military Academy Sandhurst, the home of British Army officer training, is making changes in response to the war in Ukraine . Cadets are learning to dig different trenches , move faster, and operate under the constant threat of enemy drones. Zero is spending several months advising instructors and cadets on what modern combat looks like and helping shape the training environment. Brigadier Nick Wight-Boycott, the commander of the Royal Military Academy Sandhurst, told Business Insider that \"the new scenario, I think, is more realistic than the one to which we've used in the past.\" Learning from a Ukrainian combat veteran Zero, who served as a platoon commander on Ukraine's front lines, is at Sandhurst as an advisor rather than a formal instructor. H", "date_str": "2026-11-23T13:53:33+00:00", "hash": "024ad14246c4e2fe", "title_fa": "ارتش بریتانیا یک افسر اوکراینی را که در نبرد آزمایش شده بود وارد کرد تا افسران آینده را برای واقعیت های وحشیانه جنگ مدرن آماده کند.", "summary_fa": "یک افسر اوکراینی به رهبران آینده ارتش بریتانیا کمک می کند تا برای جنگ آینده آماده شوند، آموزش آنها را راهنمایی می کند و به سوالات دانشجویان و رهبران پاسخ می دهد. Sinéad Baker افسران ارتش آینده بریتانیا به شیوه ای متفاوت آموزش می بینند و از درس هایی از جنگ اوکراین استفاده می کنند. کادت ها سنگرهای مختلف حفر می کنند، سریع تر حرکت می کنند و تحت تهدید پهپادها آموزش می بینند. یک افسر اوکراینی با تجربه خط مقدم به مربیان کمک می کند تا آموزش را واقعی تر کنند. در دشت سالزبری انگلستا . دیگری اثر ماریا کری «همه چیزی که برای کریسمس می خواهم تو هستی. لی، به نوبه خود، در این ویدیو احساساتی می شود و از ترانه سرا، جانی مارکس، تهیه کننده اوون بردلی و نوازندگان استودیویی که در ضبط بازی می کردند نام می", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/Brenda-Lee-Taylor-Swift-Diamond-Photo-Credit-TAS-Rights-Management-2.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۹:۴۰"}, {"source": "Variety", "title": "Byron Allen’s BuzzFeed Hires Chris Poydenis, Co-Founder of Creator Marketing Agency Influential, as Chief Revenue Officer", "link": "https://variety.com/2026/digital/news/buzzfeed-chris-poydenis-chief-revenue-officer-cofounder-influential-1236955952/", "summary": "Byron Allen is hoping to turn things around at BuzzFeed, the money-losing digital publisher he envisions becoming a major free, ad-supported streaming property, with the hiring of Chris Poydenis as chief revenue officer. Poydenis previously was chief revenue officer and co-founder of Influential, a leading creator-marketing company. In joining BuzzFeed, Poydenis is bringing over Jesse [ ]", "date_str": "2026-11-23T16:14:26+00:00", "hash": "69c4094672c0afac", "title_fa": "BuzzFeed بایرون آلن، کریس پویدنیس، یکی از بنیانگذاران آژانس بازاریابی خلاق، را به عنوان مدیر ارشد درآمد استخدام می کند.", "summary_fa": "بایرون آلن امیدوار است با استخدام کریس پویدنیس به عنوان مدیر ارشد درآمد، اوضاع را در BuzzFeed تغییر دهد، ناشر دیجیتالی که او در نظر دارد با استخدام کریس پویدنیس به عنوان مدیر ارشد درآمد، به یک ملک اصلی پخش رایگان و با پشتیبانی تبلیغات تبدیل شود. پویدنیس قبلاً مدیر ارشد درآمد و یکی از بنیانگذاران اینفلوئنال بود، یک شرکت بازاریابی خلاق. پویدنیس با پیوستن به BuzzFeed، جسی [] بایرون آلن، رئیس و مدیر عامل BuzzFeed را به خدمت گرفت که در اوایل سال جاری 51 درصد از سهام این شرکت را به دست آورد. بر اساس این قرارداد، او 20 میلیون دلار به صورت نقدی در زمان بسته شدن پرداخت کرد و یک سفته 100 میلیون دلاری را که سر " را برای کنسرت جمع آوری کمک های مالی با هم برای فلسطین در لندن از قبل ضبط کنند. در آن ماه، جف بارو در اینستاگرام نوشت که گروه «به شدت می‌خواستند برای کمک به پایان دادن به نسل‌کشی در حال وقوع که هم‌اکنون در حال وقوع است، مشارکت داشته باشند.» (پیش از آن، آخرین اجرای آنها برای یک کنسرت خیریه War Child در سال 2022 بود که از تلاش های امدادی در اوکراین حمایت می کرد.) در سال 2018، گروه در فیس بوک پستی برای حمایت از تحریم اسرائیل به دلیل اشغال فلسطین منتشر کرد. No Music for Genocide در یک استوری اینستاگرام نوشت که پورتی هد به کمپین آن پیوسته است و به زودی اخبار بسیار بیشتری منتشر خواهد شد. به گزارش هاآرتص، آهنگ‌های گروه از مجموعه‌ها و سایر نسخه‌های منتشر شده، همراه با آلبوم‌های انفرادی بث گیبونز و موسیقی جف بارو با Beak، زنده باقی می‌مانند. (Pitchfork نتوانسته است از در دسترس بودن موسیقی Portishead در سایر سرویس‌های استریم در اسرائیل اطمینان حاصل کند.) Pitchfork به نمایندگان گروه، Gibbons و برچسب Barrow's Invada ایمیل ارسال کرده است. کمپین No Music for Genocide طیف وسیعی از هنرمندان - از جمله Massive Attack، Björk و MJ Lenderman - را در تلاش خود برای بلوک جغرافیایی موسیقی در اسرائیل از سال گذشته گرد هم آورده است.", "image_url": "https://media.pitchfork.com/photos/6b0460843cdd8f70b4c87c01/16:9/w_1280,c_limit/portishead-israel.jpg", "category": "هوش مصنوعی مولد", "tags": ["Apple", "عامل‌های هوشمند", "موسیقی", "روابط بین‌الملل"], "datetime_fa": "۲ آذر • ۱۹:۳۰"}, {"source": "Variety", "title": "Justin Timberlake Documentary Trailer: Apple TV Series to Unpack Britney Spears, Janet Jackson Controversies", "link": "https://variety.com/2026/music/news/justin-timberlake-documentary-trailer-britney-spears-janet-jackson-1236955955/", "summary": "Apple TV has confirmed that it will launch “Timberlake,” a new four-part documentary on Justin Timberlake’s life and career helmed by Academy Award winner Fisher Stevens; Variety first reported the news earlier this month. The series premieres globally on Apple TV on Friday, December 11 with the first two episodes, followed by the third episode [ ]", "date_str": "2026-11-23T16:03:04+00:00", "hash": "3a6d792b804e056b", "title_fa": "تریلر مستند جاستین تیمبرلیک: مجموعه تلویزیونی اپل برای بازگشایی جنجال های بریتنی اسپیرز و جنت جکسون", "summary_fa": "اپل تی‌وی تأیید کرده است که «تیمبرلیک»، یک مستند چهار قسمتی جدید درباره زندگی و حرفه‌ی جاستین تیمبرلیک که توسط فیشر استیونز، برنده جایزه اسکار ساخته می‌شود، عرضه خواهد کرد. ورایتی برای اولین بار این خبر را در اوایل ماه جاری منتشر کرد. این سریال در روز جمعه، 11 دسامبر با دو قسمت اول و به دنبال آن اپیزود سوم در سطح جهانی در اپل تی‌وی در روز جمعه، 11 دسامبر پخش می‌شود. نمایش نیمه وقت سوپر بول در سال 2004. داستان‌های مرتبط کمدین فقید سام کینیسون - با آواتار هوش مصنوعی خود - برای دومین بار با بوچوالد آماده می‌شود (اختصاصی) تیمبرلیک در صداپیشگی می‌گوید: «مطمئنم که به عقب برمی‌گردی و این چیزهای شیرین و مسخره باورنکردنی دوران کودکی‌ام را می‌بینی. چیزهایی که صحبت کردن در مورد آنها واقعاً سخت است، که سپس به فیلم او و اسپیرز تبدیل می شود. تریلر چندین شات از اسپیرز و جکسون و همچنین تیمبرلیک به همراه همسرش جسیکا بیل و دیگران را نشان می دهد. در این اطلاعیه آمده است: «تیمبرلیک خام، بازتاب‌دهنده و آشکار می‌نشیند تا درباره پیروزی‌هایی که او را به موفقیت جهانی رساند، دیدگاه شخصی‌اش فراتر از سرفصل‌ها و چالش‌هایی که در پشت پرده با آن روبرو شده است، صحبت کند. این سریال به کارگردانی برنده جایزه اسکار فیشر استیونز (The Cove, Beckham)، سه دهه از موسیقی و فرهنگ عامه را در بر می گیرد و شامل فیلم های آرشیوی و مصاحبه های انحصاری با خانواده، دوستان و همکاران است که قبلاً دیده نشده است.", "image_url": "https://variety.com/wp-content/uploads/2026/11/Screenshot-2026-11-23-at-10.49.21-AM-e1795449557290.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Apple", "سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۹:۳۳"}, {"source": "Billboard", "title": "‘Everyone Comes Here to Be Wowed’: Las Vegas Grand Prix Hits Live Music Jackpot With Backstreet Boys, Kacey Musgraves & More", "link": "https://www.billboard.com/music/music-news/las-vegas-grand-prix-2026-backstreet-boys-kacey-musgraves-1236387637/", "summary": "The Las Vegas Grand Prix might be the only Formula 1 race where the intensity of the sound of cars thundering down the track is rivaled by the city s lights and that s saying something. Related The Whole Thing Is A Show : Why the Love Affair Between F1 Racing and Music Just ‘Makes Sense’ Red Bull Racing — And Music Fans — Win Big at the Formula 1 U.S. Grand Prix, Featuring Garth Brooks, Kygo More Ring in 2027 With the Backstreet Boys: Band Adds 3 New Year s Shows to Las Vegas Sphere Residency But this weekend s LVGP was easily as bright as it was loud, from the 1.2 million LEDs shooting out of the ginormous Sphere looming over the circuit to the flashing casino signs that dotted the horizon as 22 drivers sped past Sin City landmarks and thousands of fans for 50 laps on Saturday (Nov. 21). Max Verstappen secured a first-place finish for Red Bull Racing after spending much of the drive fighting off 2026 World Champion Kimi Antonelli and George Russell of Mercedes, who dropped down to Nos. 4 and 9, respectively, in the final few laps. In the end, Verstappen was joined instead by 2025 champion Lando Norris and Oscar Piastri, both from McLaren, on the podium Saturday but the night was far from over as the trio sprayed each other down with the ceremonial champagne. Revved up by the excitement on the track, the thousands of attendees who left the grandstands and flooded into the Sphere for the official T-Mobile F1 Afterparty were already ready to party when the Backstreet Boys took the stage for a special one-off show between blocks of the group s Into the Millennium residency in Vegas. The jaw-dropping light displays and innovative, immersive special effects which at times made fans feel as though they were hurtling through space in an enormous rocket ship or traversing snowy mountain ranges with rock formations shaped like Nick Carter, Howie Dorough, AJ McLean, Brian Littrell and Kevin Richardson s faces proved that the S  را در کانال یوتیوب خود به‌طور رایگان در کانال یوتیوب خود عرضه خواهد کرد. این فیلم برنده جایزه به کارگردانی ایتاب عزام و جک مک اینس سه شنبه، اول دسامبر در یوتیوب، اپلیکیشن PBS و PBS.org/frontline نمایش داده می شود، بیش از یک ماه قبل از اینکه [ ] Raney Aronson-Rath، سردبیر و تهیه کننده اجرایی Frontline، اظهار داشت: «ما تمام مستندهای خود را با یک دهه رشد و نزدیک به یک دهه در یوتیوب منتشر کرده‌ایم. تشنه داستان هایی که می گوییم یک در میلیون اولین بار هیجان انگیز برای FRONTLINE است: انتشار یک مستند بلند در YouTube قبل از پخش اولیه آن. این دقیقاً فیلم مناسبی برای ایجاد زمینه جدید است و مستند فوق‌العاده ایتاب و جک را پس از استقبال باورنکردنی تماشاگران جشنواره و تئاتر، مستقیماً به مخاطب دیجیتال ما می‌آورد.» تماشا در Deadline One in a Million برای اولین بار در ساندنس نمایش داده شد، جایی که جایزه تماشاگران را برای مستند سینمای جهان و جایزه کارگردانی در آن بخش را به دست آورد، با تقدیر از Azzam و MacInnes. این فیلم در شفیلد داک فست در بریتانیا، جشنواره فیلم مونتکلر در نیوجرسی و جشنواره بین المللی فیلم دالاس مورد تقدیر قرار گرفته است. هر دو DOC NYC و IDA Documentary Awards یک در میلیون را در فهرست کوتاه بهترین مستندهای سال خود قرار داده اند. این فیلم که طی یک دوره 10 ساله فیلمبرداری شده است، اسرای قهرمان داستان را از کودکی تا بزرگسالی «در سفری خارق‌العاده از سوریه به آلمان - و دوباره بازگشت» دنبال می‌کند.", "image_url": "https://deadline.com/wp-content/uploads/2026/03/One-in-a-Million.png?w=968", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۱۹:۳۰"}, {"source": "Variety", "title": "Colin Farrell: For Emma Fogarty, Who Means the World to Me", "link": "https://variety.com/2026/tv/columns/colin-farrell-emma-fogarty-the-slightest-touch-hbo-epidermolysis-bullosa-1236955666/", "summary": "I met my friend Emma Fogarty nearly 16 years ago. I was sat beside her at a dinner table on an evening purposed to raise awareness for those who have the same punishing condition Emma was born with: epidermolysis bullosa (EB), a rare genetic disorder where the slightest touch or even friction of material rubbing [ ]", "date_str": "2026-11-23T16:00:00+00:00", "hash": "a698fa83f0b61acc", "title_fa": "کالین فارل: برای اما فوگارتی، چه کسی برای من دنیا معنا دارد", "summary_fa": "من نزدیک به 16 سال پیش با دوستم اما فوگارتی آشنا شدم. من در یک شب روی میز شام کنار او نشسته بودم و هدف آن افزایش آگاهی برای کسانی بود که همان شرایط تنبیهی را دارند اما متولد شد: اپیدرمولیز بولوزا (EB)، یک اختلال ژنتیکی نادر که در آن کوچکترین تماس یا حتی اصطکاک مالش مواد [ ] این بازیگر ایرلندی در مورد رفیق خود می نویسد \"Em,\" یک زن ژانرگرایانه که با این وضعیت زندگی می کند. پیوند ویژه آنها در \"کوچکترین لمس\"، مستند جدیدی که در 25 نوامبر در HBO Max نمایش داده می شود، ثبت شده است. وقتی او به دنیا آمد، پزشکان به مادر و پدرش - پت و مالاچی - گفتند که بهتر است او را در بیمارستان رها کنند زیرا او یک هفته دوام نخواهد آورد. چیزی که پزشکان نتوانستند تشخیص دهند روحیه اما، زیبایی، صلابت کامل آن - و همچنین روحیه والدینش بود. اما امروز اما 42 ساله است، که او را طولانی‌ترین فرد مبتلا به اپیدرمولیز بولوزا در ایرلند می‌کند و با درد مداوم همراه است. او در ترس از سرطان ها زندگی می کند، سرطان هایی که مبتلایان به EB را به تعداد سرسام آوری مبتلا می کند (او دو بار از سرطان نجات یافته است). اما او همچنین زندگی پر از شادی، عشق، معنا و دوستی دارد. او در این سال‌ها برای من دوست فوق‌العاده‌ای بوده است، خنده و حمایت، ماجراجویی و حکمت خودش را که به سختی به دست آورده است. چند سال پیش، گذراً به اِما گفته بودم که باید روزی با هم ماراتن انجام دهیم. اگر دوست داشت او را هل می دادم. یک سال بعد از پیشنهاد نیمه دل من، او به من پیام داد و گفت: \"یادت هست به ماراتن اشاره کردی؟\" اما آرزو داشت که آخرین 4K ماراتن شهر دوبلین را به مناسبت", "image_url": "https://variety.com/wp-content/uploads/2026/11/emma-fogarty-colin-farrell_1.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲ آذر • ۱۹:۳۰"}, {"source": "Billboard", "title": "All CMA Awards New Artist of the Year Winners Over 30: Stephen Wilson Jr., Jelly Roll & More", "link": "https://www.billboard.com/lists/cma-awards-new-artist-of-the-year-winners-over-age-30/", "summary": "Country/rock musician Stephen Wilson Jr. set a new record at the Country Music Association Awards on Wednesday (Nov. 18). At 47, he became the oldest winner for new artist of the year to date. The CMA has presented new artist of the year (formerly known as the Horizon Award) 46 times. As the years have gone by, the winners have gotten appreciably older. Of the first 10 winners (1981-1990), just two were 30 or older (or had a lead singer over 30). Of the last 10 winners (2017-2026), six were 30 or older. Related Ella Langley More Record-Setters at the 2026 CMA Awards It used to be, if an artist was 30, certainly 35, and hadn’t made it yet in country music, their prospects were not looking good. Now, an artist in that age range, or even a bit older, might still break through. Jelly Roll was 38 when he won two years ago. Ashley McBryde and Jimmie Allen were both 36 when they won in 2019 and 2021, respectively. All but seven of the 46 winners to date are solo artists. One duo, The Judds , has won the award, as have six groups – Sawyer Brown , The Chicks , Rascal Flatts , Lady A , Zac Brown Band and The Band Perry . Of these seven acts, just two – Rascal Flatts and Zac Brown Band – had a lead singer who had reached 30 by the time they won. Here, we look back at every solo artist, or lead vocalist for a duo or group, who had reached 30 by the time they won the CMA Award for new artist of the year (or the predecessor Horizon Award). We show their age when they won (rounded off to the nearest month). They are listed in ascending order.", "date_str": "2026-11-23T15:35:00+00:00", "hash": "204d3ef6464f4494", "title_fa": "همه جوایز CMA برندگان جدید هنرمند سال بیش از 30 سال: استیون ویلسون جونیور، جلی رول و بیشتر", "summary_fa": "استفان ویلسون جونیور، نوازنده کانتری/راک، رکورد جدیدی را در مراسم جوایز انجمن موسیقی کشور در روز چهارشنبه (18 نوامبر) به ثبت رساند. او در 47 سالگی مسن ترین برنده هنرمند جدید سال تا به امروز شد. CMA هنرمند جدید سال (که قبلاً به عنوان جایزه Horizon شناخته می شد) 46 بار معرفی شده است. با گذشت سالها، برندگان به طرز چشمگیری پیرتر شده اند. از 10 برنده اول (1981-1990)، فقط دو نفر 30 سال یا بیشتر بودند (یا خواننده اصلی بالای 30 سال داشتند). از 10 برنده آخر (2017-2026)، شش برنده 30 سال یا بیشتر بودند. مرتبط با الا لنگلی، ضبط‌کننده‌های بیشتر در جوایز CMA 2026، اگر هنرمندی 30 ساله بود، مطمئناً 35 ساله بود، و هنوز در موسیقی کانتری موفق نشده بود، چشم‌اندازشان خوب به نظر نمی‌رسید. اکنون، هنرمندی در آن محدوده سنی، یا حتی کمی مسن‌تر، ممکن است هنوز به موفقیت برسد. جلی رول 38 ساله بود که دو سال پیش برنده شد. اشلی مک براید و جیمی آلن هر دو در سال های 2019 و 2021 به ترتیب 36 ساله بودند. همه به جز هفت نفر از 46 برنده تا به امروز هنرمندان انفرادی هستند. یک دوتایی، The Judds، و شش گروه - Sawyer Brown، The Chicks، Rascal Flatts، Lady A، Zac Brown Band و The Band Perry برنده این جایزه شده اند. از این هفت آهنگ، فقط دو آهنگ - Rascal Flatts و Zac Brown Band - خواننده اصلی داشتند که تا زمان برنده شدن به 30 آهنگ رسیده بود. در اینجا، ما به هر هنرمند انفرادی، یا خواننده اصلی یک دو یا گروه نگاه می‌کنیم که تا زمانی که جایزه CMA را برای هنرمند جدید سال (یا جایزه Horizon قبلی) به دست آوردند، به 30 رسیده بودند. ما سن آنها را نشان می دهیم که آنها برنده شدند (به نزدیکترین ماه گرد). آنها به ترتیب", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2305797596-e1795385574396.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۱۹:۰۵"}, {"source": "Deadline", "title": "Sixty Years In The Making, Queer Thriller ‘The Wrong People’ Is Now In Post With ‘The Affair’ & ‘Emily In Paris’ DoP Directing", "link": "https://deadline.com/2026/11/queer-film-movie-wrong-people-emily-in-paris-dop-cast-1237231529/", "summary": "EXCLUSIVE: Sixty-years in the making, post-production is nearing completion on feature thriller The Wrong People, an adaptation of the 1967 novel of the same name by Robin Maugham, a dark thriller exposing trafficking i ": "۲ آذر • ۱۹:۱۹"}, {"source": "Rolling Stone", "title": "See Cheap Trick Play Last Concert Before Indefinite Hiatus: ‘Thanks for Everything You’ve Given Us’", "link": "https://www.rollingstone.com/music/music-news/cheap-trick-last-concert-hiatus-1235662620/", "summary": "After 50 years of relentless touring, Cheap Trick now have a blank calendar for the first time in their history", "date_str": "2026-11-23T15:47:04+00:00", "hash": "f294d6a7c6dbd83b", "title_fa": "آخرین کنسرت قبل از وقفه نامحدود را با ترفند ارزان ببینید: \"بابت همه چیزهایی که به ما دادید متشکرم\"", "summary_fa": "پس از 50 سال تور بی امان، Cheap Trick اکنون برای اولین بار در تاریخ خود یک تقویم خالی دارد. فصل مهمی در تاریخ Cheap Trick عصر یکشنبه در تئاتر Sound Board در دیترویت آشکار شد، زمانی که گروه آخرین کنسرت خود را قبل از شروع یک استراحت نامعلوم از جاده اجرا کرد. هیچ سخنرانی طولانی یا خداحافظی با چشمانی اشک آلود با طرفداران آنها وجود نداشت، بلکه یک کنسرت استاندارد Cheap Trick بود که بر روی علاقه مندی های دهه 1970 سنگین بود و تغییرات زیادی در گیتار داشت. Cheap Trick ماه گذشته طرفداران را نگران کرد، زمانی که آنها تمام قرارهای خود در سال 2027 را لغو کردند و اعلام کردند که پس از انجام تمام تعهدات خود در سال جاری، یک استراحت طولانی خواهند داشت. چند روز بعد بیانیه ای برای رفع نگرانی ها صادر شد. با تشکر فراوان از همه کسانی که نسبت به ما ابراز نگرانی کردند.» آنها نوشتند: «برای روشن شدن همه چیز، تصمیم گرفتیم پس از دهه ها تور کمی مرخصی بگیریم زیرا به استراحت نیاز داریم. نه به دلایل سلامتی ما برنامه های نوامبر خود را اجرا خواهیم کرد و سپس اولین استراحت خود را در 50 سال گذشته خواهیم داشت. از همه حمایت های شما متشکرم!» اغراق نیست که ترفند ارزان 50 سال است که در راه است. در طول فراز و نشیب‌های فراوان آنها از زمان انتشار اولین LP خود در سال 1977، از جمله سال‌های بسیار ضعیف در دهه 1980 قبل از بازگشت آنها به The Flame در سال 1988، جدایی آشفته با درامر Bun E. کارلوس در سال 2010 که اختلافات زیادی را در پی داشت و مشکلات سلامتی مختلف در سال های اخیر که گیتاریست ریک نیلسن و نوازنده باس تام پترسون را به طور موقت کنار گ tus in mid-2021. ENHYPEN has six members. TOMORROW X TOGETHER and NewJeans each have five members. BLACKPINK has four members. To date, no K-pop solo artists, duos or trios have topped the Billboard 200. There have been multiple No. 1 albums on the Billboard 200 by K-pop acts in every year since 2018 except for 2021, when there were none. Here’s a list of all K-pop albums to top the Billboard 200. They are listed in chronological order.", "date_str": "2026-11-23T15:35:00+00:00", "hash": "79247b896019962d", "title_fa": "در اینجا همه آلبوم های کی پاپ که در صدر بیلبورد 200 قرار گرفته اند آورده شده است: لیست کامل", "summary_fa": "ساعت طلایی ATEEZ: قسمت 6، کی پاپ را به جایگاهی آشنا بازمی گرداند — شماره 1 در جدول همه ژانر بیلبورد 200. این بیست و هفتمین آلبوم یا EP یک بازیگر کی‌پاپ است که در کمتر از هشت سال گذشته به رتبه اول جدول آلبوم‌های شاخص بیلبورد رسیده است. اولین آلبوم BTS' Love Yourself: Tear در ژوئن 2018 بود. این پنجمین آلبوم کی پاپ یا EP است که در سال 2026 در بیلبورد 200 رتبه اول را کسب می کند، که سال 2023 را به عنوان سالی با بیشترین رهبران کی پاپ مرتبط می کند. در اینجا یک واقعیت جالب دیگر وجود دارد: EP ATEEZ با 195000 واحد آلبوم معادل در ایالات متحده افتتاح شد. این بالاترین مجموع یک هفته‌ای برای هر نسخه (از هر ژانری) پس از یک بازی دیگر کی‌پاپ، Stray Kids است که با 369000 واحد آلبوم معادل This That در نمودار مورخ 22 آگوست افتتاح شد. 1 عنوان در بیلبورد 200، که گروه را در میان کنش های کی پاپ قرار می دهد. BTS با هفت عنوان شماره 1 دوم است. ATEEZ در ردیف بعدی با چهار شماره 1 قرار دارد. SuperM، BLACKPINK، TOMORROW X TOGETHER، NewJeans، TWICE و ENHYPEN همگی تا به امروز رتبه اول را کسب کرده اند. علاوه بر این، یک موسیقی متن کی پاپ با چند هنرمند، KPop Demon Hunters، به رتبه 1 رسیده است. BLACKPINK اولین آلبوم کی پاپ زن بود که در بیلبورد 200 آلبوم شماره 1 را به دست آورد. آنها با Born Pink در سال 2022 گلزنی کردند. NewJeans و TWICE پس از آنها. گروه های کی پاپ معمولا گروه های بزرگی هستند. TWICE نه عضو دارد، یکی بیشتر از Stray Kids و ATEEZ. BTS هفت عضو دارد، مانند SuperM که در او د در قسمت بعدی ۲۶ فرانچایز، که توسط دنیس ویلنوو کارگردانی می‌شود و در استودیو ام‌جی‌ام آمازون تولید می‌شود، از او سوال کنند. متأسفانه، بازخوردی که کاکس دریافت کرد این بود که [ ] آیا می توانم چیزی بگویم؟ کاکس در مورد باند فاش کرد، من خواستم برای آن تست بزنم. می دانی به من چه گفتند؟ خیلی پیره اما راب هم سن من است! او برای آن خوب به نظر می رسد، من باید منصف باشم. [ماه] آینده من قرار است 44 ساله شوم، چگونه 44 ساله هستم؟ داستان های مرتبط کمدین فقید سام کینیسون - با آواتار هوش مصنوعی اش - برای دومین بار با بوچوالد آماده می شود (اختصاصی) رابرت پتینسون در 40 سالگی نقش جیمز باند را دریافت کرد. گزارش‌هایی در طول مراحل انتخاب بازیگران منتشر شد مبنی بر اینکه تهیه‌کنندگان به دنبال بازیگری در سی و چند سالگی بودند تا نقش 007 را از دنیل کریگ که در پنج فیلم و 15 سال نقش باند را بازی می‌کرد، بر عهده بگیرد. آخرین فیلم 007 کریگ، زمان مرگ نیست محصول 2021 بود. کاکس در مورد بازیگر جدید باند با اشاره به لیست رقبای نهایی که ظاهراً شامل افرادی مانند نیکلاس هولت و جاش او کانر نیز می‌شد، گفت: فکر می‌کردم قرار است جک لودن یا شاید کالوم تیونر باشد. چه حرفه شگفت انگیزی [پتینسون] ایجاد کرده است. برخی از کارهایی که آن مرد انجام داده با کارگردانانی کار می کند که نویسندگان بزرگ و بزرگی بوده اند، اما زمانی که او با آنها کار می کرد، اولین فیلم یا چیزهای آنها بود. پتینسون پس از معرفی به عنوان بازیگر جدید جیمز باند بیانیه‌ای صادر کرد که در آن آمده بود: \"جیمز باند", "image_url": "https://variety.com/wp-content/uploads/2026/11/New-York-Comic-Con-2026-October-9-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند", "سینما"], "datetime_fa": "۲ آذر • ۱۹:۰۷"}, {"source": "Deadline", "title": "Sixty Years In The Making, Queer Thriller ‘The Wrong People’ Is Now In Post With ‘The Affair’ & ‘Emily In Paris’ DoP Directing", "link": "https://deadline.com/2026/11/queer-thriller-wrong-people-emily-in-paris-dop-cast-1237231529/", "summary": "EXCLUSIVE: Sixty-years in the making, post-production is nearing completion on feature thriller The Wrong People, an adaptation of the 1967 novel of the same name by Robin Maugham, a dark thriller exposing trafficking in North Africa in the sixties. First announced as a feature film in 1972, the project was shot in-and-around London and Essaouira, [ ]", "date_str": "2026-11-23T15:27:55+00:00", "hash": "398bd3db41ad519e", "title_fa": "شصت سال در ساخت، تریلر عجیب و غریب «مردم اشتباه» اکنون با کارگردانی فیلم The Affair و «امیلی در پاریس» ساخته شده است.", "summary_fa": "انحصاری: شصت سال در حال ساخت، پس‌تولید فیلم هیجان‌انگیز The Wrong People، اقتباسی از رمانی به همین نام در سال 1967 توسط رابین موام، یک تریلر تاریک که قاچاق در شمال آفریقا در دهه شصت را افشا می‌کند، به پایان می‌رسد. این پروژه اولین بار در سال 1972 به عنوان یک فیلم بلند معرفی شد، این پروژه در داخل و اطراف لندن و اساویرا فیلمبرداری شد. استیون فیربرگ، فیلمبردار باسابقه فیلم‌هایی از جمله وزیر و مواد مخدر دیگر و سریال‌های موفقی از جمله The Affair و Emily In Paris، این فیلم را بر اساس فیلمنامه‌ای توسط دیوید گریفین کارگردانی کرده است. Pic توسط استفان اسرائیل (شنا با کوسه ها) از طریق شرکت تولید کننده او School Pictures، در کنار Ioanna Karavela (روز بد در دفتر) تهیه می شود. تهیه کنندگان اجرایی برت شوهر و تام آبل از متخصص LGBTQ Peccadillo هستند که حقوق توزیع ایرلندی بریتانیا را بر عهده دارد. Watch on Deadline The Wrong People به دنبال آرنولد ترنر (نیوبری)، معلم مدرسه شبانه روزی همجنسگرا در انگلستان است که در جستجوی مهلت از سرکوب در بریتانیا، جایی که همجنسگرایی غیرقانونی است، به طنجه سفر می کند. او در آنجا با لاوینیا موریس (گودال) تبعیدی دوست می شود و با کلارنس برد (نیومن) ثروتمند درگیر می شود، اما در گوشه های تاریک شهر باج گیری می شود تا یکی از شاگردانش به نام دان (راس) را به مراکش قاچاق کند، نقشه ای که پیامدهای ویرانگری دارد.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/Luke-Newberry-Caroline-Goodall-Alec-Neuman-Calum-Ross.jpg?w=1000", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۲ آذر • ۱۸:۵۷"}, {"source": "Pitchfork", "title": "Listen to D’Angelo’s Posthumous Song “Kamikazi”", "link": "https://pitchfork.com/story/listen-to-dangelos-posthumous-song-kamikazi/", "summary": "The previously unreleased track surfaced in Grand Theft Auto VI’s Worldwide FM radio station", "date_str": "2026-11-23T15:02:19+00:00", "hash": "fbc864ba751306bb", "title_fa": "آهنگ کامیکازی پس از مرگ D’Angelo را بشنوید", "summary_fa": "آهنگی که قبلاً منتشر نشده بود در ایستگاه رادیویی FM جهانی Grand Theft Auto VI ظاهر شد Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان نه، شما صدای منحصر به فرد D'Angelo فقید را در Grand Theft Auto VI تصور نمی کردید. همانطور که قبلاً گزارش شده بود، گنجینه‌ای از آهنگ‌های جدید و فیلم‌های بعید در بلاک باستر مورد انتظار Rockstar Games که هفته گذشته منتشر شد، وجود دارد. در Worldwide FM، یکی از ایستگاه‌های رادیویی درون‌بازی آن، آهنگ منتشرنشده D’Angelo «Kamikazi» قرار دارد. اکنون آن تک آهنگ بالاخره در سرویس های پخش در دسترس است. آن را در زیر گوش کنید. D’Angelo با پیوندهای بازی های ویدیویی غریبه نبود. در سال 2019، او آهنگ Unshaken را برای Red Dead Redemption 2 نوشت. او در ادامه توضیح داد که او یکی از طرفداران پرشور، انبوه و گسترده این فرنچایز است، با خود Rockstar Games تماس گرفت و از دفاتر این شرکت در نیویورک بازدید کرد تا ساعت ها آن را بازی کند. D'Angelo در اکتبر 2025 بر اثر سرطان درگذشت. پس از یک دوره تحسین برانگیز بین اولین آلبوم او، شکر قهوه ای سال 1995، و ادامه آن، وودو در سال 2000، D'Angelo تبدیل به یک چهره منزوی شد که به ندرت در انظار عمومی ظاهر می شد. در سال 2014 زمانی که او با Black Messiah، آلبوم تحسین‌شده‌اش با Vanguard، و تعداد انگشت شماری از حضورهای تلویزیونی خاطره‌انگیز بازگشت، تغییر کرد. او در سال‌های بعد روی چند آهنگ دیگر از جمله «IBTIHAJ» با GZA و Rapsody در سال 2019، «Behove» از Slingbaum با Erykah Badu در اوایل سال 2020 و «I Want You Forever» از Jeymes Samuel با Jay-Z برای موسیقی متن The Book of Clarence.", "image_url": "https://media.pitchfork.com/photos/67b34a61b0f42d44492ac0c0/16:9/w_1280,c_limit/d&#x27;angelo%20roots%20picnic%202025%20headlienrs.jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"] tps://www.rollingstone.com/wp-content/uploads/2026/11/GettyImages-2294225435.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۲ آذر • ۱۸:۵۷"}, {"source": "Netflix NL", "title": "Waargebeurde misdaadserie op Netflix is ‘bruut en hartverscheurend’", "link": "https://www.netflix-nederland.nl/waargebeurde-misdaadserie-op-netflix-is-bruut-en-hartverscheurend/", "summary": "Misschien heb jij Gordon al voorbij zien komen op Netflix. Het betreft hier een waargebeurde misdaadserie uit Argentinië die behoorlijk goed ontvangen worden. Kijkers noemen de show bruut en hartverscheurend . Netflix-kijkers noemen Gordon bruut en hartverscheurend Deze zevendelige misdaadserie is gebaseerd op waargebeurde gebeurtenissen (en op de boeken Gordon en Gordon, el aniquilador van journalist Marcelo Larraquy) en speelt zich af in het Argentinië van de jaren zeventig, een periode waarin politieke spanningen en geweld het land verscheuren. Het verhaal draait om Aníbal Gordon (Rodrigo de la Serna), een man die aanvankelijk zijn geld verdient met bankovervallen en autodiefstallen. Hij leidt een dubbelleven als ogenschijnlijk keurige zakenman en familieman, maar achter de schermen bouwt hij een steeds groter crimineel netwerk op. Wanneer de politieke situatie in Argentinië verslechtert, ontdekt Gordon dat hij zijn gewelddadige vaardigheden ook kan inzetten voor invloedrijke personen binnen de overheid. Gordon raakt betrokken bij extreemrechtse groeperingen en wordt uiteindelijk gerekruteerd voor clandestiene operaties tegen politieke tegenstanders. Hij houdt zich bezig met ontvoeringen, afpersing en moorden, terwijl zijn contacten binnen de veiligheidsdiensten hem steeds meer macht geven. Zijn positie wordt nog sterker wanneer Argentinië in 1976 onder een militaire dictatuur komt te staan. Naarmate Gordon verder opklimt, verandert hij van een gewone crimineel in een gevreesde leider van een doodseskader. Ondertussen moet hij voortdurend rekening houden met rivalen, voormalige bondgenoten en mensen die zijn geheimen kennen. Zijn groeiende macht brengt hem steeds dichter bij de gewelddadige praktijken van het Argentijnse regime. Indrukwekkend Gordon wordt behoorlijk goed ontvangen, vooral in Argentinië. We lezen onder meer: Vandaag heb ik zes afleveringen van Gordon achter elkaar gekeken (het zijn er zeven, maar de eerste had ik al een hele tijd geleden gezien). Het is een van de meest indrukwekkende, heftige en hartverschreurende ervaringen die een Argentijnse serie ooit heeft geboden, laat staan op Netflix. Er valt ontzettend veel over te analyseren en te discussiëren. Daarnaast wordt de serie bruut genoemd. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! Hoy hice un binge watching de 6 episodios de GORDON (son 7, el primero lo había visto hace mucho) y es una de las experiencias más potentes, brutales y desgarr", "date_str": "2026-11-23T15:18:15+00:00", "hash": "ff07f84b4e412ea0", "title_fa": "سریال جنایی واقعی در نتفلیکس \"وحشیانه و دلخراش\" است", "summary_fa": "شاید قبلاً گوردون را در نتفلیکس دیده باشید. این یک سریال جنایی واقعی از آرژانتین است که با استقبال خوبی روبرو شده است. تماشاگران این نمایش را بی رحمانه و دلخراش می نامند. بینندگان نتفلیکس گوردون را بی رحم و دلخراش می نامند. این مجموعه جنایی هفت قسمتی بر اساس وقایع واقعی (و بر اساس کتاب های گوردون و گوردون، el aniquilador توسط روزنامه نگار مارسلو لاراکوی) ساخته شده است و در دهه 1970 در آرژانتین اتفاق می افتد، دوره ای که در آن تنش های سیاسی و خشونت کشور را از هم می پاشد. داستان حول محور آنیبال گوردون (رودریگو د لا سرنا) می‌چرخد، مردی که در ابتدا از طریق دزدی از بانک و دزدی ماشین پول خود را به دست می‌آورد. او به عنوان یک تاجر ظاهرا محترم و مرد خانواده زندگی دوگانه ای دارد، اما در پشت پرده در حال ساختن یک شبکه جنایی بزرگ است. وقتی وضعیت سیاسی در آرژانتین بدتر می شود، گوردون متوجه می شود که می تواند از مهارت های خشونت آمیز خود علیه افراد با نفوذ در دولت نیز استفاده کند. گوردون با گروه های راست افراطی درگی  که داستان‌هایی است که ریشه در سرزمین دارند، شخصیت‌ها را هدایت می‌کند، و ایده‌های ما را در مورد ژانر گسترش می‌دهد. من می‌خواهم Swampwife را به خاطر داستان‌هایی بشناسند که احساس می‌کنند وارد دنیای دیگری می‌شوند، یکی از لایه‌های بصری غنی و شخصیت‌های پرطنین عاطفی. Swampwife به همه علاقه مندی های داستان سرایی من یک خانه واحد می دهد. تیم خلاق Holler همچنین شامل نیکیتا کارپنتر فیلمبردار است که قبلا با همیلتون در ونوس اوساباو همکاری کرده بود. فریجا باردل، طراح تولید، که تیتراژ اخیر او شامل فیلم سینمایی Is God Is (2026) و موزیک ویدیوی کندریک لامار", "image_url": "https://deadline.com/wp-content/uploads/2026/11/DSC07437.jpeg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۳۰"}, {"source": "Deadline", "title": "Samantha Morton To Receive BFI Fellowship", "link": "https://deadline.com/2026/11/samantha-morton-bfi-fellowship-2026-1237231480/", "summary": "The UK’s leading film organization, the British Film Institute, is honouring actor Samantha Morton with its highest accolade: a BFI Fellowship. The BFI said the honor recognizes Morton’s “extraordinary talent for bringing empathetic, raw and complex performances to her work.” The BFI Fellowship will be presented to Morton at the BFI Chair’s Dinner on January [ ]", "date_str": "2026-11-23T15:00:00+00:00", "hash": "c7b4859dd1d23a32", "title_fa": "سامانتا مورتون برای دریافت کمک هزینه تحصیلی BFI", "summary_fa": "مؤسسه فیلم بریتانیا، مؤسسه فیلم بریتانیا، از بازیگر سامانتا مورتون با بالاترین نشان خود تقدیر می کند: بورسیه BFI. BFI گفت که این افتخار نشان دهنده «استعداد فوق العاده مورتون برای ارائه اجراهای همدلانه، خام و پیچیده به کارش است». بورسیه BFI در شام کرسی BFI در ژانویه به مورتون اعطا خواهد شد [ ] سازمان سینمایی پیشرو بریتانیا، مؤسسه فیلم بریتانیا، از بازیگر سامانتا مورتون با بالاترین نشان خود تقدیر می کند: بورسیه BFI. مورتون اخیراً به خاطر بازی جادوگرانه‌اش در فیلم The Odyssey اثر کریس نولان به یاد می‌آید. از دیگر آثار او می توان به Sweet and Lowdown، Minority Report، The Walking رادیویی FM جهانی Grand Theft Auto VI ظاهر شد Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان نه، شما صدای منحصر به فرد D'Angelo فقید را در Grand Theft Auto VI تصور نمی کردید. همانطور که قبلاً گزارش شده بود، گنجینه‌ای از آهنگ‌های جدید و فیلم‌های بعید در بلاک باستر مورد انتظار Rockstar Games که هفته گذشته منتشر شد، وجود دارد. در Worldwide FM، یکی از ایستگاه های رادیویی درون بازی آن، آهنگ منتشر نشده D'Angelo \"Kamikaze\" قرار دارد. اکنون آن تک آهنگ بالاخره در سرویس های پخش در دسترس است. آن را در زیر گوش کنید. D’Angelo با پیوندهای بازی های ویدیویی غریبه نبود. در سال 2019، او آهنگ Unshaken را برای Red Dead Redemption 2 نوشت. او در ادامه توضیح داد که او یکی از طرفداران پرشور، انبوه و گسترده این فرنچایز است، با خود Rockstar Games تماس گرفت و از دفاتر این شرکت در نیویورک بازدید کرد تا ساعت ها آن را بازی کند. D'Angelo در اکتبر 2025 بر اثر سرطان درگذشت. پس از یک دوره تحسین برانگیز بین اولین آلبوم او، شکر قهوه ای سال 1995، و ادامه آن، وودو در سال 2000، D'Angelo تبدیل به یک چهره منزوی شد که به ندرت در انظار عمومی ظاهر می شد. در سال 2014 زمانی که او با Black Messiah، آلبوم تحسین‌شده‌اش با Vanguard، و تعداد انگشت شماری از حضورهای تلویزیونی خاطره‌انگیز بازگشت، تغییر کرد. او در سال‌های بعد روی چند آهنگ دیگر از جمله «IBTIHAJ» با GZA و Rapsody در سال 2019، «Behove» از Slingbaum با Erykah Badu در اوایل سال 2020 و «I Want You Forever» از Jeymes Samuel با Jay-Z برای موسیقی متن The Book of Clarence.", "image_url": "https://media.pitchfork.com/photos/67b34a61b0f42d44492ac0c0/16:9/w_1280,c_limit/d&#x27;angelo%20roots%20picnic%202025%20headlienrs.jpg", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۳۲"}, {"source": "Billboard", "title": "Corina Smith Signs With Universal Music Latino: ‘They’ve Embraced Me Exactly As I Am’", "link": "https://www.billboard.com/pro/corina-smith-universal-music-latino-signing-exclusive/", "summary": "Corina Smith has signed a deal with Universal Music Latino, Billboard can exclusively announce today (Nov. 23). “Corina Smith is an exceptional talent with a unique artistic identity, authenticity, and undeniable global potential,” Daniel Luna, general manager at Universal Music Latino, said in a statement. “What drew us to Corina is how much of herself she puts into her songs. With this genuine connection we believe Corina has everything it takes to become one of the leading voices of the next generation of Latin music. We are proud to welcome her to Universal Music Latino and be part of her new global journey.” Related Ignacio Meyer Named President of Universal Music Latin America Iberian Peninsula Ignacio Meyer Named President of Universal Music Latin America Iberian Peninsula Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Smith is a Venezuelan singer-songwriter who began writing songs in her bedroom and quickly brought those personal experiences to life through her blooming music career. Blending elements of pop, reggaeton and R B music, Smith’s musical identity is rooted in authenticity, vulnerability and creative independence. She says, “Through my career as an artist my fans and I have developed our own universe and the UML team has given that universe a home. They ve embraced me exactly as I am, allowing me to continue genuinely making the music that I love, with the support of their world-class team. I m so excited to continue building our universe together.” This year, Smith released key collaborations with Mika Bahía (“Encubiertos”), Dome (“@BOMBA DE HUMO” ), and Dani Barranco (“8 Preguntas”). She’s released three studio albums: Antisocial (2022), triste pero siempre mami (2023) and menos triste más mami (2025), and has collaborated with Arcángel, Eladio Carrión and De La Ghetto, to name a few. New music is slated for release in the first quarter of 2027 under her new chapter with Universal Music Latino.", "date_str": "2026-11-23T15:00:00+00:00", "hash": "f06aaa057883c93a", "title_fa": "کورینا اسمیت با یونیورسال موزیک لاتین امضا می کند: \"آنها مرا دقیقاً همانطور که هستم در آغوش گرفتند\"", "summary_fa": "کورینا اسمیت قراردادی با Universal Music Latino امضا کرده است، بیلبورد می تواند به طور انحصاری امروز (23 نوامبر) اعلام کند. دانیل لونا، مدیر کل یونیورسال موزیک لاتین در بیانیه ای گفت: «کورینا اسمیت یک استعداد استثنایی با هویت هنری منحصر به فرد، اصالت و پتانسیل جهانی غیرقابل انکار است. آنچه ما را به سمت کورینا جذب کرد این است که چقدر از خودش در آهنگ هایش استفاده می کند. با این ارتباط واقعی، ما معتقدیم که کورینا همه چیز لازم را برای تبدیل شدن به یکی از صداهای پیشرو نسل بعدی موسیقی لاتین دارد. ما مفتخریم که به او در Universal Music Latino خوش آمد می‌گوییم و بخشی از سفر جهانی جدید او هستیم. مرتبط ایگناسیو مایر به عنوان رئیس یونیورسال موسیقی آمریکای لاتین شبه جزیره ایبری ایبریا انتخاب شد ایگناسیو مایر به عنوان رئیس یونیورسال موسیقی آمریکای لاتین شبه جزیره ایبری آمریکای لاتین موافقت کرد در حال حاضر حمایت از کودکان را افزایش دهد تا دیاموند سابق در مبارزه تلخ حضانت اسمیت یک خواننده و ترانه سرای ونزوئلایی است که در اتاق خواب خود شروع به نوشتن آهنگ های شخصی کرد و به سرعت شروع به نوشتن آهنگ کرد. حرفه ترکیب عناصر موسیقی پاپ، رگیتون و RB، هویت موسیقی اسمیت ریشه در اصالت، آسیب پذیری و استقلال خلاقانه دارد. او می‌گوید: «در طول حرفه‌ام به‌عنوان یک هنرمند، من و طرفدارانم دنیای خود را توسعه داده‌ایم و تیم UML به آن جهان خانه داده است. آنها من را دقیقاً همانطور که هستم در آغوش گرفتند و به من این امکان را دادند که با حمایت تیم کلاس جهانی خود به ساختن واقعی موسیقی مورد علاقه‌ام ادامه دهم. \"من بسیار هیجان زده هستم که به ساختن جهان خود با هم ادامه دهم.\" در این سال، اسمیت همکاری‌های کلیدی خود را با Mika Bahía (\"مخفی\")، Dome (\"@BOMBA DE HUMO\") و Dani", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/corina-smith-cr-universal-music-latino-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۳۰"}, {"source": "Billboard", "title": "‘It’s Not Just a Song on the Radio’: How Music Became A Main Character In ‘Grand Theft Auto VI’", "link": "https://www.billboard.com/music/features/gta-6-radio-songs-soundtrack-justice-billboard-cover-1236386805/", "summary": "For decades, Rockstar Games was chasing one song. In 2002, when the gaming behemoth was developing Grand Theft Auto: Vice City , the fourth installment of its iconic series, it had successfully secured classics like Michael Jackson’s Billie Jean and Grandmaster Flash and the Furious Five’s The Message for the game. But one record remained tantalizingly out of reach: The Cars 1984 single Drive, the highest-charting of the power-pop band’s career. A favorite of Rockstar co-founder Sam Houser, the haunting, synth-driven song encapsulated the neon-soaked 80s world the developer was expanding. Rockstar couldn t clear the track then — but more than two decades later, the wait is finally over. On Nov. 19, Rockstar made its long-awaited return to Vice City with the epic, stunningly cinematic Grand Theft Auto VI . Even before breathless reviews of the game flooded the internet, GTA VI was predicted to be the biggest entertainment launch in history, with possibly more than $5 billion in first week sales alone. And when players turn on one of the game’s defining features — the in-game radio — Drive is the first song they hear. Related Every Track From Grand Theft Auto VI: The Album Ranked Grand Theft Auto VI Soundtrack, Gracie Abrams, LISA, Tomorrow x Together More: New Music Friday Guide Justice, Pretty Lights, Honey Dijon RL Grime Lead Lightning In a Bottle 2027 Lineup For Rockstar vice president of music Ivan Pavlovich, clearing Drive wasn’t just a licensing victory — it was a testament to the company s unwavering prioritization of music, the relationships it has cultivated throughout the industry and the meticulous curation that has transformed Grand Theft Auto into one of the past 20 years’ most culture-saturating, riveting and lucrative products. Music, Pavlovich says, is the through line through all of that. That’s never been more true than with GTA VI , which Pavlovich calls the biggest project we’ve ever done, with, by his count, over 800 songs in the game right now. With 23 radio stations — 21 for music and two for talk radio — along with in-game podcasts to crank up as you re cruising through the streets of Leonida ( GTA ’s Florida stand-in), plus even TV shows to watch when you’re not, it s Rockstar’s most ambitious music-driven experience yet. In 1997, video game developers David Jones and Mike Dailly helped bring the first Grand Theft Auto to life at Scottish gaming studio DMA Design (now Rockstar North). Originally published by BMG Interactive, the 2D ", "date_str": "2026-11-23T14:59:18+00:00", "hash": "6f38829927072c0c", "title_fa": "\"این فقط یک آهنگ در رادیو نیست\": چگونه موسیقی به شخصیت اصلی \"Grand Theft Auto VI\" تبدیل شد", "summary_fa": "برای چندین دهه، Rockstar Games دنبال یک آهنگ بود. در سال 2002، زمانی که این غول بازی در حال توسعه Grand Theft Auto: Vice City، چهارمین قسمت از سری نمادین خود بود، با موفقیت آثار کلاسیکی مانند Billie Jean و Grandmaster Flash مایکل جکسون و Furious Five's The Message را برای بازی تضمین کرد. اما یک رکورد به طرز وسوسه انگیزی دور از دسترس ماند: تک آهنگ The Cars 1984 Drive، بالاترین نمودار در کارنامه گروه پاور پاپ. آهنگ مورد علاقه سام هاوسر، یکی از بنیانگذاران Rockstar، آهنگ ترسناک و مبتنی بر سنتز، دنیای نئونی دهه 80 را که سازنده در حال گسترش آن بود، در بر می گیرد. Rockstar در آن زمان نتوانست مسیر را پاک کند - اما بیش از دو دهه بعد، سرانجام انتظار به پایان رسید. در 19 نوامبر، Rockstar با فیلم حماسی و خیره کننده سینمایی Grand Theft Auto VI به Vice City بازگشت که مدت ها منتظرش بودیم. حتی قبل از اینکه بررسی‌های بی‌نفس این بازی به اینترنت سرازیر شود، GTA VI بزرگترین عرضه سرگرمی تاریخ خواهد بود که احتمالاً تنها در هفته اول فروش بیش از 5 میلیارد دلار خواهد داشت. و هنگامی که بازیکنان یکی از ویژگی های تعیین کننده بازی - رادیو درون بازی - را روشن می کنند، Drive اولین آهنگی است که می شنوند. هر آهنگ مرتبط از Grand Theft Auto VI: The Album Ranked Grand Theft Auto VI موسیقی متن، Gracie Abrams، LISA، Tomorrow x Together موارد بیشتر: New Music Friday Guide Justice، Pretty Lights، Honey Dijon RL Grime Lead Lightning In a Bottle 2027 Lineup For Rockstar Driver Pavlovich، معاون رئيس جمهور موسيقي بود. پیروزی - این گواهی بر اولویت بندی تزلزل ناپذیر این شرکت برای موسیقی، روابطی که در سراسر صنعت ایجاد کرده است و مدیریت دقیقی بود که Grand Theft Auto را به یکی از", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/cover-gta-vi-grand-theft-auto-billboard-rockstar-games-1-jason-lucia-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۲ آذر • ۱۸:۲۹"}, {"source": "Billboard", "title": "Justin Timberlake Exposes His Doubts in Docuseries Trailer: ‘People Aren’t Gonna Understand Who I Am’", "link": "https://www.billboard.com/culture/tv-film/justin-timberlake-doubts-docuseries-trailer-release-date-1236387718/", "summary": "What goes around comes around back on TV. The Justin Timberlake documentary series that was first reported in early November is now official. Apple TV announced the four-part series, simply titled Timberlake , on Monday (Nov. 23) and dropped the project s first trailer. Related Justin Timberlake to Release 4-Part Docuseries That Includes Janet Jackson as a Guest Justin Timberlake Makes Rare Public Appearance With Sons and Niece on Runway at Down Syndrome Foundation Fashion Show Justin Timberlake Crowns This FutureSex/LoveSounds Hit as the Best Song He s Ever Made: Written in Damn Near 20 Minutes The 2.5 minute clip kicks off with the 10-time Grammy winner plopping down on a cushy couch and demanding to know, What are you looking to accomplish from this documentary? He immediately reveals his doubts about the project directed by Oscar winner Fisher Stevens. People aren t going to understand who I am! The trailer for the docuseries, which will follow the trajectory of Timberlake s career from *NSYNC through his solo success, dives in from the beginning. I m sure that you re going to go back and see these incredibly sweet and goofy things from my childhood — the star says as family footage of Timberlake as a toddler play, moving through his teen years, including a clip of him showing off the poster of Janet Jackson in his bedroom — and some things that are really hard to talk about. At that, clips of him with former girlfriend Britney Spears appear, followed by news footage of Timberlake s DUI arrest. But it s not all bad. Big names in entertainment such as Pharrell Williams and Lorne Michaels also appear to praise the singer-actor, though Janet Jackson, who was previously reported to be taking part in the project, did not appear other than in flashback clips from her 2004 Super Bowl performance with Timberlake. For the first time in my life, I m coming to a place to say, I can t handle it all,' admits the star in one confessional scene. In the finale one, he notes, You want to ask me about specific things? Let s do it! According to the press release, the four-part series will include never-before-seen archival footage, as well as interviews with his friends, collaborators and of course, his family. (Jessica Biel, whom Timberlake married in 2012, as well as his mother appear in the teaser.) The first two episodes of Timberlake will premiere Friday, Dec. 11, on Apple TV with the third episode dropping Dec. 18 and the finale arriving just in time for Christmas ", "date_str": "2026-11-23T14:55:19+00:00", "hash": "907ca7bb080ce56c", "title_fa": "جاستین تیمبرلیک شک های خود را در تریلر مستند افشا می کند: «مردم نمی توانند بفهمند من کی هستم»", "summary_fa": "آنچه در اطراف می گذرد به تلویزیون بازمی گردد. مجموعه مستند جاستین تیمبرلیک که اولین بار در اوایل نوامبر گزارش شد، اکنون رسمی شده است. اپل تی‌وی این مجموعه چهار قسمتی را با نام ساده تیمبرلیک در روز دوشنبه (23 نوامبر) اعلام کرد و اولین تریلر این پروژه را منتشر کرد. جاستین تیمبرلیک فیلم مستندی 4 قسمتی را منتشر می‌کند که شامل جانت جکسون به عنوان مهمان می‌شود. دقایق این کلیپ 2.5 دق .recart.ir/archive/2026-09-13.html"}, {"date_key": "2026-09-12", "p_date": "۲۱ شهریور ۱۴۰۵", "g_date": "۱۲ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-12.html"}, {"date_key": "2026-09-11", "p_date": "۲۰ شهریور ۱۴۰۵", "g_date": "۱۱ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-11.html"}, {"date_key": "2026-09-10", "p_date": "۱۹ شهریور ۱۴۰۵", "g_date": "۱۰ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://news.recart.ir/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
