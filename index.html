://www.netflix-nederland.nl/netflix-komt-verrassend-met-hernieuwde-one-day/", "summary": "Kun jij je One Day uit 2024 nog herinneren? Waarschijnlijk wel, want de serie in kwestie trok 9,9 miljoen kijkers in zijn eerste week! Nu werkt de maker van One Day aan een soortgelijk project, een nieuw project, een nieuwe serie genaamd Prep, of PREP. Nieuwe Netflix-serie van maker One Day: Prep Prep is een Amerikaanse coming-of-age-roman uit 2005 van Curtis Sittenfeld, die door showrunner Nicole Taylor (van One Day dus) omgeturnd wordt tot een serie voor Netflix. Het verhaal draait om Lee Fiora, een verlegen veertienjarig meisje uit een gewoon gezin in Indiana dat een beurs krijgt om te studeren aan de prestigieuze Ault School, een exclusieve kostschool in Massachusetts. Wanneer Lee op de school arriveert, ontdekt ze dat haar nieuwe klasgenoten voornamelijk afkomstig zijn uit bijzonder rijke en invloedrijke families. Ze voelt zich al snel een buitenstaander en heeft moeite om aansluiting te vinden bij de andere leerlingen. Terwijl haar klasgenoten zich bezighouden met feestjes en hun toekomst aan beroemde universiteiten (dat staat immers al vast), maakt Lee zich voortdurend zorgen over wat anderen van haar denken. Onzekerheid Gedurende haar vier schooljaren probeert Lee haar plek te vinden. Ze sluit vriendschappen, wordt verliefd op een populaire jongen, noem het allemaal maar op. Haar onzekerheid zorgt ervoor dat ze regelmatig verkeerde beslissingen neemt en zich steeds verder verwijdert van haar familie. Wanneer Lee eindelijk het gevoel krijgt dat ze erbij hoort, brengt een onverwachte gebeurtenis haar zorgvuldig opgebouwde sociale leven in gevaar. Ze wordt gedwongen na te denken over haar eigen identiteit en de manier waarop ze zich jarenlang heeft aangepast aan haar omgeving. Wanneer komt Prep op Netflix? Dat weten we dus al, maar het is nog volstrekt onbekend wanneer Prep precies naar Netflix moet komen. Vermoedelijk duurt het nog wel eventjes, 2027 wordt hoogstwaarschij  bestorming van het Paleis van Justitie in Bogotá in november 1985, waarbij tientallen mensen om het leven kwamen of spoorloos verdwenen. Op 6 november 1985 dringen gewapende leden van de guerrillabeweging M-19 het Paleis van Justitie binnen. Ze nemen meer dan driehonderd mensen in gijzeling, onder wie rechters van het Hooggerechtshof, medewerkers en bezoekers. De guerrillastrijders willen de Colombiaanse regering onder druk zetten, maar hun actie leidt tot een gewelddadige confrontatie met het leger. De Colombiaanse autoriteiten besluiten het gebouw met militaire middelen te heroveren. Terwijl soldaten en guerrillastrijders elkaar bevechten, zitten honderden gijzelaars gevangen tussen de strijdende partijen. Het gebouw verandert in een oorlogsgebied en er breken grote branden uit. Voor de mensen binnen wordt het een wanhopige strijd om te overleven. De serie volgt de gebeurtenissen vanuit verschillende perspectieven. Niet alleen de gijzelaars en guerrillastrijders komen aan bod, maar ook (onder meer) de militairen en politici die bij de crisis betrokken raken. Zo wordt duidelijk hoe de situatie steeds verder escaleert en hoe beslissingen van de autoriteiten grote gevolgen hebben voor de mensen in het gebouw. 94 doden Na ongeveer 27 uur weet het leger het Paleis van Justitie te heroveren. De gevolgen zijn verschrikkelijk: minstens 94 mensen komen om het leven of verdwijnen. Sommige slachtoffers worden nooit teruggevonden, terwijl er jarenlang vragen blijven bestaan over wat er precies tijdens de militaire operatie is gebeurd. Het beste van dit alles: Palacio is nú te bekijken op Netflix. Heb je nog een zetje in de rug nodig? Check dan de trailer hieronder. Lees hier ook het waargebeurde verhaal achter Palacio . Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Thriller op Netflix over bloedigste gijzeling in Colombia ooit appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-11-07T14:41:5     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
