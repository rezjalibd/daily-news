 Europe five years ago. When we fell in love, I was skeptical that a long-distance relationship was a good idea. Dating across the Atlantic set us up for long-term success and had surprising benefits in my 20s. In 2021, I met a handsome Frenchman in the lobby of a Lisbon hostel. At the time, I was 25, and he was 22. We had dinner together, and after a few weeks of flirting over WhatsApp , we agreed to meet again in Paris. Maxime took me to dinner in Montmartre and showed me the suburb where he grew up. He was kind, smart, and funny, but I expected to never see him again. I was heading home to Texas , and he was starting his career in Europe. But we couldn't stop talking, and after months of FaceTime calls, I went back to France. We went skiing, and Maxime introduced me to his friends and family. On the plane home, I realized I had fallen in love with him. Growing up, I always heard that long-distance relationships never work, but I decided to give one with Maxime a shot. Dating across the Atlantic set us up for long-term success and had surprising benefits in my 20s. We didn't have pressure to define our relationship In my 20s, I always felt pressure to define whatever relationship I was in. After a few dates, I would ask, \"Are we exclusive or dating other people?\" \"Are we serious or is this casual?\" Looking back, I now know I was protecting my heart from disappointment. The stakes felt lower when I started dating someone thousands of miles away. I wasn't worried because I didn't have long-term expectations; I just knew I wanted to see Maxime again. I took things one conversation, one visit at a time, and initiated a discussion of our relationship status after six months. Despite the distance, we agreed there was something real between us. The author said she and her long-distance boyfriend talked or texted daily while apart and took many trips together. Courtesy of Berkeley Mashburn. We had space to explore and build our careers I always knew that it would be important to seize opportunities to build my career in my 20s. Sometimes, those opportunities might require moving cities or trying a new industry. With an ocean between us, Maxime and I could ma", "date_str": "2026-09-16T12:08:01+00:00", "hash": "834c1363eddeac5e", "title_fa": "من 3 سال رابطه از راه دور داشتم. ما اکنون با هم زندگی می کنیم، اما شرایط ما برای 20 سالگی من عالی بود.", "summary_fa": "نویسنده گفت که یک رابطه از راه دور به او چیزهای زیادی در مورد اینکه چه چیزی باعث ایجاد رابطه مناسب در 20 سالگی می شود، آموخت. در اینجا او با شریک زندگی خود در حالی که آنها با هم به دریاچه گاردا در شمال ایتالیا سفر می کردند نشان داده می شود. با حسن نیت از برکلی مشبرن. پنج سال پیش هنگام کوله‌پشتی در اروپا، شریک زندگی‌ام، یک فرانسوی را دیدم. وقتی عاشق شدیم، شک داشتم که یک رابطه از راه دور ایده خوبی است. آشنایی در آن سوی اقیانوس اطلس ما را برای موفقیت بلندمدت آماده کرد و در 20 سالگی مزایای شگفت انگیزی داشت. در سال 2021، در لابی یک هاستل لیسبون با یک فرانسوی خوش تیپ آشنا شدم. در آن زمان من 25 ساله بودم و او 22 ساله. ماکسیم مرا برای شام در مونمارتر برد و حومه ای را که در آن بزرگ شده بود به من نشان داد. او مهربان، باهوش و بامزه بود، اما انتظار داشتم دیگر هرگز او را نبینم. من داشتم به تگزاس می رفتم و او کارش را در اروپا شروع می کرد. اما نتوانستیم صحبت را متوقف کنیم و پس از ماه ها تماس با فیس تایم، به فرانسه برگشتم. رفتیم اسکی و ماکسیم منو به دوستان و خانواده اش معرفی کرد. در هواپیمای خانه متوجه شدم که عاشق او شده ام. وقتی بزرگ شدم، همیشه می شنیدم که روابط از راه دور هیچ وقت جواب نمی دهد، اما تصمیم گرفتم یکی از آنها را با ماکسیم امتحان کنم. آشنایی در آن سوی اقیانوس اطلس ما را برای موفقیت بلندمدت آماده کرد و در 20 سالگی مزایای شگفت انگیزی داشت. ما فشاری برای تعریف رابطه مان نداشتیم در 20 سالگی، من همیشه برای تعریف رابطه ای که در آن بودم، تحت فشار بودم. \"ما جدی هستیم یا این اتفاقی"}, {"source": "Business Insider", "title": "Why it feels like every brand is having a scandal right now", "link": "https://www.businessinsider.com/inside-the-brand-scandal-social-media-complex-2026-9", "summary": "Neutrogena faced a backlash over a resurfaced podcast interview in which former longtime ambassador Hayden Panettiere said she was mistreated by the company. Panettiere died in August. Jason Merritt/FilmMagic A version of this post appears in the CMO Insider newsletter. Sign up for Business Insider's weekly marketing newsletter . It was the summer of brand scandals — but not because marketers are suddenly more accident-prone. The reason: the internet has become highly attuned to brand missteps and apt to turn them into full-blown crises. This weekend, Hyrox was plunged into a reputational emergency after an athlete soiled herself during a race and was allowed to continue, sparking a wave of online complaints about hygiene. In the last few weeks, we've seen Good Good's bad ad scandal, Neutrogena taking heat over its alleged treatment of Hayden Panettiere , and Target apologizing for stocking an offensive Halloween costume . Each scandal had its nuance, but they all followed a similar pattern: An incident became social media fodder, spread like wildfire, and forced the brand to respond. Here's my theory on why stories about brand misfires feel so frenetic. A lot of people are feeling lousy at the moment. Anxious about how to make your next mortgage payment, or whether AI might displace your job? Weighing in on a brand drama can offer a cathartic form of escapism with an added dopamine hit of moral superiority. And it only takes a few seconds. \"Online media has made it exceptionally easy for everyone to share their hot takes, and this is happening faster than ever,\" said Linda Boff , the former longtime CMO of GE, who now leads the marketing agency Said Differently. Meanwhile, creators are under pressure to constantly churn out content in the hope of lighting up the algorithms. Recognizable brands provide the perfect raw material for the internet's commentary class — especially if a celebrity is involved. Online outrage offers a ready-made hook, as brand scandals have become their own genre of low-stakes drama. The stakes feel excruciatingly high for CMOs in the middle of a frenzy, though. Marketers — and even CEOs — have lost their jobs when the heat got too much for their companies. Scenario planning and constant monitoring are crucial. \"There's a much lower bar for intervention and a much higher necessity of sussing things out on Reddit and others before you really catch fire,\" Richard Edelman, of the PR firm Edelman, told me in an interview earlier this y", "date_str": "2026-09-16T12:00:01+00:00", "hash": "96744f65b8a384f1", "title_fa": "چرا به نظر می رسد هر برندی در حال حاضر رسوایی دارد", "summary_fa": "نوتروژنا به دلیل یک مصاحبه پادکستی که دوباره ظاهر شد، با واکنش شدیدی روبرو شد که در آن سفیر سابق، هایدن پانتییر گفت که توسط شرکت بدرفتاری شده است. پانتییر در ماه اوت درگذشت. Jason Merritt/FilmMagic نسخه ای از این پست در خبرنامه CMO Insider ظاهر می شود. برای خبرنامه بازاریابی هفتگی Business Insider ثبت نام کنید. تابستان رسوایی های برند بود - اما نه به این دلیل که بازاریابان ناگهان بیشتر در معرض تصادف هستند. دلیل: اینترنت به شدت با گام های اشتباه برند هماهنگ شده است و می تواند آنها را به بحران های تمام عیار تبدیل کند. آخر این هفته، Hyrox پس از اینکه یک ورزشکار خود را در طول مسابقه کثیف کرد و اجازه یافت ادامه دهد، در یک وضعیت اضطراری مشهور قرار گرفت و موجی از شکایات آنلاین در مورد بهداشت را برانگیخت. در چند هفته گذشته، ما شاهد رسوایی تبلیغات بد Good Good، بودیم که Neutrogena به دلیل رفتار ادعایی خود با هیدن پانتییر داغ شد، و هدف عذرخواهی برای تهیه لباس توهین آمیز هالووین. هر رسوایی تفاوت های ظریف خود را داشت، اما همه آنها از الگوی مشابهی پیروی می کردند: یک حادثه تبدیل به خوراک رسانه های اجتماعی شد، مانند آتش سوزی گسترده شد و برند را مجبور به واکنش کرد. در اینجا تئوری من در مورد اینکه چرا داستان‌های مربوط به شلیک نامناسب برند تا این حد دیوانه کننده هستند، وجود دارد. بسیاری از مردم در حال حاضر احساس تنبلی می کنند. آیا نگران نحوه پرداخت وام بعدی خود هستید یا اینکه آیا هوش مصنوعی ممکن است شغل شما را جابجا کند؟ سنجیدن یک درام نام تجاری می تواند شکلی جذاب از گریز با افزایش دوپامین برتری اخلاقی را ارائه دهد. و فقط چند ثانیه طول می کشد. لیندا باف، مدیر سابق سابق جنرال الکتریک، که اکنون آژانس بازاریابی Said Differently"}, {"source": "Business Insider", "title": "We got a new clue about Xbox's ad ambitions", "link": "https://www.businessinsider.com/xbox-patent-hints-at-in-game-ad-ambitions-2026-9", "summary": "Bloomberg/Getty Images A version of this post appears in the CMO Insider newsletter. Sign up for Business Insider's weekly marketing newsletter . You've just set down your Xbox controller after wiping out the final boss. Now, time for an ad! The folks at Patentlyze made me aware of a recent patent filing from Microsoft that hints at Xbox's in-game advertising ambitions. The filing, published earlier this month, outlines a concept for a content management system that would detect appropriate breaks in streaming gameplay — like completing a level — to insert an ad. Gamers could be rewarded for watching the ad with a credit that offers a set period of uninterrupted gameplay. The usual patent caveats apply. Companies like Microsoft file many patents, and they don't always materialize as products or indicate active business priorities. Still, the filing offers insight into how Xbox thinks the next chapter of its nascent in-game ad business could play out — and includes some funky diagrams. Vincent Tessier, CMO of the gaming company 52 Entertainment, said the patent indicates Xbox is taking a leaf from mobile gaming apps, where the \" rewarded video \" format is popular. Rewarded videos are opt-in ads that offer viewers an incentive for watching, such as extra lives or in-game virtual currency. They also command higher prices. The average CPM, or cost per thousand impressions, for a rewarded video ad was around $19.63 on iOS in the US, versus $9.64 for interstitial ads and $1.30 for banners, per a May report from the online gaming platform Playio. \"They're trying to find low-hanging fruit,\" Tessier said. Xbox wants ads without the aggro Perhaps wary of rattling the passionate gaming community, Xbox's ad business has so far been taking baby steps in its expansion. In July, it announced it was testing a way for users to stream games for free by watching ads , rather than paying for a Game Pass subscription. You have to jump through some hoops to try it out: You need to be a member of its fan-feedback community, Xbox Insiders. Opted-in members then watch two minutes of ads before joining the cloud streaming queue to play their game. They then get access to a one-hour cloud-gaming session. Ad insiders told me back then that while offering access to cloud gaming solves legitimate use cases — from playing while traveling or accessing games without dedicated hardware — it's still a small portion of the gaming pie, and wasn't enough to build a scaled ad business. Finding ", "date_str": "2026-09-16T11:45:01+00:00", "hash": "6278f1e02e8a39f2", "title_fa": "ما یک سرنخ جدید در مورد جاه طلبی های تبلیغاتی Xbox دریافت کردیم", "summary_fa": "Bloomberg/Getty Images نسخه ای از این پست در خبرنامه CMO Insider ظاهر می شود. برای خبرنامه بازاریابی هفتگی Business Insider ثبت نام کنید. پس از پاک کردن باس نهایی، فقط کنترلر ایکس باکس خود را تنظیم کرده اید. حالا وقت تبلیغ است! مردم Patentlyze من را از ثبت اختراع اخیر مایکروسافت آگاه کردند که به جاه طلبی های تبلیغاتی Xbox در بازی اشاره می کند. این پرونده که در اوایل این ماه منتشر شد، مفهومی را برای یک سیستم مدیریت محتوا ترسیم می کند که وقفه های مناسب را در جریان بازی - مانند تکمیل یک سطح - برای درج یک تبلیغ تشخیص می دهد. گیمرها می‌توانند برای تماشای آگهی با اعتباری که دوره‌ای از گیم‌پلی بدون وقفه را ارائه می‌دهد، پاداش دریافت کنند. اخطارهای معمول ثبت اختراع اعمال می شود. شرکت‌هایی مانند مایکروسافت پتنت‌های زیادی را ثبت می‌کنند، و همیشه به عنوان محصولات یا اولویت‌های فعال تجاری مشخص نمی‌شوند. با این حال، بایگانی بینشی را در مورد اینکه Xbox چگونه فکر می‌کند فصل بعدی کسب‌وکار تبلیغات درون‌بازی‌اش می‌تواند انجام شود، ارائه می‌دهد - و شامل برخی نمودارهای بد بو. Vincent Tessier، مدیر ارشد اجرایی شرکت بازی 52 Entertainment، گفت که این پتنت نشان می‌دهد که Xbox در حال برداشتن برگه‌ای از برنامه‌های بازی موبایل است، جایی که فرمت «ویدیوی پاداش‌دار» محبوب است. ویدیوهای دارای پاداش تبلیغاتی هستند که به بینندگان انگیزه ای برای تماشا می دهند، مانند زندگی اضافی یا ارز مجازی درون بازی. آنها همچنین قیمت های بالاتری دارند. میانگین CPM یا هزینه به ازای هر هزار نمایش، برای یک تبلیغ ویدیویی با پاداش حدود 19.63 دلار در iOS در ایالات متحده بود، در مقابل 9.64 دلار برای تبلیغات بینابینی و 1.30 دلار برای بنرها، به ازای هر گزارش ماه می از پلتفرم بازی آنلاین Playio. تسیر گفت: «آنها در تلاشند میوه کم آویزان را پیدا کنند. ایکس‌باکس"}, {"source": "Business Insider", "title": "Grindr is betting big on IRL marketing. There’s a very digital reason.", "link": "https://www.businessinsider.com/grindr-leans-into-irl-marketing-boost-social-reach-2026-9", "summary": "Grindr is shifting its marketing into the material world. Bloomberg/Getty Images A version of this post appears in the CMO Insider newsletter. Sign up for Business Insider's weekly marketing newsletter . Grindr became one of the world's best-known dating brands by helping men meet each other using their phones. Its marketing dollars, on the other hand, are increasingly being deployed in the real world. Grindr CMO Tristan Pineiro told me that there are two pertinent — and digital — business reasons he's betting big on IRL. The photos and videos that people organically share when they're enjoying an event can travel further on social media than the brand's own posts. Then there's a quirk of Grindr's advertising business: Many brands are still wary of placing their ads inside a gay hook-up app . \"There is a lot of nervousness about it, with the whole rollback of DEI, a lot of brands have felt emboldened to say, 'Oh well, we don't need to bother anymore,'\" Pineiro said. \"There are brands we do work with that stuck with us, and there are others that have disappeared, or say the budget just isn't there anymore.\" Getting into the IRL groove Grindr joins brands like language-learning app Duolingo , home-improvement retailer Lowe's , and AI company Anthropic , which have all been upping their experiential game in recent months. As big monoculture media moments dwindle and social feeds become ever more personalized, marketers are turning to events and pop-ups to build brand affinity and loyalty. There's another incentive to create experiences people want to talk about. A Brandwatch study published last year, analyzing more than 900 million online mentions, found that brand-owned accounts initiate fewer than 1% of posts about their own brands on X. For CMOs chasing social reach , increasingly, it pays to give people a reason to grab their phones. Grindr said 50,000 people turned up to its surprise Madonna concert in New York s Times Square, just 30 minutes after receiving a notification in the app. Bloomberg/Getty Images During Pride Month in June, Grindr announced a surprise Madonna concert in New York's Times Square to promote her new album \"Confessions II.\" Grindr sent out a push notification within the app 30 minutes before the show, prompting 50,000 people to turn up, the company said, with many more viewing the livestream and clips on social media. The Grindr-exclusive picture disc album vinyl was \"the best-selling by far\" of the \"Confessions II\" records, Pinei", "date_str": "2026-09-16T11:30:01+00:00", "hash": "c31ed095cb9d6bea", "title_fa": "Grindr روی بازاریابی IRL شرط بندی بزرگی می کند. یک دلیل بسیار دیجیتالی وجود دارد.", "summary_fa": "Grindr در حال تغییر بازاریابی خود به دنیای مادی است. Bloomberg/Getty Images نسخه ای از این پست در خبرنامه CMO Insider ظاهر می شود. برای خبرنامه بازاریابی هفتگی Business Insider ثبت نام کنید. Grindr با کمک به مردان برای ملاقات با یکدیگر با استفاده از تلفن هایشان به یکی از شناخته شده ترین برندهای دوستیابی در جهان تبدیل شد. از سوی دیگر، دلارهای بازاریابی آن به طور فزاینده ای در دنیای واقعی مستقر می شوند. Grindr CMO Tristan Pineiro به من گفت که دو دلیل تجاری مرتبط - و دیجیتال - وجود دارد که او روی IRL شرط بندی می کند. عکس‌ها و ویدیوهایی که مردم هنگام لذت بردن از یک رویداد به‌طور ارگانیک به اشتراک می‌گذارند، می‌توانند در رسانه‌های اجتماعی فراتر از پست‌های خود برند سفر کنند. سپس یک نکته عجیب در تجارت تبلیغاتی Grindr وجود دارد: بسیاری از برندها هنوز از قرار دادن تبلیغات خود در یک برنامه همجنسگرایانه احتیاط می کنند. پینیرو گفت: \"در مورد آن اضطراب زیادی وجود دارد، با کل عقب نشینی DEI، بسیاری از برندها جرأت پیدا کردند که بگویند، \"اوه خوب، ما دیگر نیازی به زحمت نداریم.\" مارک‌هایی هستند که ما با آن‌ها کار می‌کنیم که به ما چسبیده‌اند، و برخی دیگر ناپدید شده‌اند، یا می‌گویند بودجه دیگر وجود ندارد.» ورود به شیار IRL Grindr به برندهایی مانند برنامه یادگیری زبان Duolingo، خرده‌فروشی لوازم خانگی Lowe's و شرکت هوش مصنوعی Anthropic می‌پیوندد که همگی در ماه‌های اخیر بازی تجربی خود را ارتقا داده‌اند. همانطور که لحظات بزرگ رسانه‌های تک‌فرهنگ کاهش می‌یابد و فیدهای اجتماعی بیش از پیش شخصی‌تر می‌شوند، بازاریابان برای ایجاد وابستگی و وفاداری به برند به رویدادها و پنجره‌های بازشو روی می‌آورند. انگیزه دیگری برای ایجاد تجربیاتی وجود دارد که مردم می خواهند درباره آنها صحبت کنند. یک مطالعه Brandwatch که در سال گذشته منتشر شد، با تجزیه و تحلیل بیش"}, {"source": "Business Insider", "title": "'Big Short' investor Michael Burry says an AI bubble would make the rich richer", "link": "https://www.businessinsider.com/michael-burry-ai-bubble-wealth-gap-society-warning-2026-9", "summary": "Michael Burry says he s indignant about the wealth transfers that bubbles can create. Bloomberg/Getty Images Michael Burry said on Substack and X that an AI bubble would transfer wealth to a lucky few. The investor of \"The Big Short\" fame warned that circular financing is \"poison to the free Republic.\" He said that while human cruelty is nothing new, technology is hindering society's improvement. Michael Burry , the investor who rose to fame for betting against the housing market before the 2008 crash, is now warning about what he sees as the social consequences of the AI boom. In a Substack post, the investor immortalized by \"The Big Short\" said he was \"righteously indignant over the wealth transfer to the very few that these bubbles create.\" Burry said mechanisms ranging from \"circular financing among tech companies\" to \"schemes emanating from Washington DC\" were driving \"this extreme enrichment of the lucky few.\" At the same time, much of the economy is \"existentially worried about grocery and gas prices.\" He called that dynamic \"hemlock to the health and longevity of the free Republic.\" He added: \"The whole system is about creating bubbles so the grift can happen.\" The surge in AI investment has sent huge sums through a relatively small group of chipmakers, cloud providers, model developers, and data-center operators. Companies are racing to secure advanced chips, build computing capacity, and lock in access to power, while investors have rewarded firms seen as central to the buildout with sharply higher valuations. Nvidia, the largest provider of chips to the AI industry, has seen its market cap soar by about 1,200% to more than $5 trillion since the launch of ChatGPT in late 2022. The AI boom has also led to extraordinary competition for technical talent. Business Insider's analysis of federal visa filings found that OpenAI listed base salaries of up to $530,000 for technical staff, while Anthropic research engineers could earn up to $690,000. In follow-up posts on X, Burry repeated the warning, calling it \"poison\" to the republic's health and \"the ongoing bastardization of its very existence.\" Whether circular financing or schemes emanating from Washington DC, this extrerme enrichment of the few leaving the majority existentially worried about grocery prices is as poison to the health and longevity of the free Republic as well as the ongoing bastardization of its very… — Cassandra Unchained (@michaeljburry) September 16, 2026 The comments drew a rep", "date_str": "2026-09-16T11:26:17+00:00", "hash": "fbdee643e9ac8d96", "title_fa": "مایکل بری، سرمایه‌گذار Big Short می‌گوید حباب هوش مصنوعی ثروتمندان را ثروتمندتر می‌کند", "summary_fa": "مایکل بری می گوید که از انتقال ثروتی که حباب ها می توانند ایجاد کنند، خشمگین است. بلومبرگ/گتی ایماژ مایکل بری در Substack و X گفت که یک حباب هوش مصنوعی ثروت را به عده ای خوش شانس منتقل می کند. سرمایه گذار مشهور \"The Big Short\" هشدار داد که تامین مالی دایره ای \"سم برای جمهوری آزاد\" است. او گفت در حالی که ظلم به انسان چیز جدیدی نیست، فناوری مانع پیشرفت جامعه می شود. مایکل بری، سرمایه‌گذاری که قبل از سقوط در سال 2008 به دلیل شرط‌بندی در بازار مسکن به شهرت رسید، اکنون در مورد پیامدهای اجتماعی رونق هوش مصنوعی هشدار می‌دهد. در یک پست Substack، سرمایه‌گذار که توسط \"The Big Short\" جاودانه شد، گفت که \"به حق از انتقال ثروت به تعداد معدودی که این حباب‌ها ایجاد می‌کنند خشمگین است.\" بری گفت که مکانیسم‌هایی از «تامین مالی دایره‌ای در میان شرکت‌های فناوری» تا «طرح‌هایی که از واشنگتن دی سی سرچشمه می‌گیرند» موجب «غنی‌سازی شدید افراد خوش شانس» شده است. در عین حال، بسیاری از اقتصاد \"به طور وجودی نگران قیمت مواد غذایی و بنزین هستند.\" او آن پویا را \"شوکران برای سلامتی و طول عمر جمهوری آزاد\" نامید. وی افزود: کل سیستم ایجاد حباب است تا این گرافت اتفاق بیفتد. افزایش سرمایه گذاری در هوش مصنوعی مبالغ هنگفتی را از طریق گروه نسبتاً کوچکی از سازندگان تراشه، ارائه دهندگان ابر، توسعه دهندگان مدل و اپراتورهای مرکز داده ارسال کرده است. شرکت‌ها برای ایمن کردن تراشه‌های پیشرفته، ایجاد ظرفیت محاسباتی و قفل کردن دسترسی به قدرت رقابت می‌کنند، در حالی که سرمایه‌گذاران به شرکت‌هایی که به‌عنوان مرکزی در ساخت‌وساز دیده می‌شوند، با ارزش‌گذاری‌های بسیار بالاتر پاداش می‌دهند. انویدیا، بزرگ‌ترین ارائه‌دهنده تراشه‌های صنعت هوش مصنوعی، از زمان راه‌اندازی ChatGPT در اواخر سال 2022، ارزش بازار خود را حدود 1200 درصد افزایش داده و به بیش از 5 تریلیون"}, {"source": "Business Insider", "title": "The 20 biggest US airports ranked from worst to best for passenger satisfaction", "link": "https://www.businessinsider.com/best-worst-airports-us-ranking-passengers-2026-9", "summary": "Minneapolis-Saint Paul International Airport is a favorite among passengers. Davslens Photography/Getty Images JD Power's North America Airport Satisfaction Study ranked \"mega\" airports on a 1,000-point scale. Canadian airports were omitted this year because JD Power changed its Canada sampling methodology. Minneapolis-Saint Paul International Airport was ranked the top airport for the third year in a row. There are large airports, and then there are \"mega airports.\" The annual JD Power North America Airport Satisfaction Study measured overall passenger satisfaction at US airports across three size categories: medium (4.5 to 9.9 million passengers a year), large (10 to 32.9 million passengers a year), and mega (33 million or more passengers a year). The 2026 study was based on 24,710 surveys of US and Canadian residents who traveled through at least one eligible North American airport in the 30 days before completing the survey. The segment average was 617 on a 1,000-point scale. While Canadian residents were surveyed for the 2026 study, Canadian airports , including Toronto Pearson, were not included in this year's rankings because the company changed its sampling methodology in Canada, a JD Power spokesperson told Business Insider. For the ranking, passengers were asked to evaluate their experiences across seven core factors, in order of importance: Ease of travel through the airport Level of trust in the airport Terminal facilities Airport staff Departure/to airport experience Food, beverage, and retail Arrival/from airport experience One takeaway from the 2026 study: airport renovations pay off. The highest-ranked airports in 2026 have either recently completed or are almost finished with capital improvement projects . Though these makeovers can cost upward of $1 billion and span multiple years, the results speak for themselves — JD Power found overall passenger satisfaction at mega airports increased 14 points, even as passenger volume remains at record levels. Minneapolis-St. Paul International Airport, which ranked first for the third year in a row in 2026, recently underwent a $242 million terminal renovation in December 2025, refreshing gate areas, seating, flooring, lighting, signs, and other post-security spaces. More satisfied passengers also spend more money, JD Power found. Travelers who rated their airport experience \"perfect\" spent an average of $20.22 more than those who rated their airport trips \"just OK.\" JD Power also found that high-sc", "date_str": "2026-09-16T11:01:01+00:00", "hash": "d93e94781e88b36e", "title_fa": "20 فرودگاه بزرگ ایالات متحده از بدترین تا بهترین برای رضایت مسافران رتبه بندی شده اند", "summary_fa": "فرودگاه بین المللی مینیاپولیس-سنت پل در میان مسافران مورد علاقه است. Davslens Photography/Getty Images مطالعه رضایت فرودگاه آمریکای شمالی JD Power فرودگاه های \"مگا\" را در مقیاس 1000 درجه بندی کرد. فرودگاه‌های کانادا امسال حذف شدند زیرا JD Power روش‌شناسی نمونه‌گیری کانادا را تغییر داد. فرودگاه بین المللی مینیاپولیس-سنت پل برای سومین سال متوالی به عنوان برترین فرودگاه انتخاب شد. فرودگاه های بزرگ وجود دارد و سپس «فرودگاه های بزرگ». مطالعه سالانه رضایت فرودگاه های آمریکای شمالی JD Power رضایت کلی مسافران در فرودگاه های ایالات متحده را در سه دسته اندازه گیری کرد: متوسط ​​(4.5 تا 9.9 میلیون مسافر در سال)، بزرگ (10 تا 32.9 میلیون مسافر در سال) و مگا (33 میلیون مسافر یا بیشتر در سال). مطالعه سال 2026 بر اساس 24710 نظرسنجی از ساکنان ایالات متحده و کانادا انجام شد که حداقل از یک فرودگاه واجد شرایط آمریکای شمالی در 30 روز قبل از تکمیل نظرسنجی سفر کردند. میانگین بخش 617 در مقیاس 1000 امتیازی بود. سخنگوی JD Power به Business Insider گفت در حالی که ساکنان کانادا برای مطالعه 2026 مورد بررسی قرار گرفتند، فرودگاه های کانادا از جمله تورنتو پیرسون در رتبه بندی امسال قرار نگرفتند زیرا این شرکت روش نمونه گیری خود را در کانادا تغییر داد. برای رتبه‌بندی، از مسافران خواسته شد تجربیات خود را در هفت عامل اصلی به ترتیب اهمیت ارزیابی کنند: سهولت سفر از طریق فرودگاه سطح اعتماد به فرودگاه امکانات ترمینال کارکنان فرودگاه خروج/به فرودگاه تجربه غذا، نوشیدنی، و خرده‌فروشی ورود/از تجربه فرودگاه یک نکته مهم از مطالعه 2026: بازسازی فرودگاه نتیجه می‌دهد. بالاترین رتبه فرودگاه ها در سال 2026 یا به تازگی تکمیل شده اند یا تقریباً با پروژه های بهبود سرمایه به پایان رسیده اند. اگرچه این تغییرات ممکن است بیش از 1 میلیارد دلار هزینه داشته باشد و چندین سال طول بکشد، اما نتایج به"}, {"source": "Business Insider", "title": "Jensen Huang said China isn’t spending time debating the AI apocalypse. We are, the Chinese internet says.", "link": "https://www.businessinsider.com/jensen-huang-china-ai-doom-weibo-disagrees-nvidia-2026-9", "summary": "Jensen Huang said China isn t talking about AI doom. The Chinese internet disagrees. Bloomberg/Getty Images Nvidia CEO Jensen Huang said China isn't talking about AI doom in the same way as the West. Huang's comments became a trending topic on Weibo, the Chinese version of X. Chinese internet users had plenty to say about that. Jensen Huang 's latest comments on China's approach to artificial intelligence are stirring debate on Chinese social media. Speaking onstage at the All-In Summit in Los Angeles on Monday, Huang said that people in China don't talk about AI doom in the same way as people in the West. \"The narrative is much more practical. Nobody in China is saying that there's end of this, and end of that, and cataclysmic this, and doomer that,\" Huang said during the conversation with David Sacks. The Nvidia CEO said he saw no purpose in engaging in this kind of apocalyptic talk. \"We're making it up. The part that is frustrating is if it was true, then we ought to talk about it and go do something about it,\" Huang said, instead of \"worrying a bunch of people who can't do anything about it.\" On Weibo, China's version of X, internet users pushed back on Huang's characterization. The message: the AI doom debate is alive, and red hot out here. Weibo users have thoughts on AI doom The Nvidia chief's words drew mixed responses under the hashtag \"Jensen Huang says no one in China is talking about the AI apocalypse,\" which was viewed more than 14 million times at press time. \"To say Chinese people don't talk about an AI apocalypse is simply untrue,\" a tech commentator in Beijing wrote on Weibo. \"Refraining from always defaulting to doomsday scenarios doesn't mean we neglect safety research to prevent that from happening. Prioritizing practical applications doesn't mean we aren't afraid of what happens if we skip rigorous safety validation.\" \"China is not a monolith,\" another Weibo user from Beijing wrote. \"The impact of AI on human life is something that demands thorough reflection and discussion. Dialogue on whether we're heading toward an apocalypse or not is happening, and must continue to happen.\" Some users said they, too, were concerned about the laws governing AI superintelligence, with one user from Jiangsu writing that \"regulation is urgently needed.\" Others agreed with Huang that AI doomerism has received less attention in China, but said that was because the country's tech sector is focused on keeping pace with the West. \"Chinese people recognize ", "date_str": "2026-09-16T10:32:00+00:00", "hash": "9590a6e94d03fc2a", "title_fa": "جنسن هوانگ گفت چین وقت خود را صرف بحث در مورد آخرالزمان هوش مصنوعی نمی کند. اینترنت چینی می گوید ما هستیم.", "summary_fa": "جنسن هوانگ گفت چین درباره نابودی هوش مصنوعی صحبت نمی کند. اینترنت چینی مخالف است. جنسن هوانگ، مدیرعامل انویدیا بلومبرگ/ گتی ایماژ گفت که چین مانند غرب درباره نابودی هوش مصنوعی صحبت نمی کند. نظرات هوانگ به موضوعی پرطرفدار در Weibo تبدیل شد، نسخه چینی X. کاربران اینترنت چینی در این مورد حرف های زیادی برای گفتن داشتند. آخرین اظهارات جنسن هوانگ در مورد رویکرد چین به هوش مصنوعی بحث‌هایی را در رسانه‌های اجتماعی چین برانگیخته است. هوانگ روز دوشنبه در اجلاس All-In در لس آنجلس روی صحنه صحبت کرد و گفت که مردم در چین مانند مردم در غرب درباره نابودی هوش مصنوعی صحبت نمی کنند. هوانگ در گفتگو با دیوید ساکس گفت: \"روایت بسیار عملی تر است. هیچ کس در چین نمی گوید که پایان این، و پایان آن، و این فاجعه آمیز و نابود کننده آن وجود دارد.\" مدیرعامل انویدیا گفت که هدفی از شرکت در این نوع گفتگوهای آخرالزمانی نمی بیند. \"ما داریم درستش می کنیم. قسمتی که ناامیدکننده است این است که اگر درست بود، پس باید در مورد آن صحبت کنیم و کاری در مورد آن انجام دهیم، به جای اینکه «نگران یکسری از مردمی باشیم که نمی توانند کاری در مورد آن انجام دهند.» در Weibo، نسخه چینی X، کاربران اینترنت از شخصیت هوانگ عقب نشینی کردند. پیام: بحث عذاب هوش مصنوعی در اینجا زنده است و داغ داغ است. کاربران Weibo درباره نابودی هوش مصنوعی فکر می‌کنند سخنان رئیس انویدیا با هشتگ «جنسن هوانگ می‌گوید هیچ‌کس در چین درباره آخرالزمان هوش مصنوعی صحبت نمی‌کند» واکنش‌های متفاوتی را به دنبال داشت، که در زمان انتشار بیش از 14 میلیون بار مشاهده شد. یک مفسر فناوری در پکن در Weibo نوشت: «اینکه بگوییم مردم چین در مورد آخرالزمان هوش مصنوعی صحبت نمی کنند، به سادگی نادرست است. \"خودداری از عدم اجرای سناریوهای روز قیامت"}, {"source": "Business Insider", "title": "Canada's latest play in its trade fight with the US: It might join the EU as an 'associate' member", "link": "https://www.businessinsider.com/eu-canada-associate-member-trump-carney-trade-war-tariffs-2026-9", "summary": "Canadian Prime Minister Mark Carney is seeking closer ties with Europe. VALERIE MACON / AFP via Getty Images The European Union could welcome Canada as its first \"associate\" member, its leader said Wednesday. It comes as Canada seeks to strengthen its non-US relationships amid a trade fight with Trump. Canada-US trade talks collapsed last month, prompting tariffs from both sides of the border. Canada could become the European Union's first \"associate member\" as it looks to strengthen its international relationships amid escalating trade tensions with the US and President Donald Trump. European Commission President Ursula von der Leyen said Wednesday that she wanted to \"open the door\" to the new arrangement, which is not currently defined in EU treaties. \"In short, we want to bring the relationship with Canada to the highest level possible,\" von der Leyen said at the EU's State of the Union address. The proposal would deepen cooperation on manufacturing, AI, critical minerals, energy, defense, and Arctic policy. Canadian Prime Minister Mark Carney has sought closer ties with Europe after US-Canada trade talks collapsed last month, prompting retaliatory tariffs. Canada is not seeking full EU membership. Canada and the EU already have a trade agreement, but the proposed associate-member status would signal a deeper political and strategic partnership. Von der Leyen did not spell out exactly what rights or obligations an associate member would have, and creating the status could require legal and political work within the EU. An EU spokesperson told Business Insider that Brussels would work with member states and the European Parliament to create a new form of partnership, \"building the closest imaginable form of association with a partner outside Europe.\" The EU said the arrangement could move the relationship beyond CETA, its existing trade deal with Canada, toward an \"Alliance for the Future\" focused on economic security and prosperity. It could also include a tech alliance, closer defense-industry ties, cooperation in the Arctic, and work on energy, critical minerals, batteries, AI, quantum technology, cybersecurity, and economic security. The spokesperson said the EU-Canada summit at the end of October would be the first \"meaningful opportunity\" to discuss the plans further. But the proposal remains at an early stage, and the EU has not said what specific rights or obligations associate membership would entail. Dear @MarkJCarney we want to bring the relat", "date_str": "2026-09-16T10:18:34+00:00", "hash": "d90646b9ac3188e4", "title_fa": "آخرین بازی کانادا در مبارزه تجاری با ایالات متحده: ممکن است به عنوان یک عضو وابسته به اتحادیه اروپا بپیوندد", "summary_fa": "مارک کارنی نخست وزیر کانادا به دنبال روابط نزدیک تر با اروپا است. والری مکون/ خبرگزاری فرانسه از طریق گتی ایماژ رهبر اتحادیه اروپا روز چهارشنبه گفت که اتحادیه اروپا می تواند از کانادا به عنوان اولین عضو \"همکار\" خود استقبال کند. این در حالی است که کانادا به دنبال تقویت روابط غیر آمریکایی خود در بحبوحه جنگ تجاری با ترامپ است. مذاکرات تجاری کانادا و آمریکا در ماه گذشته به شکست انجامید و باعث اعمال تعرفه ها از دو طرف مرز شد. کانادا می تواند به اولین \"عضو وابسته\" اتحادیه اروپا تبدیل شود زیرا به دنبال تقویت روابط بین المللی خود در بحبوحه تشدید تنش های تجاری با ایالات متحده و رئیس جمهور دونالد ترامپ است. اورسولا فون در لاین، رئیس کمیسیون اروپا روز چهارشنبه گفت که می‌خواهد «درها» را به روی ترتیبات جدید، که در حال حاضر در معاهدات اتحادیه اروپا تعریف نشده است، باز کند. فون در لاین در سخنرانی اتحادیه اروپا گفت: به طور خلاصه، ما می خواهیم روابط با کانادا را به بالاترین سطح ممکن برسانیم. این پیشنهاد همکاری در زمینه تولید، هوش مصنوعی، مواد معدنی حیاتی، انرژی، دفاع و سیاست قطب شمال را تعمیق خواهد بخشید. مارک کارنی، نخست‌وزیر کانادا، پس از شکست مذاکرات تجاری آمریکا و کانادا در ماه گذشته که منجر به اعمال تعرفه‌های متقابل شد، به دنبال روابط نزدیک‌تر با اروپا است. کانادا به دنبال عضویت کامل در اتحادیه اروپا نیست. کانادا و اتحادیه اروپا در حال حاضر یک توافق تجاری دارند، اما وضعیت پیشنهادی عضو دستیار نشان دهنده یک مشارکت سیاسی و استراتژیک عمیق تر است. فون در لاین دقیقاً مشخص نکرد که یک عضو وابسته چه حقوق یا تعهداتی خواهد داشت و ایجاد این وضعیت می‌تواند نیازمند کار حقوقی و سیاسی در اتحادیه اروپا باشد. یکی از سخنگویان اتحادیه اروپا به Business Insider گفت که بروکسل با کشورهای عضو"}, {"source": "Business Insider", "title": "Researchers explain why you shouldn't freak out about AI unleashing a killer virus", "link": "https://www.businessinsider.com/researchers-ai-apocalypse-skepticism-lethal-virus-real-world-barriers-2026-9", "summary": "There are fears that AI could create a lethal virus, but not all biologists are convinced. Wodicka/ullstein bild via Getty Images Warnings of an AI apocalypse have spread like wildfire since an Anthropic researcher quit last week. Jacob Coxon said OpenAI and Anthropic were \"gambling with our lives\" in the global AI race. Researchers say physical barriers make the bleakest outcomes, like a killer virus, less likely. Worried about an AI apocalypse? Some researchers say one of the most extreme versions of that scenario is overblown. The debate has reached a fever pitch in the week since Jacob Coxon, a 27-year-old researcher, quit Anthropic and warned that it and his other former employer, OpenAI, were \" gambling with our lives \" as they raced toward self-improving superintelligence. Evan Hubinger, who leads Anthropic's alignment stress-testing team, backed Coxon, saying he personally believes there is a greater-than-10% chance AI could kill all humans within the next decade. But other researchers have pointed to the gap between what AI could do in the digital world and what it would require to cause real-world harm. They gave the example of a lethal biological virus created by AI, one of the darkest scenarios that was also cited as a reason to pace AI development by Anthropic CEO Dario Amodei in an essay this month . AI could design the virus on a computer, but it would be limited by its inability to manufacture it in the real world, the researchers said. Anselm Levskaya, a staff research engineer at Google who says he has built DNA synthesizers and engineered viruses, wrote on X on Monday that a viral sequence would still have to be physically assembled in a lab and would require a system capable of producing virus particles. It would then require extensive selection and testing to determine whether it can replicate, spread, evade immune defenses, and remain dangerous — properties Levskaya said depend on complex biological processes that he said cannot simply be designed from a computer. Anthropic CEO Dario Amodei has warned about the risks of a biological weapon created by AI. Bloomberg/Getty Images Eric Xing, the president of Mohamed bin Zayed University of AI and a computer-science professor at Carnegie Mellon University, put it more simply: generating a virus blueprint and producing a real virus are \"completely different things.\" The gap is in \"the material, the manufacturing, and actual biological viability,\" he wrote on X on Monday. Treating the two as", "date_str": "2026-09-16T10:15:08+00:00", "hash": "09fb5cdefb32aac5", "title_fa": "محققان توضیح می دهند که چرا نباید از انتشار یک ویروس قاتل توسط هوش مصنوعی ترسید", "summary_fa": "این نگرانی وجود دارد که هوش مصنوعی بتواند یک ویروس کشنده ایجاد کند، اما همه زیست شناسان متقاعد نشده اند. Wodicka/ullstein bild از طریق Getty Images هشدارها درباره آخرالزمان هوش مصنوعی از زمانی که یک محقق Anthropic هفته گذشته ترک کرد، مانند آتش سوزی گسترده شده است. جیکوب کوکسون گفت OpenAI و Anthropic در مسابقه جهانی هوش مصنوعی \"با زندگی ما قمار می کنند\". محققان می گویند موانع فیزیکی باعث می شود تا بدترین نتایج، مانند یک ویروس قاتل، کمتر شود. نگران آخرالزمان هوش مصنوعی هستید؟ برخی از محققان می گویند یکی از افراطی ترین نسخه های آن سناریو بیش از حد است. این بحث در یک هفته از زمانی که جیکوب کوکسون، محقق 27 ساله، آنتروپیک را ترک کرد و هشدار داد که آنتروپیک و دیگر کارفرمای سابقش، OpenAI، \"با زندگی ما قمار\" می کنند، به اوج خود رسیده است. ایوان هابینگر، که تیم تست استرس آنتروپیک را رهبری می‌کند، از کوکسون حمایت کرد و گفت که او شخصاً معتقد است که هوش مصنوعی بیش از 10 درصد احتمال دارد که همه انسان‌ها را در یک دهه آینده بکشد. اما محققان دیگر به شکاف بین کارهایی که هوش مصنوعی می‌تواند در دنیای دیجیتال انجام دهد و آنچه که برای آسیب رساندن به دنیای واقعی نیاز دارد، اشاره کرده‌اند. آنها مثالی از یک ویروس بیولوژیکی کشنده ایجاد شده توسط هوش مصنوعی را ارائه کردند، یکی از تاریک ترین سناریوها که همچنین توسط Dario Amodei، مدیر عامل Anthropic، در مقاله ای در این ماه به عنوان دلیلی برای سرعت بخشیدن به توسعه هوش مصنوعی ذکر شد. به گفته محققان، هوش مصنوعی می‌تواند ویروس را بر روی رایانه طراحی کند، اما به دلیل ناتوانی در ساخت آن در دنیای واقعی محدود می‌شود. Anselm Levskaya، مهندس تحقیقات کارکنان گوگل که می‌گوید سنتزکننده‌های DNA و ویروس‌های مهندسی کرده است، در روز دوشنبه در X"}, {"source": "Business Insider", "title": "My sister and I are 10 years apart and used to hate each other. Our dynamic has totally changed over the years.", "link": "https://www.businessinsider.com/sibling-age-gap-relationship-dynamic-2026-9", "summary": "The author and her sister have gotten much closer over the years. Courtesy of Hayley Folk For a while, I thought I'd be an only child, and I was fine with that. Then, when I was 10, my parents told me I'd soon be a big sister. My sister and I didn't get along when we were young, but our dynamic has changed over the years. When I think of my childhood, I often think of one thing: being an only child . I see myself as a blonde, curly-haired toddler who played alone with her toys. A girl who seemingly got all the attention from her parents and her family, and never, ever had to share. I never thought I'd have siblings — especially because my parents weren't even together (yes, it's complicated) and I was already 10 — until one day, when I was sat down to be told, \"Hayley, you're going to be a big sister.\" The only problem? My little sister Hanna and I came to hate each other. Our age gap caused friction and made it hard to relate No, I'm not being dramatic. She'd agree we did, too. I'm not sure whether our mutual hatred stemmed from our 10-year age gap, the loss of my 'only child' status, or the fact that we'd often antagonize each other for no reason, as children often do, but I'd argue it was a combination of all of the above. Although research shows that large age gaps of 4+ years between siblings are becoming more common than ever, nearly 20 years ago, it wasn't quite the same. It's fair to say that we both felt out of place, freakish for not relating to each other, and lost in our own stages of life. Me: going through early stages of awkward puberty, braces, unsure if I liked boys and girls, and braving middle school. Her: a baby then outgrowing diapers, crawling into a toddler, and screaming at the top of her lungs when she didn't get what she wanted. As we grew older, we were still misaligned in our chapters. I was experiencing my first kiss, going to my senior prom, and heading off to college, while she was just turning the age I was when she was born. We fought often and unnecessarily. It didn't help that I felt the need to mother her, since our mother was struggling with addiction and ended up not being around at all. While research shows that larger sibling age gaps often lead to less intense rivalry and fewer daily conflicts , because children occupy different social and school stages, it seemed our differences just made us clash even more. Until, surprisingly to us, the last few years. The author and her sister recently took a trip together and w", "date_str": "2026-09-16T10:06:01+00:00", "hash": "2665f34e709e3fba", "title_fa": "من و خواهرم 10 سال اختلاف داریم و از هم متنفر بودیم. پویایی ما در طول سالها کاملاً تغییر کرده است.", "summary_fa": "نویسنده و خواهرش در طول سال ها بسیار به هم نزدیک شده اند. با حسن نیت از Hayley Folk برای مدتی فکر می کردم تک فرزند خواهم شد و با این کار خوب بودم. سپس، وقتی 10 ساله بودم، والدینم به من گفتند که به زودی خواهر بزرگتر خواهم شد. من و خواهرم در جوانی با هم خوب نبودیم، اما پویایی ما در طول سال ها تغییر کرده است. وقتی به کودکی ام فکر می کنم، اغلب به یک چیز فکر می کنم: تک فرزند بودن. من خودم را یک کودک نوپا بلوند و مو مجعد می بینم که تنها با اسباب بازی هایش بازی می کند. دختری که ظاهراً تمام توجه والدین و خانواده اش را به خود جلب کرده بود و هرگز و هرگز مجبور به اشتراک گذاری آن نشد. هرگز فکر نمی‌کردم خواهر و برادر داشته باشم - مخصوصاً به این دلیل که والدینم حتی با هم نبودند (بله، پیچیده است) و من قبلاً 10 ساله بودم - تا اینکه یک روز به من گفتند: \"هیلی، تو یک خواهر بزرگ خواهی شد.\" تنها مشکل؟ من و خواهر کوچکم حنا از هم متنفریم. فاصله سنی ما باعث ایجاد اصطکاک شد و برقراری ارتباط را سخت کرد نه، من دراماتیک نیستم. او موافق است که ما هم همینطور. من مطمئن نیستم که تنفر متقابل ما ناشی از فاصله سنی 10 ساله ما، از دست دادن موقعیت \"تک فرزند\" من، یا این واقعیت است که ما اغلب بدون هیچ دلیلی با یکدیگر دشمنی می کردیم، همانطور که اغلب کودکان انجام می دهند، اما من استدلال می کنم که این ترکیبی از همه موارد بالا بود. اگرچه تحقیقات نشان می دهد که فاصله های سنی بالای 4 سال بین خواهر و برادرها بیش از هر زمان دیگری رایج شده است، تقریباً 20 سال پیش، کاملاً یکسان نبود. منصفانه است که بگوییم"}, {"source": "Business Insider", "title": "Great news for sneaky people: iOS 27 lets you secretly hide your location sharing", "link": "https://www.businessinsider.com/ios-27-iphone-location-sharing-hide-my-location-2026-9", "summary": "Apple s location-sharing feature in iOS 27 now lets you hide your location sharing. Katie Notopoulos Now you can temporarily \"Hide My Location\" on iPhones instead of fully revoking a contact's permission. The other person won't be alerted; it just looks like your phone is off or in bad cell service. This is great for planning a surprise party, or…. lots of other stuff. Apple's new privacy feature is sure to be welcome news for anyone up to sneaky things. The iPhone's new iOS 27 update has a new feature that allows you to temporarily hide your location from someone you're sharing it with — without sending them an alert. Previously, if you stopped sharing your location, that person would get a little gray update in the iMessage chain you had with them (this wouldn't be delivered like a new text, but it would be noticeable if they looked at your text exchange). Just tap that \"Hide My Location\" button When you click into someone s name in your contacts who you are currently location sharing with, you can hit Hide My Location . Katie Notopoulos / Business Insider Now, if you hit \"Hide location\" for a specific person, it won't send that notification anymore. Instead, they'd only notice if they specifically went to find you on their map or in Find My. And then, it would simply say \"No location found\" and \"Off-Network\" — as if your phone was turned off or you were in an area with no cell service. This is what it looks like when someone has hidden their location from you: It just looks like your phone is off or out of network when you do Hide location. Katie Notopoulos / Business Insider Previously, people would get alerted if you stopped sharing: Previously, you stop location sharing, the other person will see an alert that you did so. Katie Notopoulos / Business Insider Apple's announcement says that this feature is great for things like planning a surprise party for someone. Sure! Yes, that's exactly what I was thinking of. There are, of course, plenty of good and above-board reasons you might want to temporarily hide your location. When discussing this with my editor, he recalled how he had physically turned off his phone while running a proposal-related errand — instead of ending location-sharing with his girlfriend (now fiancée) — so as not to ruin the surprise. Revoking location-sharing isn't always so simple There's a divide between Gen Z and older people where location sharing is much more normalized among the youths (if you're horrified by the idea of sha", "date_str": "2026-09-16T09:57:01+00:00", "hash": "6a33323e1d660f02", "title_fa": "خبر عالی برای افراد زیرک: iOS 27 به شما امکان می دهد مخفیانه اشتراک گذاری موقعیت مکانی خود را پنهان کنید", "summary_fa": "ویژگی اشتراک‌گذاری موقعیت مکانی اپل در iOS 27 اکنون به شما امکان می‌دهد اشتراک‌گذاری موقعیت مکانی خود را پنهان کنید. کتی نوتوپولوس اکنون می‌توانید به‌جای لغو کامل مجوز یک مخاطب، به‌طور موقت «موقعیت مکانی من» را در آیفون‌ها پنهان کنید. به شخص دیگر هشدار داده نمی شود. فقط به نظر می رسد تلفن شما خاموش است یا در سرویس تلفن همراه بد است. این برای برنامه ریزی یک مهمانی غافلگیرکننده عالی است، یا…. خیلی چیزای دیگه ویژگی جدید حریم خصوصی اپل مطمئناً خبر خوشایندی برای هر کسی خواهد بود که به چیزهای دزدکی مشغول است. به‌روزرسانی جدید iOS 27 آیفون دارای ویژگی جدیدی است که به شما امکان می‌دهد مکان خود را به rt of 2026 was for two rate cuts throughout the year. That then flipped to two hikes . Yet the Fed went eight months without a move — until now (apparently). A hike that looks this close to certain might suggest a boring Fed meeting. Not so fast. Beyond the expected decision, there are three important storylines that will hinge on messaging from the Fed and its new chair, Kevin Warsh . 1. The Fed puts stocks to the test The recent surge in the 10-year yield has made the stock market's valuation problem harder to ignore. For years, the case for owning stocks — particularly the expensive ones leading the market — rested partly on a lack of alternatives. With bond yields on the rise, that argument is getting harder to make. The chart below shows that the equity-risk premium, or the difference between the S P 500 's earnings yield and the 10-year Treasury yield, is the lowest since 2002. Put in plainer English: the returns offered by safe-haven Treasurys are looking increasingly appealing, relative to riskier stocks. The question for investors is whether today's hike is a one-time deal, or the first of several. The dot plot and Warsh's press conference will be crucial. If officials signal further increases are likely, stocks could face more pressure than if they portray today's move as a one-off. With the equity-risk premium where it is, stocks have little room for error. 2. A Fed independence test A rate hike is also likely to set up a political confrontation. President Trump hasn't been shy about his preference for lower borrowing costs, and will likely express his displeasure again if the Fed raises rates. The pressure is already public. This past Sunday, Trump reiterated his view that t", "date_str": "2026-09-16T09:50:02+00:00", "hash": "0a5749b579ea577a", "title_fa": "افزایش نرخ بهره فدرال رزرو امروز سرفصل اخبار را به خود اختصاص خواهد داد، اما این 3 داستان سرنخ های بزرگتری برای سرمایه گذاران دارند.", "summary_fa": "روبرتو اشمیت/گتی ایماژ افزایش نرخ بهره فدرال رزرو هیچ کس را شگفت زده نخواهد کرد. اما بازدهی 5 درصدی خزانه داری زندگی سهام را سخت می کند. کوین وارش باید ترس از تورم، انتظارات بازار و فشار کاخ سفید را متعادل کند، در حالی که نفت همچنان یک کارت وحشی است. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. بالاخره زمان آن فرا رسیده است که فدرال رزرو نرخ بهره را تعدیل کند - یا اینطور که بازار می گوید. زمانی که بانک مرکزی تصمیم خود را در ساعت 2 بعد از ظهر اعلام می کند، سرمایه گذاران با احتمال بیش از 90 درصد افزایش یک چهارم واحدی قیمت گذاری می کنند. ET. در همین حال، بازدهی 10 ساله خزانه داری به بالای 5 درصد رسیده است، بالاترین سطح خود از سال 2007 - یادآور این است که بازار اوراق قرضه منتظر فدرال رزرو نیست تا وام را گرانتر کند. راه طولانی و پر پیچ و خم بود. انتظار در آغاز سال 2026 دو کاهش نرخ در طول سال بود. سپس به دو صعود تبدیل شد. با این حال، فدرال رزرو هشت ماه بدون حرکت - تا به حال (ظاهرا) - سپری کرد. افزایشی که تا این حد قطعی به نظر می رسد ممکن است نشان دهنده یک جلسه خسته کننده فدرال رزرو باشد. خیلی سریع نیست فراتر از تصمیم مورد انتظار، سه خط داستانی مهم وجود دارد که به پیام‌های فدرال رزرو و رئیس جدید آن، کوین وارش، بستگی دارد. 1. فدرال رزرو سهام را در معرض آزمایش قرار می دهد افزایش اخیر در بازدهی 10 ساله، نادیده گرفتن مشکل ارزش گذاری بازار سهام را دشوارتر کرده است. برای سال‌ها، مالکیت سهام - به‌ویژه سهام‌های گران‌قیمت که در بازار پیشروی می‌کنند - تا حدی به فقدان جایگزین‌ها بستگی داشت. با افزایش بازده اوراق قرضه، ارائه این"}, {"source": "Business Insider", "title": "Seeking nominations for the most influential tech recruiters", "link": "https://www.businessinsider.com/nominations-influential-tech-recruiter-list-2026-9", "summary": "Morsa Images/Getty Images Business Insider is putting together a list of the top tech recruiters. We want to know which headhunters are most essential for getting a coveted tech job. Submit your nominations below by October 9. The AI race has created hyper demand for a select group of workers. Companies are clamoring for the top tech talent , offering staggering paychecks,
