rnstile the first band ever nominated across the rock, alternative and metal fields in a single ceremony — and converted two of them, winning best rock album alongside Birds. In August, Turnstile followed up with Never Enough: Versions , a reimagined edition of the album featuring contributions from Elton John , Hayley Williams , Slayyyter , Julien Baker , Four Tet , Blood Orange , Faye Webster and Alex G , among others. Johnson’s turn, which featured a surprise cameo from Taylor Swift, marked her third time hosting the show and arrived a day after the theatrical release of her new film Verity . Turnstile followed season 52 premiere guest KATSEYE , with Rosalía set to perform alongside host Shane Gillis on Oct. 10 and Gracie Abrams booked for Oct. 31 with host Inde Navarrette. Turnstile’s tour resumes Monday (Oct. 5) in Oklahoma City, followed by stops in Lawrence, Kan.; St. Louis; Ventura, Calif.; and Las Vegas before the run wraps Oct. 18 in Santa Ana, Calif.", "date_str": "2026-10-04T08:07:13+00:00", "hash": "85474576e292a5ef", "title_fa": "Turnstile اولین \"SNL\" انفجاری را با \"Birds\" و \"Never Enough\" Medley آغاز کرد.", "summary_fa": "Turnstile اولین بازی Saturday Night Live خود را در روز شنبه (4 اکتبر) انجام داد و سه آهنگ از آلبوم برنده گرمی Never Enough خود را در قسمت میزبان داکوتا جانسون اجرا کرد. گروه هاردکور بالتیمور - که شب بعد از یک مجموعه در Austin City Limits ظاهر شد - با Birds افتتاح شد که برنده بهترین اجرای متال در شصت و هشتمین دوره جوایز سالانه گرمی در فوریه شد. بعداً در نمایش، این پنج قطعه برای ترکیبی از I Care و Dull بازگشت. این پست را در اینستاگرام مشاهده کنید ظاهر نقطه عطفی برای گروه و ژانر آن بود: Turnstile اولین بازی هاردکور است که در SNL از زمان ظاهر پر هرج و مرج معروف Fear در سال 1981 اجرا شد. داکوتا جانسون، مجری برنامه، اوایل هفته در یک تبلیغی از این رزرو کنایه زده بود و به شوخی گفت که آماده است دیوار مرگ را برای گروه راه بیندازد. Never Enough که در ژوئن 2025 منتشر شد، چهارمین آلبوم Turnstile و ادامه موفقیت آنها در سال 2021 Glow On است. این آهنگ اولین بار در 10 آلبوم برتر بیلبورد 200 قرار گرفت و در صدر جدول آلبوم های برتر هارد راک قرار گرفت، در حالی که آهنگ عنوان آن اولین شماره 1 گروه در جدول پخش جایگزین بیلبورد شد. این رکورد پنج نامزدی جایزه گرمی را برای گروه به ارمغان آورد - Turnstile را به اولین گروهی تبدیل کرد که در یک مراسم واحد در رشته‌های راک، آلترناتیو و متال نامزد شد - و دو نفر از آنها را تبدیل کرد و برنده بهترین آلبوم راک در کنار پرندگان شد. در آگوست، Turnstile با Never Enough: Versions، نسخه‌ای بازسازی‌شده از آلبوم که شامل مشارکت‌های التون جان، هیلی ویلیامز، اسلایتر، جولین بیکر، فور تت، بلود اورنج، فی وبستر و الکس جی و دیگران بود، ادامه داد. نوبت جانسون، که"}, {"source": "Billboard", "title": "Polaris on Honoring Ryan Siew With ‘Without You’ & Their Good Things Return", "link": "https://www.billboard.com/music/rock/polaris-ryan-siew-good-things-festival-1236343902/", "summary": "Polaris first new song in three years confronts a question that has followed the Australian metalcore band since guitarist Ryan Siew s death in 2023: How do they make music together without him? Released Sept. 3, Without You is the band s first new music made after Siew s death — and a marked contrast to 2023 s Fatalism , the final album the four remaining members recorded with him, which arrived just months after he died. Speaking with Billboard of the release and ahead of their appearance at Australia s Good Things Festival, Rick Schneider said the band wanted its first step forward to acknowledge both Siew s place in Polaris and the impossibility of filling it. He is kind of, in many ways, irreplaceable, Schneider said. There is no quick and easy fix to get someone in there to replace what his significance was. The years since his death, Schneider said, had given the band time to acknowledge and contextualize the significance that he had on us as not only a bandmate but also a friend. For drummer Daniel Furnari, putting the track into the world has been bittersweet and cathartic. He said the members had spent years thinking about what their first new release would need to convey, knowing one song could not contain the full experience of their loss. How do you say enough? he asked. How do you convey that loss and that pain and that grief and the weight of it all in the right way? It s really us just beginning to learn how to speak about this, both publicly and through our music, Furnari said. He also described a sense of pride in the band s survival. There s a sadness, and there s also a real pride in the fact that we can look at each other and say, like, we re still here, we re still standing as a band, he said. We might not look the same, we re missing somebody really important, but we still know who we are as artists. Whether Polaris would continue was never the central question, Furnari said. This band is something we ve kind of committed our lives to and committed our hearts to, he said. I don t think there s a part of any of us that ever would have let this go. The uncertainty lay in how to care for themselves, honor that history and make space for a future. Not if, but how and when. That resolve was tested almost immediately, as the band went ahead with the Fatalism tour after Siew s death. Schneider said the members gave themselves space, then checked whether everyone felt comfortable returning to the stage. They all said yes. If we were to put t", "date_str": "2026-10-04T06:46:11+00:00", "hash": "d1968ce816b865bd", "title_fa": "Polaris در مورد تجلیل از رایان سیو با \"Without You\" و بازگشت چیزهای خوب آنها", "summary_fa": "اولین آهنگ جدید پولاریس در سه سال اخیر با سوالی مواجه است که گروه متالکور استرالیایی را از زمان مرگ گیتاریست رایان سیو در سال 2023 دنبال می کند: چگونه بدون او با هم موسیقی می سازند؟ بدون تو که در 3 سپتامبر منتشر شد، اولین موسیقی جدید گروه است که پس از مرگ سیو ساخته شد - و تضاد قابل توجهی با Fatalism در سال 2023، آخرین آلبومی است که چهار عضو باقیمانده با او ضبط کردند و تنها چند ماه پس از مرگ او وارد شد. ریک اشنایدر در صحبت با بیلبورد در مورد انتشار و قبل از حضور آنها در جشنواره چیزهای خوب استرالیا، گفت که گروه می‌خواهد اولین قدم رو به جلو برای تصدیق جایگاه Siew در Polaris و عدم امکان پر کردن آن باشد. اشنایدر گفت که او از بسیاری جهات غیرقابل جایگزین است. هیچ راه حل سریع و آسانی وجود ندارد که بتوان کسی را به جای آن چیزی که اهمیتش داشت وارد کرد. اشنایدر می‌گوید سال‌های پس از مرگ او، به گروه زمان داده بود تا اهمیتی را که او برای ما نه تنها به‌عنوان یک هم‌گروه، بلکه به‌عنوان یک دوست نیز داشت، تصدیق کند و زمینه‌سازی آن را در نظر بگیرد. برای درامر دانیل فورناری، قرار دادن آهنگ در جهان تلخ و شیرین بوده است. او گفت که اعضا سال‌ها به این فکر کرده‌اند که اولین نسخه جدیدشان باید چه چیزی را منتقل کند، زیرا می‌دانستند که یک آهنگ نمی‌تواند شامل تجربه کامل از دست دادن آنها باشد. چگونه می گویید کافی است؟ او پرسید. چگونه آن فقدان و آن درد و آن غم و سنگینی آن را به درستی منتقل می کنید؟ فرناری گفت: واقعاً ما تازه شروع به یادگیری نحوه صحبت در مورد این موضوع، هم به صورت عمومی و هم از طریق موسیقی خود کرده ایم. او همچنین احساس"}, {"source": "Billboard", "title": "Taylor Swift Makes Surprise ‘SNL’ Cameo in Dakota Johnson’s Monologue", "link": "https://www.billboard.com/culture/tv-film/taylor-swift-dakota-johnson-snl-monologue-1236353893/", "summary": "Taylor Swift made a surprise appearance on Saturday Night Live this weekend, crashing host Dakota Johnson s opening monologue. Johnson, hosting for the third time on the eve of her birthday (Oct. 4), spent much of the monologue joking about her history of dating musicians, saying she has supportive friends who don t judge me for dating these men. She then introduced my literal therapist — cuing Swift, who walked on to correct her. I m not your therapist, actually, Swift said. You just show up once a week at my house with an empty bottle of wine and ask if I want some. She continued: You flop on my couch and overshare, and every so often I just say, Damn, that s crazy.' The bit ended with Swift noting she sends Johnson home with a Pedialyte and a security escort. The monologue also wor f McCartney s idea for a live wedding-day collab with Swift, and then wrapped the interview. Wedding attendees have mostly remained tight-lipped about any specifics from the ceremony and reception, including the bride and groom, who ve not shared a single wedding portrait. Swift s close friend (and Patient Zero music video co-star) Dakota Johnson recently gave a simple answer no when asked whether she thought any photos would ever come out from the day. She s surprising, isn t she? said BBC Radio 1 s Greg James, who was interviewing Johnson (and who was also a guest at the wedding, after Swift invited him during her last interview with him). She is. Sneaky girl, Johnson replied. Kelce did share some comments about the wedding on his New Heights podcast with brother Jason last month, saying it was a night out we’ll never forget. Kelce shared, Me and Taylor are so thankful for everybody that showed up, from the vows to just seeing everyone, to how much fun we had, throughout the entire evening, and hearing that kind of be relayed through everybody’", "date_str": "2026-10-03T23:55:36+00:00", "hash": "03a7ba2f4c7481e5", "title_fa": "چگونه پل مک کارتنی در مراسم عروسی تیلور سوئیفت مجروح شد", "summary_fa": "پل مک‌کارتنی که در مراسم عروسی تیلور سویفت و تراویس کلس I Want to Hold Your Hand را اجرا کرد، سه ماه پس از این رویداد جزئیاتی را از جمله نحوه حضورش روی صحنه به اشتراک گذاشته است. مرتبط همه آهنگ‌های جایزه تیلور سویفت، رتبه‌بندی شده (انتخاب کارکنان) تیلور سوئیفت طرفداران را در ساخت «بیمار صفر» در «ویدیوی گسترده» جدید جذب می‌کند چرا مدونا، رولینگ استونز و پل مک‌کارتنی می‌توانند اسب‌های تاریک گرمی باشند، گرچه مک‌کارتنی به‌زودی پس از مراسم عروسی شهر نیویورک، در شهر نیویورک مشهور شد. مدیسون اسکوئر گاردن، گروه بیتل آن را خود در اپیزود جمعه (2 اکتبر) جیمی کیمل لایو تایید کرد. آیا می‌دانستید که قرار است داخل آن بخوانید؟ کیمل پرسید و برای عموم مردمی که کنجکاوی آنها در مورد عروسی هنوز پابرجاست، دریافت کرد. بله مک کارتنی گفت، او از من خواست که این کار را انجام دهم، و تأیید کرد که آهنگی که او خوانده، آهنگ کلاسیک بیتلز در سال 1964 می خواهم دستت را بگیرم باشد. این خواسته او بود؟ یا از شما خواسته که آهنگی را انتخاب کنید؟ سوال بعدی کیمل بود بله، بله، بله، مک کارتنی پاسخ داد، سپس اضافه کرد که امیدوار است سوئیفت به اجرا بپیوندد، زیرا او قبلاً روی صحنه بود. گفتم: باید با هم آواز بخوانی. شما باید برای مک کارتنی آواز بخوانید، سپس مکث کنید. مرد شما ظاهراً نام شوهر سوئیفت را برای لحظه‌ای فراموش کرده بود، پس از خنده سریع حضار و تکان دادن کیمل، برگشت و گفت: می‌دانم. تراویس به نظر می رسد توصیه معقولی است، کیمل از ایده مک کارتنی برای همکاری زنده در روز عروسی با سوئیفت کنایه زد و سپس مصاحبه را به پایان رساند. شرکت کنندگان در مراسم عروسی اغلب در مورد جزئیات مراسم و پذیرایی، از جمله عروس و داماد که حتی یک پرتره عروسی را به اشتراک"}, {"source": "Billboard", "title": "AC/DC Brings Out Foo Fighters’ Dave Grohl for ‘Highway to Hell’ at MetLife Show", "link": "https://www.billboard.com/music/rock/acdc-dave-grohl-highway-to-hell-metlife-stadium-1236353873/", "summary": "AC/DC welcomed a special guest onstage for the final show of their Power Up Tour. During their concert Friday (Oct. 2) at New Jersey’s MetLife Stadium, the iconic Australian rockers brought out Dave Grohl to join them for “Highway to Hell.” Related Foo Fighters Doubling Down on One-Night Only Opening Slot For AC/DC at Rescheduled MetLife Show Taylor Swift Takes Fans Inside the Making of Patient Zero in New Expanded Video Foo Fighters Hopping Off Headlining Tour to Fill In For Pretty Reckless at AC/DC s St. Louis Gig: This Is Literally a Dream Come True “Hey everybody, we got something to tell you. You better listen up close now. A very good friend of ours asked us today if he could come up and join us on the stage for ‘Highway for Hell.’ And we said, ‘Yes Dave, you can. David Grohl!” AC/DC’s Brian Johnson told the roaring audience as he hugged the Foo Fighters frontman. AC/DC’s show at MetLife was originally scheduled for Sept. 25, but a nor’easter storm forced the band to cancel the gig. Days later, the concert was rescheduled for Oct. 2, with Foo Fighters announced as the surprise opening act. During the Foos’ opening set Friday, Grohl told the New Jersey crowd about the important role AC/DC has played in his life and why he was thrilled to open for the band for a second time. “When I was 11 years old and I went to a midnight movie, and I saw the Let There Be Rock movie in the f—king movie theater, at 11 years old, I didn’t know that rock n’ roll could be like that. I didn’t know that rock n’ roll was sweat and blood and f—king tears and every ounce of energy you had,” Grohl told the crowd . He continued, “I saw that movie, I was 11 years old, I said, ‘I want to do that for the rest of my f—king life.’ So here we are… I’m going to live my childhood dream again, tonight.” Nearly a month earlier, Grohl and company opened for AC/DC in St. Louis on Sept. 8, stepping in for the tour’s scheduled opener, The Pretty Reckless, due to scheduling conflicts involving singer Taylor Momsen. Friday’s MetLife show marked the final date of AC/DC’s Power Up Tour in support of the band’s 2020 album, Power Up , which debuted at No. 1 on the Billboard 200. AC/DC has not announced additional dates beyond the Power Up Tour. At the end of their show, Johnson told the audience, “Good night, hope we’ll see you again.”", "date_str": "2026-10-03T20:08:34+00:00", "hash": "f33cc8744ab27e87", "title_fa": "AC/DC دیو گرول از Foo Fighters را برای «Highway to Hell» در MetLife Show بیرون آورد.", "summary_fa": "AC/DC از یک مهمان ویژه روی صحنه برای نمایش نهایی تور Power Up خود استقبال کرد. در جریان کنسرت آنها در روز جمعه (اکتبر. 2) در استادیوم MetLife نیوجرسی، راکرهای نمادین استرالیایی دیو گرول را بیرون آوردند تا در «بزرگراهی به جهنم» به آنها بپیوندد. Foo Fighters مرتبط با دو برابر شدن در شکاف افتتاحیه یک شبه برای AC/DC در نمایش مجدد MetLife تیلور سوئیفت طرفداران را وارد ساخت بیمار صفر در ویدیوی جدید توسعه یافته Foo Fighters می‌کند که از تور تیترال پرش می‌کنند تا در St LouisHeally Recket در AC/DC پر کنند. همه، ما چیزی برای گفتن به شما داریم. بهتره الان از نزدیک گوش کن امروز یکی از دوستان خوبمان از ما پرسید که آیا می تواند بالا بیاید و برای «بزرگراه برای جهنم» به ما بپیوندد. و ما گفتیم: «بله دیو، تو می توانی. دیوید گرول!» برایان جانسون از AC/DC در حالی که خواننده Foo Fighters را در آغوش گرفته بود، به تماشاگران خروشان گفت. نمایش AC/DC در MetLife در ابتدا برای 25 سپتامبر برنامه ریزی شده بود، اما یک طوفان نوری ایستر گروه را مجبور به لغو کنسرت کرد. چند روز بعد، کنسرت برای اکتبر موکول شد. 2، با Foo Fighters به ​​عنوان افتتاحیه غافلگیرکننده اعلام شد. در روز جمعه در جریان ست افتتاحیه Foos، گرول به جمعیت نیوجرسی درباره نقش مهمی که AC/DC در زندگی او ایفا کرده است و اینکه چرا برای دومین بار برای گروه باز می شود، هیجان زده بود. وقتی 11 ساله بودم و به یک فیلم نیمه شب رفتم، و فیلم Let There Be Rock را در سینمای f-king دیدم، در 11 سالگی نمی دانستم که راک اند رول می تواند اینطور باشد. گرول به جمعیت گفت، من نمی‌دانستم که راک اند رول عرق و خون است، اشک‌های شاه و هر ذره انرژی که شما دارید.» او ادامه داد:"}, {"source": "Billboard", "title": "Elton John Thanks Fans for ‘All the Love’ as He Bids Farewell to the Stage in Mexico: 5 Best Moments", "link": "https://www.billboard.com/lists/elton-john-farewell-tour-mexico-city-best-moments/", "summary": "Sir Elton John returned to the Estadio Banorte (formerly Estadio Azteca) on Friday (Oct. 2), 34 years after his debut at the iconic venue in Mexico City. The British legend reunited with his local fans for the first time in 14 years during the first of two shows that mark the conclusion of his Farewell Yellow Brick Road tour , which began in 2018. Related Elton John Finally Says Farewell to the Road With Mexico City Concerts Good evening, Mexico. I m so happy to be here tonight because I didn t come here on my Farewell Yellow Brick tour [before] because of COVID, said the 79-year-old pianist and songwriter to an audience of over 60,000 people (according to organizers), made up mostly of fans from the 60s, 70s and 80s generations. I wanted to do these last two shows to say thank you for all the love and support you ve given me for so long, added the star, wearing an elegant white suit and red glasses. It means so much to be here in Mexico City to play my final two shows, OK? Let s have a great time! Fans of the “Rocket Man” came to the affair in colorful outfits to celebrate each of the iconic eras that have made John one of the most important singer-songwriters in contemporary music. Sequined suits, multicolored glasses, colorful fur coats and platform shoes filled the venue, despite the rain that fell over the southern part of the city. The two-hour show featured a 24-song setlist, including classics like “Funeral for a Friend/Love Lies Bleeding,” “Bennie and the Jets,” “I Guess That s Why They Call It the Blues,” “The One,” “Philadelphia Freedom,” “Tiny Dancer,” “Honky Cat” and “Rocket Man,” the latter being one of the most anticipated by his fans. Elton John’s two performances at Estadio Banorte, the Mexican hub for the 2026 FIFA World Cup, represent a heartfelt celebration honoring both the artist and a city that has preserved his legacy and celebrated his music over the years. Below, the five best moments from his first Farewell Yellow Brick Road concert in Mexico City.", "date_str": "2026-10-03T19:12:39+00:00", "hash": "079d552b50cecc7a", "title_fa": "التون جان هنگام خداحافظی با صحنه در مکزیک: 5 بهترین لحظه از طرفداران برای \"همه عشق\" تشکر می کند", "summary_fa": "سر التون جان در روز جمعه (2 اکتبر)، 34 سال پس از اولین بازی خود در این مکان نمادین در مکزیکو سیتی، به استادیوم بانورته (که قبلا استادیوم آزتکا بود) بازگشت. اسطوره بریتانیایی برای اولین بار پس از 14 سال در طول اولین نمایش از دو نمایشی که پایان تور خداحافظی جاده آجر زرد او را که در سال 2018 آغاز شد، با طرفداران محلی خود متحد شد. مرتبط التون جان سرانجام با کنسرت های شهر مکزیکو خداحافظی کرد عصر بخیر، مکزیک. این پیانیست و ترانه سرای 79 ساله در جمع بیش از 60000 مخاطب (طبق گفته برگزارکنندگان) که اکثراً متشکل از طرفداران نسل های 60، 70 و 80 بودند، گفت: من از اینکه امشب اینجا هستم بسیار خوشحالم زیرا در تور خداحافظی آجر زرد [قبل از] به دلیل کووید به اینجا نیامده بودم. ستاره با پوشیدن یک کت و شلوار سفید ظریف و عینک قرمز اضافه کرد، می‌خواستم این دو نمایش آخر را اجرا کنم تا تشکر کنم برای این همه محبت و حمایتی که برای مدت طولانی به من داشتید. این خیلی معنی دارد که اینجا در مکزیکو سیتی برای اجرای دو نمایش آخرم باشم، خوب؟ بیایید زمان خوبی داشته باشیم! طرفداران «مرد موشکی» با لباس های رنگارنگ به این ماجرا آمدند تا هر دوره نمادینی را جشن بگیرند که جان را به یکی از مهمترین خواننده و ترانه سرا در موسیقی معاصر تبدیل کرده است. کت و شلوارهای پولک دار، عینک های رنگارنگ، کت های خز رنگارنگ و کفش های پلت فرم، با وجود بارانی که بر قسمت جنوبی شهر باریده بود، محل را پر کرده بود. این نمایش دو ساعته شامل مجموعه‌ای 24 آهنگی شامل آثار کلاسیکی مانند «تدفین برای یک دوست/عشق دراز می‌کشد»، «بنی و جت‌ها»، «من حدس می‌زنم به همین دلیل است که آن را بلوز می‌خوانند»، «یک»، «فیلادلفیا آزادی»، «گربه کوچک»، «هونکی» و"}, {"source": "Billboard", "title": "‘JAŸ-Z in 8’: 8 Things We Learned From Episodes 5 & 6", "link": "https://www.billboard.com/lists/jay-z-in-8-review-episodes-five-six-rick-rubin-hbo-max/", "summary": "Episodes five and six of JAŸ-Z in 8 premiered on HBO Max on Friday night (Oct. 2). Hov and Rick Rubin continued to peel back the layers on Jay-Z s discography, ranging from Reasonable Doubt to 4:44 and even Jigga s reunion with Ye (formerly Kanye West ) on Donda in 2021. The pair of episodes dive into Ye s JAIL, “U Don’t Know,” “Politics as Usual,” “Regrets,” “Ignorant S—,” “Hovi Baby,” “Kill Jay-Z,” “99 Problems,” “Threat,” “Dead Presidents II and “Public Service Announcement (Interlude). Related JAŸ-Z in 8’: 4 Things We Learned From Episode Four Episode six features the quote that has gone viral of Jay-Z being highly complimentary of West s artistry. Although he doesn t provide an exact look at where their relationship stands today, following Ye s derogatory attack on Jay s children last year. Hov also details how Goodfellas inspired Threat, Public Service Announcement nearly not making The Black Album , while a journalist inspired the third verse on the track, and much more. It s been refreshing to see the 56-year-old rap mogul candidly open up about his family life, relationships with the likes of Biggie Smalls and break down the intricacies of his brilliant wordplay, which may have gone over the average fan s head. “Nothing was difficult,” Jay told Billboard when asked if it was hard to reflect on anything in the documentary. “It wasn’t difficult at all. It was easy. The ease of the conversation with Rick [Rubin]; he’s super curious about life [and] music. We share the same love for music. It was an easy conversation. Here are eight things we learned from episodes five and six below. Tune into the JAŸ-Z in 8 finale on Friday night (Oct. 9) on HBO Max.", "date_str": "2026-10-03T18:58:53+00:00", "hash": "2695057538ead9ee", "title_fa": "«JAŸ-Z in 8»: 8 چیزی که از قسمت های 5 و 6 آموختیم", "summary_fa": "قسمت های پنجم و ششم JAŸ-Z in 8 جمعه شب (2 اکتبر) در HBO Max به نمایش درآمد. هاو و ریک روبین به بررسی لایه‌های دیسکوگرافی جی زی ادامه دادند، از Reasonable Doubt تا 4:44 و حتی دیدار مجدد جیگا با Ye (کانیه وست سابق) در دوندا در سال 2021. «اس نادان»، «هوی بیبی»، «جی زی را بکش»، «99 مشکل»، «تهدید»، «رئیس جمهور مرده دوم» و «اعلان خدمات عمومی» (بین‌الملل). JAŸ-Z مرتبط در 8: 4 چیزهایی که از اپیزود چهارم یاد گرفتیم اپیزود شش شامل نقل قولی است که Jay-Z به شدت از هنر وست تعریف می کند. اگرچه او به دنبال حمله تحقیرآمیز یی به فرزندان جی در سال گذشته، نگاه دقیقی به وضعیت روابط آنها امروز ارائه نمی دهد. Hov همچنین توضیح می دهد که چگونه Goodfellas از Threat الهام گرفته است، اعلامیه خدمات عمومی تقریباً آلبوم سیاه را نمی سازد، در حالی که یک روزنامه نگار الهام بخش آیه سوم این آهنگ است، و خیلی چیزهای دیگر. دیدن این غول رپ 56 ساله که صراحتاً در مورد زندگی خانوادگی خود، روابط با افرادی مانند بیگی اسمالز صحبت می کند و پیچیدگی های بازی درخشان خود را که ممکن است بر سر یک طرفدار معمولی غلبه کرده باشد، بسیار شاداب می کند. جی در پاسخ به بیلبورد گفت: «هیچ چیز سخت نبود.» «اصلاً سخت نبود، آسان بود. آسانی مکالمه با ریک [روبین]؛ او در مورد زندگی [و] موسیقی فوق العاده کنجکاو است. ما به موسیقی عشق مشترک داریم. گفتگوی آسانی بود. در اینجا هشت چیز است که ما از قسمت های پنج و شش در زیر یاد گرفتیم. شب جمعه (9 اکتبر) در HBO Max به JAŸ-Z in 8 فینال بپیوندید. در حالی که هنوز مشخص نیست که جی و یه در حال حاضر پس از حمله وست به فرزندان هاو در سال گذشته در رسانه‌های اجتماعی تحقیرآمیز"}, {"source": "Deadline", "title": "‘SNL’s Weekend Update Tackles Cornell Controversy & Return Of ‘Glee’", "link": "https://deadline.com/2026/10/weekend-update-cornell-controversy-return-of-glee-1237146124/", "summary": "After cracks about Pete Hegseth, Kristi Noem and President Donald Trump s vendetta against CNN, Michael Che on Saturday Night Live s Weekend Update touched on the ongoing controversy at Cornell University and Ryan Murphy s decision to bring back Glee. Che first served up a serious note by referencing the sexual assault case at Cornell and how [ ]", "date_str": "2026-10-04T04:48:46+00:00", "hash": "635f2ba70b565a79", "title_fa": "به‌روزرسانی آخر هفته SNL با جنجال کرنل و بازگشت «Glee» مقابله می‌کند", "summary_fa": "پس از انتقام گیری پیت هگزث، کریستی نوم و رئیس جمهور دونالد ترامپ علیه سی ان ان، مایکل چه در به روز رسانی آخر هفته برنامه زنده شنبه شب به بحث های جاری در دانشگاه کرنل و تصمیم رایان مورفی برای بازگرداندن گلی اشاره کرد. چه ابتدا با اشاره به پرونده تجاوز جنسی در کورنل و چگونگی [ ] یک یادداشت جدی ارائه داد، وقتی دوربین به سمت کالین جوست ساکت رفت، چه گفت: ببینید، همه ما آن دوستی داریم که به نظر مرد خوبی است، اما آنها قطعاً نیستند. ممکن است شخصی باشد که با او نزدیک هستید یا کسی که با او کار می کنید. شاید نتونی چیزی رو ثابت کنی شما فقط می توانید به او نگاه کنید و بگویید که آن تیپ های عجیب و غریب و ممتاز Ivy League همیشه چیزهای درهم ریخته ای دارند. چه بعد رو به جوست کرد و گفت: آیا چیزی هست که بخواهی اضافه کنی، کالین؟ جوست پاسخ داد. Watch on Deadline Later، کام پترسون، یکی از بازیگران، به میز پیوست it om twee voormalige Texas Rangers en oude vrienden: Augustus ‘Gus’ McCrae en Woodrow Call. De twee hebben hun avontuurlijke jaren eigenlijk achter zich gelaten en runnen in het kleine Texaanse plaatsje Lonesome Dove een bescheiden veehouderij. Gus is charmant en geniet graag van het leven, terwijl Call juist heel gedisciplineerd is. Wanneer een oude vriend terugkeert met verhalen over de mogelijkheden in het vrijwel onontgonnen Montana, besluit Call dat hij daar een nieuwe ranch wil beginnen. Gus laat zich uiteindelijk overtuigen om mee te gaan. Samen met een groep cowboys beginnen ze aan een gigantische veedrift van Texas naar Montana. Ze moeten een grote kudde runderen duizenden kilometers door het nog grotendeels wilde Amerikaanse Westen vervoeren. Onderweg krijgen ze te maken met extreem weer, bandieten, geweld: als je het genre kent, weet je wel wat er gaat gebeuren. De reis eist steeds meer van de groep en niet iedereen zal de eindbestemming bereiken Lonesome Dove is echter niet alleen avontuurlijk, ook relaties spelen een grote rol. Gus denkt bijvoorbeeld nog altijd aan Clara, een vroegere grote liefde die inmiddels in Nebraska woont. Personages als de jonge Newt, spoorzoeker Deets en Lorena krijgen eveneens belangrijke verhaallijnen. Makers East of Eden De makers van East of Eden gaan aan het werk om dit verhaal naar Netflix te brengen. Ze laten weten: Na onze buitengewoon fijne ervaring met East of Eden zijn we ontzettend blij opnieuw samen te kunnen werken met Netflix om Larry McMurtry s westernklassieker tot leven te brengen. We zullen dit materiaal benaderen met veel liefde en respect, en kunnen niet wachten om op pad te gaan met Gus en Call en de rest van de geliefde personages. Yee-haw. Wil jij nou niets missen over Netflix, films en series? Volg dan Netflix Facebookgroep! The post Legendarische western in nieuw jasje op Netflix appeared first on Netflix Nederland - Films en Series on demand .", "date_str": "2026-10-03T17:07:10+00:00", "hash": "8a3ce  به تیلور سوئیفت در مورد قرار دادن موسیقیدانان اعتماد می کند", "summary_fa": "داکوتا جانسون مجری برنامه زنده شنبه شب شنبه به شوخی با تیلور سوئیفت روی صحنه گفت: «من در واقع با قرار ملاقات با آنها یک خدمات عمومی انجام می دهم، زیرا خانم ها، من در زولافت پول زیادی برای شما پس انداز می کنم. جانسون که از آخرین باری که مجری برنامه بود، از کریس مارتین خواننده کلدپلی و رول مدل خواننده و ترانه سرا جدا شد، در مونولوگ خود، با جدیدترین فیلمش، Verity مقایسه می‌کند. این فیلم یک تریلر اروتیک روانی-جنسی است و می دانید چیست؟ او می گوید که قرار ملاقات با نوازندگان نیز همینطور است. برخی از آنها کفش نمی پوشند، برخی از آنها در رختخواب وحشتناک هستند، اما همه آنها در DM من هستند. هر چند تقصیر من نیست برخی از مردم کنسرت ها را با کالا ترک می کنند و من کنسرت ها را با یک رابطه 2.5 ساله ترک می کنم. اما من واقعا دوستان خوبی دارم. آنها من را به خاطر قرار ملاقات با این مردان قضاوت نمی کنند. او ادامه می‌دهد که سوئیفت به او می‌پیوندد، آنها واقعاً حمایت می‌کنند. خانم‌ها و آقایان، جانسون، درمانگر تحت اللفظی من، شروع می‌کند و سوئیفت را وادار کرد تا روایت متفاوتی از زمانی که با هم می‌گذرانند ارائه دهد. من در واقع درمانگر شما نیستم. سوئیفت می‌گوید، فقط هفته‌ای یک بار با یک بطری خالی شراب در خانه من حاضر می‌شوید و می‌پرسید که آیا من می‌خواهم. سوئیفت ادامه می دهد: و بعد روی کاناپه من می افتی و بیش از حد به اشتراک می گذاری، و من هر چند وقت یک بار فقط می گویم، لعنتی، این دیوانه است. سوئیفت ادامه می دهد: و بعد می گویم دیر می شوم، احتمالاً باید به رختخواب بروم، و بعد تو می گویی و سپس به تو یک پدالیت می دهم و امنیت من تو را به"}, {"source": "Rolling Stone", "title": "‘SNL’ Cold Open: Trump’s Midterms Pitch Dooms Desperate GOP", "link": "https://www.rollingstone.com/tv-movies/tv-movie-news/snl-cold-open-trump-midterms-pitch-dooms-desperate-gop-1235636469/", "summary": "\"Don't we have anyone who can connect with voters and who isn't a liability?\" one GOP operative asks", "date_str": "2026-10-04T04:42:33+00:00", "hash": "0803855672e40c9e", "title_fa": "\"SNL\" سرد باز: طرح میان دوره ای ترامپ، حزب جمهوری خواه ناامید را به هلاکت می رساند", "summary_fa": "\"آیا ما کسی را نداریم که بتواند با رای دهندگان ارتباط برقرار کند و مسئولیتی نداشته باشد؟\" یکی از فعالان حزب جمهوری خواه می پرسد در شنبه شب، فعالان جمهوری خواه برای یافتن نامزد مناسبی برای تشویق حضور رای دهندگان یک ماه پس از انتخابات میان دوره ای تلاش کردند، مارکو روبیو، جی دی ونس، میچ مک کانل، پیت هگزث و در نهایت، دونالد ترامپ را امتحان کردند. اما هیچ کدام کالا را تحویل ندادند. روبیو (مارچلو هرناندز)، در تلاش برای جلب نظر اسپانیایی‌هایی که دو سال از زمان ترامپ دور شده بود، پیامی به اسپانیایی ارائه می‌کند: اوه خدای من، او ما را فریب داد! و او هم مرا فریب داد! ونس (جرمی کولهن) سپس با اطمینان وارد اتاق می شود قبل از اینکه مشاور جمهوری خواه (اندرو دیسموکس) او را رد کند: آقای معاون، می توانید به سالن بروید و نفر بعدی را بیاورید؟ ونس مک کانل (مایکی دی) ویلچری را بیرون می‌آورد، که فقط می‌تواند با حالتی یخ زده آنجا بنشیند. او در نهایت موفق می شود تابلوی صلح را در دست بگیرد و وقتی از او خواسته می شود که خط خود را بگوید، با صدای خشن پاسخ می دهد: از نیویورک زنده، ساعت است، اما مشاور دیگر (اشلی پادیلا) به او می گوید که خط اشتباه است، در حالی که ونس او ​​را با خشونت از صحنه بیرون می کند. معاون رئیس‌جمهور سپس لابی می‌کند تا بتواند پیامی را به رای‌دهندگان ناامید برساند. چهار کلمه طول می کشد. سلام، من جی دی ونس هستم، تنها چیزی است که او می تواند قبل از قطع شدن، مسخره شدن به عنوان یک سوپراستار و گفته شدن برای رفتن از آنجا بیرون بیاید. بعد، هگزت (کالین جوست) می آید که یک آبجو بدون الکل می خورد. به شما میهن پرستان گوش دهید: من به شما نیاز دارم که"}, {"source": "Rolling Stone", "title": "How to Watch UFC 332: Silva vs. Wang Online Tonight", "link": "https://www.rollingstone.com/product-recommendations/lifestyle/how-to-watch-ufc-332-silva-vs-wang-online-livestream-fight-1235636025/", "summary": "The UFC Women’s Flyweight Championship is up for grabs tonight when Natália Silva and Wang Cong step into the octagon", "date_str": "2026-10-03T20:37:00+00:00", "hash": "9342da77d2fc3c18", "title_fa": "نحوه تماشای UFC 332: سیلوا در مقابل وانگ امشب به صورت آنلاین", "summary_fa": "مسابقات قهرمانی وزن مگس زنان UFC امشب برگزار می شود که ناتالیا سیلوا و وانگ کونگ وارد هشت ضلعی می شوند. تنها دو هفته پس از یک UFC 331 بسیار سرگرم کننده، یک رویداد شماره گذاری شده دیگر با UFC 332 در سالت لیک سیتی برگزار می شود. در بالای کارت نبرد وزن بادی زنان بین نات لیا سیلوا و وانگ کونگ برای کمربند خالی است. سیلوا در ابتدا قرار بود به مصاف والنتینا شوچنکو قهرمان برود، اما شوچنکو به دلیل آسیب دیدگی از ناحیه کمر و شانه مجبور به کناره گیری و خالی کردن عنوان قهرمانی شد. سیلوا از سال 2015 حرفه ای بوده و رکورد 20-5 را به دست آورده است، اما او در تمام 14 مبارزه آخر خود پیروز شده است. آخرین شکست این مبارز برزیلی در سال 2017 رقم خورد. او شروع به تمرین تکواندو کرد، به این معنی که او احتمالاً به ضربات برق آسای خود در برابر وانگ ادامه خواهد داد. اگرچه او در سطح شوچنکو نیست، اما وانگ یک مبارز قدرتمند با رکورد چشمگیر 10-1 از زمان شروع حرفه MMA خود در چهار سال پیش است. یک کیک بوکسور با تمرین، شانس خوبی برای ضربه زدن به سیلوا وجود دارد. با این حال، یک حذف غافلگیرکننده بسیار روی میز است، در این صورت مبارزه هر کسی است. اگر نمی توانید این آخر هفته به مرکز دلتا برسید، برای راهنمای سریع در مورد مکان پخش آنلاین UFC 322: Silva vs. Wang به ادامه مطلب بروید. تنها راه تماشای UFC 332: Silva vs Wang در ایالات متحده در Paramount+ است. اگر قبلاً اشتراک ندارید، هنگام ثبت نام چند گزینه وجود دارد. Paramount+ دو سطح اشتراک را ارائه می دهد: Essential و Premium. Essential 8.99 دلار در ماه و Premium 13.99 دلار در ماه هزینه دارد، اما هر دو به شما امکان می دهند امشب UFC"}, {"source": "Rolling Stone", "title": "Paul McCartney Reveals Why He Performed at Taylor Swift’s Wedding: ‘She Asked Me to Do It’", "link": "https://www.rollingstone.com/music/music-news/paul-mccartney-taylor-swift-wedding-larry-david-kimmel-1235636499/", "summary": "Beatles legend also talks about banning Larry David from his concerts after he refused to sing along to \"Hey Jude\" on Jimmy Kimmel Live", "date_str": "2026-10-03T19:35:48+00:00", "hash": "6ddc0638999f2d30", "title_fa": "پل مک‌کارتنی دلیل اجرای مراسم عروسی تیلور سوئیفت را فاش کرد: «او از من خواست این کار را انجام دهم»", "summary_fa": "اسطوره بیتلز همچنین در مورد ممنوعیت لری دیوید از حضور در کنسرت هایش صحبت می کند، پس از اینکه او از خواندن همراه \"هی جود\" در برنامه زنده جیمی کیمل امتناع کرد، پل مک کارتنی برای اولین بار در جریان حضورش در روز جمعه در برنامه زنده جیمی کیمل در مورد اجرای مراسم عروسی تیلور سویفت و تراویس کلس صحبت کرد! قبلا تایید شده بود که مک کارتنی بیتلز I Want to Hold Your Hand را در مراسم عروسی Swifts Madison Square Garden اجرا کرده است. میهمانان در ماه‌های بعد در مورد مراسم بسیار سخت صحبت می‌کردند، اما مک کارتنی دلیل آواز خواندن خود را در عروسی فاش کرد. مک کارتنی به کیمل گفت، او از من خواست که این کار را انجام دهم، و افزود که سوئیفت خودش درخواست I Want to Hold Your Hand را کرده بود، که او از زمان اجرای آن با گروه بیتلز در سال 1964، آن را زنده اجرا نکرده بود. سوئیفت در حین اجرا با مک کارتنی روی صحنه بود، من گفتم، تو باید با هم آواز بخوانی، و باید آن را برای مردت بخوانی،» او به کیمل گفت، اما معلوم نیست که آیا این دو نفر در آهنگی که رولینگ استون آن را بهترین آهنگ عروسی بیتلز می نامد، یا خیر. داستان‌های پرطرفدار بچه‌های ولگرد به BTS در ارسال گرمی می‌پیوندند تام مورلو را تحریم کنند: «اگر مثل فاشیسم، برادران و خواهران، فاشیسم را بکشد، فاشیسم است». مک کارتنی در مورد نسخه ویژه آینده‌اش از The Boys of Dungeon Lane، دونوازی با رینگو استار برای اولین بار، مستند اخیر Wings Man on the Run و زمانی که لری دیوید از خواندن همراه هی جود در کنسرت مک کارتنی خودداری کرد، صحبت کرد. دیوید در مصاحبه ای در ژوئن 2026 به کیمل گفت (شما فکر می کنید من نمی خواهم؟ فکر می کنید"}, {"source": "Hollywood Reporter", "title": "Tom Cruise’s ‘Digger’ Tries New Marketing Tactic: The French Love It, Americans Don’t", "link": "https://www.hollywoodreporter.com/movies/movie-news/tom-cruise-digger-critics-box-office-1236721806/", "summary": "A new ad for Alejandro G. Iñárritu's box office bomb shows international critics praising the film compared to their American counterparts.", "date_str": "2026-10-04T14:29:51+00:00", "hash": "b5f9f3e737a3295d", "title_fa": "«حفار» تام کروز تاکتیک جدید بازاریابی را امتحان می کند: فرانسوی ها آن را دوست دارند، آمریکایی ها آن را دوست ندارند", "summary_fa": "یک تبلیغ جدید برای بمب باکس آفیس آلخاندرو جی ایناریتو نشان می دهد که منتقدان بین المللی فیلم را در مقایسه با همتایان آمریکایی خود تحسین می کنند. برادران وارنر تبلیغ جدیدی را برای Digger منتشر کرد که در تلاش است رویکرد دیگری را برای بازاریابی فیلم پرفروش آلخاندرو جی. آگهی آنلاین (زیر) مجموعه ای از نقل قول های درخشان از منتقدان کشورهای مختلف را نشان می دهد و آنها را با نقدهای منفی منتقدان ایالات متحده مقایسه می کند. نوع مفهوم: بقیه جهان این فیلم را دوست دارند، فقط آمریکایی های خنگی هستند که از نبوغ آن قدردانی نمی کنند. در ابتدای تبلیغ، تام کروز در نقش دیگر راکول می‌گوید، آمریکا در تاریک‌ترین ساعاتش در کنار دنیا ایستاده است، که شخصیت ریز احمد به آن واکنش نشان می‌دهد، نه دیگر. داستان‌های مرتبط فیلم‌ها تام کروز در میان باکس آفیس سخت از حفار حمایت می‌کند: من به فیلم‌هایی که خلق کردیم بسیار افتخار می‌کنم حفار تام کروز در باکس آفیس با کمتر از ۱۰ میلیون دلار به‌عنوان پیشتاز حقیقت پیش می‌آید سپس متوالی نقل قول‌های منتقد در کنار پرچمی به نمایندگی از کشور منتقد می‌آید. اولین مورد مربوط به یک یوتیوبر مکزیکی است که فیلم را حماسی، خارق العاده و گزنده نامید، به دنبال آن یک نقل قول از لیست پخش، همراه با یک پرچم آمریکا، که فیلم را گروتسک، عمدی ناخوشایند نامید. بعداً یک منتقد فرانسوی وجود دارد که حفار را جواهری از هوش می نامد و سپس نیویورک پست آن را فیلمی ناخواسته بد نامید. این تبلیغ با بیان شخصیت کروز به پایان می رسد، شما تصمیم می گیرید کدام! انتظار می رود Digger در گیشه آخر هفته داخلی تنها حدود 8 میلیون دلار بفروشد که حتی کمتر از پیش بینی اندک 12 تا 15 میلیون دلاری استودیو است و مطمئناً لیگ ها کمتر از بودجه پیش بینی"}, {"source": "Hollywood Reporter", "title": "Taylor Swift Crashes Dakota Johnson’s ‘Saturday Night Live’ Hosting Stint: “My Literal Therapist!”", "link": "https://www.hollywoodreporter.com/tv/tv-news/taylor-swift-dakota-johnson-saturday-night-live-1236721702/", "summary": "The \"Patient Zero\" singer gave Travis Kelce a subtle salute during the 'Verity' star's opening monologue.", "date_str": "2026-10-04T03:47:27+00:00", "hash": "1697bc37aeae0815", "title_fa": "تیلور سوئیفت میزبانی «شنبه شب زنده» داکوتا جانسون: «درمانگر تحت اللفظی من!» را شکست داد.", "summary_fa": "خواننده «بیمار صفر» در جریان مونولوگ افتتاحیه ستاره «Verity» به تراویس کلس سلامی ظریف داد. متن لوگو داکوتا جانسون در شنبه شب زنده بازدید ویژه ای از بیمار صفر داشت. تیلور سوئیفت در خلال مونولوگ افتتاحیه خود در قسمت شنبه شب به بازیگر زن Verity پیوست و ظاهر کاملاً غافلگیرکننده ای را رقم زد. جانسون از آخرین باری که در SNL بود، دو جدایی بسیار عمومی و بسیار ضعیف با دو نوازنده فوق‌العاده داشت و اینکه چگونه او حمایت‌کننده‌ترین دوستانی را داشت که من را به خاطر قرار ملاقات با این مردان قضاوت نمی‌کردند. برش به سویفت! جانسون به شوخی گفت که خواننده به معنای واقعی کلمه درمانگر من است، که برنده گرمی پاسخ داد، من درمانگر شما نیستم. در واقع، شما فقط هفته ای یک بار در خانه من با یک بطری خالی شراب حاضر می شوید و می پرسید که آیا من می خواهم. داستان‌های مرتبط فیلم‌ها تام کروز در میان باکس آفیس سخت از حفار دفاع می‌کند: من به فیلم‌هایی که خلق کردیم بسیار افتخار می‌کنم. این دیوانه است. آیا او یک درمانگر نیست؟ بازیگر پنجاه سایه خاکستری مورد سوال قرار گرفت. روز یکشنبه، سوئیفت موزیک ویدیوی تک آهنگ جدیدش Patient Zero را منتشر کرد که بازیگر دیگری جز جانسون و کالین فارل نیست. این دو اولین ویدیو را در مراسم MTV VMA در روز یکشنبه منتشر کردند، با این آهنگ به عنوان یکی از چهار آهنگ جدیدی که نوازنده به عنوان بخشی از The Life of a Showgirl: Encore Edition جمعه گذشته منتشر کرد. برای پایان دادن به مونولوگ خود، جانسون نتیجه گرفت، خوب، سریعاً، در حالی که ما در مورد موزیسین‌ها صحبت می‌کنیم، فکر می‌کنم در واقع با قرار ملاقات با آنها یک خدمت عمومی انجام می‌دهم، زیرا خانم‌ها، من پول زیادی برای زولافت پس انداز می‌کنم. بنابراین، شما خوش آمدید، آمریکا! و همچنین انگلیس"}, {"source": "Hollywood Reporter", "title": "How ‘Freaks’ Sent Zach Lipovsky and Adam B. Stein to Hollywood: “That Film Changed Our Lives”", "link": "https://www.hollywoodreporter.com/movies     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <span class="news-source">📌 منبع: ${source}</span>
              <div class="footer-right">
                <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                  ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                </button>
                ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');

    }

      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }

          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
</body>
</html>
