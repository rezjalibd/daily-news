e world's hottest stock market to its coldest in months. Taiwan is pulling ahead as investors broaden AI bets beyond memory chips. Asia's AI trade is expanding from memory chips to the broader hardware supply chain. South Korea's stock market has gone from the world's hottest to its coldest in just a few months. The Kospi, the world's best-performing major stock benchmark in the first half of 2026, has since fallen about 24%, making it the worst-performing major market in the second half. It's still more than 50% higher this year. The AI trade isn't losing its appeal. But investors are increasingly looking beyond South Korea's memory-chip giants to companies with broader exposure to the AI hardware boom. In July, analysts at GlobalData.TS Lombard pointed out that much of the earnings growth at Korean memory-chip makers came from higher memory-chip prices. By contrast, TSMC and Japanese chip-equipment makers relied more on advanced manufacturing and process expertise, giving them more durable growth prospects, they added. Taiwan's Taiex has climbed about 7% in the second half of the year, taking its year-to-date gains to about 70% as investors broaden their bets across the AI hardware supply chain. South Korea's rally was driven largely by Samsung Electronics and SK Hynix, whose soaring memory-chip profits made them among the biggest winners of the AI boom. Together, the companies account for more than half of the Kospi, leaving the market unusually dependent on a single segment of the semiconductor industry. Even blockbuster earnings are no longer enough to excite investors. Last Thursday, Samsung forecast a nearly ninefold increase in quarterly operating profit, yet its shares have fallen for two straight trading sessions. The reversal followed months of extraordinary volatility. The Kospi plunged 22% in July, its worst month since the 2008 financial crisis, before rebounding 18% on the month's final trading day for its biggest one-day gain on record. The swings triggered multiple market-wide circuit breakers as leveraged bets on chip stocks amplified the moves. Young South Koreans flooded social media with memes and dark humor about their battered portfolios, while regulators tightened rules on leveraged single-stock exchange-traded funds after concerns the products had fueled speculation. Trading has cooled sharply. Turnover has dropped 70% fro", "date_str": "2026-10-12T08:52:39+00:00", "hash": "b66bfbb9759f28c5", "title_fa": "داغ ترین بازار سهام هوش مصنوعی جهان سرد شده است", "summary_fa": "بازار سهام کره جنوبی که زمانی داغ بود، شتاب خود را از دست داده است. گرگ بیکر/ خبرگزاری فرانسه/ گتی ایماژ کره جنوبی از داغ ترین بازار سهام جهان به سردترین ماه های اخیر خود رسید. تایوان در حال پیشرفت است زیرا سرمایه گذاران شرط بندی های هوش مصنوعی را فراتر از تراشه های حافظه گسترش می دهند. تجارت هوش مصنوعی آسیا از تراشه های حافظه به زنجیره تامین سخت افزار گسترده تر در حال گسترش است. بازار سهام کره جنوبی تنها در چند ماه گذشته از گرمترین بازار جهان به سردترین خود رسیده است. کوسپی، بهترین عملکرد شاخص سهام جهان در نیمه اول سال 2026، از آن زمان تاکنون حدود 24 درصد سقوط کرده است و بدترین عملکرد را در نیمه دوم سال به خود اختصاص داده است. امسال هنوز بیش از 50 درصد بالاتر است. تجارت هوش مصنوعی جذابیت خود را از دست نمی دهد. اما سرمایه‌گذاران به طور فزاینده‌ای فراتر از غول‌های تراشه‌های حافظه کره جنوبی به شرکت‌هایی نگاه می‌کنند که در معرض رونق سخت‌افزاری هوش مصنوعی بیشتری قرار دارند. در ماه جولای، تحلیلگران GlobalData.TS Lombard اشاره کردند که بیشتر رشد درآمد در تولیدکنندگان تراشه‌های حافظه کره‌ای ناشی از قیمت‌های بالاتر تراشه‌های حافظه است. در مقابل، TSMC و سازندگان تجهیزات تراشه ژاپنی بیشتر بر تخصص تولید و فرآیند پیشرفته تکیه کردند و چشم‌انداز رشد بادوام‌تری به آنها داد. Taiex تایوان در نیمه دوم سال حدود 7 درصد رشد کرده است و با افزایش سرمایه گذاران در زنجیره تامین سخت افزار هوش مصنوعی، سودهای سالانه خود را به حدود 70 درصد رسانده است. رالی کره جنوبی عمدتاً توسط Samsung Electronics و SK Hynix هدایت شد که سودهای فزاینده تراشه‌های حافظه آنها را به یکی از بزرگترین برندگان رونق هوش مصنوعی تبدیل کرد. این شرکت ها روی هم بیش از نیمی از Kospi را تشکیل می دهند و بازار"}, {"source": "Business Insider", "title": "The giant cavity in America's dental care industry", "link": "https://www.businessinsider.com/america-dental-hygienist-shortage-patients-workplace-quality-2026-10", "summary": "Getty Images; Alyssa Powell/BI When Elysse Morris decided to become a dental hygienist , it seemed like a natural fit. She was a fairly \"sciencey\" student in high school and generally liked going to the dentist. Plus, she'd always been a talker. Eleven years into her career, Morris, now 34, knows she could probably be making more money. Her home state of Virginia has a severe shortage of dental hygienists, and temporary workers can command high hourly rates by hopping between practices. But Morris has spent four years at the same privately owned office because she's happy there. Her boss gives her decent equipment, benefits, a bonus, and — most importantly — respect. The dentist treats her like a clinician rather than a pair of hands. \"We're not workers to her,\" Morris says. Her setup is what those in the business call a \"unicorn\" office, and the short supply of these quality workplaces is helping cause a short supply of dental hygienists across the country. I'm not kidding when I say I love my dental hygienist. I was going to quit my dentist , who I feel like often tries to push questionable treatments on me, but then Andrea started, and she's amazing. Last time I was in the office, I mentioned my union was bargaining a new contract, and she said she wished hygienists had a union of their own. It makes sense that they don't — the United States doesn't do sectoral bargaining , and most hygienists have traditionally worked in small, private offices where organizing would be difficult — but it got me thinking. I have no idea whether hygienists, in general, are having a good time. Turns out, they're not. According to the American Dental Association's Health Policy Institute, only 60% of dentists report having an adequate number of dental hygienists on staff. States such as Virginia, Missouri, Texas, and California say they need hundreds more clinicians. The problem isn't a lack of demand — the Bureau of Labor Statistics expects employment for hygienists to grow much faster than average over the next decade. The real struggle is that the field is having a hard time getting new hygienists in the door, as experienced hygienists are heading for the exits. Dental hygiene programs at community colleges and universities aren't agile enough to increase their flow of new graduates, all while veteran clinicians are deciding the physical toll, heavy workload, and lack of benefits aren't worth it. \"Burnout is so high,\" Morris says. You're basically \"trying to be a perfec", "date_str": "2026-10-12T08:24:01+00:00", "hash": "3f18a2aec06ff15a", "title_fa": "حفره غول پیکر در صنعت مراقبت از دندان آمریکا", "summary_fa": "گتی ایماژ; آلیسا پاول/BI وقتی الیسه موریس تصمیم گرفت که یک متخصص بهداشت دندان شود، به نظر یک تناسب طبیعی بود. او یک دانش آموز نسبتاً \"علمی\" در دبیرستان بود و عموماً دوست داشت به دندانپزشکی برود. به علاوه، او همیشه یک سخنگو بود. موریس که اکنون 34 سال دارد، 11 سال از زندگی حرفه‌ای خود می‌گذرد و می‌داند که احتمالاً می‌تواند درآمد بیشتری کسب کند. ایالت ویرجینیا، زادگاه او، کمبود شدید بهداشت دهان و دندان دارد، و کارگران موقت می‌توانند با پریدن بین تمرین‌ها، نرخ‌های ساعتی بالایی داشته باشند. اما موریس چهار سال را در همان دفتر خصوصی گذرانده است زیرا در آنجا خوشحال است. رئیس او به او تجهیزات مناسب، مزایا، پاداش و - مهمتر از همه - احترام می گذارد. دندانپزشک با او مانند یک پزشک به جای یک جفت دست رفتار می کند. موریس می گوید: «ما برای او کارگر نیستیم. راه‌اندازی او همان چیزی است که آن‌ها در این کسب‌وکار به آن مطب «یونیک شاخ» می‌گویند، و کمبود این محل‌های کار با کیفیت به کمبود تعداد متخصصان بهداشت دندان در سراسر کشور کمک می‌کند. وقتی می گویم عاشق بهداشت دهان و دندانم هستم، شوخی نمی کنم. من قصد داشتم دندانپزشکم را ترک کنم، که احساس می‌کنم اغلب سعی می‌کند درمان‌های مشکوک را روی من اعمال کند، اما سپس آندریا شروع به کار کرد، و او شگفت‌انگیز است. آخرین باری که در دفتر بودم، گفتم اتحادیه من در حال چانه زنی قرارداد جدیدی است و او گفت که ای کاش متخصصان بهداشت اتحادیه خودشان را داشتند. منطقی است که این کار را انجام نمی دهند - ایالات متحده چانه زنی بخشی انجام نمی دهد، و اکثر بهداشتکاران به طور سنتی در دفاتر کوچک و خصوصی کار می کردند که سازماندهی آنها دشوار بود - اما این باعث شد من به فکر فرو برم. من نمی دانم"}, {"source": "Business Insider", "title": "The small business drama involving Kelly Clarkson, a Brooklyn toy store, and an animatronic bird", "link": "https://www.businessinsider.com/kelly-clarkson-nyc-shop-internet-drama-reviews-pretty-woman-2026-10", "summary": "Kelly Clarkson said she was treated like Julia Roberts character in the 90s rom-com Pretty Woman when she visited a Brooklyn toy shop. Weiss Eubanks/NBCUniversal via Getty Images Kelly Clarkson said a Brooklyn toy shop gave her the \"Pretty Woman\" treatment. Here's how the dispute between Clarkson and the store unfolded. A publicist said a celebrity pile-on can hurt a small business before people know the full story. A Brooklyn toy shop has found itself at the center of a celebrity internet drama after Kelly Clarkson said she received the \" Pretty Woman \" treatment when she inquired about a $15,000 item in the store. In an X post on Saturday, the singer said she had a negative experience at Art of Play, a toy store in New York City . \"Just drove all the way to Brooklyn to check out this store I thought looked really rad and had a few things in mind to buy and literally was looked at as if I couldn't afford it and was told he could find something comparable for me,\" Clarkson wrote in her post, adding that the store \"just lost a huge sale.\" Just drove all the way to Brooklyn to check out this store I thought looked really rad and had a few things in mind to buy and literally was looked at as if I couldn’t afford it and was told he could find something comparable for me. Wow, dude. You’re an idiot and just lost a huge sale. But y’all should go check out Art of Play in Brooklyn if you enjoy being treated like Julia Roberts character in Pretty Woman. For sure, check it out 👎 — Kelly Clarkson (@kellyclarkson) October 10, 2026 She then compared her experience to the treatment Julia Roberts' character receives in the '90s rom-com \"Pretty Woman,\" telling people to visit the store if they enjoyed being treated that way. Clarkson's post on X had received more than 39.4 million views and over 261,000 likes as of Sunday evening. As her post gained traction, Art of Play responded on Instagram the next day with its own account of the interaction, saying the toy Clarkson had inquired about was a bird automaton that's \"permanently attached to the wall and isn't for sale.\" The store said it understood why Clarkson's account \"would resonate with anyone who has ever felt judged in a shop,\" but said that it welcomed visitors equally, whether they came to browse or buy. View this post on Instagram A post shared by Art of Play (@artofplay) \"Imagine our surprise when our small local business was suddenly attacked by 8 million people who have never visited our store. It's been a su", "date_str": "2026-10-12T05:50:27+00:00", "hash": "c8aee103c857336a", "title_fa": "درام تجاری کوچکی که کلی کلارکسون، یک فروشگاه اسباب‌بازی در بروکلین و یک پرنده انیماترونیک را شامل می‌شود.", "summary_fa": "کلی کلارکسون گفت که وقتی از یک مغازه اسباب‌فروشی در بروکلین بازدید می‌کرد، با او مانند شخصیت جولیا رابرتز در فیلم زن زیبای رام-کام دهه 90 رفتار می‌شد. Weiss Eubanks/NBCUniversal از طریق Getty Images کلی کلارکسون گفت که یک فروشگاه اسباب‌بازی در بروکلین درمان \"زن زیبا\" را به او داده است. در اینجا نحوه اختلاف بین کلارکسون و فروشگاه شکل گرفت. یک کارشناس تبلیغاتی گفت که یک انباشته افراد مشهور می تواند قبل از اینکه مردم داستان کامل را بدانند به یک تجارت کوچک آسیب می رساند. یک فروشگاه اسباب‌بازی در بروکلین پس از اینکه کلی کلارکسون گفت که او در مورد یک کالای 15000 دلاری در فروشگاه پرس و جو کرد، تحت درمان \"زن زیبا\" قرار گرفت، خود را در مرکز یک درام اینترنتی مشهور پیدا کرد. در یک پست X در روز شنبه، این خواننده گفت که تجربه منفی در Art of Play، یک فروشگاه اسباب بازی در شهر نیویورک داشته است. کلارکسون در پست خود نوشت: \"فقط تمام راه را به سمت بروکلین رفتم تا این فروشگاه را بررسی کنم، فکر می کردم که واقعاً خیلی خوب به نظر می رسد و چند چیز برای خرید در ذهن داشتم و به معنای واقعی کلمه به نظرم می رسید که گویی نمی توانم آن را بخرم و به او گفته شد که می تواند چیزی قابل مقایسه برای من پیدا کند.\" فقط تمام راه را تا بروکلین رانندگی کردم تا این فروشگاه را بررسی کنم، فکر می‌کردم واقعاً راد به نظر می‌رسد و چند چیز برای خرید در ذهن داشتم و به معنای واقعی کلمه به نظرم می‌رسید که گویی توان خرید آن را ندارم و به او گفته شد که می‌تواند چیزی قابل مقایسه برای من پیدا کند. وای رفیق شما یک احمق هستید و یک فروش هنگفت را از دست داده اید. اما اگر از رفتار"}, {"source": "Business Insider", "title": "Trump's quest to bring down gas prices ahead of the midterms is not going great", "link": "https://www.businessinsider.com/oil-gas-diesel-prices-midterms-iran-russia-ukraine-saudi-arabia-2026-10", "summary": "Trump is trying — and failing — to bring down gas prices ahead of the midterm elections in the US. Alex Wong/Getty Images Trump has sought to assure voters that he can lower gas prices before the midterm elections. The results of his efforts, however, have not yet materialized. Gas prices reached a national average of $4.36 per gallon on Sunday, AAA reported. President Donald Trump is running into the limits of his influence as he seeks to bring down sky-high gas prices ahead of the midterm elections. In social media posts and stump speeches across the country, Trump has sought to assure voters that gas prices — a major sticking point for Americans grappling with an affordability crisis — will soon go down. At the White House on Friday, for instance, Trump recalled seeing gas prices below $2 a gallon in Iowa before the US and Israel launched surprise strikes on Iran in February. \"We'll be down to those levels soon,\" he said. The numbers and the trajectory of conflicts around the world, however, portend a different story. As of Sunday, AAA reported that the average price of regular gas in the US was $4.36 per gallon. At this time last year, that number was $3.09. Diesel prices have also skyrocketed, reaching $6.28 per gallon earlier this month. Early Monday, Brent crude, the international oil benchmark, was trading about 2% lower at around $103 a barrel. That's more than 40% above its level at the start of the Iran war, but about 2% below where it stood a month ago, after prices surged past $100 a barrel in early September. The bigger concern, however, is diesel, where prices have remained elevated despite crude's recent pullback. Refinery bottlenecks and attacks on energy infrastructure in the Middle East and Russia have squeezed supplies of the fuel, which powers trucks, trains, ships, and farm equipment. That raises transportation costs across the economy and can keep inflation under pressure even if crude prices stabilize. Persistently high diesel prices also pose a political challenge ahead of the midterms, as rising transportation costs threaten to add to the inflation pressures already weighing on American households. Trump suspended fuel export sanctions on Russia this week to bring more diesel to the market and lower prices, prompting allies and enemies alike to wrinkle an eyebrow. Hours later, Ukraine struck a Russian oil depot. On Sunday morning, Trump tried again to calm oil markets, announcing an \"ENERGY CEASEFIRE\" between Russia and Ukraine on", "date_str": "2026-10-12T04:22:34+00:00", "hash": "d6d9d3b36ec4f004", "title_fa": "تلاش ترامپ برای کاهش قیمت بنزین پیش از انتخابات میان دوره ای چندان خوب پیش نمی رود", "summary_fa": "ترامپ در تلاش است - و شکست می خورد - قیمت بنزین را پیش از انتخابات میان دوره ای در ایالات متحده کاهش دهد. الکس وانگ/ گتی ایماژ ترامپ به دنبال این است که به رای دهندگان اطمینان دهد که می تواند قیمت بنزین را قبل از انتخابات میان دوره ای کاهش دهد. نتایج تلاش های او اما هنوز محقق نشده است. به گزارش AAA، قیمت گاز روز یکشنبه به میانگین ملی 4.36 دلار در هر گالن رسید. دونالد ترامپ، رئیس‌جمهور آمریکا در آستانه انتخابات میان‌دوره‌ای، در تلاش است تا قیمت بنزین را تا حد زیادی کاهش دهد. ترامپ در پست‌های رسانه‌های اجتماعی و سخنرانی‌های بی‌حساب در سراسر کشور به دنبال این بوده است که به رای‌دهندگان اطمینان دهد که قیمت بنزین - که یک نقطه گیر بزرگ برای آمریکایی‌هایی است که با بحران استطاعت دست و پنجه نرم می‌کنند - به زودی کاهش خواهد یافت. به عنوان مثال، ترامپ روز جمعه در کاخ سفید به یاد آورد که قبل از حمله غافلگیرانه آمریکا و اسرائیل به ایران در ماه فوریه، شاهد قیمت گاز زیر 2 دلار در هر گالن در آیووا بود. او گفت: ما به زودی به این سطوح خواهیم رسید. با این حال، اعداد و مسیر درگیری ها در سراسر جهان، داستان متفاوتی را نشان می دهد. تا روز یکشنبه، AAA گزارش داد که میانگین قیمت گاز معمولی در ایالات متحده 4.36 دلار در هر گالن است. در این زمان در سال گذشته، این عدد 3.09 دلار بود. قیمت گازوئیل نیز به شدت افزایش یافته است و در اوایل این ماه به 6.28 دلار در هر گالن رسیده است. اوایل روز دوشنبه، نفت خام برنت، معیار بین المللی نفت، حدود 2 درصد کاهش یافت و در حدود 103 دلار در هر بشکه معامله شد. این رقم بیش از 40 درصد بالاتر از سطح خود در آغاز جنگ"}, {"source": "Business Insider", "title": "My cofounder and I were rivals at hackathons. At 21, I've put college on hold to build a startup with him.", "link": "https://www.businessinsider.com/gen-z-college-raise-funding-vc-startup-san-francisco-hackathon-2026-10", "summary": "Raymond Loong Ng put his college plans on hold to build a startup in San Francisco. Provided by Raymond Loong Ng. At 21, Raymond Loong Ng put college on hold after his startup raised $250,000 from VC firm Afore Capital. He and his cofounder spent two months in a program in San Francisco, working on their startup. A subsequent investment brought their total funding to $1 million, and they're now back in Singapore awaiting O-1 visas. This as-told-to essay is based on a conversation with Raymond Loong Ng, 21, the cofounder of Makeable, a San Francisco-based startup. It's been edited for length and clarity. I was born in Vietnam and moved to Singapore when I was 9. As a kid, I always had some kind of side hustle . In school, I sold toys, snacks, in-game currency, and sneakers to my classmates — anything that might earn me a little extra pocket money. When I was 16, I did an internship at an auditing firm, where I had the chance to speak with a lot of business owners. I began to see technology as a tool that could help me advance in the business world. I ended up getting a diploma in applied AI and analytics at a polytechnic after finishing secondary school. I was never the best at math or coding, but it offered me a way to turn my ideas into actual projects. Have you relocated abroad for career opportunities, retirement, or lower living costs? We want to hear from you. Fill out this short form to share your story. I always saw myself as the connector: I could spot a problem, form a vision, attract resources, then bring in my smartest classmates to make things happen. That was how I began building projects of my own. I built an AI tool that helps ex-offenders build résumés and find jobs. I also started a community of young AI builders that runs workshops for students across Singapore. From rivals to cofounders In school, the projects we built often felt theoretical. Participating in hackathons gave me the chance to build solutions under real-world market constraints. Although we had crossed paths earlier through a separate scholarship program, hackathons were also how I got to know the person who would later become my cofounder better. Ng and his cofounder started out on rival hackathon teams before deciding to work together. Provided by Raymond Loong Ng. We competed as rivals on different teams, but would often find ourselves among the only people still working at 2 or 3 a.m. Eventually, we decided we wanted to be on the same team. We started entering competit", "date_str": "2026-10-12T04:02:01+00:00", "hash": "dc14874628e6b040", "title_fa": "من و بنیانگذارم در هکاتون رقیب بودیم. در 21 سالگی، کالج را به حالت تعلیق درآوردم تا با او یک استارت آپ بسازم.", "summary_fa": "ریموند لونگ نگ برنامه های کالج خود را برای ایجاد یک استارتاپ در سانفرانسیسکو متوقف کرد. ارائه شده توسط Raymond Loong Ng. ریموند لونگ نگ در 21 سالگی پس از جمع آوری 250000 دلار از شرکت VC Afore Capital، کالج را متوقف کرد. او و بنیانگذارش دو ماه را در برنامه ای در سانفرانسیسکو گذراندند و روی استارتاپ خود کار کردند. سرمایه گذاری بعدی کل بودجه آنها را به 1 میلیون دلار رساند و آنها اکنون در سنگاپور در انتظار ویزای O-1 هستند. این مقاله همانطور که گفته شد بر اساس گفتگو با ریموند لونگ نگ، 21 ساله، بنیانگذار Makeable، یک استارت آپ مستقر در سانفرانسیسکو است. برای طول و وضوح ویرایش شده است. من در ویتنام متولد شدم و در 9 سالگی به سنگاپور نقل مکان کردم. در مدرسه، اسباب‌بازی‌ها، اسنک‌ها، ارز درون بازی، و کفش‌های ورزشی را به همکلاسی‌هایم می‌فروختم - هر چیزی که ممکن است کمی پول در جیب من به همراه داشته باشد. وقتی 16 ساله بودم، یک دوره کارآموزی را در یک شرکت حسابرسی گذراندم، جایی که این فرصت را داشتم که با بسیاری از صاحبان مشاغل صحبت کنم. شروع کردم به دیدن فناوری به عنوان ابزاری که می تواند به پیشرفت من در دنیای تجارت کمک کند. پس از پایان دبیرستان، دیپلم هوش مصنوعی و تجزیه و تحلیل کاربردی را در پلی تکنیک گرفتم. من هرگز در ریاضیات یا کدنویسی بهترین نبودم، اما راهی برای تبدیل ایده هایم به پروژه های واقعی به من ارائه داد. آیا برای فرصت های شغلی، بازنشستگی یا هزینه های زندگی کمتر به خارج از کشور نقل مکان کرده اید؟ ما می خواهیم از شما بشنویم. این فرم کوتاه را پر کنید تا داستان خود را به اشتراک بگذارید. من همیشه خود را به عنوان رابط می دیدم: می توانستم مشکلی را پیدا کنم، چشم انداز ایجاد کنم، منابع"}, {"source": "Business Insider", "title": "How to watch Dodgers vs. Brewers: National League Championship Series live streams and schedule", "link": "https://www.businessinsider.com/guides/streaming/how-to-watch-dodgers-vs-brewers-mlb-nlcs-2026", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The Dodgers and Brewers also met in the 2025 National League Championship Series. Daniel Shirey/MLB Photos via Getty Images The MLB Playoffs are underway, and the National League Championship Series starts soon. We've rounded up absolutely everything you need to know about how to watch the Dodgers vs. Brewers, including live streaming options for those without cable. If you're hoping to tune in, you can live stream the NLCS games on FOX and FS1 via a streaming service like YouTube TV . Keep reading to learn additional streaming options and to get a look at the series schedule. How to watch Dodgers vs. Brewers: quick links US: FOX, FS1 YouTube TV (free trial) Fubo (free trial) Access subscriptions from anywhere: NordVPN (30-day money-back guarantee) When: October 11-19 (at the latest), 2026 Game 1 on Sunday at 8 p.m. ET / Monday at 1 a.m. BST / 8 a.m. AWST (FOX) How to watch the Dodgers vs. Brewers in the US The Dodgers vs. Brewers National League Championship Series will air on FOX or FS1 (and sometimes both). There are a few easy ways to stream every game, including live TV services like YouTube TV and Fubo. YouTube TV is our top recommendation for the MLB Playoffs. You can find FOX, FS1, and 100+ other popular channels in the platform's Main plan, which costs $83 a month. There's a limited-time promo for new customers that will knock the first five months down to $68 a month after a free trial. Fubo is another popular live TV service with FOX, FS1, and tons of other channels. Fubo Pro subscriptions unlock 200+ channels for $89 a month, but new users can get $25 off their first month after a free trial. FOX and FS1 live streams are also available through FOX One, which costs $20 a month. You can subscribe directly through the FOX One website, as a Prime Video add-on , or as a bundle with ESPN Unlimited .  the design front, the Frame delivers all the essentials: a matte, canvas-like screen, support for magnetic bezels (sold separately), a flush wall mount, and a motion sensor that turns art mode on only when someone's in the room. Because the standard Frame has been around the longest, it also offers the widest selection of bezel styles, from understated to more ornate. Just keep in ", "date_str": "2026-10-11T14:36:11+00:00", "hash": "19de4227980e8cd8", "title_fa": "بهترین تلویزیون‌های قاب هنری 2026: سامسونگ، هایسنس و TCL چگونه با هم مقایسه می‌شوند؟", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید تلویزیون‌های هنری، مانند قاب سامسونگ و فریم پرو، به گونه‌ای طراحی شده‌اند که وقتی به عنوان تلویزیون از آن استفاده نمی‌کنید، شبیه نقاشی‌های آویزان به نظر می‌رسند. استیون کوهن/ بیزینس اینسایدر بیایید صادق باشیم: اکثر تلویزیون ها وقتی خاموش هستند به اتاق نشیمن شما لطفی نمی کنند. آنها اساسا فقط مستطیل های سیاه بزرگی هستند که فضای دیوار را اشغال می کنند. این مشکلی است که سامسونگ هنگام عرضه Frame در سال 2017 تصمیم به حل آن گرفت و دلیل بزرگی برای محبوبیت تلویزیون های فریم سبک است. بهترین تلویزیون‌های قاب به‌جای اینکه شبیه فناوری به نظر برسند، طوری طراحی شده‌اند که به عنوان دکور عمل کنند. آن‌ها صفحه‌های ضد تابش دارند که ظاهر بوم را تقلید می‌کنند، ساختارهای باریکی دارند که دیوار را در آغوش می‌گیرند، و قاب‌های قابل تعویض متناسب با فضای شما. و زمانی که نمایش مورد علاقه شما را اجرا نمی کنند، به عنوان نمایشگرهای هنری دیجیتال برای نقاشی های کلاسیک و قطعات مدرن عمل می کنند. سامسونگ ممکن است این روند را آغاز کرده باشد، اما این تنها بازی در شهر نیست. هایسنس، TCL، آمازون، ال‌جی و والمارت با برداشت‌های خود از تلویزیون‌های الهام‌گرفته از هنر وارد عمل شده‌اند. من چند سال گذشته را صرف آزمایش چندین نسخه از قاب سامسونگ کرده ام، از جمله فریم استاندارد و فریم پرو رده بالا. من همیشه از طراحی سامسونگ قدردانی کرده‌ام، اما می‌خواستم ببینم رقابت چگونه پیش می‌رود. آیا گزینه‌هایی مانند Hisense CanvasTV، TCL NXTVISION TV، و Amazon Ember Artline TV واقعاً همان حس گالری را بدون برش دادن به شما ارائه می‌دهند؟ برای فهمیدن این موضوع، بهترین تلویزیون های قاب سامسونگ، هایسنس، TCL و آمازون را آزمایش کردم. در اینجا نحوه مقایسه آنها - هم به عنوان"}, {"source": "Business Insider", "title": "Only 33 albums in history have yielded 3 or more No. 1 songs — here they all are", "link": "https://www.businessinsider.com/albums-with-most-no-1-hit-songs-ever-billboard-list", "summary": "Taylor Swift performs the 1989 set during the Eras Tour. Kevin Mazur/Getty Images for TAS Rights Management Taylor Swift's \"The Life of a Showgirl\" has yielded three No. 1 songs on the Billboard Hot 100. It's the first female album since Swift's own \"1989\" to achieve the feat. The Beatles, Whitney Houston, Mariah Carey, and Rihanna also have multiple albums on the list. Thanks to \"The Life of a Showgirl: The Encore,\" Taylor Swift has added another rare achievement to her resumé. The deluxe edition of Swift's 12th album added four new songs to the tracklist, including \"Patient Zero,\" which debuted at No. 1 on the Billboard Hot 100 — becoming the album's third song to reach the chart's summit, following \" The Fate of Ophelia \" and \"Opalite.\" Since Billboard launched the Hot 100 in 1958 as the definitive all-genre singles chart in the US, only 33 albums have spawned three or more No. 1 hits (not counting greatest-hits compilations). Counting songs that were released later on deluxe editions and reissues, Katy Perry's \"Teenage Dream\" holds the all-time record with six No. 1 songs, followed by Michael Jackson's \"Bad\" with five. This elite group of musical blockbusters seems to be getting more exclusive over time: Only 12 of the qualifying albums were released in the 21st century. \" The Life of a Showgirl \" is the first female album to achieve the feat in over a decade, since Swift's own \"1989\" in 2014. All 33 albums are listed below in chronological order. 1. Where Did Our Love Go by The Supremes Where Did Our Love Go was released in 1964. Motown No. 1 songs: \"Where Did Our Love Go,\" \"Baby Love,\" \"Come See About Me\" 2. Help! by The Beatles Help! was released in 1965. Parlophone No. 1 songs: \"Help!,\" \"Ticket to Ride,\" \"Yesterday\"* *Included on the original UK release of \"Help!\" and later included on the US-exclusive release of \"Yesterday and Today\" 3. Magical Mystery Tour by The Beatles Magical Mystery Tour was released in 1967. Parlophone/Capitol No. 1 songs: \"Penny Lane,\" \"All You Need Is Love,\" \"Hello Goodbye\" 3. Let It Be by The Beatles Let It Be was released in 1970. Apple No. 1 songs: \"Let It Be,\" \"The Long and Winding Road,\" \"Get Back\" 4. The Saturday Night Fever soundtrack Saturday Night Fever was released in 1977. RSO No. 1 songs: \"How Deep Is Your Love,\" \"Stayin' Alive,\" \"Night Fever,\" \"If I Can't Have You\" 5. Spirits Having Flown by the Bee Gees Spirits Having Flown was released in1979. RSO Records No. 1 songs: \"Tragedy,\" \"Too Much Heaven,\" \"Love You ", "date_str": "2026-10-11T14:32:01+00:00", "hash": "49478a295b5438f7", "title_fa": "فقط 33 آلبوم در تاریخ دارای 3 یا بیشتر آهنگ شماره 1 بوده اند - همه آنها اینجا هستند.", "summary_fa": "تیلور سوئیفت مجموعه 1989 را در طول تور Eras اجرا می کند. کوین مازور/ گتی ایماژ برای مدیریت حقوق TAS آهنگ \"زندگی یک دختر نمایشی\" تیلور سویفت سه آهنگ شماره 1 را در بیلبورد هات 100 به ارمغان آورده است. این اولین آلبوم زن پس از \"1989\" خود سویفت است که به این شاهکار دست می یابد. بیتلز، ویتنی هیوستون، ماریا کری و ریحانا نیز چندین آلبوم در این فهرست دارند. تیلور سوئیفت به لطف «زندگی یک دختر شوی: The Encore» یک دستاورد نادر دیگر را به رزومه خود اضافه کرده است. نسخه لوکس دوازدهمین آلبوم سوئیفت، چهار آهنگ جدید از جمله \"بیمار صفر\" را به لیست آهنگ اضافه کرد، که در رتبه اول در بیلبورد هات 100 قرار گرفت و سومین آهنگ آلبوم بود که پس از \"سرنوشت اوفلیا\" و \"اپالیت\" به قله جدول رسید. از زمانی که بیلبورد Hot 100 را در سال 1958 به عنوان نمودار قطعی تک‌آهنگ‌های همه ژانر در ایالات متحده راه‌اندازی کرد، تنها 33 آلبوم موفق به کسب سه یا بیشتر تعداد بازدیدهای شماره 1 شده‌اند (بدون احتساب مجموعه‌های پربازدید). با شمارش آهنگ‌هایی که بعداً در نسخه‌های لوکس و انتشار مجدد منتشر شدند، «رویای نوجوان» کیتی پری با شش آهنگ شماره 1 رکورد تاریخ را در اختیار دارد و پس از آن «بد» مایکل جکسون با پنج آهنگ قرار دارد. به نظر می‌رسد این گروه نخبه از پرفروش‌های موسیقی با گذشت زمان انحصاری‌تر می‌شوند: تنها 12 آلبوم از آلبوم‌های واجد شرایط در قرن 21 منتشر شد. \"زندگی یک دختر نمایشی\" اولین آلبوم زنی است که پس از آلبوم \"1989\" خود سوئیفت در سال 2014، در بیش از یک دهه به این موفقیت دست یافته است. همه 33 آلبوم به ترتیب زمانی در زیر فهرست شده اند. 1. Where Did Our Love Go توسط The Supremes Where Did Our Love Go در سال 1964 منتشر"}, {"source": "Lifehacker", "title": "The Out-of-Touch Adults' Guide to Kid Culture: Why Are Kids Throwing Fruit in Toilets?", "link": "https://lifehacker.com/entertainment/the-out-of-touch-adults-guide-to-kid-culture-fruit-in-toilets?utm_medium=RSS", "summary": "This week's deep dive into young people culture answers questions you may not have thought to ask, like, \"Why are young people throwing fruit in their toilets?\" \"What does it mean when someone tells me to 'visualize spinning apples'?\" \"What is glass skin?\" and \"How can Minecraft help you understand the age of the universe?\" Why are young people throwing fruit in the toilet? This is a weird one, but young people are throwing fruit in the toilet in honor of the rapper Lucki. Backstory: The Atlanta rapper best known for his track \" New Drank \" was attending ComplexCon in Los Angeles on Oct. 3 when an entourage vs. entourage tussle with rapper Playboi Carti's crew broke out and Lucki was stabbed. In response, the hashtag #throwfruitinthetoiletforlucki appeared on Instagram and TikTok, and kids started throwing fruit in the toilet and posting videos like this one: and this one: So that's what's happening; why it's happening is a little harder to explain. People posted screenshots indicating the lyrics to Lucki's \"Y Not\" include the line \"When I get stabbed at ComplexCon, throw fruits in the toilet\" but the song doesn't actually include those lyrics and it's hard to imagine many fans bought into it. Some suggested that the trend is a dig at Lucki's lifestyle and weight: a not-subtle suggestion he eat more fruit. Maybe, but I think it's a classic online non sequitur. I don't think anyone is legitimately trying to honor Lucki by posting these videos. It seems like jokers trying to get fans of the rapper to throw fruit in their toilets so they can say, \"Look at those weirdos! We tricked 'em into throwing fruit in their toilets!\" But it doesn't seem to be working. All the fruit-throwers I've seen seem like they're \"in on the joke,\" which actually reverses the joke. Anyway, Lucki is doing well and expected to make a full recovery. What does \"imagine spinning apples\" mean? The second fruit-related meme trending this week is \"imagine spinning apples,\" a way to insult pretentious dinks online. It's a journey to explain how it came to mean that, so here goes. Aphantasia is the inability to visualize things. If you can't imagine apples, you may have aphantasia. The idea that some people can imagine apples and some can't is big on 4Chan, Reddit, and other online communities populated by young people who would like to claim superiority over others, but can't do it based on money, attractiveness, or any other traditional measure of preeminence. Despite the actual neuroscienc", "date_str": "2026-10-12T14:00:00+00:00", "hash": "a75a5ba82c4e748b", "title_fa": "راهنمای بزرگسالان خارج از تماس برای فرهنگ کودک: چرا بچه ها میوه ها را در توالت می اندازند؟", "summary_fa": "غواصی عمیق این هفته در فرهنگ جوانان به سؤالاتی پاسخ می دهد که شاید فکرش را هم نمی کردید بپرسید، مانند \"چرا جوانان در توالت های خود میوه می ریزند؟\" وقتی کسی به من می‌گوید سیب‌های در حال چرخش را تجسم کنم، به چه معناست؟» \"پوست شیشه ای چیست؟\" و \"چگونه Minecraft می تواند به شما در درک سن جهان کمک کند؟\" چرا جوانان میوه در توالت می ریزند؟ این یک مورد عجیب است، اما جوانان به افتخار خواننده رپ Lucki در توالت میوه می اندازند. پیشینه: خواننده رپ آتلانتا که بیشتر برای آهنگ \"New Drank\" شناخته می شود در 3 اکتبر در ComplexCon در لس آنجلس شرکت می کرد که درگیری همراهان و اطرافیان با خدمه رپر Playboi Carti رخ داد و لاکی با چاقو زخمی شد. در پاسخ، هشتگ #throwfruitinthetoiletforlucki در اینستاگرام و TikTok ظاهر شد و بچه ها شروع به ریختن میوه در توالت کردند و ویدیوهایی مانند این پست کردند: و این یکی: پس این اتفاق می افتد. توضیح اینکه چرا این اتفاق می افتد کمی سخت تر است. افرادی که اسکرین شات هایی را ارسال کردند که نشان دهنده اشعار آهنگ «Y Not» لاکی است، عبارت «وقتی در ComplexCon به من چاقو زدند، میوه ها را در توالت بیندازید»، اما این آهنگ در واقع شامل آن اشعار نیست و تصور اینکه بسیاری از طرفداران آن را بخرند سخت است. برخی پیشنهاد کردند که این روند، بررسی سبک زندگی و وزن لاکی است: پیشنهادی نه ظریف که او میوه بیشتری بخورد. شاید، اما من فکر می‌کنم این یک نسخه کلاسیک آنلاین است. فکر نمی‌کنم کسی به‌طور مشروع با ارسال این ویدیوها به لاکی احترام بگذارد. به نظر می‌رسد جوکرها سعی می‌کنند طرفداران خواننده رپ را وادار کنند تا میوه‌ها را در توالت‌هایشان بیندازند تا بگویند: \"به آن آدم‌های عجیب و غریب نگاه کنید! اما به نظر"}, {"source": "Lifehacker", "title": "This Rugged and Portable JBL Bluetooth Speaker Is 27% Off Right Now", "link": "https://lifehacker.com/tech/jbl-go-5-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. The JBL Go 5 is down to $39.95 from $54.95 on Amazon, and price trackers show that this is its lowest price so far. At roughly four inches wide and just over half a pound, it is small enough to toss into a backpack, clip onto a bag, or keep on your desk without taking up much room. The upgraded IP68 rating also makes it a better travel companion than the Go 4 , especially for beach days, hikes, or anywhere dust and water are likely to show up. JBL Go 5 $39.95 at Am oogle Fitbit Edge - Activity Tracker - Pyrite/Olive - Small Large Band $179.99 at Amazon Get Deal Get Deal $179.99 at Amazon Before the Fitbit Air , which came out earlier this year, Google hadn t come out with any new Fitbits since the Charge 6 in 2023. In the meantime, the Pixel Watch has gotten up to its fifth generation , and the Fitbit app became the Google Health app . I was worried the idea of a small-screen fitness tracker might have been lost for good. Fortunately, I was wrong. What s new in the Fitbit Edge Google says that the new Fitbit has: A physical button on the side, unlike the Charge 6 s haptic nub Its own GPS chipset, instead of relying on your phone. An altimeter, which the Fitbit Charge 6 did not have (but many fitness watches do) A seven-day battery life, or about two days if you enable the always-on display The same charger as the Fitbit Air A replaceable battery Music controls that work with anything your phone is playing Pre-orders open today, and the Fitbit Edge is expected to start shipping on Oct. 27. The retail price is $179.99, making it $20 more than the Charge 6 s regular price. For comparison, the Fitbit Air is $99.99 , and the Pixel Watch 5 starts at $349.99 . The Fitbit Edge s price, size, and functionality put it right in between those two devices, and honestly it s a well-rounded lineup. Google representatives said in a briefing that it will be possible to connect both a Fitbit Air and Fitbit Edge to your phone, so that you can switch between them at will. (Previously, you could pair a Fitbit and a Pixel Watch, but not two Fitbits.) Compared to the Charge 6, the Fitbit Edge gains an altimeter and more useful music controls; the Charge 6 could only control music playing on Youtube Music, which required a subscription. However, the Fitbit Edge will not have a tap-to-pay option like the Charge 6 did; it does not have NFC capabilities. Google says GPS tracking is more accurate on the Edge than the Charge 6, which isn t surprising since that was a major weak point of the Charge 6. I m looking forward to testing out the Fitbit Edge and reporting back on how well it performs in real-life use.", "date_str": "2026-10-12T13:00:00+00:00", "hash": "1e491e90d92cbc66", "title_fa": "گوگل بالاخره یک فیت بیت دیگر با صفحه نمایش ساخت", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. شایعات درست هستند: گوگل یک دستگاه جدید به نام Fitbit Edge را معرفی کرده است. این یک نوار با صفحه نمایش باریک است، بسیار شبیه Charge 6 قدیمی، اما به روز شده است تا با ظاهر و برخی از عملکردهای Fitbit Air مطابقت داشته باشد. Google Fitbit Edge - Activity Tracker - Pyrite/Olive - Small Large Band 179.99 دلار در آمازون دریافت معامله دریافت تخفیف 179.99 دلار در آمازون قبل از Fitbit Air که اوایل امسال عرضه شد، Google از زمان Charge 6 در سال 2023 هیچ فیت بیت جدیدی عرضه نکرده بود. برنامه Fitbit به برنامه Google Health تبدیل شد. من نگران بودم که ایده یک ردیاب تناسب اندام با صفحه کوچک برای همیشه از بین رفته باشد. خوشبختانه اشتباه کردم. آنچه در Fitbit Edge جدید است گوگل می گوید که فیت بیت جدید دارای یک دکمه فیزیکی در کناره است، بر خلاف نوک لمسی Charge 6 s، چیپست GPS خود را به جای تکیه بر تلفن شما. ارتفاع‌سنج که Fitbit Charge 6 نداشت (اما بسیاری از ساعت‌های تناسب اندام دارند) عمر باتری هفت روزه، یا اگر صفحه نمایش همیشه روشن را فعال کنید، حدود دو روز. شارژر مشابه Fitbit Air باتری قابل تعویض موسیقی کنترل می‌کند که با هر چیزی که گوشی شما پخش می‌کند کار می‌کند. 20 دلار بیشتر از قیمت معمولی Charge 6 s. برای مقایسه، Fitbit Air 99.99 دلار است و Pixel Watch 5 از 349.99 دلار شروع می شود. قیمت، اندازه و عملکرد Fitbit Edge آن را درست در بین این دو دستگاه قرار می دهد و صادقانه بگویم که این یک مجموعه کامل است. نمایندگان گوگل در یک جلسه توجیهی گفتند که امکان اتصال Fitbit Air و Fitbit Edge به تلفن شما وجود دارد تا بتوانید به دلخواه بین آنها جابجا شوید."}, {"source": "Lifehacker", "title": "This Insta360 Phone Gimbal Bundle Is 32% Off Right Now", "link": "https://lifehacker.com/tech/insta360-flow-2-pro-bundle-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Amazon currently has the Insta360 Flow 2 Pro Ultimate AI Tracker Bundle for $154.99, down from $227.99, and price trackers show that as its lowest price so far. The main reason to consider a phone gimbal like this is not just smoother footage, but having a setup that can keep you in frame even when there's nobody behind the camera its three-axis stabilization helps take the shake out of walking shots and handheld clips, while the built-in tripod and selfie stick make it easy to set the phone down for a vlog, workout, livestream, or travel video without carrying separate accessories. Insta360 Flow 2 Pro $154.99 at Amazon $227.99 Save $73.00 Get Deal Get Deal $154.99 at Amazon $227.99 Save $73.00 On the iPhone, Apple DockKit support allows subject tracking across more than 200 compatible apps, while the included AI Tracker brings similar hands-free tracking to Android and iPhone users across supported apps. That tracking is where this bundle earns its higher price over a basic gimbal it can rotate continuously through 360 degrees, so you can move around without repeatedly walking back to reposition the phone, and its multi-person mode can keep a group framed instead of locking onto one face. The AI Tracker can also follow subjects while zoomed in, with the Flow 2 Pro supporting tracking from 1x to 15x. Its built-in fill light also helps when the lighting is poor, while its Free Tilt Mode gives you more freedom to move the camera up or down while keeping the shot stable. None of those tools will make your phone camera better by themselves, but they can make it much easier to get usable footage without repeatedly reshooting a clip. It's not waterproof, so rain, poolside filming, or other wet environments require more care than an action camera would. And some of its smarter tracking features also depend on the phone, app, and       media: [{"source": "Billboard", "title": "Art Garfunkel Postpones U.K. Tour Over Respiratory Infection Diagnosis: ‘My Doctor Has Advised Me to Take Some Time to Rest’", "link": "https://www.billboard.com/music/pop/art-garfunkel-postpones-uk-tour-respiratory-infection-1236358905/", "summary": "Art Garfunkel has postponed his planned U.K. run of shows just before they were slated to take place. The former Simon Garfunkel member and solo singer was slated to bring his What a Wonderful World tour to a quartet of U.K. cities over the next week, beginning with a Tuesday night (Oct. 13) show at Watford Colosseum in Watford, England. According to NME , Garfunkel, 84, had to wave off the shows on doctor s orders due to a respiratory infection. “During rehearsals for my upcoming concerts, I nearly postponed a scheduled appointment with my physician, Garfunkel said in a statement. Thankfully, my wonderful wife, Kim, insisted that I keep it. As it turns out, I have been diagnosed with a respiratory infection, and my doctor has advised me to take some time to rest and recover.” Garfunkel added, My heart is broken that I must postpone these performances. At this season of my life, to be so warmly received by audiences and surrounded by so much love is a gift beyond words. Singing for you has always been one of the greatest joys of my life, and the thought of disappointing you saddens me deeply. At press time, Garfunkel had not announced the rescheduled dates for the shows slated to take place on Tuesday, Thursday (Oct. 15) at the Opera House in Manchester, Saturday (Oct. 17) at the University of Wolverhampton at the Civic Hall in Wolverhampton and next Monday (Oct. 19) at the Royal Albert Hall in London. During the tour, Garfunkel performs with guitarist Tab Laven, playing Simon Garfunkel classics such as The Sound of Silence and The Boxer, as well as classics from his solo career. Garfunkel promised fans that he will return to the stage to sing for them as soon as my health allows, assuring them that they needn t worry about him and that he s in good hands, and I expect to be just fine. The next scheduled show on the tour is at L Olympia in Paris on Oct. 21 In May, Garfunkel was one of the surprise guests at Charlie Puth s Madison Square Garden show, where he popped out to sing a duet with the headliner on The Boxer, which appeared on Simon Garfunkel s final studio album, 1970 s Bridge Over Troubled Water .", "date_str": "2026-10-12T13:05:07+00:00", "hash": "a557b984866d909e", "title_fa": "آرت گارفانکل تور بریتانیا را بر سر تشخیص عفونت تنفسی به تعویق انداخت: \"دکتر من به من توصیه کرده است که برای استراحت کمی وقت بگذارم\"", "summary_fa": "آرت گارفانکل اجرای برنامه ریزی شده خود در بریتانیا را درست قبل از برنامه ریزی شده به تعویق انداخت. عضو سابق سیمون گارفانکل و خواننده انفرادی قرار بود در هفته آینده تور \"What a Wonderful World\" خود را در چهار شهر از شهرهای بریتانیا برگزار کند، که با یک برنامه سه شنبه شب (13 اکتبر) در واتفورد کولوسئوم در واتفورد، انگلستان آغاز می شود. به گزارش NME، گارفانکل، 84 ساله، به دستور پزشک به دلیل عفونت تنفسی مجبور به ترک برنامه شد. گارفانکل در بیانیه‌ای گفت: \"در طول تمرین کنسرت‌های آینده‌ام، تقریباً قرار ملاقات برنامه‌ریزی شده با پزشکم را به تعویق انداختم. خوشبختانه، همسر فوق‌العاده‌ام، کیم، اصرار داشت که آن را نگه دارم. همانطور که مشخص شد، تشخیص داده شد که من مبتلا به عفونت تنفسی هستم، و دکترم به من توصیه کرده است که استراحت کنم و کمی زمان بگذارم.\" گارفانکل افزود: قلب من شکسته است که باید این اجراها را به تعویق بیندازم. در این فصل از زندگی‌ام، استقبال گرم تماشاگران و محاصره شدن با عشق بسیار هدیه‌ای فراتر از کلام است. آواز خواندن برای تو همیشه یکی از بزرگترین شادی های زندگی من بوده است و فکر ناامید کردن تو مرا عمیقاً غمگین می کند. در زمان انتشار، گارفانکل تاریخ های تغییر برنامه ریزی شده برای نمایش هایی که قرار است در روز سه شنبه، پنجشنبه (15 اکتبر) در خانه اپرا در منچستر، شنبه (اکتبر) برگزار شود، اعلام نکرده بود. 17) در دانشگاه ولورهمپتون در سالن مدنی در ولورهمپتون و دوشنبه آینده (19 اکتبر) در رویال آلبرت هال لندن. در طول این تور، گارفانکل با گیتاریست Tab Laven اجرا می کند و آثار کلاسیک Simon Garfunkel مانند The Sound of Silence و The Boxer و همچنین آثار کلاسیک حرفه انفرادی خود را اجرا می کند. گارفانکل به طرفداران قول داد که به محض اینکه سلامتی من اجازه"}, {"source": "Billboard", "title": "Julión Álvarez: Why Mariachi Is ‘Sacred Ground’ for Him | Billboard News Interview", "link": "https://www.billboard.com/video/julion-alvarez-billboard-news-interview/", "summary": "Julión Álvarez looks back on nearly 20 years of his career, major Billboard chart milestones, and what it means to still have fans showing up in a big way. In this Billboard interview, Julión talks performing for nearly 100,000 people in two days in Jalisco, why big shows still make him nervous, and the respect that goes into making a ranchera album with mariachi. He also opens up about his new album Ranchero de Corazón and why mariachi felt like “sacred ground,” the story behind “Lleva a la Luna,” the importance of family and how he balances “Julio” vs. “Julión,” the obstacles he’s faced and how he stays calm through setbacks by focusing on what he can control, and relaunching his label while building a team to support more artists. Julión Álvarez I have enough talk for about 10 wakes without coffee and without cookies. Ingrid Fajardo That s right. It s been a while since you talked with Billboard. Julión Álvarez It s been quite a while, yeah. Ingrid Fajardo Really? Julión Álvarez Really. A very, very long time. I don t know, I have no idea how many years. Ingrid Fajardo Mmm. I think a couple of years have passed, and I have some data here from the charts we have with you. Obviously impressive. You have 25 entries on the Hot Latin Songs chart, you have 34 songs on the Regional Mexican Airplay chart. You ve done incredible things, and next year you celebrate 20 years as Julión Álvarez. How does it feel? Julión Álvarez Well, it feels like many things. Satisfaction. We feel blessed, fortunate to be able to be here, even after 20 years, after so many, so many trends, so many artists, talents, youth, new energies that are revolutionizing music, to still be there among the public s favorites, to have an audience that supports us, that keeps supporting our music, applauding us, joining us at our events and allowing those numbers. Ingrid Fajardo Yes, yeah. And besides, obviously we were just talking about the concerts you have. There will be practically 100,000 people in two days. Julión Álvarez In two days. You know what? Yes, the capacity that Jalisco stadium has, we re going to perform tomorrow as Julión Álvarez y Norteño Banda, the day after with Prófugos del Nexo, with my buddy Alfredito Olivas, to whom I send a big greeting, the man. Watch the full video above!", "date_str": "2026-10-12T13:00:00+00:00", "hash": "6abce8f5729e35ca", "title_fa": "جولیون آلوارز: چرا ماریاچی برای او \"زمین مقدس\" است | مصاحبه خبری بیلبورد", "summary_fa": "جولیون آلوارز به نزدیک به 20 سال زندگی حرفه ای خود، نقاط عطف اصلی نمودار بیلبورد، و اینکه هنوز هم طرفداران زیادی را نشان می دهند، به چه معناست. در این مصاحبه بیلبورد، جولیون درباره اجرای نزدیک به 100000 نفر در دو روز در Jalisco صحبت می‌کند، چرا نمایش‌های بزرگ هنوز او را عصبی می‌کنند و احترامی که برای ساخت آلبوم ranchera با ماریاچی وجود دارد. او همچنین در مورد آلبوم جدید خود Ranchero de Corazón و اینکه چرا ماریاچی احساس «زمین مقدس» می‌کرد، داستان پشت «Lleva a la Luna»، اهمیت خانواده و نحوه تعادل «Julio» در برابر «Julión»، موانعی که با آن روبرو شده و چگونه آرام می‌ماند در مقابل شکست‌ها، با تمرکز و حمایت بیشتر بر روی آنچه که هنرمندش می‌تواند کنترل کند، می‌گوید. Julión Álvarez من برای حدود 10 بار بدون قهوه و بدون کلوچه صحبت کافی دارم. اینگرید فاجاردو درست است. مدتی است که با بیلبورد صحبت کرده اید. جولیون آلوارز خیلی وقت است، بله. اینگرید فاجاردو واقعا؟ خولیون آلوارز واقعا. مدت بسیار بسیار طولانی نمی دانم، نمی دانم چند سال است. اینگرید فاجاردو ممم. فکر می کنم چند سال گذشته است، و من برخی از داده ها را در اینجا از نمودارهایی که با شما داریم، دارم. آشکارا چشمگیر است. شما 25 آهنگ در نمودار آهنگ های لاتین داغ، 34 آهنگ در نمودار منطقه ای مکزیکی ایرپلی دارید. شما کارهای باورنکردنی انجام دادید و سال آینده 20 سالگی را به عنوان جولیون آلوارز جشن می گیرید. چه حسی دارد؟ جولیون آلوارز خوب، خیلی چیزها به نظر می رسد. رضایت. ما احساس خوشبختی می کنیم، خوشبختیم که می توانیم حتی بعد از 20 سال، بعد از این همه، گرایش های بسیار، هنرمندان، استعدادها، جوانان، انرژی های جدید که موسیقی را متحول می کنند، اینجا باشیم، که همچنان در میان علاقه مندی های مردم حضور داشته باشیم،"}, {"source": "Billboard", "title": "Sombr Joined by Fleetwood Mac Legend For ‘Go Your Own Way’ At L.A. Show", "link": "https://www.billboard.com/music/pop/sombr-joined-fleetwood-mac-buckingham-go-your-own-way-la-show-1236358899/", "summary": "Sombr brought out one of his all-time influences during his show at the Kia Forum on Saturday night (Oct. 10) in Los Angeles. “I’d like to welcome to the stage someone I look up to so much. This man’s music is one of my biggest influences, the 21-year-old singer said, according to Rolling Stone . Related Nickelback to Return to Australia for the First Time Since 2019 Sombr Paid Secret Homage to George Michael During All-Star 2026 VMAs Tribute With a Signature Piece of Late Singer s Wardrobe Kelly Clarkson Doubles Down on Brooklyn Store Feud: You re Also a Liar I grew up on this guy, I think we all grew up on this guy, everyone… He’s just been a great mentor, a great person. Please, give it up for the f king legend, Lindsey Buckingham of Fleetwood Mac.” He was then joined by the 77-year-old Mac legend and solo star for a rendition of the 1977 Fleetwood Mac Rumors No. 10 Billboard Hot 100 classic Go Your Own Way. Dressed in jeans, a black T-shirt and black leather jacket, Buckingham strummed a burgundy electric guitar and joined Sombr on the song s iconic chorus refrain. Earlier in the night, the Back to Friends singer invited The Neighbourhood singer Jesse Rutherford out to perform the latter s 2013 song Sweater Weather , with the crowd going wild as Rutherford strutted out in a zipped-up black leather jacket, jeans and black shades. From the moment he hit the stage, the crowd was in the pocket, shouting along to the song s opening verse, And all I am is a man/ I want the world in my hands/ I hate the beach, but I stand/ In California with my toes in the sand. Sombr s next scheduled tour date on his You Are the Reason tour is on Tuesday night (Oct. 13) at Pechanga Arena in San Diego, which will be followed by dates in Arizona, Oklahoma, Texas, Georgia, Florida, North Carolina, Tennessee and Missouri. His 2026 U.S. tour will run through a Dec. 15 gig at Q102 s Jingle Ball in Philadelphia before he hops to Mexico City for a pair of January 2027 gigs, followed by a run of festival shows in South American in March and gigs in Australia and New Zealand in April.", "date_str": "2026-10-12T12:34:22+00:00", "hash": "3cf190558411bb63", "title_fa": "Sombr توسط Fleetwood Mac Legend برای \"Go Your Own Way\" در L.A. Show ملحق شد.", "summary_fa": "سومبر یکی از تأثیرات تمام دوران خود را در نمایش خود در انجمن کیا در شنبه شب (10 اکتبر) در لس آنجلس به نمایش گذاشت. به گزارش رولینگ استون، این خواننده 21 ساله گفت: \"من می خواهم به کسی که خیلی به او توجه می کنم به روی صحنه خوش آمد بگویم. موسیقی این مرد یکی از بزرگترین تأثیرات من است. نیکل بک مرتبط برای بازگشت به استرالیا برای اولین بار از سال 2019، Sombr ادای احترام مخفیانه به جورج مایکل در جریان ادای احترام VMAهای All Star 2026 با قطعه امضایی از کمد لباس خواننده متاخر کلی کلارکسون دوبرابر در فروشگاه بروکلین دشمنی می کند: شما هم در مورد این مرد دروغگو هستید. او فقط یک مربی بزرگ است، یک فرد بزرگ. لطفاً آن را به خاطر افسانه پادشاه افسانه، لیندسی باکینگهام از فلیت‌وود مک، رها کنید.» سپس اسطوره 77 ساله مک و ستاره انفرادی برای اجرای آهنگ 100 کلاسیک Billboard Hot 100 Fleetwood Mac Rumors در سال 1977 همراه شد. باکینگهام با شلوار جین، تی شرت مشکی و ژاکت چرمی مشکی، یک گیتار الکتریک بورگوندی را به تن کرد و به Sombr در ترانه نمادین گروه کر پیوست. اوایل شب، خواننده Back to Friends از جسی رادرفورد، خواننده گروه The Neighborhood دعوت کرد تا آهنگ 2013 Sweater Weather را اجرا کند، در حالی که رادرفورد با ژاکت چرمی مشکی زیپ‌دار، شلوار جین و سایه‌های مشکی، از بین مردم وحشی می‌شد. از لحظه‌ای که او روی صحنه آمد، جمعیت در جیب بودند و همراه با بیت آغازین آهنگ فریاد می‌زدند، و من فقط یک مرد هستم/ می‌خواهم دنیا در دستانم باشد/ از ساحل متنفرم، اما ایستاده‌ام/ در کالیفرنیا با انگشتان پا در شن‌ها. تاریخ تور برنامه ریزی شده بعدی Sombr در تور You Are the Reason او سه شنبه شب (13 اکتبر) در Pechanga Arena در سن دیگو است،"}, {"source": "Billboard", "title": "Britney Spears Drops Previously Unreleased Pop Banger ‘She’ll Never Be Me,’ Co-Written With Then-Boyfriend Justin Timberlake: Listen", "link": "https://www.billboard.com/music/pop/britney-spears-unreleased-shell-never-be-co-written-timberlake-1236358893/", "summary": "Britney Spears is effectively retired from pop music, but next month, her fans will get to hear a previously unreleased track that is likely to spark serious early 2000s nostalgia. On Friday (Oct. 9), the 44-year-old singer dropped She ll Never Be Me, a classic-era Britney pop banger that was originally recorded for her self-titled third LP, 2001 s Britney . Spears co-wrote the song with her then-boyfriend, Justin Timberlake , as well as Bradley Daymond (*NSYNC) and Alex Greggs (*NSYNC, Paris Hilton) and it was co-produced by Riprock n Alex G. You know I m one of a kind/ Boy, what s this I see/ Your girl, she looks just like me/ Blond hair and dressed to a T/ You tell me how can this be/ Does she know I was the one/ Who used to turn you on, Spears sings in her signature nasally, girlish voice over a burping keyboards and a robotic, drum machine beat. The song is among a bevy of previously unreleased tracks slated to appear on the upcoming 25th anniversary edition of Britney , due out on Nov. 6. In addition to such beloved hits as I m a Slave 4 U, Overprotected, Lonely and I m Not a Girl, Not Yet a Woman, the 25-song expanded version will feature the I m a Slave 4 U B-side Intimidated, as well as Right Now (Taste the Victory), from the singer s 2002 Pepsi commercial, and the previously unreleased songs Am I a Sinner, When I Say So and My Big Secret, produced by the Neptunes, according to the singer s posted tracklist . You know I m one of a kind/ There ll never be another me/ Can t get me out of your mind/ You re lost in your own fantasy/ And when you look in my eyes/ Is it hard for you to realize/ She ll never be me, Spears sings on the kiss-off chorus of the song in which she slams an ex for replacing her with an exact replica. Britney signaled a more grown-up direction for the then-19-year-old singer, following on the heels of her breakout LPs Baby One More Time and Oops! I Did It Again . The album also featured another Timberlake collaboration, the JT co-written/co-produced What It s Like to Be Me, which closed out the original set. Spears and Timberlake began dating in 1999 and broke up in March 2002. After their split, Timberlake released the revenge tune Cry Me a River, whose video featured a Spears look-alike to go with lyrics about a man who refuses to take back his ex after discovering that she s been unfaithful. Spears has not yet posted about the song on her socials, though her Facebook account teased on Sept. 30 that more surprises are coming e", "date_str": "2026-10-12T11:55:49+00:00", "hash": "79217bedb6e3e768", "title_fa": "بریتنی اسپیرز پاپ بنگر منتشرنشده قبلی «او هرگز من نمی‌شود» را که با دوست پسر آن زمان جاستین تیمبرلیک نوشته شده را کنار می‌گذارد: گوش کن", "summary_fa": "بریتنی اسپیرز عملاً از موسیقی پاپ بازنشسته شده است، اما ماه آینده، طرفداران او آهنگی را خواهند شنید که قبلاً منتشر نشده بود که احتمالاً نوستالژی جدی اوایل دهه 2000 را برانگیخت. در روز جمعه (9 اکتبر)، خواننده 44 ساله She ll Never Be Me را کنار گذاشت، موسیقی پاپ کلاسیک دوران بریتنی که در اصل برای سومین LP او، بریتنی در سال 2001 ضبط شده بود. اسپیرز این آهنگ را با دوست پسرش، جاستین تیمبرلیک، و همچنین بردلی دیموند (*NSYNC) و الکس گرگز (*NSYNC، پاریس هیلتون) نوشت و ریپروک و الکس جی آن را تهیه کردند. می دانی که من یک نوع هستم/ پسر، این چه چیزی است که می بینم/ دختر تو، او دقیقاً شبیه من است/ موهای بلوند و تیپ پوشیده است/ تو به من می گویی که چطور می شود/ آیا او می داند که من همانی بودم/ که تو را روشن می کرد، اسپیرز با امضای خود به صورت بینی آواز می خواند، صدای دخترانه روی کیبوردهای آروغ و ضرب آهنگ رباتیک و درام. این آهنگ در میان مجموعه‌ای از آهنگ‌های منتشر نشده است که قرار است در نسخه بیست و پنجمین سالگرد بریتنی که قرار است در ۶ نوامبر منتشر شود، ظاهر شود. علاوه بر آهنگ های محبوبی مانند Im a Slave 4 U, Overprotected, Lonely و I m Not a Girl, Not Yet a Woman, نسخه گسترش یافته 25 آهنگی Im a Slave 4 U B-side Intimidated و همچنین Right Now (Taste the Victory) را از آهنگ های قبلی 200 من و 200 آهنگ قبلی که به صورت تجاری غیرقابل قبول است، در نسخه 25 آهنگی پخش خواهد شد. طبق لیست آهنگ ارسال شده خواننده، Sinner, When I Say So و My Big Secret ساخته شده توسط Neptunes. می دانی که من یک نوع هستم/ هرگز من دیگری وجود نخواهد داشت/ نمی توانی"}, {"source": "Billboard", "title": "Nickelback to Return to Australia for the First Time Since 2019", "link": "https://www.billboard.com/music/concerts/nickelback-australia-2027-tour-1236358885/", "summary": "Nickelback will wrap their 2027 world tour in Australia, with seven shows from Oct. 2 to Oct. 16 in support of its 11th studio album, Everything Under the Sun , due Oct. 30 via Virgin Music Group. England’s Don Broco joins as direct support. The run opens Saturday, Oct. 2 at Perth’s RAC Arena and moves through Adelaide, Melbourne’s Rod Laver Arena and Brisbane Entertainment Centre. It also takes in Sydney’s Afterpay Arena and two estate venues: Geelong’s Mount Duneed Estate (Oct. 9) and Pokolbin’s Roche Estate in the Hunter Valley (Oct. 16, closing night). General tickets go on sale Friday, Oct. 16 at 10 a.m. local time, with presales earlier that week. The dates are Nickelback’s first Australian shows since its Feed the Machine tour in early 2019. The band skipped the country on its 2022 Get Rollin’ run. The Australian leg follows a North American run opening Feb. 6 in Pittsburgh and a U.K. and European leg from May 22 to July 13. Everything Under the Sun is the band’s first album since leaving BMG, following 2022’s Get Rollin’ . Lead single “Rattle the Cage,” featuring guitarist John 5, is currently No. 1 at active rock radio in the U.S., according to the tour announcement. “Leave Me Behind” and “Make Me Love You” have also been released. Nickelback’s chart record is proof the rockers can still fill arenas. “How You Remind Me” reached No. 1 on the Billboard Hot 100 and was the Hot 100’s year-end No. 1 single of 2002. Billboard named the band its top rock group of the 2000s. The 2005 album All the Right Reasons produced three Hot 100 top 10 singles, including “Photograph,” “Far Away” and “Rockstar,” and has been certified diamond in the U.S. Don Broco, for its part, took a No. 1 U.K. album in 2021 with Amazing Things . Nickelback’s 2027 Australian tour dates with Don Broco: Saturday, Oct. 2 — RAC Arena, Perth Tuesday, Oct. 5 — Adelaide Entertainment Centre Arena, Adelaide Thursday, Oct. 7 — Rod Laver Arena, Melbourne Saturday, Oct. 9 — Mount Duneed Estate, Geelong Tuesday, Oct. 12 — Brisbane Entertainment Centre, Brisbane Thursday, Oct. 14 — Afterpay Arena, Sydney Saturday, Oct. 16 — Roche Estate, Pokolbin", "date_str": "2026-10-12T07:35:08+00:00", "hash": "1ee7ff24062b1f19", "title_fa": "نیکل بک برای اولین بار از سال 2019 به استرالیا باز می گردد", "summary_fa": "Nickelback تور جهانی 2027 خود را در استرالیا با هفت برنامه از 2 اکتبر تا 16 اکتبر در حمایت از یازدهمین آلبوم استودیویی خود، Everything Under the Sun، که در 30 اکتبر از طریق Virgin Music Group منتشر می شود، به پایان خواهد رساند. دان بروکو از انگلیس به عنوان حمایت مستقیم می‌پیوندد. این مسابقه شنبه، 2 اکتبر در RAC Arena در پرث آغاز می‌شود و در آدلاید، راد لیور آرنا ملبورن و مرکز سرگرمی بریزبن حرکت می‌کند. همچنین در Afterpay Arena سیدنی و دو مکان املاک: G
