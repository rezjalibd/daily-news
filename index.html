ecret-incumbent-advantage", "summary": "More than 25 organisations from left and right have written to the White House asking it to publish the voluntary framework governing pre-deployment review of frontier AI models. The framework was completed on 1 August and previewed only with a selected group of companies, with smaller and open-source developers largely excluded. The coalition argues secrecy [ ] This story continues at The Next Web", "date_str": "2026-09-09T12:42:20+00:00", "hash": "dfe2a1de656409001e2864804f623f011bd0dc536bfc40ef7d8e4b248b5af283", "title_fa": "قوانین بررسی مدل های هوش مصنوعی مرزی مخفی هستند. شرکت هایی که آنها را خوانده اند، شرکت های بزرگی هستند.", "summary_fa": "بیش از 25 سازمان از چپ و راست به کاخ سفید نامه نوشته اند و از آن خواسته اند تا چارچوب داوطلبانه حاکم بر بررسی پیش از استقرار مدل های هوش مصنوعی مرزی را منتشر کند. این چارچوب در 1 آگوست تکمیل شد و تنها با گروهی از شرکت‌ها پیش‌نمایش شد و توسعه‌دهندگان کوچک‌تر و منبع باز تا حد زیادی مستثنی شدند. ائتلاف بحث محرمانه بودن [ ] این داستان در وب بعدی ادامه دارد"}, {"source": "MIT Tech Review", "title": "The Download: OpenAI’s turning point for math and a battery record", "link": "https://www.technologyreview.com/2026/09/09/1143767/the-download-openai-math-future-battery-record/", "summary": "This is today s edition of The Download , our weekday newsletter that provides a daily dose of what s going on in the world of technology. What OpenAI’s latest controversy tells us about the future of math OpenAI says its agents have solved one of the most important open problems in mathematics. Under normal circumstances, that would be a huge milestone. But the announcement has been overshadowed by accusations that OpenAI failed to credit researchers whose AI-assisted work influenced its solution. Whether those accusations are true or not, the episode may mark a turning point in the history of mathematics. AI models now seem essential for making progress on the field’s most important problems, but solving them may demand resources available only to a couple of frontier AI companies. If that’s the future we are headed for, it is unclear how human mathematicians will fit into it. Read on to see how AI could reshape mathematics . —Grace Huckins Batteries just broke another record in the US Battery installations hit a new record in the US in the second quarter of 2026, with 20.2 gigawatt-hours of new capacity coming online. That’s enough to supply the daily electricity needs of 600,000 homes. The surge puts the country on track for another record year, driven by cheaper batteries and an urgent need for more energy storage as renewables are added to the grid. But the boom looks different for grid-scale and residential batteries. Take a closer look at the forces reshaping the US battery market . —Casey Crownhart This entrepreneur is developing agents that can plan ahead Danijar Hafner’s office in San Francisco’s SoMa district sits mostly empty, but what it lacks in decor, it makes up for in robots. Humanoids of various shapes and sizes hang like marionettes from racks that run down the center of the wide-open space. Hafner won’t say too much about his new venture just yet, but describes it as a continuation of his longtime work to enable AI to navigate environments it has not encountered in training. Over the years, the 31-year-old has honed his approach by pitting agents trained within his world models against popular video games. More recently, he’s begun migrating his agents out of the virtual world and into physical reality. Learn more about Hafner’s work teaching AI about our world . —Mat Honan Danijar Hafner is one of the artificial intelligence honorees on our 35 Innovators Under 35 list for 2026. Meet the rest of them here , or explore the full list acr", "date_str": "2026-09-09T12:10:00+00:00", "hash": "3f5c6530d3afdb4cc0ed4a13362de67d371453c86a4fad3e2ef3d948678ddfd9", "title_fa": "دانلود: نقطه عطف OpenAI برای ریاضیات و رکورد باتری", "summary_fa": "این نسخه امروز دانلود است، خبرنامه روزهای هفته ما که دوز روزانه ای از آنچه در دنیای فناوری می گذرد را ارائه می دهد. آنچه که جدیدترین جنجال OpenAI در مورد آینده ریاضی به ما می گوید OpenAI می گوید که عوامل آن یکی از مهم ترین مسائل باز در ریاضیات را حل کرده اند. در شرایط عادی، این یک نقطه عطف بزرگ خواهد بود. اما این اعلامیه تحت الشعاع اتهاماتی مبنی بر اینکه OpenAI نتوانسته است به محققانی که کار با کمک هوش مصنوعی بر راه‌حل آن تأثیر گذاشته است اعتبار بخشد. چه این اتهامات درست باشند یا نه، این قسمت ممکن است نقطه عطفی در تاریخ ریاضیات باشد. مدل‌های هوش مصنوعی اکنون برای پیشرفت در مهم‌ترین مشکلات این حوزه ضروری به نظر می‌رسند، اما حل آنها ممکن است نیازمند منابعی باشد که فقط در اختیار چند شرکت مرزی هوش مصنوعی قرار دارند. اگر این آینده ای است که ما به سوی آن می رویم، معلوم نیست که چگونه ریاضیدانان انسانی در آن جا می شوند. در ادامه بخوانید تا ببینید چگونه هوش مصنوعی می تواند ریاضیات را تغییر دهد. — باتری های گریس هاکینز به تازگی رکورد دیگری را در نصب باتری در ایالات متحده شکسته است، در سه ماهه دوم سال 2026، با 20.2 گیگاوات ساعت ظرفیت جدید، رکورد جدیدی را در ایالات متحده ثبت کرد. این برای تامین برق مورد نیاز روزانه 600000 خانه کافی است. این افزایش، کشور را برای یک سال رکورد دیگر در مسیری قرار می دهد که ناشی از باتری های ارزان تر و نیاز فوری به ذخیره انرژی بیشتر با اضافه شدن انرژی های تجدیدپذیر به شبکه است. اما رونق برای باتری های در مقیاس شبکه و باتری های مسکونی متفاوت به نظر می رسد. به نیروهایی که بازار باتری ایالات متحده را تغییر می دهند نگاهی دقیق بیندازید. — کیسی"}, {"source": "MIT Tech Review", "title": "Batteries just broke another record in the US", "link": "https://www.technologyreview.com/2026/09/09/1143680/batteries-us-record/", "summary": "Battery installations hit a new record in the US in the second quarter of 2026. In total, 20.2 gigawatt-hours of new capacity came online, according to a new report. That’s enough to supply the daily electricity needs of about 700,000 homes. The surge is putting the country on a trajectory to see 71 gigawatt-hours of batteries installed in 2026, a 20% increase over last year. This growth is being driven by a combination of cheaper batteries and an urgent need for more energy storage capacity as renewables such as solar and onshore wind power are added to the grid. Massive, utility-scale systems are leading the way; they’re responsible for most of the record-setting quarter. Seven new gigascale battery installations (those with a capacity of over one gigawatt-hour) came online during the three-month stretch, according to the report , published by Benchmark Mineral Intelligence and the Solar Energy Industries Association. “It really came down to a handful of big projects,” says Shan Tomouk, energy storage and energy lead for Benchmark Mineral Intelligence. But there was also growth in the category of so-called behind-the-meter batteries, which include both residential and industrial battery storage systems. These projects, generally smaller than utility-scale installations, are typically owned and operated by homeowners or businesses rather than utilities or power providers. In the behind-the-meter category, data centers led the way, making up about three-quarters of new batteries in the commercial sector. But residential batteries saw a sharp slowdown. These systems are often installed in homes to store power from solar panels or serve as a backup source in case of a blackout. Home installations are projected to drop by 16% in 2026 compared with last year, according to the report. That drop happened largely because a tax credit that helped subsidize home battery systems ended in 2025, Tomouk says. Home installations should recover by the end of the decade, he adds. And tax credits for nonresidential batteries have largely survived. Overall, batteries are a bright spot in energy right now. “This is one of the strong sectors in the US,” says Isshu Kikuma, an energy storage analyst at BloombergNEF, an energy consultancy. As the battery market continues to grow, one major trend to keep an eye on is a move toward US-made technology. Today, nearly all the systems coming online use cells made in China, though some are put together into complete energy storage syst", "date_str": "2026-09-09T09:00:00+00:00", "hash": "e2557f6ee6df24388c1c15d4ab6bf497312633a8bb040fed2e31dae1bc6b1665", "title_fa": "باتری ها به تازگی یک رکورد دیگر را در ایالات متحده شکستند", "summary_fa": "نصب باتری در سه ماهه دوم سال 2026 رکورد جدیدی را در ایالات متحده به ثبت رساند. طبق یک گزارش جدید، در مجموع، 20.2 گیگاوات ساعت ظرفیت جدید آنلاین شد. این برای تامین برق مورد نیاز روزانه حدود 700000 خانه کافی است. این افزایش، کشور را در مسیر نصب 71 گیگاوات ساعت باتری در سال 2026 قرار می دهد که 20 درصد افزایش نسبت به سال گذشته نشان می دهد. این رشد به دلیل ترکیبی از باتری‌های ارزان‌تر و نیاز فوری به ظرفیت ذخیره‌سازی انرژی بیشتر است زیرا انرژی‌های تجدیدپذیر مانند انرژی خورشیدی و بادی خشکی به شبکه اضافه می‌شوند. سیستم‌های عظیم و در مقیاس ابزاری پیشرو هستند. آنها مسئول بیشتر سه ماهه ثبت رکورد هستند. بر اساس این گزارش که توسط Benchmark Mineral Intelligence و انجمن صنایع انرژی خورشیدی منتشر شده است، هفت نصب باتری جدید در مقیاس گیگا (آنهایی که ظرفیت بیش از یک گیگاوات ساعت دارند) در طول سه ماهه به صورت آنلاین عرضه شدند. شان توموک، رهبر ذخیره‌سازی انرژی و انرژی برای هوش معدنی بنچمارک، می‌گوید: «این واقعاً به تعداد انگشت شماری از پروژه‌های بزرگ منتهی شد. اما در دسته بندی باتری های به اصطلاح پشت متر نیز رشد داشت که شامل سیستم های ذخیره سازی باتری های مسکونی و صنعتی می شود. این پروژه‌ها، عموماً کوچک‌تر از تأسیسات در مقیاس شهری، معمولاً متعلق به صاحبان خانه یا مشاغل هستند و نه شرکت‌های برق یا تأمین‌کنندگان برق. در رده پشت متر، مراکز داده پیشتاز هستند و حدود سه چهارم باتری های جدید در بخش تجاری را تشکیل می دهند. اما باتری های مسکونی کاهش شدیدی را تجربه کردند. این سیستم‌ها اغلب در خانه‌ها برای ذخیره انرژی از پنل‌های خورشیدی نصب می‌شوند یا در صورت خاموشی به عنوان منبع پشتیبان عمل می‌کنند. بر اساس این گزارش، پیش‌بینی می‌شود که تاسیسات خانگی در سال 2026 نسبت به سال"}, {"source": "MIT Tech Review", "title": "Understanding the thermal ceiling in portable power", "link": "https://www.technologyreview.com/2026/09/09/1143279/understanding-the-thermal-ceiling-in-portable-power/", "summary": "Plug a phone into a modern charger and the first 10 minutes are impressive. The next 20 are not. This is not a defect. It’s the connected device protecting itself. As temperature rises during charging, a smartphone s battery management system reduces the current it will accept, because heat accelerates the chemical degradation that permanently reduces battery capacity. The charger may be capable of delivering more, but the device simply stops taking it. For anyone building products in the portable power category, this creates an uncomfortable gap between specification and experience. A device rated at 25 watts is accurate in the sense that it can deliver 25 watts. Whether it delivers 25 watts for the duration of a charge is a different question, and one the specification does not answer. The specification gap The gap matters commercially because it is invisible at the point of purchase and obvious in use. Consumers compare wattage figures on packaging. They don’t compare thermal curves, because thermal curves are not published publicly. The result is a category where products differentiate on a number that describes peak output rather than sustained output, and where the actual user experience of two products with identical specifications can diverge substantially. This is particularly acute in magnetic wireless charging. Inductive power transfer generates heat at both the transmitting and receiving coils, and the magnetic attachment that makes these products convenient also places the heat source in direct contact with the device it is charging. Convenience and thermal performance are working against each other by design. The industry s response for the past several years has been materials science. Graphite sheets, thermal interface materials, conductive housings, and heat-spreading layers have all improved how efficiently accumulated heat moves away from the source. Each generation has been incrementally better than the last. But passive dissipation has a structural limitation: it can only move heat that has already been generated, and only as fast as the surrounding air will accept it. In a sealed, pocket-sized enclosure, that ceiling arrives quickly. Improving the materials slows the rate of temperature rise. It does not prevent the temperature rise. Moving from dissipation to removal The alternative is active thermal management, which is standard in stationary electronics and largely absent from portable ones for reasons that are easy to understand. ", "date_str": "2026-09-09T08:18:13+00:00", "hash": "3f5fc90d5811fbacc115f5341d0620ce15cfa12418fd24839345d1e1bca694b7", "title_fa": "آشنایی با سقف حرارتی در برق قابل حمل", "summary_fa": "یک گوشی را به یک شارژر مدرن وصل کنید و 10 دقیقه اول تاثیرگذار خواهد بود. 20 بعدی نیست. این عیب نیست. این دستگاه متصل است که از خود محافظت می کند. با افزایش دما در حین شارژ، سیستم مدیریت باتری گوشی هوشمند جریانی را که می‌پذیرد کاهش می‌دهد، زیرا گرما تخریب شیمیایی را تسریع می‌کند که به طور دائم ظرفیت باتری را کاهش می‌دهد. شارژر ممکن است قادر به تحویل بیشتر باشد، اما دستگاه به سادگی آن را متوقف می کند. برای هر کسی که محصولاتی را در رده برق قابل حمل تولید می کند، این یک شکاف ناراحت کننده بین مشخصات و تجربه ایجاد می کند. دستگاهی با توان 25 وات از این نظر دقیق است که می تواند 25 وات تولید کند. اینکه آیا 25 وات برای مدت زمان شارژ ارائه می دهد یا خیر، سوال متفاوتی است و مشخصات آن پاسخی ندارد. شکاف مشخصات شکاف از نظر تجاری اهمیت دارد زیرا در محل خرید نامرئی و در استفاده آشکار است. مصرف کنندگان ارقام وات روی بسته بندی را مقایسه می کنند. آنها منحنی های حرارتی را با هم مقایسه نمی کنند، زیرا منحنی های حرارتی به صورت عمومی منتشر نمی شوند. نتیجه، دسته‌بندی است که در آن محصولات بر روی عددی متمایز می‌شوند که حداکثر خروجی را به جای خروجی پایدار توصیف می‌کند، و در آن تجربه کاربر واقعی دو محصول با مشخصات یکسان می‌تواند به‌طور قابل‌توجهی متفاوت باشد. این به ویژه در شارژ بی سیم مغناطیسی شدید است. انتقال توان القایی باعث تولید گرما در سیم پیچ های فرستنده و گیرنده می شود و اتصال مغناطیسی که این محصولات را راحت می کند، منبع گرما را در تماس مستقیم با دستگاهی که شارژ می کند قرار می دهد. راحتی و عملکرد حرارتی بر اساس طراحی در برابر یکدیگر کار می کنند. پاسخ صنعت در چند"}, {"source": "MIT Tech Review", "title": "What OpenAI’s latest controversy tells us about the future of math", "link": "https://www.technologyreview.com/2026/09/08/1143747/what-openais-latest-controversy-tells-us-about-the-future-of-math/", "summary": "OpenAI’s latest mathematical milestone has quickly become mired in controversy. Today, the company announced that its agents have solved one of the Millennium Prize Problems, some of the most important open problems in mathematics. Under normal circumstances, that solution would be a huge feather in OpenAI’s cap. But the announcement has been overshadowed by accusations that OpenAI used NYU mathematician Tristan Buckmaster’s and Anthropic employee Levent Alpöge’s AI-assisted work on the problem as a jumping-off point and failed to credit them. OpenAI has denied the accusations. It remains uncertain if OpenAI’s models made use of the work completed by Buckmaster and Alpöge, though Sébastien Bubeck, a member of the technical staff at OpenAI, said in a press briefing that the team was inspired to pursue the problem after hearing a rumor about Buckmaster and Alpöge’s efforts. But whether or not OpenAI’s models took advantage of Buckmaster and Alpöge’s research, this episode may mark a turning point in the history of mathematics. AI models now seem essential for making progress on the most important mathematical problems of our time, and solving them may demand resources only available at a couple of frontier AI companies, which often defy the norms of academic collaboration that undergird most mathematical progress. If that’s the future we are headed for, it is unclear how human mathematicians will fit into it. The problem that OpenAI claims to have solved is known as the Navier–Stokes existence and smoothness problem. It is one of seven Millennium Prize Problems selected by the Clay Mathematics Institute in 2000. Solutions come with a one million dollar prize; before today, only one other Millennium Prize Problem had been solved. The Navier–Stokes problem concerns a set of equations that describes how fluids, such as water and air, flow over time. The equations are widely used in the field of fluid dynamics, and they have proven powerful, but physicists and mathematicians didn’t understand them completely. In particular, it was unknown until today whether the equations might, under some conditions, break down and predict an impossible state of affairs—such as a fluid having infinite velocity. On Monday, NYU’s Buckmaster posted a proof on the social media site Mastodon showing that a simplified version of the Navier–Stokes equations can indeed break down—a major step forward on the Millennium Problem. He and Alpöge had worked on the problem for almost a year, ", "date_str": "2026-09-09T03:10:08+00:00", "hash": "689671e29225d373325e7b8f9e5d0b66cc65da526c0ffe7ec3f3ffc2d7117388", "title_fa": "آنچه که آخرین جنجال OpenAI در مورد آینده ریاضی به ما می گوید", "summary_fa": "آخرین نقطه عطف ریاضی OpenAI به سرعت درگیر بحث و جدل شد. امروز، این شرکت اعلام کرد که نمایندگانش یکی از مسائل جایزه هزاره را حل کرده اند، برخی از مهم ترین مسائل باز در ریاضیات. در شرایط عادی، این راه حل یک پر بزرگ در کلاه OpenAI خواهد بود. اما این اعلامیه تحت الشعاع اتهاماتی قرار گرفت که OpenAI از کار با هوش مصنوعی تریستان باکمستر و کارمند آنتروپیک، تریستان باکمستر، کارمند آنتروپیک و کارمند آنتروپیک بر روی این مشکل به عنوان نقطه جهشی استفاده کرده و به آنها اعتبار نداده است. OpenAI این اتهامات را رد کرده است. هنوز مشخص نیست که آیا مدل‌های OpenAI از کارهای تکمیل‌شده توسط Buckmaster و Alpöge استفاده کرده‌اند یا خیر، اگرچه Sébastien Bubeck، یکی از اعضای کادر فنی OpenAI، در یک نشست مطبوعاتی گفت که تیم پس از شنیدن شایعه‌ای د ت: حداکثر ۳ هزار دلار!", "link": "https://www.zoomit.ir/mobile/466803-leaked-foldable-iphone-price-report/", "summary": "گزارش جدید بلومبرگ نشان می‌دهد آیفون فولد اپل ممکن است در بعضی مدل‌ها تا حدود ۳ هزار دلار قیمت داشته باشد.", "date_str": "2026-09-08T14:35:38+00:00", "hash": "ce0a9b8e86db480e7a01cbb2635508153d56b549a2ee4d46cef798a8a3bd36e5", "title_fa": "قیمت آیفون فولد یک روز قبل از رونمایی لو رفت: حداکثر ۳ هزار دلار!", "summary_fa": "گزارش جدید بلومبرگ نشان می‌دهد آیفون فولد اپل ممکن است در بعضی مدل‌ها تا حدود ۳ هزار دلار قیمت داشته باشد."}, {"source": "Business Insider", "title": "My mom got cancer, and I became her caregiver at 34. It showed me I still need my mom.", "link": "https://www.businessinsider.com/caring-for-mom-cancer-caregiver-health-2026-9", "summary": "The author became her mom s caregiver when she was diagnosed with cancer. Courtesy of the author My mom was diagnosed with uterine cancer, which later progressed to Stage 4. I became her sole caregiver, attending every chemotherapy session and putting a move on hold. I developed health problems myself, and I realized caregiving didn't mean our roles disappeared. For years, my mom and I were likened to the Gilmore Girls because of our bond. But there's no episode where Rory has to tell Lorelai she has cancer. It was a reality I was forced to confront in early 2025, when my mom had to have a hysterectomy due to a large tumor pressing on her uterus. Her surgical oncologist informed me over the phone that it was cancerous while she was still in the operating room. Initially, I felt optimistic, assuming that the cancer must be gone after the tumor removal . He explained that they had biopsied some other concerning lymph nodes in her body and wouldn't be able to rule out cancer entirely until those were tested. When my mom woke up from the procedure, I assumed the surgical oncologist would return to inform her of the news. He never came back, so I had to tell my mom — the woman who gave me life — that she did, in fact, have a cancerous tumor , and that we both had to wait several weeks to find out if there was any cancer left in her body. The roles were reversed that day. I became my mom's sole caregiver . Three weeks later, we found out she had a rare form of uterine cancer — Stage 3 adenocarcinoma. I didn't miss any of my mom's appointments Even though it was traumatizing to hear my mom's diagnosis, I'm grateful I was there by her side. She credited me afterward for being able to think of informative questions to ask during the appointment, as she was in pure shock — one way I never anticipated my journalistic skills to come into good use. The author doesn t miss any of her mom s appointments. Courtesy of the author I knew my mom was a very straightforward woman, having spent 20 years in the Air Force as an aircraft maintenance technician. I understood how she found comfort in stressful situations — and that was actually understanding what she was dealing with, the truth that wasn't sugarcoated. Turning on my journalist side honestly helped me cope as well, so I went straight into question mode. What did adenocarcinoma mean? Why didn't it go away when they removed my mom's uterus and the large tumor that led to this situation in the first place? Adenocarcinoma", "date_str": "2026-09-09T12:38:01+00:00", "hash": "f7b8653dbd56f1c519d6bf55f58bb1147508fd278eea91d994789bcff9b08f1c", "title_fa": "مادرم سرطان گرفت و من در 34 سالگی مراقب او شدم. این به من نشان داد که هنوز به مادرم نیاز دارم.", "summary_fa": "نویسنده هنگامی که به سرطان مبتلا شد، مراقب مادرش شد. با حسن نیت نویسنده مادرم مبتلا به سرطان رحم تشخیص داده شد که بعداً به مرحله 4 پیشرفت کرد. من تنها مراقب او شدم و در هر جلسه شیمی درمانی شرکت می کردم و حرکت را به حالت تعلیق در می آوردم. من خودم دچار مشکلات سلامتی شدم و متوجه شدم که مراقبت به معنای ناپدید شدن نقش ما نیست. سال‌ها من و مادرم را به خاطر پیوندمان به دختران گیلمور تشبیه می‌کردند. اما هیچ قسمتی وجود ندارد که روری مجبور شود به لورلای بگوید که سرطان دارد. این واقعیتی بود که در اوایل سال 2025 مجبور شدم با آن روبرو شوم، زمانی که مادرم به دلیل فشار دادن تومور بزرگ روی رحمش مجبور به هیسترکتومی شد. انکولوژیست جراحی او در حالی که هنوز در اتاق عمل بود از طریق تلفن به من اطلاع داد که سرطانی است. در ابتدا، با این فرض که سرطان باید پس از برداشتن تومور از بین برود، خوشبین بودم. او توضیح داد که آنها برخی غدد لنفاوی دیگر را در بدن او بیوپسی کرده اند و تا زمانی که آزمایش نشوند نمی توانند سرطان را به طور کامل رد کنند. وقتی مادرم از عمل بیدار شد، تصور می‌کردم انکولوژیست جراحی برمی‌گردد تا او را از این خبر مطلع کند. او هرگز برنگشت، بنابراین من مجبور شدم به مادرم - زنی که به من زندگی داد - بگویم که او در واقع یک تومور سرطانی دارد و هر دو باید چندین هفته منتظر بمانیم تا بفهمیم آیا سرطانی در بدن او باقی مانده است یا خیر. آن روز نقش ها برعکس شد. من تنها مراقب مادرم شدم. سه هفته بعد، متوجه شدیم که او دارای یک نوع نادر سرطان رحم است - مرحله 3 آدنوکارسینوم. من هیچ یک از قرارهای ملاقات مادرم را از دست"}, {"source": "Business Insider", "title": "Why Pepsi's surprise $1.7 billion Publicis deal has Madison Avenue reeling", "link": "https://www.businessinsider.com/pepsi-publicis-deal-underscores-realities-of-agency-consolidation-2026-9", "summary": "Kevin Carter/Getty Images A version of this post appears in the CMO Insider newsletter. Sign up for Business Insider's weekly marketing newsletter . Forget the Jets and the Sharks, the Yankees and the Red Sox, or Arsenal v. Spurs (on my side of the pond). Few rivalries run as deep as Coca-Cola and Pepsi . That explains why Madison Avenue was so stunned by last week's news: Publicis Groupe had won PepsiCo's $1.7 billion global media, data, and tech account without a traditional pitch. (Omnicom was Pepsi's global media partner for more than 25 years, though Publicis media agencies did already work with the beverage and snacks giant in some markets in Asia.) The context: Publicis handles Coca-Cola's media in North America — and was competing against incumbent WPP for Coke's global business. \"I was gobsmacked and shellshocked all week,\" one marketing consultant told me. Another sent me an unprintable expletive. Two people familiar with the matter told me Publicis has withdrawn from Coke's global pitch and is set to resign the North America account — a business it had won from WPP last year. The Coke North America business is estimated to be worth $805 million, while the global business amounts to $1.8 billion in spending, per the research company COMvergence. AdAge reported on Tuesday that Coke is now planning to put its North American media business back under review. Publicis' coup is widely viewed as a masterstroke by Arthur Sadoun's company , which similarly clinched Microsoft's media business in April without a formal pitch. It also shows how consolidation of the agency landscape is reshaping CMOs' options — particularly for marketers who demand category exclusivity. Madison Avenue's review culture When Coca-Cola confirmed its global media review in June, Pepsi's marketing team quickly seized the opportunity to strike before it was too late. If Publicis had won Coke, Pepsi would have had few obvious alternatives to retaining Omnicom as its global media partner. WPP and Publicis' relationship with Coke would have made those agencies off-limits, and Omnicom's acquisition of IPG , as well as Dentsu's international struggles , left few other scaled global media operations in the market for a company of PepsiCo's size. \"Top-to-top dealmaking is getting more prevalent vis-a-vis running a process with guarantees on people, remuneration, and media cost,\" said Ruben Schreurs, CEO of the marketing consultancy Ebiquity. \"Is this a sign of the times to come?\" It's an", "date_str": "2026-09-09T12:30:23+00:00", "hash": "8470285190871bb71ef0e7a04a1947ba90076ec3e35a4dbe4c83d3c179185cae", "title_fa": "چرا قرارداد غافلگیرکننده 1.7 میلیارد دلاری پپسی با Publicis، خیابان مدیسون را متحول کرده است", "summary_fa": "کوین کارتر/گتی ایماژ نسخه ای از این پست در خبرنامه CMO Insider ظاهر می شود. برای خبرنامه بازاریابی هفتگی Business Insider ثبت نام کنید. جت‌ها و کوسه‌ها، یانکی‌ها و رد ساکس، یا آرسنال مقابل اسپرز (در کنار برکه) را فراموش کنید. تعداد کمی از رقابت ها به عمق کوکاکولا و پپسی هستند. این توضیح می‌دهد که چرا خیابان مدیسون از اخبار هفته گذشته بسیار متحیر شده بود: Publicis Groupe 1.7 میلیارد دلار حساب رسانه‌ها، داده‌ها و فناوری جهانی PepsiCo را بدون پیش‌فرض سنتی برنده شده بود. (Omnicom بیش از 25 سال شریک رسانه ای جهانی پپسی بود، اگرچه آژانس های رسانه ای Publicis قبلاً با غول نوشیدنی و تنقلات در برخی از بازارهای آسیا کار می کردند.) زمینه: Publicis رسانه های کوکاکولا در آمریکای شمالی را مدیریت می کند - و با WPP فعلی برای تجارت جهانی Coke رقابت می کرد. یکی از مشاوران بازاریابی به من گفت: «تمام هفته شوکه بودم و شوکه بودم. دیگری برای من یک اکسپلیت غیر قابل چاپ فرستاد. دو نفر از افراد آشنا به این موضوع به من گفتند Publicis از فعالیت جهانی Coke کناره‌گیری کرده و قرار است از حساب آمریکای شمالی کناره‌گیری کند - تجارتی که سال گذشته از WPP برنده شده بود. ارزش تجارت کک در آمریکای شمالی 805 میلیون دلار تخمین زده می شود، در حالی که بر اساس شرکت تحقیقاتی COMvergence، تجارت جهانی 1.8 میلیارد دلار هزینه دارد. AdAge روز سه‌شنبه گزارش داد که Coke اکنون در حال برنامه‌ریزی برای بازنگری تجارت رسانه‌ای خود در آمریکای شمالی است. کودتای Publicis به طور گسترده به عنوان یک شاهکار توسط شرکت آرتور سادون تلقی می شود که به طور مشابه تجارت رسانه ای مایکروسافت را در ماه آوریل بدون ارائه رسمی قطعی کرد. همچنین نشان می‌دهد که چگونه یکپارچه‌سازی چشم‌انداز آژانس، گزینه‌های CMOs را تغییر شکل می‌دهد - به‌ویژه برای بازاریاب‌هایی"}, {"source": "Business Insider", "title": "Gap taps a new exec to find its next act beyond fashion", "link": "https://www.businessinsider.com/gap-hired-paramount-exec-to-help-take-brands-beyond-clothes-2026-9", "summary": "Jamie Drew, Gap Inc. s new head of strategic partnerships and growth, wants to move Gap beyond apparel. Gap Inc. Gap Inc. just made a big hire to help the company move beyond clothes. Jamie Drew will seek out partnerships and new businesses in areas that could include travel, sports, and gaming. Gap has made notable forays into music, but it's risky for brands to go into non-core areas. Gap Inc. wants to be in the middle of the cultural conversation — and just tapped a new exec to grow its business beyond clothes. Gap has hired Jamie Drew as its new head of strategic partnerships and growth, reporting to chief entertainment officer Pam Kaufman, the company exclusively told Business Insider. Drew is tasked with helping push Gap's brands — including Old Navy, Banana Republic, and Athleta, as well as Gap — beyond apparel to other consumer touchpoints. Her mandate is to look beyond traditional fashion partnerships to areas where the parent company or its individual brands could reach new audiences and create new businesses. The company said those areas could include experiences and destinations, hospitality or travel, sports and fitness communities, gaming, and food and beverage. Drew was most recently EVP of consumer products and experiences at Paramount Global, also Kaufman's alma mater, following 15 years at its kids channel Nickelodeon. She helped build the kids' franchise Paw Patrol into a retail business, acquire Teenage Mutant Ninja Turtles, take SpongeBob SquarePants to Broadway, and open the first Nickelodeon Hotel. Drew said her most successful initiatives embodied the brand's DNA. \"Brand partnerships only work when they're truly authentic to the brand's ethos and extend its consumer relevance,\" she said. Reimagining Gap has been a top priority for Richard Dickson, who has revived the retail giant since becoming CEO in 2023. This year, Gap tapped Kaufman for its first chief entertainment role, Walmart alum Justin Breton to drive original content, and Paramount alum Lourdes Arocho to head up licensing. Gap has made headlines for its cultural marketing The company has already been inserting itself into culture — and the Gap brand is its star. Over the past year, the Gap brand has tapped into celebrities and cultural events to draw attention. It cast global pop girl group Katseye in an ad, produced a video with Puerto Rican artist Young Miko around Bad Bunny's Super Bowl halftime show, became Coachella's exclusive apparel sponsor and merch partner, and ", "date_str": "2026-09-09T12:30:01+00:00", "hash": "3db8d71a4f77c942612821927f48c76c7a949af10eb38c51dbd32cc71fa67c8a", "title_fa": "Gap به یک مدیر اجرایی جدید ضربه می زند تا عمل بعدی خود را فراتر از مد پیدا کند", "summary_fa": "جیمی درو، رئیس جدید مشارکت های استراتژیک و رشد شرکت گپ، می خواهد گپ را فراتر از پوشاک حرکت دهد. Gap Inc. Gap Inc به تازگی استخدام بزرگی کرده است تا به شرکت کمک کند فراتر از لباس حرکت کند. جیمی درو به دنبال مشارکت و کسب و کارهای جدید در زمینه هایی است که می تواند شامل سفر، ورزش و بازی باشد. گپ هجوم های قابل توجهی به موسیقی داشته است، اما رفتن برندها به حوزه های غیر اصلی خطرناک است. Gap Inc. می‌خواهد در میانه گفتگوی فرهنگی باشد - و فقط یک مدیر اجرایی جدید را انتخاب کرده تا تجارت خود را فراتر از لباس توسعه دهد. شرکت Gap به طور انحصاری به Business Insider گفت که Gap جیمی درو را به عنوان رئیس جدید مشارکت‌های استراتژیک و رشد استخدام کرده است و به مدیر ارشد سرگرمی Pam Kaufman گزارش می‌دهد. Drew وظیفه دارد به برندهای Gap - از جمله Old Navy، Banana Republic، و Athleta، و همچنین Gap - فراتر از پوشاک به سایر نقاط تماس مصرف‌کننده کمک کند. وظیفه او این است که فراتر از مشارکت های مد سنتی به مناطقی نگاه کند که شرکت مادر یا برندهای فردی آن بتوانند مخاطبان جدیدی را جذب کنند و کسب و کارهای جدیدی ایجاد کنند. این شرکت گفت که این حوزه ها می تواند شامل تجربیات و مقاصد، مهمان نوازی یا مسافرت، اجتماعات ورزش و تناسب اندام، بازی و غذا و نوشیدنی باشد. Drew اخیراً EVP محصولات مصرفی و تجربیات خود را در Paramount Global، همچنین دانشگاه کافمن، پس از 15 سال در کانال بچه‌های Nickelodeon انجام داد. او کمک کرد تا امتیاز بچه‌ها Paw Patrol را به یک تجارت خرده‌فروشی تبدیل کند، لاک‌پشت‌های نینجا جهش یافته نوجوان را به دست آورد، باب اسفنجی را به برادوی برد و اولین هتل نیکلودئون را افتتاح کرد. درو گفت که"}, {"source": "Business Insider", "title": "This startup raised $10 million to bring AI to old factories", "link": "https://www.businessinsider.com/this-startup-raised-10-million-to-bring-ai-old-factories-2026-9", "summary": "Harmoni cofounders David Caputo and Adam Ellis David Caputo and Adam Ellis Harmoni has raised $10 million from Bessemer Venture Partners to modernize factory floors. The funding comes as the US tries to reindustrialize after years of offshoring. Harmoni's new AI product, HAL, is designed to help workers automate routine tasks. Silicon Valley wants to build highly automated factories from scratch. This startup is betting on the ones America already has. Harmoni, which makes custom tablets and AI software for factory floors, has raised $10 million in Series A funding led by Bessemer Venture Partners, the company told Business Insider exclusively. It declined to disclose its valuation. Harmoni has around 40 customers and expects to add another 10 this month, with aerospace and defense making up its largest customer segment. The funding comes as the US tries to reindustrialize after years of offshoring. Some startups, including Hadrian and Machina Labs , are building new factories designed to rely heavily on robots and automation. Harmoni, by contrast, is targeting the roughly 280,000 American factories filled with traditional machinery and workers. \"We've built this specifically to arm these guys to compete with these autonomous factories,\" cofounder David Caputo told Business Insider. Harmoni, which was founded in 2023, is competing in a crowded market where manufacturers already rely on a patchwork of software. Companies, including MachineMetrics and Datanomix, track machines and production, while other tools track workers, machine maintenance, and the steps required for specific jobs. Harmoni's pitch is that factories should not have to stitch all those systems together themselves — a problem Caputo and his cofounder, Adam Ellis, a longtime manufacturing consultant, said they repeatedly encountered while working with factories. At the center of Harmoni's system are custom tablets that attach magnetically to factory machines and can connect with equipment ranging from modern systems to machines built during World War II. Workers can use the tablets to clock in, pull up instructions, track jobs, and report problems from one place. A Harmoni tablet Harmoni Shokoufeh Mirzaei, chair and professor of industrial and manufacturing engineering at Cal Poly Pomona, said large companies like Amazon are far ahead on automation, while many small and midsize US factories lack basic analytics and run on technology that predates the internet. \"We find the average factory i", "date_str": "2026-09-09T12:01:01+00:00", "hash": "7a2aa3a8c6ab80b5bf29cd504e51a32dccb03853a3fdc143177bfe8038df5ad8", "title_fa": "این استارت آپ 10 میلیون دلار برای آوردن هوش مصنوعی به کارخانه های قدیمی جمع آوری کرد", "summary_fa": "بنیانگذاران هارمونی دیوید کاپوتو و آدام الیس دیوید کاپوتو و آدام الیس هارمونی 10 میلیون دلار از Bessemer Venture Partners جمع آوری کرده اند تا کف کارخانه ها را مدرن کنند. این بودجه زمانی به دست می آید که ایالات متحده پس از سال ها تلاش برای صنعتی شدن مجدد دارد. محصول جدید هوش مصنوعی هارمونی، HAL، برای کمک به کارگران در خودکارسازی وظایف روتین طراحی شده است. سیلیکون ولی می خواهد کارخانه های بسیار خودکار را از ابتدا بسازد. این استارت‌آپ روی استارت‌آپ‌هایی شرط‌بندی می‌کند که آمریکا از قبل دارد. این شرکت به طور انحصاری به Business Insider گفت که Harmoni که تبلت‌های سفارشی و نرم‌افزارهای هوش مصنوعی را برای کف کارخانه‌ها تولید می‌کند، 10 میلیون دلار بودجه سری A به رهبری Bessemer Venture Partners جمع‌آوری کرده است. از افشای ارزش خود خودداری کرد. هارمونی حدود 40 مشتری دارد و انتظار دارد در این ماه 10 مشتری دیگر اضافه کند که بخش هوافضا و دفاع بزرگترین بخش مشتریان آن را تشکیل می دهند. این بودجه زمانی به دست می آید که ایالات متحده پس از سال ها تلاش برای صنعتی شدن مجدد دارد. برخی از استارت آپ ها، از جمله آزمایشگاه هادریان و ماشینا، در حال ساخت کارخانه های جدیدی هستند که به شدت به ربات ها و اتوماسیون تکیه دارند. در مقابل، هارمونی تقریباً 280000 کارخانه آمریکایی پر از ماشین آلات و کارگران سنتی را هدف قرار داده است. دیوید کاپوتو، یکی از بنیانگذاران، به Business Insider گفت: \"ما این را به طور خاص برای مسلح کردن این افراد برای رقابت با این کارخانه های خودمختار ساخته ایم.\" هارمونی، که در سال 2023 تأسیس شد، در بازار شلوغی رقابت می کند که تولیدکنندگان از قبل به مجموعه ای از نرم افزارها متکی هستند. شرکت‌هایی، از جمله MachineMetrics و Datanomix، ماشین‌ها و تولید را ردیابی می‌کنند، در حالی که"}, {"source": "Business Insider", "title": "Brands are pushing influencers to hide their paid deals", "link": "https://www.businessinsider.com/brands-asking-creators-not-disclose-paid-partnerships-influencer-marketing-study-2026-9", "summary": "Influencer marketing has a surprisingly persistent #ad disclosure problem. fotostorm/Getty Images Influencer marketing is booming. So is its ad disclosure problem. New research shared with BI found that brands are asking creators not to disclose paid partnerships. The SheSpeaks survey also found 14% of creators said they didn't always disclose brand ties. Brands have a proposition for influencers: What if you didn't make those pesky #ad disclosures? The Utah-based wellness influencer Sharon Johnson, who describes herself in her Instagram bio as a \"Reformed Tradwife,\" said a supplement company recently asked her not to include an #ad disclosure in posts showing her receiving and opening the company's product. Johnson said she labeled the posts anyway, wary of losing her audience's trust and of a potential penalty from the Federal Trade Commission, which mandates clear labeling . The brand's request also rubbed her the wrong way. \"It almost feels like these companies are taking advantage of us because we are doing this for our livelihood,\" she said. That request from the supplement brand was part of a broader trend. A survey of 365 creators conducted for Business Insider by the influencer marketing company SheSpeaks found nearly one in five (18%) said a brand had explicitly requested that they not disclose a partnership in the past year. It's not just brands that are flouting the FTC rules . In the survey, 14% of creators said they didn't always disclose partnerships, up from 2% when SheSpeaks conducted a similar survey a decade ago. Eighty-four percent said they \"always or almost always\" made their brand partnerships clear, down from 95% in the prior survey. \"The fact that disclosure went down was very surprising — we expected everyone to say, or at least know to say, yes,\" said Aliza Freud, CEO of SheSpeaks. \"Paradoxically, it's a little bit more like the Wild West\" now than a decade ago, Freud added. The FTC states that influencers should ensure people see and understand ad disclosures using \"simple and clear language,\" such as by thanking the brand for sending a free product or by using terms like \"advertisement,\" \"ad,\" or \"sponsored.\" The FTC doesn't mandate specific wording, but says the relationship must be displayed \"clearly and conspicuously\" to the viewer. Several creators and talent reps said requests to forgo disclosures were rare and tended to come from smaller brands rather than from big public companies. Leila Marsh, chief talent officer of Th", "date_str": "2026-09-09T11:41:24+00:00", "hash": "3d16ca91d7c5f7fb1aeec0339b7ac64ba5608f6ddae03cdeaff8328a5ae2ac26", "title_fa": "برندها اینفلوئنسرها را تحت فشار قرار می دهند تا معاملات پولی خود را پنهان کنند", "summary_fa": "اینفلوئنسر مارکتینگ یک مشکل دائمی #افشای آگهی دارد. fotostorm/Getty Images اینفلوئنسر مارکتینگ در حال رونق است. مشکل افشای آگهی آن نیز همینطور است. تحقیقات جدیدی که با BI به اشتراک گذاشته شده است نشان می‌دهد که برندها از سازندگان می‌خواهند که مشارکت‌های پولی را افشا نکنند. نظرسنجی SheSpeaks همچنین نشان داد که 14 درصد از سازندگان گفته‌اند که همیشه روابط برند را فاش نمی‌کنند. برندها پیشنهادی برای اینفلوئنسرها دارند: اگر این افشای #تبلیغات مزاحم را انجام نمی دادید، چه؟ شارون جانسون، اینفلوئنسر سلامتی ساکن یوتا، که خود را در بیوگرافی اینستاگرام خود به عنوان یک \"بازرگان اصلاح شده\" معرفی می کند، گفت که یک شرکت مکمل اخیراً از او خواسته است که در پست هایی که نشان می دهد او محصول شرکت را دریافت و باز می کند، افشای #تبلیغ را وارد نکند. جانسون گفت که به هر حال پست‌ها را برچسب زده است، زیرا نگران از دست دادن اعتماد مخاطبانش و مجازات احتمالی کمیسیون تجارت فدرال است که برچسب‌گذاری واضح را الزامی می‌کند. درخواست برند نیز او را به راه نادرستی مالش داد. او گفت: «تقریباً احساس می‌شود که این شرکت‌ها از ما سوء استفاده می‌کنند، زیرا ما این کار را برای امرار معاش خود انجام می‌دهیم. این درخواست از سوی برند مکمل بخشی از یک روند گسترده تر بود. نظرسنجی از 365 سازنده که توسط شرکت اینفلوئنسر مارکتینگ SheSpeaks برای Business Insider انجام شد، نشان داد که تقریباً از هر پنج نفر یک نفر (18٪) می‌گویند که یک برند صراحتاً درخواست کرده است که در سال گذشته شراکت را فاش نکنند. فقط برندها نیستند که قوانین FTC را زیر پا می گذارند. در این نظرسنجی، 14 درصد از سازندگان گفتند که همیشه شراکت‌هایشان را فاش نمی‌کنند، در حالی که یک دهه پیش SheSpeaks یک نظرسنجی مشابه را انجام داد، این رقم 2 درصد بود. هشتاد و چهار درصد"}, {"source": "Business Insider", "title": "The uncomfortable question behind OpenAI's math fight", "link": "https://www.businessinsider.com/openai-math-fight-ai-front-run-user-ideas-data-safe-2026-9", "summary": "OpenAI CEO Sam Altman said the economy had so much inertia. Chip Somodevilla/Getty Images This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . Could using AI to help you with your next big idea ultimately lead AI giants to beat you to the punch? A professor and OpenAI are trading jabs over the progress made on a math problem so difficult to solve that there's a $1 million prize for doing it. The entire saga raises questions about credit for AI-powered work and the data used to train models , writes BI's Ben Shimkus. NYU math professor Tristan Buckmaster announced major progress related to the Navier-Stokes problem only to be followed less than 24 hours later by OpenAI, which proposed a full-blown solution. (Even if you skipped algebra in high school, stay with me here. I'll keep it high level.) Buckmaster was first to post about advancements he made tackling the problem with the help of AI models, including OpenAI's. His post also detailed a tense back-and-forth with OpenAI about their competing research. According to Buckmaster, OpenAI suggested coordinating any announcements and not mentioning Buckmaster's partner, Levent Alpöge, who works for (wait for it) Anthropic. ( You can read Buckmaster's whole post here .) OpenAI computer scientist Sebastien Bubeck pushed back against parts of Buckmaster's post, saying he \"never ever asked Levent to be removed from authorship of his own work.\" Buckmaster said OpenAI acknowledged working on the problem after it learned of his research, but told him \"the model did not look up user data.\" On Tuesday, OpenAI published what it says is a solution to the Navier-Stokes problem . The company said it didn't see Buckmaster and Alpöge's work before they publicly released it, but also couldn't rule out that \"de-identified data derived from their usage of our products helped improve our models⁠.\" You don't have to understand long division to see some potential issues here. Mainly, does using AI models mean you risk their owners front-running your idea? According to OpenAI, its proof is very different from Buckmaster and Alpöge's work. And Buckmaster didn't accuse OpenAI of anything specifically, instead saying he just wanted to lay out the timeline of events. But let's say you had a killer idea for bridesmaid dresses you're toying with in ChatGPT. Right before you're ready to launch, OpenAI announces it's releasing its own app focused on bridesma", "date_str": "2026-09-09T11:32:58+00:00", "hash": "db2a82608978aa86c3b5a25af5312ef7fb5e85d00da67c9f6b98e9dcd7403126", "title_fa": "سوال ناراحت کننده پشت مبارزه ریاضی OpenAI", "summary_fa": "سام آلتمن، مدیر عامل OpenAI گفت که اقتصاد اینرسی بسیار دارد. Chip Somodevilla/Getty Images این پست در اصل در خبرنامه Business Insider Today منتشر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. آیا استفاده از هوش مصنوعی برای کمک به ایده بزرگ بعدی‌تان می‌تواند در نهایت غول‌های هوش مصنوعی را به شکست شما سوق دهد؟ یک پروفسور و OpenAI در حال معامله در مورد پیشرفت های حاصل شده در یک مسئله ریاضی هستند که حل آن به قدری دشوار است که برای انجام آن یک میلیون دلار جایزه در نظر گرفته شده است. بن شیمکوس از BI می نویسد: کل حماسه سوالاتی را در مورد اعتبار کار مبتنی بر هوش مصنوعی و داده های مورد استفاده برای آموزش مدل ها ایجاد می کند. تریستان باکمستر، استاد ریاضی دانشگاه نیویورک، پیشرفت بزرگی را در رابطه با مسئله ناویر-استوکس اعلام کرد که کمتر از 24 ساعت بعد توسط OpenAI، که یک راه حل کامل پیشنهاد کرد، دنبال شد. (حتی اگر در دبیرستان جبر را رد کردید، اینجا با من بمانید. من آن را در سطح بالا نگه خواهم داشت.) Buckmaster اولین بار بود که در مورد پیشرفت هایی که برای حل این مشکل با کمک مدل های هوش مصنوعی از جمله OpenAI ایجاد کرده بود پست کرد. پست او همچنین به تفصیل یک رفت و برگشت پر تنش با OpenAI در مورد تحقیقات رقیب آنها را توضیح داد. به گفته Buckmaster، OpenAI پیشنهاد کرده است که هر گونه اطلاعیه را هماهنگ کرده و از شریک Buckmaster، Levent Alpöge، که برای (منتظر آن) Anthropic کار می کند، نام نبرد. (شما می توانید کل پست Buckmaster را در اینجا بخوانید.) سباستین بابک، دانشمند کامپیوتر OpenAI، بخش هایی از پست Buckmaster را عقب نشینی کرد و گفت که \"هیچ وقت از لونت نخواسته است که از نویسندگی کار خود حذف"}, {"source": "Business Insider", "title": "TikTok star Vivian Tu is bringing her ‘Your Rich BFF’ persona to a new AI finance app", "link": "https://www.businessinsider.com/tiktoker-vivian-tu-bringing-voice-to-new-ai-finance-app-2026-9", "summary": "Vivian Tu says she wants to make financial advice accessible with her new app. Jenny Anderson TikTok star Vivian Tu has a new financial app that gives customized advice in her distinctive voice. Ask Dolly charges $19 a month or $59 a month for a human expert. The app trades on her popularity, but Tu said she hopes it'll become an independent success. TikToker Vivian Tu, the popular financial creator who goes by \"Your Rich BFF,\" has a new way for fans to talk to her. On Wednesday, Tu is launching out of beta a new iOS app, Ask Dolly, which provides customized markets news and financial info — all in her signature relatable voice, Business Insider exclusively learned. For example, here's how the app describes \"The Cost of Borrowing Money\" in a section that tracks 10-year treasuries, 30-year mortgages, and other financial information: \"When Fed Daddy changes interest rates, mortgages, credit cards, and savings accounts all feel it.\" Meanwhile, the app uses \"dolly\" as shorthand for dollars. To Tu, personal touches like these are what set Ask Dolly apart from other finance apps. \"I hope that it shines through in this app that it's a lot less suit-and-tie and a lot more everyday person,\" Tu said. Ask Dolly has two tiers. For $19 a month, users can get unlimited conversations with an AI financial tool, Pocket Dolly, that's based on Tu and other sources. They also get personalized portfolio \"recipes,\" spending tips, and economic news. Those paying $59 a month get three monthly conversations with a (human) certified financial planner and early access to new features. The app doesn't hold users' funds. Beyond subscriptions, Ask Dolly seeks to make money from brand partnerships that it says are vetted by certified financial planners and disclosed to users, and from affiliate fees from vendors who are featured in a Marketplace section. Consumers have a multitude of personal finance and budgeting apps to choose from. Other creators have gotten into the space, including Caleb Hammer with DollarWise ($14.99 a month) and MrBeast, whose company this year acquired Step Financial , a banking app geared toward teens. Then there are robo advisors like Betterment (fees starting at $5 a month) and Fidelity Go (0.35% for balances over $25,000) that provide automated money management, while legacy players like Chase and Bank of America have apps that include free planning tools. Tu, 32, a former Wall Street trader turned finfluencer , has more than 10 million social media follower", "date_str": "2026-09-09T11:15:01+00:00", "hash": "6ec07abe8d04b8ef2dc06915cc30c12a0cdb1869c3d5fdeda478fef23e167a88", "title_fa": "ویویان تو، ستاره TikTok، شخصیت \"Your Rich BFF\" خود را به یک برنامه مالی جدید هوش مصنوعی آورده است.", "summary_fa": "ویویان تو می‌گوید که می‌خواهد با اپلیکیشن جدیدش مشاوره‌های مالی را در دسترس قرار دهد. ویویان تو، ستاره TikTok، جنی اندرسون، یک برنامه مالی جدید دارد که با صدای متمایز خود توصیه های سفارشی را ارائه می دهد. Ask Dolly 19 دلار در ماه یا 59 دلار در ماه برای یک متخصص انسانی دریافت می کند. این برنامه با محبوبیت او معامله می کند، اما تو گفت امیدوار است که به یک موفقیت مستقل تبدیل شود. TikToker Vivian Tu، خالق محبوب مالی که با نام «Your Rich BFF» شناخته می‌شود، روش جدیدی برای طرفداران دارد تا با او صحبت کنند. بیزینس اینسایدر به طور انحصاری آموخته است که در روز چهارشنبه، Tu در حال راه اندازی از نسخه بتا یک برنامه جدید iOS به نام Ask Dolly است که اخبار بازار و اطلاعات مالی سفارشی شده را ارائه می دهد - همه اینها با صدای قابل ارتباط با امضای او. برای مثال، در اینجا نحوه توصیف برنامه «هزینه وام گرفتن پول» در بخشی که خزانه‌های 10 ساله، وام‌های مسکن 30 ساله و سایر اطلاعات مالی را دنبال می‌کند، توضیح داده می‌شود: «وقتی Fed Daddy نرخ‌های بهره، وام‌های مسکن، کارت‌های اعتباری و حساب‌های پس‌انداز را تغییر می‌دهد، همه آن را احساس می‌کنند.» در همین حال، برنامه از \"دالی\" به عنوان مخفف دلار استفاده می کند. برای Tu، کارهای شخصی مانند این مواردی است که Ask Dolly را از سایر برنامه های مالی متمایز می کند. تو گفت: \"امیدوارم که در این برنامه بدرخشد که کت و شلوار و کراوات بسیار کمتری داشته باشد و افراد روزمره بسیار بیشتری داشته باشند.\" Ask Dolly دو طبقه دارد. با 19 دلار در ماه، کاربران می توانند مکالمات نامحدودی را با ابزار مالی هوش مصنوعی، Pocket Dolly، که بر اساس Tu و منابع دیگر است، دریافت کنند. آنها همچنین «دستورالعمل‌ها»، نکات مربوط به هزینه‌ها و"}, {"source": "Business Insider", "title": "An Anthropic researcher just quit, saying OpenAI and Anthropic are 'gambling with our lives'", "link": "https://www.businessinsider.com/anthropic-researcher-quits-over-ai-safety-concerns-2026-9", "summary": "Neither company is acting responsibly, Jacob Coxon wrote on X. Imen Ben Youssef / Hans Lucas / AFP via Getty Images An AI researcher said he has left Anthropic, warning that AI labs have been reckless towards safety risks. \"Neither company is acting responsibly,\" he wrote in a departure note. OpenAI and Anthropic have been facing resignations over concerns about AI advancement safety. An Anthropic researcher who previously worked at OpenAI said he quit — and warned that the AI race has become dangerously reckless . Jacob Coxon announced his resignation from Anthropic on Tuesday, saying he had spent the past three years doing pre-training research at the two AI giants. \"Neither company is acting responsibly,\" Coxon wrote on X. \"They are racing straight to self-improving superintelligence and gambling with our lives.\" Coxon was a member of OpenAI's technical staff from 2023 until July 2026, when he moved to Anthropic as a researcher. His research at OpenAI included work on GPT-4o. In Tuesday's post, Coxon said the two labs have not been transparent about their fears regarding AI. \"The people building AI earnestly believe that it could kill us all by the end of the decade. This is not a marketing stunt,\" he wrote. \"If anything, many executives and senior researchers will couch their phrasing in the press to sound sensible — but I hear the same people express fear privately.\" There is one difference between the two companies, he said. \"At OpenAI, many have not deeply internalized the civilizational stakes ,\" Coxon wrote. \"At Anthropic, the stakes are well-understood, but I شامل کار بر روی GPT-4o بود. در پست روز سه‌شنبه، کاکسون گفت که این دو آزمایشگاه در مورد ترس‌هایشان در مورد هوش مصنوعی شفاف نبوده‌اند. او نوشت: \"افرادی که هوش مصنوعی می‌سازند، عمیقاً معتقدند که می‌تواند تا پایان دهه همه ما را بکشد. این یک شیرین کاری بازاریابی نیست.\" \"در هر صورت، بسیاری از مدیران و محققان ارشد عبارات خود را در مطبوعات بیان می کنند تا معقول به نظر برسند - اما من می شنوم که همان افراد به طور خصوصی ترس خود را ابراز می کنند.\" او گفت که یک تفاوت بین این دو شرکت وجود دارد. کاکسون نوشت: \"در OpenAI، بسیاری از مخاطرات تمدنی را عمیقاً درونی نکرده اند.\" در آنتروپیک، مخاطرات به خوبی درک شده است، اما آنها در یک مسابقه برای"}, {"source": "Business Insider", "title": "We've been to Kauai 3 times. I want to show my son new places, but I can't help booking a vacation there.", "link": "https://www.businessinsider.com/family-vacation-same-place-kauai-2026-9", "summary": "The author and her family have been to Kauai three times in six years. Courtesy of Nicole Findlay My family loves to travel, and I want to show my son, 9, as many new places as possible. However, I just can't help myself — I love going to Kauai. We've been three times in six years, and I know we'll go again. Every year, I ask my family the same question, \"Where should we go this summer?\" I want to pick somewhere new. Choosing a place we've already been to seems like a waste of an opportunity for my 9-year-old son to experience different places , cultures, and people. Plus, I want to see new countries and continents, too. But I keep booking Kauai — we just can't stay away. Over the last six years, my little family of three has flown from California to Kauai three times to visit the sea turtles at Poipu Beach, hike gorgeous coastal trails, drink Mai Tais at hotel bars, and watch the sunset from our lanai. It s easy to enjoy the outdoors in Kauai. Courtesy of Nicole Findlay I want to show my son the world, but there's something about The Garden Isle Every time we arrive at Lihue Airport, we're greeted by chickens. I love them — my camera roll is full of the feathered locals. Palm trees sway outside the terminal, and the air smells fresh and feels soft, especially after five hours on an airplane. And with the windows down and Hawaiian music on the radio, the drive to our hotel always marks the official start to a week of swimming, snorkeling, hiking, and relaxing beachside. We are a family that loves spending time outdoors , and Kauai makes it easy. The author and her family enjoy visiting the beach and seeing sea turtles while on vacation. Courtesy of Nicole Findlay We have a favorite hotel I don't usually book the same hotel twice, but the Koloa Landing Resort on Kauai truly stole my son's heart, and he's only young once. Here, tropical greenery is everywhere, broken up by pops of red, orange, and white. Plumeria flowers cover the ground, and the floral scent is more relaxing than any candle I have at home. On more than one occasion, I've followed my son over a teak bridge, past a cascading infinity edge and waterslides tucked into the landscape, until he spots exactly what he's looking for: the lava grotto. There's no easy way in if you're trying to keep your hair dry. You either swim underwater or go straight through a waterfall. It's my son's favorite part of the massive 350,000-gallon main pool. Long after we've left Kauai, my son always asks when we get", "date_str": "2026-09-09T10:21:01+00:00", "hash": "64b03b8f56ed02cc52d6c070cf07f60facb72a14457dba47b877d7a265457d14", "title_fa": "ما 3 بار به Kauai رفته ایم. می‌خواهم مکان‌های جدیدی را به پسرم نشان دهم، اما نمی‌توانم تعطیلات را در آنجا رزرو کنم.", "summary_fa": "نویسنده و خانواده اش در شش سال سه بار به کائوآی رفته اند. با حسن نیت نیکول فایندلی خانواده من عاشق سفر هستند، و من می خواهم به پسرم، 9 ساله، مکان های جدید را تا حد امکان نشان دهم. با این حال، من نمی توانم جلوی خودم را بگیرم - من عاشق رفتن به کائوآی هستم. ما در شش سال سه بار رفته‌ایم و می‌دانم که دوباره خواهیم رفت. هر سال از خانواده ام همین سوال را می پرسم که تابستان امسال کجا برویم؟ میخوام یه جای جدید انتخاب کنم به نظر می رسد انتخاب مکانی که قبلاً در آن بوده ایم، برای پسر 9 ساله من هدر دادن فرصت است تا مکان ها، فرهنگ ها و مردم مختلف را تجربه کند. به علاوه، من می خواهم کشورها و قاره های جدیدی را نیز ببینم. اما من به رزرو Kauai ادامه می‌دهم - نمی‌توانیم دور باشیم. طی شش سال گذشته، خانواده کوچک سه نفره من سه بار از کالیفرنیا به کائوآی پرواز کرده اند تا از لاک پشت های دریایی در ساحل پویپو دیدن کنند، مسیرهای ساحلی باشکوه را پیاده روی کنند، در بارهای هتل مای تایس بنوشند، و غروب آفتاب را از لانای ما تماشا کنند. لذت بردن از فضای باز در Kauai آسان است. با حسن نیت نیکول فایندلی من می خواهم به پسرم دنیا را نشان دهم، اما چیزی در مورد جزیره باغ وجود دارد هر بار که به فرودگاه لیهو می رسیم، جوجه ها از ما استقبال می کنند. من آنها را دوست دارم - رول دوربین من پر از مردم محلی پر است. درختان نخل بیرون ترمینال تاب می‌خورند و هوا بوی تازه و لطیف می‌دهد، به خصوص پس از پنج ساعت در هواپیما. و با پنجره‌ها پایین و موسیقی هاوایی در رادیو، رانندگی به سمت هتل ما همیشه شروع رسمی یک هفته شنا،"}, {"source": "Business Insider", "title": "When to quit your job and go solo, according to media mogul Kara Swisher", "link": "https://www.businessinsider.com/kara-swisher-advice-when-to-quit-go-independent-2026-9", "summary": "Kara Swisher spoke about her career to Dan DeFrancesco at the Business Insider offices. Business Insider Kara Swisher spoke to Business Insider about why she left her newsroom job to venture out on her own. She said people should go solo when they have a high risk tolerance and an entrepreneurial mindset. She said there's more room for experimentation in media now with different kinds of business models. Some people dream about breaking free and building something of their own. The big question is: When's the right time to take the leap ? For starters, you might be feeling disenchanted with your current role. \"I thought I could do better,\" Kara Swisher told Business Insider's Dan DeFrancesco during a talk she gave to newsroom staff. Before launching the media brand Recode, Swisher made a name for herself as a reporter at The Washington Post and The Wall Street Journal, eventually coproducing and cohosting The Journal's \"D: All Things Digital\" conference series, which later became Code Conference. When Swisher eventually went independent, she said her risk tolerance was greater than that of many of her journalist peers. \"I was like, what's the worst thing? I have to come back? I'm a good reporter. That's always saleable,\" said Swisher, who cohosts the \"Pivot\" podcast with Scott Galloway, and is the author of \"Burn Book.\" Swisher said anyone considering going out on their own should assess their risk profile. Financial obligations, children, and the need for reliable healthcare can play a role in deciding to take a leap. Swisher, who has given guidance to other media professionals who want to start their own ventures, said that having your own voice is another critical component. When she branched out on her own, Swisher said she was focused on the audience, what consumers wanted, and what they had not yet realized they needed. She said she's urged others with a strong individual voice to similarly pursue their own venture. \"You can tell when people really have something to say and want to make something,\" Swisher said. Don Lemon, for example, has thrived since going independent, she said. Lemon departed from CNN in 2023 after 17 years at the network. He has since worked as an independent content creator , sharing his work on social media and hosting live events. Building a business also requires an entrepreneurial mindset and a willingness to make trade-offs, even if that means something like taking the subway home instead of relying on an Uber every night,", "date_str": "2026-09-09T09:55:01+00:00", "hash": "8a7558767997c34cbb0d906237a1b79a7b05d0f7f4edd3862a13cfb1be4fe1f1", "title_fa": "به گفته غول رسانه ای کارا سویشر، چه زمانی شغل خود را رها کنید و به تنهایی بروید", "summary_fa": "کارا سویشر در مورد حرفه خود با دن دیفرانچسکو در دفاتر Business Insider صحبت کرد. کارا سویشر، بیزنس اینسایدر، با بیزینس اینسایدر در مورد اینکه چرا شغل اتاق خبر خود را رها کرده و به تنهایی به بیرون برود صحبت کرد. او گفت که مردم زمانی که تحمل ریسک بالایی دارند و ذهنیت کارآفرینی دارند، باید به تنهایی بروند. او گفت در حال حاضر فضای بیشتری برای آزمایش در رسانه ها با انواع مختلف مدل های تجاری وجود دارد. برخی از مردم رویای آزاد شدن و ساختن چیزی را در سر می پرورانند. سوال بزرگ این است: زمان مناسب برای جهش چه زمانی است؟ برای شروع، ممکن است از نقش فعلی خود دلسرد شده باشید. کارا سویشر به دن دیفرانچسکو از Business Insider در طی صحبتی که با کارکنان اتاق خبر داشت، گفت: «فکر می‌کردم می‌توانم بهتر عمل کنم. قبل از راه‌اندازی برند رسانه‌ای Recode، سویشر در واشنگتن پست و وال استریت ژورنال به عنوان گزارشگر نامی برای خود دست و پا کرد و در نهایت مجموعه کنفرانس‌های «D: All Things Digital» ژورنال را که بعداً به «کد کنفرانس» تبدیل شد، تولید و میزبانی کرد. زمانی که سویشر در نهایت به استقلال رسید، گفت که تحمل ریسک او از بسیاری از همتایان روزنامه نگارش بیشتر است. \"من می گفتم، بدترین چیز چیست؟ باید برگردم؟ من گزارشگر خوبی هستم. Swisher که پادکست Pivot را با اسکات گالووی اجرا می کند و نویسنده کتاب Burn Book است، گفت. سرمایه گذاری، گفت که داشتن صدای خود یکی دیگر از اجزای حیاتی است. هنگامی که او به تنهایی فعالیت خود را آغاز کرد، سوئیشر گفت که بر روی مخاطبان، آنچه که مصرف کنندگان می خواهند و آنچه هنوز متوجه نشده بودند که به آن نیاز دارند، تمرکز کرده است. او گفت که از دیگران با صدای قوی فردی خواسته است که به طور مشابه"}, {"source": "Business Insider", "title": "An NEA partner says not every AI task needs frontier intelligence", "link": "https://www.businessinsider.com/nea-partner-aaron-jacobson-weighs-in-on-open-versus-closed-2026-9", "summary": "Aaron Jacobson, a partner at NEA, believes open ecosystems are good enough. Prosek Partners NEA partner Aaron Jacobson thinks companies don't need to pledge allegiance to frontier models. He says that for a growing number of tasks open-weight models are \"good enough.\" \"I think the next decade is going to be defined by efficient use of models,\" he told BI. The AI race is getting more complicated. Despite the hype around the latest and biggest frontier models , companies are finding they don't always need the most powerful approach for every task. As open-weight models get better, cheaper, and easier to customize, there’s more pressure on frontier model companies like OpenAI and Anthropic to develop features that retain customers. That's creating a new set of tradeoffs for businesses between cost, control, and security. In an interview with Business Insider, Aaron Jacobson, a partner at New Enterprise Associates whose portfolio companies include Databricks, Factory, and Together, said that he sees this debate at the center of the next phase of the AI industry. He expects frontier models to remain important for the hardest, most complex problems, but for many everyday tasks, cheaper models may be good enough. The result could be a shift away from the idea that bigger is always better — and toward a world where companies take a more curated approach to model selection. This interview has been edited and condensed for clarity. Can you define the difference between open-source, open-weight, and closed AI? Open source is where you can actually recreate the entire model yourself. You have all the data, all the data pipelines, and you can basically train it from scratch and get the weights. Open weight is where you just have the weights, but you can't actually create the model from scratch because you don't have all the data and all the data pipelines. You don't actually know the data the model was trained on or how it was trained. With closed frontier models, you don't have access to either of those. You can do some fine-tuning of the weights through APIs that Anthropic and OpenAI provide, but you don't actually have access to the weights. You can't run the models yourself. Is open versus closed really a debate for you? Or are frontier models so superior that there isn't even a question of whether open source can catch up? I think the frontier models are, in terms of the broad set of problems— and even for coding — better. But here's the thing: That doesn't mean t", "date_str": "2026-09-09T09:51:01+00:00", "hash": "d17e6533cea8ee7d96175bb28261fb800f8604166b3f719c6faec92d8d2c094b", "title_fa": "یکی از شرکای NEA می گوید که هر کار هوش مصنوعی به هوش مرزی نیاز ندارد", "summary_fa": "آرون جاکوبسون، شریک NEA، معتقد است اکوسیستم های باز به اندازه کافی خوب هستند. شریک Prosek Partners NEA، آرون جاکوبسون، فکر می کند که شرکت ها نیازی به وفاداری به مدل های مرزی ندارند. او می گوید که برای تعداد فزاینده ای از وظایف، مدل های وزن باز \"به اندازه کافی خوب\" هستند. او به BI گفت: \"من فکر می کنم دهه آینده با استفاده کارآمد از مدل ها تعریف می شود.\" مسابقه هوش مصنوعی پیچیده تر می شود. علیرغم تبلیغات در مورد جدیدترین و بزرگترین مدل های مرزی، شرکت ها در می یابند که همیشه برای هر کاری به قدرتمندترین رویکرد نیاز ندارند. همانطور که مدل‌های وزن باز بهتر، ارزان‌تر و سفارشی‌سازی آسان‌تر می‌شوند، فشار بیشتری بر شرکت‌های مدل مرزی مانند OpenAI و Anthropic برای توسعه ویژگی‌هایی که مشتریان را حفظ می‌کند، وارد می‌شود. این باعث ایجاد مجموعه جدیدی از مبادلات بین هزینه، کنترل و امنیت برای مشاغل می شود. در مصاحبه ای با Business Insider، آرون جاکوبسون، شریک در New Enterprise Associates که شرکت های پرتفوی آن شامل Databricks، Factory و Together هستند، گفت که او این بحث را در مرکز فاز بعدی صنعت هوش مصنوعی می بیند. او انتظار دارد که مدل‌های مرزی برای سخت‌ترین و پیچیده‌ترین مشکلات مهم باقی بمانند، اما برای بسیاری از کارهای روزمره، مدل‌های ارزان‌تر ممکن است به اندازه کافی خوب باشند. نتیجه می‌تواند دور شدن از این ایده باشد که بزرگ‌تر همیشه بهتر است – و به سمت دنیایی که شرکت‌ها در آن رویکرد دقیق‌تری برای انتخاب مدل دارند. این مصاحبه برای وضوح ویرایش و فشرده شده است. آیا می توانید تفاوت بین هوش مصنوعی منبع باز، وزن باز و بسته را تعریف کنید؟ منبع باز جایی است که می توانید در واقع کل مدل را خودتان بازسازی کنید. شما تمام داده ها، تمام خطوط لوله داده را دارید، و اساساً می"}, {"source": "Business Insider", "title": "The S&P 500 is trading beer and fries for AI’s picks and shovels", "link": "https://www.businessinsider.com/sp500-rebalance-shows-ai-infrastructure-replacing-beer-fries-housing-stocks-2026-9", "summary": "Mike Kemp/In Pictures via Getty Images AI infrastructure is gaining S P 500 seats, while beer, fries, and housing names lose theirs. The reshuffle quietly changes the stocks inside the index funds and 401(k)s owned by millions. Sign up for First Trade , Business Insider's daily markets newsletter. In the stock market, the S P 500 reigns supreme as the benchmark index everyone watches. But it doesn't function as a Hall of Fame. It's more of a game of musical chairs, with the companies central to the economy at a given time finding seats, while out-of-favor areas miss out. So far in 2026, the S P has added 11 companies and shuffled out 11, with three more changes scheduled for Sept. 21 . A big decider for inclusion is sheer size. It is a large-cap index, after all. When companies get bigger, they move up. When they shrink, they move down. It's Wall Street's way of constantly updating the corporate pecking order. And while the components of the S P may seem like a niche topic for market wonks and newsletter writers alike, they matter in everyday life. The index is the foundation for countless 401(k)s , index funds, and ETFs . When its composition changes, the funds tracking it have to buy the new members and sell the old ones. Your long-term portfolio is constantly changing. It's good to know what you're invested in, even when you own it unwittingly. Not to mention rebalances can shine a light on the market's shifting priorities. Let's dig into what the S P's recent moves reveal. The AI infrastructure takeover 2026's incoming class of S P additions reinforce what any market watcher knows at this point: the economy's center of gravity is shifting toward AI . Vertiv, Lumentum, Coherent, Marvell Technology, Flex, Bloom Energy, and Everpure all play a role in the AI buildout, whether through power and cooling equipment, optical networking, chips, manufacturing, or data storage. They may not be the sexiest AI names, but they're critical pieces of the sprawling picks-and-shovels trade. Their inclusion reflects the view that the AI trade extends far beyond mega-cap chipmakers like Nvidia . The companies powering the boom are growing too large for the index to ignore. Not just an AI beauty contest But the index isn't just handing out invitations to anything with an AI connection. One notable exception is Illumina, a DNA-sequencing company that's enjoyed a more-than-60% gain so far this year. Its inclusion shows that the S P committee is still trying to keep the index", "date_str": "2026-09-09T09:50:01+00:00", "hash": "045a31b7b0e54f9ce66c388c4f1fe4890f98d4ef14390767050d1b0ae067e31f", "title_fa": "S&P 500 آبجو و سیب زمینی سرخ کرده را با بیل و بیل های هوش مصنوعی معامله می کند.", "summary_fa": "Mike Kemp/In Pictures از طریق زیرساخت‌های هوش مصنوعی Getty Images در حال به دست آوردن S P 500 صندلی است، در حالی که نام‌های آبجو، سیب‌زمینی سرخ‌کرده و خانه‌ها جایگاه خود را از دست می‌دهند. تغییرات بی سر و صدا سهام داخل صندوق های شاخص و 401 (k) متعلق به میلیون ها نفر را تغییر می دهد. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. در بازار سهام، S P 500 به عنوان شاخص معیاری که همه تماشا می کنند، برتری می یابد. اما به عنوان تالار مشاهیر عمل نمی کند. این بیشتر شبیه بازی صندلی‌های موسیقی است، با شرکت‌های مرکزی اقتصاد در یک زمان معین صندلی‌ها را پیدا می‌کنند، در حالی که مناطق غیرمطلوب از دست می‌دهند. تا کنون در سال 2026، S P 11 شرکت را اضافه کرده و 11 شرکت را تغییر داده است و سه تغییر دیگر برای 21 سپتامبر برنامه ریزی شده است. یک تصمیم بزرگ برای گنجاندن اندازه خالص است. به هر حال این یک شاخص کلان است. وقتی شرکت ها بزرگتر می شوند، به سمت بالا حرکت می کنند. وقتی کوچک می شوند، به سمت پایین حرکت می کنند. این روشی است که وال استریت برای به‌روزرسانی دائمی سفارش‌های شرکتی به‌روزرسانی می‌کند. و در حالی که اجزای S P ممکن است به عنوان یک موضوع خاص برای متخصصان بازار و نویسندگان خبرنامه به نظر برسد، اما در زندگی روزمره اهمیت دارند. این شاخص پایه و اساس 401(k)s، صندوق های شاخص و ETF های بی شماری است. هنگامی که ترکیب آن تغییر می کند، بودجه ردیابی آن باید اعضای جدید را بخرد و اعضای قدیمی را بفروشد. پورتفولیوی بلند مدت شما دائما در حال تغییر است. خوب است بدانید روی چه چیزی سرمایه گذاری کرده اید، حتی اگر ناخواسته صاحب آن شوید. ناگفته نماند که توازن مجدد می تواند اولویت های"}, {"source": "Business Insider", "title": "Oil jumps above $100 a barrel as US-Iran fighting raises Strait of Hormuz disruption fears", "link": "https://www.businessinsider.com/oil-price-passes-100-per-barrel-us-iran-fighting-resumes-2026-9", "summary": "Oil prices passed $100 per barrel for the first time since July. PDVSA Oil prices surged over $100 amid Middle East conflicts affecting global supply concerns. Brent crude, the international benchmark, passed the milestone in European trade on Wednesday. Fresh fighting between the US and Iran has raised fears of disruption in the Strait of Hormuz. Oil jumped above $100 per barrel on Wednesday as escalating fighting in the Middle East raised fears of further supply disruptions. Early in European trading, Brent crude, the global benchmark, tipped above $100, and by around 5:45 a.m. ET, was trading at $100.60 per barrel. The move above $100 was the first since July 24. At the same time, WTI, the US benchmark, was at just over $95 per barrel. Brent has climbed about 25% since early August as hopes for a lasting end to the six-month US-Iran conflict have faded. American forces attacked Iranian tankers after Tehran tried to strike a US Navy warship with ballistic missiles, the US military said on Wednesday. Attacks by Iran-backed Houthi militants this week also set Saudi energy facilities on fire, adding to concerns about oil shipments through the Red Sea and the Strait of Hormuz. The international benchmark previously peaked at $126 a barrel in April before falling back as hopes of a ceasefire grew. The Strait of Hormuz remains central to traders' concerns. Flows through the waterway recently fell below 2 million barrels a day, Rystad Energy estimated, down from 8 million to 9 million barrels a day in the week before fighting resumed on August 30. Although producers including the US, Canada, and Guyana have increased output, the International Energy Agency said last month that global oil supply was expected to fall by 4.3 million barrels a day this year, or roughly 4%. Major banks have responded to the worsening supply picture by lifting their price forecasts. Goldman Sachs, Bank of America, and HSBC are among the firms that have raised their outlooks in recent days. Higher oil prices can filter through the economy by increasing gasoline, shipping, and manufacturing costs. A sustained move near or above $100 could add to inflation pressure and complicate the outlook for interest rates. Read the original article on Business Insider", "date_str": "2026-09-09T09:46:25+00:00", "hash": "e9a2fc9469f76dc5788b5d501b6dd8de273e25c511458c140ba907a910ec4611", "title_fa": "قیمت نفت به بالای 100 دلار در هر بشکه رسید زیرا درگیری‌های آمریکا و ایران نگرانی‌ها از اختلال در تنگه هرمز را افزایش داده است.", "summary_fa": "قیمت نفت برای اولین بار از ماه جولای از 100 دلار در هر بشکه عبور کرد. PDVSA قیمت نفت بیش از 100 دلار در بحبوحه درگیری های خاورمیانه که بر نگرانی های عرضه جهانی تأثیر می گذارد، افزایش یافت. نفت برنت، معیار بین المللی، روز چهارشنبه از نقطه عطف تجارت اروپا عبور کرد. درگیری‌های تازه بین آمریکا و ایران نگرانی‌ها از اختلال در تنگه هرمز را افزایش داده است. در حالی که تشدید درگیری ها در خاورمیانه نگرانی ها از اختلالات بیشتر در عرضه را افزایش داده است، قیمت نفت روز چهارشنبه به بالای 100 دلار در هر بشکه رسید. در اوایل معاملات اروپا، نفت خام برنت، معیار جهانی، به بالای 100 دلار رسید و در حدود ساعت 5:45 بامداد به وقت شرق اروپا، 100.60 دلار در هر بشکه معامله شد. این حرکت به بالای 100 دلار اولین بار از 24 جولای بود. در همان زمان، WTI، معیار ایالات متحده، کمی بیش از 95 دلار در هر بشکه بود. برنت از اوایل آگوست تا کنون حدود 25 درصد افزایش داشته است زیرا امیدها برای پایان پایدار درگیری شش ماهه ایران و آمریکا کم رنگ شده است. ارتش آمریکا روز چهارشنبه اعلام کرد که نیروهای آمریکایی پس از آن که تهران تلاش کرد با موشک های بالستیک به کشتی جنگی نیروی دریایی آمریکا حمله کند، به نفتکش های ایرانی حمله کردند. حملات شبه‌نظامیان حوثی مورد حمایت ایران در این هفته همچنین تاسیسات انرژی عربستان را به آتش کشید و بر نگرانی‌ها در مورد ارسال نفت از طریق دریای سرخ و تنگه هرمز افزود. شاخص بین المللی پیش از این در آوریل به 126 دلار در هر بشکه رسیده بود و با افزایش امیدها به آتش بس، کاهش یافت. تنگه هرمز همچنان محور نگرانی های تجار است. ریستاد انرژی تخمین زد که جریان آب از طریق این آبراه اخیراً به کمتر از"}, {"source": "Business Insider", "title": "Anthropic's AI fluency chief says the best AI users know when to do the work themselves", "link": "https://www.businessinsider.com/anthropic-ai-fluency-chief-discernment-tax-work-2026-9", "summary": "Anthropic s Kristen Swanson says AI fluency is about knowing what to delegate and what to do yourself. Courtesy of Kristen Swanson Anthropic's AI fluency chief says the savviest users know when not to turn to AI. Using the technology for the wrong task can create what Kristen Swanson calls a \"discernment tax.\" AI fluency isn't about maximum use: \"More AI is not always better,\" she said. At Anthropic, Kristen Swanson's role is to help people get better at using AI. Often, that means knowing when they should do the work themselves. \"I have a job teaching people how to use AI, and I probably spend at least half of my time telling people when not to use AI,\" said Swanson, who leads AI fluency research and learning at the company. The savviest AI users, she said, aren't necessarily those who rush to it for every task. What sets them apart is their judgment about what to delegate. That's becoming an increasingly important workplace skill as AI finds its way into more of what people do. The challenge isn't only learning how to use the technology. It's knowing when it can save time, when it might create more work , and when a task is better left to a person. Knowing what not to delegate In some cases, Swanson said, evaluating what AI produces takes more effort than doing the task yourself. It's what she calls a \"discernment tax.\" When people hand off the right things to AI, Swanson said, the time spent reviewing its output can be worthwhile. Yet for tasks people are already adept at doing, evaluating AI's work can eat into whatever time they hoped to save. Properly judging what AI produces , Swanson said, \"is the highest-order thinking that you can do. It's actually exhausting.\" That's why asking AI for help with tedious data analysis might make sense, she said. Yet having it write a social media post about something you're knowledgeable about could leave you doing more work, \"parsing through all of this stuff.\" The discernment tax isn't the only reason to keep some work away from AI. The technology's limitations can also make delegation risky. \"If you're asking AI about a really niche research paper or researcher, and it didn't have a lot of that information in its training, it might hallucinate,\" said Swanson. Bosses are also trying to draw clearer boundaries around when employees should turn to AI. While many companies are pushing workers to embrace the technology, some CEOs have warned against letting it substitute for employees' own thinking . Scott Stevenson", "date_str": "2026-09-09T09:35:01+00:00", "hash": "9e25a3dff5201181ed77d34b3807700714d7ef175402d0b7bc10a91479d7a097", "title_fa": "مدیر تسلط هوش مصنوعی Anthropic می گوید بهترین کاربران هوش مصنوعی می دانند که خودشان چه زمانی کار را انجام دهند", "summary_fa": "کریستن سوانسون، از آنتروپیک، می‌گوید تسلط بر هوش مصنوعی این است که بدانید چه کاری را به خودتان واگذار کنید و چه کاری را انجام دهید. مدیر تسلط هوش مصنوعی کریستن سوانسون
