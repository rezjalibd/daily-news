      --bg: #0b0f19;
      --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --tab-bg: #151d30;
      --tab-border: #232f48;
      --tab-text: #94a3b8;
      --tab-active-bg: #38bdf8;
      --tab-active-text: #0f172a;
      --search-bg: #151d30;
      --search-border: #232f48;
      --toggle-bg: #1e293b;
      --toggle-border: #334155;
      --modal-bg: #151d30;
      --modal-border: #334155;
      --read-bg: #0d1322;
      --read-border: #1e293b;
      --success: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --header-bg: linear-gradient(135deg, #ffffff, #f1f5f9);
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --badge-bg: rgba(2, 132, 199, 0.1);
      --tab-bg: #ffffff;
      --tab-border: #e2e8f0;
      --tab-text: #64748b;
      --tab-active-bg: #0284c7;
      --tab-active-text: #ffffff;
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --modal-bg: #ffffff;
      --modal-border: #cbd5e1;
      --read-bg: #f1f5f9;
      --read-border: #e2e8f0;
      --success: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.8;
      padding: 20px 12px;
      direction: rtl;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      background: var(--header-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .header-actions {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      border-color: var(--primary);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .meta-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .search-box {
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      color: var(--tab-text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
    }
    .news-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .news-card.is-read {
      background: var(--read-bg);
      border-color: var(--read-border);
      opacity: 0.7;
    }
    .news-card.is-read:hover {
      opacity: 0.95;
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-num {
      background: var(--badge-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .news-card.is-read .news-num {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }
    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;
    }
    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;
      flex-wrap: wrap;
      gap: 10px;
    }
    .news-source {
      color: var(--text-muted);
      font-weight: 500;
    }
    .footer-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-mark-read {
      background: transparent;
      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .archive-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }
      .header-actions { top: 12px; left: 12px; width: calc(100% - 24px); justify-content: space-between; }
      .btn-action { font-size: 0.78rem; padding: 6px 9px; }
      h1 { font-size: 1.35rem; }
      .tabs { gap: 6px; }
      .tab-btn { padding: 10px 10px; font-size: 0.84rem; gap: 6px; }
      .badge { padding: 1px 5px; font-size: 0.75rem; }
      .news-card { padding: 16px; }
      .news-title { font-size: 0.98rem; }
      .news-summary { font-size: 0.88rem; }
      .news-footer { flex-direction: column; align-items: flex-start; gap: 8px; }
      .footer-right { width: 100%; justify-content: space-between; }
    }
  </style>
</head>

مه‌ چیز را بیرون آوردیم. همه‌چیز در اختیار ماست.» اسرائیل کاتس، وزیر دفاع اسرائیل هم در بیانیه‌ای گفت: «ما حاضر و آماده‌ایم که این کارزار را ادامه دهیم و به حزب‌الله در محل‌های دیگر حمله کنیم.» ارتش اسرائیل دیشب تپه‌های علی‌الطاهر در جنوب لبنان را با انفجاری عظیم منفجر کرد و به گزارش خبرگزاری رسمی لبنان، لرزش‌ها و صدای انفجار در سراسر شهر نبطیه و مناطق اطراف احساس شد. ارتش اسرائیل اعلام کرد که نیروهایش پیش از تخریب زیرساخت‌ها، «کنترل عملیاتی» این بلندی‌ها را هم در سطح و هم در زیر زمین، به دست گرفته بودند. به گفته ارتش اسرائیل، شبکه تونل‌های زیر این تپه‌ها بیش از دو کیلومتر امتداد داشت و در آن ده‌ها فروند راکت، موشک از جمله موشک‌ ضدتانک، پهپاد، مین‌ و مواد منفجره نگهداری می‌شد."}, {"source": "BBC Persian", "title": "درباره شهر و بندر مخا که حوثی‌ها تصرف کرده‌اند، چه می‌دانیم؟", "link": "https://www.bbc.com/persian/articles/cqjke8q9pyeo?at_medium=RSS&at_campaign=rss", "summary": "بندر مخا بار دیگر با مطرح شدن گزارش‌هایی درباره تسلط حوثی‌ها بر این منطقه، در کانون توجه قرار گرفته است؛ بندری که به دلیل موقعیت راهبردی خود در ساحل دریای سرخ و نزدیکی به تنگه باب‌المندب، یکی از مهم‌ترین گذرگاه‌های دریایی تجارت جهانی، اهمیت فزاینده‌ای یافته است.", "date_str": "2026-09-11T09:26:19+00:00", "hash": "b912f419bf97d20b", "title_fa": "درباره شهر و بندر مخا که حوثی‌ها تصرف کرده‌اند، چه می‌دانیم؟", "summary_fa": "بندر مخا بار دیگر با مطرح شدن گزارش‌هایی درباره تسلط حوثی‌ها بر این منطقه، در کانون توجه قرار گرفته است؛ بندری که به دلیل موقعیت راهبردی خود در ساحل دریای سرخ و نزدیکی به تنگه باب‌المندب، یکی از مهم‌ترین گذرگاه‌های دریایی تجارت جهانی، اهمیت فزاینده‌ای یافته است. شهر و بندر مخا به دلیل موقعیتشان در ساحل دریای سرخ و نزدیکی به تنگه باب‌المندب، اهمیت راهبردی فزاینده‌ای دارند، به‌ویژه در شرایطی که نگرانی‌ها درباره امنیت کشتیرانی و تامین انرژی در دریای سرخ افزایش یافته است. منابع نظامی و شاهدان عینی گزارش داده‌اند که حوثی‌های یمن، شهر و بندر راهبردی مخا در ساحل دریای سرخ را از کنترل نیروهای وفادار به دولت و مورد حمایت عربستان خارج کرده و به تصرف درآورده‌اند. این تصرف، گروه مورد حمایت ایران را به فاصله تنها ۷۵ کیلومتری تنگه باب‌المندب می‌رساند، تنگه‌ای که دروازه جنوبی مسیر تجاری پیوند دهنده آسیا و اروپا به شمار می‌رود. در حالی که حوثی‌ها تاکید کرده‌اند که تهدیدی برای کشتیرانی بین‌المللی محسوب نمی‌شوند، بار دیگر هشدار داده‌اند که کشتی‌های وابسته به عربستان سعودی را هدف قرار خواهند داد. این در حالی است که عربستان از زمان جنگ آمریکا و اسرائیل با ایران و بسته شدن عملی تنگه هرمز در خلیج فارس، برای صادرات نفت خود به مسیر دریای سرخ وابستگی بیشتری پیدا کرده است. بندر مخا در غرب استان تعز، در فاصله ۶۵ تا ۷۵ کیلومتری شمال تنگه باب‌المندب و حدود ۱۰۰ کیلومتری غرب شهر تعز قرار دارد."}, {"source": "BBC Persian", "title": "ویدیوهای تازه از مرد مرتبط با پرونده ۱۱ سپتامبر، از پیوندهای او با افراط‌گرایان و دولت عربستان پرده برمی‌دارد", "link": "https://www.bbc.com/persian/articles/cwyzeey89e8o?at_medium=RSS&at_campaign=rss", "summary": "ویدیوهای تازه و دیگر مدارکی که اف‌بی‌آی از ارائه آن‌ها خودداری کرده بود، ادعاهای عمر بیومی را که او یک‌ربع قرن بر آن‌ها پافشاری کرده بود، با تردیدهای جدی روبه‌رو می‌کنند.", "date_str": "2026-09-11T05:51:50+00:00", "hash": "8d9239bf7501ac3f", "title_fa": "ویدیوهای تازه از مرد مرتبط با پرونده ۱۱ سپتامبر، از پیوندهای او با افراط‌گرایان و دولت عربستان پرده برمی‌دارد", "summary_fa": "ویدیوهایی که بی‌بی‌سی به آن‌ها دست یافته نشان می‌دهد مردی که در کانون شکایت یک تریلیون دلاری خانواده‌های قربانیان حملات ۱۱ سپتامبر قرار دارد، ارتباطات گسترده‌ای با مقام‌های دولت عربستان سعودی داشته و حتی در یک بازی پینت‌بال با یکی از افرادی که بعدها به یکی از رهبران القاعده تبدیل شد، شرکت کرده است. این ویدیوها که اف‌بی‌آی تنها چند روز پس از حملات سال ۲۰۰۱ به آن‌ها دسترسی پیدا کرده بود، با ۲۵ سال انکار عمر بیومی مبنی بر اینکه یک افراط‌گرا یا جاسوس عربستان سعودی نبوده، در تضادی آشکار قرار دارند. بیومی که مدعی بود هنگام اقامت در آمریکا دانشجو بوده است، در یکی از تصاویر انور عولقی را در آغوش می‌گیرد؛ فردی که بعدها رهبری القاعده در شبه‌جزیره عربستان را بر عهده گرفت. در ویدئویی دیگر، بیومی و عولقی همراه یکی از مقام‌های وزارت امور اسلامی عربستان سعودی در نزدیکی سن‌دیه‌گو پینت‌بال بازی می‌کنند. این ویدئوها بخشی از اسناد شکایت خانواده‌های قربانیان ۱۱ سپتامبر علیه عربستان سعودی‌اند و پیش از این هرگز به‌طور عمومی نمایش داده نشده بودند. در این شکایت استدلال شده است که عربستان سعودی در حملات همدستی داشته و بیومی به دو نفر از ۱۹ هواپیماربایی کمک کرده است که هواپیماها را به مرکز تجارت جهانی و پنتاگون کوبیدند؛ هواپیمای دیگری نیز در پنسیلوانیا سقوط کرد. بیومی چند روز پس از حملات ۱۱ سپتامبر در بریتانیا توسط پلیس لندن بازداشت شد و این ویدیوها همراه با دیگر مدارک مهم، در میان وسایل او کشف شدند."}, {"source": "BBC Persian", "title": "آیا تحریم‌های آمریکا راه پروازهای خارجی ایران را می‌بندند؟", "link": "https://www.bbc.com/persian/articles/cn746rl6zzko?at_medium=RSS&at_campaign=rss", "summary": "آمریکا ایرلاین‌های باقی‌مانده ایران را تحریم و برخی مجوزهای پروازی مرتبط با ایران را تعلیق کرده است؛ اقدامی که در کنار جنگ، بازگشت پروازهای خارجی به ایران را دشوارتر و پیچیده‌تر می‌کند.", "date_str": "2026-09-11T04:20:18+00:00", "hash": "82c0cb05f7e1dcba", "title_fa": "آیا تحریم‌های آمریکا راه پروازهای خارجی ایران را می‌بندند؟", "summary_fa": "در حالی که پرواز خطوط هوایی خارجی به ایران در پی جنگ و تنش‌های منطقه‌ای عملا متوقف شده‌، آمریکا تحریم‌های تازه‌ای را علیه صنعت هوانوردی ایران وضع کرده است که می‌تواند بازگشت این پروازها را، حتی پس از کاهش خطرهای امنیتی، پیچیده‌تر و دشوارتر کند. وزارت دارایی آمریکا روز ۸ سپتامبر اعلام کرد که ۲۷ شرکت هواپیمایی ایرانی و ۹ فرد و شرکت مرتبط با صنعت هوانوردی ایران را تحریم می‌کند. این وزارت‌خانه تاکید کرد که در چارچوب «عملیات انزوای اقتصادی»علیه ایران «تمام شرکت‌های هواپیمایی باقی‌مانده ایران» را هدف قرار داده است. چند ایرلاین از جمله ماهان‌ایر و ایران‌ایر پیش از این مشمول تحریم‌های آمریکا شده بودند. هم‌زمان، آمریکا چند مجوز مربوط به بخشی از پروازها و خدمات هوانوردی مرتبط با ایران را به حالت تعلیق درآورد و به موسسات مالی درباره شبکه‌های تهیه هواپیما و قطعات برای ایران هشدار داد. با اعلام تحریم‌های جدید این سوال مطرح می‌شود که با وجود تحریم‌های گسترده پیشین، آیا محدودیت‌های تازه عملا تفاوتی ایجاد خواهد کرد؟ آیا این تحریم‌ها راه پروازهای خارجی به ایران را می‌بندد و آیا ترکیه، امارات یا هر کشور دیگری با پذیرش پرواز ایرلاین‌های تحریم‌شده ایرانی، در معرض مجازات آمریکا قرار می‌گیرد؟ وزارت دارایی آمریکا روز هشت سپتامبر ۳۶ نهاد و شرکت را تحریم کرد. ۲۷ مورد از آن‌ها شرکت‌های هواپیمایی ایرانی‌اند؛ از جمله آسمان، آتا، ایران‌ایرتور، کیش‌ایر، کارون، قشم‌ایر، ساها، سپهران، تابان، وارش و زاگرس."}, {"source": "BBC Persian", "title": "چهار دقیقه هشدار دیگر کافی نیست؛ ساکنان کی‌یف دیگر در خانه‌هایشان احساس امنیت نمی‌کنند", "link": "https://www.bbc.com/persian/articles/cwyz5x90pnno?at_medium=RSS&at_campaign=rss", "summary": "ساکنان کی‌یف که سال‌ها با خطر حملات موشکی و پهپادی روسیه زندگی کرده‌اند، می‌گویند موج تازه حملات و تغییر تاکتیک‌های نظامی مسکو، احساس امنیت را بیش از هر زمان دیگری از آنها گرفته است. استفاده بیشتر از موشک‌های بالستیک، که تنها چند دقیقه برای واکنش فرصت می‌دهند، بسیاری از مردم را وادار کرده در شیوه زندگی خود تجدیدنظر کنند؛ از ترک شهر گرفته تا خوابیدن در راهروها و آماده نگه داشتن کیف‌های اضطراری برای بدترین سناریوها.", "date_str": "2026-09-11T02:12:36+00:00", "hash": "a9f226cbba047f05", "title_fa": "چهار دقیقه هشدار دیگر کافی نیست؛ ساکنان کی‌یف دیگر در خانه‌هایشان احساس امنیت نمی‌کنند", "summary_fa": "ساکنان کی‌یف که سال‌ها با خطر حملات موشکی و پهپادی روسیه زندگی کرده‌اند، می‌گویند موج تازه حملات و تغییر تاکتیک‌های نظامی مسکو، احساس امنیت را بیش از هر زمان دیگری از آنها گرفته است. استفاده بیشتر از موشک‌های بالستیک، که تنها چند دقیقه برای واکنش فرصت می‌دهند، بسیاری از مردم را وادار کرده در شیوه زندگی خود تجدیدنظر کنند؛ از ترک شهر گرفته تا خوابیدن در راهروها و آماده نگه داشتن کیف‌های اضطراری برای بدترین سناریوها."}, {"source": "BBC Persian", "title": "آیا کره جنوبی به تنگه هرمز نیرو می‌فرستد؟", "link": "https://www.bbc.com/persian/articles/c3056d7426yo?at_medium=RSS&at_campaign=rss", "summary": "با افزایش گمانه‌زنی‌ها درباره اعزام احتمالی نیرو و تجهیزات نظامی کره جنوبی به تنگه هرمز، وزارت دفاع این کشور از اعزام هیئتی برای بررسی وضعیت امنیتی و شرایط عملیاتی منطقه خبر داده است. با این حال، مقام‌های سئول می‌گویند هنوز هیچ تصمیمی برای اعزام نیرو گرفته نشده و این روند، حتی در صورت موافقت دولت، نیازمند طی مراحل قانونی و سیاسی متعددی است.", "date_str": "2026-09-10T22:06:21+00:00", "hash": "5afae71d383c33ee", "title_fa": "آیا کره جنوبی به تنگه هرمز نیرو می‌فرستد؟", "summary_fa": "گمانه‌زنی‌ها درباره بررسی اعزام نیرو و تجهیزات نظامی به تنگه هرمز از سوی دولت کره جنوبی افزایش یافته است. وزارت دفاع کره جنوبی اعلام کرد که این کشور در تعطیلات پایان هفته، هیئتی را برای ارزیابی وضعیت امنیتی و شرایط عملیاتی پیرامون تنگه هرمز به امارات متحده عربی فرستاده است. یکی از مقام‌های این وزارتخانه گفت که هیئت در حال بررسی وضعیت امنیتی و شرایط میدانی است، اما تاکید کرد که این ماموریت به معنای قریب‌الوقوع بودن اعزام نیرو نیست. او گفت: «این بررسی با فرض اعزام نیرو انجام نمی‌شود و هیچ تصمیمی درباره اعزام گرفته نشده است.» تعداد اعضای هیئت و مکان‌هایی که از آن‌ها بازدید کرده‌اند اعلام نشده است. با این حال، گمان می‌رود هیئت کوچکی متشکل از مقام‌های وزارت دفاع، ستاد مشترک ارتش و نیروی دریایی باشد. اما پیش از آنکه اعزام نیرو عملی شود، چه مراحلی باید طی شود؟"}, {"source": "Radio Farda", "title": "اسرائیل در پی تخریب تونل‌های علی الطاهر به ایران درباره واکنش احتمالی هشدار داد", "link": "https://www.radiofarda.com/a/israel-warns-iran-after-idf-blows-up-hezbollah-s-complex-beneath-s-ali-taher-ridge-/33852448.html", "summary": ".", "date_str": "2026-09-11T13:01:48+00:00", "hash": "76a9decd6593e747", "title_fa": "اسرائیل در پی تخریب تونل‌های علی الطاهر به ایران درباره واکنش احتمالی هشدار داد", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند به دنبال اقدام ارتش اسرائیل در انهدام تونل‌های گروه حزب‌الله در ارتفاعات علی الطاهر در جنوب لبنان، اسرائیل به جمهوری اسلامی هشدار داده که هر گونه واکنش احتمالی جمهوری اسلامی و هدف قرار دادن اسرائیل، با پاسخ به خود ایران روبه‌رو خواهد شد. ارتش اسرائیل در عملیاتی با نام رمز «شعله‌افکن» در روز پنجشنبه ۱۹ شهریور، با به کار بردن بیش از یک هزار و یکصد تن مواد انفجاری، تونل‌هایی را که گروه حزب‌الله در سلسله کوه‌های علی الطاهر در جنوب لبنان برپا کرده بود، منهدم کرد. ارتش گفت این شیوه انهدام پیچیده و یکی از مهم‌ترین موارد در رشته عملیات در حدود سه سال جنگ‌های اخیر با حزب‌الله بوده است. تونل‌ها با انفجاری سهمگین منهدم شدند، به گونه‌ای که به گفته مرکز لرزه‌نگاری لبنان، موجب بروز زلزله‌ای به بزرگی ۴.۱ در منطقه شد؛ گزارش‌ها حاکی است مردم در جنوب لبنان و شمال اسرائیل لرزش ناشی از این انفجارها را احساس کردند. ارتش اسرائیل پیشاپیش مردم شمال این کشور را از مخاطرات احتمالی یک عملیات، بدون ارائه جزئیات آن، آگاه و آماده کرده بود. ارتش اسرائیل گفت هشت تونل منهدم شده در مجموع ۵.۴ کیلومتر طول داشت و یکی از «عمیق‌ترین و مستحکم‌ترین استحکامات» در زیرساخت‌های حزب‌الله به‌شمار می‌رفت."}, {"source": "Radio Farda", "title": "ایران از برپایی نشست با کشورهای خلیج فارس درباره آینده تنگه هرمز خبر داد", "link": "https://www.radiofarda.com/a/iran-gulf-states-hormuz-talks/33852368.html", "summary": "فایننشال تایمز می‌گوید وزیر خارجه ایران قرار است ۲۳ شهریور در عمان با همتایانش در کشورهای عرب خلیج فارس به‌منظور «نهایی کردن توافقی موقت درباره مدیریت تردد در تنگه هرمز» دیدار کند.", "date_str": "2026-09-11T11:41:45+00:00", "hash": "935eed00e6662b3e", "title_fa": "ایران از برپایی نشست با کشورهای خلیج فارس درباره آینده تنگه هرمز خبر داد", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند سخنگوی وزارت امور خارجه جمهوری اسلامی روز جمعه ۲۰ شهریور گزارش‌های منتشر شده درباره دیدار وزیر خارجه ایران با همتایانش از کشورهای منطقه در عمان را تأیید کرد. اسماعیل بقائی گفت که این نشست با حضور ایران، عراق و دیگر کشورهای ساحلی خلیج فارس، روز دوشنبه ۲۳ شهریور برگزار خواهد شد. او اعلام کرد در این نشست «درباره مسائل منطقه‌ای و نتایج مذاکرات ایران و عمان راجع به «تعیین مسیرهای امن برای دریانوردی تجاری در تنگه هرمز» بحث و تبادل نظر خواهد شد. ساعاتی پیش‌تر روزنامه فایننشال تایمز به نقل از منابع مطلع نوشت وزیر خارجه ایران قرار است روز دوشنبه در شهر ساحلی صلاله عمان با همتایانش در کشورهای عرب خلیج فارس به‌منظور تلاش برای «نهایی کردن یک توافق موقت درباره مدیریت تردد در تنگه هرمز» دیدار کند. خبرگزاری بلومبرگ هم در گزارشی به نقل از افراد مطلع نوشت که وزرای خارجه کشورهای حاشیه خلیج فارس در حال بررسی دیدار با مقامات ایرانی در هفتهٔ آینده برای بحث در مورد آیندهٔ تنگه هرمز هستند."}, {"source": "Radio Farda", "title": "شورای پذیرش دانشکده‌های حقوق آمریکا ارائه خدمات به برخی کاربران ایرانی را متوقف کرد", "link": "https://www.radiofarda.com/a/us-iran-sanctions-lsac-law-school-services/33852354.html", "summary": "این سازمان در پاسخ به پرسش رادیوفردا گفت این اطلاعیه برای رعایت قوانین تحریمی ارسال شده و افرادی که به‌طور بالقوه ممکن بوده تحت تأثیر این محدودیت‌ها قرار گیرند، از آن مطلع شده‌اند.", "date_str": "2026-09-11T11:02:55+00:00", "hash": "6300406bd81a3f1c", "title_fa": "شورای پذیرش دانشکده‌های حقوق آمریکا ارائه خدمات به برخی کاربران ایرانی را متوقف کرد", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند شورای پذیرش دانشکده‌های حقوق آمریکا (LSAC) در پی تغییر تازه در مقررات تحریم‌های ایالات متحده علیه ایران، ارائه خدمات به شماری از کاربران ایرانی را متوقف کرده است. «السک» نهادی غیرانتفاعی است که از جمله آزمون «الست» (LSAT)، آزمون ورودی بسیاری از دانشکده‌های حقوق در آمریکا، را برگزار می‌کند و خدمات مربوط به درخواست پذیرش در این دانشکده‌ها را نیز ارائه می‌دهد. السک در روزهای اخیر در ایمیلی به شماری از کاربران خود اعلام کرد که در پی تصمیم تازهٔ وزارت خزانه‌داری آمریکا دربارهٔ تحریم‌های ایران، دیگر قادر به ارائه برخی خدمات به آن‌ها نیست. این سازمان در پاسخ به پرسش رادیوفردا گفت این اطلاعیه برای رعایت قوانین تحریمی ایالات متحده علیه ایران ارسال شده و «افرادی که به‌طور بالقوه ممکن بوده تحت تأثیر» این محدودیت‌ها قرار گیرند، از آن مطلع شده‌اند. السک همچنین به رادیوفردا گفت ارائه خدمات به کسانی را که «مدارکی دال بر معافیت از این محدودیت‌ها» ارائه کرده‌اند از سر گرفته است، اما در پاسخ خود توضیح نداد منظور از چنین مدارکی دقیقاً چیست."}, {"source": "Radio Farda", "title": "گزارش آنتروپیک از نقش هوش مصنوعی در عملیات تبلیغاتی و امنیتی نهادهای مرتبط با ایران", "link": "https://www.radiofarda.com/a/anthropic-ai-misuse-iran-surveillance-influence-operations/33852261.html", "summary": "در میان موارد شناسایی‌شدهٔ این شرکت هوش مصنوعی، چندین عملیات مرتبط با نهادهای حکومتی و امنیتی ایران و همچنین شبکه‌ای منتسب به سازمان مجاهدین خلق نیز قرار دارد.", "date_str": "2026-09-11T08:32:28+00:00", "hash": "a99ab5a901a68339", "title_fa": "گزارش آنتروپیک از نقش هوش مصنوعی در عملیات تبلیغاتی و امنیتی نهادهای مرتبط با ایران", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند شرکت آمریکایی «آنتروپیک» در گزارشی جدید از «شناسایی و مقابله با سوءاستفاده از هوش مصنوعی» اعلام کرد دولت‌ها، گروه‌های هکری و شبکه‌های سیاسی به‌طور فزاینده‌ای از هوش مصنوعی برای اجرای عملیات سایبری، نظارت بر مخالفان، تبلیغات سیاسی و حتی توسعهٔ نرم‌افزارهای مرتبط با موشک و پهپاد استفاده می‌کنند. در میان موارد شناسایی‌شدهٔ این شرکت هوش مصنوعی، چندین عملیات مرتبط با نهادهای حکومتی و امنیتی ایران و همچنین شبکه‌ای منتسب به سازمان مجاهدین خلق نیز قرار دارد. گزارش جدید آنتروپیک، سازندهٔ مدل هوش مصنوعی «کلود»، که شامگاه پنج‌شنبه ۱۹ شهریور منتشر شد، فعالیت‌های شناسایی و مختل‌شده بین دسامبر ۲۰۲۵ تا اوت ۲۰۲۶ را در حوزه‌های گوناگون بررسی کرده است. آنتروپیک تأکید کرده است که موارد مطرح‌شده در این گزارش نمونه‌های معمول استفاده از کلود نیستند، بلکه از مهم‌ترین و تازه‌ترین نمونه‌های سوءاستفاده‌ای هستند که تیم اطلاعات تهدید این شرکت شناسایی کرده است. بخش قابل توجهی از گزارش آنتروپیک به فعالیت‌های مرتبط با ایران اختصاص دارد."}, {"source": "Radio Farda", "title": "حوثی‌ها در ادامه پیشروی خود شهر ساحلی «ذو باب» را تصرف کردند و به باب‌المندب رسیدند", "link": "https://www.radiofarda.com/a/houthis-advance-bab-al-mandab-yemen-clashes/33852188.html", "summary": "گزارش‌ها از یمن حاکی است شبه‌نظامیان حوثی‌، پس از تصرف بندر «المخا» در غرب این کشور، پیشروی خود در امتداد ساحل دریای سرخ را ادامه داده و به باب‌المندب رسیده‌اند.", "date_str": "2026-09-11T05:48:56+00:00", "hash": "7cfde83b760a74aa", "title_fa": "حوثی‌ها در ادامه پیشروی خود شهر ساحلی «ذو باب» را تصرف کردند و به باب‌المندب رسیدند", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند گزارش‌ها از یمن حاکی است شبه‌نظامیان حوثی با تصرف شهر ساحلی «ذو باب» و رسیدن به جزیرهٔ راهبردی «میون» یا پریم، در ادامهٔ پیشروی سریع خود در امتداد ساحل دریای سرخ به تنگهٔ باب‌المندب رسیدند. چهار منبع دولت یمن روز جمعه ۲۰ شهریور به خبرگزاری رویترز گفتند حوثی‌ها به جزیرهٔ میون در تنگهٔ باب‌المندب رسیده‌اند. پیش از آن، دو منبع دولت یمن گفته بودند نیروهای دولتی از این جزیره عقب‌نشینی کرده و حوثی‌ها شهر ذو باب، در ساحل روبه‌روی آن، را نیز تصرف کرده‌اند. ذو باب مستقیماً در ساحل باب‌المندب قرار دارد و جزیرهٔ میون نیز در میان این تنگه واقع شده است. کنترل این دو نقطه برای تسلط بر یکی از مهم‌ترین آبراه‌های تجاری جهان اهمیت راهبردی دارد. این تازه‌ترین مرحلهٔ پیشروی حوثی‌ها در غرب یمن است. آن‌ها روز پنج‌شنبه بندر تاریخی و راهبردی «المخا» در جنوب استان تعز و جزایر حنیش در دریای سرخ را تصرف کردند و سپس حرکت خود را به سوی جنوب و باب‌المندب ادامه دادند. جزایر حنیش مجموعه‌ای از جزایر یمنی در جنوب دریای سرخ هستند که در نزدیکی ورودی شمالی تنگهٔ باب‌المندب قرار دارند."}, {"source": "Radio Farda", "title": "ترامپ گزارش‌ها درباره آسیب‌دیدن هواپیماهای آمریکایی در حمله ایران به اردن را رد کرد", "link": "https://www.radiofarda.com/a/multiple-us-military-aircraft-suffered-damage-in-overnight-strikes-on-jordan-air-base-cbs-says-/33851851.html", "summary": "در حالی‌که اردن از رهگیری تقریباً همۀ موشک‌های ایران در جریان حملۀ صبحگاه چهارشنبه خبر داده، شبکۀ سی‌بی‌اِس به نقل از منابع نظامی نوشته چندین هواپیمای نظامی آمریکایی آسیب دیده‌اند.", "date_str": "2026-09-10T15:54:04+00:00", "hash": "c75d115d194bd5af", "title_fa": "ترامپ گزارش‌ها درباره آسیب‌دیدن هواپیماهای آمریکایی در حمله ایران به اردن را رد کرد", "summary_fa": "لینک به این صفحه در مناطقی که وبسایت ما مسدود است، کار می‌کند دونالد ترامپ، رئیس‌جمهور آمریکا، گزارش‌های رسانه‌ای مبنی بر آسیب‌دیدن هواپیماهای آمریکایی در جریان حملات موشکی اخیر جمهوری اسلامی به اردن را رد کرد. او پنج‌شنبه ۱۹ شهریور در مصاحبه با شبکه نیوزنیشن، در پاسخ به سؤالی درباره این گزارش‌ها، گفت: «نه. هیچ خسارتی وارد نشده است. هیچ اتفاقی نیفتاده است.» کمی قبل از اظهارات ترامپ، شبکه خبری فاکس به نقل از یک مقام ارشد آمریکایی نوشته بود که موشک‌های بالستیک ایرانی در جریان حمله گسترده موشکی سه‌شنبه، ۱۷ شهریور، به هواپیماهای جنگی آمریکا مستقر در اردن، آسیب زده‌اند. فاکس‌نیوز این خبر را به گزارش جنیفر گریفین، خبرنگار ارشد خود منتشر کرده است. شبکۀ خبری سی‌بی‌اِس برای نخستین‌بار این موضوع را منتشر کرده بود که در جریان حملات موشکی ایران به پایگاه نیروهای آمریکایی در اردن، «چندین هواپیمای نظامی ایالات متحده، آسیب دیده‌اند»."}],
      tech: [{"source": "MIT AI", "title": "Lifesaving Lincoln Laboratory device wins 2026 Excellence in Technology Transfer Award", "link": "https://news.mit.edu/2026/lifesaving-lincoln-laboratory-technology-wins-tech-transfer-award-0911", "summary": "The Federal Laboratory Consortium (FLC) selected AI-GUIDE, a medical device developed by MIT Lincoln Laboratory and Massachusetts General Hospital (MGH), for its 2026 Excellence in Technology Transfer Award. This award recognizes federal laboratories and collaborators who have accomplished outstanding work in the process of transferring technology. With funding from the U.S. Army's Combat Casualty Care Research Program (CCC), Lincoln Laboratory and MGH developed AI-GUIDE and are in the process of transferring the prototype to the startup company AutonomUS Medical Technologies, Inc. \"This recognition reflects what effective technology transfer looks like — aligning the Army's operational need with Mass General's clinical expertise and Lincoln Laboratory's engineering capabilities to deliver a solution with a clear path to impact. The transition to AutonomUS underscores how strong partnerships can carry a technology from development into real-world adoption,\" says Asha Rajagopal, Lincoln Laboratory's chief technology transfer officer. AI-GUIDE's transition to industry promises improved health outcomes for injured service members and civilians. Unlike ultrasound devices typically found in hospitals, AI-GUIDE is small and portable, making it ideal for use in pre-hospital settings. Pairing custom-developed AI software with commercial handheld ultrasound technology, AI-GUIDE helps the user insert a guidewire and catheter into a patient's blood vessel. This capability is especially important for U.S. military medics, who must keep injured soldiers alive in the field — sometimes for days — before they can be evacuated to a hospital. AI-GUIDE allows medics with minimal specialized training to administer medical interventions that would otherwise be impossible outside of the hospital, drastically improving patients’ chances of survival. The AI-GUIDE project has served as a framework for effective technology development and transfer. Within just three years, AI-GUIDE went from an idea proposed by CCC to a fully working proof-of-concept technology with its own startup company. Once the prototype was developed, clinical testing at MGH proved its viability, and Lincoln Laboratory and MGH staff then founded AutonomUS Medical Technologies to facilitate the commercialization process. With support from the MIT Technology Licensing Office, Lincoln Laboratory Technology Transfer Office, and CCC, the company secured U.S. Food and Drug Administration (FDA) Breakthrough Device D", "date_str": "2026-09-11T13:45:00+00:00", "hash": "10f288b33b4f3885", "title_fa": "دستگاه Lincoln Laboratory Lincoln برنده جایزه برتری در انتقال فناوری 2026 شد", "summary_fa": "کنسرسیوم آزمایشگاه فدرال (FLC) AI-GUIDE، یک دستگاه پزشکی که توسط آزمایشگاه MIT لینکلن و بیمارستان عمومی ماساچوست (MGH) توسعه یافته است را برای جایزه برتری در انتقال فناوری در سال 2026 انتخاب کرد. این جایزه از آزمایشگاه‌های فدرال و همکارانی که کارهای برجسته‌ای را در فرآیند انتقال فناوری انجام داده‌اند، قدردانی می‌کند. با کمک مالی آمریکا برنامه تحقیقاتی مراقبت از تلفات رزمی ارتش (CCC)، آزمایشگاه لینکلن و MGH AI-GUIDE را توسعه دادند و در حال انتقال نمونه اولیه به شرکت استارتاپ AutonomUS Medical Technologies, Inc. هستند. برای ارائه راه حلی با مسیری روشن برای تأثیرگذاری. Asha Rajagopal، مدیر ارشد انتقال فناوری آزمایشگاه لینکلن، می‌گوید: انتقال به AutonomUS نشان می‌دهد که چگونه مشارکت‌های قوی می‌توانند فناوری را از توسعه به پذیرش در دنیای واقعی منتقل کنند. انتقال AI-GUIDE به صنعت نویدبخش بهبود نتایج سلامتی برای اعضای خدمات آسیب‌دیده و غیرنظامیان است. برخلاف دستگاه‌های اولتراسوند که معمولاً در بیمارستان‌ها استفاده می‌شود، دستگاه‌های AI-GUIDE ایده‌آل هستند. تنظیمات پیش بیمارستانی AI-GUIDE با جفت کردن نرم‌افزار AI سفارشی با فناوری سونوگرافی دستی تجاری، به کاربر کمک می‌کند سیم راهنما و کاتتر را در رگ خونی بیمار قرار دهد. این قابلیت به ویژه برای پزشکان نظامی ایالات متحده مهم است که باید سربازان مجروح را قبل از انتقال به بیمارستان - گاهی اوقات برای روزها - در میدان زنده نگه دارند. AI-GUIDE به پزشکان با حداقل آموزش تخصصی اجازه می دهد تا مداخلات پزشکی را انجام دهند که در غیر این صورت در خارج از بیمارستان غیرممکن بود و شانس بقای بیماران را به شدت بهبود می بخشد. پروژه AI-GUIDE به عنوان چارچوبی برای توسعه و انتقال موثر فناوری عمل کرده است. تنها در عرض سه سال، AI-GUIDE از ایده‌ای که توسط CCC پیشنهاد شده بود، به یک فناوری اثبات مفهوم کاملاً کارآمد با شرکت استارت‌آپ خود تبدیل شد."}, {"source": "TechCrunch AI", "title": "Jensen Huang explains why Nvidia will grow an astounding 70% next year", "link": "https://techcrunch.com/2026/09/10/jensen-huang-explains-why-nvidia-will-grow-an-astounding-70-next-year/", "summary": "Nvidia has its finger in every pie, and sees another year of plenty in its future, Jensen Huang says. But, he insists, its deals are not circular.", "date_str": "2026-09-10T21:51:59+00:00", "hash": "099669ff8144141c", "title_fa": "جنسن هوانگ توضیح می دهد که چرا انویدیا در سال آینده 70 درصد رشد خواهد کرد", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبارات: JOSH EDELSON/AFP / Getty Images Enterprise Jensen Huang توضیح می دهد که چرا انویدیا در سال آینده 70% رشد خواهد کرد جولی بورت 2:51 بعد از ظهر جنسن هوانگ روز پنجشنبه به شرکت کنندگان در کنفرانس گلدمن ساکس Communacopia + Technology گفت که چرا سلطه هوش مصنوعی - و درآمدهای شرکتش - تا پایان سال آینده به رکورد رشد خود ادامه خواهد داد. در مورد اینکه آیا حزب انویدیا با رقابت فزاینده‌ای برای پردازنده‌های گرافیکی و تراشه‌های هوش مصنوعی از همه جهات مواجه است یا خیر، بحث‌های بی‌پایانی وجود دارد: مقیاس‌کننده‌های بزرگ (آمازون، مایکروسافت و گوگل که هر کدام خودشان را می‌سازند) و آزمایشگاه‌های هوش مصنوعی (Anthropic و OpenAI که خودشان را می‌سازند)، و همچنین از رقبای عمومی تازه‌ای مانند Cerebras و. اکثر مردم فکر می کنند انویدیا یک تراشه می سازد. هوانگ گفت، منظورم این است که شما برای ارسال آنچه می‌سازیم به هواپیما نیاز دارید، و افزود که این شرکت از همان روزهای اولیه خود به مبارزه با این تصور ادامه می‌دهد. Nvidia GPU را اختراع کرد که در آن زمان تا حد زیادی به مصرف کنندگان فروخته می شد تا بازی های رایانه شخصی را بهبود بخشد. یک GPU در حال حاضر 399 دلار نیست. 8.5 میلیون دلار است. این یک پردازنده گرافیکی است که همه به NVLink متصل هستند، 2 میلیون قطعه، درست است؟ 250000 کیلووات این یک GPU است و ما هزاران عدد از آنها را ارسال می کنیم. او افزود که سفارشات فقط برای یک محصول، یک سیستم کامپیوتری که 36 CPU Grace را با 72 GPU Blackwell ترکیب می کند، در حال حاضر 27 درصد رشد فروش ماهانه"}, {"source": "TechCrunch AI", "title": "Mark Wahlberg is coming to TechCrunch Disrupt 2026, and he wants to talk about your work, not his", "link": "https://techcrunch.com/2026/09/10/mark-wahlberg-is-coming-to-techcrunch-disrupt-2026/", "summary": "Mark Wahlberg joins Bruce K. Lee at Disrupt to discuss investing, entrepreneurship, healthcare, wellness, and building businesses.", "date_str": "2026-09-10T21:35:00+00:00", "hash": "6671299d14997989", "title_fa": "مارک والبرگ به TechCrunch Disrupt 2026 می آید و می خواهد در مورد کار شما صحبت کند نه او", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار صرفه جویی کنید در Disrupt Image اعتبار: Jesse Grant / استارت آپ Getty Images مارک والبرگ به TechCrunch Disrupt 2026 می آید، و او می خواهد در مورد کار شما صحبت کند، نه رویدادهای TechCrunch خود 2:35 بعد از ظهر: 6 سپتامبر 2010، PDT. والبرگ به همان اندازه در لیست A قرار دارد. او در سال ۱۹۹۷ در «شب‌های بوگی» شروع به کار کرد، و در تقریباً سه دهه پس از آن، یکی از پرمخاطب‌ترین حرفه‌ها در هالیوود را ساخت: دو نامزدی جایزه اسکار، یک جایزه گلدن گلوب برای The Fighter، چندین نامزدی امی به عنوان تهیه‌کننده (همراهان HBO در میان آنها)، و یک اتوبوس درام، فیلم‌نامه‌نویس‌های جنایی، فیلم‌نامه‌نویس‌های جنایی. در حال حاضر، او در فیلم By Any Means، یک تریلر تعقیب و گریز انسان‌ها که در جریان قتل‌های حقوق مدنی می‌سی‌سی‌پی در سال 1966 اتفاق می‌افتد، دوباره به روی پرده می‌رود. او همچنین نشان می دهد که به طور فزاینده ای توجه خود را به کجا معطوف می کند. والبرگ با بروس کی لی، بنیانگذار و مدیرعامل Keebeck Wealth Management، روی صحنه اصلی در TechCrunch Disrupt 2026 می نشیند تا درباره این پیشرفت صحبت کند. بلیط خود را اینجا بگیرید تا لحظه ای از این جلسه و Disrupt 2026 را از دست ندهید. قیمت بلیت ها در 25 سپتامبر افزایش می یابد. حرفه بازیگری او واقعاً تنها بخشی از تصویر است. در طول دو دهه گذشته، والبرگ یک شرکت تولید، یک رستوران زنجیره‌ای، سرمایه‌گذاری‌های پوشاک و تناسب اندام، مجموعه‌ای از سرمایه‌گذاری‌های فرشته، و بنیاد جوانان مارک والبرگ که اکنون ۲۵ ساله است، ساخته است که از کودکان و نوجوانان درون شهر حمایت می‌کند. او از موفقیت خود در هالیوود برای راه‌اندازی پروژه‌های بزرگ"}, {"source": "TechCrunch AI", "title": "OpenAI puts Pro subscriptions on hold due to Astra demand", "link": "https://techcrunch.com/2026/09/10/openai-puts-pro-subscriptions-on-hold-due-to-astra-demand/", "summary": "The company said Pro subscriptions put the most strain on its systems, so it's pausing sign-ups while adding more capacity.", "date_str": "2026-09-10T20:59:51+00:00", "hash": "f333efb24e38eda4", "title_fa": "OpenAI اشتراک های Pro را به دلیل تقاضای Astra متوقف می کند", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کننده اعتبار: ساموئل بووین/نور عکس/ گتی ایماژ AI OpenAI اشتراک های حرفه ای را به دلیل تقاضای Astra متوقف می کند سارا پرز 1:59 بعد از ظهر PDT · 10 سپتامبر 2026 تقاضا برای Astra، قدرتمندترین مدل، شرکت OpenAI را به حالت تعلیق درآورده است. با اشاره به فشار بر زیرساخت های آن، اشتراک های برنامه حرفه ای 200 دلاری خود را متوقف کنید. این حرکت در X توسط رهبر محصول OpenAI، Thibault (Tibo) Sottiaux، که محصولات اصلی مانند Codex و ChatGPT را در آزمایشگاه هوش مصنوعی رهبری می‌کند، اعلام شد. او گفت که طرح Pro بیشترین فشار را به سیستم های آن وارد می کند، به همین دلیل است که ثبت نام برای این ردیف خدمات اکنون غیرفعال شده است. Sottiaux نوشت: ما می خواستیم کوچکترین قدمی برداریم که به ما امکان می دهد به گسترده ترین دسترسی ممکن ادامه دهیم. او اضافه کرد که برنامه‌های دیگر این شرکت، از جمله API و طرح‌های کم‌هزینه Go and Plus، همچنان در دسترس هستند. این شرکت روز چهارشنبه هشدار داد که ممکن است چنین تغییری رخ دهد. در آن زمان، سوتیو نوشت، تقاضا برای Astra واقعا بی سابقه است. ما همه اهرم‌های ممکن را برای حفظ تقاضا به کار می‌گیریم، اما تا به حال چیزی شبیه به آن ندیده‌ام و قبلاً رشد بسیار شدیدی را پشت سر گذاشته‌ایم. اولویت همیشه حفظ خدمات عالی برای کاربران فعلی خواهد بود، اما ممکن است مجبور شویم اشتراک‌های Pro جدید را برای مدتی متوقف کنیم."}, {"source": "TechCrunch AI", "title": "Anthropic details distillation campaigns from Alibaba, Moonshot AI, and DeepSeek", "link": "https://techcrunch.com/2026/09/10/anthropic-details-distillation-campaigns-from-alibaba-moonshot-ai-and-deepseek/", "summary": "A new report released Thursday by Anthropic alleges persistent distillation attacks by China-based AI companies, which have escalated in recent months as competition in the space has intensified.", "date_str": "2026-09-10T20:57:30+00:00", "hash": "ac93c1acfed86a9a", "title_fa": "کمپین های تقطیر Anthropic جزئیات از Alibaba، Moonshot AI، و DeepSeek", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25 درصد تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبارات: دومینیکا زارزیکا/SOPA Images/LightRocket/ Getty Images AI کمپین های تقطیر جزئیات Anthropic از Alibaba، Moonshot AI، و DeepSeek Russell Brandom · گزارش جدید پنجشنبه 1:57 سپتامبر 21، PDT منتشر شد. حملات مستمر تقطیر انسانی توسط شرکت‌های هوش مصنوعی مستقر در چین، که در ماه‌های اخیر با تشدید رقابت در فضا تشدید شده است. در این گزارش آمده است که طی چند ماه گذشته، آزمایشگاه‌های غیرمجاز روش‌های پیچیده‌تری را برای دور زدن سیستم‌های دفاعی ما و بهره‌برداری از قابلیت‌های مدل‌های مرزی ایالات متحده توسعه داده‌اند. کمپین هایی که ما شناسایی کردیم، برخی از با ارزش ترین قابلیت های کلود، از جمله قابلیت های عاملی و استفاده از ابزار، کدگذاری و تجزیه و تحلیل داده ها، و استدلال منطقی را هدف قرار دادند. آنتروپیک قبلاً در ماه فوریه در مورد حملات تقطیر صحبت کرده بود و حتی از آزمایشگاه‌های خاص نیز فراخوانده بود. OpenAI فعالیت مشابهی را گزارش کرده است که به طور خاص به DeepSeek نسبت داده شده است. اما کمپین هایی که در گزارش جدید آنتروپیک شرح داده شده است، هم بزرگتر و هم تهاجمی تر هستند. در مجموع، این شرکت نزدیک به 200 میلیون مبادله مرتبط با حملات تقطیر را مشاهده کرد که به پنج کمپین جداگانه نسبت داده می شد. به طور کلی، حملات تقطیر بر استخراج زنجیره فکر از پاسخ مدل به سؤالات مختلف متمرکز است. سپس می توان از آن زنجیره فکری برای آموزش مدل کوچکتر در مورد توانایی استدلال کلی از طریق تنظیم دقیق نظارت شده استفاده کرد."}, {"source": "TechCrunch AI", "title": "Meta’s AI agent Muse is now the No. 2 app in the US", "link": "https://techcrunch.com/2026/09/10/metas-ai-agent-muse-is-now-the-no-2-app-in-the-us/", "summary": "Meta's newest app Muse is off to a slower start than the company's other apps, like Meta AI or Threads.", "date_str": "2026-09-10T19:50:04+00:00", "hash": "2465d1dda9a7a8fa", "title_fa": "عامل هوش مصنوعی متا، Muse، اکنون برنامه شماره 2 در ایالات متحده است", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت بر اساس تقاضای عمومی: تا 300 دلار صرفه جویی در هزینه تصویر مختل کنید اعتبارات: ساموئل بووین/نور عکس (در پنجره جدیدی باز می شود) / گتی ایماژ، عامل هوش مصنوعی AI Meta، Muse اکنون برنامه شماره 2 در ایالات متحده است سارا پرز 12:50 بعد از ظهر، 12:50 بعد از ظهر، وال استریت 210 سپتامبر شروع می شود. از برنامه جدید هوش مصنوعی خود، Muse. فشار غول فناوری به سمت هوش مصنوعی عاملی نیز یکی از موضوعات داغ X در میان بازیگران صنعت است. اکنون، اعداد اولیه بینش بهتری در ling with our lives”, has cut through where bigger names have not. Most chillingly, he claimed that colleagues still at Anthropic aren’t staying because they think he’s wrong about the dangers of pursuing self-improving super intelligence – the holy grail of machines that are not just smarter than humans but capable of building their own even more powerful successors, evolving independently of humans – but because they’re afraid of ceding the field to people with fewer scruples. His colleagues, Coxon said, talk routinely about the “endgame” or the “ crunch time ”, meaning that what they do in the next year or two will decide the fate of humanity. Whether that’s true or simply self-aggrandising techbro delusion, what he describes is an industry now practically begging to be saved from itself. Gaby Hinsliff is a Guardian columnist Continue reading...", "date_str": "2026-09-11T10:00:01+00:00", "hash": "4103303ccdfba7d6", "title_fa": "افشاگران فناوری هشدار می دهند که هوش مصنوعی می تواند بشریت را از بین ببرد. Doomspeak یا نه، باید این ادعاها را جدی بگیریم | گابی هینسلیف", "summary_fa": "عوامل هوش مصنوعی پایگاه‌های اطلاعاتی را هک کرده‌اند و زندگی خود را آغاز کرده‌اند - اکنون زمان آن است که تحقیقات مخاطره‌آمیز را قبل از اینکه خیلی دیر شود متوقف کنیم، روزی دیگر، یک سوارکار دیگر آخرالزمان بر فراز افق می‌چرخد. اخیراً از بسیاری از محکومان هوش مصنوعی شنیده ایم - افشاگران فناوری که هشدار می دهند احتمالاً کار آنها ما را می کشد - که تقریباً از این بابت عصبانی می شویم. بشریت ظرف یک دهه از بین رفت؟ خوب، فقط در صورتی که جنگ جهانی دیگر یا بحران آب و هوایی اول ما را نگیرد. از آنجایی که هرگز مشخص نیست که آیا تهدید فناوری واقعی است یا فقط یک شکل پیچ خورده از هیاهوی صنعتی است که با قوی‌تر کردن محصولاتشان از آنچه واقعاً هستند، سرمایه‌گذاری را افزایش می‌دهد، بسیاری از ما به سختی به آن فکر نمی‌کنیم. اما چیزی در مورد استعفای علنی محقق هوش مصنوعی جاکوب کاکسون از آزمایشگاه پیشرفته آمریکایی Anthropic، از طریق پستی در X با این استدلال که او نمی‌تواند به کار برای شرکت‌هایی که «با زندگی ما قمار می‌ h to revive American chip manufacturing , is about to lose more than a quarter of the water it typically pulls each year from the Colorado River. The 1,400-mile waterway is a crucial lifeline for the region and other western states. A recent federal decision on how to manage its dwindling flow hits Arizona, and its already drought-prone desert communities, particularly hard . The river provides more than a third of the Grand Canyon State's water. Arizona has been a manufacturing hub since the start of the semiconductor industry, and now it's where TSMC and Intel are expanding massive factories to m … Read the full story at The Verge.", "date_str": "2026-09-11T12:00:00+00:00", "hash": "8962cf6379a3f548", "title_fa": "راه نجات آریزونا برای تولید تراشه در حال خشک شدن است", "summary_fa": "برج های ورودی آب در سد هوور در کنار یک «حلقه وان حمام» سفید شده در سواحل دریاچه مید در 1 سپتامبر در منطقه تفریحی ملی لیک مید، آریزونا قرار دارند. این مخزن به دلیل خشکسالی بی‌سابقه رودخانه کلرادو به پایین‌ترین سطح تاریخی رسیده است. | عکس: گتی ایماژ آریزونا، مرکز تلاش دو حزبی برای احیای تولید تراشه در آمریکا، در آستانه از دست دادن بیش از یک چهارم آبی است که معمولاً هر سال از رودخانه کلرادو می‌کشد. آبراه 1400 مایلی یک راه حیاتی حیاتی برای منطقه و سایر ایالت های غربی است. تصمیم اخیر فدرال در مورد نحوه مدیریت جریان رو به کاهش آن به آریزونا و جوامع بیابانی که قبلاً مستعد خشکسالی هستند، به ویژه سخت می‌زند. این رودخانه بیش از یک سوم آب ایالت گرند کانیون را تامین می کند. آریزونا از زمان شروع صنعت نیمه هادی ها یک مرکز تولید بوده است، و اکنون جایی است که TSMC و اینتل در حال گسترش کارخانه های عظیم به متر ... داستان کامل را در The Verge بخوانید."}, {"source": "The Verge", "title": "Insta360 launches a single-lens Osmo Pocket rival you can actually buy in the US", "link": "https://www.theverge.com/gadgets/993837/insta360-luna-pro-steadicam-gimbal-release-price-specs", "summary": "I saw the Luna Pro briefly at the IFA trade show, and it looks and feels a lot like the Ultra. | Photo: Dominic Preston / انه نیست، اما یکی از آن تغییراتی است که احتمالاً برای بسیاری از مردم مفید خواهد بود. بسیاری از ما بازگشت به خانه از یک مهمانی، کنسرت، تعطیلات، یا بیرون رفتن شبانه با دوستان و مرور آلبوم مشترک را تجربه کرده‌ایم، اما متوجه شده‌ایم که یکی از آنها قبلاً همه را شکست داده و یکی از بهترین عکس‌های گروهی را پست کرده است و شما را در این روند تگ کرده است. در حالی که می توانید همان عکس را خودتان پست کنید، این کمی ناخوشایند به نظر می رسد. بنابراین اینستاگرام اکنون یک راه حل دارد. می‌توانید یک پست برچسب‌گذاری‌شده را از طریق اعلان DM که هنگام برچسب‌گذاری دریافت می‌کنید، مستقیماً از خود پست یا از طریق برگه برچسب‌گذاری شده به شبکه خود اضافه کنید. اگر بعداً نظر خود را تغییر دهید، می توانید به راحتی پست را از نمایه خود حذف کنید."}, {"source": "TechCrunch Main", "title": "Google is making it easier to switch between password managers on Android", "link": "https://techcrunch.com/2026/09/10/google-is-making-it-easier-to-switch-between-password-managers-on-android/", "summary": "Google's new feature will transfer your passkeys as well.", "date_str": "2026-09-10T16:00:00+00:00", "hash": "821a4ab586d777f4", "title_fa": "گوگل جابه‌جایی بین مدیریت رمز عبور را در اندروید آسان‌تر می‌کند", "summary_fa": "Disrupt 2026: OpenAI، Anthropic، Replit، و موارد دیگر در 6 مرحله صنعتی قرار می گیرند. 25% تخفیف بلیط اکنون بازگشت با تقاضای عمومی: تا 300 دلار در Disrupt صرفه جویی کنید Google روز پنجشنبه یک تجربه تغییر مدیر رمز عبور جدید در اندروید را معرفی کرد که نیازی به دانلود فایل های CSV در هنگام مهاجرت به یک برنامه جدید ندارد. با این ویژگی جدید، کاربران می‌توانند تمام رمزهای عبور و حتی کلیدهای عبور خود را بین برنامه‌ها به طور یکپارچه جابه‌جا کنند. برای استفاده از سیستم جدید، کاربران ابتدا برنامه مدیریت رمز عبور جدید خود را باز می‌کنند و انتخاب می‌کنند تا رمزهای عبور را از برنامه مدیریت قدیمی وارد یا کپی کنند. Android برنامه های مدیر را در دستگاه شناسایی می کند و انتقال بین هر دو برنامه را هماهنگ می کند. کاربران می توانند اطلاعات در حال انتقال را بررسی کرده و با چند ضربه آن را تایید کنند. از آنجایی که این
