ازدهی را بالاتر می برد. در یادداشتی که توسط The Kobeissi Letter در X پس از اعلام این خبر منتشر شد، آمده است: «با ادامه جنگ ایران، بازار اوراق قرضه به معنای واقعی کلمه در حال مبارزه با خزانه‌داری ایالات متحده است، با بازده اسکناس 10Y که از زمان شروع جنگ به یک نقطه پایه +100 نزدیک می‌شود». در ادامه این بیانیه آمده است: \"بدون پایان جنگ ایران، ما در مسیری هستیم که تا هفته آینده بازده اسکناس 10Y را بالای"}, {"source": "Business Insider", "title": "The biggest name in YouTube golf got heat from fans for signing with LIV Golf. Now, it owes him $1.4 million.", "link": "https://www.businessinsider.com/youtube-golfer-rick-shiels-owed-liv-golf-saudi-arabia-2026-9", "summary": "Rick Shiels has over 3 million YouTube subscribers. David Cannon/Getty Images LIV Golf, the rebel golf league backed by Saudi Arabia, filed for bankruptcy protection this week. Court documents showed that LIV owes golf's biggest YouTuber, Rick Shiels, $1.4 million. Shiels, who has over 3 million subscribers, faced backlash after signing a deal with LIV in 2025. Saudi-funded rebel golf tour LIV has revealed it owes Rick Shiels, the sport's biggest social media star, more than $1 million. LIV Golf attracted some of golf's top stars by offering huge paychecks when it launched in 2022. On Tuesday, it filed for Chapter 11 bankruptcy protection. On its list of current largest creditors is Rick Shiels Media, the company run by Shiels, a golf instructor turned YouTuber who now has over 3 million subscribers on his main channel. Rick Shiels Media is owed $1.4 million in unsecured debts, according to documentation filed by LIV in the United States Bankruptcy Court for the District of New Jersey. Shiels is among 24 people and entities listed owed more than $1 million by LIV, including many golfers on the tour. Jon Rahm and Bryson DeChambeau, the two most prominent players who turned their backs on the long-established PGA Tour to join LIV , are each owed more than $7 million, bankruptcy documents show. The PIF, the Saudi wealth fund that financed LIV, has agreed to provide $49.6 million in debtor-in-possession financing to repay creditors, it said in a statement accompanying the bankruptcy filing. In the bankruptcy filing, LIV CEO Scott O'Neil said the move would provide the \"structure and time to pursue a landmark transaction and begin the next chapter of LIV Golf.\" Rick Shiels Media did not immediately respond to a request for comment from Business Insider. LIV Golf declined to comment on individual contracts and said the Chapter 11 filing was part of \"a comprehensive set of steps\" to secure its future. I went to the first-ever tournament of LIV Golf, the breakaway Saudi-backed tour offering players hundreds of millions to compete. Here's what it was like. YouTube golf's biggest name Shiels, a UK-based former golf pro, attracted substantial criticism from fans in January 2025 when he announced he would become an ambassador and content creator for LIV. Much of the backlash centered on LIV's backing by the PIF, which has long faced accusations of sportswashing after investing billions of dollars into numerous sports, including golf, Formula 1, boxing, and soccer. He ", "date_str": "2026-09-09T17:35:06+00:00", "hash": "b61720008592892c", "title_fa": "بزرگ‌ترین نام گلف یوتیوب به خاطر امضای قرارداد با LIV Golf مورد علاقه طرفداران قرار گرفت. اکنون 1.4 میلیون دلار به او بدهکار است.", "summary_fa": "ریک شیلز بیش از 3 میلیون مشترک یوتیوب دارد. دیوید کانن/ گتی ایماژ LIV Golf، لیگ گلف شورشی تحت حمایت عربستان سعودی، این هفته درخواست حمایت از ورشکستگی داد. اسناد دادگاه نشان داد که LIV به بزرگترین یوتیوبر گلف، ریک شیلز، 1.4 میلیون دلار بدهکار است. شیلز، که بیش از 3 میلیون مشترک دارد، پس از امضای قرارداد با LIV در سال 2025، با واکنش‌های منفی مواجه شد. تور گلف شورشیان با بودجه عربستان سعودی LIV نشان داد که بیش از 1 میلیون دلار به ریک شیلز، بزرگترین ستاره رسانه‌های اجتماعی این ورزش بدهکار است. LIV Golf هنگام راه‌اندازی در سال 2022 با ارائه چک‌های حقوقی هنگفت، برخی از ستاره‌های برتر گلف را جذب کرد. روز سه‌شنبه، برای حمایت از ورشکستگی فصل 11 ثبت نام کرد. در لیست بزرگترین طلبکاران فعلی، Rick Shiels Media است، شرکتی که توسط Shiels اداره می شود، مربی گلف که تبدیل به یوتیوب شده و اکنون بیش از 3 میلیون مشترک در کانال اصلی خود دارد. بر اساس اسنادی که توسط LIV در دادگاه ورشکستگی ایالات متحده در ناحیه نیوجرسی ارائه شده است، ریک شیلز مدیا 1.4 میلیون دلار بدهی بدون وثیقه دارد. شیلز در میان 24 نفر و نهادهای فهرست شده بیش از 1 میلیون دلار توسط LIV بدهکار است، از جمله بسیاری از گلف بازان در تور. اسناد ورشکستگی نشان می‌دهد که جان رام و برایسون دچمبو، دو بازیکن برجسته که از تور قدیمی PGA برای پیوستن به LIV پشت کردند، هر کدام بیش از ۷ میلیون دلار بدهکار هستند. در بیانیه ای که به همراه پرونده ورشکستگی همراه بود، اعلام کرد PIF، صندوق ثروت سعودی که LIV را تامین مالی می کند، موافقت کرده است تا 49.6 میلیون دلار به عنوان تامین مالی در اختیار بدهکاران برای بازپرداخت طلبکاران ارائه کند. در پرونده ورشکستگی، اسکات اونیل، مدیرعامل LIV گفت که این حرکت"}, {"source": "Business Insider", "title": "I'm a Londoner who always rides the Tube. Here are 10 features of the Underground that would surprise most Americans.", "link": "https://www.businessinsider.com/surprise-facts-london-underground-tube-americans-2026-9", "summary": "The author travels on the London Underground — or Tube — several times a day. Roya Shahidi Known as the Tube, the London Underground is an essential part of everyday life for most Londoners. Some of its characteristics are uncommon in American subway systems and can be confusing. From unwritten etiquette rules to fare must-knows, here are some surprising things about the Tube. While it's ridiculously busy at rush hour and way too hot in the summer, the Tube is an essential part of life in London. As a local, I sometimes use the public transit system — formally called the London Underground —more than four or five times on some days, as it's often the quickest way to get around the city. I can thank the London Tube for saving me from missed flights or arriving late for an interview. Nonetheless, I can't count how many times I've seen tourists staring at a Tube map, trying to make sense of its seemingly endless tangle of colored lines. Even as someone who uses the Tube all the time, I have the Citymapper app at the ready when taking an unfamiliar route. The Tube also has some rules — both official and unwritten — that I would consider necessary for any tourist coming to London . If you have seen what happens when someone stands on the left-hand side of the escalator, you will know what I mean. Here are 10 surprising things you probably don't know about the Tube, including some that might be useful to know as a tourist. 1. Most Tube trains have no air conditioning A commuter holds a portable handheld electric fan during the 2025 heatwave. Bloomberg/Getty Images Only about 31% of trains on the Tube network have passenger air conditioning, according to Transport for London (TFL). As soon as a heat wave hits, I cannot ride the Tube without carrying blotting paper and a handheld fan. Some lines are notorious for how hot they get. Having to take the Central Line in the summer will elicit sympathy from any Londoner. The London Standard reported that it reached almost 103 degrees during the recent June heat wave. With that in mind, you may also be surprised to learn that in 1926, the London Underground was advertised as \"cooler below\" on a hot day . 2. The seats are covered in fabric This is the most common moquette on the Tube, known as the Barman moquette. Gareth Fuller/PA Images via Getty Images Unlike the hard plastic seats in most American public transport, Tube seats are covered in a woolen fabric called moquette. It's been used on the Tube since 1920 because ", "date_str": "2026-09-09T17:13:56+00:00", "hash": "76cc71b315ae4644", "title_fa": "من یک لندنی هستم که همیشه سوار مترو هستم. در اینجا 10 ویژگی از Underground است که اکثر آمریکایی ها را شگفت زده می کند.", "summary_fa": "نویسنده با متروی لندن - یا مترو - چندین بار در روز سفر می کند. رویا شهیدی که به عنوان مترو شناخته می شود، متروی لندن بخشی ضروری از زندگی روزمره برای اکثر لندنی ها است. برخی از ویژگی های آن در سیستم های متروی آمریکا غیر معمول است و می تواند گیج کننده باشد. از قوانین آداب نانوشته گرفته تا نکاتی که باید بدانید، در اینجا چیزهای شگفت انگیزی در مورد تیوب وجود دارد. در حالی که در ساعات شلوغی به طرز مضحکی شلوغ است و در تابستان بسیار گرم است، مترو بخش مهمی از زندگی در لندن است. من به عنوان یک محلی، گاهی اوقات از سیستم حمل و نقل عمومی - که به طور رسمی متروی لندن نامیده می شود - در برخی روزها بیش از چهار یا پنج بار استفاده می کنم، زیرا اغلب سریع ترین راه برای رفت و آمد در شهر است. می‌توانم از متروی لندن برای نجات من از پروازهای از دست رفته یا دیر رسیدن برای مصاحبه تشکر کنم. با این وجود، نمی توانم شمارش کنم که چند بار گردشگرانی را دیده ام که به نقشه تیوب خیره شده اند و سعی می کنند از پیچیدگی به ظاهر بی پایان خطوط رنگی آن بفهمند. حتی به عنوان فردی که همیشه از لوله استفاده می کند، برنامه Citymapper را در هنگام انتخاب مسیر ناآشنا آماده دارم. مترو همچنین قوانینی دارد - چه رسمی و چه نانوشته - که برای هر توریستی که به لندن می آید ضروری می دانم. اگر دیده باشید که وقتی شخصی در سمت چپ پله برقی می ایستد چه اتفاقی می افتد، متوجه منظور من خواهید شد. در اینجا 10 چیز شگفت‌انگیز وجود دارد که احتمالاً درباره Tube نمی‌دانید، از جمله مواردی که ممکن است به عنوان یک توریست بدانید. 1. اکثر قطارهای تیوبی فاقد تهویه مطبوع هستند. مسافر"}, {"source": "Business Insider", "title": "Accenture and Google are teaming up to send 1,000 engineers into the field to help clients with AI", "link": "https://www.businessinsider.com/accenture-google-cloud-business-group-forward-deployed-engineers-ai-agents-2026-9", "summary": "Bloomberg/Getty Images Accenture has formed a new business group, supported by Google Cloud, to help companies deploy AI agents. The group includes 1000 forward-deployed engineers ready to embed with clients. Consulting firms have become crucial intermediaries between AI companies and large companies. Accenture is sending an army of engineers onto the AI battlefield. The consulting giant and Google Cloud are teaming up to send 1,000 engineers to work with major clients on deploying AI agents, in a partnership they're calling the Accenture Gemini Enterprise Business Group. It brings together Accenture's Google Cloud-skilled professionals and engineers with Accenture consultants with industry expertise. A key part of the group's offering is the promise of 1,000 forward-deployed engineers , Accenture professionals who are experts in the Gemini AI platform. They will embed with clients to help them roll out AI across their businesses. Forward-deployed engineers work inside companies to integrate AI into workflows and customize AI tools for each specific client to make their work easier or more efficient. The role was popularized by Palantir and is now one of the buzziest jobs in tech — postings for the position have grown more than 700% in the last year. In a press release, Accenture CEO Julie Sweet said the group's combined technical and industry expertise will help clients deploy AI agents and realize value from them more quickly. Julie Sweet, Accenture s CEO and chair. Ronny HARTMANN / AFP via Getty Images The investment also includes plans to expand Gemini Enterprise training for 50,000 Accenture employees. The new Accenture Gemini Enterprise Business Group will support clients with \"a dedicated, specialized team\" to help meet the market demand for Gemini Enterprise, Chetna Sehgal, the Accenture Gemini Enterprise Business Group lead, told Business Insider. The teams will work together on platform engineering, aligned with the client's specific industry, process, and required changes. \"That combination is what lets clients architect, build, and scale Gemini Enterprise solutions with real speed,\" said Sehgal. Tech and consulting are teaming up more and more Consultancies like Accenture shape how companies spend money, buy technology, and redesign work. They have become critical intermediaries in the AI boom, linking AI companies with their vast roster of Fortune 500 clients, who often want the familiarity and breadth that a traditional consulting firm can of", "date_str": "2026-09-09T17:06:43+00:00", "hash": "b4419ef998e0928a", "title_fa": "Accenture و Google با یکدیگر همکاری می کنند تا 1000 مهندس را به این حوزه بفرستند تا به مشتریان با هوش مصنوعی کمک کنند.", "summary_fa": "Bloomberg/Getty Images Accenture یک گروه تجاری جدید را تشکیل داده است که توسط Google Cloud پشتیبانی می شود تا به شرکت ها کمک کند تا عوامل هوش مصنوعی را مستقر کنند. این گروه شامل 1000 مهندس مستقر در آینده است که آماده به کارگیری با مشتریان هستند. شرکت های مشاوره به واسطه های مهم بین شرکت های هوش مصنوعی و شرکت های بزرگ تبدیل شده اند. Accenture ارتشی از مهندسان را به میدان نبرد هوش مصنوعی می‌فرستد. غول مشاوره و Google Cloud در حال همکاری هستند تا 1000 مهندس را برای همکاری با مشتریان اصلی در زمینه استقرار عوامل هوش مصنوعی بفرستند، در شراکتی که آنها را Accenture Gemini Enterprise Business Group می نامند. این متخصصان و مهندسان ماهر Accenture در Google Cloud را با مشاوران Accenture با تخصص صنعت گرد هم می آورد. بخش مهمی از پیشنهاد این گروه، وعده 1000 مهندس مستقر در آینده، متخصصان Accenture است که در پلتفرم هوش مصنوعی Gemini متخصص هستند. آنها با مشتریان خود جاسازی خواهند کرد تا به آنها کمک کنند هوش مصنوعی را در سراسر مشاغل خود گسترش دهند. مهندسان مستقر در آینده در داخل شرکت ها کار می کنند تا هوش مصنوعی را در جریان کار ادغام کنند و ابزارهای هوش مصنوعی را برای هر مشتری خاص سفارشی کنند تا کار آنها آسان تر یا کارآمدتر شود. این نقش توسط Palantir محبوب شد و اکنون یکی از پر جنب و جوش ترین مشاغل در فناوری است - پست ها برای این موقعیت در سال گذشته بیش از 700٪ رشد کرده است. جولی سوئیت، مدیرعامل Accenture در یک بیانیه مطبوعاتی گفت که تخصص فنی و صنعتی ترکیبی این گروه به مشتریان کمک می کند تا عوامل هوش مصنوعی را مستقر کنند و ارزش آنها را سریعتر درک کنند. جولی سویت، مدیر عامل و رئیس Accenture. رونی هارتمن / خبرگزاری فرانسه از"}, {"source": "Business Insider", "title": "This VC used AI to try to snag a restaurant reservation. Resy wasn't having it", "link": "https://www.businessinsider.com/resy-suspends-vcs-account-ai-agent-reservation-attempt-2026-9", "summary": "Resy shut down a VC s account temporarily after he used an AI agent while trying to get a competitive restaurant reservation. Spencer Platt/Getty Images A VC got his Resy account shuttered after using an AI agent for a reservation at one of NYC's hottest restaurants. It's an example of how AI agents often take questionable approaches to the tasks they're given. \"I will probably, in the short term, ask it to lay out a plan and tell me what the plan is,\" he said AI agents can do lots of tasks. Landing you a table at one of New York's trendiest restaurants might not be one. JC Bahr-de Stefano, principal at Better Tomorrow Ventures, a fintech-focused VC firm , learned that after he connected an AI tool called Instinct to his Resy account in hopes of getting a reservation at 4 Charles Prime Rib, the West Village steakhouse where diners gobble up reservations within seconds of them appearing online. Instinct, which is an invite-only service at the moment, communicates with users via text. The bet was that Instinct could check for open tables at 4 Charles much more frequently than Bahr-de Stefano — or any other human — could manually. Instead of getting him a ticket to some prime rib or an egg-topped burger, though, Bahr-de Stefano's AI agent spammed Resy's website so much that the platform temporarily shut down his account. The VC's experience is another example of how AI agents are bending or breaking the rules of the internet , from impersonating Wikipedia editors to trying to convince a GitHub user to upload malware into a project. Agents might appear to understand their objective, though exactly how they carry it out — and whether the strategy they pick might have unintended consequences — is often an afterthought. \"Resy does not currently permit unapproved third-party bots or agents to independently access or interact with the Resy platform,\" an American Express spokesperson told Business Insider. \"Unapproved automated activity can introduce risks to the platform and compromise a fair reservation experience for diners.\" Users can find restaurants and make reservations through Resy's integrations with OpenAI's ChatGPT and Anthropic's Claude, the spokesperson said. The company declined to comment specifically on Bahr-de Stefano's case. 'It was acting like a bot' Bahr-de Stefano noticed the Resy issue on Sunday when he couldn't get into his account. In his email inbox, there was a message from the American Express-owned reservation platform saying that his acc", "date_str": "2026-09-09T16:44:17+00:00", "hash": "82b8a8bbab0433e3", "title_fa": "این VC از هوش مصنوعی برای جلوگیری از رزرو رستوران استفاده کرد. Resy آن را نداشت", "summary_fa": "Resy پس از استفاده از یک عامل هوش مصنوعی در حالی که سعی می کرد یک رستوران رقابتی رزرو کند، حساب VC را به طور موقت تعطیل کرد. Spencer Platt/Getty Images یک VC پس از استفاده از یک عامل هوش مصنوعی برای رزرو در یکی از داغ‌ترین رستوران‌های نیویورک، حساب Resy خود را بسته است. این مثالی است از اینکه چگونه عوامل هوش مصنوعی اغلب رویکردهای مشکوک به وظایفی را که به آنها محول می شود، اتخاذ می کنند. او گفت: «من احتمالاً در کوتاه مدت از آن می‌خواهم که طرحی را تنظیم کند و به من بگوید که این طرح چیست. اگر میز یکی از شیک ترین رستوران های نیویورک را برای شما می گذارند، ممکن است چنین نباشد. JC Bahr-de Stefano، مدیر Better Tomorrow Ventures، یک شرکت VC متمرکز بر فین‌تک، متوجه شد که پس از اینکه ابزار هوش مصنوعی به نام Instinct را به حساب Resy خود متصل کرد، به این امید که بتواند در 4 Charles Prime Rib، استیک‌خانه West Village که در آن غذاخوری‌ها در چند ثانیه از ظاهر شدن آنلاین آنها رزرو می‌کنند، رزرو کنند. Instinct که در حال حاضر یک سرویس فقط دعوت است، از طریق متن با کاربران ارتباط برقرار می کند. شرط این بود که Instinct بتواند میزهای باز در 4 چارلز را بسیار بیشتر از بهر د استفانو - یا هر انسان دیگری - به صورت دستی بررسی کند. با این حال، عامل هوش مصنوعی Bahr-de Stefano به جای اینکه برای او یک بلیت برای برخی از دنده های اصلی یا یک همبرگر با تخم مرغ تهیه کند، وب سایت Resy را آنقدر اسپم کرد که این پلتفرم موقتاً حساب او را بسته است. تجربه VC مثال دیگری است از اینکه چگونه عوامل هوش مصنوعی قوانین اینترنت را زیر پا می گذارند، از جعل هویت ویراستاران ویکی پدیا تا تلاش"}, {"source": "Business Insider", "title": "BofA flags 3 ways agentic AI tools are reshaping the investing landscape", "link": "https://www.businessinsider.com/bofa-agentic-ai-investing-brokerages-hedge-funds-hood-bull-ibkr-2026-9", "summary": "Michael M. Santiago/Getty Images Agentic AI tools for trading have become available to retail and institutional traders alike. AI offerings are boosting digital trading platforms like Robinhood, while older incumbents lag. Here's how BofA sees agentic tools reshaping the investing landscape. Bank of America analysts recently addressed the question of how the rise of agentic AI has impacted how people and firms trade. Not, \"what are they trading,\" but literally, \"how.\" The bank's Craig Siegenthale wrote in a recent note that the fast-moving technology is already vastly reshaping the landscape for retail brokerages, institutions, and wealth managers, with the tools providing a clear advantage for digital-first platforms over the industry's old guard. \"Agentic trading is one of many emerging technology-enabled capabilities that will fuel the existing bifurcation within US brokerage, aiding the neobrokers,\" Siegenthale wrote. Independent day traders have reported that turning to AI has given them an advantage as they navigate the market. But in recent months, data has shown that AI models such as Claude and ChatGPT have proven highly proficient at trading stocks on their own with little human input. Here's what the bank is watching. A clear divergence between brokerages Siegenthale said that he and his team believe so-called neobrokers will surge to the head of the pack as they deploy agentic tools and solutions for traders on their platforms. BofA named Robinhood , eToro , Webull and Interactive Brokers , as AI-enabled winners in this new phase of the race between retail brokerages. \"Agentic trading adoption will alter their monetization effort - increasing trading velocity and margin loan utilization but also reduce cash sweep balances,\" Siegenthale said. While these firms may benefit from AI, BofA sees others large incumbents in the space lagging. Siegenthale said that Charles Schwab , for instance, is at risk of disruption from more AI-native brokerages, and said the firm should be more proactive about implementing agentic AI tools to diversify its business model. Accelerating institutional adoption Big hedge funds and investment firms haven't wasted time implementing AI for trading. Quant funds have been incorporating it into their trading strategies already, but according to BofA, the technology is quickly spreading among major firms. \"More than ½ of all mid to large hedge funds have deployed at least one generative AI system with a near 100% adoption ra", "date_str": "2026-09-09T16:42:38+00:00", "hash": "56b3ab23dbf7d575", "title_fa": "BofA 3 روشی را معرفی می کند که ابزارهای هوش مصنوعی عاملی در حال تغییر شکل چشم انداز سرمایه گذاری هستند", "summary_fa": "Michael M. Santiago/Getty Images ابزارهای هوش مصنوعی عاملی برای تجارت در دسترس معامله گران خرده فروشی و نهادی قرار گرفته است. ارائه‌های هوش مصنوعی پلتفرم‌های تجارت دیجیتالی مانند Robinhood را تقویت می‌کنند، در حالی که مدیران قدیمی‌تر عقب مانده‌اند. در اینجا آمده است که BofA چگونه ابزارهای عامل را در شکل دهی مجدد چشم انداز سرمایه گذاری می بیند. تحلیلگران بانک آمریکا اخیراً به این سؤال پرداختند که چگونه ظهور هوش مصنوعی عاملی بر نحوه تجارت مردم و شرکت ها تأثیر گذاشته است. نه، \"آنها با چه چیزی معامله می کنند\"، بلکه به معنای واقعی کلمه، \"چگونه\". کریگ سیگنتال از بانک در یادداشت اخیر خود نوشت که فناوری در حال حرکت به سرعت در حال تغییر چشم‌انداز برای کارگزاری‌های خرده‌فروشی، مؤسسات و مدیران ثروت است و ابزارها مزیت آشکاری را برای پلت‌فرم‌های دیجیتال اول نسبت به گارد قدیمی صنعت فراهم می‌کنند. Siegenthale نوشت: «تجارت عاملی یکی از بسیاری از قابلیت‌های نوظهور مبتنی بر فناوری است که به دوشاخه موجود در کارگزاری ایالات متحده دامن می‌زند و به کارگزاران جدید کمک می‌کند. معامله گران روزانه مستقل گزارش کرده اند که روی آوردن به هوش مصنوعی به آنها مزیتی را در هنگام حرکت در بازار داده است. اما در ماه‌های اخیر، داده‌ها نشان داده‌اند که مدل‌های هوش مصنوعی مانند Claude و ChatGPT در تجارت سهام به‌تنهایی با نیروی انسانی کم مهارت بالایی داشته‌اند. این چیزی است که بانک در حال تماشای آن است. اختلاف آشکار بین کارگزاری‌ها Siegenthale می‌گوید که او و تیمش معتقدند که به‌اصطلاح نئوبرکرها با استقرار ابزارها و راه‌حل‌های عاملی برای معامله‌گران بر روی پلتفرم‌های خود، در راس گروه قرار خواهند گرفت. BofA Robinhood، eToro، Webull و Interactive Brokers را به عنوان برندگان مبتنی بر هوش مصنوعی در این مرحله جدید از رقابت بین کارگزاری‌های خرده‌فروشی معرفی کرد. Siegenthale گفت: \"پذیرش معاملات عاملی تلاش آنها برای کسب درآمد را"}, {"source": "Business Insider", "title": "I'm helping my mother-in-law with 'Swedish death cleaning.' I wish more families did this while they have the chance.", "link": "https://www.businessinsider.com/swedish-death-cleaning-with-older-family-member-helpful-tips-advice-2026-9", "summary": "Swedish death cleaning with my mother-in-law has been surprisingly joyful and productive. Mar Yvette My mother-in-law and I have spent years \"Swedish death cleaning\" together. Being the daughter-in-law put me in a unique position to help her declutter. Going through her belongings has made me see her in a new light. Every year, my husband and I make the trek from California to Michigan to live with his 85-year-old mom, Elizabeth, for a few months. These have been lovely family visits that give us a chance to spend time together, and they've also allowed me to help her with Swedish death cleaning . This decluttering method focuses on getting things in order before you die, largely so that loved ones won't be left with a lot of stuff to sort through and make decisions about. I've always been a natural declutterer. My family knows that if I visit, there's a good chance a junk drawer, closet, or cabinet is getting organized. Helping my mother-in-law gradually decide what to keep, donate, sell, or pass along naturally grew out of that habit. Now that she's in her mid-80s, the process has become even more intentional, and I've realized that being the daughter-in-law has put me in a unique position to help. Not only do I get to tidy up spaces she might not otherwise be able to, but she also feels a little lighter after every visit. Thankfully, she's not sick, and her spiritual beliefs have made this an incredibly meaningful and surprisingly fun process for both of us. Being the daughter-in-law has turned out to be an advantage Going through items, especially photos, somehow always ends in laughter. Mar Yvette I love MIL Elizabeth dearly, and she has always referred to me as her \"third child,\" but I'm not carrying the same emotional weight into the death-cleaning process as her children would. Unlike my husband and sister-in-law, I've already experienced the death of close family members . My father passed away eight years ago, and in the last year, both my grandparents died. I know what it's like to sort through decades of belongings while grieving and how overwhelming it can be when every object feels tied to someone you love. I feel grateful to take some of that off their plate. When the day comes, I want my husband and sis-in-law to spend as little time as possible wondering whether to keep something simply because it meant something to their mom. But this isn't just about making things easier for us someday. My husband appreciates how this death cleaning is h", "date_str": "2026-09-09T16:30:01+00:00", "hash": "7277e0408b6762ab", "title_fa": "من دارم به مادرشوهرم در \"تمیز کردن مرگ سوئدی\" کمک می کنم. ای کاش خانواده های بیشتری تا زمانی که فرصت دارند این کار را انجام می دادند.", "summary_fa": "نظافت مرگ سوئدی با مادرشوهرم به طرز شگفت انگیزی شادی بخش و سازنده بوده است. Mar Yvette من و مادرشوهرم سال‌ها را با هم «تمیز کردن مرگ سوئدی» گذراندیم. عروس بودن من را در موقعیتی منحصربفرد قرار داد تا به او کمک کنم تا او را تمیز کند. گذر از وسایلش باعث شده او را در نور جدیدی ببینم. هر سال، من و شوهرم از کالیفرنیا به میشیگان سفر می کنیم تا چند ماه با مادر 85 ساله اش، الیزابت، زندگی کنیم. این ملاقات‌های خانوادگی دوست‌داشتنی بوده است که به ما فرصتی می‌دهد تا زمانی را با هم بگذرانیم، و همچنین به من اجازه داده‌اند در نظافت مرگ سوئدی به او کمک کنم. این روش بی نظمی بر نظم بخشیدن به همه چیز قبل از مرگ تمرکز می کند، تا حد زیادی به این دلیل که عزیزان با چیزهای زیادی برای مرتب کردن و تصمیم گیری باقی نمانند. من همیشه یک پاک کننده طبیعی بوده ام. خانواده من می‌دانند که اگر من به آنجا سر بزنم، به احتمال زیاد یک کشوی آشغال، کمد یا کابینت مرتب می‌شود. کمک به مادرشوهرم به تدریج که تصمیم بگیرد چه چیزی را نگه دارد، اهدا کند، بفروشد یا بفرستد، طبیعتاً از آن عادت خارج شد. اکنون که او در اواسط دهه 80 خود است، این روند حتی عمدی‌تر شده است، و من متوجه شده‌ام که عروس بودن من را در موقعیتی منحصر به فرد برای کمک قرار داده است. نه تنها می‌توانم فضاهایی را مرتب کنم که او در غیر این صورت نمی‌توانست، بلکه بعد از هر بازدید کمی سبک‌تر احساس می‌کند. خوشبختانه، او بیمار نیست، و باورهای معنوی او این فرآیند فوق‌العاده معنی‌دار و شگفت‌انگیز را برای هر دوی ما تبدیل کرده است. عروس بودن به یک مزیت تبدیل شده است. مرور اقلام، به خصوص عکس ها، همیشه به خنده ختم می شود."}, {"source": "Business Insider", "title": "Sonos Arc Ultra review: A powerful all-in-one Dolby Atmos soundbar", "link": "https://www.businessinsider.com/guides/tech/sonos-arc-ultra-soundbar-review", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The Sonos Arc Ultra is still the company s most impressive soundbar. Tyler Hayes/Business Insider The Sonos Arc Ultra is a stand-alone Dolby Atmos soundbar that delivers on its promise to be an immersive, all-in-one home theater system. It simulates a room full of speakers with punchy bass and convincing overheard audio effects, all from a single soundbar unit you place right by your TV. The Arc Ultra was released in late 2024, and it remains the brand's flagship soundbar. It's a solid upgrade over its predecessor, the original Sonos Arc from 2020, with improved clarity and deeper low-frequency performance. To do this, it incorporates Sonos' new Sound Motion technology, which delivers beefier bass while maintaining a compact form factor. My experience with Sonos soundbars dates back to the brand's first model, the Playbar, released in 2013. Along the way, Sonos has dramatically improved its lineup, but the Arc Ultra is far and away the brand's most impressive offering to date. I've also spent lots of time with the best soundbars from other companies, and Sonos' latest flagship holds its own extremely well. Though pricey at $1,099, the Sonos Arc Ultra is a near-perfect solution for movie lovers with limited space. It's easily one of the best Dolby Atmos soundbars you can buy. Sonos' Sound Motion driver delivers impressive performance The Arc Ultra uses a new driver array that enables deeper bass and cleaner dialogue. Tyler Hayes/Business Insider Sonos' Sound Motion woofer is the heartbeat of the Arc Ultra , and it's what helps give this model a clear edge over the original Arc soundbar released in 2020. This internal component is uniquely designed to fit a large four-motor woofer into a compact space on the right side of the device, delivering more bass without requiring a larger soundbar. This approach has also given Sonos more freedom to rework the soundbar's surrounding array of speaker drivers. Since so much bass is now handled by the Sound Motion woofer, the brand can implement additional tweeters and fewer midrange woofers elsewhere, allowing it to fit in more drivers overall. There are 14 drivers tucked inside the Arc Ultra, compared to the original Arc's 11. While this reworked design accomplishes its goal of deeper bass, it also enables something even more critical: improved clarity, a wider soundstage, and greater presence. If you're coming from the previ", "date_str": "2026-09-09T16:15:06+00:00", "hash": "68fe33f9fa3f8bff", "title_fa": "بررسی Sonos Arc Ultra: نوار صوتی قدرتمند همه در یک Dolby Atmos", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Sonos Arc Ultra همچنان چشمگیرترین نوار صوتی شرکت است. Tyler Hayes/Business Insider Sonos Arc Ultra یک نوار صوتی Dolby Atmos مستقل است که به وعده خود مبنی بر یک سیستم سینمای خانگی همه جانبه و همه کاره عمل می کند. اتاقی پر از بلندگوها را با باس قوی و جلوه‌های صوتی قانع‌کننده شبیه‌سازی می‌کند، همه از یک واحد نوار صوتی که درست در کنار تلویزیون خود قرار می‌دهید. Arc Ultra در اواخر سال 2024 عرضه شد و همچنان پرچمدار ساندبار این برند است. این یک ارتقاء قوی نسبت به نسل قبلی خود، Sonos Arc اصلی از سال 2020، با وضوح بهبود یافته و عملکرد عمیق تر در فرکانس پایین است. برای انجام این کار، از فناوری جدید Sound Motion Sonos استفاده می‌کند که باس قوی‌تری ارائه می‌دهد و در عین حال فرم فشرده‌تری را حفظ می‌کند. تجربه من با نوارهای صوتی Sonos به اولین مدل این برند، Playbar که در سال 2013 عرضه شد، برمی گردد. در طول مسیر، Sonos به طور چشمگیری خط تولید خود را بهبود بخشیده است، اما Arc Ultra بسیار چشمگیرترین پیشنهاد این برند تا به امروز است. من همچنین زمان زیادی را با بهترین ساندبارهای شرکت‌های دیگر سپری کرده‌ام، و آخرین پرچمدار Sonos به خوبی خود را حفظ کرده است. اگرچه Sonos Arc Ultra 1099 دلار قیمت دارد، اما Sonos Arc Ultra یک راه حل تقریباً عالی برای دوستداران فیلم با فضای محدود است. این به راحتی یکی از بهترین نوارهای صوتی Dolby Atmos است که می توانید بخرید. درایور Sound Motion Sonos عملکرد چشمگیری ارائه می دهد Arc Ultra از یک آرایه درایور جدید استفاده می کند که بیس عمیق تر و گفتگوی تمیزتر را امکان پذیر می کند. ووفر Sound Motion تایلر هیز/Business Insider"}, {"source": "Business Insider", "title": "Alex Gibney's Elon Musk documentary goes for the jugular in these 3 scenes", "link": "https://www.businessinsider.com/musk-documentary-alex-gibney-review-elon-should-be-worried-2026-9", "summary": "Elon Musk is the subject of the Alex Gibney documentary, Musk. Jae C. Hong/AP Alex Gibney's Elon Musk documentary, \"Musk,\" examines the mogul's life and career. There's plenty of material on Musk's highs (Tesla, SpaceX) and lows (DOGE, his relationships). Here are the 3 most explosive parts of the doc. In an era when documentaries about famous people can be as light and sweet as the snacks you eat while watching them, Alex Gibney is going against the grain. His new documentary, \"Musk,\" which premiered at Venice Film Festival on Sept. 8, proves there's still room for hard-hitting investigative docs in Hollywood — as long as you're willing to sit through its nearly four-hour runtime. From tackling Scientology in \"Going Clear\" to Theranos' Elizabeth Holmes in \"The Inventor,\" Gibney has never backed away from a thorny topic. With \"Musk,\" the Oscar-winning filmmaker pulls no punches, painting a thorough portrait of the man who turned companies like Tesla and SpaceX into household names. The doc, which traces Musk's life from 20-something Silicon Valley start-up entrepreneur to becoming President Donald Trump's right-hand man during his second term, has ignited the ire of its subject since it was announced in 2023. At the time, Musk called the film a \"hit piece\" on X, to which Gibney responded, \"How would you know?\" The two have been locked in an online battle ever since. Although Musk did not sit down for an interview for \"Musk,\" that didn't stop Gibney from getting his subject on camera — sort of. Alex Gibney at the world premiere of Musk at the Venice Film Festival. Tiziana FABI / AFP via Getty Images Thanks to the ingenuity of Gibney's team and the magic of AI, the documentary features a Musk avatar who's been trained on all available interviews the mogul has given. Avatar-Musk shows up throughout to comment on everything from why he believes we're all living in a simulation to his obsession with going to Mars. It's a cheeky deployment of emerging technology at the CEO's expense. But it's not the only segment that paints Musk in an unflattering light. Business Insider screened \"Musk\" the day it premiered at the Venice Film Festival. Here are three times Gibney goes after Musk hard. Business Insider reached out to Musk for comment on the documentary, but did not receive a response. The failures of Tesla's self-driving feature Autopilot are back in the spotlight Tesla CEO Elon Musk at the opening of Giga Berlin in 2022. PATRICK PLEUL/POOL/AFP via Getty Images ", "date_str": "2026-09-09T16:14:13+00:00", "hash": "c22d966ee3ced414", "title_fa": "مستند الون ماسک ساخته الکس گیبنی در این 3 صحنه برای جوگولار قرار می گیرد", "summary_fa": "ایلان ماسک موضوع مستند الکس گیبنی، ماسک است. Jae C. Hong/AP مستند الون ماسک الکس گیبنی به نام «ماسک» به بررسی زندگی و حرفه این غول می پردازد. مطالب زیادی در مورد اوج ماسک (تسلا، اسپیس ایکس) و پایین بودن (DOGE، روابط او) وجود دارد. در اینجا 3 بخش انفجاری این سند آورده شده است. در دوره‌ای که مستندهای مربوط به افراد مشهور می‌توانند به اندازه تنقلاتی که هنگام تماشای آن‌ها می‌خورید سبک و شیرین باشند، الکس گیبنی مخالف غلات است. مستند جدید او، «ماسک» که در جشنواره فیلم ونیز در 8 سپتامبر به نمایش درآمد، ثابت می‌کند که هنوز جایی برای اسناد تحقیقاتی سخت در هالیوود وجود دارد - تا زمانی که بخواهید در مدت زمان تقریباً چهار ساعته آن بنشینید. گیبنی از پرداختن به ساینتولوژی در «روشن شدن» گرفته تا الیزابت هولمز ترانوس در «مخترع» هرگز از یک موضوع خاردار عقب نشینی نکرده است. با «ماسک»، فیلمساز برنده اسکار هیچ ضربه ای نمی زند و پرتره کاملی از مردی ترسیم می کند که شرکت هایی مانند تسلا و اسپیس ایکس را به نام های معروف تبدیل کرده است. این مستند که زندگی ماسک را از 20 کارآفرین نوپا در دره سیلیکون تا تبدیل شدن به دست راست رئیس جمهور دونالد ترامپ در دوره دوم ریاست جمهوری اش نشان می دهد، از زمانی که در سال 2023 اعلام شد، خشم موضوع خود را برانگیخت. در آن زمان، ماسک این فیلم را یک «قطعه پرطرفدار» در X نامید، که گیبنی در پاسخ گفت: «از کجا می‌دانی؟» این دو از آن زمان در یک نبرد آنلاین قفل شده اند. اگرچه ماسک برای «ماسک» مصاحبه ای ننشست، اما این مانع از این نشد که گیبنی سوژه اش را جلوی دوربین بردارد. الکس گیبنی در اولین نمایش جهانی ماسک در جشنواره فیلم ونیز. Tiziana FABI / AFP از طریق Getty Images به لطف"}, {"source": "Business Insider", "title": "Ukrainian troops can’t easily leave the front for medical care. They want more of it brought to them.", "link": "https://www.businessinsider.com/ukrainian-troops-cant-leave-front-want-medical-care-brought-forward-2026-9", "summary": "Ukrainian troops, hunted by drones from above, are spending more time in combat areas. ZUMA Press Wire via Reuters Connect Ukrainian soldiers are spending longer periods in combat areas. The heavy drone saturation has made it difficult to leave the front lines for medical care. One unit said that soldiers must have treatment options brought forward in response. The threat of Russian drones is keeping Ukrainian troops stuck near the front for longer stretches and forcing the military to think more about how it delivers medical care to soldiers who can't easily leave. For one Ukrainian military unit that specializes in front-line casualty evacuation , the lesson is that battlefield medicine now has to do more than stabilize the wounded and get them out. Soldiers in combat areas for extended periods need access to outpatient care, diagnostics, specialist consultations, and treatment for both chronic and acute illnesses without being forced to leave the battlefield every time they need medical assistance, Ukraine's 1st Separate Medical Battalion told Business Insider. A battalion spokesperson, who spoke on the condition of anonymity for security reasons, said in translated remarks that modern combat medicine is developing in two main directions: using machines to replace troops and evacuate casualties wherever possible and pushing high-quality medical care closer to troops at the front. The front lines have evolved into what Ukrainian officials and soldiers describe as a \"kill zone.\" Drones are constantly watching and able to target anything that moves , including soldiers and armored vehicles, with precision. The aerial threat has made it difficult and time-consuming to move even short distances. The kill zone varies in size, extending for miles on both sides of the line of contact, and Ukrainian officials and soldiers say it is expanding as more drones flood the battlefield. The battalion spokesperson said the growing number of drones is forcing the unit to change its approach to casualty evacuation, stabilization sites, and forward surgical teams. The unit must become more mobile and less visible, moving between locations faster, the spokesperson said. Ukrainian soldiers are increasingly using ground robots for casualty evacuations. Frédéric Pétry/Hans Lucas via Reuters Connect Ground robots , meanwhile, are increasingly being used for casualty evacuation, reflecting a growing trend across the Ukrainian military in which machines are replacing soldiers for ", "date_str": "2026-09-09T15:59:30+00:00", "hash": "15e2a6cddd7f1215", "title_fa": "نیروهای اوکراینی نمی توانند به راحتی جبهه را برای مراقبت های پزشکی ترک کنند. آنها می خواهند که بیشتر از آن برای آنها آورده شود.", "summary_fa": "نیروهای اوکراینی که از بالا توسط هواپیماهای بدون سرنشین شکار می شوند، زمان بیشتری را در مناطق جنگی می گذرانند. ZUMA Press Wire از طریق رویترز کانکت سربازان اوکراینی دوره های طولانی تری را در مناطق جنگی سپری می کنند. اشباع سنگین هواپیماهای بدون سرنشین خروج از خطوط مقدم برای مراقبت های پزشکی را دشوار کرده است. یکی از واحدها گفت که سربازان باید گزینه های درمانی را در پاسخ ارائه کنند. تهدید پهپادهای روسی باعث می‌شود نیروهای اوکراینی برای مدت طولانی‌تری در نزدیکی جبهه گیر بیفتند و ارتش را وادار می‌کند تا بیشتر درباره نحوه ارائه مراقبت‌های پزشکی به سربازانی که نمی‌توانند به راحتی آنجا را ترک کنند، فکر کند. برای یک واحد نظامی اوکراینی که در تخلیه مجروحان خط مقدم تخصص دارد، درس این است که پزشکی میدان نبرد اکنون باید بیش از تثبیت مجروحان و بیرون آوردن آنها انجام دهد. اولین گردان پزشکی جداگانه اوکراین به Business Insider گفت که سربازان در مناطق جنگی برای دوره‌های طولانی نیاز به دسترسی به مراقبت‌های سرپایی، تشخیص، مشاوره‌های تخصصی و درمان بیماری‌های مزمن و حاد دارند، بدون اینکه مجبور شوند هر بار که نیاز به کمک پزشکی دارند، میدان نبرد را ترک کنند. یکی از سخنگویان گردان که به دلایل امنیتی نخواست نامش فاش شود، در اظهارات ترجمه شده خود گفت که پزشکی رزمی مدرن در دو جهت اصلی در حال توسعه است: استفاده از ماشین آلات برای جایگزینی نیروها و تخلیه مجروحین در هر کجا که ممکن است و نزدیک کردن مراقبت های پزشکی با کیفیت بالا به سربازان در جبهه. خطوط مقدم به چیزی تبدیل شده است که مقامات و سربازان اوکراینی آن را \"منطقه کشتار\" توصیف می کنند. پهپادها دائماً در حال مشاهده هستند و می توانند هر چیزی را که حرکت می کند، از جمله سربازان و خودروهای زرهی را با دقت هدف قرار دهند. تهدید"}, {"source": "Business Insider", "title": "It took OpenAI's agents 130 billion tokens to crack a 90-year-old math problem", "link": "https://www.businessinsider.com/openai-math-problem-solved-tokens-cost-altman-2026-9", "summary": "OpenAI sent millions of messages to solve a $1 million math problem. They say they won t ask for the prize. Sean Rayford/Getty Images On Tuesday, OpenAI said it had solved the Navier-Stokes equations, a 90-year-old math problem. OpenAI said its agents used 130 billion output tokens and sent 2.7 million messages in the process. The company won't accept the cash prize, it says. \"AI is such a bubble,\" its CEO joked. Math is hard. And, apparently, expensive. On Tuesday, OpenAI said its agents had solved the Navier-Stokes equations , a 90-year-old set of mathematical formulas that can predict how liquids and gases move. It's so complicated that the Clay Mathematics Institute has offered a $1 million prize to any mathematician who finds the solution. OpenAI said that finding the solution required a lot of resources. Its coordinating AI agents sent 2.7 million messages while working on the proof. The effort involved about 10,000 concurrent agents and reached a resolution after 88 hours. Verification took another 17 hours. Such intensive use of AI doesn't come cheap. In a post on X, LisanBench, an LLM benchmark evaluator, estimated that the output tokens alone would cost about $6.5 million at OpenAI's average consumer price. Including the far larger volume of input tokens, the post estimated the total could reach $10 million to $40 million. OpenAI CEO Sam Altman replied, joking that AI was a bubble. ugh AI is such a bubble, i heard they are selling tokens at a loss, did they know this was only worth $1 million? — Sam Altman (@sama) September 8, 2026 OpenAI's announcement that it solved the age-old mathematics problem was celebrated within the AI industry. It's also been widely criticized after two mathematicians — Tristan Buckmaster and Levent Alpöge — raised questions about how OpenAI used their related research data to train its models. OpenAI denied direct access to their work, but said that it \"cannot rule out that de-identified data derived from their usage of our products helped improve our models.\" The company didn't immediately respond to a request for comment from Business Insider. Read the original article on Business Insider", "date_str": "2026-09-09T15:55:21+00:00", "hash": "05cf14585bd03fbb", "title_fa": "برای حل یک مشکل ریاضی 90 ساله 130 میلیارد توکن از عوامل OpenAI صرف شد.", "summary_fa": "OpenAI میلیون ها پیام برای حل یک مسئله ریاضی یک میلیون دلاری ارسال کرد. آنها می گویند که درخواست جایزه نخواهند کرد. شان ریفورد/ گتی ایماژ روز سه شنبه، OpenAI گفت که معادلات ناویر-استوکس، یک مسئله ریاضی 90 ساله را حل کرده است. OpenAI گفت که نمایندگان آن از 130 میلیارد توکن خروجی استفاده کرده و 2.7 میلیون پیام را در این فرآیند ارسال کردند. این شرکت می گوید که این جایزه نقدی را نمی پذیرد. مدیر عامل آن به شوخی گفت: \"هوش مصنوعی چنین حبابی است.\" ریاضی سخته و ظاهراً گران است. روز سه‌شنبه، OpenAI گفت که عواملش معادلات ناویر-استوکس را حل کرده‌اند، مجموعه‌ای از فرمول‌های ریاضی ۹۰ ساله که می‌تواند نحوه حرکت مایعات و گازها را پیش‌بینی کند. این به قدری پیچیده است که مؤسسه ریاضیات Clay برای هر ریاضیدانی که راه حل را پیدا کند یک میلیون دلار جایزه تعیین کرده است. OpenAI گفت که یافتن راه حل نیاز به منابع زیادی دارد. عوامل هماهنگ کننده هوش مصنوعی در حین کار بر روی اثبات، 2.7 میلیون پیام ارسال کردند. این تلاش شامل حدود 10000 عامل همزمان بود و پس از 88 ساعت به نتیجه رسید. تأیید 17 ساعت دیگر طول کشید. چنین استفاده فشرده ای از هوش مصنوعی ارزان نیست. در پستی در X، LisanBench، یک ارزیاب معیار LLM، تخمین زد که توکن های خروجی به تنهایی حدود 6.5 میلیون دلار با میانگین قیمت مصرف کننده OpenAI هزینه خواهند داشت. با احتساب حجم به مراتب بیشتر توکن های ورودی، پست تخمین زد که مجموع آن می تواند به 10 تا 40 میلیون دلار برسد. سام آلتمن، مدیر عامل OpenAI، به شوخی گفت که هوش مصنوعی یک حباب است. ugh AI چنین حبابی است، من شنیدم که آنها توکن ها را با ضرر می فروشند، آیا آنها می دانستند که این فقط یک میلیون دلار ارزش دارد؟ —"}, {"source": "Business Insider", "title": "Bitcoin just flashed a bullish golden cross signal. Here's what that means.", "link": "https://www.businessinsider.com/bitcoin-price-today-golden-cross-bullish-signal-outlook-btc-crypto-2026-9", "summary": "illustration by Dan Kitwood/Getty Images Bitcoin has flashed a bullish \"golden cross\" signal. The technical signal has historically preceded fresh upside in an asset's price. Market pros are now waiting for the crypto to break through $80k and $90k to confirm further upside. The golden cross — a rare buy signal bitcoin bulls have been waiting for — has flashed this week. The world's largest cryptocurrency flashed a golden cross on Tuesday. It's a bullish pattern watched by technical analysts that occurs when an asset's 50-day moving average crosses above its 200-day moving average. It's the first golden cross bitcoin has flashed in over a year, with the last signal appearing in May 2025, according to an analysis of Bespoke Investment. The golden cross has historically preceded further upside in an asset's price, which is exactly what investors struggling through bitcoin's brutal nine-month bear market have been waiting for. The crypto shed more than half of its value from its October 2025 peak through its low of around $59,100 this summer. \"Such a signal is typically followed by accelerated growth,\" Kuptsikevich wrote Alex Kuptsikevich, the chief market analyst at FxPro, wrote of the golden cross in a note on Wednesday. Paul Meeks, the head of technology research at Freedom Capital Markets, said he believed the rally that triggered bitcoin's golden cross was being driven by four main factors: The coin has been oversold. Bitcoin was likely undervalued in the depths of its latest winter, meaning the rally is being partly driven by a natural \"bounce back,\" Meeks told Business Insider in a call. Bitcoin traded around $79,300 on Wednesday, up 34% since the start of July. The token is still down 58% from its all-time high of around $126,000. Regulatory optimism. Bitcoin got a big boost after President Donald Trump called on US lawmakers to pass the CLARITY Act at the White House's crypto summit last month. The landmark bill would establish a regulatory framework for digital assets, and Trump has long been viewed by investors as a crypto-friendly president. Michael Saylor's Strategy hasn't hurt the market with its bitcoin sales. Strategy, the bitcoin treasury that holds around 4% of the total bitcoin supply, sold some of its holdings this summer. Investors have long worried that Strategy's sales could impact the price of bitcoin, but its sales so far haven't really moved the needle, Meeks said, adding to the overall optimism. High leverage. Bitcoin's price is als", "date_str": "2026-09-09T15:37:11+00:00", "hash": "38e2fa49c51cc411", "title_fa": "بیت کوین به تازگی یک سیگنال متقاطع طلایی صعودی به نمایش گذاشت. در اینجا معنی آن چیست.", "summary_fa": "تصویر توسط Dan Kitwood/Getty Images بیت کوین سیگنال صعودی \"صلیب طلایی\" را به نمایش گذاشته است. سیگنال فنی از لحاظ تاریخی قبل از افزایش مجدد قیمت یک دارایی بوده است. فعالان بازار اکنون منتظرند تا ارز دیجیتال از 80 هزار دلار و 90 هزار دلار عبور کند تا روند صعودی بیشتر را تأیید کنند. صلیب طلایی - سیگنال خرید نادری که گاوهای بیت کوین منتظر آن بودند - این هفته چشمک زد. بزرگترین ارز دیجیتال جهان روز سه شنبه یک صلیب طلایی به نمایش گذاشت. این یک الگوی صعودی است که توسط تحلیلگران فنی مشاهده می شود و زمانی رخ می دهد که میانگین متحرک 50 روزه یک دارایی از میانگین متحرک 200 روزه آن عبور کند. بر اساس تجزیه و تحلیل Bespoke Investment، این اولین صلیب طلایی بیت کوین است که در بیش از یک سال گذشته چشمک می زند و آخرین سیگنال آن در می 2025 ظاهر شد. صلیب طلایی از لحاظ تاریخی در قیمت یک دارایی افزایش بیشتری داشته است، این دقیقا همان چیزی است که سرمایه گذارانی که در بازار خرس 9 ماهه بیت کوین دست و پنجه نرم می کنند، منتظر آن بوده اند. این کریپتو بیش از نیمی از ارزش خود را از اوج خود در اکتبر 2025 تا پایین ترین سطح خود در تابستان امسال در حدود 59100 دلار کاهش داد. الکس کوپتسیکویچ، تحلیلگر ارشد بازار در FxPro، روز چهارشنبه در یادداشتی درباره صلیب طلایی نوشت: «چنین سیگنالی معمولاً با رشد شتابان همراه است. پل میکس، رئیس تحقیقات فناوری در Freedom Capital Markets، گفت که او معتقد است که افزایشی که باعث صلیب طلایی بیت کوین شد توسط چهار عامل اصلی هدایت می شود: سکه بیش از حد فروخته شده است. میکس در تماسی به Business Insider گفت که بیت کوین احتمالاً در اعماق آخرین زمستان خود کمتر از ارزش گذاری شده بود،"}, {"source": "Business Insider", "title": "Supermarkets are suing NYC over Mamdani's city-run grocery stores' 'predatory pricing scheme'", "link": "https://www.businessinsider.com/nyc-federal-antitrust-lawsuit-mamdani-city-run-grocery-stores-2026-9", "summary": "NYC Mayor Zohran Mamdani s grocery store plan is facing a second lawsuit. Bloomberg/Getty Images Private grocers are suing NYC, saying Mamdani's city-run grocery stores violate US antitrust laws. The lawsuit joins a pending state case. Local businesses say they can't compete with NYC stores. Mamdani's supermarkets are set to offer a 30% discount on core goods compared to private retailers. New York City is facing a second lawsuit from private grocers over Mayor Zohran Mamdani's city-run supermarket initiative . The latest case, filed in federal court Wednesday morning, alleges that the administration's plan to roll out five government-funded stores will undercut local competitors in violation of US antitrust laws. The suit is led by the trade group National Supermarket Association, with backing from other retailers and private grocers. It follows a lawsuit filed last month at the state level, in which the Multicultural Business Coalition said the Mayor's Office is creating an unfair business environment for NYC vendors. NYC businesses say they can't compete with Mamdani's grocery stores Mamdani's grocery plan will establish a set of supermarkets across the five boroughs on city-owned property. Set to open by 2029, the administration said it will subsidize a 30% discount on core goods like meat, dairy, and produce at all locations. This financial support will be in addition to the rent and property tax forgiveness provided by the city's Economic Development Corporation . Mamdani has pledged $70 million to initially open the stores, $30 million of which will go toward building the East Harlem location from scratch. Local retailers have told Business Insider that they won't be able to compete with the lower prices offered at the city-run stores, which will be located in each borough near major train lines. Grocer profit margins are already low — around 1% to 3% — and the plaintiffs in both cases feel that the city-run stores will unfairly divert customers from neighborhood grocers. \"If I had an opportunity to sit with Mamdani, I would say do not do a supermarket that's going to be lower cost for people,\" Yesi Morillo, who runs a small business in upper Manhattan, told Business Insider last month. \"There are supermarkets here that have been here for decades that have been serving the community and where the community feels comfortable shopping.\" In the federal case filed Wednesday, the NSA and associated grocers are asking the court to do two things: Rule that", "date_str": "2026-09-09T15:29:53+00:00", "hash": "6d8b1a7dc5b1c5b0", "title_fa": "سوپرمارکت ها از نیویورک به دلیل «طرح قیمت گذاری غارتگرانه» خواربارفروشی های شهر ممدانی شکایت کرده اند.", "summary_fa": "طرح خواربارفروشی زهران ممدانی شهردار نیویورک با شکایت دوم روبرو است. بلومبرگ/ گتی ایماژ خواربارفروشان خصوصی از نیویورک شکایت کردند و گفتند که خواربارفروشی های شهر ممدانی قوانین ضد انحصار ایالات متحده را نقض می کنند. این دعوی به یک پرونده ایالتی در حال رسیدگی می پیوندد. کسب و کارهای محلی می گویند که نمی توانند با فروشگاه های نیویورک رقابت کنند. سوپرمارکت‌های ممدانی در مقایسه با خرده‌فروشان خصوصی، 30 درصد تخفیف برای کالاهای اصلی ارائه می‌کنند. شهر نیویورک با دومین شکایت از سوی خواربارفروشان خصوصی به دلیل ابتکار سوپرمارکت شهردار زهران ممدانی، شهردار، مواجه است. آخرین پرونده که صبح چهارشنبه در دادگاه فدرال ثبت شد، ادعا می‌کند که طرح دولت برای راه‌اندازی پنج فروشگاه با بودجه دولتی، رقبای محلی را با نقض قوانین ضد انحصار ایالات متحده تضعیف می‌کند. این کت و شلوار توسط گروه تجاری انجمن ملی سوپرمارکت، با حمایت سایر خرده فروشان و خواربارفروشان خصوصی رهبری می شود. این به دنبال شکایتی است که ماه گذشته در سطح ایالت ارائه شد، که در آن ائتلاف تجاری چندفرهنگی گفت که دفتر شهردار در حال ایجاد یک محیط تجاری ناعادلانه برای فروشندگان نیویورک است. کسب‌وکارهای نیویورک می‌گویند که نمی‌توانند با خواربارفروشی‌های ممدانی رقابت کنند. طرح خواربارفروشی ممدانی مجموعه‌ای از سوپرمارکت‌ها را در سراسر پنج محله در املاک شهری ایجاد می‌کند. دولت که قرار است تا سال 2029 افتتاح شود، گفت که 30 درصد تخفیف برای کالاهای اصلی مانند گوشت، لبنیات و محصولات در همه مکان‌ها یارانه خواهد داد. این حمایت مالی علاوه بر بخشودگی مالیات اجاره بها و دارایی توسط شرکت توسعه اقتصادی شهرستان خواهد بود. ممدانی 70 میلیون دلار برای افتتاح اولیه فروشگاه ها متعهد شده است که 30 میلیون دلار آن صرف ساخت مکان شرقی هارلم از صفر خواهد شد. خرده‌فروشان محلی به Business Insider گفته‌اند که نمی‌توانند با قیمت‌های پایین‌تر ارائه شده در فروشگاه‌های شهری، که"}, {"source": "Business Insider", "title": "Ann Arbor, Michigan, is one of the US' best college towns. See why students and locals love the Midwestern city.", "link": "https://www.businessinsider.com/life-inside-ann-arbor-michigan-best-college-towns", "summary": "Ann Arbor, Michigan, is consistently ranked among America s best college towns. Sean Pavone/Getty Images Ann Arbor ranked as the second-best college town in the US in a WalletHub study. The University of Michigan drives Ann Arbor's economy, employing 37,400 people in the area. Michigan football culture fosters a strong sense of community, attracting locals and visitors alike. What counts as a college town ? Depends on who you ask. For some, the presence of a large public university is a non-negotiable. For others, having a large enough non-student population is an immediate disqualifier. Some towns might not have as strong a connection to their central university as others, and some might have broader historical reasons for attracting residents. Definitions vary, but under nearly all of them, Ann Arbor, Michigan, is close to what it means to be a textbook case of a college town. A recent WalletHub study ranked Ann Arbor the second-best college town in the US , behind Austin. The Midwestern city has about 122,000 residents, while the University of Michigan enrolled 53,488 students at its Ann Arbor campus in fall 2025 — equivalent to roughly 44% of the city's population. The University of Michigan is an economic engine — and a large part of the city's identity Ann Arbor is Michigan s fifth-largest city, and much of its local economy revolves around the university. Nicholas Klein/Getty Images The University of Michigan is Washtenaw County's largest employer , with roughly 37,400 workers across the university and health system. In fiscal year 2025, it purchased more than $296 million in goods and services from county businesses , and university property now accounts for about 10% of Ann Arbor's land. The university also gives the relatively small city a research and startup ecosystem more akin to those of larger economic hubs . In 2025, the university reported spending $2.16 billion in research across its three campuses. In fiscal year 2026, the university launched a record 40 startups, while university-backed startups raised a record $796 million in venture capital. But while opportunities are plentiful for students and recent grads, Ann Arbor isn't uniformly cheap. Average rent surpassed $2,000 in late August, according to Zillow , while 2024 federal data showed housing rents in the metro area were about 25% higher than the national price level. College football and local culture unite the city's community Football is central to Ann Arbor s college culture. ", "date_str": "2026-09-09T15:24:14+00:00", "hash": "1df93129b4e5f440", "title_fa": "آن آربور، میشیگان، یکی از بهترین شهرهای کالج ایالات متحده است. ببینید چرا دانش آموزان و مردم محلی شهر غرب میانه را دوست دارند.", "summary_fa": "آن آربور، میشیگان، همواره در میان بهترین شهرهای کالج آمریکا قرار دارد. شان پاون/ گتی ایماژ آن آربور در مطالعه WalletHub به عنوان دومین شهر برتر دانشگاهی در ایالات متحده رتبه بندی شد. دانشگاه میشیگان اقتصاد Ann Arbor را هدایت می کند و 37400 نفر را در این منطقه استخدام می کند. فرهنگ فوتبال میشیگان حس قوی جامعه را تقویت می کند و افراد محلی و بازدیدکنندگان را به طور یکسان جذب می کند. چه چیزی به عنوان یک شهر دانشگاهی به حساب می آید؟ بستگی داره از کی بپرسی برای برخی، وجود یک دانشگاه دولتی بزرگ غیرقابل مذاکره است. برای دیگران، داشتن یک جمعیت غیر دانشجویی به اندازه کافی بزرگ یک رد صلاحیت فوری است. برخی از شهرها ممکن است به اندازه سایرین ارتباط قوی با دانشگاه مرکزی خود نداشته باشند، و برخی ممکن است دلایل تاریخی گسترده تری برای جذب ساکنان داشته باشند. تعاریف متفاوت است، اما تحت تقریباً همه آنها، Ann Arbor، میشیگان، نزدیک به معنای کتاب درسی یک شهر دانشگاهی است. مطالعه اخیر WalletHub، Ann Arbor را در رتبه دوم بهترین شهر کالج در ایالات متحده، پس از آستین قرار داد. شهر Midwestern حدود 122000 ساکن دارد، در حالی که دانشگاه میشیگان در پاییز 2025 53488 دانشجو را در پردیس Ann Arbor خود ثبت نام کرد - معادل تقریباً 44٪ از جمعیت شهر. دانشگاه میشیگان یک موتور اقتصادی است - و بخش بزرگی از هویت شهر آن آربر پنجمین شهر بزرگ میشیگان است و بیشتر اقتصاد محلی آن حول دانشگاه می چرخد. نیکلاس کلاین/ گتی ایماژ دانشگاه میشیگان بزرگترین کارفرمای شهرستان واشتناو است که تقریباً 37400 کارگر در سراسر دانشگاه و سیستم بهداشتی دارد. در سال مالی 2025، بیش از 296 میلیون دلار کالا و خدمات از مشاغل منطقه خریداری کرد و اموال دانشگاه اکنون حدود 10٪ از زمین آن آربر را تشکیل می دهد. این"}, {"source": "Business Insider", "title": "5 shoe trends that are in this fall and 4 that are out, according to stylists", "link": "https://www.businessinsider.com/popular-shoe-trends-shoes-going-out-of-style-fall-2026", "summary": "One stylist said retro-style hiking boots will be popular this fall. Edward Berthelot/Getty Images Business Insider spoke with stylists about which shoe trends are in and out this season. The experts said split-toe sneakers, animal-print styles, and retro hiking boots will be popular. However, stilettos, classic ballet flats, and shoes with chunky soles are on their way out. The cooler seasons typically mean pulling out warmer clothes and switching up your go-to pairs of shoes. To help you decide what to grab out of the closet — or keep stored away for now — Business Insider spoke with three professional stylists to share their takes on this year's fall shoe trends. Here's what they said. The split-toe sneaker is becoming more mainstream. Edward Berthelot/Getty Images As the name suggests, split-toe shoes have a divided design that separates the big toe from the others. According to Abby Young, lead stylist and CEO of Abby Young Styling , this style is getting some more attention this season. The split-toe design has been around for decades, with Maison Margiela's Tabi — seen on Bad Bunny at the 2024 Met Gala — becoming one of its most recognizable iterations. The design has shown up in boots, flats, and other styles, and Young said split toes are now becoming increasingly popular in sneakers. This fall, animal print is back. Moritz Scholz/Getty Images From classics like snake and cheetah to more adventurous patterns like tiger and dalmatian, animal print is back, according to Kendra Sharpe, stylist and founder of Kendra Sharpe Styling and Creative . \"The time is now to try new prints you might have wanted to try,\" Sharpe said. \"I think it's easier in fall because you can do a boot, you can do a loafer ... you're actually getting more material, so you can kind of incorporate that into your style a little bit more.\" Retro hiking boots are trending. Edward Berthelot/Getty Images Patrick Kenger , the lead personal stylist and founder of styling and image consulting company Pivot, told BI that retro-inspired, utilitarian hiking boots are starting to come back into style. Kenger said this style of boot almost looks like it's ready for winter with a lug sole and O-ring laces. Unlike more tactical hiking boots, though, the trending styles have more of a retro-inspired look. Stay comfy in slipper-style flats. Moritz Scholz/Getty Images According to Sharpe, slipper-style flat mules are having a moment. She specifically recommends satin styles, pops of color, and sq", "date_str": "2026-09-09T15:18:01+00:00", "hash": "bd3a2ded292e6461", "title_fa": "5 ترند کفش که در پاییز امسال هستند و 4 مورد دیگر که به گفته استایلیست ها وجود دارد", "summary_fa": "یکی از استایلیست ها گفت که چکمه های پیاده روی سبک رترو در پاییز امسال محبوب خواهند بود. ادوارد برتلو/ گتی ایماژ بیزینس اینسایدر با استایلیست ها در مورد اینکه کدام ترند کفش در این فصل وجود دارد و در خارج از آن وجود دارد صحبت کرد. کارشناسان گفتند کفش‌های کتانی دوشاخه، سبک‌های طرح حیوانات و چکمه‌های پیاده‌روی یکپارچهسازی با سیستمعامل محبوب خواهند بود. با این حال، کفش های پاشنه بلند، کفش های باله کلاسیک و کفش هایی با کفی درشت در راه هستند. فصول سردتر معمولاً به معنای بیرون آوردن لباس های گرمتر و تعویض جفت کفش های معمولی است. برای کمک به تصمیم گیری در مورد اینکه چه چیزی را از کمد بیرون بیاورید - یا فعلاً آن را دور نگه دارید - Business Insider با سه استایلیست حرفه ای صحبت کرد تا نظرات آنها را در مورد ترندهای کفش پاییزی امسال به اشتراک بگذارد. در اینجا چیزی است که آنها گفتند. کفش های اسپلیت پنجه در حال تبدیل شدن به جریان اصلی هستند. Edward Berthelot/Getty Images همانطور که از نام آن پیداست، کفش های پنجه دوپارچه دارای طراحی تقسیم شده ای هستند که انگشت شست پا را از بقیه جدا می کند. به گفته ابی یانگ، استایلیست اصلی و مدیرعامل ابی یانگ استایلینگ، این سبک در این فصل بیشتر مورد توجه قرار گرفته است. طراحی پنجه‌های شکاف ده‌ها سال است که وجود دارد و Maison Margiela's Tabi - که در Bad Bunny در Met Gala 2024 دیده شد - به یکی از شناخته‌شده‌ترین تکرارهای آن تبدیل شد. این طرح در چکمه‌ها، کفش‌های تخت و مدل‌های دیگر خود را نشان داده است و یانگ گفت که انگشت‌های دوپاره اکنون در کفش‌های کتانی محبوبیت بیشتری پیدا می‌کنند. پاییز امسال، چاپ حیوانی بازگشته است. بنا به گفته کندرا شارپ، صاحب سبک و بنیانگذار Kendra Sharpe Styling and Creative، از آثار"}, {"source": "Business Insider", "title": "Your phone case — or lack of one — could be hurting your image at work", "link": "https://www.businessinsider.com/why-not-using-phone-case-work-look-bad-experts-2026-9", "summary": "A phone case is an accessory, and accessories can send certain messages in the workplace. Getty Images; Tyler Le/BI By now, most working professionals are well aware of the rules that have come to define corporate-appropriate presentation : Skip flashy designer logos, steam blouses and dress shirts, avoid open-toed shoes, and if it's described as \"office siren,\" ditch it altogether. There is another detail, though, you might be overlooking when getting ready for the office: your phone case. To Michelle T. Sterling, an image consultant and personal stylist with over 20 years of experience, a phone is similar to a pair of shoes or a watch. It's an accessory. \"It's an extension of your outfit,\" she said. \"Just like having well-groomed nails is an extension of how you're preparing yourself and presenting yourself, your phone is also a representation of you.\" (Fittingly, the fashion aficionado's current case features a mirror.) Corporate stylists and image consultants who spoke to Business Insider advised to treat this shiny little device as though it's sending a message about you — because it likely is, whether you intend it to or not. This is especially true in professional environments where even the tiniest of details can make the biggest impact. \"People do notice these things,\" Sterling said. Accessorize for success Some may argue that placing such significance on a phone case may teeter into the realm of superficial. Still, as image consultant and former Fashion Institute of Technology instructor Carol Davidson said, because humans are such visual creatures — and because our judgments are often snap decisions — these overlooked points of presentation are \"all more important than people sometimes give credit for.\" \"All of these things add to the impression that you make,\" she said. \"So you want to make sure that all of the details line up.\" The idea that the case one chooses for their phone, or the decision to go without one altogether, indicates one's personality is a relatively new development. \"Twenty-five years ago, I might have been commenting on the pen that someone used,\" said Davidson. \"But we are a digital society … so anything that comes close to our digital devices is going to be important because they are on display.\" \"We constantly have our phone in our hand,\" agreed DeJhauna Smith, an Austin, Texas-based image consultant who primarily works with women, \"whether you're at a networking event or you're at a business meeting.\" Not using a phone c", "date_str": "2026-09-09T15:16:01+00:00", "hash": "243494574c35f7fa", "title_fa": "قاب گوشی شما – یا نبود آن – می تواند به تصویر شما در محل کار آسیب برساند", "summary_fa": "قاب گوشی یکی از لوازم جانبی است و لوازم جانبی می توانند پیام های خاصی را در محل کار ارسال کنند. گتی ایماژ; تایلر لی/بی تا کنون، اکثر متخصصان شاغل به خوبی از قوانینی که برای تعریف ارائه مناسب سازمانی آمده اند آگاه هستند: از لوگوهای طراحان پر زرق و برق، بلوزهای بخار و پیراهن های لباس بگذرید، از کفش های دم باز خودداری کنید و اگر به عنوان \"آژیر اداری\" توصیف می شود، آن را به کلی کنار بگذارید. با این حال، جزئیات دیگری وجود دارد که ممکن است هنگام آماده شدن برای دفتر از آن غافل شوید: قاب تلفن خود. از نظر میشل تی استرلینگ، مشاور تصویر و استایلیست شخصی با بیش از 20 سال تجربه، تلفن شبیه به یک جفت کفش یا ساعت است. این یک لوازم جانبی است. او گفت: \"این امتداد لباس شماست.\" همانطور که داشتن ناخن‌های مرتب، گسترشی از نحوه آماده‌سازی و معرفی خود است، تلفن شما نیز نماینده شماست.» (به طور مناسب، مورد فعلی این علاقه‌مند به مد دارای یک آینه است.) استایلیست‌های شرکتی و مشاوران تصویر که با Business Insider صحبت می‌کردند، توصیه کردند که با این دستگاه کوچک براق به‌گونه‌ای رفتار کنید که انگار پیامی درباره شما ارسال می‌کند – زیرا به احتمال زیاد، چه قصد داشته باشید یا نه. این امر به ویژه در محیط های حرفه ای که حتی کوچکترین جزئیات می توانند بیشترین تأثیر را داشته باشند صادق است. استرلینگ گفت: «مردم متوجه این چیزها می شوند. لوازم جانبی برای موفقیت برخی ممکن است استدلال کنند که قرار دادن چنین اهمیتی بر روی قاب تلفن ممکن است به قلمرو سطحی‌ها منحرف شود. با این حال، همانطور که کارول دیویدسون، مشاور تصویر و مدرس سابق مؤسسه فناوری مد گفت، از آنجایی که انسان ها چنین موجودات بصری هستند - و به دلیل اینکه قضاوت های ما اغلب تصمیمات فوری"}, {"source": "Business Insider", "title": "The best iPhone in 2026: Which Apple smartphone is right for you?", "link": "https://www.businessinsider.com/guides/tech/best-iphone", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Business Insider / Lillian Brown Apple's newest 2026 phones, including the foldable iPhone Ultra, are just around the corner, but you shouldn't count out last year's models just yet when considering what might be the best iPhone for you. Whether your decision-making is based on performance, features, display size, or price, our buying guide can help you choose the best iPhone. Collectively, our tech reviewers have tested and reviewed iPhones since the first model was released in 2007, so you can rest assured in our recommendations. Many of our reviewers also use iPhones daily as personal devices, and we can confidently comment on their long-term use and identify shortcomings. After extensive testing of Apple's current phones, the iPhone 17 is our top pick as the best iPhone for most people, thanks to its combination of performance, new features, and overall value. If you want the best in battery or camera performance, though, look no further than the iPhone 17 Pro models. Our top picks for the best iPhone Apple/Insider Best for most people - iPhone 17 The iPhone 17 is the latest base Apple smartphone, released in September, 2025. Its biggest upgrades include the Always-On display, previously exclusive to Pro models, additional photography features, ProMotion technology, and improved scratch resistance. It also carries over the Camera Control Button and Apple Intelligence from the previous generation. The brand's base phone is no longer available in a larger Plus size (it's been replaced by the iPhone Air), unlike the previous generation; it's only offered in a 6.3-inch size. It is powered by the A19 chip, delivering smoother, more powerful performance than its predecessors. It also boasts up to 30 hours of battery life with video playback — an eight-hour improvement. One of the iPhone 17's shiniest new features is its new camera, now complete with Center Stage and an 18MP front camera for better selfies than ever. The auto-centering capability also applies to video calls, so you don't need to worry about staying in frame. Additionally, you can take advantage of the new Dual Capture video mode and 48MP Ultra Wide lens. In practice, selfies look better than ever, and the automatic centering helps users stay in the moment, instead of fiddling with camera settings. Starting at $800, it's the second-cheapest phone in Apple's lineup. With its solid feature set, includin", "date_str": "2026-09-09T15:09:26+00:00", "hash": "80338de892f63bca", "title_fa": "بهترین آیفون در سال 2026: کدام گوشی هوشمند اپل برای شما مناسب است؟", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید Business Insider / لیلیان براون جدیدترین گوشی‌های اپل در سال 2026، از جمله آیفون تاشو اولترا، در راه است، اما وقتی در نظر می‌گیرید که بهترین آیفون برای شما چیست، نباید مدل‌های سال گذشته را در نظر بگیرید. چه تصمیم گیری شما بر اساس عملکرد، ویژگی ها، اندازه نمایشگر یا قیمت باشد، راهنمای خرید ما می تواند به شما در انتخاب بهترین آیفون کمک کند. در مجموع، بازبینان فناوری ما آیفون‌ها را از زمان عرضه اولین مدل در سال 2007 آزمایش و بررسی کرده‌اند، بنابراین می‌توانید از توصیه‌های ما مطمئن باشید. بسیاری از بررسی کنندگان ما نیز روزانه از آیفون به عنوان دستگاه شخصی استفاده می کنند و ما می توانیم با اطمینان در مورد استفاده طولانی مدت آنها نظر بدهیم و کاستی ها را شناسایی کنیم. پس از آزمایش گسترده تلفن های فعلی اپل، آیفون 17 به دلیل ترکیبی از عملکرد، ویژگی های جدید و ارزش کلی، بهترین انتخاب ما به عنوان بهترین آیفون برای اکثر مردم است. اگر می خواهید بهترین عملکرد باتری یا دوربین را داشته باشید، به مدل های آیفون 17 پرو نگاه نکنید. انتخاب های برتر ما برای بهترین آیفون اپل/اینسایدر بهترین برای اکثر مردم - iPhone 17 آیفون 17 جدیدترین گوشی هوشمند پایه اپل است که در سپتامبر 2025 عرضه شد. بزرگترین ارتقاء آن شامل صفحه نمایش Always-On که قبلا منحصر به مدل های حرفه ای بود، ویژگی های عکاسی اضافی، فناوری ProMotion و بهبود مقاومت در برابر خراش است. همچنین دکمه کنترل دوربین و هوش اپل را از نسل قبل حمل می کند. تلفن پایه این برند بر خلاف نسل قبلی، دیگر در سایز پلاس بزرگتر (با آیفون ایر جایگزین شده است) موجود نیست. فقط در اندازه 6.3 اینچی ارائه می شود. این تراشه"}, {"source": "Business Insider", "title": "5 tasteful fall decorations to add to your home, and 3 tacky ones to avoid, according to an interior designer", "link": "https://www.businessinsider.com/best-and-worst-fall-decorations-according-to-an-interior-designer", "summary": "Pumpkins are a popular fall decor item in the US. AdamJohnHurley/Shutterstock Interior designer Ashley Childers shared her favorite fall decor pieces and which ones to skip. \"I see people go overboard with the faux: faux pumpkins, faux plants, faux everything,\" she said. Natural wreaths and wool blankets can enhance your home's design. The arrival of fall means pulling out the pumpkins, moody autumnal colors, and cozy throw pillows. However, while some fall decorations can make your home feel warm, elevated, and inviting, others can border on tacky. Seasonal decor can also be expensive, so investing in a few timeless pieces that will last from year to year can ultimately save you money in the long run. \"A lot of times, I feel like the holiday decor is disjointed from what the aesthetic is of the actual home that you live in. It should be cohesive, in my opinion,\" Ashley Childers , an interior designer and home furnishings and accessories designer based in Arkansas, told Business Insider. \"On the opposite end of the spectrum, I see a lot of people who have very curated style who feel like they can't decorate for the holidays because they don't want it to be tacky or cheesy,\" she said. \"If you want to decorate for the holidays, you can do it in a beautiful way.\" Here are five tasteful fall decorations to add to your home, and three tacky ones to skip. Let nature guide the colors you incorporate into your fall home decor. A living room with neutral decor accents. Ashley Childers Rather than leaning into trends or grabbing the first items she sees in the Halloween section at Target or Walmart, Childers said she looks to the colors she sees in nature each autumn for inspiration. \"I love to really let nature kind of guide seasonal decor,\" Childers, who's worked in the design industry for more than 15 years and in interior design for a decade, told Business Insider. \"So, we always lean into beautiful wheats and burnt oranges, burgundies, sage greens, even into deep forest green, camel.\" \"All those warm, rich colors that you think about when you think of fall are what I love seeing brought in to fall decor,\" she continued. \"I just think if you let nature guide you, you're never going to make a mistake.\" Switching up your fall decor with a wool throw blanket can add texture to your space. Bed with cozy knitted blanket and cushions. New Africa/Shutterstock \"A really beautiful wool throw blanket is iconic for fall, in my opinion,\" Childers said. \"It can really be a c", "date_str": "2026-09-09T14:58:32+00:00", "hash": "7dd9f4ed626193d7", "title_fa": "به گفته یک طراح داخلی، 5 دکوراسیون پاییزی خوش سلیقه که باید به خانه خود اضافه کنید، و 3 مورد تزیینی که باید از آن اجتناب کنید.", "summary_fa": "کدو تنبل یکی از وسایل دکور پاییزی محبوب در ایالات متحده است. AdamJohnHurley/Shutterstock، طراح داخلی اشلی چیلدرز، قطعات دکور پاییزی مورد علاقه خود را به اشتراک گذاشت و اینکه کدام یک را باید نادیده گرفت. او می‌گوید: «من می‌بینم که مردم در مورد چیزهای مصنوعی زیاده‌روی می‌کنند: کدو تنبل مصنوعی، گیاهان مصنوعی، همه چیز مصنوعی. اکلیل های طبیعی و پتوهای پشمی می توانند طراحی خانه شما را بهبود بخشند. فرا رسیدن پاییز به معنای بیرون کشیدن کدو تنبل ها، رنگ های خوش خلق پاییزی و بالش های پرتابی دنج است. با این حال، در حالی که برخی از دکوراسیون های پاییزی می توانند به خانه شما احساس گرمی، بلندی و جذابیت بدهند، برخی دیگر می توانند در حاشیه قرار گیرند. دکوراسیون فصلی نیز می تواند گران باشد، بنابراین سرمایه گذاری در چند قطعه جاودانه که سالی به سال دوام می آورند، در نهایت می تواند در دراز مدت باعث صرفه جویی در هزینه شما شود. «بسیاری از اوقات، احساس می‌کنم دکوراسیون تعطیلات با زیبایی‌شناسی خانه‌ای که در آن زندگی می‌کنید، متفاوت است. به نظر من، اشلی چیلدرز، طراح داخلی و طراح مبلمان و لوازم خانگی مستقر در آرکانزاس، به Business Insider گفت: \"در نقطه مقابل طیف، من افراد زیادی را می بینم که سبک بسیار گزینشی دارند که احساس می کنند نمی توانند برای تعطیلات تزئین کنند، زیرا نمی خواهند چرت و پرت باشد.\" \"اگر می خواهید برای تعطیلات تزئین کنید، می توانید آن را به روشی زیبا انجام دهید.\" در اینجا پنج دکوراسیون پاییزی خوش سلیقه برای اضافه کردن به خانه خود و سه مورد دلپذیر که باید از آن چشم پوشی کنید، آورده شده است. اجازه دهید طبیعت رنگ هایی را که در دکوراسیون خانه پاییزی خود به کار می برید هدایت کند. اتاق نشیمن با لهجه های دکور خنثی. اشلی چیلدرز به جای اینکه به ترندها متمایل"}, {"source": "Business Insider", "title": "My husband and I were DINKs who traveled constantly. I thought having a baby might stop us, but I was wrong.", "link": "https://www.businessinsider.com/former-dink-lifestyle-changed-less-than-expected-after-baby-2026-9", "summary": "The author and her husband taking their son on a hike to see the fall foliage Courtesy of Renate Flanagan. My husband and I are former DINKS, (dual income, no kids) who traveled a lot before we had a child. While I was pregnant, people warned me my life would change drastically — and not for the better. Of course, our life changed after we had a baby, but we still travel a lot and are very fulfilled. In my early 30s, I was living the quintessential DINK (dual-income, no kids) lifestyle . My partner and I had established careers, no children, and PTO to burn. During one 12-month period, we averaged taking a trip every other month. We went hiking in Acadia National Park and Arizona. We rented a house with a pool and went biking around Sanibel Island in Florida. We explored Joshua Tree National Park, attempted a 14er in Colorado , and visited four different national parks in Washington State. My husband and I were always on the same page about wanting a child, eventually, but I was worried that having a family would bring our adventurous lifestyle to a screeching halt. Luckily, I was wrong. I thought having a kid would end our adventures Before trying to get pregnant, I planned a last hurrah for us as a childless couple . We road-tripped around Mexico, exploring ancient Mayan ruins, swimming in cenotes, and sipping various permutations of agave beverages. Before having kids, the author and her husband enjoyed traveling a lot. Here they are shown during a road trip around Spain and Portugal. Courtesy of Renate Flanagan. I got pregnant a few months later. Once I was expecting, I worried that my due date was an expiration date for freedom. Fortunate that my nausea and fatigue during pregnancy were mild, I squeezed in two more hiking trips. I went to the Canadian Rockies, Zion, and Bryce Canyon. The week before I gave birth, I joined my husband for dinner with a group of his colleagues. One of the women at the dinner was the mother of a toddler. She looked me dead in the eye and said, \"Enjoy this, because you're never going out to eat again.\" I wanted to believe that my lifestyle wouldn't be over because I had a baby, but here was another mother saying exactly what I was afraid to hear. There were other possibilities Thankfully, I had other parenting role models who showed me differently. My own mom traveled around Europe with me the summer before I turned 1. I have family friends who moved internationally with two young kids and travel multiple times a year. Per", "date_str": "2026-09-09T14:35:02+00:00", "hash": "4857694733781f62", "title_fa": "من و شوهرم دینکی بودیم که مدام در سفر بودیم. فکر می کردم بچه دار شدن ممکن است مانع ما شود، اما اشتباه می کردم.", "summary_fa": "نویسنده و همسرش پسرشان را برای دیدن شاخ و برگ های پاییزی به پیاده روی می برند. من و شوهرم DINKS سابق، (با درآمد دوگانه، بدون بچه) هستیم که قبل از بچه دار شدن خیلی سفر می کردیم. زمانی که باردار بودم، مردم به من هشدار دادند که زندگی من به شدت تغییر خواهد کرد - و نه برای بهتر شدن. البته بعد از بچه دار شدن زندگی ما تغییر کرد، اما هنوز هم زیاد سفر می کنیم و بسیار راضی هستیم. در اوایل دهه 30 زندگی ام،
