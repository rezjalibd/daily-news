dness and disappointment about quitting. I had continued dancing on and off as an adult, but I had never really returned to it in a meaningful way. I thought about how much I loved to dance as a little girl, grinning ear to ear even when I forgot all the steps. Research has shown that the surprising benefits of dance extend beyond physical fitness . Now I take four to five danc", "date_str": "2026-10-13T21:05:01+00:00", "hash": "4d934b4274b6f983", "title_fa": "دوستان من GLP-1 را برای افزایش وزن من پیشنهاد کردند. جوابم را در پیست رقص پیدا کردم.", "summary_fa": "نویسنده (تصویر نیست) گفت رقص روال تناسب اندام او را دوباره تقویت کرده است. FG Trade Latin/Getty Images من شش روز در هفته ورزش می کردم اما همچنان وزن اضافه می کردم. مردم از من خواستند که GLP-1 را امتحان کنم، اما من دکترم گفت که شرایط لازم را ندارم. شروع کردم به گنجاندن کلاس های رقص در روال خود و وزن شروع به کاهش کرد. من ریزه اندام هستم، هیکل کوچکی دارم و هرگز مجبور نبودم با مشکلات وزن دست و پنجه نرم کنم. من به طور منظم شش روز در هفته به باشگاه می‌رفتم و سال‌هاست که علاوه بر پیاده‌روی، ترکیبی از تمرینات قدرتی و کلاس‌های سبک بوت کمپ را انجام داده‌ام. علی‌رغم تلاش‌هایم، شروع به اضافه کردن وزن کردم - چیزی بیش از 10 پوند در حدود 24 ماه. نمی‌دانستم چرا یا با افزایش وزن چه کنم. تقریبا هر روز ورزش می کردم، اما احساس خستگی و شکست می کردم. دیگران پیشنهاد کردند به دارو روی بیاورم. یکی از دوستان به من گفت: \"استرس نداشته باشید، فقط یک GLP-1 بگیرید، و اگر دکترتان آن را به شما نداد، فقط آن را آنلاین بگیرید.\" BMI من آنقدر بالا نبود که پزشکم دارو تجویز کند، و من نمی خواستم توصیه های ارائه دهنده ام را نادیده بگیرم. اما با وجود تمام تلاشم، نتایجی را که می‌خواستم نمی‌دیدم. نویسنده گفت که او شروع به بی حوصلگی کرد و ورزشگاه و شستن خودش را هل داد. او به رقصی که در کودکی عاشقش بود بازگشت و ذهن و بدنش را متحول کرد. با حسن نیت از Leslie Vooris. در ورزشگاه حوصله ام سر رفته بود، سپس، در یک کلاس ورزشگاه، متوجه شدم که تنبل شده ام. من ساده ترین وزنه ها را برمی داشتم و حرکات را انجام می دادم و هرگز در طول تمرین به خودم فشار نمی آوردم. حرکات"}, {"source": "Business Insider", "title": "Trump’s new press secretary was asked where she passed the bar. Her answer raised more questions.", "link": "https://www.businessinsider.com/trumps-new-press-secretary-katie-zacharia-questions-bar-attorney-credentials-2026-10", "summary": "White House press secretary Katie Zacharia held her first press briefing Tuesday. Win McNamee/Getty Images New White House press secretary Katie Zacharia is facing questions about her legal credentials. Her answer on Tuesday about where she passed the bar exam added to the confusion. Zacharia earned a law degree from Pepperdine University and has repeatedly called herself an attorney. Newly minted White House press secretary Katie Zacharia has repeatedly described herself as an attorney. The conservative commentator is now facing scrutiny about her legal qualifications after she was pressed to explain them following her first White House briefing with the media. As President Donald Trump spoke to reporters after the briefing on Tuesday, one asked him where Zacharia had passed the bar exam. \"What state did she pass the bar exam in? You said she is an attorney. Where did she pass the bar exam? Which state?\" the reporter asked. Trump then turned to Zacharia, standing behind him, and asked, \"Which state?\" \"When I moved to China,\" Zacharia answered. Her response added to the confusion over where she may be licensed to practice law in the United States. State bar exams are generally administered in person within the jurisdiction. In a statement, Zacharia said she \"practiced international transaction law, with all the appropriate credentials.\" She did not say if she'd passed the bar in any state. \"Katie is a fabulous and wonderful addition to the team,\" Steven Cheung, White House communications director, said. \"She is uniquely qualified and whip smart to help inform the American people about all the great things President Trump and his Administration have been doing, and she will do an incredible job as Press Secretary.\" Zacharia does not appear to be listed in the State Bar of California's attorney database, despite living and working in the state. She also does not appear to be listed in the D.C. Bar's member directory. The Substack publication, Popular Information, reported earlier on Tuesday that it searched records in all 50 states and Washington, DC, and turned up no evidence that Zacharia is licensed to practice law. President Trump on White House Press Secretary Katie Zacharia: \"I thought she was very good.\" Q: \"You said she's an attorney. Where did she pass the bar exam? Which state?\" Zacharia: \"When I moved to China.\" Q: \"Where did you pass the bar exam?\" https://t.co/5xiwyEsVSs — CSPAN (@cspan) October 13, 2026 Zacharia graduated from California's Pepp", "date_str": "2026-10-13T21:01:46+00:00", "hash": "bf7d41a11fae3089", "title_fa": "از دبیر مطبوعاتی جدید ترامپ پرسیده شد که او از کجا عبور کرده است. پاسخ او سؤالات بیشتری را ایجاد کرد.", "summary_fa": "کیتی زاخاریا، سخنگوی کاخ سفید، اولین نشست خبری خود را روز سه شنبه برگزار کرد. Win McNamee/Getty Images، کتی زاخاریا، سخنگوی جدید کاخ سفید، با سؤالاتی در مورد اعتبار قانونی خود مواجه است. پاسخ او در روز سه شنبه در مورد محل قبولی در آزمون وکالت بر سردرگمی افزود. زکریا مدرک حقوق را از دانشگاه پپردین دریافت کرده و بارها خود را وکیل خوانده است. کتی زاخاریا، سخنگوی جدید کاخ سفید، بارها خود را وکیل دادگستری معرفی کرده است. این مفسر محافظه‌کار اکنون با بررسی صلاحیت‌های حقوقی‌اش مواجه است، زیرا پس از اولین جلسه توجیهی‌اش در کاخ سفید با رسانه‌ها تحت فشار قرار گرفت تا درباره آنها توضیح دهد. هنگامی که رئیس جمهور دونالد ترامپ پس از جلسه توجیهی روز سه شنبه با خبرنگاران صحبت می کرد، یکی از او پرسید که زکریا در کجا امتحان وکالت را قبول کرده است. \"او در چه ایالتی امتحان وکالت داد؟ شما گفتید وکیل است. کجا امتحان وکالت داد؟ کدام ایالت؟\" خبرنگار پرسید. ترامپ سپس رو به زکریا کرد که پشت سر او ایستاده بود و پرسید: کدام ایالت؟ زکریا پاسخ داد: وقتی به چین نقل مکان کردم. پاسخ او بر این سردرگمی افزود که کجا ممکن است مجوز وکالت در ایالات متحده را دریافت کند. آزمون های وکالت دولتی معمولا به صورت حضوری در داخل حوزه قضایی برگزار می شود. زاخاریا در بیانیه‌ای گفت که \"قانون معاملات بین‌المللی را با تمام اعتبارنامه‌های مناسب تمرین می‌کند.\" او نگفت که آیا در هیچ ایالتی از نوار عبور کرده است یا خیر. استیون چونگ، مدیر ارتباطات کاخ سفید، گفت: «کتی یک اضافه شگفت‌انگیز و شگفت‌انگیز برای تیم است. او واجد شرایط منحصربه‌فرد است و برای کمک به اطلاع‌رسانی به مردم آمریکا در مورد تمام کارهای بزرگی که پرزیدنت ترامپ و دولتش انجام داده‌اند، کار می‌کند و به عنوان سخنگوی مطبوعاتی کار فوق‌العاده‌ای انجام خواهد داد.»"}, {"source": "Business Insider", "title": "I know my mom is getting older. Seeing it is different from knowing it.", "link": "https://www.businessinsider.com/adult-daughter-seeing-mother-as-person-aging-parent-2026-10", "summary": "The author has lived abroad half her life. Courtesy of the author I've lived about half of my adult life either overseas or traveling. It's been more than 13 years since we've lived on the same continent. My perspective on our relationship and the one with my own daughter is shifting in real time. Time is a funny thing, mostly because it's a construct, but it has a way of forcing people to see things differently, even when they might not want to. I hadn't spent long stretches of time with my mom until her recent visit. After she left, I began to reflect on how the years — and distance — have changed us both. The picture I have of her has stayed mostly the same over the years, but this visit shifted something: I'm now more aware of her aging , and of my own. I'm seeing her for who she is It's hard to see your parents one way as a child and then realize, as an adult, that that impression of them was based solely on a child's perspective and only knowing them relationally as a parent, not fully knowing them as an adult from an adult's perspective. The relationship I had with her as a child and teen may be long gone, and the relationship I have with her now has evolved beyond anything my youthful perspective could have imagined. During this most recent visit, I feel like I'm finally seeing the truest version of her from a healed, adult perspective. She's human. I'm human. We all just have to figure out how we relate to one another and engage in one another's lives. I'm in my hinge generation years The phase of life where I am right now as a millennial has sometimes been referred to as the sandwich generation , but I recently read something about it also being called the hinge generation. I'm approaching this thing called \"middle age,\" and I'm reluctant to identify as such. I'm old enough to have aging parents and be a parent myself, but still young enough that middle age simply sounds like a historical time period. Watching my mother's age become more apparent — both as her child and as a parent myself — has me contemplating the reality of standing in the middle as part of the hinge generation . Seeing her differently has also made me profoundly aware that my own daughter is old enough to perceive me differently from how she saw me as a toddler and young child. I'm less infallible and more easily able to be critiqued, as my human nature is more visible to her developing mind. What does this mean for my own daughter, who's watching me age? How does she feel abo", "date_str": "2026-10-13T20:49:01+00:00", "hash": "8ee43e19712bfe25", "title_fa": "میدونم مامانم داره بزرگ میشه دیدن آن با دانستن آن متفاوت است.", "summary_fa": "نویسنده نیمی از عمر خود را در خارج از کشور زندگی کرده است. با حسن نیت از نویسنده من تقریباً نیمی از زندگی بزرگسالی خود را در خارج از کشور یا در سفر گذرانده ام. بیش از 13 سال از زندگی ما در یک قاره می گذرد. دیدگاه من نسبت به رابطه ما و رابطه با دخترم در زمان واقعی تغییر می کند. زمان چیز خنده‌داری است، بیشتر به این دلیل که یک ساختار است، اما راهی دارد که مردم را مجبور می‌کند چیزها را متفاوت ببینند، حتی زمانی که ممکن است نخواهند. من تا زمان ملاقات اخیر مادرم زمان زیادی را با مادرم سپری نکرده بودم. پس از رفتن او، من شروع به تفکر کردم که چگونه سال ها - و فاصله - هر دوی ما را تغییر داده است. تصویری که من از او دارم در طول سال‌ها تقریباً ثابت مانده است، اما این دیدار چیزی را تغییر داد: من اکنون بیشتر از پیری او و خودم آگاهم. من او را همان طور که هست می بینم سخت است که پدر و مادر خود را در دوران کودکی به یک شکل ببینی و سپس به عنوان یک بزرگسال بفهمی که این تصور از آنها صرفاً بر اساس دیدگاه کودک است و فقط آنها را از لحاظ رابطه به عنوان یک پدر و مادر می شناختند، نه اینکه آنها را به عنوان یک بزرگسال از دیدگاه بزرگسالان کاملاً بشناسیم. رابطه ای که در دوران کودکی و نوجوانی با او داشتم ممکن است مدت هاست که از بین رفته باشد و رابطه ای که اکنون با او دارم فراتر از هر چیزی که دیدگاه جوانی من تصور می کرد تکامل یافته است. در این دیدار اخیر، احساس می‌کنم که بالاخره دارم واقعی‌ترین نسخه او را از منظر شفا یافته و بالغ می‌بینم. او انسان است. من انسانم همه ما فقط"}, {"source": "Business Insider", "title": "The 17 best places to buy high-quality, affordable women's basics", "link": "https://www.businessinsider.com/guides/style/womens-basics-clothing-brands", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Style editors wearing a Naadam cashmere sweater, a Quince skirt and sweater, and Leset pants. Gabrielle Chase, Sally Kaplan, Samantha Crozier/Business Insider We've all had the same dilemma: a closet full of clothes with nothing to wear. In those moments, you pull out the essentials — classic, reliable pieces that look good no matter what. When you own enough comfortable basics, you take the guesswork out of getting dressed and are free to use that mental energy elsewhere. Just about every brand offers its own take on the basics, but after wearing and washing ours for years, we found a few that were more durable than others. We look to these brands when we want to look simply stylish (picture some classic jeans paired with a crisp white tee ), or even rock loungewear that doubles as business casual. Combining high-quality materials, affordability, and versatility, these brands make the best women's basics you'll want to wear every day. See more upscale picks in our guide to the best luxury basics for women . A quick look at our favorite places to buy women's basics: Quince is our favorite place to buy women's basics overall. Our team of style editors has tested nearly all of their pieces, and we're continually impressed with the lower-than-expected prices. You can check out our full Quince review for a detailed breakdown of what we love and don't love about specific styles, but suffice it to say that it's a great choice for budget-friendly cashmere sweaters , cotton T-shirts , and office-ready staples . Buck Mason is the MVP when it comes to natural textiles. If you're someone who hates how a cheap polyester blend feels against your skin, then rest assured that you'll have no issue with anything from Buck Mason. Naadam is our favorite place to get cold-weather knit basics, particularly cashmere sweaters. See our Naadam review to hear more about why we love the brand. Spanx is our go-to for comfortable, smoothing wardrobe essentials that make getting dressed easier. The brand’s AirEssentials collection is especially good for soft, put-together travel and lounge sets, while its Ponte Pants are a reliable workwear staple with stretch and a sleek fit. AYR is a great choice for elevated basics that are built to last. The brand’s T-shirts are pricier than most, but their flattering proportions, substantial Peruvian cotton, and reliable shape retention make them worthwhi", "date_str": "2026-10-13T20:30:49+00:00", "hash": "dd81f4146522f70b", "title_fa": "17 بهترین مکان برای خرید لوازم اولیه زنانه با کیفیت بالا و مقرون به صرفه", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید ویراستاران Style با ژاکت ترمه Naadam، دامن و ژاکت کوئینس، و شلوار Leset. گابریل چیس، سالی کاپلان، سامانتا کروزیر/Business Insider همه ما با یک دوراهی روبرو بوده‌ایم: کمد پر از لباس‌هایی که چیزی برای پوشیدن ندارند. در آن لحظات، شما ملزومات را بیرون می آورید - قطعات کلاسیک و قابل اعتمادی که بدون توجه به هر چیزی زیبا به نظر می رسند. وقتی به اندازه کافی اصول اولیه راحت را داشته باشید، حدس و گمان را از لباس پوشیدن کنار می گذارید و آزاد هستید که از آن انرژی ذهنی در جای دیگری استفاده کنید. تقریباً هر برندی برداشت خود را از اصول اولیه ارائه می دهد، اما پس از سال ها پوشیدن و شستن برند ما، تعدادی از آنها را پیدا کردیم که دوام بیشتری نسبت به سایرین داشتند. زمانی که می‌خواهیم شیک به نظر برسیم، به این برندها نگاه می‌کنیم (تصویر می‌کنیم چند شلوار جین کلاسیک با یک سه‌راه‌رنگ سفید ترد ست شده است)، یا حتی لباس‌های راحتی راک که به‌عنوان گاه به گاه تجاری عمل می‌کنند. این برندها با ترکیب مواد با کیفیت بالا، مقرون به صرفه بودن و تطبیق پذیری، بهترین لوازم اولیه زنانه را که می خواهید هر روز بپوشید، می سازند. در راهنمای ما در مورد بهترین اصول لوکس برای زنان، انتخاب های مجلل بیشتری را مشاهده کنید. نگاهی گذرا به مکان های مورد علاقه ما برای خرید لوازم اولیه زنانه: به طور کلی مکان مورد علاقه ما برای خرید لوازم اولیه زنانه است. تیم ویراستاران سبک ما تقریباً همه قطعات آنها را آزمایش کرده اند و ما دائماً تحت تأثیر قیمت های پایین تر از حد انتظار هستیم. می‌توانید بررسی کامل Quince ما را برای تفصیل جزئیات آنچه که در مورد سبک‌های خاص دوست"}, {"source": "Business Insider", "title": "How to watch MLB games: Live stream baseball anywhere", "link": "https://www.businessinsider.com/guides/streaming/how-to-watch-mlb-baseball-games-2026", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Cary Edmondson/IMAGN IMAGES via Reuters Connect The MLB regular season has come to a close, but the Playoffs are just heating up. Our team has scoured the broadcast and streaming options to highlight everything you need to know about how to watch MLB games, including the best services for those without cable. The Los Angeles Dodgers and Milwaukee Brewers are duking it out in the NLCS for the second year in a row, while the Cleveland Guardians and Tampa Bay Rays clash in the ALCS. NLCS games air on FOX and FS1, and ALCS games are broadcast on TBS and truTV. The World Series will air on FOX. You can find a full guide to streaming the MLB below, including services for the regular season. Several of these streaming platforms will also help you to watch the postseason. See also: How to watch NFL games | How to watch college football games How to watch MLB games: quick links US: Apple TV, Fox, FS1, TBS, ESPN, NBC, Peacock, Netflix DirecTV YouTube TV Apple TV ESPN Unlimited Peacock Fox One HBO Max Netflix Access subscriptions from anywhere: NordVPN Regular Season: March 25-September 27, 2026 Playoffs: September 29-October 20, 2026 (at the latest) World Series: October 23-31, 2026 (at the latest) How to watch MLB games in the US As usual, the MLB viewing situation gets complicated. Some of the viewing options are the same as last year, but there are also a few new broadcasters and streaming services in play. There are now several streaming service-exclusive national broadcasts, which means that even with the most comprehensive cable package in the world, diehard baseball fans will most likely still need to sign up for a streaming service or two this season. For the purpose of this guide, we're going to focus on national broadcasts/streams, so if you're hoping to tune into local games, we recommend consulting your TV guide and regional sports network(s). Nationally broadcast MLB games will air on FOX, FS1, TBS, ESPN, NBC, Peacock, Apple TV, and Netflix. ESPN's weeknight MLB schedule looks a little bit different this year — with the bulk of the ESPN exclusive games taking place in June, July, and August — and Netflix and NBC/Peacock are picking up some of the slack on Sundays. Just keep in mind that every game is subject to blackout restrictions in local areas. Thanks to some of the streaming exclusives, there's no one way to watch every single nationally broadcast game. Ou", "date_str": "2026-10-13T20:30:45+00:00", "hash": "a895bc023b886147", "title_fa": "نحوه تماشای بازی‌های MLB: پخش مستقیم بیسبال در هر کجا", "summary_fa": "بسته MySports DirecTV کانال‌های ورزشی پرطرفداری، از پایه‌های اصلی مانند ESPN تا پیشنهادات ویژه مانند شبکه ACC را در خود دارد."}, {"source": "Business Insider", "title": "After 20 years at IBM, I changed careers and started a side gig. Now it's a 7-figure company — here’s how I grew it.", "link": "https://www.businessinsider.com/former-ibm-employee-side-gig-counseling-business-how-built-2026-10", "summary": "Becky DeGrossa spent 20 years in Big Tech before opening her business, CounselingWise. Matthew DeFeo for BI Becky DeGrossa, 66, worked at IBM and then became a therapist before opening CounselingWise. The service helps therapists market their businesses through custom websites, SEO, and Google Ads. She works with 40 to 50 contractors who have great people skills, which has helped her scale. This as-told-to essay is based on a conversation with Becky DeGrossa, a 66-year-old who is founder of CounselingWise from Boulder, Colorado. It's been edited for length and clarity. I earned a degree in computer science from Cal Poly and then spent 20 years in total at IBM , leaving the company in 2003. When I left, I was a consultant and managing principal, and I was supposed to be leading the team up the hill — but I just really wasn't passionate about it at all anymore. I spent a year thinking, \"I'm going to go do something else. I've been here forever. What do I know how to do? What do I like doing?\" When I thought about what I liked about my Big Tech job, it was being a manager. The most meaningful part of my job was meeting one-on-one with employees to help them out with a problem or coach them along. I'd also been in therapy and had found it extremely helpful, so I thought I'd change careers to become a therapist . I earned a Master's degree in psychology from 2003 to 2006 and then worked as a practicing therapist. While doing this, I started a side gig from my therapy office, organizing little groups of therapists to show them what they needed to do to create their own Google business profile and promote their website. This was the beginning of what became my marketing agency CounselingWise, which helps therapists get found by clients through these services as well as custom websites, SEO, and Google Ads. As I spent more and more time on my business, I didn't have time to be a therapist and build my business. So I closed my therapy practice four years after I started it to pursue my business full time, combining my technical, marketing, and psychology backgrounds. DeGrossa said the most meaningful part of her tech career was meeting with employees to help them out with a problem or coach them along. Matthew DeFeo for BI It was hard to stop my therapy practice — I felt honored to walk alongside my clients through some very difficult things in their lives, and I didn't take leaving lightly. I stopped taking new clients right away, but I gave my existing clients si", "date_str": "2026-10-13T20:16:13+00:00", "hash": "d438b5ed14d5264f", "title_fa": "پس از 20 سال در IBM، من حرفه را تغییر دادم و یک کنسرت جانبی را شروع کردم. اکنون این یک شرکت 7 رقمی است - در اینجا نحوه رشد من آمده است.", "summary_fa": "Becky DeGrossa 20 سال را در Big Tech گذراند و قبل از افتتاح تجارت خود، CounselingWise. متیو دفئو برای BI بکی دگروسا، 66 ساله، در IBM کار می کرد و سپس قبل از افتتاح CounselingWise یک درمانگر شد. این سرویس به درمانگران کمک می کند تا کسب و کار خود را از طریق وب سایت های سفارشی، سئو و تبلیغات گوگل بازاریابی کنند. او با 40 تا 50 پیمانکار کار می کند که مهارت های انسانی بالایی دارند، که به او کمک کرده است. این مقاله همانطور که گفته شد بر اساس گفتگو با بکی دگروسا، 66 ساله ای است که بنیانگذار CounselingWise از بولدر، کلرادو است. برای طول و وضوح ویرایش شده است. من مدرکی را در رشته علوم کامپیوتر از Cal Poly گرفتم و سپس در مجموع 20 سال را در IBM گذراندم و در سال 2003 شرکت را ترک کردم. زمانی که من را ترک کردم، مشاور و مدیر ارشد بودم و قرار بود تیم را به سمت بالا هدایت کنم - اما واقعاً دیگر اصلاً به آن علاقه نداشتم. من یک سال به این فکر کردم که \"می‌خواهم بروم کار دیگری انجام دهم. من برای همیشه اینجا هستم. چه کاری بلد هستم؟ چه کاری را دوست دارم؟\" وقتی به این فکر کردم که در مورد شغل فناوری بزرگم چه چیزی را دوست دارم، مدیر بودن بود. مهم ترین بخش کار من ملاقات انفرادی با کارمندان برای کمک به آنها در حل مشکل یا راهنمایی آنها بود. من همچنین تحت درمان بوده‌ام و آن را بسیار مفید می‌دانستم، بنابراین فکر کردم که شغلم را تغییر دهم تا یک درمانگر شوم. من از سال 2003 تا 2006 مدرک کارشناسی ارشد روانشناسی گرفتم و سپس به عنوان یک درمانگر مشغول به کار شدم. در حین انجام این کار، من یک کنسرت جانبی را از دفتر درمان خود شروع کردم"}, {"source": "Business Insider", "title": "I've been to Iguazú Falls countless times. Seeing them under a full moon was something else.", "link": "https://www.businessinsider.com/iguazu-falls-night-tour-full-moon-rainforest-argentina-2026-10", "summary": "The author went on a full-moon walk at Iguazú Falls at night. Courtesy of the author My husband and I booked a nighttime tour of Iguazú Falls during the full moon. We walked through the forest in darkness, listening to wildlife and rushing water. The moonlit waterfalls were unlike anything I'd seen during my many daytime visits. I'm originally from Argentina and grew up in Brazil, so I've been to the Iguazú Falls — which sit between the two countries — plenty of times. This year, I decided to take my husband and kids to see the world's largest waterfall system , since they had never been before. And while their minds were blown during our daytime visit, it was the night walk I took with my husband through the falls that, honestly, took my breath away. The full moon tour is small and private The night tour is only available during a full moon , and you can choose different time slots. We were there with friends for a wedding and chose the 9:25 p.m. slot to guarantee it'd be really dark out. While kids are allowed on the full-moon tour, we decided to leave ours at the hotel with my mom so we could fully enjoy the experience. The author walked in the dark through the Iguazú Falls. Courtesy of the author Our tour had 120 people, which is relatively small compared to the thousands you can encounter walking along the metal walkway leading to the falls during the day. The experience felt intimate because we were such a small group, which gave us space and time at every stop. The walk starts right before the falls, with a small performance by the Guaraní, the indigenous people of that part of Argentina . There, our guide also explained what certain words meant, for example, Iguazú means \"big water\" in Guaraní. The moon guided our way After the performance, we started walking through a thick forest in the dark. The guides told us to use all our senses to experience the national park in a way very few ever do, and they were right. We started noticing different chirps and squawks from insects, birds, and monkeys. There were also different smells coming from the forest. But one sound was undeniable. Even before we reached the falls, the sound they made was so loud that it was hard to ignore, and it grew even louder as we approached. The author heard the waterfalls before she saw them. Courtesy of the author Throughout the tour, we weren't allowed to use flashlights or flash photography . The whole point was to let your eyes adjust to walking in the dark and to let the", "date_str": "2026-10-13T20:08:46+00:00", "hash": "b5be3876728051dc", "title_fa": "من بارها به آبشار ایگوازو رفته ام. دیدن آنها زیر ماه کامل چیز دیگری بود.", "summary_fa": "نویسنده شبانه در آبشار ایگوازو به پیاده روی در ماه کامل رفت. با حسن نیت از نویسنده، من و شوهرم یک تور شبانه از آبشار ایگوازو را در طول ماه کامل رزرو کردیم. ما در میان جنگل در تاریکی قدم زدیم، به صدای حیات وحش و آب خروشان گوش دادیم. آبشارهای مهتابی شباهتی نداشتند که در طول بازدیدهای روزانه‌ام دیده بودم. من اصالتاً اهل آرژانتین هستم و در برزیل r. Musk posted a picture of Ms. Comans to his millions of followers while falsely characterizing her government service as a 'criminal action' was clearly intended to make her afraid,\" Federal Magistrate Judge William Fitzpatrick wrote in a ruling published on Tuesday. In a blistering eight-page ruling, Fitzpatrick addressed what he described as the reputational damage to Mary Comans, a longtime federal government employee who was fired from her post as chief financial officer of the Federal Emergency Management Agency in February 2025. Musk's February 11, 2025, post, which was made when he was de facto leader of the White House DOGE Office , \"served no legitimate governmental interest and was little more than state sanctioned intimidation,\" Fitzpatrick wrote. Fitzpatrick wrote that federal officials knew at the time that it was false to accuse Comans of trying to circumvent President Donald Trump 's executive order that paused federal funding to non-governmental organizations assisting migrants. Nonetheless, Musk and then-DHS Secretary Kristi Noem, among others, made statements that Fitzpatrick wrote impugned \"the personal and professional integrity of Ms. Comans,\" Fitzpatrick wrote. \"For reasons unfathomable to this Court, officials chose to turn the power of the federal government against a singular employee with an impeccable record of public service,\" Fitzpatrick wrote. \"In short, Ms. Comans was professionally targeted and personally attacked by government officials for no legitimate reason.\" Musk's post on X was one of seven statements Fitzpatrick addressed in the ruling. Musk quote-tweeted a post that posted a picture of Comans and Trump with the text, \"FEMA CFO Mary Comans was just fired for funneling $58M to illegal migrant hotels in Manhattan. FA, FO.\" In his post, Musk added, \"A criminal action.\" Fitzpatrick wrote that it was clear to other federal officials tha", "date_str": "2026-10-13T20:01:12+00:00", "hash": "c2b965b57a4aea80", "title_fa": "قاضی می گوید که ایلان ماسک زمانی که یک مقام وزارت بهداشت را به جرمی متهم کرده بود در \"ارعابی بیشتر از تحریم های دولتی\" شرکت داشت.", "summary_fa": "یک قاضی فدرال، ایلان ماسک را به دلیل اظهاراتی که در مورد یک کارمند اخراج شده فدرال بیان کرده بود، تحت تعقیب قرار داد. کوین دیچ/ گتی ایماژ یک قاضی فدرال پست فوریه 2025 ایلان ماسک را در توییتر درباره یک مقام اخراج شده پاره کرد. قاضی نوشت که ماسک «به وضوح قصد داشت» این مقام را وادار کند که احساس «ترس» کند. قاضی ویلیام فیتزپاتریک با سخنان مقامات فدرال در مورد اخراج مری کومانز، مدیر مالی FEMA، مخالفت کرد. یک قاضی فدرال، ایلان ماسک را به دلیل بازنشر عکس یکی از مقامات سابق اداره اضطراری فدرال و متهم کردن او به رفتار \"جنایتکارانه\"، پاره کرد. ویلیام فیتزپاتریک، قاضی فدرال، در حکمی که روز سه‌شنبه منتشر شد، نوشت: «این واقعیت که آقای ماسک تصویری از خانم کومانز را برای میلیون‌ها دنبال‌کننده‌اش منتشر کرد در حالی که به دروغ خدمات دولتی او را یک «اقدام مجرمانه» توصیف می‌کرد. فیتزپاتریک در حکمی هشت صفحه‌ای تاول‌کننده، آنچه را که به‌عنوان صدمه به شهرت مری کومانس، کارمند قدیمی دولت فدرال که در فوریه 2025 از سمت خود به‌عنوان افسر ارشد مالی آژانس مدیریت اضطراری فدرال اخراج شد، پرداخت. فیتزپاتریک نوشت. فیتزپاتریک نوشت که مقامات فدرال در آن زمان می‌دانستند که متهم کردن کومانز به تلاش برای دور زدن فرمان اجرایی دونالد ترامپ، رئیس‌جمهور آمریکا که کمک مالی فدرال به سازمان‌های غیردولتی کمک به مهاجران را متوقف می‌کرد، نادرست است. فیتزپاتریک نوشت، با این وجود، ماسک و کریستی نوم، وزیر وقت DHS، در میان دیگران، اظهاراتی را بیان کردند که فیتزپاتریک نوشته است «صادرت شخصی و حرفه‌ای خانم کومانز» را به چالش می‌کشد. فیتزپاتریک نوشت: «به دلایل غیرقابل درک برای این دادگاه، مقامات تصمیم گرفتند قدرت دولت فدرال را علیه یک کارمند منحصر به فرد با سوابق بی عیب و نقص در خدمات عمومی قرار دهند. به طور خلاصه، خانم کومانز بطور حرفه ای مورد"}, {"source": "Business Insider", "title": "Yes, Grimes' new music video used AI — and lots of humans", "link": "https://www.businessinsider.com/grimes-new-music-video-accelerando-ai-artists-2026-10", "summary": "Grimes released the music video for Accelerando, which includes a long list of credits for dancers, choreographers, and makeup and hair, along with multiple AI artists. Matt Winkelmeyer/Getty Images for Coachella Grimes' new \"Accelerando\" music video includes some AI-generated elements, her representative confirmed to BI. Grimes said 70 artists and production professionals made the video and deserve credit. The video shows footage of the shoot. No AI was used to record the song or its vocals, a spokesperson for the singer said. Grimes ' fans have debating one question this week: How much — if any — AI did the pop artist use in her new music video? \"Are we tripping or does this look like AI CGI for you too?\" a Redditor posted on a subreddit dedicated to the singer, whose real name is Claire Boucher. Several people were quick to point to the music video's credits: \"Why do you assume AI wasn't used? AI artists are listed in the credits,\" the thread's top comment reply reads. Similar questions have been circling on X and in the video's YouTube comments. A spokesperson for Grimes told Business Insider the answer is different for the music itself and the visuals. No AI was used to record \"Accelerando\" or its vocals, the spokesperson said. The video includes \"AI-generated elements\" that were selectively incorporated into a wider VFX process involving more than 70 artists and production professionals. \"Accelerando\" is a song that describes our world careening into a tech-forward, apocalyptic state. Its video puts that unease on screen. The camera circles Grimes as she moves through fantastical landscapes, including war-torn scenes and forests with mythical creatures, before landing on the singer and several dancers in a blue-screen studio. Then, a long credit sequence rolls, highlighting how many humans were involved in the creation of the music video. More than 70 professionals — makeup artists, dancers, a choreographer, and production team members — contributed to the production over two to three months, a spokesperson for Grimes told Business Insider. That includes multiple \"AI artists,\" according to the credits. To make the music video, production used AI as a \"minor complementary production tool,\" her spokesperson told Business Insider. The music video included at least three AI Artists, according to the credits. Grimes/YouTube \"Reducing months of work by such a talented group of creatives to a minor complementary production tool that still required substanti", "date_str": "2026-10-13T19:49:09+00:00", "hash": "805f627ba0605b4d", "title_fa": "بله، موزیک ویدیوی جدید گریمز از هوش مصنوعی و انسان های زیادی استفاده کرد", "summary_fa": "گرایمز موزیک ویدیو Accelerando را منتشر کرد که شامل فهرست بلندبالایی از آهنگ‌ها برای رقصندگان، طراحان رقص، آرایش و مو، همراه با چندین هنرمند هوش مصنوعی است. نماینده او به BI تایید کرد که مت وینکلمایر/گتی ایماژ برای موزیک ویدئوی جدید \"Accelerando\" کواچلا گریمز شامل برخی از عناصر تولید شده توسط هوش مصنوعی است. گرایمز گفت 70 هنرمند و متخصص تولید این ویدئو را ساخته اند و شایسته اعتبار هستند. این ویدئو تصاویری از تیراندازی را نشان می دهد. سخنگوی این خواننده گفت که از هوش مصنوعی برای ضبط آهنگ یا آواز آن استفاده نشده است. طرفداران گرایمز این هفته در مورد یک سوال بحث می کنند: هنرمند پاپ در موزیک ویدیوی جدیدش از چه میزان – در صورت وجود – از هوش مصنوعی استفاده کرده است؟ \"آیا ما در حال زمین خوردن هستیم یا این برای شما هم شبیه AI CGI است؟\" یک Redditor در subreddit اختصاص داده شده به خواننده، که نام اصلی Claire Boucher است، ارسال کرد. چند نفر به سرعت به تیتراژ این موزیک ویدیو اشاره کردند: \"چرا فکر می کنید از هوش مصنوعی استفاده نشده است؟ هنرمندان هوش مصنوعی در تیتراژ فهرست شده‌اند.\" در پاسخ نظر برتر این رشته آمده است. سوالات مشابهی در X و نظرات YouTube در این ویدئو مطرح شده است. سخنگوی گریمز به Business Insider گفت که پاسخ در مورد خود موسیقی و جلوه‌های بصری متفاوت است. از هوش مصنوعی برای ضبط \"Accelerando\" یا صدای آن استفاده نشده است. این ویدئو شامل \"عناصر تولید شده توسط هوش مصنوعی\" است که به طور انتخابی در ی  are outside of the home need to check in once every three months (more on that below) to maintain access. You're also limited to three active streams at a time, so six people can't be watching on six separate devices at once. Regularly reset your YouTube TV 90-day home area allowance If you travel frequently or are part of family sharing based anywhere besides your home, make sure you launch YouTube TV whenever you are in the account's home area. YouTube TV requires all users to check in every 90 days to avoid losing access when away from your home area. (For baseball fans, MLB imposes viewing restrictions after just 30 days.) If you get in the habit of resetting your 90-day window, you're less likely to find yourself locked out when you're on the road. Create custom multiviews to monitor multiple games or content types at once YouTube TV has pre-built multiviews that show you three or four channels at once these are often either several games across a single sport or a combination of sports channels. Earlier this year, the platform launched customizable multiview , which allows you to select up to four channels across content categories. This means you can choose the specific games you want or mix and match sports with news, TV shows, and movies so that everyone in your household can be entertained. From any livestream, press the down button and select Multiview Your multiview to choose up to four channels. Use catch up through key plays to get curated highlights before syncing with live action YouTube TV is heavy on features benefiting sports fans. If you can't begin a broadcast when a game starts, the platform offers you several options when you launch the stream: Start from the beginning, join live, or catch up to live through key plays. The latter shows ", "date_str": "2026-10-14T14:00:00+00:00", "hash": "601c95688dfaf612", "title_fa": "10 هک که هر کاربر تلویزیون YouTube باید بداند", "summary_fa": "YouTube TV یکی از چندین سرویس پخش زنده برای تلویزیون زنده است و انتخاب خوبی برای طرفداران ورزش است که می‌خواهند هر مسابقه را از لیگ‌های مورد علاقه خود تماشا و ضبط کنند. اگر YouTube TV پلتفرم انتخابی شماست، در اینجا نکات و ترفندهایی برای بهینه سازی تجربه شما وجود دارد. اشتراک‌گذاری خانواده را برای توصیه‌ها و محدودیت‌های فضای ذخیره‌سازی جداگانه تنظیم کنید اگر شما و اعضای خانواده‌تان سلیقه‌های پخش جریانی بسیار متفاوتی دارید، می‌توانید نمایه‌های منحصربه‌فردی برای هر فرد ایجاد کنید تا از تأثیرگذاری توصیه‌های یکی روی دیگری جلوگیری کنید و کتابخانه‌های DVR را جدا کنید. یک اشتراک را می توان با پنج عضو دیگر خانواده به اشتراک گذاشت، که از نظر فنی باید در همان خانه زندگی کنند، و کسانی که خارج از خانه هستند باید هر سه ماه یک بار (در مورد آن در زیر بیشتر) بررسی کنند تا دسترسی داشته باشند. شما همچنین محدود به سه جریان فعال در یک زمان هستید، بنابراین شش نفر نمی توانند همزمان در شش دستگاه جداگانه تماشا کنند. به طور منظم کمک هزینه 90 روزه منطقه خانه YouTube TV خود را بازنشانی کنید اگر مکرراً سفر می‌کنید یا بخشی از اشتراک‌گذاری خانواده در هر جایی غیر از خانه خود هستید، مطمئن شوید که YouTube TV را هر زمان که در منطقه اصلی حساب هستید راه‌اندازی کنید. YouTube TV از همه کاربران می‌خواهد که هر 90 روز یک‌بار بررسی کنند تا وقتی از محل زندگی خود دور هستند، دسترسی خود را از دست ندهند. (برای طرفداران بیسبال، MLB پس از 30 روز محدودیت‌های تماشا را اعمال می‌کند.) اگر عادت دارید پنجره 90 روزه خود را بازنشانی کنید، احتمال کمتری وجود دارد که وقتی در جاده هستید خود را قفل کنید. چند بازدید سفارشی ایجاد کنید تا چندین بازی یا انواع محتوا را به‌طور هم‌زمان بررسی کنید YouTube TV دارای چند بازدید"}, {"source": "Lifehacker", "title": "The AirPods Max 2 Are $120 Off Right Now", "link": "https://lifehacker.com/tech/apple-airpods-max-2-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Apple s latest flagship headphones, the AirPods Max 2 , are currently $429 (down from $549.99) on Amazon taking $120 off every available color and bringing them within $3 , "link": "https://lifehacker.com/health/fitbit-edge-vs-charge-6?utm_medium=RSS", "summary": "We may earn a commission from links on this page. The Fitbit brand has long been defined by fitness trackers with tiny screens, yet it's been three years since it released a new one. Now that the Fitbit Edge has been announced (and pre-orders have opened ), longtime Fitbit users are probably wondering how it compares to the last Fitbit release with a screen, the Charge 6 . The design is the first clear difference: The Edge fits in perfectly between the screenless Fitbit Air and the smooth, curved screen of the Pixel Watch . It runs on the same operating system as the Fitbit Air, which is slightly different from the OS that runs on Pixel watches. Like other Fitbits, the Edge pairs with both iPhones and Android devices. Now, let's look at what Google has added since the Charge 6 and what it took away. Google Fitbit Edge - Activity Tracker - Pyrite/Olive - Small Large Band $179.99 at Amazon Get Deal Get Deal $179.99 at Amazon The Fitbit Edge has a real side button I just unboxed the Fitbit Edge that Google sent me to review, and can confirm: There is a physical button on the right side of the casing. It makes an audible click when you press it in, even when the device is turned off. The Charge 6 has a \"button\" that is just a haptic nub squeeze it, and if you're lucky it might recognize your touch and buzz in response. (Sadly, I found it often didn't work.) The Fitbit Edge has an altimeter and an allegedly better GPS chipset The altimeter is a brand-new bit of hardware in the Fitbit Edge. You have to go back to the Charge 4 to find a Fitbit tracker with an altimeter. This is the sensor that tells you your altitude and enables a measurement of how many \"floors\" you have climbed throughout the day. It also allows for more accurate tracking of hills on your hikes and hilly runs. The Charge 6 and the Edge both have GPS capabilities, allowing the device to know where you are in to mention take FaceTime calls, play music, check the weather, etc. And, since it's an iPad, it's inherently more versatile than a device made as a smart hub. Would you be better off buying one of Apple's tablets with a stand, and calling a day? The short answer: maybe, but not necessarily. After thinking it through, it might not make sense for everyone to splurge on the iPad in this scenario. Feature crossover between the HomeView and iPad Despite being a new product, there's a lot of crossover between the HomeView and your average iPad. They both support FaceTime, and both place the camera along the top bezel at least, if you have one of Apple's modern iPads. (For years, the company put the camera along the short side of the iPad, which meant it was always off-center for landscape video calls.) They both run the Home app, which means both can control your compatible smart devices. You can access Apple Music on both devices, as well as the Messages app. To that point, they both run some of the same first and third-party apps, including Calendar, Weather, Podcasts, and Find My, but it's a bit too early to know the full list of compatible apps. That said, Apple told The Verge that any app that works with CarPlay and supports audio and video streaming will appear on your HomeView if you have it on your iPhone or iPad. Both devices also come with Safari. That's obvious on the iPad, but it's a welcome addition on the HomeView. I'm not seeing much about how Safari works on HomeView, however, other than the fact you can tap \"Start Cooking\" on a recipe you find in the browser to see the steps in a \"streamlined format.\" While you can do many things on HomeView with simple gestures and voice commands, Apple also includes an on-screen keyboard here, so the iPad isn't the only device of the pair you can type on. Depending on the iPad, HomeView might actually be on-par power-wise, as well", "date_str": "2026-10-13T20:00:00+00:00", "hash": "4b30020596919cf4", "title_fa": "آیا باید HomeView جدید اپل را بخرید یا آیپد کافی است؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. هاب هوشمند HomeView جدید اپل سرگرم کننده است. به نظر می رسد تلاقی بین iMac G4 و Apple Watch باشد، به خصوص اگر یکی از پایه ها را انتخاب کنید که احتمالاً باید انجام دهید، زیرا گزینه نصب شده روی دیوار نیاز به خرید سخت افزار جداگانه دارد. اگر بیش از یک کاربر اپل در خانه دارید، مطمئناً یک محصول وسوسه انگیز است. اما به همان اندازه که HomeView شیک به نظر می رسد، نمی توانم از خود بپرسم: آیا واقعاً این تصمیم بهتر از یک iPad روی پایه است؟ از این گذشته، از قبل می‌توانید دستگاه‌های هوشمند را از برنامه Home در iPad خود کنترل کنید، به غیر از تماس‌های FaceTime، پخش موسیقی، بررسی آب و هوا و غیره. آیا بهتر است یکی از تبلت های اپل را با پایه بخرید و یک روز تماس بگیرید؟ پاسخ کوتاه: شاید، اما نه لزوما. After thinking it through, it might not make sense for everyone to splurge on the iPad in this scenario. ویژگی متقاطع بین HomeView و iPad علیرغم اینکه یک محصول جدید است، بین HomeView و iPad معمولی شما تداخل زیادی وجود دارد. They both support FaceTime, and both place the camera along the top bezel at least, if you have one of Apple's modern iPads. (برای سال‌ها، این شرکت دوربین را در امتداد سمت کوتاه آی‌پد قرار می‌داد، به این معنی که برای تماس‌های ویدیویی منظره همیشه خارج از مرکز بود.) هر دو برنامه Home را اجرا می‌کنند، به این معنی که هر دو می‌توانند دستگاه‌های هوشمند سازگار شما را کنترل کنند. شما می توانید در هر دو دستگاه و همچنین اپلیکیشن Messages به Apple Music دسترسی داشته باشید. تا آن مرحله، هر دوی آن‌ها برخی از برنامه‌های شخص اول و شخص ثالث مشابه، از جمله تقویم،"}, {"source": "Lifehacker", "title": "This Ecovacs Robot Lawn Mower Is 37% Off Right Now", "link": "https://lifehacker.com/tech/ecovacs-goat-lidar-robot-lawn-mower-sale-october-2026?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Deal pricing and availability subject to change after time of publication. Although October Prime Day is officially over, some significant de s on this page. Google announced the Fitbit Edge earlier this week, making it the company's first Fitbit with a screen since the Charge 6 was released in 2023. Pre-orders are open now, and the devices are expected to start shipping on Oct. 27. The Fitbit Edge ($179.99) has features and a price that are right in between the Fitbit Air , which has no screen and retails for $99.99, and the Pixel Watch 5 , a full-featured smartwatch that starts at $399.99. You can pre-order the Fitbit Edge here . It comes in black with a black band, silver with a \"fog\" (gray) band, \"champagne gold\" with a salmon-pink band, and a metallic color they're calling \"satin pyrite\" with an olive green band. There's also a Steph Curry edition for $219.99 in gray and orange. The standard packages come with two bands, a small/medium that fits wrists 130 to 170 millimeters around, and a medium/large for wrists 170 to 210 millimeters. There are a few other bands available for an extra fee: an \"active sport\" band with larger holes for ventilation ($39.99), a magnetic band ($49.99), and a band with metal links ($149.99). What's new in the Fitbit Edge Unlike the screenless Fitbit Air, the Fitbit Edge adds its own GPS chipset, so you can track distance without bringing your phone, and an altimeter to detect elevation changes like hills. The latter also enables a \"floors climbed\" metric each day. The Fitbit Edge also has an ECG app, a morning report, and can control music playing on your phone no matter what app is playing it. If you're upgrading from a Fitbit Charge 6, the Edge adds an altimeter and a morning report, and you'll be glad to see the music controls work for any music app, not just Youtube Music. The Edge is missing some features, though: With no NFC, it can't do tap-to-pay with Google Wallet. The Edge also does not have Google Maps directions at launch, although Google says these are coming soon. The EDA scan and stress tracking are also gone. (Personally, I'm glad about that. Stress tracking isn't accurate enough to be useful .)", "date_str": "2026-10-13T18:30:00+00:00", "hash": "fe204e52beba39b4", "title_fa": "نحوه پیش خرید Fitbit Edge جدید (و چرا ممکن است بخواهید)", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. گوگل در اوایل این هفته Fitbit Edge را معرفی کرد و آن را به اولین فیت بیت با صفحه نمایش این شرکت از زمان عرضه Charge 6 در سال 2023 تبدیل کرد. پیش‌سفارش‌ها اکنون باز هستند و انتظار می‌رود که دستگاه‌ها از 27 اکتبر ارسال شوند. Watch 5، یک ساعت هوشمند با امکانات کامل که از 399.99 دلار شروع می شود. می توانید Fitbit Edge را از اینجا پیش خرید کنید. این رنگ مشکی با نوار مشکی، نقره ای با نوار \"مه\" (خاکستری)، \"طلایی شامپاین\" با نوار صورتی مایل به سالمون، و رنگ متالیک \"ساتن پیریت\" با نوار سبز زیتونی عرضه می شود. همچنین نسخه Steph Curry با قیمت 219.99 دلار در رنگ‌های خاکستری و نارنجی موجود است. بسته‌های استاندارد دارای دو باند هستند، یک نوار کوچک/متوسط ​​که برای مچ‌های 130 تا 170 میلی‌متر مناسب است، و یک باند متوسط/بزرگ برای مچ‌های 170 تا 210 میلی‌متر. چند باند دیگر با هزینه اضافی در دسترس هستند: یک باند \"ورزش فعال\" با سوراخ های بزرگتر برای تهویه (39.99 دلار)، یک نوار مغناطیسی (49.99 دلار)، و یک نوار با پیوندهای فلزی (149.99 دلار). چیزهای جدید در Fitbit Edge برخلاف Fitbit Air بدون صفحه نمایش، Fitbit Edge چیپست GPS خود را اضافه می کند، بنابراین می توانید مسافت را بدون همراه داشتن تلفن خود ردیابی کنید و ارتفاع سنج برای تشخیص تغییرات ارتفاع مانند تپه ها. دومی همچنین یک متریک \"طبقه بالا رفته\" را هر روز امکان پذیر می کند. Fitbit Edge همچنین دارای یک برنامه ECG، یک گزارش صبحگاهی است و می‌تواند پخش موسیقی روی گوشی شما را بدون توجه به برنامه‌ای که آن را پخش می‌کند کنترل کند. اگر از Fitbit Charge 6 ارتقا می‌دهید، Edge ارتفاع سنج و گزارش صبحگاهی را اضافه می‌کند، و خوشحال خواهید شد که کنترل‌های موسیقی"}, {"source": "Lifehacker", "title": "Garmin Just Launched a Luxury Smartwatch With a Price to Match", "link": "https://lifehacker.com/health/garmin-new-luxury-smartwatch-marq-gen-3?utm_medium=RSS", "summary": "We may earn a commission from links on this page. Yesterday the MARQ Gen 3 turned up on Garmin's support pages, and today, the company has made it official. Garmin launched its third-generation luxury smartwatch collection, a lineup of six models priced from $2,500 to $3,100 . That sure is a lot of money for a watch. Let's take a look at what exactly you get with the new Garmin MARQ Gen 3. Garmin MARQ Adventurer (Gen 3) $2,700.00 at Garmin Shop Now Shop Now $2,700.00 at Garmin What to know about the Garmin MARQ Gen 3 The new collection consists of the MARQ Athlete, Adventurer, Aviator, Commander, Golfer and Diver. Across all six, Garmin has moved to larger AMOLED displays, added LTE and satellite connectivity, expanded its mapping, and brought in its latest health and fitness features that I detail in my review of Garmin's other recent release, the Fenix 9 Pro . The hardware follows the luxury formula the MARQ line is known for. Each watch has a 47 mm Grade 5 titanium case, a sapphire crystal lens, and a ceramic bezel inlay. Each is 15 mm thick and carries a 1.4-inch AMOLED display, up from 1.2 inches on the previous generation. At the bottom of the range, the MARQ Athlete is the entry point at $2,500. It comes on a silicone strap with VO2 max markings on the bezel, and includes Garmin's full collection of running and training features. The MARQ Adventurer costs $2,700 and pairs an Italian leather strap with a compass bezel. This one is aimed at hiking, navigation and climbing, and includes preloaded ClimbPro information. And so on: The remaining four models are each built around a specific pursuit, as MARQ variants have been since the line debuted. The MARQ Aviator is the flight-focused model, the MARQ Commander is the tactical one, the MARQ Golfer is built for the course, and the MARQ Diver is the one for the water. Garmin's pricing and strap details for these four sit between the Athlete's $2,500 and the $3,100 top of the range. What else is new about the Garmin MARQ Gen 3? In terms of software updates, the biggest addition is embedded inReach connectivity. All six watches support LTE calling, messaging and location sharing without a phone nearby, along with satellite messaging and emergency SOS through Garmin Response. Note: These services require a separate inReach subscription . Garmin has also added a speaker, a microphone, and an LED flashlight. Other upgrades include the ECG app in supported regions, newer health and recovery metrics, and worldwid", "date_str": "2026-10-13T18:00:00+00:00", "hash": "8573b9a4af92b1da", "title_fa": "گارمین به تازگی یک ساعت هوشمند لوکس با قیمت مناسب عرضه کرده است", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. دیروز MARQ Gen 3 در صفحات پشتیبانی Garmin ظاهر شد و امروز، این شرکت آن را رسمی کرده است. گارمین مجموعه نسل سوم ساعت‌های هوشمند لوکس خود را راه‌اندازی کرد، مجموعه‌ای متشکل از شش مدل با قیمت‌های بین 2500 تا 3100 دلار. مطمئناً برای یک ساعت پول زیادی است. بیایید نگاهی بیندازیم که دقیقاً با Garmin MARQ Gen 3 جدید چه چیزی به دست می آورید. Garmin MARQ Adventurer (نسل 3) 2,700.00 دلار در Garmin فروشگاه اکنون خرید کنید 2,700.00 دلار در Garmin آنچه درباره Garmin MARQ Gen 3 باید بدانید مجموعه جدید شامل MARQ Athlete، Adventurer، Aviator، Commander، گلف باز و غواص است. در هر شش مورد، گارمین به سمت نمایشگرهای AMOLED بزرگتر حرکت کرده، اتصال LTE و ماهواره را اضافه کرده، نقشه برداری خود را گسترش داده و آخرین ویژگی های سلامتی و تناسب اندام خود را ارائه کرده است که در بررسی دیگر نسخه اخیر گارمین، Fenix ​​9 Pro جزئیات را توضیح می دهم. سخت افزار از فرمول لوکسی پیروی می کند که خط MARQ به آن معروف است. هر ساعت دارای یک قاب تیتانیومی 47 میلی‌متری درجه 5، یک لنز کریستالی یاقوت کبود و یک قاب سرامیکی است. هر کدام 15 میلی متر ضخامت دارند و دارای صفحه نمایش 1.4 اینچی AMOLED هستند که نسبت به نسل قبلی 1.2 اینچ افزایش یافته است. در پایین این محدوده، MARQ Athlete نقطه ورود با 2500 دلار است. این بند بر روی یک بند سیلیکونی با علامت‌های VO2 max روی قاب قرار دارد و مجموعه کاملی از ویژگی‌های دویدن و تمرین گارمین را شامل می‌شود. قیمت MARQ Adventurer 2700 دلار است و یک بند چرمی ایتالیایی را با قاب قطب نما جفت می کند. این یکی با هدف پیاده روی، ناوبری و کوهنوردی است و شامل اطلاعات ClimbPro"}, {"source": "Lifehacker", "title": "Which Should You Believe After a Race, Your Official Distance or Your Watch?", "link": "https://lifehacker.com/health/which-should-you-believe-after-a-race-official-time-or-watch?utm_medium=RSS", "summary": "We may earn a commission from links on this page. You just finished running a race, but your watch disagrees with the official distance and timing. Which should you trust? While race organizers can screw up their distance or timing, they usually don't. Let's look at how races are measured and why they may disagree with your watch which happens more often than you might realize. How races measure your time Before we compare a watch time to an official race time, we need to know what kind of official race time we're looking at. There are two different numbers you might see from a race: gun time and chip time. They may differ from each other and from your watch. Here's where each comes from: Chip time Chip time , also sometimes called net time , is the time from when you personally cross the start line until you personally cross the finish line. This is the time that matters for most of us. Chips measure your personal start and finish because big races often have a crowd at the start line. If you re running a big-city marathon, it could be 10 minutes or more of waiting and then slowly moseying forward with the crowd before you are able to cross the start line. In that case, your marathon could have a 4:40:00 gun time and a 4:30:00 chip time. The chip in the name refers to a computer chip that is usually embedded in your racing bib (the numbers you pin to your shirt). The timing system registers a data point whenever you cross a timing mat on the ground. There is a timing mat at the start and another at the end of the race. (Longer races like marathons and half-marathons may also have timing mats at a few checkpoints along the way, such as the halfway point.) Gun time Gun time is the time from when the race starts (often signaled by a starting pistol, hence gun ) until you cross the finish line. This is also sometimes called clock time . If you are trying to actually win the race, you may need to care about gun time. Sometimes the rules specify that the person who wins the race is the person who crosses the finish line first, regardless of when they crossed the start line. If you are an elite athlete who is in the running to win a big race, you ll generally work out arrangements with the race organizer to be at the actual start line when the race starts, so that the gun time accurately reflects how long it took you to run the race. But for the rest of us, gun time doesn t matter at all. The exception is if you are in a very small local race that doesn t use ch", "date_str": "2026-10-13T17:30:00+00:00", "hash": "44cf032ea4d67b2a", "title_fa": "بعد از مسابقه کدامیک را باید باور کنید، مسافت رسمی یا ساعتتان؟", "summary_fa": "ممکن است از پیوندهای موجود در این صفحه کمیسیون دریافت کنیم. You just finished running a race, but your watch disagrees with the official distance and timing. به کدام باید اعتماد کرد؟ While race organizers can screw up their distance or timing, they usually don't. Let's look at how races are measured and why they may disagree with your watch which happens more often than you might realize. چگونه مسابقات زمان شما را اندازه گیری می کنند قبل از اینکه زمان تماشا را با زمان رسمی مسابقه مقایسه کنیم، باید بدانیم که به چه نوع زمان رسمی مسابقه نگاه می کنیم. دو عدد مختلف وجود دارد که ممکن است از یک مسابقه ببینید: زمان تفنگ و زمان تراشه. آنها ممکن است با یکدیگر و با ساعت شما متفاوت باشند. هر کدام از کجا می آیند: زمان تراشه زمان تراشه، که گاهی اوقات زمان خالص نیز نامیده می شود، زمانی است از زمانی که شما شخصاً از خط شروع عبور می کنید تا زمانی که شخصاً از خط پایان عبور می کنید. این زمانی است که برای       media: [{"source": "Billboard", "title": "Rachel Chinouriri on Owning Her Pop Moment, Supporting Olivia Rodrigo & Bringing ‘More Sparkles’ Into Her Life", "link": "https://www.billboard.com/music/features/rachel-chinouriri-new-album-olivia-rodrigo-interview-1236359821/", "summary": "Maybe it’s the self-assurance of a Scorpio who loves her craft deeply and fiercely, or the perspective that comes with being, at 27, something of a veteran in the U.K. music industry. Either way, Rachel Chinouriri moves with the confidence of someone who knows herself completely. “I’ve changed so much in the past few years, and that’s actually a really special thing,” she tells Billboard U.K. “I feel like a totally different person to who I was at 22. It is wild!” It is a Monday afternoon in late September, and we are perched on the balcony of a London wine bar, where Chinouriri is wrapping up an intensive run of press commitments. The only trace left of a content shoot earlier in the day is a smidge of smokey eye makeup, while a pair of black, ankle-shattering Jimmy Choo stilettos have been replaced with khaki trainers. The alcohol-free margaritas are flowing; the sun is shining on Chinouriri and her eyes are bright. Chinouriri’s attitude to the transformative few years that birthed her incandescent new LP, I Think I Spoke Too Soon (out Oct. 16 via Parlophone) is indicative of someone who has remained resolute throughout a career that has progressed in fits and starts. As she prepares for the release of her second album, which contains her most sophisticated and expansive music yet, she’s in prime position to juggernaut towards main pop girl status – though this time around, there’s a sense that the pieces are finally falling into place. Take the British-Zimbabwean artist’s star turn at Olivia Rodrigo’s Daisy Chain Fieldss festival in Irvine, California, at the end of August. Performing in a metallic silver one-piece and channeling the sleek glamour of Kylie’s Fever era, she delivered a high-octane set that made clear why Rodrigo had singled her out for the event. Or there’s the fact that Gracie Abrams is the latest pop superstar to offer Chinouriri an arena tour support slot, following Sabrina Carpenter two years ago. More recently, she made her Saturday Night Live U.K. debut , while her marketing nous and command of Stan Twitter have cultivated a devoted, international online following, one that has translated into a streaming audience that skews heavily North American . Sonically, I Think I Spoke Too Soon reflects that momentum. Where Chinouriri’s 2024 full-length debut What a Devastating Turn of Events was limned with spoken-word interludes and other traces of the intimate, lo-fi, indie-leaning EPs on which the singer made her name, her new album soun", "date_str": "2026-10-14T14:25:28+00:00", "hash": "58cb9cc082174573", "title_fa": "ریچل چینوریری در مورد مالکیت لحظه پاپ خود، حمایت از اولیویا رودریگو و آوردن \"درخشش های بیشتر\" به زندگی او", "summary_fa": "شاید این اعتماد به نفس عقربی باشد که عمیقاً و شدیداً هنر خود را دوست دارد، یا دیدگاهی که در 27 سالگی به وجود می‌آید که چیزی شبیه یک کهنه کار در صنعت موسیقی بریتانیا است. در هر صورت، راشل چینوریری با اعتماد به نفس کسی که خود را کاملاً می شناسد حرکت می کند. او به Billboard U.K می‌گوید: «در چند سال گذشته خیلی تغییر کرده‌ام، و این واقعاً یک چیز خاص است. من احساس می‌کنم فردی کاملاً متفاوت با آنچه در ۲۲ سالگی بودم هستم. وحشی است!» بعدازظهر دوشنبه در اواخر سپتامبر است، و ما در بالکن یک بار شراب لندن نشسته‌ایم، جایی که چینوریری در حال پایان دادن به یک دوره فشرده از تعهدات مطبوعاتی است. تنها اثری که از یک فیلمبرداری محتوا در اوایل روز باقی مانده، کمی آرایش چشم دودی است، در حالی که یک جفت کفش رکابی سیاه و مچ پا شکسته جیمی چو با مربی های خاکی جایگزین شده است. مارگاریتاهای بدون الکل در حال جاری شدن هستند. خورشید بر چینوریری می تابد و چشمانش روشن است. نگرش چینوریری به چند سال متحول کننده که LP رشته‌ای جدیدش را به وجود آورد، فکر می‌کنم خیلی زود صحبت کردم (از 16 اکتبر از طریق Parlophone منتشر شد) نشان‌دهنده کسی است که در طول حرفه‌ای که در زمینه‌های مناسب و شروع پیشرفت کرده مصمم باقی مانده است. همانطور که او برای انتشار دومین آلبوم خود آماده می شود، که حاوی پیچیده ترین و گسترده ترین موسیقی او است، او در موقعیتی عالی قرار دارد که به سمت جایگاه اصلی دختر پاپ حرکت کند - هرچند این بار، این حس وجود دارد که قطعات بالاخره در جای خود قرار می گیرند. در جشنواره Daisy Chain Fieldss Olivia Rodrigo's Olivia Rodrigo's Daisy Chain Fieldss در ایروین، کالیفرنیا، در پایان ماه اوت، ستاره این هنرمند بریتانیایی زیمبابوه ای"}, {"source": "Billboard", "title": "Taylor Swift’s ‘Patient Zero’ Deconstructed: How the Hot 100 No. 1 Reflects — and Differs From — Her Catalog of Hits", "link": "https://www.billboard.com/music/chart-beat/taylor-swift-patient-zero-lyrics-groove-deconstructed-1236360200/", "summary": "Part of what makes Taylor Swift ’s “Patient Zero” sound both instantly familiar and a little unexpected is how it brings together stylistic threads that the superstar singer-songwriter has explored separately throughout her career. The reigning Billboard Hot 100 No. 1’s polished electropop foundation connects with 2020s Swift hits such as “Anti-Hero,” “Cruel Summer,” “Fortnight” (featuring Post Malone) and “The Fate of Ophelia,” while its hip-hop-influenced rhythmic feel recalls another side of her catalog heard in earlier smashes such as “Blank Space,” “Bad Blood” and “Look What You Made Me Do.” Related Taylor Swift’s ‘Patient Zero’ Spends Second Week at No. 1 on Billboard Hot 100 Taylor Swift s Songwriting and Production Analyzed: 13 Secrets to Her Chart Success Pop s on Top, But Other Genres Have Narrowed the Gap: State of the Hot 100 s Top 10 at Midyear 2026 Then there’s the most distinctive sonic calling card in “Patient Zero”: its Celtic-leaning fiddle hook, tapping into the folk side of Swift’s music heard more prominently on a song such as “Willow” from Evermore . None of those ingredients is entirely new to Swift. What feels fresh is hearing them together. Among Swift’s Hot 100 top 10s analyzed by Hit Songs Deconstructed ( 74 in all), “Patient Zero” is the only one that brings electropop, hip-hop and folk/Celtic influences together in the same track. The result gives longtime listeners recognizable pieces of Swift’s musical world while recombining them into a sonic identity that feels distinctly its own. Below are three other key sonic factors that have helped “Patient Zero” — which Swift cowrote and coproduced with Max Martin and Shellback — become her latest No. 1. It Has a Deceptively Simple Chorus In a hit song, the chorus is typically the catchiest and most memorable section, thanks in large part to simplicity and repetition in the vocal melody. “Patient Zero” takes both especially far, but does so with purpose, and that’s a big part of what makes it work so well. The song’s simplicity is evident both within and across lines. Long stretches of each line are built from repeated notes on the same pitch, with subtle melodic variation toward the end, while highly similar melodic shapes recur throughout the section. Together with the recurring rhythm and regular chord changes that help punctuate key vocal stresses, this creates an infectious, easy-to-lock-into, roll-off-the-tongue flow. But that simplicity serves another important purpose: It give", "date_str": "2026-10-14T14:22:06+00:00", "hash": "0c95f3b32d765a1f", "title_fa": "«بیمار صفر» تیلور سوئیفت ساختارشکن شد: چگونه 100 داغ شماره 1 منعکس می کند - و با کاتالوگ بازدیدهایش متفاوت است", "summary_fa": "بخشی از چیزی که باعث می‌شود آهنگ «بیمار صفر» تیلور سوئیفت بلافاصله آشنا و کمی غیرمنتظره به نظر برسد، این است که چگونه رشته‌های سبکی را گرد هم می‌آورد که این خواننده و ترانه‌سرا به طور جداگانه در طول زندگی حرفه‌ای خود بررسی کرده است. Billboard Hot 100 No. پایه الکتروپاپ صیقلی 1 با آهنگ‌های سوئیفت دهه 2020 مانند «ضد قهرمان»، «تابستان بی‌رحمانه»، «فورنایت» (با حضور پست مالون) و «سرنوشت اوفلیا» مرتبط است، در حالی که حس ریتمیک تحت تأثیر هیپ‌هاپ آن، جنبه دیگری از کاتالوگ‌های قبلی‌اش را به یاد می‌آورد. خون» و «ببین چه کاری انجام دادی». «بیمار صفر» مربوط به تیلور سویفت، هفته دوم را در رتبه اول سپری کرد. 1 در بیلبورد داغ 100 آهنگسازی و تولید تیلور سویفت تجزیه و تحلیل شد: 13 راز موفقیت در نمودار او پاپ ها در صدر هستند، اما ژانرهای دیگر شکاف را کاهش داده اند: وضعیت 10 فیلم داغ 100 در اواسط سال 2026 پس از آن \"بزرگترین کارت\" وجود دارد. قلاب کمانچه‌ای که متمایل به سلتیک است، با ضربه زدن به جنبه‌های محلی موسیقی سوئیفت که در آهنگی مانند «Willow» از Evermore بیشتر شنیده می‌شود. هیچ یک از این مواد برای سوئیفت کاملاً جدید نیستند. چیزی که احساس تازگی می کند شنیدن آنها در کنار هم است. در میان 100 آهنگ داغ سوئیفت که توسط Hit Songs Deconstructed (در مجموع 74 مورد آنالیز شده است)، \"Patient Zero\" تنها آهنگی است که تأثیرات الکتروپاپ، هیپ هاپ و فولکلور/سلتیک را در یک آهنگ گرد هم می آورد. نتیجه به شنوندگان قدیمی قطعات قابل‌شناختی از دنیای موسیقی سوئیفت می‌دهد و در عین حال آن‌ها را در یک هویت صوتی ترکیب می‌کند که کاملاً خاص خود است. در زیر سه فاکتور صوتی کلیدی دیگر وجود دارد که به «بیمار صفر» کمک کرده است - که سوئیفت به همراه مکس مارتین و شل بک"}, {"source": "Billboard", "title": "MGK Has a Pointed, NSFW Response to Fake Post About Him ‘Fumbling’ Relationship With Ex-Megan Fox", "link": "https://www.billboard.com/culture/lifestyle/mgk-response-fake-post-fumbling-relationship-megan-fox-1236360502/", "summary": "MGK would like a word with whoever posed as him on X recently to share a claim that he s forever beating himself up about fumbling his relationship with ex Megan Fox . Actually he has nine words for that alleged mythmaker: that tweet is faker than a pair of t s . Related Kelly Clarkson Riley Green Have a Double-Steal Showdown After Kayleigh Mathews Lillie Kolich Smash Girl Crush on The Voice A Timeline of Machine Gun Kelly Megan Fox’s Relationship Maren Morris, Flavor Flav, Maggie Baird More Speak Out Against Shane Gillis SNL Monologue: It s Actually Dangerous for Women That s what the rapper (born Colson Baker) posted on X on Tuesday (Oct. 12) alongside a scree
