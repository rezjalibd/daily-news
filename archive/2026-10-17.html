یم.\" صادقانه بگویم، من آن را الهام‌بخش می‌دانستم که واقعاً به مشتریان خود ثابت کنیم که اشتباه می‌کنند – اینکه سهام خصوصی همیشه بد نیست.» کریستین پیندا، مدیرعامل و یکی از بنیانگذاران، و جاکوبو آکرمن، شریک عملیاتی ارشد، عملیات روزانه زنجیره تاکو را اداره می کنند. دالی فایبیشف برای BI Colin Welch، مدیر عامل و رئیس نیویورک در TSG Consumer، گفت که واکنش‌های منفی در میان برخی نشان"}, {"source": "Business Insider", "title": "I model my day on pro athletes. Here's what that means for my schedule, my team's, and my approach to 996 culture.", "link": "https://www.businessinsider.com/ceo-daily-routine-pro-athlete-workday-structure-996-hours-2026-10", "summary": "Jagda told Business Insider 996 culture misses the point. Courtesy of Proximity Works Hardik Jagda wants to function like an Olympian, and waking up at 3 a.m. helps him do that. He commits long hours to his AI-based company, but says he doesn't enforce 996 hours on his team. For Jagda, 996 misses the point. Here's how he structures his day instead. This as-told-to essay is based on a conversation with Hardik Jagda, 35, the CEO of Proximity Works, who lives in San Francisco. The following has been edited for length and clarity. In 2017, I wanted to build my own company, but I couldn't jump into it full-time because of my financial obligations at home. Instead, I'd spend the mornings and evenings outside my full-time job working on my side projects . That time was foundational for building my company, Proxmity Works, which I launched in 2019. My aim was to help broadcasters scale their live sports streaming platforms worldwide. In 2020, we started building AI infrastructure for live sports. Those years made me aware of how my body clock works. I read a lot of autobiographies from entrepreneurs and athletes to understand what allowed them to build what they achieved. I noticed athletes would talk about starting their day early to train and work, in time for rest and recovery throughout the day. I started modeling my days after this, waking up early so I could have four to five hours to build my company before work started. I still stick to this lifestyle now that I'm a full-time founder and CEO. I want to structure my day to function like an Olympian In the early stages of Proximity, I performed pretty much every role in the company. Today, I have a team of roughly 45 people, five in the US and the rest spread out globally. My cofounder is based in India. After 7 a.m., my time isn't mine anymore because I have requests coming in from employees in different time zones. I like to start the day early, so I'm protecting the first three hours as time for myself. I usually wake up between 3 a.m. and 5 a.m. Between 3 and 6 a.m., I don't touch my emails or look at messages. I use these early hours to focus on strategic decisions. There was one point, roughly two years ago, when we had to interview a lot of engineers quickly for a new project. I sat down with my talent acquisition team and found a way to redesign our recruitment workflow to take place within 72 hours. That wouldn't have been possible if I didn't give myself the three-hour morning block. Jagda tries to", "date_str": "2026-10-17T08:37:01+00:00", "hash": "a335127aa49a777a", "title_fa": "من روزم را الگوی ورزشکاران حرفه ای می کنم. در اینجا به معنای برنامه من، تیم من و رویکرد من به فرهنگ 996 است.", "summary_fa": "جاگدا به Business Insider 996 گفت که فرهنگ این نکته را از دست می دهد. Hardik Jagda می خواهد مانند یک المپیکی عمل کند و بیدار شدن در ساعت 3 صبح به او کمک می کند تا این کار را انجام دهد. او ساعت های زیادی را به شرکت مبتنی بر هوش مصنوعی خود اختصاص می دهد، اما می گوید که 996 ساعت را در تیم خود اجرا نمی کند. برای Jagda، 996 نکته را از دست می دهد. در اینجا نحوه ساختار روز خود را در عوض. این مقاله گفته شده بر اساس گفتگو با هاردیک جاگدا، 35 ساله، مدیر عامل Proximity Works، که در سانفرانسیسکو زندگی می کند، است. موارد زیر برای طول و وضوح ویرایش شده است. در سال 2017، می خواستم شرکت خودم را بسازم، اما به دلیل تعهدات مالی در خانه نتوانستم به طور تمام وقت وارد آن شوم. درعوض، صبح‌ها و شب‌ها را خارج از شغل تمام‌وقتم صرف پروژه‌های جانبی خود می‌کردم. آن زمان برای ساختن شرکت من، Proxmity Works، که در سال 2019 راه‌اندازی کردم، اساسی بود. هدف من کمک به پخش‌کنندگان این بود که پلتفرم‌های پخش زنده ورزشی خود را در سراسر جهان گسترش دهند. در سال 2020، ما شروع به ساخت زیرساخت هوش مصنوعی برای ورزش های زنده کردیم. آن سال ها باعث شد من از نحوه عملکرد ساعت بدنم آگاه شوم. من زندگینامه های زیادی از کارآفرینان و ورزشکاران خواندم تا بفهمم چه چیزی به آنها اجازه می دهد آنچه را که به دست آورده اند بسازند. متوجه شدم ورزشکاران در مورد شروع روز خود برای تمرین و کار، به موقع برای استراحت و ریکاوری در طول روز صحبت می کنند. بعد از این شروع کردم به مدلسازی روزهایم، زود بیدار شدم تا بتوانم چهار تا پنج ساعت برای ساختن شرکتم قبل از شروع کار وقت داشته باشم. اکنون که"}, {"source": "Business Insider", "title": "Kamala Harris is a Pilates girlie", "link": "https://www.businessinsider.com/kamala-harris-pilates-girlie-empowerment-strength-brat-2026-10", "summary": "Kamala Harris is aboard the Pilates train. Mario Tama/Getty Images Kamala Harris says she's loving reformer Pilates right now. The former vice president told Keke Palmer she loves how it works all the smaller muscles in her body. Harris said Pilates helps her feel empowered in her daily life. First she was Brat , now she's a Pilates girlie . \"You know what I've been doing though recently is Pilates,\" former vice president Kamala Harris told actor Keke Palmer on an episode of the \"Baby, This is Keke Palmer\" podcast, posted October 15. Harris said that, along with a walk with her husband Doug Emhoff, time to cook, and a family dinner, the workout would be part of her perfect Sunday. Harris, who is 61, has no biological children, but she helped co-parent Cole, 32, and Ella, 27, Emhoff's kids from his previous marriage. Harris said Pilates gives her \"an overall feeling of well-being\" and helps her feel empowered in her daily life. \"There's so much about empowerment that is about knowing your strength and recognizing it,\" she said. Through Pilates, which emphasizes the brain-body connection, she said she feels more connected to her physical strength. \"I'm just realizing that there are all of these muscles and areas that I have not been exercising,\" Harris said. Originally popular among dancers, models, and celebrities, Pilates has become the workout du jour. It was the most-booked workout on ClassPass globally last year, with bookings up 66% from 2024, beating both strength training and running. And luxury hotels, including some Ritz-Carlton and St Regis locations, have installed Pilates studios as a buzzy luxury amenity . Harris is in good company — celebs including Jennifer Aniston, Miley Cyrus, and Hailey Bieber have all professed to love it, too. The longevity boom might also be partially to thank for the spike in Pilates' popularity. The low-impact form of strength and mobility training uses controlled, precise movements to strengthen the core and the deep muscles that stabilize the joints . It can improve functional strength, posture, and balance — all things that keep a person mobile and independent as they age. A 2021 systematic review published in the journal Physiotherapy found that among the 1,650 participants age 60 or older, those who did Pilates had a significantly lower risk of falling, a serious risk factor for hip fracture, inactivity, and muscle loss. Harris told Palmer, who qualified as a Pilates instructor earlier this year, that she prefers", "date_str": "2026-10-17T07:37:01+00:00", "hash": "384eb89f61bff652", "title_fa": "کامالا هریس یک دختر پیلاتس است", "summary_fa": "کامالا هریس سوار قطار پیلاتس است. ماریو تاما/ گتی ایماژ کامالا هریس می گوید که در حال حاضر عاشق پیلاتس اصلاح طلب است. معاون سابق رئیس جمهور به کیک پالمر گفت که او دوست دارد که چگونه تمام عضلات کوچکتر بدن او را کار کند. هریس گفت پیلاتس به او کمک می کند در زندگی روزمره خود احساس قدرت کند. اول برات بود حالا یه دختر پیلاتس. معاون سابق رئیس جمهور کامالا هریس در یکی از اپیزودهای پادکست \"عزیزم، این کیکه پالمر است\" که در 15 اکتبر منتشر شد به بازیگر کیکه پالمر گفت: \"می دانید کاری که من اخیراً انجام داده ام پیلاتس است.\" هریس، که 61 سال دارد، فرزند بیولوژیکی ندارد، اما به کول، 32 ساله و الا، 27 ساله، فرزندان امهوف از ازدواج قبلی او کمک کرد. هریس گفت پیلاتس به او \"احساس رفاه کلی\" می دهد و به او کمک می کند در زندگی روزمره خود احساس قدرت کند. او گفت: «در مورد توانمندسازی چیزهای زیادی وجود دارد که مربوط به شناخت قدرت شما و شناخت آن است. از طریق پیلاتس، که بر ارتباط مغز و بدن تأکید دارد، او گفت که احساس می کند بیشتر به قدرت بدنی خود متصل است. هریس گفت: \"من تازه متوجه شدم که همه این عضلات و مناطقی وجود دارند که ورزش نکرده ام.\" پیلاتس که در ابتدا در میان رقصندگان، مدل ها و افراد مشهور محبوب بود، تبدیل به تمرین ورزشی شده است. این پربازدیدترین تمرین در ClassPass در سراسر جهان در سال گذشته بود، با 66 درصد افزایش نسبت به سال 2024، که هم تمرینات قدرتی و هم دویدن را شکست داد. و هتل‌های مجلل، از جمله برخی از مکان‌های Ritz-Carlton و St Regis، استودیوهای پیلاتس را به عنوان یک مرکز رفاهی لوکس و شلوغ نصب کرده‌اند. هریس در جمع خوبی است - افراد مشهوری از جمله جنیفر"}, {"source": "Business Insider", "title": "Katie Zacharia had the shortest tenure as press secretary in history. Here are the others who didn't last long.", "link": "https://www.businessinsider.com/katie-zacharia-shortest-serving-press-secretary-who-are-others-2026-10", "summary": "Katie Zacharia came under scrutiny for her legal credentials shortly after her first press briefing on Tuesday. Win McNamee/Getty Images President Donald Trump chose Katie Zacharia to serve as the new White House press secretary. After five days, a White House official said that she is \"transitioning out\" of the role. Zacharia is among three other former press secretaries with tenures lasting under two months. Katie Zacharia's first briefing as President Donald Trump's press secretary was on Tuesday. By Friday, the White House confirmed she was out. The record five-day tenure came after days of missteps by Zacharia, and amid two watchdog groups filing complaints with the State Bar of California on Wednesday, asking it to investigate whether she violated California law by calling herself a lawyer. While the longest-serving press secretary was Stephen Early, who held the post for 12 years under Franklin D. Roosevelt, only four press secretaries have lasted under two months. Here's a closer look at White House press secretaries with the shortest tenures. Katie Zacharia Katie Zacharia served as press secretary under Donald Trump for five days. Samuel Corum/Pool/FTWP Katie Zacharia made her White House press briefing debut on Tuesday and quickly came under intense scrutiny over her legal credentials. Shortly after Tuesday's briefing, she was asked which state she passed the bar exam in and replied: \" When I moved to China .\" On Thursday in an interview with right-wing provocateur Jack Posobiec , Zacharia said she took the bar exam but failed, and never retook it. Zacharia moved to China after earning her law degree in 2011, and told Posobiec she had already preregistered for the bar exam before moving to Beijing, where her husband was working at an American private equity firm. \"I didn't want to withdraw from that,\" Zacharia said of the bar exam. \"And we knew we would be moving out to China, and I was obviously incredibly distracted and overwhelmed and excited for finally being married to someone who I had been long-distance from for at least a year.\" She served as press secretary between October 12 and October 16. Stephen Early Stephen Early served as Franklin D. Roosevelt s press secretary for 12 years. He briefly served as acting press secretary under Harry S. Truman in December 1950 for 14 days. Original Caption Stephen Early is both the longest-serving press secretary in US history and the press secretary with the second-shortest tenure. He was President F", "date_str": "2026-10-16T23:55:26+00:00", "hash": "1ddcf0e7c6339f0c", "title_fa": "کت Wj9Rta — Anthony Scaramucci (@Scaramucci) October 16, 2026 اسکاراموچی همچنین به زکریا مشاوره مستقیم داد. @katiezacharia عزیز — به عنوان کارشناس برجسته جهان در دوره کوتاه تصدی کاخ سفید صحبت"}, {"source": "Business Insider", "title": "Anthropic polled 1,334 of its employees. They're more sure than most of us that AI will take over jobs.", "link": "https://www.businessinsider.com/anthropic-survey-reveals-ai-potential-impact-on-unemployment-2026-10", "summary": "Attendees chat at Anthropic s developer conference in May. Don Feria/AP Content Services for Anthropic Anthropic published new surveys comparing its staffers' sentiments to those of US workers. The AI startup's employees expect the tech to change work and the economy far more dramatically. Most Anthropic employees guessed that unemployment would top 12% in 2030. Anthropic employees believe that AI will make their labor obsolete. Most US workers don't see their jobs that way at all. The AI company published research on Friday that compares surveys with US adults against an internal poll of 1,334 Anthropic employees. Most of the Anthropic staffers said AI will handle at least 80% of their jobs by 2030, while only about 5% of the US workers felt the same. The research, titled \" The AI expectations gap, \" shows the chasm between how the employees at the AI startup feel and how other American adults feel. Anthropic workers are far more optimistic about the progress of AI capabilities, how much it's already saving time, and how fast the economy will grow. The median Anthropic employee said that by the end of 2030, they expect AI to handle 95% of the work of building a new AI model. Peter McCrory, Anthropic's chief economist, wrote on X that the views might help outsiders prepare for more capable AI systems . \"We're publishing this research because Anthropic runs roughly a year and a half ahead of the economy on AI adoption, so what happens at Anthropic could be a leading indicator for the broader world,\" he said. acharia was \"transitioning out\" of the position. By standards of the Trump White House, which had a notorious revolving door during the first go-round, that's pretty short. There are a lot of other things that lasted longer than Zacharia's tenure. Here are 10 of them. Anthony Scaramucci as White House comms director: 10 days Anthony Scaramucci at a White House press briefing. Chip Somodevilla/Getty Images Scaramucci's firing in July 2017 became a spectacle, not least in part because of his notably short tenure. First came a profanity-laced call to a New Yorker reporter, in which Scaramucci badmouthed some of his colleagues in the White House. Then came John F. Kelly, laying down the law in the West Wing by firing Scaramucci and making an example of him on his first day on the job as chief of staff. Sally Yates as acting attorney general: 10 days Former acting U.S. Attorney General Sally Yates. Chip Somodevilla/Getty Images Sally Yates lasted exactly One Mooch. Yates was a holdover from the second Obama Administration, taking on the AG role after Loretta Lynch stepped down at Trump's inauguration in 2017. Her position as attorney general was expected to be short. Still, acting AGs from the previous administration typically held on to their roles until the incoming president picked a new attorney general, who would then be confirmed by the Senate. Yates was fired after she told the Justice Department not to defend Trump's first travel-ban executive order. Jerald TerHorst as WH press secretary: 31 days Jerald terHorst UPI/Bettmann Archive/Getty Images After Zacharia, TerHorst takes t", "date_str": "2026-10-16T22:20:12+00:00", "hash": "03564e0aa691bd55", "title_fa": "10 چیزی که بیشتر از زمان کتی زاخاریا به عنوان سخنگوی کاخ سفید دوام آورد", "summary_fa": "کیتی زاخاریا، سخنگوی کاخ سفید، اولین کنفرانس خود را روز سه‌شنبه برگزار کرد و سه روز بعد این سمت را ترک کرد. چیپ سومودویلا/ گتی ایماژ کیتی زاخاریا پس از پنج روز کار به عنوان سخنگوی کاخ سفید کنار گذاشته شد. این احتمالاً یک رکورد برای کوتاه‌ترین مدت خدمت‌رسانی مطبوعاتی کاخ سفید در تاریخ است. در اینجا 10 مورد دیگر وجود دارد که بیشتر از زمان حضور زکریا در کاخ سفید دوام می آورد. مقامات روز جمعه تایید کردند که کیتی زاخاریا پس از پنج روز کار به عنوان سخنگوی کاخ سفید کنار گذاشته شده است. سخنگوی کاخ سفید که وکیل است، روز سه‌شنبه اولین حضور دشواری را در تریبون داشت، که طی آن با اظهارات آماده‌شده برخورد کرد و بعد از اینکه به خبرنگاری گفت که در چین پشت سر گذاشته است، ابروهایش را بالا برد. دونالد ترامپ، رئیس جمهور آمریکا روز جمعه گفت که به زکریا گفته است در این نقش تجدید نظر کند. بعداً در همان روز، یکی از مقامات کاخ سفید به Business Insider گفت که زکریا در حال \"خارج شدن\" از سمت خود است. طبق استانداردهای کاخ سفید ترامپ، که در اولین دورگردش یک در گردان بدنام داشت، این بسیار کوتاه است. خیلی چیزهای دیگر هم هست که بیشتر از دوره زکریا دوام آورد. در اینجا 10 مورد از آنها وجود دارد. آنتونی اسکاراموچی به عنوان مدیر ارتباطات کاخ سفید: 10 روز آنتونی اسکاراموچی در نشست خبری کاخ سفید. چیپ سومودویلا/ گتی ایماژ اخراج اسکاراموچی در ژوئیه 2017 به یک تماشایی تبدیل شد، حتی تا حدی به دلیل دوره کوتاه او. ابتدا یک تماس توهین آمیز با خبرنگار نیویورکر بود که در آن اسکاراموچی به برخی از همکارانش در کاخ سفید بدگویی کرد. سپس جان اف. کلی آمد که با اخراج اسکاراموچی و ساختن نمونه ای از او در اولین روز کارش به عنوان رئیس"}, {"source": "Business Insider", "title": "The 6 best new movies and TV shows streaming this weekend", "link": "https://www.businessinsider.com/guides/streaming/best-new-movies-tv-shows-streaming-this-weekend-2026-10-16", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Crystal Lake and Tulsa King Season 4 are among the best new TV shows streaming this weekend. Matt Infante/PEACOCK (left); Steve Swisher/Paramount+ (right) Fall is in full swing, which means that several fan-favorite TV shows are starting back up. We've scoured the latest releases and rounded up the six best new movies and TV shows streaming the weekend of October 16, 2026. It's a big week for streaming-exclusive TV shows, including both new and existing series. \"Tulsa King\" and \"The Diplomat\" both return for their fourth seasons. New series \"VisionQuest\" and \"Crystal Lake\" have also made their streaming debuts (although you'll probably need to get caught up on some other shows and movies to be able to watch them). If you're not interested in that, the new Margaret Qualley-helmed film \"Love of Your Life\" and the \"Kate Berlant: Parmesan\" stand-up comedy special are also streaming. 6: Tulsa King The Taylor Sheridan-verse continues with the latest season of \"Tulsa King.\" In Season 4, Sylvester Stallone returns as Dwight Manfredi. This time around, he's attempting to turn his criminal empire into a legitimate business. Martin Starr, Jay Will, Vincent Piazza, Annabella Sciorra, Frank Grillo, and Dana Delany also star. New episodes drop on Fridays on Paramount Plus . 5: Love of Your Life In \"Love of Your Life,\" an American woman (Margaret Qualley) flees the US to live and work as a digital nomad in Europe in the wake of her husband's (Gabriel Basso) death during the COVID-19 pandemic. There, she encounters Felix (Aaron Pierre) and begins a relationship with him, although she struggles to overcome her own grief and past. From director Rachel Morrison, the film is now streaming on Prime Video . 4: Kate Berlant: Parmesan You've probably seen Kate Berlant pop up at least once in a TV show or movie over the past couple of years, but the comedian takes on a starring role in her HBO special debut, \"Parmesan.\" In the special, Berlant tackles the pitfalls of modern life, including the fact that the world is ending. The stand-up special will air on HBO and stream on HBO Max on Friday beginning at 10 p.m. ET. 3: The Diplomat \"The Diplomat\" returns for a fourth season, and the stakes are higher than ever for Ambassador Kate Wyler (Keri Russell). In the latest season, Kate is left reeling after discovering a controversial decision made by her husband (Rufus Sewell), the new vice pres", "date_str": "2026-10-16T21:49:23+00:00", "hash": "a6c3a76a9d7fac03", "title_fa": "6 بهترین فیلم و برنامه تلویزیونی جدید در حال پخش این آخر هفته", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید Crystal Lake و Tulsa King فصل 4 از جمله بهترین برنامه‌های تلویزیونی جدید هستند که این آخر هفته پخش می‌شوند. Matt Infante/PEACOCK (سمت چپ)؛ پاییز Steve Swisher/Paramount+ (راست) در نوسان کامل است، به این معنی که چندین برنامه تلویزیونی مورد علاقه طرفداران در حال شروع مجدد هستند. ما جدیدترین نسخه‌های منتشر شده را جست‌وجو کرده‌ایم و شش بهترین فیلم و نمایش تلویزیونی جدید را که در آخر هفته ۱۶ اکتبر ۲۰۲۶ پخش می‌شوند جمع‌آوری کرده‌ایم. این یک هفته بزرگ برای پخش برنامه های تلویزیونی انحصاری، شامل سریال های جدید و موجود است. \"Tulsa King\" و \"The Diplomat\" هر دو برای فصل چهارم خود بازگشته اند. سری‌های جدید «VisionQuest» و «Crystal Lake» نیز برای اولین بار در جریان پخش خود قرار گرفتند (اگرچه احتمالاً برای تماشای آن‌ها باید درگیر برخی از نمایش‌ها و فیلم‌های دیگر باشید). اگر به آن علاقه ندارید، فیلم جدید «عشق زندگی شما» با کلاه مارگارت کوالی و استندآپ کمدی ویژه «کیت برلانت: پارمزان» نیز در حال پخش هستند. 6: Tulsa King آیه Taylor Sheridan با آخرین فصل \"Tulsa King\" ادامه می یابد. در فصل 4، سیلوستر استالونه در نقش دوایت مانفردی بازگشته است. این بار، او در تلاش است تا امپراتوری جنایتکار خود را به یک تجارت قانونی تبدیل کند. مارتین استار، جی ویل، وینسنت پیاتزا، آنابلا سیورا، فرانک گریلو و دانا دلانی نیز در این فیلم ایفای نقش کرده اند. قسمت‌های جدید جمعه‌ها در پارامونت پلاس پخش می‌شوند. 5: عشق زندگی شما در \"عشق زندگی شما\"، یک زن آمریکایی (مارگارت کوالی) پس از مرگ همسرش (گابریل باسو) در طول همه گیری کووید-19، از ایالات متحده فرار می کند تا به عنوان یک کوچ نشین دیجیتال در اروپا زندگی و کار کند. در آنجا، او با فلیکس (آرون"}, {"source": "Business Insider", "title": "The best doorbell subscriptions compared, including Ring, Google, and Wyze", "link": "https://www.businessinsider.com/guides/tech/best-doorbell-subscription-service-plans-prices", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Sarah Saril/Business Insider In my hunt for the best smart home doorbell, one factor always came up for every prospective shopper: whether it requires a subscription plan. It makes sense, after all, when you're shelling out over $100 for a doorbell, why would anyone want to be stuck paying more to make it work properly? Unfortunately, for the best performance, the kind you see in Reels with funny wildlife interactions and delivery person struggles, you need to hop onto the manufacturer's monthly service. Without it, your smart doorbell's IQ is greatly decreased, lacking features like 24/7 recording, descriptive notifications, cloud storage, and more. That's why, after extensive testing and research, my list of the best video doorbells consists mostly of models reliant on additional plans. I've broken down the details of the best video doorbell subscriptions, including Ring Protect , Wyze Security , and Google Home Premium . Equally as important as the hardware itself is the service you'll be stuck using — so shop wisely and learn which is the best fit for your needs below. Doorbell subscription plan prices compared Depending on the doorbell you've chosen to adorn your entryway, the subscription plan available can start as low as $3 a month. Here's a lineup of starting plans, including the picks in my guide to the best video doorbells . Monthly price Annual price Max. cameras Ring Solo $5 $50 1 Wyze Cam Plus $3 $30 1 Google Home Premium $10 $100 Unlimited As with most monthly subscriptions, the monthly cost is cheaper if you pay upfront for an annual plan. Ring subscription plans Ring s subscription adds smart features you can toggle to suit your needs, along with a suite of capabilities that make the doorbells worthwhile. Sarah Saril/Business Insider Ring video doorbells don't technically require a monthly plan to work, but a Ring Protect subscription unlocks recorded video and most of the features that make a doorbell more useful day-to-day. The right option largely depends on how many Ring devices you own and whether you want basic video history or a more extensive home-security setup. Thankfully, its tiered pricing lets shoppers pay only for what they need, keeping costs low. Price Devices Monitoring Solo $5/month 1 None Multi $10/month Unlimited None Pro $20/month Unlimited Professional Monitoring Virtual Security Guard $99/month Unlimited Professional, Live V", "date_str": "2026-10-16T21:45:24+00:00", "hash": "a11db079840c4711", "title_fa": "بهترین اشتراک‌های زنگ در در مقایسه، از جمله Ring، Google، و Wyze", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بیاموزید سارا ساریل/Business Insider در جستجوی من برای بهترین زنگ خانه هوشمند، همیشه یک عامل برای هر خریدار احتمالی مطرح می‌شود: اینکه آیا به یک طرح اشتراک نیاز دارد یا خیر. پس از همه اینها منطقی است، وقتی بیش از 100 دلار برای یک زنگ در خرج می کنید، چرا کسی بخواهد برای درست کار کردن آن هزینه بیشتری بپردازد؟ متأسفانه، برای بهترین عملکرد، آن چیزی که در Reels با تعاملات خنده‌دار حیات وحش و تقلای افراد تحویل‌دهنده می‌بینید، باید به خدمات ماهانه سازنده بروید. بدون آن، ضریب هوشی زنگ در هوشمند شما به شدت کاهش می یابد، فاقد ویژگی هایی مانند ضبط 24 ساعته، اعلان های توصیفی، ذخیره سازی ابری و غیره است. به همین دلیل است که پس از آزمایش و تحقیق گسترده، لیست من از بهترین زنگ های ویدیویی عمدتاً شامل مدل هایی است که به طرح های اضافی وابسته هستند. من جزئیات بهترین اشتراک‌های زنگ درهای ویدیویی، از جمله Ring Protect، Wyze Security، و Google Home Premium را تفکیک کرده‌ام. به همان اندازه که خود سخت افزار مهم است، سرویسی است که در استفاده از آن گیر خواهید کرد - بنابراین عاقلانه خرید کنید و یاد بگیرید که کدام یک برای نیازهای شما مناسب است. مقایسه قیمت طرح اشتراک زنگ در بسته به زنگ دری که برای تزئین ورودی خود انتخاب کرده اید، طرح اشتراک موجود می تواند از ختلف به خوبی کار می‌کند. اما اگر سعی می کنید کمتر هزینه کنید، TCL QM6K QLED از نظر پولی متمایز است. این با عملکرد S90H مطابقت ندارد، اما بسیار بالاتر از قیمت خود است و از رابط هوشمند Google TV با هوش مصنوعی Gemini استفاده می کند. من و تیمم از ابزارهای کالیبراسیون برای اندازه‌گیری تصویر تلویزیون استفاده می‌کنیم، اما در اینجا متوقف نمی‌شویم. فلسفه ما این است که مشاهده در دنیای واقعی و قابلیت استفاده کلی بیشترین اهمیت را دارد. به همین دلیل است که ما زمان زیادی را صرف تماشای فیلم های واقعی و گشت و گذار در کانال می کنیم، درست مثل شما. این به ما کمک می‌کند نقاط قوت و معایبی را که الگوهای آزمایشی هرگز به خودی خود آشکار نمی‌کنند، شناسایی کنیم. ما همچنین ویژگی‌ها، طراحی و ارزش"}, {"source": "Business Insider", "title": "The terrifying true stories that inspired your favorite horror movies", "link": "https://www.businessinsider.com/horror-movies-true-stories-2018-1", "summary": "The Exorcist. Warner Bros. Horror films have produced some of the most iconic figures in pop culture. But not all scary movies are completely fictional; some are actually based on real life . \"The Conjuring\" was based on the real-life Perron family in Rhode Island. Horror movies are reliably successful at the box office — just look at \"Obsession\" and \"Backrooms \" this year. They often have relatively low budgets, deliver strong box-office returns, and can create IP that leads to sequels and spin-offs for years to come. Plus, when Halloween rolls around, costumes and masks provide another bump to a studio's bottom line. But creating a completely original, compelling, and terrifying horror story can be challenging. That's why some of the most iconic and successful scary movies are based on real-world events. For example, \" The Conjuring \" franchise is based on the case files of real paranormal investigators Lorraine and Ed Warren. In total, the films have made almost $3 billion at the box office. These are the real stories and crimes that influenced some of the most classic horror films of all time, including \"The Exorcist,\" \"Nightmare on Elm Street,\" and \"Jaws.\" The Conjuring is about the Perron family and the traumatic experiences they re having in their new Rhode Island home. Patrick Wilson and Vera Farmiga as Ed and Lorraine Warren. Warner Bros. The Perrons (husband Roger, wife Carolyn, and their five daughters) moved into what was known as the Old Arnold Estate in 1971, The Providence Journal reported. Almost immediately, the family reported paranormal activity, such as floating or moving furniture, doors opening and closing, disembodied sounds, and even being pushed, pulled, and hurt by unseen spirits. Upon calling in paranormal investigators Ed and Lorraine Warren, they found that the property was haunted by various ghosts, but that one particularly malevolent spirit, Bathsheba, was preying on them. Bathsheba Sherman, who lived on the property in the 1800s, has been described as a suspected Satanist who was charged with the violent murder of her first child, though historians say she was never convicted of a crime or accused of witchcraft. The property sold for $1.5 million in 2022. It has since been acquired by \"Ghost Hunters\" star Jason Hawes for $1.3 million, according to land records . The Conjuring 2 is about a girl being possessed by a demon in London. New Line Cinema The Hodgson family reported experiencing unusual phenomena in their London hom", "date_str": "2026-10-16T20:08:16+00:00", "hash": "bac977693ce1cd48", "title_fa": "داستان های واقعی وحشتناکی که الهام بخش فیلم های ترسناک مورد علاقه شما هستند", "summary_fa": "جن گیر. فیلم‌های ترسناک برادران وارنر تعدادی از نمادین‌ترین چهره‌های فرهنگ پاپ را تولید کرده‌اند. اما همه فیلم های ترسناک کاملاً تخیلی نیستند. برخی در واقع بر اساس زندگی واقعی هستند. \"احضار\" بر اساس زندگی واقعی خانواده پرون در رود آیلند ساخته شد. فیلم های ترسناک به طور قابل اعتمادی در باکس آفیس موفق هستند - امسال فقط به «وسواس» و «پشت خانه ها» نگاه کنید. آنها اغلب بودجه نسبتاً پایینی دارند، بازدهی قوی در گیشه ارائه می‌ itor their health. To choose the best outdoor shelters for cats, I spoke with experts in community cat care and shelter medicine, along with an authority on pet product safety, expanding on earlier reporting by freelance pets reporter Shoshi Parks. Then, I put 11 cat houses to the test outdoors for at least 3 weeks each. Over that time, they endured 6.9 inches of rain and dropping temperatures in the Pacific Northwest. I also placed a heating pad inside each shelter to mimic a cat's body heat, tracking how much the interior warmed while a heat source was inside and how well it held that heat after it was removed. My top pick is the Trixie Natura Pet Home , a wooden shelter that's waterproof, easy to maintain, and the most affordable prefabricated option, though you can't beat the value of my DIY cat shelter recommendation. If winter temperatures in your area drop to near or below freezing, the Kitty Tube Outdoor Insulated Cat House effectively retains body heat in chilly outdoor conditions. Read more about how Business Insider Reviews tests and reviews pet products . Our top picks for the best outdoor cat houses Best overall: Trixie Natura Pet Home - $50 at Chewy Best insulated: Kitty Tube Outdoor Insulated Cat House - $195 at Amazon Best for multiple cats: New Age Pet Feral Cat House - $86 at Chewy Best pre-assembled: UnderCover Pet Houses Small Outdoor Cat House - $279 at Etsy Best for garage: K H Thermo Outdoor Kitty House - $80 at Chewy Best DIY: Sterilite Storage Bins - See 18 Gallon ($7) and 30 Gallon ($12) bins at Walmart Best overall No matter the forecast, the Trixie Natura Pet Home is well-equipped to handle all weather conditions, and it's easy to clean and prep for the next season. Even after several inches of steady Pacific Northwest rain and a direct hose spray to simulate heavier storms, the house never took on water. Its single baffled entrance h", "date_str": "2026-10-16T19:39:45+00:00", "hash": "570b7f5cce3a37e0", "title_fa": "بهترین خانه های گربه e lean team since 2025 as Nvidia reorganized its communications org. Former employees described growing workloads as responsibilities expanded. Nvidia's communications organization has been reshaped as the company became the face of the AI boom, with multiple teams brought under new leadership and a string of departures. Business Insider identified roughly 15 communications employees who have left Nvidia since 2025, based on LinkedIn profiles and interviews with former employees. The organization now numbers roughly 70 to 80 people globally, and has more than doubled in size since Mylene Mangalindan joined as vice president of corporate communications in 2023, according to a person close to the company. The departures have also included newer hires. Anna Soellner , who was recruited to lead corporate communications, left after roughly four months, Business Insider previously reported. Nvidia is known for high retention. It reported companywide turnover of 3.7% in fiscal 2026, up from 2.5% the prior year, and well below the tech industry average of 21.9% cited in its latest sustainability report . Mangalindan succeeded longtime communications chief Bob Sherbin, who retired in 2024. She previously worked at the advisory firm Brunswick Group. She was brought in to \"bring fresh blood\" and \"upgrade the team\" to meet Nvidia's growing profile, one former employee said. At the end of 2024, Nvidia restructured its communications organization. It brought enterprise public relations under Mangalindan's leadership alongside the corporate communications team she already led, according to two former employees. Corporate communications focuses on Nvidia's reputation and major media outlets, while enterprise handles product and industry messaging, including for its data center business . One former employee said the consolidation reflected the growing importance of Nvidia's data center business, which sells chips and systems that power AI and had become its biggest revenue driver. Analyst relations, social media, and influencer marketing also moved under Mangalindan's remit this year, another former employee said. Three former employees said Nvidia's communications team had long operated with relatively lean staffing, even as workloads grew alongside the company's public profile, leaving staf", "date_str": "2026-10-16T18:58:10+00:00", "hash": "bc908172e1e82ebc", "title_fa": "تیم ارتباطی انویدیا با افزایش مشخصات عمومی آن دستخوش تغییراتی شده است", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا. بلومبرگ/ گتی ایماژ با تبدیل شدن این شرکت به چهره رونق هوش مصنوعی، عملیات ارتباطی انویدیا تغییر شکل داده است. از سال 2025 که انویدیا سازمان ارتباطات خود را دوباره سازماندهی کرد، تقریباً 15 کارمند تیم ناب را ترک کردند. کارمندان سابق افزایش حجم کار را با گسترش مسئولیت ها توصیف کردند. سازمان ارتباطات انویدیا با تبدیل شدن این شرکت به چهره رونق هوش مصنوعی، با تیم‌های متعدد تحت رهبری جدید و مجموعه‌ای از ترک‌ها، تغییر شکل داده است. Business Insider تقریباً 15 کارمند ارتباطات را که از سال 2025 انویدیا را ترک کرده اند، بر اساس پروفایل های لینکدین و مصاحبه با کارمندان سابق شناسایی کرد. به گفته یکی از افراد نزدیک به شرکت، تعداد این سازمان در حال حاضر حدود 70 تا 80 نفر در سراسر جهان است و از زمانی که مایلن مانگالیندان به عنوان معاون ارتباطات شرکتی در سال 2023 به آن ملحق شد، اندازه آن بیش از دو برابر شده است. خروج ها شامل استخدام های جدیدتر نیز می شود. به گزارش بیزینس اینسایدر، آنا سولنر، که برای رهبری ارتباطات شرکتی استخدام شده بود، تقریباً پس از چهار ماه این کار را ترک کرد. انویدیا به خاطر نگهداری بالا معروف است. گردش مالی شرکت در سال مالی 2026 3.7 درصد بود که نسبت به سال قبل 2.5 درصد افزایش داشت و بسیار کمتر از میانگین صنعت فناوری 21.9 درصد ذکر شده در آخرین گزارش پایداری خود است. مانگالیندان جانشین رئیس ارتباطات قدیمی باب شربین شد که در سال 2024 بازنشسته شد. او قبلاً در شرکت مشاوره Brunswick Group کار می کرد. یکی از کارمندان سابق گفت که او برای \"خون تازه\" و \"ارتقای تیم\" برای ملاقات با مشخصات رو به رشد انویدیا آورده شد. در پایان سال 2024، انویدیا سازمان ارتباطات خود را بازسازی کرد. به گفته دو کارمند سابق، این"}, {"source": "Business Insider", "title": "Katie Zacharia is out as White House press secretary. Meet the 6 Trump has had over both his terms.", "link": "https://www.businessinsider.com/white-house-press-secretaries-trump-2026-10", "summary": "The three most recent White House press secretaries, from left to right: Kayleigh McEnany, Karoline Leavitt, and Katie Zacharia. Alex Wong/Getty Images ; Tom Williams/CQ-Roll Call, Inc via Getty Images ; Chip Somodevilla/Getty Images President Donald Trump has had six White House press secretaries across his two presidential terms. Sean Spicer, Stephanie Grisham, and Kayleigh McEnany held the role for less than a year. Katie Zacharia succeeded Karoline Leavitt, but is \"transitioning out\" after five days on the job. The new face at the White House podium didn't last long. Katie Zacharia held her first briefing as the new White House press secretary on Tuesday after President Donald Trump chose her to succeed Karoline Leavitt , who left the White House in August to spend more time with her young children. By Friday, a White House official confirmed to Business Insider that she is \"transitioning out\" of the role . Zacharia was the sixth White House press secretary Trump has hired across his two non-consecutive presidential terms , and the fourth to serve for less than a year. It's not unusual for presidents to go through several press secretaries due to the demanding nature of the role. President Barack Obama had three press secretaries during his two terms in office. Former presidents Bill Clinton and George W. Bush had four. Here's a look at all of the White House press secretaries who have represented the Trump administration. Sean Spicer WASHINGTON, DC - APRIL 24: White House Press Secretary Sean Spicer talks to reporters during the daily press briefing at the White House April 24, 2017 in Washington, DC. Spicer was joined during the briefing by U.S. Ambassador to the United Nations Nikki Haley and Treasury Secretary Steven Mnuchin. (Photo by Chip Somodevilla/Getty Images) Chip Somodevilla/Getty Images Sean Spicer's time as White House press secretary spanned 182 days — the shortest tenure of all of Trump's press secretaries. After leaving the White House, he appeared on season 28 of \"Dancing with the Stars.\" He now serves as a political contributor at NewsNation and hosts several podcasts, including \"Full Court Press with Sean Spicer\" and \"The Sean Spicer Show.\" Sarah Huckabee Sanders White House Press Secretary Sarah Huckabee Sanders speaks during a press briefing at the White House in Washington, DC, March 11, 2019. (Photo by SAUL LOEB / AFP) (Photo by SAUL LOEB/AFP via Getty Images) SAUL LOEB/AFP via Getty Images During Trump's first term, Sanders ser", "date_str": "2026-10-16T18:52:37+00:00", "hash": "c9e410b214b22812", "title_fa": "کیتی زاخاریا به عنوان سخنگوی کاخ سفید کنار گذاشته شد. با 6 موردی که ترامپ در هر دو دوره خود داشته است ملاقات کنید.", "summary_fa": "سه منشی مطبوعاتی اخیر کاخ سفید، از چپ به راست: کیلی مک‌انانی، کارولین لیویت، و کیتی زاخاریا. الکس وانگ/گتی ایماژ; تام ویلیامز/CQ-Roll Call، Inc از طریق Getty Images. چیپ سومودویلا/ گتی ایماژ، رئیس جمهور دونالد ترامپ در دو دوره ریاست جمهوری خود، شش منشی مطبوعاتی در کاخ سفید داشته است. شان اسپایسر، استفانی گریشام و کیلی مک‌انانی کمتر از یک سال در این نقش حضور داشتند. کیتی زاخاریا جانشین کارولین لیویت شد، اما پس از پنج روز کار در حال «ترقیب» است. چهره جدید در تریبون کاخ سفید دوام زیادی نداشت. کیتی زاخاریا اولین جلسه توجیهی خود را به عنوان سخنگوی مطبوعاتی جدید کاخ سفید روز سه شنبه پس از انتخاب رئیس جمهور دونالد ترامپ به عنوان جانشین کارولین لیویت که در ماه اوت کاخ سفید را برای گذراندن زمان بیشتری با فرزندان خردسالش ترک کرد، برگزار کرد. تا روز جمعه، یکی از مقامات کاخ سفید به Business Insider تایید کرد که او در حال \"خارج شدن\" از این نقش است. زکریا ششمین سخنگوی کاخ سفید بود که ترامپ در دو دوره ریاست جمهوری غیر متوالی خود استخدام کرد و چهارمین سخنگویی بود که کمتر از یک
