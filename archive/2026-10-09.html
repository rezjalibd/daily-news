وبل، سخنگوی Flock در بیانیه‌ای در روز جمعه به TechCrunch گفت: Flock اخیراً به کارمندان فعلی برنامه جدایی داوطلبانه سخاوتمندانه‌ای را به عنوان بخشی از تلاش‌های ما برای موقعیت‌یابی شرکت برای مرحله بعدی رشد آن پیشنهاد داده است. این یک برنامه داوطلبانه بود، نه یک اخراج، و منعکس کننده تمرکز مداوم ما بر ایجاد یک تجارت قوی و پایدار برای آینده است. سخنگوی Flock در پاسخ به سوال TechCrunch که آیا گرت لنگلی، مدیر اجرایی یا سایر مدیران، به عنوان بخشی از برنامه کاهش دستمزد خود را انجام داده اند، توضیح بیشتری نداد. فلاک با انتقادات شدید و مخالفت فزاینده ای از سوی جوامع در سراسر ایالات متحده و قانونگذارانی که به دنبال مهار برنامه نظارت جمعی خصوصی شرکت هستند، مواجه شده است. Flock بیش از 100000 دوربین پلاک خوان را در سراسر ایالات متحده نصب کرده است که به پلیس و ماموران فدرال اجازه می دهد مکان و مکان وسایل نقلیه عبوری از آنها را ردیابی کنند. ده ها افسر پلیس به دلیل سوء استفاده از دسترسی به سیستم Flock برای جستجو، ردیابی و تعقیب افراد"}, {"source": "TechCrunch Main", "title": "Xona’s commercial GPS alternative is about to go live", "link": "https://techcrunch.com/2026/10/09/xonas-commercial-gps-alternative-is-about-to-go-live/", "summary": "Xona's precision timing and navigation service will enter beta testing after SpaceX launches six satellites designed by the company.", "date_str": "2026-10-09T12:00:00+00:00", "hash": "b864cf9a9a4f9279", "title_fa": "جایگزین تجاری تجاری Xona در شرف انتشار است", "summary_fa": "سرویس زمان‌بندی و ناوبری دقیق Xona پس از پرتاب شش ماهواره توسط اسپیس‌ایکس که توسط این شرکت طراحی شده‌اند، وارد آزمایش بتا خواهد شد. اولین جایگزین تجاری دقیق برای GPS در حال آماده شدن برای شروع به کار است که شش ماهواره طراحی شده توسط استارتاپ Xona Space Systems در این ماه به مدار زمین پرتاب شوند. سرویسی که با سیگنال‌های رایگان ارائه‌شده توسط دولت‌ها در سراسر جهان رقابت می‌کند، ممکن است احمقانه به نظر برسد، اما Xona امیدوار است که مسیریابی و زمان‌بندی را به فهرست انحصارات فضایی دولتی که توسط استارت‌آپ‌های سرمایه‌گذاری مختل شده‌اند، اضافه کند. Xona در سال 2019 توسط تیمی متشکل از پنج مهندس که در ابتدا در برنامه فارغ التحصیل مهندسی هوافضا دانشگاه استنفورد ملاقات کردند، تأسیس شد. یکی، تایلر رید، با نوشتن پایان نامه خود در مورد امکان استفاده از ماهواره ها در مدار پایین زمین برای بهبود ناوبری، مدرک دکترا گرفت. GPS و شبکه های ماهواره ای آنالوگ که توسط اروپا، چین و روسیه ساخته شده اند، ارزش بسیار زیادی دارند، اما به راحتی قابل پارازیت هستند و به اندازه کافی دقیق نیستند که به تنهایی برای کاربردهایی مانند ربات های کشاورزی یا ماشین های خودران استفاده شوند. در گفتگوهای پیتزا و آبجو، دوستان به این فکر کردند که آیا رفع این مشکلات می تواند کاری باشد یا خیر. برایان منینگ، مدیر عامل Xona، در جریان بازدید اخیر از دفتر مرکزی شرکت، به TechCrunch گفت: تند تند زانوی من مثل این بود که این احمقانه است. چرا کسی باید GPS را جایگزین کند؟ رایگان است، درست است؟ و من شروع به کندوکاو در آن کردم. مردم به GPS به عنوان یک سرویس رایگان فکر می کنند، اما بازار این سرویس نیست. بازار سخت افزار است، و شما هر سال میلیاردها دستگاه دارید که به فروش می رسد. آن چیزها به صورت رایگان داده"}, {"source": "TechCrunch Main", "title": "President Trump awards Big Tech donors with nation’s highest science prizes", "link": "https://techcrunch.com/2026/10/08/president-trump-awards-big-tech-donors-with-nations-highest-science-prizes/", "summary": "Together, the awardees have donated nearly $6 billion to efforts tied to Trump and his administration.", "date_str": "2026-10-08T22:33:59+00:00", "hash": "56f6debd49f8730e", "title_fa": "پرزیدنت ترامپ به اهداکنندگان فناوری بزرگ بالاترین جوایز علمی کشور را اهدا می کند", "summary_fa": "برندگان این جایزه با هم نزدیک به 6 میلیارد دلار به تلاش‌های مرتبط با ترامپ و دولتش اهدا کرده‌اند. روز پنجشنبه، در اجلاس عصر طلایی نوآوری آمریکا، پرزیدنت ترامپ به الون ماسک، جنسن هوانگ، سرگی برین و لیزا سو از AMD مدال ملی علم را که برترین جایزه علمی کشور است، اعطا کرد. مایکل دل از شرکت Dell Technologies و ساتیا نادلا از مایکروسافت نیز مدال ملی فناوری و نوآوری را دریافت کردند. ترامپ گفت که برگزیدگان به \"پیشگام شدن آینده ای باورنکردنی برای آمریکا\" کمک کرده اند و به خاطر آنها، \"ما همیشه در صدر خواهیم بود. هیچ کس دیگری نمی تواند با ما رقابت کند.\" نادلا مدال خود را درست پس از آن دریافت کرد که دولت مایکروسافت را به طور نامحدود از برنامه H-1B تعلیق کرد، برنامه ای که به شرکت های آمریکایی اجازه می دهد کارگران خارجی ماهر را استخدام کنند. 50٪ تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس خود را دریافت کنید و یک همکار، شریک یا همتای خود را با 50 درصد تخفیف بیاورید. با ایجاد ارتباطات، ایجاد شتاب و کشف آنچه در اکوسیستم استارت آپی در آینده وجود دارد، زمینه بیشتری را پوشش دهید. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها هسته TechCrunch هستند، بنابراین بهترین پوشش ما را هر هفته دریافت کنید. به متحرکان و تکان دهنده ها اطلاعاتی را که برای شروع روز خود نیاز دارند ارائه می دهد. با ارسال ایمیل خود، با شرایط و اعلامیه حریم خصوصی ما موافقت می کنید."}, {"source": "TechCrunch Main", "title": "Watch the trailer for ‘The Altruists,’ Netflix’s show about the FTX scandal", "link": "https://techcrunch.com/2026/10/08/watch-the-trailer-for-the-altruists-netflixs-show-about-the-ftx-scandal/", "summary": "A fictionalized Sam Bankman-Fried is coming to your TV screen on November 19.", "date_str": "2026-10-08T18:30:00+00:00", "hash": "a60f799c3c99f326", "title_fa": "تریلر «نوخواهان»، نمایش نتفلیکس درباره رسوایی FTX را تماشا کنید", "summary_fa": "سم بنکمن-فرید تخیلی در 19 نوامبر به صفحه تلویزیون شما می آید. اگر اخبار فناوری را دنبال می کنید و عاشق نمایش های آشفته هستید، زمان خوبی برای زنده ماندن است. ما در پاییز امسال فقط یک مستند ناتان فیلدر درباره الیزابت هلمز دریافت نمی کنیم. فیلم Altruists از نتفلیکس، که سم بنکمن-فرید و کارولین الیسون را در رسوایی که FTX را شکست و آنها را به زندان انداخت، دنبال می کند، در 19 نوامبر اکران می شود. درست در زمان شکرگزاری است، با این فرض که سام بدنام دیگری برنامه های تعطیلات ما را دوباره خراب نکند. این تریلر با بازی آنتونی بویل در نقش سم بنکمن-فرید و جولیا گارنر در نقش کارولین الیسون است: نمی‌توانیم بگوییم که هرگز انتظار داشتیم که گسست‌های اخلاقی در پس نوع‌دوستی مؤثر توجه هالیوود را برانگیزد، اما امیدواریم نتفلیکس عجیب بودن این داستان را عدالت کند. گراهام مور، یکی از مجریان برنامه در تابستان امسال در مصاحبه ای با نتفلیکس گفت: «از همان ابتدا، من بسیار مجذوب داستان های واقعی سم و کارولین بودم. \"این هر دو شخصیتی هستند که اگر سعی می کردم نمی توانستم آنها را بسازم - من آنقدر نویسنده خوب نیستم که بتوانم شخصیت هایی به اندازه سم بنکمن-فرید یا کارولین الیسون خلق کنم.\" 50٪ تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس خود را دریافت کنید و یک همکار، شریک یا همتای خود را با 50 درصد تخفیف بیاورید. با ایجاد ارتباطات، ایجاد شتاب و کشف آنچه در اکوسیستم استارت آپی در آینده وجود دارد، زمینه بیشتری را پوشش دهید. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است."}, {"source": "TechCrunch Main", "title": "A startup founder who served time in prison is looking to court an untapped market: ex-cons", "link": "https://techcrunch.com/2026/10/08/a-startup-founder-who-served-time-in-prison-is-looking-to-court-an-untapped-market-ex-cons/", "summary": "Richard Bronson, a former Stratton Oakmont partner who served time in federal prison for securities violations, has launched Commissary Club, a startup that uses AI to help people leaving prison find jobs, housing, community, and even dates.", "date_str": "2026-10-08T16:45:00+00:00", "hash": "da4a008d48844e2b", "title_fa": "یک بنیانگذار استارت آپ که مدتی را در زندان گذرانده است، به دنبال این است که به بازاری دست نخورده دست یابد: مخالفان سابق", "summary_fa": "ریچارد برونسون، شریک سابق Stratton Oakmont که مدتی را به دلیل نقض اوراق بهادار در زندان فدرال گذراند، Commissary Club را راه‌اندازی کرده است، استارت‌آپی که از هوش مصنوعی برای کمک به افرادی که از زندان خارج می‌شوند برای یافتن شغل، مسکن، اجتماع و حتی قرار ملاقات استفاده می‌کند. ریچارد برونسون، کارآفرینی که اخیراً استارت‌آپی به نام Commissary Club راه‌اندازی کرده است، پیشینه‌ای غیرمعمول برای یک بنیانگذار دارد: در زندگی قبلی، او مدتی را در زندان گذراند. در دهه 1980، برانسون برای شرکت بدنام Stratton Oakmont کار می کرد - شرکت کارگزاری مملو از فساد که توسط جردن بلفورت اداره می شد، گرگ وال استریت که داستان آن به فیلمی در سال 2013 تبدیل شد. این شرکت در اواسط دهه 1990 زیر بار اتهامات سوء رفتار از بین رفت. برانسون شریک استراتن بود اما پس از یک سال شرکت خود را در فلوریدا جنوبی راه اندازی کرد. او در آن کار کاملاً موفق بود، تا زمانی که به پایان نرسید. برانسون به TechCrunch گفت: من یک تجارت 100 میلیون دلاری ایجاد کردم که این شرکت‌های کوچک را به صورت عمومی درآورد. با این حال، برخی از موفقیت ها از طریق زیر پا گذاشتن قانون - قوانین اوراق بهادار - به دست آمد و در نهایت، همانطور که می دانستم به ناچار اتفاق خواهد افتاد، مجبور شدم بهای آن را بپردازم. من همه چیز و مهمتر از همه آزادی ام را از دست دادم. و من را برای چند سال به زندان فدرال فرستادند. برونسون مدت زیادی است که از زندان خارج شده است، اما هرگز مبارزاتی را که در ابتدا از زندان بیرون آمد، فراموش نکرده است. با وجود تمام تحصیلات و تجربه کاری و هر چیز دیگری، هیچ کس مرا استخدام نمی کند. او گفت که من کاملا رادیواکتیو بودم. تجربه برانسون پس از زندان به اطلاع رسانی استارتاپ"}, {"source": "TechCrunch Main", "title": "US bars Microsoft, Adobe, and major IT firms from green card program for skilled foreign workers", "link": "https://techcrunch.com/2026/10/08/us-bars-microsoft-adobe-and-major-it-firms-from-green-card-program-for-skilled-foreign-workers/", "summary": "The other firms being suspended from the program include Capgemini, Cognizant, HCL, Infosys, Tata, and Wipro.", "date_str": "2026-10-08T15:42:26+00:00", "hash": "ffff38bb138a89fd", "title_fa": "ایالات متحده مایکروسافت، ادوبی و شرکت های بزرگ فناوری اطلاعات را از برنامه گرین کارت برای کارگران ماهر خارجی محروم می کند", "summary_fa": "سایر شرکت هایی که از این برنامه تعلیق شده اند عبارتند از Capgemini، Cognizant، HCL، Infosys، Tata و Wipro. دولت ترامپ مایکروسافت، ادوبی و چندین شرکت فناوری دیگر را از برنامه‌ای که به کارگران خارجی ماهر کمک می‌کند تا اقامت دائم ایالات متحده را دریافت کنند، تعلیق می‌کند و این شرکت‌ها را به تقلب متهم می‌کند. پیام ما به مایکروسافت این است: شما یک شرکت آمریکایی بزرگ هستید، اما باید کارگران بزرگ آمریکایی را استخدام کنید، ایالات متحده. به گزارش رویترز، معاون رئیس جمهور جی دی ونس روز پنجشنبه در یک کنفرانس خبری گفت. ویزای H-1B برای موقعیت های بسیار ماهر طراحی شده است که کارفرمایان ممکن است برای پر کردن آنها با کارگران واجد شرایط ایالات متحده مشکل داشته باشند. به گزارش آسوشیتدپرس، شرکت‌های فناوری یکی از بزرگترین کاربران این برنامه هستند و تقریباً سه چهارم ویزاهای تأیید شده به کارگران هندی تعلق می‌گیرد. سخنگوی مایکروسافت در ایمیلی به TechCrunch گفت: ما به قدرت و استعداد نیروی کار آمریکایی اعتقاد داریم. به همین دلیل است که اکثریت قریب به اتفاق کارمندان مایکروسافت در ایالات متحده آمریکایی هستند. ما مشتاقانه منتظر ارائه اطلاعات بیشتر به اداره هستیم. برای مثال، از حدود 6000 درخواست ویزای H-1B که در سال مالی گذشته ارائه کردیم، 80 درصد برای تمدید یا تغییر وضعیت کارمندان موجود مایکروسافت بود. این بیانیه ادامه می دهد، اینها برای استخدام افراد جدید نبودند. پرونده‌های باقی‌مانده برای کارمندان جدید برای افرادی بود که قبلاً به طور قانونی در ایالات متحده بودند و تصمیم گرفتند برای ما کار کنند، و آنها فقط 1٪ از نیروی کار ما در ایالات متحده است. آنها تازه وارد به کشور ما نیستند. این شرکت در ادامه خاطرنشان کرد که فقط درخواست‌های H-1B را برای کسانی ارسال می‌کند که استانداردهای سختگیرانه دسته ویزا را رعایت می‌کنند و به کارمندان H-1B خود مانند سایر کارمندانی که کارهای"}, {"source": "TechCrunch Main", "title": "Elon Musk questions Ambani’s influence as Starlink India launch stalls", "link": "https://techcrunch.com/2026/10/08/elon-musk-questions-ambanis-influence-as-starlink-india-launch-stalls/", "summary": "“Is Ambani the real boss of India?” Elon Musk asked as he questioned why Starlink has yet to launch its satellite internet service in the country.", "date_str": "2026-10-08T15:12:59+00:00", "hash": "8e41a2ea10db6d1e", "title_fa": "ایلان ماسک تأثیر آمبانی را در حین غرفه راه اندازی Starlink هند زیر سوال می برد", "summary_fa": "\"آیا آمبانی رئیس واقعی هند است؟\" ایلان ماسک در حالی که می‌پرسید چرا Starlink هنوز سرویس اینترنت ماهواره‌ای خود را در کشور راه‌اندازی نکرده است، پرسید. ایلان ماسک تاثیر میلیاردر هندی موکش آمبانی را زیر سوال برده است زیرا اسپیس ایکس در تلاش است تا سرویس اینترنت ماهواره ای Starlink خود را در این کشور راه اندازی کند. نظرات ماسک که در X پست شده بود، پس از رد ادعای دولت هند مبنی بر اینکه منافع تجاری قدرتمند مانع ورود آن شده اند، اختلاف بر سر تاخیرهای نظارتی را تشدید کرد. ماسک روز چهارشنبه الیگارشی‌های ناشناس را متهم کرد که از راه‌اندازی Starlink در هند جلوگیری کرده‌اند تا آنچه را که او انحصار خود را در این کشور می‌خواند، بدون شناسایی آنها یا ارائه مدرکی برای ادعای خود، حفظ کنند. او مسدود کردن ادعایی را جنایتی علیه مردم هند خواند و استدلال کرد که استارلینک می‌تواند اینترنت مقرون به صرفه و پرسرعت را برای افرادی که دسترسی به اینترنت ندارند به ارمغان بیاورد. ساعاتی بعد، وزارت ارتباطات هند با بیان اینکه چارچوب نظارتی آن برای ارتباطات ماهواره ای منصفانه و بدون تبعیض است، عقب نشینی کرد. این وزارتخانه در بیانیه‌ای گفت که Starlink و دو اپراتور ماهواره‌ای دارای مجوز دیگر همگی در یک مرحله نظارتی هستند. این سازمان افزود که هر سه شرکت تحت ارزیابی‌های امنیتی هستند که باید قبل از جستجوی طیف، فرکانس‌های رادیویی که ماهواره‌ها برای ارسال سیگنال‌ها استفاده می‌کنند، تکمیل شوند. ماسک روز پنجشنبه فراتر رفت و نفوذ موکش آمبانی، رئیس صنایع Reliance را زیر سوال برد. آیا آمبانی رئیس واقعی هند است؟ او در X نوشت، پس از اینکه ادعا کرد استارلینک سال‌ها را صرف پیروی از مقررات هند کرده و این سوال را مطرح کرده که چرا هنوز مجوز ندارد."}, {"source": "TechCrunch Main", "title": "New York alleges TikTok gave teens, children a placebo safety feature instead of a real one", "link": "https://techcrunch.com/2026/10/08/new-york-alleges-tiktok-gave-teens-children-a-placebo-safety-feature-instead-of-a-real-one/", "summary": "New York’s lawsuit against the company is one of more than two dozen cases brought by states accusing the social media giant of designing its platform to encourage addictive use among children.", "date_str": "2026-10-08T15:06:17+00:00", "hash": "8466074d3325a8df", "title_fa": "نیویورک ادعا می کند که TikTok به نوجوانان و کودکان یک ویژگی ایمنی دارونما به جای یک ویژگی واقعی داده است", "summary_fa": "شکایت نیویورک علیه این شرکت یکی از بیش از دوجین پرونده ای است که ایالت ها این غول رسانه های اجتماعی را به طراحی پلت فرم خود برای تشویق استفاده از اعتیاد در میان کودکان متهم می کنند. بر اساس ادعای شکایت نیویورک علیه پلتفرم رسانه اجتماعی، TikTok به نوجوانان و کودکان امکان دسترسی به ویژگی ایمنی دارونما را به جای یک ویژگی واقعی داد که به آنها اجازه می داد در آزمایشی توصیه های خود را تجدید کنند. رویترز گزارش می‌دهد که آزمایش‌های TikTok هزاران کاربر، از جمله نوجوانان و کودکان را شامل می‌شد که ترجیح داده‌اند از ویژگی‌های ایمنی مانند «Algo Refresh» استفاده کنند، ابزاری که به کاربران اجازه می‌دهد توصیه‌های خود را بازنشانی کنند و محتوای ناخواسته یا بالقوه مضر را مشاهده نکنند. اگرچه کاربران بر این باور بودند که این ویژگی را فعال کرده‌اند، اما فیدهای آن‌ها برخلاف کاربرانی که بخشی از آزمایش نبودند و به نسخه‌ای کاملاً کاربردی از ابزار دسترسی داشتند، تغییر نکرد. TikTok به رویترز گفت: ما به طور مداوم پلتفرم خود را بهبود می‌دهیم، به این معنی که مانند بسیاری از شرکت‌ها، به طور منظم محصولات و ویژگی‌های جدید را آزمایش می‌کنیم تا تجربه را تأیید کنیم و بفهمیم که چگونه در دنیای واقعی کار می‌کنند. TikTok فوراً درخواستی برای اظهار نظر ارسال نکرد. این دادخواست همچنین ادعا می کند که TikTok آزمایش های دیگری انجام داده است. بلومبرگ در ژوئن گزارش داد که یکی از این آزمایش‌ها یک ویژگی ایمنی را از 15 میلیون ایالات متحده پنهان کرده است. کاربران، از جمله یک نوجوان که بعداً بر اثر خودکشی جان باخت. 50٪ تخفیف برای پاس دوم دریافت کنید تجربه Disrupt قرار است به اشتراک گذاشته شود. پاس خود را دریافت کنید و یک همکار، شریک یا همتای خود را با 50 درصد تخفیف بیاورید. با ایجاد ارتباطات، ایجاد شتاب و کشف"}, {"source": "Ars Technica", "title": "Rocket Report: A rare Falcon 9 scrub; is it just about Vulcan's time to shine?", "link": "https://arstechnica.com/space/2026/10/rocket-report-a-rare-falcon-9-scrub-is-it-just-about-vulcans-time-to-shine/", "summary": "Welcome to Edition 9.14 of the Rocket Report! The big news this week, from our perspective, is that United Launch Alliance's Vulcan rocket appears to be close to launching. We've seen a no-earlier-than launch date for the return to flight mission of October 29 (an Amazon Leo flight), and the next rocket up after that, also an Amazon Leo mission, is also planned for this year. Assuming the solid rocket boosters work, Vulcan could be poised for a major breakthrough next year in cadence. As always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar. Nuri rocket notches another success . South Korea successfully deployed five satellites for its first domestically launched microsatellite constellation during the fifth flight of its homegrown Nuri rocket Wednesday, Yonhap News Agency reports . In addition to the primary payload of five New-space Earth Observation Satellite Constellation for National Safety microsatellites, nine of the rocket's 10 CubeSat secondary payloads were released as planned, according to the Korea AeroSpace Administration. PERSAT-02, developed by South Korean startup Quaternion, failed to separate from the rocket. Read full article Comments", "date_str": "2026-10-09T11:00:57+00:00", "hash": "4663d71c81fa083e", "title_fa": "گزارش موشک: اسکراب کمیاب فالکون 9. آیا زمان درخشش ولکان فرا رسیده است؟", "summary_fa": "به نسخه 9.14 گزارش موشک خوش آمدید! خبر مهم این هفته، از دیدگاه ما، این است که به نظر می رسد موشک ولکان اتحاد پرتاب یونایتد به پرتاب نزدیک است. ما تاریخ پرتابی را برای بازگشت به ماموریت پروازی در 29 اکتبر (یک پرواز آمازون لئو) دیدیم، و موشک بعدی پس از آن، همچنین ماموریت آمازون لئو، نیز برای امسال برنامه ریزی شده است. با فرض کارکرد تقویت‌کننده‌های موشک جامد، Vulcan می‌تواند در سال آینده برای یک پیشرفت بزرگ آماده باشد. مثل همیشه، از ارسال‌های خوانندگان استقبال می‌کنیم، و اگر نمی‌خواهید مشکلی را از دست بدهید، لطفاً با استفاده از کادر زیر مشترک شوید (فرم در نسخه‌های دارای AMP سایت ظاهر نمی‌شود). هر گزارش شامل اطلاعاتی در مورد موشک های کوچک، متوسط ​​و سنگین و همچنین نگاهی سریع به سه پرتاب بعدی در تقویم خواهد بود. موشک نوری موفقیت دیگری به دست آورد. به گزارش خبرگزاری یونهاپ، کره جنوبی با موفقیت پنج ماهواره را برای اولین صورت فلکی ریزماهواره پرتاب داخلی خود در جریان پنجمین پرواز موشک نوری بومی خود در روز چهارشنبه مستقر کرد. به گفته اداره هوافضای کره، علاوه بر محموله اولیه پنج ماهواره رصدی زمین جدید فضایی برای ریزماهواره های ایمنی ملی، 9 محموله از 10 محموله ثانویه CubeSat این موشک طبق برنامه ریزی شده رها شدند. PERSAT-02 که توسط استارتاپ کره جنوبی Quaternion توسعه داده شد، نتوانست از موشک جدا شود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای ناوبری به حداقل رساندن به نسخه 9.14 گزارش موشک خوش آمدید! از دیدگاه ما، خبر مهم این هفته این است که به نظر می رسد موشک ولکان متعلق به اتحاد پرتاب متحد به پرتاب نزدیک است. ما تاریخ پرتابی را برای بازگشت به ماموریت پرواز در 29 اکتبر (یک"}, {"source": "Ars Technica", "title": "Volkswagen's replacement for the ID.4 crossover is here", "link": "https://arstechnica.com/cars/2026/10/volkswagens-replacement-for-the-id-4-crossover-is-here/", "summary": "Volkswagen’s ID.4 is no more. The midsize crossover debuted in 2021 , one of VW's first new electric vehicles designed in the wake of dieselgate . A year later, the company began local production in Chattanooga, Tennessee, and a couple of years ago facelifted the model, adding a much-improved rear drive unit in the process . But Chattanooga turned its attention away from the ID.4 earlier this year . And, having sold almost a million ID.4s (and near-identical ID.5s) globally, the German automaker has decided it’s time for its replacement. Meet the ID. Tiguan. Dropping the numerical and adopting the moniker of VW’s big seller is a statement. “The Tiguan is our best-selling model worldwide, and the ID.4 and ID.5 are among our most successful electric cars. The ID. Tiguan brings these two success stories together,” said Thomas Schäfer, CEO of the VW brand. VW was an early pioneer of using flexible vehicle architectures to create a multitude of bodystyles and sizes with common parts, and its transition into building EVs hasn’t changed that. The ID. Tiguan uses an updated version of the company’s mass-market EV platform, now called MEB+, with either 58 kWh or 77 kWh battery packs. The smaller pack is only available with a 187 hp (140 kW) rear electric motor, but the 77 kWh battery can be had with either a 281 hp (210 kW) rear-wheel drive powertrain or as a 295 hp (220 kW) all-wheel drive version. Range is up to 373 miles (600 km), at least according to the European WLTP test. Read full article Comments", "date_str": "2026-10-09T10:00:59+00:00", "hash": "02902c64a58ba9da", "title_fa": "جایگزین فولکس واگن برای کراس اوور ID.4 اینجاست", "summary_fa": "فولکس واگن ID.4 دیگر نیست. این کراس اوور سایز متوسط ​​در سال 2021 معرفی شد و یکی از اولین خودروهای الکتریکی جدید فولکس‌واگن بود که پس از دیزل‌گیت طراحی شد. یک سال بعد، این شرکت تولید محلی را در چاتانوگا، تنسی آغاز کرد و چند سال پیش این مدل را فیس لیفت کرد و یک واحد محرک عقب بسیار بهبود یافته را در این فرآیند اضافه کرد. اما چاتانوگا در اوایل سال جاری توجه خود را از ID.4 معطوف کرد. و با فروش تقریباً یک میلیون ID.4 (و ID.5 تقریباً یکسان) در سطح جهان، این خودروساز آلمانی تصمیم گرفته است که زمان جایگزینی آن فرا رسیده است. شناسه را ملاقات کنید. تیگوان. کنار گذاشتن عدد و استفاده از نام فروشنده بزرگ فولکس‌واگن یک بیانیه است. توماس شافر، مدیر عامل برند فولکس واگن گفت: \"تیگوان پرفروش ترین مدل ما در سراسر جهان است و ID.4 و ID.5 از موفق ترین خودروهای الکتریکی ما هستند. ID. Tiguan این دو داستان موفقیت را در کنار هم قرار می دهد.\" فولکس‌واگن اولین پیشگام در استفاده از معماری‌های انعطاف‌پذیر خودرو برای ایجاد تعداد زیادی از بدنه‌ها و اندازه‌ها با قطعات مشترک بود، و انتقال آن به ساخت خودروهای برقی تغییری در آن ایجاد نکرده است. شناسه تیگوان از نسخه به روز شده پلتفرم EV انبوه این شرکت که اکنون MEB+ نامیده می شود، با بسته های باتری 58 کیلووات ساعتی یا 77 کیلووات ساعتی استفاده می کند. بسته کوچکتر فقط با یک موتور الکتریکی عقب 187 اسب بخاری (140 کیلووات) در دسترس است، اما باتری 77 کیلووات ساعتی را می توان با پیشرانه دیفرانسیل عقب 281 اسب بخاری (210 کیلووات) یا نسخه چهار چرخ متحرک با قدرت 295 اسب بخار (220 کیلووات) داشت. برد حداقل بر اساس تست WLTP اروپا تا 373 مایل (600 کیلومتر) است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان"}, {"source": "Ars Technica", "title": "SpaceX calls for better coordination in orbit after near-misses with Starlink", "link": "https://arstechnica.com/space/2026/10/spacex-calls-for-better-coordination-in-orbit-after-near-misses-with-starlink/", "summary": "Space has plenty of room for more megaconstellations, but only if all operators are willing to share information about where their satellites are and where they're going, a top executive at SpaceX and its AI subsidiary said this week. Michael Nicolls, SpaceX's vice president for Starlink and president of Elon Musk's artificial intelligence company, xAI, used a presentation Tuesday at the International Astronautical Congress in Turkey as a clarion call for improved data-sharing among satellite operators. SpaceX's Starlink constellation now has more than 11,000 satellites, about two-thirds of all active spacecraft in low-Earth orbit. Radars and telescopes routinely track thousands more pieces of space junk. Read full article Comments", "date_str": "2026-10-08T21:37:32+00:00", "hash": "2111b34bd48ea38c", "title_fa": "SpaceX خواستار هماهنگی بهتر در مدار پس از نزدیک شدن به استارلینک است", "summary_fa": "یکی از مدیران ارشد اسپیس ایکس و زیرمجموعه هوش مصنوعی آن در این هفته گفت که فضا فضای زیادی برای ابرصورت‌های فلکی بیشتر دارد، اما تنها در صورتی که همه اپراتورها مایل باشند اطلاعاتی درباره مکان و مکان رفتن ماهواره‌هایشان به اشتراک بگذارند. مایکل نیکولز، معاون اسپیس ایکس برای استارلینک و رئیس شرکت هوش مصنوعی ایلان ماسک، xAI، از ارائه ای در روز سه شنبه در کنگره بین المللی فضانوردی در ترکیه به عنوان یک فراخوان شفاف برای به اشتراک گذاری داده ها در میان اپراتورهای ماهواره ای استفاده کرد. صورت فلکی استارلینک اسپیس ایکس اکنون بیش از 11000 ماهواره دارد که حدود دو سوم کل فضاپیماهای فعال در مدار پایین زمین است. رادارها و تلسکوپ ها به طور معمول هزاران قطعه دیگر از زباله های فضایی را ردیابی می کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید کمینه کردن برای پیمایش فضا فضای زیادی برای ابرصورت فلکی بیشتر دارد، اما تنها در صورتی که همه اپراتورها مایل باشند اطلاعاتی درباره مکان ماهواره های خود و جایی که می روند به اشتراک بگذارند. مایکل نیکولز، معاون اسپیس ایکس برای استارلینک و رئیس شرکت هوش مصنوعی ایلان ماسک، xAI، از ارائه روز سه‌شنبه در کنگره بین‌المللی فضانوردی در ترکیه به عنوان یک فراخوان شفاف برای بهبود اشتراک‌گذاری داده‌ها در میان اپراتورهای ماهواره‌ای استفاده کرد. صورت فلکی استارلینک اسپیس ایکس اکنون بیش از 11000 ماهواره دارد که حدود دو سوم کل فضاپیماهای فعال در مدار پایین زمین است. رادارها و تلسکوپ ها به طور معمول هزاران قطعه دیگر از زباله های فضایی را ردیابی می کنند. استارلینک، با اختلاف، بزرگترین صورت فلکی ماهواره ای است که امروزه در حال کار است. اما اگر وزوز را بخرید، Starlink فقط نوک کوه یخ است. اسپیس ایکس"}, {"source": "Ars Technica", "title": "Judge weighs if Trump can charge $100K for early access to Truth Social posts", "link": "https://arstechnica.com/tech-policy/2026/10/judge-weighs-if-trump-can-charge-100k-for-early-access-to-truth-social-posts/", "summary": "Likely in the next few weeks, a federal judge will decide if Donald Trump can become the first president to personally profit from selling early access to government information in his social media posts. At a hearing Wednesday, Department of Justice civil attorney Brantley Mayers argued that there was no conflict whatsoever with Trump charging up to $100,000 monthly for instant API access to Truth Social posts that often break news from his administration. Trump is the largest stakeholder and majority owner of Trump Media Technology Group, the parent company that owns Truth Social, and the value of the API access comes largely from Trump’s role as president. Read full article Comments", "date_str": "2026-10-08T20:53:01+00:00", "hash": "53f673374f2d9ed3", "title_fa": "قاضی بررسی می کند که آیا ترامپ بتواند 100 هزار دلار برای دسترسی زودهنگام به پست های Truth Social دریافت کند یا خیر", "summary_fa": "احتمالاً در چند هفته آینده، یک قاضی فدرال تصمیم خواهد گرفت که آیا دونالد ترامپ می‌تواند اولین رئیس‌جمهوری باشد که شخصاً از فروش دسترسی زودهنگام به اطلاعات دولتی در پست‌های رسانه‌های اجتماعی خود سود می‌برد. در جلسه استماع روز چهارشنبه، برانتلی مایرز، وکیل مدنی وزارت دادگستری، استدلال کرد که هیچ تعارضی با ترامپ وجود ندارد که ماهانه 100000 دلار برای دسترسی فوری API به پست‌های Truth Social که اغلب اخبار دولت او را منتشر می‌کنند، دریافت کند. ترامپ بزرگترین سهامدار و مالک اکثریت ترامپ Media Technology Group است، شرکت مادر مالک Truth Social، و ارزش دسترسی به API عمدتاً از نقش ترامپ به عنوان رئیس جمهور ناشی می شود. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید به حداقل رساندن برای پیمایش به احتمال زیاد در چند هفته آینده، یک قاضی فدرال تصمیم خواهد گرفت که آیا دونالد ترامپ می تواند اولین رئیس جمهور شود که شخصاً از فروش دسترسی زودهنگام به اطلاعات دولتی در پست های رسانه های اجتماعی خود سود می برد. گروه‌های خبری شکایت کرده‌اند که هزینه‌های گزاف API ترامپ با ایجاد سطوح دسترسی به اطلاعات دولتی در پست‌های رسانه‌های اجتماعی که ترامپ از نظر فنی مالک آن نیست، متمم اول و قانون سوابق ریاست جمهوری را نقض می‌کند. علاوه بر این، هزینه های گزاف API ترامپ متمم پنجم را تضعیف می کند. گروه‌های خبری استدلال می‌کنند که این دولت را از دریافت مبالغ نامعقول که برای جبران هزینه‌های منفعت دولت قابل توجیه نیست، و اعطای دسترسی ترجیحی به اطلاعات مهم دولت به دلایل خودسرانه و غیرمنطقی را منع می‌کند."}, {"source": "Ars Technica", "title": "Trump Mobile hack and apparent lack of FCC authorization raise security alarms", "link": "https://arstechnica.com/tech-policy/2026/10/trump-mobile-doesnt-seem-to-have-fcc-authorization-for-phone-service-senator-says/", "summary": "Trump Mobile apparently failed to obtain necessary authorizations to operate the international calling portion of its phone service, Sen. Maggie Hassan (D-N.H.) wrote in a letter to the company today. Her letter said Trump Mobile also doesn't appear to have submitted a required plan for fighting robocalls. Trump Mobile's key business partner, Liberty Mobile Wireless, did make a robocall database filing, but it was not complete, Hassan said. Hassan's letter raised questions about Trump Mobile's security related to a report that hackers stole personal data of 3,615 customers and Trump Mobile's previous confirmation that a vendor it uses exposed customers' personal data on the Internet. Hassan alleged that Trump Mobile failed to follow multiple FCC filing rules that are supposed to help ensure the security of mobile services. Read full article Comments", "date_str": "2026-10-08T20:39:31+00:00", "hash": "2a48c621a43d8fe6", "title_fa": "هک ترامپ موبایل و فقدان آشکار مجوز FCC هشدارهای امنیتی را افزایش می دهد", "summary_fa": "سناتور مگی حسن (D-N.H.) امروز در نامه ای به این شرکت نوشت: ترامپ موبایل ظاهراً نتوانست مجوزهای لازم را برای اجرای بخش تماس های بین المللی سرویس تلفن خود دریافت کند. در نامه او آمده است که ترامپ موبایل همچنین به نظر نمی رسد که طرح لازم برای مبارزه با تماس های رباتیک را ارائه دهد. حسن گفت، شریک تجاری کلیدی ترامپ موبایل، لیبرتی موبایل بی‌سیم، پرونده‌ای از پایگاه‌داده تماس رباتیک ایجاد کرد، اما کامل نبود. نامه حسن سوالاتی در مورد امنیت ترامپ موبایل ایجاد کرد که مربوط به گزارشی بود مبنی بر اینکه هکرها اطلاعات شخصی 3615 مشتری را به سرقت بردند و تایید قبلی ترامپ موبایل مبنی بر اینکه فروشنده ای که از اطلاعات شخصی مشتریان افشا شده در اینترنت استفاده می کند. حسن ادعا کرد که ترامپ موبایل از چندین قانون تشکیل پرونده FCC که قرار است به تضمین امنیت خدمات تلفن همراه کمک کند، پیروی نکرده است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. سناتور مگی حسن (D-N.H.) امروز در نامه ای به شرکت نوشت ترامپ موبایل ظاهراً نتوانست مجوزهای لازم را برای اجرای بخش تماس بین المللی سرویس تلفن خود دریافت کند. نامه حسن سوالاتی در مورد امنیت ترامپ موبایل ایجاد کرد که مربوط به گزارشی بود مبنی بر اینکه هکرها اطلاعات شخصی 3615 مشتری را به سرقت بردند و تایید قبلی ترامپ موبایل مبنی بر اینکه فروشنده ای که از داده های شخصی مشتریان افشا شده در اینترنت استفاده می کند. حسن ادعا کرد که ترامپ موبایل از چندین قانون تشکیل پرونده FCC که قرار است به تضمین امنیت خدمات تلفن همراه کمک کند، پیروی نکرده است. حسن به پاتریک اوبراین، مدیرعامل ترامپ موبایل گفت: «فقدان آشکار مجوز برای سرویس‌های بین‌المللی ترامپ موبایل، سؤالاتی را در"}, {"source": "Ars Technica", "title": "Feds get ready to rewrite car headlight rules", "link": "https://arstechnica.com/cars/2026/10/feds-get-ready-to-rewrite-car-headlight-rules/", "summary": "One of the regulations that make vehicles in the US different from those in Europe or Japan is our headlight rules. They’re laid out in the Federal Motor Vehicle Safety Standards (FMVSS), and changing them is—or used to be—a lengthy, laborious process, which is a major reason automotive lighting technology has lagged in the US. But the current administration says it’s time for “bolstering driver safety, slashing red tape, and embracing new technologies,” so it’s going to start a negotiated rulemaking process to rewrite the regulations to suit 2026. “Today’s standards do not allow automakers to deploy the latest safety-improving lighting technologies, so we are bringing key experts and stakeholders together to modernize our standards and address potential causes of glare,” the National Highway Traffic Safety Administration's Jonathan Morrison said. “This collaborative approach will allow us to update outdated regulations, foster innovation, and keep everyone on our roads safer.” While it is fair to be skeptical of the government's efforts to streamline bureaucracy , it is also fair to say US headlight regulations really could use an update. Read full article Comments", "date_str": "2026-10-08T20:26:13+00:00", "hash": "e06c7f3b47bc0362", "title_fa": "فدرال رزرو برای بازنویسی قوانین چراغ خودرو آماده می شود", "summary_fa": "یکی از مقرراتی که وسایل نقلیه در ایالات متحده را از اروپا یا ژاپن متفاوت می کند قوانین چراغ جلوی ما است. آنها در استانداردهای ایمنی خودروهای موتوری فدرال (FMVSS) ارائه شده اند و تغییر آنها - یا قبلاً - یک فرآیند طولانی و پرزحمت است، که دلیل اصلی عقب ماندگی فناوری روشنایی خودرو در ایالات متحده است. اما دولت فعلی می‌گوید زمان «تقویت ایمنی رانندگان، کاهش تشریفات اداری و پذیرش فناوری‌های جدید» فرا رسیده است، بنابراین قرار است فرآیند تدوین قوانین مذاکره‌شده را برای بازنویسی مقررات مطابق با سال 2026 آغاز کند. جاناتان موریسون از اداره ملی ایمنی ترافیک بزرگراه ها گفت: «استانداردهای امروزی به خودروسازان اجازه نمی دهد که جدیدترین فناوری های روشنایی بهبود ایمنی را به کار گیرند، بنابراین ما کارشناسان و ذینفعان کلیدی را گرد هم می آوریم تا استانداردهای خود را مدرن کرده و به علل بالقوه تابش خیره کننده بپردازیم. \"این رویکرد مشترک به ما امکان می‌دهد تا قوانین قدیمی را به‌روزرسانی کنیم، نوآوری را تقویت کنیم و همه را در جاده‌هایمان ایمن‌تر نگه داریم.\" اگرچه منصفانه است که نسبت به تلاش‌های دولت برای ساده‌سازی بوروکراسی تردید داشته باشیم، اما منصفانه است که بگوییم مقررات چراغ‌های جلوی ایالات متحده واقعاً می‌توانند از یک به‌روزرسانی استفاده کنند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به ناوبری به حداقل برسد یکی از مقرراتی که وسایل نقلیه در ایالات متحده را از خودروهای اروپا یا ژاپن متفاوت می کند قوانین چراغ جلوی ما است. آنها در استانداردهای ایمنی خودروهای موتوری فدرال (FMVSS) ارائه شده اند و تغییر آنها - یا قبلاً - یک فرآیند طولانی و پرزحمت است، که دلیل اصلی عقب ماندگی فناوری روشنایی خودرو در ایالات متحده است."}, {"source": "Ars Technica", "title": "RIP Margaret Hamilton, whose code saved the Apollo 11 Moon landing", "link": "https://arstechnica.com/science/2026/10/r-i-p-margaret-hamilton-whose-code-saved-the-apollo-11-moon-landing/", "summary": "Margaret Hamilton, who coined the term \"software engineering\" and led the development of onboard flight software for NASA's Apollo program in the 1960s, died last week at the age of 90. A recipient of the Presidential Medal of Freedom in 2016, Hamilton was also immortalized as a LEGO minifig the following year—part of the \"Women of NASA\" set that also included astronauts Mae Jemison and Sally Ride. “To say Margaret Hamilton was a pioneer—to say she was ahead of her time—would be a dramatic understatement. She was a software engineer at a time when that field was in its infancy, and she not only developed advanced code herself but also led a team in using that nascent technology to develop one of the most complex systems humanity had ever achieved,” said Olivier de Weck , interim head of the MIT Department of Aeronautics and Astronautics. “The Apollo program still stands as one of our greatest testaments to the power of collaboration, ingenuity, and engineering, and Hamilton was a fundamental contributor to that program’s success.” Born in 1936 in Paoli, Indiana, Hamilton graduated from Earlham College in 1958 with a degree in mathematics and a minor in philosophy—the latter a nod to her father (a poet) and grandfather (a headmaster). She married her first husband, James Cox Hamilton, that same year. The plan was for her to work until he finished his law degree, after which he would support her through graduate school to earn a PhD in mathematics. Read full article Comments", "date_str": "2026-10-08T20:15:53+00:00", "hash": "a466f0b621518bc1", "title_fa": "RIP مارگارت همیلتون، که کد او فرود آپولو 11 بر ماه را نجات داد", "summary_fa": "مارگارت همیلتون، که اصطلاح \"مهندسی نرم‌افزار\" را ابداع کرد و در دهه 1960 توسعه نرم‌افزار پرواز درون هواپیما را برای برنامه آپولو ناسا رهبری کرد، هفته گذشته در سن 90 سالگی درگذشت. همیلتون که در سال 2016 مدال آزادی ریاست جمهوری را دریافت کرد، همچنین به عنوان یک LEGO مینی فیگور جاودانه شد. فضانوردان می جمیسون و سالی راید. \"اینکه بگوییم مارگارت همیلتون یک پیشگام بود - گفتن اینکه او از زمان خود جلوتر بود - دست کم گرفتن چشمگیری است. او در زمانی که این رشته در مراحل ابتدایی خود بود یک مهندس نرم افزار بود و او نه تنها خودش کدهای پیشرفته ای را توسعه داد، بلکه رهبری تیمی را در استفاده از این فناوری نوپا برای توسعه یکی از پیچیده ترین سیستم هایی که بشر تا به حال به دست آورده بود، بر عهده داشت.\" هوانوردی و فضانوردی. \"برنامه آپولو هنوز به عنوان یکی از بزرگترین گواهی های ما بر قدرت همکاری، نبوغ و مهندسی است و همیلتون نقش اساسی در موفقیت آن برنامه داشت.\" همیلتون که در سال 1936 در پائولی، ایندیانا به دنیا آمد، در سال 1958 از کالج ارلهام فارغ التحصیل شد و در رشته ریاضیات و یک مدرک جزئی در فلسفه فارغ التحصیل شد. او در همان سال با همسر اولش جیمز کاکس همیلتون ازدواج کرد. برنامه این بود که او تا زمانی که مدرک حقوق خود را تمام کند، کار کند و پس از آن تا پایان تحصیلات تکمیلی از او حمایت کند تا دکترا در ریاضیات بگیرد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید مارگارت همیلتون را که اصطلاح «مهندسی نرم‌افزار» را ابداع کرد و توسعه نرم‌افزار پرواز درون هواپیما را برای برنامه آپولو ناسا در دهه 1960 در سن 90 سالگی درگذشت،"}, {"source": "Ars Technica", "title": "Let's Encrypt cuts certificate lifetimes to 64 days starting February 2027", "link": "https://arstechnica.com/gadgets/2026/10/lets-encrypt-cuts-certificate-lifetimes-to-64-days-starting-february-2027/", "summary": "Let's Encrypt is continuing a push toward tighter security by reducing free SSL/TLS certificate lifetimes from 90 days to 64 days, starting February 10, 2027. For administrators already implementing modern ACME clients that support ARI (ACME Renewal Information), the change should be seamless. For those still relying on hardcoded renewal schedules or manual processes, February will be the deadline to update before certificates start expiring unexpectedly. Starting on October 14, Let's Encrypt will begin testing the 64-day certificates, and interested users can opt in to test their setups before production goes live. Prior to Let's Encrypt's launch in early 2016 , certificates were often issued for as long as one to three years. The service started with 90-day certificates to force renewal automation that didn't previously exist. Shorter certificate validity periods limited vulnerabilities from private key thefts and encouraged accelerated HTTPS adoption across the web. Read full article Comments", "date_str": "2026-10-08T19:57:17+00:00", "hash": "33c1566bb8ff9631", "title_fa": "Let's Encrypt طول عمر گواهی را از فوریه 2027 به 64 روز کاهش می دهد", "summary_fa": "Let's Encrypt با کاهش طول عمر گواهینامه رایگان SSL/TLS از 90 روز به 64 روز، از 10 فوریه 2027، به تلاش برای امنیت بیشتر ادامه می دهد. برای مدیرانی که قبلاً کلاینت های ACME مدرن را که از ARI (اطلاعات تمدید ACME) پشتیبانی می کنند، استفاده می کنند، این تغییر باید یکپارچه باشد. برای کسانی که هنوز به برنامه‌های تمدید کد سخت یا فرآیندهای دستی تکیه می‌کنند، فوریه آخرین مهلت به‌روزرسانی قبل از انقضای غیرمنتظره گواهینامه‌ها خواهد بود. از 14 اکتبر، Let's Encrypt آزمایش گواهینامه های 64 روزه را آغاز می کند و کاربران علاقه مند می توانند قبل از شروع تولید، تنظیمات خود را آزمایش کنند. قبل از راه اندازی Let's Encrypt در اوایل سال 2016، گواهینامه ها اغلب برای مدت یک تا سه سال صادر می شدند. این سرویس با گواهینامه های 90 روزه برای اجبار به اتوماسیون تمدید که قبلاً وجود نداشت شروع شد. دوره‌های اعتبار گواهی کوتاه‌تر، آسیب‌پذیری‌های ناشی از سرقت کلید خصوصی را محدود کرده و پذیرش سریع HTTPS را در سراسر وب تشویق می‌کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید. برای مدیرانی که قبلاً کلاینت‌های ACME مدرن را پیاده‌سازی می‌کنند که از ARI (اطلاعات تجدید ACME) پشتیبانی می‌کنند، این تغییر باید یکپارچه باشد. برای کسانی که هنوز به برنامه‌های تمدید کد سخت یا فرآیندهای دستی تکیه می‌کنند، فوریه آخرین مهلت به‌روزرسانی قبل از انقضای غیرمنتظره گواهینامه‌ها خواهد بود."}, {"source": "Ars Technica", "title": "Driver wins $76 after ALPR led to bogus traffic stop, drug searches", "link": "https://arstechnica.com/tech-policy/2026/10/driver-wins-76-after-alpr-led-to-bogus-traffic-stop-drug-searches/", "summary": "A federal jury in Texas recently ruled in favor of a man who sued Bexar County and its sheriff over allegations that the agency ran what the plaintiff’s attorneys called an “unconstitutional traffic stop scheme” enabled by “AI-powered” license plate readers. Late last month, plaintiff Alek Schott of Houston was awarded $76, one dollar for each minute that he was detained. (Schott asked for this exact amount as symbolic compensation.) “After the stop, I filed a complaint with the Sheriff’s Office because I knew what happened to me was wrong,” Schott said in a statement after his win. “The department reviewed it, told me they didn’t see any violation, and said if I had a problem with it, I should sue them. So I did.” Read full article Comments", "date_str": "2026-10-08T19:42:30+00:00", "hash": "3050b7069f0e3001", "title_fa": "پس از ALPR که منجر به توقف جعلی ترافیک و جستجوی مواد مخدر شد، راننده 76 دلار برنده شد", "summary_fa": "هیئت منصفه فدرال در تگزاس اخیراً به نفع مردی رای داد که از شهرستان بکسار و کلانتر آن به دلیل ادعاهایی مبنی بر اینکه آژانس آنچه را که وکلای شاکی «طرح توقف ترافیک غیرقانونی» می‌خواندند که توسط پلاک‌خوان‌های «با استفاده از هوش مصنوعی» فعال شده است، اجرا کرده است. در اواخر ماه گذشته، شاکی الک شات از هیوستون به ازای هر دقیقه بازداشت، 76 دلار، یک دلار جایزه دریافت کرد. (شات دقیقاً این مبلغ را به عنوان غرامت نمادین درخواست کرد.) شات پس از بردش در بیانیه‌ای گفت: «پس از توقف، به کلانتری شکایت کردم زیرا می‌دانستم آنچه برایم اتفاق افتاده اشتباه بوده است. «اداره آن را بررسی کرد، به من گفت که هیچ تخلفی ندیده‌اند و گفتند اگر مشکلی با آن دارم، باید از آنها شکایت کنم. بنابراین من انجام دادم.» خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش یک هیئت منصفه فدرال در تگزاس اخیراً به نفع مردی که از شهرستان بکسار و کلانتر آن شکایت کرده بود به دلیل ادعاهایی مبنی بر اینکه آژانس آنچه را که وکلای شاکی به نام \"مجوز ممنوعه\" خوانده اند، رای داد. بشقاب خوان در شکایت مدنی خود، شات یک داستان وحشیانه را بیان کرد. شات در مارس 2022 با کامیون وانت خود از یک سفر کاری به کاریزو اسپرینگز، در بخش جنوب غربی ایالت، به خانه می رفت. در حالی که در شهرستان بکسار، که منطقه اطراف سن آنتونیو را پوشش می دهد، یک افسر پلیس شات را به دلیل \"دریفت شدن در لاین\" به سمت خانه کشید. پدر دو فرزند توسط معاون جوئل باب مورد بازجویی قرار گرفت که بعداً اعتراف کرد که دلیل اعلام شده برای توقف ترافیک ساختگی بوده است. دلیل واقعی توقف این بود که باب"}, {"source": "Ars Technica", "title": "RFK Jr. unveils sweeping federal initiative to find evidence of vaccine injuries", "link": "https://arstechnica.com/health/2026/10/rfk-jr-unveils-sweeping-federal-initiative-to-find-evidence-of-vaccine-injuries/", "summary": "Under anti-vaccine Health Secretary Robert F. Kennedy Jr., the federal health department is undertaking an agency-wide effort to focus on injuries claimed to be related to vaccines. In a press announcement Thursday , the Department of Health and Human Services (HHS) laid out four aspects of the large-scale initiative. The first is a new clinic at the National Institutes of Health that is \"dedicated to studying and caring for patients experiencing health problems following vaccination.\" Despite only being announced today, the clinic actually opened October 5, and Kennedy secretly attended its ribbon-cutting ceremony alongside other high-level Trump administration officials. It's unclear why his visit and the clinic's opening were not disclosed by the Trump administration, but they were reported by Bloomberg Law at the time. Another aspect of the initiative is a proposal to reimburse doctors for reporting possible injuries from vaccines to a federal system called VAERS (Vaccine Adverse Event Reporting System). VAERS, which is run by the Centers for Disease Control and Prevention, is a common focus of anti-vaccine advocates , who incessantly misuse it . The system is meant to be an indiscriminate dragnet of any potential safety concerns linked to vaccines, providing a sensitive early warning monitoring system. Anyone, including members of the public, can submit an unvetted report. Read full article Comments", "date_str": "2026-10-08T19:26:32+00:00", "hash": "e3902339e6d7dae3", "title_fa": "RFK جونیور از ابتکار فدرال گسترده برای یافتن شواهدی مبنی بر صدمات ناشی از واکسن پرده برداری می کند", "summary_fa": "در زمان وزیر بهداشت ضد واکسن، رابرت اف کندی جونیور، وزارت بهداشت فدرال در حال انجام تلاشی گسترده برای تمرکز بر آسیب هایی است که ادعا می شود مربوط به واکسن ها هستند. در اطلاعیه مطبوعاتی روز پنجشنبه، وزارت بهداشت و خدمات انسانی (HHS) چهار جنبه از ابتکار عمل در مقیاس بزرگ را ارائه کرد. اولی یک کلینیک جدید در مؤسسه ملی بهداشت است که \"به مطالعه و مراقبت از بیمارانی که پس از واکسیناسیون دچار مشکلات سلامتی می شوند\" اختصاص دارد. علیرغم اینکه این کلینیک تنها امروز اعلام شد، اما در واقع در 5 اکتبر افتتاح شد و کندی به طور مخفیانه در مراسم بریدن روبان آن در کنار سایر مقامات بلندپایه دولت ترامپ شرکت کرد. مشخص نیست که چرا بازدید وی و افتتاح کلینیک توسط دولت ترامپ فاش نشده است، اما قانون بلومبرگ در آن زمان گزارش داد. یکی دیگر از جنبه های این طرح پیشنهادی برای بازپرداخت پزشکان برای گزارش صدمات احتمالی ناشی از واکسن ها به یک سیستم فدرال به نام VAERS (سیستم گزارش رویدادهای نامطلوب واکسن) است. VAERS، که توسط مراکز کنترل و پیشگیری از بیماری ها اداره می شود، کانون مشترک طرفداران ضد واکسن است که به طور مداوم از آن سوء استفاده می کنند. این سیستم قرار است یک شبکه بی‌مشخص از هرگونه نگرانی بالقوه ایمنی مرتبط با واکسن‌ها باشد و یک سیستم نظارت زودهنگام حساس را ارائه دهد. هر کس، از جمله اعضای عمومی، می تواند یک گزارش بررسی نشده ارسال کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به ناوبری به حداقل برسانید زیر نظر وزیر بهداشت ضد واکسن رابرت اف. کندی جونیور، دپارتمان بهداشت فدرال در حال انجام تلاشی گسترده برای تمرکز بر آسیب هایی است که ادعا می شود مربوط به"}, {"source": "Ars Technica", "title": "An experimental tour-de-force: Entanglement between glass bead and light", "link": "https://arstechnica.com/science/2026/10/suspended-glass-bead-entangled-with-light-maybe-a-quantum-memory/", "summary": "Writing about quantum entanglement is always a challenge. There are so many clichés to avoid: It’s mysterious, ghostly, spooky, and weird. Entanglement is none of those things, and yet it is also all of those things—a superposition of clichés, you might say. So, having gotten all of my clichés out of the way in the second sentence, let’s take a look at how a group of researchers managed to entangle a light beam with a glass bead , which is, frankly, quite an achievement. Cliché-free entanglement Quantum entanglement is nothing more or less than the idea that if two objects are linked, then their behavior will, in some ways, be correlated. To take a terrible example: My upper and lower arm are very strongly correlated in terms of relative position because they are connected at the elbow. No one is surprised by this because we can see that they are actually a single object called an arm. Two photons can be, in a sense, joined together, meaning that they have correlations, too. In this case, we are (naively) surprised for three reasons. First, we think of photons as separate objects that cannot be joined—this is a mistake of understanding. Second, when we connect two photons, we only connect them in limited ways: The two photons may be wholly uncorrelated in terms of polarization, but strongly correlated in terms of energy. Read full article Comments", "date_str": "2026-10-08T18:45:23+00:00", "hash": "3905bd1361f230c4", "title_fa": "یک تور-د-نیروی تجربی: درهم تنیدگی بین مهره شیشه ای و نور", "summary_fa": "نوشتن در مورد درهم تنیدگی کوانتومی همیشه یک چالش است. کلیشه های زیادی وجود دارد که باید از آنها اجتناب کرد: مرموز، شبح آور، شبح آور و عجیب است. درهم تنیدگی هیچ یک از آن چیزها نیست، و با این حال، همه آن چیزها نیز هست - شاید بگویید برهم نهفته‌ای از کلیشه‌ها. بنابراین، پس از حذف تمام کلیشه های من در جمله دوم، بیایید نگاهی بیندازیم به این که چگونه گروهی از محققان موفق شدند یک پرتو نور را با یک مهره شیشه ای در هم ببندند، که رک و پوست کنده، یک دستاورد است. درهم تنیدگی بدون کلیشه درهم تنیدگی کوانتومی چیزی بیشتر یا کمتر از این ایده نیست که اگر دو شیء به هم مرتبط باشند، رفتار آنها از جهاتی با هم مرتبط خواهد بود. برای مثال وحشتناک: بازوی بالایی و پایینی من از نظر موقعیت نسبی بسیار قوی هستند زیرا در آرنج به هم متصل هستند. هیچ کس از این تعجب نمی کند زیرا ما می توانیم ببینیم که آنها در واقع یک جسم واحد به نام بازو هستند. دو فوتون می توانند به یک معنا به هم متصل شوند، به این معنی که آنها همبستگی دارند. در این مورد، ما (ساده لوحانه) به سه دلیل شگفت زده می شویم. اول، ما فوتون ها را به عنوان اجسام جداگانه ای می دانیم که نمی توانند به هم بپیوندند - این یک اشتباه در درک است. دوم، وقتی دو فوتون را به هم وصل می‌کنیم، آنها را فقط به روش‌های محدودی به هم وصل می‌کنیم: این دو فوتون ممکن است از نظر قطبش کاملاً نامرتبط باشند، اما از نظر انرژی به شدت همبستگی دارند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای ناوبری نوشتن در مورد"}, {"source": "Ars Technica", "title": "Amazon's new Alexa Tablets drop the Fire branding but are more Android than ever", "link": "https://arstechnica.com/gadgets/2026/10/amazons-new-alexa-tablets-drop-the-fire-branding-but-are-more-android-than-ever/", "summary": "For the last 15 years, you've been able to buy a Fire tablet from Amazon. Which Fire tablet? It doesn't matter—like Kindles, they have been pretty much the same year to year. The company's new tablet lineup is a big change, though. Amazon has dropped the Fire branding in favor of Alexa, and the new Alexa Tablets are now Google-certified Android devices. Throughout the history of Fire Tablets, Amazon downplayed its use of Android. They ran Android apps from the company's Appstore platform, but there was no Google integration with \"Fire OS.\" However, Amazon shut down its app store last year . The new Alexa Tablets run full-fledged Google-y versions of Android with the Play Store and all the apps you'd expect. This contrasts sharply with Amazon's Fire Sticks, which have abandoned Android for the custom Linux-based Vega OS. The Alexa Tablet lineup consists of three devices, all redesigned with unibody aluminum housings. The Alexa Tablet 8 starts at $230, and the Tablet 11 jumps to $330. They run on the budget MediaTek 8189 processor, but that's still an upgrade from the last-gen Fire tablets . Both devices have 16:10 display ratios that are better for watching video, but the flagship tablet is a little different. Read full article Comments", "date_str": "2026-10-08T16:32:46+00:00", "hash": "a0d6a568d927c8f0", "title_fa": "تبلت‌های الکسا جدید آمازون برند Fire را کنار می‌گذارند اما اندرویدی‌تر از همیشه هستند", "summary_fa": "در 15 سال گذشته، شما قادر به خرید تبلت Fire از آمازون بوده اید. کدام تبلت فایر؟ فرقی نمی کند- مانند Kindles، آنها تقریباً سال به سال یکسان بوده اند. با این حال، مجموعه تبلت های جدید این شرکت یک تغییر بزرگ است. آمازون برند Fire را به نفع الکسا کنار گذاشته است و تبلت‌های جدید الکسا اکنون دستگاه‌های اندرویدی مورد تایید گوگل هستند. در طول تاریخ Fire Tablets، آمازون استفاده از اندروید را کم اهمیت جلوه داده است. آنها برنامه های اندروید را از پلتفرم Appstore شرکت اجرا می کردند، اما هیچ ادغام گوگل با \"Fire OS\" وجود نداشت. با این حال، آمازون سال گذشته فروشگاه اپلیکیشن خود را تعطیل کرد. تبلت‌های جدید الکسا نسخه‌های کامل Google-y اندروید را با فروشگاه Play و همه برنامه‌هایی که انتظار دارید اجرا می‌کنند. این به شدت در تضاد با Fire Sticks آمازون است که اندروید را برای سیستم عامل Vega مبتنی بر لینوکس رها کرده است. مجموعه تبلت الکسا از سه دستگاه تشکیل شده است که همگی با بدنه آلومینیومی یکپارچه بازطراحی شده اند. تبلت الکسا 8 از 230 دلار شروع می شود و تبلت 11 به 330 دلار می رسد. آنها از پردازنده مقرون به صرفه MediaTek 8189 استفاده می کنند، اما هنوز هم یک ارتقاء از آخرین نسل تبلت های Fire است. هر دو دستگاه دارای نسبت نمایش 16:10 هستند که برای تماشای ویدیو بهتر است، اما تبلت پرچمدار کمی متفاوت است. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش در 15 سال گذشته، شما قادر به خرید تبلت Fire از آمازون بوده اید. کدام تبلت فایر؟ مهم نیست - مانند Kindles، آنها تقریباً سال به سال یکسان بوده اند. با این حال، سری جدید تبلت های این"}, {"source": "Ars Technica", "title": "Amazon builds 1,000th satellite, will launch space internet service by end of year", "link": "https://arstechnica.com/space/2026/10/amazon-builds-1000th-satellite-is-weeks-away-from-space-internet-rollout/", "summary": "The world's largest retailer wants to sell you something else—Internet from space. Amazon has been developing a constellation of satellites to deliver broadband Internet from low-Earth orbit for the better part of a decade, and the company is just about ready to pull back the curtain. It is entering a market that SpaceX, with its Starlink Internet, has dominated for the last half-decade. Amazon's debut into satellite Internet is being closely watched, not just by some consumers, but by businesses ranging from airlines to shipping companies to governments. Broadband Internet from orbit has proven broadly useful for a lot of purposes, from video games to commerce to warfighting. But until now, most people had to buy it from Elon Musk and SpaceX. OneWeb has only offered limited services, leaving Amazon as the only real competitor to deliver high-speed Internet globally. Moreover, at the head of the company's broadband efforts is Rajeev Badyal, who led Starlink during its early years, but whom Musk fired eight years ago for moving too cautiously on Starlink. Read full article Comments", "date_str": "2026-10-08T15:28:36+00:00", "hash": "01cd85b22c7a8fe2", "title_fa": "آمازون هزارمین ماهواره را می سازد و تا پایان سال سرویس اینترنت فضایی را راه اندازی می کند", "summary_fa": "بزرگترین خرده فروش جهان می خواهد چیز دیگری را به شما بفروشد - اینترنت از فضا. آمازون در بخش عمده ای از یک دهه در حال توسعه مجموعه ای از ماهواره ها برای ارائه اینترنت پهن باند از مدار پایین زمین بوده است و این شرکت تقریباً آماده است تا پرده را کنار بزند. این شرکت در حال ورود به بازاری است که اسپیس ایکس با اینترنت Starlink خود در نیم دهه گذشته بر آن تسلط داشته است. اولین ورود آمازون به اینترنت ماهواره ای، نه فقط توسط برخی از مصرف کنندگان، بلکه توسط مشاغل مختلف از خطوط هوایی گرفته تا شرکت های حمل و نقل و دولت ها به دقت زیر نظر گرفته می شود. اینترنت پهن باند از مدار به طور گسترده برای بسیاری از اهداف، از بازی های ویدیویی گرفته تا تجارت و جنگ جنگی مفید است. اما تاکنون اکثر مردم مجبور بودند آن را از ایلان ماسک و اسپیس ایکس خریداری کنند. OneWeb تنها خدمات محدودی ارائه کرده است و آمازون را به عنوان تنها رقیب واقعی برای ارائه اینترنت پرسرعت در سطح جهانی باقی می گذارد. علاوه بر این، در رأس تلاش‌های این شرکت برای پهنای باند، راجیو بدیال قرار دارد که در سال‌های اولیه استارلینک را رهبری می‌کرد، اما ماسک هشت سال پیش او را به دلیل حرکت بیش از حد محتاطانه در استارلینک اخراج کرد. خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش به حداقل برسانید بزرگترین خرده فروش جهان می خواهد چیز دیگری به شما بفروشد—اینترنت از فضا. در یک مصاحبه گسترده این هفته با بدیال و دو مقام ارشد دیگر آمازون که این صورت فلکی را توسعه می دهند – پل پالسیسکو، مدیر تولید؛ و کریس وبر، معاون بازرگانی - Ars توانست متوجه"}, {"source": "Wired", "title": "Dunking on Dating App Profiles Is Content Gold. People Are Getting Sick of It", "link": "https://www.wired.com/story/dunking-on-dating-app-profiles-is-content-gold-people-are-getting-sick-of-it/", "summary": "Relationship coaches, TikTokers, and disgruntled singles alike frequently shame bad profiles, as more apps experiment with blocking screenshots.", "date_str": "2026-10-09T11:00:00+00:00", "hash": "2fae87737705a17a", "title_fa": "غوطه ور شدن در نمایه های برنامه دوستیابی طلای محتوا است. مردم از آن بیمار می شوند", "summary_fa": "مربیان روابط، TikTokers و مجردهای ناراضی به طور یکسان اغلب نمایه های بد را شرمنده می کنند، زیرا برنامه های بیشتری با مسدود کردن اسکرین شات ها آزمایش می کنند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان برای بشارت دادن به 512,000 دنبال کننده TikTok خود، گاهی اوقات مجبور می شود که مربی دوستیابی چاد فرانکلین، ارتباطات خصوصی مشتریان خود را که بیش از 5000 دلار برای خدمات او پرداخت می کنند، پست کند. در ماه سپتامبر، فرانکلین یک مکالمه DM را به اشتراک گذاشت که در آن زنی به طور ضمنی گفت که نمی‌تواند اوبر را بخرد، با متنی با متن \"با زنان فقیر قرار ملاقات نگذارید!!!\" در همان ماه، او ویدئویی از تبادل متن موفق مشتری در Hinge آپلود کرد که در آن آنها در مورد نیاز به \"لاس زدن بر سر برخی از مارگاریتاها\" صحبت کردند. در این کلیپ، فرانکلین به سختی می‌تواند جلوی خود را بگیرد، و خاطرنشان می‌کند که این نوع چهره‌ای است که «دیک» او را سخت می‌کند: «این چیزی است که مردان به دنبال آن هستند. ما رهبری می کنیم، شما دنبال کنید.» فرانکلین با نام مستعار @DefundSimping پست می‌گذارد، و وظیفه خود را برای کمک به مردانی که در دوران «پس از جدایی، پس از طلاق» قرار دارند، کرده است ن در تحقیقات مربوط به تقلب در رأی دهندگان فدرال نقش محوری دارد. به طور خاص، تحقیقات امنیت داخلی (HSI) - یکی از دو مؤلفه اصلی ICE - با ابزارهای آزمایشگاهی نوآوری (که در داخل به عنوان iLab شناخته می‌شود) در حال توسعه تلاش برای کشف تقلب در رأی‌دهندگان است. چینمای شارما، دانشیار دانشکده حقوق فوردهام که ابزار پشتیبانی شده توسط Palantir به نام ELITE را از نزدیک ردیابی کرده است، به WIRED می‌گوید: به نظر می‌رسد ICE می‌خواهد «سیستمی بسازد که در تعیین چگونگی یافتن افرادی برای تحقیق و اقدام احتمالی علیه آنها خوب عمل کند». شارما می‌گوید: «شما می‌خواهید از آنچه در حال حاضر وجود دارد، چیزی که ممکن است زیرساخت‌ها و منابع داده‌ای که می‌خواهید داشته باشد، بسازید."}, {"source": "Wired", "title": "Inside Elon Musk’s Midterm Spending Spree", "link": "https://www.wired.com/story/uncanny-valley-podcast-inside-elon-musks-midterm-spending-spree/", "summary": "This week on “Uncanny Valley,” we discuss where Elon Musk’s PAC is spending millions, the latest ideology Trump claims is dangerous, and the backlash against the designer behind Muse’s logo.", "date_str": "2026-10-08T21:14:12+00:00", "hash": "2daf1467218437d8", "title_fa": "در ولگردی و ولگردی میان ترم ایلان ماسک", "summary_fa": "این هفته در «دره غیرمعمول»، ما در مورد جایی که PAC ایلان ماسک میلیون‌ها دلار خرج می‌کند، آخرین ایدئولوژی که ترامپ ادعا می‌کند خطرناک است، و واکنش شدید علیه طراح لوگوی Muse بحث می‌کنیم. Loader Save Story ذخیره این داستان نظر Loader Save Story ذخیره این داستان این هفته در Uncanny Valley، زوئه شیفر و لیا فایگر به این موضوع می پردازند که چگونه PAC آمریکا متعلق به ایلان ماسک میلیون ها دلار را برای متاثرترین رقابت های سنا در انتخابات میان دوره ای 2026 خرج می کند - و اینکه چگونه بیشتر این پول به جمهوری خواهان خرج می شود تا طرفداران مخالف. آنها همچنین نوع دوستی مؤثر را شکستند، فلسفه ای که زمانی در کانون بحث ایمنی هوش مصنوعی قرار داشت و اینکه چرا دولت ترامپ آن را یک ایدئولوژی خطرناک نامیده است. به علاوه، آنها در مورد واکنش شدید علیه طراح گرافیک که لوگوی دستیار هوش مصنوعی متا، Muse را ایجاد کرده است، صحبت می کنند. می‌توانید Zoë Schiffer را در Bluesky در @zoeschiffer و Leah Feiger را در Bluesky در @leahfeiger دنبال کنید. برای ما در [email protected] بنویسید. همیشه می‌توانید از طریق پخش‌کننده صوتی در این صفحه به پادکست این هفته گوش دهید، اما اگر می‌خواهید برای دریافت هر قسمت به صورت رایگان مشترک شوید، به این صورت است: اگر از iPhone یا iPad استفاده می‌کنید، برنامه‌ای به نام پادکست را باز کنید یا فقط روی این پیوند ضربه بزنید. همچنین می‌توانید برنامه‌ای مانند Overcast یا Pocket Casts را دانلود کنید و «دره غیرعادی» را جستجو کنید. ما هم در Spotify هستیم. توجه: این یک رونوشت خودکار است که ممکن است حاوی خطا باشد. لیا فایگر: سلام به همه، این لیا است. می‌خواستیم با شما به اشتراک بگذاریم که Uncanny Valley فینالیست نه یک یا دو، بلکه سه جایزه سیگنال است. داوران برنده را انتخاب"}, {"source": "Wired", "title": "She Designed Meta’s New AI Logo. Then Came the Hate", "link": "https://www.wired.com/story/she-designed-metas-new-ai-logo-then-came-the-hate/", "summary": "Jessica Hische knew working for Meta might upset some people. But she didn’t anticipate just how angry they would get.", "date_str": "2026-10-08T19:30:00+00:00", "hash": "16b482a04306ccb6", "title_fa": "او لوگوی جدید هوش مصنوعی متا را طراحی کرد. سپس نفرت آمد", "summary_fa": "جسیکا هیشه می‌دانست که کار کردن برای متا ممکن است باعث ناراحتی برخی افراد شود. اما او پیش بینی نمی کرد که چقدر عصبانی می شوند. Loader Save Story ذخیره این داستان نظر Loader Save Story Save this Story Jesscia Hische هنرمند حروف‌نویس منطقه خلیج می‌دانست که وقتی در یک کنسرت مستقل برای طراحی لوگوی M برای دستیار جدید هوش مصنوعی متا، Muse شرکت کرد، مطمئناً برخی از مردم را عصبانی می‌کرد. او به من می گوید: «هوش مصنوعی چنین ریل سومی است و متا چنین ریل سومی است. این خبر به سرعت در Threads منتشر شد، جایی که ده‌ها تن از طراحان همکار از Hische برای فروش انتقاد کردند. او با تلاش برای توضیح این تصمیم به افراد متنفر پاسخ داد: \"در سال گذشته، من تقریباً 2 تا 4 لیست حقوق و دستمزد در هر زمان در حساب خود دارم، که اگر صاحب یک تجارت کوچک هستید، می دانید که بسیار نامطمئن است.\" او اضافه کرد که 100000 دلار نیز در Studioworks، یک پلتفرم مدیریتی که برای خلاقان اداره می‌کند، و 30،000 دلار در Drawling، فروشگاه هنری او برای بچه‌ها در اوکلند، که میزبان کلاس‌ها و کارگاه‌ها است، سرمایه‌گذاری کرده است. او افزود: \"من 4 نفر شامل خودم، مادرم و دو کارمند مغازه در لیست حقوق و دستمزد دارم.\" به نظر نمی رسید هیچ چیز او کمک کند. یکی از کاربران نوشت: «منزجرم». \"این در مورد پول نیست، بلکه در مورد اخلاق است.\" شخص دیگری در پاسخ گفت: «انجام این کار مانند ضربه زدن به اوباش است و بعداً وقتی اوباش شما را بیرون می‌کشد، غافلگیر شوید.» سایر کاربران عکس‌هایی از خانه هیچه منتشر کردند و در مورد ثروت و امور مالی او حدس و گمان می‌کردند. هیچه انتظار داشت از جامعه هنرمندان واکنشی نشان دهد، اما سطح سرزنده او را غافلگیر کرد. حتی اگر مردم متا را دوست"}, {"source": "Wired", "title": "Trump Administration Cuts Off Access to a Major Immigration Program for Workers at Microsoft and Adobe", "link": "https://www.wired.com/story/trump-administration-crackdown-microsoft-adobe-immigration/", "summary": "“There has been no company in the United States, unfortunately, that has abused this system more than Microsoft,” Vice President JD Vance said on Thursday.", "date_str": "2026-10-08T19:11:45+00:00", "hash": "2dc1e21856474d6d", "title_fa": "دولت ترامپ دسترسی به یک برنامه مهاجرتی بزرگ را برای کارگران مایکروسافت و ادوبی قطع کرد", "summary_fa": "معاون رئیس جمهور جی دی ونس روز پنجشنبه گفت: \"متاسفانه هیچ شرکتی در ایالات متحده وجود نداشته است که از این سیستم بیشتر از مایکروسافت سوء استفاده کرده باشد.\" Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان دولت ترامپ دیگر اجازه نمی دهد مایکروسافت و سایر شرکت های فناوری در برنامه ای شرکت کنند که به دارندگان ویزای H-1B اجازه می دهد برای گرین کارت، یکی از رایج ترین مسیرها برای کارگران ماهر خارجی که به دنبال اقامت دائم در ایالات متحده هستند، درخواست دهند. علاوه بر مایکروسافت، مقامات دولتی روز پنجشنبه گفتند که غول نرم‌افزاری Adobe و شرکت‌های فناوری اطلاعات از جمله Cognizant، Infosys و Tata از برنامه PERM، برنامه صدور گواهینامه کار دائمی وزارت کار، تعلیق خواهند شد. PERM یک گام کلیدی برای دارندگان ویزای H-1B برای کسب اقامت دائم است و کارفرمایان را ملزم می کند ثابت کنند که هیچ کارگر آمریکایی وجود ندارد که برای فرصت شغلی دائمی متقاضی مناسب باشد. کیت ساندرلینگ، وزیر کار، گفت که آژانس در حال بررسی است که آیا این شرکت‌ها مرتکب کلاهبرداری شده‌اند و با استخدام کارمندان خارجی، کارگران آمریکایی را زیر پا گذاشته‌اند. در همین حال، معاون رئیس جمهور، جی دی ونس، مایکروسافت را متمایز کرد. ونس طی یک کنفرانس مطبوعاتی گفت: متاسفانه هیچ شرکتی در ایالات متحده وجود نداشته است که از این سیستم بیشتر از مایکروسافت سوء استفاده کرده باشد. در بیانیه ای که توسط نماینده مایکروسافت، کیتلین هاسکینز ارائه شد، این شرکت گفت: «تنها درخواست های H-1B را برای کسانی ارسال می کند که استانداردهای سختگیرانه این دسته ویزا را برآورده می کنند، و افزود که با تقویت خط لوله استعدادیابی این کشور، استخدام کارگران آمریکایی و جذب بهترین استعدادها از سراسر جهان، نیروی کار خود را توسعه می دهد."}, {"source": "Wired", "title": "38 Best Last-Minute Prime Day Deals You Can Still Shop Today (2026)", "link": "https://www.wired.com/story/absolute-best-amazon-prime-day-deals-10-08-2026/", "summary": "Prime Day might be over, but the discounts are still going. We’ve tracked down the best last minute Prime Day deals on all the gear our team recommends.", "date_str": "2026-10-08T17:49:06+00:00", "hash": "bec79ddc26179dfd", "title_fa": "38 بهترین پیشنهاد روز اول لحظه آخری که هنوز هم می‌توانید امروز خرید کنید (2026)", "summary_fa": "ممکن است روز پرایم تمام شده باشد، اما تخفیف ها همچنان ادامه دارند. ما بهترین معاملات لحظه آخری Prime Day را در تمام تجهیزاتی که تیم ما توصیه می کند، ردیابی کرده ایم. این داستان را ذخیره کنید Save Story Save this Story فروش پاییزی پرایم روز آمازون – که به عنوان Big Deal Days 2026 نیز شناخته می شود – رسما به پایان رسیده است. فروش از 6 اکتبر شروع شد و تا نیمه شب 7 اکتبر ادامه داشت. ممکن است بزرگترین معاملات را از دست داده باشید، اما مجموعه ای از تخفیف ها برای خرید وجود دارد که هنوز موجود است. ما دو روز گذشته را صرف بررسی همه معاملات کر epfakes", "summary": "Italian Prime Minister Giorgia Meloni has applied to trademark her voice at the European Union Intellectual Property Office (EUIPO). The EUIPO record lists a sound mark filed on 5 October in her own name, as an individual, through the Italian firm Praxi Intellectual Property. As of 9 October, the application was still under examination. The [ ] This story continues at The Next Web", "date_str": "2026-10-09T12:37:26+00:00", "hash": "af3fb8f46741acdc", "title_fa": "جورجیا ملونی فایل هایی را برای علامت تجاری صدای خود در برابر دیپ فیک های هوش مصنوعی ثبت می کند", "summary_fa": "جورجیا ملونی، نخست وزیر ایتالیا، درخواست کرده است که صدای خود را در دفتر مالکیت معنوی اتحادیه اروپا (EUIPO) علامت تجاری قرار دهد. رکورد EUIPO یک علامت صوتی را که در 5 اکتبر به نام خودش، به عنوان یک فرد، از طریق شرکت ایتالیایی Praxi Intellectual Property ثبت شده، فهرست می‌کند. از 9 اکتبر، درخواست هنوز در دست بررسی بود. [ ] این داستان در The Next Web ادامه دارد. علامت یک ضبط چهار ثانیه ای است که در آن ملونی دو بار می گوید «Io sono Giorgia Meloni» («من جورجیا ملونی هستم»). رویترز گزارش داد که دفتر او این پرونده را تأیید کرد و آن را اقدامی برای محافظت از خود در برابر دیپ‌فیک‌های تولید شده توسط هوش مصنوعی توصیف کرد. این اپلیکیشن سه دسته از کالاها و خدمات را پوشش می دهد. آنها شامل فایل‌های چندرسانه‌ای قابل دانلود و ضبط، و انتشار کتاب، روزنامه و مجلات می‌شوند. آنها همچنین سازماندهی کنفرانس ها، رویدادهای فرهنگی و سرگرمی های زنده و سازماندهی میتینگ های سیاسی را پوشش می دهند. «Io sono Giorgia» خطی از سخنرانی رالی 2019 است که بعداً به یک پیست دیسکو تبدیل شد. به گزارش رویترز، ملونی از آن به عنوان عنوان زندگی نامه خود در سال 2021 استفاده کرد. در سال 2024، او یک پرونده مدنی علیه مردی از ساردینیا مطرح کرد که متهم به ساخت و ارسال تصاویر مستهجن عمیق از او بود. به گزارش رویترز، این پرونده همچنان در جریان است. در ماه مه امسال، تصاویر دستکاری شده ملونی در فضای مجازی منتشر شد، از جمله تصویری که او را با لباس زیر نشان می داد. او در یک پست فیس بوک هشدار داد که دیپ فیک می تواند هر کسی را فریب دهد و ایی که کاربران را به سایر برنامه های اجتماعی وارد می کند پشتیبانی نمی کند، اگرچه پروفایل ها می توانند به وب سایت های رقیب پیوند دهند. این اقدام به دنبال هفته‌ها تنش عمومی بین این دو شرکت بر سر ایمنی کودکان صورت گرفت. در ماه اوت، متا با توافقی به ارزش حدود 18 میلیارد دلار با ایالت های ایالات متحده موافقت کرد و محدودیت های زمانی روزانه و محدودیت های شبانه را برای کاربران جوان پذیرفت. بخشی از پرداخت به رقبا بستگی دارد که اقدامات مشابهی را اتخاذ کنند. متا از آن زمان از TikTok و YouTube خواسته است که شرایط یکسانی را بپذیرند. Axios گزارش داد که TikTok در ماه سپتامبر تبلیغات متا را که از آن خواسته شده بود به این معامله بپیوندد رد کرد و گفت که آنها قوانین آن را در مورد محتوای سیاسی زیر پا گذاشته اند. در"}, {"source": "The Next Web", "title": "Zuckerberg called Muse ready despite the risks, New York Times reports", "link": "https://thenextweb.com/news/zuckerberg-muse-launch-safety-concerns-nyt", "summary": "In August, Mark Zuckerberg met Meta’s chief AI officer, Alexandr Wang, and its head of AI product, Nat Friedman, Eli Tan reported for The New York Times on Friday. They discussed Instinct, a 14-person start-up whose AI agent was taking off. Zuckerberg told them Muse was ready to launch despite the risks, according to three [ ] This story continues at The Next Web", "date_str": "2026-10-09T11:52:17+00:00", "hash": "637e78c9d3105dcb", "title_fa": "نیویورک تایمز گزارش می دهد که زاکربرگ میوز را با وجود خطرات آماده خواند", "summary_fa": "الی تان روز جمعه برای نیویورک تایمز گزارش داد، در ماه آگوست، مارک زاکربرگ با الکساندر وانگ، مدیر ارشد هوش مصنوعی متا و نات فریدمن، رئیس محصول هوش مصنوعی آن ملاقات کرد. آنها درباره Instinct، یک استارت آپ 14 نفره که عامل هوش مصنوعی آن در حال راه اندازی بود، صحبت کردند. زاکربرگ به آنها گفت که Muse با وجود خطرات آماده راه اندازی است، طبق سه [ ] این داستان در The Next Web ادامه دارد دو نفر از آن افراد به تایمز گفتند که وانگ و فریدمن از نگرانی های ایمنی ناشی از آزمایش های اخیر اطلاع داشتند. در یک مورد، Muse رمز عبور کاربر را بدون اجازه تغییر داد. TNW به طور مستقل حساب را تأیید نکرده است. سخنگوی متا مخالفت کرد که فشار Instinct باعث پرتاب Muse شده است. او در بیانیه‌ای به تایمز گفت: «ما به این کار افتخار می‌کنیم و همانطور که علناً گفته‌ایم، حتی ارسال Muse را برای چند ماه به تعویق انداختیم تا مطمئن شویم که این کار را درست انجام داده‌ایم.» سخنگوی متا در بیانیه ای به نیویورک تایمز در ژوئیه 2025، زاکربرگ یادداشتی در مورد \"فوق هوش شخصی\" منتشر کرد، نوعی از هوش مصنوعی که به گفته او می تواند به عنوان دستیار نهایی عمل کند. تایمز گزارش داد که او وانگ و فریدمن را برای رهبری کار استخدام کرده بود. در نوامبر 2025، پیتر اشتاینبرگر، برنامه نویس اتریشی، OpenClaw را منتشر کرد. این یک عامل منبع باز است که کد می نویسد و به تنهایی از رایانه استفاده می کند. ویشال شاه، معاون محصولات هوش مصنوعی متا، به تایمز گفت که مدیران پس از آن محصول مصرفی بعدی را به عنوان یک نماینده شخصی می‌دانستند. به گفته این روزنامه، فریدمن پس از آزمایش OpenClaw، 200 مک مینی، رایانه هایی که عامل روی آن ها کار می کند، به دفتر"}, {"source": "The Next Web", "title": "President Donald Trump says anyone using the term ‘artificial intelligence’ is ‘the enemy’", "link": "https://thenextweb.com/news/trump-artificial-intelligence-enemy-super-intelligence", "summary": "US President Donald Trump wrote on Truth that the White House sees anyone who says “artificial intelligence” instead of “super intelligence” as “THE ENEMY”. “The White House considers anyone that uses the term, “Artificial Intelligence,” as opposed to the highly accepted new and more accurate term, “Super Intelligence,” THE ENEMY! President DONALD J. TRUMP The [ ] This story continues at The Next Web", "date_str": "2026-10-09T11:39:54+00:00", "hash": "28ea423943820bc0", "title_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا می‌گوید هر کسی که از اصطلاح هوش مصنوعی استفاده می‌کند، «دشمن» است.", "summary_fa": "دونالد ترامپ، رئیس‌جمهور آمریکا در روزنامه حقیقت نوشت که کاخ سفید هر کسی را که به جای «فوق هوش» می‌گوید «هوش مصنوعی» را «دشمن» می‌بیند. کاخ سفید هر کسی را که از اصطلاح «هوش مصنوعی» استفاده می‌کند، برخلاف اصطلاح جد
