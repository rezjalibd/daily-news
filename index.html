  </style>

 جدید تامین اجتماعی انتقاد کرد و هشدار داد وقتی حقوق کفاف هزینه‌های یک ماه را نمی‌دهد، پرداخت اعتبار خرید از محل مستمری ماه بعد گرهی از معیشت بازنشستگان باز نخواهد کرد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/a3845925d382c214847770588fc5950ce9b33f4e-1280x853.jpg?rect=0,91,1280,672&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۸ آبان • ۱۲:۲۶"}, {"source": "Radio Farda", "title": "توقف تولید در یکی از بزرگ‌ترین میادین گازی کردستان عراق به‌دنبال حمله پهپادی", "link": "https://www.radiofarda.com/a/attack-on-iraq-gas-complex-cuts-supply/33893666.html", "summary": "علی الزیدی، نخست‌وزیر عراق دستور تحقیق درباره حمله به میدان گازی خورمور در استان سلیمانیه، واقع در اقلیم کردستان عراق، را صادر کرده است.", "date_str": "2026-11-09T08:04:50+00:00", "hash": "d4023ee498d900b8", "title_fa": "توقف تولید در یکی از بزرگ‌ترین میادین گازی کردستان عراق به‌دنبال حمله پهپادی", "summary_fa": "علی الزیدی، نخست‌وزیر عراق دستور تحقیق درباره حمله به میدان گازی خورمور در استان سلیمانیه، واقع در اقلیم کردستان عراق، را صادر کرده است. حمله پهپادی به میدان گازی «خور مور» در اقلیم کردستان عراق باعث توقف تولید در این میدان گازی بزرگ در نزدیکی سلیمانه شد. این حمله، یکشنبه شب، ۱۷ آبان، رخ داد و به گفته وزارت برق کردستان عراق، در پی آن، حدود ۲.۸ گیگاوات از ظرفیت تولید برق در منطقه از مدار خارج شد. به‌دنبال این حمله که گفته شده بر اثر برخورد پهپاد با مخزن ذخیره‌سازی گاز مایع رخ داد، آتش‌سوزی بزرگی ایجاد شد و ستونی از دود از این میدان به هوا رفت. شرکت اماراتی «دانا گاز» که بهره‌برداری مشترک از میدان گازی «خور مور» را بر عهده دارد، روز دوشنبه در بیانیه‌ای اعلام کرد تولید در این میدان در پی حمله متوقف شده است. این شرکت با اعلام مهار آتش‌سوزی گفته است این حادثه تلفات جانی به همراه نداشت و ارزیابی خسارات ناشی از آن ادامه دارد. وزارتخانه‌های منابع طبیعی و برق منطقه کردستان در بیانیه‌ای مشترک، این حادثه را یک «حمله تروریستی» توصیف کرده و گفته‌اند در تلاشند تا پیامدهای آن را به حداقل برسانند. اسکای‌نیوز عربی نیز گزار شی از این مسیر را نخواهد داد. در همین ارتباط، «محمدرضا نقدی»، مشاور فرمانده کل سپاه پاسداران، پیش‌تر اعلام کرده بود که نیروهای جمهوری اسلامی به‌زودی تعداد محدودی از مسیرهایی را که به گفته او با انفجار و تخریب صخره‌های تنگه هرمز ایجاد شده‌اند، مسدود خواهند کرد. مقام‌های جمهوری اسلامی در ماه‌های اخیر عبور نفتکش‌ها از مسیرهای خارج از کنترل سپاه پاسداران در تنگه هرمز را غیرقانونی خوانده و از آن با عنوان «قاچاق نفت» یاد کرده‌اند. در گزارش فارس مشخص نشده که سامانه‌های کمک‌ناوبری مورد اشاره در چه زمانی، با استفاده از چه تجهیزاتی و توسط کدام یگان نظامی منهدم شده‌اند. همچنین تاکنون اطلاعات مستقلی درباره میزان خسارت واردشده به این سامانه‌ها یا توقف کامل تردد نفتکش‌ها از مسیر جنوبی تنگه هرمز منتشر نشده است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%8C%DA%A9_rXLu__v1024x512__box_0%2C22%2C1200%2C653.jpeg", "category": "امنیت سایبری و شبکه", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۸ آبان • ۱۲:۰۹"}, {"source": "Euronews Persian", "title": "سنگال؛ مدرسه موج‌سواری داکار به جوانان آفریقایی برای بازپس‌گیری موج‌ها کمک می‌کند", "link": "https://parsi.euronews.com/video/2026/11/09/senegal-dakar-surf-school-helps-young-africans-reclaim-the-waves", "summary": "در سواحل داکار، یک مدرسه موج‌سواری موج‌ها را برای کودکان محلی دسترس‌پذیر کرده است. بنیان‌گذار آن، ابرا سامب، که روی تخته سه‌لا موج‌سواری آموخت، امیدوار است نسل تازه‌ای را الهام کند.", "date_str": "2026-11-09T08:35:21+00:00", "hash": "d4df622bd145e548", "title_fa": "سنگال؛ مدرسه موج‌سواری داکار به جوانان آفریقایی برای بازپس‌گیری موج‌ها کمک می‌کند", "summary_fa": "در سواحل داکار، یک مدرسه موج‌سواری موج‌ها را برای کودکان محلی دسترس‌پذیر کرده است. بنیان‌گذار آن، ابرا سامب، که روی تخته سه‌لا موج‌سواری آموخت، امیدوار است نسل تازه‌ای را الهام کند.", "image_url": "https://images.euronews.com/articles/stories/09/98/50/98/1200x675_c ام علی‌اف درباره بهای تسلیحات، اعمال ممنوعیت‌های ورود به کشور و برکناری یکی از مشاوران رئیس‌جمهور ترکیه از سمت خود ادامه یافت. اوج ماجرا زمانی بود که الهام علی‌اف در نشست سازمان کشورهای ترک در آنکارا شرکت نکرد. اما مقاله‌ای که در وب‌سایت نزدیک به حکومت «دی.آز» منتشر شد، نشان داد ممکن است در پس این اختلاف سیاسی و فرهنگی، مسئله‌ای ریشه‌ای‌تر وجود داشته باشد. این وب‌سایت در مقاله‌ای در ۱۸ اکتبر نوشت: «بودجه جمهوری آذربایجان صندوق ذخیره حکومت ترکیه نیست!» و این موضوع، پرسش دیگری را مطرح کرد: در رابطه «یک ملت، دو دولت»، مسئله پول از کجا آغاز می‌شود و برادری کجا پایان می‌یابد؟ اگر این وب‌سایت بازتاب‌دهنده فضای درون حکومت باشد، پیام باکو را می‌توان این‌گونه خواند: جمهوری آذربایجان همچنان یکی از بزرگ‌ترین سرمایه‌گذاران و نزدیک‌ترین متحدان ترکیه خواهد بود، اما نمی‌خواهد به پشتوانه مالی آن تبدیل شود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. شرکت دولتی انرژی جمهوری آذربایجان بزرگ‌ترین سرمایه‌گذار خارجی در ترکیه است. بر اساس اعلام مدیریت سوکار ترکیه، مجموع سرمایه‌گذاری‌های این شرکت در حوزه انرژی، پتروشیمی و لجستیک از ۱۸ میلیارد دلار فراتر رفته است.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/a9ed/live/01f4fe60-d5eb-11f1-bfdd-73f39e6db31d.png", "category": "استارتاپ و سرمایه‌گذاری", "tags": ["سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۱۱:۱۲"}, {"source": "Iran International", "title": "پدر بسکتبالیست مصدوم آکادمی سحر: پای دخترم خرد شده، چه کسی پاسخگو است؟", "link": "https://www.iranintl.com/202611096540", "summary": "پدر پریا مهرمند، بسکتبالیست ۱۵ ساله مصدوم در واژگونی اتوبوس تیم آکادمی سحر، از خرد شدن پای دخترش و آسیب شدید به شریان‌های آن خبر داد و با انتقاد از شرایط سفر تیم پرسید: «چه کسی پاسخگوی خانواده‌ها خواهد بود؟»", "date_str": "2026-11-09T08:01:42+00:00", "hash": "44253340a4438e4a", "title_fa": "پدر بسکتبالیست مصدوم آکادمی سحر: پای دخترم خرد شده، چه کسی پاسخگو است؟", "summary_fa": "پدر پریا مهرمند، بسکتبالیست ۱۵ ساله مصدوم در واژگونی اتوبوس تیم آکادمی سحر، از خرد شد 066f02f8f5fc6c0c7d-1080x1350.jpg?rect=0,74,1080,567&w=1200&h=630&q=66&fit=max&auto=format", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۰:۴۹"}, {"source": "Radio Farda", "title": "ترامپ می‌گوید به‌خاطر ترجیح برخی همسایگان ایران، احتمالاً درباره شروع حملات صبر کند", "link": "https://www.radiofarda.com/a/trump-says-he-is-highly-unlikely-to-order-iran-strikes/33893611.html", "summary": "دونالد ترامپ در اظهارات خود تأکید کرد که حملات آمریکا به تأسیسات هسته‌ای جمهوری اسلامی مانع نابودی اسرائیل شد.", "date_str": "2026-11-09T06:58:09+00:00", "hash": "bef517bd69370fad", "title_fa": "ترامپ می‌گوید به‌خاطر ترجیح برخی همسایگان ایران، احتمالاً درباره شروع حملات صبر کند", "summary_fa": "دونالد ترامپ در اظهارات خود تأکید کرد که حملات آمریکا به تأسیسات هسته‌ای جمهوری اسلامی مانع نابودی اسرائیل شد. دونالد ترامپ، رئیس جمهور آمریکا، از آغاز اعمال محاصره زمینی ایران در شمال و نیز تأثیر محاصره دریایی این کشور تقدیر کرد و گفت برخی کشورهای همسایه ایران ترجیح می‌دهند وضعیت کنونی ادامه یابد. او یکشنبه شب، ۱۷ آبان در چند اظهارنظر مختلف درباره جمهوری اسلامی، این اظهارات را بیان کرد. رئیس‌جمهور آمریکا یکشنبه شب پیش از عزیمت به واشینگتن‌ دی‌سی در فلوریدا، به خبرنگاران گفت برخی همسایگان ایران ترجیج می‌دهند وضعیت کنونی ادامه پیدا کند و بر این مبنا ممکن است صبر کنیم. به گفته دونالد ترامپ آمریکا در جنگ با ایران پیروز شده و حالا تنها موضوع این است که جنگ را همین الان تمام کنیم یا بعداً. دونالد ترامپ ساعتی پیش از بیان این اظهارات، پیامی را در شبکه اجتماعی تروث ‌سوشال درباره عملیات «دروازه آهنین» منتشر کرده بود. او نوشته بود: «کارگروه ویژه دروازه آهنین در ایران با تمام توان در حال اجراست. در کنار بزرگ‌ترین محاصره دریایی تاریخ، تقریبا هیچ‌چیز وارد ایران نمی‌شود یا از آن خارج نمی‌شود.» اشاره رئیس جمهور آمریکا به برنامه‌ای است که فرماندهی مرکزی ارتش آمریکا، سنتکام به تازگی از اجرایش در ایران خبر داده است. سنتکام گفته بود کارگروه جدید برای جلوگیری از انتقال تسلیحات پیشرفته، فناوری‌های دارای کاربرد دوگانه و دیگر اقلام مشمول تحریم از طریق مرزهای زمینی ایران و دری لام‌گرای سنی، اصلاح‌طلبان لیبرال و طرفدار دموکراسی، فعالان حقوق شیعیان و منتقدان مستقل است. یکی از سازمان‌یافته‌ترین اشکال اپوزیسیون «حزب مجمع ملی» است که کنشگرانی با پیشینه‌های مختلف را گرد هم آورده است. رسانه‌های مخالف حکومت نیز وجود دارند، از جمله شبکه‌های تلویزیونی «الاصلاح» و «نبا» که ویدیوهایشان در یوتیوب صدها هزار بار دیده می‌شود. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. با شدت گرفتن حملات حوثی‌ها به عربستان در ماه اکتبر، مخالفان سعودی در تبعید، انتقاد از نحوه مدیریت جنگ از سوی حکومت را افزایش دادند و آن را شکستی توصیف کردند که کشور را بیش از پیش آسیب‌پذیر کرده است.", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/ceaf/live/0497f7e0-d44b-11f1-93e1-3b657b665bcf.png", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری", "سرمایه‌گذاری"], "datetime_fa": "۱۸ آبان • ۰۱:۲۳"}, {"source": "Iran International", "title": "سیما بینا برنده جایزه بیتا شد؛ هفت دهه آواز، پژوهش و ایستادگی", "link": "https://www.iranintl.com/202611086632", "summary": "سیما بینا، خواننده، آهنگساز و پژوهشگر موسیقی نواحی ایران، شامگاه شنبه ۱۶ آبان (هفتم نوامبر) شانزدهمین جایزه بیتا برای هنرهای ایرانی را در دانشگاه استنفورد آمریکا دریافت کرد.", "date_str": "2026-11-08T21:58:13+00:00", "hash": "8ae4a8c9f5d54de4", "title_fa": "سیما بینا برنده جایزه بیتا شد؛ هفت دهه آواز، پژوهش و ایستادگی", "summary_fa": "سیما بینا، خواننده، آهنگساز و پژوهشگر موسیقی نواحی ایران، شامگاه شنبه ۱۶ آبان (هفتم نوامبر) شانزدهمین جایزه بیتا برای هنرهای ایرانی را در دانشگاه استنفورد آمریکا دریافت کرد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/1bcd0dbf3b1c045180d886d2b6d445d1760bc35d-1092x574.jpg?rect=0,1,1092,573&w=1200&h=630&q=66&fit=max&auto=format", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۰۱:۲۸"}, {"source": "Iran International", "title": "اتلتیکومادرید ۱-۲ بارسلونا؛ کامبک بارسا در متروپولیتانو با دبل فرمین لوپز", "link": "https://www.iranintl.com/2026110846  مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/2405_bUWq__v1024x512__box_0%2C203%2C3800%2C2201.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۸ آبان • ۰۱:۰۴"}, {"source": "Iran International", "title": "فیورنتینا ۲-۲ یوونتوس؛ ادامه بحران در تیم اسپالتی؛ فاصله با صدر جدول به ۱۱ امتیاز رسید", "link": "https://www.iranintl.com/202611082387", "summary": "تیم فوتبال یوونتوس در هفته یازدهم سری آ ایتالیا در ورزشگاه آرتمیو فرانکی مقابل فیورنتینا به تساوی دو بر دو رسید و با ۱۸ امتیاز، شش امتیاز از میلان، تیم چهارم جدول و منطقه سهمیه لیگ قهرمانان اروپا، فاصله گرفت.", "date_str": "2026-11-08T21:48:52+00:00", "hash": "5eceee5cb5b11e0c", "title_fa": "فیورنتینا ۲-۲ یوونتوس؛ ادامه بحران در تیم اسپالتی؛ فاصله با صدر جدول به ۱۱ امتیاز رسید", "summary_fa": "تیم فوتبال یوونتوس در هفته یازدهم سری آ ایتالیا در ورزشگاه آرتمیو فرانکی مقابل فیورنتینا به تساوی دو بر دو رسید و با ۱۸ امتیاز، شش امتیاز از میلان، تیم چهارم جدول و منطقه سهمیه لیگ قهرمانان اروپا، فاصله گرفت.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/bce624543bee4ad5dfecb7e038b1df7a57b06d62-6000x4000.jpg?rect=389,955,5611,2946&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۸ آبان • ۰۱:۱۸"}, {"source": "Iran International", "title": "افشای سندی محرمانه؛ علی شمخانی با نوشتن نامه به خامنه‌ای، تجارت نفت را به پسرش برگرداند", "link": "https://www.iranintl.com/202611085031", "summary": "ایران اینترنشنال به یک سند محرمانه و اطلاعاتی اختصاصی دست یافته که نشان می‌دهد جمهوری اسلامی با تصاحب سه اسکله و هفت مخزن ذخیره نفت در چهار نقطه چین، با شیوه‌ای جدید تحریم‌های آمریکا را دور می‌زند.", "date_str": "2026-11-08T21:19:22+00:00", "hash": "fe6e4a80044c015d", "title_fa": "افشای سندی محرمانه؛ علی شمخانی با نوشتن نامه به خامنه‌ای، تجارت نفت را به پسرش برگرداند", "summary_fa": "ایران اینترنشنال به یک سند محرمانه و اطلاعاتی اختصاصی دست یافته که نشان می‌دهد جمهوری اسلامی با تصاحب سه اسکله و هفت مخزن ذخیره نفت در چهار نقطه چین، با شیوه‌ای جدید تحریم‌های آمریکا را دور می‌زند.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/c9563bc050693305c03c833ead38959b0893cde7-1920x1080.png?rect=0,36,1920,1008&w=1200&h=630&q=66&fit=max&auto=format", "category": "اقتصاد و بازرگانی", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۸ آبان • ۰۰:۴۹"}, {"source": "Iran International", "title": "محمدمهدی پارسا، از بازداشت‌شدگان اعتراضات دی‌ماه، به اعدام و ۲۰ سال حبس محکوم شد", "link": "https://www.iranintl.com/202611088742", "summary": "محمدمهدی پارسا، از بازداشت‌شدگان اعتراضات دی‌ماه ۱۴۰۴ در اهواز، به اعدام و ۲۰ سال حبس محکوم شد. هم‌زمان، هویت ابوالفضل صداقت، سومین محکوم به اعدام در پرونده‌ای در مشهد، مشخص شد و درخواست فرجام‌خواهی محبوبه شعبانی، دیگر زندانی سیاسی محکوم به اعدام در این شهر، به ثبت رسید.", "date_str": "2026-11-08T19:21:09+00:00", "hash": "5717f6253ce6a8e4", "title_fa": "محمدمهدی پارسا، از بازداشت‌شدگان اعتراضات دی‌ماه، به اعدام و ۲۰ سال حبس محکوم شد", "summary_fa": "محمدمهدی پارسا، از بازداشت‌شدگان اعتراضات دی‌ماه ۱۴۰۴ در اهواز، به اعدام و ۲۰ سال حبس محکوم شد. هم‌زمان، هویت ابوالفضل صداقت، سومین محکوم به اعدام در پرونده‌ای در مشهد، مشخص شد و درخواست فرجام‌خواهی محبوبه شعبانی، دیگر زندانی سیاسی محکوم به اعدام در این شهر، به ثبت رسید.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/84a29ee731b583550987be4d78ed09a8ad133d74-1920x1080.png?rect=0,36,1920,1008&w=1200&h=630&q=66&fit=max&auto=format", "category": "جامعه و رویدادها", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۷ آبان • ۲۲:۵۱"}, {"source": "IranWire", "title": "محمد مهدی پارسا، از بازداشت‌شدگان اعتراضات دی‌ماه به اعدام محکوم شد", "link": "https://iranwire.com/fa/news-1/159957-%D9%85%D8%AD%D9%85%D8%AF-%D9%85%D9%87%D8%AF%DB%8C-%D9%BE%D8%A7%D8%B1%D8%B3%D8%A7-%D8%A7%D8%B2-%D8%A8%D8%A7%D8%B2%D8%AF%D8%A7%D8%B4%D8%AA%D8%B4%D8%AF%DA%AF%D8%A7%D9%86-%D8%A7%D8%B9%D8%AA%D8%B1%D8%A7%D8%B6%D8%A7%D8%AA-%D8%AF%DB%8C%D9%85%D8%A7%D9%87-%D8%A8%D9%87-%D8%A7%D8%B9%D8%AF%D8%A7%D9%85-%D9%85%D8%AD%DA%A9%D9%88%D9%85-%D8%B4%D8%AF/", "summary": "محمدمهدی پارسا، از بازداشت‌شدگان اعتراضات دی‌ماه ۱۴۰۴ در اهواز، از سوی شعبه اول دادگاه انقلاب این شهر به اتهام «محاربه» به اعدام و بابت ...", "date_str": "2026-11-08T20:42:41+00:00", "hash": "008104acdef603fb", "title_fa": "محمد مهدی پارسا، از بازداشت‌شدگان اعتراضات دی‌ماه به اعدام محکوم شد", "summary_fa": "محمدمهدی پارسا، از بازداشت‌شدگان اعتراضات دی‌ماه ۱۴۰۴ در اهواز، از سوی شعبه اول دادگاه انقلاب این شهر به اتهام «محاربه» به اعدام و بابت ... به گزارش خبرگزاری هرانا، ارگان خبری مجموعه فعالان حقوق بشر در ایران، این حکم ۱۱ آبان ۱۴۰۵ از سوی شعبه اول دادگاه انقلاب اهواز به ریاست قاضی احسان ادیبی‌مهر صادر شده است. بر اساس حکم دادگاه، پارسا به اتهام محاربه از طریق مشارکت در تخریب یک بانک دولتی در اهواز به اعدام محکوم شده است. دادگاه همچنین او را به اتهام شرکت در تجمعات غیرقانونی به ۱۰ سال حبس و به اتهام همکاری با دول متخاصم به ۱۰ سال حبس دیگر محکوم کرده است. یک منبع مطلع نزدیک به این شهروند به هرانا گفته است که پارسا در جریان رسیدگی قضایی به پرونده‌اش از حق دسترسی به وکیل تعیینی محروم بوده است. به گفته این منبع، شامگاه ۱۸ دی ۱۴۰۴ و هم‌زمان با اعتراضات در اهواز، یک بانک دولتی تخریب شد و پس از آن برای شماری از معترضان پرونده قضایی تشکیل شد. محمدمهدی پارسا، اهل قلعه‌تل در استان خوزستان، ۲۱ دی ۱۴۰۴ در اهواز بازداشت و سپس به زندان شیبان منتقل شد. او همچنان در این زندان محبوس است. در این بخش ایران وایر می‌توانید با مسوولان تماس بگیرید و کارزار خود را برای مشکلات مختلف راه‌اندازی کنید با ایران‌وایر همکاری کنید ویدیوها و مطالب خود را برای ما بفرستید", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/Poonak_Tehran_2026_gYKR__v1024x512__box_0%2C288%2C1279%2C960.jpeg", "category": "اقتصاد و بازرگانی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۸ آبان • ۰۰:۱۲"}, {"source": "Iran International", "title": "هرتزوگ با هشدار درباره تهدیدهای جمهوری اسلامی، آیزنکوت را مامور تشکیل دولت کرد", "link": "https://www.iranintl.com/202611087398", "summary": "اسحاق هرتزوگ، رییس‌جمهوری اسرائیل، با هشدار درباره ادامه تهدیدهای جمهوری اسلامی، ماموریت تشکیل دولت را به گادی آیزنکوت واگذار کرد. آیزنکوت نیز با تاکید بر باز بودن جبهه‌های جنگ و محقق نشدن اهداف آن، خواستار تشکیل فوری دولت اضطراری ملی شد.", "date_str": "2026-11-08T19:57:43+00:00", "hash": "7763b7bdd1f65233", "title_fa": "هرتزوگ با هشدار درباره تهدیدهای جمهوری اسلامی، آیزنکوت را مامور تشکیل دولت کرد", "summary_fa": "اسحاق هرتزوگ، رییس‌جمهوری اسرائیل، با هشدار درباره ادامه تهدیدهای جمهوری اسلامی، ماموریت تشکیل دولت را به گادی آیزنکوت واگذار کرد. آیزنکوت نیز با تاکید بر باز بودن جبهه‌های جنگ و محقق نشدن اهداف آن، خواستار تشکیل فوری دولت اضطراری ملی شد.", "image_url": "https://i.iranintl.com/images/rdk9umy0/production/e8ad436db16c356d4b121c4e76ebe54451b9bdc3-3822x2548.jpg?rect=0,271,3822,2007&w=1200&h=630&q=66&fit=max&auto=format", "category": "سیاست و دیپلماسی", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۷ آبان • ۲۳:۲۷"}, {"source": "Radio Farda", "title": "وزیر خارجه عراق: آمریکا از ما خواسته بیشتر گذرگاه‌های مرزی با ایران را مسدود کنیم", "link": "https://www.radiofarda.com/a/fuad-hussein-us-asks-iraq-to-shut-most-iran-border-crossings/33893352.html", "summary": ".", "date_str": "2026-11-08T20:18:04+00:00", "hash": "6895fb1892265993", "title_fa": "وزیر خارجه عراق: آمریکا از ما خواسته بیشتر گذرگاه‌های مرزی با ایران را مسدود کنیم", "summary_fa": "فؤاد حسین، وزیر امور خارجه عراق، روز یکشنبه ۱۷ آبان در گفت‌وگو با شبکه الجزیره اعلام کرد وزارت خزانه‌داری آمریکا از بغداد خواسته در چارچوب سیاست واشینگتن برای افزایش فشار اقتصادی بر تهران، تمامی گذرگاه‌های مرزی با ایران به‌جز دو گذرگاه را ببندد. یکی از این دو گذرگاه مستثناشده در منطقه اقلیم کردستان قرار دارد. حسین گفت: «گذرگاه‌های مرزی رسمی و غیررسمی زیادی میان عراق و ایران وجود دارد و بستن همه آن‌ها دشوار خواهد بود و بر اقتصاد ما تأثیر می‌گذارد. آمریکایی‌ها همچنان خواستار بسته شدن این گذرگاه‌ها هستند و ما در حال حاضر در حال مذاکره با آن‌ها هستیم.» عراق اواخر مهرماه گذرگاه مرزی شِیب، چذابه در ایران، را که یکی از گذرگاه‌های پرتردد میان دو کشور است، به‌منظور بازبینی تدابیر امنیتی و نصب تجهیزات بازرسی برای جلوگیری از قاچاق، به‌طور موقت بست و شبکه الجزیره به نقل از یک مقام عراقی اعلام کرد که این اقدام به دستور مستقیم علی الزیدی، نخست‌وزیر عراق، انجام شده است. اظهارات وزیر خارجه عراق درباره فشار دولت دونالد ترامپ یک روز بعد از آن است که فرماندهی مرکزی ارتش آمریکا، سنتکام، اعلام کرد کارگروه جدید برای جلوگیری از انتقال تسلیحات پیشرفته، فناوری‌های دارای کاربرد دوگانه و دیگر اقلام مشمول تحریم از طریق مرزهای زمینی ایران و دریای خزر تشکیل می‌دهد. سنتکام اعلام کرد که این کارگروه نظامی ـ غیرنظامی با عنوان «دروازه آهنین» به دستور دریاسالار برد کوپر، فرمانده این نهاد، تشکیل می‌شود، حدود ۲۰ عضو نظامی و غیرنظامی خواهد داشت و در شهر تامپا در ایالت فلوریدا مستقر خواهد شد. این تصمیم در ادامهٔ محاصرهٔ دریایی بنادر جنوب ایران از سوی آمریکا است که پس از آغاز جنگ میان دو کشور، در دو مرحله به اجرا درآمده و واشینگتن می‌گوید صادرات نفت و منابع درآمدی جمهوری اسلامی را به‌شدت محدود کرده است. نخستین مرحلهٔ محاصرهٔ دریایی بنادر ایران روز ۲۴", "image_url": "https://gdb.rferl.org/035c0000-0aff-0242-0005-08da1ed6d966_w1200_h630.jpg", "category": "امنیت سایبری و شبکه", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۷ آبان • ۲۳:۴۸"}, {"source": "IranWire", "title": "خبرگزاری ایرنا از شنیده شدن صدای چهار انفجار در قشم خبر داد", "link": "https://iranwire.com/fa/news-1/159956-%D8%AE%D8%A8%D8%B1%DA%AF%D8%B2%D8%A7%D8%B1%DB%8C-%D8%A7%DB%8C%D8%B1%D9%86%D8%A7-%D8%A7%D8%B2-%D8%B4%D9%86%DB%8C%D8%AF%D9%87-%D8%B4%D8%AF%D9%86-%D8%B5%D8%AF%D8%A7%DB%8C-%DA%86%D9%87%D8%A7%D8%B1-%D8%A7%D9%86%D9%81%D8%AC%D8%A7%D8%B1-%D8%AF%D8%B1-%D9%82%D8%B4%D9%85-%D8%AE%D8%A8%D8%B1-%D8%AF%D8%A7%D8%AF/", "summary": "خبرگزاری ایرنا شامگاه یکشنبه ۱۷ آبان ۱۴۰۵ از شنیده‌شدن صدای چهار انفجار در جزیره قشم خبر داد و نوشت به نظر می‌رسد نقاطی در این جزیره هدف ...", "date_str": "2026-11-08T19:37:18+00:00", "hash": "11b42b8def5153b6", "title_fa": "خبرگزاری ایرنا از شنیده شدن صدای چهار انفجار در قشم خبر داد", "summary_fa": "خبرگز ارغ از گرایش سیاسی و انتخاباتی آن‌ها باشد. آیزنکوت در سخنرانی خود پس از دریافت حکم تشکیل دولت، وضعیت کنونی اسراییل را اضطراری و سرنوشت‌ساز توصیف کرد و گفت ادامه جنگ‌ها، محقق‌نشدن اهداف نظامی و بحران دیپلماتیک ویرانگر، این کشور را با چالش‌های جدی روبه‌رو کرده است. او همچنین هشدار داد که حتی برخی از نزدیک‌ترین متحدان اسراییل نیز در حال بازنگری در روابط خود با این کشور هستند. او در بخش دیگری از سخنانش، وضعیت داخلی اسراییل را یکی از آسیب‌پذیرترین مقاطع تاریخ دموکراسی این کشور خواند و نسبت به تلاش‌ها برای تضعیف مشروعیت دموکراسی و افزایش بی‌اعتمادی به نهادهای دولتی هشدار داد. رهبر حزب یاشار اعلام کرد با استفاده از ماموریتی که به او سپرده شده، برای تشکیل یک دولت اضطراری ملی اقدام خواهد کرد و این هدف به ابتکارهای سیاسی خلاقانه و خارج از چارچوب‌های معمول نیاز دارد. آیزنکوت همچنین از همه فراکسیون‌های پارلمانی، از جمله نمایندگان احزاب حامی نتانیاهو، دعوت کرد در صورت پذیرش اصول چهارگانه پیشنهادی او، از دولت آینده حمایت کنند. او تاکید کرد اتحاد ملی نباید به ابزاری برای چانه‌زنی سیاسی تبدیل شود و همه احزاب باید برای تشکیل دولت آماده مصالحه باشند.", "image_url": "https://static.prod.iranwire.com/_versions_jpeg/articleslide/%DB%B8%DB%B8%DB%B8%DB%B8%DB%B8_nKCr__v1024x512__box_0%2C147%2C2048%2C1223.jpeg", "category": "موسیقی و هنر", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۷ آبان • ۱۹:۳۰"}, {"source": "Euronews Persian", "title": "تصادف قطار در مصر؛ ۴ کشته و حدود ۹۰ زخمی در جنوب قاهره", "link": "https://parsi.euronews.com/2026/11/08/train-accident-in-egypt-4-dead-and-about-90-injured-south-of-cairo", "summary": "مقام‌های مصر می‌گویند روز یکشنبه در پی برخورد دو قطار در جنوب قاهره، پایتخت این کشور دستکم چهار نفر کشته و دست‌کم ۸۸ نفر دیگر مجروح شدند.", "date_str": "2026-11-08T16:49:34+00:00", "hash": "b994ddee6af3070e", "title_fa": "تصادف قطار در مصر؛ ۴ کشته و حدود ۹۰ زخمی در جنوب قاهره", "summary_fa": "مقام‌های مصر می‌گویند روز یکشنبه در پی برخورد دو قطار در جنوب قاهره، پایتخت این کشور دستکم چهار نفر کشته و دست‌کم ۸۸ نفر دیگر مجروح شدند.", "image_url": "https://images.euronews.com message-6af18ae8354e588119e48785?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۲:۳۵"}, {"source": "Zoomit", "title": "معاون نظارت بنیاد ملی بازی‌های رایانه‌ای: تمام بازی‌های موبایلی تا پایان سال رده‌بندی سنی می‌شوند", "link": "https://www.zoomit.ir/iran-news/470778-iran-mobile-games-age-rating/", "summary": "بنیاد ملی بازی‌های رایانه‌ای اعلام کرده است که تا پایان امسال، هیچ بازی موبایلی بدون رده‌بندی سنی در فروشگاه‌های عرضه بازی باقی نخواهد ماند.", "date_str": "2026-11-09T09:00:00+00:00", "hash": "6ab7f0d79e2cafa2", "title_fa": "معاون نظارت بنیاد ملی بازی‌های رایانه‌ای: تمام بازی‌های موبایلی تا پایان سال رده‌بندی سنی می‌شوند", "summary_fa": "بنیاد ملی بازی‌های رایانه‌ای اعلام کرده است که تا پایان امسال، هیچ بازی موبایلی بدون رده‌بندی سنی در فروشگاه‌های عرضه بازی باقی نخواهد ماند. تبلیغات رضا احمدی، معاون نظارت بنیاد ملی بازی‌های رایانه‌ای، در خصوص شیوه جدید رده‌بندی سنی بازی‌های رایانه‌ای اظهار کرد: «مدل جدید رده‌بندی سنی بازی‌های موبایلی از ۲۳ شهریور امسال و با همکاری فروشگاه‌های عرضه‌کننده آغاز شده و در کمتر از ۳۵ روز، به اندازه سه سال فعالیت با شیوه قبلی پیشرفت داشته است.» به گفته او، بنیاد از سال ۱۳۹۴ رده‌بندی سنی بازی‌های موبایلی را آغاز کرده بود، اما به دلیل تعداد بالای بازی‌های منتشرشده، روش سنتی امکان بررسی و تعیین رده سنی تنها برای حدود ۲۰ درصد بازی‌ها را فراهم می‌کرد. احمدی در گفتگو با خبرگزاری صداوسیما توضیح داد که در شیوه جدید، رده‌بندی بر اساس پرسشنامه خوداظهاری انجام می‌شود و فروشگاه‌های عرضه بازی نیز رده سنی تعیین‌شده را در بخشی از صفحه هر بازی نمایش می‌دهند تا خانواده‌ها هنگام انتخاب و نصب بازی، به این اطلاعات دسترسی داشته باشند. او با اشاره به نتایج پیمایش سال ۱۴۰۲ بنیاد گفت: در آن زمان حدود ۳۰ درصد خانواده‌ها با رده‌بندی سنی بازی‌ها آشنایی داشتند. امید است که با اجرای شیوه جدید و افزایش نمایش رده‌های سنی، این میزان در پیمایش بعدی دست‌کم دو برابر شود. احمدی در پایان تاکید کرد هدف بنیاد این است که تا پایان سال هیچ بازی موبایلی فاقد رده سنی در مارکت‌ها و فروشگاه‌های عرضه‌کننده وجود نداشته باش t's more than double the No. 2 entry. The release of concert documentaries has continued, with over a dozen since 2023 from artists including Billie Eilish, Beyoncé, BTS, and more. A Harry Styles tour documentary directed by John Wilson is in the works. Here are the 20 highest-grossing concert film documentaries at the domestic box office, per Box Office Mojo. 20. Amazing Grace (2018) Amazing Grace was released in 2018. Gabe Ginsberg/Getty Images Domestic gross: $4,450,456 The documentary captures Aretha Franklin recording her landmark 1972 live gospel album, \"Amazing Grace,\" over two nights at Los Angeles' New Temple Missionary Baptist Church. The film centers on Franklin's performances with the Southern California Community Choir. 19. Bring the Soul: The Movie (2019) LAS VEGAS, NEVADA - MAY 01: BTS arrive the 2019 Billboard Music Awards at MGM Grand Arena on May 01, 2019 in Las Vegas, Nevada. (Photo by Daniel Torok/Patrick McMullan via Getty Images) Daniel Torok/Patrick McMullan via Getty Images Domestic gross: $4,809,800 The documentary, directed by Park Jun-soo, BTS' primary director, centers on the band's 2018 \"Love Yourself\" wo", "date_str": "2026-11-09T09:34:01+00:00", "hash": "8328d85287645748", "title_fa": "20 فیلم کنسرت پرفروش تاریخ", "summary_fa": "تیلور سوئیفت در اولین نمایش جهانی فیلم کنسرت Taylor Swift: The Eras Tour در AMC The Grove 14 شرکت می کند. جان شیرر/ گتی ایماژ برای فیلم های کنسرت TAS در اواخر دهه 2000 و اوایل دهه 2010 محبوبیت خود را افزایش داد و میلیون ها دلار درآمد داشت. هنرمندانی مانند تیلور سویفت، بی‌تی‌اس و بیلی آیلیش به احیای این ژانر کمک کرده‌اند. Business Insider 20 فیلم مستند کنسرت پردرآمد را با استفاده از داده های Box Office Mojo گردآوری کرد. مستندهای کنسرت می تواند برای طرفداران برد-برد باشد: آنها می توانند کنسرت های مورد علاقه خود را دوباره زنده کنند یا تورهایی را تجربه کنند که نمی توانند به صورت زنده روی صفحه نمایش بزرگ ببینند. محبوبیت زیرژانر مستند موسیقی بین سال‌های 2008 تا 2013 افزایش یافت، زمانی که هنرمندانی مانند مایلی سای th measures are still being tallied.) That people in the most progressive state with the highest wealth inequality in the country made such decisions in the bluest national election in recent history is either a failure of populism, or a victory of free enterprise, depending on who you ask. On X, Mike Solana of Peter Thiel's Founders Fund heralded Prop 40's apparent defeat succinctly: \"Eat shit, communists.\" More than 200 billionaires live in California. Cumulatively, they hold an estimated $2.3 trillion in wealth, a sum that UC Berkeley economist Gabriel Zucman notes is roughly equivalent to the combined annual income of every single resident in the state. Soon, there could be dozens more, as companies like Anthropic and OpenAI prepare world-historic IPOs . (Anthropic's alone could mint close to a thousand centimillionaires.) Wealth for these people is not a matter of salary, but of assets. Most fortunes in the tech industry remain in company equity, which is untaxed until shares are sold. That has allowed some of the richest people in the state to avoid paying much in income tax : Billionaires like Mark Zuckerberg, Larry Ellison, and Larry Page all famously take $1 salaries. \"The way this system works is they can literally create gigantic fortunes without paying tax,\" says Tom Steyer, an investor and former gubernatorial candidate, and one of the few billionaires to come out in support of the billionaire tax. \"We know where we need to go, which is a fairer tax system.\" Prop 40 offered one such alternative. Supporters argued that it would mark a long overdue correction, and still allow billionaires to remain very, very rich. \"The poorest billionaire in California will make about $300 million this year. If we pass the CA wealth ta", "date_str": "2026-11-09T09:17:01+00:00", "hash": "ea3381ee31b36deb", "title_fa": "میلیاردرهای سیلیکون ولی در نبرد مالیاتی پیروز شدند. جنگ علیه ثروت تازه شروع شده است.", "summary_fa": "برنده مک نامی؛ اندرو هارنیک؛ روبرتو اشمیت/گتی est for comment. We just raised a new fundraising round, and we're growing the team a lot. So we're getting a new, bigger office . It's such a headache. There's so much insurance stuff and coordinating with the movers. The building managers require insurance when the movers come in. We also had to get new insurance to ensure we were in compliance with the new lease. I use all of the AI agents. Instinct helps me at the gym, and Grok Bot takes snack orders at my company and buys them on Amazon. I would've had to ask Claude or ChatGPT about the move anyway, because I don't know much about insurance. So, I thought I'd give this task to Dot and let it take it from there. I had found a contact for insurance. I said: \"We're moving to this office. You can read my emails to find out the details. Just get it done.\" A couple of times it sent me a bunch of texts. I said: \"Just please, get it done.\" It was taking a few days, and the movers still hadn't been finalized, so I looked at what it was doing. It was mayhem. It was sending multiple back-to-back messages to the movers, triple- and quadruple-emailing, giving every tiny update about everything. They proposed some times and said, \"How's 9 a.m.?\" It followed up: \"Is that Pacific Time?\" It needed clarification on every single thing, so it just kept bombarding them with questions. There were also the insurance people , our current building managers, and our new building managers. In some cases, it was emailing all of them at the same time. The email chain grew too large for Robert Farlow s new building manager. Robert Farlow The new building manager had to make a new thread because the existing one was too large. It was telling them stuff about the other parties, too. It was telling the movers about Brian, our building manager. They don't need to know that. It was givi", "date_str": "2026-11-09T09:00:01+00:00", "hash": "2166d86019f84173", "title_fa": "من از OpenAI's Dots برای کمک به جابجایی دفاتر استفاده کردم. صدها ایمیل به انتقال دهنده ها ارسال کرد.", "summary_fa": "رابرت فارلو، یکی از بنیانگذاران پلاتو، از یک عامل OpenAI s Dot خواست تا به هماهنگی حرکت دفتر او کمک کند. با ایمیل های مکرر انتقال دهندگان، کارگران بیمه و مدیران ساختمان را هرزنامه فرستاد. رابرت فارلو رابرت فارلو از عامل OpenAI's Dot خواست تا در هماهنگی یک حرکت کمک کند. او دات صدها ایمیل را برای جابجایی‌ها، مدیران ساختمان و کارگران بیمه ارسال کرد. او Dot را خاموش کرد، اگرچه هوش مصنوعی همچنان در حال نوشتن ایمیل‌هایش است. این مقاله گفته شده بر اساس گفتگو با رابرت فارلو، بنیانگذار ۲۷ ساله استارتاپ هوش مصنوعی پلاتو است. او در سانفرانسیسکو مستقر است. این مقاله برای طولانی بودن و وضوح ویرایش شده است. OpenAI به درخواست Business Insider برای اظهار نظر پاسخ نداد. ما به تازگی یک دور جدید جمع آوری کمک مالی جمع آوری کرده ایم و تیم را بسیار رشد می دهیم. بنابراین ما در حال گرفتن یک دفتر جدید و بزرگتر هستیم. اینقدر سردرد داره خیلی چیزهای بیمه و هماهنگی با جابجایی ها وجود دارد. مدیران ساختمان به هنگام ورود جابجایی‌ها به بیمه نیاز دارند. من از همه عوامل هوش مصنوعی استفاده می کنم. Instinct در باشگاه به من کمک می کند، و Grok Bot سفارشات تنقلات را در شرکت من دریافت می کند و آنها را در آمازون می خرد. به هر حال باید از کلود یا ChatGPT در مورد این جابجایی می‌پرسیدم، زیرا اطلاعات زیادی در مورد بیمه ندارم. بنابراین، فکر کردم که این وظیفه را به Dot بدهم و بگذارم آن را از آنجا بگیرد. من یک مخاطب برای بیمه پیدا کرده بودم. گفتم: \"ما داریم به این دفتر می‌رویم. می‌توانید ایمیل‌های من را بخوانید تا جزئیات را بدانید. فقط کار را انجام دهید.\" چند بار برای من یک سری پیامک فرستاد. گفتم: فقط خواهش می کنم، کار را انجام بده. چند روزی طول کشید،", "image_url": "https://i.insider.com/6aee37898f37e8e0b5baae10?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Anthropic", "عامل‌های هوشمند"], "datetime_fa": "۱۸ آبان • ۱۲:۳۰"}, {"source": "Business Insider", "title": "Who is Lori Huang, Nvidia CEO Jensen Huang’s wife of over 40 years", "link": "https://www.businessinsider.com/who-is-nvidia-ceo-jensen-huang-wife-lori-2026-11", "summary": "Lori Huang has been married to Nvidia CEO Jensen Huang for over 40 years. Emma McIntyre/Getty Images Lori Huang met Nvidia CEO Jensen Huang when they were lab partners at Oregon State University. They have two children, Madison and Spencer, who both work at Nvidia. Here's what we know about Huang, who leads the Jen-Hsun and Lori Huang Foundation. Lori Huang has kept a relatively low public profile during Nvidia's rise into one of the world's most valuable companies. However, CEO Jensen Huang's note to employees on Sunday put new focus on the woman he has been married to for over 40 years. Huang, then known as Lori Mills, first met Jensen Huang as his lab partner in an electrical engineering class in college, according to his biography on the OSU College of Engineering website . They married five years later. She was older than him and one of the \"three girls\" in his class, Jensen Huang said in a 2024 interview. He said he won her over with an offer to study together every Sunday , along with a promise that he would be a CEO by 30. Together, they have two children, Madison and Spencer, who both work at Nvidia. According to their Nvidia bios, Madison is a senior director of product and technical marketing for physical AI platforms, while Spencer is a product line manager leading robotics software. The woman behind Nvidia's CEO Huang herself is the president of the Jen-Hsun and Lori Huang Foundation, a philanthropic organization she and her husband established in 2007. Based in Palo Alto, the foundation reported $9.1 billion in net assets in 2024, per its IRS filing . OSU said in a 2022 news release that the Huangs had given $50 million to their alma mater to help establish the Jen-Hsun and Lori Huang Collaborative Innovation Complex. In the article, Jensen Huang said that meeting his wife \"was the most important, single event of OSU, and of my life.\" The news release also said that Huang graduated in 1985 with a bachelor's degree in electrical engineering. In an October 2023 interview on HP's online show \"The Moment,\" the Nvidia CEO credited his wife and their daughter with dressing him in his signature black leather jacket look . In a May interview with CNA, a Singapore-based media outlet, Jensen Huang spoke about the role his wife has played throughout his career. \"Lori's been with me for a long time, our whole life,\" he said. \"She's been part of Nvidia every step of the way.\" \"She's been to every conference, every speech, you know, and every moment of Nvi", "date_str": "2026-11-09T08:59:34+00:00", "hash": "f2dec21a2b92ebfe", "title_fa": "لوری هوانگ، همسر 40 ساله جنسن هوانگ، مدیرعامل انویدیا، کیست", "summary_fa": "لوری هوانگ بیش از 40 سال است که با جنسن هوانگ، مدیرعامل انویدیا ازدواج کرده است. اما مک اینتایر/ گتی ایماژز لوری هوانگ با جنسن هوانگ، مدیرعامل انویدیا، زمانی که شرکای آزمایشگاهی در دانشگاه ایالتی اورگان بودند، ملاقات کرد. آنها دو فرزند به نام های مدیسون و اسپنسر دارند که هر دو در انویدیا کار می کنند. در اینجا چیزی است که ما در مورد هوانگ، که بنیاد جن-هسون و لوری هوانگ را رهبری می کند، می دانیم. لوری هوانگ در طول ظهور انویدیا به یکی از با ارزش ترین شرکت های جهان، یک نمایه عمومی نسبتا پایین را حفظ کرده است. با این حال، یادداشت مدیر عامل جنسن هوانگ به کارمندان در روز یکشنبه، تمرکز جدیدی را بر روی زنی که بیش از 40 سال است با او ازدواج کرده است، قرار داد. هوانگ، که در آن زمان با نام لوری میلز شناخته می‌شد، طبق بیوگرافی او در وب‌سایت کالج مهندسی OSU، برای اولین بار با جنسن هوانگ به عنوان شریک آزمایشگاهی خود در کلاس مهندسی برق در کالج آشنا شد. آنها پنج سال بعد ازدواج کردند. جنسن هوانگ در مصاحبه ای در سال 2024 گفت که او بزرگتر از او و یکی از \"سه دختر\" کلاس خود بود. او گفت که او را با پیشنهادی برای مطالعه هر یکشنبه با هم به دست آورد، همراه با قولی که تا 30 سالگی مدیرعامل خواهد شد. آنها با هم دو فرزند دارند، مدیسون و اسپنسر، که هر دو در انویدیا کار می کنند. طبق بایوس Nvidia، مدیسون یک مدیر ارشد محصول و بازاریابی فنی برای پلتفرم‌های هوش مصنوعی فیزیکی است، در حالی که اسپنسر مدیر خط تولید نرم‌افزار روبا when a soft robot touches them. The system represents every material it simulates, from a dune of sand to a protein molecule, as tiny particles and predicts where those particles will move one step at a time. Because it learns the underlying dynamics rather than being programmed with an equation, the model can adapt to materials, forces, and environments it never encountered during training. In the long term, the researchers hope this work helps scientists discover new materials and explore physical processes they would be unable to effectively study with existing simulation methods. “We want to have a GPT moment for simulation,” says Peter Yichen Chen, a former MIT postdoc who is now an assistant professor at UBC, and is a co-corresponding author of an open-access paper on this technique. “Every time people want to build a simulator for a particular physical phenomenon, they need to code it up from scratch. Our vision is to have a foundation model that works out of the box for any scenario you want to simulate. This is a first step in that direction.” Chen is joined by co-corresponding and co-lead author Minghao Guo, an MIT postdoc; co-lead authors Caoliwen Wang and Siyuan Chen, UBC graduate students; Wojciech Matusik, an MIT professor of electrical engineering and computer science who leads the Computational Design and Fabrication Group within the Computer Science and Artificial Intelligence Laboratory (CSAIL); and others at UBC, Georgia Tech, Inria, Meta, the ", "date_str": "2026-11-09T05:00:00+00:00", "hash": "630bf285bf81b260", "title_fa": "یک مدل هوش مصنوعی رفتار بسیاری از مواد را شبیه سازی می کند، از ماسه لغزنده گرفته تا پروتئین های تاشو", "summary_fa": "امروزه، دانشمندی که می‌خواهد یک فرآیند فیزیکی را شبیه‌سازی کند، باید ابزار مناسبی را برای آن کار انتخاب کند، مانند حل‌کننده‌ای که برای آب جاری ساخته شده است یا روش دیگری که برای مدل‌سازی روش تا شدن پروتئین طراحی شده است. هر کدام به صورت دستی حول معادلات خاصی کدگذاری می شوند که نحوه رفتار آن فرآیند را دیکته می کنند. محققان MIT، دانشگاه بریتیش کلمبیا (UBC) و جاهای دیگر اکنون این تکه تکه‌کاری را با یک سیستم یادگیری عمیق به نام WorldParticle جایگزین کرده‌اند که می‌تواند به مهندسان در مدل‌سازی پدیده‌های فیزیکی مختلف، از لغزش شن گرفته تا پروتئین‌های تاشو، با یک معماری هوش مصنوعی یکپارچه کمک کند. دانشمندان و مهندسان می‌توانند از این سیستم برای مدل‌سازی فرآیندهایی استفاده کنند که معمولاً به شبیه‌سازهای جداگانه نیاز دارند، مانند سیالی که در برابر یک جامد تغییر شکل‌پذیر قرار می‌گیرد. به عنوان مثال، این می تواند روشی سریع تر و دقیق تر برای شبیه سازی چگونگی تأثیر ریزش روغن بر روی شیر الاستیک در یک مخزن ذخیره سازی ارائه دهد. همچنین می‌تواند به مهندسان کمک کند تا بفهمند که کجا و چگونه مواد دانه‌ای مانند ماسه یا خاک می‌توانند با لمس یک ربات نرم حرکت کنند. این سیستم هر ماده‌ای را که شبیه‌سازی می‌کند، از یک تپه شنی گرفته تا یک مولکول پروتئین، به‌عنوان ذرات ریز نشان می‌دهد و پیش‌بینی می‌کند که آن ذرات یک قدم در کجا حرکت کنند. از آنجایی که این مدل به جای اینکه با یک معادله برنامه ریزی شود، دینامیک زیربنایی را یاد می گیرد، می تواند با مواد، نیروها و محیط هایی که هرگز در طول آموزش با آن مواجه نشده است، سازگار شود. در دراز مدت، محققان امیدوارند که این کار به دانشمندان کمک کند مواد جدید را کشف کنند و فرآیندهای فیزیکی را که قادر به مطالعه موثر آنها با روش های شبیه", "image_url": "https://news.mit.edu/sites/default/files/images/202611/MIT-WorldParticle-01-Press.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI", "Meta"], "datetime_fa": "۱۸ آبان • ۰۸:۳۰"}, {"source": "MIT AI", "title": "AI-assisted learning platform helps robots reason beyond literal commands", "link": "https://news.mit.edu/2026/ai-assisted-learning-platform-helps-robots-reason-beyond-literal-commands-1109", "summary": "Humans are intuitive by nature. We can sense meaning beyond the literal words that we encounter. Now, a new artificial intelligence-assisted learning platform developed by MIT engineers is enabling robots to read larger meaning into a human’s natural language commands. In a study to be presented at the annual Conference on Robot Learning this month, researchers from MIT and New York University introduce FLEX , a flexible feature-editing pipeline for robot motion-planning. With FLEX, humans can interact with a robot by giving it instructions in natural, conversational language. The robot can not only follow the instructions literally but also read into the words to draw larger generalizations that help to improve its motion-planning task. The team demonstrated FLEX in several simulated scenarios, including one in which a robot serves a cup of coffee. In these virtual scenarios, a person interacts with a robotic arm by typing commands in natural language. As the robot moves the coffee cup over a cluttered table, the person might type “Don’t spill on the laptop!” In response, the robot will reason about why it should avoid the laptop. For this, FLEX incorporates a large language model (LLM) — a type of AI system that is trained on enormous libraries of text, including social media posts, video transcriptions, and web content, which the LLM uses to identify larger trends, patterns, and generalizations. “LLMs have seen so many texts from the internet,” says study author Nathan Dennler, a postdoc in MIT’s Computer Science and Artificial Intelligence Laboratory (CSAIL). “People might have written about, ‘Oh, my phone dropped in the water and now it doesn’t work,’ or ‘I spilled coffee on my computer and now it doesn’t work.’ So LLMs pick up on the idea that liquids plus devices leads to things not working.” Through the LLM, the robot reasons that it should also avoid bumping into all electronics. In its updated path, the robot adjusts to avoid both the laptop and a nearby phone, without the person having to explicitly spell this out. “The idea is that there is some higher-level intention behind the words that you say,” Dennler says. “People naturally get this. But you have to carefully explain that to a robot, which takes time and effort. FLEX gives you an interface of communication with a robot to say, ‘When people say this, they mean that.’” The study was led by Andreea Bobu, assistant professor of aeronautics and astronautics at MIT. Co-authors are Audrey Lee S", "date_str": "2026-11-09T05:00:00+00:00", "hash": "70dcb888048a40ab", "title_fa": "پلتفرم یادگیری با کمک هوش مصنوعی به ربات ها کمک می کند تا فراتر از دستورات تحت اللفظی استدلال کنند", "summary_fa": "انسان ها ذاتاً شهودی هستند. ما می توانیم معنایی را فراتر از کلمات تحت اللفظی که با آنها مواجه می شویم، درک کنیم. اکنون، یک پلتفرم یادگیری جدید به کمک هوش مصنوعی که توسط مهندسان MIT توسعه یافته است، به روبات‌ها امکان می‌دهد تا معنای بزرگ‌تری را در دستورات زبان طبیعی انسان بخوانند. در مطالعه‌ای که قرار است در کنفرانس سالانه یادگیری ربات در این ماه ارائه شود، محققان MIT و دانشگاه نیویورک FLEX را معرفی کردند، خط لوله ویرایش ویژگی‌های انعطاف‌پذیر برای برنامه‌ریزی حرکت ربات. با FLEX، انسان‌ها می‌توانند با دادن دستورالعمل‌هایی به زبان طبیعی و محاوره‌ای با یک ربات تعامل کنند. این ربات نه تنها می تواند دستورالعمل ها را به معنای واقعی کلمه دنبال کند، بلکه می تواند کلمات را نیز بخواند تا تعمیم های بزرگتری را ترسیم کند که به بهبود وظیفه برنامه ریزی حرکتی آن کمک می کند. این تیم FLEX را در چندین سناریو شبیه سازی شده نشان دادند، از جمله سناریویی که در آن یک ربات یک فنجان قهوه سرو می کند. در این سناریوهای مجازی، فرد با تایپ دستوراتی به زبان طبیعی با بازوی رباتیک تعامل می کند. همانطور که ربات فنجان قهوه را روی یک میز به هم ریخته حرکت می‌دهد، ممکن است فرد «روی لپ‌تاپ نریزد» را تایپ کند. در پاسخ، ربات در مورد اینکه چرا باید از لپ تاپ اجتناب کند، استدلال می کند. برای این کار، FLEX یک مدل زبان بزرگ (LLM) - نوعی سیستم هوش مصنوعی که بر روی کتابخانه‌های عظیم متن، از جمله پست‌های رسانه‌های اجتماعی، رونویسی‌های ویدئویی، و محتوای وب، آموزش داده شده است، که LLM برای شناسایی گرایش‌ها، الگوها و تعمیم‌های بزرگتر استفاده می‌کند، ترکیب می‌کند. ناتان دنلر، نویسنده این مطالعه، یک فوق دکترا در آزمایشگاه علوم کامپیوتر و هوش مصنوعی MIT (CSAIL) می‌گوید: LLM متون زیادی از اینترنت دیده‌اند. ممکن است مردم در", ary_fa": "اعتراف جنسن هوانگ به خیانت خانوادگی، به دلیل ارتباط زن طرف رابطه با دستگاه اطلاعاتی چین و خرید میلیاردها دلار تراشه، ابعاد امنیتی پیدا کرد. تبلیغات یک رابطه خارج از ازدواج، زنی مظنون به همکاری با دستگاه اطلاعاتی چین و میلیاردها دلار معامله تراشه‌های هوش مصنوعی؛ ماجرایی که حالا مدیرعامل انویدیا را در موقعیتی کم‌سابقه قرار داده است. روز یکشنبه، هشتم نوامبر ۲۰۲۶ (۱۷ آبان ۱۴۰۵)، اتفاقی افتاد که کمتر کسی در صنعت فناوری انتظارش را داشت. جنسن هوانگ ، مردی که طی بیش از سه دهه انویدیا را از یک شرکت سازنده پردازنده‌های گرافیکی به یکی از مهم‌ترین بازیگران صنعت هوش مصنوعی تبدیل کرده، در نامه‌ای خطاب به کارکنان شرکت به خیانت به همسرش اعتراف کرد و توجه‌ها را به سمت اهمیت تولید کارت گرافیک انویدیا جلب کرد. «من به همسرم وفادار نبودم. رفتارم به او و فرزندانمان آسیب رساند. هیچ بهانه‌ای برای کاری که انجام دادم وجود ندارد. عمیقاً متأسفم.» این جملات بخشی از نامه رسمی هوانگ در وب‌سایت انویدیا هستند؛ اعترافی که شاید در شرایط عادی صرفاً به رسوایی شخصی یکی از ثروتمندترین مدیران جهان تبدیل می‌شد. اما این بار ماجرا بسیار پیچیده‌تر است. زنی که نامش در گزارش‌های رسانه‌ای درباره رابطه هوانگ مطرح شده، مظنون به همکاری با یکی از قدرتمندترین دستگاه‌های اطلاعاتی چین است و شرکتی که او در آن فعالیت داشته، در مرکز تحقیقات مربوط به صادرات تراشه‌های پیشرفته آمریکایی قرار دارد. برای فهمیدن اینکه چگونه یک رابطه شخصی به مسئله‌ای مرتبط با امنیت ملی آمریکا تبدیل شد، باید به بیش از دو سال قبل و یک دورهمی در تایپه برگردیم. در یکی از شب‌های ژوئن ۲۰۲۴، گروهی از مدیران شرکت‌های فناوری پس از نمایشگاه کامپیوتکس در یک بار در تایپه دور هم جمع شده بودند. در میان آن‌ها زنی به نام آلیس هوانگ (Alice Huang)، معروف به هوانگ له (Huang Le)، حضور داشت؛", "image_url": "https://api2.zoomit.ir/media/jensen-huang-security-case-6af1557a354e588119e486da?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۱۸ آبان • ۰۸:۵۰"}, {"source": "Business Insider", "title": "I'm 69 and pay $4,500 a month to live in a care home. It's given me a better sense of community.", "link": "https://www.businessinsider.com/living-alone-unsafe-assisted-living-facility-care-home-aging-singapore-2026-11", "summary": "Victor Lee lives in an assisted living facility in Singapore. Rebecca Toh for Business Insider. Victor Lee spent most of his life living with his siblings before he found himself on his own. After falling several times with no one around to notice or help, living alone no longer felt safe. In 2023, he moved into an assisted-living home in Singapore, where he pays about $4,500 a month for a private room. This as-told-to essay is based on a conversation with Victor Lee, 69, who lives at Camino House, an assisted living facility in Singapore. This interview has been edited for length and clarity. For as long as I could remember, I lived with my three older siblings in a two-story apartment in Singapore . I worked as a sales assistant at a popular department store, but stopped working in my 20s because of health issues. My siblings took care of me after that, and I relied on them to help me get by day to day. We were all single. Victor Lee spent most of his life living with his three older siblings. Rebecca Toh for Business Insider. But as the years went by, age caught up with them one by one, and I was left on my own. For over two years, I lived alone in that apartment we once shared. But as I got older and less mobile, it became harder to manage the stairs every day. I fell several times, and I started to realize how dangerous it was to be by myself. Each time I fell, there was nobody around to know. But the last time was the one that made me realize I could not keep living this way. I remember lying there for a long time, struggling to get myself up. When I finally managed to, I had to call an ambulance — and then open the door for them myself. Choosing assisted living I decided to sell my apartment and downsize to a smaller public-housing flat . But like other Singaporeans who buy these Build-to-Order flats, I would have to wait several years for the apartment to be ready. When his siblings died, living alone became unsafe, so Lee moved into an assisted living facility in Joo Chiat, Singapore. Rebecca Toh for Business Insider. In the meantime, I knew I needed to find a place where help would be nearby if I fell again. Since I was still fairly independent and able to manage most daily activities on my own, a traditional nursing home didn't seem like the right fit for me. Thankfully, a social worker I knew helped me consider my options. She introduced me to Camino House , an assisted living facility not too far from where I'd been living. It's in a shophouse", "date_str": "2026-11-09T05:03:01+00:00", "hash": "7a08ec924694dbaf", "title_fa": "من 69 سال دارم و ماهانه 4500 دلار برای زندگی در خانه مراقبت می پردازم. این به من احساس بهتری از جامعه داد.", "summary_fa": "ویکتور لی در یک مرکز زندگی کمکی در سنگاپور زندگی می کند. ربکا تو برای Business Insider. ویکتور لی بیشتر زندگی خود را قبل از اینکه خودش را بیابد با خواهر و برادرش گذراند. پس از چندین بار زمین خوردن بدون اینکه کسی در اطرافش متوجه شود یا کمک کند، زندگی به تنهایی دیگر احساس امنیت نمی کرد. در سال 2023، او به خانه ای در سنگاپور نقل مکان کرد که در آنجا حدود 4500 دلار در ماه برای یک اتاق خصوصی می پردازد. این مقاله گفته شده بر اساس گفتگو با ویکتور لی، 69 ساله، که در Camino House، یک مرکز زندگی کمکی در سنگاپور زندگی می کند، است. این مصاحبه برای طولانی بودن و وضوح ویرایش شده است. از زمانی که یادم می آید، با سه خواهر و برادر بزرگترم در یک آپارتمان دو طبقه در سنگاپور زندگی می کردم. من به عنوان دستیار فروش در یک فروشگاه بزرگ کار می کردم، اما در 20 سالگی به دلیل مشکلات سلامتی کار را متوقف کردم. خواهر و برادرهایم بعد از آن از من مراقبت کردند و من به آنها تکیه کردم تا به من کمک کنند تا روز به روز برسم. همه مجرد بودیم ویکتور لی بیشتر عمر خود را با سه خواهر و برادر بزرگتر خود گذراند. ربکا تو برای Business Insider. اما با گذشت سالها سن یکی یکی به آنها رسید و من به حال خودم رها شدم. بیش از دو سال در آن آپارتمانی که زمانی مشترک بودیم، تنها زندگی کردم. اما ب رعامل خود، و ارتباط او با یکی از مدیران متهم به جاسوسی برای چین آغاز کرد. تبلیغات انویدیا رسما از آغاز تحقیقات مستقل در مورد جنسن هوانگ ، مدیرعامل و بنیان‌گذار خود، خبر داد. موضوع بررسی‌ها، ارتباط او با آلیس هوانگ ، از مدیران شرکت مگاسپید، است که گفته می‌شود از سوی وزارت امنیت دولتی چین برای جاسوسی از غول تولیدکننده تراشه به خدمت گرفته شده بود. مدیرعامل انویدیا رسما به خیانت به همسرش اعتراف کرد و اکنون با تحقیقات مستقل هیئت‌مدیره‌ی شرکت روبه‌رو است. هوانگ در پیامی خطاب به کارکنان انویدیا، مسئولیت رفتار خود را پذیرفت و از خانواده، همکاران و سهام‌داران شرکت عذرخواهی کرد. او گفت: «من به همسرم وفادار نبودم. رفتارم به او و فرزندانمان آسیب رساند. هیچ بهانه‌ای برای کاری که انجام دادم وجود ندارد. عمیقاً متأسفم.» مدیرعامل ۶۳ ساله‌ی انویدیا در ادامه تأکید کرد که مسئولیت کامل اقداماتش را می‌پذیرد و تلاش خواهد کرد اعتماد خانواده و همکارانش را دوباره به دست آورد. او همچنین اعلام کرد که با تحقیقات هیئت‌مدیره همکاری کامل خواهد داشت. اما آنچه این اعتراف را به موضوعی فراتر از زندگی خصوصی یکی از شناخته‌شده‌ترین مدیران صنعت فناوری تبدیل کرده، هویت زنی است که گزارش‌های رسانه‌ای او را طرف رابطه‌ی هوانگ معرفی می‌کنند. براساس گزارش‌های نیویورک تایمز فایننشال‌تایمز، این زن آلیس هوانگ، با نام چینی هوانگ له (Huang Le) ، از مدیران سابق شرکت سنگاپوری مگاسپید (Megaspeed International) است؛ شرکتی که از مشتریان بزرگ پردازنده‌های هوش مصنوعی انویدیا به شمار می‌رود. به‌گفته‌ی منابع اطلاعاتی آمریکایی که رسانه‌ها به آن‌ها استناد کرده‌اند، آلیس هوانگ ظاهراً از سوی وزارت امنیت کشور چین (MSS) جذب شده بود تا به اطلاعات مرتبط با انویدیا دسترسی پیدا کند. این اطلاعات می‌توانست شامل برنامه‌های تجاری شرکت و سیاست‌های آمریکا درباره‌ی صادرات تراشه‌های پیشرفته‌ی هوش مصنوعی به چین باشد.", "image_url": "https://api2.zoomit.ir/media/jensen-huang-nvidia-ceo-6af1461f354e588119e486c2?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۱۸ آبان • ۰۷:۳۴"}, {"source": "Business Insider", "title": "Trump reacts to the Jensen Huang affair: 'He probably has an excuse for it'", "link": "https://www.businessinsider.com/trump-reacts-jensen-huang-nvidia-alice-huang-affair-excuse-2026-11", "summary": "Trump said that Jensen Huang should stay on as Nvidia s CEO. Alex Wroblewski / AFP via Getty Images Trump backed Nvidia CEO Jensen Huang after he admitted to an extramarital affair. \"I think he's an honorable guy,\" Trump told reporters. \"I think he probably has an excuse for it.\" Jensen Huang admitted infidelity in a memo to Nvidia employees on Sunday. President Donald Trump backed Nvidia CEO Jensen Huang on Sunday after Huang said he had been unfaithful to his wife with a woman US intelligence reportedly suspects was a Chinese spy . \"I think he's an honorable guy,\" Trump told reporters on Sunday. \"I think he probably has an excuse for it. You have to hear it.\" Trump said that in response to a question about whether he wishes he had acted on US intelligence about the affair earlier. Trump said he has not spoken to Huang about the matter, but added that Huang has done an \"amazing job\" for the US and should remain Nvidia's CEO. In a memo to Nvidia employees on Sunday, Huang said that he had been unfaithful to his wife and that his actions had hurt his family. He added that Nvidia's board was launching an investigation into whether he was targeted by a foreign intelligence agency. Late last month, The New York Times reported that US intelligence agencies had concluded that Huang was the target of a Chinese spy plot. The outlet reported that Alice Huang, a Chinese business executive and Nvidia chip buyer who is not related to the Nvidia CEO, had developed a close relationship with him and had passed information to Beijing. She had been recruited to seek information and potentially push for more advanced Nvidia chips to be made available in China, The Times reported. Huang previously said he had a \" normal\" business relationship with the woman. Nvidia did not immediately respond to a request for comment. On Sunday, Nvidia's board said it had no reason to believe that national security or company secrets had been compromised, but said its inquiry would examine the available information. It added that Huang was cooperating with the investigation. Huang has become an increasingly influential voice in Washington's debate over chip-export restrictions on China. He has taken the position that strict limits on US chip sales could backfire by accelerating the growth of Chinese competitors. Read the original article on Business Insider", "date_str": "2026-11-09T03:12:32+00:00", "hash": "ec77d1703f4741ef", "title_fa": "واکنش ترامپ به ماجرای جنسن هوانگ: او احتمالاً بهانه ای برای آن دارد.", "summary_fa": "ترامپ گفت که جنسن هوانگ باید به عنوان مدیرعامل انویدیا باقی بماند. الکس وروبلوسکی / خبرگزاری فرانسه از طریق گتی ایماژ ترامپ از جنسن هوانگ، مدیرعامل انویدیا پس از اعتراف به رابطه خارج از ازدواجش حمایت کرد. ترامپ به خبرنگاران گفت: «من فکر می‌کنم او مرد شریفی است. \"من فکر می کنم او احتمالاً بهانه ای برای آن دارد.\" جنسن هوانگ روز یکشنبه در یادداشتی به کارمندان انویدیا به خیانت خود اعتراف کرد. دونالد ترامپ، رئیس جمهور آمریکا روز یکشنبه از جنسن هوانگ، مدیرعامل انویدیا حمایت کرد، پس از اینکه هوانگ گفت که به همسرش با زنی خیانت کرده است که طبق گزارش‌ها، سازمان اطلاعات آمریکا مظنون به جاسوسی چینی است. ترامپ روز یکشنبه به خبرنگاران گفت: «فکر می‌کنم او مرد شریفی است. \"من فکر می کنم او احتمالاً بهانه ای برای آن دارد. شما باید آن را بشنوید.\" ترامپ در پاسخ به سوالی مبنی بر اینکه آیا می‌خواست زودتر به اطلاعات آمریکا درباره این ماجرا عمل می‌کرد، گفت. ترامپ گفت که در مورد این موضوع با هوانگ صحبت نکرده است، اما افزود که هوانگ \"کار شگفت انگیزی\" برای ایالات متحده انجام داده است و باید مدیرعامل انویدیا باقی بماند. هوانگ در یادداشتی به کارمندان انویدیا در روز یکشنبه گفت که به همسرش خیانت کرده و اقدامات او به خانواده‌اش آسیب رسانده است. وی افزود که هیئت مدیره انویدیا در حال آغاز تحقیقاتی در مورد اینکه آیا او توسط یک آژانس اطلاعاتی خارجی هدف قرار گرفته است یا خیر. اواخر ماه گذشته، نیویورک تایمز گزارش داد که ساز ا آگاه نیستند یا به این دلیل که خیلی به داشتن آن در اطراف عادت کرده‌اند و نمی‌خواهند با آن سازگار شوند. خوشبختانه، سامسونگ دکمه «همه برنامه‌ها» را به عنوان گزینه‌ای برای کاربرانی که می‌خواهند آن را بازگردانند، گذاشته است. برای فعال کردن آن فقط باید به منوی تنظیمات بروید. سامسونگ برای افزودن دکمه «همه برنامه‌ها» به صفحه اصلی Samsung Galaxy خود در One UI 9، باید به منوی گزینه‌های متنی دسترسی داشته باشید. فضایی را در صفحه اصلی خود پیدا کنید و آن را به مدت طولانی فشار دهید یا", "image_url": "https://www.engadget.com/img/gallery/samsung-one-ui-removed-the-all-apps-button-but-you-can-easily-get-it-back/l-intro-1793963887.jpg", "category": "هوش مصنوعی مولد", "tags": ["Google", "Apple"], "datetime_fa": "۱۸ آبان • ۰۱:۰۰"}, {"source": "Engadget", "title": "NVIDIA is investigating reports that CEO Jensen Huang was the target of Chinese spy efforts", "link": "https://www.engadget.com/2310336/nvidia-is-investigating-reports-that-ceo-jensen-huang-was-the-target-of-chinese-spy-efforts/", "summary": "Reports by The New York Times and the Financial Times linked the CEO to a woman suspected to be a spy.", "date_str": "2026-11-08T21:17:45+00:00", "hash": "030b7ad510197e68", "title_fa": "انویدیا در حال بررسی گزارش‌هایی است که نشان می‌دهد جنسن هوانگ، مدیر عامل شرکت، هدف تلاش‌های جاسوسی چینی بوده است", "summary_fa": "گزارش‌های نیویورک تایمز و فایننشال تایمز مدیر عامل شرکت را به زنی که مظنون به جاسوسی است مرتبط می‌دانند. بنا بر گزارش ها، مدیر عامل پس از ارتباط با زنی که مظنون به جاسوسی بود، به رابطه نامشروع خود اعتراف کرد. Sean Gallup/Getty Images افزودن Engadget به Google: منبع برگزیده Google Discover پس از مجموعه‌ای از گزارش‌های نیویورک تایمز و فایننشال تایمز که جنسن هوانگ، مدیر عامل NVIDIA را با زنی که مظنون به جاسوسی چینی است مرتبط می‌کند، این شرکت می‌گوید تحقیقات مستقلی را در مورد ادعاهایی مبنی بر اینکه او \"هدف یک تلاش اطلاعاتی خارجی بوده است\" آغاز کرده است. در بیانیه ای که روز یکشنبه منتشر شد، انویدیا گفت: «کمیته ای متشکل از مدیران مستقل، با کمک مشاوران مستقل خارجی، بر تحقیقات نظا asier on myself by putting a pair of sweatpants, a pair of basketball shorts, a soft T-shirt, and undergarments in a small packing cube at the top of my suitcase. I ve never boarded an overnight Amtrak train without video games. Joey Hadden/Business Insider Entertainment is everything when you're stuck in place for dozens of hours. One thing that makes my cabin feel more like home is packing activities I often enjoy in my own living room. So I always pack my Nintendo Switch. The portable console is thin enough to slide easily into a tight crevice in my bag. It's loaded with all types of games to satisfy every mood, from \"Animal Crossing\" and various Pokémon titles to the \"BioShock\" series and \"Red Dead Redemption,\" to name a few. I always have a journal on me. Joey Hadden/Business Insider I've only traveled solo on overnight trains, so I spend a lot of time thinking. I rarely make time for journaling in my daily life, but on trains I indulge in the opportunity to write out my thoughts uninterrupted. And the ever-changing view out the window is a constant source of inspiration. My camera has been my sidekick since the beginning. Joey Hadden/Business Insider On overnight trains, I spend more time with my camera in hand t", "date_str": "2026-11-08T18:14:01+00:00", "hash": "bc62018de6acc5b8", "title_fa": "من 128 ساعت را در قطارهای خواب آمتراک گذرانده ام. در اینجا 6 مورد ضروری که من همیشه بسته بندی کرده ام و 4 موردی که در طول راه کشف کرده ام وجود دارد.", "summary_fa": "نویسنده وسایل ضروری بسته بندی خود را برای سفرهای شبانه Amtrak به اشتراک می گذارد. Joey Hadden/Business Insider من هرگز در قطار شبانه Amtrak بدون دوربین نبودم. من هرگز بدون انجام تمام روال مراقبت از پوستم به رختخواب نرفتم. من هرگز یک جفت دوربین دوچشمی بسته بندی نکرده ام، اما دفعه بعد این کار را خواهم کرد. آسایش، راحتی و لذت. من برای هر سفر یک شبه آمتراک با در نظر گرفتن این سه چیز، بسته بندی می کنم. و پس از 128 ساعت تجربه، به نکات ضروری برای یک تجربه فوق العاده پی بردم. من از طریق 15 ایالت، از ساحل شرق اسک به دلیل \"هدر دادن\" پول در انتخابات میان دوره ای در اخبار است. تقلید کننده گفت: \"اوه، نه، من در اخبار هستم زیرا ماشین من یک چرخش انجام داد. ماشین من یک چرخش را انجام داد، یادت هست؟ مثل یک چرخ داغ بود.\" \"مثل پوف بود! و سپس باه! اما من کاملاً خنک بودم. من مثل \"زندگی اراذل و اوباش!\" تصور کنید.\" تسلا در ماه اکتبر با تکان دادن آن در هوا در جریان تظاهرات، نسل بعدی رودستر خود را به رخ کشید. ماسک کولهین زمانی که از تصمیمش برای توقف تولید سایبرتراک تسلا پرسیده شد، پاسخ مشابهی داشت. ماسک دو روز پس", "image_url": "https://i.insider.com/6af084108f37e8e0b5bab1be?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۷ آبان • ۲۰:۱۷"}, {"source": "Business Insider", "title": "I was an international flight attendant. At 36, I'm a part-time receptionist, and I'm happier than ever.", "link": "https://www.businessinsider.com/flight-attendant-receptionist-career-change-happier-2026-11", "summary": "The author retired from her flight attendant career and is now happier. Courtesy of the author I spent years working as an international flight attendant, constantly traveling and chasing success. I traded my demanding career for a part-time receptionist job with a much calmer routine. At 36, I'm happier prioritizing my mental health, marriage, and the small joys of everyday life. I was born in a small town in Ukraine , raised with the quiet, persistent belief that to succeed, I had to work three times harder than anyone born in a big city. In my early adulthood, my biggest mistake was assuming that only major cities could offer real opportunities — and that I could simply squeeze my mental health into my schedule whenever I happened to have time for it. Moving to Kyiv in my early 20s felt like the ultimate dream: a chance to prove I belonged. But to survive there, I felt I had to fit a precise, demanding system. It wasn't enough to simply stay healthy; you were expected to hold a premium membership at a high-end fitness center just  پهپادهای غول‌پیکر را به کالبدی سبک، تاشدنی و قابل‌حمل منتقل کرد. آماده‌سازی بدنه‌ی پرنده برای پرواز تنها حدود ۱۰ ثانیه زمان می‌برد. تجهیزات هدایت پرنده شامل لایدار، رادار موج میلی‌متری و سامانه‌ی بینایی تمام‌رنگی همه‌جهته است. حسگر لایدار موانع بسیار باریک نظیر کابل‌های انتقال برق را از فاصله‌ی ۳۲ متری در محیط‌های کم‌نور شناسایی می‌کند. رادار موج میلی‌متری هنگام مه‌گرفتگی، گردوغبار، باران یا برف پایداری خود را حفظ کرده و دوربین‌های چشم‌ماهی در روشنایی اندک موقعیت‌یابی دقیق را تضمین می‌کنند. مجموعه‌ی تصویربرداری دستگاه از یک دوربین حرارتی بومی 1K با وضوح ۱۲۸۰×۱۰۲۴ پیکسل و حسگرهای چندکانونی عریض، تله‌فوتو میانی و تله‌فوتو تشکیل می‌شود. لنز عریض توانایی ثبت تصاویر تمام‌رنگی در نور ۰٫۰۱ لوکس را دارد و ترکیب سیستم‌ها بزرگ‌نمایی اپتیکال ۱۱ برابری و زوم هیبریدی ۱۷۶ برابری فراهم می‌کند. فاصله‌یاب لیزری پرنده نیز بردی معادل ۳۰۰۰ متر دارد. موتورهای پهپاد نیروی کشش تک‌محوری را در مقایسه با Matrice 4T تقریبا دو برابر افزایش داده‌اند و پروانه‌های زیست‌تقلیدگرایانه صدای دستگاه را زیر ۸۰ دسی‌بل نگه می‌دارند. باتری پهپاد تا ۵۹ دقیقه پرواز مداوم را تاب می‌آورد و گواهی IP55 مقاومت بدنه را بین دماهای منفی ۲۰ تا مثبت ۵۰ درجه‌ی سلسیوس تامین می‌کند. سامانه‌ی مخابراتی O4 Enterprise با همراهی ماژول‌های دوگانه‌ی 4G ارسال سیگنال ویدیویی پایدار را تا فاصله‌ی ۴۰ کیلومتری ممکن می‌سازد. هوش مصنوعی درونی پهپاد بیش از ۲۰ نوع هدف متمایز را تحلیل موازی کرده و خودروها، شناورها و کانون‌های آتش‌سوزی را فورا بازمی‌شناسد. قیمت پهپاد در بازار چین ۵۷٬۴۸۸ یوان، (۸٬۶۰۰ دلار) اعلام شده است و نمایندگی‌های جهانی قیمت را در محدوده‌ی ۸٬۶۰۰ یورو تعیین کرده‌اند.", "image_url": "https://api2.zoomit.ir/media/dji-drone-flying-at-dusk-6aeeca5bb001528ef859db41?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۷ آبان • ۱۷:۴۰"}, {"source": "Business Insider", "title": "DARPA wants AI to find hidden flaws in digital markets that adversaries could exploit to wreak economic havoc", "link": "https://www.businessinsider.com/darpa-wants-to-find-weak-points-digital-markets-2026-11", "summary": "US defense and security agencies, as well as federal regulators, have to combat hacks and data theft. Another challenge is bad actors who exploit gaps in the rules governing key systems, like electronic markets. DARPA hopes to close those. ANGELA WEISS / AFP via Getty Images DARPA is seeking AI tools that can uncover hidden weaknesses in digital markets. Officials warn adversaries could exploit flaws in market rules to cause economic disruption. AI and other technologies could make markets easier to exploit but also help defenders find vulnerabilities. The Pentagon's research arm is seeking new artificial intelligence tools that can uncover hidden flaws in the rules governing US financial and other digital markets and fix them before adversaries can exploit them to cause economic chaos. The Defense Advanced Research Projects Agency 's new Intrinsic Market Resilience program is aimed at protecting electronic markets tied to everything from stocks and bonds to energy and cloud-computing resources. Those critical systems have become faster and more efficient, DARPA says, but their increasingly interconnected nature has also created new avenues for disruption. \"I think that the incredible advances in automated reasoning and in AI are opening new ways to defend things,\" Matthew Wilding, the IMR program manager at DARPA, told Business Insider. \"They can be used to attack things as well, but the focus of this program is using them to defend things, to find those counterexamples and find those improvements we can make to these designs.\" \"The program is taking these two technologies that have really advanced in the last few years and applying them to these electronic markets,\" Wilding said, \"so that they are more resilient and more dependable going forward.\" The concern is less that adversaries could hack these systems or steal data, both longstanding threats, than that they could exploit weaknesses in the design of the markets themselves. The agency pointed to two historical examples of disruption. In the early 2000s, traders exploited weaknesses in California's newly deregulated energy market, contributing to a crisis that DARPA said cost $40 billion to $45 billion. That chaotic incident forced the federal government to invoke the Defense Production Act to ensure the supply of natural gas to military facilities, which DARPA said highlighted how the manipulation of market mechanisms could have serious consequences for military readiness. Disruptions have previousl", "date_str": "2026-11-08T14:00:01+00:00", "hash": "3cb33b538debbbfc", "title_fa": "دارپا از هوش مصنوعی می‌خواهد که نقص‌های پنهان در بازارهای دیجیتال را پیدا کند که دشمنان می‌توانند از آنها برای ایجاد ویرانی اقتصادی سوء استفاده کنند.", "summary_fa": "آژانس های دفاعی و امنیتی ایالات متحده و همچنین تنظیم کننده های فدرال باید با هک ها و سرقت داده ها مبارزه کنند. چالش دیگر، بازیگران بدی هستند که از شکاف‌های موجود در قوانین حاکم بر سیستم‌های کلیدی مانند بازارهای الکترونیکی استفاده می‌کنند. دارپا امیدوار است که آنها را ببندد. ANGELA WEISS / AFP از طریق Getty Images دارپا به دنبال ابزارهای هوش مصنوعی است که بتواند نقاط ضعف پنهان در بازارهای دیجیتال را کشف کند. مقامات هشدار می دهند که دشمنان می توانند از نقص قوانین بازار برای ایجاد اختلال در اقتصاد استفاده کنند. هوش مصنوعی و سایر فناوری‌ها می‌توانند بهره‌برداری از بازارها را آسان‌تر کنند، اما همچنین به مدافعان کمک می‌کنند تا آسیب‌پذیری‌ها را پیدا کنند. بازوی تحقیقاتی پنتاگون به دنبال ابزارهای هوش مصنوعی جدیدی است که می تواند نقص های پنهان قوانین حاکم بر بازارهای مالی و سایر بازارهای دیجیتال ایالات متحده را کشف کند و قبل از اینکه دشمنان بتوانند از آنها برای ایجاد هرج و مرج اقتصادی سوء استفاده کنند، آنها را برطرف کنند. برنامه جدید انعطاف پذیری بازار ذاتی آژانس پروژه های تحقیقاتی پیشرفته دفاعی با هدف حفاظت از بازارهای الکترونیکی مرتبط با همه چیز از سهام و اوراق قرضه گرفته تا انرژی و منابع رایانش ابری است. دارپا می‌گوید، این سیستم‌های حیاتی سریع‌تر و کارآمدتر شده‌اند، اما ماهیت به‌هم پیوسته‌ی فزاینده‌ی آن‌ها نیز راه‌های جدیدی ish practice I had envisioned, but I still wanted us to try. Then, before I knew it, I was catching myself slipping into English, too. The author said her family didn t stick to her no-English rule for long while on their family trip to Puerto Rico. Courtesy of Sandra Lee. My husband doesn't speak Spanish, and with Duolingo as his only teacher , we often defaulted to English so he could follow the conversation. Before long, we were all speaking our own version of Spanglish, mixing languages to get our point across. My no-English rule was harder to enforce than I'd expected. Even I had a lot to learn I grew up speaking Spanish in the US, but it isn't my dominant language. Our kids being able to speak another language is important to my husband and me, so we decided to enroll them in Spanish immersion schools, starting in preschool. The Spanish language varies across countries and regions, but hearing Puerto Rican Spanish reminded me of how different the language can be. Some familiar words sounded unfamiliar, and I kept having to ask locals to describe the word they were using so I could connect it to the one I knew from Mexico, where my mother is from. The cadence and speed of conversations were different too, which made me listen more closely to what was being said. Instead of being the one helping my family navigate the language, I was the one asking questions", "date_str": "2026-11-08T13:53:01+00:00", "hash": "34292788e184f0d5", "title_fa": "من بچه هایم را به تعطیلات بردم تا اسپانیایی شان را تمرین کنند. قانون غیرانگلیسی ما زیاد دوام نیاورد.", "summary_fa": "نویسنده می‌خواست خانواده‌اش در تعطیلات در پورتوریکو فقط به زبان اسپانیایی صحبت کنند. با حسن نیت ساندرا لی. بچه های من از زمان پیش دبستانی در یک مدرسه غوطه وری اسپانیایی در ایالات متحده بوده اند. در سفر به پورتوریکو، فقط می‌خواستم اسپانیایی صحبت کنیم تا آنها بتوانند مهارت‌های خود را تمرین کنند. این سفر به من یادآوری کرد که یادگیری زبان ادامه دارد و در مورد تطبیق با تجربیات جدید است. همانطور که خانواده چهار نفره ed if he felt there was more [ ]", "date_str": "2026-11-09T00:57:48+00:00", "hash": "10d2d699e32d5c66", "title_fa": "نیکلاس کیج فصل اول «عنکبوت نوآر» را «عالی» می‌خواند و می‌گوید که وقتی آن را لغو کرد، احساس آرامش کرد: «هرگز نمی‌خواهی با تکرار یک شخصیت گیر بیفتی».", "summary_fa": "پرایم ویدیو تنها پس از یک فصل، «Spider-Noir» را لغو کرد، و در حالی که طرفداران شوکه شده بودند، این خبر خوبی برای ستاره نیکلاس کیج بود، که تمایلی به ادامه داستان بن ریلی ندارد. در مصاحبه اخیر با IGN، بازیگر «National Treasure» وقتی از او پرسیده شد که آیا احساس می‌کند که «Spider-Noir» بعد از یک فصل بیشتر [ ] Prime Video لغو شده است، با یک «نه» ساده پاسخ داد و در حالی که طرفداران شوکه شده بودند، این خبر خوبی برای ستاره نیکلاس کیج بود، که تمایلی به ادامه داستان بن ریلی ندارد. «بنابراین وقتی آنها آن را نگرفتند، من گفتم، وای، متشکرم! چون الان دارم «True Detective» رو می‌کنم و این فقط یک فصل است. اینطوری بهتر است، می‌دانی؟» او ادامه داد. «نمی‌خواستم آن را تکرار کنم. من دوست ندارم خودم را تکرار کنم عالی است و من آن شخصیت را دوست دارم. من آن فصل را دوست دارم و همیشه آنجا خواهد بود و همیشه تازه خواهد بود.\" ماه گذشته، پس از انتشار اخباری مبنی بر لغو برنامه، کیج علیه آمازون صحبت کرد، زیرا ظاهراً شرکت از او خواسته بود تا معافیت هوش مصنوعی را امضا کند. کیج در جریان یک پنل کامیک کان نیویورک گفت: «آمازون یک شرکت بسیار دوستدار هوش مصنوعی است که بالغ بر 50 میلیارد دلار در OpenAI سرمایه گذاری کرده است. من یک بازیگر دوستدار هوش مصنوعی نیستم، بنابراین مثل این است که این نقاط را به هم وصل کنید! من عضو باشگاه آنها نیستم. من این معافیت را امضا نکردم تا به آنها اجازه بدهم از هوش مصنوعی در «Spider Noir» استفاده کنند. احتمالاً قرار نیست دوباره با آن استودیو کار کنم، اما اشکالی ندارد.» بر اساس رتبه‌بندی محتوای استریم Nielsen، Spider-Noir در شش هفته اول 2.6 میلیارد دقیقه بازدید کسب کرده است. 11 نامزدی امی و 5 بار", "image_url": "https://variety.com/wp-content/uploads/2026/10/TCDSPNO_ZU019.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "OpenAI"], "datetime_fa": "۱۸ آبان • ۰۴: ike Gangs Ain t Good (Free Yo Mind) and You Can Be My Brother, Friend. When Druski was announced as a season 52 host for Saturday Night Live , he got plenty of support from his hip-hop friends . Among those sending him congratulatory comments were Drake, Travis Scott, Quavo and Wheezy. Watch Druski in Saturday night s Proposal and Golden Age of Hip-Hop sketches below.", "date_str": "2026-11-08T23:17:10+00:00", "hash": "7dff91646d841966", "title_fa": "بهترین اسکچ های «SNL» دروسکی او را در حال خواندن از طریق یک پیشنهاد اشتباه و در یک تقلید هیپ هاپ می خواند", "summary_fa": "دروسکی اولین میزبانی SNL خود را در اپیزودی انجام داد که The Strokes به عنوان مهمان موزیکال حضور داشت، اما زمانی که دروسکی در حال غر زدن بود، گفت بله در همان لحظه کمدی مناسب که کرم گوش واقعی سریال بود. تماشای مرتبط Druski با مارچلو هرناندز به این موفقیت لاتین ویروسی رسید. یکی از خنده‌دارترین طرح‌هایی که شنبه شب (7 نوامبر) روی آنتن رفت، میزبان SNL نشان داد که در کمدی موزیکال و استعداد آوازی مهارت دارد. در Proposal، جرمی کولهن، بازیگر SNL نقش مردی را بازی می‌کند که از دوست دخترش (سارا شرمن) می‌خواهد با او ازدواج کند، و همه چیز طبق برنامه پیش نمی‌رود. اما از آنجایی که او فرض کرد که او بله می‌گوید و تمام تلاش خود را می‌کرد تا این خواستگاری را به یک لحظه فراموش‌نشدنی تبدیل کند، نمایش برای سرگرمی استخدام‌شده‌اش دروسکی ادامه می‌یابد و ماهرانه یک پایان موسیقی ناخوشایند را رهبری می‌کند که قرار بود نامزدی را جشن بگیرد. من واقعاً نمی دانم چگونه این را به شما بگویم، اما وقتی شرمن او را رد کرد، کولهن می گوید که چهار دقیقه بعدی واقعاً سخت است. و سپس همه چشم‌ها (و گوش‌ها) به دروسکی و گروهی است که همچنان در اطراف او رشد می‌کند، در حالی که او با روح کمربند می‌بندد: او گفت بله، اوه، او گفت بله/ نمی‌توانم صبر کنم تا او را با آن لباس ببینم/ روی یک زانو افتاد و او گفت بله. یکی از نکات برجسته دیگر اپیزود، طرح پایانی، عصر طلایی هیپ هاپ بود، یک پارودی به سبک مستند تلویزیونی که داستان یک گروه هیپ هاپ آگاهانه اجتماعی به نام Lenny The Street Smart Crew (دروسکی، جیمز آستین جانسون، بن مارشال، کام پترسون و تامی برنان) را روایت می  2010 با هم آشنا شدند و به سرعت با هم دوست شدند (رابطه آنها حتی الهام بخش جلد 2015 Vogue با عنوان \"در جاده با بهترین دوستان تیلور سویفت و کارلی کلوس\" شد). کلوس در همان سال در موزیک ویدیوی \"Bad Blood\" سوئیفت ظاهر شد و یکی از اعضای اصلی \"گروه دختران\" \"1989\" نوازنده بود که به طور مرتب در کنسرت ها و رویدادها با هم شرکت می کردند. در سپتامبر، سوئیفت در اولین بازی فصل چیفز شرکت کرد، که طی آن به دلیل نشستن در کنار تام کروز، تیتر خبرها شد. کروز در حین حضور در برنامه \"The Tonight Show\" پس از بازی به جیمی فالون گفت: \"او به من در مورد فوتبال آموزش می داد. در واقع.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/New-York-Jets-v-Kansas-City-Chiefs-1000.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۸ آبان • ۰۰:۰۹"}, {"source": "Billboard", "title": "Taylor Swift and Karlie Kloss Attend Travis Kelce’s Chiefs Game in Kansas City", "link": "https://www.billboard.com/music/music-news/taylor-swift-karlie-kloss-travis-kelce-chiefs-game-1236377058/", "summary": "Taylor Swift had some familiar company as she cheered on husband Travis Kelce and the Kansas City Chiefs. The 36-year-old pop superstar watched the Chiefs take on the New York Jets at Arrowhead Stadium in Kansas City on Sunday (Nov. 8), joined by longtime friend Karlie Kloss. The supermodel, 34, was also among the guests at Swift and Kelce’s July 3 wedding at Madison Square Garden in New York City. Swift and Kloss appeared in good spirits as they watched the Chiefs take the field for their ninth game of the season. The “Shake It Off” singer wore a red Chiefs sweater as she cheered on Kelce alongside her parents, Andrea and Scott Swift. Sunday’s matchup also marked a career milestone for Kelce, who made his 200th NFL appearance. Swift and Kloss first struck up a friendship in 2013, eventually becoming close enough to share the cover of Vogue in 2015. Their relationship later became the subject of speculation when they were seen together less frequently. Kloss attended one of Swift’s Eras Tour shows in 2023. “Listen, I try to protect the privacy of my friends’ personal lives,” Kloss said during a July appearance on the Today show. “But what I will say is that they’re an amazing couple and I’m so happy for them.” Sunday marked Swift’s fourth appearance at a Chiefs game this season. She previously attended the team’s Oct. 18 home game against the Los Angeles Chargers. She watched that matchup from a suite alongside musician Este Haim and basketball star Caitlin Clark. Earlier in the season, Swift attended the Chiefs’ Sept. 14 game against the Denver Broncos, where she was spotted with actor Tom Cruise. She returned to Arrowhead Stadium on Sept. 20 for the team’s matchup against the Indianapolis Colts. Swift’s Oct. 18 appearance at Arrowhead Stadium came just one day after a surprise appearance at the 2026 Academy Museum Gala in Los Angeles. There, she delivered the live debut of “The Fate of Ophelia” during a short set. The Oct. 17 event honored filmmaker John Carpenter, Colman Domingo and Charlize Theron.", "date_str": "2026-11-08T20:58:07+00:00", "hash": "ce082904c8b438c8", "title_fa": "تیلور سویفت و کارلی کلوس در بازی تراویس کلس در کانزاس سیتی شرکت کردند.", "summary_fa": "تیلور سوئیفت با تشویق شوهرش تراویس کلس و سران شهر کانزاس، شرکتی آشنا داشت. سوپراستار 36 ساله پاپ روز یکشنبه (8 نوامبر) در ورزشگاه اروهد در کانزاس سیتی، چیفز را با نیویورک جتس تماشا کرد که دوست دیرینه کارلی کلوس به آنها پیوست. این سوپرمدل 34 ساله همچنین در میان مهمانان عروسی سوئیفت و کلسه در 3 جولای در مدیسون اسکوئر گاردن در شهر نیویورک حضور داشت. سوئیفت و کلوس در حالی که شاهد حضور چیفز در زمین بازی برای نهمین بازی فصل خود بودند، با روحیه خوبی ظاهر شدند. خواننده \"Shake It Off\" در حالی که در کنار پدر و مادرش، آندریا و اسکات سویفت، کلسه را تشویق می کرد، یک ژاکت چیفز قرمز پوشید. مسابقه روز یکشنبه همچنین نقطه عطفی در حرفه ای برای کلسه بود که دویستمین بازی NFL خود را انجام داد. سوئیفت و کلوس برای اولین بار در سال 2013 با هم دوست شدند و در نهای
