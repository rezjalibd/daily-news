//www.businessinsider.com/lane-kiffin-chatgpt-for-legal-advice-2026-9", "summary": "During a critical moment, Lane Kiffin s friend said the LSU football coach turned to an unlikely source. Gus Stark/LSU/University Images via Getty Images LSU football coach Lane Kiffin's program was in the middle of an unprecedented legal fight. Sports attorney Tom Mars, Kiffin's friend, told ESPN that the LSU coach turned to ChatGPT. Mars said Kiffin would send him screenshots of ChatGPT's legal responses, which were wrong on the law. Indiana head coach and reigning national champion Curt Cignetti has Google in his corner. Apparently, LSU football coach Lane Kiffin relies on ChatGPT. According to Kiffin's friend, who is also one of the nation's most prominent sports lawyers, the LSU football coach turned to ChatGPT for legal advice at a critical moment for the university. \"Usually, when I would express an opinion about what LSU was doing, Lane would reply with a screenshot from ChatGPT that supported LSU's position, which was almost always wrong,\" Attorney Tom Mars told ESPN. Despite incurring the wrath of rivals, the Southeastern Conference (SEC), the NCAA, and many, many talking heads, LSU initially fought to add former NFL players Dae'Quan Wright and Zxavian Harris to Kiffin's inaugural squad. In November, LSU announced that it had hired Kiffin away from the Ole Miss Rebels, a fellow SEC member, with a seven-year, $91 million deal that came in the middle of the Rebels' College Football Playoff run. Both Wright and Harris played under Kiffin at Ole Miss, and both signed with NFL teams after going undrafted. The situation escalated to the point that the SEC, of which LSU is a founding member, went to court to secure a ruling allowing conference leaders representing the other members to meet and consider LSU's status. If LSU were kicked out of the SEC, the university would likely lose out on lucrative conference TV rights payments. With university presidents, state attorneys general, governors, and even members of Congress involved, LSU was facing an unprecedented fight over its very future. Mars said that he told his friend the stakes were too high to rely on an AI chatbot. \"Eventually I told him that a guy with a $91 million contract ought to have a top-notch lawyer on speed dial and not be using ChatGPT for legal advice,\" he said. Representatives for Kiffin, Mars, and OpenAI did not respond to a request for comment. LSU declined to comment. While Wright and Harris prevailed in state court, LSU ultimately backed down and announced a final 2026 roster th", "date_str": "2026-09-19T09:17:01+00:00", "hash": "e4900a9da19fc07c", "title_fa": "دوست می گوید، مربی LSU لین کیفین از ChatGPT مشاوره حقوقی می خواست", "summary_fa": "در یک لحظه حساس، دوست لین کیفین گفت که مربی فوتبال LSU به یک منبع بعید مراجعه کرده است. گاس استارک/LSU/تصاویر دانشگاه از طریق گتی ایماژ برنامه لین کیفین مربی فوتبال LSU در میانه یک دعوای حقوقی بی سابقه بود. تام مارس، وکیل ورزشی، دوست کیفین، به ESPN گفت که مربی LSU به ChatGPT روی آورد. مارس گفت که کیفین اسکرین شات هایی از پاسخ های حقوقی ChatGPT را برای او ارسال می کند که طبق قانون اشتباه بوده است. کورت سیگنتی، سرمربی ایندیانا و قهرمان فعلی ملی، گوگل را در گوشه خود دارد. ظاهراً لین کیفین مربی فوتبال LSU به ChatGPT متکی است. به گفته دوست کیفین، که همچنین یکی از برجسته ترین وکلای ورزش کشور است، مربی فوتبال LSU برای مشاوره حقوقی در یک لحظه حساس برای دانشگاه به ChatGPT مراجعه کرد. تام مارس، وکیل دادگستری به ESPN گفت: «معمولا، زمانی که نظری در مورد کاری که LSU انجام می‌دهد، لین با یک اسکرین شات از ChatGPT که از موضع LSU پشتیبانی می‌کرد، پاسخ می‌داد، که تقریباً همیشه اشتباه بود. با وجود خشم رقبا، کنفرانس جنوب شرقی (SEC)، NCAA، و بسیاری از سران سخنگو، LSU در ابتدا برای اضافه کردن بازیکنان سابق NFL، Dae'Quan Wright و Zxavian Harris به تیم افتتاحیه کیفین مبارزه کرد. در نوامبر، LSU اعلام کرد که Kiffin را از Ole Miss Rebels، یکی از اعضای SEC، با قراردادی هفت ساله به مبلغ 91 میلیون دلار که در اواسط رقابت های پلی آف فوتبال کالج Rebels به دست آمد، استخدام کرده است. رایت و هریس هر دو زیر نظر کیفین در Ole Miss بازی کردند و هر دو با تیم‌های NFL قرارداد امضا کردند. اوضاع به حدی افزایش یافت که SEC، که LSU یکی از اعضای موسس آن است، به دادگاه رفت تا حکمی را به دست آورد که به رهبران کنفرانس که نماینده سایر"}, {"source": "Business Insider", "title": "A colorectal dietitian shares 2 foods she eats regularly and 1 she avoids to lower her cancer risk", "link": "https://www.businessinsider.com/dietitian-eats-food-avoids-to-lower-colon-cancer-risk-2026-9", "summary": "Sophie Medlin is a consultant colorectal dietitian. Sophie Medlin After 20 years of being a colorectal dietitian, Sophie Medlin has tweaked her diet along the way. There are certain foods she has cut out or minimized, while others she's made a habit of eating. She makes eating foods that can lower colon cancer risk as easy as possible. Sophie Medlin has been a colorectal dietitian for 20 years, and in that time she has made some changes to her diet to lower her risk of colon cancer. Medlin and her husband, who is a chef, cook most of their meals, meaning they mainly eat a diet of whole, unprocessed foods . But they still go out for dinner or order takeout occasionally. \"It's not perfect all the time. Nobody can be perfect all the time,\" Medlin, who is based in London, told Business Insider. Cases of colon cancer in younger people have been rising since the mid-90s, and it is now the deadliest cancer form of the disease for under-50s. While scientists don't know what's behind the uptick, evidence suggest that healthy lifestyle choices like exercising regularly and eating a balanced diet, lower the risk. Medlin shared the two foods that she tries to eat daily and one she limits as much as possible. Limit red meat and eliminate processed meat \"I've essentially eliminated processed meat,\" she said. This includes buzzy snacks like beef jerky, which are \"getting a bit of a health halo at the moment because of the high protein trend,\" Medlin said. Processed meat , such as hot dogs and deli meat, as well as unprocessed red meat, have been linked to colorectal cancer to varying degrees. Medlin does eat red meat, but limits it to a maximum of two servings a week. The World Cancer Research advises eating no more than 350 to 500 grams of red meat a week, or around three portions. Eat plenty of different plants Eating plenty of plants is a priority for Medlin, she said. The gut microbiome , the trillions of microbes that live in the colon lining and influence overall health, including chronic disease risk, thrives when it's fed lots of different types of plant foods. The beneficial bugs eat fiber, which is found in plants. \"When we ferment plant foods in our gut, then we produce these postbiotics, which are things like short-chain fatty acids that help to protect us from colorectal cancers,\" Medlin said. She tells her patients to chop up and throw an extra vegetable into the pan when cooking dinner. \"It's just as quick, and then you get an extra type of vegetable in th", "date_str": "2026-09-19T09:06:01+00:00", "hash": "f76c8c321364d29d", "title_fa": "یک متخصص تغذیه کولورکتال برای کاهش خطر ابتلا به سرطان، 2 خوراکی را که به طور منظم می خورد و 1 غذا را اجتناب می کند به اشتراک می گذارد.", "summary_fa": "سوفی مدلین یک مشاور رژیم درمانی کولورکتال است. سوفی مدلین پس از 20 سال متخصص تغذیه کولورکتال، سوفی مدلین رژیم غذایی خود را در طول مسیر تغییر داد. غذاهای خاصی وجود دارد که او آنها را حذف کرده یا به حداقل رسانده است، در حالی که برخی دیگر را عادت به خوردن کرده است. او خوردن غذاهایی را که می تواند خطر سرطان روده بزرگ را کاهش دهد تا حد امکان آسان می کند. سوفی مدلین 20 سال است که یک متخصص تغذیه روده بزرگ بوده است و در این مدت تغییراتی در رژیم غذایی خود ایجاد کرده است تا خطر ابتلا به سرطان روده را کاهش دهد. مدلین و همسرش که یک سرآشپز است، بیشتر وعده‌های غذایی خود را می‌پزند، به این معنی که آنها عمدتاً از غذاهای کامل و فرآوری نشده استفاده می‌کنند. اما آنها هنوز هم برای شام بیرون می روند یا گهگاه سفارش غذای بیرون می دهند. مدلین که مقیم لندن است به Business Insider گفت: \"همیشه کامل نیست. هیچ کس نمی تواند همیشه کامل باشد.\" موارد سرطان روده بزرگ در افراد جوان از اواسط دهه 90 افزایش یافته است و در حال حاضر این سرطان کشنده ترین شکل این بیماری برای افراد زیر 50 سال است. در حالی که دانشمندان نمی دانند چه چیزی پشت این افزایش وجود دارد، شواهد نشان می دهد که انتخاب های سبک زندگی سالم مانند ورزش منظم و خوردن یک رژیم غذایی متعادل، این خطر را کاهش می دهد. مدلین دو غذایی را که سعی می کند روزانه بخورد و یکی را که تا حد امکان محدود می کند به اشتراک گذاشت. گوشت قرمز را محدود کنید و گوشت فرآوری شده را حذف کنید او گفت: «من اساساً گوشت فرآوری شده را حذف کردم. Medlin گفت: این شامل تنقلات پر سر و صدایی مانند گوشت گاو است که \"به دلیل"}, {"source": "Business Insider", "title": "Student-debt relief is in limbo for borrowers pursuing a major forgiveness program for public servants", "link": "https://www.businessinsider.com/public-service-loan-forgiveness-pslf-debt-relief-delays-lawsuits-trump-2026-9", "summary": "Student-loan borrowers are facing delays getting relief through the Public Service Loan Forgiveness program. nirat/Getty Images Student-loan borrowers have reported delays with Public Service Loan Forgiveness processing. Some have made the required amount of payments, but are waiting for the relief to be reflected. At the same time, PSLF eligibility is facing ongoing litigation. A major student-loan forgiveness program is facing changes — and delays. Student-loan borrowers pursuing Public Service Loan Forgiveness, which forgives student debt for government and nonprofit workers after 10 years of qualifying payments, have found that their payment count er s have not updated to reflect payments that put them at the forgiveness threshold. For example, some borrowers who made their 120th payment over the past few months are still waiting for their payment counter on Federal Student Aid to reflect that they qualify for relief. The delay means borrowers must choose between continuing to make payments they might not owe or stopping payments and risking being flagged for delinquency. The Education Department did not comment on the delay or when it will be resolved, and a spokesperson said that the agency \"remains committed to ensuring that every qualifying payment is properly credited to a borrower's account.\" The processing delays are not the only challenge borrowers pursuing PSLF face. President Donald Trump's student-loan repayment overhaul implemented stricter rules on determining a qualifying PSLF payment, and the Department of Education is fighting in court to implement its plan to narrow eligibility for the program. Some borrowers also had some of their PSLF payments rescinded , which the administration cited to code errors. Beyond PSLF, borrowers have been navigating Trump's overhaul and the higher bills it has brought. The administration has said that its changes are intended to simplify a complex repayment system and compel colleges to lower their tuition. Still, borrowers have reported administrative errors and inaccurate account statuses, putting their budgets in limbo. Ayelet Sheffey covers all things student debt, from the latest Education Department news to stories of borrowers navigating their loans. To stay up to date on her coverage, sign up to get email alerts for her new stories here . What's ahead for PSLF borrowers Following Trump's repayment changes, the stakes are higher for borrowers to be exactly on time with their payments. Prior to the ", "date_str": "2026-09-19T09:01:02+00:00", "hash": "75f3366c8c258599", "title_fa": "بخشودگی بدهی های دانشجویی برای وام گیرندگانی که برنامه بخشودگی عمده برای کارمندان دولتی را دنبال می کنند در هاله ای از ابهام قرار دارد.", "summary_fa": "وام گیرندگان وام دانشجویی با تاخیر در دریافت تسهیلات از طریق برنامه بخشودگی وام خدمات عمومی مواجه هستند. nirat/Getty Images وام گیرندگان وام دانشجویی تاخیر در پردازش بخشودگی وام خدمات عمومی را گزارش کرده اند. برخی مبلغ مورد نیاز را پرداخت کرده اند اما منتظر انعکاس تسهیلات هستند. در عین حال، واجد شرایط بودن PSLF با دعوی قضایی در حال انجام است. یک برنامه عمده بخشش وام دانشجویی با تغییرات - و تاخیر مواجه است. وام گیرندگان وام دانشجویی که به دنبال بخشودگی وام خدمات عمومی هستند، که بدهی دانشجویی را برای کارکنان دولتی و غیرانتفاعی پس از 10 سال پرداخت واجد شرایط می بخشد، متوجه شده اند که شمارش پرداخت آنها برای منعکس کردن پرداخت هایی که آنها را در آستانه بخشش قرار می دهد، به روز نشده است. به عنوان مثال، برخی از وام گیرندگانی که در چند ماه گذشته صد و بیستمین پرداخت خود را انجام داده اند، هنوز در انتظار دریافت شمارنده پرداخت خود در کمک دانشجویی فدرال هستند تا نشان دهد که واجد شرایط دریافت تسهیلات هستند. تأخیر به این معنی است که وام گیرندگان باید بین ادامه پرداخت‌هایی که ممکن است بدهکار نباشند یا توقف پرداخت‌ها و خطر شناسایی شدن به دلیل معوقه یکی را انتخاب کنند. وزارت آموزش و پرورش در مورد تأخیر یا زمان حل آن اظهار نظری نکرد و یک سخنگوی گفت که آژانس \"متعهد است اطمینان حاصل کند که هر پرداخت واجد شرایط به درستی به حساب وام گیرنده واریز می شود.\" تأخیر در پردازش تنها چالشی نیست که وام گیرندگان به دنبال PSLF هستند. بازپرداخت وام دانشجویی رئیس جمهور دونالد ترامپ، قوانین سختگیرانه تری را برای تعیین پرداخت واجد شرایط PSLF اجرا کرد و وزارت آموزش در دادگاه برای اجرای طرح خود برای محدود کردن صلاحیت برای این برنامه مبارزه می کند. برخی از وام گیرندگان نیز برخی از"}, {"source": "Business Insider", "title": "I drove Cadillac's entry-level EV. It hits Caddy's affordability sweet spot.", "link": "https://www.businessinsider.com/cadillac-optiq-review-pricing-ev-2026-9", "summary": "The Cadillac Optiq is a convincing entry point into Cadillac s EV lineup because it delivers the brand theater. Ben Shimkus/Business Insider I tested the Cadillac Optiq, the cheapest EV in GM's luxury lineup. Its elegant design and supple ride make it properly Caddy-ish. The Optiq isn't the fastest EV, but that's OK. The interior materials, though? Some aren't great. Cadillac's entry-level EV doesn't feel particularly entry-level. The Optiq is the cheapest way to get into an EV with GM's luxury badge. It's a crossover-like SUV with a base trim that starts just under $50,000 — or, less money than the average American car . I spent a week and about 400 miles in a 2026 Cadillac Optiq Premium Sport, driving from New York City to upstate New York and back with up to three passengers and several large suitcases in tow. My rear-wheel-drive tester stickered at $58,976 with options, including 21-inch wheels, two-tone exterior paint, and Cadillac's warm brown Autumn Canyon leather interior. That package is hardly pocket change — but after a week behind the wheel, I wondered why buyers would spend more for some other Caddys. Easy on the eyes and on the throttle The Optiq has stage presence. Ben Shimkus/Business Insider The Optiq nails the first impression. Stacked LEDs in the front and back give the crossover a recognizable signature at night. They also put on a dazzling welcome light show as you approach. Inside, a curved 33-inch display stretches across the dashboard, caramel-colored seats look properly expensive, and — praise be — Cadillac kept physical climate-control buttons underneath the screen. It looks like a Cadillac. More importantly, it drives like one, too. The interior and exterior both carry Caddy s star quality. Ben Shimkus/Business Insider The steering was accurate, the suspension softened rough pavement despite those huge wheels, and road noise was virtually nonexistent. Optiq also benefits from GM's SuperCruise assisted highway driving. It was impressive on my highway-dominant drive upstate, automatically pulling into an open passing lane when I caught slower traffic. It, however, occasionally moved over when faster traffic was approaching from behind, a trait that I'm sure drew the ire of other New York drivers. Off the line, this Optiq takes a rather leisurely approach to acceleration. That's not a bad thing, especially compared to other EVs I've recently driven that are faster than they need to be. The RWD Optiq still had enough verve to merge c", "date_str": "2026-09-19T09:01:01+00:00", "hash": "eedd6a1114bffd2e", "title_fa": "من خودروی برقی سطح پایه کادیلاک را رانندگی کردم. آن را به نقطه شیرین مقرون به صرفه Caddy.", "summary_fa": "Cadillac Optiq نقطه ورود قانع کننده ای به خط تولید خودروهای برقی کادیلاک است، زیرا تئاتر برند را ارائه می دهد. بن شیمکوس/Business Insider من کادیلاک Optiq، ارزان‌ترین خودروی برقی در خط تولید لوکس جنرال موتورز را آزمایش کردم. طراحی زیبا و سواری منعطف آن را به درستی کادویی می کند. Optiq سریعترین EV نیست، اما مشکلی ندارد. با این حال، مواد داخلی؟ بعضی ها عالی نیستند خودروی برقی سطح پایه کادیلاک به‌خصوص در سطح ابتدایی احساس نمی‌شود. Optiq ارزان ترین راه برای سوار شدن به خودروهای برقی با نشان لوکس جنرال موتورز است. این یک شاسی بلند کراس اوور با تریم پایه است که قیمت آن کمتر از 50000 دلار است – یا پول کمتری نسبت به یک خودروی معمولی آمریکایی. من یک هفته و حدود 400 مایل را در یک کادیلاک اپتیک پریمیوم اسپرت مدل 2026 گذراندم و از شهر نیویورک به سمت شمال نیویورک و با حداکثر سه مسافر و چند چمدان بزرگ در یدک کش رانندگی کردم. تستر دیفرانسیل عقب من به قیمت 58976 دلار با آپشن هایی شامل رینگ های 21 اینچی، رنگ بیرونی دو رنگ و فضای داخلی چرمی قهوه ای گرم کادیلاک Autumn Canyon به فروش می رسد. این بسته به سختی قابل تعویض در جیب است - اما بعد از یک هفته پشت فرمان، تعجب کردم که چرا خریداران برای برخی دیگر از Caddys هزینه بیشتری می کنند. به راحتی در چشم و دریچه گاز Optiq حضور صحنه ای دارد. بن شیمکوس/Business Insider Optiq اولین برداشت را نشان می دهد. ال ای دی های انباشته شده در جلو و پشت به کراس اوور در شب علامت قابل تشخیصی می دهد. آنها همچنین با نزدیک شدن شما یک نمایش نور خیره کننده خیره کننده را برگزار می کنند. در داخل، یک صفحه نمایش 33 اینچی منحنی بر روی داشبورد کشیده شده است، صندلی‌های"}, {"source": "Business Insider", "title": "Sheryl Sandberg says women aren't losing ambition. Companies are pushing them out.", "link": "https://www.businessinsider.com/sheryl-sandberg-lean-in-why-women-leaving-corporate-leadership-2026-9", "summary": "Sheryl Sandberg, the former COO of Meta and founder of the Lean In organization, said it s concerning that fewer women are interested in promotions compared to men — despite being just as motivated. Bloomberg/Getty Images Sheryl Sandberg says she's disappointed to see fewer women in corporate leadership. She said women are as ambitious as men but feel they're valued less in the workplace. She believes companies could do more to retain and encourage female leaders. More than a decade after telling women to \"lean in,\" Sheryl Sandberg is concerned that more are leaning out — but not because they lack ambition. Sandberg, Meta's former COO and author of the 2013 bestseller \"Lean In,\" told Business Insider that there's a gender gap when it comes to leadership ambitions in 2026. \"This is not the women who are saying, 'I don't want to do it,'\" Sandberg, 57, said. \"It's the women saying, 'I don't want to do it because I'm not wanted, I'm not getting the same opportunities and the same support, and I face an unfair burden at home.'\" Lean In, the nonprofit organization Sandberg founded in tandem with her book's publication, has been releasing its annual Women in the Workplace reports with McKinsey since 2015. In its 2025 Women in the Workplace report , which surveyed 9,500 US employees across 124 organizations, Lean In found that, despite having practically identical levels of career motivation as men, women were less likely to want a promotion . Lean In s 2025 Women in the Workplace report found a gender gap when it came to women wanting promotions. Lean In When asked why, 25% of the women who didn't want to advance cited \"personal obligations,\" compared to 15% of men who said the same. The report also found gaps in household labor as well as opportunities for mentorship for women. At Business Insider, we've been covering this trend. Amid mass layoffs and newly enforced RTO mandates , some women who have moved up in the corporate world during the \"Lean In\" era are feeling burnt out and are stepping back. They have shared their stories with us, of starting their own businesses, going freelance, or, in one case, moving to Antarctica . Sandberg finds this shift \"concerning\" — both for women and companies at large. \"We're at a critical moment in time for women, because what a lot of women are seeing is that commitment to them in leadership pulling back,\" Sandberg said. \"Then what's happening to them is their ambition is pulling back. And that's a loss. It's a loss for o", "date_str": "2026-09-19T09:00:01+00:00", "hash": "d7844a2371501678", "title_fa": "شریل سندبرگ می گوید زنان جاه طلبی خود را از دست نمی دهند. شرکت ها آنها را بیرون می کنند.", "summary_fa": "شریل سندبرگ، مدیر اجرایی سابق Meta و بنیانگذار سازمان Lean In، گفت: این نگران کننده است که زنان کمتری در مقایسه با مردان به ترفیعات علاقه مند هستند – علیرغم اینکه به همان اندازه انگیزه دارند. بلومبرگ/گتی ایماژ شریل سندبرگ می گوید که از دیدن زنان کمتر در رهبری شرکت ناامید شده است. او گفت که زنان به اندازه مردان جاه طلب هستند اما احساس می کنند در محل کار کمتر به آنها ارزش داده می شود. او معتقد است که شرکت‌ها می‌توانند کارهای بیشتری برای حفظ و تشویق رهبران زن انجام دهند. بیش از یک دهه پس از اینکه شریل سندبرگ به زنان گفت که «به سمت خود متمایل شوند»، نگران است که افراد بیشتری به سمت خود متمایل شوند - اما نه به این دلیل که جاه طلبی ندارند. سندبرگ، مدیر ارشد اجرایی سابق متا و نویسنده کتاب پرفروش سال 2013 \"Lean In\" به Business Insider گفت که در مورد جاه طلبی های رهبری در سال 2026 شکاف جنسیتی وجود دارد. سندبرگ 57 ساله گفت: \"این زنان نیستند که می گویند \"من نمی خواهم این کار را انجام دهم.\" این زنان هستند که می‌گویند: «من نمی‌خواهم این کار را انجام دهم، زیرا نمی‌خواهم، فرصت‌ها و حمایت‌های یکسان را دریافت نمی‌کنم، و در خانه با بار ناعادلانه‌ای مواجه می‌شوم.» Lean In، سازمان غیرانتفاعی سندبرگ که همزمان با انتشار کتابش تأسیس شد، از ۲ گزارش سالانه زنان در محل کار با McKinsey منتشر می‌کند. Lean In در گزارش سال 2025 زنان در محل کار، که 9500 کارمند ایالات متحده را در 124 سازمان مورد بررسی قرار داد، دریافت که علیرغم داشتن سطوحی از انگیزه شغلی تقریباً مشابه با مردان، زنان کمتر تمایل به ترفیع دارند. گزارش زنان در محل کار Lean In s 2025 در مورد زنانی که خواهان ترفیع هستند، شکاف جنسیتی پیدا کرد. Lean In وقتی از آنها"}, {"source": "Business Insider", "title": "I'm 65 and caring for my 87-year-old mom with dementia. Going to work is sometimes my only break.", "link": "https://www.businessinsider.com/caregiver-mother-dementia-honest-caregiving-burnout-2026-9", "summary": "Angela Davis, 65, cares for her 87-year-old mom with dementia. Camille Farrah Lenain for BI This as-told-to essay is based on a conversation with Angela Davis, 65, who lives in New Orleans with her 87-year-old mom with dementia . She said her mom's at-home care is upward of $7,000 a month. This interview has been edited for length and clarity. My mom and dad were never married. I grew up in New Orleans and went to an all-girls Catholic high school. My mom was a school teacher and bought a house in her 30s, which I recently transferred to my son. My dad was a math teacher, but left that to help his dad run a furniture moving business. I went to Fisk University and moved to Texas, then Connecticut. I did my clinical fellowship at Yale University and had a son. I moved back to New Orleans because I didn't want my grandparents and parents to be strangers to him. I worked as a licensed clinical social worker in schools before retiring. I've also earned income from real estate , as I own over a dozen rental homes. Are you paying for your own or your loved one's long-term care? Do you have thoughts to share about long-term care in the US? To share your story with a reporter, please fill out this quick form . I started noticing changes in my mom's behavior I have no brothers or sisters, which has made the last few years challenging. My parents were independent for a while. About eight or nine years ago, I started to notice some changes in my mom's behavior . One time, I was following her car, and she missed the exit to go to her house. Another time, she called the police because she said someone had taken her dog from her car, even though the dog was home. Then, it all accelerated. She went around telling people that I was trying to steal her house and her money. She changed the locks, which I found out when we couldn't get in touch for three days. I literally broke into the house, and she was on the floor. She spent about two weeks in the hospital, though her services were extremely limited because she had stopped paying her Medicare premium . This was about two and a half years ago. She was diagnosed with dementia in February 2024. Davis 87-year-old mom lives with her. Camille Farrah Lenain for BI I briefly put her in a facility, but it didn't work out. The facility stated that my mom needed services that she hadn't needed when I dropped her off. They were willing to provide additional services if I would pay $2,000 more. That being the case, I brought her back ", "date_str": "2026-09-19T08:13:01+00:00", "hash": "e9844f61039d0f67", "title_fa": "من 65 ساله هستم و از مادر 87 ساله ام که مبتلا به زوال عقل است مراقبت می کنم. سر کار رفتن گاهی اوقات تنها استراحت من است.", "summary_fa": "آنجلا دیویس، 65 ساله، از مادر 87 ساله خود که دچار زوال عقل است مراقبت می کند. Camille Farrah Lenain برای BI این مقاله گفته شده بر اساس گفتگو با آنجلا دیویس، 65 ساله است که با مادر 87 ساله اش مبتلا به زوال عقل در نیواورلئان زندگی می کند. او گفت که مراقبت مادرش در خانه بیش از 7000 دلار در ماه است. این مصاحبه برای طولانی بودن و وضوح ویرایش شده است. مامان و بابام هیچوقت ازدواج نکردن من در نیواورلئان بزرگ شدم و به یک دبیرستان دخترانه کاتولیک رفتم. مادرم معلم مدرسه بود و خانه ای در 30 سالگی خرید که اخیراً آن را به پسرم منتقل کردم. پدرم معلم ریاضی بود، اما این را ترک کرد تا به پدرش در اداره یک تجارت اسباب کشی کمک کند. من به دانشگاه فیسک رفتم و به تگزاس و سپس کانکتیکات نقل مکان کردم. فلوشیپ بالینی خود را در دانشگاه ییل انجام دادم و صاحب یک پسر شدم. من به نیواورلئان بازگشتم زیرا نمی خواستم پدربزرگ و مادربزرگ و والدینم برای او غریبه باشند. من قبل از بازنشستگی به عنوان مددکار اجتماعی بالینی دارای مجوز در مدارس کار می کردم. من همچنین از املاک و مستغلات درآمد کسب کرده ام، زیرا بیش از دوازده خانه اجاره ای دارم. آیا برای مراقبت طولانی مدت خود یا عزیزتان هزینه می کنید؟ آیا فکری برای به اشتراک گذاشتن در مورد مراقبت طولانی مدت در ایالات متحده دارید؟ برای به اشتراک گذاشتن داستان خود با یک خبرنگار، لطفاً این فرم سریع را پر کنید. من متوجه تغییراتی در رفتار مادرم شدم، برادر یا خواهری ندارم، که این چند سال اخیر را چالش برانگیز کرده است. پدر و مادرم مدتی مستقل بودند. حدود هشت یا نه سال پیش، متوجه تغییراتی در رفتار مادرم شدم. یک بار دنبال ماشینش بودم که خروجی را از دست"}, {"source": "Business Insider", "title": "I quit being a trial lawyer to become a comedian. I loved my job but knew I was ready for something different.", "link": "https://www.businessinsider.com/trial-lawyer-quit-stand-up-comedian-career-pivot-burn-out-2026-9", "summary": "Paul Farahvar worked as a trial lawyer before becoming a full-time stand-up comedian. Sarah E. Larson Paul Farahvar went from law to stand-up comedy after some encouragement from comedian Bob Saget. Farahvar did comedy on the side of trial law for years before becoming a full-time comedian. Despite loving his work as a lawyer, Farahvar said he was ready for a new challenge. This is an as-told-essay based on a conversation with Paul Farahvar, a touring stand-up comedian based in Chicago who previously worked as a trial lawyer. This story has been edited for length and clarity. Right out of law school , I started practicing at an insurance defense law firm. I had won a case in the Illinois Supreme Court when I was only 25, which then led to places trying to recruit me. I went to a firm that allowed me to work part-time, because I was also playing in and managing bands and doing entertainment law on the side. Eventually, one of my partners and I split off and started our own law firm. Comedy came into the picture by accident. It was never on my radar when I was younger. My friend was a stand-up comedian , and he asked me to go with him when he was opening for Bob Saget. I was backstage and made a joke that got Bob Saget laughing. He said I should use the joke onstage, but I told him I wasn't performing and that I'd never done stand-up in my life. His encouragement gave me the confidence to go to an open mic the next day. I won the contest, and that changed my life. I ended up hosting that open mic and then became a host at The Laugh Factory in Chicago. Now I've been a full-time comedian for over six years. A common misconception is that I was burned out as a lawyer . I wasn't. I loved being a lawyer and practicing law, and I was lucky enough to take cases to trial often since our firm was a specialty trial firm. I miss it sometimes, but I felt like I did everything I could do with law. I tried over 20 cases, and wanted the challenge of something new. I like to push myself to do things that are hard or uncomfortable. Comedy is a hustle, but you can make money doing it As a lawyer, I handled insurance defense and defense work for cities, including election and police cases. I was usually the bad guy. I kept the comedy under wraps at first. At some point, people started to notice, and surprisingly, everyone was pretty supportive. If I were discussing a trial date with the other side and needed to schedule it around a comedy show , most lawyers were cool with it.", "date_str": "2026-09-19T08:11:01+00:00", "hash": "5c60433f0d45df74", "title_fa": "من وکیل دادگاه را کنار گذاشتم تا کمدین شوم. من عاشق کارم بودم اما می دانستم که برای چیزی متفاوت آماده هستم.", "summary_fa": "پل فرهور قبل از تبدیل شدن به یک استندآپ کمدین تمام وقت به عنوان وکیل دادگستری کار می کرد. سارا ای. لارسون پل فرهور پس از تشویق کمدین باب ساجت از وکالت به استندآپ کمدی رفت. فرهور سال‌ها پیش از تبدیل شدن به یک کمدین تمام وقت، در کنار قانون محاکمه کمدی انجام داد. فرهور علیرغم عشق به کارش به عنوان وکیل گفت که آماده چالش جدیدی است. این مقاله‌ای است که گفته می‌شود بر اساس گفتگو با پل فرحوار، یک کمدین استندآپ تور ساکن شیکاگو که قبلاً به عنوان وکیل دادگاه کار می‌کرد. این داستان برای طولانی بودن و وضوح ویرایش شده است. درست در پایان دانشکده حقوق، شروع به تمرین در یک شرکت حقوقی دفاع از بیمه کردم. زمانی که تنها 25 سال داشتم، در دادگاه عالی ایلینویز برنده شده بودم، که پس از آن به مکان هایی منجر شد که من را جذب کنند. من به شرکتی رفتم که به من اجازه داد پاره وقت کار کنم، زیرا در کنار هم در گروه‌های موسیقی بازی می‌کردم و مدیریت می‌کردم و قانون سرگرمی را انجام می‌دادم. در نهایت، من و یکی از شرکای خود از هم جدا شدیم و دفتر حقوقی خود را راه اندازی کردیم. کمدی به طور تصادفی وارد فیلم شد. وقتی جوانتر بودم هرگز در رادار من نبود. دوست من یک استندآپ کمدین بود و زمانی که برای باب ساجت باز می شد از من خواست که با او بروم. من پشت صحنه بودم و شوخی کردم که باب ساجت خندید. او گفت باید از شوخی روی صحنه استفاده کنم، اما من به او گفتم که اجرا نمی‌کنم و هرگز در زندگی‌ام استند آپ نکرده‌ام. تشویق او به من اعتماد به نفس داد تا روز بعد به سراغ میکروفون باز بروم. من در مسابقه برنده شدم و این زندگی من را تغییر داد. من در"}, {"source": "Business Insider", "title": "The 32 best early fall bedding and sleep deals to shop now, from Brooklinen to that viral Mellow pillow", "link": "https://www.businessinsider.com/guides/deals/best-fall-bedding-and-sleep-deals-2026-9", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more The best fall bedding and sleep deals this week. Parachute, Mellow Sleep, Philips/Business Insider Top bedding sales: Save on editor-vetted sheets, duvets, and pillows from Brooklinen and Ruggable. Standout discounts: Get 35% off our top duvet insert and 30% off our favorite sunrise alarm clock. Viral pillow test: We reviewed the viral Mellow Sleep pillow to see if the 50% sale is legit. The seasonal swap from lightweight summer quilts to cozy autumn bedding always triggers a barrage of aggressive sales pitches. Let's be honest about direct-to-consumer sleep brands: most of those limited-time markdowns crowding your feed a r outdoor enthusiasts in our best Apple Watches guide. How to order the Apple Watch Ultra 4 Amazon The Apple Watch Ultra 4 was initially only available for preorder through Apple. The device later became available to preorder on Amazon , and eventually landed at other retailers (including cellular providers such as T-Mobile and Verizon ). Now that the watch has officially launched, it should also be available in stores while supplies last. You should check to see if the device is in stock online before heading to a store. The 49mm watch starts at $799 and comes in natural and black titanium finishes. Some Amazon models start at $780. What's the trade-in value for my current device? If you're hoping to save some money, you can always try trading in an old device. Apple allows trade-ins on eligible items, including previous-generation Apple Watches, iPads, Macs, iPhones, and select Android devices. There's a full list of eligible devices and models on Apple's website , but you can explore the estimated maximum trade-in values for select products below: Trade-in value Apple Watch Ultra 3: Up to $430 Apple Watch Series 11: Up to $200 Apple Watch Series 10: Up to $150 Apple Watch Series 9: Up to $115 Apple Watch SE (3rd Generation): Up to $115 iPhone 17 Pro Max: Up to $885 iPh", "date_str": "2026-09-18T22:51:02+00:00", "hash": "9d10af722f2e6040", "title_fa": "Apple Watch Ultra 4: قیمت، مشخصات، و نحوه خرید", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Apple Watch Ultra 4 رسماً در 18 سپتامبر 2026 عرضه می شود. Apple Apple به تازگی جدیدترین مجموعه خود را راه اندازی کرده است و Apple Watch Ultra 4 از جمله دستگاه های جدیدی است که در تاریخ 18 سپتامبر 2026 به فروشگاه ها عرضه می شود. اگر امیدوارید در مورد دستگاه بیشتر بدانید (از جمله جایی که می توانید آن را سفارش دهید)، به جای درستی آمده اید. مشاهده همه رنگ‌ها در آمازون بخش عمده ارتقاءهای Ultra 4 داخلی هستند و کمک می‌کنند ساعت به استانداردهای موجود در س . خریدارانی که به"}, {"source": "Business Insider", "title": "The best walking shoes for women with all-day comfort", "link": "https://www.businessinsider.com/guides/style/best-walking-shoes-for-women", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Rachael Schultz, Gabrielle Chase/Business Insider Comfortable walking shoes can make a major difference in your health. I've easily racked up 20,000 steps in a single day without any protest from my feet, and it's all because I had the right sneakers on. I spoke to podiatrist Elizabeth Daughtry, DPM, FACFAS , who told me that women are more prone to developing stress fractures. It's important to prioritize support especially if you walk a lot, as you could be saving yourself from future muscle strains. My top pick: Asics GEL-Nimbus 28s . They're one of the few shoes that don't leave my arches aching after a long day of walking. An excellent under-$100 pick: Rykä's Devotion X . These are reliably comfy and lightweight. Style editor Gabrielle Chase wore hers on a trip to Europe, where they held up over four 7-mile days in a row. For this guide, I tested over 30 pairs of sneakers on walks totaling over 50 miles. These long-distance trials let me gauge which felt the most supportive and durable, whether I was hiking trails with my dog, speed-walking through errands, or traveling to explore a new city. The most comfortable walking shoes for women in 2026 Best overall: Asics GEL-Nimbus 28 Rachael Schultz/Business Insider While the GEL-Nimbus 27s were my go-to walking shoe for nearly two years, the new GEL-Nimbus 28s are the most comfortable version yet. Weighing in at 9.8 ounces, this model is slightly lighter than its predecessor. Even after spending 6 hours walking on concrete floors, my arches, calves, and knees still felt supported and fresh (well, as fresh as can be expected) by the end of the day. I'm conscious of highly cushioned shoes that end up feeling packed down or \"muddy\" after long walks. And while these are slightly less stiff than my previous pair, their 2mm of FF Blast Plus foam in the midsole area gives them a supportive, structured feel. In addition, there's a gel heel counter to help limit movement in the foot's tendons (which is why they're some of the best shoes for plantar fasciitis ). The new knit uppers are also better at holding their shape snugly and firmly, while still allowing my toes to splay naturally. If you don't like a high-cushion, adaptive technology shoe because you have ankle issues or super flat feet, you may be happier in the Adidas Ultraboost Lights . But ultimately, the GEL-Nimbus 28s are the best walking shoes for most people, ", "date_str": "2026-09-18T21:38:31+00:00", "hash": "6d1009d35c55827c", "title_fa": "بهترین کفش پیاده روی برای زنان با راحتی تمام روز", "summary_fa": "وقتی از طریق پیوندهای ما خرید می کنید، Business Insider ممکن است کمیسیون وابسته را دریافت کند. بیشتر بدانید Rachael Schultz, Gabrielle Chase/Business Insider کفش های پیاده روی راحت می توانند تفاوت عمده ای در سلامت شما ایجاد کنند. من به راحتی 20000 پله را در یک روز بدون هیچ اعتراضی از پاهایم بالا آورده ام و همه اینها به این دلیل است که کفش ورزشی مناسبی به تن داشتم. من با متخصص پا، الیزابت داتری، DPM، FACFAS صحبت کردم، او به من گفت که زنان بیشتر مستعد ابتلا به شکستگی های استرسی هستند. مهم است که حمایت را در اولویت قرار دهید، به خصوص اگر زیاد پیاده روی می کنید، زیرا می توانید خود را از فشارهای عضلانی آینده نجات دهید. انتخاب برتر من: Asics GEL-Nimbus 28s. آنها یکی از معدود کفش هایی هستند که پس از یک روز طولانی پیاده روی، قوس های من را دچار درد نمی کند. یک انتخاب عالی زیر 100 دلار: Rykä's Devotion X. اینها به طور قابل اعتماد راحت و سبک وزن هستند. گابریل چیس، سردبیر استایل، لباس او را در سفری به اروپا پوشید، جایی که آنها بیش از چهار روز متوالی 7 مایلی را پشت سر گذاشتند. برای این راهنما، من بیش از 30 جفت کفش ورزشی را در مسیرهای پیاده روی بیش از 50 مایل آزمایش کردم. این آزمایش‌های طولانی‌مدت به من اجازه می‌دهد تشخیص دهم که  pushed new AI tool", "link": "https://www.businessinsider.com/faa-ai-air-traffic-control-contract-airlines-2026-9", "summary": "J. David Ake/Getty Images POLITICO reports airlines are cautious but optimistic about an AI tool for airspace management. The tool aims to reduce flight delays by predicting and managing airspace congestion. Confusion over the FAA's vague description of its much-hyped plans eased in the past week. Airline industry officials have finally stopped panicking about the Federal Aviation Administration 's soon-to-launch artificial intelligence tool for managing flights and easing congestion in air travel, multiple people familiar with the situation told POLITICO. Weeks of industry confusion over the FAA's vague description of its much-hyped plans eased in the past week when agency officials told them they would use the tool in just a limited way at first, said the people, who were granted anonymity to discuss internal conversations. The tool, dubbed Strategic Management of Airspace Routing Trajectories, or SMART, is set to debut in coming days, offering advice to air traffic controllers managing flights for the three airports that serve the nation's capital, according to two industry officials. The hope, according to FAA Administrator Bryan Bedford , is that after a 90-day testing period the tool will be rolled out on a wider scale. Before the FAA eased the airlines officials' concerns, one of their biggest worries was how extensively the AI would be integrated into day-to-day air traffic management, one of the industry people said. \"I think that's what people were freaking out about,\" the person said. Instead, according to another industry official, the SMART tool is not expected to create any new procedures for air traffic controllers or for the airlines. It will simply generate alternative route information that is passed through the FAA's existing systems and procedures. Transportation Secretary Sean Duffy has touted the tool , aimed at easing congestion in the skies. But three airline officials said the industry was bewildered for weeks about how the system would work, and that a sustained series of meetings with the FAA had left them with more questions than answers. \"We've been requesting and … talking to [FAA] and saying, 'Let's narrow the scope of this. Start, crawl, walk, run.' And I think ultimately that's what they decided to do,\" said one airline industry official, who like the others, was granted anonymity to discuss internal conversations with the agency. In a statement, FAA spokesperson Hannah Walden said the agency is \"moving at record speed to m", "date_str": "2026-09-18T20:41:24+00:00", "hash": "1d94e66c497f5a32", "title_fa": "وقتی FAA ابزار جدید هوش مصنوعی را به کار گرفت، وحشت در خطوط هوایی در داخل هواپیماها ایجاد شد", "summary_fa": "J. David Ake/Getty Images POLITICO گزارش می دهد که خطوط هوایی در مورد ابزار هوش مصنوعی برای مدیریت فضای هوایی محتاط اما خوش بین هستند. هدف این ابزار کاهش تاخیر پرواز با پیش‌بینی و مدیریت ازدحام فضای هوایی است. سردرگمی در مورد توصیف مبهم FAA در مورد برنامه های بسیار تبلیغاتی آن در هفته گذشته کاهش یافت. بسیاری از افراد آشنا به این وضعیت به POLITICO گفتند که مقامات صنعت هواپیمایی سرانجام از ترس ابزار هوش مصنوعی اداره هوانوردی فدرال که به زودی راه اندازی می شود برای مدیریت پروازها و کاهش ازدحام در سفرهای هوایی متوقف شده اند. این افراد که برای بحث در مورد مکالمات داخلی ناشناس ماندند، گفتند که هفته‌ها سردرگمی صنعت در مورد توصیف مبهم FAA از برنامه‌های پرهیاهوی آن در هفته گذشته زمانی که مقامات آژانس به آنها گفتند که در ابتدا از این ابزار فقط به صورت محدود استفاده خواهند کرد، کاهش یافت. به گفته دو مقام صنعتی، این ابزار که مدیریت استراتژیک مسیرهای مسیریابی فضای هوایی یا SMART نام دارد، قرار است در روزهای آینده معرفی شود و به کنترل‌کنندگان ترافیک هوایی که پروازهای سه فرودگاهی را که به پایتخت کشور خدمات می‌دهند، توصیه‌هایی ارائه می‌دهد. به گفته مدیر FAA برایان بدفورد، امید این است که پس از یک دوره آزمایشی 90 روزه، این ابزار در مقیاس گسترده‌تری عرضه شود. یکی از افراد این صنعت گفت، قبل از اینکه FAA نگرانی مقامات خطوط هوایی را کاهش دهد، یکی از بزرگترین نگرانی های آنها این بود که چگونه هوش مصنوعی در مدیریت روزانه ترافیک هوایی ادغام می شود. آن شخص گفت: «فکر می‌کنم این چیزی است که مردم از آن عصبانی بودند. در عوض، به گفته یکی دیگر از مقامات صنعت، انتظار نمی رود که ابزار SMART رویه جدیدی را برای کنترلرهای ترافیک هوایی یا خطوط هوایی ایجاد کند."}, {"source": "Business Insider", "title": "Trump says he's banning MS NOW, CNN, and Politico from the White House", "link": "https://www.businessinsider.com/trump-bans-msnow-cnn-politico-white-house-press-2026-9", "summary": "President Donald Trump said on Friday that he was banning MS NOW, CNN, and Politico from the White House. Brendan Smialowski / AFP via Getty Images President Donald Trump said he was banning MS NOW, CNN, and Politico from the White House. He said the ban was \"effective immediately,\" but did not provide further details. This \"ban\" follows earlier restrictions on reporters covering the Pentagon. President Donald Trump said on Friday that he was banning MS NOW, CNN, and Politico from the White House for their reporting on him, a sharp escalation in his antagonism toward the press. \"Media Outlets shouldn't be able to constantly write or report FICTION and LIES when they're covering the President of the United States,\" Trump said on Truth Social, his social media platform. Trump said the ban was \"effective immediately,\" but did not provide any further details. \"Other Fake News Media Outlets to follow,\" Trump said. CNN said in an article published Friday that their reporters \"remained seated in their White House workspace near the briefing room as of this writing.\" \"CNN stands fully behind our White House team and their fair and accurate reporting. We have a right under the U.S. Constitution to do that reporting without hindrance or interference from the government,\" a CNN spokesperson said in a statement. The spokesperson said the ban, if enforced, \"would be an illegal assault on that fundamental and constitutionally-protected right.\" Speaking in the Oval Office on Friday, Trump said he decided to ban the outlets because of \"cumulative stories.\" \"They purposely write negative news,\" Trump said of the outlets. \"They do that because they want to try and diminish the Republicans.\" Trump called it \"a simple ban.\" \"I don't want them in my office,\" he said. Friday's ban follows earlier restrictions imposed by the Trump administration on reporters. Last year, the White House barred journalists from the Associated Press from the Oval Office, Air Force One, and press pool events after the outlet didn't change the Gulf of Mexico to the Gulf of America. In another shake-up last year, several legacy outlets lost their workspaces in the Pentagon. These legacy outlets, including NBC News and The New York Times, were replaced by other independent journalists and influencers generally considered more aligned with the president. In a memo at the time, the Defense Department framed the change as a \"media rotation program.\" MS NOW and Politico did not immediately respond to reque", "date_str": "2026-09-18T20:33:06+00:00", "hash": "b768c6e1d984c68e", "title_fa": "ترامپ می گوید MS NOW، CNN و Politico را از کاخ سفید ممنوع می کند", "summary_fa": "دونالد ترامپ، رئیس جمهور آمریکا روز جمعه گفت که MS NOW، CNN و Politico را از ورود به کاخ سفید منع می کند. برندان اسمیالوفسکی / خبرگزاری فرانسه از طریق گتی ایماژ، رئیس جمهور دونالد ترامپ گفت که MS NOW، CNN و Politico را از کاخ سفید منع می کند. او گفت که این ممنوعیت «فوراً اجرایی شد»، اما جزئیات بیشتری ارائه نکرد. این \"ممنوعیت\" به دنبال محدودیت های قبلی برای خبرنگارانی است که پنتاگون را پوشش می دهند. دونالد ترامپ، رئیس جمهور آمریکا روز جمعه گفت که MS NOW، CNN و Politico را به دلیل گزارش هایی که درباره او منتشر کرده اند، از کاخ سفید منع می کند، که تشدید شدیدی در تضاد او با مطبوعات است. ترامپ در شبکه اجتماعی Truth Social، پلتفرم رسانه اجتماعی او، گفت: «رسانه‌ها نباید بتوانند مدام داستان‌های تخیلی و دروغ‌ها را زمانی که رئیس‌جمهور ایالات متحده را پوشش می‌دهند، بنویسند یا گزارش دهند». ترامپ گفت این ممنوعیت «فوراً اجرایی شد» اما جزئیات بیشتری ارائه نکرد. ترامپ گفت: «دیگر رسانه های خبری جعلی باید دنبال شوند. سی‌ان‌ان در مقاله‌ای که روز جمعه منتشر شد، گفت که خبرنگاران آن‌ها \"تا لحظه نگارش این مقاله در محل کار خود در کاخ سفید در نزدیکی اتاق توجیهی نشسته‌اند.\" سخنگوی سی‌ان‌ان در بیانیه‌ای گفت: «سی‌ان‌ان کاملاً پشتیبان تیم کاخ سفید ما و گزارش‌های منصفانه و دقیق آن‌ها است. طبق قانون اساسی ایالات متحده حق داریم که این گزارش‌ها را بدون مانع یا دخالت دولت انجام دهیم». این سخنگو گفت که این ممنوعیت، در صورت اجرا، \"تجاوز غیرقانونی به این حق اساسی و مورد حمایت قانون اساسی خواهد بود.\" ترامپ روز جمعه در سخنانی در دفتر بیضی شکل گفت که به دلیل \"داستان های انباشته\" تصمیم به ممنوعیت این رسانه ها گرفته است. ترامپ در مورد این رسانه ها گفت: آنها عمدا اخبار منفی می نویسند. آنها این"}, {"source": "Business Insider", "title": "GM is making parts for Patriot missiles now", "link": "https://www.businessinsider.com/gm-patriot-missile-lockheed-martin-2026-9", "summary": "America s biggest carmaker is building for the US military. credit should read BULENT KILIC/AFP via Getty Images GM is now making housing components for Patriot missile interceptors. It delivered the first batch just 22 days after signing a contract with Lockheed Martin. GM expects its defense subsidiary to generate nearly $700 million this year. General Motors is adding missile parts to its manufacturing résumé. On Thursday, major defense contractor Lockheed Martin announced that GM Defense — the automaker's military subsidiary — had delivered housing components for the PAC-3 Missile Segment Enhancement interceptor, a missile used by the Patriot air-defense system. The companies entered into a formal contract on August 6, and the first batch of components was delivered to Lockheed 22 days later, the companies said. Tim Cahill, Lockheed Martin's president of missiles and fire control, called it an \"extraordinary لاکهید مارتین تحویل داد. جنرال موتورز انتظار دارد که شرکت تابعه دفاعی خود در سال جاری نزدیک به 700 میلیون دلار درآمد داشته باشد. جنرال موتورز قطعات موشکی را به رزومه تولید خود اضافه می کند. روز پنجشنبه، پیمانکار اصلی دفاعی لاکهید مارتین اعلام کرد که جی ام دیفنس - زیرمجموعه نظامی این خودروساز - قطعات محفظه رهگیر ارتقاء بخش موشکی PAC-3 را تحویل داده است، موشکی که توسط سیستم دفاع هوایی پاتریوت استفاده می شود. این شرکت ها گفتند که این شرکت ها قراردادی رسمی در 6 آگوست منعقد کردند و اولین دسته از قطعات 22 روز بعد به لاکهید تحویل داده شد. تیم کیهیل، رئیس بخش کنترل موشک و آتش لاکهید مارتین، آن را \"یک چرخش فوق العاده 22 روزه\" خواند. تقاضا برای رهگیرهای پاتریوت، به ویژه MSE پیشرفته PAC-3 که برای تهدیدات پیچیده ساخته شده است، با افزایش فشار جنگ در اوکراین و علیه ایران بر انبارهای ایالات متحده و متحدانش افزایش یافته است. در ماه‌های اخیر، گزارش‌های رسانه‌ها و ارزیابی‌های اندیشکده نگرانی‌هایی را در مورد ذخایر مهمات ایالات متحده، از جمله موشک‌های کروز حمله زمینی تاماهاوک و رهگیرهای پاتریوت، افزایش داده‌اند. پنتاگون و کاخ سفید نگرانی ها در مورد وضعیت ذخایر آمریکا را رد کرده اند. گزارش تازه منتشر شده بازرس کل وزارت دفاع گفت که \"هزینه مهمات در [عملیات حماسه خشم] منجر به کمبود موجودی استراتژیک شده و گلوگاه های پایگاه صنعتی برای تامین مجدد مهمات را آشکار کرده است.\" مشخص نکرد که کدام نوع مهمات. صنعت دفاعی ایالات متحده نیز با مشارکت پنتاگون در حال توسعه تولید مهمات است."}, {"source": "Business Insider", "title": "8 best iPhone 18 Pro Max screen protectors for lasting defense", "link": "https://www.businessinsider.com/guides/tech/best-iphone-18-pro-max-screen-protectors", "summary": "When you buy through our links, Business Insider may earn an affiliate commission. Learn more Amazon; Zagg/Business Insider The iPhone screen protector has existed for just about as long as the iPhone itself, and for good reason. With so few buttons, the display is one of the device's only points of interaction. A broken screen means bad visuals, or worse, a useless phone altogether. Now, generations late ت که به ترتیب از 399 و 449 دلار قیمت دارند. پس از اعلام آن‌ها، پیش‌سفارش‌ها به مدت یک هفته قبل از عرضه رسمی ساعت‌های هوشمند باز بود. اکنون می توانید دستگاه"}, {"source": "Business Insider", "title": "I grew up in the US, and my husband grew up in the UK. Here are 15 differences that surprise us most.", "link": "https://www.businessinsider.com/biggest-differences-between-us-and-uk-life", "summary": "I was raised in the United States, but my husband grew up in the United Kingdom. We ve noticed many differences across our cultures, including our idea of what pancakes usually are. iStock, Lia Ryerson I grew up in the US, and my husband grew up in the UK — we've noticed many differences. In the UK, eggs are not refrigerated, and ordering a coffee won't get you what you'd get in the US. Things normal to me in the US aren't in the UK, like celebrating Halloween or tipping bartenders. I was born and raised on the East Coast of the United States. After moving to Scotland in the fall of 2017, I met my husband and settled into life in the United Kingdom as an expat for several years. Growing up in separate cultures means we've had to navigate a slew of differences in our everyday habits, expectations, and worldviews. Here are a few of the most surprising differences between life in the US and the UK , as experienced by my partner and me: My partner thinks it s strange that servers take your credit card away in some US restaurants. ESB Professional/Shutterstock The first time my husband and I ate together at an American restaurant , he was alarmed when the server took his credit card away to swipe it after the meal. He was also totally perplexed by the need to sign a receipt, which apparently isn't the norm in the UK. In UK restaurants, the server typically brings the entire card machine to your table. While they supervise, you insert your card and follow any on-screen prompts before grabbing your receipt and leaving. Though my husband thinks that taking a customer's card away e corporate bonuses are forfeited, and participation in employee stock programs ends. Oracle executives didn't directly address the layoffs in an employee town hall this week, but Chief Financial Officer Hilary Maxson told staff the company needs to be \"thoughtful\" about where it spends tims and money. \"I don't mean doing more with less, which is a phrase that I really, really don't like,\" Maxson said. \"It means simplifying processes that don't help customers and making clear choices on where we're going to use our resources where they have the greatest impact.\" This latest round of layoffs follows cuts earlier this year . The company's workforce declined by 21,000, or 13%, in the 2026 fiscal year that ended May 31, according to a recent filing . Oracle's severance package is comparatively less generous than those offered by other Big Tech companies over the past year. Salesforce's standard po", "date_str": "2026-09-18T17:43:12+00:00", "hash": "68a2a90d3540376b", "title_fa": "سند اوراکل آنچه را که کارگران اخراجی از کار برکنار شده، سهام و پاداش دریافت می‌کنند، بیان می‌کند", "summary_fa": "تصویرسازی توسط Sheldon Cooper/SOPA Images/LightRocket از طریق Getty Images Oracle دور جدیدی از کاهش مشاغل را این هفته آغاز کرد. یک سند داخلی جزئیات بیشتری را بیان می‌کند که این کارمندان در صورت انفصال، سهام و پاداش دریافت می‌کنند. این کاهش زمانی اتفاق می‌افتد که اوراکل به ساخت زیرساخت‌های هوش مصنوعی تهاجمی ادامه می‌دهد. کارمندان اوراکل که در آخرین دور اخراج‌های این شرکت گرفتار شده‌اند، اکنون دقیقاً می‌دانند چه چیزی را پشت سر خواهند گذاشت و چه چیزی را با خود خواهند برد. یک سند پرسش‌های متداول داخلی که توسط Business Insider مشاهده شده است، جزئیات بیشتری را برای کارکنان تحت تأثیر قرار می‌دهد، از جمله پایان خدمت به مدت 26 هفته، جوایز سهام لغو شده، پاداش‌های از دست رفته، و مهلت‌های اعمال اختیارات واگذار شده. اوراکل از روز دوشنبه شروع به اطلاع رسانی به کارکنان آسیب دیده کرد. Business Insider ماه گذشته گزارش داد که این شرکت برنامه هایی را برای اخراج چند رقمی برخی از تیم ها برای کاهش حقوق و دستمزد طراحی کرده است زیرا میلیاردها بدهی برای تامین مالی زیرساخت های هوش مصنوعی جمع آوری می کند. بر اساس اسناد مشاهده شده توسط Business Insider، به کارمندان چهار هفته حقوق پایه به اضافه یک هفته در هر سال کار پیشنهاد شد. سند کامل پرسش‌های متداول شامل حداکثر بازپرداخت و آنچه برای پاداش‌های کارکنان، کمیسیون‌ها و گزینه‌های سهام اتفاق می‌افتد را شامل می‌شود. جزئیات دریچه ای به تاثیر کارکنان از آخرین فشار کاهش هزینه اوراکل ارائه می دهد. این شرکت ده‌ها هزار کارگر را اخراج کرده است، در حالی که وام‌های سنگین گرفته و ده‌ها میلیارد دلار برای ساخت مراکز داده و سایر زیرساخت‌های مورد نیاز برای حمایت از جاه‌طلبی‌های هوش مصنوعی خود هزینه کرده است. برای کارمندانی که در آخرین کاهش‌ها ترک می‌کنند، تأثیر مالی فراتر از از دست دادن یک چک است: سهام سرمایه‌گذاری نشده"}, {"source": "Business Insider", "title": "Prince Harry and Meghan Markle are back in the UK, but they're still not working royals. Here are the 11 family members on duty.", "link": "https://www.businessinsider.com/british-working-royals-list-king-charles-2026-9", "summary": "There are 11 working members of the royal family. WPA Pool/Getty Images Prince Harry and Meghan Markle aren't working royals despite living in the UK again. There are 11 working family members in the British royal family. A majority of those members are older than 75, including King Charles and Queen Camilla. Though the royal family itself is growing, the number of people who work for the British monarchy might be smaller than you think. Working royals represent the monarchy at royal engagements, from charitable events to state ceremonies. Kids like Prince George or extended members of the royal family like Princess Beatrice don't attend events in an official capacity. There are currently only 11 working royals, and many of them are over 75. King Charles is on the younger end at 77, 50 years older than Queen Elizabeth was when she inherited the crown. Here's a full list of who currently represents the British monarchy, plus a rundown of why a few former working royals no longer do. King Charles III King Charles has an enlarged prostate and will be hospitalized for treatment. WPA Pool / Getty Images King Charles, 77, formally known as the Prince of Wales, is the eldest son of Prince Philip and Queen Elizabeth II. At 32, Charles married Lady Diana Spencer. The former couple welcomed two sons: Prince William and Prince Harry. Charles and Diana separated in 1992 before her death five years later in Paris. He married Queen Camilla, formerly the Duchess of Cornwall, in a civil ceremony in April 2005. He became King Charles in September 2022 following the death of his mother, making him the oldest person to take the throne in British history. Throughout his life, Charles has remained one of the most prominent British royals and has continued to perform public engagements. He stepped back from \"front-facing duties\" while he was being treated for cancer in early 2024, but he was still involved in \"state business and official paperwork.\" He returned to a more normal working schedule in April 2024 and has been working fairly steadily since. Queen Camilla Queen Camilla. Pool/Getty Images Camilla, the daughter of wealthy aristocrats , became a member of the British royal family after marrying King Charles in April 2005. Although her relationship with Charles made her Princess of Wales, she opted to use the title Duchess of Cornwall because it wasn't closely associated with Princess Diana. Camilla, 79, and Charles never had children , but she shares two with her former ", "date_str": "2026-09-18T17:41:22+00:00", "hash": "b9a3d1a6339676e6", "title_fa": "شاهزاده هری و مگان مارکل به بریتانیا بازگشته‌اند، اما هنوز در خانواده سلطنتی کار نمی‌کنند. در اینجا 11 عضو خانواده در حال انجام وظیفه هستند.", "summary_fa": "11 عضو شاغل در خانواده سلطنتی وجود دارد. WPA Pool/Getty Images شاهزاده هری و مگان مارکل علیرغم زندگی مجدد در بریتانیا، خانواده سلطنتی کار نمی کنند. در خانواده سلطنتی بریتانیا 11 عضو خانواده کارگر وجود دارد. اکثریت این اعضا بالای 75 سال سن دارند، از جمله شاه چارلز و ملکه کامیلا. اگرچه خود خانواده سلطنتی در حال افزایش است، اما تعداد افرادی که برای سلطنت بریتانیا کار می کنند ممکن است کمتر از آن چیزی باشد که فکر می کنید. خانواده‌های سلطنتی شاغل در مراسم‌های سلطنتی، از مراسم خیریه گرفته تا مراسم دولتی، سلطنت را نمایندگی می‌کنند. کودکانی مانند شاهزاده جورج یا اعضای بزرگ خانواده سلطنتی مانند پرنسس بئاتریس به صورت رسمی در مراسم شرکت نمی کنند. در حال حاضر تنها 11 خانواده سلطنتی مشغول به کار هستند و بسیاری از آنها بالای 75 سال سن دارند. پادشاه چارلز با 77 سال سن، 50 سال از ملکه الیزابت بزرگتر است که تاج را به ارث برد. در اینجا فهرست کاملی از کسانی که در حال حاضر سلطنت بریتانیا را نمایندگی می کنند، به علاوه خلاصه ای از این است که چرا برخی از اعضای خانواده سلطنتی سابق دیگر این کار را نمی کنند. شاه چارلز سوم شاه چارلز پروستات بزرگی دارد و برای درمان در بیمارستان بستری خواهد شد. WPA Pool / Getty Images کینگ چارلز، 77 ساله، که به طور رسمی به عنوان شاهزاده ولز شناخته می شود، پسر ارشد شاهزاده فیلیپ و ملکه الیزابت دوم است. چارلز در 32 سالگی با لیدی دایانا اسپنسر ازدواج کرد. زوج سابق صاحب دو پسر شدند: شاهزاده ویلیام و پرنس هری. چارلز و دایانا در سال 1992 قبل از مرگ او پنج سال بعد در پاریس از هم جدا شدند. او در آوریل 2005 طی یک مراسم مدنی با ملکه کامیلا، سابقا دوشس کورنوال، ازدواج کرد. او در سپتامبر 2022 به دنبال"}, {"source": "Business Insider", "title": "Meta's CTO doesn't want a few 'bad actors' to spoil your view of Meta glasses", "link": "https://www.businessinsider.com/meta-cto-andrew-bosworth-glasses-bad-actors-moderation-policy-2026-9", "summary": "Meta CTO Andrew Bosworth demonstrating Meta glasses. Bloomberg/Getty Images Meta CTO Andrew \"Boz\" Bosworth doesn't want \"a small number of bad actors\" to drive the AI glasses narrative. He answered questions about privacy during an Instagram AMA. The Meta CTO also touted new privacy measures like anti-tampering with the LED light. Andrew Bosworth, Meta's chief technology officer, said the conversation around Meta glasses shouldn't be dominated by a small number of \"bad actors.\" During an AMA on his personal Instagram, Bosworth answered a question about privacy and Meta glasses. Andrew Bosworth answered a question about Meta glasses privacy on his Instagram. Instagram \"I don't want the discourse to be entirely shaped by this kind of relatively small number of bad actors,\" he said. \"The majority of people using their glasses are using them in totally normal ways, the way they would use a cell phone camera, but it's a little more convenient, a little bit more hands-free, a little more in the moment.\" Bosworth also reiterated that the glasses have privacy measures like an indicator light that turns on when you're recording, and that Meta has anti-tampering features to stop recording if the light is covered. A recent software update to the glasses closed a loophole people had discovered where, if you started recording, waited a few seconds, and then covered over the light, you could still record. It also meant that people who had drilled out or permanently disabled the light essentially had bricked their devices . Bosworth also talked about the company's recent crackdown on harassing content (like pickup artists) filmed with its glasses. \"If we find that content, we'll take that content down if it's harassing content. And if we think that this is a person who is doing this systematically, we'll take the account down,\" the exec said. This summer, Business Insider looked at how this new moderation policy on Instagram was playing out, and found that while some content and accounts had been removed, the moderation has been uneven . And while pickup artist videos were mainly targeted by Meta, prank videos where people torment big box store workers are creating a \" workplace menace, \" The Verge recently reported. There's been a recent wave of backlash to the Meta glasses, which have garnered the nickname \"pervert glasses\" on social media. While the glasses remain popular, there are examples of the backlash sparking action over the concerns. Norway's government is for", "date_str": "2026-09-18T17:36:52+00:00", "hash": "4122e4e413408879", "title_fa": "مدیر ارشد فناوری متا نمی‌خواهد چند بازیگر بد دیدگاه شما را نسبت به عینک متا خراب کنند.", "summary_fa": "اندرو باسورث، مدیر ارشد فناوری متا در حال نمایش عینک متا. بلومبرگ/گتی ایمیجز متا، اندرو \"بوز\" بوسورث، نمی خواهد \"تعداد کمی از بازیگران بد\" روایت عینک های هوش مصنوعی را پیش ببرند. او در طی یک AMA اینستاگرام به سوالاتی در مورد حریم خصوصی پاسخ داد. متا CTO همچنین اقدامات جدیدی را برای حفظ حریم خصوصی مانند ضد دستکاری نور LED ارائه کرد. اندرو باسورث، مدیر ارشد فناوری متا، گفت که مکالمه پیرامون عینک متا نباید تحت سلطه تعداد کمی از \"بازیگران بد\" باشد. بوسورث در طی یک AMA در اینستاگرام شخصی خود به سوالی در مورد حریم خصوصی و عینک متا پاسخ داد. اندرو باسورث در اینستاگرام خود به سوالی درباره حریم خصوصی عینک متا پاسخ داد. اینستاگرام می‌گوید: «من نمی‌خواهم گفتمان کاملاً توسط این نوع نسبتاً کم بازیگران بد شکل بگیرد. اکثر افرادی که از عینک خود استفاده می کنند به روشی کاملاً عادی از عینک استفاده می کنند، همانطور که از دوربین تلفن همراه استفاده می کنند، اما در لحظه کمی راحت تر، اندکی هندزفری تر، کمی بیشتر است.» Bosworth همچنین تکرار کرد که این عینک دارای معیارهای حفظ حریم خصوصی مانند یک چراغ نشانگر است که هنگام ضبط روشن می شود و متا دارای ویژگی های ضد دستکاری است تا در صورت پوشاندن نور، ضبط را متوقف کند. به‌روزرسانی نرم‌افزاری اخیر برای عینک، حفره‌ای را که مردم کشف کرده بودند، باز کرد، اگر شروع به ضبط کنید، چند ثانیه صبر کنید و سپس نور را بپوشانید، همچنان می‌توانید ضبط کنید. همچنین به این معنی بود که افرادی که نور را سوراخ کرده یا به طور دائم غیرفعال کرده بودند، اساساً دستگاه های خود را آجر کرده بودند. Bosworth همچنین در مورد سرکوب اخیر این شرکت در مورد محتوای آزاردهنده (مانند هنرمندان پیکاپ) که با عینک فیلمبرداری شده است صحبت کرد. مدیر اجرایی گفت: \"اگر آن محتوا"}, {"source": "Business Insider", "title": "I used to think getting healthier required more discipline. Moving abroad showed me I actually needed a change of scene.", "link": "https://www.businessinsider.com/moving-abroad-helped-health-eat-better-for-cheaper-caribbean-2026-9", "summary": "Moving to the Caribbean changed how I view my health and made fresh produce feel more accessible. Chantel Henry For years, I dealt with symptoms related to seasonal allergies while trying to eat well on a budget. Moving to the Caribbean shifted how I view my health and gave me better access to fresh produce. I'm not magically \"cured\" by any means, but living somewhere new shifted my mindset and habits. On the seventh morning of a $135 \"respiratory cleanse,\" I stood in my Atlanta kitchen staring at five bottles of pills and raw vegetables. The plan required I take pills six times a day for 21 days and eat only raw food . I lasted a week until a friend invited me out, and the thought of ordering salad and water felt more exhausting than my congestion. I quit that day. Then, I was back to the drawing board again. I felt guilty knowing I'd spent nearly my whole paycheck on organic produce, only to watch it rot in the fridge. This was one of the many ways I'd been trying to throw money at any solution that might help me manage the symptoms of my chronic illness and seasonal allergies for years. I've tested $40 tinctures and $50 probiotics. I cycled through raw vegan, vegan, keto, carnivore-focused, and low-carb diets . Sometimes I wanted to lose weight. Other times, I hoped food would stop my body from overreacting to my environment. Unfortunately for me, the kind of fresh, organic-heavy eating I was chasing in Atlanta often meant choosing between expensive produce and enough groceries for the week. It was hard to consistently stick with it, especially as an entrepreneur with a sometimes unpredictable paycheck. Eventually, I realized I was searching for the \"right fix\" in the wrong places. After moving to the Caribbean over a decade ago, my perspective on my health shifted Moving didn t cure me. It changed my mindset. Leonid Andronov/Getty Images In my quest for remedies, I came across an internet rabbit hole that led me to people who said their health improved after moving to warmer climates . Their stories were not medical evidence, but I kept scrolling and filed them away in my mind. Later, when the man who became my husband asked whether I wanted to stay in Atlanta or move with him to Trinidad, I did not need much convincing. It seemed worth a shot for me (and us). That was 11 years ago. I'm so glad I said yes. Within weeks of moving to the hot and humid island, I noticed a big difference in my breathing, especially at night, when I used to struggle the mos", "date_str": "2026-09-18T17:31:01+00:00", "hash": "5ba725167df68976", "title_fa": "قبلاً فکر می کردم که سالم تر شدن نیاز به نظم و انضباط بیشتری دارد. مهاجرت به خارج از کشور به من نشان داد که واقعاً به تغییر صحنه نیاز دارم.", "summary_fa": "نقل مکان به دریای کارائیب دیدگاه من را نسبت به سلامتی تغییر داد و باعث شد که محصولات تازه در دسترس تر باشند. Chantel Henry سال‌ها با علائم مربوط به آلرژی‌های فصلی برخورد کردم در حالی که سعی کردم با بودجه مناسب غذا بخورم. حرکت به کارائیب دیدگاه من را نسبت به سلامتی تغییر داد و به من دسترسی بهتری به محصولات تازه داد. من به هیچ وجه به طور جادویی \"درمان\" نمی شوم، اما زندگی در جایی جدید ذهنیت و عادات من را تغییر داد. در هفتمین صبح یک \"پاکسازی تنفسی\" 135 دلاری، در آشپزخانه آتلانتا ایستادم و به پنج بطری قرص و سبزیجات خام خیره شدم. این برنامه مستلزم این بود که به مدت 21 روز شش بار در روز قرص بخورم و فقط غذای خام بخورم. یک هفته دوام آوردم تا اینکه یکی از دوستانم مرا به بیرون دعوت کرد و فکر سفارش سالاد و آب بیشتر از شلوغی من خسته کننده بود. من آن روز استعفا دادم سپس، دوباره به تخته طراحی برگشتم. احساس گناه می‌کردم که می‌دانستم تقریباً تمام دستمزدم را صرف محصولات ارگانیک کرده‌ام، فقط برای تماشای پوسیدگی آن در یخچال. این یکی از راه‌هایی بود که برای سال‌ها سعی می‌کردم برای هر راه‌حلی که ممکن است به من در مدیریت علائم بیماری مزمن و آلرژی‌های فصلی‌ام کمک کند، پول بریزم. من تنتور 40 دلاری و پروبیوتیک 50 دلاری را آزمایش کرده ام. رژیم‌های خام وگان، وگان، کتو، گوشتخواران و رژیم‌های کم کربوهیدرات را طی کردم. گاهی دلم می خواست وزن کم کنم. مواقع دیگر، من امیدوار بودم که غذا مانع از واکنش بیش از حد بدنم به محیط شود. متأسفانه برای من، نوعی غذای تازه و ارگانیک که در آتلانتا دنبال می‌کردم اغلب به معنای انتخاب بین محصولات گران قیمت و مواد غذایی کافی برای هفته بود. سخت بود که به طور مداوم"}, {"source": "Business Insider", "title": "Disney has a new tech chief — read the memo from CEO Josh D'Amaro", "link": "https://www.businessinsider.com/disney-new-tech-chief-read-memo-ceo-josh-damaro-2026-9", "summary": "New Disney CEO Josh D Amaro has hired an AI CEO as its first chief technology officer Blanca CRUZ / AFP via Getty Images Disney has hired an AI CEO as its first chief technology officer. Karandeep Anand joins from Character.AI, which got a cease-and-desist letter from Disney last fall. Read CEO Josh D'Amaro's full memo to employees below. Disney has hired its first-ever companywide tech chief as its leadership shuffle under CEO Josh D'Amaro continues. Karandeep Anand is joining Disney as chief technology officer and a senior EVP, D'Amaro told employees on Friday. \"Karandeep brings a rare mix of experience across infrastructure, consumer technology, and AI,\" D'Amaro said in a memo, which was obtained by Business Insider. The hire comes a day after Disney promoted Adam Smith to the head of its streaming business and moved Joe Earley, who'd shared the direct-to-consumer co-president title with Smith, to the president of franchise and content strategy for Disney's Entertainment TV arm. As tech chief, Anand will oversee the enterprise tech, infrastructure, data and AI platforms, product, and engineering teams, D'Amaro said. This aligns with the \"One Disney\" initiative designed to unify the company, which D'Amaro has made a priority . Friday marks D'Amaro's six-month anniversary at the helm of the Mouse House. Anand has been the CEO of Character.AI, an AI startup to which Disney sent a cease-and-desist letter last September. Disney had told Character.AI not to use its copyrighted characters in AI-generated videos without permission; Character.AI complied with the request. Before joining Character.AI, Anand spent six and a half years at Facebook, following more than 15 years at Microsoft. He will report to D'Amaro. Anand \"is an expert builder and strategist, technical and product-minded, with sharp instincts for what people actually want,\" D'Amaro told Disney staffers. Read D'Amaro's full memo to Disney employees here: When I stepped into this role, I laid out three priorities: great storytelling as our North Star, technology in service of creativity, and operating as One Disney. Today, we have some exciting news about how we are putting that strategy into motion. I'm thrilled to share that Karandeep Anand will be joining Disney as our first Senior EVP and Chief Technology Officer, reporting directly to me, beginning October 2. Karandeep brings a rare mix of experience across infrastructure, consumer technology, and AI. He led Character.AI as CEO, taking the comp", "date_str": "2026-09-18T17:19:20+00:00", "hash": "f4d84998d89dd413", "title_fa": "دیزنی یک مدیر فناوری جدید دارد - یادداشت مدیر عامل جاش دامارو را بخوانید", "summary_fa": "مدیر عامل جدید دیزنی، جاش دی آمارو، یک مدیر عامل هوش مصنوعی را به عنوان اولین مدیر ارشد فناوری خود استخدام کرده است. کاراندیپ آناند از Character.AI می‌پیوندد که پاییز گذشته نامه توقف و توقفی از دیزنی دریافت کرد. یادداشت کامل مدیر عامل جاش دامارو برای کارمندان را در زیر بخوانید. دیزنی اولین مدیر فناوری شرکت خود را در حالی استخدام کرد که تغییرات رهبری آن تحت مدیریت جاش دامارو ادامه دارد. D'Amaro روز جمعه به کارمندان گفت کاراندیپ آناند به عنوان مدیر ارشد فناوری و یک EVP ارشد به دیزنی می پیوندد. D'Amaro در یادداشتی که توسط Business Insider به دست آمده است، گفت: \"کاراندیپ ترکیب نادری از تجربه را در زیرساخت ها، فناوری مصرف کننده و هوش مصنوعی به ارمغان می آورد.\" این استخدام یک روز پس از آن صورت می‌گیرد که دیزنی آدام اسمیت را به عنوان رئیس کسب‌وکار استریم خود ارتقا داد و جو ارلی را که عنوان رئیس مشترک مستقیم به مصرف‌کننده را با اسمیت به اشتراک می‌گذاشت، به رئیس بخش امتیازدهی و استراتژی محتوا برای بازوی تلویزیون سرگرمی دیزنی منتقل کرد. D'Amaro گفت که آناند به عنوان رئیس فناوری، بر فناوری سازمانی، زیرساخت ها، پلتفرم های داده و هوش مصنوعی، محصولات و تیم های مهندسی نظارت خواهد کرد. این با ابتکار \"One Disney\" که برای متحد کردن شرکت طراحی شده است، که D'Amaro آن را در اولویت قرار داده است، مطابقت دارد. جمعه مصادف با شش ماهه حضور D'Amaro در راس خانه موش است. آناند مدیرعامل Character.AI است، یک استارت آپ هوش مصنوعی که دیزنی در سپتامبر گذشته نامه توقف و توقفی را به آن ارسال کرد. دیزنی به Character.AI گفته بود که از شخصیت های دارای حق چاپ خود در ویدیوهای تولید شده توسط هوش مصنوعی بدون اجازه استفاده نکند. Character.AI با این درخواست موافقت کرد. قبل از پیوستن به Character.AI، آناند شش"}, {"source": "Business Insider", "title": "Ukraine is testing homemade remote-controlled buggies for the first time to keep troops supplied this winter", "link": "https://www.businessinsider.com/ukraine-tests-homemade-remote-controlled-buggies-for-winter-logistics-2026-9", "summary": "Ukraine has been developing an increasing number of uncrewed solutions for logistics missions. Courtesy of Brave1 Ukraine is testing homemade remote-controlled buggies for battlefield logistics. The vehicles are meant to keep troops supplied through winter conditions. Kyiv is pushing more robots and autonomous systems to the front lines. Ukraine is testing homemade, remotely controlled off-road buggies for the first time, Kyiv disclosed on Friday, as the country looks for reliable ways to supply troops this coming winter. Brave1, the Ukrainian state-backed innovation platform, said it held closed trials for buggies developed by local manufacturers with a special unit under Ukraine's GUR military intelligence agency. The testing aimed to validate whether the optionally manned vehicles could perform under battlefield conditions, with winter in mind. \"As winter approaches, Ukraine's military needs affordable, fast, and highly mobile vehicles that can operate both with a driver and remotely,\" Brave1 said in a statement. Ground robots have become a vital component of Ukrainian logistics this year and are part of a broader effort by the military to replace soldiers with machinery in dangerous front-line missions, whenever and wherever possible. Many of these robots, however, have \"limitations,\" Brave1 said, characterizing them as slow and warning that they could struggle in the snow and mud of winter. Ukraine has used off-road buggies in special operations missions. They re fast and capable on rough terrain, though they lack external protection. With a remotely-controlled buggy, though, that becomes less of a problem. Courtesy of Brave1 Ukraine is now prioritizing the development of locally made buggies to fill that potential capability gap. Ukrainian forces have long used foreign-made buggies — lightweight four-wheel vehicles with no external protection — for infantry assaults, rapid movement, and other specialized missions, as well as logistics. Ukraine's special operators have used them on missions, dodging enemy drones in the process. Some of these buggies, though, have been plagued by high costs, insufficient remote-control capabilities , and an inability to meet battlefield demands, Brave1 said. \"Our goal is to build a fully-fledged Ukrainian buggy market,\" Brave1 said, adding that it has provided grants to more than half the developments available in the country and is working with manufacturers to make them remotely operated. Following the trials, Brave1", "date_str": "2026-09-18T16:41:32+00:00", "hash": "3537a899fa5ff6dd", "title_fa": "اوکراین برای اولین بار کالسکه های کنترل از راه دور دست ساز را آزمایش می کند تا نیروها را در زمستان امسال تامین کند.", "summary_fa": "اوکراین در حال توسعه تعداد فزاینده ای از راه حل های بدون خدمه برای ماموریت های لجستیکی است. با حسن نیت از Brave1 اوکراین در حال آزمایش کالسکه های کنترل از راه دور دست ساز برای تدارکات میدان جنگ است. این وسایل نقلیه برای حفظ نیروها در شرایط زمستانی است. کیف ربات‌ها و سیستم‌های خودمختار بیشتری را به خط مقدم می‌فرستد. کیف روز جمعه فاش کرد که اوکراین برای اولین بار در حال آزمایش کالسکه های آفرود دست ساز و کنترل از راه دور است، زیرا این کشور به دنبال راه های مطمئن برای تامین نیرو در زمستان آینده است. Brave1، پلت فرم نوآوری مورد حمایت دولت اوکراین، گفت که آزمایشات بسته را برای کالسکه های توسعه یافته توسط سازندگان محلی با واحد ویژه زیر نظر آژانس اطلاعات نظامی GUR اوکراین برگزار کرده است. هدف از این آزمایش تأیید این بود که آیا خودروهای سرنشین اختیاری می‌توانند در شرایط میدان جنگ با در نظر گرفتن زمستان عمل کنند یا خیر. Brave1 در بیانیه ای گفت: «با نزدیک شدن به فصل زمستان، ارتش اوکراین به وسایل نقلیه مقرون به صرفه، سریع و بسیار متحرک نیاز دارد که بتواند هم با راننده و هم از راه دور کار کند. روبات‌های زمینی در سال جاری به یکی از اجزای حیاتی لجستیک اوکراین تبدیل شده‌اند و بخشی از تلاش گسترده‌تر ارتش برای جایگزینی سربازان با ماشین‌آلات در مأموریت‌های خط مقدم خطرناک، در هر زمان و هر کجا که ممکن است، هستند. با این حال، Brave1 گفت که بسیاری از این روبات‌ها «محدودیت‌هایی» دارند، و آنها را آهسته توصیف کرد و هشدار داد که می‌توانند در برف و گل و لای زمستان مبارزه کنند. اوکراین از کالسکه های خارج از جاده در ماموریت های عملیات ویژه استفاده کرده است. آنها در زمین های ناهموار سریع و توانا هستند، اگرچه فاقد حفاظت خارجی هستند. با این"}, {"source": "Business Insider", "title": "These 5 states are home to America's richest billionaires", "link": "https://www.businessinsider.com/the-states-with-the-highest-number-of-america-billionaires-2026-9", "summary": "Jeff Bezos, who lives in Florida, is the second-richest person in the US, with a net worth of $378 billion. JULIEN DE ROSA / AFP via Getty Images Forbes published its 2026 list of the top 400 billionaires in the US on Tuesday. The billionaires have net worths of at least $4.4 billion, and 249 of them live across 5 states. California has the highest concentration of the billionaires listed. Some of the richest people on Earth live in the United States. In fact, the US has the largest share of the world's billionaires, home to nearly one-third of them. But the bar for reaching the upper echelons of American wealth is higher than ever. On Tuesday, Forbes released its annual list of America's 400 richest billionaires , and a record $4.4 billion net worth was required to make the cut. Still, 34 people made the list for the first time this year. To see where America's wealthiest 1% are concentrated, Business Insider compiled a list of states where most of the Forbes 400 billionaires live, and found 249 live across just five states. About a third of them reside in California, a state home to the booming tech and AI industries. Meta CEO Mark Zuckerberg, for example, has a sprawling $37 million compound in Palo Alto, near San Francisco. Florida, the third-most-popular state for the Forbes 400, has its own collection of extravagant estates. Jeff Bezos owns a nearly $250 million compound on Miami's Indian Creek Island, nicknamed \" Billionaire Bunker .\" President Donald Trump, meanwhile, famously has his Mar-a-Lago estate in Palm Beach. In total, Forbes 400 members live across 38 states and the District of Columbia, with some states home to just one. Oregon's lone member, Nike founder Phil Knight , lives in a rural, tree-covered area outside Hillsboro, near the company's world headquarters . Nebraska's sole billionaire, Warren Buffett, still lives in the Omaha home he bought in 1958. Here are the five states with the biggest concentrations of Forbes 400 billionaires. 5. Illinois Ty Warner, CEO of Ty Inc., the plush toy company, is among the richest people living in Illinois. Chris Hondros/Getty Images Eighteen billionaires live in Illinois. Lukas Walton, the grandson of Walmart founder Sam Walton, is the state's richest person, with a net worth of $44.4 billion. The Forbes data shows the Walton family has a combined net worth of $475.
