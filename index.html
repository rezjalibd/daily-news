ر کرده است. بیشتر سوپرمارکت‌ها در سراسر اروپا به اینترنت متصل هستند و تعمیر و نگهداری و عیب‌یابی می‌تواند از راه دور انجام شود. در حمله سایبری که تقریبا یک ماه پیش انجام شد، دمای یخچال‌ها و فریزرهای صدها سوپرمارکت در سراسر فرانسه افزایش یافت که در نتیجه آن، مواد غذایی تازه و منجمد به قیمت میلیون‌ها یورو فاسد شدند. سپس در هفته گذشته، ده‌ها سوپرمارکت در هفت کشور دیگر اروپایی نیز هدف حمله سایبری قرار گرفتند که یخچال‌ها و فریزرها را هدف قرار داده بود. مشخص نیست که آیا این موارد با یکدیگر مرتبط هستند یا خیر. خبرنامه بی‌بی‌سی فارسی گزیده‌ای از مهم‌ترین خبرها، گزارش‌های میدانی و گفت‌وگوهای اختصاصی را هر هفته در ایمیل خود دریافت کنید. در حادثه هفته گذشته حدود ۴۰ سوپرمارکت دُلِز در بلژیک و لوکزامبورگ تحت تاثیر این حمله قرار گرفتند اما در سوئد، ایرلند، هلند، استونی و فنلاند تعداد فروشگاه‌ها کمتر بود. سابکوبل، شرکت سازنده بلژیکی که برخی از یخچال‌هایش هدف حمله قرار گرفتند، گفت که تبخیرکننده‌های [مایع سردکننده] این دستگاه‌ها به حالت یخ‌زدایی تغییر داده شدند و این باعث گرم شدنشان شد. استفان مولانس، مدیرعامل سابکوبل، که سیستم‌های دُلِز را اداره می‌کند، روز دوشنبه (۲ نوامبر) به خبرگزاری بلگا گفت که این حادثه یک حمله سایبری بوده است و شرکت «تمام شب و صبح» کار کرده است تا دستگاه‌های تحت تاثیر را", "image_url": "https://ichef.bbci.co.uk/news/1200/branded_persian/afc0/live/92d6e300-dc65-11f1-8fe6-5becaee5408f.jpg", "category": "هوش مصنوعی مولد", "tags": ["روابط بین‌الملل"], "datetime_fa": "۱۸ آبان • ۲۰:۲۹"}, {"source": "BBC Persian", "title": "زبان عشق چیست و چقدر می‌توان به آن اعتماد کرد؟", "link": "https://www.bbc.com/persian/articles/c95ynyg34p31o?at_medium=RSS&at_campaign=rss", "summary": "پنج زبان عشق چپمن عبارت‌اند از: «وقت‌ باکیفیت»، «کار فکرشده»، «کلام محبت‌آمیز»، «دادن هدیه» و «تماس جسمانی» که به نظر می‌رسد این پنج نکته این روزها بیش از هر زمان دیگری فراگیر هستند.", "date_str": "2026-11-09T17:53:42+00:00", "hash": "7c75528825ca7d38", "title_fa": "زبان عشق چیست و چقدر می‌توان به آن اعتماد کرد؟", "summary_fa": "پنج زبان عشق چپمن عبارت‌اند از: «وقت‌ باکیفیت»، «کار فکرشده»، «کلام  سازمان همکاری‌های اقتصادی و توسعه، او‌ای‌سی‌دی، بر اساس اطلاعات مربوط به ۴۳ کشور، شامل ۳۸ کشور عضو و پنج کشور نامزد عضویت منتشر کرده، ۵۷ درصد شهروندانِ بین ۲۵ تا ۶۴ سالۀ جمهوری ایرلند، دارای دست‌کم مدرک کارشناسی هستند؛ آماری که این کشور را در صدر جدول جهانی قرار می‌دهد. استرالیا، هلند، کرۀ جنوبی و سوئد هم با میانگین‌هایی بین ۴۳ تا ۴۱ درصد کشورهای بعدی جدول هستند و به این ترتیب، در میان ۱۰ کشور اول، تنها دو کشور غیر اروپایی، به‌چشم می‌خورند:‌ استرالیا و کرۀ جنوبی. ایالات متحده با وجود میزبانی از شمار بسیار زیادی از دانشگاه‌های معتبر جهان، در رتبۀ یازدهم قرار گرفته است؛ آن‌هم با آمار حدود ۴۱ درصد؛ آماری معادل میانگین کشورهای عضو سازمان همکاری‌های اقتصادی و توسعه. آمار کشورهایی مثل کانادا، ژاپن، آلمان، فرانسه، ترکیه و بخصوص چین، از این هم غیر منتظره‌تر است: در این کشورها به‌ترتیب، ۳۹، ۳۷، ۳۵، ۳۰، ۲۰ و تنها ۹ درصد از بزرگسالان گروه سنی فعال، دارای مدارک دانشگاهی هستند. در مورد چین البته نباید جمعیت بسیار زیاد کشور را هم فراموش کرد؛ موضوعی که باعث می‌شود شمار فارغ‌التحصیلان دانشگاه‌های این کشور، بسیار زیاد باشد. بر اساس آمار منتشر شده از سوی سازمان همکاری‌های اقتصادی و توسعه، ۴۰ درصد از بزرگسالان اسرائیلی هم دارای مدارک دانشگاهی هستند؛ موضوعی که این‌ کشور را پس از آمریکا و بالاتر از کشورهایی همچون کانادا، در رتبۀ ۱۳ قرار", "image_url": "https://gdb.rferl.org/B467E620-2181-4F82-AC27-87F621423E60.jpg", "category": "هوش مصنوعی مولد", "tags": ["رویداد", "گزارش"], "datetime_fa": "۱۸ آبان • ۲۱:۱۳"}, {"source": "Radio Farda", "title": "فرانسه گروه «شهید کاوه» ایران را مسئول هک یخچال‌های سوپرمارکت‌ها دانست", "link": "https://www.radiofarda.com/a/paris-prosecutors-open-probe-into-iran-s-shahid-kaveh-over-suspected-hacking-of-supermarkets-fridges/33893977.html", "summary": "به گفتهٔ دادستانی پاریس، تحقیقات درباره هک یخچال‌ها نشان‌ می‌دهد که از زبان فارسی و آدرس‌های آی‌پی مرتبط با برخی نهادها در ایران استفاده شده است.", "date_str": "2026-11-09T16:26:35+00:00", "hash": "b1617c36f88c21dc", "title_fa": "فرانسه گروه «شهید کاوه» ایران را مسئول هک یخچال‌های سوپرمارکت‌ها دانست", "summary_fa": "به گفتهٔ دادستانی پاریس، تحقیقات درباره هک یخچال‌ها نشان‌ می‌دهد که از زبان فارسی و آدرس‌های آی‌پی مرتبط با برخی نهادها در ایران استفاده شده است. دادستانی پاریس روز دوشنبه ۱۸ آبان اعلام کرد که تحقیقات درباره گروه «شهید کاوه» ایران را به اتهام هک مشکوک یخچال‌ها و فریزرهای سوپرمارکت‌ها در این کشور آغاز کرده است. دادستانی پاریس در بیانیه‌ای تصریح کرد که تحقیقات درباره هک یخچال‌ها نشان‌دهندهٔ شیوه حمله‌ای است که مشخصهٔ گروه «شهید کاوه» است. بر اساس این بیانیه، برای رئیس گروه «شهید کاوه»، یگان سایبری تهاجمی وابسته به سپاه پاسداران، و دو معاون او درخواست صدور حکم بازداشت بین‌المللی داده است. در همین حال، ژان‌نوئل بارو، وزیر خارجه فرانسه، سپاه پاسداران را متهم کرد که پشت حملهٔ سایبری اخیر به یخچال‌های سوپرمارکت‌های فرانسه قرار دارد و گفت این اقدام برای ایران پیامدهایی خواهد داشت. او افزود که به همین دلیل، سفیر جمهوری اسلامی به وزارت خارجه فرانسه احضار شده است. دادستانی پاریس ۲۰ مهرماه اعلام کرده بود که هکرها شبانه دمای یخچال‌ها و فریزرهای بسیاری از سوپرمارکت‌های فرانسه را تا ۵۰ درجهٔ سانتی‌گراد بالا بردند و در یک حملهٔ سایبری گسترده، در چند صد فروشگاه باعث آتش‌سوزی و فاسد شدن مواد غذایی شدند. به گفتهٔ این دادستانی، حمله‌ای در مقیاس وسیع، «یخچال‌های متصل به شبکهٔ چندین خرده‌فروش بزرگ مواد غذایی در سراسر فرانسه را تحت تأثیر قرار داده» و منجر به فاسد شدن مواد غذایی و آتش‌سوزی شده است. یکی از اعضای دفتر سباستین لکورنو، نخست‌وزیر فرانسه، گفته بود که به آژانس ملی امنیت سایبری فرانسه دستور داده است تحقیقات در این زمینه را آغاز کند. او افزود که فرانسه با همتایان اروپایی خود در تماس خواهد بود، چون ممکن است کشورهای دیگر نیز آسیب دیده باشند، و مقام‌ها در حال ارزیابی این موضوع هستند که آیا شرکت‌های فرانسوی دیگری نیز در معرض خطر قرار دارند.", "image_url": "https://gdb.rferl.org/4EA07D7C-48E6-4743-8B96-302E640B516D.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۹:۵۶"}, {"source": "IranWire", "title": "تسنیم برنامه دیدار محسن رضایی و جی‌دی ونس در دوحه را تکذیب کرد", "link": "https://iranwire.com/fa/news-1/160010-%D8%AA%D8%B3%D9%86%DB% ر چند صد فروشگاه باعث آتش‌سوزی و فاسد شدن مواد غذایی شدند. به گفتهٔ این دادستانی، حمله‌ای در مقیاس وسیع، «یخچال‌های متصل به شبکهٔ چندین خرده‌فروش بزرگ مواد غذایی در سراسر فرانسه را تحت تأثیر قرار داده» و منجر به فاسد شدن مواد غذایی و آتش‌سوزی شده است. یکی از اعضای دفتر سباستین لکورنو، نخست‌وزیر فرانسه، گفته بود که به آژانس ملی امنیت سایبری فرانسه دستور داده است تحقیقات در این زمینه را آغاز کند. او افزود که فرانسه با همتایان اروپایی خود در تماس خواهد بود، چون ممکن است کشورهای دیگر نیز آسیب دیده باشند، و مقام‌ها در حال ارزیابی این موضوع هستند که آیا شرکت‌های فرانسوی دیگری نیز در معرض خطر قرار دارند.", "image_url": "https://gdb.rferl.org/4EA07D7C-48E6-4743-8B96-302E640B516D.jpg", "category": "امنیت سایبری و شبکه", "tags": ["امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۹:۵۶"}, {"source": "IranWire", "title": "یزد، نخستین شهر خشت خام جهان دیگر گردشگر خارجی ندارد", "link": "https://iranwire.com/fa/special-features/160004-%DB%8C%D8%B2%D8%AF-%D9%86%D8%AE%D8%B3%D8%AA%DB%8C%D9%86-%D8%B4%D9%87%D8%B1-%D8%AE%D8%B4%D8%AA-%D8%AE%D8%A7%D9%85-%D8%AC%D9%87%D8%A7%D9%86-%D8%AF%DB%8C%DA%AF%D8%B1-%DA%AF%D8%B1%D8%AF%D8%B4%DA%AF%D8%B1-%D8%AE%D8%A7%D8%B1%D8%AC%DB%8C-%D9%86%D8%AF%D8%A7%D8%B1%D8%AF/", "summary": "یزد و کوچه‌های خشتی و آب انبارهایش در روزهای نه چندان دور یکی از مقاصد اصلی گردشگران خارجی بود. این کوچه‌های تو در تو که بافت قدیمی یز ...", "date_str": "2026-11-09T14:50:14+00:00", "hash": "f2e612fdc669f7d5", "title_fa": "یزد، نخستین شهر خشت خام جهان دیگر گردشگر خارجی ندارد", "summary_fa": "یزد و کوچه‌های خشتی و آب انبارهایش در روزهای نه چندان دور یکی از مقاصد اصلی گردشگران خارجی بود. این کوچه‌های تو در تو که بافت قدیمی یز ... یزد، نخستین شهر خشت خام جهان دیگر گردشگر خارجی ندارد یزد و کوچه‌های خشتی و آب انبارهایش در روزهای نه چندان دور یکی از مقاصد اصلی گردشگران خارجی بود. این کوچه‌های تو در تو که بافت قدیمی یزد را تشکیل می‌دهد View this post on Instagram A post shared by Iranwire.comایران وایر (@iranwire) به همین دلیل، بسیاری از خانه‌ها قدیمی این محله‌ها به هتل و اقامتگاه تبدیل شده ا ر دوستی را نادیده بگیرد که از گسترش مرکز داده نامحبوب او حمایت می کرد، شرکتش به سالن رقص کاخ سفید کمک مالی کرد و مخالفت او با پادمان های هوش مصنوعی در برابر توصیه های متخصص را تکرار کرد. انویدیا با تامین قدرت محاسباتی بی رحمانه به سنگ بنای هوش مصنوعی تبدیل شد. در حالی که غول‌های فناوری برای واحدهای پردازش گرافیکی شرکت (GPU) تلاش می‌کردند، آقای هوانگ کلنگ‌ها و بیل‌ها را برای هوش مصنوعی فروخت و 160 میلیارد دلار ثروت به دست آورد. وقتی چین به رقابت برای برتری فناوری پیوست، ریزتراشه‌های انویدیا به یک مسئله امنیت ملی تبدیل شدند. در اکتبر 2022، ایالات متحده کنترل صادرات بر فروش GPU به چین را اعمال کرد. سی ماه بعد، Nvidia عملاً از فروش به پکن منع شد. آقای هوانگ برای کنترل های ضعیف تر لابی کرد. تأثیر او بر ترامپ به حدی بود که کاخ سفید محدودیت‌های جهانی تراشه‌های هوش مصنوعی دوران بایدن را لغو کرد و سپس اجازه فروش پردازنده‌های ارزشمند H200 انویدیا را به مشتریان چینی داد. آیا نظری در مورد موضوعات مطرح شده در این مقاله دارید؟ اگر مایلید تا حداکثر 300 کلمه پاسخی را از طریق ایمیل ارسال کنید تا برای انتشار در بخش نامه‌های ما در نظر گرفته شود، لطفا", "image_url": "https://i.guim.co.uk/img/media/63c3dc64507f47996bc06856081323764517277f/131_0_2057_1645/master/2057.jpg?width=1200&height=630&quality=85&auto=format&fit=crop&precrop=40:21,offset-x50,offset-y0&overlay-align=bottom%2Cleft&overlay-width=100p&overlay-base64=L2ltZy9zdGF0aWMvb3ZlcmxheXMvdGctb3BpbmlvbnMucG5n&enable=upscale&s=0a74f1d551d67d1b343d927ac148efc7", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Nvidia", "امنیت سایبری", "تراشه"], "datetime_fa": "۱۸ آبان • ۲۲:۲۱"}, {"source": "The Verge", "title": "Anthropic launches new Claude Fable and Mythos 5.2 models", "link": "https://www.theverge.com/ai-artificial-intelligence/1030005/anthropic-claude-fable-mythos-5-2", "summary": "Anthropic is announcing two new models today: Claude Fable 5.2 and Claude Mythos 5.2, which it says are designed to take on \"daunting\" technical challenges. The company claims the new models show improvements in coding, reasoning, and vision, les. در ایکس باکس، Ultimate چند نفره آنلاین را نیز فعال می کند. Xbox Game Pass Ultimate (اشتراک سه ماهه) از کجا بخریم: 68.99 دلار 57.99 دلار در Newegg (با کد تبلیغاتی BNWF2656) که قبلاً یک پیشنهاد ساده بود، این سرویس در طول سال گذشته دستخوش تغییرات مختلفی شده است که کمی جذابیت آن را کاهش داده است. Xbox Game Pass Ultimate قبلا 29.99 دلار در ماه بود، اما اوایل امسال مایکروسافت بازی‌های Call of Duty را از کتابخانه حذف کرد و در این فرآیند قیمت را به 22.99 دلار کاهش داد. اخیراً، مایکروسافت محدودیت‌های ساعتی را به بازی‌های ابری اضافه کرده است. همه مشترکین طرح Game Pass قبلاً از مقدار نامحدودی از بازی های ابری در رایانه یا دستگاه تلفن همراه خود لذت می بردند، اما اکنون برنامه ها تعداد ساعات اضافه شده را با طرح Ultimate شامل 15 ساعت در ماه می کند. این خبر تنها چند هفته قبل از اعلام برنامه‌های پرداخت هزینه برای مشترکین غیر Game Pass منتشر شد. سایر معاملات قابل در نظر گرفتن AMD Ryzen 7 9700X در خرده فروشان", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/xbox-game-pass-ultimate-roundup.png?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["Microsoft", "تراشه"], "datetime_fa": "۱۸ آبان • ۲۲:۰۵"}, {"source": "The Verge", "title": "Instagram’s Effect Builder makes new filters from AI prompts", "link": "https://www.theverge.com/tech/1030061/instagram-ai-effect-builder-filters", "summary": "After expanding its Edits app to macOS last week, Instagram's next move is launching this Effect Builder that generates custom filters for your Stories posts with AI. Available now for US residents who are over 18, it has a prompt box for describing your filter idea to the chatbot, with an option to attach style reference images. Then you can upload your own photos to preview the AI-generating effects, and ask for changes in follow-up prompts. There's also an option to allow Instagram's AI to rewrite your prompt, which turned my one-line test prompt \"Make a filter that turns photos into comic book pages\" into several AI-generated paragraphs … Read the full story at The Verge.", "date_str": "2026-11-09T18:07:23+00:00", "hash": "57b37eb27ca9e24b", "title_fa": "افکت ساز اینستاگرام فیلترهای جدیدی را از اعلان های هوش مصنوعی می سازد", "summary_fa": "پس از گسترش اپلیکیشن Edits خود به macOS در هفته گذشته، اقدام بعدی اینستاگرام راه اندازی این افکت ساز است که فیلترهای سفارشی را برای پست های استوری شما با هوش مصنوعی ایجاد می کند. اکنون برای ساکنان ایالات متحده که بالای 18 سال دارند در دسترس است، دارای یک جعبه اعلان برای توصیف ایده فیلتر شما به ربات چت، با گزینه ای برای پیوست کردن تصاویر مرجع سبک. سپس می‌توانید عکس‌های خود را برای پیش‌نمایش جلوه‌های تولیدکننده هوش مصنوعی آپلود کنید و تغییراتی را در اعلان‌های بعدی درخواست کنید. همچنین گزینه‌ای وجود دارد که به هوش مصنوعی اینستاگرام اجازه می‌دهد درخواست شما را بازنویسی کند، که فرمان آزمایشی تک خطی من «ساخت فیلتری که عکس‌ها را به صفحات کتاب کمیک تبدیل می‌کند» را به چندین پاراگراف تولید شده توسط هوش مصنوعی تبدیل کرد… داستان کامل را در The Verge بخوانید. Tech AI News Instagram's Effect Builder فیلترهای جدیدی را از درخواست‌های هوش مصنوعی می‌سازد ربات Effect Builder در وب برای ایجاد فیلترهای جدید اینستاگرام در دسترس است. استیوی در Laptop Mag شروع به نوشتن اخبار و بررسی در مورد سخت افزار، بازی و هوش مصنوعی کرد. پس از گسترش اپلیکیشن Edits خود به macOS در هفته گذشته، اقدام بعدی اینستاگرام این است که این Effect Builder را راه اندازی کند که فیلترهای سفارشی را برای پست های استوری شما با هوش مصنوعی ایجاد می کند. اکنون برای ساکنان ایالات متحده که بالای 18 سال دارند در دسترس است، دارای یک جعبه اعلان برای توصیف ایده فیلتر شما به ربات چت، با گزینه ای برای پیوست کردن تصاویر مرجع سبک. اسکرین شات 1/2 بعدی: The Verge / Instagram شما می‌توانید فیلترهای خود را مستقیماً از Effect Builder به اینستاگرام ارسال کنید، اما افکت‌ها قبل از اینکه در دسترس سایر کاربران قرار گیرند باید یک بررسی ایمنی را پشت سر بگذارند.", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/instagram-effect-builder-launch-2.jpeg?quality=90&strip=all&crop=0%2C10.193943950862%2C100%2C79.612112098277&w=1200", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Meta"], "datetime_fa": "۱۸ آبان • ۲۱:۳۷"}, {"source": "Ars Technica", "title": "Claude Code is accidentally exposing secrets all over GitHub", "link": "https://arstechnica.com/ai/2026/11/claude-code-settings-files-expose-thousands-of-secrets-on-github/", "summary": "Claude Code is leaking sensitive information on public GitHub instances thanks to a partial oversight in the way its settings files are handled. That's the finding of AI security researchers at Apiiro, who discovered thousands of secrets , including database passwords, API tokens, and root logins, amid Claude Code settings files embedded in GitHub repositories. The leak stems from the way Claude Code handles user approval for automated shell commands. When a user chooses the \"Yes, and don't ask again\" option to approve running a command, that choice gets stored as part of a rule in the local \".claude/settings.local.json\" file on the user's computer. That rule is sometimes coded as a pattern, but the command itself is often written to that settings file as is, including any sensitive information that may be embedded within it. This isn't really a significant security issue if the settings file stays on the user's local machine (assuming that machine doesn't become compromised itself, of course). And Anthropic notes in its Claude Code documentation that this particular settings file gets added to the developer's global .gitignore list , which usually prevents it from being shared publicly. Read full article Comments", "date_str": "2026-11-09T17:24:26+00:00", "hash": "a2a7ca70e4ba10c5", "title_fa": "Claude Code به طور تصادفی اسرار را در سراسر GitHub افشا می کند", "summary_fa": "کلود کد به لطف نظارت جزئی در نحوه مدیریت فایل‌های تنظیماتش، اطلاعات حساسی را در نمونه‌های عمومی GitHub افشا می‌کند. این یافته‌های محققان امنیت هوش مصنوعی در Apiiro است که هزاران راز از جمله رمزهای عبور پایگاه داده، توکن‌های API و لاگین‌های ریشه را در میان فایل‌های تنظیمات Claude Code تعبیه‌شده در مخازن GitHub کشف کردند. این نشت ناشی از روشی است که کلود کد تأیید کاربر را برای دستورات پوسته خودکار کنترل می کند. وقتی کاربر برای تأیید اجرای یک فرمان گزینه «بله و دوباره درخواست نشود» را انتخاب می‌کند، این انتخاب به عنوان بخشی از یک قانون در فایل محلی «.claude/settings.local.json» در رایانه کاربر ذخیره می‌شود. این قانون گاهی اوقات به عنوان یک الگو کدگذاری می شود، اما خود فرمان اغلب در آن فایل تنظیمات همانطور که هست، شامل اطلاعات حساسی که ممکن است در آن تعبیه شده باشد، نوشته می شود. اگر فایل تنظیمات روی دستگاه محلی کاربر باقی بماند، این واقعاً یک مشکل امنیتی مهم نیست (البته با فرض اینکه دستگاه خودش در معرض خطر قرار نگیرد). و Anthropic در اسناد Claude Code خود اشاره می‌کند که این فایل تنظیمات خاص به فهرست جهانی .gitignore توسعه‌دهنده اضافه می‌شود، که معمولاً از اشتراک‌گذاری عمومی آن جلوگیری می‌کند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش کلود کد به لطف یک نظارت جزئی در نحوه مدیریت فایل های تنظیماتش اطلاعات حساسی را در نمونه های عمومی GitHub افشا می کند. این یافته‌های محققان امنیت هوش مصنوعی در Apiiro است که هزاران راز از جمله رمزهای عبور پایگاه داده، توکن‌های API و لاگین‌های root را در میان فایل‌های تنظیمات Claude Code تعبیه‌شده در مخازن GitHub کشف کردند.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/claude-github-leaks-1152x648.jpg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "Anthropic", "امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۲۰:۵۴"}, {"source": "Engadget", "title": "How does Google Wallet's notification feed work and can you disable it?", "link": "https://www.engadget.com/2307741/google-wallet-notifications-how-works-disable/", "summary": "Google Wallet is attempting to make notifications easier to find with a notification feed, but if you re sick of alerts, find out how to disable them.", "date_s w.zoomit.ir/social-network/470826-instagram-ai-effect-builder-launch/", "summary": "اینستاگرام ابزار تحت وب جدیدی منتشر کرد که توصیف متنی کاربران را با هوش مصنوعی به فیلترهای سفارشی تبدیل می‌کند.", "date_str": "2026-11-09T18:30:38+00:00", "hash": "219b114c19c3b520", "title_fa": "ساخت فیلتر استوری با یک جمله دستوری؛ اینستاگرام آپدیت شد", "summary_fa": "اینستاگرام ابزار تحت وب جدیدی منتشر کرد که توصیف متنی کاربران را با هوش مصنوعی به فیلترهای سفارشی تبدیل می‌کند. تبلیغات اینستاگرام ابزار تازه‌ای به نام Effect Builder را معرفی کرد که می‌تواند دستور متنی کاربران را با کمک هوش مصنوعی به فیلترهای سفارشی برای بخش استوری تبدیل کند. کاربر، ایده‌ی بصری خود را در کادر گفت‌وگو می‌نویسد و سامانه بر مبنای همان درخواست، افکتی قابل‌آزمایش می‌سازد. Effect Builder فعلا فقط در دسترس ساکنان بالای ۱۸ سال ایالات متحده قرار گرفته است و از طریق وب اجرا می‌شود. روند کار از یک کادر درخواست آغاز می‌شود. کاربران می‌توانند ظاهر فیلتر موردنظرشان را برای ربات شرح دهند و در صورت نیاز، تصویرهایی را نیز به‌عنوان مرجع سبک پیوست کنند. ترکیب متن و تصویر مرجع به سامانه کمک می‌کند رنگ‌ها، نورپردازی و زبان بصری موردنظر را تشخیص دهد. پس از تولید افکت، امکان بارگذاری عکس‌های شخصی برای پیش‌نمایش نتیجه وجود دارد. اگر خروجی با تصور اولیه هم‌خوان نباشد، کاربر می‌تواند با درخواست‌های بعدی خواستار اصلاح آن شود. ساخت فیلتر در نتیجه به یک گفت‌وگوی چندمرحله‌ای تبدیل می‌شود و برای تغییر خروجی نیازی به آغاز دوباره‌ی فرایند نیست. Effect Builder گزینه‌ای هم برای بازنویسی خودکار درخواست دارد. در آزمایش گزارش‌شده، جمله‌ی کوتاه «فیلتری بساز که عکس‌ها را به صفحه‌های کتاب کمیک تبدیل کند» به چند پاراگراف دستور دقیق درباره‌ی پالت رنگ، نورپردازی و جزئیات سبک تبدیل شد. طولانی‌ترشدن درخواست، با وجود جزئیات فراوان، تفاوت محسوسی در خروجی ایجاد نکرد. فیلتری که از متن بازنویسی‌شده ساخته شد، تقریبا همان ظاهر نتیجه‌ی حاصل از درخواست یک‌خطی را داشت. تجربه‌ی آزمایشی نشان می‌دهد افزایش جزئیات همیشه به تغییر قابل‌مشاهده‌ی نتیجه منجر نمی‌شود و برداشت مدل از ایده‌ی اصلی ممکن است پیش از بازنویسی نیز شکل گرفته باشد.", "image_url": "https://api  the first time the space agency has accepted applications for prospective astronauts since 2024 . The agency said it will help usher in the \"Golden Age of innovation and exploration,\" including missions to the lunar South Pole and, potentially, the red planet. \"The people we select could walk on the Moon, live and work at the Moon Base, and help pioneer the systems and operations that will ultimately carry crews to Mars,\" Jared Isaacman, the agency's administrator, said in a press release. The bar is high: Applicants must be a US citizen with a completed Master's degree in a STEM field — or an equivalent background, such as medical degrees, doctoral work, or test-pilot training. They also need three full years of relevant work experience. \"NASA seeks astronaut candidates who represent the best of American ingenuity, skill, and determination,\" Anna Schneider, NASA's Public Affairs Specialist, said in a statement. \"They must demonstrate strong technical expertise, operational judgment, leadership, teamwork, communication skills, and the ability to perform demanding missions safely and effectively.\" NASA said it received over 8,000 applications during its last talent search. Only 10 applicants made the cut. Successful applicants must pass drug tests, a background security investigation, vision testing, and other medical and psychiatric exams. They'll also need to pass a water survival test and be willing to spend long stretches in hazardous and confined spaces. They'll get two years of training — and will be subject to \"irregular hours,\" receive an annual salary of $164,395, and can't work remotely. The agency expects to announce its new class in late 2027. If you're planning on applying, godspeed. Read the original article on Business Insider", "date_str": "2026-11-09T17:58:20+00:00", "hash": "68f1ad22f77018cc", "title_fa": "آیا می خواهید فضانورد شوید؟ ناسا برای اولین بار در 2 سال گذشته درخواست ها را می پذیرد.", "summary_fa": "ناسا برای اولین بار از سال 2024 به دنبال یک دسته جدید از فضانوردان است. کنت نیشیمورا / خبرگزاری فرانسه از طریق گتی ایماژ ناسا می گوید که به ماه برمی گردد و چشمش به مریخ است — بنابراین در حال استخدام است. این شغل با حقوق شش رقمی و برخی شرایط کاری سخت همراه است. آخرین باری که آژانس استخدام کرد، 8000 نفر درخواست دادند. فقط 10 نفر برش را انجام دادند. آیا به دنبال شغل جدیدی هستید و با یک رفت و آمد کاری 140 میلیون مایلی خوب هستید؟ روز شنبه، ناسا اعلام کرد که درخواست‌های خود را برای کلاس کاندیدای فضانورد بعدی خود باز کرده است - این اولین باری است که آژانس فضایی درخواست‌هایی را برای فضانوردان احتمالی از سال 2024 پذیرفته است. این آژانس گفت که به آغاز «عصر طلایی نوآوری و اکتشاف»، از جمله مأموریت‌ها به قطب جنوب قمری و احتمالاً سیاره سرخ کمک خواهد کرد. جرد آیزاکمن، مدیر آژانس در بیانیه‌ای مطبوعاتی گفت: «افرادی که ما انتخاب می‌کنیم می‌توانند روی ماه قدم بزنند، در پایگاه ماه زندگی و کار کنند، و به پیشگامی در سیستم‌ها و عملیاتی که در نهایت خدمه را به مریخ می‌برند، کمک کنند». این نوار بالا است: متقاضیان باید یک شهروند ایالات متحده با مدرک کارشناسی ارشد تکمیل شده در یک رشته STEM - یا سابقه مشابه، مانند مدارک پزشکی، کار دکترا، یا آموزش خلبان آزمایشی باشند. آنها همچنین به سه سال تجربه کاری مرتبط نیاز دارند. آنا اشنایدر، کارشناس روابط عمومی ناسا در بیانیه ای گفت: «ناسا به دنبال فضانوردانی است که نشان دهنده بهترین نبوغ، مهارت و اراده آمریکایی باشند. \"آنها باید تخصص فنی قوی، قضاوت عملیاتی، رهبری، کار تیمی، مهارت های ارتباطی و توانایی انجام ماموریت های سخت را به طور ایمن و موثر نشان دهند.\" ناسا اعلام کرد که در آخرین جستجوی استعداد خود بیش", "image_url": "https://i.insider.com/6af1ee1380d4b24f183478f0?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۲۱:۲۸"}, {"source": "Business Insider", "title": "An internal Disney presentation reveals its top streaming priorities, from creator content to a free tier", "link": "https://www.businessinsider.com/disney-streaming-presentation-2027-priorities-free-tier-vertical-clips-2026-11", "summary": "Disney told tech employees how it s planning to improve its streaming service in the coming year. Bernd Weißbrod/picture alliance via Getty Images; Slaven Vlasic/Getty Images Disney tech execs unveiled a list of streaming priorities for the year ahead in a town hall. The Mouse House is planning to add creator content to Disney+ and is working on a free offering. A leaked presentation gives a clear view into CEO Josh D'Amaro's streaming vision. Disney has plans to make big changes to its namesake streamer, Business Insider has learned. Disney+'s priorities for the next year include uploading more vertical video clips , adding creator content, and working on a free tier, according to screenshots of an internal presentation viewed by Business Insider. Tech leaders told employees how they're planning to boost engagement on Disney+ in a town hall late last week. In the meeting, execs, including VP of product management Dave Lindsay, unveiled Disney's streaming strategy and priorities for the 2027 fiscal year, which began in October. In the town hall, some tech employees also pressed management for details on a possible next round of layoffs. The leaked slide deck gives one of the clearest views yet into CEO Josh D'Amaro's plan to have Disney+ be the \"digital centerpiece\" of the company, while making its flagship service more competitive with paid streamers, YouTube, and social media. According to Nielsen, Disney's streamers accounted for 4.8% of US TV viewership in August — well behind YouTube at 15.8% and Netflix at 7.7%, but more than twice the share of rivals Paramount+ and Peacock. Here's what's in the works for Disney+ in the next year, according to the presentation: Ramping up to adding 500 new vertical clips per day, and introducing creator content in early 2027 A free tier with always-on FAST channels and content sampling 4K livestreaming for the Super Bowl Fully unifying Disney+ and Hulu into one app Inside Disney's streaming priorities Like other Hollywood giants, Disney is betting on short videos to boost engagement and attract younger viewers hooked on YouTube, Instagram, and TikTok. The Mouse House plans to ramp up to adding 500 vertical clips per day on its streamer by the end of next quarter, which concludes in early April. The effort is starting this quarter with a goal of about 150 clips a day, the slide deck said. Disney is planning to add \"new content types every quarter,\" the presentation said. These include clips of sports, news, and short-", "date_str": "2026-11-09T17:54:59+00:00", "hash": "dec56dbd73249002", "title_fa": "یک ارائه داخلی دیزنی اولویت های اصلی پخش خود را از محتوای سازنده گرفته تا سطح رایگان را نشان می دهد", "summary_fa": "دیزنی به کارمندان فناوری گفت که چگونه در حال برنامه ریزی برای بهبود سرویس استریم خود در سال آینده است. Bernd Weißbrod/تصویر اتحاد از طریق Getty Images. Slaven Vlasic/Getty Images مدیران فناوری دیزنی فهرستی از اولویت‌های استریم برای سال آینده را در تالار شهر رونمایی کردند. خانه موش در حال برنامه ریزی برای اضافه کردن محتوای سازنده به دیزنی پلاس است و در حال کار بر روی یک پیشنهاد رایگان است. یک ارائه فاش شده، دید واضحی از چشم انداز استریم مدیر عامل جاش دامارو ارائه می دهد. بیزینس اینسایدر دریافته است که دیزنی برنامه هایی برای ایجاد تغییرات بزرگ در پخش کننده همنام خود دارد. اولویت‌های Disney+ برای سال آینده شامل آپلود کلیپ‌های ویدیویی عمودی بیشتر، افزودن محتوای سازنده، و کار بر روی یک سطح رایگان، بر اساس اسکرین‌شات‌های ارائه داخلی مشاهده شده توسط Business Insider است. رهبران فناوری اواخر هفته گذشته در تالار شهر به کارمندان گفتند که چگونه در حال برنامه ریزی برای افزایش تعامل در دیزنی + هستند. در این جلسه، مدیران اجرایی، از جمله معاون مدیریت محصول دیو لیندسی، استراتژی پخش جریانی دیزنی و اولویت‌های سال مالی 2027 را که از اکتبر آغاز شد، معرفی کردند. در تالار شهر، برخی از کارکنان فناوری نیز مدیریت را برای جزئیات بیشتر در مورد دور بعدی احتمالی اخراج تحت فشار قرار دادند. عرشه اسلاید فاش شده یکی از واضح‌ترین دیدگاه‌ها را از برنامه جاش دامارو مدیر عامل شرکت برای تبدیل شدن دیزنی پلاس به «مرکز دیجیتالی» شرکت ارائه می‌کند، در حالی که سرویس پرچم‌دار آن را با پخش‌کننده‌های پولی، یوتیوب و رسانه‌های اجتماعی رقابتی‌تر می‌کند. به گفته نیلسن، استریمرهای دیزنی در ماه آگوست 4.8 درصد از بینندگان تلویزیون ایالات متحده را به خود اختصاص دادند - بسیار پس از YouTube با 15.8٪ و Netflix با 7.7٪، اما بیش از دو برابر سهم رقبای Paramount+ و Peacock. طبق این", "image_url": "https://i.insider.com/6aecefea308912814ed716e6?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۱۸ آبان • ۲۱:۲۴"}, {"source": "Business Insider", "title": "A complete timeline of Karlie Kloss and Taylor Swift's friendship", "link": "https://www.businessinsider.com/taylor-swift-karlie-kloss-friendship-relationship-timeline", "summary": "Karlie Kloss and Taylor Swift sit courtside at Madison Square Garden. Jim McIsaac/Getty Images Taylor Swift and Karlie Kloss became inseparable after the 2013 Victoria's Secret Fashion Show. They road-tripped through Big Sur, posed for a joint Vogue cover, and shared sweet posts online. Kloss has denied a falling-out. They were recently seen together for the first time since 2018. The mythic bond between Taylor Swift and Karlie Kloss dates back to 2013, when the musician and the supermodel met backstage at the Victoria's Secret Fashion Show. The pair quickly became inseparable; they road-tripped through Big Sur, posed together for a joint Vogue cover, and frequently shared photos of their adventures on social media. Kloss even had her own bedroom in Swift's New York apartment. However, around 2018, whispers of a schism began to circulate. Although Kloss has maintained that Swift is a \"close friend,\" they weren't seen together for years. When Kloss married Josh Kushner , Swift didn't attend either of their wedding events. Instead, Kloss' guest list included Katy Perry and Scooter Braun , both of whom Swift has feuded with. Below is a comprehensive timeline of their friendship. January 2012: Swift mentions the model in her Vogue cover story Taylor Swift and Karlie Kloss first interacted in 2012. Michael Kovac/Jamie McCarthy/Getty Images While walking around Prabal Gurung's studio during her 2012 Vogue interview , Swift noticed a framed photo of Kloss hanging on the wall. \"I love Karlie Kloss. I want to bake cookies with her!\" she told the interviewer. Kloss, an avid baker who teamed up with Momofuku Milk Bar's Christina Tosi to launch her own line of treats, \"Karlie's Kookies,\" in 2012, accepted Swift's invitation the same day the article was published. \"Hey @taylorswift13 love the @voguemagazine cover!\" she wrote in a since-deleted tweet . \"Your kitchen or mine?\" November 13, 2013: They have a playful interaction on the Victoria's Secret Fashion Show runway Taylor Swift and Karlie Kloss at the 2013 Victoria s Secret Fashion Show. Randy Brooke / Getty Images Swift performed her hit single \"I Knew You Were Trouble\" at the 2013 Victoria's Secret Fashion Show. Kloss, the second model to walk during the \"Snow Angels\" portion of the show, pointed at Swift and lip-synced her lyrics as she passed by, stopping again to dance with the musician before exiting the stage. They also held hands while Swift was singing \"My Songs Know What You Did in the Dark\" with Fall Out", "date_str": "2026-11-09T17:44:25+00:00", "hash": "51d0d310ff3107d8", "title_fa": "جدول زمانی کاملی از دوستی کارلی کلوس و تیلور سویفت", "summary_fa": "کارلی کلوس و تیلور سوئیفت در مدیسون اسکوئر گاردن در کنار محوطه می نشینند. جیم مک ایزاک/ گتی ایماژ تیلور سویفت و کارلی کلوس پس از نمایش مد ویکتوریا سیکرت در سال 2013 جدایی ناپذیر شدند. آنها از بیگ سور عبور کردند، برای جلد مشترک Vogue ژست گرفتند و پست های شیرینی را به صورت آنلاین به اشتراک گذاشتند. کلوس درگیری را رد کرده است. آنها اخیرا برای اولین بار از سال 2018 با هم دیده شدند. پیوند اسطوره‌ای بین تیلور سویفت و کارلی کلوس به سال 2013 بازمی‌گردد، زمانی که این نوازنده و سوپرمدل در پشت صحنه نمایش مد ویکتوریا سیکرت با هم آشنا شدند. این جفت به سرعت جدایی ناپذیر شدند. آن‌ها در بیگ سور سفر کردند، با هم برای جلد مشترک Vogue ژست گرفتند، و اغلب عکس‌های ماجراجویی خود را در رسانه‌های اجتماعی به اشتراک گذاشتند. کلوس حتی اتاق خواب خود را در آپارتمان سوئیفت در نیویورک داشت. با این حال، در حدود سال 2018، زمزمه های یک انشقاق شروع به پخش شدن کرد. اگرچه کلوس گفته است که سوئیفت یک \"دوست صمیمی\" است، اما آنها سال ها با هم دیده نشدند. وقتی کلوس با جاش کوشنر ازدواج کرد، سوئیفت در هیچ یک از مراسم عروسی آنها شرکت نکرد. در عوض، لیست مهمانان کلوس شامل کیتی پری و اسکوتر براون بود که سوئیفت با هر دوی آنها دشمنی داشته است. در زیر جدول زمانی جامع دوستی آنها را مشاهده می کنید. ژانویه 2012: سوئیفت در داستان جلد خود در Vogue از مدل یاد می کند که تیلور سوئیفت و کارلی کلوس برای اولین بار در سال 2012 با هم ارتباط برقرار کردند. مایکل کواچ/جیمی مک کارتی/گتی ایماژ هنگام قدم زدن در استودیوی پرابال گورونگ در خلال مصاحبه وی در سال 2012 ووگ، سویفت متوجه عکس قاب شده ای از کلوس شد که روی دیوار آویزان شده بود.", "image_url": "https://i.insider.com/6629712023b29110d302ba7f?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۲۱:۱۴"}, {"source": "Business Insider", "title": "Leaked TikTok org chart shows how execs from China have gained power in its US e-commerce operations", "link": "https://www.businessinsider.com/tiktok-org-chart-reveals-how-us-e-commerce-team-run-2026-11", "summary": "Stephen McCarthy/Sportsfile for Web Summit Qatar via Getty Images; BI TikTok Shop's US operations are primarily run by executives from China, a leaked org chart reveals. The company's shift away from local US leaders has led to some friction, insiders say. ByteDance sold much of its stake in the US division of TikTok, but kept a full grip on its e-commerce business. Earlier this year, the e-commerce team at TikTok announced a policy change that sent some of its sellers into a frenzy. The company told all US merchants they needed to switch to TikTok Shop's in-house fulfillment and shipping program by the end of March. They could no longer send out their products independently and would have to pay TikTok's service fee. The mandate drew backlash, with some sellers threatening to leave the platform, a Shop agency partner said. The company scrapped the proposed policy in February. Company insiders say the incident speaks to how leadership within TikTok Shop in the US has changed over the last few years. TikTok has elevated executives with backgrounds in Chinese e-commerce — many of whom are now based in the US — and shed American e-commerce leaders through layoffs or voluntary exits. TikTok Shop's US operations are now largely led by staffers who were previously or are currently based in China, according to an org chart viewed by Business Insider, conversations with company insiders, and a review of executives' verified LinkedIn accounts. TikTok Shop is ByteDance's bet on social shopping, a new form of e-commerce in which consumers buy products through influencer videos or livestreams. The platform offers everything from phone chargers to houseplants, enlisting content creators to help sell goods in exchange for a commission. The e-commerce platform has gained market share in the US, capturing about 2% of total online retail spend in July, up from about 1.2% a year ago, according to Consumer Edge, a customer-intelligence firm that analyses US credit and debit card transactions. At the same time, the company now has fewer leaders with US e-commerce experience to flag potential issues , more than a dozen current and former staffers said. TikTok Shop's operations team is overseen by Mu Qing, a former e-commerce executive for Douyin, the Chinese version of TikTok. Mu, who goes by Mason, reports to Bob Kang, ByteDance's e-commerce lead. Six out of the seven US product category leaders who report to Mu previously worked in China at ByteDance or other companies. The ", "date_str": "2026-11-09T17:37:39+00:00", "hash": "ec81eb2c436394bc", "title_fa": "نمودار سازمانی TikTok فاش شده نشان می دهد که چگونه مدیران چینی در عملیات تجارت الکترونیک ایالات متحده قدرت کسب کرده اند.", "summary_fa": "استفان مک کارتی/فایل ورزشی برای وب سامیت قطر از طریق گتی ایماژ. یک نمودار سازمانی فاش شده نشان می دهد که عملیات فروشگاه BI TikTok در ایالات متحده عمدتاً توسط مدیرانی از چین اداره می شود. به گفته خودی ها، دور شدن این شرکت از رهبران محلی ایالات متحده منجر به برخی اصطکاک ها شده است. ByteDance بسیاری از سهام خود را در بخش ایالات متحده TikTok فروخت، اما کنترل کامل تجارت الکترونیک خود را حفظ کرد. در اوایل سال جاری، تیم تجارت الکترونیک در TikTok تغییر سیاستی را اعلام کرد که برخی از فروشندگان آن را دچار جنون کرد. این شرکت به همه تاجران آمریکایی گفت که باید تا پایان ماه مارس به برنامه تکمیل و ارسال داخلی TikTok Shop روی بیاورند. آنها دیگر نمی توانند محصولات خود را به طور مستقل ارسال کنند و باید هزینه خدمات TikTok را بپردازند. یکی از شرکای آژانس Shop گفت که این دستور با واکنش هایی روبرو شد و برخی از فروشندگان تهدید کردند که پلت فرم را ترک خواهند کرد. این شرکت در ماه فوریه سیاست پیشنهادی را کنار گذاشت. خودی های شرکت می گویند که این رویداد نشان می دهد که چگونه رهبری در فروشگاه TikTok در ایالات متحده در چند سال گذشته تغییر کرده است. TikTok مدیران با سابقه تجارت الکترونیک چینی را ارتقا داده است - که بسیاری از آنها اکنون در ایالات متحده مستقر هستند - و رهبران تجارت الکترونیک آمریکایی را از طریق اخراج یا خروج داوطلبانه کنار گذاشته است. بر اساس نمودار سازمانی مشاهده شده توسط Business Insider، مکالمات با خودی های شرکت و بررسی حساب های تایید شده لینکدین مدیران، عملیات TikTok Shop در ایالات متحده اکنون عمدتاً توسط کارکنانی هدایت می شود که قبلاً یا در حال حاضر در چین مستقر هستند. TikTok Shop شرط ByteDance در خرید اجتماعی است، شکل جدیدی از", "image_url": "https://i.insider.com/6aeb83149270da3cc66681c8?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["بورس و طلا"], "datetime_fa": "۱۸ آبان • ۲۱:۰۷"}, {"source": "Business Insider", "title": "I started a canned-wine company with my husband instead of getting my MBA. The business has become an extension of our family.", "link": "https://www.businessinsider.com/how-marian-leitner-waldman-built-canned-wine-business-archer-roose-2026-11", "summary": "Marian Leitner-Waldman is the founder and CEO of Archer Roose Wines. George Annan for BI Marian Leitner-Waldman invested her savings to start Archer Roose, a fast-growing canned wine brand. She and her husband worked with Chilean winemakers and a Cornell scientist to perfect their wine. They plan to add more low-ABV options to their portfolio and continue supporting the industry in 2027. This as-told-to essay is based on a conversation with Marian Leitner-Waldman, the 39-year-old founder and CEO of Archer Roose Wines, based in Boston. It has been edited for length and clarity. When I was young, I really wanted to make the world a better place. After graduating with a degree in international studies, I worked at Gavi, the Vaccine Alliance, and later at the Global Partnership for Education, which was based at the World Bank. I'd always had side hustles, and I've always loved wine. My husband, David Waldman, had previously founded his own winery in the Republic of Georgia, but he was no longer involved with it by the time we started our business. I really wanted to answer the question of how to have a glass of wine without opening a bottle. We've turned that answer into Archer Roose Wines, a business that generates eight-figure revenue. George Annan for BI We wanted to break a dynamic in the wine industry While still working at the World Bank in 2013, I found research indicating that packaging and distribution account for a substantial share of wine's carbon footprint. By tackling the format, we would also have an opportunity to lower the carbon footprint. For bottles under $25, you're typically paying more for shipping and packaging than for the wine inside. We set out to flip this dynamic so that when a consumer purchases the product, they're really paying for the wine. We looked at bag-in-box, but cardboard and the bag inside were not recyclable everywhere. It's very hard to enact change on issues like recyclability and waste management. I wanted to leverage the existing infrastructure. Aluminum cans can be recycled repeatedly and are accepted by almost all local recycling programs. What really pushed me over the edge was looking at trends more broadly and seeing more beverage categories expanding into cans. I realized that the consumer had changed, and the emphasis was now on individual serving size and convenience. George Annan for BI I worked on Archer Roose on the side for a while I was constantly pressure-testing the idea because canned wine was still", "date_str": "2026-11-09T17:36:46+00:00", "hash": "8b1f0ca19a4941b6", "title_fa": "من به جای گرفتن MBA، یک شرکت شراب کنسرو شده را با شوهرم راه اندازی کردم. این کسب و کار تبدیل به امتداد خانواده ما شده است.", "summary_fa": "ماریان لایتنر والدمن بنیانگذار و مدیر عامل شراب آرچر رز است. جورج عنان برای BI Marian Leitner-Waldman پس انداز خود را برای راه اندازی Archer Roose، یک برند شراب کنسرو شده با رشد سریع سرمایه گذاری کرد. او و همسرش با شراب سازان شیلیایی و یک دانشمند کرنل کار کردند تا شراب خود را کامل کنند. آنها قصد دارند گزینه های کم ABV بیشتری را به مجموعه خود اضافه کنند و در سال 2027 به حمایت از صنعت ادامه دهند. این مقاله گفته شده بر اساس گفتگو با ماریان لایتنر-والدمن، بنیانگذار و مدیر عامل 39 ساله شرکت آرچر رز واینز مستقر در بوستون است. برای طول و وضوح ویرایش شده است. وقتی جوان بودم، واقعاً می خواستم دنیا را به جای بهتری تبدیل کنم. پس از فارغ التحصیلی در رشته مطالعات بین المللی، در Gavi، اتحاد واکسن، و بعداً در مشارکت جهانی برای آموزش، که در بانک جهانی مستقر بود، کار کردم. من همیشه شلوغی های جانبی داشتم و همیشه عاشق شراب بودم. شوهر من، دیوید والدمن، قبلا کارخانه شراب سازی خود را در جمهوری جورجیا تاسیس کرده بود، اما تا زمانی که کسب و کار خود را شروع کردیم، دیگر با آن درگیر نبود. من واقعاً می خواستم به این سؤال پاسخ دهم که چگونه یک لیوان شراب بدون باز کردن بطری بخوریم؟ ما این پاسخ را به شراب آرچر رز تبدیل کرده‌ایم، تجارتی که درآمد هشت رقمی ایجاد می‌کند. جورج عنان برای BI ما می خواستیم پویایی در صن  چیز یک وظیفه نیست که باید آن را انجام داد.", "summary_fa": "نویسنده گفت که او مجبور شد پس از ترک کار در مورد جاه طلبی خود تجدید نظر کند تا والدین خانه نشین شود. با حسن نیت از Pressley Frevert. من یک روزنامه نگار هستم که تبدیل به مادر خانه نشین شده ام. من همیشه فردی جاه طلب و سخت کوش بوده ام، اما دارم یاد می گیرم که به عنوان یک والدین بسیار متفاوت به نظر می رسد. من یاد می‌گیرم که به سرعت کم کودک نوپا و آنچه در طول مسیر اتفاق می‌افتد، بیش از انجام کارها ارزش بگذارم. من مجبور شدم چهار بار به مربی شنا پیام بدهم تا پسرم برای درس‌ها برنامه‌ریزی کند. سپس، با وجود اینکه او بطور مزمن دیر می‌آمد، گاهی اوقات در یک اطلاعیه کوتاه کنسل می‌شد، و مجبور می‌شد در اواسط تابستان استخر را عوض کند، زیرا HOA او به او گفته بود که از نظر قانونی اجازه آموزش شنا در محله‌اش را ندارد (داستان واقعی) - ما همچنان به آن درس‌ها ادامه دادیم. بالاخره من تعهد دادم؛ قرار بود از طریق آن ببینم. وقتی شغلم را رها کردم تا مادری در خانه شوم، به همان سختی کار می‌کردم که همیشه در دنیای شرکت‌ها کار می‌کردم - اما هیچ‌کس اهمیتی نمی‌داد. من به یک خروجی جدید برای هویت خود به عنوان کسی که کارها را انجام می دادم نیاز داشتم. بنابراین من شروع به هدایت پشتکار خود به دوران کودکی فرزندانم کردم. اما هر چه سن آنها بیشتر می‌شود، بیشتر به این فکر می‌کردم که آیا این راه خروجی مناسبی برای جاه‌طلبی من است؟ هویت قدیمی من به سختی رها شد، من یک دهه قبل از بچه دار شدن در روزنامه نگاری کار می کردم. من هویتی به عنوان یک کارگر سخت‌کوش داشتم و به آن افتخار می‌کردم، حتی وقتی به این معنی بود که از من خواسته شده بود کارهایی انجام دهم،", "image_url": "https://i.insider.com/6aecb912308912814ed71471?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۱۸ آبان • ۱۹:۴۷"}, {"source": "Business Insider", "title": "I made Ina Garten's delicious Thanksgiving biscuits from scratch. They were ready in 30 minutes.", "link": "https://www.businessinsider.com/ina-garten-chive-biscuits-recipe-2026-11", "summary": "I made Ina Garten s chive biscuits, and they re perfect for Thanksgiving. Anneta Konstantinide on, Zandi sees the possibility that war ends soon. though he acknowledged that most of the necessary legislative changes would require Donald Trump to be on board. The second way for Democrats to address affordability is largely dependent on what the current Congress does between now and January, when newly elected members are sworn in. \"If Republicans can pass a budget and raise the Treasury debt limit on their own through reconciliation, Democrats will have less leverage,\" Zandi added. \"But if they fall short, the President will need Democratic votes, and Democrats could use that clout to restore enhanced Affordable Care Act subsidies and reverse cuts to SNAP and Medicaid.\" Zandi said it would be a long shot for Republicans to achieve both of those things before January, giving Democrats an opening to pursue their own agenda when the new Congress convenes in the new year. Voters delivered resounding victories for Democrats in the midterms, driven partially by negative views of the economy and affordability during Donald Trump's second term. Zandi said that incoming lawmakers will have opportu", "date_str": "2026-11-09T16:02:45+00:00", "hash": "5b9dac64d3fd8d5d", "title_fa": "یک اقتصاددان برجسته می گوید دموکرات ها دو اهرم کلیدی برای مقابله با بحران استطاعت در آمریکا دارند.", "summary_fa": "مارک زندی، اقتصاددان، پتانسیل بازگشت به تسهیل اقتصادی برای رهبران جدید دموکرات را می بیند. تصویر 1: روشنی خطی/ بلومبرگ از طریق گتی ایماژ; تصویر 2: جردن ووندرهار/ بلومبرگ از طریق گتی ایماژ مارک زندی می گوید دموکرات های تازه منتخب ابزارهایی برای رسیدگی به بحران استطاعت در اختیار دارند. اقتصاددان مودیز آنالیتیکس پیش بینی نمی کند که فوراً تسکین یابد. اما زندی راهی برای پایان دادن به جنگ ایران و معکوس کردن کاهش هزینه‌ها به مواردی مانند Medicaid می‌بیند. یک سوال بسیار مهم بر سر پیروزی‌های گسترده دموکرات‌ها در انتخابات میان‌دوره‌ای وجود دارد: آنها واقعاً چه کاری می‌توانند برای مقابله با بحران استطاعت انجام دهند که باعث شد آمریکایی‌ها به حزب جمهوری‌خواه روی بیاورند؟ به گفته مارک زندی eds. It also aims to merge the art and film communities. This year, stars including Kylie Jenner, Andrew Garfield , and Nicole Kidman came out to support. And naturally, they all attended in notable looks. These are the best and worst outfits we saw on the red carpet. Anya Taylor-Joy looked like a walking sculpture, which was perfect for the event. Anya Taylor-Joy at the 2026 LACMA Art + Film Gala in Los Angeles. Gilbert Flores/VarietyGetty Images The \"Lucky\" actor's vintage Pierre Cardin gown perfectly blended Hollywood glamour with the whimsy of art. Her sleeveless dress was silver with a lightly beaded floral pattern, which matched her diamond necklace. She also wore a gemstone ring and a ruffled, metallic duster jacket that reached the floor. Paris Hilton over-accessorized, which distracted from her gorgeous gown. Paris Hilton at the 2026 LACMA Art + Film Gala in Los Angeles. Chloe Kern/Getty Images Sparkles are the entrepreneur's signature, so her Jenny Packham gown should have worked. It was sleeveless, mint green, and embellished beautifully with sequins in butterfly and teardrop shapes. Unfortunately, Hilton also wore sequined gloves, layered diamond necklaces, and a thick crystal choker. The latter pieces, as well as Hilton's long, straight hairstyle, were too strong to complement the already powerful gown. Andrew Garfield perfected pinstripes. Andrew Garfield at the 2026 LACMA Art + Film Gala in Los Angeles. Chloe Kern/Getty Images From afar, Garfield appeared to be wearing a standard black tuxedo. Up close, though, you could see the Gucci suit was actually patterned with subtle, all-black pinstripes. \"The Uprising\" actor wore the three-piece set with leather dress shoes and a colorful orchid attached to his lapel. The outfit worked for him in fit, color, and accessories. Tyriq Withers was dressed too casua", "date_str": "2026-11-09T16:00:21+00:00", "hash": "84feef25dace09af", "title_fa": "بهترین و بدترین نگاه ها در گالا هنر + فیلم LACMA 2026", "summar n Huang. Kent Nishimura/Reuters An internal list shows Nvidia CEO Jensen Huang's 36 direct reports. Huang is known for having many direct reports and said he had 55 last year. Huang has previously said that having more direct reports helps with information flow. Editor's note: In November 2026, Nvidia's board announced it was initiating an investigation after recent reporting that CEO Jensen Huang had been the \"target of a foreign intelligence effort.\" He also admitted to having an affair. A spokesperson said that Huang is \"committed to continuing to lead Nvidia as CEO without interruption.\" It's unclear what will happen to his role as a result of this investigation. Huang is known for having more direct reports compared to other tech leaders. Here's what Business Insider previously reported in October 2025 about his org chart. Nvidia CEO Jensen Huang had 36 direct reports as of October 2025, according to an internal list obtained by Business Insider. Nvidia's top leadership team has seen some executive departures, including Jay Puri and Laura Fay, since then, though this list offers a glimpse into the inner circle at the top of the world's most valuable company. Huang is known for having more direct reports compared to other tech leaders. Previously, in an interview at Stanford in March 2024, Huang said he had 55 direct reports, adding that many were paid the same amount. Huang has 36 direct reports as of October 2025, according to an internal list obtained by Business Insider. Nvidia's top leadership team may have seen some executive changes since then, though this list offers a glimpse into the inner circle at the top of the world's most valuable company. Some of the executives reporting to Huang, according to the list, include Ian Buck , the architect behind Nvidia's breakthrough software Compute Unified Device Architecture (CUDA), as well as CTO Michael Kagan and chief scientist Bill Dally. \"The more direct reports the CEO has, the less layers are in the company,\" Huang said at The New York Times DealBook Summit in 2023. \"It allows us to keep information fluid, allows us to make sure that everyone is empowered by information.\" Nvidia's workforce has grown massively in recent years thanks to the AI boom, and Huang's notoriously fierce work ethic has helped shape its hardcore culture . It's unknown whether Huang's smaller fleet of direct reports signals a shift away from the horizontal structure. Tech leaders have varying views on direct", "date_str": "2026-11-09T15:55:52+00:00", "hash": "3b5bef3ea3c64647", "title_fa": "در نمودار سازمانی انویدیا: 36 رهبر را ببینید که تا سال 2025 در با ارزش ترین شرکت جهان به مدیر عامل جنسن هوانگ گزارش داده اند.", "summary_fa": "جنسن هوانگ، مدیرعامل انویدیا. کنت نیشیمورا/رویترز فهرستی داخلی، 36 گزارش مستقیم جنسن هوانگ، مدیرعامل انویدیا را نشان می دهد. هوانگ به خاطر داشتن بسیاری از گزارش های مستقیم معروف است و گفت که سال گذشته 55 گزارش داشت. هوانگ قبلاً گفته بود که داشتن گزارش های مستقیم بیشتر به جریان اطلاعات کمک می کند. یادداشت سردبیر: در نوامبر 2026، هیئت مدیره انویدیا پس از گزارش اخیر مبنی بر اینکه جنسن هوانگ مدیر عامل شرکت \"هدف یک تلاش اطلاعاتی خارجی\" بوده است، اعلام کرد که تحقیقاتی را آغاز کرده است. او همچنین به داشتن رابطه نامشروع اعتراف کرد. یک سخنگوی گفت که هوانگ \"متعهد است بدون وقفه به رهبری انویدیا به عنوان مدیرعامل ادامه دهد.\" مشخص نیست در نتیجه این تحقیقات چه اتفاقی برای نقش او خواهد افتاد. هوانگ به داشتن گزارش های مستقیم بیشتر در مقایسه با سایر رهبران فناوری مشهور است. در اینجا چیزی است که Business Insider قبلاً در اکتبر 2025 در مورد نمودار سازمانی او گزارش کرده بود. بر اساس یک لیست داخلی که توسط Business Insider به دست آمده است، جنسن هوانگ، مدیرعامل انویدیا تا اکتبر 2025، 36 گزارش مستقیم داشته است. تیم رهبری ارشد انویدیا از آن زمان تاکنون شاهد برخی جدایی‌های اجرایی از جمله Jay Puri و Laura Fay بوده است، اگرچه این فهرست نگاهی اجمالی به دایره داخلی در بالای با ارزش‌ترین شرکت جهان دارد. هوانگ به داشتن گزارش های مستقیم بیشتر در مقایسه با سایر رهبران فناوری مشهور است. پیش a.com/space/2026/11/spacex-now-fundamentally-an-infrastructure-company-senior-official-says/", "summary": "For a long time, SpaceX has been synonymous with the development of newer, larger, and ever-more-reusable rockets. But that began to change over the last decade with the introduction of Starlink, and the change has accelerated during the last 18 months as the company has pivoted to data and artificial intelligence. At last week's UP.Summit conference in Florida, the vice president of launch at SpaceX, Kiko Dontchev, offered some of the most revealing comments to date about the company's changing focus, how it is embracing AI, and why the Falcon 9 rocket—which has dominated global launch for a decade and remains the world's preeminent launch vehicle—is firmly on the road to retirement. \"In the last couple years, when I talk about SpaceX, yes, we are a rocket company, but fundamentally we are an infrastructure company at this point,\" Dontchev said. \"We're building infrastructure on the ground and low Earth orbit, soon on the Moon, and obviously eventually Mars.\" Read full article Comments", "date_str": "2026-11-09T15:39:21+00:00", "hash": "f4c731252f8689c1", "title_fa": "یک مقام ارشد می گوید که SpaceX اکنون اساساً یک \"شرکت زیرساخت\" است", "summary_fa": "برای مدت طولانی، SpaceX مترادف با توسعه موشک‌های جدیدتر، بزرگ‌تر و قابل استفاده‌تر بوده است. اما این در دهه گذشته با معرفی Starlink شروع به تغییر کرد و این تغییر در طول 18 ماه گذشته شتاب گرفت زیرا این شرکت روی داده ها و هوش مصنوعی متمرکز شد. در کنفرانس هفته گذشته UP.Summit در فلوریدا، کیکو دونچف، معاون پرتاب در اسپیس ایکس، برخی از افشاکننده‌ترین نظرات تا به امروز را در مورد تغییر تمرکز شرکت، نحوه استقبال از هوش مصنوعی و چرا موشک فالکون 9 - که برای یک دهه بر پرتاب جهانی مسلط بوده و همچنان وسیله نقلیه پرتاب مجدد جهان در جاده پرتاب است، ارائه کرد. دونچف گفت: «در چند سال گذشته، وقتی درباره اسپیس ایکس صحبت می‌کنم، بله، ما یک شرکت موشکی هستیم، اما اساساً در این مرحله یک شرکت زیرساخت هستیم. ما در حال ساخت زیرساخت‌ها بر روی زمین و مدار پایین زمین، به زودی در ماه و در نهایت مریخ هستیم.» خواندن مقاله کامل نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش برای مدت طولانی، SpaceX مترادف با توسعه موشک های جدیدتر، بزرگتر و همیشه قابل استفاده مجدد بوده است. اما این در دهه گذشته با معرفی Starlink شروع به تغییر کرد و این تغییر در طول 18 ماه گذشته شتاب گرفت زیرا این شرکت روی داده ها و هوش مصنوعی متمرکز شد.", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/11/Flight_15_Website_Desktop_1_7111645b6d-1152x648.png", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی"], "datetime_fa": "۱۸ آبان • ۱۹:۰۹"}, {"source": "Ars Technica", "title": "Nvidia CEO's affair becomes a national security problem", "link": "https://arstechnica.com/tech-policy/2026/11/ceo-jensen-huang-admits-affair-as-nvidia-probes-possible-chinese-espionage/", "summary": "Nvidia’s chief executive Jensen Huang has admitted having an affair two days after the FT reported his alleged romantic relationship with a woman the US intelligence community believes was working as a spy for China. Huang revealed the affair in an internal message to employees on Sunday that was obtained by the FT. “I owe my family and all of you an apology,” Huang said in the message. “I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry.” Read full article Comments", "date_str": "2026-11-09T15:23:20+00:00", "hash": "0ad556b1b036ee70", "title_fa": "رابطه مدیر عامل Nvidia به یک مشکل امنیت ملی تبدیل می شود", "summary_fa": "جنسن هوانگ، مدیر اجرایی انویدیا، دو روز پس از آن که FT گزارش داد رابطه عاشقانه او با زنی که جامعه اطلاعاتی ایالات متحده معتقد است به عنوان جاسوس برای چین کار می کرد، به داشتن رابطه نامشروع اعتراف کرد. هوانگ این ماجرا را در یک پیام داخلی به کارمندان روز یکشنبه که توسط FT به دست آمد فاش کرد. هوانگ در این پیام گفت: \"من به خانواده ام و همه شما یک عذر issed one of the year’s most entertaining races, as a combination of a mixed-up starting order, some very fast drivers at the back, and a wet track that dried and then saw rain again resulted in action aplenty. A peculiarity of F1 is that even if you manage to win a championship, there’s no guarantee you’ll be in a position to defend it. Take McLaren’s Lando Norris, who took the crown in 2025 after a nail-biting fight with his teammate Oscar Piastri and Red Bull’s Max Verstappen. Sadly for Lando, McLaren did not start this year in a position to win races, and even with several upgrades, the team has produced a car that is still very tricky to drive. But this weekend in Brazil, Norris demonstrated the form that earned him the number 1. Rain on Saturday during qualifying helped jumble the usual running order. It was heavy enough that drivers used the wet weather tire with deep treads, which usually generates so much spray that visibility disappears and running has to be suspended. But with fewer cars on track in the later knockout qualifying sessions, this was not a problem for once. More disruption came from grid penalties for Verstappen and Ferrari’s Lewis Hamilton, both of whom needed to use extra power unit components outside of the season’s allowance. Read full article Comments", "date_str": "2026-11-09T15:16:31+00:00", "hash": "e76e906942d07e03", "title_fa": "فرمول یک در برزیل: شما باید لاستیک های خود را زنده نگه دارید", "summary_fa": "در ورزش، \"لاستیک مرده\" مسابقه ای است که پس از قطعی شدن نتیجه سری یا قهرمانی انجام می شود. افراد مسئول از این متنفرند*—اگر عنوانی را در دو سوم فصل به پایان برسانید، بینندگان از بین می‌روند، زیرا چیزی در خطر نیست. اما هرکسی که تصمیم گرفت جایزه بزرگ برزیل امسال را در آخر هفته گذشته رد کند، یکی از سرگرم‌کننده‌ترین مسابقات سال را از دست داد، زیرا ترکیبی از نظم شروع مختلط، راننده‌های بسیار سریع در عقب، و پیست مرطوبی که خشک می‌شد و دوباره باران می‌بارید، منجر به اکشن فراوان شد. ویژگی F1 این است که حتی اگر موفق به کسب یک قهرمانی شوید، ه و مجموعه‌ای از مزایا / معایب خود را دارند. استفاده از همه آنها رایگان است، و هنگامی که محصولاتی را که می‌خواهید به آن‌ها توجه کنید", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/10/258010_Black_friday_cyber_monday_CVirginia_shopping2.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "The Verge", "title": "Here are the price-matching policies for Best Buy, Walmart, and others", "link": "https://www.theverge.com/21570383/price-matching-policy-apple-google-microsoft", "summary": "Nothing is more frustrating than buying a new pair of headphones or an OLED TV, only to find out you could have gotten it cheaper somewhere else a few days or weeks later. That’s why, to keep customers happy and prevent them from shopping elsewhere, some retailers offer price-matching policies that promise to match a lower price found elsewhere. That kind of information comes in handy year-round, but it’s especially helpful during the weeks of deals leading up to Black Friday and Cyber Monday. Below are the price-matching policies for several major retailers. A few things to note: First, each retailer has its own set of rules and restrictions. We’ve summarized some of them here, but we recommend visiting the provided links and reading the policies carefully. Second, most retailers that serve as marketplaces for other sellers, including wholesale retailers like Costco, don’t offer protections, and many traditional stores won’t match their prices. Lastly, there are always exceptions to the rules. If you’re looking for a deal on a product and you know it’s available for a lower price elsewhere (or it was previously offered at the same retailer), it never hurts to call or chat with a customer service rep and ask if they’ll match the price. You have nothing to lose but time, and there’s always a chance they may find a loophole or make a special exception. Amazon Amazon doesn’t offer price matching. Full stop. You can contact customer support, but even if you’re an Amazon Prime customer, they likely won’t help. That said, the online retailer does offer a liberal return policy , meaning you can often return an item you purchased from Amazon if it’s available for less elsewhere (or at Amazon). Then, you can just repurchase the product wherever it’s cheapest. Target Target used to let shoppers price match identical items sold by select retailers, including Amazon, but no longer does so. Under its current policy, shoppers can only request a price adjustment if they find an identical qualifying item for less than they paid on Target.com, at their local Target store, or through an eligible Target Circle deal. Target will also price match Target Plus Partner (the retailer’s name for third-party sellers) items if the same Target Plus Partner on Target.com has it for less, or with a Target Circle deal. Price matches can be requested at the time of purchase or within 14 days after purchase. For the 2026 holiday season, Target has extended the aforementioned price-match wi", "date_str": "2026-11-09T15:00:00+00:00", "hash": "2fb3b7089b83e268", "title_fa": "در اینجا خط‌مشی‌های تطبیق قیمت برای Best Buy، Walmart و موارد دیگر آمده است", "summary_fa": "هیچ چیز ناامید کننده تر از خرید یک جفت هدفون جدید یا یک تلویزیون OLED نیست، فقط برای اینکه متوجه شوید چند روز یا چند هفته بعد می توانستید آن را در جای دیگری ارزان تر تهیه کنید. به همین دلیل است که برای راضی نگه داشتن مشتریان و جلوگیری از خرید آن‌ها از جای دیگر، برخی از خرده‌فروشان سیاست‌های تطبیق قیمت را ارائه می‌کنند که قول می‌دهند با قیمت پایین‌تری مطابقت داشته باشند. این نوع اطلاعات در تمام طول سال مفید است، اما به ویژه در هفته های معاملات منتهی به جمعه سیاه و دوشنبه سایبری مفید است. در زیر سیاست‌های تطبیق قیمت برای چندین خرده‌فروش بزرگ آورده شده است. چند نکته قابل توجه: اولاً، هر خرده فروش مجموعه ای از قوانین و محدودیت های خاص خود را دارد. ما برخی از آنها را در اینجا خلاصه کرده ایم، اما توصیه می کنیم از پیوندهای ارائه شده بازدید کنید و خط مشی ها را با دقت بخوانید. دوم، بیشتر خرده‌فروش‌هایی که به عنوان بازار برای فروشندگان دیگر، از جمله خرده‌فروش‌های عمده‌فروشی مانند Costco، خدمات حفاظتی ارائه نمی‌کنند، و بسیاری از فروشگاه‌های سنتی با قیمت‌هایشان مطابقت ندارند. در نهایت، همیشه استثناهایی از قوانین وجود دارد. اگر به دنبال یک معامله برای یک محصول هستید و می‌دانید که در جای دیگری با قیمت پایین‌تری در دسترس است (یا قبلاً در همان خرده‌فروش ارائه شده است)، تماس یا چت با یک نماینده خدمات مشتری و پرسیدن اینکه آیا با قیمت مطابقت دارد یا خیر، ضرری ندارد. شما چیزی برای از دست دادن ندارید جز زمان، و همیشه این احتمال وجود دارد که آنها یک راه گریز پیدا کنند یا استثناء خاصی ایجاد کنند. آمازون تطبیق قیمت را ارائه نمی دهد. توقف کامل می توانید با پشتیبانی مشتری تماس بگیرید، اما حتی اگر مشتری آمازون پرایم باشید، احتمالا کمکی نخواهند کرد. با این", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/11/258010_Black_friday_cyber_monday_CVirginia_BF3.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "The Verge", "title": "Here’s when the Black Friday sales start at Walmart, Target, and other retailers", "link": "https://www.theverge.com/21569881/black-friday-deals-start-time-hours-cyber-monday-stores", "summary": "Black Friday officially kicks off on November 27th, but if you plan to make that the only day you buy gifts this holiday season, you’re missing out. Several prominent retailers, including Best Buy and Walmart, are preparing to roll out their holiday discounts both in-store and online. Best Buy is even offering price protection through the holiday shopping season on select goods, so if you buy early and the same item drops in price, you can get the better deal retroactively. That being said, it’s important to know how every major retailer is handling the shopping event this year, whether you plan to take advantage of the slew of early holiday deals or hold off until the day after Thanksgiving. If you plan to spend some cash, here are the schedules and expectations for Amazon, Walmart, Best Buy, and all the major retailers we know of. Amazon Amazon has yet to announce its full Black Friday playbook, but the online retailer has dropped a few early deals in its so-called Holiday Shop , including steep discounts on Sony’s WH-1000XM6 headphones, the Google Pixel 11 Pro XL , and fitness trackers like the Fitbit Inspire 3 . Just be aware that Amazon does not offer price matching, so price “protection” for many Amazon shoppers means buying the item at the lower price point and returning the original — which, unfortunately, is pretty wasteful. Walmart Like in previous years, Walmart plans to roll out its Black Friday deals in three distinct waves. The first runs from November 12th through November 15th, starting online at 12:01AM ET and in stores at 6AM local time. Walmart Plus members will also get early access to some deals beginning at 12:01AM ET on November 12th, with the sale opening up to everyone at 12:01AM ET on November 13th. Walmart’s official Black Friday sale then kicks off at 12:01AM on Monday, November 23rd, with Walmart Plus members once again getting early access to select deals online. Whatever “hot Deal drops” remain will then be available to non-members at 12:01AM ET on November 24th. Walmart’s in-store Black Friday sale will then kick off at 6AM local time on November 27th. The retailer’s Cyber Monday sale, meanwhile, will kick off online at 12:01AM ET on November 30th and run through December 2nd. The retailer hasn’t shared many deal specifics yet, but did offer a sneak peek in a recent press release promising discounts across a range of categories, including toys, fashion, beauty, and home goods. Best Buy Best Buy officially kicked off its Blac", "date_str": "2026-11-09T15:00:00+00:00", "hash": "8c3391a092db85a1", "title_fa": "در اینجا زمانی است که فروش جمعه سیاه در Walmart، Target و سایر خرده فروشان شروع می شود", "summary_fa": "بلک فرایدی رسماً در 27 نوامبر آغاز می شود، اما اگر قصد دارید این تنها روزی باشد که در این فصل تعطیلات هدیه می خرید، فرصت را از دست می دهید. چندین خرده فروش برجسته، از جمله Best Buy و Walmart، در حال آماده شدن برای ارائه تخفیف های تعطیلات خود در فروشگاه و آنلاین هستند. Best Buy حتی در طول فصل خرید تعطیلات برای کالاهای منتخب محافظت از قیمت را ارائه می‌کند، بنابراین اگر زودتر خرید کنید و همان کالا کاهش یافت، می‌توانید معامله بهتری را به ماسبق دریافت کنید. همانطور که گفته شد، مهم است که بدانید هر خرده‌فروش بزرگ امسال رویداد خرید را چگونه مدیریت می‌کند، چه قصد دارید از انبوه معاملات اولیه تعطیلات استفاده کنید یا تا روز بعد از روز شکرگزاری متوقف شوید. اگر قصد دارید مقداری پول نقد خرج کنید، در اینجا برنامه‌ها و انتظارات برای آمازون، والمارت، بهترین خرید و همه خرده‌فروش‌های بزرگی که می‌شناسیم آمده است. آمازون هنوز کتاب جمعه سیاه کامل خود را اعلام نکرده است، اما این خرده‌فروش آنلاین چند پیشنهاد اولیه را در فروشگاه تعطیلات خود حذف کرده است، از جمله تخفیف‌های شدید روی هدفون‌های WH-1000XM6 سونی، Google Pixel 11 Pro XL و ردیاب‌های تناسب اندام مانند Fitbit Inspire 3. فقط توجه داشته باشید که آمازون تطبیق قیمت را ارائه نمی دهد، بنابراین \"محافظت\" از قیمت برای بسیاری از خریداران آمازون به معنای خرید کالا با قیمت پایین تر و برگرداندن اصل است - که متأسفانه بسیار ضایع کننده است. Walmart مانند سال های گذشته، والمارت قصد دارد معاملات جمعه سیاه خود را در سه موج مجزا عرضه کند. اولین دوره از 12 نوامبر تا 15 نوامبر اجرا می شود، به صورت آنلاین از ساعت 12:01 صبح به وقت شرقی و در فروشگاه ها در ساعت 6 صبح به وقت محلی شروع می شود. اعضای Walmart Plus همچنین دسترسی", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/10/258010_Black_friday_cyber_monday_CVirginia_BF2.jpg?quality=90&strip=all&crop=0%2C10.732984293194%2C100%2C78.534031413613&w=1200", "category": "هوش مصنوعی مولد", "tags": ["Google", "امنیت سایبری"], "datetime_fa": "۱۸ آبان • ۱۸:۳۰"}, {"source": "The Verge", "title": "Here are the shipping and return policies for all the big-name retailers", "link": "https://www.theverge.com/21570161/holiday-shipping-return-policy-apple-google-microsoft-amazon", "summary": "With the holidays quickly appro aching, everyone will soon be on the hunt for gifts and the fastest way to get them. Thankfully, many retailers offer generous shipping policies, with some even providing free two-day shipping or same-day delivery if you’re willing to pay a little extra. And just in case the gift you choose isn’t quite right, many retailers offer extended return policies so your giftee can get something more to their liking. For your convenience, we’ve compiled the current shipping and return policies for all the big-name retailers, from Amazon to Walmart. A few already have holiday policies in place, but we’ll be keeping tabs on them and updating our list accordingly. Hopefully, knowing more about how much leeway you have to make a return will help lessen that inevitable holiday angst (fingers crossed). Amazon Shipping : Same-day delivery is not available on Thanksgiving, Christmas, or New Year’s (it’s also limited on Black Friday). However, Prime members get free same-day delivery on qualifying orders in qualifying ZIP codes provided they meet the “minimum qualifying dollar threshold” ( which varies by location) of eligible items in their cart. One-Day and Two-Day Delivery with no minimum purchase amount required is also available to Prime members for qualifying products. Non-Prime buyers will find shipping options on the order page of each specific product. Returns : As part of its holiday promotional period, Amazon says most items purchased between November 1st and December 31st can be returned until January 31st, 2027. Apple products, however, must be returned by January 15th, 2027. Note that this policy applies to both Prime and non-Prime buyers. Apple Shipping : Apple has yet to provide details on its holiday shipping policy; however, last year, it offered free delivery of in-stock items that hadn’t been engraved by Christmas Eve if you ordered before 9PM ET on December 21st. Apple also offers free next-day or two-hour delivery from local stores in most metro areas for an additional fee, or you can opt to pick up purchases yourself by visiting your local Apple Store. Returns : Apple is offering an extended return period for online orders received between November 6th and December 25th, allowing you to return items until January 8th, 2027. Purchases made after December 25th are generally subject to the usual terms and conditions, and must be returned within 14 calendar days of your initial purchase date. Target Shipping : Target offers", "date_str": "2026-11-09T15:00:00+00:00", "hash": "83d126377a255dab", "title_fa": "در اینجا سیاست های حمل و نقل و بازگشت برای همه خرده فروشان معروف آمده است", "summary_fa": "با نزدیک شدن به تعطیلات، همه به زودی به دنبال هدایا و سریع ترین راه برای دریافت آنها خواهند بود. خوشبختانه، بسیاری از خرده فروشان سیاست های حمل و نقل سخاوتمندانه ای را ارائه می دهند، حتی برخی از آنها ارسال رایگان دو روزه یا تحویل یک روزه را در صورت تمایل به پرداخت کمی بیشتر ارائه می دهند. و فقط در صورتی که هدیه ای که انتخاب می کنید کاملاً مناسب نباشد، بسیاری از خرده فروشان سیاست های بازگشت گسترده ای را ارائه می دهند تا هدیه گیرنده شما بتواند چیزی بیشتر به میل خود دریافت کند. برای راحتی شما، ما سیاست‌های حمل و نقل و بازگشت را برای همه خرده‌فروشان بزرگ، از آمازون تا والمارت، گردآوری کرده‌ایم. برخی از آنها در حال حاضر خط‌مشی‌های تعطیلات را اعمال کرده‌اند، اما ما آن‌ها را بررسی می‌کنیم و فهرست خود را بر این اساس به‌روزرسانی می‌کنیم. امیدواریم دانستن بیشتر در مورد میزان آزادی عملی که برای بازگشت دارید، به کاهش آن اضطراب اجتناب‌ناپذیر تعطیلات (انگشت‌های دست دراز) کمک کند. حمل و نقل آمازون: تحویل همان روز در روز شکرگزاری، کریسمس یا سال نو در دسترس نیست (در جمعه سیاه نیز محدود است). با این حال، اعضای Prime برای سفارش‌های واجد شرایط در کد پستی واجد شرایط، تحویل رایگان همان روز دریافت می‌کنند، مشروط بر اینکه «حدا
