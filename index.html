 years after the first book's release in 2008. In fact, this year, the latest \"Hunger Games\" film (\" Sunrise on the Reaping \") earned $120 million domestically in its opening weekend, nearly tripling the $44 million opening weekend of \" The Ballad of Songbirds and Snakes, \" the fifth film, in 2023. The film series, which began in 2012, kick-started the careers of many of its young stars, including Jennifer Lawrence, Josh Hutcherson, Jack Quaid, and Amandla Stenberg. But not everyone has become an A-lister since leaving Panem. We've ranked the 11 members of the teenage cast of \" The Hunger Games \" based on the projects they've worked on since the series concluded, any award recognition they've received, their social media followings, and more. May the odds be ever in their favor. 11. Jacqueline Emerson Emerson in The Hunger Games and in 2018. Lionsgate; Rachel Murray/Getty Images for Girl Up Jacqueline Emerson played Foxface, one of the tributes from District 5. Foxface had a larger role in the novel than in the film, but Emerson still made an impression with her character's death by accidental poisoning at the end. After \"Hunger Games,\" Emerson appeared in a dystopian film of her own, \"The Last Survivors,\" in 2014. The film garnered positive reviews, but it didn't make much of a financial or cultural impact. Since then, she's been in a few short films that she also produced and directed, a few episodes of \"Wayward Guide for the Untrained Eye\" on YouTube in 2020, and an episode of \"FBI\" in 2021. She also has a music career, with a few singles under her belt, per YouTube . According to IMDb, she's also one of the many voice actors credited in \" Grand Theft Auto VI .\" Emerson, 32, currently has 49,700 followers on Instagram . 10. Willow Shields Shields in The Hunger Games and in 2026. Lionsgate; Jamie McCarthy/Getty Images Willow Shields played Katniss' sister, Pri", "date_str": "2026-11-24T14:32:01+00:00", "hash": "04bcf386ff399c3e", "title_fa": "11 n Windows 11. While Signal cannot guarantee that AI won't have access to your data, there are a few protections now available for those on iOS and Android as well. How to limit AI from reading your Signal chats The main workaround in Signal for now is to restrict screenshots and screen recordings inside the app, though this does not prevent AI agents from potentially grabbing content from other parts of your device. According to Signal's support documents , these protections will now be enabled by default on iOS 27 and Android with the latest versions of the Signal app. Users on iOS 27 can confirm or manually disable screenshot protection via Settings Privacy Block Siri AI . The compromise with this setting is that it also blocks you from taking screenshots of Signal conversations in the app and App Switcher, though you can disable it temporarily for 10 minutes if needed. On Android, Signal automatically engages the \"Screen security\" setting when it detects an AI agent attempting to access the screen. This, too, blocks screenshots inside the app and can be disabled via Settings Privacy App security Screen security . Signal cannot block screenshots on macOS 27. However, users can add Signal to their Excluded Apps list via System Settings Siri , which at least limits proactive access to conversations by Siri AI.", "date_str": "2026-11-24T14:30:00+00:00", "hash": "c37061c9154b4a16", "title_fa": "هوش مصنوعی ممکن است چت های سیگنال خصوصی شما را اسکن کند", "summary_fa": "اگر از Signal استفاده می کنید، احتمالاً حداقل کمی به خصوصی نگه داشتن ارتباط خود اهمیت می دهید تا فقط شما و کسانی که با آنها چت می کنید بتوانید رشته های پیام خود را ببینید. رمزگذاری سرتاسر سیگنال چشمان کنجکاو را از خود دور می کند، اما اگر از هوش مصنوعی عاملی در دستگاه خود استفاده می کنید، ممکن است چت شما آنقدر که فکر می کنید قفل نشود. در یک پست وبلاگ اخیر، مردیث ویتاکر، رئیس سیگنال، تهدید بالقوه دستیاران هوش مصنوعی مانند سیری و جمینی را برای وعده حریم خصوصی پلتفرم بیان کرد. قابلیت‌های سطح سیستم مانند Gemi 2 پیدا کرد، می‌گذرد. از آن روز، شرایط پیرامون مرگ O’Keefe و تحقیقات بعدی، Read را به یکی از تفرقه‌انگیزترین متهمان قتل در کشور تبدیل کرده است. اکنون، یک مستند جدید در حال رسیدگی به پرونده معروف اینترنت و جزئیات پشت صحنه است که مردم نمی دانند. The Trials of Karen Read که توسط دانیل جانسون کاتز کارگردانی شد و در 23 نوامبر اکران شد، سفر Read را از ساکن ناشناس کانتون به یک ستون اصلی جنایت واقعی نشان می دهد. شور و اشتیاق پیرامون محاکمه رید با حساب‌های رسانه‌های اجتماعی که ادعا می‌کردند توطئه پلیس از Read به عنوان قربانی استفاده می‌کرد، پیچیده شد. بزرگ‌ترین افشاگری‌های سریال کمتر بر تعقیب جزییات دفاعی رید تمرکز می‌کنند و بیشتر بر ساختن تصویری از اوکیف متمرکز می‌شوند که خانواده و دوستانش می‌گویند در شور و شوق پرونده رید گم شده است. جانسون کاتس به Tudum نتفلیکس گفت: «همیشه هدف این بود که یک سریال کامل بسازیم، و ما می‌خواستیم سعی کنیم این داستان را از منظرهای دست اول بازگو کنیم. او اضافه کرد که دوستان و خانواده اوکیف فقط با \"مرکز جان [در داستان] صحبت کردند و درد آنها را به آنچه که اکنون به مخاطب جهانی تبدیل شده است یادآوری کردند: [این واقعیت] که آنها یک شخصیت پدری، یک برادر و یک پسر را از دست دادند.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/karen-read-LEAD.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "نتفلیکس"], "datetime_fa": "۳ آذر • ۲۱:۲۹"}, {"source": "Rolling Stone", "title": "Ariana Grande Tour Doc to Show the Process Behind ‘Eternal Sunshine’ and ‘Petal’", "link": "https://www.rollingstone.com/music/music-news/ariana-grande-eternal-sunshine-tour-doc-1235663582/", "summary": "Two-part film, set for December release, will document a behind-the-scenes look at the run-up to the tour, as well as a concert film", "date_str": "2026-11-24T17:58:05+00:00", "hash": "0d1eab067766657e", "title_fa": "Doc تور آریانا گراند برای نشان دادن روند پشت \"خورشید ابدی\" و \"گلبرگ\"", "summary_fa": "فیلم دو قسمتی که برای اکران در دسامبر تنظیم شده است، نگاهی از پشت صحنه در آستانه تور و همچنین یک فیلم کنسرت را مستند خواهد ک  ادعا می تواند طبق قانون کالیفرنیا که در ژانویه اجرایی شد، ادامه یابد. 1، باز کردن یک پنجره احیای دو ساله برای ادعاهای منع شده در مورد سوء استفاده جنسی بزرگسالان علیه مجرمین. بر خلاف قانونی که در زمانی که شومان برای اولین بار از کارتر شکایت کرد، قانون جدید اجازه می دهد که شکایت علیه افراد بدون الزام شاکیان برای ایجاد پوشش یا نام بردن از یک تجارت به عنوان متهم باشد. «ادعای فردی علیه متهم کارتر به خاطر جنایت جنسی، صرف نظر از وجود پنهان کاری صحیح است. قاضی دادگاه عالی شهرستان لس آنجلس، لیزا کی. سپه ویزنفلد، در حکم صادره روز دوشنبه خود نوشت: «مدافعان نمی توانند صرفاً با حمله به اتهامات پنهان بر قضاوت اجمالی پیروز شوند. بر این اساس، یک موضوع قابل محاکمه از واقعیت مادی در مورد اولین علت اقدام [برای جنس جنسی] وجود دارد.» رولینگ استون برای اظهار نظر با وکلای هر دو طرف تماس گرفت، اما روز سه شنبه فوراً پاسخی دریافت نکرد. کارتر با به چالش کشیدن پوشش ادعایی ادعا شده در دعوای حقوقی شومان، به دنبال رد ادعای اتهامات جنسی شومان بود. او در پرونده‌ها استدلال می‌کرد که «کل شکایت او به جز ادعای پنهان‌کاری‌اش منقضی می‌شود» و «هیچ ادعای جنسی قابل قبولی علیه کارتر به صورت انفرادی» بدون ادعای «پوشاندن اساسی» وجود ندارد.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/nick-carter-loses-bid-to-dismiss.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۳ آذر • ۲۱:۲۳"}, {"source": "Variety", "title": "‘One & Only’ Campaign: BOTOX® Cosmetic (onabotulinumtoxinA) Has Been FDA Approved for Over 20 Years", "link": "https://variety.com/2026/biz/lifestyle/botox-cosmetic-one-and-only-campaign-1236683743/", "summary": "Click here for Medication Guide, including Boxed Warning. In a world where trends come and go, there’s one thing that never goes out of style: being authentically yourself. The “One Only” campaign from BOTOX® Cosmetic honors exactly that by showcasing everyday people doing what they love, from work and family life to hobbies and self-expression. The [ ]", "date_str": "2026-11-24T18:00:00+00:00", "hash": "f4 s in his life in Miami, presented by Lexus. The artist talks about the faith and family that inspire him, his beginnings and his journey to becoming “La Voz Favorita.” He also shares how he’s building his new tour, what connecting with fans through streaming means to him, and the legacy he hopes to leave behind. Leila Cobo: Miami, a cultural explosion of diverse rhythms and home to some of the biggest stars of Latin music. I m Leila Cobo, co-director of content at Billboard , and today, behind the wheel of the first Lexus TZ, I explore how music can be born from our values and connect deeply with people, just like Jay Wheeler does, one of my favorite artists, who today invites us to tour the places that marked his story and discover how he became the favorite voice of reggaeton. This place is important to you, right? Jay Wheeler: Very important. The most important place, truly. The reason why I am what I am right now is because of my mom s prayers. She taught me from a very young age there. But now that I m grown, I understand it was worth all the times my mom told me: You have to pray if you want things to go well. And all that is very important, truly. Having God present in my life and in my heart will always be very important. The first time I saw my mom cry because I was doing a performance, I was playing and I saw her sitting over in this corner. She was crying because she saw me playing piano, and it moved her. So, when you cross that threshold, you stop being an artist and become Jay Wheeler, just another parishioner of this church. I think that from the moment I get off the stage or leave the studio, from the moment music is no longer involved, I stop being Jay Wheeler. I said that when I make music, I want to reach people s hearts. So that s why I started making Christian music, romantic music, music that reached the heart, heartbreak music, sad music, music that, when people listened to it, they d say, You helped me, you saved me, but I can t listen to your songs because I have to cry. I wanted to connect with people like that. So, people who know me, of course, now they know me for a bunch of other things I do, like podcasts, streaming, my daughter, my wife, my relationship. But the one who knows me deeply, the number one fan, will tell you: Oh, yeah, Jay Wheeler is the one who sings romantic. Keep watching for more!", "date_str": "2026-11-24T17:49:57+00:00", "hash": "93c43966b153aee6", "title_fa": "جی ویلر فاش می کند که چگونه در حال ساختن میراثی فراتر از موسیقی است | بیلبورد ارائه می کند", "summary_fa": "این محتوای شریک است. لیلا کوبو، مدیر ارشد محتوای بیلبورد، به جی ویلر در برخی از مهمترین مکان‌های زندگی او در میامی می‌پیوندد که توسط Lexus ارائه شده است. این هنرمند در مورد ایمان و خانواده ای که به او الهام می بخشد، شروع و سفرش به سمت تبدیل شدن به \"La Voz Favorita\" صحبت می کند. او همچنین نحوه ساخت تور جدید خود، ارتباط با طرفداران از طریق پخش جریانی برای او و میراثی که امیدوار است از خود به جا بگذارد را به اشتراک می گذارد. لیلا کوبو: میامی، انفجاری فرهنگی با ریتم‌های متنوع و خانه برخی از بزرگترین ستاره‌های موسیقی لاتین. من لیلا کوبو هستم، یکی از کارگردانان محتوا در بیلبورد، و امروز، پشت فرمان اولین Lexus TZ، کشف می‌کنم که چگونه موسیقی می‌تواند از ارزش‌های ما زاده شود و عمیقاً با مردم ارتباط برقرار کند، درست مانند جی ویلر، یکی از هنرمندان مورد علاقه من، که امروز ما را به گشت و گذار در مکان‌هایی دعوت می‌کند که داستان او را مشخص کرده‌اند و کشف می‌کنیم که چگونه به صدای مورد علاقه رگگا تبدیل شد. این مکان برای شما مهم است، درست است؟ جی ویلر: خیلی مهم است. واقعاً مهمترین مکان دلیل اینکه من الان همانی هستم که هستم به خاطر دعای مادرم است. او از دوران کودکی در آنجا به من آموخت. اما حالا که بزرگ شده ام، می فهمم که ارزش تمام دفعاتی را داشت که مادرم به من گفت: اگر می خواهی همه چیز خوب پیش برود، باید دعا کنی. و همه اینها واقعاً بسیار مهم است. حضور خدا در زندگی و در قلب من همیشه بسیار مهم خواهد بود. اولین باری که دیدم مادرم به خاطر اجرا داشتم گریه می‌کرد، داشتم بازی می‌کردم و دیدم او در این گوشه نشسته است. او داشت گریه می کرد چون من را در حال نواختن", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/BB-Presents-Lexus-Jay-Wheeler-1920x1080-V1.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۲۱:۱۹"}, {"source": "Billboard", "title": "Watch Brianna Cameron and Connor Closs Drive the Studio Audience Crazy With a Killer ‘I Will Always Love You’ on ‘The Voice’", "link": "https://www.billboard.com/culture/tv-film/brianna-cameron-connor-closs-i-will-always-love-you-the-voice-1236388832/", "summary": "Covering Dolly Parton s I Will Always Love You is a fool s errand in a world where Whitney Houston s Grammy-winning 1992 version for the soundtrack to The Bodyguard has long been the standard of pop ballad excellence. But you can t win if you don t swing big, so on Monday night s (Nov. 23) The Voice episode dedicated to late country legend Parton, a pair of singers took on the tune written by Dolly and perfected by Whitney in a thrilling duet that poured new life into the familiar pop classic. Related Here s How to Save 50% Off HBO Max Annual Streaming Subscription The Voice Contestant Lillie Kolich Completely Transforms This Britney Spears Top 10 Dance Pop Hit Into a Sultry Seduction: Watch A Guide to the Best Black Friday Streaming Deals: See Platforms, Prices Plans for Less Before the face-off between Team Kelly s Brianna Cameron and Team Adam s Connor Closs, 23-year-old Middletown, N.J. native Closs said singing the iconic tune was terrifying, but that he was up for the challenge. In a rare instance of singers being counseled by two coaches at once — Clarkson assured them that they would quickly find out how much better she was at mentoring than fellow four-time winner Levine — Cameron, 14, and Closs warmed up as the coaches suggested they both take a shot at the song s signature sky-high big note. Cameron began the performance a cappella as a spotlight slowly illuminated her face, with Closs coming in on the back half of the first verse, his falsetto sending the studio audience into hysteria. Surrounded by a flower-covered white picket fence and floral background, the pair took turns singing the verses, occasionally teaming up on key lines and then absolutely soaring on the big finale as they both ripped off heart-stopping high notes. “I mean, it’s so astounding that you can do this at your age, right? And I know you hate hearing that, that’s annoying at this point, but it’s crazy your ability at your age, Levine said to teen Cameron. It’s unbelievable. And it’s crazy Connor that you can do this as a male vocalist. I don’t know a male vocalist that can do what you just do. Clarkson was blown away as well. There’s a weight that comes with this song. It’s a big song. And my God, you two are such incredible vocalists, she said. I would be so shocked if either one of you left. Congratulations to both of you. You just did that on live TV. That’s insane. Following Monday s performances by the top 10, Team Queen s BigCountry and Team Adam s Dakota Cohen were", "date_str": "2026-11-24T17:49:13+00:00", "hash": "332d27196a21f0f7", "title_fa": "تماشای Brianna Cameron و Connor Closs با یک قاتل «I Will Always Love You» تماشاگران استودیو را دیوانه می کنند در «The Voice»", "summary_fa": "پوشش فیلم I Will Always Love You از دالی پارتون در دنیایی که نسخه برنده جایزه گرمی ویتنی هیوستون در سال 1992 برای موسیقی متن فیلم The Bodyguard مدت‌ها استاندارد برتری تصنیف پاپ بوده است، کار احمقانه‌ای است. اما اگر زیاد تکان نخورید، نمی‌توانید برنده شوید، بنابراین در دوشنبه شب (۲۳ نوامبر) در قسمت Voice که به پارتون افسانه فقید کانتری اختصاص داشت، یک جفت خواننده آهنگی را که توسط دالی نوشته شده بود و توسط ویتنی کامل شده بود، در یک دوئت هیجان‌انگیز انتخاب کردند که زندگی جدیدی را در کلاسیک آشنای پاپ ایجاد کرد. در اینجا مربوطه نحوه صرفه جویی 50 درصدی در اشتراک پخش سالانه HBO Max Lillie Kolich شرکت کننده صدا به طور کامل این 10 آهنگ برتر رقص پاپ بریتنی اسپیرز را تبدیل به یک اغوای وحشتناک می کند: راهنمای بهترین پیشنهادهای پخش جریانی جمعه سیاه را تماشا کنید: پلتفرم ها، قیمت ها را ببینید. و تیم آدام کانر کلوس، 23 ساله اهل میدلتاون، کلوس، اهل نیوجرسی، گفت که خواندن این آهنگ نمادین وحشتناک بود، اما او برای این چالش آماده بود. در مورد نادری که خوانندگان توسط دو مربی به طور همزمان مشاوره می‌شوند - کلارکسون به آنها اطمینان داد که به سرعت متوجه خواهند شد که او در مربیگری چقدر بهتر از لوین برنده چهار بار است - کامرون، 14 ساله و کلوس با پیشنهاد مربیان به هر دوی آن‌ها، یک شات از آهنگ فوق‌العاده و نه چندان بلند امضا کردند. کامرون اجرا را به صورت کاپلا آغاز کرد، در حالی که نورافکن به آرامی چهره او را روشن کرد، کلوس در نیمه پشتی بیت اول وارد شد و فالست او تماشاگران استودیو را در هیستری فرو برد. این زوج که توسط یک حصار سفید پوشیده از گل و پس‌زمینه گل احاطه شده بودند، به نوبت آیات را می‌خواندند، گاهی اوقات روی خطوط", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/brianna-cameron-connor-closs-the-voice-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۳ آذر • ۲۱:۱۹"}, {"source": "Billboard", "title": "Sonny Bono’s Widow Makes Pitch to Appeals Court in Cher Royalties Saga: ‘Ex-Wives Are Excluded’", "link": "https://www.billboard.com/pro/cher-sonny-bono-widow-lawsuit-appeals-court/", "summary": "The long-running legal fight between Sonny Bono ’s widow and Cher is still going — and now, Mary Bono is trying to get an appeals court to side with her on royalty splits Mary filed her opening appeal brief on Monday (Nov. 23) in litigation over the publishing royalties from Sonny Cher ’s 1960s catalog, including hits like “I Got You Babe,” “The Beat Goes On” and “Baby Don’t Go.” The duo married in 1967 and divorced in 1978, and Sonny later remarried Mary before dying in a 1998 skiing accident. Related Cher Spent $1M in Legal Bills Fighting Sonny Bono s Widow. A Judge Says She Must Pay It Herself Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Rod Wave Indicted on Drug Gun Charges for Items Allegedly Found in Car After Speeding Stop The divorce settlement between Sonny Cher promised a 50-50 split of composition royalties left over after Sonny’s publishers collected a 30% share. But Mary began asserting in 2021 that she could stop paying Cher entirely under copyright law’s termination right, which allows intellectual property transfers to be voided after a decades-long period has elapsed. After years of litigation, a federal judge sided with Cher in 2024 by finding that copyright termination could not apply to the royalties in a divorce agreement, which is essentially just a financial contract. Mary is now telling the Ninth Circuit Court of Appeals that this ruling was incorrect and “creates chaos regarding ownership interests of heirs.” Mary’s appellate brief, obtained by Billboard , argues that Sonny Cher’s divorce settlement was premised on a copyright interest that no longer exists — that is, the 70% that was left after the publishers’ share. Her lawyers say that after Mary served termination notices on a group of publishers in 2016 — clawing back a 30% royalty share now controlled by major publishers including Warner Chappell Music and Universal Music Publishing Group — Sonny’s heirs obtained a brand new copyright that is theirs “free and clear, unencumbered by any prior agreement made by Sonny.” “Congress spelled out the beneficiaries of termination rights: authors and, if the author has died, the author’s surviving spouse and the author’s children,” reads the brief. “Notably, third parties and ex-wives are excluded. As the legislative history makes clear, the rights covered by a termination revert solely to the author or his or her statutory heirs.” Mary wants the Ninth Circuit to rule that the entirety of S", "date_str": "2026-11-24T17:43:39+00:00", "hash": "e1ef97177d2d544c", "title_fa": "بیوه سانی بونو در حماسه سلطنتی Cher به دادگاه استیناف می‌رود: «همسران سابق مستثنی هستند»", "summary_fa": "دعوای حقوقی طولانی مدت بین بیوه سانی بونو و چر هنوز ادامه دارد - و اکنون، مری بونو در تلاش است تا دادگاه تجدیدنظر را وادار کند که با او در مورد انشعاب های حق امتیازی طرف شود. Beat Goes On و \"Baby Don't Go.\" این دو در سال 1967 ازدواج کردند و در سال 1978 طلاق گرفتند و سانی بعداً قبل از مرگ در یک تصادف اسکی در سال 1998 با مری ازدواج کرد. شر 1 میلیون دلاری برای مبارزه با بیوه سانی بونو خرج کرد. یک قاضی می گوید که باید خودش آن را بپردازد کریس براون موافقت می کند که فعلاً حمایت از کودک را افزایش دهد تا دیاموند در مبارزه تلخ حضانت را از دست بدهد. 30 درصد سهم اما مری در سال 2021 شروع به ادعا کرد که می تواند به طور کامل پرداخت به چر را بر اساس حق فسخ قانون کپی رایت، که اجازه می دهد انتقال مالکیت معنوی پس از سپری شدن یک دوره چند دهه باطل شود، متوقف کند. پس از سال‌ها دعوای قضایی، یک قاضی فدرال در سال 2024 با دریافت این که فسخ حق نسخه‌برداری نمی‌تواند برای حق امتیاز توافقنامه طلاق، که اساساً فقط یک قرارداد مالی است، از شر حمایت کند. مری اکنون به دادگاه تجدیدنظر ناحیه نهم می گوید که این حکم نادرست است و \"در مورد منافع مالکیت وراث ایجاد هرج و مرج می کند.\" گزارش استیناف مری که توسط بیلبورد به دست آمده است، استدلال می‌کند که توافقنامه طلاق سانی چر بر اساس حق نسخه‌برداری است که دیگر وجود ندارد - یعنی 70 درصدی که پس از سهم ناشران باقی مانده است. وکلای او می گویند که پس از اینکه مری در سال 2016 اخطارهای فسخ را برای گروهی از ناشران ارائه کرد - پس گرفتن سهم حق امتیاز 30 درصدی که اکنون توسط ناشران", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P115XB6D-e1795541288728.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۲۱:۱۳"}, {"source": "Billboard", "title": "U2, ATEEZ, Ella Langley & More: Highlights of This Week’s Billboard Charts", "link": "https://www.billboard.com/lists/u2-ateez-ella-langley-chart-highlights-november-28-2026/", "summary": "Tuesday is new Billboard chart day each week! As all charts update each Tuesday, here’s a look at highlights of the latest rankings, dated Nov. 28 and reflecting the Nov. 13-19 measurement week, according to data tracker Luminate. Among this week’s chart stars are ATEEZ , U2 , Ella Langley , Mariah Carey and Wham! ATEEZ and U2 reflect high-profile groups that have hit the Billboard 200 album chart’s upper reaches since earlier this decade and the 1980s, respectively. ATEEZ earns its fourth No. 1 on the list with the debut of GOLDEN HOUR : Part.6 . The act first led in December 2023 with THE WORLD EP.FIN: WILL . Related ATEEZ Earn Fourth No. 1 on Billboard 200 With ‘GOLDEN HOUR : Part.6’ Meanwhile, U2 debuts at No. 4 on the Billboard 200 with Carnaval de Luz . The band notches its 14th top 10 set, dating to the No. 7 launch of The Joshua Tree (the first of U2’s eight leaders) on the April 4, 1987, chart. The albums above it that week? Six other classics, from No. 1 on down: Beastie Boys’ Licensed to Ill , Bon Jovi’s Slippery When Wet , Paul Simon’s Graceland , Bruce Hornsby the Range’s The Way It Is , Janet Jackson’s Control and Genesis’ Invisible Touch . U2 adds its second Billboard 200 top 10 this decade, following Songs of Surrender (No. 5, 2023). Upon that LP’s arrival, U2 became just the fourth group to have scored newly charted top 10s in the 1980s, ‘90s, 2000s, ‘10s and ‘20s, joining AC/DC, Def Leppard and Metallica. Read on for more key highlights from this week’s Billboard charts below. For a deeper dive into all of the above and more, go to Billboard ’s Chart Beat hub, sign up for the weekly Chart Beat newsletter , among other e-blasts, and browse the full menu of Billboard ’s charts, which refresh every Tuesday (and each Wednesday during holiday weeks).", "date_str": "2026-11-24T17:42:18+00:00", "hash": "da496d1eadffb4a0", "title_fa": "U2، ATEEZ، Ella Langley و موارد دیگر: نکات برجسته نمودارهای بیلبورد این هفته", "summary_fa": "سه شنبه هر هفته روز جدید نمودار بیلبورد است! طبق گزارش ردیاب داده Luminate، از آنجایی که همه نمودارها هر سه شنبه به روز می شوند، در اینجا نگاهی به نکات مهم آخرین رتبه بندی، در تاریخ 28 نوامبر و منعکس کننده هفته اندازه گیری 13 تا 19 نوامبر است. از ستارگان این هفته می توان به ATEEZ، U2، Ella Langley، Mariah Carey و Wham اشاره کرد. ATEEZ و U2 منعکس کننده گروه های مطرحی هستند که به ترتیب از اوایل این دهه و دهه 1980 به بالاترین حد در جدول آلبوم بیلبورد 200 رسیده اند. ATEEZ چهارمین شماره خود را کسب کرد. 1 در لیست با اولین GOLDEN HOUR : Part.6 . این عمل برای اولین بار در دسامبر 2023 با THE WORLD EP.FIN: WILL اجرا شد. در همین حال، U2 با Carnaval de Luz در رتبه 4 بیلبورد 200 قرار گرفت. این گروه چهاردهمین ست 10 برتر خود را به دست می‌آورد که مربوط به پرتاب شماره 7 The Joshua Tree (اولین نفر از هشت رهبر U2) در جدول 4 آوریل 1987 است. آلبوم های بالای آن آن هفته؟ شش کلاسیک دیگر، از شماره 1 به پایین: Beastie Boys Licensed to Ill، Bon Jovi's Slippery When Wet، Paul Simon's Graceland، Bruce Hornsby the Range's The Way It Is، Janet Jackson's Control و Genesis's Invisible Touch. U2 دومین 10 بیلبورد 200 برتر خود را در این دهه، پس از Songs of Surrender (شماره 5، 2023) اضافه کرد. پس از ورود LP، U2 تنها چهارمین گروهی شد که در دهه های 1980، 90، 2000، 10 و 20 به AC/DC، Def Leppard و Metallica پیوسته است که توانسته است رتبه های 10 برتر جدول را کسب کند. برای اطلاعات مهم بیشتر از نمودارهای بیلبورد این هفته در زیر بخوانید. «انتخاب تگزاس» برای بیست و نهمین هفته رکورددار در صدر 100 بیلبورد", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/1192664338-e1795536690338.jpg?w=1024", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۲۱:۱۲"}, {"source": "Rolling Stone", "title": "See Noah Kahan Captivate Audiences With Extended ‘Orbiter’", "link": "https://www.rollingstone.com/music/music-news/noah-kahan-live-from-the-great-divide-album-1235663532/", "summary": "Song features on upcoming Live From the Great Divide album, which arrives just in time for the holidays", "date_str": "2026-11-24T17:42:34+00:00", "hash": "fd21b110efc18a3f", "title_fa": "نوح کاهان را با «Orbiter» گسترده تماشاگران را مجذوب خود کنید", "summary_fa": "ویژگی‌های آهنگ در آلبوم آتی Live From the Great Divide، که درست به موقع برای تعطیلات می‌رسد، ویدیوی نوح کاهان در حال اجرای Orbiter در ایستگاه کوئینز نشان می‌دهد که او در حال کندن آرپژ از یک گیتار آکوستیک در حالی که آواز می‌خواند خسته به نظر می‌رسد و احساس سفتی و ناهنجاری می‌دهد. اما اینها فقط اشعار هستند، زیرا او بیشتر از این که می تواند در استادیوم های هوادارانی که همراه با اشعار او می خوانند و چراغ های تلفن خود را به سمت او می زنند، بخواند، شگفت زده به نظر می رسد. او حتی از هواداری که از پایین بر روی او منفجر می‌شود ناراحت به نظر نمی‌رسد، به‌جای اینکه نوارهای موی بلندی مانند Whitesnake ترجیح می‌دادند. کافی است آستین ها و پایین پیراهنش را به هم بزنیم اما حواسش را از احساسات خام ترانه پرت نکنیم. این ویدیو از انتشار یک آلبوم زنده جدید به نام Live From the Great Divide در 11 دسامبر منتشر می شود. این آلبوم 16 آهنگ کاهان را در تور جهانی Great Divide که از آلبوم اخیر او به نام The Great Divide پشتیبانی می‌کند، جمع‌آوری می‌کند. این به عنوان یادگاری از خواننده-ترانه سراهای ستاره ساز سال قبل از شروع تور جهانی Last of the Bugs در سال آینده خواهد بود. تاریخ آمریکای شمالی برای آن اجرا در آوریل آغاز می شود. بسیاری از آنها قبلا فروخته شده اند. کنسرت کوئینز که کاهان نسخه توسعه یافته Orbiter را ضبط کرد تقریباً اتفاق نیفتاد. این هنرمند دو شب را در سیتی فیلد رزرو کرده بود اما مجبور شد شب اول را به دلیل باران، رعد و برق شدید و باد شدید لغو کند. کاهان در بیانیه ای نوشت: ما هر کاری که بتوانیم انجام خواهیم داد تا برگردیم و این موضوع را درست کنیم. از صدای ضبط، تحویل داد. داستان‌های پرطرفدار", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/noah-kahan-live-album-LEAD.jpg?w=1600&#038;h=900&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۲۱:۱۲"}, {"source": "Variety", "title": "‘You Can See Everything’ Gets Digital Release", "link": "https://variety.com/2026/shopping/news/you-can-see-everything-digital-release-stream-online-1236957044/", "summary": "Nathan Fielder and Lance Oppenheim&#x2019;s &#x201C;You Can See Everything,&#x201D; the Elizabeth Holmes documentary that became one of the year&#x2019;s most unlikely box office(and potential awards season) sensations, is now available to watch at home. The A24 film arrived on digital platforms Tuesday morning, just over a month after its theatrical debut. It&#x2019;s available to purchase [ ]", "date_str": "2026-11-24T16:36:55+00:00", "hash": "759e40e4b74ca8ce", "title_fa": "«شما می توانید همه چیز را ببینید» به صورت دیجیتالی منتشر می شود", "summary_fa": "«شما می‌توانید همه چیز را ببینید» ساخته ناتان فیلدر و لنس اوپنهایم، مستند الیزابت هولمز که به یکی از بعیدترین فیلم‌های باکس آفیس (و فصل جوایز احتمالی) سال تبدیل شد، اکنون برای تماشای خانه در دسترس است. فیلم A24 صبح سه‌شنبه، کمی بیش از یک ماه پس از اولین نمایشش، روی پلت‌فرم‌های دیجیتال وارد شد. برای خرید در دسترس است [ ] اگر محصول یا خدماتی را که به طور مستقل بازبینی شده را از طریق پیوندی در وب سایت ما خریداری کنید، Variety ممکن است کمیسیون وابسته دریافت کند. این اکران دیجیتالی تنها چند روز پس از آن صورت می‌گیرد که «شما می‌توانید همه چیز را ببینید» از 100 میلیون دلار در باکس آفیس جهانی گذشت، بازگشتی خیره‌کننده برای یک مستند تقریباً سه ساعته که طبق گزارش‌ها هزینه ساخت آن 7 میلیون دلار بوده است. این فیلم با فروش داخلی 93.5 میلیون دلار، آن را در زمره پردرآمدترین مستندهای تاریخ باکس آفیس آمریکای شمالی قرار داده است. این مستند 34 روز قبل از اینکه هولمز، بنیانگذار شرمنده استارتاپ آزمایش خون Theranos، قرار است پس از محکومیت خود به دلیل کلاهبرداری از سرمایه گذاران، به زندان فدرال گزارش شود، پخش می شود. آنچه به عنوان یک پرتره صمیمی از عزیز سابق سیلیکون ولی آغاز می شود، به یک تجربه فیلمسازی سه ساله تبدیل می شود که رابطه بین سوژه های مستند و فیلمسازانشان و تمایزات لغزنده بین اجرا و واقعیت را مورد بررسی قرار می دهد. اوون گلیبرمن از ورایتی در بررسی خود از فیلم، آن را اینگونه توصیف کرد: «نگاهی بی شرمانه، جذاب، واقعیت تلویزیونی که داستانش را به دوگانگی می خورد» و «هر چیزی که یک فیلم عالی باید باشد: تجربه ای برخلاف تجربه ای که قبلاً داشته اید، تجربه ای که شما را فریب می دهد و مجذوب خود می کند، و وقتی آن را ترک می", "image_url": "https://variety.com/wp-content/uploads/2026/09/Screenshot-2026-09-06-at-7.57.52-PM.png?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۳ آذر • ۲۰:۰۶"}, {"source": "Billboard", "title": "‘Grand Theft Auto VI: The Album’ Adds 4 More Songs Following Deluxe Edition", "link": "https://www.billboard.com/music/rb-hip-hop/grand-theft-auto-6-album-adds-more-songs-itunes-exclusive-1236387736/", "summary": "If you haven t heard about Grand Theft Auto yet, chances are you ve probably been living under a rock. A rare monocultural moment in society, the iconic video game s soundtrack is making waves as well. Related ‘It’s Not Just a Song on the Radio’: How Music Became A Main Character In ‘Grand Theft Auto VI’ Every Track From Grand Theft Auto VI: The Album Ranked — Now Including the Deluxe Bonus Tracks Doja Cat Blasts Rockstar Games for Leaving Her Music Out of GTA 6 : I m So F kin Bitter Grand Theft Auto VI: The Album added another four songs, bringing its total tracklist to a robust 61 tracks, with an iTunes exclusive release on Tuesday (Nov. 24). With a mix of electro pop and jazz, GTA has thrown 100 gecs Sensimilla, Favored Nations There Is Only Us, Joe Armon-Jones Hotel Alphonso and Alex Frankel s Playa Rosa into the fold. Released via Atlantic Records and Take-Two, Grand Theft Auto: The Album will look to notch the first No. 1 album on the Billboard 200 in video game soundtrack history. Twenty-four hours after the video game, Grand Theft Auto VI: The Album arrived on Nov. 20, featuring tracks from Dua Lipa, Playboi Carti, Cardi B, JENNIE, Tove Lo, Lana Del Rey, Young Thug and Kali Uchis. GTA didn t waste much time unloading a deluxe edition on Monday (Nov. 23), which recruited Offset, 21 Savage, Pooh Shiesty, The Dare, Anitta, Young Nudy, Quavo, Sexyy Red, Latto, Kodak Black, Denzel Curry, Health and Neil Frances. Billboard s latest cover story, which arrived on Monday, explores a deep dive into the expansive sonic experience and integral connection between Grand Theft Auto VI and music, as the video game boasts more than 800 playable songs across 23 radio stations. “Music is part of the DNA of these games,” Rockstar vice president of music Ivan Pavlovich told Billboard . “The greatest thing about Vice City is that all the kids who played Vice City are now the top artists in the world. Everybody’s always been excited about being part of these games, but this one really is a homecoming to Vice City .", "date_str": "2026-11-24T17:31:42+00:00", "hash": "7261b802ecb4d386", "title_fa": "\"Grand Theft Auto VI: The Album\" 4 آهنگ دیگر را به دنبال نسخه Deluxe اضافه می کند", "summary_fa": "اگر هنوز در مورد Grand Theft Auto نشنیده اید، احتمالاً در زیر سنگ زندگی می کنید. موسیقی متن نمادین بازی ویدیویی، یک لحظه تک فرهنگی نادر در جامعه، موج می زند. مربوط به «این فقط یک آهنگ در رادیو نیست»: چگونه موسیقی به شخصیت اصلی «Grand Theft Auto VI» تبدیل شد. با انتشار انحصاری iTunes در روز سه‌شنبه (24 نوامبر) تعداد کل آهنگ‌های خود را به 61 آهنگ قوی رساند. با ترکیبی از الکترو پاپ و جاز، GTA 100 gecs Sensimilla، Favored Nations There Is Only Us، Joe Armon-Jones Hotel Alphonso و Alex Frankel's Playa Rosa را وارد جمع کرده است. Grand Theft Auto: The Album که از طریق Atlantic Records و Take-Two منتشر شد، به نظر می رسد اولین آلبوم شماره 1 بیلبورد 200 در تاریخ موسیقی متن بازی های ویدیویی باشد. بیست و چهار ساعت پس از بازی ویدیویی، Grand Theft Auto VI: The Album در نوامبر منتشر شد. 20، شامل آهنگ هایی از Dua Lipa، Playboi Carti، Cardi B، JENNIE، Tove Lo، Lana Del Rey، Young Thug و Kali Uchis. GTA زمان زیادی را برای خالی کردن یک نسخه لوکس در روز دوشنبه (23 نوامبر) تلف نکرد که Offset، 21 Savage، Pooh Shiesty، The Dare، Anitta، Young Nudy، Quavo، Sexyy Red، Latto، Kodak Black، Denzel Curry، Health و Neil Frances را به خدمت گرفت. آخرین نسخه جلد بیلبورد، که روز دوشنبه منتشر شد، به بررسی تجربه صوتی گسترده و ارتباط یکپارچه بین Grand Theft Auto VI و موسیقی می پردازد، زیرا این بازی ویدیویی دارای بیش از 800 آهنگ قابل پخش در 23 ایستگاه رادیویی است. ایوان پاولوویچ، معاون موسیقی Rockstar به بیلبورد گفت: «موسیقی بخشی از DNA این بازی‌ها است. \"بزرگترین چیز در مورد Vice City این است که همه بچه هایی که Vice City را بازی کردند اکنون برترین هنرمندان جهان هستند.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/gta-6-album-deluxe-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۲۱:۰۱"}, {"source": "Billboard", "title": "Cardi B Is Ready for Her Global Honor at Billboard Canada Women In Music 2026: ‘I Do Feel Like the Woman of the Year’", "link": "https://www.billboard.com/music/rb-hip-hop/cardi-b-billboard-canada-women-in-music-2026-cover-interview-1236388810/", "summary": "Cardi B is going global. Related Cardi B Shares the Most Relatable Reaction to Her 2027 Grammy Nominations While Half Asleep Cardi B Celebrates Son Grey s 1st Birthday With Over-the-Top Birthday Party: A Time Was Had! Don Toliver Cardi B Dominate Nominations: Rap Grammy Reactions The record-breaking star will accept the Global Woman of the Year award at Billboard Canada Women in Music on Tuesday (Nov. 24). The award recognizes her immeasurable impact on the global stage, including multiple Grammy nominations, a history-making tour and one of the most viral Tiny Desk concerts that NPR has ever dropped. Cardi B photographed in Los Angeles in November 2026. Photos by Ahmad Barber Donté Maurice of AB+DM studio. Styled by Kollin Carter. Makeup by Erika La’ Pearl. Hair by Tokyo Stylez. Nails by Coca Michelle. More importantly for Cardi, the award is a validation of the last year — one of the most eventful in her life and career, which says a lot considering the mark she has made on music and culture every year that she has been in the public eye. “I do feel like Woman of the Year,” Cardi B tells Billboard Canada of the recognition. “But it’s more than just the music. It’s about everything I’ve done this year. Balancing my career and having four kids. It’s a lot.” This year, the Bronx-born rapper went on her first-ever headline tour after releasing her long-awaited sophomore album , Am I The Drama? That 2025 project was her first full-length album in seven years, and she didn’t want to wait to get onstage, even after having her fourth baby just three months earlier. “I pushed the limit on the things that I could do,” she says. “I went on tour three months after I had a baby and I also launched a business. I pushed myself a lot physically and mentally to get where I’m at. I feel really powerful. Very, very powerful.” When Cardi B won Billboard ’s Woman of the Year in 2020, the doubters came out in full force wondering why an artist who had put out just one new song of her own that year deserved the honour. Of course, that song proved to be one of the biggest of her career — “WAP” featuring Megan Thee Stallion — and cemented her cultural, political and commercial impact. But this time, she had to silence her biggest doubter: herself. “It was a lot of pressure,” she admits. “It was a lot of pressure because of the seven years [between albums]. Honestly, it was a lot of pressure because of the critics. And it was just a lot of pressure from myself.” Though she carrie", "date_str": "2026-11-24T17:22:36+00:00", "hash": "a625e88fcaaa642c", "title_fa": "Cardi B برای افتخار جهانی خود در Billboard Canada Women In Music 2026 آماده است: \"من احساس می کنم زن سال هستم\"", "summary_fa": "کاردی بی جهانی می شود. کاردی بی مرتبط ترین واکنش را نسبت به نامزدی های گرمی 2027 خود در حالی که نیمه خواب است به اشتراک می گذارد Cardi B اولین تولد سون گری را با جشن تولد بسیار عالی جشن می گیرد: زمانی بود! Don Toliver Cardi B نامزدهای غالب: واکنش های رپ گرمی ستاره رکوردشکن جایزه بهترین زن جهانی سال را در بیلبورد Canada Women in Music در روز سه شنبه (24 نوامبر) دریافت خواهد کرد. این جایزه تأثیر بی‌شمار او را در صحنه جهانی، از جمله نامزدی‌های متعدد گرمی، تور تاریخی و یکی از ویروسی‌ترین کنسرت‌های Tiny Desk که NPR تا به حال حذف کرده است، به رسمیت می‌شناسد. عکس Cardi B در لس آنجلس در نوامبر 2026. عکس های احمد باربر Donté Maurice از استودیو AB+DM. طراحی شده ت en را می توان در ایستگاه رادیویی پاپ درون بازی، Flash FM، و یک ریمیکس الکترونیکی از آن در مسابقه غروب آفتاب نیز شنید. داستان‌های پرطرفدار بیلی ری سایرس عکس‌هایی از عروسی مایلی به اشتراک می‌گذارد: «زیبا» برای دیدن خانواده «United by Love» خواننده سرود «O Canada» عذرخواهی کرد برای Flub «O Canada» در بازی Leafs-Islanders با افتخار \"Rockin' Around the Christmas Tree\" فقط Vice City نیست که آهنگ را دوست دارد. طرفداران GTA بلافاصله قدردانی خود را از مسیر فراتر از بازی ویدیویی نشان دادند. در روز انتشار بازی، این آهنگ 170094 استریم جهانی را به دست آورد که نشان دهنده جهش 50 درصدی در استریم های تک روزه و جهش شدید 215 درصدی", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/carly-rae-streaming-gta.jpg?crop=79px%2C23px%2C1721px%2C968px&#038;resize=1600%2C900", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۳ آذر • ۲۰:۴۵"}, {"source": "Hollywood Reporter", "title": "“Alarming” Diversity Backtrack Happening In Film and TV Industry In Canada, Report Finds", "link": "https://www.hollywoodreporter.com/business/business-news/diverse-canadian-writers-struggling-1236762221/", "summary": "Despite homegrown hits like 'Heated Rivalry' and 'North of North,' the Writers Guild of Canada warns “key barriers” to future work stand in the way of new diverse members joining its ranks.", "date_str": "2026-11-24T17:20:18+00:00", "hash": "7d83cdd6c44d8876", "title_fa": "گزارش یافته‌ها نشان می‌دهد که تنوع «هشدارکننده» در صنعت فیلم و تلویزیون در کانادا رخ می‌دهد", "summary_fa": "انجمن نویسندگان کانادا با وجود موفقیت‌های داخلی مانند «رقابت داغ» و «شمال شمال» هشدار می‌دهد که «موانع کلیدی» در کار آینده، مانع از پیوستن اعضای متنوع جدید به صفوف آن می‌شود. از آنجایی که صنعت فیلم و تلویزیون کانادا همچنان متعهد به تنوع، برابری و گنجاندن است، و در برابر فشارها برای عقب نشینی در دوران عقب نشینی DEI پس از ترامپ مقاومت می کند، فیلمنامه نویسان متنوع مشتاق اکنون خود را در تلاش برای پیشرفت در یک تجارت رو به کاهش می بینند. انجمن نویسندگان کانادا در آخرین گزارش خود از draising Disaster Relief Benefit", "link": "https://www.billboard.com/music/rb-hip-hop/run-dmc-rev-run-headline-2026-afterglow-miami-fundraiser-core-1236388747/", "summary": "The 2027 Afterglow Miami fundraiser for disaster relief organization CORE (Community Organized Relief Effort) will take place on Dec. 3 at the Delano Miami Beach and feature a headlining set from 2009 Rock Roll Hall of Fame inductee Rev. Run of Run-DMC . The event supporting the organization s disaster relief efforts and long-term recovery initiatives around the world — including responding to devastating L.A. wildfires and Hurricane Melissa in Jamaica in 2025 and this year s twin earthquakes in Venezuela — will also feature sets from DJ Ruckus and DJ/producer Mia Moretti. “Music has a way of bringing people together, and when you put that energy behind an organization like CORE, it becomes bigger than one moment,” said Rev Run in a statement about the group co-founded by actor Sean Penn and Ann Lee. “The people we are raising money for are families who’ve lost everything and are still fighting to rebuild. If I can get a room moving and get some hearts open at the same time, that’s a good night.” The host committee for the event includes Alex Gartenfeld, Ben Pundole, Bobby Kim, Brad Pitt, Craig Robins, Dakota Johnson, Garcelle Beauvais, Jennifer Stockman, Jon Davidson, Lauren Taschen, Leonardo DiCaprio, Marita Stavrou, Mathew Rosengart, Rachael Barrett, Rembrandt Flores, Simon de Pury, Thaddaeus Ropac and Ximena Caminos. This year s gathering will also feature the presentation of the inaugural Global Heritage Impact Award to Haitian-Italian designer and multicultural fashion pioneer Stella Jean. “CORE was born in Haiti, and hosting Afterglow in Miami, home to one of the largest Haitian communities in the country, is a full-circle moment,” said CORE CEO/co-founder Lee. “We are delighted to celebrate Stella Jean for her incredible contributions as a global citizen, and we are grateful to Rev Run, the host committee and our partners for coming together to uplift the communities we support.” The night s programming will also feature a live auction with a curated collection of art, luxury experiences and designer goods. CORE is releasing a limited number of event tickets, click here for details. According to a release, proceeds from Afterglow Miami will directly fund home repairs, provide financial assistance and help fund long-term rebuilding efforts in Jamaica, Haiti, Venezuela, Syria, Sudan and the U.S.", "date_str": "2026-11-24T17:03:45+00:00", "hash": "e99068edc7d2108b", "title_fa": "Run-DMC's Rev Run to Headline 2026 Afterglow Miami Fundraising Disaster Relief Benefit", "summary_fa": "جمع‌آوری کمک مالی 2027 Afterglow Miami برای سازمان امدادرسانی CORE (کوشش امداد سازمان‌یافته جامعه) در 3 دسامبر در ساحل دلانو میامی برگزار می‌شود و مجموعه‌ای از سرفصل‌های 2009 راک‌رول تالار مشاهیر، Rev. Run of Run-DMC را به نمایش می‌گذارد. این رویداد از تلاش‌های سازمان برای امداد رسانی در بلایای طبیعی و ابتکارات بلندمدت بازیابی در سراسر جهان - از جمله پاسخ به ویرانگر L.A. آتش‌سوزی‌های جنگلی و طوفان ملیسا در جامائیکا در سال 2025 و زمین‌لرزه‌های دوقلوی امسال در ونزوئلا - همچنین مجموعه‌هایی از دی‌جی راکوس و دی‌جی/تهیه‌کننده میا مورتی را نمایش خواهند داد. Rev Run در بیانیه‌ای درباره گروهی که توسط شان پن و آن لی تأسیس شده است، گفت: «موسیقی راهی برای گرد هم آوردن افراد دارد، و وقتی این انرژی را پشت سازمانی مانند CORE بگذارید، بیشتر از یک لحظه می‌شود. «افرادی که ما برایشان پول جمع می کنیم خانواده هایی هستند که همه چیزشان را از دست داده اند و هنوز برای بازسازی می جنگند. اگر بتوانم اتاقی را به حرکت درآورم و همزمان چند قلب را باز کنم، شب خوبی است.» کمیته میزبان این رویداد شامل الکس گارتنفلد، بن پاندول، بابی کیم، براد پیت، کریگ رابینز، داکوتا جانسون، گارسل بووایس، جنیفر استاکمن، جان دیویدسون، لورن تاشن، لئوناردو دی کاپریو، ماریتا استاورو، متیو روزنگارت، ریچل دی فلورت، ریچل پوئرت Ropac و Ximena Caminos. گردهمایی امسال همچنین اهدای اولین جایزه جهانی میراث جهانی به طراح هائیتی-ایتالیایی و پیشگام مد چندفرهنگی استلا ژان خواهد بود. لی مدیر عامل/بنیانگذار CORE گفت: \"CORE در هائیتی متولد شد و میزبانی Afterglow در میامی، خانه یکی از بزرگترین جوامع هائیتی در کشور، یک لحظه کامل است.\"", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/1966579213-e1795536925649.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۲۰:۳۳"}, {"source": "Billboard", "title": "Pipe Bueno Inks Global Booking Deal With CMN: ‘They Share My Vision for Growth’", "link": "https://www.billboard.com/pro/pipe-bueno-signs-deal-cardenas-marketing-network-exclusive/", "summary": "Pipe Bueno has signed a global booking deal with Cárdenas Marketing Network (CMN), Billboard can exclusively announce today (Nov. 24). CMN, led by Henry Cárdenas , will oversee the booking of the Colombian artist’s performances worldwide. He now joins a star-studded roster that includes Marc Anthony, Christian Nodal, Greeicy, Ana Gabriel and Grupo Niche, to name a few. Related Inside Música Popular, Colombia s Fast-Growing Craze Chris Brown Agrees to Increase Child Support For Now to Ex Diamond in Bitter Custody Fight Rod Wave Indicted on Drug Gun Charges for Items Allegedly Found in Car After Speeding Stop “Working with CMN is a dream come true,” Bueno, who’s a pioneering force in the música popular or regional Colombian music scene, said in a press statement. “I ve known Henry for many years and have always admired what he has accomplished as a Colombian in the U.S. entertainment industry, working with major artists like Marc Anthony. Today, I have the opportunity to join forces with him and a team that shares my vision for growth. This partnership represents a major step toward taking my career to the next level, transcending the boundaries of Colombian popular music, and establishing myself as an increasingly global artist.” Cárdenas, CEO of CMN, added: “Pipe Bueno is an artist with an established career and tremendous international potential. We re excited to join forces to bring his music and live performances to new stages and continue opening doors for Colombian popular music around the world.” Bueno — one of the leading voices of Colombia’s música popular that fuses ranchera and the string music known as carrilera in Colombia — has become a household name by also experimenting with pop, ballads and urban music. His first Billboard chart entry arrived at the Latin Digital Song Sales and Latin Rhythm Airplay charts with his 2014 song “La Invitación” (featuring Maluma), and in 2024, he signed a deal with Warner Music Latina. Currently, he’s making the rounds with his album Aquí Estoy Yo , home to the viral love song “Señora,” which debuted at No. 7 on the Billboard Colombia Hot 100, earning the week s Hot Shot Debut distinction and generating more than 28 million radio impressions in the South American country. “Pipe has built a solid career in Colombia, and this partnership with CMN reflects a vision we ve been working toward for years: expanding his international presence alongside a team with the experience and reach to make it possible,” shared J", "date_str": "2026-11-24T17:00:00+00:00", "hash": "1bfb353797ba93ab", "title_fa": "Pipe Bueno Inks قرارداد جهانی رزرو با CMN: \"آنها دیدگاه من برای رشد را به اشتراک می گذارند\"", "summary_fa": "Pipe Bueno یک قرارداد جهانی رزرو با شبکه بازاریابی کاردناس (CMN) امضا کرده است، بیلبورد می تواند به طور انحصاری امروز (24 نوامبر) اعلام کند. CMN، به رهبری هنری کاردناس، بر رزرو اجراهای این هنرمند کلمبیایی در سراسر جهان نظارت خواهد کرد. او اکنون به فهرستی پر ستاره می‌پیوندد که شامل مارک آنتونی، کریستین نودال، گریسی، آنا گابریل و گروپو نیچ می‌شود. مرتبط در داخل موسیقی محبوب، شیفتگی سریع رشد کلمبیا، کریس براون موافقت کرد که حمایت از کودکان را افزایش دهد تا در حال حاضر الماس در مبارزه تلخ حضانت را از دست بدهد. در یک بیانیه مطبوعاتی گفته شد که صحنه موسیقی منطقه ای یا محبوب کلمبیا است. \"من سال ها هنری را می شناسم و همیشه کارهایی را که او به عنوان یک کلمبیایی در صنعت سرگرمی ایالات متحده انجام داده و با هنرمندان بزرگی مانند مارک آنتونی انجام داده است، تحسین کرده ام. امروز، من این فرصت را دارم که با او و تیمی که دیدگاه من برای رشد را به اشتراک می گذارد، به نیروها بپیوندم. این همکاری نشان دهنده یک گام بزرگ در جهت ارتقاء حرفه من به سطح بعدی، فراتر رفتن از مرزهای موسیقی عامه پسند کلمبیایی و تثبیت خودم به عنوان یک هنرمند جهانی است. کاردناس، مدیر عامل CMN، افزود: «پایپ بوئنو هنرمندی با حرفه ای تثبیت شده و پتانسیل بین المللی فوق العاده است. ما هیجان‌زده هستیم که به نیروها بپیوندیم تا موسیقی و اجرای زنده او را به مراحل جدیدی برسانیم و همچنان درها را به روی موسیقی محبوب کلمبیایی در سراسر جهان باز کنیم.\" بوئنو - یکی از صداهای پیشرو در موسیقی کلمبیایی که رانچرا و موسیقی زهی معروف به carrilera در کلمبیا را در هم می آمیزد - با آزمایش پاپ، تصنیف و موسیقی شهری به نامی شناخته شده تبدیل شده است.", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/pipe-bueno-cr-jose-devillegas-press-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۲۰:۳۰"}, {"source": "Deadline", "title": "‘Hexed’ Review: Disney’s Bewitching Animation Is A Surprisingly Edgy Y.A. Fantasy", "link": "https://deadline.com/2026/11/hexed-review-disney-fawn-veerasunthorn-jason-hand-1237232517/", "summary": "“Have you ever been persecuted, drowned or burned at the stake?” Conditions for entry to the city of Hexe are pretty rigorous and surprisingly dark in this engaging Disney animation. After playing things safe with 2023’s almost immediately forgettable, formulaic Wish, the studio has somehow turned the tanker round with a surprisingly edgy Y.A. fantasy [ ]", "date_str": "2026-11-24T17:00:00+00:00", "hash": "bfb0bc28d772b0bb", "title_fa": "نقد و بررسی «Hexed»: انیمیشن جادوگر دیزنی یک Y.A. فانتزی", "summary_fa": "آیا تا به حال مورد آزار و اذیت قرار گرفته اید، غرق شده اید یا در آتش سوزانده شده اید؟ شرایط ورود به شهر Hexe در این انیمیشن جذاب دیزنی بسیار سخت و به طرز شگفت انگیزی تاریک است. این استودیو پس از ایمن کردن همه چیز با آرزوی فرمول  زنده «Miss This Christmas» درد دل خود را برای تعطیلات به اشتراک گذاشت", "summary_fa": "این قطعه که هنوز به صورت دیجیتالی منتشر نشده است، در سمت B نسخه وینیل آهنگ \"Take Me Home (4 کریسمس)\" ظاهر می شود. اولیویا رودریگو تصنیف غم انگیز خود را با عنوان \"Miss This Christmas\" برای اولین بار به صورت زنده در کنسرت خود در نشویل دوشنبه شب، 23 نوامبر اجرا کرد. اجرا با آهنگسازی رودریگو شروع شد. آواز و خط لطیف گیتار. از نظر غزلیاتی، «خانم این کریسمس» روبه‌روی «مرا به خانه ببر (4 کریسمس)» است که رودریگو به قلب شکسته‌ای رسیدگی می‌کند و پیامی را به یکی از سابقا منتقل می‌کند: «سال آینده واقعاً متفاوت به نظر می‌رسد/به مردم خود بگویید من این کریسمس را از دست خواهم داد.» رودریگو هنگام معرفی «Miss This Christmas» کمی بیشتر درباره دو تک آهنگ کریسمس خود صحبت کرد. او ترانه \"مرا به خانه ببر\" را به عنوان \"آهنگی واقعاً سرگرم کننده در مورد فانتزی من از داشتن دوست پسری که مرا برای تعطیلات به خانه والدینش می برد\" توصیف کرد. اما رودریگو ادامه داد: «در مد بسیار غمگین برای یک دختر عاشق، یک طرف A بسیار شاد و یک طرف B بسیار غمگین وجود دارد. بنابراین در مورد آهنگ کریسمس هم همینطور است.» داستان‌های پرطرفدار بیلی ری سایرس عکس‌هایی از عروسی مایلی به اشتراک می‌گذارد: «زیبا» برای دیدن خانواده «United by Love» خواننده سرود «O Canada» عذرخواهی کرد برای Flub «O Canada» در بازی Leafs-Islanders رودریگو با افتخار «راکین در اطراف درخت کریسمس» قبل از غرفه دو شبه‌اش در نشویل در بریجستون آرنا، در کنار «سومین مرد رکوردز» جک وایت توقف کرد تا اجرای زنده به استات را در سالن معروف «اتاق آبی» این لیبل قطع کند. این اجرا شامل دو 20 دقیقه بود و شامل یک جلد مناسب از کلاسیک White Stripes، \"Dead Leaves and the Dirty Ground\" بود.", "image_url": "https://www.rollingstone.com/wp-content/uploads/2026/11/GettyImages-2297307220.jpg?w=1600&#038;h=900&#038;crop=1", "category": "موسیقی و هنر", "tags": ["موسیقی"], "datetime_fa": "۳ آذر • ۲۰:۲۳"}, {"source": "Hollywood Reporter", "title": "‘Focker-in-Law’ Filmmaker John Hamburg Talks Ariana Grande’s Comedic Timing and the Actor Who Made Ben Stiller Laugh Hardest on Set", "link": رک را شکست تا آنها را از سرما خارج کند. ویتی پس از آوردن گروه به داخل طوفان برای جستجوی موتورهای سرگردان دیگر به طوفان بازگشت. در طول این مصیبت، ویتی 75 بار به کولاک رفت و به 24 نفر کمک کرد تا در مدرسه سرپناهی پیدا کنند. داستان‌های مرتبط پلت‌فرم پخش و تجارت سلبریتی‌ها TalkShopLive پیش از جمعه سیاه به TikTok گسترش می‌یابد آمازون بسته پخش 30 دلاری شامل Starz، BritBox، AMC+، MGM+ و PBS شاهکار را در یک مکان عرضه می‌کند. آبراهامز گفت: «من قبلاً دو فیلم بلند را در بوفالو کارگردانی کرده‌ام، چیزی که درباره این داستان با من صحبت می‌کند، انسانیت شهر بوفالو و همچنین داستان واقعی شگفت‌انگیز جی ویتی است. \"این یک برداشت 100 درصد واقعی از یک فیلم معجزه‌آمیز تعطیلات کریسمس است.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/GettyImages-2304673392.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۳ آذر • ۲۰:۳۰"}, {"source": "Deadline", "title": "Ariana Grande Sets Peacock Double Play With ‘Eternal Sunshine Tour’ Concert Film & Making-Of Doc", "link": "https://deadline.com/2026/11/ariana-grande-peacock-special-eternal-sunshine-diaries-tour-1237232613/", "summary": "Ariana Grande hit the concert trail this past summer for the first time in seven years, and she is giving fans a close-up look at the show and how she and her team prepped for it. The three-time Grammy winner has set two projects to stream on Peacock this month: documentary The Eternal Sunshine Diaries: [ ]", "date_str": "2026-11-24T16:43:18+00:00", "hash": "e01a5c89fc918444", "title_fa": "آریانا گرانده دوبازی طاووس را با فیلم کنسرت «Eternal Sunshine Tour» و ساخت مستند", "summary_fa": "آریانا گرانده تابستان گذشته برای اولین بار در هفت سال گذشته در مسیر کنسرت قرار گرفت و او از نزدیک تماشای نمایش و نحوه آماده شدن او و تیمش برای آن را به طرفداران ارائه می دهد. برنده سه جایزه گرمی دو پروژه را برای پخش در Peacock در این ماه تنظیم کرده است: مستند The Eternal Sunshine Diaries: [ ] The Making of the Tour در طول 30 روز منتهی به افتتاحیه تور 41 نمایشی گرانده را دنبال می کند و او و تیمش برای زنده کردن این محصول جاه طلبانه مسابقه می دهند. در همان زمان، نامزد اسکار شرور در هشتمین آلبوم استودیویی خود سنگ تمام گذاشته و به مخاطبان دریچه ای صمیمی به فرآیند خلاقیت او در یک لحظه مهم می دهد. در Deadline تماشا کنید مرتبط: «تور آفتاب ابدی» آریانا گرانده در لس‌آنجلس متوقف می‌شود: این کنسرت را از حافظه پاک نکنید - نقد در 12 دسامبر، Peacock تور آفتاب ابدی را نشان می‌دهد که به‌گفته پخش‌کننده، در میان فروپاشی واقعیت او سفر می‌کند، یک موهومی که دوباره کیهانی با من پیوند خورده است. او او تور آفتاب ابدی را به جشنی سینمایی از شفا، ارتباط و موسیقی که زندگی او را تعریف کرده است، تبدیل می کند. پس از اینکه گرانده هفته گذشته عکسی را در شبکه های اجتماعی در کنار کارگردان کریستین برسلائر و سردبیر اندرو مورو منتشر کرد، طرفداران این خواننده قبلاً در حالت آماده باش بودند و مشکوک بودند که او روی چیزی کار می کند. Breslauer با Grande در ویدیوهایی مانند \"Yes, and?\" کار کرد. و «ما نمی‌توانیم دوستان باشیم (منتظر عشقت باش»، در حالی که مورو به خاطر تدوین «رنسانس بیانسه: فیلمی از بیانسه» شناخته می‌شود.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/The-Eternal-Sunshine-Diaries-The-Making-of-the-Tour-photo.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۳ آذر • ۲۰:۱۳"}, {"source": "Hollywood Reporter", "title": "Josh Allen on ‘The Buffalo Miracle,’ and What a Miracle It Would Be to Bring Buffalo a Super Bowl", "link": "https://www.hollywoodreporter.com/movies/movie-features/josh-allen-interview-the-buffalo-miracle-hbo-hollywood-1236757198/", "summary": "The superstar quarterback's production company Out of Pocket is off to a hot start — much like the 9-1 Bills.", "date_str": "2026-11-24T16:45:00+00:00", "hash": "f44b9f6ed099efe3", "title_fa": "جاش آلن در «معجزه بوفالو» و چه معجزه‌ای است که یک سوپر باول برای بوفالو بیاوریم", "summary_fa": "شرکت تولید این ستاره فوق‌العاده، Out of Pocket، شروعی داغ دارد - بسیار شبیه به 9-1 Bills. متن لوگو بوفالو سردترین مکان با گرمترین همسایگان است. این دوگانگی به طور کامل در ": "2026-11-24T16:43:49+00:00", "hash": "9554a0dcc2e3d9cb", "title_fa": "آریانا گرانده، تیم طاووس در تور «آفتاب ابدی» مستند، فیلم کنسرت", "summary_fa": "این استریمر همچنین اولین \"خاطرات آفتاب ابدی: ساخت تور\" را که پس از گرانده در طول 30 روز منتهی به افتتاحیه برنامه پرفروش او انجام شد، ارائه خواهد کرد. آریانا گرانده آماده است تا در یک فیلم مستند و کنسرتی که قرار است ماه آینده در Peacock پخش شود، پشت صحنه بازگشت او به صحنه را به طرفداران ارائه دهد. طاووس روز سه‌شنبه سند آتی، خاطرات آفتاب ابدی را اعلام کرد: ساخت تور، که پس از گرانده در طول 30 روز منتهی به افتتاحیه تور فروخته‌شده‌اش دنبال شد. پخش کننده توضیح می دهد: «در همان زمان، گرانده در هشتمین آلبوم استودیویی خود سنگ تمام می گذارد و به مخاطبان دریچه ای صمیمی به فرآیند خلاقیت او در یک لحظه مهم می دهد. داستان‌های مرتبط فیلم‌ها بررسی فاکر زن-در قانون: آریانا گراند در یک تلویزیون چهارم وخیم دیگر از رابرت دنیرو و بن استیلر برتری می‌گیرد. هشتمین آلبوم استودیویی، گلبرگ، در پایان جولای منتشر شد. طاووس تور را به عنوان توری توصیف می کند که از طریق فروپاشی واقعیت [گراند]، تولد دوباره کیهانی، ارتباط مجدد با فرزند درونش و خاطراتی که او را شکل داده است، سفر می کند. او تور آفتاب ابدی را به جشنی سینمایی از شفا، ارتباط و موسیقی که زندگی او را تعریف کرده است، تبدیل می‌کند.» انتشار فیلم مستند و کنسرت در حالی صورت می‌گیرد که گرانده چهار نامزدی جایزه گرمی برای آهنگ سال، بهترین موزیک ویدیو، بهترین اجرای آواز سنتی پاپ و بهترین آلبوم آواز پاپ را کسب کرده است. گرانده بعداً در چهارمین فیلم ملاقات با والدین، فاکر در قانون، در کنار بن استیلر و رابرت دنیرو که روز چهارشنبه اکران می‌شود، روی پرده بزرگ دیده می‌شود.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/08/Ariana-Grande-getty-H-2026.png?w=1296&#038;h=730&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۳ آذر • ۲۰:۱۳"}, {"source": "Deadline", "title": "Steven Hack Dies: Actor On ‘American Horror Story’, ‘Ratched’, ‘Marvel’s Agent Carter’, ‘General Hospital’; Original Cast Member Of Broadway’s ‘Cats’ Was 68", "link": "https://deadline.com/2026/11/steven-hack-dead-1237232579/", "summary": "Steven Hack, an original member of Broadway s Cats and A Chorus Line who went on to gain numerous credits on stage as well as in such TV series and films as Thor: The Dark World, American Horror Story: 1984, Criminal Minds, Scrubs, Fresh Off The Boat, General Hospital and many more, died November 19 at [ ]", "date_str": "2026-11-24T16:40:16+00:00", "hash": "a09aaa3c74d59ebb", "title_fa": "استیون هک می میرد: بازیگر «داستان ترسناک آمریکایی»، «راچد»، «کارتر مامور مارول»، «بیمارستان عمومی»؛ بازیگر اصلی «گربه‌ها» برادوی 68 ساله بود", "summary_fa": "استیون هک، یکی از اعضای اصلی گربه‌های برادوی و خط کر که در ادامه به کسب اعتبارات متعددی روی صحنه و همچنین در مجموعه‌های تلویزیونی و فیلم‌هایی مانند Thor: The Dark World، American Horror Story: 1984، Criminal Minds، Scrubs، Fresh Off The Boat، General Hospital و بسیاری دیگر روی صحنه رفت. کوروس لاین که در صحنه و همچنین در سریال‌ها و فیلم‌های تلویزیونی مانند ثور: دنیای تاریک، داستان ترسناک آمریکایی: 1984، ذهن‌های جنایتکار، اسکراب‌ها، Fresh Off The Boat، General Hospital و بسیاری دیگر اعتبارات زیادی کسب کرد، در 19 نوامبر در خانه‌اش در لس‌آنجلس در پی یک اتفاق ناگهانی و غیرمنتظره درگذشت. او 68 سال داشت. مرگ او توسط شرکت تئاتر لس آنجلس اینتراکت، که هک یکی از اعضای موسس آن بود، اعلام شد. هک متولد 20 آوریل 1958 در سنت لوئیس بود و سرانجام در مؤسسه هنرهای کالیفرنیا (CalArts) و آکادمی هنرهای دراماتیک آمریکا (A.A.D.A.) تحصیل کرد و اولین کار حرفه ای خود را به عنوان یک رقصنده نوجوان در فیلم Grease در سال 1978 انجام داد، درست قبل از ساخت اولین اولین فیلم Off the Broadway Music Cownolest. در سال 1982، هک به تولید اصلی گربه‌های موزیکال اندرو لوید وبر پیوست، بیش از پنج سال با بازی در نقش‌های Mungojerrie، Carbucketty، Coricopat و دیگران. از آنجا او نقش گرگ را در تور ملی A Chorus Line بر عهده گرفت و زمانی که به برادوی بازگشت برای 3389 امین اجرای برادوی در 29 سپتامبر 1983 به برادوی بازگشت. Watch on Deadline Stack در بسیاری از تولیدات صحنه ای دیگر خارج از برادوی اجرا شد، از جمله تول قبل از جمعه سیاه به TikTok گسترش می‌یابد آمازون بسته پخش 30 دلاری را شامل Starz، BritBox، AMC+، MGM+ و PBS شاهکار در یک مکان «اوه، حلقه‌های قدرت» معرفی می‌کند. فینچر ادامه داد: «به من پیشنهاد شد که ... برای نمایش. این قبل از رفتن به آمازون است، درست است؟ و من می‌گفتم: «به هیچ وجه.» این گسترش منافع شرکت است.» او به بحث درباره اینکه چگونه به جیمز گان حسادت نمی‌کرد و موقعیتی که او به عنوان مدیرعامل استودیو دی‌سی پذیرفته بود، که اخیراً اعلام کرد از آن جدا می‌شود، صحبت کرد. منظورم این است که من به جیمز گان نگاه می‌کنم و فکر می‌کنم، آن‌ها توپ‌های بزرگ‌تری از من هستند. من ... DC و تمام اختلالات آن را نمی پذیرم. دی‌ان‌ای ذاتی آن ناکارآمد است.» فینچر بعداً در گفتگو اضافه کرد: «فکر می‌کنم در حال حاضر محدودیت وحشتناکی در تجارت وجود دارد. می‌دانید، با پارامونت، برادران وارنر... حفاظت از صدای فردی در سینما روز به روز سخت‌تر می‌شود.»", "image_url": "https://variety.com/wp-content/uploads/2026/11/P108WR9E.jpg?crop=0px%2C88px%2C1333px%2C749px&#038;resize=1000%2C563", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۳ آذر • ۱۹:۵۵"}, {"source": "Variety", "title": "Ariana Grande’s ‘Eternal Sunshine Tour’ Concert Movie and Making-of Documentary to Stream on Peacock in December", "link": "https://variety.com/2026/music/news/ariana-grande-teases-eternal-sunshine-tour-movie-peacock-1236956068/", "summary": "After teasing a documentary of her Eternal Sunshine tour on Monday, Ariana Grande made it official on Tuesday: “The Eternal Sunshine Diaries: The Making of the Tour” will premiere Friday, December 11 followed by the concert film The Eternal Sunshine Tour on Saturday, December 12, exclusively on Peacock. The cameras follow Grande during the 30 [ ]", "date_str": "2026-11-24T16:15:00+00:00", "hash": "6797f1e3eb0877eb", "title_fa": "کنسرت فیلم و ساخت مستند «تور آفتاب ابدی» آریانا گرانده برای پخش در دسامبر در طاووس", "summary_fa": "آریانا گرانده پس از پخش فیلم مستندی از تور آفتاب ابدی خود در روز دوشنبه، آن را در روز سه‌شنبه رسمی کرد: «خاطرات آفتاب ابدی: ساخت تور» جمعه 11 د nd, country music fans will be able to enjoy a whole day devoted to Dolly Parton at the country music festival next year. Related Garth Brooks, Riley Green, Zach Top to Headline Stagecoach 2027: A Guaranteed Good Time Stagecoach 2026: 10 Best Performances Kelly Clarkson Recalls Dolly Parton s Beautiful Words to Her 30 Minutes After Her Divorce Was Finalized As revealed Monday (Nov. 23) on The Voice , the first day of the three-day festival will officially be known as Dolly Day. Host Carson Daly explained on the singing competition show that Stagecoach will encourage guests to wear their Parton gear before throwing it over to coach Riley Green, who showed off his tee emblazoned with the late country icon s image. Green will headline next year s Stagecoach, which also features fellow Voice coach Kelly Clarkson on the lineup. She teased, You should show em what the shirt really looks like. As a few ladies in the crowd squealed loudly, Green tastefully lifted his hoodie slightly to show that his Parton shirt had nothing by way of sleeves, giving the crowd a narrow glimpse of his biceps. Stagecoach will take place April 23-25 in Indio, Calif. Garth Brooks and Zach Top are also among the headliners, leading a bill that features HARDY, Turnpike Troubadours, Charley Crockett, Jo Dee Messina, Kaitlin Butts, Willie Nelson Family, Kelly Clarkson, Brothers Osborne, Shaboozey, Dasha, Stella Lefty and more. It ll mark the first year of the country fest since Parton died at the age of 80 in August following a cancer battle. About a month afterward the icon s passing, Clarkson opened up about a meaningful moment she shared with the Queen of Country on the day of the 2023 ACM Awards, where the two women performed a duet of “I Will Always Love You” at the ACM Awards. Just 30 minutes before they went on stage, Clarkson learned that her divorce from ex-husband Brandon Blackstock — who died three years later — had been finalized. “I found out right before that performance,” Clarkson sai inated for a Latin Grammy for best banda album. In 2009, he competed in the same category with the compilation Solamente El Gallo de Oro . Elizalde s legacy has transcended time, with new generations of regional Mexican artists paying homage to him in their concerts and through new versions of his hits. For example, Edgardo Nuñez recorded two tribute albums in his honor this year. Below, find 10 songs from El Gallo de Oro that are essential for any playlist to remember him today, two decades after his passing.", "date_str": "2026-11-24T15:58:30+00:00", "hash": "fa3b0ce153e3a766", "title_fa": "ده آهنگی که 20 سال پس از مرگ والنتین الیزالد به یاد می آوریم", "summary_fa": "این چهارشنبه (25 نوامبر) 20 سال از ترور والنتین الیزالد، خواننده منطقه ای مکزیکی می گذرد که در اوج فعالیت حرفه ای خود، پس از اجرای یک برنامه در رینوسا، در شمال مکزیک، به همراه مدیرش ماریو مندوزا و راننده اش رینالدو بالستروس به ضرب گلوله کشته شدند. تا به امروز، دلایل یا مقصران این جنایت ناشناخته مانده است. در تنها 27 سالگی، خواننده سونورا به لطف شخصیت فرمانده و سبک تفسیری منحصر به فرد خود که با موسیقی باندای Sinaloan همراهی می شد، یک نماد بود. علی‌رغم اینکه الیزالد صدای قدرتمندی نداشت، احساسات را در آهنگ‌هایی مانند «Vete Ya»، «Cómo Me Duele»، «Vencedor» و «Te Quiero Así» که به کلاسیک‌های جاودانه موسیقی مکزیکی تبدیل شده‌اند، ریخت. مربوط به 20 سال بدون والنتین الیزالد: سازندگان مستندهای جدید درباره نماد موزیکال اواخر قتل هنوز حل نشده او بحث می کنند، ال گالو د اورو (خروس طلایی)، همانطور که او را می شناختند، با آهنگ 20 آهنگ 20 خود وارد فهرست 10 برتر جدول ایرپلی منطقه ای مکزیکی بیلبورد شد. پس از مرگ او، آلبوم Vencedor او که ماه‌ها قبل منتشر شده بود، در هر دو آلبوم برتر لاتین و بهترین آلبوم منطقه‌ای مکزیکی به رتبه اول رسید. مجموعه پس از مرگ او Lobo Domesticado که در ژانویه 2007 منتشر شد، در رتبه دوم آلبوم های لاتین برتر قرار گرفت و نامزد دریافت جایزه گرمی لاتین برای بهترین آلبوم باندا شد. در سال 2009، او در همان رده با مجموعه Solamente El Gallo de Oro رقابت کرد. میراث الیزالد از زمان فراتر رفته است و نسل‌های  Nev. @ Allegiant Stadium Oct. 15: Santa Clara, Calif. @ Levi’s Stadium Oct. 18: Vancouver, B.C. @ BC Place U2 Latin America, U.K. and Europe 2027 tour dates (updated with newly added shows): Feb. 23: Mexico City, Mexico @ Estadio G", "date_str": "2026-11-24T15:37:14+00:00", "hash": "2020d58a2aa91127", "title_fa": "U2 تاریخ های آمریکای شمالی را برای بزرگترین نمایش جهان در سال 2027 نشان می دهد", "summary_fa": "U2 تاریخ‌های آمریکای شمالی را برای ارائه‌های Carnaval De Luz 2027: The Greatest Show on Earth World Tour در صبح روز سه‌شنبه (24 نوامبر) اعلام کرد. اولین اجرای نمایش ها در ایالات متحده و کانادا، پس از آن اعلام شد که راکرهای کهنه کار ایرلندی قبلاً برنامه هایی را در آمریکای لاتین، بریتانیا و اروپا که برای سال آینده برنامه ریزی شده بود، نشان دادند. توری که توسط Live Nation تبلیغ می‌شود، گروه را از آگوست به استادیوم‌ها می‌آورد. 13 با نمایش در استادیوم هارد راک در میامی، فلوریدا، پس از توقف در آتلانتا، بالتیمور، رادرفورد شرقی، نیوجرسی، شیکاگو و تورنتو پیش از پایان در 14 سپتامبر در استادیوم ژیلت در فاکسبورو، ماساچوست. این نمایش ها از حمایت استفن ویلسون جونیور برخوردار خواهند بود. تاریخ ها دوباره در 27 سپتامبر در استادیوم AT T در آرلینگتون، تگزاس برگزار می شود، پس از آن در استادیوم SoFi در لس آنجلس (1 تا 2 اکتبر) دوبار پخش می شود و قبل از پایان کار در اکتبر در لاس وگاس و سانتا کلارا، کالیفرنیا متوقف می شود. 18 در BC Place در ونکوور. The War on Drugs در دومین دوره نمایش های آمریکای شمالی پشتیبانی خواهد شد. بلیت‌های تاریخ 2027 آمریکای شمالی ابتدا از طریق پیش‌فروش مشترک U2.com که از 30 نوامبر ساعت 10 صبح آغاز می‌شود، در دسترس خواهد بود. پیش‌فروش ویزا از 2 دسامبر از ساعت 10 صبح تا 10 شب آغاز می‌شود. تا زمانی که ذخایر تمام می شود برای شرکت در پیش فروش هنرمند U2 در 3 دسامبر در ساعت 10 صبح به وقت محلی، تا یکشنبه (29 نوامبر) ساعت 9 شب در اینجا ثبت نام کنید. E.T. هیچ کد لازم نیست بلیت‌های باقی‌مانده در طول فروش عمومی که از 4 دسامبر در ساعت 10 صبح در اینجا آغاز می‌شود، در دسترس خواهند بود. تاریخ های جدید علاوه بر", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2305168466-e1795531854208.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۳ آذر • ۱۹:۰۷"}, {"source": "Billboard", "title": "Rauw Alejandro Is Fulfilling a Childhood Dream With Rockstar Games: ”GTA’ Has Been Part of My Life’", "link": "https://www.billboard.com/music/latin/rauw-alejandro-grand-theft-auto-vi-macacoa-2000-interview-1236388590/", "summary": "Like many adults right now, Rauw Alejandro is probably glued to the couch playing Grand Theft Auto VI . Age is nothing but a number for millennials who grew up reveling in the criminal escapades and explosive gameplay Rockstar Games has offered gamers over the last two decades. Now, Rauw isn t just reliving his childhood; he s part of one of the biggest video games in history, thanks to his inclusion on the blockbuster soundtrack, Grand Theft Auto VI: The Album . “When I heard about the opportunity, I was like, ‘Let’s gooo! We gotta bring that Puerto Rican underground sound to GTA y más que nuevamente regresa a Miami , home of many Latinos,’” he tells Billboard . “Growing up playing GTA , I never imagined I’d get to be part of its soundtrack. As a fan, it’s crazy to experience something like this. GTA has always been about the culture, and now getting to bring my own sound into that world is just insane. It’s a full-circle moment for me, de verdad . Something really special.” Alejandro’s electric track, “Macacoa 2000,” is a love letter to throwback reggaeton that complements the game’s Miami-inspired setting. With music juggernauts including Travis Scott, Cardi B, Morgan Wallen, Dua Lipa and JENNIE also featured on the soundtrack, Alejandro is in great company. He also joined the all-star cast of performers in Miami this past weekend at Grand Theft Auto: The Festival , capping off Rockstar’s massive opening week. Billboard spoke with Alejandro about joining Grand Theft Auto VI: The Album , the making of “Macacoa 2000” and Rockstar’s decision to go global with its music. What’s your first memory of playing Grand Theft Auto as a fan? Wooo Wee! Mano, GTA has been part of my life desde chamaquito , for real. I remember spending hours just driving around, exploring the city, huyéndole a la policía [ Laughs ]. Sometimes I wasn’t even doing the missions, I was just vibing, discovering new things, listening to the music on the radio. GTA is one of those games que tú empiezas a jugar y cuando vienes a ver, se te fue el día entero [ Laughs. ] I have so many memories growing up with it. It’s such a crazy experience, y hasta el día de hoy lo sigo disfrutando igual. ¡Eso nunca pasa de moda! When you recorded “Macacoa 2000,” what kind of energy were you trying to capture, especially knowing the game would return to the Miami-inspired Vice City? With “Macacoa 2000,” I wanted to bring back the roots of reggaeton, ese perreo de antes, but with a fresh twist. Vice City has ", "date_str": "2026-11-24T15:32:50+00:00", "hash": "5932244f9e67f3e0", "title_fa": "راو آلخاندرو با بازی Rockstar رویای کودکی خود را برآورده می کند: \"GTA بخشی از زندگی من بوده است\"", "summary_fa": "مانند بسیاری از بزرگسالان در حال حاضر، Rauw Alejandro احتمالاً به کاناپه چسبیده است و Grand Theft Auto VI را بازی می کند. سن چیزی نیست جز یک عدد برای هزاره‌هایی که با سرگرمی در فرارهای جنایی بزرگ شده‌اند و گیم‌پلی انفجاری که Rockstar Games در دو دهه گذشته به گیمرها ارائه کرده است. حالا، راو فقط دوران کودکی خود را زنده نمی کند. او بخشی از یکی از بزرگ‌ترین بازی‌های ویدیویی تاریخ است، به لطف گنجاندن او در موسیقی متن فیلم پرفروش، Grand Theft Auto VI: The Album. او به بیلبورد می‌گوید: «وقتی در مورد این فرصت شنیدم، گفتم: «بیا برویم! ما باید آن صدای زیرزمینی پورتوریکویی را به GTA y más que nuevamente regresa a Miami، خانه بسیاری از لاتین‌ها بیاوریم». \"وقتی با بازی GTA بزرگ شدم، هرگز تصور نمی کردم که بخشی از موسیقی متن آن باشم. به عنوان یک طرفدار، تجربه چنین چیزی دیوانه کننده است. GTA همیشه در مورد فرهنگ بوده است، و اکنون آوردن صدای خودم به آن دنیا دیوانه کننده است. این یک لحظه کامل برای من است، de verdad. یک چیز واقعاً خاص.» آهنگ برقی آلخاندرو، \"Macacoa 2000\"، نامه ای عاشقانه به رگیتون است که محیط الهام گرفته از میامی بازی را تکمیل می کند. آلخاندرو با حضور غول‌پیکران موسیقی از جمله تراویس اسکات، کاردی بی، مورگان والن، دوآ لیپا و جنی در موسیقی متن فیلم بسیار عالی است. او همچنین آخر هفته گذشته در Grand Theft Auto: The Festival به گروه بازیگران تمام ستاره در میامی پیوست و هفته افتتاحیه عظیم Rockstar را به پایان رساند. بیلبورد با آلخاندرو درباره پیوستن به Grand Theft Auto VI: The Album، ساخت «Macacoa 2000» و تصمیم Rockstar برای جهانی شدن با موسیقی خود صحبت کرد. اولین خاطره شما از بازی Grand Theft Auto به عنوان یک طرفدار چیست؟ وو اوی! Mano، GTA به طور", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/P105V0KG-e1795529504803.jpg?w=1024", "category": "سینما و سریال", "tags": ["سینما", "موسیقی"], "datetime_fa": "۳ آذر • ۱۹:۰۲"}, {"source": "Deadline", "title": "U2 Sets North American Stops On 2027 Stadium Tour; 2 LA Shows Planned", "link": "https://deadline.com/2026/11/u2-2027-north-american-tour-1237232558/", "summary": "U2 will kick off the North American leg of its “Carnaval De Luz Presents: The Greatest Show on Earth World Tour 2027 this August in Miami, the group announced. The 15-stadium tour, with stops in the U.S. and Canada and featuring support acts Stephen Wilson Jr. and the War on Drugs, is currently set to [ ]", "date_str": "2026-11-24T15:37:13+00:00", "hash": "ad9ef54ddcdc2c6d", "title_fa": "U2 در تور ورزشگاه 2027 آمریکای شمالی را متوقف می کند. 2 نمایش LA برنامه ریزی شده است", "summary_fa": "گروه اعلام کرد U2 در اوت امسال در میامی، مرحله آمریکای شمالی خود را آغاز می‌کند: «کارناوال د لوز جونیور: بزرگترین نمایش روی زمین در تور جهانی ۲۰۲۷». میامی: آتلانتا، شرق رادرفورد، تورنتو، و دو نمایش در لس آنجلس. اعلامیه بازی آمریکای شمالی به دنبال مجموعه ای از نمایش های اعلام شده قبلی برای آمریکای لاتین، بریتانیا و اروپا است. این تور در تاریخ 23 فوریه در مکزیکوسیتی آغاز می‌شود و تا ژوئیه ادامه می‌یابد، جایی که بخش اروپایی در 9 ژوئیه در استادیوم سن سیرو میلان به پایان می‌رسد، تنها چند هفته قبل از شروع تاریخ‌های آمریکای شمالی در میامی در 13 اوت. اخبار مرتبط اخبار دالی پارتون پاره دوئت با بونو در نسخه های راک و کانتری منتشر شد. مگان هیلتی، بازیگر برادوی، مراسم رژه شکرگزاری میسی را رهبری می‌کند. اخبار U2 برای اجرای نیمه‌وقت در شب عید شکرگزاری نتفلیکس تنظیم شد. صبح تا ساعت 10 شب، و پس از آن پیش فروش هنرمند در 3 دسامبر در ساعت 10 صبح، فروش عمومی در 4 دسامبر در ساعت 10 صبح در U2.com آغاز خواهد شد. Watch on Deadline Support Act Stephen Wilson Jr از 13 آگوست تا 14 سپتامبر برای U2 در نمایش‌ها باز خواهد شد و The War On Drugs در تاریخ 27 سپتامبر به تور ملحق می‌شود و تا 18 اکتبر ادامه می‌یابد. در اینجا برنامه کامل تور آمریکای شمالی، همانطور که در وب‌سایت U2 آمده است.", "image_url": "https://deadline.com/wp-content/uploads/2026/11/GettyImages-2306379848.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس"], "datetime_fa": "۳ آذر • ۱۹:۰۷"}, {"source": "Billboard", "title": "Almost Monday Scores Second Alternative Airplay No. 1 With ‘No More Regrets’", "link": "https://www.billboard.com/music/chart-beat/almost-monday-no-more-regrets-number-1-alternative-airplay-1236388630/", "summary": "Almost Monday earns its second No. 1 hit on Billboard ’s Alternative Airplay chart (dated Nov. 28) with “No More Regrets.” The song, released May 1 via Hollywood Records, rises two places to the summit thanks to a 5% increase in spins at the format Nov. 13-19, according to Luminate. (The Alternative Airplay chart measures songs’ weekly plays, as tabulated by Mediabase and provided to Billboard by Luminate, on 60 U.S. alternative radio stations.) The San Diego-based trio first led Alternative Airplay in February 2025 with “Can’t Slow Down,” a crossover hit that also reached No. 12 on Adult Pop Airplay and No. 24 on Pop Airplay. “No More Regrets” is Almost Monday’s eighth career Alternative Airplay entry. The group first made the ranking in October 2020 with “Broken People,” which reached No. 26. Earlier this year, “Lost” hit No. 18. The coronation is also a milestone for Hollywood Records, which earns its third Alternative Airplay No. 1. The label first topped the chart in 1998 with Fastball’s “The Way” and returned with “Can’t Slow Down.” In between, it reached the top 10 on hits by Limp Bizkit (“Take a Look Around”); Breaking Benjamin (“So Cold,” “Sooner or Later,” “The Diary of Jane,” “Breath,” “I Will Not Bow,” “Give Me a Sign [Forever and Ever]”); Atreyu (“Falling Down”); and Little Image (“Out of My Mind”). Meanwhile, of the 15 songs that have ruled Alternative Airplay in 2026, “No More Regrets” is the fifth released on an independent label, following The Paradox’s “Get the Message” (Hundred Days); Yellowcard’s “Bedroom Posters,” featuring Good Charlotte (Better Noise); Young the Giant’s “Different Kind of Love” (Concord); and Temper City’s “Self Aware” (Thirty Knots). There were eight indie No. 1s on the chart in 2025 and three in 2024. “No More Regrets” is on Almost Monday’s second studio album, Thank God It’s Almost Monday , released Sept. 9.", "date_str": "2026-11-24T15:28:48+00:00", "hash": "a81667d547fe11c2", "title_fa": "تقریبا دوشنبه دومین پخش آلترناتیو شماره 1 را با \"نه دیگر پشیمان\" می گیرد", "summary_fa": "تقریبا دوشنبه دومین موفقیت خود را در جدول پخش جایگزین بیلبورد (مورخ 28 نوامبر) با \"No More Regrets\" به دست آورد. طبق گزارش Luminate، این آهنگ که در 1 می از طریق هالیوود رکوردز منتشر شد، به لطف افزایش 5 درصدی چرخش در قالب 13 تا 19 نوامبر، دو پله به قله صعود کرد. (نمودار Alternative Airplay پخش هفتگی آهنگ ها را اندازه گیری می کند، همانطور که توسط Mediabase جدول بندی شده و توسط Luminate در 60 U.S. به بیلبورد ارائه شده است. ایستگاه‌های رادیویی جایگزین.) سه نفر مستقر در سن دیگو برای اولین بار در فوریه 2025 با «Can't Slow Down» رهبری Alternative Airplay را بر عهده گرفتند، موفقیتی متقاطع که همچنین به رتبه 12 در پخش پاپ بزرگسالان و شماره 24 در پاپ ایرپلی رسید. «No More Regrets» تقریباً هشتمین فیلم حرفه‌ای در روز دوشنبه است که به صورت Alternative Airplay وارد می‌شود. این گرو       if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();

      });
