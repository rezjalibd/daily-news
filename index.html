سیار بیشتری از داده را با تأخیر پایین‌تر جابه‌جا کند و به همین دلیل، سرویس‌هایی مانند رایانش ابری، تراکنش‌های مالی، ارتباطات دولتی و سرویس‌های آنلاین به شبکه‌ی زیردریایی وابستگی شدیدی دارند. قرارگرفتن زیر اقیانوس به‌معنای مصون‌بودن کابل‌ها نیست کابل‌ها صرفاً رشته‌ای از فیبر نیستند. بخش‌های مختلف آن‌ها برای حفاظت از فیبرهای نوری در برابر فشار، خوردگی و فعالیت‌های انسانی و دریایی طراحی شده‌اند و در طول مسیر نیز تجهیزات تقویت‌کننده‌ی سیگنال قرار می‌گیرد تا داده بتواند مسافت‌های بسیار طولانی را طی کند. ساخت و راه‌اندازی یک کابل زیردریایی جدید نیز می‌تواند بیش از دو سال زمان ببرد."}, {"source": "Zoomit", "title": "خودرو جدید بی‌وای‌دی با طراحی «چهره اژدها» و سنسور لایدار رؤیت شد", "link": "https://www.zoomit.ir/car/467676-next-gen-byd-han-spotted/", "summary": "نسل جدید سدان بی‌وای‌دی هان با حسگر لایدار و پیشرانه‌های برقی و هیبریدی در چین مشاهده شد.", "date_str": "2026-09-23T15:20:00+00:00", "hash": "48c41863ccfb2493", "title_fa": "خودرو جدید بی‌وای‌دی با طراحی «چهره اژدها» و سنسور لایدار رؤیت شد", "summary_fa": "نسل جدید سدان بی‌وای‌دی هان با حسگر لایدار و پیشرانه‌های برقی و هیبریدی در چین مشاهده شد. تبلیغات تصاویر جاسوسی جدید ، نسل سوم سدان بی‌وای‌دی هان را با تجهیزات پیشرفته و زبان طراحی آشنا به نمایش گذاشته‌اند. سدان جدید بی‌وای‌دی با حفظ هویت طراحی «چهره اژدها» و بهره‌مندی از حسگر لایدار روی سقف، قابلیت‌های پیشرفته‌ی رانندگی خودکار را ارائه خواهد داد. خودروی مورد بحث با قیمت پایه‌ی حدود ۲۰۰٬۰۰۰ یوان (معادل ۲۹٬۹۰۰ دلار) به بازار عرضه می‌شود. خودروهای سری هان شامل مدل‌های رده‌بالاتر Han L و پرچمدار Da Han هستند و محصول جدید جایگاه نسخه‌ی پایه‌ی خانواده را حفظ می‌کند. طراحی بخش عقب همچنان از نوار پیوسته‌ی چراغ‌ها بهره می‌برد و در کابین، نمایشگر مرکزی، تریم سفیدرنگ و دکمه‌های فیزیکی در کنسول میانی به چشم می‌خورند. مشخصات فنی پیش‌بینی‌شده برای خودرو، ارائه‌ی پیشرانه‌های برقی و پلاگین هیبریدی مجهز به نسل دوم باتری بلید و فناوری شارژ سریع را تأیید می‌کنند. سنسور لایدار نصب‌شده روی سقف، احتمال حضور سیستم کمک‌راننده‌ی DiPilot 300 را تقویت می‌کند. بی‌وای‌دی برای بخش پایداری، سیستم‌های تعلیق فعال DiSus-C با کمک‌فنرهای تطبیق‌پذیر و DiSus-A با تعلیق بادی و تنظیم ارتفاع را در نظر گرفته است. ابعاد نسل کنونی سدان هان برابر با ۴۹۹۵ میلی‌متر طول، ۱۹۱۰ میلی‌متر عرض، ۱۴۹۵ میلی‌متر ارتفاع و ۲۹۲۰ میلی‌متر فاصله‌ی محوری است. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Google AI Blog", "title": "Google Beam expands with new regions, partners, and customers", "link": "https://blog.google/innovation-and-ai/technology/research/google-beam-expansion/", "summary": "We’re expanding Google Beam to five new countries, and partnering with Industrious for an extended network.", "date_str": "2026-09-23T18:00:00+00:00", "hash": "97339ca65e9dec80", "title_fa": "Google Beam با مناطق، شرکا و مشتریان جدید گسترش می یابد", "summary_fa": "ما Google Beam را به پنج کشور جدید گسترش می دهیم و با Industrious برای یک شبکه گسترده شریک می شویم. مرورگر شما از عنصر صوتی پشتیبانی نمی کند. Google Beam با پشتیبانی 18 شریک و سخت افزار جدید HP، دسترسی جهانی خود را به شش کشور گسترش می دهد. آزمایش داخلی نشان می دهد که این فناوری ارتباط تیم را بهبود می بخشد و نیاز به جلسات بعدی را کاهش می دهد. از ماه اکتبر، می‌توانید این واحدها را در مکان‌های منتخب Industrious رزرو و آزمایش کنید تا ببینید چگونه جلسات حرفه‌ای شما را بهبود می‌بخشند. Google Beam از سخت‌افزار ویژه‌ای استفاده می‌کند تا به تماس‌های ویدیویی احساس کند که واقعاً با شخصی در اتاق هستید. در حال گسترش به کشورهای بیشتری است و با فضاهای کاری همکاری می کند تا افراد بیشتری بتوانند از آن برای جلسات و مصاحبه ها استفاده کنند. آزمایش‌ها نشان می‌دهند که استفاده از این فناوری به افراد کمک می‌کند احساس ارتباط بیشتری داشته باشند و ارتباط را بسیار واضح‌تر می‌کند. اکنون، مشاغل در هر اندازه می توانند این تنظیمات را رزرو کنند تا چت از راه دور آنها طبیعی تر شود. از همان روزهای اولیه، Google Beam توسط یک چشم انداز منحصر به فرد هدایت می شد: گرد هم آوردن افراد تا بتوانند بدون توجه به فاصله، ارتباط واقعی و رو در رو را تجربه کنند. ما Beam را با کاربران اولیه، از جمله در دفاتر خودمان، آزمایش کرده‌ایم و نشان داده‌ایم که چگونه می‌تواند به تبدیل جلسات روزمره به لحظات معتبر ارتباط کمک کند. امروز، ما از گسترش گسترده ردپای جهانی خود، داده های جدید در مورد تأثیر اثبات شده خود و راه اندازی اولین شبکه توسعه یافته خود خبر می دهیم. ما رسماً در حال گسترش دسترسی جهانی خود هستیم و واحدهای Google Beam برای مشتریان در شش کشور از جمله"}, {"source": "Business Insider", "title": "I sit with people while they complete their to-do lists. It's been a surprising way to turn patience into a side hustle.", "link": "https://www.businessinsider.com/paid-to-watch-others-complete-their-tasks-body-doubling-2026-9", "summary": "I ve been pleasantly surprised to find that body doubling is a promising side hustle for me. Simone Paget My hairdresser needed help finishing tasks, so I offered to watch her do them as a \"body double.\" This helped make her productive, and in exchange, she's given me discounted and free hair services. It's benefited both of us and inspired me to turn body doubling into a bigger side hustle. I never thought of myself as particularly patient. Then, my hairdresser mentioned that she'd had the same giant basket of unfolded laundry sitting in her living room for six months. I offered to come over and help — not by doing her laundry, but by being her \"body double.\" \" Body doubling \" involves doing a task in the presence of another person to make it easier to stay focused, motivated, and on track. For some people (particularly those with ADHD), simply having another person nearby can help them finally complete tasks that have been sitting on the to-do list for days — or years. I'm a textbook Virgo and thrive on organization. I love a color-coded calendar, have a meticulously stocked desk drawer full of cute office supplies, and genuinely find cleaning and organizing my home soothing. However, I'm also a procrastinator extraordinaire. I work best when a deadline is on fire. Although I haven't been formally diagnosed with ADHD , I've found \"body doubling\" — whether sitting across from a friend in a coffee shop with our laptops or coworking over Zoom — to be the secret to helping me get work done with as little panic as possible. I thought that if \"body doubling\" could help me meet my writing deadlines, perhaps it could help my hairdresser tackle some of her most overwhelming tasks. This arrangement has helped us both — and I've made a friend in the process I didn t think I d be watching people fold their laundry as a side hustle, but it s been nice. Delmaine Donson/Getty Images So, my hairdresser and I struck up a deal: I'd come over and sit with her while she tackles the things she's been avoiding (folding laundry, opening mail, hanging up clothes, and other small administrative tasks that somehow become increasingly overwhelming the longer they sit undone). In exchange, she gives me a discount on my haircuts and complimentary professional color services , including highlights and treatments I never could have justified splurging on before. In addition to the tasks mentioned above, I've supported my hairdresser in filling out forms to apply for government grants ", "date_str": "2026-09-24T12:48:01+00:00", "hash": "8c4696d3d3588ecd", "title_fa": "من با مردم می نشینم در حالی که آنها لیست کارهای خود را تکمیل می کنند. این یک راه شگفت انگیز برای تبدیل صبر به یک شلوغی جانبی بوده است.", "summary_fa": "من بسیار شگفت زده شدم از اینکه متوجه شدم دو برابر شدن بدن برای من یک کار جانبی امیدوارکننده است. Simone Paget آرایشگر من برای تکمیل کارها به کمک نیاز داشت، بنابراین به او پیشنهاد دادم که آنها را به عنوان یک «دو تن» تماشا کنم. این به او کمک کرد تا کارایی داشته باشد، و در ازای آن، او به من خدمات مو با تخفیف و رایگان می دهد. این به نفع هر دوی ما بود و به من انگیزه داد تا دو برابر کردن بدن را به یک چالش بزرگتر تبدیل کنم. هرگز خودم را صبور خاصی نمی دانستم. سپس، آرایشگر من گفت که او همان سبد غول‌پیکر لباس‌های تا شده را به مدت شش ماه در اتاق نشیمن او نشسته بود. من به او پیشنهاد دادم که بیایم و کمک کنم - نه با شستن لباس هایش، بلکه با \"دو تن بودن\" او. \"دوبرابر کردن بدن\" شامل انجام یک کار در حضور شخص دیگری است تا تمرکز، انگیزه و در مسیر را آسان تر کند. برای برخی از افراد (به ویژه آنهایی که ADHD دارند)، صرف داشتن یک فرد دیگر در نزدیکی می‌تواند به آن‌ها کمک کند تا در نهایت وظایفی را که برای روزها یا سال‌ها در فهرست کارها قرار دارند، انجام دهند. من یک کتاب درسی باکره هستم و در سازمان پیشرفت می کنم. من عاشق یک تقویم رنگی هستم، یک کشوی میز با دقت پر از لوازم اداری زیبا دارم، و واقعا تمیز کردن و سازماندهی خانه ام را آرامش بخش می دانم. با این حال، من نیز یک تعلل کننده فوق العاده هستم. من زمانی بهترین کار را می کنم که ضرب الاجل در آتش باشد. اگرچه به طور رسمی مبتلا به ADHD تشخیص داده نشده‌ام، اما متوجه شده‌ام که «دوبرابر شدن بدن» - چه نشستن روبروی دوستی در کافی‌شاپ با لپ‌تاپ‌مان یا"}, {"source": "Business Insider", "title": "POLITICO barred from White House after court ruling restoring access", "link": "https://www.businessinsider.com/politico-reporter-denied-white-house-access-despite-court-order-2026-9", "summary": "Alex WROBLEWSKI / AFP via Getty Images A POLITICO reporter was turned away and had his press credential confiscated Thursday morning. The denial came hours after a judge ordered the administration to restore access. A Secret Service agent said the reporter was not cleared to enter. A POLITICO reporter was denied access to the White House Thursday and his press credentials confiscated after a judge ordered the Trump administration overnight to immediately restore access for news organizations that President Donald Trump banned from the complex last week. The move comes after POLITICO, CNN and MS NOW reporters were barred from entering the complex and had their passes seized on Saturday. U.S. District Judge Timothy Kelly granted a temporary restraining order early Thursday morning mandating that the administration restore the organizations' access for at least two weeks while further litigation plays out. The POLITICO r رداند. خبرنگار پولیتیکو صبح روز پنجشنبه توسط سرویس مخفی گذرنامه اش ضبط شد و از ورود او به محوطه کاخ سفید جلوگیری شد. یکی از ماموران سرویس مخفی گفت که خبرنگار اجازه ورود به آن را ندارد اما ممکن است بتواند با یک کارت روزانه موقت، که کاخ سفید به کسانی که دارای مجوزهایی نیستند که به عنوان \"گذرنامه سخت\" شناخته می شوند، اجازه دسترسی دائمی به مراکز مطبوعاتی در کاخ سفید را اعطا می کند. یک سخنگوی کاخ سفید بلافاصله به درخواست برای اظهار نظر پاسخ نداد. این داستان در ابتدا در POLITICO ظاهر شد و توسط شبکه گزارشگران جهانی Axel Springer که از منابع اتاق‌های خبری این شرکت برای انتشار نمونه‌های جاه‌طلبانه، تحقیقات، مصاحبه‌ها، نظرات و تحلیل‌ها استفاده می‌کند، استفاده می‌کند. این به روزنامه نگاران - از جمله روزنامه نگاران POLITICO، Business Insider، WELT،"}, {"source": "Business Insider", "title": "Starbucks is closing 250 stores. Read the memo it sent to staff.", "link": "https://www.businessinsider.com/read-the-memo-starbucks-coffee-closing-250-underperforming-stores-2026-9", "summary": "Starbucks plans to close about 250 underperforming North American coffeehouses following a review of its store portfolio. Marcin Golba/NurPhoto via Getty Images Starbucks says it will close about 250 underperforming North American stores. The coffee giant is returning to its roots and pushing to get more customers back into its stores. Read the memo Chief Operating Officer Mike Grams sent to staff in full below. Starbucks said on Thursday that it will be closing 250 underperforming locations across North America. COO Mike Grams told staff in a memo that a review of its operations found many stores that can't consistently deliver adequate financial performance or customer experiences. The closures represent just over 1% of Starbucks' more than 18,000 North American locations. The company said it will offer affected employees transfers wherever possible and severance when no other position is available. The move comes as Starbucks pushes ahead with its \"Back to Starbucks\" turnaround strategy , including plans to complete 1,500 store upgrades to entice more customers back into stores. Grams said the company's North American business has returned to strong growth and that Starbucks remains committed to opening new coffeehouses across the region in the years ahead. Under CEO Brian Niccol, who joined the company from Chipotle in 2024, Starbucks has sought to return the chain to its roots as a neighborhood coffeehouse, placing a greater focus on the in-store experience, faster service, and coffee-making. As part of its \"Back to Starbucks\" strategy, the company has restored ceramic mugs, handwritten cup messages, and free refills, while adding seating and updating stores to make them feel warmer and more welcoming. Starbucks has also simplified its menu , removing less popular or complicated items to reduce wait times and improve consistency. Read the full memo sent to employees below: Partners, I want to share a decision we've made in support of our Back to Starbucks strategy. We have carefully reviewed our North America coffeehouse portfolio and identified locations where we do not believe we can consistently deliver the experience we want for customers and partners or where we don't see a path to acceptable financial performance. As a result, we will close approximately 250 coffeehouses later this week. This represents approximately 1% of our more than 18,000 North America coffeehouses. As we shared on our most recent earnings calls, our North America business ", "date_str": "2026-09-24T12:01:36+00:00", "hash": "d471008c7baef4f0", "title_fa": "استارباکس 250 فروشگاه را می بندد. یادداشتی را که برای کارکنان فرستاده است بخوانید.", "summary_fa": "استارباکس قصد دارد حدود 250 قهوه خانه با عملکرد ضعیف در آمریکای شمالی را پس از بررسی مجموعه فروشگاه های خود ببندد. Marcin Golba/NurPhoto از طریق Getty Images استارباکس می گوید حدود 250 فروشگاه در آمریکای شمالی را که عملکرد ضعیفی دارند، می بندد. غول قهوه در حال بازگشت به ریشه های خود است و تلاش می کند تا مشتریان بیشتری را winning economist Daron Acemoglu took to X on Wednesday to explain why he had signed a letter backing California's billionaire tax . The letter, published Saturday and signed by six Nobel laureates, including Acemoglu, supports Proposition 40, which would impose a one-time 5% tax on California billionaires, with the majority of revenues directed to healthcare in the state. The six signatories — Acemoglu, Abhijit Banerjee, Peter Diamond, Esther Duflo, Paul Krugman, and Joseph Stiglitz — called the vote \"the first opportunity for the people to start reining in the power of billionaires.\" In his X post, Acemoglu said he was not convinced that permanent wealth taxes would be necessary under an optimally designed tax-and-transfer system. But the US system is \"very far from optimal,\" he wrote, because it taxes labor income more heavily than capital income. I want to briefly explain why I joined Abhijit Banerjee, Peter Diamond, Esther Duflo, Paul Krugman and Joe Stiglitz in signing the letter on the California billionaire tax: https://t.co/EN7sZkpBxA In principle, I am not convinced that permanent wealth taxes would be necessary if… — Daron Acemoglu (@DAcemogluMIT) September 23, 2026 That disparity allows wealthy business owners to receive compensation in stock and borrow against their holdings, reducing their tax bills, Acemoglu — who won a Nobel Prize in 2024 for his work on wealth disparities between nations — wrote. In his X post, he also argued that the tax code favors spending on machinery and AI over hiring workers. Acemoglu said there are three grounds on which he thinks a temporary wealth tax is justifiable \"It partially reverses the effects of more than two decades of tax avoidance by the very wealthy.\" \"It acts as a brake on their growing dominance over the political process.\" \"It may pave the way for more comprehensive tax reform at the federal level.\" The letter estimates that Proposition 40 could raise about $100 billion from California's roughly 250 billionaires. Together, it states, they are worth $2.3 tr", "date_str": "2026-09-24T11:50:50+00:00", "hash": "849e186360132e8d", "title_fa": "یک اقتصاددان برنده جایزه نوبل توضیح داد که چرا از مالیات میلیاردرهای کالیفرنیا حمایت می کند", "summary_fa": "دارون عجم اوغلو در سال 2024 به دلیل کارش در زمینه تفاوت های ثروت بین کشورها برنده جایزه نوبل شد. آدریان ایراگو/اروپا پرس از طریق گتی ایماژ، دارون عجم اوغلو، اقتصاددان برنده نوبل، در X توضیح داد که چرا از مالیات میلیاردرهای کالیفرنیا حمایت می کند. او استدلال کرد که این مالیات اثرات اجتناب از مالیات را معکوس می کند و می تواند اصلاحات مالیاتی بیشتری را تحریک کند. میلیاردرها، از جمله سرگئی برین، بنیانگذار گوگل، متعهد شده اند مبالغ هنگفتی را برای مبارزه با مالیات برنامه ریزی شده پرداخت کنند. دارون عجم اوغلو، اقتصاددان برنده جایزه نوبل، روز چهارشنبه در گفتگو با ایکس توضیح داد که چرا نامه ای را برای حمایت از مالیات میلیاردرهای کالیفرنیا امضا کرده است. این نامه که روز شنبه منتشر شد و توسط شش برنده جایزه نوبل، از جمله Acemoglu امضا شد، از پیشنهاد 40 حمایت می کند که یک بار مالیات 5 درصدی را بر میلیاردرهای کالیفرنیا اعمال می کند، که اکثر درآمدها به مراقبت های بهداشتی در این ایالت اختصاص می یابد. شش امضاکننده - Acemoglu، Abhijit Banerjee، پیتر دایموند، استر دوفلو، پل کروگمن، و جوزف استیگلیتز - این رای را \"اولین فرصت برای مردم برای شروع مهار قدرت میلیاردرها\" نامیدند. Acemoglu در پست X خود گفت که متقاعد نشده است که مالیات بر ثروت دائمی تحت یک سیستم مالیات و انتقال بهینه طراحی شده ضروری باشد. او نوشت، اما سیستم ایالات متحده \"بسیار دور از بهینه\" است، زیرا بر درآمد نیروی کار مالیات سنگین تری نسبت به درآمد سرمایه اعمال می کند. من می خواهم به طور خلاصه توضیح دهم که چرا در امضای نامه مالیات میلیاردرهای کالیفرنیا به آبیجیت بانرجی، پیتر دایموند، استر دوفلو، پل کروگمن و جو استیگلیتز ملحق شدم: https://t.co/EN7sZkpBxA در اصل، من متقاعد نشده ام که مالیات بر ثروت دائمی لازم باشد اگر… (DAron Acemomoglu) عجم اوغلو"}, {"source": "Business Insider", "title": "The Neko scan — Spotify for longevity — is designed to be fast, convenient, and cool. But is it worth $499?", "link": "https://www.businessinsider.com/i-tried-neko-health-body-scan-review-worth-499-2026-9", "summary": "Neko s body scanner is designed to keep track of every single mark on your body and help prevent skin cancer. Hilary Brueck, Business Insider The Neko scan is a high-tech checkup that includes skin cancer screening and heart monitoring. It costs $499, there is a waitlist, and no, you can't use insurance to pay. The scan is fun, but wouldn't be my go-to longevity checkup. It's sleek, Swedish, relatively affordable, and designed for efficiency. Oh, and the color scheme? Yellow and blue. No, it's not Ikea. It's Neko Health — the three-year-old healthcare brainchild of Spotify cofounder Daniel Ek — a new annual go-to longevity checkup for skin cancer, heart health, and more. Up and running in Stockholm since 2023 and London since 2024, the clinic is opening its doors in the US this week, with a first location in New York City's SoHo. At Neko, patients complete a body scan, blood work, circulation tests, and heart health checks, and get their results back within the hour. Neko Health Already, 25,000 people have joined a waitlist in New York, and Neko plans to open more US locations soon, with their second set for Miami this fall . Business Insider got a complimentary sneak preview of the Neko scan ahead of the launch on Thursday. It's slick and high-tech, includes at least 20-30 minutes of quality time with a doctor, and comes with a transparent $499 out-of-pocket price tag. Was it cool? Yes. Was it quick? Sure. Do I have notes? A few. What Neko delivers is not that different from what's covered at a free, preventive annual doctor's exam. It's the engaging, tech-forward experience that makes Neko a product over 100,000 Europeans have already decided is worth the extra expense. A fancy, tech-forward way to check on your heart, skin, and body shape Before the scan, I was given a robe, slippers, my own private dressing room, and a silky hair tie. Hilary Brueck, Business Insider When I stepped into Neko's New York clinic, I felt like I was entering some kind of high-end boutique for your body — complete with a soft yellow robe, satin hair tie, and foamy blue slippers. The check-up started with Neko's flagship body scan, which collects thousands of pictures of your naked body to survey for skin cancer and provides some information on your body fat distribution . Neko s full-body floor-to-ceiling camera system is considered proprietary technology. Neko Health After you're back in your robe and lying down on a very comfy exam table, a technician takes blood pressure r", "date_str": "2026-09-24T11:00:01+00:00", "hash": "241fc50c7287d847", "title_fa": "اسکن Neko - Spotify برای طول عمر - سریع، راحت و خنک طراحی شده است. اما آیا ارزش آن 499 دلار است؟", "summary_fa": "اسکنر بدن Neko برای ردیابی تک تک علائم روی بدن شما و کمک به پیشگیری از سرطان پوست طراحی شده است. هیلاری بروک، بیزینس اینسایدر اسکن Neko یک معاینه با فناوری پیشرفته است که شامل غربالگری سرطان پوست و نظارت بر قلب است. هزینه آن 499 دلار است، یک لیست انتظار وجود دارد، و نه، نمی توانید از بیمه برای پرداخت استفاده کنید. اسکن سرگرم کننده است، اما معاینه طول عمر من نیست. شیک، سوئدی، نسبتاً مقرون به صرفه است و برای کارایی طراحی شده است. اوه، و طرح رنگ؟ زرد و آبی. نه، این ایکیا نیست. این Neko Health است - زاییده مراقبت های بهداشتی سه ساله دانیل اک، یکی از بنیانگذاران Spotify - یک بررسی سالانه جدید برای طول عمر برای سرطان پوست، سلامت قلب و موارد دیگر. این کلینیک که از سال 2023 در استکهلم و از سال 2024 در لندن فعال است، این هفته درهای خود را در ایالات متحده باز می کند و اولین مکان آن در سوهو شهر نیویورک است. در Neko، بیماران اسکن بدن، آزمایش خون، آزمایش گردش خون و بررسی سلامت قلب را تکمیل می‌کنند و در عرض یک ساعت نتایج خود را دریافت می‌کنند. Neko Health در حال حاضر، 25000 نفر به لیست انتظار در نیویورک ملحق شده‌اند، و Neko قصد دارد به زودی مکان‌های بیشتری را در ایالات متحده افتتاح کند و دومین مجموعه خود را برای میامی در پاییز امسال برگزار کند. Business Insider پیش‌نمایش رایگان اسکن Neko را قبل از عرضه در روز پنجشنبه دریافت کرد. نرم و با تکنولوژی بالا است، شامل حداقل 20 تا 30 دقیقه زمان با کیفیت با پزشک است، و با قیمت شفاف 499 دلاری عرضه می شود. باحال بود؟ بله. سریع بود؟ مطمئنا آیا من یادداشت دارم؟ چند. چیزی که Neko ارائه می‌کند با آنچه در یک معاینه سالانه رایگان و پیشگیرانه"}, {"source": "Business Insider", "title": "The reality Meta is pitching is one where we're not always relying on our iPhones", "link": "https://www.businessinsider.com/meta-connect-developers-conference-virtual-reality-ai-glasses-tech-charm-2026-9", "summary": "Meta s VR Glasses are connected to a battery puck. Meta This post originally appeared in the Business Insider Today newsletter. You can sign up for Business Insider's daily newsletter here . Meta's looking to make virtual reality a reality … again. The tech giant unveiled a new version of its virtual reality glasses at its annual developers conference, Meta Connect. Before you panic that you've traveled back in time, this isn't quite the same metaverse Mark Zuckerberg was pitching back in 2021. The goal of replacing the hardware in your pocket, though, remains the same. More on that in a bit. Meta VR Glasses, which go on sale next spring, are a far cry from the bulky headsets we typically associate with virtual reality. (I'm looking at you, Apple Vision Pro .) Weighing in at a svelte 100 grams and costing $1,300, Meta VR Glasses are much lighter and cheaper than the Apple Vision Pro, which weighs 600 grams and costs $3,700. But don't take my word for it. BI's Peter Kafka took them for a test drive. He said the difference between Meta VR Glasses and Apple's Vision Pro is immediately noticeable. But, like the Apple Vision Pro, he also struggled to think of many reasons to use them regularly. Read his full review here . The VR glasses weren't the only thing Meta showed off at the event. There was also an update on Meta's somewhat controversial AI glasses , as well as new partnerships with Disney and others to boost entertainment options on its new gadgets. Here are all the highlights from the event . Meta's betting on a future where people won't default to their phones. Muse , Meta's buzzy new personal AI agent, is deeply integrated into the new VR glasses and also got its own palm-sized device users can speak into. It's called Charm , and should be ready to ship for the holidays. It's another way Meta can pull you deeper into its ecosystem, and away from your iPhone. Ideally, Zuckerberg would love for users to remain in a Meta-exclusive world: wearing Meta VR Glasses while interacting with Muse, scrolling Instagram and Facebook, and chatting with friends on WhatsApp. He's not alone. The fact that so many of us live on our iPhones is a major bummer to tech companies since it gives Apple an incredible advantage. Currently, Apple doesn't need to stress too much about AI because companies still rely on the iPhone to get their fancy AI products to consumers. It's like running the only toll bridge over a river that sits between two major cities. Even if the road i", "date_str": "2026-09-24T10:47:09+00:00", "hash": "a01e96310a4aba1a", "title_fa": "واقعیتی که متا مطرح می کند، واقعیتی است که ما همیشه به آیفون های خود متکی نیستیم", "summary_fa": "عینک VR متا به یک باتری متصل است. متا این پست در اصل در خبرنامه Business Insider Today ظاهر شد. از اینجا می توانید برای خبرنامه روزانه Business Insider ثبت نام کنید. متا به دنبال تبدیل واقعیت مجازی به واقعیت است… دوباره. این غول فناوری در کنفرانس سالانه توسعه دهندگان خود، Meta Connect، از نسخه جدیدی از عینک واقعیت مجازی خود رونمایی کرد. قبل از اینکه وحشت کنید که به گذشته سفر کرده اید، این کاملاً همان متاوریستی نیست که مارک زاکربرگ در سال 2021 مطرح کرد. با این حال، هدف از جایگزینی سخت افزار در جیب شما یکسان است. بیشتر در مورد آن در یک بیت. عینک‌های متا VR که در بهار آینده به فروش می‌رسند، با هدست‌های حجیمی که ما معمولاً با واقعیت مجازی مرتبط می‌کنیم فاصله زیادی دارند. (من به شما نگاه می کنم، Apple Vision Pro.) با وزن 100 گرمی و قیمت 1300 دلار، عینک های متا VR بسیار سبک تر و ارزان تر از Apple Vision Pro هستند که 600 گرم وزن و 3700 دلار قیمت دارند. اما حرف من را قبول نکن پیتر کافکا از BI آنها را برای تست رانندگی برد. او گفت که تفاوت بین Meta VR Glass و Vision Pro اپل بلافاصله قابل توجه است. اما، مانند Apple Vision Pro، او همچنین به دلایل زیادی برای استفاده منظم از آنها فکر کرد. بررسی کامل او را اینجا بخوانید. عینک واقعیت مجازی تنها چیزی نبود که متا در این رویداد به نمایش گذاشت. همچنین یک به‌روزرسانی در مورد عینک هوش مصنوعی تا حدودی بحث‌برانگیز متا و همچنین مشارکت‌های جدید با دیزنی و دیگران برای تقویت گزینه‌های سرگرمی در گجت‌های جدیدش وجود دارد. در اینجا تمام نکات برجسته این رویداد آمده است. متا روی آینده ای شرط بندی می کند که در آن مردم تلفن های خود را پیش فرض نخواهند داشت. Muse،"}, {"source": "Business Insider", "title": "The personal AI agent horror stories are rolling in", "link": "https://www.businessinsider.com/ai-agents-gone-wrong-horror-stories-instinct-muse-privacy-security-2026-9", "summary": "Personal AI agents can be helpful, but some early users have encountered issues. David Talukdar/ZUMA Press Wire/Reuters Personal AI agents are taking on more of our tasks — and some users say things are going wrong. Users say agents have leaked data, accessed accounts, and made up personal details online. \"If I can't trust its account of what it did, I can't give it access to anything that matters,\" one said. The dream of a personal AI assistant that runs your digital life has, for some, turned into a nightmare. Many early users say their personal AI agents, which can autonomously take actions on the internet, such as booking trips or buying items, have been a huge help in their day-to-day lives. Others say their agents have gone wrong in unnerving ways. They have made incorrect cancellations, fabricated personal details, provided false explanations, and raised major security concerns, according to four AI agent users who spoke to Business Insider and a stream of social media posts. How are you using personal AI agents? We want to hear from you — fill out our survey here . Mehdi Jamei, the cofounder and CEO of Veris AI, said he asked Instinct, a popular invite-only agent, to cancel two RSVPs on the event platform Luma. The agent retrieved a one-time Luma login code from his connected Gmail inbox — without first asking him — and used it to access the account and cancel the RSVPs. At first glance, the agent did what it was asked. But what unsettled Jamei was Instinct's explanation. Initially, it said it used an existing saved session to access Luma. After Jamei challenged it, the agent acknowledged that it had read the login code from Gmail and reported \"an assumption as a fact.\" \"If I can't trust its account of what it did, I can't give it access to anything that matters,\" Jamei told Business Insider, adding that reading a login code from his email without asking is a \"serious security problem.\" Instinct did not respond to a Business Insider request for comment about the incidents in this story. Instinct's privacy policy says its agent may access connected accounts, emails, and messages to complete tasks. It also warns that autonomous agents can take unintended actions, including payments or communications to outside parties. A data hallucination Some of the concerns stem from a simple truth about AI agents: They are only as useful as the level of access that you give them. To do their jobs, agents need the keys to users' digital lives, from email and bank ", "date_str": "2026-09-24T10:26:45+00:00", "hash": "5af85101a6ad8785", "title_fa": "داستان های ترسناک عامل هوش مصنوعی شخصی در حال پخش شدن است", "summary_fa": "عوامل هوش مصنوعی شخصی می توانند مفید باشند، اما برخی از کاربران اولیه با مشکلاتی مواجه شده اند. دیوید تالوکدار/ZUMA Press Wire/Reuters عوامل هوش مصنوعی شخصی بیشتر وظایف ما را بر عهده می گیرند - و برخی از کاربران می گویند که همه چیز اشتباه پیش می رود. کاربران می‌گویند که نمایندگان داده‌ها را فاش کرده‌اند، به حساب‌ها دسترسی پیدا کرده‌اند و اطلاعات شخصی را به صورت آنلاین ساخته‌اند. یکی از این افراد گفت: «اگر نتوانم به حسابش درباره کاری که انجام داده است اعتماد کنم، نمی‌توانم به آن چیزی که مهم است دسترسی داشته باشم. رویای دستیار هوش مصنوعی شخصی که زندگی دیجیتالی شما را اداره می کند، برای برخی به یک کابوس تبدیل شده است. بسیاری از کاربران اولیه می گویند که عوامل هوش مصنوعی شخصی آنها، که می توانند به طور مستقل اقداماتی را در اینترنت انجام دهند، مانند رزرو سفر یا خرید اقلام، کمک بزرگی در زندگی روزمره آنها بوده است. برخی دیگر می گویند که عوامل آنها در راه های نگران کننده اشتباه کرده اند. به گفته چهار کاربر عامل هوش مصنوعی که با Business Insider و جریانی از پست‌های رسانه‌های اجتماعی صحبت کردند، آن‌ها لغو نادرست، جعل اطلاعات شخصی، ارائه توضیحات نادرست و نگرانی‌های امنیتی بزرگی انجام داده‌اند. چگونه از عوامل هوش مصنوعی شخصی استفاده می کنید؟ ما می خواهیم از شما بشنویم - نظرسنجی ما را در اینجا پر کنید. مهدی جامعی، یکی از بنیانگذاران و مدیرعامل Veris AI، گفت که از Instinct، یک نماینده محبوب فقط دعوت، درخواست کرده است تا دو درخواست پاسخگویی به پلتفرم رویداد Luma را لغو کند. این نماینده یک کد ورود به سیستم یکبار مصرف Luma را از صندوق ورودی جیمیل متصل خود - بدون اینکه قبلاً از او بپرسد - بازیابی کرد و از آن برای دسترسی به حساب و لغو پاسخ‌های درخواستی استفاده کرد. در"}, {"source": "Business Insider", "title": "I've had 2 babies in France. As an American, the biggest shock was never getting a hospital bill.", "link": "https://www.businessinsider.com/france-maternity-leave-birth-cost-american-mom-2026-9", "summary": "Kristen Seitz had two babies in France, where she lives now. Courtesy of Kristen Seitz Kristen Seitz entered pregnancy worried about medical costs and losing control during birth. Seitz says her French care team respected her preferences throughout labor. Her experience made her reconsider many of the fears she'd brought with her from the US. This as-told-to essay is based on a conversation with Kristen Seitz . It has been edited for length and clarity. At 25, I was working in Texas at an oil and gas company, feeling like this wasn't the life I wanted. I decided I'd quit my job and teach English in Europe for a few years, planning to return once I'd had my fill. My first Christmas in Europe , I was teaching at a school in Poland and was invited to spend the holiday with a colleague's family. It was there that I met a French man who would become my husband. We had 2 kids in France Since the meeting, we've moved around, living in Poland and Canada, and since 2019, in France. We wanted to settle near my husband's family, and it was easier to get married in France than anywhere else we had lived. Both of us knew we wanted children, and I found out I was expecting our firstborn in 2023. The whole process of having a baby scared me because of what I had heard from family and friends in the US. I'd heard horror stories about affording pregnancy and birth, being pushed by doctors to have C-sections, and taking Pitocin. I was nervous it might be the same in France. I quickly discovered how wrong I was. I had a midwife throughout my pregnancy As soon as I found out I was pregnant at six weeks , I used an app to find a midwife (sage femme in French) and contacted her. She would be my midwife throughout the pregnancy. I'd visit her once a month at the office to talk about anything and everything: how I was feeling, what I was worried about, and any questions or concerns I had. She was so warm and reassuring each time we met, putting all of my worries to rest. Not having my family or much of a support system at the time, it was a huge relief to have someone other than my husband to speak to about how the baby and I were doing. Anytime I needed her in between these meetings, she was available over text. I loved having midwifery support throughout my pregnancy. Midwives here are focused on the mother and the baby, and that comes across loud and clear through their care. In addition, there were workshops I could attend. I went to seven, covering birthing positions, prepar", "date_str": "2026-09-24T10:03:01+00:00", "hash": "a5c2a5fcd2f68933", "title_fa": "من 2 تا بچه در فرانسه دارم. به عنوان یک آمریکایی، بزرگترین شوک هرگز نگرفتن صورت حساب بیمارستان بود.", "summary_fa": "کریستن سیتز در فرانسه، جایی که اکنون زندگی می کند، دو نوزاد داشت. با حسن نیت از کریستن سیتز کریستن سیتز با نگرانی از هزینه های پزشکی و از دست دادن کنترل در هنگام تولد وارد بارداری شد. سیتز می گوید که تیم مراقبت فرانسوی او در طول زایمان به ترجیحات او احترام گذاشتند. تجربه او باعث شد در بسیاری از ترس هایی که از ایالات متحده با خود آورده بود تجدید نظر کند. این مقاله گفته شده بر اساس گفتگو با کریستن سیتز است. برای طول و وضوح ویرایش شده است. در ۲۵ سالگی، در تگزاس در یک شرکت نفت و گاز کار می‌کردم، احساس می‌کردم این زندگی آنطور که می‌خواستم نیست. تصمیم گرفتم کارم را رها کنم و چند سالی در اروپا به تدریس زبان انگلیسی بپردازم، و تصمیم گرفتم پس از پر شدن از کار برگردم. اولین کریسمس من در اروپا، در مدرسه ای در لهستان تدریس می کردم و از من دعوت کردند که تعطیلات را با خانواده یکی از همکارانم بگذرانم. آنجا بود که با مردی فرانسوی آشنا شدم که قرار بود شوهر من شود. ما 2 بچه در فرانسه داشتیم از زمان ملاقات، ما در لهستان و کانادا و از سال 2019 در فرانسه زندگی کردیم. ما می خواستیم در نزدیکی خانواده شوهرم مستقر شویم و ازدواج در فرانسه راحت تر از هر جای دیگری بود که ما زندگی می کردیم. هر دوی ما می‌دانستیم که بچه می‌خواهیم، ​​و من متوجه شدم که در سال 2023 در انتظار اولین‌زاده‌ام هستم. کل روند بچه دار شدن من را به خاطر چیزهایی که از خانواده و دوستانم در ایالات متحده شنیده بودم، ترساند. من داستان های ترسناکی درباره هزینه های بارداری و زایمان، تحت فشار قرار دادن پزشکان برای انجام سزارین و مصرف پیتوسین شنیده بودم. عصبی بودم شاید در فرانسه هم همینطور باشد. به سرعت"}, {"source": "Business Insider", "title": "You got laid off. Now your boss wants you back.", "link": "https://www.businessinsider.com/boomerang-hiring-old-job-wants-back-amazon-2026-9", "summary": "Maria Colacurcio, CEO of Syndio, said she regretted AI-driven job cuts. Courtesy of Syndio Boomerang workers are on the rise. Amazon and other companies are trying to rehire former employees, including some they laid off. One CEO told Business Insider she rehired someone after realizing restructuring had moved too fast. In the AI era, leaving a company or role may not mean forever. On Wednesday, Business Insider reported that Amazon is trying to recruit back workers it previously laid off. They're not the only company dialing up former employees. One CEO of a small tech firm said she laid off staff, hoping AI would suffice — only to regret it. Another company more than doubled its boomerang hires in the last two years. And in a related staffing reversal, Meta asked some of its recently reassigned employees to become managers once again . Call it an AI-era boom in boomerangs. The type of rehiring happening at Amazon and elsewhere is broadly on the rise. Revelio Labs, which analyzes employment data, found that by the end of 2025, 3.4% of new hires in the US were former employees, up from 3.1% two years earlier. It comes as companies increasingly point to AI when announcing layoffs. Through July, employers attributed nearly one in four announced job cuts to AI, making it the leading reason cited for layoffs for the fifth consecutive month, according to career transition firm Challenger, Gray Christmas. Amazon spokesperson Haley Silva said the company is always interested in connecting with former Amazonians for open roles. \"Rehiring former employees is a normal, long-standing part of how we recruit,\" she said. Like 'sneaking back' Maria Colacurcio, CEO of pay-intelligence platform Syndio, came to regret an AI-driven restructuring. Weeks after laying off five employees, including labor economists and other domain experts, she realized the company had gotten ahead of itself. She has since rehired one of them for a newly created position. \"We moved really fast,\" she told Business Insider. \"The technology wasn't quite there yet.\" Colacurcio said she also should've given at least some of the workers she let go a chance to adapt to new roles she created as part of her reorg strategy. She'd expected other employees to move into those positions, but few were willing to do so. \"One of the things we get wrong is when we assume too quickly that people who are in a certain role can't evolve,\" said Colacurcio. \"When you give people the right tools and training around AI, ", "date_str": "2026-09-24T09:58:01+00:00", "hash": "a32eb93bcdf3efd2", "title_fa": "اخراج شدی حالا رئیست تو را می خواهد", "summary_fa": "ماریا کولاکورسیو، مدیر عامل Syndio، گفت که از کاهش مشاغل ناشی از هوش مصنوعی متاسف است. کارگران Syndio Boomerang در حال افزایش هستند. آمازون و سایر شرکت‌ها در تلاش هستند تا کارمندان سابق خود، از جمله برخی از آنها را که اخراج کرده‌اند، دوباره استخدام کنند. یکی از مدیران اجرایی به Business Insider گفت که او پس از اینکه متوجه شد بازسازی بسیار سریع پیش رفته است، فردی را دوباره استخدام کرد. در عصر هوش مصنوعی، ترک یک شرکت یا نقش ممکن است برای همیشه معنی نداشته باشد. روز چهارشنبه، Business Insider گزارش داد که آمازون در تلاش است تا کارگرانی را که قبلاً اخراج کرده بود، دوباره استخدام کند. آنها تنها شرکتی نیستند که با کارمندان سابق تماس می گیرند. یکی از مدیران اجرایی یک شرکت فناوری کوچک گفت که او کارکنان خود را اخراج کرد، به این امید که هوش مصنوعی کافی باشد و فقط پشیمان شود. شرکت دیگری در دو سال گذشته تعداد بومرنگ های خود را بیش از دو برابر افزایش داده است. و در یک تغییر پرسنل مرتبط، متا از برخی از کارمندانی که اخیراً دوباره منصوب شده‌اند درخواست کرد که یک بار دیگر مدیر شوند. آن را رونق دوران هوش مصنوعی در بومرنگ ها بنامید. نوع استخدام مجدد در آمازون و جاهای دیگر به طور گسترده در حال افزایش است. Revelio Labs که داده‌های اشتغال را تجزیه و تحلیل می‌کند، دریافت که تا پایان سال 2025، 3.4 درصد از استخدام‌شدگان جدید در ایالات متحده کارمندان سابق بودند، در حالی که دو سال قبل 3.1 درصد افزایش داشت. این درحالی است که شرکت ها به طور فزاینده ای هنگام اعلام اخراج به هوش مصنوعی اشاره می کنند. طبق گفته شرکت انتقال شغلی چلنجر، گری کریسمس، تا ماه جولای، کارفرمایان تقریباً یک مورد از هر چهار کاهش شغل اعلام شده را به هوش مصنوعی نسبت می‌دهند،"}, {"source": "Business Insider", "title": "Emily Blunt says she gets nervous before everything. These are the 4 things that help.", "link": "https://www.businessinsider.com/emily-blunt-shares-how-overcome-nerves-2026-9", "summary": "Emily Blunt hosted the 20th anniversary gala for the American Institute for Stuttering. Bryan Bedder/Getty Images for American Institute for Stuttering Emily Blunt shared how she overcomes nerves at a Gala for the American Institute for Stuttering. Blunt practices deep breathing and meditation before big events or public speaking. Another way to soothe your nerves? \"A shot of tequila is really good,\" Blunt said. If you get nervous before big events, don't be too hard on yourself — Emily Blunt does, too. \"I get nervous before I do everything,\" the actor, who starred in \" The Devil Wears Prada 2 ,\" \"Oppenheimer,\" and \"A Quiet Place,\" told Business Insider at the 20th Anniversary Gala for the American Institute for Stuttering. About 3 million Americans — roughly 1% of the population — stutter, according to the organization. AIS doesn't believe in the need for a stuttering cure and instead offers therapy and support to ease negative reactions and help people build confidence when they speak. At the gala honoring Steven Tananbaum, the founder, managing partner, and chief investment officer of GoldenTree Asset Management, Blunt spoke about four coping mechanisms she uses to work through nerves. First: deep breathing. The award-winning British actor said she practices deep breathing before public speaking or any other event that makes her nervous. Blunt's personal trainer, Monique Eastwood, previously told Cosmopolitan that Blunt practices a breath pattern from Eastwood's Power/Stress class. It involves inhaling for four counts, holding for four seconds, then exhaling for four or eight counts. The trainer said the practice helps calm Blunt's parasympathetic nervous system. Blunt has also said that she likes to meditate. In a 2019 interview with Vogue, the actor said that she practices transcendental meditation every day. Creative expression has helped her, too. Blunt told Business Insider that acting allowed her to express herself more freely and speak without stuttering, which is one reason she pursued it professionally. Blunt said she has met other actors who can speak \"very fluently\" when they are in character. Creativity, she said, can become a \"very freeing, very expressive experience,\" and she encourages others with a stutter to join an improv group or read poetry as if they're a different character. \"Try to move away from the cage of how you see yourself,\" Blunt said. When all else fails, \"a shot of tequila is really good,\" Blunt said. Read the original ar", "date_str": "2026-09-24T09:55:01+00:00", "hash": "e59387f517f06d50", "title_fa": "امیلی بلانت می گوید قبل از هر چیزی عصبی می شود. این 4 موردی است که کمک می کند.", "summary_fa": "امیلی بلانت مجری مراسم جشن بیستمین سالگرد موسسه آمریکایی لکنت بود. برایان بددر/ گتی ایماژ برای موسسه آمریکایی لکنت امیلی بلانت نحوه غلبه بر اعصاب خود را در مراسم گالا برای موسسه آمریکایی لکنت به اشتراک گذاشت. بلانت قبل از رویدادهای بزرگ یا سخنرانی در جمع، تنفس عمیق و مدیتیشن را تمرین می کند. راه دیگری برای آرام کردن اعصاب شما؟ بلانت گفت: یک شات تکیلا واقعا خوب است. اگر قبل از رویدادهای بزرگ عصبی می شوید، خیلی به خودتان سخت نگیرید - امیلی بلانت هم همینطور. این بازیگر که در فیلم‌های «شیطان پرادا 2 می‌پوشد»، «اپنهایمر» و «مکانی ساکت» بازی کرد، در مراسم جشن بیستمین سالگرد لکنت آمریکا به Business Insider گفت: «من قبل از انجام هر کاری عصبی می‌شوم. به گفته این سازمان، حدود 3 میلیون آمریکایی - تقریباً 1٪ از جمعیت - لکنت دارند. AIS به نیاز به درمان لکنت اعتقادی ندارد و در عوض برای کاهش واکنش های منفی و کمک به افراد در ایجاد اعتماد به نفس هنگام صحبت کردن، درمان و پشتیبانی ارائه می دهد. بلانت در مراسم بزرگداشت استیون تاننبام، بنیانگذار، شریک مدیریت و مدیر سرمایه گذاری GoldenTree Asset Management، در مورد چهار مکانیسم مقابله ای که برای کار از طریق اعصاب استفاده می کند صحبت کرد. اول: نفس عمیق. این بازیگر بریتانیایی برنده جایزه گفت که قبل از سخنرانی در جمع یا هر رویداد دیگری که او را عصبی می کند، تنفس عمیق را تمرین می کند. مربی شخصی بلانت، مونیک ایستوود، قبلاً به Cosmopolitan گفته بود که بلانت الگوی تنفسی را از کلاس Power/Stress ایستوود تمرین می کند. این شامل دم برای چهار شمارش، نگه داشتن برای چهار ثانیه، سپس بازدم برای چهار یا هشت شمارش است. مربی گفت این تمرین به آرام کردن سیستم عصبی پاراسمپاتیک بلانت کمک می کند. بلانت همچنین گفته است که مدیتیشن را دوست دارد. این"}, {"source": "Business Insider", "title": "This consulting firm is making bespoke AI apps to replace the PowerPoint pitch", "link": "https://www.businessinsider.com/west-monroe-redefining-client-meetings-ai-driven-apps-2026-9", "summary": "West Monroe brings an app to its first client meetings, not a deck. Andriy Onufriyenko/Getty Images Consulting firm West Monroe has ditched PowerPoints in favor of introductory apps. The firm builds tailored apps that showcase AI-driven solutions to client issues. The goal is to move quickly past initial discussions and toward client outcomes. When a client calls the mid-market consulting firm West Monroe to discuss supply chain efficiency, it doesn't start by preparing a slide deck for the first meeting. Instead, it builds a customized app using AI to start the conversation. \"No one's ever been inspired or moved or woken up excited about a PowerPoint,\" Bret Greenstein, West Monroe's chief AI officer, told Business Insider. \"And yet so much of consulting is to produce a PowerPoint to compel or convince or persuade somebody.\" Founded in Chicago in 2002, West Monroe has about 2,000 employees. Since adopting its app-first approach in January, the firm has brought a working demo or app to about a third of first client conversations. The firm builds the apps to give clients a concrete look at how AI could change their work. Greenstein said the approach addresses two familiar problems: Consulting firms can spend too long polishing PowerPoint presentations without helping clients visualize what comes next, while pilot projects can take weeks to fund and build without leading anywhere. The aim is to collapse the traditional deck and proof of concept into a single step: a working product. For a telecommunications company seeking help with its supply chain, West Monroe first used AI to find publicly available information about its suppliers, business priorities, and technology stack. It then applied its own supply chain expertise to envision how an agent-powered system could work. Instead of simply describing that concept in the first meeting, the firm built a prototype tailored to the client. The app used the client's branding and synthetic data designed to reflect its operations. The idea is to make the proposal feel tangible, like sitting in a car at a dealership and picturing yourself owning it, Greenstein said. The client liked it but wanted to see hardware, software, and services together. West Monroe changed the app during the meeting. The demos are not final products. Greenstein said a client still needs integration, data work, process changes, and change management before it can use the software in its business. AI has made it faster to build an early versi", "date_str": "2026-09-24T09:51:02+00:00", "hash": "0c68b4c815151bfc", "title_fa": "این شرکت مشاوره در حال ساخت اپلیکیشن های سفارشی هوش مصنوعی برای جایگزینی پاورپوینت است", "summary_fa": "West Monroe یک برنامه را به اولین جلسات مشتری خود می آورد، نه یک عرشه. Andriy Onufriyenko/شرکت مشاوره گتی ایماژ West Monroe پاورپوینت ها را به نفع اپلیکیشن های مقدماتی کنار گذاشته است. این شرکت برنامه‌های متناسبی می‌سازد که راه‌حل‌های مبتنی بر هوش مصنوعی را برای مشکلات مشتری به نمایش می‌گذارند. هدف این است که به سرعت از بحث های اولیه گذشته و به سمت نتایج مشتری حرکت کنیم. وقتی مشتری با شرکت مشاوره وست مونرو در بازار میانی تماس می گیرد تا در مورد کارایی زنجیره تامین بحث کند، با آماده کردن یک عرشه اسلاید برای اولین جلسه شروع نمی کند. در عوض، یک برنامه سفارشی با استفاده از هوش مصنوعی برای شروع مکالمه ایجاد می کند. برت گرینشتاین، افسر ارشد هوش مصنوعی وست مونرو، به Business Insider گفت: «هیچ کس در مورد یک پاورپوینت الهام گرفته، حرکت نکرده یا از خواب بیدار نشده است. \"و با این حال، بسیاری از مشاوره ها تولید پاورپوینت برای مجبور کردن یا متقاعد کردن یا متقاعد کردن کسی است.\" وست مونرو که در سال 2002 در شیکاگو تأسیس شد، حدود 2000 کارمند دارد. از زمان اتخاذ رویکرد برنامه اول خود در ژانویه، این شرکت یک نسخه آزمایشی یا برنامه کاربردی را به حدود یک سوم از اولین مکالمات مشتری ارائه کرده است. این شرکت برنامه‌ها را می‌سازد تا به مشتریان نگاهی ملموس به اینکه چگونه هوش مصنوعی می‌تواند کارشان را تغییر دهد، می‌سازد. گرینشتاین گفت که این رویکرد به دو مشکل آشنا می‌پردازد: شرکت‌های مشاوره می‌توانند ارائه‌های پاورپوینت را بدون کمک به مشتریان در تجسم آنچه در آینده به‌وجود می‌آیند، بسیار طولانی صرف کنند، در حالی که پروژه‌های آزمایشی ممکن است هفته‌ها طول بکشد تا سرمایه‌گذاری و ساخت آن‌ها بدون هدایت به جایی انجام شود. هدف این است که عرشه سنتی و اثبات مفهوم را در یک مرحله جمع کنیم: یک محصول"}, {"source": "Business Insider", "title": "GM's CFO says top executives are in a monthly race to use more AI. His team is 'middle of the pack.'", "link": "https://www.businessinsider.com/gm-cfo-executives-ai-use-competition-2026-9", "summary": "Paul Jacobson, GM s chief financial officer, sitting in the driver s seat on the right, said GM s executives compete on AI usage. Bloomberg/Getty Images GM's top executives have turned AI adoption into a friendly competition. The finance team is \"middle of the pack,\" GM's chief financial officer said. GM says AI can cut costs and speed up car development as Chinese rivals gain ground. General Motors executives are competing with each other over AI use. On Wednesday, GM's chief financial officer, Paul Jacobson, said the top brass who report to CEO Mary Barra compare monthly AI-usage figures by function and department. \"We have a healthy competition among all of Mary's senior leaders, where every month we show usage by function and department,\" he said in London at JPMorgan's US All Stars Conference in London. \"That's a good, healthy competition across the board.\" Jacobson said his team is \"kind of middle of the pack\" in that race. A spokesperson for GM reiterated that it's a \"friendly competition\" between the executives. General Motors has been stepping up its AI across several departments. The company previously told Business Insider that AI tools are offering car design recommendations and alerting the company about potential risks to its supply chain . The automaker's chief product officer, Sterling Anderson , said his team's goal is to hasten the design-to-production timeline. AI has become a central focus for Detroit automakers, especially as Chinese car companies expand their control of global markets with cheaper, longer-range EV technologies. Jacobson referenced that tension: He called America \"a little bit of a safe haven\" as manufacturers direct more capacity here to escape intense Chinese competition elsewhere. He added that GM's AI ambitions remain in the \"infancy\" stage as it tries to understand how the tech will change its business. He pointed to potential applications in vehicle features, quality, and manufacturing — and warned that companies unable to become more efficient will fall \"further and further behind.\" Within finance, Jacobson wants AI to help GM's analysts develop some clairvoyance. Today, he said, they spend about 80% of their time explaining past results and 20% anticipating what comes next; he expects AI to flip that, with 80% of their time spent on predicting next moves. \"That makes us more effective as a finance team across the board, versus sitting here thinking about what's happened and extrapolating that,\" he said. \"AI's g", "date_str": "2026-09-24T09:51:01+00:00", "hash": "3e636776acf73413", "title_fa": "مدیر مالی جنرال موتورز می گوید مدیران ارشد در رقابت ماهانه برای استفاده بیشتر از هوش مصنوعی هستند. تیم او \"وسط گروه\" است.", "summary_fa": "پل جاکوبسون، مدیر مالی جنرال موتورز که روی صندلی راننده سمت راست نشسته است، گفت که مدیران جنرال موتورز بر سر استفاده از هوش مصنوعی رقابت می کنند. Bloomberg/Getty Images مدیران ارشد جنرال موتورز پذیرش هوش مصنوعی را به یک رقابت دوستانه تبدیل کرده اند. مدیر ارشد مالی جنرال موتورز گفت که تیم مالی \"وسط بسته\" است. جنرال موتورز می‌گوید که هوش مصنوعی می‌تواند هزینه‌ها را کاهش دهد و با افزایش جایگاه رقبای چینی، سرعت توسعه خودرو را افزایش دهد. مدیران جنرال موتورز بر سر استفاده از هوش مصنوعی با یکدیگر رقابت می کنند. روز چهارشنبه، پل جیکوبسون، مدیر مالی جنرال موتورز، گفت که مدیران ارشدی که به مدیر عامل شرکت مری بارا گزارش می دهند، ارقام ماهانه استفاده از هوش مصنوعی را بر اساس عملکرد و بخش مقایسه می کنند. او در لندن در کنفرانس ستارگان آمریکا JPMorgan در لندن گفت: \"ما رقابت سالمی بین همه رهبران ارشد مری داریم، جایی که هر ماه استفاده را بر اساس عملکرد و بخش نشان می دهیم.\" \"این یک رقابت خوب و سالم در سراسر جهان است.\" جیکوبسون گفت که تیم او در آن مسابقه \"نوعی وسط گروه\" است. سخنگوی جنرال موتورز تکرار کرد که این یک \"رقابت دوستانه\" بین مدیران است. جنرال موتورز هوش مصنوعی خود را در چندین بخش تقویت کرده است. این شرکت قبلاً به Business Insider گفته بود که ابزارهای هوش مصنوعی توصیه‌های طراحی خودرو را ارائه می‌کنند و به شرکت در مورد خطرات احتمالی برای زنجیره تامین خود هشدار می‌دهند. استرلینگ اندرسون، مدیر ارشد محصول این خودروساز، گفت که هدف تیمش تسریع در جدول زمانی طراحی تا تولید است. هوش مصنوعی به تمرکز اصلی خودروسازان دیترویت تبدیل شده است، به خصوص که شرکت‌های خودروسازی چینی کنترل خود را بر بازارهای جهانی با فناوری‌های ارزان‌تر و دوربردتر خودروهای برقی افزایش می‌دهند. جاکوبسون به این تنش اشاره کرد: او"}, {"source": "Business Insider", "title": "McDonald’s is serving up an $8.5 billion McMakeover. Investors aren’t lovin’ it.", "link": "https://www.businessinsider.com/mcdonalds-next-restaurant-makeover-investors-skeptical-stock-four-year-low-2026-9", "summary": "Bildagentur-online/Schoening/Universal Images Group via Getty Images McDonald's shared details of its new $8.5 billion \"Next\" initiative, and investors shrugged. With shares now at a four-year low, the company has to prove its US turnaround is working. Sign up for First Trade , Business Insider's daily markets newsletter. If you've been inside a McDonald's lately, the most indelible image in your mind is probably a row of touchscreen ordering kiosks. For digitally inclined people not looking for a conversation, they can be a savior. But there are plenty of others who don't want to handle their own keystrokes — who prefer to communicate with a human. Tough luck. These days, there might not be anyone working the counter at all. These impersonal customer interactions are just one of the issues McDonald's is trying to address with its new \"Next\" initiative , which it detailed on Wednesday at its investor day. The company will spend roughly $8.5 billion to help franchisees revamp their restaurants, aiming to improve food quality, streamline operations, and sharpen the customer experience. That means a bigger push into chicken and beverages, new equipment and restaurant designs, AI tools, and more hospitality training. It all sounds good in theory. But the early reaction from investors was not particularly encouraging, as shares fell 5% on the day, hitting their lowest level since 2022. Wall Street appears skeptical that spending big to repair and modernize McDonald's core business will generate strong enough returns. \"Next\" didn't create that skepticism. It simply gave investors a fresh reason to act on it. Which begs the question: What the heck is going on with McDonald's? Why a reset is necessary Let's start with the macro. The US economy is currently contending with a toxic mixture of weak retail sales, falling sentiment, and a contracting job market . That's resulted in a broad consumer pullback that's impacted not just McDonald's, but the entire discretionary sector , even Walmart . Still, McDonald's hasn't simply been caught in an industrywide restaurant slump. Over the past five years, its shares have fallen 3%, while Burger King parent Restaurant Brands is up 14% and Yum Brands — owner of Taco Bell, KFC, and Pizza Hut — has gained 13%. That performance gap points to a laundry list of McDonald's-specific problems: underperforming value deals, slowing US growth , falling guest counts, slipping service and satisfaction, and a disappointing World Cup promot", "date_str": "2026-09-24T09:50:01+00:00", "hash": "f2b008a42404439e", "title_fa": "مک‌دونالدز 8.5 میلیارد دلار مک‌میکور ارائه می‌کند. سرمایه گذاران آن را دوست ندارند.", "summary_fa": "Bildagentur-online/Schoening/Universal Images Group از طریق Getty Images مک دونالد جزئیات ابتکار جدید 8.5 میلیارد دلاری \"بعدی\" خود را به اشتراک گذاشت و سرمایه گذاران شانه های خود را بالا انداختند. با توجه به اینکه سهام در حال حاضر به پایین ترین حد خود در چهار سال اخیر رسیده است، این شرکت باید ثابت کند که چرخش در ایالات متحده کار می کند. برای اولین تجارت، خبرنامه بازارهای روزانه Business Insider ثبت نام کنید. اگر اخیراً در مک‌دونالدز بوده‌اید، فراموش نشدنی‌ترین تصویر در ذهن شما احتمالاً ردیفی از کیوسک‌های سفارشی با صفحه نمایش لمسی است. برای افرادی که تمایل به دیجیتال دارند و به دنبال مکالمه نیستند، می توانند نجات دهنده باشند. اما افراد زیادی وجود دارند که نمی‌خواهند از پس زدن کلید خود برآیند – که ترجیح می‌دهند با یک انسان ارتباط برقرار کنند. شانس سخت این روزها ممکن است اصلاً کسی نباشد که با پیشخوان کار کند. این تعاملات غیرشخصی با مشتری تنها یکی از مسائلی است که مک‌دونالد در تلاش است با ابتکار جدید «بعدی» خود، که در روز چهارشنبه در روز سرمایه‌گذارش توضیح داد، به آن رسیدگی کند. این شرکت تقریباً 8.5 میلیارد دلار برای کمک به فرنچایزها هزینه خواهد کرد تا رستوران‌های خود را بازسازی کنند، با هدف بهبود کیفیت غذا، ساده‌سازی عملیات و بهبود تجربه مشتری. این به معنای فشار بیشتر به مرغ و نوشیدنی ها، تجهیزات جدید و طراحی رستوران ها، ابزارهای هوش مصنوعی و آموزش مهمان نوازی بیشتر است. همه اینها در تئوری خوب به نظر می رسد. اما واکنش اولیه سرمایه گذاران چندان دلگرم کننده نبود، زیرا سهام در آن روز 5 درصد سقوط کرد و به پایین ترین سطح خود از سال 2022 رسید. به نظر می رسد وال استریت نسبت به اینکه هزینه های کلان برای تعمیر و نوسازی کسب و کار اصلی مک دونالد به اندازه کافی بازدهی قوی"}, {"source": "Business Insider", "title": "More than 10 million student-loan borrowers are behind on payments — with their wages and Social Security on the line", "link": "https://www.businessinsider.com/student-loan-borrowers-default-delinquency-wages-social-security-garnishment-repayment-2026-9", "summary": "New Federal Student Aid data showed that 9.3 million student-loan borrowers are in default. Kevin Carter/Getty Images New Federal Student Aid data found that 9.3 million student-loan borrowers are in default. An additional 1.5 million borrowers are at risk of defaulting in the next six months. Borrowers who default may face a hit to their credit score and the seizure of wages and federal benefits. The number of student-loan borrowers falling behind on payments continues to grow. New Federal Student Aid data through June 30 showed that over the past quarter, 9.3 million borrowers were in default on their loans, which typically happens after 270 days of nonpayment. That's an increase of 400,000 borrowers since the prior quarter. This brings the total amount of federal student loan debt in default to $234 billion, or about 14% of the overall portfolio. Additionally, 1.5 million borrowers are in late-stage delinquency and at risk of entering default in the next six months, according to FSA. The consequences of default can be severe. In addition to a damaged credit score, borrowers could face wage garnishment, seizure of tax refunds, or loss of part of their Social Security check. The Department of Education has paused wage garnishment and the seizure of federal benefits, indicating that the pause is temporary while the department implements President Donald Trump's repayment changes. Those changes, which took effect July 1, include new repayment plans and the elimination of the Biden-era SAVE plan, which provided borrowers with lower monthly bills. Borrowers have told Business Insider over the past few months that their projected payments have surged under the changes, and they're concerned about the consequences of default. Democratic lawmakers have pushed to stave off those consequences. In August, Sens. Bernie Sanders, Elizabeth Warren, and Ed Markey introduced a bill to prevent older borrowers and borrowers with disabilities from facing Social Security garnishment in the event of a default. Sanders said in a statement that \"in the richest country in the history of the world, no senior should have their Social Security payments taken away from them to pay back student debt.\" The defaulted portfolio is also undergoing changes: the Education Department announced that it would transfer management of defaulted student loans to the Treasury Department. Business Insider first reported in August that the Treasury is moving forward with the transition by seeking ou", "date_str": "2026-09-24T09:35:01+00:00", "hash": "905df283f688e689", "title_fa": "بیش از 10 میلیون وام گیرنده وام دانشجویی از پرداخت عقب مانده اند - با دستمزد و تامین اجتماعی در خط", "summary_fa": "داده های جدید کمک دانشجویی فدرال نشان می دهد که 9.3 میلیون وام گیرنده وام دانشجویی در حال نکول هستند. کوین کارتر/گتی ایماژز داده های جدید کمک دانشجویی فدرال نشان می دهد که 9.3 میلیون وام گیرنده وام دانشجویی در حال نکول هستند. 1.5 میلیون وام گیرنده دیگر در معرض خطر نکول در شش ماه آینده قرار دارند. وام گیرندگانی که نکول می کنند ممکن است با ضربه به امتیاز اعتباری خود و توقیف دستمزدها و مزایای فدرال مواجه شوند. تعداد وام گیرندگان وام دانشجویی که از پرداخت عقب مانده اند همچنان در حال افزایش است. داده های جدید کمک دانشجویی فدرال تا 30 ژوئن نشان داد که در سه ماهه گذشته، 9.3 میلیون وام گیرنده در پرداخت وام های خود دچار نکول بوده اند که معمولاً پس از 270 روز عدم پرداخت اتفاق می افتد. این افزایش 400000 وام گیرنده نسبت به سه ماهه قبل است. این مقدار کل بدهی وام دانشجویی فدرال را به 234 میلیارد دلار یا حدود 14 درصد از کل مجموعه می رساند. علاوه بر این، طبق گفته FSA، 1.5 میلیون وام گیرنده در مراحل پایانی معوق هستند و در معرض خطر نکول در شش ماه آینده هستند. عواقب نکول می تواند شدید باشد. علاوه بر امتیاز اعتباری آسیب دیده، وام گیرندگان ممکن است با پرداخت دستمزد، ضبط بازپرداخت مالیات یا از دست دادن بخشی از چک تامین اجتماعی خود مواجه شوند. وزارت آموزش اعطای دستمزدها و مصادره مزایای فدرال را متوقف کرده است، که نشان می‌دهد این توقف موقتی است در حالی که این وزارتخانه تغییرات بازپرداخت دونالد ترامپ، رئیس‌جمهور آمریکا را اجرا می‌کند. این تغییرات که از اول ژوئیه به اجرا درآمدند، شامل طرح‌های بازپرداخت جدید و حذف طرح SAVE دوره بایدن است که صورت‌حساب‌های ماهانه کمتری را برای وام‌گیرندگان فراهم می‌کرد. وام گیرندگان در چند ماه گذشته به Business Insider گفته اند"}, {"source": "Business Insider", "title": "I felt unfulfilled as a stay-at-home mom. Now I run a travel business from my bedroom and enjoy the best of both worlds.", "link": "https://www.businessinsider.com/unfulfilled-stay-at-home-mom-launched-online-business-travel-firm-2026-9", "summary": "Nicola Lewis runs her travel company from home. Courtesy of Nicola Lewis Saleswoman Nicola Lewis was thrilled to have a baby after fertility issues. She opted to stay home. The mom loved being with her son but felt unfulfilled because she missed having a career. She researched at-home jobs and launched an online travel business she could do from anywhere. This story is based on an interview with Nicola Lewis, 44, the owner of an online travel business from Essex, England. It has been edited for length and clarity. It had been a long, uphill struggle to become a mom in my late 30s. I'd had a series of miscarriages before I finally gave birth to my son, Harry, almost seven years ago, and he was the center of my universe. Still, after two years of staying at home with him, I felt lost and confused. I was approaching 40, had been out of the workplace for a while, and my confidence was at rock bottom. Have you built a business from home as a parent? Please email Jane Ridley at jridley@businessinsider.com if you'd like to share your story with Business Insider. My confidence was so low, I honestly didn't know if I had a place in the world of work. Before I had my son, I'd been employed my whole adult life, including as a holiday rep in Spain and for wedding venues in Essex. I started off as a sales assistant and, at 26, ended up on the board as sales and marketing director. Lewis and her husband, Ross, and son, Harry, on vacation. Courtesy of Nicola Lewis After leaving the job to travel to Asia and Australia for 18 months, I rejoined the company and stayed for five more years. Next, I bought a bridal shop in 2017. It was a year after I married my husband, Ross, 47, an electrician , and he supported my venture as I threw myself into running my own small business. Our son was our No.1 priority I'd suffered three miscarriages since our wedding. It looked as if we had to try IVF , so I sold the shop in 2019, planning to use the money to pay for treatment. As if by a miracle, we didn't need the intervention. I got pregnant naturally with Harry. I was closely monitored throughout, and he was born safely in December, 2019. For months beforehand, Ross and I discussed what to do next. At that time, I thought, \"Forget the career, our son is our No. 1 priority, and I want to concentrate on him.\" Lewis relaxing with her son, Harry. Courtesy of Nicola Lewis We decided to tighten our belts and live off Ross's wages. We downsized to a smaller house, stopped going to restaurant", "date_str": "2026-09-24T09:31:01+00:00", "hash": "04eff8bb60696e42", "title_fa": "من به عنوان مادری که در خانه می ماندم احساس ناتوانی می کردم. اکنون از اتاق خوابم یک تجارت مسافرتی را اداره می کنم و از بهترین های هر دو دنیا لذت می برم.", "summary_fa": "نیکولا لوئیس شرکت مسافرتی خود را از خانه اداره می کند. نیکولا لوئیس فروشنده نیکولا لوئیس پس از مشکلات باروری از بچه دار شدن هیجان زده شد. او ترجیح داد در خانه بماند. مادر عاشق این بود که با پسرش باشد اما احساس می‌کرد که احساس رضایت نمی‌کرد زیرا دلش برای داشتن یک شغل تنگ شده بود. او در مورد مشاغل خانگی تحقیق کرد و یک تجارت آنلاین مسافرتی راه اندازی کرد که می توانست از هر کجا انجام دهد. این داستان بر اساس مصاحبه ای با نیکولا لوئیس، 44 ساله، صاحب یک تجارت آنلاین مسافرتی از اسکس، انگلستان است. برای طول و وضوح ویرایش شده است. برای مادر شدن در اواخر 30 سالگی سختی طولانی و دشواری را پشت سر گذاشته بودم. من قبل از اینکه در نهایت پسرم هری را تقریباً هفت سال پیش به دنیا بیاورم، یک سری سقط جنین داشتم و او مرکز جهان من بود. با این حال، پس از دو سال که با او در خانه ماندم، احساس گمراهی و سردرگمی کردم. من به 40 سالگی نزدیک می شدم، مدتی بود که از محل کار خارج شده بودم و اعتماد به نفسم به پایین ترین حد رسیده بود. آیا به عنوان والدین یک کسب و کار از خانه ایجاد کرده اید؟ اگر می خواهید داستان خود را با Business Insider به اشتراک بگذارید، لطفاً به جین ریدلی به آدرس jridley@businessinsider.com ایمیل بزنید. اعتماد به نفسم آنقدر پایین بود که راستش نمی دانستم جایی در دنیای کار دارم یا نه. قبل از اینکه پسرم را به دنیا بیاورم، تمام زندگی بزرگسالی ام را به کار گرفته بودم، از جمله به عنوان نماینده تعطیلات در اسپانیا و برای مکان های عروسی در اسکس. من به عنوان یک دستیار فروش شروع کردم و در 26 سالگی به عنوان مدیر فروش و بازاریابی در هیئت مدیره کار کردم."}, {"source": "Business Insider", "title": "'A multiyear evolutionary risk': BofA unpacks the threat Meta's Muse poses to banks", "link": "https://www.businessinsider.com/meta-muse-agentic-ai-assistant-banks-financials-sector-wealth-management-2026-9", "summary": "Bloomberg/Getty Images AI assistants like Meta's Muse poses risks to banks' margins, BofA says. Agentic AI may eventually be able to reallocate idle cash deposits to investments. Banks may need to create their own AI tools to retain customers' money, BofA says. Banks make a lot of their money from depositors leaving their cash sitting idle, but those days could be coming to an end, Bank of America says. In a client note on Wednesday, BofA said agentic AI assistants like Meta's Muse — which can perform tasks autonomously, including making purchases and dealing with account admin— pose a \"multiyear evolutionary risk\" to banks' business models. The thinking goes that these AI assistants could eventually be able to manage and move money for people, automatically allocating funds to certain investments instead of leaving them parked in low-yield savings or checking accounts. \"The takeaway for banks is the precedent, not the e-commerce use case: scaled platforms are plugging payment credentials into a third-party agent,\" Ebrahim H. Poonawala, a research analyst at Bank of America, wrote. \"The gap between 'find me a better product and pay for it' and 'find me a better yield and move my excess cash' is narrowing.\" He added: \"Whereas a chatbot can tell customers they are earning too little, an agent can identify excess liquidity, compare yields and act.\" In savings and checking accounts, banks offer interest rates typically well below even 0.1%. Meanwhile, many money market funds yield around 4% annually. Federal Reserve data shows that around $5.4 trillion dollars is sitting in checking accounts, money that is missing out on higher returns that can compound over the years. According to a study from Bankrate, $10,000 earning 4% per year would earn $2,167 over a five-year period, while one would earn just $5 over that time at a 0.01% interest rate. Banks losing out on those returns would be a big hit to their margins. Investors have recognized the risks for financials sector stocks. The State Street Financial Sel Sec SPDR ETF (XLF) is down 2.4% since the start of trading on Tuesday, while the Invesco KBW Bank ETF (KBWB) has fallen 3.2%. Still, agentic AI won't take hold overnight, giving banks time to react, Bank of America said. One route they can take is to \"self-cannibalize\" and institute their own AI assistant to help customers to manage their money. This way, BofA said, the banks can at least keep the money in-house with their own investment products. \"Banks wi", "date_str": "2026-09-24T09:25:01+00:00", "hash": "21c92ea96e4d562a", "title_fa": "\"یک ریسک تکاملی چند ساله\": BofA تهدیدی را که Meta's Muse برای بانک ها ایجاد می کند باز می کند.", "summary_fa": "BofA می‌گوید دستیاران هوش مصنوعی بلومبرگ/گتی ایماژز مانند Meta's Muse خطراتی را برای حاشیه سود بانک‌ها به همراه دارند. هوش مصنوعی عامل ممکن است در نهایت بتواند سپرده های نقدی بیکار را به سرمایه گذاری ها تخصیص دهد. BofA می‌گوید بانک‌ها ممکن است نیاز به ایجاد ابزارهای هوش مصنوعی خود برای حفظ پول مشتریان داشته باشند. بانک‌های آمریکا می‌گویند، بانک‌ها پول زیادی را از سپرده‌گذارانی به دست می‌آورند که نقدینگی خود را بدون کار می‌گذارند، اما آن روزها ممکن است به پایان برسد. در یادداشت مشتری در روز چهارشنبه، BofA گفت دستیاران هوش مصنوعی مانند Meta's Muse - که می توانند وظایف خود را به طور مستقل انجام دهند، از جمله خرید و معامله با مدیر حساب - یک \"خطر تکاملی چند ساله\" برای مدل های تجاری بانک ها ایجاد می کنند. تصور می‌شود که این دستیاران هوش مصنوعی در نهایت می‌توانند بتوانند پول را مدیریت کرده و برای افراد جابه‌جا کنند، به‌طور خودکار وجوه را به سرمایه‌گذاری‌های خاصی اختصاص دهند، به‌جای اینکه آن‌ها را در پس‌اندازهای کم‌بازده یا حساب‌های چک کنند. ابراهیم اچ. پوناوالا، تحلیلگر پژوهشی در بانک آمریکا، می‌نویسد: «دستورالعمل برای بانک‌ها سابقه است، نه مورد استفاده از تجارت الکترونیک: پلت‌فرم‌های مقیاس‌پذیر، اعتبار پرداخت را به یک عامل شخص ثالث متصل می‌کنند». شکاف بین «محصول بهتری برای من بیابید و برای آن بپردازید» و «بازدهی بهتری برای من بیابید و نقدینگی اضافی ام را انتقال دهید» در حال کاهش است. وی افزود: در حالی که یک ربات چت می تواند به مشتریان بگوید که درآمد بسیار کمی دارند، یک نماینده می تواند نقدینگی مازاد را شناسایی کند، بازده را مقایسه کند و عمل کند. در حساب‌های پس‌انداز و جاری، بانک‌ها نرخ‌های بهره را معمولاً حتی زیر 0.1 درصد ارائه می‌کنند. در همین حال، بسیاری از صندوق‌های بازار پول سالانه حدود 4 درصد سود دارند. داده های فدرال رزرو"}, {"source": "Business Insider", "title": "Trump made nearly 40x more trades in a month than his hedge-funder Treasury Secretary Scott Bessent made in a whole year", "link": "https://www.businessinsider.com/trump-made-40x-more-trades-july-bessent-made-2025-2026-9", "summary": "Treasury Secretary Scott Bessent and President Donald Trump. Win McNamee/Getty Images Trump's trading spree has continued, with more than 1,100 July trades disclosed earlier this week. Meanwhile, his Treasury Secretary made nearly 40 times fewer trades all of last year. Trump Organization says the trades aren't in Trump's control, but the volume remains unprecedented. President Donald Trump made nearly 40 times as many trades in July of this year as his Treasury Secretary Scott Bessent, a former hedge fund manager, made all of last year. The president's unprecedented trading habits continued over the summer. He reported recording 1,156 trades in July, according to his latest report to the Office of Government Ethics, released on Tuesday. Meanwhile, Bessent released his 2025 annual disclosures on Wednesday, revealing that he made only 29 transactions last year — all sales. Only three of the sales were in individual stocks, and eight were sales of interests in funds run by Key Square Partners, the firm he left to become Treasury Secretary. As a member of Trump's cabinet, Bessent was legally required to divest, or make other arrangements, of most of his holdings when he joined the administration. That's a requirement that the President and Vice President are exempt from. Trump's support for a congressional stock trading ban would also not apply to the President or Vice President. The Trump Organization didn't respond to a request for comment. It previously told Business Insider that the volume of Trump's trades is the result of automated trading strategies, which are out of the president's control. As Business Insider previously reported, Trump's trades track direct-indexing strategies , known for allowing investors to track the performance of major indexes while also claiming individual stock losses for tax purposes, thereby reducing tax liability. Therefore, Trump's trades, which occur substantially more often than any other American politician, are more likely due to portfolio \"rebalancing\" rather than to him actually exiting a position. But that doesn't mean they're not still well outside the norms for politicians, even those with illustrious business careers and complicated finances. \"The irony of it is that he's taken a real leadership role in pushing forward regulation on politicians' trading, and then blew it up himself,\" said Dan Weiskopf, a portfolio manager for Tidal Financial Group who runs two ETFs based on politicians' trades: NANC, as in Nancy ", "date_str": "2026-09-24T09:16:01+00:00", "hash": "2de0b81cdf7c9314", "title_fa": "ترامپ در یک ماه نزدیک به 40 برابر بیشتر از اسکات بسنت، وزیر خزانه داری که در یک سال تمام انجام داد، معاملات انجام داد.", "summary_fa": "اسکات بسنت وزیر خزانه داری و دونالد ترامپ رئیس جمهور آمریکا. Win McNamee/Getty Images ولگردی و ولگردی تجاری ترامپ ادامه دارد و بیش از 1100 معامله در ماه جولای در اوایل این هفته فاش شد. در همین حال، وزیر خزانه داری او در تمام سال گذشته تقریباً 40 برابر کمتر معاملات انجام داد. سازمان ترامپ می گوید معاملات در کنترل ترامپ نیست، اما حجم معاملات بی سابقه است. دونالد ترامپ، رئیس‌جمهور آمریکا در جولای سال جاری تقریباً 40 برابر تعداد معاملات سال گذشته اسکات بسنت، وزیر خزانه‌داری او، مدیر سابق صندوق تامینی، انجام داد. عادات تجاری بی سابقه رئیس جمهور در تابستان ادامه یافت. وی بر اساس آخرین گزارش خود به دفتر اخلاق دولت که روز سه شنبه منتشر شد، از ثبت 1156 معامله در ماه جولای خبر داد. در همین حال، Bessent افشای سالانه 2025 خود را روز چهارشنبه منتشر کرد و فاش کرد که در سال گذشته تنها 29 تراکنش انجام داده است - همه فروش. تنها سه مورد از فروش‌ها در سهام منفرد بود و هشت مورد مربوط به فروش سهام در صندوق‌هایی بود که توسط Key Square Partners اداره می‌شد، شرکتی که او برای سمت وزیر خزانه‌داری ترک کرد. بسنت به عنوان یکی از اعضای کابینه ترامپ، از نظر قانونی موظف بود در زمان پیوستن به دولت، بیشتر دارایی های خود را واگذار کند یا ترتیبات دیگری را انجام دهد. این الزامی است که رئیس جمهور و معاون رئیس جمهور از آن مستثنی هستند. حمایت ترامپ از ممنوعیت معاملات سهام کنگره نیز شامل رئیس جمهور یا معاون رئیس جمهور نمی شود. سازمان ترامپ به درخواست برای اظهار نظر پاسخی نداد. قبلاً به Business Insider گفته بود که حجم معاملات ترامپ نتیجه استراتژی های معاملاتی خودکار است که خارج از کنترل رئیس جمهور است. همانطور که Business Insider قبلا گزارش داده بود، معاملات ترامپ استراتژی‌های نمایه‌سازی مستقیم"}, {"source": "Business Insider", "title": "I’m Lo Bosworth. I Slack from the bathtub, eat salad for breakfast, and block out time on my calendar for my baby.", "link": "https://www.businessinsider.com/lo-bosworth-power-hours-typical-day-in-life-working-bath-2026-9", "summary": "Lo Bosworth is the founder of Love Wellness Courtesy of Love Wellness This as-told-to essay is based on a conversation with 39-year-old Lo Bosworth, a reality TV star and the founder of Love Wellness, who lives in New York City. It has been edited for length and clarity. As far back as my time on \"Laguna Beach: The Real Orange County\" and \"The Hills,\" I knew I wanted to build something. I was always coming up with business ideas; it's how I express myself creatively. I founded Love Wellness, my women's well-being brand, in 2016. Since having my daughter, Nelle, in January, life has gotten a lot busier. I launched my podcast, \"Tell Me I'm a Good Mom,\" a couple of months after having her. Balancing motherhood, the podcast, and running Love Wellness is a lot of work. No matter how busy we are, my husband and I always start the day with our daughter and put her to bed together at night. Those two moments keep us connected as a family. Here's a typical day in my life as a first-time mom , podcast host, and founder. My day begins between 6:30 and 7 a.m., when my daughter usually wakes up We give Nelle her bottle, and then all of us, including the dog, take a pre-8 a.m. walk. We're usually the first people hitting the pavement. We always get coffee. I'm very traditional with my order: drip coffee with half-and-half. I tend to have only one because I'm sensitive to caffeine. Our walk is about 15 to 30 minutes, and we're home by about 8:15 a.m. Lo Bosworth s typical day involves balancing motherhood, a podcast, and running her business. Courtesy of Love Wellness Once our nanny arrives, I get ready for the day by taking a bath. I'm a huge tub girl and bathe twice a day. This may sound crazy, but I shower first because I don't want to sit in my sleep juices. Taking a bath is a huge part of my wellness routine. It helps me focus, and I do my best thinking in there. In the bath, I'm Slacking, sending emails, and video-editing. I call it a working bath. I don't really like the idea of breakfast. If I eat, it's usually something savory, like leftover salad from the night before. This morning, I had leftover pea and chicken salad. It's high in fiber and protein. When I work from home, I get a workout in On WFH days, which are typically twice a week, I'll go to my building's gym for a 35-minute workout before starting work. Since having my baby, I've been doing strength training . I use Ladder, which connects with Spotify, so I can listen to music while the instructor tell", "date_str": "2026-09-24T09:05:02+00:00", "hash": "34f8fc131a8d607c", "title_fa": "من لو بوسورث هستم. من از وان حمام سست می‌شوم، برای صبحانه سالاد می‌خورم، و زمان را در تقویم خود برای کودکم محدود می‌کنم.", "summary_fa": "Lo Bosworth بنیانگذار Love Wellness Courtesy of Love Wellness این مقاله گفته شده بر اساس گفتگو با Lo Bosworth 39 ساله، ستاره تلویزیون واقعیت و بنیانگذار Love Wellness است که در شهر نیویورک زندگی می کند. برای طول و وضوح ویرایش شده است. از زمانی که در «لاگونا بیچ: اورنج کانتی واقعی» و «هیلز» بودم، می‌دانستم که می‌خواهم چیزی بسازم. من همیشه ایده های تجاری داشتم. من خودم را خلاقانه بیان می کنم. من Love Wellness، نام تجاری رفاه زنانم را در سال 2016 تأسیس کردم. از زمانی که در ژانویه دخترم،
