      media: [{"source": "Billboard", "title": "Messina Touring Group Looks To The Future: ‘As Things Are Changing, We Adapt’", "link": "https://www.billboard.com/pro/messina-touring-group-next-generation-executives/", "summary": "The only job Haley McCollister has ever had has been at Messina Touring Group. Since joining the company’s ticketing department at 22 years old, she’s worked her way up and now serves as president of MTG’s Nashville office. “The more he believed in me, the more I believed in myself,” McCollister says. McCollister notes that many of her MTG colleagues have been with the company since they started their first jobs out of college. This is due to company founder Louis Messina ’s strong belief in each employee, with McCollister likening his support to how he strengthens his relationships with his artists. Related Michael Sanft, Attorney Who Represented Keffe D in 2Pac Murder Trial, Dies at 54 Touring Power Players: Billboard’s 2026 List Revealed Meet the ‘Unflappable’ Exec Bringing Superstars To Madison Square Garden and Sphere Aside from McCollister, key members of the next generation at MTG include senior vp Sara Winter , vp of touring Keena Cheatham and vp Rachel Powers . As the company continues to support its promoters, Messina has been passing more responsibilities onto his fellow teammates and providing them opportunities to foster their own artists. MTG maintains a small artist roster, wanting to provide all its attention to each client rather than having each person focus on multiple acts. “We’re not out there chasing everything,” McCollister says. “To keep it this way, we have to grow very slowly. To find the ‘right’ artist for us to grow with starts with someone being extremely passionate about them and feeling it’s the right fit. And Louis is really supportive of us.” McCollister and her colleagues fell in love with Phoebe Bridgers while she was opening for Taylor Swift on The Eras Tour and began discussions about bringing her into the fold. Messina came on board, and Bridgers is now promoted by MTG. As the company looks ahead to its next quarter-­century, the team members feel they’re operating in a way they hope to be able to sustain. “For the next 25 years, it’s going to look similar to what we’ve already done,” McCollister says. “As the business continues to change, that doesn’t impact how we operate, because we’ve always operated unique to each individual artist. As things are changing, we adapt with them and are continuing to deliver long-term success.” This story appears in the Nov. 7, 2026, issue of Billboard.", "date_str": "2026-11-10T17:00:00+00:00", "hash": "7c579088ceaaa401", "title_fa": "گروه تورینگ مسینا به آینده نگاه می کند: \"همانطور که همه چیز در حال تغییر است، ما سازگار می شویم\"", "summary_fa": "تنها کاری که هیلی مک کولیستر تا به حال داشته است، در گروه تورینگ مسینا بوده است. از زمانی که در 22 سالگی به بخش فروش بلیت شرکت پیوست، او راه خود را ادامه داد و اکنون به عنوان رئیس دفتر MTG در نشویل فعالیت می کند. مک کولیستر می گوید: «هر چه او بیشتر به من ایمان داشت، من هم به خودم ایمان داشتم. مک کولیستر خاطرنشان می کند که بسیاری از همکاران او در MTG از زمانی که اولین شغل خود را خارج از کالج شروع کرده اند، در این شرکت بوده اند. این به دلیل اعتقاد قوی بنیانگذار شرکت، لوئیس مسینا به هر یک از کارکنان است، و مک کولیستر حمایت او را با نحوه تقویت روابط خود با هنرمندانش تشبیه می کند. مرتبط مایکل سانفت، وکیل مدافع Keffe D در دادگاه قتل 2Pac، در 54 بازیکن قدرتمند تورینگ درگذشت: فهرست 2026 بیلبورد فاش شد. وی پی وی سی کینا چیتام و وی پی ریچل پاورز. همانطور که این شرکت به حمایت از مروجین خود ادامه می دهد، مسینا مسئولیت های بیشتری را بر دوش هم تیمی های خود محول می کند و فرصت هایی را برای آنها فراهم می کند تا هنرمندان خود را پرورش دهند. MTG فهرست هنرمندان کوچکی را حفظ می‌کند، و می‌خواهد تمام توجه خود را به هر مشتری جلب کند تا اینکه هر فرد روی چندین کار تمرکز کند. مک کولیستر می گوید: «ما به دنبال همه چیز نیستیم. برای حفظ این وضعیت، باید خیلی آهسته رشد کنیم. پیدا کردن هنرمند \"مناسب\" برای رشد ما با شخصی شروع می شود که به شدت به آنها علاقه دارد و احساس می کند که مناسب است. و لوئیس واقعاً از ما حمایت می کند.\" مک کولیستر و همکارانش در حالی که فیبی بریجرز را برای تیلور سوئیفت در تور Eras افتتاح می کرد، عاشق", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/messina-execs-billboard-2026-bb12-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["رسانه", "هنر"], "datetime_fa": "۱۹ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "Stop the Sliming! Ashe to Perform Her ‘Wedding’ Hit at 2026 Kids’ Choice Awards", "link": "https://www.billboard.com/music/awards/kids-choice-awards-2026-performers-ashe-sofi-tukker-1236378302/", "summary": "The target audience for the Kids’ Choice Awards is years away from thinking about getting married, but they know a catchy song when they hear one. And they’re going to hear one when Ashe sings her current smash “Stop the Wedding!” at CBS Presents Nickelodeon Kids’ Choice Awards on Saturday, Nov. 14 (8-9:30 p.m. ET/5-6:30 p.m. PT). “Stop the Wedding!” has so far climbed as high at No. 23 on the Billboard Hot 100 . Related How Ashe s Stop the Wedding! Became Her Biggest Hit: There Are No Rules Here Noah Kahan Reacts to First Kids Choice Award Nomination: Holy Sh I Finally Did It Cue the Slime: Taylor Swift, Ariana Grande Sabrina Carpenter Lead 2026 Kids Choice Awards Nominations: Full List Sofi Tukker is also set to perform on the show. The duo will perform their dance track “Tsunami,” which is a collaboration with One Republic in its recorded version. Sofi Tukker, its name inspired by the name of a singer of comical and risqué songs who was popular in the first half of the 20th century, consists of Sophie Hawley-Weld and Tucker Halpern. Hosted by Alex Warren , who has notched four top 40 hits on the Hot 100, including his 2025 megahit “Ordinary,” the Kids’ Choice Awards will broadcast live from Television City in Hollywood. The show will air on CBS and Nickelodeon and stream live on Paramount+ for Premium subscribers in the U.S., with on-demand viewing available the following day for Premium and Essential subscribers. The show will also be available globally on Paramount+ following its linear premiere on Nickelodeon and CBS. Actor Chris Pratt was recently announced as this year’s recipient of the King of Comedy Award, which went to Adam Sandler in 2023 and Jack Black in 2025. The KCAs are produced by Done + Dusted. Voting is open now at kidschoiceawards.com .", "date_str": "2026-11-10T17:00:00+00:00", "hash": "32dcdd9fe85a7695", "title_fa": "لاغری را متوقف کنید! Ashe آهنگ «عروسی» خود را در جوایز انتخاب کودکان 2026 اجرا خواهد کرد", "summary_fa": "مخاطبان مورد نظر برای جوایز انتخاب کودکان سال ها از فکر ازدواج دور هستند، اما با شنیدن آن آهنگ جذابی را می شناسند. و زمانی که Ashe آهنگ جدیدش \"Stop the Wedding\" را بخواند، یکی را خواهند شنید. در CBS جوایز انتخاب کودکان نیکلودئون را در روز شنبه، 14 نوامبر (8 تا 9:30 بعد از ظهر به وقت محلی / 5 تا 6:30 بعد از ظهر PT) ارائه می کند. \"عروسی را بس کن!\" تا کنون به عنوان 23 در Billboard Hot 100 صعود کرده است. مطالب مرتبط چگونه آش عروسی را متوقف می کند! به بزرگترین موفقیت او تبدیل شد: اینجا قوانینی وجود ندارد نوح کاهان به اولین انتخاب بچه ها واکنش نشان می دهد نامزدی جایزه: Holy Sh I سرانجام Did It Cue the Slime: تیلور سوئیفت، آریانا گرانده سابرینا کارپنتر پیشرو 2026 نامزدهای جوایز انتخاب کودکان: فهرست کامل سوفی توکر نیز قرار است در نمایش اجرا کند. این دو آهنگ رقص خود \"سونامی\" را که با همکاری One Republic در نسخه ضبط شده آن است، اجرا خواهند کرد. Sofi Tukker، نام آن الهام گرفته از نام خواننده آهنگ های کمیک و خطرناک که در نیمه اول قرن بیستم محبوب بود، متشکل از سوفی هاولی-ولد و تاکر هالپرن است. به میزبانی الکس وارن، که چهار 40 بازدید برتر در هات 100، از جمله مگا آهنگ 2025 او \"Ordinary\" را به خود اختصاص داده است، جوایز منتخب کودکان به طور زنده از شهر تلویزیونی در هالیوود پخش می شود. این برنامه از شبکه‌های CBS و Nickelodeon پخش می‌شود و برای مشترکین Premium در ایالات متحده به صورت زنده در Paramount+ پخش می‌شود، و در روز بعد برای مشترکین Premium و Essential امکان مشاهده بر اساس تقاضا در دسترس خواهد بود. این نمایش همچنین پس از پخش خطی آن در Nickelodeon و CBS به صورت جهانی در Paramount+ در دسترس", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/2302461103-e1794261097641.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۰:۳۰"}, {"source": "Billboard", "title": "MusiCares’ 2026 Wellness in Music Survey: 5 Statistics That Paint a Sobering Picture", "link": "https://www.billboard.com/lists/musicares-2026-wellness-in-music-survey-5-statistics/", "summary": "MusiCares shared key findings from its 2026 Wellness in Music Survey on Tuesday (Nov. 10), revealing that financial instability, limited access to healthcare and persistent mental health challenges remain closely interconnected across the music industry. More than 3,300 music professionals responded to this year’s survey in English and Spanish, representing every U.S. state and Puerto Rico and more than 40 professions across the industry. The annual survey examines more than 100 indicators, including financial security, physical and mental health, access to health insurance and preventive care, substance use and confidence in sustaining a career in music. MusiCares’ takeaway from the study: “Taken together, the 2026 findings point to a need for the industry to look beyond individual wellness interventions and more closely examine the underlying conditions affecting whether music professionals can build healthy, sustainable careers.” Related U2 to Be Honored as 2027 MusiCares Persons of the Year Paul Grein This year’s survey also included dedicated outreach to emerging music professionals aged 18 to 24 with support from Live Free 999, a nonprofit founded by Carmela Wallace in honor of her son, the late rapper Juice WRLD , offering a closer look at the challenges facing the next generation entering the industry. Since its founding in 1989, MusiCares has distributed more than $146 million in financial assistance to the music community. Findings from the Wellness in Music Survey help MusiCares identify where needs are most urgent. In recent years, survey findings have helped shape expanded services, including access to women’s and family care through Maven Clinic, increased education around cannabis use, and scaled preventive care services. Following last year’s Wellness in Music data showing persistently high rates of suicidal ideation among music professionals, MusiCares also expanded its mental health resources through Tune Into Mental Health, developed with The Jed Foundation (JED) to provide mental health and suicide prevention resources tailored specifically to the music community.", "date_str": "2026-11-10T16:53:12+00:00", "hash": "1015f9fb5c567289", "title_fa": "نظرسنجی سلامتی در موسیقی 2026 MusiCares: 5 آماری که تصویری هشیار کننده را نشان می دهد", "summary_fa": "MusiCares یافته‌های کلیدی از نظرسنجی سلامتی در موسیقی 2026 خود را در روز سه‌شنبه (10 نوامبر) به اشتراک گذاشت و نشان داد که بی‌ثباتی مالی، دسترسی محدود به مراقبت‌های بهداشتی و چالش‌های مداوم سلامت روان همچنان در سراسر صنعت موسیقی به هم مرتبط هستند. بیش از 3300 متخصص موسیقی به نظرسنجی امسال به زبان انگلیسی و اسپانیایی پاسخ دادند که نماینده هر ایالت ایالات متحده و پورتوریکو و بیش از 40 حرفه در سراسر صنعت بودند. این نظرسنجی سالانه بیش از 100 شاخص از جمله امنیت مالی، سلامت جسمی و روانی، دسترسی به بیمه درمانی و مراقبت های پیشگیرانه، مصرف مواد و اعتماد به حفظ یک حرفه در موسیقی را بررسی می کند. نتیجه‌گیری MusiCares از این مطالعه: «در مجموع، یافته‌های 2026 به نیاز این صنعت اشاره می‌کند که فراتر از مداخلات سلامت فردی نگاه کند و شرایط زیربنایی را که بر اینکه آیا حرفه‌ای‌های موسیقی می‌توانند حرفه‌ای سالم و پایدار بسازند یا خیر، مورد بررسی دقیق‌تر قرار دهد. U2 مرتبط به عنوان افراد سال MusiCares در سال 2027، Paul Grein نظرسنجی امسال همچنین شامل ارتباط اختصاصی با حرفه ای های نوظهور موسیقی 18 تا 24 ساله با حمایت Live Free 999، یک سازمان غیرانتفاعی بود که توسط کارملا والاس به افتخار پسرش، رپر فقید، که به چالش نسل بعدی Juice WRLD تاسیس شد، ارائه شد. صنعت از زمان تأسیس در سال 1989، MusiCares بیش از 146 میلیون دلار کمک مالی به جامعه موسیقی توزیع کرده است. یافته‌های حاصل از بررسی سلامتی در موسیقی به MusiCares کمک می‌کند تا تشخیص دهد نیازهای ضروری‌تر در کجاست. در سال‌های اخیر، یافته‌های نظرسنجی به شکل‌گیری خدمات گسترده، از جمله دسترسی به مراقبت‌های زنان و خانواده از طریق کلینیک Maven، افزایش آموزش در مورد مصرف حشیش، و خدمات مراقبت پیشگیرانه مقیاس‌پذیر کمک کرده است. به دنبال داده‌های سال گذشته Wellness in Music که نشان‌دهنده", "image_url": "", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری", "موسیقی"], "datetime_fa": "۱۹ آبان • ۲۰:۲۳"}, {"source": "Billboard", "title": "Lil Baby Reunites With Chris Brown for Trap&B-Leaning ‘From the Back (Remix)’: Listen", "link": "https://www.billboard.com/music/rb-hip-hop/lil-baby-chris-brown-from-the-back-remix-1236378647/", "summary": "Lil Baby returned with his Fresh album and gave his release week a jolt with the arrival of the From the Back (Remix) on Tuesday (Nov. 10), which features an assist from Chris Brown. Related Lil Baby Says Losing $8 Million in One Day Made Him Quit Gambling Lil Baby s FRESH : All 17 Tracks Ranked Lil Baby Brings ‘Fresh’ to Life: Stream It Now The remix didn t come as a major surprise to die-hard Baby fans, as the Atlanta rapper has teased the Breezy vocals on social media in recent weeks. This marks the second official collaboration between Baby and CB, and their first since 2022 s Addicted, which landed on Brown s Breezy album and peaked at No. 92 on the Billboard Hot 100. The Atlanta native s rugged raps mixed with Breezy s melodies balance out the trap B collab, where CB is right at home. Have your baby mama in a crisis/ Chrome Heart Aventador for my daughter, she ain t even got her license/ I know n as plot against me/ Same n as start to wish me well, but I ain t tripping, Brown rhymes. From the Back features a sample of Mykko Montana and K Camp s 2011 Southern hit Do It, which was also sampled by Lil Uzi Vert on 2019 s Sanguine Paradise. Lil Baby s Fresh arrived on Nov. 6 as the rapper seeks his fifth No. 1 on the Billboard 200. The 31-year-old stopped by The Tonight Show on Sunday (Nov. 8) to deliver an orchestra-led performance of his top 20 Billboard Hot 100 hit Dead Fresh. In an interview with Hot 97 that arrived Monday (Nov. 9), Baby addressed the chatter about him falling off, but he attributed those claims to a wider lens about hip-hop as a whole not having as much of a stranglehold commercially on the charts compared to past years. Hip-hop has fallen off, but I m hip-hop so we gotta get this s t together, he said while taking responsibility for the mainstream step-back from the genre. As for Chris Brown, he s continuing his five-night stay in Atlanta for his R B Tour with Usher, which resumes with a fourth ATL show on Tuesday. Listen to the From the Back (Remix) below.", "date_str": "2026-11-10T16:48:09+00:00", "hash": "7b7931103da3634d", "title_fa": "لیل بیبی دوباره با کریس براون برای Trap&B-Leaning «از پشت (ریمیکس)» متحد شد: گوش کنید", "summary_fa": "لیل بیبی با آلبوم تازه خود بازگشت و با ورود آلبوم From the Back (ریمیکس) در روز سه شنبه (10 نوامبر) که دارای کمک کریس براون است، هفته انتشار خود را تکان داد. Lil Baby می‌گوید از دست دادن 8 میلیون دلار در یک روز او را مجبور به ترک قمار کرد Lil Baby FRESH: همه 17 آهنگ رتبه‌بندی‌شده Lil Baby «تازه» را به زندگی می‌آورد: اکنون آن را پخش کنید، همانطور که خواننده رپ آتلانتا در هفته‌های اخیر در رسانه‌های اجتماعی Brezy گفته است، ریمیکس برای طرفداران سرسخت Baby شگفت‌انگیز نبود. این دومین همکاری رسمی بین Baby و CB است، و اولین همکاری آنها پس از Addicted در سال 2022 است که در آلبوم Breezy براون قرار گرفت و در رتبه 92 در بیلبورد Hot 100 قرار گرفت. رپ های خشن بومی آتلانتا با ملودی های Breezy ترکیب شده است، CBcol درست در خانه تعادل برقرار می کند. مادر بچه‌تان را در یک بحران قرار دهید/ Chrome Heart Aventador برای دخترم، او حتی مجوزش را هم نگرفته است/ من می‌دانم n توطئه‌ای علیه من است/ همان چیزی است که برای من آرزوی خوب می‌کند، اما من نمی‌ترسم، قافیه‌های قهوه‌ای. From the Back نمونه‌ای از Mykko Montana و K Camp 2011 South Do It را به نمایش می‌گذارد که توسط Lil Uzi Vert در Sanguine Paradise در سال 2019 نمونه‌برداری شد. Lil Baby Fresh در 6 نوامبر وارد شد زیرا رپر به دنبال پنجمین شماره 1 خود در بیلبورد 200 است. این مرد 31 ساله یکشنبه (8 نوامبر) برای اجرای ارکستر از 20 آهنگ برتر بیلبورد Hot 100 آهنگ Dead Fresh در برنامه The Tonight Show توقف کرد. در مصاحبه‌ای با Hot 97 که دوشنبه (9 نوامبر) منتشر شد، بیبی به صحبت‌هایی درباره سقوطش پرداخت، اما او این ادعاها را به لنز وسیع‌تری درباره هیپ‌هاپ نسبت داد که در مقایسه", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/lil-baby-kendall-bessent-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۰:۱۸"}, {"source": "Billboard", "title": "Rochelle Fleming, Singer With ‘Let No Man Put Asunder’ Disco Act First Choice Dies at 72", "link": "https://www.billboard.com/music/pop/rochelle-fleming-death-singer-disco-first-choice-dies-obituary-1236378654/", "summary": "Richelle Fleming-Finney, the co-founder and lead vocalist of Philadelphia disco soul group First Choice died on Nov. 5 at age 72. The news was announced on the singer s Instagram page over the weekend in a message that read, It is with a heavy heart to share the passing of, Rochelle Fleming-Finney. She was the founder of the R B group, First Choice. She passed away on November 5, 2026 at the age of 72 in Philadelphia, Pennsylvania. The memorial continued, She bought light, laughter and love to the world. Services to celebrate her life will be announced at a later date. Thank you for your support during this difficult time. Fleming, who was born in Philadelphia on Feb. 11, 1954, formed her first vocal group in high school, the Debonettes, with fellow singers Annette Guest and Wardell Piper, later changing their name to First Choice while still students at Philly s Overbrook High School. The budding dance soul group scored their first hit in 1973 with the early-disco burner Armed and Extremely Dangerous , which ran up to No. 11 on the Billboard R B chart and had the hallmarks of the soon-to-explode genre, from syncopated bass to yearning vocals, a string section and a beat you could move your feet to. Piper appeared on the group s debut album, 1973 s Armed and Extremely Dangerous , but left shortly before its release, replaced by Joyce Jones on the LP that featured the funky workout Smarty Pants . Following the addition of Jones, the group charted their first legit chart hit, the string-soaked No. 7 R B chart jam and title track from their sophomore release The Player, about a no-good double-dealer who they warned would Shoot you down/ Right down to the ground. Following Jones departure, after releasing two LPs on Philly Groove, the group jumped to Warner Bros. Records and released their third LP in 1976, So Let Us Entertain You , featuring such disco chart staples as First Choice Theme/Ain t He Bad and Are You Ready For Me? The act scored a number of other hits in the mid-to-late 70s, including Doctor Love, Guilty and Let No Man Put Asunder, which has been sampled on dance tracks and remixes from UGK, Liquid Crystal, Special Ed, 2Pac, House of Pain, Nitzer Ebb and many more, and was covered by Mary J. Blige on her 1999 Mary album. In 2019, J. Cole sampled the group s song Wake Up to Me on his track Middle Child and, in a testament to the group s enduring impact on techno and dance music, Kaytranada sampled Love Thang on his 2019 single 10%, which won a best", "date_str": "2026-11-10T16:37:17+00:00", "hash": "7a6a452a2c8e06c5", "title_fa": "راشل فلمینگ، خواننده با نام «بگذار هیچ کس از کار بیفتد» انتخاب اول دیسکو در سن ۷۲ سالگی درگذشت.", "summary_fa": "ریشل فلمینگ-فینی، یکی از بنیانگذاران و خواننده اصلی گروه روح دیسکو فیلادلفیا، انتخاب اول، در 5 نوامبر در سن 72 سالگی درگذشت. این خبر در صفحه اینستاگرام این خواننده در آخر هفته در پیامی اعلام شد که در آن نوشته شده بود، با قلب سنگین درگذشت راشل فلمینگ-فینی را به اشتراک می‌گذارم. او بنیانگذار گروه R B، انتخاب اول بود. او در 5 نوامبر 2026 در سن 72 سالگی در فیلادلفیا، پنسیلوانیا درگذشت. این یادبود ادامه یافت، او نور، خنده و عشق را برای جهان خرید. خدمات جشن زندگی او متعاقبا اعلام خواهد شد. از حمایت شما در این دوران سخت سپاسگزاریم. فلمینگ که در 11 فوریه 1954 در فیلادلفیا به دنیا آمد، اولین گروه آوازی خود را در دبیرستان به نام Debonettes با خوانندگان دیگر آنت گست و واردل پایپر تشکیل داد و بعداً در حالی که هنوز در دبیرستان اوربروک فیلی تحصیل می کرد، نام خود را به انتخاب اول تغییر داد. گروه روح نوپا رقص اولین موفقیت خود را در سال 1973 با آهنگ دیسکوی اولیه Armed and Extremely Dangerous به ثمر رساند که در جدول بیلبورد R B رتبه 11 را کسب کرد و دارای ویژگی های سبکی بود که به زودی منفجر می شود، از باس همزمان گرفته تا آوازهای مشتاق، یک بخش زهی و یک ضرب آهنگ می تواند شما را به حرکت درآورد. پایپر در اولین آلبوم گروه، 1973 مسلح و بسیار خطرناک ظاهر شد، اما اندکی قبل از انتشار آن را ترک کرد و جویس جونز در ال‌پی جایگزین شد که شامل تمرین بد بو، شلوار هوشمند بود. پس از اضافه شدن جونز، گروه اولین موفقیت خود را در چارت چارت، ترانه شماره 7 R B و تراک تیتراژ نسخه دوم خود، The Player، در مورد یک فروشنده غیرخوب که به شما هشدار داده بودند شما را شلیک می کند/را به زمین", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/rochelle-fleming-1979-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۰:۰۷"}, {"source": "Billboard", "title": "Josh Van Valkenburg Named President of UMPG Nashville, Troy Tomlinson to Shift Into Advisory Role", "link": "https://www.billboard.com/pro/josh-van-valkenburg-president-umpg-nashville-troy-tomlinson/", "summary": "Nashville music industry veteran Josh Van Valkenburg has been named president at Universal Music Publishing Group Nashville, Billboard has learned. Van Valkenburg, who will report to UMPG chairman/CEO Jody Gerson , will be based in Nashville and will assume the new role on Jan. 4, 2027. Concurrently, longtime UMPG Nashville chairman/CEO Troy Tomlinson will transition to an exclusive advisory role supporting the company, its songwriters and its artists. Related How Jody Gerson Has Made Publishing The Hot Business Right Now Michael Sanft, Attorney Who Represented Keffe D in 2Pac Murder Trial, Dies at 54 Kenny MacPherson, Veteran Music Publisher and Big Deal Music Co-Founder, Dies at 71 In his new position, Van Valkenburg will oversee the management and creative direction of UMPG Nashville, leading the company in identifying, signing and developing rising talent, while supporting its roster of songwriters, artists and producers. He will continue to deepen the company’s relationships throughout Nashville’s creative community, as well as expand opportunities for the company’s songwriters and catalogs. Van Valkenburg most recently served as executive vp of creative at Sony Music Publishing Nashville. He was promoted to the role in 2021 and oversaw A R strategy, songwriter development and creative opportunities for the company’s roster of songwriters and writer-artists. He has led Sony Music Publishing Nashville’s creative efforts since 2015 and previously served as senior vp of creative. Van Valkenburg began his music publishing career at EMI Music Publishing in 2006, joined its A R team as creative manager in 2008, and became creative director at Sony/ATV in 2012. During his career, Van Valkenburg has signed and been a champion for top songwriters including ASCAP songwriter of the year winner Josh Osborne , four-time BMI songwriter of the year winner Ross Copperman and SESAC songwriter of the year winner Jon Nite . Van Valkenburg has also championed hitmakers and award winners like Chris DeStefano , Natalie Hemby , Matt Rogers and Lindsay Rimes . He has also been involved in the careers of writers and artists including Ella Langley, Lainey Wilson, Thomas Rhett, Brett Eldredge, Charlie Worsham, Guy Clark and Johnnyswim. Van Valkenburg serves on the CMA board of directors and is an alumni advisor for Leadership Music. Gerson said in a statement, “Country music is more global today than at any time in its history, and the opportunities for Nashville’s songwriters ", "date_str": "2026-11-10T16:31:14+00:00", "hash": "f94f346a0caa57cf", "title_fa": "جاش ون والکنبرگ به عنوان رئیس UMPG نشویل انتخاب شد، تروی تاملینسون به سمت مشاور تغییر کرد", "summary_fa": "بیلبورد دریافته است که جاش ون والکنبرگ، پیشکسوت صنعت موسیقی نشویل، به عنوان رئیس گروه انتشارات موسیقی یونیورسال نشویل انتخاب شده است. ون والکنبرگ، که به جودی گرسون، رئیس/مدیرعامل UMPG گزارش می دهد، در نشویل مستقر خواهد شد و نقش جدید را در 4 ژانویه 2027 به عهده خواهد گرفت. همزمان، تروی تاملینسون، رئیس/مدیر عامل قدیمی UMPG نشویل، به یک نقش مشاوره انحصاری برای حمایت از شرکت، ترانه سرایان و هنرمندان آن تغییر خواهد کرد. مرتبط نحوه انتشار جودی گرسون در حال حاضر کسب و کار داغ مایکل سانفت، وکیل مدافع Keffe D در دادگاه قتل 2Pac، در سن 54 سالگی درگذشت Kenny MacPherson، ناشر کهنه کار موسیقی و یکی از بنیانگذاران Big Deal Music، در سن 71 سالگی درگذشت. شناسایی، امضا و توسعه استعدادهای در حال رشد، در حالی که از فهرست ترانه سرایان، هنرمندان و تهیه کنندگان حمایت می کند. او به تعمیق روابط شرکت در سراسر جامعه خلاق نشویل ادامه خواهد داد و همچنین فرصت ها را برای ترانه سرایان و کاتالوگ های شرکت گسترش خواهد داد. ون والکنبرگ اخیراً به عنوان معاون اجرایی خلاق در انتشارات موسیقی سونی نشویل خدمت کرده است. او در سال 2021 به این نقش ارتقا یافت و بر استراتژی A R، توسعه ترانه سرا و فرصت های خلاقانه برای فهرست ترانه سرایان و نویسنده-هنرمندان شرکت نظارت داشت. او از سال 2015 تلاش‌های خلاقانه انتشارات سونی موزیک نشویل را رهبری کرده است و قبلاً به عنوان معاون ارشد خلاق فعالیت می‌کرد. ون والکنبرگ کار انتشار موسیقی خود را در EMI Music Publishing در سال 2006 آغاز کرد، در سال 2008 به عنوان مدیر خلاق به تیم A R پیوست و در سال 2012 مدیر خلاق Sony/ATV شد. ون والکنبورگ در طول دوران حرفه‌ای خود با ترانه‌سرایان برتر از جمله جاش آزبورن برنده بهترین ترانه‌سرا ASCAP، راس کاپرمن برنده چهار بار برنده ترانه‌سرا", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/Josh-Van-Valkenburg-CR-David-Bradley-billboard.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۲۰:۰۱"}, {"source": "Billboard", "title": "Doechii, T.I. & Yung Miami Lead 2027 Grammys Race for Best Rap Song and Performance: Our Predictions", "link": "https://www.billboard.com/music/awards/2027-grammy-nomination-predictions-rap-song-doechii-cardi-1236374354/", "summary": "From Drake s jaw-dropping triple-album release to impressive stadium runs by Jay-Z and Ye , it s been another busy year for hip-hop. Below, we assess the state of the three single-focused categories in the rap field at the 2027 Grammys: best rap performance, best rap song and best melodic rap performance. Related How Hip-Hop Up-And-Comer AZ Chike’s Debut LP ‘No Rest for the Wicked’ Survived a Leak and Scored Co-Signs From Kendrick Lamar Tyler, the Creator In Rapsody’s World, God Looks a Lot Like You: ‘There’s a Power Within Us That We Haven’t Tapped All the Way Into’ Belly Gang Kushington Is Bringing the Motivation Back to Atlanta Rap: This S t Is Bliss for Me Right Now Best Rap Song Without an active Kendrick Lamar album cycle or competitive submissions from Drake or J. Cole, the Big Three will likely be absent from these three categories — at least as lead artists. That s enough to clear the way for several frontrunners. For this category, Cardi B submitted ErrTime, which topped Rhythmic Airplay and hit No. 43 on the Billboard Hot 100 ; its quotable bars and Jeezy-esque flow should carry it into the final lineup of nominees. That all sounds easy enough, but given that Cardi s sole best rap song nomination was for Bodak Yellow back in 2018, this is far from a done deal. Female rappers have made solid inroads in this category throughout the 2020s, and Doechii and Yung Miami both have strong shots at nominations here. Already a two-time Grammy winner, Doechii is almost guaranteed to show up here with her SZA-assisted Girl, Get Up. That ruminative duet is a nice foil to Yung Miami s Spend Dat, a New York Knicks-embraced summer anthem that soared to the top 20 of the Hot 100 (No. 17), an increasingly rare feat this decade for mainstream rappers not named Drake, Cardi B or Kendrick Lamar. Nonetheless, Lamar will be in contention here, thanks to his featured turn on Baby Keem s Good Flirts, which also features Momo Boyd and has a solid chance of a nomination for best rap performance. Male rappers also scored a handful of hits that could pop up in this category. Don Toliver is a frontrunner across the rap field, and it wouldn t be a surprise to see E85 nominated here. Likewise for Dave Tems Raindance — a near-lock for a best melodic rap performance nod — and Lil Baby s Pharrell-produced Dead Fresh. Near the top of the year, T.I. made an unexpected splash with his top 40 hit Let Em Know (No. 33), and a nod in this category would be his fifth overall and first sin", "date_str": "2026-11-10T16:29:04+00:00", "hash": "4efa8821fc213d12", "title_fa": "دوچی، تی.آی. و یونگ میامی پیشتاز مسابقه گرمی 2027 برای بهترین آهنگ و اجرای رپ: پیش‌بینی‌های ما", "summary_fa": "از انتشار آلبوم سه‌گانه شگفت‌انگیز Drake گرفته تا اجراهای شگفت‌انگیز استادیوم توسط Jay-Z و Ye، سال شلوغ دیگری برای هیپ‌هاپ بود. در زیر، وضعیت سه دسته تک متمرکز در زمینه رپ را در گرمی 2027 ارزیابی می کنیم: بهترین اجرای رپ، بهترین آهنگ رپ و بهترین اجرای رپ ملودیک. مرتبط: چگونه اولین ال پی هیپ هاپ آپ و کامر AZ Chike «No Rest for the Wicked» از نشت و نشانه های مشترک از کندریک لامار تایلر، خالق دنیای Rapsody جان سالم به در برد: «خداوند بسیار شبیه شما است: «در ما قدرتی وجود دارد که همه ما را می توان تابه کرد». آیا انگیزه را به رپ آتلانتا برمی گرداند: این S t Is Bliss for Me Right Now بهترین آهنگ رپ بدون چرخه آلبوم فعال کندریک لامار یا ارسال های رقابتی از دریک یا جی. کول، سه بزرگ احتمالاً در این سه دسته غایب خواهند بود - حداقل به عنوان هنرمندان اصلی. همین کافی است تا راه را برای چند نفر پیشتاز باز کند. برای این دسته، Cardi B ErrTime را ارسال کرد که در صدر Rhy med by Argentina’s Agustina San Martín, who recently directed [ ]", "date_str": "2026-11-10T16:45:00+00:00", "hash": "c3d982c8cd9fd2b7", "title_fa": "BMG's Concord Originals عکس ترسناک گوتیک ماوراء طبیعی \"گرگ در در\" را آماده می کند (اختصاصی)", "summary_fa": "ماه کامل در Concord Originals، بازوی فیلم و تلویزیون در مرکز موسیقی و تئاتر BMG، جایی که در حال توسعه و تولید فیلم ترسناک گوتیک ماوراء طبیعی \"Wolf at the Door\" است، منتشر می شود. بر اساس نمایشنامه ای همنام از Concord Theatricals، این ژانر توسط آگوستینا سن مارتین آرژانتینی ساخته می شود که اخیراً کارگردانی [ ماریزلا تروینو اورتا، نمایشنامه‌نویس، شاعر و فیلمنامه‌نویس، بر اساس نمایشنامه‌اش «گرگ در در»، بخشی از سه‌گانه‌ای از تولیدات تئاتری با الهام از اساطیر لاتین و افسانه‌های برادران گریم. داستان این فیلم در قرن نوزدهم نیومکزیکو اتفاق می‌افتد و بر زن جوانی می‌پردازد که در آستانه به دنیا آوردن اولین فرزندش است، که بازگشت یک موجود نیمه‌گرگ بدخواه نیمه‌مرد را پیش‌بینی می‌کند، اما متوجه می‌شود که یک شکارچی دیگر قبلاً خود را در لابه‌لای غارهای او تثبیت کرده است. بازیگری در حال انجام است. «گرگ در در» توسط معاون اجرایی شرکت Concord Originals که نامزد جایزه امی شده است، سوفیا دیلی (Stax: Soulsville, USA» از HBO) و معاون توسعه چارلز هاپکینز («بیلی پرستون: این روشی است که خدا آن را برنامه ریزی کرد» تولید می شود. کوئیل میگل گومز، ویکتور زارایا و باب ولنتاین از Concord Originals تهیه کنندگان اجرایی. دیلی گفت: \"ما مدیران فیلمبرداری در یک شرکت موسیقی و تئاتر هستیم و این اولین نمایشی است که سفارش داده ایم و کاملاً در داخل آن را توسعه داده ایم. من واقعاً از اینکه این نشان دهنده چیست و چگونه توانایی تیم ما را در فراتر از بسته بندی و ساخت پروژه ها نشان می دهد بسیار هیجان زده هستم.\"", "image_url": "https://variety.com/wp-content/uploads/2026/11/Sophia-Dilley_Charles-Hopkins_Photos.jpg?w=1000&#038;h=563&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۹ آبان • ۲۰:۱۵"}, {"source": "Variety", "title": "As Russell Brand’s Begins a 10-Year Prison Sentence, Why Celebrities Fear the Power of an بابا» است، و در بیشتر موارد، اعصاب او آرام شده است. او از اتاق هتلی در شهر نیویورک، یکی از دو پایگاه خانه اش، در زوم می گوید: «به روز بستگی دارد. فرانکلین، که با کتاب خاطرات فرانکلین «مسائل بابا» زمان خود را بین نیویورک و ایتالیا تقسیم می‌کند، در 10 نوامبر وارد قفسه‌ها می‌شود. یک هفته قبل از انتشار رسمی خاطرات سوفیا فرانکلین، «مسائل بابا» است، و در بیشتر موارد، اعصابش آرام شده است. او از اتاق هتلی در شهر نیویورک، یکی از دو پایگاه خانه اش، در زوم می گوید: «به روز بستگی دارد. فرانکلین که با همسرش زمان خود را بین نیویورک و ایتالیا تقسیم می کند، برای یک ماه فشرده مطبوعات به شهر بازگشته است. من می گویم 90 درصد مواقع فوق العاده هیجان زده هستم. داستان‌های مرتبط، ری به عنوان بهترین هیت‌ساز سال ۲۰۲۶ ورایتی انتخاب شد، اولیویا رودریگو، کاتسی و سینا اسپیرو در دهمین رویداد سالانه هیت‌سازان ورایتی مورد تجلیل قرار می‌گیرند، اما راه برای گفتن طرف او از جدایی انفجاری «باباش را صدا کن» از الکس کوپر به سختی پیش رفته است. هنگامی که فرانکلین برای اولین بار کتاب را در فوریه اعلام کرد، نماینده او یک تماس تلفنی از مت کاپلان، شوهر و شریک تجاری کوپر دریافت کرد که ظاهراً از طرف دیگر فریاد می زد، همانطور که فرانکلین در پیش گفتار کتاب نقل می کند. فرانکلین با پیش بینی واکنش های متقابل، قبلاً برای فرار از سر و صدا، یک جزیره برای فرار رزرو کرده بود. اما این بار او هیچ برنامه ای برای ناپدید شدن ندارد. او می گوید: «من نیازی به این کار احساس نمی کنم. من در مکانی متفاوت از شش سال پیش هستم.", "image_url": "https://variety.com/wp-content/uploads/2026/11/sofia-franklyn-memoir.png?w=1000&#038;h=563&#038;crop=1", "category": "موبایل و گجت‌ها", "tags": ["عامل‌های هوشمند"], "datetime_fa": "۱۹ آبان • ۱۹:۴۱"}, {"source": "Billboard", "title": "‘Fraggle Rock’ Wraps Up ‘A Holiday Gift’ With Festive Musical Special Featuring Nicole Scherzinger: Watch the Trailer", "link": "https://www.billboard.com/culture/tv-film/fraggle-rock-holiday-gift-trailer-video-nicole-scherzinger-1236376748/", "summary": "The Fraggles are back with a festive new musical holiday special, and they re bringing a Tony winner along for the sleigh ride. Fraggle Rock: A Holiday Gift , which premieres globally Dec. 4 on Apple TV, includes Tony nominee Lilli Cooper returning as Doc and Tony winner Nicole Scherzinger performing a snow-covered musical number and Billboard Family is exclusively premiering the trailer below. Related Can You Feel It ?! Watch the Festive First Song From The First Snow of Fraggle Rock Holiday Special Watch Ariana Grande Dupe Robert De Niro Ben Stiller With the Worst Lie About Her Childhood Ariana Grande Sings O Christmas Tree With Robert De Niro Ben Stiller on Tonight Show : Exclusive Preview In the new special (which follows last year s The First Snow of Fraggle Rock ), Wembley is named Spirit Captain and is in charge of spreading holiday cheer throughout Fraggle Rock, but the spirit begins to fade when the Fraggles unknowingly take a snow globe from Doc s workshop. How will they fix the mistletoe mishap? You ll just have to tune in next month to find out. Watch the full trailer below: This will mark Scherzinger s first Fraggle Rock appearance and it comes the year after she took home best actress in a musical at the 2025 Tony Awards for her performance in the revival of Andrew Lloyd Webber s Sunset Boulevard a role she originated on London s West End and earned her an Olivier Award as well. Scherzinger also reunited with two of her Pussycat Dolls bandmates earlier this year for the PCD Forever Tour, which kicked off in June and wrapped up last month with shows across Europe and Brazil. The Jim Henson Company’s Fraggle Rock: A Holiday Gift is executive produced by Lisa Henson, Halle Stanford, John Tartaglia, Matt Fusfeld, Alex Cuthbertson, Arnon Milchan and Yariv Milchan, with co-executive producers Dave Goelz and Karen Prell as well as Recording Academy CEO Harvey Mason jr. as executive music producer. The special was written by Fusfeld and Cuthbertson, produced by Chris Plourde, co-produced by Tim O’Brien, and directed by Tartaglia.", "date_str": "2026-11-10T16:00:00+00:00", "hash": "2665a061400842f5", "title_fa": "«Fraggle Rock» «A Holiday Gift» را با موزیکال ویژه جشن با حضور نیکول شرزینگر به پایان رساند: تریلر را تماشا کنید", "summary_fa": "The Fraggles با یک ویژه جشن موزیکال جدید بازگشته اند و یک برنده تونی را برای سورتمه سواری همراه خود می آورند. Fraggle Rock: A Holiday Gift که برای اولین بار در 4 دسامبر در اپل تی وی به صورت جهانی نمایش داده می شود، شامل لیلی کوپر نامزد تونی است که در نقش داک و برنده تونی نیکول شرزینگر در حال اجرای یک شماره موزیکال پوشیده از برف هستند و خانواده بیلبورد به طور انحصاری تریلر زیر را نمایش می دهد. مطالب مرتبط آیا می توانید آن را احساس کنید؟! اولین آهنگ جشن از اولین برف Fraggle Rock را تماشا کنید تماشای ویژه تعطیلات آریانا گراند دوپ رابرت دنیرو بن استیلر با بدترین دروغ درباره دوران کودکی اش آریانا گرانده درخت کریسمس را با رابرت دنیرو بن استیلر می خواند در امشب نمایش: پیش نمایش انحصاری در ویژه جدید (که نام SRocknow در سال گذشته از Spile sgg The دنبال می شود) و مسئول پخش شادی تعطیلات در سرتاسر فراگل راک است، اما زمانی که فرگل ها ناخودآگاه یک کره برفی را از کارگاه داک می گیرند، روح شروع به محو شدن می کند. آنها چگونه مشکل دارواش را برطرف خواهند کرد؟ شما فقط باید ماه آینده را تنظیم کنید تا متوجه شوید. تریلر کامل را در زیر تماشا کنید: این اولین حضور شرزینگر در Fraggle Rock خواهد بود و سال بعد از آن است که او بهترین بازیگر زن در یک موزیکال را در جوایز تونی 2025 برای بازی اش در احیای بلوار غروب اندرو لوید وبر، نقشی که او در وست اند لندن آغاز کرد و همچنین جایزه اولیویه را برای او به ارمغان آورد. شرزینگر همچنین در اوایل سال جاری برای تور PCD Forever که در ماه ژوئن آغاز شد و ماه گذشته با نمایش هایی در سراسر اروپا و برزیل به پایان رسید، با دو", "image_url": "https://www.billboard.com/wp-content/uploads/2026/11/nicole-scherzinger-fraggle-rock-holiday-gift-billboard-1800.png?w=1024", "category": "هوش مصنوعی مولد", "tags": ["Apple", "موسیقی"], "datetime_fa": "۱۹ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Ayra Starr Makes a ‘Bold Yet Simple Statement’ With New ‘Starrgirl’ Limited-Edition Anime-Inspired Vinyl", "link": "https://www.billboard.com/music/music-news/ayra-starr-starrgirl-crunchyroll-anime-vinyl-1236363933/", "summary": "Ayra Starr s Starrgirl is getting an anime-inspired makeover. Billboard can exclusively reveal that the Grammy-nominated Afro-pop star will be releasing a limited-edition vinyl of her acclaimed Starrgirl LP, in collaboration with Crunchyroll. Available exclusively via the Crunchyroll store , the new Starrgirl vinyl starts at $40, with presales beginning today. Related A Star(r) Comes of Age: Ayra Starr’s ‘The Year I Turned 21’ Scoffs at the Sophomore Slump (Critic s Take) Ayra Starr Explains How Moving to New York City — And Making Her Acting Debut — Inspired Her New ‘Starrgirl’ LP: ‘I Exist in Multitudes’ Fans Choose Ayra Starr s Starrgirl as This Week s Favorite New Music Reflecting the Rush singer s passion for anime, the new vinyl features original manga-style artwork, bringing new life to the sci-fi-inspired visual world of Starrgirl . The collaboration will also include a custom animated visualizer and additional content on Crunchyroll platforms, including animated clips set to Starr s music, an interview with Crunchyroll News and exclusive media across both Crunchyroll s and Starr s socials. “The Starrgirl character we created for the album cover has such a bold yet simple statement,” Ayra Starr says. “I think it blends modern fashion with traditional dress in a way that says, I am here today because of all the women that came before me .” Starrgirl arrived Aug. 14 via Mavin and Republic Records, complete with a wide-ranging list of featured artists, including kwn ( Amazing ), ZAYN ( Heaven Baby ) and Danny Ocean ( Hot Body remix). Previously released singles like the Rema-assisted Who s Dat Girl and Wizkid-featuring Gimme Dat live harmoniously alongside gutsier swings like the electro-pop midtempo Where Do We Go and the soul-baring Misunderstood. The LP reached No. 4 on World Albums, marking her second consecutive top five entry on the chart following 2024 s The Year I Turned 21 . “In making this album, I started to understand that I exist in multitudes, and the only way for me to show that was through an album,” she told Billboard last month (Sept. 23). “I can’t show that in just one song. Trying to limit myself to just one thing or one sound made me lash out even more, [whether] that’s cutting my hair or changing my whole aesthetic to black or just doing a sound that was different for me. This album is me allowing myself to be different forms and different things.” The news of Starr s new Crunchyroll collaboration comes on the heels of her Starrg", "date_str": "2026-11-10T16:00:00+00:00", "hash": "ab0d07d88b889a23", "title_fa": "آیرا استار «بیانیه جسورانه و در عین حال ساده» با وینیل جدید «Starrgirl» با نسخه محدود انیمه الهام گرفته شده را بیان می کند.", "summary_fa": "Starrgirl آیرا استار در حال تبدیل شدن به یک انیمه الهام گرفته شده است. بیلبورد می تواند به طور انحصاری فاش کند که این ستاره پاپ آفریقایی نامزد جایزه گرمی با همکاری کرانچی رول، وینیل نسخه محدودی از LP تحسین شده خود Starrgirl را منتشر خواهد کرد. وینیل جدید Starrgirl که منحصراً از طریق فروشگاه Crunchyroll در دسترس است، از 40 دلار شروع می شود و پیش فروش آن از امروز آغاز می شود. مربوط به یک ستاره (r) روی سن می‌آید: «The Year I Toned 21» از آیرا استار در رکود سال دوم تمسخر می‌کند (نقد منتقدان) آیرا استار توضیح می‌دهد که چگونه نقل مکان به شهر نیویورک - و اولین بازیگری‌اش - الهام بخش جدید «Starrgirl» او LP: «I Startudes» در نقش ستارگان این چوگان وجود دارد. موسیقی جدید مورد علاقه هفته که منعکس کننده اشتیاق خواننده راش به انیمه است، وینیل جدید دارای آثار هنری اصلی به سبک مانگا است که زندگی جدیدی را به دنیای بصری الهام گرفته از علمی تخیلی Starrgirl می بخشد. این همکاری همچنین شامل یک تصویرساز متحرک سفارشی و محتوای اضافی بر روی پلتفرم‌های کرانچی‌رول، از جمله کلیپ‌های متحرک تنظیم‌شده با موسیقی Starr، مصاحبه با Crunchyroll News و رسانه‌های انحصاری در شبکه‌های اجتماعی Crunchyroll و Starr خواهد بود. آیرا استار می‌گوید: «شخصیت Starrgirl که ما برای جلد آلبوم خلق کردیم، بیانیه‌ای جسورانه و در عین حال ساده دارد. فکر می‌کنم مد مدرن را با لباس‌های سنتی ترکیب می‌کند، به گونه‌ای که می‌گوید، من امروز اینجا هستم به خاطر تمام زنانی که قبل از من آمده‌اند.» Starrgirl در 14 آگوست از طریق Mavin و Republic Records همراه با فهرست گسترده ای از هنرمندان برجسته، از جمله kwn ( شگفت انگیز)، ZAYN ( Heaven Baby ) و Danny Ocean ( ریمیکس Hot Body ) وارد شد. تک‌آهنگ‌هایی که قبلاً منتشر شده‌اند، مانند Whos Dat", "image_url": "https://www.billboard.com/wp-content/uploads/2026/10/starrgirl-crunchyroll-vinyl-2026-press-smith-house-cr-billboard-1800.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["موسیقی"], "datetime_fa": "۱۹ آبان • ۱۹:۳۰"}, {"source": "Billboard", "title": "Bruce Springsteen Jokes About G-Spots (for a Good Cause) at 2026 Stand Up for Heroes Benefit: 5 Best Moments", "link": "https://www.billboard.com/lists/stand-up-for-heroes-2026-recap-bruce-springsteen-alex-warren/", "summary": "For the 20th year in a row, the Bob Woodruff Foundation and the New York Comedy Festival joined forces to raise money and laughs for United States veterans, hosting its annual Stand Up for Heroes benefit on Monday (Nov. 9) with performances from Bruce Springsteen , Alex Warren and more. Held at the David Geffen Hall at the Lincoln Center in New York City, the 2026 fundraiser continued its tradition of supporting former members of the military by bringing many of them, as well as a number of influential figures and donors, into the same room for a night of songs and comedy. The latter was provided this year by longtime supporter of the cause Jon Stewart alongside Josh Johnson and Hasan Minhaj, while the TikToker-turned-singer behind the Billboard Hot 100 No. 1 hit Ordinary and The Resilient a rock band primarily made up of wounded U.S. combat veterans led the musical offerings. As for The Boss? He delivered both. Springsteen who has been present at almost every SUFH since it began in 2007 sang an intimate handful of tender acoustic cuts as well as s Abandon on July 12, and the revelatory, incisive album reached No. 96 on the Billboard 200 and No. 14 on Top Alternative Albums. The 13-song set was led by iloveitloveitiloveit, which peaked at No. 17 on the Billboard Hot 100 and No. 2 on Hot Rock Alternative Songs, garnering over 269.5 million official on-demand U.S. streams through Nov. 7, according to Luminate. The 20-year-old co-wrote the entire album with Alexis Idarose Kesselman, with Grammy-nominated songwriter Alexander 23 and Thomas LaRosa also contributing. She supported the album with her headlining Reckless Tour, which commenced on Sept. 8 at Atlanta s Variety Playhouse and visited major cities like Brooklyn, Chicago and Los Angeles before wrapping at Austin City Limits Festival in Texas on Oct. 9. Back in July, she graced the cover of Billboard s Up Coming issue alongside dance-pop breakout Slayyyter and two-time Latin Grammy winner Trueno. The following month, she was named to Billboard s annual 21 Under 21 list, and in September she picked up a nomination for best new artist at the 2026 MTV Video Music Awards. In her Up Coming episode, which is now available on all podcast platforms, Kay also discussed growing up watching Ariana Grande on Victorious , sharpening her songwriting skills through college coffeehouse performances and opening up for Noah Kahan and Gracie Abrams. I was listening to a lot of Lizzie [McAlpine], Olivia [Rodrigo], Gracie [Abrams], Phoebe [Bridges] — all the greats, she said of her songwriting influences. And Ariana [Grande]. Over the years, I just kept being like, Damn, this girl got banger! I think the first one I can remembe", "date_str": "2026-11-10T15:14:19+00:00", "hash": "67c34adba01758c0", "title_fa": "بلا کی در اولین سری پادکست بیلبورد «Up & Coming» موسیقی جدیدی را طعنه می‌زند: «It’s Kinda Giving Deluxe»", "summary_fa": "بلا کی سال را با انتشار موفقیت آمیز خود iloveitloveitiloveit در ژانویه آغاز کرد. اکنون، او ممکن است سال را با آهنگی بالاتر با موسیقی جدید به پایان برس t Louis Messina co-founded in 1975 with partner Allen Becker . They were rock’n’roll promoters, known for creating events like OzzFest alongside Sharon and Ozzy Osbourne . But in the sweeping independent ­promoter buyouts of the 1990s that reshaped the modern touring business, PACE was acquired by Robert F.X. Sillerman ’s SFX Entertainment. When Sillerman sold SFX to Clear Channel Communications, and then Clear Channel’s entertainment division evolved into mega-promoter Live Nation, Messina chose to jump off that corporate merry-go-round. He was left with a noncompete agreement and just five artists: George Strait , Kenny Chesney , Tim McGraw , Faith Hill and The Chicks . Once his two-year noncompete agreement was over, Messina entered a partnership with AEG Presents. In the 25 years since, MTG has grown to be one of the most enduring promotion companies within live music. Related Touring Power Players: Billboard’s 2026 List Revealed Meet the ‘Unflappable’ Exec Bringing Superstars To Madison Square Garden and Sphere Michael Sanft, Attorney Who Represented Keffe D in 2Pac Murder Trial, Dies at 54 Perhaps the team’s most notable accomplishment in recent years is Taylor Swift ’s The Eras Tour, which spanned two years (2023-24) across five continents. Messina first met Swift while she was still a teenager, staying with the artist throughout her touring career. The two were introduced by Strait, much like how most of Messina’s company was built. “My company’s built on six degrees of George Strait,” Messina says. Strait had also led to Messina meeting Chesney and Eric Church . Through Swift, he met Ed ­Sheeran , Shawn Mendes and MTG’s latest signing, Phoebe Bridgers . “ The Lumineers are one of the only acts we work for that wasn’t associated with a tour we were already doing,” he adds. Messina Courtesy of Messina Touring Following the wrap of The Eras Tour, MTG continued its high-grossing years: Sheeran’s Mathematics Tour grossed $214.5 million in 2025, landing at No. 9 ‌ام را ببینم، اما فرصت‌هایی که در یک سال گذشته برایم فراهم شده است، باعث شده است که احساس کنم فوق‌العاده خوش شانس هستم.»", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Brandon-Sklenar-by-Leo-Jacob-4.jpg?w=1296&#038;h=731&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۹ آبان • ۱۹:۳۰"}, {"source": "Hollywood Reporter", "title": "Katelin Arizmendi on Bringing a New Perspective to Action With ‘Your Mother Your Mother Your Mother’", "link": "https://www.hollywoodreporter.com/movies/movie-news/dp-katelin-arizmendi-on-your-mother-your-mother-your-mother-1236751569/", "summary": "Speaking to THR at TorunCamerimage, the DP discusses crafting the visual language of Bassam Tariq’s genre-bending thriller, starring Mahershala Ali as a devoted hitman balancing family life with vengeance.", "date_str": "2026-11-10T15:42:55+00:00", "hash": "1d509547aa828717", "title_fa": "کاتلین آریزمندی در مورد ایجاد دیدگاهی جدید با «مادرت مادرت مادرت»", "summary_fa": "در گفتگو با THR در TorunCamerimage، DP درباره ساخت زبان بصری مهیج ژانر ژانر بسام طارق، با بازی ماهرشالا علی به عنوان یک هیتمن فداکار که زندگی خانوادگی را با انتقام متعادل می کند، بحث می کند. در فیلم بسام طارق، مادرت، مادرت، کاتلین آریزمندی، فیلمبردار، ژانر اکشن را برای اولین بار به نمایش می‌گذارد و حس بصری متمایزی را به فیلمی می‌بخشد که بین فیلم جنایی، درام خانوادگی و مدیتیشن معنوی حرکت می‌کند. مرکز آن لطیف (ماهرشالا علی)، یک قاتل مسلمان و حرفه ای است که با مرگ همسرش و خواسته های مراقبت از سه فرزندشان، به ویژه جست و جوی شیر مادر برای تغذیه دختر تازه متولد شده اش، دنیایش به هم ریخته است. چیدمان غیرمعمول به طارق و آریزمندی راه جدیدی در ساختار یک فیلم اکشن می‌دهد تا داستانی درباره مردانگی، ایمان و پدری روایت کنند، همان‌طور که به آسیب‌پذیری عاطفی و خشونت فیزیکی توجه دارد. مادر شما مادر شما مادر شما در تورنتو به نمایش درآمد و در ایالات متحده از طریق استودیو ام جی ام آمازون در 25 سپتامبر منتشر شد. اخبار مرتبط دیوید والیامز به‌عنوان سلبریتی سابقاً ناشناس معرفی شد که ادعا می‌شود دختران نوجوان را برای فیلم‌های سکس شکار کرده است. زبان با طارق، چالش های عملی فیلمبرداری سکانس های اکشن استادانه فیلم و تجربه یک فیلمبردار زن که در زمینه ای هنوز بسیار مردانه کار می کند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/Your-Mother-Your-Mother-Your-Mother-Katelin-Arizmendi.jpg?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["سینما"], "datetime_fa": "۱۹ آبان • ۱۹:۱۲"}, {"source": "Hollywood Reporter", "title": "Tilly Norwood Creator’s New Project? An AI Talking-Dog Movie With the Co-Director of ‘The Lion King’", "link": "https://www.hollywoodreporter.com/movies/movie-news/tilly-norwood-ai-dog-movie-minkoff-watch-trailer-1236751596/", "summary": "Perhaps most notable for the movie is the recruitment of Rob Minkoff, the veteran family filmmaker (he also directed the first two Stuart Little films).", "date_str": "2026-11-10T15:15:57+00:00", "hash": "fe78900e7f51c9e7", "title_fa": "پروژه جدید خالق تیلی نوروود؟ فیلم سگ سخنگو با هوش مصنوعی با کارگردانی مشترک «شیر شاه»", "summary_fa": "شاید قابل توجه ترین برای فیلم استخدام راب مینکف، فیلمساز کهنه کار خانوادگی باشد (او دو فیلم اول استوارت لیتل را نیز کارگردانی کرد). تیلی نوروود ممکن است شهر را تقسیم کرده باشد و اینترنت را شکسته باشد، اما زن پشت آن می گوید که فکر می کند هوش مصنوعی نیز می تواند عشق باشد. بنابراین او در حال ساخت یک فیلم سگ سخنگو است. الین ون در ولدن، تهیه‌کننده تیلی، متولد هلند و ساکن لندن، در حال ساخت یک فیلم خانوادگی انیمیشن زنده ترکیبی سگ‌های طوفانی است که شامل گروهی متشکل از توله‌سگ‌ها می‌شود که به کودک نوپای گمشده در جنگل کمک می‌کنند تا به خانه برود. و راب مینکف، کارگردان شیر شاه را برای هدایت آن استخدام کرد. این فیلم از نسل‌های هوش مصنوعی برای کودک و طیف وسیعی از نژادهای سگ (با صداپیشگان انسان) و بازیگران بزرگسال برای منتخب صحنه‌های اکشن زنده استفاده می‌کند. من می‌خواستم فیلمی بسازم که باید با هوش مصنوعی ساخته می‌شد.\" ون در ولدن، که Particle 6 آن را تولید می‌کند، به هالیوود ریپورتر می‌گوید. سگ‌ها طوری صحبت می‌کنند که قبلاً با انیمیشن‌های معمولی یا CGI هرگز [به‌طور قانع‌کننده] امکان‌پذیر نبود، و همچنین هرگز نمی‌خواهید با سگ‌ها و کودکان نوپا عکس بگیرید. او اضافه می‌کند که ما از هوش مصنوعی به روشی کاملاً جدید استفاده می‌کنیم. (می توانید یک تیزر را در زیر ببینید.) شاید مهم ترین مورد برای پروژه استخدام مینکوف، فیلمساز کهنه کار خانوادگی باشد (او همچنین دو فیلم اول استوارت لیتل را کارگردانی کرد و در سال 2014 پشت سر انیمیشن علمی تخیلی دریم ورکز بود) - و می توان به عنوان یکی از بازیگرانی که در نقش یک ون تار نقش آفرینی کرد. ولدن و ذرات 6. مینکوف به THR می‌گوید: «الین این ایده را به من ارائه کرد و من فکر کردم که این بهترین مورد استفاده از", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/StormDogs.png?w=1440&#038;h=810&#038;crop=1", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "سینما"], "datetime_fa": "۱۹ آبان • ۱۸:۴۵"}, {"source": "Hollywood Reporter", "title": "Lisa’s ‘Always Lalisa’ Heads to YouTube Premium, Singer to Release New Single “Leave With Me” (Exclusive)", "link": "https://www.hollywoodreporter.com/music/film-tv-music-news/lisa-always-lalisa-youtube-premium-new-single-leave-with-me-1236751658/", "summary": "The singer is set to kick off her Las Vegas residency later this week.", "date_str": "2026-11-10T15:03:14+00:00", "hash": "1ad1ef98ccf15293", "title_fa": "«همیشه لالیزا» لیزا به YouTube Premium می‌رود، خواننده آهنگ جدید «Leave With Me» را منتشر می‌کند (انحصاری)", "summary_fa": "این خواننده قرار است اواخر این هفته اقامت خود در لاس وگاس را آغاز کند. هالیوود ریپورتر به طور انحصاری دریافته است که همیشه لالیسا، کارگردان سو کیم که از پشت صحنه به ستاره پاپ جهانی لیزا نگاه می کند، به زودی در YouTube Premium قابل مشاهده خواهد بود. این مستند که از شرکت سونی موزیک ویژن ساخته شده است، در جشنواره بین‌المللی فیلم تورنتو در ماه سپتامبر به نمایش درآمد و ماه گذشته با اکران محدود در سینماها متوقف شد. لیور کوهن، رئیس موسیقی جهانی در یوتیوب، به THR گفت که تصمیم برای آوردن این مستند به این پلتفرم، با توجه به تمرکز جهانی این پلتفرم، بی‌معنا بود. لیزا به THR می گوید که یوتیوب از خود ادامه داد. دوره ای بود که آینده خیابان سیسمونی به دور از آفتاب بود. در اواخر سال 2024، HBO تصمیم گرفت قرارداد خروجی خود را برای قسمت‌های جدید نمایش طولانی مدت کودکان تمدید نکند و در وضعیت بلاتکلیفی قرار گرفت. چند ماه بعد، دولت ترامپ تلاشی را برای کاهش بودجه فدرال برای رسانه های عمومی آغاز کرد. سخنگویی در آن زمان گفت که کارگاه Sesame در نهایت کارکنان خود را در میان تغییر چشم انداز رسانه ها و بودجه اخراج کرد. در طول این 10 سال، چشم‌انداز رسانه‌ها کاملاً تغییر کرده بود، بنابراین ما متوجه شدیم که خود را در یک محیط رسانه‌ای بسیار پراکنده می‌بینیم، و در نتیجه این آگاهی که باید به آموزش دست پیدا کنیم، چون می‌دانستیم که برای ارزش رسانه آموزشی ما برای ارائه تأثیری که می‌خواهیم داشته باشد، باید به معنای ساخت یک استراتژی توزیع جدید فکر کنیم. آنچه در پی آن رخ داد تحولی آرام اما رادیکال در کارگاه Sesame و Sesame Street و بازنگری در مورد مکان و چگونگی ظاهر شدن نام تجاری بود. جیرالدی با کنایه می گوید بیگ برد دیگر در یک خیابان زندگی نمی کند. Sesame Workshop در ماه‌های آینده معاملات زیادی را انجام خواهد داد، با اعلامیه ماه می نتفلیکس مبنی بر اینکه نتفلیکس به خانه پخش اشتراکی برای قسمت‌های جدید سریال تبدیل می‌شود و این قسمت‌ها نیز در همان روز در PBS Kids پخش می‌شوند.", "image_url": "https://www.hollywoodreporter.com/wp-content/uploads/2026/11/2025-05-05-FRIENDSHIP-FORCE-Season-56-Sesame-Street-RT-236.jpg?crop=0px%2C616px%2C7885px%2C4412px&#038;resize=1440%2C810", "category": "هوش مصنوعی مولد", "tags": ["نتفلیکس", "سرمایه‌گذاری"], "datetime_fa": "۱۹ آبان • ۱۸:۳۲"}, {"source": "Variety", "title": "‘Musk’ Director Alex Gibney Reveals What He Really Thinks of Elon Musk, Elizabeth Holmes and ‘You Can See Everything’ at Variety’s Doc Dreams NYC", "link": "https://variety.com/2026/film/news/alex-gibney-elon-musk-elizabeth-holmes-1236943837/", "summary": "On Monday afternoon, Variety Doc Dreams NYC took over Firehouse Cinema in downtown Manhattan for a lively and informative series of talks highlighting contenders for this year’s Best Documentary Oscar. At the top of the ticket was a con s-record-song-of-the-year/", "summary": "There’s usually a fairly high degree of overlap in the Grammy nominees for record and song of the year. At the 2026 ceremony, seven songs were nominated in both categories. The only difference in the two fields was that Chappell Roan ’s “The Subway” was up for record of the year, while the KPop Demon Hunters smash “Golden” was up for song of the year. Five songs appearing in both categories is more typical. That was the magic number two years ago, and also three years ago, and it seems likely to be the number again this year. The No. 1 most-asked question about the Grammys, dating back to the days of Domenico Modugno , is “what’s the difference between record and song of the year?” Record of the year honors a specific recording of a song, and is awarded to the artist(s), producer(s), engineer(s), mixer(s) and mastering engineer(s). Song of the year honors the song itself. It goes to the songwriter(s). Related 2027 Grammy Nominations Final Predictions: Album of the Year Usually, an artist submits his or her strongest entry from the eligibility year in both categories, but sometimes the artists submit different works. Bruno Mars pioneered this approach 10 years ago and won in both categories, with “24K Magic” in record of the year and “That’s What I Like” in song of the year. This year, he’s trying that split strategy again, with “I Just Might” (record) and “Risk It All” (song). Taylor Swift is also trying this approach, with “The Fate of Ophelia” (record) and “I Knew It, I Knew You (from Toy Story 5 )” (song). (And yes, that’s how the title of Swift’s movie tune appears on the eligibility list. They want to make sure voters make the association with the movie.) We first previewed the Grammy nominations in the marquee categories back in July . This week, we’ve been updating those predictions, as needed. On Monday, we looked at album of the year , probably the most prestigious and coveted Grammy Award. Today, we’re taking on record and song of the year. On Wednesday, we’ll look at best new artist. The biggest change I made from July was moving Tame Impala and Jennie ’s “Dracula” to the top tier in record of the year, replacing Sienna Spiro ’s “Die on This Hill.” (I kept “Die on This Hill” in song of the year.) Six of the eight likeliest record of the year nominees were produced or co-produced by the artists. The only ones where the artists didn’t have a producer credit are the hits by the Olivias – Zach Nahome produced Olivia Dean ’s “Man I Need”; Daniel Nigr", "date_str": "2026-11-10T15:00:00+00:00", "hash": "2d9801f19c5821c2", "title_fa": "پیش بینی های نهایی نامزدهای گرمی 2027: ضبط و آهنگ سال", "summary_fa": "معمولاً درجه نسبتاً بالایی از همپوشانی در نامزدهای گرمی برای ضبط و آهنگ سال وجود دارد. در مراسم 2026، هفت آهنگ در هر دو بخش نامزد شدند. تنها تفاوتی که در این دو زمینه وجود داشت این بود که آهنگ \"The Subway\" از چاپل روان برای رکورد سال ثبت شد، در حالی که گروه KPop Demon Hunters آهنگ \"Golden\" را به عنوان آهنگ سال انتخاب کرد. پنج آهنگ که در هر دو دسته ظاهر می شوند معمولی تر است. این عدد جادویی دو سال پیش و همچنین سه سال پیش بود، و به نظر می‌رسد که امسال دوباره این عدد باشد. سوال شماره 1 در مورد جایزه گرمی که به دوران دومینیکو مودگنو برمی گردد، این است که \"تفاوت بین آلبوم و آهنگ سال چیست؟\" رکورد سال به یک ضبط خاص از یک آهنگ افتخار می کند و به هنرمند(ها)، تهیه کننده(ها)، مهندس(ها)، میکسر(ها) و مهندسان مسترینگ اهدا می شود. آهنگ سال به خود آهنگ افتخار می کند. به ترانه سرا (ها) می رسد. پیش‌بینی‌های نهایی نامزدهای گرمی 2027: آلبوم سال معمولاً یک هنرمند قوی‌ترین اثر خود را از سال واجد شرایط بودن در هر دو دسته ارسال می‌کند، اما گاهی اوقات هنرمندان آثار متفاوتی را ارسال می‌کنند. برونو مارس 10 سال پیش پیشگام این رویکرد بود و در هر دو بخش با \"24K Magic\" در رکورد سال و \"That's What I Like\" در آهنگ سال برنده شد. امسال، او دوباره این استراتژی تقسیم‌شده را با «I Just Might» (ضبط) و «Risk It All» (آهنگ) امتحان می‌کند. تیلور سوئیفت نیز با «سرنوشت اوفلیا» (رکورد) و «من آن را می‌دانستم، تو را می‌شناختم (از Toy Story 5)» (آهنگ) این رویکرد را امتحان می‌کند. (و بله، اینگونه است که عنوان آهنگ فیلم سوئیفت در لیست واجد شرایط بودن ظاهر می شود. آنها می خواهند مطمئن شوند که رای دهندگان با فیلم ارتباط", "image_url": "https://www.billboard.com/wp-content/uploads/2026/09/2279533187-e1790021518238.jpg?w=1024", "category": "هوش مصنوعی مولد", "tags": ["سینما", "موسیقی"], "datetime_fa": "۱۹ آبان • ۱۸:۳۰"}, {"source": "Billboard", "title": "It’s Looking Like Oasis Will Skip Their Own Rock Hall of Fame Induction: ‘It’s Too Far To Be Going For the Night’", "link": "https://www.billboard.com/music/rock/oasis-likely-skip-2026-rock-and-roll-hall-of-fame-induction-1236378600/", "summary": "It should come as no surprise to longtime Oasis fans that Noel and Liam Gallagher s masterplan for this weekend s Rock Roll Hall of Fame induction ceremony is to definitely, not even maybe make an appearance. The Brit Pop icons have made no secret about their listless attitude about being inducted this year alongside Billy Idol, Joy Division/New Order, Phil Collins, Wu-Tang Clan, Luther Vandross and Sade. And, after Rolling Stone reported on Monday (Nov. 9) that the formerly battling, now agreeable brothers would not be flying to Los Angeles for Saturday s (Nov. 14) event at the Peacock Theatre, Liam Gallagher appeared to confirm that his ticket is not booked. Responding to the report on X on Tuesday morning (Nov. 10), Liam wrote, It s too far to be going for the night I got s t to do it s Christmas . While the Supersonic band doesn t have any gigs until next May for their Live 27 tour, last week Noel booked his first solo appearance since Oasis triumphant 2025 reunion tour with an appearance at Goldie s EFG Jazz Festival in London on Saturday. At press time a spokesperson for Oasis had not returned Billboard s request for confirmation that Oasis would not be present at Saturday s event. The brush-off is in keeping with the Gallagher brothers indifference to the honor, dating back to their fir rties), Jason Ranne (president, global talent representation), Kevin Shivers (co-president, music), Matthew Vandrau (president, EMEA APAC), Elena Rochelli (chief financial officer) and Jon Liebman (chairman and CEO, Brillstein Entertainment Partners). Each business leader will continue serving in their roles at the company. Rounding out the board are Providence Equity Partners’ Davis Noell (senior managing director, co-head of North America), Greg Brown (operating partner), Scott Marimow (managing director) and Ahana Maken (senior vp). “This is an important moment for our company,” Watts said in a statement. “The members of this board have shown the qualities we value most: embracing our culture, supporting their colleagues and delivering exceptional results for our clients. This group will build on our momentum and help us accelerate growth by focusing on the ways we can best support our clients’ goals and aspirations.” Noell added, “THE•TEAM has an incredibly talented leadership team and we welcome the expertise and perspective that this board will bring to the business. We’re excited about the growth opportunities ahead and will continue to provide capital and strategic partnership to help expand THE•TEAM’s capabilities across sports, music and entertainment.” THE•TEAM’s music roster includes Chappell Roan , Coldplay , Ed Sheeran , SZA , Kendrick Lamar and Tyler, The Creator , among others.", "date_str": "2026-11-10T14:00:00+00:00", "hash": "e2d17dc1a5216efb", "title_fa": "THE•TEAM هیئت مدیره جدید را پس از نهایی شدن فروش تشکیل می دهد", "summary_fa": "این شرکت روز سه شنبه (10 نوامبر) اعلام کرد که آژانس استعدادهای درخشان THE•TEAM هیئت مدیره جدیدی را تشکیل داده است و اولین باری است که هیئت مدیره عمومی دارد. THE•TEAM که قبلاً با نام Wasserman شناخته می شد، توسط بنیانگذار و مدیر عامل سابق کیسی واسرمن به Providence Equity Partners در ماه ژوئیه پس از نارضایتی پس از ظاهر شدن نام واسرمن در پرونده های اپشتاین فروخته شد. این معامله در ماه اکتبر نهایی شد. مرتبط پس از Wasserm     let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
