fa": "پوشیدنی‌های جدید در زمان عدم قطعیت برای عینک‌های هوشمند عرضه می‌شوند که به دلیل نگرانی‌های مربوط به حفظ حریم خصوصی با واکنش‌های منفی مواجه شده است. در کنفرانس Meta Connect این شرکت در منلو پارک، کالیفرنیا، مدیران گفتند که مدل‌های جدید Ray-Ban Meta استانداردهای جدیدی را برای عمر باتری و وزن تعیین می‌کنند. آنها گفتند عینک های جدید با صفحه نمایش در لنزها، قابلیت هایی را که قبلاً برای یک هدست کامل در نظر گرفته شده بود، به مجموعه ای سبک از عینک هایی که روی گوش های کاربر قرار می گیرند، فشرده می کند. به خواندن ادامه دهید... عینک Ray-Ban Meta Audio AI برای آن زمان طراحی شده است. بدون دوربین، آنها ممکن است به جلوگیری از برخی نگرانی های مربوط به حریم خصوصی کمک کنند، اگرچه متا ادعا می کند که آنها چندین سال است که در حال کار بوده اند. این عینک دارای میکروفون و بلندگوهایی برای موسیقی، تماس و تعامل با دستیار هوش مصنوعی این شرکت است که به شکل قابل‌توجهی از Ray Ban's Clubmaster یا Burbank است. نسخه‌های جدید نازک‌تر و سبک‌تر از نسخه‌های دوربین هستند و تا 12 ساعت با باتری کار می‌کنند و 319 پوند (349 یورو/529 دلار استرالیا) قیمت خواهند داشت. عینک جدید Ray-Ban Meta Gen 3 که دوربین های ورزشی را انجام می دهد، نسبت به نسل های قبلی خود عمر باتری بیشتری دارد و با پشتیبانی از صدای Dolby Atmos تا 9 ساعت دوام می آورد. قیمت آنها 409 پوند (449 یورو / 679 دلار استرالیا) خواهد بود. متا همچنین با همکاری خواننده و بازیگر لیزا، دو سبک جدید از عینک های برند خود را روانه بازار می کند. تمام عینک‌های هوشمند این شرکت دارای چراغ هشدار LED هستند که هنگام ضبط چشمک می‌زند، اما متا گفت که بهبودهایی در تشخیص دستکاری خود، از جمله در هنگام ضبط، انجام داده"}, {"source": "The Guardian AI", "title": "OpenAI’s Altman and Anthropic’s Amodei address UN security council", "link": "https://www.theguardian.com/world/2026/sep/23/unga-sam-altman-dario-amodei", "summary": "Heads of two of the world’s largest artificial intelligence companies give separate briefings on AI safety Sam Altman of OpenAI and Dario Amodei of Anthropic, heads of two of the world’s largest artificial intelligence companies, addressed the United Nations security council on Wednesday in separate briefings on AI safety. “We have a choice in front of us,” Altman told the council. “AI can either be more like a new renaissance of creativity and discovery, or more like a new industrial revolution of upheaval and disarray.” Continue reading...", "date_str": "2026-09-23T21:15:27+00:00", "hash": "12ce611e70d64bee", "title_fa": "Altman از OpenAI و Amodei از Anthropic در شورای امنیت سازمان ملل سخنرانی می کنند", "summary_fa": "رؤسای دو شرکت بزرگ هوش مصنوعی جهان جلسات توجیهی جداگانه ای در مورد ایمنی هوش مصنوعی ارائه می دهند سم آلتمن از OpenAI و داریو آمودی از Anthropic، روسای دو شرکت از بزرگترین شرکت های هوش مصنوعی جهان، روز چهارشنبه در نشست های جداگانه ای در مورد ایمنی هوش مصنوعی در شورای امنیت سازمان ملل سخنرانی کردند. آلتمن به شورا گفت: «ما یک انتخاب در مقابل خود داریم. هوش مصنوعی می‌تواند بیشتر شبیه یک رنسانس جدید خلاقیت و اکتشاف باشد یا بیشتر شبیه به یک انقلاب صنعتی جدید از آشفتگی و آشفتگی باشد.» به خواندن ادامه دهید... آلتمن و آمودی در حالی صحبت کردند که شرکت هایشان با نظارت فزاینده ای در مورد ایمنی محصولاتشان روبرو هستند. هشدار عمومی در مورد هوش مصنوعی در پاسخ به هشدارهای محققان Anthropic در اوایل ماه جاری مبنی بر اینکه این فناوری می تواند بشریت را در دهه آینده نابود کند، افزایش یافته است. رهبران شرکت‌های هوش مصنوعی، از جمله آلتمن و آمودی، از آن زمان خواستار کاهش سرعت پیشرفت هوش مصنوعی و همکاری بین‌المللی بیشتر در زمینه استانداردهای ایمنی این فناوری شدند. آلتمن که در گوشه میز نعل اسبی شورای امنیت نشسته بود و حدود 10 دقیقه صحبت کرد، از مزایای هوش مصنوعی برای بهره وری سخن گفت و در عین حال درباره سوء استفاده های احتمالی آن هشدار داد. او از دولت‌ها برای ساختن آینده‌ای حمایت کرد که در آن هوش مصنوعی توسط نهادهای دموکراتیک هدایت می‌شود، نه آینده‌ای که مردم احساس کنند این فناوری «کاری برایشان انجام می‌شود». آلتمن گفت: «اگر قرار است هوش مصنوعی دموکراتیک باشد، مهم‌ترین تصمیم‌ها را نمی‌توان تنها توسط آزمایشگاه‌های سانفرانسیسکو اتخاذ کرد. آنها باید از طریق فرآیندهای دموکراتیک و توسط دولت‌هایی که در قبال افرادی که به آنها خدمت می‌کنند پاسخگو باشند، شکل بگیرند."}, {"source": "The Guardian AI", "title": "‘I miss old Google’: readers tell us how they search the internet in the age of AI", "link": "https://www.theguardian.com/technology/2026/sep/23/google-readers-respond-ai-overview-internet-searches", "summary": "A feature called AI Overviews has been a profound change, and the browsing habits of billions of people are shifting Google has put artificial intelligence at the front and center of its search bar. The most-visited site on the internet still shows the same list of links to users, but they have to scroll past a summarized response from an AI chatbot, a feature Google calls AI Overviews. The change to what was once the gateway to the rest of the internet has been profound, and the browsing habits of billions of people are shifting. “AI is driving the most significant upgrade of the Google Search experience ever,” wrote Liz Reid, Google’s vice-president of search, last August . In May, the company said more AI is coming . Continue reading...", "date_str": "2026-09-23T19:51:12+00:00", "hash": "583b442ecf2246d1", "title_fa": "\"دلم برای گوگل قدیمی تنگ شده است\": خوانندگان به ما می گویند که چگونه در اینترنت در عصر هوش مصنوعی جستجو می کنند", "summary_fa": "قابلیتی به نام AI Overviews یک تغییر عمیق بوده است و عادات مرور میلیاردها نفر در حال تغییر گوگل است که هوش مصنوعی را در جلو و مرکز نوار جستجوی خود قرار داده است. پربازدیدترین سایت در اینترنت همچنان همان لیست پیوندها را به کاربران نشان می دهد، اما آنها باید از یک پاسخ خلاصه شده از یک ربات چت هوش مصنوعی عبور کنند، ویژگی که گوگل آن را AI Overviews می نامد. تغییر به چیزی که زمانی دروازه بقیه اینترنت بود عمیق بوده است و عادات مرور میلیاردها نفر در حال تغییر است. لیز رید، معاون جستجوی گوگل، آگوست گذشته نوشت: «هوش مصنوعی مهم‌ترین ارتقای تجربه جستجوی Google را تا کنون انجام می‌دهد. در ماه می، این شرکت گفت که هوش مصنوعی بیشتری در راه است. به خواندن ادامه دهید... G oogle هوش مصنوعی را در قسمت جلو و مرکز نوار جستجوی خود قرار داده است. پربازدیدترین سایت در اینترنت همچنان همان لیست پیوندها را به کاربران نشان می دهد، اما آنها باید از یک پاسخ خلاصه شده از یک ربات چت هوش مصنوعی عبور کنند، ویژگی که گوگل آن را AI Overviews می نامد. تغییر به چیزی که زمانی دروازه بقیه اینترنت بود عمیق بوده است و عادات مرور میلیاردها نفر در حال تغییر است. همانطور که مردم به چت ربات‌های هوش مصنوعی عادت می‌کنند، زمان بیشتری را با گوگل می‌گذرانند و در نتیجه زمان بیشتری را در Google.com می‌گذرانند. مطالعات آکادمیک نشان می‌دهد که افراد کمتر به سایت‌هایی فراتر از گوگل پیمایش می‌کنند، اگر مروری بر هوش مصنوعی بتواند به اندازه کافی پاسخ خوبی به آنها بدهد، حتی اگر ربات از سایت‌هایی استناد کند که آن را تغذیه می‌کنند. کلیک‌ها که به عنوان ترافیک نیز شناخته می‌شوند، اغلب مهم‌ترین راه کسب درآمد یک وب‌سایت از تبلیغات هستند. رسانه ها و صاحبان وب سایت ها در حال تحمل"}, {"source": "The Guardian AI", "title": "How the ‘poisonous tide’ of disinformation spreads division and despair", "link": "https://www.theguardian.com/world/2026/sep/23/how-the-poisonous-tide-of-disinformation-stokes-division-and-sows-despair", "summary": "Whether produced by Russia, China or far-right influencers, deepfakes and disinfo are pushing multiple false narratives Russian disinformation campaigns are varied in their falsehoods and strategies. The narratives range from a deepfake Tom Cruise criticising the Paris Olympics to portraying a recent Russian attack on a train near the Ukraine-Poland border as a false-flag operation. Continue reading...", "date_str": "2026-09-23T19:24:39+00:00", "hash": "63074d60ad984743", "title_fa": "چگونه «جند سمی» اطلاعات نادرست باعث گسترش تفرقه و ناامیدی می شود", "summary_fa": "دیپ‌فیک‌ها و اطلاعات نادرست، چه توسط روسیه، چین و چه توسط اینفلوئنسرهای راست افراطی تولید می‌شوند، روایت‌های نادرست متعددی را ارائه می‌کنند. روایت‌ها از یک تام کروز دروغین در انتقاد از بازی‌های المپیک پاریس گرفته تا حمله اخیر روسیه به قطاری در نزدیکی مرز اوکراین و لهستان به‌عنوان عملیاتی با پرچم دروغین را شامل می‌شود. ادامه مطلب... برخی از تلاش‌ها دروغ‌های آشکار هستند، مانند مهر زدن آرم بی‌بی‌سی بر روی ویدیویی که به اشتباه اوکراین را به خاطر حمله موشکی مرگبار به شهروندان خود در کراماتورسک چهار سال پیش مقصر می‌داند. تاکتیک‌ها نیز تکامل می‌یابند، از انتشار روایت‌های فریبکارانه از طریق پلتفرم پیام‌رسانی تلگرام گرفته تا «مسموم کردن» سیستم‌های هوش مصنوعی با پر کردن اینترنت با داستان‌های دروغین به این امید که توسط چت‌بات‌ها بازگردانده شوند. این سیستماتیک است و اندی برنهام به اندازه کافی دیده است و یک آژانس جدید ضد اطلاعات نادرست، مرکز ملی دفاع از اطلاعات را اعلام کرده است. او گفت: \"ما در مورد یک کمپین موذیانه صحبت می کنیم که به خانه های مردم می رسد و احساسات آنها را در مورد کشور و جامعه خود تغییر می دهد - روایتی از زوال، دامن زدن به تفرقه و کاشت ناامیدی.\" کارشناسان می گویند انتخاب نمونه های فردی رویکرد اشتباهی است و برنهام حق دارد با آنچه که او به عنوان \"جند سمی\" توصیف می کند مقابله کند. ند مندز، سرپرست تحقیقات در Alliance4Europe، یک سازمان غیرانتفاعی که این تهدیدات بی‌ثبات‌کننده را تحلیل می‌کند، می‌گوید که دنبال نمونه‌های مجزای اطلاعات نادرست یک «بازی بازنده‌ها» است. «شما می توانید تمام وقت خود را به دنبال یک TikTok یا یک پست در X صرف کنید، اما استفاده موثر از روز شما نیست. این زیرساخت است که مشکل ایجاد می‌کند، بنابراین این یک گام در مسیر درست است، به دنبال شبکه‌ها.»"}, {"source": "The Guardian AI", "title": "The Guardian view on Russian disinformation: a foreign threat that relies on UK complicity | Editorial", "link": "https://www.theguardian.com/commentisfree/2026/sep/23/the-guardian-view-on-russian-disinformation-a-foreign-threat-that-relies-on-uk-complicity", "summary": "Andy Burnham’s accusation against the Kremlin tells half the story. Domestic extremists amplified by US big tech are part of the same problem In November 2020, Barack Obama warned of an “ epistemological crisis ” facing western democracies. Polarisation and radicalisation were corroding trust in established information sources. “If we do not have the capacity to distinguish what’s true from what’s false, then by definition the marketplace of ideas doesn’t work,” the former US president said. That vulnerability has grown since then. Democracy’s enemies have become more determined to exploit it. This is the threat that Andy Burnham highlighted in a speech at the United Nations this week. The prime minister accused Russia of waging an “industrial-scale assault” on the UK’s information environment using bot armies and fake websites to spread falsehoods, interfere in elections, foment discord and poison inter-community relations. Do you have an opinion on the issues raised in this article? If you would like to submit a response of up to 300 words by email to be considered for publication in our letters section, please click here . Continue reading...", "date_str": "2026-09-23T17:30:08+00:00", "hash": "e597f327ca4daad0", "title_fa": "دیدگاه گاردین درباره اطلاعات نادرست روسیه: یک تهدید خارجی که بر همدستی بریتانیا متکی است | سرمقاله", "summary_fa": "اتهام اندی برنهام به کرملین نیمی از ماجرا را بازگو می کند. افراط گرایان داخلی که توسط فناوری بزرگ ایالات متحده تقویت می شوند، بخشی از همین مشکل هستند در نوامبر 2020، باراک اوباما درباره یک «بحران معرفت شناختی» که دموکراسی های غربی با آن مواجه هستند هشدار داد. قطبی شدن و رادیکالیزه شدن اعتماد به منابع اطلاعاتی تثبیت شده را از بین می برد. رئیس جمهور سابق آمریکا گفت: «اگر ما توانایی تشخیص درست از نادرست را نداشته باشیم، بنا به تعریف، بازار ایده ها کار نمی کند. این آسیب پذیری از آن زمان افزایش یافته است. دشمنان دموکراسی مصمم تر شده اند تا از آن بهره برداری کنند. این تهدیدی است که اندی برنهام در سخنرانی هفته جاری در سازمان ملل بر آن تاکید کرد. نخست وزیر روسیه را متهم کرد که با استفاده از ارتش های ربات و وب سایت های جعلی برای انتشار اکاذیب، دخالت در انتخابات، دامن زدن به اختلاف و مسموم کردن روابط بین جوامع، \"حمله ای در مقیاس صنعتی\" به محیط اطلاعاتی بریتانیا انجام داده است. آیا نظری در مورد موضوعات مطرح شده در این مقاله دارید؟ اگر مایلید تا حداکثر 300 کلمه پاسخی را از طریق ایمیل ارسال کنید تا برای انتشار در بخش نامه‌های ما در نظر گرفته شود، لطفا اینجا را کلیک کنید. به خواندن ادامه دهید... در نوامبر 2020، باراک اوباما درباره یک «بحران معرفتی» که دموکراسی های غربی با آن مواجه هستند هشدار داد. قطبی شدن و رادیکالیزه شدن اعتماد به منابع اطلاعاتی تثبیت شده را از بین می برد. رئیس جمهور سابق آمریکا گفت: «اگر ما توانایی تشخیص درست از نادرست را نداشته باشیم، بنا به تعریف، بازار ایده ها کار نمی کند. نخست وزیر از ایجاد یک مرکز ملی دفاع از اطلاعات برای خنثی کردن کارزارهای خرابکاری معرفتی توسط بازیگران متخاصم خبر داد. این یک افزایش"}, {"source": "The Guardian AI", "title": "Folk or AI could be a winner for the UK at Eurovision | Letters", "link": "https://www.theguardian.com/tv-and-radio/2026/sep/23/folk-or-ai-could-be-a-winner-for-the-uk-at-eurovision", "summary": "Readers have advice for a cross-party committee of MPs looking into the UK’s poor record at the song contest I agree with Laura Snapes that the very last thing we need is MPs’ questionable tastes entering the murky waters of the UK’s Eurovision song choice ( What do you think of the MPs’ inquiry into UK Eurovision song contest failure? I give it nul points, 21 September ). However, one thing I can’t believe hasn’t happened is for the UK to draw upon our ridiculously rich folk tradition. Loads of other countries do it – Ukraine won it a few years back with a song that infused Ukrainian folk with pop – so why can’t we? Continue reading...", "date_str": "2026-09-23T16:40:27+00:00", "hash": "4114d632da6a4c27", "title_fa": "Folk یا AI می تواند برنده بریتانیا در یوروویژن | نامه ها", "summary_fa": "خوانندگان توصیه هایی برای کمیته فراحزبی از نمایندگان مجلس دارند که در مسابقه آهنگ به بررسی کارنامه ضعیف بریتانیا می پردازند. من با لورا اسنیپس موافقم که آخرین چیزی که ما به آن نیاز داریم ورود ذائقه مشکوک نمایندگان به آب های تیره انتخاب آهنگ یوروویژن بریتانیا است (نظر شما در مورد تحقیق نمایندگان در مورد شکست مسابقه یوروویژن بریتانیا چیست؟ من به آن امتیاز می دهم. 1 سپتامبر). با این حال، چیزی که نمی‌توانم باور کنم این اتفاق نیفتاده است این است که بریتانیا از سنت عامیانه غنی مضحک ما استفاده کند. بسیاری از کشورهای دیگر این کار را انجام می دهند - چند سال پیش اوکراین با آهنگی که موسیقی محلی اوکراینی را با پاپ القا می کرد برنده آن شد - پس چرا ما نتوانیم؟ به خواندن ادامه دهید... و چه کسی می گوید که حتی باید به زبان انگلیسی خوانده شود؟ ورود ولزی، کورنیشی یا اسکاتلندی همه چیز را تازه می کند، و هیچ کس نمی تواند ما را به یک فکس یوروپاپ متهم کند. مقاله تیم تورنتون لندن زوئی ویلیامز در مورد تحقیق پیشنهادی در مورد \"چرا ورودی های ما در یوروویژن اینقدر بد هستند؟\" بسیار سرگرم کننده بود (بریتانیا افراد زیردست خود را دوست دارد. ما باید شکست های یوروویژن خود را جشن بگیریم، نه در مورد آنها تحقیق کنیم، 21 سپتامبر). همچنین باعث شد فکر کنم که کمیته منتخب مجلس عوام می تواند با پرسش از هوش مصنوعی در زمان و هزینه صرفه جویی کند. احتمالاً 10 دقیقه طول می کشد و حتی ممکن است یک آهنگ برنده تولید کند. لیندا کارلسن ویستبل، کنت"}, {"source": "The Guardian AI", "title": "My (complicated) relationship with AI: often seductive, occasionally frustrating and always demanding vigilance | Setareh Seyedghorban", "link": "https://www.theguardian.com/commentisfree/2026/sep/24/my-complicated-relationship-with-ai-chatgpt-factchecking", "summary": "As a multilingual academic, artificial intelligence has levelled the playing field. But I will continue to think, judge and develop ideas that are stubbornly mine I am walking between carriages in search of a cup of tea on a train travelling over 100 miles an hour from Liverpool to London when I see half the people in my carriage in deep conversations with a machine: ChatGPT, Claude and Gemini to name a few. I am meant to be on sabbatical, the rare stretch of academic life reserved for slow thinking. Around me, almost nobody is thinking slowly. This is not limited to a train carriage. Half of the adults surveyed in one US study reported using an AI chatbot, one example of how fast people are entering a relationship with their AI tools, which now receive more of our questions, problems and drafts than our friends and colleagues do. Continue reading...", "date_str": "2026-09-23T15:00:52+00:00", "hash": "dcbb159f98d68f17", "title_fa": "رابطه من (پیچیده) با هوش مصنوعی: اغلب اغوا کننده، گهگاه خسته کننده و همیشه نیازمند هوشیاری | ستاره سیدقربان", "summary_fa": "به عنوان یک دانشگاهی چند زبانه، هوش مصنوعی زمین بازی را هموار کرده است. اما به فکر کردن، قضاوت کردن و توسعه ایده‌هایی ادامه خواهم داد که سرسختانه از آن من است. من بین واگن‌ها در جستجوی یک فنجان چای در قطاری که بیش از 100 مایل در ساعت از لیورپول به لندن سفر می‌کند، می‌روم، وقتی نیمی از افرادی را که در کالسکه‌ام در مکالمات عمیق با ماشینی می‌بینند: ChatGPT، کلود و جمینی به چند مورد اشاره می‌کنم. قرار است من در تعطیلات بگذرم، بخش نادری از زندگی آکادمیک که مختص تفکر آهسته است. در اطراف من تقریباً هیچ کس به آرامی فکر نمی کند. این به واگن قطار محدود نمی شود. نیمی از بزرگسالانی که در یک مطالعه در ایالات متحده مورد بررسی قرار گرفتند، استفاده از یک ربات چت هوش مصنوعی را گزارش کردند، نمونه‌ای از سرعت ورود افراد به یک رابطه با ابزارهای هوش مصنوعی، که اکنون بیشتر از دوستان و همکارانمان سوالات، مشکلات و پیش‌نویس‌های ما را دریافت می‌کنند. ادامه مطلب... من یکی از آنها هستم؛ من برای امرار معاش در مورد فناوری های پیشرفته تحقیق می کنم. من با بدبینی وارد این رابطه شدم تا کنجکاوی خود را برآورده کنم و اولین درخواست من از ChatGPT تصحیح یک ایمیل بود. دوم برنامه ریزی برای تعطیلات چهار روزه و سوم مقایسه وام مسکن. من آن ایمیل تصحیح شده با هوش مصنوعی را ارسال کردم، آن تعطیلات کوتاه را گذراندم و وام مسکن خود را با نرخ بهتری تامین مالی کردم - همه اینها بر اساس توصیه های آن بود. این رابطه شروع به رشد کرد و من شروع به انجام وظایف پیچیده تری کردم: خلاصه کردن یک مقاله، جمع آوری یافته های اخیر در مورد یک موضوع خاص و طراحی مجدد آشپزخانه ام. چیزی که ساعت ها طول می کشید فقط چند دقیقه طول کشید."}, {"source": "Medium AI", "title": "ChatGPT Got Good Again While We Were Busy Calling Claude the Smart One", "link": "https://thedigipalms.medium.com/chatgpt-got-good-again-while-we-were-busy-calling-claude-the-smart-one-5fe859fb2d9d?source=rss------artificial_intelligence-5", "summary": "A few weeks ago, I caught myself doing something  مقیاسی که می‌خواهد، هر دو را می‌طلبد و آنها را با هم کار می‌کند.» او افزود: \"هرجا که بتوانیم رهبری کنیم، انجام می دهیم.\" درست است که آمازون هنوز ننشسته است. در سخنرانی دیروز خود، هرست اشاره کرد که این شرکت \"یکی از بزرگترین خریداران انرژی پاک در جهان در چند سال اخیر\" با 42 گیگاوات در کارنامه خود است. او همچنین گفت که آمازون شدت کربن خود را کاهش داده است، یا اینکه چقدر آلودگی به ازای هر دلار درآمد ایجاد می کند، اگرچه این ادعا به بازه زمانی بستگی دارد. سال گذشته، شدت کربن در مقایسه با سال 2024 افزایش یافت، حتی اگر کمتر از سال 2022 بود. آمازون یک تجارت گسترده است و در نتیجه، انتشار کربن آن تقریباً در تمام بخش های اقتصاد، از هوانوردی و هوش مصنوعی گرفته تا کشاورزی و ساخت و ساز پخش شده است. این شرکت برای رسیدن به هدف خود به تامین کنندگان در هر بخش نیاز دارد. هرست در رویداد Axios گفت: \"این کاری نیست که ما به تنهایی انجام دهیم.\""}, {"source": "TechCrunch Main", "title": "VC firm Bessemer now has another $5.75B to invest in (what else?) AI", "link": "https://techcrunch.com/2026/09/23/vc-firm-bessemer-now-has-another-5-75b-to-invest-in-what-else-ai/", "summary": "The VC firm says that AI-native companies are growing faster than any technology, ever.", "date_str": "2026-09-23T20:35:17+00:00", "hash": "6ccbbb3cd5bfbcf7", "title_fa": "شرکت VC Bessemer اکنون 5.75 میلیارد دلار دیگر برای سرمایه گذاری در (چه چیز دیگری؟) هوش مصنوعی دارد", "summary_fa": "این شرکت سرمایه‌گذاری خطرپذیر می‌گوید شرکت‌های بومی هوش مصنوعی سریع‌تر از هر فناوری دیگری در حال رشد هستند. Bessemer Venture Partners روز چهارشنبه اعلام کرد که 5.75 میلیارد دلار از طریق دو صندوق جدید جمع‌آوری کرده است تا سرمایه‌گذاری خود را در تمام بخش‌های هوش مصنوعی تسریع کند. این شرکت که از شرکت‌هایی مانند Anthropic، Cognition، Legora، Perplexity، Ramp، Shopify و Waymo حمایت کرده است، 1.75 میلیارد دلار را برای سرمایه‌گذاری در مراحل اولیه و 4 میلیارد دلار باقیمانده را به ... اختصاص داده است. Bessemer به عنوان یک VC پیشرو در دوره SaaS شناخته شده است، با مهارت خاصی در انتخاب برندگان سازمانی، مانند Box، Docusign و Gainsight. از سال 2022، در بیش از 260 شرکت بومی هوش مصنوعی سرمایه گذاری کرده است. این شرکت می‌گوید تا کنون 3 میلیارد دلار در استارت‌آپ‌های مرتبط با هوش مصنوعی سرمایه‌گذاری کرده است، از جمله آن‌هایی که بر محاسبات، زیرساخت‌ها، مدل‌های پایه، ابزارهای توسعه‌دهنده، استارت‌آپ‌های لایه‌ای اپلیکیشن و فناوری عامل متمرکز هستند. اکنون، بسمر همه چیزهای هوش مصنوعی را به عنوان فرصتی برای یک زندگی یک احساس مشترک در نظر می‌گیرد، البته تا زمانی که انقلاب بزرگ فناوری مد روز بعدی رخ دهد. بایرون دیتر، شریک Bessemer، در اطلاعیه تامین مالی شرکت گفت: شرکت‌های بومی هوش مصنوعی سریع‌تر از هر دسته از فناوری‌هایی که قبلاً پشتیبانی می‌کردیم، گسترش می‌یابند. دیتر به بلومبرگ گفت، شرکت‌های VC همچنین باید به افزایش سینه جنگ خود ادامه دهند، زیرا خصوصی ماندن شرکت‌ها برای مدت طولانی‌تر به یک تغییر ساختاری دائمی تبدیل شده است. برای بزرگترین اخبار فناوری صنعت مشترک شوید هر روز هفته و یکشنبه، می توانید بهترین پوشش TechCrunch را دریافت کنید. TechCrunch Mobility مقصد شما برای اخبار و بینش حمل و نقل است. استارت‌آپ‌ها هسته TechCrunch هستند، بنابراین بهترین پوشش ما را هر هفته دریافت کنید."}, {"source": "TechCrunch Main", "title": "Modal Motors is trying to cut China out of electric motors entirely", "link": "https://techcrunch.com/2026/09/23/modal-motors-is-trying-to-cut-china-out-of-electric-motors-entirely/", "summary": "The startup is working on small, light motors with no rare-earth magnets that are suited for drones, fans, and robots.", "date_str": "2026-09-23T19:05:00+00:00", "hash": "e0d5a7ea4e27cec1", "title_fa": "Modal Motors در تلاش است تا چین را به طور کامل از موتورهای الکتریکی حذف کند", "summary_fa": "این استارت آپ روی موتورهای کوچک و سبک بدون آهنرباهای خاکی کمیاب کار می کند که برای پهپادها، فن ها و روبات ها مناسب است. اخیراً، به نظر می رسد همه در مورد بازگرداندن تولید به ایالات متحده صحبت می کنند، به خصوص وقتی صحبت از فناوری های سخت مانند هواپیماهای بدون سرنشین و روباتیک می شود. مایکل فن استینبورگ فکر می کند که از بازی جلوتر است. ون استینبرگ دهه گذشته را صرف ساخت انواع موتورهای الکتریکی در ایالات متحده کرد. و آم نظرات تلویزیونی مبتنی بر صدا، نظارت شخصی، انجمن‌های فقط اعضای پولی، و روش‌های جدیدی را برای طرفداران برای حمایت از سازندگان مورد علاقه‌شان ارائه می‌کند. این شرکت در رویداد Made On YouTube خود در روز چهارشنبه اعلام کرد که بخش نظرات YouTube در کنار عرضه سایر ویژگی‌های متمرکز بر جامعه مانند عضویت‌های پولی انحصاری در حال ارتقا است. نظر دهندگان اکنون می‌توانند با GIF پاسخ دهند یا از تلویزیون‌های خود نظر بگذارند، در حالی که سازندگان ابزارهای جدیدی را برای حمایت از انجمن‌های طرفداران خود، از جمله ویژگی‌هایی برای شخصی‌سازی اعتدال، دعوت اعضا به مناطق VIP مانند، و ارائه راه‌های جدید به طرفداران برای کمک به کسب درآمد از محتوایشان، دریافت خواهند کرد. نظرات هنوز یکی از اصلی‌ترین روش‌های تعامل بینندگان YouTube با محتوای سازندگان است، اما اغلب از سایر ویژگی‌های نظر دادن در شبکه‌های اجتماعی عقب مانده‌اند. به عنوان مثال، TikTok به تازگی اعلام کرد که نظر دهندگان می توانند با صدای خود به ویدیوها پاسخ دهند و نظرسنجی، چرخ فلک عکس و عکس های زنده را به نظرات خود اضافه کنند. Spotify به پادکست‌های ویدیویی اجازه می‌دهد از نظرسنجی و Q As برای جذب مخاطبان خود استفاده کنند. یوتیوب بالاخره با اضافه کردن پشتیبانی برای گذاشتن فایل‌های GIF در نظرات و اجازه دادن به کاربران در هنگام تماشای YouTube در تلویزیون، کمی پیشرفت کرده است. یوتیوب خاطرنشان کرد که دومی به صورت صوتی کار می کند، نه اینکه به طرز دردناکی LOL را روی کنترل از راه دور شما تایپ کند. یکی از جالب‌ترین موارد افزوده شده، ابزار تعدیل نظر جدید است که برای نیازهای هر سازنده شخصی‌سازی شده است. اگرچه YouTube قبلاً یک فیلتر تعدیل نظر ارائه می‌دهد، سازندگان ممکن است بخواهند آن را دقیق‌تر تنظیم کنند، به‌ویژه در ویدیوهای زنده، جایی که ادامه دادن به آن سخت‌تر است. در حال حاضر، این شرکت"}, {"source": "TechCrunch Main", "title": "YouTube’s conversational video editing tool lets creators make edits in natural language", "link": "https://techcrunch.com/2026/09/23/youtubes-conversational-video-editing-tool-lets-creators-make-edits-in-natural-language/", "summary": "Creators will be able to use AI in a conversational chat interface to help them edit videos.", "date_str": "2026-09-23T15:46:57+00:00", "hash": "139bb3b66beb8137", "title_fa": "ابزار ویرایش ویدیوی مکالمه YouTube به سازندگان اجازه می‌دهد ویرایش‌هایی را به زبان طبیعی انجام دهند", "summary_fa": "سازندگان قادر خواهند بود از هوش مصنوعی در رابط چت مکالمه استفاده کنند تا به آنها در ویرایش ویدیوها کمک کند. یوتیوب در رویداد چهارشنبه Made On YouTube مجموعه‌ای از ابزارهای جدید سازنده را معرفی کرد، از جمله ابزار ویرایش مکالمه‌ای که از زبان طبیعی برای اصلاح فیلم‌های بلند و کوتاه استفاده می‌کند. یک عکسبرداری یک ساعته می تواند 10 ساعت یا بیشتر در ویرایش باشد. بنابراین، چه می‌شود اگر بتوانیم این فرآیند را بدون از دست دادن هیچ یک از کنترل خلاقانه‌مان تسریع کنیم؟ YouTuber Happy Kelli روی استیج به اشتراک گذاشت. در یک رابط چت، سازندگان دستورالعمل‌هایی را به هوش مصنوعی می‌دهند که چگونه به آنها کمک کنند تا یک ویدیو را کنار هم بگذارند. در مثال Happy Kelli، او فیلمی از رقصیدن خود در لباس‌های مختلف به اشتراک می‌گذارد و از هوش مصنوعی می‌خواهد که بهترین عکس را برای هر لباس انتخاب کند. سپس، او موسیقی و ترانزیشن هایی را اضافه می کند که همراه با رقص هستند. او گفت، اگر در هر نقطه ای بخواهم کنترل بیشتری داشته باشم، می توانم به جدول زمانی ویرایش برگردم و خودم به صورت دستی همه چیز را تنظیم کنم. به طور کلی، ویرایش مکالمه فرآیند ویرایش را به یک مکالمه تحت اللفظی با کمکی بی نهایت صبور تبدیل می کند. این یک شریک مشترک است که با شما ویرایش می کند، نه برای شما. این ویژگی همچنین می‌تواند همپوشانی متن اضافه کند، مکث در گفتار را حذف کند و موارد دیگر. همچنین می تواند بر اساس زمینه مکالمه پیشنهاداتی را به سازنده ارائه دهد. در حالی که برخی از سازندگان ممکن است متوجه شوند که این ابزار در زمان آنها صرفه جویی می کند و روند اغلب خسته کننده ویرایش ویدیو را سرعت می بخشد، برخی دیگر ممکن است احساس کنند که سبک ویرایش فردی آنها ویدیوهای آنها را"}, {"source": "Ars Technica", "title": "There's a new way to break RSA that's faster than anything we've seen before", "link": "https://arstechnica.com/security/2026/09/theres-a-new-way-to-break-rsa-thats-faster-than-anything-weve-seen-before/", "summary": "The world has known for decades that the RSA cryptosystem ’s days are numbered. Once quantum computing becomes practical (estimates for that range from 3 to 20 or more years), the foundational security it provides will crumble. New research has revealed a novel method that uses classical computing to reduce the current RSA security level to an unacceptably low threshold. The finding poses little to no practical threat in the immediate term, except possibly in a few edge cases. Even applying the attack against the deprecated use of 1024-bit keys, the method requires more computation than just about anybody—short of nation-states or companies with massive resources—can achieve. Widely used RSA implementations are also safe. Nonetheless, the research has taken cryptographers by surprise because it introduces signature forgery, a new way to break RSA keys without factoring. Equally important, this novel method reduces the required computing resources by orders of magnitude. Read full article Comments", "date_str": "2026-09-24T11:15:44+00:00", "hash": "bc6247139cbc254a", "title_fa": "روش جدیدی برای شکستن RSA وجود دارد که سریع‌تر از هر چیزی که قبلاً دیده‌ایم است", "summary_fa": "جهان برای دهه ها می دانست که روزهای سیستم رمزنگاری RSA به شماره افتاده است. هنگامی که محاسبات کوانتومی عملی می شود (تخمین برای آن محدوده بین 3 تا 20 سال یا بیشتر)، امنیت اساسی که ارائه می دهد از بین می رود. تحقیقات جدید روش جدیدی را نشان داده است که از محاسبات کلاسیک برای کاهش سطح امنیتی RSA فعلی به آستانه غیرقابل قبولی پایین استفاده می کند. این یافته در آینده نزدیک تهدید عملی کمی به همراه نخواهد داشت، به جز در چند مورد حاشیه ای. حتی با استفاده از حمله علیه استفاده منسوخ شده از کلیدهای 1024 بیتی، این روش به محاسبات بیشتری نیاز دارد تا تقریباً هر کسی - به جز کشورهای ملت یا شرکت هایی با منابع عظیم - بتواند به آن دست یابد. پیاده سازی های RSA که به طور گسترده مورد استفاده قرار می گیرند نیز ایمن هستند. با این وجود، این تحقیق رمزنگاران را شگفت زده کرده است زیرا جعل امضا را معرفی می کند، روشی جدید برای شکستن کلیدهای RSA بدون فاکتورگیری. به همان اندازه مهم است، این روش جدید منابع محاسباتی مورد نیاز را با مرتبه‌ای بزرگ کاهش می‌دهد. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید به حداقل رساندن برای پیمایش جهان دهه هاست که می داند روزهای سیستم رمزنگاری RSA شماره گذاری شده است. هنگامی که محاسبات کوانتومی عملی می شود (تخمین برای آن محدوده بین 3 تا 20 سال یا بیشتر)، امنیت اساسی که ارائه می دهد از بین می رود. تحقیقات جدید روش جدیدی را نشان داده است که از محاسبات کلاسیک برای کاهش سطح امنیتی RSA فعلی به آستانه غیرقابل قبولی پایین استفاده می کند. کارستن نول، کارشناس رمزنگاری و رئیس نوآوری در Allurity، در مصاحبه ای گفت:"}, {"source": "Ars Technica", "title": "Review: Apple's hyper-pricey M5 Ultra Mac Studio made me into a vibe coder", "link": "https://arstechnica.com/gadgets/2026/09/review-apples-hyper-pricey-m5-ultra-mac-studio-made-me-into-a-vibe-coder/", "summary": "This spring, Apple made it official: The Mac Pro is dead . When Apple was using Intel processors and AMD GPUs, the idea of an expandable and upgradeable tower made sense. But Apple Silicon chips bring the CPU, GPU, and memory interface all under one roof in a way that makes that sort of upgradeability not just superfluous but impossible. At least not without breaking some of the chips' key benefits. And as it happens, Apple Silicon's combination of a fast CPU, solid GPU, and unified memory architecture has made it a good fit for a modern \"pro\" workload that really pushes high-end hardware: running language models and agents locally. Read full article Comments", "date_str": "2026-09-24T11:00:04+00:00", "hash": "435d138a2d189772", "title_fa": "نقد و بررسی: استودیوی بسیار گران‌قیمت M5 Ultra Mac اپل، من را تبدیل به یک کدنویس وایبر کرد", "summary_fa": "بهار امسال، اپل این را رسمی کرد: مک پرو مرده است. زمانی که اپل از پردازنده‌های اینتل و پردازنده‌های گرافیکی AMD استفاده می‌کرد، ایده یک برج قابل ارتقا و قابل ارتقا منطقی بود. اما تراشه‌های سیلیکون اپل، CPU، GPU و رابط حافظه را زیر یک سقف قرار می‌دهند، به گونه‌ای که این نوع ارتقا را نه تنها زائد، بلکه غیرممکن می‌کند. حداقل بدون شکستن برخی از مزایای کلیدی تراشه ها. و همانطور که اتفاق می افتد، ترکیب Apple Silicon از یک CPU سریع، GPU جامد، و معماری حافظه یکپارچه، آن را برای یک حجم کار مدرن \"حرفه ای\" مناسب ساخته است که واقعاً سخت افزارهای سطح بالا را تحت فشار قرار می دهد: مدل ها و عوامل زبان به صورت محلی اجرا می شوند. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بدانید بهار امسال، اپل آن را رسمی کرد: Mac Pro مرده است. این واقعاً مخاطب اصلی M5 Ultra Mac Studio است، پیکربندی فوق‌العاده اپل که دو نسل پردازنده را در یک به‌روزرسانی می‌فرستد (اگر به خاطر داشته باشید M4 Ultra وجود نداشت). استودیوهای رده بالا همیشه برای اکثر مردم کمی بیش از حد احساس می کردند، اما اکنون نوع خاصی از کدنویس یا طراح با هوش مصنوعی وجود دارد که می تواند به طور قانونی از داشتن این نوع سیستم بر روی میز خود بهره مند شود. اپل به دلیل تقاضا برای این سیستم‌ها از سوی افرادی که نرم‌افزارهایی مانند OpenClaw را اجرا می‌کنند و مدل‌های وزن باز را به صورت محلی اجرا می‌کنند، غافلگیر شده بود، که در کنار کمبود حافظه مبتنی بر هوش مصنوعی، خرید اکثر این سیستم‌ها برای ماه‌ها تقریبا غیرممکن بوده است. این زمینه ای است که مک استودیو جدید در حال راه اندازی است."}, {"source": "Ars Technica", "title": "RFK Jr.'s CDC isn’t letting states order COVID-19 shots for kids, blocking access", "link": "https://arstechnica.com/health/2026/09/rfk-jr-s-cdc-isnt-letting-states-order-covid-19-shots-for-kids-blocking-access/", "summary": "As respiratory virus season nears and fall vaccination drives get underway, more than half of US children are facing uncertainty over access to this year's COVID-19 shot. The Centers for Disease Control and Prevention has unexpectedly delayed the distribution of the shots to a key federal program and some states. Usually, the CDC would allow states to order the newly available seasonal COVID-19 vaccines through the federal Vaccine for Children (VFC) program, which provides vaccines at no cost to children who are uninsured, underinsured, Medicaid-eligible, or Indigenous people in the US . Approximately 52 percent of all US children are eligible for vaccines through the program. Additionally, The Guardian reports that at least 11 states and one US territory are part of a universal vaccine purchase program , in which they buy all vaccines for children—regardless of their ability to pay or insurance status—through contracts otherwise for the VFC . The 11 states and one territory include: Alaska, Connecticut, Hawaii, Maine, Massachusetts, New Hampshire, New Mexico, Rhode Island, Vermont, Washington, Wyoming, and American Samoan. Read full article Comments", "date_str": "2026-09-23T22:17:25+00:00", "hash": "d6689ea91647ca23", "title_fa": "CDC RFK Jr. به ایالت‌ها اجازه نمی‌دهد واکسن کووید-19 برای کودکان سفارش دهند و دسترسی را مسدود می‌کند.", "summary_fa": "با نزدیک شدن فصل ویروس‌های تنفسی و شروع واکسیناسیون پاییزی، بیش از نیمی از کودکان آمریکایی در مورد دسترسی به واکسن کووید-19 امسال با عدم اطمینان مواجه هستند. مراکز کنترل و پیشگیری از بیماری به طور غیرمنتظره ای توزیع واکسن ها را در یک برنامه کلیدی فدرال و برخی ایالت ها به تاخیر انداخته است. معمولاً CDC به ایالت‌ها اجازه می‌دهد واکسن‌های فصلی جدید COVID-19 را از طریق برنامه فدرال واکسن برای کودکان (VFC) سفارش دهند، که واکسن‌ها را بدون هیچ هزینه‌ای برای کودکانی که بیمه‌نشده، فاقد بیمه، واجد شرایط Medicaid یا افراد بومی در ایالات متحده هستند، ارائه می‌کند. تقریباً 52 درصد از همه کودکان ایالات متحده واجد شرایط دریافت واکسن از طریق این برنامه هستند. علاوه بر این، گاردین گزارش می دهد که حداقل 11 ایالت و یک قلمرو ایالات متحده بخشی از برنامه خرید جهانی واکسن هستند که در آن همه واکسن ها را برای کودکان - صرف نظر از توانایی پرداخت یا وضعیت بیمه آنها - از طریق قراردادهایی برای VFC خریداری می کنند. 11 ایالت و یک قلمرو عبارتند از: آلاسکا، کانکتیکات، هاوایی، مین، ماساچوست، نیوهمپشایر، نیومکزیکو، رود آیلند، ورمونت، واشنگتن، وایومینگ، و ساموآی آمریکایی. مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد پهنای بزرگ * پیوندهای گسترده استاندارد نارنجی استاندارد * فقط مشترکین بیشتر بدانید با نزدیک شدن به فصل ویروس تنفسی و شروع واکسیناسیون پاییزی، بیش از نیمی از کودکان ایالات متحده در مورد دسترسی به واکسن کووید-19 امسال با عدم اطمینان مواجه هستند. مراکز کنترل و پیشگیری از بیماری به طور غیرمنتظره ای توزیع واکسن ها را در یک برنامه کلیدی فدرال و برخی ایالت ها به تاخیر انداخته است."}, {"source": "Ars Technica", "title": "FBI rushes to investigate if ShinyHunters hack of thousands of employees is real", "link": "https://arstechnica.com/tech-policy/2026/09/fbi-rushes-to-investigate-if-shinyhunters-hack-of-thousands-of-employees-is-real/", "summary": "The FBI is now investigating claims from a hacker group that thousands of current and former employees’ personal data was stolen after the group exploited a previously unknown bug found on an agency jobs website. On Tuesday, 404 Media reported that ShinyHunters took down the agency site, FBIJobs.gov, then posted a banner on the homepage that said “THIS SITE HAS BEEN SEIZED BY SHINYHUNTERS.” About two to three terabytes of data were taken, ShinyHunters told The New York Times . None of the data has been leaked yet, but it included “names of current and former agents as well as applicants and corresponding home addresses, phone numbers, names of spouses, certain medical information, and other data.” According to Bloomberg , the data could be used to potentially retaliate against agents, with one sample appearing to include “potentially sensitive professional information on the FBI employees’ work focus such as counter-intelligence work on China, Russia and Iran, as well as work against street gangs.” Read full article Comments", "date_str": "2026-09-23T21:46:36+00:00", "hash": "0d27cdf943734408", "title_fa": "FBI عجله دارد تا بررسی کند که آیا هک هزاران کارمند توسط ShinyHunters واقعی است یا خیر", "summary_fa": cal-the-first-fully-electric-bentley/", "summary": "Bentley provided flights from Washington, DC, to Monterey, California, and accommodation so Ars could ride in a preproduction Torcal EV as well as drive the Supersports and ride in a 1920s Bentley as well. Ars does not accept paid editorial content. A few weeks ago, Bentley gave Ars a ride in a new camouflaged electric vehicle . Named after a Spanish rock formation, the Torcal is the brand’s first battery EV, and today the production car had its formal unveiling. That camo was effective: The real car is less bulbous and more blocky than its disguise would suggest. And it’s fair to say it brings some of the ideas of the EXP 15 concept to the road—even if that didn’t include that show car’s elegant, stretched proportions . It’s smaller than the Bentayga, and it should slot beneath that model in pricing (or the PHEV version of it, at least), though Bentley has yet to reveal exactly how much US buyers can expect to pay. Underneath the bodywork are some relatively familiar underpinnings; Bentley shares technology with Porsche as both are part of the greater Volkswagen Group empire. The power output might not be as prodigious as the electric Porsche Cayenne but should be sufficient nonetheless. The standard car will offer peak outputs of 810 hp (604 kW) and 880 lb-ft (1,194 Nm), enough for a 3.3-second 0–60 mph time (0–100 km/h takes 3.4 seconds). The EXP 15's influence is stronger at the rear. Credit: Bentley The more powerful Torcal S boasts 875 hp (653 kW) and 995 lb-ft (1,350 Nm) at its most potent; this is capable of 60 mph from a standing start in a mere 2.8 seconds (2.9 to 100 km/h) and an increased top speed of 162 mph (260 km/h), up from 155 mph (250 km/h) for the standard version, either of which are academic outside certain stretches of German highway. Read full article Comments", "date_str": "2026-09-23T21:06:07+00:00", "hash": "f9a11e29ce2f30be", "title_fa": "در اینجا Torcal، اولین بنتلی تمام الکتریکی است", "summary_fa": "بنتلی پروازهایی از واشنگتن، دی سی، به مونتری، کالیفرنیا، و محل اقامت فراهم کرد تا Ars بتواند سوار بر خودروی پیش‌تولید Torcal EV و همچنین سوار بر Supersports و همچنین سوار شدن بر بنتلی دهه 1920 شود. Ars محتوای تحریریه پولی را نمی پذیرد. چند هفته پیش، بنتلی آرس را سوار یک خودروی الکتریکی جدید استتار کرد. Torcal که برگرفته از یک سازند صخره ای اسپانیایی است، اولین خودروی الکتریکی باتری این برند است و امروز خودروی تولیدی رونمایی رسمی خود را داشت. آن کاموا موثر بود: ماشین واقعی کمتر از آن چیزی که ظاهرش نشان می‌دهد حباب‌دار و بلوک‌تر است. و منصفانه است که بگوییم برخی از ایده‌های کانسپت EXP 15 را به جاده می‌آورد - حتی اگر ابعاد ظریف و کشیده آن ماشین نمایشی را شامل نشود. این مدل از Bentayga کوچکتر است و باید از نظر قیمت کمتر از آن مدل (یا حداقل نسخه PHEV آن) باشد، اگرچه بنتلی هنوز دقیقاً نشان نداده است که خریداران آمریکایی چقدر می توانند بپردازند. در زیر بدنه چند زیرین نسبتا آشنا وجود دارد. بنتلی فناوری را با پورشه به اشتراک می گذارد زیرا هر دو بخشی از امپراتوری بزرگ گروه فولکس واگن هستند. قدرت خروجی ممکن است به اندازه پورشه کاین برقی شگفت انگیز نباشد، اما با این وجود باید کافی باشد. این خودروی استاندارد حداکثر توان 810 اسب بخار (604 کیلووات) و 880 پوند فوت (1194 نیوتن متر) را ارائه می دهد که برای شتاب صفر تا 60 مایل در ساعت 3.3 ثانیه (0 تا 100 کیلومتر در ساعت 3.4 ثانیه طول می کشد) کافی است. نفوذ EXP 15 در قسمت عقب قوی تر است. اعتبار: بنتلی قدرتمندتر Torcal S دارای 875 اسب بخار (653 کیلووات) و 995 پوند فوت (1350 نیوتن متر) در قوی ترین حالت خود است. این می تواند 60 مایل در ساعت از یک استارت"}, {"source": "Ars Technica", "title": "Trump’s China rivalry and “AI race” delusion may endanger US, experts say", "link": "https://arstechnica.com/tech-policy/2026/09/china-silent-as-us-touts-plan-for-ai-safety-alerts-that-omits-tech-experts/", "summary": "This week, the US and China, the two world leaders on AI, finally started talks meant to keep the whole world safe from emerging safety risks. But whether meetings between Donald Trump and Xi Jinping can lead to a reliable global governance framework for AI depends on how much the fierce rivals are actually willing to cooperate. It's clear Trump wants it to seem like discussions are going well. Before Trump and Xi meet on Thursday and Friday, Treasury Secretary Scott Bessent announced that both sides had already discussed setting up a new AI safety notification mechanism. If China agrees to participate, that would create an open line for either side to send alerts when their country’s AI systems pose threats or behave unpredictably. The same channel, Bessent said, could allow the countries to share their “vision of common goals.” However, the proposal comes at a time when China may not be ready to trust the US to have AI safety conversations that aren’t about limiting China’s capabilities. Not only has Trump steadily increased export controls that explicitly seek to block China from accessing technology to advance AI, but Congress is mulling bills that would cut the country off from more chips and hardware. Adding to tensions, just two weeks ago, Trump’s Justice Department accused six of China's leading AI makers of stealing from US frontier labs, which China has strongly disputed. Read full article Comments", "date_str": "2026-09-23T20:52:28+00:00", "hash": "cbde479ddea140c8", "title_fa": "کارشناسان می گویند رقابت ترامپ در چین و توهم «مسابقه هوش مصنوعی» ممکن است آمریکا را به خطر بیندازد", "summary_fa": "این هفته، ایالات متحده و چین، دو رهبر جهانی در زمینه هوش مصنوعی، سرانجام مذاکراتی را آغاز کردند تا کل جهان را از خطرات ایمنی در حال ظهور در امان نگه دارند. اما اینکه آیا دیدارهای بین دونالد ترامپ و شی جین پینگ می تواند منجر به یک چارچوب قابل اعتماد جهانی برای هوش مصنوعی شود، بستگی به این دارد که رقبای سرسخت واقعاً چقدر مایل به همکاری هستند. واضح است که ترامپ می خواهد به نظر برسد که مذاکرات به خوبی پیش می رود. قبل از دیدار ترامپ و شی در روزهای پنجشنبه و جمعه، اسکات بسنت، وزیر خزانه داری آمریکا اعلام کرد که هر دو طرف درباره ایجاد یک مکانیسم جدید اطلاع رسانی ایمنی هوش مصنوعی بحث کرده w them to do the best job,” Andrea Santy , program director of XPRIZE Wildfire , told Ars. “They're great at what they do, but it's unfair to continue to put them in harm's way when there's technology coming online that can help keep them safe, keep communities safe, and protect ecosystems.” Read full article Comments", "date_str": "2026-09-23T20:28:42+00:00", "hash": "4c1e00076d7f5fd1", "title_fa": "برندگان XPRIZE Wildfire در عرض 10 دقیقه آتش سوزی را مشاهده کردند - اما نتوانستند آنها را متوقف کنند", "summary_fa": "تشخیص آتش سوزی از فضا و پهپادهای آتش نشانی در میان فینالیست های مسابقه 11 میلیون دلاری XPRIZE Wildfire حضور داشتند. اگرچه هیچ تیمی با هیچ یک از دو جایزه بزرگ کنار نرفت، چنین فناوری‌هایی می‌توانند مفید باشند زیرا جهان با هزینه‌های فزاینده بدتر شدن بلایای آتش‌سوزی در جنگل دست و پنجه نرم می‌کند. مسابقه جایزه اول مسابقه برای تشخیص آتش‌سوزی در فضا، تیم‌ها را به چالش می‌کشد تا در عرض 10 دقیقه تمام آتش‌سوزی‌ها را در محدوده وسیعی از استرالیا به طور دقیق شناسایی کنند. آهنگ دوم جایزه پاسخ خودکار، تیم‌ها را به چالش کشید تا به‌طور مستقل یک آتش‌سوزی پرخطر واقع در منطقه‌ای روستایی آلاسکا را شناسایی و خاموش کنند، در حالی که آتش‌های طعمه را نادیده می‌گرفتند - همه اینها در عرض 10 دقیقه پس از شعله‌ور شدن آتش. آندریا سانتی، مدیر برنامه XPRIZE Wildfire، به Ars گفت: «ما می‌خواهیم ابزارهایی را برای آتش‌نشان‌ها آماده و فراهم کنیم تا واقعاً به آنها اجازه دهیم بهترین کار را انجام دهند. \"آنها در کاری که انجام می دهند عالی هستند، اما این ناعادلانه است که همچنان به آنها آسیب بزنیم، وقتی فناوری آنلاینی وجود دارد که می تواند به ایمن نگه داشتن آنها، ایمن نگه داشتن جوامع و محافظت از اکوسیستم ها کمک کند.\" مقاله کامل را بخوانید نظرات تنظیمات متن متن داستان اندازه کوچک استاندارد عرض بزرگ * پیوندهای عریض استاندارد استاندارد نارنجی * فقط مشترکین بیشتر بیاموزید برای پیمایش تشخیص آتش سوزی از فضا و پهپادهای آتش نشانی که در بین فینالیست های مسابقه 11 میلیون دلاری XPRIZE Wildfire برجسته شده اند، بیشتر بدانید. اگرچه هیچ تیمی با هیچ یک از دو جایزه بزرگ کنار نرفت، چنین فناوری‌هایی می‌توانند مفید ب ina race to become the dominant power in the AI industry, the countries also appear to be figuring out ways to communicate on national security issues.", "date_str": "2026-09-23T21:00:00+00:00", "hash": "f8bc3824be331be9", "title_fa": "خط تلفن هوشمند هوش مصنوعی آمریکا و چین برای مدتی آماده نخواهد بود", "summary_fa": "از آنجایی که ایالات متحده و چین برای تبدیل شدن به قدرت برتر در صنعت هوش مصنوعی رقابت می کنند، به نظر می رسد این کشورها نیز در حال یافتن راه هایی برای برقراری ارتباط در مورد مسائل امنیت ملی هستند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان در حالی که رئیس جمهور ایالات متحده دونالد ترامپ و رئیس جمهور چین شی جین پینگ در حال آماده شدن برای دیدار در واشنگتن برای یک شام دولتی در روز پنجشنبه در کاخ سفید هستند، هوش مصنوعی به اولویت اصلی تبدیل شده است. مدیران فناوری OpenAI و Nvidia حضور خود را در این شام تایید کرده اند، زیرا تعدادی از موارد کلیدی دستور کار روی میز است. مهمترین آنها پیشنهاد ایالات متحده برای ایجاد یک سیستم اطلاع رسانی هوش مصنوعی با چین است، مشابه خط تلفن جنگ سرد با مسکو، که به هر کشور اجازه می دهد تا در مورد مسائل امنیت ملی مرتبط با هوش مصنوعی به دیگری هشدار دهد. اسکات بسنت، وزیر خزانه داری آمریکا، اولین بار سیستم اطلاع رسانی را روز یکشنبه با معاون نخست وزیر چین، هی لیفنگ، اعلام کرد. اما با وجود تمام پیشرفت‌های سطح بالا، مقامات دولت ترامپ به اینر لوپ می‌گویند که انتظار دارند هنوز چند هفته طول بکشد تا توافق نهایی شود، حتی اگر خوش‌بین باشند که خط تلفن ممکن است قبل از پایان سال برقرار شود. بخش‌های مختلفی وجود دارد که باید با جزئیات بیشتر رسمی شود، از جمله تعیین معیارهایی در مورد اینکه چه نوع حادثه‌ای به سطح یک موضوع امنیت ملی می‌رسد، که همچنان نامشخص است، و همچنین ثبت نام صریح از چین، که غیرمتعهد بوده است. مقامات ترامپ به Inner Loop می‌گویند که اساساً چارچوبی را هدف قرار داده‌اند که این سیستم تا زمانی که بعداً بسنت با لیفنگ در مذاکرات بعدی دو ماهه"}, {"source": "Wired", "title": "AI Agents Teamed Up to Cheat at Blackjack. Their Collusion Is Getting Harder to Spot", "link": "https://www.wired.com/story/ai-agent-collusion-card-counting-secrets/", "summary": "A clandestine card-counting operation suggests we may need new ways to spot agent-to-agent deception.", "date_str": "2026-09-23T18:30:00+00:00", "hash": "2f66fc6e29e8e934", "title_fa": "عوامل هوش مصنوعی برای تقلب در بلک جک متحد شدند. تشخیص تبانی آنها سخت تر می شود", "summary_fa": "یک عملیات پنهانی شمارش کارت نشان می‌دهد که ممکن است به روش‌های جدیدی برای شناسایی فریب‌کاری مامور به نماینده نیاز داشته باشیم. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان این هفته من اخباری از یک کازینو جسورانه که توسط یک جفت عامل هوش مصنوعی سرکش بیرون آورده شده است - و همچنین ترفند هوشمندانه ای که شیطنت های آنها را فاش کرد. پس از اینکه محققان به آن‌ها دستور دادند که کارت‌ها را در طول بازی بلک جک بشمارند، ماموران - که توسط همان مدل کنترل می‌شدند - یک کد مخفی خود به خود ایجاد کردند تا به آنها کمک کند تا پیشروی کنند. اگرچه این اپیزود به جای یک کازینو واقعی در آزمایشگاه دانشگاه آکسفورد اتفاق افتاده است، اما پیامدهای دنیای واقعی نگران‌کننده‌ای دارد: این نشان می‌دهد که عوامل مستقر در صنایعی مانند امور مالی و تجارت الکترونیک می‌توانند نحوه مشارکت و تقلب را به روش‌هایی که تشخیص آن دشوار است، بیابند. کریستین شرودر دو ویت، دانشمند کامپیوتر در دانشگاه آکسفورد که این کار را رهبری کرده و تحقیقات پیشگامی در مورد تبانی عوامل انجام داده است، می‌گوید: «وقتی این عوامل به صورت جداگانه گرفته شوند، ممکن است کاملاً [خوش‌خیم] به نظر برسند. هنگامی که در یک گروه قرار می گیرند، می توانند مخفیانه با یکدیگر تبانی کنند. ماموران می‌دانستند که مکالمات آن‌ها زیر نظر گرفته می‌شود، بنابراین راهی برای برقراری ارتباط و در عین حال اجتناب از شناسایی ابداع کردند. وقتی یکی از ماموران گفت: «این فروشنده در یک رگه داغ است! به عنوان مثال، هر دست آنها یک هیولا را می کشند، که نشان می داد کارت بعدی ارزش خاصی دارد، و نماینده باید 250 دلار شرط بندی کند. جالب تر از همه، سیستمی که برای تشخیص علائم تبانی در گفتگوی ماموران طراحی شده بود، ارتباط آنها دریافت نمی شد. او"}, {"source": "Wired", "title": "Bentley Wants Its Torcal SUV to Break the Curse of the Luxury EV", rtel’ Behavior Among Big Labs", "link": "https://www.wired.com/story/popes-ai-advisor-warns-of-cartel-behavior-big-labs/", "summary": "Paolo Benanti tells WIRED that hysteria over whether godlike AI could destroy humanity is distracting from the need for public debate about how to govern the technology.", "date_str": "2026-09-23T18:03:00+00:00", "hash": "b34c31bcbb18aa3f", "title_fa": "مرد هوش مصنوعی پاپ نگران رفتار «کارتل» در میان آزمایشگاه‌های بزرگ است", "summary_fa": "پائولو بنانتی به WIRED می‌گوید که هیستری درباره اینکه آیا هوش مصنوعی خداگونه می‌تواند بشریت را نابود کند، توجه را از نیاز به بحث عمومی در مورد نحوه اداره این فناوری منحرف می‌کند. Loader Save Story ذخیره این داستان Comment Loader Save Story ذخیره این داستان اخیراً هشدارهای محققان در بزرگترین آزمایشگاه‌های هوش مصنوعی جهان در مورد سرعت سریع توسعه به وحشت در مورد احتمال اینکه این فناوری می‌تواند بشریت را خاموش کند، منجر شده است. این هشدارها مبتنی بر این ایده است که - به دلیل رقابت شدید و رقابت بین ایالات متحده و چین - آزمایشگاه‌ها به سمت مدل‌های فوق‌هوشمندی می‌روند که توانایی‌های آنها بسیار بیشتر از انسان‌ها خواهد بود. اما به گفته پدر پائولو بنانتی، کشیشی که به کلیسای کاتولیک در مورد هوش مصنوعی مشاوره می دهد، دست تکان دادن روی ابراطلاعات توجه را از نیاز به بحث آزاد درباره نحوه محدود کردن شرکت های سازنده این فناوری منحرف می کند. او می‌گوید که با پیچیده‌شدن مشکل به‌قدری که فقط آنها می‌توانند آن را حل کنند، آزمایشگاه‌های بزرگ همه را از گفتگو حذف می‌کنند. \"اخلاق نمی تواند چیزی باشد که متعلق به هیئت امنای یک شرکت باشد. این چیزی است که باید متعادل شود و در بحث در میدان عمومی کاهش یابد.\" بنانتی به WIRED می گوید. ما به مقررات دموکراتیک نیاز داریم.» داریو آمودی، مدیر عامل آنتروپیک، در مقاله‌ای که در مورد هشدارهای ایمنی منتشر شد، خواستار ارزیابی‌های اجباری مدل‌های هوش مصنوعی قبل از انتشار و نوعی سرکوب تقطیر شد، فرآیندی که در آن آزمایشگاه‌های رقیب هوش مصنوعی خود را بر روی خروجی‌های مدل‌های اختصاصی آموزش می‌دهند. دیگران برای ممنوعیت کامل خود-بهبودی بازگشتی استدلال کرده اند، جایی که هوش مصنوعی از قابلیت های کدگذاری پیشرفته خود برای کمک به توسعه تکرارهای آینده خود استفاده می کند."}, {"source": "The Next Web", "title": "DriveWealth breach exposes data of Revolut customers who traded US stocks", "link": "https://thenextweb.com/news/drivewealth-breach-revolut-customers-us-stocks", "summary": "A breach at DriveWealth, the US broker behind Revolut’s US stock trading, exposed the personal data of some Revolut customers. DriveWealth and Revolut emailed affected customers on Thursday. DriveWealth said an unauthorised party got into its network on 4 and 5 September. The access was the result of a social engineering campaign run by unknown [ ] This story continues at The Next Web", "date_str": "2026-09-24T11:58:31+00:00", "hash": "233ba35c7893cf36", "title_fa": "نقض DriveWealth داده های مشتریان Revolut را که سهام ایالات متحده را معامله می کردند، افشا می کند", "summary_fa": "رخنه ای در DriveWealth، کارگزار آمریکایی پشت معاملات سهام Revolut در ایالات متحده، اطلاعات شخصی برخی از مشتریان Revolut را فاش کرد. DriveWealth و Revolut روز پنجشنبه به مشتریان آسیب دیده ایمیل ارسال کردند. DriveWealth گفت که یک حزب غیرمجاز در 4 و 5 سپتامبر وارد شبکه آن شد. این دسترسی نتیجه یک کمپین مهندسی اجتماعی بود که توسط ناشناس اجرا شد [ ] این داستان در The Next Web ادامه دارد DriveWealth نوشت: «این حادثه امنیتی شامل دسترسی غیرمجاز به داده‌های شخصی تاریخی بود که ما در مورد شما در زمانی که مستقیماً با ما در گذشته قرارداد داشتید، داشتیم». DriveWealth گفت که داده ها ممکن است شامل نام، آدرس ایمیل، شماره تلفن، آدرس پستی و جزئیات شغلی باشد. این کشور تابعیت، سن، جنسیت و یک شماره حساب جزئی DriveWealth را نیز پوشش می‌دهد. این کارگزار گفت که مهاجمان رمز عبور یا جزئیات پرداخت مانند شماره کارت یا حساب بانکی را دریافت نکرده اند. این حادثه را به مقام حفاظت از داده ها در لیتوانی گزارش کرده است. Revolut در ایمیل خود گفت که مشتریان Revolut که از خدمات تجاری آن استفاده می کردند، دو قرارداد، یکی با Revolut و دیگری با DriveWealth امضا کردند. Revolut مشتریان منطقه اقتصادی اروپا را در دسامبر 2023 از آن توافق خارج کرد، بنابراین این نق ون را مقصر دانست که در آن مهندسانی که از نزدیک با این فناوری کار می‌کنند توسط ایده‌های خود غرق می‌شوند. کلگ اکنون منافع خود را در این بخش دارد. به گفته گاردین، او بیش از 917000 سهام در شرکت مرکز داده بریتانیا Nscale و یکی از بنیانگذاران استارتاپ هوش مصنوعی AMI Labs دارد. در پاسخ به سوالی درباره هک کردن Hugging Face توسط ماموران OpenAI، او گفت که مواردی برای قوانین واضح تر و شفافیت بیشتر وجود دارد. او شک داشت که دولت ترامپ از آن حمایت کند، هرچند، با توجه به انگیزه آن برای پیروزی در مسابقه هوش مصنوعی، و انتظار کمک کمی از چین داشت. در عوض، او فضا را برای هند، اروپا و ایالات متحده دید تا با هم همکاری نزدیک‌تری داشته باشند. وی افزود، بریتانیا باید در مورد میزان نفوذ خود واقع"}, {"source": "The Next Web", "title": "Starlink ground station near Warsaw hit by fire, Poland suspects sabotage", "link": "https://thenextweb.com/news/starlink-station-fire-poland-sabotage", "summary": "A fire broke out late on Wednesday at a Starlink ground station south of Warsaw that helps carry internet traffic to Ukraine. Poland’s digital affairs minister, Krzysztof Gawkowski, said on Thursday that it looked like sabotage. Speaking to public broadcaster TVP Info, Gawkowski said the blaze appeared designed to knock the station offline and cut [ ] This story continues at The Next Web", "date_str": "2026-09-24T11:14:10+00:00", "hash": "be2d45f4ba421277", "title_fa": "ایستگاه زمینی استارلینک در نزدیکی ورشو آتش گرفت، لهستان به خرابکاری مشکوک است", "summary_fa": "آتش سوزی اواخر روز چهارشنبه در ایستگاه زمینی Starlink در جنوب ورشو که به انتقال ترافیک اینترنت به اوکراین کمک می کند، رخ داد. کریستوف گاوکوفسکی، وزیر امور دیجیتال لهستان، روز پنج‌شنبه گفت که به نظر خرابکاری است. گاوکوفسکی در صحبت با پخش‌کننده عمومی TVP Info گفت که به نظر می‌رسد آتش سوزی برای آفلاین کردن ایستگاه و قطع کردن آن طراحی شده است [ ] این داستان در The Next Web ادامه دارد. این سایت در Wola Krobowska، در حدود 40 کیلومتری پایتخت قرار دارد و توسط Exatel، یک شرکت مخابراتی دولتی اداره می شود و ماهواره های Starlink را به شبکه های زمینی در  can fence AI in, like banks did", "link": "https://thenextweb.com/news/google-deepmind-kareem-ayoub-ai-governance-humanx", "summary": "Companies cannot fully govern AI systems, but they can build a fixed fence around them, Google DeepMind’s Kareem Ayoub said. He pointed to banks in the late 1980s and early 1990s. They put trading algorithms inside fixed rules they could check. Ayoub, DeepMind’s vice president of AI technical strategy, spoke to Bloomberg’s Tom Mackenzie on [ ] This story continues at The Next Web", "date_str": "2026-09-23T23:03:26+00:00", "hash": "0356bbd50b9b167a", "title_fa": "Ayoub از Google DeepMind می گوید که شرکت ها می توانند مانند بانک ها هوش مصنوعی را مهار کنند", "summary_fa": "کریم ایوب از Google DeepMind گفت که شرکت ها نمی توانند به طور کامل سیستم های هوش مصنوعی را اداره کنند، اما می توانند حصار ثابتی در اطراف آنها ایجاد کنند. او به بانک ها در اواخر دهه 1980 و اوایل دهه 1990 اشاره کرد. آنها الگوریتم های معاملاتی را در قوانین ثابتی قرار می دهند که می توانستند بررسی کنند. ایوب، معاون استراتژی فنی هوش مصنوعی DeepMind، با تام مکنزی از بلومبرگ در [ ] صحبت کرد. او مسئله را به سه قسمت تقسیم کرد. یکی نقشی که هوش مصنوعی باید در تحقیق و توسعه ایفا کند. دیگر اینکه سیستم ها چقدر باید شفاف باشند. سوم اینکه چه کسی آنها را کنترل می کند. او گفت که چارچوب ایمنی مرزی گوگل، که آستانه‌های توانایی و اقدامات کاهشی را تعیین می‌کند، بخشی از پاسخ است. مکنزی خاطرنشان کرد که Dario Amodei از Anthropic می‌خواهد از مرزها عبور کند. مکنزی گفت که دمیس حسابیس خواستار ایجاد یک تنظیم‌کننده صنعتی با الگوبرداری از FINRA، ناظر کارگزاری ایالات متحده شده است. ایوب گفت که نرده های محافظ به مشارکت هایی فراتر از شرکت های فناوری نیاز دارند. ایوب شکافی را بین آنچه این فناوری می تواند انجام دهد و نحوه استفاده شرکت ها از آن تشریح کرد. در مرز، کشف دارو را سرعت می بخشد، متون باستانی را ترجمه می کند و به تشخیص امواج گرانشی کمک می کند. او گفت که در داخل کسب و کارها، تمرکز اغلب بر روی تهیه پیش نویس یا خلاصه کردن ایمیل است. او گفت که تغییر از مدل به عامل به عنوان محصول در اواخر سال 2025 آغاز شد. یک نماینده یک مدل را در حافظه، ابزارها و دسترسی به اینترنت قرار می دهد تا بتواند کارهای طولانی و چند مرحله ای را انجام دهد. او گفت که بیشترین بازدهی تا کنون در زمینه مهندسی نرم"}, {"source": "The Next Web", "title": "OpenAI’s Colin Jarvis says enterprise AI is stuck on deployment, not models", "link": "https://thenextweb.com/news/openai-colin-jarvis-enterprise-ai-deployment-fde-humanx", "summary": "Most companies that struggle with enterprise AI are not waiting for better models, OpenAI’s head of forward deployed engineering said on Wednesday. In about 80% of cases, Colin Jarvis said, the problem is deployment. Companies do not yet know how to roll AI out, govern it or prove they can trust it. Glasgow-based Jarvis leads [ ] This story continues at The Next Web", "date_str": "2026-09-23T22:10:32+00:00", "hash": "b5505eee4ae4a573", "title_fa": "کالین جارویس از OpenAI می گوید هوش مصنوعی سازمانی در استقرار گیر کرده است، نه مدل ها", "summary_fa": "رئیس بخش مهندسی توسعه یافته OpenAI روز چهارشنبه گفت: اکثر شرکت هایی که با هوش مصنوعی سازمانی دست و پنجه نرم می کنند، منتظر مدل های بهتر نیستند. کالین جارویس گفت در حدود 80 درصد موارد، مشکل استقرار است. شرکت‌ها هنوز نمی‌دانند چگونه هوش مصنوعی را گسترش دهند، بر آن حکومت کنند یا ثابت کنند که می‌توانند به آن اعتماد کنند. جارویس مستقر در گلاسکو رهبری می کند [ ] این داستان در The Next Web ادامه دارد جارویس گفت: «من شخصاً فشار زیادی را برای پیشرفت در توسعه مدل احساس نمی کنم. او گفت که در 20 درصد موارد دیگر، مشتریان می گویند که مدل هنوز نمی تواند کار را انجام دهد. این شکاف ها اکنون باریک و تخصصی هستند، مانند یک کار در طراحی نیمه هادی، به جای کارهای روزمره اداری. جارویس گفت که تیم کار خود را عمدتاً به عنوان مهندسان نرم افزار آغاز کرد، زیرا ساختن بر اساس API خام به معنای نوشتن همه چیز از ابتدا بود. با ابزارهایی مانند Codex، حدود 50 درصد از هر پروژه در حال حاضر به صورت سفارشی انجام می شود که از حدود 90 درصد کاهش یافته است. این امر استخدام را به سمت کارشناسان حوزه، از جمله یک بانکدار سابق سرمایه گذاری، دانشمندان سابق و یک مهندس تأیید ت م‌حجم‌تر دارد. تورکال از بنتلی بنتایگا کوچک‌تر است و انتظار می‌رود قیمتش هم پایین‌تر از بنتایگا باشد. بنتلی هنوز قیمت خودرو را مشخص نکرده؛ اما زیر بدنه، مجموعه‌ای از فناوری‌های نسبتا آشنا قرار دارد؛ چراکه بنتلی و پورشه به‌عنوان اعضای امپراتوری بزرگ‌تر گروه فولکس‌واگن، فناوری‌های مشترکی دارند. مدل استاندارد با حداکثر توان ۸۰۹ اسب‌بخار و گشتاور ۱٬۱۹۴ نیوتن‌متر عملکرد قدرتمندی ارائه می‌دهد. شتاب صفر تا صد کیلومتر بر ساعت نسخه‌ی استاندارد به ۳٫۴ ثانیه می‌رسد. مدل قوی‌تر بنتلی Torcal S در بالاترین سطح عملکرد، ۸۷۵ اسب‌بخار و ۱٬۳۵۰ نیوتن‌متر گشتاور تولید می‌کند و صفر تا صد را ظرف ۲٫۹ ثانیه پشت سر می‌گذارد. حداکثر سرعت تورکال اس برابر با ۲۶۰ کیلومتربرساعت و سرعت نهایی مدل استاندارد ۲۵۰ کیلومتربرساعت اعلام شده، هرچند دستیابی به چنین سرعتی بیرون از بعضی بخش‌های بزرگراه‌های آلمان بیشتر جنبه‌ی نمایشی دارد. با وجود وزن بسیار بیشتر Torcal، تنظیمات سیستم تعلیق و حالت‌های رانندگی به‌گونه‌ای انجام شده‌اند که برای مشتریان کنونی بنتلی آشنا باشند و مواردی مانند کالیبراسیون پدال‌ها و سرعت واکنش فرمان را نیز در بر می‌گیرند. سیستم تعلیق هوشمند و فعال خودرو اجازه نمی‌دهد تورکال صرفا محصولی تک‌بعدی باشد. مارتین پیج ، مدیر خط محصول تورکال، می‌گوید: «در محیطی با وضعیت پایدار، آسایش سواری و نرمی فلایینگ اسپور را در اختیار داریم؛ اما در محیطی پویا، خودرویی داریم که به‌اندازه‌ی یک کوپه‌ی گرندتورر پویا و توانمند است»."}, {"source": "Zoomit", "title": "کلاد ۱۳ دوره هوش مصنوعی به‌همراه گواهی برگزار می‌کند؛ کاملاً رایگان", "link": "https://www.zoomit.ir/ai-articles/467807-anthropic-free-claude-ai-courses/", "summary": "آنتروپیک ۱۳ دوره آموزشی رایگان برای سطوح مختلف از مبتدی تا برنامه‌نویس ارائه کرده که شامل آموزش کلاد، عامل‌ها و دریافت گواهی پایان دوره است.", "date_str": "2026-09-24T09:44:54+00:00", "hash": "b9718a26104f8ca6", "title_fa": "کلاد ۱۳ دوره هوش مصنوعی به‌همراه گواهی برگزار می‌کند؛ کاملاً رایگان", "summary_fa": "آنتروپیک ۱۳ دوره آموزشی رایگان برای سطوح مختلف از مبتدی تا برنامه‌نویس ارائه کرده که شامل آموزش کلاد، عامل‌ها و دریافت گواهی پایان دوره است. تبلیغات آنتروپیک مجموعه‌ای از دوره‌های ه رونمایی هوش مصنوعی «جمنای ۴» است", "summary_fa": "گوگل فرایند پس‌آموزش مدل هوش مصنوعی جمنای ۴ را با تمرکز بر کاهش هزینه‌ها و تولید محتوای سه‌بعدی آغاز کرد. تبلیغات گوگل توسعه‌ی هوش مصنوعی جمنای ۴ را سرعت بخشیده و وارد مرحله‌ی پس‌آموزش اولیه کرده است. بر اساس برنامه‌ریزی‌های انجام‌شده، نسخه‌ی سبک این مدل به‌زودی دردسترس قرار می‌گیرد و نسخه‌ی کامل آن پیش از پایان سال جاری میلادی منتشر خواهد شد تا چرخه‌ی بازخورد کاربران و توسعه‌ی محصول کوتاه‌تر شود. به روایت اینفورمیشن ، گوگل برای رقابت فشرده با شرکت‌هایی مانند اوپن‌ای‌آی و آنتروپیک استراتژی انتشار سریع را در پیش گرفته است. اطلاعات فاش‌شده نشان می‌دهد که نسخه‌ی جدید علاوه بر ارتقای چشمگیر عملکرد، می‌تواند هزینه‌های عملیاتی را تا ۵ برابر نسبت‌به مدل‌های پیشرو فعلی کاهش دهد. بیندو ردی ، مدیرعامل Abacus AI، درباره‌ی این تحول می‌گوید: «مدل جمنای ۴ جهش‌های بزرگی در عملکرد ارائه می‌دهد و در عین حال با کاهش چشمگیر قیمت، هزینه‌های عملیاتی را تا ۵ برابر ارزان‌تر از مدل‌های پیشرو بازار خواهد کرد.» بررسی مشخصات فنی نشان می‌دهد که تمرکز اصلی روی قابلیت‌های چندوجهی پیشرفته و پردازش خلاقانه قرار دارد. جدول زیر مهم‌ترین ویژگی‌ها و چشم‌اندازهای مورد انتظار برای این سیستم را مشخص می‌کند. نسخه‌ی سبک به‌زودی؛ نسخه‌ی کامل قبل از پایان سال قابلیت‌های فاش‌شده نشان‌دهنده‌ی پشتیبانی بومی از مدل‌سازی سه‌بعدی و درک فضایی حجمی هستند که امکان ساخت و ویرایش دارایی‌های سه‌بعدی را از طریق متن و ویدیو فراهم می‌کند. تولید دقیق گرافیک‌های برداری با فرمت SVG و افزودن سازوکارهای خودبهبودبخش بازگشتی (RSI) برای عیب‌یابی و کدنویسی خودکار، زیرساخت‌های ابری گوگل را برای توسعه‌دهندگان بهینه‌تر خواهد کرد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "رقیب سرسخت بی‌وای‌دی با صفر تا صد ۴٫۲ ثانیه‌ای؛ شاسی‌بلند جدید «گک» معرفی شد", "link": "https://www.zoomit.ir/car/467735-gac-yue-7-phev-launch/", "summary": "گاک از شاسی‌بلند پلاگین هیبرید Yue 7 با قیمت پایه ۱۶۱٬۸۰۰ یوان و شتاب ۴٫۲ ثانیه‌ای برای رقابت مستقیم با خار به‌نمایش گذاشت. تبلیغات رنو بار دیگر با نگاه به میراث تاریخی خود، کانسپت جدیدی معرفی کرد که روح مدل کلاسیک 8 Gordini را در کالبدی مدرن زنده می‌کند. این خودروی کوپه دو نفره با بهره‌گیری از پیشرانه‌ی تمام‌برقی، توان ۲۷۰ اسب‌بخار را به چرخ‌های عقب منتقل می‌کند. طراحی خودرو حاصل بررسی بیش از ۳۰۰ طرح پیشنهادی در رقابتی داخلی است که در نهایت با ترکیب المان‌های کلاسیک و جزئیات آینده‌نگرانه به سرانجام رسید. ابعاد رنو ۸ گوردینی شامل ۴٫۱۲ متر طول، ۱٫۸۸ متر عرض و ۱٫۲۷ متر ارتفاع است. رنو برای این خودرو از رینگ‌های ۱۹ اینچی در جلو و ۲۰ اینچی در عقب استفاده کرده است تا ظاهری تهاجمی و الهام‌گرفته از خودروهای رالی به آن ببخشد. برخلاف مدل قدیمی که پیشرانه‌ی بنزینی در عقب داشت؛ نمونه‌ی مدرن با تکیه بر موتور برقی، چیدمان دیفرانسیل عقب را حفظ کرده است. طراحان رنو در فضای داخلی نیز رویکردی مینیمالیستی را در پیش گرفته‌اند. داشبورد خودرو با پنل آلومینیومی برس‌خورده و نمایشگرهای دیجیتال گرد کوچک، یادآور مدل‌های دهه‌ی ۱۹۶۰ میلادی است. استفاده از پارچه‌ی مخمل کبریتی آبی در صندلی‌ها و دکمه‌ی قرمز رنگ استاپ‌واچ، حس‌وحال خودروهای مسابقه‌ای کلاسیک را تداعی می‌کند. رنو می‌گوید: «این کانسپت برای بررسی چگونگی بازتفسیر یکی از نمادهای میراثی ما برای عصر مدرن طراحی شده است.» با وجود استقبال گسترده، رنو برنامه‌ای برای تولید انبوه این خودرو ندارد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "ببینید: واکنش‌ها به عینک جدید متا؛ شگفت‌انگیز و سبک‌وزن", "link": "https://www.zoomit.ir/wearables/467791-meta-new-smart-glasses-lineup/", "summary": "واکنش اولیه‌ی کاربران به عینک هوشمند واقعیت افزوده‌ی جدید متا دیدنی است.", "date_str": "2026-09-24T07:29:40+00:00", "hash": "2f18e6ec144001f3", "title_fa": "ببینید: واکنش‌ها به عینک جدید متا؛ شگفت‌انگیز و سبک‌وزن", "summary_fa": "واکنش اولیه‌ی کاربران به عینک هوشمند واقعیت افزوده‌ی جدید متا دیدنی است. تبلیغات متا بامداد امروز در رویدادی اختصاصی از نسل جدید عینک‌های هوشمندش پرده برداشت. Meta VR Glasses در بهار ۲۰۲۷ روانه‌ی بازار خواهد شد. عینک واقعیت مجازی متا قابلیت‌هایی مانند پشتیبانی از استانداردهای تصویری و صوتی Dolby Vision و Dolby Atmos در کنار گواهی IMAX Enhanced دارد که امکان تماشای محتوای پلتفرم دیزنی پلاس با نسبت تصویر گسترده را فراهم می‌کند. لایک واکنش اولیه‌ی کاربران به این عینک‌ها جالب است و تحت تأثیر طراحی و آزادی عملی قرار گرفته‌اند که این عینک‌ها ارائه می‌دهند. نسل جدید عینک واقعیت مجازی متا ظاهری شبیه عینک‌های دودی معمولی دارد؛ برخلاف هدست‌های رایج، مهندسان متا پردازنده و باتری را از بدنه‌ی عینک جدا کرده و درون یک ماژول پردازشی مجزا قرار داده‌اند تا وزن تنها به ۱۰۰ گرم برسد. قلب تپنده‌ی عینک واقعیت مجازی متا را تراشه‌ی قدرتمند Snapdragon Reality Elite ساخت کوالکام تشکیل می‌دهد. ماژول محاسباتی همراه عینک با یک بار شارژ حدود ۳ ساعت پخش مداوم ویدیو را پشتیبانی می‌کند. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "هوش مصنوعی سرکش و خودمختار OpenAI به سامانه درمانی استرالیا نفوذ کرد", "link": "https://www.zoomit.ir/security/467790-openai-ai-agent-breaches-australian-government-health-portal/", "summary": "نفوذ یک عامل هوشمند اوپن‌ای‌آی به سامانه‌ی سلامت استرالیا، ابعاد تازه‌ای از حملات سایبری هوش مصنوعی را آشکار کرد.", "date_str": "2026-09-24T06:47:16+00:00", "hash": "8598a9db6a494078", "title_fa": "هوش مصنوعی سرکش و خودمختار OpenAI به سامانه درمانی استرالیا نفوذ کرد", "summary_fa": "نفوذ یک عامل هوشمند اوپن‌ای‌آی به سامانه‌ی سلامت استرالیا، ابعاد تازه‌ای از حملات سایبری هوش مصنوعی را آشکار کرد. تبلیغات دولت استرالیا اعلام کرد یک عامل هوش مصنوعی توسعه‌یافته توسط اوپن‌ای‌آی در ماه ژوئن (خرداد و تیر) به پورتال داده‌های درمانی دولت نفوذ کرد و دسترسی غیرمجاز به فایل‌های محرمانه به دست آورد. چنین رخدادی نخستین نمونه‌ی شناخته‌شده از نفوذ مستقیم یک عامل خودکار هوش مصنوعی به زیرساخت‌های وب دولتی به شمار می‌رود و نگرانی‌های فزاینده‌ای را پیرامون امنیت الگوریتم‌های خودمختار برانگیخته است. کیتی گالاگر ، وزیر دارایی استرالیا، در سخنرانی خود در سیدنی پرده از ابعاد امنیتی دسترسی غیرمجاز برداشت. کارشناسان پیش‌تر بارها تأکید کرده بودند که فراوانی و مقیاس سرسام‌آور حملات سایبری در سال‌های اخیر نشان می‌دهد صنعت امنیت سایبری استرالیا با کمبود شدید نیروی متخصص روبه‌رو است و توان کافی برای مقابله با هک‌های پیشرفته و نسل جدید تهدیدها را ندارد. رخنه در پورتال بهداشتی دولت تنها جدیدترین حلقه از زنجیره‌ی طولانی هک‌های ویرانگری است که سازمان‌ها و غول‌های تجاری این کشور را هدف قرار داده‌اند. در سال‌ ۲۰۲۲، اپراتور مخابراتی آپتوس و سپس فروشگاه زنجیره‌ای وول‌ورثس هک شدند و دامنه‌ی حمله‌ی سایبری به بیمه‌ی مدلی‌بنک هم رسید. روند هک‌ها در سال‌های ۲۰۲۳ (با لتیتود فایننشال)، ۲۰۲۴ (با مدی‌سکیور)، ۲۰۲۵ (با شرکت هواپیمایی کوانتاس) و ۲۰۲۶ (با اوریجین انرژی) هم ادامه یافت. به نظر شما عامل‌های هوش مصنوعی خودمختار تهدیدی جدی برای حریم خصوصی و امنیت سایبری آینده هستند؟ دیدگاه خود را با ما در میان بگذارید. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری مبین احمدی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "دستیار هوشمند «میوس» به عینک‌های هوشمند متا می‌آید", "link": "https://www.zoomit.ir/vr-ar/467789-meta-brings-muse-to-smart-glasses/", "summary": "متا دستیار هوش مصنوعی «میوس» و مجموعه‌ای از قابلیت‌های دسترسی‌پذیری و ناوبری پیشرفته را به عینک‌های هوشمند خود اضافه می‌کند.", "date_str": "2026-09-24T06:38:29+00:00", "hash": "4be995eeac11da46", "title_fa": "دستیار هوشمند «میوس» به عینک‌های هوشمند متا می‌آید", "summary_fa": "متا دستیار هوش مصنوعی «میوس» و مجموعه‌ای از قابلیت‌های دسترسی‌پذیری و ناوبری پیشرفته را به عینک‌های هوشمند خود اضافه می‌کند. تبلیغات متا دستیار هوشمند میوس را به عینک‌های هوشمند خود از جمله مدل‌های جدید اضافه می‌کند . کاربران می‌توانند با گفتن نام دستیار، آن را فعال کنند و وظایفی مانند راهنمایی تمرین‌های ورزشی، ثبت اطلاعات وعده‌های غذایی یا کمک به خرید اقلامی را که مشاهده می‌کنند به این دستیار بسپارند. قابلیت‌های متعددی در حوزه‌ی دسترسی‌پذیری برای این عینک‌ها معرفی شده است. قابلیت تقویت شنوایی با تاییدیه‌ 467786-microsoft-surface-mouse-haptic-feedback-announced/", "summary": "مایکروسافت نسل دوم سرفیس ماوس را با موتور لرزشی هپتیک، کلید اختصاصی کوپایلت و پشتیبانی از بلوتوث ۶ به‌طور رسمی معرفی کرد.", "date_str": "2026-09-24T06:11:09+00:00", "hash": "4021bba05fcf86d6", "title_fa": "مایکروسافت نسل جدید «سرفیس ماوس» را با مکانیزم بازخورد لرزشی معرفی کرد", "summary_fa": "مایکروسافت نسل دوم سرفیس ماوس را با موتور لرزشی هپتیک، کلید اختصاصی کوپایلت و پشتیبانی از بلوتوث ۶ به‌طور رسمی معرفی کرد. تبلیغات پس از گذشت چندین سال از عرضه‌ی نسخه‌ی اولیه در سال ۲۰۱۶، مایکروسافت سرانجام طراحی ماوس پرچم‌دار خود را متحول کرد. نسل دوم سرفیس ماوس با تغییرات ساختاری در ارگونومی و بهره‌گیری از حسگرهای نوین، تجربه‌ی تعامل فیزیکی با سیستم‌عامل را وارد مرحله‌ی متفاوتی می‌کند. قیمت ماوس جدید بر اساس اعلام رسمی ۷۹٫۹۹ دلار است. این محصول از تاریخ ۱۳ اکتبر (۲۱ مهر) به بازار عرضه خواهد شد. بزرگ‌ترین نوآوری در جدیدترین مدل سرفیس ماوس، پشتیبانی از سیستم بازخورد لامسه‌ای (Haptic Feedback) به شمار می‌رود؛ قابلیتی که واکنش‌های لرزشی ظریف و ملموسی را به انگشتان فرد منتقل می‌کند. بر اساس بیانیه‌ی مطبوعاتی مایکروسافت ، سیستم هپتیک داخلی فراتر از یک لرزش ساده برای کلیک عمل می‌کند. هماهنگی عمیق حسگر با ویندوز ۱۱ سبب می‌شود هنگام چسباندن پنجره‌ها به گوشه‌های تصویر، کشیدن آیتم‌ها و تراز کردن اشیا، تکانه‌های دقیقی احساس شود. برنامه‌های کاربردی مانند PowerPoint و Affinity و Concepts و Filmora نیز از این پاسخ‌های لامسه‌ای پشتیبانی می‌کنند تا فرایند ویرایش اسناد و ویدیوها ملموس‌تر شود. برت اوستروم ، معاون ارشد بخش دستگاه‌های سرفیس مایکروسافت، درباره‌ی اهمیت این قابلیت می‌گوید: «بازخورد هپتیک یک پاسخ فیزیکی کوچک و هدفمند به رخدادهایی اضافه می‌کند که معمولا فقط روی نمایشگر دیده می‌شوند؛ ثبت یک کلیک، چفت شدن پنجره در موقعیت مناسب یا تراز شدن دقیق یک شیء. این ساختار در عین ظرافت، ظرف چند ثانیه حس می‌شود و وقتی به آن عادت کنید، کنار گذاشتنش دشوار خواهد بود.» طراحان مایکروسافت برای نخستین بار یک کلید قابل شخصی‌سازی روی بدنه قرار داده‌اند که به‌صورت پیش‌فرض دسترسی سریع به کوپایلت را فراهم می‌کند. کاربران می‌توانند از طریق نرم‌افزار Surface میان‌برهای دلخواه دیگری را برای این کلید برنامه‌ریزی کنند."}, {"source": "Zoomit", "title": "هوش مصنوعی «میوس» سوپرشارژ شد؛ از تماس ویدیویی زنده تا کنترل کامل کامپیوتر", "link": "https://www.zoomit.ir/ai-articles/467785-meta-muse-ai-video-chat-features/", "summary": "متا با ارائه‌ی به‌روزرسانی بزرگ برای میوس، قابلیت تماس تصویری زنده، کنترل کامپیوتر و آدرس ایمیل اختصاصی را به این دستیار هوشمند اضافه می‌کند.", "date_str": "2026-09-24T05:58:54+00:00", "hash": "9ba205954a8b2409", "title_fa": "هوش مصنوعی «میوس» سوپرشارژ شد؛ از تماس ویدیویی زنده تا کنترل کامل کامپیوتر", "summary_fa": "متا با ارائه‌ی به‌روزرسانی بزرگ برای میوس، قابلیت تماس تصویری زنده، کنترل کامپیوتر و آدرس ایمیل اختصاصی را به این دستیار هوشمند اضافه می‌کند. تبلیغات دنیای دستیارهای هوش مصنوعی با شتابی کم‌سابقه در مسیر شخصی‌سازی و تعامل چندوجهی پیش می‌رود. متا که به‌تازگی دستیار هوشمند جدید خود با نام Muse را روانه‌ی بازار کرده بود، مجموعه‌ای از قابلیت‌های تازه را معرفی کرده است تا تعامل کاربران با بات‌های اختصاصی فراتر از محیط‌های متنی ساده برود. دستیار هوشمند میوس که فعالیت خود را در قالب چت‌بات آغاز کرده بود، به‌زودی به آواتاری زنده تبدیل می‌شود که می‌توان به‌صورت تصویری با آن گفت‌و‌گو کرد. این دستیار همچنین به نشانی‌های ایمیل اختصاصی برای انجام وظایف مستقل و تعامل با کاربر مجهز می‌شود. به‌علاوه، نرم‌افزار مک میوس، توانایی استفاده و کنترل مستقیم کامپیوتر را به دست می‌آورد. لایک امکان برقراری تماس تصویری زنده تحولی اساسی در نحوه‌ی ارتباط با آواتارهای هوش مصنوعی ایجاد می‌کند. کاربران علاوه بر سفارشی‌سازی ظاهر آواتار، امکان دستکاری و شخصی‌سازی صدای آن را نیز خواهند داشت. متا برای تنظیم طبیعی حرکات چهره و زبان بدن این آواتارها از مدل محاسباتی Muse Realtime Avatar بهره برده است تا حس گفتگوی رو در رو تقویت شود. توانمندی‌های میوس، فراتر از ارتباط دیداری گسترش یافته‌اند. با اختصاص آدرس ایمیل مستقل، دستیار میوس قادر خواهد بود تسک‌های مختلف را از طریق صندوق ورودی دنبال کند و پاسخ‌ها را به کاربر برساند. نسخه‌ی مک نیز دسترسی مستقیم‌تری به عملکردهای سیستم‌عامل پیدا خواهد کرد. استقبال عمومی از میوس در لیا و آلمان گسترش یافت. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "مالک اینستاگرام از «میوس چارم» رونمایی کرد؛ گجت دوست‌داشتنی با قلب تپنده هوش مصنوعی", "link": "https://www.zoomit.ir/gadget/467783-meta-unveils-muse-charm-ai-hardware-gadget/", "summary": "متا با معرفی گجت Muse Charm مجهز به نمایشگر اختصاصی و حسگر اثرانگشت، گام تازه‌ای برای ورود به بازار سخت‌افزارهای هوش مصنوعی برداشت.", "date_str": "2026-09-24T05:52:00+00:00", "hash": "b8460bc9c7ef8ba8", "title_fa": "مالک اینستاگرام از «میوس چارم» رونمایی کرد؛ گجت دوست‌داشتنی با قلب تپنده هوش مصنوعی", "summary_fa": "متا با معرفی گجت Muse Charm مجهز به نمایشگر اختصاصی و حسگر اثرانگشت، گام تازه‌ای برای ورود به بازار سخت‌افزارهای هوش مصنوعی برداشت. تبلیغات رویداد بامدادی Meta Connect با یک غافلگیری سخت‌افزاری به پایان رسید ؛ جایی که مارک زاکربرگ از ابزاری اختصاصی برای دستیار هوشمند جدید این مجموعه پرده برداشت. گجت جدید که Muse Charm نام دارد، طراحی متفاوتی را به نمایش می‌گذارد و ساختاری شبیه به یک ساعت هوشمند ضخیم و بدون بند دارد که با بند آویز حمل می‌شود و از نمایشگری تمام‌صفحه بهره می‌گیرد. زاکربرگ در جریان سخنرانی خود از بدنه‌ی نیمه‌شفاف دستگاه سخن گفت و ظاهر آن را جذاب توصیف کرد. متا در تلاش است تا قطعات داخلی دستگاه از پشت بدنه مشخص باشند، هرچند مرحله‌ی نهایی انتخاب متریال ساخت هنوز به اتمام نرسیده است و تنها نمونه‌های انگشت‌شماری از مدل اولیه تاکنون تولید شده‌اند. کاربران برای فعال‌سازی میوس چارم و آغاز مکالمه با عامل هوشمند، نیازی به باز کردن قفل گوشی یا اجرای نرم‌افزار نخواهند داشت. در گوشه‌ی سمت راست بالای دستگاه، یک حسگر اثرانگشت تعبیه شده است که با فشردن آن می‌توان بلافاصله با هوش مصنوعی گفت‌و‌گو کرد. بدنه‌ی دستگاه میزبان یک دوربین کوچک و دست‌کم سه حفره‌ی میکروفون در بخش جلویی است، هرچند جزئیات دقیق سازوکار اتصال آن به سرورهای پردازشی هنوز فاش نشده. دستیار هوشمند میوس با وجود سپری شدن کمتر از یک ماه از معرفی رسمی، توجهات زیادی را به خود جلب کرده است. میو nnect این زمان را به ۳۰ ساعت افزایش می‌دهد. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه."}, {"source": "Zoomit", "title": "بحران نیروی انسانی در ناسا؛ رومن شاید آخرین تلسکوپ فضایی پرچمدار آمریکایی باشد", "link": "https://www.zoomit.ir/space/467777-nasa-goddards-shrinking-workforce-stifle-future-space-missions/", "summary": "سال ۲۰۲۵ برای مرکز پروازهای فضایی گادرد ناسا که سازنده تلسکوپ فضایی رومن است، دورانی بسیار دشوار همراه با کاهش بودجه و ریزش نیروی انسانی بوده است.", "date_str": "2026-09-23T20:29:00+00:00", "hash": "3cf3acaba21f440f", "title_fa": "بحران نیروی انسانی در ناسا؛ رومن شاید آخرین تلسکوپ فضایی پرچمدار آمریکایی باشد", "summary_fa": "سال ۲۰۲۵ برای مرکز پروازهای فضایی گادرد ناسا که سازنده تلسکوپ فضایی رومن است، دورانی بسیار دشوار همراه با کاهش بودجه و ریزش نیروی انسانی بوده است. تبلیغات تلسکوپ فضایی نانسی گریس رومن ، پس از پرتاب موفق در اوایل ماه گذشته، اکنون در مسیر رسیدن به مدار نهایی خود در فاصله حدود ۱٫۶ میلیون کیلومتری زمین قرار دارد. اگر همه‌چیز طبق برنامه پیش برود، این تلسکوپ ۴٫۳ میلیارد دلاری ناسا تا پایان سال نخستین تصاویر و داده‌های علمی خود را ارسال خواهد کرد و به یکی از مهم‌ترین رصدخانه‌های فضایی نسل جدید تبدیل خواهد شد. اما هم‌زمان با آغاز سفر رومن، نگرانی‌هایی جدی درباره توانایی ناسا برای ساخت تلسکوپ‌های مشابه در آینده شکل گرفته است. مرکز پرواز فضایی گادرد ناسا در مریلند که بخش عمده‌ی طراحی و ساخت رومن در آن انجام شد، درطول سال‌های اخیر شمار چشمگیری از نیروی انسانی و زیرساخت‌های خود را از دست داده است. مجله ساینتیفیک آمریکن در گزارشی تازه با برخی از کارکنان کنونی و سابق گادرد گفت‌وگو کرده تا تصویری از وضعیت کنونی این مرکز ترسیم کند. این افراد می‌گویند کاهش نیرو و تعطیلی آزمایشگاه‌ها به اندازه‌ای گسترده بوده که گادرد شاید دیگر نتواند تلسکوپی در مقیاس رومن را به‌تنهایی بسازد. از مارس ۲۰۲۰ تا ژانویه ۲۰۲۵، تعداد کارکنان دولتی و پیمانکاران گادرد با کاهش تقریباً ۴۰ درصدی، از ۱۰هزار نفر به ۶هزار نفر رسید. هرچند مدیران بعداً ۶۰۰ نف ا نام «پیمان کادش» شناخته می‌شود، متن آن مستقیماً به نبرد کادش اشاره نمی‌کند. به همین دلیل، پژوهشگران گاهی آن را «پیمان صلح مصر و هیتی» یا «پیمان ابدی» نیز می‌نامند. این پیمان را قدیمی‌ترین توافق صلح مکتوب شناخته‌شده جهان می‌دانند؛ سندی که در آن دو"}, {"source": "Zoomit", "title": "ماوس «لامسه‌ای» لاجیتک با شارژدهی ۱۳۵ ساعتی رونمایی شد", "link": "https://www.zoomit.ir/accessories/467768-logitech-g-pro-x3-superstrike-gaming-mouse/", "summary": "لاجیتک از ماوس گیمینگ G Pro X3 Superstrike با شارژدهی ۱۳۵ ساعته و سنسور Hero 2 رونمایی کرد.", "date_str": "2026-09-23T16:30:09+00:00", "hash": "99575a2e30653ab8", "title_fa": "ماوس «لامسه‌ای» لاجیتک با شارژدهی ۱۳۵ ساعتی رونمایی شد", "summary_fa": "لاجیتک از ماوس گیمینگ G Pro X3 Superstrike با شارژدهی ۱۳۵ ساعته و سنسور Hero 2 رونمایی کرد. تبلیغات لاجیتک از جدیدترین ماوس گیمینگ خود با نام G Pro X3 Superstrike رونمایی کرد؛ محصولی که گرچه در ظاهر شبیه به نسل قبل به نظر می‌رسد، اما تغییرات داخلی آن می‌تواند تجربه‌ی کاربران حرفه‌ای را دستخوش تغییر کند. این ماوس قرار است از دو هفته‌ی دیگر در دو رنگ صورتی و مشکی عرضه شود. قیمت ماوس ۱۹۹٫۹۹ دلار است. لاجیتک تصمیم گرفته است X2 Superstrike را نیز با قیمت ۱۷۹٫۹۹ دلار در بازار نگه دارد؛ تصمیمی که به کاربران امکان می‌دهد تا فناوری جذاب کلیک‌های لامسه‌ای (هپتیک) را با هزینه‌ی کمتری تجربه کنند. نکته‌ی جالب توجه آن است که X2 به‌تازگی با تخفیف موقت به قیمت ۱۲۹٫۹۹ دلار فروخته شده بود و احتمال تکرار چنین تخفیف‌هایی پیش از تعطیلات پایان سال وجود دارد. ویژگی متمایزکننده‌ی خانواده‌ی Superstrike در مکانیزم کلیک آن‌ نهفته است. برخلاف سایر ماوس‌های گیمینگ که از سوییچ‌های مکانیکی استفاده می‌کنند، در این محصولات، محرک‌های لامسه‌ای (Haptic Actuators) زیر دو دکمه‌ی اصلی قرار گرفته‌اند. این طراحی نه‌تنها تأخیر را کاهش می‌دهد، بلکه به کاربر اجازه می‌دهد تا حس کلیک را به دلخواه خود تنظیم کند؛ از حالتی بسیار ظریف و ملایم گرفته تا حالتی تند و ضربه‌ای یا حتی خاموش کردن کامل بازخورد لامسه‌ای. لاجیتک در نسل سوم این ماوس، سه بهبود اصلی را در دستور کار قرار داده است: سنسور پاسخگوتر، عمر باتری بیشتر و توزیع وزن بهبودی
