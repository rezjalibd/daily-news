      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;

    .tabs::-webkit-scrollbar {
      display: none;
    }

      white-space: nowrap;

      border-radius: 12px;

      border: 1px solid var(--tab-border);
      color: var(--tab-text);

      gap: 16px;

      padding: 20px;

      transform: translateY(-2px);
    }

      border-color: var(--read-border);

    .news-card.is-read:hover {

      margin-bottom: 12px;

      font-size: 0.85rem;

      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-top: 2px;
      flex-shrink: 0;

      color: var(--success);

    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
      flex: 1;

    .news-summary {
      font-size: 0.94rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: justify;
      line-height: 1.75;
    }
    .news-footer {

      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
      padding-top: 12px;
      font-size: 0.85rem;

    .footer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;

    .news-source {
      color: var(--text-muted);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .news-datetime {

      font-size: 0.78rem;
      background: rgba(148, 163, 184, 0.08);
      padding: 2px 7px;
      border-radius: 6px;

      align-items: center;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;

    .news-category-badge:hover {

      color: #0f172a;
      transform: translateY(-1px);

    .footer-tags-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;

      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);

      border-radius: 5px;

      transition: all 0.2s ease;
      font-weight: 500;

    .news-tag-chip:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--badge-bg);
      transform: translateY(-1px);

    .footer-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-top: 1px dashed rgba(128, 128, 128, 0.12);
      padding-top: 10px;
      margin-top: 4px;

    .footer-actions-right {
      display: flex;
      align-items: center;
    }
    .footer-actions-left {
      display: flex;
      align-items: center;
      margin-right: auto;

      border: 1px solid var(--toggle-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: all 0.2s ease;

    .btn-mark-read:hover {
      border-color: var(--success);
      color: var(--success);

    .news-card.is-read .btn-mark-read {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .news-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .news-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.2s ease;

      from { transform: scale(0.95); opacity: 0; }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;

    .modal-title {

    .btn-close {
      background: transparent;
      border: none;

      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .btn-close:hover {
      color: var(--text);

    .modal-body {

      overflow-y: auto;
      display: flex;
      flex-direction: column;

      border: 1px solid var(--card-border);

      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .archive-item:hover {
      border-color: var(--primary);
      transform: translateX(-4px);
    }
    .archive-date-fa {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .archive-date-g {
      font-size: 0.8rem;
      color: var(--text-muted);

    }
    .archive-arrow {
      color: var(--primary);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header { padding: 18px 14px; padding-top: 56px; }

      .news-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .footer-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    }
  </style>
</head>

 اما همچنان شرکت‌ها را در برابر امنیت ضعیفی که به افشای اطلاعات مشتریان منجر می‌شود مسئول خواهیم دانست.» نفوذگران پیش از انتشار پیام عذرخواهی مدعی شده بودند به داده‌های هویتی و شماره‌های تامین اجتماعی تمامی دانشجویان و کارکنان دست یافته‌اند. با وجود اعلام پشیمانی هکرها، مسئولان دانشگاه نیومکزیکو به بیماران و پرسنل هشدار دادند که به هیچ پیامی برای دریافت وجه پاسخ ندهند. دانشگاه نیومکزیکو، در بیانیه‌ای رسمی، گفت: «به‌دنبال یک حادثه سایبری، عاملان ممکن است برای کلاهبرداری‌های بیشتر از جمله پیشنهادهای دروغین پرداخت پول یا غرامت تلاش کنند. به هیچ فردی که ادعای مسئولیت این حادثه را دارد پاسخ ندهید، روی پیوندها کلیک نکنید، پیوست‌ها را باز نکرده، فایلی بارگیری نکنید و اطلاعات شخصی یا مالی ارائه ندهید.»", "image_url": "https://api2.zoomit.ir/media/hacker-fake-call-68079c55e120c1cdc27631f4?w=1920&q=75", "category": "هوش مصنوعی مولد", "tags": ["امنیت سایبری"], "datetime_fa": "۹ آبان • ۱۷:۴۹"}, {"source": "Zoomit", "title": "گلکسی S24 سامسونگ حالا گوشی‌ ایمن‌تری است", "link": "https://www.zoomit.ir/mobile/470155-galaxy-s24-october-2026-update/", "summary": "سامسونگ به‌روزرسانی امنیتی جدیدی با حجم ۳۱۲٫۳۵ مگابایت برای رفع ۶۲ رخنه‌ی امنیتی سری گلکسی S24 منتشر کرد.", "date_str": "2026-10-31T14:00:00+00:00", "hash": "ff5272e98d7d4f3e", "title_fa": "گلکسی S24 سامسونگ حالا گوشی‌ ایمن‌تری است", "summary_fa": "سامسونگ به‌روزرسانی امنیتی جدیدی با حجم ۳۱۲٫۳۵ مگابایت برای رفع ۶۲ رخنه‌ی امنیتی سری گلکسی S24 منتشر کرد. تبلیغات سامسونگ انتشار به‌روزرسانی امنیتی جدیدی را برای پرچمداران سری گلکسی S24 آغاز کرد تا آسیب‌پذیری‌های نرم‌افزاری پیشین را برطرف کند. بسته‌ی نرم‌افزاری یادشده هم‌اکنون در دسترس کاربران قرار دارد و پچ امنیتی اکتبر ۲۰۲۶ (مهر و آبان) را به همراه می‌آورد. سامسونگ فرآیند انتشار جهانی را با کشور هند کلید زده است . این فریم‌ور که با شناسه‌ی S92xBXXSIEZJ1 شناخته می‌شود، حجمی ۳۱۲٫۳۵ مگابایتی دارد و به‌طور دقیق ۶۲ رخنه و باگ امنیتی نسخه‌های پیشین را اصلاح می‌کند. پرچمداران کره‌ای اوایل ماه جاری میلادی به نسخه‌ی پایدار One UI 9.0 ارتقا یافتند، هرچند آن نسخه حامل پچ ماه سپتامبر (شهریور و مهر) بود. اکنون با انتشار بیلد تازه، پرونده‌ی آسیب‌پذیری‌های گذشته بسته می‌شود و سایر مناطق جهان نیز طی روزهای آینده اعلان دریافت را مشاهده خواهند کرد. کاربران می‌توانند برای بررسی وضعیت انتشار فریمور جدید، بخش تنظیمات گوشی را باز کرده و با ورود به منوی به‌روزرسانی نرم‌افزار، فرایند بارگذاری را به‌صورت دستی آغاز نمایند. سامسونگ همچنین مراحل پایانی توسعه‌ی رابط کاربری One UI 9.5 را پشت سر می‌گذارد که سری گلکسی S24 نیز واجد شرایط دریافت آن خواهد بود. لایک نظرت چیه؟ ارسال نظر بوکمارک اشتراک‌گذاری امیر عبدالملکی دنبال کردن به محتوای این مطلب چه امتیازی میدی؟ نظر شما برامون مهمه و به بهتر شدن کیفیت مطالب کمک می‌کنه.", "image_url": "https://api2.zoomit.ir/media/one-ui-7-appdrawer-6773b2eace5247144c7a2a5b?w=1920&q=75", "category": "امنیت سایبری و شبکه", "tags": ["فناوری", "نوآوری"], "datetime_fa": "۹ آبان • ۱۷:۳۰"}, {"source": "Business Insider", "title": "A computer science grad taught me a lot about finding work in the AI era. Here's what it takes to get that first big job.", "link": "https://www.businessinsider.com/computer-science-graduate-job-ai-robots-hiring-kiran-maya-sheikh-2026-10", "summary": "Kiran Maya Sheikh graduating Kiran Maya Sheikh A version of this story originally appeared in the AI Insider newsletter. Sign up for Business Insider's weekly AI Insider newsletter here . I've got some happy news to share this week. It involves a young computer science graduate named Kiran Maya Sheikh , who has taught me a lot about grit, determination, and the realities of finding a job in the age of AI . Back in February, I wrote a newsletter arguing that people shouldn't panic about AI destroying tech jobs . Kiran, who had recently graduated from the University of California, Irvine, wasn't impressed. \"It's bad advice to 'not worry,'\" she emailed me. \"AI is causing disruption in this job market. Employers are prioritizing hiring experienced workers, but not new graduates.\" It was a humbling moment. We arranged an interview, and Kiran told me about the struggle to land her first full-time job. She'd studied computer science partly because it promised financial stability. Instead, she was competing against experienced engineers, other graduates, and potentially AI itself. \"It's a bloodbath,\" she told me. We've stayed in touch ever since. I've sent her articles, offered (unsolicited!) career advice, and occasionally shared my own professional struggles. She's kept me updated on the job hunt, her volunteer work, and the fellowships she pursued to gain experience. In June, she was still searching. But she was learning new skills, building websites, and meeting people. Then, last week, an email arrived. \"I have great news: I started my first full time job as a software engineer!\" she wrote. Kiran is now working for the Virginia Digital Service, the state's government technology modernization team. She's moved from Los Angeles to Richmond, Virginia, and is settling into her new life. Yessss! Nothing feels better than to share in other people's success, without doing any of the work. Are robots really scary? Seriously, though: Kiran's experience is worth remembering as we confront another frightening prediction about the future of work: Robots are coming for everyone's jobs. Business Insider recently launched Robonomics , a major reporting series examining how AI-powered robots could transform work, businesses, and the economy. One story, by my colleague Eugene Kim , takes us inside an enormous Amazon warehouse in Tracy, California . The facility is packed with robots that move shelves, sort packages, and transport carts. Jobs that once required people to walk ", "date_str": "2026-10-31T14:00:01+00:00", "hash": "007f883a29b7f738", "title_fa": "یک فارغ التحصیل علوم کامپیوتر به من چیزهای زیادی در مورد یافتن کار در عصر هوش مصنوعی آموخت. در اینجا چیزی است که برای به دست آوردن اولین کار بزرگ لازم است.", "summary_fa": "", "image_url": "https://i.insider.com/6ae4ffc2f3bee449b3d29d2d?width=1200&format=jpeg", "category": "هوش مصنوعی مول ks Ukraine is facing, where the massive number of threats can make it difficult for humans to keep up, and are looking to software for solutions. Concern that the speed and scale of future warfare could be too great for humans to handle without help is growing; however, Army officials have said artificial intelligence can help soldiers process large amounts of data from sensors and networks to deliver potential responses in a fight. At the Association of the United States Army convention in Washington, DC, last month, service leaders and soldiers spoke about using AI to process battlefield data and help troops make decisions without removing humans from the process. \"I think it's important to use super intelligence… for things that humans aren't necessarily good at, and that's speed and scale,\" Brig. Gen. Steven Carpenter, head of Multi-Domain Command Europe, told Business Insider, \"but I also know we shouldn't take humans completely out of the loop.\" Earlier this year, Carpenter told reporters that US forces in Europe needed to be prepared to process more than 1,500 potential targets a day while also defending against as many as 1,200 incoming missiles and drones. That volume of targets and threats could overwhelm human analysts, but AI could help them keep up. In a conflict, soldiers could use AI to analyze battlefield data and targets based on a commander's objectives and other parameters. The system could then assess available military capabilities and recommend responses, from conventional weapons strikes to electronic warfare or cyber operations. The entire process is intended to move quickly, but officials say speed isn't the only benefit. AI can also remember or recognize patterns that humans might forget or not even notice in the first place. And all of that information provides commanders with options. AI and autonomy are quickly being integrated across uncrewed systems, command and control processes, and o", "date_str": "2026-10-31T13:27:01+00:00", "hash": "9ee9ac4d630b07fb", "title_fa": "نیروهای ایالات متحده در اروپا برای \"بدترین روز اوکراین\" آماده می شوند. هوش مصنوعی می تواند به آنها کمک کند تا با سیل عظیم موشک ها و پهپادها مبارزه کنند.", "summary_fa": "مقامات آمریکایی بر این باورند که میدان‌های نبرد آینده می‌توانند مقادیر زیادی داده از حسگرها و شبکه‌ها تولید کنند و اپراتورهای انسانی را تحت تأثیر قرار دهند. استاد گروهبان جان هیلی/ فرماندهی چند دامنه - اروپا نیروهای ایالات متحده در اروپا ممکن است در درگیری آینده با هزاران هدف و تهدید روبرو شوند. مقامات می گویند هوش مصنوعی می تواند به سربازان کمک کند تا اهداف را سریعتر از انسان به تنهایی تجزیه و تحلیل کنند. هوش مصنوعی می‌تواند پاسخ‌ها را توصیه کند در حالی که تصمیم‌گیری نهایی را به سربازان واگذار می‌کند. سربازان ارتش ایالات متحده در اروپا برای نبرد در مقیاس بزرگ و نوع حملات موشکی و پهپادی که اوکراین با آن مواجه است، آماده می شوند، جایی که تعداد انبوه تهدیدها می تواند کار را برای انسان دشوار کند، و به دنبال نرم افزار برای راه حل هستند. نگرانی از این که سرعت و مقیاس جنگ آینده می تواند برای انسان ها بسیار بزرگ باشد که نمی توانند بدون کمک از عهده آن برآیند، در حال افزایش است. با این حال، مقامات ارتش گفته‌اند که هوش مصنوعی می‌تواند به سربازان کمک کند تا مقادیر زیادی از داده‌ها را از حسگرها و شبکه‌ها پردازش کنند تا پاسخ‌های بالقوه را در جنگ ارائه دهند. در کنوانسیون انجمن ارتش ایالات متحده در واشنگتن دی سی، ماه گذشته، رهبران خدمات و سربازان در مورد استفاده از هوش مصنوعی برای پردازش داده های میدان نبرد و کمک به نیروها در تصمیم گیری بدون حذف انسان از روند صحبت کردند. بریگ: «فکر می‌کنم استفاده از هوش فوق‌العاده مهم است... برای چیزهایی که انسان‌ها لزوماً در آن مهارت ندارند، و آن سرعت و مقیاس است.» ژنرال استیون کارپنتر، رئیس فرماندهی چند دامنه اروپا، به Business Insider گفت: «اما من همچنین می‌دانم که نباید انسان‌ها را به طور کامل از این حلقه خارج کنیم.» در", "image_url": "https://i.insider.com/6ae371fe9bdea7d1607d2c0e?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "امنیت سایبری"], "datetime_fa": "۹ آبان • ۱۶:۵۷"}, {"source": "Business Insider", "title": "Managing 64 vacation rentals taught me one thing: I don't belong in hospitality", "link": "https://www.businessinsider.com/property-manager-vacation-rentals-hospitality-burnout-2026-10", "summary": "Paul Burke built a 64-home rental portfolio from scratch in Colorado, and sold it in two years. Courtesy of Paul Burke Paul Burke used his business and tech background to build a vacation rental portfolio in Colorado. Burke exited after two years, saying that the hospitality industry took a toll on him. Burke later founded a company for vacation rental operators, drawing on the experience he gained. This as-told-to essay is based on a conversation with Paul Burke, 42, the CEO and cofounder of Vantory, an AI startup that streamlines vacation rental operations for property managers. He previously built a 64-home rental portfolio in Colorado and sold it in 2026 after two years. The following has been edited for length and clarity. If you'd asked me two years ago if I'd ever be running a property management company, I probably would've told you you're crazy. One of my sisters lives in Winter Park, Colorado . She's a real estate agent, and I was visiting her and met her boss, who owns the brokerage. He invited me into his office that weekend, and he gave me this whole pitch on Winter Park and how billions of dollars are being invested in it, and there's all this opportunity. I thought he was trying to sell me a house, and he was like, \"We've got this brokerage, but we've wanted a property management company for five years, but we haven't found the right partner to build it with. We think you're that guy.\" Those opportunities don't just fall into your lap. I'd sold my previous tech company and was trying to figure out what was next, so I jumped at it. A jacuzzi at one of Burke s properties. Courtesy of Paul Burke Winter Park is not like Aspen. It was known for a very long time as the economical ski resort. People who were getting priced out or sick of the insane prices of the Vails and the Aspens were starting to come to Winter Park. You could get the same thing or something nicer for a third of the price. But it was not very easy to convince people to move from existing property management companies to some brand new one with a guy who had no experience. So I had to take them all for lunch, look them in the eye, shake their hands, and say, \"I will do everything it takes to take care of your property, the best it can possibly be taken care of, and have it generate as much money as possible.\" We got a handful of clients, and then once we had a handful, it was really just about execution. It's always been my approach to business: get a small handful of customers, ", "date_str": "2026-10-31T13:20:01+00:00", "hash": "a562ca79a4bd0bfa", "title_fa": "مدیریت 64 کرایه تعطیلات یک چیز به من آموخت: من به مهمان نوازی تعلق ندارم", "summary_fa": "پل برک یک نمونه کار 64 خانه اجاره ای از ابتدا در کلرادو ساخت و آن را در دو سال فروخت. با حسن نیت از پل برک پل برک از پیشینه کسب و کار و فناوری خود برای ساختن نمونه کارها برای اجاره تعطیلات در کلرادو استفاده کرد. بورک پس از دو سال از آن خارج شد و گفت که صنعت مهمان‌نوازی به او آسیب وارد کرده است. برک بعداً شرکتی را برای اپراتورهای اجاره تعطیلات تأسیس کرد و از تجربیاتی که به دست آورد استفاده کرد. این مقاله همانطور که گفته شد بر اساس گفتگو با پل برک، 42 ساله، مدیر عامل و بنیانگذار Vantory، یک استارت آپ هوش مصنوعی است که عملیات اجاره تعطیلات را برای مدیران املاک ساده می کند. او قبلاً یک نمونه کار 64 خانه اجاره ای در کلرادو ساخته بود و پس از دو سال در سال 2026 آن را فروخت. موارد زیر برای طول و وضوح ویرایش شده است. اگر دو سال پیش از من می پرسیدید که آیا هرگز یک شرکت مدیریت املاک را اداره می کنم، احتمالاً به شما می گفتم که دیوانه هستید. یکی از خواهران من در وینتر پارک، کلرادو زندگی می کند. او یک مشاور املاک و مستغلات است و من داشتم به او می‌رفتم و با رئیسش که صاحب کارگزاری است ملاقات کردم. او من را در آخر هفته به دفترش دعوت کرد و تمام این زمین پارک زمستانی را به من داد و اینکه چگونه میلیاردها دلار روی آن سرمایه گذاری می شود، و این همه فرصت وجود دارد. فکر می‌کردم می‌خواهد خانه‌ای به من بفروشد، و او می‌گوید: \"ما این کارگزاری را داریم، اما پنج سال است که یک شرکت مدیریت املاک می‌خواهیم، ​​اما شریک مناسبی برای ساختن آن پیدا نکرده‌ایم. ما فکر می‌کنیم شما آن مرد هستید.\" این فرصت‌ها فقط در دامان شما نمی‌افتند.", "image_url": "https://i.insider.com/6ae22fb6e793e12971426502?width=1200&format=jpeg", "category": "هوش مصنوعی مولد", "tags": ["هوش مصنوعی", "عامل‌های هوشمند"], "datetime_fa": "۹ آبان • ۱۶:۵۰"}],
      media: [{"source": "Deadline", "title": "Emmy-Winning Comedian Alex Edelman Says Loss Of Kennedy Center Is No Joke", "link": "https://deadline.com/2026/10/alex-edelman-kennedy-center-1237210602/", "summary": "Alex Edelman, the comedian and actor who won an Emmy for his 2024 HBO/Max special Just For Us and a special Tony for the original Broadway staging, laments what is effectively the loss to comics of a newly politicized Kennedy Center. For me and the performers I know, it doesn’t make sense to play the [ ]", "date_str": "2026-10-31T14:03:25+00:00", "hash": "4fd694f03d3bd70c", "title_fa": "الکس ادلمن کمدین برنده جایزه امی می گوید از دست دادن مرکز کندی شوخی نیست", "summary_fa": "الکس ادلمن، کمدین و بازیگری که برنده جایزه امی برای ویژه برنامه HBO/Max 2024 Just For Us و تونی ویژه برای صحنه‌سازی اصلی برادوی شد، از آنچه که عملاً از دست دادن کمیک‌های یک مرکز کندی تازه سیاسی شده است ابراز تاسف می‌کند. برای من و اجراکنندگانی که می‌شناسم، بازی در نقش [] الکس ادلمن، کمدین و بازیگری که برنده جایزه امی برای ویژه HBO/Max 2024 Just For Us و تونی ویژه برای صحنه‌سازی اصلی برادوی شد، معنی ندارد، در واقع از آنچه در کمیک‌های یک مرکز کندی به تازگی سیاسی شده است، ابراز تاسف می‌کند. با علاقه به یادآوری اجرای سال 2024 او در نمایش تک نفره‌اش درست مثل ما در تئاتر آیزنهاور در مرکز کندی، پدر و مادرم از بوستون آمدند زیرا ادلمن می‌نویسد، شاید این آخرین باری بود که در آنجا اجرا می‌کردم. در ددلاین تماشا کنید همانطور که تد جانسون از ددلاین در اوایل این ماه خاطرنشان کرد، شکست‌های ناشی از تصاحب موسسه هنری توسط دونالد ترامپ، رئیس‌جمهور آمریکا در سال 2025 ادامه دارد. یکی از آخرین تحولات، خبر این ماه بود که The Kennedy Center Honors برای اولین بار در تاریخ خود به مکان جدیدی نقل مکان می کند: در 7 دسامبر، مراسم در Capital One Arena در واشنگتن دی سی برگزار می شود. ددلاین نوشت: از زمانی که ترامپ مرکز را به دست گرفت و اعضای هیئت مدیره منصوب شده توسط اسلاف خود را برکنار کرد، این مرکز شاهد کاهش فروش بلیط بوده است، در حالی که هنرمندان فروش بلیت را متوقف کردند. واشنگتن پست و سی ان ان اخیراً به بررسی وضعیت وخیم مالی مرکز کندی پرداخته اند. نمایش‌های بزرگ در ماه جولای به پایان رسید، یعنی زمانی که ترامپ و مرکز برای تعطیلی بلندمدت برای بازسازی برنامه‌ریزی کردند.", "image_url": "https://deadline.com/wp-content/uploads/2024/09/alex-edelman-emmys.jpg?w=1024", "category": "سینما و سریال", "tags": ["رسانه", "هنر"], "datetime_fa": "۹ آبان • ۱۷:۳۳"}, {"source": "Rolling Stone", "title": "How Do You Remake a Horror Classic? Ask Mike Flanagan", "link": "https://www.rollingstone.com/tv-movies/tv-movie-features/mike-flanagan-interview-carrie-horror-exorcist-1235646165/", "summary": "The man behind Amazon's bold new 'Carrie' limited series — and an upcoming 'Exorcist' movie — talks Stephen King, horror, and running with the devil", "date_str": "2026-10-31T14:26:00+00:00", "hash": "f51c980f5fba82fb", "title_fa": "چگونه یک کلاسیک ترسناک را بازسازی می کنید؟ از مایک فلانگان بپرس", "summary_fa": "مرد پشت سری محدود جدید جسورانه «کری» آمازون - و فیلمی «جن گیر» آینده - با استفن کینگ، ترسناک و دویدن با شیطان صحبت می کند. این یکی از نمادین ترین تصاویر فیلم ترسناک 50 سال گذشته است: سیسی اسپیسک در لباس مجلسی غرق در خون، چشمانش از تله گریه اش در حال هولناک شدن است. شکنجه گران دبیرستانی او به کری اشاره کنید، اقتباسی از رمانی که در سال 1976 شروع به کار ادبی استیون کینگ کرد، و این ناگزیر اولین چیزی است که به ذهن شما خطور می کند. این فیلم کمک کرد تا کینگ به یک نام آشنا تبدیل شود، برایان دی پالما از یک علاقه‌مند به هیچکاک به یک بازیکن هالیوود تبدیل شد و اسپیسک را به یک ستاره تبدیل کرد. قابل تقلید است، به این معنی که قرار است بی‌پایان تقلید شود، تقلید شود، ارجاع داده شود، با تأخیر (و ضعیف) دنباله‌سازی شود، و نه یک، بلکه دو بازسازی نسل بعدی انجام شود. مایک فلانگان، نویسنده، کارگردان و استیون کینگ متعصب در سطح جهانی، اولین کسی است که به شما می گوید که هم کتاب و هم فیلم متون مقدسی هستند. به همین دلیل است که وقتی آمازون به سراغ فیلمساز دکتر اسلیپ رفت و با این ایده که سریالی محدود بر اساس داستان زن جوانی را بسازد که شب پارگی را به حمام خون تبدیل می کند، گفت: ارباب عزیز، نه! تا اینکه گفت، خب، در واقع. کری https://rezjalibd.github.io/daily-news/archive/2026-09-10.html"}, {"date_key": "2026-09-09", "p_date": "۱۸ شهریور ۱۴۰۵", "g_date": "۹ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-09.html"}, {"date_key": "2026-09-07", "p_date": "۱۶ شهریور ۱۴۰۵", "g_date": "۷ سپتامبر ۲۰۲۶", "url": "https://rezjalibd.github.io/daily-news/archive/2026-09-07.html"}];

    let currentTab = 'persian';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('read_articles_registry') || '[]'));

    function toFaDigits(n) {
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/\d/g, d => f[d]);
    }

    function toggleRead(hash) {
      if (readArticles.has(hash)) {
        readArticles.delete(hash);
      } else {
        readArticles.add(hash);
      }
      localStorage.setItem('read_articles_registry', JSON.stringify(Array.from(readArticles)));
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('newsContainer');
      const rawItems = data[currentTab] || [];
      
      const filtered = rawItems.filter(item => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const title = (item.title_fa || item.title || '').toLowerCase();
        const summary = (item.summary_fa || item.summary || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        return title.includes(q) || summary.includes(q) || source.includes(q) || category.includes(q) || tags.includes(q);
      });

      const unreadList = [];
      const readList = [];

      filtered.forEach(item => {
        if (readArticles.has(item.hash)) {
          readList.push(item);
        } else {
          unreadList.push(item);
        }
      });

      const sortedItems = [...unreadList, ...readList];

      if (sortedItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">هیچ خبری در این بخش در ۲۴ ساعت گذشته ثبت نشده است.</div>';
        return;
      }

      container.innerHTML = sortedItems.map((item, idx) => {
        const title = item.title_fa || item.title || '';
        const summary = item.summary_fa || item.summary || '';
        const source = item.source || 'منبع خبر';
        const link = item.link || '#';
        const isRead = readArticles.has(item.hash);
        const num = toFaDigits(idx + 1);
        const category = item.category || '';
        const tags = item.tags || [];
        const datetimeFa = item.datetime_fa || '';

        return `
          <article class="news-card ${isRead ? 'is-read' : ''}" id="card-${item.hash}">
            <div class="news-header">
              <span class="news-num">${isRead ? '✓' : num}</span>
              <h2 class="news-title">${title}</h2>
            </div>
            ${summary ? `<p class="news-summary">${summary}</p>` : ''}
            <div class="news-footer">
              <div class="footer-top-row">
                <div class="meta-group">
                  <span class="news-source">📌 ${source}</span>
                  ${datetimeFa ? `<span class="news-datetime">🕒 ${datetimeFa}</span>` : ''}
                  ${category ? `<span class="news-category-badge" onclick="filterByTag('${category}')">📂 ${category}</span>` : ''}
                </div>
              </div>
              ${tags && tags.length > 0 ? `
                <div class="footer-tags-row">
                  ${tags.map(t => `<span class="news-tag-chip" onclick="filterByTag('${t}')">#${t}</span>`).join('')}
                </div>
              ` : ''}
              <div class="footer-bottom-row">
                <div class="footer-actions-right">
                  <button class="btn-mark-read" onclick="toggleRead('${item.hash}')">
                    ${isRead ? '✓ خوانده شد' : '○ علامت خوانده‌شده'}
                  </button>
                </div>
                <div class="footer-actions-left">
                  ${link && link.startsWith('http') ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="news-link">مطالعه اصل خبر ↗</a>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByTag(val) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = val;
        searchQuery = val;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      renderNews();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'حالت روشن';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'حالت تاریک';
      }
    }

    function toggleArchiveModal(show) {
      const modal = document.getElementById('archiveModal');
      if (show) {
        renderArchiveList();
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function renderArchiveList() {
      const listContainer = document.getElementById('archiveListContainer');
      if (!archiveManifest || archiveManifest.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">هنوز شماره قبلی ثبت نشده است.</div>';
        return;
      }

      listContainer.innerHTML = archiveManifest.map(item => `
        <a href="${item.url}" class="archive-item">
          <div>
            <div class="archive-date-fa">📰 شماره ${item.p_date}</div>
            <div class="archive-date-g">🌍 ${item.g_date}</div>
          </div>
          <span class="archive-arrow">←</span>
        </a>
      `).join('');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderNews();
    });

    renderNews();
  </script>
